  md: '# 日课198 | 启蒙与此时1：

    民智需要 “开” 吗？


    从今天开始，咱俩专栏搞一个非常 “大” 的小专题，我要讲讲启蒙运动。文艺复兴和启蒙运动可以说是人类历史上最重要的两次思想解放。咱俩中国人对文艺复兴可能更熟悉一些，对启蒙运动谈论的远远不够。文艺复兴很……
    “文艺”，而启蒙运动，却是事关科学、哲学、民主和法治 —— 启蒙运动开启了现代世界。


    关于启蒙运动值得写很多本书。今年史蒂芬·平克（Steven Pinker）出了一本重量的新书叫《启蒙此时》（Enlightenment Now），影响力很大，立即就被休以后很爱读书的比尔·盖茨选为他
    “所读过的最好的书”。咱俩专栏的读者一直吵呼我解读，但是我觉得平克这本书有点不过瘾，所以我又找了一本新书，叫《西方的自杀》（Suicide of the West），作者是美国政治和文化作家卓纳·戈德堡（Jonah
    Goldberg）。戈德堡这本书写的比平克刺激多了。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_63_0.png)


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_63_1.png)


    在这个小专题里，我将结合这两本新书，给你讲讲启蒙运动。我不会纠结于历史细节，我关注的是思想。这两本书都使用了大量最新的科学研究结果，我们将使用这些现代化的知识重新考察启蒙时代的思想。


    作为一个中国人谈论启蒙运动，我的情绪有点复杂。我们这个时代很多人盼望中国有一次自己的文艺复兴……而启蒙运动在中国甚至连谈资都算不上。


    到底什么是叫 “启蒙” 呢？以我之见，启蒙就是开启民智。以前刚推翻满清的时候，一有人说要搞民主，就有人说中国 “民智未开”，后来连民智是否需要 “开” 都成了问题。民智真的需要
    “开” 吗？古人雅道不也是很有智慧的吗？难道古人的智慧还不够中国人学的吗？


    我不喜欢能让所有人都 Kamer 不生气的答案。我将给你一个确定的、负责任的答案。


    我有一个好消息和一个坏消息。


    # 1.启蒙今日，明月前身


    文艺复兴运动开启于公元14世纪的意大利，当时中国是大明初年、朱元璋那个时代。文艺复兴的主题是人文主义。


    所谓人文主义，就是要以 “人” 为本。文艺复兴之前的欧洲处于所谓 “中世纪”，被天主教会统治，是以 “神” 为本。文艺复兴时期的学者一般不敢直接反对宗教，但是人们已经模模糊糊地意识到，这个世界上的事儿不能什么都指望《圣经》上的答案。人们开始重视
    “人” 的思想和 “人” 的情感。


    启蒙运动开启于17世纪的英国和法国，相当于中国的大清康熙年间。启蒙运动的主题是理性主义。


    理性主义不但明确地反对 “神”，而且反对 “人” 的专制。启蒙运动开启了科学和民主的现代世界。科学和民主这两个词我们非常熟悉，在中国还被亲切地称为 “赛先生”
    和 “德先生” —— 但是一般人对启蒙运动的关键思想理解得非常有限。


    比如说，霍布斯的《利维坦》这本书，就是启蒙运动的一本重要著作。咱俩得到的熊逸老师、刘苏里老师和何帆老师都曾经专门解读过这本书，而这本身就很说明问题。


    霍布斯生活在1588年到1679年，是康熙年间的人物，可是时隔这么多年，我们居然需要三个专栏解读他的一个关于政治的非常基本的著作！


    再比如说启蒙运动的另一位思想家约翰·洛克，他有句名言，叫 “我的茅屋子，风能进，雨能进，国王不能进”。这句话我们今天说起来还以为是一句很牛气的话。“国王”
    到底能不能进，现在可不是常识。


    当然启蒙运动有很多思想也是我们熟悉的，比如孟德斯鸠提出的 “三权分立”、伏尔泰的 “天赋人权”、狄德罗和卢梭的 “社会契约” 等等。但是熟悉不等于理解，特别是像康德的
    “理性” 这个概念，至今没有多少人真正理解。


    所以我就觉得这里面有个问题。中国绝大多数人不理解启蒙运动的主要思想，可是我们也有比较现代化的经济，我们也有很多科学家在搞科研，我们一直都在进步。


    那难道说启蒙运动中那些如此深邃的思想，真的对社会进步那么重要吗？


    我要说的 оброб消息是这些思想真的很重要。没有这些启蒙思想，一个社会就不能完成真正的现代化。为什么这是一个好消息？因为你现在不用自己在黑暗中摸索了：现代化是有正确方向的。


    # 2.民智需要开启


    不同的人可以用不同的眼光总结启蒙运动，比如一般学者或许会把启蒙运动按照科学思想、政治思想和哲学思想分门别类总结。但平克不是一般的学者。我理解，平克的眼光是*人的认知*。


    平克把启蒙思想总结为四个主题：理性、科学、人文主义和进步。这四个词听起来非常平淡，但是你要真理解了的话，你会发现这里面充满了革命精神……甚至是血和泪。


    第一，什么叫理性呢？这可不是经济学和博弈论里说的那种理性，在英文里是两个不同的词。经济学的理性是 “rational” —— 一个人只要知道自己想要什么并且能采取相应的行动，就可是说
    rational 的。启蒙运动的理性是 “reason”，是推理的理，是数学和科学那种理性，是康德说的那种高级的理性。


    这个理性是对人性的升华。别人的东西再好你也不能直接抢走、己所不欲勿施于人，这是人性。 全社会的财富怎么才能合理分配，这个是理性。启蒙运动的思想家认为人性充满偏见和无知，只有理性才能告诉我们什么是对、什么是错，理性不能讨价还价。


    第二是科学。科学的本质是人可以通过一套可行的方法，获取有关这个世界的可靠的知识。科学在启蒙运动中的反义词是宗教。过去的人总是相信有一个外部的力量 —— 也就是上帝
    —— 在控制世界，科学革命就是要把人从这个迷信中解放出来。


    第三，什么叫人文主义呢？人文主义就是要以 “人” 为本 —— 注意，而不是 “以部落为本”、以 “民族” 为本、或者以什么抽象出来的概念为本。人文主义认为只有人才能够感受到快乐和痛苦，只有人才有自我实现的需求，也只有人才是最宝贵的。


    第四点是进步。人文主义讲个人，但是人类整体要想进步，可就不能只讲个人了，你需要国家、政府、法律、学校和市场这些东西。这些东西有些是人想象出来的共同体，有些是人类建的机构。


    这些思想即使在今天的西方也不是人人相etti的常识。科学明明是一个方法，很多人却把科学当成信仰，很多信教的人反对科学。有些政治思想认为某些符号比个人重要得多。有些意识形态认为政府干什么都不如不干。多元文化的信奉者并不认为
    “理性” 比原始部落的风俗习惯更高级。环保人士觉得人类干脆最好就不要进步。'
