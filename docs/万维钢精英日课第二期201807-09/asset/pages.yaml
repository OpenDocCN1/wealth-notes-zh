  md: '# 日课179 | 目的论的幽灵


    日课179 | 目的论的幽灵


    “天将降大任于斯人也，必先苦其心志，劳其筋骨，饿其体肤，空乏其身，行拂乱其所为，所以动心忍性，曾益其所不能。”这句孟子的名言不知被多少人挂在墙上、记在心中，在每一个逆境和困难中鼓励自己。可你要ataires真，这句话有个问题。


    “生于忧患死于安乐”的道理我们都懂。但孟子的字面意思，是说你经历的所有逆境和困难，都是因为老天想要磨练你，想要把你打造成一个更强的人，而故意安排的。这些事情不是无缘无故发生的，它们就好像是游戏里的关卡一样是为你精心设计的……这不就等于是说“一切都是最好的安排”吗？


    当然大多数现代人不至于做这种字面上的理解，但我想说的是，这里有个根深蒂固的思维偏误。


    我们在生活中肯定会遭遇各种逆境和困难，有些是因为你的性格缺陷，有些是因为你的决策错误，有些是因为你的理想目标和现实情况差距太大，有些纯粹是出于偶然。如果有个说我就不学习，就不“动心忍性”，他还是会经历这些逆境，而且只会更多——老天似乎并不会因为这个人没有培养前途就放过他。


    那老天安排这些事到底是什么目的？


    上周我们讲了，在没有意义的地方非要发掘一个什么意义，是“广义迷信”。今天我们说说其中一种特殊情况，叫做“目的论”。目的论认为每件事物不但都有意义，而且还是有目的的，是为了完成一个使命而存在。


    目的论的英文是“teleology”，在哲学上是个大题目，最早形成理论的可能是亚里士多德。


    有些东西确实是有目的的。汽车是为了运输用的，瓶子是为了装水，茶杯上有一个杯柄儿是为了防止水太热烫手。人设计制造这些东西的时候，就赋予了它们目的。


    但是你要说自然界的东西有目的，可就有问题了。


    比如说，“眼睛是用来看东西的”，这句话对吗？


    严格地说，这句话是错的。眼睛跟茶杯上的杯柄儿有本质区别，它不是人设计出来的，它是生物演化的结果。当原始地球生物演化出来第一个能感光的细胞的时候，它可不是为了“看见”而出现的——它是随机变异出现的，只不过出现以后恰好有感光的功能，然后是自然选择使得这个功能发展壮大。


    眼睛可以用来看东西，但是眼睛不是以看东西为目的而存在的。当然你要非说眼睛是看东西的，心脏是推动血液流动的……生物学家一般不至于跟你较劲。


    再进一步。一个孩子说，“太阳每天升起，是为了给人们照亮”，这句话你就知道肯定不对。太阳的存在并不是为了为人民服务，没有生命的行星上也能看到太阳每天升起。


    而科学家做了大量的测试，发现小孩的认知，在很大程度上就是基于目的论的。为什么那有一个山？为了让人爬山。


    以前人们怀疑这是不是西方文化的特性，我最近看到一个2017年发表的研究 [1]，发现中国的孩子在小学一年级二年级的时候，也有很强烈的目的论思维。


    研究者把目的论分成两种。一种目的是“内在”的，比如“人有心脏是为了给身体输送血液”，属于虽然不对但是勉强可以接受的说法。内在的目的论大人小孩都有。另一种是“外在”的目的论，也可说是社会性的目的。比如说，植物为什么要制造氧气？如果一个人回答说植物制造氧气是为了让动物呼吸，这就是一个典型的外在目的论。成年人一般能轻易避免这样的目的论，但是小孩没有这个分辨能力。


    从儿童期就有，看来目的论是一种本能思维，需要缓慢用理性克服。而在人类文明的“儿童期”——比如亚里士多德那个时代，人们没有怀疑目的论的意思，而且亚里士多德还把目的论发展成了精致的理论。石头为什么会从高处往下掉？亚里士多德说因为石头想要靠近大地！


    科学思维跟目的论思维的本质区别，就是科学思维认为各种运动是机械化的过程，并不需要目的。石头没有想法。石头往地上掉，这是一个自然规律，世界就是这么运行的。物理学家用非常简单的几条定律就能推导出各种物体的运行方式，根本不需要让每个物体有自己的目的。


    但是目的论就好像一个幽灵一样，仍然存在于我们的内心深处。


    丹尼尔·丹内特在《直觉系》这本书中提到，用目的论的眼光去观察世界，会非常省事。比如你在路上开车，靠右侧通行，你看见马路对面开来一辆车，你就完全不用担心这辆车会和你相撞。因为你知道对面开车的那个人有强烈的动机也想活着，他的行为不会是乱无章的，他有明确的目的。


    其实我以前的确是从不担心，但我读了丹内特这本书之后，每次在小路上和别的车相向行驶，就会想起他这段话……感到一点点担心。


    但丹内特说的没错，目的论和因果关系一样，是思维快捷方式。为什么小孩总是用目的论的思维？咱 们以前讲高普尼克的《园丁与木匠》这本书的时候就提到过，六岁以前的小孩最需要学习的知识，就是周围人的动机是什么，周围这些东西都是干什么用的。


    但是每个思维快捷方式都可能犯错。特别是如果你把目的论用于“事情”，你很容易犯孟子式的错误。


    比如你有一次出差坐飞机，邻座是一位漂亮的异性，你们聊天聊得很好，后来就交往而且结婚了。那你可能就会想，那天怎么会这么巧，我们两个人的座位正好在一起？我们的结合难道是天意吗？


    事实是任何男女结婚之前总要相遇。我们用计算机模拟一个世界，其中不安排任何天意，所以陌生人的相遇都是随机的——那你说这个世界上，会不会发生一男一女因为座位靠在一起而产生感情？肯定还会发生。


    “天意”这个说法似乎上不了大雅之堂，但是很多现代人，信奉一个等效于天意的目的是论——“天下大势”。


    这些人认为，凡是历史上发生的，特别是大事件，都是天下大势注定它要发生的。


    比如说，满清取代明朝，人们会用各种学说论证为什么这件事情会发生，就好像满清入关是历史的选择，中国进入清朝是大势所趋。


    满清统治中国难道是符合天下大势的吗？当时世界各国进入大航海时代，贸易交流越来越频繁，科技和哲学都在进步，而满清闭关锁国、禁锢思想，这怎么符合天下大势呢？


    而你如果说历史上的很多重大转折其实都是偶然的，人们就很难接受。但事实很可能就是如此！明朝之所以灭亡，可能很大程度上是因为正好赶上了气候变化，小冰河时期导致北方农作物大幅度减产，把明朝财政拖垮了。在一个气候良好的平行宇宙里可能中国早就进入了近现代时代。


    这可能是一个很不容易接受的思想，但理性的分析只能是这个结论——


    这个世界上有些事情发生就发生了，是因为机械化的运转，或者因为偶然因素的左右，它没有意义也没有目的，既不是为了成全你也不是为了跟你作对。


    # 参考文献


    [1] A. Schachner et al., Is the bias for function-based explanations culturally
    universal? Children from China endorse teleological explanations of natural phenomena,
    Journal of Experimental Child Psychology Volume 157, May 2017.


