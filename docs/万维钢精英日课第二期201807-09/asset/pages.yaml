  md: '# 日课212 | 最需要的人没有，最有的人不需要


    日课212 | 最需要的人没有，...


    我最近总结了一点人生的经验，也许会对你有所帮助。咱们先从一个最新的研究说起。


    现在很多公司会给员工提供健身的福利。比如说，在医院的体检之外，公司会组织员工参加一年一度的体检，看看你是不是超重了，血糖含量高不高之类。公司会请专家根据你的各项体检指标给你提供健康方面的建议。为了怕你不来，参加的员工还有奖励。有些公司还会给员工买健身俱乐部的会员，有条件的公司还会在办公场所搞一些健身设备。


    搞这些活动当然是真心为了员工好，但公司也有利益方面的考虑。如果员工更健康，公司的医保支出会下降，员工也不至于总请病假，工作效率也会提高。把钱花在健身身上，总比花在治病上划算得多。


    好是好。但咱们《精英日课》的读者都知道，有时你想的挺好的项目，可不一定真有用。比如我们专栏以前有一期叫《体育真能锻炼品格吗？》，就说明中学生体 育对品格几乎没有什么正面影响。


    你猜对了，现在一个2018年的最新研究[1]表明，公司给员工提供健身福利，也没啥用。


    这是有史以来第一次有人对公司提供的健身福利项目做随机实验。伊利诺伊大学的研究者从大学里找到了12000个雇员，其中5000人愿意作为受试者参加健身研究。这5000人中的三分之二作为实验组，要体检，要参加问卷调查，而且获得了研究者提供的健身机会。剩下的三分之一作为控制组，什么都不用做。


    实验进行了两个学期。那么这一年下来，有幸入选健身项目的这些员工，是否取得了什么效果呢？答案是没有任何可见的效果。他们的患病率、请病假率、离职率，乃至于升职加薪的比率都跟控制组几乎一样。如果公司给员工提供健身福利的目的是为了经济利益，那么这个研究明确告诉你，那个经济利益是不存在的。


    实验组的员工虽然有更好的健身条件，但是总体来说并没有养成更好的健身习惯。唯一能看出来的区别，是他们*主观上*，认为自己对工作的幸福感和满意度提高了。这听起来也不错，但是考虑到离职率没有变化，这个主观的情绪显然并没有切实增加员工的忠诚度。


    所以给员工买健身福利确实没啥用。但我想告诉你的不是这个，而是为什么没用。'
