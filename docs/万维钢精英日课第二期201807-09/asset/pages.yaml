  md: '# 特别放送 | 到底什么是“创造力”


    万维钢


    这是一期关于“创造力”的专题。到底什么是创造力？它和先天基因、思维方式、社交环境、团队精神……都有关系吗？关系有多大？它能通过刻意练习提高吗？怎么才能激发创造力吧？……这是一个鼓励创新的时代，成为一个不被机器替代的人，“创造力”话题，值得我们一起关注和研究。仍然希望你通过看文章的方式复习今天的日课，创造力要提高，专注力也必不可少。祝你每天都有收获。


    # 创造力的来源


    我们每时每刻都在想事情，想停都停不下来，那什么叫“不集中注意力”呢？这就引出一个重要概念，叫做“默认模式网络（default mode network）”。


    如果查看一下你的电脑的运行情况，你会发现，只要不是正在做个什么特别大的计算，电脑的 CPU 并不是满负荷运转——可能90%以上的计算能力都处在闲置状态。


    这个闲置状态的概念，也可以类比于人脑。让你算一道题，做一件需要集中注意力的事情，你会感到有点累，这就是大脑处在某种任务状态。如果当前没有任何任务，什么事情都不用做，就可以认为大脑处在闲置状态——这就是“默认模式网络”。


    但是人的大脑毕竟跟 CPU 不同，大脑的确是一刻都不停息。就算是在没有任何特定任务，我们也在胡思乱想，比如回顾一下过去，畅想一下未来，今天晚上吃什么，明天玩什么等等。所以就算是在这个默认模式网络，大脑也要消耗全身20%的能量。而对比之下，做一项任务，我们只多消耗5%的能量。


    据说，我们的大脑每天平均有46.9%的时间都是处于默认模式网络。


    现在有些汽车，即使是停车熄火的状态，有时候也会发出一些细微的声音，据说是车上的计算机正在对各个部件进行检测。人脑更是这样。现在科学家对默认模式网络有了很多了解。在这个状态中，大脑会重新发掘过去的记忆，在过去和未来之间畅想，而且把不同的想法连接起来。


    这种遥远的连接，就是我们以前说过的“发散思维”，这是创造力的来源！所以默认模式网络对人非常重要。而且还不仅仅是创造力，默认模式网络还能让我们获得更强的自我意识，提升自己的“重要感”，同时你还能更好地理解别人，有利于跟人合作。


    # 不确定性有利于创造力


    2014年，伦敦地铁工人爆发了一次大罢工，导致全城270个地铁站关闭了171个，上班族不得不 ANN用各种办法找新的路线上班。伦敦市有一种电子乘车卡，用这个卡可以乘坐所有的公交设施。这样平时乘坐地铁上班的，现在可能就要拿这个卡转公共汽车上班。而这些卡用过哪些车辆，系统全都记录在案——这就给经济学家带来一个绝好的研究机会。


    经济学家一看电子乘车卡的数据，知道罢工那天，大部分乘客都使用了跟平时不一样的乘车路线上班。


    但有意思的是，罢工结束之后，并不是所有人都回到了原有的上班路线上去。大约有5%的乘客，从此继续留在了罢工那天新发现的这个路线上！


    换句话说，因为这次罢工的震动，反而给了这些人一个发现更好路线的机会。


    《混乱》的作者哈福德把这种震动叫做“任意的震动”（arbitrary shock）——没有精心布局，没有特定方向，就这么随机地、简单粗暴地给你震动一下。这对你就可能是一个非常好的创新机会。


    从事创造性工作的人，经常会面临去无可去的局面。作家写小说写到一处不知道怎么往下写了，科学家搞科研遇到难题不知道怎么解决，这就需要任意的震动的时刻。科幻小说作家阿西莫夫遇到写不下去的时候，就一个人跑到电影院看电影，常常看完电影就获得一个新的灵感。


    所以分心也好，任意的震动也好，其实就是给创造过程来一点不确定性。而真正的创新者，不但不怕不确定性，还要时刻欢迎，甚至主动增加一点不确定性。


    # 创造力是一种状态


    创造力并不神秘——首先你要再头脑中储备大量的相关知识，然后在某一时刻，你建立一个遥远的连接——把表面看起来没有关系的两个东西连到一起，问题可能就解决了。你“啊哈！”一声，这就是所谓的“尤里卡时刻”。


    问题在于，尤里卡时刻似乎总是循不经意地出现，经常都是大脑比较放松的时候，比如说散步或者是半睡半醒的时候。这使得创造力有点可遇不可求。所以现在有个说法，创造力不是一个“技能”，而是一个头脑“状态”。


    人的大脑有“β波”、“α波”和“θ波”，而当你进入尤里卡时刻的时候，大脑会有一种更高级的波，叫“γ波”。咱们把这四种脑波掐一遍——


    +   * “β波”：对应前额叶皮层主导的理性思维，保持机警；

    * “α波”：对应白日梦，更平静的大脑活动；

    * “θ波”：对应排除外界干扰的深入思考；

    * “γ波”：对应创造性思维的尤里卡时刻。


    想要“出神”，达到心流状态，我们要的是后面这三种波，为此就得设法在一定程度上关闭前额叶皮层的活动——也就是关闭冷认知，让热认知主导。


    # 创造力和社交


    有这样一个根本的矛盾，值得每一个创新者注意——

    你要在多大程度上保留和发展自己的个性，在多大程度上向别人学习。


    人才是交流出来的，但天才可能需要一个孤岛。


    其实就算是现在，同样是住在城市里，真正有创造力的人也不是整天和人开会搞社交。他必须得有大量的时间自己 Theodors，最多是跟几个内行合作，才能做出原创的好东西。


    所以城市对创新的宏观好处只是一方面。也许住在城市里，同时内心有一个孤岛，勇敢地保留特色，才最有利于创新。


    我们可以想像，真正了不起的发明创造，绝对不可能是 一个两耳不闻窗外事的人关门造车做出来的——但也不可能是一个整天到处交际，沉迷于社交网络的人搞出来的。


    # 团结精神vs创造力


    我们以前爱说一个成功的团队要上下一心、“团结如一人”，这还对吗？不一定对。新时代讲究多样性，把有不同背景不同观点的人放在一起，反而能获得更强的办事力量和适应度。人材配置不再是把最好的人放在最关键的地方，而是——用罗振宇爱说的一句话说——“自由人的自由联合”。书中一个最好的例子是一群电子游戏玩家，帮着生物学家解决了一个重大难题，还获得了论文的署名权——因为游戏玩家有比生物学家更好的空间想象力。


    “不团结”，往往是创造力的来源。在这个时代“抵抗”比“服从”更有价值，有很多科学发现是科学家抵抗上级命令，自己单干的结果——没有人是靠别人告诉他怎么做而得到诺贝尔奖的。


    # 三个办法激发创造力


    +   1. 把你最想要的东西列出来，用解决问题的思维想想怎么实现它。

    2. 个人的经历，往往是创作的源泉——你要做的是把自己投入过情感的经历，跟新的东西连接起来，这就是创造。

    3. 旁观者清。陷入一个情境不能自拔的时候，主动换一个视角。


    但更重要的教训是这个：让自己信服，才能让观众信服。自己感动过的，才能够让观众感动。


