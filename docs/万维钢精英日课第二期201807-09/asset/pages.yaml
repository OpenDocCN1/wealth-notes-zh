  md: '# 日课200 | 启蒙与此时2:

    人性和现代化


    有个流行的说法认为资本主义和民主制度假定人性本恶，这个理解有点庸俗了。启蒙运动的关键假设不在于人性本恶还是本善，而在于“人可以有理性”。理性是升华了的人性。现代社会，在一定程度上，是对人的本性的违反。


    现代化的生活更便利，经济更发达，各方面都更加进步，但是现代人似乎总有一种乡愁。有时候你会不会生活在一个现代化的大都市里有点不自在呢？反对现代化可是文艺作品的一大主题。


    > 郑智化唱道：“都市的柏油路太硬/踩不出足迹/娇傲无知的现代人/不知道珍惜……“


    > 孙燕姿唱道：“然而愤冲直撞被误解被骗/是否成人的世界背后 总有残缺/我走在 每次必须面对的分岔路/我怀念 过去单纯美好的小幸福……“


    你是否也曾经感慨，难道我就是一个数字吗？我已经变成一台机器了吗？！你是否也曾经怀念田园牧歌式的生 活呢？


    启蒙运动是人性和现代化之间的一场拉锯战。如果我们不谈人性而单纯赞美现代 化，启蒙运动就是必然脆弱的。那人性之中到底有什么不好的东西，非得需要启蒙呢？


