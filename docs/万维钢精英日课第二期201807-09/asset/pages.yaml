  md: '# 特别放送 | 如何成为一个决策高手


    特别放送 | 如何成为一个决...


    万维钢


    今天我来给你刚讲完的新书《赌博思维》做个总结，提炼一下这本书的重

    点，帮你更好地理解、掌握和拿走这本

    书的内容，我还会帮你把日课里讲过

    的“科学决策”的相关知识补充进来，

    让你对科学决策的态度、心法和气质，

    有一个相对立体的了解。希望你通过阅

    读文稿的方式复习了，也希望你能把学到

    的东西，用在工作生活中的大大小小决

    策之中，或者分享给那些正在纠结的朋

    友。祝你们成大事，不纠结。


    # | 态度


    决策高手必须能够区分以下这些东西——


    +   运气和技艺

    信号和噪音

    决策水平和决策带来的结果


    科学决策的第一步是把你对事物的判断给“概率化”。要做到审视信息的真假，严肃对待你的信念，你必须投入真金白银跟人打赌，有点 skin in the game，你自然就会好好地审视一番。


    严肃而且投入的态度，是科学决策的前提。


    # | 基本功


    把决策水平和运气分开。头脑清醒的人必须能区分决策和运气。


    人们总是事后诸葛亮，认为如果结果不好，当初肯定可以有更好的决策——可是如果你经常打扑克，你就知道完全不是这么回事。


    扑克选手把这种情况叫“结果论（resulting）”。扑克要打很多很多把，你在乎的是一个能够以大概率赢钱的科学决策系统，而不是某一把的输赢。如果因为这把输了就随意改动决策系统，这就是结果论，你就等于没系统。


    普通人关注结果，高手关注系统。这是科学决策的基本功。


    高手不以成败论英雄，他注重的是决策水平的高低、是决策过程的合理性，而不是最后的结果。


    复习：谁配得上说“不在乎输赢”


    # | 技术之一：增加选项


    如果只能选择yes或no，长期看有52%的决定是错的，增加两个选项，选错的比率下降到32%。


    最简单的增加选项的办法，是“借鉴”。借鉴的思想路，是“寻找亮点”，在大多数人都失败的局面下，看那几个成功的是怎么做的。有了各种选项之后，要把多个选项摆在桌子上，把所有方案都摆出来，统一选择——就像古代表士一次性给主公三个主意：上策、中策、下策。


    老江湖和女高中生做决策的最大区别在于老江湖总是考虑多个选项。如果你没有选项，你那不叫决策，只能叫决心。


    复习：选项的价值


    # | 技术之二：及时复盘


    提高技艺的具体操作原则其实很简单，无非就是从经验中获得有效反馈，跟我们常说的“刻意练习”是一样的道理。


    复盘应该是这样的：你要假设各种替代可能性。比如说你在大冬天开车，路过一个十字路口的时候，因为路上有冰，你的车失控了，导致一起交通事故。这件事当然有运气成分，但是如果你想从中吸取教训、乃至于提高驾驶水平，你应该这么复盘——


    +   你事先是否想到了路上可能有冰？

    明知是这样的天气，你是不是开得太快了？

    发现车开始打滑的时候，你的操作是否有问题：你方向盘是不是打错了，你是不是不应该猛踩刹车？

    小路容易结冰，大路应该已经都撒上盐了，你为什么当初不选择走大路？

    你家里有辆更适合冬天路况的车，你为什么不开那辆车？


    这些可能性有的有用有的没用，但是你一定要考虑得非常全面，然后非常严肃地面对所有这些可能性。


    # | 障碍之一：自利性偏差


    出了事儿都怪别人，这真是人之常情。心理学家对此有个专门的名字，叫“自利性偏差（self-serving bias）”。自利性偏差包括第一，如果我做这件事没做好，那肯定是因为不可控的、别人的、或者意外的缘故；第二，如果我做这件事成功了，那肯定是因为我水平高。


    这种态度会让你自我感觉良好，但是可不能让你提高决策水平。


    克服自利性偏差，有两个办法：


    +   转换视角：把自己和别人的成败给换位想象一下。

    成立小组：这个小组必须有下面这样的品质——

    第一，尽可能提供客观准确的观点。

    第二，说话得“算话”。这就是说你不能给人瞎提意见，你提出的意见你自己也要执行才行。你要非说一个什么事儿对，你敢不敢拿这件事打个赌？

    第三，对不同的观点保持开放态度。


    复习：真理追求者


    # | 障碍之二：情绪


    情绪会扭曲你对事物的判断。


    情绪的问题就在于，明显是个很小的事儿，它会让你觉得那个事儿特别大。


    情绪对人的误导还体现在相同的结果会带来很不同的情绪。这个受到情绪影响的精神状态，有个专有名词，叫做“tilt”——也就是倾斜。如果你是处在倾斜的状态，千万别做决策。因为这时候的你根本不知道什么重要什么不重要。


    你最需要判断的，是你自己是不是出于 tilt 状态。你要善于观察自己的状态。特别是与人相处的时候，千万不要在愤怒状态下做任何决定。


    克服情绪的办法：（结合希思兄弟不纠结决策法）


    +   1.设立反对派：把兼听则明给程序化，并且要求给出具体的反对理由；

    决策过程没有反对派，就好似庭审只有法官没有辩护律师。办法是制定一支“蓝军”部队，专门唱反调。因为是奉命反对，所以对事不对人。个人决策时，也应该找几个朋友提反对意见，帮你用智商战胜情绪。

    2.从远处旁观：克服短期情绪，尽量从一个远距离考虑问题；

    要跳出来，以旁观者的视角观察自己。考虑十分钟、十个月和十年之后你会对此作何感想。10/10/10法则是一个特别好的旁观技术，要求你从三个时间尺度去考虑一个问题。让过去的你、现在的你、和未来的你，一起做决策。

    3.考虑价值观：如果利益计算已经无法让你判断优劣，那就想想自己的核心价值观是什么。

    价值观就是你设定的“优先级”，就是你认为什么重要、什么不重要。它可以指导我们决策。


    复习：成大事者怎么可能纠结

    决策者的气质


    —— 关于决策…… ——


    # | 卡尼曼简单决策法


    一个事实特别有意思：简单规则得到的结果并不比大数据复杂模型的结果差。


    +   1. 选择几个你认为对结果有重要影响的因素，不要超过六个。

    2. 按照比如说满分十分的统一标准，对每个因素打分。

    3. 把分数简单相加获得总分。'
