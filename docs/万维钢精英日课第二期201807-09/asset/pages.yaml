  md: '# 日课204 | 独处的功夫


    日课204 | 独处的功夫


    今天咱们说说孤独。你肯定不喜欢孤独。孤独是一个主观的情绪，对人的精神和身体都可能有严重伤害。但我今天最想说的不是这些，而是孤独对人思想的影响。


    孤独的思想，常常是极端的思想。思想上的孤独，可能比精神上的孤独更危险。


    # 1.孤单和孤独感


    孤独正在成为热门话题。最近十几年以来有个非常明显的趋势，独居者越来越多了。


    按美国的数据，从2004年到2014年，独居的年轻人比例从52%提高到了64%。中国的数据不准确，有说中国有两千五百万青年独居有说有5800万，但可以肯定是比例不小，而且正在增加。我看人们一提到这个现象就心仲仲，这些独居者会不会很不快乐，以至于变成社会的公害呢？


    其实独居不是毛病。独居的人之所以增多，是因为现代社会的便利使得独居成为可能。过去的生活需要两个人互相照顾，是你为我把饭烧我为你打扫——现在有外卖有钟点工一个人完全可以生活得很好，一杯红酒配电影，还不用被谁管。独居的人工作可能非常忙碌，可能南地北有很多人朋友，独居不一定孤独。


    甚至哪怕这个人干脆就不怎么跟人交往，也不一定就是孤独的。有一些精神世界特别丰富、智力水平特别高的人，就是不爱跟人交往。咱们专栏前讲过一本书叫《创造的起源》，这本书的作者爱德华·威尔逊就是一个非常离群索居的人。他曾经的主要工作是研究蚂蚁，他喜欢一个人丛林里待很长时间观察蚂蚁。


    从精神和身体健康的角度，客观上是否孤单不重要，重要的是你是否有“孤独感”。如果你感到孤独，那可能是身体在向你发信号，说明你这个状态不行了。去年《新科学家》杂志有一篇文章
    [1] 介绍了关于孤独感的最新研究， Giles老师的专栏有一期叫《援救孤独感》，对此作了详细的讲解。


    这篇文章提到一项针对150项研究的荟萃分析，认为孤独感和长期不锻炼、酗酒、吸烟和肥胖对人的损害是一样的，它能使人早死的概率增加26%。所以如果你感到很孤独，你得赶紧想办法改善情绪，身心健康很重要。


    对妈妈来说，你的身心健康是最重要的。但我们作为社会的中间砥柱，总有一些事情比身心健康更重要。


    比如说思想健康。


    # 2.功夫


    孤独对人的思想可能会有两种危害。第一种比较弱，大约相当于“良性肿瘤”，最多也就是让人安于庸。第二种则是恶性的，会让人走极端。咱们先说良性的。


    “心流”这个概念的最早提出者米哈里·契克森米哈赖，在《心流：最优体验心理学》这本书里，对独处这件事，说过一句很重的话——


    > “如果一个十来岁的孩子不能忍受孤单，他成年后就没有资格担负需要郑重其事准备的工作。”


    独处是对人的注意力的考验。在跟人相处的时候，随时都有人和事吸引你的注意力，你几乎感觉不到注意力还需要主动管理。那么等到独处的时候，有很多人就会不适应。他会觉得无聊，会不知道该干啥。我们看见某些领导干部退休以后就是这种状态，不用他理政了，没人理他了，他自己就不知道该理啥了。


    # 3.为什么孤独的人容易走极端


    恶性的孤独感，会让人的思想走极端。


    最近Aeon网站有一篇文章 [2]，说孤独是恐怖主义和极端主义的温床。这篇文章的作者叫加法尔，是牛津大学的在读博士生，同时还是一个作家和编辑。加法尔非常了解有极端思想的人什么样。她研究过很多在西方长大、后来成为穆斯林恐怖分子的主人，这些人的共同特征就是有强烈的孤独感，感觉被社会抛弃了。


    # | 由此得到


    我们专栏不断地引用菲杰拉斯德耶名言：“检验一流智力的标准，就是看你能不能在头脑中同时存在两种相反的想法，还继续正常行事的能力。”今天我们从另一个方向理解这句话——如果一个人的头脑里一直都没有相反的想法，那就会偏地行事。'
