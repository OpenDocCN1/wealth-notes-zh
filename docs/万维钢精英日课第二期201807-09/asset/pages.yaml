  md: "# 特别放送 | 打胜仗的思想\n\n特别放送 | 打胜仗的思想\n\n# 万维钢\n\n你好，今天我来把之前讲过的《激进包容》这本书，给你做个总结清单，帮助你更好地理解和消化这本书的内容。我们说过，这本书说的不一般意义上的领导力，它研究的不仅仅是企业家对员工，更是品牌对消费者，是美国对伊拉克的那种领导力——它不仅对“领导者”有用，它对每个人都有意义。\n\
    \n![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_83_0.png)\n\n书名：《激进包容：后9/11世界教给我们的领导力》（Radical\
    \ Inclusion: What the Post-9/11 World Should Have Taught Us About Leadership）\n\
    \n作者：第一作者马丁·登普西（Martin E. Dempsey），退休的美国陆军四星上将，曾 despertar... 曾在2011年到2015年担任参谋长联席会议主席，参加过1991年的海湾战争和2003年的伊拉克战争，退役前多年主导美军在中东地区的战略。第二作者奥利·布莱夫曼（Ori\
    \ Brafman），咨询家、企业家和作家，平常主要从事管理咨询的工作，咨询的对象是政府的高官和大公司高管。\n\n出版日期：2018年3月\n\n# ——【本节核心观点】——\n\
    \n新型领导力，是一种软实力的操作。如果说你不能*控制*、但是可以*影响*别人的思想，那么你应该怎么争取支持呢？这不仅仅仅是管理者如何领导员工，更是品牌如何领导消费者、意见领袖如何领导民意。做这种事靠小算计不行，你得用“大”学问——团结各种各样的人，建立最广泛的统一战线。\n\
    \n本书分享了几个来自美军的操作经验。在我看来，思想只有两种：能让你打胜仗的思想和让你根本不敢打仗的思想。这本书说的是前者。\n\n# ——【叙事】——\n\
    \n+   1. “叙事”就是广义的讲故事。你并不一定非得讲一个完整的有人物有剧情有转折的故事，你只要用某个主观的视角，把东西——不论是历史故事也好、哲学观点也好、科学知识也好——讲一遍，就叫叙事。\n\
    2. 事实是客观的，叙事是主观的。讲事实和叙事的区别在于：\n   - 事实分对错，会引发辩论，而叙事的关键在于你讲得是否有趣、能不能吸引人，叙事只会带来支持者。\n\
    \   - 讲事实你得讲证据，而叙事讲的是感情。\n   - 事实的价值在于有用，而叙事的价值在于传播——只要传播得广你就赢了。\n   - 事实一定要准确，叙事却可以在传播的过程中被人不断改变，反正只要保留你的理念就行。\n\
    3. 只要人们认同你的叙事，就会自发地去做一些事情。\n\n# ——【放权】——\n\n+   1. 比向自己组织的基层放权更进一步，是搞统一战线，向盟友放权。要想可持续地保留权力，就必须主动放弃一部分权力。有时候盟友关系比上下级关系更长久，有时候合作的效率比命令和控制更高。\n\
    2. 现在这种时代，放权有四个理由：\n   - 第一，用控制解决问题，难免是一种狭窄的手段。你是强制命令别人做事，别人内心难免不舒服。那么即使这一次事情办成了，冲突依然存在。\n\
    \   - 第二，在现代社会保持控制力的成本越来越高。\n   - 第三，你不了解具体情况。拿美军在伊拉克来说，当地的风俗习惯、宗教禁忌、如何办事才能办成，美军是不懂的，文化差异太大了。\n\
    \   - 第四，环境变化太快。在局面迅速变化的时候，中央的实时控制更是不可可能的。\n\n# ——【归属感】——\n\n+   1. 归属感是人之常情，不需要教育。“归属感”让领导力更容易，但归属感可不见得天然就是属于领导的。在现代社会，归属感，尤其需要争取。\n\
    2. 归属感的三个部分：\n   - 第一，它是身份的认同。说白了就是我身上的标签，我们出生的家庭、社区、故乡、种族、国籍，是你无法选择也无法摆脱的东西。\n\
    \   - 第二，它提供安全感。有归属感的集体应该是可依赖的。集体不会抛弃你，有事领导能给你解决。\n   - 第三，它能带来秩序，提供行动的可预测性。不一定非得“一切行动听指挥”，但是团队要是没有秩序，高兴了活干得特别快，不高兴这活就没人干，肯定是不行的。\n\
    3. 团队归属感最重要的东西是“共同的回忆”，这些回忆来自五个方面——\n   - 成功。我们一起完成了一项了不起的事情，每个人都作出了贡献，而且每个人都知道他的贡献对于我们集体能干成这件事是非常重要。这样的回忆会给人很大的鼓舞。\n\
    \   - 失败。失败会让人成熟。一起经历过失败，谁也不推卸责任，大家都知道失败是什么样的，团队会变成熟。\n   - 关心。通过一些事情让人感受到集体很关心自己，这样就有了安全感。\n\
    \   - 正确的做法。当你作为领导面临一个艰难选择的时候，你要让你的团队看到，你是如何做正正确选择的——这样下次他们遇到类似情况，也知道应该怎么选。\n\
    \   - 错误的做法。当有人犯错的时候，团队一起体验这个错误，下次就知道这么做不对。\n\n# ——【惊讶神经元】——\n\n+   1. 人的大脑里有一个快速反应的报错机制，它不仅仅是对错误做出反应，其实是对任何“惊讶”都做出反应。只要有什么东西不对，马上就会有这个信号，科学家给它起了个名字叫“惊讶神经元”。公司里有主人翁精神的员工，看到哪里不对就主动提出来，发现不正常的地方赶快报告，他们就是组织的“惊讶神经元”。“惊讶神经元”是一个符合大脑工作原理的、低成本的发现问题的组织方法。\n\
    2. 为什么有的公司就没有“惊讶神经元”？也许员工的积极主动和公司的等级制度是根本性的矛盾。只要有等级，底层就不会那么积极主动。这不是态度问题也不是思想工作问题，这是制度问题。\n\
    3. 你不能在一个等级森严的体制里讲什么“密切联系群众”。\n\n# ——【信任】——\n\n+   1. 想要让人心甘情愿听你指挥，你跟他之间必须建立深厚的信任。\n\
