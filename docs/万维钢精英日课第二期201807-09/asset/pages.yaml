- pgno: 18
  md: '# 3.革命的机会


    Lee 看到了两个信息产业革命的机会。一个是现在的人们做所有事情、将来用的所有东西都可能上网，而网络在与人方便的同时，也影响到了个人隐私。方便和隐私之间有一个矛盾，那能不能用创新来解决这个矛盾，就是一个机会。这个领域现在有很多人讨论我们就不细说了，但是有一点值得说
    —— 前面说的那个 MIT 研究生发明的 Jeeves 语言，就是专门为隐私和保密数据编程的语言。


    Lee 的另一个洞见可能对中国更有用。IT 技术的这个用分层解决复杂问题的方法，现在还没有被用到物理设备的制造中来。


    比如说造大飞机，现在就没有软件层面的分层。这里面有个根本矛盾。


    普通计算机如果同时运行多个程序，那哪个程序先结束运行、哪个程序运行得快一点慢一点、都无所谓，其中没有什么时间协调。而飞机就不一样了。飞机各种部件的运动，是通过不同程序分别控制的。飞机的各种机械动作必须协调得非常好才行，每个控制程序什么时候启动、什么时候结束，必须分毫不差。可是这种时间协调不是通过什么“飞机操作系统”统一指挥的
    —— 各个参数都是在实验中分别微调出来的。


    这就意味着芯片一旦调好就不能换了。新一代芯片的计算速度会不一样，原有的协调就会被打破。大飞机一旦设计定型，当初用什么芯片就得以后一直用这个芯片。飞机制造公司不得不买很多芯片长期备用，要保存好几十年
    —— 像空中客车公司甚至是用液氮保存芯片。


    不但飞机，现在包括汽车在内，凡是涉及到物理操作的机械设备的计算机化，都存在时间协调的问题。我们急需一个“协调层”。


    我觉得这可能是中国的一次弯道超车的机会。中国是个制造业大国，而且恰恰正在制造大飞机，将来必定是这项技术的最大用户。不过美国已经有了一些积累，2006 年 就
    有 了 称 为 “ 赛 博 物 理 系 统 （ cyberphysical systems ） ” 的研究立项。


    总而言之，现在中国面对的不是一两项关键技术，而是一个建立在分层模型上、树大根深的信息技术文化。除非有新的分层机会，你很难另起炉灶。“中国标准”不能刻意为之，最好抓住关键机遇，解决真问题，才有可能创造一个新体系，那才是真正的大国风范。


