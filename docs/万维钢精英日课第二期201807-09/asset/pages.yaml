  md: '络盗版就是最好的例子。如果人人都坚持用“电驴”之类纯粹P2P的方法下载盗版，那确实没法反盗版。可是纯粹的P2P没有任何服务，而我们需要方便服务 ——
    比如说一个集中发布的盗版资源列表。而这就需要一个正规的网站。好，等这种网站做大了，人们已经离不开它了，政府只要打掉它，网络盗版大业就遭受重大打击！


    第三个办法把自己变得去中心化。


    我们本周说的分权策略就是如此。我们主动分权，做一个平台跟人合作。


    其实把海星和蜘蛛混合起来，可能是更好的组织形态。分权有利于发展，集权有利于收获。淘宝上谁都可以开店，这是去中心化，可以快速发展快速演变。淘宝平台搞些管理，这是集权，但是有管理有服务才好收钱啊！


