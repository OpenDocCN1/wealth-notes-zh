  md: '中国电影的剧情抄袭国外作品，不能说是高级，但是是非常有效的借鉴。为什么现阶段中国没有从扫雷机器人到扫地机器人这种高级借鉴，只有从《达拉斯买家俱乐部》到《我不是药神》这种低水平但是是有效的借鉴呢？


