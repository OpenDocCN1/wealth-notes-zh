  md: '# 日课177 | 先发者优势


    日课177 | 先发者优势


    我们在生活中会经常面临各种紧要关头的压力。一件大事，比如说高考，成败对你特别重要，你必须得表现好，所以你感到了压力。那这种心理压力好不 好呢？


    一个说法是有压力不好，最好不带思想包袱轻装上阵。也有人认为有压力反而更好，压力令你背水一战，能调动全部的力量去好好发挥。


    老百姓很关心这两个种说法到底哪个对，但科学家想的更保守一些。科学家首先关心的问题是，这所谓 的“心理因素”，到底靠不靠谱——有压力没压力真能影响我们做事的结果吗？也许压力影响发挥只是你的一种错觉。


    在生活中想证明心理因素的影响，是非常困难的事。每件事都涉及到很多因素，你很难把心理压力这个因素单独拿出来研究。


    但是足球提供了一个非常好的研究素材。我们今天还是说《美丽的运动博弈论》里面经济学家的 They study。


    # 1.点球决胜公平吗？


    我们都知道世界杯的规矩。进入淘汰赛阶段，每场比赛必须决出胜负。如果双方90分钟内打平，那就加时30分钟。如果加时赛再打平，最后就是点球决胜。两个队你踢我一个我踢你一个，先是以五轮为限。


    点球决胜是一个压力特别大的项目。踢进了不一定是功臣，踢不进就可能是罪人。而点球决胜制度有一个经济学家特别喜欢的特点。


    那就是随机决定谁先罚谁后罚。裁判会把双方的队长叫过来，一个要正面一个要反面，然后抛硬币。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_2_0.png)


    2003年以前的规则是谁猜中了谁就先罚。2003年以后改为猜对的这一方可以选择自己先罚还是后罚。


    好，现在经济学家的的问题是，点球决胜，先罚后罚有关系吗？


    # 2.什么压力


    现在我们终于有了一个直接证据，证明心理因素真的能影响比赛结果。但到底是什么样的心理压力呢？这个问题数据看不出来，研究者只好直接问球员。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_2_1.png)


    # 3.数学家的建议'
