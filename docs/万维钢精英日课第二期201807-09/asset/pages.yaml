  md: '# 日课207丨启蒙与此时7:美国宪法厉害在哪


    日课207丨启蒙与此时7:美国..


    今天咱们继续拿戈德堡的《西方的自杀》这本书讲启蒙运动。


    我想先让你思考这么一个问题：“国家利益”这个词儿我们经常听说，那到底什么叫“国家利益”呢？


    我以前读布鲁斯·布恩诺·德·梅索笼的 一本讲博弈论的书，叫《预测师的博弈论》，其中就说的很有意思。国家，只是一个想象的共同体，想象出来的东西没有利益，只有人才有利益。国家中的每个人有每个人的利益，各个利益集团有各自的利益，“国家”没有利益。当有人说国家利益的时候，他实际上是有意或者无意地打着国家的幌子，在为某个利益集团谋取利益。


    比如说，美国政府宣布，要大幅度提高针对德国进口汽车的关税，请问这体现了美国的国家利益吗？进口汽车关税保护的是美国汽车厂商的利益，而同时伤害了美国汽车消费者的利益。


    那所谓“美国的国家利益”，到底是谁的利益呢？是大多数人的利益吗？如果大多数人的利益就是国家利益，难道少数人就活该被侵犯利益吗？


    经过前面这几讲，我们现在对“国家”有一个新的思考角度。追溯历史，“正常国家”的本质，是一群静止土匪用来压迫人民的工具。那要这么说的话国家当然有利 益——所谓国家利益就是静止土匪的利益。


    我们还讲了，资本主义跟正常国家最根本的一个区别，是资本主义讲创新，而正常国家的土匪为了维护自己的既得利益必须禁止别人创新。


    今天我们要说的是，资本主义是一个比较脆弱的状态。国家，会反击。


    # 1.威尼斯往事


    中世纪时期的威尼斯共和国，曾经是个商业非常发达的民主国家，它的权力掌握在人民代表的手里。1171年成立的“威尼斯大会会”是它的最高权力机关。大议会有100个席位，当然里面没有穷人，有贵族，有官员——但是，也有商人。


    事实证明能有商人就算不错了。威尼斯的政治民主商业发达。当时的威尼斯就有私人合同法和公司破产法这些东西，还出现了一系列的金融创新，简直是有点现代化 的意思，经济自然是高速增长。


    各路新贵不断地加入大议会。可能某人原本出身一般，创业开公司，股票一上市有钱了，就能够加入大议会。但有人搞颠覆式创新，就得有人被颠覆——新贵要加入大议会，旧贵族就得退出，旧贵族的利益就得受损。威尼斯贵族，就觉得日子不应
    该这么过。


    于是再1286年，贵族们决定不能再给新人机会了。这是一次改袭式的政治改革，要求从此以后大议会的席位都世袭。贵族们弄了一本“黄金名册”，名册上的家庭自动获得一个大议会的席位。而如果你家不在名册上，那对不起，你再有钱再努力都进不了大议会。


    1314年，大议会宣布把最重要的贸易线路国有化。特别是远程贸易，规定只有贵族才能从事。你要不是贵族，不但吃不上肉，哪怕想做点小规模的贸易喝汤，也得交很重的税。从此赚钱的生意就被贵族集团垄断了。这是威尼斯经济衰落的开始。


    威尼斯共和国，变成了一个正常国家。


    从民主共和国变成帝国，这种事情在历史上发生过好几次，古罗马是最显眼的例子。这就是为什么我们说“正常国家”是“正常”的，因为这是人的本性趋势所在。


    真正的人人平等是个神话。小团队还可以讲平等，一旦人数过多就必然有分工有等级——那也就是说有精英。精英集团掌权之后不会老老实实等着别人来竞争，他们一定会想办法让统治对自己有利。他们就算原本不是土匪，最后也会变成土匪。他们一定会防止别人搞颠覆式创新。


    这个问题，在美国建国的时候已经考虑到了。美国的建国者考虑到了罗马共和国是怎么失败的，也考虑到了威尼斯共和国的前车之鉴。


    美国人想了几个办法。


    # 2.美国有何不同


    有精英其实没问题，只要有人群就有精英。问题在于当精英把握权力以后，怎么防止他们用权力给自己谋取利益。


    美国的建国者之一、也是第四任美国总统，詹姆斯·麦迪逊，提出一个思想。他说要解决精英的问题，最好的办法是把权力的圈子扩大——只要圈子足够大，任何一个势力都不能形成多数，而精英和精英也不容易联合起来。


    美国真的很大，麦迪逊的思想真实现了。


    整个19世纪是美国资本主义的黄金时代，美国的人口扩大了五倍，人均GDP扩大了三倍，充 分体现了自由市场的好处和资本主义的优越性。


    正常国家中的权贵和穷人是对立的，而美国的资本家们参与市场竞争结果却是对穷人有好处。


    当时有个作家就写道，范德比尔特是个资本家，他赚了很多钱，你买的每一桶面粉，他都从中赚取了0.14美元——可是因为范德比尔特这个人的存在，每桶面粉的价格被降低了2.75美元！他让你省了2.75美元，他自己才赚0.14美元，你对他还能有什么不满呢？你应该感谢他才对！这就是当时美国资本主义的精神。


    后来有人分析，说为什么世界各地都爆发了轰轰烈烈的工人运动、各种倒革命，而美国没有呢？是因为美国对人民的压迫从来没有那么严重——关键就在于，美国，有权的人，和有钱的人，是分开的。


    资本家没有权力，政客没有钱，他们并没有形成一个贵族集团起来压迫人民，人民永远都有希望，所以美国的工运从 都没成气候。


    戈德堡总结，十九世纪美国资本主义的成功，有五方面的原因。


    第一，美国的经济一直在高速增长。经济增长一个好处是，哪怕你是个普通人，你搞个发明创造想开公司，你也能很容易得到资本。经济增长，普通人才有上升通道。


    第二，美国太大了，而且各个地方很不一样。就算一个地区的几家棉花公司说我们成立一个行会，也断然不了棉花业务，因为其他地区的棉花公司根本不理你。


    第三，美国的文化特别讲企业家精神。这一 点我们今天还能感受到。美国人特别喜欢讲创业，特别推崇白手起来自己开公司的人。这个文化吸引了全世界有企业家精神的人到美国来。


    第四，美国当时的国家权力不够大。就算 有利益集团能把握国家权力，它也做不了什么。


    第五点也是最重要的一点，是美国宪法非常厉害。


    当然现在世界上还有好几个国家几乎是全盘复制了美国的宪法，结果运行起来都不是那么回事儿，所以前面四点是必不可少的。但是你不得不承认，美国宪法有高明的地方。


    # 3.国家和政府


    我们知道正常国家都是静止土匪建立的，但美国可不是这样。美国的建立是开会开出来的，美国宪法是顶层设计的结果。罗辑思维有一期节目叫《开会是个技术活儿》，讲过费城制宪会议是怎么开的，强烈建议你听听。用当时杰斐逊的话来说，这是一个“半神半人”的会议。美国宪法可以说是集中了当时最优秀的头脑的最先进的思想，是启蒙运动的一个最高成果。


    这部宪法的最厉害之处并不在于它讲民主，而是它有一个机制，能够避免像威尼斯共和国那样让利益集团劫持国家。


    这个机制的关键是英国哲学家洛克的思想。启蒙运动的思想家也有不同的派别，洛克和卢梭就有一个本质的分歧。卢梭认为人的权利是国家给的，而洛克认为人的权利不是国家给的，而是上帝给的——也就是所谓“天赋人权”。'
