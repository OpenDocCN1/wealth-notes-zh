  md: '有一两种，你固然可以使用前面的那些启发式，从一个配方开始，在临近的区域慢慢试，淡了就加点盐，咸了就加点水。可是如果这个东西的配料特别多，你怎么办呢？


    你要把配方给数字编码化，每一组数字代表一个配方的“DNA”。然后你先随机地生成一些配方，从中选择几个比较好的，让它们互相“交配”，“生育”出下一代配方。比如说，A
    配方和 B 配方的性能都不错，那么你可以取 A 配方的前半段，和 B 配方的后半段，生成一个 C 配方，那么 C 就是 A 和 B 的孩子。


    你让第一代优秀的配方这样交配 —— 当然每次选择 DNA 的哪一段是可以随机调整的 —— 就生成了第二代。为了模仿进化，你还可以在每一代搞些随机的“基因突变”。对第二代配方，再从中选取优秀的，赋予它们生育权，再得到第三代配方……以此类推，你终将获得一个特别优秀的配方。


    据我所知，进化算法在设计方面有很多实际应用，不过我觉得一般人恐怕用不上这么高级的方法。但不论如何，让好东西自己冒出来，这个思想值得你拥有。


    佩奇只讲了四个启发式，而真正解题能用的套路太多太多了。而且最后还有一点需要你了解，并不存在一个万能的套路，用在所有问题上都好使 —— 这个理论甚至还是一个数学定理，叫“没有免费午餐定理（No
    Free Lunch Theorem）”。


    所以你要做的就是多掌握几个套路，多转换几个视角 —— 解题，不正是如此吗？


    # 划重点


    四个解题的“启发式”：

    “拓扑启发式”：看看四周临近的地方。

    “梯度启发式”：考察邻近的地点，但是它有一个明确的方向。

    “允许犯错启发式”：你可以搞一些“任意的震动”。

    “种群启发式”。用模拟生物进化的方法找到最优解。


