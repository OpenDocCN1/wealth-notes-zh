  md: '# 复习+预告｜从能量角度理解生命


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_12_0.png)


    复习+预告｜从能量角度理解。


    # ◈ 下周课程预告 ◈


    下周我们会讲线粒体细菌寄生在古细菌中的证据，它揭示了一个道理，那就是真核生物出现是一个惊人的，极其偶然的事件，而细菌的出现则不是，细菌的生存策略与真核生物相差太远，甚至可以说，寿命的长短对细菌的意义都不如对真核生物大。


    这种差异的巨大，仅从能量角度看都是如此，比如按单位质量释放的热来看，人体燃烧能量是太阳的1万倍，这就是真核生物对能量的耗费。


    这样的化学反应一定在专门的场所进行的，那就是线粒体。


    我们会讲到线粒体膜上呼吸链工作的细节，因为这些细节是理解衰老的必备基础知识。


    好了，预告就是这样，我是卓克，咱們下周的课再见。


    # ◈ 本周课程复习 ◈


    # 关键词：心理


    心理学科学化的时间还非常短，从经验到知识，从看上去包罗万象到满足可验证可复现的理论，观察这种转变，不仅能知道科学思维是什么，更能在研究人的情绪、行为、心理状态时，获得更稳固的答案。


    271｜心理：什么样的心理学书值得参考？


    +   1. 判断心理学书籍是否有足够的参考价值，最核心的标准是，内容中使用的结论或观点，是否遵循了科学研究的方法论。 2. 以弗洛伊德的精神分析、斯金纳的新行为主义等为主的100年前左右的心理学内容，已经缺少足够的参考价值。
    3. 凡是目前还不可以测量的东西，我们都不能“把它当作是真的存在”一样去研究。 4. 伪科学的典型特征，是直接跳过测量操作，声称存在现代科学还没有形成理论、无法解释的内容。


    # 概念27：衰老


    衰老，是每个人都会经历的，但它并不是每个生物都会经历的，有些动物就没有明显的老化，甚至越老越强。了解衰老，是科学地树立世界观必要的环节，它可以让我们更坦然地面对生命的最后阶段。


    272｜衰老：人老了以后会怎样？


    +   1. 现代医学提高了人均寿命，主要是大幅减少了新生儿的死亡率，大幅削减了因为微生物的感染造成的死亡，但对人类寿命上限的提升，没有太多贡献。 2. 人体是极为复杂的系统，各个组成部分都有一定的“冗余”，即使是一些部分出现损伤，系统也能维持运转，衰老的过程，就是损伤持续积累的过程，当“冗余”耗尽，人的寿命也就走到了尽头。


    273｜衰老：两个深入的冷门研究


    +   1. 关于生物为什么会衰老，学术界没有统一观点，它不被公认为一种疾病，即便抗衰老的药物研发出来，也无法按照药物流程审批、上市、开卖。所以，相比有庞大资金的药物研发，衰老研究在医学界比较冷门，经费缺乏。
    2. 细菌通过无氧呼吸分解1个葡萄糖分子，能产生2个单位的能量，而在有氧呼吸下，能产生最多36个单位的能量，从能量的角度看，正是氧气的大量出现，为生命提供了更多可能。


    274｜衰老：生物界有简洁美吗？


    +   1. 自然界的生命形式具有多样性，不存在什么“简洁美”，很多看似比人类简单得多的生物，比如一些爬行动物、原生动物、甚至微生物和植物，它们的遗传物质数据量比人还要多。
    2. 科学结论，是不能用文学词汇来进行价值判断的，因为这类形容词，不能准确描述科学细节中的证据和规律，科学问题，不要过度化人文解读。


    # ◈ 答疑时间 ◈


    275｜问答：关于潜意识的现代研究


    +   1. 在丹尼尔·卡纳曼的定义中，潜意识是那些耗费注意力很少，或者基本不耗费注意力的心理活动，也叫自动化过程。 2. 进行深思熟虑作出判断，这种的行为模式，对全体人民来说是一件稀罕事。
    3. 潜意识几乎会对遇见的所有事物，进行好坏的简单、快速地评估，会作出亲近或者躲避的判断，对这些结论的调整，只能后续由意识重新加工。


    276｜问答：如何测量大脑？


    +   1. 一切科学问题都扎根于测量，只有测到了，才能继续深入讨论后续的内容，测量大脑，测量的目标就是大脑的神经元活动。 2. 人类对大脑的测量，还很初级，既缺少足够好的测量手段，对大脑工作程序的理解更是蒙在鼓里。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_12_1.png)


    卓克 我是卓克，下一讲我们开始进入第四十六周的课程。


