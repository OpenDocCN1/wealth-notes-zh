  md: '# 答读者问｜为什么顶尖高手能长期保持巅峰地位？


    答读者问｜为什么顶尖高手…


    # 来自日课：“多样性”到底好在哪？


    读者 Eter:


    万老师，经常听您说充分竞争的市场，比如您说的男子足球。我想问下当今的职业网球是充分竞争的领域吗？如果是的话，为什么女子如小威廉姆斯，男子如纳达尔，还能够如此多年的保持巅峰领先状态呢？


    万维钢


    职业网球的确是充分竞争的领域。顶尖高手能长期保持巅峰地位，大约有两个原因。


    一个是天赋真的很重要。体育是讲天赋的。这不仅仅是天生的身体素质和头脑反应快慢，也包括后天环境中的运气成分。有人从五岁开始学围棋，而你从15岁才开始学，那你的努力就要困难很多很多，网球和足球就是这样了。个人天生的条件就特别出类拔萃，从小又能得著名师，然后一路不
    Kohl 地成长，这样的条件很难满足。所以就算现代社会学网球很容易，顶尖高手也不会特别多。


    而更重要的一点，在我看来，是竞技体育是个胜者通吃的市场。如果你 Sho 了 21 岁的时候达到了世界排名第一，各种什么商业合同、广告代言都来找你了，身后一个大团队指望你吃饭，你有充分的理由保持竞技状态，你会毫不松懈地继续苦练。而与此同时，你的同门师弟，水平其实跟你大体上不相上下，要是在你俩之间比的话他大概赢30%输70%——而就因为这么一点点劣势，他21岁这年世界排名第九。


    他没有赢得多少奖金，没有大合同，他请不起你那样专业的教练和后勤保障团队。他坚持打了几年，成绩起起伏伏。最好的时候得过一次温网亚军，但很多时候排名在前十之外。那你说他怎么办，也许退役是理性的选择。


    但这仍然是一个充分竞争的市场。这表现在职业体育很少有什么绝顶高手。纳达尔并没有打遍天下无敌手，他参加的每场比赛决赛都有悬念，顶尖高手之间输赢都属于正常。


    的确是，就算是充分竞争，占据了好位置的选手也有很大的优势去继续保持那些位置。只有自己的衰老和别人的创新能让他们离开。


    # 来自日课：难题的“视角”


    读者一人一世界：


    我是一名211大学的毕业生，学的管理学，高中的时候数学和物理都不错，工作的时候接触了几次量子力学，在网上找了一些视频了解了一下，找到了高中时对物理学的那种感觉，就想系统性的渐进式学习量子力学，只是不知道从何入手，不知道万老师有什么建议吗？


    万维钢


    量子力学有两种学法。一种是训练物理学家的方法。你需要拿一本专业的物理教科书学习，要理解其中所有的意思，要做其中的习题，为此你还需要很好的数学和普通物理学基础，你要全身心投入……最好的办法就是去物理系学习。


    对此我有一个个人经验。我在物理系上大二的时候，提前一年，跟大三的学生一起上的量子力学课。期中考试的满分是130分，我考了115分排第一，而全班六十多人，得分在60分以上的只有三人。我说这个并不是想证明我有多厉害——我想说的是，即便如此，我后来也不是什么了不起的物理学家——我只是个普通的物理学家。专业学习量子力学就有这么难。我怀疑在物理系毕业的学生之中，一半以上，根本没有真正懂量子力学。


    所以我不推荐业余选手使用这个方法，想靠量子力学吃饭是很很很难的。我建议你把量子力学当成一个文化思想来把玩，平981时多读一些科普的书，而不用去计较数学上的细节。这样做，你可能永远都无法真正理解量子力学——不过这没关系，量子力学这个东西实在太神秘莫测，事实上没人敢说自己真正理解量子力学。


    也许我们应该把“理解”当成一个值得经历的历程，就好像欣赏什么艺术一样，永远都能看出新意来，岂不是更有意思。


    # 来自日课：如果心能养生，你应该怎样三省吾身


    读者 多维观道：


    安慰剂针对于是大脑可以发出的信号与身体与之反应，强调的控制与调节。那么，举个例子，08年金融危机股市不好，但美联储搞了一系列政策，比如量化宽松等等，这对于经济本阿发展是否会更好？有没有安慰剂效应？


    万维钢


    宏观经济的确存在安慰剂效应。2008年金融危机之后，股市一直持续不振，美联储搞了所谓“量化宽松”的政策，给市场注入流动资金，这样搞了几年之后，美国股市果然获得起色，而且还迎来了持续数年的牛市。现在有很多经济学家认为，美联储的这个量化宽松注入的资金非常有限，就算是你考虑到乘数效应也不会有这么好的效果，市场最初之所以变好，很可能就是因为投资者*以为*这个量化宽松政策会有作用，从而*预期*市场会变好，从而有了更大的信心，从而更乐意投资，结果因为有了这些信心十足的投资者的资金注入——而不是量化宽松的那一点资金——导致市场真的变好了。


    也就是说，量化宽松很可能是个安慰剂。在经济不振的时候，政府主动做一些能提升士气的事情，也许会有好的效果。也许“信心”对市场就是有这么大的作用。


    但安慰剂效应再强，如果经济基本面不行，失业率居高不下，物价飞涨，中小企业纷纷倒闭，老百姓经济自由度正在变低，那肯定也没用。说“量化宽松是一个安慰剂”也许有道理，但要是说“美国股市这些年的上涨全靠了量化宽松这个安慰剂”，那就如同说“一个肿瘤病人的肿瘤消失不是因为手术而是因为正念冥想”一样荒唐。


    心态很重要，但是有病治病也很重要。如果一个人真的病了，却不积极治疗，整天幻想自己没病，甚至谁敢说他有病就要封人家的口，我认为这不是心态养护，这是心理疾病。


    读者 Vivian：


    万老师，我有一个问题：如果大脑这么厉害，为什么不能够直接指挥身体分泌激素，治愈疾病，延缓衰老，甚至直接自我进化呢？是什么机制阻止了它这么做呢？


    万维钢


    因为直接指挥并不是一个好机制。我们身体的各种激素分泌都是自动化的，食物不足的时候分泌一点饥饿激素，面对突如其力的容器当分沁一尘皮质醇，这些激素有利于我们的身体在这些情况之下做出正确反应，比如尽可能多吸收一些脂肪储备起来，或者加速血液流动和氧气供应，为战斗或者逃跑做好准备。


    这些自动的机制本来没毛病。不可能说遇到相关的情况，还得先请大脑下一个有意识的命令，再分泌相关的激素——动物、包括人类的大脑都没有那么先进的意识。这些自动机制有利于我们的生存。


    而这些机制之所以出问题，是因为我们生活在现代社会。我们的身体不是给现代社会这种好日子准备的，自动化的激素分泌机制不适应现代化的物质和精神生活。无比丰富的食物，和“持续的精神压力”，这些都是动物世界和原始人根本就没有的东西。


    人类真正过上这样的日子，也仅仅是工业革命以来这一两百年之事儿。也许未来的 人能找到主动控制激素分泌的方法……事实上我们现在对安慰剂和反安慰剂效应的研究，就是在探索这些方法。


    # 来自日课：决策者的气质


