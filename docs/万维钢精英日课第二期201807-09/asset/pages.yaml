  md: '# 日课196 | 《激进包容》6:"为人民服务"与现代化管理


    日课196 | 《激进包容》6:"为..."


    今天咱们把邓普西和布莱夫曼的《激进包容》这本书讲完。咱们精英日课专栏解读的都是英文世界的東西，但是我们的视角是中国人的。而这本书给我一个特别突出的感觉，我就觉得这本书里说的先进管理经验，在中国其实都曾经有过实践。有些事儿其实我们都曾经做过，但是我们当初的总结，未必都能引起这个时代的共鸣。


    中国历史上曾经有一支军队，一开始的兵源素质也不高，人员条件比美军中差最差的部队都差得多。可是这支军队却在很短的时间内完成了组织管理的现代化 —— 他们找到了共同的目标，消除了身份等级，特别讲团结讲纪律讲奉献，每个人都充满荣誉感。


    他们得到了热烈的支持，他们在各界都有很多朋友。他们从一支经常打败仗的队伍变成了一支专门打胜仗的队伍。


    这支队伍，当然就是毛泽东的队伍。


    "现代化管理"没有秘密。如果有一个做法是對的，通常全世界的智者都能看出来。被西方人称为"邓佐拉斯定理"的东西，咱们中国人叫"勾股定理"—— 两边都是独立发现，说不上谁学谁。


    也许现代化的方向都是一致的。请允许我斗胆比较一下邓普西的经验和毛泽东的管理思想。


    # 1.Make it metter


    邓普西在伊拉克驻防期间，有一段时间几乎天天都有士兵阵亡，队伍的士气很低落。每次士兵阵亡的消息传回来都同时带来两种情绪。一个是恐惧，士兵担心自己会不会是下一个。一个是负罪感，大家共同战斗，结果队友死了自己还活着，感觉很对不起队友。


    对邓普西来说这可不是能打胜仗的情绪。一个大好青年交给你，你给带到异国他乡打一场对国内很多人公来说说莫名其妙的战争，结果却死了。邓普西怎么解释呢？


    邓普西想到电影《拯救大兵瑞恩》里的一个场景。这个电影的大致故事是瑞恩家有四个兄弟，其中三个都战死了，只剩下瑞恩一个还活着，结果还深陷敌占区。美军说不能让这一家四个儿子都死了，就派了一个小分队去把瑞恩救出来。结果任务终于完成，瑞恩安全了，可为了救他小分队的人几乎都死了。


    这个场景是瑞恩问小分队的队长，说为了救我一个人死那么多人，这值得吗？


    队长的回答特别好。他没说不值得也没说值得，他说的是"Earn this" —— 他说"你要让它值得"。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_55_0.png)


    牺牲的人已经牺牲了，活着的人的使命是让这些牺牲有意义。邓普西深受启发，他也想出来一句話鼓舞士兵："make it matter" —— 让它值得，不要让我们的战友白死。


    邓普西要求，如果哪天有战友牺牲的消息传来，就必须在部队餐厅的大屏幕上打出这位战友的名字，然后大家一起为这个战友默哀几分钟。而接下来一旦条件允许，就要开一个追悼会。邓普西会在追悼会上告诉士兵们要"make
    it matter"。


    邓普西觉得这还不够，于是又做了一些小卡片，卡片上印着阵亡士兵的名字、简单的个人信息和照片，卡片做得很精致。邓普西随身携带着这些卡片。后来随着牺牲的士兵越来越多，这些卡片在口袋里装不下了，邓普西又用一个盒子来装卡片，盒子上面刻着"make
    it matter"。再后来连盒子都不方便携带的时候，他就每天随机地从盒子里抽取几张卡片随身携带......一直到现在仍然这么做。


    这就是上一讲中我说邓普西"软"的一手。这可不是故作姿态，这是思想工作。


    # 2.三个领导力本能


    我们看邓普西作为一个领导有个特点，他非常在意手下是否能理解自己做的事儿的意义，他不厌其烦地给士兵讲道理，这种作风似乎跟咱们中国人现在习惯的企业领导很不一样。事实上，邓普西的思想工作至少有三点
    ——


    第一，你得告诉士兵你是谁、你的价值现是什么、你想干什么。你得让士兵把你当做榜样。


    第二，你要给士兵上升和成长的空间，让士兵知道他能变成一个更好的人。


    第三，你得把你的知识分享给士兵。你要随时告诉士兵现在是什么情况，让每个人都清楚自己做的事情对团队的总目标来说有什么意义，让每个人都知道他为什么现在要干这个。


    简单地说，就是邓普西是把士兵当做有思想、可改变、可争取的"人"，而不是当成可以随意揍弃的棋子。


    这本书总结了所谓"三个领导力本能"，你乍听之下会觉得是老生常谈，可是不妨想想，真正这么做的领导能有多少 ——


    第一是倾听。能带来巨大成功的机会和能导致惨痛失败的弱点往往都在细节之中。领导人不可能单靠自己去发现这些细节，他必须指望手下人告诉他。而要想让人有事愿意告诉你，你得让人知道珍视他们的声音
    —— 你得建立"密切联系群众神经元"。


    第二是放大。好东西值得放大音量讲。刚才说的邓普西的思想工作就是"放大"。放大能让团队建立共同的目标和价值观，能让团队行动更可预期。


    第三是包容。这本书的标题就叫《激进包容》，那到底什么是包容呢？我们前面讲了用分享和下放权力的方法包容，用建立平等的职务体系包容，用归属感和互信包容 —— 其实包容就是让别人加入我们，就是给人赋能。


    至此《激进包容》这本书就讲完了，现在说说我的一个观察。


    # 3.送葬与追悼会


    我读到书中邓普西给士兵开追悼那一段的时候，就不断地想起我小时候背过的一篇课文，毛主席写的《为人民服务》。绝大多数人读这篇文章可能都以为这是号召我们去多作为人民服务，但是这篇文章似乎还可以用来另一个视角读。


    这就是管理学的视角。《为人民服务》其实说的是现代化的队伍管理，而邓普西的做法和《为人民服务》里的方法有高度的一致性。


    毛主席说："今后我们的队伍里，不管死了谁，不管是炊事员，是战士，只要他是做过一些有益的工作的，我们都要给他送葬，开追悼会。"


    邓普西的做法也是开追悼会。那你说开追悼会这难道不是显然应该做的吗？真不是显然的。这两个人说的开追悼会和一般的送葬有本质区别。送葬是关系好的人表达一下感情，开追悼会却是借机教育活着的人。


    这个教育就是我们做的事情的意义。


    毛主席说："人总是要死的，但死的意思有不同。中国古时候有个文学家叫做司马迁的说过：人固有一死，或重于泰山，或轻于鸿毛。为人民利益而死，就比泰山还重；替法西斯卖力，替剥削人民和压迫人民的人去死，就比鸿毛还轻。张思德同志是为人民利益而死的，他的死是比泰山还要重的。"


    邓普西的做法是发明了一句口号，"make it matter"。两个人的意思都是人不能白死。"比泰山还要重" = "make it matter"。


    毛主席说："我们都是来自五湖四海，为了一个共同的革命目标，走到一起来了。"


    邓普西的做法看到团队各有各的想法，他就问了大家一个问题："我们最重要的一件事是什么？"他说我们不是机械师、飞行员和厨子，我们都是特战兵。这不就是来自'
  merge: -1
