  md: '# 答读者问37 | 如何平衡产品的体验与快速迭代的需求


    答读者问37 | 如何平衡产品...


    # 读者@DeamoV：


    吴军老师，我最近在学习机器学习，学到了HMM的时候接触到了维特比算法，现在有一个疑问是：机器学习的前提是认定这个世界是显性的或者隐性的存在模型，即一种模式，也就是说我个人的理解中，机器学习的前提假设是学习的事件不是随机的。


    所以在这种观点下重新审视赫拉利的三部曲，就觉得如果用机器学习来完全管理生活的话，有点像薛定谔的猫的感觉，模型通过人的行动来预测，但是同时模型又干预了人的行动和认知，反过来又会干扰到预测模型。


    这样子来看，即便未来发展到所有的数据都能采集，甚至脑电波都能分析，还是不能够很好地预测和分析。吴军老师您怎么看这个问题呢？除此之外，还想知道吴军老师认为世界上随机的事情多还是不确定可预测的事情多呢？


    # 吴军


    这其实有三个小问题。


    首先，机器学习分两种。第一种是有模型和参数的学习，也就是你说的显性的模型。在历史上，地心说模型、日心说模型，都是这一类。当然，模型和真实情况并不一定一致，只是在误差范围内简洁地概括了真实情况。而在过去，人需要想出模型，再通过实验来参数。


    # 读者@王小二家的猫：


    最近看到一位产品管理大师的书中说道：我们想要开发的功能，总比可以投入的资源要多。其实这就涉及互联网行业一直强调的小步快跑、快速迭代的敏捷开发的探讨了：事情总是可以不断优化的，但为了企业的整体效益我们又不得不采用快速迭代的方式来实现。


    # 吴军


    想要开发的功能比投入的资源多，首先要做的是把不必要的功能删除掉。至于你说的互联网行业一直强调小步快跑，这是腾讯的提法，世界上其他很多互联网公司并不这么做，特别是一个公司比较大了之后，既不需要这么做，也不可能这么做。即便是腾讯自己，你看它最近5年是否推出过新产品，就知道了。因此，小步快跑的说法，只适合公司的早期。


    # 读者@曹一白：


    从《硅谷来信》到《谷歌方法论》，常听的还是与工作和方法相关的来信，对于和工作和做事方法以外的，匆匆略过，是否学习得太功利性？生活的爱好是怎么产生的呢？是不是因为工作和爱好也是互助互助的两个方面，只是因为我们没有找到切入点。


    # 吴军


    那样子的话，确实太功利了。我在接下来的来信中，会专门讲一次这个问题。


