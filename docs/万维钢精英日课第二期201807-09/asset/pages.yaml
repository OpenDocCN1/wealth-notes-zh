  md: '# 答读者问 | 怎样加强认知工具的连接？


    # 来自日课：文无第一，武无第二


    读者 Aaron：


    请教万老师，多样性的超加性很容易理解，但不同工具箱之间的连接很多时候并不容易建立，有没有什么实用的方法可以加强这些连接呢？


    万维钢


    自己平时多储备一些工具，遇到问题想起来什么用什么，这是一个比较自然、但是可能效率不高的做法。更高效的方法也许是主动制造一些连接。


    比如说，我们以前讲过蒂姆·哈福德的《混乱》这本书，其中提到有个音乐家叫布莱恩·伊诺，他就善于主动制造连接。伊诺的做法制作一打卡片，上面有各种创作思路，比如说什么“强调缺点”、“只要部分、不要整体”之类。这些思路都是伊诺非常熟悉的，但是要用到的时候未必能想起来。在音乐创作过程中，如果他感到灵感枯竭了，就会随机地从卡片中抽取一张，有时候就能用上。


    再比如说小说家，一定会积累很多很多故事素材，特别是一些历史掌故。也许你写一个讲述未来世界政治斗争的科幻小说，如果需要一个剧情让主角打怪升级，你可以把一个明朝故事改换面试试。这种真实发生过的事儿，用在小说里是最有力量的，有见识的读者看到也会会心一笑。


    要做到这些，最起码你得建立一个“工具箱意识”。第一是知道自己的工具箱里有什么，第二是随时看到好东西要收为己有。就好像玄幻小说里的道士斗法一样，随身携带各种法宝，一个不好马上还能拿出另外一个。第三，才是像伊诺那样设置一些提醒的办法。


    工具的数量是决定性的。生活和工作中遇到什么难题，有的人一头雾水，有的人却奇计百出一下手就能给你提出三五个可尝试的方案。并不见得这两个人大脑的运算速度有什么区别，更关键的还是肚子里有多少料。


    读者 代成龙：


    看似无法连线的学科，如果连线了，是否更不容易被覆盖？


    万维钢


    是的。不容易发生的连接——顾名思义，一旦发生了，那就是很不容易的，肯定不容易被别人覆盖。但是不容易被覆盖的东西不等于就有价值。


    比如说一个四十岁的男数学家，他有个业余爱好是跳拉丁舞，这个技能组合就非常罕见——他是最擅长跳拉丁舞的数学家，也是最懂数学的拉丁舞者。但是数学和拉丁舞的确是无法连线。当然我们我们不能排除数学在拉丁舞中的作用，不过我敢打赌，在可以预见的未来，拉丁舞用不上微分几何。


    所以我们不应该强行连线。两个技能连线，得能产生有价值的化学反应，那才有意思，才是真正的稀缺。


    这样的稀缺在哪里呢？我认为不是“不容易想到”的组合，而是“不容易做到”的组合。


    比如说，管理才能，是一种通用的技能，不管你从事什么领域都能用上。管理才能本身并不稀缺。但是在科学家身上，管理才能就比较稀缺了。很多人之所以选择搞科研做学问就是因为他不愿意跟人打交道——但是事实上搞科研做学问也需要一些善于跟人打交道的人。


    要想管理科学家，首先你自己得是一个科学家，否则你根本不服你。商学院里懂管理的人再多也当不了物理研究所所长。这就出现了一个我们前面说的《最需要的人没有，最有的人不需要》的局面。科学家不爱管理，这简直就是一个性格设定。


    但是有些科学家就能打破这种设定。他们年轻的时候非常专注，以至于能在学术上取得了不起的成就，但是等到需要他们带学生、管项目、跟各方搞好关系的时候，他们也能学着去做这些事情，而且有的还能做得很好。


    如果有一个科学家，科研才能出类拔萃，同时又很善于跟人打交道，特别是具有大局观，知道现在钱在哓、人在哪、机会在哪，还能把人组织起来去做事，这样的人不当领导谁当领导？


    所以说真正的困难并不在于能不能想到五花八门的职业连接——大部分所谓既学习过“社交礼仪”又会制作PPT的“斜杠青年”都没性格。真正的困难在于一个人能不能既有性格，又能打破性格。


    读者 Alan：


    多样性的红利是不是也可以解释：做人不能太“功利”呢？假如凡事只用经济学 矛利权衡，而忽视了其他维度的考量，是不是反而难以达到目的呢？


    万维钢


    所谓“功利”，我理解就是做这件事不是为了享受做这件事本身，而是把它当做一个手段，最终目的是别的事，比如说工作是为了赚钱，学习是为了考试，买房是为了投资。


    首先，如果现在局面很明确，那功利性就是达到目的最有效的方法。比如高考就是非常明确的局面，为了分数而努力学习就是理所应当的。如果一个高三学生说我对物理学感兴趣但是我对物理高考题目没兴趣，所以我多看些科普书，我没时间做题，那就太唐突了。得分数不错，学有余力，再搞别的。


    但是伟大成就往往不是这种明确局面里产生的。梵高活着的时候一幅画都没卖出去，当时“印象派”根本就不是一个被市场承认的门派。伟大成就往往需要多年的努力，可是谁也不知道多年以后什么东西值钱。


    在这种情况之下，最终坚持下来的，往往都是本来就喜欢做这件事的人。但是请注意，如果据此说“兴趣”比“功利”更有效，你就陷入了幸存者偏差！因为功利者不会在不明确的方向上持续投入，所以最后你看到取得伟大成就的都是从兴趣出发的人——但是别忘了，绝大多数一辈子只凭兴趣做事的人，最终并没有取得伟大成就。反而是从功利出发的人，混得总不会太差。


    中国人过去这几十年忙着脱贫致富，大家都比较功利，没有产生什么大师。等到人们的生活普遍都很好的时候，就会有更多的人去根据兴趣做事，那时候中国可能会有很多创新——但是我敢说，平均而言，这些人的成就将会低于他们功利的父母。


    # 来自日课：怎样对抗进化


    读者 雾霾萧鲜：


    环境没有了选择压，一个组织相对来说稳定，是否也抑制了创新，扼杀了新物种的产生？


    万维钢


    是的！咱何可以学习六神磊磊的精神，我们也考察一些金庸小说里事情作为教训。《射雕英雄传》和《神雕侠侣》里有个全真派。众所周知，王重阳那个厉害，全真派的弟子那么多，势力范围极广，那为啥很快就衰落了呢？


    从演化的角度考虑，全真教有几个问题。


    首先是它有一个极其厉害的创始人。王重阳是第一届华山论剑的冠军，又掌擂当时最高级的武术理论。这使得全真教认为王重阳思想就是颠扑不破的武术真理，他们有充份的自信。全真教弟子只能用全部身心去学习和敬会王重阳思想，根本不敢质疑。


    第二，全真派的势力确实强大。王重阳本人的江湖地位极高，丘处机等全真七子也都是很不错的人物，江湖上并没有哪个门派对全真派构成强大挑战。在这种情况之下，全真派的确是没有多少演化的“选择压力”。只有自己最正宗，一切外界的武功都被认为是邪魔外道，全真弟子不能兼收并包，故自封死，又怎么可能把武术理论发展壮大呢？


    第三，在追求稳定的大前提下，全真派论资排辈现象非常严重。谁当领导，不取决'
