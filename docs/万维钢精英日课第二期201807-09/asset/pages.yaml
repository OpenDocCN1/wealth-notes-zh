  md: '# 日课220 | 《多样性红利》5:文无第一，武无第二


    今天咱们继续讲斯科特·佩奇的《多样性红利》。前面我们讲了“多样性优于能力”的原理，和“多样性认知工具箱”中的四种工具，今天的主题是我们应该怎样利用多样性。


    佩奇这本书的一个重要特点是其中有一些有意思又不太难的数学，咱们还是先从几道数学题说起。


    # 1.多样性的“超加性”


    以下这三个数列都是按照一定的规律排列的，请你猜一猜数列中的 X 是什么数。


    第一题：1，4，9，16，X，36


    第二题：1，2，3，5，X，13


    第三题：1，2，6，X，1806


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_124_0.png)


    # 2.三人行必有我师的数学原理


    你注意到没有，生活中有时候会有像石头剪子布一样“循环相克”的现象。比如满清末年中国流传一个说法叫“官怕洋人、洋人怕百姓、百姓怕官”；在足球比赛中，也常会有“A队怕B队的逼抢，B队怕C队的技术，而C队又怕A队的身高”这样的局面。


    出现循环相克的根本原因，就在于他们比的不是一个单项技能，而是一个工具箱。


