  md: '# 日课191 |《激进包容》

    3: “大一统”统一什么？


    日课191 |《激进包容》3: “…” ↓


    今天咱俩继续讲《激进包容》这本书。


    咱们中国人特别强调“统一”，自古以来都是以“大一统”为核心价值观。国家领土要统一，文化认同要统一，正所谓“团结就是力量”、“心往一处想劲往一处使”，这些当然都是很好的。但有些似乎好像有矛盾。比如我们一方<|message|>
    经常说要“思想同步”，另一方面也爱说要“百家争鸣、百花齐放”，要“集思广益”，要“三人成虎...”


    那比如说你有个团队，团队的思想到底应该怎么统一呢？


    按照《激进包容》这本书里美国人的理论，也许真正应该统一的是“归属感”。


    # 1.归属的本能


    书中讲到一个实验，你很可能以前就听说过。科学家邀请受试者在计算机上玩一个传球游戏，三个人一个球，互相传来传去。受试者不知道其他两个人其实是计算机模拟出来的，他还以为是在和真人传球。在玩游戏的同时，受试者的大脑被连接到功能性磁共振机上，这样科学家可以观察他大脑的哪个区域在活跃。


    传着传着，另外两人就不给受试者传球了，他们俩在那玩。受试者被冷落了。这时候科学家就注意到，受试者大脑中的“前扣带皮层（ACC）”区域亮了。


    这是负责痛苦情绪的区域。被别人排斥在外，你会感到痛苦。不但是痛苦，做出这个游戏马上测智商，发现受试者连智商都下降了。


    有人做过大规模的调查研究，一个人的社交网络质量——比如有没有家人、有多少亲密的朋友——对他的健康和寿命非常有影响。被社会排斥的健康危害比肥胖、不锻炼身体、酗酒对身体的损害都要大，只有吸烟能与之相提并论。


    人是一种群居动物，需要有所“归属”。评价自己人生的意义，最关键的就是被群体所吸纳。每个人都有归属感，可能归属于家庭、归属于单位、归属于组织、归属于国家。


    由此可见归属感是人之常情，根本不需要教育。我们看中国队比赛自动就希望中国队赢，这不是无私，这是本能。在一个单位干了几十年的人一定会对这个单位产生感情。哪怕这个单位待遇不好工作特别累，他也不愿意离开。而如果单位要把他辞退，他会非常难以接受。


    这大概就是为什么有些明明不怎么样的领导也有一大帮忠诚的属下。“归属感”让领导力更容易。


    但归属感可不见得天然就是属于领导的。年轻人的归属感，你就很难争取。有人做过研究，在18-28岁的这个年龄段的年轻 人，差不多就是现在的“90后”，他们的归属感是不稳定的。互联网时代年轻人的归属感可以来自任何东西，比如某个动漫社区，而不见得是现实中的工作单位。


    在这个年轻人一言不合说辞职就辞职的年代，归属感，需要争取。


    # 2.人心是收买来的吗？


    怎么争取别人的归属感呢？咱们中国的故事里有一些收买人心的剧情，我看根本上不了台面。


    一种故事是一个身怀绝技的小人物在底层挣扎，日头快要过不下去了的危急时刻被一个偶尔路过的大人物出手相救。可能大人物替小人物还了一笔债，或者是出钱给他母亲治好了病，小人物就会感恩戴德，从此终生服务于这个大人物。


    还有一种故事像“绝缨会”，说一个武将 在国君的宴会上调戏了国君的女人，但是国君宽恕了他，他默默铭记于心，感恩戴德。


    或者给予人施以恩惠，或者纵容别人的错误，来换取归属感，这种剧情有点low了。大人物举手之劳，小人物动不动就“愿为将军效死”，故事的结局往往就是这个小人物为大人物而死了。


    只有一个故事，我看是上了层次。说吴起这个人非常爱士卒，他有一个士兵背上长了个毒疮，吴起居然会给这个士兵吸吮脓液。人都说吴起长官是好人——可是这个士兵的老母亲一听说就哭了。她说我丈夫当年就是因为吴起给他舔了伤口，为吴起战死了，现在吴起这是又想要我儿子的命啊！


    你付出一點小小的代价就想收买人家一条命，难道老百姓真不明白吗？这样操作真的好吗？


    我看像这种建立在个人恩义上的忠诚系统，根本不适合现代化的团队合作。现代化的归属感是归属于某个集体或者某个价值观，而不是某个个人。


    但领导跟下属建立一种友好关系也不错，咱们看看邓普西在美军是怎么做的。


    # 3.邓普西的正能量


    1975年的邓普西还是一个中尉，在西德的冷战分界线驻守。一个星期天，呐所谓来了个年级比较大的修女，说是从离这最近的村庄步行十英里走过来的，她请求给邓普西的士兵做祷告。邓普西觉得这事儿有点怪就没同意，修女说你们既然没时间那我下次再来。


    两周后又是一个星期天，修女又来了，邓普西这次同意她进入军营。修女进来看见有个篮球场，有些士兵正在打篮球，就想先请着这几个士兵祷告。邓普西有点紧张，……他倒不是担心修女，他是担心修女激怒那几个士兵。


    原来篮球场上这些士兵因为不守纪律经常捣乱，已经不参加正式训练了，邓普西正打算哪天把他们都送走。邓普西跟修女说咱们还是先找别的士兵吧。


    但是修女执意上前，对那些士兵说你们愿不愿意跟我一起来做个祷告。士兵们很不耐烦，可是修女说得很真诚。一起来做了祷告之后，修女还问了士兵们的家庭情况，问寒问暖。她从此之后每周都来，就这样慢慢地和军营里每一个士兵都建立了联系。


    第一次回去的路上，老修女问邓普西，你是不是已经放弃篮球场上那些士兵了？邓普西的本能反应是说我没有，但是接下来内心也在想，自己好像真地已经放弃这些士兵了。老修女和他说，“永远都不要放弃任何人。”


    多年之后，邓普西遇到当初篮球场上的一个边缘士兵。他已经是一个优秀的军人，当面感谢邓普西给了他第二次机会。


    你看这不就是《士兵突击》里那个“不抛弃、不放弃”的正能量吗？可见人同此心，人心可以争取，不用收买。


    邓普西给的建议都是平时的一些小事——


    +   * 在走廊里与士兵相遇，偶尔和他聊几句，拉拉家常，比如问问对方父母的情况怎么样；

    * 在会议上真诚地表扬；

    * 倾听对方声音和意见；

    * 主动传授知识和经验，给些一对一的指导；

    * 随时向人表示感谢，甚至手写一个感谢便条；

    * 在不事先通知的情况下探访前线士兵。


    这些都是真诚的、而且是平等的交流。你不用收买更不用违到底原则，但是你给下属的却是你最宝贵的资源，那就是时间。


    # 4.归属感是什么


    两位作者说，归属感，有三个部分。


    第一，它是身份的认同。说白了就是我身上的标签。我是中国人，我是一个哈尔滨人，我是哪个大学毕业的毕业生，我是哪个工作单位的……按理说我就就是我，可每个人同时又代表这些标签。我们专栏前面有一篇文章叫《自由人和依存感》说的就是这个道理，我们出生的家庭、社区、故乡、种族、国籍，是你无法选择也无法摆脱的东西。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '导能给你解决。


    第三，它能带来秩序，提供行动的可预测性。不一定非得“一切行动听指挥”，但是团队要是没有秩序，高兴了活干得特别快，不高兴这活就没人干，肯定是不行的。


    有了归属感，团队成员才能发自内心地听你领导。有归属感的人会自愿为集体服务。形成了秩序，工作才能稳定地推进下去。下属有了安全感，领导才有安全感。


    这本书提出，建立团队归属感最重要的东西是“共同的回忆”，这些回忆来自五个方面——


    +   1. 成功。我们一起完成了一项了不起的事，每个人都作出了贡献，而且每个人都知道他的贡献对于我们集体能干成这件事非常重要。这样的回忆会给人很大的鼓舞。


    +   2. 失败。失败会让人成熟。一起经历过失败，谁也不推卸责任，大家都知道失败是什么样的，团队会变得成熟。


    +   3. 关心。通过一些事情让人感觉到集体很关心自己，这样就有了安全感。


    +   4. 正确的做法。当你作为领导面临一个艰难选择的时候，你要让你的团队看到，你是如何做出正确选择的——这样下次他们遇到类似情况，也知道应该怎么选。


    +   5. 错误的做法。当有人犯错的时候，团队一起来体验这个错误，下次就知道这么做不对。


    这些共同的回忆使我想起了希思兄弟的《强力瞬间》。


    以我之见，领导和下属都有安全感的组织不需要“思想同步”。有共同的归属感而各人思想自由，这叫“君子和而不同”。每个人想法都很相似，大家都对这个集体缺乏认同，那叫“小人同而不和”。


