  md: '# 日课222 | 《多样性红利》6:多样性的噩梦


    日课222 | 《多样性红利》6:多样性的噩梦


    今天咱们把斯科特·佩奇的《多样性红利》这本书讲完。我们前面一直在讲多样性的好处，而今天我们要面对多样性可能带来的一大问题。


    为此我想先讲一个故事。这件事来自博弈论专家布鲁斯·布恩诺·德·梅斯奎塔的《预测师的博弈论》（The Predictioneer’s Game）一书，据说是作者——以下我们简称他为“布老师”——的亲身经历。


    这是一个吵斗故事。


    从前有个公司，老CEO，咱们干脆就管他叫张总吧，马上要退休了，公司董事会准备投票选出一位新的CEO。候选人一共有五位，我们干脆叫他们老马、老赵、老李、老陈、老王。董事会说了算的一共有五位董事，他们人手一票。张总非常清楚这五个董事心中对各个候选人喜好程度的排序，但是他不喜欢这个排序。


    这五个董事心目中的CEO选择顺序是下面这样——


    +   1. 马、赵、李、陈、王;

    2. 马、王、陈、李、赵;

    3. 王、马、陈、李、赵;

    4. 赵、王、陈、李、马;

    5. 李、赵、陈、王、马。


    很明显，如果直接投票，老马将以两票当选可是张总非常不喜欢老马，张总最喜欢的人选其实是老陈，可是老陈在所有董事心目中的排序都没有进前两名，真是不行啊。张总花费重金，请布老师给出个主意。


    布老师是斯坦福大学胡佛研究所的研究员，还是纽约大学的政治学教授，同时自己开了一家咨询公司，专门给政府和企业提供战略咨询服务。布老师一看这份名单，乐了。


    布老师说，张总，你作为现任CEO，是否有权决定选举的议程？张总说那肯定有啊，我说怎么选就怎么选……可是选举还是符合要少数服从多数的原则，否则难以服从啊。


    布老师说，这就好。你要这么、这么、这么办……


    选举这天，张总亲自主持会议。张总说，据我了解，大家对人选的意见比较有分歧，没有候选人达到了绝对的多数，所以我建议，咱们用两两对决的方式、一轮一轮地选，这样每轮的赞成票都能超过半数。董事会说可以啊。张总说，既然老马和老王是最热门的两个人选，咱们第一轮就让老马对老王。


    老马在两个董事心中排第一位，但是老王在3、4、5号董事中的排序顺序都高于老马——结果第一轮投票老王胜出，最大热门老马惨遭淘汰！


    第二轮，张总让老王对老赵。结果老赵以3:2又淘汰了老王。张总笑而不语。


    第三轮，张总提议让老李上，结果老李3:2淘汰了老赵。


    至此只剩下老李和老陈两位候选人……结果最后一轮老陈3:2战胜老李。张总宣布，经过董事会的层层选拔，整个选举过程实现了公开公平公正的原则，程序合法，老陈，当选CEO！


    董事们面面相觑，完全不知道发生了什么。怎么不声不响的老陈就当选了呢？而且还是我们选的！


    # 1.偏好与理性


    现在有很多心理学家和行为经济学家认为人是非理性的，但是也有不少传统经济学家坚持认为人在绝大多数情况下是非常理性的。经济学家对“理性”有个非常简单的定义——


    你知道你想要什么。


    比如说你想要省钱。现在有两台一模一样的iPhone X，一台要价10000元，另一台要价9995元，那么你就会选择第二台。这就是理性。


    你有所偏好，并且能够按照自己的偏好做出选择，你就是理性的。当然，作为理性的个人，你的偏好必须具有“可传递性”：如果你认为苹果比香蕉好吃，橘子比苹果好吃，那么你就应该认为橘子比香蕉好吃。也就是说——


    如果 A>B, B>C, 那么必然有 A>C。


    # 2.群体有偏好吗？


    我们专栏以前讲启蒙运动的时候说过一个道理，所谓“国家利益”，其实是个幻觉。个人有利益，国家其实没有利益。翻译成今天的数学语言，那就是个人有偏好，但是由个人组成的群体，是没有偏好的。


    +   1. A>B>C

    2. C>A>B

    3. B>C>A


    那么我们看看这三人组成的这个群体，对A、B、C三个城市的偏好是这样的。如果是投票表决，那么在A和B之间选择的话，A会以2:1战胜B，所以群体认为A>B，对吧？


    A>B, B>C, 同时 C>A！偏好的可传递性，哪里去了？


    群体没有偏好。这就是著名的“阿罗不可能定理”，由肯尼斯·阿罗证明，阿罗不可能定理是社会科学中最大的悖论之一。你每次听人说什么“集体的决定”或者“群体的利益”，应该首先想到这个定理。'
