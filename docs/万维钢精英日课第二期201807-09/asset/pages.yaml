  md: '# 答读者问 | 工程师的“可见度”


    答读者问 | 工程师的“可见度”


    # 来自日课: 工程师的大道


    万老师您好，请问造成对工程师偏见的原因是什么呢？我的导师就很看不起工程师，经常教育我们研究生不努力毕业了就只能当工程师给别人打工。据我所知，很多科技企业里的销售人员也觉得自己的地位比工程师高。是不是国内这种现象更普遍呢？


    工程师的工作本质上是具有创造性的，他不是按部就班地常规操作，而是必须总要解决新问题，设计和创造新东西。工程师不是技术工人。


    事实上比较高级的工程师，不论是在中国还是在美国，他的收入都高于科学家、大学教授，以及大多数艺术家。那既然是一个高收入的创新工作，为什么被很多人认为地位不高呢？也许真的是因为工程师是在“为别人”工作。


    我来说说当科学家的好处。每个科学家本质上都是在为自己工作。你做出任何科研结果都是自己的，论文会署上你的名字发表，学术圈里都知道你是谁。你的名字、学术成果包括联系方式都可以随时搜索到，你根本不需要名片。具体在哪个大学或者科研机构落脚对你来说其实并不重要，你有很大的独立性，就好像球星一样可以随时转会。你跟分布在世界各地的同行展开合作和竞争，你这几天在美国开会，下周要去意大利访问。你几乎是自己决定做什么课题，而且几乎是凭兴趣决定。你奋斗努力很大程度上是为了给自己建功立业。系主任和研究所所长基本上管不了你一一他们还得感谢你给组织带来了科研经费和声望。将来就算退休，这个成果也是“你”一一而不是你所在的研究所一一做出来的。而且你还可以培养学生。当然收入未必会很高，但是谁在乎收入啊。


    大多数工程师没有这样的待遇。搜索一个工程师的名字，通常只能得到他在求职招聘网站 LinkedIn 上的页面。工程师为公司工作，如果有专利也属于公司一一而通常没什么专利，好不容易做个新产品过几年就被更新的取代了。


    科学家研究的是“自然现象”一一哪怕这个现象距离我们的生活非常遥远，它在本质上也是有趣的。只要你在其中做出贡献，你的名字就永远跟这个现象联系在一起。这就好比说哈尔滨附近有个小城叫“呼兰”，呼兰这个地方跟绝大多数人没有任何关系一一但是只要呼兰还存在，对呼兰的研究就永远都是有意义的。


    工程师研究的是工程师发明的模型。模型可以随时换，模型不是呼兰。


    在组织关系上，工程师是公司的雇员。我们在讲塔勒布的《利益攸关》这本书的时候有一期叫《雇员与冒险家》，其中讲到，雇员可以说是一种风险策略。为什么销售人员认为自己比工程师强？也许就是因为销售人员要更直接地面对风险。


    有极少数的工程师，因为身处创新前沿阵地，做出了开创性的东西，吸引别人追随他的路线，这样的工程师可以说是脱颖而出，会得到像科学家一样的可见度。但是如果你喜欢独立性和可见度，直接当科学家恐怕是更好的选择。


    # 来自日课: 硬件的大智慧


    为什么说“如果计算机起源于中国，从晶体管到 CPU 也许会是非常不同的设计呢”？如果对于硅的物理性质和定律是唯一的，假设信息论也是信息传递的基本规律，那么即使在中国设计出的
    CPU，考虑到物理定律和信息论的约束，设计出的结果会不会很大可能也和现在的一样呢？


    若计算机起源于东方文化，那么可能会长什么样？是以榫卯结构做开关、用二十四节气来运算，还是结合经络穴道来设计 CPU？难道今天计算机的样子没有必然性吗？


    直接由数学和物理学决定的东西不能改，但是作为一个工程产物，计算机还是有可更改的自由度的。


    # 来自日课: 分层与革命机会


    是不是可以理解为：我们租了第十层楼办公，地是别人的，楼下9层也租给别人了。我们在第十层楼搞好装修，有的装修比其他楼层还要好，但受制于地主（不租）和楼下业主（不让我们上楼）。我要想另外找块地，前提是找得到，然后自己设计图纸，再嘘一层一层往上修，还得自己再去租户。这是一条几乎不能实现的道路。'
