  md: '# 日课208 | 启蒙与此时8:"正常国家"的反击


    日课208 | 启蒙与此时8:"正... ↓


    今天咱们继续讲启蒙运动。戈德堡这本书为什么叫《西方的自杀》呢？他想说的是资本主义虽然看起来是一个理想的国家形态，但是它未必能长久存在。传统的国家形态有可能回来，扼杀资本主义。最后这一讲我们就重点说这个道理。美国，正在变成“正常国家”。


    今天我们要讲的这个道理对很多人来说可能有点颠覆，有点反常识。有些以为是常的事情，当你站在历史的视角上去看，就会发现其中大有问题。


    上一讲我们留下一个思考题，这道题咱们说的更温和一点：政府应该教育人民、引导人民吗？


    # 1.宪法与思想家


    上一讲我们讲到整个19世纪是美国资本主义的黄金时代，展现了资本主义制度的优越性。但是请注意，当时的很多人可不想这么看。资本主义有很多混乱的地方，工人、商人、社会各阶层的人都觉得生活不稳定，人生的各种意义都被剥离了，社会好像只认钱，人们背井离乡到大城市工作，就有一种乡愁式的的满情绪。想必你在欧·亨利和马克·吐温的小说里读到过这样的情绪。


    所以当时的知识分子就想，资本主义肯定不是最理想的社会形态，人肯定还可以有更好的生活方式。当时美国就产生了很多人反思资本主义的思想家，不过他们都不是特别有名，我们就不一一列举了，我们简单概括一下他们的思想。


    用一个词来概括这些思想，叫做“进步主义”。“进步”肯定是好词，启蒙运动就是要让社会进步——但“进步主义”，可不是赞美社会进步的意思。进步主义思想家要求政府应该*推动*社会进步。其实史蒂芬·平克就是一个进步主义者，但是他在《启蒙此时》那本书里并没有对进步主义作任何深入的讨论。


    到底咱们叫进步主义呢？进步主义有两个重要假设。


    第一，社会进步不应该由老百姓自己胡乱摸索，而应该用科学指导。


    第二，经济发展不能放任自流，不能什么都期望市场这只看不见的手，必须由政府这只看得见的手来调查和监管。


    简单地说，就是进步主义者认为社会是一个生物体，而国家就是大脑，应该由国家来判断哪个方向对，然后国家引导人民前进。


    启蒙运动认为人可以有理性，启蒙运动推崇科学，而进步主义者认为老百姓的理性和科学见识都不足，必须听国家安排。


    美国的进步主义者的这些思想其实也很自然。既然科学技术这么厉害，那我们为什么不能研究一下“社会科学”呢？我们为什么不能用工程学的方法来改造社会呢？


    这些进步主义者信心十足，他们认为资本主义太混乱了，个人主义太不像话，理想的社会应该讲合作而不应该讲竞争。他们认为政府应该管理每一个人，甚至还结合当时优生学的思想，认为社会应该只生产优秀的人。


    进步主义者认为美国宪法的理念、洛克的天赋人权思想都已经过时了——他们认为国家利益是第一位的，个人应该服从于社会。


    进步主义者主张美国应该设立各种专门的行政机构，由专家作为公仆在这些机构里任职。美国给这些公仆稳定的工作和丰厚的工作资，让他们安安心心为人民办事，说这样一来，公仆们就会一心为公，不会有个人利益的诉求。


    那哪些专家应该来当公仆呢？戈德堡说，专家那当然就是这些进步主义者自己。


    这就是“行政国家”的起源。进步主义运动的结果，是美国政府从此变得越来越大。


    # 2.威尔逊的改革


    把进步主义思想落实到行政国家的，是第28任美国总统威尔逊。威尔逊当选总统之后采取了一系列措施。本来美国是不收个人所得税的，从威尔逊开始个人就必须得给联邦政府交税了。威尔逊成立了美联储，成立了主管国内和国外的两个贸易部，设定了最低工资，禁止了童工，实行了强制的义务教育，政府各个部门深入于预市场，搞了各种监管和法规。


    很多这些措施我们今天看是很好的，像禁止童工和推广义务教育，肯定没问题啊——但是，请注意，威尔逊这些做法，已经违反了美国宪法。


    美国宪法规定国会是立法机关。通过立法制定政策，影响社会的走向，这个事情应该由人民选出的国会议员去做，这才能确保政策是人民的意志。总统的行政部门，只是执行这些政策。


    可是威尔逊这么一搞，很多政策就变由行政部门来制定了。当然行政部门会说我们是按照“科学”制定政策。


    好在美国的民主传统还在。威尔逊这一套不得人心，1918年的中期选举中共和党就占据了国会的多数，到了1920年，威尔逊这一派就彻底下台了。对行政国家的第一次努力就到此为止。


    然而到了30年代，美国经济大萧条给了罗斯福一个空前的机会。罗斯福建立了更多的政府机构，美国变成了一个行政国家。


    # 3.行政利益集团


    有人说行政机构已经成了美国“三权分立”之外的第四权，而戈德堡认为这还不足以概括美国行政集团的本质 —— 行政集团，本质上是一个平行的、影子政府，是民主体制之外，不受宪法控制的一个政府，他们有非常大的权力。


    联邦通信委员会（FCC）可以直接对电话业务征税。当时它拿税收所得做了很多好事，比如把电话网络铺设到不挣钱的边远地区——但是，这个税收也被用于部门利益。


    行政机构可以不经国会制定自己的法规。1960年美国行政法规总数共只有22,877页，到2012年行政法规已经达到了174,545页。行政机构对国家越管越严，而他们的人员不是民主选举出来，而是各个机构自己招募的人。


    用戈德堡的话说，美国这些行政人员已经形成了一个阶层，成了一个贵族集团，一个特殊部落。他们是美国的寄生虫。


    把这些人比作寄生虫并不完全是贬义。我们每个人的身上都有寄生虫。人离开寄生虫可能根本活不了。但是，请注意，寄生虫可并不是为你而活——它是为自己而活，它存在你的身体里，有它自己的利益。


    比如说，退伍军人事务部曾经爆出过丑闻，为了自己部门的利益造假文件，导致了一些伤残军人的死亡。可是你插手不了他们内部的事情。内部人员不会因为这个事情而受罚——而如果一个内部人员对外爆料这件事情，这个爆料者反而会被开除。


    行政部门已经成了铁板一块，这些公仆们哪怕工作能力不合格也几乎不会被解雇，职位几乎是终生的。就拿美国的公立教师系统来说，每个教师都说自己是一心一意为了学生，而事实是教师待遇几乎跟老师教的好不好没关系，全凭资历。


    这些行政部门的公仆们甚至有了有组织的政治诉求！比如国税局的员工就有自己的政治组织，大选的时候专门给民主党捐款和拉票——因为民主党总是主张多收税。


    表面上看，美国的行政机构非常廉洁，你说你要贿赂一个政府公务员，那几乎是绝对是不可能的。但是，受贿那种腐败只能算小腐败——真正的腐败是美国政府机构对行业以及得利益的保护。


    当美国的行政集团“监管”一个行业的时候，他们实际上是寄生在这个行业上的，他们同时也是在保护这个行业。最简单的方法就是发执照。我们知道在美国想当医生当律师实在是太难了，根本原因就在于想从事这些行业的人很多，但是执照非常有限。


    为何非得对医生搞那么高的限制？中国对医生要求没有美国那么高，可是中国医生的手艺并不差，甚至因为经验更丰富，可能比美国医生更好。严格限制执照发行，名义上是确保这个行业的服务质量，实际上是为了垄断这个行业，从而让从业人员...'
