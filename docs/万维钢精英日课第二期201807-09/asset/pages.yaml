  md: '# 日课218 | 《多样性红利》3:套路的“启发”


    日课218 | 《多样性红利》3···


    今天咱们继续讲斯科特·佩奇的《多样性红利》这本书里的“多样性认知工具箱”。上一讲我们说了“视角”，这一讲是“启发式”。


    “启发式”的英文是“heuristic”，这个词你可能听着有点别扭。其实不论中文还是英文，我很可能是到美国之前从来没听说过这个词。我甚至怀疑咱们中国文化里到底有没有这个词。但是如果你去了解一点认知心理学，启发式简直到处都是。


    什么叫“启发式”呢？从解题的角度，佩奇给的定义是“启发式是这么一个规则：在某个视角里，使用这个规则能够得到一个解——那么你受此启发，也许可以把这个规则用在别的问题上，得到别的解。”


    我把这段话翻译成普通话，启发式就是思维的套路。比如我最近劝妻子看了一点《延禧攻略》，其中有个剧情是皇后想除掉纯妃，但是她自己不动手，而是给魏璎珞提供机会……咱们中国人一看就明白，这叫“借刀杀人”。套路就如同武术里的招式和下棋的棋谱，是你一旦掌握了就可以不假思索地使出来的东西。


    当然“三十六计”什么的有点上不了台面，heuristic 有更高端和更基本的含义。查理·芒格总结了很多所谓“心智模型（mental models）”，就是高端的启发式。比如我们最近讲过做决策的一个“10-10-10”方法，就是一种心智模型。熟练掌握这些模型，你在面临各种决策的时候就不用现场手忙脚乱了，而且你知道哪些地方有可能是你的思维误区。顺便说一句，罗胖要弄一个“得到大学”，好像第一期主要内容就是芒格的这些心智模型。


    | 250 | 252 | 255 | 256 | 258 | 262 |


    图1-8 内莉的视角（单位：卡路里）


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_116_0.png)


    回到佩奇这本书。佩奇讲的是专门用于解决难题的启发式。在佩奇的这个系统中，“启发式”和“视角”是两码事。前面我们讲了，所谓视角，是你怎么看这个东西，相当于建立一个坐标系。那么启发式，则是有了坐标系之后，你怎么在这个坐标系里“走”。


    比如我们上次说的内莉做冰淇淋实验的例子。内莉想到去按照卡路里含量把不同的配方排序，这一il就建立了一个视角。


    那么下一步，在已知252卡路里的这个配方味道不错的情况下，想去考察它在这个视角下临近的几个配方，这就是启发式。'
