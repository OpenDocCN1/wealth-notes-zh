    今天开始咱们讲一本新书，叫《激进包容：后9/11世界教会我们的领导力》（Radical Inclusion: What the Post-9/11 World
    Should Have Taught Us About Leadership），作者是美国陆军四星上将、曾经担任过参谋长联席会议主席的马丁·邓普西（Martin
    Dempsey）和作家奥里·布莱夫曼（Ori Brafman）。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_39_0.png)


    嗨*别人的思想，那你应该怎么争取支持呢？这不仅是管理者如何领导员工，更是品牌如何领导消费者，意见领袖如何领导民意。做这种事靠小计算不行，你得用“大”学问。


    用中国话来说，这本书给的答案就是“团结各种各样的人，建立最广泛的统一战线。”“统战”这个词儿非常老，但是这个手段可不老。我看现在中国的很多企业家已经不知道什么叫“统战”了，所以咱们有必要听听美国人的思维。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_39_1.png)


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_39_2.png)


    我们将带给你“跟美军将领学统战”的特殊体验......但此书的第二作者——实际上应该是主要作者——布莱夫曼也是个不一般的人。他写过好几本书，平时主要从事管理咨询的工作，咨询服务的对象是政府的高官和大公司高管，喜欢谈论“战略级”的问题——当然你也可以管他叫高境界的忽悠大师。


    我们就先从布莱夫曼的事迹开始说。


    # 1.怎样推广动物保护


    如果你到美国上大学，你会注意到学生组织非常活跃，经常在校园里摆摊——不是摆摊卖什么“毕业学姐的被子”，而是为了政治、环保之类的公共事务争取支持。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_39_3.png)


    布莱夫曼1995年在加州大学伯克利分校上大学的时候，曾经参加了一个“伯克利学生动物解放组织”。这个组织的理念是抵抗i美国食品工业。我们知道现在牛肉和鸡肉的生产已经不能叫“畜牧”了，全是机械化的，牛和鸡从出生到被杀养过的都是暗无天日的生活......“伯克利学生动物解放组织”，就专门号召人们抵制这种工业肉。


    布莱夫曼加入组织的主要原因是他是个素食主义者。不但素食，而且是“纯素食”，英文叫“vegan”，意思是不但不吃肉，而且连奶、蛋都不吃，连皮革大衣都不穿，坚决保护动物。布莱夫曼希望能遇到一些同道中人，结果他发现真正同情他们组织的人不多。连很多伯克利的学生都反对他们，比如化生系的学生就认为人为拿动物做实验天经地义！


    有一次，组织搞了个抵制麦当劳的活动。他们六七个学生在麦当劳对面摆摊，拉横幅发放传单，劝人们别吃麦当劳。结果雄子连搞几天，传单倒是发出去了一些，可是连一个人都没有劝阻成功。不只如此，一个看上去非常有爱心的、带着孩子的妈妈，居高临下地对他们一记耳光！“你们这帮精英不要千扰我！“


    布莱夫曼很不奈，心想我们有人穿的衣服都是二手的，哪儿精英了？但是你想也对。人家当家长的好不容易周末领孩子出来吃顿麦当劳，麦当劳里面还有免费游乐场，对普通人家来说是个挺好的活动。要知道纯素的食物更贵，还不好找，可我们吃顿麦当劳还成了不道德了，你们不是精英谁是精英？


    ‘伯克利学生动物解放组织’的活动非常失败。但是搞活动可不能怕失败。布莱夫曼几个人头脑风暴，就有了一个想法：我们能不能也弄个麦当劳呢？


    布莱夫曼解散了“伯克利学生动物解放组织”，成立了一个新组织叫“McVegan”，专门跟麦当劳对着干。他们也不宣传动物保护了，改为宣传素食。McVegan也有个金拱门的标志，做了特别大的海报，每个人都穿上主T恤衫，有自己的logo，还有个吉祥物，他们还是在麦当劳门口摆摊——但这一次不光发传单，还发放免费素食汉堡。


    结果是大获成功。人们不但发现素食汉堡挺好吃，而且还认为他们的logo设计很酷，有人还要花钱买他们的T恤衫。麦当劳一看 McVegan 这不是侵权吗？把布莱夫曼等人告上了法庭——但是布莱夫曼抓住机会立即召开新闻发布会，借机宣传自己组织的理念，把事情越闹越大。最后麦当劳撤诉，McVegan获得了年轻人PT口碑，素食成了一个很酷的行为。


    当时可是1995年，那时候连知道Vegan这个词的人都很少。我不敢说布莱夫曼的组织在其中起到了多大的作用，但是素食理念在今天的美国已经是主流之一了。


    布莱夫曼的组织之所以成功，就在于他把辩论变成了“叙事”。保护动物权益是个有争议的事儿，是一场辩论，会把人贴标签分成敌我——而素食则是一个叙事。


    布莱夫曼说，今天这个时代，“事实”真实与否恐怕已经不那么重要了，但是“叙事”手段是否高明，越来越重要。


    # 2.数字回声


    咱们先说为什么事实不重要。2017年，特朗普刚刚就任美国总统的时候，各地爆发了抗议示威活动。2月1号这天，伯克利作为美国左派的一个大本营，校园里就发生了一次严重骚乱。很多建筑物都被破坏了，据说有人还使用了燃烧弹。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_39_4.png)


    可是事件发生之后所有人都懵了。包括警方在内，好像谁也不知道骚乱到底是怎么发生的！


    是因为学生失控了吗？伯克利的学生虽然热爱政治，但是真没有暴力传统。这一次抗议，学生组织者还专门强调了要坚持非暴力原则。


    警方认为有可能是某些校外组织专门收买了暴力分子来搞破坏。这个阴谋论又有两个版本。一种可能性是左派干的，某个左派大佬——比如索罗斯（没错，索罗斯真是左派的大佬），故意把事情搞大。另一种可能性是右派干的：你伯克利不是左派基地吗？我们搞个事情让联邦政府惩罚你'
  merge: -1
  img_proc: true
