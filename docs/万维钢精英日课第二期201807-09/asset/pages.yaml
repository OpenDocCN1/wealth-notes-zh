  md: '# 日课176 | 用足球验证有效市场假说


    日课176 | 用足球验证有效市场假说 ↓


    今天我们继续世界杯小专题。经济学家很喜欢足球。他们不但用经济学方法研究足球，而且用足球研究经济学。伦敦经济学院的一位教授 Ignacio Palacios-Huerta
    几年前出了一本书叫《美丽的运动博弈论》（Beautiful Game Theory: How Soccer Can Help Economics），介绍了好几个使用足球的经济学研究。


    其中有一个研究，是用足球来验证有效市场假说。


    # 1.假说


    “有效市场”这个说法你肯定已不陌生了。我们专栏以前有一篇文章叫《“有效市场”和做大事的机会》，专门讲过这个概念。如果市场是有效的，那就意味着一切能挣钱的机会都已经被利用了。比如如果股市是一个有效市场，那你就不能自己申聪才智、通过分析上市公司相关的信息赚钱——因为所有有用的信息都已经反映在股价上。


    换句话说就是你能想到的东西别人早想到了。比如某天你得知一个公司的新产品研发成功，你觉得这个公司很有前途——但是等你颤抖地打开手机准备买股票的时候，已经晚了。市场上大户接到消息瞬间就做出了反应，新消息已经在股价里了。


    如果股市真是一个有效市场，你再去做技术分析和基础分析就没有意义。股价的运动对你几乎是随机的，你买哪家的股票都差不多，你炒股就等于赌博。


    # 2.博彩交易市场


    足球是个充分竞争充分交流，特别受关注的项目。但你可能还是想不到足球经济有多发达。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_0_0.png)


    咱俩来看看Betfair上一场曼联对阿森纳的比赛的下注表。胜负平三种赔率都被分成两排。如果你赌一个结果成立——也就是你向下注买别人开的赔率，叫做“back”。如果你赌一个结果不成立，也就是你开一个赔率让别人买，这叫“lay”。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_0_1.png)


    # 3.到底有多有效


    好，现在经济学家想用赌球交易市场来验证“有效市场假说”。对经济学家来说，实时赌球有个最大的好处，就是所有信息都在电视转播中。进球之前所有人都不婚姻进球，进球之后所有人都知道。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_0_2.png)


    我们看到赛前曼联获胜的概率是56%。上半场曼联一直不进球，获胜概率就逐渐降低到50%以下。到第44分钟曼联进了一个球，交易终止了几秒钟，恢复交易的时候曼联获胜的概率已经被调整到了77%。然后比赛上半场比赛结束了。'
