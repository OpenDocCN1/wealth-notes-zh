  md: '# 日课190 |《激进包容》2: 有一种统战叫放权


    日课190 |《激进包容》2: 有一... ↓


    今天咱们继续说马丁·邓普西和奥里·布莱夫曼的《激进包容》这本书。我看这个邓普西的职业生涯，真是令人羡慕啊。


    邓普西从军几十年，指挥过冷战时期西德最前方 的哨所，参加过两次海湾战争，跟沙特王储是好朋友，被英国女王封过爵，曾经在伊拉克和阿富汗军政一把握抓，当过几年参谋长联席会议主席，培养过很多将领，退休之后还能写书谈谈思想。


    作为一个军人，邓普西没有在书里说自己如何学习领导总统一的思想。邓普西说的是他自己的思想。他反美、甚至还批评了美国以前在伊拉克的军事策略。他希望各路读者 ——
    比如说企业管理者 —— 能从他的经验中获得一些关于领导力的启发。立德立功立言，邓普西这些都有了。


    当然布莱夫曼在其中也有可吹嘘的地方 —— 布莱夫曼大约可以说，自己的书影响了美国的中东政策。


    # 1.怎样不被人民战争打


    邓普西喜欢去前线。2009年，大概刚刚接手阿富汗的事务的邓普西，从美国本土出发，访问了位于阿富汗和巴基斯坦边境的一个小哨所。塔利班武装在这里的活动非常猖獗，而美军希望能打断塔利班的走私线路。


    麻烦在于，塔利班并没有一个正规的交通路 线。这里没有shift?


    按咱们中国话来说，塔利班游击队在阿富汗打的是一场人民战争。塔利班做的事情当地人也反对，美军做的事嘛当地人也支持 —— 但是，塔利班在当地比美军更有群众基础。不管怎么说，美军是在侵略别人的国家。那侵略者怎么才能不被人民战争打呢？


    答案是用统一战线对付人民战争。


    邓普西在 deck.


    # 2.海星与蜘蛛


    这本书就是布莱夫曼2006年出版的《海星与蜘蛛》。其实我那时候我也读过了这本书，这本书说的是去中心化的组织结构。


    中央集权的组织都是自上而下的控制与命令，这种组织就像蜘蛛一样 —— 你把蜘蛛的头给弄掉，蜘蛛就死了。蜘蛛型组织都有一个指挥中枢，指挥中枢如果不好使，整个系统就瘫痪了，正所谓“擒贼先擒王”。


    但海星可就不一样了。海星是没有头的，它的智能控制分布在肢体各个部分。你砍掉海星一条手臂，这个手臂甚至可以自己演化成另一个海星！海星，是一个去中心化的组织系统。


    美军是蜘蛛，一切行动听总统和五角大楼指挥。恐怖组织是海星，管理非常松散，没有强烈的命令与控制。比如你说全世界恐怖分子总头子是谁呢？答案是……一种理念。恐怖组织就好像连锁店一样，谁想开就开一家，连加盟费都不要。你在这里干掉塔利班一个头目，别的地方很快就能出现一个新头目。正规军是蜘蛛，游击队是海星。


    所以邓普西面临的问题是蜘蛛怎么打海星。


    平心而论，美军至少在一线基层军官这个层面 上，有不少人早就懂得“海星与蜘蛛”这个道理。我们专rss.


    邓普西读了这本书受启发，他就直接给作者布莱夫曼打电话，要求布莱夫曼到五角大楼给他专门提供一次知识服务。邓普西给了布莱夫曼一个半小时的时间。


    布莱夫曼来了没说海星，他先讲了另一个概念 ——


    圈子。


    # 3.权力与控制


    邓普西获得的启发是要想对付人民战争，就得把当地人拉到权力的圈子里来，不能什么事儿都自己上。而要想扩大圈子，就得放弃一些权力。


    《海星与蜘蛛》也是说要放权，但那是向自己组织的基层放权，让听得见炮火的人指挥。《激进包容》这本书可是更进一步，要搞统一战线，向盟友放权。所以邓普西要把伊拉克人拉进来，要尽可能扶植当地的政治领导人和宗教领袖自己决策，美国只是施加影响和提供支持。


    邓普西后来有一次在跟士兵的对话中说，如果伊拉克的政治机构不能独立运行，美军军事行动的胜利就没有什么意义。


    这简直就好像抗日战争时期日本人在中国扶植汉奸伪政权……这个策略一点都不新。但是如果只论技术，从侵略者的视角来思考问题，这不失为一个有效策略。


    那如果你作为一个公司对消费者，或者对待潜在的竞争对手，能不能仿法这个策略呢？


    布莱夫曼和邓普西说，我们得重新思考什么叫权力。一般人认为能够控制别人才叫权力，说白了就是一切都得听我指挥才行。当领导的都想要控制，控制能带来很强烈的权力感。可是权力的根本目的不是控制，而是找到一个最优的解决方案，把事情用最好的办法办成。如果你把控制只当做一个手段，那么特别是在今天这个时代，这个手段越来越不好用了。


    总结来说，现在减少控制，甚至放弃一部分权力，至少有四个理由。


    第一，用控制解决问题，难道是一种拙劣的手 段。你是强制命令别人做事，别 人内心难免不舒服。那就即便这一次事情办成 了，冲突依然存在。


    第二，在现代社会保持控制力的成本越来越 高。


    第三，你不了解具体情况。拿美军在伊拉克来说，当地的风俗习惯、宗教禁忌、如何办事才能办成，美军是不懂的，文化差异太大了。


    第四，环境变化太快。在局面迅速变化的时候，中央的实时控制更是不可 能的。


    如此说来，要想可持续地保留权力，就必须主动放弃一部分权力。有时候盟友关系比上下级关系更长久，有时候合作的效率比命令和控制更高。


