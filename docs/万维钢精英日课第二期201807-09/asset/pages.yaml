    # 来自日课：叙事战


    读者 松柏格：


    以后叙事会不会成为维护真理的唯一手段？有理不在声高，在于感人……


    万维钢


    叙事是推广和宣传真理最有效的手段，但并不适合维护真理。叙事的优势在于能迅速吸引到人，让人立即就产生认同感。


    但人生若只如初见，何事西风悲画扇？想要长期地留住一个人，你这个主题如果没有过硬的东西还是不行的。听说了素食的故事会让人对素食运动产生兴趣，甚至感到这很酷，可是如果素食都很难吃，或者长期吃素会有营养不良，那素食运动就不能大规模开展。所以叙事只是一部分。


    理念的传播也是如此。我们看“思想市场”上长期流行的理念，什么自由主义、保守主义、自由论，都是在逻辑上能讲得通的东西。它们之间的矛盾不是你死我活的关系，你很难说哪个是真理哪个是谬误，最多只能说各有各的适用范围。能让人长期坚守的理念都必然有一定的深度，有很强的解释力，有生命力，常想常新。


