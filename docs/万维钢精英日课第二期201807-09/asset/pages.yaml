  md: '资排辈现象非常严重。谁当领导，不取决于才能，而是取决于辈分。年轻人不能自己争取权力，只能靠长辈指定，那就有只有血统传承，没有基因突变。


    第四，正因为特别讲血统，全真派内部有团团伙伙拉帮结派的现象，充满门户之见。对于一个全真弟子，人们不看他是“什么人”，只看他是“谁的人”。这种基于身份认同的多样性是基础偏好的多样性，不但没有给全真派带来创新，反而还在集体领导的名义下互相掣肘，啥也干不成。


