    # 读者 Arthur Ma:


    请问对比这本书，如何解释《知识大迁移》中所主张的“狐狸型”通才呢？


    万维钢


    刺猬和狐狸这个说法最初来自哲学家以赛亚·柏林。狐狸知道很多事，而刺猬知道一件大事。科学的判断决策，最好学狐狸，不要学刺猬。这跟达芬奇诅咒是什么关系呢？


    达芬奇诅咒说的是技能。技能需要长期训练，所以必须在时间投入上做出战略取舍。你光知道不行，你得把它变成长在你身上的本事才行。我很知道足球，但是我不会踢足球。


    刺猬和狐狸这个比喻说的是知识——更准确地说，以赛亚·柏林是在说人对知识的*态度*。王安石多才多艺，会写诗还会考证古文字，但是他做事一根筋，听不进意见，所以他是刺猬。而有些不那么知名的领导人，比如美国总统艾森豪威尔，没有什么文化，没有文章传世，但是做事不极端，灵活掌握中庸之道，可谓是狐狸。


    # 读者 月迷情、Anting:


