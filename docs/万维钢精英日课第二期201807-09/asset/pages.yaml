  md: '# 特别放送 | 人生一切难题，“视角”给你答案


    万维钢·精英日课

    今天


    进入课程 >


    特别放送 | 人生一切难题，“...”


    万维钢


    前面咱俩讲到，解决难题，你需要一个“视角”，这个视角，就是你*怎么看*这个东西，你把这个东西*看成什么*。而找到一个“完美视角”，能帮我们把一道难题瞬息化解。所以今天的特别放送，我就来帮你把日课里提到过的“视角”总结一下，看一看我们读过的书里、我们认识的人、我们学过的知识，都是如何通过一个精彩的“视角”，找到人生难题的解决方案的。希望能帮你对“视角”有一个更立体的理解，对世界有更多不同的体验，面对难题的时候，也能比别人多一份自信和勇气。祝你每天都有收获。


    # ★宇宙学的视角


    天体物理学给我们的是一个“宇宙学视角”。宇宙学视角意味着，最根本的一点，就是这个世界不是因为你而存在的。


    宇宙中的星星比地球上的沙子都多，比地球上上史以来出现过的所有人说过的所有的话，其中所有的字所有的音节都多。


    不管你怎么想象，宇宙都比你想得更大。


    宇宙学视角的一个重要意义就是让我们谦卑一点。


    比如你观察小孩。小孩总是把身边身sole一点小事儿当成天大的事儿。玩具坏了，他就哭闹。膝盖擦破一点皮，他就大喊大叫。他们以为自己是世界的中心，因为他们经验太少，不知道世界上还有比这些大得多的事儿。


    看原文：宇宙的视角


    # ★进化心理学视角下的佛学


    进化设定我们的快乐必须 bò 短暂的，所以我们永远都不会满足，而这就是人生的“苦”。


    看原文：现代视角下的“烦恼”和“苦”


    # ★佛学视角下的自我


    自然选择给每个人的基本假设就是，你是特殊的，你比别人重要。我们总是从自我的视角出发，去判断好坏。但是这个基本假设不可能是正确的，因为全世界有这么多生物，不可能每个生物都比别的生物重要，不可能每个人都特殊。


    看原文：因缘动力学


    # ★从观众视角到选手视角


    好像文艺演出，观众看到的是充满激情的表演，实际上从演员到工作人员，做的都是特别具体、没有那么多激情的工作。任何工作都是如此。高光时刻都是很少的，体育新闻里的射门集锦根本代表不了足球运动员大部分时间做的事情。


    看原文：观众的热闹和选手的门道


    # ★记者/科学家视角下的负面情绪


    有一个新方法，叫“认知再评估（cognitive reappraisal）”，是*接受*自己现在很难受，直面现实。


    看原文：“认知再评估”


    # ★物理学家视角下的生命和AI


    泰格马克把“生命”分成了三类。


    生命，就是可以自我复制的信息处理系统。其中的“信息”包括个体硬件复制的蓝图，以及个体行为的模式。一个生命体包括“硬件”和“软件”：硬件就是它的身体，软件就是信息。'
