  md: '# 日课180｜《柏拉图和技术呆子》1:工程师的大道


    今天开始咱们说一本新书，叫《柏拉图和技术呆子：人类与科技的创造性伙伴关系》（Plato and the Nerd: The Creative Partnership
    of Humans and Technology），作者是加州大学伯克利分校的电子工程与计算机科学教授爱德华·阿什福德·李（Edward Ashford Lee）。这本书说的是最高级的工程师智慧。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_13_0.png)


    工程师都有啥智慧呢？有个笑话是这么讲的。面对一个装了半瓶水的瓶子，乐观主义者说，瓶子已经半满了！悲观主义者说，唉，瓶子还有一半是空的……


    然后一个工程师说，嗯？这个瓶子其实没必要做这么大，只要一半大就够了。


    这个笑话是说工程师有个思维惯性叫“优化”。“优化”就是怎么才能多快好省地实现一个功能。产品经理想要一个什么功能，工程师就看看可不可行、怎么能用最节省的方法把功能实现。


    要是这么说的话，工程师似乎不是一个特别高光的职业。当我们谈论苹果手机首先会乔布斯和设计师艾维，而不是那些工程师。工程师……好像是生产线和食物链下游的一个职业。


    作者 Lee 教授本人有个小感慨。按理说伯克利的教授可是非常厉害的职位，但是他 뷉调说，他做的这些事儿可能在他父亲眼里都是失败的。Lee 的父亲本来想让他去读个
    MBA、回来管理家族的事业，而不是去当什么工程师 —— 工程师是给他家干活的人。结果他不但选择了工程学、还去贝尔实验室当了工程师、还成了工程学的教授，这简直是堕落。


    可是工程师真的这么低端吗？咱们今天就说说工程师的大道。


    咱们先从这本书的书名说起。


    # 1.柏拉图的世界观


    “柏拉图和技术呆子”这句话出自塔勒布的《黑天鹅》。塔勒布推崇在真实世界里撸起袖子干的人 —— 哪怕这个人看上去有点“呆” —— 而柏拉图代表的是理想主义。


    你可能听说过一个概念叫做“洞穴寓言”，是柏拉图在《理想国》里说的。说从前有个洞穴，洞穴里面有篝火，篝火前面有些人在做各种表演，他们的影子被篝火投射到洞穴的墙壁上。几个犯人被限制在演员和墙壁之间，他们不能回头看后面的情况，只能看见墙壁上的影子。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_13_1.png)


    这些犯人以为墙上的影子就是真实世界，殊不知自己看到的只是世界的影子。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_13_2.png)


    柏拉图说，我们人生的意义就是要摆脱影子的束缚，去发现真实的世界 —— 也就是“真理”。


    # 2.工程和科学


    2015年发生了一次两个黑洞合并的大事件，产生强烈的引力波，被人类探测到了。我们专栏专门讲过人类探测引力波的意义。咱们中国人都很佩服科学家，但是这件事情当时在美国有一些议论。


    # 3.爱迪生用的模型


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_13_3.png)'
