  md: '# 日课194 | 《激进包容》4:密切联系群众神经元


    日课194 | 《激进包容》4:密..


    今天咱们继续讲邓普西和布莱夫曼的《激进包容》这本书。


    最近我和一个朋友聊天，他这些年来在好几个创业公司工作过。他跟我说，并不是所有创业公司里面的人都有创业精神。


    创业不是一件例行公事的事情。创业公司对员工的要求比普通公司高得多，每个人都得很有责任感才行。可是有某些创业公司的员工还是例行公事为主，甚至是推卸责任。有时候明明是自己的工作没完成，他说他得等别的部门先把另一个功能给大家实现了他这个功能才能实现。这就是找人背锅。


    罗胖经常说一个词叫“积极主动”。为什么有些公司的员工就能积极主动，有些公司的员工却是得过且过呢？是人不行，还是公司的管理没到位呢？


    我们今天要说的这个原理，跟脑神经科学有关。


    # 1.垃圾工的洞见


    不知道你听没听说过关于医生“洗手”的故事。病人在医院的很多感染，并不是因为技术上的原因，而是因为医生没洗手。这个事儿听起来很荒唐但是在医疗界是人皆知，是个大问题。如果你是医生，洗手对你是个负担，如果都按照规定的话你每天得洗几十次甚至上百次手。心理学家、包括经济学家都在研究，到底怎么才能让医生多洗手。这个问题严重到什么程度，咱们等会儿再说。


    美国医院中每年死于MRSA（耐甲氧西林金黄色葡萄球菌）感染的人数，比死于艾滋病毒的人数还要多，而这种感染很大程度上就是因为医生的洗手次数不够。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_51_0.png)


    书中有个故事是这样的。费城有个“阿尔伯特·爱因斯坦医学中心”，有一段时间发现医院里死于MRSA感染的人数越来越多，院领导一看这不行啊，必须得搞清楚这是怎么原因。


    所以除了常规的宣传教育之外，医院还召集了所有工种都有代表参加的研讨会，不但医生要参加，连看门的人都来了，大家坐在一起集思广益。


    大家说来说去也没什么新见解，结果一位垃圾工提出了一个洞见。这个人的学历不高连高中都没毕业，他每天的任务就是清理各个科室的垃圾桶。但是他有一个发现。


    垃圾工说，一般来说，医生办公室垃圾桶里最多的东西是一次性手套，都是医生们用完就扔的。其实现在手套已经在很大程度上缓解了洗手的问题。可是在全医院感染率最高的那几个楼里，办公室的垃圾桶却是空的。难道这个楼里的医生都不爱戴手套吗？


    领导一听非常重视，结果调查发现，那几个科室的人普遍都是手很小。这纯粹是个巧合，这些医生需要的都是特小号的手套。可是每次发手套都是各种尺寸的都有，所以特小号手套特别容易用完。用完了这些医生也懒得再去，养成习惯干脆就不戴手套了——再加上不爱洗手，导致了感染率大幅上升。


    于是医院马上采取措施，告诉这几个科室的医生没手套了赶紧打电话，特小号手套管够。


    结果这几个科室的病人死亡率居然在一年内下降了70%！我听到这个数字有点不敢相信，70%！这问题也太严重了，不洗手的医生简直就是杀手啊！


    但是我们想说的道理是，一个组织的问题可能发生在任何地方。谁能想到小小的手套决定了那么大的病人死亡率？又有谁能想到，发现问题的居然是一个垃圾工？


    那像手套这样的问题你怎么避免呢？一个办法是把各种理论上可能出现的问题都写成规章制度，培训全公司员工，要求每个人都随时保持警醒。这是个高成本的做法。领导人要是一整天操心小事儿，你这个公司就没大事了。


    低成本的做法是模仿人的大脑。


    # 2.惊讶神经元


    我们的大脑平时并不是对周围的所有事物都保持关注。你每秒接触到的信息非常多，而你只能关注那些“值得关注”的东西。那什么东西值得关注呢？一个重要的判断标准就是哪些东西让你感到惊讶。


    比如你在黑暗中下楼，走到最后一级台阶你以为你脚下还有一级台阶，一脚踩到平地上，你会感到惊讶。再比如你眼睛不看、伸手拿一杯水，结果发现水杯没在那里，你会感到惊讶。这些惊讶都是小惊讶，没有情绪上的波动，但是它能提醒你的注意力。


    惊讶的脑科学机制很有意思。科学家平时想要观测大脑的运行，一般都是使用“功能性核磁共振成像（fMRI）”的方法，看大脑中哪个区域的血液流动活动增强了，就说明哪个区域正在起作用。而科学家早就大概知道大脑里每个区域都负责什么功能。如此一来，就能在一定程度上判断大脑正在想什么。


    但是血液流动的速度比脑神经连接的速度要慢一些，这种探测方式得到的信息就有一点滞后。要想*实时地*知道大脑在想什么，最好的办法就是往大脑里直接插电极！你可以想想，一般的受试者肯定不会让你往他的大脑里插东西啊。但科学家还是找到了机会。


    癫痫是一种经常突发发作的病，医生只知道是大脑出了问题，但是不知道是大脑的哪个区域出了问题。为了治疗癫痫，就值得把电极插入到大脑里去了。


    脑神经科学家和病人商量，说你能不能在做大脑检查的时候，顺便帮我们做个实验？病人同意了。科学家就让病人大脑插着电极的时候做一些智力测试题和小游戏，想观察大脑的决策方式。


    结果这个实验有一个意外的收获。科学家发现，如果病人在游戏过程中犯了一个错误，大脑只需要1/10秒的时间，就会产生一个特殊信号。那也也就是说，在大脑*意识到*自己犯了错误之前，这个信号就已经出来了！


    所以大脑里有一个快速反应的报错机制，我们对错误非常敏感。其实这也是刻意练习的一个机制，正因为人对错误敏感，才有可能刻意练习。


    而后来科学家发现这个神经信号并不仅仅是对错误做出反应，它其实是对任何“惊讶”都做出反应。只要有什么东西不对，马上就会有这个信号。所以科学家给它起了一个名字叫“惊讶神经元”。


    惊讶神经元先发现问题，然后向大脑能产生意识的区域汇报，大脑才意识到问题。


    换句话说，如果大脑里有个CEO，他并不是时刻主动寻找问题，他是等着手下随时向他汇报问题。这就是我们说的低成本的组织方法。


    如果公司里每个人都有一<|start|>主S主人翁精神，看到哪里不对就主动提出来，发现不正常的地方赶紧报告，管理者根本就不需要操心日常的小毛病了。


    那现在问题来了。一般公司和人的大脑到底相差在哪里呢？为什么有些公司明明已经非常不对了，员工却都不站出来说话呢？这些公司怎么就没有“惊讶神经元”呢？


    # 3.“A”和“2”


    布莱夫曼经常给人讲课，听他课的有CEO和管理人员，有普通员工，也有伯克利的学生。布莱夫曼喜欢在课堂上让同学们做一个实验。


    布莱夫曼给每个学生的额头上贴一张扑克牌，每个人都能看见其他所有人头上贴的扑克牌是什么，但是不知道自己头上的是什么，而且彼此人绝对不能告说。


    布莱夫曼要求大家假装都是一个公司的人，就好像是参加公司组织的野餐一样随便找人聊天。每个 hepatitis everyone head on poker...
    每个 人额头上扑克牌代表他在公司的职位高低：A最大，代表CEO；2最小，代表公司最底层的员工。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '2 最小，代表公司最底层的员工。


    那我们 可以想象，会有很多人主动找那些带着地位高的扑克牌的人聊天，聊天的语气也会对不同的人不一样。人们虽然不知道自己的牌是什么，但是在很大程度上能够感觉到。


    互动结束后，布莱夫曼要求大家根据自己对头上扑克牌大小的*感觉*，按照从大到小的顺序排队。


    结果是每次做这个实验，学生们几乎无一例外都能非常准确地找到自己的位置！


    然后布莱夫曼让学生们谈谈玩这个游戏的感受。头上顶着 J、Q、K、A 这些大牌的学生 —— 尤其是 CEO —— 觉得这个游戏特别有意思。人们争先恐后地跟他说话，而且都会用
    Sir、Ma’am 这种尊称。他一说话没人敢打断。他讲个根本不好笑的笑话别人也会哈哈大笑。


    可是头顶上是 2 的人就很难受了。几乎没人主动跟他们说话，即便说话也都是 “你要继续好好工作啊！” 之类居高临下的鼓励 —— 谁愿意听这种话？


    好。现在布莱夫曼说，如果你头上是 2，你最想做的事情就是不说话。别人不愿意理你，你也不愿意理别人。而如果你头上是 A，却是所有人都跟你只说好话，你说啥都对，没人给你找麻烦。


    那你说如果 2 注意到公司的一个问题，他会汇报给 A 吗？


    注意这只是一个游戏。游戏里可没设置一个闲人免进的领导办公室，游戏也没规定 A 不能跟 2 对话，游戏甚至都没告诉你自己是 A 是 2。可人们就是这么敏感地察觉到了人与人地位的差别。


    只要地位差距存在，就必然是 2 不愿意说，A 听不到该听的。


    而且别忘了，连伯克利的学生做这个实验，也是同样的结果。伯克利可是美国左派的基地啊，那里的学生是最讲平等的！


    # │ 由此得到


    “惊讶神经元” 是一个符合大脑工作原理的、低成本的发现问题的组织方法。但是想让员工积极主动地汇报问题得有条件。


    也许员工的积极主动和公司的等级制度是根本性的矛盾。只要有等级，底层就不会那么积极主动。这不是态度问题也不是思想工作问题，这是制度问题。


    你不能在一个等级森严的体制里讲什么 “密切联系群众”。


    那罗胖为啥能整天鼓吹 “积极主动”？因为罗辑思维是个讲 “扁平化管理” 的公司：全公司没有明确的上下级关系，全体人员都是 “A”。


