    万维钢


    法国大革命之前，人们认为有国王、有贵族、有底层农民，这种社会结构是天经地义的。带头闹革命的并不是受不了压迫的底层人民，而是想法先变了的中上层知识分子。赫拉利写到“大革命领头的是有钱的律师，而不是饥饿的农民”——农民本来没啥想法。结果大革命之后，自由平等突然就成了人民的共识。


    这个关键在于社会阶层的划分不是物理定律决定的，而是人们想象出来的东西。想像是脆弱的。只要时机合适，人们就可以不再相信这个想象。


