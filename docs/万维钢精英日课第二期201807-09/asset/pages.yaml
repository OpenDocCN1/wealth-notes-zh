  md: '# 日课201｜一个诡异的涌现现象


    日课201｜一个诡异的涌现现象…


    今天我们要说一个在知识服务界很不寻常的话题：“通灵”。但是请注意，我们可不是要宣扬科学破除迷信——我们精日课的读者不需要那种知识服务——我们是要借这个话题说一个更高的道理。


    # 1.标准化通灵操作


    咱们亚洲文化里有个通灵的操作，叫“请碟仙”。我没看过具体是怎么做的，我理解大约是几个人围坐在桌子前，桌子上扣一个小碟子，碟子放在一张纸上，碟子上画一个箭头，纸上写好各种“答案”。几个人用手指不断地触碰碟子，碟子就会动起来。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_69_0.png)


    在某一时刻，你会觉得碟子好像开始自己动了，好像不是你的手指在推动碟子，而是你的手指在跟着碟子动。按民间的解释，这就是有某个精神力量——比如说一个鬼魂——正在控制碟子，它可以通过碟子跟人交流。你问鬼魂一个问题，比如说“我应该转职创业吗？”鬼魂就会让碟子上的箭头指向纸面上的一个答案，比如“是”或者“否”。


    这套业务在美国已经被标准化了。早在1891年，就有人注册了请碟仙设备的专利。现在流行的产品是1901年定型的“通灵板”——


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_69_1.png)


    板上刻着26个英文字母和10个阿拉伯数字，还有“Yes”、“No”两个选项，以及“你好”、“再见”两个标志通灵开始和结束的问候语。通灵板配有一个心形的木质箭头，几个操作者用手指触碰箭头让它移动，选择通灵板上的答案。这是一个非常完备的通讯系统，鬼魂可以用它传任何信息。


    # 2.解释


    那请碟仙和通灵板真的能通灵吗？这套寻求答案的方法好使吗？当然不好使。这么流行的东西早就有人做过研究了。一般的结论大约有两点。


    第一，通灵板给出的答案似乎不是完全随机的，往往能比较自治，就好像真的是在跟一个鬼魂对话一样 [1]。


    但是你别紧张，还有第二点。


    第二，如果参与的几个人知道这个问题答案，通灵板就会给出正确答案；可是如果没人知道答案，或者是预测未来，通灵板的答案通常就是错误的 [2]。


    换句话说，问碟仙并不比问自己更有用。


    # 3.研究


    这项研究来自丹麦奥胡斯大学，它的独特之处在于，研究者关心的是当一个参与者用手指触碰通灵板上的箭头的时候，他的眼球是怎么运动的。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_69_2.png)


    研究者设计了两项实验。


    # 4.涌现


    明明这个现象就是由每个人的操作导致的，但是每个人都觉得自己的操作不应该带来这样“高级”的结果，这是典型的“涌现”现象。'
