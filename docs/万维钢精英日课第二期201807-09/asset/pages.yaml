  md: '![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_113_0.png)


    这个图的特点是任意一条横、竖和对角线上三个数字相加都是15。数学上管这种图叫“幻方”。抢15的游戏就相当于在幻方上画圈占地，而你要做的，就是设法让自己占的三个格子连成直线，同时避免让对方连成。


    而这不就是小孩玩的“井字棋”游戏吗！


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_113_1.png)


    我陪我儿子都玩过很多次井字棋，你来我往有攻有守，直观明了。只要双方都足够警觉，井字棋游戏的结果应该是谁都不输不赢。我儿子从来没在井字棋上犯过错，但是你要让他计算抢15，可就难多了。


    同样是一堆数字，你的视角要是计算加减法，那就很麻烦；可是你换个视角改成连线题，就变得一目了然。那是不是对所有的难题，都能找到这样让人茅塞顿开的视角呢？


    这就是佩奇说的第三个洞见：对任何一个问题，都存在一个能让答案一目了然、脱颖而出的视角。


    这句话可不是随便说的，佩奇为此专门提出和证明了一个数学定理，叫“学者存在性定理 (Savant Exist ance The roem)”。


    这句话说着容易，但是真要找到那个视角，可是非常困难。事实上，如果你仔细考虑佩奇对“视角”的定义 —— 凡是能把一堆东西跟随意定义的某个内部语言对应起来的关系，都是视角
    —— 那么有些视角很可能无法用直觉获得，以至于对解题没什么帮助。


    比如书中有个例子是这样的。佩奇从他的家乡随便找了14个房子，它们的面积有大有小，价格有低有高。那到底是什么因素，决定了房子的价格呢？


    面积似乎是个不错的视角。我们把这些房子按照面积从小到大排列，并且从1到14编号。在下面的图中，横坐标是房子的面积编号，纵坐标是价格 ——


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_113_2.png)


    总的趋势，的确是面积越大的房子价格越高。但是从严格的数学意义上讲，佩奇说，面积不是一个完美的视角。比如2号房子，它的面积明明比3号房子小，但是价格却更贵；5号房子的面积算是不错了，但是价格却是所有房子里最低的。


    佩奇说，面积这个视角的问题在于，图中除了14号房子这个全局最高峰之外，还有好几个“局部高峰”。站在局部，你还以为那些房子价格最高，而事实上根本不是这样。完美的视角应该让这张图，而在边上也好在中间也行
    —— 总之你看到的高峰就是全局高峰，就好像富士山一样，答案一目了然才好。


    把房子按照房价编号为1到14，然后我们只要找到这么一种给房子排序的方式，让14左边的数字都是一直增加，14右边的数字都是一直减少，比如排成 1、4、5、6、9、11、14、13、12、10、8、7、3、2，就是一个满足富士山条件的“单峰现象”。如果你把这个排列当做一个视角，那这就是一个解决问题的完美视角。


    可问题是，这个视角到底代表啥呢？是地段吗？是房子的新旧程度吗？很可能都不是。所以以我之见，完美视角虽然必定存在，但是未必对咱俩解题有用，因为你事先想不到。


    但是佩奇说，“学者存在定理”给了我们希望。一道难题摆在面前，可能当前谁都不知道怎么解决，但是你要相信，总有一个视角，会让答案看上去那么简单，能够脱颖而出。


    这就好像以前的人认为光非常神秘，而牛顿一旦有了“光是不同颜色的混合”这个视角，光就不再神秘了。以前的人觉得天体运行非常复杂，而牛顿一旦有了引力这个视角，他就能精确计算行星轨道。


    视角，决定了问题的难度。


    你是否曾经尝试过使用不同的视角去攻克一个难题呢？那是美妙的体验！


    # 划重点


    +   佩奇关于“视角”的三个洞见：

    1. 视角的选择，对解题的难易，关系重大。

    2. 要想有利于解题，你这个视角最好自带某种结构。

    3. 对任何一个问题，都存在一个能让答案一目了然、脱颖而出的视角。


