  md: '# 日课183 | 拖延时间的厚黑学


    日课183 | 拖延时间的厚黑学


    世界杯已经接近尾声了，今天咱们再拿足球说个事儿。伟大的运动员应该堂堂正正地比赛，用技术、智慧和勇气争取得胜利，可是也有很多人为了赢球不择手段，搞各种小动作，完全不讲体育精神。一个理想的、公平的系统应该淘汰第二种人，让第一种人成为主流，对吧？那么足球这样得到充分关注、充分交流、充分研究的成熟项目，是否达到了理想呢？


    # 答案是没有。世界没有那么理想。


    比如巴西队的内马尔就受到了很多的批评。他习惯假摔，一碰就倒，还爱在巴西队领先的时候“卧草”——躺在地上滚来滚去，拖延丢赛时间。现在连巴西队的球迷都非常反感内马尔，人们对他各种恶搞。巴西队最后还是输给比利时未能进入四强，内马尔灰溜溜地离开世界杯。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_19_0.png)


    咱们专栏的读者“鳏”问我，像内马尔这种行为到底好不好，能不能用科学的数据分析评价一下他这种踢法——是不是“知耻近乎勇，不知耻近乎神勇”呢？


    如果内马尔用不正当方法获取了利益，那他现在既输了球又输了人，是得到了应有的惩罚吗？如果足球比赛规则仍然有漏洞，那至少我们在理论上遗责了内马尔，说明这个世界*∗*的来说*还*是公平的吗？


    完全不是。我要说的是世界杯和整个世界都不过怎么公平——而且我们还过度遗责了内马尔。


    大数据分析网站538连发了两篇报告 [1,2] 来分析世界杯比赛拖延时间的问题，我看完之后的感觉是，内马尔是好人啊！


    # 1. 拖延时间有道理


    如果你你的球队正在领先，你会希望剩下的有效比赛时间越少越好。


    足球比赛的规则和篮球非常不一样。篮球是比赛一中断就停表，每节12分钟是实打实的12分钟比赛时间——出界、罚球、换人、凡是死球都不算在时间之内。足球比赛不会停表，所以这些都算在比赛时间内。有些球队就会故意拖延时间，希望比赛能在无效时间中磨结束。为了反对这种行为，现在的规则规定，在上下半场的结束之前，第四官员会统计一下比赛中拖延的时间，再补回来，这叫“伤停补时”。


    好，那如果你拖延的时间最后都会被补回来，拖延就没有意义，对吧？结果不是这样的。


    538网站对32场世界杯比赛做了统计，其中符合足球规则规定的换人、受伤、球员喝水、犯规等死球一共发生了3194次，把这些时间都算上，平均每场*应<|start|>*的补时是13分10秒。


    但是实际补时时间，平均每场只有6分59秒。裁判决定补时很大程度上是人为的，一般会尊重“传统”，而且过长的补时还可能会影响电视转播。所以拖延时间有利可图。这就好像贪污100元只会被追回50元一样，而且还不受惩罚！


    职业球员都知道这个道理。而且他们还应该知道，像内马尔那样“卧草”并不是拖延时间最有效的方法。


    # 2. 最有效的拖延时间办法


    538网站专门统计了各种死球状况占用的时间，如下图所示——


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_19_1.png)


    根据这份统计，罚任意球会拖延最多的时间，平均每场浪费了10分29秒。我们想要也是这样，罚任意球双方都要排人墙，这就花费不少时间。你可以先把球放在发球点上等着自己的队友到位，好不容易大家都到位了，你又不想自己罚了，换个人罚又可以花点时间，你们两个在球前比划来比划去，时间就这么白白地漏走了！


    # 3. 谁是真正的厚黑


    538网站统计了本届世界杯小组赛阶段各个球队故意拖延时间的情况。相对于是完成一个动作平均需要的时间，各队在领先时候做这些动作多花费的时间如下表——


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_19_2.png)


    我们看到在进入八强的球队中，法国、瑞典、和英格兰队才是最擅长拖延时间的，他们在这张表上名列前茅。而巴西队，居然在所有领先过的球队中拖延时间方面排在了倒数第二——巴西队是个节省时间的模范！'
