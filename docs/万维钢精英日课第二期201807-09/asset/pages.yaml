  md: '# 特别放发送 | 一流的智力


    特别放发送 | 一流的智力


    万维钢


    咱们日课经常引用薯荤杰拉德的一句名言：“检验一流智力的标准，就是看你能不能在头脑中同时存在两种相反的想法，还维持正常行事的能力。”所以今天的内容，我就帮你总结了日课提到过的那些“相反的想法”，比如说混乱和秩序，内向和外向，保守和创新，集中和发散，局部和全局、复杂和标准……等等。这些说法各自都自有道理，但是放到一起，你会发现它们是矛盾的。怎样牟纳这些想法，如何处理这些矛盾，正是一个人智慧的表现。今天分享给你，还是希望你能通过阅读文稿的方式来复习。希望你做一个拥有−流智力的、复杂的现代人。


    # ——— 尝试和坚持 ———


    “坚持”和“多尝试”是矛盾。注意这有−个时机问题。职业生活的早期要多尝试，可以多跳槽，但确定了事业之后就应该坚持。最理想的状态是把无关的事情都推掉，每天只干最重要的这一件事情。


    但坚持的同时，也要多尝试。前面不管投入多少都是沉没成本，有新的好机会还是可抓住。总之是不坚持就干不成大事，不尝试就找不到“对”的事。这个矛盾永远存在。大部分时间集中力量干大事，同时确保一小部分时间尝试新事物，可能是个好办法。


    # ——— 内向和外向 ———


    什么叫内向，什么叫外向呢？一个简单判断标准是你需要外部环境给你多大的刺激。让你在一个嘈杂的环境里，比如说酒吧之类的地力，很多人在一起，你是感到很舒服还是感到不舒服呢？内向的人更喜欢独处，而外向的人喜欢人多的环境，喜欢跟人交流。独处会让外向的人感到很无聊。


    如果我们的目标是“成功”，到底是外向点好，还是内向点好？


    “外向”和“内向”，其实对应的就是“尝试”和“坚持”。坚持、刻意练习、专注，这不就是内向者的行为模式吗？多尝试新事物，这不就是外向者的爱好吗？外向的人运气好，这不就是尝试出来的吗？


    所以我们都是在矛盾中寻找一个动态平衡。有时候你要多尝试，有时候你要多坚持，有时候你要外向一点，有时候你要老老实实做个内向的人 —— 但总体来说，一味地内向就太吃亏了。


    结论是在这个世界上，外向的人更占便宜。既然这个时代奖励外向，我们就干脆都假装是外向的人吧。


    # ——— 探索和收获 ———


    人生在世应该积极探索新事物，也有人认为还是要珍惜已有的东西。谁说得对呢？我们到底应该在什么情况下探索新事物，什么情况下专注重已有的东西呢？


    这个问题，在数学中就叫“探索与收获的取舍问题（Explore/Exploit Tradeoff）”。从本质上来讲，这个问题是说，你到底应该花费精力去探索新的信息，还是专注于从已有的信息中获得收获？这个问题一直到1970年代才被真正解决：


    数学家的一个洞见，是你必须考虑时间因素。


    解决问题的数学家叫基廷斯。他说，当你计划出去吃一顿饭的时候，明天那顿饭应该比今天这顿饭值贵一点 —— 因为你明天可能会离开这里，吃不上那顿饭。具体贬值多少，取决于你预期还能停留多长时间。基于这一点，他提出了一个非常复杂的解决方案，最后结果是给每个选项计算了一个指数，现在被称为“基廷斯指数（Gittins
    Index）”。


    我们希望每一天都活在当下，可是从现实的数学角度，你预期停留的时间越长，探索新事物的价值就越高，基廷斯指数也越高。


    如果我们把期限设定为人的一生，这就意味着年轻人应该多探索，到了后期就专　　　　　注于收获。


    这对理性的人来说，要想过好这一生，意味着三件事。


    +   第一，年轻时代要大胆探索。


    +   第二，随着年龄增长，要慢慢学会利用已有的信息，专注于收获。


    +   第三，慢慢变老的过程中，我们的生活其实是越来越好。


    # ——— 坚持自我和学习他人 ———


    有一个根本的矛盾，值得每一个创新者注意 ——


    —— 你要在多大程度上保留和发展自己的个性，在多大程度上向别人学习。


    人才是交流出来的，但天才可能需要一个孤岛。


    其实就算是在现在，同样是住在城市里，真正有创造力的人也不是整天和人开会搞社交。他必须得有大量的时间自己闷头搞，最多是跟几个内行合作，才能做出原创的好东西。


    所以城市对创新的宏观好处只是一方面。也许住在城市里，同时内心有一个孤岛，勇敢地保留特色，才最有利于创新。


    我们可以想像，真正了不起的发明创造，绝对不可能是−个两耳不闻窗外事的人闭门造车做出来的 —— 但也不可能是一个整天到处交际，沉迷于社交网络的人做出来的。


    # ——— 专才和通才 ———


    现在很多人认为真正的人才应该是“通才”，不仅仅增长自己领域的东西，而且涉猎广泛，琴棋书画都会，十八般武艺都懂，上得了厅堂下得了厨房。我们以前讲斯科特·亚当斯的“系统”，也是建议一个最好在两到三个领域都达到全世界前25%的水平。我们讲过“自由技艺”，每个人都应该学一点人文艺术、历史政治方面的知识，这样你才能借助各个领域的思想，解决复杂的问题。


    但是请注意，了解其他领域，可不是让你平均用力。


    要知道你不是达芬奇，现在也不是达芬奇的时代。


    “老手并不一定是高手”，“专家不一定最好用”，这两条道理，仍然是成立的。


    而且，“练习”容易刻意，但是成为通才，似乎很难刻意。你很糟蹋着实用的目的学习广泛的知识 ——  到了哪个知识有用，应该在各个领域投入多少时间最划算，这种优化问题根本无解。通才的目的本来就是为了对付复杂问题和不确定的局面。


    也许“什么什么知识到底有什么用”，这个问题就错了。如果哪个知识都可能有用，那你最应该关心的是其实现你对什么感兴趣。真正的斜杠青年追求的不是简历上多少个斜杠，而是应该是培养广泛的兴趣，把知识本身当成回报。


    做为一个聪明人，你的“才华”战略，或许应该是这样的：


    +   1. 现在是一个专才的世界。通常的做法都是长期专注于某一个领域才能够有所成就，其他的东西只起到辅助的作用。


    +   2. 业余的兴趣和专家的兴趣很不一样。


    +   3. 达芬奇诡异的根本原因可能是害怕竞争。


    +   4. 作为一个有达芬奇人格的人，最好找一个复杂的、跨学科的领域发展。


    # ——— 集中和发散 ———


    集中思维，是掌握抽象概念套路，以及使用这些概念和套路的思维，特点是每次专注于一点，是局部的思维。


    集中思维有个缺陷 —— 容易陷入思维定势。


    发散思维是−个整体性的思维，往往能把新想法和一个意想不到的知识联系起来，绕过思维定势。


    不论你是想消化吸收新知识还是想从旧知识里获得灵感，你都需要发散思维。


