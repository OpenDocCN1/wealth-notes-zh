  md: '# 日课184 | “认知再评估”


    日课184 | “认知再评估” ↓


    我最近又读了一本有关自由意志的书 [1]，这本书没有太多新内容我就不过推荐了，作者和书名都在参考文献里。但是这本书里有一个非常奇怪的观点。作者认为既然人类脑经历的一切都是主观的情感体验，那就应该干脆把人变成一个“缸中之脑”——身上接满电线，直接输入各种快乐情感，或者服用某种没有副作用的毒品。使用技术手段让自己一直处于快乐之中，就是人生最好的归宿。


    作者是一步一步推理推导出这个结论的，但我实在无法接受。我认为这个理论的错误是于它完全不在乎*真实世界*，它只在乎自己的感受：*虚假*的快乐，也是快乐。出于某种说不清楚的原因，我认为真实世界还是重要的，人应该直面真实世界——当然从哲学角度你也可以说这是偏见，你甚至可能说根本就没有什么是真实世界。


    不过我认为这里面有个判断是有道理的——那就是主观体验，对我们来说非常重要。比如说有一个人，经济条件很不错，家里有很多套房子。他本来不需要上班，但是他还是每天都去上班……结果有一天公司裁员，这个人失业了。他的情绪非常失落，他觉得自己成了一个不能给社会做贡献的人，收房租收得毫无成就感。


    对比之下，另外一个人，也是经济条件不错，但是是因为退休了而不工作。这第二个人的感受会比第一个人要好得多——虽然他们两个的境遇是一样的。


    这就是主观体验。事情本身是怎样的，有时候并不重要。重要的在于你给你自己讲的故事是什么，也就是你对这件事情的“评估”是什么。


    那你说这不精神胜利法吗？的确是，但一切事物都看你怎么“解读”。不有著名的小段子吗？说同样是搬砖，有的人就以为自己是在搬砖，就感到这个活特别苦。有人心里想的是我正在建设一座教堂！他就充满干劲。还有一个著名人物身处纳粹集中营、随时面临死亡危险，都能选择良好的主观体验。你要非说这些人就是“积极的心态”，阿Q对抗老爸就是“精神胜利法”，那你本身就是一种精神胜利法。


    现在什么都讲“管理”，那么这个道理就是我们需要“管理”自己的主观体验。


    假设你正在经历一段非常难受的事情，比如说在干一个自己非常不想干的工作。你面临一个实际的困难，要有办法解决问题早点解决了——现在你虽然不能解决困难，但是是可以解决自己对困难的主观体验。


    比如说，对不爱锻炼的人来说跑步就是一个非常难受的事情。一个办法是给自己设定目标，比如总共要跑三公里，那跑完一公里你就完成了三分之一；跑完两公里，剩下的距离就只有已经完成距离的一半了。


    另一个办法是想象自己正在做一件高大上的事情。这不叫跑步，叫“健身”——你将获得健康美丽的身体！你还可以像孟子说的那样设想“天将降大任于”你，你的跑步行为已经超越了身体范畴，你是在磨炼自己的意志品质！


    这些方法的有效性很可能因人而异。当我把孩子们的衣服从洗衣机里拿出来，一件一件挂好的时候，我实在想象不出这件事能有什么高大上的意义。


    转移注意力也是个办法。比如一边跑步一边听小说，把精力转移到别的方面，就好像鸡扒骨疗毒一样。


    但是你注意到没有，想象自己是在盖教堂也好、转移注意力也好，这些方法都是在*回避*当前做的事情。而我最近听说了一个新方法，叫“认知再评估（cognitive
    reappraisal）”，则是*接受*自己现在很难受，直面现实。


    这个方法是这样的。你要跳出自身，以一个科学家，或者记者的视角去观察自己的情绪变化，看看自己在这种情况下能变成什么样，能坚持到什么程度，平静地观察和报道。有负面情绪是有负面情绪——我承认，我不回避——但是我重新评估自己的情绪。


    最近刚刚出来一个新研究 [2]，美国几个科学家做了一个实验，看看“认知再评估”法和转移注意力法，哪个更有效。《英国心理学会研究文摘》也做了报道 [3]。


    研究者找了24个健康的人做受试者，他们的年龄在18岁到33岁之间，其中有男有女。受试者们要到实验室来做三次实验，每次要在跑步机上跑90分钟。跑的速度要能使心率达到心跳最高水平的75%-85%，算是一个比较艰苦的训练。


    三次跑步测试了三种主观体验。一种是没有任何指导，你想怎么办就怎么办；一种是用转移注意力法，你去想一些和跑步无关的事情；第三种就是认知再评估。


    研究者会在跑步之前、跑步过程中每隔30分钟、跑步之后，反复询问受试者感觉如何：是不是觉得特别累？是不是难受的情绪很强烈？


    测试结果，最有效就是认知再评估法，受试者表示痛感没有那么强烈。而转移注意力法的效果和什么方法都不用几乎没有任何区别。那如此说来，认知再评估的确是个好方法。


    其实这个研究做的很不严格，总共只有25个受试者。而且研究者最后承认，有些受试者对什么叫“认知再评估”掌握得也不是很准确。不过研究者最后仍然判断认知再评估是个好方法。


    心理学实验经常是不靠谱的，咱们不用对这个实验结果本身太强烈的信任——但我们可以把心理学实验当成寓言故事。现在你在至少知道有这么一个方法，有人用着有效，你可以尝试借鉴。


    我以前不知道这个名词，但我其实经常使用这个方法。我不爱锻炼，当我偶尔跑步的时候，我有时候就是带着一种好奇心看看自己跑步是个什么感觉。我想知道自己的情绪和身体对跑步这件事情的反应。这就有有点像是用科学家的态度来观察自我。


    咱们专栏多说过一个概念叫“自我关怀”，我看和认知再评估非常像。自我关怀说的是当你犯了错误、感到非常懊悔难受的时候，你应该像接受一个朋友一样先接受自己，用第三人的视角来观察自己。这个时候你就会觉得这件事没有那么严重，你反而能够更平和。认知再评估也是这样，先接受再说。


    我认为这是一个高级方法，而且很像佛学里“正念”的味道。在这里就是在这里，直面人生，不假装不回避，调控而不是压制情绪。


    如果我现在吃的是泡面，我既没必要假装自己是在吃烤鸭，也没必要想象现在吃泡面都是为了未来吃烤鸭——我承认这是一个泡面，我承认泡面没有烤鸭好吃，这样我肯定不会认知失调。但我可以把自己当做一个研究对象，看看我对泡面都能有什么样的反应。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_21_0.png)


    # 参考文献


    [1] Paul Kwatz, Conscious Robots: If We Really Had Free Will, What Would We Do
    All Day? (2017).

    [2] Grace E. Giles et al., Cognitive reappraisal reduces perceived exertion during
    endurance exercise, Motivation and Emotion, August 2018, Volume 42, Issue 4, pp
    482–496.

    [3] Christian Jarrett, A mental technique called “cognitive reappraisal” makes
    long-distance running feel easier, BPS Research Digest July 2018.


