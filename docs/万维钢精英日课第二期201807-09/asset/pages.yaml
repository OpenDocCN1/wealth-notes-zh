  md: '现代人有不同类型的“朋友”。这个朋友是我生意上的伙伴，这个朋友是我学习上的同学，这个朋友只跟我在打球的时候见面——而我们能把他们分得非常开。相对于跟球友谈生意，跟生意人谈生意、跟球友谈球是效率更高的做法。


    再比如说，现代人都能接受给产妇接生的医生是个男医生。当我们考虑接生的时候，我们只当他是个医生，而不考虑他是一个男人。一码归一码，这是社会的进步。


    区分意义能带来进步和效率，但是这是不自然的。我们这样生活久了，有时候自然本性会出来呼唤，说能不能再把意义给统一起来。


    比如你在城市里每天要跟很多人打交道。健身的教练，口语的老师，飞机上的空姐，餐馆的服务员，他们跟你只是临时的合作关系，但是你有时候会对他们产生感情。你想和他们交往，你想知道他们过的是什么样的生活。可当你主动提出要跟人交朋友的时候，你发现人家根本不想和你交朋友，他们只把你当做服务的对象而已。


    那你会不会觉得人和人之间关系变得太淡漠了呢？这难道不是市场的坏处吗？这不就是资本主义的丑陋吗？


    其实不是这样的。如果没有市场，你根本就没有机会认识这些人。理性的你应该为能认识他们而感到庆幸——可是本性的你仍然会有一些惆怅。


    那到底人可以理性到什么程度，咱们下次再说。


