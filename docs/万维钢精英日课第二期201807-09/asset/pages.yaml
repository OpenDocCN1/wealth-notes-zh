  md: '# 日课211 | 《赌博思维》1：谁配得上说“不在乎输赢”


    日课211 | 《赌博思维》1:谁...


    今天开始咱们说一本2018年出版的新书，叫《赌博思维：怎样在事实不全的情况下做出更聪明的决策》（Thinking in Bets: Making Smarter
    Decisions When You Don''t Have All the Facts），作者是安妮·杜克（Annie Duke）。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_98_0.png)


    杜克的学术专业是认知心理学，但她有一个更显眼的身份，是职业扑克高手。她有20年的职业扑克比赛经验，在大赛中拿过好几个冠军，赢得的奖金超过400万美元。


    但这不是一本教你怎么打扑克的书。近年来，杜克从职业扑克圈淡出，转型给CEO之类的大人物做演讲和培训，她教的是科学决策。这也是这本书的内容。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_98_1.png)


    你愿意听一个打扑克的教你怎么决策吗？我们寻常的看法，领导决策的都是大事，而扑克只是一个比较低端的游戏……但是请注意，职业扑克可一点都不低端。职业扑克大赛的奖金常常比职业足球和网球还要高。职业扑克选手的重大决策涉及到的金额并不比一般公司的领导少。


    早在冯·诺依曼创始博弈论的时候，他首先想到的博弈就是扑克。一般人要操心的事情很多——而职业扑克选手，是职业的决策者。


    # 1.扑克与决策


    一般人没有多少做决策的机会。人生大部分时间都是按照既定的路线走，你不会时不时停下来想一下下一步应该怎么办。而正因为决策的次数少，人 Hoạt不会对“决策”这件事做特别的训练，决策水平就很低，那么一旦遇到不熟悉的局面就容易不知所措。


    这表现在有时候你选对了，也不知道是怎么对的，选错了也不知道错在哪里。比如你手里有一笔闲钱，你面临的一个最典型决策就买房还是炒股。而中国过去这20年给的标准答案是你显然应该买房。如果你当初始的决策是炒股，现在你的朋友们会说你做出了可能是一生中最愚蠢的决策。


    但真是如此吗？房价比股价长得快可不是经济学常识。美国的历史数据是股市的增值速度显著高于房产。我们这个小专题不能帮你解决买房还是炒股的问题，但是我们可以让你看看科学决策应该是什么样。


    “德州扑克”的规则很简单，就是五张牌比大小，它本质上是一个决策游戏。下多大注、亮哪些牌、要不要来个虚张声势、是否假装自己的牌很弱、跟还是不跟，你的每个决策都是钱。


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_98_2.png)


    一场德扑通常要大家坐下来玩几个小时，平均每个小时要玩30把，也就是说一把只有两分钟——而你在这两分钟之内，有可能要做出20个决策。


    根据规则，你每次决策最多只有70秒的思考时间。用杜克的话说，你一个决策涉及到的金额也许能买一套公寓，可是你做这个决策的时间却在餐馆点菜还要短得多。职业扑克选手必须修炼科学决策水平。


    我们专栏以前说过希思兄弟的《决断》这本书，说的也是科学决策，但杜克更强调决策所面对的不确定性。


    打扑克和下象棋是两码事。象棋，所有的信息都摆在台面上，你一看就知道当前是什么形势。而扑克，桌面上亮出来的牌是不全面的，你得猜测对手手里有什么牌，具有很大的不确定性。更重要的是，扑克比赛的结果很大程度上受运气影响：水平低，牌好也能赢；水平再高，牌不好也得输。


    所以扑克象棋更像是真实世界中的决策——你的决策水平高低并不能完全决定决策结果的好坏。扑克的本质是赌博，但真实世界的很多决策也是赌博。


    人的大脑非常不善于处理不确定的信息。职业扑克选手要提高水平，就必须战胜大脑中各种认知偏误。为此，一个高手必须能够区分以下这些东西——


    +   * 运气和技巧

    * 信号和噪音

    * 决策水平和决策带来的结果


    我读这本书的感受是，这种决策能力是人一个的修行。决策高手和普通人有气质和境界上的差异。从这个意义上说炒股和打扑克能磨练你的性格，改变你的人生观。但是请注意，小打小闹地玩两把可不起作用——你得投入足以让你担心的钱才行。


    # 2.什么叫“你相信”？


    我们以前讲贝叶斯定理的时候说过，科学决策的第一步是把你对事物的判断给“概率化”。你不能说“你觉得要下雨了”，你得说“你认为下雨的可能性是65%”才行。


    这个道理非常简单，但是你很可能做不到。当一般人说自己“相信”什么事情的时候，他通常不会考虑概率。他要么全信、要么全不信。


    而且非常容易全信。从理论上来说，如果别人和你说一件事情，你决定信不信，应该按照下面这三步进行——


    +   1. 你听说这件事情；

    2. 你对这件事情进行思考和判断、审视它到底对不对；

    3. 你选择信还是不信。


    对吧？但实际上并非如此。我们的大脑不会对每一个信息进行审视，一般都是听了就信了。人实际接受信息的过程是下面这三步——


    +   1. 你听说这件事情；

    2. 先相信；

    3. 将来有机会的话，可能会审视一下这个信息是对还是不对。


    心理学家有个非常漂亮的、经过重复验证的经典实验。给受试者们看一张纸，纸上写了各种论断，比如“肥胖主要是吃脂肪太多”这样的話。这些论断中有些是真的，有的是假的，而且已经用颜色标记出来了：真的都用蓝色字，假的用红色字。


    受试者的任务是记住这些论断的真假，然后参加测验。研究者会在他们阅读的时候给个小小的打扰，增加一点认知压力，这样他们不会把论断全都记住。


    好，接下来的测试非常简单，还是这些论断，受试者只需判断真假。结果是受试者有很多判断错误——但他们的错误是不对称的：他们特别容易把一些原本是假的论断当成是真的。


    这个道理是人脑接收一个新的信息的时候，总来先假设它是真的。这也是为什么谣言那么容易传播。那如果你连审视一下真假的动力都没有，就更不用说决策了。


    那怎么克服这个心理呢？杜克说这就是赌博的好处。拿真金白银跟人打赌，有点 skin in the game，你自然就会好好地审视一番。从这个意义上讲赌徒是值得尊敬的。赌博，首先是严肃对待你的信念。'
