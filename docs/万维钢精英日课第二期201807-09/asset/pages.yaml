  md: '# 日课187 | 《柏拉图和技术呆子》6:大脑的字里行间


    今天咱们继续用计算机的 for 眼光审视真实世界。前 面我们说了，计算机只能处理可数 的东西，可以说是建立在有理数之上的。而真实世界，则有可能是一 也有可能不
    是 一 建立在实数上的。


    现在我们继续往下推演，一直 到下一讲要说的哥德尔不完备性定理，我们会导出一个非常深刻的、会让人受益终身的道理。


    请注意我们专栏几乎从来没有用过 “深刻” 和 “受益终生” 这种词汇来形容所讲的内容。但是哥德尔不完备性定理真的值得你用一辈子的时间慢慢把玩。我们不会纠缠这个定理的细节，但是我们要发抒一个意思。不管你的兴趣是科学、哲学还是艺术，归根结底都会落到这个意思上。


    我先说一个我曾经犯过的特别有意思的错误。


    # 1.笑话有没有限多还是无限多？


    现在我问你一个问题：这个世界上 的笑话，是只有有限多个呢，还是有无限多个？


    所谓笑话就是用几百个字写成的一篇短文，让人读了觉得很好笑的那种东西。直觉上你可能觉得笑话应该有无限多个，世界一直在演变，每个时代都总能发现新的好笑的东西来，对吧？可是你只要想数学，笑话显然应该只有有限多个。


    这个道理是这样的。首先笑话必须得是写得比较短的，不能让你讲半小时才把别人说乐。我们可以规定，笑话必须得是在两千汉字之内的文字。我们知道汉字的个数是有限的，大概是四千到六千个，就当有一万个吧。那从这10000个汉字中选出2000个，允许重复，进行排列组合合成文章，请问一共有多少种不同的
    方法呢？


    最多有10000的2000次方种。其实具体的计算方法和结果不重要，重要的是答案肯定是有限多种。


    所以笑话只有有限多种。其实不光是笑话，诗歌、散文，只要你限定字数，它就是有限的。当然这个 “有限” 是一个极大的数字，可能就算我们每秒读一个笑话，一直读到人类文明终结了也读不完……但是在理论上，只有有限多个笑话。


    大概在十多年前，我在博客上写下了这个说法。我想说的是其实所有笑话都已经存在了，只不过等着作家去把它们挑选出来而已。


    但是有一位读者留言，提出了一个反对的观点。他这个观点非常非常高级。


    他说这并不能说明笑话只有有限多个。同样一篇文字，每个人 get 到的笑点可以是不一样的。文字是有限的，但是文字背后的*意思*是无限的。不同的人对同一段笑话的解读可以千变万化
    —— 所以这么说来，笑话还是无限多的。


    所以写作是个双向的交流，你看我有时候就是从读者那里学到东西。他说的确有道理。其实你想想，音乐就是如此。曲谱无非就是音符的排列组合，所以你完全可以说乐曲只有有限首
    —— 但其实不然，因为同样的乐谱到不同的演奏者手中可以千变万化。考虑到演奏方法的变化无穷，我们大概可以说曲谱是有限的，但音乐是无限的。


    ……当然，如果你相信数字宇宙假设，这里所说的 “无限” 也只是一个错觉。数字宇宙里的乐器有有限的分辨率，所以乐曲的细微变化仍然是有理数的、可数的和有限的 ——
    就像非常高保真的数字唱片一样。


    但是纠结于数字宇宙假设没意思 —— 目前这只是一个信仰。现在我们不妨*假装*真实世界是个实数世界，我们看看能得到什么。


    # 2.处理实数的机器


    如果我相信真实世界是实数的，那么就有很多机器不像计算机那样只能处理有理数 —— 事实上，绝大多数 “机器” 都能处理实数。


    Lee 举了个例子，比如说，气球。你把气球充满气，它就变成了一个球形。如果气球的直径是1米，它的周长就会是π米。你可以把气球当成一个计算器，它帮你计算了 π
    —— 而 π 是一个无理数！气球，是一台可以计算无理数的机器。


    那你可能又要抗议了。你说这不对啊，测量总是 有误差的，我不管怎么测量也不可能从一个气球上测量出真正的圆周率！没错。但Lee说这无关关系，重点在于气球有一个周长，这个周长的本质是个无理数
    —— 至于你能不能测量，那是另一回事儿，那是你测量手段的限制，气球对此不负责 任。


    这个道理在于，哪怕你测量出来的输入和输出都是有理数，这个机器的本质也可以是实数的。有理数是你对世界有限的观测，而世界的本质是实数。


    输入和输出的东西都是可数的，但内部却有些不可数的东西：还有一个机器似乎也符合这个条件，那就是人的大脑。


    # 3.大脑能编码吗？


    现在有很多 人相信大脑只是一台普通的计算机。比如 你考察大脑内部的思维过程，无非就是脑神经元之间的连接，而神经元连接本质上是个二进制过程 —— 或者激发、或者不激发，对吧？这跟开关一样吗？也许人脑也是一个开关网络，跟普通计算机没有本质区别。


    再比如说 DNA。DNA 的遗传编码是用碱基对实现的，碱基只有四种，所以我们完全可以说 DNA 是一个四进制的数字信息编码。那也就是说，遗传信息是可数的。大脑，是从可数的
    DNA “种子”   长起来的。


    可要是据此就说大脑的一切活动都是可数的，我们总觉得哪里不对。


    我们想想。所谓 “可数”，就是像我们前面说的偶数、有理数和全体计算机程序那样，一个一个地列举下来。DNA 的确是可数的，写成文字符号的笑话、诗歌和乐谱也的确都是可数的，它们都可以按照同样的方式
    —— 列举出来。


    但是人的心灵、意识、自我 的感知、智慧和知识，这些也能写成代码一一列举吗？


    你要问我都有哪些想法，我无法一一列举。你要问我对一处美景的感想，我可能给你说一大堆话，但是不管说多少，我总会觉得有些感想无法写成文字。这也许是我能力不行，也许是现有的文字数量不够
    —— 但也许，是大脑内部的某些活动是不 可数的。


    也许大脑不仅仅是一个开关网络。我们知道药物可以控制大脑，营养也对大脑有影响，后天的经历、环境都对大脑都有细微的影响。这些影响是怎么体现到思维上的？也许大脑不仅仅仅是神经元的二进制活动。


    当然这些都是猜测。但如果我们假设大脑是个实数机器，内部有不可数的活动，那么根据前面说的香农信息论，大脑活动就是不可编码的。对大脑的任何观测结果，都必然有噪音和误差。


    遗传信息可以编码，而大脑不可编码，这就意味着一个人不可能把他的所有知识和智慧遗传给子孙后代。这个结论好像没什么，我们本来也知道不可都遗传。但是这也意味着，大脑活动是不可复制的！


    那也就是说意识无法上传。不管你怎么扫描大脑，你都只能得到有噪音的信息，你在编码过程中一定会出现失真，你永远无法记录大脑的全部活动。你的记录就像是人的日记 ——
    他写下的文字再多，也总会有一些东西没有写，有 些文字无法描述的东西。


    如果是这样的，那么我们就找到了人脑和计算机之间 的一个本质区别。这个区别就是计算机只能处理可数的、数字化的东西，而人脑的思维过程是不可数的。


    说白了，就是人脑中 有一些 “只可意会、不可言传” 的东西！


    艺术家完全理解什么叫 “只可意会、不可言传”。诗人会故意不把事情说得太细，画家会故意留白，这大概就是他们知道可数的语言和明确的笔画都有误差，并不能真实反映人的思想。还不如留下空白不测量，让读者
    —— 作为一个人 —— 去自'
