  md: '# 日课213 | 《赌博思维》 2:真理追求者


    日课213 | 《赌博思维》2:真理追求者


    今天咱们继续讲扑克高手安妮·杜克的《赌博思维》这本书。我对打扑克完全没兴趣，都是让人拉着被动玩，不记牌不算牌，主要靠运气好赢。而我上大学时的一些同学，现在身边有些亲友，都非常善于打扑克。我观察他们打牌，有个特别有意思的习惯：他们喜欢复盘。


    我们打牌从来不动钱，但是这些人就好像输赢了重金一样认真。他们每打完一把都要互相检讨 —— 也可以说是互相指责 —— 刚才出牌有什么不妥之处，有时候还面红耳赤。我从来不参与这些赛后讲评，所以我的水平一直没有任何进步。


    但是我仍然能靠运气好赢他们。扑克，就是这么一个游戏。有时候你水平再高也架不住别人运气好。生活难道不是这样吗？这就是为什么提高决策水平那么难。那你怎么办呢？


    # 1.怎样复盘


    虽然我经常靠运气赢，但是我的确是输的很多赢的很少，所以我相信世界上的确有“牌技”这种东西存在，扑克的胜负并不完全是随机的。上一讲我们说了，你必须把运气和技术分开。运气是不可控的，但是你可以提高技艺。而提高技艺的最重要方法，就是在比赛之后复盘。


    杜克的哥哥是比杜克更厉害的一位职业扑克高手，杜克最初就是跟哥哥学的扑克。而杜克最佩服的一位职业高手叫菲尔·艾菲（Phil Ivey），他被认为是现役扑克玩家中的世界第一，赢得过超过千万美元奖金，但更厉害的是他的气质——艾菲，已经达到了宠辱不惊的境界。


    艾菲会在每次比赛之后找人跟自己复盘。有一次艾菲比赛正好赶上杜克的哥哥担任解说，那天晚上他赢了50万美元。艾菲的庆祝方式就是拉上杜克的哥哥到一个餐馆，边吃饭边复盘。艾菲赢了，但是他把自己当天所有可能的错误都提出来的，听取杜克哥哥的意见。


    杜克没有讲述扑克打法的技术细节，但是她打了一个比方。在承认有运气成分的前提下，你的复盘应该是这样的：你要假设各种替代可能性。


    比如说你在大冬天开车，路过一个十字路口的时候，因为路上有冰，你的车失控了，导致一起交通事故。这件事当然有运气成分，但是如果你想从中吸取教训、乃至于提高驾驶水平，你应该这么复盘——


    +   * 你事先是否想到了路上可能有冰？

    * 明知是这样的天气，你是不是开得太快了？

    * 发现车开始打滑的时候，你的操控是否有问题：你方向盘是不是打错了，你是不是不应该猛踩刹车？

    * 小路容易结冰，大路应该已经都撒上盐了，你为什么当初不选择走大路？

    * 你家里有确更适合冬天路况的车，你为什么不开那辆车？


    这些可能性有的有用有的没用，但是你一定要考虑得非常全面，然后非常严肃地面对所有这些可能性。


    然后你会从中总结出两条经验教训。这些教训也不一定是对的，你这个总结本身也是赌——但既然是赌，那就是严肃的对待。这也是为什么这本书叫《赌博思维》——不赌，你这个思维就不够严肃认真。


    所以提高技艺的具体操作原则其实很简单，无非就是从经验中获得有效反馈，跟我们常说的“刻意练习”是一样的道理。可是会这么做的人实在是太少太少了。


    这不是技术问题，而是心理问题。


    # 2.经验≠教训


    《美丽新世界》的作者赫胥黎有句名言：“经验不是一个人身上所发生的事儿；而是人对他身上所发生的事儿的作为。”


    > Experience is not what happens to a man. It is what a man does with what happens
    to him

    - Aldous Huxley


    这个道理是如果你不能从经验中吸取教训，那么经验再多也没用。事实上大多数人打一辈子扑克水平都没有什么提高。吃一堑长一智这个话好说，但是一旦有运气的因素，刻意练习就非常困难。


    有个非常经典的、用老鼠做的实验。笼子里有个操作杆，如果每把这个操作杆拨动十下，就有食物奖励，老鼠很快就能学会这个操作。老鼠学会以后如果你决定取消奖励，老鼠发现拨动很多下也没有奖励，它也就放弃了。只要操作和奖励的关系是固定的，老鼠就能很快适应。


    但是如果把操作跟奖励之间的关系变成随机的——改成*平均*每拨动十下操作杆有奖励，但是有时候拨动一两下就有、有时候拨动20下也没有——老鼠就会不知所措。这种情况下如果你决定不再给奖励了，老鼠可能会再继续拨动几千次！


    面对随机性，老鼠无法在行动和结果之间建立联系。其实人也是这样，老虎机是回报最低的赌博游戏，但是人们对老虎机乐此不疲。


    一旦有运气成分，人们就很难想到还要吸取教训。不确定性会大大减慢你的学习速度。


    而如果决策涉及到很大的利益，你的决策反馈还有更大的障碍。


    # 3.自利性偏差


    刚才说到交通事故，斯坦福大学的社会心理学家罗伯特·麦考恩（Robert MacCoun）有个观察特别有意思。他发现在所有的交通事故记录中，75%的司机会指责是别人犯了错。如果事故至少涉及到两辆车，那么91%的司机都认为是对方犯错。而哪怕事故中只有一辆车，也有37%的司机能找到别人身上的原因。


    出了事儿都怪别人，这真是人之常情。心理学家对此有个专门的名字，叫“自利性偏差（self-serving bias）”。自利性偏差包括第一，如果我做这件事没做好，那肯定是因为不可控的、别人的、或者意外的缘故；第二，如果我做这件事成功了，那肯定是因为我水平高。


    这种态度会让你自我感觉良好，但是可不能让你提高决策水平。我们专栏以前有一篇文章叫《失败不是成功之母，成功是成功之母》，说的就是这个道理。人是不会从自己的失败中吸取教训的，因为他总能找到理由把失败归于别人。


    当然别人的失败有可能是你的成功之母，因为观察别人的失败，从中总结一个教训，完全不会伤害自己的自尊。不过这个方法对自利性偏差严重的患者来说也不容易——自利性偏差还包括，认为别人的成功都是因为运气，别人的失败则都是因为他这个人的水平本来就不行。


    杜克说，自利性偏差，是职业扑克选手最大的魔障。


    扑克是一种零和游戏，你赢就是我输，所以人们对自己和别人的输赢感受都太强烈了。我记得韩寒好像说过一次，对赛车手来说，比赛中如果有对手的车失控冲出跑道，你的心理会有一个极大的冲击——你会非常非常高兴！所以赛车手都要经过专门的训练，以免因为看着对手失控自己太高兴而导致自己也失控……


    我的亲友们虽然也爱复盘，但他们玩的是不带钱的。如果输赢涉及到很大的利益，你的感情可能会强烈到让你根本没法客观面对现实的程度。可是如果不涉及大的利益，你就不会真的严肃对待输赢的教训。


    那怎么才能克服这个魔障呢？


    # 4.怎样追求真理


    按照杜克的说法，大概职业扑克圈把克服心理障碍，客观面对决策和结果的这个过程，称为“追求真理（truthseek）”。只有真正的真理追求者——而不是那些患得患失的人——才能掌握扑克的大道。


    杜克列举了几个办法。


    一个办法是转换视角（perspective taking）。你能不能把自己和别人的成败给换位想象一下。比如说你跟你的大学同学各自同时创业。现在突然传来他的公司'
