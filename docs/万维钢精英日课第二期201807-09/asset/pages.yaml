  md: '# 日课202 | 启蒙与此时3: 懂的不一定信，信的不一定懂


    日课202 | 启蒙与此时3: 懂的..


    今天咱们继续讲启蒙运动。前面我们说了，启蒙运动的最基本假设是“人可以有理性”——不是“有理性”，也不是“没有理性”，而是“可以有”理性。人和理性到底是个什么关系呢？能把这个问题想明白，比会说一句“是非理性的”可高级多了。


    “非理性”是过去这十几年特别流行的词。丹尼尔·卡尼曼的《思考，快与慢》、丹·艾克里的《拖延行为学》，说的都是非理性。现在“行为经济学”几乎成了科普界的主流，正在给经济学成了靶子，谁要敢说人是理性的，简直就好像没读过书一样。


    事实是人性有时候会表现出“非理性”，但是人性中也有理性的种子。人有动物的一面，但人不是“裸猿”——启蒙，就是要让人摆脱蒙昧状态。


    那好，既然如此，那我们生而为人，就好好学习科学知识，学习现代社会的新道德规范，做个更理性的人呗？如果全体人类越来越理性，社会肯定越来越美好啊。


    ......这句话虽然不错，但是启蒙运动以来人的演化，跟学者们设想的也不完全一样。比如说，为什么有很多人用理性去做坏事呢？为什么有些人不怎么理性，生活状态好像还更好呢？为什么现代社会有这么多人反对理性呢？


    启蒙运动这个的理性的反义词不是“非理性”，而是“浪漫主义”。浪漫主义是一个非常文艺的潮流，认为人作为人不是来讲理的，是来讲感情的。浪漫主义认为田园牧歌的原始社会比现代社会好。


    那么理性，到底好在呢？


    # 1.理性*必须*是个好东西


    理性（reason）的理，是推理的理和讲理的理。推理和讲理都是学者的特长，学者们肯定希望能找到一个什么机制，说明有理性就是比没有理性好。平克在《启蒙此时》中找到的这个机制是进化。


    我们能把人送上月球、能探测引力波、能跟陌生人高效合作、能运行超大规模的企业，都得靠理性。平克说，进化会给理性一个正的“选择压力”，讲理性的族群会比不讲理性的族群演化得好，会获得更多的资源、有更好的生育率，更容易做大做强，所以理性必然被扬光大。


    # 2.谁更懂进化论？


    为了说明这个道理，咱们来做两道题。“得到”有很多课程讲到进化论，那我这儿有两道进化论的测试题，看看你学得怎么样。请听题——


    第一题：19世纪工业革命时期，英国郊区的很多地方因为空气污染，到处都是灰蒙蒙的。当时英国的一种飞蛾，整个颜色都变暗了。请问，飞蛾为什么会发生这种变化？


    +   （A）为了尽可能地和周围环境融为一体，飞蛾一定要变暗。

    （B）天生颜色更暗的飞蛾，因为环境的保护更容易存活下来，也更容易生育。


    第二题：从前有个私立高中，在一年之内，学生们的平均成绩有了显著的提高。请问以下这两个解释中的哪一个更像是进化论里的“适应”？


    +   （A）这所高中决定统一用入学测验的方法录取学生，而不再优先录取富裕校友的子女子。

    （B）在校生的学业更精进导致了成绩更好。


    答案是第一题选B，第二题选A。进化论里的变异是随机的，没有主动的方向，是自然选择让那些更适应的生物留下。


    # 3.思想和革命


    到底应该如何对待理性，又如何对待大师们用理性得出的思想呢？戈德堡有个洞见。'
