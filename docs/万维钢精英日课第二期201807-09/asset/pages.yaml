  md: '# 日课219 | 《多样性红利》4:歧视的解药


    日课219 | 《多样性红利》4…


    今天咱們继续讲斯科特·佩奇的《多样性红利》。佩奇总结了一套“多样性认知工具箱”，上周我们讲了其中的“视角”和“启动式”这两个工具，今天我们一次讲完剩下的两个，“解读”和“预测模型”。


    这是两个特别有内涵的概念。如果能理解和运用这两个认知工具，我敢说你就算拥有了高级的智力。为此咱们先举个例子。


    最近我在微博看到被层层转发的 一个小文章，其中又是民国社月笛的传奇又是当代的典故，得出一个结论叫“人要守规矩”，其实整个道理都不通，我看没有什么逻辑。而我注意到，最早把这篇文章发到微博的那个人，是个已经退休多年的乒乓球运动员。


    我就好像听见一个声音对我说，你为什么要读一个乒乓球运动员发的文章？她能有什么思想？可是另一个声音对我说，乒乓球运动员怎么了？也许人家也有真知灼见，可不能岐视啊。


    你肯定遇到过同样的矛盾。通常我们管这叫“贴标签”和“歧视”。给人贴标签，你就会有歧视；不贴标签，你就没效率。今天我们要说的，就是这两个高级的说法，这就是“解读”和“预测模型”。


    # 1.翻译、解释和解读


    我先帮你辨析三个英文单词。


    +   — translate，意思是翻译。

    — explain，意思是解释。这两个词的意思你非常了解。那么

    — interpret，是什么意思呢？


    首先它有翻译的意思。比如你要跟一个美国代表团谈判，需要找个口语翻译，这种口语翻译，就叫做“interpretator”，而不叫“translator”——后者特指文字翻译。


    但 interpret 这个词还有解释的意思。比如领导在讲话中说了一句很不寻常的话，这句话是中白话，不需要翻译，可是你无法猜会领导这是在表扬还是批评你，你需要找人给你解释一下，这个就叫interpret。但这个“解释”，和explain，似乎又有所不同。Explain
    更像是解释“为什么会如此”，而 interpret 则是说“这代表什么意思”。


    所以我觉得也许应该把 interpret 译为“解读”。它的名词形式，interpretation，是你对一个事物的“定性”。


    比如说，中超上海申花队有个球员叫登巴巴——


    ![](img/ba33fefa4cb859c1ef2d9fb0a4ac1b39_122_0.png)


    当你想到登巴巴的时候，你会把他当成“什么”呢？在不懂球的中国人眼中，这是一个黑人。在足协领导眼中，这是一个外援。在球迷和球员眼中，这是一位强力前锋。


    登巴巴有各种不同的身份，你把他当成哪个身份，就是你对他的“解读”。那么你可能马上会想到，这不就是我们前面说的“视角”吗？以我之见，在佩奇这个体系下，解读和视角的区别仅仅是数学意义上的——


    佩奇说的视角，是从观察对象到语言的“一对一”的映射；佩奇说的解读，则是“多对一”的映射。解读，是对视角的进一步简化。


    比如现在有五只狗，它们分为三种不同的颜色（白色、黑色、褐色），同时又分为三种不同的尺寸（大、中、小）。一个完整的视角，是按照颜色和尺寸这两个坐标，给所有这些狗建立一个二维的表格——


    | | 白色 | 黑色 | 褐色 |

    |---|---|---|---|

    | 大 |  | 斑点哈犬 | 马上士提夫犬 |

    | 中 |  | 拉布拉多犬 |  |

    | 小 | 玩具贵宾犬 |  | 沙皮犬 |


    而如果你只考虑一个维度，比如“黑色”的狗，那就相当于在这个视角之下进一步把狗分类，这就是一种“解读”。比如看到一只苏格兰犬，你可以把它定性为“大狗”，也可以把它定性为“黑色的狗”——这两种定性完全是你自己主观的、任意的选择，也就是你的解读。


    说白了，解读，就是在一个视角之下，把东西做进一步的分类。如果你的分类方法是选择视角中的一个维度并且忽略其他维度，那就叫“投影解读（projection interpretation）”。而你也可以不管什么维度，任意选择几个东西说它们就是一类，这就叫“聚丛解读（clumping
    interpretation）”。


    # 2.足球妈妈


    假设你是一个总统候选人……的竞选团队里的一名专家。现在我们能用于做广告的竞选经费有限，需要精确选择，到底应该向哪一类人，精确投放广告。


    # 3.预测模型


    给定一个大视角，你可以任意选择分类解读，而一个有意义的解读，必须得能做出经得起检验的预测才行。专家列举了足球妈妈这个分类，他就必须得证明这个分类里的选民有“尚未决定投票给谁”这么一个特点。这就是预测模型。


    预测模型 = 分类解读 + 预测


    # 表4-2 剧本性质与利润的映射


    | “性” \ “暴力” | 无 | 低 | 中 | 高 |

    |---|---|---|---|---|

    | 无 | B | B | G | B |

    | 低 | B | B | B | G |

    | 中 | G | B | G | G |

    | 高 | B | G | G | G |'
