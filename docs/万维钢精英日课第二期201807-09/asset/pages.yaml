  md: '# 日课217 | 如果修心能养生，你应该怎样三省吾身


    日课217 | 如果修心能养生，…


    今天咱们说一个科学观念上的新进展，这个进展可直接对你的身心健康有好处。


    咱们先讲两个故事。老王进入四十岁以后，明显地感觉自己的身体不如以前了。他白天稍微工作一会儿就会感到很劳累，四肢乏力，常常犯困。老王知道这是因为自己的睡眠质量不好，晚上躺在床上总爱想事情，有点焦虑。情况好像越来越严重，老王甚至觉得已经有点抑郁了，他赶紧去看了医生。


    医生的诊断结果的确是长期失眠导致的身 体不适。医生给老王开了一些有助于睡眠的药，可是老王仍然抱怨睡不好。最后医生让老王佩戴一个智能手环，他要实时记录老王的睡眠，看看问题到底出在那里。


    几周之后，医生看着老王的睡眠数据，感到非常不理解。老王的睡眠质量相当好。他每天都能连续睡八九个小时，不管按什么标准，这都已经足够了啊。


    老王以为自己没睡好，他的身体表现就好像真的没睡好一样。


    小张今年二十多岁，她正在减肥。小张知道，要想保持身材，就必须尽量吃低糖低热量的“健康食品”。有时小张的午餐就是一点水果和蔬菜。但是小张也深深地体会到，“健康食品”真的都不怎么好吃……而且最大的问题是根本吃不饱。小张经常处于饥饿状态，她只允许自己每周吃两顿正常的、好吃的、能吃饱的饭。


    有一次参加公司活动，小张看现场提供的 蛋糕很不错，做得很漂亮，感觉应该好吃。小张决定破戒一次，她走上前去拿起一块 蛋糕。这时候旁边有个工作人员热情地告诉她，这个是低热量的健康蛋糕，你多吃点没关系。小张就吃掉了两块。确实很好吃……可是确实没吃饱。


    小张不知道的是，那个工作人员说谎了。这个吃蛋糕的活动其实是一个实验。现场有一半的人被告知这是健康蛋糕，而另一半人则以为这就是正常的、高热量高脂肪的蛋糕。人体内有一种“饥饿激素（ghrelin）”，能促进脂肪吸收，降低新陈代谢速度，并且让你感到很饿。吃一顿正常的食物之后，饥饿激素的水平应该下降。这也是那些相信自己吃的是正常的蛋糕的人的表现，他们不饿了。


    但是小张和她所在的这一组的人，他们的饥饿激素水平显著高于另一组。他们以为自己吃的是健康蛋糕，他们以为自己没吃饱，他们的身体就真的像没吃饱一样，拼命吸收和储存脂肪。


    这两个故事不是我胡乱编的。它们取材于最新一期《新科学家》杂志报道 [1] 的几项研究。老王和小张的情况，叫做“反安慰剂效应（nocebo effect）”。


    你肯定听说过“安慰剂效应（placebo effect）”。一个人觉得自己身上这里疼那里疼，到医院医生给他开了一个药，他吃下去感觉真的好多了 ——殊不知，那个所谓的药的成分就是淀粉，根本没有对症的作用，是个“安慰剂”。病人所谓的“感觉好多了”，其实完全是个心理作用。然而有意思的是，对很多病症，在最科学、最客观的检测之下，研究者发现服用了安慰剂的病人不仅仅是“感觉好多了”，而且他身体的硬指标，比如血压之类，也真的变好了。


    人的思想，可以切实地，影响人的身体状况。


    而所谓“反安慰剂效应”，则是一个人本来没事儿，因为自己以为自己有问题，结果就真的有了身体问题。老王睡眠没毛病，小张吃的其实是个正常的蛋糕，可是他们的身体反应就跟失眠和吃了健康蛋糕一样。


    反安慰剂效应的极端例子是自己能把自己吓死。1970年代，美国的一个病人被医生诊断是肝癌晚期，过了几个月他就死了 ——可是解剖显示，当时的医生是误诊，他根本就没有肝癌。他不是死于癌症，他是死于以为自己有癌症。


    安慰剂效应和反安慰剂效应到底是怎么回事儿，想到底是怎么影响身体的，现在科学家还没有完全搞清楚。但我想说的是这里面并没有一个什么神秘莫测的、统一的机制 ——
    科学家已经找到了作为原理不同的几种机制，而且大多跟大脑让身体分泌某种激素有关，比如刚才说的“饥饿激素”。'
