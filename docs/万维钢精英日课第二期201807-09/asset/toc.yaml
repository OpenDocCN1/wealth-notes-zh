  - 第二，群体中的每个人，都必须有一定的能力。也就是说每个人都得够格才行——国际象棋棋手可以，但球迷不行。
- - '##'
  - 第三，群体中每个人都有跟别人不一样的视角和解决问题的办法。那也就是说每个人都要有他独特的价值。
- - '##'
  - 第四，群体的规模必须足够大。
