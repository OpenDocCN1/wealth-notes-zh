    \n阿罗并不反对民主。只是，从集体选择这个环节，论证了民主面临的威胁。民主，也有不同形式，好的和坏的。下一讲，我们继续聊聊民主的阴暗面，聊聊《独裁者手册》的两位作者布鲁斯·梅斯奎塔，和阿拉斯泰尔·史密斯。\n\
    \n## 划重点\n\n- 阿罗不可能定理：\n    - 我们知道，民主和投票的规则，就是将大家选择汇总。按照少数服从多数的原则，决定选举的结果。这符合集体利益和个人偏好，听起来公平又有效。但阿罗证明，事情并非如此。\n\
    \    - 阿罗认为，如果有两个以上偏好不同的人进行选择，当选择的政策也是超过两个。那么就不可能存在一种方案，能够将每个人多种方案的偏好次序，转换成社会偏好次序。也就导致选举的结果，不可能皆大欢喜。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_26_0.png)\n\n## 14｜梅斯奎塔与史密斯：决定政治优劣的关键是什么？\n\
    \n徐远·经济学大师30讲\n\n![](img/8c0fc93ead386915a4b5043d2527383b_27_0.png)\n\n欢迎来到《徐远·经济学大师30讲》。\n\
    \n我们这一模块的主题是政府和发展。其中涉及了权力的运行规则和公共内容，我们讨论了“公民民主”，谈过“投票的悖论”。这一讲是这个模块的最后一课，我要跟你详细聊的是民主的“暗面”。\n\
    \n以前这样的话题，主要属于政治学范畴，随着公共选择学兴起，经济学也开始进入这一领域。今天介绍的是两位政治学家，布鲁斯·梅斯奎塔，和阿拉斯泰尔·史密斯。虽然他们是政治学家，但是他们对于民主问题，采取的分析方法，很多是经济学范畴。和我们这一模块契合度很高，所以推荐给大家。\n\
    \n他们两个人，都是纽约大学政治学教授。多数人都知道，主要是他们写的这本《独裁者手册》。当时去看，就四页介绍册页，千万别看。因为看了，很有欺骗感。因为，这本书会颠覆你对民主和独裁的原有认知。\n\
    \n### 民主与独裁共存的比利时国王\n\n民主和独裁，谁好谁坏？你第一反应，当然民主更好。中国多年流行过一篇文章，叫《民主未必好》。从经济学角度衡量，答案未必如此。上一讲，你了解了选举悖论，今天换个角度，从权力结构切入，你会发现，民主其实未必多好，独裁未必多坏。两者其实是不同的权力安排，甚至，你可以理解成，一种方便的标签。\n\
    \n如果你是时空穿越者，回到十九世纪初，欧洲的比利时，你会看到什么？你可能会觉得，天哪，这个国家简直是天堂。经济欣欣向荣，正快速走向现代化道路。在短短几年之内，就从专制国家变为民主国家。当时比利时成年男子，都有选举权，工人可以罢工，更不用说，选举工作，保护环境啊。比利时的出现时间，比起美国都提前几十年。\n\
    \n如果你穿越回去的地方，是非洲刚果。那么，对于当地的用户群体可能很糟糕。这里简直是地狱。对于本地文化行业的侵略贸易，当地状态，就是尽量压榨。最多人地，是处在奴隶一样的生存状态中，需要被沉重的税率，甚至随时随地都要被随意剥夺、砍断等危险生存的情况。刚果民主邦建立时，只有2500万人。后来只剩下不到1000万人。经济状况可想而知，一塌糊涂。\n\
    \n这两个国家，一个天堂，一个地狱。但你能想象吗？这两个国家背后的统治者，居然是同一个人。那就是比利时的利奥波德二世。你可能说，殖民者确实没有人性了？但不否认，比利时的确是实业政制。耐人寻味的问题是，同一个人，几乎在不同时间，不同地方，为什么会出现截然不同的局面？\n\
    \n你学过制度经济学，也学过激励兼容理论，还学过公共选择理论。那么，你应该明白，利奥波德二世也有自己的算盘。我们对利奥波德二世的政治行为，试着进行分析，你看，面对不同的制度，他采取了不同的应对，这就造就了利奥波德二世，同时扮演了魔鬼和天使的角色。\n\
    \n### 标题\n\n不过，这一讲，我要给你提供一个新维度，超越民主和独裁的分类，去看统治的内核。按照梅斯奎塔等的研究，决定政治是好是坏，关键是什么？民主制度不是重点，选民也不重要。重要的是，作为统治者，满足对你来说不可或缺的人，也就是致胜联盟。\n\
    \n在《独裁者手册》中作者把国民分为三类：\n\n- 第一类，是名义上的支持者。比如，很多黑人支持奥巴马当美国总统。这是一个很抽象的支持者人群。\n- 第二类，有影响的实际支持者。比如，某个候选上台助跑的两人。\n\
    - 但是更重要的是第三类，这是最关键的一类，书中把他们叫“致胜联盟”。顾名思义，就是最核心的支持老。对于一统治者而言，怎么样能收到支持最大？原则很简单，控制的利益越多越好。但是不利这控制的人要越少越好。这是个简单的除法算式。所以，那些最核心的支持者越少，也是“致胜联盟”越小，对领导人越划算。至于“前面多个人呢？要么表示不要，要么干扰可以被忽略，所以无所谓。\n\
    \n回到利奥波德二世。在比利时，致胜联盟比较大。所以他不得不讨好成百胜的女儿子民来。而在刚果，致胜联盟就少，维持暴力统治即可。这就是为什么同一个人，同时成为魔鬼和天使。\n\
    \n和阿拉斯泰尔·史密斯提出的理论不是普通的帝王权术，更不是刻板的学院研究。想要理清制度的优劣，和统治者的政治决策，关键在于，摆脱个人偏好，深入好的或者坏的行为背后，剖析运作机制。也符合经济学思路。其实经济学，可以运用很广。\n\
    \n历史学家吴思，发明了潜规则与血酬定律。我 和 他 聊 《独裁 者手 册》，他就说很有启发，他从中总结了十几条政治领域里的定律。他说，中国人讨论政治，往往用一些大词，比如主义、道路、制度之类的大概念。概念当然有用，但不能代替深入具体的分析，也就是对决策主体的利害计算。\"\
    谁决策，谁参与决策，这个决策者到底是谁，他如何权衡利害，他的个人利益何在，如何在不同的情景之下追求利益最大化，这是最基础的分析。\"他说，这本书对中国人启发，应该就是实事求是。\n\
    \n是不是有些启发？所谓利害计算，其实就是经济人思路。你学这门课，多数不是为了做经济学家，而是理解真实世界，学习新的思维方式。经济学已经在各个学科攻城略地。我们这一模块，还涉及了财税政治公共管理等领域。在生活中，多一分经济学思维，可能很多惯常认识，就完全不一样。我们第一模块是围绕市场制度展开讨论，第二模块围绕国家展开讨论。下面一个模块，我们进入宏观经济模块。\n\
    \n## 划重点\n\n- 民主和独裁的目的，都是维持统治，而不是统治得当。选民与致胜联盟的大小，直接决定了统治者的行为模式。\n- 布鲁斯·梅斯奎塔，和阿拉斯泰尔·史密斯，提供四条统治规则。\n\
    \    - 1、统治者所关心的，获取和维持政治权力，与人民的普遍利益无关；\n    - 2、依赖于少数人，来获得并维持权力，最有利于政治生存；\n  \
    \  - 3、当这一小群亲情，知道有一批人等着取代他们时，领导就有了更多权力；\n    - 4、依赖于小团体，能够征收较高的税收。\n\n![](img/8c0fc93ead386915a4b5043d2527383b_28_0.png)\n\
    \n## 15 | 凯恩斯：经济与政治的关系由什么决定？\n\n徐远·经济学大师30讲\n\n![](img/8c0fc93ead386915a4b5043d2527383b_29_0.png)\n\
    \n你好，欢迎来到《徐远·经济学大师30讲》。\n\n这一讲开始，我们进入宏观经济学模块。第一讲，当然要从宏观经济学的开山祖师凯恩斯聊起。\n\n1883年凯恩斯出生在英国剑桥。生日和亚当·斯密是同一天。小时候的他是很中“学”长大的剑桥学生。可以说他的人生，充满了贵族气息。他本人是相当“群泛”，朋友圈更不简单，包括哲学家罗素、诺特根斯坦，小说家伍尔夫，诗人艾略特等各种精英。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_29_1.png)\n\n凯恩斯身材高大，十指修长。尽管他自认长得帅，但多数人认为他很魁力，我看过的照片，认为凯恩斯的身材魁梧，就是稍微有点驼背，大概是因为身高两米八，有八分之一。他是他同治，但结婚，但后来还是与一位女士结婚，并组建了家庭。对象是位俄罗斯芭蕾舞演员，尽管两人没孩子，但是，是公认的幸福的一对。\n\
    \n### 经济学家的分类\n\n每一个学科，总有一两位标志性人物。对学科内的人来说，他们就像摩西明玛一样，得别人不说不，同时反对你，最后都不过生活在高墙阴影下。我们都谈到的，都是经济重要人物。但是要达的很显著的一个角度，真不多。他的理论，很牵强一点就是凯恩斯主义。当现当经济需求不足时，为了拯救经济，政府应该增加投资。你可能已经听过，作为宏观经济学的课，我更想聊聊，凯恩斯的思想如何诞生，如何传播。\n\
    \n你知道，经济学家有很多分类，宏观与微观，学院派与市来派，有各种子类，数都数不尽。其中，有一种分类，我觉得很有意思。这是何帆老师聊，他的观点。经济学家，可分为两种：当过官的和没当过官的。二者，有格差到大了。注意，我说的是当高级职位，我的是，有没有当过官，对现实和政治的感觉大不相同。当过官的，往往关注理论与实际结合。最典型的，凯恩斯就是当过官的。他的理论对手哈耶克，就没当过官。\n\
    \n凯恩斯伟大，首先就在于，他不是那种把自己关在书房里的学者。他永远关注现实，也时刻发表着介入。而当时的局势的恶化，好像也时刻渴望着他的指引。当大萧条出现，可以说是百年不遇。1932年，是大萧条最惨的一年，有人问凯恩斯，历史上有没有类似大萧条这样的事？凯恩斯说，有的。那就是黑暗的中世纪，前后共400年。\n\
    \n现在重大的危机现场。\n\n就这样，凯恩斯的的思想，通过美国，传播到全世界。这个过程，可以看作一个缩影。也就是经济学思想，如何像火种一样在世界上点燃，再绽放。无论现实如何变化，思想始终存在。也许会暂时受挫，但火种不会熄灭。凯恩斯就说过，那些认为自己完全不受任何理念影响的实干家，通常是某位已故的经济学家的奴隶。\n\
    \n我谈凯恩斯不少。写过本经济思想史的书，就叫《凯恩斯的中国聚会》。不少朋友常有误会，认为我凯恩斯主义者。其实，我认为凯恩斯和凯恩斯主义，并不能等同起来。我读凯恩斯传，常常为他过早的离世而感到遗憾。1946年凯恩斯就去世了，来不及，见证凯恩斯主义的辉煌时刻。更不用说，检讨其中的失误。下一讲，我们就谈谈凯恩斯主义。\n\
    \n## 划重点\n\n- 凯恩斯的作用：\n    - 在大萧条时代，西方世界的舞台上，罗斯福正在和希特勒竞争。面对这样的对手，英美这些自由国家，迫切需要新的理论武器。经济学家赫希曼就指出，凯恩斯主义不简单，不仅是一套实用经济政策。本质上，它是一种有力的思想武器。更深地看，在集体主义和法西斯主义之外，开拓了新的选择。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_30_0.png)\n\n## 16 | 凯恩斯主义：大萧条中经济的出路在哪里？\n\
    \n徐远 · 经济学大师30讲\n\n你好，欢迎来到《徐远·经济学大师30讲》。\n\n上一讲，我们介绍了凯恩斯，聊到了他的思想，如何与罗斯福相遇。这一讲，我们就来聊一聊凯恩斯主义。\n\
    \n凯恩斯1946年去世之后，凯恩斯主义日渐发达。此后二三十年代内，成为主流。这期间，造成了欧洲和美国的战后繁荣。在有的国家，甚至有黄金三十年的说法。\n\n\
    风水轮流转。到了七十年代，这个万能药方，好像逐渐失效了。美国的西海岸，出现通货膨胀，英国是经济滞胀和通货膨胀同时存在。于是，凯恩斯主义经受不了。不少人都认为，凯恩斯主义已经死了。谁知道，几十年后，爆发了2008年金融危机，经济不冷。各国不得不加大救市。于是，凯恩斯主义，再度死灰复燃。\n\
    \n此情此景，让人想到货币主义大师，弗里德曼的名言，“我们现在都是凯恩斯主义者了”。这括号里面，我们知道货币主义学派，几乎就是是对凯恩斯主义的反叛，从而开山立派。可见，凯恩斯主义，确实闹得很大。在中国，经济学家张维迎曾经大声呼吁，要埋葬凯恩斯主义。\n\
    \n### 凯恩斯主义到底说了什么？\n\n凯恩斯主义到底说了什么，让人如此喜爱呢？简单来讲，凯恩斯主义主张，当经济需求不足时，要搞财政政策，政府应该加大投资。这样就能挽救经济，刺激消费。\n\
    \n这些你可能早听过了。我想强调的是，天下的凯恩斯主义，还真不是一根苗。具体来说，可以分好凯恩斯主义与坏凯恩斯主义。\n\n所谓凯恩斯主义，与《通论》一书，有很深的渊源。这本书，公认是宏观经济学创立的标志。如果你读过，就知道并不好读。可以说烧脑烧烧。\n\
    \n这样一本不好读的书，流行的关键，与时代背景有很大的关系。1929年股灾和1933年大萧条，让各国经济陷入危机。最严重，大萧条的欧洲，比较大同小异。就是说，出现过市场崩溃时，应该让市场自由活动。这个逻辑，我们应该熟悉。从亚当·斯密开始，大家都知道，市场经济“看不见的手”自动运行。这意味着，经济的问题，随着时间推移，总会被解决的。\n\
    \n听起来很有道理。但唯一的问题，在于这个过程实在太漫长了。中间很多人会遭受痛苦。大萧条中，最大的问题是失业。传统经济学家认为，失业除了自愿失业，还有就是摩擦性失业。意思就是，失业多数是自然性失业，因此，失业问题不大，市场会自动调节。\n\
    \n面对日益紧张的现实，这种分析，听起来太不太可信了。如果真有工作，那么一家人就陷入深渊，痛苦程度可想而知。要知道，1933年美国失业率是15.9%。这意味着一六分之一劳动力失业。第一大萧条之前，失业率只有3%左右。\n\
    \n当时美国总统，是胡佛。他也相信，市场经济可以自我修复。他不作为的后果，就是经济不断恶化。失业者数量激增，四处流浪。于是，戏剧性的一幕出现了，那就是，在美国这样资本主义的大本营，也突然出现这么多流浪汉。在繁华的大街上，他们用旧铁皮、纸板搭起了棚户区。并起名胡佛村。\n\
    \n该坚持。关键是，市场失灵的时候，需要对策。因此，凯恩斯主义，应该看作一个重启的操作，当市场这台电脑，运转太久，偶尔死机时，是政府不得已而为之的临时策略。\n\
    \n对于凯恩斯这样的大师，崇拜和误读，几乎一样多。据说，凯恩斯晚年，曾经有这样一个场景。面对一屋子经济学家，他说：在座的，都是凯恩斯主义者，但我不是。在同一经济学派中，凯恩斯似乎知音难觅，但是却与理论的对手，更有共鸣。比如哈耶克。我写过有关凯恩斯的书，从小也很喜欢哈耶克。常有自由派朋友问我，一个人怎么能同时接受，凯恩斯和哈耶克的思想？他们觉得，这不水火不相容嘛。我觉得，两人并不是完全对立，而大多数人，认为这两个人在观点上是对立的，不少源自对两人理论的误读。我们下一讲就来聊一聊哈耶克，带你了解，为什么我认为他与凯恩斯会更容易产生共鸣。\n\
    \n## 划重点\n\n- **凯恩斯主义的好与坏：**\n    - 凯恩斯主义，可以说专为应对危机而生。不是危机时刻，滥用凯恩斯主义，只能结出苦果。这种情况，可以叫超级凯恩斯主义。正是这种政策，让凯恩斯主义背负不少骂名。更不用说，凯恩斯主义倡导的，是宏观调控，而不是干涉具体行业与企业。而现实中，很多行政手段，其实是微观调控，具体到行业以及企业。二者的管控方式，存在本质不同。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_32_0.png)\n\n## 17 | 哈耶克：贯穿现代经济学史的大辩论\n\
    \n徐远 | 经济学大师30讲\n\n![](img/8c0fc93ead386915a4b5043d2527383b_33_0.png)\n\n你好，欢迎来到《徐远·经济学大师30讲》。\n\
    \n这一模块是宏观经济学模块。我们已经学过斯密斯密。他是一个人，就颠覆了古典经济学，开创了宏观经济学。当然，古典经济学也不会甘心退出历史。自然有人捍卫了。其中一位，几乎靠与凯恩斯辩论，赢得大师伯地位。那就是我们今天耍到讲的哈耶克（Friedrich\
    \ August von Hayek, 1899.5.8– 1992.3.23）。\n\n哈耶克1899年出生在维也纳，1974年获得诺贝尔经济学奖。奥地利学派的大师米塞斯的最后学生。哈耶克的背景可以追溯到二战前后的奥地利。两人都是在维也纳接受教育，到奥匈帝国（简称）中，因为他们都成了反共者。最后，两人在英美界成名。\n\
    \n哈耶克是犹太人。年少时，他就目睹了法西斯的兴亡与覆灭。但是，当奥匈帝国解体后，原本保守的维也纳，保护了犹太哈耶克，就变得毫无保护。1913年，他的外祖父发起了社会主义试验，导致产量剧减，米价物价上涨70倍。哈耶克家族深受影响，甚至没让他进德国国防大学。1938年，纳粹吞并奥地利。同年，哈耶克加入英国籍。\n\
    \n这些经历，使他对计划经济思想，终生抵恶。1947年，他发起一个新自由主义学术共同体，也就是后来大名鼎鼎的朝圣山学派。知名学者波普尔、米塞斯、奈特、弗里德曼等，都是学派成员。\n\
    \n私下里，哈耶克个性温和。但一涉及到历史上，他给自己的方式坚持。在经济学史上，他给人三大印象。一是好辩。三十年里场重要的经济学争辩，他可参加了几十。第一，二是他反对凯恩斯主义。第二，三是他和凯恩斯关于经济的大辩论。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_33_1.png)\n\n### 与凯恩斯的论战\n\n哈耶克一辈子，最大论战对手是凯恩斯。1931年，伦敦经济学期刊刊登凯恩斯、肯后的俱乐部，就是作为对哈耶克的枪手。他1992年去世前，最大遗憾，就未与哈耶克清算凯恩斯主义。从身材来看，哈耶克和凯恩斯都是高个儿。超过几米8，哈耶克比凯恩斯年轻16岁。但他看起来，比对方大。一子都给人，中欧知识分子的印象。总是神情忧郁，搭配红西装，说英语，也有伦敦那一带浓厚的口音。\n\
    \n两人争论很著名，似误解也不少。表面争论的是经济。往深里看，其实是文明胜负的问题。\n\n争论背景是大萧条时期。经济危机导致失业率高达40%。各国采取的应对方案不同。苏联和纳粹德国都是新计划经济，依靠计划模式，将国家军为一级军事机器。这导致了当国家一时短期，经济的张了大天平，向这些国家倾斜。而当时主张自由的美英世界，反而是显得有些力不从心。\n\
    \n于是，凯恩斯出现了。你已知道，他主张扩大投资。的出发点是反对意见。他认为大萧条的根源在于政府为计。为什么？哈耶克指出，政府和中央银行联合，是一个具体的个人在制定政策，他们这些人当中，过去太想往经济决策，破坏了人们自发的市场秩序，经济。结果呢，一时间的人流繁荣，让市有人认出了。这样人为的繁荣中，资源存在很多错配。最终，导经济危机。在第一步，政府已经得。如果危机危机，政府再次介入，更加火上浇油。因此，必然反制夺人们的经济自由。\n\
    \n这场辩论为什么那么受关注？因为战争。两大世界大战成了世界，也待人们重新思考，甚至重新评估不同制度的问题。这三十代人的斗争，影响了政儿人的历史。二战后的历史，经济学史上，最著名的经济学学术，辩证的结束，不意味着分出胜负。像两人观点，后人形成了各自的阵营。使得这两人的辩论，几乎贯穿了整个现代经济学史。\n\
    \n### 《通往奴役之路》\n\n一般认为，他们两个人的辩论，宏观上对哈耶克更不利。因为凯恩斯主义，哈耶克显然是赔钱方。但实际上，通过这场辩论，凯恩斯也收获不少。从辩论中，他汲取了大量的战斗，产生了理论创新的欲望。\n\
    \n你知道，凯恩斯宏观经济学鼻祖的地位，主要凭借1936年出版的《通论》。《通论》引发学界内外部讨论，引发凯恩斯论著者。我起来说，全书没有直接提哈耶克。但实际上，不少地方的解释和说明，都是针对哈耶克的批评。我常学书翻，他的《通论》，做了不少学术翻，他认为，与哈耶克的论战，是凯恩斯写《通论》最重要的推动力。\n\
    \n《通论》的巨大成功，显得哈耶克有点落寞。30年过去了，大家完全忘记了他的赢。一些得意门生，也依附凯恩斯。比如经济学家卡多夫和弗格森。\n\n但是，哈耶克并没有闲着。在寂寞中他埋头工作。到四十年代，哈耶克完成自的重要著作《通往奴役之路》。其中，他对大政府主义开了一剂药丸。他得出，当政府对公共利益扩张了，到公共公民的自由时，人类奴役阶级也必然不远了。\n\
    \n这本书改变了世界，也改变了他的命运。书畅销，对他的在气也经济不断。更多的入门。不过，他说出来不想，就为了大销，也让他遭遇很多非议。很多学者觉得，专业的学者不写这样的畅销书。\n\
    \n无论怎么说，两人交锋的结果，是各自发展不同的理论体系。这给世界留下了了大遗产。两人虽是理论对手，私下里却不结。两人在观念，哈耶克也不是偏执和顽固。凯恩斯读《通往奴役之路》后，写信给哈耶克。说他的大战，只是在中道路的下界性问题上，有人太低估了中间路线的可行性。\n\
    \n### 哈耶克与凯恩斯辩论的影响\n\n凯恩斯所定的中间道路，真的存在吗？这是永恒的问题。其实，我认为应该存在。当经济正常运行时，政府不应过度介入经济，最大幅度地保护市场的经济自由。当经济出现危机时，必须的手段是重要。多年来，政府对经济态度都是摇摆不定。当危机来临，往往主动凯恩斯。一旦经济平好，哈耶克又占上风。\n\
    \n两人的分歧，本质上是世界观的分歧。凯恩斯，是一个实用主义者。对于意识形态和政治理论，他基本没太追求。很自然地，面对困择时，他会主张两边应该试错，探起经济。哈耶克则是一个怀疑论者。他有清醒的悲观态度，把理念看作不可动摇的信念。比如凯恩斯说“长期来看，我们都亡，哈耶克就批评道，这句话的命语，会遇到洪水滔天那一刻，并终将自食其果。\n\
    \n英国思想家柏拉图，将学分为狐狸学派与刺猬学派。刺猬学者，狐狸学者几乎无所不知，刺猬学者则只钻研某一领域。从这个角度看，哈耶克类似刺猬学者，一生做的一件事，就是捍卫自由市场。\n\
    \n哈耶克早年书，比如《货币理论和商业循环》《价格与生产》等，关注是从价格与货币周期等纯学术角度，往往是批判的。从《通往奴役之路》后，他的兴趣开始转移《自由与秩序》《致命的自负》等著作，他的视野，已经从经济学转向了政治哲学和经济学。所以，可以自然谈学政治、哲学。市场的必要，以自由秩序观念，去论证市场的可能。你看，从青年到晚年，横跨几十个学科和不同角度，哈耶克始终在做的是，总若作的核心，始终是捍卫自由市场。\n\
    \n在大陆，哈耶克更多地被当作经济学家。在台湾，他更多地被当作政治学家。他都自由门徒。无论是经济学还是政治学，他都得心应手。凯恩斯则更像狐狸型学者，兴趣总是在变化，他的名言是：当事实改变，观点也随然随之改变。\n\
    \n不过，哈耶克也有自己的分类。他说学者\n\n![](img/8c0fc93ead386915a4b5043d2527383b_33_2.png)\n"
  mdcn: "\n我开玩笑说，求你别去日本了。两人去世，都让我很唏嘘。这个时代，学术大牛很多，思想大师却很稀缺。阿罗，称得上大师。他的思想体现了人类知识探索的极致，他是真正的天才，他的研究与思考超越了经济学学科，他的贡献也属于全人类。就像阿罗自己说的，“人类社会，是一个合作的世界。为了荣誉和成功，我们无时无刻不在竞争。但社会不断前进的动力，正是来自我们从成功甚至失败中学到的知识。”\n\
    \n阿罗并不反对民主。只是，从集体选择这个环节，论证了民主面临的威胁。民主，也有不同形式，好的和坏的。下一讲，我们继续聊聊民主的阴暗面，聊聊《独裁者手册》的两位作者布鲁斯·梅斯奎塔，和阿拉斯泰尔·史密斯。\n\
    \n## 划重点\n\n- 阿罗不可能定理：\n    - 我们知道，民主和投票的规则，就是将大家选择汇总。按照少数服从多数的原则，决定选举的结果。这符合集体利益和个人偏好，听起来公平又有效。但阿罗证明，事情并非如此。\n\
    \    - 阿罗认为，如果有两个以上偏好不同的人进行选择，当选择的政策也是超过两个。那么就不可能存在一种方案，能够将每个人多种方案的偏好次序，转换成社会偏好次序。也就导致选举的结果，不可能皆大欢喜。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_26_0.png)\n\n## 14｜梅斯奎塔与史密斯：决定政治优劣的关键是什么？\n\
    \n徐远·经济学大师30讲\n\n![](img/8c0fc93ead386915a4b5043d2527383b_27_0.png)\n\n欢迎来到《徐远·经济学大师30讲》。\n\
    \n我们这一模块的主题是政府和发展。其中涉及了权力的运行规则和公共内容，我们讨论了“公民民主”，谈过“投票的悖论”。这一讲是这个模块的最后一课，我要跟你详细聊的是民主的“暗面”。\n\
    \n以前这样的话题，主要属于政治学范畴，随着公共选择学兴起，经济学也开始进入这一领域。今天介绍的是两位政治学家，布鲁斯·梅斯奎塔，和阿拉斯泰尔·史密斯。虽然他们是政治学家，但是他们对于民主问题，采取的分析方法，很多是经济学范畴。和我们这一模块契合度很高，所以推荐给大家。\n\
    \n他们两个人，都是纽约大学政治学教授。多数人都知道，主要是他们写的这本《独裁者手册》。当时去看，就四页介绍册页，千万别看。因为看了，很有欺骗感。因为，这本书会颠覆你对民主和独裁的原有认知。\n\
    \n### 民主与独裁共存的比利时国王\n\n民主和独裁，谁好谁坏？你第一反应，当然民主更好。中国多年流行过一篇文章，叫《民主未必好》。从经济学角度衡量，答案未必如此。上一讲，你了解了选举悖论，今天换个角度，从权力结构切入，你会发现，民主其实未必多好，独裁未必多坏。两者其实是不同的权力安排，甚至，你可以理解成，一种方便的标签。\n\
    \n如果你是时空穿越者，回到十九世纪初，欧洲的比利时，你会看到什么？你可能会觉得，天哪，这个国家简直是天堂。经济欣欣向荣，正快速走向现代化道路。在短短几年之内，就从专制国家变为民主国家。当时比利时成年男子，都有选举权，工人可以罢工，更不用说，选举工作，保护环境啊。比利时的出现时间，比起美国都提前几十年。\n\
    \n如果你穿越回去的地方，是非洲刚果。那么，对于当地的用户群体可能很糟糕。这里简直是地狱。对于本地文化行业的侵略贸易，当地状态，就是尽量压榨。最多人地，是处在奴隶一样的生存状态中，需要被沉重的税率，甚至随时随地都要被随意剥夺、砍断等危险生存的情况。刚果民主邦建立时，只有2500万人。后来只剩下不到1000万人。经济状况可想而知，一塌糊涂。\n\
    \n这两个国家，一个天堂，一个地狱。但你能想象吗？这两个国家背后的统治者，居然是同一个人。那就是比利时的利奥波德二世。你可能说，殖民者确实没有人性了？但不否认，比利时的确是实业政制。耐人寻味的问题是，同一个人，几乎在不同时间，不同地方，为什么会出现截然不同的局面？\n\
    \n你学过制度经济学，也学过激励兼容理论，还学过公共选择理论。那么，你应该明白，利奥波德二世也有自己的算盘。我们对利奥波德二世的政治行为，试着进行分析，你看，面对不同的制度，他采取了不同的应对，这就造就了利奥波德二世，同时扮演了魔鬼和天使的角色。\n\
    \n### 标题\n\n不过，这一讲，我要给你提供一个新维度，超越民主和独裁的分类，去看统治的内核。按照梅斯奎塔等的研究，决定政治是好是坏，关键是什么？民主制度不是重点，选民也不重要。重要的是，作为统治者，满足对你来说不可或缺的人，也就是致胜联盟。\n\
    \n在《独裁者手册》中作者把国民分为三类：\n\n- 第一类，是名义上的支持者。比如，很多黑人支持奥巴马当美国总统。这是一个很抽象的支持者人群。\n- 第二类，有影响的实际支持者。比如，某个候选上台助跑的两人。\n\
    - 但是更重要的是第三类，这是最关键的一类，书中把他们叫“致胜联盟”。顾名思义，就是最核心的支持老。对于一统治者而言，怎么样能收到支持最大？原则很简单，控制的利益越多越好。但是不利这控制的人要越少越好。这是个简单的除法算式。所以，那些最核心的支持者越少，也是“致胜联盟”越小，对领导人越划算。至于“前面多个人呢？要么表示不要，要么干扰可以被忽略，所以无所谓。\n\
    \n回到利奥波德二世。在比利时，致胜联盟比较大。所以他不得不讨好成百胜的女儿子民来。而在刚果，致胜联盟就少，维持暴力统治即可。这就是为什么同一个人，同时成为魔鬼和天使。\n\
    \n和阿拉斯泰尔·史密斯提出的理论不是普通的帝王权术，更不是刻板的学院研究。想要理清制度的优劣，和统治者的政治决策，关键在于，摆脱个人偏好，深入好的或者坏的行为背后，剖析运作机制。也符合经济学思路。其实经济学，可以运用很广。\n\
    \n历史学家吴思，发明了潜规则与血酬定律。我 和 他 聊 《独裁 者手 册》，他就说很有启发，他从中总结了十几条政治领域里的定律。他说，中国人讨论政治，往往用一些大词，比如主义、道路、制度之类的大概念。概念当然有用，但不能代替深入具体的分析，也就是对决策主体的利害计算。\"\
    谁决策，谁参与决策，这个决策者到底是谁，他如何权衡利害，他的个人利益何在，如何在不同的情景之下追求利益最大化，这是最基础的分析。\"他说，这本书对中国人启发，应该就是实事求是。\n\
    \n是不是有些启发？所谓利害计算，其实就是经济人思路。你学这门课，多数不是为了做经济学家，而是理解真实世界，学习新的思维方式。经济学已经在各个学科攻城略地。我们这一模块，还涉及了财税政治公共管理等领域。在生活中，多一分经济学思维，可能很多惯常认识，就完全不一样。我们第一模块是围绕市场制度展开讨论，第二模块围绕国家展开讨论。下面一个模块，我们进入宏观经济模块。\n\
    \n## 划重点\n\n- 民主和独裁的目的，都是维持统治，而不是统治得当。选民与致胜联盟的大小，直接决定了统治者的行为模式。\n- 布鲁斯·梅斯奎塔，和阿拉斯泰尔·史密斯，提供四条统治规则。\n\
    \    - 1、统治者所关心的，获取和维持政治权力，与人民的普遍利益无关；\n    - 2、依赖于少数人，来获得并维持权力，最有利于政治生存；\n  \
    \  - 3、当这一小群亲情，知道有一批人等着取代他们时，领导就有了更多权力；\n    - 4、依赖于小团体，能够征收较高的税收。\n\n![](img/8c0fc93ead386915a4b5043d2527383b_28_0.png)\n\
    \n## 15 | 凯恩斯：经济与政治的关系由什么决定？\n\n徐远·经济学大师30讲\n\n![](img/8c0fc93ead386915a4b5043d2527383b_29_0.png)\n\
    \n你好，欢迎来到《徐远·经济学大师30讲》。\n\n这一讲开始，我们进入宏观经济学模块。第一讲，当然要从宏观经济学的开山祖师凯恩斯聊起。\n\n1883年凯恩斯出生在英国剑桥。生日和亚当·斯密是同一天。小时候的他是很中“学”长大的剑桥学生。可以说他的人生，充满了贵族气息。他本人是相当“群泛”，朋友圈更不简单，包括哲学家罗素、诺特根斯坦，小说家伍尔夫，诗人艾略特等各种精英。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_29_1.png)\n\n凯恩斯身材高大，十指修长。尽管他自认长得帅，但多数人认为他很魁力，我看过的照片，认为凯恩斯的身材魁梧，就是稍微有点驼背，大概是因为身高两米八，有八分之一。他是他同治，但结婚，但后来还是与一位女士结婚，并组建了家庭。对象是位俄罗斯芭蕾舞演员，尽管两人没孩子，但是，是公认的幸福的一对。\n\
    \n### 经济学家的分类\n\n每一个学科，总有一两位标志性人物。对学科内的人来说，他们就像摩西明玛一样，得别人不说不，同时反对你，最后都不过生活在高墙阴影下。我们都谈到的，都是经济重要人物。但是要达的很显著的一个角度，真不多。他的理论，很牵强一点就是凯恩斯主义。当现当经济需求不足时，为了拯救经济，政府应该增加投资。你可能已经听过，作为宏观经济学的课，我更想聊聊，凯恩斯的思想如何诞生，如何传播。\n\
    \n你知道，经济学家有很多分类，宏观与微观，学院派与市来派，有各种子类，数都数不尽。其中，有一种分类，我觉得很有意思。这是何帆老师聊，他的观点。经济学家，可分为两种：当过官的和没当过官的。二者，有格差到大了。注意，我说的是当高级职位，我的是，有没有当过官，对现实和政治的感觉大不相同。当过官的，往往关注理论与实际结合。最典型的，凯恩斯就是当过官的。他的理论对手哈耶克，就没当过官。\n\
    \n凯恩斯伟大，首先就在于，他不是那种把自己关在书房里的学者。他永远关注现实，也时刻发表着介入。而当时的局势的恶化，好像也时刻渴望着他的指引。当大萧条出现，可以说是百年不遇。1932年，是大萧条最惨的一年，有人问凯恩斯，历史上有没有类似大萧条这样的事？凯恩斯说，有的。那就是黑暗的中世纪，前后共400年。\n\
    \n现在重大的危机现场。\n\n就这样，凯恩斯的的思想，通过美国，传播到全世界。这个过程，可以看作一个缩影。也就是经济学思想，如何像火种一样在世界上点燃，再绽放。无论现实如何变化，思想始终存在。也许会暂时受挫，但火种不会熄灭。凯恩斯就说过，那些认为自己完全不受任何理念影响的实干家，通常是某位已故的经济学家的奴隶。\n\
    \n我谈凯恩斯不少。写过本经济思想史的书，就叫《凯恩斯的中国聚会》。不少朋友常有误会，认为我凯恩斯主义者。其实，我认为凯恩斯和凯恩斯主义，并不能等同起来。我读凯恩斯传，常常为他过早的离世而感到遗憾。1946年凯恩斯就去世了，来不及，见证凯恩斯主义的辉煌时刻。更不用说，检讨其中的失误。下一讲，我们就谈谈凯恩斯主义。\n\
    \n## 划重点\n\n- 凯恩斯的作用：\n    - 在大萧条时代，西方世界的舞台上，罗斯福正在和希特勒竞争。面对这样的对手，英美这些自由国家，迫切需要新的理论武器。经济学家赫希曼就指出，凯恩斯主义不简单，不仅是一套实用经济政策。本质上，它是一种有力的思想武器。更深地看，在集体主义和法西斯主义之外，开拓了新的选择。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_30_0.png)\n\n## 16 | 凯恩斯主义：大萧条中经济的出路在哪里？\n\
    \n徐远 · 经济学大师30讲\n\n你好，欢迎来到《徐远·经济学大师30讲》。\n\n上一讲，我们介绍了凯恩斯，聊到了他的思想，如何与罗斯福相遇。这一讲，我们就来聊一聊凯恩斯主义。\n\
    \n凯恩斯1946年去世之后，凯恩斯主义日渐发达。此后二三十年代内，成为主流。这期间，造成了欧洲和美国的战后繁荣。在有的国家，甚至有黄金三十年的说法。\n\n\
    风水轮流转。到了七十年代，这个万能药方，好像逐渐失效了。美国的西海岸，出现通货膨胀，英国是经济滞胀和通货膨胀同时存在。于是，凯恩斯主义经受不了。不少人都认为，凯恩斯主义已经死了。谁知道，几十年后，爆发了2008年金融危机，经济不冷。各国不得不加大救市。于是，凯恩斯主义，再度死灰复燃。\n\
    \n此情此景，让人想到货币主义大师，弗里德曼的名言，“我们现在都是凯恩斯主义者了”。这括号里面，我们知道货币主义学派，几乎就是是对凯恩斯主义的反叛，从而开山立派。可见，凯恩斯主义，确实闹得很大。在中国，经济学家张维迎曾经大声呼吁，要埋葬凯恩斯主义。\n\
    \n### 凯恩斯主义到底说了什么？\n\n凯恩斯主义到底说了什么，让人如此喜爱呢？简单来讲，凯恩斯主义主张，当经济需求不足时，要搞财政政策，政府应该加大投资。这样就能挽救经济，刺激消费。\n\
    \n这些你可能早听过了。我想强调的是，天下的凯恩斯主义，还真不是一根苗。具体来说，可以分好凯恩斯主义与坏凯恩斯主义。\n\n所谓凯恩斯主义，与《通论》一书，有很深的渊源。这本书，公认是宏观经济学创立的标志。如果你读过，就知道并不好读。可以说烧脑烧烧。\n\
    \n这样一本不好读的书，流行的关键，与时代背景有很大的关系。1929年股灾和1933年大萧条，让各国经济陷入危机。最严重，大萧条的欧洲，比较大同小异。就是说，出现过市场崩溃时，应该让市场自由活动。这个逻辑，我们应该熟悉。从亚当·斯密开始，大家都知道，市场经济“看不见的手”自动运行。这意味着，经济的问题，随着时间推移，总会被解决的。\n\
    \n听起来很有道理。但唯一的问题，在于这个过程实在太漫长了。中间很多人会遭受痛苦。大萧条中，最大的问题是失业。传统经济学家认为，失业除了自愿失业，还有就是摩擦性失业。意思就是，失业多数是自然性失业，因此，失业问题不大，市场会自动调节。\n\
    \n面对日益紧张的现实，这种分析，听起来太不太可信了。如果真有工作，那么一家人就陷入深渊，痛苦程度可想而知。要知道，1933年美国失业率是15.9%。这意味着一六分之一劳动力失业。第一大萧条之前，失业率只有3%左右。\n\
    \n当时美国总统，是胡佛。他也相信，市场经济可以自我修复。他不作为的后果，就是经济不断恶化。失业者数量激增，四处流浪。于是，戏剧性的一幕出现了，那就是，在美国这样资本主义的大本营，也突然出现这么多流浪汉。在繁华的大街上，他们用旧铁皮、纸板搭起了棚户区。并起名胡佛村。\n\
    \n该坚持。关键是，市场失灵的时候，需要对策。因此，凯恩斯主义，应该看作一个重启的操作，当市场这台电脑，运转太久，偶尔死机时，是政府不得已而为之的临时策略。\n\
    \n对于凯恩斯这样的大师，崇拜和误读，几乎一样多。据说，凯恩斯晚年，曾经有这样一个场景。面对一屋子经济学家，他说：在座的，都是凯恩斯主义者，但我不是。在同一经济学派中，凯恩斯似乎知音难觅，但是却与理论的对手，更有共鸣。比如哈耶克。我写过有关凯恩斯的书，从小也很喜欢哈耶克。常有自由派朋友问我，一个人怎么能同时接受，凯恩斯和哈耶克的思想？他们觉得，这不水火不相容嘛。我觉得，两人并不是完全对立，而大多数人，认为这两个人在观点上是对立的，不少源自对两人理论的误读。我们下一讲就来聊一聊哈耶克，带你了解，为什么我认为他与凯恩斯会更容易产生共鸣。\n\
    \n## 划重点\n\n- **凯恩斯主义的好与坏：**\n    - 凯恩斯主义，可以说专为应对危机而生。不是危机时刻，滥用凯恩斯主义，只能结出苦果。这种情况，可以叫超级凯恩斯主义。正是这种政策，让凯恩斯主义背负不少骂名。更不用说，凯恩斯主义倡导的，是宏观调控，而不是干涉具体行业与企业。而现实中，很多行政手段，其实是微观调控，具体到行业以及企业。二者的管控方式，存在本质不同。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_32_0.png)\n\n## 17 | 哈耶克：贯穿现代经济学史的大辩论\n\
    \n徐远 | 经济学大师30讲\n\n![](img/8c0fc93ead386915a4b5043d2527383b_33_0.png)\n\n你好，欢迎来到《徐远·经济学大师30讲》。\n\
    \n这一模块是宏观经济学模块。我们已经学过斯密斯密。他是一个人，就颠覆了古典经济学，开创了宏观经济学。当然，古典经济学也不会甘心退出历史。自然有人捍卫了。其中一位，几乎靠与凯恩斯辩论，赢得大师伯地位。那就是我们今天耍到讲的哈耶克（Friedrich\
    \ August von Hayek, 1899.5.8– 1992.3.23）。\n\n哈耶克1899年出生在维也纳，1974年获得诺贝尔经济学奖。奥地利学派的大师米塞斯的最后学生。哈耶克的背景可以追溯到二战前后的奥地利。两人都是在维也纳接受教育，到奥匈帝国（简称）中，因为他们都成了反共者。最后，两人在英美界成名。\n\
    \n哈耶克是犹太人。年少时，他就目睹了法西斯的兴亡与覆灭。但是，当奥匈帝国解体后，原本保守的维也纳，保护了犹太哈耶克，就变得毫无保护。1913年，他的外祖父发起了社会主义试验，导致产量剧减，米价物价上涨70倍。哈耶克家族深受影响，甚至没让他进德国国防大学。1938年，纳粹吞并奥地利。同年，哈耶克加入英国籍。\n\
    \n这些经历，使他对计划经济思想，终生抵恶。1947年，他发起一个新自由主义学术共同体，也就是后来大名鼎鼎的朝圣山学派。知名学者波普尔、米塞斯、奈特、弗里德曼等，都是学派成员。\n\
    \n私下里，哈耶克个性温和。但一涉及到历史上，他给自己的方式坚持。在经济学史上，他给人三大印象。一是好辩。三十年里场重要的经济学争辩，他可参加了几十。第一，二是他反对凯恩斯主义。第二，三是他和凯恩斯关于经济的大辩论。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_33_1.png)\n\n### 与凯恩斯的论战\n\n哈耶克一辈子，最大论战对手是凯恩斯。1931年，伦敦经济学期刊刊登凯恩斯、肯后的俱乐部，就是作为对哈耶克的枪手。他1992年去世前，最大遗憾，就未与哈耶克清算凯恩斯主义。从身材来看，哈耶克和凯恩斯都是高个儿。超过几米8，哈耶克比凯恩斯年轻16岁。但他看起来，比对方大。一子都给人，中欧知识分子的印象。总是神情忧郁，搭配红西装，说英语，也有伦敦那一带浓厚的口音。\n\
    \n两人争论很著名，似误解也不少。表面争论的是经济。往深里看，其实是文明胜负的问题。\n\n争论背景是大萧条时期。经济危机导致失业率高达40%。各国采取的应对方案不同。苏联和纳粹德国都是新计划经济，依靠计划模式，将国家军为一级军事机器。这导致了当国家一时短期，经济的张了大天平，向这些国家倾斜。而当时主张自由的美英世界，反而是显得有些力不从心。\n\
    \n于是，凯恩斯出现了。你已知道，他主张扩大投资。的出发点是反对意见。他认为大萧条的根源在于政府为计。为什么？哈耶克指出，政府和中央银行联合，是一个具体的个人在制定政策，他们这些人当中，过去太想往经济决策，破坏了人们自发的市场秩序，经济。结果呢，一时间的人流繁荣，让市有人认出了。这样人为的繁荣中，资源存在很多错配。最终，导经济危机。在第一步，政府已经得。如果危机危机，政府再次介入，更加火上浇油。因此，必然反制夺人们的经济自由。\n\
    \n这场辩论为什么那么受关注？因为战争。两大世界大战成了世界，也待人们重新思考，甚至重新评估不同制度的问题。这三十代人的斗争，影响了政儿人的历史。二战后的历史，经济学史上，最著名的经济学学术，辩证的结束，不意味着分出胜负。像两人观点，后人形成了各自的阵营。使得这两人的辩论，几乎贯穿了整个现代经济学史。\n\
    \n### 《通往奴役之路》\n\n一般认为，他们两个人的辩论，宏观上对哈耶克更不利。因为凯恩斯主义，哈耶克显然是赔钱方。但实际上，通过这场辩论，凯恩斯也收获不少。从辩论中，他汲取了大量的战斗，产生了理论创新的欲望。\n\
    \n你知道，凯恩斯宏观经济学鼻祖的地位，主要凭借1936年出版的《通论》。《通论》引发学界内外部讨论，引发凯恩斯论著者。我起来说，全书没有直接提哈耶克。但实际上，不少地方的解释和说明，都是针对哈耶克的批评。我常学书翻，他的《通论》，做了不少学术翻，他认为，与哈耶克的论战，是凯恩斯写《通论》最重要的推动力。\n\
    \n《通论》的巨大成功，显得哈耶克有点落寞。30年过去了，大家完全忘记了他的赢。一些得意门生，也依附凯恩斯。比如经济学家卡多夫和弗格森。\n\n但是，哈耶克并没有闲着。在寂寞中他埋头工作。到四十年代，哈耶克完成自的重要著作《通往奴役之路》。其中，他对大政府主义开了一剂药丸。他得出，当政府对公共利益扩张了，到公共公民的自由时，人类奴役阶级也必然不远了。\n\
    \n这本书改变了世界，也改变了他的命运。书畅销，对他的在气也经济不断。更多的入门。不过，他说出来不想，就为了大销，也让他遭遇很多非议。很多学者觉得，专业的学者不写这样的畅销书。\n\
    \n无论怎么说，两人交锋的结果，是各自发展不同的理论体系。这给世界留下了了大遗产。两人虽是理论对手，私下里却不结。两人在观念，哈耶克也不是偏执和顽固。凯恩斯读《通往奴役之路》后，写信给哈耶克。说他的大战，只是在中道路的下界性问题上，有人太低估了中间路线的可行性。\n\
    \n### 哈耶克与凯恩斯辩论的影响\n\n凯恩斯所定的中间道路，真的存在吗？这是永恒的问题。其实，我认为应该存在。当经济正常运行时，政府不应过度介入经济，最大幅度地保护市场的经济自由。当经济出现危机时，必须的手段是重要。多年来，政府对经济态度都是摇摆不定。当危机来临，往往主动凯恩斯。一旦经济平好，哈耶克又占上风。\n\
    \n两人的分歧，本质上是世界观的分歧。凯恩斯，是一个实用主义者。对于意识形态和政治理论，他基本没太追求。很自然地，面对困择时，他会主张两边应该试错，探起经济。哈耶克则是一个怀疑论者。他有清醒的悲观态度，把理念看作不可动摇的信念。比如凯恩斯说“长期来看，我们都亡，哈耶克就批评道，这句话的命语，会遇到洪水滔天那一刻，并终将自食其果。\n\
    \n英国思想家柏拉图，将学分为狐狸学派与刺猬学派。刺猬学者，狐狸学者几乎无所不知，刺猬学者则只钻研某一领域。从这个角度看，哈耶克类似刺猬学者，一生做的一件事，就是捍卫自由市场。\n\
