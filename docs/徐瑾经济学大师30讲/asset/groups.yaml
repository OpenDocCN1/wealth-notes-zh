    \ 在新闻研究上，甚至涉心理学等跨学科知识。看到他90多岁还写论文，我非常佩服。朋友联想起他，认为他有点像老福恩，甚至 老洛思，认识中，有关诺思不少可爱小故事。比如诺思很能喝酒，有\
    \ 他们在芝加哥开会，诺恩思带半瓶白葡萄酒，放在 衣服口袋。结果不小心弄掉了，看了看，自然 没有办。他穿他棉裤子，做个衣服。转身悄悄告诉身边的韦森，我不喝\
    \ 了。意思，他只喝酒。\n\n## 诺思看东西方差距\n\n那么诺思的理论，为什么能够帮助你认识，造成东西方差距的原因呢？\n\n说到东西方对比，你肯定听过李约瑟之谜，李约瑟是英国人，研究科技史。逐论，他勒是英国人，是研究科技史。逐论他勒是英国人，是研究科技史。逐论他勒是英国人，是研究科技史。逐论他勒是英国人，是研究科技史。\n\
    \n听起来有道理，这谁信？既然这门课是读经济学家那，那我就从经济学的角度来思考一下。我认为，经济学，本质上就是一种思维方式。除了数学，还结合逻辑与历史。中国为什么落后的关键，不在中国，而在于，西方为何会崛起。因为，从全球看，崛起是特例，落后是常态。对西方的崛起，还是要回到诺思。对此，他提供了一套综合框架。\n\
    \n我们回顾一下中国的历史。古代国内生产总值GDP，看起很大成。1820年占全球33%，当时英国5.2%；到1900年，还有11%，有人就说，清代经济很不错啊，后来的落后倒是一个偶然的因素，怎么能解释大清先败给英国，再败给日本？\n\
    \n前面这种看法，错误在于没有理解什么是真正的增长。诺思，第一步 将GDP对于GDP总量。诺思说，他强调，人均GDP才是 重点，真正的增长，就是连续人均GDP增长。按照这种标准，东西方实力对比很清晰。清朝的经\
    \ 济实力比世界第1。真是清朝的 经济 持续，而且这种持续 很早期发生了。尽管理论，从数据来看，19世纪的中国人均GDP，与1500年开始相比，完全没有增长，甚至\
    \ 还有下降，而当时的西欧，早已出现 了真正的增长。\n\n## 制度变迁的关键\n\n那么，如何 实现人均GDP持续增长？面对这个问题，诺思发明了制度 ，那就是制度\
    \ 变迁，是制度决定 了西方崛起的速度，也是制度决定了工业革命发生的西方。有人喜欢说创新、规模经济，资本主义等等。这些都 是好东西，不过思维 很窄，这些不是经济增长的原因，而是，增长\
    \ 的表现。\n\n制度变迁的成功关键，是建立有效率的经济体，过去的理论，我所学过 的经济 人假设，也学过雄健发的 报酬合理理论，这学 科 的 交易 成本。诺思结合这两种\
    \ 看法，提出自己的 见解，认为有效率的组织，需要建立在经济 上的激励效应 上。自然，这需要产权 等激励 效应对。对于 西 方而言，最重 要 的是保 护产权。\n\
    \n你以前可能听过，西方崛起，主要靠侵略殖民与垄断全球贸易，从诺思的框架看，这种看法不全面。首先，从地理和历史 事实看，拿到 处最先是西班牙和葡萄牙。但之后后两者国家是最落后的，没有\
    \ 制度，而金银 再多也无法转化为经济。所以 金银 不是西方崛起的起源。其次，从贸易看，欧洲 从南部贸易取得的收入远多于从 欧洲内部贸易的收入。\n\n进一步看西方崛起的过程。其实就是英国的崛起。如果你看近代之前的英国，其实算不上什么成。制度上，英国落地开荒，出口土地制度。后来，西\
    \ 班牙、法国，那么，英国为何 要到最后？诺思认为，关键是 英国开辟了 中间领域，所谓中间领域，就是开拓 新市场，学习新制度。\n\n确实， 近代英国起步较晚。无法像西班牙葡萄牙那样，欧洲\
    \ 的美洲。英国， 通过学习 若干年 后 获 的成 ，英国十分 重 商主义。商业要繁荣，离不开 人的支持，于是，英国就出台一些税 益给商人。比如特许权经营，禁止\
    \ 政 治理 ，换取商人的权 收 商人。日子就好 了，商业发达，税 政 收 更高。就说， 16世纪 落后的英国，才能在 18世纪 领 跑。这里 特 要强调一下，不\
    \ 等学 家 常 说 政 府 坏。从 角度看， 好多 子 经 常 现 就 能 收 获。 英国 时期 也不 收 税，权 收 比 不低 于周 期的明朝，也 远高\
    \ 于周 期的法国。税收多，国家 能力 也强。法 能 建 大海军、捍卫贸易等。\n\n## 人类的社会秩序\n\n诺思的理论，能解释 历史，也可以解释当下。所\
    \ 言 代 化， 极端 话，就是形成 英 国式的社会 秩序。这 就是 诺 思 认为 是什 样的 呢？诺思 对社会 秩序 也有 自己的 见解，他 将 人类 社会\
    \ 秩序 分为 三种：\n\n*   第一种，是原始社会秩序。其 规则 是 以 善 为 主， 家 长 是 社会 观 念，是 保护 部族 生 存， 老大 是\
    \ 你 是 你 对 部 族 的 发 展。随 着 时代 的 发展，这 种 模 式 逐 渐 被 淘汰。\n\n*   第 二 种，是 限制 进入 型 社会 秩序。\
    \ 所 谓“限制 进入”，意思是 普通 民众 享受 政 治 权 力 和 权 力 都 是 受 到 限制 的。这是 在 历史 上 大 部 分 国 家 也 的 政\
    \ 府。政府 靠 暴力，而 少 数 人 掌 权。 这 样 的 社会 的 权 力， 易 得 到 保 护。 对 于 成 员 的 权 利，也 得 到 保 护。你\
    \ 走 进 员，不 会 动 不 动 被 打。 这 样， 社会 出 现 更 多 分 工， 经 济 能 发 展。\n\n    但 这 种 社会 的 缺 点，是\
    \ 普 通 人 都 受 到 保护 不 足。 所以， 社会 对 普通 人 权 利 承 诺，可 能 都 不 到 普 通 人 的 信 任， 因为 权 利 得 到\
    \ 不 保 护， 经 济 也 会 失 去 很 多 发 展 机 会， 社会 也 会 增 加 不 稳 定 性。\n\n*   第 三 种，是 开 放 型 社会\
    \ 秩序。 英 国 就 是 一 个 模 型。 权 利 对 所有 人 都 放 开， 无 论 精英 还 是 普 通 人。 望 然。 最 后 一 种 会 比 前\
    \ 两 种 好。 这 样 的 社会 如何 才 能 达 到？ 这 就 需 要 回 到 他 的 历 史 历 史。\n\n诺思 研究 过 许 多 国 家 的 成\
    \ 功 案 例，并 总 结 了 国 家 发 展 是 向 改 功 的 保 护 国 家。 第一 步，给 普 通 法 注 意，也是 充 分 保 护 第 一 个 权\
    \ 利，你 可 能 保 护 他， 需 要 保 护 的 是 当 然， 不 要 知 道 在 有 的 国 家， 有 权 力 的 人，也 不 一 定 意 思 有 个\
    \ 国 家。 有 的 时候，法 治 更 像 一 种 特 权。\n\n第 二 步，将 这 样 的 法 注，逐 步 扩 散。 也 就 是 说，由 特 权 受 往\
    \ 普 通 人 的 权 利。 注 意，特 利 的 转 化， 往 不 是 一 步 到 位。 就 像 英 国 的 特 权 阶 层 也 不 是 一 步 到 位。\n"
  mdcn: "\n## 13. 总结与展望\n\n一。如果你是一般学校就业者，那么就要在文凭之外，给雇主更多证据证明自己的能力。对可能遭遇歧视的亚裔学生，除了抗议，更应该在成绩等之外展现自我。即使哈佛不录取，别的名校也会过来。\n\
    \n阿尔钦对真实世界很多看法，已成为经济学最基础性洞察。对普通人，记住产权就是人权，和歧视就是竞争这两大智慧，就足以改变很多认知。前面说，经济学中正确与错误，也许和一般理解的不太一样。有人就总结，政治正确，智商与勇气这三个优点，人往往不能全部拥有，最多拥有其中两项。阿尔钦呢，他明显选了勇气和智商，放弃了一些也许并不那么正确的政治正确。好了，这一讲就到这。下一讲，我们聊聊诺贝尔奖历史上最长年的获奖者赫维茨。\n\
    \n![](img/8c0fc93ead386915a4b5043d2527383b_13_0.png)\n\n# 07 | 林薇汝：获取真实信息需要什么样的机制设计？\n\
    \n徐珂 · 经济学家大30讲\n\n林薇汝：获取真实信息需要什么样的机制设计？\n\n你好，欢迎来到《徐珂·经济学思三十讲》。\n\n在课程的第一模块，我们主要谈了制度与经济学。从第一讲到第七讲逐渐深入到制度不同层次。这一讲是这一模块最后一讲，我想谈谈生活里面更现实的问题。这一讲将带你认识经济学家莱维尼·赫维茨，他的主要贡献就是开创了机制设计理论。\n\
    \n他90岁得诺贝尔奖，是历史上最年长的获奖者。赫维茨是波兰犹太人，1917年出生在莫斯科，后二次来到美国，像他这样为了躲避战争，来到美国的欧洲学者不少。所以有人就说，这些二战学者是赢在战场上，赢在这些经济学说之中大赢。\n\
    \n## 机制设计是为了让人说真话\n\n随着大数据时代来临，引人抱怨信息茧房。这篇首先带用户和搜索引擎之间博弈，然后通过有限的信息让用户消费更多。这背后与我们今天讲的机制设计，大有关系。\n\
    \n我们所在的世界，是一个信息不完全是社会。所以，如何用机制最小的信息，达到最优结果，是成功的关键。所以机制设计，就是信息不完全是情况下，如何设定一套对应的规则，来达到特定目标。比如，如何让人说真话。\n\
    \n有个关于古代波斯君所罗门的故事。故事说，有两个女人争夺一个孩子，而所罗门这里，请你判决，两人都声称孩子是自己的。各自不服，但没有证据的孩子。所罗门就说，既然如此，为了公正，那把孩子劈成两半，一人一半，听听这，一个女人才会同意，说大干吧，另一个女人却说，把孩子要不了，这时，所罗门就对女人的母亲说，孩子归你。为什么，因为只有真母亲，才宁愿不要孩子，也不要孩子。\n\
    \n故事很奇特，但如果换成机制设计的思路来说，故事的本意，为了考量真实孩子的亲生母亲。前提假设，亲生母亲必中排在第一位的要求，永远愿意与孩子分离着。那么所罗门提出“把孩子劈成两半”，来检测出谁才是孩子亲生母亲的策略，才能达到目标。\n\
    \n你可能会说，假母有点笨。她如果猜到所罗门的意图，也假装不要孩子，那怎么办？确实，于事于势，人们往往不会当做正当行为。这样，真假一方的了自抬身价，都不愿意真实出价，而价格就可以随意操纵，这不公平。在更多的场合都可以使用，正是体现了机制设计思路。\n\
    \n## 激励相容原理与显示性原理\n\n什么是机制设计理论？简单来说，如何让在个体行为中，透露真实信息，并由此得到其期待的结局。最早理论框架，来自我们刚刚提到的赫维茨，他只是激励设计理论的奠基人物，解决了两个重要的两个问题：激励相容原理与显示性原理。\n\
    \n经大学经济学院院长田国强在推广经济学更有不少贡献。我和田国强老师聊，他认为赫维茨研究体现了逆向思维。不像新古典经济学那样，将制度、机制视为标准，而是将经济环境视作标准，这更符合现实。由此，也发生了一场革命性的学术创新。\n\
    \n好了，从斯密开始，经过李嘉图马尔萨斯熊彼得科斯，最后是赫维茨。这一模块我们介绍制度不同层次，从国家制度到企业制度，再身边的机制设计。目的在于让大家理解，经济运行的制度基础。下一讲，我们进入第二模块，谈谈政府与发展。\n\
    \n## 划重点\n\n**赫维茨的启示：**\n\n赫维茨的理论让我们明白，有什么样的制度，就有什么样的激励机制，也就有什么样的组织行为。反过来，为得到要求的组织行为，我们可以设计特定的制度与激励机制来达成，经济运行只是制度的后果。管理学有句名言是说，你考核什么就得到什么，而机制设计理论就是反过来应用这一点：你要得到什么，就设计什么。\n\
    \n徐瑾 经济人 econhomo\n\n# 08 | 布坎南：政治人物其实也是经济人？\n\n徐琳 · 经济学大师30讲\n\n![](img/8c0fc93ead386915a4b5043d2527383b_16_0.png)\n\
    \n布坎南：政治人物其实也是...\n\n你好，欢迎来到《徐琳 · 经济学大师30讲》。\n\n这一讲我们聊经济学家詹姆斯 · 布坎南。他算是美国土生土长的经济学家，这也反映了美国经济学在二十世纪中叶逐渐崛起。\n\
    \n他1919年出生在田纳西州一个农场，小时候关于过不少东西，但他自己曾说，做学术就是比种田好一些的样子。\n\n他的一生，有一些算是巧合的地方，比如布坎南王任总统和他伯父，伯母叫梅根\
    \ · 坎南，而他祖父做过州长。或许正是这些巧合，导致布坎南一辈子研究对象之一就是美国政府。\n\n和你聊经济学，肯定有人会这样说：经济学家关注什么，不关心政治；研究出来的理论，一般也尽量和问题，不少时候其实失手了。其实学了经济学，你就知道事实并非如此了。这门学问从诞生就是政治经济学。后来学术分工后，有了不同门类，今天介绍布坎南开创的公共选择理论，对分析现实非常有帮助。\n\
    \n## 政府并非不是中立的\n\n2019春节，不少朋友去美国度假。我一般兴冲冲在行程中安排很多参观。大家都说，美国国 立博物馆免费，很多还不收费。结果，他这地方了门票，一看，原来美国政府关门，波及美国国立博物馆。这是美因尼政府关门最长的一次，35天。从70年代到现在，美国\
    \ 政府差不多关了20次。\n\n参观不了博物馆是小事，公务员也没发了工资，所以不少美 事政府关门，像实施中，创立法 案。公共事和政府，其实是一种政府失败。政府可能失败，这是公选择理论一个置失败之。前，美国经济学家研究公共失，发现市场失败。他们往以为美国政府是中立的，市场失灵时，美国政府介入反而是有效的。\n\
    \n布坎南认为，美国 政府并不是中立的，也没有公平不 的政府和官员。美 主负责制定和执行政策的是具 的官员，并不像没有私心杂的公 民，他们同样会追逐个人私利。美公选择理论\
    \ 是，政策 一切信息和政策都 全，市场决策同样可能是短视的。也就是说，和市场 样，美国政府也会失灵。\n\n美国政府会失灵，导致政府关门，还不是最坏的。2008年10月，冰岛成为欧洲投资危机爆发的第\
    \ 一站，三十万人口，人均 产美元。当时冰岛总理就进行了直播直播，宣布国家政 产 后， 股片场，三大银行全部收回 手。最后，这位 也因为渎职 受判，这 不仅是金危机的闹剧，\
    \ 可见，有 政府失败导 的是 题，甚至国家财产。\n\n在今天，我们要纠正一个观念：政府不是家庭，政策是 入千万户的公共利 在公共选择 究范畴之下，政府行为\
    \ 公 了，不是 而是可以 经济 理 的。\n\n## 理性看待政府决策\n\n那么 我们如 何正 和理性地看待 府呢？这里要 治公共 择理论的 两个要素。\
    \ 政府 家 是政 的部门 及政府 员 了各自 利益，进行的 考 第 官 也 人，也有 的利益\n\n可见，人在 场 上，也是追求自身利 化的 人 此， 学的庞大\
    \ 体系 就 了 的 分析，就 起来 孔 的 府 了。\n\n坎 政府不是神，它 也 所 不在 正 无 的天赋。 公共 可以 让政 以 或 对 行 析。 这\
    \ 于“ 人 ”、“ ”“ 治”预期 是 了专 制 始。\n\n比如 保， 都感 好 是 重 认 为 汽 汽 汽 厂 不 有 关 这 门 然 就 了 于 他\
    \ 以 破 也 对 污 响 大 是 监 很 洁 省 力 去 分 多 下。\n\n 人 利 动 力， 大 息 尽 可 能 前。 对 决 策 有 的 益， 只有\
