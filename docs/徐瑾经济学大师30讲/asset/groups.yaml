    \ 府 题。\n\n布 坎 南 重 要 搭 洛 洛 ， 他 也 该 设 置 搭 搭 搭 搭 搭 搭 搭 搭 搭。\n\n为是应该获得诺奖的人物。和斯密对应，塔洛克曾经说过这样一句话，“我们所需的研究经费或福利支票，并非得自官员的恩惠，而是得自他对自己利益，而非公众利益的算计。”这就是说，政府也不是免费午餐。80年代，两人一起在乔治梅森大学，创办了公共选择研究中心。这改变了经济学历史版图，也深刻地影响了奥尔森等卓越经济政治学者。我有次搭错了车，去了乔治梅森大学。这是一次跨州误会，耽搁了几个小时，险些误过朋友晚餐。不过，下车抬头看到晚霞的乔治梅森大学，隐然有光。想到两位经济前辈，不知为何，觉得不虚此行。\n\
    \n这一讲我们了解了布坎南的公共选择理论的两个要素，就是政治是交易，和官员身上，也存在作为人的问题。掌握这两个要素，能够帮助你从公共政策角度，重新审视政府的决策，和这些政策对经济和个人生活的影响。下一讲我们将一起来聊聊，公共政策领域另一位女性经济学家奥斯特罗姆。\n\
    \n## 划重点\n\n![](img/8c0fc93ead386915a4b5043d2527383b_17_0.png)\n\n> 纠正观念：\n政府不是家庭，政策牵涉到千家万户的公共利益。在公共选择研究路径之下，政府行为本身也就不再是一个黑匣子了，而是可以被经济思维照亮的。\n\
    \n# 09｜奥斯特罗姆：公共治理与人群与组织\n\n徐璐 · 经济学大师30讲\n\n奥斯特罗姆：公共治理与人群与组织\n\n你好，欢迎来到《徐璐·经济学大师30讲》。\n\
    \n上一讲我们一起了解 了布南姆的思想诞生和发展。通过上一讲，你 已经认识到政府和也失灵。而面对这个问 题，解决的策略和进行新一轮的经济学专家。她是第一位女性诺贝尔经济学奖得主，在中国来说不陌生，因为\
    \ 她在中国的学生不少，甚至还有姓名的学友会。她就是奥斯特罗姆，中文简称的。\n\n1933年，奥斯特罗姆出生 于加州。她童年的时候，正值大萧条的末期。她从小时就能帮忙。在自家牧场，帮奶妈搞玉米种菜。每年收获以后，吃不完的蔬菜，还能做成罐头。这是工作习惯，\
    \ 她保持了一生。学考斯特罗姆她学生，和她有联系，她就说奥斯特罗姆很努力，很 有学术精神。每天4点起床，工作十余个小时。\n\n## 加州水资源的思考\n\n\
    童年经验，不仅养成了她的勤奋，也给她的研究， 提供了很多早期的案例。例如，种菜浇水，印象中，大多 数人会认为加州和光海连接在一起。但去 过就知道，加州缺水。我上去，正好\
    \ 种大林火。原因就是大干燥，空气中都是粉尘。\n\n加州农业发达，人口密度高，水是珍贵的公共资源。大家在使用上，需要彼此协调，所以在治理层面，往往会 成为水协会。甚至为了水资源的合理管理，\
    \ 还会专门设水官，这对奥斯特罗姆的影响很大，把她知道的很多细节写入了博士论文。\n\n成年后，她进一步研究了加州 水资源利用。加州水主要靠 天吃饭，雨水开始流入到加州，大家都想\
    \ 分用，你别来水，别人也不会用水。这就成 一个恶性循环。随着土地用水过度，引 发水危机。问题严重了，不仅地下水水质受到影响， 还可能会威胁整个加州的用水。\n\
    \n这时候，对水资源的使用问题， 大家就不得重轻起来。过去主要以靠官方 解决这类型。但这次，打通各官方也解决不了。为什么？原因有两个，首先政府没有一个部门管到底，而\
    \ 两个行政区划规定也不一样。其次市场上， 流在水的几个生产商所在地没有，规模 也不一样。有的只有在地二井水的公司，也有 拥有很多井的政府部门。更不用说，水\
    \ 的消费者，也是分散的。\n\n到底应该怎么办呢？在经历了漫长的扯皮与矛盾之后，终于，八 成以上的生产生，坐在桌子 边，达成了一个协议。一方面减少地下水抽\
    \ 水。另一方面补充水资源，建设地区田， 收取税水，补贴欠水地。\n\n这个协议能达成， 那是相当的不容易，因为涉及各方利益。 除了生产方，还有联邦政府、州政府、外方\
    \ 大大小小市县政府。更不要说，各类私人 公司协会。在协议中，所有人都不断地参与到 协商。同时，结果也不是一方可以 单独决定。没有一方有能力 一言定音。大家扮演各自角色，共同解决了问题。\n\
    \n## 多主体参与构成的多中心治理模式\n\n奥斯特罗姆总结说，多 支参与构成多中心。由此形成了新的多中心治理模式。这种新模式 区别于 信息系统，并且，这种治理模式，也对\
    \ 社会学中著名的公地悲剧的解决方案做了探索。\n\n所谓公地悲剧， 来英国经济学家哈尔丁。他提出，如果让 牧羊人来公共牧场放羊，每多一只羊，牧 羊人都会增加一份收入，也会让\
    \ 草地更差的负担。如果每个羊 人都只知道追求自己的利益，最可 能羊的数量，最后的结果， 草地过度放牧，以致荒废。\n\n那么怎么办呢？经 济学过去了两种思路，私有化或管制。前者呢，\
    \ 让草地 归属于私人自己，他自然会计算放羊载 数目，平衡短期收入与长期 利益。或者，让场域被纳入政府的管理之中。 或者 管制也会兼顾长期与短期的利益， 并作出平衡。\n\
    \n这就是最佳答案了吗？我们 学过经济人自利理论，也学过做 政府失灵的悖论。有了这两 块逻辑做基础，来看着这个问题，相信你 会觉得没有简单啊。先看看来有公共\
    \ 的牧场，如果不 开放优先，就意味这 片私有的牧场，只有一 部分放牧羊可以用人。就算是有牧 羊来用公共牧场放牧的限制别人，算是 得利状态。那么 采取国有化的方案呢？这可能会导\
    \ 入监管管不了的状态。羊的数量可 能被正确地控制了。但放羊人 的追求更大利益的动机，却降低了。\n\n更关键的是，有的资源， 没法私有化。比如全球气候、海洋。\
    \ 在 也开，它也不行，怎么办？奥斯特罗 姆给出了第三 条出路，这就是她作为科学 家，提出来的。公共池塘，模式。这个 模式强调共享， 如果某类资源 是可再生的，同时又相当稀缺，那么所有能\
    \ 用到这一类资源的，可以互相伤害。就好比 你小池池塘，鱼表面 上人人都有份，但 并不属于某 一个人。\n\n# 10｜诺思：开辟中间领域如何帮助大国崛起？\n\
    \n徐继·经济学大师30讲\n\n你好，欢迎来到《徐继·经济学大师30讲》。\n\n我们现在正在这门课的第二模块，这一模块的重点，是讲国家经济发展。其中的对比方为美\
    \ 西方国家，看看两种的差异，到底由什么而决定的呢？这个问的回答，和今天讲的经济学道格拉斯·诺思有关。\n\n诺思1920年出生在美国，他在73岁获诺贝尔奖。得奖后，他虽稍在成绩上，至今学生。而是一直\
    \ 在新闻研究上，甚至涉心理学等跨学科知识。看到他90多岁还写论文，我非常佩服。朋友联想起他，认为他有点像老福恩，甚至 老洛思，认识中，有关诺思不少可爱小故事。比如诺思很能喝酒，有\
    \ 他们在芝加哥开会，诺恩思带半瓶白葡萄酒，放在 衣服口袋。结果不小心弄掉了，看了看，自然 没有办。他穿他棉裤子，做个衣服。转身悄悄告诉身边的韦森，我不喝\
    \ 了。意思，他只喝酒。\n\n诺思和哈耶克有点像，年轻时彼此一 样。但从本科生开始，哈波克，成为 经济学。这种跨学 背景，成为他研究的支柱，他是最早有计量方法引入历史学者。\n\
    \n> > 这意味着，历史研究，所有统计 基础，这让诺思的研究成了一门新科学，他称 制度变迁史，将经济史这门学科的真正 奠基人。\n\n诺思1920年出生在美国，他在73岁获诺贝尔奖。得奖后，他虽稍在成绩上，至今学生。而是一直\
    \ 在新闻研究上，甚至涉心理学等跨学科知识。看到他90多岁还写论文，我非常佩服。朋友联想起他，认为他有点像老福恩，甚至 老洛思，认识中，有关诺思不少可爱小故事。比如诺思很能喝酒，有\
    \ 他们在芝加哥开会，诺恩思带半瓶白葡萄酒，放在 衣服口袋。结果不小心弄掉了，看了看，自然 没有办。他穿他棉裤子，做个衣服。转身悄悄告诉身边的韦森，我不喝\
    \ 了。意思，他只喝酒。\n\n## 诺思看东西方差距\n\n那么诺思的理论，为什么能够帮助你认识，造成东西方差距的原因呢？\n\n说到东西方对比，你肯定听过李约瑟之谜，李约瑟是英国人，研究科技史。逐论，他勒是英国人，是研究科技史。逐论他勒是英国人，是研究科技史。逐论他勒是英国人，是研究科技史。逐论他勒是英国人，是研究科技史。\n\
    \n听起来有道理，这谁信？既然这门课是读经济学家那，那我就从经济学的角度来思考一下。我认为，经济学，本质上就是一种思维方式。除了数学，还结合逻辑与历史。中国为什么落后的关键，不在中国，而在于，西方为何会崛起。因为，从全球看，崛起是特例，落后是常态。对西方的崛起，还是要回到诺思。对此，他提供了一套综合框架。\n\
    \n我们回顾一下中国的历史。古代国内生产总值GDP，看起很大成。1820年占全球33%，当时英国5.2%；到1900年，还有11%，有人就说，清代经济很不错啊，后来的落后倒是一个偶然的因素，怎么能解释大清先败给英国，再败给日本？\n\
    \n前面这种看法，错误在于没有理解什么是真正的增长。诺思，第一步 将GDP对于GDP总量。诺思说，他强调，人均GDP才是 重点，真正的增长，就是连续人均GDP增长。按照这种标准，东西方实力对比很清晰。清朝的经\
    \ 济实力比世界第1。真是清朝的 经济 持续，而且这种持续 很早期发生了。尽管理论，从数据来看，19世纪的中国人均GDP，与1500年开始相比，完全没有增长，甚至\
    \ 还有下降，而当时的西欧，早已出现 了真正的增长。\n\n## 制度变迁的关键\n\n那么，如何 实现人均GDP持续增长？面对这个问题，诺思发明了制度 ，那就是制度\
    \ 变迁，是制度决定 了西方崛起的速度，也是制度决定了工业革命发生的西方。有人喜欢说创新、规模经济，资本主义等等。这些都 是好东西，不过思维 很窄，这些不是经济增长的原因，而是，增长\
    \ 的表现。\n\n制度变迁的成功关键，是建立有效率的经济体，过去的理论，我所学过 的经济 人假设，也学过雄健发的 报酬合理理论，这学 科 的 交易 成本。诺思结合这两种\
    \ 看法，提出自己的 见解，认为有效率的组织，需要建立在经济 上的激励效应 上。自然，这需要产权 等激励 效应对。对于 西 方而言，最重 要 的是保 护产权。\n\
    \n你以前可能听过，西方崛起，主要靠侵略殖民与垄断全球贸易，从诺思的框架看，这种看法不全面。首先，从地理和历史 事实看，拿到 处最先是西班牙和葡萄牙。但之后后两者国家是最落后的，没有\
    \ 制度，而金银 再多也无法转化为经济。所以 金银 不是西方崛起的起源。其次，从贸易看，欧洲 从南部贸易取得的收入远多于从 欧洲内部贸易的收入。\n\n进一步看西方崛起的过程。其实就是英国的崛起。如果你看近代之前的英国，其实算不上什么成。制度上，英国落地开荒，出口土地制度。后来，西\
    \ 班牙、法国，那么，英国为何 要到最后？诺思认为，关键是 英国开辟了 中间领域，所谓中间领域，就是开拓 新市场，学习新制度。\n\n确实， 近代英国起步较晚。无法像西班牙葡萄牙那样，欧洲\
    \ 的美洲。英国， 通过学习 若干年 后 获 的成 ，英国十分 重 商主义。商业要繁荣，离不开 人的支持，于是，英国就出台一些税 益给商人。比如特许权经营，禁止\
    \ 政 治理 ，换取商人的权 收 商人。日子就好 了，商业发达，税 政 收 更高。就说， 16世纪 落后的英国，才能在 18世纪 领 跑。这里 特 要强调一下，不\
    \ 等学 家 常 说 政 府 坏。从 角度看， 好多 子 经 常 现 就 能 收 获。 英国 时期 也不 收 税，权 收 比 不低 于周 期的明朝，也 远高\
    \ 于周 期的法国。税收多，国家 能力 也强。法 能 建 大海军、捍卫贸易等。\n\n## 人类的社会秩序\n\n诺思的理论，能解释 历史，也可以解释当下。所\
    \ 言 代 化， 极端 话，就是形成 英 国式的社会 秩序。这 就是 诺 思 认为 是什 样的 呢？诺思 对社会 秩序 也有 自己的 见解，他 将 人类 社会\
    \ 秩序 分为 三种：\n\n*   第一种，是原始社会秩序。其 规则 是 以 善 为 主， 家 长 是 社会 观 念，是 保护 部族 生 存， 老大 是\
    \ 你 是 你 对 部 族 的 发 展。随 着 时代 的 发展，这 种 模 式 逐 渐 被 淘汰。\n\n*   第 二 种，是 限制 进入 型 社会 秩序。\
    \ 所 谓“限制 进入”，意思是 普通 民众 享受 政 治 权 力 和 权 力 都 是 受 到 限制 的。这是 在 历史 上 大 部 分 国 家 也 的 政\
