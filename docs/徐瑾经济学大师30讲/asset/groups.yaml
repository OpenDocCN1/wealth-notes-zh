    第二种，在新兴大国中，诞生一种新货币挑战美元。就像当年美元挑战英镑一样。这需要建立在经济实力上。日元过去尝试过，但失败了。人民币有没有机会呢？这需要中国满足两个条件，第一，大量的贸易逆差；第二，投资回报率足够高。这两个条件都不太容易达到。这几年，跨境支付中，人民币最好排名是第四，和前几名差距还比较大。


    这就走向了第三种思路，那就是复兴布雷顿森林体系的一部分。也称为特别提款权，简称SDR。这是国际货币基金组织发布的储备资产和记账单位，用来结算各个国家的账面资产负债。所以也叫作“纸黄金”。这条思路
    IMF自然大力推广，也是中国央行前行长周小川倡导的。在国际上引发不少关注。但是，SDR并不是一种货币，而是一种储备资产。所以，它还没有成为真正的国际货币。


    很多年前，美国前财政部长康纳利曾说过一句话，美元是我们的货币，但是是你们的问题。他当时呢，是说欧洲人听的。今天看，更像是对亚洲人说的。我曾经写过货币史，如果你考察几千年货币史，会发现背后的故事，可以说惊心动魄。货币史，就是人类文明更迭和大国兴衰的历史。国际货币体系演变背后，是国家实力与市场力量的双向选择。美元作为国际货币，还将持续一段时间。人民币，还需努力。在美元衰落的时代，中国能做的是什么？最现实的道路，是加强国内改革。为人民币的未来，谋求更坚实的支撑。


    好了，这一讲就讲到这里，在这一讲中，我和你一起，简单的回顾美元的崛起，了解了现在的国际货币体系，和它带来的一系列问题。通过了解“蒙代尔不可能三角”这个理论，你掌握到一个观察国家货币政策的新工具，为你带来一些同以往不一样的视角。下一讲，我们来一起聊聊这个时代，一个备受关注的问题，不平等问题，我将向你介绍的经济学家是托马斯·皮凯蒂。


    # 划重点


    ![](img/8c0fc93ead386915a4b5043d2527383b_58_0.png)


    美元霸权和“蒙代尔不可能三角”叠加，结果是什么？国际货币格局和经济，都发生了重大改变。一个原因就在于，“蒙代尔不可能三角”改变了国家应对危机时的应对政策，而且，也改变了国家的日常经济行为。亚洲危机后，没再爆发什么大危机。但中国这些国家，经历过金融危机后都在拼命积累外汇。目的，就是为了危机时，多个安全垫。这样，造成亚洲国家过分依赖出口。同时，而发达国家呢，又进口太多，这就造成了所谓的全球失衡。'
