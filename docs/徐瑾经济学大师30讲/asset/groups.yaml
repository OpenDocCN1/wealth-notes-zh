    # 09｜奥斯特罗姆：公共治理与人群与组织


    徐璐 · 经济学大师30讲

    奥斯特罗姆：公共治理与人群与组织


    你好，欢迎来到《徐璐·经济学大师30讲》。


    上一讲我们一起了解 了布南姆的思想诞生和发展。通过上一讲，你 已经认识到政府和也失灵。而面对这个问 题，解决的策略和进行新一轮的经济学专家。她是第一位女性诺贝尔经济学奖得主，在中国来说不陌生，因为
    她在中国的学生不少，甚至还有姓名的学友会。她就是奥斯特罗姆，中文简称的。


    1933年，奥斯特罗姆出生 于加州。她童年的时候，正值大萧条的末期。她从小时就能帮忙。在自家牧场，帮奶妈搞玉米种菜。每年收获以后，吃不完的蔬菜，还能做成罐头。这是工作习惯，
    她保持了一生。学考斯特罗姆她学生，和她有联系，她就说奥斯特罗姆很努力，很 有学术精神。每天4点起床，工作十余个小时。


    # 加州水资源的思考


    童年经验，不仅养成了她的勤奋，也给她的研究， 提供了很多早期的案例。例如，种菜浇水，印象中，大多 数人会认为加州和光海连接在一起。但去 过就知道，加州缺水。我上去，正好
    种大林火。原因就是大干燥，空气中都是粉尘。


    加州农业发达，人口密度高，水是珍贵的公共资源。大家在使用上，需要彼此协调，所以在治理层面，往往会 成为水协会。甚至为了水资源的合理管理， 还会专门设水官，这对奥斯特罗姆的影响很大，把她知道的很多细节写入了博士论文。


    成年后，她进一步研究了加州 水资源利用。加州水主要靠 天吃饭，雨水开始流入到加州，大家都想 分用，你别来水，别人也不会用水。这就成 一个恶性循环。随着土地用水过度，引
    发水危机。问题严重了，不仅地下水水质受到影响， 还可能会威胁整个加州的用水。


    这时候，对水资源的使用问题， 大家就不得重轻起来。过去主要以靠官方 解决这类型。但这次，打通各官方也解决不了。为什么？原因有两个，首先政府没有一个部门管到底，而
    两个行政区划规定也不一样。其次市场上， 流在水的几个生产商所在地没有，规模 也不一样。有的只有在地二井水的公司，也有 拥有很多井的政府部门。更不用说，水 的消费者，也是分散的。


    到底应该怎么办呢？在经历了漫长的扯皮与矛盾之后，终于，八 成以上的生产生，坐在桌子 边，达成了一个协议。一方面减少地下水抽 水。另一方面补充水资源，建设地区田，
    收取税水，补贴欠水地。


    这个协议能达成， 那是相当的不容易，因为涉及各方利益。 除了生产方，还有联邦政府、州政府、外方 大大小小市县政府。更不要说，各类私人 公司协会。在协议中，所有人都不断地参与到
    协商。同时，结果也不是一方可以 单独决定。没有一方有能力 一言定音。大家扮演各自角色，共同解决了问题。


    # 多主体参与构成的多中心治理模式


    奥斯特罗姆总结说，多 支参与构成多中心。由此形成了新的多中心治理模式。这种新模式 区别于 信息系统，并且，这种治理模式，也对 社会学中著名的公地悲剧的解决方案做了探索。


    所谓公地悲剧， 来英国经济学家哈尔丁。他提出，如果让 牧羊人来公共牧场放羊，每多一只羊，牧 羊人都会增加一份收入，也会让 草地更差的负担。如果每个羊 人都只知道追求自己的利益，最可
    能羊的数量，最后的结果， 草地过度放牧，以致荒废。


    那么怎么办呢？经 济学过去了两种思路，私有化或管制。前者呢， 让草地 归属于私人自己，他自然会计算放羊载 数目，平衡短期收入与长期 利益。或者，让场域被纳入政府的管理之中。
    或者 管制也会兼顾长期与短期的利益， 并作出平衡。


    这就是最佳答案了吗？我们 学过经济人自利理论，也学过做 政府失灵的悖论。有了这两 块逻辑做基础，来看着这个问题，相信你 会觉得没有简单啊。先看看来有公共 的牧场，如果不
    开放优先，就意味这 片私有的牧场，只有一 部分放牧羊可以用人。就算是有牧 羊来用公共牧场放牧的限制别人，算是 得利状态。那么 采取国有化的方案呢？这可能会导
    入监管管不了的状态。羊的数量可 能被正确地控制了。但放羊人 的追求更大利益的动机，却降低了。


    更关键的是，有的资源， 没法私有化。比如全球气候、海洋。 在 也开，它也不行，怎么办？奥斯特罗 姆给出了第三 条出路，这就是她作为科学 家，提出来的。公共池塘，模式。这个
    模式强调共享， 如果某类资源 是可再生的，同时又相当稀缺，那么所有能 用到这一类资源的，可以互相伤害。就好比 你小池池塘，鱼表面 上人人都有份，但 并不属于某
    一个人。'
