    ## 18 | 弗里德曼：在经济发展中货币是“中立”的吗？


    你好，欢迎来到《徐继·经济学大师30讲》。


    在宏观经济学这个模块，我们聊过凯恩斯，也聊了凯恩斯主义的评判，包括哈耶克从市场角度批判，和布伦斯从时效角度的思考。今天我们来聊一下，另一位经济界大师。他从货币角度批判了凯恩斯主义，为资本主义自由辩护。他就是米尔顿·弗里德曼（Milton
    Friedman, 1912.7.31 - 2006.11.16）。


    二十世纪中后期，影响最大的经济学家，非弗里德曼莫属。这位思想上的巨人，现实中的小矮子，不到一米五，思想爆发力却令人惊叹。一开口，机关枪一般扫射，对手望风而逃。


    他1912年生，父母是乌克兰第一代犹太移民，母亲是工人。父母中年，父亲去世，家里可以说一贫如洗。但是弗里德曼靠着个人努力，获得奖学金，上了大学。他本身打算成为精英，但半岁时，正是大萧条时期，因此想哲学思想更有用。于是，他去了芝加哥大学读经济。从此，经济学多了一位传奇。


    ![](img/8c0fc93ead386915a4b5043d2527383b_35_0.png)


    ### 弗里德曼的货币主义


    弗里德曼的名气，来自两重身份。学术上，他开创了货币主义学派，1976年获得诺贝尔经济学奖。媒体上，他是一个活跃公民，乐此不疲地展示个人魅力，他的电视节目非常火。他既是个“大嘴巴”，电视上又非常风趣。他经常上电视，上很多电视台，上很多节目。他能把复杂的经济问题，讲得通俗易懂。


    提到货币主义，你可能听说过弗里德曼一句经典名言：通货膨胀从来都是一种货币现象。他对货币的关注，在经济学界是出了名的。在弗里德曼之前的经济学界，货币被认为是个中性变量，只用来交易。在弗里德曼看来，货币是经济学的核心。货币是财富的代理，货币是支付手段，货币是资产，货币是价格。


    这种货币与人的交互。亚当·斯密也认为，货币起源于物物交换，但是斯密把货币当工具。弗里德曼把货币当资产。在经济学界，货币是价格尺度的基础。在弗里德曼看来，货币是经济学的核心。


    弗里德曼的伟大，就在于他能把这种思维，应用到经济学的所有领域。他首先把货币视为资产。在历史上，人们把黄金视为货币，因为黄金是资产。在弗里德曼看来，货币是资产。


    这个观点能证明吗？怎么来证明货币是资产？货币数量说。弗里德曼的货币数量说，是宏观经济学的基础。货币数量说，是货币供给与物价水平之间的关系。弗里德曼认为，货币的供给影响物价水平。


    ### 金属货币制度


    在货币史上，金属货币制度是货币发展的早期阶段。金属货币制度，包括金银本位。金银本位，包括金本位和银本位。


    比如英国，在19世纪，英国实现了自由贸易，金本位。英国是金本位的代表。


    台湾大学附近有个茶馆，叫紫藤庐。经济学者柳红带我去过。这里，曾是台湾自由主义者的聚集地。龙应台也常来。最早的主人周德伟，是哈耶克的亲传弟子。他翻译过哈耶克著作，为普及其思想作出不少贡献。如果你去台北，可千万不要错过。这一讲就讲到这里，下一讲，我们介绍另外一位从货币角度批判了凯恩斯主义，为资本主义自由辩护的经济学家，米尔顿·弗里德曼。


    ### 划重点


    弗里德曼的伟大，就在于他能超越这种直觉。在他眼中，货币有实际影响。是他首先指出，货币，也是一种资产。在历史上，贝壳、胡椒，甚至香烟，都曾充当过货币。这意味着，和别的资产一样。人们对货币的态度，也可以用需求来解释，而且个人收入、利率水平等等，都会影响货币需求。


