    # 6.利用最后时限给对方设一个困境


    柯英是美国著名的谈判专家，在其担任美国某企业的谈判代理期间，曾和日本某企业进行谈判。这次谈判后，柯英就对日本的谈判术赞不绝口。那么，日本人使用了怎样的技巧，竟然引得这位鼎鼎有名的谈判专家赞不绝口呢？


