    其中，一位富翁的答案是我没有希望，所有的希望都已经满足了。”原来，这位富翁患了严重的忧郁症，其事业也呈下滑趋势。后来，心理学家对他进行了心理引导，培养他的希望，比如引导他燃起对外孙成才的希望等。经过持续的希望的“煎熬”，这位富翁终于又恢复到年轻时办事雷厉风行的状态。


