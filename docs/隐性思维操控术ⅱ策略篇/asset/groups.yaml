    下些工夫，给我们的情绪也补充一些“营养”。


    ③呼吸疏解。心理专家为我们提供了一种缓解情绪的呼吸方法：把胸口中的气都缓缓吐出；轻轻闭上双眼；慢慢均匀吸气，什么也不要想；憋住气，默数3下；将气均匀呼出，要把胸口的气排得干干净净。在呼气时，想象一切负面情绪都跟着这口气被排出体外，从此和你再也没有关系。


    ④睡眠疏解。旺盛的精力是我们跟负面情绪战斗的根本保证。当负面情绪来袭时，我们不妨“避其锋芒，养精蓄锐”。


    ## 第十章 用心理策略解开人际关系的结


    有时，不知怎么的，人际关系就成了难解的结，那真是一段让人难捱的时光啊！他人的抱怨、妒忌、敌对……这些都让你苦恼不已。本章为你安排了许多绝妙的心理策略，引导你采用正确的方式去解开这些难解的结。相信有了它们的协助，你就能够游刃有余地处理好这些让你头疼的人际交往难题。


    ### 1. “同理心”是获得良好人际关系的有效保证


    在人际交往中，不少人因为觉得自己受了委屈而不停地抱怨对方，而对方完全不认为自己有什么不对。于是，两个人越吵越厉害，吵得惊天动地，最后把“情谊”吵成了“恨意”，自此分道扬镳、形同陌路。


    其实，只要我们把自己摆在对方的位置上，设身处地地体验、理解他人的内心世界，注意形成彼此之间的共同感受，就不会再处处挑剔对方，抱怨、责怪、嘲笑、讥讽也会大大减少，取而代之的是赞赏、鼓励、谅解和互相扶持的、和谐美满的人际关系。


    上海女孩小墨与湖南女孩小丁本来是感情很好的朋友。后来，两个人更是搬到一个屋檐下，当起了室友。两个人在很多方面都相处得非常融洽，但总是因为“吃菜问题”闹矛盾。小墨做菜要放糖，因为上海人爱吃甜食；小丁做菜喜欢放辣椒，因为湖南人嗜辣如命。吵来吵去，两个人的友谊出现裂痕，最终都视对方为老死不相往来的对象。


    后来，小墨结了婚。婚后小墨开始犯难了。因为她的丈夫祖籍四川，与小丁一样是个“吃辣大王”。与小丁之间的不愉快经历让她记忆犹新，经过深思熟虑，小墨终于想出一招妙计。婚后第一餐，她就抢着买菜烧菜，每样菜里都放了辣椒，四川丈夫吃得津津有味。可是，当他看到小墨被辣得满头大汗时，吃惊地问道：“你既然不爱吃辣椒，菜里为什么还要放这么多辣椒呢？”小墨听罢，心中甜丝丝的，笑道：“因为你爱吃辣椒啊！”丈夫非常感动。第二天，换成小墨的丈夫抢着买菜做菜，他在每样菜里都加了糖。小墨一吃，挺对胃口的，就问丈夫：“你不爱吃甜的，为什么每样菜都放糖呢？”丈夫诡秘地一笑：“我是向你学习，处处替对方着想啊！”小墨听后，心里别提有多美了。


    她暗想，要是当年与小丁住在一起时也能像如今这样“换位思考”，也不至于失去一个好朋友了。


    以“同理心”试着换位思考，以宽广的胸怀接纳对方，才能彼此尊重和体谅，才能获得真正的友谊。


    心理学家将同理心分为初级同理心和高级同理心。初级同理心的反应是能够理智地理解别人的行为，在与他人接触中，不排斥、也不强迫他人接受自己的观点；高级同理心则是指个体不仅可以站在他人的角度考虑问题，还能感受这个事件给他人带来的内心体验，使自己进入对方的内心世界，它所表达的是一种理解、接纳、平等、关爱与尊重。


    通常，一个具有同理心的人对周围的一切事物都会产生一种关心和了解的心理趋向，当自己与他在认识上出现了分歧时，能够真诚地尊重对方并容忍这种差异；当自己与他在行为上出现摩擦时，能善意地理解对方，并分担由此而产生的各种心理负担。在与人交往的过程中，惟有具有“同理心”，才能成为真正的社交大赢家。


    不过，要做到将心比心、设身处地并不是那么容易，真需要好好用心实践才行，特别要注意的是：同理心的过程是“将心比心”，把自己当成“当事人”，而不单单是站在对方的角度看事情。


    ### 2.不做单飞的雁，适当从众


    人同大雁一样都是群居型动物。只有“合群”的大雁才能顺利地达到理想中的目的地，掉队的大雁总是形影相吊，而且境遇悲惨，大多数情况下不可能飞得很高很远。人生也是一样，要使自己融入周围的社交环境中，才能“飞”得更高更远。


    莎莎在短短的一个月时间内连续更换了4次工作。无奈中，她只好去求助一位职业咨询师。


    “第一家单位的老板太苛刻，脾气太坏，我忍受不了他那张严肃的脸，结果我一气之下就走了。”莎莎不无遗憾地说：“不过那里的员工还不错。”


    职业咨询师问：“第二家呢？”


    “哦，我是一个相对安静的人，不喜欢吵闹的环境。我上了一周的班，就发现那个部门的人太活跃了，我受不了他们的笑声……”


    咨询师笑了一下，问：“第三家是什么问题？”


    “第三家我待的时间比较长，但是我反感在背后说别人坏话的人，我连续好几次听到别人说我清高，可是我不是那样的人。我的情绪受到了干扰，我想换个新的环境。”


    “可是我发现第四家的人更难相处，虽然他们都很安静，但是我觉得似乎也太冷漠了，我去了两天竟然没有人拿正眼看我……”


    心理咨询师把身子向后仰去，说：“你的困难其实很好解决。你只需要明白，你要去适应环境，而不是让环境适应你。你要尽量‘合群’，而不是把自己置于群体之外。”


    任何一个社会环境中，都可能有苛刻的人、异常活跃的人、在背后抱怨的人、冷漠的人，最甚者，这几种人可能同时存在，但是你所要做的就是“合群”。你要融入你的生活环境中，你要适应周围人的生活习惯，因为只有这样，你才能和他人很好地相处。


    社会心理学家认为，人都有一种“从众心理”。这种心理在行为上表现为模仿大多数人的行为；在认知方面表现为以多数人的意见为准则对外界作出判断和评价。也就是说，那些“鹤立鸡群”的人往往不能够得到众人真正意义上的接纳。


    因此，在人际交往中，一定要注意适当从众，融入周围的社会环境中，才能融洽地和他人相处。具体地说，以下几方面是需要留意的：


    - 1. 不要希望“鹤立鸡群”。我们应该在言行举止上表示自己的善意和坦白，并常常考虑对方的立场，言行及态度不要太过严肃或太注重形式，尽量和他人打成一片，不要强调自己高人一等，或摆出高高在上的姿态。

    - 2. 切忌锋芒毕露。比如，在公司里，要是你没事整天念叨“我要当老板，我要办产业”，就很容易被同事看作异己，把自己放在同事的对立面上。如果不幸让老板知道，也会被老板当做清理的对象。要知道，在办公室里大谈人生理想是不妥的，你公开自己的进取心，就等于公开向公司里的同事挑战。因此，做人低姿态一点，是自我保护的好方法。你的价值体现在做事上，在该表现时表现，不该表现的时候就韬光养晦。但凡能做大事的人，都不是爱说大话的人。

    - 3. 表现适可而止。如果你有才能，应该要表现出来，但不可锋芒太露，否则容易遭忌。当你提出自己的见解之后，别人自然会判断此见解是否可行。如果不接受人家的见解又批评人家的意见，贬损他人而褒扬自己，这实在是下下策。

    - 4. 听听别人怎么说。诚恳地聆听他人的意见，亦是增进彼此间情谊的方法之一。莎士比亚说：“对于他人的话，你若善意听之，则你将得到五倍的聪明。”你要改善自己与他人之间的关系，那你就承认对方的长处，而且时常表现出“对我来说，你是非常重要的”，让对方觉得被重视。

    - 5. 对别人不妄加评论。即使对方炫耀自己的精明能干，你也千万不要轻易评价他，不要说是骄傲虚荣的家伙，尽量让自己远离嫉妒和诋毁，学会真诚地赞赏和学习。

    - 6. 只当个暂时的听众。如果是对方有所抱怨，你不妨暂时充当听众，最好不要反驳或是加以附和，这样能够避免很多人际纷争。


    ### 3. 感谢对手，因为他是上天的恩赐


    古人说“生于忧患，死于安乐”，竞争和危机对人生的生存来说是必不可少的。在压力和挑战下，人才能够抵御天生的惰性，才不会松懈，才能避免在安逸中走向灭亡。


    在挪威，沙丁鱼是人们的挚爱，因此沙丁鱼非常畅销，而且活蹦乱跳的沙丁鱼往往能比那些死的沙丁鱼多卖出好几倍的价钱。遗憾的是，沙丁鱼大多数在捕捞后返航的途中就已经死了。为了能使它们活着到达码头，渔民们尝试了许多办法，但是都没有成功。


    后来，人们发现将一条鲶鱼放进装满沙丁鱼的鱼槽里，就能够解决问题了。原来，由于鲶鱼对周围环境很敏感，把它装入鱼槽后，它会不安地四处活动，而沙丁鱼发现这个紧张地四处游动的家伙后也会不安起来，因而加速游动，如此一来，沙丁鱼便能活着抵达码头了。


    后来，这种现象引起了心理学家的关注，他们认为：通过个体的“中途介入”，激发群体中其他个体的竞争意识，可以大大地提高效率。这就是所谓的“鲶鱼效应”。


    早在2000多年前，我们中国人的祖先就发现了“鲶鱼效应”的存在，并将它运用到养马的过程中。他们在马厩中养猴，这样就能够有效趋避马瘟。猴子天性好动，每当这些马松懈倦怠的时候，猴子就会去撩拨它们，这样就让马时刻保持忧患心理，并且还得到了一定的训练，从而提高马对血吸虫病的抵抗能力。


    在马厩中养猴，可以使马匹更加健康，由于猴子有“弭马瘟”之称，所以有人将这种现象称为“弭马瘟效应”。


    “鲶鱼效应”普遍存在于自然界。动物学家们发现，鹿群如果离开了狼等天敌，其身体素质和整体的繁衍就会呈下降趋势。事实上，没有对手、失去竞争意识是一件非常可怕的事情。


    有了对手，才有危机感，才有竞争力。有了对手，才有动力去奋发图强，去革故鼎新，去锐意进取，因为人们知道，如果不这样的话，唯一的命运就是被吞并、被替代、被淘汰。“鲶鱼效应”告诉人们，应该为自己找一个竞争对手，这样更有利于自己的发展。


    在赛跑比赛中，枪声一响，众人齐发，难分先后。但有一个策略却是常用的：选手们都会跟上某位对手，在恰当的时机突然加速超越，然后寻找另一位对手，跟上他、超越他……如此一直冲至终点。


    长跑，尤其是马拉松比赛，是一场体力和意志力，尤其是意志力的角逐。有人就因为意志力不足，而在体力达到极限之前就退出了比赛；也有人本来领先，但却因为没有短期目标而在不知不觉间慢了下来，被后面的选手赶上。如果能跟住某位对手，就可以避免这些情况的产生，一方面，对手可以激励我们产生“不能被他甩开，别慢下来，要跟住”的想法。另一方面，对手也可以产生提醒作用：“路还很长，要保存好体力，别冲得太快！”马拉松比赛中，所有参赛选手往往先是形成一个个小集团，然后再分散成二人或三人小组，过了中点后，才慢慢出现领先的个人！


    其实，人生又何尝不是一场“马拉松”。既然如此，我们为什么不学习一下长跑选手的做法——为自己找一个竞争对手。拥有对手是一种福气和造化，而不是心腹大患；对手是异己，但不是眼中钉、肉中刺。因为一个强劲对手的存在会让我们时刻都有危机感，这会激发起我们更加旺盛的斗志。


    因此，在人际交往中，应避免将自己的对手视为除之而后快的存在，而应将其当成一种激励、一种促进，当成上天对我们的一种恩赐。这样才避免走人与人结怨的死胡同里，避免让自己的人际关系走到绝境。


    ### 4.化解对方对立情绪的心理策略


    有位女士和丈夫相处不融洽，她一点儿也感觉不到丈夫对自己的爱恋，为此苦恼不已。为了改善这种情况，她就去向村子里的智者请教，要他指点迷津。智者对她说：“没问题，我一定会帮你，但我有一个条件，我要你从狮子身上拔三根毛下来给我。”


    狮子是最凶猛的动物，连猎人都不敢轻易靠近，何况她这样一个手无缚鸡之力的弱女子呢？但是为了挽回丈夫的心，她还是决定去做，心想“不能力敌就智取”。


    第二天早晨，她特意起个大早，拿了一盆肉到狮子出没的树林边，放下盆便回家去。以后，她每天早上都会在同一个地方为狮子摆上一盆肉当早餐。渐渐地，狮子习惯了她的款待，也把她当成了熟人。到后来，那头狮子一见到她的身影，就主动靠上前去，用背蹭她的腿，要她摸摸它的背。这时候，这位女士总是轻轻地拍拍它的背，就像奖励一个孩子一样，随即就离开。


    又过了一段时间，当这位女士确信狮子已完全信任她的时候，终于小心翼翼地从狮子的鬃毛上拔了三根下来。


    她迫不及待地把狮子毛交给智者，智者问她是怎么弄到手的。这位女士详细讲述了经过，智者听完笑了笑，说：“你已经学会留住丈夫的方法了，那就是你驯服狮子的方法。”


    这位女士之所以能驯服狮子，是因为一开始就没有直接把自己摆到“要拔狮子毛”的与之对立的位置，而是站到狮子的身边“以柔克刚”。


    有一个城市垃圾污染问题严重，为此，市政部门购置了许多垃圾桶摆放在各个路口，然而效果并不理想。接着，城管机构又出台了几个解决办法，比如，对乱扔垃圾者处以25-50元的罚款，增加卫生管理员的巡逻等，但问题仍然没有解决。后来有人设计了一个特别的电动垃圾桶，桶上装有一个感应器，当感应器感应到垃圾进桶，就会启动扬声装置，播出“谢谢你保护环境”之类的话。


    结果，新型垃圾桶一经投入使用，这个城市的垃圾污染问题显著改善。那么，为什么其他方法收效甚微，而这个方法却可以成功呢？原因就在于，这种做法使市民们意识到，市政当局和市民们是同一阵线的，都在为了城市的良好环境而努力，因此双方没有什么隔阂，没有隔阂自然就容易合作愉快。相反，增加罚款和巡逻人员的方法，从一开始就形成了对立的关系：一个罚款，一个不要被罚款；一个要抓，一个被抓。在逆反心理的作用下，有些市民即使以前不会乱丢垃圾的，也变成乱丢的了。


    法国著名作家让·德·拉封丹写过一个“北风和南风”的寓言：北风和南风都觉得自己比对对方更有用，于是就相约了一场比赛，看谁能把行人身上的大衣脱掉。北风首先让街上刮起了冰冷刺骨的寒风，而且越刮越大，结果行人为了抵御严寒，把大衣越裹越紧。而南风则徐徐吹起了暖洋洋的风，顿时风和日丽，行人觉得暖和了，大衣有些穿不住了，就开始解开纽扣、脱掉大衣，南风获得了胜利。


    同样，在处理人与人之间的关系时，首先要做的就是化解对立的情绪。北风和南风都要使行人脱掉大衣，但北风与行人针锋相对，加剧了彼此的对立，最终失败。


    从上面这些事例中我们可以了解到：以对立的心态去化解对立的情绪是注定要失败的；只有反其道而行，才能达到以柔克刚的神奇效果。


    ### 5. “背后鞠躬”消除对方的敌意


    在人际心理学中，有一种被称作“背后鞠躬”的劝说术，让第三者佯作无意地向对方道出你的善意或友好的想法，往往能够让彼此不睦的人际关系来个大转折。


    有一次，有人在林肯总统面前搬弄是非说，外交部长埃德温·斯坦顿曾骂林肯是个该死的傻瓜。谁知，林肯听了以后不但没有生气，反而像闲话家常一般地说：“如果斯坦顿说我是个该死的傻瓜，那么我很可能真是的，因为他办事一切都认真，他说的十有八九都是正确的。”林肯的这番话很快传到了斯坦顿的耳朵里，斯坦顿听到他人转述过来的这番话的时候，感动极了。他在第一时间内跑到林肯面前，向林肯表示了自己敬意。


    林肯正是利用了“背后鞠躬”的方法使斯坦顿改变了态度。那么为什么“背后鞠躬”能够取得这样的效果呢？


    心理学家认为，与当面表达善意相比，“背后鞠躬”往往能产生更加显著的效果，主要原因有3方面：


    - 1. 人际交往遵循“相悦定律”，即谁喜欢你，你往往就会对谁报以同样的好感。因此，当你向对方“鞠躬”的时候，往往能够换回对方的“鞠躬”。

    - 2. 采用“背后”的方式，能够绕过对方的心理防备区。如果你亲切向对方表达善意，即使你完全是出于真心的，也很可能被对方冠以“无事献殷勤，非奸即盗”之名，进而对你所表达的善意产生排斥，甚至加重心理防备，使得你的善意完全失去效用。相反，如果信息是从第三者口中获得的，对方就不会怀疑其可信程度，因为对方会想：“什么好处也捞不着，他没有必要对我说谎。”因此，借由第三者向对方传递善意，能够使你的诚意显得更加真切、可信。

    - 3. 防止对方的负面自我概念产生消极作用。在人际交往中，很有可能，对方对你的敌意是由于对你的羡慕或者嫉妒。在这种情况下，对方对自己的自我概念持负面态度，即认为自我形象不好、不值得他人喜爱。如果对方有这样一种心理，那么当你向对方说“你很好，我喜欢你”，对方很有可能认为你在消遣他，进而使关系更加恶劣。


    此外，心理学家还指出，当人具有正面或中性的自我概念时，会对他人的善意报以同样的善意。然而，当人具有负面自我概念时，“归说定律”的效果会大大降低。


    采用第三者转述的方式，就能够穿过对方的这两个消极关卡。因为，他面对的对象是第三者，而他在第三者面前是不会有负面自我概念的。


    在生活中，如果对方的敌意不是源于彼此间的利害得失，那么，“背后鞠躬”策略通常能有效化解对方的敌意。总之，如果对方是因为讨厌你才敌对你，又或者是因為嫉妒你才敌视你，那么，借第三者的口传递“喜爱、友善”的信息，告诉对方你“钦佩他、羡慕他、尊敬他”，往往能够给彼此的关系带来转机，有效地化解对方的敌意，其效果定能让你大吃一惊。


    ### 6.化解对方妒意的心理策略


    “木秀于林，风必摧之。”一不小心招惹上了他人的妒忌，被人脚下使绊子、下黑手，遭人排挤，不仅会给你的成功造成巨大阻力，而且也会让你内心非常痛苦。难道就没有一种方法能够让对方的妒火熄灭？


    要找到解决麻烦的方法，你不妨先利用逆向思维来分析一下对方的心理。


    哪些人最可能妒忌你？当然是自我评价低的人。


    可是，自卑的人虽然很多，但妒忌你的人仍是少数，这又是为什么呢？心理学家认为，人际交往中“妒忌”和“自我评价”之间的相关性并不大。


    那么，是什么决定了那少数自卑的人妒忌你呢？确切地说，“自我评价”的一个方面，即自我价值，才是让对方“妒”火中烧的主要原因。比如，一个设计师，是更容易妒忌另一个比他更有创意的设计师呢，还是一个网球打得比他出色的老同学呢？显然，他更容易妒忌另一个设计师，因为设计的创意直接关系到他的自我价值，如果在这方面他技不如人，他就会产生很多疑问，比如：“我”是谁？“我”该如何定位自己？作为一个人，“我”的价值有多大？固然，如果有人网球比他打得好，这也造成了他的自我评价低，不过他不是职业网球手，网球打得好不好，他根本不在乎，这威胁不到他的自我价值，因此他不服忌。


    换句话说，要想熄灭人家的妒火，你只是笼统地提高对方的自我价值是无法奏效的。你要清楚，对方的妒火是因为你的存在让他对自己的价值产生了怀疑才烧起来的，如果不能让对方对自己的价值进行自我肯定，那么妒火或许越烧越烈。因此，如果你能让对方肯定自己的价值，就能釜底抽薪解决问题。


    举个例子：你有一个英俊潇洒、聪明体贴、工作勤奋但家世不好的男朋友，还有一个家财万贯的蓝颜知己。因此，你的男朋友妒忌你的蓝颜知己，总是吃醋，你对此相当恼火。那么，你应该怎样平息男友的妒火呢？通常，你会夸他爱你，他英俊潇洒、精明能干，比那个蓝颜知己有过之而无不及……你极力提高他对自我的评价，甚至不厌其烦地一次又一次这样做，可是最终发现，你这样说得都烦了，而他还是妒忌、吃醋。你会不会觉得很费解呢？其实，你的上述做法之所以不管用，是因为他妒忌、吃醋的原因并不是你说的那些，而是你那个蓝颜知己所具备的“特质”——钱。因此，你必须抓住与男朋友的自我价值密切关联的“钱”字进行开解才能奏效。你可以告诉他：对你来说，钱一点都不重要，并且把原因解释给他听，让他相信。这样，他的妒忌、醋意自然就都没了。


    贬低其他人有而妒忌者认为自己没有的涉及自我价值的特质，能让妒忌者的妒忌立即消除。比如上面例子中，想让男友不再妒忌，你可以说：“我觉得，衡量一个男人的真正标准并不是他有多钱，”

    '
