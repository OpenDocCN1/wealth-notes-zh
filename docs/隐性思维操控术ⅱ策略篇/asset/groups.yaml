    对此，具体方法是多种多样的。比如：积极参加社交活动、乐于助人、请熟人介绍、参加社团组织、利用网络等。总之，只要我们积极行动起来，有意识地扩大自己的交际圈，就一定能够找到志同道合的人。


    ## 9. 我行我秀，个性形成印象


    全世界总共有将近200个国家，对大多数国家在地图上的领土形状、位置等，我们都记不太真切，但对那些具有显著特征的国家却记忆深刻，比如：中国版图像雄鸡、意大利版图像一只高筒皮靴和足球、法国版图近似六边形等。


    在一场参加人数众多的宴会中，主人循例对每一位来宾表示欢迎，即使与来宾素昧平生。然而宴会结束后，主人能回忆起姓名的大概都是在身形、相貌、年龄或者地位等方面有与众不同特色的人。


    生活中，类似的例子数不胜数，人总是容易记住那些具有特色的、与众不同的人或事。这种现象就是心理学家们常说的“莱斯特夫效应”。


    心理学家指出，人们对初次接触的事物所采用的都是无意识记忆。所谓无意识记忆是指没有自觉识记目的，没有任何识记方法，而且也不会做出意志努力的识记。无意识记忆的效果带有明显的偶然性，能记起什么、什么又是没有印象的，这些都是偶然的。


    通常情况下，当人的心理状态或情绪波动大、感受强的时候，无意识记忆的事物会被记得更牢。换言之，生活中那些具有重大意义的、引起人浓厚兴趣的、能激发人情感的人和物被记住的可能性比较大。


    在社交活动中，我们都希望自己是高效率的，能够尽快快速建立起尽可能多、尽可能和谐的人际关系。也就是说，我们不仅要成为别人社交对象的合适人选，而且要成为最佳人选。这就要求我们在初次与人接触中要留给对方良好的、有特色的、个性化的印象。比如：公司的老板难得到公司露一次面，职员自然要把握难得的机会，给老板留下深刻的印象，这样才有可能被重用。


    心理学家告诉我们，人与人的初次接触给彼此留下的印象都具

    有时效性，越具有特色、表现越出色，留给对方的印象就会越深，其时效也就越长。


    想从人群中“异军突起”，就要打造自己特有的个人品牌。首先，我们可以从提升个人魅力方面来努力。


    个人魅力来源于人的个性，而表现于一举一动、一言一行。一个很有个人魅力的人，往往都能巧妙地将自己的个性特点用行动展现出来。所谓的技巧大致包括下面几种：


    1. 用行动突出热情。热情是极富感染力的，它让人感觉愉快。主动与对方握手，微笑着自我介绍，真诚地赞美，以及向对方施以援手等，都是一个人热情的表现。对方很容易因为我们的热情而长久地记住我们。


    2. 用语言突出幽默。幽默能够轻而易举地吸引人的注意力，引起人的兴趣。它是在短时间接触过程中让别人牢牢记住我们的有效工具。


    3. 用眼神突出自信。眼睛是心灵的窗户。很多人看人都会先看一个人的眼睛。面带微笑、从容大方地正视对方，同时心里想着“我是最棒的”，这样，眼睛就会闪耀着自信的光芒，让自己从人群中脱颖而出。


    4. 用抑扬顿挫的语调突出从容。语调抑扬顿挫才有节奏感，才有感染力，才能给人留下良好的印象。


    5. 适时表现自己的才能。人们对那些多才多艺、才华出众的人都是难以忘怀的。在与陌生人打交道的过程中，一定不要错过展现自己才华的机会。


    个人魅力的修炼虽然很容易给对方留下美好的印象，带给对方愉快的感受，但是要达到“鹤立鸡群”的效果还要制造自己个性的闪光点。


    首先，我们要注意保持优雅的仪态。行为举止优雅得体是一种良好修养的表现，会给人以很有气质的感觉，让自己显得出类拔萃。而举止优雅的基本要求就是：不徐不急，落落大方；无论是坐立还是行走，都要挺直腰背，抬头挺胸收腹。


    其次，表情尽可能地生动起来。在人际交往中，表情是我们传递喜怒哀乐的重要工具之一。表情越是生动，传递出的情感就越强烈，给人的感受也会越深刻。


    再有，搭配服饰，突出自己的优势。在众星云集的电影节或者颁奖典礼上，明星都会精心地选择服装，而选择了最佳的服装，势必也会成为焦点，由此可见，服装确实有画龙点睛的作用。因此，我们要根据自身的长相、身材、气质、身份、出席场合等来精心选择服装，让自己脱颖而出。


    在这个讲究个性和个人魅力的时代，那些平庸、毫无特色者注定会被人忽视。因此，我们要提升个人魅力，秀出自己的闪光点，这样才能做社交场上的明星。


    ## 10. 恐惧心理让社交成了炼狱


    “站在人群中，那些来历不明的目光让我感到恐慌。”


    “我宁愿做一个毫不起眼的人，不被注意地站在角落里，也不愿意参与到人群中去。”


    “更多时候，我疏远稠密的人群，喜欢一个人静静地待在小屋里，宁可对着布娃娃发呆，也不愿走到街上去面对众人陌生的目光。”


    其实，类似情况在每个人身上都有不同程度的表现。面对陌生人会感到不舒服、不自然；在公众场合总是低着头，不愿意说话，即使说话也很小声；站在台上发言会双腿颤抖、呼吸急促、思维混乱、说话口吃，这些都是它曾经经历的。即使那些似乎和社交恐惧根本靠不上的公众人物，比如美国前总统卡特、电影明星凯瑟琳·戴尼维等，也都可能曾经对社交怀有恐惧。


    社交本是一场舞会，用来敞开心扉，与人共享别人的、自己的快乐。然而，对社交恐惧者来说，社交如同炼狱苦海。


    社交恐惧症是焦虑症的一种，是一种心理障碍疾病，心理学上称为社交焦虑失协症。它具有很高的患病率。在美国，患社交恐惧症的人数仅次于抑郁症、酗酒而名列第三，是典型的心理疾病。


    它的主要表现是：自我封闭，不敢交友，害怕社交。在人前，社交恐惧症患者常常会手足无措，严重时就表现为不敢在公共场合打电话，不敢单独和陌生人会面，有人在旁边就无法工作等较为极端的行为。同时，还会伴有心慌、颤抖、出汗、呼吸困难等身体不适症状。


    我们知道，人是群居动物，社交是人的本能需求。当对社交的恐惧而使社交欲望得不到满足时，人的心理就会出现焦虑、孤独、不敢面对挫折，逃避现实，缺乏安全感，觉得只有躲在没人的地方才安全等状态，进而给自己的生活蒙上阴影。


    心理学家认为，社交恐惧产生的原因是过于看重和顾忌他人的评价。社交恐惧看起来是对外的排斥，实质上是朝内的，是自己对自己的排斥，是惧怕别人眼中的自己；害怕别人对自己持否定的看法，害怕他人拒绝自己，害怕自己在他眼中不够完美；是拥有强烈羞耻感、自卑和追求完美带来的一种负面心理。


    心理学家科特雷尔曾做过这样一个试验：他组织一个小组进行活动，同时安排两组不同的观察者，一组观察者的眼睛是蒙上的，另一组则没有。结果发现，活动小组成员在面对蒙着眼睛的观察者时表现得很自然，几乎没有恐惧感；而在面对没有蒙上眼睛的观察者时，表现则要拘谨得多，而且出现了不同程度的紧张和恐惧感。


    这个试验证明，评价顾忌是使社交恐惧产生的一个重要原因。


    通常情况下，那些外界的环境大部分是我们无法左右的，但是，我们可以调适自己的心理状态，让自己充满自信，来克服社交恐惧心理。


    美国前总统富兰克林·罗斯福的夫人艾莉洛出身名门。也正是由于出自名门，家中美女如云，她的母亲、婶婶们都是社交界的名媛，与她们的光彩夺目相比，艾莉洛一直认为是只笨拙的丑小鸭，长相平凡、举止羞涩，因此，对那些上流社会的热门活动她总是避之唯恐不及。


    常年被笼罩在他人的阴影之下，艾莉洛变得自卑、孤僻，害怕社交。在那些不得不参加的舞会上，她总是找个角落把自己藏起来。


    一次圣诞节舞会上，艾莉洛像往常一样在角落里祈祷着舞会快些结束。然而，一位叫富兰克林·罗斯福的年轻人注意到了角落里的艾莉洛。他飘然上前，向艾莉洛邀舞。年轻人脸上真诚的笑容打消了艾莉洛的迟疑。随后，艾莉洛跟着年轻人一起跳了一场最美妙的舞蹈。


    从此，艾莉洛走出了自卑的阴影，打开心扉，终于成为一个自信又有魅力的女人。


    自卑与自信，恐惧和从容都只在一线之间。艾莉洛告诉我们，阻碍我们和别人交往的并不是平凡的相貌、简朴的衣着，而是自己内心的一道门，跨出去，冲破这一阻碍，一切社交难题都将迎刃而解。


    现在，就让我们一起，迈出摆脱社交恐惧阴影的步伐吧！对此，心理学家给出了八种方法：


    - 1. 适当地放松自我。这样做能够缓解心理的恐惧感：将两脚平稳站立，轻轻地把脚尖踮起，坚持几秒钟，然后放下；同时，边做有节奏的深呼吸边数数。这样做 2-3
    组（每组 30 下），一般就能够缓解恐惧心理。

    - 2. 给“手”事情做。心理学研究表明，双手空空的会让人的社交恐惧感增加，而手里握着东西能给人一定程度的安全感。台湾名主播蔡康永总是在做节目时把一支笔握在手里。他说“这样可以有效避免手不知摆在什么地方的尴尬。”

    - 3. 社交情景演练。经常自己在脑海中预演，或者把板凳、桌子等当成陌生人进行社交演练，次数多了、时间久了，效果就明显了。

    - 4. 练习专心看着别人的眼睛说话。眼睛是人心灵的窗户，如果能够勇于直视他人的眼睛，也就相当于敢于敞开心灵和人交流。开始时，一直盯着别人的眼睛可能会比较尴尬，但我们可以给自己一些心理暗示，比如“即使看着他的眼睛，他也不能把我怎么样。”或者当成一个自己的小游戏：我就这么盯着他看，看他会有怎样的反应。

    - 5. 接纳自己，信任自己。社交恐惧症在某种程度上是不能接受自己的一种表现。从现在开始，停止对自己的挑剔、批判、责难，也不要一恐惧就逃跑。要知道，如果自己都不接纳自己，那么这个世界上还有谁会接纳你呢？

    - 6. 关注社交本身，而非自己的表现。将注意力转移到“我怎样才能表达清楚我的意思”、发掘对方的优点等事情上来，这样就能够自然从容了。

    - 7. 选择那些目光友善的人作为交往对象。友善的人比较懂得如何尊重一个人，我们也比较容易从他们那里获得认可，进而建立起我们的社交自信。

    - 8. 不刻意迎合别人。压抑自己、迎合别人的做法并不可取。一方面，这样的方式让对方无法了解到真实的我们；另一方面，也会给自己带来很大的心理压力，让自己排斥社交活动。


    牢记上述技巧和心理调整办法，随时拿出来用用。慢慢地，你就会发现你已经抛开了恐惧，也能与人亲密接触、愉快交往！


    ## 第二章 把握他人需求的心理策略


    心理学家们指出，个人内心的需求是决定其言行的关键因素。如果能够了解他人内心的需求，就能够把握其行为趋势和活动规律，使我们可以采用最合适的模式与对方交往。同时还可以通过引导他人的需求来引导他人的行为。了解他人内心的需求有百利而无一害，因此，本章将和你一起寻找人类内心需求的变化规律，去学习探查他人内心需求的方法。


    ### 1. 从人的共性上把握他人的需求


    1924 年，克莱斯勒汽车成功地推出了一款新车型，前所未有地受到了大众的喜爱。由于这款新车的畅销，克莱斯勒公司一跃成为美国最大的汽车制造商中的一员，一时间名声大振。那么，克莱斯勒公司怎么就知道这款新车能够满足大众的需求呢，他们是怎样预测出大众的心理需求的呢？


    世界上不可能有两片完全相同的树叶，每个人因职业、生活习惯、背景、收入等诸多情况不一样，需求也就不一样。事实上，需求不但因人而异，即使是同一个人的需求也不可能一成不变。面对这变幻莫测的需求，克莱斯勒汽车公司的创建者华德·克莱斯勒并没有一筹莫展，他将人数众多的销售对象想象成一个人，这个人身上集成了所有顾客的心理共性，也就是说，他是以一个具体的、典型的顾客为对象，然后综合考虑这个典型顾客的客观观点、虚荣心、道德意识和习惯等一系列属性来设计自己的汽车、决定自己的推销方案的。


    华德·克莱斯勒从众多的需求中寻找共同点，然后有意识地将这些共同点放大，从而制造出受大众欢迎的汽车。


    的确，人的需求虽然多种多样、变幻莫测，但是其根本是相同的。只要你掌握了人类需求的共性，那么把握他人的需求就不是一件困难的事情。可是，人的需求到底具有什么样的共性呢？


    人对同一事物的需求总是随着自己获得程度的加深而减少。这是由“幸福递减定律”所决定的。


    生活中，几乎我们每个人都有这样的经历：饥饿的时候吃一个馒头，会觉得馒头非常好吃，很香甜；吃第二个时，会感到满足；吃第三个，会觉得可吃可不吃，吃是为了不浪费；然而，如果还要吃第四个、第五个的话，就会觉得非常痛苦。东西越多，人对它的需求度越低，这跟人们常说的“物以稀为贵”异曲同工。


    这就是“幸福递减定律”。它告诉我们，当人缺少一样东西的时候，得到它，会带给我们极大的喜悦和满足；然而，当我们不缺它的时候，每多得到一件，其满足感和幸福感就降低一点，多到一定程度的时候，甚至让人感到厌烦。


    人的需求是呈阶梯状分布，并且不断上升的。人本主义心理学代言人马斯洛将人的需求分成了五个层次：生理需求、安全需求、社交需求、尊重需求、自我实现需求。这五个需求依次形成阶梯状分布。生理需求是人类最根本最直接的需求，但是给人的满足感小；而自我实现需求是人类最高层次的需求，往往是在前面四种需求都得到满足以后才会去追求，但它带给人的满足感最大，满足这类需求能引出更深刻的幸福体验，达到精神安宁和内在生活的充实。


    每个人都沿着需求阶梯向上攀登，一个需求满足以后，又会有新的需求产生。而新需求的产生有两个决定性因素：一是个体感到缺乏些什么，即不足感；另一个是个体期望得到什么，即求足感。一般说来，当人们有不足感和求足感的时候，就会产生不安与紧张的情绪。为了摆脱这种情绪，就会形成一种内在的自我驱动力去努力追求，当达到以后，随着满足感逐渐消失，又产生了不足感或求足感，进而引起新的需求。如此这般周而复始，不断递进。


    因此，在人际交往中，你可以根据对方的事业状况、经济条件、家庭背景等来判断对方所需求的是什么。比如：一个其貌不扬却是衣着光鲜靓丽的人，他多半非常在乎自己的外形。如果你赞赏他很有气质，势必能够迎合他的需求。相反，如果你用钱去酬谢对你施以援手的有钱人，多半会引起对方的反感。因为，对方此时对钱的需求已经远远低于获得他人尊重、实现自我价值的需求。如果你能备上一份特产，诚意十足地登门道谢，再配以“如果不是你……”“我真是幸运，能够得到你的帮助……”“现在，像你这样有钱又好心的人真是太少了……”之类的话，往往能够让他心花怒放。


    在人际交往中，我们经常需要揣测对方的需求，但不能没有根据地胡乱揣度，而应以人的需求共性为根据，综合考虑对方的个人情况来把握对方的需求。


    ### 2. 人人都期望得到别人的赞美


    在现实生活中，很多人终其一生都在为获得他人的肯定而努力。当一个人获得别人的赞美时会心情愉悦，同时，也对赞美自己的人充满好感。马克·吐温曾经说过“一句精采的赞辞可以代替我十天的口粮。”美国心理学家之父威廉·詹姆斯说“得到别人的赞赏是人性中最本质的渴望。”在人际交往中，恰当的赞美能够拉近人与人之间的距离，为社交带来神奇的效果。如果你想成为一个受欢迎的人，就请真诚地用掌声为他人喝彩，赞美他人。


    古人常说“士为知己者死。”因为别人真诚地为自己的才学喝彩、鼓掌，所以自己愿意将生命都交给对方，这就是掌声和赞美所带来的效果。


    现实生活中，一句赞美之言虽不能够让对方以性命相交，但赞美对方一定能够获得对方的好感。


    不知大家是否听过这样一个故事：


    古时有一个说客，自荐到一个高官家里当门人，高官问他：“你有何才能？”


    说客答道：“小人虽不才，但极能奉承。”


    高官听后摇头说道：“恰好，我平生最不喜人奉承。我倒要看看你怎样奉承能让我受用。”


    说客一听，忙拱手道：“大人说得极是，不才从南到北，闯了大半辈子，但像大人这样秉性刚直、不喜奉承的人的确少见！”


    高官洋洋自得地说：“你真算得上是了解我的人啊！”


    说客就这样赢得了对方的好感，如愿以偿地做了对方的门客。


    由此可见，人们是很难拒绝赞美之辞的。之所以如此，最主要的原因是赞美能满足人们的自我。如果我们能以真诚的赞美去满足一个人的自我，那么任何一个人都有可能变得更令人愉快、更通情达理、更乐于与人交往。美国的一位学者这样提醒人们：努力去发现别人的优点，并为对方鼓掌、喝彩。这样，我们与他人的关系将会变得更加和睦。


    不过，赞美也是一门学问。赞美好，就会发挥积极的效用；赞美得不好，除有助长媚之嫌不说，还会阻碍人际关系进一步发展。因此，赞美他人时，一定要遵循以下原则：


    - 1. 赞美他人要真诚。对他人优点和长处你必须是真心真意地佩服，虚情假意的赞美只能让人觉得你是在嘲笑或嫉妒对方。

    - 2. 赞美内容要具体。因为越具体越有效，越具体越显得真诚。模棱两可、含糊的表述只会让人觉得你虚伪，或者没有鉴别能力。

    - 3. 赞美要间接。间接地赞美可以让自己彻底与献媚、别有用心等划清界限，使效果更加显著。比如：在众人面前，对人说“我相信你，这次就全仰仗你了。”

    - 4. 赞美要显得“无意”。“无意”的赞美更显真实。比如：“我当下就跟他讲，你要是这样，我早就不理你了。你知道，我这个人朋友的要求很高的。”

    - 5. 赞美不能太频繁。太过频繁的赞美一方面会降低对人的刺激效果，另一方面也有谄谀献媚之嫌。

    - 6. 不要在别人明显犯错时去赞美。没有人会认为被人同情怜悯是一件快乐的事情。此时沉默更可取。

    - 7. 不要同时赞美很多人。人与人是不同的，就算具有相同的优点，其优秀程度也有差异。同时赞美很多人，会让相对更优秀一些人有一种你贬低他们身份的感觉，从而破坏了赞扬的积极效果。

    - 8. 不要在你寻求于人的时候才去赞美别人。这样别人会认为你很势利，从而疏远你。


    总之，赞美人越真心越有效。真诚是赞美取得效果的前提。


    ### 3. 用希望激励他人做事


    曾有过这样一个新闻报道：


    在一片没有尽头的沙漠中，阳光剧烈地照射着，空气仿佛都快燃烧起来了。一支探险队正在负重跋涉，他们已经好长一段时间没有喝过一口水了。又走了一段路程，有队员开始瘫在地上，说自己不可能活着离开沙漠了。这时，队长从行囊里拿出一个沉甸甸的水壶，说：“我们一定能活着离开沙漠，我们还有最后一壶水，我们死不了。但是，由于水很少，如果不是快死了，我们都不能喝它。”听完队长的话，队员们从地上爬了起来，继续前进。尽管很渴，但他们谁也没有去喝它。每当感觉自己坚持不下去的时候，就抱一抱装着水的水壶，然后，又继续前进。就这样，一直到他们穿越了沙漠，那水壶的盖子也没有被打开过。事后，队长才告诉队员们，其实那个水壶里根本就没有水，里面装的是沙子。


    然而，正是“一壶水”的希望支撑着他们超越了生命的极限，在如此恶劣的环境中活了下来。


    心理学家从大量的观察事实中发现：那些满怀希望的人，做事往往更有效率，成功的概率也更大；即使在逆境中，他们也更容易从中脱困而出。这就是“希望效应”。


    针对希望效应，心理学家以“你有哪些希望”为主题，进行了一次广泛的调查。问卷分析的结果表明，希望越多的人，往往生活更快乐，事业更成功，即使那些暂时无所作为的人，在不久之后也会取得成就；而那些没有明显的或者较少希望的人则大都平庸、碌碌无为。


    其中，一位富翁的答案是“我没有希望，所有的希望都已经满足了。”原来，这位富翁患了严重的忧郁症，其事业也呈下滑趋势。后来，心理学家对他进行了心理引导，培养他的希望，比如引导他燃起对外孙成才的希望等。经过持续的希望的“煎熬”，这位富翁终于又恢复到年轻时办事雷厉风行的状态。


    所以说，希望是人类生活的动力所在。


    从前，有一老一小两个相依为命的盲人父子，他们靠弹琴卖艺维持生计。


    一天，父亲终于支撑不住病倒了。他自知将不久于人世，于是便把儿子叫到床头，紧紧拉着儿子的手，吃力地说：“孩子，我这里有个秘方，它可以使你重见光明。我已经把它藏在琴里面了，不过你一定要记住，必须在弹断第两万根琴弦的时候才能把它取出来。否则，你是不会看见光明的。”儿子流着眼泪答应了父亲。


    一天又一天，一年又一年，盲人儿子始终把父亲的遗嘱铭记在心，他不停地弹啊弹，他收藏的弹断的琴弦日益增多，而他的名气也越来越响，财富也越来越多。当他弹断第两万根琴弦的时候，当年那个弱不禁风的少年已经到了垂暮之年，变成了一位饱经沧桑的老者。

