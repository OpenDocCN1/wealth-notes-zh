    # **6.从心理上拉近人与人之间的关系**


    人们之间从互不相识，变得喜欢对方、和对方成为朋友，或者讨厌对方、和对方对立起来，真的是一个非常奇妙的过程。那么到底是什么因素在起作用呢？其实，原因是多方面的，但不可否认，距离是影响人际关系亲疏的重要内容。


    美国心理学家克恩曾做过这样一个实验：


    让一位男性同时和两位女性说话，一位女性坐在离他0.5米的地方，另一位女性坐在离他2.4米的地方。等谈话结束后，询问这位男性对谁的好感多一点儿。


    结果显示，男性普遍认为，自己对坐在0.5米远地方的那位女性更有好感。


    1956年，心理学家怀特也做了一件针对相关问题的调查研究。这次的调查研究是针对一个叫派克森林的郊区居民点的友谊模式进行的。


    派克森林的居民到这里定居的时间相差不多。他们住房的外观都很相似，居民住房的位置大都是随机选取的，因此，谁和谁成为邻居带有偶然性和随机性。


    接下来，怀特对这里居民的社交对象和交往频率进行了调查统计。结果他发现，人们的社交活动在很大程度上依赖于邻近性，他们'
  - '[PAGE 29]


    的交往对象几乎都是都离自己家较近的几个街区范围以内的居民。


    由此我们可以得出这样的结论：住得很近的人明显地容易建立友谊，更容易彼此喜欢和吸引，更容易成为朋友。人们常说“远亲不如近邻”，就是这个道理。


    事实上，对人际关系的亲疏产生影响的不仅仅是空间上的距离，兴趣、喜好上的距离也对人际关系产生重要影响。


    在人际交往中，人们往往会因为彼此在某些方面比较接近而感到相互之间更加容易接近；而这种相互接近，通常又会催生彼此之间的亲切感，进而更加乐于接近对方、体谅对方。心理学上把人际交往中的双方由接近而亲密、由亲密而进一步接近的这种相互作用叫做“亲和效应”，也叫“近水楼台效应”。心理学家们通常用“自己人”来形容这种亲和关系。


    心理学研究表明，一个人的外表反映了其内心，服饰、言行、眼神等都在向别人传达着某种信息，让别人读出你是否友善，是否愿意与人交谈。没有人愿意接近一个表面看起来孤傲的人，因为没有人愿意看到自己被拒绝的场面。因此，人们往往乐于去接近那些在他们看起来比较容易亲近的人。


    人们在人际交往和认知过程中往往存在一种倾向，即对于与自己较为亲近的对象会更加乐于接近。人都喜欢待在熟悉的环境里，和熟悉的、和善的朋友交流。这不仅让人们觉得没有危险，而且这'
  - '[PAGE 30]


    种氛围更具感染力。


    劳伦是位来自洛杉矶的经验丰富的女商人。她穿着时髦，讲究品位。因为想放慢生活节奏、得到更多的归属感，劳伦搬到西南部的一个小镇镇。她喜欢这个城市 和这里的居民，但是她感到自己在这里并不受欢迎。她百思不得其解。后来，有朋友给她指出，她
    的衣着谈吐让当地人觉得她是在装腔作势，让人产生一种距离感。于是，劳伦开始改变自己的穿着和说话方式，她穿着很随意的衣服，与当地 人 谈论当地的事情，试着让自己多参加当地人的社交活动，试着让自己看起来更加容
    易接近。慢慢地，她发现自己变得与新邻居和新同事更加容易交流了。


    在现实生活里，人们往往更喜欢把那些与自己志向相投、利益一致，或者同属了某一团体、组织的人视为“自己人”。在其他条件大体相同的情况下，所谓“自己人”之间的交往效果往往会更为明显，其相互之间的影响通常也会更大。因为是“自己人”，所以会感到相互之间更加容易接近。而这种相互接近，通常
    又会使交往对象之间产生亲切感，从而更加相互接近、相互体谅。


    因此，人们要想使自己的热情能够得到对方的正面评价，就应当在交往过程中积极创造条件，努力制造共同点，从而使双方都处于“自己人”的情境中，从而产生亲近感。


    在人际交往中，切忌高高在上俯视众生，那样大家都会远远地 看着你，而不 会真正地与你谈心。只有深人了人心，大家觉得你可'
  - '[PAGE 31]


    亲了，才会与你接近。


    心理学家认为，人缘好的人，他们在有意或无意中利用了心理学上的“亲和效应”，其中关键点是挖掘共同点，成为自己人。就是找出自己与周围人的共同之处，它可以是血缘、姻缘、地缘、学缘、业缘关系，可以是志向、兴趣、爱好、利益，也可以是彼此共处的同一团体或组织。'
