    ## 10. 打造符合对方心意的个人名片


    罗纳德·威尔逊·里根是一位深受美国人爱戴的总统，他迎合选民的手法变化多端而富有吸引力。


    有一次，里根向一群意大利血统的美国人发表演讲，他说每当想到意大利人的家庭时，温暖的厨房就跃入了我的脑海，还有那更加温暖的爱，几乎让我也立刻无比温暖起来。


    “有这么一家人，他们一直住在一套稍嫌狭小的公寓里，不过，他们已经决定搬到乡下大房子里去。


    “有一天，一位朋友来拜访，和这家一个3岁的儿子托尼聊了起来，朋友问托尼：‘喜欢你们的新居吗？’，托尼回答说：‘喜欢！那简直太棒了：我有了自己的房间，我的哥哥也有了自己的房间，还有我的姐姐们也有了自己的房间；可是，可怜的妈妈仍然和爸爸住一个房间，他们都没有属于自己的房间。’”


    这个笑话明显地拉近了里根与当地选民的心理距离，让这些意裔美国人感觉到，里根原来和自己的生活那么接近，进而接受了里根。而里根此举正是“名片效应”的应用。


    前苏联心理学家纳季拉什维利通过研究发现：人们普遍倾向于接受那些态度和价值观与自己相同的社交对象，进而首次提出了“名片效应”的概念。


    所谓“名片效应”，是指在交际中，如果表明自己与对方的态度和价值观相同，就会使对方感觉到你与他有更多的相似性。善于使用“心理名片”，能够促进良好人际关系的建立，“心理名片”的原理在社交场上有很大的实用价值。很多心理学实验都证明了，个体相似性对人际交往有积极促进作用。


    社会心理学家组利姆以一群大学生为对象进行了一项实验：


    首先，他对大学生们进行了一系列的心理测验和生活调查，并根据结果，将让他人喜欢自己的大学生们分为两组：一组具有某些方面的共性，另一组则几乎没有共同之处。


    接着，他让大学生们以组为单位在一起生活。


    一段时间以后，他对大学生们的人际关系情况进行考察。


    结果，特征相似的学生之间大多能彼此接受和彼此喜欢，进而建立起友谊；而特征不同的学生之间，尽管大家朝夕相处，却仍然比较疏远，他们很难相互喜欢，更不容易建立友谊。


    心理学家拜恩也做过这类的实验：


    他按学生们态度的异同来搭配学生，然后让他们出去进行一次半小时的约会。等他们约会结束后，考察他们相互喜欢的程度。结果仍然显示，相似性的确与喜欢程度呈正比。


    大量研究都证实，价值体系、社会身份、社会背景和文化程度等的相似性都能影响个人对社交对象的选择，对人与人之间的吸引具有特殊的意义。


    在人际交往中，应用“名片效应”的具体操作方式是：把自己与对方视为一体，首先向对方传递一些他们所能接受和喜欢的观点和思想；然后再一点一点地将自己的观点和思想渗透和组织进去。这样对方就会因为彼此相似而容易接受。如果不是采用这种循序渐进、点滴渗透的办法，就很可能引起对方的排斥心理，进而使对方排拒自己。


    应用“名片效应”的操作要点是：


    1. 形成一张有效的“名片”。我们要善于捕捉对方的信息，把握对方真实的态度，进而从中寻找出积极的、自己可以接受的东西来制成有效“名片”。


    要想获得对方的有效信息，我们必须通过自己的慧眼来捕捉，利用心理规律分析对方。


    ① 了解对方的简历。在与一个人尤其是重要人物正式接触之前，可以通过他的熟人了解其相关信息，比如：性格、喜恶、禁忌，他的成功史，他最欣赏的自己的特质等。这样，我们才能在正式接触时避其所恶、投其所好。


    美国前总统罗斯福就是这样做的。每次与人首次会面前，他都会翻阅那个人的资料，对其经历、嗜好、感兴趣的问题做一番研究。因此，无论对方是将士、商人、政客还是外交官，他都知道该和对方谈什么。


    ② 通过细节了解对方。一般来说，步伐急促的人，精力充沛、精明能干，热衷于各种挑战；而步伐平缓的人则大都沉稳踏实；正襟危坐、目不斜视者绝大多数追求完美，讲究实际和效率；侧身而坐的人往往性格开朗、不拘小节；敞开手脚坐的人可能具有主管一切的偏好。


    此外，还可以通过对方的服饰风格、语速语调等细节来了解对方。


    ③ 尽量让对方说更多的话。对方说得越多，反映出来的真实一面就越多。从他的话语中，我们可以听出他的喜好、脾气、人生观、价值观等内容。想要对方多说话，就必须能在合适的时候抛出一个让他感兴趣的话题；同时在倾听他说话的过程中，表示赞同，用眼神和微笑牵引他继续。


    当然，想在短时间内了解到足够的信息，进而形成“名片”，方法是多种多样的，落到具体行动中就是“多听、多看、多想”。


    2. 心理名片制作好以后，接下来要做的是：向对方递出自己的“名片”，让对方觉得彼此很相似，展示给对方一个他最容易接受的形象。当然，这也是有技巧的：


    ① 在适当的时侯说出你们的相似之处。其实，世界上每两个人之间都会有相似之处，比如信念、态度，兴趣、爱好，或者是背景经历等，具体地说，职业、地位、年龄、籍贯、专业……总会有相似之处。因此，只要我们要心去找，就一定能找到。而一旦我们指出这些，对方就一定会对我们多几分认同感。


    ② 使用同意策略。心理学家认为，“不”字能够让交流中的两个人顿时产生心理紧张；而同意策略则会给人志同道合的感觉。当然，使用这种同意策略并不是要毫无原则地唯唯诺诺，更不是屈膝地丁谀奉承，它只是达成彼此共识的一种方法而已。


    ③ 使用心理换位法。当我们站在对方的立场考虑问题，设身处地地为对方着想时，那些彼此之间的相似之处就会如雨后春笋一般接二连三地冒出来，而且更加自然、有效。


    人喜欢的是“同类”，是那些与自己相似的人，这是我们在交际中需要时刻牢记的。而对“名片效应”的应用，正是我们与对方获得共鸣、建立彼此间良好人际关系的有效途径。


    ## 第六章 让他人心悦诚服的心理策略


    在人际交往中，彼此产生意见分歧是不可避免的情况，各种争端也往往由此而生。那么，怎样才能消除彼此间的意见分歧、成功说服对手、达成共识呢？与对方唇枪舌剑一番，还是压制对方的不同意见呢？其实，攻心才是上策。通过把握对方心理来选择最有效的说服方式、语言和说服契机，才是让他人心悦诚服的好方法。


    ### 1. 运用他人最熟悉的语言


    在说服对方的过程中，采用对方熟悉的语言往往比较容易成功。


    首先，当你采用对方熟悉的语言来阐述自己的想法和意见的时候，能够使对方迅速理解你的话，有效地接收到你所传递的信息。


    比如，你看到一艘新型豪华邮轮，想要向对方说明它有多么巨大。如果对方是个城里人，那么你可以告诉他，那邮轮至少有 3 个街区那么长。相反，如果对方是个乡下人，你这样说的话，对方可能根本就不理解那到底有多长。而如果你说，那邮轮是他们家最大的那块地的好几倍，他就会立刻知道那到底有多大。


    再则，用对方熟悉的语言来进行说服，比较容易引起对方的心理共鸣，从而使你的见解更容易被对方所接受。


    一次，石油大王洛克菲勒的儿子带着自己的 3 个孩子外出旅行。谁料不近走到碰到了记者，一时间，他们被记者们层层围住，照相机的闪光灯几乎晃花了他们的眼睛。然而，洛克菲勒的儿子并不想让孩子们曝光，这样对于孩子们的成长不利。那么，他应该怎样做呢？是严词拒绝，还是另有他法？事实证明，他不愧是睿智的洛克菲勒的儿子，他并没有直接拒绝记者，给记者难堪，因为他知道，这样做很有可能使记者更加兴致勃勃地在报纸上刊登出孩子们的照片。他问记者，他的孩子是否可爱，然后又说，自己和记者们一样，都觉得孩子是世界上最可爱的天使，作为一位疼爱孩子的父亲，希望孩子们在一个正常的环境下茁壮成长，不希望世俗的名利过早地侵染孩子们纯洁的心灵。


    由于同样都是父亲，记者们非常能够理解他的想法，认为他所说的十分有道理，最后就客气地告辞了，并没有刊登孩子们的照片，尽管这很有媒体价值。


    不可否认，很多时候，如果你一味地说自己独具特色的语言，那么，对方极有可能不明白你在说什么；而且，即使对方明白，也未必就会认可你的说法。相反，如果你能引用对方的生活经验，采用对方熟悉的语言来阐述自己的想法，那么对方会更加容易接受你的看法。


    查尔斯·布朗是全球最大的玻璃工厂——匹兹堡平板玻璃公司的总经理，创业初期，他在明尼阿波利斯经营着彩色玻璃的生意。他像大多数的经营者一样，兢兢业业地经营着自己的事业。不久，他迎来了事业上的转机，有一笔大生意找上门来。如果做成了这笔生意，那么他的事业将会跨越一个台阶。当然，竞争是不可避免的。


    在争取这笔生意的过程中，查尔斯及时了解了对买主的特殊经验。他注意到对方的决策者是美国西部人，于是，他就有意地做了一份粗犷而狂放计划书，从而引起了对方共鸣，成功地争取到了合同。


    著名的探险家拉萨里也是采用这种方式才说服了印第安人帮助他，进而完成了历史上著名的墨西哥湾旅行。一开始，印第安人对他根本不友好，更不用说帮助他了。但是，拉萨里知道，自己非常需要当地印第安人的帮助，于是，他学会了用印第安语以及印第安人常用的特殊语言来与当地人交流，这才改变了当地印第安人的态度，获得了他们的帮助。


    还有，纽约律师界的领袖一约瑟夫·乔特也是采用这种策略一次又一次说服对方的。他在为一所陶瓷艺术学校的学生做演讲的时候，将自己比作“校长手里的一堆陶土”；在钓鱼俱乐部里，就把自己比喻成“被俱乐部的职员放进来的尾鱼”……他总是引用对方的生活经验来阐述自己的观点，用对方最熟悉的语言说服对方，这大概就是他雄辩家的地位多年来都不曾动摇的原因所在。


    优秀的雄辩人才菲利浦斯说过雄辩的第一要点，就是要以听众的经验为“根本出发点。”因此，要说服他人，你就必须引用与对方的经验相似的事实来阐述你的观点。


    ### 2. 采用最让人信服的说话方式


    西汉的韩信，是汉高祖刘邦非常信任的大将。刘邦对他所做出的军事建议总是深信不疑。那么，韩信是怎样阐述自己的建议而使刘邦信服的呢？


    有一次刘邦召集身边亲重大臣，共同评估某位大将军的能力。韩信说：“这位将军至少可以统领 50 万士兵。”高祖刘邦没有想到一个名不见经传的将军竟然有如此能力，于是想知道自己与那位将军相比，谁在这方面更胜一筹。他趋前对众人说：“那我呢？”


    一问之下，几乎所有人都低着头不敢作答，只有韩信波澜不惊地回答道：“以微臣看来，陛下至多能统领 10 万士兵而已。”高祖一听便愣住了，万万不敢相信自已竟然比不上一个将军，对韩信的话产生了怀疑。


    面对刘邦一脸震惊的表情，韩信仍是一派平静地接着说道：“陛下是统将之才，而非统兵之才。”


    就这样，韩信采用两面说服法使刘邦信服了他的话。试想，如果韩信只是说刘邦统兵不如那位将军，那么刘邦必定会因为这种说法否定自我而排斥这种意见；而如果韩信因为刘邦是皇帝就一味地抬高他，也势必很难取信于刘邦，刘邦会认为他是阿谀奉承之流。惟有采用又肯定又否定的说法，才能让刘邦信服。


    然而，值得注意的是，这种两面说服法有效与否是要看对象的，也就是说，两面说服法对于知识水平较高的人更为有效；而对于知识水平较低的人而言，他们更倾向于接受片面的说法。


    在第二次世界大战期间，美国陆军情报教育部为了说服士兵参战，特意准备了两套广播剧本，一套说得比较片面，另一套则是采用了两面说服法。


    通过调查统计发现：高中以下学历的士兵，接受片面说服法的比接受两面说服法的多 15%；而高中以上学历的士兵，接受两面说服法的比接受片面说服法的多 14%。由此可见，人的文化程度越高，就越不容易被片面说服法说服。要想说服他们，采用两面说服法更加容易奏效。


    另外一个能让对方信服你的方法，就是让对方觉得有利可图。


    举个例子：乘公交车的时候，很多人都喜欢挤在门边的位置，这给下车的人带来很多不便。如果司机说：“请大家往车厢中部走，这样对每个人都会更加方便。”那么，通常绝大多数人都是无动于衷的，根本不相信司机说的话，他们会想：“有什么方便，我怎么看不出来？”但是，如果司机说“请大家往车厢中部走，里面还有空位。”那么，大多数乘客就都会相信，下意识得往里而走，去寻找空座位。


    总之，当人觉得有利可图的时候，他会下意识地相信对方的话，这是由人趋利避害的本性所决定的。总之，当他人听了你的话，感觉自己能够有利可图的时候，他的潜意识就会驱使他相信你的话，除非他找到确凿的证据证实你说的是假的。在此之前，对方多半都会倾向于相信你。


    ### 3. 沟通是说服他人的有效途径


    说服，就是说服他人认同自己的观点和想法，并且激励他们给出你想要的东西。说服的前提是，你清楚自己想要什么，同时知道他人的要求，在你和对方的需要之间能找到平衡。


    一位父亲这样提到自己了解女儿的心路历程，以及“知彼”对父女两人深远的影响：


    女儿凯琳约14岁时，对我们十分不尊重，经常出言讽刺、语带轻蔑，她的行为也影响了弟弟和妹妹。


    我一直没采取行动，直到某天晚上，妻子、我及凯琳在我们的寝室里时，凯琳脱口说了一些很不恰当的话。我觉得她实在太闹得不像话，于是大声喝斥道凯琳，你听好了，让我告诉你我们家的规矩！


    我不失其烦地开始长篇大论一番，以为能让她信服，知道应该尊敬爸妈。我提到她最近生日时我们为她做的一切，还提醒她，我们如何协助她考取驾照，还让她开自己的车。我滔滔不绝举出了不少“丰功伟绩”。说完后，我以为凯琳大概会对我们叩拜一番，感激涕零，谁知，她竟有些挑衅地说：“那又怎么样？”


    我气炸了，愤怒地说：“你给我回房间去，我们真是不想再管你了。”凯琳冲出去，摔上自己的房门。我气得在房里踱步。


    然而，冷静之后我突然想到，我并没试着去了解凯琳。我虽无意打击她，但却只站在自己的立场上想问题。这份觉悟扭转了我的想法和对凯琳的感觉。


    半小时后，我来到女儿房间，第一件事就是为自己的行为道歉，我并未为她的行为开脱罪名，仅就自己粗鲁的举止致歉。


    “我知道你心里有事，可是我不知道是什么。”我让她知道，我真地想了解她，最后，我终于营造出让她愿意跟我分享内心不快的气氛。


    凯琳有些迟疑地谈到她的感受：身为初中生，不但要把书念好，又得交到新朋友；她害怕自己开车，因为这是全新的经验，她担心自己的安全；她刚接到一份兼职工作，不知老板对她有何看法；她在上钢琴课，还要教琴，生活相当忙碌。


    最局夫说：“凯琳，你觉得不知所措吧？”问题找到了，万岁！凯琳觉得有人了解她了。在面对这些挑战时，她觉得手足无措，所以对家人颇多怨言，因为她渴望家人的关注。其实，她真正想说的是：“拜托谁来听我说说话吧！”


    因此我告诉她：“所以当我要求你尊重我们时，你觉得又多了一件事。”


    “就是嘛！”她说，“又多了一件事！我连眼前的事都应接不暇了。”


    我把妻子拉来，三人坐下来讨论，设法让凯琳简化自己的生活。


    最后她决定不去上钢琴课，也不教钢琴了。接下来的儿星期，凯琳像是换了个人似的。


    回顾过去，我想，凯琳的自信来自我们乐于花时间坐下来了解她，而不是对她说：“好吧，这种行为不可饶恕，不准你出门！”


    在这个例子中，凯琳与父母的争执只是一种表象，她以行为掩盖了心中的优惧，父母若只针对她的行为回应，便永远无法明白她的烦恼。可是，凯琳的父亲放下批评的手段，真心地揣摩其心中所想，当凯琳感受到父亲的意愿，便开始安心追踪自己的心事。一旦理清问题，凯琳也能感受到别人的了解于是，她便会希望获得父母的引导与指示。


    在说服的过程中，要注意以下几点原则：


    1. 你要清楚自己想要什么，同时也知道他人的要求，在你和对方的需要之间能找到平衡。

    2. 如果你不知道你想要什么结果，而对方清楚自己想要的最终结果，你将彼对方所影响。

    3. 在说服别人的时候，切忌融入自己的情绪。在任何场合下的发怒、过于激动、过于高兴和伤感，都会削弱你的力量。

    4. 说服是鼓动而不是操纵，说服是影响，影响是一个优美的过程，如果你把自己想象成一个艺术家那样去理解别人，你会有意外的收获。


    总之，沟通时要让对方觉得自己被接受、被了解，让人觉得你将心比心，善解人意。这就要求你去深入了解对方的内心世界，观察体会，细心揣摩，并采取适当的行动来满足对方的需要，建立信任感，从而使沟通更有成果、更有效率。


    ### 4. 采用 7±2 法则来说服对方


    在西方, 有一个广为流传的谜语, 内容是: 它不是蜜, 可是比蜜还要甜; 它不是毒药, 可比毒药还要毒; 它不是花, 可是比花还要美; 它不是剑, 可是比剑还要锋利。这是什么呢?
    答案是语言。


    语言是人与人进行交流的主要工具, 对人际关系的好坏有着极为重要的影响。生活中, 会说话、嘴巴甜的人总是很受欢迎; 说话没有条理、不分主次、不看对象的人, 总让人反感或者印象不深。而对语言的一个基本要求就是要有条理,
    说也有条理才能给人留下深刻的印象。


    有 A、B 两位应聘者, A 自我介绍说: “您好, 我是 X X 学校 X X 专业毕业的本科生 X X。很高兴认识您!” B 说您好, 我叫 X X,
    我的专业是 X X, 我是 从 X X 学校毕业, 学历是本科。很高兴认识您!”


    人们能够记住并能够对其产生良好印象的一般是 A。因为 A 的语言表述条理清晰, 主次分明, 让人很容易记住他想要表达的信息。相反, 人们对 B 的印象通常是“不知所渭”,
    然后很快将这个人忘得干干净净。这就是语言条理性不同而产生的差别。


    由此可见, 在人际交往中, 我们一定要尽可能地使自己的语言有条理。


    1961 年, 心理学家默克多做了一个关于语言条理性的实验:


    他准备了3组试听材料:第一组是普通的、随机选取的3个英文字母,如PTK;第二组是由3个英文字母组成的单词,如HAT(帽子);第三组是3个英文单词,如EAR(耳朵)-MAN-(男人)-BED(床)。接着,他将这3组资料分别放给试听人员听。最后测试试听人员对它们的记忆情况。


    结果发现:试听人员对第二组的记忆情况是最好的;而对第一组和第三组都相对要差很多。观察3组材料的区别,测试者发现,第二组对大多数人来说都是一个完整的信息块,而第一组和第三组则是3个信息块(信息块是指我们不熟悉的、较小的信息单元按照某种固有联系组合起来的、我们熟悉的、具有意义的较大的信息模块)。


    这个实验说明,语言的条理性与人们将信息单元组合成信息块的能力有关。不同的人由于知识经验不同,对同一材料组成的信息块的归纳、定位也可能不同。比如,以“产品项目管理”为例,刚识字的小学生认为它是6个信息块,每个字是一个信息块;一般成人往往将它看作两个信息块—“产品项目”和“管理”;从事管理等相关职业的人则认为它仅仅是一个信息块——专有名词“产品项目管理”。


    在此基础上,著名心理学家米勒又做了一个关于信息块广度的实验:


    从1~9中随机抽出7个数字,比如“2、7、8、3、6、5、9”,报给被试者听。然后,要求他们进行复述。结果,几乎所有的被试者都可以准确无误地把这7个数字复述出来。


    接下来，米勒增加了数字的个数，却发现，被试者能复述的仅仅是前面7个数字，而后面的他们都不记得。


    通过一系列实验的验证，1956年，米勒正式提出了“7±2法则”。米勒认为：大脑在短期记忆中对“信息块”的接纳范围是5－9个，而大多数人的上限是7。


    “7±2”法则是对人类能力的客观总结。那么，我们在与人进行语言交流的时候，要尽力将信息块的数目控制在7±2的范围内。如果想要在极短的时间内传递给对方许多信息，并且要确保其信息传递有效，我们就需要对自己的语言做如下调整：


    1. 使信息块包含的信息最大化。将尽可能多的信息用尽可能少的信息块表达出来，能把信息块的数目控制在“7±2”的有效范围之内。

    2. 将最重要的信息块放在最前面。人对最前面的信息块往往具有最深刻的印象，因此我们要将重要的放在前面说。

    3. 控制好信息块的个数。在社交场合中存在很多干扰因素，比如噪声、杂事等，使对方的注意力不够集中，会导致只有两三个信息块能够被他们记住。


    我们掌握了这些技巧，说话就应该比较有条理了。但是，现实和理论往往是有差距的，而消除这个差距的唯一途径就是训练自己。

