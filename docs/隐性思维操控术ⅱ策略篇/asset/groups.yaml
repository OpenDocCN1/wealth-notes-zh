    ## 第七章 争取他人的积极帮助的心里策略


    都说“多个朋友多条路”。不可否认，获得他人的帮助是人们进行社交的主要目的之一。可是很多时候，即使你积极也与人交往了，也未必就能够获取他人的帮助。事实上，他人之所以愿意为你效力，是因为这让觉得愉快。那么，怎样才能将帮助你变成一件使对方觉得愉快的事情呢？本章将为你讲述如何让他人心底纯洁美好的想法和愿望自然流露，进而让他帮助你、与你合作的窍门。


    ### 1.让他人按照你的心意去办事


    威廉·鲁道夫·赫斯特是一位非常著名的出版商，他拥有23家报纸、12家杂志。然而，他当初也仅在旧金山拥有一份报纸而已。


    有一次，恰逢著名漫画家纳斯特来到旧金山，而赫斯特当时正在进行一个非常重要的计划:他想在自己的报纸上刊登一些东西，以此来发动人们敦促电车公司在电车前面装上保险杠，从而提高乘坐电车的安全性。当他听到纳斯特来旧金山时，他立刻想到，如果请纳斯特画一幅相关的漫画刊登在报纸上，一定能引起人们对此事的普遍关注。


    然而，事实上，纳斯特替他画的第一幅画却并不怎么让他满意。那么，怎样才能使这位著名的漫画家心甘情愿地画出符合自己心意的画呢？为此，赫斯特一直思考着。


    这天晚上，赫斯特与纳斯特共进晚餐，赫斯特对纳斯特的那幅漫画大加赞赏一番，之后他又接着说这儿的电车总是出现事故，已经让许多孩子成了残疾、甚至失去了生命。有时候，我觉得那些电车就像吃人的妖怪一样，在街道上横冲直撞，视人的生命于无物。”


    听赫斯特说到这里，纳斯特突然跳了起来，大声地叫道天啊，先生，我突然有 了一个更好的构思，我保证能画出一张更加出色的漫画。请你把原来的那张撕掉吧，我重画一张。


    于是，纳斯特兴高采烈地回到宾馆里，开始挥毫作画，直到深夜。第二天，他果然送来了一幅符合赫斯特心意的杰作。


    赫斯特在闲聊中，不动声色地自己的想法说了出来，借用这种暗示将想法传递给对方，让对方接纳了自己的创意。而在对方看来，还以为是自己灵感突发，发现了一个绝妙的构思，从而高高兴兴地按照赫斯特的心意做事情。


    由此可知，如果让对方相信，一切都源自于他们自己的创意或想法，而并非是沿袭他人的思路，那么就能够满足对方的“自尊心”和成就感，进而调动起他行动的积极性，让他心甘情愿、高高兴兴地按照你的想法去做事情。而那些总是能让他人替自己效力的人，无一不精于此道。


    林肯主持白宫期间，有一位非常有能力的政治家叫查尔·撒姆纳。像许多有才华的人一样，查尔有些恃才傲物，想让他为谁效力可不是件容易的事情。然而，林肯用了些技巧，很巧妙地利用了他的虚荣心，让他相信，那些内阁的议案在很大程度上是出于他的谋划，以此来获得查尔对议案的极力推崇，从而使议案得以顺利的实施。后来，格兰特继任林肯做总统，由于不善此道，他对查尔·撒姆纳简直就是无计可施，很多时候都不能获得查尔的支持。


    无疑，要认可并按照他人的想法来行事，这多少都会让人心里产生不适感，尤其是当他人的想法、创意或者计划比自己的想法还要好的时候。因此，如果想让对方执行你的计划，不妨采用一些技巧，使其产生“计划是出于自己”的错觉，让他在不知不觉中、高高兴兴地去做那些你想让他做的事情。


    ### 2. 激发对方的欲望


    作为卡耐基钢铁公司的首脑，卡耐基和加里都曾希望作为金融界巨擘的皮尔帕特·摩根能够以巨资来收购卡耐基钢铁公司，这样他们将获得巨大的利润。令人惋惜的是，他们都未能成功地说服摩根。


    后来，什瓦普出任卡耐基钢铁公司的CEO，卡耐基便把这个任务委托给什瓦普。什瓦普，这位精于攻心之道的总裁成功地说服了摩根。那么他是如何做的呢？


    以智巧著称的什瓦普首先设计了一个让摩根无法拒绝的、倾听自己阐述信息的机会。然后他用了一个人们非常熟悉的心理策略，达到了自己的目的。


    什瓦普被纽约的多位银行家邀请出席一个宴会，于是他就告诉这些银行家，自己非常仰慕摩根先生，希望能够在宴会上与他见上一面，请他们一定邀请摩根先生出席。


    在宴会上，什瓦普做了十分精彩的演说。他对自己所从事的钢铁行业的美好未来进行了展望，描绘了一幅让人神往的前景图。同时他还指出，公司与公司之间的合并将会成为一种商业主流，因为这种合作方式除了能够增进效率、促成良性竞争之外，更重要的是，它能够
    为发起人创造巨大的财富。当然，他并没有露出演说是专门为摩根而设的痕迹，而是很客观地讲述了合并公司带来的巨大收益。


    什瓦普才华横溢、口若悬河，他所讲述的那种收益根本无法让人抗拒。果然，摩根也同样被这巨大的收益前景所吸引，在宴会后立刻找到他了解情况。当什瓦普解答完摩根的几个问题以后，摩根毅然地以
    4.92 亿美元价格买下了卡耐基钢铁公司。就这样，什瓦普促成了一家拥有数亿资金、规模庞大的美国钢铁公司的诞生，而他也成了这家公司的总经理。


    什瓦普之所以能够成功，是因为他成功地激起了摩根的想象力，强化了摩根对金钱的欲望，从而完成了有史以来最重大的收购。


    与什瓦普相同，横扫欧洲大陆的拿破仑也使用了同样的策略，收罗了很多意大利士兵跟随他，为他效命。


    面对一群衣衫褴褛、饥肠辘辘的意大利士兵，为了能让这些人听命于自己，这位年仅 25 岁的法国将军对他们说：“兄弟们，现在，我将把你们带到世界上最富足的地方去，那里到处都是繁华的都市和富饶的乡村，在那里你们可以吃到美味的面包、香气满溢的烤鸡，再也不需要过衣不蔽体、食不果腹的日子……”就这样，拿破仑激起了士兵们的衣食欲望，从而使士兵们心甘情愿地跟随他。


    在占领米兰之后，这些士兵在衣食上都得到了满足，他们最强烈的欲望也不再是吃穿。于是，拿破仑又开始在他们的“自尊心”上下工夫，他用诸如“历史的 创造者”、“家乡的英雄”、“亲人引以为傲的勇士”等充满激情的词句激发了士兵们建功立业的欲望，进而效命于他。


    在埃及的金字塔下，他鼓舞士兵说弟兄们，四千年的历史都在等着你们！”类似这样的话，激起了士兵们想要成为历史主宰的欲望，进而产生了和他一起去战斗、共同成为古今无双的英雄的愿望。


    在进攻莫斯科之前，他又鼓动士兵们说：“弟兄们，攻破了一座城，我们就能拥有丰富的供给和舒服的防寒营房了，然后，我们就可以带着荣誉凯旋，就可以回到家乡与亲人共享天伦了。他所说的这些正是士兵们最想要的，自然他们就肯为他效命了。


    无数的事例都指出这样一个事实，即拿破仑非常擅长将自己的军事计划和士兵们的欲望密切地联系在一起。他利用“欲望”的咒语让士兵们为他效力。


    因此，当你想让动劝做某件事情的时候，你应该首先想办法刺激他去做的欲望，然后再进行一定的诱导。比如，如果你想让一位朋友和你一起去露营，你就可以对他说：“我对森林实在向往极了。到了那里，漫步在广阔的天空下，坐在清澈见底的小溪边听水流动的声音，在青草的清香中人睡，在篝火旁闻食物的香味……这是多么惬意啊！”


    总之，将对方的欲望与你想让对方去做的事情联系起来，是一种非常有效的心理策略。


    ### 3.给予对方一个头衔


    虽然头衔是虚的，不能增加人的经济收益，但却可以在极大程度上满足人的自我成就感。很多人都通过给予对方一个光辉闪耀的头衔来获得对方的鼎力协作。


    斯坦梅茨是一位拥有异常敏锐的观察力和无法估计的才能的人。然而，在他就任通用电气公司的行政主管时，他所管理的事务却乱作一团，因此，他被撤消了行政主管一职，而担任顾问兼工程师。那么，怎样才能使这样一个事业上受挫的人不遗余力地投入到工作中、为公司效力呢？


    这时，高层管理人员运用了一些奇妙的驭人策略。他们给予了斯坦梅茨一个耀眼的头衔—“科学的最高法院”。一时之间，几乎公司上下所有的人都都知道：有一个叫斯坦梅茨的工程师非常了不起，他被作为“科学的最高法院”。而斯坦梅茨也极力维护这个头衔所带给他的荣誉，他不遗余力地工作着，创造了很多奇迹，为通用电气的发展作出了极大的贡献。


    头衔是一种公开化的赞誉，面对它，几乎没有能够真正抗拒。头衔能够让许多人激动不已，能够激发他们的工作热情，当然，还能够赢得他们的忠诚。一个小小的头衔真地拥有这么巨大的魔力吗？


    其实，这当中是有其心理学依据的。


    首先，从个体心理学的角度看，当一个人被赋予某种头衔的时候，他对自己的自我认知就发生了改变。潜意识中，他将自己和这种头衔统一起来，如果他不 按头衔的要求去做的话，他就会产生认知失调，也就是自我认知和言行冲突，从而产生心理不适。因此，为了避免认知失调产生，他一定会以积极的言行来极力
    维系头衔带给他的荣誉。


    再则，从社会心理学的角度看，当一个人被赋予某种头衔的时候，实际上是被赋予了某种社会角色。


    著名心理学家津多巴曾经做了一个这样的实验：


    参加实验的志愿者都是男性。津多巴将他们分成两组，一组扮演监狱里的 “看守”，另一组扮演 “犯人”。


    一天下来，几乎所有的参与者都进入了角色。“看守”变得十分暴戾而粗鲁，甚至主动想出许多方法来体罚 “犯人”。而 “犯人”则 “垮”了下来，有的消极地逆来顺受，有的开始积极反抗，有的甚至像个看守一样去欺辱其他犯人。


    人有一种将自身的言行与自己所扮演的角色统一起来的本能，人很难抛开自己所拥有的头衔而做出格的事情。


    作为美国劳工协会缔造者的赛缪尔·冈佰斯就是凭借这个策略走向了成 功。在刚开始的时候，他所面临的困境除了缺少资金之外，还缺少同盟者。为此，他创立了 “民间委任状”，专门对那些愿意组织工会的人授予荣誉称号。采用这种方式，一年之中他就获得了
    80 个人的鼎力支持。从此以后，美国劳工协会的会员数目开始直线攀升。


    横扫欧洲大陆的拿破仑毫不吝啬地创设了许多崇高的头衔和荣誉。他制定 了一种十字荣誉勋章，授予了 1500 多个臣民;他重新起用了法兰西陆军上将的官衔，并将官衔授予了
    18 位将官;他还以“大军”头衔授予那些优秀的士兵…… 他通过给予他人头衔的方式赢得了众人的支持。


    要想获得他人的鼎力支持，给予他人合适的头衔是非常有效的方式，这一点被无数事实反复证明着。


    ### 4.人情投资成本很低，但回报很高


    生活中，很多人深知人情账户的重要性，知道今日的施予正是以后的获得。当他们落难或者不如意的时候，会有很多人施以援手。做人做得如此风光,与储蓄“人情账户”的良好习惯是分不开的。


    人大都会帮助那些曾经帮助过自己的人，为那些曾经给予过自己的人效力。这是因为，从他人那里获得帮助、接受他人的给予，从某种程度上来说是对自我价值的一种否定，会产生一种心理上的不平衡感。为了重新找回自我价值，社会会尽自己最大的力量去回馈对方。


    人情就是财富。经营人情这一无形资本是人际关系学中最基本的策略和手段,也是发利用人际资源最为稳妥的灵验功夫。


    《围城》的作者钱钟书，一生中最落魄的日子莫过于年轻时困居上海“孤岛”写《围城》的时候。那时，由于入不敷出，不得不把保姆都辞退了，由夫人杨绛亲自操持家务。虽然，为了生活，钱钟书的写作动机带有商业性，但他
    500 字天的精工细作，却跟不上商业性写作速度的要求。后来，全靠导演黄佐临推动公演了杨绛的四幕喜剧《称心如意》和五幕喜剧《弄假成真》，并及时支付了酬金，才使钱钟书夫妇尽快渡过了难关。


    许多年后，电视剧《围城》开拍，黄佐临之女黄蜀芹独得钱钟书亲允担纲该剧导演。


    也许，有的人会说：“怎么就能肯定对方一定会还你的人际情？这年头，秋后不认账的人太多了。”是的，对方会不会还人情是个未知数，但是可以肯定的是一你不做人情储蓄，就一定无所获。如果对得失斤斤计较，不肯帮助人，这样的人是可悲的。撇开他在关键时刻可能会得不到帮助不说，也丢开社会对他的评价不谈，就其自身而言，他也会让自己成为一个可悲的人。


    有这样一个故事：


    越战结束以后，一个士兵打完仗回到美国国内，在旧金山给他的父母打了个电话，说他想带一位朋友回自己的家。他的父母很高兴地答应了。可当父母听说他的朋友是一个失去了一只胳膊和一只腿的残疾士兵而且急需人照顾的时候，他们又对儿子表示抱歉，只答应给那位朋友寻找一个可以养伤的住所。儿子坚持要让朋友跟自己在一起。这时父亲生气了，严厉地说孩子，我不知道你在说些什么，你有没有想过这样一个残疾人会给我们生活带来多么沉重的负担。我们有自己的生活，不能因为这种事干扰我们的正常生活。我想你还是自己赶快回来吧，赶快把这个人忘掉。他自己会找到活路的。”


    就在这个时候，儿子挂上了电话。


    此后，这对父母再也没有得到儿子的任何消息。后来，他们接到旧金山警察局打来的一个电话，被告知他们的儿子坠楼身亡，经警察局认定是自杀。


    悲痛欲绝的父母乘飞机抵达旧金山，并被带到陈尸所辨认儿子的尸体，他们认出了儿子，但惊愕地发现：他们的儿子失去了一只胳膊和一只腿。


    储蓄人情绝对是人际交往中不可缺少的。那么，具体应该怎样去做才算是有效地储蓄了人情呢？在帮助别人时，我们要掌握以下基本要领：


    - 1. 帮助别人时不要说得过于直露，挑得太明，以免令对方感到丢了面子、脸上无光。如果已经给别人帮过忙，更不要四处张扬。

    - 2. 帮助别人不可一次过多，以免给对方造成还债负担，甚至因为受之有耻 而与你断交。

    - 3. 作为领导，要培养下属对你的感情依赖，让他们心甘情愿为你效力。

    - 4. 给人好处还要注意选择对象。有些贪得无厌的人，你帮他的忙，说不定还会反咬你一口。


    帮助别人分为两种：一种是雪中送炭，一种是锦上添花。二者都可落得人情，但两者之价值却有天壤之别。雪中送炭是救人之生死、济人于危急，就好比给一个即将渴死的沙漠旅人以清泉；而锦上添花则好比给富人以金条。两者给人带来的心理满足天差地别。因此，我们应该去帮助那些真正需要帮助的人。


    ### 5.利用“欠情”心理使对方难以拒绝


    推销界广泛流传着这样一句话推销员要靠腿脚赚钱。”也就是说，推销员往往屡遭拒绝，却仍要坚持不懈、越挫越勇地去拜访客户。“我是不会购买你推销的产品的，你来多少次都没有用。”面对客户这般不留余地的拒绝，推销员仍然要强打精神、面带微笑地回答：“没关系。希望您不要介意我多次拜访您，因为这是我的工作，所以，我还是希望您能听我给您介绍一下产品信息，也许以后您会有需要的时候……”如此五六次之后，对方大概也就不会再拒绝了。


    然而，无论多么乐观、坚韧的人，被人拒绝的次数多了，仍然难免泄气和难过。实际上，对一些经验丰富的推销员来说，屡遭拒绝的情况很少发生。那么，这些推销员是怎样做的呢？他们采用了什么办法使人们无法拒绝呢？


    推销员总是在极其实不适合出门的日子里拜访客户，要么冒着倾盆大雨，要么顶着炎炎夏日。在那样的日子站在客户的门前，对方所感受到的诚意、心中的同情和感激之情都会更加强烈，从而使得对方难以拒绝。


    以上的两种方法，就其根本而言，都是有效利用了人们“心理借债感情”的心理学原理。当自己一次又一次冷酷地拒绝他人，他人仍然和颜悦色地、一次又一次地来访；当他人冒着大雨来拜访自己的时候，很多人都会对对方产生一种心
    理负疚感，从而无法拒绝对方。


    心理学家指出，人对于人际关系都有一种平衡的需求，也就是说，在人际交往中，当对方的诚意、付出、态度等表现得比自己好太多的时候，自己就会产生一种“欠情”的心理，为了摆脱这种心理带来的不适感，人就会调整自己的态度和行为来找回平衡感。


    因此，在人际交往中，你完全可以使自己的诚意、情谊放大一些，激发起对方的“欠情”心理，使得对方无法拒绝为你效力。那么怎样才能使自己的诚意和情谊放大呢？


    方法其实并不复杂，只要你迎着“困难”和对方交往、让自己看起来“不容易”就可以了。为了获取对方的较大让步，你要千方百计地不断在对方的心中累积小的心理负担。


    很多新闻记者都深谙“夜访朝取”的采访法门。当他们对某项大事件进行追踪时，往往会以事件关键人物的家为目标，在他们那里守候至深夜或清晨，在所有人都休息的时候工作，从而给对方造成一定的心理负担，使得对方难以拒绝自己的采访。这往往比盲目地蛮干和纠缠有效得多。


    在日常生活中，我们不妨借鉴一下推销员和新闻记者的“做法”，或许可以使事情进展得更加顺利。比如说，选择一个星期日，穿戴得体地去对方家中拜访，诚挚地请求对方。只要对方力所能及，通常是不会拒绝为你效力的。


    ### 6. 恰当的反馈能使对方更加积极


    心理学家赫洛克曾做过一个有关反馈的著名的实验：


    他把 106 名四五年级的小学生分成四个组，让他们每天练习相同的数学题目。当然，不同的组练习后，所受到的“待遇”是完 全不同的。


    - 第一组为受批评组，每次练习后，都挑出学生们的错误，并严加 批评。

    - 第二组为受表扬组，当学生们练习完以后，针对他们不同的良 好表现予以表扬和鼓励。

    - 第三组为被忽视组，对这组的成员，既不批评也不表扬，只让其 静听其他两组挨批评和受表扬。

    - 第四组为控制组，这组和前三组是隔离的，并且也不会得到来 自于外界的任何评价。


    一段时间后，赫洛克对四个组的练习效果进行了考察，结果表 明：控制组的练习效果是最差的。而在前三组中，被忽视组的练习效 果明显低于其余两组。而在练习效果相对较好的受表扬组和受批评
    组中，受表扬组的练习效果最好，并且呈现不断上升的趋势。


    由此可见，不同的评价对学生们的活动效果有着不同的影响， 而没有评价是 最坏的情况。其实，评价就是对他人活动的一种反馈，而所谓反馈指的是行为者对自己行为结果的了解，这种了解能够强化先前行为的作用，从而使行为者更加积极地做出类似的行为，提高行为的效率，这一现象，被心理学家称为“反馈效应”。也就是说，给予对方合适的反馈信息，能够使他更加积极地努力。


    著名心理学家多湖畔曾经讲述了这样一个故事：


    有一个管理者想要解雇一个职员。不过，这位管理者并没有像大多数人一样，直接通知职员“你被解雇了”；而是采用了一点儿心理技巧，让这个职员主动申请离职。这位管理者的做法是：无论这位职员将工作做得怎样，管理者都不置一词，完全把他当成了一个“透明人”。就这样，没多久，这位职员就主动辞职了。


    由此可见，一个人的活动没有办法得到他人的反馈，会极大地打击他的活动积极性。因此，如果你想要他人积极地为你效力，那么你就一定要给予及时、恰当的反馈，这样才能使对方保持积极性。


    生活中，反馈效应是普遍存在的。我们应该记住：有反馈比没有反馈好，正面反馈比负面反馈好；即时反馈比远时反馈的效应更大。而作为管理者，想让团队成员积极地为你效力，以下几点是值得注意的。


    1. 在活动的过程中，及时地进行自我反馈，即自省，避免盲目性，找到最佳的方法。


    2. 重视别人所做的评价，结合实际情况客观地进行自我总结，


    3. 正确对待自己的进步，胜不骄败不馁，始终朝着前方更加远大的目标不懈地努力。


    4. 在团队中建立起合理的反馈制度，及时、客观地对成员的活动进行评价，以保证他们的活动效率。


    ### 7.运用“登门槛效应”让对方为你效力


    在1984年的东京国际马拉松邀请赛上，原本名不见经传的日 本选手山田本一出人意料地夺得了冠军。当记者问他为什么会取得如 此惊人的成绩时，他答道:凭智慧战胜对手。


    当时，许多人都觉得这个偶然获得冠军的矮个子选手只是在故 弄玄虚罢了。众所周知，马拉松比赛拼的是体力和耐力，只要拥有 良好的身体素质和耐力就有可能夺冠，迅猛发力和速度这些条件都
    在其次，更别说是用智慧战胜对手了。


    两年后，意大利北部城市米兰再次举行国际马拉松邀请赛，山 田本一代表日本参赛，再次夺得冠军。于是记者们又请他谈夺冠经 验。


    而山田本一的回答仍然是“用智慧战胜对手”。这一次，记者 并没有在报纸上再挖苦他，然而对他所谓的“智慧”仍是迷惑不解。


    10年后，谜底终于解开了。山田本一在他的自传中说:每次比赛 开始之前，我总要乘车将比赛线路仔细看一遍，并且将沿途比较醒 目的标志记下来，例如第一个标志是一间银行，第二个标志是一棵
    大树，第三个标志是一座红色的房子……这样一直记录到赛程的终 点。比赛时，我以跑百米的速度冲向第一个目标，然后再从第一个目 标开始，以同样的速度冲向第二个目标。这样，40多公里的赛程就被
    我分解成几个小目标而轻而易举地跑完了。刚开始，我并不懂这个

    '
