    可是，别人却告诉他，那只不过是一张白纸，上面什么都没有。


    显然，盲人父亲“骗”了自己的儿子。可是这位过去的盲人小孩、如今的盲人老者，在拿着这张什么都没写的白纸时，非但没有气恼，反而淌出感动的泪水，露出幸福的笑容。这是为什么呢？因为就在知道“秘方”内容的那一瞬间，他突然明白了父亲的良苦用心。他觉得父亲的无字秘方是为了告诉自己一个人生的真请一只有不放弃，不丧失信心，始终活在希望中，才会看到光明。


