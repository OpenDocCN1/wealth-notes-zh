    冠以“无事献殷勤，非奸即盗”之名，进而对你所表达的善意产生排斥，甚至加重心理防备，使得你的善意完全失去效用。相反，如果信息是从第三者口中获得的，对方就不会怀疑其可信程度，因为对方会想：“什么好处也捞不着，他没有必要对我说谎。”因此，借由第三者向对方传递善意，能够使你的诚意显得更加真切、可信


