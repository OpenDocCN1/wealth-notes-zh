    往的经历、现阶段状况、所怀有的心事与接触物结合起来，对照


    考虑，让二者变得吻合，也就是俗话所说的“对号入座”。


    正是由于人的这种心理倾向，算命先生那些可以有各种理解的、


    含糊其辞的话，在去算命的人看来，竟然与自己的情形十分吻合，从


    而产生了各种荒唐的解释。


    也就是说，人们对模棱两可的暗示或抽象不明的接触物的解析'
  - '[PAGE 100]


    和反应往往 反映了其真实的内心世界。有鉴于此，很多心理测验都采用了这一方法，在性格 测验方面有名的“洛夏赫法”就应用了这种原理。


    在人际交往中，你同样可以利用这个方法去探知对方的心理。


    首先,当真实情况还不明朗的时候,你可以通过诱导性的询问来探知对方内洞察他人内心的真实想法。比如:你怀疑朋友最近在谈恋爱,你想要探知事情的真相，那么你完全可以摆出一副“我已经了解事情的全部情况”的神态,告诉对方，“你不用
    再瞒我了，我都看见了，那天你们在XX街区……”这个“XX”要说得对方能够听见声音却又听不清到底是什么。这样，对方就会把自己的真实情况与你含糊糊糊的暗示结合起来，进而在接下来的谈话中无意间说出真正的约会街区的名字。


    其次，你还可以通过“含沙射影”的策略来了解对方的真实情况。比如，一个女人怀疑其丈夫与女秘书之间有暖昧关系，她想要从丈夫那里探个究竟。于是，妻子不动声色，使一切看起来都那么自然，很随便。晚饭
    后，妻子在洗碗，丈夫在客厅看电视，两人像平常一样有一句没一句地说着话。接着，妻子对丈夫说对了，亲爱的，我们老板，知道吧？我觉得他好像在和他的女秘书搞婚外恋。我觉得这样的男人真是……”然后，妻子唯一要做的就是观察丈夫的反应是否自然和正常就可以了。


    此时，如果丈夫真和女秘书有某种关系，他就会认为妻子已经'
  - '[PAGE 101]


    知道了什么，这是在“指桑骂槐”地说自己，从而举止出现异常。


    这种方法的适用范围非常广泛。不过，值得注意的是，你在应用它的同时也要防止对方利用此法探测你的心理。


