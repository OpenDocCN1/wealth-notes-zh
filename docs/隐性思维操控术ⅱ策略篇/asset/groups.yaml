    自己坚持不下去的时候，就抱一抱装着水的水壶，然后，又继续前进。就这样，一直到他们穿越了沙漠，那水壶的盖子也没有被打开过。事 后，队长才告诉队员们，其实那个水壶里根本就没有水，里面装的是沙子。


    然而，正是“一壶水”的希望支撑着他们超越了生命的极限，在如此恶劣的环境中活了下来。


    心理学家从大量的观察事实中发现：那些满怀希望的人，做事往往更有效率，成功的概率也更大；即使在逆境中，他们也更容易从中脱困而出。这就是“希望效应”。


    针对希望效应，心理学家以“你有哪些希望”为主题，进行了一次广泛的调查。问卷分析的结果表明，希望越多的人，往往生活'
