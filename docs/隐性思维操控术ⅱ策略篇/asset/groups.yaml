    ### 第十章 用心理策略解开人际关系的结

    - 1. “同理心”是获得良好人际关系的有效保证

    - 2. 不做单飞的雁，适当从众

    - 3. 感谢对手，因为他是上天的恩赐

    - 4. 化解对方对立情绪的心理策略

    - 5. “背后鞠躬”消除对方的敌意

    - 6. 化解对方妒意的心理策略

    - 7. 适时冷却，有利于解决问题

    - 8. 平息他人愤愤不平的情绪

    - 9. 用幽默化解对方的不满

    - 10. 面对抱怨，理智应对


    # 第一章 心理因素影响人际关系


    人在心情不好的时候，会不愿意与任何人接触；心情愉悦的时候，会觉得每个人都那么可爱；自信的人总是那么有魅力；心胸狭窄的人容易嫉妒、猜疑他人，总是被人讨厌……其实，人际交往的内容是人的思想、观点、兴趣、情感和态度的相互交流，其目的是沟通、协调和建立一定的人际关系，而这一切都是以人的心理为基础的。一个人的心理素质与这个人的人际关系好坏有着直接关系。


    ## 1. 与社会隔绝会对人造成极大的伤害


    1920 年，在印度的某个森林里发现了一个 8 岁的被狼养大的人类孩子——卡玛拉。


    卡玛拉的身体外形与一般人有些不同，她的四肢长得比一般人长；双脚的拇指也稍大；两腕肌肉更加发达。她不会站立行走，不用手脚并用的方式爬行；她喜暗怕光，白天多躲在阴暗的角落里，等到夜间才出来活动，而且每到凌晨
    1 点至 3 点就会像狼一样嚎叫；她讨厌穿衣服，常常粗野地把身上的衣服撕掉；她拥有超乎常人的敏锐视觉和嗅觉，但不会说话；当然更没有理性可言。


    这个 8 岁的女孩，除了外形和人还保持着八九分的一致，其他方面表现出来的与狼并无差异。


    心理学家认为，这是由于卡玛拉从出生以后就长时间远离人类社会所造成的。换言之，人不仅是自然人，也是社会人，若离开了人类社会这个大环境，就不会拥有健康的心理而成为一个真正健康的人。


    卡玛拉被带回人类社会后，经过了很长一段时间的精心护理和社会化培养，才慢慢地表现得比较像正常人。这里提到的“社会化”，是指一个人在社会环境的影响下，积累起社会经验，按照社会所规定的行为规范行事和生活，同时，人积极、努力使自己所处的社会环境更符合要求模样的过程。这是社会和对个体的双向作用过程。


    人的社会化过程从出生的那一刻就已经开始了，直到死亡降临。首先，个体通过与他人的各种接触感受社会影响，掌握了语言和知识经验，学会了建立社会关系，形成了道德观念等，使自己成为一个独立的、完整的社会人。与此同时，个体通过工作、社交、参与社会活动等方式，对社会产生一定的影响。


    人的一生与社会之间有着斩也斩不断的联系。人出生的时候会有医院的出生证明，接下来会登记户口，成年以后会领取身份证，结婚的时候会领取结婚证……这些都是个人和社会紧密联系在一起的最好证明。


    心理学家将这种个体与社会之间紧密联系、不可分割的现象称为社会性规律。倘若个体违背了这个规律，就会陷入太麻烦之中，即使违背只是短暂的。


    《鲁滨孙漂流记》中的鲁滨孙，因为海难而被迫远离人类社会，在荒岛上，他感到生活变得异常艰难。而美国电影《荒岛余生》中的主人公在短暂的离开后回来，发现自己再次适应社会变得如此痛苦，他在公司的职位被人占了，自己的妻子改嫁他人，他一时无所适从，生不如死。


    由此可见，隔断或者再次建立起自己与社会的联系都是非常艰难和让人感觉痛苦万分的事情。因此，与其被动地接受这种联系，不如积极主动地投入到社会化的过程中去，努力地工作，积极地建立与他人良好的人际关系，主动学习外界的各种知识，这样我们一定能够拥有属于自己的幸福生活。


    ## 2. 以积极的心态和人交往


    任何人都无法在与人隔绝的环境中健康生活。换言之，人际交往对人来说，就像空气一样不可或缺。


    人是感情动物，必须时刻进行感情上的交流。在迈向成功的道路上，要想坚持到底，仅仅依靠信念的支撑是不够的，良好的人际关系会使人获得一种强大的力量和热情，在成功时得到分享和提醒，在挫折时得到安慰和鼓励，这必将有助于心理的平衡。


    人从出生后就开始了人际交往。个体在与家人、同伴的交往中积累了社会经验，学到了社会生活所必需的知识、技能、态度、伦理道德规范等，从而适应于社会，取得社会的认可，成为一个成熟的、社会化的人。游离人类社会的个体，身心会遭受严重打击，甚至难以发展成为真正意义上的人。


    人际交往不仅是人类作为“人”生存着的需要，同时也是个人发展的需要。一个人的精力、心力、能力和时间都是有限的，在追求成功的道路上，我们不可避免地需要他人的帮助，因此，要想成就事业，就要善于沟通，建立和谐、良好的人际关系。


    古话说“势单力薄，联络诸侯。”也有经济学者说“实力未够，就自己做车厢，挂人家的火车头。”由此可见合作的重要性。


    在现代社会，分工细化，竞争残酷，单凭一个人的力量很难取得事业上的成功，只有借助众人之力，才有可能创造辉煌的人生。


    2003 年 2 月，撒哈拉沙漠发生了一起 15 名欧洲游客被绑架的事件，在经过 6 个月的历险和恐惧后，其中 14 名游客活了下来，只有德国女游客米歇尔·施皮策遇难。


    对被绑架者而言，此次死亡之旅，与其他游客及绑架者相处、合作显得极其重要。但是，米歇尔个性倔强，拒不合作，这使得她在这个群体中被孤立起来。她不相信任何人，常与其他被绑架的游客发生冲突，而冲突的原因又都是一些鸡毛蒜皮的小事。对于绑架者提出的要求，只有米歇尔不予合作，甚至与同是被绑架的同伴日益疏远，经常一个人躺在毛毯上唉声叹气，自言自语，与旅伴的情感距离日益拉大。绑匪对她不合作的举动视而不见，也不予以惩罚。因为在他们看来，米歇尔在人群中被孤立的，惩罚她也起不到杀一儆百的作用。


    后来，米歇尔无声无息地死了。而撒哈拉沙漠里这一特殊群体（包括绑匪）变得更加融洽，他们彼此相互照应，终于走出了沙漠。其中一人说，他们之所以会这样，是因为他们发现，如果他们不能很好地相处和合作，则事态将会进一步恶化，这对每一个人部没有好处。


    其实，很多事情的完成都离不开群体的力量。没有汉初三杰们的合作，刘邦难以打下天下；没有桃园三结义，卖鞋的刘备又怎能成为三足鼎立中的一方……


    所以说，在通往成功的路上，坚守顽强的态度与执着的精神固然不错，但个人的力量毕竟是有限的。拥有良好的人际关系，学会合作，借助群体的力量，才能使人迅速成功。


    一个人，即使是天才，也不可能样样精通。要完成自己的事业，就必须善于利用别人的智力、能力和才干。一个人开拓自己的事业时，总要遇到自己力所不能及的事情，这时，良好的人际关系会助你一臂之力，为你扫清障碍。


    人际交往是生活中不可或缺的内容，良好的人际关系能够给我们带来快乐、幸福、满足，还能够帮助我们成功，是获得身心健康的前提条件。因此，从此刻开始，不要再说“人际关系一点也不重要，我一个人也可以……”
    不要再消极对待社交，而要以建立良好的、和谐的人际关系为目标，积极也投入到社交之中。


    ![](img/b69d9847e8d39a1178cebda87e1c1cd9_16_0.png)


    ## 3. 自信是社交的入场券


    社会心理学家曾经做过一项大约有 4 万人参与的“个性品质对人在交往过程中的作用”的调查，结果发现：有 82.9% 的人愿意与具备优秀个性品质的人交往，而在他们判定一个人是否具有优秀个性品质时，所做的第一件事就是看他是否自信。所谓自信是一个人感受自己的方式，它包括自我接受程度和自我尊重程度。也就是说，自信是发自内心的自我肯定和相信自己。


    心理学研究表明，当一个人内心充满自信的时候，往往会散发出激情的光芒，吸引他人的目光，从而给人以良好的印象。在人际交往中，自信是个人魅力的一种主要形式，它至关重要，能使人被大多数人所接受。因此，我们应该为自己打造一张独一无二的“自信”名片。自信的人往往有以下几方面的表现：


    - 1. **活泼**。自信的人落落大方、谈吐从容，能让人相信希望，更能给别人带来鼓舞。

    - 2. **坦诚**。自信的人敢于表达自己的感受和意见，即使对于自己的缺点，他们也不避讳。

    - 3. **虚心**。2008 年 6 月的美国《心理科学》杂志公布了一项最新研究成果：现实生活中，外在表现越是低调和谦虚，其内心越自信。

    - 4. **大度**。自信的人不会嫉妒别人比自己好的地方，他们会真诚地表达对别人的赞赏、好感和喜爱，因为他们相信，自己身上也同样有让人欣赏的特质。

    - 5. **轻松**。自信的人能够轻松地面对生活中的种种事件。孔子曾说过“君子坦荡荡，小人长戚戚。”意思是说，君子心底平坦宽广，而小人则犹豫、自卑。


    意大利著名女影星索菲亚·罗兰曾经荣获奥斯卡奖影后、夏纳影后以及奥斯卡终身成就奖，是光芒万丈的一代国际巨星。


    然而，16岁她第一次试镜时，摄影师、造型师、化妆师们都抱怨她的鼻子太长、臀部太大。于是，导演建议她整形，把臀部减去一点儿，把鼻子缩短一点儿。但索菲亚·罗兰并没有像大多数演员那样对导演言听计从。她告诉导演，她觉得鼻子和臀部正是自己的特色，她自己有信心。


    当时，很多人都说她太骄傲，竟然连导演的意见也不听。不过，导演却因此而愈发地注意她，想听听她对此的看法。索菲亚·罗兰自信地说我的鼻子确实与众不同，但是我为什么要和大多数长得一样呢？至于臀部，无可否认，它确实有点过于发达，但那也是我的一部分。它们正是我的特色所在，我愿意保持我的本来面目。我相信“一个人想要被大众接受，就一定要自己先认可自己。”


    索菲亚·罗兰说服了导演并迅速走红，几乎没有人不被她浑身上下散发出来的自信所吸引。2000年，已经66岁的她还被评为“20世纪最美丽的女人”。


    是的，自信可以让我们成为一个魅力四射的人。但是，生活中有那么多的失意、挫折，它们都有可能摧毁我们的自信。因此，我们需要把对自信的培养融入生活的细节中，让它一直成长，永远为我们的魅力人生加分。英国心理学家克尔文·拉依涅尔就如何培养自信给出了
    10 条建议：


    1. 早、中、晚各照一遍镜子，整理自己的仪表，以对自己的仪表放心。

    2. 要想着自己的长处，忽略自己的缺陷。人无完人，不要总把自己的缺陷放在心上。

    3. 很多你认为 是窘态的 状况，可能别人并没有注意到，因此自己也无需过于在意。

    4. 不要总是批评别人。总是指责别人是缺乏自信的表现。

    5. 学会“沉默是金”，不要急于表现自己。多数人喜欢的是听众。因此，当别人在讲话的时候，不要急着用机智幽默的插话来赢得别人的好感。你只要当个合格的倾听者，他们就一定会喜欢你。

    6. “知之为知之，不知为不知。”不懂装懂的行为不但不能保全形象，还会让人觉得你不够诚实可靠。别人取得了成就，不要装作没看到，要给予赞赏，羡慕别人就表达出来。

    7. 为自己找一个在任何情况下都能够陪伴你的朋友，这样，无论遭遇怎样的失意，你都不会感到孤独。

    8. 将走路的速度加快 25%。心理学家通过长期观察发现，昂首挺胸、适当快速行走，能让人的心理状态变得积极自信。长期使用这种“走快 25%”的技术，我们的自信心一定会“爆满”。

    9. 经常当众发言。多发言是信心的“维生素”，能够帮助我们强化和巩固自信心。

    10. 不要让自己处于不利的地位。因为别人的同情也会打击你的自信心。自信能让人成为社交场中的“发光源”。掌握上面这些建立自信的方法，就能够为自己打造出自信这张独一无二的个性“名片”。


    ## 4. 人际关系的和谐需要一颗理智的心


    人时时刻刻都在改变，若自己变了，又怎么能怪别人一时认不出来呢？ 面对他人的误解，我们不能恼羞成怒，否则只会把事情弄得更糟。别人越是误解我们，我们越要用理智去化解。


    大千世界，纷繁人生，谁都有被别人误会和误会别人的时候。


    所谓误会指的是对人的看法与实际情况不符，而无意之中产生的认识上的错觉。一方面，由于自身的言行不够谨慎，言谈行事欠周到、细致、精明之处，致使他人不能准确地领会你的意图，从而产生误会。另一方面，由于每个人都有不同的人生经历、学识、价值观、气质、心境等，对同一件事、同一句话，不同人的理解是不同的。当人们以自己的眼光来看他人的时候，就容易误解他人。


    一旦人与人之间产生了误会而又不能及时化解，那么后果是相当可怕的。除了让双方都非常痛苦、烦恼、难堪之外，甚至可能会引发始料不及的悲剧。比如，当朋友之间产生了误会，如果不及时化解，就有可能使友情破裂，甚至双方由朋友变成仇人。所以，陷入误会的圈子后，必须调整好自己的心态，理智地采取有效的方式予以解除。下面有几点是需要注意的：


    1. 消除自我委屈情绪。出现误会后，总以为自己正确、有道理，而对方简直就是无理取闹、不可理喻；自己是受委屈的人，对方是欺负自己的人。如果怀有这样的委屈情绪，就必定不愿开口向对方

