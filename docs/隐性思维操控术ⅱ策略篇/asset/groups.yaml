    前美国总统麦金利就是这方面的好手。


    在西班牙战争爆发之前，他就用这种方法赢得了一位很重要的、但是时常反对他的国会议员的心。麦金利总统对这位国会议员说：“老兄，这次战争的成败与否，我可只能全靠你了，你是所有人中我最信赖的人。”


    作为一个总统，却表现得如此谦虚，谦虚得完全要依靠对方，这在很大程度上满足了对方的自我优越感。事实上，即使没有对方，总统也依然可以找到他人，对方也非常明白这一点。这样，对方就更加认为他的谦虚难能可贵而更加喜欢他。


    由此可见，要想博得他人的好感，谦虚是必不可少的。值得注意的是，谦虚与自我否定是不同的。美国心理学家卢维斯指出：谦虚是一种美德，真正的谦虚并不是把自己看得很低、很糟，而是完全不想自己。真正的谦虚是不夸耀自己，把自己和别人都摆在正确的位置上，客观地评价自己和他人；盲目地夸大别人而否定自己的能力，或者盲目夸大自己而否定别人，都不是真正的谦虚。那么，怎样做才是真正意义上的谦虚呢？


