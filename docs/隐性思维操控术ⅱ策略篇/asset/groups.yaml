    # **10.从对方的无心之失洞悉其内心需求**


    著名心理学家弗洛伊德指出，“错误”的言行，是个体的无意识的心理愿望与要超越这种无意识层的理性判断、义务感、决心、伦理等相互斗争、相互妥协的产物。


    弗洛伊德曾向人讲述了这样一件自己亲身经历的事：


    在一次旅行途中，他邂逅了两位女士，因为彼此聊得很投机，于是便结伴而行。


    这天，他们正顶着火辣辣的太阳在路上行走。有位女士对他说说真的，旅行好像并不是一件多么让人愉快的事情，甚至可以说是自找苦吃。一整天都冒着酷暑日晒不停地走，汗水流个不停，把身上的衣服都浸透了，而且脚也疼得厉害，真让人难受……”她稍作停顿后接着说，“不过，马上就要旅罩了。”


