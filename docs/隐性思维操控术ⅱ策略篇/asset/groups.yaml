    # 5.不做透明人，但要适当地自我暴露


    心理学研究发现，人际关系的好坏与自我暴露的程度有直接关系。所谓自我暴露，指的是在对方面前展露自己私人性的一面。


    人际关系越好，双方对彼此的信任程度和接纳程度越高，自我暴露也越多。可以说，自我暴露的广度和深度是人际关系深度的“探测器”。别人对你自我暴露得越多，说明他接纳你的程度越深。一般而言，自我暴露的程度可以由浅到深分为4个等级：


    +   ①饮食习惯、偏好等兴趣爱好方面的个人信息；


    +   ②个人态度方面的信息，比如对他人看法、对时事的评价等；


    +   ③自我概念以及个人的人际关系状况方面的信息，比如自己的真实情绪、与亲友的关系等；


    +   ④个人隐私，比如性经验、离经叛道的想法、或不愿为人所知的往事等。


    当然，每个人在他人面前的自我暴露程度都是有限的，即使非常亲密的关系，也不太可能完全暴露自己。但是，在适当范围内的自我暴露的确能够拉近双方的心理距离，增加双方的喜欢度。


    一位知名影星因其在新片中的表现欠佳而受到了评论界的指责，他的心情因此而十分忧郁，而不得不去求助于心理专家。


    > “我很担心以后都没有办法再抬起头来，这种可怕的日子，我'
