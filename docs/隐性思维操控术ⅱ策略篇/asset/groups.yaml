    # 7.  探知他人的真实情况


    算命先生、占卜师、问神婆等所谓能未卜先知的人，其惯用的、通用的方法是：不管来算命的人是谁，都先说一堆含糊其辞的话。


    比如，算命先生对来算命的人说：“你的父亲没——死——啊。”


    实际上，这句话是有歧义的，人们可以理解为“你的父亲没死啊”，


    也可以理解为“你的父亲没，死了”。不过，那些父亲仍然健在的人


    倾向于理解为前者；那些父亲已谢世的人则倾向于理解为后者。这样，


    来算命的人就产生了一种错觉，认为算命先生言中了事实，真是未


    卜先知，随后自然就对算命先生的话奉为神旨了。殊不知是因为自己


    的心理在作崇。


    现实生活中的类似的情况还有很多。比如，当别人没有指名道


    姓地评价一个人的时候，我们很容易就把他的评价加在自己的身上。


    心理学家指出，当人与收缩性很大、比较笼统的暗示、话语、


