    # 2.以积极的心态和人交往


    任何人都无法在与人隔绝的环境中健康生活。换言之，人际交往对人来说，就像空气一样不可或缺。


    人是感情动物，必须时刻进行感情上的交流。在迈向成功的道路上，要想坚持到底，仅仅依靠信念的支撑是不够的，良好的人际关系会使人获得一种强大的力量和热情，在成功时得到分享和提醒，在挫折时得到安慰和鼓励，这必将有助于心理的平衡。


    人从出生后就开始了人际交往。个体在与家人、同伴的交往中积累了社会经验，学到了社会生活所必需的知识、技能、态度、伦理道德规范等，从而适应于社会，取得社会的认可，成为一个成熟的、社会化的人。游离人类社会的个体，身心会遭受严重打击，甚至难以发展成为真正意义上的人。


    人际交往不仅是人类作为“人”生存着的需要，同时也是个人发展的需要。一个人的精力、心力、能力和时间都是有限的，在追求成功的道路上，我们不可避免地需要他人的帮助，因此，要想成就事业，就要善于沟通，建立和谐、良好的人际关系。


    古话说“势单力薄，联络诸侯。”也有经济学者说“实力未够，就自己做车厢，挂人家的火车头。”由此可见合作的重要性。


    在现代社会，分工细化，竞争残酷，单凭一个人的力量很难取得事业上的成功，只有借助众人之力，才有可能创造辉煌的人生。'
  - '[PAGE 15]


    2003 年 2 月，撒哈拉沙漠发生了一起 15 名欧洲游客被绑架的事件，在经过 6 个月的历险和恐惧后，其中 14 名游客活了下来，只有德国女游客米歇尔·施皮策遇难。


    对被绑架者而言，此次死亡之旅，与其他游客及绑架者相处、合作显得极其重要。但是，米歇尔个性倔强，拒不合作，这使得她在这个群体中被孤立起来。她不相信任何人，常与其他被绑架的游客发生冲突，而冲突的原因又都是一些鸡毛蒜皮的小事。对于绑架者提出的要求，只有米歇尔不予合作，甚至与同是被绑架的同伴日益疏远，经常一个人躺在毛毯上唉声叹气，自言自语，与旅伴的情感距离日益拉大。绑匪对她不合作的举动视而不见，也不予以惩罚。因为在他们看来，米歇尔在人群中被孤立的，惩罚她也起不到杀一儆百的作用。


    后来，米歇尔无声无息地死了。而撒哈拉沙漠里这一特殊群体（包括绑匪）变得更加融洽，他们彼此相互照应，终于走出了沙漠。其中一人说，他们之所以会这样，是因为他们发现，如果他们不能很好地相处和合作，则事态将会进一步恶化，这对每一个人部没有好处。


    其实，很多事情的完成都离不开群体的力量。没有汉初三杰们的合作，刘邦难以打下天下；没有桃园三结义，卖鞋的刘备又怎能成为三足鼎立中的一方……


    所以说，在通往成功的路上，坚守顽强的态度与执着的精神固然不错，但个人的力量毕竟是有限的。拥有良好的人际关系，学会'
  - '[PAGE 16]


    合作，借助群体的力量，才能使人迅速成功。


    一个人，即使是天才,也不可能样样精通。要完成自己的事业，就必须善于 利用别人的智力、能力和才干。一个人开拓自己的事业时，总要遇到自己力所不 能及的事情，这时，良好的人际关系会助你一臂之力，为你扫清障碍。


    人际交往是生活中不可或缺的内容，良好的人际关系能够给我们带来快乐、 幸福、满足，还能够帮助我们成功，是获得身心健康的前提条件。因此，从此刻开始, 不要再说“人际关系一点也不重要，我一个人也可以……”
    不要再消极对待社交，而要以建立良好的、和谐的人际关系为目标，积极也投入到社交之中。


