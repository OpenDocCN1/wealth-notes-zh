    # 1.做一个受人欢迎的谦虚者


    在社交中，很多人无时无刻不忘给自己脸上贴金。这样固然能够满足自我 成就感，却会引起他人的反感。一方面，沾沾自喜的样子难免让人因羡慕恨;另一方面，这种做法在某种程度上意味着对他人的一种否定，从而使对方的“自我”产生不适感而与之采取抵牾的态度。


