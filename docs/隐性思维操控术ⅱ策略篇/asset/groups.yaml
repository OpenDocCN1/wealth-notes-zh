    # 第十章 用心理策略解开人际关系的结


    有时，不知怎么的，人际关系就成了难解的结，那真是一段让人难捱的时光啊！他人的抱怨、妒忌、敌对……这些都让你苦恼不已。本章为你安排了许多绝妙的心理策略，引导你采用正确的方式去解开这些难解的结。相信有了它们的协助，你就能够游刃有余地处理好这些让你头疼的人际交往难题。'
