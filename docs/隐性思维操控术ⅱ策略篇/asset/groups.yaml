    ## 2. “危言耸听”震慑对方


    一般说来，要想使对方听从你的指示，你在指示对方的时候应该平心静气、摆事实、讲道理。但是，在某些时候，在特定的、非常重要的问题上，带有一定的感情色彩，以可能性为依据，以假设为前提，甚至略带夸张地故意将问题说得非常严重，将后果描述得非常可怕，往往能够给对方“当头一棒”，使他幡然醒悟。


    从效果上看，“危言耸听”能够使对方冷静而全面地考虑问题，避免对方因心血来潮或马虎大意而产生鲁莽、轻率的行为。比如，当教师想要说服望子成龙心切的家长，不要在学业上对子女施加重大压力、不要因为子女成绩不佳而呵叱责骂子女的时候，除了用“榜上无名、脚下有金”、“条条大路通罗马”等诸如此类的道理开导外，还可以把家长的不当做法有可能产生的严重后果明确地提出来。教师可以说孩子的心理承受能力远比我们所想象的要差，即使是这种处于关爱下的严厉也很可能会导致孩子精神的崩溃。前不久报纸上就报道了一个考生因考试没有达到父母要求而不敢回家，最后跳楼轻生的例子。这可都是发生在我们身边的事情啊！”这样就能在心理上震慑对方，让对方充分意识到不遵循教师的指示会产生怎样的后果，进而冷静地检讨自己的做法，调整自己的态度和行为。


    危言耸听，往往能够带给人极大的心理震撼，但即使是危言耸听也必须有理有据、动之以情晓之以理。有一位心理学家曾经采用这种方式成功地说服了一个原本决心自杀的女性。他是这样说的：“活着对你来说已经没有任何乐趣，你对生命也不再有任何留恋，对死亡也不再有任何畏惧，因而你选择了自杀。”


    他直截了当的开场白充满对对方的体谅与同情，言中了对方的心中所想，这在一定程度上引起了双方的共鸣，为后面的说服打下了基础。


    接着，这位心理学家说：“可是，你以为你一定能杀死自己吗？自杀同样存在失败的可能。有一位25岁的青年试用电击来自杀，结果他失败了，他仍然活着，不过他失去了两条胳膊。”


    “也许，你可以选择成功率高一些的方式，那么跳楼怎么样？这方面也许约翰能给你些建议，因为他做过这样的事情。别看他拄着拐杖、一步一顿维艰、好像脑子受损的样子，其实他记得自己跳楼之前是怎么样的，他一直都很怀念那个聪明和富有幽默感的自己。”


    “或者你还可以选一种成功率比较高、即使不成功危害也比较小的方式，也许吃安眠药很值得考虑。可是，看看这个12岁的孩子，他因此而得了严重的肝病，他以后会像许多肝病患者一样在全身慢慢变黄中死去，而且这个过程实在太痛苦了！”


    “没有万无一失的方法，即使是对准脑袋开枪也有失败的时候，我就认识一个这样的人，被死神拒绝后，他整个左边的身子都失去了知觉。”


    “好吧，即使你幸运地成功了，那么你想过谁从地板上擦去你的血迹？谁把你肿胀的尸体从河里捞起来？谁为你整理遗容？你的妈妈？你的儿子？你知道，这样的事情，如果不是爱着你的人，是不会愿意去做的。”


    “我还不得不告诉你的是，从心理学上来说，自杀是一种传染病。你那个可爱的儿子很可能因为你的自杀，在若干年后走上同样的道路。难道这是你想看见的吗？”


    “仔细想想，自杀真地有很多不妥之处，不是吗？也许你可以找到一种比死亡更妥当的处理方式，打一个电话、找找朋友、看看医生，或者去叫警察，总有人能帮得上你的忙……”


    就这样，这位心理医生通过列举一系列悲惨的事例，让对方对死亡产生了恐惧，从而引导对方打消了自杀的念头。虽然他说的一切听起来都那么匪夷所思，但是一切又都在情理之中。


    危言耸听，能够在将对方彻底震撼以后，使对方更加信服你的建议。


    人心，是世上最复杂的东西。当你的温言软语、好言劝说都失去效用的时候，给对方以当头棒喝往往能带来转折性的效果。


    当对方拒绝接受你的指示，不服从你的安排的时候，无论你怎样说对方都听不进去的时候，不妨“危言耸听”一下，在心理上震慑对方，等对方在这种震慑中恢复理智和冷静以后，再循循善诱地给对方讲道理。很多时候，你都需要这样做才能让对方听从你的指示。


    然而，“危言耸听”是不可滥用的。一般来说，只有当事情具有现实紧迫性的时候才能使用。这一点需要切记，否则就难免给人以惊世骇俗和哗众取宠的印象，从而使对方更加不听从你的指示。


    ## 3. 让别人干起来更有劲儿


    从前，有一位富翁家里请了一位手艺冠绝的厨子，“烤鸭”是他的拿手好菜。


    富翁也很喜欢吃厨子做的“烤鸭”，尤其是烤鸭腿，但他却从来没有赞扬过厨子的手艺。后来，富翁连续很多次吃烤鸭，都只吃到一只鸭腿，心里觉得十分奇怪。


    这天中午，厨子把烤鸭端上桌，富翁仍然只找到一只鸭腿，就问厨子：“还有一只鸭腿呢？”厨子回答说：“鸭子只有一只腿啊！”


    “胡说！哪里有一只腿的鸭子？”


    厨子没有说话，只是推开窗子，用手指着不远处水塘。富翁一看，有一群鸭子正在打盹儿，而每只鸭子都缩起了一只腿，只用一只腿伫立，确实只看得到一只腿。但富翁仍不服气，认为厨子是在诡辩，于是两手用力鼓掌，鸭子被掌声惊醒，动了起来。富翁得意地说：“你看，所有的鸭子都有两只腿啊！”


    厨子听了，不慌不忙地说：“那是你鼓掌以后才有的两只鸭腿啊！如果您在吃美味的烤鸭时也能鼓掌称赞一下，烤鸭就会有两只腿了。”


    此后，富翁每次吃烤鸭时，都不忘记真诚地赞美厨子，而他也再没有只吃到一只鸭腿的时候了。


    富翁为什么先前吃不到两只腿的烤鸭，而后来可以呢？这正是激励的效果，以前他没有实施激励，而后来他实施了。


    因此，在一个团队中，优秀的管理者必须要拥有激励下属的心态，这样才能够大大激发下属的工作积极性，达到“让每一个员工都发挥出最大的力量”的目的。这对于员工来说，激励带给他们的是事业的舞台，对于管理者来说，激励带来的是人力资源的充分利用而非浪费。


    那么，管理者应该怎样做才能有效地激励下属呢？最好的方法就是把传统的物质奖励提升到心理激励。


    目前，很多企业管理者往往采用分红、股票期权等物质奖励来激励下属。其一，由于物质奖励用得时间比较长了，下属会逐渐形成“抵抗力”；其二，人类对于物质的满足度遵循边际效率递减规律，也就是说，当人们对物质的拥有达到一定的水平后，他从同等物质中获得的满足感会越来越小，因此物质奖励有其局限性；其三，物质奖励会大大增加人力资源成本。因此，管理者就需要把物质奖励和心理激励结合起来运用。


    事实上，下属也是需要心理激励这种方式的。比如：当下属觉得工作内容枯燥而影响效率的时候，管理者完全可以组织一次工作效率比赛，从心理上对下属进行激励。而心理激励的方式方法也是多种多样的，具体用什么样的方式要视员工的具体心理状况而定。比如，经济不景气的时候，员工就会陷入惶恐不安中，害怕自己被裁掉，害怕公司拖欠自己工资、克扣奖金等，这时，作为管理者就应当及时制定裁员制度和分配制度，并公布给大家知道，让员工不用终日惴惴不安，能安下心来工作。再比如，当员工前期努力地做了很多工作，就差临门一脚就要成功的时候，却胆怯起来，这时，管理者就应该给员工适当的信心和勇气，可以说：“我觉得你做得很好，我想3天不会让勤奋的人失望的。即使结果不尽如人意也没有关系，我们大家可以和你一起承担失败。”


    简言之，心理激励要针对下属的心理状态，他最需要什么你就给予什么，以能解决员工的心理问题、调动起积极性为目的。


    心理激励的方法中，用得最普遍的是真诚、公开地赞美下属。“日本企业经营之神”松下幸之助曾经说过：“赞美比批评更容易使人成功。”


    例如，保龄球比赛正在进行，第一球结束，有两名选手都只打中了7只瓶。选手A的教练对他说：“很好！打倒了7只。”选手A听了教练的赞扬很受鼓舞，心想：下次要做得更完美，把剩下的3只也打倒。


    选手B的教练对他说：“怎么搞的！才中了7只。”选手B听了教练的指责，心里暗想：又被教练骂了，总是达不到他的要求，但愿下次别被骂。


    结果，在后面几轮中，选手A成绩不断上升，而选手B则打得一次不如一次。


    批评会破坏人的心灵平衡，会摧毁一个人的信心，而一个没有信心的人是不可能成功的。但赞美则刚好相反，它不仅能够增强人们的信心，还会给人以巨大的鼓舞，赋予人一种积极向上的力量，让人在愉悦的心情下主动更正错误、弥补过失。


    当然，用赞美激励法的时候，有两点是需要我们注意的：其一，赞美不宜过于频繁，如果下属的心理习惯了，就达不到刺激、激励的效果；其二，赞美的内容要富有内涵、要真诚，切忌空洞、为了赞美而赞美，没有内涵和真诚的赞美是起不到任何效果的，因为对方知道你在说假话。


    通过适当的方法来激励对方，能够大大提高对方的积极性，进而提高其效率。


    ## 4. 期望效应的妙用


    拜托别人、希望别人来拜托自己，对他人有所期望、期望他人对自己有所期望……这是每个人都有的心理状态。拜托别人、对他人有所期望是出于现实的需要，毕竟每个人的能力是有限的；而希望别人来拜托自己，希望别人对自己有所期望，则是实现自我价值的本能需要。当别人来拜托你的时候，你心中会有一股满足感、成就感油然而生，做起事来也干劲十足。


    因此，如果你想要他人听从你的指示，不妨将自己对对方的期望明确地表现给对方知道，因为心理学上有一个非常著名的“期望效应”，它是说，人往往会按照他人所期望的那样去做。


    1960年，罗森塔尔在加州一所学校中做了一个著名的实验来论证“期望效应”。


    那是一年新学期刚开始的时候，罗森塔尔请求校长对两位教师说：“根据以往的教学考察，我认为你们是本校最优秀的教师。为此今年学校特地挑选了一些极为聪明的孩子给你们当学生。但是，为了不伤害到其他的教师和学生，请你们尽量像平常一样教这些聪明的孩子，一定不要让其他人知道你们是挑选出来的最优秀的老师，你们的学生也是被特意挑选出来的高智商的孩子。”


    之后的一年里，这两位教师更加努力地教学。在学年的考试中，这两个班级的学生成绩成为全校中最优秀的，将其他班级远远地抛在了后面。


    接着，校长公开了一个令人惊讶的事实：这两位老师和他们的学生都不是被特意挑选出来的优秀者，而是随机选出的。


    在这个实验中，校长撒了谎，所谓的“天才学生”和“最优秀的老师”其实都是平凡人。但是由于校长的权威性，以致所有人都相信了这个谎言。首先，两位教师相信了它，接着教师又在不知不觉之间通过自己的语言和行为将期望传递给学生——“我期望你们是最优秀的”。这样，无论是教师还是学生，他们的自尊、自爱、自信、自强都被前所未有地激发起来，并且推动着他们去取得成就。


    由此可见，利用“期望效应”来使他人按照自己的意图行事，是一个非常明智的方法。尤其是当你处于对方上级的地位的时候，对下属满怀期望，这种“降级拜托”的行为往往能在更大程度上激发对方的干劲儿，使“期望效应”产生更大的影响。


    绝大多数人都有过这样的经历：当自己的上级对自己说：“我对你的将来抱有很大的期望”或者“我对你很有信心，你一定能将这份工作干好”的时候，心中就会产生一种无法形容的兴奋感，并下定决心，好好干，以免辜负了人家的期望。


    值得注意的是，适度地对他人寄予期望是一件好事，但如果超过他人的能力范围期望过度的话，就会给对方造成沉重的心理负担，令人惶恐不安，进而产生反抗心理。为了避免你的期望产生负作用，需要注意几点：


    - 你的期望需要综合当事人的能力加以考虑，如果是对方根本做不到的事情，就会产生负作用；不过，期望对方解决其力所能及范围之内的适当困难，能够增加对方的满足感；

    - 当对方达到了你的期望，别忘记赞赏他；

    - 如果对方没有达到你的期望，也不要指责他，应给他激励与安慰，顾全他的自尊和自信，这样更有利于你赢得人心。


    给予对方适当的期望，能够满足对方实现自我价值的需求，同时，还能够激发对方的责任感、自尊心、自豪感等一系列积极的心理因素，催促他听从你的指示，并且竭尽全力将事情做好。


    ## 5. 让他人履行诺言的心理技巧


    生活中，很多时候，有的人对于自己承诺过的事情也会推倭。为此，你就会说“可是你答应过……”这类的话，已经不知道说了多少遍了，说得你都觉得烦了，可对也没有履行诺言。那么，应该怎样才能让对方自动自发地去履行诺言呢？


    首先，你要让对方对诺言的履行与否与他的“自我”挂上钩。


    人都希望自己的言行与“自我”形象是一致的，也就是说，人们都希望那个别人眼中的自己与自己眼中的自己是一致的。这是人类与生俱来的本能需求。因此，你可以对对方说“一看就知道你是那种守信的人”、“你总是能让人放心”、“我100%地信得过你”等诸如此类的话，从而替对方建立一个“守信、践诺的自我”形象，激发起对方保持自我行为和自我形象“内在一致性”的心理需求。这是最简便可行的方法。


    然而，生活中，大多数人想让对方履行诺言的时候，常常说的是：“拜托！请你像你说的那样去做，好不好？”、“我就知道事情会变成这样！”当你把对方的形象建立成“不守诺言”的时候，对方就更容易不守诺言。由于没有触及其心理本质，对方只需要寻找借口为自己的行为辩护，就不会感到难受了。


    除了将对方的“践诺”与否与他的自我挂上钩外，与对方进行口头确认也是不容忽视的。


    1989年，美国心理学家安吉拉·力普斯等人通过研究指出，在提醒对方履行承诺的电话结束前，再叮嘱一句：“那就全靠你了！到时候联系我，好吗?”这样做，能够使人履行承诺的概率从62%上升到81%。


    由此可见，与对方进行口头确认能戏剧性地提高“内在一致性”水平，从而增加对方实践承诺的可能性。


    其次，你还可以利用“5步法”来强化对方履行承诺的意愿。也就是说，如果对方的承诺只是随口说说的好意，那么他履行的可能性就很低；为了敲定事情，你得在他的内心推上，运用下面的“5步法”将对方随口说说的意思变成靠谱的承诺。


    - 让他主动说出承诺。虽然都是承诺，但是，你开口要来的和对方主动说出来的绝对是两回事。对方自己主动做出的承诺与其后的“践诺”之间实际上存在一种“行为一致性”的联系，其被实践的可能性会大很多。因此，你可以通过装可怜或者各种旁敲侧击，让他“随口”说出承诺，然后你可以接着说：“真的吗?”、“此话当真?”等，将承诺变成出自他口的、确实无误的话。

    - 确定具体时间。你要和他确定履行承诺的具体时间或者时间段，这样可以防止对方无限拖延，进而使承诺失去效力。比如，他承诺要帮你修理电脑，那么你可以这样说：“太好了，那你什么时候过来？大概要花多长时间修好?”

    - 引发责任感。一个人对一件事情的责任感越强，那么他反悔的可能性就越小。要想让对方履行诺言，你很值得在对方的责任感上下功夫。一般来说，你可以从这两个方面努力，以引发对方的责任感：第一，让他知道你为此事所付出的努力，比如修改原计划等，你可以说“请你确定好来的时间，我好调整我的时间”。这会让他明白，他对承诺的履行已被纳入你的计划之内，并且如果他收回承诺的话，将会引来一场混乱；第二，让他知道，如果他背信弃义的话，会对你造成怎样的伤害，让你陷入多么困难的处境之中。这样才能让他觉得自己履行承诺与否是事关重大的，从而唤起他强烈的责任感。

    - 唤起道德良知。你要善于运用“苦肉计”，唤起对方的道德良知。你应该向对方传达这样一个意思：他是你的全部希望，一旦他失信了，就相当于陷你于“万劫不复”的境地。还是以他承诺帮你修电脑为例，你可以说：“那我就**不找其他人帮忙了，我可全指望你了！我按照你说的时间算来，我还是可以用电脑赶好报告、按时上交的。真的，太谢谢你了!””

    - “见”多也能成“实”。为对方制造一个“他已经在履行诺言”的幻觉，这样能够在很大程度上强化承诺。比如，你想让对方真地能像他承诺的那样，把房子以很便宜的价格租给你住，那么你可以在看房子的时侯问这样的问题：“等我搬过来以后，你觉得我把电视摆在那里怎么样?”“也许，挂上粉色的窗帘，房间会看起来很漂亮。你认为呢?”


    你在努力让对方接受“已经履行承诺”的境况，如果他接受了，那么还有什么能够阻止他“践诺”呢？


    现在，你还觉得让他人履行诺言是一件困难的事情吗？瞧，其实这一点儿也不难。


    ## 6. 利用最后时限给对方设一个困境


    柯英是美国著名的谈判专家，在其担任美国某企业的谈判代理期间，曾和日本某企业进行谈判。这次谈判后，柯英就对日本的谈判术赞不绝口。那么，日本人使用了怎样的技巧，竟然引得这位鼎鼎有名的谈判专家赞不绝口呢？


    当时，柯英与同行的人一到日本羽田机场，就干劲十足地第一个下了飞机。这时，日本企业的谈判代表早已经等在出口处迎接了。日本代表接过柯英的行李，非常有礼貌地领着柯英乘上高级轿车，向着他们早已安排好高级宾馆驶去。日本企业如此面面俱到的款待让柯英非常高兴，也非常感动。在车上闲聊时，日本代表对柯英说：“这些都是我们应该做的。您要回去时，我们同样也会替您安排好到机场的车子，但不知您预定的回程班机是哪一天的？”听到对方这么周到的考虑，柯英心中又是一阵感动，非常自然地就从口袋里取出回程机票，将日期给日本代表看。就这样，日本代表探知到了柯英要在两周后回国，也就是说，谈判事宜必须在两周内完成。


    日本方面，对于顺利探知柯英的最后时限非常高兴。为了让事态能够按自己预期的发展，即让对方按照自己的心意行事，他们总是竭力探知对方的最后时限，而将自己的最后时限视为机密。遗憾的是，柯英完全没有意识到事态的严重性，根本不知道，此时自己已经成了谈判中注定失利的一方。面对对方的如此礼遇优待，他甚至还还有些沾沾自喜。


    接下来，谈判日程按照日本代表的安排进行着。


    在开始的10天里，日本代表对于重要的谈判内容只字不提，每天只是招待柯英到日本的名胜古迹去参观游览，让柯英玩得十分尽兴。等到日本代表提到谈判的时候，已经是柯英到日本的第18天，也就是说，柯英还有两天就要回国了，而谈判必须在这两天之内完成。


    可是柯英仍然没有意识到事态的严重性，这天的谈判因为柯英想去打高尔夫球而不得不取消。


    第13天的谈判又因为日本企业方面以为为柯英举行欢送会为借口而在中途就结束了。直到最后一天，谈判总算是正式开始了。然而，正当谈判进行到关键阶段的时候，又到了该去机场的时候了，高级轿车已在门口等候了。于是，谈判的地点只得从会议室改到了车内。然而，这时，由于时间有限，对于许多重要的问题，柯英根本来不及“斤斤计较”，只要对方的要求不是很离谱，柯英都答应了对方。


    毋庸置疑，在没有更多选择的情况下，日本方面当然是大获全胜。


    一般来说，利用“最后时限”给对方设一个困境，能够击中对方三处心理“死穴”，使他不得不听从你的指示采取行动：


    - 如果没有必要的话，人在行动时往往会能拖就拖，而且还会

