    下些工夫，给我们的情绪也补充一些“营养”。


    ③呼吸疏解。心理专家为我们提供了一种缓解情绪的呼吸方法：把胸口中的气都缓缓吐出；轻轻闭上双眼；慢慢均匀吸气，什么也不要想；憋住气，默数3下；将气均匀呼出，要把胸口的气排得干干净净。在呼气时，想象一切负面情绪都跟着这口气被排出体外，从此和你再也没有关系。


