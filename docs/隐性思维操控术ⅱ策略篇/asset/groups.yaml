    # 第八章 让他人听从你指示的心理策略


    很多时候，人就是一个矛盾的综合体，他拒绝你的同时内心却想接受你；他看起来是一副玩世不恭的样子，其实也可以是一个非常认真的人；他表面上总是和你对着干、不听从你的指示，其实他也可以对你唯命是从……人是复杂的，是多面的，人在他人面前所表现出来的只是自己一个侧面而已。那么，怎样让对方表现出你想要的、积极的那一面呢？可以利用人的多面性及其内部的矛盾性，让他人展现出积极的一面，积极地与你合作。'
  - '[PAGE 245]


    # 1. 怎样让他人行动起来


    在管理工作中，管理者常因为不知如何才能让下属立刻行动起来而感到头疼。其实“欲控其人，先驭其心”，想办法先控制住对方的心，自然就能让对方听从“指令”行动起来，积极地配合你展开工作了。下面这些“劲爆”心理策略几乎可以说是“让对方立刻行动”起来的“万能药”。有了它，以后无论何时碰何人，你都可以成功地让他行动起来。


    1. 缩小选择范围。有些人认为, 应该多给对方选择, 这样他才能够找到自己 所钟爱的, 进而行动起来。然而，事实却恰恰与此相反，人面对越多的选择就越难以决断,
    更不用说行动起来了。


    心理学家认为, 当一个人在做抉择的时候, 往往会因为害怕承担选择失误的 后果而迟迟不敢有所行动。因此，要想使对方尽快地行动起来，你要做的第一件事就是将其可选择的范围缩到最小。这样,
    他能够在最短的时间内作出决定, 并且避免抉择后疑虑、思前想后: “哎呀，我的决定对不对呢，选另外一个会不会更好一些？”进而尽快地行动起来。


    （之） 明确表达期望。心理学中的“期望法则”表明: 他人的期望对人的行为具有很大的影响, 人往往会按照他人的期望行事。因此，如果你希望对方立刻行动起来，你就应该向对方传递你的期望。


    一般来说, 表达期望的方式有语言和行为。除了用语言直截了当'
  - '[PAGE 246]


    地告诉对方你的期望外，你还可以配以与语言一致的行为，让你的期望更加真实可信，从而产生更大的效用。比如，你想让对方跟随你，你就应该用语言告诉对方：你期望对方跟着你，并且你相信对方会跟着你。接着，你再用一致的行动来强化，例如，你大踏步前，不回头去确定“对方是否跟随”。此时，你的一言一行都在传递着你对他的“信心”与“期望”，这样，对方照做的可能性就会很大。


    +   3. 简化行动程序。人在什么情况下会拖延？在什么情况下会迫不及待地采取行动呢？一般来说，对于自己喜欢的、必要的、紧迫的、简单的事情，人会立刻行动起来，而对于自己讨厌的、非必要的、复杂的事情则会拖延。同样，在人的潜意识上，喜欢的、必要的、紧迫的、简单的四者之间在某种程度上是等同的。比如：如果你喜欢烹饪，你就会把这件事看成是有必要在第一时间去做的事情，而且也是非常简单的，无非乎采购、回家、做饭而已；如果你讨厌烹饪，你会认为那非常麻烦，超市买东西要排队结账；风卷残云过后，一大堆的锅碗瓢盆要清洗……简直太复杂了。


    也就是说，想让一个人立刻行动起来，就应该让他觉得事情必要、紧迫、简单，而他是否喜欢则不是你可以随便左右的。因此，简化行动程序，告诉对方你请他做的那件事有多么简单方便，这样他往往就不会拖延。若你想阻止某人做某件事，那么你就把行动的每个步骤一一摊开，让行动的过程显得冗长、无趣、充满了艰难险阻，就可以大大降低他的行动欲。'
  md: '

    道理，我把目标定在终点线上的那面旗帜上，结果跑到十几公里就已然疲惫不堪，并且被前面剩下的那段遥远路程吓倒了。


    山田本一获胜的秘诀就缘于一种“登门槛效应”的心理。很多研究都表明了“登门槛效应”的存在。加拿大心理学家经过研究发现：如果直接提出要求，有 46%的多伦多居民甘愿为癌症学会捐款；而如果分两步提出要求，即前一天先请居民们佩戴一个宣传纪念章，第二天再请他们捐款，则有近
    90%的居民愿意捐款，也就是说，愿意捐款的人数几乎增加了一倍。


    其实，“登门槛效应”不仅仅是对别人有用，对自身也有很大的作用。美国社会心理学家弗里德曼和他的助手在 1966 年曾以实验证明了这一点。


    首先，弗里德曼派一位助手去登门拜访一组家庭主妇，声称他正在为“安全驾驶委员会”工作，希望得到主妇们对这一运动的支持，请她们帮一个小忙：在一份呼吁安全驾驶的请愿书上签名。多数主妇认为这是一个利人利己的事，加上签名个也并不麻烦，所以，大多数主妇们都爽快地签了名，只有个别人拒绝了。


    过了几天，弗里德曼又派这个助手去登门拜访一组家庭主妇，不过，这次他除了拜访第一组家庭主妇之外，还拜访了一些以前从未拜访过的家庭主妇。助手这次带的是一个写着“谨慎驾驶”四个字的大招牌，他的任务是请求那些家庭主妇们把这块牌子竖立在她们各自的庭院里。


    这个招牌看起来很笨拙，竖立在庭院里显得有些不协调。此次要求显然有那么一点点过分，那些被拜访的家庭主妇们究竟是会答应，还是会拒绝呢？


    最终的结果是：那些曾经同意在请愿书上签名（一个小要求）的家庭主妇中，有55%的人接受了在自己庭院里竖这块牌子（一个大要求）的要求，而在那些从未被访问的家庭主妇中，只有1%的人勉强接受了该项要求。


    其实，日常生活中也经常出现这种现象。在你需要得到别人的帮助时，如果你一开始就提出较高的要求，则往往容易被拒绝；而倘若你先提出较低的要求，被对方接受后再去适当增加要求的分量，则成功的几率就会很高。这种现象就是被心理学家定义的“登门槛效应”。


    其实，生活中到处都有“登门槛效应”存在着，比如你正走在繁忙的街道上，两边是数不胜数的服装店，你并没有要买衣服的打算，但是突然有家店门口的售货员对你说“进来看一下吧”，你就会想：“看一下又无大碍，反正也没有别的事情。”于是你接受了对方“并无大碍的要求”，抬脚迈进了那家服装店。这时热情的售货员又说：“喜欢就试一下吧，不买也没关系。”于是你也会想：“既然不买也关系，那就不妨试一下吧。”又一次“无大碍”的小要求被你接受了。当你穿上以后，售货员不失时机地说：“带走一件吧，穿在您身上多合适呀！”你感觉这衣服穿在身上虽然不是非常好看，但是也的确不难看，再加上售货员热情周到的服务，你便不好意思拒绝了。由此可见，循序渐进是攻破人们心理防线最行之有效的方法。


    心理学家告诉我们，登门槛效应之所以能够存在，是因为从心理学上讲，每个意志行动都有行动的最初目标。多数情况下，由于人的动机很复杂，因此人们总会面临各种不同目标的比较、权衡和选择，在情况相同的情况下，那些简单容易的目标往往较容易被人接受。也就是说，当别人提出一个看起来有些“微不足道”的要求时，人们往往可以在心理上予以接受，或有时处于“无大碍
    近人情”的考虑而不好意思断然拒绝。可是，一旦这个“微不足道”的要求接受后，就好比一只脚已经踏进了门槛里，陷入进退两难的境地。通常情况下，人们还会有这种思想：一只脚都进去了，又何必在乎整个身子都进去呢？因此说，一旦人们跨进这种心理上的门槛，就不会轻易做出抽身后退的举动。再加上由于后来的
    更高的要求同之前的小要求有了继承关系，而之前的一系列小要求的被接受使得人们已逐渐适应这种有承接关系的要求，使得人们的心理失去了戒备，从而降低了可能出现的心理判断和对抗。不断接受和服从后，人们便会忽视对方逐渐提高的要求已经大大偏离自己的初衷这一事实；另外，每一个人都希望给别人留下一个前后一致的好印象，不希望别人把自己看做“喜怒无常”的人，因而在接受了别人第一个小要求之后，面对第二个更大的要求时，如果这种要求给自己造成的损失并不大的话，往往会有一种“反正都已经帮了，再帮一次又何妨”的心理，于是“登门槛效应”就发生作用了。


    因此，利用“登门槛效应”能够让你一点一点地获得他人的全力支持。


    ## 8. 巧妙地引导对方的“逆反心理”


    在心理学上，有一个著名的效应叫做“禁果效应”。所谓禁果效应，指一些事物因为是被禁止的，反而更加让人关注，使更多的人更加积极地参与其中。有一句谚语“禁果格外甜”，就是这个道理。


    在古希腊神话故事中，万神之神的宙斯把一个紧闭的盒子交给一个叫潘多拉的女孩保存，宙斯再三严禁禁止她打开。可是，潘多拉见宙斯如此紧张，反而对原本不甚在意的盒子好奇了起来。越想越好奇，最后终于忍不住把盒子打开了。


    结果，装在盒子里的罪恶和灾祸就跑了出来。从此，人间便有了罪恶和苦难。


    宙斯的禁令勾起了潘多拉的好奇心，这才促使她打开了盒子。事实上，“禁果效应”与人的好奇心理和逆反心理有密切的联系。


    心理学家费尼，贝克和辛德兹做过这样一个实验：


    他们在某大学的男洗手间里挂上了两块禁止涂鸦的牌子。一块写着“严禁胡乱涂写！”语气非常严厉，署名为“大学警察保安部长”；另一块写着“请不要胡乱涂写！”语气相对柔和，署名为“大学警察区委员”。


    接下来，他们每隔两个小时换一次牌子，统计牌子被涂写的情况。


    结果发现：相对于写着“请不要乱涂乱写！大学警察区委员”的牌子，写着“严禁胡乱涂写！大学警察保安部长”那块明显被涂抹得更加严重。


    由此可见，禁止得越严、越是权威，人们的逆反心理就越强烈。我们都知道罗密欧与朱丽叶，两家是世仇，两家的子女谈恋爱更是被严禁禁止的，而这种禁止却成了他们爱情的强大助力。因此，“禁果效应”也被称为“罗密欧与朱丽叶效应”。


    “禁果效应”存在是有其心理学依据的。


    一方面是好奇心理，也就是说，与能接触到的事物相比，无法知晓的“神秘”的事物对人们有更大的诱惑力，也更能促进和强化人们渴望接近和了解的诉求。人们对所接受的信息的完整性有着一种潜意识上的期待心理，一旦关键信息被隐藏，人们所接受的信息不完整，就会在心理上形成“接受空白”，这种空白就会强烈召唤被遮蔽的信息来填补空白。这种“期待一召唤”结构就是“禁果效应”存在的心理基础。


    现代社会中，媒体常常利用公众的这种心理来进行影视广告、商品的宣传推广。最早对“禁果效应”加以积极应用的概莫要算法国农学家帕尔曼切了。


    帕尔曼切在德国吃过土豆，觉得非常不错，就想把它推广到法国。


    1787 年，他得到国王的许可，在一块地里栽培土豆，并在白天用一支全副武装的国王卫队看守这块地。晚上，等到人们都睡觉了，警卫才撤离。


    这勾起了人们的好奇心。于是，人们便在晚上的时候偷着挖土豆，然后带回家去吃，结果发现非常好吃。


    得益于“禁果效应”，土豆在法国以让人吃惊的速度迅速推广到全国。


    心理学家认为，自我价值是人的心理根基，任何一个人都不能接受自己无价值地生存在社会上。当一个人被禁止或者严令做什么、说什么的时候，他会有一种自我价值受到损害的感觉，然后，他就开始本能地进行自我价值的保护。这种对自我价值的保护表现在外在言行上，就是在态度或行为上抗拒外界的劝导和说教。


    因此，人们之所以会有“让他往东他偏往西，让他打狗他偏打鸡”的逆反行为，完全是出于一种对自我价值保护的本能。


    在现实生活中，管理者也常常通过正确引导他人的“逆反心理”，来促使下属为自己效力。比如，领导对有能力但是工作不卖力的下属说：“这件事情很有难度，虽然你有能力有才华，但是到时候万一不成功，多丢面子啊。所以，你还是不要参与了……”这样，往往能使下属积极地投入到工作中。


    或许你已经注意到了，这就是人们常说的“激将法”。在与人交往的过程中，适时地采用这种方法，往往能收到意想不到的效果。


    ## 9. 为对方安排一个观众


    心理学中有个非常著名的现象叫做社会促进现象，说的是当有他人在场时，个体的活动效率往往能够得到提高。


    生活中，类似这样的现象到处都是。比如，我们一个人在家看球赛会觉得没有气氛，但在酒吧里与很多人一起看球赛，就会感觉非常投入，情绪也十分热烈；当我们一个人在一条空旷的马路边散步时，如果看到有人在我们身后不远处疾步而行，我们就会不自觉地加快自己的步伐；当我们在买菜的时候，本来我们只打算买一两斤，但是如果这时有人过来要买很多，我们就有可能会多买一些……


    那么，这种现象是什么原因导致的呢？


    心理学家认为，他人在场不仅能够在一定程度上遏制人的惰性，而且由于人无论何时何地都会有获得他人认可的本能需求，为了满足自己的这种需求，我们往往会在他人面前表现出自己最积极、最优秀的一面以获得认可。如果他人碰巧和自己做着同样的事情，心理上就会产生一种竞争感，为了不被比下去，就会形成强大的动力来提高自已的效率。


    总的说来，当有旁观者或是同行者在身边时，就容易激发起个体的一种本能反应，促使个体提高活动标准和效率，促进活动的进行。因此，当你需要对方积极为你效力的时候，你不妨有意识地给对方安排一个观众。


    但是需要指出的是，社会促进也是有条件限制的。对于某些需要人静思或者思考强度很大的活动，他人在场往往会起到适得其反的效果。在日本碧云寺的寺门匾额上，写着“第一谛”四个大字。这几个字写得龙飞凤舞，灵韵非凡，总能够吸引游客驻足欣赏。而这四个大字是泷川大师在第
    85 遍才写出的佳作。


    据说，大约两百余年前，以精于书法出名的泷川大师来到碧云寺。寺里的和尚请他写这四个字。泷川大师答应了他们的请求。


    接着，泷川大师开始写自己的作品，而旁边只留了一名和尚帮自己研磨。不幸的是，替他磨墨的和尚是个颇具眼力并且直言不讳的人。


    在泷川大师写了第一幅以后，这位和尚立刻批评说：“这幅写得不好。”于是，泷川大师又写了一副，问道：“那这一幅呢？”和尚又摇头说：“更糟，还不如刚才那一幅。”


    就这样，泷川反复地写，和尚一次又一次地摇头。寺里的方丈前来询问进展，见泷川大师不在状态，就委婉地提出了要给泷川大师增加润笔费。


    泷川本来就是位一丝不苟的人，面对此种情况，什么也没说，又耐着性子写了第 84 幅“第一谛”。遗憾的是，那位研磨的和尚仍然认为不够好。


    最后，这位“苛刻”的和尚因去厕所而离开。看见他走了，泷川顿感轻松，深吸了一口气，在心无所碍的情况下，一挥而就写出来第85幅作品。那位和尚回来后看见书案上摆着的作品，不由得竖起大拇指，由衷地赞叹道：“神品！”


    为什么泷川大师前面的84幅字写得不够好，到和尚离开了，没有旁人在场了，反而能够写出“神品”呢？这就是社会促进的作用。


    所谓社会促进是指有他人在场的时候，反而使个体活动效率下降的现象。


    那么，什么时候社会促进现象会起作用，什么情况下社会促进现象又会发生呢？


    1933年，心理学家桑普森通过反复试验发现：当有旁观者在场时，个体在做非比较复杂的活动时，效率会降低，比如反驳他人的哲学观点等。


    随后，心理学家达施尔进一步提出，当有人在场时，即使是做简单的乘法这样的活动，个体的出错率也会明显提高。


    经过心理学家们的反复探究，他们发现：对于那些简单的、熟悉的活动来说，往往是社会促进现象在起作用，因为这时，有他人在场，会激发个体竞争的动机，而增强的动机有利于个体加快做事的速度；但如果是个体不熟悉、或者需要个体做一定思考的活动，他人在场虽然会增强动机，但同时也会形成心理压力，使个体陷入紧张和焦虑之中，从而使活动效率减低。


    也就是说，当对方从事的是比较简单的、熟悉的活动的时候，你不仿为对方安排一些观众，以提高对方为你效力的积极性。当你需要对方为你做的是需要经过思考、或者是对方不熟悉的事情的时候则要留给对方一个安静的空间，你只需要适时地关注对方的进度就可以了。


    ## 10. 诚挚地感谢那些帮助过你的人


    有一位父亲正在和朋友讨论生意上的问题，这时，他9岁大的小女儿笑咪咪地走过来，手里拿着自己专门为父亲烘烤的甜饼。因为小女儿打扰了父亲和朋友之间的谈话，所以父亲有点不高兴，便随手拿了一块甜饼，低声斥责了小女儿，然后马上又投入到与朋友的谈论。小女儿伤心极了，拿着剩下的饼沮丧地走了出去。


    几个星期以后，父亲显然已经忘记了这件事情。他已经有一段时间没有看到爱烤甜饼的小女儿烘甜饼了，他问女儿怎么不烤甜饼了。女儿一下子哭了起来，很伤心地说：“我再也不烘甜饼了。”


    从那以后，小女儿从此再也没有烘过甜饼，也绝口不提有关烘饼的事情。而父亲一直为那件事遗憾着。


    的确，积极为他人效力以后却得不到对方的肯定和感谢，是一件非常难过的事情。从心理学的角度说，轻率地对待那些帮助过你的人、不给予对方诚挚的感谢，在一定程度上会伤害对方，否定了对方的自我价值，而寻求自我价值的实现却是人最基本的需求之一。因此，当他人为你效力以后，无论结果如何，你都应该诚挚地感谢他人，否则就会伤害他人。一旦对方因此而受到伤害，就不会再为你效力。在对方给予你帮助之后，回以诚挚的感谢，是获得良好人际关系的前提。


    当然，诚挚的感谢并不是指你一定要给予对方相当的物质回报，而是指让对方感受到：他的努力是有价值的，他的付出对你来说是有用的，他的存在是有价值的。


    1. 一般来说，你可以从以下几方面来表达自己诚挚的感谢：


    - ①及时用言语向对方表示感激。你可以说：“如果不是你，恐怕我……”“真的要感谢你……我才能……”等。

    - ②充分利用肢体语言。球场上队员们常常热烈地拥抱，这是一种相互鼓励，也是一种祝贺，更是一种对默契合作的感激；还有谈判结束后的握手，是一种感激对方友好合作的方式；爱人间情意绵绵的亲吻，不也正是“谢谢你爱我”的一种表现吗？

    - ③间接表达。有的人生性腼腆，不善于用言语或动作表达自己的感恩之心，可以采取一些间接的方式来表达，比如，送一些信件、卡片、小礼物、鲜花等。

    - ④实际行动。投桃报李，礼尚往来。感激对方给予的帮助，就在对方需要的时候，给予更多的帮助；感恩于对方的关怀和爱心，就同样以关怀和爱心作为回报。这样，在报送和往来之间，人情脉络就建立起来了。


    2. 此外，当你感谢他人的时候，还要注意以下几个原则：


    - ①表示感谢要及时而主动，这样才显得有诚意。不要等到偶然碰到对方，才忽然想起应该感谢对方，于是就顺便感谢一下；也不要等到再次需要对方帮助的时候才找上门去感谢对方。这些行为都会给对方带来伤害。及时、主动地向对方致以谢意，是一种十分尊重对方的表示，有助于进一步加深彼此的感情。

    - ②要根据不同的对象，选择恰当的途径和方法。对上面提到的4种表达谢意的主要方法，到底采取哪一种方式最为恰当，要根据为你效力者的身份、职业、性格、文化程度及经济状况等具体情况来选择。选错方式的话，不但不会对你的人际关系有所帮助，而且极有可能带来严重的负面影响。比如说对方是因为看重自己与你的情谊才帮助你，可是，你事后却送给对方一笔钱当做谢礼，这势必会引起对方的反感。显然，这种情况下，你以情感的方式感谢对方才是最恰当的。当然，如果对方为你效力本就是以获得物质利益为出发点，你就应该选择用相应的物质酬劳来感谢对方了。总之，采用什么方式感谢对方不能一概而论，要因人而异。

    - ③要掌握好感谢的度，力求做到合理与恰当。与做其他事一样，感谢他人同样要掌握分寸，过和不及都是不妥的。过分感谢他人，会让他人受之有愧，进而心理失衡，或者会让他人怀疑你的用心；感谢不足，会让对方觉得你不够尊重他，他的价值没有得到合理的评价，从而产生愤愤不平的情绪。要做到合理适度地感谢他人，需要从两方面来考量：对方付出的多少；对方的帮助给你带来的益处的多少。比如，对方虽然给予的帮助并不是很多，但是却给你带来了很大的收益，这时如果你仅仅从对方付出了多少来进行考量，就极可能引发对方的不满。

    - ④感谢他人是一种感情行为，不能像买东西一样做一次性“银货两讫”的处理。也就是说，对那些曾经帮助过你的人，应该尽可能和他们保持长久的联系，让彼此间的情分能够在时间中加深。


    感谢对方是人际互动的一种重要形式，它是对他人价值的肯定，也是你再次获得他人效力的保证。因此，当他人为你效力以后，千万不要忘了诚挚地感谢他。


    ## 第八章 让他人听从你指示的心理策略


    很多时候，人就是一个矛盾的综合体，他拒绝你的同时内心却想接受你；他看起来是一副玩世不恭的样子，其实也可以是一个非常认真的人；他表面上总是和你对着干、不听从你的指示，其实他也可以对你唯命是从……人是复杂的，是多面的，人在他人面前所表现出来的只是自己一个侧面而已。那么，怎样让对方表现出你想要的、积极的那一面呢？可以利用人的多面性及其内部的矛盾性，让他人展现出积极的一面，积极地与你合作。


    ### 1. 怎样让他人行动起来


    在管理工作中，管理者常因为不知如何才能让下属立刻行动起来而感到头疼。其实“欲控其人，先驭其心”，想办法先控制住对方的心，自然就能让对方听从“指令”行动起来，积极地配合你展开工作了。下面这些“劲爆”心理策略几乎可以说是“让对方立刻行动”起来的“万能药”。有了它，以后无论何时碰何人，你都可以成功地让他行动起来。


    1. 缩小选择范围。有些人认为, 应该多给对方选择, 这样他才能够找到自己所钟爱的, 进而行动起来。然而，事实却恰恰与此相反，人面对越多的选择就越难以决断,
    更不用说行动起来了。


    心理学家认为, 当一个人在做抉择的时候, 往往会因为害怕承担选择失误的后果而迟迟不敢有所行动。因此，要想使对方尽快地行动起来，你要做的第一件事就是将其可选择的范围缩到最小。这样,
    他能够在最短的时间内作出决定, 并且避免抉择后疑虑、思前想后: “哎呀，我的决定对不对呢，选另外一个会不会更好一些？”进而尽快地行动起来。


    （二）明确表达期望。心理学中的“期望法则”表明: 他人的期望对人的行为具有很大的影响, 人往往会按照他人的期望行事。因此，如果你希望对方立刻行动起来，你就应该向对方传递你的期望。


    一般来说, 表达期望的方式有语言和行为。除了用语言直截了当地告诉对方你的期望外，你还可以配以与语言一致的行为，让你的期望更加真实可信，从而产生更大的效用。比如，你想让对方跟随你，你就应该用语言告诉对方：你期望对方跟着你，并且你相信对方会跟着你。接着，你再用一致的行动来强化，例如，你大踏步前，不回头去确定“对方是否跟随”。此时，你的一言一行都在传递着你对他的“信心”与“期望”，这样，对方照做的可能性就会很大。


    3. 简化行动程序。人在什么情况下会拖延？在什么情况下会迫不及待地采取行动呢？一般来说，对于自己喜欢的、必要的、紧迫的、简单的事情，人会立刻行动起来，而对于自己讨厌的、非必要的、复杂的事情则会拖延。同样，在人的潜意识上，喜欢的、必要的、紧迫的、简单的四者之间在某种程度上是等同的。比如：如果你喜欢烹饪，你就会把这件事看成是有必要在第一时间去做的事情，而且也是非常简单的，无非乎采购、回家、做饭而已；如果你讨厌烹饪，你会认为那非常麻烦，超市买东西要排队结账；风卷残云过后，一大堆的锅碗瓢盆要清洗……简直太复杂了。


    也就是说，想让一个人立刻行动起来，就应该让他觉得事情必要、紧迫、简单，而他是否喜欢则不是你可以随便左右的。因此，简化行动程序，告诉对方你请他做的那件事有多么简单方便，这样他往往就不会拖延。若你想阻止某人做某件事，那么你就把行动的每个步骤一一摊开，让行动的过程显得冗长、无趣、充满了艰难险阻，就可以大大降低他的行动欲。

