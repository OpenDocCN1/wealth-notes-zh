    # ## 7.别陷入说者无心听者有意的窘境


    很多人都有过被别人的“无心之言”刺伤的经历，在别人看来是平平常常的一句话，却在我们心里激起了千层浪，让我们不痛快。这种旁人一句“无心之言”却弄得我们如此“不得意”的现象，在心理学上被称为“瀑布效应”，即发出信息的人心理比较平静，但收到信息的人却被弄得心理失衡，进而导致态度行为的变化，就如同大自然中的瀑布一样，上面平平静静，下面却浪花飞溅。


    《史记》记载了这样一个故事：


    平原君赵胜的邻居是个跛子。一天，平原君的小妾在阁楼上，见到邻居一瘸一拐地在井台上打水，觉得他的姿态很滑稽可笑，就大声地笑了起来。


    邻居当干心生不忿，心想：我一个堂堂七尺男儿，虽然腿瘸了，但岂是你一个低贱的妾室能够取笑的，要是不讨回公道，我就妄作了几十年的人了。


    于是，他找到赵胜，将事情告诉了赵胜，并要求他杀了这个小妾，还自己公道。赵胜觉得又不是什么大事，因此有几分犹豫。邻居见状，立即说道：“世人都说，平原君礼贤下士而鄙贱女色，所以，天下英雄都不远千里来投奔您。我虽然有残疾，但好歹也算一个士子。今天你为了一个小妾而不肯替我主持公道，如此爱色贱士，天下人会怎么说你？以后还有谁肯为你效命？”'
  - '[PAGE 304]


    听完这番话，赵胜顿感事情严重。他立刻回到家中，毅然杀了那个行事没有分寸的小妾，并亲自登门向邻居道歉。


    看完这个故事，我们在钦佩赵胜尊重人才的同时，不妨也好好反省一下，自己在人际交往中有没有犯那个小妾那样的错误。


    生活中，因为说话没有分寸，一句自己认为无所谓的话，却得罪了别人、破坏了彼此的关系，甚至为自己树敌、丢了性命的事情屡见不鲜。


    三国时，称霸一方的刘备是个“少须眉”的形象。在古代，胡子和眉毛稀少的男子被认为是“脂粉味”重，缺少男子汉气概。刘备刚到西蜀时，曾被刘璋手下胡须茂盛的张裕取笑嘴上没毛，虽然他当时并没有发作，但心里十分恼火。


    后来，他赶跑了刘璋，成为张裕的主子，终于找了个借口把张裕杀了。


    张裕口无遮拦、说话没有分寸，最终丢掉了自己的性命。由此可见，“慎言”是一件多么重要的事情。


    如果我们想在社交场合中成为一个受欢迎的人，就必须时刻提醒自己，不要犯无心伤人的错误，避免自己的一句闲话引起强烈的“瀑布心理效应”。对此，我们可以从两方面来努力。


    说话要有所避讳。每个人都有自己的禁忌，这些禁忌我们也可以称之为“雷区”，往往是谁踩就炸谁。因此，在与人交往的过程中，'
  - '[PAGE 305]


    我们一定要有所避讳，这是对他人的一种尊重，有利于人际关系的发展。一般来说，以下这些内容是不能碰的：


    ①隐私。无论是自己的还是别人的隐私都是不宜多说的。固然，适当地谈自己的隐私，可以拉近距离，但过了头就会引起对方反感，认为你是没有分寸的人；而别人的隐私更是碰不得，既然是隐私当然要保密。


    ②他人的痛处。一般来说，他人的痛处包括耻辱之点、失意之处、痛悔之事三方面。对于对方来说，这些都是讳莫如深的，一旦听到有人提及类似的情况，就会如针刺在背般的痛苦。这样，对方就会对让他感到不快的你产生反感。


    ③有争议的话题。具有争议性的话题很容易引起彼此在观点上的对立，进而给彼此的交往带来不良影响。


    ④对他人有评价。那些对人的负面评价很容易传到被评价者的耳朵里，没有人会喜欢一个背后说自己坏话的人；即使评价是正面的，也很可能会在传播过程中走了样，给被评价人造成不必要的伤害，也为彼此的人际交往留下阴影。


    2.避开了“雷区”，接下来让我们来看看，在与人进行语言交流的过程中如何拿捏好分寸，让我们彻底从“瀑布效应”的包围圈中解脱出来。要想说话不失分寸，除了提高自己的文化素养和思想修养外，我们还必须注意以下几点：'
  - '[PAGE 306]


    ①要尊重客观事实，不要夸大或忽视客观事实，这样才能赢得人心，给人以可以信任的印象。


    ②要认清自己的身份，明白自己什么话可以说，什么话不能说。比如，作为晚辈，就不能对长辈轻言批评。


    ③控制自己的情绪。在社交场合，温文尔雅的待人接物方式是普遍被认可的。情绪失控、过于兴奋或过于愤怒都是不好的。过于兴奋会口出妄言，过于愤怒会口不择言、伤害他人。


    ④注意语言的民族和地域差异。由于不同民族和地域存在不同的文化差异，某些民族和地区的人有其特有的禁忌，因此，要注意这种差异，千万不要因一时不察而得罪了对方。


    ⑤善意很重要。所谓善意，就是与人为善。切记，说话的目的是向对方传递信息，以期在彼此间建立良好的人际关系，而不是惹是生非。


    俗话说“良言一句三冬暖，恶语伤人六月寒”。在人际交往中，一定要“慎言”、“善言”，千万不要落入“瀑布效应”的误区，这样才能让交往在和谐愉快的氛围中进行，进而使彼此感情升温。'
  - '[PAGE 307]


    # 8.有了坏消息该如何传达


    生活中，每个人都难免碰到不得不向他人传递一些坏消息的时候。这时，一旦传递不好，难免会被对方迁怒。那么，应该怎样才能使自己免于陷入这种人际困境之中呢？


    其实，只要用对了传达的方式，不管传递什么噩耗，都不会使你被人迁怒。


    听到某信息之后，对方会作何理解，产生何种感受，接下来会有什么样的言行反应，这一切的关键就在于传递过程中你所使用的语言。要知道，语言的影响力是不可估量的。


    优秀的推销员往往会请求你“批准这份文件”，而不会说“签合同”，因为他们知道“签合同”的说法会加重人的心理负担，让人谨慎，而“批准这份文件”不但有恭维的意味，而且能让人将签署文件看成是一件再平常不过的事情，进而很容易签上自己的大名。


    还有，那些政客们也深深懂得和明白言语对人的态度、行为的影响力有多么巨大，因此，他们将“战争”称作“军事行动”，将“百姓的财产被摧毁”称作“附带的损失”，将“死亡”说成是“事故”……


    说法不一样了，人们对同一件事情的接受程度也会不一样。语言之所以能改变人们对现实的看法，是因为人们是透过语言文字来与世界沟通的。换句话说，语言是思维的基础，而思维延伸出感情。'
  - '[PAGE 308]


    选择适当的字眼, 能够大大降低人们对某种负面情况的消极反应。那么, 什么样的字眼才算是“适当”的呢?


    1. 一般来说, 刺耳的、具有强烈负面含义的字眼千万不要使用。人们对于这些字眼往往具有某种程度的条件反射。比如, 人们听到“签合同”的字眼, 心理上就会反射性地产生一种抵触,
    因为在人的潜意识中, “签合同”等同于“重大责任”, 这样就难免一听到这个字眼就跳起来拒绝。


    相反, 如果使用温和的、循序渐进的、积极的字眼, 会让人更容易接受, 比如, 将“死亡”说成是“去天堂”, 将“签合同”说成是“批准文件”等。这类字眼可以使对方对信息加工、内化的速度放慢,
    降低信息的冲击力, 有利于对方接受信息。


    2. 在向他/她传递坏信息的时候, 要尽量将事件描述成暂时的、独立的、无关紧要的。


    心理学家指出, 当人面对某种境况的时候, 如果产生消极认知信念, 其焦虑、沮丧、愤怒的程度往往会大大提高, 进而将这些负面情绪转嫁到他人身上。这里所说的消极认知信念主要包括
    3 个方面:


    ①认为自己所面对的不良处境会一直 持续下去;


    ②片面地抬高了事件的重要程度;


    ③扩大了事件的波及范围, 认为此 事会给自己生活的其他领域带来消极影响。'
  - '[PAGE 309]


    因此，在向他人传递坏消息的过程中，如果你能通过语言描述，让事件呈现出暂时、独立、无关紧要的特征，通常能够将事件对对方产生的负面影响降到最低。比如，你要告诉一位母亲，她儿子又在学校闯祸了，老师请她去一趟。如果你说你家孩子又在学校闯祸了，好像挺严重的，老师说：“这么小就这样，长大了还不知道成什么样，请你务必去一趟。”这样势必会引起对方的反感。因为，事情通过你的描述已经变成极其严重的事情，它会影响孩子未来，好像孩子从今以后就是这个样子了。而如果你说你家的鬼精灵又在学校里淘气了，老师请你去一趟，想和你沟通一下，看看什么样的教育方式对孩子更有利。”这样，将事件独立起来，并且给对方以好的希望，自然会引起对方的反感。


    +   3、在向他人传递坏消息的时候，还有一个心理技巧能够帮助你，这个技巧是以“对比法则”为基础的。所谓“对比法则”，是指人们看待一件事物的方式并不仅仅取决于事物本身，通常人还会将其与其他事物做比较、对照。也就是说，如果有更坏的消息作为坏消息的陪衬，那么就算不上是坏消息了。比如，你的车子在例行检修的时候，修理人员告诉你，你的车子需要换个新刹车器，你可能会相当不悦，认为对方是有意夸大问题、坑你的钱。但是，如果修理人员告诉你：


    “你车子的刹车器有问题，多亏你及时来检修了，要是再磨损一段时间，刹车器就很有可能在开车的时候突然失灵……”这时，恐'
  - '[PAGE 310]


    怕不用对方要求, 你就会主动要求换一个刹车器。因为及时换一个刹车器, 与刹车失灵、出车祸比较起来, 简直可以算得上是一件好事情。


    总地来说, 避免使用刺耳、消极或带有侮辱性含义的字眼, 尽可能地将事件描述成独立的、暂时的、无关紧要的, 然后再附以未发生的、他人更加糟糕的情况做对比, 遵循这三个原则,
    即使你向对方传递的是坏消息, 也不会引起对方的反感。'
  - '[PAGE 311]


    # 9.拒绝朋友而不伤情谊的心理策略


    在与朋友相处的过程中,很多人为了不伤害彼此间的情谊,往往不会拒绝对方,即使对方的要求有些过分、有些让自己为难,但是为了维系良好的人际关系,也还是委曲求全,咬牙答应下来。殊不知这样做对彼此间的关系不但没有什么实质性的帮助,而且还有可能会有负面影响。


    其实,在与人交往的过程中,大可不必为了博得所有人的欢心而为自己,只要本着个人的原则坦城是事就可以了。一味地当“老好人”,对什么都点头称是,反而会把自己引人人际网的漩涡之中,徒增烦恼。


    刘蜜曾供职于一家大公司,开始的工作是负责文件整理和跑银行等杂事,有一次,一位同事问她可否帮助复印几百份的产品介绍,刘蜜看着自己手上待处理的文件,虽然迟疑了一下,还是答应了,心想这不会占用很多时间的。可是,当刘蜜处理完自己手头的工作,已没有时间去复印了,自己感到内疚不说,同事也不满意,在老板眼里,刘蜜更成了不经世事、委曲求全、承担不了大事的黄毛丫头。


    因此,对待他人的请求,正确的做法是:该帮的时候就帮,该拒绝的时候也要明确地拒绝。当然,此刻你心里可能在担心拒绝会得罪他人。其实,这样的担心是无谓的。只要找对了方法,即使你拒绝了对方的要求,也不会因伤害对方而破坏彼此的友谊。'
  - '[PAGE 312]


    第一个有效的方法是:在你拒绝对方以后，马上提供一个机会，让对方也拒绝你一次。


    我们知道，人际交往是遵循互惠原则的，即别人对你好，你往往也会让别人好；如果你对别人不好，你就会觉得亏欠了别人，从而引起自身的心理失衡。其实，互惠法则还可以反过来用。


    正着用，是“投桃报李”；反着用，就是“以眼还眼，以牙还牙”。比如说，你刚刚用“不”拒绝对方的请求，那么此时，对方心里一定是非常难过的。不过你可以立即请对方帮你的忙，请对方帮一个他根本不可能帮的忙，那么对方也会拒绝你。这样对方用你对待他的方式对待了你，心里上的不愉快也就不存在了，心理重新找回了平衡。就像变戏法一样，心理上的不愉快就化为了无形了。


    举个例子，每个同事请你帮他完成一份报表。你说哦，不行，因为我还有许多工作没有做完。不过很高兴你拿我当自己人看、找我有忙。对了，下星期我出差不在公司的时候，能不能请你帮忙料理一下我的事务？”现在，你的同事只会对你说抱歉，并且找个借口，说明他为什么拒绝帮助你。


    这是一种非常有效的拒绝别人的方式。一方面，在对方拒绝了你的请求以后，他会觉得非常尴尬，也就不好意思再硬要你去帮他什么，你采用这样的方式拒绝，使他很难再跟你争辩什么；另一方面，采用这样的方式拒绝，不会因导致对方心理失衡而引起对你的敌意；再则，因为他也拒绝了你，也可以避免自己陷人内疚的折磨之中。'
  - '[PAGE 313]


    第二个有效的方法是用“因为”做你的挡箭牌。


    1978 年, 心理学家们通过反复研究发现“因为”这个词有着惊人的力量。


    研究人员想插队使用复印机, 他们对排在自己前面的人说:“对不起, 我可以先用复印机吗?”这时, 只有不到半数的人同意了他们的要求; 然而, 换一种说话方式,
    他们说:“对不起, 我可以先用复印机吗? 因为我要复印。”表面上看, 两种方式之间并没有什么不同, 后者只是比前者多了一个“因为”。但是令人惊讶的事情发生了:
    几乎所有人都同意他们插队先使用复印机。


    其实, 研究人员的“因为”并没有解释清楚原因, 甚至可以说是废话一句。用复印机当然是为了复印, 还需要说“因为要复印, 所以使用复印机”吗? 不过“因为”确实产生了效果。那么,
    这是为什么呢? 在人们的潜意识中, 他们相信“因为”后面的解释都是有效的, 因此, 只要听到“因为”, 人们潜意识的“接受神经”就会被触动。这是一种心理上的条件反射,
    就像人的手被烫了就会缩回来一样。


    也就是说, 当你拒绝人的时候, 除了要给予对方一个拒绝的理由, 还要用上“因为”这个词。


    另外, 如果你不确定自己是否有足够的能力帮得了对方, 那么, 这时也千万不要说“我不确定”或者“我考虑考虑”之类的话。因'
  - '[PAGE 314]


    为对方会认为你在搪塞他， 那么无论你是否最后帮了对方，对方都 会反感你：你没帮上忙，他会觉得“故意 浪费我时间，帮不上忙还 那么多废话……”帮上了，他也会觉得“这个人真不实在，明明能
    帮，开始还那样推脱……”因此，这时，最聪明的回应是：“好！” 干干脆脆地答应对方。能帮自然最好；帮不上，他也会觉得你已 经 尽力了，你还是一个大好人。'
  - '[PAGE 315]


    # 10. 别让你的情绪化伤了对方的心


    生活中，有的人经常一时冲动，伤人的话脱口而出，等到自己冷静下来，警觉到自己做错了什么的时候，对他人的伤害已经造成，彼此间的感情也出现了裂痕，难以恢复如初。


    一个男孩非常情绪化，爱发脾气。于是，他父亲给他一袋钉子，并且告诉他每当发怒的时候，就钉一颗钉子在后院的围栏上。男孩第一周钉下了 37 根钉子。慢慢地，男孩每天钉的钉子减少了，他发现，控制自己的脾气要比钉钉子容易。


    终于有一天，这个男孩觉得自己再也不会计去耐性，乱发脾气了。


    父亲又告诉他说：“现在开始，每当你控制自己脾气的时候，就拔出一颗钉子。” 时间一天天过去，最后男孩告诉他的父亲，他终于把所有的钉子都拔出来了。


    父亲握着他的手，来到后院说：“你做得很好，我的孩子！但是看看那些围栏上的洞，这些围栏将永远不能恢复到从前的样子了。你生气的时候说的话，就像这些钉子一样也会留下疮疤。如果你捅了别人一刀，不管你说多少次对不起，那个伤口都将永远存在。那种伤痛就像真实的伤痛一样令人无法承受。”


    这个故事流传很广，引起了无数人的共鸣。确实，人们发怒时的言行给别人造成的伤害是永远无法弥补的。'
  - '[PAGE 316]


    因此，在社交中，一定要注意控制好自己的情绪，别让自己的负面情绪成为建立良好人际关系的拦路虎。


    美国情绪管理专家帕德斯指出，平时锻炼自己控制情绪的能力，养成自制的习惯，通过自制来管理自己的情绪是个行而有效的方法。为此，我们可以从以下几方面来努力：


    1. 体察自己的情绪，有意识地注意“我现在的情绪处在什么状态”。对于自身的情绪，我们要能够清楚的认知。例如，你在家里面跟夫人吵了一架，可能把这个情绪带到公司了，你的下属可能因此受到了无故的责难。事后，有人问你“你那天是怎么搞的？”你说：“我没有怎么啊！”这就说明，你没有体察到自己
    的情绪。只有当我们体察到了负面情绪以后，才能够对它作更好的处理。


    有许多人认为“人有负面情绪”是没有修养的表现，所以即使有了负面情绪，也尽量压抑着它而不肯承认。要知道，情绪犹如洪水，越堵，爆发后的破坏力就越强。因此，面对它、承认它才是体察自己情绪的正确做法。


    2. 采用适当的方式表达自己的情绪。例如，你的爱人不知什么原因，很晚了还没有回家，你越等越心急，终于，他回来了。而你看着他就砸过去一个抱枕， 怒道：“你还知道回来？不如死在外面算了。”显然，选择这种方式来表达自己的情绪是不恰当的。首先，它并不能表达你心里的忧虑和担心，会让对方误解为你无理取闹、乱发脾气。'
  - '[PAGE 317]


    那么换一种方式呢？你看见他从门口进来，便迫不及待地冲到他跟前，说：“我好担心你。”这样会让他了解他的晚归会带给你什么感受，让他觉得温暖，还会引发他的歉意。然后，对方就会回应给你一个很好的情绪反应，比如解释原因、承诺以后再也不这样等。这样表达自己的情绪才是适当的。


    如何“适当表达”情绪，是一门艺术，需要我们用心体会、揣摩。


    +   3. 以合宜的方式疏解情绪。负面情绪往往会给我们带来很大的精神压力，不利于身心健康。就疏解负面情绪，专家们给出了下面这几种建议：


