    # 6.适度保持距离


    有一群刺猬，在冬天想用大家的体温来御寒，因而紧紧靠在一起，但彼此又觉得刺得疼痛，于是立刻离开。然而温暖的需要再次使它们靠近，却又吃了同样的苦头。它们在这两难中终于发现了彼此之间的适宜间隔，依此距离，它们能够过得最平安。


    在生活中，我们每个人就像“过冬的刺猬”一样，需要彼此交往、彼此靠近，但需要一个个人空间。这个个人空间在一般情况下是不容侵犯的。心理学家们将这种现象为“刺猬效应”。


