    # 4.就他人最在行的事情提问


    以采访大人物而闻名的记者马可森曾经采访过纽约的大资本家亨利·罗杰斯。由于马可森有太多的问题想问亨利，因此马可森事先向亨利表示了歉意。出人意料地，亨利并没有因此而厌烦或者反感，反而对马可森产生了某种程度的好感。亨利对马可森说如果你一个问题都没有的话，我也不会有兴趣和你交谈了。


