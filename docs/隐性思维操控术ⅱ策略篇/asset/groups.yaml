    罗纳德·威尔逊·里根是一位深受美国人爱戴的总统，他迎合选民的手法变化多端而富有吸引力。


    有一次，里根向一群意大利血统的美国人发表演讲，他说每当[想到意大利人的家庭]时，温暖的厨房就跃入了我的脑海，还有那更加温暖的爱，几乎让我也立刻无比温暖起来。


    “有这么一家人，他们一直住在一套稍嫌狭小的公寓里，不过，他们已经决定搬到乡下[一座]大房子里去。


    “有一天，一位朋友[来]拜访，和这[家]一个3岁的儿子托尼聊了起来，朋友问托尼：‘喜欢你们的新居码？’，托尼回答说：‘喜欢！那简直太棒了：我有了自己的房间，我的哥哥也有了自己的房间，还有我的姐姐们也有了自己的房间；可是，可怜的妈妈仍然和爸爸住[一个]房间，他们都没有属于自己的房间。，”


    这个笑话明显地拉近了里根与当地选民的心理距离，让这些意裔美国人感觉到，里根原来和自己的生活那么接近，进而接受了里根。而里根此举正是“名片效应”的应用。


