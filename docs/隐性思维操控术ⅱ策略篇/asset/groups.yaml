    # 9.将正式场合转换为非正式场合


    很多有经验的摄影师为了捕捉到摄影对象最自然的一面，常常会对对方说“好，拍完了，谢谢你的合作！”这句话就是捕捉到最自然的表情的诀窍。


    一般人在面对照相机的时候，因为太想展示自己最好的一面，结果反而使心理过度紧张，表情也会显得不自然；在这种情况下，一句“好，完了”，将正式的场合转换成非正式的，被拍摄者紧张忐忑的心理也因此而放松平静下来。在这一瞬间按下快门，就可以捕捉到对方那种充满解放感的自由又自然的表情。


    的确，正式场合往往会引起个体强烈的心理紧张，这时，人的戒备心理会非常浓厚，会采用各种方式来伪装、保护自己，显得非常拘谨。然而，如果将处于这种紧张状态之中的人突然从正式场合置放于一个非正式的场合，其心理就会立刻松懈下来，从而流露出自己本色的一面。


    如果你能够有意识地将正式场合转换为非正式场合，那么就能让对方觉得安然，从而毫无顾忌地表现自己的内心世界。


    相信你一定有过这样的经历：


    在座谈会或某些聚会上，在作正式的发言时，你往往会表现得很谨慎，对说出口的每一个字，你都是经过深思熟虑的。然而，如果这时主办人告诉你“好了，会议就开到这里，接下来大家可以自'
  - '[PAGE 136]


    由活动……”）又或者主人说“非常感谢大家的光临！下面请大家玩得尽兴……”那么，你一定顿感轻松，从而不知不觉地吐露自己的心声。


    由此可见，人的心理容易受到所处场合的影响，通过有意安排非正式的空间，能够让人安心地吐露自己的心声。


    日本著名心理学家多湖辉曾向人讲述了这样一件事。


    有一位税务官去调查一位十分精明、很难对付的企业经营者。在整个调查过程中，那位经营者表现得非常谨慎，几乎可以说是滴水不漏。虽然税务官明明知道他的经营存在税务方面的问题，却没有办法找出他的破绽。


    全部调查结束后，这位经营者终于放心了。这个时候，税务官一边喝着茶，一边若无其事地与他闲聊，指着墙上的一幅画说“真是一幅好画呀！”经营者随后答道：“是呀，这可不是一般的仿制品，而是一幅难得的珍品！”


    就这样，经营者在税务官营造的非正式场合气氛中，由于心理不由自主地降低了警揭，从而露出了漏税的马脚。


    生活中，这种情况可谓屡见不鲜。因此，想要让别人畅所欲言，你可以将正式场合转换为非正式场合，进而使其心理放松，在不知不觉之间吐露出自己的心声。一般来说，你可以通过以下两种方法来转换场合：'
  md: "\n由于有前面几个小时的谈话，他已充分赢得了校长的好感，所以，他的事情也办得很顺利。\n\n在生活中常常可以看到这样的事情，即使是一个平常沉默寡言的人，在谈到他感兴趣的话题时也会滔滔不绝。因此，为了增强你的谈话能力，应该扩大你的兴趣范围，平常可以多关注一些信息，多参加一些活动，在大家谈话的时候你可以参与进去。长期坚持下去，你就能看到满意的结果，和陌生人聊天的时候你也能找到话题，大家都很愿意和你交往。\n\
    \n## 3. 找到他人感兴趣的话题\n\n著名的投资银行培因·韦伯公司的总经理——威廉·爱尔莫利特·培因，一度成为波士顿城的首富。起初，他只是一个银行的小职员，但由于善于交际，一步步走向了成功。\n\
    \n因为工作需要，威廉·培因不得不与那些比自己不知富有多少倍的富翁往来，对此他相当地忧虑。要知道，一个仅仅糊口的小职员想要给那些有钱人做经济顾问简直是天方夜谭。幸而，在后来的接触中，他发现了一个很有趣的现象：只要他能找到对方感兴趣的话题，就能让对方非常愿意和他交往。\n\
    \n利用这个利器，威廉·培因发展了自己的人际关系，事业也蒸蒸日上。\n\n的确，当你与人谈话时，假如能找到对方感兴趣的话题，对方就会在彼此的交谈中投入更多的热情。这一点是被许多成功人士所公认的。\n\
    \n费城前市长彼得·迈考尔也颇擅此道。宾夕法尼亚州州长彭尼珀克曾这样评价他：“即使对方并不健谈，甚至可以用木讷寡言来形容，彼得也能通过涉及众多话题的交谈找到对方的兴趣所在，从而让对方畅所欲言，而自己则开始扮演倾听者的角色。”\n\
    \n李莲·艾可乐虽然是位很年轻的英国军官，但却是“推翻土耳其帝国”的功臣。然而，这当中离不开阿拉伯部队的支持。那么他是如何做到的呢？他说，在与阿拉伯领袖交谈时，他总是注意寻找对方感兴趣的课题，以此来点燃对方自身深藏的思想的火线。也正是因这一点，阿拉伯部队才会怀着狂热的信仰来支持他。\n\
    \n那么如何找到对方感兴趣的课题呢？其实，关键有两点：第一，把自己置于谈话中背景的位置，让对方成为谈话的主角，显示出你对他人谈话的浓厚兴趣，这样就能诱发对方说话；第二，从对方的言谈中找到对方的优势，然后就此方面发问。\n\
    \n这是多么简单啊！然而，却有很多做不到，因为他们常常对此视而不见。在交谈过程中，他们只顾神采飞扬地谈论自己感兴趣的课题，从而引起了对方对该话题的厌烦，甚至是对他们的反感。\n\
    \n无疑，当一个人对自己感兴趣的课题发表看法时，很容易失去冷静，变得充满激情，进而为人际交往带来各种麻烦。但是，如果将谈话引到对方感兴趣的课题上去，让对方成为谈话的主导，那么你就能够自如地保持头脑的清醒，绕过人际交往中的暗礁，达到主宾皆欢的效果。\n\
    \n然而，为了找到对方感兴趣的课题、逢迎对方，不少人喜欢评论对方的工作或性格，其实这是相当让人厌恶的。这个方法很笨，一个聪明的人是不会采用这样的方法的。聪明的人会给对方制造展示自己的机会，以此满足对方的成就感和自尊心。比如，有人故意曲解对方所精通的事情，等同于在告诉对方“你比我博学”，这样不仅能够迎合对方，而且能够引起对方说话的兴趣。\n\
    \n是的，只要你倾听对方、找到对方的优势话题、给对方制造演说的舞台，就能够引起对方的兴趣，进而让对方畅所欲言。\n\n## 4. 就他人最在行的事情提问\n\
    \n以采访大人物而闻名的记者马可森曾经采访过纽约的大资本家亨利·罗杰斯。由于马可森有太多的问题想问亨利，因此马可森事先向亨利表示了歉意。出人意料地，亨利并没有因此而厌烦或者反感，反而对马可森产生了某种程度的好感。亨利对马可森说：“如果你一个问题都没有的话，我也不会有兴趣和你交谈了。”\n\
    \n相反，还有一位记者采访一位著名的银行家，请教国际汇兑的问题。要知道，这是一个非常复杂的问题，然而，采访大约15分钟之后，那位记者就向银行家告辞了，他对银行家说：“十分感谢，我已经十分了解这个问题了。”而银行家含蓄地回答：“你真是一个了不起的年轻人啊！我在银行做了40年，至今也不敢说出这样的话，我一直认为我也不是特别了解国际汇兑的事。”\n\
    \n或许是因为自身愚蠢地过度自信，或许是因为害怕在对方面前暴露自己浅薄的真面目，这位记者并没有对银行家进行过多的提问，而这引起了银行家的反感。\n\n在与人交谈的过程中，有很多人都害怕向对方提问，他们认为问题太多会让对方厌烦，而事实却并非如此。心理学家指出，适当地多提些问题能够让对方打开心门，赢得对方的信任，有利于交谈的顺利进行。\n\
    \n人际交往的高手们往往都擅长利用发问来取信于人，不过他们通常会特别注意以下原则：\n\n- 1. 提出的问题要能显示出自己的谦恭态度，以及自己对他人学识涵养的敬佩。麦克兰是以其炼铸技术而闻名世界的工程师，在他刚开始工作的时候，对此就已经非常精通了。然而，他却失去了至少20份工作。问题在哪里呢？\n\
    \n原来，麦克兰非常喜欢提问，不过他提的问题总是让上司下不来台。后来，麦克兰终于注意到了这一点，此后他同样提问题，不过他会针对上司精通的方面提问，这才让他从不断的失业困境中走了出来。\n\
    \n不要小看一个不合时宜的问题，因为日常交际中双方的不快往往正是起源于此。因此，提问一定要针对对方精通的方面。\n\n- 2. 确认你真的对这个问题有兴趣。如果你为了迎合对方，而提一些自己根本就不感兴趣的话题，这会让对方觉得你非常没有诚意，进而让对方对你产生反感。比如，一位少妇向一位教授请教有关道德哲学的问题。显然，一个少妇不可能对道德哲学有什么兴趣，而她的图谋太过明显，当然就会让对方产生反感。\n\
    \n- 3. 确定对方乐于回答这个问题。每个人都会有不愿意让他人触及的隐私。谁碰触到了这些禁忌话题，谁就会让人厌恶。事实上，问对方不愿意回答的问题是一种相当冒失的行为。比如，有人问“你一个月赚多少钱，够花吗”，相信你也会觉得这种很讨厌。\n\
    \n切记，提问题，就要提既彰显自己的诚意，对方又乐于回答，而且还是对方能够轻松回答、显示其才华的问题。这样才能达到恭维、迎合对方的目的。\n\n## 5.\
    \ 与人交谈，要坐有坐“向”\n\n某电视台的一个评论性电视节目中的评论人都是临时随机选取的。制作人本以为这种随机性、临时性形成的节目走势的不可预测性能够吸引很多观众，谁知收视率却极不理想。分析了原因后，制作人认为节目的辩论缺乏高潮是症结所在。\n\
    \n然而，对于这种没有经过预先安排的评论发展到高潮与否，人又怎么能控制得了呢？针对这个问题，制作人请教了许多专家，专家们也提出了改良意见，不过效果都不甚理想。\n\
    \n后来，有一位心理学家了解到，辩论者们都是横排而坐，就提出“改变座位的配置方式的建议，让辩论者们两两相对而坐”。\n\n制作人抱着“活马当死马医”的态度做了尝试。令人意想不到的结果产生了，后续节目中的讨论几乎每次都会有辩论高潮，而且其热烈程度超乎想象。没多久，这档节目的收视率连创新高。\n\
    \n那么，为什么面对面的坐向能够刺激争辩的激烈程度大幅上升呢？心理学家们做了如下解释：\n\n一是人的视线逼视对心理产生了影响。与人相对而坐，正面直视，即使没有刻意凝视对方，由于位置的原因，也会使人对视，甚至具有一定的攻击性；而这种视觉“感受”会给人造成一种自然的压迫感和不自由感，进而激发起彼此的对立心理，使彼此关系紧张。相反，坐在对方的旁边，避免了视线的直接交锋，减弱了对立性，彼此也就不容易对立起来。\n\
    \n二是人类固有的潜意识产生了影响。在人的潜意识深处，很自然地将在自己旁边的对象看成是伙伴，而将自己对面位置的对象看作是敌人。受这种潜意识影响，面对坐在自己旁边的人，即使与他争论也不会过于激烈；而坐坐在自己对面的人，即使不争争吵，也多少会有些距离感。\n\
    \n三是注意力激化了争论。如果是并排而坐，争辩时必然要扭转头，时间一长、次数一多就会使人感觉到疲累，进而原本专注于争辩之中的注意力被分散，斗志骤减。这样也就不容易产生激烈的争吵。然而，面对面地坐着，一方面省去了扭头的力气，避免了注意力被分散；另一方面，将对方作为唯一的认知对象，使注意力更加集中，这样自然会越争越厉害。\n\
    \n显然，在交谈中，你的坐向影响着对方对你的态度。因此，当你与人交谈时，想要让彼此间的交流进行得和谐而顺利，就不得不注意选择自己的坐向。一般来说，有以下几点是应该注意的：第一，正常沟通时，侧身而坐，或取直角位置为宜。这种坐向传递给对方的是一种友好的信息，而不会让对方有压迫感和紧张感。第二，在赞美人时要横向或倾斜交叉而坐。这样的坐向能让对方感受到你对他的关注、重视，给人很诚恳的感觉。第三，安慰人时要并肩而坐。这种坐向是一种“我就在你身边，关怀你、安慰你”的暗示，能让对方感到温暖，达到安慰对方的目的。\n\
    \n照顾到了坐向细节，相信你与他人的交谈一定能够更加顺利。\n\n## 6. 创造良好的交谈氛围\n\n20世纪70年代，心理学家亚历山大等提出了情境同一性原理。他们指出，对于每一种社会情境或人际背景，人都有一种最合适的行为模式与之相匹配，这种行为模式与其情境具有同一性，故称为情境同一性。\n\
    \n在与人交往的过程中，人们发现，如果双方都能处于情感共鸣的状态中，那么这样的交往能在很大程度上促进彼此关系的发展。而心理学家认为：在交往过程中，人与人之间感情的认同和共鸣，是通过当时特有的情境刺激所形成的互通和互相感染的结果。因此，在进行社交活动时，我们应该积极创造情境同一性。就此，心理学家提出了以下几个建议：\n\
    \n1. 创造好的交往环境。人所处的环境，包括地点、气氛等一系列因素，都会影响人的情绪。在人际交往中，选择一个舒适的、气氛融洽的环境，能使人的情绪处于良好状态，从而更容易进入交往状态。\n\
    \n2. 找到共同话题。共同话题能够引导对方进入自己设置的情境，或者进入对方期望的情境，进而创造出情境同一性。\n\n3. 体味对方的情绪。人的情绪是具有波动性的，情绪好能促进人际关系，情绪不好则可能对社交产生负面影响。因此，要学会体味对方情绪，这样才能体谅对方，才能做到心中有数，做出恰如其分的反应。\n\
    \n4. 利用相似原理。俗话说“物以类聚、人以群分”，人们总是倾向于和那些与自己有更多相似点的人交往，并且对他们有一种潜意识的好感。因此，努力去发现彼此的相似之处，能够使自己更容易认可对方，同时也更容易使对方接受自己，进而成功创造情境同一性。\n\
    \n5. 塑造最有利于交往的个人形象。对于对方来说，我们的个人形象同样属于外界环境中的一部分，因此塑造一个最有利于交往的个人形象也是不容忽视的。具体地说，可以从这几个方面来努力：真诚微笑，耐心倾听，谈论符合对方兴趣的话题，适当表现自己等。\n\
    \n通过制造“同一性”的情景，就有了一个成功的开始，那么如何成功地继续话题也是非常关键的。良好的交谈氛围缺少不了双方谈话的欲望，毕竟交谈都是双向的，那么你应该如何来激发对方的谈话兴趣呢？\n\
    \n首先，你可以从对方身上的亮点着手，进行提问。你可以问对方：“你的衣服看起来真不错，是在哪里买的？”“你的气色看起来真不错，有什么保养诀窍呢？”……\n\n\
    接着，将谈话的层次加深，向对方请教他所擅长的问题。比如对方是个教育工作者，你可以对他说：“现在的孩子越来越不好管了，面对那些鬼灵精我是一点儿办法都没有，你有什么妙招吗？教教我怎样对付他们?”\n\
    \n最后，再不着痕迹地将话题引导到你所要谈的正题上来。由于前面对方已经打开了自己的话匣子，出于对自身行为前后一致的心理需求，对方也就不会三缄其口了。\n\n\
    ## 7. 向记者学采访技巧\n\n记者是一种社交性很强的职业，它要求从事该项职业的人具有让采访对象畅所欲言的能力。那么，老练的记者是怎么做的呢？\n\n\
    首先，他们会抱着“我喜欢采访对象”的心态来开始采访工作。\n\n心理学上有一个著名的“皮格马利翁效应”，说的是皮格马利翁爱上了一座美丽的少女雕像，从此他每天都深情地对石雕像倾诉自己内心的爱慕，终于，雕像被他感动了，真地成为一位活生生的美女。当然这只是一个传说，但就促进人际关系的发展而言，“喜欢对方”的确能发挥很大的功效。\n\
    \n只要你抱着“他是一位好人，我喜欢他”的想法，对方多半会与你推心置腹地交谈。反之，如果你带着一种讨厌对方的情绪与对方进行交谈，对方往往会表现得相对抵触，而交谈也会不欢而散。\n\
    \n非指示疗法和协议中心疗法的创始人 C. R. 罗杰斯曾说过：“以无条件的诚意进行会谈，能够打开对方的心灵，同时也能使对方对自己产生好感。”\n\n其次，记者们的采访往往都是从无关紧要的闲聊开始的。\n\
    \n任何情况下，你主动与人会面、交谈，肯定都有你特定的目的。如果一开始你就立刻让话题直奔目标，那么结果很可能是对方拒绝回答，或者对方做岀不实的回答。\n\n\
    之所以会产生这样的结果，主要是因为直奔目标的交谈方式有两大弊端：一是开始就要求对方通过仔细思考作出回答，会让对方产生极大的心理压力，进而引发对方的抵触；二是开始就直奔自己的目的，会让对方产生一种被你忽视的感觉而产生心理阴影。\n\
    \n一旦你采用这种方式造成了彼此间的鸿沟，那么，无论你之后说得如何天花乱坠，也很难将局势挽回。所以，在见面之初，先与对方谈论与他相关的既成事实或经验的话题，然后再慢慢地向你自己的目的靠拢，才能够让你达到目的。切记，心急吃不了热豆腐。\n\
    \n第三，怎样称呼对方是关键。\n\n心理学家指出，想要与一位初次见面的朋友快速地热络起来，称呼是关键。你最好称呼对方的姓名，而不要“XX科长”“XX经理”“XX主任”“XX董事长”等。因为人一旦被冠上了这些头衔，就会扮演起相应的角色，会特别注意该角色的任务和地位，并借此掩盖起那个“真我”；而称呼对方姓名则能够给对方一种“你现在已不是一位科长（经理、主任等）”的心理暗示，暗示对方是单纯的一个人，从而解除其心理武装，而且还可以预防对方在谈话之后以“我还要征求经理的意見……”之类的托词来敷衍你。\n\
    \n当然，不排除有一部分人非常喜欢别人称呼自己的头衔以满足自己的虚荣心。对这种人，你不能直呼其名，而要投其所好地称呼他的头衔来满足他的虚荣心。这样才能获得他的好感，进而使他在你面前畅所欲言。\n\
    \n向记者学得这3招，一定能让你顺利地打开对方的话匣子。\n\n## 8. 如何使对方说不愿说的话\n\n生活中，一个人之所以会有不愿意说出的话，主要是为了保护他的“自我”，如果这些心里的话说出口，就会让他觉得尴尬，或让他觉得有损自我形象，又或者会让他有危机感。针对这种情况，你如果能够打消他的心理疑虑，就能让他说出本不愿说的话。\n\
    \n为了打消对方的心理疑虑，让其说出本不愿说的话，你可以采用以下心理策略：\n\n- 1. 不直接问对方，而让他以第三者的身份来说出心里的话。比如，你想问一位年纪较大的人对时下年轻人的看法，如果你直接问对方：“你对现在的年轻人有什么看法呢？”对方很可能轻描淡写地回答说：“还不错，很有朝气……”你听到的只是一些表面上的恭维话，而非他内心的真实想法。但是如果你换一种问法，问他：“你觉得，像你们这个年纪的人会以什么样的眼光来看时下的年轻人呢？”这样，对方就可以从第三者的角度，以“这个年纪的人”的身份说出一些较中肯的评价，而不用担心说出心里话会引发年轻人对自己的反感。因为他发表的虽然是自己内心的想法，但却是以他人的身份，这样就将批评性言论与自己撇清了干系，消除了疑虑。\n\
    \n这种方法是辅导人员、会议主持人、节目主持人等常用的技巧。他们深知这种方法能够使对方觉得说出的话与“自我”无关，从而毫无顾忌地、放心大胆地高谈阔论。\n\n\
    - 2. 动摇对方的内心。或者向对方表示同情，或者温言劝慰，或者作势吓唬……无论是软的还是硬的，只要你让对方内心产生了动摇，对方就会说出原本不愿意说出的话。\n\
    \n说到动摇他人内心的攻心之术，我们不得不承认警察是专家。他们采用的攻心之术主要有这几种：\n\n    - ①要选择毫无装饰的房间作为质询嫌疑犯的地点，这样做主要是为了防止嫌疑犯的注意力分散而减弱攻心术的效果；\n\
    \    - ②审讯者在言行上会突显自己的权威性，以给嫌疑犯一定的心理压力，让嫌疑犯自己把自己的心门打开，进而说出实情。比如审讯者往往会以非常严厉的口吻说“坐下！”“看这里！”等；\n\
    \    - ③向嫌疑犯传递同情对方的信息。这样能够让嫌疑犯觉得自己和审讯者有心理共鸣，从而不自觉地撤销自己的心防。\n\n总的来说，要想使对方说出本不愿意说的话，有迂回取胜和直接进攻两种方式。\n\
    \n所谓迂回取胜是指通过巧妙的提问，让对方的“自我”不必为“第三者”的言论负责，这样对方就可以放心地发表意见了。要知道，一旦事情与“自我”产生了联系，人就会表现得非常敏感、谨慎；而如果这种联系不存在的话，人就会少很多疑虑和顾忌。至于直接进攻，你完全可以向警察学上一两招。或者施加压力，让对方不堪重负之下说出心底的话；或者表达同情，使其放松警惕，自然而然地说出心底的话。\n\
    \n## 9. 将正式场合转换为非正式场合\n\n很多有经验的摄影师为了捕捉到摄影对象最自然的一面，常常会对对方说“好，拍完了，谢谢你的合作！”这句话就是捕捉到最自然的表情的诀窍。\n\
    \n一般人在面对照相机的时候，因为太想展示自己最好的一面，结果反而使心理过度紧张，表情也会显得不自然；在这种情况下，一句“好，完了”，将正式的场合转换成非正式的，被拍摄者紧张忐忑的心理也因此而放松平静下来。在这一瞬间按下快门，就可以捕捉到对方那种充满解放感的自由又自然的表情。\n\
    \n的确，正式场合往往会引起个体强烈的心理紧张，这时，人的戒备心理会非常浓厚，会采用各种方式来伪装、保护自己，显得非常拘谨。然而，如果将处于这种紧张状态之中的人突然从正式场合置放于一个非正式的场合，其心理就会立刻松懈下来，从而流露出自己本色的一面。\n\
    \n如果你能够有意识地将正式场合转换为非正式场合，那么就能让对方觉得安然，从而毫无顾忌地表现自己的内心世界。\n\n相信你一定有过这样的经历：\n\n在座谈会或某些聚会上，在作正式的发言时，你往往会表现得很谨慎，对说出口的每一个字，你都是经过深思熟虑的。然而，如果这时主办人告诉你“好了，会议就开到这里，接下来大家可以自由活动……”又或者主人说“非常感谢大家的光临！下面请大家玩得尽兴……”那么，你一定顿感轻松，从而不知不觉地吐露自己的心声。\n\
    \n由此可见，人的心理容易受到所处场合的影响，通过有意安排非正式的空间，能够让人安心地吐露自己的心声。\n\n日本著名心理学家多湖辉曾向人讲述了这样一件事。\n\
    \n有一位税务官去调查一位十分精明、很难对付的企业经营者。在整个调查过程中，那位经营者表现得非常谨慎，几乎可以说是滴水不漏。虽然税务官明明知道他的经营存在税务方面的问题，却没有办法找出他的破绽。\n\
    \n全部调查结束后，这位经营者终于放心了。这个时候，税务官一边喝着茶，一边若无其事地与他闲聊，指着墙上的一幅画说：“真是一幅好画呀！”经营者随后答道：“是呀，这可不是一般的仿制品，而是一幅难得的珍品！”\n\
    \n就这样，经营者在税务官营造的非正式场合气氛中，由于心理不由自主地降低了警揭，从而露出了漏税的马脚。\n\n生活中，这种情况可谓屡见不鲜。因此，想要让别人畅所欲言，你可以将正式场合转换为非正式场合，进而使其心理放松，在不知不觉之间吐露出自己的心声。一般来说，你可以通过以下两种方法来转换场合：\n"
  mdcn: "\n由于有前面几个小时的谈话，他已充分赢得了校长的好感，所以，他的事情也办得很顺利。\n\n在生活中常常可以看到这样的事情，即使是一个平常沉默寡言的人，在谈到他感兴趣的话题时也会滔滔不绝。因此，为了增强你的谈话能力，应该扩大你的兴趣范围，平常可以多关注一些信息，多参加一些活动，在大家谈话的时候你可以参与进去。长期坚持下去，你就能看到满意的结果，和陌生人聊天的时候你也能找到话题，大家都很愿意和你交往。\n\
    \n## 3. 找到他人感兴趣的话题\n\n著名的投资银行培因·韦伯公司的总经理——威廉·爱尔莫利特·培因，一度成为波士顿城的首富。起初，他只是一个银行的小职员，但由于善于交际，一步步走向了成功。\n\
    \n因为工作需要，威廉·培因不得不与那些比自己不知富有多少倍的富翁往来，对此他相当地忧虑。要知道，一个仅仅糊口的小职员想要给那些有钱人做经济顾问简直是天方夜谭。幸而，在后来的接触中，他发现了一个很有趣的现象：只要他能找到对方感兴趣的话题，就能让对方非常愿意和他交往。\n\
    \n利用这个利器，威廉·培因发展了自己的人际关系，事业也蒸蒸日上。\n\n的确，当你与人谈话时，假如能找到对方感兴趣的话题，对方就会在彼此的交谈中投入更多的热情。这一点是被许多成功人士所公认的。\n\
    \n费城前市长彼得·迈考尔也颇擅此道。宾夕法尼亚州州长彭尼珀克曾这样评价他：“即使对方并不健谈，甚至可以用木讷寡言来形容，彼得也能通过涉及众多话题的交谈找到对方的兴趣所在，从而让对方畅所欲言，而自己则开始扮演倾听者的角色。”\n\
    \n李莲·艾可乐虽然是位很年轻的英国军官，但却是“推翻土耳其帝国”的功臣。然而，这当中离不开阿拉伯部队的支持。那么他是如何做到的呢？他说，在与阿拉伯领袖交谈时，他总是注意寻找对方感兴趣的课题，以此来点燃对方自身深藏的思想的火线。也正是因这一点，阿拉伯部队才会怀着狂热的信仰来支持他。\n\
    \n那么如何找到对方感兴趣的课题呢？其实，关键有两点：第一，把自己置于谈话中背景的位置，让对方成为谈话的主角，显示出你对他人谈话的浓厚兴趣，这样就能诱发对方说话；第二，从对方的言谈中找到对方的优势，然后就此方面发问。\n\
    \n这是多么简单啊！然而，却有很多做不到，因为他们常常对此视而不见。在交谈过程中，他们只顾神采飞扬地谈论自己感兴趣的课题，从而引起了对方对该话题的厌烦，甚至是对他们的反感。\n\
    \n无疑，当一个人对自己感兴趣的课题发表看法时，很容易失去冷静，变得充满激情，进而为人际交往带来各种麻烦。但是，如果将谈话引到对方感兴趣的课题上去，让对方成为谈话的主导，那么你就能够自如地保持头脑的清醒，绕过人际交往中的暗礁，达到主宾皆欢的效果。\n\
    \n然而，为了找到对方感兴趣的课题、逢迎对方，不少人喜欢评论对方的工作或性格，其实这是相当让人厌恶的。这个方法很笨，一个聪明的人是不会采用这样的方法的。聪明的人会给对方制造展示自己的机会，以此满足对方的成就感和自尊心。比如，有人故意曲解对方所精通的事情，等同于在告诉对方“你比我博学”，这样不仅能够迎合对方，而且能够引起对方说话的兴趣。\n\
    \n是的，只要你倾听对方、找到对方的优势话题、给对方制造演说的舞台，就能够引起对方的兴趣，进而让对方畅所欲言。\n\n## 4. 就他人最在行的事情提问\n\
    \n以采访大人物而闻名的记者马可森曾经采访过纽约的大资本家亨利·罗杰斯。由于马可森有太多的问题想问亨利，因此马可森事先向亨利表示了歉意。出人意料地，亨利并没有因此而厌烦或者反感，反而对马可森产生了某种程度的好感。亨利对马可森说：“如果你一个问题都没有的话，我也不会有兴趣和你交谈了。”\n\
    \n相反，还有一位记者采访一位著名的银行家，请教国际汇兑的问题。要知道，这是一个非常复杂的问题，然而，采访大约15分钟之后，那位记者就向银行家告辞了，他对银行家说：“十分感谢，我已经十分了解这个问题了。”而银行家含蓄地回答：“你真是一个了不起的年轻人啊！我在银行做了40年，至今也不敢说出这样的话，我一直认为我也不是特别了解国际汇兑的事。”\n\
    \n或许是因为自身愚蠢地过度自信，或许是因为害怕在对方面前暴露自己浅薄的真面目，这位记者并没有对银行家进行过多的提问，而这引起了银行家的反感。\n\n在与人交谈的过程中，有很多人都害怕向对方提问，他们认为问题太多会让对方厌烦，而事实却并非如此。心理学家指出，适当地多提些问题能够让对方打开心门，赢得对方的信任，有利于交谈的顺利进行。\n\
    \n人际交往的高手们往往都擅长利用发问来取信于人，不过他们通常会特别注意以下原则：\n\n- 1. 提出的问题要能显示出自己的谦恭态度，以及自己对他人学识涵养的敬佩。麦克兰是以其炼铸技术而闻名世界的工程师，在他刚开始工作的时候，对此就已经非常精通了。然而，他却失去了至少20份工作。问题在哪里呢？\n\
    \n原来，麦克兰非常喜欢提问，不过他提的问题总是让上司下不来台。后来，麦克兰终于注意到了这一点，此后他同样提问题，不过他会针对上司精通的方面提问，这才让他从不断的失业困境中走了出来。\n\
    \n不要小看一个不合时宜的问题，因为日常交际中双方的不快往往正是起源于此。因此，提问一定要针对对方精通的方面。\n\n- 2. 确认你真的对这个问题有兴趣。如果你为了迎合对方，而提一些自己根本就不感兴趣的话题，这会让对方觉得你非常没有诚意，进而让对方对你产生反感。比如，一位少妇向一位教授请教有关道德哲学的问题。显然，一个少妇不可能对道德哲学有什么兴趣，而她的图谋太过明显，当然就会让对方产生反感。\n\
    \n- 3. 确定对方乐于回答这个问题。每个人都会有不愿意让他人触及的隐私。谁碰触到了这些禁忌话题，谁就会让人厌恶。事实上，问对方不愿意回答的问题是一种相当冒失的行为。比如，有人问“你一个月赚多少钱，够花吗”，相信你也会觉得这种很讨厌。\n\
    \n切记，提问题，就要提既彰显自己的诚意，对方又乐于回答，而且还是对方能够轻松回答、显示其才华的问题。这样才能达到恭维、迎合对方的目的。\n\n## 5.\
    \ 与人交谈，要坐有坐“向”\n\n某电视台的一个评论性电视节目中的评论人都是临时随机选取的。制作人本以为这种随机性、临时性形成的节目走势的不可预测性能够吸引很多观众，谁知收视率却极不理想。分析了原因后，制作人认为节目的辩论缺乏高潮是症结所在。\n\
    \n然而，对于这种没有经过预先安排的评论发展到高潮与否，人又怎么能控制得了呢？针对这个问题，制作人请教了许多专家，专家们也提出了改良意见，不过效果都不甚理想。\n\
    \n后来，有一位心理学家了解到，辩论者们都是横排而坐，就提出“改变座位的配置方式的建议，让辩论者们两两相对而坐”。\n\n制作人抱着“活马当死马医”的态度做了尝试。令人意想不到的结果产生了，后续节目中的讨论几乎每次都会有辩论高潮，而且其热烈程度超乎想象。没多久，这档节目的收视率连创新高。\n\
    \n那么，为什么面对面的坐向能够刺激争辩的激烈程度大幅上升呢？心理学家们做了如下解释：\n\n一是人的视线逼视对心理产生了影响。与人相对而坐，正面直视，即使没有刻意凝视对方，由于位置的原因，也会使人对视，甚至具有一定的攻击性；而这种视觉“感受”会给人造成一种自然的压迫感和不自由感，进而激发起彼此的对立心理，使彼此关系紧张。相反，坐在对方的旁边，避免了视线的直接交锋，减弱了对立性，彼此也就不容易对立起来。\n\
    \n二是人类固有的潜意识产生了影响。在人的潜意识深处，很自然地将在自己旁边的对象看成是伙伴，而将自己对面位置的对象看作是敌人。受这种潜意识影响，面对坐在自己旁边的人，即使与他争论也不会过于激烈；而坐坐在自己对面的人，即使不争争吵，也多少会有些距离感。\n\
    \n三是注意力激化了争论。如果是并排而坐，争辩时必然要扭转头，时间一长、次数一多就会使人感觉到疲累，进而原本专注于争辩之中的注意力被分散，斗志骤减。这样也就不容易产生激烈的争吵。然而，面对面地坐着，一方面省去了扭头的力气，避免了注意力被分散；另一方面，将对方作为唯一的认知对象，使注意力更加集中，这样自然会越争越厉害。\n\
    \n显然，在交谈中，你的坐向影响着对方对你的态度。因此，当你与人交谈时，想要让彼此间的交流进行得和谐而顺利，就不得不注意选择自己的坐向。一般来说，有以下几点是应该注意的：第一，正常沟通时，侧身而坐，或取直角位置为宜。这种坐向传递给对方的是一种友好的信息，而不会让对方有压迫感和紧张感。第二，在赞美人时要横向或倾斜交叉而坐。这样的坐向能让对方感受到你对他的关注、重视，给人很诚恳的感觉。第三，安慰人时要并肩而坐。这种坐向是一种“我就在你身边，关怀你、安慰你”的暗示，能让对方感到温暖，达到安慰对方的目的。\n\
    \n照顾到了坐向细节，相信你与他人的交谈一定能够更加顺利。\n\n## 6. 创造良好的交谈氛围\n\n20世纪70年代，心理学家亚历山大等提出了情境同一性原理。他们指出，对于每一种社会情境或人际背景，人都有一种最合适的行为模式与之相匹配，这种行为模式与其情境具有同一性，故称为情境同一性。\n\
    \n在与人交往的过程中，人们发现，如果双方都能处于情感共鸣的状态中，那么这样的交往能在很大程度上促进彼此关系的发展。而心理学家认为：在交往过程中，人与人之间感情的认同和共鸣，是通过当时特有的情境刺激所形成的互通和互相感染的结果。因此，在进行社交活动时，我们应该积极创造情境同一性。就此，心理学家提出了以下几个建议：\n\
    \n1. 创造好的交往环境。人所处的环境，包括地点、气氛等一系列因素，都会影响人的情绪。在人际交往中，选择一个舒适的、气氛融洽的环境，能使人的情绪处于良好状态，从而更容易进入交往状态。\n\
    \n2. 找到共同话题。共同话题能够引导对方进入自己设置的情境，或者进入对方期望的情境，进而创造出情境同一性。\n\n3. 体味对方的情绪。人的情绪是具有波动性的，情绪好能促进人际关系，情绪不好则可能对社交产生负面影响。因此，要学会体味对方情绪，这样才能体谅对方，才能做到心中有数，做出恰如其分的反应。\n\
    \n4. 利用相似原理。俗话说“物以类聚、人以群分”，人们总是倾向于和那些与自己有更多相似点的人交往，并且对他们有一种潜意识的好感。因此，努力去发现彼此的相似之处，能够使自己更容易认可对方，同时也更容易使对方接受自己，进而成功创造情境同一性。\n\
    \n5. 塑造最有利于交往的个人形象。对于对方来说，我们的个人形象同样属于外界环境中的一部分，因此塑造一个最有利于交往的个人形象也是不容忽视的。具体地说，可以从这几个方面来努力：真诚微笑，耐心倾听，谈论符合对方兴趣的话题，适当表现自己等。\n\
    \n通过制造“同一性”的情景，就有了一个成功的开始，那么如何成功地继续话题也是非常关键的。良好的交谈氛围缺少不了双方谈话的欲望，毕竟交谈都是双向的，那么你应该如何来激发对方的谈话兴趣呢？\n\
    \n首先，你可以从对方身上的亮点着手，进行提问。你可以问对方：“你的衣服看起来真不错，是在哪里买的？”“你的气色看起来真不错，有什么保养诀窍呢？”……\n\n\
    接着，将谈话的层次加深，向对方请教他所擅长的问题。比如对方是个教育工作者，你可以对他说：“现在的孩子越来越不好管了，面对那些鬼灵精我是一点儿办法都没有，你有什么妙招吗？教教我怎样对付他们?”\n\
    \n最后，再不着痕迹地将话题引导到你所要谈的正题上来。由于前面对方已经打开了自己的话匣子，出于对自身行为前后一致的心理需求，对方也就不会三缄其口了。\n\n\
    ## 7. 向记者学采访技巧\n\n记者是一种社交性很强的职业，它要求从事该项职业的人具有让采访对象畅所欲言的能力。那么，老练的记者是怎么做的呢？\n\n\
    首先，他们会抱着“我喜欢采访对象”的心态来开始采访工作。\n\n心理学上有一个著名的“皮格马利翁效应”，说的是皮格马利翁爱上了一座美丽的少女雕像，从此他每天都深情地对石雕像倾诉自己内心的爱慕，终于，雕像被他感动了，真地成为一位活生生的美女。当然这只是一个传说，但就促进人际关系的发展而言，“喜欢对方”的确能发挥很大的功效。\n\
    \n只要你抱着“他是一位好人，我喜欢他”的想法，对方多半会与你推心置腹地交谈。反之，如果你带着一种讨厌对方的情绪与对方进行交谈，对方往往会表现得相对抵触，而交谈也会不欢而散。\n\
    \n非指示疗法和协议中心疗法的创始人 C. R. 罗杰斯曾说过：“以无条件的诚意进行会谈，能够打开对方的心灵，同时也能使对方对自己产生好感。”\n\n其次，记者们的采访往往都是从无关紧要的闲聊开始的。\n\
    \n任何情况下，你主动与人会面、交谈，肯定都有你特定的目的。如果一开始你就立刻让话题直奔目标，那么结果很可能是对方拒绝回答，或者对方做岀不实的回答。\n\n\
    之所以会产生这样的结果，主要是因为直奔目标的交谈方式有两大弊端：一是开始就要求对方通过仔细思考作出回答，会让对方产生极大的心理压力，进而引发对方的抵触；二是开始就直奔自己的目的，会让对方产生一种被你忽视的感觉而产生心理阴影。\n\
    \n一旦你采用这种方式造成了彼此间的鸿沟，那么，无论你之后说得如何天花乱坠，也很难将局势挽回。所以，在见面之初，先与对方谈论与他相关的既成事实或经验的话题，然后再慢慢地向你自己的目的靠拢，才能够让你达到目的。切记，心急吃不了热豆腐。\n\
    \n第三，怎样称呼对方是关键。\n\n心理学家指出，想要与一位初次见面的朋友快速地热络起来，称呼是关键。你最好称呼对方的姓名，而不要“XX科长”“XX经理”“XX主任”“XX董事长”等。因为人一旦被冠上了这些头衔，就会扮演起相应的角色，会特别注意该角色的任务和地位，并借此掩盖起那个“真我”；而称呼对方姓名则能够给对方一种“你现在已不是一位科长（经理、主任等）”的心理暗示，暗示对方是单纯的一个人，从而解除其心理武装，而且还可以预防对方在谈话之后以“我还要征求经理的意見……”之类的托词来敷衍你。\n\
    \n当然，不排除有一部分人非常喜欢别人称呼自己的头衔以满足自己的虚荣心。对这种人，你不能直呼其名，而要投其所好地称呼他的头衔来满足他的虚荣心。这样才能获得他的好感，进而使他在你面前畅所欲言。\n\
    \n向记者学得这3招，一定能让你顺利地打开对方的话匣子。\n\n## 8. 如何使对方说不愿说的话\n\n生活中，一个人之所以会有不愿意说出的话，主要是为了保护他的“自我”，如果这些心里的话说出口，就会让他觉得尴尬，或让他觉得有损自我形象，又或者会让他有危机感。针对这种情况，你如果能够打消他的心理疑虑，就能让他说出本不愿说的话。\n\
    \n为了打消对方的心理疑虑，让其说出本不愿说的话，你可以采用以下心理策略：\n\n- 1. 不直接问对方，而让他以第三者的身份来说出心里的话。比如，你想问一位年纪较大的人对时下年轻人的看法，如果你直接问对方：“你对现在的年轻人有什么看法呢？”对方很可能轻描淡写地回答说：“还不错，很有朝气……”你听到的只是一些表面上的恭维话，而非他内心的真实想法。但是如果你换一种问法，问他：“你觉得，像你们这个年纪的人会以什么样的眼光来看时下的年轻人呢？”这样，对方就可以从第三者的角度，以“这个年纪的人”的身份说出一些较中肯的评价，而不用担心说出心里话会引发年轻人对自己的反感。因为他发表的虽然是自己内心的想法，但却是以他人的身份，这样就将批评性言论与自己撇清了干系，消除了疑虑。\n\
    \n这种方法是辅导人员、会议主持人、节目主持人等常用的技巧。他们深知这种方法能够使对方觉得说出的话与“自我”无关，从而毫无顾忌地、放心大胆地高谈阔论。\n\n\
    - 2. 动摇对方的内心。或者向对方表示同情，或者温言劝慰，或者作势吓唬……无论是软的还是硬的，只要你让对方内心产生了动摇，对方就会说出原本不愿意说出的话。\n\
    \n说到动摇他人内心的攻心之术，我们不得不承认警察是专家。他们采用的攻心之术主要有这几种：\n\n    - ①要选择毫无装饰的房间作为质询嫌疑犯的地点，这样做主要是为了防止嫌疑犯的注意力分散而减弱攻心术的效果；\n\
    \    - ②审讯者在言行上会突显自己的权威性，以给嫌疑犯一定的心理压力，让嫌疑犯自己把自己的心门打开，进而说出实情。比如审讯者往往会以非常严厉的口吻说“坐下！”“看这里！”等；\n\
    \    - ③向嫌疑犯传递同情对方的信息。这样能够让嫌疑犯觉得自己和审讯者有心理共鸣，从而不自觉地撤销自己的心防。\n\n总的来说，要想使对方说出本不愿意说的话，有迂回取胜和直接进攻两种方式。\n\
    \n所谓迂回取胜是指通过巧妙的提问，让对方的“自我”不必为“第三者”的言论负责，这样对方就可以放心地发表意见了。要知道，一旦事情与“自我”产生了联系，人就会表现得非常敏感、谨慎；而如果这种联系不存在的话，人就会少很多疑虑和顾忌。至于直接进攻，你完全可以向警察学上一两招。或者施加压力，让对方不堪重负之下说出心底的话；或者表达同情，使其放松警惕，自然而然地说出心底的话。\n\
    \n## 9. 将正式场合转换为非正式场合\n\n很多有经验的摄影师为了捕捉到摄影对象最自然的一面，常常会对对方说“好，拍完了，谢谢你的合作！”这句话就是捕捉到最自然的表情的诀窍。\n\
    \n一般人在面对照相机的时候，因为太想展示自己最好的一面，结果反而使心理过度紧张，表情也会显得不自然；在这种情况下，一句“好，完了”，将正式的场合转换成非正式的，被拍摄者紧张忐忑的心理也因此而放松平静下来。在这一瞬间按下快门，就可以捕捉到对方那种充满解放感的自由又自然的表情。\n\
    \n的确，正式场合往往会引起个体强烈的心理紧张，这时，人的戒备心理会非常浓厚，会采用各种方式来伪装、保护自己，显得非常拘谨。然而，如果将处于这种紧张状态之中的人突然从正式场合置放于一个非正式的场合，其心理就会立刻松懈下来，从而流露出自己本色的一面。\n\
    \n如果你能够有意识地将正式场合转换为非正式场合，那么就能让对方觉得安然，从而毫无顾忌地表现自己的内心世界。\n\n相信你一定有过这样的经历：\n\n在座谈会或某些聚会上，在作正式的发言时，你往往会表现得很谨慎，对说出口的每一个字，你都是经过深思熟虑的。然而，如果这时主办人告诉你“好了，会议就开到这里，接下来大家可以自由活动……”又或者主人说“非常感谢大家的光临！下面请大家玩得尽兴……”那么，你一定顿感轻松，从而不知不觉地吐露自己的心声。\n\
    \n由此可见，人的心理容易受到所处场合的影响，通过有意安排非正式的空间，能够让人安心地吐露自己的心声。\n\n日本著名心理学家多湖辉曾向人讲述了这样一件事。\n\
    \n有一位税务官去调查一位十分精明、很难对付的企业经营者。在整个调查过程中，那位经营者表现得非常谨慎，几乎可以说是滴水不漏。虽然税务官明明知道他的经营存在税务方面的问题，却没有办法找出他的破绽。\n\
    \n全部调查结束后，这位经营者终于放心了。这个时候，税务官一边喝着茶，一边若无其事地与他闲聊，指着墙上的一幅画说：“真是一幅好画呀！”经营者随后答道：“是呀，这可不是一般的仿制品，而是一幅难得的珍品！”\n\
    \n就这样，经营者在税务官营造的非正式场合气氛中，由于心理不由自主地降低了警揭，从而露出了漏税的马脚。\n\n生活中，这种情况可谓屡见不鲜。因此，想要让别人畅所欲言，你可以将正式场合转换为非正式场合，进而使其心理放松，在不知不觉之间吐露出自己的心声。一般来说，你可以通过以下两种方法来转换场合：\n"
