    是 为了满足自己的好奇心，而不是出自关心才渴望知道事情的经过的；


    ②当对方说到自己陷人麻烦之中时，你要让对方知道，如果可以，你会竭力地帮助他；即使那些麻烦事已经过去，你也要向对方传递你“很遗憾没能在当时为你做点什么”的信息，这有利于对方进一步打开自己的心扉；


    ③如果对方提到自己的错误，你要注意消除对方心中的担忧和疑虑。人说起自己所犯错误的时候，心中都会担心他人因此而否定自己，一旦内心被这种担忧所占据，人就很再畅所欲言了。因此，你可以告诉对方你觉得有必要才会做那件事，否则你干贤要做？”“你那样
    做一定有自 的 原因。”……告诉对方 “他之所以会那么做”，是因为“他有足够 的理由那么做”，即使做错了，也在情理之中。这样 能让对方觉得你是理解他的，你相信他，这有利于谈话的继续进行。


    在谈话中，如果你能用好上面的策略，就一定能让对方打开自己的话匣子。'
