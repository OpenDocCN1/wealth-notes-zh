    # 7.打造精诚合作团队的技巧


    朋友间、家人间产生矛盾，相见不相识的情况是常有的。那么，还有可能握手言和、并肩作战吗？当然是可以的。只要学会使用下面这些心理策略，其效果绝对立竿见影。


    首先，为团队成员寻找一个共同的敌人。无数研究表明，当外来敌对势力的威胁来临时，团队的内部成员多倾向于一致对外，从而忽略彼此间的分歧。外来敌对势力的出现，激发了成员参与抵抗的内在需求，为了保持高度的一致感，必须寻求团队的内部支持。因此，像国家内战、社会动乱、组织内纷争等内部矛盾，往往能在共同的敌人出现之际得到平息。相反，在没有外力威胁的情况下，成员个体就容易把其注意力以及敌意转到团体的另一成员身上。


    由此可见，共同的敌人是让团队成员精诚合作的最便捷的方法。你可以人为地制造一个外来的威胁，也可以使你的团队与另一个团队展开竞赛。一个共同的敌人能立刻让团队中敌对、矛盾的双方站到同一战线上。其效果之快速是其他任何一种提高团队凝聚力的技巧都无法比拟的。


    这个现象在个体身上同样体现得淋漓尽致。对于个人来说，一颗心就像一个团队，人如果没有了外来的威胁，就容易自己跟自己斗气，心理的不同方面敌对、矛盾起来，进而产生心理痛苦。然而，一旦有了一个清楚明确的外在目标，内心的混乱与躁动就会得到平'
  - '[PAGE 267]


    息。你一定有过这样的体会:当你拥有明确的生活目标时,你就会思路清晰,注意力集中,内心充实,情绪也好;而如果你整天无所事事,就容易被“芝麻绿豆小事”困扰,甚至是没来由地痛苦难受。因此,用外来的有趣事物吸引人,可以让人的心情变得不那么烦躁不安。


    其次,给团队一个好名称。心理学家研究发现:游戏或者竞赛的名称在很大程度上左右着竞争的结果,它的影响甚至超过了参与者的性格。


    在实验中,参与者被随机分成两组进行同一种游戏,一组被告知游戏名称为“华尔街”;另一组被告知游戏名称为“社区游戏”。结果,前一组的竞争力明显强过最后一组。


    从中,你或多或少可以得到一些启示:当你为整个团队或者所参与的竞争活动命名时一定要非常慎重。一般来说,团队的名称越积极,比如“公正”、“胜利”等,越能促使其成员合作无间;而竞争活动的名称越能体现外来的威胁有多么强大,越能激发成员的合作意识。


    以上两个策略能够帮助团体成员间建立起一种和睦、团结、合作的关系,不过,即使这样做了,有些个别成员仍有可能因为自己的个性与其他成员不合而无法与团队达成一致。碰上这种情况,下面有3个技巧能够让你搞定他们,从而使成员间能最大限度地和睦相处,大大提高团队凝聚力。'
  - '[PAGE 268]


    ①让彼此对立的成员并肩坐，而不是对面坐。根据心理学上的“坐向效应”原理，面对面的坐向容易在心理上产生一种“彼此对抗”的感觉，从而使双方的对立立场更加坚定；而并肩坐则能够营造统一、合作的氛围，进而使彼此的矛盾消散于无形。


    ②为对立成员制造接近彼此的机会。心理学家认为，走得近、经常保持联系的人之间更容易精诚合作，而不容易产生矛盾。


    ③想办法让对立的双方进行身体接触。出于安全需要，每个人都会有一定的安全距离，比如，不容许敌人靠近自己，却可以和朋友拥抱。让对立双方进行  体接触，一开始的时候或许会让他们感到很别扭，但几次之后，他们就会产生“接近我的那个人是朋友”的心理感受，从而化解他们  对立。身体接触能让人  与人之间的亲密感倍增。


    相信掌握了这些方法后，想要打造一个精诚合作、凝聚力强的团队，对你而言必定是手到擒来。'
  - '[PAGE 269]


    # 8.给对方一个竞争对手


    在日本，有一个企业家经营着好几个工厂，但其中有一个工厂的效益始终徘徊不前，员工迟到早退、缺勤的情况屡屡出现，即使上班的员工也没有什么干劲，以致工厂的生产效率非常低，而且产品的不合格率非常高。虽然工厂管理者也想尽各种办法，想让员工们遵循领导的指示，但始终见不到效果。


    无奈之下，这位企业家只好亲自出马了。这天，这位企业家在早班员工们下班的时候来到工厂门口，拉住员工们问：“你们今天完成了几次生产流程？”员工回答道：“6次。”企业家听完后，一句话也不说，只是用粉笔在旁边的公告板上写下“早班人员6次”。


    然后，晚班人员下班的时候，这位企业家又出现在了工厂门口，同样向班班人员询问他们生产流程的次数，然后在公告板上写下“晚班人员7次”。


    紧接着，早班工作人员再次入厂时，看了两个数字的对比之后，竟一举将自己的生产流程记录刷新成了8次，并且下班的时候，主动将公告板上的“6”改成了“8”。到了晚上，夜班人员不甘心就此被早班人员超过，为了刷新记录，就做了10次生产流程，而且也在公告板上写下“10”。


    这样过了一个月，这个工厂的生产效率竟奇迹般地提高了，而且成了这位企业家所经营的工厂中效率最高的一个厂。'
  - '[PAGE 270]


    显然，这位企业家很善于抓住人的心理。他用一支粉笔记录员工的工作业绩，通过竞争，激发起员工们“自我优越”的欲望，使得原本懒散拖拉、毫无干劲的员工们表现出前所未有的积极性。


    由此可见, 如果你想要对方按照你的指示行动，就不妨在对方身边安排一个竞争对手，让他们比赛，看看谁将你的指示执行得最到位。


    每一个人都有自尊心和自信心，在潜意识中，都希望自己能够站在比别人更优越的地位上，或者说希望自己能被他人当成重要的人物。这种心理就是心理学上所说的“自我优越”的欲望。在这种欲望的指使下，人会向着积极的方向努力，简单地说，自我优越的欲望是激发人们干劲的基本元素。


    人类这种自我优越的欲望在有特定的竞争对象存在时会表现得尤其强烈。因此，通过给对方安排一个竞争对手，来激发对方自我优越的欲望，从而使得对方按照你的指示行事，这无疑是一种行之有效的方法。


    值得注意的是，当你给对方安排竞争对手的时候，最好避免以直接的方式提示对方，比如对他说：“他就是你的竞争对手。”这样效果往往很差，因为这种做法会让对方感受到一种强制性的压力，从而激活了对方的心理防御系统，反而会让对方产生反抗心理。


    比如，你的司机最近工作态度欠佳，开车时总是心不在焉，这'
  - '[PAGE 271]


    让你十分没有安全感。那么你怎样才能让他听从你的指示、专心工作呢？显然，直接指责他并不是一个好主意。你可以对他说：“你认识XX先生吧？他好像还是你的晚辈， 他的工作态度非常认真，给人的印象很好，有机会代我请他到家里来坐坐。”这样就能激发起对方想要赢的欲望。听完你的话，对方一定会想：“是啊，我可一定不能输给他，我比他资深多了。”


    给对方安排一个竞争对手，能在很大程度上调动对方执行你的指示积极性，使得对方主动去执行你的指示。


    此外，为了防止激发对方的逆反心理，你还需要给予对方充分的自由和信任。


    我们知道，在电力还没有普及的时候，很多旅馆都采用让顾客自己将在房间里饮用的饮料填写在表单上然后结账的方式。也许你会问，这种自我申报的方式，难道不会因为顾客的隐瞒而造成损失吗？事实上，根据统计，隐瞒使用数量的顾客人数是微乎其微的。


    的确，人都有这样一种心理：别人对自己越是信任，自己就越不想欺骗对方， 会表现得更加自律。心理学家指出，他人所给予的信任，能够激发人的自我价值感。如果辜负了他人的信任，在某种程度上就等同于自己否定了自我价值，而当人的自我价值被否定的时候，内心是相当痛苦的，更何况否定自我价值的那个人还是自己。因此，当一个人被对方赋予足够的信任时，做出有违对方信任的行为的可能性是非常低的。'
  - '[PAGE 272]


    由此可见，如果你想让对方听从你的指示，按照你的指示去做，就应该给予对方充分的信任，这样能够有效防止对方口头上应允、实际上却违逆你的指示行事。


    这种策略，在企业管理中是被应用得最为广泛的。比如，很多公司对外勤业务人员都采取先自行垫付交际费，然后再报销的管理制度。而这种管理方式不但没有使交际费开销过大，事实上，绝大多数业务人员上报的交际费都低于公司的预算。


    有一个木工工厂为了节省人事费用，曾经设立了一个无人管理食堂。食堂采取员工自助刷卡、自助取餐的方式。一开始的时候，食堂的收支一度呈现赤字。为此，有人建议在员工大会上重点说说道德观念的问题。然而厂长却认为，与其批判员工的道德观念差，不如给予员工更多的信任，毕竟，不信任员工的企业是很难有所发展的。于是，厂长反其道而行之，将食堂的收支细节都刊登在厂刊上。这篇报道发出以后，食堂的收支赤字便扭转了。


    与此相反，倘若你总是对对方疑神疑鬼，时刻怀疑对方是否按照你的指示去做、是不是对你有所欺瞒，那么对方很可能按照你所期望的那样而对你有所欺瞒。因为，你的不信任使对方完全失去了自律的动力，而且对方还面对着诸如安逸、物质利益等诱惑，在这种情况下，对方完全按照要求完成指示的可能性就很小了。


    你给予对方的信任是对方进行自我管理的基础。显然，对方的自我管理要比你的“监视”有效得多。'
  - '[PAGE 273]


    此外，信任对方还有助于你与对方建立认同感，使对方更加积极地服从你。你一定有过这样的经历:无论他人对你的看法如何以及你是否成功完成任务，对方都信任你的话，你就会有一种找到知音的感觉，进而从心中涌出一种“士为知己者死”的豪气，下定决心听从对方的指示。


    因此,当你指示他人做事的时候，千万不要忘了向他人表达你的信任。'
  - '[PAGE 274]


    # ## 9.利用对方的从众心理


    看过那些令人疯狂的演讲或者演唱会的场面吗？演员往往会在灯光的照射下高举自己的右手登场，以此来吸引众人的目光。随着活动的进行，你会看到人群渐渐向中间靠拢，有人开始高呼主角的名字，随即，越来越多的人开始被这种氛围所感染，加入到疯狂呐喊的行列。最后，所有在场的人开始疯狂起来。这时，无论演员要众人做什么，人们往往都不会拒绝。


    事实上，那些首先往中间挤、首先开始高叫演员名字的人，在很大程度上可能是主办方故意安排的，也就是我们日常生活中所说的“托儿”。


    “托儿”之所以能够起作用，其实是人的从众心理使然。


    有心理学家做过这么一个有趣的实验：


    5 名实验参与者保持一定距离往前走。


    第一个人走到指定地点后停了下来，抬头望着天空；接着第二个人、第三个人……依次来到第一个人旁边，也一言不发地望着天空。


    心理学家想看看周围的路人对此情况会有何反应。结果，他发现周围的人都不由自主地朝那 5 个实验参与者望着的地方看去。


    社会心理学家认为，人类有一种模仿他人行为的本能冲动，而'
  - '[PAGE 275]


    这个实验中，周围路人的行为就是“从众心理”的一种表现。它是人们自觉或不自觉地以多数人的意见为准则作出判断、形成印象的心理变化过程。


    那么，人为什么会具有从众心理呢？


    心理学家迈尔斯认为：从众是个体在真实的或想象的团体压力下采取的改 变行为与信念的一种自我保护的倾向。也就是说，当个体感受到自己与群体格 格不入时，他往往会对自己的观点、判断和行为等产生质疑，进而调整自己的认
    知及行为，使之符合群体的、社会的标准和规范。


    人们的潜意识认为，从众是合乎他人心意的，是受欢迎的；不从众不仅不受欢迎，还会招来灾祸。大多数情况下也的确如此。比如：一位反道行驶的汽车司机会引起众人的责难；万众肃规静的剧场里，一个观众突然歇斯底里地大声喊叫，会让人讨厌，甚至捧场场去……公众几乎都讨厌越轨者，甚至会对他群起而攻之。


    在现实生活中，几乎每个人都受到从众心理的影响。比如在百货公司大甩卖的现场，如果身边的每个人都争先恐后地购买商品，那么你往往也会被这种气 氛感染，并且在不知不觉中购买了自己并不需要的物品。


    还有，很多人都说在电影院里看电影特别有感觉，笑和哭都痛快淋漓，这也是因为，在一个封闭场合里，人会不自觉地与众人保'
  - '[PAGE 276]


    持情感一致，并且，因为一致，所以能够无所顾忌地将自己的情感表达出来。因此，在电影院看电影才特别有感觉。


    同样，如果有几个人开始满怀热情地服从管理者的指示的时候，那么其他人也多半会表现出一致的态度和行为倾向。也就是说，要想众人都服从你的指示，你不妨有意识地在众人中安排几个“托儿”。这样往往能够使你的指令被执行得更好。'
  - '[PAGE 277]


    # 10.给对方一个宣泄的渠道


    心理学中有一个非常重要的“霍桑效应”，有人称之为“宣泄效应”或者“实验者效应”。


    霍桑工厂是 20 世纪 20 年代美国芝加哥郊外的一家生产电话交换机的工厂。这家工厂的设备先进，各种生活和娱乐设施十分完备，员工的社会福利也做得非常不错。但是，令厂长不解的是，在这样优越的工作条件下，工人们的生产效率却长期低下。


    面对这个奇怪的现象，1924 年 11 月，一个专家小组（包括心理学专家在内的各个领域的专家）对其进行了实验研究。


    研究初期，专家把注意力集中在工作条件和生产效率之间的关系上，他们把工厂员工分为实验组和控制组。然后，对工作条件进行各种改变，观察员工生产效率的变化情况。


    结果，不论是将工作条件变差还是变好，实验组生产效率都上升，而且工作条件维持不变的控制组工作效率也上升。这样的结果完全反映不出工作条件的好坏对生产效率有直接影响。


    很快，实验研究进行到第二阶段，这个阶段的实验领导者是哈佛大学的梅奥教授，由他来看重研究社会因素与生产效率的关系。


    梅奥教授挑选了“继电器装配组”的 6 个女工作为实验对象，然后开始了长达一年多的实验观察。'
  - '[PAGE 278]


    首先，女工们被要求在一个一般的车间里工作两个星期，便于专家测出她们的正常生产率。


    接着，尝试对女工做以下改变，并观察生产效率的变化情况：


    +   ①将女工的薪水按照车间整体产量进行工资支付的方法改为按照个人产量计算工资。


    +   ②在工作中，安排女工们上午、下午各休息一次，每次5分钟。


    +   ③把女工们的休息时间从5分钟延长到10分钟。


    +   ④把休息次数从上午、下午各一次增加到一天6次。


    +   ⑤公司为女工提供一顿简单的午餐。


    +   ⑥允许女工们在保证产量的前提下提前半小时下班。


    +   ⑦建立每周工作五天的制度。


    +   ⑧前面所做的变化全部取消，重新回到实验最初的模式。


    结果显示，女工们始终保持了高产量，而工作的积极性也始终呈上升趋势。即使到最后她们的一切优待被取消之后，她们的生产效率也没有下降。


    整个实验过程中，许多因素都变化了，但是女工们的生产效率却表现得相当稳定，也就是说，必然有一种相对稳定的因素在维持着她们的工作积极性。几经思考后，梅奥教授得出了这样的结论：生产效率的提高主要是由于女工们的精神状态发生了巨大的变化。女工'
  - '[PAGE 279]


    们被挑选出来，并被研究人员所关注，这使她们觉得自己对于公司来说是非常重要的，从而受到激励，促进了生产效率的提高。随后，在此基础上，专家们又展开了一次涉及面更广、为期更长的“谈话实验”。


    在“谈话实验”中，专家们对厂内2100名职工进行了采访。


    起初，他们按事先设计的提纲提问，以了解职工对工厂管理、福利等方面的意见，不过生产效率没有因此明显提高。


    后来，专家们将以提纲为基础的文答谈话方式改为由员工们自由抒发意见，想说什么就说什么，同时，原来一个专家同多个员工的谈话方式变成了一个专家同一个员工的单独谈话。在谈话过程中，专家要耐心倾听，认真记录员工们对厂方的各种意见和不满，不得反驳和训斥。


    在为期两年的实验周期里，专家们前前后后与工人谈话的总数达到了两万余人次。而这一次，整个工厂的产量大幅度提高。


    专家们最后得出这样一个结论：当某个人受到公众的关注或注视时，或者心情畅快地做事时，其工作效率就会大大增加。这就是后来说的“霍桑效应”。


    人不是单纯的“经济人”，并不只受经济利益驱动，人还是“社会人”，是复杂的社会关系中的一员，来自社会关系中的积极因素同样能够给人以强大的动力支持。这也就是在现代企业管理中，提'
  - '[PAGE 280]


    倡领导要多和下属谈话沟通的原因。在谈话沟通的过程中，下属们感到被关注，同时，还提出了合理化建议，这样，下属们就会获得一种积极舒畅的心情，所以工作干劲高涨，工作效率提高。


    生活中，每个人都会有许多满足不了的意愿，也会因此产生不满、自暴自弃等消极情绪和行为。这时，如果一味对其实施压制的话，反而会产生更加不利的效果。相反，如果能够让想办法使其心中的郁结宣泄出来，则能够促使对方表现出积极的一面。对他人、对自己、对事业、对身心都非常有利。这就是“霍桑效应”给我们的重要启示。


    在日本松下公司，所有厂里都设有吸烟室，里面摆放着一个松下幸之助的人体模型。如果员工对公司感到不满，就可以在吸烟室里用竹竿随意抽打“他”，以发泄自己心中的不满。等员工发泄够了，停手了，喇叭里会自动响起松下幸之助的声音，他说：“干事情可以有分歧，但记住，我们拥有共同的目标，即让自己生活更美满，公司更具竞争力，日本更繁荣、强盛、和睦。从今起，这绝不再是幻觉！我们朝着这个目标一起努力！”此外，松下对每个厂的负责人也提出了一定要与员工沟通，以确保员工能够心情舒畅地投入到工作之中的要求。显然，松下深谙“霍桑效应”的奥妙，才打造出了一个高效率的成功的企业团队。


    因此，如果你想要使他人展现出积极的一面来与你进行合作，关注他人情绪，给予他人一个发泄的渠道是一个不错的方法。'
