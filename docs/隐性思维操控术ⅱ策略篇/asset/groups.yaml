    # 2.不做单飞的雁，适当从众


    人同大雁一样都是群居型动物。只有“合群”的大雁才能顺利地达到理想中的目的地，掉队的大雁总是形影相吊，而且境遇悲惨，大多数情况下不可能飞得很高很远。人生也是一样，要使自己融人周围的社交环境中，才能“飞”得更高更远。


    莎莎在短短的一个月时间内连续更换了4次工作。无奈中，她只好去求助一位职业咨询师。


    “第一家单位的老板太苛刻，脾气太坏，我忍受不了他那张严肃的脸，结果我一气之下就走‘了’”莎莎不无遗憾地说：“不过那里的员工还不错。”


    职业咨询师问：“第二家呢？”


    “哦，我是一个相对安静的人，不喜欢吵闹的环境。我上了一周的班，就发现那个部门的人太活跃了，我受不了他们的笑声……”


    咨询师笑了一下，问：“第三家是什么问题？”


    “第三家我待的时间比较长，但是我反感在背后说别人坏话的人，我连续好几次听到别人说我清高，可是我不是那样的人。我的情绪受到了干扰，我想换个新的环境。”


    “可是我发现第四家的人更难相处，虽然他们都很安静，但是我觉得似乎也太冷漠了，我去了两天竟然没有人拿正眼看我……”'
  - '[PAGE 324]


    心理咨询师把身子向后仰去，说你的困难其实很好解决。你只需要明白，你要去适应环境，而不是让环境适应你。你要尽量“合群”，而不是把自己置于群体之外。”


    任何一个社会环境中，都可能有苛刻的人、异常活跃的人、在背后抱怨的人、冷漠的人，最甚者，这几种人可能同时存在，但是你所要做的就是“合群”。你要融人你的生活环境中，你要适应周围人的生活习惯，因为只有这样，你才能和他人很好地相处。


    社会心理学家认为，人都有一种“从众心理”。这种心理在行为上表现为模仿大多数人的行为；在认知方面表现为以多数人的意见为准则对外界作出判断和评价。也就是说，那些“鹤立鸡群”的人往往不能够得到众人真正意义上的接纳。


    因此，在人际交往中，一定要注意适当从众，融人周围的社会环境中，才能融洽地和他人相处。具体地说，以下几方面是需要留意的：


    1. 不要希望“鹤立鸡群”。我们应该在言行举止上表示自己的善意和坦白，并常常考虑对方的立场，言行及态度不要太过严肃或太注重形式，尽量和他人打成一片，不要强调自己高人一等，或摆出高高在上的姿态。


    2. 切忌锋芒毕露。比如，在公司里，要是你没事整天念叨“我要当老板，我要办产业”，就很容易被同事看作异己，把自己放在'
  - '[PAGE 325]


    同事的对立面上。如果不幸让老板知道，也会被老板当做清理的对象。要知道，在办公室李大谈人生理想是不妥的，你公开自己的进取心，就等于公开向公司里的同事挑战。因此，做人低姿态一点，是自我保护的好方法。你的价值体现在做事上，在该表现时表现，不该表现的时候就韬光养晦。但凡能做大事的人，都不是爱说大话的人。


    3. 表现适可而止。如果你有才能，应该要表现出来，但不可锋芒太露，否则容易遭忌。当你提出自己的见解之后，别人自然会判断此见解是否可行。如果不接受人家的见解又批评人家的意见，贬损他人而褒扬自己，这实在是下下策。


    4. 听听别人怎么说。诚恳地聆听他人的意见，亦是增进彼此间情谊的方法之一。莎士比亚说：“对于他人的话，你若善意听之，则你将得到五倍的聪明。”你要改善自己与他人之间的关系，那你就承认对方的长处，而且时常表现出“对我来说，你是非常重要的”，让对方觉得被重视。


    5. 对别人不妄加评论。即使对方炫耀自己的精明能干，你也千万不要轻易评价他骄傲虚荣的家伙，尽量让自己远离嫉妒和诋毁，学会真诚地赞赏和学习。


    6. 只当个暂时的听众。如果是对方有所抱怨，你不妨暂时充当听众，最好不要反驳或是加以附和，这样能够避免很多人际纷争。'
  - '[PAGE 326]


    # ## 3. 感谢对手，因为他是上天的恩赐


    古人说“生于忧患，死于安乐”，竞争和危机对人生的生存来说是必不可少的。在压力和挑战下，人才能够抵御天生的惰性，才不会松懈，才能避免在安逸中走向灭亡。


    在挪威，沙丁鱼是人们的挚爱，因此沙丁鱼非常畅销，而且活蹦乱跳的沙丁鱼往往能比那些死的沙丁鱼多卖出好几倍的价钱。遗憾的是，沙丁鱼大多数在捕捞后返航的途中就已经死了。为了能使它们活着到达码头，渔民们尝试了许多办法，但是都没有成功。


    后来，人们发现将一条鲶鱼放进装满沙丁鱼的鱼槽里，就能够解决问题了。原来，由于鲶鱼对周围环境很敏感，把它装入鱼槽后，它会不安地四处活动，而沙丁鱼发现这个紧张地四处游动的家伙后也会不安起来，因而加速游动，如此一来，沙丁鱼便能活着抵达码头了。


    后来，这种现象引起了心理学家的关注，他们认为：通过个体的“中途介入”，激发群体中其他个体的竞争意识，可以大大地提高效率。这就是所谓的“鲶鱼效应”。


    早在2000多年前，我们中国人的祖先就发现了“鲶鱼效应”的存在，并将它运用到养马的过程中。他们在马厩中养猴，这样就能够有效趋避马瘟。猴子天性好动，每当这些马松懈倦怠的时候，猴子就会去撩拨它们，这样就让马时刻保持忧患心理，并且还得到了一定'
  - '[PAGE 327]


    的训练, 从而提高马对血吸虫病的抵抗能力。


    在马厩中养猴, 可以使马匹更加健康, 由于猴子有“弭马温”之称, 所以有人 将这种现象称为“弭马温效应”。


    “鲶鱼效应”普遍存在于自然界。动物学家们发现, 鹿群如果离开了狼等天敌, 其身体素质和整体的繁衍就会呈下降趋势。事实, 上没有对手、失去竞争意识是一件非常可怕的事情。


    有了对手, 才有危机感, 才有竞争力。有了对手 才有动力去奋发图强, 去革故鼎新, 去锐意进取, 因为, 人们知道, 如果不这样的话, 唯一的命运就是被吞并、


    被替代、被淘汰。“鲶鱼效应”告诉人们, 应该为自己找一个竞争对手, 这样更有利于自己的发展。


    在赛跑比赛中, 枪声一响, 众人齐发, 难分先后。但有一个策略却是常用的:


    选手们都会跟上某位对手, 在恰当的时机突然加速超越, 然后寻找另一位对手, 跟上他、超越他……如此一直冲至终点。


    长跑, 尤其是马拉松比赛, 是一场体力和意志力, 尤其是意志力的角逐。有人就因为意志力不足, 而在体力达到极限之前就退出了比赛; 也有人本来领先, 但却因为没有短期目标而在不知不觉间慢了下来,
    被后面的选手赶上。如果能跟住某位对手, 就可以避免这些情况的产生, 一方面, 对手可以激励我们产生“不能被他甩开,'
