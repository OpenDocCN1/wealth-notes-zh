    # 8.心理平衡，社交才能和谐


    1958 年，社会心理学家海德对人如何处理自己的人际关系问题做了专门研究，并提出了“平衡理论”，又称“P、O、X 理论”。


    P 与 O 各代表一个人，X 是第三者或事件;P、O、X 三者共同构成了环状闭合系统;三者间的关系按其正负特点，分别取+1 或-1，如果关系取值相乘结果为
    +1，则人的心理处于动态平衡，反之则不平衡。


    假如 P 是我们自己，O 是交往对象，X 是对喝咖啡的看法，那么，就会形成如下图所示的人际交往互动关系。


    ![](img/b69d9847e8d39a1178cebda87e1c1cd9_36_0.png)


    当对方喜欢喝咖啡（即:关系 2 取+1），认为喝咖啡对于我们来说也是一件 愉快的事情（即:关系 3 取+1），并且对方喜欢我们（即: 关系 1 取+1）时,
    对方的心理状态才能平衡。


    海德认为，人类普遍有一种平衡需要，人们喜欢完美的平衡关系，而不喜欢不平衡的关系。一旦人们失去平衡,就会在心理上产生'
  - '[PAGE 37]


    紧张，从而促使人按照“最小努力原则”重新找回平衡、转向和谐。


    在上面的例子中，假如对方喝咖啡并不是我们所喜欢的（即：关系 3 取−1），而对方喜欢喝咖啡（即：关系 2 取+1）时，如果对方是认可我们的（即：关系 1 取+1），那么关系
    1、2、3 的乘积为−1，对方心理产生不平衡，感到紧张。为了摆脱紧张感，对方就会遵循“最小努力原则”来进行调整。


    当对方认为，要使自己不喜欢我们比使 自己不喜欢喝咖啡更困难时，对方就会放弃对喝咖啡的喜好，即：关系 2 取−1，来重新找回平衡。反之，如果放弃喜欢喝咖啡比较困难的话，对方就会变得不喜欢我们。


