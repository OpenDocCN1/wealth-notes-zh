    ## 处理嫉妒心理的策略


    而是他是否有责任感、是否有进取心。虽然我对他印象不坏，但感觉他似乎总在炫耀自己有钱，我想他大概是想借此来弥补自己心灵的空虚吧！所以，有时，我很替他难过。”听了你的这番话，相信你的男友应该不会再因你和这位蓝领知己交往而打翻醋坛子了，因为“钱”已经不再对他有威胁。你的男友可能会想：“那家伙也真够可怜的，因为钱多所以对我女朋友一点吸引力都没有。还好，我不是有很多钱！”这样，他不仅不再妒忌，反而因没钱而感到安慰。


    一般来说，通过贬低其他人有而妒忌者没有的东西来抬高妒忌者的自我价值，使他不关注自己的价值，他的妒火就会熄灭了。然而，生活中总有例外。比如对方属于顽固派，即使你这样做了也没有产生什么效果，或者对方的妒忌已经到了疯狂的地步，那么你还有计可施吗？


    这些人的妒忌是源于心灵深处的不安全感。他很难信任人，他已经钻到了牛角尖里，他的脑子已经完全被失衡的情绪糊住了，因此，他的妒忌往往是莫名其妙的、没有逻辑可言的，无论你怎么做或者说什，即使是最清白无辜的情况，他也会妒忌。


    显然，他们中“妒忌”的毒太深了。此时，除了“以毒攻毒”外，别无他法。具体做法就是：你也公然地妒忌他，把他的言行发扬光大后再还给他。这样，他的妒忌将发生戏剧性的转变，一则你妒忌的风头压过他，看见更厉害的，他会本能地“抱头鼠窜”赶紧撤退；二则，看到自己竟然让你妒忌成这个样子，自然找回了一些成就感，有了成就感，自我价值得到肯定，安全感也就慢慢回来了。


    谁说“不遭人妒忌的人是庸才”？只要善于用策略操控对方的自我价值感，你不仅能作“鹤立鸡群”的人才，而且也不会被他人的妒忌所困扰。


    ## 7. 适时冷却，有利于解决问题


    “淬火”是金属模具加工的最后一道工序，是指把烧红的模具放入冷水中进行冷处理，让模具变得更加坚硬、耐用。事实上，不只是模具经过淬火以后会更加耐用，人际关系亦是一样的。当你与他人发生矛盾时，暂时“冷却”彼此的关系，往往会比较攻讦更有利。


    生活中，有的人反应快但错误多，属于冲动型，有的人反应慢但错误少，属于熟虑型。两种类型各有利弊，但是“暂不处理”能够使两者之间达到平衡。如果善于利用“淬火效应”，你就能在人际关系场中游刃有余。


    但是，需要注意的是，“暂不考虑”不是永远忘记，一旦时机到了，就应该马上开始行动，这样才能解决问题。


    有一个男孩就是利用这种方法追求自己心仪的女孩，最终成功地把她变为自己的妻子。刚开始的时候，他每天都在女孩下班的时候送她一件小礼物，没有一天间断，一连送了十五天。到了第十六天的时候，他突然就不送了，第十七天他仍然没有送，第十八天他又送……显然，这个男孩是操纵人心的高手。前面十五天都送，已经让女孩习惯了他对自己的关怀；第十六天开始突然不送，能够让女孩冷静地想清楚男孩对她来说到底意味着什么，没有男孩自己会少了什么；第十八天又送，是为了防止女孩忘记自己而习惯没有他的生活。


    这就是典型的“淬火效应”的应用，适时地冷却不但不使彼此关系冷淡，反而会加深彼此的交往，更利于彼此关系的进一步发展。“淬火效应”不仅能促进彼此的关系，而且能够缓和人际关系中的矛盾，达到越吵越亲的效果。


    在人与人交往的过程中发生争吵，往往是由于两人极其不冷静，或者至少是有一个人失去了理智而造成的。无论是哪一方的原因，当争吵发生的时候，最需要的就是冷静。


    ### 1. 如果是对方感情冲动


    通常有3种原因：一是为了激怒你；二是为了从气势上压倒你；三是宣泄自己的不良情绪。针对这些，心理学家建议，可以运用下面这些方法来缓和对方的冲动：


    - **①握住他的手。** 一个人感情冲动的时候，双手往往会不自觉地大起挥舞，甚至做出很多具有破坏性的动作，比如摔东西。这时，你与他握手可以客气地制止对方的这一行为，通过控制对方过激的行为而缓和对方的冲动。当然，在对方情绪冲动的时候与其握手，你遭到拒绝的可能性会比较大，但是你可以大胆地找到合适的理由，多次试着跟他握手。

    - **②给他让座。** 如果仔细观察，你就会发现，情绪激动的人大都是站着的，他们呼吸急促，手脚颤抖；而当一个人坐着的时候，则很难激动到这种程度。因为坐着的姿势会大大限制胸部扩张，使其怒气不足。因此，想要冷却对方的情绪，给他让座，让他坐下来，是一个不错的策略。

    - **③不理会他。** 当对方情绪激动的时候，无论是赞同还是劝诫，都是火上浇油。这时，你只要当好倾听者，让对方发泄就好。

    - **④一定不要选这时和对方争吵。** 当然，面对一个情绪极其不冷静的人，你势必有忍无可忍、想要回击对方的心情。不要将这种冲动为向对方大声喊出“冷静下来”的行为。这样对方极有可能在你的“当头棒喝”之下冷静下来。


    ### 2. 如果不冷静的那个人是自己


    又该如何对自己的情绪进行冷处理呢？这里有3个常用且有效的方法值得借鉴：


    - **①深呼吸。** 这能够供给身体充足的氧。要知道，充足的氧是人保持积极心状态的前提条件，并且呼气的动作能够有效排解负面情绪。

    - **②伸展腿。** 一般来说，当人处于放松、平和状态的时候，就会把脚到处乱伸。在自己激动或者紧张的时候伸展腿，实际上是利用潜意识给心理以“我放松、我平和”的暗示。

    - **③善用锚点。** 所谓锚点，是指人的潜意识与一定动作、一定心情之间的特链接关系，比如，有的人一听到某首歌就会激情澎湃；有的人一紧张就会摸耳朵，然后紧张就会得到缓解。同样，你可以通过特定的动作来缓和自己的情绪。如果你还没有具备使自己冷静的心理锚点，那么你可以有意识地培养一个，当感觉自己过于激动的时候就做出相应的动作，激动的情绪就能够得到有效的缓解。


    当彼此都暂时冷静下来以后，切记不要重谈那个让你们激动的话题，因为，这个时候重谈非常容昜使刚刚冷静下来的情绪被重新点燃。你们不妨在一段时间内不要彼此联系，等到自己认为能够冷静而理智地处理问题的时候再联系对方，解决问题。


    总之，一旦发生争吵，就要“冷处理”，但不能“冷”得太久，因为“冷”得过久难免寒了对方的心。


    ## 8. 平息他人愤愤不平的情绪


    很多时候，对方之所以厌恶你、找你的麻烦，是因为你让他产生了一种不满足感、让他感觉愤愤不平。那么，面对这种人际困境，应该怎样处理呢？


    我们知道，人会因获得、拥有某些东西而产生满足的心理体验。然而，到底获得什么东西、拥有多少才能让人满足呢？正所谓“千人千面”，每个人对此的答案都是不一样的。比如：一个非常有钱的人，他又得到了一大笔钱，这时候他该满足了吧？事实上，只要他得到的钱没有达到自己的预定目标，他仍然会愤愤不平地抱怨自己没有钱。同样的，“普通百姓”虽然只是得到了为数不多的资产，但由于达到了他的心理预期，他们会觉得非常满足。


    也就是说，一个人对现状是否满足，往往取决于其要求水准的高低，而这个要求水准则是根据一个合理根据设定的。因此，你可以通过给出不同的合理根据来任意设定对方的要求水准，进而达到让对方愤愤不平还是满足的目的。


    以工资报酬为例。假设某一个工薪阶层的人拿到了5万元的年终奖金，那么他是否会为此感到满足呢？事实上，他能否满足于这样的奖金数额，并非取决于数额大小本身，而是取决于那个决定其要求水准的合理根据是怎么样的。


    显然，如果他所得到的数额与外界的一般水准相比要低很多的话，那么他势必会愤愤不平，心存一定程度的不满。但与外界的一般水准相比，他更关心的恐怕还是他周围的平级同事拿到了多少，与他同时进人公司的其他职员拿了多少，与他业绩差不多的职员又拿到了多少……


    此时，假如有人（的）贡献小于他但奖金高于他，即使只多了100元，那么他也会愤愤不平；而假如有人进公司比他早、资历比他深，奖金却和他一样或者比他少，即使只少几十元，他也会感到无比满足。换句话说，面对奖金，如果其数目让他觉得自己受到了公正的待遇，那么他就容易接受和满足；反之，如果让他感觉自己被不公正地对待了，那么他就会愤愤不平、会抱怨。


    事实上，不仅是奖金，对于其他任何人们所得到和拥有的东西，只要能让他们感到公正，他们就会产生与获得和拥有数目无关的满足，并易于接受。心理学家们把这种现象称作“公正理论”，它是改变人的心理的强有力武器。


    谈到公正，你或许已经发现了，现实中，公正历来被视为金科玉律，但达到真正的公正是非常困难的。幸而，让人满足比让人得到真正的公正对待要容易些。即使是向来不合理的内容，如果你给它穿上“公正”的外衣，人们也会将此误认为合理的根据，进而感到满足。


    比如上面的例子中，那位职员因贡献比他少的人奖金比他高而不满足、而愤愤不平，那么应如何让他满足呢？你只需要将不合理的内容包装得“公正、合理”就可以了。你可以说“XX虽然奖金比你高，但是他不享有公司的XX福利；而由于你的优秀表现，你是整个公司中享有最好福利的职员。”


    看，让人满足、让人不抱怨、不闹事儿，也挺容易的！


