    # 1. “同理心”是获得良好人际关系的有效保证


    在人际交往中，不少人因为觉得自己受了委屈而不停地抱怨对方，而对方完全不认为自己有什么不对。于是，两个人越吵越厉害，吵得惊天动地，最后把“情谊”吵成了“恨意”，自此分道扬镳、形同陌路。


    其实，只要我们把自己摆在对方的位置上，设身处地地体验、理解他人的内心世界，注意形成彼此之间的共同感受，就不会再处处挑剔对方，抱怨、责怪、嘲笑、讥讽也会大大减少，取而代之的是赞赏、鼓励、谅解和互相扶持的、和谐美满的人际关系。


    上海女孩小墨与湖南女孩小丁本来是感情很好的朋友。后来，两个人更是搬到一个屋檐下，当起了室友。两个人在很多方面都相处得非常融洽，但总是因为“吃菜问题”闹矛盾。小墨做菜要放糖，因为上海人爱吃甜食；小丁做菜喜欢放辣椒，因为湖南人嗜辣如命。吵来吵去，两个人的友谊出现裂痕，最终都视对方为老死不相往来的对象。


    后来，小墨结了婚。婚后小墨开始犯难了。因为她的丈夫祖籍四川，与小丁一样是个“吃辣大王”。与小丁之间的不愉快经历让她记忆犹新，经过深思熟虑，小墨终于想出一招妙计。婚后第一餐，她就抢着买菜烧菜，每样菜里都放了辣椒，四川丈夫吃得津津有味。可是，当他看到小墨被辣得满头大汗时，吃惊地问道你既然不爱吃'
  - '[PAGE 321]


    辣椒，菜里为什么还要放这么多辣椒呢？”小墨听罢，心中甜丝丝的，笑道因为你爱吃辣椒啊！”丈夫非常感动。第二天，换成小墨的丈夫抢着买菜做菜，他在每样菜里都加了糖。小墨一吃，挺对胃口的，就问丈夫：“你不爱吃甜的，为什么每样菜都放糖呢？”丈夫诡秘地一笑我是向你学习，处处替对方着想啊！”小墨听后，心里别提有多美了。


    她暗想，要是当年与小丁住在一起时也能像如今这样“换位思考”，也不至于失去一个好朋友了。


    以“同理心”试着换位思考，以宽广的胸怀接纳对方，才能彼此尊重和体谅，才能获得真正的友谊。


    心理学家将同理心分为初级同理心和高级同理心。初级同理心的反应是能够理智地理解别人的行为，在与他人接触中，不排斥、也不强迫他人接受自己的观点；高级同理心则是指个体不仅可以站在他人的角度考虑问题，还能感受这个事件给他人带来的内心体验，使自己进入对方的内心世界，它所表达的是一种理解、接纳、平等、关爱与尊重。


    通常，一个具有同理心的人对周围的一切事物都会产生一种关心和了解的心理趋向，当自己与他在认识上出现了分歧时，能够真诚地尊重对方并容忍这种差异；当自己与他在行为上出现摩擦时，能善意地理解对方，并分担由此而产生的各种心理负担。在与人交往的过程中，惟有具有“同理心”，才能成为真正的社交大赢家。'
