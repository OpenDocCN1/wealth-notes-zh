    # 7. “喂饱”对方饥饿的皮肤


    大多数人都知道，饿肚子的感觉是非常难受的，人都有吃饱肚子的需求。然而，却很少有人知道皮肤也会“饥饿”，那种感觉也非常难受，因此，人的皮肤同样需要被“喂饱”。不用对此感到怀疑，这的确
    是 100% 的事实。


    在 1958 ~ 1961 年为期 3 年的时间里，美国威斯康星大学灵长类研究所所长哈洛做了一个这样的实验：


    首先，哈洛找来了两类代理猴妈妈：一类代理妈妈是金属猴，它胸前安放了一个奶瓶；另一类是用软布做成的猴子模样的布偶，和真的猴子极为相似，但没有奶瓶。接着，哈洛准备了两个笼子，一个笼子里两类代理妈妈各有一只，而另一个笼子里只有金属妈妈在。然后，哈洛把刚刚出生不久的小猴子分别放到两个笼子里，让代理妈妈们养育它们。


    俗话说 “有奶便是娘’ 照常理来说，小猴子应该和安有奶瓶的金属妈妈比较亲近才对，然而事实却并非如此。小猴子对金属妈妈很冷淡，除了肚子饿的时候，几乎从来不接近它；对布妈妈却显示出强烈的喜爱之情，平时有事没事都喜欢紧紧地抱着它，尤其是在受惊或不安的时候，更是立刻奔到布妈妈的身边，死死地搂着它。


    当小猴子在地上玩耍的时候，如果突然放入一个自动玩具，小猴子吓得马上跑到布妈妈身边，然后开始酿，不一会儿，就会下地试'
  - '[PAGE 70]


    探接触,最后玩弄起这个玩具来。


    但是,在只有一个金属妈妈的笼子里生长起来的小猴子,会长时间地处于极端恐惧之中,一直躲在角落里,不敢去碰那个自动玩具。


    这个实验说明,小猴子对妈妈的依恋,关键不在于有没有奶吃,而在于有没有柔软、温暖的接触。


    在此基础上,哈洛又进行了一系列的实验。他发现,由代理妈妈养育的小猴子,即使得到很好的照顾,生病和死亡率还是要高于由母猴哺乳的小猴子;而由代理妈妈们养大的小猴子们,其长大后的行为都称不上正常,尤其是由金属妈妈单独养育的小猴子情况更加糟糕,它们大都缺乏协调性,极端胆小和畏缩,而且具有很强的攻击性,对性的反应很冷淡。


    其次,被金属妈妈养大的小猴子的行为特点就是“皮肤饥饿”的一种表现。小时候很少得到母亲拥抱、亲昵的孩子,长大后就会有一种潜在而又深刻的对来自他人的爱、关心和抚慰的渴望,如果这种感觉过于强烈,就会导致一种病态心理,而这种心理会对一个人的情绪平衡能力、自信心以及关爱别人的能力等产生消极影响。


    因此,母亲们应该注意要“喂饱”孩子们饥饿的皮肤。母亲可以通过皮肤接触让婴儿感到母体的温暖和柔软;注视小宝贝的眼神、表情;对着孩子说温柔的话语;轻轻地摇晃产生韵律感,以及用母亲的呼吸、气味和微笑等,来“喂饱”孩子们饥饿的皮肤。'
  - '[PAGE 71]


    值得一提的是，在竞争日益激烈的现代社会，成年人面对越来越沉重的生存和发展的压力，也开始出现了“皮肤饥饿”的现象。无论男女，无论外表多么强悍，内心都渴望被他人关爱、被他人拥抱着安慰。


    肢体接触是人类的本能需要，对人的心理和精神发展起着重要的影响。


