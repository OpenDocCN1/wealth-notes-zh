    去拥抱别人的人是冷漠的，其感情也是枯竭的。因此，在人际交往过程中，你大可不必表现得过于拘谨，过于保守，给对方一个拥抱、拍拍对方的肩膀、和对方握握手……这些都能满足对方皮肤的“食欲”，帮助我们赢得友谊。'
