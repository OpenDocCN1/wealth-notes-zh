    4. 提供额外利益。在销售战略中，提供额外利益是刺激消费行为的一种高效工具。据估计，提供额外的利益，即使是微不足道的利益也能将回馈率提高35%。


    在心理上，对于额外利益，人往往将之视为无偿的。而人对这种无偿的“小便宜”大都情有独钟，会表现出极高的热情。因此，如果你想让对方立刻行动起来，不妨使用“附加零头”技巧：给对方提供一个额外的好处，即使是微不足道的
    也没关系；给对方一点小刺激，让他立即采取行动。比如：“大家加油，做完这个项目后我请大家吃大餐。”提供额外利益所带来的效果一定会让你大吃一惊！


    当然，这一切产生效果的前提是：对方是认可你、不反感你的。因为没有人会主动与自己讨厌的、不信任的人去配合。因此，平时一定要注意积累他人对你的喜欢度和信任度。'
