    事实上，从古到今，人们都一直采用这种方法来探知他人内心真正的需求，而无数的事实都证明了它的有效性。


    拿破仑在阿尔福特会晤俄国沙皇时，也采用这种方法打探沙皇是否有与自己结成政治联盟的需求。他在晚饭前和沙皇聊天说：“有的时候，真想好好地休息一下，享受一下天伦之乐。可是你知道，我的妻子比我大
