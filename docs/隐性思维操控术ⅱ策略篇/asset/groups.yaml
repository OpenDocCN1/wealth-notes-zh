    ## 9. 用幽默化解对方的不满


    幽默往往给人带来欢笑，它最能营造愉悦的氛围，在这样的环境中，烦恼会消散，痛苦会淡去，尴尬会忘记，使人如沐春风。因此，幽默的人就像一块磁铁，总能吸引别人到自己的身边。幽默的人往往八面玲珑、左右逢源，总能不动声色地化解矛盾、消除芥蒂，幽默的人做事无往而不利，即使是批评他人，也会让人家乐于接受。


    吉尔森经常迟到，老板忍无可忍地对他说：“吉尔森！如果你再迟到一次，就准备打包回家吧！”


    吉尔森一听，想：“没了饭碗还得了？一定不能再迟到了。”于是，连着好几天都起得很早。但吉尔森是个典型的“夜猫子”，这天他又睡过头，迟到了。吉尔森急匆匆地赶到办公室，里面悄然无声，每个人都在埋头工作，正是一副暴风雨前的宁静样子。一个同事朝他使了个眼色，示意老板生气了。果然，老板板着脸朝他走了过来。


    没等老板开口，吉尔森突然笑容满面地用双手握住老板的手说“您好！我是吉尔森，我是来这里应聘工作的。我知道35分钟之前这里有一个职位出缺，我想我应该是来得最早的应聘者，希望我能捷足先登！”说完，吉尔森满脸自责又充满希望地望着老板，就像个犯了错误等待大人原谅的孩子。


    同事们开始哄堂大笑。老板也憋不住，笑着说：“那就马上工作吧！”吉尔森用幽默化解了老板对自己的不满，保住了自己的工作。


    幽默是一种生活态度，有了它，我们就能与社会、与人群相处得更加融洽和谐。幽默的旁边常常围绕着一群“八拜之交”，它们形影不离，而这群“八拜之交”都是让人喜欢的性格和素质，比如乐观、自信、宽容等。因此幽默的人即使在困境中，也能苦中作乐；即使自己的缺点暴露于众人面前，也能从容不迫地自我解嘲，应不会窘迫甚至恼羞成怒；即使别人指着自己的鼻尖轻骂，也能不紧不慢，一笑而过……试问，这样的一个人怎会有人不喜欢呢？


    在人际交往中，如果我们能不时地“幽默一下”，不仅能给周围的人带来快乐和欢笑，自己也能获得更多人的喜爱，甚至是人见人爱。


    很多时候，郑重其事地赔礼道歉可能对化解矛盾无济于事，但是适时地讲些笑话，幽默地跟别人开开善意的玩笑，却能化干戈为玉帛，一笑泯恩仇。幽默往往能成功地把对方的心理注意力从矛盾事件上拉开，调和对方的情绪，进而化解一时紧张的气氛。


    一生中，我们要负担很多严肃的爱恨情仇、沉重的生老病死，还要经常置身各种郑重的场合，比如会议、典礼、仪式、谈判等，严肃、庄重、矜持、沉重禁锢了我们太多的笑容和轻松、快乐的心绪。所以，我们要善于“苦中作乐”，不时地幽默自己和他人，在人们的眼中，你会变得更加可爱、更受欢迎。


    ## 10. 面对抱怨，理智应对


    生活中、工作中，如果你碰到一直在你耳边唧唧歪歪抱怨的人，会不会觉得很烦、不堪其扰呢？相信大多数人都会有一种想用东西塞住对方嘴的冲动，可惜的是你不能这么做。现在好了，用以下这些心理策略，你将能轻松摆平任何人的任何抱怨。


    首先，倾听。倾听听起来实在是太简单不过的事情，遗憾的是大多数人都不知道应该如何倾听。一般来说，在倾听的过程中，我们需要遵循一个原则：别说话，别企图打断他，不表示同意，不表示反对，不跟对方争。


    很多人抱怨只是想从心里感得慌，想找个倾诉一下、发泄一下而已，既然是这样，让他痛痛快快地吐出来就什么事也没有了。当然，有的人抱怨是想找茬，那么就让他讲，讲得时间长了自然就没什么了。切记，独角戏往往是越唱越没劲，如果你打断他，他不能发泄个够，你自然就成让他不“爽”的人，他索性将你当成对手，乐此不疲地将戏继续演下去。


    然而，也许你已经发现，只是倾听还不足以应付他人的抱怨。其实，抱怨从心理根源上说，是因为对方的“自我”受到了严重的伤害，或者他觉得自己被人操纵、占便宜了，或者他觉得某人某事让他颜面扫地，他觉得受伤。因此，想要彻底解决对方的抱怨，你就得想个办法抚慰对方的伤痛。


    也就是说，你需要接着往下努力，即：赞同。


    那么，为什么现在才同意呢？因为，如果在对方还没有讲完时表示同意，就难脱“息事宁人”“屈尊俯就”以求摆脱对方纠缠的嫌疑。所以，要等到对方讲完之后再表示同意。不过，同意可没有那么简单，常用的招式是“温柔一招”，你可以用它向对方传递一个信息—你很重视他、很在意他的感觉，没有应付他。比如，你可以说：“像你这么重要的人，当然不习惯被人这样对待。”“是啊，这样对你，你肯定受不了。”“这事儿，换了谁都会生气！”……试问，遭遇让人郁闷的对待后，听到这么体贴暖人的话，谁还会一直生气呢？


    通常情况下，通过倾听、赞同，你就可以让对方觉得自己很重要，进而“大事化小、小事化了”。不过，为了确保“抱怨”不会卷土重来，你需要乘胜追击，抚慰对方。


    补偿是最有效的方式。你可以问他你希望我做些什么呢？别担心对方会狮子大开口，有了之前的让他发泄等一系列缓和心情的准备工作，他提出的解决方案中的补偿额度往往会远远低于你的底线。因此，千万不要为了怕对方的要求超过自己的底线，或为了急于摆脱“抱怨”而“先下手为强”地亮出底线。


    此外，你在做以上这些事的同时，应尽量与对方取得默契。心理学家指出，人际交往中，默契的建立有助于信任感的产生，它是彼此间心灵沟通的桥梁。有了它，你们之间的谈话很可能会变得更加积极，而对方也更信服你所说的话。


    与对方建立“默契”一般有3大秘诀：


    - 1. 姿势、动作与对方保持一致。比如：如果对方有一只手放在口袋里，那么你也依样画葫芦；如果对方做了一个什么手势，那么过一会儿你也“碰巧”做一个。

    - 2. 尽量与对方保持语速一致。他快你就快，他慢你也慢。

    - 3. 与对方语言中的关键词保持一致。也就是说，你在说话的时候最好能重复对方话中的关键词，比如，他说我怎么会受到那样的对待？真让我难过！那么，在后面的谈话中，你就可以加上“对待”、“难过”这些关键词，你可以说：“我知道，那种对待，一定让你难过极了。”


    这样，我们就能人为地制造出一个共鸣的情境氛围，建立起默契。但是要注意的是：模仿要自然，不能让对方察觉，否则就会劳而无功。


    有了“倾听—赞同—抚慰”这三部曲，再加上“默契感”，对“抱怨”，你能定“攻无不克，战无不胜”。尤其是做以上这些事的时候，在你们之间建立一种“默契”，会让对方觉得更舒适惬意。

