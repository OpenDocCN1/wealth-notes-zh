    # 10. 从对方的无心之失洞悉其内心需求


    在人际交往中，很多时候，我们都需要在正式提出自己的建议之前先摸清他人的想法，这时，你会综合各个方面来揣测对方内心真正的需求是什么。然而，你的揣测是否正确呢？你应该怎样避免揣测失败的风险呢？你不妨抛给对方一个含糊的话题，然后仔细观察对方的反应，就可以验证自己的揣测是否正确了。


    事实上，从古到今，人们都一直采用这种方法来探知他人内心真正的需求，而无数的事实都证明了它的有效性。


    拿破仑在阿尔福特会晤俄国沙皇时，也采用这种方法打探沙皇是否有与自己结成政治联盟的需求。他在晚饭前和沙皇聊天说：“有的时候，真想好好地休息一下，享受一下天伦之乐。可是你知道，我的妻子比我大
    10 岁，和她之间有很多事情沟通起来都不是很顺利。我听说，陛下您有一位漂亮又聪明的女儿，要是我的妻子能像您女儿那样该多好啊！”然后，他又向沙皇表示歉意，请他宽恕自己坦白地发泄心中苦恼的行为，最后，他说：“到进餐时间了吧？我先告辞了。”拿破仑利用含糊的话题探知了对方是否想要“进行政治联姻”。


    美国前总统本杰明·富兰克林在费城时，也是运用这种策略来探知人们心中的需求的。在推行一个计划之前，他总会先把他的想法在集会或报纸上比较委婉、隐晦地表达出来，然后观察人们对此的反应，最后再决定计划实施与否。


    在老圣保罗公司与太平洋铁路戏剧性的交易中，詹姆斯·希尔也正是利用这种策略，探知了对方是否有出售股票的需求。他在谈判中多次正式提出想要收购太平洋铁路。当然，他非常明白，自己的请求势必会被对方拒绝，然而，他却可以从对方的态度细节中观察出对方是否有抛出股票的意向。


    在自己真正做出决定和行动之前，先想方设法地了解他人可能有的需求，能够最大限度地避免抉择错误。抛给对方一个敏感的、让他费解的、含糊的话题，然后观察他的反应，这能非常有效地探知对方内心的真实需求。


    著名心理学家弗洛伊德指出，“错误”的言行，是个体的无意识的心理愿望与要超越这种无意识层的理性判断、义务感、决心、伦理等相互斗争、相互妥协的产物。


    弗洛伊德曾向人讲述了这样一件自己亲身经历的事：


    在一次旅行途中，他邂逅了两位女士，因为彼此聊得很投机，于是便结伴而行。


    这天，他们正顶着火辣辣的太阳在路上行走。有位女士对他说：“说真的，旅行好像并不是一件多么让人愉快的事情，甚至可以说是自找苦吃。一整天都冒着酷暑日晒不停地走，汗水流个不停，把身上的衣服都浸透了，而且脚也疼得厉害，真让人难受……”她稍作停顿后接着说，“不过，马上就要旅罩了。”


    这位女士出现了口误，本来想说“旅馆”，却说成了“旅罩”，这是怎么回事呢？原来，这位女士在说“马上就要旅罩”的同时，心里正想着：“太好了！马上就要到旅馆了，这样我就可以把罩衫、衬衣和胸罩都换掉了。”显然，这位女士想要换掉胸罩的愿望在此刻是不可能实现的，并且她的这个愿望也是不适合表达出来的。换掉胸罩的愿望被压抑，才出现了“旅罩”的口误。


    由此可见，个体错误的言行往往是心中的愿望受到压抑的一种外在表现。


    比如：早上你乘出租车上班，而那天刚好是发工资的日子。于是，你一边坐进出租车里，一边在心里兴高采烈地盘算着要买点好东西犒劳自己。当你坐定以后，你必须告诉司机自己的目的地，而暂停去想“如何用奖金犒劳自己”，这时你就很有可能会对司机喊出“奖金”，而非你的目的地。


    在实际生活中，每个人都可能会犯很多单纯的、机械性的错误。而他的本来意愿往往就潜伏在这些错误当中，这些意愿也有可能连当事人自己都不曾觉察到。遗憾的是，对于他人的种种言行错误，人们采取的态度大都是直接忽视、淡定，而不曾意识到，可以通过对他人错误的认真观察和分析来了解他人心中的想法。


    相反，心理学工作者们则非常关注他人的错误，有的甚至还有意识地制造错误来了解他人的心理。比如，心理医生将就诊病人引导到催眠状态，并利用暗示术唤起他的某种欲望。等病人醒后，让他读一段早准备好的、有针对性的文章，然后从病人读错的地方，就能够探明病人在哪些方面受到了压抑。


    因此，在人际交往中，我们不妨用此方法去测探一下对方的真实想法。比如：有位女士坐公交车时，把“司机，下车”误说成了“亲爱的，下车”，并且她一脸愉悦，那么，你可以知道，她多半是急着去赴男朋友的约会。只要认真观察，从“错”中了解别人内心的真实需求是一件非常容易的事情。


    ## 第三章 洞察他人内心的心理策略


    你是否想过自己的一生会和多少人相连？朋友、家人、爱人、敌人……对他们，你了解多少？他们又了解你多少？生活不是童话，现实世界里没有无所不知的魔镜，也没有能看到一切的魔法水晶，那么，你要用什么办法来读懂他人的心？本章将和你一起去学习能够洞察他人内心的心理策略，修习读心术，让你在今后的人际交往中知己彼。


    ### 1. 他做的，就是他心里想的


    琳琳在一家公司做文秘。一次，她拿着一份文件去请新来的经理批阅。可是不知怎么回事，一向小心谨慎的她在给新经理递文件时，不小心把对方跟前的茶杯碰倒了，水洒了新经理一身。琳琳倒吸了一口冷气，等待着新经理对她大发雷霆。可是没想到，新经理只是狠狠地瞥了她一眼，并示意她出去，自始至终没有说一句话。


    这让琳琳想起了一周前，自己因工作上的一个失误而被原来那位经理骂了个狗血喷头。可是那次，她走出办公室后却感觉一身轻松。这次却心里忐忑不安。因为新经理那不满的眼神令她心里打鼓。她开始担心自己会被扣奖金，或是会被调离岗位。


    或许有人不解，为何面对大发雷霆的经理琳琳并没有那么害怕，而身一声不发、仅仅瞥了她一眼的经理却令她忐忑不安？


    其实原因很简单，原经理通过有声语言已经把自己的坏心情很明确地传达给了琳琳，琳琳也因此知道这件事已经结束了。而新经理却用“无声语言”来表示他的不满，使得琳琳无法判断出他对此事的处理意见，不知道他对此事是既往不咎了，还是等待以后处理。


    上述事例中新经理的眼神便是“身体语言”的一种。人的身体语言包含很多方面的内容，一颦一笑、一个眼神、一个动作，都能体现某种情感、想法、态度等。这种身体语言甚至要比有声语言传递的信息更多。


    心理学家通过研究发现：人类的沟通，更多的是通过姿势、仪态、位置以及同他人距离的远近等方式进行的，而非局限于面对面的交谈。确切地说，55%以上的人际交流都是以非语言方式即通过身体语言来进行的。人类的身体语言表达多为下意识的，是思想的真实反映，尽管有时它可能未能引起众人的特别关注，但事实上，它的确在无声中传递了比有声语言更多的信息。另外，身体语言还有一个有声语言无法比拟的优势，那就是其真实性。“口是心非”的人不少，但是能够做到“身是心非”的人却不多。


    因此，我们说，身体语言传递信息的效果有时要比有声语言更加强烈，更不能忽视。


    心理学家告诉我们，身体语言体现的是人的下意识，人自己也很难控制。因此，在与人际交往时，我们要学会观察对方的身体语言。通过一个人的身体语言来判断这个人的真实内心，而不是对方说什么就信什么。据说，公安机关使用的测谎仪就是依据这个原理。


    通常情况下，身体语言传达的信息能在一定程度上帮助我们在人际交往中更准确地了解他人。


    眼睛最能暴露一个人内心的秘密，通常情况下，一个人瞳孔扩大，眼睛大睁，表明他心情愉悦，感觉良好；而如果瞳孔缩小，就表明他心情郁闷。当人们心存疑惑时，眼睛往往会眯缝起来。说谎时，人一般都不敢正视别人。


    另外，在交谈的过程中，如果一个人在听的同时还会不时地摸鼻子或拉耳朵，则说明他被对方的话弄糊涂了。若向下紧皱眉头，表明他没有听明白或不喜欢听对方说的话。若向上皱起额头，则表明他对自己所听到的话有些吃惊。倘若他不时地用手指敲打坐椅的扶手或是写字台桌面，则表明他心绪烦乱，不耐烦。而双臂交叉撑在胸前，则说明他不愿意同别人接近，或是戒备心强，想在心理上远离别人。


    ### 2. “脚语”，诚实地泄露心语


    通过研究，英国著名心理学家莫里斯发现一个十分有趣的现象：人体中越是远离大脑的部位，其反映的人的心理信息的可信度越高。


    脸距大脑中枢最近，因而最容易说谎。生活中，很多人都可以一边在心里讨厌对方，一边笑容满面地对着对方。想呈现出与心理状态完全不一样的面部表情并不是一件困难的事情。再看下看，手与大脑中枢的距离不算近也不算远，诚实度只能算是中等，只要人们稍稍注意一点，就能够利用它来说谎。而脚是离大脑最远的，绝大多数人都会顾不上这个部位，因此，它最容易流露出人的真实的心理信息。与脸部表情和手势相比，“脚语”诚实很多。


    与其他的人体肢体语言一样，每一个脚部习惯动作都含有一定的心理信息。


    生活中，人们用来形容脚的形容词数不胜数。与其说这些形容词是描写脚步的轻、重、缓、急、稳、沉、乱等，不如说是间接地在描写人或稳定或失衡、或恬静或急躁、或安详或失措的心理状态。人的心理状态不同，走路的姿势也会不同。“脚语”就像心灵的节奏一般，为人的情绪打拍子。“暴跳如雷”是心灵的重节奏；“春风得意马蹄疾”是一种轻快的节奏；“步履蹒跚”是一种忧伤的节奏；“闲庭信步”是一种怡然自得的节奏……


    此外，人的个性品质不同，走起路来也会有不同的风采。如，一个外表细致秀美的女子走起路来却总是匆匆忙忙，而且脚步又重又乱，那么这位姑娘一定是个性格爽朗、心直口快、没有心计的痛快人；反之，如果一个人看上去五大三粗，而走起路却是一副小心翼翼的样子，那么他必然是个外粗内细的精明人，豪放的外表不过是其掩盖自己行事严密的一种伪装。


    脚部的细节动作也能够透露出人细微的心理活动。比如，有人一坐下来就跷起二郎腿，说明他心中不服输的意念被某种事物所激发；而女性大胆地跷起二郎腿，则说明她很自信，有着在众人面前显示自己的强烈愿望。还有人站立时，脚尖的指向往往朝着自己内心惦念和追求的事物或方向。例如三个男人站在一起交谈，这时，有一位美女从他们旁边经过，表面上看，他们仍然在专心交谈，谁也没被那位经过的女子所影响。可是实际上是不是这样呢？你只需要观察他们脚尖的指向就知道了，如果他们被美女所吸引，他们的脚尖会不由自主地指向那位美女，而他们专心致志地交谈也只是一种表面行为，他们的“脚步”泄露了他们极力掩藏的内心。


    每个人的心理状态不同，其脚部动作也会不同，或快或慢、或轻松或沉重……每一种“脚语”都有其相对应的心理信息。而且，一般人很难有意识地加以掩饰，因此，只要你留心观察对方的“脚语”，一定能更加了解他的内心。


    ### 3. 服饰出卖了他的心


    美国心理学家彼得·罗福明确指出，通过了解一个人的着装风格，可以洞悉其心理。的确，生活中，每个人对服饰都有不同的偏好，一个人在不同的阶段对服饰的偏好也有所不同，其实，这些不同都源于心理的不同。


    也就是说，通过对一个人的着装偏好进行观察，或多或少地，你都能了解其内心。常见的着装风格与内心状况的对应关系如下：


    - **服饰华丽**：自我显示欲强，爱出风头。在人潮中，那些服饰鲜艳、款式与众不同、配饰流光溢彩的人总是能在第一时间抓住别人的目光，而这也正是他们穿上华美食饰的目的所在。也就是说，服饰华丽的人自我存在感强，由于服饰的华美与金钱的对应关系，这类人对金钱往往具有执著的追求。在现实生活中，如果你能投其所好地多夸奖他们，满足其膨胀的显示欲，就很容易打开他们的心灵之门。

    - **衣着朴素**：缺乏自信，喜欢争吵。爱穿朴素无华的服饰是不喜欢成为众人焦点的一种表现。这类人属于体制顺应型，他们安于现状，缺乏主体意识和创造欲望。

    - **盲目追求时髦**：有孤独感，情绪常波动。生活中，有的人盲目追求时髦，而不管正在流行的风格是否适合自己，是否符合自己的喜好，或者更恰当地说是不知道自己真正喜欢什么，他们搭配服饰的唯一标准就是向流行看齐。这类人的心中常有一种孤独感和不安感，情绪容易波动。

    - **不理时尚**：常以自我为中心，标新立异。一般来说，对时尚不理不睬主要是出自两种心理，一是以自我为中心，他们认为，倘若别人采取同等行为，岂非等于失去了自我。这种人的个性十分强硬。二是内心怀有恐惧感，不敢面对外面的花花世界，因此躲在自己的小黑屋里，对外界的事情不闻不问。这种人往往很敏感，有一定程度的自闭。

    - **突变服装嗜好**：想改变生活方式。如果，一个人平时都穿深蓝色的、式样固定的职业装，但有一天，他却突然大改风格，穿上了休闲的夹克和颜色鲜艳的长裤，甚至衬衣也换成了花哨的格子款，那么，他周围的人势必会产生疑问，不知道他最近碰到了什么特殊的事情。从他着装风格的改变，至少可以确定一件事情，那就是他的想法因某种刺激而改变，在心中对生活有了某种新的期望。

    - **理性着装**：理性、自主。这种人不盲从于时尚，能够很适度地尊重自己的主张，既不会完全盲从他人，也不至于固执己见；能够理性地看待问题。他们处事中庸、情绪稳定，不容易做什么出格的事，踏实可靠。


    服饰是人的“第二皮肤”。人的心理状态不同，那么他为自己选择的衣服也必然不同；当其心理状态发生改变的时候，其着装风格也会相应地改变，因此服饰是人的心理状态的一个重要显示。通过观察他人服饰的颜色、风格、款式、变化等，能够在一定程度上洞悉其心灵。


    ### 4. 握手的方式反映一个人的性格


    握手，是生活中人们最常用的一种社交礼仪，无论是亲朋好友相见，还是社交场合中陌生人之间的应酬，都会有握手。握手的动作虽然简单，但握手的方式却可以反映一个人的性格和心理。也就是说，你可以根据对方与你握手时的感觉来洞悉对方的心理秘密。


    - 握手时，对方紧握住你的手掌，并且用力挤握，甚至令你痛楚，那么你可以知道：对方的精力充沛，有很强的自信心，为人虽然倾向于专断独裁，但是拥有出色的组织能力和领导才能，是一个领导型的人物。

    - 握手时，对方握得适度，动作稳重，用双眼注视着你，那么他一定坦率、直爽，责任心强，让人觉得可靠。并且，他还具有缜密的思维，善于推理，常常能给予他人一些有建设性的意见，即使陷入困境中，也能够快速地找到可行的解决办法，是一个深得他人喜欢的人。

    - 握手时，对方只是轻柔地触碰你的手，给你感觉有些漫不经心，那么，他一定属于随和豁达的一类人，他遇事不偏执，很洒脱，颇有游戏人生的意味；而他待人也很谦和。

    - 握手时，对方习惯用手握持他人的手，这种人热诚敦厚、心地善良，并且感情强烈，喜怒哀乐都很分明，对自己认可的朋友会推心置腹、非常真诚。

    - 握手时，对方握住你的手久久不放，那么他的情感一定非常丰富，而且喜欢结交朋友，并且对朋友很忠诚，情谊也持久。

    - 握手时，对方只用手指抓握你的手，与你没有掌心上的接触，那么，他多半是个性格平和、心地善良、富有同情心、胸怀宽广的人，不过他很敏感，情绪也很容易激动起来。

    - 握手时，对方抓紧你的手，并且上下不断摇动，那么你可以知道，对方多半非常乐观，对生活充满希望，是一个积极而热诚的人。

    - 有些人不愿意与人握手，这类人大多个性内向、羞怯、保守，但待人却很真挚；他们一般不会轻易付出感情，但只要付出了，就会义无反顾、毫无保留。


    还有三人在与你握手时，会带给你一些不适感。比如：


    - 他把握手像打拳一样，非常用力，好像要把你的手捏碎似的，这种人多半很自大且喜欢逞强；

    - 他不愿将手臂伸长，肘部一直保持呈直角的弯曲，手部位于近自己的身子，这人的性格往往非常谨慎、保守；

    - 他与你握手时懒洋洋的，手指软弱乏力，手也握不紧，这种人大多很悲观，缺少生活的希望和激情；

    - 当你伸出手要和他握手时，他的手却还在口袋里，直到你把手缩回来了，他才又伸出手，这种人的判断能力往往不强；

    - 如果对方不看具体情况，遇人就先握手，以握手为上，那么他的心里多半存在某种不安，或者他本就是一个自卑的人；

    - 有的人握手的时间太长，几乎整个谈话过程中都握着你的手，那么，他多半办事拖拉、缺乏条理，不过为人很热情；

    - 如果对方的掌心有汗，那么他可能很冲动、莽撞，心理非常容易失衡，紧张和不安常常伴随他。


    一个人与他人握手的方式往往会在不经意间流露其真实的心理状态，因此，你完全可以留心观察，进而洞悉对方的内心。


    ### 5. 选择什么样的话题反映什么样的心理


    心理学家指出，在交谈中，一个人所选择的话题是其心理的间接反映。当你与人进行交谈时，关注一下对方的话题并加以适当的分析，那么，即使对方并没有直接说出自己的心境，你也可以知道对方某方面的心理信息。


    现实生活中，常见的话题主要有以下几种：


    - **以自己为话题**：有的人在与他人交谈的过程中，喜欢谈论与自己有关的事情，比如，自己的个性、爱好、对人对物的看法等，这样的人主观自我意识很强，并有点儿虚荣心和表现欲，渴望自己能够成为他人关注的焦点。此外，他们性格比较外向也比较忠厚，感情色彩鲜明而热烈，也是显而易见的。

    - **不谈论自己**：与那些喜欢以自己为话题的人相反，有些人对自己的相关信息严密防范，即使是一些可以公开的个人话题他们也不愿涉及。通常来说，这种行为倾向主要是源于
    3 种心理：个性内向、主观意识不强；自卑，对社交多些恐惧；城府很深。

    - **以他人为话题**：如果对方将第三者作为和你交谈的话题，对第三者的各个方面都滔滔不绝地加以评论（当然，这个第三者必然是你和对方都很熟悉的人），那么，对方多半是有某种企图。此时你应该好好地想一想：“他不停地说起第三者的意图是什么？”并且最好把话题岔开，千万不要随意附和他或者加以评论，一旦你这样做了，就等于走入了对方的圈套之中。当然，不排除有的人是天生的长舌，即使这样，把话题岔开仍然是你最好的选择，否则很有可能为自己带来人际方面的纠纷。

    - **将金钱视为禁忌**：这类人对金钱很敏感，而这种敏感往往来自于金钱上的自卑或者不安全感。一般来说，如果他是很有钱的人，那么他的心灵一定正在被空虚所煎熬着，他害怕别人从他的手里夺走财产；如果对方是个物质相对贫乏的人，那么“如何获得金钱”多半已经是他生命的主题。总地来说，这类人之所以对金钱避而不谈，并非因为他们不把金钱当回事儿，而是他们太看重金钱了，太现实，认为金钱至上，有物质崇拜的倾向。

    - **爱发牢骚**：谈论中，无论说到什么都喜欢发牢骚的人，大都是完美主义者。他们的自信心很强，同时，他们对人对事也力求完美。自己没有达到预定目标就埋怨自己，别人做得不好他自然不会放过，因此，对于他们来说，世间总有那么多不尽如人意的事，牢骚自然很多。

    - **爱赞美对方**：你一定碰到过在交谈中不停赞美你的人，他们赞美你的个性、爱好、品味、职业、家庭……虽然，你明知道他的赞美也许并不那么真心，但是你仍然很受用。这类人一般比较有心计，他在恭维你的同时，很可能在心里盘算着如何达到自己的目的，他们多半有事情请你帮忙。因此，你要保持清醒的头脑，千万不要被他的赞美迷了心窍。

    - **突然转移话题**：在谈话中突然转移话题，一般有两种情况：第一，对方突然将话题转移，并提出你难以接受的、非常苛刻的条件。这种情况，要么是你引起了对方的反感，对方有意刁难，要么是对方在试探你的诚意；第二，对方突然将话题岔到毫不相干的话题上。这种情况，多是因为对方对你们正在谈论的话题根本不感兴趣，所以将话题岔开。这类人往往支配欲和自我显示欲强，对他人缺乏尊重。


    在与人交谈的过程中，注意把握好话题，并且加以适当的分析，会增加你对对方的了解，进而提高你的谈话质量。

    '
