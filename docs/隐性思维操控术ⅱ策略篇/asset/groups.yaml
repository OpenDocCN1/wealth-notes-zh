    # 10.打开对方话匣子的技巧


    在与人交往的过程中，你是否碰到过守口如瓶、半点口风也不肯透露的人呢？这种人是不是非常让你头疼？你是不是一直在思考让他畅所欲言、将心底的话对你和盘托出的方法呢？那么，你不妨试试下面这些心理策略。


    首先，你可以问一问对方对鬼神的看法，或者问一问他对现在社会上一些敏感话题的观点，比如网恋、周末婚姻等。由于这些方面 的话题都是与他自身无关的,他只是客观地进行评价，无论说什么，对他自己都不会造成威胁，所以，对方多半是不会拒绝谈论的。


    也许你会觉得，这些话题根本和你们没有任何关系。但是，这些没有什么意思的八卦话题，却可以帮助你找到对方心灵的突破口。当他与你谈论这些和自己没有利害关系的话题时，他的意识形态也就赤裸裸地呈现在你面前了,他在告诉你他是一个怎样的人，这样,也就等同于承认了和你之间有着某种联系，而这种联系会使对方更加信任你，进而对你说出更多的话。


    一般来说，你们谈论的八卦话题越敏感、越暧昧，那么你打开对方心门的可能性就越大。当然，在他讲自己的观点时，无论你是否赞同，都不要跟他争辩其中的是非曲直；而如果你赞同，不妨明确地表达出来，因为这么做能使你们的相似处更多，进而联系更加紧密。'
