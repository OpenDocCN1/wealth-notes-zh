    不要说病句。即使是面对面地说话而非书面表达，病句也会影响对方对信息的接收效率，而且还会给对方留下不自信、没有文化素养的不良印象。


    说话要有要点、有重心。有的人喜欢与人寒暄或者东拉西扯，结果到交谈结束的时候也没有把关键的事情说清楚，这就是无效的语言交流。


