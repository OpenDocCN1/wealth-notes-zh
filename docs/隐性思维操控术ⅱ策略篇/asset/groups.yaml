    再次，肢体接触更是人类精神抚慰的需求。人类通过肢体接触来传递自己的感情，而拥抱是自身的“磁性”引力反应，是心灵真情的表露，是爱心心花的迸发。生活中，在安慰一个人的时候，我们拥抱他；在被人拥抱的时候，我们往往能够感觉到自己是被爱的，从而获得很大的心理安慰。


    西方人认为：一个长期不被别人拥抱的人是孤独的，一个长期不去拥抱别人的人是冷漠的，其感情也是枯竭的。因此，在人际交往过程中，你大可不必表现得过于拘谨，过于保守，给对方一个拥抱、拍拍对方的肩膀、和对方握握手……这些都能满足对方皮肤的“食欲”，帮助我们赢得友谊。


    ## 8. 用应声虫策略了解对方的真正需求


    心理学家认为，在与人交谈的过程中，当个“应声虫”，重复对方所说的话，为对方帮腔，同时配以肯定对方的表情，能够瓦解对方的心理防线，从而便于自己更好地了解对方的真正意图。


    人际交往高手们常常采用“应声虫”策略来向对方传达“我正专心一意地听你讲话”、“我十分重视你”等信息，从而瓦解对方的心理防御，深入对方内心，了解对方的真正需求。


    那些推销员往往就是这方面的高手。有一位推销员这样向一位太太推销化妆品：


    “太太，我们公司的化妆品非常适合你。”


    “不了，我已经有很多化妆品了。”


    “哦，所有的化妆品你都有了？”


    “是啊，差不多该有的都有了。”


    “都有了啊？”


    “嗯，到我这个年纪很少出门的，需要化妆的时候并不太多。”


    “哦，原来你不常出门。”


    “不过，我的几个女儿都快要结婚了。”


    “哦，是吗？那真是恭喜您了！唔，太太您的皮肤很不错。”


    “还好啦，女人总是希望自己能够年轻漂亮的，尤其是我们这种上了年纪的女人。”


    ……


    就这样，推销员运用这种附和的心理策略，首先取得了那位太太的好感，瓦解了她的心理防线，进而了解到对方真正的需求。接下来，只需要为这位太太推荐一些能让她显得“年轻漂亮”的产品就可以了。由此可见，在与交谈的过程中，专心地倾听对方所说的话，能够让对方有被尊重的感觉，从而比较容易敞开心扉、说出真心话。


    值得注意的是，即使是当“应声虫”，也要当一个让对方感觉到真情实意的“应声虫”，这样才能让对方敞开心扉，否则，只会适得其反。一般而言，人们往往通过点头来附和他人，如果点头的幅度大而速度快的话，那么附和往往不是真心的，而是装腔作势。比如，某个学生在老师每讲一个段落时都会点头两次，那么几乎所有的老师都会判定这个学生根本心不在焉，对课程内容完全不了解，而老师自然也不会喜欢这样的学生。


    那么怎样附和他人才会显得真诚呢？


    首先，你要注意自己点头的幅度、频率和速度，幅度大，表示态度明确；速度慢，显示你的附和是经过深思熟虑的；频率小，证明你并不是一个习惯性附和他人的人。


    其次，不要总是用“嗯”、“是啊”、“哦”、“真是那么回事”等语言来附和，这样会显得没有针对性，对方会认为你在敷衍他；在恰当的时候，用自己的语言重复对方的观点，会显得更加真诚。


    适当的附和性语言配以恰如其分的肢体语言，会让你成为一个真诚的“应声虫”。


    ## 9. 投石问路，探知对方内心的需求


    威廉·约翰斯是乔治·巴滕公司的负责人，而德斯坦是巴顿·德斯坦·澳斯本公司的负责人。有一天，这两位在美国广告界赫赫有名的人物偶遇了。在这次偶遇中，约翰斯成功地探知了德斯坦的需求，进而促成了广告史上最大的一次合作。


    当时的情形是这样的，约翰斯非常随意地对德斯坦说：“前天晚上，我忽然发现我们两家公司销售渠道并没有什么实质性的冲突。”


    德斯坦听完，立刻问到：“你什么意思？”


    约翰斯看着德斯坦一副着急却又故作平静的样子，“啊，其实也没什么。”边说边笑着走开了。


    几个星期后，当两人第二次会面时，规模宏大的合作——成立巴顿·巴尔顿·德斯坦及澳斯本股份公司的讨论正式开始。


    约翰斯抛给对方一句意味深长、让人费解的话，然后小心翼翼地观察对方的反应，进而探知了对方心理需求。的确，当对方对某一事物具有需求的时候，如果你含糊的语言正好碰触到他心中的需求，他就会表现得十分敏感。由于德斯坦心中有和约翰斯合作的需求，因此当约翰斯说到彼此销售渠道没有冲突的时候，他才会表现得如此敏感。

