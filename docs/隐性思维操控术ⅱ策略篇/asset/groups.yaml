    1. 语言提示。你可以直接告诉对方没有必要那么正式，比如你可以说“接下来，请大家自由活动……”也可以与对方谈一些无关紧要的话题或者开玩笑来制造非正式的气氛。

    2. 注意选择交谈的环境。挑选餐厅、家里等能让人感到随意的地方。


    场合的不同会导致对方不同的心理状态，而让对方心里放松是使其畅所欲言的前提条件。


    ## 10. 打开对方话匣子的技巧


    在与人交往的过程中，你是否碰到过守口如瓶、半点口风也不肯透露的人呢？这种人是不是非常让你头疼？你是不是一直在思考让他畅所欲言、将心底的话对你和盘托出的方法呢？那么，你不妨试试下面这些心理策略。


    首先，你可以问一问对方对鬼神的看法，或者问一问他对现在社会上一些敏感话题的观点，比如网恋、周末婚姻等。由于这些方面 的话题都是与他自身无关的，他只是客观地进行评价，无论说什么，对他自己都不会造成威胁，所以，对方多半是不会拒绝谈论的。


    也许你会觉得，这些话题根本和你们没有任何关系。但是，这些没有什么意思的八卦话题，却可以帮助你找到对方心灵的突破口。当他与你谈论这些和自己没有利害关系的话题时，他的意识形态也就赤裸裸地呈现在你面前了，他在告诉你他是一个怎样的人，这样，也就等同于承认了和你之间有着某种联系，而这种联系会使对方更加信任你，进而对你说出更多的话。


    一般来说，你们谈论的八卦话题越敏感、越暧昧，那么你打开对方心门的可能性就越大。当然，在他讲自己的观点时，无论你是否赞同，都不要跟他争辩其中的是非曲直；而如果你赞同，不妨明确地表达出来，因为这么做能使你们的相似处更多，进而联系更加紧密。


    再则，在交谈的过程中，为了提高对方“诉说”的欲望，你大可以在旁边“煽风点火”，使对方的情感膨胀，让他将谈话的重点聚焦在情感状态上。


    你很容易发现，生活中不少女人都非常爱唠叨、说起话来总是没完没了，尤其是在她们抱怨的时候更是如此。这是因为，她们抱怨的时候关注的是自己的情感体验。许多情感方面的心理学研究都表明：人越是关注自己的感受，就越容易情绪化，也越容易打开自己的话匣子。


    因此在谈话中，你可以有意识地引导对方关注他自己的感受。比如你可以说：“天啊，真的是这样吗？当时你一定气坏了。”“碰到这样的事情，你一定很郁闷吧？”“真是无法想象，当时的你怎么能够忍受？”……这样，通过你连续的“煽风点火”，对方的情绪就被你调动了起来，他的情绪体验变得强烈了，自然不能忽视自身的情感体验，而你就成功地将对方关注的焦点引导到他自身的感受上面，从而强化了对方诉说的欲望。


    一般来说，这个策略的可行性很高，因为，生活中的压力与紧张是无所不在的，谁不想找个人说说呢？


    另外，在与对方谈话的过程中，有几点是需要注意的，否则极有可能让对方对你三缄其口：


    - ① 千万别求人家告诉你什么，因为那会让人觉得你很“八卦”，是为了满足自己的好奇心，而不是出自关心才渴望知道事情的经过的；

    - ② 当对方说到自己陷入麻烦之中时，你要让对方知道，如果可以，你会竭力地帮助他；即使那些麻烦事已经过去，你也要向对方传递你“很遗憾没能在当时为你做点什么”的信息，这有利于对方进一步打开自己的心扉；

    - ③ 如果对方提到自己的错误，你要注意消除对方心中的担忧和疑虑。人说起自己所犯错误的时候，心中都会担心他人因此而否定自己，一旦内心被这种担忧所占据，人就很再畅所欲言了。因此，你可以告诉对方你觉得有必要才会做那件事，否则你干嘛要做？“你那样做一定有你的原因。”……告诉对方“他之所以会那么做”，是因为“他有足够的理由那么做”，即使做错了，也在情理之中。这样能让对方觉得你是理解他的，你相信他，这有利于谈话的继续进行。


    在谈话中，如果你能用好上面的策略，就一定能让对方打开自己的话匣子。


    # 第五张 让他人喜欢自己的心理策略


    为什么有的人总是能让别人产生一见如故的感觉，而有的，却让人见而生厌呢？究竟是哪些心理因素影响了他人对你的关注程度、决定了他人对你的喜爱程度？怎样才能够获得他人的喜爱，让自己成为一个受欢迎的人呢？其实，这些都是很简单的事情，只要根据人的心理规律行事就可以了。本章将告诉你怎样去赢得他人的好感。


    ### 1. 做一个受人欢迎的谦虚者


    在社交中，很多人无时无刻不忘给自己脸上贴金。这样固然能够满足自我成就感，却会引起他人的反感。一方面，沾沾自喜的样子难免让人因羡慕恨；另一方面，这种做法在某种程度上意味着对他人的一种否定，从而使对方的“自我”产生不适感而与之采取抵牾的态度。


    有一个部门经理，业绩特别突出，到了年底，老板在表彰会上特别表扬了他，除了颁发他奖金外，还另外给了他一个红包。在大会上，主持人根据公司的安排请他谈谈感受。


    他拿过话筒就开始说自己在这一年中怎么兢兢业业，学习了多少知识，工作能力如何提高，就是没有提及上司对他的信任和重用，更没有感谢同事和下属的帮助与合作。


    表面上，大家都不说什么，但是，从此他的上司开始有意刁难他，同事离他远远的，下属们也变得懒散，还经常顶撞他。


    一个月过去了，以前挂在他脸上的春风得意的笑容没有了，他渐渐成了孤家寡人。


    不要感叹该部门经理的上司、同事或者下属度量狭小，其实造成这种局面的是这个人忽略了别人的感受。每个人都认为别人的成功中有自己的功劳或者苦劳，而这个人却要独享荣耀，别人自然就会心里不舒服。


    如果你留意一下那些受人爱戴的大人物，你就会发现，他们之所以能够赢得人心，是因为他们在大多数时候都表现得十分谦虚。谦虚才能够赢得他人的友谊以及与他人合作的机会。


    前美国总统麦金利就是这方面的好手。


    在西班牙战争爆发之前，他就用这种方法赢得了一位很重要的、但是时常反对他的国会议员的心。麦金利总统对这位国会议员说：“老兄，这次战争的成败与否，我可只能全靠你了，你是所有人中我最信赖的人。”


    作为一个总统，却表现得如此谦虚，谦虚得完全要依靠对方，这在很大程度上满足了对方的自我优越感。事实上，即使没有对方，总统也依然可以找到他人，对方也非常明白这一点。这样，对方就更加认为他的谦虚难能可贵而更加喜欢他。


    由此可见，要想博得他人的好感，谦虚是必不可少的。值得注意的是，谦虚与自我否定是不同的。美国心理学家卢维斯指出：谦虚是一种美德，真正的谦虚并不是把自己看得很低、很糟，而是完全不想自己。真正的谦虚是不夸耀自己，把自己和别人都摆在正确的位置上，客观地评价自己和他人；盲目地夸大别人而否定自己的能力，或者盲目夸大自己而否定别人，都不是真正的谦虚。那么，怎样做才是真正意义上的谦虚呢？


    - 1. 充分认识骄傲的危害和谦虚的好处。科学家巴夫曾说过：“人一定不能 让骄傲支配自己。由于骄傲，我们会在应该妥协的场合固执起来。由于骄傲，我们会拒绝有益劝告和友好的帮助，让成功从身边溜走。而且，由于骄傲，我们会失掉客观的标准，迷失自己。由于骄傲，我们会失去身边人的友谊。”

    - 2. 超越自卑，树立自信。 当一个人内心充满自卑而又渴望自身价值得到肯定的时候，就会对外表现为骄傲自满。2008年3月的美国《心理科学》杂志公布了一项研究成果：人在现实生活中，外在表现越是低调和谦虚，其内心越自信。因此自信是谦虚坚实的心理基础。

    - 3. 客观全面地认识自己，给自己定位。《史记》中记载了这样一个故事，说的是汉使新派遣的使者寻找到达印度的通道时路过夜郎国。夜郎国王对当时的各国形势没有客观全面的认识，自以为夜郎国是最富有、最强大的国家，就非常自大地问汉朝使节：“汉与我孰大？”由此可见，如果不能客观全面地认识自己，就容易骄傲自满。

    - 4. 正确面对批评建议。面对别人的批评建议时，我们一定要审慎，不能过于主观臆断，要去考察它的正确性。对合理的、正确的批评和意见，我们要接受采纳。即使别人提出了不正确的意见，我们也不能否定别人，要秉持“自勉”的态度。


    ### 2. 责任感是获得他人认可的前提


    费尔拉·凯普在其著作《没有任何借口》中，十分强调人的责任感问题。责任是人天然应尽的义务，不管你扮演什么社会角色，都不能罔顾它。责任感是一个人能够立足于社会、获得他人认可取得他人支持进而成就事业和家庭幸福的
    至关重要的人格品质。


    1980年4月，美国营救驻伊朗的美国大使馆人员作战计划失败，作为计划的相关工作人员，无疑会受到公众的责难。此时，当时的总统吉米·卡特立即通过电视作了承担全部责任的声明，他说“所有责任在我。”意外地，吉米·卡特此举使所有的责难都消失了，同时，这位被人称为“误入白宫的历史上最差劲的总统”的支持率骤然上升10%。


    1986年底“伊朗门事件”被曝光，媒体揭露了美国总统里根曾给“圣向伊朗伊斯兰教什叶派领袖霍梅尼出售武器。里根作出的第一反应便是竭力遮掩，等到再也遮掩不住的时候，他又开始推卸责任，先是推到他的国家安全助理头上，接着又推到白宫办公厅主任唐纳德·里甘头上。里根的做法导致他在数个月中惨遭媒体围攻，并被国会调查。


    4个月之后，在民意调查中，他的支持率降低了20个百分点，无奈之下，他才选择了承担责任、承认错误，但为时晚矣。


    无疑，吉米的做法收获了人心，而里根的做法让自己彻底地失去了人心，无论是公众的心还是下属的心。人们喜爱有责任感的人，讨厌推诿责任、为自己找借口的人。有责任感的人才会获得他人的信任，赢得人心。


    有一位社会学家说：“如果你放弃责任，就等同于放弃了自身在这个社会中更好地生存下去的机会。”谁放弃承担责任，或者为自己找借口、推诿责任，谁就 被社会斥责。责任感是一个人获得他人认可的根本要求。


    一个富有责任感的人更加容易取得成功，进而赢得他人的尊重。体育界的成功者罗杰·布莱克非常受欢迎，他曾获得奥运会 400 米银牌和世界锦标赛 400 米接力赛金牌。然而，人们喜欢他并不全因为他所取得的杰出成绩，还有他的责任感，即使患有心脏病，他也不可能以此为借口，认为没有获得金牌是理所当然的。相反，他在整个职业生涯中，始终以世界冠军为目标不懈地努力着。他这种对自己无比负责的态度，赢得了他人的尊敬和爱戴。


    一个有责任感的人更让人信任。在物欲横流、生活节奏如此之快的今天，缺乏责任心的人很容易丧失原则，成为道德沦丧的人，做出诸如婚外恋、背叛合作伙伴、遗弃孩子、拒绝赡养老人等伤害他人极深的事情。而没有人能放心地和一个缺乏责任感的人深入交往。面对没有责任感的人，大多数人都会启动心理防御机制，将他关在心门之外。


    责任虽然有时候让你觉得沉甸甸的，但是当你乐于承担责任，成为一个责任感强的人的时候，就会收获许多沉甸甸的、可贵的东西，这里面浸透着他人的尊敬、感激、信任等。


    ### 3. 保持良好的情绪会给人留下好印象


    美国洛杉矶大学医学院的心理学家加利·斯梅尔做了一个实验，他让一个乐观开朗的人和一个整天郁郁寡欢、抑郁难解的人待在同一个房间里。结果发现，不到半个小时，这个乐观的人也变得愁眉苦脸起来。随后，加利·斯梅尔又做了一系列相关实验，得出一个结论：只要20分钟，一个人就可以受到他人低落情绪的传染，而那些敏感、富有同情心的人，则更容易被坏情绪感染。情绪的传染过程是在不知不觉中完成的。


    事实上，情绪会通过人的姿态、表情、语言进行传递，并在不知不觉中感染他人。这就是心理学上说的情绪效应。坏情绪会给他人带来消极影响，好情绪则会给他带来积极影响。


    曾经有个人做了一个心理实验：


    在路边餐馆的桌子上放10美分硬币，让来就餐的人捡到这种“意外之财”，然后，等他们离开的时候，故意从他们身边经过，掉落东西。看看有多少人帮忙捡起来。


    结果证明，有88%以上的人会帮忙捡起。那么，如果没有那“10美分”的前奏曲，结果又如何呢？调查显示，没有在桌上捡到钱的人当中，只有7%的人帮助他捡起落下的东西。


    这个7%与88%的对比实验说明，人如果具有好心情，那么更倾向于积极的行为。


    由此可见，好情绪有利于人际交往，而坏情绪则不利于人际交往。换言之，在现实生活中，我们要把握好与人交往的时机。


    一般来说，与人交往当然选择双方情绪都好的时候最为适宜。然而，总会出现其中一方或者双方情绪都不好但又必须要交往的情况，那么，此时我们应该怎么办呢？


    - 1. 如果是对方情绪欠佳，那么我们就先用自已的好情绪去感染他，用自己的微笑把我们的良好情绪传递给他。


    旅店业巨子希尔顿将 “今天你微笑了吗” 作为自己的座右铭，一路走来，他用自己的微笑感染了许多人。今天，他成了世界上最富有的人之一，他始终坚信 “当你给世界一个微笑，世界也会还你一个微笑”。


    的确，微笑是非常具有感染力的。它所传递的是一种善意、愉悦，能给人有沐春风般的感觉，因此，它对消除彼此的隔阅、缩短彼此的距离能起到立竿见影的效果，是人际交往中无往而不利的
    “人际交往高招”。不过，在运用微笑传情达意时，需要注意以下几个小技巧：


    - ① 要自信地微笑。微笑是为了给对方以乐观向上、自信的印象，希望对方信任自己。因此，在微笑之前，我们必须自信。这样的微笑才更富有感染力。

    - ② 要笑得自然。微笑需要发自内心才能让人觉得亲切、自然，美好、得体。“皮笑肉不笑”难免适得其反，让人觉得虚伪，进而给人际交往带来负面影响。

    - ③ 要笑得真诚。真诚的微笑才能让人内心感到温暖，才能引起对方的共鸣，加深彼此的友情。千万不要脸上挂着微笑，心里却在诅咒对方。事实上，人的直觉非常敏锐，对方完全能够判断你的微笑是否真诚。缺少了真诚的微笑会引起人的反感甚至敌意。

    - ④ 微笑要看场合。在一些比较庄严的场合，比如追悼会，或者非常正式而重要的会议，微笑是不合时宜的，甚至是招人厌恶的。当我们与人谈论一个严肃的话题，或者向对方传达一个不幸的消息时，又或者是对方的不快是源于我们时，也是不应该微笑的。

    - ⑤ 微笑的程度要合适。我们倡导多微笑，因为微笑是一种基本的社交礼仪，更是对对方的一种尊重。但如果时时刻刻都在微笑，微笑得过分、没有节制，就会有失身份，甚至引起对方的反感。

    - ⑥ 微笑的对象要合适。微笑也是有感情的，往往，我们心里带着怎样的感情，微笑就带着怎样的感情。当我们心里充满对长辈的尊重时，微笑就会是尊重、真诚的；当我们心中充满对孩子的关怀时，微笑就会是关切的；当我们心里赏识对方时，微笑就会是认可的……因此，对不同的交际对象，应用不同含义的微笑传达不同的感情。


    - 2. 善用微笑的力量，我们可以使对方的心情好起来，从而营造出一种有利于人际交往的氛围。当然，在彼此心情都好时，微笑则会“锦上添花”。然而，如果是自己情绪不好时，就不要主动去与人交往了。因为，坏情绪相对于好情绪而言，具有较强的传染力。如果我们的坏情绪把本来开开心心的对方拖下了水，很可能对方以后就不愿意再与我们有所来往了。所以，当自己情绪不好时，调节好自己的情绪是第一时间要做的事。心理学家就调节情绪问题给出了以下一些参考方法。


    ① 找出使自己情绪不好的原因，努力排除它。当情绪不好的时候，问一下自己：“到底是什么事情困扰了我？”“这件事真地那么重要吗？它值得我如此伤神吗？”“即使它真地很重要，我如此伤神，对事情会有所帮助吗？”“如果没有，那我为什么还在这里伤神，而不是行动起来，做些什么来改善情况呢？”保持健康的心态去积极面对，然后用实际行动排除掉那些烦扰你的事情，释放自己的心灵，才是治本之法。


    ② 用自我暗示法调节情绪。如果受到别人的称赞和鼓励，我们的心情往往就会很好。然而，与其被动地等待别人的称赞和鼓励，不如自己主动地进行积极的自我暗示。比如，对自己说“我是最坚强的！”或者对着镜子给自己一个微笑，都是积极的自我暗示，能够调节情绪。


    ③ 用行动转移法调节情绪。心情开始不好的时候，就让自己忙起来，使自己没有时间去思考那些不愉快的事情，这也是一种调节情绪的有效方法。


    ④ 用适当的方式来宣泄。人在情绪不好的时候，应当有节制地发泄，比如，向亲友倾诉自己的委屈和 不快，求得他们的安慰和开导；或是去 KTV 大声唱歌，宣泄心中的郁闷等，都能起到缓解不良情绪的效果。


    ⑤ 学会幽默。幽默是一种特殊的情绪表现，也是人们适应环境的工具。当我们情绪不佳时，先幽默自己一下，比如，自言自语地说，“看，上帝还真是宠爱我，又拿这些恼人的事来考验我了，只是上帝何时才能发给我‘合格证’，呢?”


    - 3. 此外，人的生理情况也能影响情绪。因此，为了拥有一份好心情，我们应该遵循以下这些特定的生理规律：


    ① 保证充足的睡眠。睡眠充足了才能拥有乐观的心态，才能抵御坏心情来袭。


    ② 合理饮食。只有通过合理的饮食，才能保证大脑所需的营养补充，才能使大脑“不闹情绪”。


    ③ 经常运动。在运动的过程中，人体会自动产生一种让人心情愉悦的激素，让人快乐起来。


    当我们利用这些方法调节好自己的情绪后，我们就能够用自己的好情绪去感染人、去与人交往了。


    此外，要切记的是，如果两个人的情绪都不好，千万不要试着去交流沟通。因为，坏情绪是绝对对沟通不出好结果的。不妨先留出时间让彼此冷静一下，等到彼此都调节好情绪以后再进行交流沟通，这样才能达到交际的目的—与人建立起良好的人际关系。


    ### 4. 相比完美的神，人们更喜欢稍有不不足的人


    一位著名的心理学教授曾做过这样一个实验。


    他准备了四段情节类似的访谈录像：


    第一段录像中被访谈的是个非常优秀的成功人士，他不仅俊朗不凡，而且成就了辉煌的事业，在整个访谈过程中，他自信、从容、谈吐不俗，表现近乎完美。


    第二段录像中的被访谈者也拥有同样好的条件，不过在被访谈的过程中显得有些紧张，碰倒了咖啡，弄湿了主持人的衣服。


    第三段录像中的被访谈对象是一个各方面都非常普通的人：没有引以为傲的成就和身形，在整个采访过程中虽然没出什么错，但也没有什么突出表现。


    第四段录像中的受访人也非常普通，没有什么亮点，而且在受访过程中，他也因为紧张而打翻了咖啡。


    教授将这四段录像分别播放给测试对象观看，然后要他们选出自己最喜欢和最不喜欢的受访者是谁。


    结果，最不受欢迎的是第四段录像中的受访者，几乎所有人都选择了 他。然而，令人惊奇的是，最被人喜爱的人并不是第一段录像 中那位几乎完美的受访者，而是第二段录像中打翻了咖啡杯的那位，有95%的测试者选择了他。


    这个实验反映的现象就是心理学上的一个著名的“出丑效应”，又叫“仰巴脚效应”，是指全无缺点、近乎完美的人并不一定能够得到大家的认可，而那些整体表现完美，却又有些小瑕疵的人反而更容易获得大家的认同。


    人们虽然向往完美，但是在潜意识中对完美又有一种排斥。一方面，完美与现实生活的距离过大，让人觉得很真实；另一方面，人的潜意识或多或少都认为：承认完美是一种自我贬低，而自我贬低与人实现自我价值的本质需求是相违背的。所以，人在心理上对“完美”有一种又向往又排斥的矛盾。


    中央电视台心理访谈节目的专家、全国著名心理学家赵梅曾去青岛出席一个心理学讲座。当时，她细致得体的穿着、优雅高贵的举止、知性的语言再加上渊博的学识，以及在心理学界的卓越成就，使得在场的每个人几乎都认为她是完美的女人，也是个可望而不可即的女人。大家都钦佩她，但是却没有接受她，而是把她当做一个外来的“神”。


    由于赵老师的形象太过完美，众人都远远地坐在台下，甚至都不敢跟她近距离接触，仿佛与她接近就会让自己无地自容一般。尽管她在做讲座的过程中也主动与大家进行沟通与交流，然而，大家都没有什么回应。


