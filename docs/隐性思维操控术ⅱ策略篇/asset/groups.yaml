    # 7.向记者学采访技巧


    记者是一种社交性很强的职业，它要求从事该项职业的人具有让采访对象 畅所欲言的能力。那么，老练的记者是怎么做的呢？


    首先，他们会抱着“我喜欢采访对象”的心态来开始采访工作。


    心理学上有一个著名的“皮格马利翁效应”，说的是皮格马利翁爱上了一座美丽的少女雕像，从此他每天都深情地对石雕像倾诉自己内心的爱慕，终于，雕像被他感动了，真地成为一位活生生的美女。当然这只是一个传说，但就促进人际关系的发展而言，“喜欢对方”的确能发挥很大的功效。


    只要你抱着“他是一位好人，我喜欢他”的想法，对方多半会与你推心置腹地交谈。反之，如果你带着一种讨厌对方的情绪与对方进行交谈，对方往往会表现得相对抵触，而交谈也会不欢而散。


    非指示疗法和协议中心疗法的创始人 C. R. 罗杰斯曾说过：“以无条件的诚意进行会谈，能够打开对方的心灵，同时也能使对方对自己产生好感。”


    其次，记者们的采访往往都是从无关紧要的闲聊开始的。


    任何情况下，你主动与人会面、交谈，肯定都有你特定的目的。如果一开始你就立刻让话题直奔目标，那么结果很可能是对方拒绝回答，或者对方做岀不实的回答。'
  - '[PAGE 130]


    之所以会产生这样的结果，主要是因为直奔目标的交谈方式有两大弊端：一是开始就要求对方通过仔细思考作出回答，会让对方产生极大的心理压力，进而引发对方的抵触；二是开始就直奔自己的目的，会让对方产生一种被你忽视的感觉而产生心理阴影。


    一旦你采用这种方式造成了彼此间的鸿沟，那么，无论你之后说得如何天花乱坠，也很难将局势挽回。所以，在见面之初，先与对方谈论与他相关的既成事实或经验的话题，然后再慢慢地向你自己的目的靠拢，才能够让你达到目的。切记，心急吃不了热豆腐。


    第三，怎样称呼对方是关键。


    心理学家指出，想要与一位初次见面的朋友快速地热络起来，称呼是关键。你最好称呼对方的姓名，而不要“XX科长”“XX经理”“XX主任”“XX董事长”等。因为人一旦被冠上了这些头衔，就会扮演起相应的角色，会特别注意该角色的任务和地位，并借此掩盖起那个“真我”；而称呼对方姓名则能够给对方一种“你现在已不是一位科长（经理、主任等）”的心理暗示，暗示对方是单纯的一个人，从而解除其心理武装，而且还可以预防对方在谈话之后以“我还要征求经理的意見……”之类的托词来敷衍你。


    当然，不排除有一部分人非常喜欢别人称呼自己的头衔以满足自己的虚荣心。对这种人，你不能直呼其名，而要投其所好地称呼他的头衔来满足他的虚荣心。这样才能获得他的好感，进而使他在你面前畅所欲言。'
  - '[PAGE 131]


    向记者学得这3招，一定能让你顺利地打开对方的话匣子。'
  - '[PAGE 132]


    # 8. 如何使对方说不愿说的话


    生活中，一个人之所以会有不愿意说出的话，主要是为了保护他的“自我”，如果这些心里的话说出口，就会让他觉得尴尬，或让他觉得有损自我形象，又或者会让他有危机感。针对这种情况，你如果能够打消他的心理疑虑，就能让他说出本不愿说的话。


    为了打消对方的心理疑虑，让其说出本不愿说的话，你可以采用以下心理策略：


    +   1. 不直接问对方，而让他以第三者的身份来说出心里的话。比如，你想问一位年纪较大的人对时下年轻人的看法，如果你直接问对方：“你对现在的年轻人有什么看法呢？”对方很可能轻描淡写地回答说还不错，很有朝气……”你听到的只是一些表面上的恭维话，而非他内心的真实想法。但是如果你换一种问法，问他：“你觉得，像你们这个年纪的人会以什么样的眼光来看时下的年轻人呢？”这样，对方就可以从第三者的角度，以“这个年纪的人”的身份说出一些较中肯的评价，而不用担心说出心里话会引发年轻人对自己的反感。因为他发表的虽然是自己内心的想法，但却是以他人的身份，这样就将批评性言论与自己撇清了干系，消除了疑虑。


    这种方法是辅导人员、会议主持人、节目主持人等常用的技巧。他们深知这种方法能够使对方觉得说出的话与“自我”无关，从而毫无顾忌地、放心大胆地高谈阔论。'
  - '[PAGE 133]


    +   2. 动摇对方的内心。或者向对方表示同情，或者温言劝慰，或者作势吓唬……无论是软的还是硬的，只要你让对方内心产生了动摇，对方就会说出原本不愿意说出的话。


    说到动摇他人内心的攻心之术，我们不得不承认警察是专家。他们采用的攻心之术主要有这几种：


    +   ①要选择毫无装饰的房间作为质询嫌疑犯的地点，这样做主要是为了防止嫌疑犯的注意力分散而减弱攻心术的效果；


    +   ②审讯者在言行上会突显自己的权威性，以给嫌疑犯一定的心理压力，让嫌疑犯自己把自己的心 门打开，进而说出实情。比如审讯者往往会以非常严厉的口吻说“坐下！”“看这里！”等；


    +   ③向嫌疑犯传递同情对方的信息。这样能够让嫌疑犯觉得自己和审讯者有心理共鸣，从而不自觉地撤销自己的心防。


    总的来说，要想使对方说出本不愿意说的话，有迂回取胜和直接进攻两种方式。


    所谓迂回取胜是指通过巧妙的提问，让对方的“自我”不必为“第三者”的言论负责，这样对方就可以放心地发表意见了。要知道，一旦事情与“自我”产生了联系，人就会表现得非常敏感、谨慎；而如果这种联系不存在的话，人就会少很多疑虑和顾忌。至于直接进攻，你完全可以向警察学上一两招。或者施加压力，让对方不堪重负之下说出心底的话；或者表达同情，使其放松警惕，自然而'
