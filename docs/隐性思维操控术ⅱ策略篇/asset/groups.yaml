    # 5. “安全需要”决定人际交往必须以诚信为本


    社会心理学家多伊奇和杰勒德曾做了这样一个实验：


    首先他们请所有被试者看一部录像片。然后，他们将被试者分成四组，以不同的方式表达自己对录像片的看法：第一组为无承诺组，即不需要把自己的看法说出来。第二组为弱私下承诺组，他们需要将自己的看法写在一块魔术板上，但只需要轻轻一抹，所有的字就会消失，不会留下任何痕迹。第三组为强私下承诺，他们被要求将自己的看法写在一张纸上，而且必须让别人看到，但不需要署名。第四组为公开承诺组，被试者将自己的看法写在一张纸上，签上名，并将这张纸上交。


    接着，专家会让被试者们进行讨论，不过，他们预先安排了多个假被试者发表同样的观点，之后，再统计真被试者们观点的改变情况。


    结果发现：无承诺组绝大多数都没有坚持自己的观点，而跟随着假被试者；弱私下承诺组和强私下承诺组的从众率呈下降趋势；而公开承诺组的被试者几乎没有人改变自己的看法，他们往往据理力争，坚持自己的观点是正确的。


    从这个承诺实验中，我们可以看出，承诺对一个人是具有约束力的，而约束力的大小与承诺的强弱成正比。那么，为什么承诺具有这样的约束力呢？原因就在于，在人的潜意识中，出于对安全的需要'
