    # 4. 被尊重是人最本质的需求


    在心理学上，平等就意味着平衡。只有交际双方的心理同时处于平衡状态，才有可能进行下一步更深层次的交往。著名心理学家马斯洛认为，人人都希望自己有稳定的社会地位，希望在人际交往中能够得到他人的尊重和社会的认可。


    人的“尊重需求”是源自本性的需要，它包括了内部尊重和外部尊重。内部尊重是指几乎每个人都希望自己无论在什么情况下都是有实力、能胜任、充满信心、独立自主的，也就是我们平常所说的自尊。外部尊重是指人对自己社会地位和威信的渴望，希望获得他人的尊重、信任和肯定。


    平等是尊重的基本内容。也就是说，人的本性需求使每个人都渴望被人平等对待。在人际交往的过程中，尊重别人是获得别人尊重的前提条件。马斯洛曾说平等之餐可以滋润心灵。”要想从他人那里获得外部尊重以滋润自己的心灵，我们就必须先用自己的尊重去滋润别人的心灵。这样，我们才能获得对方对我们的认同，才能给对方留下良好的印象。


    诸多心理学家明确指出，在人际交往中，平等待人是建立良好人际关系的前提，谁不平等待人，谁就会为大家排斥。


    英国维多利亚女王和阿尔贝托亲王的琴瑟合鸣一直是人们津津乐道的事情。然而，在他们的和谐生活中，曾经有过这样一段不和...'
