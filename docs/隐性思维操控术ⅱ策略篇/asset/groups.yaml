    再则，在交谈的过程中，为了提高对方“诉说”的欲望，你大可以在旁边“煽风点火”，使对方的情感膨胀，让他将谈话的重点聚焦在情感状态上。


    你很容易发现，生活中不少女人都非常爱唠叨、说起话来总是没完没了，尤其是在她们抱怨的时候更是如此。这是因为，她们抱怨的时候关注的是自己的情感体验。许多情感方面的心理学研究都表明：人越是关注自己的感受，就越容易情绪化，也越容易打开自己的话匣子。


    因此在谈话中，你可以有意识地引导对方关注他自己的感受。比如你可以说：“天啊，真的是这样吗？当时你一定气坏了。”“碰到这样的事情，你一定很郁闷吧？”“真是无法想象，当时的你怎么能够忍受？”…这样，通过你连续的“煽风点火”，对方的情绪就被你调动了起来，他的情绪体验变得强烈了，自然不能忽视自身的情感体验，而你就成功地将对方关注的焦点引导到他自身的感受上面，从而强化了对方诉说的欲望。


    一般来说，这个策略的可行性很高，因为，生活中的压力与紧张是无所不在的，谁不想找个人说说呢？


    另外，在与对方谈话的过程中，有几点是需要注意的，否则极有可能让对方对你三缄其口：


    +   ①千万别求人家告诉你什么，因为那会让人觉得你很“八卦”，'
