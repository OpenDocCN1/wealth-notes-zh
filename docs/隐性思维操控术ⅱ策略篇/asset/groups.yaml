    ## 5.大家 good 才是真的好


    哈曼・托勒是美国斯迈尔公司总裁，他在与那些大电器公司进行长期承包合作的时候，很注意对公司的要人进行感情投资，即使是对那些显得无关紧要的年轻职员，他也同样殷勤对待。


    无疑，哈曼是个社交的高手，他非常明白自己今天的付出将在日后带来什么。所以，当自己的目标人物身上有什么值得高兴的事情发生的时候，比如晋升为经理时，哈曼就会在第一时间跑去祝贺、赠送礼物，同时还邀请对方到高级餐厅用餐。面对哈曼这种盛情的款待，对方会怎样呢？他们自然会在心里想我从未给过这位老板任何好处，而且现在他也不可能从我身上获得什么好处，但是他对我的态度却是这样真诚。如果以后有机会，我一定要好好报答他。


    哈曼善于利用心理学中的“互惠定律”，因而使自己的公司在竞争十分激烈的生意场上，生意日益兴隆。


    由此可见，互惠与否在很大程度上影响人际关系。其实，人与人相处就是这样：“给予就会被给予，剥夺就会被剥夺；信任就会被信任，怀疑就会被怀疑；爱就会被爱，恨就会被恨。”这就是心理学上的互惠定律。


    心理学上的很多实验都说明了人与人之间的交往遵循着互惠定律，比如：心理学家巴克曼随机选取互不相识的被试者，他分别单独告诉被试者小组里的XX很喜欢你。”当然，这些好感信息都是巴克曼杜撰出来的。


    在小组经过一次讨论后，巴克曼告诉被试者，小组将被解散，要重新组成两人小组进行讨论，被试者可以把自己的选择对象写在纸条上，作为分组的参考。


    结果，被试者选择的几乎都是巴克曼说的喜欢他们的那个人。


    心理学家艾宾浩斯的圣诞卡片实验也是很好的证明。


    在某个圣诞节的前夕，艾宾浩斯给一群素不相识的人寄去了圣诞卡片，而这些对象也是随机抽取的。


    艾宾浩斯寄卡片的时候，他对回音并没有抱太大希望。然而，真实的情况是，他收到了一大堆这些陌生人回寄的卡片。


    这两个实验有力地证明了，互惠关系定律对我们的人际关系有着重大的影响。那么，为什么当人有所得到的时候，就会在将来的某个时候回报呢？


    简单地说，这出于人的负债感。比如，超市经常会设有让顾客免费品尝的商品促销活动。很多人都发现，如果接受了那个满面笑容的促销员递过来的免费品尝食品，即使自己并不那么钟情食品的味道，也会或多或少象征性地买一点。其实这就是商家很好地应用了“互惠定律”，让人产生负债感的自然力量释放出来，进而成功地销售了自己的商品。


    那么在现实中，我们怎样才能让“互惠定律”产生作用呢？在正式运用互惠关系定律的操作过程中，我们要掌握以下小技巧：


    - 1. 要了解对方，并给予对方理解。只有充分了解对方，才不会“吾之蜜糖，彼之砒霜”的情况发生。而给予对方理解正是一种最基本的互惠，这是对对方尊重，是获得对方对你的肯定的前提；否则，很容易引起对方对你的“反射性”否定，进而产生负面效果。

    - 2. 要经常表达感激之情。心理学家指出，人际交往是向着酬资增加和代价减弱的方向发展的，随着时间的推移，物质酬资给人的满足感会越来越弱，而心理酬资则不会。因此，要想满足对方越来越多的酬责需求，只有选择心理酬资才是明智的，而感恩正是心理酬资的一种主要方式。


    另一方面，经常表达感激之情能够感染对方，让他也知道感恩，使互惠的结果得以保证。


    - 3. 永远不要抱怨。我们必须知道，在付出到获得之间，有一个时间过程，有时这个等待的时间会远远超过我们所预期的。如果这时我们抱怨，那么之前所有的努力都会白费。

    - 4. 改变自己。蒙哥马利说“对别人经常心灰意冷、束手无策的人，他们不是无法改变别人，而是不能改变自己。”当我们发现自己所作的努力完全石沉大海的时候，我们要自我反省，然后改变自己。问问自己是不是一开始就选错了对象，毕竟这个世界上两个人天生不合的情况是存在的；想想自己是否有做得不当的地方，对于度的把握是否恰当。


    从社会学的角度来看，所谓人际关系就是人与人之间的一种心理关系，这种关系是在彼此交往的过程中形成的，是直接的和可感知的，并且蕴涵着一种价值关系。换言之，互惠与互利是人际关系的一个准则。想要获得良好的人际关系，首先要做到与对方在心理上互惠，然后才能在现实的人际交往中达成互惠，建立起彼此之间的友谊。


    ![](img/b69d9847e8d39a1178cebda87e1c1cd9_27_0.png)


    ## 6.从心理上拉近人与人之间的关系


    人们之间从互不相识，变得喜欢对方、和对方成为朋友，或者讨厌对方、和对方对立起来，真的是一个非常奇妙的过程。那么到底是什么因素在起作用呢？其实，原因是多方面的，但不可否认，距离是影响人际关系亲疏的重要内容。


    美国心理学家克恩曾做过这样一个实验：


    让一位男性同时和两位女性说话，一位女性坐在离他0.5米的地方，另一位女性坐在离他2.4米的地方。等谈话结束后，询问这位男性对谁的好感多一点儿。


    结果显示，男性普遍认为，自己对坐在0.5米远地方的那位女性更有好感。


    1956年，心理学家怀特也做了一件针对相关问题的调查研究。这次的调查研究是针对一个叫派克森林的郊区居民点的友谊模式进行的。


    派克森林的居民到这里定居的时间相差不多。他们住房的外观都很相似，居民住房的位置大都是随机选取的，因此，谁和谁成为邻居带有偶然性和随机性。


    接下来，怀特对这里居民的社交对象和交往频率进行了调查统计。结果他发现，人们的社交活动在很大程度上依赖于邻近性，他们的交往对象几乎都是都离自己家较近的几个街区范围以内的居民。


    由此我们可以得出这样的结论：住得很近的人明显地容易建立友谊，更容易彼此喜欢和吸引，更容易成为朋友。人们常说“远亲不如近邻”，就是这个道理。


    事实上，对人际关系的亲疏产生影响的不仅仅是空间上的距离，兴趣、喜好上的距离也对人际关系产生重要影响。


    在人际交往中，人们往往会因为彼此在某些方面比较接近而感到相互之间更加容易接近；而这种相互接近，通常又会催生彼此之间的亲切感，进而更加乐于接近对方、体谅对方。心理学上把人际交往中的双方由接近而亲密、由亲密而进一步接近的这种相互作用叫做“亲和效应”，也叫“近水楼台效应”。心理学家们通常用“自己人”来形容这种亲和关系。


    心理学研究表明，一个人的外表反映了其内心，服饰、言行、眼神等都在向别人传达着某种信息，让别人读出你是否友善，是否愿意与人交谈。没有人愿意接近一个表面看起来孤傲的人，因为没有人愿意看到自己被拒绝的场面。因此，人们往往乐于去接近那些在他们看起来比较容易亲近的人。


    人们在人际交往和认知过程中往往存在一种倾向，即对于与自己较为亲近的对象会更加乐于接近。人都喜欢待在熟悉的环境里，和熟悉的、和善的朋友交流。这不仅让人们觉得没有危险，而且这种氛围更具感染力。


    劳伦是位来自洛杉矶的经验丰富的女商人。她穿着时髦，讲究品位。因为想放慢生活节奏、得到更多的归属感，劳伦搬到西南部的一个小镇。她喜欢这个城市和这里的居民，但是她感到自己在这里并不受欢迎。她百思不得其解。后来，有朋友给她指出，她的衣着谈吐让当地人觉得她是在装腔作势，让人产生一种距离感。于是，劳伦开始改变自己的穿着和说话方式，她穿着很随意的衣服，与当地人谈论当地的事情，试着让自己多参加当地人的社交活动，试着让自己看起来更加容易接近。慢慢地，她发现自己变得与新邻居和新同事更加容易交流了。


    在现实生活里，人们往往更喜欢把那些与自己志向相投、利益一致，或者同属某一团体、组织的人视为“自己人”。在其他条件大体相同的情况下，所谓“自己人”之间的交往效果往往会更为明显，其相互之间的影响通常也会更大。因为是“自己人”，所以会感到相互之间更加容易接近。而这种相互接近，通常又会使交往对象之间产生亲切感，从而更加相互接近、相互体谅。


    因此，人们要想使自己的热情能够得到对方的正面评价，就应当在交往过程中积极创造条件，努力制造共同点，从而使双方都处于“自己人”的情境中，从而产生亲近感。


    在人际交往中，切忌高高在上俯视众生，那样大家都会远远地看着你，而不会真正地与你谈心。只有深入了人心，大家觉得你可亲了，才会与你接近。


    心理学家认为，人缘好的人，他们在有意或无意中利用了心理学上的“亲和效应”，其中关键点是挖掘共同点，成为自己人。就是找出自己与周围人的共同之处，它可以是血缘、姻缘、地缘、学缘、业缘关系，可以是志向、兴趣、爱好、利益，也可以是彼此共处的同一团体或组织。


    ## 7.消除以貌取人的心理


    生活中，我们常听人说“某某一看就不是个好人”“某某面善”。对于那些看起来“贼眉鼠眼”和“慈眉善目”的人，相信大家在内心都会对其有个最基本的判断。通常情况下，多数人都会认为前者非奸即盗，后者却是大慈大悲，而无论是小说里描写的人物形象，还是荧屏上诠释的角色，也大都与普通人对人物本质的判断相似。很显然，这是以貌取人。


    据说在我国的春秋时期，有位名为澹台灭明的武城人，字子羽。此人长得丑陋无比。他想拜孔子为师，但是孔子看他体态、相貌丑陋，便没有产生好的第一印象。当时，孔子认为，如此丑陋的人怎么会有才华呢？因此，便表现得极其冷漠，不愿将子羽收为弟子。对此，子羽也有所察觉，因此便主动告退，回家自学。在家中自学的子羽严格要求自己，他不攀附权贵，不鄙视贫者，努力修身养性，刻苦自强，最终取得了很大的成就。


    而孔子所收的弟子中有一个名叫宰予的人。此人眉清目秀、玉树临风，且能言善辩。第一次见面，孔子就对他产生了好印象，认为此人将来必定会很有出息。可是，日子一天天过去了，孔子也日渐发现，宰予虽面貌端庄，却缺乏品行又懒惰成性。为此，孔子骂他说“朽木不可雕也，粪土之墙不可污也。”


    孔子非常后悔，他为自己的错误判断感到很惭愧，他说“我仅凭言辞判断人，对宰予的判断就发生了错误；仅凭相貌判断人，对子羽的判断就发生了错误。”


    在第一次见子羽和宰予的时候，孔子因为单从对方的言辞、相貌上来判断人的品德才智，因而有了冷漠丑陋的子羽而青睐善辩的宰予两种截然不同的态度。按理说，孔子是优秀的大教育家，他的学问可谓渊博，见识也比一般人广，他在识人方面应该是有一套较为深刻的见解的，然而，他也出现了判断上的错误。孔子的这种“以貌取人”，就是“体貌效应”在起作用。


    心理学上这样定义体貌效应:它是根据人的身材和相貌而导致别人对其认识上的成见。在日常生活中，一个人的身材和容貌对其生活、工作、交际都有相当大的影响力。由于多数人在判断人时都容易受到“体貌效应”的影响，从而导致判断上的失误。通常情况下，人们都会羡慕那些身材匀称、容貌姣好的人，因为在众人看来，这样的人散发出一种无形的魅力，让人羡慕的同时还想接近他。相反，身材不好或容貌丑陋的人往往容易被冷落。


    生活中的方方面面，都有体貌效应的存在，它影响着人们的判断。然而，我们都应该明白的是，“体貌效应”虽然对我们或在人或事物的认知上有一定的帮助，但是它毕竟是一种以偏概全的认识方法，倘若完全遵循此规律，则难免会出现对人判断上的失误。


    受体貌效应影响的人实在是数不胜数。看过小说《三国演义》的人都知道，庞统是个长相奇丑但极具才华之人。在当时，各国的统治者都希望招揽贤士、将才，很多人都被称为是任人唯贤、爱才惜才的典范。但是具有“真本事”的庞统的境遇却并不顺利。原因就是在他身上发生了令人扼腕叹息的体貌效应。


    孙权向来以任人唯贤著称，但是他却曾“相马失于瘦，遂遗千里足”。孙权的爱将周瑜死后，鲁肃便极力给他推荐庞统。孙权一听此人具有将帅之才，高兴得不得了，但是等见到庞统后，便由最初听说时的“大喜”变成了“心中不喜”，原因就是由于庞统生得“浓眉掀鼻，黑面短髯，形容古怪”，再加上庞统对孙权一向器重的周瑜并不十分推崇，孙权便错误地认为此人狂傲，用他并无多大益处。看孙权如此态度，鲁肃忙对孙权讲了庞统在赤壁大战时“献连环计，立下奇功”的事迹，可是孙权已经先入为主了，他对庞统没有好印象，因此便固执地表示“誓不用之”。


    鲁肃深知庞统是个人才，既然孙权不肯任用，那就推荐给刘备好了，毕竟刘备此人宽厚待人、求贤若渴。然而，谁知道结果依然如前。尽管刘备爱才心切，而且他也早已了解庞统的价值，但是当他满怀期待地见到了庞统后，心一下子就凉了下来，看到庞统“貌陋”，他“心中亦不悦”，于是不肯委以重任，勉强给庞统安排了个县令这样的小官去做。


    庞统确有旷世之才，当时的各国统治者们的确是求贤若渴，但是庞统却几次遭冷遇，不得重用，其中很重要的原因就是因为他长得丑，给人的第一印象不好。孙权和刘备都是没有见到庞统前听说其旷世之才时欣喜若狂，但是在见了以后，都因此人相貌丑陋而变得心中不悦了，这就是体貌效应在其中起作用的原因。


    在日常生活中，识人是了解一个人的开始。我们在识人时一定要注意自己不要陷入体貌效应的陷阱,不要单凭对方的衣着打扮或身材相貌来判断此人是否富贵、是否有才、是否有德……而应对其做进一步了解。另一方面，由于体貌效应的普遍性，我们在个人形象上也不能总是不修边幅，不然很可能会给他人留下一个不好的第一印象，先入为主的第一印象是很难改变的。也许你会说，相貌是天生的，总不能为此去整容吧？的确不至于如此。很多时候,我们的确无法改变自己的相貌，但是我们可以通过整洁的衣着、必要的修饰、稳重的举止、优雅的谈吐来树立自己的形象。倘若因为形象的问题而影响了
    自己， 就得不偿失 了。


    ## 8.心理平衡，社交才能和谐


    1958 年，社会心理学家海德对人如何处理自己的人际关系问题做了专门研究，并提出了“平衡理论”，又称“P、O、X 理论”。


    P 与 O 各代表一个人，X 是第三者或事件;P、O、X 三者共同构成了环状闭合系统;三者间的关系按其正负特点，分别取+1 或-1，如果关系取值相乘结果为
    +1，则人的心理处于动态平衡，反之则不平衡。


    假如 P 是我们自己，O 是交往对象，X 是对喝咖啡的看法，那么，就会形成如下图所示的人际交往互动关系。


    ![](img/b69d9847e8d39a1178cebda87e1c1cd9_36_0.png)


    当对方喜欢喝咖啡（即:关系 2 取+1），认为喝咖啡对于我们来说也是一件愉快的事情（即:关系 3 取+1），并且对方喜欢我们（即: 关系 1 取+1）时,
    对方的心理状态才能平衡。


    海德认为，人类普遍有一种平衡需要，人们喜欢完美的平衡关系，而不喜欢不平衡的关系。一旦人们失去平衡,就会在心理上产生紧张，从而促使人按照“最小努力原则”重新找回平衡、转向和谐。


    在上面的例子中，假如对方喝咖啡并不是我们所喜欢的（即：关系 3 取−1），而对方喜欢喝咖啡（即：关系 2 取+1）时，如果对方是认可我们的（即：关系 1 取+1），那么关系
    1、2、3 的乘积为−1，对方心理产生不平衡，感到紧张。为了摆脱紧张感，对方就会遵循“最小努力原则”来进行调整。


    当对方认为，要使自己不喜欢我们比使 自己不喜欢喝咖啡更困难时，对方就会放弃对喝咖啡的喜好，即：关系 2 取−1，来重新找回平衡。反之，如果放弃喜欢喝咖啡比较困难的话，对方就会变得不喜欢我们。


    在交际之中， 总会有 8 种不同的关系情况，如下表所示：


    | 编号 | 关系 1 | 关系 2 | 关系 3 | 乘积 | 心理状态 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 1 | -1 | +1 | +1 | -1 | 失衡 |

    | 2 | -1 | -1 | -1 | -1 | 失衡 |

    | 3 | +1 | -1 | +1 | -1 | 失衡 |

    | 4 | +1 | +1 | -1 | -1 | 失衡 |

    | 5 | -1 | -1 | +1 | +1 | 动态平衡 |

    | 6 | -1 | +1 | -1 | +1 | 动态平衡 |

    | 7 | +1 | -1 | -1 | +1 | 动态平衡 |

    | 8 | +1 | +1 | +1 | +1 | 动态平衡 |


    在这8种情况中，1-4都是属于暂时性的，5-8才是人的心理比较稳定的状态。换言之，无论开始时情况是怎样的，最终都会归同于5-8中的一种情况。


    那么，4种动态平衡状态对人来说有何区别呢？对此，海德及后来的社会心理学家纽科姆等人做了进一步的研究，他们认为:最后一种动态平衡是最理想的，在这种平衡状态下，交际双方P和O都会更加愉快。


    根据海德对“POX”理论的描述，在人际交往中,我们要有意识地为实现第 8 种平衡状态创造条件。


    虽然人际交往中的平衡效应并不是我们能够掌控的, 但是我们可以利用一些技巧来寻找到它。也就是说, 我们无法改变他人, 而一味迎合他人又是让自己非常痛苦的事情,
    因此, 我们要注意选择自己的社交对象, 寻找那些志同道合的人来交往。这样的交往必然是令人愉快的。


    有人说, 与自己志同道合的人是可遇不可求的。难道我们对此就真的无能为力了吗?


    我们知道, 当抛起一枚硬币时, 刚开始可能连续几次硬币落下后的结果都是显示正面, 或者都是背面; 然而, 随着抛硬币的次数增多, 正面和背面出现的次数会逐渐趋同。


    同样的道理, 在人际交往中, 如果我们能广结人缘, 那么就一定能找到很多与自己志趣相投的交往对象。那么, 如何广结人缘呢?


    在此之前, 我们需要注意几个原则性问题: 第一, 广结人缘要兼顾事业和生活的需要, 要平衡物质和精神的需要, 要重视心智方面的需要; 第二, 人脉资源的结构要科学合理,
