    ## 8. 发现他人的弱点


    有这样一个小故事：


    有一个人的生活得非常不快乐，总被无休止的忧虑所困扰，因此，他时常去寺庙里拜佛。去的次数多了，他发现庙里的住持大师似乎无论什么时候都是无忧无虑的。于是，他就向大师请教让自己无忧无虑的方法。大师说：“我之所以能够无忧无虑，是因为我是一个善于忘记的人。”


    试问，那个人为什么会有那么多的忧虑呢？当然是为自己的缺陷不足所担忧，害怕自己的弱点给自己带来可怕的后果。人会记得什么、忘记什么，这与她自身的心理有密不可分的联系。


    为了探究是什么决定了人的忘却和记忆，美国心理学家洛温斯坦做了一个这样的实验：


    他让一批人解答题目。整个解答题目的过程被设计得像进行智力比赛一样，打“开始”铃就开始，按“结束”铃就结束，在过程中，受测者会产生压抑、紧张等不愉快的感觉。


    解答题目结束后，洛温斯坦对受测者们对题目的记忆程度进行了调查，并且结合他们对题目的回答情况加以分析。结果，他发现受测者记得的题目多是那些自己成功解答出来的，并且记得十分真切；而那些自己没有解答出来的题目大都忘掉了。


    显然，对于那些自己解答出来的题目，受测者有一种成功的满足感，这让他们感到愉悦；而对那些自己没有做出来的题目，则会产生一种挫败感，这让他们感到不快。事后，出于一种本能，他们选择记住了自己的成功，而忘却了自己的失败。


    的确，对于那些让自己不快或者不顺利的事情，每个人总有一种想尽快将它从记忆中删除的潜在欲望。精神分析学将人的这种心理现象称为“自我干扰欲望”，是人类心理自我保护的一种方式。


    人的记忆中存在许多“暧昧”的地方。在常常产生遗忘现象的部分往往有形无形地隐藏了人的许多弱点。有人说过，“暧昧是为了忘却，忘却是为了掩饰”。


    你刚好可以利用这一点来探知对方的弱点。


    如果你留意观察，那么你一定会发现，那些前额头发稀少的人，一方面往往会习惯性地用手掌去抚前额；另一方面他又常常忘记拿帽子。这似乎有些相互矛盾，不过仔细分析一下他的忘物癖跟他的习惯性动作之间的关联，你就会了解，他经常用手摸前额，是一种无意识地遮掩自己秃顶这一身体缺陷的举动，而忘拿帽子则是出于一种时时刻刻都想忘记自己的欠缺的心理需求。


    事实上，生活中此类现象比比皆是。比如：皮肤越是不好的人越容易忘记日常护理；晕车的人时常忘记备用晕车药……人所逃避、遮掩、企图尽快忘记的，往往正是其弱点和缺陷所在。


    仔细观察对方无意识的举动，找到他的遗忘对象并且加以分析，你就可以发现对方的弱点以及没有由来的自忧自恼的根源；而这些往往是对方自己也不曾意识到的。


    ## 9. 移情是感知他人内心的有效方法


    移情就是“感人之所感”，并能“知人之所感”，意思是既能分享他人的情感，对他人的处境感同身受，又能客观理解、分析他人的情感能力。


    移情的通俗说法就是换位思考，或者称为感情转移、同理心，也就是设身处地为他人着想。在人际交往的过程中，要想体察对方的内心就必须学会换位思考。


    一个平时非常温和且善良的青年带着怒气讲述了这样一件事：


    一次，我坐公交车上班，人非常拥挤，我的身边站着一个年岁较大的人。过了一站后，我的旁边空出了一个座位，我正想侧过身子让这位老者过来坐下，还没等我反应过来，他却使出与年龄不相符的力气，以惊人的速度推开我，硬挤到座位上去了，还不忘在我的鞋子上留下他“英勇前进”的脚印。然后，他心安理得地坐在座位上，像是打了一场胜仗的将军一样趾高气扬，更不用提有一丝的歉意了。我心里可窝火了，好几天都没转过这个弯来。


    其实这个“蛮不讲理”的老人的心态很好理解，你可以想象一下，很多年轻人在车上不太礼貌，而且车上有那么多人，也许他还要坐很长时间的车，身体已经快要支撑不下去了，与其等别人给他让座，不如自己行动。如此，还有什么不能理解的呢？这样，青年的心态就会释然，自然就不会生气了。


    移情可以表现为很多形式，它是在情感自我知觉的基础上发展起来的，也就是首先要面对自己的情感。我们越是坦诚，研读他人的情绪感受也就越加准确。


    每个人天生都有体察他人情感的敏感性。如果没有这种敏感性，人就会产生情感“失聪”，这种“失聪”会使人们在社交场合做傻事，或者误解别人的情绪，或者说话不考虑时间和地点，或是对别人的感受无动于衷。所有这些，都会导致对别人的不理解和他人的误会。


    无论是搞销售、从事心理咨询、给人治病，还是在各行各业中当领导，移情能力都是取得优秀业绩的关键因素之一。


    移情能力是建立在细微、敏感的情感能力基础之上的，特别是建立在自我察觉力和自我控制能力之上的。一个缺乏自我察觉力以及不能控制自己情绪的人是无法去揣摩别人的心情感受的。


    弗罗伊德曾经说过：“人无秘密可言，即使他们嘴不做声，指头也会喋喋不休，内心的秘密总会通过每一个毛孔泄漏出来。”因此，移情要善于察言观色，善于抓住人们情感变化的蛛丝马迹来分析。移情的至高境界就是在别人的一举一动间体察其情绪和目的。


    ## 10. 别用自己的观点解说你看到的现象


    一个事业有成的男人到医生那里问诊，医生问：“你能告诉我你有什么问题吗？”


    该男子提到了他在生活和工作中负担过重的问题。他向医生非常详细地解释道：他要做的事怎样多，每天他要完成多少工作，他每天要处理多少大大小小的问题。因此，他根本没有留给自己时间。


    医生耐心地倾听着。当这个男人终于说完了之后，他问这个男人：“你对我说，每天你都要忍受很重的负担。可是为什么你还这么自豪地对我讲述这一切？为什么你在讲述这一切的时候，脸上始终洋溢着高兴的表情？”


    通过提问和观察，医生很快就意识到，在生活中追赶该男子的并不是这些工作，虽然他的工作确实很多，但是真正的问题在于，根据他的自我价值观念，他需要这么多的工作来维持这种大人物的感觉。他很自豪，他是如此重要，有那么多事情要他去做，有那么多的人需要他的帮助。


    医生并没有给该男子一个结论性的回答，他只是陈述了一个客观事实。


    不只是医生，对每一个希望了解别人的人来说，有一个根本原则，那就是：你只要提出你看到的和感觉到的，而不要根据你的观点总结解决别人问题的办法。比如你应该这样说：


    - “你今天脸色苍白”，而不是“今天你看上去好像很累(或者是病了)。”

    - “你今天根本不能安静地坐下来”，而不是“你今天非常激动，烦躁不安”。

    - “你今天一点儿也不健谈”，而不是“你今天怎么又发脾气了”。

    - “你今天穿得很时髦，很漂亮”，而不是“你今天是不是与男朋友有约会啊”。


    为什么前一种表达方式比后一种表达方式要好一些呢？非常简单，你能从别人身上观察到的表现，可能对应很多的事实。比如说某人脸色苍白，可能是因为疲劳，也可能是由于生病，或者人家故意把自己化妆成脸色苍白的样子。真正的原因应该是由他自己对你说，如果他是真愿意说的话。


    如果你仅仅根据自己的经验就对别人的状况作判断，比如在他非常疲劳或是生病的时候可能会表现得脸色苍白，那么你的判断可能会给别人带来压力。通常他不想对此说些什么，但他也不能粗暴地回答：“让我自己待会儿！”所以，出于礼貌，他不得不向你做出一个合乎情理的回答。而这种回答很可能不是你想了解的实情。


    因此，想正确地了解别人的心理，就请避免用自己的观点来解说别人身上发生的现象。


    # 第四章 让他人畅所欲言的心理策略


    交谈是人际交往的一种主要方式。令人愉快的交谈，会使彼此的了解逐渐加深，心理隔阂逐渐消失，情谊也会越来越深厚。而给人带来不愉快经历的交谈则会给彼此间的关系带来负面影响。怎样让他人愉快地畅所欲言，怎样尽可能多地从对方的言谈中获取你想要的信息？本章将为你提供一套无往而不利的心理策略。


    ## 1. 倾听是最好的恭维


    美国人德怀特·弗罗曾经是摩根的法律秘书，后来，他被总统柯立芝任命为驻墨西哥大使。然而，做驻墨西哥大使却并不是一件容易的事情，因为墨西哥对国际关系是非常敏感的。然而，出人意料地，弗罗在首次拜见墨西哥总统卡尔斯时，就赢得了对方的赞誉，卡尔斯总统称赞他是“真正进退有度的大使”。


    那么这位大使到底做了些什么，让总统对他赞赏有加呢？


    其实，弗罗所做的只是称赞了总统一厨师的厨艺，抽了一根雪茄；然后请卡尔斯总统发表了一些看法，比如：墨西哥的现状如何，内阁对墨西哥的希望是什么，卡尔斯总统对未来有什么看法和规划等。


    无疑，弗罗是一个很好的倾听者，他非常善于让他人掌握话语权。他请卡尔斯说话，然后自己扮演一个全神贯注的倾听者，这样，弗罗在无形中显示了对于卡尔斯总统的尊敬，给对方以满足感和荣誉感，从而赢得了卡尔斯总统的欢心。


    作为一名社交场上的成功人士，他势必深懂倾听的技巧。实际上，如果你曾留意过，你就会发现“倾听”与成功人士之间都有着密切的关系。有人曾说过：“一个日理万机、交际广泛、能取得卓越成就的人，绝对也是世界上最好的倾听者。当他想让你开心时，他只需要倾听你说话，就能够让你感觉自己像被宠爱的公主或王子一样。”


    美国著名的政治家海·约翰也是最棒的倾听者之一，有人称赞他说：“约翰是一名出色的演说家，更是一个最好的倾听者。当他倾听别人说话时，他的姿态、表情、眼神等，无一不向对方传递着‘恭维’，这种被恭维的感觉会让他人非愉悦。无论是谁，只要和他说上半个小时的话，都能感受到这位先生对自己的认可和尊敬，从而获得极大的自我满足感和成就感。”


    美国的前副总统豪斯也被人誉为“优秀的倾听者”。他正是使用了“倾听策略”，从而在与总统威尔逊首次见面时，就让对方对自己产生了极大的好感。


    大人物们几乎都懂得倾听的艺术，他们深深地知道，与那些对方不感兴趣话题比，倾听更能赢得人心。因此，在掌握他人的兴趣之前，他们总是饶有兴致地倾听，并且把倾听时那种享受的感觉表现出来。


    以采访领袖人物而闻名的新闻记者马可森也说：“很多采访的新手常常为了不知道怎样给对方留一个好印象而苦恼，尤其是在面对大人物的时候。大多数新手往往留给对方有偏见或者很粗心等不好的印象。其实，他们之所以无法让对方喜欢自己，其中关键的一点就是他们没能认真倾听被采访者的谈话，而过多地考虑自己接下来该说什么，从而让对方感觉自己被忽视而产生了不快，这样，对方自然无法对他们产生好感。那些大人物也表示，自己喜欢那些善于倾听的人，而非健谈的人。由此可见，倾听是非常重要而又难能可贵的才能。”


    总之，倾听是你所能给予对方最好的、最有效的恭维。倾听是一种十分简便的取悦于人的方法，同时还是诱导他人说话的良策。


    ## 2. 找到你与对方的共同点


    在与人际交往的过程中，如果对彼此讨论的话题毫不感兴趣，那么你会觉得很烦躁，希望赶快结束，当然也就不可能给对方留下多么好的印象。因此，为了留给他人一个好印象，使彼此能够进一步加深交往，那么在谈话中，就要善于体察对方的情绪，进而找到对方感兴趣的话题来交流。


    那么，我们具体应该怎么做呢？


    与一个不是很熟悉的人交往，首先会从一些无关紧要的话题开始，然后找出彼此间的共同语言。


    因为大家都不熟悉，都不知道对方有什么忌讳的话题，因此，大家首先谈论的肯定都是一些无伤大雅的问题。


    你可以从一些不会有什么意义但是可以让大家互相之间开始交谈的话题开始，比如最常见的就是谈论天气、周围的环境，简单地询问一下对方的情况，让他和你联系起来，在你们之间找到共同的语言，方便下一步的交流。通过这样的谈话，你可以更多了解对方的喜好，也让别人更加了解你自己。


    找到了彼此间的共同语言，也就相当于使对方的话匣子打开了一半，而另一半就需要通过一些技巧来打开了，比较常用的是通过一些随意的、看似不经心的问题来寻找兴趣点。


    基比有一次在公司聚会上和维多利亚相遇。他们站在吧台前，等着点酒。维多利亚说起了餐馆里面的艺术品，并开始征求基比的意见。她告诉他自己的看法，并问基比是否有什么艺术爱好。她接下来还问了他的个人兴趣。基比觉得和维多利亚谈话很舒服，就开始问关于她的更多情况——她有什么特别的爱好或者艺术的喜好。维多利亚解释说：她实际上是个画家，每周都在工作室度过。基比感觉这很有意思，问维多利亚从事什么艺术，态度认不认真，她解释道，尽管她不是依靠这个来赚钱的，但是她还是卖过几件作品，甚至最近还办了一个展览。


    维多利亚先向基比了解情况，并自然地告诉他自己的情况，显得自信而有魅力，并且她自己的优点也渐渐展现出来了：艺术方面有水平。


    基比还发现，在他们谈论艺术的时候，维多利亚并没有打断他而去谈自己的艺术才华，这也是一个优点！所以，谈话结束后，基比认为维多利亚有很多值得欣赏的地方，他很想进一步了解她。


    通过自然而随意的小问题，维多利亚找到了对方感兴趣的话题，并且在谈话的过程中，以自身的涵养给对方留下了好印象。然而，如果没有找到对方感兴趣的话题，恐怕彼此间的交流就不会这样顺利了。


    找出对方引以为荣和喜欢的对象，寻找对方感兴趣的话题，拉近彼此的距离，能够让你轻松地获得别人的好感，还能够起到“爱屋及乌”的效果。及乌的效应，会让你的收获大大超出你的意料。


    有一位教师想找校长办事，在与办公室主任的聊天中，他了解到校长对《红楼梦》特别感兴趣，曾在杂志上发表过一篇文章，还获过奖。


    他空手来到校长家，敲开门后，校长将他让到客厅，就去倒茶。趁这功夫，他打量了一下客厅，发现墙上有一副对联写着《红楼梦》中的语句。校长过来后他就问：“这副对联好像是《红楼梦》中的吧？”


    校长见他能看出是《红楼梦》中的对联，反问道：“你喜欢《红楼梦》吗？”


    “哎呀！太喜欢了。”他说，“据说《红楼梦》不看十遍没有发言权，我已看了不知多少遍。大学时代，一无聊我就看《红楼梦》，感觉是一种享受。但越看越感觉深奥，很多地方理解不透。”


    校长问：“你感觉什么地方最难懂呢？”


    “诗！我有一位朋友说，《红楼梦》中任何一首诗，只要从中挑一句出来给他看，他就知道是书中哪个人物写的，我试探过好几次他都判断对了，但我却无论如何都看不出来。”于是校长就开始给他解释诗与人物性格的关系。由于看过校长写的文章，他就专找校长比较得意的地方去问他，两人越谈越投机，不知不觉过了几个小时，校长一抬头，发现已经十点多了，突然醒悟过来，问道：“哎，你来找我是有什么事情吧？”

