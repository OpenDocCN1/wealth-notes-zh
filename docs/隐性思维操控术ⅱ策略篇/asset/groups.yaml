    3 种心理：个性内向、主观意识不强；自卑，对社交多些恐惧；城府很深。


    3. 以他人为话题：如果对方将第三者作为和你交谈的话题，对第三者的各个方面都滔滔不绝地加以评论（当然，这个第三者必然是你和对方都很熟悉的人），那么，对方多半是有某种企图。此时你应该好好地想一想：“他不停地说起第三者的意图是什么？”并且最好把话题岔开，千万不要随意附和他或者加以评论，一旦你这样做'
  - '[PAGE 94]


    了，就等于走入了对方的圈套之中。当然，不排除有的人是天生的长舌，即使这样，把话题岔开仍然是你最好的选择，否则很有可能为自己带来人际方面的纠纷。


    4. 将金钱视为禁忌：这类人对金钱很敏感，而这种敏感往往来自于金钱上的自卑或者不安全感。一般来说，如果他是 个有钱人，那么他的心灵一定正在被空虚所煎熬着，他害怕别人从他的手里夺走财产；如果对方是个物质相对贫乏的人，那么“如何获得金钱”多半已经是他生命的主题。总地来说，这类人之所以对金钱避而不谈，并非因为他们不把金钱当回事儿，而是他们太看重金钱了，太现实，认为金钱至上，有物质崇拜的倾向。


    5. 爱发牢骚：谈论中，无论说到什么都喜欢发牢骚的人，大都是完美主义者。他们的自信心很强，同时，他们对人对事也力求完美。自己没有达到预定目标就埋怨自己，别人做得不好他自然不会放过，因此，对于他们来说，世间总有那么多不尽如人意的事，牢骚自然很多。


    6. 爱赞美对方：你一定碰到过在交谈中不停赞美你的人，他们赞美你的个性、爱好、品味、职业、家庭……虽然，你明知道他的赞美也许并不那么真心，但是你仍然很受用。这类人一般比较有心计，他在恭维你的同时，很可能在心里盘算着如何达到自己的目的，他们多半有事情请你帮忙。因此，你要保持清醒的头脑，千万不要被他的赞美迷了心窍。'
