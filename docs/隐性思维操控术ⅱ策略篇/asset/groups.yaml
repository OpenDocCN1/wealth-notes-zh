    # 第五张 让他人喜欢自己的心理策略


    为什么有的人总是能让别人产生一见如故的感觉，而有的，却让人见而生厌呢？究竟是哪些心理因素影响了他人对你的关注程 度、决定了他人对你的喜爱程度？怎样才能够获得他人的喜爱，让
    自 己成为一个受欢迎的人呢？其实，这些都是很简单的事情，只要根据 人的心理规律行事就可以了。本章将告诉你怎样去赢得他人的好感。'
