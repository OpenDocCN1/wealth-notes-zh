    # **1.让他人按照你的心意去办事**


    威廉·鲁道夫·赫斯特是一位非常著名的出版商，他拥有23家报纸、12家杂志。然而，他当初也仅在旧金山拥有一份报纸而已。


    有一次，恰逢著名漫画家纳斯特来到旧金山，而赫斯特当时正在进 行一个非常重要的计划:他想在自己的报纸上刊登一些东西，以此来发动人们敦促电车公司在电车前面装上保险杠，从而提高乘坐电车的安全性。当他听到纳斯特来旧金山时，他立刻想到，如果请纳斯特画一幅相关的漫画刊登在报纸上，一定能引起人们对此事的
    普遍关注。


    然而，事实上，纳斯特替他画的第一幅画却并不怎么让他满意。那么，怎样才能使这位著名的漫画家心甘情愿地画出符合自己心意的画呢？为此，赫斯特一直思考着。


    这天晚上，赫斯特与纳斯特共进晚餐，赫斯特对纳斯特的那幅漫画大加赞赏一番，之后他又接着说这儿的电车总是出现事故，已经让许多孩子成了残疾、甚至失去了生命。有时候，我觉得那些电车就像吃人的妖怪一样，在街道上横冲直撞，视人的生命于无物。”


    听赫斯特说到这里，纳斯特突然跳了起来，大声地叫道天啊，先生，我突然有 了一个更好的构思，我保证能画出一张更加出色的漫画。请你把原来的那张撕掉吧，我重画一张。""


    于是，纳斯特兴高采烈地回到宾馆里，开始挥毫作画，直到深'
