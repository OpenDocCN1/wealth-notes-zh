    # **6. 人人都有自尊心，不要践踏他人的面子**


    心理学家指出，一旦“自我”受到威胁，个体就会忸怩不安；一旦“自我”受到伤害，个体就会感到痛苦，就会奋起反击。而“自尊”正是“自我”所包含的一个重要内容。通常来说，人们都喜欢赞扬自己的人，而讨厌批评自己、让自己没面子的人。在人际交往中，要想获得他人的好感，就要顾全他人的自尊，保全他人的面子。一方面，要提醒自己不要去践踏别人的尊严，另一方面，要学会维护他人的自尊。


    +   1. 一般来说，他人的弱点、缺点、污点等忌讳之物，都是“雷区”一碰不得，至少有以下几点是我们应该避开的。


    +   ①丑陋之处：爱美之心人皆有之，每个人都希望自己是美丽的、俊逸的。然而，生活没有慷慨地让所有的人如愿，这个世界上还有不少的丑陋者和残疾者，他们大多有自卑感，不愿听与自己的短处有关的话题。比如，秃顶者忌说“亮”，胖子忌说“肥”，矮子忌说“武大郎”，其貌不扬者忌说“丑八怪”，跛子忌说“举足轻重”，驼背忌说“忍辱负重”等。对他们的这种完全正常的心理，我们应该充分理解。


    +   ②失意之处：人生在世，有起有落。即使今天看起来多么意气风发、踌躇满志的人，都可能经历人生的挫折，难免有失意之处，或高考落榜，或恋爱受挫，或久婚不育，或夫妻反目，或工作不顺……诸'
  - '[PAGE 160]


    如此类的失败本就已经让人痛苦不堪，好不容易忘记了、超越了，又有人有意无意提起，怎会不让人火大呢？即使是现在的得意之人，也怕往日的失意传播出去有失颜面。因此，他人的失意处是禁地。


    ③痛悔之事：古人常说“知错能改，善莫大焉”。但是对于自己曾经犯过的错，谁又愿意把它公之于世、让每个人都知道呢？尤其是对那些涉及品质的错误（如曾有偷窃行为或生活作风问题），就更加讳莫如深。如果听到有人说起类似的错误，就会顿生无地自容之感，有如芒刺在背般地痛苦。


    有少数人习惯把自己的快乐建立在别人的痛苦上，他们以触别人的痛处、犯别人的忌讳为乐事，这是很不道德的表现，而他们也必将自食自己所种下的苦果。


    2. “禁区”我们要避讳。它是人际交往的一种语言艺术，是对他人的尊重，有利于人际关系的发展。那么，人们该怎样避讳呢？


    ①慎言相避。说话前要了解对方的情况，绕开对方的痛处，比如，不在久婚不育者面前大谈儿女经。平时，慎言相避对人们来说并不困难，但是在得意、自我吹嘘时，就很容易忘形，而一旦忘形就很有可能会无意中犯忌。因此，将之培养成为习惯，让它成为一种本能，这样即使再忘形也不会犯了。


    ②婉词相代。有时，对于对方的忌讳是避无可避的，这时，也要学会以婉词相代，太直白会让人难堪，而婉转则可以给人留几分面'
  - '[PAGE 161]


    子，让对方感激以侍。例如，一个朋友被“炒”了，正在找工作，却一直没找到合适的，而你刚好有一份合适的工作给他介绍。你可以这样说当老板也不容易啊，总要为了人才而四处奔波，看这里又一个……”这样，对方能够不失面子地接受你的帮助，自然会对你感激不尽。相反，如果你说你不是被炒了吗？这份工作挺适合你的，去试试吧！”这样，对方很有可能会为了维持面子而拒绝，甚至与你反目。


    ③ 巧言相岔。如果话已经从口里说出来了，才惊觉自己碰到了别人的痛处，那么还能够做些什么来缓和气氛，挽救过错呢？这时，切忌慌乱之中作说明，因为说明越多，侵入别人的禁区就越深，而且有的事情本来就是越描越黑的。因此，转移话题，巧言相岔，给对方空间，才能尽快地及时从困境中解脱出来。例如，聊天的时候，你随口说他真够倒霉的，就因为长得矮，连个女朋友都找不到。”说到这个，你猛然发觉自己失言，因为听你说话的人正是一个矮子，而且也因此而苦恼。此时，你接着说不过，有资料表明，矮个通常都比高个聪明，他是一群人中事业最出色的一个。”这样就很妥帖地将话题转移到了事业上。


    避讳，不仅是语言的艺术，也是处理人际关系不可缺少的技巧。


    3. 对于面子问题，我们除了消极地避讳以外，还可以采用积极主动的方式去“做面子”给对方。比如，以下这些方法都是行之有效的：'
  - '[PAGE 162]


    +   ①替对方在同事、朋友及上司面前说好话，为他做公关，但不可太肉麻、露骨、刻意。


    ②对方有喜庆，主动以适当的方式参与庆贺。


    ③对方有难言之苦，不动声色、悄悄地主动替他解决。


    ④适当地吹捧他，协助他建立在人群中的地位。


    当把“面子”上的功夫练到炉火纯青时，我们做“社交达人”的称号也就不远了。'
  - '[PAGE 163]


    # 7. 请求他人帮忙会赢得对方的好感


    本杰明·富兰克林是众所周知的成功人士，然而，他也曾碰到过人际关系方面的麻烦，他碰到了-个喜欢和他做对的人。


    当时，年轻的富兰克林还只是费城一家小印刷厂的老板，在州议会的复选中，他幸运地被推举为宾夕法尼亚议会下院的书记员。就在正式选举前的紧要关头，一位新当选的议员却公开发表了一篇反对富兰克林作下院书记员的演说。演说篇幅很长，措辞尖锐，简直可以说是把富兰克林贬得一文不值。


    面对这种意外情况，富兰克林既生气又有点儿手足无措。要知道，对方是一位很有声望、有修养、有才识的绅士，在当地十分有影响力，而富兰克林又不愿意卑躬屈膝地去讨好他。几经思考，富兰克林找到了一种比卑躬屈膝更恰当、更有效的方法。


    富兰克林听说他收藏了几部分名贵而罕见的书，于是，他就写信恳求对方把这些珍贵的书籍借给自己拜读。那位议员接到信，马上就把书送了过来。一个星期后，富兰克林准时送还了那些书籍，并且附了一封感谢信，由衷地表达自己的谢意。


    后来，当富兰克林再碰见他的时候，他竟然主动地跟富兰克林打招呼，而且告诉富兰克林，他会尽自己所能地帮助富兰克林。就这样，富兰克林将对手变成了终生的好友。


    无独有偶，安德鲁·卡耐基也采用了类似的方法来化解人际危机。'
  - '[PAGE 164]


    卡耐基当时正在圣路易斯的地方办理一座刚刚建好的桥的税款问题。事情进行到一半的时候，他的一位至关重要的合作伙伴竟然说想家了，想离开圣路易斯，回匹兹堡去。


    卡耐基知道，如果他离开，那么税款的事情也就失败了，无论如何是不能让他离开的。在这关键时刻，卡耐基想到对方非常爱马，而且很擅长选马。脑中灵光一闪。他没有乞求对方留下来。相反，他请求对方帮他一个小忙，他说，他想给自己的妹妹买一匹马，但是自己不会挑马，希望对方能够帮他挑选一匹好马，先不要着急回家。


    面对卡耐基的请求，对方果然答应了留下来。


    富兰克林和卡耐基都利用“请对方帮个小忙”的方法，化解了人际危机，从而获得了事业的成功。


    生活中，很多人因为怕引起他人的反感而从不找他人帮忙。其实，这种想法是完全错误的。


    不知道你注意到没有？当他人拜托你帮个小忙时，你不但不会觉得麻烦，反而会觉得十分高兴。如果对 方的请求恰恰是你最拿手的，你不但会心情愉悦，而且还会因此而喜欢对方。


    不用为此感到怀疑，“请他人帮个小忙”能够获得对方的好感是有其心理学理论依据的。


    首先，请求他人帮个小忙，能够满足对方天性中的一种潜在的需'
  - '[PAGE 165]


    要。当你请求他人帮个小忙的时候，实际上是主动将自己放在了一个相对较低的位置，从而抬高了对方，这样就能够满足对方获得他人尊重的本质需求，成就了对方的荣誉感。而你请他帮忙，代表你需要他，这让他感觉到自己被需要、自己的存在很有价值，从而激起自尊心。


    总地来说, 你请求他人帮个小忙, 能够给对方带来愉悦的心理感受。因此, 对于那种自己力所能及或者擅长的事情, 对方是不会拒绝你的。


    那么， 为什么对方帮了你的忙， 就会对你产生好感呢？


    心理学上有个著名的认知失调理论，也就是说，当个体的行为与自我概念不一致时，就会产生不愉悦的心理体验。


    当你无心或有意地伤害了某个人时，就会产生这样的问题我为什 么这么对他呢？”如果答案是“我很粗心、很糟糕”，那么，你正面的自我概念就与伤害他人的负面行为对立起来，进而产生认知失调；为了避免认知失调的不良感受，你就会为自己的负面行为找一个合理的解释，使之与你的自我概念一致，比如，你会想：“他让人讨厌！他活该！”


    同样，如果你帮助了某个人，而这个人是你所讨厌的，那么，自我概念和自我行为就产生了冲突，而避免认知失调的合理解释就只能是：“我喜欢他，他很可爱！”'
  - '[PAGE 166]


    由此可见，请求对方帮个小忙，能够让你赢得对方的好感。因此，你大可不必拘谨地拒绝他人的帮助，更没有必要因为害怕引起对方的反感而不敢开口请求对方。'
  - '[PAGE 167]


    # ### 8.努力记住有关对方的小事


    马可·汉纳是当时世界闻名的美国政坛的风云人物了。1896年，麦金利正是在汉纳的帮助下才顺利当选为总统的，并且美国采用金本位制也正是由于他的坚持。无疑，马可·汉纳在政治上有着非凡的影响力。尽管如此，年轻而骄傲的纽约商人、政治家威廉·比尔却并不怎么喜欢汉纳。在他看来，汉纳不过是个克里尤兰的“红发妖魔”、是个“笨蛋”而已，总之，比尔对汉纳没有好感。


    然而，由于汉纳是共和党的领袖，为了自己在政治路上能够走得更远，比尔不得不登门拜访汉纳。即便如此，心中对汉纳仍然有说不出的反感。


    出乎意料的是，比尔发现在整个交谈过程中，汉纳从头到尾都在讲关于比尔的事情：关于比尔的父亲，关于比尔对政纲的意见等。


    汉纳说：“你来自俄亥俄州吧？你的父亲是不是比尔法官？他是民主党的……”当时，比尔简直就觉得不可思议，汉纳竟然重视一个反对自己的人，将对方的一切了解得那么清楚。就在比尔目瞪口呆的时候，汉纳又像是在和一位世侄交谈一样说：“嗯，你父亲可是个非常厉害的角色，害得我几个朋友在一次石油生意上损失了许多钱呢！”


    在整个谈话过程中，汉纳不时地讲到许多关于比尔的小事，例如他那位在阿雷兰的伯父。就这样，当谈话结束的时候，比尔对于'
  - '[PAGE 168]


    汉纳的反感已经烟消云散了。几天后，威廉·比尔甚至成了汉纳忠诚的支持者。在此后的几年中，威廉·比尔最愿意做的事情就是为自己曾经最厌恶的汉纳服务。


    由此可见，在与人交往的过程中, 努力记住对方的小事，并且在适当的时候让对方了解你记住了关于他的事情，这能够帮助你赢得对方的好感。


    佩恩来享钢铁公司的创建人查尔斯·什瓦普，也认为对他人怀有浓厚的兴趣是获得良好人际关系的一个窍门：


    第一次世界大战期间，查尔斯·什瓦普被紧急任命为紧急装备军舰公司的领导。为了提高军舰的制造数量，他记住了当时火克岛造船所所长的海军司令喜欢泽西牛的癖好，然后他对这位海军司令说：“如果你能把军舰的制造数量从
    30 艘提高到 50 艘，你将得到一头‘全美最棒的泽西牛，。’海军司令听后, 视查尔斯为知己，表示愿意尽自己所能为查尔斯效力。


    由此可见，努力记住有关对方的事情，然后让对方知道，能够让对方获得一种被人重视、被人关注的心理满足感, 进而对你产生好感。并且，你所记住的事情越是微小、不起眼，当对方得知你记住了它们时,
    对方获得的心理满足感就越大，对你产生的好感也就越大。


    通过记住有关对方的小事来获得对方的好感, 是一个非常有效的社交心理策略，无论对方是大人物还是普通人，这个方法都同样'
  - '[PAGE 169]


    有效。


    以访问大人物而闻名的新闻记者马可森说当你将大人 物们曾经说过的话复述出来的时候，他们的心情就会显得格外的好，对你也会表现得格外友善。"


    那些善于交际的人都十分明白这种策略所带来的好处，他们总会在适当的时刻顺便问一两句对方的个人事情，以表示他们将对 方正在做的事、对方的喜好记挂在心上，让对方感觉这些小事他们早该忘记但是却没想到他们还挂在心上，从而让对方的心理产生非常愉悦的感受，进而对他们产生好感。


    这个方法实施起来很容易，然而或许正是因为它的容易，人们才常常忽略它，总是记得与自己有关的事，而忘记他人的事。因此，从现在开始，努力记住那些和对方有关的事情吧，一旦那些在对方看来微不足道的小事从你口中说出时，你就在无形中靠近了对方。'
  - '[PAGE 170]


    # 9.从否定到肯定的交往模式让你赢得人心


    著名心理学家阿伦森曾经做过一个这样的实验。


    参与实验的被试者会面对 4 个不同的评价人，这 4 个人会以 4 种不同方式来 评价他们。第一个人，一直给予被试者肯定的评价；第二个人，始终给予被试者否定的评价；第三个人，一开始肯定被试者，然后否定被试者，其否定程度与第二个人相同；第四种，一开始否定被试者，然后肯定他们，而且肯定程度和第一个人相同。


    最后，阿伦森统计了被试者对这 4 个评价者的喜欢程度。结果，被试者最喜欢的是一开始否定自己而后来肯定自己的人，其喜欢程度甚至远高于一 直肯定他们的人。而被试者们最讨厌的也并非是一直否定自己的人，而是一开始肯定自己、然后又否定自己的人。


    由此可见，人们最喜欢那些对自己喜欢、奖励、赞赏不断增加的人，最不喜欢那些对自己喜欢、奖励、赞赏不断减少的人。心理学家将这种现象称为“增减原则”。


    心理学家指出，在与人交往的过程中，自我价值始终是第一位的，每个人都会本能地保护自我价值。这种保护有两种具体的表现形式：从静态的角度看，它体现为人际交往中的交互性原则，即喜欢那些对自己有好感的人，而讨厌那些否定自己的人；从动态的角度看，它体现在人际吸引水平的增减原则上，即人们喜欢那些对自己的好感度不断增加的人，而讨厌那些对自己的好感度不断降低的人。'
  - '[PAGE 171]


    当他人对自己的态度由肯定转向否定的时候，自我价值受到了威胁，这个时 候出于对自我价值保护的本能需求，人必然会极力维护自己的自我价值。那么怎样才能保证自我价值不减少呢？当然是通过否定对方、拒绝对方来否定对方
    所给予的“肯定一否定”评价的正确性。


    也就是说，要想赢得对方的喜爱，除了抱着“我喜欢你”的态度之外,还应该让你喜欢对方的程度呈递增趋势。


    生活中，有的人最初与人交往的时候，为了赢得对方的好感，就有意识地频频赞美对方；许多事情，即使自己有困难仍然勉为其难地帮助对方……通过种种方式向对方传递着“我喜欢你”的信息。可是，时间长了这种“勉为其难”就坚持不下去了，再加上已经获得了对方一定的好感，于是，赞美对方的次数在减少，对于对方的委托更是能推就推……所有的言行无一律让对方感觉到“他对我越来越不好了，他对我的好感度在降低”，从而激发了对方的自我价值保护机制，使彼此的关系陷入困境之中。


    在现实生活中，犯这种“从肯定到否定”错误的人并不在少数。那么，应该怎样才能避免“增减原则”所带来的负面效应，而让它积极地推动人际关系的发展呢？


    首先，你必须清楚地认识到，人的确都有喜欢正面评价、厌恶负面评价的弱点，但是人也同样具有理性分析的能力，因此，你所做出的正面评价必须是大成的。'
  - '[PAGE 172]


    其次，你所给予对方的肯定应该把握在一定范围之内，避免过犹不及。一味地赞美对方，固然能够赢得对方的一时好感，却也会为日后进一步交往带来不利影响。


    最后，一定要有意识地避免“先扬后抑”。“先扬后抑”的动态递减模式会使对方的自尊受到威胁。谁让他人的自尊受威胁，谁就会成为最不受欢迎的人。


    把握好“增减原则”，走过人际交往的误区，有意识地制造一种动态的、螺旋式上升的“心理曲线”，会在很大程度上增加你的受欢迎程度。具体地说，你可以从以下几点来努力：


    +   1. 把基点拉低。不要一开始就给予对方过多的肯定，应该将肯定态度的基点定得低一些，给后面的递增留有空间和余地。


    +   2. “先抑后扬”。你可以采用先抑后扬的方式，但是要从无伤尊的小毛病说起，然后再给予对方恰如其分的表扬。


    +   3. 适当地保留。人与人的交往是一个循序渐进的过程。适当地有所保留，留下一点悬念和空间，更有利于彼此交往的加深。


    在人际交往中，要学会先否定，然后肯定，有意识地以逐渐递增的方式向对方传递你对他的好感。只有这样，你才能更有效、更长久地赢得他人的好感。'
  md: "\n她的脸一下就红了。这一刻虽然她自己觉得有些尴尬、难为情，但是，大家却觉得和她一下子拉近了距离，接下来也开始积极地和她互动起来。\n\n试问，如果没有这个无伤大雅的“出丑”，赵老师始终都表现得那么完美的话，学员们有可能在真正意义上接受她吗？\n\
    \n由此可见，努力让自己变得更加优秀，固然可以赢得他人的认可，但是过度追求完美，则未必能够在社交中取胜。\n\n### 5.不做透明人，但要适当地自我暴露\n\
    \n心理学研究发现，人际关系的好坏与自我暴露的程度有直接关系。所谓自我暴露，指的是在对方面前展露自己私人性的一面。\n\n人际关系越好，双方对彼此的信任程度和接纳程度越高，自我暴露也越多。可以说，自我暴露的广度和深度是人际关系深度的“探测器”。别人对你自我暴露得越多，说明他接纳你的程度越深。一般而言，自我暴露的程度可以由浅到深分为4个等级：\n\
    \n- ①饮食习惯、偏好等兴趣爱好方面的个人信息；\n- ②个人态度方面的信息，比如对他人看法、对时事的评价等；\n- ③自我概念以及个人的人际关系状况方面的信息，比如自己的真实情绪、与亲友的关系等；\n\
    - ④个人隐私，比如性经验、离经叛道的想法、或不愿为人所知的往事等。\n\n当然，每个人在他人面前的自我暴露程度都是有限的，即使非常亲密的关系，也不太可能完全暴露自己。但是，在适当范围内的自我暴露的确能够拉近双方的心理距离，增加双方的喜欢度。\n\
    \n一位知名影星因其在新片中的表现欠佳而受到了评论界的指责，他的心情因此而十分忧郁，而不得不去求助于心理专家。\n\n“我很担心以后都没有办法再抬起头来，这种可怕的日子，我要怎麼熬啊？”\n\
    \n针对他的情况，心理专家建议他把自己内心的真实想法主动暴露在公众面前，他照办了。他举行了3次记者招待会，在记者招待会上，他暴露了心中的忐忑，说自己为发挥失误感到很惶恐。这样，他不仅卸掉了自己思想上的包袱，而且赢得了公众的同情和赞许，再一次成了大家都喜欢的人。\n\
    \n社会心理学家指出，良好的人际关系是在人们逐渐自我暴露的过程中一步步建立起来的。你对一个人越是认可、接受、信任，你在他面前暴露自己就越多；同时你也希望对方越来越多地暴露他自己。简单地说，自我暴露的层次与彼此间的信任度、交往程度之间存在着相互促进的关系。值得注意的是，能够促进人际关系的自我暴露都是恰如其分的；任何不合时宜、不恰当的自我暴露只会给人际关系带来负面影响。\n\
    \n那么，在人际交往中，该怎样把自我信息恰如其分地传递给他人呢？一般来说，有这样一些心理技巧是需要掌握的：\n\n- 1. 真实。你向对方传递的个人信息必须是真实的，如果有所欺瞒，势必会引起对方的反感。\n\
    - 2. 注意自我暴露的相互性。也就是说，能够促进人际关系的“自我暴露”必然是双方程度水平相同的“自我暴露”。如果你相对暴露得过多，则会给对方以压力和威胁，从而使对方对你避而远之；如果你相对暴露得过少，又会显得缺少交往的诚意。\n\
    - 3. 遵循循序渐进的原则。自我暴露要遵循循序渐进的原则，不能太过突兀。一次性地在对方面前暴露过多的自我，会给对方留下“不稳重”的印象，让对方对你产生不信任感，进而疏远你；用温和的方式循序渐进则可以避免这些消极影响。\n\
    - 4. 不可强求。自我暴露是建立在“自愿”、“情之所至”的基础之上的。每个人都会有不愿意让任何人知道的信息，如果你因为与对方关系亲密就要求对方完全敞开心扉，任意侵犯对方所不愿意暴露的领域，就会激发对方强烈的排斥情绪，从而导致对方降低对你的接纳程度。\n\
    - 5. 要分场合、看对象。自我暴露具有很强的针对性。比如，在恋人面前暴露自己的恋爱史、在职场上暴露自己的私生活等，都是不恰当的。要学会针对不同的人、不同的场合暴露该暴露的，保留该保留的。\n\
    \n无论如何，人际交往中，真正的亲密关系是经过时间的洗礼的，它在时间中慢慢累积、加固。\n\n### 6. 人人都有自尊心，不要践踏他人的面子\n\n心理学家指出，一旦“自我”受到威胁，个体就会忸怩不安；一旦“自我”受到伤害，个体就会感到痛苦，就会奋起反击。而“自尊”正是“自我”所包含的一个重要内容。通常来说，人们都喜欢赞扬自己的人，而讨厌批评自己、让自己没面子的人。在人际交往中，要想获得他人的好感，就要顾全他人的自尊，保全他人的面子。一方面，要提醒自己不要去践踏别人的尊严，另一方面，要学会维护他人的自尊。\n\
    \n- 1. 一般来说，他人的弱点、缺点、污点等忌讳之物，都是“雷区”一碰不得，至少有以下几点是我们应该避开的。\n    - ①丑陋之处：爱美之心人皆有之，每个人都希望自己是美丽的、俊逸的。然而，生活没有慷慨地让所有的人如愿，这个世界上还有不少的丑陋者和残疾者，他们大多有自卑感，不愿听与自己的短处有关的话题。比如，秃顶者忌说“亮”，胖子忌说“肥”，矮子忌说“武大郎”，其貌不扬者忌说“丑八怪”，跛子忌说“举足轻重”，驼背忌说“忍辱负重”等。对他们的这种完全正常的心理，我们应该充分理解。\n\
    \    - ②失意之处：人生在世，有起有落。即使今天看起来多么意气风发、踌躇满志的人，都可能经历人生的挫折，难免有失意之处，或高考落榜，或恋爱受挫，或久婚不育，或夫妻反目，或工作不顺……诸如此类的失败本就已经让人痛苦不堪，好不容易忘记了、超越了，又有人有意无意提起，怎会不让人火大呢？即使是现在的得意之人，也怕往日的失意传播出去有失颜面。因此，他人的失意处是禁地。\n\
    \    - ③痛悔之事：古人常说“知错能改，善莫大焉”。但是对于自己曾经犯过的错，谁又愿意把它公之于世、让每个人都知道呢？尤其是对那些涉及品质的错误（如曾有偷窃行为或生活作风问题），就更加讳莫如深。如果听到有人说起类似的错误，就会顿生无地自容之感，有如芒刺在背般地痛苦。\n\
    \n有少数人习惯把自己的快乐建立在别人的痛苦上，他们以触别人的痛处、犯别人的忌讳为乐事，这是很不道德的表现，而他们也必将自食自己所种下的苦果。\n\n- 2.\
    \ “禁区”我们要避讳。它是人际交往的一种语言艺术，是对他人的尊重，有利于人际关系的发展。那么，人们该怎样避讳呢？\n    - ①慎言相避。说话前要了解对方的情况，绕开对方的痛处，比如，不在久婚不育者面前大谈儿女经。平时，慎言相避对人们来说并不困难，但是在得意、自我吹嘘时，就很容易忘形，而一旦忘形就很有可能会无意中犯忌。因此，将之培养成为习惯，让它成为一种本能，这样即使再忘形也不会犯了。\n\
    \    - ②婉词相代。有时，对于对方的忌讳是避无可避的，这时，也要学会以婉词相代，太直白会让人难堪，而婉转则可以给人留几分面子，让对方感激以侍。例如，一个朋友被“炒”了，正在找工作，却一直没找到合适的，而你刚好有一份合适的工作给他介绍。你可以这样说“当老板也不容易啊，总要为了人才而四处奔波，看这里又一个……”这样，对方能够不失面子地接受你的帮助，自然会对你感激不尽。相反，如果你说“你不是被炒了吗？这份工作挺适合你的，去试试吧！”这样，对方很有可能会为了维持面子而拒绝，甚至与你反目。\n\
    \    - ③巧言相岔。如果话已经从口里说出来了，才惊觉自己碰到了别人的痛处，那么还能够做些什么来缓和气氛，挽救过错呢？这时，切忌慌乱之中作说明，因为说明越多，侵入别人的禁区就越深，而且有的事情本来就是越描越黑的。因此，转移话题，巧言相岔，给对方空间，才能尽快地及时从困境中解脱出来。例如，聊天的时候，你随口说“他真够倒霉的，就因为长得矮，连个女朋友都找不到。”说到这个，你猛然发觉自己失言，因为听你说话的人正是一个矮子，而且也因此而苦恼。此时，你接着说“不过，有资料表明，矮个通常都比高个聪明，他是一群人中事业最出色的一个。”这样就很妥帖地将话题转移到了事业上。\n\
    \n避讳，不仅是语言的艺术，也是处理人际关系不可缺少的技巧。\n\n- 3. 对于面子问题，我们除了消极地避讳以外，还可以采用积极主动的方式去“做面子”给对方。比如，以下这些方法都是行之有效的：\n\
    \    - ①替对方在同事、朋友及上司面前说好话，为他做公关，但不可太肉麻、露骨、刻意。\n    - ②对方有喜庆，主动以适当的方式参与庆贺。\n  \
    \  - ③对方有难言之苦，不动声色、悄悄地主动替他解决。\n    - ④适当地吹捧他，协助他建立在人群中的地位。\n\n当把“面子”上的功夫练到炉火纯青时，我们做“社交达人”的称号也就不远了。\n\
    \n### 7. 请求他人帮忙会赢得对方的好感\n\n本杰明·富兰克林是众所周知的成功人士，然而，他也曾碰到过人际关系方面的麻烦，他碰到了一个喜欢和他做对的人。\n\
    \n当时，年轻的富兰克林还只是费城一家小印刷厂的老板，在州议会的复选中，他幸运地被推举为宾夕法尼亚议会下院的书记员。就在正式选举前的紧要关头，一位新当选的议员却公开发表了一篇反对富兰克林作下院书记员的演说。演说篇幅很长，措辞尖锐，简直可以说是把富兰克林贬得一文不值。\n\
    \n面对这种意外情况，富兰克林既生气又有点儿手足无措。要知道，对方是一位很有声望、有修养、有才识的绅士，在当地十分有影响力，而富兰克林又不愿意卑躬屈膝地去讨好他。几经思考，富兰克林找到了一种比卑躬屈膝更恰当、更有效的方法。\n\
    \n富兰克林听说他收藏了几部分名贵而罕见的书，于是，他就写信恳求对方把这些珍贵的书籍借给自己拜读。那位议员接到信，马上就把书送了过来。一个星期后，富兰克林准时送还了那些书籍，并且附了一封感谢信，由衷地表达自己的谢意。\n\
    \n后来，当富兰克林再碰见他的时候，他竟然主动地跟富兰克林打招呼，而且告诉富兰克林，他会尽自己所能地帮助富兰克林。就这样，富兰克林将对手变成了终生的好友。\n\
    \n无独有偶，安德鲁·卡耐基也采用了类似的方法来化解人际危机。\n\n卡耐基当时正在圣路易斯的地方办理一座刚刚建好的桥的税款问题。事情进行到一半的时候，他的一位至关重要的合作伙伴竟然说想家了，想离开圣路易斯，回匹兹堡去。\n\
    \n卡耐基知道，如果他离开，那么税款的事情也就失败了，无论如何是不能让他离开的。在这关键时刻，卡耐基想到对方非常爱马，而且很擅长选马。脑中灵光一闪。他没有乞求对方留下来。相反，他请求对方帮他一个小忙，他说，他想给自己的妹妹买一匹马，但是自己不会挑马，希望对方能够帮他挑选一匹好马，先不要着急回家。\n\
    \n面对卡耐基的请求，对方果然答应了留下来。\n\n富兰克林和卡耐基都利用“请对方帮个小忙”的方法，化解了人际危机，从而获得了事业的成功。\n\n生活中，很多人因为怕引起他人的反感而从不找他人帮忙。其实，这种想法是完全错误的。\n\
    \n不知道你注意到没有？当他人拜托你帮个小忙时，你不但不会觉得麻烦，反而会觉得十分高兴。如果对方的请求恰恰是你最拿手的，你不但会心情愉悦，而且还会因此而喜欢对方。\n\
    \n不用为此感到怀疑，“请他人帮个小忙”能够获得对方的好感是有其心理学理论依据的。\n\n首先，请求他人帮个小忙，能够满足对方天性中的一种潜在的需要。当你请求他人帮个小忙的时候，实际上是主动将自己放在了一个相对较低的位置，从而抬高了对方，这样就能够满足对方获得他人尊重的本质需求，成就了对方的荣誉感。而你请他帮忙，代表你需要他，这让他感觉到自己被需要、自己的存在很有价值，从而激起自尊心。\n\
    \n总地来说，你请求他人帮个小忙，能够给对方带来愉悦的心理感受。因此，对于那种自己力所能及或者擅长的事情，对方是不会拒绝你的。\n\n那么，为什么对方帮了你的忙，就会对你产生好感呢？\n\
    \n心理学上有个著名的认知失调理论，也就是说，当个体的行为与自我概念不一致时，就会产生不愉悦的心理体验。\n\n当你无心或有意地伤害了某个人时，就会产生这样的问题“我为什么这么对他呢？”如果答案是“我很粗心、很糟糕”，那么，你正面的自我概念就与伤害他人的负面行为对立起来，进而产生认知失调；为了避免认知失调的不良感受，你就会为自己的负面行为找一个合理的解释，使之与你的自我概念一致，比如，你会想：“他让人讨厌！他活该！”\n\
    \n同样，如果你帮助了某个人，而这个人是你所讨厌的，那么，自我概念和自我行为就产生了冲突，而避免认知失调的合理解释就只能是：“我喜欢他，他很可爱！”\n\n\
    由此可见，请求对方帮个小忙，能够让你赢得对方的好感。因此，你大可不必拘谨地拒绝他人的帮助，更没有必要因为害怕引起对方的反感而不敢开口请求对方。\n\n###\
    \ 8.努力记住有关对方的小事\n\n马可·汉纳是当时世界闻名的美国政坛的风云人物。1896年，麦金利正是在汉纳的帮助下才顺利当选为总统的，并且美国采用金本位制也正是由于他的坚持。无疑，马可·汉纳在政治上有着非凡的影响力。尽管如此，年轻而骄傲的纽约商人、政治家威廉·比尔却并不怎么喜欢汉纳。在他看来，汉纳不过是个克利夫兰的“红发妖魔”、是个“笨蛋”而已，总之，比尔对汉纳没有好感。\n\
    \n然而，由于汉纳是共和党的领袖，为了自己在政治路上能够走得更远，比尔不得不登门拜访汉纳。即便如此，心中对汉纳仍然有说不出的反感。\n\n出乎意料的是，比尔发现在整个交谈过程中，汉纳从头到尾都在讲关于比尔的事情：关于比尔的父亲，关于比尔对政纲的意见等。\n\
    \n汉纳说：“你来自俄亥俄州吧？你的父亲是不是比尔法官？他是民主党的……”当时，比尔简直就觉得不可思议，汉纳竟然重视一个反对自己的人，将对方的一切了解得那么清楚。就在比尔目瞪口呆的时候，汉纳又像是在和一位世侄交谈一样说：“嗯，你父亲可是个非常厉害的角色，害得我几个朋友在一次石油生意上损失了许多钱呢！”\n\
    \n在整个谈话过程中，汉纳不时地讲到许多关于比尔的小事，例如他那位在阿雷兰的伯父。就这样，当谈话结束的时候，比尔对于汉纳的反感已经烟消云散了。几天后，威廉·比尔甚至成了汉纳忠诚的支持者。在此后的几年中，威廉·比尔最愿意做的事情就是为自己曾经最厌恶的汉纳服务。\n\
    \n由此可见，在与人交往的过程中，努力记住对方的小事，并且在适当的时候让对方了解你记住了关于他的事情，这能够帮助你赢得对方的好感。\n\n佩恩来享钢铁公司的创建人查尔斯·什瓦普，也认为对他人怀有浓厚的兴趣是获得良好人际关系的一个窍门：\n\
    \n第一次世界大战期间，查尔斯·什瓦普被紧急任命为紧急装备军舰公司的领导。为了提高军舰的制造数量，他记住了当时胡克岛造船所所长的海军司令喜欢泽西牛的癖好，然后他对这位海军司令说：“如果你能把军舰的制造数量从30艘提高到50艘，你将得到一头‘全美最棒的泽西牛。’”海军司令听后，视查尔斯为知己，表示愿意尽自己所能为查尔斯效力。\n\
    \n由此可见，努力记住有关对方的事情，然后让对方知道，能够让对方获得一种被人重视、被人关注的心理满足感，进而对你产生好感。并且，你所记住的事情越是微小、不起眼，当对方得知你记住了它们时，对方获得的心理满足感就越大，对你产生的好感也就越大。\n\
    \n通过记住有关对方的小事来获得对方的好感，是一个非常有效的社交心理策略，无论对方是大人物还是普通人，这个方法都同样有效。\n\n以访问大人物而闻名的新闻记者马可森说“当你将大人物们曾经说过的话复述出来的时候，他们的心情就会显得格外的好，对你也会表现得格外友善。”\n\
    \n那些善于交际的人都十分明白这种策略所带来的好处，他们总会在适当的时刻顺便问一两句对方的个人事情，以表示他们对对方正在做的事、对方的喜好记挂在心上，让对方感觉这些小事他们早该忘记但是却没想到他们还挂在心上，从而让对方的心理产生非常愉悦的感受，进而对他们产生好感。\n\
    \n这个方法实施起来很容易，然而或许正是因为它的容易，人们才常常忽略它，总是记得与自己有关的事，而忘记他人的事。因此，从现在开始，努力记住那些和对方有关的事情吧，一旦那些在对方看来微不足道的小事从你口中说出时，你就在无形中靠近了对方。\n\
    \n### 9.从否定到肯定的交往模式让你赢得人心\n\n著名心理学家阿伦森曾经做过一个这样的实验。\n\n参与实验的被试者会面对4个不同的评价人，这4个人会以4种不同方式来评价他们。第一个人，一直给予被试者肯定的评价；第二个人，始终给予被试者否定的评价；第三个人，一开始肯定被试者，然后否定被试者，其否定程度与第二个人相同；第四种，一开始否定被试者，然后肯定他们，而且肯定程度和第一个人相同。\n\
    \n最后，阿伦森统计了被试者对这4个评价者的喜欢程度。结果，被试者最喜欢的是一开始否定自己而后来肯定自己的人，其喜欢程度甚至远高于一 直肯定他们的人。而被试者们最讨厌的也并非是一直否定自己的人，而是一开始肯定自己、然后又否定自己的人。\n\
    \n由此可见，人们最喜欢那些对自己喜欢、奖励、赞赏不断增加的人，最不喜欢那些对自己喜欢、奖励、赞赏不断减少的人。心理学家将这种现象称为“增减原则”。\n\n\
    心理学家指出，在与人交往的过程中，自我价值始终是第一位的，每个人都会本能地保护自我价值。这种保护有两种具体的表现形式：从静态的角度看，它体现为人际交往中的交互性原则，即喜欢那些对自己有好感的人，而讨厌那些否定自己的人；从动态的角度看，它体现在人际吸引水平的增减原则上，即人们喜欢那些对自己的好感度不断增加的人，而讨厌那些对自己的好感度不断降低的人。\n\
    \n当他人对自己的态度由肯定转向否定的时候，自我价值受到了威胁，这个时候出于对自我价值保护的本能需求，人必然会极力维护自己的自我价值。那么怎样才能保证自我价值不减少呢？当然是通过否定对方、拒绝对方来否定对方所给予的“肯定一否定”评价的正确性。\n\
    \n也就是说，要想赢得对方的喜爱，除了抱着“我喜欢你”的态度之外，还应该让你喜欢对方的程度呈递增趋势。\n\n生活中，有的人最初与人交往的时候，为了赢得对方的好感，就有意识地频频赞美对方；许多事情，即使自己有困难仍然勉为其难地帮助对方……通过种种方式向对方传递着“我喜欢你”的信息。可是，时间长了这种“勉为其难”就坚持不下去了，再加上已经获得了对方一定的好感，于是，赞美对方的次数在减少，对于对方的委托更是能推就推……所有的言行无一律让对方感觉到“他对我越来越不好了，他对我的好感度在降低”，从而激发了对方的自我价值保护机制，使彼此的关系陷入困境之中。\n\
    \n在现实生活中，犯这种“从肯定到否定”错误的人并不在少数。那么，应该怎样才能避免“增减原则”所带来的负面效应，而让它积极地推动人际关系的发展呢？\n\n\
    首先，你必须清楚地认识到，人的确都有喜欢正面评价、厌恶负面评价的弱点，但是人也同样具有理性分析的能力，因此，你所做出的正面评价必须是真诚的。\n\n其次，你所给予对方的肯定应该把握在一定范围之内，避免过犹不及。一味地赞美对方，固然能够赢得对方的一时好感，却也会为日后进一步交往带来不利影响。\n\
    \n最后，一定要有意识地避免“先扬后抑”。“先扬后抑”的动态递减模式会使对方的自尊受到威胁。谁让他人的自尊受威胁，谁就会成为最不受欢迎的人。\n\n把握好“增减原则”，走过人际交往的误区，有意识地制造一种动态的、螺旋式上升的“心理曲线”，会在很大程度上增加你的受欢迎程度。具体地说，你可以从以下几点来努力：\n\
    \n- 1. 把基点拉低。不要一开始就给予对方过多的肯定，应该将肯定态度的基点定得低一些，给后面的递增留有空间和余地。\n- 2. “先抑后扬”。你可以采用先抑后扬的方式，但是要从无伤尊的小毛病说起，然后再给予对方恰如其分的表扬。\n\
    - 3. 适当地保留。人与人的交往是一个循序渐进的过程。适当地有所保留，留下一点悬念和空间，更有利于彼此交往的加深。\n\n在人际交往中，要学会先否定，然后肯定，有意识地以逐渐递增的方式向对方传递你对他的好感。只有这样，你才能更有效、更长久地赢得他人的好感。\n"
  mdcn: "\n她的脸一下就红了。这一刻虽然她自己觉得有些尴尬、难为情，但是，大家却觉得和她一下子拉近了距离，接下来也开始积极地和她互动起来。\n\n试问，如果没有这个无伤大雅的“出丑”，赵老师始终都表现得那么完美的话，学员们有可能在真正意义上接受她吗？\n\
    \n由此可见，努力让自己变得更加优秀，固然可以赢得他人的认可，但是过度追求完美，则未必能够在社交中取胜。\n\n### 5.不做透明人，但要适当地自我暴露\n\
    \n心理学研究发现，人际关系的好坏与自我暴露的程度有直接关系。所谓自我暴露，指的是在对方面前展露自己私人性的一面。\n\n人际关系越好，双方对彼此的信任程度和接纳程度越高，自我暴露也越多。可以说，自我暴露的广度和深度是人际关系深度的“探测器”。别人对你自我暴露得越多，说明他接纳你的程度越深。一般而言，自我暴露的程度可以由浅到深分为4个等级：\n\
    \n- ①饮食习惯、偏好等兴趣爱好方面的个人信息；\n- ②个人态度方面的信息，比如对他人看法、对时事的评价等；\n- ③自我概念以及个人的人际关系状况方面的信息，比如自己的真实情绪、与亲友的关系等；\n\
    - ④个人隐私，比如性经验、离经叛道的想法、或不愿为人所知的往事等。\n\n当然，每个人在他人面前的自我暴露程度都是有限的，即使非常亲密的关系，也不太可能完全暴露自己。但是，在适当范围内的自我暴露的确能够拉近双方的心理距离，增加双方的喜欢度。\n\
    \n一位知名影星因其在新片中的表现欠佳而受到了评论界的指责，他的心情因此而十分忧郁，而不得不去求助于心理专家。\n\n“我很担心以后都没有办法再抬起头来，这种可怕的日子，我要怎麼熬啊？”\n\
    \n针对他的情况，心理专家建议他把自己内心的真实想法主动暴露在公众面前，他照办了。他举行了3次记者招待会，在记者招待会上，他暴露了心中的忐忑，说自己为发挥失误感到很惶恐。这样，他不仅卸掉了自己思想上的包袱，而且赢得了公众的同情和赞许，再一次成了大家都喜欢的人。\n\
    \n社会心理学家指出，良好的人际关系是在人们逐渐自我暴露的过程中一步步建立起来的。你对一个人越是认可、接受、信任，你在他面前暴露自己就越多；同时你也希望对方越来越多地暴露他自己。简单地说，自我暴露的层次与彼此间的信任度、交往程度之间存在着相互促进的关系。值得注意的是，能够促进人际关系的自我暴露都是恰如其分的；任何不合时宜、不恰当的自我暴露只会给人际关系带来负面影响。\n\
    \n那么，在人际交往中，该怎样把自我信息恰如其分地传递给他人呢？一般来说，有这样一些心理技巧是需要掌握的：\n\n- 1. 真实。你向对方传递的个人信息必须是真实的，如果有所欺瞒，势必会引起对方的反感。\n\
    - 2. 注意自我暴露的相互性。也就是说，能够促进人际关系的“自我暴露”必然是双方程度水平相同的“自我暴露”。如果你相对暴露得过多，则会给对方以压力和威胁，从而使对方对你避而远之；如果你相对暴露得过少，又会显得缺少交往的诚意。\n\
    - 3. 遵循循序渐进的原则。自我暴露要遵循循序渐进的原则，不能太过突兀。一次性地在对方面前暴露过多的自我，会给对方留下“不稳重”的印象，让对方对你产生不信任感，进而疏远你；用温和的方式循序渐进则可以避免这些消极影响。\n\
    - 4. 不可强求。自我暴露是建立在“自愿”、“情之所至”的基础之上的。每个人都会有不愿意让任何人知道的信息，如果你因为与对方关系亲密就要求对方完全敞开心扉，任意侵犯对方所不愿意暴露的领域，就会激发对方强烈的排斥情绪，从而导致对方降低对你的接纳程度。\n\
    - 5. 要分场合、看对象。自我暴露具有很强的针对性。比如，在恋人面前暴露自己的恋爱史、在职场上暴露自己的私生活等，都是不恰当的。要学会针对不同的人、不同的场合暴露该暴露的，保留该保留的。\n\
    \n无论如何，人际交往中，真正的亲密关系是经过时间的洗礼的，它在时间中慢慢累积、加固。\n\n### 6. 人人都有自尊心，不要践踏他人的面子\n\n心理学家指出，一旦“自我”受到威胁，个体就会忸怩不安；一旦“自我”受到伤害，个体就会感到痛苦，就会奋起反击。而“自尊”正是“自我”所包含的一个重要内容。通常来说，人们都喜欢赞扬自己的人，而讨厌批评自己、让自己没面子的人。在人际交往中，要想获得他人的好感，就要顾全他人的自尊，保全他人的面子。一方面，要提醒自己不要去践踏别人的尊严，另一方面，要学会维护他人的自尊。\n\
    \n- 1. 一般来说，他人的弱点、缺点、污点等忌讳之物，都是“雷区”一碰不得，至少有以下几点是我们应该避开的。\n    - ①丑陋之处：爱美之心人皆有之，每个人都希望自己是美丽的、俊逸的。然而，生活没有慷慨地让所有的人如愿，这个世界上还有不少的丑陋者和残疾者，他们大多有自卑感，不愿听与自己的短处有关的话题。比如，秃顶者忌说“亮”，胖子忌说“肥”，矮子忌说“武大郎”，其貌不扬者忌说“丑八怪”，跛子忌说“举足轻重”，驼背忌说“忍辱负重”等。对他们的这种完全正常的心理，我们应该充分理解。\n\
    \    - ②失意之处：人生在世，有起有落。即使今天看起来多么意气风发、踌躇满志的人，都可能经历人生的挫折，难免有失意之处，或高考落榜，或恋爱受挫，或久婚不育，或夫妻反目，或工作不顺……诸如此类的失败本就已经让人痛苦不堪，好不容易忘记了、超越了，又有人有意无意提起，怎会不让人火大呢？即使是现在的得意之人，也怕往日的失意传播出去有失颜面。因此，他人的失意处是禁地。\n\
    \    - ③痛悔之事：古人常说“知错能改，善莫大焉”。但是对于自己曾经犯过的错，谁又愿意把它公之于世、让每个人都知道呢？尤其是对那些涉及品质的错误（如曾有偷窃行为或生活作风问题），就更加讳莫如深。如果听到有人说起类似的错误，就会顿生无地自容之感，有如芒刺在背般地痛苦。\n\
    \n有少数人习惯把自己的快乐建立在别人的痛苦上，他们以触别人的痛处、犯别人的忌讳为乐事，这是很不道德的表现，而他们也必将自食自己所种下的苦果。\n\n- 2.\
    \ “禁区”我们要避讳。它是人际交往的一种语言艺术，是对他人的尊重，有利于人际关系的发展。那么，人们该怎样避讳呢？\n    - ①慎言相避。说话前要了解对方的情况，绕开对方的痛处，比如，不在久婚不育者面前大谈儿女经。平时，慎言相避对人们来说并不困难，但是在得意、自我吹嘘时，就很容易忘形，而一旦忘形就很有可能会无意中犯忌。因此，将之培养成为习惯，让它成为一种本能，这样即使再忘形也不会犯了。\n\
    \    - ②婉词相代。有时，对于对方的忌讳是避无可避的，这时，也要学会以婉词相代，太直白会让人难堪，而婉转则可以给人留几分面子，让对方感激以侍。例如，一个朋友被“炒”了，正在找工作，却一直没找到合适的，而你刚好有一份合适的工作给他介绍。你可以这样说“当老板也不容易啊，总要为了人才而四处奔波，看这里又一个……”这样，对方能够不失面子地接受你的帮助，自然会对你感激不尽。相反，如果你说“你不是被炒了吗？这份工作挺适合你的，去试试吧！”这样，对方很有可能会为了维持面子而拒绝，甚至与你反目。\n\
    \    - ③巧言相岔。如果话已经从口里说出来了，才惊觉自己碰到了别人的痛处，那么还能够做些什么来缓和气氛，挽救过错呢？这时，切忌慌乱之中作说明，因为说明越多，侵入别人的禁区就越深，而且有的事情本来就是越描越黑的。因此，转移话题，巧言相岔，给对方空间，才能尽快地及时从困境中解脱出来。例如，聊天的时候，你随口说“他真够倒霉的，就因为长得矮，连个女朋友都找不到。”说到这个，你猛然发觉自己失言，因为听你说话的人正是一个矮子，而且也因此而苦恼。此时，你接着说“不过，有资料表明，矮个通常都比高个聪明，他是一群人中事业最出色的一个。”这样就很妥帖地将话题转移到了事业上。\n\
    \n避讳，不仅是语言的艺术，也是处理人际关系不可缺少的技巧。\n\n- 3. 对于面子问题，我们除了消极地避讳以外，还可以采用积极主动的方式去“做面子”给对方。比如，以下这些方法都是行之有效的：\n\
    \    - ①替对方在同事、朋友及上司面前说好话，为他做公关，但不可太肉麻、露骨、刻意。\n    - ②对方有喜庆，主动以适当的方式参与庆贺。\n  \
    \  - ③对方有难言之苦，不动声色、悄悄地主动替他解决。\n    - ④适当地吹捧他，协助他建立在人群中的地位。\n\n当把“面子”上的功夫练到炉火纯青时，我们做“社交达人”的称号也就不远了。\n\
    \n### 7. 请求他人帮忙会赢得对方的好感\n\n本杰明·富兰克林是众所周知的成功人士，然而，他也曾碰到过人际关系方面的麻烦，他碰到了一个喜欢和他做对的人。\n\
    \n当时，年轻的富兰克林还只是费城一家小印刷厂的老板，在州议会的复选中，他幸运地被推举为宾夕法尼亚议会下院的书记员。就在正式选举前的紧要关头，一位新当选的议员却公开发表了一篇反对富兰克林作下院书记员的演说。演说篇幅很长，措辞尖锐，简直可以说是把富兰克林贬得一文不值。\n\
    \n面对这种意外情况，富兰克林既生气又有点儿手足无措。要知道，对方是一位很有声望、有修养、有才识的绅士，在当地十分有影响力，而富兰克林又不愿意卑躬屈膝地去讨好他。几经思考，富兰克林找到了一种比卑躬屈膝更恰当、更有效的方法。\n\
    \n富兰克林听说他收藏了几部分名贵而罕见的书，于是，他就写信恳求对方把这些珍贵的书籍借给自己拜读。那位议员接到信，马上就把书送了过来。一个星期后，富兰克林准时送还了那些书籍，并且附了一封感谢信，由衷地表达自己的谢意。\n\
    \n后来，当富兰克林再碰见他的时候，他竟然主动地跟富兰克林打招呼，而且告诉富兰克林，他会尽自己所能地帮助富兰克林。就这样，富兰克林将对手变成了终生的好友。\n\
    \n无独有偶，安德鲁·卡耐基也采用了类似的方法来化解人际危机。\n\n卡耐基当时正在圣路易斯的地方办理一座刚刚建好的桥的税款问题。事情进行到一半的时候，他的一位至关重要的合作伙伴竟然说想家了，想离开圣路易斯，回匹兹堡去。\n\
    \n卡耐基知道，如果他离开，那么税款的事情也就失败了，无论如何是不能让他离开的。在这关键时刻，卡耐基想到对方非常爱马，而且很擅长选马。脑中灵光一闪。他没有乞求对方留下来。相反，他请求对方帮他一个小忙，他说，他想给自己的妹妹买一匹马，但是自己不会挑马，希望对方能够帮他挑选一匹好马，先不要着急回家。\n\
    \n面对卡耐基的请求，对方果然答应了留下来。\n\n富兰克林和卡耐基都利用“请对方帮个小忙”的方法，化解了人际危机，从而获得了事业的成功。\n\n生活中，很多人因为怕引起他人的反感而从不找他人帮忙。其实，这种想法是完全错误的。\n\
    \n不知道你注意到没有？当他人拜托你帮个小忙时，你不但不会觉得麻烦，反而会觉得十分高兴。如果对方的请求恰恰是你最拿手的，你不但会心情愉悦，而且还会因此而喜欢对方。\n\
    \n不用为此感到怀疑，“请他人帮个小忙”能够获得对方的好感是有其心理学理论依据的。\n\n首先，请求他人帮个小忙，能够满足对方天性中的一种潜在的需要。当你请求他人帮个小忙的时候，实际上是主动将自己放在了一个相对较低的位置，从而抬高了对方，这样就能够满足对方获得他人尊重的本质需求，成就了对方的荣誉感。而你请他帮忙，代表你需要他，这让他感觉到自己被需要、自己的存在很有价值，从而激起自尊心。\n\
    \n总地来说，你请求他人帮个小忙，能够给对方带来愉悦的心理感受。因此，对于那种自己力所能及或者擅长的事情，对方是不会拒绝你的。\n\n那么，为什么对方帮了你的忙，就会对你产生好感呢？\n\
    \n心理学上有个著名的认知失调理论，也就是说，当个体的行为与自我概念不一致时，就会产生不愉悦的心理体验。\n\n当你无心或有意地伤害了某个人时，就会产生这样的问题“我为什么这么对他呢？”如果答案是“我很粗心、很糟糕”，那么，你正面的自我概念就与伤害他人的负面行为对立起来，进而产生认知失调；为了避免认知失调的不良感受，你就会为自己的负面行为找一个合理的解释，使之与你的自我概念一致，比如，你会想：“他让人讨厌！他活该！”\n\
    \n同样，如果你帮助了某个人，而这个人是你所讨厌的，那么，自我概念和自我行为就产生了冲突，而避免认知失调的合理解释就只能是：“我喜欢他，他很可爱！”\n\n\
    由此可见，请求对方帮个小忙，能够让你赢得对方的好感。因此，你大可不必拘谨地拒绝他人的帮助，更没有必要因为害怕引起对方的反感而不敢开口请求对方。\n\n###\
    \ 8.努力记住有关对方的小事\n\n马可·汉纳是当时世界闻名的美国政坛的风云人物。1896年，麦金利正是在汉纳的帮助下才顺利当选为总统的，并且美国采用金本位制也正是由于他的坚持。无疑，马可·汉纳在政治上有着非凡的影响力。尽管如此，年轻而骄傲的纽约商人、政治家威廉·比尔却并不怎么喜欢汉纳。在他看来，汉纳不过是个克利夫兰的“红发妖魔”、是个“笨蛋”而已，总之，比尔对汉纳没有好感。\n\
    \n然而，由于汉纳是共和党的领袖，为了自己在政治路上能够走得更远，比尔不得不登门拜访汉纳。即便如此，心中对汉纳仍然有说不出的反感。\n\n出乎意料的是，比尔发现在整个交谈过程中，汉纳从头到尾都在讲关于比尔的事情：关于比尔的父亲，关于比尔对政纲的意见等。\n\
    \n汉纳说：“你来自俄亥俄州吧？你的父亲是不是比尔法官？他是民主党的……”当时，比尔简直就觉得不可思议，汉纳竟然重视一个反对自己的人，将对方的一切了解得那么清楚。就在比尔目瞪口呆的时候，汉纳又像是在和一位世侄交谈一样说：“嗯，你父亲可是个非常厉害的角色，害得我几个朋友在一次石油生意上损失了许多钱呢！”\n\
    \n在整个谈话过程中，汉纳不时地讲到许多关于比尔的小事，例如他那位在阿雷兰的伯父。就这样，当谈话结束的时候，比尔对于汉纳的反感已经烟消云散了。几天后，威廉·比尔甚至成了汉纳忠诚的支持者。在此后的几年中，威廉·比尔最愿意做的事情就是为自己曾经最厌恶的汉纳服务。\n\
    \n由此可见，在与人交往的过程中，努力记住对方的小事，并且在适当的时候让对方了解你记住了关于他的事情，这能够帮助你赢得对方的好感。\n\n佩恩来享钢铁公司的创建人查尔斯·什瓦普，也认为对他人怀有浓厚的兴趣是获得良好人际关系的一个窍门：\n\
    \n第一次世界大战期间，查尔斯·什瓦普被紧急任命为紧急装备军舰公司的领导。为了提高军舰的制造数量，他记住了当时胡克岛造船所所长的海军司令喜欢泽西牛的癖好，然后他对这位海军司令说：“如果你能把军舰的制造数量从30艘提高到50艘，你将得到一头‘全美最棒的泽西牛。’”海军司令听后，视查尔斯为知己，表示愿意尽自己所能为查尔斯效力。\n\
    \n由此可见，努力记住有关对方的事情，然后让对方知道，能够让对方获得一种被人重视、被人关注的心理满足感，进而对你产生好感。并且，你所记住的事情越是微小、不起眼，当对方得知你记住了它们时，对方获得的心理满足感就越大，对你产生的好感也就越大。\n\
    \n通过记住有关对方的小事来获得对方的好感，是一个非常有效的社交心理策略，无论对方是大人物还是普通人，这个方法都同样有效。\n\n以访问大人物而闻名的新闻记者马可森说“当你将大人物们曾经说过的话复述出来的时候，他们的心情就会显得格外的好，对你也会表现得格外友善。”\n\
    \n那些善于交际的人都十分明白这种策略所带来的好处，他们总会在适当的时刻顺便问一两句对方的个人事情，以表示他们对对方正在做的事、对方的喜好记挂在心上，让对方感觉这些小事他们早该忘记但是却没想到他们还挂在心上，从而让对方的心理产生非常愉悦的感受，进而对他们产生好感。\n\
    \n这个方法实施起来很容易，然而或许正是因为它的容易，人们才常常忽略它，总是记得与自己有关的事，而忘记他人的事。因此，从现在开始，努力记住那些和对方有关的事情吧，一旦那些在对方看来微不足道的小事从你口中说出时，你就在无形中靠近了对方。\n\
    \n### 9.从否定到肯定的交往模式让你赢得人心\n\n著名心理学家阿伦森曾经做过一个这样的实验。\n\n参与实验的被试者会面对4个不同的评价人，这4个人会以4种不同方式来评价他们。第一个人，一直给予被试者肯定的评价；第二个人，始终给予被试者否定的评价；第三个人，一开始肯定被试者，然后否定被试者，其否定程度与第二个人相同；第四种，一开始否定被试者，然后肯定他们，而且肯定程度和第一个人相同。\n\
    \n最后，阿伦森统计了被试者对这4个评价者的喜欢程度。结果，被试者最喜欢的是一开始否定自己而后来肯定自己的人，其喜欢程度甚至远高于一 直肯定他们的人。而被试者们最讨厌的也并非是一直否定自己的人，而是一开始肯定自己、然后又否定自己的人。\n\
    \n由此可见，人们最喜欢那些对自己喜欢、奖励、赞赏不断增加的人，最不喜欢那些对自己喜欢、奖励、赞赏不断减少的人。心理学家将这种现象称为“增减原则”。\n\n\
    心理学家指出，在与人交往的过程中，自我价值始终是第一位的，每个人都会本能地保护自我价值。这种保护有两种具体的表现形式：从静态的角度看，它体现为人际交往中的交互性原则，即喜欢那些对自己有好感的人，而讨厌那些否定自己的人；从动态的角度看，它体现在人际吸引水平的增减原则上，即人们喜欢那些对自己的好感度不断增加的人，而讨厌那些对自己的好感度不断降低的人。\n\
    \n当他人对自己的态度由肯定转向否定的时候，自我价值受到了威胁，这个时候出于对自我价值保护的本能需求，人必然会极力维护自己的自我价值。那么怎样才能保证自我价值不减少呢？当然是通过否定对方、拒绝对方来否定对方所给予的“肯定一否定”评价的正确性。\n\
    \n也就是说，要想赢得对方的喜爱，除了抱着“我喜欢你”的态度之外，还应该让你喜欢对方的程度呈递增趋势。\n\n生活中，有的人最初与人交往的时候，为了赢得对方的好感，就有意识地频频赞美对方；许多事情，即使自己有困难仍然勉为其难地帮助对方……通过种种方式向对方传递着“我喜欢你”的信息。可是，时间长了这种“勉为其难”就坚持不下去了，再加上已经获得了对方一定的好感，于是，赞美对方的次数在减少，对于对方的委托更是能推就推……所有的言行无一律让对方感觉到“他对我越来越不好了，他对我的好感度在降低”，从而激发了对方的自我价值保护机制，使彼此的关系陷入困境之中。\n\
    \n在现实生活中，犯这种“从肯定到否定”错误的人并不在少数。那么，应该怎样才能避免“增减原则”所带来的负面效应，而让它积极地推动人际关系的发展呢？\n\n\
    首先，你必须清楚地认识到，人的确都有喜欢正面评价、厌恶负面评价的弱点，但是人也同样具有理性分析的能力，因此，你所做出的正面评价必须是真诚的。\n\n其次，你所给予对方的肯定应该把握在一定范围之内，避免过犹不及。一味地赞美对方，固然能够赢得对方的一时好感，却也会为日后进一步交往带来不利影响。\n\
    \n最后，一定要有意识地避免“先扬后抑”。“先扬后抑”的动态递减模式会使对方的自尊受到威胁。谁让他人的自尊受威胁，谁就会成为最不受欢迎的人。\n\n把握好“增减原则”，走过人际交往的误区，有意识地制造一种动态的、螺旋式上升的“心理曲线”，会在很大程度上增加你的受欢迎程度。具体地说，你可以从以下几点来努力：\n\
    \n- 1. 把基点拉低。不要一开始就给予对方过多的肯定，应该将肯定态度的基点定得低一些，给后面的递增留有空间和余地。\n- 2. “先抑后扬”。你可以采用先抑后扬的方式，但是要从无伤尊的小毛病说起，然后再给予对方恰如其分的表扬。\n\
    - 3. 适当地保留。人与人的交往是一个循序渐进的过程。适当地有所保留，留下一点悬念和空间，更有利于彼此交往的加深。\n\n在人际交往中，要学会先否定，然后肯定，有意识地以逐渐递增的方式向对方传递你对他的好感。只有这样，你才能更有效、更长久地赢得他人的好感。\n"
