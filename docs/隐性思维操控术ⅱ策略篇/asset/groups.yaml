    # 6.谁都希望得到别人的理解和关心


    一位专家被邀到某节目做嘉宾主持，节目主持人问他：“您学的是什么专业？”当下，这位专家就十分不悦地答道：“受人之邀，来此做嘉宾而已，鄙人一无所长。”


    虽说这位专家有点心胸不够宽广，但主持人竟然对受邀嘉宾的情况忽略得如此彻底，也实在是让人不快。一般来讲，每个人都期望得到他人的理解和关心。主持人对专家相关信息的疏忽，说明了他一点儿也不关心对方，这在某种程度上伤害到了对方的“自我价值”，这就难怪那位专家会回以脸色了。


    由此可见，每个人总有得到他人理解和关心的需求，如果你能够满足对方的这种需求，你往往就能够获得对方极大的好感；反之，就势必会激起对方的反感。


    日本著名心理学家多湖辉曾经说了这样一个真实的故事：


    一个星期天，某企业的一位年轻职员特意到科长家中拜访说前些时候，我答应请您品尝的酒已经做好了，所以特意给您送过来。”说完，便拿出他自己酿制的水果酒递给科长。实际上，这位科长已经忘记了水果酒这事事情了。原来，半个月前两人曾在一起喝酒，对方提到过自己家乡有一种水果酒味道很棒，不过需要自己酿制。当下，这位科长就开玩笑说既然这样，那有机会你一定要送我一瓶，让我好好品尝品尝。”'
  - '[PAGE 68]


    自己的一句玩笑话，却被对方郑重其事地记在了心上，并且这么快就送来了，这让科长很受感动，没有想到对方会如此在意自己。自此，这位科长和年轻职员之间建立起了深厚的情谊，而这位职员在以后的日子里也得到了科长的许多关照。


    从上面这个例子可以看出，如果记住或者留意到对方没有在意的细节之处，从这些方面给以关心的话，往往能够更大程度地满足对方被他人关心的需求。


    留意对方说过的话、表达过的观点，然后在适当的时机，复述出来给对方听。比如，你可以说：“我记得，以前你曾说过……使我至今记忆犹新。”尤其当你说的是对方的兴趣和爱好所在的时候，你对他的重视一定会让他惊喜万分，从而大大消除他对你所存的戒备。


    留意对方的改变，当你发现对方这种改变的时候，一定要明确地向对方表达出你的赞赏。比如，对方换了一个新发型，如果你能成方第一个发现对方改变的人，并且告诉对方“看上去更加年轻了”，往往能够在极大程度上满足对方被人关心的需求。


    生活中，没有人不需要别人的关心。当别人对自己表示出真诚的关心的时候，每个人都是乐于接受的，并且会不知不觉地对关心自己的人产生好感。所以，要想赢得好人缘，就需要将你对别人的关心适当地表达出来，而从细微处表达自己的关心，能够使关心的效果更加显著。'
