    # 2. “危言耸听”震慑对方


    一般说来，要想使对方听从你的指示，你在指示对方的时候应该  平心静气、摆事实、讲道理。但是，在某些时候，在特定的、非常  重要的问题上，带有一定的感情色彩，以可能性为依据，以假设为前  提，甚至略带夸张地故意将问题说得非
    常严重，将后果描述得非常  可怕，往往能够给对方“当头一棒”，使他幡然醒悟。


    从效果上看，“危言耸听”能够使对方冷静而全面地考虑问题，  避免对方因心血来潮或马虎大意而产生鲁莽、轻率的行为。比如，  当教师想要说服望子成龙心切的家长，不要在学业上对子女施加重  大压力、不要因为子女成绩不佳而呵叱责骂子女的时候，除了用“榜  上无名、脚下有金”、“条条大路通罗马”等诸如此类的道理开导外，  还可以把家长的不当做法有可能产生的严重后果明确地提出来。教  师可以说孩子的心理承受能力远比我们所想象的要差，即使是这种  处于关爱下的严厉也很可能会导致孩子精神的崩溃。前不久报纸  上就报道了一个考生因考试没有达到父母要求而不敢回家，最后跳  楼轻生的例子。这可都是发生在我们身边的事情啊！”这样就能够  在心理上震慑对方，让对方充分意识到不遵
    循教师的指示会产生怎  样的后果，进而冷静地检讨自己的做法，调整自己的态度和行为。


    危言耸听，往往能够带给人极大的心理震撼，但即使是危言耸  听也必须有理有据、动之以情晓之以理。有一位心理学家曾经采用'
