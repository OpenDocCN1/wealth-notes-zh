    # 4.化解对方对立情绪的心理策略


    有位女士和丈夫相处不融洽，她一点儿也感觉不到丈夫对自己的爱恋，为此苦恼不已。为了改善这种情况，她就去向村子里的智者请教，要他指点迷津。智者对她说没问题，我一定会帮你，但我有一个条件，我要你从狮子身上拔三根毛下来给我。”


    狮子是最凶猛的动物，连猎人都不敢轻易靠近，何况她这样一个手无缚鸡之力的弱女子呢？但是为了挽回丈夫的心，她还是决定去做，心想“不能力敌就智取”。


    第二天早晨，她特意起个大早，拿了一盆肉到狮子出没的树林边，放下盆便回家去。以后，她每天早上都会在同一个地方为狮子摆上一盆肉当早餐。渐渐地，狮子习惯了她的款待，也把她当成了熟人。到后来，那头狮子一见到她的身影，就主动靠上前去，用背蹭她的腿，要她摸摸它的背。这时候，这位女士总是轻轻地拍拍它的背，就像奖励一个孩子一样，随即就离开。


    又过了一段时间，当这位女士确信狮子已完全信任她的时候，终于小心翼翼地从狮子的鬃毛上拔了三根下来。


    她迫不及待地把狮子毛交给智者，智者问她是怎么弄到手的。这位女士详细讲述了经过，智者听完笑了笑，说：“你已经学会留住丈夫的方法了，那就是你驯服狮子的方法。”


    这位女士之所以能驯服狮子，是因为一开始就没有直接把自己'
  - '[PAGE 330]


    摆到“要拔狮子毛”的与之对立的位置，而是站到狮子的身边“以柔克刚”。


    有一个城市垃圾污染问题严重,为此,市政部门购置了许多垃圾桶摆放在各个路口，然而效果并不理想。接着，城管机构又出台了几个解决办法，比如，对乱扔垃圾者处以25-50元的罚款，增加卫生管理员的巡逻等，但问题仍然没有解决。后来有人设计了一个特别的电动垃圾桶，桶上装有一个感应器，当感应器感应到垃圾进桶，就会启动扬声装置，播出“谢谢你保护环境”之类的话。


    结果，新型垃圾桶一经投入使用，这个城市的垃圾污染问题显著改善。那么，为什么其他方法收效甚微，而这个方法却可以成功呢？原因就在于，这种做法使市民们意识到，市政当局和市民们是同一阵线的，都在为了城市的良好环境而努力，因此双方没有什么隔阂，没有隔阂自然就容易合作愉快。相反，增加罚款和巡逻人员的方法，从一开始就形成了对立的关系：一个罚款，一个不要被罚款；一个要抓，一个被抓。在逆反心理的作用下，有些市民即使以前不会乱丢垃圾的，也变成乱丢的了。


    法国著名作家让·德·拉封丹写过一个“北风和南风”的寓言：北风和南风都觉得自己比对对方更有用，于是就相约了一场比赛，看谁能把行人身上的大衣脱掉。北风首先让街上刮起了冰冷刺骨的寒风，而且越刮越大，结果行人为了抵御严寒，把大衣越裹越紧。而南风则徐徐吹起了暖洋洋的风，顿时风和日丽，行人觉得暖和了，'
  - '[PAGE 331]


    大衣有些穿不住了，就开始解开纽扣、脱掉大衣，南风获得了胜利。


    同样，在处理人与人之间的关系时，首先要做的就是化解对立的情绪。北风和南风都要使行人脱掉大衣，但北风与行人针锋相对，加剧了彼此的对立，最终失败。


    从上面这些事例中我们可以了解到：以对立的心态去化解对立的情绪是注定要失败的；只有反其道而行，才能达到以柔克刚的神奇效果。'
  - '[PAGE 332]


    # 5. “背后鞠躬”消除对方的敌意


    在人际心理学中，有一种被称作“背后鞠躬”的劝说术，让第三者佯作无意地向对方道出你的善意或友好的想法，往往能够让彼此不睦的人际关系来个大转折。


    有一次，有人在林肯总统面前搬弄是非说，外交部长埃德温·斯坦顿曾骂林肯是个该死的傻瓜。谁知，林肯听了以后不但没有生气，反而像闲话家常一般地说：“如果斯坦顿说我是个该死的傻瓜，那么我很可能真是地是，因为他办事一切都认真，他说的十有八九都是正确的。”林肯的这番话很快传到了斯坦顿的耳朵里，斯坦顿听到他人转述过来的这番话的时候，感动极了。他在第一时间内跑到林肯面前，向林肯表示了自己敬意。


    林肯正是利用了“背后鞠躬”的方法使斯坦顿改变了态度。那么为什么“背后鞠躬”能够取得这样的效果呢？


    心理学家认为，与当面表达善意相比“背后鞠躬”往往能产生更加显著的效果，主要原因有3方面：


    +   1. 人际交往遵循“相悦定律”，即谁喜欢你，你往往就会对谁报以同样的好感。因此，当你向对方“鞠躬”的时候，往往能够换回对方的“鞠躬”。


    +   2. 采用“背后”的方式，能够绕过对方的心理防备区。如果你亲切向对方表达善意，即使你完全是出于真心的，也很可能被对方'
