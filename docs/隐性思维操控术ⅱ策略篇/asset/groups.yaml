    - 2. 生活中，绝大多数人对于自己即将失去、或者根本不可能得到的东西，往往会更加积极、更加努力地去想到它。给对方设定最后期限，实际上是让对方知道，他再拖延就面临着失去，从而激发出他更大的行动积极性。


    - 3. 给对方一个最后期限，给对方可以选择的机会减少，让他不得不选择听从你的指示。


