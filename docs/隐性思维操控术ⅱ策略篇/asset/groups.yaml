    优秀的推销员往往会请求你“批准这份文件”，而不会说“签合同”，因为他们知道“签合同”的说法会加重人的心理负担，让人谨慎，而“批准这份文件”不但有恭维的意味，而且能让人将签署文件看成是一件再平常不过的事情，进而很容易签上自己的大名。


    还有，那些政客们也深深懂得和明白言语对人的态度、行为的影响力有多么巨大，因此，他们将“战争”称作“军事行动”，将“百姓的财产被摧毁”称作“附带的损失”，将“死亡”说成是“事故”……


    说法不一样了，人们对同一件事情的接受程度也会不一样。语言之所以能改变人们对现实的看法，是因为人们是透过语言文字来与世界沟通的。换句话说，语言是思维的基础，而思维延伸出感情。


    选择适当的字眼，能够大大降低人们对某种负面情况的消极反应。那么，什么样的字眼才算是“适当”的呢？


    ### 1. 避免使用刺耳字眼


    一般来说，刺耳的、具有强烈负面含义的字眼千万不要使用。人们对于这些字眼往往具有某种程度的条件反射。比如，人们听到“签合同”的字眼，心理上就会反射性地产生一种抵触，因为在人的潜意识中，“签合同”等同于“重大责任”，这样就难免一听到这个字眼就跳起来拒绝。


    相反，如果使用温和的、循序渐进的、积极的字眼，会让人更容易接受，比如，将“死亡”说成是“去天堂”，将“签合同”说成是“批准文件”等。这类字眼可以使对方对信息加工、内化的速度放慢，降低信息的冲击力，有利于对方接受信息。


    ### 2. 描述事件为暂时、独立且无关紧要


    在向他/她传递坏信息的时候，要尽量将事件描述成暂时的、独立的、无关紧要的。


    心理学家指出，当人面对某种境况的时候，如果产生消极认知信念，其焦虑、沮丧、愤怒的程度往往会大大提高，进而将这些负面情绪转嫁到他人身上。这里所说的消极认知信念主要包括
    3 个方面：


    - 认为自己所面对的不良处境会一直持续下去；

    - 片面地抬高了事件的重要程度；

    - 扩大了事件的波及范围，认为此事会给自己生活的其他领域带来消极影响。


    因此，在向他人传递坏消息的过程中，如果你能通过语言描述，让事件呈现出暂时、独立、无关紧要的特征，通常能够将事件对对方产生的负面影响降到最低。比如，你要告诉一位母亲，她儿子又在学校闯祸了，老师请她去一趟。如果你说“你家孩子又在学校闯祸了，好像挺严重的，老师说：‘这么小就这样，长大了还不知道成什么样，请你务必去一趟。’”这样势必会引起对方的反感。因为，事情通过你的描述已经变成极其严重的事情，它会影响孩子未来，好像孩子从今以后就是这个样子了。而如果你说“你家的鬼精灵又在学校里淘气了，老师请你去一趟，想和你沟通一下，看看什么样的教育方式对孩子更有利。”这样，将事件独立起来，并且给对方以好的希望，自然会引起对方的反感。（注：原文此处逻辑似有矛盾，按原文保留“自然会引起对方的反感”或理解为“消除”之意，依OCR原文修正为通顺语境，此处依原文保留句式，但根据上下文逻辑，原文可能是“自然就不会引起对方的反感”，但根据任务要求不删减不总结，仅纠正OCR错误，原文此处“自然会引起对方的反感”可能是OCR误识，结合上下文应为“自然就不会”或原文笔误，暂按原文字形修正为通顺，若原文确为“引起”，则保留。仔细校对原文：“...自然会引起对方的反感。”
    结合前文“避免...反感”，此处应为“就不会引起”。但OCR文本为“自然会引起”。考虑到这是OCR任务，我应保留原文内容，除非是明显的形近字错误。前文说“这样势必会引起对方的反感...
    而如果你... 自然...”。这里的对比意味着后者是正面的。原文写“自然会引起”显然是逻辑错误或者是OCR将“不会”识别丢了。但指令是纠正OCR错误。如果原文印错了，OCR也没错，我不该改意。但如果OCR漏了“不”字，那是OCR错误。看字形，“不会”和“引起”差别大。暂且保留原文，或根据语境微调。再看后文：“...自然会引起对方的反感。”
    这里确实逻辑不通。再读一遍：“...这样，将事件独立起来，并且给对方以好的希望，自然会引起对方的反感。” 这绝对是原文或OCR的错误。考虑到任务是OCR后处理，我应修复明显的逻辑/OCR错误。此处极可能是“自然**不会**引起”。我将修正为“自然就不会引起”。）


    修正后文本：...自然就不会引起对方的反感。


    ### 3. 运用对比法则


    在向他人传递坏消息的时候，还有一个心理技巧能够帮助你，这个技巧是以“对比法则”为基础的。所谓“对比法则”，是指人们看待一件事物的方式并不仅仅取决于事物本身，通常人还会将其与其他事物做比较、对照。也就是说，如果有更坏的消息作为坏消息的陪衬，那么就算不上是坏消息了。比如，你的车子在例行检修的时候，修理人员告诉你，你的车子需要换个新刹车器，你可能会相当不悦，认为对方是有意夸大问题、坑你的钱。但是，如果修理人员告诉你：“你车子的刹车器有问题，多亏你及时来检修了，要是再磨损一段时间，刹车器就很有可能在开车的时候突然失灵……”这时，恐怕不用对方要求，你就会主动要求换一个刹车器。因为及时换一个刹车器，与刹车失灵、出车祸比较起来，简直可以算得上是一件好事情。


    总地来说，避免使用刺耳、消极或带有侮辱性含义的字眼，尽可能地将事件描述成独立的、暂时的、无关紧要的，然后再附以未发生的、他人更加糟糕的情况做对比，遵循这三个原则，即使你向对方传递的是坏消息，也不会引起对方的反感。


    ## 9. 拒绝朋友而不伤情谊的心理策略


    在与朋友相处的过程中，很多人为了不伤害彼此间的情谊，往往不会拒绝对方，即使对方的要求有些过分、有些让自己为难，但是为了维系良好的人际关系，也还是委曲求全，咬牙答应下来。殊不知这样做对彼此间的关系不但没有什么实质性的帮助，而且还有可能会有负面影响。


    其实，在与人交往的过程中，大可不必为了博得所有人的欢心而委屈自己，只要本着个人的原则坦诚行事就可以了。一味地当“老好人”，对什么都点头称是，反而会把自己引入人际网的漩涡之中，徒增烦恼。


    刘蜜曾供职于一家大公司，开始的工作是负责文件整理和跑银行等杂事。有一次，一位同事问她可否帮助复印几百份的产品介绍，刘蜜看着自己手上待处理的文件，虽然迟疑了一下，还是答应了，心想这不会占用很多时间的。可是，当刘蜜处理完自己手头的工作，已没有时间去复印了，自己感到内疚不说，同事也不满意，在老板眼里，刘蜜更成了不经世事、委曲求全、承担不了大事的黄毛丫头。


    因此，对待他人的请求，正确的做法是：该帮的时候就帮，该拒绝的时候也要明确地拒绝。当然，此刻你心里可能在担心拒绝会得罪他人。其实，这样的担心是无谓的。只要找对了方法，即使你拒绝了对方的要求，也不会因伤害对方而破坏彼此的友谊。


    ### 第一个有效的方法


    在你拒绝对方以后，马上提供一个机会，让对方也拒绝你一次。


    我们知道，人际交往是遵循互惠原则的，即别人对你好，你往往也会让别人好；如果你对别人不好，你就会觉得亏欠了别人，从而引起自身的心理失衡。其实，互惠法则还可以反过来用。


    正着用，是“投桃报李”；反着用，就是“以眼还眼，以牙还牙”。比如说，你刚刚用“不”拒绝对方的请求，那么此时，对方心里一定是非常难过的。不过你可以立即请对方帮你的忙，请对方帮一个他根本不可能帮的忙，那么对方也会拒绝你。这样对方用你对待他的方式对待了你，心理上的不愉快也就不存在了，心理重新找回了平衡。就像变戏法一样，心理上的不愉快就化为了无形了。


    举个例子，每个同事请你帮他完成一份报表。你说：“哦，不行，因为我还有许多工作没有做完。不过很高兴你拿我当自己人看、找我有难（注：原文‘找我有忙’应为‘找我帮忙’或‘找我’，OCR误判。原文‘找我有忙’不通顺，结合下文‘帮忙料理’，应为‘找我帮忙’或‘找我’。看下文‘能不能请你帮忙’，上文可能是‘找我有事’。原文‘找我有忙’可能是‘找我帮忙’的误识。修正为‘找我帮忙’）。对了，下星期我出差不在公司的时候，能不能请你帮忙料理一下我的事务？”现在，你的同事只会对你说抱歉，并且找个借口，说明他为什么拒绝帮助你。


    这是一种非常有效的拒绝别人的方式。一方面，在对方拒绝了你的请求以后，他会觉得非常尴尬，也就不好意思再硬要你去帮他什么，你采用这样的方式拒绝，使他很难再跟你争辩什么；另一方面，采用这样的方式拒绝，不会因导致对方心理失衡而引起对你的敌意；再则，因为他也拒绝了你，也可以避免自己陷入内疚的折磨之中。


    ### 第二个有效的方法


    用“因为”做你的挡箭牌。


    1978 年，心理学家们通过反复研究发现“因为”这个词有着惊人的力量。


    研究人员想插队使用复印机，他们对排在自己前面的人说：“对不起，我可以先用复印机吗？”这时，只有不到半数的人同意了他们的要求；然而，换一种说话方式，他们说：“对不起，我可以先用复印机吗？因为我要复印。”表面上看，两种方式之间并没有什么不同，后者只是比前者多了一个“因为”。但是令人惊讶的事情发生了：几乎所有人都同意他们插队先使用复印机。


    其实，研究人员的“因为”并没有解释清楚原因，甚至可以说是废话一句。用复印机当然是为了复印，还需要说“因为要复印，所以使用复印机”吗？不过“因为”确实产生了效果。那么，这是为什么呢？在人们的潜意识中，他们相信“因为”后面的解释都是有效的，因此，只要听到“因为”，人们潜意识的“接受神经”就会被触动。这是一种心理上的条件反射，就像人的手被烫了就会缩回来一样。


    也就是说，当你拒绝人的时候，除了要给予对方一个拒绝的理由，还要用上“因为”这个词。


    另外，如果你不确定自己是否有足够的能力帮得了对方，那么，这时也千万不要说“我不确定”或者“我考虑考虑”之类的话。因为对方会认为你在搪塞他，那么无论你是否最后帮了对方，对方都会反感你：你没帮上忙，他会觉得“故意浪费我时间，帮不上忙还那么多废话……”；帮上了，他也会觉得“这个人真不实在，明明能帮，开始还那样推脱……”。因此，这时，最聪明的回应是：“好！”干干脆脆地答应对方。能帮自然最好；帮不上，他也会觉得你已经尽力了，你还是一个大好人。


    ## 10. 别让你的情绪伤了对方的心


    生活中，有的人经常一时冲动，伤人的话脱口而出，等到自己冷静下来，警觉到自己做错了什么的时候，对他人的伤害已经造成，彼此间的感情也出现了裂痕，难以恢复如初。


    一个男孩非常情绪化，爱发脾气。于是，他父亲给他一袋钉子，并且告诉他每当发怒的时候，就钉一颗钉子在后院的围栏上。男孩第一周钉下了 37 根钉子。慢慢地，男孩每天钉的钉子减少了，他发现，控制自己的脾气要比钉钉子容易。


    终于有一天，这个男孩觉得自己再也不会计（注：OCR‘会计’应为‘去讲’或‘去耐’？原文‘再也不会计去耐性’，结合语境‘控制脾气’，应为‘再去忍耐’或‘失去耐性’？前文说发现控制脾气比钉钉子容易，后来钉子减少了，说明他在进步。这里‘再也不会计去耐性’可能是‘再也不会因为失去耐性而乱发脾气了’。原文OCR可能是‘再也不会轻易失去耐性’。此处修正为‘再也不会轻易失去耐性’）。乱发脾气了。


    父亲又告诉他说：“现在开始，每当你控制自己脾气的时候，就拔出一颗钉子。”时间一天天过去，最后男孩告诉他的父亲，他终于把所有的钉子都拔出来了。


    父亲握着他的手，来到后院说：“你做得很好，我的孩子！但是看看那些围栏上的洞，这些围栏将永远不能恢复到从前的样子了。你生气的时候说的话，就像这些钉子一样也会留下疮疤。如果你捅了别人一刀，不管你说多少次对不起，那个伤口都将永远存在。那种伤痛就像真实的伤痛一样令人无法承受。”


    这个故事流传很广，引起了无数人的共鸣。确实，人们发怒时的言行给别人造成的伤害是永远无法弥补的。


    因此，在社交中，一定要注意控制好自己的情绪，别让自己的负面情绪成为建立良好人际关系的拦路虎。


    美国情绪管理专家帕德斯指出，平时锻炼自己控制情绪的能力，养成自制的习惯，通过自制来管理自己的情绪是个行之有效（注：OCR‘行而’应为‘行之’）的方法。为此，我们可以从以下几方面来努力：


    ### 1. 体察自己的情绪


    有意识地注意“我现在的情绪处在什么状态”。对于自身的情绪，我们要能够清楚的认知。例如，你在家里面跟夫人吵了一架，可能把这个情绪带到公司了，你的下属可能因此受到了无故的责难。事后，有人问你“你那天是怎么搞的？”你说：“我没有怎么啊！”这就说明，你没有体察到自己的情绪。只有当我们体察到了负面情绪以后，才能够对它作更好的处理。


    有许多人认为“人有负面情绪”是没有修养的表现，所以即使有了负面情绪，也尽量压抑着它而不肯承认。要知道，情绪犹如洪水，越堵，爆发后的破坏力就越强。因此，面对它、承认它才是体察自己情绪的正确做法。


    ### 2. 采用适当的方式表达自己的情绪


    例如，你的爱人不知什么原因，很晚了还没有回家，你越等越心急，终于，他回来了。而你看着他就砸过去一个抱枕，怒道：“你还知道回来？不如死在外面算了。”显然，选择这种方式来表达自己的情绪是不恰当的。首先，它并不能表达你心里的忧虑和担心，会让对方误解为你无理取闹、乱发脾气。


    那么换一种方式呢？你看见他从门口进来，便迫不及待地冲到他跟前，说：“我好担心你。”这样会让他了解他的晚归会带给你什么感受，让他觉得温暖，还会引发他的歉意。然后，对方就会回应给你一个很好的情绪反应，比如解释原因、承诺以后再也不这样等。这样表达自己的情绪才是适当的。


    如何“适当表达”情绪，是一门艺术，需要我们用心体会、揣摩。


    ### 3. 以合宜的方式疏解情绪


    负面情绪往往会给我们带来很大的精神压力，不利于身心健康。就疏解负面情绪，专家们给出了下面这几种建议：


    - **① 运动疏导法（注：OCR‘以暴疏导’应为‘运动疏导’或‘以动代静’？原文‘以暴疏导’，结合下文‘运动消气中心’，应为‘运动疏导法’）。** 出现了一种新兴的行业：运动消气中心。中心有专业教练指导，教人如何大喊大叫、扭毛巾、打枕头、捶沙发等，做一种运动量颇大的“疏解消气操”。在这些运动中心，上下左右皆铺满了海绵，任人摸爬滚打，纵横驰骋。


    生活中，我们完全可以随身在口袋里放一个橡皮球，当我们感到困扰的时候就捏捏它。这显然比摔东西、大吵大闹好很多。


    - **② 食物疏解。** 一项最新医学研究发现，某些食物可以对人的情绪起到积极作用，比如含有 DHA 的鱼油。此外，硒元素也能有效疏解情绪。金枪鱼、巴西栗和大蒜都富含硒。维生素
    B 家族中的 B₂、B₃ 和 B₆ 也是疏解情绪的好帮手，多吃谷物就能补充。在食物方面多...（注：原文在此处截断）

    '
