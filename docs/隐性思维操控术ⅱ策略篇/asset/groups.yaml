    ## 快乐原则与“本我”、“超我”


    的快乐原则，是“本我”在起作用。如果你为了不将米饭喷到别人身上，宁肯自己难受也要忍住，你所遵循的就是“超我”的道德原则，是“超我”在支配你的言行。然后，你离席，到洗手间处理问题，你在欲望和现实之间找到了平衡，则是“自我”在起作用。


    由此可见，当人处于“超我”状态的时候，往往是最让人觉得安全的，他一定不会去伤害别人；当人处于“本我”状态的时候，往往具有一定的危险性，因为他很有可能为了自己的快乐而牺牲他人的快乐。


    在人际交往中，“本我”要求你将自己全部保留起来，以免被他人所伤害，同时，还驱使你多探知别人的一切，以获得某种有利地位。“超我”则要求你公开坦诚地和他人进行交往，应该没有丝毫的保留。当你提高自己透明度的时候，对方的潜意识会知道是“超我”在支配你的言行，你是安全无害的；同时你也愿意牺牲自己去满足别人。这样，对方自然能够信任你。并且，你的透明度越高，“超我”状态越纯粹，对方对你就越信任。


    同理，你可以通过让对方意识到你是受“超我”支配的来赢得对方的信任。走入人际交往中的“超我”境界，能够让你最大限度地赢得他人的信任。换言之，你必须具备相当的道德修养才能够让他人信任你。具体地说，你可以从以下几方面来打造自己值得信赖的形象：


    1. 复述对方的要求。当别人对自己说话时，不要毫无反应，也不要只以点头表示。在对方提出要求时，要简略地复述一次；在对方说话时，以声音表示自己在专心聆听，比如“噢，是吗”、“嗯”、“对”等。这样，对方感觉到被尊重，会说得更起劲，同时也会不自觉地产生信赖。

    2. 以退为进，用坚定的语气请求。有的人想要别人听从自己的话时，会不自觉地采用命令式语气，这并不是一个好习惯。同辈之间不宜，即使是长辈对晚辈，命令式语气也会因为激发对方的反叛心理而收不到效果。

    直截了当不如以退为进。用坚定的语气说“请容许我说”、“不妨听听我的意见”或“我有另一种建议”等，这样能消除对方的警戒心，体现你的谦虚和体谅，进而让别人信赖你。

    3. 表现坚强。有两个人，一个整天垂头丧气，动辄大呼辛苦、抱怨生活，一点点小病轻伤都弄得像要“阵亡”了一般；另一个人总是默默地把事情做好，不怕苦、不避难，即使事情出了问题，他的第一反应也是分析情况、竭力挽救，而非怨天尤人。面对这两个人，你会把自己的事情交给谁去办呢？相信，如果不是以把事情办砸为目标的，都会选择后者。

    是的，只有表现得坚强才能够让别人对我们信任。

    4. 不轻率许诺。轻率许诺会显得虚浮、不踏实，让人觉得不可靠。比如：一个人几乎每天都说：“我决定从此刻开始不碰香烟了。”然而，事实是这句话的效用只限于5分钟以内。这虽然是生活中极小的事情，但是信心是点滴累积的，从无数小事上，别人可判断你的为人。随便打破自己的诺言，会影响别人对你的信心。

    5. 关心失意者。每个人都会有失意、心情不好的时候，若对失意者避而远之，那么，无论你是出于什么样的心理，都只会让其他人认为你是个势利小人、不可靠。相反，如果能够关心一些失意的朋友、下属或同事，设法诱导对方吐露心中的不快并且给予帮助，你就会被认为是一个有情有义的人，一个值得信赖的人。

    6. 衣着表诚意。穿戴整齐，除了能给他人留下良好的印象外，也是诚意的表示。别人认为你存诚意，才可能信任你。

    7. 善待配角。别以为善待主角就可以了，至于配角，忽略不计。事实上，对待无关痛痒的配角的态度往往更能显示一个人的品性，人们也习惯从中判定其是否值得信赖。因此，善待配角一样很重要。

    8. 学会沉默。要想别人相信你，先要自己相信自己。喧哗恰好是缺乏自信的表现，只有“半桶水才会响叮当”。因此，有的时候“沉默是金”。

    9. 注意自己的细节动作。心理学家指出：双臂环抱胸前或者叠起双腿的人，是缺乏安全感、自我保护、抗拒对方的一种表现。许多小动作，如拗手指、弄头发、搔痒等，都会破坏信任感的建立。因此，如果我们把握不好什么小动作不能做、什么小动作可有可无、什么小动作能起推动作用，最好的办法就是：与人交往的时候，不要做任何小动作。

    10. 不要过分标榜自我。过分标榜自我、突出个人形象，是一种以自我为中心的表现，甚至可以说是自私，这是非常惹人反感的。


    总地来说，开诚布公是人际交往的一条法则。每个人都希望他人能无所隐瞒地、坦诚地和自己交往。如果你希望得到他人的信任，获得真正意义上的友谊，就一定要在这方面做足工夫。


    ## 2. 让朋友越来越近的心理技巧


    正所谓“人情卖给熟面孔”，在人际交往中，怎样从陌生人变成熟人是至关重要的。俗话说“一回生，两回熟”。面对陌生人，只要能打开突破口，与对方拉上关系，就要毫不放松，接二连三地点上去，你来我往，双方的关系自然就近了，这就是交往的秘诀。社会学家指出，想与陌生人拉关系、套近乎，只要掌握了如下这些技巧，就会无往而不利。


    1. 制造机会拉近彼此的身体距离。生活中，那些销售精英们一般都很善此道。比如，顾客在百货公司买衬衫或领带时，店员总是会说：“我帮你整理一下吧。”然后，借着整理衣物的机会，让彼此的身体靠近，有时甚至会接近到只有情侣之间才可能的距离，在不知不觉中就减弱了对方的防御心理，拉近了心理距离。

    出于动物的本能，人都有一种防御意识，自己身体四周的一定范围内是陌生人的禁区，通常情况下，只允许亲近的人进入。久而久之，就会有一种错觉：只要能够进入这个范围内的人都是无害的，换言之，人们承认与进入这个范围的人关系亲近。

    人与人之间的身体距离能够显示彼此关系的亲疏远近。比如，手能放在彼此肩膀的往往是情侣。那么，即使是陌生人，当对方借机机会把手放在你肩膀上时，心理距离也会一下子缩短。推销员就常用这种方法，他们经常一边谈话，一边很自然地移动位置，离顾客近一些，让彼此亲一点。

    由此可见，制造自然接近对方的机会，是快速拉近彼此距离的法门。

    2. 与初次见面的人打交道，谈话时应该选择在对方旁边的位置。不可否认，和初次见面的人面对面、眼睛看着眼睛地谈话，是一件让人感觉很不爽的事情。而如果站在对方旁边，就可以避免两人视线相遇造成的紧张感，从而保证交流能够顺利进行。

    此外，人的潜意识认为：面对面的陌生人往往是对手，站在旁边的则是同道中人。因此，与人交谈时选择对方旁边的位置能够有效地增加亲近感。

    3. 有事没事多见面，文火加热彼此间的关系。有这样一个问题：有两个人，一个与你同住一个小区，经常会碰面，彼此打个招呼；一个是你在酒吧新认识的，你们在一起喝了一夜酒。恰好，两个人与你相处的时间总长是一样的，你会觉得谁比较可信赖呢？相信大多数人都会选择前者。

    面对一个新认识的朋友，一次交往时间过长、谈得过多过深，这并不利于关系的进一步发展。就像人喜欢吃一样东西，但如果一次吃得过多，也会腻的。而且，这样的行为容易让对方认为你轻浮、不稳重，是“自来熟”。

    让我们来看看那些交际高手们是如何处理的：他们往往每隔一段时间就会和新朋友见上一面，并附加上“到附近来办事，顺便来看看你”之类的说法。结果如何呢？几个月之后，甚至更短的时间后，他们就和对方变成了很好、很亲近的老朋友。

    心理学家认为，人的心理遵循“分散法则”，集中交往不如分散交往来得有效。就像我们学习，每天学习2小时，连续6天，绝对比一口气学习12小时更加有效，虽然学习时间都是12小时。所以说，在人际关系方面，我们一定要遵循“分散法则”，这是给对方强烈印象的最好方法。


    ## 3. 巧用“暗示”避开人的心理壁垒


    如果你正为自己与他人的关系停滞不前而苦恼，那么巧妙的暗示往往能够在不知不觉间让你们的关系一日千里。


    所谓暗示，是指在没有对抗情绪的条件下，用含蓄、间接的方式对人的心理或行为产生影响，使其产生与暗示相一致的结果。它是一种偷天换日的心理战术，能够非常奇妙地影响人的心理。比如，你感觉身体有一点不舒服，于是你去了医院。医生进行初步诊断后，皱着眉头，一脸担忧地要你3天后来拿化验报告。那么，这3天中，你很可能会感觉身体更加不舒服了。因为医生当时的表情给了你“情况不乐观”的暗示，使你在潜意识中认为自己得了很严重的病，这种心理表现出也就是身体的不适程度加剧。这就是心理暗示所产生的影响。


    也许你已经注意到了，暗示实际上就是一种特殊的信息传递方式，而这种信息传递方式巧妙地避开了人的心理壁垒，因而能够更加有效。我们知道，人都是有自尊心的，在它的作用下，一旦得知别人想要干涉、控制自己，人就会本能地产生一种抵触，不愿就范。而暗示则以含蓄的方式直接和他人的潜意识进行信息交流，在对方完全没有意识到你的目的的时候，就已经受到了你的影响。由于暗示所带来的是一种潜移默化的影响，完全不会引起对方的抗拒，因此，它的影响往往很强烈。


    著名心理学家多湖辉曾经讲述了这样一个故事：


    有一个男孩想和A成为好朋友，然而A看上去却不太好相处。不过这一点儿也没有难倒这个男孩。他主动靠近年，并且到处和别人说人是他的好朋友，只要有机会，他就会出现在A面前，俨然一副和A是非常要好的朋友的样子，拍拍A的肩膀、递一瓶水给A……即使A的态度有时候很冷漠。慢慢地，男孩与A真的成了很好的朋友。


    这个男孩非常聪明，他巧妙地利用了心理暗示，通过告诉别人他们是好朋友，并且像好朋友一样对待对方，给对方造成了“我和你是好朋友”的心理错觉，进而真正地建立起彼此的友谊。


    在人际交往中，在对方不排斥、不拒绝你的前提之下，你同样可以利用暗示的方法来使你和对方的关系“更上一层楼”。


    首先，你可以用肢体语言暗示对方，你很喜欢他。比如，当他需要鼓励的时候，以微笑给予支持；有意识地拉近彼此的身体距离；毫不吝啬地竖大拇指赞赏对方等。


    再则，你还可以制造一些“亲密假象”来暗示对方：你们已经是很好的朋友了。比如，你想要和初识的人成为朋友，那么，当你碰到对方的时候，试着用熟人的口吻跟他打招呼，他不会以为你很唐突，反而以为你们真的很熟了；又或者，试着用朋友之间的相处方式和他相处，拍拍他的肩膀、请他帮些小忙等。


    此外，你还可以像上面例子中的男孩一样，告诉别人，你和对方是朋友，让别人暗示他，他和你是朋友。


    这样，对方就会像你暗示的那样，把你当成朋友，从而为彼此的关系打开崭新的局面。当然，在暗示对方的过程中，你所采用的方式一定要温和。要用春风化雨的方式，不能突兀、躁进，一旦引起对方的心理排斥，暗示就很难再起到什么积极效果。


    恰当地运用心理暗示，你的社交之旅将会变得通畅无阻。


    ## 4. 慎重地选择朋友


    “近朱者赤，近墨者黑”。一个人生活在什么样的环境中，与什么样的朋友交往，会直接影响到他的一生。可以毫不夸张地说，交上什么样的朋友就会有什么样的命运。在心理学上，这种现象被称为“链状效应”，它是指人在成长过程中会受到周围人的影响，在不知不觉间被周围人同化。


    其实，从很早的时候，人们就已经意识到了身边的朋友带来的影响会是多么巨大。“孟母三迁，择邻而居”的故事广为流传着。


    孟子小时候和母亲一起住在离墓地很近的地方，由于附近的小孩们经常见到人家办丧事的情形，于是就一起将办丧事当成游戏来玩。当然，孟子也会和他们一起玩。孟子的母亲见了，就忧心忡忡地想，身边竟然没有一个懂事明理的朋友，这可不利于孩子的成长。于是，就把家搬到了集市旁边，希望儿子能够受到城里人好的影响。谁知邻家的小孩是一个纨绔子弟，好逸恶劳、不思进取，最糟糕的是孟子还和他成了朋友。为了避免儿子受到负面影响，孟母不顾自己年老多病、搬迁不易等因素，毅然将家搬到了学堂旁。就这样，在刻苦读书的朋友影响下，孟子也发奋读书，终成一代名家。


    古人把“慎交友”作为修养的重要方面。“与善人交，如入芝兰之室，久而不闻其香；与不善人交，如入鲍鱼之肆，久而不闻其臭”。而“与恶人交，如雪入墨池，虽融为水，其色愈黑”。作家克雷洛夫也曾告诫过人们：“选择朋友一定要慎重，好坏并没有那么容易识别。那些自私自利的人会披上假面具，却又设好陷阱来坑你。”换句话
    就是，选择朋友的时候一定要慎重，不要和品行卑劣的人交朋友，要多和品行高洁的人交往，以成功人士为师为友。


    避免和恶人交往就是避免灾祸，就是避免自己消极地受坏影响。聪明人都会竭力与那些会给自己带来不良影响的人划清界限。在现实生活中，有几种情况是应该注意的：


    1. 不与经常吃喝的人交往。整天乞喝玩乐的人绝对不是好的朋友人选。酒多则误事，肉多则生火。如果人与人的关系只靠酒肉来维系，那么情谊短暂、脆弱不说，人的意志也会被酒肉消磨殆尽。

    2. 不与名声不好的人交往。有人说，想知道一个人是怎样的人，看他身边的朋友就知道了。与品德高尚的人在一起，人家都会高看你一眼；成天与不务正业、品德低下的人为伍，别人就容易也把你看成是品德低劣的人，甚至鄙视和唾弃你。两害相权，不要接近令你黯然失色的人，而要和那些能够映衬你风采的人为伴。

    3. 少与素质低的人交往。所谓素质低的人是指那些志趣庸俗无聊、心态消沉的人，那些苛刻挑剔的人，那些背信弃义的人，那些猥琐、虚伪或自私自利的人，以及那些总是自以为是、不可一世、作威作福的人。


    要明白，枝头上的果实之所以甘甜可口、色香诱人，是因为它们从树干上吸收了充足的营养。同样，人也要从别人那里汲取营养，学习他人的长处，才可以完善自我、强大自我。所以，人要善于结交那些优秀的人，并且多和他们来往，从而为自己创造一个良好的生存、学习环境，让自己吸收更多的精神养料，为自己的前程奠定基础。


    与心态稳定、能和人愉快相处、理想高远、热情而满怀生活希望的人交往，你会受到他们潜移默化的影响，也变成像他们一样优秀的人；与那些具有伟大人格、意志坚强的人相处，会挖掘出你身上存在的许多潜能，使你和他们一样拥有创造奇迹的能力……总之，和卓越的人交往，可以使你在人格、精神、品行、学问和道德上都大获裨益。


    ## 5. 给予对方理解，是对人际关系最好的维系


    世界上没有完全契合的两个人。人的性格迥异，或内向，或外向；或沉稳，或开朗；或开拓进取，或畏缩不前；每个人的家庭背景不同、受教育程度不同。任何两个人相处，都难免会有意见分歧，难免有对方的做法不合自己心意、让自己不舒服的时候。这也正是彼此间的情谊接受考验的时候。


    在这样的磨合阶段，要想维系好彼此间的关系，最有效的方法就是给予对方充分的理解。然而，理解对方却并不是一件容易的事情。


    心理学上有一个著名的“投射效应”，说的是人会把自己的思想、态度、愿望、情绪或特性等不自觉地反映于外界事物或他人。这是一种人类行为的深层动力，个体本身并不能意识到。


    生活中的投射效应主要表现在：人们往往会凭借自身的主观想法去推及外界的事实，不自觉地把自已的心理特征归属到他人身上，认为他人也具有与自己相同的特征。这就是人与人之间的理解为什么那么难的原因所在。有人讲过这样一个故事：


    一对在一起生活了40年的夫妇，只要哪顿饭有鱼，妻子就会把鱼头夹到丈夫的碗里。有一次，丈夫实在受不了了，说“我不知道为什么每次吃鱼的时候你都把鱼头给我。这么多年了，我一直想告诉你，我不爱吃鱼头。”妻子愣住了，原来丈夫并不爱吃鱼头。只因为自己爱吃鱼头，所以她也由己推人，以为丈夫也必定爱吃，因此，这么多年来，她始终把自己最爱吃的鱼头夹到丈夫的饭碗里。


    显然，这位妻子把自己的心理特征归属到了丈夫身上，认为自己喜欢的丈夫必定也喜欢自己讨厌的丈夫必定也讨厌，以致使“爱吃鱼头”的误会持续了几十年。


    其实，每个人对生命的体验都会构成一个现象场，人们以它为参照“坐标系”去认识世界。由于每个人的生命体验不同，所形成的现象场、坐标系自然也就不同。然而，我们却习惯以自己的坐标体系为标准，去推测、揣摩、评价甚至抨击另一个人，却根本没有意识到，一开始自己所选的参照物就是不对的。试问，这样我们怎么有可能正确客观地认识他人、理解他人？


    对事物的认识也是一样的，由于彼此的坐标体系不同，因此各人的认识也就不同，也因此产生了意见分歧。


    在与人交往的过程中，理解和接受彼此的感受是人际关系和谐的关键。然而，由于坐标系不同，真正理解对方并不是一件容易的事情。要想理解对方，就必须试着放下自己的坐标体系，尝试着进入对方的坐标体系。这是我们和他人之间达成理解的唯一途径。


    生活中，经常出现“他不理解我”、“我无法理解他”的局面，这是因为人们总是凭借自己的主观意愿去认识对方，总是想随心所欲地和对方相处。人们必须明白，自己对对方的看法并不一定就是事实。也就是说，要想理解他人，首先要做的就是抛弃“自己眼中的就是事实”的想法，然后试着从对方的角度看待问题。具体地说，可以在以下3方面做出努力：


    1. 用询问代替揣测。很多人都以为自己和对方关系很亲近，足够了解对方了。这类人总说“他不用开口我就知道他想说什么了”之类的话。的确，也许，他和对方已经是多年的老朋友了，由于长年累月地相处，习惯了对方的行为模式，是有可能达到这样的效果的。然而，他真地了解对方对每件事的心理感受吗？大多数时候，人们只是把自身的内心感受投射到对方身上，而没有真正了解对方的感受。

    因此，从此刻开始，停止自以为是的揣测，学着询问对方的感受，问问对方的真实想法。

    2. 用沟通代替评价。在坐标体系中，人们将自己置于中心，把自己看作唯一主体，会不由自主地把其他人都放在自己的坐标体系上，去分析别人、评价别人，以保持这个体系的平衡和稳定，让自己获得安全感和稳定感。然而，在对方的坐标体系中，我们是没有评价资格的。这样，两个坐标系之间就难免有矛盾产生。要想避免这种矛盾，就必须用沟通代替评价，这样不仅能平衡自己的坐标系，而且能平衡彼此坐标系的关系。

    3. 多倾听、少出主意。当对方一说到“问题”时，我们就赶想在第一时间提建议、出主意，忙着为对方“解决问题”。虽然这是出于关心，但是很多时候却让对方更加郁闷，因为对方需要的或许并不是我们的建议和主意，而只是希望通过诉说来宣泄情绪。这时，倾听绝对是最明智的做法，出主意只会严重妨碍理解的达成。


    总之，在与人相处的过程中，千万不要拿自己的尺子来要求对方，要学会放下自我偏见，试着从对方的角度看问题，用对方的坐标系来看世界，这样自然就能达成理解了。


    ## 6. 适度保持距离


    有一群刺猬，在冬天想用大家的体温来御寒，因而紧紧靠在一起，但彼此又觉得刺得疼痛，于是立刻离开。然而温暖的需要再次使它们靠近，却又吃了同样的苦头。它们在这两难中终于发现了彼此之间的适宜间隔，依此距离，它们能够过得最平安。


    在生活中，我们每个人就像“过冬的刺猬”一样，需要彼此交往、彼此靠近，但需要一个个人空间。这个个人空间在一般情况下是不容侵犯的。心理学家们将这种现象为“刺猬效应”。


    社会交往中，人与人之间需要保持一定的距离。美国学者研究认为，46-61cm是人的私人空间，女人或男人可以安然地待在私人空间内；70-92cm之内的空间最适合讨论；和非亲密朋友交谈，较佳空间距离是213-366cm，这也是与普通朋友交谈的适当距离，小于此距离，对方会觉得你盛气凌人，大于此距离，对方会觉得你没礼貌；与同事或领导讨论公事，最佳的空间距离为122-213cm，大于这个距离，对方会误认为你态度不认真，小于这个距离，对方会觉得你有逼迫之意；当你与爱人约会的时候，和他（她）之间的距离最好不要超过46cm，否则他（她）会觉得受到了你的冷淡，可能引起误会。


    当然，最佳距离的多少还与交往者的文化背景有关。如果与一位美国人交谈，距离不得小于60cm，否则他会觉得你不友好；如果

