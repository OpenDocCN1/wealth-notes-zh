    与一名阿拉伯人交谈，就要小于 60cm，否则他也会觉得你不友好，可能会出现他不断向你靠近以示友好而你则不断后退的有趣场面。


    一般情况下，人们越亲密、越友好，他们就站得越近；陌生人有可能站得较远一些。但如果一个人想和对方交朋友，他也会在谈话时离对方近一些。如果他讨厌对方，那他很有可能会无意识地向后挪一挪。虽然很少有人会注意个人空间问题，但我们可以通过站得远近来判断两个人关系的亲密程度。尽管有的时候我们会靠得很近，但大多数时候还是喜欢有一定的空间距离。


    人都是相互需要的，同时也相互利用着，保持距离才能产生安全感。距离是一种人际学问，在小小的办公室里，接触最多的就是同事，慢慢靠近是必然的，产生感情也是很正常的，但是一定要很好地掌握这种感情。


    大学毕业那年，丁小洁为了证明自己，只身去了一个离学校很远的城市。初来乍到的她不认识任何人，走到哪里都觉得陌生，没有人可以谈心，没有人跟她一起分担离家的苦。满怀的热情遭遇了冬天的寒冷，整个人像被冰封了。


    华美是办公室里第一个冲她微笑的人。她们从每天只简单打一个招呼，到对某些公共事物发表极其相近的个人看法，然后，话题逐步涉及办公室内外的其他种种，华美让她感觉到与人交往的温暖。


    她们的共同话题越来越多，共同的活动也越来越多，工作日一起上班，周末的时候一起逛街，那段时间里，两个人几乎是形影不离，形同姐妹。


    但很快，她们就发现对方有许多自己不能容忍的性格特点。开始的时候，彼此还在相互包容着、忍耐着，最后终于爆发了。相互说着刺痛对方的话，因为相知得深，所以相互伤害也深，直到有一天，她们从这种相互牵制的关系中决然而又不舍地退出。


    我们每个人都有自己习惯的生活空间，如座位、床位、办公桌……不喜欢被别人侵占，有时即使最好的朋友，我们也会在潜意识里感觉别扭。因此，无论彼此怎样亲密，都应保留一定距离，为对方也为自己留出一点呼吸空间，这样更有利于彼此关系的长久维系。


    ## 7. 别陷入说者无心听者有意的窘境


    很多人都有过被别人的“无心之言”刺伤的经历，在别人看来是平平常常的一句话，却在我们心里激起了千层浪，让我们不痛快。这种旁人一句“无心之言”却弄得我们如此“不得意”的现象，在心理学上被称为“瀑布效应”，即发出信息的人心理比较平静，但收到信息的人却被弄得心理失衡，进而导致态度行为的变化，就如同大自然中的瀑布一样，上面平平静静，下面却浪花飞溅。


    《史记》记载了这样一个故事：


    平原君赵胜的邻居是个跛子。一天，平原君的小妾在阁楼上，见到邻居一瘸一拐地在井台上打水，觉得他的姿态很滑稽可笑，就大声地笑了起来。


    邻居当场心生不忿，心想：我一个堂堂七尺男儿，虽然腿瘸了，但岂是你一个低贱的妾室能够取笑的，要是不讨回公道，我就妄作了几十年的人了。


    于是，他找到赵胜，将事情告诉了赵胜，并要求他杀了这个小妾，还自己公道。赵胜觉得又不是什么大事，因此有几分犹豫。邻居见状，立即说道：“世人都说，平原君礼贤下士而鄙贱女色，所以，天下英雄都不远千里来投奔您。我虽然有残疾，但好歹也算一个士子。今天你为了一个小妾而不肯替我主持公道，如此爱色贱士，天下人会怎么说你？以后还有谁肯为你效命？”


    听完这番话，赵胜顿感事情严重。他立刻回到家中，毅然杀了那个行事没有分寸的小妾，并亲自登门向邻居道歉。


    看完这个故事，我们在钦佩赵胜尊重人才的同时，不妨也好好反省一下，自己在人际交往中有没有犯那个小妾那样的错误。


    生活中，因为说话没有分寸，一句自己认为无所谓的话，却得罪了别人、破坏了彼此的关系，甚至为自己树敌、丢了性命的事情屡见不鲜。


    三国时，称霸一方的刘备是个“少须眉”的形象。在古代，胡子和眉毛稀少的男子被认为是“脂粉味”重，缺少男子汉气概。刘备刚到西蜀时，曾被刘璋手下胡须茂盛的张裕取笑嘴上没毛，虽然他当时并没有发作，但心里十分恼火。


    后来，他赶跑了刘璋，成为张裕的主子，终于找了个借口把张裕杀了。


    张裕口无遮拦、说话没有分寸，最终丢掉了自己的性命。由此可见，“慎言”是一件多么重要的事情。


    如果我们想在社交场合中成为一个受欢迎的人，就必须时刻提醒自己，不要犯无心伤人的错误，避免自己的一句闲话引起强烈的“瀑布心理效应”。对此，我们可以从两方面来努力。


    ### 1. 说话要有所避讳


    每个人都有自己的禁忌，这些禁忌我们也可以称之为“雷区”，往往是谁踩就炸谁。因此，在与人交往的过程中，我们一定要有所避讳，这是对他人的一种尊重，有利于人际关系的发展。一般来说，以下这些内容是不能碰的：


    - **隐私。** 无论是自己的还是别人的隐私都是不宜多说的。固然，适当地谈自己的隐私，可以拉近距离，但过了头就会引起对方反感，认为你是没有分寸的人；而别人的隐私更是碰不得，既然是隐私当然要保密。

    - **他人的痛处。** 一般来说，他人的痛处包括耻辱之点、失意之处、痛悔之事三方面。对于对方来说，这些都是讳莫如深的，一旦听到有人提及类似的情况，就会如针刺在背般的痛苦。这样，对方就会对让他感到不快的你产生反感。

    - **有争议的话题。** 具有争议性的话题很容易引起彼此在观点上的对立，进而给彼此的交往带来不良影响。

    - **对他人有评价。** 那些对人的负面评价很容易传到被评价者的耳朵里，没有人会喜欢一个背后说自己坏话的人；即使评价是正面的，也很可能会在传播过程中走了样，给被评价人造成不必要的伤害，也为彼此的人际交往留下阴影。


    ### 2. 拿捏好分寸


    避开了“雷区”，接下来让我们来看看，在与人进行语言交流的过程中如何拿捏好分寸，让我们彻底从“瀑布效应”的包围圈中解脱出来。要想说话不失分寸，除了提高自己的文化素养和思想修养外，我们还必须注意以下几点：


    - 要尊重客观事实，不要夸大或忽视客观事实，这样才能赢得人心，给人以可以信任的印象。

    - 要认清自己的身份，明白自己什么话可以说，什么话不能说。比如，作为晚辈，就不能对长辈轻言批评。

    - 控制自己的情绪。在社交场合，温文尔雅的待人接物方式是普遍被认可的。情绪失控、过于兴奋或过于愤怒都是不好的。过于兴奋会口出妄言，过于愤怒会口不择言、伤害他人。

    - 注意语言的民族和地域差异。由于不同民族和地域存在不同的文化差异，某些民族和地区的人有其特有的禁忌，因此，要注意这种差异，千万不要因一时不察而得罪了对方。

    - 善意很重要。所谓善意，就是与人为善。切记，说话的目的是向对方传递信息，以期在彼此间建立良好的人际关系，而不是惹是生非。


    俗话说“良言一句三冬暖，恶语伤人六月寒”。在人际交往中，一定要“慎言”、“善言”，千万不要落入“瀑布效应”的误区，这样才能让交往在和谐愉快的氛围中进行，进而使彼此感情升温。


    ## 8. 有了坏消息该如何传达


    生活中，每个人都难免碰到不得不向他人传递一些坏消息的时候。这时，一旦传递不好，难免会被对方迁怒。那么，应该怎样才能使自己免于陷入这种人际困境之中呢？


    其实，只要用对了传达的方式，不管传递什么噩耗，都不会使你被人迁怒。


    听到某信息之后，对方会作何理解，产生何种感受，接下来会有什么样的言行反应，这一切的关键就在于传递过程中你所使用的语言。要知道，语言的影响力是不可估量的。


    优秀的推销员往往会请求你“批准这份文件”，而不会说“签合同”，因为他们知道“签合同”的说法会加重人的心理负担，让人谨慎，而“批准这份文件”不但有恭维的意味，而且能让人将签署文件看成是一件再平常不过的事情，进而很容易签上自己的大名。


    还有，那些政客们也深深懂得和明白言语对人的态度、行为的影响力有多么巨大，因此，他们将“战争”称作“军事行动”，将“百姓的财产被摧毁”称作“附带的损失”，将“死亡”说成是“事故”……


    说法不一样了，人们对同一件事情的接受程度也会不一样。语言之所以能改变人们对现实的看法，是因为人们是透过语言文字来与世界沟通的。换句话说，语言是思维的基础，而思维延伸出感情。


    选择适当的字眼，能够大大降低人们对某种负面情况的消极反应。那么，什么样的字眼才算是“适当”的呢？


    ### 1. 避免使用刺耳字眼


    一般来说，刺耳的、具有强烈负面含义的字眼千万不要使用。人们对于这些字眼往往具有某种程度的条件反射。比如，人们听到“签合同”的字眼，心理上就会反射性地产生一种抵触，因为在人的潜意识中，“签合同”等同于“重大责任”，这样就难免一听到这个字眼就跳起来拒绝。


    相反，如果使用温和的、循序渐进的、积极的字眼，会让人更容易接受，比如，将“死亡”说成是“去天堂”，将“签合同”说成是“批准文件”等。这类字眼可以使对方对信息加工、内化的速度放慢，降低信息的冲击力，有利于对方接受信息。


    ### 2. 描述事件为暂时、独立且无关紧要


    在向他/她传递坏信息的时候，要尽量将事件描述成暂时的、独立的、无关紧要的。


    心理学家指出，当人面对某种境况的时候，如果产生消极认知信念，其焦虑、沮丧、愤怒的程度往往会大大提高，进而将这些负面情绪转嫁到他人身上。这里所说的消极认知信念主要包括
    3 个方面：


    - 认为自己所面对的不良处境会一直持续下去；

    - 片面地抬高了事件的重要程度；

    - 扩大了事件的波及范围，认为此事会给自己生活的其他领域带来消极影响。


    因此，在向他人传递坏消息的过程中，如果你能通过语言描述，让事件呈现出暂时、独立、无关紧要的特征，通常能够将事件对对方产生的负面影响降到最低。比如，你要告诉一位母亲，她儿子又在学校闯祸了，老师请她去一趟。如果你说“你家孩子又在学校闯祸了，好像挺严重的，老师说：‘这么小就这样，长大了还不知道成什么样，请你务必去一趟。’”这样势必会引起对方的反感。因为，事情通过你的描述已经变成极其严重的事情，它会影响孩子未来，好像孩子从今以后就是这个样子了。而如果你说“你家的鬼精灵又在学校里淘气了，老师请你去一趟，想和你沟通一下，看看什么样的教育方式对孩子更有利。”这样，将事件独立起来，并且给对方以好的希望，自然会引起对方的反感。（注：原文此处逻辑似有矛盾，按原文保留“自然会引起对方的反感”或理解为“消除”之意，依OCR原文修正为通顺语境，此处依原文保留句式，但根据上下文逻辑，原文可能是“自然就不会引起对方的反感”，但根据任务要求不删减不总结，仅纠正OCR错误，原文此处“自然会引起对方的反感”可能是OCR误识，结合上下文应为“自然就不会”或原文笔误，暂按原文字形修正为通顺，若原文确为“引起”，则保留。仔细校对原文：“...自然会引起对方的反感。”
