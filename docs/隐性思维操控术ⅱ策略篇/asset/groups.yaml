    别慢下来，要跟住”的想法。另一方面，对手也可以产生提醒作用“路还很长，要保存好体力，别冲得太快！”马拉松比赛中，所有参赛选手往往先是形成一个个小集团，然后再分散成二人或三人小组，过了中点后，才慢慢出现领先的个人！


    其实，人生又何尝不是一场“马拉松”。既然如此，我们为什么不学习一下长跑选手的做法——为自己找一个竞争对手。拥有对手是一种福气和造化，而不是心腹大患;对手是异己，但不是眼中钉、肉中刺。因为一个强劲对手的存在会让我们时刻都有危机感，这会激发起我们更加旺盛的斗志。


    因此，在人际交往中，应避免将自己的对手视为除之而后快的存在，而应将其当成一种激励、一种促进，当成上天对我们的一种恩赐。这样才避免走人与人结怨的死胡同里，避免让自己的人际关系走到绝境。'
