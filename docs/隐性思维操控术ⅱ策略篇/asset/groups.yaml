    # 5.用断定性的语言来说服对方


    论起说服他人的本事，这方面的佼佼者非雄辩家们莫属了。不过雄辩家有许多不同的类型，其中，以政治家为代表的“自信类型”是最具典型意义的。他们说话时总是表现出一副无比自信、笃定的样子，仿佛这个世界根本就没有他们所能控制的事情。


    其实许多人都知道，真理只有一个，而雄辩家们所说的未必就是真理。然而，当他们在众人面前满怀自信侃侃而谈的时候，人们总是容易被他们那种无比确定的样子所征服，愿意去相信他们说的就是真理。那么，为什么他们总是能让人相信他们所传递的信息就是真实的、甚至是不容置疑的呢？为什么他们就能够让人心悦诚服呢？


    如果你留意一下他们的语言就会发现，他们高频率地使用了诸如“绝对”、“肯定”、“百分之百”、“全”、“总”、“都”之类的完全肯定或者完全否定的、立场非常鲜明的断言。他们在说服他人时，总说：“我一定会把我说过的事情都付诸实践的。”“我绝对值得你们信赖！”“我向上帝起誓……”等断定性的言论。


    一般人听到这种言论的时候，尽管会理智地告诉自己，“凡事不能这样简单地断定”，但又会怀有一种“万一他说的是真的呢？不然他怎么这么肯定呢”的侥幸而继续听下去，也就等于给了对方继续说服自己的机会，而从对方那里获取的信息越多，被说服的可能性就越大。'
  - '[PAGE 194]


    与那些不确定的信息相比，利用全盘肯定或者全盘否定表达出来的确定性信息所体现的说服力和感染力要强得多。


    回想一下2008年汶川大地震时各大媒体的宣传，几乎所有的媒体都使用了“全坏”、“全灭”、“全烧”之类的断定性的语言，给人以强烈的心理震撼，进而说服人们捐款。而那些“部分地区崩坏”、“部分人员伤亡”之类的语言，在给人心理造成影响的强烈程度和信息确切度方面都大不如确定性的语言。


    一位老师对一个心理素质比较差的考生说一句话：“你绝对没问题的，一定能够考好。加油！”这种断定性的语言往往能够有效地消除对方心里的不安，给予对方勇气，从而使学生发挥正常的水平而通过考试。相反，如果你对他说：“你应该能够考好吧，即使没有百分之百的把握，也请加油吧！”这样，不但不能说服对方、使对方充满自信，而且有可能使对方产生“老师都这样说了，看来，我真的是考不好了……”的疑虑，进而加重心理负担，导致考试失败。


    由此可见，利用断定性的语言向对方传递信息，往往能够征服对方的潜意识，进而在不知不觉中说服对方。因此，当你想要说服他人的时候，不妨适当地运用一些确定性的词语，即使是不确定的信息，也要用断定性的语言来传达。'
  - '[PAGE 195]


    # ## 6.用对方的心理定势说服对方


    世界著名的心理催眠专家米尔顿·埃米尔松在对人进行催眠的时候，常准备很多对方肯定会回答为“是”的问题，然后依次问对方这些问题，通过让对方不断地回答“是”，人为地让对方形成一种对任何问题都回答“是”的心理定势，进而达到心理催眠的效果。


    在心理学上有个非常著名的原理叫做“刻板印象原理”，指的是，一个人在一定的时间内所形成的一种具有一定倾向性的心理趋势会影响他随后的思维方式和言行举止。即一个人在其已有经验的影响下，心理上通常会对某一特定活动处于一种准备的状态，从而使其认识问题、解决问题带有一定的倾向性与专注性。


    刻板印象原理无时无刻不在影响着人的思想和行为。前苏联心理学家曾做过这样一个关于“刻板印象”的实验：


    心理学家把同一张照片出示给参加实验的两组大学生看。不过，心理学家事先告诉第一组的学生：照片上的人是一个怙恶不悛的罪犯；告诉第二组的学生：照片上的人是一位伟大的科学家。最后，心理学家让这两组学生分别用文字来对照片上这个人的相貌进行描述。结果，第一组学生描述道：此人深陷的双眼表明其内心充满了仇恨，突出的下巴昭示着他沿着犯罪的道路越走越远的内心……第二组学生描述道：此人深陷的双眸表明其思想的深度，突出的下巴表明他在求知的道路上不畏艰难险阻的意志……'
  - '[PAGE 196]


    同一个人，之所以会得到如此截然不同的评价，仅仅是因为评价者之前得到的关于此人身份的提示有区别，一开始产生了反感，后来就很难认同；一开始认同，往往就会一直认同。


    在人际交往中，如果能够巧妙利用人的心理定势，就可以非常简单 地让他人点头称“是”，对你心悦诚服。


    “今天的天气真不错啊！”


    “是啊!”


    “夫人和孩子也都好吧？”


    “是的，很好。”


    “今年是你的本命年吧?


    “是的，我是属羊。”


    ……


    让对方不断地同意你的意见，制造对方“同意”的心理定势，最后，引人正题，对方往往也会同意。


    或许有人会怀疑，这个简单得类似于哄小孩子的策略真的能够奏效吗? 的，这个策略虽然简单，但的确非常有效。


    几乎每个人都有过这样的心理经历: 用“不”来拒绝对方，并不能让自己心情愉悦，甚至有时会产生不愉快的感觉；相反，表示同意的肯定性回答往往会给自己带来愉快轻松的感觉。也就是说，对人'
  - '[PAGE 197]


    来说，同意是自然的态度，而反对要比同意困难。再加上心理定势对“同意态度的强化”，人在连续地同意了一连串事情之后，要突然扭转态度是非常困难的。


    再则，人天生有一种使自己的言行或者态度前后保持一致的需求，如果产生了不一致，就会造成心理不适。


    因此，通过制造对方“同意”的心理定势来使对方心悦诚服，是切实可行的说服策略。在与人交往的过程中，先就一些对方肯定会表示同意的事情取得对方的同意态度，使对方形成心理定势，最后再道出正题，往往就会避免双方的许多意见分歧，使彼此在最短时间内达成共识。'
  - '[PAGE 198]


    # 7.激发对方的好奇心,让他甘愿被说服


    生活中，当一个人固执的时候，要想说服他是非常困难的。因为，当一个人固执的时候，其心理往往处于一种紧张、封闭的状态，如果硬碰硬地劝说对方，十有八九是会碰钉子的。相反，巧妙地制造悬念，引发对方的好奇心，转移对方的注意力，从而缓和对方紧张、抗拒的情绪，然后再说服对方，则相对容易很多。


    战国时，齐国宰相田婴想要在自己的领地内筑城，他的这个想法遭到了几乎所有门客的反对。门客们认为，实施筑城计划会引起田婴和齐国王室的摩擦，而这很可能导致田婴失去政治权利。然而，田婴却固执己见。


    一时之间，门客们不断地向田婴进言，希望能改变他的主意。面对他人千虑一得般的反对，田婴觉得烦不胜烦，不想再听到任何人的劝说，于是，他就对看门的仆役说：“如果再有门客登门造访，一定不要让他们进来。”


    果然，又来了一位门客，这位门客苦苦地向仆役恳求，仍然不得其门而入。无奈之下，他只得在门外大声地喊：“我只说三个字，多一个字，我都愿受刀斧而死。”听他这样说，田婴破例接见了他。这位门客果然只对田婴说了“海”、“大”、“鱼”三个字，说完后，他毫不停留，转身就走。


    他这一走，真让田婴如蒙一头雾水，怎么想也不明白这位门客'
  - '[PAGE 199]


    到底想要说什么。于是，他主动叫住那位门客，问道：“你到底想说什么？把话说完不然我会被你憋死。”


    这位门客回答道：“海里的大鱼很厉害，能够将钓住它的鱼线挣断，也能将捕捉它的渔网挣破，让人很难捉到它。然而，像这样厉害的大鱼，如果想离开水，到更加广阔的天空里去畅游，恐怕会被渴死。齐国对你而言，不正像水之于大鱼吗？你筑城池是为了摆脱国王的束缚，拥有更加广阔的天空，但是同时，你也会失去国王的有力支持，进而失败。”


    最后，田婴终于被这番话打动，打消了筑城的念头。


    的确，通过制造悬念或者新奇的话题勾起对方的好奇心，一方面能够使对方放松心里戒备，另一方面可以吸引对方的注意力，让对方用心地听你说，这些无疑是成功说服对方的前提。更重要的是，由于勾起了对方的兴趣，说服会变得更加容易。


    亚历山大・克雷厄姆・贝尔是享誉世界的科学家，因为他发明了电话机。然而，一切的科学研究都是需要经费的。有一次，他为了研究复音电唱机的事情而来到朋友哈伯特家，希望哈伯特能够赞助他正在进行的研究。那么他是不是像现在很多拉赞助那样，带了一大堆项目说明、调研分析、可行性报告，然后直言自己的项目多么多么有价值、多么多么好呢？显然，贝尔没有这样做。


    一开始，贝尔只是在弹钢琴，而哈伯特在旁边看书，一切都惬意'
  - '[PAGE 200]


    意极了。然而，贝尔突然停止了弹奏，扭头问正在看书的哈伯特：“你相信吗？我只需要把这脚踏板按下去，就能够让钢琴唱我唱的音，我唱什么，钢琴就会唱什么。”


    “钢琴会复唱”，这奇怪的事情勾起了哈伯特的好奇心，于是他放下手中的书，兴致勃勃地问贝尔：“哦？你怎么能够做到呢？”接下来，贝尔顺理成章地给哈伯特上了一堂有关复音电唱机的原理的专题课，进一步激发哈伯特对这种研究中的电唱机的兴趣。结果，哈伯特为了能够尽早看到这种新奇的机器而主动提供了资助。


    其实，贝尔说服哈伯特赞助之所以能够成功，关键就在于他没有一开始就直言自己的来意，而是利用对方的好奇心来激发对方的兴趣，然后再一步步进入正题。人有可能会拒绝别人，但是不会拒绝自己。为了满足自己的好奇心，为了让自己的兴趣得偿所愿，哈伯特自然不会提供资助。


    在说服他人的过程中，如果你能够成功地引起对方的兴趣，那么，你就已经成功了一半了。'
  - '[PAGE 201]


    # 8.投其所好，使说服对方的可能性最大化


    人的情感可以分为积极情感和消极情感两大类，积极情感包括喜欢、愉悦、兴奋等，消极情感则是指讨厌、憎恶、气愤等。心理学研究表明，积极情感能够引发理解、接纳、合作的行为效果；而消极的情感则会让人对外界产生排斥和拒绝。也就是说，当对方处于积极情感状态的时候，往往更容易相信你所说的是对的，进而按照你的意见行事；反之，如果对方处于消极情感状态，那么，你想要直接说服对方就是一件非常困难的事情。


    由此可见，最大限度地引导、激发对方的积极情感，能够使说服对方的可能性更大。而“投其所好”就是一个引导和激发对方积极情感的过程。在这个过程中，能够采用的方式是多种多样的，下面介绍的是最为典型和有效的做法。


    首先，你要通过观察，发现对方的“闪光点”，并对之加以赞扬，使对方的心情更加愉悦。


    一个让人难以忍受的大热天，一位教授走进一家餐厅就餐。不知是由于天热还是别的什么原因，餐厅里服务人员的态度并不是很好。然而，这位教授并没有像大多数人一样和服务人员理论其态度问题。为了获得对方良好的服务，这位教授像闲话家常一样对服务员说今天的天气真热啊，可是你们还要为客人服务，还要站在炉边做菜，一定够辛苦的，真是难为你们了。'
  - '[PAGE 202]


    这位教授巧妙、准确地赞扬了餐厅服务人员的可贵之处—在如此炎热的天气里，仍然坚守岗位为大家服务。教授的话使他们感到自己是被人关注和关心着的，从而产生了积极的情感体验，接下来，心情愉悦，服务自然也就周到到了。


    在你赞赏了对方的“闪光点”，在对方紧张、严密的心理保护网上撕开突破口以后，你还需要让对方接受你。因为，只有当对方接受了你以后，才有可能接受你的观点和见解。那么，怎样才能使对方接受你呢？答案就是：找到对方的“兴趣点”，并通过谈论对方感兴趣的话题，让对方接受你。


    面包商杜维诺一直试图让自己的面包卖给纽约国际饭店。4年内，他经常打电话给饭店主管这件事情的经理，并且只要是该经理参加的社交聚会，他都不可能参加，他甚至为此在饭店内预订了房间。令人遗憾的是，他都失败了。


    在研究了人的社交心理以后，杜维诺改变了策略，他决定找到经理的兴趣点，然后投其所好。


    他打听到这位经理是“美国旅馆招待委员会”组织的一员，而且还当选过该组织和“国际招待者协会”的主席。


    于是，杜维诺再次见到经理的时候，就和他说有关招待者协会的话题。出乎意料地，原本对杜维诺十分冷淡的经理一下子就打开了话匣子，反应异乎寻常的热情。在杜维诺要离开的时候，这位经'
  - '[PAGE 203]


    理成了杜维诺参加该协会的推荐人，而杜维诺只字未谈有关面包销售的事情。


    几天后，饭店经理主动打电话要杜维诺送面包样品过去。4 年的努力未成，一朝“投其所好”的交谈却得手了。由此可见，投其所好能够获得对方的好感，而当对方对你好感十足的时候，要他答应你的要求也就是水到渠成的事情了。


    了解对方的兴趣，针对对方感兴趣的话题交谈，能够在不知不觉中与对方建立起感情，使对方接纳你。这样，就为进一步说服对方创造了最有利的条件。'
  - '[PAGE 204]


    # **9.借助权威的力量来说服对方**


    著名空军将领乌扎尔·恩特和自己的副驾驶员合作多年，一直都很合拍。然而，在一次飞行任务前，副驾驶员生病了，于是，这次他只得和一名替补搭档合作。


    在起飞过程中，恩特哼起歌来，并且他的头也随着节拍一点一点地打起了拍子。糟糕的是，这位替补并不明白恩特只是在享受音乐，误以为恩特是要他把飞机升起来。虽然这个替补清楚地知道飞机还远远没有达到可以起飞的速度，但他还是把操纵杆推了上去。


    结果飞机的腹部与地面相撞，螺旋桨的一个叶片插入恩特的背部，导致恩特终生截瘫。


    事后，调查员在了解事故情况时问那个替补副驾驶员：“既然你知道飞机还不能起飞，为什么仍然把操纵杆推上去了呢？”替补的回答是：“我以为将军要我这么做。要知道，他是这方面的权威人物，我应该听他的。”


    其实，类似的事故在航空界屡见不鲜。明明机长所犯的错误十分明显，但飞行员们却没有针对这个错误采取任何行动，最终导致飞行事故的发生。这种现象由于其多发性而甚至具有专有的名字——“机长综合症”。


    “机长综合症”的发生是有其固有的心理根源的，那就是人们对权威的信任要远远超出对常人甚至是自己的信任。'
  - '[PAGE 205]


    这种心理是非常普遍的。比如，当人们身体不适去医院就诊的时候，往往会选择专家门诊，即使多花钱、多花时间等也在所不惜；


    一篇医学论文如果是刊登在普通杂志社，人们往往会有所怀疑，然而如果是刊登在联合国的某个刊物上，人们将深信不疑……这种现象说明，权威对人们的影响力是巨大的。防失联V：357607890


    有一个著名的心理学实验证明了权威的力量：


    美国某大学心理系的一堂课上，教授为学生们引荐了一位来宾——世界闻名的化学家施米特博士。


    接着，施米特博士从皮包中拿出一个装有液体的玻璃瓶展示给学生们看，说：“这是我正在研究的一种具有很强的挥发性的物质。”说完，他拔开了瓶塞，在教室里走了一圈，问：“现在你们能够闻到它的味道吗？闻到的学生请举手。”这时，几乎所有的学生都陆续举起了自己的手。


    但是后来，教授告诉学生们：所谓的施米特博士只是本校的一位老师化妆成的。这时，立刻就有学生说：“原来他是装成的，难怪我什么也没有闻到。”而事实上，那瓶液体也的确只是一瓶蒸馏水。


    从这个实验中，可以看出人们对权威简直可以说是到了迷信的地步。因此，当你无法说服对方的时候，不妨借用一下权威的力量。比如说，你想要说服对方采取某种方法，但是对方却非常不以为然。这时，懊恼固然无济于事，而硬碰硬恐怕也只会使事情变得更糟。'
  - '[PAGE 206]


    与其如此，不如告诉对方：“嗯，或许你说得有理，我这里有一些资料，不如我们一起进一步讨论一下。”然后，收集许多支持自己观点的权威性资料，给对方参考。这种方式会比你与对方做口舌之争有效得多。又或者，当你无法说服对方，两人的沟通交流陷入僵局的时候，你可以请被冠以“专家”之名的人向对方阐释相关信息。


    对于权威，大多数人在心理上都有着某种程度的迷信，因此，借用权威的力量往往能够快速而有效地说服他人。所以，如果你自己不够权威，那就学着借助权威吧！'
  - '[PAGE 207]


    # 10.提出的建议要暗合对方的心理


    生活中，真正具有“兼听”美德的人并不多，而且，极有可能你所碰见的是一 个顽固分子，对他人的意见，他根本就当成了“耳旁风”。那么，怎样才能够让对方接受你的意见呢？


    心理学家指出，在人际交往的过程中，“自我”永远是第一位的。也就是说，如果你的建议让对方的自我产生了不适应，对方势必会排斥你的建议。要想让对方接纳你的建议，就要采取迎合对方心理的建议方式。


    +   1. 要动之以“情感”。心理学家认为，人们在做选择决定时，有90%是依赖于情感的。在情感的基础上，才用逻辑加以证明，说明自己的行为多有道理。因此，如果没有唤起对方的情感，只用严格的逻辑和大理理去献计献策，那么，不管你献的那个计策多合乎道理、合乎逻辑，被采纳的可能性都几乎为零。


    所以，你不妨为自己的计谋换张脸，把它们“翻译”成以情感为基调的“谏辞”，以清楚具体的好处把对方的情绪调动起来。


    +   2. 要晓之以“策略”。研究显示，即使你已经唤起了对方的情感，但空泛的建议仍然不足以引起对方的兴趣。因此，要进一步提出具体策略，清楚地阐述行动的具体进程，这样才能让对方认为你的建议是可行的。让对方更接近你给他的“果子”，从而让你的建议更具有诱惑力，更容易被对方所采纳。'
  - '[PAGE 208]


    3. 要诱之以“避祸”。每个人在面对选择、进行决定的时候，都会考虑其得失。如果风险过大，那么他采纳建议的可能性就很小；如果你描述得完全没有风险，对方很可能无法相信，进而拒绝你的建议。因此，你应该坦诚地将可能出现的风险告知对方，并针对“怎样避免消极、不快的后果”提出一些切实可行的措施。


    其实，诱之以“避祸”的方法不仅能够让你的建议更加真实可信，减少对对方的风险的疑虑，而且能够刺激对方的动机。心理学家指出，当人被告知自己正冒着失去某物的危险时，往往会产生更强的动机。


    4. 增强对方对建议的信心。通过上面这一番包装，你的建议已经不存在让对方拒绝的问题了。然而，很多时候，人们之所以拒绝采纳某项建议，并不是因为建议本身，而是因为提建议的人让他们感到不舒服。因此，你仍需要运用以下策略增强对方对建议的信心。


    ① 让他相信“主意是他出的”。对于那些自己出的主意，人们往往会表现得更加积极和满意。所以，即使你想法的产生和对方丝毫没有关系，也要尽量让对方觉得那个主意是他先想出来的，或者你是受了他的启发才想到的。


    ② 让他知道“新主意是他一贯的想法”。人人都有讲究“次序”与“一致性”的先天需求。有意识地提醒对方，这个建议与他的信念、行为以及以前做过的事情是一致的，那么这个建议被采纳的可能性就会更大。'
  - '[PAGE 209]


    ③准备不必 100%，让他明白你“也不是‘百科全书，’”。很多人认为，向人提建议和方案的时候，准备得越周全越好。其实，准备得太过周全，反而会适得其反。


    即便你什么都知道、什么都明白，活脱脱就是一部“百科全书”，可是并没有多少人愿意听百科全书教条式的建议。因此，你不妨将心理学上的“出丑效应”用上一用。在小的、无关紧要的地方表现得不太确定，用一些显得有些语无伦次的短语，比如“这件事我想，嗯，我知道，并且，对，呃，这件事，我晓得......”等，反而能够凸显自己的真实，从而让对方更容易接受。


    ④用你的热忱感染对方。心理学家指出，人的情绪是会传染的。因此，当你“献计”的时候，应该用自己的情绪去感染对方。情绪高涨、充满自信地向对方陈述建议，能让对方最大限度地接受你的建议。


    此外，你在向对方提出建议时，还有一点是必须注意的，就是一定不能将想让对方采纳的心情表现得太过迫切。人都有逆反心理，当你越是想要他去做一件事的时候，他往往不是那么愿意；当你不想他去做，或者他不被允许去做的时候，他往往会更主动地去做。'
  md: "\n## 4. 条理化的语言交流\n\n不要说病句。即使是面对面地说话而非书面表达，病句也会影响对方对信息的接收效率，而且还会给对方留下不自信、没有文化素养的不良印象。\n\
    \n说话要有要点、有重心。有的人喜欢与人寒暄或者东拉西扯，结果到交谈结束的时候也没有把关键的事情说清楚，这就是无效的语言交流。\n\n要三思而后说。缺少理性的思考会影响语言的条理和逻辑，因此，开口前要稍微想一想。\n\
    \n要把握非语言因素。声线要沉稳，语速要适中，肢体语言要适度，太多了会分散对方的注意力。\n\n要多听名人演讲。这可以潜移默化地改变自己的说话条理。\n\n\
    条理化的语言是一笔宝贵的财富，是我们与人进行交流的有效工具。\n\n## 5. 用断定性的语言来说服对方\n\n论起说服他人的本事，这方面的佼佼者非雄辩家们莫属了。不过雄辩家有许多不同的类型，其中，以政治家为代表的“自信类型”是最具典型意义的。他们说话时总是表现出一副无比自信、笃定的样子，仿佛这个世界根本就没有他们所能控制的事情。\n\
    \n其实许多人都知道，真理只有一个，而雄辩家们所说的未必就是真理。然而，当他们在众人面前满怀自信侃侃而谈的时候，人们总是容易被他们那种无比确定的样子所征服，愿意去相信他们说的就是真理。那么，为什么他们总是能让人相信他们所传递的信息就是真实的、甚至是不容置疑的呢？为什么他们就能够让人心悦诚服呢？\n\
    \n如果你留意一下他们的语言就会发现，他们高频率地使用了诸如“绝对”、“肯定”、“百分之百”、“全”、“总”、“都”之类的完全肯定或者完全否定的、立场非常鲜明的断言。他们在说服他人时，总说：“我一定会把我说过的事情都付诸实践的。”“我绝对值得你们信赖！”“我向上帝起誓……”等断定性的言论。\n\
    \n一般人听到这种言论的时候，尽管会理智地告诉自己，“凡事不能这样简单地断定”，但又会怀有一种“万一他说的是真的呢？不然他怎么这么肯定呢”的侥幸而继续听下去，也就等于给了对方继续说服自己的机会，而从对方那里获取的信息越多，被说服的可能性就越大。\n\
    \n与那些不确定的信息相比，利用全盘肯定或者全盘否定表达出来的确定性信息所体现的说服力和感染力要强得多。\n\n回想一下2008年汶川大地震时各大媒体的宣传，几乎所有的媒体都使用了“全坏”、“全灭”、“全烧”之类的断定性的语言，给人以强烈的心理震撼，进而说服人们捐款。而那些“部分地区崩坏”、“部分人员伤亡”之类的语言，在给人心理造成影响的强烈程度和信息确切度方面都大不如确定性的语言。\n\
    \n一位老师对一个心理素质比较差的考生说一句话：“你绝对没问题的，一定能够考好。加油！”这种断定性的语言往往能够有效地消除对方心里的不安，给予对方勇气，从而使学生发挥正常的水平而通过考试。相反，如果你对他说：“你应该能够考好吧，即使没有百分之百的把握，也请加油吧！”这样，不但不能说服对方、使对方充满自信，而且有可能使对方产生“老师都这样说了，看来，我真的是考不好了……”的疑虑，进而加重心理负担，导致考试失败。\n\
    \n由此可见，利用断定性的语言向对方传递信息，往往能够征服对方的潜意识，进而在不知不觉中说服对方。因此，当你想要说服他人的时候，不妨适当地运用一些确定性的词语，即使是不确定的信息，也要用断定性的语言来传达。\n\
    \n## 6. 用对方的心理定势说服对方\n\n世界著名的心理催眠专家米尔顿·埃米尔松在对人进行催眠的时候，常准备很多对方肯定会回答为“是”的问题，然后依次问对方这些问题，通过让对方不断地回答“是”，人为地让对方形成一种对任何问题都回答“是”的心理定势，进而达到心理催眠的效果。\n\
    \n在心理学上有个非常著名的原理叫做“刻板印象原理”，指的是，一个人在一定的时间内所形成的一种具有一定倾向性的心理趋势会影响他随后的思维方式和言行举止。即一个人在其已有经验的影响下，心理上通常会对某一特定活动处于一种准备的状态，从而使其认识问题、解决问题带有一定的倾向性与专注性。\n\
    \n刻板印象原理无时无刻不在影响着人的思想和行为。前苏联心理学家曾做过这样一个关于“刻板印象”的实验：\n\n心理学家把同一张照片出示给参加实验的两组大学生看。不过，心理学家事先告诉第一组的学生：照片上的人是一个怙恶不悛的罪犯；告诉第二组的学生：照片上的人是一位伟大的科学家。最后，心理学家让这两组学生分别用文字来对照片上这个人的相貌进行描述。结果，第一组学生描述道：此人深陷的双眼表明其内心充满了仇恨，突出的下巴昭示着他沿着犯罪的道路越走越远的内心……第二组学生描述道：此人深陷的双眸表明其思想的深度，突出的下巴表明他在求知的道路上不畏艰难险阻的意志……\n\
    \n同一个人，之所以会得到如此截然不同的评价，仅仅是因为评价者之前得到的关于此人身份的提示有区别，一开始产生了反感，后来就很难认同；一开始认同，往往就会一直认同。\n\
    \n在人际交往中，如果能够巧妙利用人的心理定势，就可以非常简单地让他人点头称“是”，对你心悦诚服。\n\n- “今天的天气真不错啊！”\n- “是啊!”\n\
    - “夫人和孩子也都好吧？”\n- “是的，很好。”\n- “今年是你的本命年吧?”\n- “是的，我是属羊。”\n- ……\n\n让对方不断地同意你的意见，制造对方“同意”的心理定势，最后，引人正题，对方往往也会同意。\n\
    \n或许有人会怀疑，这个简单得类似于哄小孩子的策略真的能够奏效吗? 是的，这个策略虽然简单，但的确非常有效。\n\n几乎每个人都有过这样的心理经历: 用“不”来拒绝对方，并不能让自己心情愉悦，甚至有时会产生不愉快的感觉；相反，表示同意的肯定性回答往往会给自己带来愉快轻松的感觉。也就是说，对人来说，同意是自然的态度，而反对要比同意困难。再加上心理定势对“同意态度的强化”，人在连续地同意了一连串事情之后，要突然扭转态度是非常困难的。\n\
    \n再则，人天生有一种使自己的言行或者态度前后保持一致的需求，如果产生了不一致，就会造成心理不适。\n\n因此，通过制造对方“同意”的心理定势来使对方心悦诚服，是切实可行的说服策略。在与人交往的过程中，先就一些对方肯定会表示同意的事情取得对方的同意态度，使对方形成心理定势，最后再道出正题，往往就会避免双方的许多意见分歧，使彼此在最短时间内达成共识。\n\
    \n## 7. 激发对方的好奇心,让他甘愿被说服\n\n生活中，当一个人固执的时候，要想说服他是非常困难的。因为，当一个人固执的时候，其心理往往处于一种紧张、封闭的状态，如果硬碰硬地劝说对方，十有八九是会碰钉子的。相反，巧妙地制造悬念，引发对方的好奇心，转移对方的注意力，从而缓和对方紧张、抗拒的情绪，然后再说服对方，则相对容易很多。\n\
    \n战国时，齐国宰相田婴想要在自己的领地内筑城，他的这个想法遭到了几乎所有门客的反对。门客们认为，实施筑城计划会引起田婴和齐国王室的摩擦，而这很可能导致田婴失去政治权利。然而，田婴却固执己见。\n\
    \n一时之间，门客们不断地向田婴进言，希望能改变他的主意。面对他人千虑一得般的反对，田婴觉得烦不胜烦，不想再听到任何人的劝说，于是，他就对看门的仆役说：“如果再有门客登门造访，一定不要让他们进来。”\n\
    \n果然，又来了一位门客，这位门客苦苦地向仆役恳求，仍然不得其门而入。无奈之下，他只得在门外大声地喊：“我只说三个字，多一个字，我都愿受刀斧而死。”听他这样说，田婴破例接见了他。这位门客果然只对田婴说了“海”、“大”、“鱼”三个字，说完后，他毫不停留，转身就走。\n\
    \n他这一走，真让田婴如蒙一头雾水，怎么想也不明白这位门客到底想要说什么。于是，他主动叫住那位门客，问道：“你到底想说什么？把话说完不然我会被你憋死。”\n\
    \n这位门客回答道：“海里的大鱼很厉害，能够将钓住它的鱼线挣断，也能将捕捉它的渔网挣破，让人很难捉到它。然而，像这样厉害的大鱼，如果想离开水，到更加广阔的天空里去畅游，恐怕会被渴死。齐国对你而言，不正像水之于大鱼吗？你筑城池是为了摆脱国王的束缚，拥有更加广阔的天空，但是同时，你也会失去国王的有力支持，进而失败。”\n\
    \n最后，田婴终于被这番话打动，打消了筑城的念头。\n\n的确，通过制造悬念或者新奇的话题勾起对方的好奇心，一方面能够使对方放松心里戒备，另一方面可以吸引对方的注意力，让对方用心地听你说，这些无疑是成功说服对方的前提。更重要的是，由于勾起了对方的兴趣，说服会变得更加容易。\n\
    \n亚历山大·格雷厄姆·贝尔是享誉世界的科学家，因为他发明了电话机。然而，一切的科学研究都是需要经费的。有一次，他为了研究复音电唱机的事情而来到朋友哈伯特家，希望哈伯特能够赞助他正在进行的研究。那么他是不是像现在很多拉赞助那样，带了一大堆项目说明、调研分析、可行性报告，然后直言自己的项目多么多么有价值、多么多么好呢？显然，贝尔没有这样做。\n\
    \n一开始，贝尔只是在弹钢琴，而哈伯特在旁边看书，一切都惬意极了。然而，贝尔突然停止了弹奏，扭头问正在看书的哈伯特：“你相信吗？我只需要把这脚踏板按下去，就能够让钢琴唱我唱的音，我唱什么，钢琴就会唱什么。”\n\
    \n“钢琴会复唱”，这奇怪的事情勾起了哈伯特的好奇心，于是他放下手中的书，兴致勃勃地问贝尔：“哦？你怎么能够做到呢？”接下来，贝尔顺理成章地给哈伯特上了一堂有关复音电唱机的原理的专题课，进一步激发哈伯特对这种研究中的电唱机的兴趣。结果，哈伯特为了能够尽早看到这种新奇的机器而主动提供了资助。\n\
    \n其实，贝尔说服哈伯特赞助之所以能够成功，关键就在于他没有一开始就直言自己的来意，而是利用对方的好奇心来激发对方的兴趣，然后再一步步进入正题。人有可能会拒绝别人，但是不会拒绝自己。为了满足自己的好奇心，为了让自己的兴趣得偿所愿，哈伯特自然会选择提供资助。\n\
    \n在说服他人的过程中，如果你能够成功地引起对方的兴趣，那么，你就已经成功了一半了。\n\n## 8. 投其所好，使说服对方的可能性最大化\n\n人的情感可以分为积极情感和消极情感两大类，积极情感包括喜欢、愉悦、兴奋等，消极情感则是指讨厌、憎恶、气愤等。心理学研究表明，积极情感能够引发理解、接纳、合作的行为效果；而消极的情感则会让人对外界产生排斥和拒绝。也就是说，当对方处于积极情感状态的时候，往往更容易相信你所说的是对的，进而按照你的意见行事；反之，如果对方处于消极情感状态，那么，你想要直接说服对方就是一件非常困难的事情。\n\
    \n由此可见，最大限度地引导、激发对方的积极情感，能够使说服对方的可能性更大。而“投其所好”就是一个引导和激发对方积极情感的过程。在这个过程中，能够采用的方式是多种多样的，下面介绍的是最为典型和有效的做法。\n\
    \n首先，你要通过观察，发现对方的“闪光点”，并对之加以赞扬，使对方的心情更加愉悦。\n\n一个让人难以忍受的大热天，一位教授走进一家餐厅就餐。不知是由于天热还是别的什么原因，餐厅里服务人员的态度并不是很好。然而，这位教授并没有像大多数人一样和服务人员理论其态度问题。为了获得对方良好的服务，这位教授像闲话家常一样对服务员说今天的天气真热啊，可是你们还要为客人服务，还要站在炉边做菜，一定够辛苦的，真是难为你们了。\n\
    \n这位教授巧妙、准确地赞扬了餐厅服务人员的可贵之处—在如此炎热的天气里，仍然坚守岗位为大家服务。教授的话使他们感到自己是被人关注和关心着的，从而产生了积极的情感体验，接下来，心情愉悦，服务自然也就周到到了。\n\
    \n在你赞赏了对方的“闪光点”，在对方紧张、严密的心理保护网上撕开突破口以后，你还需要让对方接受你。因为，只有当对方接受了你以后，才有可能接受你的观点和见解。那么，怎样才能使对方接受你呢？答案就是：找到对方的“兴趣点”，并通过谈论对方感兴趣的话题，让对方接受你。\n\
    \n面包商杜维诺一直试图让自己的面包卖给纽约国际饭店。4年内，他经常打电话给饭店主管这件事情的经理，并且只要是该经理参加的社交聚会，他都会去，他甚至为此在饭店内预订了房间。令人遗憾的是，他都失败了。\n\
    \n在研究了人的社交心理以后，杜维诺改变了策略，他决定找到经理的兴趣点，然后投其所好。\n\n他打听到这位经理是“美国旅馆招待委员会”组织的一员，而且还当选过该组织和“国际招待者协会”的主席。\n\
    \n于是，杜维诺再次见到经理的时候，就和他说有关招待者协会的话题。出乎意料地，原本对杜维诺十分冷淡的经理一下子就打开了话匣子，反应异乎寻常的热情。在杜维诺要离开的时候，这位经理成了杜维诺参加该协会的推荐人，而杜维诺只字未谈有关面包销售的事情。\n\
    \n几天后，饭店经理主动打电话要杜维诺送面包样品过去。4 年的努力未成，一朝“投其所好”的交谈却得手了。由此可见，投其所好能够获得对方的好感，而当对方对你好感十足的时候，要他答应你的要求也就是水到渠成的事情了。\n\
    \n了解对方的兴趣，针对对方感兴趣的话题交谈，能够在不知不觉中与对方建立起感情，使对方接纳你。这样，就为进一步说服对方创造了最有利的条件。\n\n## 9.\
    \ 借助权威的力量来说服对方\n\n著名空军将领乌扎尔·恩特和自己的副驾驶员合作多年，一直都很合拍。然而，在一次飞行任务前，副驾驶员生病了，于是，这次他只得和一名替补搭档合作。\n\
    \n在起飞过程中，恩特哼起歌来，并且他的头也随着节拍一点一点地打起了拍子。糟糕的是，这位替补并不明白恩特只是在享受音乐，误以为恩特是要他把飞机升起来。虽然这个替补清楚地知道飞机还远远没有达到可以起飞的速度，但他还是把操纵杆推了上去。\n\
    \n结果飞机的腹部与地面相撞，螺旋桨的一个叶片插入恩特的背部，导致恩特终生截瘫。\n\n事后，调查员在了解事故情况时问那个替补副驾驶员：“既然你知道飞机还不能起飞，为什么仍然把操纵杆推上去了呢？”替补的回答是：“我以为将军要我这么做。要知道，他是这方面的权威人物，我应该听他的。”\n\
    \n其实，类似的事故在航空界屡见不鲜。明明机长所犯的错误十分明显，但飞行员们却没有针对这个错误采取任何行动，最终导致飞行事故的发生。这种现象由于其多发性而甚至具有专有的名字——“机长综合症”。\n\
    \n“机长综合症”的发生是有其固有的心理根源的，那就是人们对权威的信任要远远超出对常人甚至是自己的信任。\n\n这种心理是非常普遍的。比如，当人们身体不适去医院就诊的时候，往往会选择专家门诊，即使多花钱、多花时间等也在所不惜；\n\
    \n一篇医学论文如果是刊登在普通杂志社，人们往往会有所怀疑，然而如果是刊登在联合国的某个刊物上，人们将深信不疑……这种现象说明，权威对人们的影响力是巨大的。\n\
    \n有一个著名的心理学实验证明了权威的力量：\n\n美国某大学心理系的一堂课上，教授为学生们引荐了一位来宾——世界闻名的化学家施米特博士。\n\n接着，施米特博士从皮包中拿出一个装有液体的玻璃瓶展示给学生们看，说：“这是我正在研究的一种具有很强的挥发性的物质。”说完，他拔开了瓶塞，在教室里走了一圈，问：“现在你们能够闻到它的味道吗？闻到的学生请举手。”这时，几乎所有的学生都陆续举起了自己的手。\n\
    \n但是后来，教授告诉学生们：所谓的施米特博士只是本校的一位老师化妆成的。这时，立刻就有学生说：“原来他是装成的，难怪我什么也没有闻到。”而事实上，那瓶液体也的确只是一瓶蒸馏水。\n\
    \n从这个实验中，可以看出人们对权威简直可以说是到了迷信的地步。因此，当你无法说服对方的时候，不妨借用一下权威的力量。比如说，你想要说服对方采取某种方法，但是对方却非常不以为然。这时，懊恼固然无济于事，而硬碰硬恐怕也只会使事情变得更糟。\n\
    \n与其如此，不如告诉对方：“嗯，或许你说得有理，我这里有一些资料，不如我们一起进一步讨论一下。”然后，收集许多支持自己观点的权威性资料，给对方参考。这种方式会比你与对方做口舌之争有效得多。又或者，当你无法说服对方，两人的沟通交流陷入僵局的时候，你可以请被冠以“专家”之名的人向对方阐释相关信息。\n\
    \n对于权威，大多数人在心理上都有着某种程度的迷信，因此，借用权威的力量往往能够快速而有效地说服他人。所以，如果你自己不够权威，那就学着借助权威吧！\n\n\
    ## 10. 提出的建议要暗合对方的心理\n\n生活中，真正具有“兼听”美德的人并不多，而且，极有可能你所碰见的是一个顽固分子，对他人的意见，他根本就当成了“耳旁风”。那么，怎样才能够让对方接受你的意见呢？\n\
    \n心理学家指出，在人际交往的过程中，“自我”永远是第一位的。也就是说，如果你的建议让对方的自我产生了不适应，对方势必会排斥你的建议。要想让对方接纳你的建议，就要采取迎合对方心理的建议方式。\n\
    \n- 1. 要动之以“情感”。心理学家认为，人们在做选择决定时，有90%是依赖于情感的。在情感的基础上，才用逻辑加以证明，说明自己的行为多有道理。因此，如果没有唤起对方的情感，只用严格的逻辑和大道理去献计献策，那么，不管你献的那个计策多合乎道理、合乎逻辑，被采纳的可能性都几乎为零。\n\
    \n所以，你不妨为自己的计谋换张脸，把它们“翻译”成以情感为基调的“谏辞”，以清楚具体的好处把对方的情绪调动起来。\n\n- 2. 要晓之以“策略”。研究显示，即使你已经唤起了对方的情感，但空泛的建议仍然不足以引起对方的兴趣。因此，要进一步提出具体策略，清楚地阐述行动的具体进程，这样才能让对方认为你的建议是可行的。让对方更接近你给他的“果子”，从而让你的建议更具有诱惑力，更容易被对方所采纳。\n\
    \n- 3. 要诱之以“避祸”。每个人在面对选择、进行决定的时候，都会考虑其得失。如果风险过大，那么他采纳建议的可能性就很小；如果你描述得完全没有风险，对方很可能无法相信，进而拒绝你的建议。因此，你应该坦诚地将可能出现的风险告知对方，并针对“怎样避免消极、不快的后果”提出一些切实可行的措施。\n\
    \n其实，诱之以“避祸”的方法不仅能够让你的建议更加真实可信，减少对对方的风险的疑虑，而且能够刺激对方的动机。心理学家指出，当人被告知自己正冒着失去某物的危险时，往往会产生更强的动机。\n\
    \n- 4. 增强对方对建议的信心。通过上面这一番包装，你的建议已经不存在让对方拒绝的问题了。然而，很多时候，人们之所以拒绝采纳某项建议，并不是因为建议本身，而是因为提建议的人让他们感到不舒服。因此，你仍需要运用以下策略增强对方对建议的信心。\n\
    \    - ① 让他相信“主意是他出的”。对于那些自己出的主意，人们往往会表现得更加积极和满意。所以，即使你想法的产生和对方丝毫没有关系，也要尽量让对方觉得那个主意是他先想出来的，或者你是受了他的启发才想到的。\n\
    \    - ② 让他知道“新主意是他一贯的想法”。人人都有讲究“次序”与“一致性”的先天需求。有意识地提醒对方，这个建议与他的信念、行为以及以前做过的事情是一致的，那么这个建议被采纳的可能性就会更大。\n\
    \    - ③ 准备不必 100%，让他明白你“也不是‘百科全书’”。很多人认为，向人提建议和方案的时候，准备得越周全越好。其实，准备得太过周全，反而会适得其反。\n\
    \n即便你什么都知道、什么都明白，活脱脱就是一部“百科全书”，可是并没有多少人愿意听百科全书教条式的建议。因此，你不妨将心理学上的“出丑效应”用上一用。在小的、无关紧要的地方表现得不太确定，用一些显得有些语无伦次的短语，比如“这件事我想，嗯，我知道，并且，对，呃，这件事，我晓得......”等，反而能够凸显自己的真实，从而让对方更容易接受。\n\
    \n    - ④ 用你的热忱感染对方。心理学家指出，人的情绪是会传染的。因此，当你“献计”的时候，应该用自己的情绪去感染对方。情绪高涨、充满自信地向对方陈述建议，能让对方最大限度地接受你的建议。\n\
    \n此外，你在向对方提出建议时，还有一点是必须注意的，就是一定不能将想让对方采纳的心情表现得太过迫切。人都有逆反心理，当你越是想要他去做一件事的时候，他往往不是那么愿意；当你不想他去做，或者他不被允许去做的时候，他往往会更主动地去做。\n"
  mdcn: "\n## 4. 条理化的语言交流\n\n不要说病句。即使是面对面地说话而非书面表达，病句也会影响对方对信息的接收效率，而且还会给对方留下不自信、没有文化素养的不良印象。\n\
    \n说话要有要点、有重心。有的人喜欢与人寒暄或者东拉西扯，结果到交谈结束的时候也没有把关键的事情说清楚，这就是无效的语言交流。\n\n要三思而后说。缺少理性的思考会影响语言的条理和逻辑，因此，开口前要稍微想一想。\n\
    \n要把握非语言因素。声线要沉稳，语速要适中，肢体语言要适度，太多了会分散对方的注意力。\n\n要多听名人演讲。这可以潜移默化地改变自己的说话条理。\n\n\
    条理化的语言是一笔宝贵的财富，是我们与人进行交流的有效工具。\n\n## 5. 用断定性的语言来说服对方\n\n论起说服他人的本事，这方面的佼佼者非雄辩家们莫属了。不过雄辩家有许多不同的类型，其中，以政治家为代表的“自信类型”是最具典型意义的。他们说话时总是表现出一副无比自信、笃定的样子，仿佛这个世界根本就没有他们所能控制的事情。\n\
    \n其实许多人都知道，真理只有一个，而雄辩家们所说的未必就是真理。然而，当他们在众人面前满怀自信侃侃而谈的时候，人们总是容易被他们那种无比确定的样子所征服，愿意去相信他们说的就是真理。那么，为什么他们总是能让人相信他们所传递的信息就是真实的、甚至是不容置疑的呢？为什么他们就能够让人心悦诚服呢？\n\
    \n如果你留意一下他们的语言就会发现，他们高频率地使用了诸如“绝对”、“肯定”、“百分之百”、“全”、“总”、“都”之类的完全肯定或者完全否定的、立场非常鲜明的断言。他们在说服他人时，总说：“我一定会把我说过的事情都付诸实践的。”“我绝对值得你们信赖！”“我向上帝起誓……”等断定性的言论。\n\
    \n一般人听到这种言论的时候，尽管会理智地告诉自己，“凡事不能这样简单地断定”，但又会怀有一种“万一他说的是真的呢？不然他怎么这么肯定呢”的侥幸而继续听下去，也就等于给了对方继续说服自己的机会，而从对方那里获取的信息越多，被说服的可能性就越大。\n\
    \n与那些不确定的信息相比，利用全盘肯定或者全盘否定表达出来的确定性信息所体现的说服力和感染力要强得多。\n\n回想一下2008年汶川大地震时各大媒体的宣传，几乎所有的媒体都使用了“全坏”、“全灭”、“全烧”之类的断定性的语言，给人以强烈的心理震撼，进而说服人们捐款。而那些“部分地区崩坏”、“部分人员伤亡”之类的语言，在给人心理造成影响的强烈程度和信息确切度方面都大不如确定性的语言。\n\
    \n一位老师对一个心理素质比较差的考生说一句话：“你绝对没问题的，一定能够考好。加油！”这种断定性的语言往往能够有效地消除对方心里的不安，给予对方勇气，从而使学生发挥正常的水平而通过考试。相反，如果你对他说：“你应该能够考好吧，即使没有百分之百的把握，也请加油吧！”这样，不但不能说服对方、使对方充满自信，而且有可能使对方产生“老师都这样说了，看来，我真的是考不好了……”的疑虑，进而加重心理负担，导致考试失败。\n\
    \n由此可见，利用断定性的语言向对方传递信息，往往能够征服对方的潜意识，进而在不知不觉中说服对方。因此，当你想要说服他人的时候，不妨适当地运用一些确定性的词语，即使是不确定的信息，也要用断定性的语言来传达。\n\
    \n## 6. 用对方的心理定势说服对方\n\n世界著名的心理催眠专家米尔顿·埃米尔松在对人进行催眠的时候，常准备很多对方肯定会回答为“是”的问题，然后依次问对方这些问题，通过让对方不断地回答“是”，人为地让对方形成一种对任何问题都回答“是”的心理定势，进而达到心理催眠的效果。\n\
    \n在心理学上有个非常著名的原理叫做“刻板印象原理”，指的是，一个人在一定的时间内所形成的一种具有一定倾向性的心理趋势会影响他随后的思维方式和言行举止。即一个人在其已有经验的影响下，心理上通常会对某一特定活动处于一种准备的状态，从而使其认识问题、解决问题带有一定的倾向性与专注性。\n\
    \n刻板印象原理无时无刻不在影响着人的思想和行为。前苏联心理学家曾做过这样一个关于“刻板印象”的实验：\n\n心理学家把同一张照片出示给参加实验的两组大学生看。不过，心理学家事先告诉第一组的学生：照片上的人是一个怙恶不悛的罪犯；告诉第二组的学生：照片上的人是一位伟大的科学家。最后，心理学家让这两组学生分别用文字来对照片上这个人的相貌进行描述。结果，第一组学生描述道：此人深陷的双眼表明其内心充满了仇恨，突出的下巴昭示着他沿着犯罪的道路越走越远的内心……第二组学生描述道：此人深陷的双眸表明其思想的深度，突出的下巴表明他在求知的道路上不畏艰难险阻的意志……\n\
    \n同一个人，之所以会得到如此截然不同的评价，仅仅是因为评价者之前得到的关于此人身份的提示有区别，一开始产生了反感，后来就很难认同；一开始认同，往往就会一直认同。\n\
    \n在人际交往中，如果能够巧妙利用人的心理定势，就可以非常简单地让他人点头称“是”，对你心悦诚服。\n\n- “今天的天气真不错啊！”\n- “是啊!”\n\
    - “夫人和孩子也都好吧？”\n- “是的，很好。”\n- “今年是你的本命年吧?”\n- “是的，我是属羊。”\n- ……\n\n让对方不断地同意你的意见，制造对方“同意”的心理定势，最后，引人正题，对方往往也会同意。\n\
    \n或许有人会怀疑，这个简单得类似于哄小孩子的策略真的能够奏效吗? 是的，这个策略虽然简单，但的确非常有效。\n\n几乎每个人都有过这样的心理经历: 用“不”来拒绝对方，并不能让自己心情愉悦，甚至有时会产生不愉快的感觉；相反，表示同意的肯定性回答往往会给自己带来愉快轻松的感觉。也就是说，对人来说，同意是自然的态度，而反对要比同意困难。再加上心理定势对“同意态度的强化”，人在连续地同意了一连串事情之后，要突然扭转态度是非常困难的。\n\
    \n再则，人天生有一种使自己的言行或者态度前后保持一致的需求，如果产生了不一致，就会造成心理不适。\n\n因此，通过制造对方“同意”的心理定势来使对方心悦诚服，是切实可行的说服策略。在与人交往的过程中，先就一些对方肯定会表示同意的事情取得对方的同意态度，使对方形成心理定势，最后再道出正题，往往就会避免双方的许多意见分歧，使彼此在最短时间内达成共识。\n\
    \n## 7. 激发对方的好奇心,让他甘愿被说服\n\n生活中，当一个人固执的时候，要想说服他是非常困难的。因为，当一个人固执的时候，其心理往往处于一种紧张、封闭的状态，如果硬碰硬地劝说对方，十有八九是会碰钉子的。相反，巧妙地制造悬念，引发对方的好奇心，转移对方的注意力，从而缓和对方紧张、抗拒的情绪，然后再说服对方，则相对容易很多。\n\
    \n战国时，齐国宰相田婴想要在自己的领地内筑城，他的这个想法遭到了几乎所有门客的反对。门客们认为，实施筑城计划会引起田婴和齐国王室的摩擦，而这很可能导致田婴失去政治权利。然而，田婴却固执己见。\n\
    \n一时之间，门客们不断地向田婴进言，希望能改变他的主意。面对他人千虑一得般的反对，田婴觉得烦不胜烦，不想再听到任何人的劝说，于是，他就对看门的仆役说：“如果再有门客登门造访，一定不要让他们进来。”\n\
    \n果然，又来了一位门客，这位门客苦苦地向仆役恳求，仍然不得其门而入。无奈之下，他只得在门外大声地喊：“我只说三个字，多一个字，我都愿受刀斧而死。”听他这样说，田婴破例接见了他。这位门客果然只对田婴说了“海”、“大”、“鱼”三个字，说完后，他毫不停留，转身就走。\n\
    \n他这一走，真让田婴如蒙一头雾水，怎么想也不明白这位门客到底想要说什么。于是，他主动叫住那位门客，问道：“你到底想说什么？把话说完不然我会被你憋死。”\n\
    \n这位门客回答道：“海里的大鱼很厉害，能够将钓住它的鱼线挣断，也能将捕捉它的渔网挣破，让人很难捉到它。然而，像这样厉害的大鱼，如果想离开水，到更加广阔的天空里去畅游，恐怕会被渴死。齐国对你而言，不正像水之于大鱼吗？你筑城池是为了摆脱国王的束缚，拥有更加广阔的天空，但是同时，你也会失去国王的有力支持，进而失败。”\n\
    \n最后，田婴终于被这番话打动，打消了筑城的念头。\n\n的确，通过制造悬念或者新奇的话题勾起对方的好奇心，一方面能够使对方放松心里戒备，另一方面可以吸引对方的注意力，让对方用心地听你说，这些无疑是成功说服对方的前提。更重要的是，由于勾起了对方的兴趣，说服会变得更加容易。\n\
    \n亚历山大·格雷厄姆·贝尔是享誉世界的科学家，因为他发明了电话机。然而，一切的科学研究都是需要经费的。有一次，他为了研究复音电唱机的事情而来到朋友哈伯特家，希望哈伯特能够赞助他正在进行的研究。那么他是不是像现在很多拉赞助那样，带了一大堆项目说明、调研分析、可行性报告，然后直言自己的项目多么多么有价值、多么多么好呢？显然，贝尔没有这样做。\n\
    \n一开始，贝尔只是在弹钢琴，而哈伯特在旁边看书，一切都惬意极了。然而，贝尔突然停止了弹奏，扭头问正在看书的哈伯特：“你相信吗？我只需要把这脚踏板按下去，就能够让钢琴唱我唱的音，我唱什么，钢琴就会唱什么。”\n\
    \n“钢琴会复唱”，这奇怪的事情勾起了哈伯特的好奇心，于是他放下手中的书，兴致勃勃地问贝尔：“哦？你怎么能够做到呢？”接下来，贝尔顺理成章地给哈伯特上了一堂有关复音电唱机的原理的专题课，进一步激发哈伯特对这种研究中的电唱机的兴趣。结果，哈伯特为了能够尽早看到这种新奇的机器而主动提供了资助。\n\
    \n其实，贝尔说服哈伯特赞助之所以能够成功，关键就在于他没有一开始就直言自己的来意，而是利用对方的好奇心来激发对方的兴趣，然后再一步步进入正题。人有可能会拒绝别人，但是不会拒绝自己。为了满足自己的好奇心，为了让自己的兴趣得偿所愿，哈伯特自然会选择提供资助。\n\
    \n在说服他人的过程中，如果你能够成功地引起对方的兴趣，那么，你就已经成功了一半了。\n\n## 8. 投其所好，使说服对方的可能性最大化\n\n人的情感可以分为积极情感和消极情感两大类，积极情感包括喜欢、愉悦、兴奋等，消极情感则是指讨厌、憎恶、气愤等。心理学研究表明，积极情感能够引发理解、接纳、合作的行为效果；而消极的情感则会让人对外界产生排斥和拒绝。也就是说，当对方处于积极情感状态的时候，往往更容易相信你所说的是对的，进而按照你的意见行事；反之，如果对方处于消极情感状态，那么，你想要直接说服对方就是一件非常困难的事情。\n\
    \n由此可见，最大限度地引导、激发对方的积极情感，能够使说服对方的可能性更大。而“投其所好”就是一个引导和激发对方积极情感的过程。在这个过程中，能够采用的方式是多种多样的，下面介绍的是最为典型和有效的做法。\n\
    \n首先，你要通过观察，发现对方的“闪光点”，并对之加以赞扬，使对方的心情更加愉悦。\n\n一个让人难以忍受的大热天，一位教授走进一家餐厅就餐。不知是由于天热还是别的什么原因，餐厅里服务人员的态度并不是很好。然而，这位教授并没有像大多数人一样和服务人员理论其态度问题。为了获得对方良好的服务，这位教授像闲话家常一样对服务员说今天的天气真热啊，可是你们还要为客人服务，还要站在炉边做菜，一定够辛苦的，真是难为你们了。\n\
    \n这位教授巧妙、准确地赞扬了餐厅服务人员的可贵之处—在如此炎热的天气里，仍然坚守岗位为大家服务。教授的话使他们感到自己是被人关注和关心着的，从而产生了积极的情感体验，接下来，心情愉悦，服务自然也就周到到了。\n\
    \n在你赞赏了对方的“闪光点”，在对方紧张、严密的心理保护网上撕开突破口以后，你还需要让对方接受你。因为，只有当对方接受了你以后，才有可能接受你的观点和见解。那么，怎样才能使对方接受你呢？答案就是：找到对方的“兴趣点”，并通过谈论对方感兴趣的话题，让对方接受你。\n\
    \n面包商杜维诺一直试图让自己的面包卖给纽约国际饭店。4年内，他经常打电话给饭店主管这件事情的经理，并且只要是该经理参加的社交聚会，他都会去，他甚至为此在饭店内预订了房间。令人遗憾的是，他都失败了。\n\
    \n在研究了人的社交心理以后，杜维诺改变了策略，他决定找到经理的兴趣点，然后投其所好。\n\n他打听到这位经理是“美国旅馆招待委员会”组织的一员，而且还当选过该组织和“国际招待者协会”的主席。\n\
    \n于是，杜维诺再次见到经理的时候，就和他说有关招待者协会的话题。出乎意料地，原本对杜维诺十分冷淡的经理一下子就打开了话匣子，反应异乎寻常的热情。在杜维诺要离开的时候，这位经理成了杜维诺参加该协会的推荐人，而杜维诺只字未谈有关面包销售的事情。\n\
    \n几天后，饭店经理主动打电话要杜维诺送面包样品过去。4 年的努力未成，一朝“投其所好”的交谈却得手了。由此可见，投其所好能够获得对方的好感，而当对方对你好感十足的时候，要他答应你的要求也就是水到渠成的事情了。\n\
    \n了解对方的兴趣，针对对方感兴趣的话题交谈，能够在不知不觉中与对方建立起感情，使对方接纳你。这样，就为进一步说服对方创造了最有利的条件。\n\n## 9.\
    \ 借助权威的力量来说服对方\n\n著名空军将领乌扎尔·恩特和自己的副驾驶员合作多年，一直都很合拍。然而，在一次飞行任务前，副驾驶员生病了，于是，这次他只得和一名替补搭档合作。\n\
    \n在起飞过程中，恩特哼起歌来，并且他的头也随着节拍一点一点地打起了拍子。糟糕的是，这位替补并不明白恩特只是在享受音乐，误以为恩特是要他把飞机升起来。虽然这个替补清楚地知道飞机还远远没有达到可以起飞的速度，但他还是把操纵杆推了上去。\n\
    \n结果飞机的腹部与地面相撞，螺旋桨的一个叶片插入恩特的背部，导致恩特终生截瘫。\n\n事后，调查员在了解事故情况时问那个替补副驾驶员：“既然你知道飞机还不能起飞，为什么仍然把操纵杆推上去了呢？”替补的回答是：“我以为将军要我这么做。要知道，他是这方面的权威人物，我应该听他的。”\n\
    \n其实，类似的事故在航空界屡见不鲜。明明机长所犯的错误十分明显，但飞行员们却没有针对这个错误采取任何行动，最终导致飞行事故的发生。这种现象由于其多发性而甚至具有专有的名字——“机长综合症”。\n\
    \n“机长综合症”的发生是有其固有的心理根源的，那就是人们对权威的信任要远远超出对常人甚至是自己的信任。\n\n这种心理是非常普遍的。比如，当人们身体不适去医院就诊的时候，往往会选择专家门诊，即使多花钱、多花时间等也在所不惜；\n\
    \n一篇医学论文如果是刊登在普通杂志社，人们往往会有所怀疑，然而如果是刊登在联合国的某个刊物上，人们将深信不疑……这种现象说明，权威对人们的影响力是巨大的。\n\
    \n有一个著名的心理学实验证明了权威的力量：\n\n美国某大学心理系的一堂课上，教授为学生们引荐了一位来宾——世界闻名的化学家施米特博士。\n\n接着，施米特博士从皮包中拿出一个装有液体的玻璃瓶展示给学生们看，说：“这是我正在研究的一种具有很强的挥发性的物质。”说完，他拔开了瓶塞，在教室里走了一圈，问：“现在你们能够闻到它的味道吗？闻到的学生请举手。”这时，几乎所有的学生都陆续举起了自己的手。\n\
    \n但是后来，教授告诉学生们：所谓的施米特博士只是本校的一位老师化妆成的。这时，立刻就有学生说：“原来他是装成的，难怪我什么也没有闻到。”而事实上，那瓶液体也的确只是一瓶蒸馏水。\n\
    \n从这个实验中，可以看出人们对权威简直可以说是到了迷信的地步。因此，当你无法说服对方的时候，不妨借用一下权威的力量。比如说，你想要说服对方采取某种方法，但是对方却非常不以为然。这时，懊恼固然无济于事，而硬碰硬恐怕也只会使事情变得更糟。\n\
    \n与其如此，不如告诉对方：“嗯，或许你说得有理，我这里有一些资料，不如我们一起进一步讨论一下。”然后，收集许多支持自己观点的权威性资料，给对方参考。这种方式会比你与对方做口舌之争有效得多。又或者，当你无法说服对方，两人的沟通交流陷入僵局的时候，你可以请被冠以“专家”之名的人向对方阐释相关信息。\n\
    \n对于权威，大多数人在心理上都有着某种程度的迷信，因此，借用权威的力量往往能够快速而有效地说服他人。所以，如果你自己不够权威，那就学着借助权威吧！\n\n\
    ## 10. 提出的建议要暗合对方的心理\n\n生活中，真正具有“兼听”美德的人并不多，而且，极有可能你所碰见的是一个顽固分子，对他人的意见，他根本就当成了“耳旁风”。那么，怎样才能够让对方接受你的意见呢？\n\
    \n心理学家指出，在人际交往的过程中，“自我”永远是第一位的。也就是说，如果你的建议让对方的自我产生了不适应，对方势必会排斥你的建议。要想让对方接纳你的建议，就要采取迎合对方心理的建议方式。\n\
    \n- 1. 要动之以“情感”。心理学家认为，人们在做选择决定时，有90%是依赖于情感的。在情感的基础上，才用逻辑加以证明，说明自己的行为多有道理。因此，如果没有唤起对方的情感，只用严格的逻辑和大道理去献计献策，那么，不管你献的那个计策多合乎道理、合乎逻辑，被采纳的可能性都几乎为零。\n\
    \n所以，你不妨为自己的计谋换张脸，把它们“翻译”成以情感为基调的“谏辞”，以清楚具体的好处把对方的情绪调动起来。\n\n- 2. 要晓之以“策略”。研究显示，即使你已经唤起了对方的情感，但空泛的建议仍然不足以引起对方的兴趣。因此，要进一步提出具体策略，清楚地阐述行动的具体进程，这样才能让对方认为你的建议是可行的。让对方更接近你给他的“果子”，从而让你的建议更具有诱惑力，更容易被对方所采纳。\n\
    \n- 3. 要诱之以“避祸”。每个人在面对选择、进行决定的时候，都会考虑其得失。如果风险过大，那么他采纳建议的可能性就很小；如果你描述得完全没有风险，对方很可能无法相信，进而拒绝你的建议。因此，你应该坦诚地将可能出现的风险告知对方，并针对“怎样避免消极、不快的后果”提出一些切实可行的措施。\n\
    \n其实，诱之以“避祸”的方法不仅能够让你的建议更加真实可信，减少对对方的风险的疑虑，而且能够刺激对方的动机。心理学家指出，当人被告知自己正冒着失去某物的危险时，往往会产生更强的动机。\n\
    \n- 4. 增强对方对建议的信心。通过上面这一番包装，你的建议已经不存在让对方拒绝的问题了。然而，很多时候，人们之所以拒绝采纳某项建议，并不是因为建议本身，而是因为提建议的人让他们感到不舒服。因此，你仍需要运用以下策略增强对方对建议的信心。\n\
    \    - ① 让他相信“主意是他出的”。对于那些自己出的主意，人们往往会表现得更加积极和满意。所以，即使你想法的产生和对方丝毫没有关系，也要尽量让对方觉得那个主意是他先想出来的，或者你是受了他的启发才想到的。\n\
    \    - ② 让他知道“新主意是他一贯的想法”。人人都有讲究“次序”与“一致性”的先天需求。有意识地提醒对方，这个建议与他的信念、行为以及以前做过的事情是一致的，那么这个建议被采纳的可能性就会更大。\n\
    \    - ③ 准备不必 100%，让他明白你“也不是‘百科全书’”。很多人认为，向人提建议和方案的时候，准备得越周全越好。其实，准备得太过周全，反而会适得其反。\n\
    \n即便你什么都知道、什么都明白，活脱脱就是一部“百科全书”，可是并没有多少人愿意听百科全书教条式的建议。因此，你不妨将心理学上的“出丑效应”用上一用。在小的、无关紧要的地方表现得不太确定，用一些显得有些语无伦次的短语，比如“这件事我想，嗯，我知道，并且，对，呃，这件事，我晓得......”等，反而能够凸显自己的真实，从而让对方更容易接受。\n\
    \n    - ④ 用你的热忱感染对方。心理学家指出，人的情绪是会传染的。因此，当你“献计”的时候，应该用自己的情绪去感染对方。情绪高涨、充满自信地向对方陈述建议，能让对方最大限度地接受你的建议。\n\
    \n此外，你在向对方提出建议时，还有一点是必须注意的，就是一定不能将想让对方采纳的心情表现得太过迫切。人都有逆反心理，当你越是想要他去做一件事的时候，他往往不是那么愿意；当你不想他去做，或者他不被允许去做的时候，他往往会更主动地去做。\n"
