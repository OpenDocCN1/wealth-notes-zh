    一九八〇年前的一〇％低了不少。更糟的是，大部分美國人的實質薪資其實是停滯的，只有最頂尖的有錢人（付我們薪水的老闆）荷包越來越厚，財富離底層的民衆越來越遠。


    經濟政策機構（Economic Policy Institute）在一〇一六年的報告中表示，收入位於金字塔下層七〇％的人口，在一〇〇〇年之後，每年以五．三％的速度成長，最窮的一〇％人，收入只增加二．二％。收入高的族群狀況又如何？二〇〇〇年以來收入位於頂端的一〇％及五％高收入人士，薪資則分別增長了一五．七％及一九．八％。在相對低薪及低儲蓄率的情況下，債務節節攀高。二〇一七年底，美國累積的消費債務已經達到三．七兆美金，比二〇〇〇年時增加了二倍。


    每個美國人，不論男女老幼，都負擔了一萬一千美元的債務。債務變成了我們的鎖鏈，高債務加上儲蓄不足，美國人陷於朝九晚五的生活模式中。


    因為房貸、車貸、學貸及卡債的壓力，人們沒法離開工作，更多美國人被迫以車為家或流落街頭。在全球化及企業整併的大潮下，每個產業，從製造業到高科技業都得裁員，這是必須面對的現實。


    ### 週工作時感覺快死了，但週末又活回來


    現在來看看一般消費者如何花辛苦賺來的錢。週六把衣服拿去乾洗，到修車廠做輪胎校正，或請修車師傅看看到底為何愛車發出怪聲，到超市買足供給一家人一週的食物，結帳時你以為大約只要七十五美元，想不到在付款時竟付了一二五美元。（對啦，你可以蒐集一些折價券省點錢，但只有時間做這事？）再到大賣場買兩本大家都在讀的暢銷書。結果手上拿了兩本書，一件西裝（為對折扣)以搭配鞋子，又幫小孩買了幾件新衣，反正是刷卡付錢。突然想到回家之後要修剪一下花草，糟糕！修剪苗圃需要園藝剪。家中的烤麵包機，即使調到最弱的火力還是把麵包烤焦，又找不到保證書，只好到賣場再買一台新的，結果結帳時又拿了一個組合式的置物架及廚房用的油漆，啊！差點忘了買烤麵包機。跟伴侶出去吃頓飯，把小孩交給保母顧一下。週日上午弄點鬆餅給大家當早餐吧，糟糕，沒麵粉了，去雜貨店買點麵粉吧，結果又順手買了草莓藍莓，搭配鬆餅，還有楓糖、蘇門答臘咖啡，千萬別忘了要買麵粉。帶小孩去湖邊游泳，到加油站加油，看看價目表，不由得眉頭一皺。開車到鄉間的餐廳吃晚餐，再用信用卡付帳。回到家看看電視打發時間，不時有誘人的廣告出現，企圖說服觀眾：只要買了保时捷跑車、到國外旅遊或是買一台新的電腦，生活會更好。我們以為可以透過工作滿足這些需求，但其實我們花的錢比賺的還多，消費的東西比我們需要的多，這使得我們又得回到職場賺錢。


