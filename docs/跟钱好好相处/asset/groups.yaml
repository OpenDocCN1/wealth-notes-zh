    # 金錢新藍圖的開始


    到底是什麼讓消費這件事變成無節制的浪費？廣告商推銷物質主義，我們就全部買單，為何會這樣？心理學家把金錢稱為「最後的禁忌」（the taboo），我們甚至願意跟心理諮商師討論性生活，而不願意與他人討論財務狀況。


    金錢代表的意義，通常不是我們真的擁有多少，而是覺得夠不夠用，但金錢是影響人生的關鍵因素，重要性還是難以忽視。然而，平常除了打屁聊天偶爾會提及，親朋好友間很少把錢當作重要或必要的话题。為什麼會這樣？誠實談論金錢，會帶來什麼無法承擔的損失？


    # 信任的模式


    要解答這個問題，首先得了解人心。從東方哲學到現代腦神經科學，不同的研究都似乎同意一個基本概念，人的大腦思考是以一套套模式進行，而且是一種重複的模式。不饒有點動物，對於不同的刺激會有固定的行為反應，人類的反應是以模式化的方式進行。行為模式的產生有些源自個人經驗，特別是五歲前的刺激；有些行為模式是天生的，有些是文化，有些則是人類所共有。這些行為模式大體上最重要的目的是提高生存的機會。一旦模式被大腦記錄，或一旦被驗證認為有助於生存，就非常難以改變。我們聞到炒洋蔥的香味就流口水，看到紅燈就踩煞車，當有人喊叫「失火了！」就分泌腎上腺素。如果記憶沒有對外環境變化有這樣的反應，我們就很難生存。但問題來了：這些行為模式並沒有反映客觀事實，但仍一直左右我們的行為。


    事實上，有些行為模式非常頑固，我們常常照著自己的解讀做事，而拒絕接受客觀的事實。'
  - '[PAGE 63]


    走在梯子下面或是打破鏡子，真的代表厄運罩頂？當然，大部分人對於這類迷信，可能都嗤之以鼻，但其他呢？到感冒會怎麼傳染的？是因為頂著還沒乾的頭髮外出？還是被細菌感染？前者也許很容易被判斷是無稽之談，但後者呢？畢竟，還是有很多在辦公室裡的人沒有感冒，是因細菌跳過他們？細菌理論是不是現代迷信呢？又有哪些證據可以適用到未來呢？


    # 我們的行動說明了什麼？


    有沒有可能，我們對財務的了解跟地球是平的理論一樣已經脫離現實？這些都是真的嗎？萬一我們對財務的了解也是一場迷信？我們還要相信小時候怪獸躲在床底下的故事？我們還信不大嗎？


    例如，雖然我們告訴自己錢沒有辦法買到快樂，人生中最棒的事情是有自由，但實際情況如何？誠實需要更深度的自我認知。當感到沮喪、寂寞，感覺不到愛，我們會怎麼做？我們藉由買東西安慰自己：一件漂亮衣服、一杯飲料（或兩杯）、一輛新車、一球冰淇淋、到夏威夷散心、買一缸金魚、看電影，一大包巧克力餅乾（或兩包）。


    當我們慶祝自己走運，我們買東西慶祝：到酒吧好好喝一輪酒、一場盛大的喜宴、一大把玫瑰或一枚鑽戒。解決無聊的辦法也是買東西：一棟遊艇、下一個的賭博（買彩券）。當我們覺得人生還少了一些東西，我們也是掏錢解決，參加講座、買一本自我提升的書、買一間閣樓小屋、在市區買一間房子。這些都沒有什麼不對，就是我們會做的事情，我們已經會用外在的東西來回應內心或靈魂發出的訊號。我們總是用消費滿足精神或心靈的渴望，為何會這樣？看看一張圖。'
