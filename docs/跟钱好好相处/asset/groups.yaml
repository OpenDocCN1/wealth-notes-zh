    對你收入的影響

    如果，對於現在的工作，你只將其當成是人生的一個過渡階段，只是要領一份薪水餬口（不論你喜歡還是討厭這份工作），你就可以評估一下把珍貴的生命活力花在這一面上到底值不值得。雖然，你的人生比工作更重要，但找一份待遇很好「工作」，存到自己想要的錢，也是必要的。財務自主的第七步驟，重點就在這裡。


    # 步驟七：重估你的生命活力，最大化你的收入


    我們要探討的，是重估你用來累積收入的生命活力，看看它是否足以交換到你的人生及健康。

    當你拿起薪資單，算一下薪資及其他打零工的収入，列出所有的綜合收入時，是否真的覺得你用生命活力做成了一個好的交易？從失敗人生走出來，重新拿到生命自主權的關鍵，就是衡量你的生命活力。錢是你用生命活力交換之後得來的產品，而你也了解，工作最重要的目的就是賺錢，不要天真的認為，既然目的是賺錢，就一定要每個小時都盡可能賺到最多的鈔票。雖然以傳統標準來看，這主意好像沒錯，但若真的這樣做，你就會走入另外一個不同的方向。從步驟一走到步驟六，你了解很多事情，包括未來大概會有多少錢流進口袋。你應該已經拋棄了所謂的「豐足」就是一種現在還要更多」的概念，也應該不會再責怪自己逃不出窮人的困境，你更應該知道，豐足的生活其實沒有想像中的遙遠。'
  - '[PAGE 268]


    請記住，『豐足』不是只能賺取過日子的基本開銷。「豐足」是一種富足、沒有多餘的狀況。正如第五章中指出的那樣，你的收入可能可以支援這樣的豐足生活。少花一點你辛苦賺來的錢，減少投注在工作上的時間，你就可以過一個豐足的生活，這是簡單的算術。如果每月賺進兩千五百美元，是你的富足生活標準，那表示你只要每小時掙到二十五美元、每月工作一百小時，就可以滿足開支。如果你一小時可以賺到五十美元，那每個月只要工作五十八小時就足以支應。你也可以把一半的錢省下來，可支用的金錢就更多了。


    現在，讓我們回到工業革命之前人類的生活方式。你自己經營小生意或農作，每天工作兩、三個小時，剩下的時間用來放鬆、做有趣的事、自我發展、人際互動、社區參與或服務社會。如果你選擇在有薪工作上花更多時間，那麼，理由一定比賺錢充分許多，因為我們人生的最高理想是善用自己的生命活力，而不是透支它。你這麼做的原因，可能是因為教養責任，也可能是希望早日擺脫債務的困擾，享受一下財務自由的暢快感受；你可能想多存一點錢，當經濟氣候不穩定時，能多一份安全感；或者，你想要達到另外的人生目標，例如：回學校念書、環遊世界或是追求財務獨立。


    你的目標大小和強度，將決定你投入工作的時間和精力。你甚至可能非常希望在正職工作外，還有好幾個業外收入可以拿，這樣的職場人生會更加快樂。如此，就算加班，生活也不像以往感覺被剝奪，反而是有更大的目標值得努力。


    蘿絲瑪莉從工作中解放了！我的意思是說，她在工作之餘，可以朝著超越人生目標前進，從旅行到寫作，到可能拯救地球的目标。她是一個活動策劃專家，在退休銀髮之家'
  - '[PAGE 269]


    工作，但她不想把人生全部放在工作上。她清楚地了解，現在掙得越多，就可以越早實現其他目標。她沒有試圖尋找另一份薪水較高、但壓力可能較大的工作，反而利用兼差賺錢。她的第二份工作，是在一家小型音樂公司，每週利用晚上和週末的幾個小時，賺取另外一份收入。工作時間很有彈性，同事很好相處、壓力也不大，每小時賺的錢，跟自己的正職差不多。雖然每週工作時間遠超過四十小時，但精神及活力都處在非常棒的狀態。


    重視你的生命活力和追求最高的薪酬，與「越多越好」的心態無關。如果金錢等於生命活力，那麼透過增加收入，就能增加可用的生命活力。根據每個人的時薪不同，一輛新車可能需要一個月、六個月或一年的工作時間，你不需要靠賺更多的錢，贏取更多的社會地位、聲望、權力或保障，你知道錢買不到這些東西。你需要更多的錢，是因為你想要有更多的自由去做自己，而不必擔ใจ錢。同樣，你不會想用更多的錢提高你的自尊，但你確實需要更多的錢，成就自己的人生，發揮生命活力。


    # 工作的其他新選項


    你現在有幾個創意選項可以選擇，利用兼差增加收入、改善目前的工作狀況，或換個工作。'
