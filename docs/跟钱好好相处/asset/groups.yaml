    讓他像唐娜一樣的熱情。她開始研究另類執業的可能，最後得出結論，就算身在傳統的婚姻框架中，儘管與丈夫不同調，女人也必須活出自己的生命。


    隨著自己體會日深，唐娜重新評估她的診所。她的員工不想要跟主流醫療院所一樣長時的生活，但不願意少賺一些錢，因為傳統醫院之所以收高額的費用，是要支付醫生的薪資。唐娜認為需要改弦更張，但這樣的產業生態，不斷將她拉回到舊的工作方式。


    「要嘛我必須採取不同的方法，要嘛乾脆都不要做這行！」對於唐娜來說，財務自主的宗旨，就是從舊的思考中重生。金錢、工作、生命的意義和目的，都會跟著這個大方向調整。「如果新型醫療做法的代價，是少賺一點錢，那就這樣吧！」


    唐娜並不孤單。「新美國夢中心」（Center for a New American Dream）曾進行一項全國性調查發現，近一半的美國人已經做出了改變，雖然賺的錢比較少。調查顯示他們很滿意這樣的改變，雖然收入減少，但壓力也相對減輕，更能讓生活保持平衡，休閒時間也更多。


    # 2. 減少工作量，可以活出內心真正想要的


    我們大多數人是因著外在大家庭境，決定自己的生活方式。就像中國餐廳的料理一樣，每個人都制式地在大分類中選擇自己東西。從「求職」的廣告分類中選擇「消防員」；從條件中選擇「金髮和藍眼睛」；從要生幾個小孩的問題中選擇「兩個」；在個人風格中選擇當「隨便」的人；在諸多汽車品牌中選擇「豐田」；從政治光谱中選擇藍派；從購屋條件中選擇「公寓」。'
  - '[PAGE 261]


    將多元的面貌塞入「工作」要求的條件中，除非你是藝術家或企業家，否則你必須按照別人安排好的事項行事才能拿到薪水。職場中存在著一種微妙而不負責任的氛圍，因為我們總是在別人的要求下做事，並盡量取悅其他人。


    在大公司中，大多數員工都不知道究竟是誰制定了這樣的工作規則，迫使我們在這框架下努力做事。而且這些公司不僅控制職業，還控制我們個性的發展，看不見的企業文化，甚至管制我們與誰談話、穿什麼、「吃」什麼樣的午餐。必須加多少班，才會被長官「看到」？更影響日常生活的各種選擇。顯然地，如果把賺錢當作是目標，那麼我們就會採取所有可能的方法，企圖在職場中能有最好的方式生存。但是，如果你把自我與賺錢拆開來，就像你將工作與薪資關聯切斷一樣，你就可以重拾失去的自我。當你重新認識自己，重新釐清價值觀、信念、才能以及什麼事是你該關心的，你才能從內而外地、舒坦地工作與賺錢，也不會因工作而失去自我。


    瑪格麗特正在重新調整自己，從活在別人的價值中（從外部生活），轉變為為自己而活（從內而外）。她離婚，有兩個孩子，是個有強烈責任感的單親媽媽。她希望盡可能賺錢，讓家庭生活更美好，她放棄了原本的教学工作，成為一名經過認證的理財規畫師。佣金是她重要的收入來源，不同產品有不同的抽佣比重，她常常陷入佣金與客戶利益的衝突裡。這讓瑪格麗特痛苦不已，認為應該盡快跳出這個循環中，她停止一味追求銷售的手段，這讓身體變得更好，但她個人的財務卻出現狀況。所幸，她加入了艾薇成立的個人理財的支援團體，開始實施財務自主計畫。當按步驟實踐時，她發覺小組的每一個成員都越來越可以按照自己的價值觀行事，雖然從此狀況不'
  - '[PAGE 262]


    同，但他们願意跟隨自己的想法走。例如，有一個女性團員看到自己的才華在傳統框架中不斷被浪費掉，「他們付給我我的薪水，根本不值得我用這樣的痛苦換取！」於是她辭掉工作，靠儲蓄生活一段時間，直到找到另一個工作為止。


    所有改變都是在執行計畫的過程中發生的。


    # 3. 重新定義工作，讓我們成為自己生活的設計師，而非只是賺錢工具


    在工業革命之前，大多數人都是農民，他們大都能夠打造、維護和修復日常生活所需的一切。之後工業革命，特別是資訊和科技革命，讓我們開始出售自己小部分的才華及時間，來換取我們需要的切。失去了工作就有了收入來源，但仍然必須背負抵押貸款、車貸和卡。然而，切斷工作與薪資之間的掛鉤，你對人生「剩下的時間」就開始有主導權。


    我們可能沒辦法回到以前那種凡事親力親為的生活環境，但只要能享受無薪工作，債務就會越來越低。我們可以開始學習親手處理各種雜事，或者自己建造碼頭，或建立一個網站或部落格……當停止為金錢工作時，我們可能會失業，但並沒有失去工作。你的所有作為，最終都可能成為薪酬，你在生活中學到的技能，以後可能會成為你的報酬，在一項工作中獲得的技能，可能會成為另一項工作的收入。


    在一份工作中，也許可以學會交易的來龍去脈，熟悉之後就可以離開那份工作，輕鬆地自己進行交易，也許產生不少利潤。職場變成學校，工作成為表現自我的舞台。無論是否有薪資，你都是自己的老闆，開拓自己的道路。'
  - '[PAGE 263]


    # 4. 重新定義工作，為退休生活增添生機


    退休並不意味著停止工作，而是意味著你可以停止為金錢工作。我們都希望對他人有貢獻，並希望貢獻被認可。如果認為有償工作是人生中唯一可受人尊敬的貢獻方式，那麼誰願意退休？沒有人想成為一個被時代淘汰、被丟在一旁沒人問問的廢物。把工作和工資分開，意味著你在每一個角色、任務和活動中都是有價值的。它可以讓你早日退休，你就可以把更多的自己貢獻給別人。


    # 5. 重新界定工作，重視無償活動


    南茜厭倦了聽到自己說：「我不知道自己的方向在哪？『每天晚上她都看著自己的行程表嘆嘆，為何事情還有這麼多沒做？但她記錄自己的支出，認為自己應該可以掌控。每隔十五分鐘，她就會記錄一下自己的錢及時間花到哪裡去。她很快地了解到，她把大部分時間花在了不重要的活動上：清潔、烹飪、購物和與家人聊天。


    她的行事曆上只記載了與工作相關的事物，同事會面，回覆電子郵件，其他大部分時間都不在行事曆上。她發現，如果打掃房子能夠賺錢，她會把它列入清單。打掃家裡當然沒有人會付她錢，因此不會出現在紀錄上，現在她記錄所有自己做过的事，為所付出或無償工作感到自豪。無酬的活動往往被視為毫無價值，但它們的價值真的低於有償工作嗎？我們的文化幾乎普遍相信，如果沒賺錢、沒有職業，也沒有受雇，就是一個無用的人。其實，只要內心開始自我發展，心靈也逐漸邁向成熟，就能夠評斷自己的作為，這就是一種工作，與有償工作及家庭雜務一樣重要。


    花時間去了解自己，思考、禱告，發展一套自己的生活哲學和道德規範、設定個人目標和評'
  - '[PAGE 264]


    估進度。將工作和薪資的關係切斷，停止痛苦地接受工作賦予的自我認同。


    # 6.重新定義工作，讓工作及玩樂完美結合


    工作是認真的，玩樂是輕浮的；工作是大人的事，玩耍是幼稚的；工作是有用的，玩是無用的；有時玩遊戲可能看起來像工作，就像一場激烈的國際象棋比賽。有時候工作看起來甚至被稱為玩樂，就像在職業體育競賽一樣。有時候，工作會讓人覺得非常喜歡玩，人們會說（有點愧赧），這份工作非常有趣，我不應該拿薪水的。——如何分辨工作和娛樂之間的差異呢？玩耍和工作都可以是有競爭力的，也可以是合作的。


    它們既能建立技能，也能獲得成就感，兩者都讓你進入專注、集中及轉變的狀態。事實上，一個人若完全投入一項活動，外面的人會不知道他是在玩，還是在賺錢。這是把工作和薪資分開看待的魔力，你可以重新連接工作和娛樂，人生會變得很享受。


    # 7.重新定義工作，讓人們享受更多休閒娛樂


    對於希臘人來說，休閒是人生最高的境界，一種自由的本質、自我發展和更高層次的人生追尋。然而，身處於二十一世紀初的我們，無法真正放鬆和享受休閒，即使在字面上，我們把休息時間稱為「暫停」（Pause），但其實只休息了幾分鐘，就又回頭去工作，當一個充滿生產力的螺絲釘。如果我們沒有為錢做事，就能享受休閒時間。玩樂在人生中絕對是必要的，在樹蔭下放鬆聽小鳥啾啾是應該做的事情；隨意散步也很值得；把電子用品留在家裡快樂去露營吧！花一些時間獨處，做你任何想做的事；無所事事到處找樂子也是人生必備；休閒不會讓你失去自我，只要你別只'
  - '[PAGE 265]


    為工作而存在。也許因為工作深入到人生中的每一個小時，我們沒辦法專心一致從事真正的休閒活動，只能抽空小旅行，三不五時還必須查看手機，查看朋友的訊息，社交媒體的動態，或是追劇。一但將工作與薪資分開看待之後，我們在工作時會比較專注，休閒時也會集中精神在自己選擇的活動上。


    # 8. 重新定義工作，為「生計」打開了新的曙光


    「理想的生計」，指的是找到你真正想要從事的行業，或真正喜愛的工作，我們的財務自主計畫，巧妙地避開了這一崇高努力的陷阱。沒有人可以向你保證，你會找到真正願意賣命工作的老闆。就算你自己創業，可能會花上許多年的時間尋找生意機會，或是找得對的方法或是對的技術能力和投資人。群眾集資是一種創新的方法，不必苦等政府補助，但位於倫敦的「眾籌中心」（Crowdfunding
    Center）在一〇一五年的一分報告發現，有七至九成的群眾集資計畫都以失敗收場。


    失敗的原因大都與你的產品或服務無關，反而與運氣、機會、毅力、關係、種族或性別以及其他因素有關。但選擇離開受薪人生，也許可以讓你的生命更完整，你可以自己做主賺錢，也可以追隨內心真正想做的事情。你可以提前做退休時的計畫，依照財務自主的九大步驟，就可以實踐你的熱情及夢想，把上班的歲月當成是實現夢想的先修班。在這段受薪的歲月中，累積自己的經驗、工作技巧，當然，建立自己的人際網絡也非常重要。不論你現在對工作的不滿意度如何，如果覺得它不是你愛的，你要告訴自己，不要安於現狀，積極尋找下一個能安頓身心的工作，及達成財富自主的目標。


    > ※ 參見：Catherine Clifford, “Less Than a Third of Crowdfunding Campaigns Reach
    Their Goals,” Entrepreneur, January 18, 2016, https://www.entrepreneur.com/article/269663.'
