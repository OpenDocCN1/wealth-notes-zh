    # 真的有人這樣做？


    媒體上會有非常多讓人炫目的退休理財報導：「想要提早退休？」「想要三十歲就過退休人生嗎？」「每月把五成的收入存起來，就能提早退休」，這些報導都吸引了相當多讀者，當你深入了解之後，會發現許多推動財務獨立運動的人士，與我們談的策略幾乎不謀而合。《簡單的財富之路》（The
    Simple Path to Wealth）一書的作者柯林斯（J. L. Collins），在給女兒的一系列信件中，寫到了這種理財方法，他認為大家都喜歡錢，而且喜歡用簡單的方式得到它。


    他將策略整理成幾個重點，例如「不要與對自己財務狀況不負責任的人往來」、「不要花光你賺的每一塊錢，存一點下來」。更重要的是，量入為出，把存下來的錢投資在先鋒總股票市場指數基金（VTSX），一個基金，一個戶頭。真的這麼簡單嗎？


    在財務獨立的領域內，最知名的應該就是本書推薦者金錢鬍子先生。多年來，他一直在宣揚自己與指數型基金的關係，甚至把傳統的選股投資稱為「傻瓜的賭注」。在他的部落格中，建議讀者用十到十五年的時間工作，以五成的收入過生活，同時把剩下的所得存入指數型基金或管理費相對較低的長期投資商品上。與一般想法不同，他認為如果市場崩盤，是股票跳樓大拍賣的時機，雖然他認為房地產和其他收入來源，也是財務獨立的重要來源，但他鼓勵讀者，把錢放在指數型基金上，讓這種簡單的理財商品繼續為你賺錢。崇尚極簡主義的密爾本和尼克迪穆，在他們的部落格及暢銷書《心簡單：尋找生活意義的法則》（Minimalist
    Live a Meaningful Life）中提到，「簡單投資是大家該做的事，他們選擇的金融工具，就是靈活、成本低、可靠的指數型基金。」


    他們把投資轉入了管理費低廉的指數型基金公司，如：先鋒及 Bannister，確實省下了很多


