    # 讓你的財務攤在陽光下


    險，每年要繳八四一美元（先不要想應不應該買車餐車）*，你可以把這筆費用平均分配在十二個月份，其他費用如醫療保險、綜合所得稅及房屋地產稅，都可以比照辦理。


    沒有唯一正確的會計方法。你要選擇能夠提供你所需訊息的方式，以便在瀏覽收支圖時，知道你的位置以及要去的地方。


    現在登錄收支已經變成習慣，看到自己的進展，也會令你感到高興，你可以進行下一步了。該怎麼做呢？跟朋友談錢也許是一個不錯的開始。讓朋友知道你正在改變自己，而你同時也是一個好聽眾，當朋友提及財務狀況時，你會是個值得信賴的對象。但切記不要擺出顧問的姿態，你也必須把朋友當成是信賴的對象，讓彼此能相互提醒及鼓勵。


    在這個階段，非常多的學員會開始經營部落格，記錄財務獨立的進程及自我改變的心路歷程，也會把每月記帳及退稅的結果記錄下來。你應該開始經營部落格嗎？當然，我們鼓勵你這樣做，這是一個讓你成功達成財務獨立的好方法。喬以往在辦研討會的時候（在上一版的書中也曾提及），鼓勵大家把收支圖掛在每天看得到的地方。這樣做對你有百利而無一害，圖表能時時激勵並鞭策自己，是否仍然走在正確的道路上。


    有人乾脆把收支圖掛在衣櫥裡，或是掛在衣櫥拉門的內側，每天換衣服時就能看到。如此既能保有隱私，還可以日日提醒自己，在消費時不要忘記財務獨立的計畫，更不要忘記工作不再是「做一天算一天」的苦差事。工作不再是賺錢，而是能讓自己更接近財務獨立及免除生活恐懼的重


