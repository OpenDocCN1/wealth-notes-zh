    # 指數型基金 的投資哲學


    信仰柏格理論的投資人，深信他們可以成功地管理風險，並獲得比一般投資者更高的回報，許多人把資金押注在下一次科技股的狂潮。他們的做法可以歸結為以下理念：投資於管理費用低的指數型基金，透過特定商品的多元化投資，長期持有這些資產。


    為何指數型基金 的收費較低？因為指數型基金採取被動式管理，不需要積極管理及投資，不需要養一個研究團隊選股，不像傳統共同基金必須建立研究團隊，從股海中挑選好公司，以達成超越市場指數的目標。因此，指數型基金行政管理費用較少，管理費較低廉，當然對投資者更具吸引力。


    這些費用或費用比率，按投資金額的比率收取（請注意，市面上已經買到社會責任投資類的指數型基金，其管理費約○．一二％至○．五％，較一般指數型基金高，但遠低於傳統共同基金），你只要決定要把錢放在哪一類的指數型基金上。雖然投資指數型基金很簡單，大部分管理費也相當低廉，但仍有一些決定要做，例如你要投資股票指數型基金？還是債券類的指數型基金？國內或國際？大、中、小型資本？或是把不同種類組合起來？將投資集中在美國債券指數？或是全球股票市場指數？這些組合，可以讓投資人參與世界不同的市場，降低整體風險。'
  - '[PAGE 322]


    # 善用公司退休計畫


    對於那些還處於賺錢年紀的人來說，不少公司都提供傳統個人退休金帳戶的計畫，這些計畫都可以讓你選擇把錢投資在指數型基金上。如果你的公司有提供退休計畫，務必把被動管理的低成本低指數型基金，納入你的考量。如果可以，請考慮全額自願提撥，非常划得來。還記得我們前面說的，在全職工作階段盡量省錢，為年老退休做準備，將一部分錢提撥進退休專戶還可以節稅。如果你的公司沒有提供退休金計畫，仍然可以透過經紀公司建立退休專戶。這與儲蓄的功用相近，但長線增值潛力更高。


    若你遵循上述建議，縮小你的投資範圍至指數型基金，接下來要做的選擇就變得比較簡單，如果你覺得聽起來很無聊，那麼你就做對了。長期投資不是一個快速致富的計畫，也不需要你日夜緊盯。像投資資產管理這樣的公司，提供了簡單的、沒有附加條件的投資方式。以前相對昂貴及複雜的投資，現在每個人人都可以簡單地做到，除了先鋒之外，還有許多其他公司可供選擇。


    投資最重要的事情，還是必須了解，世界上真的沒有人能夠準確預測市場或未來。了解自已的風險承受能力，並將投資分散在股票、債券以及國內和國際指數型基金，就能降低整體風險。此外，世界上也沒有完美的投資組合，因此最重要的是，減少對單一政府或公司的投資，仔細檢視每個基金的管理費及其他相關費用，和大多數長期投資一樣堅持走下去。把二十四小時監控市場的電視節目關掉，只要在你購買以及賣掉它的那一天，關心它的價格就行。'
