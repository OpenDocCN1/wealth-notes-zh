    ## 追求生活、自由及薪資的權利呢？


    在大蕭條期間，如果你有休閒時間，就等於失業。為了經濟發展和減少失業，羅斯福新政策每週工時為四十二小時，政府成為僱主的靠山。工人被灌輸就業才是真正的公民權利（生活、自由和追求薪水？），休閒則不被認同。作家漢尼考特（Barbara
    Kingson Humphreys）在著作《工作沒有盡頭》（*Work Without End*）中，提到全民就業主義（The doctrine of full
    employment）的概念：


    自大量生產以來，極少有美國人暢議減少工作時數是景氣增長、提高生產力，或讓經濟持續發展的重要手段。相反地，太多的閒暇時間，普遍被認為是消耗經濟、增加工資負擔及經濟退步的象徵。


    「成長是好的」和「充分就業」的神話，在現在社會的價值體系中，確立了關鍵地位。這與「充分消費」的概念完美地吻合，讓大家普遍認為，如果有休閒時間，應該是拿來盡情消費，而不是用來享受。在過去的半個世紀裡，充分就業意味著更多的消費者擁有更多的「可支配收入」。利潤增加、業務擴張，就會帶來更多工作、更多消費者，也象徵更多的可支配收入。正如在第一章中看到的，消費推動「進步」的巨輪繼續前進。所以社會對於休閒的概念，發生了根本性的變化。


    本來應該是充滿享受的、文明的日常生活，變成了擔心受怕的來源，不斷提醒人們在大蕭條時期的失業問題。隨著休閒價值的下降，工作價值相對上升。為了達成充分就業的目的，越來越多的人把工作及賺錢當成生活重心，拿到酬勞之後，再藉由消費，耗費更多資源，廣告業的發達更助長這種趨勢。為了反制這樣的趨勢，二十一世紀初，出現了一些倡導重視休閒生活的運動。電影製片人葛拉夫（Doug
    Gregg）發起了一個「找回你的時間」（*Take Back a Time*）運動，呼籲勞累過度的美國人，應該縮短工時，延長假期。即使所有的研究都顯示，減少工時和充足休息可以提高生產力。為了解開大家的迷思，「找回你的時間」的倡導者更進一步找尋長工時的文化的來源，想要翻轉一天必須工作八小時的想法。越來越盛行的慢食運動，也想改變現代人工作上癮的問題。慢食運動強調吃飯應該是一個歡樂、愉悅、文明和對話的時刻，我們應該戒掉在電腦前狼吞虎嚥解決一餐的習慣，不要成為在滾輪中永遠停不下來的倉鼠。


    ## 工作有新定義


    漢尼考特表示，在過去的半個世紀裡，我們對於工作以外、生命意義的重要來源：家庭、文化和社會的耕耘越來越少。工作以外的傳統儀式、社交活動以及彼此陪伴，都提供了人們一種目的和歸屬感。如果少了這份歸屬感，休閒生活很容易流於孤獨與無趣。因為工作以外的生活，失去了生命力與意義；工作已經不再是達到目的的手段，而是成為目的。漢尼考特說：「人們現在都只從工作中尋找生命的意義、目的甚至救贖，更不會用傳統哲學或神學的方向思考。大家對於宗教的大哉問，都從工作、行業或職業裡尋求解答。」①


    霍克希爾德（Arlie Hochschild）在二〇一四年的著作《時間困局》（*The Time Bind*）中指出，在家庭生活中，大家都有三件事要做：工作、家庭及修復因為工作造成的關係損傷。


    就算是一些標榜「家庭友善」的企業也獎賞工作時間長的員工（無論他們是否有生產力），有些公司把辦公室裝演得比家裡更加舒適，誘使一些員工願意花更多時間待在公司，因為整體環境更優。最後一個讓工作成為社會重心的關鍵點在於，新教教義越來越盛行。在那之前，工作被視為粗俗，宗教才是神聖的。之後，工作被視為救贖的舞台，而優渥的物質條件也被視為虔誠宗教信仰的一部分。


    現今二十一世紀，工作扮演的角色越來越多元，甚至已經開始演起宗教的角色：我們在工作中尋求生定位，當問起「我是誰？」和「我為什麼在這裡？」以及「這一切所為何來？」時，我們都朝工作尋找答案：關於家庭的問題，當問起「哪些人跟我屬於同一群人？」或「何處是我的歸屬？」時，我們也從工作上找答案：當要尋找愛情或是深刻情感的時候，職場也提供一個重要管道。就好像我們相信工作的場域裡，有一個迷人、像童話故事裡一樣的白馬王子，可以滿足需求並激勵我們朝康莊大道前進。我們開始相信，透過工作能獲得所有的東西：地位、意義、冒險、旅遊、奢華、尊重、權力、挑戰以及夢幻般的獎勵。人生最重要的事，就是找到好的工作。


    若以相處時間計算，跟我們共結連理的是工作，不是伴侶。我們對工作許下誓言，不論好壞、富有或貧窮、疾病和健康都至死相守，態度比真正的婚姻關係還堅定。工作讓我們陷入一家中、高速公路、辦公室─僵固的生活輪迴中。希望有一天公主親吻癱蛤蟆之後，能變成王子，工作就是生命中的癱蛤蟆。


    現在的年輕人就業環境更為艱困，手機及平板電腦讓員工隨時得聽從公司召喚。為了生計，更有人必須兼兩到三個差，這樣變成二十四小時都在待命。當正職工作養不活家庭，兼差也很難讓清學費的同時，不少年輕人就得跟家人住在一起，擠在父母家的地下室裡過活。因此現代美語把「推擠」（squeezed），這個英文單字，當作「兼差」的同義詞，象徵為了要生活下去所必須付出的活力及代價。他們完全清楚正處在必須靠兼差才能養活自己的年代裡，需要極大的勇氣才能對抗水下的壓力。


    > ① 編註：這是美國於一九八一年創立的一種延後課稅的退休金帳戶計畫，將相關規定明訂在國稅法第401(k)條中，故簡稱為401(k)計畫。美國的退休計畫有許多種類，而401(k)只應用於私人公司。

    > ② 參見：Jonnelle Marte. “Nearly a Quarter of Fortune 500 Companies Still Offer
    Pensions to New Hires.” *Washington Post*, September 5, 2014.


    ## 我們贏得了工業革命嗎？


    自從我們的祖先每天工作三個小時，把時間花在享受社交、儀式、慶典和遊戲以來，文明已經走過了一段很長的路，但這樣做真的值得嗎？我們發揮創造力及創意，使得人類在物質生活上有長足的進步，科學、技術、文化、藝術、語言和音樂都已經大幅進展，並帶給我們無數的啟發。相信大多數人不願時光倒轉回到過去，錯過巴哈或盤尼西林。但是，我們確實需要暫停一下，重新評估方向，我們的航道正確嗎？看看現代的職場和就業環境，我們在哪？這是我們想要到的地方嗎？


    不少上班族感覺有志難伸，上班的日子充滿了重複、瑣碎或不具挑戰性的任務，這些工作既不需要創造力，也很難讓智慧發揮。其他人則覺得工作過度，尤其現在企業縮編，更多的責任都落在少數留存下來的幸運兒肩上。新創領域則像是拓荒時代的狂野西部，不少資金充沛的新公司不斷冒出，為年輕員工提供免費食物和乒乓球桌等福利，以平衡工作環境的強度。近年來社會意識提高，在氣候變化及消費主義副作用氾濫的狀況下，受薪族的心靈正受到兩種勢力的拉扯。經濟上，他們需要工作；但從道德上講，他們不支持公司提供的產品或服務。


    退休保障不再安全。只有七成的公司，仍然提供固定福利養老金計畫。四分之一的公司，只保障具有一「定貢獻度」的員工，提供401(k)的退休計畫加上一些現金。其餘公司直接將退休儲蓄的責任轉移到勞工身上。不少人甚至懷疑，美國國家社會保障安全網是否能保障勞工的長期工作安全。當然，這也是本書暢銷的原因，我知道你們想把退休生活完全掌握在自己手中，不論發生任何狀況，都能根據自己的時間表幸福退休。


    根據紐約非營利組織美國經濟諮商會在二〇一四年發布的一份報告，大多數美國人對工作感到不滿。在一九八七年的第一次調查中，六成一一的工人表示喜歡他們的工作。這是歷史的高點，工作滿意度最低點，發生在二〇一〇年，只有四成二六的上班族表示喜歡他們的工作。由於長期受雇趨勢已經不再，勞工在同一間公司任職到老的機會越來越低，因此企業對員工的醫療保險的免賠額和工資扣除額越來越高。工作保障和醫療保險這兩項，也成為滿意度下降最多的類別，自一九八七年以來，下跌了十一個百分點。


    看來，我們已經受夠了這個瘋狂的世界。但有趣的是，很多人對工作仍然充滿童话故事般的幻想，認為自己是職場影票中的幸運兒，逾半的人並不討厭自己的工作，工作上癮症仍在美國社會處處可見。我們仍企圖填滿那無底洞似的需求，冒著臨死才後悔的風險：我們幹嘛要花這麼多時間在工作上？


    > ① 編註：這是美國於一九八一年創立的一種延後課稅的退休金帳戶計畫，將相關規定明訂在國稅法第401(k)條中，故簡稱為401(k)計畫。美國的退休計畫有許多種類，而401(k)只應用於私人公司。

    > ② 參見：Jonnelle Marte. “Nearly a Quarter of Fortune 500 Companies Still Offer
    Pensions to New Hires.” *Washington Post*, September 5, 2014.


    ## 工作的目的到底為何？


    讓我們繼續探討工作這個議題，這個最親密、最深刻的關係。但首先反思幾個問題：


    - ◇ 你為何選擇用現在的方法來賺錢？

    - ◇ 每天早上，是什麼激勵你起床去某個地方賺錢？

    - ◇ 就你的經驗，想一下，你做這份全職工作的目的到底是什麼？（如果你靠配偶或親屬工作賺錢養家，那這個「養家餬口」的工作目的究竟為何？或是依據過去的工作經驗思考一下；如果你已經退休或失業，想想你曾經有過的工作。）

    - ◇ 現在，看看下方的各種目的清單，看看哪些適用於你的情況。


    ### 賺錢


    - ◇ 為自己和家人生活所需

    - ◇ 為了儲備未來

    - ◇ 為了從事慈善事業

    - ◇ 為實現財務獨立


    ### 安全感


    - ◆ 確保你在公司的地位得到保障

    - ◆ 確保享有各項福利


    ### 傳統


    - ◆ 繼承家業

    - ◆ 承擔家庭責任

    - ◆ 因為家中的每個人都工作


    ### 服務


    - ◆ 為了公平分享

    - ◆ 為他人、社會和世界做出貢獻

    - ◆ 為了改變世界，將技能用在幫助他人的地方


    ### 學習


    - ◆ 獲得新技能，開拓市場

    - ◆ 享受刺激和挑戰

    - ◆ 創新和創造


    ### 權力


    - ◇ 影響他人

    - ◇ 影響決策和結果

    - ◇ 贏得他人的尊重與敬佩

    - ◇ 追求成功和卓越


    ### 社交


    - ◇ 享受與同事的情感聯繫

    - ◇ 與其他人互動，感受自己是一分子

    - ◇ 參與因工作衍生的活動和派對


    ### 時間


    - ◇ 充分利用時間，讓生活有節奏


    注意到了嗎？工作有兩個不同的功能：物質、財務功能（即獲得報酬）和個人功能（情感、智力、心理甚至精神）。最根本的問題是：正職工作的目的是什麼？實際上，工作只有一個目的：獲得報酬，這是工作和金錢之間真正的連結。其他的一只是是一種獎勵，有固然好，但與獲得報酬無直接關係，因為這些都可以在無償報酬的工作中，獲得同樣的好處。


    對於中產階級來說，工作帶來的壓力、困惑或失望，很少來自於工資多寡。從前面的討論已經看到，只要超過一定程度，更多的錢並不會帶來更多的滿足感。正職工作之所以會帶來諸多困擾，可能的主因是富足人生當中需要的啟發、認可、成長、貢獻、互動和意義，沒辦法透過工作得到。美國經濟諮詢會針對工作滿意度的研究，證實了這點。可以發揮自己的潛力、在同事間取得良好人際關係、工作帶來的樂趣及個人價值被認可，才是真正工作滿意度的來源，而不是報酬。你有想過，如果將大部分對工作的期望寄託在不以賺錢為主的工作上，這樣滿意感會不會比較多？


    這樣的觀念讓我們重新審視，究竟應該與工作保持怎樣的關係。工作目的有兩個，第一，取得報酬，供給生活的基本所需；另一方面，是金錢以外的目的，我們希望能透過工作成就人生的目標。但對於那些沒辦法賺到豐足養家的數百人萬人來說，第二個方向是可望而不可即的目標，即使夫婦兩人都已經很努力，所得還是很難應付自己及家人所需。美國是世界上唯一的先進國家，沒有透過立法，保障勞工有帶薪休假權利，一半以上低收入的上班族，沒辦法享有帶薪休假福利。


    > ① 參見：Ray, M. Sanes, and J. Schmitt, “No-Vacation Nation Re-visited,” Center
    for Economic and Policy Research, http://cepr.net/publications/reports/no-vacation-ation-013.


    ## 不該使工作和薪資掛鉤


    真正的問題，並不是對工作的期望值太高，而是將工作與薪資混溶在一起。正確的做，應該重新定義『工作』這個概念，工作應該被視為任何有生產力或有目的性的活動，而非僅限於給付薪資的職位，上班，只是眾多『工作』中的一種。這樣可以讓我們改正對『工作』錯誤的認知，養活一家生計，與食物和上屋頂整修，只要能帶給我們意義、目標和滿足感的活動，都應該視為工作的一種。打破工作和金錢之間的聯繫，使我們恢復平衡和理智。追求豐富的人生的重要手段，不再仰賴傳統定義的工作，應該擴大觀照面，宏觀地看到生活的全貌：追尋內在意義、強化與他人的聯繫以及實現人生意義和目標。


    把工作和薪資分開，等於是打開了另一扇門，讓生活的各個面向：從賺錢到照顧家人，真正結合在一起，找到真正的自己。到達了這個境界，就再也不用透過消費才能找到幸福，幸福會自動來到生命中。無論你喜歡還是討厭上班，把工作和薪資分開，你可以更清楚地看到在你的心裡，生活活力這個最重要的資產，到底佔了多重要的位置。


    還記得我們在第二章關於生命活力的討論：一個四十歲的人將剩下大約三十五萬小時；其中有三分之一（包括睡眠時間）用來睡覺，百分之十五用來做雜事（烹飪、清潔、修理東西、瑣事）。基本上，你可以將自己的時間用銀行帳戶分成兩半，這些時間是你僅有的，生命中沒有比時間更有價值的東西。將工作與薪資分開，代表你生活中每一個時刻都很重要，把時間根據自己的想法重新安排，絕是最值得做好的一件事。


    打破工作與薪資之間的關係，跟認識到金錢只是用來交換生命活力的工具，一樣關鍵、同等重要。金錢是生命活力的單位，它的價值不是來自外部的定義，而是來自於如何使用。同樣選擇如何工作，也是一種在內在價值的表徵；你所做的一切，都是一種「你究竟是誰？」的表達，而不是經濟上的考量及選擇。把工作和薪資分開，我們就應該重新考量生命質量及自我價值，並把這些當成最重要的人生目標。把工作和薪資分開看待，可以讓上班這件事及人生目標對焦在同一個方向，並找回自己的人生。


    ## 打破工作和薪資掛鉤所帶來的巨大影響


    從這個角度來看可以知道，為什麼每天庸碌地上班會是一個死胡同。除了賺錢之外，工作沒有辦法完成你的人生目標。每天八到十個小時。一週五天。一年五十週。四十多年的人生。


    這引發了很多問題，當你的人生走到滿足曲線最高峰時，那時的生活需要多少錢？你的工作是否提供這個數額？你用工作換來的金錢，是否低於應得的價值？賺回家的錢，是否低於生活所需？或者你賺到的錢，遠多於美滿生活所必需？多餘所得的意義是什麼？如果沒有意義，你的工作時間是不是應該縮減一點？把珍貴的時間拿去做更有意義的事？如果工作確實能豐富人生，那麼你的人生目標是否清晰？是否與價值觀吻合？你在上班時，是否能帶著愉快的心情？如果不是，你想改變嗎？


    我們先來探討一下，如果你重新定義了工作，而且把工作與薪資分開來看待，對人生會產生怎樣的影響？又如如果你把工作看成是完成人生目的的手段，而非賺錢的工具，又會對人生產生怎樣的影響。剛進社會的年輕人及職場歷練豐富的資深公民，比較容易這樣做。


    不少千禧世代的年輕人，在二○○八年金融危機之後才進入職場，當時股票市場價格下跌了一半。如果聽從父母的指示，依照父母的期望上大學背負學費，迎接他們的，就是大幅衰退的經濟及萎縮的傳統就業市場。


    他們被迫走向自行創業、打零工或是兼差市場的道路，適應這個不斷改變、機會稍縱即逝的社會。程式設計師、部落客、自由設計師或自行創業的年輕人，必須忍受長時間沒有收入、結果可能是一場空的環境。難怪，這世代的年輕人重燃對本書的興趣，並積極尋求財務獨立的可能。他們的生活有了更多不同面向，要賺錢，也要為興趣；熱情投入之餘，也會保留一些搞怪的空間。


    在年齡光譜的另一端，戰後嬰兒潮也已經快到退休年齡。靠社會福利過活的時候，他們也必須有另類、但不能遠離經道的方法賺錢，有了豐足的退休收入，他們大可含飴弄孫；如果錢不夠多，他們也可以靠照顧別人的孫子賺點小錢。他們的職業生涯，大部分時間只為一家公司工作，因此需要很大的勇氣及能量，才能重入職場，特別是現在的世界，年齡歧視非常嚴重。這就是說在職場中的老鳥，更應該將工作和收入分開看待。這樣會激勵你改變與金錢的關係，更可能達成提前退休的目標，一個充滿自由、無所憂慮的退休。


    ## 1. 重新定義工作，人生選擇更多


    假設你是一個天生教書的料，卻因為薪資較高而當程式設計師（你以為你真的需要這麼多錢）。按照舊的思維方式，每當有人問你做什麼時，你都會被強迫說：「我是一名電腦程式設計師。」內在的自我感覺和外在表現間的長期不協調，對你其實已經產生影響，你可能因此不開心而不自知，也可能因此生病。我們的一位朋友就是這樣，她放棄了成為鋼琴家的夢想，轉而成為程式設計師。她染上一種令人莫名其妙妙怪病將近一年之久。在這樣不協調的情況下，可能會刷卡買東西來解決心理及生活的不平衡。


    但你可能不會覺得問題出在職業，因為程式設計是你重要的謀生之道。當工資和工作之間的聯繫打破時，另一種選擇也會因此打開。當你被問到職業時，你可以肯定地說：「我骨子裡是一位老師，但是現在用撰寫程式來賺錢。」誠實面對你真實的身份，可以重新評估你的「職業」。你可能開始存點錢，回到學校取得教師資格。也可能因此減少寫程式的時間，多留一點時間，擔任教學志工。你可能乾脆開始教別人寫程式，也因此會開發第三個興趣，舉例來說：泛舟，同時週末時教程式，賺點生活費。將工作和工資分開，可以拆解你原本的生活，並以一種更好的模式翻新自己的生活。


    唐娜是一個成功人士，但越來越覺得折磨人的職場不適合自己。做為一名醫生，她發現自己很諷刺地在一個不健康的體系中，看護大家的健康，一週一百小時以上的超量工作，讓她沒有足夠的睡眠時間，更別談其他了。在擔任住院醫生的初期，她就知道這項工作需要長時間的投入，她沒有時間想關於金錢的任何事，也沒有時間考慮如何積錢。與另一位醫生結婚之後，這種麻木的生活模式更加嚴重。多年的工作，唐娜和丈夫積累了房屋和汽車以及海外投資，他們認為自己根本做不到財務自主課程要求的追蹤花費，執業相關的瑣事已經夠煩心了。


    但唐娜超級醫生的生活已經快過不下去了，兩個孩子的出生提醒她最重要的事情。她希望脫離醫療業務，重新找回一個可以讓人生平衡發展的職業。抱著惶恐的心情，她離開了醫院這個舒適圈，依照自己的人生價值，開設了清一色女性員工組成的診所，並獲得不少「好處」。


    她無意間聽到了財務自主的課程，非常喜歡，滿懷熱情地與丈夫商談，問他自己也關心的問題：「如果你不需要為錢工作，你會想做什麼事？」「你是什麼意思？」他回答。「我喜歡我的工作。」「但是如果你可以免費幫人家看病，也不用支付任何開銷呢？」「不想回答這個問題，他馬上睡著了。唐娜的老公還是上了課程，但新的執業方式，並沒有

    '
