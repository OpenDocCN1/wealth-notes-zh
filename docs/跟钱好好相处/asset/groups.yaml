    # 另一種「通貨膨脹」


    喬很喜歡說：「智慧的增長速度會超過通貨膨脹。」換句話說，你可以比金錢更快地一膨脹「你的技能、能力、知識、與另一半和社區的關係。


    學習與搭檔跳舞、在唱詩班唱歌、建立網站……一旦你達成財務獨立，將有更多時間學習；更多的時間來自己動手做；也有更多時間與他人聯繫；有更多的時間尋求讓生活更簡約的方法；有更多時間投入志工或加入教會。你的旅行可以便宜而優閒，而不是昂貴又匆忙。與上班族每日行程滿滿的狀況不同，你不用凡事遷就方便，可以花多一點時間做決定。


    不要忘記前面說的 ABC 財富，這是屬於你的東西，有形及無形的財富。但因為這個社會對 [關係經濟學] 不重視，所以沒有資本化。個人財務獨立就像人生的地基一樣，可以確保你的安全及自由。而經濟相互依存，則包括四個要素：能力歸屬感和社群，以及你得之不易的財產，這些構成你生活的基石，有形資產加上無形資產，會讓你的人生過得充實富足。


