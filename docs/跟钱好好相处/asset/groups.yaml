    他們甚至不知道在改善之前，把錢花到哪裡去了。然而，一旦你發現自己的收支圖開始轉變，那表示有一盞明燈已經點亮了。你存的錢越多，離財務獨立越近。存錢其實就像遊戲一樣。


    例如，檢視你的日常支出，你發現每餐中的肉類占據食物類別支出的最大部分，那麼你就可以把每餐肉類的比例減半，或是減少每週吃肉的次數。有個理財部落客就決定在一年內不買新衣服，結果他發現這樣做一點也不難。


    一個人住，對你來說可能太奢侈，你可以考慮把多餘的房間租出去。多一個房客，可能讓你的退休時間早一點，基


