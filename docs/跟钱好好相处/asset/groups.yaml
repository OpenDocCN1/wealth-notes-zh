    也沒有把處理家庭生活不安（因為工作負擔太重）的時間算進來；更沒有把平衡工作及家庭生活所需的花費及時間算進來。工作的影響是無遠弗屆，影響你整個人生。


    當馬克做完了這兩個步驟，他的人生完全改變了。他在建設公司擔任產品經理，已經十年。「我做這份工作其實並不快樂！」但他寫道：「在收入還可負擔生活支出的狀況下，我就阿
    Q 地想，『生活在大都市裡，不就這樣嗎！』」不過，馬克用了步驟二，好算了一下他的真實時薪，「在分析我的消費模式後，事情變得比較清晰。我賺的錢一半都花在與工作相關的事物上，油錢、保養、午餐、東花一點西花一點，大部分的钱就這樣花掉了。總之，我覺得我可以改做兼職工作，就在家裡上班，雖然收入只有之前的一半，但真的存到了錢。」這時他才了解，他可以放棄正職工作，尋找人生真正想要追求的目標。所有的事情都因此改變，他的財務人生改觀了，多年來，他不願面對的財務狀況改善了，準時繳交信用卡帳單、節省不必要的外食，同時跟老婆共同討財務事項，不再像之前常常口角。當他們重新安排經濟生活，才發現靠老婆的正職收入，整個家庭還是可以過得很好，老婆也能從事她喜歡的特殊幼教工作。而馬克對諮詢師及治療師的工作很感興趣，如此自己也有時間回學校再進修。「壓力的變得比較輕，以前我們忙於修補與金錢的關係，所以跟它的關係弄得很糟，現在我們知道，與金錢關係不應該只是鈔票的多寡而已！」'
  - '[PAGE 106]


    # 為何要這樣的練習


    +   1.  這個練習用一個比較全面及真實的面向，來看待全職工作這件事，並且，讓大家都知道，自己真正的薪資是多少，就是表中最低層的數字。


    +   2.  這個方法用你真正的薪資當作指標，更真實地評估自己現在及未來的職場生涯。按照步驟及最後得到的數據及結果，可以檢視自己的工作狀況，如果一個工作，需要很長的通勤時間，或是需要花錢治裝打扮，薪水可能就沒有表面上的數字多。考慮轉職的正確指標應該是，你想要讓你的生命力用多少錢賣出去？


    +   3.  了解你真正的所得（earnings），會讓你更清楚到底工作的動機是什麼，選擇工作時也較有所依循。馬克的例子並非個案，把錢花在從工作衍生出來的費用上，主要就是为了保住工作，很多人卻始終認為自己很有錢。而另一個進行財務獨立計畫的人，他說做完這個練習之後，他對工作相關支出更敏感也更在意，因此使得淨收入增加了一倍——旦了解日常花費有多少是為了工作後，他免除了不少開支。例如，他開始帶便當，省了外食午餐的花費，以前自己開車上班，現在改乘大眾運輸（在搭車的过程中順便自我舒壓，是另一項多出來的好處），也省思是否需要這麼多不同樣式的服裝，甚至開始每天跟太太健走（也因此改善夫妻關係）。不少人以這個方法當作指標，用來選擇工作，當算清楚真正時薪之後，更能判斷這個工作到底值不值得繼續做下去。有一些曾經很想應徵的工作，用這個方法驗證，發現根本不值得ㄧ試。'
