  - '[PAGE 41]


    # 第 1 章


    # 金錢的陷阱：

    古早時期的致富之道


    # 錢是個溫柔陷阱？


    「要錢，還是要命？」如果每個人，拿槍抵住你的胸口說這句話，你會怎麼做？大部分人應該會把皮夾交出去，這樣的威脅會奏效，主要是我們認為生命的價值比錢高得多，真的是這樣嗎？


    瑞秋是個成功的業務，每週工作七十小時，但她說：「讀完了《富流感》（The Lottery of Affluence），這本書之後，我發覺『人生有些東西不見了』，不只我以為這樣，當我跟別人聊天，他們也有同樣的失落感，買了一個什麼東西都有的大房子，真的是所為何來？我真的要一直一直工作，然後變得一無是處，然後退休？然後把時間都花在購物上，花的還是辛苦省下來的錢，一直浪費時間，然後等著生命到終點？」


    唐恩熱愛音樂，卻始終在做資料處理工作，他放棄了嗜好及人生可以同時存在的想法。'
  - '[PAGE 42]


    他不確定生而為人的目的，以為人生是一場困境，不確定自身的價值。他認為成年後所有因頓接踵而來，他大學畢業，娶妻，有一技之長及工作，買房，也有房貸，還有一片庭院等著除草，但他不認為自己過得像人，總覺得人生被囹圄。


    伊蘭一直不喜歡自己電腦程式設計師的工作，對於工作只肯做到六十分，而公司也找不到開除的理由。她一直想像自己成功的樣子，開跑車、擁有鄉間別墅，但無法改變工作時的無聊，放假時她會去旅遊，也參加一些工作坊，但還是沒辦法找到平衡。她最後認為，工作不如意念會持續啃食人生的核心，而後半輩子可能就要這樣過了。


    克里斯蒂跟丈夫是典型的頂客族，雙薪，沒有小孩，在科技業領高薪。夫妻倆年輕俊美，應該有美好的人生？但當克里斯蒂看到同事被壓力擊垮，差一點過勞死，一星期後這位同事傷沒事般回到工作崗位，她知道這樣的生活一定有問題。她的長官因為血管阻塞住院，最好的朋友被開除，克里斯蒂開始焦慮，半夜三點就因壓力過大而驚醒，她想：「不能再這樣下去了，這樣不值得！」


    妮可跟隨父親的腳步，她爸爸是律師，也鼓勵她成為專業人士，因為職場會走得比較順。妮可花了八年時間，拿到護理醫師（Family Nurse Practitioner）學位，但卻也因此承擔十萬美元的債務。如今畢竟不是父親從法學院畢業的一九六九年，現在是二〇一一年，妮可賺的錢，扣除員工薪水、房租、雜支、保險之後，連貸款的利息都不夠付。即使她在一個熱門的行業工作，仍感覺人生在倒退。她對朋友坦承：「我可能真的付不起這些債務了！」


    布萊恩趁著朋友凱文進城時，兩人抽空見了面，凱文在高中時毫不起眼，但現在是線上'
  - '[PAGE 43]


    教育的六大宗師之一。布萊恩一直想請教凱文如何成功，因為他也想靠教育撐住自己的家庭，在家工作，教導學生有效學習的工具，並且趕快上手，過優渥的日子，希望得到凱文現在擁有的一切。然而，雖然線上教學看來很容易，每個人好像都可以在線上開課收錢，但其實，成功根本沒有這麼容易。布萊恩花了不少錢，找同業高手指導，學習當老師，也花了比預期更多時間準備課程，但重金打造的金鵝，始終沒有下金蛋。


    雖然有人真的很愛工作，但極少人能誠實地說，我的工作及人生很完美。完美的工作，既有趣又有挑戰性，又能適時享受及放鬆。守得孤獨，才會有生產力，付出時間，工作才能做得好；放鬆時間夠多，才覺得有充分休息；有貢獻，才會覺得缺你不可；有獎勳，工作起來才會更有趣；即使最完美的工作，也是有捨有捨才會有得。


    人近中年才驚覺，人生竟然跟父母過得一樣。連有好職業的人都可能感嘆，竟然已經補牙補了二十年，只因為十七歲時夢想成為牙醫師，投入世界上最棒的工作。我們不知不覺進入「真實世界」，一個充滿妥協的人生。我們以為可以拿到人生的金牌，但每天結束前躺在沙發上卻不妨唏噓，也許人生就是這樣了！


    大多數人都期盼人生過得精彩，總覺得人生要過得更有意義，過得更滿足更豐富，但時間一久，當工作太多量占據人生，日子被「待辦事項」填滿，精彩人生的念頭就一點一點消失。你將會發現本書中提到的故事，都希望人生有另一種可能。人生過得更真實、更豐富、更有意義，同時也能有富足的物質生活，既滿足基本「需要」，也能成就「想要」的欲望，在內在及外在之間找到平衡點。希望「工作的我」、「家庭的我」及深層「內在的我」，能夠維持好的關係，而且找到方法，'
  - '[PAGE 44]


    謨工作不僅是過生活，也能豐富多彩。希望當人家問及：「要錢，還是要命？」時，能果決地回答：「我兩個都要，謝謝你。」


    # 我們不是在過「活」是在找「死」


    對於多數的工作者，不管你是熱愛工作還是勉強餬口，在錢及生活上一，都很難有自主的選擇。用工作換錢，取決於你醒著的時間有多少，剩下來 的才是真正自己的生活。美國大部分的工業城市，受薪階級的生活大概都從一大早開始，鬧鐘設在六點四十五分起床，查看手機、盥洗，穿上制服。若是醫療從業人員，會開始清洗雙手、穿上無菌衣，建築工人則穿上牛仔褲及T恤。如果有時間就順手抓了早餐，拿起通勤馬克杯及公事包，提了午餐盒就急忙出門踏上班，很快就陷入車陣中，若是公車或捷運族，就得擠在滿滿是人的車廂中。上班族從上午九點到下午五點（或更長），應付老闆及豬隊友，周旋在供應商、客戶及病人中間。電子郵件爆多，做事行色匆匆，還得三不五時查一下社群媒體動態，同時隱藏自己犯的錯，在交代一個逼死人的截稿期時，微笑地向對方致意。知道公司是要裁員，但聽到「組織重整」或「縮小編制」時，還要裝作如釋重負，知道不在裁員名單中時則暗自竊喜。


    肩上的擔子越來越重，時間越來越緊迫，在表面上同意老闆意見時，還要跟自己的良心拔河。笑一下吧，終於五點了。跳上車、擠進捷運或公車，回家陪另一半、小孩或室友。做完之後，也不忘拍張照上傳臉書，邊吃晚餐邊追劇，回幾封電郵再上床，幸運的話可以睡滿八小時。


    這樣叫作「過日子」？想想吧！這世界上有多少人，在一天上班結束前表現得比踏進辦公室'
  - '[PAGE 45]


    時更有朝氣？我們每天下班回家時，心情會比上班「過日子」的時候更好？當我們踏出辦公室，與家人或朋友相處時，有覺得精神更好、更充滿活力嗎？工作時該有的人生到底在哪裡？對於大多數人來說，透過工作來「過這樣的日子」，其實是一種「謀殺人生」的舉動。為了工作賺錢，我們常常不自覺「謀殺」了健康、與親人的關係、快樂的能力及探索的好奇心。


    為了錢犧牲生活，這過程日復一日、緩慢地進行，我們竟然都沒注意到。灰白的鬢角、中廣的身材，跟公司角落的斑駁辦公家具沒什麼不一樣，一台公務車及年資，是我們匆匆人生唯一留下的地標。最後，我們生活必需品得到滿足，有亮眼的領導甚至優雅的生活，但在內心裡，我們已經被封鎖在「九點到五點」這個僵固的生活模式中。


    如果，我們不工作，多出來的時間該做什麼？本來希望透過工作，完成人生夢想，找到生活的意義，但這些想法，逐漸在職場政治、身心透支、工作無趣及過度競爭當中，一點一點消失。


    小時候那些充滿奇幻想像力、大學時期懷抱的遠大理想，內心因為愛觸發的激情，這些大大小小的感動，就一點一點被遺忘了，都塵封在「年輕真好」的檔案夾中了。就算是你喜欢工作，覺得透過工作能有一些貢獻，都可能會認為有其他的工作領域，能夠更享受人生。擺脫朝九晚五的工作模式，這樣的滿足來自於找到一種真正熱愛的工作，不受限也不擔心被開除，陷入失業的窘境。有多少次我們自問「我想依自己想法，但懂事會希望用他們的方法行事」？我們要為了蝸口，犧牲多少夢想？'
  - '[PAGE 46]


    # 我們以為自己是為工作存在


    就算我們能脫離既不快樂又違背價值觀的工作，在心理上，我們也很難釋放自己。我們對自己的價值及認同，多半來自於工作。工作取代了家庭、社區、公益、宗教、親密夥伴，成為我們自我認同、喜怒哀樂的最重要來源。想像一下，當別人問你：「你從事哪個行業？」而你回答：「我是○○○。」這時你感到驕傲嗎？還是羞愧？倘若你覺得沒有過上自己預期的人生，你會這麼回答「我只是一個○○○」嗎？你感覺高人一等？還是不如別人？你充滿防禦心態嗎？你誠實嗎？你會在自己眼淚上灌水，讓身分地位聽起來比較響亮嗎？


    你曾經用薪水高低判斷一個人的價值嗎？當高中同學會時，你如何評斷老同學是否成功？你會問同學，你的人生圓滿嗎？有依照自己的價值觀生活嗎？還是你會問他們在哪裡工作？職位多高？住哪裡？開什麼車？小孩在哪個大學念書？這些都是社會上定義「成功」的重要象徵。就像種族及性別差異一樣，社會上對能賺多少錢有著一個看不見的階級觀念。我稱為「職業主義」（jobism），職業及工作成為人與人之間互動的基調，在社會上如此，在家庭中也一樣。我們會認為家庭主婦是次等公民？或認為老師的社會地位比醫生差？其實老師在處理問題學生時，與醫生在對抗疾病或面對死亡時，所採取的手段相去不遠。也許大家不自覺，但在我們與他人的日常互動中，已經把「你在哪高就？」當成判斷一個人價值高低的重要指標。


    ❿參見：Douglas LaBier, *Modern Madness* (Reading, MA: Addison – Wesley, 1986), as
    discussed in Cindy Skrzyczyk, "Healing the Wounds of Success," *Washington Post*,
    July 23, 1989.


    ❿ 編註：簡稱經合組織，是全球三十五個市場經濟國家組成的政府間國際組織，總部設在巴黎。'
