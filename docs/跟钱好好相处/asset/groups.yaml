    的價值，就算是親人禮物也不要漏失。如果發現已經搬走的室友留下的液晶電視，也別漏算。就算你因為衝動買的東西而感到不好意思，也不要停止，繼續把鞋櫃裡的二十幾雙鞋作好盤點；不要因為發現整套原封不動的健身器材而感到罪惡。你反而應該欣慰，因為你終於了解放在倉庫內的健身器材原有多少價值，不是讓你減輕多少公斤，而是拍賣後你能拿回多少錢。


    有些人在一兩天內，就做完了整個清點工作，但曾經有個女生花了整整三個月才清點完整個庫存。她翻箱倒櫃檢查每張照片，打開每個櫃子、抽屜及盒子，不只清點財務，更回想當初它們是怎樣進入她的人生。這個經驗讓她更感受現在所擁有的。因為人生中的不滿足，通常是我們只看到了什麼，卻沒有看到我們已經擁有什麼，只要念頭一轉，看事情的方法及角度就會改變。有些人認為，只要我們生活在基本條件之上，繁榮及貧窮的分界就在於你是否有一顆感恩的心。


    # 負債


    這個項目包含你的所有負債，不管是金錢、貨品或服務的應付債務，還包含未償付的票據等。如果你已經將房產的市值算出來，也要把未繳稅的房貸一併計算；車貸也是。不要忘了列入銀行貸款或向朋友借的錢、信用卡債，學貸以及未付清的醫療和牙科帳單。


    # 淨資產


    把你的流動資產及固定資產加總起來，減去負債金額，簡單的說就是你的淨資產。這個數字就是真真切切你這一生迄今賺進來的錢，其他的都是回憶及幻想，這就是你的資產負債表。當然，這並沒有把非物質的資產算進來，例如：你的教育、人生歷練學來的技能，請別人喝酒換來的情'
  - '[PAGE 79]


    # 為何需要資產負債表


    誼，退稅單，或者是因為你加入了一「正確」的社團而帶進來的生意機會。這些無形資產雖然有價值，但因為沒有具體形象，所以沒有辦法計算出確實、客觀或量化的數字。練習之後得到的數字不管是悲是喜，你將面對許多真相，可能會很痛苦，但或許也是個解脫，不論你要面對如何的情況，你計算出來的淨值，並不等於你這個人的價值，千萬不要因此喪志。


    雖然這個練習一開始好像並不怎麼有趣，但做到了這個地步，過程應該頗有收穫，雖然實際的財務計畫及新的財務人生，仍不是非常具體，方向也並不清楚。就財務面來看，你現在比較像車子已經上路，但目的地是哪？茫無頭緒，只在浪費汽油、亂轉方向盤，哪裡也到不了。在人生的路上，你可能有很多美好的回憶，也得到無形的資產，但能轉換成現金的人生紀念品並不多。


    一旦你能有清楚的方向及支配財務的能力，你對前景將更有把握，生活將遠比以前更有效率。你現在對自己的財務狀況已經有了更清楚的認識，也能客觀地選擇是否該將固定資產轉換為現金，升高存款水位，或是用來減輕自己的債務。


    有一位學員計算完自己的資產之後，把一些生活中不必要的東西變現，並且開始存款及投資，馬上就有利息收入，在不變動生活方式及不犧牲舒適度的情況下，即刻讓自己往財務獨立又靠近了些。就算她沒有立刻採取積極的改變，這份體悟至少讓她開始投入更多的時間及賭注在自己真正喜歡的事，例如關愛他人及藝術。


    另外一個學員透過清點資產，瞭解到生命中其實不需要這麼多根本用不到的東西，一直放著純粹只是以為「有一天可能會用到」。他的做法就是將這些無用的舊物變現，再購置一些以後用得'
