    # 不動產


    下一個策略是投資房地產。如果你找到一個喜歡的社區，買一套有庭院、雙拼或四層式的房地產是不錯的選擇。這樣做，不僅可以在社區中敦親睦鄰，把其中一間套房租出去，還能創造穩定的收入來源，以支付房貸及分期付款。


    崔奇（Scott Trench）是《打造生活》（Case Study）這本書的作者，也是一位房地產顧問、中介和部落客。他說，「大家都知道，如果想買房，最好買一個可以增值的物件。通常情況下，小型雙拼、三層式和四層式的住宅，除了家庭使用之外，也可以把空餘空間租出去。如果你手上的不動產物件沒有超過四件，可以申請聯邦住房管理局（FHA）的低利房貸（通常利率可以低到三、五％），但要在當地居住滿一年以上，才能買下一間可以創造收入的房屋。你可以研究自己有興趣的區域，再磨練出租物件的基本管理能力，選一個安靜、適合人居、容易出租，且銀行願意貸款的房子，就能創造租金收入，我自己就曾經這樣操作過，有很好的經驗。就像買一間自己要住的房子一樣，需要基本而簡單的照顧，就能擁有一間房子，而房客租金會幫你繳付銀行貸款。」
    [注]


    以下就是評估投資物件的注意事項：


    +   - 房子所在地點住起來舒不舒服？你不想在未來的幾年中，甚至永遠，成為這個地方的一分子？


    +   - 該地區的發展前景如何？它可能會升值嗎？鄰里可能會保持和諧及安全嗎？


    +   - 會創造多少租金收入？


    ◎ 參見：Scott Trench, email message to the author, April 10, 2017.'
