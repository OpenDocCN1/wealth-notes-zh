    # 找「死」的代價很高


    心理學家賴比爾（Douglas Lillard）在其著作《現代瘋狂》（Modern Madness）中，提出了「社會疾病」（social disease）的概念。他發現所謂的成功人士，往往拖著疲憊的身軀及空虛的心靈上班，他警告過分看重物質主義這件事，已經戕害身心靈的健康。他發現社會價值過度集中在金錢／地位／成功，往往讓成功人士忽略自我實現及人生意義的重要。幾百個研究對象中，有高達六成的比重，出現沮喪、焦慮及其他與工作相關的症狀，幾乎每個研究對象都有壓力過大的問題。


    即便在美國，每週最多上班四十小時的做法已經超過半個世紀，但專業人士往往認為必須加班或是在假日工作，才不會被同儕拋在後面。經濟合作暨發展組織（OECD, Organisation
    for Economic Co-operation and Development）®在二〇一五年發布的研究顯示，一一%左右的美國人每週上班時數超過五十小時，另外一項美國經濟諮商會（Conference
    Board）的研究也發現，逾半數美國人「滿意自己的工作⑧，自願加班工作犧牲享樂。結果呢？如何賺錢？賺多少錢？成為美國舉國上下的通病。


    # 錢都用到哪裡去了？


    就算我們過得不快樂，但至少掌握了傳統定義「成功」的重要成分：銀行中的錢。但真是如此嗎？美國人的儲蓄率其實逐年下降。根據美國商務部經濟分析局（US Bureau
