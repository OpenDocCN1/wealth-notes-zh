    \  - 為紓解工作不愉快的犒賞\n  - 便利商店花費\n- 舒壓及吐苦水：\n  - 小孩大吵\n  - 恢復理智\n  - 整理情緒\n  - 替代性娛樂\n\
    - 逃避式娛樂：\n  - 電影\n  - 酒吧\n  - 有線電視\n  - 線上內容\n  - 電玩\n- 度假／玩具：\n  - 健身器材\n  -\
    \ 運動器材\n  - 划船\n  - 度假小屋\n- 工作帶來的病痛：\n  - 感冒\n  - 為背痛按摩\n  - 壓力太大住院\n- 為了工作衍生的金錢及時間：\n\
    \  - 找人幫忙\n    - 打掃家裡\n    - 除草\n    - 看小孩\n  - 托兒所\n  - 補習\n  - 專業雜誌\n  - 會議\n\
    \  - 成長課程\n\n### 勿羞愧，不責怪\n\n請記住，這是你對工作／職業／身分認同的感受最強烈的地方。有同情心的自我覺知是關鍵。只要注意每一種感受，不要加以批評，也不要批評工作、老闆、你自己或這本書。如果你一直為薪水在工作，又怎樣呢？如果你為了又活過一週而「獎勵」自己卻超支，又怎樣呢？如果你過著快轉生活而領十美元時薪，又怎樣？這一切都過去了。這是你知道「金錢」你的生命力「之前認為需要做的事。\n\
    \n### 記錄金錢流向，追蹤生命力\n\n到這樣，我們了解了生命力活力才是真正的金錢，也學習如何算出要用多少小錢才能換到一個小時的生命活力。現在，我們對於生命活力的費用必須用心，每天的收入及支出都得小心追蹤。這個單元中的第二個步驟很簡單，就是把所有生活中進出的錢記錄清楚。對於錢這件事，很多人喜歡刻意假裝清高。他們把「金錢」與「愛」「真實」「美麗」「靈性」放在兩個不同的箱子裡。許多人把一切都攤在愛人前面，卻從來不給他們看看自己荷包的真實狀況。\n\
    \n不少家庭債台高築無法自拔，因為要大家少花一點不必要的錢，好像是違背愛的舉動。很多服務機構撐不下去，因為不好意思跟大家伸手要錢，雇用一個專責處理社區大小事務也無以為繼。對於討債或借出的東西，朋友間也不容易啟齒，因為一直追著人要東西，好像會惹人厭，堅持對方一定要還錢，聽起來更討厭。父母與孩子間也是這樣，跟親近的人討錢，讓原本「愛」的交情蒙上一層陰影。這些想法，都源自於一個根本的概念：金錢是金錢，愛是愛，這兩者永不見面\n\
    \n### 心理的紀律\n\n（napa sī paṭiṭṭhā）．看看你自己的狀況，你是不是常常以愛之名容忍自己的糊塗帳？\n\n從古至今，宗教總是用盡方法，讓大家活在當下。他們的方法五花八門，例如：觀察呼吸如何吐納、重複誦念一個相同的詞以專注想法、集中意念在一個物體上，讓它就在當下存在著；或是練習不同的武術（含氣道或空手道）；或從事不同的「內觀」活動。我們也發展出一種心靈的訓練機制，以提振對金錢的覺察，這個方法對於學習財務來說不可或缺，對習慣偏重物質思考的西方文化，也比較容易接受，不用觀察呼吸，而是學習看顧自己的金錢。\n\
    \n這項練習很簡單：好好記錄每一分「進」、「出」你人生的錢。這項高度有效的財務轉型方法，只有一個動作：好好記錄每一分「進」、「出」你人生的錢。這就是：好好記錄每一分「進」、「出」你人生的錢。再說一次，這項充滿神奇的方法，做到這件事，其實沒有特別的方法，沒有教科書，也沒有參考書籍。對很多人來說，只要靠一本口袋裡的小本子，把所有進來的錢，和離開你生活的錢，一一筆記下來。有些重視時間更甚於金錢的人，會把支出及收入，記在行事曆旁邊，設計一個特殊記帳的空間。有人會把進出的金錢，跟聯絡人、工作事項及行事曆，一起記錄在手機或電腦裡，還跟銀行帳戶及信用卡進出串連，隨時都可以看到自己帳戶裡進進出出、來來回回的情況及金額。現在有很多數位記帳軟體，對於記錄金錢進出來說比以前方便，找到最適合你自己的，就是最好的方法。\n\
    \n有不少人，就敗在這個階段，不願意老老實實地把錢一一筆記下來。太難、太瑣碎、花太多時間、挑戰性太大、衝突性太高。每一分錢嗎？太難了！那每一塊錢？還是每一塊錢？\n\
    \n### 落實記帳就能清楚財務\n\n凱洛琳是天生的記帳員，但她的先生卻不是。他說，「一一毛這樣算，沒有用啦！大部分的人也不想過這樣的生活。」幾年前，她說，「我想了一個辦法，把他帶進記帳的世界，為適應他的想法，我改變了一些方法，結果非常成功！」她用忽略零頭取整數的方法，在能力範圍內盡可能做好，但卻不執著、容忍一些計算的錯誤，並增加了一個專門放錯帳的欄目。這個欄目裡，有時一毛錢也沒有，有時忙亂的一個月錯帳金額高達兩百美元。「以前碰到這種情形，我會發瘋，但我這次沒有，因為我先生開始注意數字的變化了，也留意一些小額花費及細項的帳目。對於大數目，他更在意了，注意到錢是不是花得有效率，是不是花在刀口上，這樣比我們大多吵有效多了，我非常開心！」\n\
    \n多年來，麥克帶領一個倡導簡單生活的團體，他鼓勵大家用這些步驟，重新整理財務人生，他及太太都是忠誠的實踐者，結果非常令人滿意。他花的每一塊錢都記在帳上，但當他移居到新社區，麥克終於知道，為何不少團體學員在執行步驟二時都覺得傷腦筋。\n\
    \n因為這次他捲起袖子自己蓋房子，每天要處理的帳單及交易大量增加，花非常多的時間在海記花費及整理帳單，於是他決定起用簽帳卡，利用銀行的服務，把帳單及帳務整理好。這樣改變記帳的習慣，讓他的生活過得更簡單、更容易。\n\
    \n有讀者說，對於財務專業人士來說，記帳可能是家常便飯，就像呼吸一樣自然；但對於那些右腦發達（個性偏創意及直覺思考）的人來說，記帳就像是用非慣用手寫字一樣困難。凱倫就寫道：「我喜歡把進出帳目都記下來，在這樣做了十四年之後，我還是樂此不疲，很難想像有一天我不這麼做的樣子。我每年花一半的時間待在歐洲（法國的一個船屋中），一半的時間在美國，我樂於投入志工，也喜歡旅遊！」凱倫是一個天生的記帳好手，如果你是一個偏創造力及感性的人，不仿像麥琴一樣，用簽帳卡消費，讓銀行幫你處理記帳這件事。你會感覺比較容易控制，生活也過得比較平靜，以前覺得一團迷霧的帳目變得比較清楚。當進出的帳目，跟創意、冥想及旅遊放在一起，就很容易變成習慣。\n\
    \n年輕的唐恩是個人理財及提早退休部落落格「金錢鬍子先生」（Mr. Money Moustache）的忠實讀者。唐恩開始記帳之後，對自己收入的進出有更清晰的了解，也因此改變上餐廳吃午飯的習性，換成自己帶便當，也常常洗手下廚。他說：「對我來說，想通這點，記帳變成我給自己的責任，而不是任何高牆在上的人逼我做的事，讓我了解錢是怎樣被花掉的，餐飲支出因此省了一半，每個月省了好幾百美元。我開始意識到如何支配花費，這讓我省下好多以前靠直覺的消費，把錢用在更重要的事，稍減少多省下的錢，讓我到歐洲玩了三個星期，開心極了！更有效率的支配錢，也能為未來多存一點錢，把錢花在我喜歡的事，日子也過得更輕鬆更快樂！」\n\
    \n不論你選擇什麼方法，趕快做就對了（只有你動手做，我們講的這些，才會真的發揮作用），記得方法一定要正確。好好記錄所有進出的錢，讓它變成習慣，除了數目不要錯以外，別忘了把原因也寫清楚。每一次花了錢或收到了錢，都要馬上記下來。\n\
