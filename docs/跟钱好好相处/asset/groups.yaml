    ## 政府公債入門


    債券就是一個借條，債券發行人承諾在債券（面值）的某個日期（到期日），向債券持有人支付債券上印的金額。大多數債券還以特定的比率（票面利率）支付利息。


    這筆金額雖然以年利率方式報價，但通常半年就會付息一次。公債就是政府借錢的方式。政府通常每隔幾個月，就會發行一張新債券，到期日期通常分為十年、二十年或三十年。


    新發行的債券，最重要的一件事就是償還金額給即將到期債券的持有者，剩餘的錢用於彌補聯邦預算中的赤字。政府有義務清償國債及其衍生的義務，債券的本金和利息必須在到期日前支付，然後再支付其他費用。如果不這樣做，就會破壞美國政府在市場上的「信用評等」。


    ### 購買國債風險相對較低


    喬和我開始投資的時候，世界各國對美國債信能力還是保持懷疑的態度，所以政府不得不支付高利率吸引資金。這為財務獨立者提供了非常好的機會，三十年期國債提供了一個「買了，就放在一旁不用管！」的黃金機會。債券價格隨著利率波動，如果在到期前出售債券，你拿到的錢可能會多於或少於（賺或賠）當初買進時支付的價格（市場風險）。如果一直持有至到期日，無論當時的利率如何，都將收回票面上的金額。


    新發行的美國國債，可以透過美國財政部直接經營的網路服務（TreasllCus），向聯準會的窗口買，不需要任何佣金。不需要中間人，也沒有經紀人，當然可免除額外的經紀費用，你也可以透過經紀人購買已發行的流通國債（最低收費）。你也可以經由次級市場，向任何持有國債（任何時間發行的債券都可以）的人購買。根據當時利率的高低，你買到的國債有可能高於或低於面值。許多人不偏好在次級市場上購買債券，而不是直接從美國政府購買債券，因為他們比較願意擁抱有債的「真人」交易，而不是為美國債務注資。


    > 註：次級市場是初級市場發行後之有價證券買賣的交易市場。功能在於讓最初的投資者可以賣出持有的有價證券以變現，改作其他用途。


    ### 高配息公司債具吸引力


    ○○○二年，美國國庫券、債券的利率已下跌至一%以下的低點，現在仍然維持在低檔，但是沒人能準確知道這趨勢何時會轉變。若真的開始轉變，你可以再回到本節。如果你喜歡低風險的債券，不想只押一支債券，可以購買債券基金，這將在後面介紹。喬並不推薦公司債券，但是一些財務獨立的人認為，只要發行企業願意多配息，公司債也很具吸引力。


    就像美國財政部和機構債券一樣，公司債也是債務工具，利息按季度或每半年支付一次，並在到期時將本金退回。與政府債券一樣，它們有標準普爾或穆迪或其他評級機構的信用評等，通常債信等級要在BBB以上，才比較適宜投資。一些追求社會責任投資的投資人，也許還是對美國政府有充分信心，如果是這樣，可以試試美國機構債券而不是美國國債。機構債券曾把募集來的資金，支持你可能關心的特定部門（農民、學生、房主、小型企業），不像聯邦政府債券，以還款義務及軍事事為優先項目。


    ### 一個警告


    關於投資收益，喬總是給投資新手最少的期待，他發出警告：在市場上沒有什麼是確定的。沒有一件事是確定的，這就是人生。如果你不喜歡，就不會有好運。如果有人告訴你，有一點費力、萬無一失的賺錢方法，喬會說你是傻子。


    我這裡有一個故事：在過去，喬只對少數有興趣的人傳授財務獨立課程，每當學員達到財務獨立的某個階段時，他會給他們一張變質的俄羅斯沙皇債券。在電子交易及債券集保不盛行時，債券的持有人會真的從債券上剪下一個利息券（coupons），用這個利息券跟債券的發行者領取半年債息。喬的這張債券在一九一七年沙皇倒台之前一直付息，但在俄國革命之後，就變成一文不值。五十年後，喬在偶然機會下買了一盒沙皇債券。喬給達成財務獨立的人這張債券，主要是想提醒，沒有任何投資可以保證地緣政治或經濟條件不會改變，也不要天真地以為鳥巢裡的錢夠長久給你的固定的收益。投資人一定要小心。


    ### 低成本指數型基金：防火方案


    如果不買國債，那麼應該投資什麼？大部分的財務獨立者都建議：指數型基金。一九七五年創立的先鋒（Vanguard）資產管理公司創辦人約翰·柏格（Jack Bogle），發明了指數型基金，使投資變得更簡單易懂：把賺來的錢低成本地分配給股東。跳過中間人抽取的佣金及大幅降低管理費用，先鋒為散戶及其他基金公司富達（Fidelity）和嘉信（Schwab）打開了大門。對於財務獨立者來說，指數型基金非常接近「買了，就放在一旁不用管」的原則，是債券以外的理想投資標的。


    股神巴菲特曾說：「指數型基金是絕大多數投資者明智的選擇。」他解釋：「例如，透過定期投資指數型基金，一般投資人可超越大多數投資專業人士。」指數型基金或ETF設計為追蹤市場上主要指數（如道瓊工業指數、那斯達克綜合指數和標準普爾五百指數）或債券市場指數。


    > 參見：約翰·柏格著，《一本會學識投資》（The Little Book of Common Sense Investing: The Only Way
    to Guarantee Your Fair Share of Stock Market Return），天畜出版商有限公司，二〇一五年。


    指數型基金的目的不是像傳統共同基金一樣想要打敗市場，而是希望追蹤指數，盡量跟隨指數起伏，是一種被動投資的方法。透過分散投資，建立相對穩定的投資組合，很適合財務獨立人士期待穩定但風險不高的長短期收入，因為低管理費、分散投資的特性，很適合財務獨立計畫。


    然而與債券不同，指數型基金或ETF透過投資一籃子股票，因此無可避免會隨市場波動。千禧年世代的財務獨立者偏好指數型基金或ETF，就像嬰兒潮世代喜歡銀行一樣，手頭只持有少量流動現金，將手邊剩餘的資金都投入到這些基金中。


    曾經經歷景氣上沖下洗的人，可能不相信專注在股票市場的金融商品，其穩定性能與銀行相比，但是對於只看過道瓊指數不斷上漲的年輕人而言，投資ETF，因為可享有個人退休金帳戶或529退休帳戶稅收優勢，因此，不投資指數型基金，似乎是個愚蠢決定。不過，切記喬提出的「一買方當心」警告：在過去的九十年中，股市已經有五次大跌幅為三%到八%，其後的恢復時間從四年到二十七年不等。以下這些數據可以當作參考：


    - 經濟大蕭條時期：道瓊指數下跌八六%，花了二十七年才復原

    - 在七○年代中期：道瓊指數下降四六%，將近十年後恢復

    - 一九八七年底：在短短三個月內下降三%，四年後恢復

    - 二〇〇七到二〇〇九年金融海嘯：美股下降五〇%，需要六年才能恢復（如果漲跌循環從一九九九年網路股高峯算起，則是花了十四年才復原）


    年輕投資者曾經經歷的兩次股市波動，網路泡沫及金融海嘯，都是例外。因為它們用了不到十年的時間就恢復，但這並不意味著市場的週期性已暫停。相較之下，債券基金的波動性要小得多，當市場巨幅波動時，只損失幾個百分點。


    ### 指數型基金的投資哲學


    信仰柏格理論的投資人，深信他們可以成功地管理風險，並獲得比一般投資者更高的回報，許多人把資金押注在下一次科技股的狂潮。他們的做法可以歸結為以下理念：投資於管理費用低的指數型基金，透過特定商品的多元化投資，長期持有這些資產。


    為何指數型基金的收費較低？因為指數型基金採取被動式管理，不需要積極管理及投資，不需要養一個研究團隊選股，不像傳統共同基金必須建立研究團隊，從股海中挑選好公司，以達成超越市場指數的目標。因此，指數型基金行政管理費用較少，管理費較低廉，當然對投資者更具吸引力。


    這些費用或費用比率，按投資金額的比率收取（請注意，市面上已經買到社會責任投資類的指數型基金，其管理費約○．一二％至○．五％，較一般指數型基金高，但遠低於傳統共同基金），你只要決定要把錢放在哪一類的指數型基金上。雖然投資指數型基金很簡單，大部分管理費也相當低廉，但仍有一些決定要做，例如你要投資股票指數型基金？還是債券類的指數型基金？國內或國際？大、中、小型資本？或是把不同種類組合起來？將投資集中在美國債券指數？或是全球股票市場指數？這些組合，可以讓投資人參與世界不同的市場，降低整體風險。


    ### 善用公司退休計畫


    對於那些還處於賺錢年紀的人來說，不少公司都提供傳統個人退休金帳戶的計畫，這些計畫都可以讓你選擇把錢投資在指數型基金上。如果你的公司有提供退休計畫，務必把被動管理的低成本低指數型基金，納入你的考量。如果可以，請考慮全額自願提撥，非常划得來。還記得我們前面說的，在全職工作階段盡量省錢，為年老退休做準備，將一部分錢提撥進退休專戶還可以節稅。如果你的公司沒有提供退休金計畫，仍然可以透過經紀公司建立退休專戶。這與儲蓄的功用相近，但長線增值潛力更高。


    若你遵循上述建議，縮小你的投資範圍至指數型基金，接下來要做的選擇就變得比較簡單，如果你覺得聽起來很無聊，那麼你就做對了。長期投資不是一個快速致富的計畫，也不需要你日夜緊盯。像投資資產管理這樣的公司，提供了簡單的、沒有附加條件的投資方式。以前相對昂貴及複雜的投資，現在每個人都可以簡單地做到，除了先鋒之外，還有許多其他公司可供選擇。


    投資最重要的事情，還是必須了解，世界上真的沒有人能夠準確預測市場或未來。了解自己的風險承受能力，並將投資分散在股票、債券以及國內和國際指數型基金，就能降低整體風險。此外，世界上也沒有完美的投資組合，因此最重要的是，減少對單一政府或公司的投資，仔細檢視每個基金的管理費及其他相關費用，和大多數長期投資一樣堅持走下去。把二十四小時監控市場的電視節目關掉，只要在你購買以及賣掉它的那一天，關心它的價格就行。


    ### 真的有人這樣做？


    媒體上會有非常多讓人炫目的退休理財報導：「想要提早退休？」「想要三十歲就過退休人生嗎？」「每月把五成的收入存起來，就能提早退休」，這些報導都吸引了相當多讀者，當你深入了解之後，會發現許多推動財務獨立運動的人士，與我們談的策略幾乎不謀而合。《簡單的財富之路》（The
    Simple Path to Wealth）一書的作者柯林斯（J. L. Collins），在給女兒的一系列信件中，寫到了這種理財方法，他認為大家都喜歡錢，而且喜歡用簡單的方式得到它。


    他將策略整理成幾個重點，例如「不要與對自己財務狀況不負責任的人往來」、「不要花光你賺的每一塊錢，存一點下來」。更重要的是，量入為出，把存下來的錢投資在先鋒總股票市場指數基金（VTSX），一個基金，一個戶頭。真的這麼簡單嗎？


    在財務獨立的領域內，最知名的應該就是本書推薦者金錢鬍子先生。多年來，他一直在宣揚自己與指數型基金的關係，甚至把傳統的選股投資稱為「傻瓜的賭注」。在他的部落格中，建議讀者用十到十五年的時間工作，以五成的收入過生活，同時把剩下的所得存入指數型基金或管理費相對較低的長期投資商品上。與一般想法不同，他認為如果市場崩盤，是股票跳樓大拍賣的時機，雖然他認為房地產和其他收入來源，也是財務獨立的重要來源，但他鼓勵讀者，把錢放在指數型基金上，讓這種簡單的理財商品繼續為你賺錢。崇尚極簡主義的密爾本和尼克迪穆，在他們的部落格及暢銷書《心簡單：尋找生活意義的法則》（Minimalist
    Live a Meaningful Life）中提到，「簡單投資是大家該做的事，他們選擇的金融工具，就是靈活、成本低、可靠的指數型基金。」


    > 參見：約翰亞·菲爾茲 密爾本（Joshua Fields Millburn）、萊恩·尼克迪穆（Ryan Nicodemus）著，《心簡單：尋找生活意義的法則》，如果出版社，二〇一七年。


    他們把投資轉入了管理費低廉的指數型基金公司，如：先鋒及 Bannister，確實省下了很多錢，這些公司在金融版圖裡也越來越具競爭力。另外，部落格〈簡約森林〉（Frugalwoods）先生及其夫人，也將生活中的結餘投入指數型基金這種「低成本，不需要過度操心的資金管理系統」。在描述戰略的文章中，他們點出了一個金融市場長久的問題：「我們的投資文化有一個神祕的謎團，完全沒有意義，我們沒有必要付錢給某人『管理』你的資產，因為，這種管理費低的指數型基金的表現，通常比一些由專人管理的基金好得多！」。


    > 參見：Mrs. Frugalwoods, “Our Low Cost, No Fuss, DIY Money Management System.” Frugalwoods:
    Financial Independence and Simple Living. January 24, 2017. http://www.frugalwoods.com/2017/01/24/our-low-cost-no-fuss-diy-money-management-system/.


    你可以記住一些推崇指數型基金人士的名言：


    - ○償還債務，未來不要再借錢

    - ○量入為出，千萬別超支

    - ○投資低成本的指數型基金

    - ○長久持有你的基金


    泰咪曾經很迷惘，不知該如何選擇投資標的，也不知如何評估風險和回報。但現在，她決定在財務獨立之後，採取「先保障基本需求，再求超額獲利」（Enough and
    Turenue）的原則，分散自己的投資標的。她將大部分資金放在美國公債上，這樣，不管世界如何變動，她都有足夠的收入來滿足基本要求。然後把其他資金放在共同基金和指數型基金，風險稍大，但潛在的回報更多，當成她的藏金室。就算藏金室裡的錢都賠光了，她仍然保有財務獨立，再慢慢把藏金室裡的錢存回來。


    ## 不動產


    下一個策略是投資房地產。如果你找到一個喜歡的社區，買一套有庭院、雙拼或四層式的房地產是不錯的選擇。這樣做，不僅可以在社區中敦親睦鄰，把其中一間套房租出去，還能創造穩定的收入來源，以支付房貸及分期付款。


    崔奇（Scott Trench）是《打造生活》（Case Study）這本書的作者，也是一位房地產顧問、中介和部落客。他說，「大家都知道，如果想買房，最好買一個可以增值的物件。通常情況下，小型雙拼、三層式和四層式的住宅，除了家庭使用之外，也可以把空餘空間租出去。如果你手上的不動產物件沒有超過四件，可以申請聯邦住房管理局（FHA）的低利房貸（通常利率可以低到三、五％），但要在當地居住滿一年以上，才能買下一間可以創造收入的房屋。你可以研究自己有興趣的區域，再磨練出租物件的基本管理能力，選一個安靜、適合人居、容易出租，且銀行願意貸款的房子，就能創造租金收入，我自己就曾經這樣操作過，有很好的經驗。就像買一間自己要住的房子一樣，需要基本而簡單的照顧，就能擁有一間房子，而房客租金會幫你繳付銀行貸款。」


    > 參見：Scott Trench, email message to the author, April 10, 2017.


    以下就是評估投資物件的注意事項：


    - 房子所在地點住起來舒不舒服？你不想在未來的幾年中，甚至永遠，成為這個地方的一分子？

    - 該地區的發展前景如何？它可能會升值嗎？鄰里可能會保持和諧及安全嗎？

    - 會創造多少租金收入？


    維持的費用預估有多少？常見的有維修、水電、社區管理費、稅金、分期付款（資本支出）、閒置期及其他衍生的託管費用。這些零零星星加總起來，也是一筆開銷。


    房地產投資與其他投資不同，會讓資金鎖在單一的商品上，且有一段時間沒有辦法流動，如果你急需出售物件換取現金，不動產市場可能不是理想的投資標的，因為急售往往會造成虧損，這不是不動產投資的風險。但如果你願意自己努力做功課，並精心挑選物件，那麼出租可以成為一個安全、穩定的收入來源。


    ### 投資客操作手法風險大


    請注意：有些投資客會買進舊屋翻修之後再賣出，從中賺取豐厚利潤，有一部分追求財務獨立的人士，在還未到達財務獨立之前，會用這種方法快速累積財富。不過我們不建議這樣做，因為這樣會佔據你太多時間、風險太大，而且坦白說，房價炒高了之後，一些付不起房租的房客，可能被迫搬離已經相當熟悉、且鄰里關係深厚的社區。另一種房地產投資方式，是投資自己的家園和土地，讓住宅成為財務獨立計畫的一部分，例如：在自己的家裡，建置再生能源或農育設施（花園、穀倉、雞舍和羊／豬圈），時間一長也可創造收入。前面提到的部落格『簡約森林』先生及夫人，就建設了一個農莊。


    肯特和貝絲兩人都是高薪的專業人士。他們彼此互相吸引的原因，並不是想一同過著高檔豪奢的生活。肯特是一位博士，也是綠色能源顧問，他讀過非常多有關氣候變遷的資料，希望把自己的城市變成可持續發展的典範，但是當地政府作風官僚延滯計畫，讓他越來越沮喪。貝絲一直不滿意她的工作，這個問題困擾她很久，他們倆在存夠錢之後，在市郊附近蓋了一座小農場，自己捲起袖子耕作。但有一年乾旱嚴重，深水井乾涸，農作物枯死，肯特在研究所攻讀的氣候變遷，真實地發生在生活中。他們決定開著野營車往西部走，希望找到一個氣候安全的地方，幾個月後，他們終於在西北太平洋岸一個茂密的林地找到了「它」：一個被八英畝黑莓灌木叢包圍的破舊房屋。


    這個土地上的一個物件因臨近高速公路，因此被劃為商業用地，他們決定把整地、翻修房子及照顧家庭當成主業。肯特和貝絲在藍莓叢中把房子重新翻修，自己則仍住在野營車裡，同時出租一間獨立的客房，用租金支付房貸；房子整修完畢後，他們夫妻就搬進屋子裡，然後把野營車租出去；再把一個獨立的小屋整修好出租。加起來的收入，正好用來支付購買農地所需，他們在六年之內就把房貸還清，比一般房貸還款的二十至三十年縮短了許多。主要是因為這片肥沃的土地、豐沛的水源及出租擁有的自然資源所得。买下這片土地時，他們已經有一個小孩，定居之後又生了一個。他們深信，能在自己的房子中生活，能有時間陪伴孩子一起長大，並把他們拉拔成一個具環保意識且對森林友善的成人；又能兼顧社區關係的培養，讓鄰居成為生活重要的支柱，這全部加起來，就是人生中最美好的事情。不僅對自己好，也是照顧地球生態最好的方法及途徑。


    不過，投資房地產，並不一定只能投資給入住的物件。喬治．卡林（George Carlin）曾說，房子也可能「成為你放東西的地方」。


    陶德投資不動產的方法就不一樣，他買進了倉儲不動產，並開始雇用經理人，經營倉儲空間的租賃業務。你可能注意到了，倉儲業做的是把家中多餘的東西找地方放的生意，跟財務獨立計畫強調精神不大一致。不過，姑且不論這一點，陶德一家確實因為這筆投資而有了每月固定的收入，不僅可以提供生活所需，日積月累也讓他們買了第二個物件。平常時間他就投入社區營造，擔任學校家長委員會等職務，他之所以能這樣做，就是因為有穩定的被動收入，可以維持穩定的生活。


    ### 不動產也可以是你投資組合中的一項


    桃樂絲和丈夫賴瑞的故事，是財務獨立計畫最佳的範例及代表。他們在一九九五年時超越了四十萬美元的資產。他們利用手上的房地產融資，遴選出具投資了三棟出租公寓，同時把自己家的一間獨立物件租了出去。除了穩定的房地產投資和收入之外，他們還將多餘的資金投資一些公司及共同基金。


    為了了解投資方面的知識和經驗，他們參加了NZIC（全美投資公司協會）舉辦的課程，協助創立了幾家不同的投資俱樂部。這些是他們遵循的原則：一、定期定額投資；二、把投資收益、股息和利潤再投資；三、投資優質的成長型股票和股票共同基金；四、多元化投資。


    賴瑞說：「加入投資俱樂部都是一種安全而有趣的方式，讓我們學到投資的方法。參加投

    '
