    ## 財務忍者


    個人理財世界裡的忍者跟數字是好朋友，喜歡讓系統維持在最佳化狀態，沒事就看看理財部落格，搜尋免費機票及旅館的機會。他們其中有些人節儉成性，喜歡找便宜貨，收集折價券，尋找免費的機會，以最划算的方法完成交易。當然還有省錢達人，用盡所有方法省錢，要讓這個月的結餘超過上個月，對於他們，省錢就是王道。


    ## 極簡主義者


    人生無關於金錢，在乎的是意義，掃除一切阻礙吸收生活養分的雜物，他們是梭羅主義者，重精神、輕物質。把物質環境減到最小，放大更珍貴的非物質層面，一個由心理及靈魂建構的人生，有些人稱他們為精神主義者（Soulism）。其實，簡單生活一直是美國的傳統價值，早在英國殖民之前就是如此。


    ## 自造者


    金錢不是這類人的重點，但在物質世界裡嬉戲卻是很好玩的事情。自己動手蓋房子、種田、修修復補、煮菜弄飯、園藝、設計、創造、畫圖甚至發明，不像極簡主義的人，自造者喜歡創造的過程。他們是一種有想法的物質主義者，自己動手實作生活的大小事，這種精神跟蘋果派一樣，就是美國的象徵。


    在改變與金錢的關聯或戒掉惰性的過程中，你不必刻意學習要變成以上的哪一種人，但一定要做些事情才能改變現狀。那些成功達成財務獨立的人，通常都會有幾項特質：值得信賴、自我覺醒及賦權。他們一步一步達到目標。


    ## 烏龜及兔子


    每個人邁向財務獨立的速度不一，我常常用烏龜及兔子來比喻這個過程。烏龜屬性的人通常傾向逐步完成，穩定、緩慢但有步驟及方法地減少花錢、累積存款，讓自己從債務中解脫、確定達到中年退休的目標。他們不在意速度，倒是認為人生重要的事情一定得完成，像是建立家庭、服務社會、與雇主保持良好關係等，甚至有些會走遍全美造訪所有國家公園。


    特質像兔子的人，通常會設定目標，就像喬一樣，設定三十歲退休；他們也會設定時間目標，要在那個時間點之前完成應盡的事項，就像賽跑的終點線一樣。他們認為存的錢越多，就越早達到自主的目標，通常會設定一個存款比例，按時從薪水中提存，同時逐步調高比例，並希望朋友及伴侶配合容忍。


    不論你的方法是什麼，最重要的就是開始做，不要停。每個人的起點線都不同，夢想的力量及對承諾的堅持，將會帶領你一直向前走，就我們輔導上千名參與計畫者的經驗顯示，因為做了這些事情，不少人的生活變得更豐富：


    - 他們終於了解金錢運作的基本道理。

    - 他們真的解決債務問題，增加存款，能夠用自己的方法快樂生活。

    - 他們找回以前的夢想，並找到方法實踐，自由度更大更放鬆，也比較能分辨哪些是生活中必要的東西，哪些是多餘的，學會卸下自己的擔子。

    - 平均起來，生活支出減少了二五％，感覺更快樂，雖然所得減少，但身心更健全，跟父母及小孩的關係也變得好。

    - 穩健的財務狀況，解決了內在生活價值及生活方式的衝突。

    - 金錢不再困擾生活，無論在情緒或心智上，都有餘裕處理更重要的事情。

    - 因為減少花費及被工作占用的時間，自己可支配的時間變多了。

    - 不再用消費解決問題，反而願意接受挑戰，學習其他技能。

    - 總之，金錢與生活的拉扯已經解消，生活更完整充實。


    ## 四大財務面向


    這套財務獨立的計畫是為了擺脫原來的心態，改變以消費為主的生活方式及習慣，策略運用與以往不同，更重要的是改變心態及想法，我們稱之為「財務獨立思考法」，期望大家對於生活中金錢的流出及流入，有所覺察及關注。希望透過閱讀，啟發大家對於財務獨立及思考的面向，依照步驟一步一步行動，與金錢的關係就會改變。基本上，又有四大面向必須掌握：第一、財務智商（Financial
    Intelligence）；第二、財務健全（Financial Integrity）；第三、財務獨立（Financial Independence）；第四、財務依存（Financial
    Interdependence）。


    ### 財務智商


    財務智商主要是指必須有能力客觀地看待自己的金錢，跳脫原有的偏見及情緒。金錢真的能買到幸福快樂嗎？每個人都一定要為五斗米折腰嗎？金錢真的會讓我們恐懼、貪婪、又愛又恨嗎？


    我把大部分的時間賣給了工作，這樣安全感真的比較高嗎？


    建立財務智商的重點，在於了解你已經賺了多少钱、有沒有把它们記錄下來、如何清楚表達、多少钱会流入、多少钱会流出。除此之外，你要清楚金錢的真義。你一用用金錢交換到哪些東西？就債務來說，我們希望這階段的目標是讓你脫離債務的泥淖，銀行裡有足夠支撐六個月生活所需的存款，如果你跟著本書的步驟，就能建立基本的財務觀念及能力。


    ### 財務健全


    就字典上的定義來說，所謂「健全」¹，有幾個意義：1.對於道德及人文的價值，有一定想法及堅持，沒有腐化及污染。2.在一個沒有受損傷的狀況下：完整。3.沒有分裂、完整及完全的狀態。


    要達到財務健全，必須確實了解你的收入及花費對社會帶來的影響，不僅是自己的家庭，也是整個地球；同時也要清楚需要多少錢及物質條件，才能滿足你定義裡的「充足」。人生（最理想的狀態），哪些是多餘及雜亂的東西。在這個階段，你的財務狀況與你的價值，應該已經平行發展，如果你按照本書的步驟，就能走向財務健全。


    ¹ “integrity.” Merriam-webster.com. 2017. https://www.merriam-webster.com (September
    9, 2017).


    ## 財務獨立


    財務獨立不只是收入獲得保障，也同時要摒除對財務錯誤的認知，擺脫債務的束縛及凡事貪求「便利」的心態及行為。財務獨立是要去除所有讓金錢左右你生活的可能。


    ## 財務依存


    在上一個財務獨立階段，我們已經擺脫朝九晚五的輪迴，工作及各方面的關係及基本的想法都有了轉變，但這不代表我們要脫離群體及社會存在。人生中最美好的時刻，是愛及貢獻。我們需要投入更多時間，讓生命更有意義。我們是一個相互依存的社會，一起做事、接納彼此。共同創造生活，這是生命豐厚的要素，相互照應，是生活的真實面貌。當然，我們也依賴大自然，共享建設——從道路、機場、圖書館到社會安全網。我們在一個互相連結的大海上生存，事實上，在完成財務獨立之後，很多人（只要休息一段時間，或是完成長久以來的夢想之後）都願意把時間投注在讓世界變得更好。


    ## 新版裡有什麼


    因此，在這個全新版本中，為了反映今日世界的真實狀態，我增補了幾千個不同的內容，其中兩個章節改變最多。智慧型手機、部落格及網路購物的盛行，讓情況產生重大轉變，特別是在第六章〈用省錢的方法圓夢〉更新了內容。最大的調整在第九章〈追求長期的財務自由——你的現金應該存放在哪裡？》，以前番或其他人用的投資方法，當時雖維持了二十五年穩定被動收入，但在現代環境已經不是最好的方法。在熟悉不同投資領域的同事幫忙下，第九章介紹以不同的方法完成財務獨立的目标，但最核心的想法沒變，改變的是計畫必須「為你自己量身定做」。老讀者可能會發現，新版本中介紹了一項嶄新的工具——「談一談錢」（Money
    Talk Question）的社團可以幫助你。


    財務獨立九大步驟的基本精神，仍是希望每一個人都能擺脫「工作」「消費」的循環，只有你自己可以改變與金錢的關係。當然，喬及我，或者其他社會支持團體的協助，也能扮演提醒與誘發改變的角色，在全書的最後，我完整地介紹了全新一談錢「團體。經過實際驗證，藉由這個方法，你可以跟朋友或是任何陌生人談論生命中最重要的議題：你與金錢的關係。在每一章節的最後，都總結了幾個重要問題，在與朋友、家人或其他團體討論金錢議題時，這些都可以當作是很好的指引；甚至在單獨處自省的時候，也非常管用。當我們願意分享我們的夢想、疑惑、恐懼、偏執，改變就會發生！


    ## 勇敢改變吧！


    我希望透過這段簡介，引發你對執行財務獨立九大步驟的興趣，開啟改變的第一步。當好奇心被燃起，行動就會跟著產生，我希望你有自信未來可以改變，接著，可以好好閱讀本書了。看完之後重回第一章，開始一步一步執行你的改變計畫，以落實財務獨立的目的。


    老讀者，歡迎回來。新讀者，也歡迎開始認識這套方法，已經有成千上萬的人，透過這個方法走出困境。誠摯地希望你能也能成為其中一分子，這個世界需要你挺身而出，追尋夢想。


    # 第 1 章


    # 金錢的陷阱：

    古早時期的致富之道


    ## 錢是個溫柔陷阱？


    「要錢，還是要命？」如果每個人，拿槍抵住你的胸口說這句話，你會怎麼做？大部分人應該會把皮夾交出去，這樣的威脅會奏效，主要是我們認為生命的價值比錢高得多，真的是這樣嗎？


    瑞秋是個成功的業務，每週工作七十小時，但她說：「讀完了《富流感》（The Lottery of Affluence），這本書之後，我發覺『人生有些東西不見了』，不只我以為這樣，當我跟別人聊天，他們也有同樣的失落感，買了一個什麼東西都有的大房子，真的是所為何來？我真的要一直一直工作，然後變得一無是處，然後退休？然後把時間都花在購物上，花的還是辛苦省下來的錢，一直浪費時間，然後等著生命到終點？」


    唐恩熱愛音樂，卻始終在做資料處理工作，他放棄了嗜好及人生可以同時存在的想法。他不確定生而為人的目的，以為人生是一場困境，不確定自身的價值。他認為成年後所有因頓接踵而來，他大學畢業，娶妻，有一技之長及工作，買房，也有房貸，還有一片庭院等著除草，但他不認為自己過得像人，總覺得人生被囹圄。


    伊蘭一直不喜歡自己電腦程式設計師的工作，對於工作只肯做到六十分，而公司也找不到開除的理由。她一直想像自己成功的樣子，開跑車、擁有鄉間別墅，但無法改變工作時的無聊，放假時她會去旅遊，也參加一些工作坊，但還是沒辦法找到平衡。她最後認為，工作不如意念會持續啃食人生的核心，而後半輩子可能就要這樣過了。


    克里斯蒂跟丈夫是典型的頂客族，雙薪，沒有小孩，在科技業領高薪。夫妻倆年輕俊美，應該有美好的人生？但當克里斯蒂看到同事被壓力擊垮，差一點過勞死，一星期後這位同事傷沒事般回到工作崗位，她知道這樣的生活一定有問題。她的長官因為血管阻塞住院，最好的朋友被開除，克里斯蒂開始焦慮，半夜三點就因壓力過大而驚醒，她想：「不能再這樣下去了，這樣不值得！」


    妮可跟隨父親的腳步，她爸爸是律師，也鼓勵她成為專業人士，因為職場會走得比較順。妮可花了八年時間，拿到護理醫師（Family Nurse Practitioner）學位，但卻也因此承擔十萬美元的債務。如今畢竟不是父親從法學院畢業的一九六九年，現在是二〇一一年，妮可賺的錢，扣除員工薪水、房租、雜支、保險之後，連貸款的利息都不夠付。即使她在一個熱門的行業工作，仍感覺人生在倒退。她對朋友坦承：「我可能真的付不起這些債務了！」


    布萊恩趁著朋友凱文進城時，兩人抽空見了面，凱文在高中時毫不起眼，但現在是線上教育的六大宗師之一。布萊恩一直想請教凱文如何成功，因為他也想靠教育撐住自己的家庭，在家工作，教導學生有效學習的工具，並且趕快上手，過優渥的日子，希望得到凱文現在擁有的一切。然而，雖然線上教學看來很容易，每個人好像都可以在線上開課收錢，但其實，成功根本沒有這麼容易。布萊恩花了不少錢，找同業高手指導，學習當老師，也花了比預期更多時間準備課程，但重金打造的金鵝，始終沒有下金蛋。


    雖然有人真的很愛工作，但極少人能誠實地說，我的工作及人生很完美。完美的工作，既有趣又有挑戰性，又能適時享受及放鬆。守得孤獨，才會有生產力，付出時間，工作才能做得好；放鬆時間夠多，才覺得有充分休息；有貢獻，才會覺得缺你不可；有獎勳，工作起來才會更有趣；即使最完美的工作，也是有捨有得才會有得。


    人近中年才驚覺，人生竟然跟父母過得一樣。連有好職業的人都可能感嘆，竟然已經補牙補了二十年，只因為十七歲時夢想成為牙醫師，投入世界上最棒的工作。我們不知不覺進入「真實世界」，一個充滿妥協的人生。我們以為可以拿到人生的金牌，但每天結束前躺在沙發上卻不禁唏噓，也許人生就是這樣了！


    大多數人都期盼人生過得精彩，總覺得人生要過得更有意義，過得更滿足更豐富，但時間一久，當工作太多量占據人生，日子被「待辦事項」填滿，精彩人生的念頭就一點一點消失。你將會發現本書中提到的故事，都希望人生有另一種可能。人生過得更真實、更豐富、更有意義，同時也能有富足的物質生活，既滿足基本「需要」，也能成就「想要」的欲望，在內在及外在之間找到平衡點。希望「工作的我」、「家庭的我」及深層「內在的我」，能夠維持好的關係，而且找到方法，讓工作不僅是過生活，也能豐富多彩。希望當人家問及：「要錢，還是要命？」時，能果決地回答：「我兩個都要，謝謝你。」


    ## 我們不是在過「活」是在找「死」


    對於多數的工作者，不管你是熱愛工作還是勉強餬口，在錢及生活上一，都很難有自主的選擇。用工作換錢，取決於你醒著的時間有多少，剩下來 的才是真正自己的生活。美國大部分的工業城市，受薪階級的生活大概都從一大早開始，鬧鐘設在六點四十五分起床，查看手機、盥洗，穿上制服。若是醫療從業人員，會開始清洗雙手、穿上無菌衣，建築工人則穿上牛仔褲及T恤。如果有時間就順手抓了早餐，拿起通勤馬克杯及公事包，提了午餐盒就急忙出門踏上班，很快就陷入車陣中，若是公車或捷運族，就得擠在滿滿是人的車廂中。上班族從上午九點到下午五點（或更長），應付老闆及豬隊友，周旋在供應商、客戶及病人中間。電子郵件爆多，做事行色匆匆，還得三不五時查一下社群媒體動態，同時隱藏自己犯的錯，在交代一個逼死人的截稿期時，微笑地向對方致意。知道公司是要裁員，但聽到「組織重整」或「縮小編制」時，還要裝作如釋重負，知道不在裁員名單中時則暗自竊喜。


    肩上的擔子越來越重，時間越來越緊迫，在表面上同意老闆意見時，還要跟自己的良心拔河。笑一下吧，終於五點了。跳上車、擠進捷運或公車，回家陪另一半、小孩或室友。做完之後，也不忘拍張照上傳臉書，邊吃晚餐邊追劇，回幾封電郵再上床，幸運的話可以睡滿八小時。


    這樣叫作「過日子」？想想吧！這世界上有多少人，在一天上班結束前表現得比踏進辦公室時更有朝氣？我們每天下班回家時，心情會比上班「過日子」的時候更好？當我們踏出辦公室，與家人或朋友相處時，有覺得精神更好、更充滿活力嗎？工作時該有的人生到底在哪裡？對於大多數人來說，透過工作來「過這樣的日子」，其實是一種「謀殺人生」的舉動。為了工作賺錢，我們常常不自覺「謀殺」了健康、與親人的關係、快樂的能力及探索的好奇心。


    為了錢犧牲生活，這過程日復一日、緩慢地進行，我們竟然都沒注意到。灰白的鬢角、中廣的身材，跟公司角落的斑駁辦公家具沒什麼不一樣，一台公務車及年資，是我們匆匆人生唯一留下的地標。最後，我們生活必需品得到滿足，有亮眼的領導甚至優雅的生活，但在內心裡，我們已經被封鎖在「九點到五點」這個僵固的生活模式中。


    如果，我們不工作，多出來的時間該做什麼？本來希望透過工作，完成人生夢想，找到生活的意義，但這些想法，逐漸在職場政治、身心透支、工作無趣及過度競爭當中，一點一點消失。


    小時候那些充滿奇幻想像力、大學時期懷抱的遠大理想，內心因為愛觸發的激情，這些大大小小的感動，就一點一點被遺忘了，都塵封在「年輕真好」的檔案夾中了。就算是你喜欢工作，覺得透過工作能有一些貢獻，都可能會認為有其他的工作領域，能夠更享受人生。擺脫朝九晚五的工作模式，這樣的滿足來自於找到一種真正熱愛的工作，不受限也不擔心被開除，陷入失業的窘境。有多少次我們自問「我想依自己想法，但懂事會希望用他們的方法行事」？我們要為了蝸口，犧牲多少夢想？


    ## 我們以為自己是為工作存在


    就算我們能脫離既不快樂又違背價值觀的工作，在心理上，我們也很難釋放自己。我們對自己的價值及認同，多半來自於工作。工作取代了家庭、社區、公益、宗教、親密夥伴，成為我們自我認同、喜怒哀樂的最重要來源。想像一下，當別人問你：「你從事哪個行業？」而你回答：「我是○○○。」這時你感到驕傲嗎？還是羞愧？倘若你覺得沒有過上自己預期的人生，你會這麼回答「我只是一個○○○」嗎？你感覺高人一等？還是不如別人？你充滿防禦心態嗎？你誠實嗎？你會在自己眼淚上灌水，讓身分地位聽起來比較響亮嗎？


    你曾經用薪水高低判斷一個人的價值嗎？當高中同學會時，你如何評斷老同學是否成功？你會問同學，你的人生圓滿嗎？有依照自己的價值觀生活嗎？還是你會問他們在哪裡工作？職位多高？住哪裡？開什麼車？小孩在哪個大學念書？這些都是社會上定義「成功」的重要象徵。就像種族及性別差異一樣，社會上對能賺多少錢有著一個看不見的階級觀念。我稱為「職業主義」（jobism），職業及工作成為人與人之間互動的基調，在社會上如此，在家庭中也一樣。我們會認為家庭主婦是次等公民？或認為老師的社會地位比醫生差？其實老師在處理問題學生時，與醫生在對抗疾病或面對死亡時，所採取的手段相去不遠。也許大家不自覺，但在我們與他人的日常互動中，已經把「你在哪高就？」當成判斷一個人價值高低的重要指標。


    ¹² 參見：Douglas LaBier, *Modern Madness* (Reading, MA: Addison – Wesley, 1986),
    as discussed in Cindy Skrzyczyk, "Healing the Wounds of Success," *Washington
    Post*, July 23, 1989.


    ¹³ 編註：簡稱經合組織，是全球三十五個市場經濟國家組成的政府間國際組織，總部設在巴黎。


    ## 找「死」的代價很高


    心理學家賴比爾（Douglas Lillard）在其著作《現代瘋狂》（Modern Madness）中，提出了「社會疾病」（social disease）的概念。他發現所謂的成功人士，往往拖著疲憊的身軀及空虛的心靈上班，他警告過分看重物質主義這件事，已經戕害身心靈的健康。他發現社會價值過度集中在金錢／地位／成功，往往讓成功人士忽略自我實現及人生意義的重要。幾百個研究對象中，有高達六成的比重，出現沮喪、焦慮及其他與工作相關的症狀，幾乎每個研究對象都有壓力過大的問題。


    即便在美國，每週最多上班四十小時的做法已經超過半個世紀，但專業人士往往認為必須加班或是在假日工作，才不會被同儕拋在後面。經濟合作暨發展組織（OECD, Organisation
    for Economic Co-operation and Development）¹³在二〇一五年發布的研究顯示，一一%左右的美國人每週上班時數超過五十小時，另外一項美國經濟諮商會（Conference
    Board）的研究也發現，逾半數美國人「滿意自己的工作¹⁴，自願加班工作犧牲享樂。結果呢？如何賺錢？賺多少錢？成為美國舉國上下的通病。


    ## 錢都用到哪裡去了？


    就算我們過得不快樂，但至少掌握了傳統定義「成功」的重要成分：銀行中的錢。但真是如此嗎？美國人的儲蓄率其實逐年下降。根據美國商務部經濟分析局（US Bureau
