    # 如何找到人生的目標？


    東西，有時甚至比你個體存在還重要，值得你將生命活力投注在其中；是你的承諾，也可能變成別人認識你的方法，跟姓名、身體、經歷一樣，甚至比你的人生還來得重要。


    人生中，有各種不同的目標、意義及奉獻，以下是有關三個石匠的故事。路人問第一個石匠：「不好意思，請問你在做什麼？」第一個石匠不耐煩地回答：「你沒看到嗎？我正在把一塊石頭敲離開。」路人又碰到了第二個石匠雕刻家，他問了同樣的問題，石匠抬起頭來，很驕傲地說：「我在賺錢呀，養活老婆及小孩。」路人又跑去問了第三個石匠：「請問你在幹嘛？」第三位石匠抬起頭來，眼中閃著光芒，帶著崇敬的口吻說：「我在建一座教堂！」（奉獻給更崇高的目標。○）


    梅西（Corina Maci）是教育家，也是生態學者及作家，對於尋找人生目標，提供三個具體的方向與建議：①.跟著你的熱情走，專注於你在意的計畫。在你停止做夢之前，你的人生夢想是什麼？如果不為了錢工作，你最想從事的工作是什麼？你追求的，應該不是像汽車保險桿後貼的廣告標語，例如：「我情願去衝浪」。你要追求的，是你可以投入一生的目標，而不是做一半就放棄的想法。②.痛苦也是你必修的人生功課，跟受過苦難的人相處，特別是那些苦難曾經觸動你心底最深层的地方，因為你也曾受過苦難。所以可以跟別人分享那是什麼樣的感覺：悲痛、哀傷、失望、飢餓、恐懼，你能跟別人分享因磨難及痛苦帶給你的智慧及悲憫嗎？你曾經想對受苦的人們伸出援手嗎？如果你因為身處痛苦中，而失去幫助別人的能力，現在正是伸手幫忙別人解決痛苦的最佳時機，因為這是一種療癒。③.手邊就有你能起而行的任務，從每天回應身旁的簡單需要開始，找到人生的方向，就像找到好工作及人生志業，讓你像德蕾莎修女（Mother
    Teresa）一樣，展現神聖


