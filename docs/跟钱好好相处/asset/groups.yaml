    殘酷的事實，你都要拿出意志力來走完這條路。


    要如何激勵自己一直向前走？要改變自己的行為模式，通常會有三個關鍵：


    +   1. 把它變成習慣，不是有一搭沒一搭地做。你必須有系統地作爲，直到變成一般生活的日常，就像刷牙一樣。


    +   2. 請別人幫忙。告訴你的朋友或公開發示你的決心，一定要把花費寫下來，並在面註記往及往下的箭頭，每個月定期跟一個信得過的朋友碰一次面，報告你的進度並聊心得。或者每天用電話、簡訊或聊天軟體給朋友，讓他知道你的狀況。更進一步，你可以把你記帳的密碼給這位值得信賴的朋友，讓他監督你，你也可以幫他進行帳務監控。相互幫忙，愛管閒事，有時候也會讓事情更有效率。


