    ## 喬的生命力哲學


    味（EGO）的面向，我們並不明白。似乎沒有一個說法能概括解釋：有時好像全都對，有時又好像都不對。但喬又一個一個破解，終於，我們看到微言大義逐漸浮現。看來喬就像拍蒼蠅一樣很無情地打擊大家，但與會者可以體會他的用心。喬知道他無法永遠在台上，對大家熱情地揮手及發言，在追求財富或地位的人生路上，他也不能一直陪伴大家。


    喬捐出財產，成立了一個慈善基金會「新藍圖基金會」（New Road Map Foundation），研討會上賺的每一分錢都捐獻出去（我們並不富有，每個月只花八百美金，但我們足夠了，希望用研討會上所賺的錢，捐獻給其他組織）。


    ### 生命活力才是人生的價值


    最後，喬終於開始分享秘密：「只有一件事是百分之百正確，禁得起時間考驗。金錢對我們來說，是用來交換生命活力（Life Energy）的工具！」


    「你用時間換取金錢，不管你可以用一小時換一百美元，或是可以換二十美元，根本無關緊要，重要的是你的時間，你的生命到底有多少小時可用。每個人出生之後，每年都有八千八百個小時可用，到死之前，共有六十五萬個小時，其中一半的時間會用來吃飯睡覺，穿衣打扮，維持基本的生活。如果人生走到一半，你大約剩下十五萬個小時能夠花用。


    「這是你最重要的資產，對你而言，這是最重要的事情——對家庭的關愛、對社會付出、從事熱愛的戶外活動、迎接挑戰、尋找生命意義、建立資產、滿足激情（不論是在教會中或在床上），過你的人生。當然，你必須把時間『賣』給這個東西（搖一搖手上的百元鈔票），鈔票本身沒有意義，你的時間，是人生意義及價值的根本。


    「錢是換取你生命活力的工具，了解這件事，才能開始掌握你的財富生活，你願意花多少人生換取你口袋中的金錢？看看你周圍的所有，想想：「我花了多少時間在這些上面……椅子、汽車、廚房用具……牆上的畢業證書」，你的下一個消費標的，又會花你多少時間，才能賺到這些錢。


    「這堂課程不是要教大家少花一點或多花一點錢，最重要的是改變你跟金錢的關係，」「你曾經想過這件事嗎？」喬問道，「你跟金錢的關係？」是跪求地上的鈔票能真心愛你；或是假裝害怕，想要逃離那邪惡的百元鈔票；又或是把鈔票當作獎賞一樣，假裝在後面追著跑，想要抓住它，卻一抓不住！」這就是你跟金錢的關係，如果你是金錢，你願意跟我出去一同樂嗎？


    ### 簡單的結論——金錢到底是什麼？又不是什麼？


    在搞笑逗趣的表演中，喬用四個層次，把原本充滿誤解的觀點帶進金錢的真義中。


    - **財質**：鈔票就是一張紙或是塑膠，我們賺的錢、日常的花費、銀行的往來及資金的移動，都是靠這張紙進行交易，這個層次是一般人理解的金錢。

    - **心理**：你的恐懼及期望。你的個性是保守的？還是活躍的？出手闊綽？還是消費保守？誰影響你對金錢的認知及想法？

    - **文化**：對金錢的概念，深植在法律及生活習慣中。越多越好，成長就是好事，贏家及輸家，個人資產，獎勵及懲罰，你曾經想過，哪些是構成你對金錢生活的認知的重要因素？

    - **生命活力**：錢是你用你每小時的生命換來的東西。


    前三個層次，真實存在也很重要，但並不總是如此。


    事實上，純粹在物質層次，滿足對金錢的需求，可以為心理帶來平靜。但若從心理層面上，了解你在日常生活中，如何掌握對金錢的決策，會帶給你更大的自由；若進一步了解自己在潛移默化中，在文化的影響下，形成對金錢的認知，更能解放你對金錢的看法，越多真的越好嗎？成長一定是正面的嗎？


    最後一個層次，最重要。透過理解生命活力這個觀念，就能改變你跟金錢的關係，之前錯誤的想法也會因此轉變。這個課程，就是幫你去除迷霧、迷惘及誤解，重新建立你與金錢的關係，如此，你在做跟金錢相關的政策時，會更平靜更舒坦。重建與金錢關係的關鍵在於，了解金錢的真義，跟我們之前想的真的不同，金錢也不是金融界培養出的暗黑勢力。金錢，是我們拿生命活力交易過來的東西。


    雖然了解「金錢是生命活力」這件事非常容易，但我們可能得花一生的時間，才能體會箇中真義。這不是魔杖，讓以前做錯的決策瞬間消失，因為我們的父母窮其一生跟金錢奮戰，常常把問題藏起來，把金錢當作胡椒筒或褲子，我們自己也逐漸到了必須認識金錢的年紀。


    ### 改善與金錢的關係，改變生活


    但這當然無法改變你還在欠債的事實，在金錢運用上，跟另一半的想法仍相當歧異。就算你跟金錢關係改善，仍有許多挑戰存在，就像是一個棱角堅硬、有好多切剖面的鑽石，你需要做的人生功課還很多。支票會跳票、產品會破損、還要跟老闆談判薪資、你的醫療帳單到期，房貸要付...


    財富也會改變，了解「金錢就是生命活力」這件事，不會讓你免除所有必須支付的帳單，或是到期的債務。


    金錢像水一樣會流動，一旦流動，可能會滋潤你的人生，當它流向你，你會感到愉快，當它流走，你會失望及沮喪。我們買禮物送人，希望受禮的人開心，我們用公司獎金到夏威夷旅遊，是希望帶給家庭美好的回憶。


    了解「金錢就是生命活力」這件事不會讓生活中的喜怒哀樂停擺，但用這個方法檢視生活，的確會讓人生命更豐富多彩。我們會認真地想，怎麼做才會得到真正的快樂？買一部新車，真的會帶來更多快樂？在海灘待上一天，搞不好比付三年車貸，更快樂幸福。


    金錢就像一面鏡子，可以讓我們清楚看到自己。當你接到帳單時，知道錢花到哪了；或是當另一半說：「親愛的，可以討論一下我們的財務狀況嗎？」當對方給小費時或給少一點的時候、當你的朋友注意到你買了一支很貴的錶，都請記得這些感覺。


    在釐清金錢的多面向特性後，我們更能應付日常生活的各式帳單。遲繳或透支的狀況變少，更能控制花費，準時繳稅及繳納各種費用。認識得越清楚，越能應付各式各不同的支出。


    金錢是一種遊戲，我們必須跟著遊戲規則走，不論喜不喜歡、願不願意，我們每個人都在這個遊戲中。順著規則，我們可以把產品及服務賣到世界任何一個角落；我們周遊充滿全球化的產品，零件材料成分來自於非洲或委內瑞拉、在中國組裝、在洛杉磯行銷、在菲律宾包裝、在全球的沃爾瑪®販售。


    信用卡的交易，是靠著無數功能強大的電腦運算完成，我們因此才能用信用卡到雜貨店購物或是買演唱會的票。根據金錢運作的規則，我們生活、移動、買必需品，也因凡交易，我們認識彼此，每個人都需要金錢。


    > 編註：沃爾瑪（Walmart）是美國一家跨國零售企業，有八千多家分店，分佈於全球十五個國家。


    ## 了解金錢遊戲才能明智抉擇


    每個人争先恐後想要得到它，很少有人在一夭生活中，不碰到任何跟金錢沾上邊的事，正如，我們常常不願面對金錢與生活的緊密關係。錢是生命力，沒有金錢，我們的生活將停擺。


    認識金錢遊戲，讓我們在運用金錢時更明智地做決策。透過了解金錢遊戲的系統運作，才知道大賣場及網路購物網站是如何運用設計，讓我們投入注意力及金錢，利用不安及想望，賺到我們荷包裡的錢。我們會更容易抗拒消費主義，因為我們會開始思考：這件睡袍及新車，真的值得我花生命力？


    很多我們對金錢的認知，都是這遊戲設計的一部分，「誰在臨終前，得到最多玩具的人，就是贏家！」就是遊戲設計出來的價值。科技產品不斷改版本級，也是遊戲設計的一部分。


    設計及製造容易退流行的服飾，也是遊戲設計的一部分。廣告裡面，漂亮的女生與帥氣的男生一起打造新家，就是想引誘你去買他們使用的商品。更宏觀來看，州際公路及大教堂，也是金錢遊戲的一部分，大多數人總是喜歡買好的東西，忽略不良品。


    這些都是金錢遊戲的一部分，參與遊戲的人也不例外，如果遊戲參與者無法拿到好處，整場遊戲就會垮。因為生怕這遊戲運作不下去，因此我們買東西，讓經濟體系一直運作下去，只要遊戲還在，每個人就會跟著玩下去。


    ### 拿到最多的東西不代表贏


    每個遊戲裡都會有壞人，在個人理財中，也有幾個妖怪：通貨膨脹、生活水準、衰退及蕭條。


    我們一直被鼓勵，要跟著經濟指數過活。就算口袋裡有不少錢，也有穩定的工作，一旦經濟衰退，為了多存點錢，我們今年就不去度假了。如果經濟學家說物價水準變高，我們會立刻覺得變窮了，而我們不知道的是，物價指數在幾十年前，就把奢侈用品及一些可能用不到的科技小玩意，一起納進指數。


    有人認為這樣的遊戲設計是一種母體（Matrix），一種由機器創造的虛擬真實，目的是征服人類，掠奪我們的資源及能源。


    在電影《駭客任務》中，解救人類的領袖莫菲斯（Morpheus），跟劇中的英雄電腦駭客尼歐（Neo）說：「母體無所不在，總是圍繞在我們身邊，即使到現在，這個房間裡，從窗子看出去，或是把電視打開，你就可以看到它們；當你工作或去教堂時，你可以感覺到它們：你繳稅的時候也可感覺到，在這個世界裡，你的眼睛會被蒙蔽，讓大家看不到真相。」


    莫菲斯給尼歐一個選擇，現在變成流行文化的名言：「如果你吞下藍色藥丸，故事就結束，你在床上醒来，相信你願意相信的一切；如果你選擇紅色藥丸，你就會留在奇幻世界中：……」


    認知到金錢是生命活力，就像選擇了紅色藥丸，你做了決定，看到了後果，學習到新東西。拿到最多的玩意，不代表贏，拿到了你需要的東西就行，多餘的都不要，這樣你就有能力、有意識地，停止參與這場金錢遊戲，認知到金錢是生命活力，會讓你極大化、最佳化你最珍貴的資源：你的時間，你的人。


    ## 你的生命活力


    到底金錢等於生命活力的意義是什麼？畢竟，我們四分之一的人生，用在與金錢有關的事情上，賺錢、花錢、憂慮錢的事、對追求金錢充滿熱情。傳統社會對錢的價值，我們必須學習及遵守，但金錢到底對我們的意義為何？需要人們自己決定，這就是生命活力。用一生中的所有時間，換取可能的金錢報酬，寧得決定怎樣花這些錢。我們心中對錢的定義，決定了對待它的態度，我們的生命活力，比你實際花出去的錢還真實。


    金錢這件事，對我們而言，並沒有內在真實性（immanence）；但生命活力有，至少對我們來說，它是具體的，恆常地存在。生命活力是我們所拥有的一切，之所以珍貴，是因為它是有限的，也沒有辦法重新來過，我們如何處理生命活力，決定我們人生在世的意义。


    如果你今年四十歲，一般估計，在臨終之前，你應該有三十五、六五萬小時（四十、七年）的生命活力（見圖表2-1）。假設用一半的時間維持身體的機能，睡覺、吃飯、上廁所、梳洗及運動，那麼，你會有十七、八萬小時的生命活力需要分配，包括：


    - 你與自己的關係

    - 你與他人的關係

    - 你的創意表達

    - 你對社會的貢獻

    - 你對世界的貢獻

    - 追尋內在平衡

    - 維持一份工作


    現在我們知道，金錢是你用生命活力交易得來的結果。所以，你現在有機會建立使用生命活力的先後順序，畢竟，世界上沒有其他東西比生命活力更重要了！


