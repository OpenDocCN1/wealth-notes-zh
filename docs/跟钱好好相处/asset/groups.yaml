    +   1. 撥開迷霧，釐清你過去與金錢的關係。大部分的人都搞不清楚，這一生中到底多少钱進了自己的口袋，當然也不會知道，這一生能賺多少钱。

    2. 這樣做也能讓你去除一些長久以來的迷思及自我感覺，如：「我這輩子真的賺不了多少錢。」「或是「我根本不負擔錢，錢對我來說，一點也沒問題！」「通常靠爸族或媽寶會講類似的話。」「如果你屬於那種長期以來一直低估自己所得的人，這樣計算之後常常會有令人驚訝的發現，你比想像中有錢得多。

    3. 做完這個步驟後，你對自己之後的財務規畫會有了更清楚的觀念，對於賺錢的能力也更有自信，等於一個全新的開始。

    4. 更認識自己，也能把那個以前躲在暗處、容易自欺欺人的自己揪出來，他就是搞壞金錢關係的兇手。


    在我的課堂上，曾經有一個三十五歲左右的女性表示，這個步驟對她的幫助很大。她是一個家庭主婦，住在鄉間，長年以來都有心理障礙的問題，始終認為自己是個處處必須依賴別人的人，一點用處都沒有。她「以為」這樣的計畫毫無幫助，畢竟自己對於婚姻，沒有絲毫實質的財務貢獻，在上課之前，連離婚贍養費這種不是靠自己努力賺來的錢，都覺得沒有資格拿。但透過財務記錄整理，她發現在過去的婚姻生活中，大大小小的事情加起來，在那段以為自己毫無貢獻的歲月中，每年竟然能賺到五萬美元。這是她第一次感覺自己是有能力賺錢的人，整個人的信心都振奮起來，應徵且得到一份工作，拿到的薪水竟然還多了一倍。假如你是剛進社會拿到第一份全職薪水的新鮮人，把過去實習、兼差、暑期打工所賺的錢加總起來，也可能會發現自己其實已經賺了很'
  md: '

    一九五五年，美國零售業分析師賴鮑（Victor Lebow）觀察：


    > 在這個強調生產力的經濟體中，消費變成我們的生活習慣，我們把買東西及使用新產品，變成了一種儀式。在消費中，找到了精神上的滿足及自我滿足：……我們買東西、盡情使用它們、把它们用壞，然後去掉舊的，再買一個新的，這樣的循環越來越快。①


    也因為這個循環，我們就像滾輪中的老鼠一樣，為了買更多的奢侈品、有更多享樂的機會，得一直拚命做更多工作。今天，因為網路及手機的出現，消費的範圍又更大了，只要醒著隨時隨地都可以消費。產品從引起欲望到送達，只要敲一敲、滑一滑登陸，點擊一下就完成，以前只給少數特定人±的特權，變成大家都能享受的事情。這個做法為消費者的新身分，讓我們學會如何主張權利，消費已經發展出另一種不同的樣貌。


    ## 血拼的權利


    美國人已經深信消費是我們的權利。不論有沒有使用及享樂的需求，只要有一錢就能買任何想要的東西，不管這些東西是否真正需要，也不會用到，或是能否帶來享受，反正這是個自由國家呀！如果沒有現金，那為何辦信用卡？當然拿出來刷呀！我們天生下來就是註定要血拼的！誰在死之前買到最多東西，就是人生的贏家。生活、自由及追求更多的物質，變成美國的象徵符號。


    ①參見：Victor Lebow，in *Journal of Retailing*，quoted in Vance Packard, *The Waste
    Makers* (New York: David McKay, 1960)，摘錄於 Alan Durning, “Asking How Much Is Enough,
    ” in Lester Brown, *State of the World 1991* (New York: W. W. Norton & Company,
    1991), 153.


    尤有甚者，我們不只認為自己有與生俱來的權利消費，更以為消費可以讓美國強大。我們總是被灌輸，如果不繼續消費，很多人就會因此失去工作，失業率會升高，工廠關門，城鎮會失去經濟基礎。讓美國強大，就要繼續買東西。為何消費者信心指數會是美國經濟的重要指標？部分原因是如果少消費一點，或多存款，就變得不像美國人。現代經濟思維也鼓勵消費這件事。存款之外，我們怎麼花用自己的可支配所得？絕對不能把錢存起來，因為金錢不流動就會變成爛頭寸。而如果消費是使得經濟強大的手段，存款會讓同胞失去工作，那麼線上購物就應該是愛國的表現。


    唯一的缺點是消費會讓欲望不斷提升，超出我們所得範圍。本來以為是愛國心的展現，結果卻讓自己掉進債務泥淖。這讓美國人陷入進退維谷的困境，展現經濟愛國心的結果，竟然債務纏身，形成沒有贏家的局面。如果不消費好像不對，拼命血拼也不對。


    廣告加深了這個困境。平均每位十二至十一歲的美國小孩，每年收看兩萬五千則廣告1。以全球狀況來看，廣告市場超過五千億美元2，這些廣告加深了我們對商品的欲望。以前廣告只限於電視、印刷媒體及戶外观板，但在數位時代，廣告無所不在，隨著美國人使用手機的時間增加，跳出式廣告、多媒體廣告及側欄廣告不斷招手，提醒我們剛才用搜尋引擎看了哪些訊息，推薦我們線上購物的商品。行銷理論認為恐懼會引發需求，藉由訴求獨家限量產品，引發貪婪及罪惡感，或是滿足我們爭取認同的需求。廣告投放技術，配合市場研究及應用高超的心理学，讓消費者在情緒上失衡，進而說服我們要消除心中的不安全感，購買商品是最好的途徑。


    同時間，電視、電話、廣播、網路和報紙廣告正在傳播關於環境的壞消息。產品包裝堵塞了垃圾掩埋場。然而，大量製造生產是造成氣候變遷的因素之一，污染水源、砍伐亞馬遜森林、污染河川、水位降低。如果穿著傳統棉質衣服會促成大量使用殺蟲劑，穿化學纖維衣物會增加使用石化原料，如果什麼衣服都不買那會讓人生業，做與不做都好像不對，消費者陷入父子騎驢的窘境。


    人類做的每件事，都會對環境造成衝擊，即使強調「友善環境」或是「天然永續」的產品，造成的影響也只是相對較少，找不到兩全其美的方案。


    我們每天早上上上班時，是不會想到這些事情，也沒想到「買還是不買」這個問題。但是實際，我們每天都會碰到困境，行使完消費這個權利之後，帶來的債務問題及環境傷害，就像玩俄羅斯轉盤一樣，逐漸成為嚴重的問題。「我一個人可以幹嘛呢？『我們常常自問之後，就回頭不管這個重要議題了，這樣日復一日，週而復始,
    长久拖延下去，浪費依舊，用拒絕承認事實逃避困難的抉擇。如果我們繼續這樣一點一點改變，只是會拖慢前進的速度，最終會走向逐漸萎縮及惡貫的未來。


    其實我們需要的不是一點一點「改變」，而是結構性的徹底「改造」。改變，是在同一個棘手的問題上找解決方法；改造，則是檢視困境，透過重新提問來找到新的曙光。我們必須從成長的思維裡走出來，接受永續的概念，這需要每一個人改造和金錢與物質世界的關係。重新評估生活中的消費及收入，會讓我們的人生、社會及地球重新回到正確的軌道。


    從過去的經驗學習，決定我們目前的生活方式，進而創造一個全新的、實用的金錢關係，揚棄过多的假設及迷思。與金錢及物質環境，建立一條全新的道路及規畫，這樣做才能真正能與時代。進。


    ## 金錢新藍圖的開始


    到底是什麼讓消費這件事變成無節制的浪費？廣告商推銷物質主義，我們就全部買單，為何會這樣？心理學家把金錢稱為「最後的禁忌」（the taboo），我們甚至願意跟心理諮商師討論性生活，而不願意與他人討論財務狀況。


    金錢代表的意義，通常不是我們真的擁有多少，而是覺得夠不夠用，但金錢是影響人生的關鍵因素，重要性還是難以忽視。然而，平常除了打屁聊天偶爾會提及，親朋好友間很少把錢當作重要或必要的话题。為什麼會這樣？誠實談論金錢，會帶來什麼無法承擔的損失？


    ## 信任的模式


    要解答這個問題，首先得了解人心。從東方哲學到現代腦神經科學，不同的研究都似乎同意一個基本概念，人的大腦思考是以一套套模式進行，而且是一種重複的模式。不饒有點動物，對於不同的刺激會有固定的行為反應，人類的反應是以模式化的方式進行。行為模式的產生有些源自個人經驗，特別是五歲前的刺激；有些行為模式是天生的，有些是文化，有些則是人類所共有。這些行為模式大體上最重要的目的是提高生存的機會。一旦模式被大腦記錄，或一旦被驗證認為有助於生存，就非常難以改變。我們聞到炒洋蔥的香味就流口水，看到紅燈就踩煞車，當有人喊叫「失火了！」就分泌腎上腺素。如果記憶沒有對外環境變化有這樣的反應，我們就很難生存。但問題來了：這些行為模式並沒有反映客觀事實，但仍一直左右我們的行為。


    事實上，有些行為模式非常頑固，我們常常照著自己的解讀做事，而拒絕接受客觀的事實。


    走在梯子下面或是打破鏡子，真的代表厄運罩頂？當然，大部分人對於這類迷信，可能都嗤之以鼻，但其他呢？到感冒會怎麼傳染的？是因為頂著還沒乾的頭髮外出？還是被細菌感染？前者也許很容易被判斷是無稽之談，但後者呢？畢竟，還是有很多在辦公室裡的人沒有感冒，是因細菌跳過他們？細菌理論是不是現代迷信呢？又有哪些證據可以適用到未來呢？


    ## 我們的行動說明了什麼？


    有沒有可能，我們對財務的了解跟地球是平的理論一樣已經脫離現實？這些都是真的嗎？萬一我們對財務的了解也是一場迷信？我們還要相信小時候怪獸躲在床底下的故事？我們還信不大嗎？


    例如，雖然我們告訴自己錢沒有辦法買到快樂，人生中最棒的事情是有自由，但實際情況如何？誠實需要更深度的自我認知。當感到沮喪、寂寞，感覺不到愛，我們會怎麼做？我們藉由買東西安慰自己：一件漂亮衣服、一杯飲料（或兩杯）、一輛新車、一球冰淇淋、到夏威夷散心、買一缸金魚、看電影，一大包巧克力餅乾（或兩包）。


    當我們慶祝自己走運，我們買東西慶祝：到酒吧好好喝一輪酒、一場盛大的喜宴、一大把玫瑰或一枚鑽戒。解決無聊的辦法也是買東西：一棟遊艇、下一個的賭博（買彩券）。當我們覺得人生還少了一些東西，我們也是掏錢解決，參加講座、買一本自我提升的書、買一間閣樓小屋、在市區買一間房子。這些都沒有什麼不對，就是我們會做的事情，我們已經會用外在的東西來回應內心或靈魂發出的訊號。我們總是用消費滿足精神或心靈的渴望，為何會這樣？看看一張圖。


    ## 圖表 1-2 滿足曲線


    ![](img/9613d65bc6187206ad77a54ffefc649f_64_0.png)


    ## 滿足曲線


    圖表1-2是「滿足曲線一（Happiness），顯示滿足感與金錢（通常指的是取得更多所有品）的關係。在曲線的起始，取得越多的所有物，確實可以帶來更多滿足感，但當基本需求滿足之後，吃飽了、穿的也夠了、也有遮風避雨的地方，此時，大部分的人忘記飢寒交迫的恐懼，因為有毯子或擁抱讓我們溫暖。當感覺傷心，或是忍不住哭泣，我們靠外在各種神奇的東西撫平情緒。需求必須被滿足，我們才能生存，我們的內心記錄了所有的過程；有需求要被填補？


    人們神祕的魔幻需求滿足機制永遠有新的需求，回應之後滿足再次到來。想要什麼？看看你的周遭，買點東西，滿足感又回來了。滿足感已經從基本需求（食物、衣服、居住），進展到更高一階的需求（玩具、衣櫥、腳踏車），消費新產品與滿足感已經建立了正向關係，並且深深地烙印在心裡。


    還記得小時候，當你得到渴望的玩具的感覺嗎？如果爸媽盡責的話，他們應該馬上教你：


    > 「親愛的，這些東西要花錢買，我們願意掏錢買你要的東西，是因為我們愛你」，哈！此時小腦袋中有了新規則：一旦有需求，到外面找找，花錢買到新東西，滿足感回來了。一旦有了零用錢，我們開始更進一步了解錢的價值，可以用自己的想法買到快樂，如此年復一年。最後，只有奢侈品才能帶來滿足感。世界上大多數的人，都沒有辦法享受到汽車這個奢侈品，但對於美國人，我們人生中的第一部車，只是一生追求下一部更棒汽車的開端。接著，我們可能開始人生第一個豪華旅行，或上大學念書。人生的第一棟公寓。請注意，每個需求被滿足之後，都會帶來興奮感，但更大的需求就得用更高的興奮才能滿足，而且興奮感消失的速度，會一次比一次快。但是此時我們已經深信金錢就會帶來滿足，曲線已經接近高點。


    當進入人生另一階段，房子、工作、家庭責任，錢雖然越來越多，卻会带来更多的煩惱。職場上越爬越高，但相對投入的時間及能量也越多，照顧家庭時間越來越少。


    如果感覺被剝奪，就會失去更多，憂慮也會越來越多。不只要繳更多稅，給稅賦諮詢的費用也越來越高，更多的社區及公益服務要做，家中也需要重新裝潢，網路、有線電視及手機帳單，讓孩子快樂長大也得花一筆錢。直到有一天，我們發現空虛地坐在三千坪大房子裡，地下室裡有停車位及高檔的健身器材，但渴望找到真正的人生。這種簡單的快樂，貧窮的大學生在公園散步就有了。


    這時的情況是，滿足感已經到頂了，「金錢＋滿足」的公式再也無法發揮功能，反而開始產生副用，然而我們卻未察覺，不管買多少東西，滿足感就是往下直墜。


    ## 满足點：滿足曲線的頂端


    圖中最有趣的位置是滿足曲線的「頂點」，我們一生幸福的祕密就是找到這個點，能取得最大的滿足感，有個特定的名詞描述這個滿足曲線的頂點，這也是改造我們與金錢關係的基礎。這個詞，我們幾乎每天都掛在嘴上，但實際上卻沒有能力體會其真諦。這個詞是「豐足」(Enough)，在滿足曲線上的最頂點，就是「豐足」。


    豐足讓我們能生存；豐足讓我們能舒適及快樂，甚至可以有些小小奢華，需要的每件事情都可以得到，也沒有過多的東西會讓我們感覺沉重，或者沮喪、分心。不用借貸過日，也不會被錢奴役。豐足是不會有恐懼的境界，一個充滿信任的地方，可以誠實面對自我及自我觀照，真正享受金錢帶來的好處，不會浪擲金錢在無謂的消費上。一旦你覺得某些需要已經被滿足，滿足曲線就會轉向並一直往上，請繼續這樣保持下去。


    ## 混亂、比匱乏還慘的命運


    但在頂點之後，會發生什麼事？當滿足曲線從頂點向下彎之後，會是什麼樣的狀況？就是混亂！混亂的原因是因為有太多多餘的東西，多餘的東西沒有辦法為你所用，更會占據你的空間。在滿足曲線頂點之後得到的事物，不能為幸福感的加分。排除多餘的東西不代表就是匱乏，反而是騰出空間讓新的東西進來，得到新的啟發。這也就是為何縮小規模、節儉及簡約，會常常與剝削、欠缺及需求畫上等號。事實正好相反，豐足是一個有創意、自由及有更多可能的地方。那種因為過多以致像泰山壓頂的窒息感，應該被整頓、清理、移除、捨棄，因為這樣的狀況比匱乏還糟糕。


    ## 愚昧無知


    但到底是什麼原因造成混亂？滿足曲線告訴我們，生活中大部分的混亂都是從「越多越好」這個貪婪之心進來的，這種心態是一種物質主義引發的疾病，以為內心的滿足感得從擁有更多的外物才能獲得。門源自古小的經驗。我們不舒服的感覺常常因為擁有一些外在事物而被平復，像是嬰兒奶瓶、毯子、腳踏車、大學學位、寶馬轎車，或更多類似奶瓶等安撫內心的工具。


    也有來自一些無意識的行為，喜歡買一些無關緊要的東西，我們稱之為葛利葛斯胸針（Grillby）；其實不買這些東西根本不會造成生活任何影響。每個人都有些這樣的嗜好，從耳塞、小螺絲起子、鞋子、筆到巧克力糖等雜七雜八的小東西。


    你有沒事事就喜歡到賣場或上購物網站閒晃，當作每週必備的儀式，不知不覺就走到擺放無關緊要東西的櫃位上，欲罢開始蠢蠢欲動，想要把這些東西帶回家：哇……這東西又出粉紅款式了……我都沒有粉紅色的……哇……這東西竟然有無線遙控的款式……這樣會方便很多……哇……有防水系統問世了……如果我自己用不到，也可以送人呀……有新的檸檬口味推出了……還有椰子味的……還有義大利杏仁口味，我從來都沒有吃過這種，你的手（對！就是長在你身上的手）不知不覺就伸了出去，滑鼠或手指不由自主地點了登錄，把東西放進了購物車，像沒有知覺的喪屍一樣結帳。


    你把戰利品提回家（或是線上購物的包裹送到家門口了），你把這些可有可無的東西，再次放到抽屜裡（裡面可能已經有五到十項類似的東西），過了不久，你完全忘記它們的存在，下回購物時，你又會不知不覺跑去同樣的櫃位，買同樣的東西……


    ## 混亂的面貌


    不在視線裡的東西，不代表它不混亂，那些專門放無意義雞肋小物的抽屜——包括閣樓、地下室、車庫、衣櫥、收納箱，裡面就可能擺滿了多餘的戰利品，這些東西也許買來之後就從來沒有用過。


    把它們束諸高閣會覺得很可惜，把這些沒拆封的小物分類別類整理好，但是完全不用，你又覺得有罪惡感。只穿幾次的衣服，打包後便宜賣給二手店覺得可惜，有點沒有滿足的失落，甚至有時還會迷信自己的衣服給別人穿不太好，但直接當垃圾丟掉更不捨。一旦你開始留意，會發現這些雞肋小到處都是。


    這樣堆積多餘的東西，到底意義為何？此外，你的行事曆中，有多少午餐、派對、社交場合、晚宴，也是屬於這樣的雞肋性質？對你的人生一點助益也沒有。又有多少上班的日子，也是這樣雞亂無章、一事無成地混過去？永遠完成不了的待辦事項又有多少？你的人生，就在這些瑣事中，一天一天像走馬燈一樣度過，像漫無目的地翻閱雜誌，或是被小孩棄置的舊玩具。


    從國家大事，到私人事務，有時你的心態及想法亂無頭緒，缺乏計畫行事，毫無章法的結果，導致常常因為健忘而得重複進出賣場，添購一週所需的雜貨。你的嗜好可能是雞肋小物的重要來源，真正用得到的東西眼所擁有的東西，差距通常很大。假設你喜歡攝影，可能會發現自己的攝影包中有許多鏡頭及濾鏡，根本沒用過幾次。一些精彩的照片都是用手機拍的。


    這些都是混亂的來源，一些古空間但卻用不到的東西，一旦你真正覺醒，就會開始大掃除。其實在美國人中文化中，清掃多餘、過簡約生活的傳統一直都在。


    從清教徒到梭羅、貴格會教徒、以及艾爾金 (Diane Elkin) 和安德魯絲 (Catherine) 等作家，簡單生活的風潮不斷出現，為的就是平衡資本主義過度生產的浪費傾向。現在用語則稱種簡生活
    (lifestyle) 或 (less)，因為這世界上沒有東西是取之不盡的，足夠與否的量尺，其實在我們自己心中。它不是“少即是多”；它不是 一朵花瓶裡的雛菊，放置在一塵不染的梳妆台上，襯著從窗戶照進來的陽光；不是破爛的牛仔褲或黑色小禮服；不是一把完美的廚刀，獨自放在抽屜裡。當你接近豐足的狀況，會接近一種金髮經濟
    (Gold) 的狀况，需求被充分滿足，但沒有任何過剩現象。


