    # 保護好自己的東西


    如果你照著這本書過日子，將成爲聰明花錢的消費者。當你在購買行爲上具備了重要的概念及技巧，就要把這個能力應用到買保險上面去。在你買保單之前，一定要知道自已到底在買哪種產品。例如，你的車險真的能夠涵蓋所有開車時可能發生的狀況嗎？萬一發生碰撞，出險範圍有多少？如果替你家
    的傳家寶保險，你確定萬一被偷了，能夠拿回一樣一樣的？如果你沒有家人要養，沒有後顧之憂，你還需要壽險嗎？買保單之前一定要詳細審閱，才能讓保險價值發揮到最高。如果不了解，找找身旁值得信賴的保險員，應該可以跟你講得更清楚。


    凱西與蘭登在記錄自已每月收支表時順便檢視一下保單，結果讓他們吃驚不已。他們每月花六美元爲凱西祖母傳承下來的珠寶買保險，但回頭一想，保有祖母的遺物是爲了紀念，萬一掉了，世界上沒有任何东西可以取代，那每個月付六美元，所爲何來？花錢買一個安慰？藍登用財務獨立計畫中學到的技巧，以預計財務獨立的時點，回推利率水準來看，要多少本金才能產生每月六美元的利息？結果他發現，需要一千美元。這個數字，讓他馬上結束保單。


    講到保單，艾琳與昆提在投保之前，做對了一件事。爲了怕自己在往生之前就把錢用完，他們思考要不要買長照險，但高額保費讓他們猶豫再三。後來他們想通了，與其買一個保險怕自己變老、變窮，不如好好保持健康，跟社會多接觸，讓身體及心理都保持在活躍的狀態。因爲沒有小孩，他們選擇住
    在一個大型、混齡且多世代集居的社區，'
