    們只管享受眼前的富裕，根本不管擁有的一切其實都是取自地球，從土壤、水源到空氣，大自然不會伸手跟你抽稅。當社會越來越文明，我們更依賴可以呼吸的空氣、水及土壤，以維持生存。然而，對這種消費模式我們卻無意踩煞車，企業當然也不會鼓勵少消費一點。在政治上，限制消費也是一種自殺行為。就個人來說，很少人願意犧牲自己便利的生活，除非大家同時一起改變。


    環保團體、地方政府及非政府組織現在找到一個辦法，說服民眾厲行環保。他們告訴大家，如果地球的狀況改善，消費主義崇尚的 3 C ――舒適（comfort）、掌控（control）及便利（convenience）也會越來越好。一旦太陽能發電越來越有價格競爭力，就有越來越多人裝置這裡設備，一旦電動充電站像加油站一樣多，消費者就會傾向選擇對氣候友善的車種。我們其實沒有改變消費的心態，只是選擇不同的科技。這樣夠了嗎？不，作家奧斯丁及殷立其（Robert
    Ornstein and Paul Ehrlich）在他們的著作《新世界、新想法》（New World New Mind）中指出，人類只對立即威脅（例如：老虎、火灾及敵人憤怒的白眼）做出反應。在今天的世界中，越來越高
    的債務及環境威脅等都屬於水煮青蛙的慢性威脅，我們不認為這些有立即的危險。奧斯丁及殷立其認為我們必須學習，對反應氣候變遷上所花的力氣，應該跟看到老虎趕快爬到樹上的程度一樣。
    有些消費者心態已經開始轉變，他們追隨生態趨勢，對於綠色新科技也勇於嘗試，你可能已經是其中之一。但只強調美德，沒有辦法改變現狀，首先必須打破多即是美的心態，讓大家真誠想要改變，而不是被逼行事，環保先行者也往往能發展出最好、最聰明、最適宜的方法，讓環境及人類共存。你將清楚看見，工作到死或什麼都要的心態，真的不是最好的生活方式，認清這點，連你自己都會得到解脫。


    > ◎參見：Robert Ornstein and Paul Ehrlich, New World New Mind (New York: Doubleday,
    1989).'
