    第一年一月 到第五年八月


    ## 逐月收支表上的一條新線：每月投資收入


    投資賺來的錢跟工作賺來的錢有先天上的不同。不論你是否有工作，完成客戶要求的報告，或者有沒有達到每月營運目標，都會有投資收入，來源可能是股利、利息、租金或是分紅。不要把這樣的收入跟其他的每月收入混在一起計算，依據下面的公式，畫出另一條線用來記錄它：你的每月投資收入。


    ## 步驟八：資本與交叉點


    每個月，依據下面的公式，把你的投資收入算出來，記錄在逐月收支圖上，


    資本 × 長天期利率／12（月）＝ 每月投資收入


    簡單來說，當你的逐月收支圖中，每月投資收入的線「跨越」開支那條線時，你就「跨越」到「財務獨立」中了。


    你累積的資本就是你打算花用的錢（通常放在儲蓄戶頭裡），而公式裡的長天期利率，能用銀行的存款利息當基準，應該以美國公債利率為指標（三十年期），或是用定存存單利率。美國公債是目前用來衡量利率水準最好的工具（我們不是要你買公債，而是希望你把它當作利率的標準），可以用來估計長期投資的回報情況。用這個指標預估，並不代表你一定會有這樣金額的收入，它模擬了你在財務獨立計畫中，可能將會有的收入類型（第九章將詳細討論這個問題），從而預測你的收入。為了方便討論，暫且將利率定在四%，當你真的拿出錢投資時，並不能保證投資回報。當你真正投資，你可以建立各種不同的投資組合，這最終將決定你的投資報酬率（ROI）。不管你投資了什麼標的，價格起起伏伏、漲漲跌跌，這是金融市場的特性，就算是最安全的投資，也難逃這樣的宿命。


    在這個階段，你不用擔心數字，先用這個利率當成基準就行。不過有趣的是，四%這個利率水準，通常也是用來衡量退休金狀況的指標，被稱為「安全提領率」（safe withdrawal
    rate）。這個數字的意義是，一旦你不再工作，若能從你的資本中每年提取四%的額度做為日常生活所需，這樣的退休生活就會是安全無虞的。能照顧基本的生活，也能對抗通貨膨脹，四%的利率水準，也被視為「金髮經濟」的指標。因為如果你每年提取三%，可能不足以支付開支；但若每年提取五%，老本可能會很快提光。請記住，這只是一個通用指標，不能當作財務預估工具。不論「安全提領率」或是長天期公債利率，四%是一個合理的標準。


    假設你有一百萬元的儲蓄，將這一百萬元的投資於支付四%利息的債券，那麼公式看起來就像這樣：


    編註：投資報酬率（ROI）是指藉由投資而應返回的價值。


    每投入一百美元在債券或定存單，你每月將獲得○．三三美元。原來的一百美元本金不變，但這只是開始！如果你第一個月就有一千美元的儲蓄，而目前的利率是四％，公式如下：


    （100美元 × 4%）/ 12 = 0.33美元/月


    這代表如果你將資本投入債券或其他類似的投資，你的一千美元儲蓄，每月有能力常進三．三三美元，在你的逐月收支圖上，就會出現三．三三美元（檢視妮娜的逐月收支圖，看起來如何）。


    （1,000美元 × 4%）/ 12 = 3.33美元/月


    當然，與圖上的收入高峰相比，這只是一個很小的數字，但它仍然每月有三．三三美元（每四年四十美元）的進帳。為了讓它更有趣，我們嘗試將其轉化為有形的東西，一些生存所必需的東西。它可能是一個月內使用的大米數量，或者幾個星期的咖啡豆，或者手機帳單的一部分。繼續使用這個方程式，把你每個月累計的結餘都算進去。如果在第二個月內另外存了五百美元，請將其添加到之前的總額一千美元，當月的公式就會是：


    （1,500美元 × 4%）/ 12 = 5美元/月


    把這結果連接到上一張，幾個月後你的圖表會出現從底部爬上來的第三條線。這條線代表每月投資收益（見圖表8-3）。一旦你的收入和支出穩定，你就可以計算出需要多少儲蓄和投資，才能到達財務獨立的最終點，不再需要工作。


    專家算過，若你的總資產是年度開支的二十五倍，財務獨立的交叉點就會出現。這樣的資產規模，可以無限提供4%的領率。例如你每年基本花用需三萬六千美元，當總資產達到九十多萬美元（36,000×25），就能實現財務獨立。


    第九章將告訴你，何時該讓你的儲蓄起飛，成為投資的一部分。當你每月有穩定的資本時，比方說，你投資了五千美元在債券上，該投資收入將成為你每月投資收入的一部分，你累積的下一筆五千美元，將以類似的方式投資，持續下去。


    ### 圖表 8-3 套用公式可以得到每月投資所得，並把數字填進逐月收支圖


    ![](img/9613d65bc6187206ad77a54ffefc649f_284_0.png)


    回到妮娜的圖表（見圖表 8-4）。


    因為她本來未負債，妮娜的投資收入曲線，要等到她兼差一年後才顯現出來。


    一旦她開始存錢並將其轉化為資本，她的月度投資收入就會不斷增加。


    例如，在第四年的一月，妮娜當月的投資收入為二一五美元，而她的開支為八四五美元。到隔年一月，她的月度投資收入增加為三五○美元，開支仍低於一千美元。第五年的二月，她的當月投資收入，跳升至五四五美元，開支仍然不到九五○美元。我們看到的，不僅是妮娜不斷增加的投資收益，還有複利的魔力。


    ### 圖表 8-4 妮娜的逐月收支圖表


    ![](img/9613d65bc6187206ad77a54ffefc649f_285_0.png)


    即使每個月你的資本金額呈等量增加（例如，每月儲蓄五百美元），複利也會確保逐月收支圖表上的投資收益線，是向上成長的。這是複利的力量，意味著將利息收入加到資本中，使原始資本不斷增加，其衍生出來的利息自然越來越多。例如：


    - 第一年，一百美元資本，獲得4%的利息收入，把這四美元再投入資本。

    - 第二年，你的資本增加為一〇四美元。這一年你將拿到四·一六美元的利息加入資本中。

    - 第三年，總投入資本變為一〇八·一六美元，你的利息收入上升至四·三三美元。

    - 第四年，資本增加至一一二·四九美元，利率4%，利息四·五美元，再將它加入資本。

    - 第五年，資本變為一一六·九九九美元，利率4%，利息收入增加至四·六八美元。


    如此不斷下去。


    這可應用到各種不同的狀況。根據經驗，如果以7%的速度增長，在複利的狀況下，任何事情都會在十年內翻一倍。資金、人口、債務（卡債利率從12%到24%不等）都一樣。由於假定利率是4%，因此一百美元在十八年之後，會達到兩百美元。你可以看到妮娜收支圖的上升趨勢，月度投資收益線不斷增加，同時，支出費用保持平穩沒有上升，等一下就就會看到這一點的重要。光是按月進行這些步驟，妮娜的投資收入已經可以明顯上升，你也做得到！


    ## 你應該把儲蓄放在哪裡？


    在財富積累過程中，首先，必須在銀行帳戶中建立隨時可用現金部位。一般來說，可供三個月（最好是六個月）生活的流動資金是必要的。因為一旦銀行倒閉，美國政府的聯邦存款保險會提供每個帳戶二十五萬美元的保險。放哪家銀行也必須慎選，你的銀行過去紀錄如何？過往的授信或放貸紀錄有沒有問題？你選擇離你家最近的那家嗎？你選擇信合社，還是類似農會的金融合作社？還是網路銀行，讓你在全球都可以交易？或是利息條件較優的金融機構？


    我們稱這種流動現金為「緩衝部位」（cushion）。如果你必須回家看望生病的父母，或者舊車突然整片壞掉了，這個戶頭就是儲存日常急用資金的地方，也是存入收入和支付帳單的地方。如果你目前以債養債，要有半年生活準備，似乎不太可能，但不要害怕，我們將協助你做到。


    ## 緩衝部位之外


    此外，在第九章中，我們會介紹一些好用的投資工具，讓你用較少的資本創造好的收入。喬曾推薦美國公債是很好的工具，但如今投資公債的黃金時機早已消失……不知道它何時會回來。


    第九章還將討論，自一九九二 年本書首次出版以來，財務獨立人士使用的其他策略。如果你希望現金多一點，可以買階梯式的定存單（到期日不同）；如果你信仰財務獨立，提早退休理論，指數型基金是不錯的選擇（第九章會詳述）。有些人可能很幸運已經開始儲蓄，如果你上班的公司提供
    401k 或類似的退休計畫，請充分利用。因為許多雇主將以你的貢獻及工作表現，提供相對應的退休準備（～工資的6%），這等於是提供免費的投資資金，而且不用繳稅。現在大多數(401k)都由大型資產公司管理，提供多種選擇，從共同基金到債券基金都可嘗試。如果自己開公司，也可以開設(401c)或SEP。


    如果雇主沒提供這樣的計畫，請考慮建立個人退休金帳戶。任何人都可以開立一個，就像雇主提供的退休金帳戶一樣。個人退休金帳戶也提供稅收優惠甚至免稅誘因，(401k)和個人退休金帳戶，是上班族可以好好利用的工具。還有很多其他選擇，這裡提到的只是概括的介紹，如何把你辛苦存下來的錢進一步變成賺錢機器。


    這看起來可能有點奇怪，但你還是得繼續存錢，這條每月投資收入線不會受你收支狀況的影響。之後，當你達成財務獨立、靠投資被動收入不再需要工作時，這條線也將不再需要。正如之前提到的，無論你把存款放在活期存款、定存單還是退休金帳戶，你都可以借用四%的公式，預期投資產生的回報。


    ## 終極目標：「交叉」點


    有一天，當檢視逐月收支圖時，你馬上可以預測未來可能創造的投資收入。由於你的每月總支出相當穩定，因此，這條曲線的走勢也在預估範圍裡。不過切記，如果你的支出穩定在一個範圍內，例如每月兩千八百到三千兩百美元，務必選擇較高的數字，做為推估的基準。這樣你就可以非常安全地預測未來可能的支出，更可以消除一些內心的不安。


    你會注意到，在不久的將來，這兩條線(每月支出和每月投資收入)將會交叉。我們稱之為交叉點(圖表8-5)。只要過了交叉點，就代表你的投資收入已經高於你的每月開支，此時，工作不再是再必要，只是人生中的一個選項而已！


    這個交叉點就是我們追求財務獨立的終極目標，你的每月投資收入超過每月支出，已經達到傳統意義上的財務獨立。工作不再是收入的主要來源，工作以外的被動收入已經成為另一項財務。


    ## 看清楚未來就會產生力量


    如此，你對未來會有更清晰的面貌，這是一種力量，對許多人的人生都會產生重大影響。試想，如果你認為自己的生活比工作更重要，在可預見的未來，不需要為錢折腰，那麼你很可能成為一個更加積極主動、高度誠信的打工皇帝。當你知道，為錢工作的時日已經開始倒數計時，你的自信、動力、敬業、正直、快樂、驕傲及責任感將會加倍，會更妥善利用自己的生命活力。


