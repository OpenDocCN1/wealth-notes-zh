    ## 附錄 九大步驟的簡版說明


    沒有比這個更短的捷徑了，這整本書的九個步驟就是捷徑。這幾個步驟做成如下的結論，可時時回顧、參考、提醒。


    這是一個系統性的做法，你必須有意識地，讓這些步驟自動地融入在個人理財的理路中。不管你從事哪一行，這些都是最基本的練習。別忘了，你自己的人生，就是最重要的事業。人生這個事業，就是讓幸福這件事的回報率極大化，讓每小時都花得有價值。


    ### 第一步：跟過去和解


    - A. 你這一生中已經賺了多少錢？算算看你這一生中賺了多少钱，從你賺進的第一塊錢算起，到你最近的一筆收入。

    - B. 怎樣把這些錢表列出來？怎樣才知道你真正創造的價值？做一張自己的資產負債表，清楚列出哪些是資產（是你擁有的），哪些是負債（你欠別人的）。


    ### 第二步：活在當下


    - A. 你用多少錢交換生命力？你用一生中的生命力，換得了哪些東西？把你維持工作所要花的時間及賺得的金錢，列出一張表，算算看，每小時的工資是多少？

    - B. 仔細記錄每一塊錢從哪賺來及怎麼花出去的。


    ### 第三步：錢都跑哪裡去了？（每月收支表）


    每個月把所有有花的錢，依你花錢的模式分類別類地記下來。也把收入記下來。把每個項目花的錢，用你在上一個步驟計算出每小時薪資的方法，換算成『生命活力小時』（hours
    of life energy）。


    ### 第四步：下面三個問題可以改變你的人生


    對照你的每月收支表，看著每一項的支出及其它花費掉的生命活力，問問自己下面的問題：


    - 1. 我在使用生命活力的同時，生命是否因此得到等量的充實、滿足？

    - 2. 使用生命活力時，是否跟自己的價值及人生目的一致？

    - 3. 如果不是為錢工作，你的消費型態會有怎樣的改變？


    回答完這些問題之後，評估一下每個類別，支出金額應該要增加，還是要減少，或是維持，以達到生活豐足的最終目的。這是這個計畫的核心。


    ### 第五步：讓生命活力具象化


    製作逐月收支圖，把每月收入及支出清楚記載在上面，把它掛在你每天都能看得見的地方。


    ### 第六步：衡量你的生命活力——把花用減到最低


    學習並練習聰明使用你的生命活力（金錢），可以讓開支降低、存款提高，這樣做，也可以讓生命更富足、健全，讓人生往自己信仰的價值發展。


    ### 第七步：重估你的生命活力，最大化你的收入


    尊重你投入工作的生命活力。金錢只是你用生命活力換取的東西。以有責任感、誠信的方式交易來賺取收益。


    ### 第八步：資本與交叉點


    利用下面的公式「資本 × 長天期利率 ／ 12（個月） ã 每月投資收入」，在你的逐月收支圖上，記錄你的投資所得，把它編製成一條獨立的線。


    ### 第九步：為財務獨立所做的投資


    這步驟協助你變成一個智者、成熟的投資人，可以創造穩定的所得，以供給長期生活的需要。根據以下二個重點設定自己的財務計畫：


    - 资本：財務獨立的核心資金部位

    - 緩衝部位：準備足夠維持六個月生活的急用金藏金室

    - 藏金室：執行九大步驟之後，多賺到的錢


    ## 附錄 讓我們來談一談錢


    「金錢萬能！」這句諺語源自於希臘劇作家歐里庇得斯（Euripides），充分表達金錢可以交換各種物品、無所不能的魔力，從商業、政治、貿易甚至是愛情。


    不過，金錢萬能之後，其他價值似乎都靠邊站了！！金錢就像尚方寶劍一樣，一旦出鞘，大家都閉嘴！


    我們活在一個被金錢掌控的文化裡，分享個人的財務狀況似乎變成社會上的禁忌，不過，我們現在想要扭轉這個情況。


    公開討論金錢的目的是打破你與金錢之間原本互不往來的狀況，並開啟新的對話。你最後一次公開討論債務是什麼時候？或者你的收入？大多數人碰到金錢問題的時候，都一個人自尋出路，想要透過看書、看新聞報導及閱讀理財專欄得到答案，在不同的意見中游移，反覆摸索，想要透過存錢、消費或投資，邁向幸福之路。


    在談一談錢一社團中，我們必須抱持著「別羞愧、勿責怪」的精神，透過對話，讓我們對金錢的偏見、恐懼、瘋狂、遺憾甚至謊言，可以有公開並被討論的機會。


    你不想聽聽大家對金錢的看法嗎？你不想聽聽他們做過哪些最愚蠢的錯誤和最聰明的決策嗎？你不想聽聽別人的教訓，避免重蹈覆轍？你不希望找一個安全的地方，彼此可以交換想法、金錢觀、工作、收入、儲蓄、付出及心裡的秘密嗎？


    「像许多年轻人一样，」陶尼塔说，「我陷入了一個典型朝九晚五的生活型态，这对我不合适。我想有所作为，但坐在电脑后面八个小时并没有办法完成这个想法。在这段时间里，朋友向我介绍了一个简单的互助圈体。我发现它是一个安全的地方，人们分享他们的愿望、恐惧、价值观和人生目标。我们讨论了与金融、科技、永续及心灵等等的话题。我越来越受到启发，希望过著有意义、有目的性及探险的生活。有一天，我觉醒了：如果不采取行动，生活不会改变。我一直梦想著旅行，但是每每都用不同藉口拖延。不久，我辞去了工作，并预订了飞往世界另一端的飞机票，独自背著行囊，走远这个世界。」


    # 「谈一谈钱」这个工具看似简单，但真的可以改变你的生活。包括一些准则、一个能引起大家兴趣的话题，一个让每个人都有转换的过程。儘管讓大家敞開心扉談自己的財務，聽起來讓人感覺又害怕，但根據多年的經驗，這種簡單的方法，我有信心可以讓大家感覺到：


    - 释放

    - 更有活力

    - 做决定时更自在

    - 更有动机改变与金钱的关系


    在「谈一谈钱」团体中，没有专家，因为它不是纠错大会，而是一个认识自己的场合。当人

