    為對折扣)以搭配鞋子，又幫小孩買了幾件新衣，反正是刷卡付錢。突然想到回家之後要修剪一下花草，糟糕！修剪苗圃需要園藝剪。家中的烤麵包機，即使調到最弱的火力還是把麵包烤焦，又找不到保證書，只好到賣場再買一台新的，結果結帳時又拿了一個組合式的置物架及廚房用的油漆，啊！差點忘了買烤麵包機。跟伴侶出去吃頓飯，把小孩交給保母顧一下。週日上午弄點鬆餅給大家當早餐吧，糟糕，沒麵粉了，去雜貨店買點麵粉吧，結果又順手買了草莓藍莓，搭配鬆餅，還有楓糖、蘇門答臘咖啡，千萬別忘了要買麵粉。帶小孩去湖邊游泳，到加油站加油，看看價目表，不由得眉頭一皺。開車到鄉間的餐廳吃晚餐，再用信用卡付帳。回到家看看電視打發時間，不時有誘人的廣告出現，企圖說服觀眾：只要買了保时捷跑車、到國外旅遊或是買一台新的電腦，生活會更好。我們以為可以透過工作滿足這些需求，但其實我們花的錢比賺的還多，消費的東西比我們需要的多，這使得我們又得回到職場賺錢。


    # 幸福是什麼？


    假如每天辛苦工作可以換來快樂，那麼一點點不爽或不方便好像是值得的；假如我們相信我們的工作會讓世界更美好，犧牲睡眠及生活品質，也不會覺得被剝奪；假如用辛苦錢多買一個玩具，帶來的不僅是經濟上的滿足，而是心靈上的激勵，那麼工作也會快樂點。但很明顯地，金錢除了能滿足基本的生活安穩外，並沒有辦法帶來我們所要的幸福，


    在我們舉辦的論壇中，不論收入多寡，幾乎所有的參與者總是認為擁有「更多」才能帶來幸福。我們請參與者為自己幸福指數評分，一是困苦，五是很幸福，三則是「沒有什麼好抱怨'
