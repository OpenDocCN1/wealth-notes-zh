    ## 前言


    ### 關於這本書


    歡迎大家！不管你是千禧世代、X世代或是戰後嬰兒潮的高年級生，這本《跟錢好好相處》就是為你寫的。自從《跟錢好好相處》第一版（中文版書名為《富足人生：要錢還是要命》，曾於二〇二二年出版）上市以來，這本書已經成為我們這個時代的經典，曾經幫助過無數人改善他們與金錢的關係，裡面提到的概念及想法，歷久彌新。但是社會變動太快，我必須勤勞最佳團隊修整內容，以符合現代及未來的脈動和環境。


    當然，我們最關心的就是你的需求，你一定會想：這本書真的能幫到我嗎？真的可以協助我擺脫貸款、重燃摺置已久的夢想、買到心目中的房子或是離開不適合我的工作？或者讓我有足夠的錢支撐更多的消費，或是讓收入成長、豐厚存款，甚或擺脫每天為錢辛苦奔波的日子？


    可以的，相信我。


    確切一點說：相信你自己。


    如果你能善用本書提供的工具，改變就會發生，因為有非常多人藉由使用這些工具，已經改變自己。我在這裡做出以下承諾：


    - 你的消費會少很多，但生活過得更愉快。

    - 你會存下比想像中更多的錢。

    - 你的債務會減輕，對不必要支出的抵抗能力會更好，也不必為了取悅一些你根本不喜歡的人，而產生無謂的花費（摘譯自羅伯特．奎倫（Robert Kiyosaki））。

    - 你會花更多時間在真正重要的事情上。

    - 你可以較不費力地了解自己。

    - 你會更自在坦然地面對自己的財務。

    - 不再責怪自己以前胡亂敗家的行爲，也會養成好習慣。

    - 開始為退休做準備，富足退休，可能比你想象的容易一些。

    - 你會開始為了自己的人生價值而活，而不是為了錢而庸庸碌碌。


    ### 財務獨立，才能得到真正的自由


    重塑你跟金錢的關係及達成財務獨立（Financial Independence），是本書最重要的目的，希望藉由健全財務九大步驟，使最珍貴的資源——你的時間——得到自由，以便追求真正的幸福、自由及存在的意義。


    但改變與金錢的關係意義到底為何？答案不在於多賺或是少賺，重點是要釐清一件事：如果要過自己理想中的生活，到底多少錢才夠？同時希望大家擺脫被金錢左右的日了，在消費時訴諸理性。每個人都做得到。


    至於什麼是財務獨立？最基本的要求：如果達到財務獨立的境界，將不再為了賺錢而工作，除此之外，《跟錢好好相處》這本書將帶領你從僵固的思想解放出來，不再以為消費是達成快樂的最重要手段，更不會認為擁有的東西越多越好，你會發現，以往對待金錢的模式已經消失，如果你按照本書的步驟行事，債務也會一點一點減少，同時，儲蓄會越來越多，如果有超乎預期的額外支出，你也不再驚慌。儲蓄會變成你的好習慣，存款會越來越多，最後，到底要為熱情工作，還是為了金錢工作，選擇權就會回到你的手上。很多人都做到了，你也可以。


    隨著本書提出的計畫及步驟，你會發現自己其實不需要為了賺錢，把大部分的人生投注在工作上。朝九晚五的操勞，也許是社會上約定成俗的做法，但你會發現，人生其實可以有不同的道路，你可以回應內心的召喚及更美好的未來，從人生的高速公路駛下匝道，走自己的路。


    到底要怎麼做，才能不再為了金錢而工作？現在你可能還不知道，但依照本書建議，你會更清楚、更聚焦，當夢想出現時，會更有信心地迎向它。


    一位順利脫變的學員曾說，「這本書關心的，真的不只是金錢，而是整個人生。」


    ### 這本書如何诞生的？


    首先介紹喬·杜明桂（Jo Domingus），他是財務獨立九大步驟的創始人，從小生長在紐約市的拉丁貧民區，由不會講英語的媽媽靠著政府的福利金一手拉拔長大。身材短小但很聰明，沒有精實的肌肉的他，用頭腦讓自己脫離了貧民窟的困難。為了活下去，喬練就了一身生存的本領，對於身旁的機會及威脅，有非常敏銳的觀察及想法，他的部分才能也貢獻在這本《跟錢好好相處》的內容。


    喬認為，資本主義的金錢體系很像社會福利制度及司法制度：我如何活出自己要的生活，不被環境左右。他沒有大學學歷，但在華爾街找到工作，他遂做邊學，一直找機會突破現狀，在電腦主機比房間還大的一九六〇年代早期就研發出第一套技術分析工具。喬沒有把賺來的錢押注在資本市場，反而將研發所得賣給了一個投資銀行，因為他立誓要存錢，並在三十歲以前退休，離開充滿金錢遊戲的華爾街。讓自己過上真正的人生，而不是在工作的監牢中勞苦一生。


    我在一九七〇年代認識喬並開始合作，對於人生意的，我們彼此有相當高的共識：希望我們的世界能一點一點變得更好。在過去二十多年來，我們合作教學、寫作及演譯，彼此的差異往往成為下一個創新做法的養分。他個性內向，我外向；他長於系統性思考，我愛即興演出；他規畫大方向，我則向賽馬一樣，依照他的宏觀策略，盯著目標一直往前衝。


    我們共同的著作《跟錢好好相處》一夕爆紅，一上市就深受歡迎。喬在一九七一年初，因為癌症過世時，我們的事業正如日中天。《跟錢好好相處》一直屹立在《紐約時報》暢銷書排行榜上，更連續五年登上美國《商業週刊》的暢銷榜，我們相信，只要有夠多的願望使用我們的工具改善財務，我們擁有的一種種都會更長，進而足以改變這個世界”。


    喬過世之後，我繼續工作，讓這項運動保持充沛能量地前進。我與各界的意見領袖共同發起宣言，進行一場又一場的演講，以便分享永綻及簡單生活的想法，希望在場的有力人士及國際團體能夠幫忙呼籲。二〇一四年，我自己也被診斷出癌症擴散，我的賽馬被操壞了，雖然已經有無數的人感激我們的貢獻，但我跟喬的遠大目標還沒真正地落實。我退休了，移居到西北太平洋的一座小島上，島上只有一千位居民，我只能把精神集中在這一小片土地上，希望帶來一些改變。


    十二年後，我接到一通電話，當時我正在對一群人講有關金錢的事，在座的聽眾對於金錢都表達出擔憂及疑惑。一位生活優渥的八十歲老人擔憂自己在沒過世之前錢就花光了；一位事業有成的中年人在同一職位上待了太久，很擔心自己會被迫離開；其中還有一些從事顧問業的聽眾承認在金錢這個議題上沒有辦法幫助客戶，因為自己也不太確定該如何做。最後，一位大三的學生提出了問題，她說，若要在專業領域中出頭，必須要有碩士及博士學位，但學貸就已經兩萬美金，如今跟這個領域沾上邊了，但她憂心之後靠學貸賺到的錢是否足夠償價。


    我中心熱情之火開始重燃，我們的社會為何會讓大家在這樣不穩定、不可靠及不受控制的環境下生活，我們的社會為何讓年輕人成為舉債產業（debt business）的獲利來源？我問聽眾有沒有看過《賺錢好好相處》這本書，回答：「是」的大部分都是灰髮的中年人，沒有一個在三十五歲以下。《賺錢好好相處》這本書已經協助一代代的讀者從金錢陷阱中掙脫出來，我想應該也可以讓這個年輕世代打破不斷消費的魔咒，在人生關鍵決策的時刻拉他們一把。


    因此，我開始找一些年輕世代談談，了解他們的情況及心態，我發現，財務獨立及提早退休確實不是少年輕人的想法，在許多朋友的鼓勵下，我決定重新編輯這本經典，把一些新時代的元素及環境加入這個更新版中。看過原始版本的讀者也不用擔心，因為更新版的核心脊幹觀念並沒有改變，之前深受大家歡迎的觀念，新版中仍然存在。


    ## 時代一直在變


    新版讀者身處的時代，與香及我開始提倡財務獨立時已經很不同。經歷了二○年代的經濟大蕭條及二次世界大戰，為戰後嬰兒潮的父母提供了平穩且成長的環境。漸進式個人所得稅制度及美國軍人權利法案（GIB）①等政府施政，厚植了美國中產階級，社會凝聚力也逐漸增強。但在進入二十一世紀之後，職場及企業已然改變，退休金制度正逐漸步入死亡，退休已經成為年輕人及熟年世的奢望，六十五歲以上的美國人，有五分之一必須完全仰賴社會救助過活；有一半以上的人，社會救助則占了其收入的五成。


    > ① 譯註：「美國軍人權利法案」（The GI Bill of Rights），正式名稱為「一九四四年軍人復員法案」（THE SERVICEMEN''S
    READJUSTMENT ACT OF 1944）。規定參與二次大戰的軍人可立即獲得由失業保險支付的現金補貼，更重要的，還提供退伍軍人多樣化的教育機會，從在職訓練到高等教育均可，也可獲得充足的家庭或商業貸款幫助。


    ### 適應新世界


    進入職場的年輕人，大學四年的學歷換來的薪資，無法清償在學期間累積的各項債務。不論做什麼工作，每個人幾乎都成了2020階級（pre-or-post-OPE），自生自滅。現在社會的流動性史無前例地高，每個人可以自由移動，不管是居住地點、職業選擇或是個人生活、人生目的，選項非常多元。老實說這還滿令人害怕的，但同時也讓人興奮，因為各種不同階層的人，在快速變遷的環境中，各自尋找自己的天空。


    新新人類在這個時代活得到底好不好？我很好奇，所以只要有機會，便不斷地找二十幾歲或三十出頭的年輕人聊天。我成立了一個焦點團體訪談（focus group），在FBCO®及臉書上也成立了粉絲團。


    我非常驚訝也很感動，我觀察到的新世代，已經有辦法把破碎的舊美國夢，重新改造成適合自己生活的型態。不少人揚棄傳統定義的職場成功階梯，改為追尋生活的真正意義，採用一些更想法、彈性且原創新十足的工作方式，因此這群人不再追求單一工作職位，而把眼光放到更宏觀的職場生涯。他們取得技能的方式也不再局限於學校，更多元的學習環境——職業訓練所、特定技能的工作坊、知名學校附設的社區大學、線上、開放課程、當學徒，都是可以磨練自己的途徑。


    在工作與工作間，更多人願意給自己一年的空檔充實自我。有越來越多年輕人，不走進辦公室上班的傳統老路，而在共同工作空間及创客空間成立一家公司，或是在咖啡店及自己亂七八糟床上工作，不需要了解所做的是不是會改變世界，或純粹為自己和興趣；走到哪裡，都可以建立社群、團隊、新創公司甚至新工作技能，只要一技在身，他們很願意停下工作，旅行、追尋自我或是養小孩。結果，不少
    X 世代及嬰兒潮世代，都開始向這些年輕人學習如何適應這個變動的世界，以下就是幾個充滿創意及適應能力的年輕人故事：


    布蘭登排行老六，是家中的么子。家裡雖然有能力資助大哥上大學，但每學期的學費，都是個好幾千美元，為了彌補短缺，大哥必須在一家連鎖賣場打工，擔任助理銷售員。但當布蘭登高中畢業時，大哥雖然已經念完大學，但仍然在同一家賣場，擔任同樣的職務領一樣的薪水。大學學歷對其衍生出來的債務，似乎一點都不值得。看到這樣的狀況，布蘭登索性不走升學之路，選擇直接到農場工作，開拖車為生，用開車賺來的薪水，進了一所職校，學習如何用電腦系統修車，希望日後能領到一小时四十美元的高薪。


    克里斯在大學主修工程，畢業後進入一家知名的航太公司，才一年就把大學學費付清，同時還有些存款。但他決定辭職，用一年的時間旅行及從事社會服務工作，一年之後，他回到職場，全新的工作內容更有趣，薪水也更好。


    美樂蒂在租車公司的櫃台當接待，用存款去上一年兩年制的護理學校，拿到護理師助理的執照，目前正在思考要繼續進階深造，還是進入醫療職場？更重要的是得計算一下，如果有新工作，要花多久的時間才能還完因為拿到護理師執照欠下的債務。


    奈歐米在高中時，就參與了美國政府推行的「開始起跑」（Head Start）計畫@@，先利用一年的時間把大學必修課程修完，第二年進入社區大學，之後再轉到一般大學，拿到社會服務的學位，一毛債務也沒欠。「開始起步」確實能讓高中生發揮潛力，有些學生中還沒畢業，就已經修了兩年大學課程。


    > ◎譯註：美國政府推行的制度，高中生在上大學之前，就可以開始累積大學學分。


    一些年長的職場人士也會採用這種跨界式的創意做法，醫生成業木匠，木匠轉身變成建築師，社工開始務農，喜歡藝文人士走出辦公室，變成歐洲重要博物館的導覽人員，生物學家離開實驗室，帶領一般民眾深入雨林，進行養生課程。老師變成心理治療師，軍人運用在軍中的訓練，退伍後轉戰其他領域，有的非常高科技，待遇也相当不錯。有些人發現自己的真愛，投入理財專員，或不動產銷售，甚至有人進修成為博士，當大學教授。根據美國勞工統計局（Bureau
    of Labor Statistics）資料$^①$，現在有更多人在多個不同的職業中遊走，有時候升遷，有時候留停，有時候又退回原點，總之，就是一直在轉換。


    但全美超過五〇％的人一半收入是靠社會福利支應，對他們而言好時光永遠都在，所以不用存款及計畫？其實，很多人已經開始延長自己的工作年齡，甚至想一直工作到嗚氣為止。他們縮減生活所需的費用，或搬到離小孩比較近的地方，減輕雇用照護人員的支出。活用政府提供的社會服務，看似較便宜的下午場電影或參加免費的活動，他們投入社區，在志工中找到生活樂趣。他們仿效二〇七〇年代，也參與所謂的「零工經濟」（Gig
    economy）。$^②$，或從事雜工、部落格、經營民宿，把自己最值錢的資產——房子，變成收入來源的一部份。不論你是大學生、職場中年，或是即將退休的灰髮族，本書中的工具，都可以協助你過上自己想要的人生，讓生命光譜更豐富多彩。


    > ① 參見：Bureau of Labor Statistics (US), “Number of Jobs Held, Labor Market Activity,
    and Earnings Growth Among the Youngest Baby Boomers: Results from a Longitudinal
    Survey” (March 31, 2015),https://www.bls.gov/news.release/pdf/nlsay.pdf

    > ② 編註：指由自由業者構成的經濟領域。


    ### 這本書給誰看的？


    只要有收入，也有支出，那就是這本書的讀者，不是讓每個人都變有錢，而是透過此書了解，自己生命中定義的「足夠」到是什麼樣的狀態。透過這本書，可以幫助你改善與金錢的關係，這是每個人必做的人生功課，「眼錢好好相處」希望能幫大家達到「足夠」的境界。貪求越多越好是一個永無止境的黑洞，不論你現在手上有多少錢，心中那個「越多越好」的聲音，把你帶向越買越多的死胡同。貪念是人心最多的欲望之一，非常頑強地存在著，不受公平、平衡及愛的制約，貪念會讓我們快樂的能力消失。要定義「足夠」，必須先問自己以下的關鍵問題：


    - 什麼讓你感到快樂？

    - 生命中最重要的是什麼？

    - 哪些價值，你絕對不願妥協？

    - 假如你現在有三千萬，你會用空下來的時間做什麼？

    - 如果在你的生命中拿掉一個東西，會讓你更快樂一些，那個東西會是什麼？（只能選東西，不能選人。）

    - 會有足夠的錢退休嗎？

    - 如果有人可以幫你還清現在所有的債務，你還會再次去借錢嗎？你會怎麼做？


    諾貝爾獎得主、同時也是暢銷書作家卡尼曼（Daniel Kahneman），曾對金錢與幸福做了一項研究發現，富足到某個程度之後（以美國現在的標準約一年七萬五千美元），更多的金錢就無法買到更多的快樂了。在一九八〇年代，當我們推廣財務獨立計畫時，曾對參與的人進行了一項分析（因為那時還沒有筆記型電腦，我們都用紙和筆當工具），問到：要賺多少錢，你才會快樂？結果，不論參與者的薪資落在哪個水準，幾乎每個人的答案都是：比我在多五〇%；請他們對目前的幸福感打分數（一至五分），分析答案後發現，所得水準最高的群組與所得相對低的水準之間，沒有顯著差距。當課堂上的學生，知道坐在他前一排的同學，沒有因為所得比較高而感覺比較快樂時，現場鴉雀無聲。


    這顯示，與金錢維持一個良性、清楚及版權的⊙關係，是成功人生的重要關鍵，而非所擁有的「數字」（數字只是無中生有的 luckoffugle 及一個設定的目標）。當《賺錢好好相處》在一九九二年出版時，坊間並沒有討論金錢與幸福相關的書籍，現在，已有許多人透過我們的方法，達到財務獨立的境界。


    > ⊙ 編註：槌權是獲得自我掌控自身相關事務的力量，或稱為「培力」。


    這些人有兩項強大的人格特質：


    - 人生的目標比目前身處的有限客觀環境（包括工作）更远大。

    - 願意改變，誠實面對一切，變成可靠的人，而且一直堅持下去。


    這些特質，代表追求財務獨立的內心力量已經被點燃。就我的觀察發現，他們的骨子裡，已經有三種深刻的價值（grace）一—節儉、簡單及自我滿足。這三種價值，千年來鑄就了人類文明、現代社會及各式宗教，且貫穿了不同政治背景、文化差異及地理位置的人們，當然也適用在

