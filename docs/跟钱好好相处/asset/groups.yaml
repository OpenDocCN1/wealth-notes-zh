    ## 步驟四的重點摘要


    1. 在記錄你的每月收支表時，同時自問問題一：「在使用生命力活力的同時，我有得到同等充實、滿足嗎？」如果有，請在欄目上加注，根據情況不同，註記+（或一個向上的箭頭）、－（或一個向下的箭頭）或○。


    2. 在記錄你的每月收支表時，同時自問問題二：「使用生命活力時，有沒有跟你自己的價值及人生目的一致？」如果有，請在欄目上加註，根據情況不同，註記＋（或一個向上的箭頭）、－（或一個向下的箭頭）或○。


    3. 在記錄你的每月收支表時，同時自問問題三：如果你不為錢工作，你的消費型態會做怎樣的改變？


    4. 再次檢視一下你的收支項目及註記的記號。


    # 談一談錢。關於錢的幾個問題


    你的夢想、價值、回憶及人生故事，都是開啟與他人對話的話題。如果從別人那裡，聽到令你有一「有為者亦若是」的衝動的夢想或目標，別客氣，把它偷過來自己用！我們可以大家一起打造真正美好的生活藍圖，用簡介裡談到的建議，透過這個計畫，讓金錢說話。借用本結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。記得如果在反省時，都能不忘在最後加上一句「為什麼？」，這樣會讓你有更深層的思考；如果都不記不問一句：「社會如何看待我的答案？」，則會讓思慮反面更為廣泛。不論如何，這些問題，都沒有標準答案。


    - 你長大後的志願是什麼？現在達到了嗎？

    - 你的「遺願清單」( Bucket List)⊕中有哪些臨終前想完成的事？

    - 你的內心及靈魂深處的召喚是什麼？

    - 講講你最愉快的時刻？是什麼讓你感到快樂？

    - 有哪些意想不到的事發生之後，會讓你的夢想成真？

    - 如果可以，你想要用金錢幫小孩及所愛的人買什麼東西？


    ⊕ 編註：指一張一定要（或者最好）在死前全部完成的清單。


    # 第 5 章


    # 全部攤在陽光下吧！


    ### 步驟五：讓生命活力具象化


    在這個階段裡，要把你的生命活力全部攤開來。把它們畫成圖表，會讓你有更清晰的觀念，不論是現在、以前或是未來，讓你对自己的財務狀況有更完整的輪廓。這樣，就能改造你與金錢（生命活力）的關係。


    透過第二個月的收支紀錄，你对自己的花費及有多少錢流進流出，應該已經有一個比較完整的概念。


    面對自己正步向債台高築的死胡同，練習剛開始的時候，可能會感覺很不舒服想放棄，你可能會對自己說，「這個小練習還不錯啦，但我已經知道我想到的東西了！」但如果你再堅持一個月，應該會發現支出將大幅減少。覺醒是一條長路，小小逃避一下，其實沒有人看得見，要秉持著「別羞愧，勿責難」的精神，繼續走下去。第三個月改變會更顯著，你會省更多錢。但你可能會開始鬆懈，因為過去幾個月你都照表操課地做到了，不論要給自己一點小鼓勵，或是想暫時忽視眼前殘酷的事實，你都要拿出意志力來走完這條路。


    要如何激勵自己一直向前走？要改變自己的行為模式，通常會有三個關鍵：


    1. 把它變成習慣，不是有一搭沒一搭地做。你必須有系統地作爲，直到變成一般生活的日常，就像刷牙一樣。


    2. 請別人幫忙。告訴你的朋友或公開發示你的決心，一定要把花費寫下來，並在面註記往及往下的箭頭，每個月定期跟一個信得過的朋友碰一次面，報告你的進度並聊心得。或者每天用電話、簡訊或聊天軟體給朋友，讓他知道你的狀況。更進一步，你可以把你記帳的密碼給這位值得信賴的朋友，讓他監督你，你也可以幫他進行帳務監控。相互幫忙，愛管閒事，有時候也會讓事情更有效率。


    3. 圖表。把每天該做的事，列一張檢查表，就像減肥時會在體重計上記錄體重變化一樣，管理體重這樣做，管理金錢也一樣，把過程記錄下來，真的能讓欲望不致潰堤。


    步驟五就是希望你能把記錄的收支狀況，做成一張圖，你自己決定怎麼做可以讓事情比較順利，準確牢靠。我們會提供一些建議及方法，讓你加快這個過程，平穩地向財務健全的目標前進。


    出發了，繫好你的安全帶。


    # 製作自己的逐月收支圖（WALL CHART）


    首先，你必須要有一張大圖，空間足夠讓你記載五年的資料，在設計時必須讓圖表容易操作，維持上也不會花太大力氣。最詳細的資訊，其實你都已經放在每月收支表上了，就算沒有電腦或
    $eg$ 也可以進行，最重要的事就是起而行。你可能正在使用 $eg$ ，線上服務或是記帳軟體協助管理金錢，這些工具可能可以在上面直接製作圖表，但我们仍希望你能夠親手製作。至於如何運用資訊管理軟體，步驟五的第二部分會介紹。


    找一張大型的圖表紙（$18 \times 12$ 吋或 $24 \times 36$ 吋，約 $A3$ 或 $A1$ 大小，每一吋有十個方格的圖表紙），在一般文具行或書店應該都買得到。如果真的沒有也不用太擔心，你可以在一張大白紙上畫方格，左方的縱軸代表的是金錢，金額由低至至高：你可以畫兩條線，一條是收入，一條是支出，記得上方多留一點空間，因為依照過去輔導的經驗，你的收入可能會增加甚至加倍。不只一位朋友，在執行計畫之後，收入增加到還得在上方多加一張紙，他們以前從來不敢這樣奢望。


    下方的橫軸代表時間，我們建議保留五到十年的時間，這樣才可以看到更大範圍的趨勢——更可以看著你在真正的財務獨立前進的足跡。如果你覺得用資訊工具輔助比較好，$eg$
    或其他有電子表格類的軟體是不錯的選擇。完成這些步驟之後，你會發現自己看到了一個新的世界，但資訊工具帶來的發現，絕對沒有比你一筆一筆畫在紙本上來得震撼，成就感也很難與手做比較。


    每個月月底，都記得在紙上標註你這個月的收入及支出，最好用不同的顏色，區分收入及支出，之後再用線把每個月的點連起來。第一個月，當你畫上第一個記號時，你已經開啟建立與金錢新關係的第一步，這是令人深省的一步。但當你逐月或逐年登錄之後，真正的學習與樂趣才開始。


    ◎ 補注：A3 約 29.7 公分 × 42 公分，A1 約 59.4 公分 × 84.1 公分。


    你的圖表記載每個月的收支動態，並隨著時間向前推移，生動地描繪你朝著目標的進程，這張圖表會激勵你一直往前走，不斷提醒你曾經對自己的承諾。


    # 一 開始的悸動與揮霍的循環


    第一個月開始追蹤數字時，你可能會發現自己跟很多美國人一樣，收入比支出少了很多，也就是說，你花的錢比賺進來的還多（這也許就是所謂的美國模式吧）。親眼目睹現實，也許會有點震驚，好消息是你願意從此改變，你是否曾經在一堆銀行資料及信用卡帳單前發響，下個月不會再超支了？你是否許過新年願望，立志要節省開支、外食？這些都是在頭熱時，你曾經立下的心願。這些舉動其實都是過度節省開支，會讓你的家庭生活陷入約束感，像是每個過在過配合的日子，生活中所需的豆子、米及燕麥，都有限額。


    這些人把焦點放在縮減每日開支，想要在短短一個月內把消費減半，令人驚訝的是，很多人真的做到了；第二個月，支出金額可能也有相當程度的減幅，但這樣的縮衣節食，其實沒有辦法長久維持。第三個月，很多人的支出就大幅上升，往往把第二個月省下的錢，也帶花用完了。應該怎麼辦？若照以前的做法，可能就再一次動心忍性的節約吧，或者乾脆直接放棄。但真的別放棄，試試看別的方法。


    還記得第一章中的伊蘭，她是一個電腦工程師，不喜歡她的工作，但又不知道如何擺脫。她開始依傳統方法記錄開支，結果跟很多懷抱美國夢的人一樣，看到數字時十分驚訝，像花錢買了玩具，事後卻懊悔。「我看到數字，真的嚇了一大跳，我根本想不到，我花用的竟然比賺的多，但現實擺在眼前，一個月賺進四千四百美元，卻花掉了四千七百七十美元。」她決心接受挑戰改變現狀，無論如何，都要降低自己的支出。中午時，她也不跟同事出外吃中餐，也沒有買便宜外食，她自己從家裡帶午餐到公司。一個月下來，她沒有買一件新衣，也沒有跟別人出外吃喝，終於在第二個月時，發現自己花用的比賺的少了。她認為自己一定做得到，「我受到了很大的鼓舞！」伊蘭說，接下來一個月她放鬆了，故態復萌回到以前的消費習慣，前一個月省下的錢，全都吐了回去。「我的帳本看起来很糟」，她後來了解真正要改變的不是記帳本，而是她自己。伊蘭揚棄傳統節衣縮食的方法，改採我們推薦的計畫，她說依計畫行事之後，不僅覺得成功，而且連自尊心都變強了。她相信自己做得到，不滿的情緒轉換成把工作做好的動力，不但自己振奮，連主管都感受到她的改變。「在四個月內，我還清了債務，我的每月花費降到了一六四○美元；我其實沒有刻意努力，但購物及零用，從一個月三五九美元，降到了二○三美元，可能是因為我在工作時感覺到快樂，所以花錢時購買自己的需求也降低了，外食的費用從原本的二三二美元降低到七十七美元，因為只有在真正需要時，才會到外面吃飯。我搬到了離公司比較近的地方，房租比較少，違帶油錢也降低六成。醫療花費也降低了，原因也是因為不關心的時間較少，身體變得比較健康，享受工作之餘，疾病好像也遠離。這些節省下來的費用，我一點都不覺得被剝奪，也不會覺得少花錢是件困難的事。老實說，我一點也不覺得自己有什麼不一樣的事，這些都有一點慢慢地發生！」


    在這之前，伊蘭花了很多錢參加研討會，試圖改變自己的情況。但多年來，改變從來就沒有辦法持續，這次到底是做了什麼事，產生了不同的結果？她說，最重要的關鍵，就是逐月收支圖。一開始時，把日常生活的然大小事記錄收支是一個挑戰，但收支表其實詳實地顯示出她的消費習性，生動地陳述為何每個月賺得錢都不夠花用（見圖表5-1）。收支表提醒我們與金錢關係轉換的過程，但沒有辦法一蹴可幾，要花時間逐步進行，需要堅定信仰及耐心。在改變的過程中，沒耐心、否定及貪心，是很難避免的，需要多一點時間，我們才能反思自己的人生，了解自己未來應該要在哪個方向前進。


    看完這本書，可能只需要花幾天的時間，但重建與金錢的關係，就不是一天兩天能達到。仔細想象看到收支表的結果之後，自己為何會有吃驚的反應，不要對結果太過氣憤。你會越來越清楚，自己走到現在這樣的情況，到底是因為什麼樣的態度及想法，在執行過程中，兩個重要的關鍵是：


    1. 開始。


    2. 繼續。


    古謊常說：千里之行，始於足下。但我們卻很少談及，如果要到達目的地，除了第一步之外，還要走千萬步。在計畫推進的過程中，久而久之你就會感覺到一股神奇的力量：不知不覺中，你的支出金額會逐漸下降。到底是怎麼做到的？


    # 怎麼樣才做得到


    現在看看可以讓你省錢的幾個重要關鍵，還記得我們在步驟四提到的三個重要問題？你應該已經發現，這些問題對金錢的察覺影響不小，同樣地，對你的收支表也會產生一樣影響。


    # 自然而然，讓支出降低


    - 問題一：我在使用生命力力的同時，生命是否因此得到等量的充實、滿足？


    每個月在登記收支時，記得都要自問，這樣會增加你在消費選擇時的自覺，支出也會因此逐漸減低。每個月都看到自己的花費在收支圖上向下降，應該是很愉快的事。就像在第四章談到的，一旦對自己的支出有更清楚的察覺及體悟，會帶來快樂，這樣也不不會觸動內心裡「求生機制」，事實上，你等於是在重新讓自己進化。每一個「—」號，都會觸動求生機制，但也在快樂多靠近些，漸漸遠離痛苦。然而，一旦你越來越適應這樣的模式，求生機制就會變成你的盟友，會讓你從事真正帶來快樂的消費，而不是出於習慣成自然的無意識消費，無意識的消費既沒辦法帶來滿足，也不會有快樂。記得葛利葛斯胸針嗎？你很快就會知道人生中有哪些葛利葛斯胸針了，每一次對這種盲目無意識消費的覺醒，都會讓你在掙節消費時進步顯著，對於自己生命活力的花費也會更有效率。讓我們看看是怎樣發生的。以往，在你試著改變消費習慣或是增加花錢的滿足感時，其實缺乏對自己的消費模式全面及正確的認識。你不僅其實類似葛利葛斯胸針這種盲目的消費，根本沒辦法帶來滿足感，但你卻一直去不掉它。


    或許有時候你真的想要丟掉它，也知道它是你邁向節省之道的阻礙，但你又不知不覺走到賣葛利葛斯胸針的櫃台，「再一次，就這一次！」你現在從上方看到自己的金錢迷宮，知道這是死胡同，你看到了光線，「於是告訴自己說：我不會因此得到滿足，這樣子花錢，只會浪費我的生命活力」。


    當你大夢初醒時，你會清楚地告訴自己：「等一下，你這個白痴，把眼睛張亮點！」「我書櫃中有一半的書都沒看過，已經近十年沒有拿過筆了，夠了，不要再買了！」這個剌那的覺醒，對你的人生將有重大改變。現在，你已經把你的消費及是否取得滿足感的關係連結在一起，無意識的消費，應該不容易再一直糾纏你。你已經找到自己，既不用繼續自我挑戰，也不必再靠花錢得到滿足及幸福。相反地，你已經學會如何用生命活力，也了解如何衡量生命活力的價值，改變方向，一點也不難！


    墨西哥裔的艾薇從小就在困苦的環境中長大，一直沒有足夠的錢用。但她和家人並沒有抱怨貧窮帶來的苦難，因為篤信天主教，父親常常說：「我們是受天主保佑的一群人，因為只有困苦的人，才能上天堂。」然而，窮困及挫折在她的人生中一直揮之不去，她根本不需要看管錢財，因為從來沒有錢買多餘的東西。艾薇的無意識消費，只有買衣服這件事。


    在清理自己的資產時，因為累積的資產真的不多，艾薇一路以來都很順暢，但一盤點到衣櫃，問題就出現了。

    塞滿衣櫃的衣服，到底從哪裡來的？當然，這些都是從不同的服飾店裡買來的，大部分還是從百貨公司血拼得來的戰利品，但她不是沒錢嗎？原來，艾薇認為擺脫貧困最好的方法，就是隨時穿得光鮮亮麗。她一直告訴自己，越多人稱讚我穿得漂亮，我就離貧窮越遠。當然，上班族穿著得體是很重要的事情，但艾薇每個月總會買上幾套全新的衣服；連舊衣與新衣混搭，都會讓她覺得很過。

    在練習記錄每月收支之後，她很快發現了每月在百貨公司敗金，真的很難帶來滿足感，把生命活力花在這個上面，也非常不值。沒有經歷太多掙扎、自我否定或是被剝奪感，她就改正了這個習慣。不再不停買新衣，令她吃驚的是，她得到的讚美，一點也沒有因為不穿新衣而減少。

    海爾自己就是理財規畫人員，但他在練習財務獨立時，發現自己的無意識消費非常嚴重，他稱之為超大型葛利葛斯胸針，或大型消費黑洞。他需要的不只是一副看清自己財務的新眼鏡，而是一個大型的外科手術。


    # 圖表 5-1 伊蘭的逐月支出圖表


    ![](img/9613d65bc6187206ad77a54ffefc649f_179_0.png)


    第一年一月到第五年八月

    '
  mdcn: '

    怎樣的狀態，每月不斷斷地記帳，久而久之你會發現，每當你想要買一件東西，收支表就會跑進你的腦中。大體來說，「豐足」會有四個成分，四種普遍的特性：


    1. 可靠（Accountability）。你能預判，生活中會有多少錢流進及流出，這是財務自主很基本的第一步，假如你不知道金錢的去向及來源，永遠不可能得到「充足」的感覺。


    2. 滿足感的內心量尺。前面曾提過，如果你依照別人的標準及想法衡量自己的人生，那麼永遠也沒辦法達到「豐足」的狀況，就像在一個向上的手扶梯上登高一樣，別人的想法難料，他人所有的東西也變化無常，自我察覺是重要的關鍵。


    3. 人生的目標。人生目標比表面上的欲望或想念更崇高，如果每一個欲望及想望，都想要獲得滿足，那麼你永遠不會感覺到「充足」。什麼是比得到想要的東西更崇高的目標？其實，「得到」的反面概念「付出」，往住才是富足或幸福感的神秘來源，把我們的物質需求向上提升到為別人服務，為他人貢獻自己的才能，往往帶來最大的幸福感。


    4. 責任。讓生活的意義不再只是為了成就「我、自己」，如果你一直都為了自己而活，那麼也很難達到「豐足」的状况。責任感，對你絕對有正面的意義，讓你超脫「越多越好」的枷鎖，對別人也有益處。如果把
    responsibility 這個英文文字拆開來看，可以發現，責任這個字，是由「回應」（response）及「能力」（ability）這兩個字拼起來的。你因為有能力，才能回應別人的需求。當然，責任的第一步是為自己負責，停止自散，誠實面對，讓自己的生活、工作與人生的價值平行發展，定義屬於自己的「豐足」。就像愛因斯坦在一九五○年說的，最終你會生活在一個更寬廣的範圍裡：「人是『宇宙』整體的一部分，存在於時間、空間中，人以為自己有想法、能感覺及透過經驗了解世事，就能獨立於他人存在。這其實是一種意識的錯覺，這種錯覺猶如一種牢籠，使我們受困於個人的欲望之中，只對最親近的人懷有感情。我們的任務應該是將自己從這座牢籠中解放，透過擴大同情心，在美麗的大自然中，擁抱所有的生命，以及萬事萬物。


    二十世紀美國哲學家、建築師及發明家富勒 (Buckminster Fuller)，也有同樣的想法。有人稱他為提倡地球永續的聖人，但在他二十幾歲時，曾因為兒子的去世及生意失敗，感覺人生無望，差點結束自己的生命。在人生極度痛苦時，他突然頓悟了：他的觸發及人生，並不屬於自己，而屬於全世界。富勒終其一生都在為人類尋找更好的生活方法，他的人生使命變成了：「讓這個世界，能用百分之百的人道精神運作，透過同時、一致的協同合作，在不傷害生態及不剝削他人利益的情況下，用最短的時間找到永續發展的途徑。」最後，數以萬計的人加入他的行列，把世界變成適合每一個人生活的地方，沒有一個人被遺忘或遺棄。


    想像你心目中「豐足」的情境。可以像富勒深信的，每個人都能有足夠的食物、能量、資源；或者像愛因斯坦描繪的，人類擴大同理心，讓我們能擁抱地球上所有的生命。充足的狀態，沒有一定的標準，你不用刻意去符合誰的期待，但必須盡可能讓自己心中的「豐足」境界得以完成。對每個人來說，這都是遠大的目標及理想，透過簡單的步驟及持續的付出，投入你的生命活力，盡力達到心中想像的「豐足」境界。如果你認同這樣的想法，現在拿起筆寫第四個問題。


    如果每個人都能找到他所愛的東西、滿足他的需求，在充滿同理的世界裡，你的每月收支表category：每個分類，會變成什麼樣的狀況？


    ① 備註：巴克敏斯特·富勒，美國哲學家、建築師及發明家。富勒發表超過三十本書，發明和普及不少詞彙，他有许多發明，主要是建築設計，最著名的是球型屋頂。

    ② 參見：Medard Gabel, “Buckminster Fuller and the Game of the World.” In Thomas T.
    K. Zung (ed.), *Buckminster Fuller: Anthology for the New Millennium* (pp. 122–128).
    New York: St. Martin’s Griffin, 2002.


    你可以重新修飾一下這個問句，但要把它「如果每個人都這樣做了？」「這個假設放在問句內，就像提出滿足及對集人生目標這類的問題，可以幫助你找到人生方向一樣，這個問句，也能協助你及所愛之人的生活更美好，同時把關照的觸角進一步擴大到愛因斯坦所說的『更廣泛的範圍』。我們不可能認識世界上的每一個人，但你可以想像他們在「對其他人做你自己認為是對的事」。


    看看你收支帳的數字，問自己：「如果……每個人都在餐廳外食、買舊衣服、在自己的後院種水果、計畫自己的假期旅遊，或是只為了每日運動就買一輛車……記得我們的約定：不要覺得丟臉，也不要自責或責怪他人，只要記得擴大你的同理心。


    有些人會認為環保是重要的議題：「做這件事對地球／氣候／環境，真的是好事嗎？」「碰到這類道德層面的問題，基督徒通常會自問：『如果耶穌在的話，會怎麼做？』對於沒有宗教信仰的人，可能會自問：「科學角度如何看待這個問題？"


    有些人會從思考中找答案，有些人則會走向大自然，這第四個問題，會讓你跟金錢的關係產生轉變嗎？不，不會。但如果你照計畫檢視自己每月收支帳，前面的三個問題會變得很簡單容易，變成你人生的一部分。接下來，你可能會開始想，如果大家都做到了，那接下來呢？如果你到達了這個階段，我跟喬早在一九九〇年提筆寫這本書的目的，也算是達到了。


    ## 步驟四的重點摘要


    1. 在記錄你的每月收支表時，同時自問問題一：「在使用生命力活力的同時，我有得到同等充實、滿足嗎？」如果有，請在欄目上加注，根據情況不同，註記+（或一個向上的箭頭）、－（或一個向下的箭頭）或○。


    2. 在記錄你的每月收支表時，同時自問問題二：「使用生命活力時，有沒有跟你自己的價值及人生目的一致？」如果有，請在欄目上加註，根據情況不同，註記＋（或一個向上的箭頭）、－（或一個向下的箭頭）或○。


    3. 在記錄你的每月收支表時，同時自問問題三：如果你不為錢工作，你的消費型態會做怎樣的改變？


    4. 再次檢視一下你的收支項目及註記的記號。


    # 談一談錢。關於錢的幾個問題


    你的夢想、價值、回憶及人生故事，都是開啟與他人對話的話題。如果從別人那裡，聽到令你有一「有為者亦若是」的衝動的夢想或目標，別客氣，把它偷過來自己用！我們可以大家一起打造真正美好的生活藍圖，用簡介裡談到的建議，透過這個計畫，讓金錢說話。借用本結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。記得如果在反省時，都能不忘在最後加上一句「為什麼？」，這樣會讓你有更深層的思考；如果都不記不問一句：「社會如何看待我的答案？」，則會讓思慮反面更為廣泛。不論如何，這些問題，都沒有標準答案。


    - 你長大後的志願是什麼？現在達到了嗎？

    - 你的「遺願清單」( Bucket List)⊕中有哪些臨終前想完成的事？

    - 你的內心及靈魂深處的召喚是什麼？

    - 講講你最愉快的時刻？是什麼讓你感到快樂？

    - 有哪些意想不到的事發生之後，會讓你的夢想成真？

    - 如果可以，你想要用金錢幫小孩及所愛的人買什麼東西？


    ⊕ 編註：指一張一定要（或者最好）在死前全部完成的清單。


    # 第 5 章


    # 全部攤在陽光下吧！


    ### 步驟五：讓生命活力具象化


    在這個階段裡，要把你的生命活力全部攤開來。把它們畫成圖表，會讓你有更清晰的觀念，不論是現在、以前或是未來，讓你对自己的財務狀況有更完整的輪廓。這樣，就能改造你與金錢（生命活力）的關係。


    透過第二個月的收支紀錄，你对自己的花費及有多少錢流進流出，應該已經有一個比較完整的概念。


    面對自己正步向債台高築的死胡同，練習剛開始的時候，可能會感覺很不舒服想放棄，你可能會對自己說，「這個小練習還不錯啦，但我已經知道我想到的東西了！」但如果你再堅持一個月，應該會發現支出將大幅減少。覺醒是一條長路，小小逃避一下，其實沒有人看得見，要秉持著「別羞愧，勿責難」的精神，繼續走下去。第三個月改變會更顯著，你會省更多錢。但你可能會開始鬆懈，因為過去幾個月你都照表操課地做到了，不論要給自己一點小鼓勵，或是想暫時忽視眼前殘酷的事實，你都要拿出意志力來走完這條路。


    要如何激勵自己一直向前走？要改變自己的行為模式，通常會有三個關鍵：


    1. 把它變成習慣，不是有一搭沒一搭地做。你必須有系統地作爲，直到變成一般生活的日常，就像刷牙一樣。


    2. 請別人幫忙。告訴你的朋友或公開發示你的決心，一定要把花費寫下來，並在面註記往及往下的箭頭，每個月定期跟一個信得過的朋友碰一次面，報告你的進度並聊心得。或者每天用電話、簡訊或聊天軟體給朋友，讓他知道你的狀況。更進一步，你可以把你記帳的密碼給這位值得信賴的朋友，讓他監督你，你也可以幫他進行帳務監控。相互幫忙，愛管閒事，有時候也會讓事情更有效率。


    3. 圖表。把每天該做的事，列一張檢查表，就像減肥時會在體重計上記錄體重變化一樣，管理體重這樣做，管理金錢也一樣，把過程記錄下來，真的能讓欲望不致潰堤。


    步驟五就是希望你能把記錄的收支狀況，做成一張圖，你自己決定怎麼做可以讓事情比較順利，準確牢靠。我們會提供一些建議及方法，讓你加快這個過程，平穩地向財務健全的目標前進。


    出發了，繫好你的安全帶。


    # 製作自己的逐月收支圖（WALL CHART）


    首先，你必須要有一張大圖，空間足夠讓你記載五年的資料，在設計時必須讓圖表容易操作，維持上也不會花太大力氣。最詳細的資訊，其實你都已經放在每月收支表上了，就算沒有電腦或
    $eg$ 也可以進行，最重要的事就是起而行。你可能正在使用 $eg$ ，線上服務或是記帳軟體協助管理金錢，這些工具可能可以在上面直接製作圖表，但我们仍希望你能夠親手製作。至於如何運用資訊管理軟體，步驟五的第二部分會介紹。


    找一張大型的圖表紙（$18 \times 12$ 吋或 $24 \times 36$ 吋，約 $A3$ 或 $A1$ 大小，每一吋有十個方格的圖表紙），在一般文具行或書店應該都買得到。如果真的沒有也不用太擔心，你可以在一張大白紙上畫方格，左方的縱軸代表的是金錢，金額由低至至高：你可以畫兩條線，一條是收入，一條是支出，記得上方多留一點空間，因為依照過去輔導的經驗，你的收入可能會增加甚至加倍。不只一位朋友，在執行計畫之後，收入增加到還得在上方多加一張紙，他們以前從來不敢這樣奢望。


    下方的橫軸代表時間，我們建議保留五到十年的時間，這樣才可以看到更大範圍的趨勢——更可以看著你在真正的財務獨立前進的足跡。如果你覺得用資訊工具輔助比較好，$eg$
    或其他有電子表格類的軟體是不錯的選擇。完成這些步驟之後，你會發現自己看到了一個新的世界，但資訊工具帶來的發現，絕對沒有比你一筆一筆畫在紙本上來得震撼，成就感也很難與手做比較。


    每個月月底，都記得在紙上標註你這個月的收入及支出，最好用不同的顏色，區分收入及支出，之後再用線把每個月的點連起來。第一個月，當你畫上第一個記號時，你已經開啟建立與金錢新關係的第一步，這是令人深省的一步。但當你逐月或逐年登錄之後，真正的學習與樂趣才開始。


    ◎ 補注：A3 約 29.7 公分 × 42 公分，A1 約 59.4 公分 × 84.1 公分。


    你的圖表記載每個月的收支動態，並隨著時間向前推移，生動地描繪你朝著目標的進程，這張圖表會激勵你一直往前走，不斷提醒你曾經對自己的承諾。


    # 一 開始的悸動與揮霍的循環


    第一個月開始追蹤數字時，你可能會發現自己跟很多美國人一樣，收入比支出少了很多，也就是說，你花的錢比賺進來的還多（這也許就是所謂的美國模式吧）。親眼目睹現實，也許會有點震驚，好消息是你願意從此改變，你是否曾經在一堆銀行資料及信用卡帳單前發響，下個月不會再超支了？你是否許過新年願望，立志要節省開支、外食？這些都是在頭熱時，你曾經立下的心願。這些舉動其實都是過度節省開支，會讓你的家庭生活陷入約束感，像是每個過在過配合的日子，生活中所需的豆子、米及燕麥，都有限額。


    這些人把焦點放在縮減每日開支，想要在短短一個月內把消費減半，令人驚訝的是，很多人真的做到了；第二個月，支出金額可能也有相當程度的減幅，但這樣的縮衣節食，其實沒有辦法長久維持。第三個月，很多人的支出就大幅上升，往往把第二個月省下的錢，也帶花用完了。應該怎麼辦？若照以前的做法，可能就再一次動心忍性的節約吧，或者乾脆直接放棄。但真的別放棄，試試看別的方法。


    還記得第一章中的伊蘭，她是一個電腦工程師，不喜歡她的工作，但又不知道如何擺脫。她開始依傳統方法記錄開支，結果跟很多懷抱美國夢的人一樣，看到數字時十分驚訝，像花錢買了玩具，事後卻懊悔。「我看到數字，真的嚇了一大跳，我根本想不到，我花用的竟然比賺的多，但現實擺在眼前，一個月賺進四千四百美元，卻花掉了四千七百七十美元。」她決心接受挑戰改變現狀，無論如何，都要降低自己的支出。中午時，她也不跟同事出外吃中餐，也沒有買便宜外食，她自己從家裡帶午餐到公司。一個月下來，她沒有買一件新衣，也沒有跟別人出外吃喝，終於在第二個月時，發現自己花用的比賺的少了。她認為自己一定做得到，「我受到了很大的鼓舞！」伊蘭說，接下來一個月她放鬆了，故態復萌回到以前的消費習慣，前一個月省下的錢，全都吐了回去。「我的帳本看起来很糟」，她後來了解真正要改變的不是記帳本，而是她自己。伊蘭揚棄傳統節衣縮食的方法，改採我們推薦的計畫，她說依計畫行事之後，不僅覺得成功，而且連自尊心都變強了。她相信自己做得到，不滿的情緒轉換成把工作做好的動力，不但自己振奮，連主管都感受到她的改變。「在四個月內，我還清了債務，我的每月花費降到了一六四○美元；我其實沒有刻意努力，但購物及零用，從一個月三五九美元，降到了二○三美元，可能是因為我在工作時感覺到快樂，所以花錢時購買自己的需求也降低了，外食的費用從原本的二三二美元降低到七十七美元，因為只有在真正需要時，才會到外面吃飯。我搬到了離公司比較近的地方，房租比較少，違帶油錢也降低六成。醫療花費也降低了，原因也是因為不關心的時間較少，身體變得比較健康，享受工作之餘，疾病好像也遠離。這些節省下來的費用，我一點都不覺得被剝奪，也不會覺得少花錢是件困難的事。老實說，我一點也不覺得自己有什麼不一樣的事，這些都有一點慢慢地發生！」


    在這之前，伊蘭花了很多錢參加研討會，試圖改變自己的情況。但多年來，改變從來就沒有辦法持續，這次到底是做了什麼事，產生了不同的結果？她說，最重要的關鍵，就是逐月收支圖。一開始時，把日常生活的然大小事記錄收支是一個挑戰，但收支表其實詳實地顯示出她的消費習性，生動地陳述為何每個月賺得錢都不夠花用（見圖表5-1）。收支表提醒我們與金錢關係轉換的過程，但沒有辦法一蹴可幾，要花時間逐步進行，需要堅定信仰及耐心。在改變的過程中，沒耐心、否定及貪心，是很難避免的，需要多一點時間，我們才能反思自己的人生，了解自己未來應該要在哪個方向前進。


    看完這本書，可能只需要花幾天的時間，但重建與金錢的關係，就不是一天兩天能達到。仔細想象看到收支表的結果之後，自己為何會有吃驚的反應，不要對結果太過氣憤。你會越來越清楚，自己走到現在這樣的情況，到底是因為什麼樣的態度及想法，在執行過程中，兩個重要的關鍵是：


    1. 開始。


    2. 繼續。


    古謊常說：千里之行，始於足下。但我們卻很少談及，如果要到達目的地，除了第一步之外，還要走千萬步。在計畫推進的過程中，久而久之你就會感覺到一股神奇的力量：不知不覺中，你的支出金額會逐漸下降。到底是怎麼做到的？


    # 怎麼樣才做得到


    現在看看可以讓你省錢的幾個重要關鍵，還記得我們在步驟四提到的三個重要問題？你應該已經發現，這些問題對金錢的察覺影響不小，同樣地，對你的收支表也會產生一樣影響。


    # 自然而然，讓支出降低


    - 問題一：我在使用生命力力的同時，生命是否因此得到等量的充實、滿足？


    每個月在登記收支時，記得都要自問，這樣會增加你在消費選擇時的自覺，支出也會因此逐漸減低。每個月都看到自己的花費在收支圖上向下降，應該是很愉快的事。就像在第四章談到的，一旦對自己的支出有更清楚的察覺及體悟，會帶來快樂，這樣也不不會觸動內心裡「求生機制」，事實上，你等於是在重新讓自己進化。每一個「—」號，都會觸動求生機制，但也在快樂多靠近些，漸漸遠離痛苦。然而，一旦你越來越適應這樣的模式，求生機制就會變成你的盟友，會讓你從事真正帶來快樂的消費，而不是出於習慣成自然的無意識消費，無意識的消費既沒辦法帶來滿足，也不會有快樂。記得葛利葛斯胸針嗎？你很快就會知道人生中有哪些葛利葛斯胸針了，每一次對這種盲目無意識消費的覺醒，都會讓你在掙節消費時進步顯著，對於自己生命活力的花費也會更有效率。讓我們看看是怎樣發生的。以往，在你試著改變消費習慣或是增加花錢的滿足感時，其實缺乏對自己的消費模式全面及正確的認識。你不僅其實類似葛利葛斯胸針這種盲目的消費，根本沒辦法帶來滿足感，但你卻一直去不掉它。


    或許有時候你真的想要丟掉它，也知道它是你邁向節省之道的阻礙，但你又不知不覺走到賣葛利葛斯胸針的櫃台，「再一次，就這一次！」你現在從上方看到自己的金錢迷宮，知道這是死胡同，你看到了光線，「於是告訴自己說：我不會因此得到滿足，這樣子花錢，只會浪費我的生命活力」。


    當你大夢初醒時，你會清楚地告訴自己：「等一下，你這個白痴，把眼睛張亮點！」「我書櫃中有一半的書都沒看過，已經近十年沒有拿過筆了，夠了，不要再買了！」這個剌那的覺醒，對你的人生將有重大改變。現在，你已經把你的消費及是否取得滿足感的關係連結在一起，無意識的消費，應該不容易再一直糾纏你。你已經找到自己，既不用繼續自我挑戰，也不必再靠花錢得到滿足及幸福。相反地，你已經學會如何用生命活力，也了解如何衡量生命活力的價值，改變方向，一點也不難！


    墨西哥裔的艾薇從小就在困苦的環境中長大，一直沒有足夠的錢用。但她和家人並沒有抱怨貧窮帶來的苦難，因為篤信天主教，父親常常說：「我們是受天主保佑的一群人，因為只有困苦的人，才能上天堂。」然而，窮困及挫折在她的人生中一直揮之不去，她根本不需要看管錢財，因為從來沒有錢買多餘的東西。艾薇的無意識消費，只有買衣服這件事。


    在清理自己的資產時，因為累積的資產真的不多，艾薇一路以來都很順暢，但一盤點到衣櫃，問題就出現了。

    塞滿衣櫃的衣服，到底從哪裡來的？當然，這些都是從不同的服飾店裡買來的，大部分還是從百貨公司血拼得來的戰利品，但她不是沒錢嗎？原來，艾薇認為擺脫貧困最好的方法，就是隨時穿得光鮮亮麗。她一直告訴自己，越多人稱讚我穿得漂亮，我就離貧窮越遠。當然，上班族穿著得體是很重要的事情，但艾薇每個月總會買上幾套全新的衣服；連舊衣與新衣混搭，都會讓她覺得很過。

    在練習記錄每月收支之後，她很快發現了每月在百貨公司敗金，真的很難帶來滿足感，把生命活力花在這個上面，也非常不值。沒有經歷太多掙扎、自我否定或是被剝奪感，她就改正了這個習慣。不再不停買新衣，令她吃驚的是，她得到的讚美，一點也沒有因為不穿新衣而減少。

    海爾自己就是理財規畫人員，但他在練習財務獨立時，發現自己的無意識消費非常嚴重，他稱之為超大型葛利葛斯胸針，或大型消費黑洞。他需要的不只是一副看清自己財務的新眼鏡，而是一個大型的外科手術。


