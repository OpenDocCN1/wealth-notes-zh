    說。「能賣我三十美元嗎？」我問。他看了一下庫存狀況，回答：二十八美元。基於以前的討價還價經驗，賣家的出價不應該比買家高嗎？為何這次比較低？不過，我聽到這次價錢居然閉嘴，馬上付錢走人。我的經驗裡，討價還價最可能成功的店家是獨立經營的小店，店主可以自己決定價格，很快就能成交。因此，如果你看到大賣場的價格比較便宜，試試和一些獨立經營的小店殺價，他們通常會給你滿意的報價！


