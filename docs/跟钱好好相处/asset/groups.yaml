    # 投資客操作手法風險大


    請注意：有些投資客會買進舊屋翻修之後再賣出，從中賺取豐厚利潤，有一部分追求財務獨立的人士，在還未到達財務獨立之前，會用這種方法快速累積財富。不過我們不建議這樣做，因為這樣會佔據你太多時間、風險太大，而且坦白說，房價炒高了之後，一些付不起房租的房客，可能被迫搬離已經相當熟悉、且鄰里關係深厚的社區。另一種房地產投資方式，是投資自己的家園和土地，讓住宅成為財務獨立計畫的一部分，例如：在自己的家裡，建置再生能源或農育設施（花園、穀倉、雞舍和羊╱豬圈），時間一長也可創造收入。前面提到的部落格『簡約森林』先生及夫人，就建設了一個農莊。


    肯特和貝絲兩人都是高薪的專業人士。他們彼此互相吸引的原因，並不是想一同過著高檔豪奢的生活。肯特是一位博士，也是綠色能源顧問，他讀過非常多有關氣候變遷的資'
