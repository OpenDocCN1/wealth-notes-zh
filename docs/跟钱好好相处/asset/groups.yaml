    研究發現，富足到某個程度之後（以美國現在的標準約一年七萬五千美元），更多的金錢就無法買到更多的快樂了。在一九八〇年代，當我們推廣財務獨立計畫時，曾對參與的人進行了一項分析（因為那時還沒有筆記型電腦，我們都用紙和筆當工具），問到：要賺多少錢，你才會快樂？結果，不論參與者的薪資落在哪個水準，幾乎每個人的答案都是：比我在多五〇%；請他們對目前的幸福感打分數（一至五分），分析答案後發現，所得水準最高的群組與所得相對低的水準之間，沒有顯著差距。當課堂上的學生，知道坐在他前一排的同學，沒有因為所得比較高而感覺比較快樂時，現場鴉雀無聲。


    這顯示，與金錢維持一個良性、清楚及版權的⊙關係，是成功人生的重要關鍵，而非所擁有的「數字」（數字只是無中生有的 luckoffugle 及一個設定的目標）。當《賺錢好好相處》在一九九二年出版時，坊間並沒有討論金錢與幸福相關的書籍，現在，已有許多人透過我們的方法，達到財務獨立的境界。


    這些人有兩項強大的人格特質：


    +   1. 人生的目標比目前身處的有限客觀環境（包括工作）更远大。

    2. 願意改變，誠實面對一切，變成可靠的人，而且一直堅持下去。


    這些特質，代表追求財務獨立的內心力量已經被點燃。就我的觀察發現，他們的骨子裡，已經有三種深刻的價值（grace）一—節儉、簡單及自我滿足。這三種價值，千年來鑄就了人類文明、現代社會及各式宗教，且貫穿了不同政治背景、文化差異及地理位置的人們，當然也適用在


