    #### 舒壓及吐苦水


    每天下班之後，你是充滿熱情及活力，準備與家人及所愛之人，展開自己私領域的生活？還是筋疲力盡，拖著疲憊的身體，拿起啤酒或馬丁尼，縮在沙發上，看著眼前的電視或電腦螢幕，動都不想動，還不忘哀怨地說「今天真是夠了」？要花你一些時間才能釋放工作壓力。包括你大聲向他人抱怨工作及同事，這些因工作衍生的時間及花費也得列入。估算每週花在吐苦水及舒壓的時間，可能要花五小時，衍生的費用大約三十美元。


    > 五小時／週，三十美元／週


