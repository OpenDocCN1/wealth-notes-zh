    # 談一談錢

    關於錢的幾個問題


    看看別人怎麼做，對自己會很有幫助，很多有趣的問題就會因此而產生。依照我們在結語中的方法及建議，你會發現「錢真的會說話」。以下的幾個問題，大家可以天天用來自問，若能與另一半、朋友或團體討論當然更好。借用本章結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。記得如果在反省時，都能不忘在最後多加上「為什麼？」，這樣會讓你有更深層的思考；如果都能不忘在最後多問一句：「社會如何看待我的答案？」則會讓思考層面更為廣泛。不論如何，這些問題，都沒有標準答案。


    +   ◇ 如何保持對金錢的自覺？


    ◇ 你如何確認自己做到了自覺這件事？


