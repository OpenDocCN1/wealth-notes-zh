    +   ² 編註：美國前那斯達克主席馬多夫，開了自己的避險基金——馬多夫避險基金（Madoff）²，作為投資騙局的掛牌公司。因為設計一種龐氏騙局（層壓式投資騙局），令投資人損失達五百億美元，其中包括眾多大型金融機構。'
