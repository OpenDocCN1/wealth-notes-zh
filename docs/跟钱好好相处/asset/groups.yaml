    光客招手，募集他們帶不走的醫藥用品。


    譚雅那時已經沒有背負任何債務了，她知道自己下一步應該怎麼走。她了解肯亞人民常常因為牙齦腫大而死亡之後，索性辭了工作，把房子及車子出租，飛到肯亞協助當地牙醫診所。因為沒有債務，出租房子及車子的所得，就夠她在肯亞鄉下生活，譚雅終於取得財務獨立了。因為沒有債務，她得以追隨自己的心願。


    脫離債務，就是一種財務獨立的方式。因為沒有債務，你可以選擇自己的方式生活，不管外在經濟環境如何，你都可以很驕傲、自在及尊嚴地說：「我沒有欠任何人任何東西」。


    一旦脫離債務，人生選項就變多了。當每一分錢、每一張支票都是你自己擁有的時候，你會變得很強大，就像譚雅一樣，可以到遠方完成心願，或是追求夢想。當然，你可以開始享受轉變之後的人生，隨著你的花費越來越少，在你的收支圖上，所得及支出的距離會越拉越大。這個距離，有一個美麗的名字，叫『儲蓄』~（見圖表5-2），儲蓄也是另一種財務獨立的表現。


    # 當一個儲蓄達人


    你現在存了多少錢？還有負債嗎？還是正在還清債務中？或是把你賺的錢全部花光？你的儲蓄率是在財務獨立邁進很重要的指標，關於要存多少錢，有一個概念可以參考：如果你花掉所有的月薪，那你永遠無法退休；如果你的收入一毛都沒花掉，那恭喜你，你已經財務獨立了，再也不需要為賺錢而工作。


    在這中間的大多數人呢？就像我之前提到的，參與計畫的人，大部分花費會少兩成左右，'
