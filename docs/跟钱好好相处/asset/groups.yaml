    - [x] 10. 打工的錢（小費、照顧小孩、跑腿）


    ### 你能拿出什麼東西來？


    這麼多年來，你辛苦的工作應該已經攢了一些錢（就是你正在計算的這些），這些就算是你的淨資產（net worth）。這可能是你第一次仔仔細細算清楚自己的淨資產（你的所有資產減去所有負債）。你要有心理準備，可能會發現自己債台高築。在這之前，你根本不知道底情況糟到什麼樣的地步，現在是勇敢面對事實的時候了。另一方面，你可能會很高興地發現，其實自己在財務獨立的目标上已經佔得先機。做完了這個步驟，很多人會有新發現。


    在這個過程中有一個隱形的挑戰：這樣做的目的，到底所為何來？大聲說，換另外一種口氣說！這樣的口吻聽起來好像有點批判，甚至目中無人，但我們對於追求財務獨立的決心，應該遠還戰勝怯懦。這些賺進來的錢，到底所為何來？把你的淨資產一筆一筆列出，不過是走一遍你以前活過的物質生活，及把你所有的（資產）和欠人家的（負債），整理出來仔細檢視一番。


    ## 流動資產


    現金及任何其它容易轉換為現金的資產，都屬於流動資產（liquid assets）項目。包括以下：


    - 身邊的現金（包括小豬揹揹、衣服口袋的零錢、放在衣櫥裡的急用金）

    - 銀行存款（別忘了以前已經用完的存摺，及因為貴圖贈品隨意開設的帳戶，那裡面可能還有幾千塊）

    - 支票簿

    - 定存單或是儲蓄存款帳戶

    - 政府公債

    - 股票；記得用最新成交價計算現值

    - 債券；也記得以現價計算價值

    - 共同基金；一樣用現值登錄

    - 貨幣基金；一樣用現值登錄

    - 為買股票開的銀行帳戶裡的存款

    - 壽險保單的現值


    ## 固定資產


    在計算時，最好從最顯眼的項目著手：你的主要資產，例如：房子、車子，盡量以現值計算。詢問住家附近的房仲，或是上網調查周邊房價，評估出房子現在值多少錢。到可靠的中古車或者是網站上，找一下與你的汽車同年同款的手車，現在的價格大約多少。


    好好把家裡上下都翻一遍，把每項價值可能超過一美元的東西找出來，不要主觀地認為「這些都不值錢啦！」要有毅力，要像收藏家或修理專家一樣執著，你會發現車庫裡充滿了真正的寶藏。


    別嫌麻煩！要知道如果你現在不做，等你去世之後，你心愛的人就得捲起袖子做這些事。如果儲藏室的東西真的從地板堆到天花板，都是你過去血拼的成果，也許你可以最後再清點雜物，別因為覺得壓力太大而中斷計畫。


    每個房間、每個儲物空間都要翻，看看房間內裝潢還有地毯底下。別忘了，你在幾年前曾經買的核桃木書架、原住民的手工藝品，以及過去請人幫你組裝的電腦。徹底正視你的混亂，一定要理性！不必每一把刀、湯匙或叉子全都巨細靡遺清單，但若碰到像昂貴的玫瑰木雕刻及桃花心木盒子，務必把這個項目單獨列出來。


    如果櫃子裡有兩組原封未動的盤子，也別忘記放入清單。你擁有的所有物品，都必須佔一個概略值，而所謂的現值，指的是如果你把它們放在網上，或是在自家後院舉行跳蚤市場大拍賣時可以換得的價錢。你可以到拍賣網站看看，或是查查報紙上的分類廣告，大概就能估出不同物品的價值。務必把所有家中有價值的東西都拿來估一下現值。不要忽略任何一樣東西，你眼中認為的垃圾，可能是別人眼中的珍寶。不要因為你看不出它的價值，就棄如敝屣。也別忘了別人欠你的錢，特別是那些還有可能要回來的債權，還有租房、辦電話門號或是申請水電瓦斯時，已經從口袋拿出的押金。


    任何能夠變現的物品，都要列出來。你就是自己資產的鑑價師，享受這過程。如果你不想要賣掉這些東西，也不必勉強，不要讓心理障礙阻止你清點你的資產。真的！別受情緒干擾。


    過程中可能會有些沮喪或想到傷心往事，繼續做下去，讓這個工具協助你，計算出你所有東西的價值，就算是親人禮物也不要漏失。如果發現已經搬走的室友留下的液晶電視，也別漏算。就算你因為衝動買的東西而感到不好意思，也不要停止，繼續把鞋櫃裡的二十幾雙鞋作好盤點；不要因為發現整套原封不動的健身器材而感到罪惡。你反而應該欣慰，因為你終於了解放在倉庫內的健身器材原有多少價值，不是讓你減輕多少公斤，而是拍賣後你能拿回多少錢。


    有些人在一兩天內，就做完了整個清點工作，但曾經有個女生花了整整三個月才清點完整個庫存。她翻箱倒櫃檢查每張照片，打開每個櫃子、抽屜及盒子，不只清點財務，更回想當初它們是怎樣進入她的人生。這個經驗讓她更感受現在所擁有的。因為人生中的不滿足，通常是我們只看到了什麼，卻沒有看到我們已經擁有什麼。只要念頭一轉，看事情的方法及角度就會改變。有些人認為，只要我們生活在基本條件之上，繁榮及貧窮的分界就在於你是否有一顆感恩的心。


    ## 負債


    這個項目包含你的所有負債，不管是金錢、貨品或服務的應付債務，還包含未償付的票據等。如果你已經將房產的市值算出來，也要把未繳稅的房貸一併計算；車貸也是。不要忘了列入銀行貸款或向朋友借的錢、信用卡債、學貸，以及未付清的醫療和牙科帳單。


    ## 淨資產


    把你的流動資產及固定資產加總起來，減去負債金額，簡單的說就是你的淨資產。這個數字就是真真切切你這一生迄今賺進來的錢，其他的都是回憶及幻想，這就是你的資產負債表。當然，這並沒有把非物質的資產算進來，例如：你的教育、人生歷練學來的技能、請別人喝酒換來的情誼、退稅單，或者是因為你加入了一「正確」的社團而帶進來的生意機會。這些無形資產雖然有價值，但因為沒有具體形象，所以沒有辦法計算出確實、客觀或量化的數字。練習之後得到的數字不管是悲是喜，你將面對許多真相，可能會很痛苦，但或許也是個解脫。不論你要面對如何的情況，你計算出來的淨值，並不等於你這個人的價值，千萬不要因此喪志。


    ## 為何需要資產負債表


    雖然這個練習一開始好像並不怎麼有趣，但做到了這個地步，過程應該頗有收穫。雖然實際的財務計畫及新的財務人生，仍不是非常具體，方向也並不清楚。就財務面來看，你現在比較像車子已經上路，但目的地是哪？茫無頭緒，只在浪費汽油、亂轉方向盤，哪裡也到不了。在人生的路上，你可能有很多美好的回憶，也得到無形的資產，但能轉換成現金的人生紀念品並不多。


    一旦你能有清楚的方向及支配財務的能力，你對前景將更有把握，生活將遠比以前更有效率。你現在對自己的財務狀況已經有了更清楚的認識，也能客觀地選擇是否該將固定資產轉換為現金，升高存款水位，或是用來減輕自己的債務。


    有一位學員計算完自己的資產之後，把一些生活中不必要的東西變現，並且開始存款及投資，馬上就有利息收入，在不變動生活方式及不犧牲舒適度的情況下，即刻讓自己往財務獨立又靠近了些。就算她沒有立刻採取積極的改變，這份體悟至少讓她開始投入更多的時間及賭注在自己真正喜歡的事，例如關愛他人及藝術。


    另外一個學員透過清點資產，瞭解到生命中其實不需要這麼多根本用不到的東西，一直放著純粹只是以為「有一天可能會用到」。他的做法就是將這些無用的舊物變現，再購置一些以後用得  到的東西，同時，手上的現金也賺進了一些利息。他的人生變得更簡單，也可以把這些用不到的存貨讓給真正需要的人。


    還是那句老話：不要覺得羞愧，也不要責怪人。在建立資產負債表的同時，很多感覺會隨著你的物質生活日漸清晰而湧現：悲傷、沮喪、緬懷、希望、罪惡、羞愧、窘迫、生氣。保持冷靜但卻關懷（Compassion）的態度，有助於走更長遠的路，也會讓整個過程對人生更有啟發，以往壓在你心中的重擔也才能一一放下。


    ## 步驟一的重點摘要


    - A. 搞清楚你的一生中，到底賺進了多少錢。

    - B. 建立一個屬於你自己的資產負債表。你賺的錢能得到什麼東西？


    # 談一談錢 關於錢的幾個問題


    你跟金錢的關係，其實影響了你過去與父母、環境、文化的互動，包括信仰、認知及過去處事的種種經驗。重新檢視過後，你可能會感到驚訝、興奮，甚至有點不安。「談一談錢：關於錢的幾個問題」這個活動，可以讓自己去看到過去是如何與別人互動、檢視過去，也讓你清楚之前盲目的消費是如何牽引你的生活。抱著「不羞愧、不責怪」的態度，讓你從金錢的布幕後，看到真正的自己，也同時釐清從過去到現在的人生歷程。


    借用本章結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。記得如果在反省時，都能不忘在最後加上「為什麼？」，這樣會讓你有更深層的思考；如果都能不忘在最後多問一句：「社會如何看待我的答案？」，則會讓思考層面更為廣泛。無論如何，這些問題，都沒有標準答案。


    1. 是誰啟蒙你有關於金錢的概念？當時學到了什麼？

    2. 在你長大的過程中，曾經得到哪些與金錢有關的概念？是誰告訴你的？父母、老師、廣告、或其他？

    3. 分享一下你小時候對金錢的概念是怎麼來的？這些概念如何影響你現在的作為？

    4. 在處理金錢方面，說說你曾經犯過什麼樣的錯誤？若再做一次，會怎樣處理？

    5. 對你而言，「豐足」的意義是什麼？

    6. 從你的衣櫃或儲藏室中去掉什麼東西，會讓你的生活過得更好？你為何現在還保留這些東西？


    # 金錢已經不是從前的那個樣子了！


    ## 從來就不是


    對於安卓亞及凱爾來說，第一歩一點都不難。二十二歲的凱爾是個理想主義者（dogma），對錢非常「敏感」，他留著長髮，在郊区租了一間小屋，對於錢應該花在哪裡，應該從事哪些娛樂，非常謹慎。即使這樣，他仍然有一萬五千美元的債務，他預計有一天會把債務還完。直到他碰到了安卓亞，他被她的體貼、執著吸引，但兩人生活方式很不同，戀愛了，他才發現她有四萬美元的債務。


    就像許多年輕人一樣，安卓亞很喜歡買東西，越買越多，添購家具之後，她就陷入債務中。她把負債看作是生活的日常，就像大部分美國人一樣，她及時行樂，還債日後再說。她兼差擔任行政助理，以應付生活中的例行支出，希望追求生命成長。


    雖然兩人住在一起，凱爾對安卓亞花錢的方式一直有意見，而對於凱爾的看法，安卓亞心裡也有疙瘩。他們一起參加財務研討會，安卓亞認為自己陷入兩難中，一邊是想當足自己的心靈生活，一方面又無法對日益增多的債務視而不見。


    安卓亞下定決心，要好好檢討一下自己愛買高級品的心態。凱爾也同意，不要過度逼她  改變，讓她自己思考什麼是該做的事，也不強迫她認同自己的價值觀。他們決定要結婚了，凱爾娶進來的不只是一個新娘，而是一筆幾乎已經膨脹四倍的債務。步驟一，讓他們知道了一個事實，他們的財產淨值是負五萬五千美元，他們得採取新的生活方式。


    一旦你做完了步驟一，你應該知道自己現在的資產淨值有多少。就像安東亞及凱爾，會得到一個單位是錢的數字（我希望是正數），但這意味著什麼？我們要做的是，解密這些數字背後的成因。錢到底是什麼樣的東西？這是一件非常重要的事，因為如果不了解我們跟誰相處，就很難維持好彼此的關係，更麻煩的是，錯誤認知對方，會讓事情變得更糟。


    金錢，古今中外沒有相同的定義，我們對於處理金錢這件事，可能很小心也可能很瘋狂，希望透過金錢取得想要的東西。


    ## 金錢的定義


    什麼是金錢？


    我們每天都用錢交易，薪水、投資所得，算是金錢流入；付現、刷信用卡，支付債務產生的利息或是繳稅，都是金錢流出。


    其他造成金錢流出的還有：手機的費率、上網費用、車貸、保險費、油錢、交通費用、房租或者地價稅、房屋稅、愛車修理及保養、雇人打掃家裡、心靈課程、音樂會門票、度假、參加會議、到小攤或餐廳吃飯、治裝及到超市添購家用及發寵物的各項費用。每一項金錢的進出，老實  說，你很難親眼看到，往往都是電子交易，噺一聲就不見了。我們以為很容易了解金錢在人生中的定位，但它到底是什麼？它代表什麼？


    財務專家喬在一九八〇年代的財務研討會中拋出這個問題，他穿著典型華爾街的西裝跑步上台，問在場數千位觀眾，望著台下的一片沉默，他點名一位看起來塊頭很大、很威猛的觀眾（喬只有一七〇公分），大聲地问道：「你的有多大？」台下一片靜默，他也笑了，「我說，一聲音更大了：『你的有多大？』又露出詭異的笑。現場一片沉靜，『你們在想什麼啦！我是問，你的經濟負擔到底有多大？這不是最該問男人的一個問題嗎？』」在學員還沒學到新東西之前，他們需要震撼教育。


    這開場，當然是讓大家一驚，但喬要問的其實是「什麼是金錢？」這個問題。我們可能永遠不會問自己，因為我們都以為知道答案，但我們真的知道嗎？「你每天都用到錢，甚至可能為它喪命，你當場必須知道，金錢是什麼！」接著，他拿出一百塊鈔票，「嗨，這不過是一張紙！」接著把它揉一揉說：「這紙質頗堅韌！」接著拿出一個打火机說：「我們來做個試驗，把它燒燒看！」全場一片驚呼，紛紛伸長脖子察看。在紙未燒起來之前，他關上打火柴，「為什麼會有這樣的反應？為何你會對燃燒一張紙有這麼大的反應？由此可見，金錢不只是一張紙，或是一個普通的材料，或者只是一張塑膠紙上面印著很多零。但這東西到底是什麼？」一位像經濟初學者的男士大膽地回答：金錢是交易的工具。「很好，那我用這一百塊跟你買你的老婆，好嗎？」不，在這個時刻，讓我想起了薌伯納（Cooper
    Barton Stace）的故事，他在宴會中向同場的一位女士問道：「小姐，我給你一百美元，你跟我上床睡一覺，好嗎？」她很震驚覺得被侮辱，接著，薌伯納又問：「那一千美元，好嗎？」她想了下，開始猶豫。可見，錢確實能讓行  為改變。喬的重點是，錢是交易的工具，但它只有在交易對方認同其價值時，才會發揮功能。一想像一下，如果你的船在亞馬遜森林中翻了，那個地方充滿食人魚，你想你完了，但摸摸口袋，發現錢還不少，你慶幸這下得救了。接著，你看到兩個人划著船過來，你拿著一大把錢喊：「救救我！」但他們根本不認識錢，他們只想把你當作晚餐吃掉！


    金錢唯有在雙方都認同價值時，交易的功能才能發揮。這是法定的貨幣。


    鈔票上面印了字，可能比一張白紙還不值錢。「你怎麼知道你想的一定是對的？」喬又拿著百美元鈔票大聲問。


    ## 金錢的功能是儲存價值？


    這個經濟初學者再次勇敢回答：金錢可以儲存價值，意思是你可以把它存起來，改天再用。你可以把森林（真實價值）變成木材實樟，然後把錢存起來，放在銀行，以便日後花用。沒錯，這是金錢的重要功能。


    這是一個抽象概念，讓我們從仰賴每天狩獵的獵物過活，到變成工業社會中的一個小齒輪。雖然每天都得要花一小時在通勤上，但我们仍在職場中，用時間與精力賺錢。


    - 一對，當然，錢是一種儲存價值的工具。但請想想，如果一旦發生經濟泡沫，或者政府失能，引發高度通貨膨脹，那麼原來可以買一頭母牛的錢，變成可能一杯牛奶都買不起，金錢的價值轉眼間可能會消失！如果今天喬還在世，他可能會說，你看二〇〇一年，安隆（Enron）倒闭之後，員工的退休金就成泡影，或者是二〇〇八年金融風暴，很多人財富立即縮水，或在隨後引發的多天避險基金（Madrone）<sup>1</sup>
    醜聞中，很多人的錢，一瞬間化為烏有。


