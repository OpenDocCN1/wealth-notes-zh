    # 金錢的功能是儲存價值？


    這個經濟初學者再次勇敢回答：金錢可以儲存價值，意思是你可以把它存起來，改天再用。你可以把森林（真實價值）變成木材實樟，然後把錢存起來，放在銀行，以便日後花用。沒錯，這是金錢的重要功能。


    這是一個抽象概念，讓我們從仰賴每天狩獵的獵物過活，到變成工業社會中的一個小齒輪。雖然每天都得要花一小時在通勤上，但我们仍在職場中，用時間與精力賺錢。


    +   一對，當然，錢是一種儲存價值的工具。但請想想，如果一旦發生經濟泡沫，或者政府失能，引發高度通貨膨脹，那麼原來可以買一頭母牛的錢，變成可能一杯牛奶都買不起，金錢的價值轉眼間可能會消失！如果今天喬還在世，他可能會說，你看二〇〇一年，安隆（Enron）倒闭之後，員工的退休金就成泡影，或者是二〇〇八年金融風暴，很多人財富立即縮水，或在隨後引發的多天避險基金（Madrone）¹
    醜聞中，很多人的錢，一瞬間化為烏有。


