    # **高薪是一種態度問題**


    很多人對收入的多寡都很消極，甚至是宿命論。他們在受害者心態下行事，完全受到外部勢力的支配：老闆、工資級距、失業狀況、經濟衰退、在地景氣及政府的經濟政策影響，還有來自發展中國家低薪工人的競爭……上班族的態度往往會變成：「我找不到一份好工作，都是因為他們，他們讓我從事低薪工作。」雖然經濟現實有時是苛刻的，但會這樣想，有一部分是人類精神的本質所致。


    一個限制你的收入的可能重要因素是「態度」：對自己的態度（例如「我不夠好」），你對工作或雇主（「他們都在搞我」）的態度，及對當前情況的認知（「就是找不到好工作」）。如果你認為自巳是一個受害者，那麼你很可能會忙於自我怨懟，忽略了周遭很多足以改變命運的機會。為了人生富足，培養積極、自信的態度與尊重，對工作付出你的貢獻，與雇主和同事的密切合作，盡最大心力完成工作，維持個人的誠信，勇於承擔責任，才不會枉費你的生命活力。仔細思考，如何發揮自己的生命力，這樣可能會改變工作的表現，也才能找到下一個更好的工作。記得，無論你在哪裡工作，你都在為自己工作。無論做什麼，都要致力於追求卓越及百分之百誠信。是你自己決定工作是否能帶給你充實的感覺，而不是職位好壞或大小。


    在第六章中談到的木匠泰德認為，財務自主計畫最重要的啟發，就是讓他有機會與想成為作家的願望重新連結。他在一個空军世家中長大，因為父親職業的緣故時常搬家。他在密西西比州的格爾夫波特（Gulfport）完成了高中學業，然後搬到了德國的奧斯汀，他'
  - '[PAGE 271]


    雇了八個人成立一支室內裝演的團隊，但一場火災讓他一夕全無。接著又離婚，所有財產裝到一輛卡車中還有剩（因為家徒四壁，要做到財務自主的步驟一，變得非常容易），但他沒有倒下，最後在俄勒岡州，重新建立人生。


    在實施財務自主計畫的一年後，泰德有足夠的資金，支持自己一年的生活。他決定嘗試寫作，把多年以來的故事寫出來，包括他七○年代初在密西西比州，與一些非裔的木匠建造了一座浸信會教堂的故事。為了騰出更多時間寫作，泰德開始拉高室內裝潢工班的報價，想以價制量。結果大出意外，許多老客戶對他的表現印象深刻，願意付更多的錢請他裝修，他接到的案子及單價都比以往高很多。為了不打壞招牌，他更加在意施工品質，名聲越來越廣，為他帶來更多工作。他工作時間減少，收入增加，焦慮減輕，心情也平靜下來，有更多時間寫作。他很驚訝，但他知道這個好運及尊榮其來有自。


    # 用兼職工作取得財務獨立


    財務自主計畫使得泰德選擇了兼職工作，這種金錢和工作關係的新思維，讓人生有了新展望。以往社會普遍認為，兼職工作的人，人生價值也只有一半，因為得犧牲全職的許多好處，你會失去醫療保險及公司提供的退休保障，也失去升遷的機會。但新時代的觀念已經改變，兼職工作意味著你可以花更多時間，投入在自己的目標及想法；你給了雇主你的生命及時間，為公司換得了財富，但工作卻無法帶給你個人的價值。


    兼職人生可以五花八門、五彩繽紛，有些人每週只上班幾天，有些人一年只工作半年，剩下'
