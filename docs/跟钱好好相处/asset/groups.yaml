    # 對焦人生


    有關於收支圖，還有其他一些事情要做。當你的支出下降時，不要忘記每個月還是問自己：「生命活力的使用，是否跟你的價值及人生目的一致？」這是一個重要的反饋機制，確定你的方向沒錯。


    你的人生宣言，反映生命的價值及目的，代表你真正想要的生活，具有很高的位階，因此得確定你每天的生活，與這個價值及目標一致。不過在實際生活中，這個最終目的容易被忽略，甚至跟每日作為有所差距，而你卻不自知。有時候兩者還會背道而馳，更糟的是兩者越離越遠，其至產生衝突，而你乾脆視若無睹，忽略內心深處的想法，甚至讓它嗶聲。聖經羅馬書七章十九節對人類的習慣有很深刻的描述：「我願意行行善，我沒有去行；我不願意做的惡，我反而去做。」


    我們記錄下來的資料，提供了日常花用的圖像，具體而實際地描繪我們的作為，這對於完成人生的理想及目標是非常有用的。當你的花用跟人生目標一致，就會感到完整及滿足，美好的感覺油然而生。如果兩者不一致，請自問：「我的花用，可以達成人生目標及價值嗎？」答案如果是否定的，那麼你可能就會對所做的一切感到失望，陷入自我批判否定的情況。


    通常，如果你的答案是否定的，花費就會隨時問下降，因為不少源於情緒或文化因素的非意識消費會減少，鈔票不容易從你的荷包裡流出。但也不一定是如此，你可能會發現，自己對某些人生目標非常感興趣，就一股腦兒栽進去，支出就開始越來越多。例如，你一直期許自己當個聲樂家，可能會自問：哪裡有好的音樂課我可以去參加？甚至還可能會思考：我是不是應該到義大利去念最好的音樂學校？碰到這樣的狀況，也許你應該在追求人生目的與維持財務長期穩定之間，尋求'
