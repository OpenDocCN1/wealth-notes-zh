    要工具。這樣做是個提醒，也是個刺激，功效就像每天喝的咖啡一樣。


    艾薇一直以為過到了真命天子，這輩子應該跟貧窮沾不上邊，她有令人稱羨的生活，一個好老公、兩個兒子，一間有陽台及兩個大露台的宅大院，還聘請室內設計師打造裝潢，她也從不用擔心生活費用或帳單的事宜。想不到婚姻觸礁，人生一夕劇變，美好的生活轉眼成幻影。她離開了丈夫、房子、豪宅及高壓的工作，自己整理行李，租了一台搬家卡車，帶著兒子移居西岸。


    七年之後，透過參加財務獨立計畫，她比以前更自由了。她與朋友瑪格麗特組織了一個二十幾人的互助團體，彼此打氣分享財務獨立的過程及辛酸。他們每月見面，分享心得及成功經驗，當然也會討論一些困難，包括一些最私人的財務資訊。


    一開始組織團體時，她就想：「我的父母一定覺得我瘋了，因為我們被教育不能告訴別人你賺了多少，又花了多少……這是一種……一種，很不恰當的做法……」但她自問：為何我們不想這麼做？是害怕讓別人知道自己的財務狀況？她想通了，應該是害怕別人用財務狀況判斷我們的價值。一般社會人士很容易用幾個簡單的數字，就決定一個人值不值得交往。她勇敢地把自已的收支圖攤在大家面前，供參與者討論。想不到原本的懼怕消失了，她感覺到內心本來對金錢的顧忌不見了。錢花掉了，就是花掉了；錢賺進來，就是賺進來了，不代表其他意義。現在，她可以跟任何人討論自已的財務狀況，就像談論應該買什麼顏色的沙發一樣，沒有什麼好隱藏的。'
