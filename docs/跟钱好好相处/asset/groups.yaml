    結果讓我們吃驚，不論收入多寡，生活中常常會有習慣性不開心的狀況出現。那些財務狀況比較好的受訪者也表示人生並不圓滿。我們在問卷中問道，「賺多少錢才能讓你感到快樂？」猜猜他們怎麼說？他們總是回答：「要比我現在多更多！」看看我們的生活，生在人類史上最富有的時代，活在地球上，但我們卻把鼻子埋在上裡，深陷生活及工作的迴圈中。我們的內心，其實希望尋覓一些超脫日常生活的價值，可惜好像一直都無法找到。


    # 消費模式不變，地球資源將耗竭


    假如這是我們個人的慘況也就罷了，但事實並非如此，我們富足的日子已經對地球產生毀滅性的影響。一九八七年，聯合國世界環境與發展委員會（World Commission
    on Environmental Development）警告，已開發國家這樣的消費模式是環境變差的主因之一。不過這份報告發布以來，除了使用科技產品的頻率越來越高外，我們的生活模式並沒有產生多少改變。我們不缺警告，即使電視新聞不斷提出，但我們越來越不知道什麼該相信，或者為什麼需要關心這樣的議題。


    環保人士已經盡力用圖表及各種資訊不斷傳遞地球越來越熱的訊息，暖化消融了冰山，使得有些地區的温度越來越高。-- 全球足跡網絡（Global Footprint
    Network）製作了一個生態足跡量表（The Ecological Footprint metric），把製造日常用品所消耗的能源及資源，從汽車到沙發清楚列'
