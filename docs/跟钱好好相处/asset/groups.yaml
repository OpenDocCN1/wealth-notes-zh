    何時間發行的債券都可以〗的人購買。根據當時利率的高低，你買到的國債有可能高於或低於面值。許多人不偏好在次級市場上購買債券，而不是直接從美國政府購買債券，因為他們比較願意擁抱有債的〝真人〞交易，而不是為美國債務注資。'
