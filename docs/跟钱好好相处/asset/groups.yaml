    有一天需要坐輪椅，也有人可以從旁照顧。


    飛利浦＆坎貝爾 (Michael Phillips and Catherine Campbell) 的著作《老年生活的簡單投資》( Simple Living
    Investments for Old Age) 提到，做好四個步驟可以讓老年生活過得好。作者認為，第一個步驟是持續追求健康 (不能只當個藥罐子，靠老年給付過活)；第二、結交新朋友，特別是年輕朋友，參與社區活動。這樣，不僅讓自己保持活躍，更能證明自己的價值；第三、盡量讓自己的財產保持單純，有接受新挑戰的準備，而不是每天等著跟上帝報到；最後，持有傳統式的資產，例如房地產，能持續有收入。這些建議提醒我們，保有資產不等同於「越多越好」，因為為了要更多，我們會投注過多的時間、擔憂及金錢在維護資產上。只要把力量確實集中在那些值得保護的資產就行，思想如何在下半輩子優雅且簡約地生活，永遠不會嫌早，也不會太晚。


    # 養育後代


    美國農業部 (US Department of Agriculture) 統計，把一個小孩拉扯到十八歲，不含大學學費，至少得花費二十二三萬美元。雖然數字看來很驚人，但不少追求財務獨立的父母，其實也找到很好的方法，既能省錢，又能養出好小孩。最重要的原則是父母必須以身作則，擔任簡約生活的楷模。如果你能控制自己的開銷，孩子就會模仿；如果你的小孩比較叛逆，你也許可以給他多一點零用錢，告訴他這些錢必須用來支付自己的衣著及其他必要開支。不少追求財務獨立的父母表示，告訴小孩他自己得支配花用，孩子就會變得比較節約，也會有創業的想法。


    盡量帶孩子接近大自然，不要關在家裡，會帶給小小心靈更多的刺激及自由，這是重要的人'
  md: '

    ## 處理你的債務及財務


    簡約生活的最重要條件之一就是避免欠債，畢竟，你已經做了這麼多努力讓口袋裡有錢，得珍惜這個很重要的優勢。既然已經如此，就不要再讓錢又流出去，再次進入債務的循環中，拖累邁向財務獨立之路。有人乾脆所有開支全部用現金支付，但許多身上本來就已經有負債（如：學貸、房貸或車貸）的人，因為想要趕快進入簡約生活的步調中，因此選擇盡速付清欠債。最簡單的方式就是用信用卡或現金卡借錢，但這樣的做法只會讓自己進入另一個負債的循環中。我們一再強調清除高利息債務的重要性，更重要的是，要徹底避免再次借錢。信用卡借款很方便，有人也認為這樣可以累積點數，但這不是每個人都能做，除非你確定在月底能連本帶利地全部付清，否則絕對不要輕易嘗試。我要強調的是：每個月！若做不到，就使用現金或是簽帳卡，包括金額比較大的汽車貸款或是其他分期付款。再強調一次，除非雙方開出免利息的優惠，或是你有信心能在期限內還完借款，在這樣的情況下，你才能考慮使用分期付款。


    如果以上說的你都做不到，無論你消費什麼，都請用自己口袋裡的錢購買，絕對不要再跟銀行借錢，因為還得支付利息。不過，有些債務可以視為投資，如果你用貸款買的物件，未來會增值，你的購買力也能夠隨之提升。如果你每個月都能如期繳息，你住的區域不動產的價格又穩定上升（不是那种暴躁地段，因為漲多易形成泡沫，泡沫破掉，買氣就會停滯），那麼你可以試著借一些利息低且利率固定的貸款。這樣，也許會是一個聰明的投資。特別是你付出的利息，還可以抵稅。許多人認為，還清房貸讓房子完全屬於自己，會使生活過得更舒服，因此會想盡辦法早點把房貸還清。


    年輕人為了美好的未來，也會利用學生貸款就學。但當你將學費視為人生重要投資的同時，當然也不希望一畢業剛出社會就背負沉重的債務。最好的方法是爭取獎學金，避免負債發生。如果做不到，也要想辦法在短期內把學費還清，同時別忘記要扣繳你的所得稅。如果你在學生時代已經借了錢，務必確定每個月都能還錢，否則你的債信會受損；一旦債信受損，你以後可能借不到錢買房子或是租屋；若急用時要動用信用貸款，利率也會比較高。現在不少銀行都會提供線上服務，並會給予用戶利息折抵，善用它也是不錯的選擇。美國有一些類似銀行的金融機構叫
    Credit Union（信用社，這種合作社的業務基本與銀行相同，但規模要小很多，一般都是地方性質），收取的手續費比較少，存款利息也比較高，不妨試試看。不管你的銀行是哪間，千萬不要提領超過你存款額度的金額，或是使用機票支付。因為，這樣你得繳納很多服務費。多利用線上服務，一旦存款水位太低、消費異常或是有金額支出，系統都會提醒你。


    ## 找到安居的所在


    就像在第三章提到的，房子應該是你每月開支中，金額最大的項目。都市化的結果就是讓房價越來越高，因此，若你能有創意地找到安居的地方，會讓你的日常開支減低不少。想一想，搬到房價比較低的區域，或是找室友來分擔你的支出（利用不同的網絡平台及社群媒體提供的服務，越來越容易找到室友），或是想想你是否能找到可以遠距上班的工作，或是住小一點的房子。根據統計，平均每個美國家庭的居住空間，從一九七三年的十六六〇平方英尺（約五十坪），成長至二〇一五年的二六八七平方英尺（約八十坪）。①問問自己，真的需要這麼大的居住空間嗎？


    住兩百多平方英尺（約六坪）的空間，也許真的太小了，但換一個角度想，如果居住的地方小一點，打掃不會太辛苦，冷暖氣的開支也會比較少。有一種共居的社區，現在越來越普及，如果找到志趣相投的人住在一起，又可以共享資源達到省錢的目的，也是不錯的選項。如果你已經找到適合居住的區域，可以找找附近有沒有還沒有放到市場上的出租物件；找找看沒人住的房子周邊，有沒有張貼告示，或是沒人照顧的庭院，或是郵件沒人收的住家，用地址到戶政機關找到屋主的聯絡方法，試著詢問他們願不願意把房子租給你。


    如果你已經有房子，可以把用不到的空間出租。如果你還在找房子，不妨找雙拼式的住宅，一邊可以租給別人，這樣會減輕不少房貸負擔。最後，因為科技發達，我們可以在世界各地工作，近來有越來越多職場人士沒有固定住所，也一樣能上班賺錢。這樣，不僅所在環境優美宜人，花錢也比較少。


    瑞秋有一份待遇不錯的工作，但這份工作卻埋葬了很多她的價值及想要做的事情。她常想，如果不上班就可以做想做的事，漸漸地覺得上班就像要到監牢中蹲苦刑一樣。財務獨立課程開啟了她的想法，但臨門一腳是她自己的創意，讓事情露出曙光。她想到自己可以搬到樓下，把上層的臥室出租，用租金繳納每月的房貸，她現在正往這個方向前進。


    卡拉及理查兩人都是藝術家，在自家所在地的管理委員會擔任樓管。他們搬進來時，房子已經裝潢好，不花一毛錢。因為上班地點就在住家大樓，不需要通勤，每天穿著工作服上班，也不用刻意打扮，當然沒有造裝費的問題。如此既有薪水可拿，又有更多的時間投入在他們熱愛的藝術上。


    ## 交通費用


    想象看以下的狀況，有史以來，人類幾乎都是被動物拖著往前走。在遊牧時代結束、農耕時代開始之後，大部分人類的活動範圍都超不出離家十英里的區域。一八六〇年代奧圖（Nicolaus
    Otto）把內燃機裝上汽車之前，引擎根本不存在人類社會。一百五十年前，地球上只有一小撮人擁有汽車。我們之所以願意到世界四處探索，驅動的力量不是汽車引擎，而是好奇心。因此，我們需要花點時間想想看在「行」這個重要的需求上，如何簡約生活。


    對大多數人而言，汽車應該僅次於房子，成為生活中花費第二高的項目。擁有一部汽車成本不低，包含：保險、牌照、保養、修理、汽油及折舊。如果你必須擁有一輛車，務必盡量保持車況良好、能源效率高、妥善保養，保有一輛車的時間盡可能越長越好。就長遠來看，買一輛新車的成本真的很高，因此開車時間不要過長避免耗損。跟別人共乘、搭公車、往離工作地點近一點，或能在家工作幾天的，或者走路、騎腳踏車，都可以延長車子的壽命。


    請問老闆能否一週只要來公司四天，這樣可以省下通勤的成本，尖峰時間也不用跟大家擠著上下班。如果你住在都市，有不同的方法取代汽車，大眾交通運輸、共乘、分享單車、計程車、租車等等。有了這些替代方案加上停車費很貴，若住在都市中，你幾乎不需要買車。就算你不住在城裡，最好想盡辦法，不要買第二輛車，家中維持一部車就好，如此不只省下辛苦錢，還可以有其他好處。


    羅絲瑪莉仔細計算過成本，賣掉她唯一的汽車。她所住的城市裡有倡導共乘，她每週一次的採購雜貨，就利用這個服務完成。她算過，每個月會有一個週末需要出遊，用租車方式花的費用，比擁有一輛車，包括：保險、牌照、分期付款、修理及維護還省。如果想出去走走甚至露營，就會勸說有車的朋友，載她一起去，這樣不只省錢，人際關係也因為這樣的自然互動變得更好。雖然全程油錢由她負擔，但這樣加起來，比自己開車省了一半費用，而那份快樂更是無價，是非常划算的交易。


    泰迪經營一家裝潢公司，除了自己的車之外，還擁有另外兩部汽車（一部貨卡和一部用了滿久的老爺車），他通常用來載工具及材料。因為這兩輛車都已經很舊，不值什麼錢，他認為花費應不高。錯了！從每月收支表可以看出，兩輛備用老車持有成本相當高。仔細算保險、牌照費用及更換變速箱的成本之後，他馬上把這兩輛車賣了，若有需要就去租貨車。


    ## 好好照顧自己的身體


    醫療費用真的很驚人，保持身體健康對自己及荷包都是一件重要的事，最好的方法就是健康飲食、運動、休息及減壓。雖然健康概念的說法常常不一樣，甚至也常相互抵觸，但預防仍是重要的關鍵。如果你有健康醫療保險，有些保險會提供身心健檢、預防，甚至還提供健身俱樂部的會員資格，這些都可以善加利用。有些公司或機構會提供各類的健康保險，員工可以提撥部分薪水，放在信託帳戶或是投資在金融商品上，萬一需要醫療費用，就可以從中得到給付，投資所得還免稅，這些都值得一併利用。


    如果你自己負擔健康保險，在選擇保單時務必留意，是否適用價錢高一點的醫療服務。如果你的身體大致來說很健康，你可以選擇免賠額度高（frank deductible）的險種，這樣保險費會比較低，可以省一點。


    如果預防做得好，就能避免掛急診，花更大筆的費用。防微杜漸的道理在健康醫療上特別適用。如果你沒有醫療保險，那麼保健康預防的工作就更重要了。可以找時間逛醫療展，有些攤位會提供免費的血液篩檢，廠商只會收很少的費用。如果你的牙齒需要定期檢查，可以留一下家附近的診所，裡面可能會請一些實習醫師從事最基本的牙齒保健及檢查，費用相對低廉。另外，同個牙科醫生可能在不同的醫院都有門診，可以花點時間比較哪個醫院收費比較低，以往的經驗告訴我們，醫院之間的差距真的很大，找到便宜的會讓你很有感。


    因為國內高漲的手術費用及醫療險，不少美國人開始到其他國家尋求醫療服務。有些組織如海外就醫指南（Foreign Doctor Note），協助美國人到海外找對的醫療機構，通常這些國家的花費，只有美國的兩成到九成。不過，這樣做也是有風險，因為就算在國外做完手術，回國之後若引發併發症，你還是得付昂貴的醫療費用，在手術之前務必做好準備及研究。


    ## 換工／分享


    不少研究結果顯示，融入社會是邁向幸福及簡約生活的重要道路，而最快速的方法就是分享你擁有的事物。前幾章提到的共乘汽車，不管是租或是借，都是很好的方式。近來社會上，對於社群分享的接受度已經越來越高。社區媽媽會輪流照顧小孩、「專長交換」或是提供「侍用」服務等，都是其中的例子。透過這樣的互助合作，社群網絡會更緊密。以「專長交換」來說，擅長剪髮的人，可以透過幫鄰居剪髮，交換照顧長輩或陪同看病的服務，或者是交換修電腦。盤點你會的技能，加上一點創意，就會讓分享創造雙贏的結果，你也會更融入社群。


    ## 飲食


    不管多省，大部分人還是會花錢在吃這件事情上。一旦你開始記帳，應該就會發現飲食也是一筆不算少的開銷。花點時間在家做菜，可以招待朋友，又可以節省費用，比到外面打卡消費划算多了，也有益健康。如果你是有機食物愛好者，自家的花園種點菜，保證也會讓生活費下降，同時不用擔心吃下肚的東西。


    日常雜物也有省錢的方法，有些很簡單，有些則需要費點心思想。簡單的做法包括詳列清單、不買清單外的產品，了解商店中有哪些產品促銷，收集折價券，不隨手亂買東西，大量採購，跟隨時節採購也是個做法。這樣做可以大量節省開銷，買的食物也是最符合時令、最新鮮的東西，但不必堅持二月一定要買桃子，九月一定要買草莓。


    在日常購物項目中，最花錢的應該是肉類、酒及咖啡。若要有效省錢，這幾項食品需要多花一點精神。可以試著減量，或是看看哪裡可以買到比較便宜的商品。作家波倫（Mabel
    Pearl）對於選擇日常食物有個不錯的建議：「不要吃太多，選全食物，從土地中長大的最好！」這樣的想法，可以讓我們反思是否真的要消費這麼多肉類。


    對於少不了的日常必需品，考慮跟朋友鄰居揪團採購。多數人會很直覺地到商店裡去採購食物，但其實在我們身旁有不少在地生產的農作，也可以當成選項。打聽看看鄰近地區是否有農民願意讓你到他的果園裡採水果、蔘果，或到野生的土地上摘野蜂蜜（在美國東北岸，就有很多莓果生長在無人看管的土地上，我們曾經摘了非常多回家），可以做好鄰里關係又免費，何樂而不為？


    ## 通訊及娛樂


    仔細計算每年在網路、手機、電話上的花費（包括家中的有線電話），還有訂閱線上音樂、線上影片或電影、新聞內容、報紙或雜誌的花費。這些費用很零星，但加起來也頗為可觀。如何控制這些花費，又可以取得你需要的娛樂服務？


    第一，如果你還用傳統價格偏貴的電信合約，從現在起不要再續約。如果你跟家人用同一家電信公司的門號，也有很多省錢的方案可以選擇，你可能會發現，新方案所付出的成本，只有原來的四分之一，可以省下上千美元的費用。電信公司都有推預付卡服務，如果你不是重度用戶，這些應該就夠用了。如果你每天都待在家中或都在辦公室，這些地方都有
    Wi-Fi，可以開掉上網功能；只要有網路，就不需要打電話或發簡訊，用通訊軟體溝通就行。電信公司的資費方案都會試圖綁約，不會讓你隨便跑掉。


    你若選擇購買不綁手機、單門號的資費方案，就買二手機來使用，前一年的旗艦機款，隔年價格都會調降好幾百美元，你不需要買最新機種，一個功能齊全的智慧型手機，不要一百美元就能買到了。如果手機是必備品，那就把昂貴的家中電話解約。電視及電影這些娛樂花費怎麼辦？你可以停掉昂貴的有線電視或是衛星電視，改用無線電視（OTA）服務或是在線上收看串流服務，只要用天線就能接收到電視節目，品質比有線電視及衛星電視都好，而且完全免費。其實網絡上有不少免費的串流影片，如果你選擇付費收看電影或其他視頻內容，記得最符合你需求的，而且一家就好；線上音樂服務的消費原則也跟電視電影一樣。


    雖然花錢訂閱新聞服務、支持新聞產業，在這個社會中非常重要，但也要注意花費，特別是在非常多的資訊都可以透過不同的來源免費取得。如果以印刷品來說，現在公共圖書館的資源比三十年前要豐富很多，可供借閱的書籍，不論種類或方便性都比以前好很多，大部分的圖書館都有數位內容的服務，供人下載電子書或者是有聲書。這些都是免費的，已經由納稅人的稅金支付了。


    ## 度假


    隨著你對金錢的控制越來越好，生活也越來越滿足，你需要放空的機會應該變少。如果要休閒，可以考慮近一點的地方，甚至你可以想想「在家度假」（staycation）這個概念。當然，為了讓生活過得更好，你仍然花了不少時間維持經濟狀況，在這樣的情況下，休假必不可少，放鬆也相當重要。也許你可以把後院的吊床換一個新的（或二手的），想一些有別於傳統旅遊的休閒方式。如果你還是非常想找一個不一樣的地方轉換心情，也許來個一夫旅行，或是找個離家比較近的地方，畢竟三英里跟三百英里，都算是轉換環境。


    露營其實就是一種省錢的休閒方式，可以放鬆、接近大自然，又不必花太多錢。如果真要長途旅行，省錢的方法也不少。機票方面，網路搜尋引擎能找到最便宜的方案；如果你讓行程及時間保持彈性，就可以買到最划算的機票，通常只要一般價錢的一半左右；利用信用卡集點機制，累積里程、住宿扣抵或是現金回饋也是辦法。至於住宿，考慮當個「沙發客」，分租民宿或青年旅館，這樣不僅解決住宿的問題，還可以接觸其他旅人及在地人士。也可以試試「以工換宿」，類似「世界有機農場組織」（WWOOFing,
    World Wide Opportunities on Organic Farms）這樣的機構，會提供全球各地有機農場或是永續農場的勞動需求，你可以用勞力換取住宿及三餐。


    不管你去哪，避免跟一般觀光客擠在一起，找找當地餐廳，利用當地大眾運輸，如此會有更多體驗，費用也更節省。如果你嚮往異國風情，在地球的某一個角落或許有人跟你想同一件事，那你們可以來個交換住宿。現在有不少跨國換宿的服務，你可以換到法國普羅旺斯或羅德島的普羅旺登斯，也可以試試志工旅遊，參與科學研究或各式服務。如果能協助世界某些村落擺脫疾病，或建立學校，總比像觀光客四處拍照、購物、買紀念品來得有意義。在網路上找找看，有沒有人需要你幫忙看家？這種媒介網站也不少，許多追求財務獨立的人，每年就會花一段時間，移居到消費水準比較低的國家，不用在經濟壓力下被迫回去擔任正職工作。那裡的住宿、交通或是食物都相對便宜，還可以四處旅遊，一舉數得。


    ## 保護好自己的東西


    如果你照著這本書過日子，將成為聰明花錢的消費者。當你在購買行為上具備了重要的概念及技巧，就要把這個能力應用到買保險上面去。在你買保單之前，一定要知道自已到底在買哪種產品。例如，你的車險真的能夠涵蓋所有開車時可能發生的狀況嗎？萬一發生碰撞，出險範圍有多少？如果替你家裡的傳家寶保險，你確定萬一被偷了，能夠拿回一樣一樣的？如果你沒有家人要養，沒有後顧之憂，你還需要壽險嗎？買保單之前一定要詳細審閱，才能讓保險價值發揮到最高。如果不了解，找找身旁值得信賴的保險員，應該可以跟你講得更清楚。


    凱西與蘭登在記錄自已每月收支表時順便檢視一下保單，結果讓他們吃驚不已。他們每月花六美元為凱西祖母傳承下來的珠寶買保險，但回頭一想，保有祖母的遺物是為了紀念，萬一掉了，世界上沒有任何東西可以取代，那每個月付六美元，所為何來？花錢買一個安慰？藍登用財務獨立計畫中學到的技巧，以預計財務獨立的時點，回推利率水準來看，要多少本金才能產生每月六美元的利息？結果他發現，需要一千美元。這個數字，讓他馬上結束保單。


    講到保單，艾琳與昆提在投保之前，做對了一件事。為了怕自己在往生之前就把錢用完，他們思考要不要買長照險，但高額保費讓他們猶豫再三。後來他們想通了，與其買一個保險怕自己變老、變窮，不如好好保持健康，跟社會多接觸，讓身體及心理都保持在活躍的狀態。因為沒有小孩，他們選擇住在一個大型、混齡且多世代集居的社區，有一天需要坐輪椅，也有人可以從旁照顧。


    飛利浦＆坎貝爾 (Michael Phillips and Catherine Campbell) 的著作《老年生活的簡單投資》(Simple Living
    Investments for Old Age) 提到，做好四個步驟可以讓老年生活過得好。作者認為，第一個步驟是持續追求健康（不能只當個藥罐子，靠老年給付過活）；第二、結交新朋友，特別是年輕朋友，參與社區活動。這樣，不僅讓自己保持活躍，更能證明自己的價值；第三、盡量讓自己的財產保持單純，有接受新挑戰的準備，而不是每天等著跟上帝報到；最後，持有傳統式的資產，例如房地產，能持續有收入。這些建議提醒我們，保有資產不等同於「越多越好」，因為為了要更多，我們會投注過多的時間、擔憂及金錢在維護資產上。只要把力量確實集中在那些值得保護的資產就行，思考如何在下半輩子優雅且簡約地生活，永遠不會嫌早，也不會太晚。


    ## 養育後代


    美國農業部 (US Department of Agriculture) 統計，把一個小孩拉扯到十八歲，不含大學學費，至少得花費二十二三萬美元。雖然數字看來很驚人，但不少追求財務獨立的父母，其實也找到很好的方法，既能省錢，又能養出好小孩。最重要的原則是父母必須以身作則，擔任簡約生活的楷模。如果你能控制自己的開銷，孩子就會模仿；如果你的小孩比較叛逆，也許可以給他多一點零用錢，告訴他這些錢必須用來支付自己的衣著及其他必要開支。不少追求財務獨立的父母表示，告訴小孩他自己得支配花用，孩子就會變得比較節約，也會有創業的想法。


    盡量帶孩子接近大自然，不要關在家裡，會帶給小小心靈更多的刺激及自由，這是重要的人


