    費力、萬無一失的賺錢方法，喬會說你是傻子。


    我這裡有一個故事：在過去，喬只對少數有興趣的人傳授財務獨立課程，每當學員達到財務獨立的某個階段時，他會給他們一張變質的俄羅斯沙皇債券。在電子交易及債券集保不盛行時，債券的持有人會真的從債券上剪下一個利息券（coups），用這個利息券跟債券的發行者領取半年債息。喬的這張債券在一九一七年沙皇倒台之前一直付息，但在俄國革命之後，就變成一文不值。五十年後，喬在偶然機會下買了一盒沙皇債券。喬給達成財務獨立的人這張債券，主要是想提醒，沒有任何投資可以保證地緣政治或經濟條件不會改變，也不要天真地以為鳥巢裡的重要夠長久給你的固定的收益。投資人一定要小心。


    # 低成本指數型基金：防火方案


    如果不買國債，那麼應該投資什麼？大部分的財務獨立者都建議：指數型基金。一九七五年創立的先鋒（Vanguard）資產管理公司創辦人約翰·柏格（Jack Bogle），發明了指數型基金，使投資變得更簡單易懂：把賺來的錢低成本地分配給股東。跳過中間人抽取的佣金及大幅降低管理費用，先鋒為散戶及其他基金公司富達（Fidelity）和嘉信（Schwab）打開了大門。對於財務獨立者來說，指數型基金非常接近「買了，就放在一旁不用管」的原則，是債券以外的理想投資標的。


    股神巴菲特曾說：「指數型基金是絕大多數投資者明智的選擇。」他解釋：「例如，透過定期投資指數型基金，一般投資人可超越大多數投資專業人士。」①指數型基金或ETF設計為追蹤市場上主要指數（如道瓊工業指數、那斯達克綜合指數和標準普爾五百指數）或債券市場指數。


    > ①參見：約翰·柏格著，《一本會學識投資》（The Little Book of Common Sense Investing：The Only Way
    to Guarantee Your Fair Share of Stock Market Return），天畜出版商有限公司，二〇一五年。'
