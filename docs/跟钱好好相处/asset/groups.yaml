  - '[PAGE 33]


    同的財務目的。


    如果你是基督徒，在本書中可能隱約會看到耶穌的教導；如果你是佛教徒，也許會看到佛陀傳授的真義；如果你是無神論者，也許會認為內容理性且值得信賴。這當然不是唯一的道路，但看看別人怎麼做，一定會有收穫。現在把他們分為三種類型：忍者（ZEN）、極簡主義者（Minimalist）及自造者（Diyers）。


    # 財務忍者


    個人理財世界裡的忍者跟數字是好朋友，喜歡讓系統維持在最佳化狀態，沒事就看看理財部落格，搜尋免費機票及旅館的機會。他們其中有些人節儉成性，喜歡找便宜貨，收集折價券，尋找免費的機會，以最划算的方法完成交易。當然還有省錢達人，用盡所有方法省錢，要讓這個月的結餘超過上個月，對於他們，省錢就是王道。


    # 極簡主義者


    人生無關於金錢，在乎的是意義，掃除一切阻礙吸收生活養分的雜物，他們是梭羅主義者，重精神、輕物質。把物質環境減到最小，放大更珍貴的非物質層面，一個由心理及靈魂建構的人生，有些人稱他們為精神主義者（Soulism）。其實，簡單生活一直是美國的傳統價值，早在英國殖民之前就是如此。'
  - '[PAGE 34]


    # 自造者


    金錢不是這類人的重點，但在物質世界裡嬉戲卻是很好玩的事情。自己動手蓋房子、種田、修修復補、煮菜弄飯、園藝、設計、創造、畫圖甚至發明，不像極簡主義的人，自造者喜歡創造的過程。他們是一種有想法的物質主義者，自己動手實作生活的大小事，這種精神跟蘋果派一樣，就是美國的象徵。


    在改變與金錢的關系或戒掉惰性的過程中，你不必刻意學習要變成以上的哪一種人，但一定要做些事情才能改變現狀。那些成功達成財務獨立的人，通常都會有幾項特質：值得信賴、自我覺醒及賦權。他們一步一步達到目標。


    # 烏龜及兔子


    每個人邁向財務獨立的速度不一，我常常用烏龜及兔子來比喻這個過程。烏龜屬性的人通常傾向逐步完成，穩定、緩慢但有步驟及方法地減少花錢、累積存款，讓自己從債務中解脫、確定達到中年退休的目標。他們不在意速度，倒是認為人生重要的事情一定得完成，像是建立家庭、服務社會、與雇主保持良好關係等，甚至有些會走遍全美造訪所有國家公園。


    特質像兔子的人，通常會設定目標，就像喬一樣，設定三十歲退休；他們也會設定時間目標，要在那個時間點之前完成應盡的事項，就像賽跑的終點線一樣。他們認為存的錢越多，就越早達到自主的目標，通常會設定一個存款比例，按時從薪水中提存，同時逐步調高比例，並希望朋友'
  - '[PAGE 35]


    及伴侶配合容忍。不論你的方法是什麼，最重要的就是開始做，不要停。每個人的起點線都不同，夢想的力量及對承諾的堅持，將會帶領你一直向前走，就我們輔導上千名參與計畫者的經驗顯示，因為做了這些事情，不少人的生活變得更豐富：


    +   ◊ 他們終於了解金錢運作的基本道理。

    ◊ 他們真的解決債務問題，增加存款，能夠用自己的方法快樂生活。

    ◊ 他們找回以前的夢想，並找到方法實踐，自由度更大更放鬆，也比較能分辨哪些是生活中必要的東西，哪些是多餘的，學會卸下自己的擔子。

    ◊ 平均起來，生活支出減少了二五％，感覺更快樂，雖然所得減少，但身心更健全，跟父母及小孩的關係也變得好。

    ◊ 穩健的財務狀況，解決了內在生活價值及生活方式的衝突。

    ◊ 金錢不再困擾生活，無論在情緒或心智上，都有餘裕處理更重要的事情。

    ◊ 因為減少花費及被工作占用的時間，自己可支配的時間變多了。

    ◊ 不再用消費解決問題，反而願意接受挑戰，學習其他技能。

    ◊ 總之，金錢與生活的拉扯已經救平，生活更完整充實。


    # 四大財務面向


    這套財務獨立的計畫是是為了擺脫原來的心態，改變以消費為主的生活方式及習慣，策略運用'
  - '[PAGE 36]


    與以往不同，更重要的是改變心態及想法，我們稱之為「財務獨立思考法」，期望大家對於生活中金錢的流出及流入，有所覺察及關注。希望透過閱讀，啟發大家對於財務獨立及思考的面向，依照步驟一步一步行動，與金錢的關係就會改變。基本上，又有四大面向必須掌握：第一、財務智商（Financial
    Intelligence）；第二、財務健全（Financial Integrity）；第三、財務獨立（Financial Independence）；第四、財務依存（Financial
    Interdependence）。


    # ### 財務智商


    財務智商主要是指必須有能力客觀地看待自己的金錢，跳脫原有的偏見及情緒。金錢真的能買到幸福快樂嗎？每個人都一定要為五斗米折腰嗎？金錢真的會讓我們恐懼、貪婪、又愛又恨嗎？


    我把大部分的時間賣給了工作，這樣安全感真的比較高嗎？


    建立財務智商的重點，在於了解你已經賺了多少钱、有沒有把它们記錄下來、如何清楚表達、多少钱会流入、多少钱会流出。除此之外，你要清楚金錢的真義。你的一用用金錢交換到哪些東西？就債務來說，我們希望這階段的目標是讓你脫離債務的泥淖，銀行裡有足夠支撐六個月生活所需的存款，如果你跟著本書的步驟，就能建立基本的財務觀念及能力。


    # ### 財務健全


    就字典上的定義來說，所謂「健全」¹，有幾個意義：1.對於道德及人文的價值，有一定想法及堅持，沒有腐化及污染。2.在一個沒有受損傷的狀況下：完整。3.沒有分裂、完整及完全的狀態。


    要達到財務健全，必須確實了解你的收入及花費對社會帶來的影響，不僅是自己的家庭，也


    ¹“integrity.” Merriam-webster.com. 2017. https://www.merriam-webster.com (September
    9, 2017).'
  - '[PAGE 37]


    是整個地球；同時也要清楚需要多少錢及物質條件，才能滿足你定義裡的「充足」。人生（最理想的狀態），哪些是多餘及雜亂的東西。在這個階段，你的財務狀況與你的價值，應該已經平行發展，如果你按照本書的步驟，就能走向財務健全。


    # 財務獨立


    財務獨立不只是收入獲得保障，也同時要摒除對財務錯誤的認知，擺脫債務的束縛及凡事貪求「便利」的心態及行為。財務獨立是要去除所有讓金錢左右你生活的可能。


    # 財務依存


    在上一個財務獨立階段，我們已經擺脫朝九晚五的輪迴，工作及各方面的關係及基本的想法都有了轉變，但這不代表我們要脫離群體及社會存在。人生中最美好的時刻，是愛及貢獻。我們需要投入更多時間，讓生命更有意義。我們是一個相互依存的社會，一起做事、接納彼此。共同創造生活，這是生命豐厚的要素，相互照應，是生活的真實面貌。當然，我們也依賴大自然，共享建設——從道路、機場、圖書館到社會安全網。我們在一個互相連結的大海上生存，事實上，在完成財務獨立之後，很多人（只要休息一段時間，或是完成長久以來的夢想之後）都願意把時間投注在讓世界變得更好。'
  - '[PAGE 38]


    # 新版裡有什麼


    因此，在這個全新版本中，為了反映今日世界的真實狀態，我增補了幾千個不同的內容，其中兩個章節改變最多。智慧型手機、部落格及網路購物的盛行，讓情況產生重大轉變，特別是在第六章〈用省錢的方法圓夢〉更新了不到內容。最大的調整在第九章〈追求長期的財務自由——你的現金應該存放在哪裡？》，以前番或其他人用的投資方法，當時雖維持了二十五年穩定被動收入，但在現代環境已經不是最好的方法。在熟悉不同投資領域的同事幫忙下，第九章介紹以不同的方法完成財務獨立的目标，但最核心的想法沒變，改變的是計畫必須「為你自己量身定做」。老讀者可能會發現，新版本中介紹了一項嶄新的工具——「談一談錢」（Money
    Talk Question）的社團可以幫助你。


    財務獨立九大步驟的基本精神，仍是希望每一個人都能擺脫「工作「消費」的循環，只有你自己可以改變與金錢的關係。當然，喬及我，或者其他社會支持團體的協助，也能扮演提醒與誘發改變的角色，在全書的最後，我完整地介紹了全新一談錢「團體。經過實際驗證，藉由這個方法，你可以跟朋友或是任何陌生人談論生命中最重要的議題：你與金錢的關係。在每一章節的最後，都總結了幾個重要問題，在與朋友、家人或其他團體討論金錢議題時，這些都可以當作是很好；甚至在單獨處自省的時候，也非常管用。當我們願意分享我們的夢想、疑惑、恐懼、偏執，改變就會發生！'
  - '[PAGE 39]


    # **勇敢改變吧！**


    我希望透過這段簡介，引發你對執行財務獨立九大步驟的興趣，開啟改變的第一步。當好奇心被燃起，行動就會跟著產生，我希望你有自信未來可以改變，接著，可以好好閱讀本書了。看完之後重回第一章，開始一步一步執行你的改變計畫，以落實財務獨立的目的。


    老讀者，歡迎回來。新讀者，也歡迎開始認識這套方法，已經有成千上萬的人，透過這個方法走出困境。誠摯地希望你能也能成為其中一分子，這個世界需要你挺身而出，追尋夢想。'
  - '[PAGE 40]


