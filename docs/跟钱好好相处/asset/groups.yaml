    # 製作自己的逐月收支圖（WALL CHART）


    首先，你必須要有一張大圖，空間足夠讓你記載五年的資料，在設計時必須讓圖表容易操作，維持上也不會花太大力氣。最詳細的資訊，其實你都已經放在每月收支表上了，就算沒有電腦或
    $eg$ 也可以進行，最重要的事就是起而行。你可能正在使用 $eg$ ，線上服務或是記帳軟體協助管理金錢，這些工具可能可以在上面直接製作圖表，但我们仍希望你能夠親手製作。至於如何運用資訊管理軟體，步驟五的第二部分會介紹。


    找一張大型的圖表紙（$18 \times 12$ 吋或 $24 \times 36$ 吋，約 $A3$ 或 $A1$ 大小，每一吋有十個方格的圖表紙），在一般文具行或書店應該都買得到。如果真的沒有也不用太擔心，你可以在一張大白紙上畫方格，左方的縱軸代表的是金錢，金額由低至至高：你可以畫兩條線，一條是收入，一條是支出，記得上方多留一點空間，因為依照過去輔導的經驗，你的收入可能會增加甚至加倍。不只一位朋友，在執行計畫之後，收入增加到還得在上方多加一張紙，他們以前從來不敢這樣奢望。


    下方的橫軸代表時間，我們建議保留五到十年的時間，這樣才可以看到更大範圍的趨勢——更可以看著你在真正的財務獨立前進的足跡。如果你覺得用資訊工具輔助比較好，$eg$
    或其他有電子表格類的軟體是不錯的選擇。完成這些步驟之後，你會發現自己看到了一個新的世界，但資訊工具帶來的發現，絕對沒有比你一筆一筆畫在紙本上來得震撼，成就感也很難與手做比較。


    每個月月底，都記得在紙上標註你這個月的收入及支出，最好用不同的顏色，區分收入及支出，之後再用線把每個月的點連起來。第一個月，當你畫上第一個記號時，你已經開啟建立與金錢新關係的第一步，這是令人深省的一步。但當你逐月或逐年登錄之後，真正的學習與樂趣才開始。


