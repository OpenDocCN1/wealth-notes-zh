    Habit, https://ii.wp.com/themoneyhabit.org/wp-content/uploads/2016/09/10.Yr.Treasury-Yield-Augmented.jpg?resize=1024%2C717.
    Source: Board of Governors of the Federal Reserve System (US), "10 Year Treasury
    Constant Maturity Rate," Federal Reserve Bank of St. Louis, https://fred.stlouisfed.org/series/GS10.


    喬在一九六○年代為自己設計的策略，一直沿用到過世前，為他創造了可觀的財富。


    金錢習慣（Money Habits）網站的創始人李文斯頓（E. Livingston）製作了圖表 9-1，說明了為什麼喬選擇了政府公債。


    當喬於一九八○年開始教授財務獨立課程時，他推薦大家把美國公債做爲存放現金的地方。許多人也都這樣做了，並一直維持財務獨立的狀況。


    第五章中說到的麥可就是其中之一，自一九九二年以來，他一直確實執行這樣的策略。


    如果你從二○○○年之後，回頭看看喬的策略，可能既嫉妒又不屑。羨慕的是在那些穩健的回報率；不屑的是，當股票市場創造如此豐厚財富的同時，他竟然選了這種慢吞吞的投資。


    # 圖表 9-1 美國十年公債殖利率


    ![](img/9613d65bc6187206ad77a54ffefc649f_315_0.png)


    「哦，這是一本關於投資國債的書，」他們會輕蔑地說。事實上，它從來都不是這麼簡單，因為這種投資方法非常理想，完全不用花時間及心思管理，又能創造穩定、安全的收入。


    喬在一九六九年為自己制定了標準，他存了七萬五千美元，用現在價值計算約二十二萬五千美元。以平均收益率8%計算，每年收入僅為兩萬美元。因爲他很省，這筆錢對他而言仍不少。但現今的利率低，若要維持每年兩萬美元收入，他的本金需要四倍（接近一百萬美元的魔術數字），才能維持財務獨立的水準。雖然喬的策略在現今環境可能不再適用，但了解它，對追求財務獨立仍相當有幫助。他的標準是：


    - 極度安全的本金保障。

    - 最大利息的收益保障（對“美國政府的充分信任”，其能保證本金和利息收入）。

    - 免繳州稅和地方稅。

    - 金融商品發行方不可提早贖回（大部分公債不可早日贖回）。

    - 絕對流通性，全球都可銷售，美國政府公債幾乎隨時可購買或出售，產品單純（只有一千美元、五千美元和一萬美元等單位面值的債券），只需極少的手續費。

    - 最便捷的方便性，直接由聯邦政府發行，大多數經紀商和許多銀行都能買賣。

    - 最低手續費：沒有中間商、沒有佣金，沒有額外收費。

    - 存續期有彈性：你可以買一張將在幾個月內就到期的債券，或者三百年才到期的債券。

    - 長期收入絕對穩定：對於財務獨立最理想的理財工具，比貨幣基金、出租房地產等波動大的投資穩定。

