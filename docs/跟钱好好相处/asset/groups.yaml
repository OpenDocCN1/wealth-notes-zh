    # 交叉點後的不安


    已經學會對自己的人生資產負責，有能力追蹤和評估進出你人生的金錢。你重新制定了自我滿足的標準，不再盲從廣告宣傳及同儕的期待。你找到自己的價值觀和人生目的，重新找回生命的方向及人生中最值得付出的事情，你的生活掌握在自己手上。


    但這樣的過程也可能令人不安。


    有一天，我接到一位有熱忱且具創造力的男子電話，多年來，他一步步邁向財務獨立的境界。「我做到了，我已經財務獨立了！」「恭喜！」我說，並且冷靜地談論他的成就。「你不明白！這樣讓我很恐慌！突如其來的自由，我該如何善用它？」連這個有創意的男子都這樣害怕，那其他人呢？


    事實上，我們發現許多人在他們到達「交叉點」之前，就撞上了一道陌生的焦慮牆，對於某些人來說，過度自由確實會陷入這樣的心態中。


    為了消除可能發生的後遺症，喬在財務獨立初期，還是利用週末的時間來完成他想做的「全職」工作。他想在退休後開著警車四處旅行，所以他用了多年積蓄，設計自己的警車，並前往新澤西州的一個州立野外公園度過週末。當他跨過財務獨立的交叉點時，喬已經想好要怎樣利用空閒時間。他認為，既然財務獨立運動正在風行，應該進一步推廣到各個年層，讓所有人都能體會財務自由的感覺。


    以下是部落格和網路言論版上的一些建議，以及我跟喬之間的對話。在財務自由的初期，你可能會太想往自己的志願前進而躁動，像糖果店裡好動的孩子；或者你還在找方向，生活會過得有點無聊。不過時間一久，你就會進入一個穩定的常態，不需要時鐘控制作息，你的內心會自動找到規律。


    無論在你面前的胡蘿蔔是什麼，你都想吃：旅行、睡覺、在海灘放空一週、參加政治活動、許多人的身體或心理會開始出現問題，這些問題已經日積月累很長一段時間，這不代表你做了一個錯誤的決定。身體的訊號在告訴你，你的身心都需要關注。


    四十歲、五十歲還是更年長，你的身心都需要關注。你可以學習演奏樂器、繪畫、練唱、舞蹈或釣魚，加入極限飛盤隊，迷上社區小型劇場，參加不同的會議；學習線上遊戲，讓自己的身處在最佳狀態；或是到餐廳端盤子。幫輔導問題想出一些驚人的解決方案，進一步發揮你的影響力，也許非營利組織會給你一個董事席位。


    # 你可以選擇想過的人生


    只要達到財務獨立，這些事情都任你挑選，如果你成為其中一員，你也許會忙到沒時間想以前工作的事。把工作及金錢的關係切開，真的可以找到自我發揮的可能性，讓生活再次動起來，實現心裡真正想做的事情。


    你的日子將會充滿色彩——即使你花時間在高爾夫推桿、清掃、做飯或散步。一件事接著一件事來，沒有壓力（除非你喜歡壓力），因為你投入心力用去做，沒有什麼是微不足道的，從冥想、摺疊衣服到對著一大群人演講。這就是經濟學家舒爾茨（Ela
    Schumpeter）所說的「豐盈（Plentiful）。


    你可以自由地為樂趣、為了回饋社會、為了靈感、願望或自我改造而工作。財務獨立計畫的


    # 步驟八的重點摘要


    核心精神，就是選擇，不是金錢，關乎你如何安排人生中最珍貴的資源：你的時間、生活焦點和人生。財務獨立之後，你可以過自己的日子，沒有公式可以依循，你有充分的自由投資自己的時間，就像建築大師富勒說的，「我們是未來的建築師，而不是未來的受害者！」


    每月用以下的公式，將你的資本總額、每月投資收益，記錄在你的逐月收支圖上：


    資本 × 長期利率 %／12（月） = 每月投資收入


    根據下一章中提供的方法開始投資時，記得在逐月收支圖上輸入每月投資的實際利息收入（若有額外節省下來的資金，用同樣的公式記錄下來）。在收支變得穩定之後，畫一條假想線，預估完成財務獨立的時間點，你將會了解，在那之前，還需要投注多少時間在工作上。


    # 談一談錢。關於錢的幾個問題


    傾聽別人的故事，可以得到啟發及靈感。解放自我不代表必須孤獨生活，藉由別人的幫助，可以讓妳更快達成財務獨立的四個目標：智慧、健全、獨立及互助互賴。借用本章結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。記得如果在反省時，都能不忘在最後加上「為什麼？」，這樣會讓妳有更深層的思考；如果都能不忘在最後多問一句：「社會如何看待我的答案？」則會讓思考層面更為廣泛。不論如何，這些問題，都沒有標準答案。


    - 對於清償債務，你有沒有一些獨特、瘋狂的想法？

    - 你希望留什麼給下一代？

    - 如果你現在不用為錢工作，會如何利用時間？

    - 若能一年不用工作，你會怎麼過？

    - 除了金錢以外，你能依靠哪些技能或是社團體協助你過生活？


    # 第9章 追求長期的財務自由—你的現金應該存放在哪裡？


    # 步驟九：為財務獨立所做的投資


    這個步驟將協助你成為一個知識豐富和成熟的投資人，從而維持長期穩定的收入，以保障長期的財務自由。


    這個章節將告訴大家，當你接近或突破了財務自由的交叉點後，應該把金錢放在哪裡。如果你從這裡才開始看這本書，想要馬上獲得一些理財技巧的話，請先回到第一頁，我們的目的是在教大家賺更多的錢。但如果你已經靠工作、繼承或經營事業，積累了足夠的金錢，甚或是成功的投資者，想要有更多自己的時間，過真正屬於自己的生活和真正屬於自己的生活，那麼這篇很適合你閱讀。


    # 幫自己添力量


    這本書最主要的目的之一，是讓你能夠找回控制自己人生的力量，以前你可能被金錢牽著走。上一章明確指出，你累積的資本，每月會幫你創造投資收入，如果做得好，就可以讓你不必為五斗米而工作。了解金錢真的能幫你之後，這篇將集中在如何運用投資工具，讓你的財富能持續增加，並用現有資本賺進更多錢，以豐富你的人生及社會。


    所謂投資，就是把錢投注在某個理財工具上，讓這個工具幫你賺更多的錢。達成財務獨立之後，有些人會選擇：


    - 投資保守的債券型產品（特別是借貸給大型機構，產生的穩定孳息）或是循環信用基金（Revolving Fed），抑或是將錢投注在開發中國家或是區域的投資市場上。

    - 你也可以將錢放在退休（IRC）帳戶或個人退休帳戶（IRA）中，或是透過券商買進指數股票型基金（Index-Track Fund）。


    股票在房地產上，自住或出租都可。


    你也可以投資生意，無論實合夥人或借貸。


    當然除此之外，還有不少其他投資方法，但風險都比較大，需要每天看顧，也有一些道德上的顧慮。當沖客靠頻繁交易賺錢（或虧錢），但這就是他們每天的工作。一些衍生性金融商品，把次級房貸打包起來再賣給投資人，雖然金融機構賺了錢，卻拖垮了美國經濟。你可以隨心所欲地投資你的資金。本章簡單介紹一些適合財務自由之後的理財、投資機會。但記得「投資」並不意味著你必須重新考慮進入「越多越好」的心態，更不是要學習如何在市場中殺進殺出。


    按照這個計畫的步驟：你將知道要足夠妥當安穩度過人生，這個投資計畫的最主要目的是確認你能有足夠的資金。透過這種知識含量高且成熟的投資，可以賺得基本生活所需。這樣做，當親戚想要報你投資明牌時，自己不用再擔心或是困惑。


    > ① 補註：ETF 是一種在證券交易所交易，提供投資人參與指數表現的指數基金。將指數證券化，投資人不必傳統方式直接進行一籃子證券之投資，而是透過持有表彰指數數據的證券權益的受益憑證來間接投資。在臺灣也有指數股票型基金的
    ETF。


    本節中提供的任何內容，都不是具體的投資建議，主要著眼在長期穩定地累積財富的方法。與本書其他部分一樣，這裡的想法，是基於個人經驗和財務獨立人士的策略，旨在提供指南、理財原則和教育。


    # 一些與投資相關的詞彙


    在這一章，我們會學到資本市場上的大小事，讓達成財務獨立的人了解運作，以根據資訊，做出穩健決定。


    以下是了解金融市場的一些重要詞彙。


    # 風險容忍度


    你對風險的容忍程度，是讓你晚上安穩睡覺、不會擔心必須回到職場賺錢的風險胃納量，從一塊錢都不願意賠的超保守投資人，到最積極願意承擔風險獲取最高報酬的積極型投資人。財務獨立課程其實不想讓大家變成後者，在達到財務獨立的交叉點之前，某些人可能會為更大的回報，承擔更多風險，但在交叉點之後，應該把風險降到最低，極大化你的被動收入，放在投資上的注意力越少越好。你的風險承受力，可能與年齡、性格、能力、生活經驗、生長的環境，以及從小到大培養的金錢觀以及對信用或借貸的觀念，有一定的相關。網路上有不少工具能協助你了解自己的風險容忍度。


    # 資產類型及多元資產配置


    標準類型的資產是：股票、固定收益（債券）、房地產、商品（礦物、化石原料、農作物）和外幣。通常當一個資產類別正在上漲時，另一個資產類別就可能下降，因此跨資產類別多樣化，是管理風險的一種方式。


    投資者通常會把錢投資在不同的基金、債券、股票、黃金等，達到資產多元化的目的。近年來，出現了不少新的投資工具：包括P2P借貸、貸款基金、股權眾籌和綠能源相關的投資機會。


    # 收入


    有五種方法可以獲得投資報酬：


    1. 利息：是指來自固定收益投資的定期支付，例如債券、票據、定存單或儲蓄帳戶。

    2. 股息：是將獲利的一部分分配給資產的持有者，包括：公司股票、共同基金、指數股票型基金或未上市公司。

    3. 資本利得：是指出售資產、房地產的所得，超出最初買進金額，所產生的收益（資本損失，則是處分所得低於最初投入的金額，你的被動收入會下降）。

    4. 租金收入：是將持有資產租借給別人的收入（必須扣除相關費用，如：稅金、保險、房貸及修繕）。

    5. 權利金：是指使用者付給智慧財產、天然資源、特許銷售權擁有人的費用。


    P2P 借貸在中國大陸也被稱為網路借貸，是指個體和個體之間透過網絡網路平台實現的直接借貸。個體包含自然人、法人及其他組織。


    股權眾籌指募資人透過平台集衆眾多個人投資者小額投資，以支持創業經營或其他社會事業的新型融資模式。公司出讓一定比例的股權，面向普通投資者，投資人透過出資入股公司，獲得收益。


    # 時間


    你的時間表現現在的情況如何？你人生還有二十年可以犯錯並改進，還是已經退休，需要金錢轉老一生？傳統的想法認為，你還年輕應該買多一點險，讓財富累積快一點；但隨著年齡增長，你轉向專注於保存穩定的收入。


    傳統想法認為，離退休還有幾十年的年輕人，應該投資九成的股票和一成的債券，因為他們可以禁得起景氣漲跌。更保守的投資者或者試圖保持財富穩定的人，比如即將退休的人，可能會選擇兩成的股票和八成的債券。但追求財務獨立的人應該比傳統更加保守，因為努力的目标是早日退出職場並保持高度信心。即使在市場下跌時，他們的投資所得仍然會高於支出。


    # 費用


    如果你進出市場的次數太多，也就是你買賣太過頻繁，其間產生的交易費用及資產管理費用，會侵蝕你的預期獲利。主動管理的共同基金需要支付管理費及手續費，在投資績效上的表現，精準度可能比射飛鏢好一點而已（但它們的表現常常不及射飛鏢！）。有些私人理財顧問服務會從你的投資資產總額中，收取一定比例的顧問費用，有些則是按鐘點費計價。對於追求財務獨立的人來說，最好的投資標的是指數型基金（Index
    funds）ⓑ，因為管理費低，近年的表現也不錯（但不是常常有這樣的表現）。


    # 理財顧問


    投資通常不容易只靠自己完成，除非你真的很在行。你可以聘請一名顧問來協助，或是從網路、路上尋找，問看看你委託下單的證券公司裡有沒有這樣的服務，他們可以藉由評估你的目標、風險承受能力、價值觀等，幫你建立一個投資組合。但必須確保，不會被不道德的經紀人引誘投資一些高管理費的商品。


    私人理財顧問與你的利益衝突比較少，可以協助確保一些投資該注意的基本事項，特別是一些投資專業工作，例如追蹤投資組合、依據市場狀況調整持股，及監督經濟大環境的變動，但記得，一定要貨比三家！


    **投資社會責任**


    如果你非常看重新社會價值，卻又擔心投資組合裡會包含與你價值相違背的公司，害你睡不著覺——這個問題不只困擾你。但幸運的是，市場上有一些投資組合已經把有道德爭議的公司篩掉◎，包括：高污染的企業、武器製造商、對兩性不平衡看待的公司等等。時間拉長來看，對社會良善的企業通常表現都比一般公司好。然而，因為這類的投資組合得對社會和環境深入研究，因此費用通常要稍高一些。對於追求財務獨立的人來說，在投資這類金融商品之前可以比較費用的差異，並衡量是否值得多花錢做這樣的投資，而這些投資標的是否真的有遵守社會、環境及公司治理的價值。


    協助我投資友善自然企業的顧問，對於社會責任投資（SRI），給了一個不錯且簡要的解釋：


    期许金錢使用能與自我價值觀結合，是財務獨立計畫的核心，因此社會責任投資是必要的考量。沒人能擺脫在財務選擇時（收入、支出、儲蓄和投資）可能產生的道德影響。在金融世界裡，沒有東西是絕對無瑕、完全乾淨的，但我們可以盡最大努力讓投資損害最小、效果最好。


    在越戰後的近五十年來，投資者已經逐漸退出打造戰爭機器的行業，社會責任投資的規模，已經成長至二十三兆美元。在美國，專業管理資金中，有兩成二投注在社會責任投資。


    簡而言之，所謂社會責任投資希望：


    - 避免負面影響

    - 追求積極貢獻

    - 影響你投資企業的決策


    怎麼做？社會責任投資利用對社會和環境影響的研究，避免投資中帶有令人反感或不負責任的政策和做法，為社群、社會和環境帶來積極改變，社會責任投資還倡導股東行動主義，旨在讓公司負責任並改善行為，同時促進在地產業發展，如此，就能創造發展中國家的經濟機會。今天，不少社會責任投資的基金經理人，已經將環境、社會和公司治理（ESG）等因素，加入其投資組合的考量中。


    金融世界開始了解，環境和社會與資源相關的議題，已經對企業獲利產生影響。在實用主義的推動下，投資人開始走向更綠色的行業，爭取長期回報。例如，企業在煤炭和石油上的開發，在可見的未來，很難有好的利潤回報，投資人嚴重質疑未來數十年石化公司的永續生存能力。雖然氣候變遷爭議仍未有定論，但保險公司和軍方已經將氣候變遷納入其對未來的預測中。


    早期外界以為，社會責任投資是藉著犧牲獲利而達成，但現在不是這樣子了！從一九九〇年代初開始，社會責任投資和公司治理企業的投資回報，已經趕上甚至超過了傳統產業的投資回報。不僅實質回報，社會責任投資也創造了所謂的「良知回報」（Conscious
    return），包括社會及環境資本。在氣候和政治穩定極不確定的時代，許多令人感到無力。


    社會責任投資就是用自己的雙手，帶領時代巨輪，走向未來的一種方式。


