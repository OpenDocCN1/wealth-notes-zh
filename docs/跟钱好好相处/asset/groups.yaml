    # 一談一談錢一團體的守則


    們陷入消費主義的金錢文化中時，我們真正需要的關係、尊重和保障可能會被扭曲，更會助長貪婪。因此，這種討論形式，與跟理財專員及銀行借貸債務談判非常不同。


    我們與金錢的關係，會影響到個人的想法、感受、態度、信仰及生活經驗，


    解決財務問題，不是談話會的真正目的，可能只是副產品。我們希望這個聚會，能探索你心


    理深處的渴望，透過公開的分享及討論，真正被發掘出來。


    試著用這樣的問題開頭：「請大家交換一下彼此的经验：你在最近六個月中，有沒有曾經買


    過一件衣服，但其實你根本不不需要它？「每個人都有意義的經驗，我跟你有保證。這是與金錢有關的


    問題，但不會太隱私，所以很適合試試水溫。當我第一次在一個工作坊的聚會中問這個問題


    很讓我吃驚。每個人都踴躍發言，我都没辦法插話，我大可直接離開現場，讓大家痛快地暢所欲言。


    你可以試著用這樣的方法，問問另一半或是室友；也可以把它貼在社群網站上，看看大家的反


    應；在跟同事吃飯時提出這個問題；甚至可以召集朋友到家裡或咖啡廳，舉辦一個談話會。


    找朋友一起談這個話題，比較容易引起共鳴，至少你會有了一個人願意分享經驗，這話題在你們之間，也許一個星期都停不了。它甚至可以成為結識新朋友和拓展鄰里關係的一種方式。


    關於錢這檔事，我們建議您使用以下的方法，更深人的對談。


    這些建議是根據「對話咖啡廳」（Conversations Over Coffee）網站中所建議的流程改編而來的，世界上非常多人已經開始用這個方法，開啟彼此的對話，門檻不高，可以讓討論更有意義，甚至討論一些國家大事都行。'
  - '[PAGE 345]


    以本書的主題來說，主要是討論我們與金錢的關係，這個關係可能很迷人也會讓人很疑惑。或許你會說，我正在遵循這些步驟，不一定要參加這樣的聚會，但是如果你願意參加，一定會加快你改變的進程，讓價值、儲蓄更有效率，讓你跟金錢的關係，可以重新跟你的價值及夢想對焦。放心胸，走進「別羞澀、勿責怪」的對話中，是改變你跟金錢關係的最佳途徑。


    # 誰來參加、在哪舉行


    任何願意坦誠、好奇、「別羞澀、勿責怪」精神參與對話的人，都是「談一談錢」社團的完美夥伴。你與他人的對話，可以發生在床邊、與家人的餐桌上、與朋友在咖啡廳或客廳，或者舉辦工作坊，或與學生在教室裡聊天。在一個可以讓大家放心、暢所欲言及不被干擾的地方進行，如果你與不認識的人在一起，以下的原則，應該可以確保大家能沒有障礙地暢所欲言。一旦你掌握了金錢會談的話題，你可以輕鬆應付不同情況，以下是三種比較可能發生的情境，建議如下：


    # 一、個人反思


    如果你有寫日記的習慣，應該知道寫作是一種探索發現的過程。你可以寫下自己覺得有關金錢最重要的問題，深吸一口氣，運用自己的智慧，盡量寫下自己的答案。至少花五分鐘的時間，暢所欲言，把想到的答案全部倒在紙上，你會很驚訝寫出來的東西。下一個問題也如法炮製，如果你願意，就一直持續下去。'
  - '[PAGE 346]


    # 二、兩人對話


    兩人對話是一個更私人的，甚至是親密的情況，或許與另一半、最好的朋友或青春期的小孩。你可以先從別的話題切入，再轉到有關金錢的問題，保持半分鐘的沉默，可以創造奇蹟，試著使用下面的原則。


    # 三、小團體（三至八人）


    參加人數最好不要超過八人，確保每個人都有足夠的時間表達自己。如果更多人參與，你可以分成兩組。參加者可能會以爲越多人在一起比較好，但我保證，人少一點真的比較好講話。


    盡一切可能讓每個人都發言，並讓談話保持活潑、有趣，讓大家都有安全感。你可以讓大家不受干擾地先講一輪，一個人一、兩分鐘；結束前，再讓每個人有一兩分鐘講講心得，有沒有可以帶回去分享的經驗。


    如果在座有人可以發揮類似主持人的角色，幫助小組從閒聊轉到正題，那當然可以多多用。主持人要讓對話熱絡，記得在開場及結束前保留十到十五分鐘，做開場及結語。主持人也要參與對話，不應該在旁邊放砲或隔岸觀火。讓大家保持好奇，願意交換問題，保持開放的心胸及態度，不要讓話題失控。若兩個人參與，最好能有半小時以上的討論時間，參與人越多，時間當然是越長。'
  - '[PAGE 347]


    # 公約


    「別羞慬、勿責怪」：不論是對自己或他人，盡可能不要價值判斷。這並不意味著每個人必須口是心非，表達意見時必須對不同觀點保持開放態度。


    保密度：不要對外透露對話內容。


    投入：按時到達，留到最後，分享時要保持專心。


    簡單扼要：講實話和不膚淺，發言簡單扼要，讓每個人都有時間發言。


    不要有商業行為：別在這推銷東西、長篇大論、好為人師。我們不是來聲別人上課的，是來這邊認識自己、彼此及這個世界。


    # 主題


    開放式的問題或建議，從每個人都有經驗切入，是開啟對話最好的方法。善用本書每章末尾的問題，嘗試提出自己的問題。很多問題，都有提到「為什麼？」，千萬別害怕提出「為什麼？」，這是一個更深入理解並解決問題的好方法。


    丟一些追問式問題，例如：「可以分享更多一點嗎？」或「是什麼讓你這樣想？」，但提出追問時，你的口氣很重要。因為同樣是「為什麼你會這樣想？」的問題，可能有時聽起來很有趣，有時就會令人感覺被指責。由於社會塑造了我們關於金錢的想法、感受和行為，你可以試著問問：「大環境對你的想法產生怎樣的影響？」讓對話的觀照面更寬廣。


    事實上，你的話題可以很簡單：金錢、工作、人生意義、目的、生活中的優先順序、簡約、'
  - '[PAGE 348]


    雜事、債務、借貸、貸款、繳稅、稅收、保險等等。接著，可以問問以下三個問題：「對此有何看法？」、「對此有何感想？」、「怎麼處理？」


    以這種方式提出問題，可以讓每個人都有切入點。有些人是思想家，有些人是感覺派，有些人很務實，每個人都需要一扇門，才能進入坦誠的對話，不需擔心別人的反應，更不用怕被攻擊。最後，一場暢所欲言的對談就會在愉快中結束。


    讓我們敞開心胸談話吧！


    文化，字面意思有崇拜的意思，如果你持續讓自己保持沉默，拒絕與金錢重建關係，我們就會沉浸在抱怨、羞愧的思想中，永遠陷入「越多越好」、「永遠不夠」、「貪婪是好事」、「誰在死前得到最多的東西就是贏家」這種心態中。


    我們可以加速改變的旅程，藉由敞開心胸談金錢與人生（三姑六婆式的八卦或是跟朋友倒垃圾），就能大幅改變被主流文化牽著鼻子走的窘境。不僅如此，還可以給彼此一個很棒的禮物：讓自己從恐懼、疑惑及盲目的監牢裡走出來，用本書每一章節後面的問題，重新打造自己的生活。改變，就從對話開始。'
