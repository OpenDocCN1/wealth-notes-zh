    你若選擇購買不買手機、單門號的資費方案，就買二手機來使用，前一年的旗艦機款，隔年價格都會調降好幾百美元，你不需要買最新機種，一個功能齊全的智慧型手機，不要一百美元就能買到了。如果手機是必備品，那就把昂貴的家中電話解約。電視及電影這些娛樂花資怎麼辦？你可以停掉昂貴的有線電視或是衛星電視，改用無線電視（OTA）服務或是在線上收看串流服務，只要用天線就能接收到電視節目，品質比有線電視及衛星電視都好，而且完全免費。其實網絡上有不少免費的串流影片，如果你選擇付費收看電影或其他視頻內容，記得最符合你需求的，而且一家就好；線上音樂服務的消費原則也跟電視電影一樣。


    雖然花錢訂閱新聞服務、支持新聞產業，在這個社會中非常重要，但也要注意花費，特別是在非常多的資訊都可以透過不同的來源免費取得。如果以印刷品來說，現在公共圖書館的資源比三十年前要豐富很多，可供借閱的書籍，不論種類或方便性都比以前好很多，大部分的圖書館都有數位內容的服務，供人下載電子書或者是有聲書。這些都是免費的，已經由納稅人的稅金支付了。


