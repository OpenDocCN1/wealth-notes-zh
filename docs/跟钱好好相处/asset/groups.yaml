    # 問題一：在使用生命活力的同時， 生命是否因此得到等量的充實、滿足？


    這個問題可以用來評估自己的消費型態，在檢視各個支岀類別的同時，要思考這個問題。


    如果這個項目的消費能帶給你充實富足的感覺，請在第一欄的位置上，加註＋號（或是一個向上的箭頭）；假如這個支出沒有為你帶來充實及富足，請在欄目內註明－號（減號，或是一個向下的箭頭）；如果覺得不痛不癢，請在欄目上註明○。


    這簡單的練習將讓你了解，生活中哪些花費是沒經思考的，或是哪些消費已經成為習慣，如此你花錢的方向，與夢想的方向就會背道而馳。你可能也因此會知道你消費模式中的弱點，剛開始可能會很生氣地捍衛自己的花錢模式，例如：「我就是愛買鞋嘛！每一雙都有不同的用處！」「反正都是我的錢呀！」「我就是愛讀書呀，每天下班回家的途中，都會在書店停留一下。如果買來都不看呢？也許有一天我會拿起來看……」「我真的很喜歡拼布，雖然我現在沒有任何作品，但如果我收集到足夠的樣式，我就會完成。好啦……好啦……十來年我什麼也沒做出來，但是因為我都沒有找到各式各不同的花樣呀。」「如果我有了……」


    如此以往，我們常常自圓其說、自我催眠、說服自己，養成亂買不必要東西的習慣，但除了你，沒有人能讓你戒掉這個習慣。事實上，也沒有人會聽你這些理由，因為我們這個計畫要求的是自己誠實，而這通常在你自己一個人獨處時才會出現。久而久之，你為了犒賞自己而去買那些可有可無東西的時間就會越來越少，以前在你眼中的寶藏就會變成傻瓜才要的獎品。


