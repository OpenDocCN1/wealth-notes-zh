    Measuring Well-being* (Paris: OECD Publishing, 2015), http://dx.doi.org/10.1787/how''''s-life-015
    en.

    ¹⁵ 參見：B. Cheng, M. Kan, G. Levanton, and R. L. Ray, *Job Satisfaction: 2015 Edition:
    A Lot More Jobs—Little More Satisfaction* (The Conference Board, 2015), https://www.conference-board.org/publications/publicationdetail.cfm?publicationId=3022&centerId=4;
    https://www.conference-board.org/press/pressdetail.cfm?pressId=6800.

