    # 談一談錢。關於錢的幾個問題


    社會支持是改變行爲的重要關鍵，會督促你向前，讓你覺得受激勵。借用本章結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。記得如果在反省時，都能不忘在最後加上「為什麼？」，這樣會讓你有更深入的思考，如果都能不忘在最後多問一句：「社會如何看待我的答案？」，則會讓思考層面更為廣泛。不論如何，這些問題，都沒有標準答案。


    - 你需要多少錢才會感到快樂？

    - 什麼東西或是誰，能協助你改善與金錢的關係？

    - 如果你知道你的朋友、老闆或是陌生人所有得有多少，你的看法會有哪些改變？

    - 什麼東西能夠驅使你存錢？

    - 什麼東西能夠協助你存錢？


    # 第6章 用省錢的方法圓夢


    在英語的世界裡，找不出適當的詞彙描述到達滿足曲線頂端時的那種境界，那種豐盈、沒有多餘的狀況：在這種狀態中，我們能清楚地管控所有資源（時間、金錢、財產），同時又能讓精神層面（創造力、智慧及愛）向外擴展。很遺憾，並沒有準確的語詞形容這樣的狀況。


    在英語世界中，「滿足」或「足夠」（enough）這個字，沒有進行式語態，也很難解釋在完成財務獨立計畫後，那種節約式的富足境界。「簡約」（simple）或「極簡」（minimal）這兩個名詞，只描述了沒有多餘事物的狀況，比較靠近「節約」（frugal）甚至是「隱忍」（ascetic）的概念。條理分明（clearly），這個詞，又比較強調技術面，著重在外在物質上，沒有描繪到內心深層抽象的層次：時間、財富或豐足。


    另外一個字「簡約」（efficiency），比較適合用來描述「功能」，適用在解譯二十世紀大蕭條時期我們的祖父祖母過的日子。但是什麼時候，簡約生活已經從美國主流社會中消失？「簡約」曾是傳統美國社會的精神指標，也是美國重要的文化及個性的代表，在希臘羅馬時代，蘇格拉底及柏拉圖都曾視之為「黃金信條」。舊約聖經曾經寫道：「使我不窮也不富，只供給我所需要的飲食」。食；耶穌基督也曾教誥我們：「你們不能又事奉神，又事奉瑪門（瑪門是財利的意思）」，強調簡單的物質生活有助於精神生活的富足。


    美國歷史著名的人物（富蘭克林、文學家梭羅、愛默生及詩人佛洛斯特）及團體（亞米胥人、貴格教派、哈特教派、門諾會）都強調簡約這個美德的重要性，並強調如若施行這樣的生活方式，會更接近天堂。但挑戰在於，要讓美國成為簡約的國家，需要大多數國民都身體力行。事實上，今天能過富裕的生活，是因為我們的先輩幾世紀以來厲行簡約生活的成果。就像前面章節提到的，「多才是好」的消費文化，是在近幾十年才形成的潮流。我們的立國精神是簡約，現在是必須回到簡約生活並確實執行的時候了。現在仔細看看簡約這個概念，是不是達成富足生活的關鍵？


    ## 簡約生活帶來的樂趣


    如果你查字典找一下簡約的定義，會發現：「在使用金錢及動用資源時，以經濟的方式進行。」乍聽起來很對，這定義強調簡約是一種外在表現的行為，不帶一點色彩，但卻不見達到財務獨立的人體會到的那股優雅、自在及豐富的感覺。如果深入一點去看，你會發現簡約這個英文字，是由拉丁文的字根frug-（意思是「美德」）、-us（意思是價值及成果）及-e（意指享受及使用）衍生出來。


    現在知道了吧！簡約的真義是一種美德，透過善用每一分鐘的生命資產，讓它活出最好的價值，不只有趣，還是一個脫胎換骨的歷程。簡約意味著享受當下擁有的，如果你已經有十件衣服但是仍感覺沒衣服可穿，你可能就是購物狂，因為你的喜樂不是從「使用」物品得來，而是從「獲得」中而來。


    - 編註：亞米胥人是基督新再洗禮派教門諾會中的一個信徒分支，以拒絕汽車及電力等現代設施，過著簡樸的生活而聞名。

    - 參見：The American Heritage Dictionary of the English Language, Fifth Edition (New
    York: Houghton Mifflin, 2016).


    取〕而來。但如果你有十件衣服，多年來在不同場合把它們穿在身上，那你就 是在過簡約的生活。 所謂的浪費，指的並不是你擁有物品的多寡，而在於你沒有好好享用物品帶給你的價值。你是否能
    成功過簡約生活，關鍵不在於省錢，而是在於你有沒有好好利用並享受現有的物質生活。


    什麼？簡約是享受物質的生活？這不是物質主義嗎？崇尚簡約的人，不是應該反對物質主義 嗎？其實不盡然，就看你以哪個角度觀察。對於物質主義來說，世界上的一切就應該被使用，甚至
    應該把資源用盡。崇尚物質主義的人通常用他擁有的物品判斷自己存在的價值，或者是別人對他擁 有物品的看法來決定自己的價值，結果造就了一系列是多才好，東西永遠不夠〕的宿命。然而，崇尚簡約的人，會善用珍惜擁有的物品，從中找到生活的樂趣：一丛蒲公英、一束玫瑰花、一顆草莓或美味的一餐。物質主義者在享受鬆餅早餐時，會先嗑五個橘子下肚；簡約主義者會享受每一顆橘子，體會橘子的色彩及紋理，在剝開橘皮時，細聞散發出來的清香，觀察半透明的紋理，享受吸下去汁液滿嘴的滿足感，還不忘把橘子皮保留下來，當作下回烤麵包時的材料。簡約的真義就是讓「快樂vs.物質」的比例越調越高越好。如果你在善用每一樣東西時，能夠從中取得最大的快樂，這就是簡約。但如果你一定要先擁有十件物品，才能感受到快樂，那就是曲解了簡約生活的意義。西班牙語裡有一個詞叫arrogan，是指聰明地使用每一樣東西，陽光燦爛時趕快去沙灘，或是把剩菜剩飯變化為美味的一餐。


    讓生活上碰到的每一件事都充滿價值，享受所有美好的事物及時刻。簡單的一餐、一盒草莓或是一趟遊輪之旅，都能滿足身心，就是簡約生活的精髓。現在瀰漫在北美地區，越多越好，永遠不夠〕的這種心態，不只造成剩餘物資過多的現象，更失去好好享受周遭現有事物的機會。其實在北美地區，物質主義也是個誤用的詞，因為很多人追求的是征服、地位、成功、成就或是社會價值，他們誤以為這些是造物主所在乎的事。然而，一旦買了夢想新房、新車或是找到理想伴侶之後，我們往往停止享受這些事物帶來的美好，而是汲汲營營去追求更新的事物。


    另外一個簡約的真義是，我們誤以為享受一件事物一定要擁有它，其實重點在於「使用」，而非「擁有」。如果能享受一件事情帶來的好處，就已經做到「簡約」其實，許多人一生的快樂來自於你懂得使用某項事物，而非擁有它。所幸現代的世代對於擁有物品的依戀，已經比上一個世代減輕了不少。可能因為經濟能力比較差或是出租服務越來越普遍，許多分享概念的服務受到歡迎，從電影、有聲書到汽車，新世代開始質疑擁有一件事物的價值，並體會到分享經濟的好處。


    簡約，正是一種學習分享的過程，不必再細分東西是你的、我的還是他們的。「房子是一個人的城堡」，以前的價值觀常常把握有一間房，視為自主、獨立的象徵，後來又擴大為每個人最好都要有獨棟別墅，做自己的領主。如果我們想要一件東西（曾經擁有就希望未來一直擁有它），就希望把它囤在屬於我們的世界裡。但我們卻沒想到，其實外面的世界也是「我」的一部分，並不屬於敵人或對手。簡約生活就是安於目前已經足夠的狀態，把多餘的東西讓給其他無法享受的人。這是簡約概念在實際生活及道德層面上都非常適用的原因。


    分享資源意味著花用更少，也可以把產品及服務擴及更多人，從割草機、汽車到客房，所有用不到、剩餘的事物，都可以藉由分享讓更多人使用。分享管道很多，可以透過二手店、線上拍賣網站或地方性的交換市集。這樣地球資源可以不必過度開發，也可節省能源，廢棄物當然也會相對比較少，流放到海洋中的塑膠垃圾、堆放在回收處場域的垃圾以及排放的廢氣，都可以減少。把你家中多餘的東西整理一下，割草機或是手推車，轉貼到網路上看有沒有人需要，也可以賣一點錢，免費贈送给鄰居（或許對方還會送你手工麵包或是幫你餵一下小狗作為答謝）也不錯。分享，會讓「施」與「受」雙方的生活更加豐富多彩。


    分享除了會讓心情變好之外，對於鄰里間的交流也很有幫助。透過每天或定期的互惠及協助，會有更多願意聆聽的好朋友，社區會變成你最重要的資產。身爲社區的一分子，你會有歸屬感，需要幫忙時也找得到人協助。簡約生活並不是要一個人獨居或變成獨行俠自給自足，融入社群之後，你會發現給予比擁有帶來更多的快樂及幸福。


    事實上，財務獨立計畫的目的，就是希望你能扭轉以前「多即是好」的心態，改為「足夠最好」知足常樂的生活方式。簡約生活就是豐足人生的平衡點。


    簡約生活讓你能從周邊生活環境中，找到最大的幸福及快樂。


    簡約就是一種正確使用資源的生活方式，不論是你的金錢、時間、能源、空間或是財產，都能得到最充分的利用。這個境界就像和煦的陽光一樣，不會太熱、不會太冷，沒有東西被浪費或被晾在一旁，剛剛好爲我們所用。就像一部乾淨的機器，俐落、完美、簡單及優雅。這一切全落在於那個充滿魔力的字眼上——「豐足」，滿足曲線的最頂端，人生最豐足、學習能力最強、最願意付出的那個點上。


    我想提醒大家一點，雖然我們想了很多辦法省錢，但絕對不是希望大家過窮苦的生活，或是變成小氣鬼。


    我們的目標是創造一種簡約的生活，從每一分花出去的人生資產中得到最大的滿足。你知道我們是用錢爲單位計算生命活力，如果你把錢花在用不到或是沒有辦法帶給你滿足的事物上，就是一項不聰明的做法。


    還記得我們在第二章提到的算式嗎？如果你現在四十歲，你的生命活力大概只剩下三十五萬 六千五百三十二個小時，看起來不少，但在你生命告終之前，這些時間非常珍貴，善加利用，將來才不會後悔。選擇要把時間花在朝九晚五的全職工作上賺錢，還是創造另外一種形式的財富，例如：友情、人際網路或是其他技能，是一輩子的選擇。我要強調的是，創造性的簡約生活是自我肯定的一種方式，一方面肯定你創造了的基本物質生活，同時也聰明地使用現有的資源，適度地消費，最後成就自尊、自重的人生。


    ## 步驟六：衡量你的生命活力——把花用減到最低


    在這個步驟中，主要探討的是如何聰明使用你的生命活力，同時，讓花用降到最低。


    把這個章節想成是一個選擇清單，找到你真正感興趣、真正對你有啟發的想法，把其他東西放一邊。每個人都適用，但並不是每一項都適合你，選擇的結果，也許是靠直覺，但问问你自己為何選擇某些概念？又為何拋棄某些想法？可能有些想法從小就已經深植心中，有些則是文化迷思，有些更不經意透露出你隱藏在心中的價值。


    記得一件事，這些概念提供一個改變的機會，並不是非做不可。簡約生活必須樂在其中，不是要你當個苦行鬼。


    ## 停止討好別人


    停止這種無意義、無效又浪費時間及金錢的舉動，因為別人也在用盡全力討好你，根本會忽略你也在討好他這件事。一九九九年，美國人托斯丹·范伯倫（Thorstein
    Veblen）出了《有關階級論》（The Theory of the Leisure Class），雖然沒有造成轟動，但其提出的「炫耀性消費」（conspicuous
    consumption）概念，卻點出深植在美國文化中的心態。在這本書的前言中，社會評論家劄斯（Suvvir Crago）這樣說：


    衣食無缺的人們，不管是現代社會，或是更早以前的時代，都沒有好好利用社會提供的多餘資源。他們沒有利用這些資源去擴展人生、增加生活智慧，或讓生活過得更精彩，或修練自己變得更有幫助。他們往往把金錢、時間、力量及資源，用來塑造形象或討好別人，要讓別人以為自己是有的人，膨脹自我，殊不知這些努力往往沒有效用。


    炫耀性消費是跨文化及人類社會的反常行為，你不一定要隨之起舞。社群媒體發達也助長炫耀自我的風氣，跟別人比較的潮流越來越盛。因為朋友可能會常常在社群媒體上張貼自己到異國度假的照片，或是到高檔餐廳的美食照，買了新玩具也不忘上網炫耀一下。但如果你能做到不跟風，也許就可以為自己省下幾萬甚至幾百萬的花費。如果真的忍不住要拿東西跟別人比一比，不妨把你省錢的撇步昭告天下，或是把露營時看到的大自然美景貼在社群媒體上，勝過別人在高檔度假村的炫耀。


    - 編註：托斯丹·范伯倫，又譯為托斯丹·凡勃倫，生於美國威斯康辛州卡托，挪威裔美國人，經濟學家，被推崇為制度經濟學的創始者。著名作品為《有關階級論》及《企業理論》。

    - 參見：Thorstein Veblen, The Theory of the Leisure Class (New York: Modern Library,
    1934), xiv.


    ## 十六省錢之道


    ### 1. 不要去逛街


    如果你不去逛街，就不會花錢，當然如果生活中真的有需要，還是得到店裡買東西，但千萬別為了逛街而逛街。道理太簡單，如果你不移動到店裡，就沒機會掏錢買東西。不僅如此，現在隨時可利用電話購物，不出幾天或是幾小時，貨品就會出現在你家門口。就算你不常上網物網站買東西，在你上網的時候，一些廣告也會形影不離，你的登錄、短訊、電子郵件，充滿各式各樣「相關性高」的商品訊息，誘惑你花錢。這種新型態的廣告內容跟你的使用習價牢牢相繫。如果你聰明地使用它，有時確實會買到划算的必需品，但千萬小心，如果一疏忽，可能你人沒去賣場，但卻花掉一大筆錢，買了一堆你用不著的東西。在真實的世界裡，二〇一四年曾有一項調查指出，七成五的美國人承認若進了大賣場，會因為衝動而買下原本沒有計畫消費的東西。


    一時的興奮是衝動消費最大的原因，男人在喝醉時容易亂買，女人則是在無聊及傷心時容易敗家，但兩者在生氣的時候都很容易衝動消費。超過一半的人表示，在拿到帳單時心中滿是後悔。買的人得負最大的責任！你在網絡上瀏覽的時候，你的興趣及嗜好都被追蹤，不論是搜尋引擎、社群媒體或廣告主，都會透過演算法及人工智慧推薦你有興趣的產品，刺激你衝動消費的欲望，類似「一鍵購買」（one-click
    order），更容易讓人敗家。


    為何逛街成為美國人打發時間的最佳手段之一？原因不只是對產品及服務的需求而已，逛街是為了填補我們內心無數的渴望。這種填補無效居多，要不然我們不會一直想逛街：工作完成後的獎賞、對抗憂鬱的心情、提振自尊、強化自我認知、身分地位象徵，或是遛小孩；而逛大賣場的話，既可以交朋友也可以打發時間。


    消費對美國人來說實在是最愛的活動，全國都染上了這個毛病，是物質濫用的來源之一。怎麼辦？千萬不要把逛街當作獎賞，或是放鬆、娛樂的場所，減少你與誘惑接觸的機會，標記廠商的促銷資訊，利用電子郵件的篩選功能丟進垃圾郵件中，上網時小心辨認一下，哪些廣告是特別針對你的上網習性推送。碰到彈出視窗，馬上關閉，有助於分辨其他隱藏性的廣告。更重要的，是要堅守非必要性商品不買的原則，訓練你的簡約生活心志，就像訓練肌肉一樣。久而久之，那些針對你而來的廣告，就再不能動搖你的心性，不只省下很多錢，你的理智及靈魂都因此而更強壯。


    - 參見：Martin Merzer, “Survey: 3 in 4 Americans Make Impulse Purchases,” Creditcards.com,
    November 23, 2014, http://www.creditcards.com/Credit-Card-News/impulse-Purchase-Survey.php.


    ### 2. 在你的能力範圍內過活


    這個概念对于一些讀者來說，可能已經有點過時。只買那些你付得起的東西，避免舉債消費，除非你有把握在短時間內能還得出錢，同時不會動用到緊急零用金。這個概念其實在幾個世紀之前、在信用還沒有被濫用之前，是一個時髦的做法。你的生活有正反兩面，光彩的一面，是你要的東西可以馬上拿到；陰暗的一面是你得為它付出代價，包含利息。借錢買東西，不論是汽車、房產或是假期，結果往往是必須付出三倍以上
    的價格。


    到夏威夷度假兩週可能要辛苦工作四個月來交換，值得嗎？你不是一定要把信用卡剪掉，但要暫時應付全家的基本開銷，但區分什麼是真正需要，什麼是為了滿足慾望，就變得非常重要，你的能力消費的主要目的在於，你還沒有足夠的現金，必須將自己的負債水位降低越低越好，依自己的能力消費。

