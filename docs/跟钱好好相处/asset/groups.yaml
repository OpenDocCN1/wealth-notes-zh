  - '[PAGE 158]


    運用內在量尺測量自己的滿足感是財務自主計畫很重要的一部分。我們必須學習，在不受廣告及其他商業手段影響的狀態下做成財務決定，並評估是否對生活事業有幫助，也不要因為把生命活力花在無法帶來幸福感的事務上，而感到羞愧。


    在第七章曾深入談到妮娜的故事，在執行這項計畫前，她說自己對口袋裡的鈔票幾乎沒有控制的能力。「我走進店裡，鈔票就一張一張地從包包裡飛了出去！這不是形容詞，是真實的感覺，我就是阻止不了！」


    財務自主計畫就是希望一旦出現這樣無意識的消費，有能力地大聲說「我不要」。記錄每月的收支狀況，在不同的類別旁邊註記＋或○，在註記過程中，也許有時是出於直覺，有些則有明確的理由，不過長此以往，財務「肌力」就會越來越強健，就能對無意識消費說不。過程時，舊習慣可能有時會悄上身，你可能會自責或想要放棄，此時切記我們一再重申的原則：「別覺得丟臉，也不要亂責怪自己。」


    # 問題二：使用生命活力時，是否跟自己的價值及人生目的 consistent？


    這個問題頗有啟發性，在自問的過程中，你會開始檢視你的行為是否有與目標方向一致。就像第一個問題，依照你的收支表逐项問自己：「使用生命活力時，有沒有跟你自己的價值及人生目的
    consistent？」如果這項花費確實與自己的價值及人生目的 consistent，就在第二個欄位中，註記一個十號'
  - '[PAGE 159]


    # 第一部分：價值是什麼？


    （或向上的箭頭），如果沒有，就記上一號（向下的箭頭），如果沒有差異，就記記〇。


    艾美及吉姆在執行財務自主計畫時，有一套非常明確的自我目標及價值；同樣的魏恩及凱西也很清楚；藍登則認為，在檢視問題一二時，確實對財務及夢想之整合有所幫助。相對地，有很多人雖然物質生活很不錯，但卻沒有自我價值的中心思想。


    許多富二代或家業繼承人充滿迷失及困惑，但表面上，他們的生活及打扮都非常光鮮亮麗。一般人在完成所謂的「美國夢」之後，也會開始質疑，在物質生活滿足後，下一階段應該要追尋什麼？如何生活？你自己呢？你的價值及對生命的意義，有清楚的方向嗎？或者你的方向及價值已經與生活方式脫節？或讓生活品質埋葬在並不適合自己的生活方式中？


    所謂的價值是我們重視的原則及特質。講求真理是一種原則，誠實則是一種真實活出自己的特質，活出價值讓我們心理能夠安頓。價值也是一種想法及信念，根據這些想法及信念，我們做出判斷及決策。價值像一種道德的基因，我們據此決定什麼是對的，什麼是錯的，反映我們最真實的想法及行事的動機。最終，我們認為的價值會展現在外在行為上（父母有時不願面對這個事實，總是對著孩子大叫：「照我的話做，別學我的樣子！」）。


    當我們為下一代提供住所、食物及衣物，或如何當父母及表達最自然的愛，都是根據我們的價值來選擇。不管是到公園散步消磨時光，或是回到辦公室，我們的抉擇都是價值的表現。你可能會說：「上班是被迫得做的事，不是基於價值的選擇，是為滿足基本需求。」但別忘了，是你先決定了怎麼過生活，花多少錢，然後才決定要上班賺多少錢。你的價值決定了如何對家庭盡責；你的'
  - '[PAGE 160]


    價值也決定你如何在意老闆的評價。你的行為就是你內在價值的具體展現，如何度過自己的人生，如何花用金錢，都反映了你是誰。


    這本書是有關於生命中最重要的價值：在我們的一生中如何處理金錢。檢視一下你每月的收支表：兩百五十美元（或是以時薪十美元計算，一十五小時的生命活力，見第三章），外出吃一頓美食，反映了你生命中什麼樣的價值？如何衡量價值，也反映在其他生活大小事中：你如何衡量「便利」的價值？你享受美食上所花的時間及資源，反映了哪種價值？與三五百好友閒話家常，又反映了哪些價值？花十二小時做慈善公益？花十五小時的生命活力在手機帳單，又各凸顯了什麼價值？


    有些花費你可能覺得心安理得，有些則值得商榷，一頓大餐用掉二十五小時的生命活力，看來似乎還不會太過分，但你有沒有想到，你這週可能才花八小時陪小孩。把資源花在大餐也許比聽音樂會或逛博物館有道理，但你可能忘了曾經說過，藝術讓人生得到不少樂趣。對很多人來說，消費所帶來的價值，往往不是他們的人生想要追尋的，你的帳本最能反映你的習慣、有沒有生活在同儕壓力及貧乏中。


    現在趕快再翻到這篇的開頭，檢視一開始提到的這些問題，如果你不為生活而工作，那你會如何打發或利用時間？在你的人生中，做過哪些令你驕傲的事？如果明年是人生中的最後一年，你計畫如何度過？你的人生價值就在這些答案中。你的每月收支表就像鏡子，當你每月在記錄收支時不斷問自己：「這些花費到底符不符合我的人生價值？」你會發現更深刻的自己。就算只是不斷問自己這些問題，改變就會發生，有些人多有些人少，但這都讓你更接近財務自主。最後，財務人生的各個面向就會與你的人生價值和諧一致。'
  - '[PAGE 161]


    # 第二部分：人生的目的是什麼？


    就傳統的標準來說，山缪日子過得非常不錯，但他對社會體系一直灌輸「如果你有好的物質生活（房子、車子及工作），就會得到富足」這件事，非常不滿及挫折。


    當他每天評估財務時，問題越來越清楚，他了解到他其實最應該做的事情是責難自己，幫助這個世界解決問題，而不該做一個冷眼旁觀的百萬富翁。


    於是他開始冒險地離開原本安穩的學校體系，開了一家顧問公司。


    最後，他跟一個協會創立了訓練課程，幫助大家找到自己的內在價值，鼓勵大家肩負起責任，為了社會貢獻出自己的心力。


    現在，他的內在價值與外在行為總算一致，找回屬於自己的快樂。


    第二部分的問題，希望能在你人生目標的大原則下，評估自己的花費。「目標」是你具體實現價值及夢想的目的地，但它的真義到底為何？目標是方向及時間的結果，根據自己的價值，現在的作為在未來收成，為了你自己及整體世界，做一些有意義的事。


    對於艾美及吉姆來說，建立一個充滿愛的家庭並享受自己的工作，就是他們的人生目的。


    對有些人來說，人生目標可能沒有這麼清楚，也沒有這麼聚焦，他們的行為沒法反映深層的期望。


    有些人每天一早起來，面對的就是沒有目標的空虛人生，花很多時間找寻生活的意義；但也有的人像鵝思路，老早就很確定自己的人生方向。


    人生中的目標到底是什麼樣的東西？目標可能很簡單（為了得到某些東西，所以我這樣作為）。


    當別人問起：你為何要這樣做？你在做什麼？你給的答案可能就是你的動機。「人生目標」不是光靠理性就能得到的產物，也沒法在短時間內做到，需要長時間的投入才能擁有。


