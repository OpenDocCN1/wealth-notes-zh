    瑪麗及唐恩兩人有相同的興趣（都喜歡音樂），職業也一樣（電腦程式），但如果你認為，彼此的收入及支出就要放在一起計畫，可能還要三思。固然從外表看，兩人很相近，但彼女的個性及行事風格，卻是在光譜的兩端。唐恩是在極端理性、保守及小心謹慎這端；瑪麗則是情緒化、喜愛冒險及不按牌理出牌。他們兩人連消費、花钱的模式的不一樣。除了音樂之外，其他的喜好也差異不小。在這樣的情況下，若硬是把兩人的收入放在一起計算，會看不到彼此生活的特性，失去月報表的意義。此外，他們兩人在參加課程之後，瑪麗就離開程式設計的工作，改當到府授課的全職鋼琴老師。她們的工作時間及收入，變得不穩定，因此兩人決定，為了彌補她貢獻變少的情況，她開始多做些家事及雜務。但這樣做法很難量化，因為做家事的貢獻，很難呈现在每月收支表上。他們越是想用這方法解決問題，緊張氣氛越是升高。為了要維繫婚姻的和諧及繼續進行財務自主的課程，他們決定分開計算收支。對於唐恩來說，這事很敏感；對瑪麗來說，這事充滿威脅，但她願意試試看。出乎瑪麗意料之外，分開計算收支之後，不僅情況轉好，她更感覺越來越獨立自主。結婚這幾年來，她在一些小地方太過依賴，獨立計算收支之後，瑪麗重拾在單身時期的獨立及生活能力。


