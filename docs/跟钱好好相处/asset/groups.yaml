    Barton Stace）的故事，他在宴會中向同場的一位女士問道：「小姐，我給你一百美元，你跟我上床睡一覺，好嗎？」她很震驚覺得被侮辱，接著，薌伯納又問：「那一千美元，好嗎？」她想了下，開始猶豫。可見，錢確實能讓行'
