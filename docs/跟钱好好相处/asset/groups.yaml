    以下過活。山姆每天用五小時從事垃圾回收，唐娜每週工作兩天當護士。


    生活是甜蜜的，他們也幾乎達標。但伊甸園的日子發生了一些狀況：兩個孩子的教育、健康保險、一輛快要報廢的老軋車及需要維修的房子，還有山姆想從父親手中買下回收垃圾業務的生意。在簡單的生活之下，他們陷入了典型的症狀：「每月入不敷出」、「未來會走到哪裡？」「的疑惑。住在伊甸園中，可能和郊區一樣，看來美好，但其實是一個陷阱。那時他們得知了財務獨立計畫，人生開始轉變，山姆雖然對垃圾回收頗有心得，但若將其視為後半輩子的事業，就好像不是這麼有吸引力。


    真正吸引山姆的，是在自己四英畝的土地上，自給自足過日子，做到自理財務的境界，並從事一些可以永續發展的農畜牧事業：幫助鄰居如何永續養牛、種小麥、飼料穀物如何正確組合和輪作，甚至擴及堪薩斯西部半乾旱草原的其他作物。


    山姆不僅期許自己做到，也希望能為更多人做這件事。他看到小農消失，故鄉的人口持續下降，平均年齡上升，他期望透過他自己當榜樣，可以帶動改變。他沉思著：年輕人可以到城市裡打拼十年，在財務獨立之後回到老家，過著自給農業和小鎮生活。也許他的小小努力不僅為家人創造美好的生活，也能為其他家庭，期待農村生活的美國人，創造美好的生活。於是，山姆在接下來的幾年，努力從垃圾處理的工作中賺錢，為自己未來的理想鋪路。實行財務獨立計畫四年之後，他到達了他的個人交叉點，他的投資收入與他的收入相符。他可以停止為金錢工作，並開始為夢想努力。'
  - '[PAGE 294]


    # 準備一個藏金室


    看著這個交叉點，你可能會想知道，在你的餘生中，靠著被動收入是否足夠保障生活無虞？因為，這是一段很長的時間。人生無常，有一些突如其來的事情，可能隨時攪進生活，以財務安全的觀點來看，我們需要第三個保障：你的藏金室（Cash），這些錢是在你主要儲蓄及急用金以外的錢。在西部长時期，Cash指的是拓荒者的秘密儲藏地，用來置放大重或現在用不到的物品。在財務獨立計畫中，你的藏金室是你的小金庫（主要儲蓄及急用金以外），用來儲備未來所需。


    隨著財務獨立的交叉點日漸接近，羅絲瑪莉越來越不自在，她習慣了工作，光想到要拋那個可靠的現金水龍頭，單憑債券收入過日子，就充滿恐懼。理性來看，她知道自己的債收收入足夠，但還是會不理性地擔心，萬一財務獨立計畫失敗，以後可能很難重返職場—也許我的心態就像表演空中飛人的特技師一樣，必須判斷何時應該放手，讓自已飛到高塔的另外一邊。」她想，雖然她的安全網（緩衝部位）已到位，但感覺非常遙遠。她決定把安全網拉近一些，並藉由建立藏金室來增加安全感。她放了好幾千美元在另一個銀行帳戶裡，當她自問「如果你在一年的把車弄壞了，患了重大疾病，或房子燒光了，怎麼辦？」時，心裡就踏實許多。


    但是如果你不再為收入工作，藏金室從哪裡來？大多數人會發現，離開職場後，支出會顯著下降，不需要通勤、治裝、午餐，其他相關花費'
  - '[PAGE 295]


    也會大量減少。因為交叉點是根據你的支用為基礎計算，所以當你的支出變少，投資收入在財務獨立之後會開始增加。另外，你財務獨立的習慣不會因不工作就結束，轉變過程中學到的東西將終生相伴。我們已經學會藉由小心、有意識和创造性的消費，降低你的開支，在積聚財富的過程中購買的東西（例如，耐用的汽車、露營裝備或是綠能的房子），永遠不需要更換。


    節約的生活仍然繼續，藏金室的準備也會日漸增加。尤其是你的稅賦一定降低，因為不工作之後，你的所得比上班時期少很多，這些都會豐富你的藏金室。最後，你可以再打些零工、做做兼職，讓藏金室水位提升。也許有些親朋好友會送來禮物，繼承親友的資產，搞不好可以找到另外一個你有興趣的新職業（從來沒有人說你不能重返工作崗位，對吧？）。


    藏金室最初的功用，可能是心理層面比較多。但久而久之，藏金室裡的儲備就會增多，你對生命中無常的擔憂就會減輕。如果你生活的主要用晶已經不堪使用，例如：汽車、自行車或牙套之類的東西，你就可以從藏金室中撥用。藏金室是一種流動的概念，不是一次性的打包，只出不進。主要儲蓄、急用金及藏金室是財務獨立的三大支柱。另外，世界上還有另外三個財富的重要支柱，地位可能比金錢更重要。


    # 大自然財富及財務依存


    如果你有個有錢的親戚，幫你張羅好吃衣住行大小事；一天他突然有感而發地說：「錢不是一切的題目，財務獨立的計畫之所以適合現在社會，就是因為有兩個重要的支柱：實質個人財務生活'
  - '[PAGE 296]


    的健全，以及充滿愛的人生。


    前者是有形的貨幣，有關金錢的交易及投資；後者是無形的貨幣，是人與人之間（或人與萬物之間），像家人般的施與受。國家貨幣是相對較新的發明，由銀行等金融機構控制，由個人無法控制的人員和機構分配；無形的貨幣，則是基於互惠產生的生物之間的交流，這是與其他生物體產生了互惠交換，生命要繼續，生物間就必須彼此相互幫助。


    越能相互支援編織彼此的生活，需要的有形貨幣就越少。你已經完成了第一至第七步驟，你了解一旦進入共享經濟的世界，花費雖少但心情愉快，無論是使用像圖書館這樣的公共服務，使用網路上的二手市集，或者自己動手做解決生活大小事，應該都能樂在其中。


    花費不多，不代表吝嗇，懂得節約，是因為你對於真正優質的生活更投入，也會用愛、分享、關心、接受身旁的人，不需要過多的物質。削減开支、開始存錢，並不是真正的目的，是自然的結果，這就是人生的無形貨幣，


    這種經濟活動，著重在建立彼此的關係，而非交易。是一種財務相互依存關係，我們能在社會上發展，憑藉的就是這種重要的財富，讓我們能共存共榮。很難證明它們的存在，但它們就像清潔的空氣會流入肺部，道路、橋梁和文明一樣存在於我們身邊。能在充滿愛且相互依賴的經濟中發揮的人，相信也能做到財務獨立，這就是真正的財富。跟你身旁的人相處，跟你願意投入自己的社群一起成長，就會更簡單。'
  - '[PAGE 297]


    # 自然財富的 ABC 三項支柱


    這裡的 A 是指能力（Ability），也就是每個人的智識能力；B 指的是歸屬感（Belonging），也是一同生活的人；C 指的是社群（Community），就是生活在其中的社會（在現實生活中甚至是在線上），你的鄰居、城市、環境和大自然。能力、歸屬感及社群，是自然財富存在的三種型態，在你追求財務獨立的過程中，你處理收支、存款的態度，應該與這三種財富平行發展。


    當你的人生不再需要虛假的實質（更多的消費、更好的物質生活及更多樣的物品）時，應把注意力放在這些真實的人生禮物上：朋友、家人、分享、關懷、學習、挑戰、親善、休息、陪伴、關係及尊重。換句話說，生活中最好的東西是免費的。像所有事情一樣自然，建立這種財富、需要時間、關注、耐心和互惠（即建立關係的贈與和接受）。在你追求財務獨立時，建立的這種實質財富，會讓你的自主人生來得更早、更持久、更快樂。


    # 能力


    能力是指自己動手技能：可以為你節省大量資金，甚至賺錢。前面的章節指出，當你知道請一個水電工到家修理水龍頭所花的金錢，會消費多少生命活力時，你自力更生的決心就會更強；而只要收
    viewing 線上視頻十五分鐘的時間拿來修理水龍頭，也就能省下一筆錢。只要你親自動手做好幾件事，你對自己動手的興趣就會提高，甚至開始尋找其他機會。你可以修好吸塵器（其實只是貓毛阻塞軟管），接著也能搞定汽車音響（只是一個電線鬆脫）；然後，循著使用說明，把車庫內壞掉的垃圾桶修好，也許之後就可以變身手做達人，可以打造露台或是室內裝潢。技巧成熟後，更能'
  - '[PAGE 298]


    協助他人或是賺一些錢。如果你在未来需要更多實質的金錢，就靠儲蓄、增強自己的實力，建立一系列實際上可以換得鈔票的技能。


    也許修理東西不是你的興趣，廚房才是你所愛，有感於到餐廳消費可能花費太多生命活力，因此開始學習廚藝。你和另一半可以一起修習烹飪課程，做飯成為你最喜歡的休閒形式之一。這僅代表用更少的錢就能取得食物提供營養，甚至你能發揮這種能力，透過幫人外燴、到餐廳當廚師或是提供私人料理，為自己賺進更多的金錢。


    攝影是一種愛好，一種藝術形式，甚至是工作，這些都可以融入成樂趣。修理自行車、油漆、建置網站、社群媒體行銷、會計等等，都可以為你節省開支，並凸顯你的價值。在累積財富過程中，如果是透過參加培訓取得新技能或認證，會比用投資賺錢來得更有意義。例如，透過培訓取得緊急醫療技術人員認證，你就可以變成一名具有專業的志工，不僅贏得尊敬，還可以為孩子提供更好的榜樣。


    就算財務獨立之後，你仍然是社會經濟體系的一部分，繼續充實自己的技能，也許當社會上有類似的 demanda，你又可以繼續開始賺錢。擁有多元的技能，是人生適應及復元能力的重要關鍵，無論外在金融環境發生什麼改變，你都能有蓬勃發展的活力。不斷磨練自己的技能，會給你的人生帶來籌碼、自由和選擇。多樣性的能力，就是人生財富的展現，無論是在挑戰自我、服務他人、貢獻社會、賺取金錢或是面對生活時，都會有很大的幫助。


    戴蒙循著傳統模式，完成了大學教育，進了一家公司工作直到退休。他想要穩定收入，但奴役式的制式生活，其實沒有吸引力，沒有安全感，但也難以擺脫。在一次偶然的機會中，'
  - '[PAGE 299]


    會下，他突然驚覺如果沒有錢，自己連基本的生活技能都不會，包括：食物、水、打理房子。於是他開始削減開支，計畫自己的新生活。退休之後，時間及金錢都比較寬裕，他進了一所荒野學院，學習如何靠自己的力量過日子，在荒野外打理自己的食物。他用實質的金錢，換取無形的財富，發現了社群、愛及幸福，在不缺錢的生活裡，找到了真正應該花錢的地方。


    為了愛與金錢，你可以學會做哪些事？什麼是你一直想要知道的東西，但從來沒想過自己真的能駕馭？你會設立一個目標致力做到它？當你還小的時候，最想做什麼？現在可以利用空檔時間學一下？或讓它成為下一個謀生工具？終生學習是通往幸福的關鍵，把時間投資在磨練技能、自我發展及幫助他人，人生永遠不會感到無聊。雖然從職場退休多年，若能繼續學習，就能保持清晰的頭腦和安全的社會地位。


    # 歸屬感


    若你需要幫忙時會去找誰？誰會真心聽你講話？生病時，誰會幫你送餐？高興時，你想找誰慶祝？人與人之間的情感及關愛，是陪我們度過無數個夜晚及人生的重要來源。通動、都市化及工作把我們的時間全都占走了，著名作家依斯勒
    (Nicole Estra) 提倡「關愛經濟學」 (care economy)，認為是這個忙碌社會所需要的。財務獨立計畫，就是翻轉無目的人生，就是關愛經濟學，不僅能讓你生活比較節省，更能在施與受之間讓生命更豐富。親戚可以教你修水龍頭，你再把學到的東西轉教朋友，朋友在你生病時，會煮雞湯幫你補充營養，這是一種叫歸屬感的貨幣。'
  - '[PAGE 300]


    曾經，教會和家庭就以這些互相支持的方式，將生活聯繫在一起。但現在越來越多的人是在這傳統的關係圈之外。四成的美國人認為他們屬於教會，實際上不到兩成的人定期上教堂，◎近來，蓋洛普的美國宗教調查中發現，宗教在我們的生活中越來越不受重視◎。美國人口普查局及教育和家庭統計處指出，在一九七〇年人口普查和二〇一〇年人口普查之間的四十年間，父母與兩個子女四人同住的比例，從四成下降到兩成，減少了一半；而單身家庭的數量從一九七〇年的一成七，增加到二〇一二年的近兩成八◎。


    年紀漸長的嬰兒潮，非常清楚他們的互助圈已經變小，在社會安全網正在減弱的同時，彼此之間的緊密關係也貧乏了。這的確發人深省也令人恐懼，但對於有些人來說反而是動力。關懷臨終的團體，一些銀髮團體及讀書會，正組織在地的關係社群。他們協助一些關係疏離的家庭，重新開啟彼此的對話。這當然不是一件容易的事，所以財務獨立計畫認為，歸屬感這樣的財富，一生都必須用心累積及經營，對於維持財務健康非常關鍵。


    你過去的關係有多少需要修復？你能透過修補關係找回彼此的關愛嗎？這不可能一蹴可及，大部分支援團體：包括戒酒或其他心靈康復計畫，都建議誠實地審視你的關係：你傷害過的人，你仍然不滿的人、需要和解的人。孤獨是現代人常見的問題，就經濟面來看非常昂貴。歸屬的貨幣具有自然和經濟利益：能夠分發和交換雜事、差事和需求，幫助節省每個人的時間和金錢。孤獨是很容易傳染的，就經濟上看，也是昂貴的。歸屬感，不僅是具體經濟上的資產，也是重要的無形財富，能夠協助彼此，處理生活中的大小事，節省每個人的時間和金錢。


    關係緊密的團體，總是會有人一起做晚餐；幫忙投機送錢，一起旅行，甚至介紹未來的工作機會，這被稱為「社會資本」。也就是說，透過互惠關係創造的財富。婚姻及親屬關係是建立歸屬


