    為改變。喬的重點是，錢是交易的工具，但它只有在交易對方認同其價值時，才會發揮功能，一想像一下，如果你的船在亞馬遜森林中翻了，那個地方充滿食人魚，你想你完了，但摸摸口袋，發現錢還不少，你慶幸這下得救了，接著，你看到兩個人划著船過來，你拿著一大把錢喊：「救救我！」但他們根本不認識錢，他們只想把你當作晚餐吃掉！


