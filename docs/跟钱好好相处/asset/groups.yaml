    一九五五年，美國零售業分析師賴鮑（Victor Lebow）觀察：


    > 在這個強調生產力的經濟體中，消費變成我們的生活習慣，我們把買東西及使用新產品，變成了一種儀式。在消費中，找到了精神上的滿足及自我滿足：……我們買東西、盡情使用它們、把它们用壞，然後去掉舊的，再買一個新的，這樣的循環越來越快。①


    也因為這個循環，我們就像滾輪中的老鼠一樣，為了買更多的奢侈品、有更多享樂的機會，得一直拚命做更多工作。今天，因為網路及手機的出現，消費的範圍又更大了，只要醒著隨時隨地都可以消費。產品從引起欲望到送達，只要敲一敲、滑一滑登陸，點擊一下就完成，以前只給少數特定人±的特權，變成大家都能享受的事情。這個做法為消費者的新身分，讓我們學會如何主張權利，消費已經發展出另一種不同的樣貌。


    # 血拼的權利


    美國人已經深信消費是我們的權利。不論有沒有使用及享樂的需求，只要有一錢就能買任何想要的東西，不管這些東西是否真正需要，也不會用到，或是能否帶來享受，反正這是個自由國家呀！如果沒有現金，那為何辦信用卡？當然拿出來刷呀！我們天生下來就是註定要血拼的！誰在死之前買到最多東西，就是人生的贏家。生活、自由及追求更多的物質，變成美國的象徵符號。


    ①參見：Victor Lebow，in *Journal of Retailing*，quoted in Vance Packard, *The Waste
    Makers* (New York: David McKay, 1960)，摘錄於 Alan Durning, “Asking How Much Is Enough,
    ” in Lester Brown, *State of the World 1991* (New York: W. W. Norton & Company,
    1991), 153.'
  - '[PAGE 60]


    尤有甚者，我們不只認為自己有與生俱來的權利消費，更以為消費可以讓美國強大。我們總是被灌輸，如果不繼續消費，很多人就會因此失去工作，失業率會升高，工廠關門，城鎮會失去經濟基礎。讓美國強大，就要繼續買東西。為何消費者信心指數會是美國經濟的重要指標？部分原因是如果少消費一點，或多存款，就變得不像美國人。現代經濟思維也鼓勵消費這件事。存款之外，我們怎麼花用自己的可支配所得？絕對不能把錢存起來，因為金錢不流動就會變成爛頭寸。而如果消費是使得經濟強大的手段，存款會讓同胞失去工作，那麼線上購物就應該是愛國的表現。


    唯一的缺點是消費會讓欲望不斷提升，超出我們所得範圍。本來以為是愛國心的展現，結果卻讓自己掉進債務泥淖。這讓美國人陷入進退維谷的困境，展現經濟愛國心的結果，竟然債務纏身，形成沒有贏家的局面。如果不消費好像不對，拼命血拼也不對。


    廣告加深了這個困境。平均每位十二至十一歲的美國小孩，每年收看兩萬五千則廣告1。以全球狀況來看，廣告市場超過五千億美元2，這些廣告加深了我們對商品的欲望。以前廣告只限於電視、印刷媒體及戶外观板，但在數位時代，廣告無所不在，隨著美國人使用手機的時間增加，跳出式廣告、多媒體廣告及側欄廣告不斷招手，提醒我們剛才用搜尋引擎看了哪些訊息，推薦我們線上購物的商品。行銷理論認為恐懼會引發需求，藉由訴求獨家限量產品，引發貪婪及罪惡感，或是滿足我們爭取認同的需求。廣告投放技術，配合市場研究及應用高超的心理学，讓消費者在情緒上失衡，進而說服我們要消除心中的不安全感，購買商品是最好的途徑。


    同時間，電視、電話、廣播、網路和報紙廣告正在傳播關於環境的壞消息。產品包裝堵塞了垃圾掩埋場。然而，大量製造生產是造成氣候變遷的因素之一，污染水源、砍伐亞馬遜森林、污染河川、水位降低。如果穿著傳統棉質衣服會促成大量使用殺蟲劑，穿化學纖維衣物會增加使用石化'
  - '[PAGE 61]


    原料，如果什麼衣服都不買那會讓人生業，做與不做都好像不對，消費者陷入父子騎驢的窘境。


    人類做的每件事，都會對環境造成衝擊，即使強調「友善環境」或是「天然永續」的產品，造成的影響也只是相對較少，找不到兩全其美的方案。


    我們每天早上上上班時，是不會想到這些事情，也沒想到「買還是不買」這個問題。但是實際，我們每天都會碰到困境，行使完消費這個權利之後，帶來的債務問題及環境傷害，就像玩俄羅斯轉盤一樣，逐漸成為嚴重的問題。「我一個人可以幹嘛呢？『我們常常自問之後，就回頭不管這個重要議題了，這樣日復一日，週而復始，长久拖延下去，浪費依舊，用拒絕承認事實逃避困難的抉擇。如果我們繼續這樣一點一點改變，只是會拖慢前進的速度，最終會走向逐漸萎縮及惡貫的未來。


    其實我們需要的不是一點一點「改變」，而是結構性的徹底「改造」。改變，是在同一個棘手的問題上找解決方法；改造，則是檢視困境，透過重新提問來找到新的曙光。我們必須從成長的思維裡走出來，接受永續的概念，這需要每一個人改造和金錢與物質世界的關係。重新評估生活中的消費及收入，會讓我們的人生、社會及地球重新回到正確的軌道。


    從過去的經驗學習，決定我們目前的生活方式，進而創造一個全新的、實用的金錢關係，揚棄过多的假設及迷思。與金錢及物質環境，建立一條全新的道路及規畫，這樣做才能真正能與時代。


    進。'
