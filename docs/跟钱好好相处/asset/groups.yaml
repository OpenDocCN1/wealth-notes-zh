    # 高配息公司債具吸引力


    ○○○二年，美國國庫券、債券的利率已下跌至一%以下的低點，現在仍然維持在低檔，但是沒人能準確知道這趨勢何時會轉變。若真的開始轉變，你可以再回到本節。如果你喜歡低風險的債券，不想只押一支債券，可以購買債券基金，這將在後面介紹。喬並不推薦公司債券，但是一些財務獨立的人認為，只要發行企業願意多配息，公司債也很具吸引力。


    就像美國財政部和機構債券一樣，公司債也是債務工具，利息按季度或每半年支付一次，並在到期時將本金退回。與政府債券一樣，它們有標準普爾或穆迪或其他評級機構的信用評等，通常債信等級要在BBB以上，才比較適宜投資。一些追求社會責任投資的投資人，也許還是對美國政府有充分信心，如果是這樣，可以試試美國機構債券而不是美國國債。機構債券曾把募集來的資金，支持你可能關心的特定部門（農民、學生、房主、小型企業），不像聯邦政府債券，以還款義務及軍事事為優先項目。


