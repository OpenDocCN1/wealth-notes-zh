    理財專家蘭西(Dora Rance)不斷呼籲大家,如果要跳脫債務陷阱,就趕快剪卡,讓信用卡消失在生活中。現在越來越流行的線上支付(paynow),借錢也很容易,在網路上就可以核貸,會讓人越貸越多。每當你在線上消費一次,就像液晶螢幕上的一個畫素一樣,不斷累積,我們花的不再只限於你賺到的錢,借貸消費代表你正在燃燒未來的資產。借錢已經變成美國人的生活方式,就是因為借錢,讓我們不得不跟工作緊緊綁在一起;也是因為借錢,讓我們得一直工作到死。為我們過往的歡樂,焚書繼墓地賣命;還有為那些可能永遠享受不到的奢華,付出自己的青春。


    譚雅曾形容自己的工作是「白天暴忙,晚上才能輕鬆一下」。她在家高科技軍火公司裡,擔任圖像設計的工作,同時也熱中投身教會各項活動。因為她身上背了兩萬六千美元的負債,讓她的人生好像沒有其他選擇,不斷有人跟她說沒有別的辦法,於是她對金錢的察覺就變弱了。但財務獨立計畫,像一面無情的鏡子,也拯救了她。


