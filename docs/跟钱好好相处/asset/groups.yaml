  - '[PAGE 215]


    美元。


    # 討價還價


    消費時你若付現，可以要求商家打折；買到瑕疵品也可要求折價；如果促銷期將在明天開始，或已經在昨天結束，你還是可以試著討價還價；如果看見特價品，千萬不要以為不能再打折，還是試試可否折價；如果你一再光顧同樣商品，也可試著要求打折。試試看每次消費時都喊喊價，如果你不試試看，永遠不知道能否搶到便宜。


    討價還價，長久以來就是一個不錯的傳統。標籤上的定價通常都是比較高，如果你買新車，不需要胡亂殺價，廠商的經營成本及優惠活動在網絡上查得到，你可以依此爭取到更優惠的價格。我每次買新車時，都會比較方圓一百英里的經銷商提供的價格，結果每一輛車的買入價都比定價再下幾個三到五折。


    例如，在一九七七年我看到一部二手的Suzuki露營車準備出售，因為我之前的經驗，知道這款車的價值及稀有性。我試駕時發現這輛車上坡有點吃力，還發出劈啪聲，但因為我對這款引擎還滿熟悉，知道該如何修好它；這部車好像有泡水過的跡象，一個門栓還有點問題，我當然不願用定價買有這麼多問題的車子回家。銷售人員問我，那你願意出多少錢？我第二次上門時，出了一個對折的價錢，銷售人員二話不說：「成交」。


    其實，不管你要買什麼東西，從五金行到衣服專櫃，都不妨殺殺價，反正不會有什麼損失。最近一個例子，是我為了健行活動得買一雙新跑鞋，在促銷花車上看到一雙跑鞋，上面標的定價是九十五美元，但沒說打折之後的價格，我問店員打折之後賣多少？「三十九．九九美元，」他'
