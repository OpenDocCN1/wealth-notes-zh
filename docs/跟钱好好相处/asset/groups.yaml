    第一，如果你還用傳統價格偏貴的電信合約，從現在起不要再續約。如果你跟家人用同一家電信公司的門號，也有很多省錢的方案可以選擇，你可能會發現，新方案所付出的成本，只有原來的四分之一，可以省下上千美元的費用。電信公司都有推預付卡服務，如果你不是重度用戶，這些'
