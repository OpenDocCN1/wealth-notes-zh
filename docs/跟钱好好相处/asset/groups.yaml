    透過第二個月的收支紀錄，你对自己的花費及有多少錢流進流出，應該已經有一個比較完整的概念。


    面對自己正步向債台高築的死胡同，練習剛開始的時候，可能會感覺很不舒服想放棄，你可能會對自己說，「這個小練習還不錯啦，但我已經知道我想到的東西了！」但如果你再堅持一個月，應該會發現支出將大幅減少。覺醒是一條長路，小小逃避一下，其實沒有人看得見，要秉持著「別羞愧，勿責難」的精神，繼續走下去。第三個月改變會更顯著，你會省更多錢。但你可能會開始鬆懈，因為過去幾個月你都照表操課地做到了，不論要給自己一點小鼓勵，或是想暫時忽視眼前'
