    （保險費用可能會增加，但你生病的機率是不是也下降？）在假日時，你還需要到旅館去舒壓嗎？旅遊支出會因此變動嗎？你會不會為了獎勵自己的辛勞，勤不動就浪擲金錢？工作占據了你大部分清醒的時間，那麼為了彌補自己，你會從事哪些花費？你現在可能無法準確地指出，若不為錢工作之後該做哪些事，也可能不知道自己應該怎麼過。你現在需要做的事，就是拿出每月收支表，檢視每項支出或收入，想想看，一旦不為錢工作，這些支出會怎麼改變。記得我們的約定：不要感覺慚愧，更不要抱怨。向自己提問，不是違背你對職涯或工作的承諾，更不是對公司或是長官不忠誠的表現，相反地，若能每月反求諸己，並好好檢視每項支出，會更增加對工作的滿意度。因為你知道這份工作是自己的選擇與決定。


