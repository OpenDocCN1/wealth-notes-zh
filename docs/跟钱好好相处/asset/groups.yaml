    # 前言


    # 關於這本書


    歡迎大家！不管你是千禧世代、X世代或是戰後嬰兒潮的高年級生，這本《跟錢好好相處》就是為你寫的。自從《跟錢好好相處》第一版（中文版書名為《富足人生：要錢還是要命》，曾於二〇二二年出版）上市以來，這本書已經成為我們這個時代的經典，曾經幫助過無數人改善他們與金錢的關係，裡面提到的概念及想法，歷久彌新。但是社會變動太快，我必須勤勞最佳團隊修整內容，以符合現代及未來的脈動和環境。


    當然，我們最關心的就是你的需求，你一定會想：這本書真的能幫到我嗎？真的可以協助我擺脫貸款、重燃摺置已久的夢想、買到心目中的房子或是離開不適合我的工作？或者讓我有足夠的錢支撐更多的消費，或是讓收入成長、豐厚存款，甚或擺脫每天為錢辛苦奔波的日子？


    可以的，相信我。


    確切一點說：相信你自己。


    如果你能善用本書提供的工具，改變就會發生，因為有非常多人藉由使用這些工具，已經改變自己。我在這裡做出以下承諾：


    +   - 你的消費會少很多，但生活過得更愉快。

    - 你會存下比想像中更多的錢。'
  - '[PAGE 24]


    +   。 你的債務會減輕，對不必要支出的抵抗能力會更好，也不必為了取悅一些你根本不喜歡的人，而產生無謂的花費（摘譯自羅伯特．奎倫（Robert Kiyosaki））。


    +   。 你會花更多時間在真正重要的事情上。


    +   。 你可以較不費力地了解自己。


    +   。 你會更自在坦然地面對自己的財務。


    +   。 不再責怪自己以前胡亂敗家的行爲，也會養成好習慣。


    +   。 開始為退休做準備，富足退休，可能比你想象的容易一些。


    +   。 你會開始為了自己的人生價值而活，而不是為了錢而庸庸碌碌。


    # 財務獨立，才能得到真正的自由


    重塑你跟金錢的關係及達成財務獨立（Financial Independence），是本書最重要的目的，希望藉由健全財務九大步驟，使最珍貴的資源——你的時間——得到自由，以便追求真正的幸福、自由及存在的意義。


    但改變與金錢的關係意義到底為何？答案不在於多賺或是少賺，重點是要釐清一件事：如果要過自己理想中的生活，到底多少錢才夠？同時希望大家擺脫被金錢左右的日了，在消費時訴諸理性。每個人都做得到。


    至於什麼是財務獨立？最基本的要求：如果達到財務獨立的境界，將不再為了賺錢而工作，除此之外，《跟錢好好相處》這本書將帶領你從僵固的思想解放出來，不再以為消費是達成幸福快'
  - '[PAGE 25]


    樂的最重要手段，更不會認為擁有的東西越多越好，你會發現，以往對待金錢的模式已經消失，如果你按照本書的步驟行事，債務也會一點一點減少，同時，儲蓄會越來越多，如果有超乎預期的額外支出，你也不再驚慌。儲蓄會變成你的好習慣，存款會越來越多，最後，到底要為熱情工作，還是為了金錢工作，選擇權就會回到你的手上。很多人都做到了，你也可以。


    隨著本書提出的計畫及步驟，你會發現自己其實不需要為了賺錢，把大部分的人生投注在工作上。朝九晚五的操勞，也許是社會上約定成俗的做法，但你會發現，人生其實可以有不同的道路，你可以回應內心的召喚及更美好的未來，從人生的高速公路駛下匝道，走自己的路。


    到底要怎麼做，才能不再為了金錢而工作？現在你可能還不知道，但依照本書建議，你會更清楚、更聚焦，當夢想出現時，會更有信心地迎向它。


    一位順利脫變的學員曾說，「這本書關心的，真的不只是金錢，而是整個人生。」


    # 這本書如何诞生的？


    首先介紹喬·杜明桂（Jo Domingus），他是財務獨立九大步驟的創始人，從小生長在紐約市的拉丁貧民區，由不會講英語的媽媽靠著政府的福利金一手拉拔長大。身材短小但很聰明，沒有精實的肌肉的他，用頭腦讓自己脫離了貧民窟的困難。為了活下去，喬練就了一身生存的本領，對於身旁的機會及威脅，有非常敏銳的觀察及想法，他的部分才能也貢獻在這本《跟錢好好相處》的內容。


    喬認為，資本主義的金錢體系很像社會福利制度及司法制度：我如何活出自己要的生活，不'
  - '[PAGE 26]


    被環境左右。他沒有大學學歷，但在華爾街找到工作，他遂做邊學，一直找機會突破現狀，在電腦主機比房間還大的一九六〇年代早期就研發出第一套技術分析工具。喬沒有把賺來的錢押注在資本市場，反而將研發所得賣給了一個投資銀行，因為他立誓要存錢，並在三十歲以前退休，離開充滿金錢遊戲的華爾街。讓自己過上真正的人生，而不是在工作的監牢中勞苦一生。


    我在一九七〇年代認識喬並開始合作，對於人生意的，我們彼此有相當高的共識：希望我們的世界能一點一點變得更好。在過去二十多年來，我們合作教學、寫作及演譯，彼此的差異往往成為下一個創新做法的養分。他個性內向，我外向；他長於系統性思考，我愛即興演出；他規畫大方向，我則向賽馬一樣，依照他的宏觀策略，盯著目標一直往前衝。


    我們共同的著作《跟錢好好相處》一夕爆紅，一上市就深受歡迎。喬在一九七一年初，因為癌症過世時，我們的事業正如日中天。《跟錢好好相處》一直屹立在《紐約時報》暢銷書排行榜上，更連續五年登上美國《商業週刊》的暢銷榜，我們相信，只要有夠多的願望使用我們的工具改善財務，我們擁有的一種種都會更長，進而足以改變這個世界」。


    喬過世之後，我繼續工作，讓這項運動保持充沛能量地前進。我與各界的意見領袖共同發起宣言，進行一場又一場的演講，以便分享永綻及簡單生活的想法，希望在場的有力人士及國際團體能夠幫忙呼籲。二〇一四年，我自己也被診斷出癌症擴散，我的賽馬被操壞了，雖然已經有無數的人感激我們的貢獻，但我跟喬的遠大目標還沒真正地落實。我退休了，移居到西北太平洋的一座小島上，島上只有一千位居民，我只能把精神集中在這一小片土地上，希望帶來一些改變。


    十二年後，我接到一通電話，當時我正在對一群人講有關金錢的事，在座的聽眾對於金錢都表達出擔憂及疑惑。一位生活優渥的八十歲老人擔憂自己在沒過世之前錢就花光了；一位事業有成'
  - '[PAGE 27]


    的中年人在同一職位上待了太久，很擔心自己會被迫離開；其中還有一些從事顧問業的聽眾承認在金錢這個議題上沒有辦法幫助客戶，因為自己也不太確定該如何做。最後，一位大三的學生提出了問題，她說，若要在專業領域中出頭，必須要有碩士及博士學位，但學貸就已經兩萬美金，如今跟這個領域沾上邊了，但她憂心之後靠學貸賺到的錢是否足夠償價。


    我中心熱情之火開始重燃，我們的社會為何會讓大家在這樣不穩定、不可靠及不受控制的環境下生活，我們的社會為何讓年輕人成為舉債產業（debt business）的獲利來源？我問聽眾有沒有看過《賺錢好好相處》這本書，回答：「是」的大部分都是灰髮的中年人，沒有一個在三十五歲以下。《賺錢好好相處》這本書已經協助一代代的讀者從金錢陷阱中掙脫出來，我想應該也可以讓這個年輕世代打破不斷消費的魔咒，在人生關鍵決策的時刻拉他們一把。


    因此，我開始找一些年輕世代談談，了解他們的情況及心態，我發現，財務獨立及提早退休確實不是少年輕人的想法，在許多朋友的鼓勵下，我決定重新編輯這本經典，把一些新時代的元素及環境加入這個更新版中。看過原始版本的讀者也不用擔心，因為更新版的核心脊幹觀念並沒有改變，之前深受大家歡迎的觀念，新版中仍然存在。


    # ## 時代一直在變


    新版讀者身處的時代，與香及我開始提倡財務獨立時已經很不同。經歷了二○年代的經濟大蕭條及二次世界大戰，為戰後嬰兒潮的父母提供了平穩且成長的環境。漸進式個人所得稅制度及美國軍人權利法案（GIB）①等政府施政，厚植了美國中產階級，社會凝聚力也逐漸增強。但在進入二十一世紀之後，職場及企業已然改變，退休金制度正逐漸步入死亡，退休已經成為年輕人


