    # 問題三：如果不是為錢工作，你的消費型態會有怎樣的改變？


    目前為止，我們已經檢視了消費模式，什麼樣的花費能獲得滿足及凸顯人生價值。問題三的目的，在於檢視工作在你人生中的地位，及如何聚焦工作以外的人生。先問自己一個問題：「如果你不工作的話，哪項支出會減少或消失？」在工作表支出項目旁的第三欄中，註記這可能的改變，如果支出會因不工作而減少，在欄位中加註一個－（或一個向下的箭頭）；假如沒有變動，就寫上○，如果你有辦法計算出增減的金額，也可在備註欄中註明。


