    responsibility 這個英文文字拆開來看，可以發現，責任這個字，是由「回應」（response）及「能力」（ability）這兩個字拼起來的。你因為有能力，才能回應別人的需求。當然，責任的第一步是為自己負責，停止自散，誠實面對，讓自己的生活、工作與人生的價值平行發展，定義屬於自己的「豐足」。就像愛因斯坦在一九五○年說的，最終你會生活在一個更寬廣的範圍裡：「人是『宇宙』整體的一部分，存在於時間、空間中，人...'
