    看到固網的帳單之後，會直接放棄申請家用電話；有些人在手機費率上可能不再用兩年綁約，直接在賣場或網路上買空機。


    把你的通訊費用細分為固網、手機及其他科技產品，你對自己的消費型態會更了解。也想通訊或科技支出中，有沒有因工作衍生出來的費用，或純粹是個人因素。


    # ## 娛樂


    到電影院看電影，已經不足以涵蓋你在影視上娛樂的花費了。在現在這個社會，我們可以透過各種不同的管道看電影，可能是家中的娛樂系統、手機、平板、個人電腦或其他裝置。如果你能把這些在娛樂上的費用再分細項，會讓自己看清楚在娛樂上面的消費模式。你真的需要這麼多線上娛樂嗎？線上音樂訂閱的支出？廠商希望你的家庭娛樂中心能升級，這不就像是裝修了房子，又去添購了新家具、重新粉刷一樣？升級之後，是不是所有的內容也要同步升級？


    你有加入俱樂部嗎？你曾為了幫小孩或大人辦派對而請藝人來表演？如果你有小 孩，你幫他們添購的科技產品，有多少是為了娛樂？或者是為了讓小孩不吵鬧？這樣應該算在育兒費用，還是娛樂費用？你是否要作「小孩支出」的分類？這樣可以讓你想想，除了給他們買科技產品之外，帶小孩有沒有其他比較傳統的方法，例如戶外活動？


    # ## 重新定義分類


    要讓這樣的記帳模式持續運作，有時你可以容忍自己的小罪惡，但千萬不要蒙著眼睛欺騙自己，盡量誠實地面對帳目及每月收支表。怎麼樣可以坦然面對？你一定要告訴自己，這樣做不是要'
  - '[PAGE 130]


    懲罰自己沒有照預算執行，這個計畫最重要的目的，是要坦誠接受自己。


    你可能會碰到不知該如何分類的情況，酒類支出應該算在食物？還是在娛樂？或者分類在藥物？區分出哪些支出是因為工作而衍生的，也是一個重要的措施。例如，在交通費用這個項目內，你必須要辨動費用與其他因工作而衍生的支出分開（Expenses）。如果你在工作時與遊玩時，使用同一部車，支出就必須根據每個用途的不同旅程分開計算。同樣地，如果你的手機也是工作及娛樂時都會使用，也必須根據使用時間分別計算費用。


    在記錄醫療支出時，你必須使用一些小分類，例如：生病、維持健康（為了維持健康生活費用的維他命、健身俱樂部的會員費，或每年的身體健康檢查）、醫療保險（你必須真誠看待這些支出，健康檢查是為保持健康，醫療支出則是你的治病費用）、處方藥的支出，跟非處方藥用藥的費用也有所不同。現在你應該能看出，為何這樣的記帳過程可以改變你與金錢的關係了吧！


    如果你有一大筆一次性的收支，這時更要仔細想想應該如何分類。這些「非常態性」的支出或收入包含：保險還本的收入、買冰箱、放到個人退休金帳戶（Mutual Retirement
    Account）的錢，或是房子的期末尾款（Balloon Payment）。如何歸類這樣的收支，其實沒有標準答案。對我們來說，幾乎每個月，都會有名目不一的非經常性支出（這個月有
    X、Y、Z 各種不同種類的項目需要付款……）。我們理解這樣的狀況一定會發生，也知道這就是人生的一部分，所以只要每月都這樣練習安排收支，就會越做越好，分類也會變得越來越容易，越來越有趣。


    這樣的記帳，是一個考驗你是否能真誠面對人生及擁有創造力的活動。你需要時刻刺激自己的創意，也需要考驗對自己的誠信，兩者通常一起發生，這樣做，比大部分的電動、電視節目都有趣。


    > 編註：分期付款方式中的最後一筆大額付款，其金額通常等於全部債務本金。'
  - '[PAGE 131]


    # 記錄收入，一樣仔細分類


    長此以往按照步驟行事，你不僅對歸類收支更有心得，對於未來收支的預測也會越來越準確。對於自己的消費模式也會更清晰，從內心產生的圖像越來越具體（而不是由外在勞力強迫改變）：獨特、深度滿足、順利，練習帶來的成長及改變，不是傳統記帳模式可以辦到的。你記錄的是錢的流進與流出，因此你對於收入也要有較細分類的記錄。必須細分薪資、獎金及小費、利息及股利收入，主要收入與打工賺的錢也要獨立計算。連在人行道上撿到的一塊錢，或是自動販賣機找的零錢，抑或是在賭場吃角子老虎上賺的錢，都要記帳。


    如果你是接案工作者，要把不同業主的酬勞分開記錄。例如：遛狗、雜工、當教練、家教、出租廚房。記得在進行這個練習時，你必須建立一個類別叫作「雜物拍賣」，次分類是網拍所得、擺攤所得、賣古董所得。你也可能有一個金額會逐漸成長的類別：投資所得（時間一久，金額應該會增加）。你或許也會有幾個月份有「非常規收入」出現，例如寫書的預付版稅，或者是叔叔留給你的七萬美元遺產，至於你寶寶的時薪，則是最重要、最穩定的收入來源。財務獨立計畫對此有一個不同的算法。


    在你利用記帳工具、檢視每個月的收入及建立分類項目之後，應該已經清楚你的消費模式。


    找一種自己最容易上手的做法，圖表3-1會讓你想知道如何建立這個記帳表格。表格中有幾項留白的地方，我們在稍後會告訴這些留白的用處。現在，只要把這些欄位空下來就好。'
  - '[PAGE 132]


