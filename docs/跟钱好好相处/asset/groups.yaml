    # 換工／分享


    不少研究結果顯示，融入社會是邁向幸福及簡約生活的重要道路，而最快速的方法就是分享你擁有的事物。前幾章提到的共乘汽車，不管是租或是借，都是很好的方式。近來社會上，對於社群分享的接受度已經越來越高。社區媽媽會輪流照顧小孩、「專長交換」或是提供「侍用」服務等，都是其中的例子。透過這樣的互助合作，社群網絡會更緊密。以「專長交換」來說，擅長剪髮的人，可以透過幫鄰居剪髮，交換照顧長輩或陪同看病的服務，或者是交換修電腦。盤點你會的技

    能，加上一點創意，就會讓分享創造雙贏的結果，你也會更融入社群。


    # 飲食


    不管多省，大部分人還是會花錢在吃這件事情上。一旦你開始記帳，應該就會發現飲食也是一筆不算少的開銷。花點時間在家做菜，可以招待朋友，又可以節省費用，比到外面打卡簽划算多了，也有益健康。如果你是有機食物愛好者，自家的花園種點菜，保證也會讓生活費下降，同時不用擔心吃下肚的東西。


    日常雜物也有省錢的方法，有些很簡單，有些則需要費點心思想。簡單的做法包括詳列清單、'
