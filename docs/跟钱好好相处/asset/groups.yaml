    # 推薦序 有財富不一定幸福，只有幸福才是真正的財富


    施昇輝


    投資理財類書籍一向是出版界的印鈔機，因為大家對怎麼透過投資來賺錢，不只是充滿了興趣，同時也充滿了焦慮。幾乎所有的書都圍繞著「財富」打轉，因為作者和讀者都認為只要賺到了錢，就會讓人生幸福美滿。但是，「擁有財富」真的能讓「幸福人生」畫上等號嗎？


    《跟錢好好相處》這本新版的首年經典，卻警告世人「如果你有無止境的欲望，就永遠不會幸福」。如果你一直追求賺更多的錢、買更多的東西，以及享受更豪華的生活，因為永不滿足，就不可能讓自己擁有幸福的感覺。這個觀點恰似當頭棒喝，讓讀者重新思考，該如何重建賺錢的關係？說穿了，就是「如果要過自己理想中的生活，到底多少錢才夠？」「賺錢的目的不是『累積財富』，而是『讓人生更美好』。你該為了自己的人生價值而活，而不是為了錢奔波辛苦。


    大多數人對金錢非常焦慮，是因為永遠擔心「不夠用」。不過，只要你在做任何消費之前，先問自己這是「需要」？還是「想要」？想清楚之後，其實就不會那麼焦慮了。例如，子女上體育課要買運動鞋，這是「需要」，但如果要買的是名牌貨，那就是一「想要」了。如果你買的都是前者，錢真的不需要那麼多。追求時尚的虛榮，錢一定不夠；但若只求實用，就不會一直為錢發愁。


    特別是在職場及企業生態已經開始改變、退休金制度正逐漸瓦解、退休已經成為奢望的今天，這本經典增加的全新篇幅就是要勸年輕人「必須及早為退休做準備」。台灣年輕人的心態已經從尚稱積極的「小確幸」，演變到有些消極的「厭世」，再到如今更無為的「佛系」，其實令人非常擔心。投資賺錢或許伴隨著風險，但簡約度日則是由自己完全掌控的。


    這本書關心的，真的不只是金錢，而是整個人生。因此書中雖有許多投資的正確觀念，卻鮮少觸及投資的技巧。太多時下的理財專家總愛把投資講得太過複雜，有些人因而望之卻步，直接放棄做任何投資，有些人則耗費了許多寶貴的時間和精力去學習，結果赫然發現在投資的路上，一分耕耘竟然很難有對等的一分收穫。


    人生有很多的夢想要實現，也很多的煩惱要解決；所以我在每本書中，都不斷呼籲大家應該用最簡單的投資方法來省下很多的時間和精力，去追求更有意義的夢想，以及在應對學業、事業、感情、婚姻、健康、教養子女、照顧父母等等的煩惱時，不要因為投資的焦慮而讓人生的壓力越來越大。


    很多人妄想靠投資致富，期望藉投資早日達成財務自由，但若因此患得患失，惶惶不可終日，或許不只沒賺到錢，甚至還會賠掉整個人生。人生真正值得羨慕的財富是「兼顧物質與心靈的美好生活」，而不是一「多到花不完的金錢」。


    （本文作者為理財暢銷作家）


    # 推薦序 錢不是目的，生活的姿態，才是目的


    Money isn''t about being rich, it''s about enriching your life.


    《跟錢好好相處》說，金錢是一種能量（energy）。這是你努力工作、用生命換來的能量，你既不能囤積，也不應浪費；你應買得「剛剛好」，活出「足夠滿足，而無其餘過剩」的姿態，並以這個姿態，擁抱使命，活出的有意義的人生，獲得「幸福」。


    「幸福」是什麼？幸福是自由、是快樂、是滿足感、成就感，和一種被人尊敬的一「感覺」。


    根據《跟錢好好相處》這本書裡的步驟，你能澄清渴望、堅定信念，找出生命使命和目標，活出「幸福」。


    錢不是目的，生活的姿態，才是目的。


    十年前，我的化妝台上，睫毛膏、腮紅、眼影、粉底液、鞋子、包包、耳環……很多東西沒用過幾次，堆在桌上，小山似的摞起來，歪歪斜斜；鞋櫃裡，鞋子跟包包發霉、變形，散落在牀底、鞋櫃、蒙上一層厚厚的灰；衣櫃裡，梅乾菜似的
    T 恤揉成一團，內衣掛在衣架上，把衣架壓彎。


    我以為自己沒有金錢問題。「哇……這東西又出粉紅色的？我都沒有粉紅色的……」我查找著腦袋垂在手機前，喃喃了幾句。「藍莓口味……嗯……」「我木然將物件滑進『購物車』，說：


    “我要買”。


    我不停地買、不停地買，直到一場火災，徹底改變了我的未來。


    十年前，我的家裡發生一場大火，所有能稱為“回憶”的東西，在那場大火裡燃燒殆盡。那一天空氣乾燥，雲層又薄又清，火苗蔓延，一路越過幾個鐵皮屋頂，最後炸成一團火球，火焰越來越高。


    那一刻，我剛生產完，全身虛脫，傷口還在流血。電視台直播火場，就在正中午，陽光正烈的時候。我仰頭看著螢幕，腦子一片空白。


    我以爲自己沒有金錢問題，一直沒有。可是遇到變故，我的口袋空空，我的家人也口袋空空：我無能為力，非常害怕，非常洩氣。


    在那之後，我決心改變，決定不再迴避問題。十年來，我實踐了《跟錢好好相處》的精神，每天記帳，每天檢查錢的流向，對自己所花的每一分錢，非常警醒。


    十年後，我有一個非常小的衣櫥、三只鍋子、六個盤子、四個包包、六件內褲；我有一塊光禿禿的粉色腮紅，兩管又圓又鈍的口紅，一只鎏金的玫瑰別針。我不再有梅乾菜似的T恤、不再有剩半罐的化妝水、不再有第二塊粉餅、第二條睫毛膏：我活成了《跟錢好好相處》裡的樣子，一“足夠滿足，而無其餘過剩”的姿態，活成了“幸福”。


    請跟我一起讀這本《跟錢好好相處》，請跟我一起幸福。讓金錢不再是刺進身體的匕首，讓金錢成為劃開世界的利刃，讓我們行動起來，實踐起來，貫徹到底。


    祝福你。


    （本文作者爲理財暢銷作家）

    李雅雯（十方）


    # 推薦序 認清自己想要的生活


    「我想要賺錢！」「我想要成為有錢人！」大部分的人心裡應該都會許這樣的願望吧？可是有沒有想過，真的成為有錢人後，你的錢要用來做什麼？你想過什麼樣的生活？沒有認真思考過過什麼樣的生活，卻只是埋頭苦幹地拚命賺錢，那麼就只能成為金錢的奴隸，失去生活的大意義。


    大部分理財書都直接告訴讀者如何賺錢，如何投資才會獲利最大。《跟錢好好相處》和其他書不同的地方，是先讓讀者認清自己想要的生活是什麼樣子，盤點自己的財務狀況和收入支出狀況，最後才是將自己的收入極大化。這就是《跟錢好好相處》這本書在出版了二十五年之後，仍是經典著作的根本原因。


    時代變遷很快，金錢賺取和花費的形式也一再改變。別以為一本二十五年前出版的理財書已經不合時宜，作者魯賓特別重新編輯、出版本書，以符合現代讀者的需求。


    如同金錢鬍子先生（Mr. Money Mustache）所說，這是一本人生指南及幸福人生說明書，想要幫助大家找到人生真正想要完成的事，戒掉長久以來的浪費習性。每天改變一點點，最後，改變的不只是財務狀況而已，是全部的你。


    對於不了解自己財務狀況、不知道自己真正想要什麼樣生活、不知如何理財的人，我極力推薦《跟錢好好相處》這本書，跟著書中的財務獨立九大步驟執行，徹底改變自己的金錢觀，利用所附的報表幫助了解自己的財務，有耐心地一步一步做，就能發揮本書的效果。


    （本文作者著有《筆記女王的手帳活用術》等暢銷書）

    阿慧筆記女王


    # 原文版序 一本人生指南及幸福人生說明書


    金錢鬍子先生


    閱讀任何有關於金錢的書籍，真正的原因大概只有一個：過更好的人生。然而鈔票不是你追尋的真正標的，即使成為億萬富翁，也不會願意孤單虛度一生。當然，這種極端的例子很容易做出選擇，但真實的情況是，金錢從來不是真正的核心問題所在。


    事實上，金錢只是快樂、健康人生的附屬品，在黑盒子裡生活一輩子的億萬富翁，當然不會是大家的想像。大部分人只想過輕鬆但有生產力的人生，永遠不用為錢煩惱。


    也是因為沒有搞清楚這一點，所以大部分書籍、雜誌、網站、電視節目、線上廣播在人生理財的這個議題上，都沒辦法直指核心。也因爲如此，儘管個人所得越來越高，但美國及一些已開發國家，負債水準都來到歷史高點，不少這些國家的居民瀕臨破產。我們似乎都只顧着追逐更多的金錢及想買更多的東西，忘了檢視更深層的問題：我們到底買了什麼，又為何一定要買這些東西。


    這也是《跟錢好好相處》這本書在出版了二十五年之後，仍爲經典著作的根本原因。它傳遞的訊息在社會中引起深刻的迴響，它標榜的理念産生跨越世代的影響，所以，我們只好把作者薇琪·魯賓從優閒的退休生活中拉出來，重新編輯推出了新的版本。


    魯賓獨特的敘事方法已經讓這本書成爲絕無僅有的經典，在新版我們仍然維持這樣的模式。不過因爲社會環境已經與當時狀況相當不同，我們也做了某些與時俱進的調整。


    # 追逐金錢，未必擁有幸福


    一般標準的理財建議比較溫和，認為每個人都有不同的價值觀，大家應該可以順著自己的想法消費，如果喜歡吃一頓上百美元的大餐或高級的房車就儘管去做，只要你的預算能負擔或是辛苦工作賺來的錢足夠買這些奢侈品，就儘管消費。


    但其實許多支出往往都不切實際：我們都是人，都有共通之處。經過了許多世紀文明發展及近幾十年來的各方研究已經發現，生活有一些與生俱來的「幸福按鈕」（happiness
    buttons），幾乎對每個人都一樣受用，例如：友情、健康、社群。靠自己力量贏得挑戰或是掌握自己的人生，也都是幸福感的要來源。


    然而，大部分人仍會陷入一些誘惑中，如：貪圖方便、地位及奢華，或是犒賞自己、滿足內心的渴望。我們很擅長合理化自己在一些雞肋小物上的敗家行為及衝動，不同的地方只是物品種類及數量多寡而已，就是因為這些昂貴的「衝動」，你可能把一生賺來的錢都用在上面了。有時，對這些事物的依戀會讓人失去尋求真正幸福的機會。


    某些知名理財專家常常倡導「消費得到真幸福」的觀念，按照他們的想法，你可能終其一生陷個人欲望的輪迴。就像站在行李輪迷帶一樣，熟練地拿起你要的東西，丟到輪迷帶的另一邊，你以為把願望清單中橫掉了一項，但其實根本還在原地沒動。無止境的欲望是人性的陷阱，如果你希望人生快步向前，無窮的欲望是第一件需要克服的障礙。這也是這本書不斷提醒大家的重點。


    我們也不斷強調，這真的不只是一本理財書。這本書其實是一本人生指南及幸福人生說明書，想要幫大家找到人生真正想要完成的事，同時戒掉長久以來的浪費習性。「訓練」大家不是我們的真正想做的，因為要讓新的做法落實，得要每天都做一點，涓滴成河。進程看來緩慢，但當你回頭看看以前的自己，會驚訝地發現：「我怎麼這麼糊塗，浪費這麼多寶貴的時間及資源？」


    最後，改變的不只是財務狀況而已，是全部的你。這是本書如此受歡迎的原因。如果再放大一點來看，這邊關係到整個世界及生活中的所有生物。我們總是認為，消費行為是自己的選擇，只要口袋裡有錢，垃圾桶中有空間裝廢物或回收品，就可以自由揮霍。但事實是，我們的消費對世界多多少少都帶來破壞，在一些看不見的角色發生，這些後果在幾十年的日積月累下逐漸出現。我們養成的生活習慣與周遭產生的衝突，已經成為地球環境的壓力來源。不過如果你能為了真正的幸福簡化自己的生活，破壞的程度將會大幅減輕，從簡單地改變本身的行為，就能為環境盡一份自己的力量。


    我可以肯定地說，如果真的熟讀這本書，在接下來的人生，你的財務狀況一定會產生重大的轉變，與金錢的關係一定能改善。不只體現在每月信用卡帳單及銀行帳戶裡，更重要的是尋求一切問題的根本——你的信仰及習慣，這就是本書的特殊魔力。


    如果你不曾看過這本書，也不知道這樣的方法，現在啟程吧！投入時間，認真踏上旅程，你的人生將全然轉變。


    （本文作者為彼得·安德尼（Peter Adeny），著名個人理財及提早退休部落格金錢翻子先生（MillMoneyMustache）主持人）


