    # 追求更新和更完善的職場生涯


    這世界上的工作，沒有一件是迷人的。在職場工作的人必須時時反省自己、冒險、實驗、挑戰舊想法，以便追求更新和更完善的職場生涯。他們必須把生命的價值放在工作價值之上，令人窒息的職場生涯，才能再獲得呼吸的空間。從童年的視角看生命，可以跳脫成年後一些虛假的掩飾。他們必須說服自己，認清全職工作的真正本質：賺錢。關於這點，市面上有不少優質的求職指南和部落格可以參考，但有一點要注意，正如劇作家巴納姆（D.
    Barnum）曾經說的：每分鐘都會有傻瓜誕生，找工作一定要張開眼睛，得像買車或買冰箱一樣精明。


    妮娜結束了十年婚姻，在開始進行財務自主計畫之前，這個單身母親獨自撫養四個孩子。她暫住在朋友的房子裡，以工換宿及三餐，之後她接觸到財務自主的錄影課程，開始記錄自己的開支。妮娜決心在財務上獨立，她在附近的汽車旅館，找到兼份的工作。她欣喜若狂地回家告訴室友，只是她忘了問老闆薪資怎麼算；幾個月後，妮娜搬到西雅圖，找到了新工作，老闆願意給她超過最低工資的待遇；幾週之內，透過職業介紹所，她又找到了一些零工的差事。


    妮娜立刻把她的逐月收支圖掛到牆上去，在幾個月內，她就還清了數千美元的債務。這樣的進展更激勵了她，她開始計算自己實際的每小時工資。不久，她的收入翻了一番，但她仍持續進步。她在醫院裡，找到一個主管行政助理的全職工作，每小時可以拿十七美美元。不僅如此，因為這個工作，她有了各項福利保障，她從來沒有做過這樣好'
  - '[PAGE 275]


    的工作。看著自己的四個孩子，她常想：當醫生真的很難嗎？她沒有放棄希望，牆上的逐月收支圖，一直提醒她不要忘记夢想。只要讓自己的生命活力花得有價值，就能早一天靠自己的能力站起來。


    一個週末，妮娜自願參加一個感興趣的研討會，在那個場合，員工抗議醫院的一項政策紛紛離場，只有妮娜留了下來。董事會被迫尋找新的主管接替工作，妮娜是他們的不二人選。到她退休時，她的年薪超過了四萬八千美元，這對於曾在旅館打掃房間的女僕妮娜來說，根本難以想像。因為所得已經超出逐月收支圖的範圍，她只好在上面加貼一張方格紙，收入早已超越當初設定的標準！（參見圖表7-1。）


    因為善於利用自己的生命活力，妮娜從一個拿基本工資的清潔工，變成醫院部門的主管，薪水變成原來的四倍。步驟七主要是告訴大家，就算在現實考量


