    果少了自我覺醒這層思考，我們往社會在果或口渴的時候，想要大吃大喝，其實只需要在陽光下走走。「正念飲食」是引導你如何真正品嘗食物，品嘗會讓身體了解吃下肚的東西，對身體到底是好處是壞。慢下來之後，我們才能了解，身體的需求到底滿足了沒？如果已經滿足，就不需要再吃了。這是一種由內而外的體悟，由我身體自發性地引導，而不是依照一個外在的標準，在「節食無效」（Diets
    Don''t Work）這本書中，作者舒瓦茲（Bob Schwarz）提供了四個準則，戒掉吃不不停的習慣：


    +   1. 當你飢餓時才吃東西

