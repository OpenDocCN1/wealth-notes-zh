    資俱樂部重點在於了解投資，而不是致富。我們把從俱樂部會議上獲得的見解和知識，應用到自己的投資中。


    下一個不讓你的資產流失的概念在於稅率。透過了解稅法及其細節之後，賴瑞指出：


    > 「我們有超過一半的投資部位是放在節稅的商品上，如：個人退休金帳戶，ESOP等。這樣做，讓我們賺來的錢，可以放在自己的口袋中。為此，我們保留一張電子表格，預測未來十年或更長時間的現金流量，讓我們既能節稅，又不會被罰款。如果真的遇到困難，我们也可以把罰款繳清，取得投資本金及所得。他們最後的藏金室，就是本書提到的核心價值：簡約生活，把日常支出壓到最低。結果他們的資產已經翻了三倍，賴瑞得以加入志工行列，有時能透過志願服務，有點車馬費的入帳；桃樂絲選擇她真正有興趣的兼職工作，不再只為了金錢。


    # 我的選擇：社會責任下的不同收入來源


    幸運的是，我在一九八一年到一九九七年買進了一些債券。我曾擁有一張債券，票面利率為一五％，最低的利率是八％。除了最後一筆，我的其他債券都到期了（我討厭看到它們走了），三十年轉眼來到，美國政府已經將錢全還給我，我用這些錢再次投資。利率在五％以下。千禧年之前，債券是我唯一的投資。


    二○○○年後，我開始依據信仰的價值，進行多元化的資產配置。雖然你我價值觀不完全相同，我仍希望自己的例子，能幫助你找到適合自己的投資標的。對我來說，開心和自由，是我想要'
  - '[PAGE 330]


    # 不動產


    的生活，因此我的投資必須與這個價值觀一致。我深知成長型的工業經濟會給環境帶來毒害、污染及氣候變化，因此，在過去三十年我一直設法終結北美地區過度消費的文化。我不是一個純粹主義者，不介意以錢養錢，但我會根據自己的價值觀來投資。


    我駕駛電動車，投資太陽能產業。我傾向買當地小農的產品，並投資在地農場，我致力於建立更多元化的在地經濟，並投資在地企業。我發現居住的社區開始老化，想要扭轉這一趨勢，所以我經常會與年輕人進行交易，把部分公寓租賣給他們。你選擇處理金錢的方式，反映了你這個人的種種。就像你選擇的每一樣事物，決定了你自己的樣貌，誰也逃不了。


    一九八六年，喬、我和一些朋友，以十三萬七千美元，在西雅圖買了一幢大房子。二十年來，我們的非營利組織及新藍圖基金會就在裡面辦公，一共有六位員工。我擁有房子的部分產權出售時，我已經充貴住了二十年，賣價也比當初買進時增加了兩倍。


    這種投資方式雖然意外（因為當時我們需要一個在西雅圖的穩定住所），但讓我對房地產投資留下了深刻的印象。如果我把我的持份分租出去，那麼我二十多年的租金收入，應該很簡單就超過七萬五千美元，這還不包含其他房間的租金收入。


    不僅如此，我還擁有一個七個房間的大房子：過去這麼多年來，這棟房子還供給前後後好幾十位員工辦公所需，讓我能能世界上最適合居住的地方生活：更好的是，我有一群好鄰居，在這個大房子裡熱烈討論不同的事情，從剪髮、健康一直談到徵稅。


    對我而言，這就是社會責任投資！'
  - '[PAGE 331]


    把這棟房子賣掉之後，我在惠德貝島（Whidbey Island）買了一棟房子，這也是一個值得分享的故事。賣掉西雅圖的房屋之後的現金，若放在銀行裡，最好的狀況也只有一%的利息，我考慮也許應該購買更多的國債，因為當時票面利率為三%。


    我的西雅圖房子是一個雙拼的物件，我想要找一個類似的房子，我自己住一邊，把另一邊租出去。一個下雪的冬日，我住的村莊纏繞在大雪中，我在網路上看到一個價格合理的房子，距離我租的公寓只有半英里。我穿上靴子，終於找到這個傳統物件：一個淺綠色、有三間臥室的房子，看起來非常高大，但很醜。繞了一圈，我发现了一個露台，爬上樓梯，在一扇落地的玻璃門外，看到貝克山（Mount
    Baker）、北方瀑布（North Cascade）和普吉特灣（Puget Sound）的美景。從屋內就可以看到這個海邊小鎮的絕美風景，我真的很心動了。但若要買下，在現金不足的情況下，必須申請房貸，但我一輩子的買賣都用現金交易，實在不想破壞這個規矩。


    這個房子，應該可以發揮生產的功用，而不是一個錢坑；它可以成為收入的來源，而不是吸金機；充實我的金庫，而不是掏空它。我覺得這是可能達成的目標，我可以將車庫租給木工，或租給其他人用來停放船或露營車，我也可以把一樓有衛浴的房間出租，讓租戶保有隱私。我的思緒像收銀機一樣，在雪地中跋涉回家的路上，想法不斷湧現。我精神抖擻，想好一定要砍掉至少五千美元的房價，並在腦中不斷排練，應該如何向仲介計價還價。


    後來，發生了兩件事。首先，我打電話給一位剛剛在這裡找到工作的朋友，詢問她是否想要租房子。「我可以跟你合買房子呀！」她回答。如果各出資一半，我們兩人就有能力以現金支付。其次，因為這棟房子已經掛賣了很長時間，銀行將價格降低了四萬美元，我們又撿到便宜。雖然房子有些問題需要維修，但仍然個值得入手的資產。買進之後，我的朋友把她的部分改建為'
  - '[PAGE 332]


    私人公寓：九年後，她必須回家照顧母親，所以我買下了她的持份，把車庫改成另一間一室公寓。


    以租金的水準來看，不論我這個房東或是房客，都頗為滿意。我己自己的房間，後院有一個大花園，有很充足的陽光，夏季我就把隔壁的客房，張貼在「airbnb」上（我們這城市觀光客不少），賺一點零用金。我算過，這樣每年投資回報約8%，在這個低利率時代，是一個不錯的回報。以後我老了，我可能會把房子變成「銀行」，把它反向抵押給銀行。若老了走不動，可以讓看護住在隔壁的房間裡就近照顧我。也可以以工換宿，每天照顧我幾小時，餵我吃飯、幫我洗身予及穿衣服。


    # 社會福利金


    社會福利金是第三個收入來源，我提早了兩年拿社福金，因為計算過以二十年的總額來看，早兩年拿社福金，比晚兩年拿划算。依賴社會保障，這樣真的能持久嗎？我雖然做了對的決定，買了這種房子，但手邊現金真的不夠，因為我跟一般嬰兒潮世代不同，沒有在企業或機構裡工作，因此沒有額外的退休金保障。幸運的是，這也與許多其他嬰兒潮世代不同，我有各種各樣的投資，因此不需依賴每個月微薄的社福支票。


    # 在地借貸（標會）


    除了債券、房地產和社會福利所得外，我的第四個收入來源是當地的地方借貸。「我信任我的社區」，對我而言，這句話不只是口號，而是我真正生活的方式。我找到了一種相對安全的方法，把錢借貸給社區朋友，收取利息。在我家鄉近社區中，一群有願景的人籌建了一個名為「10X」


    ● 編註：這是一個讓大家出租住宿民宿的網站，提供短期出租房產或房間的服務。'
  - '[PAGE 333]


    （當地投資機會網絡」的獨特網路，幫助需要現金的投資者、在地中小企業主、非營利組織、取得所需的現金，發展自己的計畫或商機。


    這個模式是請有現金需求的人把自己的計畫、商業模式、提案整理出來，交由組織管理者轉寄給群組中的其他人。任何感興趣的成員，都可以與提出計畫的人見面，溝通想法進行投資，不限任何金額及條件。由於社區和人際關係是我人生財富的核心，因此我組織了個小型、循環性的地方貸款基金，透過這筆基金，我已經為當地企業提供了近八萬美元的貸款。


    我要求五％的利息，或者是用一些實物折抵利息，如：貓砂、蔬菜、雞蛋等，這些都是在生產的。幾乎每個案子，跟我借錢的人都很感激，跟我成為朋友。只有當他們蓬勃發展時，我的社區才會成長，這一點非常重要。因為農村社區必須靠著不斷地投入，才能保持生機和繁榮。


    # 綠色能源


    當一群有心人開始在我們這個島上裝置太陽能板時，我馬上跟這家公司聯絡，表示也想跟進。因為政府推出獎勵措施，讓我可以把家中產出的電力銷售給其他需要的人，我創造了一個三嬴的機會：裝置太陽能發電設備，這是對能源自給自足的未来投資；三％的回報率，而且沒有風險；這家公司采用的是華盛頓州當地工廠生產的太陽能板，這樣也照顧了在地產業。


    我了解：要支持綠色能源及社會責任企業並不那麼簡單。因此，我聘請了一位專精這一領域的財務顧問。因為我沒有興趣積極管理自己的資金，花錢請他處理這部分的資金，其實是省算的。如果我自己花時間研究社會責任方面的投資（或至少不能對社會有害），可能因為壓力，造成我的健康負擔（我非常不樂見這樣的情況），所必須支出的費用，可能會超過支付給他的錢。'
  - '[PAGE 334]


    我的顧問非常理解我的投資理念。他自己也投入在地發展，在制定投資策略上，發揮了重要作用。此外，他用自己的投資公司自然投資（Natural Investments）選擇投資標的的想法及策略，也跟發行的很相近。因此，我決定拿出一些資金，投入風險比較高、但受到他認可的公司，買進這些公司善的高收益債券，我擁有兩家太陽能公司和一家咖啡合作社的股份。其餘的錢就投資在對社會友善的股票和債券基金。如果你也決定聘請理財顧問，請確保他或她不僅誠信度高，而且要具備與你相近的價值觀。


    # 副業


    就像很多財務獨立人士一樣，我也從「副業」中賺取了一些收入，貼補生活所需。這些微型工作很有創造性：從經營網路商店到在gogoup平台上銷售產品，跟以前客戶保持聯繫，兼做一些顧問或諮詢的工作，幫鄰居遛狗、寫部落格、當家教、在夏天兼差導遊，偶爾參加會議演講。在不破壞財務獨立的情況下，寫書是一件「大型」的副業，但因為書籍可以讓理念傳播速度快一點，也符合我認為生活應該多元的想法。


    # 檢查表：進行投資前檢查七件事


    +   1. 這項投資符合我的價值觀嗎？


    +   2. 這項投資是否符合我對風險的容忍度？


    +   3. 我的投資是否分散及多元？


    +   4. 是否能提供我當前和未來的收入？'
  - '[PAGE 335]


    +   5. 變現能力強嗎？若要處分可以輕易賣出嗎？


    +   6. 在買入或賣出時，會產生多少費用？會不會有處罰（如果有）？


    +   7. 這項投資會產生稅賦嗎？聯邦、州還是地方稅？（對於我的整體繳稅情況，會不會產生影響？）


    # 結論


    你必須構建一個符合自己思維和生活方式的投資組合，同時考量對風險的容忍度，以及對生活的創意及想法，只有你自己能做這個決定。


    你已經準備好把掌控金錢的主導權拿回來，決定自己的人生，你也準備好將成為一個有想法、有愛心及知識豐富的資源管理者。誠心希望你能將這些應用到自己的財務生活及人生當中，迎接生命及地球的挑戰。希望你能一路成功！


    # 步驟九的重點摘要


    建立可以創造長期收入的投資組合，並用心經營，讓它能穩定持續地供給長期生活的需求。'
  - '[PAGE 336]


    # 談一談錢。關於錢的幾個問題


    聽別人的建議，能讓自己的能量變得更強。用你的價值及所知，篩選進入腦中的資訊。於此同時，我們也已經了解如何透過投資，創造多元收入的方法。借用本章結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。記得如果在反省時，都能不忘在最後加上「為什麼？」，這樣會讓你有更深層的思考；如果都能不忘在最後多問一句：「社會如何看待我的答案？」，則會讓思考層面更為廣泛。不論如何，這些問題，都沒有標準答案。


    +   - 你現在有沒有為老年生活做準備？準備有哪些？

    - 在緊急的狀況下，你靠什麼賺取額外的所得？

    - 有沒有什麼你可以信賴的人或工具協助你做投資決策？

    - 過去在投資上有沒有經驗？你的希望是什麼？

    - 投資時，你的價值及信仰是什麼？

    - 你對金錢和生活的風險容忍度有多大？

    - 財務獨立對你的意義是什麼？'
