    # 第7章


    # 愛還是工作？善用你的生命活力——工作及收入


    在第六章中，我們討論了如何透過更有意識地消費，善用你的生命活力。本章將進一步探討如何善用時間，讓你的生命活力有更好的利用。如何讓你最珍貴的資產——生命活力，更有效的發揮？工作，對你的人生真的有助助嗎？


    有時候，我們為了釐清事情的真相，會探究一些想都不用想的事。本章我們要討論的是「工作」這件事。傳統的觀念認為，為了生活我們必須工作，但這種定義剝奪了我們的生活。有些人為了工作，忽略了生活中其他的層面；有些人在週間忍受工作，只能利用下班時間與週末放鬆；有些人好不容易得到遠距工作的機會，但似乎永遠沒有真正休息的時間；有些人在零工經濟的浪潮下，開始兼職人生，但做自己老闆的結果，就是只要醒著就得工作；有些人非常喜歡工作，真的在工作上有所成就，但是一腔熱血總是被公司決策、主管上司、投資人潑冷水。當工作等於賺錢時，工作就會越來越沒有意義。當生命活力沒有辦法凸顯時，就無力改變人生。'
  - '[PAGE 244]


    要解決這個困境，首先要想想心目中的「工作」是不是定義錯了？如何在上班或是下班時都能讓生活活力得到最棒的發揮？工作是不是正在摧毀（透支、破壞或浪費）你的人生？你真的想要善用你的人生嗎？在第二章中已經了解，生命活力是一項非常珍貴的資產，它非常稀有，過去了就沒有辦法重來。我們的選擇，決定了人生的意義。到目前為止，我們已經學到了如何讓消費、滿足感及價值觀，往同一個方向發展。現在，要把焦點放在如何把工作賺來的血汗錢發揮出它的極大值。


    # 工作到底是什麼？


    就像金錢一樣，我們對工作的定義，是從小到大，從父母、文化、媒體及生活經驗灌輸得來的。其中的很多想法、理念及感覺都相互矛盾。

    下面的描述，就是呈現我們對於工作概念的混亂。二十世紀的經濟學家舒馬克（E.F. Schumacher） 說，工作有三個重要目的：


    +   1. 提供生活所需。

    2. 讓我們的天賦能力可以發揮。

    3. 透過與他人合作，解放與生俱來的自我拒架。 ●


    已故的經濟學家席爾柏（Robert Thayer）這麼說：「工作應該被定義為，人們不想從事的事


    ●編註：德國統計學家，創立實行行動組織。


    ● 參見：E. F. Schumacher, Good Work (New York: Harper & Row, 1979), 3-4.'
  - '[PAGE 245]


    情；金錢則是為了彌補工作上帶來的不愉快的報酬。①


    作家特科爾（Studs Terkel）在著作《工作》（Working）中則提到：


    這本書提到的「工作」，就本質上來說，其實是一種對生理及心理的暴力行為；也是一種身心的潰瘍及創傷。就像是一場拳擊賽，讓人精神崩潰或瀕臨發瘋；也是一種每日必來的羞辱，每天帶著創傷從人群中走出來，能存活下來就是一種勝利……也是一種追尋，追尋每天存在的意義及每日三餐；追尋認同及現金；追尋生命刺激，但避免痛苦；簡單來說，希望能多一點人生，少一點朝九晚五、吃喝等死的無奈。②


    但二十世纪诗人纪伯伦（Kahlil Gibran）却说：「工作能让梦被看见。」


    到底什么是工作？是祝福还是诅咒？试验或胜利？就像重新定义金钱一样，我们来定义工作这件事，看看到底哪种说法才是比较真实的观点。


    # 工作的定义


    先来一下「工作」的历史，藉由回顾历史，可以找到创造自己人生故事的新机会。我们对工作的概念，从何而来？为何我们要工作？工作在我们人生中到底是什么地位？


    ①参见：Robert Theobald, *The Rapids of Change* (Indianapolis: Knowledge Systems,
    1987), 66.


    ②参见：Studs Terkel, *Working* (New York: Ballantine Books, 1985), xiii.


    ③参见：见 Kahlil Gibran, *The Prophet* (New York: Alfred A. Knopf, 1969), 28.'
  - '[PAGE 246]


    # 把每日工作時數減到最少


    身爲人類，我們都必須爲基本的生存做些工作。但多少才夠？許多不同的研究，從狩獵、採集文化到現代歷史，在成年人中一天約需要三個小時。《石器時代的經濟》（Stone
    Age Economics）的作者薩林斯發現，在西方影響改變日常生活之前，生活在喀拉哈里沙漠（Kalahari）的昆民（!Kung），每週需要兩到兩天半的時間狩獵，平均每週工作時間爲十五小時。女性收集食物的時間，每週大概也是這樣。女性一天的工作大概可以支撐家用三天的蔬果需求。不論男性和女性，每天都要工作兩天，然後休息兩天，閒暇時就玩遊戲、閒聊、準備各種儀式，以及相互拜訪。顯然古人的工作表現勝過今天銀行家甚多。$^1$。


    這也顯示，一天工作三、三小時應該是足以維持我們基本的生活。在工業革命之前，這樣的工作型態看起來很合理。但在那時，工作其實跟家庭生活、宗教慶典及玩樂無法分開來看。接著工業革命到來，「工作」及「不工作」的時段，逐漸區隔開來，工作在生活佔的比例越占越大。


    十九世紀，工人厭惡長時間的工作，抗議工作時間過長，爭取縮短工時。倡議者稱，工時降低將減少疲勞並提高生產率。他們說，工業革命若真的成熟，工時縮短是自然的趨勢。因爲人們會開始更多的學習，透過學習，提升知識，能支持民主制度發展。


    但經濟大蕭條讓這趨勢停止了$^2$，大蕭條前，每週工時，從六十小時急遽下降至大蕭條時的平均三十五小時，後來慢慢增加至四十個小時左右。但近幾年來，每週又增加至五十個甚至六十個小時。爲什麼？


    > ◎參見：馬歇爾·薩林斯（Marshall Sahlins）著，《石器時代經濟學》，生活·讀書·新知三聯書店，二〇〇九年。


    > ◎參見：Benjamin Kline Hunnicutt, *Work Without End: Abandoning Shorter Hours for
    the Right to Work* (Philadelphia: Temple University Press, 1988), 311.'
  md: '

    ## 生禮物與創意活動


    生禮物。但很可惜，這樣做的家長變少了。另外一個可以讓孩子在使用金錢上發揮想像力的方法，是讓他們自己張羅一些事情，包括舉辦生日派對（自己做蛋糕，玩一些傳統遊戲，跳馬鈴薯布袋、砸水球，都是好玩不花錢的活動），或是要他們自己籌備萬聖節舞會（自己打造萬聖節裝飾，是個既有趣又非常值得留戀的回憶）。


    如果小孩不愛這些創意活動，還是吵著要買東西，你不妨拖延幾天沖淡他高昂的興致，通常興頭一過，小孩也不會這樣堅持了。但如果你家的小孩對於一些特定的東西非常執著，跟他討論要用什麼方法或付出怎樣的代價才能取得這些物品。服裝交換和贈品，可以減少在孩子衣服上花的成本；承接別人的舊衣服也能省下不少錢，一些線上交換物品的社群或是媽媽團體，都會把小孩長大後穿不下的衣服便宜賣給需要的人，教育小孩需要的東西應有盡有：嬰兒床、玩具、澡盆……


    找保母的費用（就算你找一個比孩子大不了多少的大孩子照顧，仍需要花錢），可能比你出去吃一頓大餐還高。試著找找看周遭有沒有同年齡小孩的家庭，若有事要外出時，跟他們交換看顧孩子，大家講好，這週末你帶小孩，下週末交換過來，這樣也能省一筆錢。每兩週就有一次與另一半單獨約會的機會，又不需為看顧孩子支付額外的費用，一舉兩得。另外加入保母互助會這樣的團體，也是可行之道。


    教育小孩最大的開支就是大學學費，在《給初學者的簡約生活指南》（*Simple Living for Dummies*）一書中，有特別介紹如何節省大學學費的單元。如果你的孩子通過
    AP® 或 CLT® 考試，就可以免修一些學分，報名費只要一百美元。透過考試取得學分，可以節省數千美元的學費，你的孩子入學之後可以直接讀大二，也因此早一點拿到畢業證書。你也可以先讀兩年制學院（學費比較便宜），再轉學到四年制的大學去。或是參加「開始起跑」計畫，可以讓高中生在中學階段，就先讀兩年大學課程，這樣一上大學就直接進入大三就讀。


    ◎譯註：Advanced Placement，由美國大學理事會贊助的高中先修性大學課程。


    ◎譯註：College Level Examination Program，大學同等學力考試。


    ## 大學學費與家庭財務規劃


    凱西與蘭登想出了一個辦法，用經濟的方法送兩個小孩上大學。他們思考：為了送小孩進大學，我們倆必須再工作十年，這樣有道理嗎？他們決定只幫孩子準備好上州立大學的學雜費，如果他們要去念常春藤名校，就要自己張羅不夠的部分，不論是打工賺錢，或是爭取獎學金都行。


    在孩子上大學的幾年年前，你就先告知家中可負擔的範圍，哪些學校可以考慮。簡約生活最大的好處之一是，收入及財產雖然不多卻很滿足，而這樣的物質條件，也比較容易申請到就學補助。許多財務獨立學員的經驗顯示，通常私立學校會有比較多申請補助的機會，如果順利申請到，學費會變得跟公立大學差不多，甚至更少。


    善用大學網站上的學費預估工具，大概就能對學校有哪些補助，學費大約多少，有基本的概念。在申請學費之前，試試看有沒有打工付學費的方案，不要輕易借錢上大學。如果能申請到補助或獎學金，也許你會發現，只要孩子成績夠好，常春藤學校的學費搞不好還比較便宜。


    ## 丟掉不要的東西


    當然，如果你照著計畫前進，你買回家的東西，應該不會直接進垃圾桶。許多實施財務獨立的學員，在改變與金錢關係的過程中會清出不少東西，透過跳蚤市場賣出小賺一筆；有些也會透過線上交易平台賣掉，或是把它們捐贈出去（還可以抵稅）。廢餘可以養花種菜，或放到廢餘箱中，日後當成肥料，也可以拿來養蟲，豐厚地力。有一些城市，舊輪胎、紙類、鋁製品、鋼材、玻璃及厚紙板都可以回收；有些城市例如紐約，已經有廚餘再利用計畫。


    垃圾收集也有互助機制，一個住在公寓大廈的學員，願意幫大家收垃圾再集中處理，這樣自己賺點小錢，住戶也不用花錢特別請人處理。她的垃圾本來就不多，一個禮拜集中跟其他住戶倒一次就行，順手把垃圾桶帶出再帶進就好。雖然這是小錢，但總是聚沙成塔。有些束之高閣的東西，看起來不起眼，但不妨送去鑑定一下，也許會挖到寶發一筆小財。


    ## 過年過節


    對於大部分人來說，送禮是表達情感的一種方式，然而，有不少其他方法既可以表達情意，又不必花錢買禮物。第四章中的第三個關鍵問題其實已經透露線索。如果你不再為了賺錢而工作，可以考慮其他的送禮方法（比較便宜的做法）。傳統上，耶誕節是送禮最重要的日子，你可以過得有意義但簡約一點。麥奇本（Bill
    McKibben）的著作《一百美元度好節》（*Hundred Dollar Holiday*）裡的想法可以給你一些幫助¹。他說有些追求財務獨立的人會限制給孩子的禮物數量，只送小孩一件耶誕禮物，或讓他在三件禮物中選一件。


    ¹參見：Bill McKibben, *Hundred Dollar Holiday: The Case for a More Joyful Christmas*,
    reprint ed. (New York: Simon & Schuster, 2013).


    艾美及吉姆對於耶誕節禮物的滿足曲線，有一個不同的新發現。他們觀察興奮的情緒，會隨著開啟第一個、第二個、第三個禮物而逐漸上升，之後又會慢慢下降。小孩通常會新厭舊，但把禮物一件一件拆開之後，發現沒有一件適合他們，就會對禮物厭煩然後悶脾氣。


    其送禮物的方法（一整年都適用），不一定局限在實體產品，可以考慮送朋友「服務」，例如：看小孩、按摩、一頓家庭料理。你也可以在跳蚤市場看到好東西先買起來，再找適合的時節及對象送出去；別人送你的禮物，若自己用不到，也可以再包裝送出（但要確定再致贈對象與送禮者不是同一人，或是彼此的親友不會重疊，否則就會穿幫！）。最後，如果要消化多餘的禮物，可以舉辦一個交換禮物的「神秘耶誕」（Secret
    Santa）派對，請大家帶一個禮物來參加，彼此交換，就可以解決禮物過剩的問題。


    娥蘇拉每到夕耶誕前夕就非常苦惱，如果把父母、兄弟姐妹、妯娌、姪子女、甥子女一起算進來，她總共要準備二十多件禮物。在跟自己良心及靈魂掙扎過後，她認為不應用以前的方法送禮，於是她鼓起勇氣寫了一封信給家族成員，表達她對大家的情誼並告訴他們，今年不會再送耶誕禮物了，想不到大家的反應非常好。順帶一提，娥蘇拉也親力親為籌辦自己的婚禮，包括聯繫親友、安排餐食及餘興活動。


    你也許會有自己的方法，娥蘇拉的做法很值得大家參考：面對現實，告訴自己究竟想要的是什麼，勇敢、誠實地改變以前的做法，這不是小氣或吝嗇，反而是一種智慧及聰明的轉變。追求自己認為對的事，在這個自由的世界看來，也許跟世俗做法有些不一樣，也可能要承擔一些後果。但以後見之明來看，這樣的覺醒能幫你省下不少開支，而且騰出更多時間做你認為對的事。


    ## 志同道合的夥伴


    在執行財務獨立的過程中，當你發現更多省錢度日的方法，應該會發現生活越來越有趣，也越來越駕輕就熟。如果找到能夠讚揚你的做法、跟你分享成果的人，那恭喜你，你是個幸運兒，有權利在別人面前炫耀。這樣的人生夥伴能提升你的鬥志及技巧，如果沒有分享，就有點錦衣夜行的感覺。


    如果另一半不配合你的做法，可以找其他一些支援團體，增加自己的信心，得到多一點支持。很幸運地，現在有個「財務獨立、提早退休」（Financially Independent,
    Retire Early）的全球性財務獨立社群，其中有不少作家及部落格，在線上就可以提供建言及支援，甚至可以安排面對面的諮商，讓你的財務獨立之路走來更順暢。


    安及福瑞德是透過網路討論區認識的，現在他們對於簡約生活的目標及價值有共識，但年輕的時候並沒有這樣的想法。福瑞德主修電腦，碩士畢業，在認識《跟錢好好相處》這本書之前，車庫裡面堆滿了成千的「玩具」，同時也欠了很多錢。他厭倦過這樣的日子，花了整整一個星期，把《跟錢好好相處》這本書徹底讀一遍，最後，離開了全職工作，那時他才二十七歲。到三十五歲時，他宣布「退休」並過著「豐富、清貧」的生活，他賣了房子、離婚，開始在十美元商店裡買東西，租屋、自己做菜，過自己想要的生活——旅行、航海，還在歐洲一個環保團體工作，薪水雖只有三分之一，但快樂多了。安好幾次都立志要過環保的生活，但屢屢失敗。認識了《跟錢好好相處》這本書及福瑞德，讓她確認自己的價值，書及福瑞德也提供了過不同生活的方向。她開始減少開支，存款也多了起來，目前只需從事兼職工作。現在，安及福瑞德兩人住在舊金山的船屋裡，一起旅遊，擔任志工，協助想跟他們一樣過自己生活的人。她說，「現在大部分的時間，我都可以做我想做的事，有時間訓練鐵人三項比賽、推廣自行車及練習彈吉他。過了五年無車的生活，我們買了一輛車，可以到更遠的地方旅行。偶爾，福瑞德現在也會為了賺錢，參加一些競賽，但不是出於財務需求。因為價值觀相近，我們現在關係緊密，相處時間很多，生活真是美好！」


    安及福瑞德是真的體會到過度消費，對地球已經造成傷害，他們牢記這個概念，不僅讓支出下降，更提升對保護地球的自覺。


    ## 省錢，同時也救地球？


    省錢及救地球看來好像無關，但其實是相同的概念。你擁有的金錢，其實是地球的一部分，怎麼說？錢是地球資源的載體，你每次花錢，買的不只是一件金屬、一塊塑膠、一件木材或是零件，這些材料都是透過取得一部分的地球資源做成的，開採之後運輸、製造、加工、組裝成品、再送到門市，你再把它們帶回家。這些製造供應過程的成本加起來構成最後標籤上的價格，電腦就是個例子。但對環境的影響，卻沒有計入價格中，經濟學家稱為外部成本：空氣污染及處理廢棄物的成本——肺部疾病、癌症、呼吸系統疾病、沙漠化、水災等……每一次消費，我們都在投資，決定要讓子孫住在什麼樣的地球上。


    金錢扣押了地球資源，我們稱這種概念為「波哥經濟理論」（Doganomics, [Dragon + Economics]），這是一種從漫畫人物波哥（Dogan）®發展出來的想法。一九七〇年第一屆「世界地球日」，波哥就說：「我們碰到了敵人，那就是我們自己！」地球受到污染，已經不再是秘密，因為人們不斷需要更新、更多、更不一樣的產品。但我們現在可以採取一些做法，創造性的簡約生活是一種雙贏的方式；對我們的荷包、對地球，都是好事。


    簡約生活不是要你住在沙漠中，吃著野生莓果，用無花果葉蔽體。記得我們的重要約定：不要感覺丟臉，也不要怪罪任何人。人類生來就是要消耗資源、消費是我們的生活之一，也能帶來快樂，應該正面看待。只是，若要讓環境永續，現在的習慣需要做一些勇敢的調整及轉變。但我們在做什麼？把這個問題放在心上，我們其實有很多選擇，可以降低成本且獲得雙倍的快樂與滿足。事實上，享受與大自然互動，體會萬物生命的根源，是一件非常令人愉快的事情。


    如果你想省錢又想要了解如何拯救地球，有許多好書、部落格及網站可以參考，重新衡量自己的生活方式。到圖書館借書，拯救樹木，也是保護地球的好方法之一。關鍵在於記得你買了什麼及哪些是你用不到的東西，所有你去掉的東西或是你沒法享用的東西，都會讓金錢付諸流水，浪費你的生命力，也浪費地球珍貴的資源。虛擲生命力，意味著你回歸為錢工作的日子，一步步讓自己邁向死胡同。簡約生活，對實踐者是好事，對地球當然也好。正如達賴喇嘛所說：


    「當我們談到環境保育，會觸及很多相關的事情，最終的決策在人心。所以，我認為關鍵在於每個人都要發揮對宇宙萬物的真誠關懷之心。」®


    > © 譯註：波哥是漫畫家凱利（Walt Kelly）創造的人物、世界地球日代表物之一。

    > © 參見：The Dalai Lama and Golen Rowell, *My Tibet* (Berkeley and Los Angeles:
    University of California Press, 1990), 55.


    ## 寫下你的省錢必勝方法


    持續記錄每月收支表一年之後，在十五至三十個大類別中，你應該會有一千多項的進出記錄。無論你買什麼東西，已經學會如何用較少的錢買，從蘋果到百日草，生活品質應該也沒有因此下降。這樣的態度和做法，讓你的生命活力得到最好的運用，也保有自己的獨創性，不必跟著別人走。令人興奮的是，你的儲蓄積少成多，車庫拍賣及捐贈雜物之後，家裡比較清爽，可能也已經開始裝潢。你覺得自己更強了，因為想了一些有創意的方法過簡約生活，所以我們會把這個過程稱為「創意簡約過生活」。現在拿一張白紙，把你一千零一種簡約生活的方式寫下來，並且試著喜愛這些方法。


    ## 控制你的思考


    任何曾經練習過冥想的人應該都知道，兩耳之間的頭腦就像一隻狂熱的猴子，以每秒至少一個的速度產生一系列的想法。在短短的十一·六天內，你會有一百萬零一個想法，而且其中的大多數都會與欲望有關，我喜歡這個不喜歡那個，我愛這些不愛那些。佛陀說，欲望是所有痛苦的根源。它也是所有購物的來源。


    小心應付你自己接下來的二百萬零一個欲望，你將有一百萬零一個機會，控制自己不去買無法帶給滿足的東西。廣告不會讓你買東西，其他人的期望不會讓你買東西，電視不會讓你買東西，是你的想法讓你不停敗家。小心這些吸金的傢伙，它們對你的荷包來說，是非常危險的東西。


    ## 檢查表：在敗家之前一定要思考的問題


    - ☑ 1. 不要逛街

    - ☑ 2. 就自己能力範圍生活

    - ☑ 3. 好好利用身旁的事物

    - ☑ 4. 物盡其用

    - ☑ 5. 自己動手

    - ☑ 6. 預測你的需求

    - ☑ 7. 消費時多方考量：價值、質量、耐用性、多用途和價格

    - ☑ 8. 用最少成本買東西

    - ☑ 9. 用不同的方法滿足你的需求

    - ☑ 10. 遵守九個步驟


    ## 步驟六的重點摘要


    以生命活力為指標，提高自己的消費意識，以降低每月的總支出。讓生命活出品質，比追求世俗的生活水準更重要。


    ## 談一談錢。關於錢的幾個問題


    找到方法降低支出、追求滿足感，不該只是追求個人利益的行爲。在傳統消費主義走不通的此刻，透過討論，我們可以交換彼此的态度觀念及過簡約生活的小訣竅。借用本章結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。記得如果在反省時，都能不忘在最後加上「為什麼？」「這樣會讓你有更深厚的思考；如果都忘不忘在最后多問一句：「社會如何看待我的答案？」則會讓思考層面更為廣泛。不論如何，這些問題，都沒有標準答案。


    - 你花錢消費，有沒有想取悅誰？或讓誰高興快樂？

    - 你如何讓生活過得更經濟？做了哪些事？你感覺如何？

    - 講一講你最愛的一項東西，你喜歡它哪個部分？

    - 帶我們一起購物，告訴我們你想去哪，你的感受，及你想買的東西。

    - 你曾經做過哪些無意識消費？

    - 談談最近一次你把東西用到不能再用的經驗。


    # 第7章


    # 愛還是工作？善用你的生命活力——工作及收入


    在第六章中，我們討論了如何透過更有意識地消費，善用你的生命活力。本章將進一步探討如何善用時間，讓你的生命活力有更好的利用。如何讓你最珍貴的資產——生命活力，更有效的發揮？工作，對你的人生真的有助助嗎？


    有時候，我們為了釐清事情的真相，會探究一些想都不用想的事。本章我們要討論的是「工作」這件事。傳統的觀念認為，為了生活我們必須工作，但這種定義剝奪了我們的生活。有些人為了工作，忽略了生活中其他的層面；有些人在週間忍受工作，只能利用下班時間與週末放鬆；有些人好不容易得到遠距工作的機會，但似乎永遠沒有真正休息的時間；有些人在零工經濟的浪潮下，開始兼職人生，但做自己老闆的結果，就是只要醒著就得工作；有些人非常喜歡工作，真的在工作上有所成就，但是一腔熱血總是被公司決策、主管上司、投資人潑冷水。當工作等於賺錢時，工作就會越來越沒有意義。當生命活力沒有辦法凸顯時，就無力改變人生。


    要解決這個困境，首先要想想心目中的「工作」是不是定義錯了？如何在上班或是下班時都能讓生活活力得到最棒的發揮？工作是不是正在摧毀（透支、破壞或浪費）你的人生？你真的想要善用你的人生嗎？在第二章中已經了解，生命活力是一項非常珍貴的資產，它非常稀有，過去了就沒有辦法重來。我們的選擇，決定了人生的意義。到目前為止，我們已經學到了如何讓消費、滿足感及價值觀，往同一個方向發展。現在，要把焦點放在如何把工作賺來的血汗錢發揮出它的極大值。


    ## 工作到底是什麼？


    就像金錢一樣，我們對工作的定義，是從小到大，從父母、文化、媒體及生活經驗灌輸得來的。其中的很多想法、理念及感覺都相互矛盾。

    下面的描述，就是呈現我們對於工作概念的混亂。二十世紀的經濟學家舒馬克（E.F. Schumacher）說，工作有三個重要目的：


    1. 提供生活所需。

    2. 讓我們的天賦能力可以發揮。

    3. 透過與他人合作，解放與生俱來的自我拒架。


    ●編註：德國統計學家，創立實行行動組織。

    ● 參見：E. F. Schumacher, *Good Work* (New York: Harper & Row, 1979), 3-4.


    已故的經濟學家席爾柏（Robert Thayer）這麼說：「工作應該被定義為，人們不想從事的事；金錢則是為了彌補工作上帶來的不愉快的報酬。①


    作家特科爾（Studs Terkel）在著作《工作》（*Working*）中則提到：


    這本書提到的「工作」，就本質上來說，其實是一種對生理及心理的暴力行為；也是一種身心的潰瘍及創傷。就像是一場拳擊賽，讓人精神崩潰或瀕臨發瘋；也是一種每日必來的羞辱，每天帶著創傷從人群中走出來，能存活下來就是一種勝利……也是一種追尋，追尋每天存在的意義及每日三餐；追尋認同及現金；追尋生命刺激，但避免痛苦；簡單來說，希望能多一點人生，少一點朝九晚五、吃喝等死的無奈。②


    但二十世纪诗人纪伯倫（Kahlil Gibran）却说：「工作能让梦被看见。」


    到底什么是工作？是祝福还是诅咒？试验或胜利？就像重新定义金钱一样，我们来定义工作这件事，看看到底哪种说法才是比较真实的观点。


    ## 工作的定义


    先来一下「工作」的历史，藉由回顾历史，可以找到创造自己人生故事的新机会。我们对工作的概念，从何而来？为何我们要工作？工作在我们人生中到底是什么地位？


    ①参见：Robert Theobald, *The Rapids of Change* (Indianapolis: Knowledge Systems,
    1987), 66.

    ②参见：Studs Terkel, *Working* (New York: Ballantine Books, 1985), xiii.

    ③参见：见 Kahlil Gibran, *The Prophet* (New York: Alfred A. Knopf, 1969), 28.


    ## 把每日工作時數減到最少


    身爲人類，我們都必須爲基本的生存做些工作。但多少才夠？許多不同的研究，從狩獵、採集文化到現代歷史，在成年人中一天約需要三個小時。《石器時代的經濟》（*Stone
    Age Economics*）的作者薩林斯發現，在西方影響改變日常生活之前，生活在喀拉哈里沙漠（Kalahari）的昆民（!Kung），每週需要兩到兩天半的時間狩獵，平均每週工作時間爲十五小時。女性收集食物的時間，每週大概也是這樣。女性一天的工作大概可以支撐家用三天的蔬果需求。不論男性和女性，每天都要工作兩天，然後休息兩天，閒暇時就玩遊戲、閒聊、準備各種儀式，以及相互拜訪。顯然古人的工作表現勝過今天銀行家甚多。$^1$。


    這也顯示，一天工作三、三小時應該是足以維持我們基本的生活。在工業革命之前，這樣的工作型態看起來很合理。但在那時，工作其實跟家庭生活、宗教慶典及玩樂無法分開來看。接著工業革命到來，「工作」及「不工作」的時段，逐漸區隔開來，工作在生活佔的比例越占越大。


    十九世紀，工人厭惡長時間的工作，抗議工作時間過長，爭取縮短工時。倡議者稱，工時降低將減少疲勞並提高生產率。他們說，工業革命若真的成熟，工時縮短是自然的趨勢。因爲人們會開始更多的學習，透過學習，提升知識，能支持民主制度發展。


    但經濟大蕭條讓這趨勢停止了$^2$，大蕭條前，每週工時，從六十小時急遽下降至大蕭條時的平均三十五小時，後來慢慢增加至四十個小時左右。但近幾年來，每週又增加至五十個甚至六十個小時。爲什麼？


    > ◎參見：馬歇爾·薩林斯（Marshall Sahlins）著，《石器時代經濟學》，生活·讀書·新知三聯書店，二〇〇九年。

    > ◎參見：Benjamin Kline Hunnicutt, *Work Without End: Abandoning Shorter Hours for
    the Right to Work* (Philadelphia: Temple University Press, 1988), 311.

