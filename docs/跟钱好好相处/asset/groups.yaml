    ## 正確的態度


    ### 別羞愧、勿責怪


    這個步驟可能會讓你感覺有點自我批判，甚至到羞愧的地步，不過如果照著這樣做，負面情緒就會少些。經過這個練習，會使人完全改變想法，並開始人生全新的一頁。在過程中，我們需要建立正確的態度，在梵文裡稱之為「attitude」（咒語或座右銘），保持這樣的態度，可以讓我們的思緒更集中。這個態度就像是船隻上的方向舵，帶我們越過危險或艱難的狀況，航向更清朗、更開闊的視野。這個座右銘就是：「不要怕丟臉，也不要責怪自己或任何人。」


    在改變不好的行為的選擇上，指責（condemn）與辨別（discriminate）之間有差異。與指責相關的是羞恥和責備、善與惡；而辨別則是從錯誤中挑出真相。責備和羞恥會減慢你在財務自由的進步；指責會讓你停滯不前、士氣低落，也會分心。辨別是覺察可能出現的陷阱，藉此趨吉避凶。


    你會一再受到阻礙，不停地怪自己（或其他人）。如果發生這樣的情況，記得辨別，牢記座右銘：不要怕丟臉，也不要責怪自己或任何人。你一生中賺到的錢只是一個數字，不需要價值判斷，不管是多是少都不是重點。也千萬不要以這個數字評斷自己的價值，賺得多不代表價值高，少一點也無損你的價值。金錢生不帶來死不帶去，不要因為這個數字失望，也不要因為你比朋友賺得多一點而沾沾自喜。不論你以前曾犯過怎樣的錯誤，或是曾經造成任何自己或別人的痛苦，記得這句話：不要怕丟臉，也不要責怪自己。你在過程中犯的錯，以及伴隨而來對自己及對他人的苦痛，只將這句話牢記在心，就會隨之淡去。


    ### 無懈可擊的態度


    正確（accuracy）及為自已負責（accountability），是在執行這項計畫時很重要的態度，這樣的態度會讓你在執行時更加順利。不過在過程中，對於蒐集資訊、登錄收支、找寻以前的銀行帳本，或是任何步驟時，務必把標準再提高一點，往「無懈可擊」這個目標邁進。當然，你可以說：「大約差不多了！」但我們仍建議，一定要始終保持完全的誠實。這項計畫的魅力，就是真實面對自己，即使只有一點點也好。如果精算到個位數，可能很花精力也很傷神；但若只算到百位數又有點馬虎，但如果放到人生的長軸來看，算到百位數應該已經算是精確了。千萬不要覺得這些過程壓力很大，盡量做到最好就是了。我敢說，你的時間不會白白浪費。


