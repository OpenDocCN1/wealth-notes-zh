    ### 多買的是好事嗎？


    因為我們不願放棄「買更多，日子才會更好」的消費習性，所以把生活越弄越糟，這種消費習性也拖累職場人生。我們期望每年都能賺更多的錢，因此肩膊上的責任越來越重；我們一直想升官，這樣才更威風；我們老是希望擁有更多，在社交圈中贏得更多尊敬及特權。我們習慣性地要更多東西，也認為世界應該提供更多的消費，擁有越多，想要更多，很難滿足。


    部分原因，可能是拈荒的精神一直存在北美居民的心態中，所以對「更多一點」有深深的期盼。連《星艦迷航記》第五集，都被叫作「終極先鋒」。在美國傳統中，「贏得」了西部，更被認為是一種上天賦予的「昭昭天命」（Manifest
    Destiny）。


    對美國人來說（越來越多國家的消費者行為也一樣），因為「越多越好」這種心態，我們三年就換一輛車，只要有促銷就買新衣服，只要經濟條件許可，就想要換更大更好的房子，或是每次廠商一推出新機種，就想要換電視及手機。


    這些行為，對於地球來說都必須付出代價。美國國家與情研究中心（National Opinion Research Center）的研究顯示，表示自己過得「非常快樂」的比例，從一九五〇年後期就一直持續下降，「越多越好」的行為，竟然變成對生活不滿意的來源。假如你活在什麼都要的心態下，那永遠不會覺得滿足。


    在「越多越好」的心態下，「夠了」就像一個逐漸退卻、縮小的領域。你會失去辨別「夠了」的能力，不知道到哪個程度該喊停。這種心態會讓人陷入「進退維谷、左右為難」的消費窘境。當我買更多東西，我以爲人生會更好，但當抱持這種信念買更多東西時，又覺得欲望沒有被滿足。


    ### 成長的極限


    足。因為，「希望二是一個沒有止境的概念：如果我可以買到這個東西，我就會如何、如何……如此，債務會日益沉重，失望也會逐漸增加。以為更多會帶來更美好生活的迴圈，將無止境地一直循環下去。


    在經濟上來說，「越多越好」的真義是「成長就是好事」。現代經濟概念，對「成長」有極高的信仰及崇拜，理論總是說，成長能解決貧窮問題；成長能增進生活水準；成長能降低失業率；成長能讓生活品質不被通膨吃掉；成長能讓富人走出厭倦；成長也能讓窮人走出困頓；成長能提振經濟，也能讓市場保持長紅，擊敗世界上其他對手。潮起了，船才走得快，不是吗？


    但我們忽略了，所有的成長，地球都必須付出代價，即使在無虞的情況下，大自然也不可能無止境地提供資源，資源有被用完的一天，大自然有其限制。就本質上來看，沒有什麼東西可以無限制成長，地球上的動植物都有循環。一到了滿足點，就會停止成長，我們應該投資更多在生命力（*bios*），而不該只顧成長及繁衍。


    道理顯而易見，不論是動物或植物，其能取得的能源、食物、水、土壤、空氣、數量都有極限，總是會來到一個環境無法應付的臨界點，物種會因為缺乏資源，瀕臨死亡或滅絕，不論能體或整體都一樣。地球超載日已經清楚描繪，以目前的狀況來看，人類個人及整個經濟體的總和需求總合，已經超越大自然所能承攬，但我們卻一直不願面對這個事實。


    ### 不願面對現實


    就像潘姆·提莉絲（Pem-Tee）在一九九三的一首歌曲裡唱道：「叫我克麗奧佩特拉（Cleopatra），各位，因為我就是『不願面對現實』（Cleaner Dirty）女王。」對很多人來說，錯誤的決策做得越多，越容易抱殘守缺。我們總以為不用改變，科技會拯救我們，看看歷史，科學及技術讓天花及白喉這種致命疾病絕跡。當然，我們也能發展出讓水質淨化的技術；基因科技在極端氣候下也能讓種子成長，污染消失，同時發明取之不竭的廉價能源。


    假如，科技解救不了我們，政府一定可以。假如我們遊說得宜，讓政府撥款，就能發展出計畫，有的專家知道如何應對這些問題，反正這不是我的問題，是第三世界的事。如果，他們停止生孩子、燃燒森林，我們就能生存。是他們需要做出改變。在許多事件中，要我們改變根本很愚蠢，因為那些報告可能都是錯的！科學家、政治人物及媒體以前都騙過我們。環境的問題，就是一些聰明的律師及緊張兮兮的環保人士創造出來的，我能做什麼呀？我已經深陷債務，就算為了地球的永續，需要我做一些事，我也沒辦法一天不開四十英里到工廠上班。


    ### 消費主義是工業社會的產物


    當人類及地球傷害日漸嚴重，我們需要停下來想一下，這些真的值得嗎？這是我們要追求的富足嗎？如果不是，為何像是成癮者不願改變這些會害死人的惡習？


    雖然一味追求舒適的生活對我們及地球都不好，但之所以這樣執著，可能跟人類長久以來與錢的關係有關。錢，就像電影聲帶一樣，映照着我們現在的生活方式。我們以為錢就是讓夢想實現的重要來源，錢讓我們降低恐懼，也能平撫傷痛，或者讓我們到達全新的境界。事實上藉由金錢，我們滿足大部分的需求、想望及慾望。我們用錢買希望、買幸福，不再用心過日子，以為花錢可以買到一切。


    在工業國家中，人們以前被稱為公民，現在每個人都被當作消費者，根據定義，消費代表「濫用」、「浪費」、「破壞」、「揮霍」。消費主義是二十世紀工業社會的產物，被視為經濟成長的必要手段，也因此，人們一直被鼓勵買更多東西。


    在一九二〇年代初期，工業革命成功地改變人類文明。機器大量生產，滿足人類的請求，勞動力也大量被機器取代，美國勞工開始要求縮短工時，休閒時間變多，勞工於是利用閒暇時間享受勞動成果。在這樣的趨勢下，美國社會出現兩種新的典型。一種是道德主義者（moralists），他們是新教崇尚工作價值信仰者，認為「遊手好閒的人，等於是幫魔鬼工作」，認為休閒是一種墮落的行為，就算不犯世間的七宗罪，（暴食、色欲、貪婪、虛榮及傲慢等），也會使人懶惰。實業家（businessmen），是另外一種典型。工業革命發展成熟，工廠訂單減少，威脅經濟成長，勞工在那時期，對於買新產品及服務（例如：汽車、家電及娛樂）並不熱中，他們還是喜歡買一些生活必需品（食物、衣服及房屋）。


    但是，經濟需要新市場的挹注，機器用快速及精確的方法生產出的物品，必須有新需求才能消化，生產者有利潤可圖，才能繼續量產。於是，他們想出一個聰明的方法：既然面對的是同一群消費者，人們需要被教育，除了基本需求之外，還得買那些他們其實不需要的東西。提高生活水準，這個概念就不斷被放大。藝術、科學之外，「行銷」這個概念應運而生，不斷說服美國人，工作的目的，不是為了滿足基本的溫飽而已，還要提升生活水準。一九二九年，胡佛委員會（Hoover''s
    Committee on Recent Economic Changes）曾發表一份報告倡導這個新概念：研究證實了一件事情，人們的欲望往往得不到滿足，而讓自己的欲望得到滿足，等於是為了下一個人創造了機會。經濟上，擺在我們眼面前的，是一個沒有止境的世界，一個新的欲望，只要很快被滿足，就會創造下一個欲望。結論：經濟上，我們的生活是富裕的，經濟成長的動力非常強。⊕


    閒暇時的活動，不應該滿足只從事單純的「放鬆活動」，應該把休閒時間拿來增加消費，讓花時間也變成一種消費（例如：旅行及度假）。亨利·福特（Henry Ford）⊕也深有同感說：人們應該工作少一點，消費多一點，商業活動就是一種物品的交易。物品之所以交易，是因為人們的需求必須被滿足。不只是實質生活，心理也要被滿足，休閒時刻，心理的滿足最容易被實現。⊕


    胡佛委員會也認同這樣的概念，休閒不應該成為「放鬆」的理由。休閒應該像是一個洞，需要欲望去填補它（當然，需要更多的工作，才能夠支付這些費用）。事實上，新的消費主義，其實等於是宣揚基督教「七宗原罪」，可能只有憤怒及怠惰沒有包括在內。


    這個風潮在大蕭條時期短暫衰退，消費主義在二次大戰後又重整旗鼓，而且聲勢更強。


