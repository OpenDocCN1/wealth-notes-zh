  mdcn: '

    運用內在量尺測量自己的滿足感是財務自主計畫很重要的一部分。我們必須學習，在不受廣告及其他商業手段影響的狀態下做成財務決定，並評估是否對生活事業有幫助，也不要因為把生命活力花在無法帶來幸福感的事務上，而感到羞愧。


    在第七章曾深入談到妮娜的故事，在執行這項計畫前，她說自己對口袋裡的鈔票幾乎沒有控制的能力。「我走進店裡，鈔票就一張一張地從包包裡飛了出去！這不是形容詞，是真實的感覺，我就是阻止不了！」


    財務自主計畫就是希望一旦出現這樣無意識的消費，有能力地大聲說「我不要」。記錄每月的收支狀況，在不同的類別旁邊註記＋或○，在註記過程中，也許有時是出於直覺，有些則有明確的理由，不過長此以往，財務「肌力」就會越來越強健，就能對無意識消費說不。過程中，舊習慣有時會悄然上身，你可能會自責或想要放棄，此時切記我們一再重申的原則：「別覺得丟臉，也不要亂責怪自己。」


    ## 問題二：使用生命活力時，是否跟自己的價值及人生目的一致？


    這個問題頗有啟發性，在自問的過程中，你會開始檢視你的行為是否有與目標方向一致。就像第一個問題，依照你的收支表逐項問自己：「使用生命活力時，有沒有跟你自己的價值及人生目的一致？」如果這項花費確實與自己的價值及人生目的一致，就在第二個欄位中，註記一個十號（或向上的箭頭），如果沒有，就記上一號（向下的箭頭），如果沒有差異，就記記〇。


    艾美及吉姆在執行財務自主計畫時，有一套非常明確的自我目標及價值；同樣的魏恩及凱西也很清楚；藍登則認為，在檢視問題一、二時，確實對財務及夢想之整合有所幫助。相對地，有很多人雖然物質生活很不錯，但卻沒有自我價值的中心思想。


    許多富二代或家業繼承人充滿迷失及困惑，但表面上，他們的生活及打扮都非常光鮮亮麗。一般人在完成所謂的「美國夢」之後，也會開始質疑，在物質生活滿足後，下一階段應該要追尋什麼？如何生活？你自己呢？你的價值及對生命的意義，有清楚的方向嗎？或者你的方向及價值已經與生活方式脫節？或讓生活品質埋葬在並不適合自己的生活方式中？


    所謂的價值是我們重視的原則及特質。講求真理是一種原則，誠實則是一種真實活出自己的特質，活出價值讓我們心理能夠安頓。價值也是一種想法及信念，根據這些想法及信念，我們做出判斷及決策。價值像一種道德的基因，我們據此決定什麼是對的，什麼是錯的，反映我們最真實的想法及行事的動機。最終，我們認為的價值會展現在外在行為上（父母有時不願面對這個事實，總是對著孩子大叫：「照我的話做，別學我的樣子！」）。


    當我們為下一代提供住所、食物及衣物，或如何當父母及表達最自然的愛，都是根據我們的價值來選擇。不管是到公園散步消磨時光，或是回到辦公室，我們的抉擇都是價值的表現。你可能會說：「上班是被迫得做的事，不是基於價值的選擇，是為滿足基本需求。」但別忘了，是你先決定了怎麼過生活，花多少錢，然後才決定要上班賺多少錢。你的價值決定了如何對家庭盡責；你的價值也決定你如何在意老闆的評價。你的行為就是你內在價值的具體展現，如何度過自己的人生，如何花用金錢，都反映了你是誰。


    這本書是有關於生命中最重要的價值：在我們的一生中如何處理金錢。檢視一下你每月的收支表：兩百五十美元（或是以時薪十美元計算，二十五小時的生命活力，見第三章），外出吃一頓美食，反映了你生命中什麼樣的價值？如何衡量價值，也反映在其他生活大小事中：你如何衡量「便利」的價值？你享受美食上所花的時間及資源，反映了哪種價值？與三五百好友閒話家常，又反映了哪些價值？花十二小時做慈善公益？花十五小時的生命活力在手機帳單，又各凸顯了什麼價值？


    有些花費你可能覺得心安理得，有些則值得商榷，一頓大餐用掉二十五小時的生命活力，看來似乎還不會太過分，但你有沒有想到，你這週可能才花八小時陪小孩。把資源花在大餐也許比聽音樂會或逛博物館有道理，但你可能忘了曾經說過，藝術讓人生得到不少樂趣。對很多人來說，消費所帶來的價值，往往不是他們的人生想要追尋的，你的帳本最能反映你的習慣、有沒有生活在同儕壓力及貧乏中。


    現在趕快再翻到這篇的開頭，檢視一開始提到的這些問題，如果你不為生活而工作，那你會如何打發或利用時間？在你的人生中，做過哪些令你驕傲的事？如果明年是人生中的最後一年，你計畫如何度過？你的人生價值就在這些答案中。你的每月收支表就像鏡子，當你每月在記錄收支時不斷問自己：「這些花費到底符不符合我的人生價值？」你會發現更深刻的自己。就算只是不斷問自己這些問題，改變就會發生，有些人多有些人少，但這都讓你更接近財務自主。最後，財務人生的各個面向就會與你的人生價值和諧一致。


    ### 第二部分：人生的目的是什麼？


    就傳統的標準來說，山謬日子過得非常不錯，但他對社會體系一直灌輸「如果你有好的物質生活（房子、車子及工作），就會得到富足」這件事，非常不滿及挫折。


    當他每天評估財務時，問題越來越清楚，他了解到他其實最應該做的事情是責難自己，幫助這個世界解決問題，而不該做一個冷眼旁觀的百萬富翁。


    於是他開始冒險地離開原本安穩的學校體系，開了一家顧問公司。


    最後，他跟一個協會創立了訓練課程，幫助大家找到自己的內在價值，鼓勵大家肩負起責任，為了社會貢獻出自己的心力。


    現在，他的內在價值與外在行為總算一致，找回屬於自己的快樂。


    第二部分的問題，希望能在你人生目標的大原則下，評估自己的花費。「目標」是你具體實現價值及夢想的目的地，但它的真義到底為何？目標是方向及時間的結果，根據自己的價值，現在的作為在未來收成，為了你自己及整體世界，做一些有意義的事。


    對於艾美及吉姆來說，建立一個充滿愛的家庭並享受自己的工作，就是他們的人生目的。


    對有些人來說，人生目標可能沒有這麼清楚，也沒有這麼聚焦，他們的行為沒法反映深層的期望。


    有些人每天一早起來，面對的就是沒有目標的空虛人生，花很多時間找尋生活的意義；但也有的人像鵝思路，老早就很確定自己的人生方向。


    人生中的目標到底是什麼樣的東西？目標可能很簡單（為了得到某些東西，所以我這樣作為）。


    當別人問起：你為何要這樣做？你在做什麼？你給的答案可能就是你的動機。「人生目標」不是光靠理性就能得到的產物，也沒法在短時間內做到，需要長時間的投入才能擁有。


    它是你相信的東西，有時甚至比你個體存在還重要，值得你將生命活力投注在其中；是你的承諾，也可能變成別人認識你的方法，跟姓名、身體、經歷一樣，甚至比你的人生還來得重要。


    人生中，有各種不同的目標、意義及奉獻，以下是有關三個石匠的故事。路人問第一個石匠：「不好意思，請問你在做什麼？」第一個石匠不耐煩地回答：「你沒看到嗎？我正在把一塊石頭敲開。」路人又碰到了第二個石匠雕刻家，他問了同樣的問題，石匠抬起頭來，很驕傲地說：「我在賺錢呀，養活老婆及小孩。」路人又跑去問了第三個石匠：「請問你在幹嘛？」第三位石匠抬起頭來，眼中閃著光芒，帶著崇敬的口吻說：「我在建一座教堂！」（奉獻給更崇高的目標。○）


    梅西（Corina Maci）是教育家，也是生態學者及作家，對於尋找人生目標，提供三個具體的方向與建議：

    - 跟著你的熱情走，專注於你在意的計畫。在你停止做夢之前，你的人生夢想是什麼？如果不為了錢工作，你最想從事的工作是什麼？你追求的，應該不是像汽車保險桿後貼的廣告標語，例如：「我情願去衝浪」。你要追求的，是你可以投入一生的目標，而不是做一半就放棄的想法。

    - 痛苦也是你必修的人生功課，跟受過苦難的人相處，特別是那些苦難曾經觸動你心底最深層的地方，因為你也曾受過苦難。所以可以跟別人分享那是什麼樣的感覺：悲痛、哀傷、失望、飢餓、恐懼，你能跟別人分享因磨難及痛苦帶給你的智慧及悲憫嗎？你曾經想對受苦的人們伸出援手嗎？如果你因為身處痛苦中，而失去幫助別人的能力，現在正是伸手幫忙別人解決痛苦的最佳時機，因為這是一種療癒。

    - 手邊就有你能起而行的任務，從每天回應身旁的簡單需要開始，找到人生的方向，就像找到好工作及人生志業，讓你像德蕾莎修女（Mother Teresa）一樣，展現神聖光芒。從身旁的任務做起，每萬能提醒我們，在這個相互連接的世界中，每一個角落的奉獻都能讓整個世界變得更好。偉大的志業，都是本著熱情及大愛，從一連串的小事情開始做起：提供晚餐給生病的鄰居、教小朋友讀書、寫信給報社編輯、為無家可歸的流浪漢發聲。從做這些小事情始，你會發現生命中充滿了值得奉獻及投入的意義。熱情、苦難及手邊的小事，就是在物質生活之外，讓我們找到人生目標的敲門磚。


    〈活出差意義來〉（Man''s Search for Meaning）這本書的作者法蘭可（Viktor Frankl），同時也是納粹集中營的倖存者，他曾說，在非人性的環境中，還能保持人文精神，有一個重要條件——人生的意義。這跟智力、心理狀態無關，他說，找到人生意義及目標的想法及企圖，比尋求快樂更強大；法蘭可認為，人之所以不同，就在於尋求自己與其他人的建立關係⑧，經由圖表
    4-1 的問題（改編自法蘭可的書），可以協助你找到自己的方向及目標。把問題答完、加總分數，如果你的分數低於九十二分，代表你欠缺人生的意義及目標，如果分數介於九十二分到一百一十二分，代表你處於猶豫不決的狀態，對於目的及目標並不太明確；如果高於一百一十二分，你的人生目標非常明確。


    接下來，該怎麼辦？回頭問問自己：「生活中的花費，是否與人生目的一致？」你的每月收支表，將會顯示消費模式有沒有與追尋人生意義同步，仔細坦誠地檢視，你可以改變消費模式或者調整自己的目標。


    ## 問題三：如果不是為錢工作，你的消費型態會有怎樣的改變？


    目前為止，我們已經檢視了消費模式，什麼樣的花費能獲得滿足及凸顯人生價值。問題三的目的，在於檢視工作在你人生中的地位，及如何聚焦工作以外的人生。先問自己一個問題：「如果你不工作的話，哪項支出會減少或消失？」在工作表支出項目旁的第三欄中，註記這可能的改變，如果支出會因不工作而減少，在欄位中加註一個－（或一個向下的箭頭）；假如沒有變動，就寫上○，如果你有辦法計算出增減的金額，也可在備註欄中註明。


    這個問題讓你可以想想，如果不需要每天向別人報告工作進度，你的生活習慣會如何改變？如果不需要為了錢，一週必須工作四十小時以上，你的日子會怎麼轉變？哪些花費會因此消失？如果你不必工作，那麼你會買更多的衣服嗎？還是少買些衣服？消耗的油錢會變多？還是更少？你會把車子賣掉嗎？會不會住到偏遠一點的地方？把家搬離市區？你的醫療費用會增加，還是減少？（保險費用可能會增加，但你生病的機率是不是也下降？）在假日時，你還需要到旅館去舒壓嗎？旅遊支出會因此變動嗎？你會不會為了獎勵自己的辛勞，勤不動就浪擲金錢？工作占據了你大部分清醒的時間，那麼為了彌補自己，你會從事哪些花費？你現在可能無法準確地指出，若不為錢工作之後該做哪些事，也可能不知道自己應該怎麼過。你現在需要做的事，就是拿出每月收支表，檢視每項支出或收入，想想看，一旦不為錢工作，這些支出會怎麼改變。記得我們的約定：不要感覺慚愧，更不要抱怨。向自己提問，不是違背你對職涯或工作的承諾，更不是對公司或是長官不忠誠的表現，相反地，若能每月反求諸己，並好好檢視每項支出，會更增加對工作的滿意度。因為你知道這份工作是自己的選擇與決定。


    透過問題三的自問自答，你可能會發現一個驚人的結論：如果你沒有花大部分的時間在賺錢這件事上，人生應該會過得便宜許多！因為你的人生，很大部分的消費是來自於你的工作。生活的一個面向，都需要金錢支持，從小孩的保母費到家庭修繕，從娛樂到找人傾聽你的心事。你會發現真正的財務自主，是在於讓自己不受制於「用錢滿足我的需求」，而不是一般人所說的，賺到更多的錢，讓所有人幫我服務。


    請再檢視一下你的每月收支表，找到你在上面註記的項目（或是箭頭），看看哪些項目沒有符合第一個問題的條件，也就是說，在使用生命活力的同時，生命是否因此得到等量的充實、滿足？再看看第二個問題：使用生命活力時，是否跟自己的價值及人生目的一致？如果你沒有拚命忙確工作賺錢，哪一項支出會明顯改變？你可以歸納出自己的消費模式？你會對自己更了解？在這過程中，沒有必要逼自己，也不需要說：「我下個月一定會做得更好」（記得嗎？這不是在做預算），誠實地面對收支表上呈現的訊息，反覆思考並釐清自己的價值及人生目標，記得我們的約定：不要覺得丟臉，也不要責怪任何人。


    步驟四是整個計畫的核心。但若你的人生目標或是內在量尺仍不明確，也別太擔心，有些人在這個過程中，就會找到並清楚定義自己的價值及目標。逐月逐年，依照這三個問題定期檢視，你對自己的人生目標及雙富充實的定義，就會有更進一步的了解及認識。每個步驟或過程，彼此會有相輔相成的效果，放輕鬆，綜效就會出現。其中最重要的原則是：對自己誠實。也不能忘了我們的約定，不要覺得丟臉，也不要責怪任何人。這是一個資訊蒐集的過程，是重新找到自己的第一步。無意識的消費、花錢成癮的毛病都會現形，只要你保持一貫誠實的態度，用數字清楚地記錄所有開支。


    整個計畫的目的，不是為了自我批判或去除內心的罪惡感，而是希望改變你的消費型態，直到它們能與人生方向及目標一致為止。在執行計畫的過程中，以下是幾點提醒。


    ### 足夠就好


    在第一章，曾提到滿足曲線的概念，在曲線的最頂點是「雙足」。在這種狀態下，維持舒適生活的需求已獲滿足，精神上過得充實富裕，沒有其他不必要的東西會造成自己的負擔。


    「雙足」是一種自由、能量強大、充滿信心及可能性的狀態，如果你照著計畫的步驟，就能從數字中找到真實的自己。


    就實際操作來說，這三個問題是很重要的自我檢視工具，用來定義屬於你自己的「雙足」是


