  - '[PAGE 317]


    # 政府公債入門


    債券就是一個借條，債券發行人承諾在債券（面值）的某個日期（到期日），向債券持有人支付債券上印的金額。大多數債券還以特定的比率（票面利率）支付利息。


    這筆金額雖然以年利率方式報價，但通常半年就會付息一次。公債就是政府借錢的方式。政府通常每隔幾個月，就會發行一張新債券，到期日期通常分為十年、二十年或三十年。


    新發行的債券，最重要的一件事就是償還金額給即將到期債券的持有者，剩餘的錢用於彌補聯邦預算中的赤字。政府有義務清償國債及其衍生的義務，債券的本金和利息必須在到期日前支付，然後再支付其他費用。如果不這樣做，就會破壞美國政府在市場上的「信用評等」。


    # 購買國債風險相對較低


    喬和我開始投資的時候，世界各國對美國債信能力還是保持懷疑的態度，所以政府不得不支付高利率吸引資金。這為財務獨立者提供了非常好的機會，三十年期國債提供了一個「買了，就放在一旁不用管！」的黃金機會。債券價格隨著利率波動，如果在到期前出售債券，你拿到的錢可能會多於或少於（賺或賠）當初買進時支付的價格（市場風險）。如果一直持有至到期日，無論當時的利率如何，都將收回票面上的金額。


    新發行的美國國債，可以透過美國財政部直接經營的網路服務（TreasllCus），向聯準會的窗口買，不需要任何佣金。不需要中間人，也沒有經紀人，當然可免除額外的經紀費用，你也可以透過經紀人購買已發行的流通國債（最低收費）。你也可以經由次級市場ᵍ，向任何持有國債（任


    g 編註：次級市場是初級市場發行後之有價證券買賣的交易市場。功能在於讓最初的投資者可以賣出持有的有價證券以變現，改作其他用途。'
