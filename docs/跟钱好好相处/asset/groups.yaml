    ### 消費模式不變，地球資源將耗竭


    假如這是我們個人的慘況也就罷了，但事實並非如此，我們富足的日子已經對地球產生毀滅性的影響。一九八七年，聯合國世界環境與發展委員會（World Commission
    on Environmental Development）警告，已開發國家這樣的消費模式是環境變差的主因之一。不過這份報告發布以來，除了使用科技產品的頻率越來越高外，我們的生活模式並沒有產生多少改變。我們不缺警告，即使電視新聞不斷提出，但我們越來越不知道什麼該相信，或者為什麼需要關心這樣的議題。


    環保人士已經盡力用圖表及各種資訊不斷傳遞地球越來越熱的訊息，暖化消融了冰山，使得有些地區的温度越來越高。全球足跡網絡（Global Footprint Network）製作了一個生態足跡量表（The
    Ecological Footprint metric），把製造日常用品所消耗的能源及資源，從汽車到沙發清楚列出。你可以從這個模型中，看到消費品創造的碳足跡。


    如果在北美洲的這群人消費模式不改變，我們可能需要四個地球才夠消耗，但我們只有一個地球！


    每年「全球足跡網路」都會聯合「世界自然基金會」（World Wildlife Fund），舉辦「地球超載日」（Earth Overshoot Day）活動，地球超載日指的是地球再生、可供人類使用一整年的資源，將在這一天用盡。每年在活動中，都會宣布地球的資源在何時將被耗盡。


    一九七一年，地球超載日發生在十二月二十一日；十年後提前到十一月十二日；一九九一年，超載日進一步提早至十月十一日；二〇〇二年九月二十三曰；二〇一六年，提早到八月三日。現在的情況又是如何？地球是大自然的產物，還要多久，支持萬物生長的資源將消耗殆盡？當我們發生個人的債務問題，汽車可能被拿走，房子可能被拍賣，再也沒有能力借錢，可是只要還有機會再起。但對於環境負債可沒辦法這樣做，因為我們只有一個地球。


    ### 金錢遊戲中最大的輸家


    可惜的是，我們根本沒有辦法體會環境債務到底多大，因為受害者無法發聲，我們也找不到債主，誰又該為這筆債務負責。在環境債務中，沒有銀行可融資，只能說我們正在透支屬於下代的資源，占大自然的便宜。我們每天吃的、穿的、買的、使用的，都是來自於地球。


    李歐納德（Alene Leonard）在紀錄片《東西的故事》（The Story of Stuff）中，描述我們的生活消費模式，就是從地球取得資源，送進工廠，買回家裡，然後丟掉，是一條有去無回的單行道。我們只管享受眼前的富裕，根本不管擁有的一切其實都是取自地球，從土壤、水源到空氣，大自然不會伸手跟你抽稅。當社會越來越文明，我們更依賴可以呼吸的空氣、水及土壤，以維持生存。然而，對這種消費模式我們卻無意踩煞車，企業當然也不會鼓勵少消費一點。在政治上，限制消費也是一種自殺行為。就個人來說，很少人願意犧牲自己便利的生活，除非大家同時一起改變。


    環保團體、地方政府及非政府組織現在找到一個辦法，說服民眾厲行環保。他們告訴大家，如果地球的狀況改善，消費主義崇尚的 3 C ――舒適（comfort）、掌控（control）及便利（convenience）也會越來越好。一旦太陽能發電越來越有價格競爭力，就有越來越多人裝置這裡設備，一旦電動充電站像加油站一樣多，消費者就會傾向選擇對氣候友善的車種。我們其實沒有改變消費的心態，只是選擇不同的科技。這樣夠了嗎？不，作家奧斯丁及殷立其（Robert
    Ornstein and Paul Ehrlich）在他們的著作《新世界、新想法》（New World New Mind）中指出，人類只對立即威脅（例如：老虎、火灾及敵人憤怒的白眼）做出反應。在今天的世界中，越來越高
    的債務及環境威脅等都屬於水煮青蛙的慢性威脅，我們不認為這些有立即的危險。奧斯丁及殷立其認為我們必須學習，對反應氣候變遷上所花的力氣，應該跟看到老虎趕快爬到樹上的程度一樣。有些消費者心態已經開始轉變，他們追隨生態趨勢，對於綠色新科技也勇於嘗試，你可能已經是其中之一。但只強調美德，沒有辦法改變現狀，首先必須打破多即是美的心態，讓大家真誠想要改變，而不是被逼行事，環保先行者也往往能發展出最好、最聰明、最適宜的方法，讓環境及人類共存。你將清楚看見，工作到死或什麼都要的心態，真的不是最好的生活方式，認清這點，連你自己都會得到解脫。


