    因為善於利用自己的生命活力，妮娜從一個拿基本工資的清潔工，變成醫院部門的主管，薪水變成原來的四倍。步驟七主要是告訴大家，就算在現實考量下，你得把正職工作設定成只為賺錢的工具，但還是盡你所能，妥善運用自己最珍貴的生命活力。這樣做的原因，不是為了貪念，或是在職場上贏得勝利，是為了肯定自己及珍惜寶貴的人生。不僅健全人生，更能讓負債減輕存款增加，有更多的時間及精力追求想要的志業，結交更好的客戶，照顧家庭，並尋求更寧靜的心靈。


    ### 步驟七的重點摘要


    - 善用你的生命活力，能投入在你想做的工作上，藉此增加收入，同時保持身心的健全發展。


    ## 談一談錢。關於錢的幾個問題


    找幾個知心朋友，圍在營火邊或坐在家裡，好好聊聊金錢這檔事，藉此機會相互分享，如何在金錢與生活上做出更好的選擇，重拾人生的意義和快樂。


    借用本章結尾「談一談錢」中提出的問題，跟你的另一半或是社團成員對話，每日反省自問。


    記得如果在反省時，都能不忘在最後加上「為什麼？」，這樣會讓你更深層的思考；如果都能不忘在最後多問一句：「社會如何看待我的答案？」，則會讓思考層面更為廣泛。不論如何，這些問題，都沒有標準答案。


    - 如何讓收入加倍，但不必出賣靈魂及折損健康？

    - 你的第一份工作是什麼？做過最好的工作是什麼？最差的工作是什麼？

    - 你的夢想工作是什麼？你認為應該支薪？還是義務？

    - 工作到最後是什麼？你為何一定要有工作？

    - 人生最重要的工作是什麼？

    - 如果你現在是為了賺錢而工作，這個工作最令你喜歡的是什麼？最令你討厭的是什麼？


    ## 第8章 目的快達到了。財務獨立交叉點


    財務獨立計畫執行到現在，開支已經減少到最低，收入也盡量提高，債務下降，銀行存款同步開始累積。以前，你可能會把賺進來的錢花掉：度假、買科技產品、分期房貸。但經過之前的學習步驟，愛花錢的習性，愛消費新產品的習慣，都已經一一消失。你已經下定决心，錢要花在對人生有意義及能帶來真正快樂的事務上，無意識消費很難再左右你的行為。你已經知道花錢的背後，是消耗你的生命力，那個往收銀機走去的那個人已經不在了。


    你已經了解「富足」的心態真的能帶來自由，那接下來呢？


    如果你幸運的話，此時你事業成功的叔叔或是外甥可能會跟你講復利的藝術，他們可能會說：「你還年輕呀，如何開始存錢，用錢養錢，在復利的魔力下，五十歲時，你就會是有錢人了！」


    我？真的能變有錢人？


    想想前幾章討論的事項，步驟一至步驟七已經改變了你跟金錢的關係。現在，步驟八與步驟九，將會改變未來跟你的關係。就像叔叔與外甥說的，如果你開始存錢不要亂花，你的財富就會越聚集越多，你現在的錢，會幫你的未來帶來更多錢。放在銀行可以生利息；買債券利息更高；保守一點買股票可以分得股利，把利息及股利再進行投資，財富累積速度更快，「有一天，你的錢會自動幫你賺錢，你就達到財務獨立了！」這些親戚真是為你設想。把逐月收支圖拿出來，這張簡單的圖，對你的財務人生將產生超乎想像的轉變。注意，你很容易就發現，事情在轉變：一旦你的開支開始下降，收入那條線開始上升，你的債務就會消失，存款也會增多。


    以下的圖，是第七章講到的妮娜她的逐月收支圖。從圖上發現妮娜的收入從高峰向下走，但請再看一次，這次加上支出一起看（圖表8-1），可以發現收支之間，出現一道開口（gap）。


    在貧窮邊緣生活了這麼多年，妮娜的生活中並沒有「花大錢」的習慣，她的每月支出，大概在九百五十美元左右。圖表的數字沒顯示的是，她在所得支出上的改變。


    她以前會花錢「用娛樂填補空白」，現在則參加「對生命有意義的活動」，她的內心越來越平靜。她的收入，就像第七章提到的，已經超出了表格之外，不只是因為工作表現，還加上她在一家當地小公司兼差的成果。妮娜的逐月收支表，是典型省錢大師的表現結果，收入的狀況已經超越圖表所能記載。


    伊蘭（見圖表8-2）有穩定的薪水，但花費極大，非常認真地執行財務獨立計畫。之後，開支減少了一半，她說這樣的改變不僅提升生活品質，也找回自信心。


    你在這張圖表上看到收入及支出的差距，就是儲蓄。在還沒執行財務獨立計畫前，這個差距代表你能花的錢更多，但在學習之後，儲蓄的意義已經不同，在財務獨立計畫中稱為「資本」（capital）。資本不是用來放在銀行裡，是用來幫你賺更多錢。不管是五十美元或是五百美元，資本都可以為你的創造更多的收入。在步驟八及步驟九中，你會發現財務獨立不只是爭取省下百分之十或十的錢，當你真正做到聰明投資，不僅你跟金錢的關係會轉變，還可累積財富，創造人生一輩子的被動收入。透過步驟八，完全財務獨立的大門已經為你開啟。


