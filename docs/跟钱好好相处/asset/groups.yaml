    # 政府公債：喬的最愛


    喬在一九六九年、剛滿三十一歲時就退休了，他制定了一套「買了，就放在一旁不用管！」（Set & Forget）的投資法則，這套透過養老金和美國國債的投資方式，能產生穩健的被動收入，確保資本的最大安全性和每月穩定投資收益。這些債券的利率高於六．五％，通貨膨脹率低於三％，代表投資人每年都能拿到穩健的利潤。接下來的三十年，利率一直穩定維持高檔，在一九八一年的經濟衰退期間，猛漲到接近十五％，但在一九七九年回落到六．五％。這一年，喬也過世。①
