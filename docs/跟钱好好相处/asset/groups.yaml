    ## 3. 好好照顧你已經擁有的


    有一項最重要的東西，我們必須長時間將它維持在不錯的狀態：你的身體。簡單的一些預防性作為可以讓你省下很多錢，照顧好你的牙齒，可以省下很多上牙醫診所的錢；選擇身體能夠負擔的飲食（是為了健康，而不是味蕾），會讓你省下好幾千美元的可能花費，同時也能讓身體保持強健。把這些原則擴散到其他你擁有的財產上，衣服若破了就試著縫補；鞋子若壞了試著修好；舊電腦功能變差，試著換上新的硬碟或加裝記憶體；定期更換機油，可以延長車子的壽命；用心保養用品，讓使用年限及功能加強（你家那些不動的吹風機或是吸塵器，有多少是因為裡面毛球太多而故障了？）。清潔冰箱盤管（85%
    上的灰塵，可以保持冷度使其運作正常。機器跟人不一樣，機器壞了不會自己修復，需要定期保養。如果你偶爾頭痛，不管它可能一下就好了，但如果你不管電腦或是汽車發出的異聲，很快就會造成更大的損傷，花費也會更多。我們已經習慣生活在無廢的世界中，不再花心思在維護已經擁有的事物，「反正東西再買就有了。」我們常常對自己這麼說。但實更多會花更多錢，而且源源不絕的供應，就長期來看很難長久維持。我們必須開始腦內革命，多想如何把東西修好，而不是再買一個新的。


    ## 4. 把東西用到完全不能使用為止


    你還記得自己曾經把什麼東西一直用到不能用為止？如果這世界上沒有時裝產業，我們可能好幾年都穿著一樣的衣裳。檢視一下你擁有的東西，是否還沒等到用壞，卻只為新款式上市，就換了手機、家具、鍋具、床組？可曾想過如果你能延長兩成使用期限，這樣會省多少錢？


    如果你以前每三年就要換一次床組，現在延到四年；如果你每四年就換一輛車，試著延長到五年；如果你每兩年就換一件外套，試著把現在的外套穿到第三年的冬天；如果你手癢想要買東西，問問自己：「我是不是已經有一件完全一樣的東⻘，狀況很好，卻一直放著沒用？」另外一種省錢的方式，是在你丟掉一件東西前，先問問自己：「這東西真的完全沒用了嗎？或是還有一點用處？」


    把不要的衣服剪裁一下就可以當成抹布；看過的雜誌可以當成製作藝術品的材料，網路上有很多人都在教大家如何讓舊物品煥發新生命。在過簡約生活時，有一點要提醒大家：千萬別讓自己消耗太多時間在真的不堪使用的物品上。如果你已經花了一些時間在修理一盞燈，但可能還有問題，那就不用再繼續浪費你的生命活力了。如果你花在修理老車的時間，比你使用車子的時間還多，或是修理的費用太高，那就買一輛新車吧！如果舊跑鞋已失去彈性，穿著膝蓋會不舒服，就買一雙新的吧，因為膝蓋手術的花費，比買一雙新鞋高得多。


    ## 5. 捲起袖子自己動手做


    你會幫車子換燈泡或其他零件嗎？或是修理水管漏水嗎？你會自己報稅嗎？自己做禮物嗎？自己換腳踏車輪胎？自己做蛋糕、做書架、翻修家具？自己經營園藝？自己設計網頁、幫家人理髮？自己組織午餐利團體？這些都是我們父祖輩以前過的生活。那時，大家都能做一些簡單而基本的生活技能，現在我們都已經養成請別人代勞的生活習慣。翻轉一下這樣的趨勢吧，當你想要打電話請專人幫忙時，多問自己一句：我可以自己來嗎？要花多少時間才能學會？把這個技能學起來，以後会有用嗎？現在，有一群人就是希望把這種手做的創客
    Maker 精神找回來，成為新的潮流，透過自己的雙手、讓電子零件、木材、電線、織布能有全新的生命。沒錯，現在的電子產品相當精密，創客可能沒有能力在缺乏儀器的情况下完成一些任務。例如：以前出產的汽車多是機械構造，比較容易在後院自行拆修，但現在的汽車太多功能都靠電腦或晶片控制，需要專業的廠商才能服務到位。


    當蒂娜年輕時，她與醫生丈夫住在斐濟幾個月，當地人對他們非常景仰，景仰程度之高，令蒂娜消受不起。她試圖減少當地人對他們的尊重，但做不到。然後她發現，由於斐濟人生活上使用的每件物品都是自己做的，因此斐濟人看到她與醫生丈夫擁有的收音機、手錶和打字機，都以為是他們自己動手做的，才會對他們兩人無比崇拜。


    學習基本的生活及生存技能管道很多元、網站、書籍、線上課程、其他成人教育，及越來越多人學習自己動手做的媒體：YouTube。每學習一項技能都會是一個新機會。若你真的學不來，以及那些你完全不想學的，可以請別人幫你做，或是記清楚如果有問題發生時可以找誰幫忙。每一次的學習，每一次的投注生命活力，都不僅獲得一項新技能而已，而是減低下次犯錯的機會，或者節省下回可能的支出。當然，以目前的環境來說，直接換新的可能比修理更便宜，但如果你想了解更多


    ◎編註：Maker 在此是指一群酷愛科技、熱中實踐的人，他們可以分享技術、交流思想為樂。


    能力，或是教育下一代如何面對淘汰舊物的時候，就值得這樣做，到網路上去找些自己動手做的影音教學來學習。


    一個曾參加過財務獨立課程的學員分享一個她修好暖氣機的故事。她說，她家的暖氣壞了，找了三家公司來估價，每一家公司都很明確地指出問題在哪，不過說的原因跟解決方法都不一樣。因此她自己開始鑽研像迷宮式的熱氣管，同時又上了一個短期的課程，根據所學及所知，選了一家最接近自己想法的廠商。因為這樣做，她省下了幾百美元的費用，不用破壞家具或牆壁，更一路擔起監工的
    role，邊看邊學，因此避免了好幾個昂貴的錯誤，省下不少鈔票。這些錢可以拿去做別的事，畢竟現在生活費越來越高。


    ## 6. 對自己的需求做好計畫


    花點時間研究一下自己要買什麼東西，也能夠省下大筆錢。如果你有多一點的時間搜尋，可以用更便宜的價格買到想要的東西。把你來年想要買的東西，羅列一張清單，事前做些功課，研究各廠牌、型號及價錢的不同，善用周邊適合的比價工具，比價網站、電商購物平台或是分類廣告，請系統在商品降價時，給你即时的通知。事前看好自己要的商品，當降價來臨時，才可以用最划算的價格買到，因為促銷活動的特惠價格，幾乎都是限時在幾天、幾小時、甚至幾分鐘內。


    在重要節日，不少廠商也會推出大型的促銷活動。注意一下地方報紙，不少傳統商店特別會在假日打折，至於像價格比較昂貴的商品，如汽車、電腦、手機，在舊款手機快下架、新款手機還沒問世這個期間，通常都會有比較大型的促銷。觀察你的輪胎，如果左後輪的胎紋都變薄了，就要有換胎準備；或者是預期何時你會有搭飛機的需求，多花一點時間搜尋那個期間的票價，預先做好計畫，就能用比較便宜的價格買到想要的東西。換個角度想，如果你要求快，買到的價格一定較高，所以便利商店的東西應該是最貴的。事先做好採購計畫：每到傍晚就會嘴饞想吃的零食，每週三就會喝不完的牛奶，或預估衛生紙何時會用完。同樣的商品，到大賣場、電商賣場或是大型超市購買的價格，可能比附近便利商店低了許多，而且時間一拉長又可以省一筆錢。


    此外，做好計畫可以消滅簡約生活中最大的敵人——衝動性消費。如果你在前門前沒有做好採購規劃，例如：你在三點五分出門，可能在五分鐘後就已經站在專櫃前，買你不需要的東西。我們並沒有強制建議，出門前的購買清單裡只能有一件東西（當然，對於衝動型的消費者，這樣限制自己的行為，也是不錯的做法），我們指的是，當你要購物時必須非常誠實，清楚知道要買的是什麼。


    千萬不能看到割草機或是喀什米爾毛衣，就忍不住地說：「這就是我預訂要買的東西」。你可能聽過帕金森定律（Parkinson''s Law,「只要還有時間，工作就會不斷擴展，直到用完所有的時間！」），我們可以依此推論：「只要你一直衝動消費，需求就會源源不絕而來」。


    ## 7. 好好研究價值、品質、耐用性、多功能及價格


    好好研究一下自己的消費行為，同時，也仔細看看值得信賴的電商網站或購物市集，看看網友對它們的評價。想想你自己需要什麼樣的產品，哪些東西對你最重要，不要只看價錢，以爲買到最便宜的東西才是最好的消費。如果你想要用一個物品長達二十年之久，那麼耐用性就很重要。直覺上來看，價格低是省錢最好的方法，但如果買了一個可以用十年的四十美元物品，跟一個只能用五年、定價三十美元的物品比較起來，長期來看，四十美元的商品反而能幫你省二十美元。


    多功能性是另一個簡約概念，買一個具備四種不同功能的十美元商品，比你分別用五美元買四種商品，至少就省了十美元。一個多功能的好鍋，可以替代半打的不同功能的器皿，如：飯鍋、荷蘭鍋、陶瓷慢燉鍋、深油炸鍋及義大利麵鍋。因此，如果你想要用久一點，購齊耐久性及多功能的產品，應該是一個省錢的選擇。但如果你不常用，也許就不值得花錢買一個高品質的商品。清楚自己的需要及了解你的所有可能選項，是聰明消費最重要的途徑。你也可以提升自己識別商品的能力，仔細看看買到的東西，衣服的接縫線有沒有縫好？收針有沒有收好？材質夠不夠堅硬？家具在組合時有沒有釘好？螺絲有沒有拴緊？你可以期許自己變成鑑定物品的專家，可以一眼看出物品能否長久使用，就像林務員一眼就能看出傾倒樹木的年齡一樣。


    ## 8. 花小錢買東西


    這樣做，可以讓你用小錢買到對的東西：


    - **比價網站**


    可以讓你找到最適合你的東西，可以讓你在便利性、選擇性、環保，或幫助在地經濟的這幾個條件中，選出最適合你消費的商品。你可能比較願意向在地商店購買，而不是上網消費大品牌，但到底價差要多少才值得？必須要對價格有全面的了解，才容易做出決定。用搜尋服務或是其他網路上的比價機制，讓你更了解價位及庫存狀況。許多商家，不管是傳統商店或是線上購物網站，都提供比價服務，如果價格便宜，地點又方便，你就可以選擇在這個店家消費。有些商店還會提供退貨差價服務。特別是那些價格高的商品，多在消費技巧上花一點心思，絕對可以讓你省下好幾千美元。


    - **討價還價**


    消費時你若付現，可以要求商家打折；買到瑕疵品也可要求折價；如果促銷期將在明天開始，或已經在昨天結束，你還是可以試著討價還價；如果看見特價品，千萬不要以為不能再打折，還是試試可否折價；如果你一再光顧同樣商品，也可試著要求打折。試試看每次消費時都喊喊價，如果你不試試看，永遠不知道能否搶到便宜。


    討價還價，長久以來就是一個不錯的傳統。標籤上的定價通常都是比較高，如果你買新車，不需要胡亂殺價，廠商的經營成本及優惠活動在網絡上查得到，你可以依此爭取到更優惠的價格。我每次買新車時，都會比較方圓一百英里的經銷商提供的價格，結果每一輛車的買入價都比定價再下幾個三到五折。


    例如，在一九七七年我看到一部二手的 Suzuki 露營車準備出售，因為我之前的經驗，知道這款車的價值及稀有性。我試駕時發現這輛車上坡有點吃力，還發出劈啪聲，但因為我對這款引擎還滿熟悉，知道該如何修好它；這部車好像有泡水過的跡象，一個門栓還有點問題，我當然不願用定價買有這麼多問題的車子回家。銷售人員問我，那你願意出多少錢？我第二次上門時，出了一個對折的價錢，銷售人員二話不說：「成交」。


    其實，不管你要買什麼東西，從五金行到衣服專櫃，都不妨殺殺價，反正不會有什麼損失。最近一個例子，是我為了健行活動得買一雙新跑鞋，在促銷花車上看到一雙跑鞋，上面標的定價是九十五美元，但沒說打折之後的價格，我問店員打折之後賣多少？「三十九．九九美元，」他說。「能賣我三十美元嗎？」我問。他看了一下庫存狀況，回答：二十八美元。基於以前的討價還價經驗，賣家的出價不應該比買家高嗎？為何這次比較低？不過，我聽到這次價錢居然閉嘴，馬上付錢走人。我的經驗裡，討價還價最可能成功的店家是獨立經營的小店，店主可以自己決定價格，很快就能成交。因此，如果你看到大賣場的價格比較便宜，試試和一些獨立經營的小店殺價，他們通常會給你滿意的報價！


    - **買二手貨**


    你也可以試著買二手貨，試著調整自己對二手貨的心態，因為我們大部分的人，都是住在別人「用過」的房子裡。建商先把房子蓋好，之後再把浴室、廁所、冰箱等東西，一一加上去。買新車最大的成本就在折舊，第一年折舊幅度就高達兩成，如果你買一輛幾個月或幾年的二手車，馬上就可以省下好幾千美元。還有哪些東西使用二手的比較划算？到
    eBay 或其他二手網路商店逛逛，找找看你需要的東西，有沒有些是中古的好貨，社群網站或媒體上面也有不少賣家。就像汽車一樣，其他像家具這類很快折舊的商品，到二手拍賣網站裡，可以省下不少錢。你也可以在住家附近找找看有沒有一些平價商店，像十美元店、三十九美元店或五十美元店這樣的商場。最近幾年，平價商店已經成為潮流，衣服、餐具、家具或是窗簾都可以在這些商店中買到，有些品質真的不差。


    不過不少消費成癮的人都會選擇在平價商店，而非高價商店中消費，這點得要注意一下。如果你真的不愛平價商店，那也可到較高檔的奇貨商店或委託行找找你要的東西，品質通常會比平價商店好。


    依照我們在美國的經驗，若要買衣服，到平價商店最好；家電用品、家具或是其他家庭用品，則到跳蚤市場或一般家戶辦的車庫大清倉最划算；在這樣的拍賣現場，如果你能在開賣之前就（在賣家還沒喝完咖啡之前），應該能搶到一些特別的品牌，但記得也別去得太早，否則對方會讓你先進場挑貨。要不然你就晚一點再進場，這時大家想趕快清倉，越晚，你可能買到便宜貨的機會也越高。


    有些地方會舉辦以物品的拍賣會，很多的人都會把家當拿出來，有一些精明的小販或是收藏專家會擺攤，或者有些家庭要搬家，也會趁著這個機會把家當清一清。不論你在實體拍賣現場或網路拍賣，記得你要找的東西一定是你真正需要的，不要只因為了「它們真的很划算」之類的理由，最後買了一堆用不著的垃圾回家。


    古諺說道：「一個人的垃圾可能是另一個人的寶藏」，若要買二手貨，你可以參照「自由循環網路」（GreenGaz Zero）或「什麼都不要買計畫」（Buy Nothing
    Road）的建議與指示，買到你需要的東西。一個因為重新裝潢而不要的大型舊窗戶，可能可以給農民當成溫室的窗戶，這他就不用到了廢棄場花時間找了，這種二手物品的交換，對買賣雙方都有好處。


    ## 9. 用不同方式滿足你的需要


    能滿足需求的方法，絕對不只一個，世間上有其他千百種的替代方案。傳統的經濟理論認為，更多、更好、更不同種類的物品，才能滿足我們的需求，但這樣只會讓我們刷卡機會越來越多。誰說簡約生活帶來的樂趣，會因為花錢花得比較省而變少？例如，怎麼做才能最有效提升你的精神：抗憂鬱藥？跑步？心理治療？看看風景？去看一場好笑的電影？幫助更需要幫助的人？還是靠逛街購物？


    哪一樣對你最有效？你的對應方法只有一個？還是有很多？當你覺得累壞了，你會怎麼做？休息？運動？咖啡因？心理治療（買東西或是聊天）？看電視？換句話說，有成千上萬的方法及策略可以滿足需求。例如，自由是人類的基本需求，如果你認為「自由」與「旅遊」的定義很接近，想想自己追尋的是什麼？在核心需求後面是什麼價值或欲望在蠢動？若以一般標準來看，你想要的可能是新奇事物、刺激或是跳脫日常繁瑣及無趣的例行公事；你可能希望在太務求目標導向的生活之外，過一下優雅甚至散漫的日子，學學語文、文化或是其他事物，認識新朋友，放慢步調、減輕壓力，在陌生的大海中優游；或者是離開狹窄的生活框架，嘗試新的料理；在搭飛機的過程中，好好看完一本小说。離開都市叢林，不必參加開會，讓一天開心的度過。但你真的要去很遠的地方旅遊，才能滿足上述的需求嗎？記得我們說過，簡約生活不必拿你的快樂來換。


    真正的簡約追求的是，如何用少一點的成本準確找到你要的生活方式，而不是什麼錢都不花。你不是要限制自己的欲望，而是要準確找到自己想要的。如果想要從例行公事裡解脫，可以試著偶爾放鬆標準一下（例如：讓房間亂一點），或是不要把這麼多責任扛在身上（人家找你幫忙，不要總是不懂拒絕），抑或是改變自己的習慣（例如：凡事都動手自己做，不願意雇人幫忙）。如果現在原泊價格很高，考慮一下近一點的旅行，平常開車時，多留意身旁的風景，也許會發現附近就有具異國風情的地方。你也可以把露營車拖到一百多英里以外的森林或海邊，不必去到非常遠，那裡也許就有清新的空氣或是優美的景致可以享受。


    就近找一些可以休閒的所在，也許離你後院不遠處，就有世外桃源可以享受。當然，這樣做也可以敦親睦鄰，分享彼此人生故事。而在一個地方待足夠長的時間，也能讓你仔細品味，樂趣也會變得更多。


    替代品絕對不代表被剝奪，真正的意義在於發揮創意。當創意發揮時，可以讓你想一下，以前用買新東西為手段的方式，到底是想滿足哪一方面的欲望。例如，當肚子餓時，吃東西就能滿足我們的欲望；當感覺孤單，透過參加團體或是跟人會面，就可以感覺被需要；如果你感到無聊，看場電影，或者是翻閱雜誌，或者做一場小旅行，能夠夠排解；但大部分我們的需求都是物質性的。每次當你的購物欲望來襲時，不妨花點時間想想，你想要的到底是什麼，是不是可以透過創意的安排滿足需求，而不是用買東西的方式填補空虛。


    唐妮拉．米諾（Donella Meadows）在《成長的極限》（*Beyond the Limits*）這本書中，就切中要害的強調：


    > 大家其實不需要大車，他們需要的是被尊敬；不需要一個裝滿衣服的大衣櫃，其實只是希望自己有魅力；或是想要穿漂亮的衣服帶來的喜悅、變化及美麗。大家其實不需要太多電子資訊產品，但需要生活中有一些值得做的事情，每個人都需要被認同，需要群體、挑戰、知識、愛及喜悅。想要用外在物質填補這樣的需求，無疑是錯誤的，沒有辦法滿足我們的胃口，因為用錯誤的方法，永遠解決不了真正的問題。通常心理層面的空虛，才是追求物質欲望背後的最大推力。


    尋找替代品，並不應視為一種限制，反而是一種解放。把你自己從以前的習慣思維中解放出來，看到更豐厚、多元的世界，而不是只看到眼前伸手可得的物品。


    ◎參見：Donella H. Meadows, Dennis L. Meadows, and Jorgan Randers, *Beyond the Limits:
    Confronting Global Collapse, Envisioning a Sustainable Future* (White River Junction,
    VT: Chelsea Green Publishing Company, 1993), 216.


    ## 10. 務必遵守九個步驟


    有很多人已經確實遵守九大步驟，成功地完成這個財務獨立計畫。透過逐步執行，改變了他們與金錢及外在物質世界的關係，這是一個重大轉變，不是單純存錢而已。購物衝動因此煙消雲散，不再自我否定與沉淪，取而代之的是自我覺醒，換來的是更大的幸福與快樂，你可以把這個計畫視為重要的錦囊，仔細執行完這幾個步驟，人生會有重大轉變。每一步都非常重要，集體發揮綜效，讓你不斷進化。


    ## 省錢的基本


    ## 從小氣財神到聰明存錢


    在本書之前的版本中，有一個單元叫作「省錢必勝的一○一種方法」，但隨著時空轉移，有些方法已經不適用。有許多部落格主及網紅提供了很多新的想法及技巧，不少書籍也倡導簡約及簡單生活的概念。包括，如何省錢旅行及用小額做大菜等心法，也教大家如何修繕房子，甚至從無到有自己蓋房子；另外，也會教大家如何自己種菜，尤有甚者，還分享如何建立生態小花園。最後，要提醒大家，不論任何策略或做法，自己從頭到尾實踐一次，比無數的建言都來得有能力。量。


