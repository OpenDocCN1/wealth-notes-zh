    人們神祕的魔幻需求滿足機制永遠有新的需求，回應之後滿足再次到來。想要什麼？看看你的周遭，買點東西，滿足感又回來了。滿足感已經從基本需求（食物、衣服、居住），進展到更高一階的需求（玩具、衣櫥、腳踏車），消費新產品與滿足感已經建立了正向關係，並且深深地烙印在心裡。


    還記得小時候，當你得到渴望的玩具的感覺嗎？如果爸媽盡責的話，他們應該馬上教你：


    > 「親愛的，這些東西要花錢買，我們願意掏錢買你要的東西，是因為我們愛你」，哈！此時小腦袋中有了新規則：一旦有需求，到外面找找，花錢買到新東西，滿足感回來了。一旦有了零用錢，我們開始更進一步了解錢的價值，可以用自己的想法買到快樂，如此年復一年。最後，只有奢侈品才能帶來滿足感。世界上大多數的人，都沒有辦法享受到汽車這個奢侈品，但對於美國人，我們人生中的第一部車，只是一生追求下一部更棒汽車的開端。接著，我們可能開始人生第一個豪華旅行，或上大學念書。人生的第一棟公寓。請注意，每個需求被滿足之後，都會帶來興奮感，但更大的需求就得用更高的興奮才能滿足，而且興奮感消失的速度，會一次比一次快。但是此時我們已經深信金錢就會帶來滿足，曲線已經接近高點。


    當進入人生另一階段，房子、工作、家庭責任，錢雖然越來越多，卻会带来更多的煩惱。職場上越爬越高，但相對投入的時間及能量也越多，照顧家庭時間越來越少。


    如果感覺被剝奪，就會失去更多，憂慮也會越來越多。不只要繳更多稅，給稅賦諮詢的費用也越來越高，更多的社區及公益服務要做，家中也需要重新裝潢，網路、有線電視及手機帳單，讓孩子快樂長大也得花一筆錢。直到有一天，我們發現空虛地坐在三千坪大房子裡，地下室裡有停車位及高檔的健身器材，但渴望找到真正的人生。這種簡單的快樂，貧窮的大學生在公園散步就有了。


    這時的情況是，滿足感已經到頂了，「金錢＋滿足」的公式再也無法發揮功能，反而開始產生副用，然而我們卻未察覺，不管買多少東西，滿足感就是往下直墜。


    ## 满足點：滿足曲線的頂端


    圖中最有趣的位置是滿足曲線的「頂點」，我們一生幸福的祕密就是找到這個點，能取得最大的滿足感，有個特定的名詞描述這個滿足曲線的頂點，這也是改造我們與金錢關係的基礎。這個詞，我們幾乎每天都掛在嘴上，但實際上卻沒有能力體會其真諦。這個詞是「豐足」(Enough)，在滿足曲線上的最頂點，就是「豐足」。


    豐足讓我們能生存；豐足讓我們能舒適及快樂，甚至可以有些小小奢華，需要的每件事情都可以得到，也沒有過多的東西會讓我們感覺沉重，或者沮喪、分心。不用借貸過日，也不會被錢奴役。豐足是不會有恐懼的境界，一個充滿信任的地方，可以誠實面對自我及自我觀照，真正享受金錢帶來的好處，不會浪擲金錢在無謂的消費上。一旦你覺得某些需要已經被滿足，滿足曲線就會轉向並一直往上，請繼續這樣保持下去。


    ## 混亂、比匱乏還慘的命運


    但在頂點之後，會發生什麼事？當滿足曲線從頂點向下彎之後，會是什麼樣的狀況？就是混亂！混亂的原因是因為有太多多餘的東西，多餘的東西沒有辦法為你所用，更會占據你的空間。在滿足曲線頂點之後得到的事物，不能為幸福感的加分。排除多餘的東西不代表就是匱乏，反而是騰出空間讓新的東西進來，得到新的啟發。這也就是為何縮小規模、節儉及簡約，會常常與剝削、欠缺及需求畫上等號。事實正好相反，豐足是一個有創意、自由及有更多可能的地方。那種因為過多以致像泰山壓頂的窒息感，應該被整頓、清理、移除、捨棄，因為這樣的狀況比匱乏還糟糕。


    ## 愚昧無知


    但到底是什麼原因造成混亂？滿足曲線告訴我們，生活中大部分的混亂都是從「越多越好」這個貪婪之心進來的，這種心態是一種物質主義引發的疾病，以為內心的滿足感得從擁有更多的外物才能獲得。門源自古小的經驗。我們不舒服的感覺常常因為擁有一些外在事物而被平復，像是嬰兒奶瓶、毯子、腳踏車、大學學位、寶馬轎車，或更多類似奶瓶等安撫內心的工具。


    也有來自一些無意識的行為，喜歡買一些無關緊要的東西，我們稱之為葛利葛斯胸針（Grillby）；其實不買這些東西根本不會造成生活任何影響。每個人都有些這樣的嗜好，從耳塞、小螺絲起子、鞋子、筆到巧克力糖等雜七雜八的小東西。


    你有沒事事就喜歡到賣場或上購物網站閒晃，當作每週必備的儀式，不知不覺就走到擺放無關緊要東西的櫃位上，欲罢開始蠢蠢欲動，想要把這些東西帶回家：哇……這東西又出粉紅款式了……我都沒有粉紅色的……哇……這東西竟然有無線遙控的款式……這樣會方便很多……哇……有防水系統問世了……如果我自己用不到，也可以送人呀……有新的檸檬口味推出了……還有椰子味的……還有義大利杏仁口味，我從來都沒有吃過這種，你的手（對！就是長在你身上的手）不知不覺就伸了出去，滑鼠或手指不由自主地點了登錄，把東西放進了購物車，像沒有知覺的喪屍一樣結帳。


    你把戰利品提回家（或是線上購物的包裹送到家門口了），你把這些可有可無的東西，再次放到抽屜裡（裡面可能已經有五到十項類似的東西），過了不久，你完全忘記它們的存在，下回購物時，你又會不知不覺跑去同樣的櫃位，買同樣的東西……


    ## 混亂的面貌


    不在視線裡的東西，不代表它不混亂，那些專門放無意義雞肋小物的抽屜——包括閣樓、地下室、車庫、衣櫥、收納箱，裡面就可能擺滿了多餘的戰利品，這些東西也許買來之後就從來沒有用過。


    把它們束諸高閣會覺得很可惜，把這些沒拆封的小物分類別類整理好，但是完全不用，你又覺得有罪惡感。只穿幾次的衣服，打包後便宜賣給二手店覺得可惜，有點沒有滿足的失落，甚至有時還會迷信自己的衣服給別人穿不太好，但直接當垃圾丟掉更不捨。一旦你開始留意，會發現這些雞肋小到處都是。


    這樣堆積多餘的東西，到底意義為何？此外，你的行事曆中，有多少午餐、派對、社交場合、晚宴，也是屬於這樣的雞肋性質？對你的人生一點助益也沒有。又有多少上班的日子，也是這樣雞亂無章、一事無成地混過去？永遠完成不了的待辦事項又有多少？你的人生，就在這些瑣事中，一天一天像走馬燈一樣度過，像漫無目的地翻閱雜誌，或是被小孩棄置的舊玩具。


    從國家大事，到私人事務，有時你的心態及想法亂無頭緒，缺乏計畫行事，毫無章法的結果，導致常常因為健忘而得重複進出賣場，添購一週所需的雜貨。你的嗜好可能是雞肋小物的重要來源，真正用得到的東西眼所擁有的東西，差距通常很大。假設你喜歡攝影，可能會發現自己的攝影包中有許多鏡頭及濾鏡，根本沒用過幾次。一些精彩的照片都是用手機拍的。


    這些都是混亂的來源，一些古空間但卻用不到的東西，一旦你真正覺醒，就會開始大掃除。其實在美國人中文化中，清掃多餘、過簡約生活的傳統一直都在。


    從清教徒到梭羅、貴格會教徒、以及艾爾金 (Diane Elkin) 和安德魯絲 (Catherine) 等作家，簡單生活的風潮不斷出現，為的就是平衡資本主義過度生產的浪費傾向。現在用語則稱種簡生活
    (lifestyle) 或 (less)，因為這世界上沒有東西是取之不盡的，足夠與否的量尺，其實在我們自己心中。它不是“少即是多”；它不是 一朵花瓶裡的雛菊，放置在一塵不染的梳妆台上，襯著從窗戶照進來的陽光；不是破爛的牛仔褲或黑色小禮服；不是一把完美的廚刀，獨自放在抽屜裡。當你接近豐足的狀況，會接近一種金髮經濟
    (Gold) 的狀况，需求被充分滿足，但沒有任何過剩現象。


    每個人認為的豐足都不一樣。某人視為珍寶的東西在他人眼中可能是垃圾。如果你遵照


    > 编注：金髮經濟指的是某個經濟體內高增長和低通膨同時並存，而且利率可以保持在較低水平的經濟狀態。


    本書提到的九大步驟行事，會發展出適合自己定義的生活方式，慢慢地，生活會開始比較從容，比較無憂，比較快樂。想做到這樣境界的第一步是問問自己：「我是怎樣變成現在這樣的？這樣的生活是有價值的嗎？真的嗎？」就像之前有些學員，他們在開始檢視生活多餘事物時，每週都秤垃圾袋的重量，計算到底丟掉多少無用之物。你也可以這樣開始，先看看自己身邊累積多少東西，同時仔細估算一下，自己賺多少錢花多少錢，多少資源從身旁悄悄流逝。


    ## 步驟一：跟過去和解


    你準備好了檢視自己與金錢的關係了嗎？也準備看看哪些東西是可以用金錢取得的嗎？主要是希望大家對與金錢相關的事務，能有更豐足及有感的路覺，不是為了炫耀，也不要因此覺得丟臉。這個過程協助你，在時間及空間的軸線上檢視過去賺錢及花錢的作為。


    在開始之前，先看看這個，非常重要。雖然大家看到白紙黑字的「步驟一」，但其實我並不希望大家第一步就跟著做。在動手之前，先把書中的內容看完，我們建議大家先把整本書看過一遍，不要在這裡就跟著開始動手做，把所有內容看完，再回到這個地方，真正開始依步驟行事。在步驟一中，基本上有兩個重點。


    - A. 先計算一下，你這一生中，到底賺了多少钱，所有你的收入，從拿到的第一塊錢，到最近的薪資單。

    - B. 建立你的資產負債表，看看你現在到底值多少錢。


    ## 你這一生中，到底賺了多少錢


    猛一看這好像是個不可能的任務，你可能會抗議：「我都沒有記錄呀！」不過回頭找找舊資料就會有幫助。首先，找出你以前報稅或追稅紀錄為依據，盡可能地調整，盡量想想那些沒有報稅的項目，例如：自己私下接的兼差、當顧問的收入、賭博的收入或支出、親友給的紅包、被偷走的錢、中樂透的彩金、把房間分租的收入、以及任何不在稅單內的收入。


    再循著記憶往下想想，在高中或大學時代，有沒有寒暑假的打工收入，或是其他在你成人之後，可能對財務狀況有重大影響的收支？再花個幾天，翻箱倒櫃找找任何可能的銀行單據、支票或已經結清的銀行戶頭。如果你還年輕，財務往來已經數位化，就把網路上的資料都抓出來，如果你有履歷表紀錄歷年來的工作，就可以以此為依據，在何時做了哪些工作，賺了多少钱，摘蘋果、幫人搬家或是當救生員，都算在裡面。如果你在美國，又一直從事受雇工作，社會安全局有你的紀錄。◎，花點時間，到政府機關把你的資料調出來，你過去的新資收入就有了基本資料。如果真的有資料，就盡量評估出一個最接近的數子，算出第一筆收入以來，你的所得總額。


    ## 步驟一 的價值


    完成這個步驟，可以有下列好處：


    > ◎ 譯註：在臺灣如果你加入勞保年金，也可調出你所有的薪資資料。


    1. 撥開迷霧，釐清你過去與金錢的關係。大部分的人都搞不清楚，這一生中到底多少钱進了自己的口袋，當然也不會知道，這一生能賺多少钱。

    2. 這樣做也能讓你去除一些長久以來的迷思及自我感覺，如：「我這輩子真的賺不了多少錢。」「或是「我根本不負擔錢，錢對我來說，一點也沒問題！」「通常靠爸族或媽寶會講類似的話。」「如果你屬於那種長期以來一直低估自己所得的人，這樣計算之後常常會有令人驚訝的發現，你比想像中有錢得多。

    3. 做完這個步驟後，你對自己之後的財務規畫會有了更清楚的觀念，對於賺錢的能力也更有自信，等於一個全新的開始。

    4. 更認識自己，也能把那個以前躲在暗處、容易自欺欺人的自己揪出來，他就是搞壞金錢關係的兇手。


    在我的課堂上，曾經有一個三十五歲左右的女性表示，這個步驟對她的幫助很大。她是一個家庭主婦，住在鄉間，長年以來都有心理障礙的問題，始終認為自己是個處處必須依賴別人的人，一點用處都沒有。她「以為」這樣的計畫毫無幫助，畢竟自己對於婚姻，沒有絲毫實質的財務貢獻，在上課之前，連離婚贍養費這種不是靠自己努力賺來的錢，都覺得沒有資格拿。但透過財務記錄整理，她發現在過去的婚姻生活中，大大小小的事情加起來，在那段以為自己毫無貢獻的歲月中，每年竟然能賺到五萬美元。這是她第一次感覺自己是有能力賺錢的人，整個人的信心都振奮起來，應徵且得到一份工作，拿到的薪水竟然還多了一倍。假如你是剛進社會拿到第一份全職薪水的新鮮人，把過去實習、兼差、暑期打工所賺的錢加總起來，也可能會發現自己其實已經賺了很

    '
