    ## 財務獨立


    就像〈關於這本書〉裡說的，這本書的主要目的，是在增加你的財務獨立，跟著這些步驟，你會一步一步邁進財務健全，同時，增進財務智慧，有一天，你就會達到財務獨立的目標。在告訴你如何達成之前，要先說明財務獨立做不到的事。


    首先想像一下，當你聽到「財務獨立」時，腦中浮現的景像是什么？殺人？繼承一大筆財產？中樂透彩？游艇、熱帶島嶼及環球旅行？珠寶、保時捷及高檔服飾？我們對財務獨立的印象，多是一些遙不可及的想像及富豪的奢華生活，這是財務獨立在物質面的想像，你只要有意義的意義是，我現在擁有很多東西，比大部分的人擁有的多很多，但通常我們對於「多」這件事，都存些謬誤，多一個像是一個幻影，我們永遠觸碰不到，因為它不真實。


    哲學家穆勒（John Stuart Mill）曾說，「人們其實並不期待變富有，但一定要比別人有錢！」換句話說，只要所有人都變成富有，有錢這件事就不存在了。只有當我們願意為了金錢擔起責任，財務獨立才可能出現。


    在了解財務獨立的過程中，先試著解釋什麼是富有這件事，財務獨立跟富有是兩碼子事。


    財務獨立真正的含義，是真切感覺到「豐足」。如果你記得上一章的圖，「豐足」位於滿足曲線的頂端，是可以量化的。在上完整個課程之後，你會自己定義出屬於你自己的「豐足」。


    以前的概念，往往是把財務獨立與「變有錢」這件事等量齊觀，但這是遙不可及的目標，「足夠」對於你的意義及數字，可能跟鄰居完全不同。但這個境界是真實為你存在的，是一個你可以做到的數字。


    ### 財務及心理的自由


    要真正體會到什麼是「豐足」，第一步你必須要把以前對「錢」的想法丟掉，重新建立新觀念，如果你做不到這點，再多的錢都無法讓你覺得自由。一旦你重新建立觀念，態度就會改變，拋棄一些既定的念頭，你不會再認為錢會帶來罪惡、仇恨、嫉妒、挫折及失望。


    在這個階段，你會感覺金錢像衣服一樣，隨時可以穿脫。丟掉對「金錢與人生」的誤解，拋棄從父母或社會傳承下來的僵固觀念，例如：有錢才算成功、有錢才能贏得尊敬、有錢是美德、有錢才有安全感、有錢才快樂，這樣才能從金錢的迷惑中掙脫。當銀行理專給你理財或稅務的建議時，你才不會被太多不懂的事嚇到。你不會再買一些你不需要的理財商品，也不會受限於大賣場、百貨公司或是媒體上的宣傳。心理上的富足，不再與經濟上的富足綁在一起，心情不再跟隨股市的漲跌起落。


    內心不會再掙扎，不再每天期盼下班時間到來，也不必每個月數饅頭苦等發薪，不再為買煩惱，也不操心裝修費用，更不會糾結何時可以退休。那份寧靜及安定會讓你震撼。日子一天天過去，你用於錢煩惱，不必隨時往口袋裡掏摸以應付生活中的挑戰及機會。


    當你做到財務獨立時，金錢在生活中應該發揮什麼功能完全取決於自己，不用再被外在環境牽制。這樣做，金錢就會為你所用，讓生活過得更充實。如此，朝九晚五的工作或是做到六十五歲才退休的宿命就會因此改變，已經有許多人按照步驟做出改變。


    ## 步驟二：活在當下——追蹤你的生命力


    如何讓「金錢等於生命力」這個真理在你的人生中體現？如果你認為，金錢是必須認真看待的事，或者認為金錢是安全感及權力的來源，或是金錢是魔鬼的工具，乃至人生中的重要獎勵，你應該用理性思考自己的行為，什麼是應該做，什麼是必須做。


    現在你了解「金錢等於生命力」這個觀念，我們來算算，你這一生中到底經過了多少錢往財務自主這條路邁進的步驟二是，滿足你的好奇心。步驟二包含兩部分：


    - A. 計算一下你做的這份工作，要花多少時間及多少錢維持，並算出真正的時薪。

    - B. 追蹤這一生中，每一分（賺）進來及（花）出去的錢。


    ### 你用生命力換到多少錢？


    我們知道金錢的主要目的，是用來換取生命力。現在來算算看，到底我們一生用了多少錢，換取多少生命力；也就是說，你用了多少時間在工作上，總共因此賺到多少錢？


    多數人對於「生命力」所得一比（life-to-wage ratio），都有不切實際的錯誤認知：「我這薪水是﹍千美元，工作一週四十八小時，所以我每小時的生命力は是二十五美元！」生命力沒有這麼簡單，為了工作所投入的相關事項，通勤時間多久，花了多少錢，這些全部要算進去。


    注意，結果可能令你大吃一驚！有些人可能很不喜歡工作，把它視為長時間的苦差事，無聊、同事間鉤心鬥角、工作進度落後、與老闆或同事意見不合、無力感等……準備好算一下，你在「我討厭這個工作」上的時間及理由。


    如果不工作，你會花多少錢及時間在其他事項上？例如：煮飯、修理東西等。還有你為了保住這個職位及地位，需要投入多少努力及花費？車子、得體的衣著、住大城市、精華區、買好宅、或把小孩送進私校。


    把以下的討論當作腦力激盪，盤算一下，為了保住這個朝九晚五的工作，你花了多少時間及資源。


    這裡提到的東西，不一定適用在你身上，你可以想想還有沒有應該列進來的事。對於自雇者來說，情況可能更複雜一點，但盤點之後好處更大。你可能發現，很多工作不是被高估就是被低估。


    以下的練習，我們假設了一些狀況及數字，目的是要製作一個假想的表格，在最後的討論中，估算出生命活力及金錢的實質「交換比率」。你也可以用自己的實際狀況來推估，自己真正的時薪到底多少。


    #### 通勤


    不論你是自己開車、搭計程車、搭別人便車、騎腳踏車、走路或是搭乘大眾運輸，只要你是上班族，就一定會花時間及金錢在通勤上。在這裡，我們假設你是開車上班，別忘了你必须把停車費、過路費、過橋費這些零碎的支出，還有汽車的折舊維修，一併計入。


    假設每天你花一個半小時通勤開車上下班，一週五天，花的時間就是七個半小時，油錢及維修算每週一百美元（假如是大眾運輸，費用及時間當然就不同）。


    > 七．五小時／週，一百美元／週


    #### 治裝


    你上班穿的衣服，跟假日時的穿著一樣嗎？你在工作時，為了職場禮儀，必須穿著合宜的服裝嗎？這裡指的不只是像護理師、建築工人的制服而已；還包含建築工人的鐵鞋、廚師的圍裙，以及為搭配工作場合，必須穿著的訂製服、高跟鞋、領帶、褲襁等。


    如果不是工作需求，你會在脖子上繫條領帶，或是每天穿三吋的高跟鞋嗎？不只是金錢，你也必須計算花在治裝及打扮上面的時間，還有刮鬍水及國外進口的高檔化妝品。所有的行頭都需要量化，從逛街到塗上睫毛膏，刮鬍及打領帶。假設每週必須花一個半小時，花費大約二十五美元。


    > 一．五小時／週，二十五美元／週


    #### 外食


    為了工作，養成的飲食習慣及其產生的額外費用及時間也要列入，例如：早上及下午的咖啡；中午為了排隊吃飯所花的時間；為了節省時間，外食或叫外賣所產生的花費。假設每週需要花五小時在吃食上面，每週五天的午餐花費，假設是三十美元；犒賞自己的咖啡每週約二十美元。一共在吃食上，每週必須付出五十美元。


