    怎樣的狀態，每月不斷斷地記帳，久而久之你會發現，每當你想要買一件東西，收支表就會跑進你的腦中。大體來說，「豐足」會有四個成分，四種普遍的特性：


    1. 可靠（Accountability）。你能預判，生活中會有多少錢流進及流出，這是財務自主很基本的第一步，假如你不知道金錢的去向及來源，永遠不可能得到「充足」的感覺。


    2. 滿足感的內心量尺。前面曾提過，如果你依照別人的標準及想法衡量自己的人生，那麼永遠也沒辦法達到「豐足」的狀況，就像在一個向上的手扶梯上登高一樣，別人的想法難料，他人所有的東西也變化無常，自我察覺是重要的關鍵。


    3. 人生的目標。人生目標比表面上的欲望或想念更崇高，如果每一個欲望及想望，都想要獲得滿足，那麼你永遠不會感覺到「充足」。什麼是比得到想要的東西更崇高的目標？其實，「得到」的反面概念「付出」，往住才是富足或幸福感的神秘來源，把我們的物質需求向上提升到為別人服務，為他人貢獻自己的才能，往往帶來最大的幸福感。


    4. 責任。讓生活的意義不再只是為了成就「我、自己」，如果你一直都為了自己而活，那麼也很難達到「豐足」的状况。責任感，對你絕對有正面的意義，讓你超脫「越多越好」的枷鎖，對別人也有益處。如果把
    responsibility 這個英文文字拆開來看，可以發現，責任這個字，是由「回應」（response）及「能力」（ability）這兩個字拼起來的。你因為有能力，才能回應別人的需求。當然，責任的第一步是為自己負責，停止自散，誠實面對，讓自己的生活、工作與人生的價值平行發展，定義屬於自己的「豐足」。就像愛因斯坦在一九五○年說的，最終你會生活在一個更寬廣的範圍裡：「人是『宇宙』整體的一部分，存在於時間、空間中，人以為自己有想法、能感覺及透過經驗了解世事，就能獨立於他人存在。這其實是一種意識的錯覺，這種錯覺猶如一種牢籠，使我們受困於個人的欲望之中，只對最親近的人懷有感情。我們的任務應該是將自己從這座牢籠中解放，透過擴大同情心，在美麗的大自然中，擁抱所有的生命，以及萬事萬物。


    二十世紀美國哲學家、建築師及發明家富勒 (Buckminster Fuller)，也有同樣的想法。有人稱他為提倡地球永續的聖人，但在他二十幾歲時，曾因為兒子的去世及生意失敗，感覺人生無望，差點結束自己的生命。在人生極度痛苦時，他突然頓悟了：他的觸發及人生，並不屬於自己，而屬於全世界。富勒終其一生都在為人類尋找更好的生活方法，他的人生使命變成了：「讓這個世界，能用百分之百的人道精神運作，透過同時、一致的協同合作，在不傷害生態及不剝削他人利益的情況下，用最短的時間找到永續發展的途徑。」最後，數以萬計的人加入他的行列，把世界變成適合每一個人生活的地方，沒有一個人被遺忘或遺棄。


    想像你心目中「豐足」的情境。可以像富勒深信的，每個人都能有足夠的食物、能量、資源；或者像愛因斯坦描繪的，人類擴大同理心，讓我們能擁抱地球上所有的生命。充足的狀態，沒有一定的標準，你不用刻意去符合誰的期待，但必須盡可能讓自己心中的「豐足」境界得以完成。對每個人來說，這都是遠大的目標及理想，透過簡單的步驟及持續的付出，投入你的生命活力，盡力達到心中想像的「豐足」境界。如果你認同這樣的想法，現在拿起筆寫第四個問題。


    如果每個人都能找到他所愛的東西、滿足他的需求，在充滿同理的世界裡，你的每月收支表category：每個分類，會變成什麼樣的狀況？


