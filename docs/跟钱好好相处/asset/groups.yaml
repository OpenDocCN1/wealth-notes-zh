    泰咪曾經很迷惘，不知該如何選擇投資標的，也不知如何評估風險和回報。但现在，她决定在財務獨立之後，採取「先保障基本需求，再求超額獲利」（Enough and
    Turenue）的原則，分散自己的投資標的。她將大部分資金放在美國公債上，這樣，不管世界如何變動，她都有足夠的收入來滿足基本要求。然後把其他資金放在共同基金和指數型基金，風險稍大，但潛在的回報更多，當成她的藏金室。就算藏金室裡的錢都賠光了，她仍然保有財務獨立，再慢慢把藏金室裡的錢存回來。


