    距代表你能花的錢更多，但在學習之後，儲蓄的意義已經不同，在財務獨立計畫中稱為「資本」（capital）。資本不是用來放在銀行裡，是用來幫你賺更多錢。不管是五十美元或是五百美元，資本都可以為你的創造更多的收入。在步驟八及步驟九中，你會發現財務獨立不只是爭取省下百分之十或十的錢，當你真正做到聰明投資，不僅你跟金錢的關係會轉變，還可累積財富，創造人生一輩子的被動收入。透過步驟八，完全財務獨立的大門已經為你開啟。


    # 逐月收支表上的一條新線：每月投資收入


    投資賺來的錢跟工作賺來的錢有先天上的不同。不論你是否有工作，完成客戶要求的報告，或者有沒有達到每月營運目標，都會有投資收入，來源可能是股利、利息、租金或是分紅。不要把這樣的收入跟其他的每月收入混在一起計算，依據下面的公式，畫出另一條線用來記錄它：你的每月投資收入。


    # 步驟八：資本與交叉點


    每個月，依據下面的公式，把你的投資收入算出來，記錄在逐月收支圖上，


    資本 × 長天期利率／12（月） ║每月投資收入


    簡單來說，當你的逐月收支圖中，每月投資收入的線「跨越」開支那條線時，你就「跨越」'
  - '[PAGE 282]


    到「財務獨立」中了。


    你累積的資本就是你打算花用的錢（通常放在儲蓄戶頭裡），而公式裡的長天期利率，能用銀行的存款利息當基準，應該以美國公債利率為指標（三十年期），或是用定存存單利率。美國公債是目前用來衡量利率水準最好的工具（我們不是要你買公債，而是希望你把它當作利率的標準），可以用來估計長期投資的回報情況。用這個指標預估，並不代表你一定會有这样金額的收入的，它模擬了你在財務獨立計畫中，可能將會有的收入類型（第九章將詳細討論這個問題），從而預測你的收入。为了方便討論，暫且將利率定在四%，當你真的拿出錢投資時，並不能保證投資回報。當你真正投資，你可以建立各種不同的投資組合，這最終將決定你的投資報酬率（ROI）®。不管你投資了什麼標的，價格起起伏伏、漲漲跌跌，這是金融市場的特性，就算是最安全的投資，也難逃這樣的宿命。


    在這個階段，你不用擔心數字，先用這個利率當成基準就行。不過有趣的是，四%這個利率水準，通常也是用來衡量退休金狀況的指標，被稱為「安全提領率」（safe withdrawal
    rate）。這個數字的意義是，一旦你不再工作，若能從你的資本中每年提取四%的額度做為日常生活所需，這樣的退休生活就會是安全無虞的。能照顧基本的生活，也能對抗通貨膨脹，四%的利率水準，也被視為「金髮經濟」的指標。因為如果你每年提取三%，可能不足以支付開支；但若每年提取五%，老本可能會很快提光。請記住，這只是一個通用指標，不能當作財務預估工具。不論「安全提領率」或是長天期公債利率，四%是一個合理的標準。


    假設你有一百萬元的儲蓄，將這一百萬元的投資於支付四%利息的債券，那麼公式看起來就像這樣：


