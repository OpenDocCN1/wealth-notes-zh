    當譚雅仍在追求真正富足的人生目標時,參與了一些短期志工活動,她覺得非常喜悅。到哥斯大黎加或是肯亞,協助當地居民蓋房子,都帶給她內心真正的快樂。不過當地第一次從肯亞回國時,卻有一些擺脫不掉的感傷,因為雖然她親手幫了當地窮困地區醫院,但當地回國之後,肯亞仍是窮困之地。於是,她開始向那些到肯亞參加狩獵團的觀'
