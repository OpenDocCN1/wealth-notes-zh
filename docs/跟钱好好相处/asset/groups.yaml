    露營其實就是一種省錢的休閒方式，可以放鬆、接近大自然，又不必花太多錢。如果真要長途旅行，省錢的方法也不少。機票方面，網路搜尋引擎能找到最便宜的方案；如果你讓行程及時間保持彈性，就可以買到最划算的機票，通常只要一般價錢的一半左右；利用信用卡集點機制，累積里程、住宿扣抵或是現金回饋也是辦法。至於住宿，考慮當個「沙發客」，分租民宿或青年旅館，這樣不僅解決的問題，還可以接觸其他旅人及在地人士。也可以試試「以工換宿」，類似「世界有機農場組織」（WWOOFing
    World Wats Opportunities as Organic Farmers）這樣的機構，會提供全球各地有機農場或是永續農場的努力需求，你可以用勞力換取住宿及三餐。


