  - '[PAGE 137]


    的時間，實際時薪只有十美元。雖然你的狀況可能不同，但暫時先用十美元／小時計算。在這個例子中，我們以八十美元，除以實際時薪十美元，就得到了結果：你用了八小時的生命活力，在買雜誌及看雜誌這個興趣上。


    # 八十美元／＃＃八小時生命活力


    你得算看看，在床邊越堆越多的雜誌，到底用掉了你多少生命活力？這些時間可是無法重來的。從你出生到過世，這些時間是最重要的資產。你買了這些雜誌，不只是花了錢，這些雜誌用了你三種不同的資源：你買它們花的錢、你閱讀的時間、還有你因為沒有辦法在下期寄來之前看完的罪恶感（不論是否你要把它们堆在一旁，或是把它们扔掉）。


    這八個小時的生命活力可以有更好的利用及發揮嗎？如果用來在週五休假一天？你還會說，你沒有時間陪伴家人嗎？這是你已經養成的習慣？你可以把這個時間，用來補眠嗎？你有別的時間或方法補眠嗎？這些雜誌值得你花的每個小時嗎？真的給了你八小時的愉悅及學習？


    別馬上回答這些問題，注意！用金錢換取生命活力是一種人生的選擇，你要如何進行這個交易？第四章會對此更深入地探討。


    我們看看另一個例子：你要租房或是貸款買房？假設你一個月花在住房上約一千五百美元，以一千五百美元，除以實際的時薪十美元，等於一百五十，換句話說，為了住在這個房子裡，你每個月必須花一百五十小時的生命活力。以每週平均工作四十四小時（平均每個月一百六十六小時）計算，你每天必須花三十分鐘的生命活力，幾乎都是為了能支付你現在住的房子。你辛苦工作，換到了每天二'
  - '[PAGE 138]


    到三小時待在家裡的時間，這樣真的值得嗎？當然，因為房租或房貸可以抵稅，所以你也可以扣掉幾小時，但只為了「我可是生活在最貴的城市中啊！」的心態，就太可惜了。如果你已經有這樣的體認，真的非常好，記得我們之前的約定「別羞恥、勿責怪」，但也千萬不要欺騙自己，更別自憐自艾。


    現在，拿出之前製作的每個月收支表，把每個分類及次分類的金額，轉化成生命活力為單位的表格（你可以把數字四捨五入至半小時）。你的每月底收支表，現在有了一欄以生命活力為基礎的數字，見圖表3-1。


    # 一個表格抵得上一千字


    我們來看看實際將這個概念落實生活中的例子。


    看看羅絲瑪莉如何進行的。她已經將收支狀況轉化為圖表3-3，你有沒有覺得光從圖表3-3，就可以看出羅絲瑪莉獨特的個性，她顯然將不少錢花在讓自己漂亮這件事上，因為她有兩個類別是跟美有關的：美妝與追求美感。她很注重自己的身體，很願意花錢在保健上。從表格中也可以發現，她有一個「保持身體健康」的類別，例如：健康食品及健康醫療，而不是與看病相關的類別，如買藥及看醫生。表格中的「捐款」這個類別被獨立出來，而不是放在「雜項支出」，顯示她對公益事務頗在意。另外，「個人成長」（Personal
    Growth）這個項目，也是在制式的預算表中看不到的，這樣的自我察覺，跟傳'
  - '[PAGE 139]


