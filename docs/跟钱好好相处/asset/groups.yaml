    久而久之，你會發現收支圖已經開始變化，這反映出你與金錢的關係也改變了。這張圖代表你有沒有根據自己的價值過活，當然也體現出你在物質世界中所做的每一個決定。它帶來驕傲，但不是傲慢，代表一種深層的滿足感及人生目標一致性。一旦你有這樣的感覺，意味若你對自己的進度非常滿意，此時，你可以把收支圖從衣櫃中拿出來，貼在牆上給大家看了。現在想一下你跟金錢的關係，把你的財務狀況大剌剌地掛在客廳牆上，每一個進出的人都可以看得到，這種感覺如何？你覺得放鬆，還是緊張？你感覺輕鬆的程度，其實是衡量你的財務健康與否很重要的指標。如果你還是緊張，沒關係，依照計畫步驟繼續往前走，不安的感覺就會慢慢消失。


    # 財務獨立只是個「副產品」


    之前參與計畫的學員表示，改變與金錢關係的過程既挑戰又迷人。在結帳時，把每一塊錢仔仔細細算清楚，變成一種很享受的儀式，跟朋友敞開心胸聊聊金錢的事，也非常有趣。記錄每月收支是整個練習的重點，問問自己上上一章那三個重要的問題，會讓你很快的檢視自己的行為，是否與人生目標及價值吻合。一邊把收入支出數據畫在收支圖上，同時也檢視自己的金錢覺察能力是不是已經提升？依步驟執行了幾個月或一年之後，你會發現整個過程產生了令人震驚及滿足的結果：隨著收入持續超過支出，你終於從債務的泥沼中重生，並且開始儲蓄。以財務狀況來看，你可能會懷疑，這樣的情況真的達到嗎？會賞心樂，並不是因為你的收支客觀環境，而是你如何應對這些情況。許多成功達成財務獨立的學員中，不少人之前身陷債務，失業已久，有的沒有大學學歷，還'
