    你覺得儲蓄重要嗎？你真心覺得很重要嗎？請反覆思考一下。你延遲了夢想實現的時間嗎？是不是想說，等到我找到更好的工作或還清了債務之後再說？存款會讓你自己的形象變差嗎？它代表了你的青春？或是向父母投降嗎？


    存款在你的字典裡，是不是永遠是那個「有一天才會做的事」？你是認為所謂的「可支配所得」代表是把錢花光的那種人嗎？以你的財務現況，存錢對你來說是一個永遠達不到的夢想嗎？你信仰的宗教或是認同的政治團體怎樣看待儲蓄這件事？你需要把多餘的錢拿去捐助教會，幫助窮人或或是做其他公益嗎？這些問題不是要你现在就改變存錢的習慣，而是請你想想對存錢的認知，你能比較健全且從容地處理儲蓄這件事。把這些事情想通，存款自然而然會發生。


    之後的章節，我們會討論如何讓存款在你的生命中有更好的發揮。如果你的存款放在走存單或是一些債券商品上（例如：美國政府公債、公司債或其他 AA- 或以上等級的城市債），或是公司會提供一些員工理財商品服務，就算你不管這些存款，它也會隨著複利效應慢慢一點一點長大（第八章會仔細討論這個部分），開始得越早，你的獲利會越多，就是這樣簡單。有些父母就是因為這樣的考量，在小孩很小的時候就幫他們開了帳戶。隨著存款越來越多，如何有效分配這些資產很重要，跟聰明消費一樣，會成為重要的人生課題，做對了，就能以少換多。


    再強調一次，儲蓄是財務獨立的重要方法，儲蓄能讓你在職場這條路上更有勇氣，也讓你有機會探索生命中較忽略的部分。為了存款，你可能會開始接一些案子或是臨時工作。存錢會減緩你的流失與街頭恐懼，不在迫不得已的狀況下，做出錯誤的決定；存錢讓你有機會擁有更自由的人生，從債務中解脫，從朝九晚五中解放人生，萬一有突如其來的緊急花用，也能比較從容應對。儲蓄就像是在河底上蓋水壩，在水庫儲蓄起來未來人生的能量，讓資產能在銀行帳戶裡累積。有一天這


    > 編註：AA 為一種投資評等的等級，AA 級表示高等級的金融商品。'
  md: '

    當他在思考滿足感及生命活力花費是否平行發展的題目時，發覺自己在過去八年中的多麼無聊及辛苦，他也找到身陷困境的原因。首先，他一直以為，若要扮演好理財專家的角色，一定要有個豪華的辦公室，租金每個月花費他的生命活力高達兩千九百美元。他開始質疑價值在哪裡？事實上，這個辦公室功用極少，因為他大部分的生意，都是靠電話、信件或是在客戶的家中完成。他索性把辦公室搬回家中，每月花費只剩七百五十美元。


    第二個日常收支盲點是跟小孩的関係。海爾的孩子跟媽媽住，但生活一直靠他供養。養小孩的花費本來就無可厚非，但每次當小孩伸手跟他要錢時，因為感覺虧欠他們，他都不猶豫掏錢出來。他有九個孩子，花費當然不在話下，但不論海爾給他們多少錢，孩子們總是還要更多。經過了誠實及明確的評估，他知道孩子們被寵壞了，而始作俑者就是自己。他開始改變方式，雖然小孩跟他的關係沒那麼如膠似漆了，但海爾仍覺得這樣是對的，不能因為缺席小孩的成長，就不斷付出贖罪金。問了自己第四章的三個重要問題之後，他做了微調，現在花費只有以前的一半，人生也快樂多了。


    當然，不是每個人都像海爾一樣有餘裕，但我們看了上百個例子發現，平均執行三個月之後，花費就會自然、無痛且顯著地下降兩成左右。他們並沒有覺得生活被剝削，也不需要臥薪嘗膽，事情很自然就發生了。透過了解自已的支用模式，及使用生命力取得滿足感的關係性，一種自發性的機制就會被啟動，翻轉你之前的消費行爲。長此以往，你會發現自已不花錢也很自在，戒除盲目消費反而變成一種成就感的來源，因為你已經確信，無意識消費並未能夠帶來任何滿足感。


    ## 對焦人生


    有關於收支圖，還有其他一些事情要做。當你的支出下降時，不要忘記每個月還是問自己：「生命活力的使用，是否跟你的價值及人生目的一致？」這是一個重要的反饋機制，確定你的方向沒錯。


    你的人生宣言，反映生命的價值及目的，代表你真正想要的生活，具有很高的位階，因此得確定你每天的生活，與這個價值及目標一致。不過在實際生活中，這個最終目的容易被忽略，甚至跟每日作為有所差距，而你卻不自知。有時候兩者還會背道而馳，更糟的是兩者越離越遠，其至產生衝突，而你乾脆視若無睹，忽略內心深處的想法，甚至讓它嗶聲。聖經羅馬書七章十九節對人類的習慣有很深刻的描述：「我願意行行善，我沒有去行；我不願意做的惡，我反而去做。」


    我們記錄下來的資料，提供了日常花用的圖像，具體而實際地描繪我們的作為，這對於完成人生的理想及目標是非常有用的。當你的花用跟人生目標一致，就會感到完整及滿足，美好的感覺油然而生。如果兩者不一致，請自問：「我的花用，可以達成人生目標及價值嗎？」答案如果是否定的，那麼你可能就會對所做的一切感到失望，陷入自我批判否定的情況。


    通常，如果你的答案是否定的，花費就會隨時問下降，因為不少源於情緒或文化因素的非意識消費會減少，鈔票不容易從你的荷包裡流出。但也不一定是如此，你可能會發現，自己對某些人生目標非常感興趣，就一股腦兒栽進去，支出就開始越來越多。例如，你一直期許自己當個聲樂家，可能會自問：哪裡有好的音樂課我可以去參加？甚至還可能會思考：我是不是應該到義大利去念最好的音樂學校？碰到這樣的狀況，也許你應該在追求人生目的與維持財務長期穩定之間，尋求一個平衡點。換句話說，你也許可以參與地方的歌劇同好團體，那裡有免費的指導老師，你也可以找到志同道合的朋友。


    自我節制（如果把錢花在X上等於非常棒；如果把錢花在Y上等於非常差）可以發揮不錯的效果，打破以往機械式的花錢模式。自然而然地，你會開始越來越少投注金錢在那些無法幫你達到人生目標的事物上，你的狀況會越來越好；同時，你會把錢花在那些有助於達成人生目標的事物上，讓物質生活與內在認知同向發展。這樣的結合就是財務健全計畫的核心。


    就伊蘭記憶所及，她從來沒有人生目標，只是想過日子，盡量追求快樂，減少痛苦。她回憶童年最快樂的時光，就是跟家人旅遊時，漫步在森林裡面。在她開始進行財務獨立計畫時，她是家中唯一還會努力向上的人，其他兄弟姐妹，一個靠社會福利金過日子，一個已經自殺了，另一個變成遊民。擁有高薪的工作，一輛跑車及漂亮的房子，讓她看起來就是人生勝利組。當進行財務獨立練習、被問到上一章三個重要問題時，她原有的自滿受到了挑戰。


    她一直外在物質條件衡量自己的人生，她開始思考周邊的同事及朋友也一樣嗎？他們有比物質生活更崇高的理想嗎？有個同事的人生目標是拯救世界，受够了這個不太外在條件衡量人生的朋友啟發，伊蘭跟她變成了好朋友。不久，兩人都參加了當地的和平救援團，在那裡認識的朋友都會問自己一個重要的問題，如何可以讓自己的價值得到更好的發揮？到底要採取什麼行動，才能向世界傳達自己的理念？


    跟這些朋友開會，變成她的主要娛樂活動。以前她喜歡參加高價的工作坊，或去追逐最新上映的電影，現在她積極參加演講，報名慈善募款的攝影馬拉松。她在住家附近發現一片森林，每週都花上好幾個小時漫步其中。她的支出越來越少，生活費從每個月四千五百美元，降低到九百至一千兩百美元，且穩定地保持在這個水準。找尋生命的意義，變成她今後最重大的人生目標。


    問問自己第三個問題：如果你不是為錢工作，消費型態會怎麼改變？這樣做，可能會改變你的消費型態。以往參加財務獨立訓練的學員，在支出下降到一定程度後，會在下面畫一條退休後的假想線。移居到比較便宜的郊區應該會讓房貸或房租的開支下降；外食的费用可能整個不見了，這樣的進度會讓你更想要過上自由自在的生活，加速你退休的進度，你會更有意識地省下更多錢。


    如果你選擇提出第四個問題，「在一個公正和富有同情心的世界裡，我的開支會產生如何的改變？」或許沒有人能告訴你會發生什麼事。


    ## 「例外」的月份


    當然，人生中一定會有一些「例外」的月份，你的開支可能會跳躍式成長。繳交保險費、某些維修的費用突然增加、四月報稅，一年一度荷包會失血的日子，這些狀況要如何应付？你可以假設，每個月都會有例外性的支出，讓自己習慣應付這樣非經常性的支出，但絕對不要漠視這些花用：某個月可能要繳稅，下個月又有保險費，再下個月可能又出現醫療費用。


    還有一個方法，可以把整年需要繳交的類似費用，集合計算再逐月攤提。例如你的汽車保險，每年要繳八四一美元（先不要想應不應該買車餐車）*，你可以把這筆費用平均分配在十二個月份，其他費用如醫療保險、綜合所得稅及房屋地產稅，都可以比照辦理。


    ## 讓你的財務攤在陽光下


    沒有唯一正確的會計方法。你要選擇能夠提供你所需訊息的方式，以便在瀏覽收支圖時，知道你的位置以及要去的地方。


    現在登錄收支已經變成習慣，看到自己的進展，也會令你感到高興，你可以進行下一步了。該怎麼做呢？跟朋友談錢也許是一個不錯的開始。讓朋友知道你正在改變自己，而你同時也是一個好聽眾，當朋友提及財務狀況時，你會是個值得信賴的對象。但切記不要擺出顧問的姿態，你也必須把朋友當成是信賴的對象，讓彼此能相互提醒及鼓勵。


    在這個階段，非常多的學員會開始經營部落格，記錄財務獨立的進程及自我改變的心路歷程，也會把每月記帳及退稅的結果記錄下來。你應該開始經營部落格嗎？當然，我們鼓勵你這樣做，這是一個讓你成功達成財務獨立的好方法。喬以往在辦研討會的時候（在上一版的書中也曾提及），鼓勵大家把收支圖掛在每天看得到的地方。這樣做對你有百利而無一害，圖表能時時激勵並鞭策自己，是否仍然走在正確的道路上。


    有人乾脆把收支圖掛在衣櫥裡，或是掛在衣櫥拉門的內側，每天換衣服時就能看到。如此既能保有隱私，還可以日日提醒自己，在消費時不要忘記財務獨立的計畫，更不要忘記工作不再是「做一天算一天」的苦差事。工作不再是賺錢，而是能讓自己更接近財務獨立及免除生活恐懼的重要工具。這樣做是個提醒，也是個刺激，功效就像每天喝的咖啡一樣。


    艾薇一直以為過到了真命天子，這輩子應該跟貧窮沾不上邊，她有令人稱羨的生活，一個好老公、兩個兒子，一間有陽台及兩個大露台的宅大院，還聘請室內設計師打造裝潢，她也從不用擔心生活費用或帳單的事宜。想不到婚姻觸礁，人生一夕劇變，美好的生活轉眼成幻影。她離開了丈夫、房子、豪宅及高壓的工作，自己整理行李，租了一台搬家卡車，帶著兒子移居西岸。


    七年之後，透過參加財務獨立計畫，她比以前更自由了。她與朋友瑪格麗特組織了一個二十幾人的互助團體，彼此打氣分享財務獨立的過程及辛酸。他們每月見面，分享心得及成功經驗，當然也會討論一些困難，包括一些最私人的財務資訊。


    一開始組織團體時，她就想：「我的父母一定覺得我瘋了，因為我們被教育不能告訴別人你賺了多少，又花了多少……這是一種……一種，很不恰當的做法……」但她自問：為何我們不想這麼做？是害怕讓別人知道自己的財務狀況？她想通了，應該是害怕別人用財務狀況判斷我們的價值。一般社會人士很容易用幾個簡單的數字，就決定一個人值不值得交往。她勇敢地把自已的收支圖攤在大家面前，供參與者討論。想不到原本的懼怕消失了，她感覺到內心本來對金錢的顧忌不見了。錢花掉了，就是花掉了；錢賺進來，就是賺進來了，不代表其他意義。現在，她可以跟任何人討論自已的財務狀況，就像談論應該買什麼顏色的沙發一樣，沒有什麼好隱藏的。


    久而久之，你會發現收支圖已經開始變化，這反映出你與金錢的關係也改變了。這張圖代表你有沒有根據自己的價值過活，當然也體現出你在物質世界中所做的每一個決定。它帶來驕傲，但不是傲慢，代表一種深層的滿足感及人生目標一致性。一旦你有這樣的感覺，意味若你對自己的進度非常滿意，此時，你可以把收支圖從衣櫃中拿出來，貼在牆上給大家看了。現在想一下你跟金錢的關係，把你的財務狀況大剌剌地掛在客廳牆上，每一個進出的人都可以看得到，這種感覺如何？你覺得放鬆，還是緊張？你感覺輕鬆的程度，其實是衡量你的財務健康與否很重要的指標。如果你還是緊張，沒關係，依照計畫步驟繼續往前走，不安的感覺就會慢慢消失。


    ## 財務獨立只是個「副產品」


    之前參與計畫的學員表示，改變與金錢關係的過程既挑戰又迷人。在結帳時，把每一塊錢仔仔細細算清楚，變成一種很享受的儀式，跟朋友敞開心胸聊聊金錢的事，也非常有趣。記錄每月收支是整個練習的重點，問問自己上上一章那三個重要的問題，會讓你很快的檢視自己的行為，是否與人生目標及價值吻合。一邊把收入支出數據畫在收支圖上，同時也檢視自己的金錢覺察能力是不是已經提升？依步驟執行了幾個月或一年之後，你會發現整個過程產生了令人震驚及滿足的結果：隨著收入持續超過支出，你終於從債務的泥沼中重生，並且開始儲蓄。以財務狀況來看，你可能會懷疑，這樣的情況真的達到嗎？會賞心樂，並不是因為你的收支客觀環境，而是你如何應對這些情況。許多成功達成財務獨立的學員中，不少人之前身陷債務，失業已久，有的沒有大學學歷，還有很多的人來說，債務是沉重負擔，清償債務是非常重要的里程碑。一般人在債務沒有清除之前，通常都沒有辦法體會債務有多沉重，你的狀況如何？你深陷債務中嗎？你清楚現在欠多少錢嗎？你的債主有哪些人？你知道清償債務要付出多少成本嗎？或者一直到死，你都擺脫不了房貸、車貸及信用卡借貸的困境？


    ## 財務獨立就是徹底脫離債務


    許多大學畢業生走出校門的時候，身上除了用錢打造的畢業證書之外，還背負了數萬美元的學貸。有人幸運地找到工作，以為從此一路順遂，買車慶祝自己好不容易畢業了，沒想到身上又多了另一筆債務。但可能會有小說，喂，我有全職工作耶，花個兩萬美金買輛車，應該不為過吧？他不知道，這樣的做法定會讓自己左財務獨立的起跑線上，又倒退不少。那些把債務視為理所當然的人，通常會把還款金額調整得越少越好，其實這樣會降低收入。


    他們不了解，用信用卡借錢買新的音響以慶祝加薪，其實會把賺進來的錢又掏回去。動用車貸買車，最後付出的總額，一定會比車子原本的定價還高。如果你用三十年貸款買房子，最後付出的總金額，會是原來定價的兩倍至三倍（依當時的房貸利率決定）。不同的研究結果都顯示，喜歡用信用卡消費的人，比用現金支付更會花錢。


    有必須照顧一大家子的，或是住在貴民燈。他們沒有人可以倚靠，僅能以有限的資源繼續前進。所謂的財務獨立，最嚴格的定義是指，你必須有選擇的自由及自主支配時間的能力，因為在固定薪資之外，你已經有足夠的收入支應生活基本需求及溫飽；但財務獨立也有比較寬鬆的定義，就是從債務泥淖中掙脫出來並且儲蓄。


    理財專家蘭西(Dora Rance)不斷呼籲大家,如果要跳脫債務陷阱,就趕快剪卡,讓信用卡消失在生活中。現在越來越流行的線上支付(paynow),借錢也很容易,在網路上就可以核貸,會讓人越貸越多。每當你在線上消費一次,就像液晶螢幕上的一個畫素一樣,不斷累積,我們花的不再只限於你賺到的錢,借貸消費代表你正在燃燒未來的資產。借錢已經變成美國人的生活方式,就是因為借錢,讓我們不得不跟工作緊緊綁在一起;也是因為借錢,讓我們得一直工作到死。為我們過往的歡樂,焚書繼墓地賣命;還有為那些可能永遠享受不到的奢華,付出自己的青春。


    譚雅曾形容自己的工作是「白天暴忙,晚上才能輕鬆一下」。她在家高科技軍火公司裡,擔任圖像設計的工作,同時也熱中投身教會各項活動。因為她身上背了兩萬六千美元的負債,讓她的人生好像沒有其他選擇,不斷有人跟她說沒有別的辦法,於是她對金錢的察覺就變弱了。但財務獨立計畫,像一面無情的鏡子,也拯救了她。


    她設計了一個「走向無債一身輕的日子」的圖像,貼在收支圖上,還設計了有魔鬼難用的數字貼布,緊緊追蹤自己資產總額的變動情況。「我想像自己是一根快要燒盡的蠟燭,或是一夕間輸掉了一大筆錢。「她這樣跟我們說,結果不到兩年,在沒有加薪也曾感覺生活被剝奪的情況下,她達成無債一身輕的目標


    當譚雅仍在追求真正富足的人生目標時,參與了一些短期志工活動,她覺得非常喜悅。到哥斯大黎加或是肯亞,協助當地居民蓋房子,都帶給她內心真正的快樂。不過當地第一次從肯亞回國時,卻有一些擺脫不掉的感傷,因為雖然她親手幫了當地窮困地區醫院,但當地回國之後,肯亞仍是窮困之地。於是,她開始向那些到肯亞參加狩獵團的觀光客招手，募集他們帶不走的醫藥用品。


    譚雅那時已經沒有背負任何債務了，她知道自己下一步應該怎麼走。她了解肯亞人民常常因為牙齦腫大而死亡之後，索性辭了工作，把房子及車子出租，飛到肯亞協助當地牙醫診所。因為沒有債務，出租房子及車子的所得，就夠她在肯亞鄉下生活，譚雅終於取得財務獨立了。因為沒有債務，她得以追隨自己的心願。


    脫離債務，就是一種財務獨立的方式。因為沒有債務，你可以選擇自己的方式生活，不管外在經濟環境如何，你都可以很驕傲、自在及尊嚴地說：「我沒有欠任何人任何東西」。


    一旦脫離債務，人生選項就變多了。當每一分錢、每一張支票都是你自己擁有的時候，你會變得很強大，就像譚雅一樣，可以到遠方完成心願，或是追求夢想。當然，你可以開始享受轉變之後的人生，隨著你的花費越來越少，在你的收支圖上，所得及支出的距離會越拉越大。這個距離，有一個美麗的名字，叫『儲蓄』~（見圖表5-2），儲蓄也是另一種財務獨立的表現。


    ## 當一個儲蓄達人


    你現在存了多少錢？還有負債嗎？還是正在還清債務中？或是把你賺的錢全部花光？你的儲蓄率是在財務獨立邁進很重要的指標，關於要存多少錢，有一個概念可以參考：如果你花掉所有的月薪，那你永遠無法退休；如果你的收入一毛都沒花掉，那恭喜你，你已經財務獨立了，再也不需要為賺錢而工作。


    在這中間的大多數人呢？就像我之前提到的，參與計畫的人，大部分花費會少兩成左右，他們甚至不知道在改善之前，把錢花到哪裡去了。然而，一旦你發現自己的收支圖開始轉變，那表示有一盞明燈已經點亮了。你存的錢越多，離財務獨立越近。存錢其實就像遊戲一樣。


    例如，檢視你的日常支出，你發現每餐中的肉類占據食物類別支出的最大部分，那麼你就可以把每餐肉類的比例減半，或是減少每週吃肉的次數。有個理財部落客就決定在一年內不買新衣服，結果他發現這樣做一點也不難。


    一個人住，對你來說可能太奢侈，你可以考慮把多餘的房間租出去。多一個房客，可能讓你的退休時間早一點，甚至提前四年以上。這樣做不僅可以多一些收入，像早起床氣或是堆在水槽的碗盤，這些壞習慣也比較容易戒掉。這樣的改變，比較容易持續，真的能戒掉一些惡習。


    曾經聽一個長期援助街友的人說過，大部分的美國人其實離街友人生很近，只要生活中多出兩筆支出，可能不少人就得流落街頭。甚至有些長期觀察美國消費債務的大學教授說，兩筆支出算是保守的說法，很多美國人因為消費過度，離街友人生不遠，只要生一場大病或是突如其來的急用支出，就會讓一些美國人流落街頭。


    聯準會在二〇一五年曾經發布一項報告指出，四成七的美國人，如果碰到四百美金左右的緊急支出，就會被迫借錢，或是賣掉一些財產才能支應¹。為何像美國這樣的富裕國家會有這麼多人得過這種生活？


    如果你有存款，失業其實不會這麼可怕；如果你有儲蓄，就算沒有了固定薪水也不用變賣財產；甚至還可以藉這個空隙，發展一下你之前工作時無法從事的興趣或志向。你可以帶著全家一起出遊；你可以背起背包去世界其他地方看看；你可以趁機閱讀；你可以把以前一直沒時間做的事情一一併做完；也許做點小生意，或是發揮你創意的潛力，繪畫或是創作音樂都行。你有多一點時間，好好找到適合自己志趣的工作，也可以上大學或是研究所進修，讓你的人生溢階，以後找工作也許更容易。你可以選擇做志工，搞不好就可以留在那個機構，變成全職人員；重新跟家人建立感情，這些都值得試著做看看。問問自己：如果一年不用工作，你會做哪些事？如果腦袋一片空白，也別太意外，每天夜以繼日的工作，占據了你的腦袋，暫時淹沒了你的夢想及渴望。


    持續地問問自己，同時探索其他可能性：如果你有一定的儲蓄，不用為了賺錢而工作一年，那你會選擇做哪些事情？


    你覺得儲蓄重要嗎？你真心覺得很重要嗎？請反覆思考一下。你延遲了夢想實現的時間嗎？是不是想說，等到我找到更好的工作或還清了債務之後再說？存款會讓你自己的形象變差嗎？它代表了你的青春？或是向父母投降嗎？


    存款在你的字典裡，是不是永遠是那個「有一天才會做的事」？你是認為所謂的「可支配所得」代表是把錢花光的那種人嗎？以你的財務現況，存錢對你來說是一個永遠達不到的夢想嗎？你信仰的宗教或是認同的政治團體怎樣看待儲蓄這件事？你需要把多餘的錢拿去捐助教會，幫助窮人或或是做其他公益嗎？這些問題不是要你现在就改變存錢的習慣，而是請你想想對存錢的認知，你能比較健全且從容地處理儲蓄這件事。把這些事情想通，存款自然而然會發生。


    之後的章節，我們會討論如何讓存款在你的生命中有更好的發揮。如果你的存款放在走存單或是一些債券商品上（例如：美國政府公債、公司債或其他 AA- 或以上等級的城市債），或是公司會提供一些員工理財商品服務，就算你不管這些存款，它也會隨著複利效應慢慢一點一點長大（第八章會仔細討論這個部分），開始得越早，你的獲利會越多，就是這樣簡單。有些父母就是因為這樣的考量，在小孩很小的時候就幫他們開了帳戶。隨著存款越來越多，如何有效分配這些資產很重要，跟聰明消費一樣，會成為重要的人生課題，做對了，就能以少換多。


    再強調一次，儲蓄是財務獨立的重要方法，儲蓄能讓你在職場這條路上更有勇氣，也讓你有機會探索生命中較忽略的部分。為了存款，你可能會開始接一些案子或是臨時工作。存錢會減緩你的流失與街頭恐懼，不在迫不得已的狀況下，做出錯誤的決定；存錢讓你有機會擁有更自由的人生，從債務中解脫，從朝九晚五中解放人生，萬一有突如其來的緊急花用，也能比較從容應對。儲蓄就像是在河底上蓋水壩，在水庫儲蓄起來未來人生的能量，讓資產能在銀行帳戶裡累積。有一天這


