    # 廉價的快感與深層的悸動


    有個享受簡單生活的祖父想要把人生觀傳承給孫子。有一天孫子很高興地跑來，告訴祖父他的新發現，「爺爺！我知道幸福是什麼了！」「是什麼？」「祖父問，他想孫子應該是聽到足以跟他人分享的好想法，「就像你買到了非常棒的东西！」「消費帶來的廉價興奮，就類似這樣的感覺；就像在彈子台上全贏的快感，這種刺激很難持續。但如果你完成了一個夢想，結果又比預期好多，那種成就感帶來深層的振奮就會很不一樣。這才是人生真正的喜悦。」「蕭伯納在著作《人與超人》（Man
    and Superman）的前言中寫道，「人生真正的歡欣，在於體認到自己擁有強大的力量，正在為一個偉大目標努力。自己不只是自私渺小、只顧獨自發光的鼮鼮，成天抱怨世界無法帶給你'
