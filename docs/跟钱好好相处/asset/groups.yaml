    ### 幸福是什麼？


    假如每天辛苦工作可以換來快樂，那麼一點點不爽或不方便好像是值得的；假如我們相信我們的工作會讓世界更美好，犧牲睡眠及生活品質，也不會覺得被剝奪；假如用辛苦錢多買一個玩具，帶來的不僅是經濟上的滿足，而是心靈上的激勵，那麼工作也會快樂點。但很明顯地，金錢除了能滿足基本的生活安穩外，並沒有辦法帶來我們所要的幸福。


    在我們舉辦的論壇中，不論收入多寡，幾乎所有的參與者總是認為擁有「更多」才能帶來幸福。我們請參與者為自己幸福指數評分，一是困苦，五是很幸福，三則是「沒有什麼好抱怨的」，再跟他們的所得水準比較。在一千位參與調查的美國及加拿大人中，無論他們的收入是一千五百美元，還是六千美元，平均幸福指數為二．六至二．八（連三分都不到）（見圖表
    1-1）。


