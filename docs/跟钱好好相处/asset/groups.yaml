    快樂，而是擁有天賦的龐大力量！」Ⓜ廉價的興奮來自於外在的獎勵，深層的振奮則「在於體認到自己擁有一個強大的力量」。廉價的快感，稍縱即逝；深層的振奮，持續不墜。每個人內在的滿足，就是深層振奮的量尺。


    # 建立內在量尺


    建立內心量尺的最重要工具，是你自己的覺醒。問題——協助你建立衡量滿足感的內心量尺，在過程中，希望能去除不健康的消費習慣。大多數人用外在條件（量尺）衡量自己的滿足感，布瑞利安以在學校授課的經驗，歸納出滿足感的衡量標準如下：


