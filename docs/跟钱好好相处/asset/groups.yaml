    \n圖表 2.3 是一筆兩天的記憶紀錄，注意一下每筆支出都有細項，每一項與工作有關的支出，也清楚標示。注意一下，這個記錄表也標示買零食及電池的地方，相同的物品在便利商店、雜貨店及百貨公司的價格都不一樣，帳目中的「小計」（subtotal）及「細項」，都已經四捨五入了。雖然我們滿鼓勵能準確地記下來，但像衛生紙、酒這些項目，要記得這樣仔細，確實會花很多時間，但最後加總的時候，金額一定要弄對，最好能到每「分」（penny）。\n\
    \n### 每一分錢都要記？\n\n這樣的過程，最主要的目的是要讓每一分進出你生活的錢都被記錄下來。「為何要這樣做？」「你可能會問，「時間真的需要這麼長嗎？」「因為這樣，你能知道錢是如何走進你生活，又是怎麼樣離開的，絕對跟你記帳之前想的不一樣。直到今天，大部分的人對於這樣小量交易，又是每天要做的小事，還是顯得不經心。我們常常用「省小錢、花大錢」（penny-wise，pound-fool）當藉口，我們可能跟另一半仔細討論，要不要花七十五美元，買一個車床工具，但卻不願看看一個月我們的荷包進了多少钱，又出了多少錢。殊不知這些不起眼的小錢，這些月結的數字，可能比七十五美元還多呢！\n\
    \n你可能會問：「但我們真的要記每一塊錢都記下來？」沒錯！每一塊錢！為何要每一塊錢，而不是記一個大概，或是四捨五人只記個整數？因為這是要養成我們一生受用不盡的好習慣，畢竟\n"
  mdcn: "\n太久了嗎？看看下面的情境：「這星期工作實在太辛苦了，我們到鬧區中好好瘋狂一下吧！」「讓我們逃離這煩人的東西，到拉斯維加斯週末狂歡吧！」真的需要這樣做嗎？以生命活力或是金錢計算，這樣在付出的代價有多大？在辛苦了一週，埋首無聊的工作之後，週末的娛樂活動真的有補償作用嗎？當然，有一些文化活動能提升心靈、滋養生命，若將生命活力用在這上面，可以豐富人生；或是你特別去學了藝術，這種花費不能算在逃避式娛樂中，因為這是生命的提升，跟工作無關。讓我們假設，平均適用於逃避式娛樂的時間為五小時，費用為四十美元。\n\
    \n### 五小時／週，四十美元／週\n\n### 度假\n\n把時間花在旅遊，或到不同的地方，體會另類的文化及自然，是人生非常棒的經驗。但每年度假是因為需要找一個角落恢復元氣，以便回職場打拼，那就屬於跟工作相關的花費了。例如你因為工作太辛苦，懶得規畫旅遊，乾脆把一家人帶到巴哈馬群島，你自己就在躺椅上放鬆，這也算是與工作相關的花費。但如果你把家中多餘用品賣掉，拿這些錢到巴哈馬做志工，評估珊瑚的健康狀況，這可能也應該算在提升生命的費用上，只有你自己知道，這些花費應不應該算在工作帳上。還有什麼呢？度假小屋、遊艇或是露營車，這些用來逃離都市及工作的工具，若把這些加總除以五十（週），我們假設每週你必須花五小時，三十美元在因工作衍生的度假活動上。\n\
    \n### 五小時／週，三十美元／週\n\n### 工作帶來的病痛\n\n你因為工作而生病的比率有多高？因為壓力太大，身體負擔太重，因為想要有表現，工作太劇，或是與同事及員工起衝突？\n\
    \n至善科學中心（The Greater Good Science Center）這個組織，一直致力於倡導用科學方法提升生命意義。他們的研究發現，幸福感能增加心臟健康、強化免疫系統、對抗壓力、減少疼痛並延長壽命。在我們自己的經驗裡，志工身體出現問題或是怠工的情況，都比一般受雇員工低很多。日子過得簡單、快樂及富足的人，相對健康許多。在這個項目中，什麼樣的疾病會歸因於工作，要花多少時間及金錢治療這些衍生的疾病，難免會有內在感覺及主觀的認定。我們假設，每週我們平均大約要花一小時，或約二十五美元的費用來看醫生、拿藥及處理這些病痛。\n\
    \n### 一小時/週，二十五美元/週\n\n### 其他因工作產生的花費\n\n檢查步驟一中的資產負債表，有沒有有些本來不會支出，但因為工作才產生的花費？在「請人幫忙」的項目中：請清潔公司打掃家裡、請人整理花園，雇用傭工處理家務，或是找保母。如果你沒有工作，這些支出還會存在嗎？不管是單親或雙薪家庭，托兒所是一個不小的開銷，如果你沒有工作，這個開銷其實不會發生。找時間精算你一週的生活，多少花費是跟工作有關？\n\
    \n在網路上充實資訊，或是為了建立人脈：晚上出席工作上的社交活動，為了舒緩另一半因為工作挫折而從事的活動，仔細找找，有沒有「一些因為工作衍生的隱藏性支出，那些職場進修訓練、課程、書籍、會議，都要算在裡面。每個人的狀況都不一樣，但基本原則相同，找出你自己的實質\n\
    \n> 參見：Kira M. Newman, “Six Ways Happiness Is Good for Your Health,” Greater Good\
    \ Magazine, July 28, 2015, http://greater-good.berkeley.edu/article/item/six ways_happiness_is_good_for_your_health.\n\
    \n### 精打細算真正的時薪\n\n現在，把這些數字整合成一個表，把因為工作所耗的時間（例如：通勤），加上平常的工作時；另一方面，計算因工作衍生的相關花費。再加上一些一次性的重大花費，例如：度假及醫療費用，把其餘以五十週（我們假設一年五十二週之中，你應該有兩週的假期），如果你為了要重新獲得工作動力，從事了一次度假旅遊，花費約一千五百美元，那麼就把它除以五十……當然這種特別的一次性費用，大部分是一個概括的數字，不會太精確，但請多用點心思，讓數字盡量精準。\n\
    \n圖表 2-2 示範了計算你真正時薪的過程及數據結果，在你的人生中，每小時或每分鐘可能的花費。以上的數字是隨機的，你自己的數字和支出項目可能跟這個很不一樣。如果公司有給你一些福利（例如保險，或是退休金準備），記得把這些加進你的正常時薪中。因為不是每家公司或是每個受薪族都有這樣的福利，所以我們在這裡並沒有把這些算進來。\n\
    \n圖表 2-2 清楚的呈現了，在這個例子中，你每小時生命活力的價值才十美元，而不是表面上看到的時薪二十五美元。真的！你的時薪只有十美元，還沒繳稅哦！問題來了，你願意接受一個工作只付這樣的時薪嗎？（在每次轉職時或換職位時，你都應該重算一遍。）\n\
    \n這個數字很值得玩味，案例裡每支出一塊錢，等於花掉六分鐘的生命活力，下次當你花二十美元，買一些可有可無的東西前，好好想想這個數字。試著問自己：這個東西，真的值得花掉一百二十分鐘的生命活力？花在這兩小時，我得忍受擠在火車上、陷在車陣中的通勤；或為了保住工作，焦慮地尋找下一位客戶？記住，這個圖表還沒有把一些花在想方法升官的時間算在裡面；也沒有把處理家庭生活不安（因為工作負擔太重）的時間算進來；更沒有把平衡工作及家庭生活所需的花費及時間算進來。工作的影響是無遠弗屆，影響你整個人生。\n\
    \n當馬克做完了這兩個步驟，他的人生完全改變了。他在建設公司擔任產品經理，已經十年。「我做這份工作其實並不快樂！」但他寫道：「在收入還可負擔生活支出的狀況下，我就阿\
    \ Q 地想，『生活在大都市裡，不就這樣嗎！』」不過，馬克用了步驟二，好算了一下他的真實時薪，「在分析我的消費模式後，事情變得比較清晰。我賺的錢一半都花在與工作相關的事物上，油錢、保養、午餐、東花一點西花一點，大部分的钱就這樣花掉了。總之，我覺得我可以改做兼職工作，就在家裡上班，雖然收入只有之前的一半，但真的存到了錢。」這時他才了解，他可以放棄正職工作，尋找人生真正想要追求的目標。所有的事情都因此改變，他的財務人生改觀了，多年來，他不願面對的財務狀況改善了，準時繳交信用卡帳單、節省不必要的外食，同時跟老婆共同討論財務事項，不再像之前常常口角。當他們重新安排經濟生活，才發現靠老婆的正職收入，整個家庭還是可以過得很好，老婆也能從事她喜歡的特殊幼教工作。而馬克對諮詢師及治療師的工作很感興趣，如此自己也有時間回學校再進修。「壓力的變得比較輕，以前我們忙於修補與金錢的關係，所以跟它的關係弄得很糟，現在我們知道，與金錢關係不應該只是鈔票的多寡而已！」\n\
    \n### 為何要這樣的練習\n\n1. 這個練習用一個比較全面及真實的面向，來看待全職工作這件事，並且，讓大家都知道，自己真正的薪資是多少，就是表中最低層的數字。\n\
    \n2. 這個方法用你真正的薪資當作指標，更真實地評估自己現在及未來的職場生涯。按照步驟及最後得到的數據及結果，可以檢視自己的工作狀況，如果一個工作，需要很長的通勤時間，或是需要花錢治裝打扮，薪水可能就沒有表面上的數字多。考慮轉職的正確指標應該是，你想要讓你的生命力用多少錢賣出去？\n\
    \n3. 了解你真正的所得（earnings），會讓你更清楚到底工作的動機是什麼，選擇工作時也較有所依循。馬克的例子並非個案，把錢花在從工作衍生出來的費用上，主要就是为了保住工作，很多人卻始終認為自己很有錢。而另一個進行財務獨立計畫的人，他說做完這個練習之後，他對工作相關支出更敏感也更在意，因此使得淨收入增加了一倍——旦了解日常花費有多少是為了工作後，他免除了不少開支。例如，他開始帶便當，省了外食午餐的花費，以前自己開車上班，現在改乘大眾運輸（在搭車的過程中順便自我舒壓，是另一項多出來的好處），也省思是否需要這麼多不同樣式的服裝，甚至開始每天跟太太健走（也因此改善夫妻關係）。不少人以這個方法當作指標，用來選擇工作，當算清楚真正時薪之後，更能判斷這個工作到底值不值得繼續做下去。有一些曾經很想應徵的工作，用這個方法驗證，發現根本不值得ㄧ試。\n\
    \n### 檢查表：生命活力 vs. 薪資\n\n時間  \n小時／週\n\n金額  \n元／週\n\n- 通勤：\n  - 車輛維修\n  - 油錢\n\
