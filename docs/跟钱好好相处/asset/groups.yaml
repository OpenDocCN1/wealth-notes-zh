    # 處理你的債務及財務


    簡約生活的最重要條件之一就是避免欠債，畢竟，你已經做了這麼多努力讓口袋裡有錢，得珍惜這個很重要的優勢。既然已經如此，就不要再讓錢又流出去，再次進入債務的循環中，拖累邁向財務獨立之路。有人乾脆所有開支全部用現金支付，但許多身上本來就已經有負債（如：學貸、房貸或車貸）的人，因為想要趕快進入簡約生活的步調中，因此選擇盡速付清欠債，最簡單的方式就是用信用卡或現金卡借錢，但這樣的做法只會讓自己進入另一個負債的循環中。我們一再強調清脆高利息債務的重要性，更重要的是，要徹底避免再次借錢。信用卡借款很方便，有人也認為這樣'
  - '[PAGE 222]


    可以累積點數，但這不是每個人都能做，除非你確定在月底能連本帶利地全部付清，否則絕對不要輕易嘗試。我要強調的是：每個月！若做不到，就使用現金或是簽帳卡，包括金額比較大的汽車貸款或是其他分期付款。再強調一次，除非雙方開出免利息的優惠，或是你有信心能在期限內還完借款，在這樣的情況下，你才能考慮使用分期付款。


    如果以上說的你都做不到，無論你消費什麼，都請用自己口袋裡的錢購買，絕對不要再跟銀行借錢，因為還得支付利息。不過，有些債務可以視為投資，如果你用貸款買的物件，未來會增值，你的購買力也能夠隨之提升。如果你每個月都能如期繳息，你住的區域不動產的價格又穩定上升（不是那種暴躁地段，因為漲多易形成泡沫，泡沫破掉，買氣就會停滯），那麼你可以試著借一些利息低且利率固定的貸款。這樣，也許會是一個聰明的投資。特別是你付出的利息，還可以抵稅。許多人認為，還清房貸讓房子完全屬於自己，會使生活過得更舒服，因此會想盡辦法早點把房貸還清。


    年輕人為了美好的未來，也會利用學生貸款就學。但當你將學費視為人生重要投資的同時，當然也不希望一畢業剛出社會就背負沉重的債務。最好的方法是爭取獎學金，避免免費發生。如果做不到，也要想辦法在短期內把學費還清，同時別忘記要扣繳你的所得稅。如果你在學生時代已經借了錢，務必確定每個月都能還錢，否則你的債信會受損；一旦債信受損，你以後可能借不到錢買房子或是租屋；若急用時要動用信用貸款，利率也會比較高。現在不少銀行都會提供線上服務，並會給予用戶利息折抵，善用它也是不錯的選擇。美國有一些類似銀行的金融機構叫
    Credo、Credit Union（信用社，這種合作社的業務基本與銀行相同，但規模要小很多，一般都是地方性質），收取的手續費比較少，存款利息也比較高，不妨試試看。不管你的銀行是哪間，千萬不要提領超過你'
