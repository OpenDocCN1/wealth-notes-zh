    # 如果我真的不想要「工作」？


    有不少人不想「工作」，開設工作室、創業、打零工，或者接案子。在零工經濟當道的狀況下，還是會有人選擇回歸傳統，投入正職工作；但其他人可能喜歡擔任自由接案人，或是選擇短期工作。有些教練或是顧問，他們的工作重點在經營客戶，而非服務單一雇主。有些人運氣好，真正在過財務無虞的日子，他們因為祖先庇護，或是中彩券，讓生活過得更有創意更加多彩。其中，當然也有曾經參加過財務自主課程的學員，重建自己與工作的關係，把工作與薪資的膽幣切掉，對於全職工作有全然不同的新看法。


    然而，越來越多的人希望透過以錢養錢的方式來建立自己的財富。從當沖、選股、建立投資組合到買賣房地產，這些人在本業工作之餘，利用各種方法，擴大投資回報。就本書立場來看，做一個當沖客、與實驗室中擔任研究員、科學家，或是大型工具操作員並無二致，都是工作的一種。有時候，這些投資者的表現比他們高中同學都要好得多；有時候，他們在投資上的所得，會比本業收入還高出許多；有時候，他們也會被市場修理。


    其實靠投資賺錢，不像從事護士或房地產經紀人，這樣地貼近財務自主課程的主旨。無論你賺錢的方法為何，都需要權衡生命活力，讓生命活力的使用發揮最大的價值。評估投資活動的價值，應該與衡量工作的價值一樣，問問自己：「每小時真正能賺多少錢？」第八章和第九章將介紹的投資方法，其途徑與財務自主課程的主旨較貼近，讓投資活動能變得更有智慧、完整和獨立性。'
