    這樣的過程及紀錄，給了羅絲瑪莉很有價值的資訊，讓她知道自己生活中的優先順序，她也因此有具體的數字，追蹤自己的生命活力放在哪些重要的事務上。每個月像進行重要儀式般將數字填在自製的表格上，就像是玩一個精彩的遊戲：這個月收支表會呈現什麼樣貌？跟上個月比較起來，數字會向上？還是往下？跟前一年平均的數字比較起來又是如何？趨勢是向上？還是往下？現在我們來看看另一對夫妻，是如何建立自己收支的分類，又是如何追蹤每個月的收支情況。


    曼蒂與湯姆住在緬因州的鄉間，他們兩人的職業南轅北轍，湯姆是卡車司機，曼蒂是一個會計；但兩人個性很合得來，彼此在溝通及財務覺醒上也都很一致，支出及收入也共同支配。當他們在進行財務整理時，兩人的每月所得也合併計算，盤點結果，兩人的質實時薪是十．二三美元。從圖表3中可以看出，曼蒂調整過的每週工作及相關投入的時間是七七．五小時，湯姆的工作時數是六十七．五小時，兩人加起來為一百四十五小時；曼蒂每週加總的所得為〇八〇．三一美元，湯姆的每週所得則為四〇二．五美元，如果把這兩個數字加總為一四八二．八一美元，再除以實質薪資十．二三美元，可以得知他們每花一塊錢，等於動支六十分鐘的生命活力。但在加總數字分析後，發現不應該把彼此的所得加起來一起看待，應該分開計算，才看得出他們不一樣的生活型態。'
