  - '[PAGE 134]


    # 加總


    提醞大家，市面上確實有不少軟體或 APP 提供各種不同記帳功能。但這個課程的重點，是協助大家將支出分類，就算是最好的軟體，也不能替你決定，你的高爾夫球證，應該是屬於娛樂還是工作相關的支出？因為高爾夫球場，可能是你談生意的重要場合。有一件事要確定的，軟體或程式不應該是左右你成功記帳的關鍵，很多喜歡自己動手記帳的人，也會藉由自動計算或標註顏色的方式幫忙，讓工作做得更好。


    有人自己編了代碼，記在一張小卡片上放在皮包中，一且有消費就趕快記在卡片上。我也看過有些人，用銀行給的對帳單或是表格作為記帳的開始。有一些線上平台可以讓使用者把銀行的帳戶及信用卡紀錄統整，客製化屬於自己的紀錄，但你必須花點時間過濾這些紀錄。


    這些工具都非常好，關鍵在於要找到適合自己的方法。本書的兩位作者，都使用最古老的方法，用紙筆一一記下來，這樣的方法非常有效，常常在使用計算機之前，對收支已經有清楚的圖像。不管你用手記或是依賴資訊工具，這些簡單的程序一定要做，在每月底統計你零星記錄的收支，轉換成你自己的月報表。把你的收入加總起來，你會得到一個總數；同時也把支出加以加總，並在大部分類及次分類下面，都得到一個小結，請把所有的支出計算清楚，最後，每月總支出就會出現了。


    # 結餘


    接下來，算算你的口袋裡、小豬撲滿或銀行帳戶裡還有多少錢。你應該清楚在這個月中，有'
  - '[PAGE 135]


    多少錢進入，又有多少錢流出，如果你記的帳都沒有錯（或你沒有遺失任何錢），你當月總帳戶中的錢（現金加上銀行帳戶的金額），應該會等於月初的結餘加上月底的收入減掉支出的金額。如果記帳過程中出錯（或者你真的在這個月丟錢），就會出現對不上帳的情況。無論如何，把這個月的收入減掉支出，就是你這個月存下來的錢。恭喜你！你已經完成了一項小奇蹟，圖表3-2就是每月收支的紀錄，但這只是一個小例子、小示範。在這個過程中最有趣的地方，往往是你製作出屬於自己的資產紀錄。


    # 讓錢看得見


    我們來到這個課程的重要關鍵：「魔術鑰匙」（Magic Key）階段。你已經有一個正確紀錄的收支表，但你還沒學會應該要如何重建你跟金錢的關係。在你把日常的收支，用小紙片或者是小工具紀錄下來之後，其實已經有些小成果。一開始這樣地記錄開支時，你看到成果，可能會有些情緒起伏。但隨著新收支不斷地進來，你又會把錢花在可有可無的東西上，很快你就會忘記之前的感覺，例如你一個月花在買雜誌上八十美元，雜誌卻跟你的生活沒有重大關係。但別忘了，金錢是你用來換取生命活力所付出的代價，計算一下你用了八十美元換到了多少生命活力，使用下面的公式：


    買雜誌的支出÷實際時薪＝每小時的實質生命活力


    在第二章，我們簡單地算出，雖然表面上你的時薪是二十五美金，但若計算其他因為工作花'
  - '[PAGE 136]


    # 圖表 3-2 月底結餘圖表樣本


    （單位：美元）


    **第一部分**

    | | | |

    | :--- | :--- | :--- |

    | 公式 | | |

    | 月初金額 + 本月收入 - 本月支出 = 月底餘額 | | |

    | 月初金額 | 手上現金 | 103.13 |

    | | + 支票帳戶 | + 383.60 |

    | | + 存款帳戶 | + 1,444.61 |

    | | | 1,931.34 |

    | + 收入 | + 本月收入（見每月收支表） | + 2,622.23 |

    | | | 4,553.57 |

    | - 支出 | - 本月支出（見每月收支表） | - 1,996.86 |

    | = 月底餘額 | = 你在月底擁有的錢 | 2,556.71 (A) |


    **第二部分**

    | 月底實際餘額 | 手上現金 | 173.24 |

    | | + 支票帳戶 | + 597.36 |

    | | + 存款帳戶 | + 1,784.69 |

    | | = 月底擁有的錢 | 2,555.29 (B) |


    **第三部分**

    | 每月誤差 | 每月帳戶應有金額 (A) | 2,556.71 (A) |

    | | - 每月帳戶實際金額 (B) | - 2,555.29 (B) |

    | | = 記載錯誤或是遺失 | 1.42 |


    **第四部分**

    | 存款： | 本月收入 | 2,622.23 |

    | | - 本月支出 | - 1,996.86 |

    | | ± 每月誤差 | ± 1.42 |

