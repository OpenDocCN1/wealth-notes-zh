    下，你得把正職工作設定成只為賺錢的工具，但還是盡你所能，妥善運用自己最珍貴的生命活力。這樣做的原因，不是為了貪念，或是在職場上贏得勝利，是為了肯定自己及珍惜寶貴的人生。不僅健全人生，更能讓負債減輕存款增加，有更多的時間及精力追求想要的志業，結交更好的客戶，照顧家庭，並尋求更寧靜的心靈。


    # 步驟七的重點摘要


    善用你的生命活力，能投入在你想做的工作上，藉此增加收入，同時保持身心的健全發展。'
