    # 但我真的很愛我的工作？


    如果你喜歡你的工作，金錢和工作關係的新思維（重視你的生命活力），會豐富你的人生並增加收入。


    曼蒂（卡車司機湯姆的伴侶）非常喜歡會計的工作，她認為透過工作，可以協助大家對金錢增加責任感。在執行財務自主課程時，她發現個人財務中的盲點。當計算自己每小時的真正時薪時，她發現表面上，她每小時能賺九十美元，但實際只有七．五美元的淨收入。她的丈夫湯姆在緬因州農村擔任卡車司機的收入，都比她好。這些錢去哪了？原來，她為無力負擔會計諮詢的人免費服務；對於收入較低的客戶，也提供非常好的折扣，所以她工作時間很長、開車里程很多，但真正的收入卻相對低廉。她的每月收支表上顯示，她在經濟上沒有取得任何進展，她忘記了計算生命活力的重要意義。


    她決定把諮詢的報價提高二二%，並縮減人力只留下一名秘書。此外也開始限制客戶數，將力量集中在協助那些願意自我改善的客戶，同時調降每週的工作時數。改變之後，她發現這樣的客戶人數及客戶品質正是自己所要的，現在工作時數雖然降低，但收入卻反向增加。


    的半年則用來娛樂，投注在旅行、藝術、志工上。有些人一天只工作四小時，讓孩子放學後，自己可以陪伴他們。兼職者可以勇敢跟老闆提出需求，重新談判休假時間，每週只工作二十四小時，或爭取遠距辦公的機會，不必像全職員負擔前顧後。'
  md: '

    讓他像唐娜一樣的熱情。她開始研究另類執業的可能，最後得出結論，就算身在傳統的婚姻框架中，儘管與丈夫不同調，女人也必須活出自己的生命。


    隨著自己體會日深，唐娜重新評估她的診所。她的員工不想要跟主流醫療院所一樣長時的生活，但不願意少賺一些錢，因為傳統醫院之所以收高額的費用，是要支付醫生的薪資。唐娜認為需要改弦更張，但這樣的產業生態，不斷將她拉回到舊的工作方式。


    「要嘛我必須採取不同的方法，要嘛乾脆都不要做這行！」對於唐娜來說，財務自主的宗旨，就是從舊的思考中重生。金錢、工作、生命的意義和目的，都會跟著這個大方向調整。「如果新型醫療做法的代價，是少賺一點錢，那就這樣吧！」


    唐娜並不孤單。「新美國夢中心」（Center for a New American Dream）曾進行一項全國性調查發現，近一半的美國人已經做出了改變，雖然賺的錢比較少。調查顯示他們很滿意這樣的改變，雖然收入減少，但壓力也相對減輕，更能讓生活保持平衡，休閒時間也更多。


    ## 2. 減少工作量，可以活出內心真正想要的


    我們大多數人是因著外在大家庭境，決定自己的生活方式。就像中國餐廳的料理一樣，每個人都制式地在大分類中選擇自己東西。從「求職」的廣告分類中選擇「消防員」；從條件中選擇「金髮和藍眼睛」；從要生幾個小孩的問題中選擇「兩個」；在個人風格中選擇當「隨便」的人；在諸多汽車品牌中選擇「豐田」；從政治光譜中選擇藍派；從購屋條件中選擇「公寓」。


    將多元的面貌塞入「工作」要求的條件中，除非你是藝術家或企業家，否則你必須按照別人安排好的事項行事才能拿到薪水。職場中存在著一種微妙而不負責任的氛圍，因為我們總是在別人的要求下做事，並盡量取悅其他人。


    在大公司中，大多數員工都不知道究竟是誰制定了這樣的工作規則，迫使我們在這框架下努力做事。而且這些公司不僅控制職業，還控制我們個性的發展，看不見的企業文化，甚至管制我們與誰談話、穿什麼、「吃」什麼樣的午餐。必須加多少班，才會被長官「看到」？更影響日常生活的各種選擇。顯然地，如果把賺錢當作是目標，那麼我們就會採取所有可能的方法，企圖在職場中能有最好的方式生存。但是，如果你把自我與賺錢拆開來，就像你將工作與薪資關聯切斷一樣，你就可以重拾失去的自我。當你重新認識自己，重新釐清價值觀、信念、才能以及什麼事是你該關心的，你才能從內而外地、舒坦地工作與賺錢，也不會因工作而失去自我。


    瑪格麗特正在重新調整自己，從活在別人的價值中（從外部生活），轉變為為自己而活（從內而外）。她離婚，有兩個孩子，是個有強烈責任感的單親媽媽。她希望盡可能賺錢，讓家庭生活更美好，她放棄了原本的教学工作，成為一名經過認證的理財規畫師。佣金是她重要的收入來源，不同產品有不同的抽佣比重，她常常陷入佣金與客戶利益的衝突裡。這讓瑪格麗特痛苦不已，認為應該盡快跳出這個循環中，她停止一味追求銷售的手段，這讓身體變得更好，但她個人的財務卻出現狀況。所幸，她加入了艾薇成立的個人理財的支援團體，開始實施財務自主計畫。當按步驟實踐時，她發覺小組的每一個成員都越來越可以按照自己的價值觀行事，雖然從此狀況不同，但他們願意跟隨自己的想法走。例如，有一個女性團員看到自己的才華在傳統框架中不斷被浪費掉，「他們付給我我的薪水，根本不值得我用這樣的痛苦換取！」於是她辭掉工作，靠儲蓄生活一段時間，直到找到另一個工作為止。


    所有改變都是在執行計畫的過程中發生的。


    ## 3. 重新定義工作，讓我們成為自己生活的設計師，而非只是賺錢工具


    在工業革命之前，大多數人都是農民，他們大都能夠打造、維護和修復日常生活所需的一切。之後工業革命，特別是資訊和科技革命，讓我們開始出售自己小部分的才華及時間，來換取我們需要的錢。失去了工作就有了收入來源，但仍然必須背負抵押貸款、車貸和卡債。然而，切斷工作與薪資之間的掛鉤，你對人生「剩下的時間」就開始有主導權。


    我們可能沒辦法回到以前那種凡事親力親為的生活環境，但只要能享受無薪工作，債務就會越來越低。我們可以開始學習親手處理各種雜事，或者自己建造碼頭，或建立一個網站或部落格……當停止為金錢工作時，我們可能會失業，但並沒有失去工作。你的所有作為，最終都可能成為薪酬，你在生活中學到的技能，以後可能會成為你的報酬，在一項工作中獲得的技能，可能會成為另一項工作的收入。


    在一份工作中，也許可以學會交易的來龍去脈，熟悉之後就可以離開那份工作，輕鬆地自己進行交易，也許產生不少利潤。職場變成學校，工作成為表現自我的舞台。無論是否有薪資，你都是自己的老闆，開拓自己的道路。


    ## 4. 重新定義工作，為退休生活增添生機


    退休並不意味著停止工作，而是意味著你可以停止為金錢工作。我們都希望對他人有貢獻，並希望貢獻被認可。如果認為有償工作是人生中唯一可受人尊敬的貢獻方式，那麼誰願意退休？沒有人想成為一個被時代淘汰、被丟在一旁沒人問津的廢物。把工作和工資分開，意味著你在每一個角色、任務和活動中都是有價值的。它可以讓你早日退休，你就可以把更多的自己貢獻給別人。


    ## 5. 重新界定工作，重視無償活動


    南茜厭倦了聽到自己說：「我不知道自己的方向在哪？」每天晚上她都看著自己的行程表嘆氣，為何事情還有這麼多沒做？但她記錄自己的支出，認為自己應該可以掌控。每隔十五分鐘，她就會記錄一下自己的錢及時間花到哪裡去。她很快地了解到，她把大部分時間花在了不重要的活動上：清潔、烹飪、購物和與家人聊天。


    她的行事曆上只記載了與工作相關的事物，同事會面，回覆電子郵件，其他大部分時間都不在行事曆上。她發現，如果打掃房子能夠賺錢，她會把它列入清單。打掃家裡當然沒有人會付她錢，因此不會出現在紀錄上，現在她記錄所有自己做的事，為所付出或無償工作感到自豪。無酬的活動往往被視為毫無價值，但它們的價值真的低於有償工作嗎？我們的文化幾乎普遍相信，如果沒賺錢、沒有職業，也沒有受雇，就是一個無用的人。其實，只要內心開始自我發展，心靈也逐漸邁向成熟，就能夠評斷自己的作為，這就是一種工作，與有償工作及家庭雜務一樣重要。


    花時間去了解自己，思考、禱告，發展一套自己的生活哲學和道德規範、設定個人目標和評估進度。將工作和薪資的關係切斷，停止痛苦地接受工作賦予的自我認同。


    ## 6. 重新定義工作，讓工作及玩樂完美結合


    工作是認真的，玩樂是輕浮的；工作是大人的事，玩耍是幼稚的；工作是有用的，玩是無用的；有時玩遊戲可能看起來像工作，就像一場激烈的國際象棋比賽。有時候工作看起來甚至被稱為玩樂，就像在職業體育競賽一樣。有時候，工作會讓人覺得非常喜歡玩，人們會說（有點愧疚），這份工作非常有趣，我不應該拿薪水的。——如何分辨工作和娛樂之間的差異呢？玩耍和工作都可以是有競爭力的，也可以是合作的。


    它們既能建立技能，也能獲得成就感，兩者都讓你進入專注、集中及轉變的狀態。事實上，一個人若完全投入一項活動，外面的人會不知道他是在玩，還是在賺錢。這是把工作和薪資分開看待的魔力，你可以重新連接工作和娛樂，人生會變得很享受。


    ## 7. 重新定義工作，讓人們享受更多休閒娛樂


    對於希臘人來說，休閒是人生最高的境界，一種自由的本質、自我發展和更高層次的人生追尋。然而，身處於二十一世紀初的我們，無法真正放鬆和享受休閒，即使在字面上，我們把休息時間稱為「暫停」（Pause），但其實只休息了幾分鐘，就又回頭去工作，當一個充滿生產力的螺絲釘。如果我們沒有為錢做事，就能享受休閒時間。玩樂在人生中絕對是必要的，在樹蔭下放鬆聽小鳥啾啾是應該做的事情；隨意散步也很值得；把電子用品留在家裡快樂去露營吧！花一些時間獨處，做你任何想做的事；無所事事到處找樂子也是人生必備；休閒不會讓你失去自我，只要你別只為工作而存在。也許因為工作深入到人生中的每一個小時，我們沒辦法專心一致從事真正的休閒活動，只能抽空小旅行，三不五時還必須查看手機，查看朋友的訊息，社交媒體的動態，或是追劇。一旦將工作與薪資分開看待之後，我們在工作時會比較專注，休閒時也會集中精神在自己選擇的活動上。


    ## 8. 重新定義工作，為「生計」打開了新的曙光


    「理想的生計」，指的是找到你真正想要從事的行業，或真正喜愛的工作，我們的財務自主計畫，巧妙地避開了這一崇高努力的陷阱。沒有人可以向你保證，你會找到真正願意賣命工作的老闆。就算你自己創業，可能會花上許多年的時間尋找生意機會，或是找得對的方法或是對的技術能力和投資人。群眾集資是一種創新的方法，不必苦等政府補助，但位於倫敦的「眾籌中心」（Crowdfunding
    Center）在一零一五年的一分報告發現，有七至九成的群眾集資計畫都以失敗收場。


    失敗的原因大都與你的產品或服務無關，反而與運氣、機會、毅力、關係、種族或性別以及其他因素有關。但選擇離開受薪人生，也許可以讓你的生命更完整，你可以自己做主賺錢，也可以追隨內心真正想做的事情。你可以提前做退休時的計畫，依照財務自主的九大步驟，就可以實踐你的熱情及夢想，把上班的歲月當成是實現夢想的先修班。在這段受薪的歲月中，累積自己的經驗、工作技巧，當然，建立自己的人際網絡也非常重要。不論你現在對工作的不滿意度如何，如果覺得它不是你愛的，你要告訴自己，不要安於現狀，積極尋找下一個能安頓身心的工作，及達成財富自主的目標。


    > ※ 參見：Catherine Clifford, “Less Than a Third of Crowdfunding Campaigns Reach
    Their Goals,” Entrepreneur, January 18, 2016, https://www.entrepreneur.com/article/269663.


    學習合氣道的人都必須進行一個「不屈的手」的練習：面對對手，把手腕放在對手的鎖骨上，當對方用雙手把你的手肘往下帶的時候，你就必須抵抗，幾個來回後，應該能掙脫。然後放鬆身體，就可感覺到能量從腹中通過，經過手臂流出，就像水從消防水管中奔放地流出一樣。這樣的對手再也無法折你的手臂。把人生的注意力只放在賺錢上，就像把你的活力分散掉。記得，一次得做兩件事，與不屈的手一樣，你要專注於抵抗你的對手（工作獲得報酬）或將你的活力擴展到無限（人生的召喚）。


    在生物學中，動物學家莫里斯（Desmond Morris）曾進行一個實驗，把猿猴的「利潤動機」（profit motive）放在實驗中。第一步是教牠們成為藝術家，教牠們非常可愛的繪畫和繪畫作品（margotines）。一日牠們的「藝術」作品完成，他就開始「付錢」，用花生獎勵猿猴。在獎勵制度下，藝術作品的品質快速變差，為了獲得花生，動物們開始敷衍了事。


    「商業主義」摧毀猿猴完成藝術作品的動機，爭先恐後地搶食花生。如果把你的工作與生命召喚看成是同一件事情，你的生活重心將逐漸從使命轉向金錢。實現財務自主，你必須解放思想，最終釋放你的時間，這樣不論職業為何，你都會擁有一不屈的手。


    想像一下，如果你運氣好，找到理想的工作、另一半及賺錢的方式，但人生突然發生了變化，管理階層換血，部門被裁撤，團隊被解散，你重新面臨金錢與使命的掙扎。如果你認為工作和薪資是脫鉤的，你應該知道真正想要的「工作」是什麼，並評估能否在不用妥協的情況下，做自己想做的事。


    > ① 譯注：必須讓整條手臂充滿動力，連手腕、手指都要這樣做，這樣才能攻擊對方的手。

    >

    > ② 參見：Desmond Morris, *The Biology of Art* (New York: Alfred A. Knopf, 1962),
    158-9.


    ### 對你收入的影響


    如果，對於現在的工作，你只將其當成是人生的一個過渡階段，只是要領一份薪水餬口（不論你喜歡還是討厭這份工作），你就可以評估一下把珍貴的生命活力花在這一面上到底值不值得。雖然，你的人生比工作更重要，但找一份待遇很好「工作」，存到自己想要的錢，也是必要的。財務自主的第七步驟，重點就在這裡。


    ## 步驟七：重估你的生命活力，最大化你的收入


    我們要探討的，是重估你用來累積收入的生命活力，看看它是否足以交換到你的人生及健康。


    當你拿起薪資單，算一下薪資及其他打零工的収入，列出所有的綜合收入時，是否真的覺得你用生命活力做成了一個好的交易？從失敗人生走出來，重新拿到生命自主權的關鍵，就是衡量你的生命活力。錢是你用生命活力交換之後得來的產品，而你也了解，工作最重要的目的就是賺錢，不要天真的認為，既然目的是賺錢，就一定要每個小時都盡可能賺到最多的鈔票。雖然以傳統標準來看，這主意好像沒錯，但若真的這樣做，你就會走入另外一個不同的方向。從步驟一走到步驟六，你了解很多事情，包括未來大概會有多少錢流進口袋。你應該已經拋棄了所謂的「豐足」就是一種「現在還要更多」的概念，也應該不會再責怪自己逃不出窮人的困境，你更應該知道，豐足的生活其實沒有想像中的遙遠。


    請記住，『豐足』不是只能賺取過日子的基本開銷。「豐足」是一種富足、沒有多餘的狀況。正如第五章中指出的那樣，你的收入可能可以支援這樣的豐足生活。少花一點你辛苦賺來的錢，減少投注在工作上的時間，你就可以過一個豐足的生活，這是簡單的算術。如果每月賺進兩千五百美元，是你的富足生活標準，那表示你只要每小時掙到二十五美元、每月工作一百小時，就可以滿足開支。如果你一小時可以賺到五十美元，那每個月只要工作五十八小時就足以支應。你也可以把一半的錢省下來，可支用的金錢就更多了。


    現在，讓我們回到工業革命之前人類的生活方式。你自己經營小生意或農作，每天工作兩、三個小時，剩下的時間用來放鬆、做有趣的事、自我發展、人際互動、社區參與或服務社會。如果你選擇在有薪工作上花更多時間，那麼，理由一定比賺錢充分許多，因為我們人生的最高理想是善用自己的生命活力，而不是透支它。你這麼做的原因，可能是因為教養責任，也可能是希望早日擺脫債務的困擾，享受一下財務自由的暢快感受；你可能想多存一點錢，當經濟氣候不穩定時，能多一份安全感；或者，你想要達到另外的人生目標，例如：回學校念書、環遊世界或是追求財務獨立。


    你的目標大小和強度，將決定你投入工作的時間和精力。你甚至可能非常希望在正職工作外，還有好幾個業外收入可以拿，這樣的職場人生會更加快樂。如此，就算加班，生活也不像以往感覺被剝奪，反而是有更大的目標值得努力。


    蘿絲瑪莉從工作中解放了！我的意思是說，她在工作之餘，可以朝著超越人生目標前進，從旅行到寫作，到可能拯救地球的目标。她是一個活動策劃專家，在退休銀髮之家工作，但她不想把人生全部放在工作上。她清楚地了解，現在掙得越多，就可以越早實現其他目標。她沒有試圖尋找另一份薪水較高、但壓力可能較大的工作，反而利用兼差賺錢。她的第二份工作，是在一家小型音樂公司，每週利用晚上和週末的幾個小時，賺取另外一份收入。工作時間很有彈性，同事很好相處、壓力也不大，每小時賺的錢，跟自己的正職差不多。雖然每週工作時間遠超過四十小時，但精神及活力都處在非常棒的狀態。


    重視你的生命活力和追求最高的薪酬，與「越多越好」的心態無關。如果金錢等於生命活力，那麼透過增加收入，就能增加可用的生命活力。根據每個人的時薪不同，一輛新車可能需要一個月、六個月或一年的工作時間，你不需要靠賺更多的錢，贏取更多的社會地位、聲望、權力或保障，你知道錢買不到這些東西。你需要更多的錢，是因為你想要有更多的自由去做自己，而不必擔錢。同樣，你不會想用更多的錢提高你的自尊，但你確實需要更多的錢，成就自己的人生，發揮生命活力。


    ## 工作的其他新選項


    你現在有幾個創意選項可以選擇，利用兼差增加收入、改善目前的工作狀況，或換個工作。


    ### 高薪是一種態度問題


    很多人對收入的多寡都很消極，甚至是宿命論。他們在受害者心態下行事，完全受到外部勢力的支配：老闆、工資級距、失業狀況、經濟衰退、在地景氣及政府的經濟政策影響，還有來自發展中國家低薪工人的競爭……上班族的態度往往會變成：「我找不到一份好工作，都是因為他們，他們讓我從事低薪工作。」雖然經濟現實有時是苛刻的，但會這樣想，有一部分是人類精神的本質所致。


    一個限制你的收入的可能重要因素是「態度」：對自己的態度（例如「我不夠好」），你對工作或雇主（「他們都在搞我」）的態度，及對當前情況的認知（「就是找不到好工作」）。如果你認為自巳是一個受害者，那麼你很可能會忙於自我怨懟，忽略了周遭很多足以改變命運的機會。為了人生富足，培養積極、自信的態度與尊重，對工作付出你的貢獻，與雇主和同事的密切合作，盡最大心力完成工作，維持個人的誠信，勇於承擔責任，才不會枉費你的生命活力。仔細思考，如何發揮自己的生命力，這樣可能會改變工作的表現，也才能找到下一個更好的工作。記得，無論你在哪裡工作，你都在為自己工作。無論做什麼，都要致力於追求卓越及百分之百誠信。是你自己決定工作是否能帶給你充實的感覺，而不是職位好壞或大小。


    在第六章中談到的木匠泰德認為，財務自主計畫最重要的啟發，就是讓他有機會與想成為作家的願望重新連結。他在一個軍世家中長大，因為父親職業的緣故時常搬家。他在密西西比州的格爾夫波特（Gulfport）完成了高中學業，然後搬到了德國的奧斯汀，他雇了八個人成立一支室內裝飾的團隊，但一場火災讓他一夕全無。接著又離婚，所有財產裝到一輛卡車中還有剩（因為家徒四壁，要做到財務自主的步驟一，變得非常容易），但他沒有倒下，最後在俄勒岡州，重新建立人生。


    在實施財務自主計畫的一年後，泰德有足夠的資金，支持自己一年的生活。他決定嘗試寫作，把多年以來的故事寫出來，包括他七零年代初在密西西比州，與一些非裔的木匠建造了一座浸信會教堂的故事。為了騰出更多時間寫作，泰德開始拉高室內裝潢工班的報價，想以價制量。結果大出意外，許多老客戶對他的表現印象深刻，願意付更多的錢請他裝修，他接到的案子及單價都比以往高很多。為了不打壞招牌，他更加在意施工品質，名聲越來越廣，為他帶來更多工作。他工作時間減少，收入增加，焦慮減輕，心情也平靜下來，有更多時間寫作。他很驚訝，但他知道這個好運及尊榮其來有自。


    ### 用兼職工作取得財務獨立


    財務自主計畫使得泰德選擇了兼職工作，這種金錢和工作關係的新思維，讓人生有了新展望。以往社會普遍認為，兼職工作的人，人生價值也只有一半，因為得犧牲全職的許多好處，你會失去醫療保險及公司提供的退休保障，也失去升遷的機會。但新時代的觀念已經改變，兼職工作意味著你可以花更多時間，投入在自己的目標及想法；你給了雇主你的生命及時間，為公司換得了財富，但工作卻無法帶給你個人的價值。


    兼職人生可以五花八門、五彩繽紛，有些人每週只上班幾天，有些人一年只工作半年，剩下的半年則用來娛樂，投注在旅行、藝術、志工上。有些人一天只工作四小時，讓孩子放學後，自己可以陪伴他們。兼職者可以勇敢跟老闆提出需求，重新談判休假時間，每週只工作二十四小時，或爭取遠距辦公的機會，不必像全職員負擔前顧後。


    ### 但我真的很愛我的工作？


    如果你喜歡你的工作，金錢和工作關係的新思維（重視你的生命活力），會豐富你的人生並增加收入。


    曼蒂（卡車司機湯姆的伴侶）非常喜歡會計的工作，她認為透過工作，可以協助大家對金錢增加責任感。在執行財務自主課程時，她發現個人財務中的盲點。當計算自己每小時的真正時薪時，她發現表面上，她每小時能賺九十美元，但實際只有七點五美元的淨收入。她的丈夫湯姆在緬因州農村擔任卡車司機的收入，都比她好。這些錢去哪了？原來，她為無力負擔會計諮詢的人免費服務；對於收入較低的客戶，也提供非常好的折扣，所以她工作時間很長、開車里程很多，但真正的收入卻相對低廉。她的每月收支表上顯示，她在經濟上沒有取得任何進展，她忘記了計算生命活力的重要意義。


    她決定把諮詢的報價提高二二%，並縮減人力只留下一名秘書。此外也開始限制客戶數，將力量集中在協助那些願意自我改善的客戶，同時調降每週的工作時數。改變之後，她發現這樣的客戶人數及客戶品質正是自己所要的，現在工作時數雖然降低，但收入卻反向增加。

