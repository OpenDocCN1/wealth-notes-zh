    一直沒有被滿足、感覺被剝奪。在進食時，你必須真的知道自己在吃什麼。本書說的財務自主，基本方向跟「正念飲食」很接近。


    +   1. 你必須體會並跟著發自內心的信號走，而不是依據外部警告（cereal warnings）或積習已久的欲望。


    +   2. 你的眼光要長遠，體認並調整你的消費模式，而不是指改變短期的花錢方式。


    這並不是依照你的預算跟標準的科目行事；也不是根據每個分類，把收入按比例分配運用；更不要求你每個月都發誓，自己一定會做得更好；當然也不是怪罪自己。這樣做，是希望能分辨並確認真正的需要是什麼，而不是隨著欲念行事；也確定怎樣的消費行為才會帶來真正的豐足；什麼才是你自己定義的「豐足」，這些才是你應該花錢的地方。


    這個計畫最主要的目的，是幫大家找到真正的自己，而不是用一個外在的框架，規範大家的行為，這個目的是否能成功達到，取決於你的坦誠及專一。這也是這個計畫跟其他成千上萬的財務健全方案不一樣的地方。這個計畫的重點，在於覺察、富足及選擇，而不是制定預算或感覺被剝奪。


    步驟二 我們要開始訓練「覺察肌力」，你會覺得自己狀況不好、很難克服。但事實上，跟著步驟作為並不會有任何痛苦，還挺好玩的！'
  - '[PAGE 123]


    # 別羞悖、勿責怪


    記得我們的宣言：不要感覺丟臉，也不要怪罪任何人。坦白面對你生活中曾經做過的選擇，是一項挑戰。何其有幸，你能檢視自己，而不是被國稅局查稅；何其有幸，你現在就能做這樣的練習，而不是在人生最後時刻才開始做。不要感覺丟臉，也不要怪罪任何人，當你想要躲躲於床底下，不想見任何人的時候；當你一直想花錢，忘記過度花費帶來困擾的時候；當你想要放棄這個活動時。不要感覺丟臉，也不要怪罪任何人。


    安妮塔非常需要這個宣言，協助她重新檢視衣櫥，建立新的覺醒。她熱中於買衣服及搭配衣服的首飾，已經到了無可自拔的地步，她是個購物成癮的年輕人。每一次開車出門，都忍不住要到大賣場逛一下，看看有沒有新的促銷活動。這樣的行為模式對她來說，已經成為一種儀式，可以讓自己感覺舒適，這幾年的戰利品，全部展示在衣櫥裡。她並沒有因此滿足，還是一直買衣服，但她日漸發現這麼多新衣服連標籤都沒拆，為了撫平不安，她把衣服當作禮物送給別人。把自己從來沒穿過的衣服送給親友，安妮塔覺得有趣，久而久之，購物的衝動越來越低。有一天她站在百貨專櫃前，看著新款顏色的毛衣，突然一個念頭：我的人生真的要這樣過嗎？這樣下去，我會變成什麼樣子的人？我在做什麼？我已經有夠多的衣服了。結果，她竟然空著手走出了百貨公司，經過了這次的經驗，安妮塔發現自己，再也不想到處購物了！'
  - '[PAGE 124]


    如果安妮塔按照傳統的方法，用編寫預算的方式控制自己的花費，她可能永遠不知道自己是衝動型消費，到現在還是一個購物狂，不願承認自己有这样的問題。用覺察及同理心，檢視自己的血拼行為，你就能看到自己有的已經夠多。對於購物，安妮塔現在已經相當「敏感」，也因此有些之前跟她走得很近的購物同好，也日漸疏離，但安妮塔現在覺得人生更豐富。在這個故事背景下，我們進行步驟三，建立你自己的每月收支表（Monthly
    Tally）


    # 步驟三：每月收支表


    在步驟二中，我們已經把每個月的收入及支出記錄下來，以了解你生活每一分錢的去向及來源。現在在這個步驟中，你必須依據自己獨特的生活方式（不是ㄧ些超級簡單的記帳分類的食物、房租、衣服、交通及醫療）；把支出及收入的細項寫清楚，就是用這些制式的預算格式，其中的細項也要巨細靡遺，這樣有助於建立自己生活的圖像及消費模式，這很有趣也頗具挑戰，這些科目及細項就像你獨特消費模式的百科全書。


    這些紀錄會成為你生活型態最真愛的描述，就算雞毛蒜皮的事，或是ㄧ些小失誤，都能記錄下來，這些細節的描述就是你人生淨收入。忘記那些你生活中的迷惘；忘記你曾經告訴別人有關自己的故事，忘記你的履歷表及所屬的機構，當你開始進行步驟二，你會看到ㄧ個更清晰，更真實的鏡子，反射出你真實的人生、你的收入及長久以來的支出，在這個鏡子中，你會看到你用來賺錢的時間，真正換到的是什麼。'
  - '[PAGE 125]


    # 。食物


    在建立帳目時，你必須坦誠，也務必正確紀錄，但不能雞蛋裡挑骨頭。除非你跟一般人非常不同，否則應該會有一個叫作「食物」的分類。


    當你記錄食物花費時，有好幾種不同的分類方式可以運用，也容易記錄。你可能會在家，與家人一起吃飯。你也可能請朋友或在家吃飯，因此你的帳本中，就會有兩個不同的子分類：「自己在家吃飯」、「請客人在家吃飯」。但千萬別太龜毛，不要把請客餐桌上，客人吃了什麼，又花了多少錢，全部記錄在你的小本子中。


    但必須估計你備菜的花費，有多少是因為請客產生的。例如，通常只有你跟另一半在家吃飯，但有一次請了四個人來，這樣你就可以概算，晚餐三分之二的支出，是因為請客產生的。總支出的記錄單位，必須細到一分（Cents），但多少是因為請客衍生的費用，得用估算的。在食物這個大項，當然少不了「外食用餐」這個項目，從工作時外帶午餐到外出晚餐，都要記錄。


    如果外食不是偶一為之，或已經變成一種例常性且昂貴的習慣，你必須在記錄時把情境寫上去。例如，外食是因為「太累了不想煮飯」，或是「為了某個特殊原因」。如果你每天忙於工作，從出門到返家可能長達十二小時，為了睡足八小時，你恐怕沒有機會開伙，這時就要把細項及原因寫清楚。


    如果你沒有辦法拒絕零食的誘惑，也要記下來，或者你是個咖啡控，務必把每個月的咖啡花費也一一記下來。如果你看電視時，喜歡吃洋芋片、爆米花、飲料或糖果，也要記清楚。你也可以更進一步地分類，區別「健康食品」及「垃圾食物」，以便知道自己對食物的偏好及習慣為何，或是對有機食物有多擁護。如果你確實地記錄，這張表會顯示你所有消費習性及模式。一般傳'
  - '[PAGE 126]


    統的記帳表格，只粗略地把「食物」放在一個大類，沒有辦法看到你的消費習慣。


    但若你改變一個方法，依照我們教的這樣做，不是希望我跟理財顧問談時能坦誠以對；而是在你大聲抱怨「我的錢，到底花到哪裡去了？」我明明沒有買什麼東西呀」的時候，可以清楚而明白地發現，原來你都一把錢花在公司三樓的那個糖果自動販賣機中了！」


    # 住房


    在「住房」這個項目中，可能會有房貸（或租金）、水電、租賃減免額，也可能有分租給遊客的短期租金收入。你也可能不只一間房子、一間在郊區、一間在海邊，或是在市區中有一個小公寓，把支出及收入確實登記，可以讓你知道租房子有沒有比自己買房子還划算。


    以前傳統的觀念會希望你把收入的四分之一配置在住房上，但在現代的社會中，花費在住房上的比例可能會高到四成甚至更多。如果你確實用白紙黑字記錄下來，也許會發現，其實有很多聰明瓣法能將住房的費用大幅減低，甚至降到零。有一對在科技業上班的夫婦，因為可以在家上班，換言之辦公地點無處不在。利用這種方法，他們夏天時在北半球的都市生活，冬天時則到朋友的房子避寒，同時把自己家出租，讓住房費用省了一半。


    一位退休的老婦人，從過去的經驗知道，打掃房子其實要花費大量時間及金錢。因為她對照顧房子非常有一套，有近乎機車的仔細，所以現在成為鄰里中著名的專業房產管理員（Property
    Manager），不僅住在豪宅中，屋主還要付給她一筆管理費。


    尤其網路發達，如果你是專業的房產照護者，可以透過中介網站，一邊旅遊，一邊有顧房子的生意可以接。你現在知道為何傳統的記帳簿沒辦法解決你的問題了吧？'
