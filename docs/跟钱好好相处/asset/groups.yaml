    # ### 誌謝


    這本書第一次出版到現在已經超過二十五年。在這些年中數百人幫忙行銷及推廣，讓它變成一本長青書。我在這想要謝謝協助過我們的人。


    伍德小姐 (Mavis Wood)，從一九九二年以來，就一直擔任本書的編輯；瓦特 (Robert Watt) 在同一時期，負責本書的研究工作及其他支援事項；由志工組成的新藍圖基金會，一九八四年由我們成立之後，就一直致力於這本書的推廣工作，同時也發展出改變金錢關係時所需要搭配的工具；NRM
    工作小組，把財務獨立的九大步驟課程介紹給不同的朋友。


    這本書的再版，有好多幕後英雄，我希望逐一感謝。


    瑞巴 (Chris Rhy) 在二〇一七年擔任助理編輯，扮演不可或缺的可靠角色，第一次碰見他時，我發現我們對於這本書有相同的熱情，對於初學者來說，這是一本規畫財務計畫的好書，可以透過對話改變生活。身為千禧世代，他看待世界的觀點也是本書不可或缺的必要成分。我們一起把這本書的升級版做出來，他負責每一章節的重新製作，每一版的校稿，他用過清晰、智慧及正面的態度一一完成。


    另一個千禧世代的工作夥伴胡佛（Cole Hoover），協助我了解他們這個世代需要什麼，這本書可以提供些什麼。泰勒利（Anne Tilley）、湯瑪斯（Cecil
    Thomas）及麥克奎馬拉（Dan McQuilla) 一直鼓勵我，對我了這本書深信不疑。


    我的經紀人及啦啦隊長威莎小姐（Viv Vega），一直陪在我身邊，把最初的想法修整得更'
  - '[PAGE 338]


    清楚、更引人入勝，更能跟上現代社會的脈動。這樣的努力，終於贏得出版商企鵝出版社及寇特（Kathryn Crary）的首肯，再次出版這本書。


    曾經任職於《Kipling》雜誌的阿拉佐其（Todd Arndall），聽到這本書要再版時，就出手協助，負責第六章的新修訂及寫作。


    「自然投資」的團隊，佛瑞茲爾（James Fraser）、派克（Christopher Peck）、克萊門（Vittoria Kamen）、布瑞（Hal Brul）、卡明斯（Jim
    Cummings），幫我把新酒倒進了舊瓶子裡，讓第九章被動投資的部分增添了新生。


    三十歲的薩巴提爾，在二〇一七年二月在網絡上寫了一篇推崇這本書的文章，指出在他從破產翻身到擁有百萬美金身家的五年過程中，這本書幫了很大的忙。這篇文章讓本書的舊版再次登上了亞馬遜排行榜的第一名，自此他也成為我們的夥伴，協助將本書推廣給新一代的年輕人。於此同時，我發現這本書助長了「財務獨立、提早退休」的風潮。


    又名金錢鬍子先生的安得尼（Dave Kenny）先生，以及倡導財務獨立的領導者、部落格及其他意見領袖，都熱烈歡迎我回到舞台。我也期待在未來的日子裡，能跟大家一起打破迷思、改變這個世界。


    最後，我要謝謝編輯楊格（A.J.Bunnington Young）及企鵝出版集團的編輯瑞姆（Su Rinn），協助我更正錯誤、節制篇幅，謝謝他們讓作品變得更好。


