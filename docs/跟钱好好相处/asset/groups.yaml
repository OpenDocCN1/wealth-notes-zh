    出。你可以從這個模型中，看到消費品創造的碳足跡。


    如果在北美洲的這群人消費模式不改變，我們可能需要四個地球才夠消耗，但我們只有一個地球！


    每年「全球足跡網路」都會聯合「世界自然基金會」（World Wildlife Fund），舉辦「地球超載日」（Earth Overshoot Day）活動，地球超載日指的是地球再生、可供人類使用一整年的資源，將在這一天用盡。每年在活動中，都會宣布地球的資源在何時將被耗盡。


    一九七一年，地球超載日發生在十二月二十一日；十年後提前到十一月十二日；一九九一年，超載日進一步提早至十月十一日；二〇〇二年九月二十三曰；二〇一六年，提早到八月三日。現在的情況又是如何？地球是大自然的產物，還要多久，支持萬物生長的資源將消耗殆盡？當我們發生個人的債務問題，汽車可能被拿走，房子可能被拍賣，再也沒有能力借錢，可是只要還有機會再起。但對於環境負債可沒辦法這樣做，因為我們只有一個地球。


    # 金錢遊戲中最大的輸家


    可惜的是，我們根本沒有辦法體會環境債務到底多大，因為受害者無法發聲，我們也找不到債主，誰又該為這筆債務負責。在環境債務中，沒有銀行可融資，只能說我們正在透支屬於下代的資源，占大自然的便宜。我們每天吃的、穿的、買的、使用的，都是來自於地球。


    李歐納德（Alene Leonard）在紀錄片《東西的故事》（The Story of Stuff）中，描述我們的生活消費模式，就是從地球取得資源，送進工廠，買回家裡，然後丟掉，是一條有去無回的單行道。我


