    READJUSTMENT ACT OF 1944）。規定參與二次大戰的軍人可立即獲得由失業保險支付的現金補貼，更重要的，還提供退伍軍人多樣化的教育機會，從在職訓練到高等教育均可，也可獲得充足的家庭或商業貸款幫助。'
