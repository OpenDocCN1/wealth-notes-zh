    對於接下來的課程來說，這是非常非常重要的一步，有一些人做完了這些步驟，就很驕傲地宣布已經照計畫執行，其實還不到這個程度。但你花的每一分鐘都不會白費，對未來都會有幫助。


    # 步驟三的重點摘要


    +   1. 追蹤及記錄每個月的所得及花費，建立屬於你自己獨特的收入及支出類別。

    2. 編製自己的每月收支表。

    3. 把費用及收入分門別類記錄在各個分類中。

    4. 在每個分類中，計算自己的花費。

    5. 統計自己的每月收入及支出，計算出手上的現金及銀行帳戶裡的金額，套用公式（每月總收入減去每月總支出，加上或減去每月誤差）：你在期末實際擁有的錢，應該等於期初資產總額，加上月收入，減去你的當月支出。

    6. 用步驟二學到的方法，把錢轉換成每小時的生命活力。'
