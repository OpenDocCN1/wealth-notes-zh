    zheng ju （司长；六级）。在美国，克利夫兰市警察局局长的级别是高于还是低于联邦教育部副司长可能并不清楚，但在中国却不存在这种模糊性。在中国，任何地方的每一个官职都有一套通用的名称，以便在全国范围内明确界定相对的等级位置。例如，如果波士顿是中国的一个城市，其市长的级别为
    zheng ju （六级），警察局局长的级别为 zheng chu （四级）。


    请注意，该数据库不包括副部长（或副省长）或以上级别的官员，而副部长（或副省长）比正处级高一级。因此，我们无法得知中国非常高级官员的非官方收入情况。尽管如此，我们还是掌握了非官方政府雇员和六个核心级别的政府官员，他们构成了官僚机构的主体。


    我们还将政府部门分为六类：

    - (1) 中共地方委员会和地方政府办公厅；

    - (2) 法制局（公安局、法院、检察院）；

    - (3) 负责财政和其他资源征收或分配的局（财政局、税务局、海关、国土资源局、矿产资源局）；

    - (4) 主管大型项目的局（交通局、公路局、住房局、城市建设局）；

    - (5) 主管经济系统的局（发改委、国资委、城市规划局）；

    - (6) 其他局。


    我们使用这些分类变量来代表政府机构的特权权力，并将检验政府机构特权权力潜在寻租机会的差异是否也反映在非官方收入隐含水平的差异上。


    无条件地，没有政府雇员的普通家庭所购买房屋的价值要高于有政府官员的普通家庭。由于我们的回归结果表明，在对人口统计学和其他变量进行调节后，模式发生了逆转。另外值得注意的是不同类型官员家庭的房屋价值不同。平均房屋价值往往随着官员级别的提高而增加。当然，官员家庭的平均收入也会随着官员级别的提高而增加。我们随后的回归研究了从低官阶到高官阶的房屋价值增长是否超出了法定收入差异所能解释的范围。


    在图 1 中，我们展示了房屋价值与估计家庭终生收入的条件图。纵轴上的变量剔除了年龄、教育水平和其他人口特征的影响。平均而言，相对于各自的终生收入水平，有政府官员的家庭比没有政府官员的家庭拥有更昂贵的住宅。


    除了样本城市的 HPF 数据集外，我们还引入了覆盖多个城市的第二个数据集，以检验我们方法的外部有效性。我们使用的城市家庭微观数据来自中国家庭面板研究（CFPS），这是一项由中国北京大学发起的两年一次的家庭调查。我们的数据覆盖了中国大陆
    99 个城市。在每个城市中，住户的选择采用分层三阶段法（小区、住宅小区和住户），按概率大小比例（PPS）随机抽样。我们从 2010 年、2012 年、2014
    年、2016 年和 2018 年的城市家庭开始。在样本覆盖的 6,326 个家庭中，来自 99 个城市的 1,935 个家庭报告在 2005 年至 2018
    年期间购买了住房单元。我们在多城市分析中重点关注这些购房者。


    对于每个受访家庭，我们主要关注两个变量。第一个变量是家庭购买的住宅单元的建筑面积。在样本中，只有一小部分购房者报告了所购住房单元的总价值，因此，在多城市分析中，我们选择用单元面积来代表大额购房支出。其次，对于每个家庭，我们都要确定夫妻中是否至少有一人是政府雇员。需要注意的是，这一分类既包括政府官员，也包括政府非官方雇员，而不足之处在于我们无法按级别或职位来区分政府雇员。我们还有关于家庭其他属性的信息，如年龄、户口状况、家庭规模和报告的家庭人数。家庭收入。我们还了解了家庭中子女的数量（包括儿子的数量）以及夫妻双方父母的平均受教育年限。附录表
    A-3 报告了主要变量的汇总统计。


    ### 2.3. 对关键识别假设的讨论


    我们的识别依赖于三个基本假设。


    首先，第 2.2 节中概述的程序可以恰当地描述官方家庭和非官方家庭的永久收入。如果官方住户和非官方住户对其未来收入持有系统性的不同预期，则这一假设可能会失效。例如，政府官员可能比非官方官员预期更高的收入增长、更长的寿命或更低的贴现率。这些因素可能导致他们比当前收入水平相当的非官方家庭购买更大的住房。


    第二个关键的识别假设是，我们能够控制家庭购房决策的所有主要决定因素。如果从真实收入到购房价值的映射还受到其他个人特征差异的影响，那么这一假设就可能失效。例如，政府官员可能更富有，父母更富裕，或与有钱人结婚。此外，如果政府官员的工作比非官方官员更有保障，他们就能留出更多的收入用于积累资产，因此，在收入水平一定的情况下，他们更愿意购买面积更大的住房。在所有这些情况下，从官员购房价值中提取的总收入可能会夸大其非官方收入的规模。


    第三个重要的识别假设是，官员和非官员面临相同的选择集，特别是房地产市场中相同的单价。然而，房地产开发商可以为政府官员提供折扣。虽然这种折扣可能被认为是一种贿赂，但官员购买更多的住房可能部分反映了这种单价优势，而不是存在大量的非官方收入。同样，如果政府官员更善于判断哪种类型的住房更有可能升值，那么在一定的官方收入水平下，他们可能会选择购买比非官方官员更贵的住房。在这种情况下，我们的方法也可能导致估计的非官方收入偏高。


    我们检验了这些假设的失败是否会影响我们的主要结论。首先，我们考虑了以下可能性：政府官员的未来收入增长率可能更高、工作安全性更高或者风险规避程度不同、预期在退休前离开政府转而从事私营部门的工作、获得实物或其他非薪金福利、由于市场信息不足而多付了购房款、从房地产开发商那里获得价格折扣，或者在住房投资方面更熟练或更有经验。我们对这些影响逐一进行了量化。我们发现，这些影响都不足以从根本上改变我们的主要推论。


    其次，通过对样本城市几乎所有购房情况的调查，我们研究了不同级别和在不同政府部门工作的官员的非官方收入的相对规模及其普遍程度。如果我们估算的非官方收入与腐败有关，而不是反映了特异性差异，那么一个标志就是估算的非官方收入会随着官员级别的提高而增加，并且在那些众所周知对营业执照或审批权有更大权力的政府部门会更多。相比之下，上文讨论的替代方案都不容易产生这种模式。


    第三，为了说明估算的非官方收入与腐败有关，而不是官员和非官员之间的特征差异，我们研究了自 2013 年以来响应全国反腐运动的估计非官方收入。这场声势浩大的反腐运动揭露了一些城市（CFPS
    数据集）高层官员的腐败行为。同样，在我们的样本城市（HFP 数据集），反腐运动也揭露了一些政府部门的腐败现象。虽然腐败案件（以及相关的逮捕）发生在我们的样本期之后，但腐败行为通常发生在我们的样本期内。这种情况为我们提供了一种新的方法来检验估计的非官方收入是否与腐败有关。特别是，在我们的样本期间，在后来被揭露有更多腐败行为的城市，估计的非官方收入是否更高？在后来发现腐败现象更严重的局工作的官员的估计非官方收入是否更高？请注意，由于腐败现象是在我们的样本期之后发现的，因此在非官方收入的估算中不存在
    "前瞻性偏差"。


    腐败的高官更有可能拥有腐败的下属——部分原因是高层官员可能会鼓励下层官员腐败，以便他们能够从中分一杯羹，另一方面也是因为高层官员不太可能制定措施来监督或约束寻租行为。我们比较了有高层领导腐败的局/市和没有高层领导腐败的局/市的非官方收入的相对规模。此外，由于
    CFPS 数据集涵盖了反腐运动前后两个时期，我们还可以研究反腐运动后官员的非官方收入是否显著减少。如果估计的非官方收入是由官员的非测量特征驱动的，例如官员喜欢住大房子或期望未来合法收入增长更快，那么这些非官方收入不太可能以上述方式与腐败案件相关，这为验证估计的非官方收入是否与腐败相关提供了一个有用的方法。


    诚然，我们的计算仍然依赖于一个假设，即我们的 HPF 数据集提供了样本城市中具有代表性的购房样本。这一假设也可能失效。特别是，我们的数据集并不包含不使用 HPF
    抵押贷款的购房行为。事实上，有些贿赂可能只是某人向政府官员赠送房屋或公寓，而这种最恶劣的贿赂形式不会出现在我们的数据集中。另一种可能是，如果受贿官员所购买房屋的面积或价值中包含了他们的财富，那么他们就会担心暴露自己的财富。我们无法排除这些可能性，也没有明确的方法来系统地量化这些影响（除了报告轶事）。然而，我们注意到，这些可能性表明，非官方收入的真实规模可能大于此处的估算。


    ## 3. 经验结果


    ### 3.1. 非官方收入的相对规模


    表 2 报告了基线模型（即公式 (4'')）的结果。因变量是所购住房（公寓）的总价值，以对数表示。在第 1 列中，主要的回归变量是：

    - (a) 有非官员公务员的家庭的虚拟变量；

    - (b) 至少有一名政府官员的家庭的虚拟变量；

    - (c) （估算）的对数家庭永久收入。


    原则上，收入与房屋价值之间的恩格尔曲线关系的斜率可能取决于收入——虽然家庭收入增加时，往往会购买价值更高的房屋，但房屋价值的增加可能不是线性的。我们为五个五分位数的家庭收入分别设置了五个系数，以考虑家庭永久收入与房屋价值之间可能存在的非线性关系。我们还控制了其他可观察到的家庭属性，如年龄、户口状况[^12]、教育程度、夫妻双方的职称[^13]、夫妻双方是否在中心区工作[^14]、区月固定效应[^15]。标准误按地区和月份进行双向聚类。模型的
    R 方达到 0.499；换句话说，模型可以解释家庭购房支出差异的一半左右。请注意，这样的拟合程度明显优于现有的大多数中国城市微观层面的实证分析（Cao, Chen,
    and Zhang, 2018; Han, 2010; Tang and Coulson, 2017）。


    对于前三个收入五分位数，家庭永久收入对数的系数在 1% 的水平上都具有统计意义，这证实了购房价值随着家庭（官方）永久收入的增加而增加。对这三个系数的相等性进行正式的
    F 检验，得出的 F 统计量为 2.27，不显著。换句话说，我们不能拒绝这三个系数相同的原假设。相比之下，家庭永久收入对数的后两个五分位数的系数在 1% 的水平上都与零无关。这种模式在直觉上是合理的：一旦一个家庭足够富有（房子也足够大），他们想买的房子的面积就会受到限制。其他控制变量的系数与预期基本一致。例如，拥有高学历或高职称的购房者的房屋价值往往更高。


    有非官方公务员的家庭的虚拟值为正（0.034），在 1%的水平上具有统计意义。由于官方家庭（官方）收入的中位值位于第二五分位数，隐含的非官方收入约占官方永久收入的
    27% [ = exp ( 0.034 / 0.142 ) - 1 ]。[^15] 政府官员虚拟值也为正（0.086），在 1%的水平上具有统计意义。大多数官方家庭也属于第二收入五分位数（尽管有些家庭属于第三收入五分位数）。这一结果意味着，至少有一名官员的普通家庭的非官方收入约为官方收入的
    83% [ = exp ( 0.086 / 0.142 ) - 1 ]。


    该数据集的一个好处是，我们可以根据官员在等级制度中的级别和政府部门类型对其进行区分。这种区分使我们能够调查非官方收入的可能梯度，从而回答这个问题：级别越高的官员收取的非官方收入越多吗？


    我们在表 2 第 2 栏中报告了结果。如果丈夫和妻子都是官员，我们使用两个级别中较高的一个。所有官员级别的系数均为正数，且在统计上有显著意义；引人注目的是，点估计值的大小确实随级别的增加而单调增加。对于大多数级别较低的官员（一级）来说，非官方收入估计占其合法收入的
    44%。这一比例在正科级官员（二级）上升到 83%，在副处级官员（三级）上...


    [^12]: 户口是中国特有的制度：每个中国公民都有一个独一无二的户口，这个户口将他们与中国的某个特定地点联系在一起，这个地点通常是，但不总是，他们的出生地。例如，在上海生活和工作的人被分为两类：拥有上海户口的人和拥有其他地方户口的人。第一类人享有更多权利，例如在当地学校上学的权利。城市中的外来务工人员通常没有本地户口，一旦停止在城市中的工作，他们通常会返回原籍地。在一些城市，农民一旦成为当地房主，就可获得当地户口；这一福利可为他们提供额外的购房动力。而在另一些城市，即便在当地买了房，也很难获得当地户口。在后一种情况下，由于没有本地户口的人预计退休后会离开该城市，因此他们买房的动机可能会降低。无论如何，有无本地户口的家庭在购房行为上可能会有所不同。我们使用本地户口虚拟变量作为回归因子来考虑这种差异。请注意，几乎所有的正式家庭都拥有本地户口。

    [^13]: “职称”（或中文的“职称”）是政府指定的四级专业资格之一：(a) 高级（正高级），相当于正教授；(b) 副高级（副高级），相当于副教授；(c)
    中级（中级）；(d) 无职称。

    [^14]: 家庭成员是否在城市中心区工作也会影响购房行为。在中心区工作的人可能更愿意在中心区或附近买房，以节省通勤时间。中心区或中心区附近的住宅往往比距离市中心较远的同类住宅价格更高。由于我们知道丈夫和妻子的雇主地址，因此我们在至少有一名成员在城市中心区工作的家庭中加入了中心区虚拟变量。

    [^15]: 我们还引入了城市内次级地理单元的单独固定效应和月份固定效应，结果是稳健的。


