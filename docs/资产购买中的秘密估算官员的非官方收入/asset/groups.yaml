    据我们所知，本文首次提出了一种估算腐败发生率或拥有非官方收入的官方家庭比例的方法。


    ### 2.2. 数据


    本研究的关键数据是中国某大城市住房公积金系统中的住宅抵押贷款合同全样本[^4]。从法律上讲，每个雇员及其（全职）雇主都必须将其每月收入的一定比例存入公积金账户。然后，员工可以获得购房贴息抵押贷款（比商业银行的抵押贷款利率低约
    1.5 个百分点，即近 30%；该利率由住房和城乡建设部确定，所有借款人适用相同的固定利率）[^5]。几乎所有符合条件的购房者都会在申请商业银行按揭贷款等其他资金来源之前申请这种按揭贷款[^6]。在中国，抵押贷款再融资并不常见，我们的样本不包含再融资观测值；换句话说，每份抵押贷款合同都指一次住房交易。因此，数据涵盖了
    2006 年至 2013 年期间全市所有使用公积金抵押贷款的购房者（共计 209,861 人）。


    我们对数据进行了以下筛选。首先，我们剔除了 52,495 套经济适用房（面向低收入家庭）的交易，以提高官员和非官员可能购买的住房类型的可比性。其次，我们重点关注夫妻双方都有收入记录的观测数据，因此从数据集中剔除了另外
    49,995 个观测数据。最终样本（共 107,371 个观测值）的年度分布见附录表 A-1 第一列。


    对于每笔交易，我们都有以下信息：

    - (1) 交易日期；

    - (2) 住宅单元的总价值[^7]；

    - (3) 贷款层面的特征，包括贷款价值比、抵押贷款利率和期限；

    - (4) 住宅单元的主要属性，包括其面积（平方米）、楼层、地址和建筑群名称（然后可将其转换为建筑群层面的固定效应）；

    - (5) 住宅单元的总价值。

    - 效应）；以及 (6) 家庭特征，包括当前月收入（丈夫和妻子）、当前月消费支出、总金融财富（包括拥有的银行存款、股票和债券）、未偿还债务、申请时的房屋所有权状况、年龄、户口（当地户籍）状况、教育程度以及丈夫和妻子的专业职称。


    附录表 A-2 列出了主要变量的汇总统计量。所有货币变量均使用该市的消费价格指数序列进行平减，并以 2010 年的实际值表示。


    作为实证分析中的一个关键变量，官方永久收入变量是根据以下程序估算的。首先，我们从夫妻双方的月收入入手，月收入的定义是夫妻双方从全职工作中获得的所有税前工资和奖金收入。请注意，所报告的收入由雇主开具的工资单和
    HPF 系统中记录的夫妻缴款核实。


    其次，我们估算了夫妻双方从购房当年到退休当年（丈夫和妻子的退休年份可能不同）的累计收入。在基线情况下，我们按照中国劳动法的规定，假设男性 60 岁退休，受过高等教育（本科或以上学历）的女性
    55 岁退休，没有学士学位的女性 55 岁退休。


    对于未来收入，我们需要假设家庭收入的增长率。我们有 2006 年至 2013 年每个家庭报告和核实的收入信息。由于 2013 年后 GDP 增长放缓，未来的收入增长不太可能重复
    2006-2013 年的情况，因此我们假设每个家庭未来的年增长率为 2006-2013 年实现增长率的一半。因此，各家庭增长率的相对差异得以保留。我们假设贴现率为
    5%，并根据假设的收入轨迹计算终生财富的贴现现值。


    在计算终生财富时，我们还包括申请抵押贷款时自我报告的财务财富和未偿债务。对于拥有其他住房的购房者[^8]，需要注意的是，与工资信息不同，每月消费支出、金融财富、未偿还债务和房屋所有权信息均为自我报告，未经独立核实。作为稳健性检验，我们忽略了所有这些息[^8]，重新计算终生收入。也就是说，我们只根据经过核实的工资收入来计算(合法的)终生收入。如果有政府官员的家庭之间非工资收入的分布情况相似，那么这种忽略只是一种噪音。


    在计算终身财富时，我们估算了这些单位的市场价值[^9]。最后，我们计算直至预期死亡年龄（根据中国保险监督管理委员会发布的《人寿保险死亡率表》，假设基线情况下男性为
    80 岁，女性为 84 岁，即出生时的预期寿命）的终生财富年金。我们将此年金视为家庭的估算终生（永久）官方收入。该案例即为我们的基线。


    另一个关键变量是家庭的雇主类型。如附表 A-1 所示，6,316 个住户（占总数的 5.9%）中有一名成员是公务员（如行政助理），但不是政府官员；5,364
    个住户（约占样本的 5.0%）中至少有一名成员是政府官员 (fù kē 级或以上)。其中，配偶双方均为政府官员的家庭有 604 户（占样本的 0.6%）。


    我们数据中的政府官员可分为六个级别，从最底层的 fù kē (一级，副科长) 到 zhèng kē (二级，科长) 、fù chú (三级，副处长) 、zhèng
    chú (四级，处长) 、fù jú (五级，副司长)，最后到 zhèng jú (六级，司长)。我们在表 1 中报告了有政府官员的家庭的简要统计数据，包括他们在数据中所占的比例、家庭平均收入和平均房屋价值。[^10]
    不难看出，随着官员级别的提高，他们的收入和房屋价值都呈上升趋势。同时，官员级别越高，家庭数量越少。请注意，目前无政府雇员家庭的月平均收入约为 11,500
    元（表 1 第 2 栏）。这一数字高于有政府官员家庭的平均收入（10,240 元）。由于无政府雇员家庭的平均年龄往往比有官员家庭的平均年龄小，因此预期终身收入（或财富）的差距可能会更大。


    请注意，官阶及其级别的名称在整个中国都是统一的。[^11] 和没有非官方收入估算。事实上，我们关于官员非官方收入估算的结果在质量上仍然成立。


