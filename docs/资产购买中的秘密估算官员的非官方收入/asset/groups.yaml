  - '[PAGE 119]


    # 附录 图 A-1：官方住户非官方收入部分估算方法示意图


    ![](img/7dd29fa4bb1fbd64e1782aedb4b90270_119_0.png)'
  - '[PAGE 120]


    # 附录 B：永久收入的其他衡量标准


    在表 2 的基线估算中，我们基于以下假设计算家庭的永久收入：（a）未来到退休时的实际年收入增长率为 2006 年至 2013 年期间实际年收入增长率的一半；（b）贴现率为
    5%；（c）男性的退休年龄为 60 岁，受过教育（或教育程度较低）的女性的退休年龄为 55 岁（或 50 岁）；（d）购房时男性的（统一）预期寿命为 80
    岁，女性的预期寿命为 84 岁。最后，在计算一个家庭的终生收入时，我们纳入了自报的总金融资产、总债务和购房时已拥有房屋的市场价值。附录表 B-1 的 A 部分报告了基线情况下家庭终生收入的平均值和中位数。现在我们来检验一下主要结论对上述各项假设变化的敏感性。


    首先，我们改变了对未来收入增长的假设。在附录表 B-1 的 B 面板中，我们假定未来的年收入增长仅为 2006 年至 2013 年期间实现的增长的三分之一（即比基线情况慢）。因此，不难理解，家庭终生收入（及其年金、家庭永久收入）会小于基线情况。


    在附录表 B-1 的面板 C 中，假设未来收入的增长速度与 2006-2013 年期间相同（即快于基线情况）。因此，家庭终生收入高于基准情景。


    我们用新的家庭永久收入指标重新对表 2 进行了回归，结果见附录表 B-2。尽管与表 2 中的点估计值相比有所变化，但一些关键特征并没有改变。特别是，有非官方公务员的家庭和有不同级别官员的家庭的虚拟变量系数都是正的，而且在统计上是显著的。此外，系数随着官员级别的增加而单调增加。因此，非官方收入的证据在统计上'
  - '[PAGE 121]


    仍然是显著的，非官方收入仍然倾向于随官员级别的增加而增加。我们可以很容易地验证，根据这两种方法估算出的有非官方收入的官方家庭比例也会随着官员的官阶而增加。从这个意义上说，主要结论是'
  - '[PAGE 122]


    对未来收入增长的其他假设也很稳健。


    在附录表 B-1 的 D 和 E 面板中，我们尝试了两种不同的贴现率，分别为 3%和 10%，分别低于和高于基线情况下的假设贴现率。附录表 B-2 的 B
    部分报告了相应的回归结果。同样，基线方案的主要结论在采用其他贴现率假设后依然存在。


    除终生劳动收入外，终生资源基线计算还考虑了家庭报告的净金融资产和已拥有公寓单位 的估算市场价值。如附录表 A-2 所示，平均而言，家庭报告的总金融资产约为
    233 890 元（按 2010 年价格计算），几乎没有金融债务（除正在申请的房贷外），17%的家庭在本次购房前拥有其他住房单元。与数据库中由政府养老金计划核实的劳动收入不同，自报的金融总资产、债务和房屋所有权未经第三方核实。测量误差可能是这些变量的一个问题。为了检验结果的敏感性，我们仅根据当前和未来的劳动收入重新计算终生收入，而忽略了自我报告的金融资产、债务和房屋所有权。附录表
    B-1 的 F 面板报告了重新计算的终生收入的一些简要统计数据；附录表 B-2 的 C 面板的前两列报告了回归结果。我们发现，关于非官方收入的存在和非官方收入梯度与官方等级的函数关系的主要结论对忽略资产和债务并不敏感。


    在计算终生收入时，我们还可以从每年的收入中减去消费支出。附录表 B-1 G 面板报告了新的终生收入衡量方法的汇总统计，而附录表 B-2 C 面板第 3 列和第
    4 列报告了新的回归结果。


    在附录表 B-1 的 H 面板中，我们改变了退休年龄假设。高龄'
  - '[PAGE 123]


    部长或以上级别的官员（无论男女）65 岁退休。假定所有官员都能达到这一级别并在 65 岁退休，将提高官员家庭的终生合法收入。 ${ }^{1}$ 如果非官员家庭的退休年龄保持不变，相对于其他家庭，官员家庭的终生收入往往会增加，并使前一类家庭购买更昂贵的住房成为合理。这些假设并不现实，可能会夸大两类家庭法定终生收入的差异。在面板
    H 中，我们采用了这些极端假设。毫不奇怪，正式家庭的永久收入变得更大。尽管如此，关于退休年龄的这一新假设在数量上并不足以改变主要结论（见附录表 B-2 D
    面板第 1 列和第 2 列的结果）。


    最后，根据中国保险监督管理委员会发布的《人寿保险死亡率表》，我们在附录表 B-1 的 G 组中允许预期寿命随购房者年龄的变化而变化。这一修改对家庭永久收入的影响相对较小，对主要结果也没有影响（附录表
    B-2 D 组第 3 列和第 4 列）。作为敏感性检验，我们还使用了购房者的平均预期寿命（男性为 80 岁，女性为 84 岁）。结果也基本相同。'
  - '[PAGE 124]


    $^{1}$这种情况也适用于这样一种假设，即政府官员基于其社会网络，期望在退休后被一些公共机构甚至私营企业重新聘用。这种社交网络通常会在官员退休后迅速消失，《人民日报》（2015年5月25日）将这种现象形容为“人走茶凉”或“人老茶凉”。我们可以合理地预计，这种返聘即使存在，持续时间也不会超过五年。'
