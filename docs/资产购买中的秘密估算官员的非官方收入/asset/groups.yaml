    作为最重要的控制变量，一个人的技能或能力有两种衡量方法。*教育* $i$ 代表一个人的教育程度，包括分别拥有高中文凭（但无更高学位）、三年制学院学位（但无更高学位）、四年制学院学位（但无更高学位）、硕士学位和博士学位的虚拟变量。遗漏是指没有高中文凭（或更高文凭）的人。专业职称（*Professional_Title*）代表当地政府授予个人的专业认可，表明个人在某一领域的熟练程度。我们掌握了两类专业职称的信息，并相应地使用了两个虚拟变量来表示：高级专业职称是指拥有正教授或副教授、高级工程师或总会计师等职称的人；中级专业职称是指拥有讲师、助理工程师或助理会计师等职称的人。这些专业级别由当地政府界定、审查和授予。$^1$没有专业职称的人员则被排除在外。


