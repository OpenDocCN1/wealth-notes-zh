    # 1. 导言


    鉴于腐败对公司治理、经济和社会的毒害，金融和经济学文献都试图衡量腐败的规模和严重程度。以往的研究通常侧重于衡量腐败或高层腐败的平均水平，而关于政府官员中似乎存在非官方收入的比例的研究却很少。


    衡量非官方收入的普遍性和水平对于评估官僚机构的质量至关重要。例如，高非官方收入和低官方收入的结合可以反映出政府中的人员类型。Caselli 和 Morelli（2004
    年）提出了腐败持续存在的一个原因：不诚实的人在政府中工作可能具有比较优势。他们不介意从事低收入的政府工作，因为他们期望获得贿赂。此外，他们可能会将公共部门的法定工资定得足够低，以赶走有能力的诚实人。诚实的人认为接受非官方报酬在心理上更痛苦，但他们也不愿意接受低于其保留工资的工资；而不诚实的人则不会有这两个问题。换句话说，低官方工资和高非官方（或腐败）收入的结合可能是一种稳定但不理想的社会均衡。


    了解政府官员中获取非官方收入的比例对于制定有效的反腐败战略也很重要。原则上，可能存在两种腐败平衡状态：一种是少数极度腐败的官员与原本廉洁的官僚机构并存，另一种是腐败在整个官僚机构中更为普遍。这两种情况可能需要采取不同的反腐策略才能奏效。如果腐败集中在高层，但在官僚机构中并不普遍，那么人们就会更多地担心决策的质量，而较少担心繁文缛节或一般的经营成本。就反腐败战略而言，通过选举或弹劾（如
    2016 年 8 月在巴西或'
  - '[PAGE 4]


    2017 年 3 月在韩国发生的情况）罢免最高级别的腐败头目，可能足以实现


    ¹参见 Shleifer and Vishny (1993)、Wei (2000)、Kauffman and Wei (2000) 和 Besley (2004)。'
  - '[PAGE 5]


    目标。与此相反，如果整个官僚机构普遍存在非正式收入，那么大多数企业的经营成本就会很高。在这种情况下，即使政府高官在技术上很有能力，投资也会受到阻碍，经济增长也会受到影响。要使反腐败战略行之有效，就必须关注官僚普遍存在的寻租机会、获取非官方收入的诱惑、发现错误行为的可能性以及对普通官僚受贿的惩罚。


    非官方收入的普遍性和水平都不容易估计，因为它们是 "台面下 "的收入。因此，对非官方收入的衡量只能是间接的，只能从其他可观测数据中推断。在本文中，我们提出了一种经验方法来估算腐败的普遍程度以及政府官员的非官方收入和合法收入的相对规模。为此，我们将一个大城市中近似家庭的可观察到的大件商品购买数据与官员和其他人经核实的合法收入结合起来。在大件商品购买与家庭终生收入之间存在稳定关系（即恩格尔曲线关系）的前提下，我们根据大件商品购买价值与观察到的合法收入所能预期的终生收入之间的差距来推断非官方收入。作为本文的一项创新，我们还可以
    通过比较官员与非官方 "无法解释的收入 "的估计密度函数，提取官员中拥有非官方收入的比例信息。


    我们将这一框架应用于中国，中国的非官方收入被委婉地称为 "灰色收入"。结合两个综合数据集--中国某大城市的住房公积金（HPF）缴存行政记录和购房交易数据--我们揭开了政府官员购买资产的秘密。使用住房公积金缴存记录非常重要（也很独特），因为它们提供了样本中每个人合法收入的详细情况。相比之下，文献中的许多研究采用的是自报收入，而自报收入'
  - '[PAGE 6]


    可能更嘈杂，也更容易出现选择偏差。此外，尽管购房决定是在家庭层面做出的，但丈夫和妻子的收入往往无法匹配。在我们的数据集中，我们掌握了丈夫和妻子的收入历史、就业状况和家庭收入等信息。'
  - '[PAGE 7]


    雇主的性质（如是否为政府机构）。换句话说，有关住房价值、官方收入和雇主类型的信息质量非常高。


    我们的估计结果表明，在 2006 年至 2013 年的样本期间，政府官员的平均非官方收入占其官方收入的 83%。更有意思的是，我们发现非官方收入（占官员合法收入的百分比）随着官员级别和政府部门特权的增加而增加。例如，一个政府部门的司长（其级别为正处级，相当于中国政治等级中大多数中小城市的市长级别）的非官方收入是官方收入的
    42% 以上。就腐败的普遍程度而言，估计约有 13% 的官员获得了非官方收入，而且这一比例随着官员级别的提高而呈上升趋势。例如，8% 的非官方政府雇员有非官方收入，而
    65% 的正处级官员--样本中级别最高的官员--可能有非官方收入。我们的数据还发现，在可观察到的个人特征条件下，官员的平均收入往往略高于私营部门的同行。因此，我们拒绝非官方收入是对公共部门官员低工资的补偿这一假设。因此，提高公共部门工资本身可能不足以阻止政府官员获取非官方收入。


    由于对腐败及其普遍性的估算是间接的，因此我们在文中花了大量篇幅讨论我们的识别假设以及可能危及其有效性的因素。例如，如果政府官员规避风险的能力较强或收入来源的风险较低，他们可能会将更大比例的财富用于买房。另一种情况是，如果官员家庭在选择房地产方面具有比较优势，在随后的时期内会比平均水平有更好的升值，或者在他们的补偿方案中拥有更多的非货币但合法的福利（如供暖和医疗服务补贴），他们也可能选择购买一套更大的公寓'
  - '[PAGE 8]


    。我们在一系列稳健性检验中考察了上述每一种可能性。例如，为了检验政府官员收入更稳定的可能性，我们将他们与其他在工作安全性也很高的半官方机构工作的家庭进行比较，而不是与所有非官方家庭进行比较。为了排除以下比较优势的可能性


    更多资源，关注公众号【懒人找资源】'
  - '[PAGE 9]


    为了识别升值潜力更大的房地产，我们计算并比较了政府官员购买的公寓与非官员购买的公寓之间的实际升值率。我们还研究了官员购买的公寓可能获得价格折扣（Fang、Gu
    和 Zhou，2019 年）或更高的信贷额度（Agarwal 等人，2020a）的可能性。在每种情况下，我们的结论都不会受到实质性影响。


    另外几项发现进一步增强了我们对结论的信心。首先，如前所述，我们的方法估算出的非官方收入随着官员级别的提高而增加。对于那些在资源分配方面拥有更大特权的政府部门的官员来说，他们的非官方收入也往往更高。由于风险规避程度、无法衡量的合法财富以及其他混杂因素不太可能随着官员级别的提高而发生系统性变化--所有级别较高的官员在某些时候都来自级别较低的官员--我们估计的非官方收入很可能与官员职位的租金提取能力有关。


    其次，我们利用了 2013 年之后（即样本结束之后）反腐运动所揭示的高层官员腐败严重的市政府局子集的信息。多家媒体报道显示，腐败的高官更有可能有腐败的下属。因此，如果估计的非官方收入与腐败有关，我们预计在这些局工作的官员的非官方收入会特别高。我们发现这些报告确实属实。这一发现进一步证实了估计的非官方收入很可能与腐败有关。


    第三，我们使用 2005-2018 年间 99 个城市的购房数据集中探讨非官方收入的变化。我们发现，在反腐运动中，主要领导（市委书记或市长）随后因腐败被免职的城市，用我们的方法估算的非官方收入会系统性地显著增加。此外，我们还发现，在
    2013 年开始的反腐运动之后'
  - '[PAGE 10]


    ，新购房所隐含的非官方收入明显减少，尤其是在官员亲眼目睹了腐败的地方首长受到打击的地方。所有这些发现都支持了官员的非官方收入与腐败之间的联系。'
  - '[PAGE 11]


    本文与有关衡量腐败程度的文献相关，但又有所超越。McMillan 和 Zoido（2004 年）研究了 20 世纪 90 年代秘鲁藤森总统的间谍头目贿赂法官、议员、内阁部长和电视台老板的情况。


    Gorodnichenko 和 Peter（2007 年）的研究表明，乌克兰公共部门工人的工资往往低于企业工人，但他们的支出和资产水平却与企业工人相似。利用补偿性差异框架，他们认为这些公共部门工人一定有未报告的收入。Fisman、Schultz
    和 Vig（2014 年）利用印度对议会候选人申报财富的法律要求，作者发现赢得选举的个人资产增加加速度明显快于落选者。然而，由于非民选官僚通常不需要申报资产，因此这种方法不能用于估算整个公职人员群体中非官方收入的普遍性和规模。


    O''Donovan、Wagner 和 Zeume（2019 年）利用最大的数据泄露之一，确定了 338 家上市公司为秘密离岸工具的使用者，并记录了这些工具被用于资助腐败、避税和征用股东。他们发现，数据泄露使受牵连公司的市值减少了
    1740 亿美元，每七家公司中就有一家拥有离岸秘密。此外，金融和会计领域也有大量文献采用各种数据泄露和巧妙的识别方法来探讨原本难以衡量的企业欺诈（Desai、Dyck
    和 Zingales，2007 年；Dyck、Morse 和 Zingales，2010 年）和逃税（Braguinsky、Mityakov 和 Liscovich，2014
    年；Clotfelter，1983 年；Feinstein，1991 年；Feldman 和 Slemrod，2007 年；Fisman 和 Wei，2004
    年；Pissarides 和 Weber，1989 年）。


    多篇论文利用微观层面的金融数据揭示了中国腐败现象。例如，Chen 和 Kung（2019）研究了 2004 年至 2016 年间中国向政治精英提供的土地交易折扣。Fang、Gu和Zhou（2019）


    10


    更多资源，关注公众号【懒人找资源】'
  - '[PAGE 12]


    利用银行抵押贷款合同中报告的购房价格，发现样本中的官僚在购房时获得了折扣。Agarwal等人（2020a）利用一家中国银行的信用卡数据，发现政府官员获得的信贷额度比非官员高出16%。他们还发现反腐运动缓解了这种腐败现象。这些研究没有估算可能受贿的官员比例，也没有研究非官方收入如何随官员级别而变化。'
  - '[PAGE 13]


    本文对现有文献有三大贡献。首先，我们提出的框架不是以小样本的企业或个人为研究对象，而是以行政记录为基础，理论上涵盖了一个大城市中所有从事正式工作的雇员，包括政府官员。行政数据提供由雇主提供或核实的工资和薪金信息，而不是由购房者自行报告。由于数据几乎覆盖了整个城市，因此我们可以研究非官方收入的规模和比例是如何随着官员的级别和政府雇主的类型而变化的。相关文献尚未研究它们对非官方收入规模的影响。其次，据我们所知，本研究首次估算了接受腐败性非官方收入的政府官员的比例。第三，当我们对年龄、性别、教育水平和专业资格进行控制时，我们调查了政府官员的收入是否系统性地低于政府以外的同行。答案是否定的。因此，不能将非官方收入视为对政府官员薪酬过低的一种补偿；换言之，仅靠提高公共部门的薪酬并不能消除官员的寻租行为。本文似乎也是文献中首次对这一问题进行统计评估。


    承认研究的潜在局限性也是有益的。我们的方法依赖于三个假设。我们在论文中详细讨论了它们。尽管我们列举了一长串假设可能失效的情况，并提出证据证明我们的结果可能是稳健的，但这项研究仍将受益于中国或其他国家其他数据集的交叉验证。


    本文接下来的内容安排如下。我们在第 2 部分介绍了研究方法和数据，并在第 3 部分报告了基线估计值和若干扩展结果。第 4 节介绍基于多城市数据集的外部有效性分析。第
    5 节为结论。


