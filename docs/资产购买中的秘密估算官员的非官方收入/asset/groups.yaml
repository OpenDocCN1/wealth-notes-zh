    鉴于这种工资模式，我们得出结论，官员的非官方收入不应被视为对政府低工资的补偿。这一结果表明，提高公共部门工资本身并不能消除官员的寻租行为。诚然，我们不能排除未观察到的能力差异以及官员与非官员之间的关系。


    ## 4. 多城市证据


    现在，我们将我们的方法应用于 CFPS 数据，估算 2005 年至 2018 年间中国 99 个城市政府雇员的非官方收入。我们利用这一多城市分析来完成三项任务。


    首先，我们检验了我们方法的外部有效性，即我们是否也能在这个多城市样本中发现非官方收入的存在。结果如表 1 第 1 列所示。$^8$


    $^8$ 因变量是所购住房单元的建筑面积。在右侧，除了表示有政府雇员的家庭的虚拟变量外，我们还控制了家庭的合法收入（包括所有税内收入，如工资和奖金）、夫妻双方的年龄、家庭规模、户口状况以及城市和年份固定效应。标准误差按城市和年份进行双向聚类。


    有成员在政府部门工作的家庭虚拟变量和家庭合法收入的系数均为正数，且在统计上具有显著意义。结果显示，在控制住户的官方收入、住户属性和市场条件的情况下，有成员在政府部门工作的住户所购买的住宅单位的建筑面积比没有政府雇员的住户所购买的住宅单位的建筑面积大
    12.6% [ =exp (0.119) −1 ]。多城市数据集的结果证实，非官方收入是一种普遍现象，并非单一城市样本所独有。


    CFPS 提供了相对丰富的家庭属性信息，使我们能够进一步排除干扰因素。2.3 节中讨论的第二个关键识别假设可能失效的一个潜在因素是，政府官员的父母可能更富裕。虽然我们无法直接观察父母的收入或财富，但
    CFPS 数据集提供了父母受教育程度的信息（以他们的平均受教育年限来衡量），这可以作为


    此外，CFPS 还提供了有关父母收入/财富的信息。此外，CFPS 还提供了以下方面的信息


    家庭中的子女，包括儿子的数量。Wei、Zhang 和 Liu（2017）指出，有（更多）儿子的夫妇意愿在住房上花费更多，将其作为一种身份/声望商品，以便让儿子在未来的婚姻/约会市场上占据优势。在第
    2 列中，我们进一步控制了这三个变量（父母受教育年限、子女数量和儿子数量），结果依然稳健。尽管如此，由于其他与子女无关的激励因素，官方家庭仍可能更倾向于将住房视为一种地位或声望物品。为了进一步排除这种可能性，在附录表
    A-10 第 1 列中，我们将因变量替换为表示汽车拥有量的虚拟变量，汽车是中国另一种主要的地位/声望物品。表示政府雇员家庭的虚拟变量并不显著。同样，在第 2
    列中，我们将因变量替换为家庭的金融投资，包括股票、债券、信托等。同样，政府雇员家庭虚拟变量不显著。


    在多城市分析的第二项任务中，我们检查了在已知（事后）高层官员非常腐败的城市中，官员的估计非官方收入是否系统性地更高，这应该有助于进一步支持我们所解释的非官方收入确实与“台面上”（即未报告的）支付有关的情况。与表
    3 类似，我们将城市分为两类：到 2021 年底，在积极的反腐运动中发现党政领导或市长腐败的城市，以及没有高层腐败案件曝光的城市。我们的想法是，高层领导腐败的城市（腐败的高层）很可能容忍甚至鼓励了政府下层的腐败（腐败的下层）。在这种情况下，如果估计的非官方收入与腐败有关，那么在高层官员腐败的城市，非官方收入可能会更高。


    在表 8 的第 3 列中，我们在有政府部门雇员的家庭虚拟变量与城市政府高层腐败现象暴露的城市虚拟变量之间添加了一个交互项。事实上，交互项的系数是正的，并且在统计上是显著的。这些结果支持这样的解释，即估计的非官方收入与腐败有关，而不是由家庭的非观察特征等干扰因素所驱动。


    第三，我们对反腐运动对政府官员的非官方收入感到好奇。面对日益严重的腐败问题，新一届中央政府启动了几乎在 2012 年 11 月更迭后立即开展了反腐运动。这场运动有两个引人注目的起点。2012
    年 12 月 4 日，中共中央政治局发布了所谓的“八项规 定”，首次公开释放了加强党风廉政建设的强烈信号。大约半年后，一个更加明确的信号出现了，那就是反腐运动的空前性质。2013
    年 5 月 17 日，中共中央纪委宣布，中央纪委将开始定期对各省进行中央巡视（zhong yang xun shi ），旨在收集有关贿赂、贪污或其他腐败活动的信息。我们可以合理地预期，如果运动中的反腐策略能够有效遏制贿赂和其他腐败活动，那么政府官员在反腐运动后，尤其是在目睹地方腐败高官被打击后，他们的非官方收入会大幅缩水。


    在表 8 第 4 列中，我们在政府雇员家庭虚拟变量和 2013 年（即中纪委启动中央定期巡视计划之时，可以说是反腐运动最明确的信号）之后购买的住房单位虚拟变量之间添加了一个交互项。交互项在统计上显著为负。不出所料，反腐运动大大降低了政府官员的非官方收入。在第
    5 列中，我们从另一个角度研究了反腐运动的影响—我们在政府雇员家庭虚拟项与表示该市在反腐运动后发生的第一次地方领导（包括市委书记、市长以及相应的省级官员）镇压事件之后的虚拟项之间引入了一个交互项。该系数表明，镇压事件发生后，非官方收入的下降幅度更大。在最后一列中，我们将第
    4 列和第 5 列中的交互项同时加入回归中，发现只有后一项是显著的，这进一步表明实际的反腐败后果比单纯的政策冲击更有效。这些结果不仅进一步支持了估算的非官方收入与腐败之间的关系，而且揭示了反腐败措施在控制政府官员非官方收入方面的潜在效果。


    ## 5. 结论


    通过将购房数据与合法工资及其他家庭属性的行政记录相结合，本文提出了一个框架来推断官员非官方收入的平均值以及可能拥有非官方收入的官员比例。将该分析应用于 2006
    年至 2013 年的中国，我们发现官员的实际住房价值与其合法收入的预期之间存在楔形。我们发现，有官员家庭与无官员家庭在信息、技能、风险或风险偏好方面的差距不太可能解释这一楔形现象。我们将这一楔形现象解释为与腐败有关的政府官员非官方收入的证据。


    估计的非官方收入是合法收入的倍数往往随着政府官员级别的提高而急剧上升。举例来说，最底层的福禄（一级）官员的非官方收入是其合法收入的 44%，而数据中最高级的正禄（六级）官员的非官方收入可能超过其合法收入的
    424%。我们估计，13% 的官员可能有非官方收入，这一比例也是官员级别的递增函数。在正局级，65% 的官员可能有非官方收入。


    我们根据教育程度、年龄和性别来检验政府官员的工资是否低于私营部门的同行，结果发现数据否定了这一观点。因此，我们得出结论，不应将非官方收入视为对政府低工资的补偿。我们在第二个跨城市数据集中证实了上述基本结论。同样，政府官员似乎也有可观的不明收入。此外，在高层领导随后因重大腐败指控而被捕或被起诉的城市中，我们发现地方官员的非官方收入水平更高。这一结果表明，估计的非官方收入确实与腐败有关。我们还发现，在反腐运动结束后，非官方收入的规模会显著下降。


