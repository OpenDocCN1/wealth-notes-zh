    # ### 5. 结论


    通过将购房数据与合法工资及其他家庭属性的行政记录相结合，本文提出了一个框架来推断官员非官方收入的平均值以及可能拥有非官方收入的官员比例。将该分析应用于2006年至2013年的中国，我们发现官员的实际住房价值与其合法收入的预期之间存在楔形。我们发现，有官员家庭与无官员家庭在信息、技能、风险或风险偏好方面的差距不太可能解释这一楔形现象。我们将这一楔形现象解释为与腐败有关的政府官员非官方收入的证据。


    估计的非官方收入是合法收入的倍数往往随着政府官员级别的提高而急剧上升。舉例來說，最底層的 褔祿（一級）官員的非官方收入是其合法收入的44%，而數據中最高級的
    正祿（六級）官員的非官方收入可能超過其合法收入的424%。我們估計，13%的官員可能有非官方收入，這一比例也是官員級別的遞增函數。在正局級，65%的官員可能有非官方收入。


    我们根据教育程度、年龄和性别来检验政府官员的工资是否低于私营部门的同行，结果发现数据否定了这一观点。因此，我们得出结论，不应将非官方收入视为对政府低工资的补偿。我们在第二个跨城市数据集中证实了上述基本结论。同样，政府官员似乎也有可观的不明收入。此外，在高层领导随后因重大腐败指控而被捕或被起诉的城市中，我们发现地方官员的非官方收入水平更高。这一结果表明，估计的非官方收入确实与腐败有关。我们还发现，在反
    斗争结束后，非官方收入的规模会显著下降。'
