    \ / \\alpha_{Y}\\right)-1_{O}\\quad(5')$\n\n换句话说，我们可以根据政府官员“无法解释的”住房价值来估算他们的非官方收入，通过比较公式（4）中的两个斜率系数\
    \ $\\alpha_{O OFFICIAL}$ 和 $\\alpha_{Y}$，可以将其量化为官方收入的倍数。\n\n除了非官方收入的相对规模外，这种方法还可以估算腐败的普遍程度，即可能获取非官方收入的官员比例。为此，我们计算了每个家庭的住房需求函数的残差，并调查了得出的分布。具体地说，我们根据没有一个在政府部门工作的家庭作为参照组。然后，假定估计模型给出了家庭终生收入与房屋价值之间的真实关系，我们使用估计系数来计算每个家庭（包括有人在政府部门工作的家庭）的“未解释财富”或公式（2）的残差。\n\
