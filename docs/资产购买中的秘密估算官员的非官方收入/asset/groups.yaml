    的 $[j, j+0.01]$ 中的每个残差分，如果官方住户组的密度 $D_{official,j}$ 高于非公务员住户组的相应密度 $D_{non\ official,j}$，我们推断
    $(D_{official,j} - D_{non\ official,j})$ 官方住户中有一定密度的非官方收入。那么，拥有非官方收入的官方住户比例可计算为'
  md: "\n# 资产购买中的秘密：估算官员的非官方收入\n\n**Yongheng Deng**  \n**Shang-Jin Wei**  \n**Jing\
    \ Wu**  \n**Rongjie Zhang**\n\n工作文件 31748\nhttp://www.nber.org/papers/w31748\n\
    \n国家经济研究局 (NBER)  \n马萨诸塞大道 1050 号  \n马萨诸塞州剑桥 02138  \n2023 年 9 月\n\n未披露其他相关信息。本文所表达的观点仅代表作者本人，并不一定反映美国国家经济研究局的观点。\n\
    \nNBER 工作文件是为讨论和评论目的而分发的。这些论文未经同行评审，也未经过 NBER 董事会的审查，NBER 的正式出版物也是如此。\n\n© 2023\
    \ 作者：邓永恒、魏尚进、吴静、张荣杰。保留所有权利。未经明确许可，可引用不超过两段的短文，但须注明出处，包括 “©” 声明。\n\n## 摘要\n\n我们用解释所观察到的购房行为所需的收入与官方收入之间的差额来估算有政府官员的家庭可能的非官方收入规模。通过使用中国某大城市\
    \ 2006 年至 2013 年期间独特而全面的住房公积金和购房行政记录，我们得出了三个结论。首先，官员的平均非官方收入是其官方收入的 83%；这一比例随着官员级别的提高而急剧增加。第二，约有\
    \ 13% 的官员有非官方收入，这一比例也随着官员级别的提高而增加。第三，政府官员的工资并不低，他们的非官方收入并不是对政府低工资的补偿。此外，有证据表明，自最近的反腐运动以来，非官方收入有所下降。对另一个跨城市数据集的分析证实了这一重要结论。\n\
    \n**邓永恒**  \n威斯康星商学院 4110  \nGrainger Hall  \n975 University Ave  \n威斯康星州麦迪逊 53706\
    \  \nyongheng.deng@wisc.edu\n\n**Jing Wu**  \n清华大学建设管理系和恒隆房地产研究中心  \n中国  \nireswujiang@tsinghua.edu.cn\n\
    \n**魏尚进**  \n哥伦比亚大学商学院 哥伦比亚大学 Kravis 大楼  \n552 室 665 West 130th Street New York,\
    \ New 10027 和 NBER  \nshangjin.wei@columbia.edu\n\n**张荣杰**  \n清华大学建设管理系和恒隆房地产研究中心\
    \  \n中国 zhangrj19@mails.tsinghua.edu.cn\n\nJEL 编号: O12, O53\n\n## 1. 导言\n\n鉴于腐败对公司治理、经济和社会的毒害，金融和经济学文献都试图衡量腐败的规模和严重程度。以往的研究通常侧重于衡量腐败或高层腐败的平均水平，而关于政府官员中似乎存在非官方收入的比例的研究却很少。[^1]\n\
    \n衡量非官方收入的普遍性和水平对于评估官僚机构的质量至关重要。例如，高非官方收入和低官方收入的结合可以反映出政府中的人员类型。Caselli 和 Morelli（2004\
    \ 年）提出了腐败持续存在的一个原因：不诚实的人在政府中工作可能具有比较优势。他们不介意从事低收入的政府工作，因为他们期望获得贿赂。此外，他们可能会将公共部门的法定工资定得足够低，以赶走有能力的诚实人。诚实的人认为接受非官方报酬在心理上更痛苦，但他们也不愿意接受低于其保留工资的工资；而不诚实的人则不会有这两个问题。换句话说，低官方工资和高非官方（或腐败）收入的结合可能是一种稳定但不理想的社会均衡。\n\
    \n了解政府官员中获取非官方收入的比例对于制定有效的反腐败战略也很重要。原则上，可能存在两种腐败平衡状态：一种是少数极度腐败的官员与原本廉洁的官僚机构并存，另一种是腐败在整个官僚机构中更为普遍。这两种情况可能需要采取不同的反腐策略才能奏效。如果腐败集中在高层，但在官僚机构中并不普遍，那么人们就会更多地担心决策的质量，而较少担心繁文缛节或一般的经营成本。就反腐败战略而言，通过选举或弹劾（如\
    \ 2016 年 8 月在巴西或 2017 年 3 月在韩国发生的情况）罢免最高级别的腐败头目，可能足以实现目标。与此相反，如果整个官僚机构普遍存在非正式收入，那么大多数企业的经营成本就会很高。在这种情况下，即使政府高官在技术上很有能力，投资也会受到阻碍，经济增长也会受到影响。要使反腐败战略行之有效，就必须关注官僚普遍存在的寻租机会、获取非官方收入的诱惑、发现错误行为的可能性以及对普通官僚受贿的惩罚。\n\
    \n非官方收入的普遍性和水平都不容易估计，因为它们是 \"台面下 \"的收入。因此，对非官方收入的衡量只能是间接的，只能从其他可观测数据中推断。在本文中，我们提出了一种经验方法来估算腐败的普遍程度以及政府官员的非官方收入和合法收入的相对规模。为此，我们将一个大城市中近似家庭的可观察到的大件商品购买数据与官员和其他人经核实的合法收入结合起来。在大件商品购买与家庭终生收入之间存在稳定关系（即恩格尔曲线关系）的前提下，我们根据大件商品购买价值与观察到的合法收入所能预期的终生收入之间的差距来推断非官方收入。作为本文的一项创新，我们还可以\
    \ 通过比较官员与非官方 \"无法解释的收入 \"的估计密度函数，提取官员中拥有非官方收入的比例信息。\n\n我们将这一框架应用于中国，中国的非官方收入被委婉地称为\
    \ \"灰色收入\"。结合两个综合数据集--中国某大城市的住房公积金（HPF）缴存行政记录和购房交易数据--我们揭开了政府官员购买资产的秘密。使用住房公积金缴存记录非常重要（也很独特），因为它们提供了样本中每个人合法收入的详细情况。相比之下，文献中的许多研究采用的是自报收入，而自报收入可能更嘈杂，也更容易出现选择偏差。此外，尽管购房决定是在家庭层面做出的，但丈夫和妻子的收入往往无法匹配。在我们的数据集中，我们掌握了丈夫和妻子的收入历史、就业状况和家庭收入等信息。雇主的性质（如是否为政府机构）。换句话说，有关住房价值、官方收入和雇主类型的信息质量非常高。\n\
    \n我们的估计结果表明，在 2006 年至 2013 年的样本期间，政府官员的平均非官方收入占其官方收入的 83%。更有意思的是，我们发现非官方收入（占官员合法收入的百分比）随着官员级别和政府部门特权的增加而增加。例如，一个政府部门的司长（其级别为正处级，相当于中国政治等级中大多数中小城市的市长级别）的非官方收入是官方收入的\
    \ 42% 以上。就腐败的普遍程度而言，估计约有 13% 的官员获得了非官方收入，而且这一比例随着官员级别的提高而呈上升趋势。例如，8% 的非官方政府雇员有非官方收入，而\
    \ 65% 的正处级官员--样本中级别最高的官员--可能有非官方收入。我们的数据还发现，在可观察到的个人特征条件下，官员的平均收入往往略高于私营部门的同行。因此，我们拒绝非官方收入是对公共部门官员低工资的补偿这一假设。因此，提高公共部门工资本身可能不足以阻止政府官员获取非官方收入。\n\
    \n由于对腐败及其普遍性的估算是间接的，因此我们在文中花了大量篇幅讨论我们的识别假设以及可能危及其有效性的因素。例如，如果政府官员规避风险的能力较强或收入来源的风险较低，他们可能会将更大比例的财富用于买房。另一种情况是，如果官员家庭在选择房地产方面具有比较优势，在随后的时期内会比平均水平有更好的升值，或者在他们的补偿方案中拥有更多的非货币但合法的福利（如供暖和医疗服务补贴），他们也可能选择购买一套更大的公寓。我们在一系列稳健性检验中考察了上述每一种可能性。例如，为了检验政府官员收入更稳定的可能性，我们将他们与其他在工作安全性也很高的半官方机构工作的家庭进行比较，而不是与所有非官方家庭进行比较。为了排除以下比较优势的可能性\n\
    \n为了识别升值潜力更大的房地产，我们计算并比较了政府官员购买的公寓与非官员购买的公寓之间的实际升值率。我们还研究了官员购买的公寓可能获得价格折扣（Fang、Gu\
    \ 和 Zhou，2019 年）或更高的信贷额度（Agarwal 等人，2020a）的可能性。在每种情况下，我们的结论都不会受到实质性影响。\n\n另外几项发现进一步增强了我们对结论的信心。首先，如前所述，我们的方法估算出的非官方收入随着官员级别的提高而增加。对于那些在资源分配方面拥有更大特权的政府部门的官员来说，他们的非官方收入也往往更高。由于风险规避程度、无法衡量的合法财富以及其他混杂因素不太可能随着官员级别的提高而发生系统性变化--所有级别较高的官员在某些时候都来自级别较低的官员--我们估计的非官方收入很可能与官员职位的租金提取能力有关。\n\
    \n其次，我们利用了 2013 年之后（即样本结束之后）反腐运动所揭示的高层官员腐败严重的市政府局子集的信息。多家媒体报道显示，腐败的高官更有可能有腐败的下属。因此，如果估计的非官方收入与腐败有关，我们预计在这些局工作的官员的非官方收入会特别高。我们发现这些报告确实属实。这一发现进一步证实了估计的非官方收入很可能与腐败有关。\n\
    \n第三，我们使用 2005-2018 年间 99 个城市的购房数据集中探讨非官方收入的变化。我们发现，在反腐运动中，主要领导（市委书记或市长）随后因腐败被免职的城市，用我们的方法估算的非官方收入会系统性地显著增加。此外，我们还发现，在\
    \ 2013 年开始的反腐运动之后，新购房所隐含的非官方收入明显减少，尤其是在官员亲眼目睹了腐败的地方首长受到打击的地方。所有这些发现都支持了官员的非官方收入与腐败之间的联系。\n\
    \n本文与有关衡量腐败程度的文献相关，但又有所超越。McMillan 和 Zoido（2004 年）研究了 20 世纪 90 年代秘鲁藤森总统的间谍头目贿赂法官、议员、内阁部长和电视台老板的情况。\n\
    \nGorodnichenko 和 Peter（2007 年）的研究表明，乌克兰公共部门工人的工资往往低于企业工人，但他们的支出和资产水平却与企业工人相似。利用补偿性差异框架，他们认为这些公共部门工人一定有未报告的收入。Fisman、Schultz\
    \ 和 Vig（2014 年）利用印度对议会候选人申报财富的法律要求，作者发现赢得选举的个人资产增加加速度明显快于落选者。然而，由于非民选官僚通常不需要申报资产，因此这种方法不能用于估算整个公职人员群体中非官方收入的普遍性和规模。\n\
    \nO'Donovan、Wagner 和 Zeume（2019 年）利用最大的数据泄露之一，确定了 338 家上市公司为秘密离岸工具的使用者，并记录了这些工具被用于资助腐败、避税和征用股东。他们发现，数据泄露使受牵连公司的市值减少了\
    \ 1740 亿美元，每七家公司中就有一家拥有离岸秘密。此外，金融和会计领域也有大量文献采用各种数据泄露和巧妙的识别方法来探讨原本难以衡量的企业欺诈（Desai、Dyck\
    \ 和 Zingales，2007 年；Dyck、Morse 和 Zingales，2010 年）和逃税（Braguinsky、Mityakov 和 Liscovich，2014\
    \ 年；Clotfelter，1983 年；Feinstein，1991 年；Feldman 和 Slemrod，2007 年；Fisman 和 Wei，2004\
    \ 年；Pissarides 和 Weber，1989 年）。\n\n多篇论文利用微观层面的金融数据揭示了中国腐败现象。例如，Chen 和 Kung（2019）研究了\
    \ 2004 年至 2016 年间中国向政治精英提供的土地交易折扣。Fang、Gu和Zhou（2019）利用银行抵押贷款合同中报告的购房价格，发现样本中的官僚在购房时获得了折扣。Agarwal等人（2020a）利用一家中国银行的信用卡数据，发现政府官员获得的信贷额度比非官员高出16%。他们还发现反腐运动缓解了这种腐败现象。这些研究没有估算可能受贿的官员比例，也没有研究非官方收入如何随官员级别而变化。\n\
    \n本文对现有文献有三大贡献。首先，我们提出的框架不是以小样本的企业或个人为研究对象，而是以行政记录为基础，理论上涵盖了一个大城市中所有从事正式工作的雇员，包括政府官员。行政数据提供由雇主提供或核实的工资和薪金信息，而不是由购房者自行报告。由于数据几乎覆盖了整个城市，因此我们可以研究非官方收入的规模和比例是如何随着官员的级别和政府雇主的类型而变化的。相关文献尚未研究它们对非官方收入规模的影响。其次，据我们所知，本研究首次估算了接受腐败性非官方收入的政府官员的比例。第三，当我们对年龄、性别、教育水平和专业资格进行控制时，我们调查了政府官员的收入是否系统性地低于政府以外的同行。答案是否定的。因此，不能将非官方收入视为对政府官员薪酬过低的一种补偿；换言之，仅靠提高公共部门的薪酬并不能消除官员的寻租行为。本文似乎也是文献中首次对这一问题进行统计评估。\n\
    \n承认研究的潜在局限性也是有益的。我们的方法依赖于三个假设。我们在论文中详细讨论了它们。尽管我们列举了一长串假设可能失效的情况，并提出证据证明我们的结果可能是稳健的，但这项研究仍将受益于中国或其他国家其他数据集的交叉验证。\n\
    \n本文接下来的内容安排如下。我们在第 2 部分介绍了研究方法和数据，并在第 3 部分报告了基线估计值和若干扩展结果。第 4 节介绍基于多城市数据集的外部有效性分析。第\
    \ 5 节为结论。\n\n[^1]: 参见 Shleifer and Vishny (1993)、Wei (2000)、Kauffman and Wei (2000)\
    \ 和 Besley (2004)。\n\n## 2. 研究战略和数据\n\n### 2.1. 经验规格\n\n基本框架假定大额购买（购房）和大额消费之间存在稳定的关系。[^2]在这种情况下）和真正的永久收入（或总财富的年金）。[^3]其基本逻辑可以追溯到\
    \ 20 世纪 60 年代的新古典住房需求理论（Muth，1960 年；Olsen，1969 年）。家庭住房需求函数的一般形式为\n\n$V=f\\left(Y、p_{H}、p_{O}、H\\\
    right)、$ (1)\n\n其中，$V$ 是家庭的住房需求值，$Y$ 是家庭的永久收入，$p_{H}$ 是住房价格，$p_{O}$ 是所有非住房商品和服务的价格，$H$\
    \ 包括可能影响家庭住房消费偏好的所有其他家庭特征，如家庭成员的年龄和教育水平。如公式（1）所示，在控制其他因素的情况下，一个家庭的永久收入与其住房需求之间存在稳定的联系，这是我们的方法的关键假设。\n\
    \n在实证分析中，我们考虑公式（1）的对数线性化版本：\n\n$\\ln V=a Y-\\ln Y+\\beta L+\\gamma-T+\\delta-H+\\\
    varepsilon、$ (2)\n\n其中，$V$ 是所购住房单元的总价值，$Y$ 是家庭的永久收入，收入弹性为 $\\alpha$，$L$ 是空间（次级市场/地区）固定效应控制，$T$\
    \ 是时间（年份）固定效应控制。$L$ 和 $T$ 均用于捕捉所有住房和非住房商品/服务价格的异质性，以及影响家庭住房消费的其他宏观层面未观测因素。$H$\
    \ 是除收入以外的家庭特征向量，$\\varepsilon$ 是误差项。\n\n在我们的实证研究中，家庭永久收入与购房价值之间并不是单一的对数线性关系，而是采用家庭收入的片断函数，使两者之间的关系更加灵活。具体来说，我们将家庭收入划分为五个五等分层，并允许家庭收入的斜率（即\
    \ $\\alpha_{ij}$ ）在不同的五等分层中有所不同。\n\n[^2]: 近几十年来，无论是在中国还是其他经济体，购房在数量上都是家庭保存和积聚财富的最重要手段。Wu、Gyurko\
    \ 和 Deng（2012，2016）记录了中国主要城市的购房行为。Badarinza 和 Ramadorai（2018 年）也记录了“避险”动机对伦敦住房市场购房行为的重要性。\n\
    \n[^3]: Armott（1987 年）和 Smith、Rosen 和 Fallis（1988 年）对新古典住房需求理论和住房市场的经济模型进行了文献综述。\n\
    \n五分位数。换句话说，我们考虑不到不同收入阶层的房屋价值对家庭收入的弹性可能不同。\n\n家庭永久收入分为两部分。第一部分可从官方收入 $y_{o}$ 推断，第二部分则基于（未报告的）非官方收入\
    \ $y_{n}$。让 $y_{H}$ 代表非官方收入与官方收入的比率。我们有\n\n$Y=Y_{O}+Y_{H}=Y_{O}+Y_{O} \\cdot y_{H}=Y_{O}\
    \ \\cdot\\left(1+y_{H}\\right) .\\quad(3)$\n\n因此，公式（2）变为\n\n$\\ln V=\\alpha Y_{H}\
    \ \\ln y_{O}+\\alpha Y_{H} \\ln \\left(1+y_{H}\\right)+\\beta-L+\\gamma-T+\\delta\
    \ \\cdot H+\\varepsilon_{O}\\quad(4)$\n\n我们假定只有政府官员才有非官方收入（这一假定往往会低估官员非官方收入的相对规模和拥有非官方收入的官员比例）。我们使用一个虚拟变量\
    \ $OFFICIAL$ 来代表至少有一名成员担任政府官员的家庭。公式（4）可改写为\n\n$\\ln V=\\alpha Y_{H} \\ln y_{O}+\\\
    alpha OFFICIAL-\\alpha OFFICIAL+\\beta-L+\\gamma-T+\\delta \\cdot H+\\varepsilon_{O}\\\
    quad(4')$\n\n根据公式（4）和公式 $(4')$，因为\n\n$\\alpha Y_{H} \\ln \\left(1+y_{H}\\right)=\\\
    alpha_{O} OFFICAL,\\quad(5)$\n\n我们有\n\n$y_{H}=\\exp \\left(\\alpha_{O} OFFICIAL\
    \ / \\alpha_{Y}\\right)-1_{O}\\quad(5')$\n\n换句话说，我们可以根据政府官员“无法解释的”住房价值来估算他们的非官方收入，通过比较公式（4）中的两个斜率系数\
    \ $\\alpha_{O OFFICIAL}$ 和 $\\alpha_{Y}$，可以将其量化为官方收入的倍数。\n\n除了非官方收入的相对规模外，这种方法还可以估算腐败的普遍程度，即可能获取非官方收入的官员比例。为此，我们计算了每个家庭的住房需求函数的残差，并调查了得出的分布。具体地说，我们根据没有一个在政府部门工作的家庭作为参照组。然后，假定估计模型给出了家庭终生收入与房屋价值之间的真实关系，我们使用估计系数来计算每个家庭（包括有人在政府部门工作的家庭）的“未解释财富”或公式（2）的残差。\n\
    \n并非所有有正残差的正式家庭都应被解释为获得了非正式收入。其他未观察到的家庭特征，如大房子的特殊喜好，也会产生正残差。假设所有未观察到的家庭特征在官方家庭和非官方家庭中的分布相同，我们可以利用无人政府部门工作的家庭的残差分布来衡量其对其他类型家庭的影响。根据这一逻辑，我们可以将住房需求残差异常正值高的官方家庭定义为非官方收入家庭。这些官方住户的住房比那些在政府中无人的相同住户的住房更有价值。请注意，“其他条件相同”不仅指家庭的合法收入、教育水平、夫妻双方的年龄以及所有其他**可观察到的**特征保持不变，还包括**不可观察到的**属性或偏好的潜在影响。从图形上看，它们就是附录图\
    \ A-1 中阴影部分的正式家庭。\n\n根据这一策略，我们从官方家庭和无人政府部门工作的家庭的住房需求残差分布入手。我们将这两组家庭的剩余需求量放入带宽为\
    \ 0.01 的箱中。对于 $j > 0$ 的 $[j, j+0.01]$ 中的每个残差分，如果官方住户组的密度 $D_{official,j}$ 高于非公务员住户组的相应密度\
    \ $D_{non\\ official,j}$，我们推断 $(D_{official,j} - D_{non\\ official,j})$ 官方住户中有一定密度的非官方收入。那么，拥有非官方收入的官方住户比例可计算为\n"
  mdcn: "\n# 资产购买中的秘密：估算官员的非官方收入\n\n**Yongheng Deng**  \n**Shang-Jin Wei**  \n**Jing\
    \ Wu**  \n**Rongjie Zhang**\n\n工作文件 31748\nhttp://www.nber.org/papers/w31748\n\
    \n国家经济研究局 (NBER)  \n马萨诸塞大道 1050 号  \n马萨诸塞州剑桥 02138  \n2023 年 9 月\n\n未披露其他相关信息。本文所表达的观点仅代表作者本人，并不一定反映美国国家经济研究局的观点。\n\
    \nNBER 工作文件是为讨论和评论目的而分发的。这些论文未经同行评审，也未经过 NBER 董事会的审查，NBER 的正式出版物也是如此。\n\n© 2023\
    \ 作者：邓永恒、魏尚进、吴静、张荣杰。保留所有权利。未经明确许可，可引用不超过两段的短文，但须注明出处，包括 “©” 声明。\n\n## 摘要\n\n我们用解释所观察到的购房行为所需的收入与官方收入之间的差额来估算有政府官员的家庭可能的非官方收入规模。通过使用中国某大城市\
    \ 2006 年至 2013 年期间独特而全面的住房公积金和购房行政记录，我们得出了三个结论。首先，官员的平均非官方收入是其官方收入的 83%；这一比例随着官员级别的提高而急剧增加。第二，约有\
    \ 13% 的官员有非官方收入，这一比例也随着官员级别的提高而增加。第三，政府官员的工资并不低，他们的非官方收入并不是对政府低工资的补偿。此外，有证据表明，自最近的反腐运动以来，非官方收入有所下降。对另一个跨城市数据集的分析证实了这一重要结论。\n\
    \n**邓永恒**  \n威斯康星商学院 4110  \nGrainger Hall  \n975 University Ave  \n威斯康星州麦迪逊 53706\
    \  \nyongheng.deng@wisc.edu\n\n**Jing Wu**  \n清华大学建设管理系和恒隆房地产研究中心  \n中国  \nireswujiang@tsinghua.edu.cn\n\
    \n**魏尚进**  \n哥伦比亚大学商学院 哥伦比亚大学 Kravis 大楼  \n552 室 665 West 130th Street New York,\
    \ New 10027 和 NBER  \nshangjin.wei@columbia.edu\n\n**张荣杰**  \n清华大学建设管理系和恒隆房地产研究中心\
    \  \n中国 zhangrj19@mails.tsinghua.edu.cn\n\nJEL 编号: O12, O53\n\n## 1. 导言\n\n鉴于腐败对公司治理、经济和社会的毒害，金融和经济学文献都试图衡量腐败的规模和严重程度。以往的研究通常侧重于衡量腐败或高层腐败的平均水平，而关于政府官员中似乎存在非官方收入的比例的研究却很少。[^1]\n\
    \n衡量非官方收入的普遍性和水平对于评估官僚机构的质量至关重要。例如，高非官方收入和低官方收入的结合可以反映出政府中的人员类型。Caselli 和 Morelli（2004\
    \ 年）提出了腐败持续存在的一个原因：不诚实的人在政府中工作可能具有比较优势。他们不介意从事低收入的政府工作，因为他们期望获得贿赂。此外，他们可能会将公共部门的法定工资定得足够低，以赶走有能力的诚实人。诚实的人认为接受非官方报酬在心理上更痛苦，但他们也不愿意接受低于其保留工资的工资；而不诚实的人则不会有这两个问题。换句话说，低官方工资和高非官方（或腐败）收入的结合可能是一种稳定但不理想的社会均衡。\n\
    \n了解政府官员中获取非官方收入的比例对于制定有效的反腐败战略也很重要。原则上，可能存在两种腐败平衡状态：一种是少数极度腐败的官员与原本廉洁的官僚机构并存，另一种是腐败在整个官僚机构中更为普遍。这两种情况可能需要采取不同的反腐策略才能奏效。如果腐败集中在高层，但在官僚机构中并不普遍，那么人们就会更多地担心决策的质量，而较少担心繁文缛节或一般的经营成本。就反腐败战略而言，通过选举或弹劾（如\
    \ 2016 年 8 月在巴西或 2017 年 3 月在韩国发生的情况）罢免最高级别的腐败头目，可能足以实现目标。与此相反，如果整个官僚机构普遍存在非正式收入，那么大多数企业的经营成本就会很高。在这种情况下，即使政府高官在技术上很有能力，投资也会受到阻碍，经济增长也会受到影响。要使反腐败战略行之有效，就必须关注官僚普遍存在的寻租机会、获取非官方收入的诱惑、发现错误行为的可能性以及对普通官僚受贿的惩罚。\n\
    \n非官方收入的普遍性和水平都不容易估计，因为它们是 \"台面下 \"的收入。因此，对非官方收入的衡量只能是间接的，只能从其他可观测数据中推断。在本文中，我们提出了一种经验方法来估算腐败的普遍程度以及政府官员的非官方收入和合法收入的相对规模。为此，我们将一个大城市中近似家庭的可观察到的大件商品购买数据与官员和其他人经核实的合法收入结合起来。在大件商品购买与家庭终生收入之间存在稳定关系（即恩格尔曲线关系）的前提下，我们根据大件商品购买价值与观察到的合法收入所能预期的终生收入之间的差距来推断非官方收入。作为本文的一项创新，我们还可以\
    \ 通过比较官员与非官方 \"无法解释的收入 \"的估计密度函数，提取官员中拥有非官方收入的比例信息。\n\n我们将这一框架应用于中国，中国的非官方收入被委婉地称为\
    \ \"灰色收入\"。结合两个综合数据集--中国某大城市的住房公积金（HPF）缴存行政记录和购房交易数据--我们揭开了政府官员购买资产的秘密。使用住房公积金缴存记录非常重要（也很独特），因为它们提供了样本中每个人合法收入的详细情况。相比之下，文献中的许多研究采用的是自报收入，而自报收入可能更嘈杂，也更容易出现选择偏差。此外，尽管购房决定是在家庭层面做出的，但丈夫和妻子的收入往往无法匹配。在我们的数据集中，我们掌握了丈夫和妻子的收入历史、就业状况和家庭收入等信息。雇主的性质（如是否为政府机构）。换句话说，有关住房价值、官方收入和雇主类型的信息质量非常高。\n\
    \n我们的估计结果表明，在 2006 年至 2013 年的样本期间，政府官员的平均非官方收入占其官方收入的 83%。更有意思的是，我们发现非官方收入（占官员合法收入的百分比）随着官员级别和政府部门特权的增加而增加。例如，一个政府部门的司长（其级别为正处级，相当于中国政治等级中大多数中小城市的市长级别）的非官方收入是官方收入的\
    \ 42% 以上。就腐败的普遍程度而言，估计约有 13% 的官员获得了非官方收入，而且这一比例随着官员级别的提高而呈上升趋势。例如，8% 的非官方政府雇员有非官方收入，而\
    \ 65% 的正处级官员--样本中级别最高的官员--可能有非官方收入。我们的数据还发现，在可观察到的个人特征条件下，官员的平均收入往往略高于私营部门的同行。因此，我们拒绝非官方收入是对公共部门官员低工资的补偿这一假设。因此，提高公共部门工资本身可能不足以阻止政府官员获取非官方收入。\n\
    \n由于对腐败及其普遍性的估算是间接的，因此我们在文中花了大量篇幅讨论我们的识别假设以及可能危及其有效性的因素。例如，如果政府官员规避风险的能力较强或收入来源的风险较低，他们可能会将更大比例的财富用于买房。另一种情况是，如果官员家庭在选择房地产方面具有比较优势，在随后的时期内会比平均水平有更好的升值，或者在他们的补偿方案中拥有更多的非货币但合法的福利（如供暖和医疗服务补贴），他们也可能选择购买一套更大的公寓。我们在一系列稳健性检验中考察了上述每一种可能性。例如，为了检验政府官员收入更稳定的可能性，我们将他们与其他在工作安全性也很高的半官方机构工作的家庭进行比较，而不是与所有非官方家庭进行比较。为了排除以下比较优势的可能性\n\
    \n为了识别升值潜力更大的房地产，我们计算并比较了政府官员购买的公寓与非官员购买的公寓之间的实际升值率。我们还研究了官员购买的公寓可能获得价格折扣（Fang、Gu\
    \ 和 Zhou，2019 年）或更高的信贷额度（Agarwal 等人，2020a）的可能性。在每种情况下，我们的结论都不会受到实质性影响。\n\n另外几项发现进一步增强了我们对结论的信心。首先，如前所述，我们的方法估算出的非官方收入随着官员级别的提高而增加。对于那些在资源分配方面拥有更大特权的政府部门的官员来说，他们的非官方收入也往往更高。由于风险规避程度、无法衡量的合法财富以及其他混杂因素不太可能随着官员级别的提高而发生系统性变化--所有级别较高的官员在某些时候都来自级别较低的官员--我们估计的非官方收入很可能与官员职位的租金提取能力有关。\n\
    \n其次，我们利用了 2013 年之后（即样本结束之后）反腐运动所揭示的高层官员腐败严重的市政府局子集的信息。多家媒体报道显示，腐败的高官更有可能有腐败的下属。因此，如果估计的非官方收入与腐败有关，我们预计在这些局工作的官员的非官方收入会特别高。我们发现这些报告确实属实。这一发现进一步证实了估计的非官方收入很可能与腐败有关。\n\
    \n第三，我们使用 2005-2018 年间 99 个城市的购房数据集中探讨非官方收入的变化。我们发现，在反腐运动中，主要领导（市委书记或市长）随后因腐败被免职的城市，用我们的方法估算的非官方收入会系统性地显著增加。此外，我们还发现，在\
    \ 2013 年开始的反腐运动之后，新购房所隐含的非官方收入明显减少，尤其是在官员亲眼目睹了腐败的地方首长受到打击的地方。所有这些发现都支持了官员的非官方收入与腐败之间的联系。\n\
    \n本文与有关衡量腐败程度的文献相关，但又有所超越。McMillan 和 Zoido（2004 年）研究了 20 世纪 90 年代秘鲁藤森总统的间谍头目贿赂法官、议员、内阁部长和电视台老板的情况。\n\
    \nGorodnichenko 和 Peter（2007 年）的研究表明，乌克兰公共部门工人的工资往往低于企业工人，但他们的支出和资产水平却与企业工人相似。利用补偿性差异框架，他们认为这些公共部门工人一定有未报告的收入。Fisman、Schultz\
    \ 和 Vig（2014 年）利用印度对议会候选人申报财富的法律要求，作者发现赢得选举的个人资产增加加速度明显快于落选者。然而，由于非民选官僚通常不需要申报资产，因此这种方法不能用于估算整个公职人员群体中非官方收入的普遍性和规模。\n\
    \nO'Donovan、Wagner 和 Zeume（2019 年）利用最大的数据泄露之一，确定了 338 家上市公司为秘密离岸工具的使用者，并记录了这些工具被用于资助腐败、避税和征用股东。他们发现，数据泄露使受牵连公司的市值减少了\
    \ 1740 亿美元，每七家公司中就有一家拥有离岸秘密。此外，金融和会计领域也有大量文献采用各种数据泄露和巧妙的识别方法来探讨原本难以衡量的企业欺诈（Desai、Dyck\
    \ 和 Zingales，2007 年；Dyck、Morse 和 Zingales，2010 年）和逃税（Braguinsky、Mityakov 和 Liscovich，2014\
    \ 年；Clotfelter，1983 年；Feinstein，1991 年；Feldman 和 Slemrod，2007 年；Fisman 和 Wei，2004\
    \ 年；Pissarides 和 Weber，1989 年）。\n\n多篇论文利用微观层面的金融数据揭示了中国腐败现象。例如，Chen 和 Kung（2019）研究了\
    \ 2004 年至 2016 年间中国向政治精英提供的土地交易折扣。Fang、Gu和Zhou（2019）利用银行抵押贷款合同中报告的购房价格，发现样本中的官僚在购房时获得了折扣。Agarwal等人（2020a）利用一家中国银行的信用卡数据，发现政府官员获得的信贷额度比非官员高出16%。他们还发现反腐运动缓解了这种腐败现象。这些研究没有估算可能受贿的官员比例，也没有研究非官方收入如何随官员级别而变化。\n\
    \n本文对现有文献有三大贡献。首先，我们提出的框架不是以小样本的企业或个人为研究对象，而是以行政记录为基础，理论上涵盖了一个大城市中所有从事正式工作的雇员，包括政府官员。行政数据提供由雇主提供或核实的工资和薪金信息，而不是由购房者自行报告。由于数据几乎覆盖了整个城市，因此我们可以研究非官方收入的规模和比例是如何随着官员的级别和政府雇主的类型而变化的。相关文献尚未研究它们对非官方收入规模的影响。其次，据我们所知，本研究首次估算了接受腐败性非官方收入的政府官员的比例。第三，当我们对年龄、性别、教育水平和专业资格进行控制时，我们调查了政府官员的收入是否系统性地低于政府以外的同行。答案是否定的。因此，不能将非官方收入视为对政府官员薪酬过低的一种补偿；换言之，仅靠提高公共部门的薪酬并不能消除官员的寻租行为。本文似乎也是文献中首次对这一问题进行统计评估。\n\
    \n承认研究的潜在局限性也是有益的。我们的方法依赖于三个假设。我们在论文中详细讨论了它们。尽管我们列举了一长串假设可能失效的情况，并提出证据证明我们的结果可能是稳健的，但这项研究仍将受益于中国或其他国家其他数据集的交叉验证。\n\
    \n本文接下来的内容安排如下。我们在第 2 部分介绍了研究方法和数据，并在第 3 部分报告了基线估计值和若干扩展结果。第 4 节介绍基于多城市数据集的外部有效性分析。第\
    \ 5 节为结论。\n\n[^1]: 参见 Shleifer and Vishny (1993)、Wei (2000)、Kauffman and Wei (2000)\
    \ 和 Besley (2004)。\n\n## 2. 研究战略和数据\n\n### 2.1. 经验规格\n\n基本框架假定大额购买（购房）和大额消费之间存在稳定的关系。[^2]在这种情况下）和真正的永久收入（或总财富的年金）。[^3]其基本逻辑可以追溯到\
    \ 20 世纪 60 年代的新古典住房需求理论（Muth，1960 年；Olsen，1969 年）。家庭住房需求函数的一般形式为\n\n$V=f\\left(Y、p_{H}、p_{O}、H\\\
    right)、$ (1)\n\n其中，$V$ 是家庭的住房需求值，$Y$ 是家庭的永久收入，$p_{H}$ 是住房价格，$p_{O}$ 是所有非住房商品和服务的价格，$H$\
    \ 包括可能影响家庭住房消费偏好的所有其他家庭特征，如家庭成员的年龄和教育水平。如公式（1）所示，在控制其他因素的情况下，一个家庭的永久收入与其住房需求之间存在稳定的联系，这是我们的方法的关键假设。\n\
    \n在实证分析中，我们考虑公式（1）的对数线性化版本：\n\n$\\ln V=a Y-\\ln Y+\\beta L+\\gamma-T+\\delta-H+\\\
    varepsilon、$ (2)\n\n其中，$V$ 是所购住房单元的总价值，$Y$ 是家庭的永久收入，收入弹性为 $\\alpha$，$L$ 是空间（次级市场/地区）固定效应控制，$T$\
    \ 是时间（年份）固定效应控制。$L$ 和 $T$ 均用于捕捉所有住房和非住房商品/服务价格的异质性，以及影响家庭住房消费的其他宏观层面未观测因素。$H$\
    \ 是除收入以外的家庭特征向量，$\\varepsilon$ 是误差项。\n\n在我们的实证研究中，家庭永久收入与购房价值之间并不是单一的对数线性关系，而是采用家庭收入的片断函数，使两者之间的关系更加灵活。具体来说，我们将家庭收入划分为五个五等分层，并允许家庭收入的斜率（即\
    \ $\\alpha_{ij}$ ）在不同的五等分层中有所不同。\n\n[^2]: 近几十年来，无论是在中国还是其他经济体，购房在数量上都是家庭保存和积聚财富的最重要手段。Wu、Gyurko\
