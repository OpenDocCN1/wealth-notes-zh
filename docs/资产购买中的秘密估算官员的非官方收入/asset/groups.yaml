    ### 3.4. 非官方收入是对政府支付不足的补偿吗？


    人们可能会问，相对于其资历而言，政府官员的报酬是否偏低，因此是否可以将非官方收入视为对报酬偏低的一种补偿。事实上，一种常见的说法是，政府官员领取非正式收入是因为他们的报酬很低。


