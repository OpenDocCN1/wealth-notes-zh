    在表 2 的第 3 列中，我们按职能对政府各局进行了区分。尽管所有的虚拟变量都显著为正，但仍存在有趣的差异。有两类政府部门的非官方收入最高：一类是负责税收和政府控制资源（如土地）的部门，另一类是负责投资大型项目（如新建高速公路或新的水处理厂）的部门。这些部门的官员平均可获得的非官方收入分别是其官方收入的
    121% 和 126%。一般办公室和其他不太重要的局（“其他”类）的官员的非官方收入要少得多，分别约为其官方收入的 53% 和 38%。


    第 4 列包含两组虚拟变量，它们提供了非官方收入规模如何取决于官员级别和其办公室功能的信息。例如，对于一个负责财政和资源事务的局正处级（四级）官员，相应的系数为
    0.195（=0.128+0.067），表明其非官方收入约为官方收入的 295%。相比之下，一般办公室的最底层官员只能获得官方收入约 25% 的非官方收入。


    我们通过探讨非官方收入的一种特殊形式的跨局变化，进一步证实估计的非官方收入与腐败有关。


    关于中共地方党委和政府办公厅，有一点需要注意：虽然这些部门在宏观层面上对城市的运营至关重要，但它们与市场参与者之间几乎不存在直接联系，这意味着获得非官方收入的机会有限。另外，这些部门的官员可能受到更严格的监督，因此寻求非官方收入的机会也更少。


    2012 年末，中国中央政府开展了一场声势浩大的反腐运动，许多官员因腐败而被捕或被起诉。


    通过这场反腐运动，我们可以将样本城市中的局分成两类：一类是局长在随后几年被发现腐败的局，另一类是高层没有腐败案件的局。一个值得关注的假设是，如果一个局的最高领导是腐败分子，那么该局的治理机制很可能已经崩溃，即使在局领导的腐败案件曝光之前，该局的非官方收入问题总体上也可能比城市平均水平更为严重。需要注意的是，一些未被曝光的局级高官可能仍然腐败，因此，其下属的受贿或贪污行为可能与高官被罢免的局级高官的受贿或贪污行为并无不同。因此，有腐败高官和没有腐败高官的局之间的非官方收入差异估计值是其真实值的下限。


    为此，我们从样本城市的中国共产党纪律检查委员会官方网站上手工收集了所有被举报的政府官员腐败案件的信息。我们重点关注同时满足以下三个条件的腐败官员：（a）担任某局正职或副局长；（b）正处级或以上（三级）；（c）在
    2012 年 11 月至 2016 年 12 月期间被指控腐败。在所有 5364 个官员家庭中，有 151 个家庭（占 2.82%）在样本期内曾在被曝光的“腐败领导”所在的局工作。


    在表 3 中，我们在政府官员虚拟项和高层腐败的局虚拟项之间添加了一个交互项。根据第 1 列，在领导腐败的局中工作的政府官员的交互项为正，且在 1% 的水平上具有统计意义。根据这些系数，非官方收入估计为其报告收入的
    236%，大大高于平均水平。这一结果与腐败的“上层”更可能有腐败的“下层”这一观点是一致的。数据模式也支持了我们的观点，即我所理解的非官方收入确实与腐败有关。与此同时，我们还注意到
    Dimmock, Gerken 和 Graham (2018 年) 的研究表明，同事会影响个人实施财务不当行为的倾向。这一发现表明，腐败同事的存在也可能增加官员受贿的可能性。


    与表 2 相比，政府官员虚拟变量（第 1 栏）或各种级别/局类型（第 2-4 栏）几乎没有变化。因此，基线结果并不完全是由这些领导腐败的局造成的。


    ## 3.2. 非官方收入的分布情况


    迄今为止的估算揭示了所有官员在特定级别和职务组合下的平均非官方收入。然而，平均值可能来自截然不同的分布。例如，某一群体的非官方收入可能都集中在平均值附近，也可能呈双峰分布（例如，反映出在大多数不腐败的官员中，有少数非常腐败的人）。


    为了研究其分布情况，如第 2.1 节所述，我们根据无人在政府部门工作的家庭样本重新估计公式（2），并使用估计系数计算每个家庭（包括有或没有家庭成员在政府部门工作的家庭）的公式（2）残差。在图
    3 中，我们分别绘制了三组残差的密度函数：无人在政府工作的家庭、有非官方公务员的家庭和有政府官员的家庭。有官员的家庭的未说明财富密度在有非官方公务员的家庭的右边，而有非官方公务员的家庭的未说明财富密度又在没有人在政府工作的家庭的右边。这种模式表明“非官方收入”是存在的，官员往往比非官员的低级公务员获得更多的非官方收入。


    在图 4 中，我们报告了有政府官员的三个分组家庭（分别为 zheng ke （二级）、 zheng chu （四级）和 zheng ju （六级））的无法解释的财富分布情况。（为了避免图表过于拥挤，我们跳过了其他三个官员级别的密度）。令人吃惊的是，随着官阶从正科上升到正处和正局，相应的不明财富密度曲线也向右移动。这一发现增强了对“灰色收入”随官阶增加而增加的解释。


    曲线的这种相对位置并不令人惊讶：从表 2 中，我们已经知道了平均值。


    在有政府官员的家庭中，非官方收入与官方收入的比例较高，而且该比例也随等级的提高而提高。从图表中可以看出，关于平均值的结果并不是由异常值引起的。对偏度和峰度的正式计算表明，尽管密度函数并不严格遵循正态分布，但它们近似于钟形。对没有明显异常值的一种解释是，领取非正式收入是一种相对普遍的现象，而不是一种仅限于少数极端腐败分子的现象。


    作为一项更具结论性的分析，我们采用第 2.1 节中的公式 (6) 来计算政府官员中可能获取非官方收入的比例。结果见图 5。根据这一方法，估计有 13% 的官方家庭获得了非官方收入。我们还可以对每个级别的官员进行单独计算。这一估计比例随着官员级别的提高而上升，从非官方公务员的
    8% 到正科级（二级）家庭的 16%，再到正处级（六级）官员的 65%。我们还可以计算各类政府部门的比例。负责投资大型项目的政府部门官员最有可能拥有非官方收入
    (42%)。在其他五个类别中，拥有非官方收入的官员比例变化较小，在不太重要的局（“其他”类）中为 14%，在负责税收和政府控制资源的局中为 23%。


    ## 3.3. 对关键识别假设进行压力测试


    在本节中，我们将进行一系列广泛的稳健性检验，尤其关注第 2.3 节中所述的三个关键识别假设是否可能失效，以及这些失效对本文主要推论的潜在影响。


    ### (1) 永久收入计算假设


    我们的方法基于这样一个前提，即我们的程序可以根据观察到的收入历史和线性内插法很好地测算出一个家庭的终生收入。我们考虑了以下可能使这一假设失效的因素。


    首先，如果政府官员预计未来收入增长速度更快，那么这一假设就可能失效比非官方家庭高。由于我们拥有样本中所有家庭从 2006 年到 2013 年的（合法）收入历史记录，因此我们可以比较这一时期的实际收入增长情况。根据附录表
    A-4，事实上，有政府官员的家庭（10.6%）比没有政府官员的家庭（13.8%）在近期的收入增长要慢。平均而言，官员级别越高，增长率往往越慢。因此，近期收入增长的实
    际数据并不支持政府官员收入增长可能更快的观点。


    其次，如果许多官员预期在退休前离开政府，在私营部门从事更有利可图的工作，那么我们的程序可能低估了官员的终生收入。这种现象在美国比较常见，被称为“旋转门”。然而，与美国不同的是，“旋转门”现象在中国并不常见。由于我们知道所有个人在八年（2006-2013
    年）期间的就业历史，因此我们可以计算出样本中政府官员的平均离职率。我们发现年辞职率为 0.22%。对于离退休还有 20 年的官员来说，她在政府工作到退休的概率是
    96% [= (1-0.0022)^20]。换句话说，绝大多数官员一旦进入政府工作，就会一直在政府工作到退休。如果官员有机会通过在政府工作获得非官方收入，那么低流动率就不足为奇了。此外，请注意政府退休人员一般不工作。


    在表 4 的第 1 列中，我们研究了结果是否对允许政府官员在退休前辞去职务到私营部 门从事收入更高的工作敏感。非官方家庭的永久收入平均水平比官方家庭高 200%。我们假设某个官员家庭可以预期以每年
    0.22% 的速度离开政府工作岗位，并看到与私营部门工作相称的收入跃升。我们进一步假设，官员一旦离开政府，就会一直在政府外工作，直到退休。如表所示，这一修改使隐含的非官方收入略有减少，但并没有从根本上改变我们的结论。


    第三，样本中的一些购房者在购房前已经拥有一套住房。数据库。在基本规格中，我们估算已拥有的现有住房单元的市场价值，并将其计入家庭的终生收入。在表 4 的第 2
    列中，我们以不同的方式考虑了当前房屋所有权的影响。我们使用新购买的公寓和已拥有的公寓的价值之和作为因变量；同时，我们在计算终生收入时不包括已拥有的住宅的估计价值。估算的目的是相同的，即找出需要多少非官方收入（如果有的话）来证明所观察到的房屋（公寓）购买价值是合理的。非官方收入的结果与之前的估算结果在质量上是一致的。


    最后，我们对家庭永久收入的计算涉及有关收入增长率、贴现率、净财富、支出费用、退休年龄和预期寿命的信息和假设。一方面，在表 4 的第 3 列中，我们用家庭特有的基本因素（包括夫妻双方的当前收入和以前的收入增长率以及净财富）来替代估算的永久收入；另一方面，在表
    4 的第 4 列中，我们用家庭特有的基本因素（包括夫妻双方的当前收入和以前的收入增长率以及净财富）来替代估算的永久收入。基本的质量特征依然存在。特别是，官员会获得非官方收入，而且非官方收入的规模会随着级别的提高而增加。另一方面，我们在附录
    B 中研究了结论对这些参数变化的敏感性。结果表明，所有主要推论都是可靠的。


    ### (2) 官方住户和非官方住户的不同属性


    我们的方法所依据的第二个关键识别假设是，除了表 2 中已控制的特征外，有政府官员的家庭和没有政府官员的家庭是相似的。如果其他未观察到的差异（除了非官方收入）可能导致他们在购房时表现出系统性差异，那么这一假设就可能失效。我们考虑了以下潜在的未观察到的差异。


    首先，这两类家庭会不会面临系统性的不同风险水平和/或具有不同程度的风险规避？如果政府工作比非政府工作更有保障（即个人被政府解雇的可能性较低），那么有家庭成员担任官员的家庭可能面临系统性较低的风险。如果他们的风险规避程度相同、因此，正式家庭可能会将更大一部分投资用于风险相对较高的资产，如住房。在这种情况下，官方家庭可能会在一定收入水平下购买价值更高的住房。另一方面，如果风险规避程度较高的人更有可能自我选择进入政府部门（受其更大的工作保障所吸引），那么官方家庭可能比其他家庭平均规避更多风险。在这种情况下，他们可能会选择减少对住房等风险资产的投资（如果他们将住房视为风险较低的资产，则会增加对住房的投资）。


    针对风险和风险偏好可能产生的影响，我们的策略是将正式家庭与可能面临类似风险且具有类似风险规避水平的家庭进行比较。首先，我们将样本中的比较组限定为至少有一名成员在政府下属公共机构工作的家庭（中文称为“公务员家庭”）。正如
    Wong（2009）以及 Collins 和 Cottey（2018）所详细描述的，中国的事业单位通过作为“影子政府”提供公共服务来帮助相应的政府部门。具体而言，事业单位员工与政府雇员有几个共同的主要特征：他们都需要通过官方和公开考试才能获得工作；他们的（合法）收入是相应政府部门财政支出的一部分；他们的职级相同，这决定了他们的合法薪酬待遇。事实上，一些公共机构的雇员被官方称为“准公务员”。这些机构的工作很可能与政府工作一样有保障，因此很可能吸引具有同等风险规避程度的个人。然而，事业单位雇员不能像政府官员那样分享权力，因此不太可能有非官方收入。表
    5 第 1 栏报告了回归结果。我们发现基本结论与基线估计结果在性质上相似：公职人员有非官方收入，而且往往随着官员级别的提高而增加；换句话说，我们的主要结论在允许官员与非官员在工作保障和风险规避程度上存在差异的情况下是稳健的。


    在表 5 第 2 列中，我们用国有企业（SOE）员工代替对照组，因为国有企业员工与政府官员和政府所属公共机构员工的工作保障相似，而我们同时采用政府所属公共机构员工和国有企业员工作为对照组。第
    3 列以国有企业员工为对照组。两列结果均保持稳健。


    其次，政府官员可以领取实物或其他非薪金福利，如免费医疗和冬季取暖费津贴。最重要的是，政府官员不需要向其养老金计划缴费，但期望在退休时领取养老金。这些隐性福利不会显示在数据库记录的工资信息中，但却是官员合法收入的一部分。如果我们不将这些福利计入他们的终生收入，我们可能会低估他们合法获得的真实财富，从而夸大官员的非官方收入。


    现在，我们尝试为这些福利赋予货币价值。在查阅了样本期间有关这些福利的政府文件后，我们确定了不包括在工资中的三类法定福利，即免费医疗、冬季取暖费补贴和免费养老金计划。根据规定，所有其他福利都应计入正式工资。（请注意，只有副部级或更高级别的官员才能使用政府车辆；因此，这项福利与我们样本中的官员无关）。官方活动之外的宴请不被正式允许，应被视为非官方收入的一部分。我们根据样本城市当地统计局提供的城市家庭消费统计数据来估算这些福利的等值货币价值。对于每种福利，我们假定其货币价值等于同年该城市收入最高的
    20% 家庭为该福利所支付的费用 的平均值。如附表 A-5 所示，以 2012 年为例，家庭收入分布前 20% 的家庭平均每年为集中供暖支付 380 元。我们将此金额作为正式家庭免费集中供暖的货币价值。我们以类似方式计算其他福利的价值。2012
    年，一名官员的所有非薪金福利的总价值为每年 2 947 元，大大低于之前估算的非官方收入。


    在表 5 的第 4 列中，我们用修订后的官员薪酬估值重新估计了这一指标。在考虑到这些福利的货币价值的情况下，对终生收入进行了估算。结果与基线情况非常相似，估计的非官方收入略低。因此，我们的结果不太可能是由于遗漏了合法的非薪金福利造成的。


    尽管进行了这些稳健性检验，我们仍应注意到一些局限性。特别是，由于 HPF 数据不包 括其他家庭成员的信息，我们无法讨论官方家庭和非官方家庭之间父母财富的潜在差异。此外，官方家庭可能对作为身份商品的住房有更大的渴望，因此愿意为购房支付更多费用，这可能是因为与子女相关的激励（魏、张和刘，2017
    年）或对显性支出的更高需求。我们使用不同 的数据集（CFPS）来评估这两个潜在混杂因素的重要性，该数据集包含更丰富的家庭属性信 息。我们还注意到，上述未观察到的家庭属性都不可能
    与官员级别或政府部门类型同时发生变化--所有级别较高的官员都是在某一时刻从级别较低的官员晋升而来的。因此，表 2 中显示的 非官方收入梯度表明，这些因素对我们的主要研究结果可能并不具有量化意义。


    ### (3) 官方家庭和非官方家庭的住房市场条件不同


    另一个关键的识别假设是，官员和非官员在住房市场上面临相同的单位价格。这一假设可 能在多个方面失效。首先，如果官员在 market 交易中不那么精明，他们可能会多付购房款。其次
    ，与之相反的可能性是，房地产开发商可能会为官员提供折扣。虽然折扣可能是一种贿赂形式 ，但较低的单价可能促使官员购买比非官方官员更大的住房。然而，两种房屋购买价值的差异
    可能并不反映官员的非官方收入规模。我们将依次研究这些可能性。


    我们先从官员家庭在住房交易中可能多付了钱说起。由于许多政府官员并不直接参与市场活动，他们可能对特定住房单元的"合理"价格了解较少（信息劣势），或者与卖方讨价还价的技巧较差（技巧劣势）。在这种情况下，他们可能需要花费在其他条件相同的情况下，住房单元的价格会更高。这一假设可以从两个方面被否定。首先，如附表
    A-6 所示，对于只有一名成员在政府部门工作的家庭来说，结果是稳健的；换句话说，即使有一名家庭成员在政府部门以外工作，官方家庭也会购买更贵的住房。其次，由于房屋的总价值可以写成面积（建筑面积，单位：平方米）和单价（价格，单位：元/平方米）的乘积，我们分别以面积和单价作为因变量进行回归。结果见表
    6 的前两列。我们看到，官方家庭的住房之所以具有较高的货币价值，几乎完全是因为他们购买了实际面积较大的住房。事实上，购房面积往往随着官员级别的提高而单调增加。因此，我们拒绝信息劣势或技能劣势假说。


    与信息或技能劣势相反的一种说法是，对住房开发的许可证、执照或其他资源分配决策拥有自由裁量权的政府官员在购房时可能会从房地产开发商那里获得折扣。在这种情况下，折扣可能是一种贿赂形式，但政府官员住房的额外价值不再仅仅是非官方收入的结果。据
    Fang、Gu 和 Zhou（2019）估计，折扣平均为 1.05%，并可能随着官员级别的提高而增加。我们按照方等人的策略来检验我们的数据中是否存在类似的模式。按照
    Fang 等人的方法，我们将样本限定为新建住房（从房地产公司购房），并将官员家庭的范围缩小到可能对房地产公司拥有权力的家庭，即在以下职能部门工作的家庭：发改委、税务、房管局、土地管理局和建设规划局。在表
    6 的第 3 列中，我们确实发现了一些折扣梯度的证据，尤其是对于 zheng chu（四级）和 zheng ju（六级）级别的官员来说，价格折扣尤为显著。总体而言，折扣似乎很小，对我们的结果影响不大。如果我们将所有正式住户包括在内或将转售交易包括在内，价格折扣并不明显。有关结果可向我们索取。


    另一种解释是，官员在以下方面可能更熟练或更有经验例如，他们可以更好地了解未来的城市发展，或更好地预测未来可能影响住房价值的政府政策。在这种情况下，官员家庭将更多资产分配到住房领域是合理的。然而，表
    6 第 4 列的结果否定了这一假设，该列考察了官员是否系统性地选择了在后续时期价格上涨较快的住房地点。在这一回归中，因变量是购房后 12 个月内（在购房的同一子市场）当地住房价格的累计增长。


    在控制其他因素的情况下，虽然存在一些正系数和负系数，但我们并没有看到系统性的证据表明官员家庭在选择公寓购买地点时更善于选择优于其他地点的地点。


    最后，我们检验了政府官员是否在抵押贷款条件方面获得了优惠待遇，如较低的利率、较高的贷款价值比或较长的到期时间。附录表 A-2 中的汇总统计显示，有政府官员的家庭与没有政府官员的家庭之间没有显著差异。然后，我们将利率、贷款价值比和到期时间分别作为因变量。如附录表
    A-7 所示，我们发现两类家庭之间没有系统性差异。在表 6 的最后一列中，我们在房屋价值回归中引入了这些抵押贷款项作为额外的控制变量。结果在本质上仍然相似。


