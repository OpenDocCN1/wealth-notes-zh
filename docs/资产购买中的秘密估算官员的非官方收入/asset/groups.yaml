  - '[PAGE 19]


    一个在政府部门工作。然后，假定估计模型给出了家庭终生收入与房屋价值之间的真实关系，我们使用估计系数来计算每个家庭（包括有人在政府部门工作的家庭）的“未解释财富”或公式（2）的残差。


    并非所有有正残差的正式家庭都应被解释为获得了非正式收入。其他未观察到的家庭特征，如大房子的特殊喜好，也会产生正残差。假设所有未观察到的家庭特征在官方家庭和非官方家庭中的分布相同，我们可以利用无人政府部门工作的家庭的残差分布来衡量其对其他类型家庭的影响。根据这一逻辑，我们可以将住房需求残差异常正值高的官方家庭定义为非官方收入家庭。这些官方住户的住房比那些在政府中无人的相同住户的住房更有价值。请注意，“其他条件相同”不仅指家庭的合法收入、教育水平、夫妻双方的年龄以及所有其他**可观察到的**特征保持不变，还包括**不可观察到的**属性或偏好的潜在影响。从图形上看，它们就是附录图
    A-1 中阴影部分的正式家庭。


