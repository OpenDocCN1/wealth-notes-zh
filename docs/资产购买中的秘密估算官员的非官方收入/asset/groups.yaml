    中级（中级）；(d) 无职称。

    [^14]: 家庭成员是否在城市中心区工作也会影响购房行为。在中心区工作的人可能更愿意在中心区或附近买房，以节省通勤时间。中心区或中心区附近的住宅往往比距离市中心较远的同类住宅价格更高。由于我们知道丈夫和妻子的雇主地址，因此我们在至少有一名成员在城市中心区工作的家庭中加入了中心区虚拟变量。

    [^15]: 我们还引入了城市内次级地理单元的单独固定效应和月份固定效应，结果是稳健的。


