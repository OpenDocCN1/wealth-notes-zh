    # 资产购买中的秘密：估算官员的非官方收入 邓永恒、魏尚进、吴晶、张荣杰


    NBER 工作文件第 31748 号 2023 年 9 月


    JEL 编号: O12, O53


    # 摘要


    我们用解释所观察到的购房行为所需的收入与官方收入之间的差额来估算有政府官员的家庭可能的非官方收入规模。通过使用中国某大城市 2006 年至 2013 年期间独特而全面的住房公积金和购房行政记录，我们得出了三个结论。首先，官员的平均非官方收入是其官方收入的
    83%；这一比例随着官员级别的提高而急剧增加。第二，约有 13% 的官员有非官方收入，这一比例也随着官员级别的提高而增加。第三，政府官员的工资并不低，他们的非官方收入并不是对政府低工资的补偿。此外，有证据表明，自最近的反腐运动以来，非官方收入有所下降。对另一个跨城市数据集的分析证实了这一重要结论。


    邓永恒

    威斯康星商学院 4110

