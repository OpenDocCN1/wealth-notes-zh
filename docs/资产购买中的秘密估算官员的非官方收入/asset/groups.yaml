  - '[PAGE 14]


    # 2. 研究战略和数据


    # 2.1. 经验规格


    基本框架假定大额购买（购房）和大额消费之间存在稳定的关系。'
  - '[PAGE 15]


    在这种情况下）和真正的永久收入（或总财富的年金）。$^{2}$其基本逻辑可以追溯到 20 世纪 60 年代的新古典住房需求理论（Muth，1960 年；Olsen，1969
    年）。$^{3}$家庭住房需求函数的一般形式为


    $V=f\left(Y、p_{H}、p_{O}、H\right)、$ (1)


    其中，$V$ 是家庭的住房需求值，$Y$ 是家庭的永久收入，$p_{H}$ 是住房价格，$p_{O}$ 是所有非住房商品和服务的价格，$H$ 包括可能影响家庭住房消费偏好的所有其他家庭特征，如家庭成员的年龄和教育水平。如公式（1）所示，在控制其他因素的情况下，一个家庭的永久收入与其住房需求之间存在稳定的联系，这是我们的方法的关键假设。


    在实证分析中，我们考虑公式（1）的对数线性化版本：


    $\ln V=a Y-\ln Y+\beta L+\gamma-T+\delta-H+\varepsilon、$ (2)


    其中，$V$ 是所购住房单元的总价值，$Y$ 是家庭的永久收入，收入弹性为 $\alpha$，$L$ 是空间（次级市场/地区）固定效应控制，$T$ 是时间（年份）固定效应控制。$L$
    和 $T$ 均用于捕捉所有住房和非住房商品/服务价格的异质性，以及影响家庭住房消费的其他宏观层面未观测因素。$H$ 是除收入以外的家庭特征向量，$\varepsilon$
    是误差项。


    在我们的实证研究中，家庭永久收入与购房价值之间并不是单一的对数线性关系，而是采用家庭收入的片断函数，使两者之间的关系更加灵活。具体来说，我们将家庭收入划分为五个'
  - '[PAGE 16]


    五等分层，并允许家庭收入的斜率（即 $\alpha_{ij}$ ）在不同的五等分层中有所不同。


    ² 近几十年来，无论是在中国还是其他经济体，购房在数量上都是家庭保存和积聚财富的最重要手段。Wu、Gyurko 和 Deng（2012，2016）记录了中国主要城市的购房行为。Badarinza
    和 Ramadorai（2018 年）也记录了“避险”动机对伦敦住房市场购房行为的重要性。


    ³ Armott（1987 年）和 Smith、Rosen 和 Fallis（1988 年）对新古典住房需求理论和住房市场的经济模型进行了文献综述。'
  - '[PAGE 17]


    五分位数。换句话说，我们考虑不到不同收入阶层的房屋价值对家庭收入的弹性可能不同。


    家庭永久收入分为两部分。第一部分可从官方收入 $y_{o \#}$ 推断，第二部分则基于（未报告的）非官方收入 $y_{o}$。让 $y_{H}$ 代表非官方收入与官方收入的比率。我们有


    $Y=Y_{O}+Y_{H}=Y_{O}+Y_{O} \cdot y_{H}=Y_{O} \cdot\left(1+y_{H}\right) .\quad(3)$


    因此，公式（2）变为


    $\ln V=\alpha Y_{H} \ln y_{O}+\alpha Y_{H} \ln \left(1+y_{H}\right)+\beta-L+\gamma-T+\delta
    \cdot H+\varepsilon_{O}\quad(4)$


    我们假定只有政府官员才有非官方收入（这一假定往往会低估官员非官方收入的相对规模和拥有非官方收入的官员比例）。我们使用一个虚拟变量 $OFFICIAL$ 来代表至少有一名成员担任政府官员的家庭。公式（4）可改写为


    $\ln V=\alpha Y_{H} \ln y_{O}+\alpha OFFICIAL-\alpha OFFICIAL+\beta-L+\gamma-T+\delta
    \cdot H+\varepsilon_{O}\quad(4'')$


    根据公式（4）和公式 $(4'')$，因为


    $\alpha Y_{H} \ln \left(1+y_{H}\right)=\alpha_{O} OFFICAL,\quad(5)$


    我们有


    $y_{H}=\exp \left(\alpha_{O} OFFICIAL / \alpha_{Y}\right)-1_{O}\quad(5'')$


    换句话说，我们可以根据政府官员“无法解释的”住房价值来估算他们的非官方收入，通过比较公式（4）中的两个斜率系数 $\alpha_{O OFFICIAL}$
    和 $\alpha_{Y}$，可以将其量化为官方收入的倍数。'
