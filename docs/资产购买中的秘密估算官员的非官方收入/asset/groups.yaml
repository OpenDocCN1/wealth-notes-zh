    针对风险和风险偏好可能产生的影响，我们的策略是将正式家庭与可能面临类似风险且具有类似风险规避水平的家庭进行比较。首先，我们将样本中的比较组限定为至少有一名成员在政府下属公共机构工作的家庭（中文称为“公务员家庭”）。正如Wong（2009）以及Collins和Cottey（2018）所详细描述的，中国的事业单位通过作为“影子政府”提供公共服务来帮助相应的政府部门。具体而言，事业单位员工与政府雇员有几个共同的主要特征：他们都需要通过官方和公开考试才能获得工作；他们的（合法）收入是相应政府部门财政支出的一部分；他们的职级相同，这决定了他们的合法薪酬待遇。事实上，一些公共机构的雇员被官方称为“准公务员”。这些机构的工作很可能与政府工作一样有保障，因此很可能吸引具有同等风险规避程度的个人。然而，事业单位雇员不能像政府官员那样分享权力，因此不太可能有非官方收入。表5第1栏报告了回归结果。我们发现基本结论与基线估计结果在性质上相似：公职人员有非官方收入，而且往往随着官员级别的提高而增加；换句话说，我们的主要结论在允许官员与非官员在工作保障和风险规避程度上存在差异的情况下是稳健的。'
