    “哇哦，那双腿真是美，叫我被那双腿用无影脚踢死，我都心甘情愿！”米奇心底不禁发出这样的赞叹。


    “伊美，对不起，刚才大塞车，害你久等了。”米奇向伊美道歉。


    “不要紧，反正迟到也不是你想要的。”伊美敷衍回答，心中其实是气炸了：竟然要本小姐等你二十分钟，从来没有男生约我还胆敢迟到的，米奇哥你还真是大牌哦！


    “糟糕，看来她是很生气，今晚应该是凶多吉少了，尽力吧。”米奇在心底盘算。“我们先点餐吧，我记得你说过喜欢吃海鲜，这里的龙虾套餐很有名，来一客怎样？”米奇立刻转移焦点。


    整个晚上，米奇都在使出浑身解数，想藉由风趣谈话和肢体动作，将两人的感觉带回前几个月，在电话和网络上的浪漫温馨。无奈的是，伊美对米奇的议题兴趣缺缺，响应有一搭没一搭，搞得米奇束手无策。


    伊美心想：第一次约会，你大爷也敢迟到，要么是故意耍大牌，不然就是根本没把我放在心上。看来今晚可能要唱《孤枕难眠》了，米奇啊，你是在干什么啊？米奇不断在捶心肝。


    米奇使尽九牛二虎之力，总算才让气氛稍稍好转，但是，这时伊美却给了他致命的一击：“吃完饭后，你还有事吗？我妹妹快要结婚了，我待会得陪她去看喜烛和喜饼。”


    米奇一听，简直晴天霹雳，但为了装出自己是男子汉的姿态，故意轻描淡写问：“哦，这样啊，那你今天不来我家了是吧？不是说好了吗？”


    “抱歉哦，没办法。”伊美更是用比淡水河还淡的回答来应付，一听就知道，她早和米奇约会之前，已经计划好如何早点脱身，不让米奇原本精心经营的布局实现。即使心里再怎么呕，米奇还是摆出绅士的架势，说句：“好吧，没关系。”付了钱后，带着伊美走出餐厅，送她上了出租车。


    望着远行的出租车，米奇知道，原本以为煮熟的鸭子又飞了！他心中满是懊悔，自己什么时候不买东西，干嘛在约会前跑去买什么该死的苹果连接线？同时又觉得很不爽气，凭什么以前约的女生都可以迟到或不来，自己第一次迟到，就被如此对待？伊美凭什么因为他迟到二十分钟，就给他摆臭脸？剩下的四天假期，他一个人在台北的街头游荡，说好要再回他电话的伊美，仿佛人间蒸发，过去几个月的甜言密语，都成了只得追忆的往事。


    冷不防一阵冷风吹进他的心窝，他只有一个感觉：恨！


    ### 你和她暧昧的时间表和停格点


    匡宇在韩国坐拥百万年薪，一年里寒暑假时间占了将近半年，期间薪水照领，平时工作时数一周也只有十二小时，是个标准的，钱多事少离家远的工作。


    这个寒假，他眼见台湾遭遇金融海啸重击，房市低迷，就用积蓄当头期款，买了一间环境优美，公设健全的高级公寓。在市况低迷时，趁机吸纳优质房产，正如他平时在情场中瞄准失意正妹，见缝插针，一举抱得美人归一样。


    这天，匡宇趁着米奇回台休假的机会，美其名邀请他来参观新家，实则想了解他的近况。两个大男人吃完午饭後，悠闲泡在温泉池里闲聊。泡着泡着，米奇忍不住又把他和伊美的故事，向匡宇抱怨了一遍。


    ### 情场致胜幻术


    匡宇静静听完后说：“米奇，说真的，不是我要讲你，这次完全就是你自作自受！”


    “怎么连你也这样说我？”米奇嘟起嘴，埋怨似对匡宇说。


    “你之前被其他正妹放鸽子是一回事，不能一竿子打翻一船人，觉得所有正妹都会放你鸽子啊！你这不是角色错置，滥杀无辜？”匡宇正词厉严，教训了自己的好友一顿。


    “好啦，我知道了啦！我后来想想，是我不对没错，不过，我已经跟她道歉啦，但是她后来都不接电话也不回传简讯，难道我们过去几个月的甜言蜜语，都是屁吗？都可以这样一笔勾销吗？现在到底是什么世道啊？”米奇不服气说。


    匡宇不禁摇摇头：“你看看你！像个涉世未深的小妹妹，在这里抱怨前男友薄情是吗？问题是，你们根本就连男女朋友都还不是啊。”


    “好啦，我知道了啦。”米奇这时才像只战败的公鸡，降低音量，慢慢把头潜入冷水底下。他嘴里吐出的空气，形成气泡浮上水面，发出噗噗噗的声音，彷彿吐出的是他本想继续絮叨的不满。


    等米奇浮上水面后，匡宇正色问：“为了确定你真的知道藏在这次事件背后的道理，米奇我要问你从这次的经验，你学到了什么教训？教训？教主好严格哦，真的把我当学生来教了。”


    “是啊，你这个人就是欠教。快说，你有什么体悟没有？”匡宇假装严肃。


    “嗯，我觉得，以后不能随便跟女孩子甜言蜜语，累积情感，因为这样受伤的是我自己。换句话说，不要跟女生搞暧昧，因为我们是玩不过她们的！”米奇对自己的体悟相当满意，边说还边抓抓点头。


    匡宇差点拿起放在一旁的水瓢敲米奇的头：“错！什么叫不要跟女生搞暧昧？没有暧昧，难道你开门见山，就想跟人家怎样怎样吗？那是不可能的啦！应该这样讲，暧昧当然是一定要暧昧，只不过你应该设立一个停顿点或时间表，并且一旦发现苗头不对，就赶快逃跑！”克制住敲米奇头的冲动，匡宇舀起一瓢熟水往自己身上冲。


    “什么？这是什么意思啊！”米奇摇摇头，不甚理解。


    匡宇稍微提高音量说：“设立停顿点或时间表的意思就是，有些女生，她们喜欢的就是那种暧昧感觉，或者只是把你当成聊天的备胎，再不然是个食之无味，弃之可惜的对象，你要和她
    在言语上暧昧难明她可以接受，但要在肉体上和她搞七捻三，就是绝对不行。如果你发现有个女生，在电话和 MSN 中跟你聊得很露骨，但你要约她出来时她支支吾吾，这时就该逼她出来碰面，或者壮士断腕，别再联络了。”


    “这……可是我们也不得不承认，有很多女生就是需要时间啊！你如果没有和她好好聊上几个月，她是根本不会和你出来约会的。”米奇根据自己过去的经验，试图提出辩驳。


    “我知道，不过根据我这多年的经验，要告诉你，会出来的就是会出来，不会出来的就是不会出来，这会不会跟你约会的决定点，不是你和她够不够熟。绝大部分是你一开始认识她时，有否挑起她对你的兴趣。”


    “如果没有，即使后来想在电话上、简讯里，或什么 MSN 和 QQ 上做再多事情，都是没有意义的。因此，最迅速、最有效率的方法，就是认识之后，直接约出来。”匡宇斩钉截铁说。


    “那约不出来怎么办？”


    匡宇的音量更高了：“什么怎么办？当然就是换人啊！”


    “可是我很喜欢她啊！”米奇带着点哀怨和无奈的语气说。


    匡宇摇摇头，义正词严：“米奇，你是要我说几遍？在开始认识的阶段，你就不应该莫名其妙喜欢上对方，只能说是欣赏而已。要是对方根本连进一步的机会都不给你，那么你也应该把那所谓的好感立刻收回来！——拜托你把自己看得高一点，有尊严一点好吗？如果你还是想要奋力一搏，硬撞一下，那么也麻烦给自己设个停损点，看是三个月还是半年，不要超过一年。”


    “否则你这个来日不多的老青年，还有几个一年、两年的青春，让你挥霍啊！”说完，匡宇顺势两手一摊，无奈耸耸肩。


    “说得好，教主，你把我说服了，我以后也要姿态高一点，不跟我出来的，给她三个月的时间，之后一律删掉！大爷哪有那么多美国时间，陪她们纠缠啊！”米奇一副忿忿不平的样子。


    “但是话说回头，这个伊美啊，我和她都有满强的暧昧情谊了，怎么感情可以像天气说变就变？难道正妹就可以说话不算话吗？难道妹子就可以把郎心当狗肺吗？”米奇露出像琼瑶小说的男主角般，对女主角的离开不解也无法接受的神情。


    ### 分手不流泪的强者心态


    米奇的连番哀号，教主看在眼里，嘴角掠过一丝冷笑，接着道：


    “哈哈哈，米奇，你到底怎么了？干嘛像个小学生唧唧歪歪啊！如果要斤斤计较，我可比你有资格得多了。”


    “想当年我遇过小护十，当时在 MSN 上，聊得说有多好就有多好啊。她还特在我回国前一天写了封信，说：她很确定，我就是她要找的那个人，什么此心不移，日月可证。”匡宇的音调越飘越高。


    “结果勒？我回国时跟我到 SOGO 百货的餐厅吃完饭，拍拍屁股就走了。我还以为至少可以牵个手，甜言蜜语一下呢！呸！门儿都没有！”匡宇说着说着，握紧拳头，眼神中的怒火渐渐燃烧。不过当然，这也是演给米奇看的。


    “哈哈哈，教主你真够意思！为了安慰我，居然连这种惨痛际遇都愿意分享。那么，她到底是因为什么改变心意啊？”米奇笑归笑，还是没忘记问重点。


    “唉，说到底还是我的问题啦！其实她是我和伟淳某次一起在忠孝东路‘糖朝餐厅’里搭讪认识的女生，那时，她们一堆女生里，就属她最优，我看伟淳一副想认识却不敢上去说话的样子，于是决定伸出援手，跟她们拼完两句后，就让伟淳去和那个女生小洁留下
    MSN。没想到之后，伟淳没法挑起对方兴趣，反而是我和小洁在网络上聊得很开心。只不过我们是隔了半年才偶然在 MSN 上相遇，她一开始甚至忘了我是谁呢！”匡宇巨细靡遗交代他们认识的经过。


    “哇，好厉害哦！你和她见过一次面，但她对你完全没印象，你光靠 MSN 就掳获她的心哦？”米奇张大眼睛问。


    “是啊，你别忘了，我之前不是出过一本书叫《情挑 MSN》吗？想出这种书，没有个两把刷子哪行啊！不过，《情挑 MSN》的意思，就是我也只能在 MSN 上情挑一下，打打嘴炮而已，真实碰面时也一样会被打枪的。”匡宇故意面无表情摇摇头，仿佛在嘲笑自己的无能。


    这可让米奇不解了：“咦，不对啊，你应该是见面比在网络上更厉害吧！你很幽默风趣，口才也很好，应该碰面时表现更佳，游刃有余啊！”


    “照一般的道理来是这样没错，可是你忽略了一点，那就是有些人真的是非常重视外貌的。我后来问小洁，她为何哪天碰完面之后就变得冷淡？MSN 上她支支吾吾，终于辗转迁回说出，她不想跟我继续的真正原因。”匡宇边说边叹了一口气。


    “到底是什么？”米奇好奇问。


    “很简单，因为我不够高！她自己身高一六八，想找个至少一七六的，而我，刚好也是一六八。那天站在电梯里被她往镜子里一看一比，我那矮墩子的窝囊样，她觉得实在无法忍受！”匡宇把原本平躺在水里的姿势调整成盘坐。


    “天啊，她这么直接告诉你哦！虽然自己也被女生刺伤过很多次，但听到小洁用这样直接的言语拒绝匡宇，米奇还是感到讶异。”


    匡宇轻轻摇摇头：“不，最后那句是我自己加的，不过我相信这也的确就是她心里所想的。米奇你知道吗？这种情形我也不是第一次遇到了，很久以前念成功高中时，我也认识过一位北一女校花
    Lynn。她就曾告诉她的朋友们，说觉得我什么都好，也很喜欢我，可是觉得我太矮，她宁可找一个其他条件没有我优秀，但身高够她要求标准的男生。”


    “这……这答案也太伤人了吧，教主，你当时一定觉得很受伤吧！”米奇故作怜惜。其实，平常嚣张惯了的郑匡宇要是能难过受伤，米奇高兴都来不及了，他等不及要看匡宇留下英雄泪。


    没想到匡宇却说：“不，一点也不受伤，我心里是觉得有点可惜没错，但一点也不受伤，因为这是她的问题，不是我的问题，身高这东西是天生的，又不是我做什么努力可以加以改变的，我就是长这样，要就要，不要就拉倒，无所谓。”


    “哇，好 Man 哦！真不愧是教主。早知道匡宇大概也会如此回答，米奇还是装做露出崇拜的神情。”


    “先别称赞我，兄弟，我特别把这个往事提出来，其实是为了要告诉你……”匡宇故意把音量放低。


    米奇竖起耳朵：“，你要告诉我什么？”


    “我要告诉你的是，现在的你或许以为伊美当时看到你后态度大变，是因为你迟到了，不过一切的原因，可能只是因为她看到你本人以后，对你整体带给她的感觉不满意。不管是你不够高，还是不够
    Man，反正就是：她要的感觉，你没法儿给她，所以她后来就不想鸟你了！”故弄玄虚，营造起承转合的气氛之后，匡宇毫不留情说出这些一针见血的言论。


    “马的，教主，你这不是对我二次伤害吗？我都已经被她痛电了，你还要这样讲我，呜呜呜。”米奇说完后掩着眼睛，装作在哭泣的样子。


    匡宇赶紧拍拍他的肩膀：


    “哎唷，我这也是为了你好嘛！免得你故意不去看问题的重心，只是为了让自己好过一点，怪罪于一些不是理由的理由。拿我当时跟小洁的故事来看，自己不被喜欢的女生青睐的原因，竟然只是
    because 自己不够高，这理由谁想接受？但是我接受了，于是我知道唯有把量做大，去认识很多优质的女生，才能在这些女生之中，找到比较不重视身高的，跟我彼此欣赏，成就一段良缘。”匡宇露出肯定得不能再肯定的表情。


    “嗯，如果痛苦接受事实的代价，真的可以换得良缘，那我也愿意接受啦！就怕到头来换得一场空，又没人爱，还被人家嫌。对了，那么你当时就这么默不作声，不吵不闹离开小洁了？”米奇挑起卧眉眉，他真的无法相信，真有人能做到像匡宇那样，分手或者被情人甩掉时，做到，不吵不闹，能捞就捞的境界。


    没想到匡宇想都没有想便回答：“是啊，其实也没有什么离开不离开，我们本来就是网络上的『假情人』，没有办法变成现实世界里的真情人。那也就算了，你要知道，对我来说，每天跟她在那边用
    MSN 甜言蜜语，你侬我侬的，也是很耗费时间的耶！跟她没搞头，我刚好可以省下很多时间来做自己的事情，也算是小有收获了。”说完，匡宇还忍不住露出得意笑容。


    “教主，我发现你的心态实在是太好太强大了，连被人家甩了你都可以这么开心。”米奇难以置信摇摇头。


    匡宇挑着眉毛坚定说：“因为我最爱的是自己啊，不能让我开心的人事物，要走我都不会挽留！因此我也建议你，就把伊美当成一个美好回忆，当你发现跟她已经不可能时，就壮士断腕，别再联络了，反正她也不想联络你，不是吗？”


    “唉，可是，你不知道她的那双腿有多么……”米奇欲言又止。


    和米奇有着多年兄弟情谊的匡宇立刻接话：“多美是吧？我当然知道，你以为我没见过美腿啊？不过等你遇到另外一个你真正喜欢的女孩，她还跟你两情相悦，彼此欣赏，你们成为男女朋友后，若她也是个美腿女孩最好，不是也没关系，亲密时刻，你就在脑中偶尔浮现一下伊美的腿来替代，也没有人要知道，你就把那双腿永远留在你的记忆里，当作珍藏的永恒回忆吧！”


    “天啊！教主你真坏，怎么可以有这种提议？”米奇又好气又好笑。


    “你敢说你和前女友那个时候，不会偶尔把苍井空之类的 AV 女优加入你脑中，加以想象一番吗？”匡宇反问。


    “我当然……有。大声说出，当然之后小声说，有的米奇，心虚地降低音量，低下头来。”


    “哈哈哈，我还是那句老话，面对自己，也面对一些现实，根据所学到的知识和经验，修正自己下次的行动，这才是让自己更进步的方法。”笑完之后，匡宇表情诚挚说出他的意见和心得。


    “我了解了，我会好好面对自己的。”米奇若有所思点点头，彷彿又离真实的自己，更迈进了一步。


    ### 增加亲密度的约会安排


    匡宇和米奇泡完澡，谈话的当儿，伟淳已经来到门口，按了门铃。


    “哦，应该是伟淳到了。”匡宇边说边去开门。


    “米奇，你也来啦？”伟淳装作惊讶，实情是匡宇一早就告诉他，米奇会来泡汤。他这次过来，是特别应教主之邀，来解答上次米奇问过，但没得到教主圆满解答的一个问题。


