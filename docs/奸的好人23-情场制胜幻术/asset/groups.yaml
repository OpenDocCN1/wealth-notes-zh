    ## 第七章 即兴演出，速夺芳心—— Pianoboy 的浪漫攻略


    假装问问题搭讪法，也叫「故意问问题搭讪法」，简单而言就是，明知故问，目的是制造说话的机会。以当下场景来看，明明卖票处就在旁边，但匡宇还是偏要在剪票口附近问那位女孩，这就造成了可以相对方，合法说话的机会。只要女孩一回答，匡宇他们就更多的问题，可以接二连三问出来，之后，取得联络方式也就不是什么难事。


    「这【多变换场景】，其实也是一种心理学运用。人，特别是女人，对于环境的变化比较敏感，也需要比较多时间来适应。所以，约会时若能够运用一些借口，让女孩子多跑几个地方，就能自然加深她对你的依赖感，而依赖感正是催化好感的来源之一。这是我在教主的书上学来的。


    ### 明知故问、合法搭讪的幻术


