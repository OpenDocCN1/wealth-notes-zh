    米奇摇摇无力的手：哎唷，不必你提醒我啦，这种说了要打来却没有打来的情形，我又不是没遇过，早就习惯了。但我不懂的是，现在到底是什么世道啊！怎么妹都说话不算话了呢？容容还是政大的，啊学校教的四维八德、青年守则，怎么，连好学校的学生都当狗屎哦？」米奇越说越愤怒，顺势一记霸王肩捶进柔软的沙发靠背。


    「没办法啊！』我那天和一个朋友讨论过了，他说，这都是因为我们被女生当成了“想追她的人。”根据他的说法：“想追她的人”在女生看来，根本就不是人。她们对狗都比对我们好，至少她们还会摸摸狗跟狗玩，却连走都懒得和我们一起走咧。”伟婷无奈地回答米奇。


    「妈的，你说我不如狗喔？」米奇的敏感神经被重重踩了一下，不由得怒火中烧。


    「没有啦，只是一个好玩的比喻嘞！不过话说回来，教我这个理论的朋友，其实你也认识哦！」伟淳露出神秘的笑容。


    「我也认识？」米奇狐疑追问。他怎么不记得他周遭有这样毒舌，但又一针见血的朋友……咦，等等，他似乎想起了，在封存记忆里的某个角落里，好像的确有这么一个人，会用那样冷酷调皮的方式来寓教于乐、引爆话题。但米奇当下却怎么也想不到那个人是谁。


    伟淳继续露出神秘的微笑，盯着米奇看。


    伟淳永远记得，上次他为了一个自己喜欢的女生深夜不归，又不接电话、不回电话而担心时，他把这种心情告诉了那位友人；结果那位朋友居然直接挑衅讲说伟淳的关心和担心分明是一种浪费，那女孩明明就“躺在别的男人怀里，好ˇ得！完全用不着他的关心和担心”。


    那句话就像把刀子，直接刺向伟淳的心脏，他听得好差点吐血，但又不得不用相信那位友人的判断。因为种种迹象都显示，那女孩分明就是脚踏两条船，而且本来打算踏在伟淳身上的那条腿，在发现伟淳是个“穷舞蹈家”时，便决定缩了回去。从那晚之后，女孩就无消无息了。


    「你快告诉我那个友人是谁啦！听起来好像很厉害，说不定我可以向他好好讨教一番。」米奇的好奇心一下子就被挑起，打断陷在回忆中的伟淳，兴致浓厚的追问着。伟淳抿了抿嘴，露出彷似邱义仁那有名的微笑。那是当台湾前总统陈水扁遭遇枪击案后，身为辅选大将的他被记者问到总统伤势时，所露出的神秘笑容。


    「他啊，就是我们当年………」伟淳话还没说完，只见米奇的脸早已偏向另外一头，专注盯着两点钟方向，从星巴克外面推门进来的一位美女。伟淳也很有默契停止说话，顺着米奇的目光望着同一方向。经验告诉他，必定是有美女出现了！


    ## 废物利用的搭讪幻术


    果然，看到一个身材姣好，未施脂粉的紫雅女孩推开大门进来，经过米奇和伟淳身边，找了个离点餐柜台很近的桌子坐下，并拿出手机搜寻讯息一副在等朋友的样子。


    米奇和伟淳开始挤眉弄眼，互使眼色意思就是觉得这个女生长得真不错，应该要去搭讪认识一下。但因为众目睽睽之下搭讪有点难度，于是互相推委要对方先迈出那最困难的第一步。


    伟淖毕竟经验比较老道，又是舞者出身，自己的身体就是最好的搭讪武器；于是等女孩点完饮料坐定后，伟淖拿出自己背包里预备好的“国家剧院”表演宣传 DM，一个箭步走到女孩桌边。


    「嗨，你好，打扰一下。」伟淖微笑着说。


    「嗯，有什么事吗？」女孩放下正用来玩游戏的 iPhone，抬头看着伟淖。「我是一个舞者，看你的气质很好，不知道是不是也是学舞蹈，或是学艺术的呢？」


    「哈？我？我不是耶，我只是一个普通科技公司的员工。」女孩用充满疑惑的眼神和口气答道。


    「你身材这么好，没有练跳舞实在是太可惜了。」一看女生有反应，伟淖马上接着出招。


    「哈哈，没有啦，谢谢夸奖。」女孩微笑着说。


    「来，我先送你一个 DM。你平时有去国家音乐厅或国家剧院看表演的习惯吗？我是一个舞者，也是一个舞蹈老师，有时也会在那儿演出，希望日后有机会能邀请你来看。这个
    DM 上面的表演，是我一位恩师的作品。这场舞作，我虽然没有参与演出，但要是你有兴趣的话，我想邀请你一起去看看。」


    伟淖边说，边从自己的背包中拿出另一张 DM。你别以为国家剧院表演的宣传单很难找，其实就是大家平时在诚品书店厕所附近或者捷运站入口都能见到的那种表演宣传单。


    「是什么样的表演啊？」女孩看了看手中的宣传单，好奇问道。


    ## 借用名人，顺势而上


    「这本小册了上面很多讯息哦！我的老师是刘凤学老师，她算是舞蹈界国宝级的人物了。不过一般人也许会觉得舞蹈不太好懂，没关系，最近还有一场名电视制作人王伟忠制作的舞台剧《宝岛一村》，不知道你有没有兴趣去看？」伟淖深怕舞蹈对大部分人来说过于艰涩，曲高和寡，可能引不起女孩的兴趣，赶快再出一招，打算用更有名的人物抓紧对方的注意力。


    「《宝岛一村》吗？很有名耶！王伟忠也很有名，我从小就喜欢看他的制作的节目呢！」中招！女孩张大眼晴，用充满兴奋的声音对伟淳说。


    「真的吗？那太好了！」原本龟缩在自己座位上的米奇，眼看女孩跟伟淳有说有笑的，早已伺机而动，打算“卡位”加入话局；一看有机可乘立刻用迅雷不及掩耳的速度，像背后灵一般贴近两人，加入对话。


    那急切的态度，就像一个小男孩的妈妈帮他买了根冰淇淋，一拿到手便狼吞虎喝大快朵颐起来一样。


    米奇做出姿态，一副玉树临风的模样站到女孩面前说：「你刚才提到从小就喜欢王伟忠做的节目，我们也是从小看他的节目长大的，包括什么《中国电视史》啦、《连环泡》啦，都看过。不过很奇怪，你看起来很年轻啊，应该是七年级后段班的，怎么会知道他的节日呢？」米奇边说，边堆着满脸的笑容试图主导话题，并且顺势架起手肘巧妙一挤，把伟淳挤到一旁，占地为王。


    「呵呵，你过奖了，我没有那么年轻啦！我是七年级前段班的，差不多快要七年级的头啰。」女孩不好意思地笑笑说。


    「哈哈，难怪，不过保养得非常好呢！我们还以为你是个正在人学念书的小妹妹。啊，聊了那么久，却忘了介绍我们自己，我叫米奇，是在厦门工作的工程师，这位是伟淳台湾的舞蹈王子。您怎么称呼呢？」


    其实米奇非常不想介绍伟淳，因为“舞蹈王子”这个封号虽然是伟淳自己封的，但听起来！怎样都比无趣的工程师头衔要来得更吸引女生。不过没办法，这种一开始认识的场合，总要给人家一种“大家都是朋友”的感觉，否则只介绍自己不介绍身旁的的朋友，会让女孩子觉得他小心眼，何况当时开搭讪第一枪的，还是伟淳呢！


    「叫我 Becky 就好。舞蹈王子……但怎么有人这么自恋，介绍自己是舞蹈王子啊！」女孩忍不住笑着问。很明显，伟淳自恋的封号，引起了女孩的注意。


    「哈哈，伟淳就是这样的一个人！以为自己跳得好，却没人鸟他，只好自封！」米奇指指伟淳，故意露出不屑的表情，下一秒三人同时笑出声来。


    「嗯 Becky，很高兴认识你，看来你好像是一个人来和咖啡，不如我们一起坐着聊一下吧。」米奇赶紧抓住这个机会，提出邀约。


    「好啊，不过我只有十五分钟时间，待会儿还跟朋友有约，得先离开。」


    「没问题！」米奇和伟淳异口同声说。


    搭讪时，能够如此“上道”，愿意顾着米奇他们的问话一直回答，还你来我往互动良好的女生，实在是一种福气。其实这场看起来如此行云流水的搭讪方式，也是舞蹈王子伟淳惯用的伎俩，直接表明自己是个舞者的身份，并且用公开活动或表演来认识并邀约女生。


    女生大概不知道，那些伟淳随身携带的 DM，根本就是在捷运站和诚品书店门口随手可得的资料。高手就懂得把它当成搭讪的工具，而一般人对那些 DM 根本看都不看一眼，或者直接当成垃圾丢掉；看到心仪的异性时只会傻傻上前搭讪，直接说想认识对方，摆出微笑等待对方响应。


    那样成功机率当然低得多，女孩子往往说声“不好意思”，便想转身离开。而只要女孩愿意坐下来聊，不管时间长短，基本上这个搭讪已经算成功了。伟淳和米奇接着开始你一书我一语，和女生天南地北聊了起来。期间，伟淳不时从背包里拿出各式各样的节目本和宣传单，有他自己之前硕士毕业制作时的照片，也有曾经担任主要演员的演出介绍，目的在展现自己的优势，并且让女生知道他是一个有工作，也有舞台的专业舞者。米奇则聊聊自己在大陆工作的现况，以及经营管理上遭遇的问题。刚好
    Becky 对去大陆工作也有兴趣，于是三人聊得不亦乐乎。


    虽说是不亦乐乎的聊天，但其实米奇和伟淳和 Becky 说话时，这两个好兄弟常有“抢话”的竞争情形发生，原因就在于伟淳觉得明明是他先搭讪认识的女生，米奇干嘛这么不长眼，当成“自己的妹”来亏？


    而米奇心中想的则是，伟淳平时都认识那么多女生了，根本没差 Becky 这一个，好不容易出现一个搭讪认识，又和蔼响应他的女生，伟淳干嘛还要跟自己抢？应该多留点机会给自己才是。


    还好，这两个好朋友十几年的兄弟情谊，这种场景也不是第一次就培养起互相体谅的默契，女生也感觉不出这暗潮底下的龙争虎斗。但很明显的，米奇的话是多了点。不过这也不能怪他；毕竟伟淳有舞台的表现当光环，而米奇的工作则平淡无奇，只好靠：三寸不烂之舌，企图在女孩子面前给自己加点分。


    可惜，女生是很敏感的动物，当一个男生越是在她面前表现些什么，她就越有把握，这家伙已经“上钩了”、被她吸引了：当一个男生越想在言语上暗示自己多么有能力时；女生心里对他的能力就越有疑问，心想：一个真正有自信、有搞头的男人，何必靠言语上的逞强，来显示自己的能力？于是很明显的，Becky
    对伟淳的问题反应较为热烈，一直笑眯眯望着他，而对米奇，则只是像一般朋友般友善回应而已。


    到底该饿虎扑羊，还是细水慢流？


    十五分钟后。


    「不好意思，我得先走了，朋友还在国父纪念馆附近等我呢！今天聊得很开心，很高兴认识你们。」Becky 低头看了看手表后，用她那能死灭宅男们的无敌笑容对米奇和伟淳说。


    「我们也是。很可惜没能和你多聊聊。不如这样吧，我们彼此交换电话，下次再一起出来，看是要喝咖啡聊天，还是一起看表演都行！」米奇说。


    「好啊！我把电话和 email 写给你。」Becky 低头抄下自己的电话和 email 给伟淳，米奇则是直接输入手机里面。


    「嗯，那我们晚上回家就加你 MSN。保持联络！」伟淳和米奇两人异口同声说。


    就这样，Becky 的联络方式到手！Becky 一转身走出星巴克后，米奇和伟淳这两个标准的“男人”，便开始对刚才的 Becky 有如“验货”般品头论足起来。


