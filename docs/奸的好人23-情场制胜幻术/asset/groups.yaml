    “牵手我也会啦！快，我要听怎么接吻。”米奇催促着问。


    ### 国仇家恨的爱情故事


    “然后我告诉她，‘幼珍，你知道吗？虽然我们是朋友，现在还握着手，但是我必须对你坦白一点，那就是：我无法相信你们韩国人！’”伟婷把米奇当幼珍，用怀疑猜忌的眼神看着米奇，演出当时的情景，不过当然，他只是表情演演而已，没真正握住米奇的手。


    “为什么？”米奇也很称职扮演幼珍的角色，好奇望着伟婷。


    “对！幼珍当时也是问为什么！我接着告诉她，当年韩国和台湾断交时，其实台湾人大概也知道这是不可避免的结果，毕竟连美国和日本这样的世界大国，都已经见风转舵，西瓜靠大边，去和人多势众、地人物博的中华人民共和国建交了。虽然台韩乃兄弟之邦，断交也只是时间的问题。可是，韩国最不该的，是怎么可以事前没有一丁点征兆，说断交就断交？就算是男女朋友分手，也可以事前透露出一点蛛丝马迹，让被甩的人有点心理准备吧？你说是不是？”


