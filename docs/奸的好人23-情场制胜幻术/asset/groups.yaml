    “不要再提醒我了，这种经验我实在太多了。”米奇捂着耳朵猛摇头，学起琼瑶小说里，女主角不想听男主角解释时最常做的动作。


    青访团出来的人都很会表演，米奇和匡宇用夸张的动作增加彼此说话时的乐趣，连坐在旁边的其他客人都忍不住往这里多看了几眼。因为自己说话太大声，匡宇对隔壁桌两位转过头来，边看他们边窃笑的女孩微笑点头，表达歉意后，继续对米奇说：“不过你有没有发现，我前面讲的那些什么创造对自己有利的舞台、增加对方对我们的熟悉度，还有察言观色见缝插针，其实都需要时间和空间的酝酿、配合，才能成事。问题是很多时候，心仪的女孩就是在我们逛街或等公交车时突然出现，这时又该怎么办呢？”


    匡宇不愧是一个好老师，讲完自己的论点，还反向提出疑问，害怕他的学生米奇若是不能举一反三，该怎么办呢！“你还反问我怎么办？你是教主耶！当然是你讲啰。”米奇赶紧接着说。“你还以为我真的要问你吗？那只是一个假问句而已，我本来就打算自问自答啦，哈哈哈。遇到那种没法酝酿优势，也没法制造熟悉度的环境，又刚好对方身上没有值得挑起话题的配件和书本时，只有绝对的自信才能克服时间和空间的障碍，让你去认识她。”匡宇搭配自信的眼神说。


    “可是这种路上搭讪，被开枪的机率实在很高啊！”米奇想起有时候，在路上搭讪遭女生拒绝，被对方用看蟑螂、垃圾般的眼神，上下打量之后说“不要！”的情景，还是会害怕得打哆嗦。


    “问题是，你不冒着过去挨枪的风险和她说话，她会主动过来，说想认识你吗？”匡宇反问。


    “绝对不会！”米奇肯定说。


    “所以啰！即使挨枪的机会很高，如果你欲认识她的话，还是要冒着被拒绝的风险，努力一试。反正 Nothing to Lose 嘛！”匡宇喝了口咖啡，语气坚定。


    “去你的，就是你这句 Nothing to Lose，害我到现在不知道挨了多少枪！什么 Nothing to Lose，我失去了我的面子、勇气和信心可被你害惨了。”米奇忍不住骂脏话！


    “哈哈，还面子勒！有谁认得你啊？你的面子不值钱啦。说到勇气和信心，米奇，你不也是也搭讪成功过？你不觉得，一次搭讪成功所带给你的勇气和信心，是难以衡量的吗？难道你不会因为一次的成功，就永远记得那成功所带给你的美好，于是对之后的尝试也全力以赴，甘之如饴吗？”匡宇反问。


    “不会耶！我只觉得，失败好可怕，被拒绝一次我就不想再尝试，搭讪一个女生不鸟我，我就害怕所有女生都不会鸟我。”米奇无奈摇摇头。


    ## 想用幻术谁女生，先用幻术谁自己


    “嗯，这就和你心中的预设有关。你给自己下的心锚也就是所谓的心理暗示，都是极端负面的，于是它会影响你之后的所有行动，等于你还没有行动之前，结果就已经出来了。当你心中想着失败，你去搭讪时，往往都会失败。”匡宇彷彿被他的激励教练安东尼罗宾附身一样，说出这段有点艰涩，又富有哲理的话。


    其实，匡宇从来就没有亲自上过安东尼罗宾在美国举办的激励课程，就只是听过安东尼罗宾的录音带而已。因为安东尼罗宾的实体课程极端昂贵，初级课程要价五千美金，若是把初级到高级的课程全部上完，粗估至少要两万美金。匡宇这个，“抠鬼”，怎么可能花这个钱？


    于是，他把安东尼罗宾的录音带（为什么是录音带而不是 CD？因为他觉得 C D 比录音带贵，他连这种钱都要省！）反复听反复听，至少听了一百遍，都快能背出来了。


    于是，当他和米奇分享心理预设和心锚理论时，简直就像反射动作一样简单。在匡宇看来，任何让他花钱购买书籍或录音带 CD 的激励大师，都该被他，“榨干”！哪个作者敢让他花十块美金买他的书或
    CD，匡宇就要像拧毛巾一样，榨干那本书或 CD 里所有的知识和技巧，让它发挥百倍甚至千倍的效益，就像拧出毛巾里最后一滴水一样。而且好的知识他不止自己用，也乐于和他人分享，这就是他出书写作，并开班授课的原因。


    “意思是你搭讪时，想的都是成功啰！”米奇问。


    “当然，不仅如此，你知道当我和女生约会时，心里还在想什么吗？”


    匡宇故作玄虚。


    “想着如何让她喜欢上你吗？”米奇心想，这应该就是标准答案了吧。


    “错！我脑中根本没有这样的问题，那根本不该是问题。我脑中只不断放出一个讯息：Love Me!”匡宇伸出拇指指向自己，自信地说出这句话。


    “Love Me？爱我？这样真的有效？你骗鬼哦！你以为我跟你的读者们一样，只是从你书里写的东西来认识你，所以把你当教主或神来崇拜吗？事实证明，也不是每个女孩都被你吸引，都喜欢上你啊！那你这招有什么用？”


    米奇终于抓到机会，吐匡宇的槽了。


    “这只不过是一种最基本的心理预示罢了。就拿小爱我和我的事情来看好了，因为我和她认识的场景，对她来说还算不错，于是我已经站在一个比平均值要高一点的基础上。”匡宇接着说。


    “不不不！”米奇边摇头边打断匡宇：“你在彼此认识的场景上是占了点优势没错，但你的身高根本就是劣势中的劣势啊！我不懂她身高一百七十五，怎么会看上你这不到一百七的矮个儿？她没有心理障碍？你没有心理障碍？”米奇不解追问。


    “我不是说了吗？这又回到你在心中给自己的预示和设定！要是你觉得美女就一定要配帅哥，高的女孩一定不可能喜欢矮个儿的男生，那么你自己已经给自己答案了，那就是失败！你永远不可能吸引对方，不过这不是她们的问题，是你自己的问题。”从指向自己的拇指，改为指向米奇的食指，匡宇指着米奇，肯定说出这句话。


    “那么敢问教主，你面对小爱时，给自己的心理预示和设定又是什么？”


    “除了我刚才已经说过的那个 Love Me 之外，许多想法同时存在在我的脑中，例如：应该是她要赢得我的芳心，而不是我要赢得她的芳心、得失心放低一点，享受约会时的单纯快乐就好、还有跟她在一起，我觉得自己就像是汤姆克鲁斯一样有魅力……”匡宇如数家珍又理所当然说出他心里真正的想法。


    “匡宇，几年不见，你已经从一个想法和其他人不太一样的人，正式变成一个疯子了！你怎么可以又怎么会那样想呢！”米奇忍不住，说出了他心中对匡宇真正的想法。


    “哈哈，你不要把我说的这些东西当成笑话哦！我最近正研究，在情场上能够战无不胜、攻无不克的幻术，而发现其中最重要的一条，就是在使用幻术唬弄女生之前，得先用幻术骗过自己。你必须先骗自己，告诉自己是个有魅力的人，即使自己再怎么没有魅力，都得这么骗自己，之后的自我提升以及沟通技巧才会有用。我刚才所说的每一个想法都有原因，也有巨大影响力的。”匡字语重心长，怎么说？


    “大部分人和女生约会时，都想着该如何表现，才能赢得对方的心；不过这样的目标设定，反而在潜意识里，把自己放在了一个比较低下的地位。我完全是反其道而行。因为我总是让自己生活得丰富有趣、自在精彩，于是，我是打从心里爱着自己这个人，和自己的生活方式，从来不觉得我应该去赢得别人的心，而是对方也應該要设法赢得我的心。换句话说，我把自己当成正妹，把眼前的正妹当成男的，她应该要来追我就对了。”


    “妈啊，反了反了，为什么你的想法可以这么离经叛道，脱离现实呢？”面对匡字的自信和无厘头，米奇忍不住反驳问。


    “你难道没看过《有钱人想的和你不一样》这本书吗？告诉你情圣也和你想的不一样！”匡字博览群籍，也非常懂得举一反三，将一本畅销书的书名稍加更动，马上引起了米奇更高的兴趣。


    “那本书我也看过，怎么没能悟出你刚才讲的道理？”米奇摇摇头继续疑惑：“那，你所谓约会时降低得失心……这大家都知道，应该也都会提醒自己，可是就是做不到啊！像我之前喜欢的那个
    Yoyo，长得那么可爱，每次看到她我心里就软了，你要我怎么保持平常心？”米奇嘟著嘴撒娇问。


    在女孩子面前，他总是假装坚强，只有在自己的好朋友面前，才能如此放下心来，像个小孩子般，边撒娇边试着解决隐藏心底许久的疑问。


    “对，平常心这个东西，绝不是你说就能有的，除了要建立思想准则，还要搭配外在行动。大部分人做不到，是因为他们平常生活上认识的女生太少，又不会搭讪，只能等待天上掉下来的缘分：终于遇到一个还不错的对象时，立刻把她当成真命天女，心想要是错过了她，不知还要等多久。你认为抱著这样的心态，能在约会的对象面前表现良好，不慌不乱吗？”


    “很难。不过，要怎样才能逃脱这个恶性循环呢？”


    “我刚才不是说了吗？只有让自己的生活过得精彩，吸引更多女生加入你的生活，并且适当搭讪，这样才能随时都有三到五位女孩跟你约会，你再从其中选一个跟你的想法、价值观和背景最适合的，深入交往。”用林百里老板的话来讲话，当时他带领台湾广达计算机，成为世界笔记本电脑代工龙头，他自己分析广达成功主因时，就是“把量做大！”匡宇说这句话时，还特地提高音量，并张开双臂，衬托他的那句，“把量做大”。


    “天啊！这……这……这不就是所谓的花心吗？”米奇心虚地问。


    “兄弟，花心？等你和女生已经确定彼此感情之后，还跟别人搞七捻三，那才叫花心。一开始时，跟不同的对象出去，叫做彼此了解，正常来往。你 会不会想太多了？况且我问你，你认为你欣赏的女孩，一次只有一个男人追，她也只跟一个男人出去吗？”医宇试着厘清米奇的观念。


    “那绝不可能！我之前喜欢的那个 Yoyo 一一一次大概就有一打的男生在追她吧。”


    “所以啰！如果女生都没有自废武功，你挑断自己的手脚筋干嘛？”医宇反问。“说得好！一语惊醒梦中人啊！”米奇用力拍了一下自己的脑袋，茅塞顿开。


    “当你的约会对象一多，自然心理上下就不容易患得患失，不会害怕对方不和你出来约会，不会害怕在餐桌上说错什么话，不会害怕约会时做错什么事……”医宇继续滔滔不绝。


    “我了解了，从现在开始，我也要像你一样，有多重选择，不要老是被女生当成备胎。”米奇用力点点头。


    ## 我，就是最好的礼物


    看着米奇彷彿已经了解的样子，医宇虽然觉得很欣慰，但回想起自己过去的经验，总觉得似乎还有什么忘了告诉米奇。医宇低头喝咖啡，然后像突然想起什么似的，抬头又说：


    “不过米奇，身为好朋友，我还是要提醒你，你刚开始做这种尝试，也就是一次认识五六位不错的女孩子，心想从此再也不会患得患失、表现不佳时，一定要注意一件事情。”


    “什么事情？”


    “当你想要邀约女生和你出去，非常有可能遇到这种状况：你打给 A 女时，A 女说那天有事不能赴约，打给 B 女时，B 连句话都不接，打给 C 女，她说已经和男朋友约好了，打给D女，D女说晚点再回电，但之后就再也不接你电话，打给E女，她当场拒绝，不仅说不会跟你出去，过一会儿还让男朋友打来跟你呛声，叫你以后别再骚扰她女朋友……也就是说，你以为一个约不出来，能约下一个无所谓，结果一个晚上连续被打了五枪！我现在先提醒你，是怕你到时候受不了，会精神崩溃。”匡宇边说边笑，差点把刚入口的咖啡给喷出来。


    “放心啦！我曾经一个晚上连续被打过三枪，也算有点习惯了。”米奇悻悻然说。“你不错嘛！原来早就有开始操作我给你的建议，不会在一开始时就单恋一枝花。”匡宇满意笑着说。


    “我也是被逼的！我也想当个好人，但女生都不让我当，非要逼我变成花花公子……”米奇忽然想起之前看过电影《无间道》里，刘德华饰演的坏警察的台词，加以改编后纳为己用，边讲边咬牙切齿。


    “我不是说了吗？当你和她们还不是男女朋友时，多几个对象很正常，和什么变成花花公子一点关系也没有。女孩子你们也是一开始时多认识几个男生，都和他们出去聊聊之后，才决定要和谁继续深交交往的啊。'']”


    “是啦是啦，只是真正操作时，还是要小心不能让女生知道，否则就被当成乱枪打鸟的烂咖，到时候落得一场空。米奇赶紧补上自己的意见，又接着问：，对了，你还没讲，你说觉得自己像汤姆克鲁斯，那又是怎么回事？”


    “是这样的。很多像我一样个子比较矮的男生，一开始认识女生时，都会有这样的心理障碍，觉得男生…定要比女生高，所以看到跟自已一样高，或者比自己高出一点的女生，就裹足不前，自卑感作祟，连认识人家的勇气都没有。'']”


    “我倒是没这个问题，因为我有一七八，但是，有时候想去认识凯渥或伊林那些身高一百八的模特儿，心理还是有点怕怕的。”


    “嗯，那是因为我们被传统教育和世俗眼光所束缚了。说真的，女生又没有告诉你她重视身高，不会理你，你没事先人为干嘛？”


    “可是就比例上来说，女生都希望找比她高的男生吧？去和比自己高的女生搭训，被打枪的机率也太高了吧？”米奇试图为他的负面思考辩护。


    “无论如何，想要知道对方怎么想，最好的方法，就是直接去和她说话认识，然后约出来玩，这样不就知道对方到底怎么想了吗？不瞒你说，除了小爱，我之前还交过一个女朋友小萍，她更高，有一百七十八公分呢！』匡字面有得色。


    “什么？那你们一起走时，不会引来很多异样眼光吗？你不会觉得大家都在背后嘲笑你，说你们站在一起，就像七爷八爷一样？”


    “哦，那是你认为那样可笑，才变得可笑，不是吗？到底是谁规定，男生就一定要比女生高？你接受那样的观念，又是根据什么理由？”匡宇反问。


    “这……我……”米奇支支吾吾。


    “说不出来了把？告诉你，在我们的生活中，我们对所有的事情，都在进行所谓的定义。当你的定义是这样，你就会这样想，反之亦同。也就是说，当你定义男女交往时，男生一定要比女生高，那么你看女孩比男孩高的景象，就无法接受；而要是你定义男女谁高谁矮根本无所谓，你就不会因为女高男矮的景象大惊小怪，自己看到比较高的女孩时，也不会襄足不前。”


    “哦，所以这就是你对男女身高的定义吗？”


    ## 不花钱的把妹哲学


    “Not Really”！我这人更夸张。我不仅不觉得男女之间的身高不重要，甚至还觉得，交到身高比自己高的女朋友，是一件很光荣的事！这也是我为什么说，每次我和小爱在一起时，我都觉得自己是汤姆克鲁斯。平时我们约会时，当然有很多人看我们，对我们指指点点，别的男人也许把那些都当成嘲笑，可是在我眼中看到的，尽是惊奇和羡慕。我想，很多人心里一定在想：‘那男的一定很有钱，才能吸引到这样的女生’。


    殊不知，我不仅长得不怎样，还跟有钱这事儿八竿子打不上边！匡宇眉飞色舞，越说越得意。


    “哈哈，这我最清楚。你不仅没钱，还很抠门；不，应该说你有钱，但是你都不花在女人身上。”米奇也笑着附和。


    “一点也没错。特别像生日或情人节圣诞节之类，商人搞出来那些阿哩不达的节曰，要礼物没有，要命一条！'']”


    “女生都不会跟你抱怨哦？”


