    「你就上去，先跟妈妈问好，说你想认识她的女儿，请她们给你一点时间。记得摆出笑容、露出自信，放心，我会在旁边帮你的！」匡宇拍拍米奇的肩膀，给他简短的提示后，鼓励他冲锋陷阵。


    在匡宇教主的紧迫盯人下，米奇只好硬着头皮上前，他先对着妈妈礼貌地说：


    「您好，我叫米奇，是《优衣企业》的品管工程师。我和身旁的这位朋友，今天本来是想来这里买个礼物，送我一位许久不见的老师；但经过这个橱窗时，看见您们两位。不知道您们是不是母女呢？如果是的话，阿姨您好，我希望认识您的女儿，不知道是否方便？」米奇带点紧张，又不失稳重表现他的大气。


    匡宇看着米奇微微颤抖着双脚，假装镇定说出那段中规中矩的台词，心里除了一阵好笑之外，同时也感到份外欣慰，心想应该好好帮帮自己的好友，于是立刻上前一步加入话局，接着说：是啊，其实我们也一直在想，有没有除了搭讪以外的更好方式，能够认识您和您的女儿，不过发现还真没有，所以鼓起勇气就上来了。


    「哦！这样啊，那你们自己问我女儿吧，我不能替她做主。」妈妈微笑着看着米奇和匡宇，释出善意，把球丢给自己的女儿。


    「可是我有男朋友，不方便耶！不好意思哦！」女孩摆起一张扑克脸，拉着自己的妈妈就要往下一个橱窗走。只见妈妈尴尬看着米奇和匡宇，点个头后，便跟着女儿快速离开。明眼人都看得出来，妈妈对这两个男孩的印象不错，但女儿却对这两个男生没兴趣。


    行动失败，米奇有点失望看着匡宇。匡宇拍拍米奇的肩膀说：别泄气，这是很正常的，我们有搭讪认识别人的权利，别人也有不想认识我们、拒绝我们的权利。把精力和时间放在愿意接受我们，被我们吸引的对象身上即可。你刚才做得很好，再接再厉。


    看来也只能这样啰！米奇有气无力回答。


    其实，搭讪就真的只是一个数字游戏罢了，多搭讪一定有成功也有失败，只要多记得成功，常忘记失败，自然就能慢慢提高成功率。


    虽然这次的搭讪，米奇并没有成功；但一个月后，米奇在一场音乐会结束时，用这次学习到的技巧，跟一位陪家人来听音乐会的女孩顺利搭讪成功，要到姓名电话。他用的仍是这种诚实搭讪法，直接告诉对方他心中的害怕、恐惧，和想认识对方的诚意，结果连对方的父母都一起加入话题。


    从那之后的每一次搭讪，都对米奇的自信提升产生强烈作用。米奇越来越相信，搭讪将为他的世界带来巨大的不同。果然，他的自信感越来越强，搭讪越来越不容易失败，取女生电话号码如采蜜取物一般。


    不过，这时他又遇到问题了，因为，女生虽然约得出来，但就是无法成为他的女朋友！


    ### 美女救男的搭讪幻术


    台北的小巨蛋里，有一个大型溜冰场，是喜好溜冰的台北人最喜欢去的地方。大约十几年前，匡宇还是个成功高中的学生时，放学后偶尔会跟好朋友们到当时最夯的溜冰场—西门町的万年冰宫去溜冰。那时，为了可以利用带对方溜冰的机会来认识别校女生，匡宇可是练就了一身绝佳溜冰技巧，不管是倒退溜，还是空中转身，都难不倒匡宇。现在万年大楼里已经没有溜冰场了，只剩台北的小巨蛋里最新盖好的冰宫。


    米奇今天突然心血来潮，把匡宇和伟婷都叫上，想一采这个小巨蛋新冰宫的究竟。三人一走进小巨蛋的冰宫，就被眼前的景象给吓了一跳。原来，新盖好的小巨蛋冰宫，简直具备国际级水平，而且里面除了一般民众外，还有一些业余和职业的花式溜冰选手们，在那里练习。


    看着其中几位高中生选手，在溜冰场上展现曼妙舞姿和流畅动作，米奇不禁自惭形秽起来，叹了口气：「唉，这些小妹妹都这么厉害，我来这边，要是摔得一塌糊涂，岂不是太丢脸了吗？」


    伟婷赶忙在一旁搭腔：「就是啊，你没事干嘛附庸风雅，跑来这种地方？兄弟，你的运动细胞不好，不要自曝其短比较好吧！像我，只会在舞台上跳舞，来这种方也只是丢人现眼和送死罢了。何况要是乱溜冰，摔倒受伤，怎么对得起我的腿和我的粉丝们呢？」


    伟淳一面议，一面好像正在热身似的，把腿侧抬到耳边拉筋，做出舞蹈动作里号称「朝天蹬」的姿势。一旁的几个溜冰选手，发现居然有个跟她们筋骨差不多柔软的男生，也好奇地往这边看过来。


    匡宇不禁莞尔，拍拍伟淳的肩膀：「伟淳啊，你很厉害哦，用这种方式吸引了那些女孩的目光，这样待会儿要搭讪起来就容易多了呢。]


    「不愧是教主，马上就知道我的用意，这就是一种展现优势、创造舞台的方法啊！不都是你教的。」伟泽得意回答。


    「那我呢？我怎么办？」米奇露出无辜的表情嘀咕起来。


    「米奇，你不要急嘛！其实，有时候在强者面前展现优势，还不如展现弱势，这样也是一种搭讪的方式。你可以先用弱势引起对方注意，日后再用其他优势来顺利吸引她。待会儿我就示范给你看。」匡宇不疾不徐说。


    三人低声讨论时，忽然一阵哨声响起，原来是溜冰女孩们的教练要大家集合。三人定睛一看，哇！那些溜冰的小女孩虽然一个比一个漂亮可爱，但毕竟都还是十五、六岁的小孩子，称不上女人；反而是那位集合大家的教练，鹤立鸡群，风姿绰约，一脸的傲气彷彿比脚下踩的冰还要冷，那股不怒而威的气势，搭配美丽脸蛋，一看就知道，应该是前溜冰国手退休后转任的学校教练。米奇看得眼神都直了。


    匡宇拍了拍米奇的肩膀：「哎呦，兄弟，我知道你在想什么。你在想该怎么认识她，对吧？」


    「你真是我肚子里的蛔虫。不过你看她那股气势，让人还真的有点怕怕的。她会不会很凶啊？」米奇打了个哆嗦，也不知道这哆嗦是因为冰宫里太冷，还是因为被女子看来倔做的态度吓到，预先想到了待会儿和她搭讪可能会被拒绝的画面。


    匡宇满不在乎：「你直接去和她说话，不就知道了吗？现在想这些她凶不凶，人 Nice 不 Nice 的问题，都没有意义，直接过去和她说话就知道结果了。」


    匡宇忽然眼珠子转了转，彷彿想到什么好点子，继续说：「但是我倒有一招还不错，可以教你自然而然认识她。」匡宇接著附在米奇的耳边，把他想好的搭讪绝招小声告诉米奇。


    米奇似懂非懂点点头说：「那好吧，我来试试。」半信半疑接受了匡宇的建议。


    三人随后自顾自溜冰，但眼神一直偷瞄那位女教练。等女学生们解散，都去更衣室换衣服时，趁著空档，米奇滑过女教练的身边，故意一个跟跄跌倒。女教练见状赶忙过来扶起米奇，米奇起身后装乖俊笑，摸摸自己的头说：


    ![](img/9265aee571b92eb394350a9154180ccd_58_0.png)


    「谢谢你啊！真不好意思，还麻烦你过来扶我。」


    「没什么，刚开始学溜冰时都是这样的。」女教练露出亲切的笑容。


    「我和朋友是第一次来这里，也是第一次溜冰。对了，我刚才看到，您好像是带学生训练溜冰的教练呢。」又是教主的假裝间问题法。


    「哦，是啊，我在训练XX国中的花式溜冰校队。」


    那你本身是师范大学的学生，还是已经毕业了啊？米奇打蛇随棍上，一个问题接着一个问题拋出。


    我还是学生没错，但已经是研究生了，而且我是国立体育学院的，不是师大的。女孩笑容可掬回答。那温暖的态度，彷彿让这冰宫的气温又上升了几度。


    米奇点点头故意揶揄她：难怪，你的确看起来不像大学生，哈哈哈。


    「呵呵。」女孩也尴尬笑了起来。


    ### 瞒天过海的迷幻术


    米奇赶紧收回轻浮的态度，正色说：刚才那句是开玩笑的。说正经的，我刚才溜冰时和朋友聊到你，你看起来就像是受过训练的专业选手，你以前是国手吧？


    「好眼力，我一直是国手，最近还在为下一场比赛做准备。」女孩大方承认自己的身份。


    好厉害哦！我居然能认识国手。不过说到这个，我和我那两位朋友以前也算是国手呢！你听过《青年友好访问团》简称《青访团》这个团体吗？


    实在想不到要继续聊什么，害怕词穷冷掉的米奇，突然想到自己以前参加的表演团体也许是个话题，赶忙把它提出来。其实他心里也没指望女孩知道这个早因政党轮替，「倒团」的团体，只不过藉由一个又一个的话题，想延续与女孩之间的对话。


    没想到女孩眉毛一挑，睁大眼睛说：「听过啊！我姐姐大学时代就是《青访团》出身的呢！」真的？你姐姐是第几届的？我们是九七年的。米奇简直是喜出望外，边说边赶紧招招手把伟津和匡宇都叫过来。


    我姐姐是九五年青访团的，叫杨XX。女孩继续说。


    「啊，我知道啊，杨学姐在我们受训那年也来看过我们，不过只待几天就走了。那你怎么没参加青访团？」米奇简单跟匡宇和伟滢介绍女孩姐姐也曾是青访团团员后，继续顺着话题延伸下去。


    「我哦！那时本来是想去的，不过刚好遇到另一场国际比赛，我只好放弃青访团了。」女孩无奈摇摇头。真是可惜，要是你当时有来参加，我们早就认识了呢！对了我叫米奇，旁边这两位一位是伟滢，一位是匡宇。米奇故意露出觉得可惜的样子，再顺势把自己的名字和身旁好朋友的名字介绍出来。其实，米奇真的很想跟女生说两句后，便马上说出自己的名字，也询问对方姓名，无奈教主告诫过，他不是吴導或金城武，用这种直接开场搭讪法实在太危险，容易一拍两瞪眼。如果能先营造一个愉快的话题，再引导话题到互留联络方式这件事上，是比较安全的作法。


    而赶快介绍匡宇和伟滢出场，也是一种「瞞天过海」的方法，让米奇想认识女生的意图，可以在「大家一起认识做朋友掩饰下，」给女生感觉这一切都是自然而然发生的。


    很高兴认识你们，我叫小慧。女孩大方说甚至主动伸出手来跟三人握手。握过手后，米奇继续主导话题：「小慧，很高兴认识你！啊，你的学生们换完衣服出来了，我不打扰你们了，可以互留联络方式吗？


    今天时间太短，我们改天再一起约出来，记得也告诉你姐姐，说青访团的学弟跟她请安。


    这里又是一连串的技巧：故意先结束话题，制造一种我不是很急着想认识你的感觉，并且又再次提到对方的姐姐弄得好像大家早有缘份，本来就应该认识一样。


    好啊，一定一定。女孩微笑着说。


    两人拿出手机开始互留号码。就这样，联络方式到手！一旁小慧的学生们用暧昧和揶揄的眼光望向这边，小慧也露出害羞的笑容。


    为了避免小慧尴尬，匡宇和伟滢拉着米奇顺势往溜冰场的另一头溜去。等小慧和学生离开溜冰场后，匡宇拍拍米奇的肩膀说：


    你看，我就说吧，任何事情，不去试试，永远不会知道结果。小慧刚才训练学生时那张扑克脸，还有冷的比冰块还要冷的态度，说什么也想不到，后来会对我们那么好吧？小慧一百八十度的转变，连匡宇都不禁啧啧称奇，也更加确信自己的观点是正确的。


    米奇难得信服点点头：是啊！果然正如你所说的，不搭不知道一搭见分晓。


    不过我刚才看你你的搭训技巧，基本上已经炉火纯青了，故意摔倒那招是我教你的没错，但没想到你后来自己的铺垫发展和举一反三，真是让我叹为观止啊！匡宇对米奇的受教感到很欣慰。


    教主你过奖了。我只不过是用上了你常说的，要把自己的脑子当成运算功能强大的计算机，搜寻任何可能跟眼前说话的人搭上关系的人事物，把那些讯息丢出来，跟对方产生更多连结罢了。我一听到她是国手，就想到我们当代表团青访团出国，也算是变相的『国手』了，谁知道她老姐刚好也参加过青访团，这样一联机起来，简直是得来全不费工夫啊！米奇意犹未尽，手舞足蹈。


    说的对！其实你就算不用国手这件事情来开玩笑，还是可以把青访团这三个字提出来，因为像这种学体育和舞蹈的，基本上都会知道青访团。就算她们自己没参加过，学长或学姐，甚至老师一定有人参加过，这样攀起关系来便容易许多。总之，你手上握有的聊天筹码越多，越懂得旁征博引、牵扯关系，成功的机率也越高。匡宇补充。


    教主说的是。米奇点点头表示赞同。


    我看她刚才对你的态度挺热情挺好的，要记得好好把握啊！今天被你硬拗来溜冰，可花了我不少入场费啊！匡宇抠门的个性看来是改不了，也好不了了。他一心想着看，怎么把今天花费的溜冰入场费发挥最大效益，所以刚才硬逼米奇去和小慧搭训，如此一来，他心里才能稍稍觉得，物超所值。


    「会啦，我会把小慧当成重点目标，好好猛攻的啦。不过教主，我还有一个问题。请你告诉我，认识一个自己有兴趣的女生时，到底是应该快攻，还是应该慢慢来？有人说打铁要趁热，有人说吃紧会弄破碗，真让人无所适从啊！」米奇耸耸肩，露出无奈的表情。


    匡宇点点头说：你这个问题很有意思，也是曾经困惑我很久的问题。我只能告诉你，对女生该快攻还是该慢攻，牵扯到当下的场景、你自己的状态、对方对亲密关系的心态等等变项，是没能说个准的，也就是根本没有一个公式可循。我能快攻，不见得你也适合快攻；快攻对眼前这个女生有用，对另一个女生来说也许就犯了她的的大忌，觉得你不过是个毛手毛脚的花匠。


    米奇呸了一声：「马的，教主你这说了半天不是等于没说吗？给我一个标准答案，一个固定的方程式，只要我照做，就能产生预期的结果，没有这种东西吗？」


    教主斩钉截铁说：没有！而且我要讲，就是这种不想自己去尝试经验、失败碰壁，只想捞个现成答案和方法的态度，才是让一个男人一直搞不定女人的最大原因。


    「那好吧，我再自己努力看看吧，谁叫你都不帮我？」米奇面露委屈，径自跑去一旁的便利店买果汁喝去了。


    只见匡宇趁着米奇不注意时，在伟淳耳边轻声说了几句，伟淳露出奸诈的笑容，两人似乎有什么不可告人的安排。


    原来，匡宇是嘱托伟淳，下次在适当的时机，好好跟米奇分享对女生到底该慢攻还是快攻的议题。他不是不想跟米奇分享绝招，而是对于只想拣现成的人生态度深恶痛绝。给他鱼，还不如给他一根钓竿，匡宇如此深信着。

    '
