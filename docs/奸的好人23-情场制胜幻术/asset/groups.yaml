    > “我马上话锋一转，问这个韩妹劲珍说：‘有朋友告诉我，其实我那时能够这么镇定，又义正词严拒绝，是因为我对那女学生没兴趣啊！要是换成别人，搞不好就把持不住了。比如说这样好了，劲珍，要是今天换成你是那个女学生，搞不好我……’”伟淳当下马上试著用动作和表情，在米奇面前演出情境。


