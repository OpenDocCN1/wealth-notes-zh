    「管他忙不忙？我们这么久的朋友了，怎样他都应该出来和我见个面！」米奇心情满满这么说，认为有多年的友谊当基础，自己的老朋友不会不来看他。但其实他心里，宁可容蓉突然取消她的通告，赶过来和他碰面最好，毕竟“狸猫换太子”、“教主换美女”这样的剧目能不能上演是最好。可是根据他多年经验，在关键时刻，妹永远不会像自己的好朋友如此义气相挺，他现在只有伟淳和教主了！在离开台湾，回到那个“岛地方”厦门之前，至少有两个人陪着他，那种挫败和寂寞感，才不致于如汹涌潮水般涌上心头。


    「也是，那你现在赶快打电话吧。」伟淳怂恿着米奇。离上次见到匡宇，也有三个多月了。趁着这次机会，他也想好好问问匡宇之前在美国读书的情形，研究一下未来去美国读博士班的可行性。米奇拨着
    0930490800 这个号码，等待着电话那头的回应。电话响了七声，终于有人接听，电话那头传来浑厚又充满磁性的声音：「喂，我是谐训教主郑匡宇，请问哪位？」


    「还谐训教主勒！郑匡宇，我是米奇啦，当年在青访团和你穿同一条内裤、睡同一张床的米奇啦！」米奇忍住笑，用高亢的嗓音试图唤起匡宇对他的记忆。「米奇啊！好久不见！你回台湾啦？听伟淳说，你不是在厦门工作？」听到米奇那熟悉又有点陌生的声音，匡宇瞬间想起十几年前在青访团的回忆，脑中历历如绘。他亲切问候着米奇。


