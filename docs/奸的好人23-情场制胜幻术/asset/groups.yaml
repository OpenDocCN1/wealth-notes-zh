    ### 欲望与责任的拉锯战


    婚礼上，米奇中间休息去厕所的途中，一眼瞄到了隔壁宴会厅里的伴娘，惊为天**人**。趁着婚礼结束，兵荒马乱之际，以「大家都在办婚礼，喜气洋洋，又刚好都在隔壁实在是缘分」这样的「巧合」米奇顺利搭讪认识了那位伴娘珊卓拉。珊卓拉留学日本，从事珠宝设计，有着白皙的皮肤、修长的美腿，完全符合米奇要求的瘦高白标准。于是米奇使出浑身解数，每天复习一遍匡宇教他的情场制胜幻术，审慎对珊卓拉出招。


    这一次，不知道是米奇出运了，还是匡宇教的幻术真的奏效，他和珊卓拉的发展，从牵手接吻直到本垒，都如行云流水，无比顺畅。米奇某晚躺在珊卓拉身旁，还用力捏了捏自己的脸，不敢相信好运终于降临在自己身上，一切彷彿苦尽甘来。


    一个月后，他跟匡宇见面聚餐，大声告诉匡宇：「我终于交到梦寐以求的女孩了！」匡宇微笑着听米奇描述他与珊卓拉的故事，觉得既欣慰又开心。倒是米奇聊着聊着，突然若有所思：「匡宇，我真的很喜欢珊卓拉，但我有一个不可告人的想法，不知道能不能跟你说说。」米奇把椅子往前拉了拉，看来他接下来要讲的东西，还真有一定的机密性。


    匡宇笑着拍了一下米奇的肩膀：「看你这个样子，分明就是无论如何都想跟我说。唉，谁叫我是你朋友，说吧，你有什么想法？」


    「咳咳，就是啊……」米奇咽了咽口水，接着说：「虽然珊卓拉是我梦寐以求的女孩没错，可是我和她走在街上，看到其他辣妹时，心里还是会痒痒的；还有啊，我没事上无名小站正妹精选页面时，看到那些美女照片，也会有想要写信去认识她们的冲动，你看我这样是不是有问题啊？」米奇心虚伸了伸舌头。


    「哈哈哈，你岂只有问题，根本是犯规！」匡宇大笑之后，大声说出这句话。「不要这样说啦！我可是把你当好朋友，才会跟你这些的。我对这种心态觉得很困扰，害我每次在珊卓拉面前都有些许的罪恶感。」米奇嘟著嘴，貌似撒娇。匡宇这才收起玩笑，点点头说：「嗯，其实啊，你的那些想法，再正常也不过了，只要是男人，或者说只要是人都一样，看到一个优秀的异性，都会有某种程度想要和对方更进一步的想法，只是女人比男人多了更多的道德及文化束缚，而男人则在潜移默化中，反而被鼓励要「四处播种」。所以容易偷腥罢了。」


    米奇面露感激：「教主，我真喜欢你，只有你不会大声斥责我，也只有你敢这样大声，把这种东西说出来！」


    匡宇耸了耸肩膀：「这不是我说的，是根据进化心理学的理论来的。不过我要提醒你的是，这种吃饱碗里看碗外的想法，从生物的本能来看，虽然没有什么错，但放在社会道德、文化与法律的框架底下，就容易产生问题。像我现在已婚的身份，如果还想在外面偷吃乱搞，就是犯了通奸罪，是有法律责任的。」


    「嗯，这我知道，但那是因为你已婚了啊，像我这样还单身的，应该没有那么严重吧？」米奇还存着侥幸心理。


    匡宇不置可否，笑了笑说：「是啊，是没那么严重，出事了不会有法律来制裁你，不过你难道没看新闻吗？之前清大浴尸案还有男女主播被报复案都搞得鸡犬不宁，甚至家破人亡。他们也是没有婚姻束缚的人啊，可是事情还不是搞得很大？」


    「你这么说起来，是很可怕没错。」米奇回想起多年前，那几件社会情杀案件和绯闻，仍然记忆犹新，不禁冷汗直流，拍了拍自己扑通扑通高速跳动的胸膛。


    匡宇接着说：「男人在外头偷吃时，都有一种很白目的想法，就是以为神不知鬼不觉，没人会知道，或者以为自己神通广大，可以搞定外头那个第三者。」殊不知，人的感情是很微妙的，第三者一开始也许承诺，自己会做个乖乖的小三，不吵不闹，可能她原本也是真心以为自己心甘情愿；但无奈，随着感情越累积越深，她越来越控制不了自己的行动，要的也越来越越多，最后就会找上那位原配，搞得那男人原本的家庭和感情鸡犬不宁。「你说的很有道理。」米奇点点头。


    也就是说，大部分男人都高估了自己，以为他能够控制另一个人，但事实是，他能控制的只有他自己，而且很多人连自己都控制不了。匡宇语气坚定。


    所以你的意思，就是要我们安分守己，不要乱搞就是了？米奇想确认匡宇的想法。


    「对，我是觉得，人活在世上，其实真的可以让自己好过些，就看你要不要选择去那样想、那样做罢了。本来好好的生活和感情，干嘛没事给自己找麻烦呢？像你现在单身，如果想要见异思迁，问题还比较少，但像我这种已婚人士，就要冒着夫妻失和，还有未来小孩瞧不起自己的风险。何必硬要搬石头砸自己的脚呢？」


    匡宇边说边想到，之前看过几个因为偷吃而家破人亡的社会事件，不禁摇头。「但听你这么一说，感觉只是想过个生活上快乐清净，所以才不东搞西搞，回到头来，还是为了成全你自己的快乐人生。」米奇对匡宇的「自私」又想批评，又觉得似乎很有说服力。


    「我只是珍惜自己得来不易的人事物，也希望身边的朋友们都能懂得珍惜现在，适当控制欲望。」匡宇微笑点头，但突然间，他彷彿想起什么似的，欲言又止。


    米奇看出了匡宇的诡异，忍不住问：「你是不是还想说些什么？说啊！」


    匡宇突然话锋一转：「米奇，看你现在满面春风的，趁着你人生得意之时，我有一个埋藏在心里多年的秘密，要跟你讲。」


    「哇，没想到你对我还有秘密的啊？说吧！」米奇难掩心中的得意和幸福感，满不在乎地回应。


    「我实说了，你不要生气哦！」匡宇小心翼翼再问一次。「生气？为什么要生气？该不会你要告诉我，你其实和珊卓拉有过一腿吧？」米奇明知故问，他明知那是不可能的事，却故意说出来晒晒自己的幸福。


    「你说的是什么跟什么啊？那怎么可能！」


    「好啦，那你快说，到底是什么秘密？」


    「你记得丹尼尔吗？」


    「丹尼尔？哪个丹尼尔？」米奇还是微笑着。


    「丹尼尔·陈。」


    「丹尼尔·陈？哪个丹尼尔·陈啊？」米奇的语气突然有点急促起来，脸上还闪过一丝怪异的表情。


    「就是你大四快要毕业，担任毕业生联合会会长时，协助你制作校刊的学弟，丹尼尔，陈。」


    米奇突然暴跳如雷：「妈的，你提那个王八蛋干嘛？他就是当年抢走我前女友小静的混蛋，害我兵变，在外岛孤伶伶一个人承受冷风吹，差点崩溃。你怎么会认识他？」


    匡宇一脸木然：「他是我表弟！」


    「什么？他是你的表弟？你怎么都没有跟我说过？」


    「唉，我本来也不知道，他当时想横刀夺爱的对象，是你那时的女朋友。我表弟只告诉我，喜欢上同一个校的女生，不过那个女生有男友，在外岛当兵。我一听他说情敌在外岛当兵，便告诉他：那等于这个女生根本没有男友，他只要做他该做的就好。于是，我便透过电话传授我所有的绝招，他学很快，没三个月就攻破那女生的心房，搞得女生跟身处外岛的男友分手。」


    「X！那个戴绿帽，满头绿油精的男朋友就是我啊！你当时不知道吗？」米奇气急败坏地追问。


    「嗯，完全不知道，我也是后来看到他**和**那个女生的合照时，才想起好像对那女生有印象，因为你也给我过看跟你小静的合照。当时我心想，惨了，我帮了表弟，却害到朋友。不过为时已晚，我真不知道该怎么办。」


    「我……我……你……你……」只见米奇的表情扭曲，有种说不出的怨叹与哀伤。沉默了一会儿，米奇接著说。


    「唉，算了，那个前女友小静，后来家道中落，父母想要做几个生意都做不起来，亏损连迭，沦落到需要跟我借钱的地步。而且还欠钱不还，一副我就该借他们家钱，叫她还钱反而是我不够大气一样。听说她虽然结婚了，但跟老公感情很不好，吵离婚不知道吵几年了。」


    米奇顿了顿，倒抽一口气，摇摇头说：「其实仔细想想，要不是你表弟当时横刀夺爱，说不定现在深陷苦海的人，就是我。」


    匡宇一看米奇似乎没有那么在意这件事了，便赶忙接著说：「我很高兴，你能够用正面思考的态度来看待这一切。其实当时，我知道事情的来龙去脉后，心中一直觉得对你有亏欠，总想著能有什么机会帮你一把一方面赎罪，一方面补偿你。」


    「原来如此。这就是你想把情场制胜幻术传授给我的原因。」米奇恍然大悟。


    「对，这一切表面上看来是帮助你，其实也是对我自己过去犯下错误的补偿和救赎。而我很高兴，你现在所交往的珊卓拉，比当年那个小静学妹要好上太多了，不管是在外型、个性，还是家庭背景等各方面都是。她绝对是未来能为你的事业和人生加分的伴侣。」


    「嗯，所以人生似乎就是这样，祸福相依，这一刻的不幸和痛苦，说不定不是真的不幸和痛苦，而是幸福与快乐的前兆。」


    「一点也没错。而能够转为幸福，亦或是继续痛苦的转折点，就在于你是否在这个过程中持续不断努力。我很高兴你从来没**有**放弃自己，也没有放弃寻找那个和你两情相悦的对象。现在的幸福，是你值得的！看来我已经没有什么可以教你的了，除非你想走入婚姻，我倒有很多新的发现，能和你分享。」匡宇欣慰点点头，露出满意的莞尔笑容。


    「哈哈，你等着吧！我不排除迟早步上你的后尘，但是现阶段，我还是比较享受无拘无束的单身贵族生活；日后若是珊卓拉能带给我像 ViVi 带给我一样的感觉，我也很乐意永远牵着她的手一直走下去。谢谢你，让我从此不再一个人！」米奇微笑响应。


    两个人在街头静静地走着，米奇突然像是想到了什么似的，拿出背包里的 iPhone 拨了通电话。原来，他是迫不及待地，想跟珊卓拉分享今天和匡宇对话的体悟。


    匡宇在一旁静静地看着米奇柔情洋溢的侧脸，心中不禁要为眼前这个坚持到底、苦尽甘来的男人暗暗喝彩。自己开创华人世界的先河，从推广**搭讪**运动开始，一路辛苦走来，不就是为了带领天下的男人们，不断提升自我，找到属于自己的幸福，同时带给别人幸福，为彼此的人生加分吗？寄望米奇在学会各种高深的情场幻术之后，能够看穿这一切，开始学著细细品尝与一个真正相知相爱的人，毫无保留分享一切的喜悦与满足！


    看着看着，匡宇的心中渐渐浮现起一种既熟悉又遥远的感觉；充满温馨，却又带着苦涩。倏然间，一向不甘平凡的脑袋再度开始飞快地运转，全身充满能量，豪气万千！


    「喂！兄弟！你跟珊卓拉慢慢聊……我得先走一步了。」匡宇摆摆手向米奇道别。至于匡宇想到了什么，又有什么惊天动地的计划？那………是另一个故事了……


