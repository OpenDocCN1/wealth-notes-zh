    他说他不甘心，自己努力这么多年，却即将因为筹不到钱而没办法拍完电影；他不甘心，只因为台湾市场既小、又不够鼓励文化创意产业，自己的才华就要被抹杀。


    套一句剧中男主角阿嘉大声说出的话：「我明明不差啊！为什么只是现在这样！」魏导演觉得自己不差，凭什么不能出头天？于是他用上自己的所有积蓄和房子去抵押，换取拍片的资金，誓言一定要用自己的电影走出一片天。他的不甘心，后来也获得了极大的成功！


    不过匡宇打从心底认为，这种针对事业和梦想的不甘心，是不适用于追女孩的。毕竟女孩子不是事，也不是物，没有「撑得够久就是你的」或「好人一定有好报」这种因果循环，能保障最后的成功。因此，搞清楚自己在追求的到底是什么，便显得格外重要。


    米奇苦涩摇摇头：这些道理我懂归懂，但是要克服心魔好难！


    记住，想要成为一个所谓的情圣，认识自己、了解自己的长处和短处，是非常重要的。你以为我没遇过你提到的那些情形吗？匡宇正色道。


    「怎么没听教主你说过呢？」米奇语调惊讶反问。


    匡宇挑起眉毛：「难不成我要把所有经历，一五一十向米奇哥你禀报吗？回来正题，我和你不同的地方是：我追求的，从来就不是任何一个单一特定的女生，而是符合我要的外貌和人格特质，最重要的是，能和我两情相悦的人。这种态度，和你所追求的东西不同点在哪里，你发现了吧？」


    你的意思是：对你而言，没有任何一个女生是完美了或了不起的，任何人都是可以被替代的，对吗？米奇似懂非懂回答。


    匡宇点点头：差不多。虽然不是百分之百正确，但你现在能把握到这个层次，对你的帮助已经很大了。从这样的角度出发，想想那两个女生对你伸出咸猪手时的反应，再给你一次机会的话，你会怎么回应？


    「呃……我想，对用金钟罩铁布衫把我的手震开的台大学妹，我应该会装作什么事情都没发生，继续看电影；至于那个叫我不要和她肢体接触，说她不喜欢暧昧的人，我大概会说：哦，我也不想暧昧，我只牵我喜欢的手，会成为我女朋友的女生的手，然后看她的反应！」米奇搔搔自己的头说。


    匡宇忍不住拍手对米奇说：太好了！You Got It! 最重要的是，米奇你应该知道，即使讲出那些看似厉害的话，也只能当成嘴皮子要一要罢了。因为那个女生对你的基本印象和防卫心已经定型，很难用几句话就翻盘，但是，你的态度至少让你不输。而且最重要的是，你会把她放在一边，去认识其他女孩吧？


    谨遵教主指示！米奇双手作揖，把匡宇当成自己的老师来行礼。


    ## 第八章 情场胜将，是这样当的


    ### 制造为爱牺牲的幻觉


    为了怕捷运上其他的人听到他们的秘密对谈，匡宇边说边刻意压低音量：这样吧！既然你这么想知道如何跟女生更进一步，我就再告诉你几个不错的幻术。我之前不是提过，和女生约会时一定要有吊引对话题，让她和你一起陷入你设计的情境，把你当成男主角，自己是女主角吗？有时候，如果能够利用女孩子自己讲出来的话，或者利用外在突发状况，临机应变，将它们扭转到对自己最有利的态势，效果更佳。


    教主你讲得好玄，我听不太懂，能不能举个例⼦？米奇侧⾝靠近想听个清楚，原本翻看报纸的伟淳也放下报纸，准备专心聆听。


    匡宇看两人都准备好了，继续说：，好吧！你记得我的某位前韩国女友 Lena 吧？我和她顺利牵手之后，就一直想找机会再进⼀步，往亲吻的方向迈进，不过却⼀直苦⽆机会。


    对，我也是！牵手也许还可以，但是要⼏⼾和⼥生接吻？这实在让我很头⼤。我也知道，能接吻就能上三垒，能上三垒应该就能奔回本垒……由于说话内容太过情色，米奇⾳量压得更低。


    彼此第⼀次接吻，对⼥⽣来说是很重要的。她们都喜欢浪漫，⼀定要想办法尽量符合她们这个需求，否则你不但亲不到，她还会觉得你只是个朋友，接着慢慢疏远你，到最后完全不联络。匡宇接着说。


    米奇⾯有难⾊：伤痛的回⼜又浮现在我脑海中了，stop，回来说你和 Lena 吧！


    我当时⼀直在⽬⼤，到底有什么机会，可以让我和她从牵手进⼀步发展到接吻？有次机会终于来了。


    那天，匡宇和 Lena 去看电影，排队买票后等⼊场时，突然出现⼏个⾼中⼥⽣，在旁边吃爆⽶花，Lena ⼀直盯着她们爆⽶花看。


    匡宇问她：「你想吃哦？要我帮你买⼀份吗？」讲违这段经历的匡宇，⼀故弄疑阵问米奇：「结果你猜 Lena 怎么回答？」啊，不就是想吃爆⽶花，叫你去买给她吗？米奇眨眨眼睛。


    那时，Lena 鬼灵精怪转转眼珠⼦说：「嗯，但我不想吃⼀⼤包爆⽶花，我想吃……」


    米奇沉不住气道：「教主，拜托你不要一直卖关子啦。」


    Lena 指着不远处的那个女高中生。我想吃她的爆米花，可以吗？


    「这不是强人所难吗？」米奇惊讶问。


    「我当时也面露难色。但同时我又在心中想，到底怎么做，可以把这个她对我的玩笑和考验，转化成让我和她的关系更进一步的契机呢？结果给我想到了。」匡宇露出慧黠的笑容，边说边看着米奇和伟淳。


    「你怎么做？」米奇和伟淳同声问。


    当时匡宇说：「要吃那个高中生手上的爆米花可以，我去帮你向她要，不过你要给我什么奖励？」


    Lena 回答：「呵呵，真的吗？你可以拿到，就随便你怎么说怎么办吧！」匡宇打蛇随棍上说：「那你让我亲一下当作是回报口巴！」


    趁她羞红着脸，还没回答时，匡宇走向那群高中生，用蹩脚的韩语告诉她们：他的女朋友想吃她们手中的爆米花，拜托给他一小把，好让他回去交差，请她们务必帮这个忙。


    听到这，米奇羡慕说：「哇，你真有勇气！」


    这算什么勇气？这样的小忙，很多人都愿意帮的，而且就算失败，顶多就是丢个小脸而已，谁会记得我？不过，当我捧着手中的爆米花回去 Lena 身边时，我发现，她看我的眼神都不太一样了。匡宇得意说。


    「怎么不一样法？」米奇和伟淳好奇问。


    你也知道，女生最喜欢的，就是自己欣赏的男生，为她去做一些他原本不太愿意做的事。我这样的举动，等于向她证明她对我的重要性，我愿意冒着被人拒绝和嘲笑的风险，去帮她要爆米花。这让我在她心目中，又加分不少。匡宇的笑容更灿烂了。


    「哈哈哈哈哈，她真不了解你！你这么厚脸皮，不要说爆米花了，什么下跪吃屎，再丢自尊的事情你都做得出来。」米奇忍不住吐槽匡宇。


    「哎唷，这个你知道就好，我能在 Lena 面前表现出她想看到的东西最重要。」匡宇假装半求饶似说。


    米奇赶快追问：，那你就马上亲她了吗？


    没有！拜托，我不是一直跟你强调美感吗？那样就亲有美感吗？后来电影快开始前，匡宇转头问她：「咦，你好像忘了什么东西哦？」Lena 愣了一下，侧过头来问：「啊？什么东西？」匡宇直接亲她的脸颊后说：「一个吻！」


    「教主，我发现你真的很大胆耶！人家通常都是先问才亲下去，你怎么亲下去后才说话呢？」米奇张大眼睛，难以置信。


    「先问再亲是好人行径，你觉得我是好人吗？其实先问再亲不是好人，也不是尊重女生的举动，是笨蛋！你觉得有哪个女生被男生问到能否亲她时，会大声说好？你就把场景营造得自然一点，然后把嘴凑上去，女生喜欢你就会接受你、迎合你，还不够喜欢时就会躲开。


    这，就是女生要的自然而言，也是亲吻时最好的方法！」匡宇语气笃定说。


    好。那你刚才只是亲脸颊而已啊！啪呢？你是怎么和她接吻的？亲脸颊和接吻，对女生来说意义是很不同的哦！」米奇紧接着问。


    「哈哈，不要着急嘛！让我慢慢告诉你。其实我当时一直有在铺哦！例如电影的情节到最后的高潮处，男女主角破镜重圆，说真的，像这样的老梗，我看了根本没有什么感觉，但我眼睛一瞄到
    Lena 流下了两行热泪，我赶紧用挤的，也挤出了几滴泪，然后在散场时深情看着她……」匡宇装模作样挤挤眼睛。


    然后你们就接吻了吗？米奇最关心的就是这个话题，讲没两句就想问匡宇和 Lena 是怎么接吻的。因为他跟女生每次走到这一步之前都会卡住。他真是迫不及待，想知道匡宇到底有什么绝招。


    匡宇摇头叹口气：「米奇，拜托，你不要开口闭口就接吻好不好？我不是告诉你要铺垫吗？你一定是每次跟女生出去时，就一直想『下跳棋』，不按部就班来，想直奔本垒，结果连一垒都上不了。」


    「好啦好啦，现在不是数落我的时候。那你告诉我，你还做了些什么？」米奇挥挥手，示意要匡宇别再提醒他那些不光荣的过去。


    我们找个方坐下来，吃点东西，喝了一杯鸡尾酒，我再故意聊起电影的情节。这时她还取笑我，说我一个大男人怎么看电影也会流泪……匡宇这时又演起了他们当时和鸡尾酒聊天的模样。


    她真单纯，居然不知道你的泪不是为了电影流的，是为了搞她而流的……米奇不满地說出他心中最想说的话。


    匡宇笑道：兄弟，讲话不要这么难听嘛！我也是真情流露啊！我要是和她什么都没发生，之前投资那么多时间和金钱，落得两头空，那才要痛哭流涕呢！


    米奇点头：上次那个台大戏剧妹，本来说好了要吃意大利面，结果把我带到101的红花铁板烧，饭钱从原本预算的一客六百，变成一客三千六……我才是最大苦主好不好！不管啦，那你后来还做了什么？讲到那段被当冤大头要的过往，米奇就有气，他赶紧自己转换话题。伟淙听了笑得合不拢嘴。


    匡宇问：Lena，如果你是女主角的话，会不会在多年之后，还保持单身等待男主角？


    Lena 反问道：不知道耶，那如果你是男主角，你会等着女主角吗？


    匡宇顺势握着她的手说：，我应该也会！但如果Lena你是女主角的话…… 匡宇再次使出他的老招，讲到一半嘎然停止，故弄玄虚。


    听到这，米奇像个好奇的小女孩，紧张问：「怎样？」


    当时，匡宇深情望着她说：请你不要让我等那么久。接着就往她的唇吻去。


    「嗯，挺完美的。我大概知道要怎么操作了，反正就是不要太心急，先把浪漫的梗铺好后，再一举成功就对了。还有，你之前提到，利用突发事件制造浪漫，那又是指什么？知道了一招还不够，米奇打算再多学一招。」


    刚才提到的是临机应变，运用女生丢出来的问题或考验，转换成对自己有利的契机。现在我要教你的，是利用原本你们两人都无法控制的突发状况或天灾人祸，加强彼此间的紧密情感联系。由于事属机密，又是他未来新书《情场制胜幻术》即将发表的内容，匡宇在说这句话前，小心翼翼四处张望了一下，确保旁人有偷听他们说话的内容。


    ### 小意外使感情增温


    这样也行？米奇好奇问。


    行！例如有一次，我和一个女生约吃饭，吃完后邀她到我家聊聊天。匡宇又举了另一个例子。


    到你家聊聊天？那不是意图很明显吗？米奇替女孩子捏了一把冷汗。


    匡宇赶忙说：「也不一定啊！我也会请普通朋友到家里聊天好不好？但我是对她有兴趣没错啦！而且，我能感觉出来她应该对我也有好感，但无法确定。」


    米奇点头道：「对！我也时常这样。有时候我真的分不出来女生的一些举动，到底是对我有意思，还是对一般朋友都这样？我很害怕，要是她只把我当好朋友，结果我会错意轻举妄动，到时候连朋友都做不成，该怎么办？」


    你这个顾虑也是很有。不过根据我多年的经验，和你分享一个观念：一个真正喜欢你、欣赏你，把你当成一个朋友的人，是不可能因为你超出友谊的请求，而从此和你拒绝往来的；那些以你対她有意思是借口，而和你保持距离，不再做朋友的人，根本打从心底就没有把你当朋友吧？匡宇正色说。


    好狠，但又狠得好真实！的确，要是我真的把一个女生当朋友，她尽管对我告白失败，我还是把她当朋友。本来就！朋友之间，有什么不能说？有什么不能谅解？只要态度清楚明确就好！米奇完全同意匡宇的论点。


    没错。大部分的人，即便是求爱遭拒，也不会苦苦纠缠，所以重点还是回归到那个拒绝求爱者的人，态度是否够明确：不过当然啰，如果求爱者不退回到朋友的位置，还苦苦相逼，最可恶的是天天摆出一张结屎面，好像对方不接受他就是犯天条或对不起他，那就是他活该！这种人，别人有权利不跟他继续做朋友。匡宇斩钉截铁说。


    米奇叹了口气：教主，还好我有你这个好朋友，可以陪我聊天散心，并且去认识其他的妹，不然我大概也会像你和女人们厌恶的那些男人一样，对前女友死缠烂打。


    哈哈哈，我们这种生活，总归起来还是不错的呢！好啦，你还要不要听，我到底是怎么和那个女孩更进一步的呢？怕米奇搞不清楚谈话的重点，匡宇赶快把话题拉回米奇最关心的事情，因为再三趟他得先下车了。


    教主你是明知故问啦，到底发生了什么事，让你有机会确认她对你的好感？米奇赶紧追问。


    我们在家里天南地北聊。你也知道的，我这个人在发功时，除了言语铺垫之外，还会一进一退，也就是和她聊到有趣的地方，就和她做一些肢体接触，再不然就是坐得离她近一点，等攻击奏效（戳一下）之后，再退回原来的位置，这样一进一退、以退为进，目的就在于测试她对我的接受度。

