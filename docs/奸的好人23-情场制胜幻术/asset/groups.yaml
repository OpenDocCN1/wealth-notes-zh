    “嗯，幼珍当时也是像你一样，默默说‘对！’我接着讲：不过韩国最让人不能接受的，是跟台湾断交也就算了，居然隔天就把中华民国台湾在韩国所有的财产，包括大使馆的领地和资产，全部移交给中华人民共和国！这不就好像你和男朋友分手后，把所有前男朋友的东西，直接送给了现任男朋友，还故意让前男友知道，当着他的面扮鬼脸。是可忍孰不可忍啊！”


