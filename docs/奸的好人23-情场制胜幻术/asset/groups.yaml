    ELLE 杂志的通知，要我去当模特儿拍几件衣服。也不知道要拍到什么时候，不好意思哦，我们改天再约好吗？」甜美的娃娃音，加上听起来冠冕堂皇的理由，即使心里再怎样不愿意，为了展现自己的大气，米奇还是只好说：「那好吧！等你忙完，再打给我好了。要是还有时间，我们还是想办法见个面吧！毕竟我明天就要回厦门了，再回来大概是一个月以后的事，这次不见面，下次都不知道什么时候才能见了。」虽然眼看“见妹之梦”即将破碎，米奇还是不死心，不想放弃这仅有的一线希望，勉强打出了这垂死挣扎的“最后一击”。


