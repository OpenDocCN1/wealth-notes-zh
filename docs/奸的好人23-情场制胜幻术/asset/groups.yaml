    \ 156\n\n## 推荐序\n\n搭讪教主果然不同凡响，沉潜多时后重出江湖，一出手，就让市场上的两性书相形失色。\n\n—— 精神科医师马大元，三军总医院住院医师、总医师。主治医师，新竹市精神健康协会创会理事长，现任大干综合医院南势分院院长（著作：小心你被催眠）。\n\
    \n搭讪教主再次大方传授，如果这本书再出得早一点，也许我可以早几年追到我老婆\n\n—— 著名网络趋势观察家 MR. 6 刘威麟。\n\n一部很细腻的小说，文笔生动活泼不失幽默，值得细读。能同时把宅男和情圣的心态与作法，描绘得如此入木三分，郑匡宇是国内第一人！\n\
    \n—— ayawawa，本名杨冰阳，网络人气美女、新浪微博和微博千万人气作家、主持人。\n\n一开始我对匡宇的人和书充满偏见，不过当我五年前翻开他第一本书后，却展开了一段奇幻旅程，他和他的书改变了我的世界。如果你对他和他的书有偏见，也希望这本书能开启你的另一个世界。\n\
    \n—— 创意学达人&比赛达人符敦国。著有《比赛高手一本通》，拥有创意学学位，经常四处演讲教学。最受欢迎的讲题《创意与偏见》，就是他和教主的真实故事。\n\n\
    想听所谓爱情专家的话，不如选择听郑匡宇的，因为他过着真正的幸福人生。\n\n—— 平凡图书出版社董事长，畅销书《奸的好人系列》《有钱人的偏方》、《有钱人一定有偏见》、《出位硬要世界看重我》、《神棍之遗失的记忆》作者，将权谋普及化、全民化、现代化的权谋大师李民杰。\n\
    \n郑匡宇的文字和思辨功力，果然不同凡响！乍看也许是本教人把妹的工具书，但里头的对话，已经上升到了哲学的境界。\n\n——图书出版代理负责人刘敏慧。\n\n\
    相信的人有福了，郑教主带来了史上第一本教人爱情攻防战的指导小说，帮助你在爱情路上如履平地。\n\n——感情专家，五年前以《思想改变运气》颠覆震撼术数、命理界，五年后以《FB\
    \ 不教你的读心术》轰动香港出版界，再以「篡改生命线」的法则，引爆《挡不住的好运》哲学思想，是香港最具实力，「改命引运」的玄学大师、跨领域畅销书作家龙辰天师傅。\n\
    \n故事是把信息输入头脑的最佳包装管道，《情场制胜幻术》就是郑教主把妹秘诀的故事化演义。\n\n——江健勇（江魔），《奸的好人系列书》、《爱情阴谋论》和《好男人病毒》的作者，掀起毒辣式NLP风潮的大师级人物。\n\
    \n本书给人的感觉，如同泰国降头师布下的爱情蛊，可用来控制对方。亚洲华人世界最权威的搭讪教主郑匡宇，施展文字，「布」下一盘爱情幻「局」，迷惑他人的心智。\n\
    \n新一代恶搞小说王、《亿万富豪密室告白》谋略（简金盛）真诚推荐\n\n情海向来变幻莫测，情场比起战场高深，自古以来因此死伤无数。有人铁齿又铁笔，说出制胜之法，而究竟，幻术是不是可以变成事实？取决于你看不看这本书。只看封面的标题，就只是幻术；看了里面的内容，幻术就有机会变成事实——只有你，可以把它变成事实。\n\
    \n——谢嫣薇，香港、新加坡、马来西亚跨媒体前卫时代女性、男女感情顾问、美食家、旅游家，思想前卫及影响力震撼马来西亚内政部，是该国唯一遭到严禁的专栏作家。\n\
    \n感谢台湾搭讪教主郑匡宇，出版这本《情场制胜幻术》，以拯救普天下饱受拙劣搭讪技巧折磨的正妹们！本书以轻松的小说情节，潜移默化并消弭各位男士的负面思想，让你面前的正妹不再拔腿逃跑，摆脱你被设为拒接来电的悲惨命运！\n\
    \n—— 林亚若，台湾空姐作家、电视节目米宵、国际线空服员、印度旅游达人、联合报专栏作家、知名部落客、诗人，曾出版林亚若诗集。\n\n理论结合实例的好体裁，华人恋爱教程的里程碑。\n\
    \n—— 冷爱，情感专家、中国泡泡恋爱学小区（泡学网）CFO\n\n不改搭讪教主一贯的霸气，书名有震撼人心的效果，内容则让人时而捧腹大笑，时而低回不已。郑匡宇把自己又提升到另一个写作的高度！\n\
    \n—— 韩国船务大亨 Alai\n\n看了武侠小说，你不会变成绝世高手；但搭讪教主的小说，于把妹主题之中，蕴含自我改变与成长，肯定能把你推上人生的另一高峰。你准备好跟着教主，开始一场翱翔爱情与幸福间的奇幻旅程了吗？\n\
    \n—— 宏碁计算机工程师 James\n\n还好九把刀先生当年没有看过这本书，否则他大受欢迎的作品，就要变成《那些年，女孩们一起追过的「我」》了!!!\n\
    \n—— Bruce Cheng，国立成功大学教授、中国枪竞技比赛电子装备发明人\n\n「女友缺很大」「中枪中到怕」？快翻书，给自己一记当头棒喝，也给自己一个全方位改造的机会吧！\n\
    \n—— 贝儿老师，超人气美女作家，千万粉丝部落格格主，著有《花儿开了，爱情来了》及《心脏在左边，爱情在右边》等畅销书。\n\n没有丑女人，只有懒惰的女人；没有泡不到妞的男人，只有不懂方法的男人。\n\
    \n为什么书名是《情场制胜幻术》，而不是更雷的《情场必胜幻术》？既然郑匡宇号称，搭讪教主，他倾囊相授的绝技，应该是「必胜」才对啊？关于这点，暂且卖个关子，当你对书中的概念、技巧，加以融会贯通后，自然会有所领悟。\n\
    \n小弟二十多年纵横书海以来，从没看过定位如此独特的一本书。如果有读者找到比它更独特的，我愿意花钱买下，附赠一本亲笔签名的《情场制胜幻术》，只限一本。\n\n\
    乍看此书名，好像是针对一众在情场患得患失，欲求正妹却不得其门而入的宅男。如果你有此想法，我只能对你的眼光感到赞叹。\n\n对！这就是一本为天下广大宅男而写的，天书。看了不担保你追到正妹，毕竟师傅领进门，修行靠个人；但如果你不细读，而跟正妹无缘，我只能送你一首歌：李圣杰的《擦肩而过》。\n\
    \n当然，如果阁下阅女无数，搭讪功力直通教主，甚至有过之而无不及（虽然现实上不太可能，如果为真麻烦来信告知），也请买一本做参考。毕竟知己知彼，难保有天你会跟教主的门徒交手，就当作买保险吧。\n\
    \n即便你对泡妞没有兴趣，视天下正妹如浮云，或者你本身就是正妹（如果是，也请来信告知，交个朋友），这本书也应该在你家的 IKEA 书架占上一角。为什么？情节动人、对白诙谐、人物生动，集以上优点于一身的小说，怎能错过？\n\
    \n徐志摩说过：「我将于茫茫人海之中，访我唯一灵魂之伴侣。得之，我幸；不得，我命。」而我说：「我于茫茫书海之中，寻觅指路明灯。今遇奇书，得之，我幸。如此而已。」\n\
    \n温馨提示：为「终身幸福着想，就算跟朋友 A 钱，也要买一本回家。\n\n张炜感言\n\n## 主要人物介绍\n\n### 米奇\n\n搭讪教主的多年好友，一直以来都是一个拥有矛盾性格的悲剧人物，喜欢他的妹，他不要，他喜欢的妹，又总是看不上他。自从多年前一次失恋打击后，对女孩子产生一种又爱又恨的复杂情结，过着「类宅男」生活，却总想撕下这个标签。不甘寂寞，在追求心目中的正妹、寻找真爱这条路上跌跌撞撞。\n\
    \n### 搭讪教主\n\n本名郑匡宇，知名作家、演讲家和主持人，虽然很多称号都是自封，但却乐在其中；还打算把自己不断毛遂自荐，冲撞出人生机会的故事，以媒体宣传、巡回演讲来达到广为周知的效果，成为亚洲第一激励达人。搭讪是他的蓝海策略，目的是带领所有男人进行自我提升。但他最大的败笔，却在某个人身上：就是那位即使经过多年努力，功力似乎仍进步缓慢的好友米奇。只不过，他决不能放弃米奇，因为这段拯救米奇之旅，其实也是对搭讪教主自身的救赎之旅。\n\
    \n### 舞蹈王子伟濠\n\n跟米奇和匡宇是从大学时代开始的好友，舞蹈得不是最好，却是所有台湾舞者中，最有企图心和梦想的一位。平时沉默寡言，但凭借着舞台魅力，总是不乏美丽女孩对他的青睐。对他来说，认识异性和扩大粉丝，其实是同一件事：爱上他的身体，自然就会爱上他的表演，爱上他的表演，也一定会爱上他的身体。\n\
    \n### 承佑\n\n搭讪教主当年在实践大学教授英语课程时的学生，其貌不扬，运动神经和英语更差，却有着「我不甘心」的热情和斗志，并一路谨遵教主教诲，走上自我提升之路，因此，要获取他所欣赏女孩的芳心，变得易如反掌。\n\
    \n### 钢琴王子 Pianoboy\n\n原本一个好好的台大物理研究所硕士，走在父母和亲友期待的道路 上，却因为看了郑匡宇的书，从此誓言追随自己的梦想，成为新时代不世出的钢琴曲创作人。温文儒雅，彬彬有礼，是女孩子一看到就会喜欢的类型。\n\
    \n### 迷难\n\n加拿大人，把妹界传奇人物，试图利用心理学和理工专业人士都能理解的图形与方程式，解构并分析异性之间吸引力的关系。他和匡宇多年前在洛杉矶结识后，彼此一见如故，交流了许多跟异性相处的心得。在网络论坛上，他给自己起了个英文名字\
    \ Mystery，意思是谜样的男人；但匡宇建议他，取中文名字时，用「迷难」这两个字比较好，更能体现出迷惑女生真的很难这件事。\n\n他欣然接受！\n\n\
    本文之人物姓名及故事均为虚构，如有雷同，纯属巧合。\n\n## 楔子\n\n1999年的冬天。\n\n大家一定觉得，台湾地区亚热带，冬天再怎么冷，能冷到哪里去？\n\
    \n殊不知，台湾一处外岛——马祖，由于四面环海，夏天固然并不酷热，但每到冬天时，刺骨冷风总会毫不留情迎面刮来，那凛冽的寒气，比地处北纬的美国密执安州的冬天还冷！\n\
    \n驻扎在南竿岛的防卫司令部，有个顶着少尉排长阶级的军官，趁着夜深人静时候，摸黑到了福利社门口旁电话亭，拨了通电话，给他在台湾的女朋友。\n\n电话那头，传来女孩冷淡的声音：你还打电话来干嘛？上次不是说了吗？我对你的感觉已经淡了，何况我也已经喜欢上了别人。我们分手吧！\n\
    \n那个人到底是谁？少尉排长气愤地问。\n\n电话那头的女孩沉默了一会儿，说：你一定要逼我说吗？好，既然你不到黄河心不死，我就告诉你。他就是和我们一起制作校刊的学弟丹尼尔。\n\
    \n他！怎么会是他？我一直把他当成亲弟弟，入伍前还托他照顾你，你怎么会跟他……？军官的口气从不解、愤怒，渐渐转为挫败，最后甚至带着哀求。\n\n「有时候感觉来了就是来了，也无法强求的。」女孩的态度依然毫不在乎，甚至带着一丝冷酷。\n\
    \n军官急着想说些什么，但电话另一端的女孩狠下心来，挂断了电话，军官再拨过去时，已经转入语音信箱了。\n\n军官失魂落魄走回自己的宿舍，一股夹杂着难过、愤怒、不甘和疯狂的心情袭来，他开始拔腿狂奔，嚎啕大哭，彷彿想让迎面的刺骨寒风撕裂他的心，因为天地之间，好像突然没有了他的容身之处。\n\
    \n如果你也曾经在外岛当兵，在最孤立无援时被「兵变」，你就能体会他的心情。\n\n冷不防，奔跑中的他一个不慎，踉跄跌倒滚入路旁的草丛中。\n\n他瞬间冷静下来，回想起和她一起辛苦经营三年的感情，只因为他入伍服役，就这么烟消云散，实在不甘心。军官用力捶着地板，仰天长啸：为什么？为什么我不能像其他人一样，拥有平凡的幸福？他恨！\n\
    \n## 第一章 正妹不懂我的心！？\n\n女生是很敏感的动物，当一个男生越是想在她面前表现些什么，她就越有把握，这家伙已经上钩了、被她吸引了；当一个男生越想在言语上暗示自己多么有能力时，女生理心里对他的能力就越有疑问；如果你被女生发现你\
