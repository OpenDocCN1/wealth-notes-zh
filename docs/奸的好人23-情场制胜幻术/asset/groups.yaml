    你看，连你这个后来听故事的人都有反应了，何况是她这个陷在情境里的当事人？我看她很专注陷入我布下的情境里，便说：“嗯，我想啊，如果是你的话，我应该会要你转学！”伟淳把米奇当作是当时的韩妹劲珍，带着一
    点深情、专注又痛苦的表情，注视着米奇。


