    # 如何败部复活？


    三人进入了花博会场，觉得眼前的景象真是美不胜收，心想所谓「台湾的软实力」，或许就是透过所谓花博这样的活动，才能让世界看见。听说这次台湾花博会的经费，与他国主办的花博比起来，是历届最少的。但台北市政府和参展的团体，运用高超的花卉技术和精益求精的巧思，把仅有的资源做最有效的发挥和利用，造就了这次花博的成功。三人走向其中最著名的，「未来馆」在排队时，米奇又忍不住问Pianoboy


    「对了，我顺便还要问你一个问题，就是像小怜这种在路上搭讪认识的女生，其实我也认识过不少个，但很多都不跟我出来约会。这种搭讪，说到头来还是一种失败。我想问的是，你觉得这种原本失败的搭讪，有没有可能败部复活啊？一个女生要是刚开始对你印象不好，还有可能成为你的女朋友吗？」这是困扰了米奇许久的问题，趁着这次机会，米奇一定要问个明白。


    「有是有，不过老实跟大哥报告，机会很低，我也只有过一次经验而已。」Pianoboy老实回答米奇。


    「那么来分享一下，你那一次是怎么扭转乾坤的吧！」米奇精神抖擞，打算吸取Pianoboy的经验，作为他下次再战时的参考。


    只见Pianoboy一阵沉思之后，摇头晃脑说：「我觉得啊，大原则其实只有两个，一个就是你的实力要够坚强，另一个就是你的运气要够好，如此而已。」


    「哦，愿闻其详。」这答案让米奇觉得不太能理解。


    Pianoboy清了清喉咙继续说：「事情是这样的。我的前任女友，也是我路上搭讪认识的。不过，就如匡宇大哥所说，和女生认识的场景实在是太重要了。想想我也是台大物理研究所毕业，被一般社会价值认定的高材生啊！可是，就因为当初第一次认识她，是在路上擦肩而过的搭讪，所以她一开始对我的态度，简直奇差无比啊！」


    Pianoboy边说边摇头，想起自己当时被前女友当作路边狗屎，避之唯恐不及的际过，实是是惨不忍睹。


    我看你也长得一副白面书生样，女孩怎么可能对你退避三舍呢？米奇难以置信问。


    就是会啊！我看她当时被我搭讪时，脸色那么难看，要不是还有女大生'
