    “当然担心啊！所以这也是有技巧的嘛！大部分的女生其实对红酒都不是很在行，我呢，更是个门外汉，所以早就决定即使要喝，也只要点最便宜的红酒就好。但又为了保持面子，一定要先假装给女生看过菜单，等对方说‘喝什么都行，交给你来点就好。’时，眼睛浏览到比较高级的红酒页，然后把侍者叫来。用手指着旁边澳洲或智利最便宜的红酒，这样就可以。”伟淳怕米奇听不懂，伸出双手作势看菜单点菜的样子。


