    「对我来说，这一切根本不是追不追得到乔伊斯的问题，而是我在这个带誉队和接触乔伊斯的过程中，有没有have fun。参与活动和追求女生一样，务必让自己在过程中得到乐趣。同时要尽全力提升自己各方面的实力，时间和精力都是有限的，投注下去，就要得到最大的回报。承佑停顿半晌，望了米奇一眼。


    再者，在每个时间点，身边的人物都扮演不同的角色。把握每个机会，在该享受时，尽情去享受友情与爱情，那才不枉此生啊。承佑寻求认同似的望著匡宇。


    米奇一改常态，陷入沉思，彷彿在咀嚼承佑的话语。


    「要知道，身边的场景和人物都有可能来去来去，所以一时的成败不代表什么。最重要的是，这些经验和感觉可以永远跟着我。有了这种体悟和实力，就算乔伊斯离开我，你觉得我难道不能找到下一个乔伊斯吗？」承佑带著似笑非笑的表情，笃定说出这句富有哲理的话。


    你行的，我相信你行！米奇羡慕看着承佑，如此说。


    一转头，米奇看到原本站在旁边仔细聆听的匡宇，眼角边的泪水，划过他微笑的嘴角，当下，让人分不清他对自己徒儿的成长，到底是感到欣慰，还是担忧。


    ## 第七章 即兴演出，速夺芳心—— Pianoboy 的浪漫攻略


    假装问问题搭讪法，也叫「故意问问题搭讪法」，简单而言就是，明知故问，目的是制造说话的机会。以当下场景来看，明明卖票处就在旁边，但匡宇还是偏要在剪票口附近问那位女孩，这就造成了可以相对方，合法说话的机会。只要女孩一回答，匡宇他们就更多的问题，可以接二连三问出来，之后，取得联络方式也就不是什么难事。


    「这【多变换场景】，其实也是一种心理学运用。人，特别是女人，对于环境的变化比较敏感，也需要比较多时间来适应。所以，约会时若能够运用一些借口，让女孩子多跑几个地方，就能自然加深她对你的依赖感，而依赖感正是催化好感的来源之一。这是我在教主的书上学来的。


    ### 明知故问、合法搭讪的幻术


    一早，匡宇就给米奇打了通电话，约他去看台北市政府承办的《国际花卉博览会》，简称《花博》。这花博之所以有名，是因为 2010 年底，在台北市市长选举时，它成为朝野政党选举议题上的攻防目标。当时竞选连任的台北市长郝龙斌，因为展出花卉的购买价格过高问题，被在野党议员轰得狗血淋头，民调呈现自由落体般下滑。


    没想到，在野议员疯狂打击花博，却等于变相为花博活动造势。展览正式开张后，好奇民众大量涌出，并被美丽的花卉、良好的展场规划所惊艳，反而对郝龙斌市长及团队大表赞许，后来他更顺利连任台北市市长。真是塞翁失马，焉知非福啊！


    想当初，如果米奇没被阉兵变，也不会辗转拜在教主的门下，成了他的，「入室弟子」之一。世事难料，再次验证了，「塞翁失马，焉知非福」这句千古名言的可信度。


    不过当然，匡宇约米奇去看花博，绝对不只是去欣赏美艳的花朵而已，而是「醉翁之意不在酒」：人家赏花他们赏「妹」。这种人多的方，根据大数法则，应该不少美女也会参加，凭借着他们的搭讪功力，自然能认识不错的

