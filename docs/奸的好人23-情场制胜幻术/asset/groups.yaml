    「米奇啊米奇，你难道还不明白吗？一个女生如果会那样对你，其实已经表明了她对你没什么兴趣，又何必强渡关山？这样搞得自己很累，对方不爽，又达不到你想要的结果，何必呢？」匡宇看见点出米奇的盲点。'
