    「哈哈，你这两个铁板还真结实啊！踢得脚很痛吧？不过那些都是很好的经验，让你知道，女生本来就是这么捉摸不定，无法用同一招以一贯彻之的。想用一招和一句话对付所有的女生，根本是痴心妄想。本来我们就该因人因时因地制宜，这样不仅是对那个女孩的尊重，也是培养属于两人独一无二爱情的方法。」匡宇又开始滔滔不绝讲起他的理论。


