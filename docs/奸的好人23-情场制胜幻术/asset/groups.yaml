    “没错！她当时的反应就是像你现在这样，眼睛瞪得大大难以置信！”伟淳接着说，“要嘛你转学，要嘛我换个学校教书。总之，我是不会让别人讲任何闲话的。这样子的回答，既让她心中对我留下一个正派的形象，又间接表示了
    我对她的兴趣。所以我说，要是你能够引导对话，制造情境的话，会 让你跟女生的亲密接触，容易许多。”彷佛对自己的演技、当时的表现和 权谋幻术非常满意，伟淳露出得意的笑容。


