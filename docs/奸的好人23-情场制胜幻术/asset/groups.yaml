    ### 发生关系是对好男人的保障？


    暌违多年，匡宇又要再次踏上美国加州的土地了。今年五月，他收到了当年在美国念书时，所认识最好的朋友韦恩的喜帖。等六月韩国弘益大学一放暑假，匡宇就要前往美国参加好友的婚礼。


    在厦门工作的米奇，从 Skype 上的闲聊中得知匡宇有去美国的计划，立刻嚷嚷着要匡宇带他一起去。匡宇本来不想带米奇一起出国，可是转念又想，多个人作伴也不错，而且可以趁机会介绍他认识……


    在洛杉矶机场下了机，匡宇熟门熟路，从租车行租了一台小轿车，载着米奇开开心心去找自己的舅舅和舅妈。舅舅一家热情款待两人，并清出一个房间给他们睡。


    待在加州的这几天，他们参加了韦恩的婚礼，还参观了洛杉矶几个有名的景点，如 Pasadena 老镇(The Old Town Pasadena)、水晶大教堂、当代美术馆，以及名人和美女聚集的
    Santa Monica 海滩。


    这天，在洛杉矶市中心 Kodak Center（柯达中心）附近的餐厅吃完晚饭，匡宇故作神秘对米奇说：“米奇，吃饱了吧？待会儿我要给你介绍一个人。”“谁？”米奇好奇地问。


    “一个老外。一个在台湾很有名的加拿大人。”匡宇还是继续装神秘。“加拿大人？谁啊？！”米奇更好奇了。


    “待会儿见到面你就知道了。”匡宇笑笑说。


    这时匡宇突然接到一通电话，并用流利的英语讲了几句话，介绍自己所在位置。挂上电话，匡宇对米奇说：“他五分钟后就到。”


    过了一会儿，一位身高看起来有两百公分高的白人男子推门走了进来。他的眼神异常冷酷，头上戴著一顶黑色牛仔帽，看起来既华丽又神秘。


    “Hi, Jacky, nice to see you again! (匡宇，真高兴又见到你！)”男子边说边给匡宇一个热情的拥抱。


    “Hi, Mystery, long time no see. (迷难，好久不见。)”


    “Nice to meet you. My name is Mitch. (很高兴认识你，我是米奇。)”米奇也顺势向 Mystery 介绍了自己。


    “其实我会说中文，我们用中文聊天就可以。”迷难转过身来，边握手，边用一口流利的中文对米奇说话。


    “哇！你中文怎么说得这么好？在哪里学的？”米奇简直不敢相信自己的耳朵。


    迷难对米奇微笑：“我小时候因为父亲工作的关系，在北京住到八岁，才回加拿大，大学毕业后又去上海工作了两年，顺便学习汉语。”


    “难怪！”米奇点点头。


    匡宇接着开口：“米奇，我今天找迷难来，是想由他来解答你一些关于追求和吸引的问题，算是给你一个惊喜。”


    “哇！师资阵容这么坚强，还有外籍讲师啊？我真是太感动了！”米奇感激之情溢于言表。


    “看样子，你好像不知道眼前的这个人是谁对吧？你记不记得，台湾前几年有一本很有名的书，叫《把妹达人》？”匡宇试着问米奇。


    “就是光头老外写的那本把妹书是吧？内容一整个神，不知道是不是真的？”米奇露出疑惑的神情。


    匡宇和迷难相视而笑，转过身来对米奇说：“我可以告诉你，都是真的。当你具备那种能力之后，就会知道你能做到哪些事。”


    “那么，那本书和眼前的迷难有什么关系？”米奇看来还是没搞清楚状况。


    那本书的作者型男，是眼前这位迷难兄的徒弟，型男所有的技巧几乎都是谜难一手调教出来的。台湾出《把妹达人》的大辣出版社，也同时出版了谜难的《把妹达人 2—谜难方法》。匡宇仿佛是沾了朋友的光，面有得意地介绍自己朋友的丰功伟业。


    “啊！难怪！难怪我觉得谜难这个名字很耳熟啊！原来今天见到大师了！”米奇马上把教主甩到一边，伸手紧紧握住谜难的手说：“幸会幸会！”“幸会幸会！”谜难也微笑回握米奇的手。


    匡宇接着说：“我今天找谜难来的目的，除了跟他叙旧之外，也是希望藉由他，帮助你除去一些根深蒂固的好人心态。匡宇转身问：‘谜难兄，OK 吧？’”“没问题啊！我在洛杉矶旅游时，Jacky
    你那么热情招待我，现在，回答你朋友几个问题，也是应该的。”谜难热情回答。


    “哈哈，谜难，大概是外国的月亮比较圆，我对这个好朋友讲了很多，都没什么用，他都不听我的。今天希望藉由你的力量，彻底拔除他的好人根！”匡宇补充。他是真心希望自己的好朋友米奇可以早日脱离苦海，脱离“好人帮”。


    “义不容辞。”谜难神色坚毅回答。接着专注望着米奇：“米奇兄，你发问吧！”米奇赶紧抓住这难得的机会问：“谜难啊，请问你和你徒弟型男在《把妹达人 1》跟《把妹达人
    2》里的故事，到底是不是真的啊？你们真的每次去夜店，都可以把女孩子带回家吗？”


    匡宇忍不住抢答了一次：“这个问题太简单，我来代答：都是真的！”谜难看着匡宇，微笑点点头，表达默许之意。


    “是不是台湾和美加的国情不同？我在台湾去夜店时，因为不会跳舞，每次都只能站在旁边喝干酒。是可以过去跟女孩子讲几句话啦，但是音乐太大声，讲起来好累，听不清楚，一下子就没下文了。你们到底是怎样做到能把女生带回家的？”米奇看来对这点特别疑惑。


    谜难调整了一下自己的高帽子，说：“首先，在夜店里，奇装异服很重要！你看我现在这身打扮，像不像艺人或表演者？”他指了指自己。


    把谜难从头打量到脚后，米奇大声回答：“像！”


    谜难点点头：“我这还是一般走在路上的行头。去夜店时，我打扮更夸张！我会穿金光闪闪的鞋子，戴上像魔术师一样的高帽，身上贴满装饰用的贴片。”为了怕米奇不信，谜难还拿出自己的
    iPhone 秀出自己在夜店时拍的照片。


    “Oh my God！太夸张了吧？女生不会觉得你很奇怪吗？”米奇又惊又奇。迷难正色说：“恰恰相反！在夜店里，我和你一样，也是一个不太会跳舞的人，长得又不帅，没有办法制造光环和舞台，于是只好用奇装异服来吸引女生的注意，这也是我在书里提到的【孔雀理论】。”


    说出来也许你不信，光是靠这身行头，就常有女生主动跟我说话，问我到底是做什么的！我搭讪也很少失败，这是夜店必备的标准战袍。我上次穿一件爱尔兰的格子裙，更是所向披靡，女孩子都很乐意过来跟我讲话。


    说到这里，迷难顿了顿，上下打量了米奇的服饰后说：


    “米奇，像你这身打扮，在夜店里就是个标准的 AFC（Average Frustrated Chump，拙男），毫无特色，等着被埋没在人群里吧！待会儿进夜店前，我先带你回我住的地方，帮你换装。”


    米奇兴奋说：“原来今天还有夜店的行程哦，我乐意之至啊！不过，奇装异服能在一开始吸引到女孩子的注意，是一回事，能否真正把女生带回家，又是另外一回事。你到底怎么做到的？我觉得台湾的女生比较保守，你的做法也许行不通哦！”虽然兴奋，但米奇不笨，他还是觉得，看迷难的样子，不可能是个百战百胜的常胜军。


    迷难点点头：“嗯，我在上海时也感受到这种差别。中国的女孩子是比保守一点，不像欧美女孩那么容易带回家。我想这其中有一个很根本的原因，就是所谓的【集体潜意识】。”


    集体潜意识是什么东西？米奇对迷难说出的这专有名词大惑不解。这是心理学大师荣格的观点。简单地说，每个人的潜意识深处都是共通、共有、共享的。也就是说，其实每个人潜意识，并不是只有我们自己能够决定，而是我们也会受到其他人的影响，不由自主地被集体潜意识能量主导……迷难试着对自己的理论加以解释。


    无奈米奇听了后还是搔搔头，问：“迷难，刚才这段话我真的听不太懂。”


