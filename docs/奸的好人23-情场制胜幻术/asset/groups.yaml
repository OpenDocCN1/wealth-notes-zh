    # 第四章 言语铺梗、制造框架大胆挪进、连结幻觉


    “哦，我们先吃饭，吃完饭喝了一瓶红酒，然后就开始舌吻……”伟淳吐吐舌头说。

    “你说什么？！舌吻？你们认识才多久就开始 kiss？”米奇简直不敢相信他的耳朵。

    “三个小时吧！”伟淳耸耸肩，一派轻松地回答。


    ### 认识三个小时即舌吻的幻术


    在米奇突飞猛进的这段时间里，匡宇除了一方面在大学应用外语系担任兼任助理教授外，也密集寻找出国工作的机会，因为环游世界是他自孩提时代便有的梦想。半年后，匡宇顺利申请到去韩国教授中文的工作。


    同时间，伟淳则申请到北京的艺术研究院，攻读博士学位。伟淳的导师对他照顾有加，不仅指导他的论文写作，还为了怕他生活费没有着落，特地把一个在杭州某大学教授现代舞的工作介绍给他。


    这三个从1997年青访团时代就认识的好兄弟，再次各奔东西。


    这年寒假，伟淳抽空回台湾，不仅是为了收集论文写作的资料，也想和久违的老友叙叙旧。刚好米奇也从厦门回台湾休假，他们相约去台北市立美术馆观赏高更画展，顺便一起去逛逛美术馆旁边的花博。


    对这两个会搭讪的男人来说，看高更画展和逛花博，除了能陶冶性情，增加艺术涵养之外，更是认识女生的最佳途径。他们知道，有鉴于女生最喜欢自然而然认识男生，路上的搭讪对女生来说，实在很难让她们跨越对搭讪的负面印象。


    可是，同样是搭讪，如果是在参加音乐会、演讲、画展，或者是在花博展览馆里，利用机会帮女生照相，再攀谈认识，却会让女生觉得是比较“自然”和“正常”的社交，而且，还容易透过这种方式找到同样喜欢艺术、具备文化气息的女生，可谓一举数得。


    去程的捷运上，米奇和伟淳讨论起彼此的近况。


    “伟淳，在 Skype 上听教主说，你在北京过得不错嘛！怎样，有没有交到女朋友？”米奇酸溜溜地问。他多么希望听到的答案是“NO”，可是以多年和伟淳的交情，他知道，伟淳的生活除了表演事业之外，在爱情方面通常也一样精彩。


    米奇：“我不太想刺激你，不过，我和教主一样，也交往了一个韩妹。”伟淳刻意用手遮著嘴，小声回答米奇。


    “什么？你们两个轮流欺负我就是了。你跟韩妹语言又不通，是怎么搭上的？”米奇瞪着大大的眼睛，简直不敢相信自己的耳朵，赶紧追问。


    “哎呀，你瞧不起我哦！我会英语嘛！刚好那个韩妹英语 OK，还会一点中文，讲话时再搭配一些比手划脚，沟通起来没问题啦。”伟淳露出他那“自以为”像梁朝伟的笑容，开心地说。


    青访团时期，伟淳英语驳到不行。不过肢体语言丰富的他，从来没有因为外语不好而自卑，而是“手口并用”。在某次由他母校举办的舞蹈国际学术研讨会上，他透过简单英语单词搭配肢体语言，比手划脚搭讪，居然认识了一个美国研究生珍妮弗。后来他们在台北光点附近的餐厅约会，走到旁边的小公园时，还热吻起来。由此可见，语言绝对不该是搭讪时的障碍，只要魅力吸引足够，绝对可以跨越语言能力不足的障碍。


    “你和她怎么认识的？”米奇很好奇。


    “有天我逛北京的国际美术展时，在韩国主题馆的某个摊位看到她。她是在美术馆介绍画作的工作人员。美术馆卖的画普普通通，但她长得真不错，于是我谨遵教主的指导，就想办法过去和她搭讪啰。”


    这样搭讪认识的女生，约得出来吗？米奇怀疑问。因为根据他的经验，搭讪时要到姓名电话已经不算什么了，要能够约得出来，真正成为朋友，最好是男女朋友，才算是真的成功。他为自己老是要到电话却约不出来，即使约出来也无法跟对方进一步成为男女朋友这件事情，懊恼不已，又苦无解决之道。


    “为什么约不出来？聊一聊知道她隔两天就要走，我赶快说：我要尽地主之谊，请她吃个饭，再到处走走。这样当然没问题啊！”伟淳那自以为是的态度，跟教主也有得拼。


    “那奇怪，为什么我认识的妹都一堆阿哩不达的借口，又是男朋友不准，又是大姨妈来了，再不然就是要准备功课或公司的 presentation……”米奇忍不住抱怨起来。


    “这有可能是你运气不好，她们真的有事，或者是你认识的女生不够多。最主要应该还是因为你一开始认识人家时，建立的吸引力不够……我帮教主回答你了，哈哈哈。”伟淳手插腰，用睥睨的眼神看着米奇，仿佛教主上身，开始说教起来。


    “马的，你不要学郑医字讲话！去，快告诉我，那你们第一次出去，干了什么？”米奇假装发怒问。


    “哦，我们先吃饭，吃完饭喝了一瓶红酒，然后就开始舌吻……”伟淳吐舌头说。


    “你说什么？！舌吻？你们认识才多久就开始 kiss？”米奇简直不敢相信他的耳朵。


    “三个小时吧！”伟淳耸耸肩，一派轻松回答。


    “三个小时？！你比教主还厉害了！快说，到底是怎么做到的？”


    ### 下爱情降头的四个步骤


    伟淳装得漫不经心，但为了怕自己的绝招外流，他还是小心环顾了一下四周，才小声告诉米奇：“其实也没什么啦！我不过就是运用了一些技巧，例如迅速转换场景、丢出幽默风趣话题、巧妙引导，还有不顾一切大胆挪扯罢了。”


    “拜托你一定要讲详细一点，这个部分是我最弱的。我真的不知道，把女生约出来后，怎样让她喜欢上我。每次都是认识时还可以，电话聊天时制造了一些高潮，但是一见面就迅速冷却，再之后就彻底破功，怎样也约不出来。快告诉我你是怎么办到的。”米奇露出哀求的表情。


    “我啊，就一开始见面时，先一起去吃饭。席间我们天南北随便聊，说说她的兴趣、我的兴趣、她的梦想和我的梦想。例如我告诉她我最想做的事情，就是从纯艺术和纯商业的表现形式中，创造出一条属于自己的道路，让商品可以结合艺术，既不会曲高和寡，又能够提高商品的品牌形象，最重要的是，我要改变艺术家就注定没钱饿死的既定印象和命运！”说到自己的梦想和人生规划，伟淳抬头挺胸，眼神露出一种自信光芒。


    “你那些梦想屁话我当然知道，重点是你讲你的和吸引她有什么关联？”米奇不屑地瞄了伟淳一眼。


    伟淳用严肃的表情响应米奇的不屑：“这你就有所不知了。讲我自己的梦想，除了可以让她知道，我是一个有理想有目标，又会付诸实现的人，营造出一种‘才子感’和女生要的‘安全感’之外，还可以顺势问她，对未来的计划是什么。两个分享彼此梦想的人，在情绪上很快就能制造某种程度的链接。”


    伟淳清了清喉咙继续说：“特别是，她现在正在念韩国庆熙大学的艺术研究所，我们算是同行，所以当然能有很多想法上的交流啰！包括对目前所学理论的困惑，和未来毕业后找工作时的迷茫。总之，有越多情绪上海的连结越好。”


    “这我知道。不过我每次讲到自己的梦想时，总是越讲越多，之后听对方说她的规划，甚至请教我的看法和意见时，不小心当真，把我对她人生规划愿景的意见全部说出来，最后的结果就是：我变成了一个咨询者、大哥哥和好朋友，但是亲密的举动轮不到我……”米奇讲到自己过去经验值太低，一个不小心就成了女生的咨询者和大哥哥的惨痛经验，后悔得椎胸顿足。


    “哈哈哈，很正常，好像大部分的男生，特别是读理工科还有善于分析的男生，都会勤于把自己真实的想法和意见告诉女生，却忘了女生需要的，往往不是解答而是过程中的陪伴、理解与情感连结。”


    ### 利用他人告白，连结情感共鸣


    “有道理耶！不过你又是怎么做到情感连结这个部分的？”米奇对伟淳的“功力”越来越感兴趣了。


    “这可以透过话题来引导。例如我之前不是有在大学教课吗？当时有个女学生，在我的面谈时间来办公室找我，我还以为她要问我一些课程方面问题，或者她想要考转学考，来请教我读书方法，结果都不是。她和我闲聊，后来问的问题越来越奇怪，包括什么我有没有女朋友啦？觉得班上的另一个女学生怎样啦？……”


    “结果她要跟你告白自足吗？”米奇以为伟淳在杭州大搞师生态，忍不住八卦，想继续问下去。


    “哈哈，应该是！但我根本没有给她这个机会，就把她赶走了。我一看她好像打算告白，于是立刻话锋一转说时候不早，你该回家了，而我也有明天的课程要准备，就这样把她打发走，连告白的机会都不给。”伟淳挥挥手，摆出当时叫女学生赶快离开办公室回家的手势。


    “这样做也没错！没有告白，就没有拒绝。毕竟你和那个女学生是师生关系，要是传出去了，对你身为人师的身份，以及未来长远的发展都不好。喜欢开玩笑归喜欢开玩笑，米奇对自己好朋友的意见还是非常正派中肯的。”


    “就是啊，我连和她说话时，都是把办公室大门敞开的。而且我好不容易才得到这个工作，怎么可能为了一个学生就放弃？”伟淳认同点点头。


    “那你也是跟那个韩妹这样讲，把事情的来龙去脉描述一遍吗？”


    “当然有经过一些修饰啰！我先描述这个情形，给她一个我是谨守分际的正人君子，不会利用师生关系趁人之危的正面形象，然后，就开始发动了。”


    伟淳想起当时的情景，露出神秘的笑容。


    “快说，到底怎么发动？”米奇急著问。


    > “我马上话锋一转，问这个韩妹劲珍说：‘有朋友告诉我，其实我那时能够这么镇定，又义正词严拒绝，是因为我对那女学生没兴趣啊！要是换成别人，搞不好就把持不住了。比如说这样好了，劲珍，要是今天换成你是那个女学生，搞不好我……’”伟淳当下马上试著用动作和表情，在米奇面前演出情境。


    “哇，高招！马上把别人的故事，套用在你和你想吸引的人身上。那她怎么说？”米奇翘起大拇指，惊讶又佩服看著伟淳，等著听他的后续。


    “这招虽好，但也不能做得太明显。为了避免打草惊蛇，吃紧弄破碗，我先立刻又丢出另外一个问题。我问劲珍：‘从小到大你有没有过过类似的问题？比如说喜欢自己的级任老师或代课老师……。’然后在她摇头之后再问：假设今天是你和我好了，你对我这位教你的老师有好感的话，会有所表示吗？还是只放在心里就好？”


    “你这样很厉害耶！这不只是一个问题而已，而是已经放在她喜欢你的这个假设和框架底下，真是太权谋了！她怎么回答？”米奇忍不住先赞赏一番再接著问。


    伟淳点点头，再一派轻松摇摇头说：“她的回答一点都不重要，我的铺垫才重要。等她一讲完她的回答，我马上接著说：‘那你知道，如果今天跟我告白的女学生是你，我会怎么回应吗？’”


    “哇，好扣人心弦，紧张刺激哦！你会怎么回应？”米奇眨眨眼，像个小女孩等爷爷说故事般，望著伟淳等他的下一句。


    你看，连你这个后来听故事的人都有反应了，何况是她这个陷在情境里的当事人？我看她很专注陷入我布下的情境里，便说：“嗯，我想啊，如果是你的话，我应该会要你转学！”伟淳把米奇当作是当时的韩妹劲珍，带着一
    点深情、专注又痛苦的表情，注视着米奇。


    “什么？！”米奇也适当玩起角色扮演，诧异看着伟淳，彷佛他就是韩妹劲珍一样。


    “没错！她当时的反应就是像你现在这样，眼睛瞪得大大难以置信！”伟淳接着说，“要嘛你转学，要嘛我换个学校教书。总之，我是不会让别人讲任何闲话的。这样子的回答，既让她心中对我留下一个正派的形象，又间接表示了
    我对她的兴趣。所以我说，要是你能够引导对话，制造情境的话，会 让你跟女生的亲密接触，容易许多。”彷佛对自己的演技、当时的表现和 权谋幻术非常满意，伟淳露出得意的笑容。


    “嗯，我大概了解你说的意思了。那后来的法式舌吻呢？又是如何办到的？”米奇老练记着的法式舌吻。他真的不懂，怎么可能认识一个人才 三个小时，就开始接吻，而且是含舌？


    即使是捕教界的天王高国华，事业有成又风趣多金，他和绯闻对象陈子璇（现在已升级为正宫夫人）也是认识好一阵子之后才喇舌，被《壹周刊》拍到。米奇真的很好奇，口袋空空，没钱穷酸的舞蹈王子伟淳，到底凭的是什么？


    “我们吃晚饭聊天时，就已经各喝了一杯啤酒了。酒精除了能够让人放松之外，还可以迅速和陌生人培养感情，是个不错的工具。”伟淳想起那天晚上的浪漫经过，意犹未尽。


    “这我知道。”米奇点点头：“不过上次我过到几个跟酒家女一样会喝的女生，差点没被搞死。还发功勒！我自己都快被歼灭了。”想起那时喝得酩酊大醉，不省人事，隔天继续呕吐又肠胃发炎的痛苦经验，米奇突然感到一阵思心。“对！尤其是韩妹！她们通常都很会喝，记得一定要让她多喝，你自己少喝。”


    “不过我遇到的这个韩妹酒量普通和正常人差不多。那天吃完饭后，我提议要不要再去喝一杯，她也答应了。注意，女生和你碰面，要是吃完饭后还愿意和你再跑一个方缧摊，那就表示有戏了。”


    “嗯，照道理说应该是这样没错。但也不能不小心，还有那种趁著跟你出来，一次吃光抹净，酒足饭饱，然后什么都不给你碰的女孩子，那你就亏人了。”米奇若有所思说。


    ### 请喝高价红酒的幻觉


    在大陆工作这么多年，米奇遇过的妖魔鬼怪也不算少了。他真的不懂，为什么有些女生跟他约会吃饭时，可以毫不掩饰摆出一副“你就是该付钱，谁叫你要追老娘的死样子？”


    最可怕的是，请她出来吃饭就算了，她竟然还带几个好姐妹一起出来？如果是因为对他有好感，带好姐妹出来帮忙评鉴一下自己的心上人也就罢了，可是一看那些女生吃饭的态度，就知道她们是专门来捞饭吃的。大陆的经济水平已经越来越好，这些成天吃不饱的女生到底哪里冒出来的啊？米奇简直是无语问苍天！


    “米奇，你说得好刻骨铭心的样子。这些年你真是辛苦了，老遇到一些占你便宜的妹。”伟淳猫哭耗“假慈悲说。”


    米奇叹了口气，说道：“好了，别说我了，我要听韩妹的故事。后来呢？”


    “我们找了一间还不错的酒馆，是有小包厢的。我们在包厢里隔着桌子坐下来，开始品尝红酒。”


    “等等！这又是一门学问了。说到红酒，在酒馆喝红酒不是很贵吗？你不会担心价钱哦？”自从上次遇到教主对他们谆谆告诫、耳提面命，一定要抠门才能省钱之后，平时已经比其他男生懂得省吃俭用的米奇，更注意自己的开销了。他和伟淳有时候会互相提醒，别把钱丢到水里，花在不该花的女生身上。所以他对伟淳这次人方的举动相当不解。


    “当然担心啊！所以这也是有技巧的嘛！大部分的女生其实对红酒都不是很在行，我呢，更是个门外汉，所以早就决定即使要喝，也只要点最便宜的红酒就好。但又为了保持面子，一定要先假装给女生看过菜单，等对方说‘喝什么都行，交给你来点就好。’时，眼睛浏览到比较高级的红酒页，然后把侍者叫来。用手指着旁边澳洲或智利最便宜的红酒，这样就可以。”伟淳怕米奇听不懂，伸出双手作势看菜单点菜的样子。


    “哎呀！高招啊！怎么我以前都没想到？这样可以节省好多时间，以及我为了不想花太多钱喝酒所费的脑筋。”米奇不禁双手一拍，大声叫好。


    “我这也是跟教主学的嘛！而且我赚得也不多，还在负债还卡费中，当 然要想出最省钱的方法。”伟滢面有得色。


    “然后呢？”


    “我就开始继续聊天，引导话题。对了，兄弟，我还说了你和Yoyo之间的故事。”伟滢故作心虚，用装可爱兼怕被骂的表情望着米奇。


    “什么？！你这个把我吃光抹净的家伙，跟教主有什么两样？他拿我的故事去出书赚钱，你拿我的故事来把妹，我真是倒了八辈子的霉才过到你们！”米奇用手指着伟滢，佯装大怒。


    “哎唷，息怒息怒。我现在要讲的方法，保证值回票价，你以后也可以用的啊！不过记得把主角的名字改一下。”伟滢赶忙拍拍米奇的肩膀，请他息怒。


    “废话，我当然会把主角的名字换成你！好，那你告诉我，你是怎么用我的故事把妹的？”


    “当时你和Yoyo不是看似很有进展，结果最后一事无成吗？我把你们认识之后的故事，包括去迪化夜街市吃宵夜时十指亲密紧扣，你回厦门前那晚送她回家，在她家附近的公园，你搭她的肩，她搂你的腰这些事，说给幼珍听，当作讨论现代两性相处的话题。接着问她：‘幼珍你说，要是你和一个男生牵手搂腰，不就代表应该是喜欢他，想和他在起吗？那为什么Yoyo后会说，当时只是气氛好，逢场作戏而已，她根本从没喜欢过米奇，只是把他当作一个朋友、大哥哥，一个不好意思拒绝的朋友呢？’”


    米奇看着伟滢叹“口气说：‘妈啊，兄弟啊，你会不会描述得太清楚啊？描述得这么清楚，对你有什么好处？’”说完米奇忍不住又摇摇头。


    “好处可多了！我描述你的故事时，除‘要她设身处地想一想，把自己当成Yoyo，把我当成你，营造出恋爱约会的感觉之外，有时候还故意表现得似乎只用语言描述你们的故事还不够清楚，而要她和我原景重现、角色扮演。偶尔她演Yoyo，我演你，或者掉过来，她演你，我演YoVo，这么一来不就有
    很多肢体上的接触和互动吗？例如叫她演YoVo，搂我的腰，我演你，搭她的肩膀……目的就是为了让她习惯我的触碰，为我们之后的舌吻铺路。”伟滢不 疾不徐，交代他那些动作背后的理由。


    ### 肢体接触进退的法则


    “马的，我都只有牵牵手搂搂腰而已，为什么你就有法式舌吻？你还做了 什么？”米奇愤愤不平说。


    这也是有技巧的。当时我描述故事、角色扮演、肢体接触时，其实也不是一直黏着她，而是牵一下之后放开，坐到她旁边演完一小段后，再坐回对自己的位子，来来回回，可忙的勒。伟婷停顿一下后接着说：“这都是为了营造我不是故意吃她豆腐的形象，并且测试她对我肢体接触的接受度，所作出的暖身准备。”


    “那你能和她舌吻的最后一击，又是怎么打出来的？”


    “哈哈，我用台韩关系来铺梗，营造出一个她和我不得不接吻的情境。”伟婷笑得合不拢嘴说。


