    \n### 把妹太急，狗都不如！\n\n2 0 0 8年，台北东区一个宁静的午后，金色阳光洒在笔直的忠孝东路上，强烈的反光让人睁不开眼睛。不过，同样在忠孝东路上，还有同样光彩夺目，让\
