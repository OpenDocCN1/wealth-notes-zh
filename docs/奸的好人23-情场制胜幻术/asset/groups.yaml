    “你这样很厉害耶！这不只是一个问题而已，而是已经放在她喜欢你的这个假设和框架底下，真是太权谋了！她怎么回答？”米奇忍不住先赞赏一番再接著问。


    伟淳点点头，再一派轻松摇摇头说：“她的回答一点都不重要，我的铺垫才重要。等她一讲完她的回答，我马上接著说：‘那你知道，如果今天跟我告白的女学生是你，我会怎么回应吗？’”


