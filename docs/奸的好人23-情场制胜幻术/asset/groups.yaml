    「还用我说吗？你听我刚才说话的口气，就已经知道内容了吧！妈的，都好说歹说，连叫她把男朋友也可以一起带出来这种屁话都用上了，还不跟我见面到底是要怎样？搭讪认识的，就注定约不出来是吗？」


    米奇的口气越来越激动，眼中似乎要射出两把小李飞刀，断送那个「男朋友」的狗命。


    「哎唷，也不是啦，妹总有妹的考虑嘛！也许她男朋友管得很严啊！说不定她男友刚好就在她身边呢，当然只好拒绝你了！」伟淳赶紧试着安抚米奇，虽然他早已习惯米奇的碎碎念和对台妹的愤怒了。


    「我不准你帮妹讲话！到底你是站在我这边，还是站在妹那边？」米奇把没办法发泄在那个女孩身上的怒气，转嫁到坐在自身身旁的好友身上。


    「好啦，兄弟，我当然是站在你这边啰！不过我看你这几年，哦不，最近，好像在女孩子这方面都不太顺利耶，要不要我帮你找个高手，辅导一下？」伟淳明知故问，俏皮了一下。


    正当伟淳想继续说下去时，突然听到“铃铃铃”的电话声响起，原来是米奇的 iPhone 铃声，来电显示是他原本约好晚上一起吃饭的容容。


    容容不是别人，正是前一阵子在媒体上被炒得火热，和台大五姬拼得你死我活，难分轩轾的政大四妹其中一员。由于具有混血儿血统，她身高一米七，拥有灵活的大眼睛，搭配棕色卷发，可谓天使的面孔魔鬼的身材。自从去年，伟淳带着米奇混进
    Dunhill 举办的香烟新品发表活动上搭讪认识容容后，米奇就一直对她念念不忘，也一直试着邀约，不过容容就是“没空”。


    这次米奇放假，从厦门工厂回来台湾之前，特别花了一个月的时间，密集用 MSN 和电话对容容嘘寒问暖营造铺垫，目的就是希望在短短的几天回台假期里，能和容容能见上一面。他一直相信，包括容容在内大部分女孩子只是没有机会和他多接触、多了解，所以才不知道他的好；要是能坐下来，好好和他聊上一两个小时，一定会对他抱持高度兴趣让两人的关系往“更好”的地方迈进。


