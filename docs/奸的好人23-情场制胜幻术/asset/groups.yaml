    原来，伟淳虽然对女孩子的身材也是「专注完美，近乎苛求」，但他更重视的是自身的安全！他自诩「舞蹈王子」，可不是嘴巴说说而已，而是真的用王子的规格来看待自己。平时手不提重物，脚不能走太久，只因为他觉得，他的手要用在跳芭蕾时举起女主角，脚也是在空中跳跃旋转时才应该使劲，用来走路实在是一种精力上的浪费。


    而在龙蛇混杂的夜店搭讪，因为搞不清楚对方的身份，谁知会不会踩到地雷，被不理智的男朋友跳出来毒打一顿？伟淳的搭讪功力是匡宇教出来的，所以特别重视自身的安全，更知道，即使自己搭讪对方时诚恳有礼貌，但女生的男朋友或男性朋友可不见得那么有礼貌，还是小心为上。


    他又何尝不喜欢那双白净纤细的腿啊！不过留得青山在，不，没没柴烧。白小腿，换个人就有了，自己的命，可是丢掉一次就再也不能重来。明白这一点的伟淳，跟着匡宇和米奇，满心期待走进了诚品书店。


    三人在书店晃啊晃的。匡宇老神在在、自得其乐，看起两性方面的书籍，作为他下次写作题材的参考。他还特留意刘墉老师和戴晨志老师的励志书，因为他计划写一本与众不同的励志作品，里用的全部是他自己的故事，当作激励读者的强心针。书名也很另类，打算叫做《你就是自己的激励达人—搭讪前，先搞定人生》。


    于是，他在书店里看书的时间，要比看妹多得多。除了这是目前工作需要之外，他太清楚一个铁的事实：一个男人越是专注本业，就越能吸引女孩子的目光；一个男人越是想追着女生跑，女生就越离他离得远远的。


    米奇和伟淳在书店里走来走去，算算将近一个小时过去了，运气很背，居然没有一个符合标准的女孩出现。当米奇正准备再接再厉，继续「找」下去时，平时习惯十二点准时上床睡觉的匡宇，过来拍了拍他的肩头说：「兄弟，时候不早，十一点了，该回家睡觉了！」伟淳也打了一个呵欠，示意米奇听匡宇的话，回家睡觉吧。拗不过两人，米奇只好心不甘情不愿跟他们走。为了安抚米奇，匡宇陪笑说：


    「哎呀，你不要那副不情不愿的样子嘛！走走走，我们现在赶快去坐捷运，说不定还会遇到刚才那位站在夜店前的茭白笋长腿妹啊！要是再遇到她，我就帮你搭讪认识一下，好吧？」


    米奇喜出望外，满心期待的点点头，跟着匡宇和伟淳快步走向捷运忠孝敦化站。三人再次经过那间夜店的门口，哇！乖乖不得了，这时间已经快十一点半了，正是最多型男潮女们准备涌入夜店的时刻。动感音乐隔着夜店的大门传出来，米奇驿动的心也跟着扑通扑通狂跳起来。


    他看到几个操着流利英语，可以把 R 发音准确的 ABC 女孩，聚在门口聊天，也看到几个穿着比较清凉，但格调有点 low，嘴巴还咀嚼着口香糖的本土台妹。他真想不顾一切上前搭讪，能认识几个算几个。


    无奈，那些女孩的身边都有一群男生围着，而且一看就不好惹。围着那些 ABC 女孩的，是一群练得跟蛮牛一样壮的 ABC 男孩。而本土台妹们身边的男生，则像是水平不高的小太保。连平常安全神经不是很敏感的米奇都感觉得出来，若是随便过去搭讪，下场大概不会太好！


    正当米奇绞尽脑汁，希望能想出一个两全其美的搭讪方法时，一旁的匡宇又是一个呵欠，并说：「哦，那些女生看来还不错，但其实没有很优耶！没有必要为了她们，冒着引起冲突的危险。我看，今晚我们还是早点回家吧。」


    一旁的伟淳也点头同意，明天他还有一个舞蹈的学术研讨会要参加，能早点回家，他可是举双手赞成。


    米奇看看匡宇，又看看伟淳，这两个一副事不关己的朋友，明知道他大老远从厦门回来，就是想要多认识几位美丽有智慧的台妹，他两人却仗着自己机会多多（匡宇在韩国韩妹，伟淳在北京有北京妹），一副满不在乎，自己爽却忘了朋友的样子，只径自赶着回家睡觉。米奇越想越难过，一时不禁悲从中来，仰天大喊：


    「你们都骗我！」


    他的身体随着惨叫身，「趴」地一声顺势跪倒在捷运入口处楼梯边，这戏剧性的动作，引来旁人一阵侧目。匡宇和伟淳被米奇这突如其来的举动吓到，一阵错愕之后，便大声笑了出来。他们知道，米奇这时最需要的，就是这种短暂的发泄，过一会儿就好了。毕竟，硬去搭讪几个不适宜的，最后还不是没有搞头？米奇自己也清楚这一点，于是发泄完自己的不满后，继续嘟着嘴，站起身来，乖乖跟两人踏上了回家的路程。


    ## 没有完美一招，更没有完美女孩


    米奇在捷运站闹了一下后，心情也渐渐平复下来。满脸无奈的米奇坐在回淡水八里的捷运车厢里，抬头看到近期上档的好莱坞爱情喜剧片《爱情药不药》广告，突然想到一个困惑许久的问题，忍不住问匡宇：


    「教主，好莱坞电影我看过不少，当然日本的【爱情动作片】也略有浏览。我知道，想和女生发展亲密关系，只要能接吻，下一步就是把手放在她胸部上，解开她的胭脂扣，再往下移……可是一开始怎么牵手、怎么接吻，我就是搞不懂。」米奇歪着头问。


    匡宇点点头：「嗯，很好，至少你的好莱坞电影不是白看的，男主角教的都看进去了……」


    「可是那是电影啊！女主角都马很配合，一被男主角挑逗就热情如火，反过来饿虎扑羊，但我遇到的实际情形，根本就不是这样啊！」米奇有点沉不住气的说。


    他越讲，奇蒙子越不爽：「上次那个台大戏剧妹，看电影时泪流满面，我想借机把她搂入怀里，安慰她，结果被她使出金钟罩铁布衫给震开；另外一个政大女生，两次约会都相谈甚欢，但我伸手准备搂她肩膀过马路时，她居然用凌波微步躲开，还脸色大变，说她不喜欢这样的举动，太暧昧！我就是要跟她暧昧，才做这些动作啊！她这样一讲，我的把戏还怎么玩下去啊？」


    「哈哈，你这两个铁板还真结实啊！踢得脚很痛吧？不过那些都是很好的经验，让你知道，女生本来就是这么捉摸不定，无法用同一招以一贯彻之的。想用一招和一句话对付所有的女生，根本是痴心妄想。本来我们就该因人因时因地制宜，这样不仅是对那个女孩的尊重，也是培养属于两人独一无二爱情的方法。」匡宇又开始滔滔不绝讲起他的理论。


    「那教主你说，要是女生手不给你牵，或者直接说，她不喜欢你的任何肢体触碰，该怎么办？」米奇皱着眉头，撇着嘴。


    「米奇啊米奇，你难道还不明白吗？一个女生如果会那样对你，其实已经表明了她对你没什么兴趣，又何必强渡关山？这样搞得自己很累，对方不爽，又达不到你想要的结果，何必呢？」匡宇看见点出米奇的盲点。


    匡宇又说：「同样的情形，要是那女生有点喜欢你，只是不想和你发展得那么快时，绝不可能那样反应过度，而是会等你牵个几秒钟后，再慢慢把手抽开。」或者她不会严词拒绝你，反而是笑笑说：我的手只给男朋友牵哦！类似像这样的响应，都表示你还有机会，只要继续努力就好。但像他描游的那些情形，我以多年兄弟的情谊当后盾告诉你：没搞头，换人吧！」


    匡宇说完，后对自己的结论满意极了，伟淳在旁边也附和了点了点头。此刻，米苛的理性思维已经接受匡宇的论点，但还是忍不住说出心里的呐喊：但是我不甘心啊！


    「好一句我不甘心！」匡宇赞许点点头，话锋一转又说：兄弟，不甘心的情绪，可以是让自己坚持到底，更上一层楼的助力，也可以是让人陷入忧郁症和精神分离的毒药，端看你用在什么事情上面，以及怎么用！


    「教主的意思是，在追求女生这方面，怀着不甘心的心态，不一定是好事？米苛似懂非懂。」


    好像开窍了哦，呵呵。没错，承认自己魅力不够，或者对眼前这个女生没有吸引力，并不是一件坏事。要是凭良心自我审核后，发现自己真的缺乏魅力，就去加强；要是对自己喜欢的这个女生来说吸引力不够，就试着培养出她欣赏的部分，或者换个对象。这样都比你不甘心、钻牛角尖要来的好。匡宇一股脑把自己这些年来的经验和体悟，毫不保留都说了出来。说这些理论时，匡宇还不由自主想起了电影《海角七号》的导演魏德圣。魏德圣从事电影编剧和导演的工作已将近十五个年头了，这十五年来，谁听过魏德圣这个名字？他也曾穷困潦倒，也曾怀疑过自己的能力和梦想。当他成功推出《海角七号》，并一举打破国片卖座纪录，创下七亿票房的极佳收益后，某次接受记者采访，问到成功的关键，只见他咬牙切齿说出三个字：「我不甘心！」


    他说他不甘心，自己努力这么多年，却即将因为筹不到钱而没办法拍完电影；他不甘心，只因为台湾市场既小、又不够鼓励文化创意产业，自己的才华就要被抹杀。


    套一句剧中男主角阿嘉大声说出的话：「我明明不差啊！为什么只是现在这样！」魏导演觉得自己不差，凭什么不能出头天？于是他用上自己的所有积蓄和房子去抵押，换取拍片的资金，誓言一定要用自己的电影走出一片天。他的不甘心，后来也获得了极大的成功！


    不过匡宇打从心底认为，这种针对事业和梦想的不甘心，是不适用于追女孩的。毕竟女孩子不是事，也不是物，没有「撑得够久就是你的」或「好人一定有好报」这种因果循环，能保障最后的成功。因此，搞清楚自己在追求的到底是什么，便显得格外重要。


    米奇苦涩摇摇头：这些道理我懂归懂，但是要克服心魔好难！


    记住，想要成为一个所谓的情圣，认识自己、了解自己的长处和短处，是非常重要的。你以为我没遇过你提到的那些情形吗？匡宇正色道。


    「怎么没听教主你说过呢？」米奇语调惊讶反问。


    匡宇挑起眉毛：「难不成我要把所有经历，一五一十向米奇哥你禀报吗？回来正题，我和你不同的地方是：我追求的，从来就不是任何一个单一特定的女生，而是符合我要的外貌和人格特质，最重要的是，能和我两情相悦的人。这种态度，和你所追求的东西不同点在哪里，你发现了吧？」


    你的意思是：对你而言，没有任何一个女生是完美了或了不起的，任何人都是可以被替代的，对吗？米奇似懂非懂回答。


    匡宇点点头：差不多。虽然不是百分之百正确，但你现在能把握到这个层次，对你的帮助已经很大了。从这样的角度出发，想想那两个女生对你伸出咸猪手时的反应，再给你一次机会的话，你会怎么回应？


    「呃……我想，对用金钟罩铁布衫把我的手震开的台大学妹，我应该会装作什么事情都没发生，继续看电影；至于那个叫我不要和她肢体接触，说她不喜欢暧昧的人，我大概会说：哦，我也不想暧昧，我只牵我喜欢的手，会成为我女朋友的女生的手，然后看她的反应！」米奇搔搔自己的头说。


    匡宇忍不住拍手对米奇说：太好了！You Got It! 最重要的是，米奇你应该知道，即使讲出那些看似厉害的话，也只能当成嘴皮子要一要罢了。因为那个女生对你的基本印象和防卫心已经定型，很难用几句话就翻盘，但是，你的态度至少让你不输。而且最重要的是，你会把她放在一边，去认识其他女孩吧？


    谨遵教主指示！米奇双手作揖，把匡宇当成自己的老师来行礼。


    ## 第八章 情场胜将，是这样当的


    ### 制造为爱牺牲的幻觉


    为了怕捷运上其他的人听到他们的秘密对谈，匡宇边说边刻意压低音量：这样吧！既然你这么想知道如何跟女生更进一步，我就再告诉你几个不错的幻术。我之前不是提过，和女生约会时一定要有吊引对话题，让她和你一起陷入你设计的情境，把你当成男主角，自己是女主角吗？有时候，如果能够利用女孩子自己讲出来的话，或者利用外在突发状况，临机应变，将它们扭转到对自己最有利的态势，效果更佳。


    教主你讲得好玄，我听不太懂，能不能举个例⼦？米奇侧⾝靠近想听个清楚，原本翻看报纸的伟淳也放下报纸，准备专心聆听。


    匡宇看两人都准备好了，继续说：，好吧！你记得我的某位前韩国女友 Lena 吧？我和她顺利牵手之后，就一直想找机会再进⼀步，往亲吻的方向迈进，不过却⼀直苦⽆机会。


    对，我也是！牵手也许还可以，但是要⼏⼾和⼥生接吻？这实在让我很头⼤。我也知道，能接吻就能上三垒，能上三垒应该就能奔回本垒……由于说话内容太过情色，米奇⾳量压得更低。


    彼此第⼀次接吻，对⼥⽣来说是很重要的。她们都喜欢浪漫，⼀定要想办法尽量符合她们这个需求，否则你不但亲不到，她还会觉得你只是个朋友，接着慢慢疏远你，到最后完全不联络。匡宇接着说。


    米奇⾯有难⾊：伤痛的回⼜又浮现在我脑海中了，stop，回来说你和 Lena 吧！


    我当时⼀直在⽬⼤，到底有什么机会，可以让我和她从牵手进⼀步发展到接吻？有次机会终于来了。


    那天，匡宇和 Lena 去看电影，排队买票后等⼊场时，突然出现⼏个⾼中⼥⽣，在旁边吃爆⽶花，Lena ⼀直盯着她们爆⽶花看。


    匡宇问她：「你想吃哦？要我帮你买⼀份吗？」讲违这段经历的匡宇，⼀故弄疑阵问米奇：「结果你猜 Lena 怎么回答？」啊，不就是想吃爆⽶花，叫你去买给她吗？米奇眨眨眼睛。


    那时，Lena 鬼灵精怪转转眼珠⼦说：「嗯，但我不想吃⼀⼤包爆⽶花，我想吃……」


    米奇沉不住气道：「教主，拜托你不要一直卖关子啦。」


    Lena 指着不远处的那个女高中生。我想吃她的爆米花，可以吗？


    「这不是强人所难吗？」米奇惊讶问。


    「我当时也面露难色。但同时我又在心中想，到底怎么做，可以把这个她对我的玩笑和考验，转化成让我和她的关系更进一步的契机呢？结果给我想到了。」匡宇露出慧黠的笑容，边说边看着米奇和伟淳。


    「你怎么做？」米奇和伟淳同声问。


    当时匡宇说：「要吃那个高中生手上的爆米花可以，我去帮你向她要，不过你要给我什么奖励？」


    Lena 回答：「呵呵，真的吗？你可以拿到，就随便你怎么说怎么办吧！」匡宇打蛇随棍上说：「那你让我亲一下当作是回报口巴！」


    趁她羞红着脸，还没回答时，匡宇走向那群高中生，用蹩脚的韩语告诉她们：他的女朋友想吃她们手中的爆米花，拜托给他一小把，好让他回去交差，请她们务必帮这个忙。


    听到这，米奇羡慕说：「哇，你真有勇气！」


    这算什么勇气？这样的小忙，很多人都愿意帮的，而且就算失败，顶多就是丢个小脸而已，谁会记得我？不过，当我捧着手中的爆米花回去 Lena 身边时，我发现，她看我的眼神都不太一样了。匡宇得意说。


    「怎么不一样法？」米奇和伟淳好奇问。


    你也知道，女生最喜欢的，就是自己欣赏的男生，为她去做一些他原本不太愿意做的事。我这样的举动，等于向她证明她对我的重要性，我愿意冒着被人拒绝和嘲笑的风险，去帮她要爆米花。这让我在她心目中，又加分不少。匡宇的笑容更灿烂了。


    「哈哈哈哈哈，她真不了解你！你这么厚脸皮，不要说爆米花了，什么下跪吃屎，再丢自尊的事情你都做得出来。」米奇忍不住吐槽匡宇。


