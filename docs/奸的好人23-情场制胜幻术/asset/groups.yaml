    这点我和教主也讨论过。我们的结论是，其实像我们这些所谓的高手，都是像魔术师一样的人。在女生面前，我们可以发功，施展我们的技巧，让女生陷入一种正在谈恋爱，或者眼前男生就是自己真命天子的感觉。

