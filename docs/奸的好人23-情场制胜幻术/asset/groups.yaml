    “所以我不是说了吗？你自己的故事，其实就是最好的把妹工具，不过男主角要换一下。不然你用我的名字也可以。”


    “当然，我一定用你的名字，再不然也用教主的！哼！对了，那后来你就带她回家，奔回本垒吗？”


    “哦，不她隔天还要赶飞机回韩国，我就先送她去坐出租车回饭店了。”伟淏悠悠地说。


    “怎么不乘胜追击？”


    “不必啦！我是走自然流，能发展到哪个地步，就发展到哪个地步——一点都不强求。你们后来还有联络吗？”


