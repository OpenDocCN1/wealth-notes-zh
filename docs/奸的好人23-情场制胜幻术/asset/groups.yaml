    「有啦！你这么一说，我想起来了。那个时候我在学校担任国乐社的指挥，又刚参加完青访团，从欧洲回来算是学校的风云人物，之后还跑去当毕业生联合会的主席，那时的女朋友就是这样认识的。」美好的回忆附上心头，米奇不禁露出满意的笑容。


    「你看吧！有舞台的话，吸引女生根本就不是问题。」匡宇坚定说。


    「是啊，问题是那时候是学生时代啊！老兄，我现在在厦门的工厂当主管好不好！哪来的优质女生啊？我又哪来的机会，创造属于自己的舞台？」米奇的微笑瞬间冻结，恶劣环境逼他从美好的回忆里返回现实世界，他抗议似表达他的不满。


    「你平时不是会参加一些台商联谊会举办的活动吗？有唱 KTV 的活动，也有听一些名人演讲的活动。你歌声不错，可以好好表现，听演讲时也可以准备几个好问题，在结束时问演讲者，这样，不就可以吸引同来参加活动的其他女生的注意了吗？」匡宇再试著给米奇建议。


