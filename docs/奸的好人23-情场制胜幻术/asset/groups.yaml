    说到创造对自己有利的舞台，简单来说，就是偏要让你心仪的她，看到你的优势。假设你歌唱的好，就多去参加歌唱比赛，篮球打得好，就多在职场上打球，这样就能吸引走过球场女生的目光，说不定你看上的她也刚好看到你，这样你过去和她说话时，成功机率就高。］


