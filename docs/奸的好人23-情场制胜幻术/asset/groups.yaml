    # 第七章 即兴演出，速夺芳心——Pianoboy 的浪漫攻略


    匡宇还告诉米奇，他约了一个绰号叫「钢琴王子（Pianoboy）」的读者一起来。他是某次搭捷运时，在车上认出匡宇，主动前来搭讪认识的读者粉丝。据匡宇的说法，Pianoboy
    本来的条件就不错，又会读书又从事钢琴曲的音乐创作，作品还被知名部落格网站无名小站收录为背景音乐，供会员们使用。这种本身基础点就不错的男生，学会了搭讪之后，更是如虎添翼。米奇心想：这样的三人组合，应该能够收获颇丰吧！？


    米奇和匡宇先在石牌站碰面，一起前往圆山捷运站跟 Pianoboy 会合。刚出圆山站，米奇便看到一位中等身材、长相清秀，高中生模样的男孩，向他们热情挥手。当
    Pianoboy 知道匡宇身旁的竟然是米奇，开心的说：


    「米奇哥，你好啊！真是久闻不如见面。」


    「久闻不如见面？为什么久闻？」米奇伸出手和 Pianoboy 相握，好奇问。「是啊，只要是匡宇哥的读者，都知道您米奇哥的大名啊！」Pianoboy 再次露出那诚恳爽朗的笑容。


    「去！我一早心情本来很好的，你这样一讲，害我一肚子大便哦！」米奇假装生气挥挥手。


    Pianoboy 又是一阵大笑：「哈哈，你果然就像匡宇哥书里写得那样，非常有趣。」


    「哼，我才不要有趣呢！好好一个玉树临风的帅哥，被匡宇写成那样，真讨厌。」米奇继续装不爽。


    「一点都不讨厌。您都不知道，您的故事，也正是我们许多读者的故事，我很感激匡宇哥举出那么生动的例子，一方面对我自己犯下的过错有疗伤作用，一方面也避免了未来可能的错误。」看来，Pianoboy
    对匡宇是既佩服又感激。


    「你这样一讲，才让我觉得好过一点，毕竟我一个人的牺牲，换来了许多人逃过阿鼻地狱的折磨。啊，你看那边！」米奇原本和 Pianoboy、匡宇讲话讲得好好的，忽然指着九点钟方向，要同行的两人注意。


    匡宇和 Pianoboy 往米奇所指的方向望去，只见一个身材高挑的美女，穿着花博工作人员制服，笑容可掬地在入口处招呼进场的游客。她又高又瘦而且皮肤很白，一看就是米奇的菜。三人相互使了个眼色，准备各自就位攻击，进行完美搭讪。


    匡宇不愧是搭讪教主，二话不说，一个箭步上前，使出「假装问问题法」，先问这个女孩：「请问花博的票应该在哪里买？」


    这种「假装问问题搭讪法」，也叫「故意问问题搭讪法」，简单而言就是「明知故问」，目的是制造说话的机会。以当下场景来看，明明买票处就在旁边，但匡宇还是偏要在剪票口附近问那位女孩，这就造成了可以和对方「合法说话」的机会。只要女孩一回答，匡宇他们就有更多的问题，可以接二连三问出来，之后，取得联络方式也就不是什么难事了。


    果然，单纯可爱的女孩亲切指引他们哪里买票之后，米奇和 Piano boy 接二连三又丢出一些问题，像：「你是花博的义工吗？还是学生打工？」，「这种工作好棒，要怎么申请啊？」，「每天要接待这么多人，一定很辛苦吧？」女孩因为是工作人员，本就应该态度亲切回答游客的问题，如果游客也大方有趣，自然就能相谈甚欢。


    米奇特别注意到，Piano boy 搭讪对方时，虽然好像是问女生问题，例如：「请问你是学生来打工的吗？」，但他其实根本不需要、或不在乎女生的回答是什么，甚至对方有没有正面回答都没关系。他的问题好像假问题一样，只是一个说话的引子。他往往不必等对方的回答就能接话，延伸更多的问题，或者顺势把关于自己的讯息丢出去，换得更多的问题。他印象最深刻的，是
    Piano boy 和女孩的几句话：


    「你是学生打工，还是正经在这边帮忙啊？」


    「哦，我们这些工作人员，有些是临时工，有些是义工。因为我妈妈的朋友是台北市政府的义工，问我暑假想不想来花博学一学，我就来了。」


    「嗯，你这样挺好的。我平时在学校教书时，也都会告诉我的学生，放假时不要成天无所事事在家鬼混，或和朋友出去玩乐，不管去打工或者当义工都好，可以学习一些社会经验，以及团队工作的能力。」


    「哦，你是老师啊？在哪里教书呢？」


    「我在东山高中。东山高中你知道吗？在新店的那个。」


    「我知道啊！我家也住新店。」


    「真巧！我家在新店的大台北华城。原来我们是邻居啊！那下次可以一起出来玩。你知道在新店捷运站附近，有个店叫一碗小羊羔的吧？是一家很好吃的店。」


    「哈哈，当然知道啊，我常去吃呢。」


    「好啊，那下次约一约，可以一起去吃。对了，旁边这位是匡宇，还有这位是米奇，我叫 Pianoboy，你呢？」


    「我叫小怡。」


    「嗯，小怡，好名字，我们交换电话吧？你把电话号码告诉我，我直接拨过去，这样你就有我的号码了。」


    「好，我的号码是 0930418XXX。」


    就这样，电话号码顺利到手。


    米奇分析了一下，发现 Pianoboy 一开始搭讪时，虽然问对方是不是学生打工，但实际上却藉由那个问题，丢给对方「他在高中教书，是个老师」这样的讯息，毕竟一般人对老师这个身份都有一种亲近感、安全感。又，他藉由丢出自己在新店那里教书的讯息，引出对方也住在新店这个「共同信息」，顺利做出「我们是邻居」这种缘和关系上的连结，把原本完全不识的陌生人搭讪，弄得好像天涯若比邻，大家是邻居，本来就该认识一样。不愧是匡宇的好粉丝、好读者。


    米奇看到 Pianoboy 顺利收到女生的姓名电话后，对他投以赞许的眼神，说：


    「嗯，Pianoboy，刚才看你搭讪的样子，真的已把教主的精髓全部都消化吸收了，真有你的。」


    「哈哈，您过奖了，其实这真的没有什么啦！搭讪最难的，还是开口那第一句，这部分还是匡宇哥比较强。你看我们刚看到小怡，还在互使眼色时，匡宇哥已经奋不顾身一个箭步上去了。这种连思考都不必思考就能搭讪的能力，我还是望尘莫及呢！」Pianoboy
    对匡宇翘起大拇指。


    「你就别夸他了，再夸他，他屁股就要翘到头上去了。」米奇一脸不屑。


    「好啦，你们别再瞎闹了，还是快点进场吧。我今天是要赏花，不是来看你们一鸣一和的。」匡宇装作不耐烦的嘀咕。


    ### 如何败部复活？


    三人进入了花博会场，觉得眼前的景象真是美不胜收，心想所谓「台湾的软实力」，或许就是透过所谓花博这样的活动，才能让世界看见。听说这次台湾花博会的经费，与他国主办的花博比起来，是历届最少的。但台北市政府和参展的团体，运用高超的花卉技术和精益求精的巧思，把仅有的资源做最有效的发挥和利用，造就了这次花博的成功。三人走向其中最著名的「未来馆」在排队时，米奇又忍不住问
    Pianoboy：


    「对了，我顺便还要问你一个问题，就是像小怜这种在路上搭讪认识的女生，其实我也认识过不少个，但很多都不跟我出来约会。这种搭讪，说到头来还是一种失败。我想问的是，你觉得这种原本失败的搭讪，有没有可能败部复活啊？一个女生要是刚开始对你印象不好，还有可能成为你的女朋友吗？」这是困扰了米奇许久的问题，趁着这次机会，米奇一定要问个明白。


    「有是有，不过老实跟大哥报告，机会很低，我也只有过一次经验而已。」Pianoboy 老实回答米奇。


    「那么来分享一下，你那一次是怎么扭转乾坤的吧！」米奇精神抖擞，打算吸取 Pianoboy 的经验，作为他下次再战时的参考。


    只见 Pianoboy 一阵沉思之后，摇头晃脑说：「我觉得啊，大原则其实只有两个，一个就是你的实力要够坚强，另一个就是你的运气要够好，如此而已。」


    「哦，愿闻其详。」这答案让米奇觉得不太能理解。


    Pianoboy 清了清喉咙继续说：「事情是这样的。我的前任女友，也是我路上搭讪认识的。不过，就如匡宇大哥所说，和女生认识的场景实在是太重要了。想想我也是台大物理研究所毕业，被一般社会价值认定的高材生啊！可是，就因为当初第一次认识她，是在路上擦肩而过的搭讪，所以她一开始对我的态度，简直奇差无比啊！」


    Pianoboy 边说边摇头，想起自己当时被前女友当作路边狗屎，避之唯恐不及的际遇，实是惨不忍睹。


    「我看你也长得一副白面书生样，女孩怎么可能对你退避三舍呢？」米奇难以置信问。


    「就是会啊！我看她当时被我搭讪时，脸色那么难看，要不是还有女大学生基本的社会礼仪，她应该想对我吐口水吧！」Pianoboy 挖苦自己。


    「哇，这么惨啊！你到底怎么和她搭讪的？」米奇对于如此帅气，又是名校高材生的 Pianoboy 竟有如此遭遇，相当不能理解，想要追根究底。


    Pianoboy 假装为自己辩解：「我觉得自己的表现很好啊，中规中矩的，也就是用匡宇大哥在书里介绍的那种诚实搭讪法，告诉她：我觉得她气质很好，想认识她。」


    「结果勒？」


    「她就一副很不屑的样子，摇摇头说不用了。」Pianoboy 演起女生不屑的动作和表情。


    「哈哈哈，我们是同一阵线的，恭喜你加入我的阵营。」米奇看到那熟悉的拒绝表情，不禁哈哈大笑，也顺势伸出手来想再次和 Pianoboy 握手，做个失恋阵线联盟的盟友。


    Pianoboy 尴尬摇摇头，把伸出去想和米奇相握的手缩回来，说「呵呵，米奇哥，抱歉，你这阵营我还不着急加入。当时我一看到她那有点嫌恶、想闪躲的样子，心想：不使出杀手锏力挽狂澜是不行了。」我赶快告诉她，自己平时从事一些音乐创作，是因为看她的气质很好，感觉也像是学音乐的，才会想和她说话。我问她：「有没有在用无名小站？」


    「哎呀，高招啊！只要她有用，就可能听过你的音乐。」米奇用力拍了一下自己的头，恍然大悟。


    「没错！我告诉她，其实我不仅常上无名，甚至还把自己的音乐创作放在无名上，无偿提供给无名小站当背景音乐，供用户自由下载。」


    「然后呢？」


    「为了降低她的戒心，我甚至连电话和 email 都没有要，只是直接和她交换了无名账号，也请她回家后上网，可以到无名试听一下我的音乐。」Pianoboy 微笑着分享了自己的诀窍。


    「对了，你这就是利用教主所说的，创造对自己有利的舞台，丢出属于自己的优势来吸引对方。」米奇赶忙补充。


    「一点没错。很巧的是，她回家后上网，进入自己的部落格，才发现她一直以来所使用的背景音乐，正是在下我写的钢琴曲《The Truth That You Leave》！」Pianoboy
    得意挑了挑眉毛。


    米奇听了拍案叫绝：「哇，那也太巧了吧！有了这一层关系和巧合，她是不是突然就『乖』了，不再搞怪了呀？」


    「没错。我们在彼此部落格上留个几次言之后，就转战 MSN 了，也交换了彼此的电话。」Piano boy 继续面有得色。


    米奇点了点头：「我现在懂你刚才说的，想要败部复活，得靠实力与运气那句话的意思了。的确，如果你没有弹钢琴的实力，也没有她用你的曲子当自己部落格背景音乐的巧合，她一定会成为网路世界的死人，理都不理你，就算你去留言，她也不会响应。」


    「我也这么想。这也是我在匡宇大哥的书里所学到的，喜欢一个女生，一直表达你喜欢她，并没有意义。当我们一开始没有很好的舞台可以吸引到对方，而被对方刷入『不可能、不想发展』的圈子时，心急如焚、坐以待毙都没有用。还不如暂时从她眼前消失，自己全力发展那个女生欣赏的才能，或者培养其他实力，等待一个再次出现于对方面前的机会，看看能否用全新的自己，重新吸引她。」Piano
    boy 像背得滚瓜烂熟一般，说出了匡宇的理论。


    「嗯，这时就需要运气了，因为也许当我们提升了自我以后，却再也遇不到那个女生；或者即使遇到，我们新培养出来的才有能和光环，却也不见得是她在意或欣赏的。」说到运气，米奇就有气，不过他还是不得不折服在这天意的安排底下。


    「话是没错，不过如果依照匡宇哥的见解，我们应该在提升自我的过程里，搭配积极的搭讪行为，想要吸引到别的优质女生，应该是没问题的。」Piano boy 语气肯定。


    「你把教主的书和理论，背得还真是滚瓜烂熟啊！不过，你和你前女友，也不过是有那个重新公平审视你的机会罢了，要真正发展成男女朋友，应该还有其他的原因吧？」好奇心驱使米奇打破砂锅问到底，一个问题都不遗漏。


    ### 情景大挪移，突然爱上你！


    「一点没错，而且米奇哥你知道吗？我运用了一些技巧，加深了我才是她真命天子的感觉，使得她胡里糊涂便为我倾心。」Pianoboy 点点头，露出神秘的笑容。「真的吗？到底是怎样的技巧？」米奇兴奋追问。


    「很简单，把约会的时间拉长，并且多变换场景，就能加深女生对你的依赖心与好感。」


    「其实，拉长约会的时间，就是一种好感测试了。原本只是约对方喝个下午茶，聊得开心，就一起吃晚饭，之后再到附近的公园走走……藉此不断延伸。假如女生都答应的话，就表示喜欢你，愿意和你多相处。」Pianoboy
    停顿了一下。


    「相反，如果她只喝个下午茶就跟你掰掰了，甚至还给你来个『尿遁』或『我男朋友叫我回家』等等鸟不拉屎的借口，那你就换人，找下一个吧。」提到尿遁例子时，调皮的 Pianoboy
    还比出日本忍者施展忍术的样子，竖起食指和中指于身前，彷佛念口令一般。


    「请小心你说话的口气和使用的例子哦！你是不是听郑匡宇说过，我约女孩子时遭遇的困难？」米奇疑心病很重，边问还边斜眼望着一旁睡眼微笑聆听的匡宇。只见匡宇赶忙摇摇手，以无辜的表情表达自己的清白。


    「不是啦，我在讲的是我自己的经验啦，您就别太敏感了。」Pianoboy 很机警的把糗事都揽到自己身上，就怕刺伤了米奇，也保了教主的清白。


    看米奇点点头，似乎暂时相信的样子，Pianoboy 接着继续说：


    「这『多变换场景』，其实也是一种心理学运用。人，特别是女人，对于环境的变化比较敏感，也需要较多时间来适应。所以，约会时若能够运用一些借口，让女孩子多跑几个地方，就能自然加深她对你的依赖感，而依赖感正是催化好感的来源之一。这是我在教主的书上学来的。」


    Pianoboy 回想起，第一次和前女友约会的过程和场景…… 第一次约会，先去台北的当代艺术馆，看完展览后，去南京东路上的钱柜 KTV 唱歌，再到公馆吃晚饭。


    「哇，好丰富的约会行程哦！还是年轻人的精力比较充沛，是我的话，大概跑两个行程，就差不多 call it a day 了（结束一天的行程）。」米奇赞叹说。


    「呵呵，米奇哥为了有妹，你还是多锻炼身体吧！体力不好，把妹是很吃亏的。」


    当时 Pianoboy 和那个女生吃过晚饭后，他突然提议：「不如我们到台大校园走走吧？」


    「那时发生了件戏剧性的事件，让她整个陷入爱上我的情境。」Pianoboy 说到「戏剧性」三个字时，不自觉提高了音量。


    「别再卖关子了，是怎样的情境？快说快说！」米奇的音量更高了，身体也更加前倾，显得兴趣浓厚。


    花前月下，两人本来也只是散步聊天而已。没想到，经过学校大礼堂时，Pianoboy 忽然发现大门没锁，想起里头有一台钢琴，于是灵机一动……


    「来，我有礼物要送你。」Pianoboy 一边说，一边拉着她进入大礼堂。


    「高招啊！我以前好像看过一个日本作家岛田一男写的书，他提到，带着女生去做一些危险、或超出她日常生活常规的事情，可以激发她的冒险心，以及对眼前男子的依赖心。」米奇不禁拍案叫绝！


    Pianoboy 点点头：「对，那也正是我的目的，光是拉着她的手快速闪入大礼堂，做出这种违背规定的事，应该就已经对她的心里投下一颗震撼弹了吧。」


    进了大礼堂，Pianoboy 就请她在观众席上坐好，然后他上台，打开钢琴盖，开始弹奏他的成名曲：《The Truth That You Leave》。


    她当时的表情，就像是童话故事里的女主角，遇到了白马王子，幸福的喜悦尽显于色。如果当时 Pianoboy 向她求婚，说不定她会也含着眼泪说：「Yes I do」。


    米奇听得一脸陶醉，仿佛 Pianoboy 现在正在钢琴前舞动着双手，敲下美丽的旋律似的。


    「Oh My God! 她不是兴奋得要昏倒了吗？她一定是用爱慕又幸福的眼神看着你吧？」


    「哈哈，没那么夸张啦。但是等我弹完钢琴，和她走出大礼堂时，真的发现她看我的眼神都不一样了，尽是柔情与爱慕。我也很自然地牵起她的手，送她回家。」Pianoboy
    边说边扬起嘴角，得意和喜悦之情溢于言表。


    「真是水到渠成啊。」米奇也忍不住帮腔。


    「事后回想起来，那一天的一切，除了是我神来一笔即兴演奏，发挥效果之外，应该也和匡宇哥以前在他书里提到过的《制造谬误陷阱》有关。米奇哥，你看过一部韩剧叫《我的野蛮女友》？」


    「当然有，那部戏是经典中的经典啊！全智贤在戏里真是美呆了。」想起女主角全智贤在戏里的长发，以及那双美腿，米奇意淫式的笑容不自觉再度浮现。


