    「要给具体的例子也不是不可以，不过兄弟，先帮我来杯饮料吧，我口渴了！」匡宇挺爱卖关子的，还摆出一副不给咖啡喝，就不想再讲话的大爷样。


    米奇站起身来露出不情愿的表情到柜台帮匡宇点了一杯美式咖啡。回到座位后，他抬起头来，像只嗷嗷待哺的小拉布拉多犬，等待搭讪教主的开示。他倒要听听几年不见的匡宇到底还有什么新见解？能解救自己于没有妹的水深火热和倒悬之苦？


