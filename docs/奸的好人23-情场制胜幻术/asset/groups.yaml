    没想到，在野议员疯狂打击花博，却等于变相为花博活动造势。展览正式开张后，好奇民众大量涌出，并被美丽的花卉、良好的展场规划所惊艳，反而对郝龙斌市长及团队大表赞许，后来他更顺利连任台北市市长。真是塞翁失马，焉知非福啊！


