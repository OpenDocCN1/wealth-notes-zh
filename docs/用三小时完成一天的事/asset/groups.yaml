    \ | 27 | 28 | 29 | 30 |\n\n過了二十號後，還剩六天\n\n按月劃分很難掌控剩餘的天數\n\n![](img/87569369e8074c65e7c56ecade1ddea0_110_0.png)\n\
    \n# 具備這三項條件，才能順利達成長期計畫\n\n成為專案高手的條件❶：別忘了目標與計畫\n- 訂立整體計畫\n- 養成審視計畫的習慣\n  ( 搭配平常的排程一併審視\
    \ )\n  ( 每天至少花一分鐘審視 )\n\n成為專案高手的條件❷：養成今日事，今日畢的習慣\n\n「按月」設定目標，不易掌控進度，長期計畫還是以週為劃分單位最適合\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_110_1.png)\n\n將目標細分化，才能縮小差距\n\n![](img/87569369e8074c65e7c56ecade1ddea0_110_2.png)\n\
    \n# 成為專案高手的條件❸：妥善掌控「多項」專案的流程\n\n- 整合與自己相關專案\n- 整合後，不但能避免工作擠成一堆，還能隨時調整狀況。\n\n不妨將工作量往前挪一挪，比較好消化\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_111_0.png)\n\nPart 6 會有更詳細的說明！\n\n\
    # 時間活用秘技⊕ 計畫是可以變更的\n\n# 專案的計畫也有必須更改的時候\n\n本書介紹如何訂立長期計畫的方法，當然實行長期計畫時，難免會遇到需要變更的時候。\n\
    \n以想提升業績為例。為了達成目標推行了許多行銷活動，業績卻毫無起色，這時就必須思考其它對策。\n\n或是以我曾從事過的研發工作為例，也會遇到同樣的情形。訂下「研發能夠達成○○與□□性能的商品」為目標，思考了許多對策，也做了各種研究，但結果不如人意，有時還會出現意想不到的狀況，不得不重訂計畫，這就是「行動目標」與「成果目標」往往有所差異的道理。\n\
    \n## 行動目標與成果目標\n\n所謂「行動目標」是以進行某項行動為目標。譬如業務員以「拜訪一千位新客戶」為行動目標，只要有所行動便能達成的目標。\n\n\
    「成果目標」則是以達成某個成果為目標，而且達成目標的方法不只一種，也不見得一定能達成目標。\n\n要是察覺「就算照著計畫進行，也不一定能在期限內達成目標」時，就必須變更計畫。意即對「成果目標」而言，計畫並非絕對，當然也不是說不需要計畫，因為毫無計畫地進行，只怕更得不到結果。\n\
    \n## 達到成果目標的方法\n\n設定成果目標時，必須按照計畫進行並養成審視的習慣，還要確認是否有所成果。這和準備升學考時，有模擬考能讓我們瞭解自己準備的狀況，若成績不甚理想，就必須改變讀書方法。\n\
    \n視計畫而定，有時就算每天確認，三個月後也不見得能達成目標，因此一定要保留確認狀況的時間。可以事先設定確認時間，或是在達成最終目標前，先決定階段性目標與達成時期。建議挑戰成果目標時，不妨試試這些方法。\n\
    \n# Part 6\n\n# 整合多項工作計畫\n\n# 一張「專案地圖」就夠用\n\n## 1 將各項工作整合在一张「專案地圖」\n\n### 將長期排程的「時間地圖」圖表化\n\
    \n接下來，說明如何製作「專案地圖」。所謂「專案地圖」就是列出每「週」各項「計畫」應實行的事。以右圖長期排程版的「時間地圖」為例，雖然是格式簡單的圖表，但直向看，可以看到各專案的「流程與所需時間」；橫向看可以看到「這一週的工作量」（以週為劃分單位的「時間地圖」剛好相反）。\n\
    \n如同 Part 2 所說明，審視每週的「時間地圖」，決定何時進行工作時，一定要特別留意「這天時間到底夠不夠用」，也就是「填字遊戲原則」。\n\n使用「專案地圖」整合多項計畫的好處，在於就算是長期排程，也能以同樣觀點審視。由此可見，整合多項專案的情報是多麼重要的事。\n\
    \n就算手上有多項專案必須處理，腦袋也只有一個，因此為了能夠落實執行專案，一定要妥善安排各週工作量。\n\n### 整合「專案地圖」\n\n| | A專案\
    \ | B專案 | C專案 |\n| :--- | :---: | :---: | :---: |\n| 週 | 日期 | | |\n| 第40週 | 9/29～10/3\
    \ | | |\n| 第41週 | 10/6～10 | 這週的工作量有多少？ | | |\n| 第42週 | 10/13～17 | A專案的流程 | B專案的流程\
    \ | C專案的流程 |\n| 第43週 | 10/20～24 | | | |\n| 第44週 | 10/27～31 | | | |\n| 第45週 | 11/3～7\
    \ | | | |\n| 第46週 | 11/10～14 | | | |\n| 第47週 | 11/17～21 | | | |\n| 第48週 | 11/24～28\
    \ | | | |\n| 第49週 | 12/1～5 | | | |\n| 第50週 | 12/8～12 | | | |\n| 第51週 | 12/15～19\
    \ | | | |\n| 第52週 | 12/22～26 | | | |\n\n## 2 列出「每週工作清單」①\n\n### 將「專案計畫」視為「個人計畫」\n\
    \n「專案地圖」是張顯示每週工作內容的圖表。整合各項專案的工作內容，製成一張「地圖」。\n\n好比小夫必須參與大規模的團隊計畫，就必須審視整體計畫的排程，確認自己需要負責的工作內容和日程，然後將每週工作內容列在「專案地圖」上。\n\
    \n比起細分「工作內容」，不如將其視為大規模的「活動」來安排更為清楚明瞭。\n\n這麼一來，每週工作量便一清二楚了（屬於「個人的工作」一定要標示清楚）。當然實際操作時，一定有比較忙和比較清閒的時候，整合專案的好處就是能夠清楚瞭解工作的「尖峰期」與「離峰期」。\n\
    \n### 將不同的專案整合成一張地圖\n\n| 週 | 日期 | A專案 | B專案 | C專案 |\n|---|---|---|---|---|\n|\
    \ 第40週 | 9/29 ~ 10/3 | 檢討細單<br>部門會議 | 起始會議<br>準備資料 | 製作報告資料<br>拜訪○○公司 |\n| 第41週\
    \ | 10/6 ~ 10/10 | | 第一次<br>調查期間<br>↓ | 專案會議<br>準備資料 |\n| 第42週 | 10/13 ~ 10/17\
    \ | 和□□公司洽商<br>請廠商投估價單 | 整合調查<br>結果<br>↓ | |\n| 第43週 | 10/20 ~ 10/24 | | 檢討對單<br>與相關人士開會\
    \ | |\n| 第44週 | 10/27 ~ 10/31 | 製作部門資料 | 月會 | |\n| 第45週 | 11/3 ~ 11/7 | 取得部門一致認同<br>發包<br>↓\
    \ | 對單實施期間<br>↓ | 製作報告資料<br>拜訪○○公司 |\n| 第46週 | 11/10 ~ 11/14 | 外製期間<br>↓ | | 專案會議<br>準備資料\
    \ |\n| 第47週 | 11/17 ~ 11/21 | | 改善效果調查<br>↓ | |\n| 第48週 | 11/24 ~ 11/28 | | 整合調查<br>結果<br>↓\
    \ | |\n| 第49週 | 12/1 ~ 12/5 | | 階段會報 | |\n| 第50週 | 12/8 ~ 12/12 | | 預定改善措施<br>(詳細內容未定)<br>↓\
    \ | 製作報告資料<br>拜訪○○公司 |\n| 第51週 | 12/15 ~ 12/19 | | ↓ | 專案會議<br>準備資料 |\n| 第52週\
    \ | 12/22 ~ 12/26 | ↓ | | |\n\n## 3 列出「每週工作清單」②\n\n### 自行決定工作排程\n\n有些專案是像前面的例子小惠那樣，可以自行決定。這種狀況的話，第一階段就是要考慮整體排程，想想要準備哪些應考內容。\n\
    \n譬如，目標是三個月讀完一本參考書，最簡單的方式就是看這段期間有幾週，然後除以整本書的頁數，算出每週必須讀完的頁數，這麼一來便能決定每週「要讀幾頁」。\n\
    \n就實務上來說，為了要讓讀書計畫能順利完成，先訂出完成的日期，然後根據內容的難易度不同，算出每週必須讀完的頁數多寡，會讓讀書計畫更加完美。此外，如果要讀多本參考書，則要訂立不同的計畫（參考右圖）。\n\
    \n這時也要運用「填字遊戲原則」，不只縱看，還要橫觀，確認每週工作量。客觀地衡量能否完成每週的進度，讀書計畫才能順利落實。\n\n### 決定每週課題\n\n\
    訂立十三週的計畫（約三個月）\n\n![](img/87569369e8074c65e7c56ecade1ddea0_121_0.png)\n\n| 週次\
    \ | 參考書A | 測驗題庫B |\n| :--- | :--- | :--- |\n| 第1週 3/31~4/6 | p12~p32 | p7~p19\
    \ |\n| 第2週 4/7~4/13 | p33~p53 | p20~p32 |\n| 第3週 4/14~4/20 | p54~p74 | p33~p45\
    \ |\n| 第4週 4/21~4/27 | p75~p95 | p46~p58 |\n| 第5週 4/28~5/4 | p96~p116 | |\n| 第6週\
    \ 5/5~5/11 | p117~p137 | |\n| 第7週 5/12~5/18 | p138~p158 | |\n| 第8週 5/19~5/25 |\
    \ p159~p179 | |\n| 第9週 5/26~6/1 | p180~p200 | |\n| 第10週 6/2~6/8 | p201~p221 |\
    \ |\n| 第11週 6/9~6/15 | p222~p242 | p137~p149 |\n| 第12週 6/16~6/22 | p243~p263 |\
    \ p150~p162 |\n| 第13週 6/23~6/29 | p264~p282 | p163~p175 |\n| 第14週 6/30~7/6 | |\
    \ |\n\n- 若還有其他課題，一定要確認每週的課題量。\n- 若發現一週內無法負荷，必須重新審視排程。（填字遊戲原則）\n\n## 4 避免「尖峰期」工作撞期\n\
    \n### 落實計畫的方法\n\n因為長期排程版的「時間地圖」只列出大略的工作內容，難免會遺漏些瑣碎的事項，耽誤進度，以至於無法落實。\n\n事先估算每項專案這週所需花費的時間，便能避免這類情況發生，意即預測「尖峰期」的情況。\n\
    \n「要花多少時間？」是顯示出工作「尖峰期」的一種寫法。標記每項專案所需的時間，然後橫排合計，便能算出這週要花多少時間。若一週工作時間高達七、八成，就算是相當吃緊的排程（專案以外的工作也不能遺漏）。\n\
    \n另一個方法更為簡單，只需抓個大概級數就行了。譬如用「A」表示「使用半週的時間」，用「B」表示「二～三成」，「C」表示「一成以下」，依此標記即可（也可以用紅、黃、綠等顏色區分）。\n\
    \n就算是粗略地估算也能發揮相當大的助益。「有一個A表示這週很忙」、「有兩個A表示神經要繃緊一點」、「有三個B就相當吃緊了」，像這樣憑直覺感受忙碌程度的標記法也能讓「尖峰情況」一目了然。\n\
    \n這麼一來，追加新專案時，便能避免時間亂不過來的問題。\n\n### 清楚標示尖峰期的工作狀況\n\n![](img/87569369e8074c65e7c56ecade1ddea0_123_0.png)\n\
    \n> 打勾確認一下已經完成的工作\n>\n> 預測這一週、這項專案需要花費的時間。\n\n| 週 | 日期 | 所需時間 | A專案 | B專案 | C專案\
    \ |\n|---|---|---|---|---|---|\n| 第 40 週 | 9/29 ~ 10/3 | 8 | 檢討明細單<br>部門會議 | 6\
    \ | 8 |\n| 第 41 週 | 10/6 ~ 10/10 | | 12 | 4 | |\n| 第 42 週 | 10/13 ~ 10/17 | 4\
