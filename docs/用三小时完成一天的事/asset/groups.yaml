  - '[PAGE 120]


    # 3 列出「每週工作清單」②


    自行決定工作排程


    有些專案是像前面的例子小惠那樣，可以自行決定。這種狀況的話，第一階段就是要考慮整體排程，想想要準備哪些應考內容。


    譬如，目標是三個月讀完一本參考書，最簡單的方式就是看這段期間有幾週，然後除以整本書的頁數，算出每週必須讀完的頁數，這麼一來便能決定每週「要讀幾頁」。


    就實務上來說，為了要讓讀書計畫能順利完成，先訂出完成的日期，然後根據內容的難易度不同，算出每週必須讀完的頁數多寡，會讓讀書計畫更加完美。此外，如果要讀多本參考書，則要訂立不同的計畫（參考右圖）。


    這時也要運用「填字遊戲原則」，不只縱看，還要橫觀，確認每週工作量。客觀地衡量能否完成每週的進度，讀書計畫才能順利落實。'
