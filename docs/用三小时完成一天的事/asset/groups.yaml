  md: "\n## 4 如果計畫趕不上變化怎麼辦？\n\n### 如何因應突發狀況？\n\n工作中難免會有突發狀況，大多是臨時出了什麼問題，容易手忙腳亂，這時更應該保持鎮定地行動。\n\
    \n首先掌握正確狀況，判斷如何因應。是否可以同時進行，還是得將今天的約定和工作挪後。無法掌握清楚狀況便無從判斷該優先處理哪件工作，雖然必須視情況而定，但務必先瀏覽「時間地圖」後再行決定。\n\
    \n平時養成瀏覽地圖的習慣，這時便能發揮莫大作用。\n\n### 無法如期完成預定的工作\n\n有時計畫趕不上變化，無法如期完成預定的工作，這時就得判斷究竟要「留下來加班？」還是「留到明天繼續完成」。\n\
    \n不妨依明天的工作量的判斷。若明天的工作量比較少，時間充裕的話，挪後處理當然沒問題。\n\n相反地，要是工作量比今天還多，就沒辦法挪後處理了。勢必得決定留下來加班還是暫時中止某件工作。若明天很忙，今天就得多努力些，就像有種和「自己協商」的感覺。\n\
    \n### 別人的預定計畫變更，也會影響到自己！\n\n預定的計畫之所以會變更，不單是自己的問題，也有可能是受到上司排程變更的影響等因素。\n\n譬如自己的排程中有必須取得上司認可的工作，若上司適巧不在，可就傷腦筋了。因此上司排程有所變更時，務必確認自己的排程是否受影響。此外，平常最好留意上司哪一天不在辦公室，以因應突發狀況。\n\
    \n## 5 如何因應臨時新增活動？\n\n### 儘早將龐雜的工作「步驟化」\n\nPart 3、Part 4 所說明的「活動」，屬於規模較為龐雜的「工作」，處理這類工作前一定要先「步驟化」。若有活動臨時插進來，只要活用「步驟化」便能迅速處理完畢，當然也有不必急著處理的活動。\n\
    \n之所以將活動步驟化，除了方便確認要做哪些事，也能找出必須請教別人的問題，畢竟有些問題向別人請益，才能進行得更順利。\n\n另一個理由則是若沒有步驟化，很難想像總共需要花費多少時間。譬如原本以為兩天便能完成的工作，步驟化後發現得花費更長的時間也說不定，早點發現還能多點時間從容應付，以免手忙腳亂。\n\
    \n雖然依活動規模不同，多少有些差異，但大部分工作只需花個十分鐘便能完成步驟化。遇到臨時插進來的活動，只要予以「步驟化」，便能迅速處理完畢，多花個十分鐘便能讓工作進行得更順利。\n\
    \n### 將工作和約定排進「時間地圖」\n\n如同 Part 4 的說明，使用「料理型」或「購物型」步驟法都可以，務必將「步驟化」的結果，也就是工作內容和約定事項排進自己的「時間地圖」。\n\
    \n不管步驟化再怎麼完善，要是沒有將步驟化的結果納入排程表，很有可能會忘了處理，因此一定要隨手記下來。\n\n若步驟過於複雜，不妨先思考一番再排進「時間地圖」；若步驟還算簡單，可以邊思考邊排進「時間地圖」。\n\
    \n像是必須花費好幾週、甚至好幾個月，規模較為龐雜的計畫，就要像 Part 6 所說明的，將工作內容列在「專案地圖」上。這時先整合「專案地圖」上的情報（工作和約定），再排進「時間地圖」。\n\
    \n## 6 如何因應滿檔工作？\n\n### 如何解決工作太多，窮於應付的窘況\n\n邊質疑時間是否充裕，邊瀏覽「時間地圖」，才能察覺哪一天工作量大過多，找出解決對策。但要是整體工作量大過多，就不適用這方法，必須另見對策。\n\
    \n提升工作效率是解決工作量大過多的一種方法，意即邊審視工作流程，邊活用電腦讓部分工作自動化的意思。\n\n雖說如此，深感困惑或遇到突發狀況時，還是會不知所措，所以平時最好累積相關經驗，才能因應不時之需。\n\
    \n### 有時必須懂得「託付」與「拒絕」\n\n這裡有兩種方法，一種是將部分工作委託他人，一種是明白拒絕。\n\n畢竟一個人的時間有限，不可能什麼事都一手全攬，懂得委託與拒絕，就管理工作來說也是一種負責的表現。\n\
    \n你是否有過接受別人的委託，卻搞得自己忙不過來的經驗呢？若時常這樣就必須注意了。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_145_0.png)\n\
    \n雖說是受人之託，但不考慮自身狀況，一味地答應，難保會落到不負責任的下場。比起凡事親力而為，結果耽誤工作進度，不如減少工作量，確實處理好每一件事。因此有時必須請別人協助，也要懂得拒絕。\n\
    \n還有一點要特別注意，那就是無論是請別人協助，還是明白拒絕，一定要給對方充分的時間準備。也就是說，儘可能地早點做決定，才不會造成對方的困擾，當然也是為了自己好。\n\
    \n臨時插進約定和工作時，一定要瀏覽「時間地圖」，才能儘快想出因應之道，也能儘早判斷究竟是要「委託他人」還是明白「拒絕」。\n\n### 1 分鐘掌握重點！\n\
    \n#### 如何判斷工作該選擇委託他人，還是明白拒絕？\n\n這兩件事絕非個人主觀所能決定。若每個人都是因為「討厭這件工作而委託別人」，或是「因為這件工作不好處理而拒絕」，工作便成了一件棘手的事。\n\
    \n儘可能地抱持客觀心態判斷（以第三者觀點），也就是說考量整體組織做出判斷的意思。抱持這種觀點才能避免流於意氣用事。\n\n## 7 如何活用空檔時間？\n\
    \n### 預留瀏覽「專案地圖」的時間\n\n唯有養成 Part 6 提到的「瀏覽專案地圖」的習慣，才能利用空檔時間處理一些工作。\n\n想要達成長期目標，平常就得養成瀏覽長期排程的習慣，配合週排程對照效果更好。\n\
    \n就算每天會瀏覽週排程，卻往往忘了瀏覽長期排程，因此養成每天瀏覽「專案地圖」的習慣，才能避免這種情況發生。\n\n同時審視「時間地圖」與「專案地圖」，確認「計畫是否如期進行？」、「企劃項目是否已經排進本週或下週的排程？」等，才能有效地達成長期目標。就算一天只花一分鐘也沒關係，持之以恆就對了。\n\
    \n基本上，人們往往比較注意近期的事而忽略遠一點的事。訓練自己放遠眼光，絕對能提升自我實力。\n\n### 審視明天的排程\n\n結束忙碌的一天後還要做一件事，那就是確認明天的排程。\n\
    \n活用本書介紹的「時間地圖」，明天排了什麼約定和工作就能一目了然。下班回家前審視一遍排程，確認明天「時間是否足夠」，確定「自己一定辦得到」（若沒自信辦得到，表示工作量不勝負荷）。\n\
    \n確認這些事其實花不了多少時間，卻能產生莫大效果。一想到明天的工作「一切 OK」，彷彿吃了顆定心丸，也能避免公事干擾私人時間，確實達到公私分明的均衡生活。\n\
    \n也許你會覺得這麼一個動作能讓自己安心，有些不可思議。建議務必一試，絕對能讓你體驗到絕佳的效果。\n\n## Part 7 總整理\n\n### 活用「時間地圖」落實時間管理\n\
    \n#### 早上要做的第一件事\n\n- 首先翻開記事本：確認今天要做哪些事。\n- 將記事本攤開放在一旁：攤開寫有「時間地圖」記事本，隨時都瞧得見。\n\
    \n#### 邊處理工作邊進行的事\n\n- 準備工作前先留意一下時間：估算工作所需時間，決定什麼時候完成。\n- 確認已完成的工作：確認工作是否確實完成。\n\
    \n#### 臨時插進新工作時的處理方式\n\n- 養成今日事，今日畢的習慣：能夠馬上處理完畢的工作，不要留到明天。避免安排過多計畫，這些都是時間管理的訣竅。\n\
    - 順手記下那至日後實行的約定和工作內容：不管是約定還是工作，一定要「順手記下來」。花十秒就能搞定的一個動作，千萬別想著以後再做。秉持「填字遊戲原則」，衡量工作量和。\n\
    \n#### 預定計畫變更時的處理方式\n\n- 發生突發狀況！：首先掌握狀況，邊看「時間地圖」邊判斷。\n- 預定工作處理不完！：和「明天的自己」協商是否留下來加班。\n\
    - 周遭人的預定計畫變更！：確認自己的預定計畫是否跟著變更。\n\n#### 臨時增加活動時的處理方式\n\n- 儘早「步驟化」：就算是不急著處理的工作，也要儘早步驟化。花個十分鐘便能大幅提升工作效率。\n\
    - 將工作和約定排進「時間地圖」：無論是活動還是計畫都要排進「時間地圖」。\n\n#### 工作滿檔時的處理方式\n\n- 提高工作效率：平時養成各種良好習慣，才能有效提升工作效率。\n\
    - 有時也必須懂得「委託他人」或「明白拒絕」：為了確實處理每件工作，有時必須懂得委託他人或明白拒絕，減少工作量，才是負責任的態度。\n\n#### 如何活用空檔時間\n\
    \n- 預留瀏覽「專案地圖」的時間：就算每天只花一分鐘也行，務必確認「專案地圖」的必要項目是否已排進「時間地圖」。\n- 審視明天的工作排程：下班前審視一下明天有哪些約定和工作，確認明天「時間是否足夠」，確定「自己一定辦得到」。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_149_0.png)\n\n## 如何活用群組軟體？\n\n### 群組軟體的優缺點\n\
    \n雖然記事本或電腦都可以用來製作「時間地圖」這個時間管理工具，但大多數人還是覺得使用記事本比較方便，畢竟電腦較適用於管理約定，不太適用於管理工作。\n\n\
    電腦當然有其便利之處，那就是資源共享功能，稱為「群組軟體」（Groupware）。群組軟體（譯註）具有可同時確認多人的工作排程、設定會議等約定的功能，但群組軟體較不適用於管理工作就是了。\n\
    \n### 群組軟體的使用方法①\n\n第一個就是用於記事本上的「時間地圖」，只有約定需要同時記在記事本與群組軟體上。這麼一來，記事本就成了「時間地圖」，統整所有約定與工作。\n\
    \n記事本與群組軟體的內容務求一致，記錄於軟體上的約定，同時也要寫在記事本上（若不做這樣的話，會被人誤植其他約定也沒不定）。雖然這樣做較為瑣碎，但是一道必要的工夫。\n\
    \n### 群組軟體的使用方法②\n\n第二個是使用群組軟體管理約定，再以清單管理工作（工作務必依日期標記），這麼一來就不用花時間記錄約定了。\n\n但有一點要注意，那就是這麼一來便無法統整「時間地圖」上的情報。若沒瀏覽一遍約定便追加工作，或是沒瞭解工作量便追加約定的話，也許會訂立出根本無法徹底實行的計畫。因此使用這方法時，一定要同時確認群組軟體與工作清單。\n\
    \n### 群組軟體的使用方法③\n\n第三個是將決定好的工作時間同步登錄群組軟體。這麼一來，便能利用群組軟體整合「時間地圖」。\n\n就連只需花個幾分鐘的工作也得登錄，多少有些瑣碎，也很難區別哪些工作已經完成，哪些工作尚未完成，因此這方法不適用於手邊瑣事較多的人。\n\
    \n> 譯註：群組軟體是一種電腦應用軟體，結合電子郵件、行事曆分享、工作管理等功能，例如微軟的 Exchange Server 2010。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_151_0.png)\n\
    \n## Part 8 強化「行動」的念頭！\n\n### 改掉拖拖拉拉的毛病\n\n#### 1 你是否為拖拖拉拉的毛病所苦？\n\n做事總是愛拖拖拉拉……\n\
    \n明明下定決心「今天要做這件事」……\n\n卻遲遲提不起勁，再三拖延。\n\n待期限逼近才慌張地處理，你是否也有此經驗呢？\n\n這樣的行為就叫做「拖拖拉拉毛病」，事實上蠻多因為**所苦\n\
    \n這種毛病有以下特徵：\n\n- 「明知再不做就來不及了，但就是提不起勁。」\n- 「非得等到火燒屁股了（完成期限逼近），才開始行動。」\n\n總是等到期限逼近才行動，稱不上是有計劃的行動，而且一直處於這種狀況會讓人覺得疲累不堪吧。\n\
    \n一定有很多人想急於改掉這種毛病，你是否也是如此呢？\n\n若你也有這種壞毛病，請思考以下問題。\n\n#### 2 為何會有拖拖拉拉的毛病呢？\n\n\
    ##### 做事拖拖拉拉的原因\n\n「這件工作非做不可」明明下定決心，卻遲遲提不起勁……。這就是典型的拖拖拉拉毛病。\n\n和猶豫要不要向喜歡的人告白一事很像，不是嗎？明明決心「告白」卻臨陣退縮，一方面也是怕遭到對方拒絕，就這樣陷入兩難的窘境。\n\
    \n心理學上稱這種情況為「接近與迴避之間的糾葛」。明明想接近對方，卻又害怕遭拒，始終下不了決心。\n\n老是拖拖拉拉的毛病和這情況十分相似，總是徘徊於「做」與「（現在）不想做」這兩個念頭之間。\n\
    \n##### 迫使自己儘早行動\n\n然而做事老是拖拖拉拉的人，一旦火燒屁股又能落實行動，這是為什麼呢？\n\n因為「想做」與「不想做」這兩個念頭的平衡產生變化的緣故。\n\
    \n心想離期限還有段時間，「不想做」比「想做」的念頭來得強烈，以致於遲遲提不起勁。一旦期限逼近，「想做（要是再不做就錯了）」的念頭又變強，可見只要這兩個念頭的強度相反就會促使行動。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_157_0.png)\n\n那麼，該如何讓這兩個念頭產生變化呢？如下圖，只要讓「想做」的念頭稍微強一點，「不想做」的念頭稍微弱一些，便能迫使自己儘早行動。稍微改變念頭便能改善拖拖拉拉的毛病。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_157_1.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_157_2.png)\n\
    \n##### 善用「時間地圖」改善拖拖拉拉毛病\n\n活用「時間地圖」來改善\n\n本書介紹的時間管理能有效改善拖拖拉拉的毛病，尤其是細分規模較為龐雜的工作，效果更好。\n\
    \n舉個關於食物的例子吧。規定自己「十天後要吃完一盒蛋（十顆）」。一想到這目標的期限是十天後總覺得還早，是吧？正因為離期限還早，所以會有「今天不想吃」留到明天再吃的念頭。\n\
    \n若將這件事分成十天份，每天吃一顆，就比較不會拖拖拉拉了。\n\n這方法又稱為「瑞士起司法」，是招十分典型的時間管理法。以在起司上一點一點地挖洞孔，最後便能輕鬆吃完為譬喻\
    \ * 。\n\n「時間地圖」之所以能改善毛病理由有二，一是將規模龐雜的工作逐一分解，原本十天後的期限改以一天為單位，加強「今天就做到這裡」的念頭。\n\n\
    > * 其實起司上一點一點的洞孔不是人為挖的，是因為氣泡的關係。\n\n#### 將工作細分化，有效改善拖拖拉拉的毛病\n\n反正離期限還有段時間，不用急著吃……\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_159_0.png)\n\n只吃今天的份吧！\n\n![](img/87569369e8074c65e7c56ecade1ddea0_159_1.png)\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_159_2.png)\n\n另一個理由則是改變對工作量的感覺。將「必須吃掉十顆」改成「今天只吃一顆」，感覺工作量減少（總數並沒變），「（現在）不想做」的念頭便減弱。\n\
    \n如同 Part 6 所說明的，將專案和活動等規模較為龐雜的工作細分化，也能達到同樣效果，足見活用「時間地圖」能改善拖拖拉拉的毛病。\n\n#### 4\
    \ 影響拖拖拉拉毛病的思考方式\n\n##### 預防萌生拖拖拉拉的念頭\n\n「時間地圖」能有效改善拖拖拉拉的毛病，若能更瞭解前述所說的兩個念頭，不但效果加倍，還能廣泛運用於各方面。\n\
    \n如同前述，「想做」和「不想做」這兩個念頭與未來和現在有關。意即為了得到未來的結果而萌生「想做」的念頭，以及重視現在的心情，因而萌生「不想做」的念頭。\n\
    \n這兩種念頭又分別細分為兩種（合計四種）。\n\n「未來志向」＝想做：想行動的念頭\n\n- 「要是（何時）不做的話就糟了」的念頭\n  - （必須遵守完成期限）\n\
    - 「要是（何時）做的話就會很開心」的念頭\n  - （想達成目標，想早點解脫）\n\n「當下志向」＝不想做：現在只想落個輕鬆的念頭\n\n- 「（現在）不想做」的念頭\n\
    \  - （避開麻煩、討厭的事）\n- 「（現在）想做別的事」的念頭\n  - （想做別的事，讓自己更輕鬆）\n\n#### 5 改善拖拖拉拉毛病的思考方式（強化篇）\n\
    \n##### 改善拖拖拉拉毛病的思考方式①\n\n###### 未來志向·痛苦指數：強化「要是（何時）不做的話就糟了」的念頭\n\n「要是不做的話就糟了」有此自覺可以改善拖拖拉拉的毛病，多多思考未來的排程絕對有效。\n\
    \n但人難免有怠惰之心，有時就是不想做什麼事，這時不妨下意識地盯著「時間地圖」。停下手邊工作，花點時間瀏覽時間地圖。這麼一來，內心會湧起一股「非做不可」的衝勁。\n\
    \n要是不做的話就糟了！\n\n![](img/87569369e8074c65e7c56ecade1ddea0_162_0.png)\n\n**改善拖拖拉拉毛病的訣竅**\n\
    \n- 下意識地審視工作資料。\n- 下意識地審視排程（時間地圖）。\n- 試想這件事要是一直拖過今天、明天、後天，會如何呢？\n- 試想如果進度延誤，會造成誰的困擾呢？\n\
    \n##### 改善拖拖拉拉毛病的思考方式②\n\n###### 強化「要是（何時）做的話就會很開心」的念頭\n\n將「今天不想做」的工作變成「要是做的話就會很開心」的工作，這念頭也是改善拖拖拉拉毛病的方。法之一。\n\
    \n若有件工作遲遲未進行，不妨先停下手邊工作，想像完成這件工作後會是這麼輕鬆。越是不想碰觸的工作，完成後心情越是輕鬆，想像這般心情便能強化「要是做的話就會很開心」的念頭。\n\
    \n此外，完成工作後放鬆一下也很有效。\n\n像是「做完這件事後，看場電影吧」或是「做完這件事後，開瓶酒慶祝一下吧」等，稍微「犒賞一下自己」。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_163_0.png)\n\
    \n**改善拖拖拉拉毛病的訣竅**\n\n- 想像做完這件事後多麼輕鬆。\n- 想像早點做完這件事便能回家。\n- 完成工作後，稍微犒賞一下自己。\n- 想想完成這件工作後，誰最開心。\n\
    \n##### 改善拖拖拉拉毛病的思考方式（削弱篇）\n\n###### 改善拖拖拉拉毛病的思考方式③：削弱「（現在）不想做」的念頭\n\n削弱「（現在）不想做」的念頭，不但能改善拖拖拉拉的毛病，也能有效地細分工作。譬如吃完「一盒蛋」很困難，但一天吃一顆就輕鬆多了，這就是削弱「不想做」的念頭。\n\
    \n若打算將工作挪後，必須更細分工作內容，要是排不進「時間地圖」，可以記在別的地方，然後逐一處理。只要花點心思便能削弱「不想做」的念頭，慢慢地重拾幹勁。\n\
    \n現在不想做時\n\n![](img/87569369e8074c65e7c56ecade1ddea0_164_0.png)\n\n**改善拖拖拉拉毛病的訣竅**\n\
    \n- 細分工作，一開始只做一件事。\n- 花個五分鐘細分工作。\n- 試著做些準備工夫。\n- 告訴自己「就算失敗也沒什麼大不了了」。\n- 別勉強自己「非做到最好不可」。\n"
  mdcn: "\n## 4 如果計畫趕不上變化怎麼辦？\n\n### 如何因應突發狀況？\n\n工作中難免會有突發狀況，大多是臨時出了什麼問題，容易手忙腳亂，這時更應該保持鎮定地行動。\n\
    \n首先掌握正確狀況，判斷如何因應。是否可以同時進行，還是得將今天的約定和工作挪後。無法掌握清楚狀況便無從判斷該優先處理哪件工作，雖然必須視情況而定，但務必先瀏覽「時間地圖」後再行決定。\n\
    \n平時養成瀏覽地圖的習慣，這時便能發揮莫大作用。\n\n### 無法如期完成預定的工作\n\n有時計畫趕不上變化，無法如期完成預定的工作，這時就得判斷究竟要「留下來加班？」還是「留到明天繼續完成」。\n\
    \n不妨依明天的工作量的判斷。若明天的工作量比較少，時間充裕的話，挪後處理當然沒問題。\n\n相反地，要是工作量比今天還多，就沒辦法挪後處理了。勢必得決定留下來加班還是暫時中止某件工作。若明天很忙，今天就得多努力些，就像有種和「自己協商」的感覺。\n\
    \n### 別人的預定計畫變更，也會影響到自己！\n\n預定的計畫之所以會變更，不單是自己的問題，也有可能是受到上司排程變更的影響等因素。\n\n譬如自己的排程中有必須取得上司認可的工作，若上司適巧不在，可就傷腦筋了。因此上司排程有所變更時，務必確認自己的排程是否受影響。此外，平常最好留意上司哪一天不在辦公室，以因應突發狀況。\n\
    \n## 5 如何因應臨時新增活動？\n\n### 儘早將龐雜的工作「步驟化」\n\nPart 3、Part 4 所說明的「活動」，屬於規模較為龐雜的「工作」，處理這類工作前一定要先「步驟化」。若有活動臨時插進來，只要活用「步驟化」便能迅速處理完畢，當然也有不必急著處理的活動。\n\
    \n之所以將活動步驟化，除了方便確認要做哪些事，也能找出必須請教別人的問題，畢竟有些問題向別人請益，才能進行得更順利。\n\n另一個理由則是若沒有步驟化，很難想像總共需要花費多少時間。譬如原本以為兩天便能完成的工作，步驟化後發現得花費更長的時間也說不定，早點發現還能多點時間從容應付，以免手忙腳亂。\n\
    \n雖然依活動規模不同，多少有些差異，但大部分工作只需花個十分鐘便能完成步驟化。遇到臨時插進來的活動，只要予以「步驟化」，便能迅速處理完畢，多花個十分鐘便能讓工作進行得更順利。\n\
    \n### 將工作和約定排進「時間地圖」\n\n如同 Part 4 的說明，使用「料理型」或「購物型」步驟法都可以，務必將「步驟化」的結果，也就是工作內容和約定事項排進自己的「時間地圖」。\n\
    \n不管步驟化再怎麼完善，要是沒有將步驟化的結果納入排程表，很有可能會忘了處理，因此一定要隨手記下來。\n\n若步驟過於複雜，不妨先思考一番再排進「時間地圖」；若步驟還算簡單，可以邊思考邊排進「時間地圖」。\n\
    \n像是必須花費好幾週、甚至好幾個月，規模較為龐雜的計畫，就要像 Part 6 所說明的，將工作內容列在「專案地圖」上。這時先整合「專案地圖」上的情報（工作和約定），再排進「時間地圖」。\n\
    \n## 6 如何因應滿檔工作？\n\n### 如何解決工作太多，窮於應付的窘況\n\n邊質疑時間是否充裕，邊瀏覽「時間地圖」，才能察覺哪一天工作量大過多，找出解決對策。但要是整體工作量大過多，就不適用這方法，必須另見對策。\n\
    \n提升工作效率是解決工作量大過多的一種方法，意即邊審視工作流程，邊活用電腦讓部分工作自動化的意思。\n\n雖說如此，深感困惑或遇到突發狀況時，還是會不知所措，所以平時最好累積相關經驗，才能因應不時之需。\n\
    \n### 有時必須懂得「託付」與「拒絕」\n\n這裡有兩種方法，一種是將部分工作委託他人，一種是明白拒絕。\n\n畢竟一個人的時間有限，不可能什麼事都一手全攬，懂得委託與拒絕，就管理工作來說也是一種負責的表現。\n\
    \n你是否有過接受別人的委託，卻搞得自己忙不過來的經驗呢？若時常這樣就必須注意了。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_145_0.png)\n\
    \n雖說是受人之託，但不考慮自身狀況，一味地答應，難保會落到不負責任的下場。比起凡事親力而為，結果耽誤工作進度，不如減少工作量，確實處理好每一件事。因此有時必須請別人協助，也要懂得拒絕。\n\
    \n還有一點要特別注意，那就是無論是請別人協助，還是明白拒絕，一定要給對方充分的時間準備。也就是說，儘可能地早點做決定，才不會造成對方的困擾，當然也是為了自己好。\n\
    \n臨時插進約定和工作時，一定要瀏覽「時間地圖」，才能儘快想出因應之道，也能儘早判斷究竟是要「委託他人」還是明白「拒絕」。\n\n### 1 分鐘掌握重點！\n\
    \n#### 如何判斷工作該選擇委託他人，還是明白拒絕？\n\n這兩件事絕非個人主觀所能決定。若每個人都是因為「討厭這件工作而委託別人」，或是「因為這件工作不好處理而拒絕」，工作便成了一件棘手的事。\n\
    \n儘可能地抱持客觀心態判斷（以第三者觀點），也就是說考量整體組織做出判斷的意思。抱持這種觀點才能避免流於意氣用事。\n\n## 7 如何活用空檔時間？\n\
    \n### 預留瀏覽「專案地圖」的時間\n\n唯有養成 Part 6 提到的「瀏覽專案地圖」的習慣，才能利用空檔時間處理一些工作。\n\n想要達成長期目標，平常就得養成瀏覽長期排程的習慣，配合週排程對照效果更好。\n\
    \n就算每天會瀏覽週排程，卻往往忘了瀏覽長期排程，因此養成每天瀏覽「專案地圖」的習慣，才能避免這種情況發生。\n\n同時審視「時間地圖」與「專案地圖」，確認「計畫是否如期進行？」、「企劃項目是否已經排進本週或下週的排程？」等，才能有效地達成長期目標。就算一天只花一分鐘也沒關係，持之以恆就對了。\n\
    \n基本上，人們往往比較注意近期的事而忽略遠一點的事。訓練自己放遠眼光，絕對能提升自我實力。\n\n### 審視明天的排程\n\n結束忙碌的一天後還要做一件事，那就是確認明天的排程。\n\
    \n活用本書介紹的「時間地圖」，明天排了什麼約定和工作就能一目了然。下班回家前審視一遍排程，確認明天「時間是否足夠」，確定「自己一定辦得到」（若沒自信辦得到，表示工作量不勝負荷）。\n\
    \n確認這些事其實花不了多少時間，卻能產生莫大效果。一想到明天的工作「一切 OK」，彷彿吃了顆定心丸，也能避免公事干擾私人時間，確實達到公私分明的均衡生活。\n\
    \n也許你會覺得這麼一個動作能讓自己安心，有些不可思議。建議務必一試，絕對能讓你體驗到絕佳的效果。\n\n## Part 7 總整理\n\n### 活用「時間地圖」落實時間管理\n\
    \n#### 早上要做的第一件事\n\n- 首先翻開記事本：確認今天要做哪些事。\n- 將記事本攤開放在一旁：攤開寫有「時間地圖」記事本，隨時都瞧得見。\n\
    \n#### 邊處理工作邊進行的事\n\n- 準備工作前先留意一下時間：估算工作所需時間，決定什麼時候完成。\n- 確認已完成的工作：確認工作是否確實完成。\n\
    \n#### 臨時插進新工作時的處理方式\n\n- 養成今日事，今日畢的習慣：能夠馬上處理完畢的工作，不要留到明天。避免安排過多計畫，這些都是時間管理的訣竅。\n\
    - 順手記下那至日後實行的約定和工作內容：不管是約定還是工作，一定要「順手記下來」。花十秒就能搞定的一個動作，千萬別想著以後再做。秉持「填字遊戲原則」，衡量工作量和。\n\
    \n#### 預定計畫變更時的處理方式\n\n- 發生突發狀況！：首先掌握狀況，邊看「時間地圖」邊判斷。\n- 預定工作處理不完！：和「明天的自己」協商是否留下來加班。\n\
    - 周遭人的預定計畫變更！：確認自己的預定計畫是否跟著變更。\n\n#### 臨時增加活動時的處理方式\n\n- 儘早「步驟化」：就算是不急著處理的工作，也要儘早步驟化。花個十分鐘便能大幅提升工作效率。\n\
    - 將工作和約定排進「時間地圖」：無論是活動還是計畫都要排進「時間地圖」。\n\n#### 工作滿檔時的處理方式\n\n- 提高工作效率：平時養成各種良好習慣，才能有效提升工作效率。\n\
    - 有時也必須懂得「委託他人」或「明白拒絕」：為了確實處理每件工作，有時必須懂得委託他人或明白拒絕，減少工作量，才是負責任的態度。\n\n#### 如何活用空檔時間\n\
    \n- 預留瀏覽「專案地圖」的時間：就算每天只花一分鐘也行，務必確認「專案地圖」的必要項目是否已排進「時間地圖」。\n- 審視明天的工作排程：下班前審視一下明天有哪些約定和工作，確認明天「時間是否足夠」，確定「自己一定辦得到」。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_149_0.png)\n\n## 如何活用群組軟體？\n\n### 群組軟體的優缺點\n\
    \n雖然記事本或電腦都可以用來製作「時間地圖」這個時間管理工具，但大多數人還是覺得使用記事本比較方便，畢竟電腦較適用於管理約定，不太適用於管理工作。\n\n\
    電腦當然有其便利之處，那就是資源共享功能，稱為「群組軟體」（Groupware）。群組軟體（譯註）具有可同時確認多人的工作排程、設定會議等約定的功能，但群組軟體較不適用於管理工作就是了。\n\
    \n### 群組軟體的使用方法①\n\n第一個就是用於記事本上的「時間地圖」，只有約定需要同時記在記事本與群組軟體上。這麼一來，記事本就成了「時間地圖」，統整所有約定與工作。\n\
    \n記事本與群組軟體的內容務求一致，記錄於軟體上的約定，同時也要寫在記事本上（若不做這樣的話，會被人誤植其他約定也沒不定）。雖然這樣做較為瑣碎，但是一道必要的工夫。\n\
    \n### 群組軟體的使用方法②\n\n第二個是使用群組軟體管理約定，再以清單管理工作（工作務必依日期標記），這麼一來就不用花時間記錄約定了。\n\n但有一點要注意，那就是這麼一來便無法統整「時間地圖」上的情報。若沒瀏覽一遍約定便追加工作，或是沒瞭解工作量便追加約定的話，也許會訂立出根本無法徹底實行的計畫。因此使用這方法時，一定要同時確認群組軟體與工作清單。\n\
    \n### 群組軟體的使用方法③\n\n第三個是將決定好的工作時間同步登錄群組軟體。這麼一來，便能利用群組軟體整合「時間地圖」。\n\n就連只需花個幾分鐘的工作也得登錄，多少有些瑣碎，也很難區別哪些工作已經完成，哪些工作尚未完成，因此這方法不適用於手邊瑣事較多的人。\n\
    \n> 譯註：群組軟體是一種電腦應用軟體，結合電子郵件、行事曆分享、工作管理等功能，例如微軟的 Exchange Server 2010。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_151_0.png)\n\
    \n## Part 8 強化「行動」的念頭！\n\n### 改掉拖拖拉拉的毛病\n\n#### 1 你是否為拖拖拉拉的毛病所苦？\n\n做事總是愛拖拖拉拉……\n\
    \n明明下定決心「今天要做這件事」……\n\n卻遲遲提不起勁，再三拖延。\n\n待期限逼近才慌張地處理，你是否也有此經驗呢？\n\n這樣的行為就叫做「拖拖拉拉毛病」，事實上蠻多因為**所苦\n\
    \n這種毛病有以下特徵：\n\n- 「明知再不做就來不及了，但就是提不起勁。」\n- 「非得等到火燒屁股了（完成期限逼近），才開始行動。」\n\n總是等到期限逼近才行動，稱不上是有計劃的行動，而且一直處於這種狀況會讓人覺得疲累不堪吧。\n\
    \n一定有很多人想急於改掉這種毛病，你是否也是如此呢？\n\n若你也有這種壞毛病，請思考以下問題。\n\n#### 2 為何會有拖拖拉拉的毛病呢？\n\n\
    ##### 做事拖拖拉拉的原因\n\n「這件工作非做不可」明明下定決心，卻遲遲提不起勁……。這就是典型的拖拖拉拉毛病。\n\n和猶豫要不要向喜歡的人告白一事很像，不是嗎？明明決心「告白」卻臨陣退縮，一方面也是怕遭到對方拒絕，就這樣陷入兩難的窘境。\n\
    \n心理學上稱這種情況為「接近與迴避之間的糾葛」。明明想接近對方，卻又害怕遭拒，始終下不了決心。\n\n老是拖拖拉拉的毛病和這情況十分相似，總是徘徊於「做」與「（現在）不想做」這兩個念頭之間。\n\
    \n##### 迫使自己儘早行動\n\n然而做事老是拖拖拉拉的人，一旦火燒屁股又能落實行動，這是為什麼呢？\n\n因為「想做」與「不想做」這兩個念頭的平衡產生變化的緣故。\n\
    \n心想離期限還有段時間，「不想做」比「想做」的念頭來得強烈，以致於遲遲提不起勁。一旦期限逼近，「想做（要是再不做就錯了）」的念頭又變強，可見只要這兩個念頭的強度相反就會促使行動。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_157_0.png)\n\n那麼，該如何讓這兩個念頭產生變化呢？如下圖，只要讓「想做」的念頭稍微強一點，「不想做」的念頭稍微弱一些，便能迫使自己儘早行動。稍微改變念頭便能改善拖拖拉拉的毛病。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_157_1.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_157_2.png)\n\
    \n##### 善用「時間地圖」改善拖拖拉拉毛病\n\n活用「時間地圖」來改善\n\n本書介紹的時間管理能有效改善拖拖拉拉的毛病，尤其是細分規模較為龐雜的工作，效果更好。\n\
    \n舉個關於食物的例子吧。規定自己「十天後要吃完一盒蛋（十顆）」。一想到這目標的期限是十天後總覺得還早，是吧？正因為離期限還早，所以會有「今天不想吃」留到明天再吃的念頭。\n\
    \n若將這件事分成十天份，每天吃一顆，就比較不會拖拖拉拉了。\n\n這方法又稱為「瑞士起司法」，是招十分典型的時間管理法。以在起司上一點一點地挖洞孔，最後便能輕鬆吃完為譬喻\
    \ * 。\n\n「時間地圖」之所以能改善毛病理由有二，一是將規模龐雜的工作逐一分解，原本十天後的期限改以一天為單位，加強「今天就做到這裡」的念頭。\n\n\
    > * 其實起司上一點一點的洞孔不是人為挖的，是因為氣泡的關係。\n\n#### 將工作細分化，有效改善拖拖拉拉的毛病\n\n反正離期限還有段時間，不用急著吃……\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_159_0.png)\n\n只吃今天的份吧！\n\n![](img/87569369e8074c65e7c56ecade1ddea0_159_1.png)\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_159_2.png)\n\n另一個理由則是改變對工作量的感覺。將「必須吃掉十顆」改成「今天只吃一顆」，感覺工作量減少（總數並沒變），「（現在）不想做」的念頭便減弱。\n\
    \n如同 Part 6 所說明的，將專案和活動等規模較為龐雜的工作細分化，也能達到同樣效果，足見活用「時間地圖」能改善拖拖拉拉的毛病。\n\n#### 4\
    \ 影響拖拖拉拉毛病的思考方式\n\n##### 預防萌生拖拖拉拉的念頭\n\n「時間地圖」能有效改善拖拖拉拉的毛病，若能更瞭解前述所說的兩個念頭，不但效果加倍，還能廣泛運用於各方面。\n\
    \n如同前述，「想做」和「不想做」這兩個念頭與未來和現在有關。意即為了得到未來的結果而萌生「想做」的念頭，以及重視現在的心情，因而萌生「不想做」的念頭。\n\
    \n這兩種念頭又分別細分為兩種（合計四種）。\n\n「未來志向」＝想做：想行動的念頭\n\n- 「要是（何時）不做的話就糟了」的念頭\n  - （必須遵守完成期限）\n\
    - 「要是（何時）做的話就會很開心」的念頭\n  - （想達成目標，想早點解脫）\n\n「當下志向」＝不想做：現在只想落個輕鬆的念頭\n\n- 「（現在）不想做」的念頭\n\
    \  - （避開麻煩、討厭的事）\n- 「（現在）想做別的事」的念頭\n  - （想做別的事，讓自己更輕鬆）\n\n#### 5 改善拖拖拉拉毛病的思考方式（強化篇）\n\
    \n##### 改善拖拖拉拉毛病的思考方式①\n\n###### 未來志向·痛苦指數：強化「要是（何時）不做的話就糟了」的念頭\n\n「要是不做的話就糟了」有此自覺可以改善拖拖拉拉的毛病，多多思考未來的排程絕對有效。\n\
    \n但人難免有怠惰之心，有時就是不想做什麼事，這時不妨下意識地盯著「時間地圖」。停下手邊工作，花點時間瀏覽時間地圖。這麼一來，內心會湧起一股「非做不可」的衝勁。\n\
    \n要是不做的話就糟了！\n\n![](img/87569369e8074c65e7c56ecade1ddea0_162_0.png)\n\n**改善拖拖拉拉毛病的訣竅**\n\
    \n- 下意識地審視工作資料。\n- 下意識地審視排程（時間地圖）。\n- 試想這件事要是一直拖過今天、明天、後天，會如何呢？\n- 試想如果進度延誤，會造成誰的困擾呢？\n\
    \n##### 改善拖拖拉拉毛病的思考方式②\n\n###### 強化「要是（何時）做的話就會很開心」的念頭\n\n將「今天不想做」的工作變成「要是做的話就會很開心」的工作，這念頭也是改善拖拖拉拉毛病的方。法之一。\n\
    \n若有件工作遲遲未進行，不妨先停下手邊工作，想像完成這件工作後會是這麼輕鬆。越是不想碰觸的工作，完成後心情越是輕鬆，想像這般心情便能強化「要是做的話就會很開心」的念頭。\n\
    \n此外，完成工作後放鬆一下也很有效。\n\n像是「做完這件事後，看場電影吧」或是「做完這件事後，開瓶酒慶祝一下吧」等，稍微「犒賞一下自己」。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_163_0.png)\n\
    \n**改善拖拖拉拉毛病的訣竅**\n\n- 想像做完這件事後多麼輕鬆。\n- 想像早點做完這件事便能回家。\n- 完成工作後，稍微犒賞一下自己。\n- 想想完成這件工作後，誰最開心。\n\
    \n##### 改善拖拖拉拉毛病的思考方式（削弱篇）\n\n###### 改善拖拖拉拉毛病的思考方式③：削弱「（現在）不想做」的念頭\n\n削弱「（現在）不想做」的念頭，不但能改善拖拖拉拉的毛病，也能有效地細分工作。譬如吃完「一盒蛋」很困難，但一天吃一顆就輕鬆多了，這就是削弱「不想做」的念頭。\n\
    \n若打算將工作挪後，必須更細分工作內容，要是排不進「時間地圖」，可以記在別的地方，然後逐一處理。只要花點心思便能削弱「不想做」的念頭，慢慢地重拾幹勁。\n\
    \n現在不想做時\n\n![](img/87569369e8074c65e7c56ecade1ddea0_164_0.png)\n\n**改善拖拖拉拉毛病的訣竅**\n\
    \n- 細分工作，一開始只做一件事。\n- 花個五分鐘細分工作。\n- 試著做些準備工夫。\n- 告訴自己「就算失敗也沒什麼大不了了」。\n- 別勉強自己「非做到最好不可」。\n"
