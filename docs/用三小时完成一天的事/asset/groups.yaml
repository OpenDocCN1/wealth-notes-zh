    活用「時間地圖」實行計畫


    # 6 只要花個十秒 就能大幅提升實力！


    ## 每天習慣「看」一下，讓行動更有計畫


    「實行」能讓「時間地圖」變得有意義，所以好不容易訂立的計畫，千萬別忘了實行。明明早已決定「今天要做這件工作」，卻一直忙別的事，等想起來時，已經來不及了。相信大家或多或少都有這樣經驗。


    又好比上網查資料，一查便查了好長一段時間。為了避免被預定外的事佔據太多時間，這時瞄一眼「時間地圖」便能想起「今天該做些什麼」。


    不偏離事先決定好的排程，才能有計畫地行動。意即不忘記該做些什麼，善用「時間地圖」。


    「時間地圖」上寫有明天之後的預定排程，但先別管那些，專注於今天的工作就對了。反覆確認今天的約定和工作，養成「邊看邊工作」的習慣。在 Part 1 已說明「瀏覽」這動作和「實行」一事是息息相關的。


    ## 養成不時「瀏覽」的習慣


    一早攤開「時間地圖」才能養成不時「瀏覽」的習慣。藉由每天早上確認「今天要做些什麼」，才能養成「瀏覽」的習慣。


    當手上有好幾個工作時，思考當天的工作流程，依照自己做起來最順手的流程實行就可以了。每實行一項約定或工作，最好瀏覽一下「時間地圖」，確認下一件待辦的事。


    每個人喜好的工作流程都不一樣。有些人喜歡從簡單的工作開始，有些人則偏好從較為困難、重要的事著手，所以只要照著自己認為最順手的方式進行就沒錯。


    只要切實「審視」計畫，就能避免今日事，無法今日畢的情形。但工作上難免會有突發狀況，必須變更預定排程，這時就得思考哪一項工作比較能夠挪後進行，變更實行日。


    當然還要確認哪些工作已經完成，瞭解哪些工作尚未完成，避免疏漏。


