    # Part 2 總整理


    ## 使用時間地圖，實行「三大習慣」


    ![](img/87569369e8074c65e7c56ecade1ddea0_50_0.png)


    **約定（appointment）的特徵**

    - 切實遵守時間（如上課一樣）

    - 同一時間內避免安排兩項約定


    **寫下約定時的注意事項**

    - 確認是否有空檔，才安排新約定

    - 移動時必須花費的時間也要一併考慮

    - 將預定好的時間畫線框起來

    - 當場寫下來


    **工作（task）的特徵**

    - 時間自由（和寫作業一樣）

    - 利用沒有約定的空檔時間實行


    **寫下工作時的要點**

    - 思考何時進行（何時能夠進行），決定實行日期

    - 寫下何時實行的日期

    - 加上確認是否完成的小方格

    - 當場寫下來


    ![](img/87569369e8074c65e7c56ecade1ddea0_51_0.png)


    避免計畫過多，負荷不了的訣竅


    - 追加約定時，必須考慮少了「框線外的時間」，是否能如期完成工作。

    - 追加工作時，必須考慮利用「框線外的時間」，是否能如期完成工作。


    要是無法如期完成的話：

    - 千萬別再追加新工作或約定

    - 將工作或約定事項挪至他日


    ## 時間活用秘技④ 時間管理的要訣就是「整合」


    介紹了許多關於時間管理的基本概念，覺得如何呢？是否覺得比想像中來得簡單？也許簡單到讓你嚇一跳吧。


    然而簡單的事往往是最重要的事。


    有許多管理工作的方法，像是利用記事本或電腦列出工作清單，發 mail 傳送工作清單到自己的手機，或用便利貼貼在明顯的地方提醒自己等，都是管理工作的 方式。


    正因為方法五花八門，找出最適合自己的方式才能切實管理好工作。


    但事實往往並非如此，過於分散的管理方式只會徒增管理的方式，無法持之以恆。


    工作計畫是自己今後將如何使用時間的的預定表。若計畫過於分散，除了得花時間整合，也容易發生疏漏。


    这和同時使用三、四本家計簿，這裡記一筆，那裡記一筆，結果難以確認這個月的收支情形是一樣的。


    此外，記錄工作計畫的情報過於分散，確認工作進度相對費時，也是「感覺時間不够用」的原因之一。


    況且，事情一忙碌起來難免有疏漏，等到你發現時往往來不及彌補了。


    因此，整合約定和工作計畫是件非常簡單，卻又十分重要的事。


    只要養成「寫」和「瀏覽」的習慣，便能輕鬆地實行，說是世界上最簡單的時間管理方法也不為過。（事實上，我調查過許多方法，再也找不到比這個更簡單的了）。


    一旦決定「要做」什麼，只要花個十秒寫下來就行了。


    同樣地，完成一件工作時，花個十秒審視就 OK 了。


    這個習慣可以讓你的工作情況改變不少，請務必試一試。


