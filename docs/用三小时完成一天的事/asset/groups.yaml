  - '[PAGE 182]


    # 5 誰是這段時間的主人？

    思考「時間所有權」


    # 如何才能少加點班呢？


    即使努力工作，每天還是得加班……你是否經常抱著這樣的煩惱？其實只要稍微改變對時間的看法就行了。


    想說「今天六點以前搞定」，結果可能沒辦法如期完成，這種情況可說屢見不鮮。就這樣徘徊於「想辦法在時間內完成」和「反正免不了又要加班，就慢慢做吧！」這兩種迷思中。也有可能是因為中途插進什麼無關緊要的工作，結果沒辦法如期結束。


    於是越來越難掌控自己的時間，這時不能再抱著「無所謂」的心態面對，唯有意識到所謂的「時間所有權」才能根本解決問題。


    # 思考「時間所有權」


    就算很想「減少加班時間」，也會勉強自己「加油吧」、「再忍耐一下吧」，輕易地妥協。'
  - '[PAGE 183]


    若「下班後還有約會」的話，怎麼辦呢？總得想辦法趕快做完，不是嗎？


    遇到這種情況時，最好的辦法就是集中注意力，想辦法完成工作。一想到和別人有約，「想趕快完成工作」的念頭就會越強烈。


    均衡分配時間是有訣竅的。若想多點和家人相處的時間，不妨訂下「八點以後是和家人相處的時間」，這段時間的「所有權」不只屬於自己，是和家人共有。這麼一來就會告訴自己：「不能因為個人因素，減少全家人相處的時間，所以絕不能加班」，也許這麼想多少會給自己壓力，但的確能有效減少加班時間。


    又好比學習英語會話，比起在家自修，下班後上補習班補習，「和別人一起學習」的效果更好。若實在抽不出時間補習，將每天的學習進度貼上部落格與人分享，也是一種方法。


    此外，若有志同道合的同伴，也可以三不五時地團聚。這麼一來，就會約束自己「今天不能加班」，養成集中精神專注工作的習慣。


    ![](img/87569369e8074c65e7c56ecade1ddea0_183_0.png)'
  - '[PAGE 184]


    # ## 6 現在的時間是用來投資將來


    思考對「將來的投資」


    就某種意味來說，花在讀書與學習技藝的時間都是一種對將來的投資。同樣地，為了開發新客戶所做的業務活動，或為了開發新產品所做的產品研究，發想新事業等，都是一種對將來的投資。


    這些對我們而言都是不可或缺的東西。為什麼呢？因為現在是各行各業競爭激烈、瞬息萬變的時代，越來越無法靠一招半式走天下。也就是說，不只專注於眼前的工作，對於未來也要有些準備與籌畫，這是每個人都必須面對的問題。


    如前面所述，將工作時間標記在「時間地圖」上，便能明瞭時間分配情況。利用這方法也能計算自己用於「投資未來」的時間比率。


    譬如從事研發工作的人，為了研發新產品，一定得花些時間學習新技術。假設一週工作四十小時，加總時間數乘以2.5，便能得出所佔比率。'
  - '[PAGE 185]


    或是利用私人時間讀書，則是用「自己的所有活動時間（扣除睡眠時間）」計算*，瞭解自己對「將來的投資」究竟花了多少時間。


    # ### 投資10%的時間，自我充實


    當然不可能老想著將來的事來行動，也得花些時間關心現在的工作和生活，那麼到底該花多時間用於對「將來的投資」呢？


    以企業為例，有些企業會訂出一定比率的研發時間。像是以製作便利貼聞名的美國 3M公司所訂的比率為15%，知名的網絡搜索引擎Google將研發時間訂為20%。由此看來，個人用於「對將來的投資」時間比率應以15%以上為理想目標，最起碼也要訂為10%以上。其實不少社會人士考量未來發展，都會花個10%以上的時間充實自我。


    建議不妨以超過10%為目標，騰出自我充實的時間。


    ![](img/87569369e8074c65e7c56ecade1ddea0_185_0.png)


    *自我充實的時間比率算法：


    若睡眠時間為八小時，加總時間乘以0.9，便得出百分比（例如一週唸書十小時的話，就是9%）。若睡眠時間五～七小時，乘以0.8；以下乘以0.7的話，便能粗略地地計算出比率。'
  md: "\n## 改善拖拉毛病的思考方式④\n### 削弱「(現在) 想做別的事」的念頭\n\n有時因為「不想做」某件事，而選擇做別的事。譬如明知晚上必須唸書，卻動手打掃房間。\n\
    \n避免分心才能削弱「想做別的事」的念頭。像是規定自己一定要處理完手邊的事，或進行到一個段落才能上網等。因為注意力隨時都有可能轉移到其他事物上，盡量遠離這些事物就對了。\n\
    \n# 現在想做別的事\n\n![](img/87569369e8074c65e7c56ecade1ddea0_165_0.png)\n\n# 改善拖拉毛病的訣竅\n\
    \n- 規定自己一個鐘頭不能離開座位。\n- 把「會讓自己感興趣的東西」藏起來：\n  - 會讓自己感興趣的書籍收起來\n  - 關閉電子郵件\n  - 關閉網路\n\
    - 帶著工作資料窩進會議室或咖啡館。\n  - (找一處不會分心的地方)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_166_0.png)\n\
    \n# 應付拖拖拉拉毛病的妙招\n## 利用專注力提升效果\n\n前面介紹了許多改善拖拖拉拉毛病的方法，不過這毛病也有優點，那就是完成期限迫近，便會更加專注於工作。逆勢操作，這效果也能成為應付拖拖拉拉毛病的秘招。\n\
    \n想處理一再拖延的工作，卻遲遲無法集中心神，也沒什麼靈感。這時不妨先處理其他工作也是一招方法，像是收發電子郵件、打電話等，先處理一些聯絡事項。\n\n如此一來，便除去了所有會妨礙工作進行的事物，而且剛處理完這些瑣碎的工作時，能浮現什麼靈感也說不定。\n\
    \n再加上完成期限迫近，不得不集中心神處理，這時若有其他工作或電話打擾，勢必會影響進度。及早解決會打擾到工作的事物，才能心無旁騖地安心工作。\n\n這個方法不失為提升注意力，順利完成工作的一招訣竅。就某種意味而言，也是種逆向操作。\n\
    \n但也可能會給自己帶來莫大壓力，好比發生什麼突發狀況，趕不上完成期限等，算是一記險招，實行時務必多加小心。\n\n還有一點必須注意，畢竟這方法往往得面對迫在眉睫的壓力，要是起步太晚的話，可能會造成無法挽回的局面，所以要是沒辦法掌握情況，或缺乏經驗的工作，還是別用這招比較好。\n\
    \n## Part 8\n> 1分鐘掌握重點！\n\n# 自訂一段能集中精神的時間\n\n這裡介紹的是先處理瑣事，不讓這些事妨礙工作進度的方法，但這方法和改善拖拉毛病的「訣竅」無關，純粹為了提升工作效率。\n\
    \n知名內衣企業「黛安芬」還特地空出一段讓員工集中精神的時間，稱為「加油時間」。\n\n一天兩小時的「加油時間」中，嚴禁打電話、交談。這段時間必須集中心神工作，提升效率。就算無法做到這般程度，也要規定自己「專心工作，不收發mail」，試著自訂一段「加油時間」吧！\n\
    \n# Part 8 總整理\n\n## 改善拖拖拉拉毛病的思考方式\n\n### 強化「想做」的念頭\n\n- **要是不做的話 就糟了！**\n  -\
    \ 改善拖拖拉拉毛病的訣竅\n    - 下意識地審視工作資料。\n    - 下意識地審視排程（時間地圖）。\n    - 試想這件事要是一直拖過今天、明天、後天會如何呢？\n\
    \    - 試想如果進度延誤會造成誰的困擾呢？\n\n- **要是做的話 就會很開心**\n  - 改善拖拖拉拉毛病的訣竅\n    - 想像做完這件事後多麼輕鬆。\n\
    \    - 想像早點做完這件事便能回家。\n    - 完成工作後，稍微犒賞一下自己。\n    - 想想完成這件工作後，誰最開心。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_168_0.png)\n\
    \n### 削弱「不想做」的念頭\n\n| 狀態 | 改善拖拖拉拉毛病的訣竅 |\n| :--- | :--- |\n| 現在不想做 | - 細分工作，一開始只做一件事。<br>-\
    \ 花個五分鐘細分工作。<br>- 試著做些準備工夫。<br>- 告訴自己「就算失敗也沒什麼大不了」。<br>- 別勉強自己「非做到最好不可」。 |\n|\
    \ 現在想做別的事 | - 規定自己一個鐘頭不能離開座位。<br>- 把「會讓自己感興趣的東西」藏起來：<br>  · 會讓自己感興趣的書籍收起來<br>\
    \  · 關閉電子郵件<br>  · 關閉網路<br>- 帶著工作資料窩進會議室或咖啡館。（找一處不會分心的地方） |\n\nPart 1~7 介紹的內容可以加以運用，如下：\n\
    \n- 如何將工作步驟化、細分化\n- 決定何時開始處理細分後的工作\n- 瀏覽標記在「時間地圖」上的事項（想像之後要做的事）\n\n這些訣竅都能有效改善「拖拉拖拉的毛病」！\n\
    \n# 活用各種訣竅，克服拖拖拉拉的毛病\n\n不管是意志多麼堅強的人，還是沒什麼慾望野心的人，多少都會有拖拖拉拉的毛病，不是嗎？看來這毛病還真是棘手啊。\n\
    \n之所以會有這毛病，都是源自自己內心的問題，想要根治不是件容易的事。\n\n想要徹底改掉這毛病，根本是不可能的任務，就連我自己多少也會犯這毛病。\n\n\
    勢必得花點心思，儘可能地防患未然。\n\n老是認為「這毛病治不好」的念頭，搞不好是免受這毛病困擾的一記秘訣。\n\n心想「反正這毛病治得好」，結果做事拖拖拉拉的，這時就會反省：「這樣下去不行」、「下次一定不能再犯」或是「換個心情重新出發吧」。但這樣的反省只是暫時性的，維持不了多久。\n\
    \n一定要從各方面檢討，逐步改善才行，也就是 Part 8 介紹的「四種思考方式」。\n\n想想這四種思考方式中，哪一種是你從來沒萌生的想法呢？人在面臨困境時，想法往往十分偏頗（我也是）。認識四種思考方式，學習靈活運用，也許就能找到一個意外的缺口，突破困境。畢竟意外之事往往能產生令人詫異的效果。\n\
    \n相信大家都聽過伊索寓言裡知名的童話故事「北風與太陽」吧。後來北風輸給了太陽。「四種思考方式」不是互相競爭，而是相互合作，才能有效改善拖拖拉拉的毛病。\n\
    \n抱持「加油」、「非做不可」的決心固然重要，但有時轉個念頭，活用各種訣竅更能克服拖拖拉拉的毛病。\n\n當然，還請務必好好地活用「時間地圖」。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_171_0.png)\n\
    \n## Part 9\n# 做自己時間的主人！\n\n# 工作與私人時間均衡分配活用法\n\n## 考量公私的時間分配 是否均衡\n### 如何兼顧公私時間分配\n\
    \n前面主要都是介紹使用「時間地圖」訂立計畫的方法。如同前述，養成「訂立計畫」、「審視」和「實行」等習慣，便能活用時間。\n\n還有一個要點，那就是考量如何達到「時間均衡」。並非思考每一項約定和工作的計畫，而是綜觀整體時間，從中求取平衡。\n\
    \n聽聞「時間均衡」這字眼，馬上會聯想到如何兼顧工作與私人時間*，也就是所謂的「work-life balance」。\n\n公私的時間分配是否均衡沒有一定標準，譬如有些人熱愛工作，會投注大量心力在工作上；相反地，也有人為了家人和興趣，盡量減少工作時間，甚至有人將工作時間分為正職與兼差兩個時段。不管哪一種形式，只要是當事人真正想要的生活，就能樂在其中。\n\
    \n*如果是學生的情形，相當於課業和課業以外的活動（例如社團活動、興趣嗜好等）的區分。\n\n若對現在的時間分配狀況不甚滿意，或是有什麼無法認同的地方，就得設法改變現況。\n\
    \n雖然不太滿意現況，但未來或許會改變，唯有瞭解自己的時間分配狀況才知道該如何改善。\n\n## 從短期與長期觀點來看「時間均衡」\n\n除了上述觀點，還能從短期與長期觀點來看「時間均衡」。假設將為了生活必須工作的時間視為短期，那為了提升技能而學習的時間便屬於長期。\n\
    \n又好比和客戶接洽（短期），開發新客戶（長期）、開發新商品（短期）以及研發產品（長期）等，都能套用這個觀點。\n\n足見短期與長期的均衡標準並沒有一定的標準。但基本上，人總是比較注意短期方面的事。「眼前的事都已經忙不完，哪還管得了以後的事啊！」也許你也有過這種感觸吧。其實不只你，大部分的人都有此經驗。未免將來後悔，更應好好考量如何達到時間均衡。\n\
    \n## 2 簡單的時間分配計算方法\n### 重新審視「時間地圖」\n\n清楚自己如何分配時間，才能瞭解時間分配是否均衡。其實很多人都不瞭解自己如何分配時間，也不明白時間均衡的重要性，這時必須重新審視自己的時間地圖。\n\
    \n建議最好以週為單位考量時間均衡。譬如一天有二十四小時，一週有一百六十八小時（含睡眠時間）。\n\n一小時約為一週的0.6%*。將工作時數乘以0.6，便算出佔整體的比率。譬如一週工作四十小時，工作時數約佔一週的24%。出乎意料地少，是吧？\n\
    \n通勤時間也可按照這方式計算。譬如單程一趟一小時半，一週上班五天，合計約十五小時，約佔9%。通勤時間竟然佔了這麼大的比重，很意外吧？\n\n其他像是睡眠時間、生活瑣事以及私人娛樂時間等，所佔的比重又如何？首先瞭解自己平常如何分配時間就對了。\n\
    \n* 1/168 = 0.00595……換算成百分比，約0.6。\n\n## 重新審視自己的時間分配是否均衡\n\n| | 週一 | 週二 | 週三 |\
