  - '[PAGE 178]


    # 3 充分活用時間，提升效率


    # 瞭解「工作」時間的分配情形


    工作時間也請求「時間均衡」。紀錄每件工作所需花費的時間，加總合計便能瞭解時間分配情形。當然運用「時間地圖」簡單地記錄一下就行了，不必每一筆都記得很詳細。


    「時間地圖」的時間欄上紀錄著各項約定，需要花費的時間便一目了然。同樣地，處理各項工作時（或處理完畢後），將處理時間記在時間欄上，然後將開始和結束時間劃線連起來，便曉得究竟花了多少時間。


    這麼一來，一週時間分配情況清清楚楚。若能仔細分析，將工作內容分類別類，更能有效率地計算時間。不過倒也不一定要做得這麼瑣碎，只要花點時間審視「時間地圖」就行了。


    重新審視自己的時間分配情況，多少會發現一些需要改進的地方。譬如有些工作處理起來比想像中來得費時，有些工作則不然。人通常不太記住自己做哪件工作花了多少時間，藉由重新審視往往會發現從沒注意過的事。'
  - '[PAGE 179]


    # 找出「過於費時」的工作


    譬如有些工作花費的時間過多，不妨改變處理方式，便能縮短處理時間。為了提升工作效率，減少浪費時間，一定要改善處理方式，尤其是那種必須耗費長時間處理的工作更是迫切。譬如原本得花十分鐘處理的工作，努力減少一半工時，一下子便能省下五分鐘。若原本得花兩小時處理的工作，一下子省了一小時，成效更大。而且這兩種工作影響整體的程度明顯不同*。


    大家都希望自己成為「善用時間的達人」，但能夠確實省時的人卻不多。藉由審視時間分配狀況，找出問題才是省時的捷徑。


    *像是一週內得反覆花個十分鐘處理的工作，只要改變處理方式也能大幅提升工作效率。


    ![](img/87569369e8074c65e7c56ecade1ddea0_179_0.png)'
  - '[PAGE 180]


    # ## 4 區分時間，

    ### 集中注意力！


    # 區分「工作時間」與「私人時間」


    「想多點時間唸書」、「想多點與家人相處的時間」、「想多點時間學些東西」，你是否也有過這些念頭呢？之所以會這麼想，往來是因為工作太忙，老是加班，導致壓力很大，無法兼顧公私。


    之所以「有加不完的班」是因為工作量超出工時。若不正視這個問題，永遠無法縮短工時，最有效的方法就是區分時間。


    一如前述，若一週工作四十小時，工作時間約佔一週的24%，其實比率並不高。要是平常不注意工作的安排，工作量很容易超出範圍。


    其實稍微花點心思改變「時間地圖」，便能提醒自己注意工時。首先劃線將開始工作時間和結束時間框起來，還有午休時間也要劃線框起來。這麼一來，便能區隔早上和下午的「工時範圍」。框起來後會發現用於工作的時間意外地少，是吧？沒錯，就是要自此自覺。'
  - '[PAGE 181]


    如同Part 7 所說明的，之所以用到像是「提升工作效率」、「將工作委託他人」、「明白拒絕」等方法，是因為意識到自己能用的時間量，下意識地告訴自己：「一定要在這段時間內完成」，如此必能有效地集中注意力。


