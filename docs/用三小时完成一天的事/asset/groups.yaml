    # ## 善用「時間地圖」改善拖拖拉拉毛病


    活用「時間地圖」來改善


    本書介紹的時間管理能有效改善拖拖拉拉的毛病，尤其是細分規模較為龐雜的工作，效果更好。


    舉個關於食物的例子吧。規定自己「十天後要吃完一盒蛋（十顆）」。一想到這目標的期限是十天後總覺得還早，是吧？正因為離期限還早，所以會有「今天不想吃」留到明天再吃的念頭。


    若將這件事分成十天份，每天吃一顆，就比較不會拖拖拉拉了。


    這方法又稱為「瑞士起司法」，是招十分典型的時間管理法。以在起司上一點一點地挖洞孔，最後便能輕鬆吃完為譬喻 * 。


    「時間地圖」之所以能改善毛病理由有二，一是將規模龐雜的工作逐一分解，原本十天後的期限改以一天為單位，加強「今天就做到這裡」的念頭。


    * 其實起司上一點一點的洞孔不是人為挖的，是因為氣泡的關係。'
