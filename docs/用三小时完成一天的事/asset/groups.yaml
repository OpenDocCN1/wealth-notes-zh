    也就是說，其實有很多人根本不瞭解什麼是均衡地分配時間。


    均衡分配時間並沒有什麼「固定規則」，完全依當時工作內容、個人狀況、年齡和職務等而定。就某種意味來說，也許是個需要一輩子探究的問題。


    瞭解自我時間分配，找出對策是非常重要的事，當然也不能少了審視這道工序。建議不時停下手邊工作，審視工作與私人時間的分配情況。


    還有一點很重要，除了力求時間分配均衡，也要懂得轉換心情。


    就算有加不完的班，只要懂得轉換心情便能減少壓力。


    就算不常加班，難免也會有需要轉換心情的時候，譬如下班後還掛記著工作，很容易累積壓力。


    如同Part 7 的說明，善用「時間地圖」能有效地轉換心情。活用「時間地圖」整理工作，「明天做也可以」、「下個禮拜做」'
