  - '[PAGE 34]


    # 1 計畫有兩種形式


    由時間決定的預定計畫，叫做「約定」


    「時間地圖」上的計畫有兩種，雖然都是「使用自己的時間做些什麼」，性質卻不一樣。


    一種是透過會議和洽商，由時間決定的計畫，好比在學校上課一事，完全取決於時間。


    這種預定計畫稱為「約定（appointment）」，一般稱為「排程管理」，也許你早就實行也說不定。


    不是由時間決定的計畫，叫做「工作」


    另一種是自己決定時間的計畫，像是書寫文件報告、收發郵件等獨立完成的作業，好比老師出的作業。雖然有期限，但何時著手取決在自己。


    一般稱這樣的預定計畫為「工作（task）」。工作無法和約定同時進行，必須利用沒有約定的空檔時間處理。'
