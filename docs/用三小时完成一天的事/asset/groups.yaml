    # 1 將各項工作整合在一张

    「專案地圖」


    # 將長期排程的「時間地圖」圖表化


    接下來，說明如何製作「專案地圖」。所謂「專案地圖」就是列出每「週」各項「計畫」應實行的事。以右圖長期排程版的「時間地圖」為例，雖然是格式簡單的圖表，但直向看，可以看到各專案的「流程與所需時間」；橫向看可以看到「這一週的工作量」（以週為劃分單位的「時間地圖」剛好相反）。


    如同Part 2 所說明，審視每週的「時間地圖」，決定何時進行工作時，一定要特別留意「這天時間到底夠不夠用」，也就是「填字遊戲原則」。


    使用「專案地圖」整合多項計畫的好處，在於就算是長期排程，也能以同樣觀點審視。由此可見，整合多項專案的情報是多麼重要的事。


    就算手上有多項專案必須處理，腦袋也只有一個，因此為了能夠落實執行專案，一定要妥善安排各週工作量。'
