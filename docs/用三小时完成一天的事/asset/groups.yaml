    # 時間活用秘技⊕  計畫是可以變更的


    # 專案的計畫也有必須更改的時候


    本書介紹如何訂立長期計畫的方法，當然實行長期計畫時，難免會遇到需要變更的時候。


    以想提升業績為例。為了達成目標推行了許多行銷活動，業績卻毫無起色，這時就必須思考其它對策。


    或是以我曾從事過的研發工作為例，也會遇到同樣的情形。訂下「研發能夠達成○○與□□性能的商品」為目標，思考了許多對策，也做了各種研究，但結果不如人意，有時還會出現意想不到的狀況，不得不重訂計畫，這就是「行動目標」與「成果目標」往往有所差異的道理。


    # 行動目標與成果目標


    所謂「行動目標」是以進行某項行動為目標。譬如業務員以「拜訪一千位新客戶」為行動目標，只要有所行動便能達成的目標。


    「成果目標」則是以達成某個成果為目標，而且達成目標的方法不只一種，也不見得一定能達成目標。


    要是察覺「就算照著計畫進行，也不一定能在期限內達成目標」時，就必須變更計畫。意即對「成果目標」而言，計畫並非絕對，當然也不是說不需要計畫，因為毫無計畫地進行，'
  - '[PAGE 113]


    只怕更得不到結果。


    # 達到成果目標的方法


    設定成果目標時，必須按照計畫進行並養成審視的習慣， 還要確認是否有所成果。這和準備升學考時，有模擬考能讓我們瞭解自己準備的狀況，若成績不甚理想，就必須改變讀書方法。


    視計畫而定，有時就算每天確認，三個月後也不見得能達成目標，因此一定要保留確認狀況的時間。可以事先設定確認時間，或是在達成最終目標前，先決定階段性目標與達成時期。建議挑戰成果目標時，不妨試試這些方法。'
