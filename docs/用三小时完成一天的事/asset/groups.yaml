  mdcn: "\n## Part 9 總整理\n\n### 活用「時間地圖」，思考如何均衡地分配時間\n\n- **審視自我時間分配是否均衡**\n  - 確認一週內時間分配是否均衡。\n\
    \  - 一小時約為一週的 0.6%\n\n![](img/87569369e8074c65e7c56ecade1ddea0_186_0.png)\n\n\
    - **瀏覽工作時間的分配情形**\n  - 紀錄工作處理時間\n  - 瀏覽結果（時間分配情形）➜ 找出過於費時的工作，設法改善。\n\n### 審視自我時間分配情形\n\
    \n**區分工作時間與私人時間**\n\n![](img/87569369e8074c65e7c56ecade1ddea0_187_0.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_187_1.png)\n\
    \n**如何減少加班時間？**\n\n因為下班後「和别人有约」，所以会集中心神，想办法完成工作，订个「不必加班的日子」，养成尽早完成工作的习惯。\n\n###\
    \ 考量「投资将来」的时间\n\n- 为了将来而行动的时间数（一周内）× 2.5 = 投资将来的时间（%）（一周工作四十小时）\n  读书与学习技艺、开发新技术、开发新客户所做的业务活动、设想新事业等。\n\
    \  首先将目标定为10%以上！\n\n- 为了将来而行动的时间数（一周内）× 0.9 = 投资将来的时间（%）（若睡眠时间为八小时）\n  若睡眠时间为五～七小时，乘以0.8\n\
    \  若睡眠时间更少的话，乘以0.7\n  首先将目标定为10%以上！\n\n### 「轉換時間」與「轉換心情」都很重要\n\n均衡分配時間並不是那麼容易的事。\n\
    \n也就是說，其實有很多人根本不瞭解什麼是均衡地分配時間。\n\n均衡分配時間並沒有什麼「固定規則」，完全依當時工作內容、個人狀況、年齡和職務等而定。就某種意味來說，也許是個需要一輩子探究的問題。\n\
    \n瞭解自我時間分配，找出對策是非常重要的事，當然也不能少了審視這道工序。建議不時停下手邊工作，審視工作與私人時間的分配情況。\n\n還有一點很重要，除了力求時間分配均衡，也要懂得轉換心情。\n\
    \n就算有加不完的班，只要懂得轉換心情便能減少壓力。\n\n就算不常加班，難免也會有需要轉換心情的時候，譬如下班後還掛記著工作，很容易累積壓力。\n\n如同\
    \ Part 7 的說明，善用「時間地圖」能有效地轉換心情。活用「時間地圖」整理工作，「明天做也可以」、「下個禮拜做做也沒關係」像這樣預訂計畫，也是轉換心情的訣竅，儘可能地減少對公事煩心。\n\
    \n關於「時間均衡」還有一點要注意，那就是有些人會將自己的一天細分為二十四小時，當然這麼做也可以，端視個人自由。\n\n因為他們認為二十四小時「都得做點什麼才行」，結果給自己造成莫大壓力。其實只要好好地計畫工作時間即可，私人時間完全沒計畫也無所謂。\n\
    \n「無所事事時間」和「毫無計畫的時間」未必毫無益處（當然完全毫無計畫也很傷腦筋就是了）。\n\n現在開始不妨好好地思考如何均衡地分配時間吧！\n\n![](img/87569369e8074c65e7c56ecade1ddea0_189_0.png)\n\
    \n## Part 10 開始行動吧！\n\n### 活用「時間地圖」的好處\n\n#### 1 提升工作效率\n\n**瀏覽時間地圖，讓工作流程變得更順利**\n\
    \n之前的章節內容教你如何將行動轉化成「有計畫的行動」，最後一章便是要說明養成「有計畫的行動」的好處。\n\n當行動變成「有計畫的行動」後，工作效率勢必提升。介紹「步驟化」時曾說明過，隨著工作流程改變，效率亦大幅提升。使用「時間地圖」思考一件工作流程如何「步驟化」，連帶地也會思考整體時間流程。\n\
    \n只要是用於同一類的事，就算是內容完全不同的專案，也能匯整於同一天進行，提升工作效率。好比將內容大同小異的工作匯整處理，絕對更有效率。\n\n將工作匯整於「時間地圖」上，能讓所有工作流程一目了然。其實你手邊一定有那種稍微改變一下處理方式，便能提升效率的工作。\n\
    \n但人往往被眼前的事束縛，忙到無法思考如何改變工作方式，結果只會讓自己越來越雜亂無章地行動。\n\n只要養成瀏覽「時間地圖」，預測「未來情況」的習慣，便能有效地掌控工作流程。事前有充足的時間可思考，才能發想出更順利流程。\n\
    \n**不讓工作堆積如山，做好預先準備**\n\n養成預測「未來情況」的習慣，便能防患未然，做好未雨綢繆的準備。就算工作堆積如山，忙得不可開交，只要事先做好準備，就能避免手忙腳亂。\n\
    \n而且事先做好準備，也能有較多的對策可供選擇，所以早點發現問題也能提升工作效率。\n\n**掌控工作時間，避免浪費**\n\n瞭解自己如何分配時間才能避免「浪費時間」。意外地，大多數人都不太清楚自己做一件工作究竟花費了多少時間，這就是問題所在。\n\
    \n養成瀏覽「時間地圖」的習慣，才能意識到自己的時間是有限的，思考自己該如何活用這些時間，也能藉由審視的工夫，察覺有無浪費時間的情形。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_193_0.png)\n\
    \n#### 2 減輕工作壓力\n\n**時間管理不只是為了提升工作效率**\n\n大部分人一聽到「時間管理」，就會聯想到「節省時間」、「提升工作效率」等優點，其實也有減輕工作壓力的效果。\n\
    \n所謂「壓力」是生物為了克服危機狀況，體內自然產生的反應，並非全然不好，適度的壓力也能刺激潛能，但前提是要懂得釋放壓力。若不斷累積壓力，不懂得釋放的話，只會搞得自己身心俱疲。\n\
    \n其實我還沒學會時間管理之前，也是過著成天被工作追逐，備感壓力的生活。老是忙得暈頭轉向，下了班還掛念著公事，根本輕鬆不起來。自從使用「時間地圖」後，壓力竟不可思議地消散不少。\n\
    \n不是我誇大其詞，現在的我真的很享受「樂在工作」的感覺。\n\n**減輕「被工作追逐」的壓力**\n\n做好時間管理的好處之一就是減輕「被工作追逐」的壓力。不但能從容地處理工作，也不再覺得成天被工作束縛，握有工作主導權，壓力自然減輕不少。\n\
    \n**減輕「無所適從」的壓力**\n\n另一個好處則是消除工作「無所適從」的不安全感。若只靠腦子裡的記憶管理工作，一旦工作量增加就會擔心：「明天是否處理得完？」。像這樣抱著「不曉得能否完成」的不安全感也是壓力來源。\n\
    \n做好時間管理能讓自己對工作進度產生信心，消除無所適從的不安全感。\n\n如同 Part 7 所述，唯有充分地掌控工作進度，才能有效地轉換心情。\n\n\
    千萬不要認為「工作當然有壓力」，嘗試使用「時間地圖」，你一定也能感受到自己有顯著的改變。\n\n#### 3 可以挪出多點屬於自己的時間\n\n**做好「時間管理」，給自己多一點自由時間**\n\
    \n「時間管理」也許予人一種「被時間束縛」的印象，其實並非如此。時間管理絕不是死板板、無趣的規則，而是讓你享受到更多自由的方法。\n\n試著將時間分為「必須做點事的時間」與「自由時間」兩大類來思考。假如「必須做點事的時間」是拍攝的目標物，那麼「自由時間」就是襯托目標物的背景。\n\
    \n若掌控不好「必須做點事的時間」，剩餘的「自由時間」自然也好不好到哪儿去。相反地，「必須做點事的時間」掌握得宜，作為背景的「自由時間」自然明確。\n\n\
    利用時間管理明確界定「該做的事」，便能清楚地區分出自由時間。由此可見，時間管理並不全是無趣的規則。\n\n**有時間做「想做的事」**\n\n時間管理不單是為了「必須做的事」，也包含「想做的事」（公私都有）。不論是想充實私人時間、想保留學習時間、想專注於工作中某個領域等，時間管理都能發揮效用。\n\
    \n之所以無法做好時間管理，往往是因為先做了「想做的事」，而忘了「必須做的事」，這是問題所在。\n\n還有另一個問題，老是想著：「做完必須做的事後，再做想做的事吧」，結果「必須做的事」還沒做完，時間轉眼即逝。\n\
    \n結果被「必須做的事」追得手忙腳亂，根本沒時間、沒心思去做「想做的事」。不然就是想做「想做的事」時，發現「必須做的事」還沒做完，心裡會有種罪惡感，結果就這樣任憑時間流逝。\n\
    \n習慣做好時間管理，便能確實做好「必須做的事」，做「想做的事」時也不會有罪惡感。還能集中心神，在一定時間內完成「必須做的事」。不論是為了工作忙得焦頭爛額，還是希望多點自由時間的人，藉由時間管理都能得到莫大益處。\n\
    \n#### 4 習慣能促使自我成長\n\n**「打造未來」的能力是促使人成長的動力**\n\n本書說明的「計畫性行動」便是想像自己的「未來」，設計「未來」，「為了未來」而行動，打造自己的「未來」，也是我們人類獨享的能力。\n\
    \n人類之所以有別於動物，就是因為人類創造了文明。正因為人類具有打造「未來」的能力，才能創造文明。若非意識到「未來」這字眼，又怎能留下巍峨建築，發明文字流傳後世呢！\n\
    \n由此可見，「打造未來」的能力是促使人類文明發展的動力。\n\n**養成「計畫」習慣，是促使人成長的動力**\n\n現今是個資訊發達，重視效率的時代，生活也變得庸庸碌碌。\n\
    \n如同本書所說明的，每個人都有計畫行動所必須具備的「基本能力」，卻還是會被眼前事物耍得暈頭轉向，這是現代人共通的煩惱。畢竟這是個光靠「基本能力」根本行不通的時代。\n\
    \n現代人需要的是能夠活用基本能力的「道具」，那就是「習慣」。\n\n「道具」不必複雜，只要簡單的「時間地圖」就行了。重要的是如何變成一種「習慣」，確實地活用。\n\
    \n找出自己的「道具」，將此方法養成「習慣」的人，做事勢必更有「計畫」。只要懂得這番道理，便曉得如何打造「未來」。就像我們的祖先一樣，大幅提升打造「未來」的成長力。\n\
    \n不管是「追求自己的夢想」還是「努力克服現狀」，每個人對「未來」的期许都不一樣，所描繪的未來也有可能是「一年後」、「十年後」甚至「三十年後」。養成「計畫」習慣絕對是促使自我成長的起跑點，找出能夠讓自我成長的「習慣」，積極嘗試。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_199_0.png)\n\n#### 5 開始行動就對了！\n\n**和過去說再見，善用今後時間**\n\
    \n最後還有一點要提醒。\n\n大部分人看完教你「如何善用時間」的書後，都會萌生「之前都沒有善加利用時間」的罪惡感。\n\n其實我也曾這麼想。以前的我是個既不愛看書，又不會寫文章的傢伙，直到邁入三十大關才積極地閱讀、提筆創作本書。\n\
    \n正因如此，有時我會想：「要是二十幾歲時能多看點書就好了……」，現在後悔也來不及了。與其懊悔，不如積極地思考「今後該怎麼做」。\n\n千萬別為過去的事懊悔不已，積極思考「如何善用今後的時間」才是最重要的。\n\
    \n**善用「時間地圖」**\n\n本書說明的方法都是摘自我實際嘗試過的精髄部分。\n\n我在發現這方法前，也嘗試過各種時間管理方法，但每一種都無法持久。於是我調查了各種時間管理方法，彙整出真正最必要的簡單原則，那就是「時間地圖」。\n\
    \n就連嘗試其他方法都只有三分鐘熱度的我，也能持續地使用「時間地圖」，感覺自己「有計畫地行動」，所以樂於與大家分享這方法。\n\n這方法的最大好處在於可以邊瀏覽「時間地圖」，邊記錄，花不了太多時間。每一個都是能夠隨手養成的小「習慣」，肯定是「最能持之以恆」的時間管理方法。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_201_0.png)\n\n雖然一開始會覺得有點麻煩，只要持之以恆，一定會發現自己有所改變，請務必親身實踐看看。\n\
    \n### Part 10 總整理\n\n#### 「有計劃地行動」，讓你變得不一樣\n\n**提升工作效率**\n\n- 瀏覽時間地圖，讓工作流程變得更順利\n\
    \  事前有充足的時間可思考，才能發想出更順利的流程。\n- 不讓工作堆積如山，做好預先準備\n  早點發現問題，早點解決問題。\n- 掌控工作時間，避免浪費\n\
    \  瞭解自己如何分配時間。\n\n**減輕工作壓力**\n\n- 減輕「被工作追逐」的壓力\n  不再成天被工作束縛，握有工作主導權，壓力自然減輕不少。\n\
    - 減輕「無所適從」的壓力\n  充分掌控工作進度，消除無所適從的不安全感。\n\n**可以挪出多點屬於自己的時間**\n\n- 給自己多一點自由時間\n\
    \  明瞭瞭解什麼是「必須做的事」，才能區分出自由時間。\n- 有時間做「必須做的事」\n  確保「必須做的事」能在一定時間內完成。\n\n**開始行動就對了！**\n\
    \n- 不必懊悔以前沒有善用時間\n  積極思考「該如何善用今後的時間」才是最重要的。\n- 「時間地圖」是最簡單又能持之以恆的方法\n  只要持之以恆，一定會發現自己有所改變。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_203_0.png)\n\n## 時間活用秘技 10\n\n### 如何提升自我工作力？\n\
    \n**提升全方位工作力的方法**\n\n我們會藉由書籍、雜誌或網路等，想辦法提升自我，然而這方法並無法全方位地提升工作力。那麼，是否有那種「一招便能馬上全方位提升工作力」的方法呢？可惜沒有。不過「時間管理」算是最有效率的方法了。只要學會時間管理，落實行動，便能一步步地提升工作力。\n\
    \n其實平常處理工作一事就是提升工作力的最佳教材，不管再怎麼創新的手法，唯有「親身實踐」才能養成習慣，從工作中一點一滴地學習，不斷成長。\n\n然而由「工作」這教材所得到的學習效果，完全因人而異。有些人只會一個口令一個動作地行事，根本不可能提升工作力。有些人則是會邊思考做事方法，邊慢慢改進，工作力自然提升。幾年後便能看出兩者實力的差別，請勉勵自己成為後者吧。\n\
    \n又好比處理工作時，有些人會想：「這件工作該如何處理比較好呢？」，有些人則是重新審視：「這次處理得好嗎？」，我們都有可能是這兩種類型的人，兩者之間有著些微差異，那就是自己是否抱持審慎的態度處理工作。唯有審慎地思考：「是否還有更妥善的做法？」才能反覆地「發現問題」、「改善問題」，提升工作力。\n\
    \n**「發現」和「改善」的重要性**\n\n反覆「發現問題」、「改善問題」的過程，好比改革製造業生產線的活動。曾親眼目睹改革生產線活動的我，有此感觸。其實生產線的工作人員根本不懂什麼叫做「提升生產效率」、「改善品質」，但越是在第一線工作的人，越懂得如何改善。如何讓這些要點能落實改善是個很重要的課題。\n\
    \n坐辦公桌的白領族也是。每個人都曉得如何改善工作上的問題，卻因為終日忙於工作，根本沒空思考這種事，改善這種事。\n\n只要持續善用時間管理，便有餘力思考這些事，而且進行工作前都有時間審慎思考，審視自己做過的事。發現問題，改善處理方式，想要提升幾倍工作力都不是問題了。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_205_0.png)\n\n## 後記\n\n### 立即實踐，改變自己！\n\
    \n看完這本書後，有何感想呢？\n\n若能讓你萌生「想親身實行」的念頭，就已達到我寫這本書的一半目的了。另一半目的則是希望你能實行本書介紹的方法。\n\n\
    親身實行這本書的內容，務求持之以恆。想要改變自己使用時間的方法，實際「嘗試」遠比看書「瞭解」更重要。\n\n為什麼呢？因為比起透過書本得到一些知識，從行動中獲得的東西更有價值。\n\
    \n唯有訂立計畫，持續行動，才能發現各種事。\n\n- 「沒想到自己居然能訂立出這麼好的計畫。」\n- 「沒想到自己居然能接受這麼無厘頭的工作。」\n- 「沒想到用不用心做，出來的成果會差那麼多。」\n\
    \n一定能發現自己從未察覺的毛病，畢竟瞭解自己才是最重要的。\n\n市面上充斥著教人如何「善用時間」的知識和技巧，但不管再怎麼巧妙的知識和技巧，都比不上「瞭解自己」來得有效。\n\
    \n如果「不曉得該從何著手」，建議從 Part 1～2 介紹的「時間地圖」開始活用，光是實踐這部分便能感受到自己有顯著的改變。\n\n當然我也會將本書所介紹的方法，刊載於網站供大家下載，相信實踐起來會更方便。\n\
    \n最後，我想說明感覺自己已經懂得如何善用時間的三種感覺，這三種「感覺」分別是：\n\n- 所謂「必須做」的「責任感」。\n- 所謂「做到了」的「成就感」。\n\
    - 所謂「可以做」的「安心感」。\n\n之所以想「活用時間」，勢必會重視所謂的「責任感」和「成就感」，但光是這樣肯定會搞得自己身心俱疲，備感壓力，撐不了多久。\n\
    \n本書介紹的「時間地圖」是種可以強化「安心感」的技巧，也是最能持之以恆的方法，請務必一試。總之，無論學習哪一種技巧都是改變自我的捷徑。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_207_0.png)\n\
