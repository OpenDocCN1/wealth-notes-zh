  - '[PAGE 140]


    # 4 如果計畫趕不上變化怎麼辦？


    # 如何因應突發狀況？


    工作中難免會有突發狀況，大多是臨時出了什麼問題，容易手忙腳亂，這時更應該保持鎮定地行動。


    首先掌握正確狀況，判斷如何因應。是否可以同時進行，還是得將今天的約定和工作挪後。無法掌握清楚狀況便無從判斷該優先處理哪件工作，雖然必須視情況而定，但務必先瀏覽「時間地圖」後再行決定。


    平時養成瀏覽地圖的習慣，這時便能發揮莫大作用。


    # 無法如期完成預定的工作


    有時計畫趕不上變化，無法如期完成預定的工作，這時就得判斷究竟要「留下來加班？」還是「留到明天繼續完成」。


    不妨依明天的工作量的判斷。若明天的工作量比較少，時間充裕的話，挪後處理當然沒問題。'
  - '[PAGE 141]


    # Part


    # 7


    相反地，要是工作量比今天還多，就沒辦法挪後處理了。勢必得決定留下來加班還是暫時中止某件工作。若明天很忙，今天就得多努力些，就像有種和「自己協商」的感覺。


    # 別人的預定計畫變更，也會影響到自己！


    預定的計畫之所以會變更，不單是自己的問題，也有可能是受到上司排程變更的影響等因素。


    譬如自己的排程中有必須取得上司認可的工作，若上司適巧不在，可就傷腦筋了。因此上司排程有所變更時，務必確認自己的排程是否受影響。此外，平常最好留意上司哪一天不在辦公室，以因應突發狀況。'
  - '[PAGE 142]


    # 5 如何因應

    臨時新增活動？


    # 儘早將龐雜的工作「步驟化」


    Part 3、Part 4 所說明 的「活動」，屬於規模較為龐雜的「工作」，處理這類工作前一定要先「步驟化」。若有活動臨時插進來，只要活用「步驟化」便能迅速處理完畢，當然也有不必急著處理的活動。


    之所以將活動步驟化，除了方便確認要做哪些事，也能找出必須請教別人的問題，畢竟有些問題向別人請益，才能進行得更順利。


    另一個理由則是若沒有步驟化，很難想像總共需要花費多少時間。譬如原本以為兩天便能完成的工作，步驟化後發現得花費更長的時間也說不定，早點發現還能多點時間從容應付，以免手忙腳亂。


    雖然依活動規模不同，多少有些差異，但大部分工作只需花個十分鐘便能完成步驟化。遇到臨時插進來的活動，只要予以「步驟化」，便能迅速處理完畢，多花個十分鐘便能讓工作進行得更順利。'
