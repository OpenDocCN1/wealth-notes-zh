    # ## 7


    # # 如何活用群組軟體？


    **群組軟體的優缺點**


    雖然記事本或電腦都可以用來製作「時間地圖」這個時間管理工具，但大多數人還是覺得使用記事本比較方便，畢竟電腦較適用於管理約定，不太適用於管理工作。


    電腦當然有其便利之處，那就是資源共享功能，稱為「群組軟體」（Groupware）。群組軟體（譯註）具有可同時確認多人的工作排程、設定會議等約定的功能，但群組軟體較不適用於管理工作就是了。


    **群組軟體的使用方法①**


    第一個就是用於記事本上的「時間地圖」，只有約定需要同時記在記事本與群組軟體上。這麼一來，記事本就成了「時間地圖」，統整所有約定與工作。


    記事本與群組軟體的內容務求一致，記錄於軟體上的約定，同時也要寫在記事本上（若不做這樣的話，會被人誤植其他約定也沒不定）。雖然這樣做較為瑣碎，但是一道必要的工夫。


    **群組軟體的使用方法②**


    第二個是使用群組軟體管理約定，再以清單管理工作（工作務必依日期標記），這麼一來就不用花時間記錄約定了。


    但有一點要注意，那就是這麼一來便無法統整「時間地圖」上的情報。若沒瀏覽一遍約定便追加工作，或是沒瞭解工'
  - '[PAGE 151]


    作量便追加約定的話，也許會訂立出根本無法徹底實行的計畫。因此使用這方法時，一定要同時確認群組軟體與工作清單。


    # 群組軟體的使用方法③


    第三個是將決定好的工作時間同步登錄群組軟體。這麼一來，便能利用群組軟體整合「時間地圖」。


    就連只需花個幾分鐘的工作也得登錄，多少有些瑣碎，也很難區別哪些工作已經完成，哪些工作尚未完成，因此這方法不適用於手邊瑣事較多的人。


    譯註：群組軟體是一種電腦應用軟體，結合電子郵件、行事曆分享、工作管理等功能，例如微軟的Exchange Server 2010。


