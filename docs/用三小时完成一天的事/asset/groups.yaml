    # 養成「有計畫的行動」


    ### 1 為何無法做到「有計畫的行動」？


    小美的煩惱：老是毫無計畫地行動


    「只剩一個小時，非得完成不可！」


    任職食品公司商品企畫部的小美，正在構思新商品的企畫案。


    若企畫案過關，便能如願開發新商品。但沒有及早準備的小美，顯得十分手忙腳亂。


    「早知道就早點準備……」


    小美對於自己沒有及早準備一事，感到十分懊悔。因為忙於別的工作，不知不覺時間就這樣流逝了。就算好不容易完成，趕在會議時發表，也因為準備得不夠周全，企畫案無法過關……。


    「我這個人做事真是缺乏計畫啊……」


    小美懊惱地想。


    究竟該怎麼做，才能讓工作順利進行呢？


    ### 小佑的煩惱：做事總是拖拖拉拉


    「這禮拜時間很充裕，一定要完成稿子！」


    明明禮拜一這麼想，不知不覺今天已經禮拜三了。任職於週刊雜誌編輯部的小佑，這週還是為了趕截稿，拚命地加班。


    「要是昨天開始做就好了……」


    明知如此，卻總是拖拖拉拉，非得等到截稿日迫在眉睫才拚命趕稿，這是小佑的煩惱。


    「我就是因為做事缺乏計畫……才會總是不順利吧。」


    小佑想。


    什麼時候才能改掉這個毛病呢？


    深為工作進展不順利而煩惱的兩人，其實都有一個很大的問題。


    你看得出來是什麼樣的問題嗎？


    ### 2 養成「三大習慣」就能「有計畫地行動」


    #### 小美與小佑的問題


    小美與小佑很想改掉自己「做事缺乏計畫」的毛病。那麼，何謂做事有「計畫」呢？


    我們常聽人家說：「○○先生做事很有計畫」、「○○小姐做事缺乏計畫」，用這字眼形容一個人的個性。但就算反省自己做是要更有計畫才行，也不曉得該如何改進，是吧？不知不覺地成了藉口。


    想要提升工作效率，首先就是不能將「計畫性」這字眼視為一個人的個性，而應視為「有計畫的行動」和「無計畫的行動」。


    「計畫性」指的並非是個性，而是行動方面的問題，而且是依每天的行動，也就是取決於「習慣」。


    小美與小佑的問題在於就算反省自己「做事缺乏計畫」，卻沒想過改變自己的「習慣」。

