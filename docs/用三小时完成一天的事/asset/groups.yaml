  - '[PAGE 42]


    # ## 5

    ## 審視計畫 提升實行力！


    審視計畫，避免發生無法負荷的情形


    將約定与工作逐一寫下來，便成了一張「時間地圖」。不過為了避免發生無法負荷的情形，必須「審視」計畫。


    利用「填字遊戲原則」縱觀「時間地圖」，可審視同一天的約定和工作內容。約定是在框線內的時間帶實行，工作則是在框線外的時間帶實行。若約定和工作不多倒還好，要是追加的話，就必須確認。


    譬如某天的計畫有兩項約定，分別為兩小時左右。這時若框線外的時間帶超過四小時，這天就這樣結束了。。


    若追加新工作，勢必得增加工作時間，能歸納於框線外的時間帶最好，若不行的話，便得放棄或移至他日。


    追加新約定的同時，也會削減框線外的時間。原本預定的工作順利完成當然最好，若不行的話，只好將工作挪至他日或放棄約定。


    ※除了既定工作外，平常還有些需要處理的瑣事，或是當天必須立即解決的突發狀況。若這類工作佔據的時間較長，當然必須一併考慮。'
