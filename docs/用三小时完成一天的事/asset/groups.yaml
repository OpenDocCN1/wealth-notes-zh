    # 「料理型」步驟法：第一階段—倒推回去的步驟圖—


    ![](img/87569369e8074c65e7c56ecade1ddea0_77_0.png)


    +   · 確定一些必要的作業程序

    · 確定前一階段的必要作業程序

    ：

    藉由這樣反覆地確認，不管任何工作都能分解成一項項的個別作業。


