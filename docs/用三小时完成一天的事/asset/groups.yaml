    # ## 2 什麼是「步驟化」？


    # ### 「步驟化」的意義


    你一定聽過「步驟化」這字眼，但不一定明白是什麼意思。


    「步驟化」是指工作等都有一定的順序和準備事宜。所謂「事情成功與否，八分靠技巧」，由此可見「做事有方法」是提升工作效率的要點。雖說如此，還是有些似懂非懂吧。


    你不會按部就班地做事呢？不管是面對工作還是生活，總是不經意地依循一定步驟進行，而且有些工作是自然而然就會按部就班地完成。


    請想像家庭主婦站在廚房，忙於家事的模樣。邊炒東西，邊準備湯料，還要用微波爐熱東西，按部就班地做事。像我這般平常很少碰鍋鏟的人，一站到廚房，就算做的是同一道料理，也會七手八腳，忙成一團。這就是有無按部就班做事的差異。


    對於十分熟悉的事也許並不覺得，其實不管什麼工作都有方法，我們無形中也是照著一定的方法處理事情。'
  - '[PAGE 59]


    # # 學習步驟化


    大部分人面對不熟悉的工作，往往抓不到做事方法。在摸不著頭緒的情況下進行，不但做得不夠周全，也會搞亂作業程序。結果弄得自己進退維谷，無法照著預定進度進行。唯有事先想好步驟，隨手寫下來，才能避免這樣的情形發生。


    尤其面對「必須花上一段時間才能完成的工作」、「程序複雜的工作」或是「不太熟悉的工作」等，千萬別嫌麻煩，務必事先擬定步驟才能節省時間。


    不管是什麼樣的工作，按部就班才能有效率地進行。接下來會介紹一些方法，在此還是先說明一下「步驟化」的好處。


    一旦養成步驟化的習慣，看待工作的態度也會改變，不再被工作追著跑，更能掌控工作進度，疲勞與壓力自然削減許多。


    養成步驟化的習慣也能讓自己面對新工作時，更快上手。


    運用步驟化能讓人做起事來更有效率、神清氣爽、壓力減輕，體驗到不同於以往的工作樂趣，請務必試一試。'
