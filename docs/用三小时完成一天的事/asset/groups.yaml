    # Part 3 把事情步驟化!


    「料理型」和「購物型」 步驟法


    ## 1 為何無法「按部就班」地處理事情呢？


    ### 進度真的沒問題嗎？ 拓也的不安


    「如果這次又得熬夜趕工的話，我請大家吃燒肉！」


    身為電影研究社一員的大學生拓也，這麼說。


    拓也負責導演要在今年校慶播放的電影。其實去年也是由他負責導演，因為拍攝進度一再拖延，直到上映前一天才進行後製和錄音等工作，搞得好夥人仰馬翻。


    「今年絕不能重蹈覆轍」大家極力要求。


    「不會啦！今年一定沒問題的！」


    雖說如此，拓也心中卻抹上一層不安。


    「今年一定要按部就班地從容進行……」


    想想，去年好像也是這麼暗暗發誓。


    「可是……真的沒問題嗎？……」


    說出請大家吃燒肉的承諾後，拓也有些後悔。


    ### 該如何是好呢？ 沙織的不安


    「這次活動很重要，要好好處理喔。」


    「包在我身上！」


    進公司已經四年的沙織，這麼說。


    她受命從前輩手上承接每年例行展示會的準備工作。包括決定會場和展示空間、寄發邀請函、準備所需用品等……一大堆的事情得忙。


    因為去年幫忙前輩籌辦過，知道大致情形。但沙織實在沒自信能像前輩那樣按部就班地處理一切，一想到此，便覺得壓力好大。


    總之及早準備就對了。沙織腦中塞滿一大堆等待處理的事情。


    「真的沒問題嗎？……」


    沙織很擔心。


    對拓也和沙織而言，眼前最迫切需要的東西是什麼？


    就是「步驟化」。那麼，什麼是「步驟化」呢？趕快一起來學會它。


    ![](img/87569369e8074c65e7c56ecade1ddea0_57_0.png)


    ## 2 什麼是「步驟化」？


    ### 「步驟化」的意義


    你一定聽過「步驟化」這字眼，但不一定明白是什麼意思。


    「步驟化」是指工作等都有一定的順序和準備事宜。所謂「事情成功與否，八分靠技巧」，由此可見「做事有方法」是提升工作效率的要點。雖說如此，還是有些似懂非懂吧。


    你不會按部就班地做事呢？不管是面對工作還是生活，總是不經意地依循一定步驟進行，而且有些工作是自然而然就會按部就班地完成。


    請想像家庭主婦站在廚房，忙於家事的模樣。邊炒東西，邊準備湯料，還要用微波爐熱東西，按部就班地做事。像我這般平常很少碰鍋鏟的人，一站到廚房，就算做的是同一道料理，也會七手八腳，忙成一團。這就是有無按部就班做事的差異。


    對於十分熟悉的事也許並不覺得，其實不管什麼工作都有方法，我們無形中也是照著一定的方法處理事情。


    ### 學習步驟化


    大部分人面對不熟悉的工作，往往抓不到做事方法。在摸不著頭緒的情況下進行，不但做得不夠周全，也會搞亂作業程序。結果弄得自己進退維谷，無法照著預定進度進行。唯有事先想好步驟，隨手寫下來，才能避免這樣的情形發生。


    尤其面對「必須花上一段時間才能完成的工作」、「程序複雜的工作」或是「不太熟悉的工作」等，千萬別嫌麻煩，務必事先擬定步驟才能節省時間。


    不管是什麼樣的工作，按部就班才能有效率地進行。接下來會介紹一些方法，在此還是先說明一下「步驟化」的好處。


    一旦養成步驟化的習慣，看待工作的態度也會改變，不再被工作追著跑，更能掌控工作進度，疲勞與壓力自然削減許多。


    養成步驟化的習慣也能讓自己面對新工作時，更快上手。


    運用步驟化能讓人做起事來更有效率、神清氣爽、壓力減輕，體驗到不同於以往的工作樂趣，請務必試一試。


    ## 3 「步驟化」就是分解工作


    ### 如何應付規模龐大的工作


    每項工作所需花費時間不一。雖然都屬於「職務」，有的是一、兩個小時才能結束的約定，有的是花五分鐘便能搞定的工作。如同 Part 1 和 Part 2 中所介紹的，藉由「時間地圖」邊整理邊執行。


    若是必須花費好幾天、甚至好幾週才能完成的工作，就比較傷腦筋了。就算擬出大致排程，也不太清楚平常該做些什麼，就會無法「有計畫的行動」。


    一旦步驟化，決定工作流程後，像這類規模龐大的工作也要納入平常的工作排程。


    雖然一般「工作」（task）最長不過兩、三個小時，建議還是要和必須花費較長時間才能完成的工作或約定，一併納入考慮，思考如何進行。確定工作流程的同時，也比較容易納入自己的排程，這才是「有計畫的行動」。


    為了與一般工作有所區別，本書將必須步驟化的龐大工作，稱為「活動」（activity）。


