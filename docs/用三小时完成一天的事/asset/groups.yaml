    # 4 套用料理順序的步驟化


    # 兩種步驟化方法


    接下來，說明一下步驟化方法。


    將無法馬上完成的工作，也就是「活動」予以步驟化，確定每一個為了達成「活動」目的的行動（工作和約定）。


    介紹兩種步驟化的方法，分別為「料理型」和「購物型」。


    # 「料理型」步驟法


    請想像料理時的步驟。決定做什麼料理時，步驟化的目的就是料理。相反地，為了達成目的所需的東西便是步驟。


    譬如決定做一道「魚」、「燙青菜」和「義大利麵」，首先先調味，若要追溯更早之前的步驟，就是進行烹調準備。像這樣一邊從目的倒推回去，一邊確定必要作業，稱為「料理型」步驟法，也叫做「倒推式」步驟法。


    那麼，為何必須步驟化呢？做料理時就算沒有步驟化，邊看食譜邊做也行。'
  - '[PAGE 63]


    # 「料理型」步驟法


    ![](img/87569369e8074c65e7c56ecade1ddea0_63_0.png)


    倒推回去想，比較容易瞭解


    然而大部分工作可沒食譜可參考*。為了有計畫地做好，沒有範本可供參考的工作，得靠自己思考，這時就需要「步驟化」的能力。


    接著說明「購物型」步驟化吧。


    *有些工作有工作手冊可供參考，因此就算沒有步驟化也沒關係。然而不管身處什麼樣的職場環境，一定有那種沒有工作手冊可供參考的工作，因此學習如何將工作步驟化很重要。'
  - '[PAGE 64]


    # 5 套用出門購物模式的步驟化


    「購物型」步驟法


    另一種「購物型」步驟法，也是適合倒推回想時使用的方法。


    試著想像自己「購物」時的情景。購物這項活動的目的不是「購物」，而是購買「必要的東西」，然後回想到底要買些什麼。


    首先清楚地列出購物清單。列出清單時，最好依「食品」、「廚房用品」、「衛浴用品」等項目分門別類地列舉出來，比較清楚。


    同樣地，將該做的事也列出清單，這就是「購物型」步驟法，也稱為「列清單法」。


    那麼，像這樣逐步步驟化究竟有何好處呢？有兩個理由。試著思考購物的例子吧。


    若沒帶清單購物的話，有時會忘了要買些什麼。譬如出門前明明想著：「家裡沒備用燈泡了，要記得買。」結果還是忘了買。'
  md: '

    ## 確認「完成期限」，決定「何時」開始進行


    如下圖，依日期寫下工作內容，但不用標示工作完成期限，只要考慮何時開始進行（何時可以動工），決定實行日即可。


    ![](img/87569369e8074c65e7c56ecade1ddea0_41_0.png)


    重要的是，不只確定「完成期限」，也要決定「何時開始進行」，才能養成有計畫的行動力。


    ## 一旦決定好，立即寫下來


    | 週一 | 週二 | 週三 | 週四 | 週五 |

    | :--- | :--- | :--- | :--- | :--- |

    | ☐ 完成 A 資料 | ☐ 收集關於 B 報告的資料<br>☐ 完成 C 資料 | ☐ 完成 B 報告<br>☐ 決定 D 企劃的資料內容<br>☐ 和○○先生洽商
    E 事 | ☐ 取得課長對 B 報告的認可<br>☐ 完成 D 企劃的資料 | |


    最好標上確認是否完成的小方格☐，以便確認*。


    此外，對於必須跨好幾天才能完成的工作，最好先將工作「分解」，確認每天需要完成多少的工作量。Part 3 開始會說明如何將工作分解。


    * 除了標註確認用的小方格，另一個方法是完成後畫線刪除。


    # 5 審視計畫 提升實行力！


    審視計畫，避免發生無法負荷的情形


    將約定与工作逐一寫下來，便成了一張「時間地圖」。不過為了避免發生無法負荷的情形，必須「審視」計畫。


    利用「填字遊戲原則」縱觀「時間地圖」，可審視同一天的約定和工作內容。約定是在框線內的時間帶實行，工作則是在框線外的時間帶實行。若約定和工作不多倒還好，要是追加的話，就必須確認。


    譬如某天的計畫有兩項約定，分別為兩小時左右。這時若框線外的時間帶超過四小時，這天就這樣結束了。


    若追加新工作，勢必得增加工作時間，能歸納於框線外的時間帶最好，若不行的話，便得放棄或移至他日。


    追加新約定的同時，也會削減框線外的時間。原本預定的工作順利完成當然最好，若不行的話，只好將工作挪至他日或放棄約定。


    ※除了既定工作外，平常還有些需要處理的瑣事，或是當天必須立即解決的突發狀況。若這類工作佔據的時間較長，當然必須一併考慮。


