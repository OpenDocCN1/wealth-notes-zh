    # 3

    可以挪出多點

    屬於自己的時間


    做好「時間管理」，給自己多一點自由時間


    「時間管理」也許予人一種「被時間束縛」的印象，

    其實並非如此。時間管理絕不是死板板、無趣的規則，而

    是讓你享受到更多自由的方法。


    試著將時間分為「必須做點事的時間」與「自由時

    間」兩大類來思考。假如「必須做點事的時間」是拍攝的

    目標物，那麼「自由時間」就是襯托目標物的背景。


    若掌控不好「必須做點事的時間」，剩餘的「自由時

    間」自然也好不好到哪儿去。相反地，「必須做點事的時

    間」掌握得宜，作為背景的「自由時間」自然明確。


    利用時間管理明確界定「該做的事」，便能清楚地區

    分出自由時間。由可見，時間管理並不全是無趣的規

    則。'
  - '[PAGE 197]


    # 有時間做「想做的事」


    時間管理不單是為了「必須做的事」，也包含「想做的事」（公私都有）。不論是想充實私人時間、想保留學習時間、想專注於工作中某個領域等，時間管理都能發揮效用。


    之所以無法做好時間管理，往住是因為先做了「想做的事」，而忘了「必須做的事」，這是問題所在。


    還有另一個問題，老是想著：「做完必須做的事後，再做想做的事吧」，結果「必須做的事」還沒做完，時間轉眼即逝。


    結果被「必須做的事」追得手忙腳亂，根本沒時間、沒心思去做「想做的事」。不然就是想做「想做的事」時，發現「必須做的事」還沒做完，心裡會有種罪惡感，結果就這樣任憑時間流逝。


    習慣做好時間管理，便能確實做好「必須做的事」，做「想做的事」時也不會有罪惡感。還能集中心神，在一定時間內完成「必須做的事」。不論是為了工作忙得焦頭爛額，還是希望多點自由時間的人，藉由時間管理都能得到莫大益處。


