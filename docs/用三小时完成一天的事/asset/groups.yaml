    # ## 解決你「沒時間」的煩惱！


    「時間不夠用」、「要是再多點時間就好了……」


    你是否曾這麼想呢？


    時間不夠用、事情多到做不完等，一直都是現代人共通的煩惱。隨著科技普及，世界瞬息萬變，工作效率大幅提升，這些都是煩惱的根源。


    好比我以前所待的汽車業，從研發一輛新車到生產所需花費的時間越來越短。以往光是研發便佔了二分之一到三分之一的时间，後來縮短成四分之一。研發時間越短，工作量相對增加，難免令人力不從心。


    其他業界也是越來越講求效率，越來越多人覺得「時間不夠用」。


    「時間不夠用」這煩惱意外地複雜難解。之所以會覺得「時間不夠用」，有時是時間真的不夠充裕，有時是出於自己的錯覺。


    我們常為「感覺時間不夠用」與「時間不夠充裕」這兩個問題煩惱不已。


    # ### 解決「覺得時間不夠用」的煩惱❍


    若你是社會人士，不妨回想一下學生時代。'
  - '[PAGE 3]


    是否曾熬夜趕報告呢？


    若有的話，請回想這段經驗。


    明明睡意襲身了，卻遲遲完成不了報告，這時多麼希

    望「能再多點時間」。不過這般情況與其說是「時間不夠

    充裕」，不如說是「感覺時間不夠用」。


    這時難免會懊悔地想：「要是昨天寫好就好了」。這

    般情況並非真的「時間不夠充裕」，而是不知如何善用時

    間，做事缺乏計畫。


    訂立計畫可解決「感覺時間不夠用」的惱人問題。當

    然持之以恆地「訂立計畫」絕不是件簡單的事，因此本書

    從簡單的角度為大家介紹一些如何迅速訂立計畫的方法，

    幫你解決煩惱。


    # 解決「覺得時間不夠用」的煩惱\2


    再舉個關於「時間不夠用」的例子說明吧。


    工作上難免得處理大大小小的事情，有時還必須同時

    進行好幾件工作，忙得不可開交，這時就會有種「時間不

    夠用」的感嘆。


    「必須完成這件工作才行」、「那件工作還沒做」多

    頭馬車的結果，就算再多時間也不夠用。


    這時往往會將「感覺時間不夠用」與「時間不夠充

    裕」這兩件事情搞混。雖然有時真的是時間不夠用，但有時

    並非如此。'
  - '[PAGE 4]


    所謂「覺得時間不夠用」，是指手上有許多工作必須處理，感覺「時間不夠用」的狀態。凡事都想顧及，蠟燭兩頭燒的結果，便是無法專注在一件工作上，这和真的「時間不夠充裕」是不一樣的。


    那麼該怎麼做，才能減少這種情形發生呢？同時處理十件以上的工作，卻一點也不會「感覺時間不夠用」，游刃有餘。若身旁有這樣的人，真想請教他們如何辦到，對吧？畢竟同時處理十件以上的工作是很辛苦的事。


    其實你也可以辦得到。


    好比學生時代一次得念好幾科，課本堆起來比人還高，卻不會「感覺時間不夠用」，不是嗎？


    這是因為預先設計好「功課表」的關係，規定一天學習幾個科目，避免「多頭馬車」情況發生。


    若沒有預先設計好「功課表」，毫無計畫地念書，肯定搞得一團糟，不是嗎？這一科還沒念，那一科還沒複習，當然會「感覺時間不夠用」。


    當然工作計畫不像功課表那麼單純，但只要妥善地計畫，按部就班地進行，也能達到專注每一件工作的效果。


    學會整理自己的工作，計畫如何善用時間，便能減少「感覺時間不夠用」的煩惱。就算真的「時間不夠充裕」，也能從容應付。


    那麼，該如何解決「時間不夠用」的問題呢？請參考以下例子。'
  - '[PAGE 5]


    # 解決「時間不夠用」的煩惱


    我調查了許多關於時間管理的方法，從中找出共同點，也就是「如何應付時間不夠用的方法」，那就是將部分工作委託別人。雖然這方法很有效，但不少人對此方法有些誤解。


    因為有些人覺得就算釋出一些工作，委託別人，情況也不見得改善，只好死了這條心，一肩扛起。但這是一大誤解，而且這般誤解會讓情況惡化。


    請看以下的圖，一個水槽裡有供水口與排水口。


    給水105公升/日


    ![](img/87569369e8074c65e7c56ecade1ddea0_5_0.png)


    排水100公升/日


    現在一天供給105公升的水，排放100公升的水。因為供水量高於排水量，水槽的水越積越多肯定會溢出來。


    而且水不斷累積，要排放大量的水也不是件容易的事。'
  - '[PAGE 6]


    水越積越多的原因還算單純，純粹是因為供水量高於排水量的緣故。如果稍微將供水量控制在100公升以下的話，便能減少水槽裡的水量。


    工作亦是如此。


    常聽到：「釋出一些工作委託別人，才能解決時間不夠用的煩惱」這句話，


    我想很多人會想：


    「工作這麼多，怎麼可能推得掉。」


    「工作這麼多，怎麼可能有人願意幫忙。」


    那是因為看到自己手上的工作，也就是水槽裡的水，才會這麼想。如此繁重的工作確實很難推掉。但只要減少供水量，也就是減少百分之五的新接工作量就行了。


    只要稍微少接點工作量，便能解決「時間不夠用」的煩惱。雖然是個非常單純的道理，卻很少人能確實實踐。為什麼呢？因為進來（接受）的工作量與出去（完成）的工作量很難確實論斷。


    譬如說，「你下個禮拜有什麼非做不可的工作嗎？」


    面對這樣的詢問，很難確實地回答，不是嗎？因為手上多的是那種忘了處理的工作，或是尚未決定何時著手進行 的工作，因此很難正確計算自己的工作量。


    就算想解決「時間不夠用」的問題，也不曉得供水口的水龍頭究竟要關多緊，於是隨著時間分秒流逝，心裡邊想著：「應該沒問題吧。」邊繼續接受新工作。'
  - '[PAGE 7]


    因此一定要確實掌握自己的工作量，才能解決「時間不夠用」的問題。第一步就是養成訂立工作計畫的習慣，也才能解決「感覺時間不夠用」的煩惱。只要學會如何訂立計畫，一定能提升效率，也有許多好處（想知道的人，不妨翻到Part
    10，可先瞭解一下有哪些優點）。


    也許有人對於「訂立計畫再行動」一事，感到十分棘手。放心，本書會為大家介紹如何在極短時間內，不費吹灰之力，訂立計畫的方法。


    其實我以前也是個不擅長訂立計畫的人，本書會為大家介紹我如何克服的方法，而且是個簡單到讓我敢斷言：「要是連這方法都行不通的話，那就不用試其他方法了。 」


    訂立計畫也是得費些心力，不過只要從一次只花個十秒的習慣開始養成就行了。相信你一定辦得到。


    準備好了嗎……？接下來就為大家介紹這些方法吧。


    # 閱讀本書的方法


    本書Part 1～7，是依以下內容所構成的。


    +   * Part 1、2：訂立平日計畫的方法·實行的方法

    * Part 3、4：訂立規模較大的工作計畫的方法

    * Part 5、6：整理長期工作排程的方法

    * Part 7 ：Part 1～6的實踐方法


    譬如，讀到Part 2或Part 4時，想立刻實踐的話，只要閱讀Part 7，立即實踐便見效。


    至於Part 8～10，不按照順序閱讀也行。'
