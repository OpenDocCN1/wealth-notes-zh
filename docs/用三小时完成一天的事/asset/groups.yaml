    # 有時必須懂得「託付」與「拒絕」


    這裡有兩種方法，一種是將部分工作委託他人，一種是明白拒絕。


    畢竟一個人的時間有限，不可能什麼事都一手全攬，懂得委託與拒絕，就管理工作來說也是一種負責的表現。


