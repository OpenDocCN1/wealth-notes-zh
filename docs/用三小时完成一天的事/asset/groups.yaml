    # Part 9


    做自己時間的主人！


    # 工作與私人時間

    均衡分配活用法'
  - '[PAGE 174]


    # 考量公私的時間分配 是否均衡


    # 如何兼顧公私時間分配


    前面主要都是介紹使用「時間地圖」訂立計畫的方法。如同前逑，養成「訂立計畫」、「審視」和「實行」等習慣，便能活用時間。


    還有一個要點，那就是考量如何達到「時間均衡」。並非思考每一項約定和工作的計畫，而是綜觀整體時間，從中求取平衡。


    聽聞「時間均衡」這字眼，馬上會聯想到如何兼顧工作與私人時間*，也就是所謂的「work life blance」。


    公私的時間分配是否均衡沒有一定標準，譬如有些人熱愛工作，會投注大量心力在工作上；相反地，也有人為了家人和興趣，盡量減少工作時間，甚至有人將工作時間分為正職與兼差兩個時段。不管哪一種形式，只要是當事人真正想要的生活，就能樂在其中。


    *如果是學生的情形，相當於課業和課業以外的活動（例如社團活動、興趣嗜好等）的區分。'
  - '[PAGE 175]


    若對現在的時間分配狀況不甚滿意，或是有什麼無法認同的地方，就得設法改變現況。


    雖然不太滿意現況，但未來或許會改變，唯有瞭解自己的時間分配狀況才知道該如何改善。


    # 從短期與長期觀點來看「時間均衡」


    除了上述觀點，還能從短期與長期觀點來看「時間均衡」。假設將為了生活必須工作的時間視為短期，那為了提升技能而學習的時間便屬於長期。


    又好比和客戶接洽（短期），開發新客戶（長期）、開發新商品（短期）以及研發產品（長期）等，都能套用這個觀點。


    足見短期與長期的均衡標準並沒有一定的標準。但基本上，人總是比較注意短期方面的事。「眼前的事都已經忙不完，哪還管得了以後的事啊！」也許你也有過這種感觸吧。其實不只你，大部分的人都有此經驗。未免將來後悔，更應好好考量如何達到時間均衡。'
  - '[PAGE 176]


    # 2 簡單的時間分配計算方法


    重新審視「時間地圖」


    清楚自己如何分配時間，才能瞭解時間分配是否均衡。其實很多人都不瞭解自己如何分配時間，也不明白時間均衡的重要性，這時必須重新審視自己的時間地圖。


    建議最好以週為單位考量時間均衡。譬如一天有二十四小時，一週有一百六十八小時（含睡眠時間）。


    一小時約為一週的0.6%*。將工作時數乘以0.6，便算出佔整體的比率。譬如一週工作四十小時，工作時數約佔一週的24%。出乎意料地少，是吧？


    通勤時間也可按照這方式計算。譬如單程一趟一小時半，一週上班五天，合計約十五小時，約佔9%。通勤時間竟然佔了這麼大的比重，很意外吧？


    其他像是睡眠時間、生活瑣事以及私人娛樂時間等，所佔的比重又如何？首先瞭解自己平常如何分配時間就對了。


    * 168分之1=0.00595……換算成百分比，約0.6。'
