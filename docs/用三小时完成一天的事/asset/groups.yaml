    # 3 「步驟化」就是分解工作


    # 如何應付規模龐大的工作


    每項工作所需花費時間不一。雖然都屬於「職務」，有的是一、兩個小時才能結束的約定，有的是花五分鐘便能搞定的工作。如同Part 1 和Part 2 中所介紹的，藉由「時間地圖」邊整理邊執行。


    若是必須花費好幾天、甚至好幾週才能完成的工作，就比較傷腦筋了。就算擬出大致排程，也不太清楚平常該做些什麼，就會無法「有計畫的行動」。


    一旦步驟化，決定工作流程後，像這類規模龐大的工作也要納入平常的工作排程。


    雖然一般「工作」（task）最長不過兩、三個小時，建議還是要和必須花費較長時間才能完成的工作或約定，一併納入考慮，思考如何進行。確定工作流程的同時，也比較容易納入自己的排程，這才是「有計畫的行動」。


    為了與一般工作有所區別，本書將必須步驟化的龐大工作，稱為「活動」（activity）。'
