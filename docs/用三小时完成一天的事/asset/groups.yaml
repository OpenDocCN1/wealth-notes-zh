    \ p150~p162 |\n| 第13週 6/23~6/29 | p264~p282 | p163~p175 |\n| 第14週 6/30~7/6 | |\
    \ |\n\n- 若還有其他課題，一定要確認每週的課題量。\n- 若發現一週內無法負荷，必須重新審視排程。（填字遊戲原則）\n\n## 4 避免「尖峰期」工作撞期\n\
    \n### 落實計畫的方法\n\n因為長期排程版的「時間地圖」只列出大略的工作內容，難免會遺漏些瑣碎的事項，耽誤進度，以至於無法落實。\n\n事先估算每項專案這週所需花費的時間，便能避免這類情況發生，意即預測「尖峰期」的情況。\n\
    \n「要花多少時間？」是顯示出工作「尖峰期」的一種寫法。標記每項專案所需的時間，然後橫排合計，便能算出這週要花多少時間。若一週工作時間高達七、八成，就算是相當吃緊的排程（專案以外的工作也不能遺漏）。\n\
    \n另一個方法更為簡單，只需抓個大概級數就行了。譬如用「A」表示「使用半週的時間」，用「B」表示「二～三成」，「C」表示「一成以下」，依此標記即可（也可以用紅、黃、綠等顏色區分）。\n\
    \n就算是粗略地估算也能發揮相當大的助益。「有一個A表示這週很忙」、「有兩個A表示神經要繃緊一點」、「有三個B就相當吃緊了」，像這樣憑直覺感受忙碌程度的標記法也能讓「尖峰情況」一目了然。\n\
    \n這麼一來，追加新專案時，便能避免時間亂不過來的問題。\n\n### 清楚標示尖峰期的工作狀況\n\n![](img/87569369e8074c65e7c56ecade1ddea0_123_0.png)\n\
    \n> 打勾確認一下已經完成的工作\n>\n> 預測這一週、這項專案需要花費的時間。\n\n| 週 | 日期 | 所需時間 | A專案 | B專案 | C專案\
    \ |\n|---|---|---|---|---|---|\n| 第 40 週 | 9/29 ~ 10/3 | 8 | 檢討明細單<br>部門會議 | 6\
    \ | 8 |\n| 第 41 週 | 10/6 ~ 10/10 | | 12 | 4 | |\n| 第 42 週 | 10/13 ~ 10/17 | 4\
    \ | 和<br>公司協商<br>請廠商提供估價單 | 12 | |\n| 第 43 週 | 10/20 ~ 10/24 | | 18 | | |\n| 第\
    \ 44 週 | 10/27 ~ 10/31 | 4 | 製作部門資料 | 6 | |\n| 第 45 週 | 11/3 ~ 11/7 | 10 | 取得部門一致認同<br>發包\
    \ | 8 | 8 |\n| 第 46 週 | 11/10 ~ 11/14 | 1 | | 8 | 4 |\n| 第 47 週 | 11/17 ~ 11/21\
    \ | 1 | | 12 | |\n| 第 48 週 | 11/24 ~ 11/28 | | | 4 | |\n| 第 49 週 | 12/1 ~ 12/5\
    \ | | | 6 | |\n| 第 50 週 | 12/8 ~ 12/12 | | | | 8 |\n| 第 51 週 | 12/15 ~ 12/19 |\
    \ | | | 4 |\n| 第 52 週 | 12/22 ~ 12/26 | | | | |\n\n（註：下方為圖表中詳細內容的文本對應，已合併至上方表格或作為補充說明）\n\
    \n- 第 40 週 (9/29 ~ 10/3)：A專案 8小時（檢討明細單、部門會議），B專案 6小時（開始會議、準備資料），C專案 8小時（製作報告資料、拜訪○○公司）。\n\
    - 第 41 週 (10/6 ~ 10/10)：A專案 12小時（第一次調查期間），B專案 4小時（專案會議、準備資料）。\n- 第 42 週 (10/13\
    \ ~ 10/17)：A專案 4小時（和公司協商、請廠商提供估價單），B專案 12小時（整合調查結果）。\n- 第 43 週 (10/20 ~ 10/24)：A專案\
    \ 18小時（檢討對策、與相關人士開會）。\n- 第 44 週 (10/27 ~ 10/31)：A專案 4小時（製作部門資料），B專案 6小時（月會）。\n\
    - 第 45 週 (11/3 ~ 11/7)：A專案 10小時（取得部門一致認同、發包），B專案 8小時（對策實施期間），C專案 8小時（製作報告資料、拜訪○○公司）。\n\
    - 第 46 週 (11/10 ~ 11/14)：A專案 1小時（外製期間），B專案 8小時，C專案 4小時（專案會議、準備資料）。\n- 第 47 週 (11/17\
    \ ~ 11/21)：B專案 12小時（改善效果調查）。註：一旦尖峰期撞期，就得考慮挪一下了。\n- 第 48 週 (11/24 ~ 11/28)：B專案\
    \ 4小時（整合調查結果）。\n- 第 49 週 (12/1 ~ 12/5)：B專案 6小時（階段會報）。\n- 第 50 週 (12/8 ~ 12/12)：B專案（預定改善措施，詳細內容另案），C專案\
    \ 8小時（製作報告資料、拜訪○○公司）。\n- 第 51 週 (12/15 ~ 12/19)：C專案 4小時（專案會議、準備資料）。\n- 第 52 週\
    \ (12/22 ~ 12/26)：無特定標記項目。\n\n合計一週的工作時間，想像這週的工作量。\n\n## 5 活用「專案地圖」的方法①：\n養成「審視地圖」的習慣\n\
    \n### 「地圖」是用來看的\n\n若想落實「專案地圖」，「審視」的工夫很重要。不管製作得再怎麼周全，要是不使用的話，便失去了意義。然而每天確認專案（不管是工作還是讀書方面）的人並不多，光是「審視」這道工夫便能嗅出一個人認真的態度。\n\
    \n「忘記」是讓長期目標和計畫，之所以無法達成的最大原因。人本來就有「只看眼前事」的毛病，唯有養成「審視」習慣才能補拙。就算一天只花一分鐘也沒關係，務必開啟「地圖」審視一下。\n\
    \n在瀏覽每週的各個專案的時候，若工作進度如預期地完成，不妨在欄位上打勾確認已經完成了，如此一來，就能清楚檢視目前的工作狀況，一目了然。\n\n### 「地圖」也需要修正\n\
    \n計畫若是照預定進行當然最好，但事事不可能盡如人意，現實中多的是無法順利達成的計畫，這時就必須重新審視。\n\n人在訂立長期計畫時，往往會貪心地訂立許多計畫。一旦發現排程無法落實，就必須立即「審視」地圖。\n\
    \n若手上計畫太多，無法順利進行 的話，最好當機立斷暫時中止其中某項計畫，或是將某項計畫的時間往後延期，重新製作「地圖」。\n\n畢竟要是勉強進行，只會越來越不想看「地圖」，搞不好還會拖累其他計畫也不定。為了避免這樣的情形發生，一定要重新審視「地圖」。\n\
    \n## 活用「專案地圖」的方法②：同時搭配時間地圖\n\n### 配合一週的排程\n\n為了讓計畫落實，就算每天只花一分鐘，能夠養成「瀏覽專案地圖」的習慣才是最重要的。若能搭配每週的「時間地圖」，效果更好。\n\
    \n瀏覽兩份地圖時，務必確認「專案地圖」中的工作是否能排進「時間地圖」。將應辦事項排進「時間地圖」，也是讓長期排程和週排程緊密結合的要素。只要養成這個習慣，不管時間拖得再長的計畫都能確實地排進日常排程。\n\
    \n當然也要在「時間地圖」上列出專案內容。先「瀏覽」一遍，再將需要留意的事項「寫」下來。養成每天瀏覽的習慣，自然習慣動筆「寫下來」。\n\n### 準備兩種基本地圖就行了\n\
    \n準備兩種地圖才能促使長期與短期計畫都能「有計畫地行動」。換句話說，只要靈活運用兩種地圖，就不需要其他工具了。\n\n若「按月」管理，就算增加一個「地圖」也無妨，但基本上「地圖」不需要太多，才能持之以恆地實行。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_127_0.png)\n\n一下子記在月曆上，一下子記在各專案的排程表或工作清單，像這樣散記各處只會搞不清楚究竟要花多少時間，無法統整工作流程，因此儘可能地將自己「應辦的事」統一記錄，才能減輕壓力，靈活運用「時間管理」，並且「有計畫地行動」。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_127_1.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_127_2.png)\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_127_3.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_127_4.png)\n\
    \n一張「專案地圖」就夠用 127\n"
