    # 實行「料理型」步驟法的第二階段


    前頁的「倒推回去步驟圖」也適用於大規模的計畫管理（也就是所謂的「網絡圖」，有好幾種畫法）。


    但不光畫出圖就行了。除了符合前述的「活用步驟化的三要件」中的要件一（避免漏失任何事）和要件二（擬定先後順序），要件三（配合完成期限擬定計畫）也很重要，所以必須思考各項作業需要花費的時間與排程。


    合計各工作所需時間以確立工作排程，也是一種方法。不過這方法的作業程序比較瑣碎，所以這裡介紹的是較為大略的排程循序漸進的方法。


    首先從整體工作排程為目標倒推回去。譬如，預定上映三天前完成作品，一天後製、三天編輯、十天拍攝，因此最晚上映十七天前必須進行拍攝，像這樣大致擬定工作排程。


    訂立好整體工作排程後，便能將規模較大的作業細分化。譬如要「拍攝」各種場景，因此拍攝地有好幾處，必須連同天候問題一併考慮，安排預備工作排程。考慮種種因素與情況，訂出拍攝工作的步驟（若必須更改工作天數，也'
  - "[PAGE 79]\n\n要配合整體工作排程進行調整）。\n\n最後再將工作排程中決定好的工作和約定，排進自己的「時間地圖」。如果發生時間不敷使用等問題，必須重新檢討步驟。依此步驟化便能訂立出具體又能落實的工作排程。\n\
    \n# 「料理型」步驟法：第二階段 - 排進自己的工作排程 -\n\n# 配合完成期限思考工作排程\n\n![](img/87569369e8074c65e7c56ecade1ddea0_79_0.png)\n\
