    ## 4 套用料理順序的步驟化


    ### 兩種步驟化方法


    接下來，說明一下步驟化方法。


    將無法馬上完成的工作，也就是「活動」予以步驟化，確定每一個為了達成「活動」目的的行動（工作和約定）。


    介紹兩種步驟化的方法，分別為「料理型」和「購物型」。


    ### 「料理型」步驟法


    請想像料理時的步驟。決定做什麼料理時，步驟化的目的就是料理。相反地，為了達成目的所需的東西便是步驟。


    譬如決定做一道「魚」、「燙青菜」和「義大利麵」，首先先調味，若要追溯更早之前的步驟，就是進行烹調準備。像這樣一邊從目的倒推回去，一邊確定必要作業，稱為「料理型」步驟法，也叫做「倒推式」步驟法。


    那麼，為何必須步驟化呢？做料理時就算沒有步驟化，邊看食譜邊做也行。


    ## 「料理型」步驟法


    ![](img/87569369e8074c65e7c56ecade1ddea0_63_0.png)


    倒推回去想，比較容易瞭解


    然而大部分工作可沒食譜可參考*。為了有計畫地做好，沒有範本可供參考的工作，得靠自己思考，這時就需要「步驟化」的能力。


    接著說明「購物型」步驟化吧。


    *有些工作有工作手冊可供參考，因此就算沒有步驟化也沒關係。然而不管身處什麼樣的職場環境，一定有那種沒有工作手冊可供參考的工作，因此學習如何將工作步驟化很重要。


    ## 5 套用出門購物模式的步驟化


    ### 「購物型」步驟法


    另一種「購物型」步驟法，也是適合倒推回想時使用的方法。


    試著想像自己「購物」時的情景。購物這項活動的目的不是「購物」，而是購買「必要的東西」，然後回想到底要買些什麼。


    首先清楚地列出購物清單。列出清單時，最好依「食品」、「廚房用品」、「衛浴用品」等項目分門別類地列舉出來，比較清楚。


    同樣地，將該做的事也列出清單，這就是「購物型」步驟法，也稱為「列清單法」。


    那麼，像這樣逐步步驟化究竟有何好處呢？有兩個理由。試著思考購物的例子吧。


    若沒帶清單購物的話，有時會忘了要買些什麼。譬如出門前明明想著：「家裡沒備用燈泡了，要記得買。」結果還是忘了買。

