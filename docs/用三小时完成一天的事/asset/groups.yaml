    # 5 成為專案高手的條件③：妥善掌控「多項」專案的流程


    # 手上同時有多件專案進行


    其實很多人和小夫一樣，手上有多項專案同時進行。除了參與團隊專案，還有個人目標必須訂立、管理，因此手上同時有多件專案進行是相當平常的事。


    遇到工作量「龐雜」的專案，不妨仿效訂立個人讀書計畫，以「每天唸書一個鐘頭」為目標，每天分配一些進度。當然專案也有繁忙與清閒的時候，尤其是必須和別人合作的專案更是如此。


    當手上有多件專案同時進行時，只要安排一項處於「尖峰期」的專案，搭配另一件處於「離峰期」的計畫就行了。相反地，要是「尖峰期」撞期就不妙了。因此必須預測每件專案的工作量，確認如何安排比較妥當。如同
    Part 2 提及的「填字遊戲原則」，最好分別就計畫的整體「流程」和各時期的「工作量」來衡量。當然難免會出現「尖峰期」撞期的情形，只要做好事前準備，便能隨時調整狀況。'
