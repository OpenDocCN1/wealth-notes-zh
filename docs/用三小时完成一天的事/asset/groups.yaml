  - '[PAGE 130]


    # ## 擱定專案地圖

    ## 好比創作一篇故事


    「達成長期目標」不是件容易的事，為什麼呢？因為考驗著一個人的耐心與細心。不妨換個角度想，完成一件長期事物，好比一步步接近某個遙遠目標。若以高爾夫球譬喻，就像用推桿來攻略五百碼長洞（457公尺）。


    假設一桿可進十碼，每推桿一次便越接近五百碼的目標，但肉眼很難分辨五百碼與四百九十碼的差距，也無法體會朝目標更進一步的感覺。


    就算「推一桿」也感受不到任何變化，容易心生「算了，不想打了」的念頭，選擇放棄。


    因此能夠體會到接近目標的實際感受很重要，最好以週為單位細分目標，效果更好。


    設定階段目標好比創作一篇故事。製作「專案地圖」，就像為自己量身打造一篇故事。


    對自己有自信才能創作這篇故事，但不能大意（看輕目標），善用「填字遊戲原則」創作自己的故事。


    另一個要點是千萬別勉強「設定長期目標」，倒也不是說絕對不能設定難以克服的目標，只要不過於勉強，不管設定太鬆或太嚴苛的目標都行，由自己決定如何創作。'
  - '[PAGE 131]


    也許剛開始會覺得困難重重，怎麼做都失敗，但努力一定會**有回報**，勇於挑戰吧！

    就算每天只花一分鐘也行，養成瀏覽「專案地圖」的習慣，一、兩年後就會發現自己脫胎換骨。


