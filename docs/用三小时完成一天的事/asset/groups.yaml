    # ## 4 思考「何時進行」列出工作內容


    # ### 工作也必須「當場確認」，「立即」寫下來


    接下來，說明工作的書寫方式。你平常會寫工作計畫嗎？我認識的人大多不會，都是隨手記一下而已。唯有整


    合手邊的工作，才能有計畫地行動。


    像是書寫文件報告、收發郵件等，無法決定時間的事


    情均屬於工作。工作和約定一樣，也必須「當場確認」，


    「立即」寫下來*。


    工作和約定的性質不同，不會產生重複排約情形。但


    沒有隨手記下來的結果，往往就是忘了。務必養成「當


    場寫下來」的習慣，就不必老是惦記著，心情自然輕鬆許


    多。


    我們往往工作時才會想起要做些什麼，以至於計畫永遠趕不上變化，只要養成使用「時間地圖」的習慣便不怕


    疏漏。


    *若是當場必須解決的工作，就不必記下來了（參考138頁）。'
  md: "\n## 活用時間，養成三大習慣\n\n想想你身边是否有「做事非常有计划」的人呢？\n\n这种人有許多優點，譬如「一旦決定，就會付諸執行」、「擅於掌控行動的順序和時機」、「寧可先努力後享受」等。總之，就是「預想未來發展，構思如何行動並付諸實行」。\n\
    \n也许你会觉得“有计划的行动”不是件容易的事，其实只要养成以下三大习惯就行了：\n\n- 1. “订计划”决定做什么？什么时候做？\n- 2. 一旦发现决定的计划有问题，“立即审视”。\n\
    - 3. “实行”决定好的计划。\n\n养成“订计划”和“实行”的习惯，才能有意識地行動。但就算勉強訂立計畫也無法實行，因此加上「審視」這項習慣才能算完整。\n\
    \n也许有人觉得“订计划”不是件容易的事。\n\n但这三项绝对不是什麼特別的習慣，無論是誰都做得得到。只要肯費點工夫，一定能改掉做事缺乏計畫的毛病。\n\n\
    接下來，分別說明這三大習慣吧。\n\n### 你應有的第一個習慣是：訂立計畫（plan）\n\n![img/87569369e8074c65e7c56ecade1ddea0_18_0.png](img/87569369e8074c65e7c56ecade1ddea0_18_0.png)\n\
    \n## 輕鬆養成「訂立計畫」的習慣\n\n第一個習慣是「訂立計畫」（plan）。一提到「訂立計畫」會覺得很困難也說不定。其實說得簡單點，就是想像成「什麼時候著手進行」。\n\
    \n譬如有份報告這禮拜必須提出，於是你以「禮拜五提交」為目標，默默籌畫著：「禮拜四下午開始寫，禮拜五便能提出」，這就是「計畫」。\n\n但有一點必須注意。既然決定「禮拜四動手寫」，要是忘掉就傷腦筋了。為了避免這種情況發生，最好養成一旦決定，便馬上寫下來的習慣。\n\
    \n也許一聽到「訂立計畫」，就會想到「今天要做些什麼」，決定一天的行動順序。但這樣訂立計畫的方式過於耗時費工，建議不妨決定做什麼後，便順手逐一寫下來，如此一來，便能輕鬆地訂立計畫。\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_19_0.png](img/87569369e8074c65e7c56ecade1ddea0_19_0.png)\n\
    \n### 只用腦袋思考\n\n想像什麼時候著手進行？\n\n- 時間流程\n- 書寫報告\n- 期限\n- 週三 / 週四 / 週五\n\n### 最好養成的習慣\n\
    \n一旦決定做些什麼、什麼時候做，為了避免忘記，最好寫下來。\n\n- 週三\n- 週四\n  - 書寫OO的報告\n- 週五\n\n### 你應有的第二個習慣是：審視（see）\n\
    \n“审视”谁都办得到！\n\n第二個習慣是「審視」（see）。不管工作還是生活都有許多想做的事，或必須處理的事。於是事情越來越多，不知不覺間便成了無法實行的計畫，因此必須「審視」計畫。「審視」計畫是在於再次確認是否與原定計畫有變，有變就需要調整。好比發現寫報告的那天剛好要參加一場聚會，為了確實完成報告必須推掉邀約，這就是「審視」計畫。\n\
    \n不過早點察覺問題會更符合「計畫性」。因為要是早點察覺，便能提前一天完成報告，出席聚會。因此最好還是儘可能早點發現計畫有誤。\n\n其實養成「審視」的習慣並不困難。「訂立計畫」時，也就是「寫下來」的同時便能察覺計畫有誤。\n\
    \n只要懂得整合計畫，就不會覺得「審視」計畫是件困難的事。\n\n![img/87569369e8074c65e7c56ecade1ddea0_21_0.png](img/87569369e8074c65e7c56ecade1ddea0_21_0.png)\n\
    \n### 只用腦袋思考\n\n![img/87569369e8074c65e7c56ecade1ddea0_21_1.png](img/87569369e8074c65e7c56ecade1ddea0_21_1.png)\n\
    \n### 最好養成的習慣\n\n整合計畫\n\n![img/87569369e8074c65e7c56ecade1ddea0_21_2.png](img/87569369e8074c65e7c56ecade1ddea0_21_2.png)\n\
    \n## 5 你應有的第三個習慣：實行 (do)\n\n“实行”谁都办得到！\n\n不管什麼樣的計畫，要是沒有付諸實行，便一點意義也沒有了。因此第三個習慣就是「實行」決定好、審視過的事。\n\
    \n當然「實行」也不是什麼特別技巧。譬如從開始書寫報告到完成便是一種「實行」，很簡單吧。但這麼簡單的事，卻往往無法順利進行，不是忘了做，就是趕得七葷八素，相信大家或多或少都有這種經驗吧。\n\
    \n我們的腦子裡平常就塞滿許多事，所以剛剛還記得的事，一下子便忘得一乾二淨，一點都不稀奇，但這麼一來可是會漏失實行計畫的時機。\n\n為了能夠把握時機實行決定好的事，必須「瀏覽」計畫，而且不是一天看個兩、三次，而是「邊瀏覽計畫，邊工作」才能順利進行。\n\
    \n對於老是忘東忘西的人而言，唯有養成「瀏覽」計畫的習慣，才能切實執行計畫。\n\n請記住：plan → see → do 是你工作提高三倍的「三部曲」。\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_23_0.png](img/87569369e8074c65e7c56ecade1ddea0_23_0.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_23_1.png](img/87569369e8074c65e7c56ecade1ddea0_23_1.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_23_2.png](img/87569369e8074c65e7c56ecade1ddea0_23_2.png)\n\
    \n## 6 先有「時間地圖」就可清楚整理出時間\n\n超好用的「時間地圖」！\n\n前述的「訂立計畫」、「審視」和「實行」等習慣，分開來看都不是什麼特別技巧。平常我們腦子裡塞滿許多事，只要養成這些習慣，便能「有計畫的行動」。相反地，要是無法養成這些習慣，便無法「有計畫的行動」。\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_24_0.png](img/87569369e8074c65e7c56ecade1ddea0_24_0.png)\n\
    \n時間管理（time management）是種幫助我們養成「訂立計畫」、「審視」和「實行」等習慣的手法。聽到「時間管理」這字眼，也許會聯想到是種「節約時間的技巧」，其實它的本意是「養成計畫性行動的習慣」。\n\
    \n實行時間管理時，必須動手寫，用眼看，本書將此稱為「時間地圖」。藉由「時間地圖」將各種「要做的事」整合為一，不但腦筋變得更清楚，工作起來也更順利。\n\n\
    ### Part 1\n\n“订计划”、“审视”和“实行”等习惯，是以“时间地图”为中心，紧密相连。\n\n因此在时间管理中，“如何制作地图，如何活用地图”非常重要。\n\
    \n### 活用「時間地圖」養成三大習慣，便能「有計畫的行動」\n\n![img/87569369e8074c65e7c56ecade1ddea0_25_0.png](img/87569369e8074c65e7c56ecade1ddea0_25_0.png)\n\
    \n### 1分鐘掌握重點！\n\n### 什麼是時間地圖？\n\n本書所介紹的「時間地圖」就是書寫計畫和排程，指引今後前進的方向，稱為「地圖」。\n\n\
    Part 2 中會詳細說明，只要使用記事本和電腦軟體，便能製作「時間地圖」。\n\n## 7 從縱向與橫向觀點達到「時間地圖」的目的\n\n填字遊戲原則\n\
    \n本書介紹的「時間地圖」，意即整合自己的計畫。如右圖，藉由寫下「工作內容」以及「何時進行」來完成一張時間地圖。\n\n手上通常會有好幾件工作，就像小美和小佑，往往必須同時處理好幾件事。因此「時間地圖」上也會出現一天有幾件工作重疊的情形，這時利用縱向與橫向觀察審視時間地圖，才能迅速找出問題。\n\
    \n想像自己在玩填字遊戲。若只填滿橫向格子並無法得到正確答案，唯有同時觀察縱向文字才能解答。\n\n「時間地圖」亦是如此，必須以橫向觀點思考每件工作「是否來得及完成」，也必須以縱向觀點確認每天的工作量，思考「時間是否夠用」，兼顧兩方觀點。\n\
    \n也許光是用腦袋想會覺得有些困難，其實動筆寫下來就簡單多了，這便是養成「審視」習慣，接下來的Part 2會詳細說明。\n\n### 時間地圖就是整合好幾個工作的流程\n\
    \n| | 週一 | 週二 | 週三 | 週四 | 週五 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | | | 工作A | 工作A | 工作A | |\n| | | | 工作B | 工作B | 工作B |\n| | | | 工作C | | 工作D |\n\
    | | 會議E | 會議F | | 會議G | 會議H |\n\n### 像玩填字遊戲一樣，分別由兩個方向審視時間地圖\n\n![img/87569369e8074c65e7c56ecade1ddea0_27_0.png](img/87569369e8074c65e7c56ecade1ddea0_27_0.png)\n\
    \n### Part 1 總整理\n\n## 活用三大習慣與「時間地圖」，培養有計畫的行動力\n\n![img/87569369e8074c65e7c56ecade1ddea0_28_0.png](img/87569369e8074c65e7c56ecade1ddea0_28_0.png)\n\
    \n- 「寫下」決定要做的事\n- 從縱向、橫向兩個觀點審視、整合計畫\n- 邊「審視」計畫，邊行動\n\n只要切實執行這些簡單的要点，便能自然養成「訂立計畫」、「審視」和「實行」等三大習慣。\n\
    \n### 時間地圖就是整合許多計畫（工作）\n\n![img/87569369e8074c65e7c56ecade1ddea0_29_0.png](img/87569369e8074c65e7c56ecade1ddea0_29_0.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_1.png](img/87569369e8074c65e7c56ecade1ddea0_29_1.png)\n\
    \n時間表\n\n![img/87569369e8074c65e7c56ecade1ddea0_29_2.png](img/87569369e8074c65e7c56ecade1ddea0_29_2.png)\n\
    \n### 填字遊戲原則：分別由兩個方向審視時間地圖\n\n![img/87569369e8074c65e7c56ecade1ddea0_29_3.png](img/87569369e8074c65e7c56ecade1ddea0_29_3.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_4.png](img/87569369e8074c65e7c56ecade1ddea0_29_4.png)\n\
    \n時間表\n\n![img/87569369e8074c65e7c56ecade1ddea0_29_5.png](img/87569369e8074c65e7c56ecade1ddea0_29_5.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_6.png](img/87569369e8074c65e7c56ecade1ddea0_29_6.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_7.png](img/87569369e8074c65e7c56ecade1ddea0_29_7.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_8.png](img/87569369e8074c65e7c56ecade1ddea0_29_8.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_9.png](img/87569369e8074c65e7c56ecade1ddea0_29_9.png)\n\
    \n每寫下一項計畫，便花個十秒審視今天的計畫。千萬別小看這十秒，隨時記得「一旦決定便立即寫下來」、「工作告一段落便審視一次計畫」，自然而然就養成了習慣。\n\
    \n## 時間活用秘技 01\n\n### 判斷工作優先順序的方法\n\n一提到「時間管理」，很多人會聯想到「思考工作的優先順序」一事，其實工作的優先順序在時間管理中並非那麼重要。決定工作的優先順序是在有限時間內選擇要做的事，也就是面臨時間窘迫時，必須做的一項作業。時間管理的目的便是整理工作，避免陷入這般窘況。只要管理得當，根本不需要煩惱什麼優先順序\
    \ ( 意即在「審視」計畫階段，這項判斷便已結束) 。\n\n雖說如此，難免還是會遇到突發狀況，或工作量突然暴增，非得決定優先順序的時候。也許有些人覺得這種事很難判斷，其實非常簡單，一點都不困難。\n\
    \n先從「選擇什麼」談起吧。試著思考這問題：「要是非得去無人島一趟的話，你會帶哪一本書去呢？」\n\n譬如從圖書館龐大的藏書中，挑選最喜歡的十本帶去，的確頗難取捨。這時不妨先將所有藏書大略分為A級、B級……等，然後從A級中挑選最適合的十本，這就是所謂絕對評價\
    \ ( 加上等級 ) 的作法。\n\n再思考另一個例子，從自己所有的十一本中挑選十本，這時情形完全不一樣。因為馬上便能從十一本中挑出自己喜歡的，再來就是思考從剩下的幾本中剔除一本，這就是所謂相對評價\
    \ ( 比較 ) 的作法。\n\n不過有些人就是不擅長絕對評價這種作法。譬如，很難維持同一個基準將必要的書籍分為A、B、C三個等級（往往最後是C比B來得重要）。相反地，有些人擅長相對評價。當他判斷「哪一本書比較有趣」後，就算經過再久，這判斷也不會改變。\n\
    \n回到關於時間管理的話題。在講述時間管理的相關書籍中，大部分提及判斷工作優先順序的方法，都採第一種方法（將工作分為A等級、B等級……）。其實第二種方法（「思考要刪除哪一個？」）更能及早做出判斷。\n\
    \n只要事先計畫好再行動，就不會發生時間不夠用的窘況。因為可以判斷要刪除哪一個或哪兩個（是要終止呢？還是暫且擱著），不需要決定優先順序，只要简单地思考「剔除哪一個」就行了。\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_31_0.png](img/87569369e8074c65e7c56ecade1ddea0_31_0.png)\n\
    \n### Part 2\n\n工作與約定大不同！\n\n## 活用「時間地圖」實行計畫\n\n### 1 計畫有兩種形式\n\n#### 由時間決定的預定計畫，叫做「約定」\n\
    \n“时间地图”上的计划有两种，虽然都是“使用自己的时间做些什么”，性质却不一样。\n\n一种是通过会议和洽谈，由时间决定的计划，好比在学校上课一事，完全取决于时间。\n\
    \n这种预定计划称为“约定（appointment）”，一般称为“排程管理”，也许你早就实行说不定。\n\n#### 不是由時間決定的計畫，叫做「工作」\n\
    \n另一种是自己决定时间的计划，比如写文件报告、收发邮件等独立完成的作业，好比老师布置的作业。虽然有期限，但何时着手取决于自己。\n\n一般称这种预定计划为“工作（task）”。工作无法与约定同时进行，必须利用没有约定的空档时间处理。\n\
    \n### 寫在時間地圖上的兩種工作\n\n![img/87569369e8074c65e7c56ecade1ddea0_35_0.png](img/87569369e8074c65e7c56ecade1ddea0_35_0.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_35_1.png](img/87569369e8074c65e7c56ecade1ddea0_35_1.png)\n\
    \n**約定（appointment）的特徵**\n嚴格遵守時間（好比上課）\n同一個時段無法同時進行兩項約定\n\n**工作（task）的特徵**\n時間自由（好比作業）\n\
    利用沒有約定的空檔時間實行\n\n**1分鐘掌握重點！**\n\n**工作的影響力比約定來得大**\n— 聽到時間管理，也許會覺得：「之所以管理時間，是為了實踐約定」。其實大部分人用於處理工作的時間，比用於實踐約定的時間來得長，足見管理工作上的內容非常重要。\n\
    \n### 2 為何要整合時間地圖？\n\n#### 製作兩個欄位\n\n“时间地图”的基本形式就是整合约定和工作事项，接下来说明为何需要整合的理由。\n\n\
    就某种意味来说，约定和工作都是利用自己的时间进行。因此约定较多的日子，最好别安排工作，相反地，工作繁重的时候，也不适宜安排约定。然而分开计划的结果，往往无法确定工作量和就算勉强订立计划也容易遗漏。\n\
    \n“审视”计划是为了避免这般情况发生，整合约定和工作则是为了让这道程序变得更简单。\n\n约定往往取决于时间，所以要写在有标示时间的栏目，而且必须和工作分开写（依日期书写）。这么一来，无法更改时间的约定就不会和可以自由选择时间的工作混为一谈。\n\
    \n计划不是订一次就能搞定，也有可能追加或变更，必须视情况而变更加实行的时间。总之，在约定时间不变的原则下，可以调整工作。\n\n### 在時間地圖上寫下約定與工作\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_37_0.png](img/87569369e8074c65e7c56ecade1ddea0_37_0.png)\n\
    \n| | 週一 | 週二 | 週三 | 週四 | 週五 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | | □工作A | □工作B | □工作B | □工作B | □工作C<br>□工作D<br>□工作E |\n| 9:00 | | | | | |\n|\
    \ 10:00 | | | | | |\n| 11:00 | | 會議 | | | 會議 |\n| 12:00 | | | | | |\n| 13:00 |\
    \ | | | | 會議 |\n| 14:00 | 洽商 | | | 洽商 | |\n| 15:00 | | 會議 | | | |\n| 16:00 | |\
    \ | | | |\n\n寫下工作內容\n寫下約定事項\n寫在標有時間欄位的部分，等同於「排程管理」。\n\n一天的工作量一目了然\n（包括約定與工作）\n\
    \n像這樣整合好約定和工作後，不管是「訂立計畫」、「審視」或「實行」等階段，只要看這張「時間地圖」*就夠了。不但便於書寫，也能避免遺漏事情。\n\n> *無論使用記事本還是電腦製作「時間地圖」，都是為了整合約定與工作。\n\
    \n### ③ 思考「何時完成」 寫下約定事項\n\n#### 「當場確認」，「立即」寫下來\n\n接下來，從如何書寫約定開始說明。決定什麼時候開會，和誰約好什麼時候碰面，這些都屬於約定。決定約定最重要的原則就是「避免重複」，意即同一段時間內避免安排兩項約定。\n\
    \n為了避免重複排約，一定要先確認這段時間是否空著，再安排新約定。安排新約定時，最好當場確認「時間地圖」，立即寫下來，只要遵守這原則就不必擔心出差錯。\n\n\
    唯有養成「當場確認」、「立即」寫下來的習慣，才能避免重複排約。若心想「等一下就寫好了」，肯定會忘記，這點一定要注意。\n\n#### 何時開始，何時結束，一目了然\n\
    \n如右圖畫條線將約定框起來，「何時開始，何時結束」一目了然，也能清楚區分哪些是工作時間。框線部分是約定，空白部分是工作時間。\n\n### 一旦決定約定時間，立刻寫下來\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_39_0.png](img/87569369e8074c65e7c56ecade1ddea0_39_0.png)\n\
    \n- 思考自己 開始行動的時間  9:00 10:00 11:00 12:00  9:55 ○○會議  預定出席十點的會議。連同移動時間一併考慮，訂出開始行動時間為9:55\n\
    - 倒算開始 行動時間  12:00 13:00 14:00 15:00 16:00  13:15 移動  14:00 和□□公司洽商  16:00 移動\
    \  和客戶約定下午二點碰面。倒算移動時間，決定開始行動的時間（離開辦公室的時間）。\n- 不清楚何時結束的約定  14:00 15:00 16:00 17:00\
    \ 18:00  15:00 和XX洽商  從下午三點開始洽商，但不清楚何時結束。為了避免和其他約定重疊，最好畫得比預測長一點。\n\n決定約定什麼時候開始時，必須連移動所需花費的時間一併考慮*。若不清楚什麼時候結束，一定要比預測結束的時間稍微畫長一點，避免撞約。\n\
    \n* 很多人只寫上交通工具的發車時間，往往差點趕不上車，這點要特別注意。\n\n### 4 思考「何時進行」列出工作內容\n\n#### 工作也必須「當場確認」，「立即」寫下來\n\
    \n接下來，說明工作的書寫方式。你平常會寫工作計畫嗎？我認識的人大多不會，都是隨手記一下而已。唯有整合手邊的工作，才能有計畫地行動。\n\n像是書寫文件報告、收發郵件等，無法決定時間的事情均屬於工作。工作和約定一樣，也必須「當場確認」，「立即」寫下來*。\n\
    \n工作和約定的性質不同，不會產生重複排約情形。但沒有隨手記下來的結果，往往就是忘了。務必養成「當場寫下來」的習慣，就不必老是惦記著，心情自然輕鬆許多。\n\
    \n我們往往工作時才會想起要做些什麼，以至於計畫永遠趕不上變化，只要養成使用「時間地圖」的習慣便不怕疏漏。\n\n*若是當場必須解決的工作，就不必記下來了（參考138頁）。\n"
  mdcn: "\n## 活用時間，養成三大習慣\n\n想想你身边是否有「做事非常有计划」的人呢？\n\n这种人有許多優點，譬如「一旦決定，就會付諸執行」、「擅於掌控行動的順序和時機」、「寧可先努力後享受」等。總之，就是「預想未來發展，構思如何行動並付諸實行」。\n\
    \n也许你会觉得“有计划的行动”不是件容易的事，其实只要养成以下三大习惯就行了：\n\n- 1. “订计划”决定做什么？什么时候做？\n- 2. 一旦发现决定的计划有问题，“立即审视”。\n\
    - 3. “实行”决定好的计划。\n\n养成“订计划”和“实行”的习惯，才能有意識地行動。但就算勉強訂立計畫也無法實行，因此加上「審視」這項習慣才能算完整。\n\
    \n也许有人觉得“订计划”不是件容易的事。\n\n但这三项绝对不是什麼特別的習慣，無論是誰都做得得到。只要肯費點工夫，一定能改掉做事缺乏計畫的毛病。\n\n\
    接下來，分別說明這三大習慣吧。\n\n### 你應有的第一個習慣是：訂立計畫（plan）\n\n![img/87569369e8074c65e7c56ecade1ddea0_18_0.png](img/87569369e8074c65e7c56ecade1ddea0_18_0.png)\n\
    \n## 輕鬆養成「訂立計畫」的習慣\n\n第一個習慣是「訂立計畫」（plan）。一提到「訂立計畫」會覺得很困難也說不定。其實說得簡單點，就是想像成「什麼時候著手進行」。\n\
    \n譬如有份報告這禮拜必須提出，於是你以「禮拜五提交」為目標，默默籌畫著：「禮拜四下午開始寫，禮拜五便能提出」，這就是「計畫」。\n\n但有一點必須注意。既然決定「禮拜四動手寫」，要是忘掉就傷腦筋了。為了避免這種情況發生，最好養成一旦決定，便馬上寫下來的習慣。\n\
    \n也許一聽到「訂立計畫」，就會想到「今天要做些什麼」，決定一天的行動順序。但這樣訂立計畫的方式過於耗時費工，建議不妨決定做什麼後，便順手逐一寫下來，如此一來，便能輕鬆地訂立計畫。\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_19_0.png](img/87569369e8074c65e7c56ecade1ddea0_19_0.png)\n\
    \n### 只用腦袋思考\n\n想像什麼時候著手進行？\n\n- 時間流程\n- 書寫報告\n- 期限\n- 週三 / 週四 / 週五\n\n### 最好養成的習慣\n\
    \n一旦決定做些什麼、什麼時候做，為了避免忘記，最好寫下來。\n\n- 週三\n- 週四\n  - 書寫OO的報告\n- 週五\n\n### 你應有的第二個習慣是：審視（see）\n\
    \n“审视”谁都办得到！\n\n第二個習慣是「審視」（see）。不管工作還是生活都有許多想做的事，或必須處理的事。於是事情越來越多，不知不覺間便成了無法實行的計畫，因此必須「審視」計畫。「審視」計畫是在於再次確認是否與原定計畫有變，有變就需要調整。好比發現寫報告的那天剛好要參加一場聚會，為了確實完成報告必須推掉邀約，這就是「審視」計畫。\n\
    \n不過早點察覺問題會更符合「計畫性」。因為要是早點察覺，便能提前一天完成報告，出席聚會。因此最好還是儘可能早點發現計畫有誤。\n\n其實養成「審視」的習慣並不困難。「訂立計畫」時，也就是「寫下來」的同時便能察覺計畫有誤。\n\
    \n只要懂得整合計畫，就不會覺得「審視」計畫是件困難的事。\n\n![img/87569369e8074c65e7c56ecade1ddea0_21_0.png](img/87569369e8074c65e7c56ecade1ddea0_21_0.png)\n\
    \n### 只用腦袋思考\n\n![img/87569369e8074c65e7c56ecade1ddea0_21_1.png](img/87569369e8074c65e7c56ecade1ddea0_21_1.png)\n\
    \n### 最好養成的習慣\n\n整合計畫\n\n![img/87569369e8074c65e7c56ecade1ddea0_21_2.png](img/87569369e8074c65e7c56ecade1ddea0_21_2.png)\n\
    \n## 5 你應有的第三個習慣：實行 (do)\n\n“实行”谁都办得到！\n\n不管什麼樣的計畫，要是沒有付諸實行，便一點意義也沒有了。因此第三個習慣就是「實行」決定好、審視過的事。\n\
    \n當然「實行」也不是什麼特別技巧。譬如從開始書寫報告到完成便是一種「實行」，很簡單吧。但這麼簡單的事，卻往往無法順利進行，不是忘了做，就是趕得七葷八素，相信大家或多或少都有這種經驗吧。\n\
    \n我們的腦子裡平常就塞滿許多事，所以剛剛還記得的事，一下子便忘得一乾二淨，一點都不稀奇，但這麼一來可是會漏失實行計畫的時機。\n\n為了能夠把握時機實行決定好的事，必須「瀏覽」計畫，而且不是一天看個兩、三次，而是「邊瀏覽計畫，邊工作」才能順利進行。\n\
    \n對於老是忘東忘西的人而言，唯有養成「瀏覽」計畫的習慣，才能切實執行計畫。\n\n請記住：plan → see → do 是你工作提高三倍的「三部曲」。\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_23_0.png](img/87569369e8074c65e7c56ecade1ddea0_23_0.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_23_1.png](img/87569369e8074c65e7c56ecade1ddea0_23_1.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_23_2.png](img/87569369e8074c65e7c56ecade1ddea0_23_2.png)\n\
    \n## 6 先有「時間地圖」就可清楚整理出時間\n\n超好用的「時間地圖」！\n\n前述的「訂立計畫」、「審視」和「實行」等習慣，分開來看都不是什麼特別技巧。平常我們腦子裡塞滿許多事，只要養成這些習慣，便能「有計畫的行動」。相反地，要是無法養成這些習慣，便無法「有計畫的行動」。\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_24_0.png](img/87569369e8074c65e7c56ecade1ddea0_24_0.png)\n\
    \n時間管理（time management）是種幫助我們養成「訂立計畫」、「審視」和「實行」等習慣的手法。聽到「時間管理」這字眼，也許會聯想到是種「節約時間的技巧」，其實它的本意是「養成計畫性行動的習慣」。\n\
    \n實行時間管理時，必須動手寫，用眼看，本書將此稱為「時間地圖」。藉由「時間地圖」將各種「要做的事」整合為一，不但腦筋變得更清楚，工作起來也更順利。\n\n\
    ### Part 1\n\n“订计划”、“审视”和“实行”等习惯，是以“时间地图”为中心，紧密相连。\n\n因此在时间管理中，“如何制作地图，如何活用地图”非常重要。\n\
    \n### 活用「時間地圖」養成三大習慣，便能「有計畫的行動」\n\n![img/87569369e8074c65e7c56ecade1ddea0_25_0.png](img/87569369e8074c65e7c56ecade1ddea0_25_0.png)\n\
    \n### 1分鐘掌握重點！\n\n### 什麼是時間地圖？\n\n本書所介紹的「時間地圖」就是書寫計畫和排程，指引今後前進的方向，稱為「地圖」。\n\n\
    Part 2 中會詳細說明，只要使用記事本和電腦軟體，便能製作「時間地圖」。\n\n## 7 從縱向與橫向觀點達到「時間地圖」的目的\n\n填字遊戲原則\n\
    \n本書介紹的「時間地圖」，意即整合自己的計畫。如右圖，藉由寫下「工作內容」以及「何時進行」來完成一張時間地圖。\n\n手上通常會有好幾件工作，就像小美和小佑，往往必須同時處理好幾件事。因此「時間地圖」上也會出現一天有幾件工作重疊的情形，這時利用縱向與橫向觀察審視時間地圖，才能迅速找出問題。\n\
    \n想像自己在玩填字遊戲。若只填滿橫向格子並無法得到正確答案，唯有同時觀察縱向文字才能解答。\n\n「時間地圖」亦是如此，必須以橫向觀點思考每件工作「是否來得及完成」，也必須以縱向觀點確認每天的工作量，思考「時間是否夠用」，兼顧兩方觀點。\n\
    \n也許光是用腦袋想會覺得有些困難，其實動筆寫下來就簡單多了，這便是養成「審視」習慣，接下來的Part 2會詳細說明。\n\n### 時間地圖就是整合好幾個工作的流程\n\
    \n| | 週一 | 週二 | 週三 | 週四 | 週五 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | | | 工作A | 工作A | 工作A | |\n| | | | 工作B | 工作B | 工作B |\n| | | | 工作C | | 工作D |\n\
    | | 會議E | 會議F | | 會議G | 會議H |\n\n### 像玩填字遊戲一樣，分別由兩個方向審視時間地圖\n\n![img/87569369e8074c65e7c56ecade1ddea0_27_0.png](img/87569369e8074c65e7c56ecade1ddea0_27_0.png)\n\
    \n### Part 1 總整理\n\n## 活用三大習慣與「時間地圖」，培養有計畫的行動力\n\n![img/87569369e8074c65e7c56ecade1ddea0_28_0.png](img/87569369e8074c65e7c56ecade1ddea0_28_0.png)\n\
    \n- 「寫下」決定要做的事\n- 從縱向、橫向兩個觀點審視、整合計畫\n- 邊「審視」計畫，邊行動\n\n只要切實執行這些簡單的要点，便能自然養成「訂立計畫」、「審視」和「實行」等三大習慣。\n\
    \n### 時間地圖就是整合許多計畫（工作）\n\n![img/87569369e8074c65e7c56ecade1ddea0_29_0.png](img/87569369e8074c65e7c56ecade1ddea0_29_0.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_1.png](img/87569369e8074c65e7c56ecade1ddea0_29_1.png)\n\
    \n時間表\n\n![img/87569369e8074c65e7c56ecade1ddea0_29_2.png](img/87569369e8074c65e7c56ecade1ddea0_29_2.png)\n\
    \n### 填字遊戲原則：分別由兩個方向審視時間地圖\n\n![img/87569369e8074c65e7c56ecade1ddea0_29_3.png](img/87569369e8074c65e7c56ecade1ddea0_29_3.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_4.png](img/87569369e8074c65e7c56ecade1ddea0_29_4.png)\n\
    \n時間表\n\n![img/87569369e8074c65e7c56ecade1ddea0_29_5.png](img/87569369e8074c65e7c56ecade1ddea0_29_5.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_6.png](img/87569369e8074c65e7c56ecade1ddea0_29_6.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_7.png](img/87569369e8074c65e7c56ecade1ddea0_29_7.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_8.png](img/87569369e8074c65e7c56ecade1ddea0_29_8.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_29_9.png](img/87569369e8074c65e7c56ecade1ddea0_29_9.png)\n\
    \n每寫下一項計畫，便花個十秒審視今天的計畫。千萬別小看這十秒，隨時記得「一旦決定便立即寫下來」、「工作告一段落便審視一次計畫」，自然而然就養成了習慣。\n\
    \n## 時間活用秘技 01\n\n### 判斷工作優先順序的方法\n\n一提到「時間管理」，很多人會聯想到「思考工作的優先順序」一事，其實工作的優先順序在時間管理中並非那麼重要。決定工作的優先順序是在有限時間內選擇要做的事，也就是面臨時間窘迫時，必須做的一項作業。時間管理的目的便是整理工作，避免陷入這般窘況。只要管理得當，根本不需要煩惱什麼優先順序\
    \ ( 意即在「審視」計畫階段，這項判斷便已結束) 。\n\n雖說如此，難免還是會遇到突發狀況，或工作量突然暴增，非得決定優先順序的時候。也許有些人覺得這種事很難判斷，其實非常簡單，一點都不困難。\n\
    \n先從「選擇什麼」談起吧。試著思考這問題：「要是非得去無人島一趟的話，你會帶哪一本書去呢？」\n\n譬如從圖書館龐大的藏書中，挑選最喜歡的十本帶去，的確頗難取捨。這時不妨先將所有藏書大略分為A級、B級……等，然後從A級中挑選最適合的十本，這就是所謂絕對評價\
    \ ( 加上等級 ) 的作法。\n\n再思考另一個例子，從自己所有的十一本中挑選十本，這時情形完全不一樣。因為馬上便能從十一本中挑出自己喜歡的，再來就是思考從剩下的幾本中剔除一本，這就是所謂相對評價\
    \ ( 比較 ) 的作法。\n\n不過有些人就是不擅長絕對評價這種作法。譬如，很難維持同一個基準將必要的書籍分為A、B、C三個等級（往往最後是C比B來得重要）。相反地，有些人擅長相對評價。當他判斷「哪一本書比較有趣」後，就算經過再久，這判斷也不會改變。\n\
    \n回到關於時間管理的話題。在講述時間管理的相關書籍中，大部分提及判斷工作優先順序的方法，都採第一種方法（將工作分為A等級、B等級……）。其實第二種方法（「思考要刪除哪一個？」）更能及早做出判斷。\n\
    \n只要事先計畫好再行動，就不會發生時間不夠用的窘況。因為可以判斷要刪除哪一個或哪兩個（是要終止呢？還是暫且擱著），不需要決定優先順序，只要简单地思考「剔除哪一個」就行了。\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_31_0.png](img/87569369e8074c65e7c56ecade1ddea0_31_0.png)\n\
    \n### Part 2\n\n工作與約定大不同！\n\n## 活用「時間地圖」實行計畫\n\n### 1 計畫有兩種形式\n\n#### 由時間決定的預定計畫，叫做「約定」\n\
    \n“时间地图”上的计划有两种，虽然都是“使用自己的时间做些什么”，性质却不一样。\n\n一种是通过会议和洽谈，由时间决定的计划，好比在学校上课一事，完全取决于时间。\n\
    \n这种预定计划称为“约定（appointment）”，一般称为“排程管理”，也许你早就实行说不定。\n\n#### 不是由時間決定的計畫，叫做「工作」\n\
    \n另一种是自己决定时间的计划，比如写文件报告、收发邮件等独立完成的作业，好比老师布置的作业。虽然有期限，但何时着手取决于自己。\n\n一般称这种预定计划为“工作（task）”。工作无法与约定同时进行，必须利用没有约定的空档时间处理。\n\
    \n### 寫在時間地圖上的兩種工作\n\n![img/87569369e8074c65e7c56ecade1ddea0_35_0.png](img/87569369e8074c65e7c56ecade1ddea0_35_0.png)\n\
    ![img/87569369e8074c65e7c56ecade1ddea0_35_1.png](img/87569369e8074c65e7c56ecade1ddea0_35_1.png)\n\
    \n**約定（appointment）的特徵**\n嚴格遵守時間（好比上課）\n同一個時段無法同時進行兩項約定\n\n**工作（task）的特徵**\n時間自由（好比作業）\n\
    利用沒有約定的空檔時間實行\n\n**1分鐘掌握重點！**\n\n**工作的影響力比約定來得大**\n— 聽到時間管理，也許會覺得：「之所以管理時間，是為了實踐約定」。其實大部分人用於處理工作的時間，比用於實踐約定的時間來得長，足見管理工作上的內容非常重要。\n\
    \n### 2 為何要整合時間地圖？\n\n#### 製作兩個欄位\n\n“时间地图”的基本形式就是整合约定和工作事项，接下来说明为何需要整合的理由。\n\n\
    就某种意味来说，约定和工作都是利用自己的时间进行。因此约定较多的日子，最好别安排工作，相反地，工作繁重的时候，也不适宜安排约定。然而分开计划的结果，往往无法确定工作量和就算勉强订立计划也容易遗漏。\n\
    \n“审视”计划是为了避免这般情况发生，整合约定和工作则是为了让这道程序变得更简单。\n\n约定往往取决于时间，所以要写在有标示时间的栏目，而且必须和工作分开写（依日期书写）。这么一来，无法更改时间的约定就不会和可以自由选择时间的工作混为一谈。\n\
    \n计划不是订一次就能搞定，也有可能追加或变更，必须视情况而变更加实行的时间。总之，在约定时间不变的原则下，可以调整工作。\n\n### 在時間地圖上寫下約定與工作\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_37_0.png](img/87569369e8074c65e7c56ecade1ddea0_37_0.png)\n\
    \n| | 週一 | 週二 | 週三 | 週四 | 週五 |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | | □工作A | □工作B | □工作B | □工作B | □工作C<br>□工作D<br>□工作E |\n| 9:00 | | | | | |\n|\
    \ 10:00 | | | | | |\n| 11:00 | | 會議 | | | 會議 |\n| 12:00 | | | | | |\n| 13:00 |\
    \ | | | | 會議 |\n| 14:00 | 洽商 | | | 洽商 | |\n| 15:00 | | 會議 | | | |\n| 16:00 | |\
    \ | | | |\n\n寫下工作內容\n寫下約定事項\n寫在標有時間欄位的部分，等同於「排程管理」。\n\n一天的工作量一目了然\n（包括約定與工作）\n\
    \n像這樣整合好約定和工作後，不管是「訂立計畫」、「審視」或「實行」等階段，只要看這張「時間地圖」*就夠了。不但便於書寫，也能避免遺漏事情。\n\n> *無論使用記事本還是電腦製作「時間地圖」，都是為了整合約定與工作。\n\
    \n### ③ 思考「何時完成」 寫下約定事項\n\n#### 「當場確認」，「立即」寫下來\n\n接下來，從如何書寫約定開始說明。決定什麼時候開會，和誰約好什麼時候碰面，這些都屬於約定。決定約定最重要的原則就是「避免重複」，意即同一段時間內避免安排兩項約定。\n\
    \n為了避免重複排約，一定要先確認這段時間是否空著，再安排新約定。安排新約定時，最好當場確認「時間地圖」，立即寫下來，只要遵守這原則就不必擔心出差錯。\n\n\
    唯有養成「當場確認」、「立即」寫下來的習慣，才能避免重複排約。若心想「等一下就寫好了」，肯定會忘記，這點一定要注意。\n\n#### 何時開始，何時結束，一目了然\n\
    \n如右圖畫條線將約定框起來，「何時開始，何時結束」一目了然，也能清楚區分哪些是工作時間。框線部分是約定，空白部分是工作時間。\n\n### 一旦決定約定時間，立刻寫下來\n\
    \n![img/87569369e8074c65e7c56ecade1ddea0_39_0.png](img/87569369e8074c65e7c56ecade1ddea0_39_0.png)\n\
    \n- 思考自己 開始行動的時間  9:00 10:00 11:00 12:00  9:55 ○○會議  預定出席十點的會議。連同移動時間一併考慮，訂出開始行動時間為9:55\n\
    - 倒算開始 行動時間  12:00 13:00 14:00 15:00 16:00  13:15 移動  14:00 和□□公司洽商  16:00 移動\
    \  和客戶約定下午二點碰面。倒算移動時間，決定開始行動的時間（離開辦公室的時間）。\n- 不清楚何時結束的約定  14:00 15:00 16:00 17:00\
    \ 18:00  15:00 和XX洽商  從下午三點開始洽商，但不清楚何時結束。為了避免和其他約定重疊，最好畫得比預測長一點。\n\n決定約定什麼時候開始時，必須連移動所需花費的時間一併考慮*。若不清楚什麼時候結束，一定要比預測結束的時間稍微畫長一點，避免撞約。\n\
    \n* 很多人只寫上交通工具的發車時間，往往差點趕不上車，這點要特別注意。\n\n### 4 思考「何時進行」列出工作內容\n\n#### 工作也必須「當場確認」，「立即」寫下來\n\
    \n接下來，說明工作的書寫方式。你平常會寫工作計畫嗎？我認識的人大多不會，都是隨手記一下而已。唯有整合手邊的工作，才能有計畫地行動。\n\n像是書寫文件報告、收發郵件等，無法決定時間的事情均屬於工作。工作和約定一樣，也必須「當場確認」，「立即」寫下來*。\n\
    \n工作和約定的性質不同，不會產生重複排約情形。但沒有隨手記下來的結果，往往就是忘了。務必養成「當場寫下來」的習慣，就不必老是惦記著，心情自然輕鬆許多。\n\
    \n我們往往工作時才會想起要做些什麼，以至於計畫永遠趕不上變化，只要養成使用「時間地圖」的習慣便不怕疏漏。\n\n*若是當場必須解決的工作，就不必記下來了（參考138頁）。\n"
