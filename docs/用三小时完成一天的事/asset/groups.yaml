    # ## 2


    實現長期計畫的方法：


    養成「一分鐘習慣」


    什麼是專案？


    我想大家對「專案」這字眼應該不陌生，專案也含有「計畫」的意思。面對屬於「專案」的工作，也就是目標已經決定的工作，一旦達成目標便表示工作告一段落*。不過有很多短時間便能完成的工作，無法稱為專案。像上班族的工作當然是屬於一種專案，還有小惠準備考試一事，也是以取得資格認證為目標的專案。


    一旦著手進行一件工作，勢必遇到各種問題，這和學生時代為「畢業論文」傷腦筋的道理是一樣的。


    專案為何無法順利進行？


    任何人難免會有專案無法順利進行的煩惱。舉個最貼近生活的例子，譬如明明給自已立下新的一年要學好英文的目標，結果卻沒達成，其實有這般經驗的人還真不少（參考右圖的問卷調查）。你是否也有此經驗呢？如果有的


    * 工作中有些是每天都得重複進行的例行性工作，這類型的工作不算是專案。'
