    - 二小時

    - 必須花費的工作時間合計四小時

    - □完成 D 企劃的資料

    - 二小時


    9:00 框線外的時間帶 能處理這些工作嗎？

    10:00 ○○會議

    11:00 追加約定的同時，勢必會削減「框線外的時間」，也會增加工作時間 請想一下實行的可能性！

