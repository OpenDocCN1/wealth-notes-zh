    # ### 2 為何會有拖拖拉拉的毛病呢？


    # **做事拖拖拉拉的原因**


    「這件工作非做不可」明明下定決心，卻遲遲提不起勁……。這就是典型的拖拖拉拉毛病。


    和猶豫要不要向喜歡的人告白一事很像，不是嗎？明明決心「告白」卻臨陣退縮，一方面也是怕遭到對方拒絕，就這樣陷入兩難的窘境。


    心理學上稱這種情況為「接近與迴避之間的糾葛」。


    明明想接近對方，卻又害怕遭拒，始終下不了決心。


    老是拖拖拉拉的毛病和這情況十分相似，總是徘徊於「做」與「（現在）不想做」這兩個念頭之間。


    # **迫使自己儘早行動**


    然而做事老是拖拖拉拉的人，一旦火燒屁股又能落實行動，這是為什麼呢？


    因為「想做」與「不想做」這兩個念頭的平衡產生變化的緣故。


    心想離期限還有段時間，「不想做」比「想做」的念頭來得強烈，以致於遲遲提不起勁。一旦期限逼近，「想'
  - '[PAGE 157]


    做（要是再不做就錯了）」的念頭又變強，可見只要這兩個念頭的強度相反就會促使行動。


    ![](img/87569369e8074c65e7c56ecade1ddea0_157_0.png)


    那麼，該如何讓這兩個念頭產生變化呢？如下圖，只要讓「想做」的念頭稍微強一點，「不想做」的念頭稍微弱一些，便能迫使自己儘早行動。稍微改變念頭便能改善拖拖拉拉的毛病。


