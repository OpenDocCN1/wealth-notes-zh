  - '[PAGE 124]


    # 5 活用「專案地圖」的方法①：

    養成「審視地圖」的習慣


    「地圖」是用來看的


    若想落實「專案地圖」，「審視」的工夫很重要。不管製作得再怎麼周全，要是不使用的話，便失去了意義。然而每天確認專案（不管是工作還是讀書方面）的人並不多，光是「審視」這道工夫便能嗅出一個人認真的態度。


    「忘記」是讓長期目標和計畫，之所以無法達成的最大原因。人本來就有「只看眼前事」的毛病，唯有養成「審視」習慣才能補拙。就算一天只花一分鐘也沒關係，務必開啟「地圖」審視一下。


    在瀏覽每週的各個專案的時候，若工作進度如預期地完成，不妨在欄位上打勾確認已經完成了，如此一來，就能清楚檢視目前的工作狀況，一目了然。'
  - '[PAGE 125]


    # 「地圖」也需要修正


    計畫若是照預定進行當然最好，但事事不可能盡如人意，現實中多的是無法順利達成的計畫，這時就必須重新審視。


    人在訂立長期計畫時，往往會貪心地訂立許多計畫。一旦發現排程無法落實，就必須立即「審視」地圖。


    若手上計畫太多，無法順利進行 的話，最好當機立斷暫時中止其中某項計畫，或是將某項計畫的時間往後延期，重新製作「地圖」。


    畢竟要是勉強進行，只會越來越不想看「地圖」，搞不好還會拖累其他計畫也不定。為了避免這樣的情形發生，一定要重新審視「地圖」。'
  - '[PAGE 126]


    # 活用「專案地圖」的方法②：同時搭配時間地圖


    # 配合一週的排程


    為了讓計畫落實，就算每天只花一分鐘，能夠養成「瀏覽專案地圖」的習慣才是最重要的。若能搭配每週的「時間地圖」，效果更好。


    瀏覽兩份地圖時，務必確認「專案地圖」中的工作是否能排進「時間地圖」。將應辦事項排進「時間地圖」，也是讓長期排程和週排程緊密結合的要素。只要養成這個習慣，不管時間拖得再長的計畫都能確實地排進日常排程。


    當然也要在「時間地圖」上列出專案內容。先「瀏覽」一遍，再將需要留意的事項「寫」下來。養成每天瀏覽的習慣，自然習慣動筆「寫下來」。


    # 準備兩種基本地圖就行了


    準備兩種地圖才能促使長期與短期計畫都能「有計畫地行動」。換句話說，只要靈活運用兩種地圖，就不需要其他工具了。


    若「按月」管理，就算增加一個「地圖」也無妨，但基本上「地圖」不需要太多，才能持之以恆地實行。'
