    # ### 倒推回去的步驟法


    # #### 實行「料理型」步驟法的第一階段


    Part 3介紹的兩種步驟法中，「料理型步驟法」是從完成品的印象倒推回去的方法，像是拍電影之類的工作便適用這方法。


    假設拍攝完成的電影是目的，完成這件作品的必要作業就是後製（包括剪接、音效以及編製背景音樂等）。後製除了編排工作外，還得準備背景音樂、音效等，作業程序十分繁複。


    進行後製之前還有攝影，攝影之前還得編寫腳本、分鏡、勘查拍攝地、安排通告等。再往前追溯的話，還有發想腳本大綱、決定演員和選定拍攝地等。


    所謂「料理型」步驟法，便是一邊倒推每一個階段，一邊確定每一項必要作業，當然有時也會發生必須同時處理兩件或多件作業的情況。將作業流程畫成如右圖的「倒推步驟圖」會讓你更一目了然。'
