    # 活用時間，養成三大習慣


    想想你身邊是否有「做事非常有計畫」的人呢？


    這種人有許多優點，譬如「一旦決定，就會付諸執行」、「擅於掌控行動的順序和時機」、「寧可先努力後享受」等。總之，就是「預想未來發展，構思如何行動並付諸實行」。


    也許你會覺得「有計畫的行動」不是件容易的事，其實只要養成以下三大習慣就行了：


