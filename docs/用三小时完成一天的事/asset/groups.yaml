    # 活用各種訣竅，

    克服拖拖拉拉的毛病


    不管是意志多麼堅強的人，還是沒什麼慾望野心的人，多少都會有拖拖拉拉的毛病，不是嗎？看來這毛病還真是棘手啊。


    之所以會有這毛病，都是源自自己內心的問題，想要根治不是件容易的事。


    想要徹底改掉這毛病，根本是不可能的任務，就連我自己多少也會犯這毛病。


    勢必得花點心思，儘可能地防患未然。


    老是認為「這毛病治不好」的念頭，搞不好是免受這毛病困擾的一記秘訣。


    心想「反正這毛病治得好」，結果做事拖拖拉拉的，這時就會反省：「這樣下去不行」、「下次一定不能再犯」或是「換個心情重新出發吧」。但這樣的反省只是暫時性的，維持不了多久。


    一定要從各方面檢討，逐步改善才行，也就是Part 8 介紹的「四種思考方式」。


    想想這四種思考方式中，哪一種是你從來沒萌生的想法呢？人在面臨困境時，想法往往十分偏頗（我也是）。認識四種'
  - '[PAGE 171]


    思考方式，學習靈活運用，也許就能找到一個意外的缺口，突破困境。畢竟意外之事往往能產生令人詫異的效果。


    相信大家都聽過伊索寓言裡知名的童話故事「北風與太陽」吧。後來北風輸給了太陽。「四種思考方式」不是互相競爭，而是相互合作，才能有效改善拖拖拉拉的毛病。


    抱持「加油」、「非做不可」的決心固然重要，但有時轉個念頭，活用各種訣竅更能克服拖拖拉拉的毛病。


    當然，還請務必好好地活用「時間地圖」。


