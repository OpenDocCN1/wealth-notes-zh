    # 減輕「被工作追逐」的壓力


    做好時間管理的好處之一就是減輕「被工作追逐」的壓力。不但能從容地處理工作，也不再覺得成天被工作束縛，握有工作主導權，壓力自然減輕不少。


    # 減輕「無所適從」的壓力


    另一個好處則是消除工作「無所適從」的不安全感。若只靠腦子裡的記憶管理工作，一旦工作量增加就會擔心：「明天是否處理得完？」。像這樣抱著「不曉得能否完成」的不安全感也是壓力來源。


    做好時間管理能讓自己對工作進度產生信心，消除無所適從的不安全感。


    如同Part 7 所述，唯有充分地掌控工作進度，才能有效地轉換心情。


    千萬不要認為「工作當然有壓力」，嘗試使用「時間地圖」，你一定也能感受到自己有顯著的改變。'
