    \ | | | |\n| 第52週 | 12/22～26 | | | |\n\n## 2 列出「每週工作清單」①\n\n### 將「專案計畫」視為「個人計畫」\n\
    \n「專案地圖」是張顯示每週工作內容的圖表。整合各項專案的工作內容，製成一張「地圖」。\n\n好比小夫必須參與大規模的團隊計畫，就必須審視整體計畫的排程，確認自己需要負責的工作內容和日程，然後將每週工作內容列在「專案地圖」上。\n\
    \n比起細分「工作內容」，不如將其視為大規模的「活動」來安排更為清楚明瞭。\n\n這麼一來，每週工作量便一清二楚了（屬於「個人的工作」一定要標示清楚）。當然實際操作時，一定有比較忙和比較清閒的時候，整合專案的好處就是能夠清楚瞭解工作的「尖峰期」與「離峰期」。\n\
