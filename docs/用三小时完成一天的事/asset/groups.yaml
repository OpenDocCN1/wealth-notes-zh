    # 1 提升工作效率


    瀏覽時間地圖，讓工作流程變得更順利


    之前的章節內容教你如何將行動轉化成「有計畫的行動」，最後一章便是要說明養成「有計畫的行動」的好處。


    當行動變成「有計畫的行動」後，工作效率勢必提升。介紹「步驟化」時曾說明過，隨著工作流程改變，效率亦大幅提升。使用「時間地圖」思考一件工作流程如何「步驟化」，連帶地也會思考整體時間流程。


    只要是用於同一類的事，就算是內容完全不同的專案，也能匯整於同一天進行，提升工作效率。好比將內容大同小異的工作匯整處理，絕對更有效率。


    將工作匯整於「時間地圖」上，能讓所有工作流程一目了燃。其實你手邊一定有那種稍微改變一下處理方式，便能提升效率的工作。


    但人往往被眼前的事束縛，忙到無法思考如何改變工作方式，結果只會讓自己越來越雜亂無章地行動。'
  - '[PAGE 193]


    只要養成瀏覽「時間地圖」，預測「未來情況」的習慣，便能有效地掌控工作流程。事前有充足的時間可思考，才能發想出更順利流程。


    # 不讓工作堆積如山，做好預先準備


    養成預測「未來情況」的習慣，便能防患未然，做好未雨綢繆的準備。就算工作堆積如山，忙得不可開交，只要事先做好準備，就能避免手忙腳亂。


    而且事先做好準備，也能有較多的對策可供選擇，所以早點發現問題也能提升工作效率。


    # 掌控工作時間，避免浪費


    瞭解自己如何分配時間才能避免「浪費時間」。意外地，大多數人都不太清楚自己做一件工作究竟花費了多少時間，這就是問題所在。


    養成瀏覽「時間地圖」的習慣，才能意識到自己的時間是有限的，思考自己該如何活用這些時間，也能藉由審視的工夫，察覺有無浪費時間的情形。


