    # # 2 減輕工作壓力


    # ## 時間管理不只是為了提升工作效率


    大部分人一聽到「時間管理」，就會聯想到「節省時間」、「提升工作效率」等優點，其實也有減輕工作壓力的效果。


    所謂「壓力」是生物為了克服危機狀況，體內自然產生的反應，並非全然不好，適度的壓力也能刺激潛能，但前提是要懂得釋放壓力。若不斷累積壓力，不懂得釋放的話，只會搞得自己身心俱疲。


    其實我還沒學會時間管理之前，也是過著成天被工作追逐，備感壓力的生活。老是忙得暈頭轉向，下了班還掛念著公事，根本輕鬆不起來。自從使用「時間地圖」後，壓力竟不可思議地消散不少。


    不是我誇大其詞，現在的我真的很享受「樂在工作」的感覺。'
