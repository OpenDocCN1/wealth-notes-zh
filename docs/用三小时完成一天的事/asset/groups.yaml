    # 5 平常的工作也要步驟化：出差篇


    # 出差計畫也能步驟化


    「步驟化」也能運用於平常的工作，像是出差之類。


    雖然出差一定是在預定的時間行動，實行預定的約定，但並非只是這樣而已。出差前必須預約交通工具和住宿等，事後還得申報出差費用等後續事宜，因此出差也算是一種「活動」。


    你有過心想：「有空再申報出差費用吧！」，結果不小忘記，被催促申報的經驗嗎？其實只要事先擬妥步驟，便能避免這種情況發生。


    # 如何將出差計畫步驟化


    首先從出差的目的（約定）開始步驟化。一旦確定，就要思考交通方式，倒推回去，決定何時啟程。


    此外，出差前有些準備事項，回來也有些事得處理，不妨活用「購物型」步驟法，列出工作內容。'
  md: "\n# 「購物型」步驟法\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_65_0.png)\n\n就算倒推回想，也想不起來。不然就是臨時又想起什麼要買，只好又跑回賣場，就這樣來來往往，浪費不少時間。\n\
    \n事先列出要做的事，不但能夠避免忘記，還能提昇工作效率。像這樣逐一列清單，予以步驟化，是非常好用的作法。\n\nPart 4 會詳細說明這兩種步驟化的方法。\n\
    \n## 6 活用「步驟化」的三要件\n\n### 活用三要件，步驟化自然上手\n\n有些人擅長步驟化，有些人卻十分棘手，若捉不到箇中訣竅也不用太心急。其實和\
    \ Part 1「有計畫地行動」的道理是一樣的，那就是養成「訂立計畫（寫）」、「審視」和「（瀏覽）實行」等習慣，自然就能上手。\n\n雖然下一章會說明一些具體作法，但在這之前還是先介紹些必須注意的要點。和前述所提的「料理型」和「購物型」一樣，活用步驟化也有三要件。\n\
    \n### 活用步驟化的要件①：擬定工作和約定的計畫，明確實行不漏失\n\n好比料理，要是少了辣椒這食材就做不成香蒜辣椒義大利麵。同樣地，要是漏掉一件「要做的事」，整個步驟會崩解。\n\
    \n在計畫階段，先確實列出工作和約定的步驟。進入實行階段後，務必落實計畫，這兩件事缺一不可。\n\n寫下「要做的事」，然後切實實行，這就是步驟化的要訣之一。\n\
    \n### 活用步驟化的要件②：擬定工作和約定的先後順序\n\n要是等麵煮好了才調理醬汁就太晚了。最好趁麵條冷卻時，烹調醬汁。\n\n將工作步驟化的道理也一樣，按部就班地進行才能順利完成一件事。因此思考步驟時，不能只想著：「要做些什麼」，也要思索：「進行的順序」，才能順利地實行，因此思考「順序」也是步驟化的要訣。\n\
    \n### 活用步驟化的要件③：配合完成期限，訂立全盤計畫\n\n必須花點時間燒鍋開水、煮麵條，才能完成一道美味的義大利麵。要是沒有抓準燒開水的時機，便來不及如期完成。同樣地，一定要配合「完成期限」訂立計畫，否則無法如期完成。\n\
    \n若想達到如期完成的目標，最好事先思考「每項工作和約定要從何時開始進行」，這也是步驟化的要訣。\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_67_0.png)\n\
    ![img](img/87569369e8074c65e7c56ecade1ddea0_67_1.png)\n\n## Part 3 總整理\n\n###\
    \ 必須步驟化的工作\n\n以下工作最好採取步驟化：\n\n- 費時的工作\n  要是沒進行分解，便無法排進平常進度。\n- 程序複雜的工作\n  要是沒有逐一列出步驟，肯定手忙腳亂。\n\
    - 不太熟悉的工作\n  對於不太熟悉的工作，最好列出步驟才能順利進行。\n\n#### 將費時的工作分解，予以步驟化\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_68_0.png)\n\
    \n> * 工作最長也不過二、三個小時。\n> * 花費超過三小時以上的工作必須予以分解。\n\n### 活用步驟化的三要件\n\n- 活用步驟化的要件❶：擬定工作和約定的計畫，明確實行不漏失\n\
    \  缺少任何一件食材，便無法做出美味的料理。\n- 活用步驟化的要件❷：擬定工作和約定的先後順序\n  要是是先思考先後順序，不但浪費時間，也容易手忙腳亂。\n\
    - 活用步驟化的要件❸：配合完成期限，訂立全體計畫\n  等工作做完才發現沒有如期完成就太遲了。最好事先思考每項工作和約定要何時開始進行。\n\n### 兩種步驟法\n\
    \n一種是從目標倒推回去的「料理型」，另一種列出必要事項清單的「購物型」。\n\n#### 「料理型」步驟法（倒推式步驟法）\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_69_0.png)\n\
    \n倒推回去想，比較容易瞭解。\n\n#### 「購物型」步驟法（列清單式步驟法）\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_69_1.png)\n\
    \n就算倒推回想，也想不起來。Part 4 會有詳細的說明。\n\n## 時間活用秘技③：「寫下來」才能達到時間管理功效\n\n### 必須「寫下來」的理由\n\
    \n本書介紹的時間管理法，是以「寫」和「看」為基本。也許有些人會覺得著重「寫」和「瀏覽」相當繁瑣，甚至懷疑「寫得這麼詳細，真的有用嗎？」，因此我一定要補充說明「寫」這件事有多麼重要。\n\
    \n「寫」之所以能改變使用時間的方式，有以下三個理由。\n\n### 藉由「寫」和「瀏覽」加強記憶\n\n「寫」和「看」之所以重要的理由之一，就是和「記憶」有關，想必大家都很清楚。\n\
    \n本來「想做」某件事，卻被其他事分了心，結果忘了。由此可見，我們的記憶絕對不像我們想的那麼確實。\n\n我們有時站起來「想拿個東西」，結果想起別的事，或和別人聊幾句話後，便忘了自己為什麼要站起來。就算告訴自己不能忘，一想到別的事，還是會輕易地忘記原本想做的事。\n\
    \n#### 人有兩個記憶體\n\n這和我們的記憶體有著密切關係。\n\n每個人都擁有兩個記憶體。一個稱為「長期記憶」，另一種稱為「短期記憶」，譬如打電話時，暫時記住某個電話號碼，就是只限當時的記憶。像是計算等思考事物時，都是使用短期記憶（又稱為「動作記憶」（working\
    \ memory））。\n\n長期記憶與短期記憶的性質完全不同。雖然長期記憶可以記住很多事情，但要是沒有一個契機的話，便想不起來。譬如就算記得必須做某件事，還是會忘記，這和忘了拿出放在抽屜裡的文件，道理是一樣的。\n\
    \n短期記憶則是當場思考。因為短期記憶無法記住太多事，一旦有新事物進入，便忘了正在思考的事。就像剛才舉的例子：「忘了到底為了什麼事離開位子」，短期記憶有著不確定因素，就像將新文件資料擺在桌上，就會忘了原先放在桌上的文件，一想到什麼新的事，便忘了原本正在思考的事。\n\
    \n### 「寫」和管理記憶相關\n\n藉由「寫」這行為能彌補人類記憶體體的不足。譬如「非做某件事不可」，是從稱為「長期記憶」的抽屜裡拿出來的記憶，但只有在適切時機才會想起。寫下工作和約定內容，便是為了想起這件事而做的「契機」，也對「瀏覽」這動作有著莫大助益*。\n\
    \n相反地，要是沒有寫下這些情報，管理自我行動時，腦子就得隨時記住「要做哪些事」。工作越重要，越會抱著「絕對不能忘記」這般壓力。就像把這件工作的情報堆放在稱為「短期記憶」的桌子上，使得用於處理眼前工作的短期記憶無法充分發揮（因為桌面空間變窄了）。因此若硬是記住工作排程，只會導致注意力無法集中，影響處理眼前工作的效率**。\n\
    \n> * 記下工作和約定內容時，只要書寫能讓自己馬上想起來的關鍵字就行了。要是寫得過於瑣碎，不但浪費時間，之後想不起來也很傷腦筋。\n> ** 這和「心神不寧，工作效率便大打折扣」的道理是一樣的。這麼一來，便能明瞭注意力為何無法集中的緣由了。\n\
    \n![img](img/87569369e8074c65e7c56ecade1ddea0_71_0.png)\n\n本書介紹的管理方式，不但能有效地管理自己的工作和時間，也能活用記憶的特性。\n\
    \n「就這樣辦吧！」將這念頭（短期記憶）寫下來（而且是馬上寫下來）是件非常重要的事。\n\n當然對記憶管理而言，「瀏覽」這動作也很重要。我們擁有稱為「長期記憶」的大抽屜，也就是將自己該做的工作內容記憶在這抽屜裡。然而要是沒有一個好時機連結的話，就算記住了，也無法切實實行。「時間地圖」就是為了創造連結長期記憶的時機。\n\
    \n不過就算「抓準時機，連結長期記憶」，還是無法做到一打開「時間地圖」便明瞭一切。若能盡量一天瀏覽好幾次「時間地圖」，或是「邊瀏覽邊工作」的話，便能彌補這方面的不足。\n\
    \n### 靠「寫」提升「思考力」\n\n「寫」之所以重要的第二個理由，就是「寫」是為了「思考」。\n\n我們的短期記憶比想像中來的少。短期記憶容量因人而異，平均約七件（±2）左右*，而且心算與筆算不一樣。譬如加法能力也是因人而異，若是二、三位數的話，還可以心算，若是沒學過珠算的話，不太可能會高達十位數的加法**，但用筆算的話，不管幾位數都算得出來。\n\
    \n*一九五六年，心理學家 G.A. Miller 曾發表一篇名為「The Magical Number Seven, Plus or Minus Two」的知名論文。\n\
    \n**學過珠算的人，通常會比較複雜的心算。這是運用將數字轉換成算盤上的珠子，活用短期記憶的方法。\n\n思考約定和工作內容時，也是一樣。譬如「今天要做哪些事？」腦子裡一下子要浮現所有事不是件容易的事。尤其當場邊工作高達七、八件時，光記住就很困難。更別說想起最後一件工作時，往往忘了第一件工作是什麼，也很難預測完成一件工作後，還有多少充裕時間，因此光靠腦子記住所有事是不太可能的。\n\
    \n所謂「充裕的時間」就是本書所說的「審視」計畫這道程序。要是不「寫下來」，光靠腦子記住工作排程，是無法從容地進行「審視」作業的。沒有經過「審視」的計畫，等於訂立「無法實行」的計畫，自然提不起勁實行。因此「寫」一事和審視計畫有關，也和是否提得起幹勁實行一事有關。\n\
    \n心算和筆算還有一個差異，那就是筆算是寫在紙上，就算算到一半也能重新開始，而且就算條件改變，重新計算也不是件難事。同樣地，工作排程也會發生類似情形。\n\n\
    又好比思考工作排程時，突然被別人的一句話打斷思緒，想再重新訂立計畫，或追加、確認新約定和工作也很麻煩。畢竟工作排程難免會更動，太過依賴腦子的記憶力，很有可能做白工。\n\
    \n為了能夠確實實行，瞭解是否還有充裕的時間，「寫下」約定和工作內容是不可或缺的一環。換句話說，「寫」這動作不但能「避免忘記」工作排程，對於「思考」方面也有著莫大助益。\n\
    \n### 「寫」也能「左右決定」\n\n「寫」這動作之所以重要的第三個理由，就是左右我們的決定。「決定」這字眼聽來或許有些沉重，但藉由「寫」一事的確能自然地做出決定。\n\
    \n工作有所謂的「完成期限」，完成期限往往取決於合作對象，並非單靠自己決定。隨著完成期限迫近，手忙腳亂，進度不太順利，加上行動受限他人，壓力倍增。為了避免發生這種情況，一定要訂出一個配合自身狀況，有別於完成期限的實行日期。\n\
    \n如前所述，面對新工作，我們會思索：「什麼時候開始進行比較好」，然而這般想像不但模糊，也容易忘記，結果老是被完成期限搞得人仰馬翻。\n\n「寫」能將「什麼時候開始進行比較好」這般想像明確地加上日期。依日期欄標記工作內容，也能決定「每天做些什麼」。譬如腦中粗略地想著：「這週先做一半就行了」，但若寫下來便能決定日期（畢竟要寫下來就得先做出決定）。因此「寫」能將工作實行日從模糊的想像變成明確的日期，也能左右決定。\n\
    \n藉由「寫」來「決定」每件工作何時進行，再透過「瀏覽」審視決定的結果。\n\n一旦做出決定，不但能夠確立工作排程，也會影響工作態度。\n\n一如前述，老是被完成期限搞得團團轉，必須配合他人方便的結果，只會讓自己備感壓力，有種「被工作追著跑」、「被時間追著跑」的感覺。相反地，依自己訂出的日期實行，不僅萌生自信，也能減少「被工作追逐」的壓力，自然充滿幹勁。\n\
    \n養成「寫」下工作內容，「決定」工作排程的習慣，自然能減輕壓力，提升幹勁，這就是「寫」之所以重要的三個理由。\n\n*事後確認完成所寫的工作內容，不但會萌生一股滿足感，也能提升幹勁。\n\
    \n## Part 4 活用步驟法\n\n### 步驟力讓你工作更靈活\n\n### 倒推回去的步驟法\n\n#### 實行「料理型」步驟法的第一階段\n\n\
    Part 3 介紹的兩種步驟法中，「料理型步驟法」是從完成品的印象倒推回去的方法，像是拍電影之類的工作便適用這方法。\n\n假設拍攝完成的電影是目的，完成這件作品的必要作業就是後製（包括剪接、音效以及編製背景音樂等）。後製除了編排工作外，還得準備背景音樂、音效等，作業程序十分繁複。\n\
    \n進行後製之前還有攝影，攝影之前還得編寫腳本、分鏡、勘查拍攝地、安排通告等。再往前追溯的話，還有發想腳本大綱、決定演員和選定拍攝地等。\n\n所謂「料理型」步驟法，便是一邊倒推每一個階段，一邊確定每一項必要作業，當然有時也會發生必須同時處理兩件或多件作業的情況。將作業流程畫成如右圖的「倒推步驟圖」會讓你更一目了然。\n\
    \n##### 「料理型」步驟法：第一階段—倒推回去的步驟圖—\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_77_0.png)\n\
    \n- 確定一些必要的作業程序\n- 確定前一階段的必要作業程序\n- 藉由這樣反覆地確認，不管任何工作都能分解成一項項的個別作業。\n\n畫成如上圖的步驟圖後，便能清楚確認各階段作業是否衝突（或漏失什麼必要的作業程序）。\n\
    \n實際進行這項步驟法時不需要倒推回去，循序漸進即可。只要腦中有清楚的作業程序，便能確認順序是否有誤，能否切實地達成果的目的。\n\n##### 2 將倒推回去的步驟加入自己的排程\n\
    \n###### 實行「料理型」步驟法的第二階段\n\n前頁的「倒推回去步驟圖」也適用於大規模的計畫管理（也就是所謂的「網絡圖」，有好幾種畫法）。\n\n\
    但不光畫出圖就行了。除了符合前述的「活用步驟化的三要件」中的要件一（避免漏失任何事）和要件二（擬定先後順序），要件三（配合完成期限擬定計畫）也很重要，所以必須思考各項作業需要花費的時間與排程。\n\
    \n合計各工作所需時間以確立工作排程，也是一種方法。不過這方法的作業程序比較瑣碎，所以這裡介紹的是較為大略的排程循序漸進的方法。\n\n首先從整體工作排程為目標倒推回去。譬如，預定上映三天前完成作品，一天後製、三天編輯、十天拍攝，因此最晚上映十七天前必須進行拍攝，像這樣大致擬定工作排程。\n\
    \n訂立好整體工作排程後，便能將規模較大的作業細分化。譬如要「拍攝」各種場景，因此拍攝地有好幾處，必須連同天候問題一併考慮，安排預備工作排程。考慮種種因素與情況，訂出拍攝工作的步驟（若必須更改工作天數，也要配合整體工作排程進行調整）。\n\
    \n最後再將工作排程中決定好的工作和約定，排進自己的「時間地圖」。如果發生時間不敷使用等問題，必須重新檢討步驟。依此步驟化便能訂立出具體又能落實的工作排程。\n\
    \n###### 「料理型」步驟法：第二階段 - 排進自己的工作排程 -\n\n####### 配合完成期限思考工作排程\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_79_0.png)\n\
    \n- **將各作業步驟化**\n  - 若發作業時間不敷使用等情形，就必須重新檢討。\n  - 將規模較大的作業再步驟化，思考排程方面有無問題。\n- **排進自己的工作排程**\n\
    \  - 要是和自己的工作排程不合，就必須重新檢討。\n  - 排進自己的「時間地圖」\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_80_0.png)\n\
    \n### 3 列清單步驟法\n\n#### 實行「購物型」步驟法的第一階段\n\n另個步驟法就是「購物型」步驟法，也就是採列清單方式，邊整理各種事（包含完成品）邊步驟化的方法，像前述沙織負責籌備展場事宜的例子便適用這方法。\n\
    \n雖然籌備展場一事千頭萬緒非常繁雜，但只要請教有經驗的人該做些什麼，便曉得如何進行，首先就是整理、列出待辦事項的清單。\n\n譬如「邀請賓客」一事，必須先拿到賓客名單，製作、發送邀請函等。此外還有一些關於籌備「會場」和「展示品」等。只要依項目分門別類列出待辦事項的清單，便能符合「活用步驟化的三要件」的要件一（避免漏失任何事）。若後續還有追加工作的話，再列入清單。\n\
    \n和 Part 2 提到的「工作」一樣，明確地記錄內容是列清單時的要點。以「預約會場」這件事為例，一定要細分出「詢問場地大小」、「挑選預備場地」、「確認承租場地的日期」、「和上司討論，決定場地」、「進行預約」等細節。這麼一來，才能明瞭作業內容與所需時間。\n\
    \n然後檢查一下列好的「步驟清單」，確認是否有疏漏。如此，「購物型」步驟法的第一階段便告一段落。\n\n##### 「購物型」步驟法：第一階段—將步驟列成清單\n\
    \n- 籌備展示會的工作事項：布置會場、要展出哪些商品？、工作人員名單？、決定日期……、寄發邀請函\n\n> 腦子裡無法一下子塞太多事，還是寫下來整理一番比較好。\n\
    \n將步驟列成清單：\n\n| 賓客 | 會場 | 展示品 |\n| :--- | :--- | :--- |\n| 拿到賓客名單 | 確認場地大小 | 確認各部門希望展示的商品\
    \ |\n| 製作邀請函、導覽手冊 | 挑選預備場地 | 統計展示品的內容與數量 |\n| 寄發邀請函、導覽手冊 | 確認承租場地的日期 | 列出展示品清單\
    \ |\n| 製作問候信 | 和課程討論，決定場地 | 將清單發函給各部門 |\n| 寄發 | 告知公司內部關於展期及場地等事宜 | 決定會場內位置配置 |\n\
    | 確認與會名單 | 進行預約 | 繪出場地配置圖 |\n\n- 重點：寫出所有想詢問的事項和要點。若後續有追加工作，必須隨時補上去。\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_82_0.png)\n\
    \n##### 將寫下來的步驟 排進自己的工作排程\n\n###### 實行「購物型」步驟法的第二階段\n\n前頁的「步驟清單」也適用於計畫管理（稱為「WBS（Work\
    \ Breakdown Structure）」）。牽涉範圍較廣的計畫管理會用到「步驟清單」和前面介紹的「倒推步驟圖」，但管理自我工作時，選擇其中一種方法即可*。\n\
    \n但也必須符合前述的「活用步驟化三要件」的第二和第三要件。接下來介紹「購物型」步驟法的第二階段。\n\n首先依清單的項目，決定實行順序，再將每個項目排進自己的工作排程（Part\
    \ 2 的「時間地圖」）。千萬別排得太緊，否則無法實行就一點意義也沒有了（請活用「填字遊戲原則」）。\n\n像這樣將工作與約定排進自己的工作排程，確定日期沒問題後，便完成了步驟化**，按部就班地處理工作。若中途追加工作，也要配合排程進行。\n\
    \n> * 若屬於個人工作，要將步驟化的結果排進「時間地圖」，進行管理，因此選擇一種方法即可。（參照88頁）\n> ** 若發現問題，務必重新審視日期和內容，考慮請別人協助。\n\
    \n###### 「購物型」步驟法：第二階段：排進自己的工作排程\n\n####### 思考步驟清單中的順序\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_83_0.png)\n\
    \n####### 排進自己的工作排程\n\n在「時間地圖」上記下各項工作、約定的實行日。\n\n- **重點：**\n  - 要是排得太緊，根本無法實行。\n\
    \  - 千萬別被工作排程搞得團團轉。\n  - 活用「填字遊戲原則」。\n\n確定整體工作排程沒問題，便大功告成了！\n\n### 5 平常的工作也要步驟化：出差篇\n\
    \n#### 出差計畫也能步驟化\n\n「步驟化」也能運用於平常的工作，像是出差之類。\n\n雖然出差一定是在預定的時間行動，實行預定的約定，但並非只是這樣而已。出差前必須預約交通工具和住宿等，事後還得申報出差費用等後續事宜，因此出差也算是一種「活動」。\n\
    \n你有過心想：「有空再申報出差費用吧！」，結果不小忘記，被催促申報的經驗嗎？其實只要事先擬妥步驟，便能避免這種情況發生。\n\n#### 如何將出差計畫步驟化\n\
    \n首先從出差的目的（約定）開始步驟化。一旦確定，就要思考交通方式，倒推回去，決定何時啟程。\n\n此外，出差前有些準備事項，回來也有些事得處理，不妨活用「購物型」步驟法，列出工作內容。\n"
  mdcn: "\n# 「購物型」步驟法\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_65_0.png)\n\n\
    就算倒推回想，也想不起來。不然就是臨時又想起什麼要買，只好又跑回賣場，就這樣來來往往，浪費不少時間。\n\n事先列出要做的事，不但能夠避免忘記，還能提昇工作效率。像這樣逐一列清單，予以步驟化，是非常好用的作法。\n\
    \nPart 4 會詳細說明這兩種步驟化的方法。\n\n## 6 活用「步驟化」的三要件\n\n### 活用三要件，步驟化自然上手\n\n有些人擅長步驟化，有些人卻十分棘手，若捉不到箇中訣竅也不用太心急。其實和\
    \ Part 1「有計畫地行動」的道理是一樣的，那就是養成「訂立計畫（寫）」、「審視」和「（瀏覽）實行」等習慣，自然就能上手。\n\n雖然下一章會說明一些具體作法，但在這之前還是先介紹些必須注意的要點。和前述所提的「料理型」和「購物型」一樣，活用步驟化也有三要件。\n\
    \n### 活用步驟化的要件①：擬定工作和約定的計畫，明確實行不漏失\n\n好比料理，要是少了辣椒這食材就做不成香蒜辣椒義大利麵。同樣地，要是漏掉一件「要做的事」，整個步驟會崩解。\n\
    \n在計畫階段，先確實列出工作和約定的步驟。進入實行階段後，務必落實計畫，這兩件事缺一不可。\n\n寫下「要做的事」，然後切實實行，這就是步驟化的要訣之一。\n\
    \n### 活用步驟化的要件②：擬定工作和約定的先後順序\n\n要是等麵煮好了才調理醬汁就太晚了。最好趁麵條冷卻時，烹調醬汁。\n\n將工作步驟化的道理也一樣，按部就班地進行才能順利完成一件事。因此思考步驟時，不能只想著：「要做些什麼」，也要思索：「進行的順序」，才能順利地實行，因此思考「順序」也是步驟化的要訣。\n\
    \n### 活用步驟化的要件③：配合完成期限，訂立全盤計畫\n\n必須花點時間燒鍋開水、煮麵條，才能完成一道美味的義大利麵。要是沒有抓準燒開水的時機，便來不及如期完成。同樣地，一定要配合「完成期限」訂立計畫，否則無法如期完成。\n\
    \n若想達到如期完成的目標，最好事先思考「每項工作和約定要從何時開始進行」，這也是步驟化的要訣。\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_67_0.png)\n\
    ![img](img/87569369e8074c65e7c56ecade1ddea0_67_1.png)\n\n## Part 3 總整理\n\n###\
    \ 必須步驟化的工作\n\n以下工作最好採取步驟化：\n\n- 費時的工作\n  要是沒進行分解，便無法排進平常進度。\n- 程序複雜的工作\n  要是沒有逐一列出步驟，肯定手忙腳亂。\n\
    - 不太熟悉的工作\n  對於不太熟悉的工作，最好列出步驟才能順利進行。\n\n#### 將費時的工作分解，予以步驟化\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_68_0.png)\n\
    \n> * 工作最長也不過二、三個小時。\n> * 花費超過三小時以上的工作必須予以分解。\n\n### 活用步驟化的三要件\n\n- 活用步驟化的要件❶：擬定工作和約定的計畫，明確實行不漏失\n\
    \  缺少任何一件食材，便無法做出美味的料理。\n- 活用步驟化的要件❷：擬定工作和約定的先後順序\n  要是是先思考先後順序，不但浪費時間，也容易手忙腳亂。\n\
    - 活用步驟化的要件❸：配合完成期限，訂立全體計畫\n  等工作做完才發現沒有如期完成就太遲了。最好事先思考每項工作和約定要何時開始進行。\n\n### 兩種步驟法\n\
    \n一種是從目標倒推回去的「料理型」，另一種列出必要事項清單的「購物型」。\n\n#### 「料理型」步驟法（倒推式步驟法）\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_69_0.png)\n\
    \n倒推回去想，比較容易瞭解。\n\n#### 「購物型」步驟法（列清單式步驟法）\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_69_1.png)\n\
    \n就算倒推回想，也想不起來。Part 4 會有詳細的說明。\n\n## 時間活用秘技③：「寫下來」才能達到時間管理功效\n\n### 必須「寫下來」的理由\n\
    \n本書介紹的時間管理法，是以「寫」和「看」為基本。也許有些人會覺得著重「寫」和「瀏覽」相當繁瑣，甚至懷疑「寫得這麼詳細，真的有用嗎？」，因此我一定要補充說明「寫」這件事有多麼重要。\n\
    \n「寫」之所以能改變使用時間的方式，有以下三個理由。\n\n### 藉由「寫」和「瀏覽」加強記憶\n\n「寫」和「看」之所以重要的理由之一，就是和「記憶」有關，想必大家都很清楚。\n\
    \n本來「想做」某件事，卻被其他事分了心，結果忘了。由此可見，我們的記憶絕對不像我們想的那麼確實。\n\n我們有時站起來「想拿個東西」，結果想起別的事，或和別人聊幾句話後，便忘了自己為什麼要站起來。就算告訴自己不能忘，一想到別的事，還是會輕易地忘記原本想做的事。\n\
    \n#### 人有兩個記憶體\n\n這和我們的記憶體有著密切關係。\n\n每個人都擁有兩個記憶體。一個稱為「長期記憶」，另一種稱為「短期記憶」，譬如打電話時，暫時記住某個電話號碼，就是只限當時的記憶。像是計算等思考事物時，都是使用短期記憶（又稱為「動作記憶」（working\
    \ memory））。\n\n長期記憶與短期記憶的性質完全不同。雖然長期記憶可以記住很多事情，但要是沒有一個契機的話，便想不起來。譬如就算記得必須做某件事，還是會忘記，這和忘了拿出放在抽屜裡的文件，道理是一樣的。\n\
    \n短期記憶則是當場思考。因為短期記憶無法記住太多事，一旦有新事物進入，便忘了正在思考的事。就像剛才舉的例子：「忘了到底為了什麼事離開位子」，短期記憶有著不確定因素，就像將新文件資料擺在桌上，就會忘了原先放在桌上的文件，一想到什麼新的事，便忘了原本正在思考的事。\n\
    \n### 「寫」和管理記憶相關\n\n藉由「寫」這行為能彌補人類記憶體體的不足。譬如「非做某件事不可」，是從稱為「長期記憶」的抽屜裡拿出來的記憶，但只有在適切時機才會想起。寫下工作和約定內容，便是為了想起這件事而做的「契機」，也對「瀏覽」這動作有著莫大助益*。\n\
    \n相反地，要是沒有寫下這些情報，管理自我行動時，腦子就得隨時記住「要做哪些事」。工作越重要，越會抱著「絕對不能忘記」這般壓力。就像把這件工作的情報堆放在稱為「短期記憶」的桌子上，使得用於處理眼前工作的短期記憶無法充分發揮（因為桌面空間變窄了）。因此若硬是記住工作排程，只會導致注意力無法集中，影響處理眼前工作的效率**。\n\
    \n> * 記下工作和約定內容時，只要書寫能讓自己馬上想起來的關鍵字就行了。要是寫得過於瑣碎，不但浪費時間，之後想不起來也很傷腦筋。\n> ** 這和「心神不寧，工作效率便大打折扣」的道理是一樣的。這麼一來，便能明瞭注意力為何無法集中的緣由了。\n\
    \n![img](img/87569369e8074c65e7c56ecade1ddea0_71_0.png)\n\n本書介紹的管理方式，不但能有效地管理自己的工作和時間，也能活用記憶的特性。\n\
    \n「就這樣辦吧！」將這念頭（短期記憶）寫下來（而且是馬上寫下來）是件非常重要的事。\n\n當然對記憶管理而言，「瀏覽」這動作也很重要。我們擁有稱為「長期記憶」的大抽屜，也就是將自己該做的工作內容記憶在這抽屜裡。然而要是沒有一個好時機連結的話，就算記住了，也無法切實實行。「時間地圖」就是為了創造連結長期記憶的時機。\n\
    \n不過就算「抓準時機，連結長期記憶」，還是無法做到一打開「時間地圖」便明瞭一切。若能盡量一天瀏覽好幾次「時間地圖」，或是「邊瀏覽邊工作」的話，便能彌補這方面的不足。\n\
    \n### 靠「寫」提升「思考力」\n\n「寫」之所以重要的第二個理由，就是「寫」是為了「思考」。\n\n我們的短期記憶比想像中來的少。短期記憶容量因人而異，平均約七件（±2）左右*，而且心算與筆算不一樣。譬如加法能力也是因人而異，若是二、三位數的話，還可以心算，若是沒學過珠算的話，不太可能會高達十位數的加法**，但用筆算的話，不管幾位數都算得出來。\n\
    \n*一九五六年，心理學家 G.A. Miller 曾發表一篇名為「The Magical Number Seven, Plus or Minus Two」的知名論文。\n\
    \n**學過珠算的人，通常會比較複雜的心算。這是運用將數字轉換成算盤上的珠子，活用短期記憶的方法。\n\n思考約定和工作內容時，也是一樣。譬如「今天要做哪些事？」腦子裡一下子要浮現所有事不是件容易的事。尤其當場邊工作高達七、八件時，光記住就很困難。更別說想起最後一件工作時，往往忘了第一件工作是什麼，也很難預測完成一件工作後，還有多少充裕時間，因此光靠腦子記住所有事是不太可能的。\n\
    \n所謂「充裕的時間」就是本書所說的「審視」計畫這道程序。要是不「寫下來」，光靠腦子記住工作排程，是無法從容地進行「審視」作業的。沒有經過「審視」的計畫，等於訂立「無法實行」的計畫，自然提不起勁實行。因此「寫」一事和審視計畫有關，也和是否提得起幹勁實行一事有關。\n\
    \n心算和筆算還有一個差異，那就是筆算是寫在紙上，就算算到一半也能重新開始，而且就算條件改變，重新計算也不是件難事。同樣地，工作排程也會發生類似情形。\n\n\
    又好比思考工作排程時，突然被別人的一句話打斷思緒，想再重新訂立計畫，或追加、確認新約定和工作也很麻煩。畢竟工作排程難免會更動，太過依賴腦子的記憶力，很有可能做白工。\n\
    \n為了能夠確實實行，瞭解是否還有充裕的時間，「寫下」約定和工作內容是不可或缺的一環。換句話說，「寫」這動作不但能「避免忘記」工作排程，對於「思考」方面也有著莫大助益。\n\
    \n### 「寫」也能「左右決定」\n\n「寫」這動作之所以重要的第三個理由，就是左右我們的決定。「決定」這字眼聽來或許有些沉重，但藉由「寫」一事的確能自然地做出決定。\n\
    \n工作有所謂的「完成期限」，完成期限往往取決於合作對象，並非單靠自己決定。隨著完成期限迫近，手忙腳亂，進度不太順利，加上行動受限他人，壓力倍增。為了避免發生這種情況，一定要訂出一個配合自身狀況，有別於完成期限的實行日期。\n\
    \n如前所述，面對新工作，我們會思索：「什麼時候開始進行比較好」，然而這般想像不但模糊，也容易忘記，結果老是被完成期限搞得人仰馬翻。\n\n「寫」能將「什麼時候開始進行比較好」這般想像明確地加上日期。依日期欄標記工作內容，也能決定「每天做些什麼」。譬如腦中粗略地想著：「這週先做一半就行了」，但若寫下來便能決定日期（畢竟要寫下來就得先做出決定）。因此「寫」能將工作實行日從模糊的想像變成明確的日期，也能左右決定。\n\
    \n藉由「寫」來「決定」每件工作何時進行，再透過「瀏覽」審視決定的結果。\n\n一旦做出決定，不但能夠確立工作排程，也會影響工作態度。\n\n一如前述，老是被完成期限搞得團團轉，必須配合他人方便的結果，只會讓自己備感壓力，有種「被工作追著跑」、「被時間追著跑」的感覺。相反地，依自己訂出的日期實行，不僅萌生自信，也能減少「被工作追逐」的壓力，自然充滿幹勁。\n\
    \n養成「寫」下工作內容，「決定」工作排程的習慣，自然能減輕壓力，提升幹勁，這就是「寫」之所以重要的三個理由。\n\n*事後確認完成所寫的工作內容，不但會萌生一股滿足感，也能提升幹勁。\n\
    \n## Part 4 活用步驟法\n\n### 步驟力讓你工作更靈活\n\n### 倒推回去的步驟法\n\n#### 實行「料理型」步驟法的第一階段\n\n\
    Part 3 介紹的兩種步驟法中，「料理型步驟法」是從完成品的印象倒推回去的方法，像是拍電影之類的工作便適用這方法。\n\n假設拍攝完成的電影是目的，完成這件作品的必要作業就是後製（包括剪接、音效以及編製背景音樂等）。後製除了編排工作外，還得準備背景音樂、音效等，作業程序十分繁複。\n\
    \n進行後製之前還有攝影，攝影之前還得編寫腳本、分鏡、勘查拍攝地、安排通告等。再往前追溯的話，還有發想腳本大綱、決定演員和選定拍攝地等。\n\n所謂「料理型」步驟法，便是一邊倒推每一個階段，一邊確定每一項必要作業，當然有時也會發生必須同時處理兩件或多件作業的情況。將作業流程畫成如右圖的「倒推步驟圖」會讓你更一目了然。\n\
    \n##### 「料理型」步驟法：第一階段—倒推回去的步驟圖—\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_77_0.png)\n\
    \n- 確定一些必要的作業程序\n- 確定前一階段的必要作業程序\n- 藉由這樣反覆地確認，不管任何工作都能分解成一項項的個別作業。\n\n畫成如上圖的步驟圖後，便能清楚確認各階段作業是否衝突（或漏失什麼必要的作業程序）。\n\
    \n實際進行這項步驟法時不需要倒推回去，循序漸進即可。只要腦中有清楚的作業程序，便能確認順序是否有誤，能否切實地達成果的目的。\n\n##### 2 將倒推回去的步驟加入自己的排程\n\
    \n###### 實行「料理型」步驟法的第二階段\n\n前頁的「倒推回去步驟圖」也適用於大規模的計畫管理（也就是所謂的「網絡圖」，有好幾種畫法）。\n\n\
    但不光畫出圖就行了。除了符合前述的「活用步驟化的三要件」中的要件一（避免漏失任何事）和要件二（擬定先後順序），要件三（配合完成期限擬定計畫）也很重要，所以必須思考各項作業需要花費的時間與排程。\n\
    \n合計各工作所需時間以確立工作排程，也是一種方法。不過這方法的作業程序比較瑣碎，所以這裡介紹的是較為大略的排程循序漸進的方法。\n\n首先從整體工作排程為目標倒推回去。譬如，預定上映三天前完成作品，一天後製、三天編輯、十天拍攝，因此最晚上映十七天前必須進行拍攝，像這樣大致擬定工作排程。\n\
    \n訂立好整體工作排程後，便能將規模較大的作業細分化。譬如要「拍攝」各種場景，因此拍攝地有好幾處，必須連同天候問題一併考慮，安排預備工作排程。考慮種種因素與情況，訂出拍攝工作的步驟（若必須更改工作天數，也要配合整體工作排程進行調整）。\n\
    \n最後再將工作排程中決定好的工作和約定，排進自己的「時間地圖」。如果發生時間不敷使用等問題，必須重新檢討步驟。依此步驟化便能訂立出具體又能落實的工作排程。\n\
    \n###### 「料理型」步驟法：第二階段 - 排進自己的工作排程 -\n\n####### 配合完成期限思考工作排程\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_79_0.png)\n\
    \n- **將各作業步驟化**\n  - 若發作業時間不敷使用等情形，就必須重新檢討。\n  - 將規模較大的作業再步驟化，思考排程方面有無問題。\n- **排進自己的工作排程**\n\
    \  - 要是和自己的工作排程不合，就必須重新檢討。\n  - 排進自己的「時間地圖」\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_80_0.png)\n\
    \n### 3 列清單步驟法\n\n#### 實行「購物型」步驟法的第一階段\n\n另個步驟法就是「購物型」步驟法，也就是採列清單方式，邊整理各種事（包含完成品）邊步驟化的方法，像前述沙織負責籌備展場事宜的例子便適用這方法。\n\
    \n雖然籌備展場一事千頭萬緒非常繁雜，但只要請教有經驗的人該做些什麼，便曉得如何進行，首先就是整理、列出待辦事項的清單。\n\n譬如「邀請賓客」一事，必須先拿到賓客名單，製作、發送邀請函等。此外還有一些關於籌備「會場」和「展示品」等。只要依項目分門別類列出待辦事項的清單，便能符合「活用步驟化的三要件」的要件一（避免漏失任何事）。若後續還有追加工作的話，再列入清單。\n\
    \n和 Part 2 提到的「工作」一樣，明確地記錄內容是列清單時的要點。以「預約會場」這件事為例，一定要細分出「詢問場地大小」、「挑選預備場地」、「確認承租場地的日期」、「和上司討論，決定場地」、「進行預約」等細節。這麼一來，才能明瞭作業內容與所需時間。\n\
    \n然後檢查一下列好的「步驟清單」，確認是否有疏漏。如此，「購物型」步驟法的第一階段便告一段落。\n\n##### 「購物型」步驟法：第一階段—將步驟列成清單\n\
    \n- 籌備展示會的工作事項：布置會場、要展出哪些商品？、工作人員名單？、決定日期……、寄發邀請函\n\n> 腦子裡無法一下子塞太多事，還是寫下來整理一番比較好。\n\
    \n將步驟列成清單：\n\n| 賓客 | 會場 | 展示品 |\n| :--- | :--- | :--- |\n| 拿到賓客名單 | 確認場地大小 | 確認各部門希望展示的商品\
    \ |\n| 製作邀請函、導覽手冊 | 挑選預備場地 | 統計展示品的內容與數量 |\n| 寄發邀請函、導覽手冊 | 確認承租場地的日期 | 列出展示品清單\
    \ |\n| 製作問候信 | 和課程討論，決定場地 | 將清單發函給各部門 |\n| 寄發 | 告知公司內部關於展期及場地等事宜 | 決定會場內位置配置 |\n\
    | 確認與會名單 | 進行預約 | 繪出場地配置圖 |\n\n- 重點：寫出所有想詢問的事項和要點。若後續有追加工作，必須隨時補上去。\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_82_0.png)\n\
    \n##### 將寫下來的步驟 排進自己的工作排程\n\n###### 實行「購物型」步驟法的第二階段\n\n前頁的「步驟清單」也適用於計畫管理（稱為「WBS（Work\
    \ Breakdown Structure）」）。牽涉範圍較廣的計畫管理會用到「步驟清單」和前面介紹的「倒推步驟圖」，但管理自我工作時，選擇其中一種方法即可*。\n\
    \n但也必須符合前述的「活用步驟化三要件」的第二和第三要件。接下來介紹「購物型」步驟法的第二階段。\n\n首先依清單的項目，決定實行順序，再將每個項目排進自己的工作排程（Part\
    \ 2 的「時間地圖」）。千萬別排得太緊，否則無法實行就一點意義也沒有了（請活用「填字遊戲原則」）。\n\n像這樣將工作與約定排進自己的工作排程，確定日期沒問題後，便完成了步驟化**，按部就班地處理工作。若中途追加工作，也要配合排程進行。\n\
    \n> * 若屬於個人工作，要將步驟化的結果排進「時間地圖」，進行管理，因此選擇一種方法即可。（參照88頁）\n> ** 若發現問題，務必重新審視日期和內容，考慮請別人協助。\n\
    \n###### 「購物型」步驟法：第二階段：排進自己的工作排程\n\n####### 思考步驟清單中的順序\n\n![img](img/87569369e8074c65e7c56ecade1ddea0_83_0.png)\n\
    \n####### 排進自己的工作排程\n\n在「時間地圖」上記下各項工作、約定的實行日。\n\n- **重點：**\n  - 要是排得太緊，根本無法實行。\n\
    \  - 千萬別被工作排程搞得團團轉。\n  - 活用「填字遊戲原則」。\n\n確定整體工作排程沒問題，便大功告成了！\n\n### 5 平常的工作也要步驟化：出差篇\n\
    \n#### 出差計畫也能步驟化\n\n「步驟化」也能運用於平常的工作，像是出差之類。\n\n雖然出差一定是在預定的時間行動，實行預定的約定，但並非只是這樣而已。出差前必須預約交通工具和住宿等，事後還得申報出差費用等後續事宜，因此出差也算是一種「活動」。\n\
    \n你有過心想：「有空再申報出差費用吧！」，結果不小忘記，被催促申報的經驗嗎？其實只要事先擬妥步驟，便能避免這種情況發生。\n\n#### 如何將出差計畫步驟化\n\
    \n首先從出差的目的（約定）開始步驟化。一旦確定，就要思考交通方式，倒推回去，決定何時啟程。\n\n此外，出差前有些準備事項，回來也有些事得處理，不妨活用「購物型」步驟法，列出工作內容。\n"
