    # 3 成為專案高手的條件①：別忘了目標與計畫


    # 如何順利地實行專案？


    訂立長期專案，實行長期計畫的方法和Part 4 說明的「步驟」，基本上是一樣的，然而長期計畫有著「容易遺忘」的特點。


    其中之一就是忘了目標和計畫。很少有人直到年末都還記得年初訂立的計畫，往往快到年末時才突然想起，更糟的是有人連訂立什麼計畫都想不起來，當然不可能達成目標，你是否也有過類似經驗呢？那麼，為何會變成這樣呢？


    其實答案非常簡單，因為沒將長期專案納入工作排程的緣故。


    一如前面所述，為了避免遗漏任何工作和活動，一定要排進工作排程（時間地圖），長期計畫也是一樣。不管計畫規模多麼龐大，要是沒有排進工作排程，根本無法切實執行。'
  - '[PAGE 101]


    雖然這是非常簡單的道理，但付諸實行的人並不多，只要問問你周遭的人就知道了。大部分人就算訂立好「今年的目標」，也沒有排進每天的工作排程。


    # 避免遺忘目標和計畫


    想要順利地實行專案，首先就是訂立整體計畫，而且有別於平常的工作排程，這是屬於長期計畫的排程。


    一想起平常的工作排程，便能同時看見長期計畫的排程，是種很有效果的方法。清楚瞭解為了達成長期排程，每週非得完成的進度，與「時間地圖」緊密結合。


    就算每天只花一分鐘也行，一定要養成審視長期計畫的習慣，而且務必將長期計畫排進工作排程。


    ![](img/87569369e8074c65e7c56ecade1ddea0_101_0.png)'
  - '[PAGE 102]


    # 4 成為專案高手的條件②：養成今日事，今日畢的習慣


    # 別累積「如山」的工作


    如同前述小惠的例子，一定要將準備資格考一事排進工作排程。最簡單的方法就是按月計畫，譬如一月準備到什麼樣的程度，二月做到什麼樣的程度。其實不少人都會用這方式訂立計畫，但順利實行的人少之又少，可見按月決定目標並非理想方式。


    理由之一就是容易「累積該做的事」。因為通常是月初訂立目標，畢竟離月底還有一個月，難免會產生懈怠、拖延的心態，結果月底往往忙得不可開交。總算勉強達到目標後，心想離下次完成期限還有一段時間，又開始懈怠。如此一來，只會陷入無止盡的惡性循環。


    如果只是「累積一件該做的事」倒還好，就怕同時「累積好幾件」，根本做不完。


    為了避免陷入這般惡性循環，一定要將目標細分化，否則粗略地訂立目標，只會不斷地「累積該做的事」。訂立瑣碎的計畫不是件容易的事，最好以每週為單位訂立目標。'
