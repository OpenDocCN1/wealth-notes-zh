    * 若是利用電腦製作「時間地圖」，在不妨礙處理其他工作的原則上，也要隨時保持開啟的狀態。\n\n#### 2 關於工作流程\n\n##### 開始工作前，先留意一下時間\n\
    \n「時間地圖」上寫有工作內容和約定事項。\n\n在約定好的時間帶內實行約定，其他時間用來處理工作。\n\n處理工作時，先看「時間地圖」上當天的工作欄，決定處理哪項工作後，再逐一完成。\n\
    \n工作和約定不一樣，沒有清楚的「完成期限」，端看自己選擇迅速地處理還是拖拖拉拉地做完。集中精神迅速處理完畢當然比較乾脆，也能提升工作效率。\n\n準備處理工作前，最好先估算這件工作大概要花多少時間，預設開始時間和所需時間，決定「何時完成」後再著手進行*。這麼一來，就不會拖拖拉拉，按照進度完成所有預定工作。\n\
    \n「這件工作大概要花多少時間才能完成？」也許一開始不曉得該如何估算，只要培養時間觀念，自然懂得如何拿捏。\n\n\\*設定這件工作要花OO分鐘完成後，使用碼錶等計時器邊計算時間邊進行，也是一種方法。\n\
    \n##### 確認已完成的工作\n\n清楚區分哪些是已經完成的工作，哪些是尚未完成的工作，才能確實地處理好每件工作，最好的方法就是確認已完成的工作。利用小方格標記，每做完一件工作便打勾，或是劃線刪除，看似簡單的習慣其實很重要喔！\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_137_0.png)\n\n- [x] B報告書\n  取得課長的認可\n\
    - [ ] 提出D企畫資料\n\n- ~~B報告書~~\n  ~~取得課長的認可~~\n  提出D企畫資料\n\n*打勾確認已完成的工作*\n\n*劃線刪除已完成的工作*\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_138_0.png)\n\n##### 如何因應新增工作？\n\n######\
    \ 儘快處理手邊能夠馬上完成的事\n\n一天中不可能每件事都是「事先安排好的工作」，難免有臨時插進來的工作。有時面對「預定好的工作」和「今天臨時插進來的工作」，會有不曉得先做哪一件事的困擾。\n\
    \n落實計畫是時間管理的一大課題，因此最好儘可能地落實事先計畫好的事。但計畫不能太過複雜，能夠馬上完成的工作最好儘快處理完畢。\n\n譬如花個二、三分鐘便能搞定的工作，卻全部拖到隔天再做，「時間地圖」上的工作量就會越積越多。一旦增加，便會打亂整體計畫，搞不清楚一天的工作量。\n\
    \n因此養成今日事今日畢的習慣，才能有序不紊地做好任何事。況且一早便塞滿工作，根本沒餘力處理新增的工作 *。\n\n\\*所謂餘力，是指有多餘的時間、心力處理別的事情。譬如完成今天所有預定的工作後，還有時間處理明天的工作。\n\
    \n###### 隨手記下挪至日後實行的約定和工作\n\n若無法立即處理臨時插進來的工作，便得挪後處理，約定也是一樣。只需花個十秒，隨手記下挪至日後實行的約定和工作，自然變成一種習慣。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_139_0.png)\n\n如同Part 2 所說明，清楚標記約定開始與結束時間，方便掌握約定以外的時間。\n\
    \n決定何時開始處理某件工作時，一定要隨手記下來，但不是標記「何時必須完成」，而是開始處理的時間點。\n\n這時一定要遵守「填字遊戲原則」，所謂「縱向觀點」就是衡量當天的工作量，不只追加工作時要這麼做，追加約定時也得這麼考量才行。畢竟一旦增加約定，相對地工作時間便減少。\n\
    \n依狀況而定，有時必須調整工作時間。唯有多花點心思，才能訂立更確實的計畫。\n"
