    下載，相信實踐起來會更方便。


    最後，我想說明感覺自己已經懂得如何善用時間的三

    種感覺，這三種「感覺」分別是：


    +   所謂「必須做」的「責任感」。


    +   所謂「做到了」的「成就感」。


    +   所謂「可以做」的「安心感」。


    之所以想「活用時間」，勢必會重視所謂的「責任

    感」和「成就感」，但光是這樣肯定會搞得自己身心俱

    疲，備感壓力，撐不了多久。


    本書介紹的「時間地圖」是種可以強化「安心感」的

