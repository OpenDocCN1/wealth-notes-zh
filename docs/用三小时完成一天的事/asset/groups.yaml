  - '[PAGE 106]


    # 6

    # 利用「專案地圖」整合應辦的事項


    # 凡事都要有「計畫」


    小夫和小惠實行的「專案」和平常的時間管理一樣，也必須經過訂立計畫、審視和實行等程序，這時不可或缺的道具就是「時間地圖」，而且是以長期觀點來看的「地圖」，稱為「專案地圖」。


    像小夫的情形是參與團隊專案，必須製作整體計畫的排程，但這份排程屬於專案的排程，不是個人排程，因此需要製作一份「專案地圖」，清楚知道自己「何時要做些什麼」。


    「專案地圖」與「時間地圖」就像比例尺不一樣的兩種地圖。「時間地圖」是整合自己一個禮拜的工作和時間，「專案地圖」則是整理長期計畫，結合兩種方式便能整合從每一天到跨好幾個月應辦的各種事項。'
  - '[PAGE 107]


    # 為何要製作「專案地圖」


    之所以製作「專案地圖」是為符合「成為專案高手的條件」。以下說明「專案地圖」的製作目的。


    +   - 目的：製作一份簡單明瞭的地圖，以防忘記目標與計畫

    「專案地圖」和每週的「時間地圖」搭配著看會更有

    效果，而且「地圖」務求簡單明瞭。


    +   - 目的：製作一份細分化的地圖，才能有效掌控進度

    因為「按月」計畫，時間拉得太長，無法有效掌控進

    度，還是細分化比較好。


    +   - 目的：整合成一張「地圖」，才能同時掌控「多項」專

    案的流程

    儘可能將與自己有關的專案整合成一張地圖，所有進

    度才能一目了然。


    下一章會說明如何製作符合上述目的的地圖。在這之

    前，先說明「如何劃分計畫的方法」。'
  - '[PAGE 108]


    # 7 實行的重點就是

    「以週為劃分單位」


    # 「按月劃分的計畫」無法順利實行的理由


    介紹「專案地圖」的作法前，先稍微說明一下劃分計畫的方法。如同前述，「按月」劃分計畫除了不容易掌握進度外，還有其他問題。


    不適宜的第二個理由就是按月劃分很難判斷還剩下多少工作時間，請參考右邊的月曆。同樣是二十號那天，按月劃分所顯示的剩餘工作天數卻有著極大差異，「今天是二十號，不代表還剩下三分之一」，按月劃分時會出現天數根本不到三分之一的情形。


    第三個理由是因為「按月」劃分，和平常常使用的「按週」劃分方式並不一致。若將以「月」為單位的目標，以「週」為單位劃分的話，最初與最後一週的天數不足，很難平均劃分，因此以月為單位的計畫很難排進以週為單位的排程。


    「專案地圖」與「時間地圖」就像比例尺不一樣的兩種地圖，唯有統一兩種地圖的單位，才能有效地搭配活用，因此「週」是最合適的單位。'
  md: "\n# 思考、書寫出差的步驟\n\n![](img/87569369e8074c65e7c56ecade1ddea0_85_0.png)\n\n以上圖為例，一邊直接寫在自己的「時間地圖」上，一邊思考。雖然看似簡單，其實是非常重要的的一個步驟。\n\
    \n## 平常的工作也要步驟化：書面報告篇\n\n### 提交書面報告也能步驟化\n\n除了出差，像是提交書面報告一事，只要事先「步驟化」也能達到事半功倍的效果，從從容容地提交報告，不必被完成期限追著跑。\n\
    \n這類工作適用「料理型」步驟法。\n\n### 如何將書寫報告步驟化\n\n提交「書面報告」是這項工作的目的。因為提出前必須先得到上司的認可，因此得先確認上司的時間，連同等待上司指示修改所需花費的時間也一併考慮，然後決定將報告呈給上司審核的時間。\n\
    \n接著再倒推回去，思考書寫報告的作業程序。這般作業程序可分為幾個階段，像是蒐集資料、列出內容大綱、繪製圖表、構思報告內容、完成報告形式等*。估算需要花費的時間，具體地分解成多項「工作」。\n\
    \n然後將這些工作排進「時間地圖」。這麼一來，不但方便掌控進度，每天的工作量也一目了然。而且就算同時進行其他工作，也能有計畫地掌控報告的書寫進度。\n\n\
    * 當然，根據書面報告不同，作業內容有所不同。\n\n# 思考、畫清書面報告的步驟\n\n| 6/14 週一 | 6/15 週二 | 6/16 週三 | 6/17\
    \ 週四 |\n| :--- | :--- | :--- | :--- |\n| 完成○○書面報告 | | | 課長出差 |\n| 整體的流程與日期 | |\
    \ | 連同上司的時間也一併考慮（事先記下上司的預定排程） |\n| □拿到去年的資料 □拿到初步的書面報告 | □完成圖表 □決定報告內容 □完成書面報告\
    \ | □取得上司的認可 □修改書面報告 | □提交書面報告 |\n| 做準備 | 完成書面報告 | 取得上司的認可＋修改作業 | 提交日 |\n| 倒推回去\
    \ | 決定步驟 | | |\n\n# 給不懂長「料理型」步驟法的人的建議\n\n書寫報告時，不妨邊筆記工作內容，邊書寫報告。只要列出作業清單，下一次便能活用「購物型」步驟法。（但若是提交不同種類的報告，一定要先確認有無必須追加之於清單上的東西）\n\
    \n# 7 實行步驟化的要點\n\n# 「步驟化」與「計畫管理」的差異\n\n這章節介紹的「料理型」與「購物型」步驟法，都是簡化計畫管理所用的手法。將「料理型」與「購物型」兩種手法組合運用於一項活動，或單獨使用也行，選擇適合自己的方式就可以了。\n\
    \n# 活用「步驟法」的要點\n\n活用「步驟法」時，有個非常重要的環節，一旦忽略，再怎麼完美的步驟都無法實行。這個重要的環節就是讓「步驟」與自己的排程緊密契合。\n\
    \n絕大部分的人都無法集中處理一件工作，手邊得同時進行各種雜事，還有許多活動得執行。\n\n注意力一旦集中於眼前的事物上，容易忘了長期進行的事。也就是說，一旦忙於其他工作，便忘了執行長期活動。\n\
    \n將事情步驟化後，必須馬上排進自己的排程裡，也就是「時間地圖」。在事情尚未完成前，就算步驟化做得再怎麼完美，也無法安心。\n\n像是提交出差報告之類的，一邊直接寫在「時間地圖」上，一邊步驟化也行；或是籌備展覽會等，先繪圖、列清單，再排進「時間地圖」也可以。總之，不管使用什麼方法，務必要將步驟化的結果排進「時間地圖」。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_89_0.png)\n\n在計畫管理中，可同時使用「料理型」的「倒推回去步驟圖」（網絡圖）以及「購物型」的「步驟清單」（WBS：Work\
    \ Breakdown Structure）。\n\n兩者功能上有些許差異。\n\n- 倒推回去步驟圖（網絡圖）：\n  - 表示作業前後關係\n  - 計算整體所需時間\n\
    - 步驟清單（WBS）：\n  - 列出清單，避免漏失\n  - 計算整體所需工時（＝所需工作人數×時間）\n\n若是耗費較多人力的龐大計畫，同時運用這兩種方法會比較有效，但本書所介紹的是比較簡便的方法，屬於單獨使用任何一種都可以的步驟法。\n\
    \n步驟化的最終目的就是排進「時間地圖」，才能有效地掌控進度，進行管理。因此對於個人工作步驟化，單獨使用「倒推回去步驟圖」或「步驟清單」都可以。\n\n#\
    \ Part 4 總整理\n\n不管使用哪一種方法，都要將步驟化的結果排進自己的「時間地圖」！\n\n## 「料理型」步驟法\n\n### 「料理型」步驟法：第一階段—倒推回去的步驟圖—\n\
    \n#### 從完成品倒推回想\n\n![](img/87569369e8074c65e7c56ecade1ddea0_90_0.png)\n\n- 確定一些必要作業的程序\n\
    - 確定前一階段的必要作業程序\n- 藉由這樣反覆地確認，不管任何工作都能分解成一項項的個別作業。\n\n### 「料理型」步驟法：第二階段—排進自己的工作排程—\n\
    \n#### 整體工作排程\n\n![](img/87569369e8074c65e7c56ecade1ddea0_90_1.png)\n\n#### 將各作業步驟化\n\
    \n- 若發生作業時間不敷使用等情形，就必須重新檢討將規模較大的作業再步驟化，思考排程方面有無問題。\n\n#### 排進自己的工作排程\n\n- 要是和自己的工作排程不合，就必須重新檢討。排進自己的「時間地圖」\n\
    \n### 「購物型」步驟法\n\n「購物型」步驟法：第一階段－將步驟列成清單－\n\n**將步驟列成清單**\n\n| 賓客 | 會場 | 展示品 |\n\
    | :--- | :--- | :--- |\n| 拿到賓客名單 製作邀請函、導覽手冊 寄送邀請函、導覽手冊 製作問候信 寄發 確認與會名單 | 確認場地大小\
    \ 挑選預備場地 確認承租場地的日期 和課長討論，決定場地 告知公司內部關於展期及場地等事宜 進行預約 | 確認各部門希望展示的商品 統計展示品的內容與數量\
    \ 列出展示品清單 將清單發函給各部門 決定會場內位置配置 繪出場地配置圖 |\n\n> **重點：寫出所有想詢問的事項和要點。**\n\n- 若後續有追加工作，必須隨時補上去。\n\
    \n「購物型」步驟法：第二階段－推進自己的工作排程－\n\n**思考步驟清單中的順序**\n\n| 賓客 | 期限 | 會場 | 期限 | 展示品 | 期限\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 拿到賓客名單 | | 確認場地大小 | | 確認各部門希望展示的商品\
    \ | |\n| 製作邀請函、導覽手冊 | | 挑選預備場地 | | 統計展示品的內容與數量 | |\n| 寄送邀請函、導覽手冊 | | 確認承租場地的日期\
    \ | | 列出展示品清單 | |\n| 製作問候信 | | 和課長討論，決定場地 | | 將清單發函給各部門 | 6/7 |\n| 寄發 | | 告知公司內部關於展期及場地\
    \ | | 決定會場內位置配置 | |\n| 確認與會名單 | 6/20 | 事宜 | | | |\n| | | 進行預約 | | | |\n\n**推進比較確定的完成期限**\n\
    \n**調整適當的順序**\n\n**推進自己的工作排程**\n\n- 在「時間地圖」上記下各項工作、約定的實行日。\n- 工作和約定會不會排得太緊？\n\
    - 整體排程有無問題？\n- （如果有問題，一定要重新檢討，考慮請別人協助）\n\n# 時間活用秘技④ 藉由日常各種事情養成「步驟力」\n\n常聽到「步驟」這字眼，卻不太明白它的意思。\n\
    \n常被別人叮嚀「要按部就班地做事」，卻很少有人告訴我們該怎麼做。\n\n事實上，我在主持時間管理研習營時，也曾收到許多向我請教如何步驟化的聲音。畢竟這是很難簡單說明的道理，所以我試著尋找有沒有什麼適合的參考書籍，結果都沒有找到。雖然參考說明計畫管理的相關書籍可以瞭解一二，但還是有種搔不到癢處的感覺，這也是促使我寫這本書的原因。\n\
    \n所謂「步驟」，一言以蔽之，就是「書寫工作食譜」。尤其是處理從沒做過的事時，更能發揮作用。因此一定要提升自己的步驟力……雖說如此，但每個人的步驟化能力差異頗大，或許有人早就擅於步驟化也說不一定。\n\
    \n雖然工作經驗越多，步驟化能力越強，但並非絕對如此。譬如，有些人是因為從事自己感興趣的事情，不知不覺地磨練出步驟力，對工作也產生莫大助益。\n\n像是組裝複雜的模型、利用休假日親手做木工，或自創料理、安排旅遊計畫等，都能訓練自己的步驟力。\n\
    \n若對自己的步驟力沒什麼自信的話，也不必灰心。提升我步驟力的秘訣就是「寫」。就像記menu一樣，寫下工作流程就對了。然後邊對照流程邊進行工作，只要養成這習慣，一定能提升自我步驟力。\n\
    \n此外，向周遭擅於步驟化的人請益也是個方法。不過突然向別人請教，也許會造成對方的困擾也不定（自己很擅長，不代表很會教導別人），所以求人不如求己，還是靠自己學習最實在。\n\
    \n凡事步驟化不但能夠避免弄錯工作程序，對於瞭解工作所需時間，掌控進度等也有莫大助益。處理規模龐大的工作前，先花個十分鐘思考一下步驟，只要養成這個習慣，肯定能讓自己贏在起跑點。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_93_0.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_93_1.png)\n\
    \n# Part 5 成為專案高手！\n\n# 讓長期計畫能順利落實\n\n# 為何長期計畫總是無法順利進行呢？\n\n## 小夫的不安：計畫總是趕不上變化\n\
    \n「那件案子的明細單進行得如何了？」\n\n任職於IT企業的小夫一聽到上司這麼問，不由地愣了一下。\n\n「一切按照進度進行。」\n\n雖然小夫這麼回答，其實進行得不是很順利。想想去年也是因為明細單做得亂七八糟，導致進度嚴重落後，那時真的是做什麼都不順、惹得別人發火……搞得一片烏煙瘴氣。\n\
    \n雖然很留意進度的掌控，但手邊有好幾件案子得同時處理，只好每天拼命加班趕進度。小夫心想要是進度能稍微順利一點就好了……卻往往不如人意。\n\n## 小惠的煩惱：準備考試的不安\n\
    \n> 「還有三章……不知還要唸多久啊！」\n\n一個人在家的小惠，這麼地喃喃自語。\n\n小惠進入這家公司已經五年，對工作並沒有什麼不滿，但為了更往上爬，小惠正在準備資格考試。\n\
    \n轉眼已過了四個月。和當初所訂的讀書計畫完全不一樣，進度一直在原地打轉。有時實在提不起勁唸書，乾脆不碰書本，其實自己也很明白不能這樣，但只是搞得心裡更煩。明知再這麼下去不行，但就是不知道該怎麼辦。\n\
    \n以上這些就是他們遇到的煩惱，而且兩個人面對的都是一項「專案」（Project）。接下來，我們就來學習如何讓「專案」順利進行的方法。\n\n# 2 實現長期計畫的方法：養成「一分鐘習慣」\n\
    \n## 什麼是專案？\n\n我想大家對「專案」這字眼應該不陌生，專案也含有「計畫」的意思。面對屬於「專案」的工作，也就是目標已經決定的工作，一旦達成目標便表示工作告一段落*。不過有很多短時間便能完成的工作，無法稱為專案。像上班族的工作當然是屬於一種專案，還有小惠準備考試一事，也是以取得資格認證為目標的專案。\n\
    \n一旦著手進行一件工作，勢必遇到各種問題，這和學生時代為「畢業論文」傷腦筋的道理是一樣的。\n\n## 專案為何無法順利進行？\n\n任何人難免會有專案無法順利進行的煩惱。舉個最貼近生活的例子，譬如明明給自已立下新的一年要學好英文的目標，結果卻沒達成，其實有這般經驗的人還真不少（參考右圖的問卷調查）。你是否也有此經驗呢？如果有的話，請回想那時情形，是否不知不覺間忘了自己計立的長期計畫呢？\n\
    \n比起無法馬上獲得結果的專案，一般人都會優先處理眼前發生的事，所以有時會不知不覺地忘記已經計立的計畫，這就是長期計畫難以順利進行的問題點。\n\n「農耕」恐怕是人類最早實行的「專案」。為了收成，必須先播種、栽種等。人類史上開始有農耕一事始於一萬五千年前，和人類數百萬年歷史相比，連\
    \ 0.5% 都不到。綜觀人類歷史，充其量我們只是個「專案新手」吧。\n\n所以一定要養成思考、隨時記著計畫的「習慣」。養成每天花一分鐘思考「專案」的習慣，一定能讓自己成為「專案高手」。\n\
    \n# Part 5 問卷調查\n\n能夠達成为期一年（或近一年）的目標嗎？\n\n![](img/87569369e8074c65e7c56ecade1ddea0_99_0.png)\n\
    \n> 幾乎都有達成\n> 有一半的計畫都達成了\n> 大部分都是做到一半就忘了，根本沒有達成。\n\n這是時間管理術研究所針對部落格讀者，所做的一項關於「目標達成率」的問卷調查。\n\
    \n# 3 成為專案高手的條件①：別忘了目標與計畫\n\n## 如何順利地實行專案？\n\n訂立長期專案，實行長期計畫的方法和Part 4 說明的「步驟」，基本上是一樣的，然而長期計畫有著「容易遺忘」的特點。\n\
    \n其中之一就是忘了目標和計畫。很少有人直到年末都還記得年初訂立的計畫，往往快到年末時才突然想起，更糟的是有人連訂立什麼計畫都想不起來，當然不可能達成目標，你是否也有過類似經驗呢？那麼，為何會變成這樣呢？\n\
    \n其實答案非常簡單，因為沒將長期專案納入工作排程的緣故。\n\n一如前面所述，為了避免遗漏任何工作和活動，一定要排進工作排程（時間地圖），長期計畫也是一樣。不管計畫規模多麼龐大，要是沒有排進工作排程，根本無法切實執行。\n\
    \n雖然這是非常簡單的道理，但付諸實行的人並不多，只要問問你周遭的人就知道了。大部分人就算訂立好「今年的目標」，也沒有排進每天的工作排程。\n\n## 避免遺忘目標和計畫\n\
    \n想要順利地實行專案，首先就是訂立整體計畫，而且有別於平常的工作排程，這是屬於長期計畫的排程。\n\n一想起平常的工作排程，便能同時看見長期計畫的排程，是種很有效果的方法。清楚瞭解為了達成長期排程，每週非得完成的進度，與「時間地圖」緊密結合。\n\
    \n就算每天只花一分鐘也行，一定要養成審視長期計畫的習慣，而且務必將長期計畫排進工作排程。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_101_0.png)\n\
    \n# 4 成為專案高手的條件②：養成今日事，今日畢的習慣\n\n## 別累積「如山」的工作\n\n如同前述小惠的例子，一定要將準備資格考一事排進工作排程。最簡單的方法就是按月計畫，譬如一月準備到什麼樣的程度，二月做到什麼樣的程度。其實不少人都會用這方式訂立計畫，但順利實行的人少之又少，可見按月決定目標並非理想方式。\n\
    \n理由之一就是容易「累積該做的事」。因為通常是月初訂立目標，畢竟離月底還有一個月，難免會產生懈怠、拖延的心態，結果月底往往忙得不可開交。總算勉強達到目標後，心想離下次完成期限還有一段時間，又開始懈怠。如此一來，只會陷入無止盡的惡性循環。\n\
    \n如果只是「累積一件該做的事」倒還好，就怕同時「累積好幾件」，根本做不完。\n\n為了避免陷入這般惡性循環，一定要將目標細分化，否則粗略地訂立目標，只會不斷地「累積該做的事」。訂立瑣碎的計畫不是件容易的事，最好以每週為單位訂立目標。\n\
    \n## 別「累積」計畫\n\n### 按月訂立計畫，進度容易拖延\n\n![](img/87569369e8074c65e7c56ecade1ddea0_103_0.png)\n\
    \n### 將目標細分化，才能縮小差距\n\n![](img/87569369e8074c65e7c56ecade1ddea0_103_1.png)\n\n\
    # 5 成為專案高手的條件③：妥善掌控「多項」專案的流程\n\n## 手上同時有多件專案進行\n\n其實很多人和小夫一樣，手上有多項專案同時進行。除了參與團隊專案，還有個人目標必須訂立、管理，因此手上同時有多件專案進行是相當平常的事。\n\
    \n遇到工作量「龐雜」的專案，不妨仿效訂立個人讀書計畫，以「每天唸書一個鐘頭」為目標，每天分配一些進度。當然專案也有繁忙與清閒的時候，尤其是必須和別人合作的專案更是如此。\n\
    \n當手上有多件專案同時進行時，只要安排一項處於「尖峰期」的專案，搭配另一件處於「離峰期」的計畫就行了。相反地，要是「尖峰期」撞期就不妙了。因此必須預測每件專案的工作量，確認如何安排比較妥當。如同\
    \ Part 2 提及的「填字遊戲原則」，最好分別就計畫的整體「流程」和各時期的「工作量」來衡量。當然難免會出現「尖峰期」撞期的情形，只要做好事前準備，便能隨時調整狀況。\n\
    \n只要經過審慎地確認、思考，就算再多計畫也能有效地整合。製作一張 Part 2 介紹的「時間地圖」（長期排程版），整體專案的「尖峰期」和「離峰期」便一目了然。\n\
    \n## 掌控多件專案的流程\n\n![](img/87569369e8074c65e7c56ecade1ddea0_105_0.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_105_1.png)\n\
    \n# 6 利用「專案地圖」整合應辦的事項\n\n## 凡事都要有「計畫」\n\n小夫和小惠實行的「專案」和平常的時間管理一樣，也必須經過訂立計畫、審視和實行等程序，這時不可或缺的道具就是「時間地圖」，而且是以長期觀點來看的「地圖」，稱為「專案地圖」。\n\
    \n像小夫的情形是參與團隊專案，必須製作整體計畫的排程，但這份排程屬於專案的排程，不是個人排程，因此需要製作一份「專案地圖」，清楚知道自己「何時要做些什麼」。\n\
    \n「專案地圖」與「時間地圖」就像比例尺不一樣的兩種地圖。「時間地圖」是整合自己一個禮拜的工作和時間，「專案地圖」則是整理長期計畫，結合兩種方式便能整合從每一天到跨好幾個月應辦的各種事項。\n\
    \n## 為何要製作「專案地圖」\n\n之所以製作「專案地圖」是為符合「成為專案高手的條件」。以下說明「專案地圖」的製作目的。\n\n- 目的：製作一份簡單明瞭的地圖，以防忘記目標與計畫\n\
    \  - 「專案地圖」和每週的「時間地圖」搭配著看會更有效果，而且「地圖」務求簡單明瞭。\n- 目的：製作一份細分化的地圖，才能有效掌控進度\n  - 因為「按月」計畫，時間拉得太長，無法有效掌控進度，還是細分化比較好。\n\
    - 目的：整合成一張「地圖」，才能同時掌控「多項」專案的流程\n  - 儘可能將與自己有關的專案整合成一張地圖，所有進度才能一目了然。\n\n下一章會說明如何製作符合上述目的的地圖。在這之前，先說明「如何劃分計畫的方法」。\n\
    \n# 7 實行的重點就是「以週為劃分單位」\n\n## 「按月劃分的計畫」無法順利實行的理由\n\n介紹「專案地圖」的作法前，先稍微說明一下劃分計畫的方法。如同前述，「按月」劃分計畫除了不容易掌握進度外，還有其他問題。\n\
    \n不適宜的第二個理由就是按月劃分很難判斷還剩下多少工作時間，請參考右邊的月曆。同樣是二十號那天，按月劃分所顯示的剩餘工作天數卻有著極大差異，「今天是二十號，不代表還剩下三分之一」，按月劃分時會出現天數根本不到三分之一的情形。\n\
    \n第三個理由是因為「按月」劃分，和平常常使用的「按週」劃分方式並不一致。若將以「月」為單位的目標，以「週」為單位劃分的話，最初與最後一週的天數不足，很難平均劃分，因此以月為單位的計畫很難排進以週為單位的排程。\n\
    \n「專案地圖」與「時間地圖」就像比例尺不一樣的兩種地圖，唯有統一兩種地圖的單位，才能有效地搭配活用，因此「週」是最合適的單位。\n"
  mdcn: "\n# 思考、書寫出差的步驟\n\n![](img/87569369e8074c65e7c56ecade1ddea0_85_0.png)\n\n\
    以上圖為例，一邊直接寫在自己的「時間地圖」上，一邊思考。雖然看似簡單，其實是非常重要的的一個步驟。\n\n## 平常的工作也要步驟化：書面報告篇\n\n###\
    \ 提交書面報告也能步驟化\n\n除了出差，像是提交書面報告一事，只要事先「步驟化」也能達到事半功倍的效果，從從容容地提交報告，不必被完成期限追著跑。\n\n\
    這類工作適用「料理型」步驟法。\n\n### 如何將書寫報告步驟化\n\n提交「書面報告」是這項工作的目的。因為提出前必須先得到上司的認可，因此得先確認上司的時間，連同等待上司指示修改所需花費的時間也一併考慮，然後決定將報告呈給上司審核的時間。\n\
    \n接著再倒推回去，思考書寫報告的作業程序。這般作業程序可分為幾個階段，像是蒐集資料、列出內容大綱、繪製圖表、構思報告內容、完成報告形式等*。估算需要花費的時間，具體地分解成多項「工作」。\n\
    \n然後將這些工作排進「時間地圖」。這麼一來，不但方便掌控進度，每天的工作量也一目了然。而且就算同時進行其他工作，也能有計畫地掌控報告的書寫進度。\n\n\
    * 當然，根據書面報告不同，作業內容有所不同。\n\n# 思考、畫清書面報告的步驟\n\n| 6/14 週一 | 6/15 週二 | 6/16 週三 | 6/17\
    \ 週四 |\n| :--- | :--- | :--- | :--- |\n| 完成○○書面報告 | | | 課長出差 |\n| 整體的流程與日期 | |\
    \ | 連同上司的時間也一併考慮（事先記下上司的預定排程） |\n| □拿到去年的資料 □拿到初步的書面報告 | □完成圖表 □決定報告內容 □完成書面報告\
    \ | □取得上司的認可 □修改書面報告 | □提交書面報告 |\n| 做準備 | 完成書面報告 | 取得上司的認可＋修改作業 | 提交日 |\n| 倒推回去\
    \ | 決定步驟 | | |\n\n# 給不懂長「料理型」步驟法的人的建議\n\n書寫報告時，不妨邊筆記工作內容，邊書寫報告。只要列出作業清單，下一次便能活用「購物型」步驟法。（但若是提交不同種類的報告，一定要先確認有無必須追加之於清單上的東西）\n\
    \n# 7 實行步驟化的要點\n\n# 「步驟化」與「計畫管理」的差異\n\n這章節介紹的「料理型」與「購物型」步驟法，都是簡化計畫管理所用的手法。將「料理型」與「購物型」兩種手法組合運用於一項活動，或單獨使用也行，選擇適合自己的方式就可以了。\n\
    \n# 活用「步驟法」的要點\n\n活用「步驟法」時，有個非常重要的環節，一旦忽略，再怎麼完美的步驟都無法實行。這個重要的環節就是讓「步驟」與自己的排程緊密契合。\n\
    \n絕大部分的人都無法集中處理一件工作，手邊得同時進行各種雜事，還有許多活動得執行。\n\n注意力一旦集中於眼前的事物上，容易忘了長期進行的事。也就是說，一旦忙於其他工作，便忘了執行長期活動。\n\
    \n將事情步驟化後，必須馬上排進自己的排程裡，也就是「時間地圖」。在事情尚未完成前，就算步驟化做得再怎麼完美，也無法安心。\n\n像是提交出差報告之類的，一邊直接寫在「時間地圖」上，一邊步驟化也行；或是籌備展覽會等，先繪圖、列清單，再排進「時間地圖」也可以。總之，不管使用什麼方法，務必要將步驟化的結果排進「時間地圖」。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_89_0.png)\n\n在計畫管理中，可同時使用「料理型」的「倒推回去步驟圖」（網絡圖）以及「購物型」的「步驟清單」（WBS：Work\
    \ Breakdown Structure）。\n\n兩者功能上有些許差異。\n\n- 倒推回去步驟圖（網絡圖）：\n  - 表示作業前後關係\n  - 計算整體所需時間\n\
    - 步驟清單（WBS）：\n  - 列出清單，避免漏失\n  - 計算整體所需工時（＝所需工作人數×時間）\n\n若是耗費較多人力的龐大計畫，同時運用這兩種方法會比較有效，但本書所介紹的是比較簡便的方法，屬於單獨使用任何一種都可以的步驟法。\n\
    \n步驟化的最終目的就是排進「時間地圖」，才能有效地掌控進度，進行管理。因此對於個人工作步驟化，單獨使用「倒推回去步驟圖」或「步驟清單」都可以。\n\n#\
    \ Part 4 總整理\n\n不管使用哪一種方法，都要將步驟化的結果排進自己的「時間地圖」！\n\n## 「料理型」步驟法\n\n### 「料理型」步驟法：第一階段—倒推回去的步驟圖—\n\
    \n#### 從完成品倒推回想\n\n![](img/87569369e8074c65e7c56ecade1ddea0_90_0.png)\n\n- 確定一些必要作業的程序\n\
    - 確定前一階段的必要作業程序\n- 藉由這樣反覆地確認，不管任何工作都能分解成一項項的個別作業。\n\n### 「料理型」步驟法：第二階段—排進自己的工作排程—\n\
    \n#### 整體工作排程\n\n![](img/87569369e8074c65e7c56ecade1ddea0_90_1.png)\n\n#### 將各作業步驟化\n\
    \n- 若發生作業時間不敷使用等情形，就必須重新檢討將規模較大的作業再步驟化，思考排程方面有無問題。\n\n#### 排進自己的工作排程\n\n- 要是和自己的工作排程不合，就必須重新檢討。排進自己的「時間地圖」\n\
    \n### 「購物型」步驟法\n\n「購物型」步驟法：第一階段－將步驟列成清單－\n\n**將步驟列成清單**\n\n| 賓客 | 會場 | 展示品 |\n\
    | :--- | :--- | :--- |\n| 拿到賓客名單 製作邀請函、導覽手冊 寄送邀請函、導覽手冊 製作問候信 寄發 確認與會名單 | 確認場地大小\
    \ 挑選預備場地 確認承租場地的日期 和課長討論，決定場地 告知公司內部關於展期及場地等事宜 進行預約 | 確認各部門希望展示的商品 統計展示品的內容與數量\
    \ 列出展示品清單 將清單發函給各部門 決定會場內位置配置 繪出場地配置圖 |\n\n> **重點：寫出所有想詢問的事項和要點。**\n\n- 若後續有追加工作，必須隨時補上去。\n\
    \n「購物型」步驟法：第二階段－推進自己的工作排程－\n\n**思考步驟清單中的順序**\n\n| 賓客 | 期限 | 會場 | 期限 | 展示品 | 期限\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| 拿到賓客名單 | | 確認場地大小 | | 確認各部門希望展示的商品\
    \ | |\n| 製作邀請函、導覽手冊 | | 挑選預備場地 | | 統計展示品的內容與數量 | |\n| 寄送邀請函、導覽手冊 | | 確認承租場地的日期\
    \ | | 列出展示品清單 | |\n| 製作問候信 | | 和課長討論，決定場地 | | 將清單發函給各部門 | 6/7 |\n| 寄發 | | 告知公司內部關於展期及場地\
    \ | | 決定會場內位置配置 | |\n| 確認與會名單 | 6/20 | 事宜 | | | |\n| | | 進行預約 | | | |\n\n**推進比較確定的完成期限**\n\
    \n**調整適當的順序**\n\n**推進自己的工作排程**\n\n- 在「時間地圖」上記下各項工作、約定的實行日。\n- 工作和約定會不會排得太緊？\n\
    - 整體排程有無問題？\n- （如果有問題，一定要重新檢討，考慮請別人協助）\n\n# 時間活用秘技④ 藉由日常各種事情養成「步驟力」\n\n常聽到「步驟」這字眼，卻不太明白它的意思。\n\
    \n常被別人叮嚀「要按部就班地做事」，卻很少有人告訴我們該怎麼做。\n\n事實上，我在主持時間管理研習營時，也曾收到許多向我請教如何步驟化的聲音。畢竟這是很難簡單說明的道理，所以我試著尋找有沒有什麼適合的參考書籍，結果都沒有找到。雖然參考說明計畫管理的相關書籍可以瞭解一二，但還是有種搔不到癢處的感覺，這也是促使我寫這本書的原因。\n\
    \n所謂「步驟」，一言以蔽之，就是「書寫工作食譜」。尤其是處理從沒做過的事時，更能發揮作用。因此一定要提升自己的步驟力……雖說如此，但每個人的步驟化能力差異頗大，或許有人早就擅於步驟化也說不一定。\n\
    \n雖然工作經驗越多，步驟化能力越強，但並非絕對如此。譬如，有些人是因為從事自己感興趣的事情，不知不覺地磨練出步驟力，對工作也產生莫大助益。\n\n像是組裝複雜的模型、利用休假日親手做木工，或自創料理、安排旅遊計畫等，都能訓練自己的步驟力。\n\
    \n若對自己的步驟力沒什麼自信的話，也不必灰心。提升我步驟力的秘訣就是「寫」。就像記menu一樣，寫下工作流程就對了。然後邊對照流程邊進行工作，只要養成這習慣，一定能提升自我步驟力。\n\
    \n此外，向周遭擅於步驟化的人請益也是個方法。不過突然向別人請教，也許會造成對方的困擾也不定（自己很擅長，不代表很會教導別人），所以求人不如求己，還是靠自己學習最實在。\n\
    \n凡事步驟化不但能夠避免弄錯工作程序，對於瞭解工作所需時間，掌控進度等也有莫大助益。處理規模龐大的工作前，先花個十分鐘思考一下步驟，只要養成這個習慣，肯定能讓自己贏在起跑點。\n\
    \n![](img/87569369e8074c65e7c56ecade1ddea0_93_0.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_93_1.png)\n\
    \n# Part 5 成為專案高手！\n\n# 讓長期計畫能順利落實\n\n# 為何長期計畫總是無法順利進行呢？\n\n## 小夫的不安：計畫總是趕不上變化\n\
    \n「那件案子的明細單進行得如何了？」\n\n任職於IT企業的小夫一聽到上司這麼問，不由地愣了一下。\n\n「一切按照進度進行。」\n\n雖然小夫這麼回答，其實進行得不是很順利。想想去年也是因為明細單做得亂七八糟，導致進度嚴重落後，那時真的是做什麼都不順、惹得別人發火……搞得一片烏煙瘴氣。\n\
    \n雖然很留意進度的掌控，但手邊有好幾件案子得同時處理，只好每天拼命加班趕進度。小夫心想要是進度能稍微順利一點就好了……卻往往不如人意。\n\n## 小惠的煩惱：準備考試的不安\n\
    \n> 「還有三章……不知還要唸多久啊！」\n\n一個人在家的小惠，這麼地喃喃自語。\n\n小惠進入這家公司已經五年，對工作並沒有什麼不滿，但為了更往上爬，小惠正在準備資格考試。\n\
    \n轉眼已過了四個月。和當初所訂的讀書計畫完全不一樣，進度一直在原地打轉。有時實在提不起勁唸書，乾脆不碰書本，其實自己也很明白不能這樣，但只是搞得心裡更煩。明知再這麼下去不行，但就是不知道該怎麼辦。\n\
    \n以上這些就是他們遇到的煩惱，而且兩個人面對的都是一項「專案」（Project）。接下來，我們就來學習如何讓「專案」順利進行的方法。\n\n# 2 實現長期計畫的方法：養成「一分鐘習慣」\n\
    \n## 什麼是專案？\n\n我想大家對「專案」這字眼應該不陌生，專案也含有「計畫」的意思。面對屬於「專案」的工作，也就是目標已經決定的工作，一旦達成目標便表示工作告一段落*。不過有很多短時間便能完成的工作，無法稱為專案。像上班族的工作當然是屬於一種專案，還有小惠準備考試一事，也是以取得資格認證為目標的專案。\n\
    \n一旦著手進行一件工作，勢必遇到各種問題，這和學生時代為「畢業論文」傷腦筋的道理是一樣的。\n\n## 專案為何無法順利進行？\n\n任何人難免會有專案無法順利進行的煩惱。舉個最貼近生活的例子，譬如明明給自已立下新的一年要學好英文的目標，結果卻沒達成，其實有這般經驗的人還真不少（參考右圖的問卷調查）。你是否也有此經驗呢？如果有的話，請回想那時情形，是否不知不覺間忘了自己計立的長期計畫呢？\n\
    \n比起無法馬上獲得結果的專案，一般人都會優先處理眼前發生的事，所以有時會不知不覺地忘記已經計立的計畫，這就是長期計畫難以順利進行的問題點。\n\n「農耕」恐怕是人類最早實行的「專案」。為了收成，必須先播種、栽種等。人類史上開始有農耕一事始於一萬五千年前，和人類數百萬年歷史相比，連\
    \ 0.5% 都不到。綜觀人類歷史，充其量我們只是個「專案新手」吧。\n\n所以一定要養成思考、隨時記著計畫的「習慣」。養成每天花一分鐘思考「專案」的習慣，一定能讓自己成為「專案高手」。\n\
    \n# Part 5 問卷調查\n\n能夠達成为期一年（或近一年）的目標嗎？\n\n![](img/87569369e8074c65e7c56ecade1ddea0_99_0.png)\n\
    \n> 幾乎都有達成\n> 有一半的計畫都達成了\n> 大部分都是做到一半就忘了，根本沒有達成。\n\n這是時間管理術研究所針對部落格讀者，所做的一項關於「目標達成率」的問卷調查。\n\
    \n# 3 成為專案高手的條件①：別忘了目標與計畫\n\n## 如何順利地實行專案？\n\n訂立長期專案，實行長期計畫的方法和Part 4 說明的「步驟」，基本上是一樣的，然而長期計畫有著「容易遺忘」的特點。\n\
    \n其中之一就是忘了目標和計畫。很少有人直到年末都還記得年初訂立的計畫，往往快到年末時才突然想起，更糟的是有人連訂立什麼計畫都想不起來，當然不可能達成目標，你是否也有過類似經驗呢？那麼，為何會變成這樣呢？\n\
    \n其實答案非常簡單，因為沒將長期專案納入工作排程的緣故。\n\n一如前面所述，為了避免遗漏任何工作和活動，一定要排進工作排程（時間地圖），長期計畫也是一樣。不管計畫規模多麼龐大，要是沒有排進工作排程，根本無法切實執行。\n\
    \n雖然這是非常簡單的道理，但付諸實行的人並不多，只要問問你周遭的人就知道了。大部分人就算訂立好「今年的目標」，也沒有排進每天的工作排程。\n\n## 避免遺忘目標和計畫\n\
    \n想要順利地實行專案，首先就是訂立整體計畫，而且有別於平常的工作排程，這是屬於長期計畫的排程。\n\n一想起平常的工作排程，便能同時看見長期計畫的排程，是種很有效果的方法。清楚瞭解為了達成長期排程，每週非得完成的進度，與「時間地圖」緊密結合。\n\
    \n就算每天只花一分鐘也行，一定要養成審視長期計畫的習慣，而且務必將長期計畫排進工作排程。\n\n![](img/87569369e8074c65e7c56ecade1ddea0_101_0.png)\n\
    \n# 4 成為專案高手的條件②：養成今日事，今日畢的習慣\n\n## 別累積「如山」的工作\n\n如同前述小惠的例子，一定要將準備資格考一事排進工作排程。最簡單的方法就是按月計畫，譬如一月準備到什麼樣的程度，二月做到什麼樣的程度。其實不少人都會用這方式訂立計畫，但順利實行的人少之又少，可見按月決定目標並非理想方式。\n\
    \n理由之一就是容易「累積該做的事」。因為通常是月初訂立目標，畢竟離月底還有一個月，難免會產生懈怠、拖延的心態，結果月底往往忙得不可開交。總算勉強達到目標後，心想離下次完成期限還有一段時間，又開始懈怠。如此一來，只會陷入無止盡的惡性循環。\n\
    \n如果只是「累積一件該做的事」倒還好，就怕同時「累積好幾件」，根本做不完。\n\n為了避免陷入這般惡性循環，一定要將目標細分化，否則粗略地訂立目標，只會不斷地「累積該做的事」。訂立瑣碎的計畫不是件容易的事，最好以每週為單位訂立目標。\n\
    \n## 別「累積」計畫\n\n### 按月訂立計畫，進度容易拖延\n\n![](img/87569369e8074c65e7c56ecade1ddea0_103_0.png)\n\
    \n### 將目標細分化，才能縮小差距\n\n![](img/87569369e8074c65e7c56ecade1ddea0_103_1.png)\n\n\
    # 5 成為專案高手的條件③：妥善掌控「多項」專案的流程\n\n## 手上同時有多件專案進行\n\n其實很多人和小夫一樣，手上有多項專案同時進行。除了參與團隊專案，還有個人目標必須訂立、管理，因此手上同時有多件專案進行是相當平常的事。\n\
    \n遇到工作量「龐雜」的專案，不妨仿效訂立個人讀書計畫，以「每天唸書一個鐘頭」為目標，每天分配一些進度。當然專案也有繁忙與清閒的時候，尤其是必須和別人合作的專案更是如此。\n\
    \n當手上有多件專案同時進行時，只要安排一項處於「尖峰期」的專案，搭配另一件處於「離峰期」的計畫就行了。相反地，要是「尖峰期」撞期就不妙了。因此必須預測每件專案的工作量，確認如何安排比較妥當。如同\
    \ Part 2 提及的「填字遊戲原則」，最好分別就計畫的整體「流程」和各時期的「工作量」來衡量。當然難免會出現「尖峰期」撞期的情形，只要做好事前準備，便能隨時調整狀況。\n\
    \n只要經過審慎地確認、思考，就算再多計畫也能有效地整合。製作一張 Part 2 介紹的「時間地圖」（長期排程版），整體專案的「尖峰期」和「離峰期」便一目了然。\n\
    \n## 掌控多件專案的流程\n\n![](img/87569369e8074c65e7c56ecade1ddea0_105_0.png)\n\n![](img/87569369e8074c65e7c56ecade1ddea0_105_1.png)\n\
    \n# 6 利用「專案地圖」整合應辦的事項\n\n## 凡事都要有「計畫」\n\n小夫和小惠實行的「專案」和平常的時間管理一樣，也必須經過訂立計畫、審視和實行等程序，這時不可或缺的道具就是「時間地圖」，而且是以長期觀點來看的「地圖」，稱為「專案地圖」。\n\
    \n像小夫的情形是參與團隊專案，必須製作整體計畫的排程，但這份排程屬於專案的排程，不是個人排程，因此需要製作一份「專案地圖」，清楚知道自己「何時要做些什麼」。\n\
    \n「專案地圖」與「時間地圖」就像比例尺不一樣的兩種地圖。「時間地圖」是整合自己一個禮拜的工作和時間，「專案地圖」則是整理長期計畫，結合兩種方式便能整合從每一天到跨好幾個月應辦的各種事項。\n\
    \n## 為何要製作「專案地圖」\n\n之所以製作「專案地圖」是為符合「成為專案高手的條件」。以下說明「專案地圖」的製作目的。\n\n- 目的：製作一份簡單明瞭的地圖，以防忘記目標與計畫\n\
    \  - 「專案地圖」和每週的「時間地圖」搭配著看會更有效果，而且「地圖」務求簡單明瞭。\n- 目的：製作一份細分化的地圖，才能有效掌控進度\n  - 因為「按月」計畫，時間拉得太長，無法有效掌控進度，還是細分化比較好。\n\
    - 目的：整合成一張「地圖」，才能同時掌控「多項」專案的流程\n  - 儘可能將與自己有關的專案整合成一張地圖，所有進度才能一目了然。\n\n下一章會說明如何製作符合上述目的的地圖。在這之前，先說明「如何劃分計畫的方法」。\n\
    \n# 7 實行的重點就是「以週為劃分單位」\n\n## 「按月劃分的計畫」無法順利實行的理由\n\n介紹「專案地圖」的作法前，先稍微說明一下劃分計畫的方法。如同前述，「按月」劃分計畫除了不容易掌握進度外，還有其他問題。\n\
    \n不適宜的第二個理由就是按月劃分很難判斷還剩下多少工作時間，請參考右邊的月曆。同樣是二十號那天，按月劃分所顯示的剩餘工作天數卻有著極大差異，「今天是二十號，不代表還剩下三分之一」，按月劃分時會出現天數根本不到三分之一的情形。\n\
    \n第三個理由是因為「按月」劃分，和平常常使用的「按週」劃分方式並不一致。若將以「月」為單位的目標，以「週」為單位劃分的話，最初與最後一週的天數不足，很難平均劃分，因此以月為單位的計畫很難排進以週為單位的排程。\n\
    \n「專案地圖」與「時間地圖」就像比例尺不一樣的兩種地圖，唯有統一兩種地圖的單位，才能有效地搭配活用，因此「週」是最合適的單位。\n"
