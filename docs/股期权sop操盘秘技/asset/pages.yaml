    +   三、圖中③所示，均線做出三線合一拉長紅突破前波 10255的高點。


    +   四、圖中④所示，出現攻擊量。


    +   五、如上述日經指數完成SOP第三個方塊「波段指標」的四個條件，指數展開波段行情。自8239漲到15943，漲幅高達9成以上。後來K線出現一根「劍線」若三根K線（組合K線）一起看，也像「夜星」才開始拉回。'
