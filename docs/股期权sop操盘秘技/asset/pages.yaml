  md: "# 9-3 大家一起來，團結力量大\n\n現在筆者將本書所介紹的各種指標做個總整理如下：\n\n# SOP方塊流程圖的指標與最佳指標\n\n+   -\
    \ 一、領先指標：共有四個指標。\n    - 1. 價乖離。\n    - 2. 軌道線。\n    - 3. RSI臨界值。\n    - 4. 技術指標二次背離。\n\
    \n+   - 二、股市三寶：共有三個指標。\n    - 1. K線。\n    - 2. 均線。\n    - 3. 45度線\n\n+   - 三、波段指標：共有四個指標。\n\
    \    - 1. 基本量、攻擊量。\n    - 2. 三線合一。\n    - 3. 長期趨勢線。\n    - 4. 技術指標雙底雙頭以上。\n\n\
    +   - 四、最佳指標：共有九個指標。\n    - 1. 島型反轉。\n    - 2. 缺口。\n    - 3. 45度線。\n    - 4. 三線合一。\n\
    \    - 5. 陡線。\n    - 6. 準領先指標。\n    - 7. 高爾夫球桿。\n    - 8. RSI乖離。\n    - 9. 技術指標背離或雙底雙頭以上。\n\
    \n上述指標合計20種，其中有三種（45度線、三線合一、技術指標雙底或雙頭以上）重複，因此合計17種。"
