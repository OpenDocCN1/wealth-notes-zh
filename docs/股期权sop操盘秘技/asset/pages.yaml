- pgno: 246
  md: '# **SOP的綜合應用 8**


    ![](img/82b5a2065ede8f02b3df34ec3fe6a9b2_246_0.png)


    # 圖（8-60）


    +   一、 上圖是日經指數月線圖。


    +   二、 圖中①所示，RSI、KD做出雙底交叉向上。


