  md: '# 股價SOP的應用（波段指標）


    延續茂迪這檔個股，當出現領先指標價乖離之後，股價拉回跌破45度線，完成下跌一賓，股價由「漲」進入「盤」。再跌破5日均價三天以上，股價形成「盤跌」趨勢。直到最後股價完成上漲波段指標的三個條件以上，才形成上漲波段行情，股價自27.7元漲到45.5元，可參閱圖（8-5）。


    # 完成上漲波段指標（三個條件以上）的出手點


    如圖（8-5）是茂迪的日線圖


    +   - 一、圖中①所示，長期下降趨勢線（2~3個月）三個月以上。


    +   - 二、圖中②所示，均線做出三線合一拉長紅。


    +   - 三、圖中③所示，出現攻擊量。


    +   - 四、圖中④所示，技術指標3日RSI做出三個底。


