    多年前因為小孩年幼故而退休，在閑暇之餘接觸到技術分析，雖經過多年學習且在投資理財道路上已累積了相當里程，但總覺得離自己理想境界相去甚遠。直到二年前，因緣際會接觸到陳霖老師的課程，剛開始只覺得其中有寶，卻不知如何著手，所幸老師又將出版這本《股期權SOP操盤秘技》，得知此事當下即興奮不已。因為有了《股期權SOP操盤秘技》就可把老師前面出版的幾本書彙整，成為條理分明、思慮嚴密的操盤教戰原則。經過不斷的研讀《股期權SOP操盤秘技》，再調整自身心態與作單習慣，勝率大增，信心也大增。


