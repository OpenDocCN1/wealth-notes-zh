- pgno: 89
  md: '# 上升與下降45度線的實例


    畫45度線對初學者是比較困難的，除了要設定K線圖的黃金矩形與K線的數量之外，最重要的是不知從何處下手畫45度線。原則上有三個重點如下：


    一、對於操作期貨的朋友，在每一波的低點或高點皆可畫45度線。因為期貨大都是短線或當沖操作。可利用突破或跌破45度線出手。


    二、若欲判定漲、跌、盤的轉折點，必須突破下降45度線之後，才能反向畫上升45度線，或是跌破上升45度線之後，才能反向畫下降45度線。


    三、畫線的技巧，盡量以不要切到K線（棒）為原則。


    45度線是股市三寶的「寶王」，它的應用非常廣泛，尤其運用在選擇權的成功率最高。期交所於民國101年11月「週選擇權」上路後，更可利用45度線的轉折點操作選擇權。


    筆者繼本書之後，會再寫一本《週選擇權獲利大解密》。其中就會多次引用45度線的轉折點操作週選擇權，您會發現成功率非常高。因此建議讀者應學會畫45度線。


    45度線的畫線技巧，在《股市三寶》、《期權賺很大》《45度線獲利祕訣》都有介紹，本書再度提示股市三寶與45度線的畫法，或許讀者會認為多此一舉，有重覆之嫌。但是筆者認為股市三寶是SOP的核心價值，尤其是45'
  merge: -1
  img_proc: true
- pgno: 90
  md: '度線是股市三寶中，成功率最高的。且其應用範圍也非常廣。若投資朋友沒看過筆者先前的著作，至少在本書可看到股市三寶的面相。


    「股有量、價、勢；勢有漲、跌、盤」，而股市三寶是判定漲、跌、盤的不二法門。其中45度線這一寶就可獨當一面，判定漲、跌、盤的轉折點。


    筆者就以大盤為例，畫上升與下降45度線給讀者參考

    如圖 (4-4) 是大盤指數日線圖


    +   一、圖中①所示，上升45度線的標準畫法。


    +   二、圖中②③所示，上升45度線缺口的精緻畫法。


    +   三、當K線跌破③之後，就可反向畫下降45度線。如虛線④所示。


    +   四、虛線④下降45度線，因為切到K線，因此圖中⑤所示，才是正確的下降45度線的標準畫法。


    +   五、圖中⑥⑦所示，突破45度線又馬上跌破45度線可視為騙線。


    +   六、圖中⑧所示，下降45度線小波段高點（頭部）的精緻畫法。


    +   七、圖中⑨所示，下降45度線缺口的精緻畫法。'
