  md: '# 選擇權SOP的應用（組合採取策略）買權多頭價差


    當您決定要做「多頭價差」時，首先必須研判指數到結算日是偏漲的趨勢，但是又怕上檔有壓力，漲幅不高，或怕做錯方向。此時可採取「多頭價差」。


    圖（8-49）是大盤日線圖。如圖中①所示，在102年4月19日指數跳空上漲，且均線做出三線合一向上。研判指數到結算日（5月15日）是「偏漲」的趨勢。但又怕前波高點3月11日（8089）的壓力無法突破。因此操作一組買權的多頭價差，履約價設定在買進買權7800，賣出買權8100。


    # 買權的多頭價差：買進買權7800，賣出買權8100。


    +   一、如圖（8-49）所示，102年4月23日在支撐區7800履約價買進買權（BC），在壓力區8100履約價賣出買權（SC）。


    +   二、如圖（8-50）行情表所示，4月23日當時買權7800履約價的權利金167點。8100履約價的權利金17點。


    +   三、如圖（8-51）行情表所示，5月14日結算日前一天出場。當日買權7800的權利金498點。8100得權利金202點。


    +   四、7800（BC）履約價獲利498－167＝331（點）。8100（SC）履約價虧損17－202＝－185（點）


    +   五、合計獲利331－185＝146點。'
