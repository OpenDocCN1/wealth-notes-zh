  md: '# 期貨SOP的應用（領先指標上升與下降軌道線）


    軌道線是畫線技巧中，最難畫的線。它不像頸線或趨勢線比較容易畫。筆者建議投資人多多練習畫軌道線。就有機會買在相對低點或賣到相對高點。


    當您買到每一波的相對低點，或賣在每一波的相對高點，就會覺得很有成就感。


    軌道線分為大軌道與小軌道，如何區分呢？


    大軌道：當您畫出的軌道線比較寬，是屬於大軌道。


    小軌道：當您畫出的軌道線比較窄，是屬於小軌道。


    # 領先指標（小軌道）的出手點


    筆者舉例如圖（8-22）期指日線圖給讀者參考


    +   一、圖中可看出A、B、C三點所畫出的是下降小軌道線。


    D、E、F三點所畫出的是上升小軌道線。


    +   二、圖中①所示，下降小軌道下沿7491是短多的出手點，隔天拉出長紅。


    +   三、圖中②所示，上升小軌道上沿7836是短空的出手點，隔天拉出中黑。


    # 重點提示：


    +   1. 小軌道的領先指標上下沿比較容易被突破或跌破。


    +   2. 大軌道的領先指標上下沿比較不易被突破或跌破。


    +   3. 領先指標若操作失敗仍應該停損規避風險。'
