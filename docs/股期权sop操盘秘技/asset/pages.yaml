  md: '# 8-4 國際金融商品(黃金、匯率…等)SOP的應用


    SOP除了適用國內的股票、期貨、選擇權之外，當然亦適用國外的金融商品，本節筆者分享幾個SOP應用在海外商品的實例給讀者分享。


    如圖（8-59）美股紐約道瓊指數日線圖


    +   一、圖中可看出道瓊指數由上升軌道改變成下降軌道，而上升軌道的上沿與下降軌道的下沿就是SOP的領先指標。


    +   二、圖中①所示，就是上升軌道上沿的領先指標，道瓊指數觸及上升軌道上沿賣出，可賣在相對高點。之後，指數開始拉回。


    +   三、圖中②所示，就是下降軌道下沿的領先指標，道瓊指數觸及下降軌道下沿買進，可買在相對低點。之後，指數開始反彈。'
