- pgno: 21
  md: '# 1-1 何謂股期權SOP


    SOP（Standard Operating Procedure）翻譯成中文：標準作業流程。我們知道任何一個行業，如製造業、服務業…等都有一套「標準作業流程」，簡稱SOP。


    對製造業而言，大到生產線的流程，如工作母機的操作。小至產品的品管…等。都有一套SOP，如此才能確保商品的品質。操作機器的技術人員，若照SOP操作，其安全性亦有保障。


    在勞工局所舉辦的職災防護課程中，可以看到很多勞工朋友受傷或是死亡的影片。大都是沒有按照SOP操作機器所引起的。換言之，「推高機」有操作推高機的SOP。「塑膠射出成型機」也有其操作的SOP…等。若能依照SOP操作，至少安全無虞。


    對服務業而言，也有SOP。SOP廣義的解釋也可視為「成功的操作系統」。如我們所熟悉的麥當勞、統一超商、85℃…等。他們都有一套成功的系統在運作，而每一家分店都複製成功的系統，因此每一家分店大都會賺錢。您是否發現台灣有很多知名的公司，要求其員工連接電話都有一套SOP，例如：接電話的員工拿起電話筒會說：「台大公司您好！我是王大維，很高興為您服務」。而且公司也會不定時派員以電話稽查員工是否按照SOP接電話。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 滅火器的SOP


    現在筆者舉個例子：滅火器的標準作業流程（SOP）


    滅火器的SOP：拉、拉、壓。


    +   一、第1個拉：是拉開滅火器的插銷。

    二、第2個拉：是拉起滅火器的噴管對準火苗底部。

    三、第3個壓：是向下壓即可噴出泡沫滅火。


    以上三個步驟就是滅火器的SOP。一定要按照先後順序才能讓滅火器成功的發揮效果。


    您會發現有人看到失火了，因為太緊張忘了第一個步驟：拉插銷，就猛壓。當然無法壓出泡沫。或者已經拉開插銷，而忘了第二個步驟：拉噴管。結果壓出的泡沫不是噴在火苗，反而噴在自己的腳下。由此可見SOP的重要性。


    言歸正傳，我們操作股票、期貨、選擇權或其他金融商品…等。亦要建立一套SOP。也可說是建立一套屬於自己操作的成功系統。每一個人操作方式或許不盡相同。但至少成功率要達到8成以上的水準，才可在股票、期貨、選擇權的市場中獲利。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 1-2 SOP是股期權的領航員


    SOP好比是港口的燈塔，他可以讓我們有方向感。筆者曾說：股有量、價、勢。勢有：漲、跌、盤。


    指數或股票只有三種趨勢：


    +   第一種：上漲趨勢。

    第二種：下跌趨勢。

    第三種：盤整趨勢。


    這三種趨勢亦可視為股市的方向。學會股期權SOP之後，就可非常清楚的看出股市或股價的方向。


    SOP亦可比喻成「導遊」。當我們外出或出國旅遊時，若有一位好導遊，我們就可隨著導遊所引導的方向很快的到達我們的目的地，如此可減少自己摸索的時間。


    SOP亦可比喻成衛星導航。若車上有了衛星導航就不會走錯路。而且可節省很多時間。除非衛星導航的品質不佳才會引導您走錯路。


    建議各位投資朋友們務必建立一套屬於自己操作股市的SOP。如此才能在股市立於不敗之地，進而成功致富。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# 1-3 SOP是股期權的避風港


    影響股市漲跌的因素非常多。整體來看，有三大面向：基本面、技術面、消息面。其中影響層面最大的是消息面。但消息面不是我們所能夠學習的。筆者撰寫本書時剛好遇到大陸爆發H7N9禽流感，再加上兩北韓情勢緊張，這些都是屬於消息面，無法事先預知的。


    而基本面是屬於落後指標，因為投資人無法取得上市、上櫃公司營運的第一手資料，若從報章雜誌所獲得的資料皆屬於二手資料。其可信度值得商榷。除非是大股東才有機會得到第一手資料，何況有些不肖公司會利用基本面利多宣佈時倒貨，不得不慎。


    因此我們只能從技術面學起，但技術面亦不可能百分百。只能盡量提高操作的成功率，以賺多賠少的操作手法累積財富。至於研判行情或選股技巧，可採三步驟。筆者建議先看技術面，再查基本面，解讀消息面，如此面面俱到，就可大幅提高勝率。


    由於技術面不可能百分百，因此我們才要建立SOP將勝率提高，風險降低。如果您還未建立自己的SOP，筆者強烈建議可參考本書所设立的SOP。如法炮製，必可大幅提高勝率，規避風險。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 建立一套屬於自己操作的SOP


    我們了解SOP的重要性之後，無論操作股票、期貨、選擇權的新手或是老手皆該設立一套屬於自己操作的SOP，然後按照SOP一步一步的操作，必然不會患得患失，而且可穩健獲利。


    筆者從事股票教學的生涯中，發現很多投資朋友之所以操作失敗，就是沒有自己的SOP。常常受到他人或消息面的影響，心無定見，做出錯誤的判斷，事後才後悔莫及。


    同時筆者也看到很多成功的例子，原來他們都有一套成功的SOP在運作。如何判斷行情、如何選股設價、如何解讀消息面…等都有一套SOP，難怪操作股期權非常淡定，獲利是必然的。


    技術分析非常浩瀚，各種門派、絕招比比皆是，對於初學者很難抓住重點。筆者特別把比較重要且成功率高的指標結合在一起，並按照順序規劃出五個方塊流程圖，作為自己操作的SOP。且分享給購買本書的每一位讀者。


    當學員們有了一套SOP之後，操作股、期、權的技巧就大幅提高，當然勝率也不在話下。目前就有很多學員已成為專業的投資人在股海中不斷的累積財富，完成人生所要的夢想。'
