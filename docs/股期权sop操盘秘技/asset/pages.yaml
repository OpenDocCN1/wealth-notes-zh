- pgno: 298
  md: '撰寫本書已接近尾聲，現在筆者就其使用的重點做個整理說明如下：


    +   一、 本書所介紹的20個指標皆可單獨使用，其中「領先指標」單獨使用的成功率最高，不過他是逆勢單，因此只能短線操作有賺就跑。


    +   二、 「股市三寶」的「波段指標」若單獨使用，則總稱為「最佳指標」。


    +   三、 波段指標必須在短時間內（3～5天或5～10天）完成三個條件才可預測形成波段行情。


    +   四、 「最佳指標」單獨使用成功率比「領先指標」略遜一籌，若能2～3個同時合併使用，則可大幅提高成功率。


    +   五、 無論是領先指標、股市三寶、波段指標、最佳指標，只要在同一天或1～3天同時出現2～3個以上，則成功率可高達8～9成以上，這就是「大家一起來，團結力量大」。


    有云：「一句話可以改變一個人」、「一本書可以影響一個人的命運」。但願本書能帶給目前仍在股期權市場操作不順的朋友轉運，反敗為勝，成功致富，再次為您祝福也再次感恩您購買本書，謝謝您。'
