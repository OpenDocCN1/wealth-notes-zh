- pgno: 42
  md: '# 3-1 價乖離


    價乖離是指大盤、期貨、各類股的指數或個股的股價與5日均線或6日均線偏移到多而稱之。若「正價乖離」偏移到多（漲太兇）指數或股價會向下拉回。此時可賣短或短空，有賺就跑，賺差價。反之「負價乖離」偏移到多（跌太兇），指數或股價會向上反彈，此時可搶短多，有賺就跑，賺差價。


    # 指數價乖離的參數


    大盤、期貨、類股價乖離的參數如下


    正價乖離：今日的指數大於昨日的6日均線相差正5～6%以上。


    負價乖離：今日的指數小於昨日的6日均線相差負5～6%以上。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 個股價乖離的參數


    # 大型股（股本100億以上）


    正價乖離：今日的股價大於昨日的6日均價相差正10~12%以上。


    負價乖離：今日的股價小於昨日的6日均價相差負10~12%以上。


    # 中型股（股本50~100億）


    正價乖離：今日的股價大於昨日的6日均價相差正12~14%以上。


    負價乖離：今日的股價小於昨日的6日均價相差負12~14%以上。


    # 小型股（股本50億以下）


    正價乖離：今日的股價大於昨日的6日均價相差正14~16%以上。


    負價乖離：今日的股價小於昨日的6日均價相差負14~16%以上。


    重點提示：價乖離僅適用在日線，其它不適用。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 指數價乖離實例


    如圖（3-1）是期貨指數日線圖


    +   一、指數在100年11月23日與24日出現負價乖離，經過一個交易日後，指數在11月28日反彈。若在11月23日、24日搶短多期指11月28日高出，就可獲利50～100點以上。


    +   二、指數連漲三天之後，在100年12月1日又出現正價乖離。隔天12月2日指數就開始拉回。若在12月1日短空期指，12月2日又可獲利50～100點以上。


    +   三、讀者可以將價乖離寫成程式式追蹤，就可印證價乖離的可信度。


    +   四、如圖（3-2）就是用程式繪出指數價乖離的圖形，上面兩條曲線是正5～6%，下面兩條曲線是負5～6%。若出現負價乖離，指數通常會在1～3日之內就反彈。反之出現正價乖離通常會在1～3日內回檔。


    # 重點提示：


    +   1. 領先指標有時會延續1～3天，最多不會超過5天。


    +   2. 因此當領先指標出現時老手可分批切入。新手則等第二天或第三天再切入，以避免短套。'
