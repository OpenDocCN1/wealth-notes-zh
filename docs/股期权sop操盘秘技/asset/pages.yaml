- pgno: 57
  md: '# 個股軌道線實例


    在筆者所開設的訓練課程中，有一堂課是「畫線技巧」。主要是訓練學員如何利用畫線技巧尋找壓力與支撐。畫線內容包括：頸線、趨勢線、扇形線、45度線、陡線、軌道線等。其中軌道線與45度線比較難畫。


    軌道線的上沿，下沿可以各畫二條，成為支撐區或壓力區。其他如45度線、趨勢線、頸線…等也可畫二條，成為支撐區或壓力區。這是活用畫線的技巧，不必拘泥於單畫一條線。


    # 台積電的上升與下降軌道圖形


    筆者列舉台積電（2330）個股的上升與下降軌道線圖形給讀者參考。如圖（3-9）所示。


    +   一、 圖中①②③所示，是上升軌道的壓力區。筆者特別畫了兩條壓力線。


    +   二、 圖中④⑤⑥所示，是下降軌道的支撐區。筆者特別畫了兩條支撐線。


    +   三、 您會發現當股價上漲時，觸及上升軌道上沿（領先指標）的壓力區，就會壓回。當股價下跌時，觸及下降軌道下沿（領先指標）的支撐區就會反彈。'
  merge: -1
  img_proc: true
