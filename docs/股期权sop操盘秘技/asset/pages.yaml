  md: '# 選擇權SOP的應用（組合操作策略）


    前面幾頁所舉的例子皆是單一操作策略，接下來這幾頁筆者再舉一些組合操作策略給讀者參考。


    組合操作策略的使用時機，在於「盤整盤」。換言之，上有壓力，下有支撐。指數區間大約在300點上下整理。此時可採取組合操作策略多空雙向操作。


    組合操作策略有很多種，本書僅舉常用的四種說明如下：


    +   買方：買進勒式，買進跨式。適用於大漲大跌的行情。

    賣方：賣出勒式，賣出跨式。適用於區間整理的行情。


    依筆者的經驗操作組合單，以賣出勒式的成功率最高，但先決條件必須確認大盤指數進入「盤整盤」。如何判定盤整盤？可利用「股市三寶」判定漲、跌、盤的轉折點。尤其是寶王45度線可精準的判定由「漲進入盤」或由「跌進入盤」。再加上量價關係就很容易判斷出盤整盤。


    至於買進勒式或買進跨式是以「賭」的心態操作。賭指數大漲大跌或在結算前幾天指數大幅震盪，賺取倍數利潤。尤其是「週選擇權」上路後，更有機會賺到買進勒式或買進跨式的利潤。筆者在《週選擇權獲利大解密》書中，會分享一些「賭」的訣竅，讀者可買一本閱讀必有所獲。'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 選擇權SOP的應用（組合操作策略）賣出勒式


    現在筆者列舉組合操作策略的例子印證SOP應用在選擇權的實例，給讀者參考。


    如圖（8-40）是大盤日線圖


    一、圖中①所示，指數在4月8日跌破45度線研判指數在短時間不會突破7954。因此在履約價7900做空（賣出買權）。


    二、圖中②所示，研判跳空上漲的缺口位置7717～7739。支撐力道強。指數雖跌破45度線，研判拉回到缺口位置可獲支撐，因此在履約價7700做多（賣出賣權）。


    三、如上逑4月8日同時進場操作一組賣出勒式的組合單，當時SC7900履約價的權利金44.5。SP7700履約價的權利金19.0如圖（8-41）所示（4月8日選擇權行情表）。合計收受權利金44.4＋19＝63.5（點）。


    四、圖中③所示，指數在4月17日（週三）結算日，SC7900履約價的權利金0.2，SP7700履約價的權利金0.2。如圖（8-42）所示（4月17日結算日的行情表）可賺全部的權利金63.5－0.4＝63.1（點）。


    重點提示：


    +   1. 操作賣方的組合單可同一時間進場，也可利用指數震盪時分兩次進場，或許可收到更多的權利金。


    +   2. SC（Sell Call）代表賣出買權，SP（Sell Put）代表賣出賣權。'
