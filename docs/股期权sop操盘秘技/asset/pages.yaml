  md: '# 10-5 嘉義學員


    # 熟練SOP以後，就可得心應手


    小時候看布袋戲大師黃俊雄先生所演的布袋戲當中，有一個老和尚，他學了很多的武功，但遇到壞人時，卻因為功夫學太多而不知道要用那一招，所以常常挨揍，需要旁人提醒他後就能反敗為勝。所以當陳霖老師應學員的要求，寫《股權期SOP操盤秘技》時，我的內心會然一笑。同樣的，當開始在學手排車時，一下子要踏離合器，一下子要入檔，還要注意前後左右，行進時緊急煞車，還怕熄火，真的是滿身大汗手忙腳亂，但這個過程一定要經歷，熟練以後，方向盤可單手操作，眼睛瞄一下，要做什麼動作都可得心應手。


    # 金融市場像填不完的錢坑，也像一座寶山


    當陳霖老師願意將這套有系統的操作方式分享出來，是讀者的福氣，市場中所謂的「老師」，當然也有好的，但比例不多，而有實戰經驗，勝率高又願意將賺錢的「傢私」（台語發音是工具的意思）告訴學員或讀者的老師就少之又少。曾經聽過一句話，金融市場像填不完的錢坑，也像一座寶山。電視、新聞、報章雜誌常常看到或聽到投資失敗的消息、家破人亡不勝唏噓；相對的也有不少成功的贏家，各個都有各人的本事，問題在於他（她）願意講嗎？就算他（她）願意講。那學的人又要付出代價又'
