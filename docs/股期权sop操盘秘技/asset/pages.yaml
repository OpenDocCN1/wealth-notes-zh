  md: "# 林序  \n  \n PREFACE\n\n因工作關係常接觸到不同類型的投資朋友，我最常問客戶的一句話就是：「您有沒有自己的一套選股方法和屬於自己的一套操盤SOP？」剛看到陳霖老師這本「股期權SOP操盤秘技」，我第一個反應是：「哇！這就是所有想賺錢的投資朋友要的SOP獲利密笈。」因為唯有能重複和貫徹執行的SOP才是穩定獲利的王道。\n\
    \n判斷買賣股票時機有SOP、找飆股有SOP、判斷漲跌盤勢有SOP、做期貨選擇權也有SOP，坊間上陳述的方法不外乎三種派別：1.基本面 2.籌碼面 3.技術面。有些是將這三種方法優先順序換來換去，或是特別強調其中某一方法再詳細著墨，甚至每天都有不一樣的SOP，搞得投資人不知道那一種方法才是屬於自己的SOP。往往花費很多心力，卻還是選不到好的股票，或是不知道怎麼進出場。其實，有個好用的SOP不但能幫助我們在最短的時間內做出「買進」「賣出」「持股續抱」或「不做動作」的決策，不被心魔動搖。\n\
    \n學好陳霖老師的SOP方法能讓您在面對盤勢變化時不會去猜、不會慌張，五個方塊圖功能中都有解答方法，STEP by STEP，如此簡單好用。領先指標、股市三寶又能提高技術分析勝率，又可選股又可預測行情走勢，波段指標、成功法則讓您進出有依據。投資朋友靠著這本「股期權SOP操盤秘技」必能趨吉避兇，輕鬆致富。\n\
    \n真心向讀者推薦這本好書。\n\n精誠資訊業務經理 林 暐 純"
