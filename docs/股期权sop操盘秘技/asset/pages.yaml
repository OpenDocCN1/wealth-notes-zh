- pgno: 151
  md: '# 8-1 股票SOP的應用


    第八章主要是談SOP如何應用在股票、期貨或選擇權。或國內外的其他金融性商品。前面1～7章筆者已有舉一些實例印證SOP的成功法則。本章再舉一些例子，強化讀者對SOP的信心。有信心才敢出手操作，好比會游泳的人才敢下水。


    現在大家再複習一下SOP的操作順序，也可說是操作邏輯，可回頭參閱第二章的SOP方塊圖，其操作順序如下。


    +   一、當我們打開技術線型圖的第一件事，先看第一個方塊「領先指標」是否出現。

    * 如果有：可少量短線操作有賺就跑。若不敢操作可觀望。

    * 如果無：進入第二個方塊「股市三寶」判定漲、跌、盤的位置。


    +   二、當股市三寶判定由「跌」進入「盤」或由「漲」進入「盤」，就可進入第四個方塊「成功法則」，並投入3～5成資金開始操作。


    +   三、當股市三寶判定是「漲」或「跌」勢，就可進入第三個方塊「波段指標」，研判是否有波段行情。


    +   四、當波段指標完成三個條件以上，就可進入第五個方塊判定其續航力道的強弱。'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 股票SOP的應用（領先指標與波段指標）


    剛剛所談的SOP操作順序務必謹記在心，且活用自如。如此操作的成功率就會大幅提高。只要成功率（勝率）提高，自然可快速累積財富。


    # 聯電的下降軌道圖形與波段指標


    筆者以聯電（2303）實例說明如下


    +   一、圖（8-1）是聯電日線圖。其K線圖表已設定畫45度線的規格。


    +   二、圖中①所示，出現下降軌道線下沿的領先指標。可搶短多有賺就跑。領先指標過了之後，就看股市三寶。在反彈的過程中皆未完成上漲一寶。因此指數反彈後仍然繼續下跌。


    +   三、圖中②所示，直到101年11月23日才突破精緻畫45度線完成上漲一寶。股價由「跌」進入「盤」。就可進入第四個方塊「成功法則」，可投入3～5成的資金操作。


    +   四、圖中③所示，完成上漲三寶，股價由「盤」進入「漲」。就可進入第三個方塊「波段指標」研判是否有波段行情。


    +   五、從圖（8-2）可看出圖中①所示，出現攻擊量。圖中②所示，均線三線合一。圖中③所示，MACD做出三底，研判有波段行情。就可進入第五個方塊「續航力道」研判其續航力道較強。


    +   六、股價由10元漲到12.55元很接近3成。雖不滿意但可接受。'
