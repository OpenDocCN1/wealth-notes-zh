    ## 软文投放量研究：


    2008年1-9月汽车投放网络软文篇数单位：篇


    ![](img/9c5a94eedde119b872450b830636a0d0_97_0.png)


    我们可以发现，2008年前三季度汽车共投入网络软文884070篇，其中乘用车的软文篇数占96.8%，商用车占3.2%；在乘用车中以中级轿车软文所占的份额最大，达四成多。这些产品每个月的软文投放量，数以万计；其中商用车各月投放网络软文篇数最少为6万多篇，5、6、7和9月均突破十万篇。


    进一步观察一下各大品牌对软文的偏爱：


    ![](img/9c5a94eedde119b872450b830636a0d0_97_1.png)


    ![](img/9c5a94eedde119b872450b830636a0d0_97_2.png)


    分品牌来看，仅东风汽车软文投放量就占到商用车软文总量的22.7%；乘用车中排名第一位的马自达软文投放量仅占乘用车软文总量的5%；这说明商用车的品牌集中度较高，乘用车市场的品牌竞争更加完全。


    在上述统计中，我们可以发现，东风、马自达、奔驰、奥迪、宝马等品牌对软文的偏爱，也是这些品牌在市场中长期占据市场领导地位的保证。其中，马自达、荣威、奔驰、奥迪、宝马等品牌这样的投放量是比较规模性的，数以万计。


    媒体对软文的投放也是比较重视的，2009年4月，《洛杉矶时报》在首版刊登软文，引发了全球媒体的关注。


    ![](img/9c5a94eedde119b872450b830636a0d0_98_0.png)


    《洛杉矶时报》在报纸首版刊登新闻故事形式的广告，为NBC的新电视剧《南方传奇（Southland）》做宣传。这篇软文位于《洛杉矶时报》头版的底部伪左位置，并配以剧中人物的照片，实际是一部即将播放的警察剧的广告。


    从上述研究中我们可以看出，软文的市场规模和发展是非常惊人的。一家企业，可能一年花一亿元用来投放软文，但不可能花一万元用来做SEO。软文本身存在强大的市场，你不需要向企业做任何解释，企业明白软文的作用，它也愿意花费巨资来投放软文，但是，如果你要向企业解释SEO，试图说服大的企业来做SEO，可能会浪费半天口舌，尽管花费很少，但企业还是不愿意花这笔钱。


    这里面存在一个已经形成市场还是未形成市场的困惑，软文已经有了强大的市场根基，但SEO没有这样的市场根基，SEO的发展存在不确定性，你无法预知10年后会怎么样，它也许有比今天更好的市场，也许会被搜索引擎彻底扼杀掉，你无法对它的前景做出准确判断。我们所知道的却是，搜索引擎不断地变更规则，让你看起来已经掌握的SEO技巧，到那间就不起作用了，你需要不断去迎合搜索引擎，搜索引擎的任何一次重要的技术变动，都对SEO可能是一次灭亡性的打击，让你变得忐忑不安。


    2009年12月27日 中国企业报第二版


    而企业家却不能不谙软文，如果不把大笔的预算花在软文上，这个品牌可能就会被对手压倒，因此它需要频频地在软文上花钱、再花钱。


    ## 从软文到软实力


    中国电视台（CITV）已于2009年12月18日开始试播，这个24小时向全球直播的新闻台是由新华社主办，致力于打造中国的CNN。中国电视台的方案最初提出以后，李长春批示，规模太小，要扩大档次，因此中国政府拟投入450亿元人民币来建立这个世界级的电视台。


    此外，除了《中国制造》的形象广告登陆美国有线新闻网(CNN)的美国频道、美国头条新闻频道和国际亚洲频道播放，引发全球和全国热议以外，中国也向欧美大陆超市投放30分钟的中国形象宣传片。“增强文化软实力，提升中国国家形象”已经成为下一时期中国政府向全球开拓的重要行动。


    抢占媒体制高点，抢占话语权，用软实力进取世界，已经成为我们这个国家当前极高的宣传战略。比如我们中国发生一件事，西方媒体会以他们的视角来报道，用西方的价值观来指责中国。还记得2008年北京奥运在全球传递过程中，在法国巴黎、英国伦敦、美国旧金山爆发的那些不愉快的事件吗？还记得“做人不能太CNN”这句话吗？因此在这些事件发生以后，中国政府所采取的措施就是全面提升国家软实力，不再一味相信西方媒体的报道，不再让世界只听到西方的声音，而是要建中国的世界级媒体，要用中国的观点来说世界。


    因此，我们现在可以给“软文”有一个更好的归宿，它归属于“软实力”的的范畴，而且是软实力最为重要的表达方式之一。中国人民大学新闻学院教授喻国明这样认为：“一个国家是存在两种实力的，一种是硬实力，一种是软实力。硬实力通常是指国家的GDP、硬件设施等，而文化、制度、传媒等被称为软实力。”20世纪90年代初，哈佛大学教授约瑟夫·奈首创“软实力”(Soft
    Power)概念，从此启动了“软实力”研究与应用的潮流。


    软实力是一种重要的能力，它是通过建立吸引力，引发别人注意到你，并尊重你。一个国家需要软实力，一个企业需要软实力，而如果想实现创业成功，软实力已经成了重要一环，正如约瑟夫·奈所言，“硬实力和软实力同样重要，但是在信息时代，软实力正变得比以往更为突出”。我们对此举一个例子，比如说我们强调军队的强大，并不一定靠打仗，而是反复去报道最先进的军事技术、展示那些领先兵器的图片，让它使劲地去传播，在任何人看来，你就是强大的。这就是软实力的强大功效，它启迪着人们的新思维，“软文”的运作，已经到了一个极高的战略高度。


    ## 软文与SEO的投入区别


    ![](img/9c5a94eedde119b872450b830636a0d0_101_0.png)


    图: SEO 与软文创造财富对比


    我们用两种主要网站推广方式 SEO 与软文进行对比，我们会发现，两者推广方式所获得的效果截然不同。


    SEO 是一种持续的推广方式，多数小型企业或小型网站尽管会获得了访问量，但这种财富增长速度是缓慢的。SEO 推广的成交率，通常为 0.2%-0.5%之间，即
    1000 个访问者中，会成交 2-5 个订单，必须将访问量放大 100 倍，收益才可能增加 100 倍，但访问量从每日一千 IP，增长到每天一万 IP，再增长到每天十万
    IP，对大多数人来说，纯粹是在做梦。


    软文是一种培增的推广方式。由于通过软文，容易取得潜在客户的信任，成交比率至少 1%，即每 100 个感兴趣的读者，至少 1%会成交订单。因此，在网站建立前期，成交率并不一定明显，财富增长速度比
    SEO 方式稍稍缓慢一些。但文章的写作数量一旦达到一定规模、一旦产生了影响力，一旦成为“出名的专家”或“著名品牌”，可信度将大大提升，相应的，订单成交率成倍增长。因此即便三年以后，网站访问量还仅仅维持在每天几百、一千
    IP，但财富增长是稳定的而且快速的。


    ## 用软文推广网站


    ## 明确你的网站名称


    用软文推广网站，网站名称直接关乎推广效果，由于中国互联网上，多数网站和论坛不许使用网址，因此网站名称的应用更为关键。


    1、创造一个关键词。让你的网站名称成为一个关键词，在用软文推广时，网民或感兴趣的用户可能用网站的名称直接在搜索引擎中进行查找。但是在推广前，必须做一些准备，确保你的网站名称在搜索引擎中几乎没有搜索结果，或者能够排名第一位，否则别人无法快速使用你的网站名称找到你的网站。示例：开心网、开心农场、创新工厂、卓学管理学派等都均可能是一个新的关键词，通过制造软文，让人们进行搜索。


    2、创造一个简称。用单词、字母进行组合的名称，有时也便于创造搜索结果，字母长度最好不宜超过五个，或者字母与数字进行组合。例如：EHT800、SEO、CCTV、CCNIC。


    3、使用通用名做为网站名称。这类网站名称，通常使用某某网、某某站，由于这类名称本身由热门关键词组成，利于在搜索引擎中的排名，但是如果搜索引擎上已经存在同类网站名称时，则不易使用。示例：站长网、站长站、公司网、跨国公司网;或者使用“名称+属性”，如卓学创业网、三五域名网、长江威容网等。


    4、用软文制造影响力。这类网站，一般用软文推广的不是网站，而是有意地让大型门户网站、专业网站和媒体来报道该网站，使该网站看起来更可信、更有地位、更有声势，利于让客户信任、进行融资或上市等活动。你可以观察到有许多网站都有“媒体报道”这一栏目，或者将媒体报道提至网站首页，以便让访问者确信。采用这种推广方式，对网站名称没有太多要求，适用于任何网站名称。


    总体而言，用软文推广，一般很少使用比较热门的搜索关键词做为网站名称，比如创业网、鲜花网、周公解梦，叫同样网站名称的网站数以百计千计，它过度依赖搜索引擎，没有必要用软文推广。


    ## 用软文推广网站的优势


    一些典型的软文推广网站的优势包括：


    促成更多的销售


    持续让客户产生信任


    永远不必担心网站链接数量


    从多个收入源头产生多种产品


    成为一个领域的专家


    快速增加搜索结果数量


    增加重复访问者


    带动搜索关键词检索量上升


    没有广告费用


    引发记者来采访你


    建立你的商品品牌


    ## 用软文推广网站


    对于中小用户，用软文推广网站，多数则致力于锁定一些关键词，围绕这些关键词产生内容。由于该系列软文在网上进行了快速扩散，因此在一定领域影响了网上的读者。比如，“软文”这个词，你在网站查找相关的网站内容时，从这些网站上可能都会阅读到“朱则荣
    软文”，可能有一百个涉及“软文”的网站或频道，那么这些网站或频道上，都会出现你。


    今天的互联网，尽管信息量庞大，但大家都缺原创的文章，因此你撰写的无论涉及某一方面，都可能有数以百计的相关网站联合转载。一旦你在写，并有意地进行传播，那你的内容就是有目共睹，它拥有潜在的被客户信任的价值，它所产生的是“捕捉客户的诱饵”。


    比如你是一个“管理培训”的经销者，当你写一篇关于“管理培训”的文章时，发表在网上，别人认为重要，就会进行转载，大约在三天至一周内，这篇文章就会在数十个甚至数以百计的管理网站、商业论坛中出现。当有人想了解管理培训，或参加管理培训时，他认同你的观点，他认为你是专家，就会通过文章中的链接，或者在网上搜索你的名字(网站名称)来寻找你。给你自己创造了很多资源合作、客户接洽的机会。而大量的撰写，则会创造大量优质的客户，他们怀有目的而来，对你的产品感兴趣，或者愿意花更大的代价来购买你产品，他们甚至会提供很多一起合作开拓市场的机会给你。


    有些文章的网站则允许在你的文章中包括 HTML 链接、简要的介绍。特别是网上有很多专家专栏的网站，一般都会在专栏介绍中为你提供链接，这些链接质量通常比较高。你可以利用这些链接，为你的网站增加重要的反向链接。当然，如果你不是专家，他们通常不会给你增加链接。


    你可以这样想象，把网站建好，然后去写成百上千的软文去推广它。我们可以举一个例子，有一位创业者开发了一款软件，开发完成以后，他就开始频繁地到各大学、协会去做演讲，每

