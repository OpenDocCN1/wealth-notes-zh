    ## 软文标准件


    ## 关于软文标准件


    软文写作，按流程分为三个阶段：


    - 1、零打碎敲阶段：有一篇没一篇，想起来写就写，想不起来就不写，急了就多写，不急就少写。

    - 2、手工作坊阶段：专写文章，来料加工，来一个订单，做一件产品，一个人从头干到尾，没有专业分工和规模定制。

    - 3、规模生产阶段：制作各种写作模板、标准套件、文章建档，存在专业分工，有人专管收集素材，有人专管查实资料，有人专管改写拼装，有人专管媒体分发，流水线化作业。


    而软文标准件，就是应用于软文的规模生产，将所需要的各种素材定制成模块化的标准件，通常对各种模板的组合搭配，软文口径统一，文章千变万化，成批生产，不再是干巴巴的几篇公司和产品介绍文章。


    ## 软文标准件的组装


    大型公关公司和大型企业的内部新闻中心，通常都是软文工厂，其主要工作就是组织稿件。文稿的“标准件”是把企业给外界说的话统一起来，分成几块，包括企业历史、文化，产品介绍，企业荣誉和市场地位、规划等等。当需要时，通过对各模块的组合搭配，写出不同的文章。


    软文标准件的生产源：


    - 1、领军人物


    领导人物的传奇经历、简介、以前业绩、过去经历、公益事件、动态，较为重点的是其思想主张、观点与看法、经营思路与管理方法，都是软文极佳素材。成名人物本身就是企业强大的卖点，往往先有社会活动家，后有企业家，特别是同行业竞争中的企业，哪一位领军人物在媒体面前出现的次数多、频率高，那么哪一家企业更受欢迎。此外，有独立思想主张和独特见解的专家学者，更容易以个人影响力带动企业发展，“人”是活生生的，“人”的思想是有启发性的，“人”是容易受到崇拜、追捧与信任的，因此，由于一个人的成名而带火一家企业甚至带动一个行业都是显而易见的。


    - 2、产品


    产品的说明、新技术、新创意、新材料、新应用、新思路、新市场，有若干不同侧面，可以从设计者、生产者、经营者、销售者、代理商、用户以及售后服务人员、维修人员那里得到广泛的原始素材，特别是新产品的应用技巧、应用领域、使用窍门解决等方面，都有大量的闪光点。例如：某公司开发家用机器人，这个消息就容易引发媒体争相报道，而一些地方产品如“信阳毛尖”相关企业的动态，也容易引发媒体报道。


    ## 3、行业地位


    拥有行业地位的企业、行业中新兴的明星企业、拥有行业著名专家或明星人物的企业、拥有特殊实力与背景的行业企业、拥有独特定位和经营特色的行业企业，都是行业媒体的报道重点。越是倍受关注的企业，越容易成为报道焦点，其一举一动都被媒体所关心，企业要抓住这一特点，尽可能在行业间成名，让自己企业品牌被媒体所熟悉，软文操作人员更要抓住媒体的这一特点，及时将一些行业内的动向、资料编成软文，提供给媒体，借以宣传自身的企业。


    ## 4、事件


    有些企业本身并不引人注目，但是其发生的事件却很有新闻价值。例如借势打力，内地某小型企业突然被某跨国公司兼并，因为媒体对跨国公司的关注使得这个小公司也倍受关注。当这类事件发生时，企业应及时与媒体联系，借媒体之力，把企业要说的告诉大众。


    ## 5、活动


    有特点、有影响力的活动大都会引起媒体的关注和报道。例如企业投资赞助某科学实验室、赞助一批学者的研究等，赞助某个乡村解决吃水难，可圈可点且又特别独到，会成为媒体报道的重点。


    ## 6、企业管理方法


    企业的经营管理方法是企业的最佳传播方式，各大经济类、管理类媒体不断举办管理案例大奖、广泛鼓励管理者撰写文章、论文，事实上已经给予了软文作者最佳的传播平台。无数专家、学者、企业家都是从撰写管理评论、进行管理分析、研究管理方法的角度成功成名的，由于经济管理类读物的读者，往往都是企业家和企业中高层管理者，决策性强、团购性强、商务合作意愿高，是软文作者和企业打入市场的最佳角度。


    ## 制作软文标准件


    软文标准件不仅是企业，更是软文作者的常备武器。对企业而言，制作标准件，能够保证对外宣传口径一致，帮助写作人员快速写作，应用好企业的更多宣传素材。作者使用标准件，可大幅提高写作效率，快速增强写作水平。


    标准件一般以下列标准模块组成，务必分门别类，单独存放，使用简洁。


    1、企业史：自企业成立以来的简史、荣誉史、史料、历史档案、大事年、企业志、年报、具有里程碑意义的阶段和往事、变迁史，自企业创立以来的老照片、老员工感想、感人故事、遇到困难与挫折和如何克服、如何改革、抓住机遇等等。


    2、重点人物：包括公司的董事长、总经理、在公司发展中举足轻重的人，他们的经历、观点、故事、转折、历程及活动记录等。


    3、企业情况：包括企业规模、人员规模、成员企业、客户分布销售网络及售后服务网络、部门情况、代表企业、研究报告，各类文件、通知、规范与资料。


    4、企业人物：企业代表人物、专家、楷模人物、历次先进表彰名单、自学成才人物、部门管理者等。


    5、产品：产品的技术、材料、变迁、生产流程、功效、销售、应用、代表客户等等，与产品设计、生产、经销、售后服务过程中所发生的故事。


    6、市场：市场分布、市场特点、市场研究、消费者研究、市场规模等。


    7、企业规划：企业远景、一段时期内的目标、战略发展方向、计划等。


    8、管理方法：管理设计、企业文化、管理理论、经营模式，独特的经营管理策略、管理经验等，重点是管理流程改进的探讨、管理方法的实施案例、优秀经验与做法。


    9、观点与数据：企业中经营者、管理人員、服务人员等所表达的主张、观点、看法，统计数据、总结、计划等。


    10、图片、影片库：如企业CI、标志性建筑、办公场景、重要事件场面、产品包装、广告图片、销售网点实拍照片、人物照片等。


    标准件的收集，一是建档，二是有意识地平时收集整理，三是灵活组合应用，四是在企业秘密保护原则下展开。


    ## 例：某酒店常备宣传资料


    应常备如下几种宣传品：


    - 1、酒店宣传小册子，折页及其他综合性介绍材料。

    - 2、酒店餐饮活动的宣传品（包括以前和现在的）。

    - 3、酒店餐饮设施介绍性材料。

    - 4、酒店宴会和会议的专门宣传品；

    - 5、酒店销售部的主要促销材料。

    - 6. 酒店集团管理以及其他连锁酒店的简要宣传材料。

    7. 酒店新闻稿（配照片）

    8. 有关宣传酒店的简报资料。

    9. 酒店简介性质的录象带;

    10. 全套酒店照片资料（含幻灯片等）。

    11. 店徽，店标的软片、样片（含广告的软片和样片）和不粘贴等类似物品。

    12. 酒店接待著名人士，重要活动等方面的资料和照片。


