    趁我们到底做了多少努力，已经写了多少文章，已经为推广尽了多大力，因此要把力气集中在写作本匀问题。但是，我们的站长们，却喜欢太多的偶然性，比如一篇鹏章偶然转载的比较多，带来了不少流址，比如偶然某个重要网站上有你一篇文章，站长们太关心这种偶然，夭天都在守株待兔。弄实上只要你努力写，努力写好文章，一切都是必然。


    # 技巧十二：看起来象个专家？


    无论你是不是专家，或者仅仅是某个知识领域的初学者。在撰写文章的时候，必须要多查阅相关知识，多方学习，你写出来的文章，一定要尽可能让人感觉到，你是那个领域的专家。


    # 技巧十三：相互索引


    文章通常不是单篇的，而是希望让它们相互串联起来的。比如：我们会在文章的结尾中出现更多关于写作的技巧：


    如何提高写作技巧


    文章有说服力的三个秘密


    通过这样的链接，我们又把读者吸引到你写的其他相关的內容上去，让他去阅读。


    # 技巧十四：定时整理旧文


    每隔一段时间，我们会把旧文章重新索引一下，再提出来。


    如：如何开公司


    选择合适的商业结构：


    你该注册成独资企业、合伙企业，还是其它形式的公司，各种公司类型又有什 么特点，你该如何注册？


    如何找到开办资金：


    在开始建立公司的时候，你需要一定数量的资金，绝大部分创业者在开始公司时，不可能获得银行贷款或资助。所需要的种子资金，只能来自于个人积蓄、通过从朋友、家人借款解决，或者采用其他手段比如以货易货。


    通过这样的索引，把旧的文章重新整理出来，加上链接，让它再次发挥作用。'
