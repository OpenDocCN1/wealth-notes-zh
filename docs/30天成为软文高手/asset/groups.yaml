    ## GOOGLE 媒体策略：垄断媒体引发扩散


    GOOGLE 自称自己从不刊登广告，靠网友间的影響力传播，但实则，GOOGLE 的媒体策略有着明显的人为操作痕迹。例如 2003 年新浪科技频道上，在国际IT新闻中，每十篇中至少有七篇是关于
    GOOGLE 的报道，他们以大笔的金钱砸开各种主流媒体，然后大大小小的网站转载抄袭，很多人 在网上写东西的时候，就不由自主地在文章中引用 GOOGLE。再比如
    GOOGLE 的产品推广策略，其产品五花八门，这些产品都被放在实验网页上，任由人们去使用、评价，互相介绍，然后从中找出热门产品。再其次：GOOGLE 善于制造神秘，故意制造出一些概念，引发人们去猜测、讨论。


