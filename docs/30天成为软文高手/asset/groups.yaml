    ## 事件软文的特点


    事件软文是策划的结果，并不需要你写，而是要让大家写，大家评，由此形成强劲的影响力。


    事件软文是怎么“出笼”的


    有一年北京图书展，有几个来自贫困山区的孩子，在展会上出售家乡的土特产，5元一份，希望人们借此筹款帮助贫困山区的学校购买一些图书。许多人纷纷慷慨解囊，予以支持。


    部分媒体的记者嗅到这一消息，也纷纷予以报道，但是几乎所有的媒体，都从“献爱心”的角度进行报道。某记者展开了思考，是谁让他们在这里摆摊的？是谁从贫困山区把他们送到北京的？这些孩子的举动是真的还是假的？如果是假的，幕后又是谁在操纵？……


    当这位记者思考到了这一连串的问题以后，就以“某某事件”为题，进行一系列的追踪报道，以图捅开真相。新闻发出以后，引起了强大的社会反响。


    ## 事件软文写作指南


    + 1、注重策划和持续报道，重点在于引发媒体和社会公众的广泛关注。

    + 2、并不需要你写多少文章，要广泛地调动许多人去写、去评论。

    + 3、转载传播率极高、影响力极大。

    + 4、事件可以是反面的，也可以是正面的，比如 IDC 的“断网事件”等等，可大可小。

    + 5、文章是系列的，是持续的，也可以在网站上制作专题，加大事件的影响力度。

    + 6、成名是迅速的。


    ## 名家软文


    ## 什么是名家软文


    名家软文：以名家、专家的名义，打响个人品牌。


    样例一：


    ## 厉以宁：政府要让中小企业活起来


    全国政协委员、经济学家长以宁在接受采访时指出，中国不管是保八还是保经济增长，最根本的目的还是要解决失业，而只有让中小企业活起来，才能真正解决就业问题。


    厉以宁指出，中国4万亿元经济刺激计划的投向主要是支持大企业，这不能完全解决就业问题。应当有相当一部分用来帮助劳动密集型企业，而这样的企业大部分是中小企业、民营企业，他们才是解决就业问题的主力。


    大批资金注入投资领域、基础建设领域，对长期经济发展是有好处的，但对解决就业的帮助不大。据北大光华管理学院调查，现在大部分回乡的都是30-40岁的人，所以目前的重点是解决这部分人的就业问题。让他们就业的办法就是要让劳动密集型企业、中小企业“活”起来，吸收他们上岗；或者给他们小额贷款，开小店、小作坊。


    对于“经济刺激计划是否会造成未来产能过剩”的问题，厉以宁回答说，“这种担心是有必要的，所以国家的投资一定要看效益”。


    样例二：


    ## 马云：创业就是一种赌博


    马云说：“今天很残酷，明天很残酷，后天很美好。大部分人会死在明天晚上”。


    绝大多数创业企业的失败，都可归结于两点：


    + 一是低估了可能存在的风险，尤其是安全的风险。

    + 二是高估了自己的能力、商业价值以及成功到来的时间。


    当我们认识清楚这一点，就应该更清楚地知道，创业本质上其实就是一种赌博，而要博得收益最大化，就不能只依赖良好的愿望，完美的计划，以及虚无缥缈的运气。大部分时候，计划是靠不住的，愿望总是被现实摧残，而好运气来得比你想象得要晚。


    ## 分析：


    以上两则样例，都是以人名为中心，以个人品牌的方式撰写软文，通常不断地撰写，容易在全社会或某个领域产生巨大影响力，名气的背后就是财富。


    样例三：


    ## 朱则荣：站长培训调查折射网站知识硬伤


    毕业课堂创始人朱则荣：我国站长界对知识的学习需求是极其旺盛的，这本身非常好，但是，培训也反映出一些集中和突出性的问题，折射出网站知识普及中存在的大量硬伤，这是今后需要加快弥补和知识更新的重要环节。


    硬伤一：技术开发与培训，都不重视新手引导策略。

    硬伤二：熟练个人技巧掌握，缺乏宏观发展思想。

    硬伤三：知识雷同严重，站长往往将某一种知识当做“救命稻草”或“摇钱术”。

    硬伤四：网站培训没有形成有效机制。

    硬伤五：网站知识短时间内难以形成“网站发展能力框架”。


    ## 名家软文写作特点


    要做企业家，先做社会活动家，要经营成功的企业，先打响你的个人名气，再重复一遍：名气的背后就是财富。


    “大学之所以大，不是因为高楼大厦，是因为里面有大师”，在营销企业品牌和推广网站时，有很多人只注意了自己的公司名称或企业产品本身，或者自己的网站是什么，以这种名义写软文，无论是发表在论坛还是网站上，都很容易被直接“删除”掉，因为大家都认为，你这可能是广告。


    但是，以人名为中心，打造名家或专家形象，没有人认为你发的是软文，都认为是名家观点或专家建议，所有的网站和媒体欢迎这些“名家”和“专家”的到场，只要你说的好，所有的编辑都会给你“头版头条”、“全站推荐”，就像
    Admin5 上的头版头条，那个极大的 AD 就是你，远远比在 A5 上面花钱打广告的影响力还要大，作用还要强，而且还不花钱。


    ## 名家软文的好处


    + 1、 以“个人品牌”为中心，旨在打响个人影响力。

    + 2、 重点在于观点，与众不同的观点、直截了当的观点、吸引影响的观点、力透纸背的观点。

    + 3、 影响力大，转载传播率高，成名迅速。

    + 4、 搜索引擎中，一搜索你的名字，会出现数千数万的搜索结果，每天都有一些网友在网上查询你的资料和观点。


    ## 热门软文


    ## 什么是热门软文


    热门软文，是围绕热门话题、热点新闻、热点事件、热点话题所撰写的文章，以评论、追踪观察、揭秘、观点整理、相关资料等方式写作的软文。


    样例一：


    ## 天天时评：神木坚守免费医疗是最佳的答案


    寂寂无闻的陕北小县——神木，由于在全国率先推行“全民免费医疗”而声名大噪。这一惠民政策实施近3个月来，伴随着不少的质疑之声：该县财政实力能否支撑下去？会不会是一个“乌托邦”？甚至还有人怀疑当地官员作秀。对此，神木县委书记郝宝成给出了这样的回答：财力不是问题，外界所说的压力无从谈起，免费医疗政策将坚定不移地推行。


    在看病难、看病贵的现实中，人们对这突如其来的幸福有些措手不及，难免产生不真实感。何况，一直以来萦绕国人耳际的，总是“医疗投入不足”、“财力有限”之类的消极语语。现在，神木县官员颇为自信的回答，有理由让我们扭转质疑的方向——神木县能够做到的事儿，为什么其他地方做不到？


    神木县的医改告诉人们，所谓财力不济之类的借口，并不适用于民生工程，关键还得看执政为民的决心。如果每个地方都像神木县那样步伐一致地行动起来，医疗改革遇到的困境与质疑自然会少得多。实践证明，通过“基本医疗保险基金+合作医疗基金+社会募捐资金+财政拨付资金”来解决百姓免费看病问题，是行之有效的。不仅仅是那些经济发达的地区应当从神木县的经验中受到启发，经济欠发达地区同样可以从中领悟改革的内涵所在。


    样例二：


    ## 大洋网：甲型 H1N1 流感症状


    甲型 H1N1 流感症状：


    甲型 H1N1 流感的症状与其他流感症状类似，如高热、咳嗽、乏力、厌食等。另有报道说，此次美国发现病例的主要表现为突然发热、咳嗽、肌肉痛和疲倦，其中一些患者还出现腹泻和呕吐症状；墨西哥发现病例还出现眼睑发红、头痛和流涕等症状。


    临床症状：


    人感染猪流感后的早期症状与普通流感相似，包括发热、咳嗽、喉痛、身体疼痛、头痛、发冷和疲劳等，有些还会出现腹泻或呕吐、肌肉痛或疲倦、眼睛发红等。


    部分患者病情可迅速扩展，来势凶猛、突然高热、体温超过39℃，甚至继发严重肺炎、急性呼吸窘迫综合征、肺出血、胸腔积液、全血细胞减少、肾功能衰竭、败血症、休克及
    Reye 综合征、呼吸衰竭及多器官损伤，导致死亡。


    易感人群：


    患者年龄绝大多数在 20 岁至 45 岁之间，属于青壮年。


    样例三：


    ## 朱则荣：SEO 永远不是主角


    注意：全北美一年的 SEO 支出只有 14 亿美元。据 SEMPO，在 2008 年度：付费排名的广告支出占 88%(约$119 亿美元)，自然排名优化支出占
    11%(约$14 亿美元)，搜索引擎营销技术支出占 1.1%(约$1.4 亿美元)。需要注意的是：SEO 的支出，较 2006 年的 11.8%出现下降。


    针对这一数据，管理科学家朱则荣表示：


    中国国内对 SEO 过度追捧的时机已过，SEO 只是网站营销的方法之一，并非其全部，应该理性对待这一问题，除非作为一种求职或升迁的职业或个人兴趣来专业发展
    SEO，不建议网站经营者过度沉溺于此。


    网站营销需要的是全方位的综合思考能力，包括网站策划、网络广告投放、付费排名搜索购买、软文宣传、产品演示页、互联网消费心理学、电子商务等一系列的综合知识与能力，SEO
    仅占其一，即便是发达的互联网公司中，SEO 最多仅是一个部门，有志于互联网发展的人士应该厚积薄发，研究更多领域的知识，广泛拓宽思路。


    应该明确一种观念——“没钱做 SEO，有钱雇人去搞。”有些知识只需要简单了解，没有必要作为专门主攻的知识领域，SEO 就是这样一种没有必要过多精力的领域，单纯发展
    SEO 不可能造就成功的公司，因为它根本没有强大的市场基础，稍有资金的人和企业，会考虑“用钱去砸广告”，钱生钱永远是经营的主调，除非经营遭遇困境或出于战略考虑，很少有人会采取“免费”的方式来实施营销，实践证明，总是过多考虑“怎么不花钱”的人和企业，不仅没有长远发展可言，反而大多都是陷入困境、或需要日日反反复劳作的小经营者，这种思维局限不突破，发展——很难。


    ## 分析：


    上述三例文章，都是围绕热门事件或热门话题所撰写的评论和知识汇总。第一篇围绕了热门新闻“免费医疗”进行了评论，第二篇围绕了“甲型 H1N1 流感症状”这一热门事件的主要关键词进行，在该事件爆发以后，“甲型
    H1N1 流感症状”成为搜索引擎热门关键词，而第三篇，则是围绕“SEO”这个热门话题。


    ## 热门软文写作方式


    1、紧跟新闻事件，全社会每天都可能发生一些热门事件，而各个行业领域比如互联网，每隔一段时间同样会出现一些热门事件，在百度新闻频道首页，公布最新“新闻热搜词”，如：“高考作文题、法航失事、重庆营救矿工、公交安全锤、悼念罗京、余秋雨回应假捐款、四川裸体浴场、巢湖买官、色戒原型、梁洛施儿子身家”。围绕这些热门关键词撰写和整理相关评论、知识，或制作专题网站内容，都很容易提高影响力，获得一定访问量。


    2、注意百度搜索风云榜，会出现最新搜索热点，分为“今日上升最快”、“一周热点”、“热门搜索”，如一周热点有“艳照门 16114、百慕大神秘三角 4268、成都公交车事故
    62822、李光洁劈腿 4231、刘亦菲照片 48137、腾中重工 2922、于小伟照片 4097、恋爱写真 3471、手机实名制 4156、蓓佳春 1533”


    3、注意百度和 Google 的相关搜索，例如围绕“软文”这一关键词，会出现“什么是软文、软文广告、软文营销、软文推广、软文写作、软文发布、房地产软文、软文网、软文范例、什么叫软文”，而围绕“软文写作”关键词，又有“软文写作工具、软文写作范文”等相关搜索，围绕“软文营销”关键词，又有“网络营销软文、软文营销案例”。


    ## 热门软文的好处


    1、第一时间从互联网上抓取流量。伴随新闻热点的巨大搜索量，相关评论、相关知识将在第一时间获得转载、搜索。有些热门词，可能将持续很长一段时间，例如围绕中国制造航母，随着新闻事件的推动，一旦有任何“风吹草动”，搜索“航空母舰”的人立即增多，因此，可提前建立相关专题网站，组织编撰相关软文。


    2、可以获得广泛关注。观点独到的评论会在第一时间获得广泛关注及转载，特别是许多评论人及独特的网站，可能因此风生水起，所谓“一言以兴邦”，获得广泛的影响力。例如军事评论家张召忠，凡是涉及军事热点新闻，每次必评，因此一举成名，而股评家、足球评论家、曲艺评论家等等领域都是名家必出的领域；大型媒体和记者都喜欢结交这些有独特观点的评论人，在新闻事件发生的第一时间，会邀请、采访这些评论家，征询他们的意见，报道他们的看法。


    3、容易获得直接的经济收入。例如一本围绕《耶稣受难记》的电子书，售价 18.9 美元，只不过是围绕《耶稣受难记》这部电影，编写整理资料，放在 ebay 里出售，第一时间追赶这部电影的狂潮。


    www.zhuoxue.org


    ## 通讯软文


    ## 什么是通讯软文


    通讯是最常用、最常见的写作方式，主要用来报道消息、动态、人物。企业和组织、报刊及电视一般都建有通讯员队伍，用来进行基层报道。


    样例一：


    ## 卓学课堂：推出气候变化主题网站


    卓学课堂最近推出了一个综合介绍“应对气候变化问题”的主题网站，以使公众更加便利地获得相关知识和信息。


    这个网站网址是 http://www.zhuoxue.org。登陆这个网站可以获得国际社会及中国对气候变化问题的努力、相关报告和资料。近年来，气候变化日渐成为全球关注的问题，很多商级别的国际会议都将气候变化列入讨论日程。


    样例二：


    ## 社交网站组织用户参与线下活动


    社交网站 Going 网站目前组织了两场集会。他们的集会吸引大批年轻的专业人士，让具有相同爱好的行家上网联谊，同时七嘴八舌对商家品头论足，例如批评那家餐厅的侍者态度差、食物难以以下咽。一位参加者称：‘...很高兴，我们能如此一拍即合，踊跃参加表演或一起聚餐’。


    Going 网定位为一种“社交活动行事历”(social-event calendar)，架起各种社交活动信息，并鼓励会员事先透过网络互相接触，并且让他们上传活动的照片和描述。Going
    网站提供更丰富的行事历功能，以便会员举办各式各样的联谊活动，从烤肉节到慈善募款活动，不一而足。


    样例三：


    ## 我们寻找一种精神——叫“敬业”！


    ——记公司五一劳动者荣誉称号获得者：朱志宏


    “呀”，眼前景稍一黑，朱志宏觉得眼睛里好像跳进了个东西，他下意识地揉揉眼睛，有点痛，再揉揉，稍稍好了一点，不过，似乎还是有东西在里面，感觉总是不舒服，但是现在是
    4 月 30 号的晚上，赶着加班，捉拄样件要的很急，这个时候容不得多想，赶工要紧。一丝丝的酸痛隐隐而来，但现在不行，朱志宏把手头的工作更加重要，在他看来：工作任务大于一切。他偶尔揉一揉眼睛，以试图减少那丝痛苦，实在不行，就强忍着。


    一晃几天过去了，朱师傅感觉眼睛有些模糊，似乎看不清东西，而同事也发现他的眼睛有大块血丝。“朱师傅，快去医院看看吧”，“我手头现在还有工作，等不忙的时候再说”，“快抽空看看，别感染了什么，影响了视力”。在同事的一再劝说下，朱师傅答应不在耽误工作的情况下去医院检查一下。医生说表示：“铁屑已在眼睛里生锈了”。


    朱志宏是生产车间的师傅，原在爱默生工作 6 年，随着公司的发展跟随到宯泰和公司，一直在公司从事设备维修、保养工作，他不太爱说话，但为人特别好，在维修机器方面有自己的
    一套。在与机器打交道的 8 年时间里，他每天用最热忱的心来干工作，奉献于事业。在工作中，朱师傅一惯任劳任怨，兢兢业业，他常常关心帮助其他操作员，尽管他自己不爱说话，但对同事的需要有求必应，很受大家欢迎，一有困难，大家就想到他。


    朱志宏师傅踏实能干、勤勤恳恳的精神，鼓舞着身边的每一个人，鼓舞着公司每一位员工，在今年五一的时候，朱师傅被评为公司五一劳动者荣誉称号。“留泰和的人文文化让我有家的感觉”，朱师傅说：“希望与宯泰和一起共同发展壮大”。


    ## 分析：


    上述样例中，例一、例二均是网站通讯，报道网站的最新动态、活动，无论是企业还是组织或网站，增设一条生产线，安排一个考察团外出、举办了一些篮球联赛，增加了 一个栏目，都可以报道。例三是人物报道，报道集中于一线那些接近普通最平凡的人物，树立学习典型，鼓舞士气。如果是网站，也可以报道一些典型的用户。


    ## 通讯软文写作特点


    通讯是一种细小、深入又普遍的报道方式，它要求报道周围的人、周围的事。


    “做了要说，而且一定要说出去”是通讯的重要特点，在大型企业，党政的宣传部工作中，通讯占据了最大的工作比例，内部报纸、广播、电视等企业内部媒体，就足用来采写和报道通讯的，企业中的通讯员也会不断地写各种通讯稿件寄发各大媒体，通讯扎根于基层、来源于基层、服务于基层。


    对于中小型企业、组织和网站而言，往往没有宣传意识，也从未发现过通讯的力量。因此它们不善于宣传、也无法将自己的动态、消息、人物及时向社会宣传，它们丧失了宣传这种巨大的天然能力，包括中小企业中的人员流失猛大，与没有及时报道内部那些平凡的人物和新做法也有很大关系，人家把工作干了，哪个部门在努力，最终结果是干了也是白干，既没有表扬也没有鼓励，最终企业的凝聚力很差，企业文化非常沉闷。


    ## 通讯软文的好处


    + 1、打好宣传这张王牌，“宣传到位，扩大影响”，这是组织真正的“软文”根基，“报上刊登，脸上有光”，这是企业凝聚力的基础。

    + 2、讴歌平凡人、平凡事，讴歌点点滴滴，讴歌身边人、身边事。

    + 3、展现欣欣向荣的发展脉络，给外界一种强盛的企业文化感。


    ## 通讯软文写作指南


    + 1、通讯是长期的、是强效的，要写作通讯，就要多研究各类企业“内刊”，参考广泛的通讯员培训，不断提高对动态和描写的写作能力。

    + 2、各企业和网站，要积极建立通讯员队伍，积极发展通讯员，形成通讯员网络，有素材、有通讯、有报道，才能做好宣传工作。

    + 3、各类通知、公告、文件，都可能是撰写通讯的内容来源，比如网站公告，稍加整理，就是一篇通讯。

    + 4、必须扎根基层，必须勤于报道，务必注意：“做了要说，而且一定要说出去”。

    + 5、通讯写作不是凭空想象，注意对采访，随时采访和记录，素材是第一位的，没有素材就没有通讯。

    + 6、通讯员要有写作热情，所有的通讯员都是从基层开始的，都是从不会写开始的，初学写作可以边学习边实践，模仿着别人的去学。

    + 7、短小精练，这是通讯写作的基本要求，采写通讯就是要写好短消息。例如学校运会会时，小通讯员用一两百字的小文章报道本班动态，在校园广播播出，就是灵活应用的例子。

    + 8、用事实说话，通讯写作，是记录事实，而不是评论事实，不要本着评论的心态去写通讯，要善于小处着眼，以小见大。


