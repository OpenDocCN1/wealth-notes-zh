    ## 时速 70 公里能把人撞那么高？


    5 月 8 日 14 点，针对这起车祸，杭州警方召开了一场通报会。据杭州媒体报道，警方通报说，根据初步调查，7 日晚，肇事者胡某驾驶三菱跑车从杭州城东开往城西，结伴同行者两人也各自驾驶跑车。20
    时 05 分左右，胡某所驾跑车在西湖区文二西路由东向西行驶至南都馄饨西区门口时，车头撞上了由南往北过斑马线的路人谭卓，造成其受伤，经浙江省同德医院抢救无效死亡。


    不过，在通报会上，警方给予的一些说法，却遭到了参与通报会的部分网友的强烈质疑。网友质疑：杭州盛行“飙车”就是因为交通法没有对其约束吗？


    ## 分析：


    上述两则样例中所刊载的事件，在媒体和网络上引起了广泛的社会关注。某某事件，实际上是新闻策划的结果，容易在第一时间引起广泛关注，并爆炸式地引发多方评论，迅速升级成巨大的轰动效果。


    ## 样例三：


