    # 分析：


    上述样例中，例一、例二均是网站通讯，报道网站的最新动态、活动，无论是企业还是组织或网站，增设一条生产线，安排一个考察团外出、举办了一些篮球联赛，增加了 一个栏目，都可以报道。例三是人物报道，报道集中于一线那些接近普通最平凡的人物，树立学习典型，鼓舞士气。如果是网站，也可以报道一些典型的用户。


    # 通讯软文写作特点


    通讯是一种细小、深入又普遍的报道方式，它要求报道周围的人、周围的事。


    “做了要说，而且一定要说出去”是通讯的重要特点，在大型企业，党政的宣传部工作中，通讯占据了最大的工作比例，内部报纸、广播、电视等企业内部媒体，就足用来采写和报道通讯的，企业中的通讯员也会不断地写各种通讯稿件寄发各大媒体，通讯扎根于基层、来源于基层、服务于基层。


    对于中小型企业、组织和网站而言，往往没有宣传意识，也从未发现过通讯的力量。因此它们不善于宣传、也无法将自己的动态、消息、人物及时向社会宣传，它们丧失了宣传这种巨大的天然能力，包括中小企业中的人员流失猛大，与没有及时报道内部那些平凡的人物和新做法也有很大关系，人家把工作干了，哪个部门在努力，最终结果是干了也是白干，既没有表扬也没有鼓励，最终企业的凝聚力很差，企业文化非常沉闷。'
