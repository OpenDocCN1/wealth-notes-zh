  md: "\n## 技巧软文\n\n### 什么是技巧软文\n\n技巧软文就是专门以写小技巧、小知识为中心的软文。对于很多产品如软件、某类知识，非常适合用技巧性软文来推广。\n\
    \n样例一：\n\n### Office 技巧：Word2003/2007 表格快速统计\n\n大家知道，在 Excel 中如果要统计某个值在某一列单元格中出现的次数，这是非常方便的。\n\
    \n但是，如果是在 Word 表格中，那怎么办呢？选中要统计数据所在列（如果有列标题，则不要选中列标题），按“Ctrl+H”组合键，打开替换对话框。在“查找内容”中录入需要统计的值，接着，在“替换为”中输入“^&”(不包括引号)；单击“全部替换”，在弹出的对话框中显示的数字就是我们需要的统计数字。\n\
    \n样例二：\n\n### 选车小技巧：新上市车型与成熟车型\n\n很多刚出炉的新款车，造型时尚而时尚，配置似乎也比市场上同级车丰富。但是作为理性的消费者，最好在新车上市之际保持清醒的大脑。一定要慎选新款车，原因如下：新车型有降价的可能、新车型小毛病概率增加、维修保养费用高、新款车配件价格偏高……\n\
    \n成熟车型的优点就是性能稳定，皮实，并且在维修方面也非常具有优势，售后网点多，零配件国产化率高而且价格低。\n\n样例三：\n\n### 养猫技巧：猫的食物禁忌\n\
    \n- 1、洋葱： 洋葱含有破坏猫的红细胞的成分，虽说不会单独咽洋葱，但注意不要混在肉中咽。\n- 2、鱼骨、鸡骨：有人以为猫能好好地嚼碎骨头，但实际上猫不嚼食物，而是吞下去的。有大骨头刺伤猫胃的危险，还是除掉比较放心。\n\
    \n3、甜点：有的主人觉得有趣，给猫喂蛋糕、巧克力，并认为似乎是无关紧要的事情，但因此会长蛀牙、长胖什么的，应避免这类事情。经常喂这些东西的话，猫会养成熟食的习惯。\n\
    \n4、生猪肉：猪肉可能包含有弓形虫等，所以一定要煮一下。\n\n5、鳄鱼、章鱼：有一传说，吃了鳄鱼、章鱼，腰节骨会软，可能是不易消化，所以不能够吃，更不能作为常吃的食物。\n\
    \n6、鲍鱼、海螺：吃了这些东西会得光线过敏症，易得皮炎，尤其是对猫的耳朵更有影响。\n\n分析：\n\n微软善于使用产品小技巧软文来推广各类产品，例一即\
    \ OFFICE 的一则技巧。例二和例三是一个汽车网站一个宠物网站的样例。\n\n### 技巧软文特点\n\n1、好写好用，随处可见，传播率高。诸如全国各地的地方报纸，有大虽的内容都是“如何治疗牙痛”、“夏天如何使用凉席”的小技巧，从南到北，全国人民都看这些小技巧，经久不衰。\n\
    \n2、转载及传播是长期的，一篇小技巧可能存在 10 年或者 100 年。\n\n3、内容虽小，但成文迅速、使用率高、阅读率高。\n\n### 技巧软文写作指南\n\
    \n1、技巧软文是极为快速和简便的传播方式，例如一款软件，不要只 abr 介绍软件的功能，而要以使用者的角度，编写各种使用技巧，这是软文的入手点。\n\n\
    2、各类形形色色的网站，都需要重复转载这些技巧类文章，而技巧类文章的制作是极其容易的，它建立在整理和编辑上，内容很短，写作快速。\n\n3、大部分技巧软文根本没有作者或作者不明，或者纯粹来自于整体性的编辑加工。如：一个酒店预定网站，可以广泛收集旅游出行、宾馆住宿、景点奇观等方面的图书和报纸，编写成小技巧进行广泛传播。\n\
    \n## 研究软文\n\n### 什么是研究软文\n\n研究软文，是以研究报告、研究资料、文献为基础的文章，研究性软文一般是为学者、专家所频繁使用的，鉴于有些学者专家的地位及名气以及研究方向的著名性，学者、专家容易因此成名，并获得广泛的影响力。\n\
    \n样例一：\n\n### “人民就是人客”顾客服务是电子化政府未来发展要务\n\n国际市场研究机构 Accenture 于 2005 年 4 月发表一份关于电子化政府的调研报告，分析世界各国电子化政府的发展成熟度，加拿大已连续\
    \ 5 年在“电子化政府”评比拔得头筹。Accenture 更进一步指出「顾客服务」是未来电子化政府评比的关键指标，创造顾客的实质价值，亦是电子化政府发展的重要目标。\n\
    \nAccenture 指出，“顾客服务”是未来电子化政府评比的关键指标，创造顾客(国民)的实质价值，亦是电子化政府发展的极主要目标。从上述研究发现，各国政府作业及服务网络化已趋成熟，然而仍有许多问题有待克服，例如解决民众对传统作业的依赖性、提高民众的使用意愿、改善使用者对新技术的认知及适应性、改善政府的网络使用接口等。因此，电子化政府的发展必须与国民需求结合，政府并持续加以修正发展之进，方能有效提升电子化政府的效能及提升国民满意度。\n\
    \nFIND 研究员：罗筱秋\n\n样例二：\n\n### 艾瑞咨询：汽车广告用户最看重广告语和画面设计\n\niResearch 艾瑞咨询根据艾瑞广告创意喜好调研数据研究发现，广告语、广告画面设计、和品牌喜好度是影响用户对汽车广告喜好度的重要因素。\n\
    \n艾瑞咨询分析认为，广告语是传达广告倡总最直接的手段。而看懂广告，了解广告所要表达的意思是用户对广告的基本需求。广告语是满足这一基本需求的最有效途径。因此广告语设计对广告的用户喜好度具有举足轻重的作用。\n\
    \n艾瑞咨询分析认为，汽车属于大宗商品，选购汽车对用户是一件严肃的事，需要谨慎的考虑，希望接收到稳重可信的信息。而网络广告中的互动游戏很少能传达这类信息给用户，因此\n\
    \n在用户最喜欢的 10 个汽车广告中，用户选择百分比较低。而相对其他产品而言，网络广告中的活动奖励对购车用户的吸引力较低，也导致其用户选择百分比较低。\n\
    \n### 样例三：\n\n### 陈焯明研究：独立教育行政与经费\n\n陈焯明于 1920 年 11 月回粤，他在教育会与学生联合会的欢迎会上演讲，对改革广东教育，发表了下面一段意见：\n\
    \n收束军队，当发展教育。。。教育为一国立国元素，教育费之支出，当占岁出额之强半，方为正当。连年财政紊乱，达于极点，非从根本治理不可，治理之后，涓滴归公，自可得大宗收入，以为兴学之用。。。我国向来，多是蹈常袭故，往者的教育章程，乃起草于�RJ代旧物。。。此等旧式专制式的教育，殊与现世潮流相背，容当根本改良教育方针。〔华字\
    \ 1920.11.23〕\n\n陈焯明要从根本上改革教育方针，所取的原则是在创立一个独立的教育行政机关，和独立的教育经费。所谓“独立”是指与政治脱离关系而独立。这个原则，也就是欧美民主国家建立其教育制度最基本的原则。\n\
    \n分析：例一是针对研究报告的摘要内容，例二是一则调查中发现的特点，例三是人物历史研究，引用史实。研究类软文以事实、史实、分析为中心。\n\n### 研究软文的特点\n\
    \n研究软文，主要用于社会现象、行业发展、学术等研究。研究软文的写作，有些是直接摘要其他研究报告，如例一便是直接摘要，有些是分析一些问题，如例二，有些则是分析史实，如例三。研究软文大多以引用为主，社会性或行业性的研究文章，传播率高影响力大，而史实、学术等研究，主要表达的是新发现、新思考、新研究结论。有些研究文章也用于学术批判，如现代艺术批判、反驳一些观点。\n\
    \n### 研究软文写作指南\n\n- 1、摘要和引述为主，建立在摘录研究报告和资料的基础上，文章一般先要引述或大豕引述原始资料的内容。\n- 2、研究文章有时本身也是小型论文，如果加上关键词、摘要、参考资料，尽管七八百字，也能成为论文。\n\
    \n3、具有趋势性、参考性或学术性、历史价值，有些文章对社会及行业影响较大，或在某些学术领域影响较大。\n\n4、一般由研究性质的组织或个人实施。如市场调查公司、咨询公司，如研究院、学术中心。\n\
    \n5、读者一般比较高端，而研究机构和研究者，容易因此成名，或者具有独一性、文献性。\n\n6、研究类公司，以出版发行报告和咨询项目为主，如兰德公司、互联网实验室、艾瑞网，研究类机构一般不以营利为目的，如卓学全球管理科学索引、围研网、<|message|>人大复印资料、政策研究室等，从事研究领域的学者一般不以营业为目的，通常以文养文、以研究养研究，学者属于历史，进行研究的学者一般都会成为著名历史人物或在历史档案中留名千古，如司马迁、梁启超、章太炎、胡适、马克思韦伯、德鲁克。\n\
    \n## 数据软文\n\n### 什么是数据软文？\n\n数据软文：以分析数据、统计数据、调查数据等资料为基础的文章。\n\n### 例文一\n\n###\
    \ 调查显示中国人仍局限于“亲缘社交”\n\n中国著名民间调查机构零点公司近日发表的一份调查报告显示，大多数中国城乡居民不善于社交，尤其是her不擅长与陌生人打交道。报告显示，尽管中国居民沟通指数的总体得分为\
    \ 69.32 分，较上年增长了 3 分，然而，距离商沟通水平仍有较大差距。中国人仍然局限于“亲缘社交”，而对以陌生人为主体的“社交外圈”的社会资本的利用明显不足。\n\
    \n虽然有七成以上的受访者表示了很强的结识陌生人的愿望，但仅有不足四成认为自己擅长和陌生人打交道。调查显示，受访者希望平均每月结识 3 个新人，但实际上四成以上的人在过去一个月内没有认识任何新人。报告将其归结为中国居民与新人交往的能力不足，结识陌生人的机会较少。\n\
    \n调查指出，亲戚家人仍是中国社会资本的主要来源；中国人对于本该更具有资本价值的社会交往圈利用不足。大量的社会网络都属于无效浪费状态，而对亲缘圈却赋予了过重的角色和期冀。\n\
    \n### 例文二\n\nChinaVenture：2009 年 5 月中国 IPO 市场研究统计\n\n### 3 家中国企业境外 IPO 融资金额超 13\
    \ 亿美元\n\n2009 年 5 月，共有 3 家中国企业实现 IPO(见表 1-1)，融资金额达 13.48 亿美元，环比上升 431.48%(见图 1-1)。其中，亚洲最大的铝型材生产商——中国忠旺控股有限公司(以下简称“忠旺控股”)8\
    \ 日登陆港交所，发行股票 14 亿股，融资金额 98 亿港元。此次忠旺控股 IPO 是今年全球最大金额 IPO，也是继去年 8 月中国南车集团之后，全球资本市场首笔超过\
    \ 10 亿美元的 IPO。\n\n### 2009 年 5 月中国企业 IPO 规模\n\n| 交易所 | IPO 数量 | 募资金额 (US$ Mn)\
    \ | 平均募资金额 (US$ Mn) |\n|---|---|---|---|\n| 香港主板 | 1 | 1264.34 | 1264.34 |\n|\
    \ 韩国科斯达克 | 1 | 40.67 | 40.67 |\n| 韩国主板 | 1 | 42.52 | 42.52 |\n| 总计 | 3 | 1347.52\
    \ | 449.17 |\n\nChinaVenture 投资数据库,2009.06 www.ChinaVenture.com.cn\n\n### 例文三\n\
    \n艾瑞：08 年网络教育市场规模 352 亿 同比增 24%\n\n艾瑞咨询分析师赵旭枫近日发布分析报告指出，2008 年中国网络教育市场规模同比增长 23.9%，达到\
    \ 352 亿元。\n\n### 2004-2012年中国网络教育市场规模\n\n![](img/9c5a94eedde119b872450b830636a0d0_64_0.png)\n\
    \nSource: 上市公司财报和访谈数据\n\n艾瑞分析认为，促使市场保持高速发展的主要动力来自于网络教育在高等学历教育市场的应用，由此带来的收入约占网教市场整体规模的\
    \ 85%-90%，而随着党的十七大提出的“发展远程教育和继续教育，建设全民学习、终身学习的学习型社会”的要求的贯彻落实，中国网络教育市场规模还将进一步发展，预计在\
    \ 2012 年市场规模将达到 723 亿元。\n\n分析：以上三则样例中，例文一是一则普通的民意民情调查数据。例二、例三分别是两个市场研究公司的分析和统计图表。从经营方式来看，例文一、二、三的发布机构分别为零点调查公司、艾瑞网及投资中国(ChinaVenture)，这些机构专注于发布数据新闻和资料，已经在中国媒体上形成极其强大的影响力。\n\
    \n### 数据软文写作特点\n\n- 1、数据软文主要是对各种分析数据、统计数据、调查数据等资料加工整理。\n2、数据软文大多以统计图表来表达。\n3、数据软文具有强传播性、专业性、写作简洁性的特点。\n\
    4、数据软文容易快速建立和发展成专业的企业(网站)品牌。\n5、企业或网站很容易和一些大型媒体、网站形成内容合作，向对方定期提供数据软文，形成经营特色。\n\
    6、借助于数据软文的传播，经营数据软文的企业(网站)可形成以销售研究报告、统计分析、调查报告的专门业务。\n\n### 数据软文写作指南\n\n- 1、数据源：可以来自于对社会上各种数据，如生活数据、手机数据、汽车行业数据、创业数据的专门搜集整理，将这些数据加工成数据图表，使之成为企业(网站)的特色内容。\n\
    2、数据也可以自来网站或论坛的小型调查，比如展开《站长及喜欢哪些类型的培训》、《消费者通常提前多长时间预订酒店》、《平均每次自助游预算多少费用》等人们感兴趣乐见的小型调查，制作成数据软文。\n\
    3、数据软文的重点是加工数据，制作成图表，写作简洁快速。\n4、数据软文容易形成品牌，例如艾瑞网及投资中国(ChinaVenture)，就以收集和发布互联网类、风险投资类动态、数据和报告、举办相关活动为主要经营项目。\n\
    5、数据软文可以经营，例如全面搜集各种心理咨询类的数据，可以形成数据报告或数据包，供需求者购买。\n6、在百度新闻搜索中，查询关键词“调查显示”，可以发现大盅原始的数据分析，在此基础上可以加工整理。\n\
    \n## 其它各类软文\n\n### 专题软文\n\n什么是专题软文？\n\n专题软文，是以专题形式所进行的一种软文写作和传播方式，通过在媒体或网站上建立专题网页，使之从互联网上大量收获检索umulate。\n\
    \n### 专题软文写作特点：\n\n搜索一部电视剧名称，例如：《大秦帝国》，排列在百度搜索引擎第一页的，往往是新浪网、搜狐网的影视专题，特别是遇到热门电视剧，百度每天贡献给新浪网、搜狐网的流量惊人。\n\
    \n### 专题软文写作指南：\n\n- 1、专题软文并不一定用来在其他媒体或网站发表，而是用于网站自身的专题。例如“网站地图”，每天在搜索引擎中有上百次检索量，但没有相关专题，因此这些来自搜索引擎上的搜索量被分散到各个可能的网站，而通过制作专题，可以源源不断的吸收到相关流量，这些专题本身，也容易被其他网站复制、转载。积沙成塔，网站发展将会稳步增长。\n\
    - 2、专题软文可以与所经营的项目捆绑，例如你正在经营工艺品，可以将“玻璃工艺”、“水晶工艺品”、“烙花工艺”、制作成专题。\n- 3、专题可以独立推广，例如在百度百科或其它网站的资料来源上，可以标题：“参考资料：电子商务指南专题，http://www.zhuoxue.org”\n\
    \n### 十大软文\n\n什么是十大软文？\n\n十大软文，是以“十大”为标题和主要内容的写作方式。\n\n### 十大软文写作特点：\n\n《2009\
    \ 年十大明星》、《十大管理者必参网站》、《网站推广十大技巧》、《十大最酷旅游景点》、《十大畅销旅游书》等等。如果是“十大网站”或“十大产品”，通常在第二条或第三条，列入自己的网站或产品。\n\
    \n### 十大软文写作指南：\n\n- 1、来自于多参考，多收集。\\n2、十大软文传播效率很广，网站和论坛大多容易转载。\\n3、十大很容易产生影响力。\n\
    \n### 内幕软文\n\n什么是内幕软文？\n\n以《XX 内幕》、《XX 揭秘》为主的文章写作方式。\n\n### 内幕软文写作特点：\n\n由于人们大多喜欢对“内幕”、“秘密”产生好奇心，所以以此为题的内容，容易产生强大的点击率。\n\
    \n### 内幕软文写作方式：\n\n- 1、多在网上以“内幕”、“秘密”为关键词搜索文章，多方参考或加工。\\n2、开篇最好曲折，行文最好具有传奇色彩。\\\
    n3、“内幕、秘密”有时来自于对档案、资料的搜集加工，是来自于对于背景知识和情况的掌握。\n\n### 固定软文\n\n什么是固定软文？\n\n固定的节日、节气、活动，每年都有，新一年的文章完全可以来自于对上一年文章的翻新，固定的产品，如苹果种植、杀毒软件，都已经形成了大量的固定功效、作用等介绍文章。\n\
    \n### 固定软文写作特点：\n\n比如春节、暑假、年会，这些节日与活动是非常固定的，特别对许多产品而言，也是季节性的，如空调、凉席、取暖器等等，因此在网上经营这类产品，或需要用此类关键词做流星时，文章通常来自于对上一年文章的翻新、整理。对产品类的固定软文，则通常来自于对相关所有资料的整理加工。\n\
    \n### 固定软文写作指南：\n\n- 1、勤搜集、勤整理、勤加工、勤建档，积累的相关资料越多，写作越容易。\\n2、按时间固定的文章，每一年多花点力气制作软文，到第二年、第三年就非常轻松容易。\\\
    n3、按产品固定的文章，要下的功夫是对资料的收集，比如围绕“养猫”，你搜集的资料越多，写文章越简单，只需要把内容相互拆、合、删、增式的加工整理而已。\n\n\
    ### 生活方式软文\n\n什么是生活方式软文？\n\n指围绕生活方式写作的软文，通常用于将产品融入生活。\n\n### 生活方式软文特点：\n\n不要推销一种产品，而要倡导一种生活方式。例如酒店预订就是一种生活方式，围绕酒店预订怎么节约时间、怎么轻松预订、怎么享受快乐、酒店趣闻、酒店生活，以及在酒店里如何品酒、享受某酒店的冲浪浴等等，都是一种生活方式的享受。这才是文章的重点。\n\
    \n### 生活方式软文写作指南：\n\n- 1、以生活享受、快乐健康、轻松愉悦为主题，只写生活，在生活中融入你的产品。\\n2、将新科技、新材料、新享乐主义、新便捷方式、新惊喜等等生活素材与产品结合起来。\\\
    n3、以高品味的生活为主体。\n\n### 实验室软文\n\n### 什么是实验室软文？\n\n以实验室为名义撰写的文章，通常有很强的影响力和很强的专业性。\n\
    \n### 实验室软文特点：\n\n通常会是《科学家称：XXX》、《科学家发现：XXX》、《科学家表示：XXX》等等题材来发表文章及分析性内容。实验室的高科学性往往让人容易信服，也更容易拥有权威性和影响力，并非所有的实验室就一定是政府和组织设立的科学实验室，有时作为一种兴趣研究也可以设立实验室，如：互联网实验室、Web2.0\
    \ 实验室、搜索引擎实验室。\n\n### 实验室软文写作：\n\n- 1、可以以搜索整理数据、研究资料为主，结合《数据软文写作》与《研究软文写作》 。\n\
    2、可以尝试一些小型实验、研究，发表一些测试结果，或者针对某些问题发表观点。 \n3、以“实验室”名义，加大影响力。 \n4、容易让商端人士接受，发展商鸦人脉，建立商端合作。\n\
    \n![](img/9c5a94eedde119b872450b830636a0d0_69_0.png)\n\n## 软文概述\n\n### 软文有什么用\n\
    \n没有多少人关注软文的价值，更没有多少人真正认识到软文石破天惊的卓越贡献。\n\n让我们把眼光投向股 Google，这个一直宣称自己是一家从来不花一分钱做广告的公司，外界一直认为它神速般的崛起奇迹源于口碑。但究竟是不是口碑制造了\
    \ Google 神话呢？如果撕掉这层神秘面纱，我们将看到什么？\n\n在数年以前，卓学管理学派朱则荣就对 Google 的演进史进行了观察。我们从新浪科技的历史中可以发现这一神话演进的规律。\n\
