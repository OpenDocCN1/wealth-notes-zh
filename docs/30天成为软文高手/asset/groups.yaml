    ## 渗透营销，小型企业发展的王道


    市面上有成千上万关于如何经营企业的书，也有数以万计介绍营销技巧的图书，更有无数网站天天在谈中小企业。但是，这些书和观点，都忽略了小型企业资金不足、资源匮乏这一个最关键的问题。于是就有很多
    人梦想着外部投资，只要有人给钱，好象企业一下子就起来了。但是，我们切实思考一下，小型企业的特点，肯定与大型的、中型的企业不同，它只能在资金严重不足、资源严重不足的情况下寻求发展，如果脱离这种现状，那就脱离实际了。


    小型企业的困惑就在于怎样以特殊的手段捕捉顾客和维系顾客，而且这笔开支可能没有多少预算，渗透营销，就是其中最适用也最实用的一条道路。特别是对员工少于20人的小型企业来说，它没有自己专职的营销主管，也不可能使用专业的新间发布稿、设计销售广告或是在花里胡哨的网站上浪费钱来取悦领导。


    目前，全世界有数以亿计的网站在争夺人们的注意力，该如何传递你的信息，传递给谁呢？无疑，因特网改变了企业的经营方式，我们肯定还有很长的路要走，从中找到窍门就会落后，互联网不仅给我们带来了机遇，而且引领着一种特殊的潮流——它让那些原本不起眼的小公司，可以和大公司在互联网同时展开竞争，对资本有限的小型企业来说，灵活应用互联网，更容易胜出。


    事实上，渗透营销并不是一种全新概念，很多人和很多企业都在无意识地运用渗透营销。从这个方面来说，渗透营销就是让人们不仅仅只关心自己的产品和服务，而是要切实帮助消费者解决他们的问题。


    同样，渗透营销不只是局限于大公司。它在小型企业里被更为广泛地运用，它之所以能被普及，是因为是其花费很低，这更符合小型企业的财务状况，对所有的商业形式来说，渗透营销至少有两大贡献：首先，大多数渗透营销策略执行起来花费低廉；其次，渗透营销适合任何商业形式和任何行业。


