    通常，一篇文章被新闻源推荐，被百度新闻或 Google 抓取后，会取得不错的推广效果。新闻和资讯网站通常会订阅、定时查阅这些资源，在百度新闻和 Google
    资讯出现的文章，通常有非常不错的转载效果。


    因此你要想方设法让自己的文章出现在这些“新闻源”的网站上。


    ## 软文定向跳转


    例如，你是一家旅游网站。如果想让媒体关注你，或者想要寻找更顶级的行业网站来关注你，用普通的推广方法，可能非常困难。你写的文章并不一定被这些重要的网站转载，在这种情况下，你要把自己变成一个有案例，如《某某旅游网的电子商务主张》、《旅游网站服务客户三要素》，将它们发表在转载越较高的
    IT、管理等网站上，那么，你行业间的高端媒体和网站可能会通过这些 IT、管理网站进行再次转载。


    ## 多研究关键词


    关键词研究，将平衡你的软文关键字。如果你不希望自己写的文章所要体现的关键词被搜索引擎忘记，那就要多注意关键词，以及关键词的搜索结果。当一个关键词有 80 多万页的结果时，你的文章关键词排名将比较困难。


    ## 找到更好的软文写作观点


    写好软文，需要大量的新动态、新事件、新观点进行触发。你可以使用百度新闻或 Google 资讯的订阅功能，定阅一些指定的关键词，每天定时发送到你的邮箱。比如你的网站是关于“科学家”的，那么订阅“科学家”这个关键词，随时帮助你产生更为快速的写作灵感。世界上没有几个擅长软文写作的人是在“闭门造车”，他们通过大量阅读指定内容的报纸、新闻信息，来触发大量的写作灵感。


    ## 用软文销售产品


    ## 成功建立一个用于产品销售的网站


    为了在网上获得生意成功，网站是必须的。这种投资很有必要。但是，有一些重要的原则需要遵循。


    - 即时销售网站


    怎么让网站实现即时销售，快速让客户做出购买决定，这才是我们考虑的核心。即时销售网站的目的，就是直接地告诉客户买与不买，该如何购买。


    - 你的网上销售根据地


    你必须在网上有一个可以扎根的地点，用于扎牢根基，打好基础，这是网上生意成功的前提。


    ## 选择要出售什么商品


    选择在网上出售什么样的商品，要做出这个决定，你可能很困难。最常见的情况是：当你可能相中鞋垫艺术品，也有这样的资源，但当你再去想的时候，脑子又成了一片空白，你不知道该如何销售，你也不知道销售前景如何，最终，你高涨的热情又被你自己打倒。


    互联网上的一切，对于没有任何丰富经验的人而言，往往是一片未知的领域，出于对无限的憧憬与恐惧，矛盾的思维将会把你的一切想法压倒，因此你往往很难做出任何明确的决定。


    当你要下定决心在网上进行销售时，就要多方面考虑，你到底喜欢销售什么，你的兴趣究竟是什么，最终驱动你在网上获得销售成功的因素，不是因为它能够赚钱，而是因为你喜欢销售它们，你的乐趣将促使你忘记一切辛苦，不知疲倦地在网上劳动。大部人开始在网上销售商品，都不会采用花钱打广告的方式，而是用自己的劳动开垦荒地，这是一项枯燥冗繁的工作，如果你没有足够兴趣，将很快放弃你的想法。


    在网上销售，最重要的成功，是为自己的商品销售找到一条有规律的发展途径，专业术语，叫做完整产品销售流程，什么时候把它能够固定下来，什么时候你也就打开了销售局面。考虑以上因素。


    ## 活用销售标签


    这是一种重要而且高明的方法，但很少有人使用这种高明的方法。一个典型的个人标签是：

    “张雨是一个喜欢宠物，对猫咪的饲养有着五年半丰富的经验的女孩子，她在各种宠物网站上发表过

    多篇文萃和心得，她的网址是：www.zhuoxue.org”


    个人标签很少有人使用，实际借助于个人标签，可以让人们更加了解你，人们买东西的时候更相信专家的说法，特别是有着类似经历的描述，容易引起客户的共鸣。经验有时是很值钱的，但一定要让人们知道你所拥有的经验。这是一笔财富。


    ## 建立你的网上销售根据地


    网上销售不能够打一枪换一个地方，有很多人以为，在网上做销售就是在淘宝、易趣开个店，但我们注意一下：


    ![](img/9c5a94eedde119b872450b830636a0d0_107_0.png)


    图：一个随机从淘宝上截取的网页


    在这个网页中，我们可以发现，信息量非常的大，如果用它来给自己做推广，那么至少你花费的 90% 的力量，都是在给别人打广告。


    建立一个网站是很容易的，但最难的是以什么样的思想来运营你的网站，大部分 的网站在销售上是失败的，你必须记住这个教训。


    ## 清楚你的目标


    你的目的不是为了建立一个看起来很大的门户网站，你也不希望为它建立几十个栏目，增加数以千计的内容。这是一种愚蠢的想法。当你的网站提供的内容越多的时候，越容易遮盖住你的商品光芒，你让你的客户象进迷宫一样跟你“躲猫猫”。网站内容越多，流失的客户也将越多。


    不要被网上那些花里胡哨的网站搞乱了头，一得知自己要建立网站，马上就想起建立一个特大的网站。你必须搞清楚一点，你的目的就是为了销售商品，就这么简单，用最简单的方式来建立一个简单的网站。


    ## 你的网站是为了诱发购买


    传统的观点认为，建立一个网站，就是要把所有的产品，都列在网站上，方便访问者从中挑选，而且这个愚蠢的思想，也影响了许多开发网上商店技术的人，误以为网上开店就是展示商品。


    你注意过那些生意非常好的超市和街头特色店没有，他们用来招揽生意的，不是货架上的那些商品，而是对最新最热门商品的广告宣传。其正引发你购买的是这些招揽广告，在商场购物时，你最留意的就是这些信息。


    ## 即时销售网站


    我们现在来考虑网上销售的问题，请观察一下网站：


    在这个网站中，我们可以发现，它灵活地使用了多张图片，告诉你孩子需要哪些产品，它就像一张你在街头上看到的传单，能够快速引发你的购买兴趣。


    你再回想一下你在网上看到的大盘网站，它们复杂而且内容很多，其致命性的缺陷，就是不能和这个网站一样，快速吸引你的注意力，简单而直接地告诉你该购买什么，该如何购买。


    其实，这就是一种客户心理，客户大多喜欢干脆利索，你能卖给我什么，多少钱我能买到，客户就想要这个简单的答案，没有必要把一切搞得异常复杂，像猜谜一样让人不知所云。


    这种网站，就是即时销售网站，让你用最短的时间，快速做出买和不买的决定，仅此而已，不需要太多花哨的内容，也不需要多少说明的信息。


    这样的网站，通常只有一页，或者简单的三五个网页。制作一个这样的网站，也仅仅需要几百元而已。但正是这样简单而快速的网站，所产生的销售效果却是惊人的。它不会告诉你更多复杂的信息，只有最简单的几个产品，让你能够从快做出选择。


    一款用于皮鞋也可能就提供这样简单的信息，足以。


    ![](img/9c5a94eedde119b872450b830636a0d0_110_0.png)


    一个用于推销商品的网站也如此简单。


    ## 批量写你的软文


    接下来工作，就只剩下吸引用户，你可以建立 QQ 群、开通博客、让用户留下电子邮箱，写软文来收用户就可以了。或者，制作电子书、定期发布电子杂志，在这些内容中直接带上你的网址，行动吧。


