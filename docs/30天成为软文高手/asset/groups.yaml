    # 技巧十五：你最喜欢收集哪些资料？


    大部分喜欢学习的人，平时都喜欢收集某方面的资料。要写好文章，没有一定的资料是不行的，比如李敖的文章产量很高，他的身后是数十万册的藏书，而马克思天天坐在图书馆里，这就是他们高产的秘密。


    没有雄厚的资料做基础，没有大量阅读做基础，每天坐在空想，你是写不出多少好文章的。


    比如你要建立一个关于钓鱼的网站，就要到书店去买很多钓鱼的书，到图书馆去查资料，订阅所有可能的钓鱼报刊。你每天呆在书堆里，你就有源源的文章可写。


    # 技巧十六：如何快速撰写软文


    +   1、选择你感兴趣的话题，比方说，你喜欢狗。\n2、尝试缩小主题，比如你有许多关于牧羊犬的经验，写其中一个。\n3、写上标题“牧羊犬是最好的品种的狗”，这是给文章的“下钩”。\n4、开始写文章，至少写出3-5个“为什么”，比如“牧羊犬的聪明”-“它为什么聪明”。\n5、简单的结论。“显然，牧羊犬是最好的狗之一。”


