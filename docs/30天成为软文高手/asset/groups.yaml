    1、企业史：自企业成立以来的简史、荣誉史、史料、历史档案、大事年、企业志、年报、具有里程碑意义的阶段和往事、变迁史，自企业创立以来的老照片、老员工感想、感人故事、遇到困难与挫折和如何克服、如何改革、抓住机遇等等。


    2、重点人物：包括公司的蛮邦长、总经理、在公司发展中举足轻重的人，他们的经历、观点、故事、转折、先进行程及活动记录等。


    3、企业情况：包括企业规模、人员规模、成员企业、客户分布销售网络及售后服务网络、部门情况、代表企业、研究报告，各类文件、通知、规范与资料。


    4、企业人物：企业代表人物、专家、楷范人物、历次先进表彰名单、自学成才人物、部门管理者等。


    5、产品：产品的技术、材料、变迁、生产流程、功效、销售、应用、代表客户等等，与产品设计、生产、经销、售后服务过程中所发生的故事。


    6、市场：市场分布、市场特点、市场研究、消费者研究、市场规模等。


    7、企业规划：企业远景、一段时期内的目标、战略发展方向、计划等。


    8、管理方法：管理设计、企业文化、管理理论、经营模式，独特的经营管理策略、管理经验等，重点是管理流程改进的探讨、管理方法的实施案例、优秀经验与做法。


    9、观点与数据：企业中经营者、管理人員、服务人员等所表达的主张、观点、看法，统计数据、总结、计划等。


    10、图片、影片库：如企业CI、标志性建筑、办公场景、重要事件场面、产品包装、广告图片、销售网点实拍照片、人物照片等。


    标准件的收集，一是建档，二足有意识地平时收集整体，三是灵活组合应用，四是在企业秘密保护原则下展开。


