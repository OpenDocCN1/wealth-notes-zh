    # 用文章砸开那些有名的网站、论坛


    1、你不是在和某一个人交往，而是和这个网站所需要的内容交朋友，你需要下点功夫去观察对方常刊登什么、什么是焦点。


    2、你知道他需要哪些文章，你也知道什么样的文章会变成重点头条，那就用文章开炮吧，不需要给任何人打招呼，也不必认识对方，接近的三五篇发上去，一点小意思，当几十篇扔上去的时候，你已经变成了对方网站最需要的写手。


    3、你的地位将空前绝后，对方的编辑和版主们迫不及等地想和你交朋友，他们甚至能提供他们自己所掌握的人脉和资源，帮助你写出更多、更好的文章。


    # 用教程让自己升华


    1、那些著名网站，不管是网易还是新浪，都大望地急需清晰简洁的指导课程、参考指南、专题文集。越是空白，越是没人写的内容最好，准备好这些内容吧，然后去打电话、发邮件给那些编辑，告诉你新出的教程，只要内容符合他们的胃口，你在这些网站上就有了自己的地盘。


    2、那些同业同类的网站，严重地缺乏这种系统性的资料，当你准备好了，就和他们联系，他们会很乐意为你开辟专栏。


    3、这些专栏就是你的名片，可以帮助你打开投资者、任何关系网的大门，他们把你当作专家，他们更愿意接受你这位专家的意见，也乐意和你这位专家交朋友。


    # 威望与名气的崛起


    1、与大站的记者编辑们交上朋友了，有什么重大消息或内幕或选题，他们第一时间会通知你，或者问问你的意见。你的观点和名字，将以专家的身份堂儿煌之地出现在重大事件评论中。


    2、记者们随时可能给你做单独的文章，以你的一些观点为主，加上他们的一些形势分析，你的名字将迅速在那些著名的网站上出现。


    3、著名网站之间一直互相取稿，某一个网站上一旦出现关于你的报道，不出两个小时，所有著名网站上大多会出现，再过一两天时间，成百上千的网站上就会出现。


