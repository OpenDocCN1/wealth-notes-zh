    # 软文写作技巧十六式


    # 技巧一：使用软文写作标签


    软文写作标签是作者的简要信息，三五十字，一般用在文章末尾，写完文章，顺手一帖。


    如：张三是网络营销界最璀璨的明星之一，他也是一位受欢迎的网站策划培训师。访问 www.abc.com 可以阅读他的大站最新文章。


    李四有五年的美容经验，她写过有大揪的美容知识与小技巧与朋友分享。(www.zhuoxue.org) 王五是《健康生活》电子杂志的编辑，他创办了ABC网站和《健康生活》电子杂志，他还在
    http://www.zhuoxue.org 提供为期20天的免费课程《白领生活20个习惯》。


    # 技巧二：销售网站


    传统的网站经营思路，需要对客户“倒三遍手。”第一遍，写软文或打广告把访问者拉过来，第二遍，从访问者中倒出可能的客户，第三遍，在可能的客户中找出最终付费客户。软文写作通过只需要倒一两次手。你的网站，只需要几个页面，说清楚卖什么，怎么卖，把客户可能问到的问题全写在网页上，他们自己去看，不必一遍一遍去给他解释。接下来，只剩一件事，写软文拉可能的访问者来你网站，剩下的事情就是成交。


    # 技巧三：销售线索


    在以下两种描述中，你认为你会对什么感兴趣？


    +   1、到我的网站来购买产品!网址： http://www.zhuoxue.org

    2、获得免费报告《八种方法使客户增加一倍》，发送一封邮件立即获得。


    毋无疑问，第二条会引发你的兴趣，并很可能按照操作方式发一封邮件，以获得资料。我们通过这种方式，在网上获得的正是销售线索。


    # 技巧四：软文销售'
  - '[PAGE 146]


    例如我们要销售的一款西红柿去皮机，我们可能在网上发出这种信息：


    “免费报告：西红柿去皮的十大方法”


    “免费报告：如何以在10分钟为8.23个西红柿去皮”


    “免费文章：西红柿轻松去皮的秘诀”


    把这些寻找销售线索的信息发布在家庭主妇集中的网站上，留下你的电子邮件，让她们来索取。你在向她们寄发这些资料时，只需要在资料中简单的放上自己的一则小广告就可以了。注意用软文销售的特点：当你为人们提供具有价值的信息时，人们就很容易购买你的产品来满足他们的需求。


    # 技巧五：重点强调 网上最有价值的资产是电子邮件


    如果你在网上以销售为中心，最有价值的资产不是流址，而是电子邮件。你在文章中可以留下一句话：“发一封邮件给aaa@aaa.com，收收关于网上创业的最新文章”。会有一些感兴趣的人给你发邮件的，如果你能收集十万封这样的索取电子邮件，你在网上的销售必定取得大成功。单纯吸引访问量是没有意义的，大部人是过客，来了又走，能够与你保持长时期接触的人很少。但十万邮件中，<|start|>了多少客户？


    # 技巧六：围绕“如何迅速”写作


    “如何迅速增加网站流量”、“如何迅速通过电子邮件做生意”、“如何迅速在三十天内瘦身”。相对一般文章，以“如何迅速”作为写作主题，文章的捜索量、阅读量、被转载复制量效果要好。


    # 技巧七：制作网站指南专题


    在网站上可以制作一个有关某些问题的简要专题，撰写软文的目的，就是让更多的人索引、转载该专题。如“网上如何开展电子商务”。你先制作好专题，然后可以在结尾中出现：“参考资料：ABC网站的网上如何开展电子商务专题，www.zhuoxue.org”，“zhuoxue.org网站对网上如何开展电子商务有很好的建立”，“我无意间阅读了ABC网站的某某专题，受到很大启发。”


    优点：除这些专题容易被阅读以外，也能获得很多高质量的链接。网站的链接推广不一定只推广网站的主要网址，也可以直接推广网站上的专题网址，链接效果会大大加强，而且这些专题网址会被大量引用，比如百度百科里，就可能引用你的专题内容。'
  - '[PAGE 147]


    # 技巧八：快速生产内容


    并不一定专门写文章，这样的写作速度很慢，可以以“文摘”、“简评”来制作文章。


    1、每天留意百度新闻，时刻把握最新热点话题，或 PROF  注意搜索结果中的相关关键词，或者围绕某种知识做定向的内容收集。


    2、把你感兴趣的内容做成文摘，或在文摘的结尾加上你自己的简要评论。


    3、向网站和论坛分发你的“文摘”、“简评”。围绕某种专门的知识做定向的内容收集，也可以快速的打造你的网站专业形象和专业流巢。比如针对信用卡服务，每天搜索相关知识和动态，做成文摘，再向其他网站和论坛传播，将非常受欢迎，文摘的好处是删除了废话、水话，今天的社会是个喜欢吃快餐的时代，大家不喜欢吞冗长的文章。


    # 技巧九：快速产生热门关键内容。


    在技巧八的基础钢，可以围绕最新的热门事件、热门话题或热门知识制作专门的“文摘”和“简评”，对增加流量效果极强。


    比如：针对圆明园国宝、航空母舰。


    今后凡是涉及圆明园国宝方面的资料，或者关于中国要造航母的热门话题，将在很长一段时间内成为搜索热点，人们关注这些新闻时，也必定会从搜索引擎上四处窜阅读这类知识和资料。


    # 技巧十：联合软文


    可以约上几个高手，组合成一个写作小组。


    例如“点石互动”就具有这种特点，除了建立写作小组，形成一种传播品牌，还可以设立专门的网站、博客或论坛，不断从论坛上产生新的话题。联合软文的特点：联合写作，相互推广，或者相互分发。在分发问题上，可以分工明确，每个人写好一篇，负责在三五个网站和论坛上发布，有十个作者，文章的传播率就扩大十倍。


    # 技巧十一：集中注意力


    每天最重要的事情，不是不停地查看访问量。这就象朝九晚五的上班族一样，每天除了上下班打考勤卡，你觉得一整天都是空白的。凡事有因才有果，网站是否增加流量不重要，重要'
