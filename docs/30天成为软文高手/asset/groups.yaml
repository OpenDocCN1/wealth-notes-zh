    # 研究软文


    # 什么是研究软文


    研究软文，是以研究报告、研究资料、文献为基础的文章，研究性软文一般是为学者、专家所频繁使用的，鉴于有些学者专家的地位及名气以及研究方向的著名性，学者、专家容易因此成名，并获得广泛的影响力。


    样例一：


    # “人民就是人客”顾客服务是电子化政府未来发展要务


    国际市场研究机构 Accenture 于 2005 年 4 月发表一份关于电子化政府的调研报告，分析世界各国电子化政府的发展成熟度，加拿大已连续 5 年在“电子化政府”评比拔得头筹。Accenture
    更进一步指出「顾客服务」是未来电子化政府评比的关键指标，创造顾客的实质价值，亦是电子化政府发展的重要目标。


    Accenture 指出，“顾客服务”是未来电子化政府评比的关键指标，创造顾客(国民)的实质价值，亦是电子化政府发展的极主要目标。从上述研究发现，各国政府作业及服务网络化已趋成熟，然而仍有许多问题有待克服，例如解决民众对传统作业的依赖性、提高民众的使用意愿、改善使用者对新技术的认知及适应性、改善政府的网络使用接口等。因此，电子化政府的发展必须与国民需求结合，政府并持续加以修正发展之进，方能有效提升电子化政府的效能及提升国民满意度。


