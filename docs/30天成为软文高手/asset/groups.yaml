    100 亿瓶可口可乐。例如 1943 年 6 月 29 日，艾森豪威尔在北非给美国陆军参谋长马歇尔发出急电：“本军先行要求 300 万瓶可口可乐，以及每月可以生产两倍数量的完整装瓶、清洗封盖设备，请求提供护航。”而当时可口可乐采取的是
    5 分钱一杯的低价策略，塑造爱国形象，得到了美国军民的感动和支持，尽管为了这 5 分钱一瓶的可口可乐，可口可乐公司也付出了沉重的代价，但渗透营销成功地为可口可乐争取到了全球最大的市场。


    # 第三个故事：开源和免费就是渗透营销


    DEDE、Discuz！一个开源，一个免费，它们就是在数以万计的免费用户中淘金，在免费用户中找到那里愿意花钱的用户。


    对于新出现的任何需要先付费后使用的产品，任何人都有着天生的熵竭感。但是开源和免费，让你失去了免疫力，你会信任它，只要产品好，你愿意向朋友、同事、客户去推广它。在你与同行的互动交流中，它就变成了一个话题，不知不觉被推广了出去，而如果你有支付能力，愿意购买付费的服务，它们就自动完成了销售。


    # 第四个故事：比尔盖茨成为世界首富的一个秘密


    欢迎使用 Windows XP、欢迎使用 Office 2007，尽管它可能是盗版的，但是你仍然可以使用它。当许多软件公司天天为盗版发愁，想着法子试图扼杀盗版的时候，微软公司却对盗版睁一只眼闭一只眼，尽管有时候偶尔发出声讨盗版的声音，但微软从来没有对盗版采取任何严厉打击的措施。


    因为盗版，就是比尔盖茨实施营销的一张王牌。微软与电脑制造商们签订协议，必须安装他们的操作系统，以最低价格，微软以捆绑销售的方式，将它的操作系统装入了所有电脑生产商的流水线。微软也将其实操作系统的细节告之众多的软件开发公司，让它们的软件适用于微软的操作系统。最终的结果，就是全世界的电脑上，都装着微软的操作系统。英特尔也采取了类似的策略，只要电脑厂商在各种媒体上刊登广告时，宣布他们的电脑装有英特尔的产品，那么广告费用将由英特尔承担，这一策略最终使英特尔的产品成为全球电脑芯片的最大赢家，彻底扼杀了一切可能对手。


