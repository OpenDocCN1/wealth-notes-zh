    # 问题软文


    # 什么是问题软文


    问题软文，就是提问题、解答问题，一个问题一解答，单独成篇。


    样例一：


    卓学课堂：什么是 SEO？


    SEO 是 Search Engine Optimization 的英文简写，意为搜索引擎优化，或简称“优化”。


    SEO 是指通过改进网站链接的质量和数量、以及有效的网页内容部署，使网站在搜索引擎上获得比较好的自然排名位置。通常情况下，在搜索一个“关键词”时，搜索引擎会排列出该搜索结果的相关网页，先出现的网站排名越前，网站所获得的访问量就越大。其中：


    65%—70%的上网者只访问搜索结果的第一页即 1—10 条信息。20%—25%的上网者访问者访问搜索结果的第二页即 11—20 条信息。3%—4%的上网者的访问其它所有的搜索结果的总和。


    做为重要的网站营销策略，网站经营者必须考虑搜索引擎如何工作，以及人们如何寻找网站。对于企业和商业网站，特别是销售网站而言，每多争取一个访问者，就意味多争取到一个可能的销售线索。优化网站主要涉及：网站内容及
    HTML 编码的特定关键词设计、消除有障碍的代码、调整链接质量与链接数量。


    样例二：


    卓学课堂：兼职个人站长应该如何建设自己的网站？


    问题：作为一个兼职站长，如何做出一个有特色、有收益的小站呢？如何让网站获得广告收入。


    朱则荣答复：


    兼职站长的特点是时间不多，在网站的持续更新上也存在很大难度，通常，多数人不能坚持下去。


    1、选择做网站的方向时，过大过空的目标是不现实的，比如将方向选为教育网站，就是不准确的，你没有那么大的猜力，做不了多久就放弃了，你必须找准确箭头市场，目标越小越渐'
  - '[PAGE 44]


    晰越好，比如只围绕语文课件、教育管理、微软认证考试等等专项的内容，务求把他们做精、做专，只围绕一个目标深入下去。


    2、在你选择建站方向时，要注意一点：什么人会投放广告？依托你的内容能够销售什么？比如“滑雪”，你可以找到这种杂志，仔细看看什么人在上面刊登广告，滑雪爱好者们又需要购买什么，你的网站做好后，可以与这些广告商直接联络。再比如美术考研，有很多辅导画院会刊登广告，我准人们愿意花钱的地方去做网站，事半功倍。


    3、在内容策略上，注意内容本身的价值，内容不在多而在精，不要放新闻或少放，在编发一篇文章时，要考虑这篇文章放在那里，是不是三年、五年仍然能够产生作用，被人们阅读，这样即使以后每天只更新三五篇文章，长年累月下去，将是一笔Verd，
    你的网站肯定是同类网站中最优质的网站，人们喜欢用它而且频繁地用它。


    分析：上述两则样例的文章，都以是解答常见的或实质性的问题为中心，这样的内容，非常具有价值，很容易被广泛转载。


