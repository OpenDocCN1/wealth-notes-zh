    ## 对互联网进行全覆盖是软文的最高境界


    覆盖这个词，过去很少有人说，也很少有人做到。覆盖事实上是一种高级的营销策略，它所达到的目标是长远的，一个产品在进入市场时，可能会“海陆空”全部动用，几种、十几种、甚至几十种营销手法同时攻击同一个市场，以强大的密集攻击强攻某一个领域和地区区域市场，


    完成百分之百的市场覆盖，一次就达到底定乾坤，事实上这种进攻手法很象我们常说的战术中的“攻城掠地”，只不过它是一种没有硝烟的战场，往深里说，它就是在打一场商战。


    被动就要挨打，市场就是这样，总需要有一些人以强硬姿态，强行攻击市场，这就是我们看到的激烈市场竞争，或者是商战风云。它是一种非常主动的战术，它就是在把市场的蛋糕不断划块吃掉，市场最终成功者就是他们。


    用软文实施覆盖，往往会出现一场奇迹。很多人可能还记得《英雄》，这部糟糕电影，却创下了辉煌的票房纪录。它是有史以来第一个中国电影市场最成功的票房，有着糟糕动作片的一切特征——弱智的故事情节、失真的动作设计、装腔作势的台词，但这部糟糕的电影，上市20天就创下了超过2亿元的票房，而该年度风靡全球的《哈利·伯特》，在中国创下的票房仅为6300万元。


    让《英雄》成功的，不是由电影的精彩，而是由于营销策划、市场推广的创新。《英雄》组成了阵容强大的明星剧组，早在2001年初，新画面公司就开始借助团队的明星效应，持续制造新闻。在媒体的支持下，这些“新闻广告”高强度持续进行了两年时间，终于让大亏中国人按捺不住，走进影院观看这个中国有史以来营销最成功的电影——也许还是最糟糕的动作片之一。


    ## 软文覆盖的执行


    第一：顶级产品。企业只生产一种产品，而且它必须是有足够高利润的顶级产品，专门满足某个特定市场)，一切经营活动统统以这个特定的市场为中心，集中精力经营这个市场。一般实力薄弱的小企业往往会选择这种策略。例如企业只生产小型柴油机，专门满足本地市场，例如只推广QQ头像图片网站(包含头像制作业务)，不要管市场中已有多少竞争者，你的价格要比他们更高，服务比他们更加精确，产品要比他们更加专业，你的任务，就是在这一产品上，把所有竞争对手统统打掉。


    第二：切分用户。比如网络硬盘，它的重度用户，就是经理人、设计师等拥有稳定高收入的专业人群，他们愿意花更多钱满足他们安全存储大额量资料的需要;大学生、草根网民、旅游者等等都轻度用户，偶尔使用，不愿意支付高昂费用，偏爱免费网络硬盘。你必须分清楚愿意掏更多钱的用户在哪里，只盯他们，对大学生、草根网民、旅游者等等轻度用户坚决放弃。


    第三：最专业公司(网站)。不要什么产品都做，你的目标只能盯一个特定的市场，而且务必要包装成这个领域极专业的公司(网站)。比如，针对儿童市场提供专门的玩具或家具、教具，比如针对女性白领(Office
    Lady)提供化装指南的网站。


    第四：全面覆盖。可以从局部覆盖，可以从某类网站的栏目开始覆盖，步步为营，直至完全覆盖目标用户群所在的所有媒体、网站。


    ## 软文覆盖的特征


    发展 1 万名专业顶级付费用户远比发展 10 万名没有目的的的付费用户更容易。1 万专业顶级付费用户的黏性更高，盈利能力更高，更能奠定牢固的市场竞争地位，成为不少行业用户排他性的首选，消费者的选择是排他性的，而且企业几乎在这些领域不存在竞争对手。但企业似乎更愿意浪费精力去争取
    10 万名没有目的的用户，和数以千计提供同样服务的对手争抢对手。


    ## 价格策略


    产品价格应该更为昂贵，比当前同类产品价值高出 50-100%，甚至更高。


    ## 先切大块


    用软文实施覆盖，要先切出几大块，定出整体战略方案，再行细分具体子项目和执行方案。


    ## 覆盖频率要达到一定强度


    覆盖是一种对市场的强攻策略，而强攻就要求火力要猛、力道要足、弹药充足。因此强覆盖本身就是要做充足准备。


    ## 个人操作版：为什么你的名气大


    你不一定了解什么足营销，你可能根本不懂什么足搜索引擎，但是，你必须让自己成为网上的一个焦点！


    在过去的时候，你写过不少东西，自己的心绪、感受、一些见解，但并没有多少人注意到你，懊悔心了；也许，你从来就没有写过几篇，但若有着那寥寥无几的读者，引发不起你写作的兴趣，你根本提不起精神去写。其实最关键的，你没有掌握覆盖的神来之笔。


    文章在网上的传播速度是非常快的，如果你的观点足够地引人注目，足够的对他人有启发，这就足够了，但你必须把它做成短篇，这是一个很奇妙的变化。这一点我说了很多次，每篇文章只写几百字，关键是量。


    ## 排山倒海之势


    物以类聚，人以群分，在网上，有很多网站接受投稿，它们不会给你提供稿费，但却可以将你推火。


    你也可以把文章张贴到众多著名的论坛。但最引人注目的，就是某个网站的首页突然出现三、五篇，三、五篇地出现以你为标题的文章，看过其中一篇的，会打开其他几篇进行阅读，你可以将文章分成一二三四五，也可以每篇单独标题。


    ## 例一，一连串的文章标题：


    卓学管理学派：向全国的小型企业致敬


    卓学管理学派：营销补课 时光倒流一百年


    卓学管理学派：掏头看管理


    卓学管理学派：进退维谷小型企业


    卓学管理学派：独立领导人


    ## 例二，一连贯的文章标题：


    卓学管理学派：销售网站迷途中的消磺(连载一)


    卓学管理学派：销售网站迷途中的消磺(连载二)


    卓学管理学派：销售网站迷途中的消磺(连载三)


    操作要诀：在其他网站和论坛上发表，每天所发的篇数最好不要超过五篇，而且每一篇要有实质的内容、见解，否则，会被当作灌水贴，被管理员无情地删除。如果是你的博客，那么现在就动手，将你的博客上原来的杂草全部消除，清空你的博客，按这种连串文章的方式，准备上三五十篇，再重新发布你的博客。否则，你不会有什么影响力的。


    ## 接二连三的注意


    如果你每天能这样坚持地在推出三五篇，不出一个星期，就会在一些网站和论坛上成为知名人士，大家都喜欢吞你的东西，所有人都会认识你。


    而更重要的是，撞车的现象会出现


    网上有很多training？网上有很多...实际上原文：网上有很多... 网上有很多人有他自己独立的圈子，有他每天必访问的网站和论坛，如果你的文章都是围绕某一类的主题，比如这一周谈论的都是关于网站经营方面的，那么就会有很多人转载、摘录你的文章，张贴到他们自己那个圈子里去。


    如果张三刚刚转载完你的一篇，抬头一吞，李四怎么又从其他地方转载来你的一篇文章，他们心里会怎么想？你即使从来没有名气，他们也知道你的影响力了。在他们眼里，你很快就足声名鹊起，成为一个专家。


    噢!原来那就是卓学管理学派，不多久，一个又一个圈子里的人都知道你的品牌或你的大名了。


