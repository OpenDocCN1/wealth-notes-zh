    有很多 人问：写软文用来干什么？大部人的回答是：推广网站。也有好些人一若是软文培训，那就不：“路过，闪人”，或者是“没兴趣。”我们今天首先讲的就是：即时写作收入。也就是
    说直 接用软文创造收入。特别月收入低于5000的站长可以重点注意一下，年营业收入高达一亿的网站，也可以重点留意一下。很多站长都在反映自己的网站发展似乎穷途末路，网站转型该如何转，抛网站联盟，站长特别是小站长，该上哪儿吃饭去。我们说，SEO不一定能解决这个问题，但写作却有可能解决掉你的发展问题。因为软文写作，更看中的是直接收入，而不是流驻。


    # 讲十个故事


