    ## 网上登龙术


    ## 朱则荣网上写作论（一）


    你的手掌上没有“笔下生花”的<|start|>纹，这并不代表着你不能拿起键盘做武器，为自己开天辟地，横扫六合。网络的世界里任由你去征战……


    ----朱则荣


    这是一个完全精华版的辅导课程，也是网上登龙术的必参，由管理科学家朱则荣撰写。你之所以在网络上不怎么成功，原因就是----言微而人轻！而这份课程就是教你创作如何能被自动传播的文章。


    - 一、从现在起，不管是在你的网站、论坛还是博客上，你的文章都将象流行趋势一样，快速地被人传播，甚至，你连网站都没有，却很容易出人头地。

    - 二、如果你是一名站长，如果你在网上做生意，如果你拥有的自己领导的企业在网上取得成功，那 учеб阅读它吧。这种以游击营销攻houd网络的方式，对你极为有效。甚至，你不需要花费一分钱，低成本地炮制出你的网上优势。


    ## 网上写作论之一：课程阅读指南


    ### 不知道怎么写？


    网络是一个没耍胡扯的地方，华丽的文学在这里没有地位，胡侃几句的文章却大受欢迎。在许多时候，你都有一股想去写两句的冲动，放在你的网站上、你的博客上，甚至别人的论坛上，不管会不会写，总之就是想表达自己的观点、看法，这，就足够了！


    记住!你不是在推销正儿八经的文学，你推销的是自己的经验和观点，管它是不是有语病，管它是不是通顺。你并不需要掌握多么高深的写作技巧，但是你必须清楚一些秘诀，否则你写的东西将象孤翠一样，孤零零地长在角落里，没有人去理会。


    ### 如何学习？


    - 1、如果你以前在网上写过一些东西，或者原本就对写作有兴趣，那 thick就从头看起。

    - 2、从米没写过，不知道该如何下手。停！不必再往下看，直接翻到第四十八讲，阅读我给你准备的写作模板，很简单。当你对写作产生了兴趣，再从头仔细阅读。

    - 3、没有时间阅读，挑你感兴趣的章节标题直接去读吧。


    ## 网上阅读的弊端


    网络阅读往往一日十行，眼晴一扫而过，一个晚上可能读掉几十万的文字，根本无法消化掉，这份课 程，你读得时候尽可能慢一些，把它消化掉，变成你自己的一种能垃。


    ## 网上写作论之二：为什么你的名气大


    你不一定了解什么是搜索引擎，你可能根本不懂什么是 SEO，但是，你必须让自己成为网上的一个焦点！


    在过去的时候，你写过不少东西，自己的心情、感受、一些见解，但并没有多少人注意到你，最终灰心了；也许，你从米就没有写过几篇，但看着那黎黎无几的阅读者，引发不起你写作的兴趣，你根本提不起精神去写。其实最关键的，不是写与没写，而是网上从来没有这种专门指导你写网上文章的资料，你无法掌握到网上写作的秘密。


    ## 创造一个搜索引擎关键词


    给自己起一个特殊的网名，或者笔名，给自己的网站和博客起一个生僻的名字。不管这些名字好记还是难记，但要注意的是，你要从搜索引擎上去搜索一下，确保这个名字没有人使用，当你在百度上输入这个名字的时候，搜索引擎告诉你，没有相关网页，甚至只有零星的网页。这是成功的兆头。


    随着你的文章越写越多，你会发现，搜索引擎上关于你的网页数量在成倍的增长，而且：


    - 1、在向你的朋友介绍你自己的时候，让他们去搜索引擎上查一下你的名字。

    - 2、在你应聘工作、招揽生意的时候，让对方去搜索引擎上看看你辉煌的事实。

    - 3、你可以给看上的美女介绍你，你可以向投资商推荐你自己，这都是你特有的资本。


    朱则荣语: 让搜索引擎为你创造结果吧!把自己变成一个关键词。看着网上越来越多的地方出现着你的名字，你的心情一定会非常棒，在搜索结果不断成倍增长的时候，成功指日可待，这就是你!你所创造的影响力!你可以向任何人去炫耀，作为打通各种环节的资本!


    当电话的那一头，我还要费力的去向别人解释我的公司与产品如何如何的时候，你却可以让客户随时到网上搜索一下，他立即就惊讶，他发现你的实力太强大了！


    真是不可思议！对吗？小小的思想改变，会为你增色不少，朱则荣在研究人们之所以不成功的时候，发现了一个人们最困惑，但却解决不了的问题：那就是--“说服”(拼音念成：Shui
    Fu)，说服就是纵横术的核心：


    ## 让搜索引擎为你作证


    用搜索引擎为你作证吧，用事实说话，这就是说服！现在就去改变它，去和朋友们讨论一下，给自己创造一个在搜索结果上从来没有出现过的名字吧！那就是最特殊的你！龙生九子，子子不同，你就是你，最独特的独一无二的犬之骄子，为什么要让网络把你淹没呢？


    ## 网上写作论之三：我该去写什么？


    ## 网站的支柱文章、旗舰内容


    事实上，任何一个想要有所成就的网站、博客，都需要支柱文章与旗舰内容。去专门围绕某一个话题展开，精心组织撰写，或编辑内容。


    每天都有不少人发愁自己写的东西没人看，自己的才华无人欣赏，自己的网站访问者少，自己的企业推销做不到走上正轨，而自己的博客有如荒漠，似乎这个问题难住了每一个人。不管他原本是著名高校的学者，还是精明至极地商人，或者是刚涉入网络的英姿少年，都被这些困惑缠住，象一团乱麻一样，解不开，理还乱。


    别说是没有学习过写作的你，就是那些记者、作家们，一到了网上，也常常就不灵光了，很难立威扬长、显荣扬名，大量的文章依然被人们丢弃在那个不知所在的角落里，无人理睬。


    ## 这里头到底有什么玄机？


    我们在课程的开篇就已经说过：网络阅读的弊端，常常是阅读者一目十行，即便你的文章写得再好，人们也不会对你留下丝毫的印象，看过去了，也就忘了。只有一种方法，能让人留意到你：那就是足够多数量的网页不断地提及你。没有这个作为基础，你在网上就成了孤家寡人。


    而对于想在网上做生意的人来说，不react开店也好，还是企业销售也罢，网络一直是一个 bolo 找零张，以低成本游击营销作为主攻的战场，而当你不懂得这个游戏规则的时候，网络就将吞噬你所有的努力，进退<|message|>谷，而又不得其法。


    ## 网上写作论之四：奇妙的网上文章传播轨道


