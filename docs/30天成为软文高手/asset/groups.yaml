    # 热门软文


    # 什么是热门软文


    热门软文，是围绕热门话题、热点新闻、热点事件、热点话题所撰写的文章，以评论、追踪观察、揭秘、观点整理、相关资料等方式写作的软文。


    # 样例一：


    # 天天时评：神木坚守免费医疗是最佳的答案


    寂寂无闻的陕北小县——神木，由于在全国率先推行“全民免费医疗”而声名大噪。这一惠民政策实施近3个月来，伴随着不少的质疑之声：该县财政实力能否支撑下去？会不会是一个“鸟托邦”？甚至还有人怀疑当地官员作秀。对此，神木县委书记郝宝成给出了这样的回答：财力不是问题，外界所说的压力无从谈起，免费医疗政策将坚定不移地推行。


    在看病难、看病贵的现实中，人们对这突如其来的幸福有些措手不及，难免产生不真实感。何况，一стью以来萦绕国人耳际的，总是“医疗投入不足”、“财力有限”之类的消极
    ngữ语。现在，神木县官员颇为自信的回答，有理由让我们扭转质疑的方向——神木县能够做到的事儿，为什么其他地方做不到？


    神木县的医改告诉人们，所谓财力不济之类的借口，并不适用于民生工程，关键还得看执政为民的决心。如果每个地方都像神木县那样步伐一致地行动起来，医疗改革遇到的困境与质疑自然会少得多。实践证明，通过“基本医疗保险基金+合作医疗基金+社会募捐资金+财政拨付资金”来解决百姓免费看病问题，是行之有效的。不仅仅是那些经济发达的地区应当从神木县的经验中受到启发，经济欠发达地区同样可以从中领悟改革的内涵所在。


