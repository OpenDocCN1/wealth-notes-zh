    # 数据软文


    # 什么是数据软文？


    数据软文：以分析数据、统计数据、调查数据等资料为基础的文章。


    # 例文一


    # 调查显示中国人仍局限于“亲缘社交”


    中国著名民间调查机构零点公司近日发表的一份调查报告显示，大多数中国城乡居民不善于社交，尤其是her不擅长与陌生人打交道。报告显示，尽管中国居民沟通指数的总体得分为
    69.32 分，较上年增长了 3 分，然而，距离商沟通水平仍有较大差距。中国人仍然局限于“亲缘社交”，而对以陌生人为主体的“社交外圈”的社会资本的利用明显不足。


    虽然有七成以上的受访者表示了很强的结识陌生人的愿望，但仅有不足四成认为自己擅长和陌生人打交道。调查显示，受访者希望平均每月结识 3 个新人，但实际上四成以上的人在过去一个月内没有认识任何新人。报告将其归结为中国居民与新人交往的能力不足，结识陌生人的机会较少。


    调查指出，亲戚家人仍是中国社会资本的主要来源；中国人对于本该更具有资本价值的社会交往圈利用不足。大量的社会网络都属于无效浪费状态，而对亲缘圈却赋予了过重的角色和期冀。


