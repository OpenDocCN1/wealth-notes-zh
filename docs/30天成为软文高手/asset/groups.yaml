    图：百度新闻搜索条目后面的“新闻源”


    通常，一篇文章被新闻源推荐，被百度新闻或 Google 抓取后，会取得不错的推广效果。新闻和资讯网站通常会订阅、定时查阅这些资源，在百度新闻和 Google
    资讯出现的文章，通常有非常不错的转载效果。


    因此你要想方设法让自己的文章出现在这些“新闻源”的网站上。


    ## 软文定向跳转


    例如，你是一家旅游网站。如果想让媒体关注你，或者想要寻找更顶级的行业网站来关注你，用普通的推广方法，可能非常困难。你写的文章并不一定被这些重要的网站转载，在这种情况下，你要把自己变成一个有案例，如《某某旅游网的电子商务主张》、《旅游网站服务客户三要素》，将它们发表在转载越较高的
    IT、管理等网站上，那么，你行业间的高端媒体和网站可能会通过这些 IT、管理网站进行再次转载。


    ## 多研究关键词


    关键词研究，将平衡你的软文关键字。如果你不希望自己写的文章所要体现的关键词被搜索引擎忘记，那就要多注意关键词，以及关键词的搜索结果。当一个关键词有 80 多万页的结果时，你的文章关键词排名将比较困难。


    ## 找到更好的软文写作观点


    写好软文，需要大量的新动态、新事件、新观点进行触发。你可以使用百度新闻或 Google 资讯的订阅功能，定阅一些指定的关键词，每天定时发送到你的邮箱。比如你的网站是关于“科学家”的，那么订阅“科学家”这个关键词，随时帮助你产生更为快速的写作灵感。世界上没有几个擅长软文写作的人是在“闭门造车”，他们通过大量阅读指定内容的报纸、新闻信息，来触发大量的写作灵感。


    ## 用软文销售产品


    ## 成功建立一个用于产品销售的网站


    为了在网上获得生意成功，网站是必须的。这种投资很有必要。但是，有一些重要的原则需要遵循。


    - 即时销售网站


    怎么让网站实现即时销售，快速让客户做出购买决定，这才是我们考虑的核心。即时销售网站的目的，就是直接地告诉客户买与不买，该如何购买。


    - 你的网上销售根据地


    你必须在网上有一个可以扎根的地点，用于扎牢根基，打好基础，这是网上生意成功的前提。


    ## 选择要出售什么商品


    选择在网上出售什么样的商品，要做出这个决定，你可能很困难。最常见的情况是：当你可能相中鞋垫艺术品，也有这样的资源，但当你再去想的时候，脑子又成了一片空白，你不知道该如何销售，你也不知道销售前景如何，最终，你高涨的热情又被你自己打倒。


    互联网上的一切，对于没有任何丰富经验的人而言，往往是一片未知的领域，出于对无限的憧憬与恐惧，矛盾的思维将会把你的一切想法压倒，因此你往往很难做出任何明确的决定。


    当你要下定决心在网上进行销售时，就要多方面考虑，你到底喜欢销售什么，你的兴趣究竟是什么，最终驱动你在网上获得销售成功的因素，不是因为它能够赚钱，而是因为你喜欢销售它们，你的乐趣将促使你忘记一切辛苦，不知疲倦地在网上劳动。大部人开始在网上销售商品，都不会采用花钱打广告的方式，而是用自己的劳动开垦荒地，这是一项枯燥冗繁的工作，如果你没有足够兴趣，将很快放弃你的想法。


    在网上销售，最重要的成功，是为自己的商品销售找到一条有规律的发展途径，专业术语，叫做完整产品销售流程，什么时候把它能够固定下来，什么时候你也就打开了销售局面。考虑以上因素。


    ## 活用销售标签


    这是一种重要而且高明的方法，但很少有人使用这种高明的方法。一个典型的个人标签是：

    “张雨是一个喜欢宠物，对猫咪的饲养有着五年半丰富的经验的女孩子，她在各种宠物网站上发表过

    多篇文萃和心得，她的网址是：www.zhuoxue.org”


    个人标签很少有人使用，实际借助于个人标签，可以让人们更加了解你，人们买东西的时候更相信专家的说法，特别是有着类似经历的描述，容易引起客户的共鸣。经验有时是很值钱的，但一定要让人们知道你所拥有的经验。这是一笔财富。


    ## 建立你的网上销售根据地


    网上销售不能够打一枪换一个地方，有很多人以为，在网上做销售就是在淘宝、易趣开个店，但我们注意一下：


    ![](img/9c5a94eedde119b872450b830636a0d0_107_0.png)


    图：一个随机从淘宝上截取的网页


    在这个网页中，我们可以发现，信息量非常的大，如果用它来给自己做推广，那么至少你花费的 90% 的力量，都是在给别人打广告。


    建立一个网站是很容易的，但最难的是以什么样的思想来运营你的网站，大部分 的网站在销售上是失败的，你必须记住这个教训。


    ## 清楚你的目标


    你的目的不是为了建立一个看起来很大的门户网站，你也不希望为它建立几十个栏目，增加数以千计的内容。这是一种愚蠢的想法。当你的网站提供的内容越多的时候，越容易遮盖住你的商品光芒，你让你的客户象进迷宫一样跟你“躲猫猫”。网站内容越多，流失的客户也将越多。


    不要被网上那些花里胡哨的网站搞乱了头，一得知自己要建立网站，马上就想起建立一个特大的网站。你必须搞清楚一点，你的目的就是为了销售商品，就这么简单，用最简单的方式来建立一个简单的网站。


    ## 你的网站是为了诱发购买


    传统的观点认为，建立一个网站，就是要把所有的产品，都列在网站上，方便访问者从中挑选，而且这个愚蠢的思想，也影响了许多开发网上商店技术的人，误以为网上开店就是展示商品。


    你注意过那些生意非常好的超市和街头特色店没有，他们用来招揽生意的，不是货架上的那些商品，而是对最新最热门商品的广告宣传。其正引发你购买的是这些招揽广告，在商场购物时，你最留意的就是这些信息。


    ## 即时销售网站


    我们现在来考虑网上销售的问题，请观察一下网站：


    在这个网站中，我们可以发现，它灵活地使用了多张图片，告诉你孩子需要哪些产品，它就像一张你在街头上看到的传单，能够快速引发你的购买兴趣。


    你再回想一下你在网上看到的大盘网站，它们复杂而且内容很多，其致命性的缺陷，就是不能和这个网站一样，快速吸引你的注意力，简单而直接地告诉你该购买什么，该如何购买。


    其实，这就是一种客户心理，客户大多喜欢干脆利索，你能卖给我什么，多少钱我能买到，客户就想要这个简单的答案，没有必要把一切搞得异常复杂，像猜谜一样让人不知所云。


    这种网站，就是即时销售网站，让你用最短的时间，快速做出买和不买的决定，仅此而已，不需要太多花哨的内容，也不需要多少说明的信息。


    这样的网站，通常只有一页，或者简单的三五个网页。制作一个这样的网站，也仅仅需要几百元而已。但正是这样简单而快速的网站，所产生的销售效果却是惊人的。它不会告诉你更多复杂的信息，只有最简单的几个产品，让你能够从快做出选择。


    一款用于皮鞋也可能就提供这样简单的信息，足以。


    ![](img/9c5a94eedde119b872450b830636a0d0_110_0.png)


    一个用于推销商品的网站也如此简单。


    ## 批量写你的软文


    接下来工作，就只剩下吸引用户，你可以建立 QQ 群、开通博客、让用户留下电子邮箱，写软文来收用户就可以了。或者，制作电子书、定期发布电子杂志，在这些内容中直接带上你的网址，行动吧。


    www.zhuoxue.org


    ## 用软文创造品牌


    ## 软文推广项目


    本课程模拟了一款产品:卓学网盘,设计了全套品牌推广方案。


    ## 卓学网盘软文推广方案


    简要目录


    - 一、现行经营趋势测算

    - 二、经营策略调整

    - 三、重新定位

    - 四、发展战略

    - 五、用软文进攻市场

    - 六、软文推广方案


    ## 一、现行经营趋势测算


    以现行经营策略。


    卓学网盘网站访问量

    每日 10000IP

    付费用户/访问者

    成交率在 0.1-0.5%

    日营收

    500-2000 元之间


    注册用户（免费试用）

    每日 10000 人次

    付费用户/注册用户

    成交率在 0.8-2%

    日营收

    3000-7000 元，约 5000


    用户成交比率中，月付费用户、年付费用户、高额付费用户比率为 3：5：2，即每 10 人中约 3 人使用月付费，5 人使用年付费，200-500 元用户为 1.5
    人，500 元以上用户 0.5 人。


    在经营策略上，即使每天有 10 万人访问网站，或每天有 3 万人注册免费试用，年营业额不过几百万元。前提条件还必须是拉动每天 10 万人访问或每天 3 万人注册试用。


    ## 二、经营策略调整


    公司应以专业级市场、概念运作为主，旨在市场规模性圈地，早日先行上市为主要目标。公司的赢利方式为奠定网盘市场龙头地位，IPO 后，融资资金退出，数倍获取赢利。


    ## 三、重新定位


    卓学网盘应定位为：中国最顶级的专业级网络硬盘服务商，服务于职业经理人、中高级白领、设计师、学者等中高端人群。


    明确定义为：


    - 顶级经理人网盘：适用于中高级职业经理人、企业管理者、中高级白领。

    - 顶级设计师网盘：适用于建筑设计师、平面设计师、艺术设计师等中高级设计人中。

    - 顶级文化艺术家网盘：适用于作家、画家、书法家、摄影师等大容量资料存储用户。

    - 顶级学者网盘：适用于教授、科学家、研究员、学者、博士等学术研究人员。

    - 顶级企业级网盘解决方案：适用于大型、中型、小型等各行业企业。（说明：大型企业集团事实上由多个中型、小型企业组成）


    ## 用户群切分：


    集中全力发展经理人、设计师等拥有稳定高收入的专业人群，满足他们安全存储大量资料的需要，以重度网盘使用者为主要用户群体。放弃大学生、草根网民等轻度网盘使用者。


    ## 高盈利状态：


    这已经不是一个寻找廉价网盘的时代，便宜意味着产品品质不高、售后服务状态不佳、用户购买时顾虑重重。人们都在寻找最好的网盘，愿意支付更多的钱来购买最好的，但进入的企业偏偏不能提供最好的，只是一味提供越来越便宜的。


    ## 没有竞争的竞争：


    发展 1 万名专业顶级付费用户远比发展 10 万名漫无目的的付费用户更容易。1 万专业顶级付费用户的黏性更高，盈利能力更高，更能奠定牢固的市场竞争地位，成为不少行业用户排他性的首选，消费者的选择是排他性的，而且企业几乎在这些领域不存在竞争对手。但企业似乎更愿意浪费精力去争取
    10 万名漫无目的的用户，和数以千计提供同样服务的对手争抢对手。


    ## 价格策略：


    产品价格应该更为昂贵，比当前同类产品价值高出 50-100%，甚至更高。


    ## 先切大块


    本次软文品牌推广，先切出大块，upp 建议整体战略方案，再行细分具体子项目和执行方案。


    ## 四、发展战略


    用软文创造品牌，用软文制造上市公司。


    公司的目标应该是建立网盘领域最好的品牌、最大的公司。并在进行这种舆论铺设时，有明确的上市打算，或着手以“最专业最大的网盘服务商”概念寻求上市。


    公司可以先行上市，再建立其它专业公司，寻找更多领域的发展，图谋更大市场。


    额外服务：国内创业版上市全程协办，可提供证券机构、证监会等资源支持。


    ## 五、用软文进攻市场


    软文品牌推广策略，带有明确的市场进攻性。除适用于产品和企业自身的宣传推广外。更应采取一定策略，用一定的“由头”来快速建立市场影响力，完成市场覆盖。


    策略一：可以采取“百万经理人网盘赠送计划”，即向职业经理人、企业管理者、中高级白领等，经信息验证后，赠送为期一年的网盘使用时间。采取这一策略，主要是让使用者向网盘中大量存储资料，在他们存储了一定数量、规模的资料后，使用时间到期，就不得不购买付费服务。操作要点是：赠送期不能太短，如果仅仅赠送半年或更短使用期，用户会感到时间很紧，还没有存入多少资料，就要停止使用，他们会非常谨慎使用，以免重要资料发生丢失。该策略也适用于设计师、艺术家等重度网盘用户，网盘经营的关键是用户大量向内存储重要资料，后期就不得不被动使用，而且长年持续使用，如果用户没有存入多少重要资料，他随时会放弃使用，转向其它品牌的网盘。


    策略二：“卓学网盘杯”网上书画交易心得大赛、“卓学网盘杯”互联网设计师名人大会、“卓学网盘杯”网络作家成名奖……公司应开展多项与直接目标客户对接的赛事活动，与专业网站合作，向行业用户大量渗透品牌影响力，定向捕捉专业用户。操作要点是：先入为主是捕获专业用户的最佳方式，举办赛事，提供奖金和奖品只是一种策略，最主要的目的是在庞大目标客户中奠定卓学网盘的专业级顶尖形象、定向市场地位，催使行业用户大量使用，并规模扩散，最终黏附这些领域的大量用户，成为这些行业用户唯一的或首选的网盘服务商，这种选择通常是排它性的，而且这些客户能够成堆成片开发。它有一个蝴的基础，一旦某一行业用户超过10000人使用了某一种品牌的服务，那么会在行业用户的聚会、讨论、交流中，大批地成倍增加付费客户，年年占据行业的市场地位。


    策略三：卓学网盘蓬勃发展顶级专业级地位。卓学网站的市场动态、技术动态、领导人观点、管理特点、客户证词等，要定向向IT媒体和VC投资领域的媒体大肆传播。一个100人的企业，我们要让它看起来象蓬勃发展——在冲刺世界500强的伟大公司。媒体操作要点，无论对于IT媒体还是对于投资媒体，卓学网盘的目的不是拉拢客户更不是介绍产品，而是向媒体告之卓学是一家飞速发展的闪亮明星，是网络硬盘市场中最大最有实力最有前景最有冲击力的公司，它必须先声夺人，牢固占据这样的市场地位，让任何人看起来，卓学网盘是无可匹敌的，是行业老大。


    策略四：被频繁使用，而不是产品有什么功能与优点。通过向大批网站、论坛铺设的软文，明确告之用户的是，是大家都在高频繁使用卓学网盘，在卓学网盘用中享受使用的快乐、资料的安全、朋友介绍朋友再介绍朋友，大家都在使用卓学网盘，都是卓学网站的忠诚用户。操作要点：要建立最广泛最大规模被使用的用户基础，讲功能讲优点，是在和其它竞争对手在比技术，在做直接竞争，而且也是在和开心网、网易等大型的免费网盘在竞争，必须避开锋芒，谈客户的最终占有率，谈最大的用户群体，谈最高端的形象，永远不要言及网盘本身，要把它视做一种解决方案，到底有多少用户喜欢使用它。“谣言重复一百遍就是真理”，它必须通过舆论制造这种非实基础。


    ## 六、软文推广方案


    软文推广必须言之有物，即有一定的话题“由头”，方能从不同的侧重点建立子项目，全面围攻市场。否则，软文是苍白无力的，它只能漫无目的地拉拢一些无效客户，既无法奠定市场地位，又无法与大的竞争者，如网易等免费网盘体现出特有的优势。


    本次软文推广，建立在上述四个策略基础之上，分层包干，定向执行。公司应赞成使用该策略的全部或某些环节，并支持这些策略顺利展开，在双方明确推广策略的基础上，制定更为详实的推广与执行方案。


