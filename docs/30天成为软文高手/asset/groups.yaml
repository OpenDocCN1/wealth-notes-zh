    ## 炮制软文


    ### 什么是炮制软文？


    炮制软文就是轻松、快速地成批扛写作。


    单独地讲炮制软文，一般人没有这个概念。我们举例而言：我一天写个五篇八篇文章，或者写个万儿八千的文章，很正常，很轻松。这就是炮制的概念，写文章象“玩”一样，既快速又轻松，正所谓“下笔如神注，洋洋千万言”。


    那么，如何达到这种状态呢？


    ### 从抄书开始


    抄书？有人就开始琢磨了？抄书和写作有很大关系吗？难道写文章就是靠抄？


    我们说，根本不是这样的，抄写实际是写作的积累过程，也是必经的快速学习过程。我们写文章，要想能够快速写作，脑子里要有“货”，你能不能坐在那里，什么书也不看，什么资料也不查，敲起键盘，哗里哗啦地一会儿会儿就敲出几千字？


    你肯定会说，我办不到，要真能这样——那多好啊？


    因此我们要说，抄写就是写作的前提，也就是说，大匠的写作，是建立在大匠抄书的基础之上。早年的时候，我有一个习惯，就是特别爱抄书，有一次，在父亲单位的会议室里，我发现了几大文件柜的文件、资料和报纸、杂志，我看见它们就心痒痒，但要据为已有是不可能的，但要快速看完也是不可能的，那怎么办呢？


    抄！为了在短短一个暑假抄完这些资料，我那一个暑假基本就是把自己关在会议室里，用了父亲单位办公用的记录表格，那都是一本一本的，我把它们翻过来，用背面抄。我翻开一本本、一张张的报纸、杂志、还有文件和通知，把那些认为对自己有用的精华往下抄，用只要自己能看懂的文字快速地抄。用了两个月的时间，嘎是抄完了几大文件柜的资料。


    以后，这种习惯便养成了，我抄了整整九年，而不是写作九年。后来的几年，几乎所有的钱用都用来买书、买资料，到处搜集各种管理资料，跑去卖废品的时候，看人家那发臭的废纸堆里似乎有一些值得可看的经济报纸，那真是如获至宝，二话不说就去翻，翻出来再花钱买回来，以至于那些年，跟很多卖废品的都成了朋友，他们只要收到大批的图书和报纸，第一时间通知我，我先去翻一翻，看看有没有自己有用的。


    那个时候，抄书做笔记，根本不是用写了几页、抄了几本来表达的，而是我一百本、一百本的从印刷厂给我专门印做笔记的记录者，一年废掉三五支钢笔是很正常的却情，而每年卖掉的用过的资料要用“百斤”来做为单位。


    也许这样的过程，不为人知，很多人也感觉很笑，但学习确实是这样子。所以说终，我不是企业家，而是一个学者，而且是个穷学者，这一辈子的积累基本上都用来买书、买资料、做实验上了，所以我没有钱，特穷而且非常穷。也许有人认为，这人是没本事，而有人则认为，这家伙简直是个“活图书馆”，大脑中有着无比丰厚的知识宝藏。当然，很可惜这些抄下来的笔记后来因几次搬家，都销毁或卖废纸了，否则今天看来，即便这些抄下来的笔记，也是一座知识宝库。


    ### 快速写作


    有这样一种抄书的经历，大家也就明白，写作其实是一种整理思维的过程，你大脑中有丰富的知识，那么写作就会信手拈来，一笔而过，如果知识量不足，还要一边想一边写，那么写作就会是个头痛的境况了。


    ### 快速写作的前提：多做准备


    我们常说，磨刀不误砍柴工。写作也是一样的，要达到快速写作的目的，需要从三个方面着手。


    ### 一是知识的积累


    不管你要写哪方面，都需要足够丰富的知识，才能够成为这个领域的专家，才能够有新鲜的思路、新鲜的话题、独到的见解。比如你决定写作的重点围绕“网站经营”，那么我们要问的问题是：你有多少网站经营的经验，你收集了多少例网站经营的例子，你阅读过多少本关于网站经营的图书，你知道多少种国内外网站经营的模式。如果没有这些事实为基础，文章是写不好的。


    我们可以看到，我们的同行所写的许多文章很“飘”，文章中的观点忽左忽右，文章中要表达的思想沉浮不定，文章总是在一个低水平的环节重复表达别人已经提过的观念和想法。这就足知知识不扎实的表现，当你对某些知识了解过少，底基不稳，思路不扎实，文章就无法“一语击中目标”。


    ### 二是写作手法的娴熟


    我们强调写作手法，这一点务必注意。就象武术，你必须熟悉几种套路，几种打法。在文章写作时，写作手法就是“功夫套路”，你在各种各样的写作手法中，寻找几种自己适合用，也喜欢用的“套路”，把它们固定下来，然后长期使用这几种固定的写作手法来表达，这样做的好处是，从一开始，在写作技巧上你就没有问题，从此写作时不再考虑怎么去表现、怎么去表达、怎么去描写，而只剩下给文章“加料”这一件事而已。由此，写作速度才能大幅提升。


    如果你没有娴熟的写作手法，在写文章的时候，常常会一边绞劲地想要写什么，一边又要考虑怎么来组织这些内容，一心两用，文章也就写不出来了。需要做出说明的是：有关文章的写作手法——固定的写作格式，以前没有人总结过。从一开始，我在写文章时，也根本没有人教过我，只是不断地在思考，在总结，似乎感觉文章中都可以找出比较固定的模板，不同的类型文章应该有不同的样板，随着不断地思考、揣摩，总算总结出了一些能够快速套用的写作手法。


    ### 三是资料的准备


    要写文章，手头需要常备很多资料，而且对很多数字、情况要“烂熟于胸”。比如你是一个单位的通讯员，那么单位的员工人数、发展史、上年产值、部门分工、产品特点、工艺技术、有关奖励、主要领导特点、客户分布等等这些数据，都要能够随口报出。写文章的时候，这些内容是随时要写进去的。


    此外，各种单位简介、组织改革、领导人变化迁、文件、工作计划、工作安排意见、工作总结、大事记、发展趋等等等资料，平时都在常备案头，对领导的思维方式和办事风格、对各部门的运行情况都要了如指掌。对它们极其熟悉，你才能快速写作。给企业写软文，或是给自己的网站写软文，不了解这些情况，怎么写？


    ### 下笔绝不能停顿


    写文章，有一点非常重要：即：下笔不能停顿，务必一气呵成。


    你正在写文章，有人忽然在后面给你说：“你这个字写错了”，如果你停下笔去改那个字，得，完了，你的写作思路彻底中断了。


    你正在电脑上写文章，QQ上一闪一闪的，滴滴咕咕乱响一通，一会儿有个人找你问句话，一会儿你杳一个朋友在不在线，你的文章就不必写了，指定越写越乱。


    为什么我们常说：作家都喜欢半夜写作。因为写作是一种精力高度集中的工作，始终保持顺畅的写作思路，务必一气呵成，也只能一口气写完。为了保证思维的连续性，作家就有一种习惯，比如不断的抽烟，一会一根，或者喜欢咬嚼口香糖，总之各有高招，来保证思维全力集中，脑子不至于疲惫。


    不论你怎样写，决不能让其他人或QQ等干扰思路，也不能被被文章中的难点阻碍停顿。写作中如果遇到不熟悉的事例、典故、数据、不会写的字，一定要跳过去，先不要去管它，先把文章框架粗略搭起来。写文章最忌讳的就是半路停下来，因一词一字阻塞了思路，打断了思维。对于逻辑是否清楚、语句是否通顺、措词是否恰当，都不要管，等写完后再回头修改。总之一句话，写作中千万不要停顿，一停一顿就完了，再续写就费劲了。


    ### 批量写作


    在学习批量写作以前，我们先来看两则样例：


    - 新东方拟“抄底”教育机构

    - 新东方雅思常见问题解答

    - 新东方名师解读司法考试新旧专利法区别

    - 新东方口译考试冲刺讲座 上外热力开讲

    - 新东方名士解读 2009 年司考大纲:知识产权法

    - 新东方新版雅思基础教材正式投入使用

    - 新东方名师详解 2009 年司法考试大纲商法

    - 新东方名师详解 2009 年司法考试法学基础理论

    - 新东方任命 CFO 谢东莹任国际总裁

    - 新东方名师详解 2009 年全国司考大纲

    - 视频:新东方名师赵磊解读 09 年司考大纲

    - 新东方名师指导大学英语学习注意事项

    - 新东方名师第一时间解读 2009 年司考大纲

    - 新东方任命公司 CFO 谢东莹担任总裁

    - 新东方雅思缤烁十周年盛典巨幕上海开启

    - 新东方任谢东莹为总裁 继续担任 CFO 兼董弋


    - 吊起来健身塑缇瑜伽

    - OL 桌边做瑜伽 轻松减减压

    - 5 分钟瑜伽教 OL 美背

    - 瑜伽不同姿势的功效

    - 瑜伽美颈雕塑身体

    - 瑜伽小姿姿 还你完美身材


    ### 备料


    要广泛地收集相关信息。文摘离不开文章——那些在各类媒体上已经发表的文章。媒体成千上万，文章浩如烟海，而所要摘编的相关信息就散落在这茫茫烟海之中。单看一两种媒体难免会孤陋寡闻，多看，尽可能地多看，方能搜取更多的信息。一个人的阅读虽总是有限的，需要借助于外力弥补阅读量的不足。可借助的外力有很多，比如，培养一支文摘作者队伍，求助于他们就某一个、某几个专题进行采摘，变一双眼睛为十几双、几十双眼睛。再比如，点击网上的相关连接，对某一个或某几个专题进行搜索，从中获取更多的相关资料，等等。当案头的相关信息堆成了小山的时候，下一步工序可以开始了。


    ### 筛选


    首先是粗选，即大刀阔斧地取舍。一方面，对信息进行归类，将相同、相近或相联的内容归纳在一起;另一方面，对重复的、相对比较浅白的和不适合的内容予以剔除。其次是精选，即留有余地切割。对粗选保留下来的内容再进一步地筛选，去粗取精，去伪存真，保留下最核心的内容。


    ### 加工


    加工，是文摘的高级阶段，其特点是综合性强、概括性强，要求具有很强的文字综合能力和布局谋篇的水平。对已发表过的文章进行编辑加工，决不是简单的文字删改和篇幅的压缩，而是一种复杂的高强度的脑力劳动。就加工前后文章内容的变化而言，文摘编辑加工就是将文章变成了素材，形成简洁的文摘卡。


    ### 从文摘到巨著


    19 世纪到 20 世纪，整个世界的学术界“欧洲中心论”占了统治地位。爱因斯坦也表示：“西方科学的发展是以两个伟大的成就为基础，那就是：希腊哲学家发明形式逻辑体系(在欧几里得几何学中)以及(在文艺复兴时期)发现通过系统的实验可能找出因果关系。在我看来，中国的贤哲没有走上这两步，那是用不着惊奇的。要是这些发现果然都作出了，那倒是令人惊奇的。”


    这时英国一位老博士表示了不满，他说中国的科技与文明是无比伟大的，推出了一部巨著《中国的科学与文明》，这位学者叫李约瑟。


    英国科学家李约瑟所撰写的巨著《中国的科学与文明》(即《中国科学技术史》)，影响了整个世界的现代中西文化交流，那么他是怎么写作这部巨著的?一方面，他不断收集资料，每周能收到朋友们四处为他收集的一尺高的新书，如论述宋代的瓷源、晋代、鞑靼的文官制度，关于道教等资料;二是制作文摘卡，他根据学科范围，缉辑资料文件夹、照片资料夹、附属文件夹，建立了一个庞大的资料存储和检索系统。由于这是第一次用西方语言写成的多卷本著作，因此每卷必须列出庞大的各种参考书目，他还特意编排了参考书目卡片索引，以备长期查证。此外，还编有其它专门卡片索引，如中国技术术语卡片索引，还有一个包括古代数千名中国科学家、工程师和医生的人名索引，最终这部巨著就是以文摘为基础形成的。


    ## 软文传播


    ### 软文的规模生产


    在《软文标准件》中，我们讲解了规模生产阶段：制作各种写作模板、标准套件、文萃建档，存在专业分工，有人专管收集素材，有人专管查实资料，有人专管改写拼装，有人专管媒体分发，流水线化作业。通过对各种模板的组合搭配，使软文口径统一，文章千变万化，成批量生产。


    同样一个话题，交由 50 位作者，可以瞬间变成 50 种不同的稿件，粉褶和主旨不变，但文章的风格、写作方向和内容，都已经发生了实质性的变化。同样一篇文章，交由
    50 位作者改写，瞬间也将变成 50 篇不同的文章。


    各企业在举办新闻发布会时，通常会向参加新闻发布会的记者提供“新闻稿原始稿件”，通常有五至十篇以上，由不同的作者完成，风格手法不一，各媒体记者收到这些原始稿件，会围绕不同的侧重点继续进行采访、加工，也会再加入企业介绍、企业荣誉等不同的背景材料，因此变成数十上百种、千变万化，但又口径统一的宣传稿件。


    思考：最终，围绕一个事件，我们为什么会在网上及各种媒体上看到数以百计甚至数以千计不同的报道、追踪报道？


    ### 软文的传播介质


    我们将媒体分为主媒体、次媒体、边际媒体


    主媒体：中央级媒体。


    次媒体：地方级媒体及行业媒体。


    边际媒体：各种企业报、内参、资料、简讯及各类中小网站等。


    ### 软文的二、三层次生产


    我们可以思考一下，任何一个新闻事件，都会先由主媒体进行报道，次媒体及边际媒体进行传播报道。那么：


    第一个问题：文章必须先发往主媒体，才能形成扩大范围的转载与传播。


    第二个问题：次媒体，也就是省市等地方媒体及行业媒体，同样拥有大旺的专业记者、特约通讯员及评论员，他们是不是也要对新闻事件进行加工整理、引伸报道、或者发表各种评论？


    第三个问题：边际媒体，诸如每一家企业报、各类中小网站，是否也拥有大丛专业写作者，以及大强的写作爱好者？它们是否会对新闻事件进行引用、评论、改写、组合？


    因而我们可以得出结论，事实上，主媒体，通常起到的是引导、催发的作用，而真正的软文大规模生产、改编、传播，则是由二、三层次的媒体写作队伍来完成的，由此才能形成巨大的传播效果，也能将新闻事件所要传递的信息分布到五湖四海，四方八面。


    ## 软文传播


    以海尔为例：海尔是一个会“讲故事”的企业，这既是新闻传播的奥妙，也是海尔总裁张瑞敏的窍门，为什么海尔的形象能让人信任，因为它通过了很多的具体故事，研制出能够洗地瓜的洗衣机，写个故事；海尔进了德国，写个故事；讲企业内部人才竞选，写个故事；写上门服务，再写个感人的故事。


    海尔现今由始至终的传播，就是编故事在编织，正是通过了这些故事，人们对海尔的感觉不再抽象，大家认识了海尔，而新闻学本身就愿意去传播故事，一个记者写篇报道，里面有很多生动的故事，这个报道人们就喜欢看，一个写作爱好者，夸夸海尔的故事写写说说，写篇评论，得，又一个人在帮海尔去传播。


    瑞士有很多企业，给你一堆资料，没有一份是讲企业背景，资料里都是讲故事，每个品牌都有什么故事，每一个手表家族有什么故事，所有的厚厚的宣传材料都讲的是故事。


    麦当劳天天传播它的管理标准，哈佛商学院会天天发它的管理案例，艾瑞不断发表其搜集的互联网分析数据。这些都是传播的主体。


    ### 软文发表


    事实上，软文本身，要若较在那里，如果软文纯粹是企业和产品的广告，你发表在哪里都没有用，任何网站的编辑、论坛的版主都不接受这样软文。


    但是，如果写的是数据、资料、分析、评论、研究、观点、技巧，任何媒体都大力欢迎。


    如果作者是个个人：要在与本行业本领域相关的网站上独立专栏、博客，以主推个人名气为主，辅推企业与产品。如站长类软文，发表在 IT 写作社区、站长网、艾玛网、创业邦、站长站、ITbear
    中文资讯站等网站。如你经营的是游戏网站，在站长类网站上效果是不会太好的，有些“文不对题”，自然要发表在游戏类咨询网站上。


    一般而言，除非分析到位、写作水平较高，可以自由向任何相关媒体投稿并发表以外，专业水平及写作水平不太高的作者，就好在自己申请到的专栏、博客发发，先和编辑、记者、版主交朋友，形成一定的影响力了，再向外扩散。


    如果作者属于企业，直接的企业和产品性软文，发表比较困难，因此要善于“曲线救国”，以发表产品应用、产品解决方案、管理方法、经营思想、领导人观点、创业故事、研究文稿为主。


    此外，还可以独立制作成电子书、通过电子杂志等方式，自建媒体，自行发布。


    对形成一定品牌的企业和专家，软文的作用会大大加倍，如五粮液在广州报纸投放的软文：以某天出版的广州某报纸为例，五粮液刊登了介绍其产品的软文。软文篇幅在 700
    字左右，主要从五粮液悠久的历史、独特的地理位置等几个方面介绍五粮液产品的优异。据分析，由于拥有巨大知名度，五粮液在广州报纸上很少投放广告，而五粮液采用刊登篇幅短小的软文来进行产品的推广，是一种较好的媒介组合方式。


