    ## 他们用网络炒作 我们用网络写作


    炒作品牌，不如炒作自己。我们这个时代，不得不炒作，人们又厌烦炒作，更多时候，炒作被公众认为是一种贬义词，因而认为：“炒作就是利用媒体捏造、夸大的手段对某人或某事进行报道”或者认为“炒作就是用那种不是正常手段进行报道”。事实上，公众作为媒体的被动接受方，他不得不接受炒作，无论炒作手法是高明或低劣，他都不得被动接受。但是，作者作为主动方，炒作与否全在于自己，正如我们说，写作的人象指挥官，引领读作者的兴趣与思考。


    因此，对于炒作总体而言，过度的炒作是没有必要的，必要的炒作是必须的，作者只能稳稳地站在中间这个位置，既不能过又不能少，即不能炒又不得不炒。也因此，我们说：“他们用网络炒作，我们用网络写作”，用心扎扎实实埋头写作，顶便给自己炒点名气，就是作者的正常心态。


