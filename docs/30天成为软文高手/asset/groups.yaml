    # 通讯软文的好处


    +   1、打好宣传这张王牌，“宣传到位，扩大影响”，这是组织真正的“软文”根基，“报上刊登，脸上有光”，这是企业凝聚力的基础。


    +   2、讴诵平凡人、平凡事，讴诵点点滴滴，讴诵身边人、身边事。


    +   3、展现欣欣向荣的发展脉络，给外界一种强盛的企业文化感。


    # 通讯软文写作指南


    +   1、通讯是长期的、是强效的，要写作通讯，就要多研究各类企业“内刊”，参考广泛的通讯员培训，不断提高对动态和描写的写作能力。


    +   2、各企业和网站，要积极建立通讯员队伍，积极发展通讯员，形成通讯员网络，有素材、有通讯、有报道，才能做好宣传工作。


    +   3、各类通知、公告、文件，都可能是撰写通讯的内容来源，比如网站公告，稍加整理，就是一篇通讯。


    +   4、必须扎根基层，必须勤于报道，务必注意：“做了要说，而且一定要说出去”。


    +   5、通讯写作不是凭空想象，注意对采访，随时采访和记录，素材是第一位的，没有素材就没有通讯。


    +   6、通讯员要有写作热情，所有的通讯员都是从基层开始的，都是从不会写开始的，初学写作可以边学习边实践，模仿着别人的去学。


    +   7、短小精练，这是通讯写作的基本要求，采写通讯就是要写好短消息。例如学校运会会时，小通讯员用一两百字的小文章报道本班动态，在校园广播播出，就是灵活应用的例子。


    +   8、用事实说话，通讯写作，是记录事实，而不是评论事实，不要本着评论的心态去写通讯，要善于小处着眼，以小见大。


