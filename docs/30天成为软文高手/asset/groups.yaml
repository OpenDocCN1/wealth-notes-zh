    在经营策略上，即使每天有 10 万人访问网站，或每天有 3 万人注册免费试用，年营业额不过几百万元。前提条件还必须是拉动每天 10 万人访问或每天 3 万人注册试用。


    # 二、经营策略调整


    公司应以专业级市场、概念运作为主，旨在市场规模性圈地，早日先行上市为主要目标。公司的赢利方式为奠定网盘市场龙头地位，IPO 后，融资资金退出，数倍获取赢利。


    # 三、重新定位


    卓学网盘应定位为：中国最顶级的专业级网络硬盘服务商，服务于职业经理人、中高级白领、设计师、学者等中高端人群。


    # 明确定义为：


    +   - 顶级经理人网盘：适用于中高级职业经理人、企业管理者、中高级白领。\n- 顶级设计师网盘：适用于建筑设计师、平面设计师、艺术设计师等中高级设计人中。\n-
    顶级文化艺术家网盘：适用于作家、画家、书法家、摄影师等大容量资料存储用户。\n- 顶级学者网盘：适用于教授、科学家、研究员、学者、博士等学术研究人员。\n-
    顶级企业级网盘解决方案：适用于大型、中型、小型等各行业企业。（说明：大型企业集团事实上由多个中型、小型企业组成）


    # 用户群切分：


    集中全力发展经理人、设计师等拥有稳定高收入的专业人群，满足他们安全存储大<|start|>量资料的需要，以重度网盘使用者为主要用户群体。放弃大学生、草根网民等轻度网盘使用者。


    # 高盈利状态：


    这已经不是一个寻找廉价网盘的时代，便宜意味着产品品质不高、售后服务状态不佳、用户购买时顾虑重重。人们都在寻找最好的网盘，愿意支付更多的钱来购买最好的，但进入的企业偏偏不能提供最好的，只是一味提供越来越便宜的。


    # 没有竞争的竞争：


    发展 1 万名专业顶级付费用户远比发展 10 万名漫无目的的付费用户更容易。1 万专业顶级付费用户的黏性更高，盈利能力更高，更能奠定牢固的市场竞争地位，成为不少行业用户排他性的首选，消费者的选择是排他性的，而且企业几乎在这些领域不存在竞争对手。但企业似乎更愿意浪费精力去争取
    10 万名漫无目的的用户，和数以千计提供同样服务的对手争抢对手。


    # 价格策略：'
  - '[PAGE 113]


    产品价格应该更为昂贵，比当前同类产品价值高出 50-100%，甚至更高。


    # 先切大块


    本次软文品牌推广，先切出大块， upp 建议整体战略方案，再行细分具体子项目和执行方案。


    # 四、发展战略


    用软文创造品牌，用软文制造上市公司。


    公司的目标应该是建立网盘领域最好的品牌、最大的公司。并在进行这种舆论铺设时，有明确的上市打算，或着手以“最专业最大的网盘服务商”概念寻求上市。


    公司可以先行上市，再建立其它专业公司，寻找更多领域的发展，图谋更大市场。


    额外服务：国内创业版上市全程协办，可提供证券机构、证监会等资源支持。


    # 五、用软文进攻市场


    软文品牌推广策略，带有明确的市场进攻性。除适用于产品和企业自身的宣传推广外。更应采取一定策略，用一定的“由头”来快速建立市场影响力，完成市场覆盖。


    策略一：可以采取“百万经理人网盘赠送计划”，即向职业经理人、企业管理者、中高级白领等，经信息验证后，赠送为期一年的网盘使用时间。采取这一策略，主要是让使用者向网盘中大量存储资料，在他们存储了一定数量、规模的资料后，使用时间到期，就不得不购买付费服务。操作要点是：赠送期不能太短，如果仅仅赠送半年或更短使用期，用户会感到时间很紧，还没有存入多少资料，就要停止使用，他们会非常谨慎使用，以免重要资料发生丢失。该策略也适用于设计师、艺术家等重度网盘用户，网盘经营的关键是用户大量向内存储重要资料，后期就不得不被动使用，而且长年持续使用，如果用户没有存入多少重要资料，他随时会放弃使用，转向其它品牌的网盘。


    策略二：“卓学网盘杯”网上书画交易心得大赛、“卓学网盘杯”互联网设计师名人大会、“卓学网盘杯”网络作家成名奖……公司应开展多项与直接目标客户对接的赛事活动，与专业网站合作，向行业用户大量渗透品牌影响力，定向捕捉专业用户。操作要点是：先入为主是捕获专业用户的最佳方式，举办赛事，提供奖金和奖品只是一种策略，最主要的目的是在庞大目标客户中奠定卓学网盘的专业级顶尖形象、定向市场地位，催使行业用户大量使用，并规模扩散，最终黏附这些领域的大量用户，成为这些行业用户唯一的或首选的网盘服务商，这种选择通常是排它性的，而且这些客户能够成堆成片开发。它有一个蝴的基础，一旦某一行业用户超过10000人使用了某一种品牌的服务，那么会在行业用户的聚会、讨论、交流中，大批地成倍增加付费客户，年年占据行业的市场地位。'
  - '[PAGE 114]


    策略三：卓学网盘蓬勃发展顶级专业级地位。卓学网站的市场动态、技术动态、领导人观点、管理特点、客户证词等，要定向向IT媒体和VC投资领域的媒体大肆传播。一个100人的企业，我们要让它看起来象蓬勃发展——在冲刺世界500强的伟大公司。媒体操作要点，无论对于IT媒体还是对于投资媒体，卓学网盘的目的不是拉拢客户更不是介绍产品，而是向媒体告之卓学是一家飞速发展的闪亮明星，是网络硬盘市场中最大最有实力最有前景最有冲击力的公司，它必须先声夺人，牢固占据这样的市场地位，让任何人看起来，卓学网盘是无可匹敌的，是行业老大。


    策略四：被频繁使用，而不是产品有什么功能与优点。通过向大批网站、论坛铺设的软文，明确告之用户的是，是大家都在高频繁使用卓学网盘，在卓学网盘用中享受使用的快乐、资料的安全、朋友介绍朋友再介绍朋友，大家都在使用卓学网盘，都是卓学网站的忠诚用户。操作要点：要建立最广泛最大规模被使用的用户基础，讲功能讲优点，是在和其它竞争对手在比技术，在做直接竞争，而且也是在和开心网、网易等大型的免费网盘在竞争，必须避开锋芒，谈客户的最终占有率，谈最大的用户群体，谈最高端的形象，永远不要言及网盘本身，要把它视做一种解决方案，到底有多少用户喜欢使用它。“谣言重复一百遍就是真理”，它必须通过舆论制造这种非实基础。


    # 六、软文推广方案


    软文推广必须言之有物，即有一定的话题“由头”，方能从不同的侧重点建立子项目，全面围攻市场。否则，软文是苍白无力的，它只能漫无目的地拉拢一些无效客户，既无法奠定市场地位，又无法与大的竞争者，如网易等免费网盘体现出特有的优势。


    本次软文推广，建立在上述四个策略基础之上，分层包干，定向执行。公司应赞成使用该策略的全部或某些环节，并支持这些策略顺利展开，在双方明确推广策略的基础上，制定更为详实的推广与执行方案。


