    # 名家软文


    # 什么是名家软文


    名家软文：以名家、专家的名义，打响个人品牌。


    样例一：


    # 厉以宁：政府要让中小企业活起来


    全国政协委员、经济学家长以宁在接受采访时指出，中国不管是保八还是保经济增长，最根本的目的还是要解决失业，而只有让中小企业活起来，才能真正解决就业问题。


    厉以宁指出，中国4万亿元经济刺激计划的投向主要是支持大企业，这不能完全解决就业问题。应当有相当一部分用来帮助劳动密集型企业，而这样的企业大部分是中小企业、民营企业，他们才是解决就业问题的主力。


    大批资金注入投资领域、基础建设领域，对长期经济发展是有好处的，但对解决就业的帮助不大。据北大光华管理学院调查，现在大部分回乡的都是30-40岁的人，所以目前的重点是解决这部分人的就业问题。让他们就业的办法就是要让劳动密集型企业、中小企业“活”起来，吸收他们上岗；或者给他们小额贷款，开小店、小作坊。


    对于“经济刺激计划是否会造成未来产能过剩”个问题，厉以宁回答说，“这种担心是有必要的，所以国家的投资一定要看效益”。


    样例二：


    # 马云：创业就是一种赌博


    马云说：“今天很残酷，明天很残酷，后天很美好。大部分人会死在明天晚上”。


    绝大多数创业企业的失败，都可归结于两点：


    +   一是低估了可能存在的风险，尤其是 Seguridad 的风险。


    +   二是高估了自己的能力、商业价值以及成功到来的时间。'
