    ## 观点软文


    ## 什么是观点软文


    观点软文，顾名思义，就是文章以观点为主，一针一议，发表自己的见解和主张，简明扼要。


    ## 样例一：


    ## 吴敬琏：中国需要更多“淘宝”


    著名经济学家吴敬琏在杭州发表演讲，详细阐述了世界金融危机和中国经济目前遇到困难的成因。他强调，中国经济要想成功突围，必须发展独立的服务业，务要一批像“淘宝”这样的能增加就业、拉动社会需求、支持中小企业发展的现代服务型企业。


    吴敬琏说，要想从根本上解决中国经济遇到的问题，就要发展独立的服务业。吴敬琏以淘宝网为例说明，网店不但能够解决一大批弱势群体的就业问题，交易的每一个环节都能带动一个产业发展。


    他呼吁，走出金融危机的影响，必须要转变旧有的经济增长方式，为现代服务性企业创造良好的生存环境，培育一批有国际竞争力的新产业。


    ## 样例二：


    ## 熊晓鸽：国内互联网别老盯着国外市场


    IDG创业投资基金创始合伙人熊晓鸽日前表示，希望国内的企业不要总是盯着国外的市场看。


    熊晓鸽认为，如果1999年中国就推出了创业板，现在在国外上市的互联网公司就不需到美国去上市；如果没有国外的模式的话，企业也可以做一些新的事，“不要老盯着国外的市场看，不要跟着国外跑。”他告诫创业者。


    他指出，互联网这种东西在美国的历史也没有多长时间，国内虽然起步晚一点，但并不意味着就一定很落后。“也许再过几年，美国人想到咱们这来上市，为什么不拿出新的方法呢？”他说。


    对于风险投资来讲，靠过去在中国投资然后拿到海外去上市，尤其是纳斯达克上市新的模式、国外的模式作为借鉴发展起来的公司，可能不一定走这个路子。


    ## 分析：


    上述两则样例的文章，我们经常在各类网站上见到，而且这些观点转载率极高，这些样例中的文章纯粹表达一种观点，不做更多解说。


    ## 样例三：


    ## 朱则荣：电子商务网站要注意研究互联网消费习惯


    朱则荣称：网站的经营者和企业，必须加强对互联网消费习惯的研究，必须多花点时间搞清楚消费心理学，特别是在互联网这种特定环境下的消费心理。


    以下几点需注意：


    - 1、价格并不是主要原因，互联网上销售的更多是虚拟产品、数字产品等这些网下并没有的东西，它能够保障竞争力，如果网下已经在销售的商品，在网上销售时就要考虑在价格上占据优势，更便宜一些，或者增加一些额外的服务来弥补价格上的不足。

    - 2、注意网站本身的改善，比如网站首页上的“招揽地带”该放些什么？购买的流程如何更简洁？如何让产品更有说服力？如何确保在售后服务上更让人信任？……影响消费者购买的并不是什么广告，而是网站一下子就能够吸引客户做出购买决定，购买心理往往是在一瞬之间发生的，你要多花点心思来考虑怎么让网站的访问者能够心动。

    - 3、大大缩短顾客的购买成交时间，网上的消费者绝不是在传统的服装店里逛，下次、下下次会再来你的店里光顾，大部分网上消费者往往只来一次，他打开你的网站，短短几分钟而已，而当一旦关闭网页，就一去不复返，你必须让客户一次性下决定，而且从产生意向到完成交易，时间不能够拖得太久，遥遥无期的意向等于你什么也没有卖。


    ## 观点软文的写作格式


    ## 标题：


    某某某（作者名字）：标题


    ## 正文：


    - 1、某某某指出……

    - 2、就网站发展问题，某某某认为……

    - 3、某某某称……


    某某某是 XXX 网站的负责人，在过去三年间，XXX 网站已经在教育网站领域取得显著地位和广泛的影响力。


    4、用第一、第二、第三来分条表达。


    ## 观点软文的好处


    - 1、在标题中出现作者的名字，加速扩大其影响力，树立个人品牌。

    - 2、在文章中重申作者所在机构，如“在站长中广受欢迎的咨询网站站长网 CEO 某某某日前表示”。

    - 3、显得权威、个性、有影响力。

    - 4、转载传播率高。

    - 5、文章简短有力，写作时不需要花费多少精力。


    ## 观点软文写作指南


    - 1、字数不要太多，三五百字即可。

    - 2、一环一议，表达完一个观点，立即罢笔，一个观点一篇文字，如果有多个观点，可写成多篇。

    - 3、写作时上手容易，而且容易造影响力，写作时注意语言的锤炼，文章越精越简短有力越好，把多余的废话、水话删除。

    - 4、如果没有素材，不知道该怎样表达，可以和朋友聊天、交流，把对话中的精彩的讨论摘要出现，即可成文。


    ![](img/9c5a94eedde119b872450b830636a0d0_42_0.png)


    ## 问题软文


    ## 什么是问题软文


    问题软文，就是提问题、解答问题，一个问题一解答，单独成篇。


    样例一：


    卓学课堂：什么是 SEO？


    SEO 是 Search Engine Optimization 的英文简写，意为搜索引擎优化，或简称“优化”。


    SEO 是指通过改进网站链接的质量和数量、以及有效的网页内容部署，使网站在搜索引擎上获得比较好的自然排名位置。通常情况下，在搜索一个“关键词”时，搜索引擎会排列出该搜索结果的相关网页，先出现的网站排名越前，网站所获得的访问量就越大。其中：


    65%—70%的上网者只访问搜索结果的第一页即 1—10 条信息。20%—25%的上网者访问者访问搜索结果的第二页即 11—20 条信息。3%—4%的上网者的访问其它所有的搜索结果的总和。


    做为重要的网站营销策略，网站经营者必须考虑搜索引擎如何工作，以及人们如何寻找网站。对于企业和商业网站，特别是销售网站而言，每多争取一个访问者，就意味多争取到一个可能的销售线索。优化网站主要涉及：网站内容及
    HTML 编码的特定关键词设计、消除有障碍的代码、调整链接质量与链接数量。


    样例二：


    卓学课堂：兼职个人站长应该如何建设自己的网站？


    问题：作为一个兼职站长，如何做出一个有特色、有收益的小站呢？如何让网站获得广告收入。


    朱则荣答复：


    兼职站长的特点是时间不多，在网站的持续更新上也存在很大难度，通常，多数人不能坚持下去。


    1、选择做网站的方向时，过大过空的目标是不现实的，比如将方向选为教育网站，就是不准确的，你没有那么大的精力，做不了多久就放弃了，你必须找准确箭头市场，目标越小越清晰越好，比如只围绕语文课件、教育管理、微软认证考试等等专项的内容，务求把他们做精、做专，只围绕一个目标深入下去。


    2、在你选择建站方向时，要注意一点：什么人会投放广告？依托你的内容能够销售什么？比如“滑雪”，你可以找到这种杂志，仔细看看什么人在上面刊登广告，滑雪爱好者们又需要购买什么，你的网站做好后，可以与这些广告商直接联络。再比如美术考研，有很多辅导画院会刊登广告，我准人们愿意花钱的地方去做网站，事半功倍。


    3、在内容策略上，注意内容本身的价值，内容不在多而在精，不要放新闻或少放，在编发一篇文章时，要考虑这篇文章放在那里，是不是三年、五年仍然能够产生作用，被人们阅读，这样即使以后每天只更新三五篇文章，长年累月下去，将是一笔财富，
    你的网站肯定是同类网站中最优质的网站，人们喜欢用它而且频繁地用它。


    分析：上述两则样例的文章，都以是解答常见的或实质性的问题为中心，这样的内容，非常具有价值，很容易被广泛转载。


    ## 样例三：


    ## 红警2和红警3哪个好玩？


    红警3是红警2的升级版，红警2是采用2d画面，而红警3是3d，红警3更好玩更真实，剧情也是延续红警2。


    但是红警3占内存5G红警2才几百MB，对显卡要求很高。


    ## 问题软文写作特别建议


    一般人不会意识到问题本身也是软文，这种写作方式用的人比较少，但效果非常强。特别注意一下：


    - 1、搜索关键词：“为什么……、什么是……、怎样……，……诀窍、……秘籍”


    问题软文的写作格式


    标题：


    - 1、什么是……

    2、为什么……

    3、怎样……

    4、如何……

    5、……有哪些诀窍

    6、……有哪些秘籍

    7、某某某：当你遇到……问题时


    ## 问题软文的好处


    - 1、写作快速，三五百字，甚至一两百字都可能单独成篇。

    - 2、素材好找，在各种论坛、百度知道等内容中，有大量问题，解答或直接整理问题的答案即可。

    - 3、转载传播率高、点击率高、查询量大。

    - 4、锁定搜索引擎，“什么是”、“为什么”、“怎样”、“如何”等关键词每天在搜索引擎中检索重复量极大。


    ## 问题软文写作指南


    - 1、问题软文可以自动形成内容，比较论坛中，有人提问有多人应答，作者可以对答案进行整理，就是一篇文章。

    - 2、写作时上手非常容易，写作极为简便。

    - 3、网上写作，以量取胜，问题软文可以大量制作。

    - 4、人们喜欢问问题，人们会遇到问题，人们同样会在网上不断寻找问题的答案和解决思路。

    - 5、“什么是电子商务?什么是 SEO?”等等问题，每天都有数以百计的搜索量，源源不断地为你输送流量。

    - 6、长期性，问题软文可能长期存在，发挥作用，一篇写于五年前的問題软文，五年后可能仍然有人查询。

    - 7、注意某款游戏网站及论坛，围绕一款游戏，在它们的论坛中问题非常的多，为什么会有这么多的问题?作者可以思考借鉴。

    - 8、在网站经营中，如果利用论坛等形式，大量搜索问题、解答问题，可以成批量制作软文。


    ## 事件软文


