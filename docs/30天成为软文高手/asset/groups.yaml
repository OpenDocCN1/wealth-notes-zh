    # 热门软文写作方式


    1、紧跟新闻事件，全社会每天都可能发生一些热门事件，而各个行业领域比如互联网，每隔一段时间同样会出现一些热门事件，在百度新闻频道首页，公布乔设新“新闻热搜词”，如：“高考作文题、法航逃体、重庆营救矿工、公交安全锤、悼念罗京、余秋雨回应假捐款、四川裸体浴场、巢湖买官、色戒原型、梁洛施儿子身家”。围绕这些热门关键词撰写和整理相关评论、知识，或制作专题网站内容，都很容易提高影响力，获得一定访问量。


    2、注意百度搜索风云榜，会出现最新搜索热点，分为“今日上升最快”、“一周热点”、“热门搜索”，如一周热点有“艳碟门 16114、百慕大神秘三角 4268、成都公交车自然
    62822、李光洁劈腿 4231、刘继红照片 48137 腾中重工 2922、于小伟照片 4097 恋爱写真 3471、手机实名制 4156、蓓佳春 1533”


    3、注意百度和 Google 的相关搜索，例如围绕“软文”这一关键词，会出现“什么是软文、软文广告、软文营销、软文推广、软文写作、软文发布、房地产软文、软文网、软文范例、什么叫软文”，而围绕“软文写作”关键词，又有“软文写作工具、软文写作范文”等相关搜索，围绕“软文营销”关键词，又有“网络营销软文、软文营销案例”。


    # 热门软文的好处


    1、第一时间从互联网上抓取流量。伴随新闻热点的巨大搜索量，相关评论、相关知识将在第一时间获得转载、搜索。有些热门词，可能将持续很长一段时间，例如围绕中国制造航母，随着新闻事件的推动，一旦有任何“风吹草动”，搜索“航空母舰”的人立即增多，因此，可提前建立相关专题网站，组织编撰相关软文。


    2、可以获得广泛关注。观点独到的评论会在第一时间获得广泛关注及转载，特别是许多评论人及独特的网站，可能因此风生水起，所谓“一言以兴邦”，获得广泛的影响力。例如军妒评论家张召忠，凡是涉及军妒热点新闻，每次必评，因此一举成名，而股评家、足球评论家、曲艺评论家等等领域都是名家必出的领域；大塑媒体和记者都喜欢结交这些有独特观点的评论人，在新闻事件发生的第一时间，会邀请、采访这些评论家，征询他们的意见，报道他们的看法。


    3、容易获得直接的经济收入。例如一本围绕《耶稣受难记》的电子书，售价 18.9 美元，只不过是围绕《耶稣受难记》这部电影，编写整理资料，放在 ebay 里出售，第一时间追赶这部电影的狂潮。


