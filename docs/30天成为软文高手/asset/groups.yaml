    ## 十个故事：软文即时写作收入


    有很多 人问：写软文用来干什么？大部人的回答是：推广网站。也有好些人一若是软文培训，那就不：“路过，闪人”，或者是“没兴趣。”我们今天首先讲的就是：即时写作收入。也就是
    说直 接用软文创造收入。特别月收入低于5000的站长可以重点注意一下，年营业收入高达一亿的网站，也可以重点留意一下。很多站长都在反映自己的网站发展似乎穷途末路，网站转型该如何转，抛网站联盟，站长特别是小站长，该上哪儿吃饭去。我们说，SEO不一定能解决这个问题，但写作却有可能解决掉你的发展问题。因为软文写作，更看中的是直接收入，而不是流驻。


    ## 讲十个故事


    ### 一、QQ联盟


    QQ联盟用的人比较少，很多站长都觉得做那个联盟不赚钱。实际上QQ联盟的推广，最好用软文来推。比如QQ千里眼功能、点亮金色手机，你单独播放QQ的广告效果是不好的。QQ的大部用户什么都不懂，他们也愿意花点零花钱，开通这些功能，或者在朋友圈里炫耀一下，这个时候，你就需要写软文，用软文的方式把怎么开通千里眼功能、怎么点亮金色小手机的知识普及一下，你需要写文章手把手地教他们，教他们怎么手把手地操作，顺便把你的联盟代码放上去，让他们即刻开通。QQ非主流里面有几个比较大点的网站，网站上也就放三五篇这样的软文，收入也不多，每月也就能从QQ联盟分上个几万块。


    ### 二、鹦鹉学舌


    怎么教鹦鹉说话，这个问题好像很简单，但难住了很多人。鹦鹉这个单词，在GOOGLE里每天的检索量是几百次到一千次上下，有人编了一本电子书《怎么教鹦鹉说话》，一本卖十几美金，他在GOOGLE上打广告，不多，一年这一本电子书也就收入十万美金，这个案例是有据可查的。


    ### 三、网上卖照片


    有人把自己多年在网上卖照片的经验和诀窍整理出来，编写了一本电子书《怎么在网上卖照片》，然后建立了一个网站，只有一个网页，进入网站，如果感兴趣可以直接在线购买，他做完了这件事，就天天在躲在摄影网站和论坛上写软文，不多，两年时间，卖了9.8万册。


    ### 四、网上培训


    有人在大街上看到一辆跑车，他非常想拥有这部跑车，但他的钱不够。他根据这个情况，写了一本《意念成功》，也就说一段时间内，把自己的心思集中在一件令你心动的事情上，将事倍功倍。如果出版这本书，稿费没多少，如果卖在网上卖电子书，太慢。因此他采取培训的方式进行招生，学生学习一共四个星期，2500元，他分四次发放课程，如果你在付费参加学习的第一周内，觉得效果不好，可以全额退款。他把课程开发好了以后，就在网上写软文招生，第一期招到了46个学生，有5个学生在第一周退学，还有41个学生，因此他一共赚到了102500元，这样的课程是没有什么成本的，几乎是纯赚。按下去，他又开发了几个课程，如此循环招生、培训，几个月后，他就买下了那部价值80万的跑车。


    ### 五、研究报告


    我曾经在百度上注册过一个百度空间，在上面扔了几篇《经济型酒店的市场研究报告》、《星级酒店成本控制手册》等等资料的目录，那只是一个简单的目录，我感觉它的编目有参考价值才放上去的。之后半年，我再没有上过那个空间。直到半年后的一天，我去看了一下，结果发现十几条留言：“如何买到这份报告，请和我联系，手机：XX”，“要怎么样才可以阅读全文???知道的请速度与我联系!
    QQ：XX，不胜感谢!”、“这本手册哪里有，定价多少?”、“急购，请速与我联系......”。一份研究报告的售价通常6000-8000左右，便宜点的报告，也一份也需要2000多。现在大家可以想一下，这些留言说明了什么问题?


    ### 六、获取服务


    看这样两条软文：


    > “像 www.abc.com网站提供的电子邮件广告样本，60元，其中许多样本效果还不错。”


    > “你可以试试 www.abc.com的网站经营诀窍服务，每年180元，而 www.cba.com的网络经营研究资料服务，每年170元。”“如果你正在读网页，有上述需要时，你会突然想干什么？


    ### 七、电子杂志


    美国的威尔森博士是一个网上个体户，他免费发行一份《今日网络营销》的电子杂志，有十几万人订阅，每两周发行一期，汇总他从网上搜集到的一些网络营销诀窍，每月新增订户2000多人。之后，威尔森又在此基础上，发行了一份收费的电子杂志，收入相当不错。很多美国人创办的电子杂志，每个月收入10000美元以上。


    ### 八、陈记强


    阿里上有个叫陈记强的，依靠来的四千块钱作为启动资金，在网上卖扇子，最初每天超过20个小时趴在阿里论坛发帖子，没客户咨询时就抽空打个盹。后来发展到四个人，从上班到下班，电脑全部开动，所有人就趴在网上发帖子、写软文。头一年卖扇子，从进货到销售都是他一个人完成，没成想，第一年就卖了200多万元，到2006年，销售额6000万元。


    ### 九、google


    google一直宣称它们没花一分钱的广告费，奇迹般的长大。大家可以aney点找一个google在2003年、2004年在做什么。比如当时的新浪科技频道上，在国际新闻中，如果有10条新闻，其中有6、7条都是它的新闻。如果要比喻一下，那简单就象“特大机型的种机”，满世界到处撒它的软文。这就是它奇迹背后的诀窍。捍种机


    ### 十、格兰仕


    格兰仕最初成立时，没钱打广告，就找人专门写软文，搞了个“微波炉做菜1000法”，在全国几十家地方小报上登,后来全国报纸都在疯狂转载这些豆腐块式的小文章，没过多久，就有300多家报纸在转载这个。所以，格兰仕的发迹号称就是：“用豆腐块打天下”。


    故弄讲完了，你觉得软文没用，可以闪人。如果觉得有用，软文的效果--就是“无本营销”。如果说SEO和软文有区别，那就是前者必须依赖关键词，而后者基本上不需要流盐。当然，两者结合起来也可以。


