    # 自动销售！


    # 网站是怎样订阅的？


    Google 提供了一款免费工具：Feedburner。网址：http://feedburner.google.com


    Feedburner 是一种 RSS 内容邮件订阅工具，使用 Feedburner 后，你可以在你的网站上放置一个“订阅”按钮，当你的网站访问者留下他的电子邮件以后，每当你的网站或博客更新，就可向读者自动寄发更新文章，不断地将客户拉回到你的网站，也不断地让潜在客户看到你的内容。'
  - '[PAGE 20]


    需要注意的是，从网上销售角度，订阅者都是你的销售线索。如你提供的“高尔夫”内容，对高尔夫没有兴趣的人，是不会订阅的，而一旦订阅的内容的人，很可能就是高尔夫的爱好者，他们有相关购买需求和消费能力。


    这是一种很棒的销售方式，也就是实现了自动销售，你所要做的，不过是建立一个网页，多写软文，让人们通过这个网页，主动订阅你的内容，如果你有一万名订户、有十万名订户，就相当于有数以万计的准客户。


    # 邮件自动回复机


    自动回复机，是国外的一种网上业务营销工具。


    如果说推销员通常要与一个客户接触7次以上，才能与这个客户完成销售。那么自动回复机，就自动化地完成了这个销售过程。


    # 自动回复机的原理


    用户在你的网页上留下他的电子邮箱。接下来，自动回复机会自动向客户发送电子邮件，每天一封，或两三天一封。所发送的邮件，都是你事先写好的软文，一次写好七封甚至更多封，然后将这些邮件放置到自动回复机上。


    当一名新客户订阅你的内容时，自动回复机会依次寄出邮件，一切全部自动化完成，你可以外出旅游，也可以度假，都不影响你的销售。


    # 国内少有自动回复机


    由于中国反对垃圾邮件，而且中国人普遍不了解自动回复机，容易将此类邮件判断为垃圾邮件，因此，几乎没有这种销售武器。如果你要使用，可从国外购买该项服务，年使用费几十美元。


    国内的电子邮件服务，通常设置有“自动回复”功能，你可以考虑加以利用，告知发信的朋友“阅读《美甲的三个小秘密》，访问网页：http://......”，可以采用人工方式，收集订阅者的邮件，也可以自行开发简单的程序，向订阅者发寄邮件。


    总之，电子邮件是网上经营者的最大财富。


    # 什么是软文营销


    软文营销足一种以销售或增强影响力为主的营销方式。文章会直接或间接地包括业务、联系信息，以建立个人影响力、企业品牌信誉，吸引新的客户。'
  - '[PAGE 21]


    # 软文营销的背景


    在报纸印刷出现以后，文章就已经被专业的营销人员广泛使用，他们利用印刷的形式，制作传单、广告、新闻。最初，一些企业向报纸提供有益的内容、动态和消息，报纸免费刊登并报道它们，直到今天，这种方式依然普遍存在。


    例如，会计师事务所可以向当地市场写一篇文章为《避免被审计的十大方法》提供给当地的几家报纸和网站，同样，修理屋顶的公司也可简明地撰写一篇文章为《如何避免冰雪损坏您的屋顶》。


    # 网上软文营销


    随着电子商务和网络营销的崛起，软文的营销转移到了互联网世界。传统的媒体也向互联网提供内容，而网上的内容也可能向出版商提供，软文是免费的广告和品牌宣传，在互联网上快速传播。在网上张贴一篇文章和张贴一则广告是完全不同的，赤裸裸的广告容易遭到排斥、删除，而有价值的文章则容易受到重视。


    不同于传统媒体，互联网上的转载量和传播率是惊人的，一篇出现在大型网站的文章可能在一日之内在成百上千的网站上被转载。所以，有眼光的作者通常会注意到这种转载性，强化其转载传播效果。所以，一篇文章，有时会被复制成几百条、几千条覆盖互联网。


    同时，软文的营销还有其网络营销的性质，最显著的特点是：进行优化后的文章，可能针对某些特定的关键词，在搜索引擎中出现，以迎合这些市场的需要。作者能够将明确目标的内容，发送到一个对它感兴趣的读者群中。


    许多网上的经营者已经开始享受这种低成本的营销方式，更多的企业和销售人员试图在互联网上到处张贴广告，致使互联网上垃圾内容成堆。经营者如果不小心滥用互联网的这种传播性，为了宣传目的，发布质量差的内容，很容易引发反感。


    垃圾内容越来越多；人们对高质量文章的需要也就越来越重要，商质丑的软文是非常容易受欢迎的，高水平作者会用高超的写作技巧——巧妙地说服潜在客户。


    # 软文在互动营销时代


    软文营销已经成为越来越受欢迎的营销方式，通过博客、论坛、网站写作和投稿专栏，许多话题，正以核爆的能量在互联网上传播、流行。


    50%以上arki的互联网用户在搜索引擎上阅读、查找内容，高质量的原创内容+有效的 SEO 策略，将获得较高的网页排名，很容易吸引到更多访问者。对许多销售网站和公司网站，借助软文增长流量和销售，已经被证明是最有益和最有效的方式之一。'
  - '[PAGE 22]


    此外，包含网址的软文，可以快速增加更多的反向链接，使一个网站的排名在搜索引擎中上升。因此，通过写作和有效分发这些书面的带有链接的文章，已经成为一种趋势，这种趋势被搜索引擎所接受。


    但是，由于互联网大量免费转载的特点，导致大范围重复的内容出现在互联网，一些寻求大量反向链接的作者可能因此牺牲文章的内容质量，而高质量的首发原创内容则被搜索引擎所重视。'
  - '[PAGE 23]


    # 软文炒作


    # 炒作已经成为现代传播的特点


    有诗没事儿的炒作，已经成为现代营销的重要话题，从这些年的营销中，创造了诸多经典案例，如老板喝涂料、鸭鹅大战、鲸鱼漆叫板国标、酱油风波、格力剖开空调秀心脏、奥克斯参娘革命、红太阳寄海君牺牛、耗子药寻找形象代言人等，都是讲究传播效果，不免空谈品牌，在很短时间内都创造了比较好的营销效果。


    # 炒作所要遵循的原则


    +   1、站在整体营销的角度系统地考虑问题，而不只是“事件营销”本身；

    2、站在整个品牌战略和品牌管理的角度一致性地考虑问题，而不只是追求短期的、让你“3分钟爽快的轰动效应”；

    3、站在顾客满意的角度考虑问题，而不只是一时间的“哗众取宠”、甚至“诱骗顾客”；

    4、站在整个财务效果的角度考虑问题，而不只是没算账就认为此次“事件营销”一定是低成本、高效益。


    # 网络炒作源于宣传策划


    以金龙鱼为例：


    2003年02宣传重点


    金龙鱼第二代调和油处于产品普及阶段，其宣传重点：


    二代调和油普及性品类教育(调和健康概念)


    深化核心利益点与大众的相关性(调和油更健康)


    传播阶段划分'
  md: "\n在文章的最后一段加入哲理：讲两句道理，或者寓言，或者引人思索的短小例子，常有前俯后仰之效，山高水长，令人回味。如：“朱则荣语：网站即工具！哪怕再小型的网站，也要寻找其特有的方向，螺丝刀虽小，可它也是一个独有的工具，你却常常离不开它。”\n\
    \n## 软文九忌\n\n1、忌“我”，对于所有写手来说，用第一人称是写作大忌。 \n2、忌流水帐，文章太过简陋，写作太过初级，文中必须出现罗嗦的细节和描写，使文章既琐又散。\
    \ \n3、忌简单抄袭，天下文章一大抄，但即使是抄，也不能让读者看出是抄的，最简便的方法是删改，即删除原文大块的废话，保留精髓，再加入自己的思路和语言，就是截然不同的新文章。\
    \ \n4、忌太啰嗦，要解决这个问题，必须舍得删，舍得改，大胆地删除自己写的废话，舍得将与主题无关的语言进行大段修改。 \n5、忌华而不实，务必每一个字言之有物，这是文章中的务实。\
    \ \n6、忌想要表达的环节太多，一文一议，一事一简，不要试图在一篇文章中出现很多主题、很多人名或事件，读者是无法消化的。 \n7、忌前后矛盾，文章中出现重复表达、前后矛盾、公私不分、上下关系混乱等等，都足不可取的。\
    \ \n8、忌广告，偶尔广告一下完全可以，整段整篇写广告，人人排斥。 \n9、忌道德问题，中国是一个道德伦理社会，只要不触犯道德底线，没有问题，一旦涉及道德问题将引发众怒，如某作者说：“我在名牌大学毕业，我认为推销员只是那些没文化的商中生才干的工作”，结果两个字，“找骂”。\n\
    \n## 软文写作不要抄 要套\n\n切记，不要抄，要套！每个新手都会模仿，关键是如何模仿，我们强调软文的写作手法，卓学课堂在软文写作中列入了二十余种写作手法，就是帮助作者直接套用的。\n\
    \nwww.zhuoxue.org\n\n© Zhuoxue Classroom, 2010,9 在中国地区制作\n\n## 软文写作要素\n\n## 软文写作五要素\n\
    \n### 1、主角\n\n究竟是以什么为主角？作者、品牌、网站、企业、还是某某某款产品？一定要搞清楚软文究竟以什么为中心，是用来表达作者的个人观点，打响个人品牌；还是推广某个品牌，形成品牌影响力及潜在市场；推广某一个网站，追求网站知名度；还是推荐某一家企业，以灵活的手法将这家企业写活；或者是推广某类某款产品，以期达到一定的销售目的。\n\
    \n在软文写作之前，主角一定要定好，方能进行系列的写作，诸如小说中的主角，一切的语言、描述、故事情、思维都围绕着“主角”而动。\n\n### 2、素材\n\n\
    素材来自于积累，来自于采访，来自于阅读，来自于思考。正如“巧妇难为无米之炊”，素材即“米”，无米则无法“下锅”。文章之所以写不好，首先在于没有素材，天马行空坐在哪里空想，结果是既抓不住主题，又使内容极度空洞。蒸馒头要有面粉，素材就是面粉，而写作仅仅是发酵的过程。\n\
    \n### 3、思想\n\n思想决定文章的层次，也决定最终成败。比如你的赚钱思想比较重，文章中会尽显“赚钱”之意，没有钱的小老百姓才天天想着“赚钱”，企业家、高级经理人、官员与精英以及稍有长远眼光的人，年薪少则二三十万，赚钱对他们来说没有任何意义，你跟他们谈“钱”，会让他们感觉一个字“俗”，因此，文章中如果谈“赚钱”、谈“省钱”、谈“走捷径”，那么作者这一辈子也只能在社会底层混混，永远上不了台面。\n\
    \n写作，足作者的思想体现，足作者的思维表达，足作者所思所想所感所悟所思想，说到底，文章就是作者的思想层次思考特点与思维整理。因此，一定要提高思想层次，提高思维水平，加强思考能力，这是写作的不二法门。\n\
    \n### 4、写作手法\n\n这是将素材与文章的加工整理手段。正如前面的蒸馒头，写作技巧就是“发酵”的水平和能力。大厨做菜肯定和家庭主妇做菜不一样，工程师和建筑工人所采用的方法绝对不同。\n\
    \n写作手法追求两点，一是文风，二是技巧。写作大“家”追求的是文风，即写作的风格，必求独一无二，方成大家。而写作小“家”必求技巧，用怎样的套路来快速写文章，使写作水平成熟。任何作“文”者，皆是先求技巧再求文风，循序渐进，步步成长。\n\
    \n### 5、写作载体\n\n文章发到哪里去？报纸、杂志、广播还是互联网？\n\n给哪方面写文章？管理类媒体、IT类媒体、站长类媒体、旅游类媒体？\n\n\
    文章要依托这些载体呈现在人们面前，所以写作前，要确定具体的载体。纸面写作和网上写作不同，网上写作和网站写作又不同，给不同的媒体写文章又各有特点。作者任务在对各种载体的特点和发文方式要做以了解和研究，掌握了载体的特点也就掌握了文章发表的源头。\n\
    \n## 撰写软文的十二项注意\n\n### 1、先定标题 再写正文\n\n标题是一个作者最高文字水平的体现，标题是文章的广告，要使文章引起读者的阅读欲。增强文章逻辑性，撰文讲究“指哪打哪”，力避文章“打哪指哪”；让人看后不知所云。作者要多加强标题制作的能力。\n\
    \n### 2、多用固定结构\n\n结构：“标题+导语+第一+第二+第三”。如果写新闻则是“标题+导语+第一新闻事实+背景补充+第二新闻事实+事件后续事实”。\n\
    \n导语应高度提炼，以打动读者往下看。正文亦以分析评论为主，第一、第二、第三条理清晰，逻辑严密。必要时，可在文后单独追加解释性内容。切忌不余时间做文章的主轴，记流水帐般“媳妇道来”。\n\
    \n### 3、多用动词少用形容\n\n写作时多使用动词，少使用形容词，多用语言确切的分析及肯定性语言，少用叙述性语句和不确定性、询问性语言，以此使文章生动起来。诸如“因为……所以……”、“而且”、“虽然”…等连词也要少用，以免影响稿件的紧凑与节奏，而“假如”、“好像”、“也许”、“能不能”、“似乎”、“可以”等不确定性词语坚决不用。\n\
    \n### 4、勤分段 别超3句\n\n每个自然段，字数不得超过150字，两至三个句号，给读者阅读喘息的机会。篇幅如果超过1000字，每300到400字要有一个小标题，先拟标题再行文，设计结构，多用动词，简洁有力。\n\
    \n### 5、严控篇幅当舍则舍\n\n如报纸，小幅报纸无广告时的整版刊文盎不到4000字，每版刊发条数在8-10条左右，加之图片所占版位，每条消息的上上限锁定400字，而大张报纸一版无非8900字。网络没有篇幅限制，但读者都不喜欢读长文，蜿蜒点水，一眼扫过，读者会对信息进行筛选、点选，这一点对作者而言是至关重要的。切不可想到哪，写到哪，最后把编辑和读者带入千里茫茫之中。\n\
    \n### 6、内容取胜但别沉溺\n\n文章以精彩的内容取胜，但不追求细节的扩展。增强文章的实质内容是绝对要点，一定要=有提领意识，不要把简单堆砌。\n\n\
    ### 7、条理清晰少用废话\n\n作者不是搬运工，没有必要到处“搬运”相关观点和描写，必须力保文章简单明确。\n\n### 8、称谓别忘尊重人权\n\n\
    无论写任何文章，不要随便就写“骗子王某”、“强奸犯李某”、“妓女岑某”、“小姐赵某”、“无照小贩张某”等，那是司法问题，法院都没有定罪，你又岂能毁人声誉。另外，在文章称呼人时，不要带有地域歧视，如“张某某是河南人”、“山西人陈某”等。\n\
    \n### 9、专业术语多加注解\n\n不少领域，特别是专业性较强的领域，如财经、科技、通信、法律、医药等，作者撰写此类稿件时，经常需引用专业术语，除非你是给内行看，如果给外行看，要勿加注解。毕竟读者不同于熟悉业务的作者，一个在业内经常使用的专业名词，却很可能成为读者阅读的障碍，如“商开低走”、“3G\
    \ 手机”、“ISDN”、“固体燃料”、“举证倒置”等。\n\n### 10、数字要准不可连用\n\n稿件中使用数字要准确，应与原始资料反复核对。对于在文中列举的以数字排序的并列内容，最后要再数一遍，不要出现“前面说足八大方面，后面实际只有七项”的乌龙情形。如果一定要用数字，一段内最好不能连续使用\
    \ 3 个，数据新闻除外。\n\n### 11、准确运用“的、地、得”\n\n稿件中“的、地、得”的混用，经常给校对增添工作量。要严格依照字典上的规范，区别它们间的不同使用环境，准确运用。的：用在定语后面或用在谓语动词后面，地：表示它前边的词或词组是状语，得：用在动词后面，表示可能。\n\
    \n### 12、标点符号要写明\n\n标点符号是帮助编辑和读者顺利读懂文章的工具。作者在写稿件时，必须忠实遵循语法规则，使用各种标点符号；禁止整段“一逗到底”。在电脑文本格式的选择上，也要确定中文标点全角模式，避免给排版带来困难。\n\
    \n## 软文写作工具\n\n### 一、写字板\n\n写字板是写作时最常用的工具。之所以用写字板，而不用 WORD 写，主要特点在于，从网上复制粘贴资料，不受影响，在\
    \ WORD 上贴粘，比较恼，而且网页上的框架会被粘贴上去。\n\n用写字板写作，通常会被保存为.rt格式，既用写字板能够打开，又能够被 WORD 打开，文章写好后，只需要用\
    \ WORD 排版即可。用写字板需要注意经常保存，如果电脑突然断电、蓝屏，你写的东西，或粘贴的资料就丢失了。不推荐记事本，记事本的文字不断行，需要硬回车。\n\
    \n写字板的使用：写字板通常是 windows 自带，位置在“程序——附件”之中，安装完电脑以后，可以找到写字板，把它发送到桌面，独立快捷方式，平 时需要使用，在电脑桌面上打开即可。\n\
    \n### 二、WORD\n\noffice 自带的工具，也是写作、排版最常用的工具。不推荐 WPS，由于 WPS 和 OFFICE 之间不兼容，如果你使用\
    \ WPS 制作的 WORD 文档，发送给其他人以后，对方电脑上没有安装 WPS 就无法打开。\n\n注意：如果使用 Office2007，在保存 word\
    \ 时，要使用保存为“97-2003 兼容格式”，由于多数用户没有安装 Office2007，保存为 2007 格式的文档，无法在其他电脑上打开。在 OFFICE\
    \ 中，高版本可以打开低版本的文档，但低版本无法打开高版本的文档。\n\nword 有自动保存功能，使用时仍要注意多做保存。\n\n### 三、网络编辑超级工具箱\n\
    \n目前版本：1.0.3 版，完全免费软件。\n\n主要功能：\n\n将混乱的，不符合格式的文章拷贝至本编辑器，点击“快速格式内容”按钮即可将文章内容处理成标准、规则的内容，包括：\n\
    \n文章以分段处理\n\n段落前放置 2 个全角空格\n\n去除所有格式\n\n图片和图片位置保留\n\n预览纾辑好的文章\n\n通过按钮拷贝内容至剪贴板\n\
    \n文字查错功能\n\n繁简体互转功能\n\n### 四、PDF 阅读器\n\n主要使用：Adobe Reader 9.0 以上版本，主要用于阅读 PDF\
    \ 类文档，完全免费软件。\n\nAdobe Acrobat Reader 是査寻、阅读和打印 PDF 文件的最好工具。\n\n### 五、PDF 制作工具\n\
    \n最佳使用： Adobe Acrobat 9 Pro\n\nAdobe Acrobat Professional 软件可以使商业人士能够可靠地创建、合并和控制\
    \ Adobe PDF 文档，以便轻松且更加安全地进行分发、协作和数据收集。制作 PDF 文档的利器，办公必备。\n\n使用 Adobe Acrobat 9\
    \ Pro 以后，在 WORD 打印一项中，会出现打印成“PDF”文档的选项，相当于虚拟打印机，将文字与内容打印成 PDF 格式。\n\n使用注意：Adobe\
    \ Acrobat 9 Pro 打印 PDF 效果最佳，色彩不失真，但要注意制作文档图片时，象素与图形尽可能大一些，例如将网页设计中默认的 72 象素改变为\
    \ 300 象素，否则，在 PDF 中如果放大，图片将会发虚。\n\n### 六、素材整理软件\n\n软件：吉吉写作\n\n一款完全免费的写作工具。能够帮助你收集整理写作素材、编辑草稿与正文、给小说人物起名等功能。\n\
    \n使用时，可尽量使用其“资料窗口”，用于分类收集各种资料。\n\n### 七、电子书制作软件\n\n推荐使用：e书工厂 ebook workshop\n\n\
    制作格式：exe类电子书\n\ne书工场可将 HTML 页面文件、图片、Flash 等捆绑成 EXE 电子文档的制作软件。本软件可以说是吸收了目前其他同类软件的优点，采用文件流技术，所有文件都在内存中释放和读取，不产生垃圾文件；软件采用界面外壳，制作时可以选择界面，界面优美，可以不断升级界面；制作的电子书可以部分或全部加密，从而保护制作者的利益，是制作\
    \ EXE 电子图书较好选择。\n\n推荐使用：Adobe Acrobat 9 Pro\n\n制作格式：PDF格式\n\n### 八、网页截图工具\n\n\
    推荐使用：SnagIt\n\nSnagIt 是一个非常强大的屏幕截图工具。Snagit 可以捕获网页、屏幕、窗口、客户区窗口、或用鼠标定义的区域图像，图象可被存为\
    \ BMP、PCX、TIF、GIF 或 JPEG 格式，也可以存为系列动画。\n\n使用注意：默认象素为 96，安装以后，先要进行设置。\n\n推荐使用：Windows\
    \ 中自带画图工具\n\n1、打开“所有程序——画图”。\n2、按电脑屏幕上的“Prtscn sysrq”键，截取屏幕，在“画图工具”上选择“粘贴”，然后“保存”。\n\
    3、用 Photoshop 裁切、修正图片。\n\n### 九、制图工具\n\n使用：Adobe Photoshop\n\n图片制作的最好工具。\n\n###\
    \ 十、统计图表制作工具\n\n推荐：office2007 中，自带统计图表制作工具，在 WORD 和 EXEL 中都有。\n\n优点：统计图表清晰、简洁、漂亮。\n\
    \n在网页上放置时注意：截图成独立图片发布。\n\n## 软文营销\n\n### 最新成功故事\n\n嗨!乔西：\n\n我很高兴我在用软文营销。\n\n我大约从一个月前开始写高尔夫的文章，发表在一些网站和论坛上，试图吸引人们来订阅我的高尔夫网站内容。我按照搜索引擎的关键字查询工具，来选择最佳的文章标题，比如上一篇是《高尔夫新手上路》、下一篇是《学彭帝打高尔夫球》，前一篇是《高尔夫长推技巧》，后一篇是《高尔夫低切学习》。\n\
    \n我很高兴地说，效果太棒了，仅仅几个星期，我已经拥有了 1000 个网站订户，他们从我这里购买了很多高尔夫球杆、图书等等商品，我相信，随着订户的不断增长，我的生意会越来越好。\n\
    \n再次为软文营销欢呼！\n\n汤姆森\n\n5 月 1 日\n\n## 自动销售！\n\n## 网站是怎样订阅的？\n\nGoogle 提供了一款免费工具：Feedburner。网址：http://feedburner.google.com\n\
    \nFeedburner 是一种 RSS 内容邮件订阅工具，使用 Feedburner 后，你可以在你的网站上放置一个“订阅”按钮，当你的网站访问者留下他的电子邮件以后，每当你的网站或博客更新，就可向读者自动寄发更新文章，不断地将客户拉回到你的网站，也不断地让潜在客户看到你的内容。\n\
    \n需要注意的是，从网上销售角度，订阅者都是你的销售线索。如你提供的“高尔夫”内容，对高尔夫没有兴趣的人，是不会订阅的，而一旦订阅的内容的人，很可能就是高尔夫的爱好者，他们有相关购买需求和消费能力。\n\
    \n这是一种很棒的销售方式，也就是实现了自动销售，你所要做的，不过是建立一个网页，多写软文，让人们通过这个网页，主动订阅你的内容，如果你有一万名订户、有十万名订户，就相当于有数以万计的准客户。\n\
    \n## 邮件自动回复机\n\n自动回复机，是国外的一种网上业务营销工具。\n\n如果说推销员通常要与一个客户接触7次以上，才能与这个客户完成销售。那么自动回复机，就自动化地完成了这个销售过程。\n\
    \n## 自动回复机的原理\n\n用户在你的网页上留下他的电子邮箱。接下来，自动回复机会自动向客户发送电子邮件，每天一封，或两三天一封。所发送的邮件，都是你事先写好的软文，一次写好七封甚至更多封，然后将这些邮件放置到自动回复机上。\n\
    \n当一名新客户订阅你的内容时，自动回复机会依次寄出邮件，一切全部自动化完成，你可以外出旅游，也可以度假，都不影响你的销售。\n\n## 国内少有自动回复机\n\
    \n由于中国反对垃圾邮件，而且中国人普遍不了解自动回复机，容易将此类邮件判断为垃圾邮件，因此，几乎没有这种销售武器。如果你要使用，可从国外购买该项服务，年使用费几十美元。\n\
    \n国内的电子邮件服务，通常设置有“自动回复”功能，你可以考虑加以利用，告知发信的朋友“阅读《美甲的三个小秘密》，访问网页：http://......”，可以采用人工方式，收集订阅者的邮件，也可以自行开发简单的程序，向订阅者发寄邮件。\n\
    \n总之，电子邮件是网上经营者的最大财富。\n\n## 什么是软文营销\n\n软文营销足一种以销售或增强影响力为主的营销方式。文章会直接或间接地包括业务、联系信息，以建立个人影响力、企业品牌信誉，吸引新的客户。\n\
    \n## 软文营销的背景\n\n在报纸印刷出现以后，文章就已经被专业的营销人员广泛使用，他们利用印刷的形式，制作传单、广告、新闻。最初，一些企业向报纸提供有益的内容、动态和消息，报纸免费刊登并报道它们，直到今天，这种方式依然普遍存在。\n\
    \n例如，会计师事务所可以向当地市场写一篇文章为《避免被审计的十大方法》提供给当地的几家报纸和网站，同样，修理屋顶的公司也可简明地撰写一篇文章为《如何避免冰雪损坏您的屋顶》。\n\
    \n## 网上软文营销\n\n随着电子商务和网络营销的崛起，软文的营销转移到了互联网世界。传统的媒体也向互联网提供内容，而网上的内容也可能向出版商提供，软文是免费的广告和品牌宣传，在互联网上快速传播。在网上张贴一篇文章和张贴一则广告是完全不同的，赤裸裸的广告容易遭到排斥、删除，而有价值的文章则容易受到重视。\n\
    \n不同于传统媒体，互联网上的转载量和传播率是惊人的，一篇出现在大型网站的文章可能在一日之内在成百上千的网站上被转载。所以，有眼光的作者通常会注意到这种转载性，强化其转载传播效果。所以，一篇文章，有时会被复制成几百条、几千条覆盖互联网。\n\
    \n同时，软文的营销还有其网络营销的性质，最显著的特点是：进行优化后的文章，可能针对某些特定的关键词，在搜索引擎中出现，以迎合这些市场的需要。作者能够将明确目标的内容，发送到一个对它感兴趣的读者群中。\n\
    \n许多网上的经营者已经开始享受这种低成本的营销方式，更多的企业和销售人员试图在互联网上到处张贴广告，致使互联网上垃圾内容成堆。经营者如果不小心滥用互联网的这种传播性，为了宣传目的，发布质量差的内容，很容易引发反感。\n\
    \n垃圾内容越来越多；人们对高质量文章的需要也就越来越重要，商质丑的软文是非常容易受欢迎的，高水平作者会用高超的写作技巧——巧妙地说服潜在客户。\n\n##\
    \ 软文在互动营销时代\n\n软文营销已经成为越来越受欢迎的营销方式，通过博客、论坛、网站写作和投稿专栏，许多话题，正以核爆的能量在互联网上传播、流行。\n\
    \n50%以上arki的互联网用户在搜索引擎上阅读、查找内容，高质量的原创内容+有效的 SEO 策略，将获得较高的网页排名，很容易吸引到更多访问者。对许多销售网站和公司网站，借助软文增长流量和销售，已经被证明是最有益和最有效的方式之一。\n\
    \n此外，包含网址的软文，可以快速增加更多的反向链接，使一个网站的排名在搜索引擎中上升。因此，通过写作和有效分发这些书面的带有链接的文章，已经成为一种趋势，这种趋势被搜索引擎所接受。\n\
    \n但是，由于互联网大量免费转载的特点，导致大范围重复的内容出现在互联网，一些寻求大量反向链接的作者可能因此牺牲文章的内容质量，而高质量的首发原创内容则被搜索引擎所重视。\n\
    \n## 软文炒作\n\n## 炒作已经成为现代传播的特点\n\n有诗没事儿的炒作，已经成为现代营销的重要话题，从这些年的营销中，创造了诸多经典案例，如老板喝涂料、鸭鹅大战、鲸鱼漆叫板国标、酱油风波、格力剖开空调秀心脏、奥克斯参娘革命、红太阳寄海君牺牛、耗子药寻找形象代言人等，都是讲究传播效果，不免空谈品牌，在很短时间内都创造了比较好的营销效果。\n\
    \n## 炒作所要遵循的原则\n\n1、站在整体营销的角度系统地考虑问题，而不只是“事件营销”本身；\n2、站在整个品牌战略和品牌管理的角度一致性地考虑问题，而不只是追求短期的、让你“3分钟爽快的轰动效应”；\n\
    3、站在顾客满意的角度考虑问题，而不只是一时间的“哗众取宠”、甚至“诱骗顾客”；\n4、站在整个财务效果的角度考虑问题，而不只是没算账就认为此次“事件营销”一定是低成本、高效益。\n\
    \n## 网络炒作源于宣传策划\n\n以金龙鱼为例：\n\n2003年02宣传重点\n\n金龙鱼第二代调和油处于产品普及阶段，其宣传重点：\n\n二代调和油普及性品类教育(调和健康概念)\n\
    \n深化核心利益点与大众的相关性(调和油更健康)\n\n传播阶段划分\n"
  mdcn: "\n在文章的最后一段加入哲理：讲两句道理，或者寓言，或者引人思索的短小例子，常有前俯后仰之效，山高水长，令人回味。如：“朱则荣语：网站即工具！哪怕再小型的网站，也要寻找其特有的方向，螺丝刀虽小，可它也是一个独有的工具，你却常常离不开它。”\n\
    \n## 软文九忌\n\n1、忌“我”，对于所有写手来说，用第一人称是写作大忌。 \n2、忌流水帐，文章太过简陋，写作太过初级，文中必须出现罗嗦的细节和描写，使文章既琐又散。\
    \ \n3、忌简单抄袭，天下文章一大抄，但即使是抄，也不能让读者看出是抄的，最简便的方法是删改，即删除原文大块的废话，保留精髓，再加入自己的思路和语言，就是截然不同的新文章。\
    \ \n4、忌太啰嗦，要解决这个问题，必须舍得删，舍得改，大胆地删除自己写的废话，舍得将与主题无关的语言进行大段修改。 \n5、忌华而不实，务必每一个字言之有物，这是文章中的务实。\
    \ \n6、忌想要表达的环节太多，一文一议，一事一简，不要试图在一篇文章中出现很多主题、很多人名或事件，读者是无法消化的。 \n7、忌前后矛盾，文章中出现重复表达、前后矛盾、公私不分、上下关系混乱等等，都足不可取的。\
    \ \n8、忌广告，偶尔广告一下完全可以，整段整篇写广告，人人排斥。 \n9、忌道德问题，中国是一个道德伦理社会，只要不触犯道德底线，没有问题，一旦涉及道德问题将引发众怒，如某作者说：“我在名牌大学毕业，我认为推销员只是那些没文化的商中生才干的工作”，结果两个字，“找骂”。\n\
    \n## 软文写作不要抄 要套\n\n切记，不要抄，要套！每个新手都会模仿，关键是如何模仿，我们强调软文的写作手法，卓学课堂在软文写作中列入了二十余种写作手法，就是帮助作者直接套用的。\n\
    \nwww.zhuoxue.org\n\n© Zhuoxue Classroom, 2010,9 在中国地区制作\n\n## 软文写作要素\n\n## 软文写作五要素\n\
    \n### 1、主角\n\n究竟是以什么为主角？作者、品牌、网站、企业、还是某某某款产品？一定要搞清楚软文究竟以什么为中心，是用来表达作者的个人观点，打响个人品牌；还是推广某个品牌，形成品牌影响力及潜在市场；推广某一个网站，追求网站知名度；还是推荐某一家企业，以灵活的手法将这家企业写活；或者是推广某类某款产品，以期达到一定的销售目的。\n\
    \n在软文写作之前，主角一定要定好，方能进行系列的写作，诸如小说中的主角，一切的语言、描述、故事情、思维都围绕着“主角”而动。\n\n### 2、素材\n\n\
    素材来自于积累，来自于采访，来自于阅读，来自于思考。正如“巧妇难为无米之炊”，素材即“米”，无米则无法“下锅”。文章之所以写不好，首先在于没有素材，天马行空坐在哪里空想，结果是既抓不住主题，又使内容极度空洞。蒸馒头要有面粉，素材就是面粉，而写作仅仅是发酵的过程。\n\
    \n### 3、思想\n\n思想决定文章的层次，也决定最终成败。比如你的赚钱思想比较重，文章中会尽显“赚钱”之意，没有钱的小老百姓才天天想着“赚钱”，企业家、高级经理人、官员与精英以及稍有长远眼光的人，年薪少则二三十万，赚钱对他们来说没有任何意义，你跟他们谈“钱”，会让他们感觉一个字“俗”，因此，文章中如果谈“赚钱”、谈“省钱”、谈“走捷径”，那么作者这一辈子也只能在社会底层混混，永远上不了台面。\n\
    \n写作，足作者的思想体现，足作者的思维表达，足作者所思所想所感所悟所思想，说到底，文章就是作者的思想层次思考特点与思维整理。因此，一定要提高思想层次，提高思维水平，加强思考能力，这是写作的不二法门。\n\
    \n### 4、写作手法\n\n这是将素材与文章的加工整理手段。正如前面的蒸馒头，写作技巧就是“发酵”的水平和能力。大厨做菜肯定和家庭主妇做菜不一样，工程师和建筑工人所采用的方法绝对不同。\n\
    \n写作手法追求两点，一是文风，二是技巧。写作大“家”追求的是文风，即写作的风格，必求独一无二，方成大家。而写作小“家”必求技巧，用怎样的套路来快速写文章，使写作水平成熟。任何作“文”者，皆是先求技巧再求文风，循序渐进，步步成长。\n\
    \n### 5、写作载体\n\n文章发到哪里去？报纸、杂志、广播还是互联网？\n\n给哪方面写文章？管理类媒体、IT类媒体、站长类媒体、旅游类媒体？\n\n\
    文章要依托这些载体呈现在人们面前，所以写作前，要确定具体的载体。纸面写作和网上写作不同，网上写作和网站写作又不同，给不同的媒体写文章又各有特点。作者任务在对各种载体的特点和发文方式要做以了解和研究，掌握了载体的特点也就掌握了文章发表的源头。\n\
    \n## 撰写软文的十二项注意\n\n### 1、先定标题 再写正文\n\n标题是一个作者最高文字水平的体现，标题是文章的广告，要使文章引起读者的阅读欲。增强文章逻辑性，撰文讲究“指哪打哪”，力避文章“打哪指哪”；让人看后不知所云。作者要多加强标题制作的能力。\n\
    \n### 2、多用固定结构\n\n结构：“标题+导语+第一+第二+第三”。如果写新闻则是“标题+导语+第一新闻事实+背景补充+第二新闻事实+事件后续事实”。\n\
    \n导语应高度提炼，以打动读者往下看。正文亦以分析评论为主，第一、第二、第三条理清晰，逻辑严密。必要时，可在文后单独追加解释性内容。切忌不余时间做文章的主轴，记流水帐般“媳妇道来”。\n\
    \n### 3、多用动词少用形容\n\n写作时多使用动词，少使用形容词，多用语言确切的分析及肯定性语言，少用叙述性语句和不确定性、询问性语言，以此使文章生动起来。诸如“因为……所以……”、“而且”、“虽然”…等连词也要少用，以免影响稿件的紧凑与节奏，而“假如”、“好像”、“也许”、“能不能”、“似乎”、“可以”等不确定性词语坚决不用。\n\
    \n### 4、勤分段 别超3句\n\n每个自然段，字数不得超过150字，两至三个句号，给读者阅读喘息的机会。篇幅如果超过1000字，每300到400字要有一个小标题，先拟标题再行文，设计结构，多用动词，简洁有力。\n\
    \n### 5、严控篇幅当舍则舍\n\n如报纸，小幅报纸无广告时的整版刊文盎不到4000字，每版刊发条数在8-10条左右，加之图片所占版位，每条消息的上上限锁定400字，而大张报纸一版无非8900字。网络没有篇幅限制，但读者都不喜欢读长文，蜿蜒点水，一眼扫过，读者会对信息进行筛选、点选，这一点对作者而言是至关重要的。切不可想到哪，写到哪，最后把编辑和读者带入千里茫茫之中。\n\
    \n### 6、内容取胜但别沉溺\n\n文章以精彩的内容取胜，但不追求细节的扩展。增强文章的实质内容是绝对要点，一定要=有提领意识，不要把简单堆砌。\n\n\
    ### 7、条理清晰少用废话\n\n作者不是搬运工，没有必要到处“搬运”相关观点和描写，必须力保文章简单明确。\n\n### 8、称谓别忘尊重人权\n\n\
    无论写任何文章，不要随便就写“骗子王某”、“强奸犯李某”、“妓女岑某”、“小姐赵某”、“无照小贩张某”等，那是司法问题，法院都没有定罪，你又岂能毁人声誉。另外，在文章称呼人时，不要带有地域歧视，如“张某某是河南人”、“山西人陈某”等。\n\
    \n### 9、专业术语多加注解\n\n不少领域，特别是专业性较强的领域，如财经、科技、通信、法律、医药等，作者撰写此类稿件时，经常需引用专业术语，除非你是给内行看，如果给外行看，要勿加注解。毕竟读者不同于熟悉业务的作者，一个在业内经常使用的专业名词，却很可能成为读者阅读的障碍，如“商开低走”、“3G\
    \ 手机”、“ISDN”、“固体燃料”、“举证倒置”等。\n\n### 10、数字要准不可连用\n\n稿件中使用数字要准确，应与原始资料反复核对。对于在文中列举的以数字排序的并列内容，最后要再数一遍，不要出现“前面说足八大方面，后面实际只有七项”的乌龙情形。如果一定要用数字，一段内最好不能连续使用\
    \ 3 个，数据新闻除外。\n\n### 11、准确运用“的、地、得”\n\n稿件中“的、地、得”的混用，经常给校对增添工作量。要严格依照字典上的规范，区别它们间的不同使用环境，准确运用。的：用在定语后面或用在谓语动词后面，地：表示它前边的词或词组是状语，得：用在动词后面，表示可能。\n\
    \n### 12、标点符号要写明\n\n标点符号是帮助编辑和读者顺利读懂文章的工具。作者在写稿件时，必须忠实遵循语法规则，使用各种标点符号；禁止整段“一逗到底”。在电脑文本格式的选择上，也要确定中文标点全角模式，避免给排版带来困难。\n\
    \n## 软文写作工具\n\n### 一、写字板\n\n写字板是写作时最常用的工具。之所以用写字板，而不用 WORD 写，主要特点在于，从网上复制粘贴资料，不受影响，在\
