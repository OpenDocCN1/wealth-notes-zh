    # 什么是软文


    # 什么是软文？


    国际新闻学惯例，凡是未涉及重大政治、军事、社会事件的新闻，一律称之为软新闻，即软文。因此，软文通常是以新闻通讯写法撰写的文章。软文是从重大新闻报道中脱颖而出的信息内容，人们根据这种信息来对自己的生活方式、工作方式和采购等行动做出指导和选择。


    # 软文处无不在


    软文无处不在，最为主要的环节是影响了我们的生活消费。


    示例:


    |  | 新闻类型 | 经营方式 | 经营方收入 |

    |---|---|---|---|

    | 1 | 电影新闻信息 | 销售门票 | 票房收入 |

    | 2 | 演唱会新闻信息 | 销售门票 | 门票收入 |

    | 3 | 新款手机新闻信息 | 销售手机 | 机型收入 |

    | 4 | 特色菜展示新闻信息 | 销售餐软 | 餐馆收入 |

    | 5 | 七星级酒店新闻信息 | 销售客房 | 客房预订收入 |

    | 6 | 英语培训机构新闻信息 | 销售课程 | 学费收入 |


    # 典型的软文


    # 示例一：Zippo打火机风靡全球


    在全球的“另类收藏”中，恐怕没有任何一收藏品能够像Zippo(美国一种打火机品牌)一样，从诞生之日起就迅速风靡全球，人们甚至专门为其设立了“国际Zippo日”。


    由于Zippo收藏爱好者众多，早在1994年，国际上就专门设立了“国际Zippo日”，并从1995年起，每年举行一届Zippo国际旧货交换会。


    Zippo打火机的收藏价值主要体现在加工工艺、题材内容以及市场流通量三个方面，编号等其他因素影响并不大。在一个专门经营Zippo打火机的网站上，一位卖家向记者表示，由于厂家生产的种类繁多，每种主题的升值空间都不同，因此未来升值潜力大的主题就成为收藏者们的'
  - '[PAGE 2]


    目标。“一些有中国特色的限量版是藏家热衷的品种。这些特殊的Zippo版本，如邓小平纪念版等，往往是有价无市。”“他介绍说，‘其他如诺曼底登陆60周年纪念版、Zippo面世75周年纪念版等限量Zippo打火机也是收藏者们竞相追逐的精品。’”


    一般情况下，投资Zippo打火机首先最好关注其发行量。发行量越少，收藏的价值和未来升值的空间就越大。刚开始收藏Zippo打火机的藏家可以选择相对简干的款式，比如升值潜力及珍藏度已经在近年来得到普遍认可的纯银款式。此外，漆工、镀戍的工艺款式也都是藏家在收藏时所注重的。


    # 思考：


    通过软文的传播，奠定了人们对Zippo打火机的品牌认识，直接增加了美国原装Zippo打火机的指名购买量和销售量。而这个传播过程，是新闻媒体、Zippo爱好者们自己主动完成大量传播的，没有人认为这是广告。


    # 示例二：新东方设立早教体验中心


    （本报讯）日前，新东方儿童之家首家体验式中心亮相世贸天阶。短短一个月内，新东方教育集团连续在北京设立两家早教中心，预示着新东方已开始向早教领域快速扩张。


    2010年8月1日，新东方儿童之家首家体验式中心亮相CBD核心世贸天阶商场，开创了早教发展新模式。


    近年来早教这一朝阳行业发展迅猛，但长久以来其几乎固定不变的发展模式不仅有碍自身发展，也不便于家长直观地了解和选择。新东方儿童之家大胆创新，通过把旗下亲子中心——“光华路SOHO中心”同比例缩放至近在咫尺的世贸天阶儿童区，完成了首家体验式中心的尝试！此举无疑志在一举两得，品牌和市场双管齐下！


    在新东方的体验式中心，家长和孩子可以“抢鲜”体验新东方儿童之家的教育环境和理念，流连忘返于“小书虫书吧”，更可以第一时间感受其来自欧美的经典课程、置身于原汁原味的英语环境中。此外，各类富有趣味、富含教育意义的主题活动也将缤纷呈现。通过多姿多彩的课程与活动，家长能够接触到最先进的教育理念，帮助孩子提升各种能力，为家庭教育提供多元化的帮助和指导。


    # 思考：


    这篇新闻在腾讯网、新浪网、搜狐网、人民网等数百家网站和报纸上被刊登，媒体新闻编辑们自发地选用并传播这篇新闻，它指导了人们的教育消费，给新东方送去大量课程销售收入，但它是广告吗？从记者到媒体编辑，再到读者和家长，没有人认为这是广告。


    # 示例三：迪拜“七星级”酒店 奢华到令人窒息'
  - '[PAGE 3]


    知道全世界最华丽的酒店在哪里吗？知道全世界曾经最高的酒店在哪里吗？这两个问题其实只有一个答案：在迪拜。它就是迪拜的Burj Al-Arab酒店。


    迪拜是阿拉伯联合酋长国的第二大城市。20世纪50年代，它还是阿拉伯湾一个朴素的海滨小镇，到了90年代以后，迪拜发生了脱胎换骨的变化。鳞次栉比的摩天大楼在雾尔河畔奇迹般地崛起，让人以为自己仿佛到了纽约。Burj
    Al-Arab酒店的奢华程度令人叹为观止，评论家们都不知道该给它定为几星：是五星，六星，还是七星？酒店建在海滨的一个人工岛上，足一个帆船形的塔状建筑，一共有56层，321米高，由英国设计师W.
    S. Atkins设计。它正对着Jumeirah Beach酒店（被认为是世界上最棒的酒店），以202套豪式客房、200米高的可以俯瞰迪拜全城的餐厅以及世界上最奢的中庭，成为后者最强劲的对手。到过这里之后，你才能真正体会到什么叫做金碧辉煌。它的中庭是金灿灿的，它的最豪华的780平方米的总统套房也是金灿灿的。客房面积从170平方米到780平方米不等，最低房价也要900美元，最高的总套房则要18000美元。总套房在第25层，家具是镀金的，设有一个电影院，两间卧室，两间起居室，一个餐厅，出入有专用电梯。已故顶级时装设计师范思哲曾对它赞不绝口。


    # 思考：


    迪拜并没有在中国做任何招揽客户的广告，仅仅是这样的新闻、文章、趣闻在中国网络及报刊媒体中大肆传播，甚至你还会问朋友，你知道七星级酒店吗，然后告诉许多朋友——它就在迪拜，然后你在朋友们羡慕的眼光中，向他们介绍迪拜七星级酒店的细节，我们再举下一个示例，将两者连贯起来。


    示例四：迪拜七星级酒店六成中国客 消费能力让人吃惊


    # 北京青年报：阿联酋迪拜的帆船酒店是世界上唯一的七星级酒店


    在楼高321米，外形犹如帆船的迪拜标志性建筑——七星级帆船酒店金碧辉煌的大厅里，记者奢到不少中国人在这里闲逛。据新华社驻阿布扎比记者安江透露，中国人目前已成为帆船酒店的主要客源之一，这里有六成客人是中国人。在阿联酋约有20万华人，其中迪拜就有15万华人。尽管帆船酒店的房间有170至700多平方米不等，但酒店房间每晚最低9000迪拉姆（相当于2000美元）的费用似乎并没有吓到中国客人。


    曾经在帆船酒店做服务员的江苏籍姑娘黎黎告诉记者，以往帆船酒店对于入驻酒店有很严格的筛选，旅游团客人概不接待。迪拜危机后，酒店开始有选择地接待旅行团。中国客首当其冲，成为帆船酒店新的入住客生力军之一。


    中国人“豪迈”的消费能力常常令帆船酒店的服务员感到吃惊。今年春节，入住帆船酒店的客人中有10%是中国人。往来北京、上海、广州至迪拜的航班似乎更能说明问题，据已在迪拜工作了三年的阿联酋航空中国籍空乘张立坤介绍，中国往返迪拜的航班几乎班班都是满的，其中经济舱的客人大部分是中国人，公务舱则有一半是中国客人。


    # 思考'
  - '[PAGE 4]


    将示例三和示例四连贯起来，你发现了什么？这家酒店并没有在中国做任何广告，仅仅依靠新闻和人们之间的口口相传，已经彻底完成了销售，赚取了远远大于投资额的利润，如果你还在辛苦地用SEO(搜索引擎优化)、费力地模仿修改几篇网站故邦，以引可怜地拉拢几个网站访客，再进行一次销售转化，或者费力地还在为销售产品头痛的时候，善用软文早已用软文发挥了强大的销售威力，他们甚至根本没有使用网络营销人员或者业务员。


    # 错误认识：软文就是软广告


    软文是新闻，它不是广告。软文所提供的新信息，是用来指导人们的生活、消费、采购，给人们带来帮助的内容，诸如品红酒，任何一篇有关品红酒的新闻信息中，都会带有一些红酒品牌、原产地、器具等厂商的信息，这些信息增加了你的指名购买率，使你在心里，已经为即将的消费或未来的消费产生了明确选择。


    所谓软文即软广告的说法，是软文研究中的不当认识，广告的写作手法和新闻的写作方法完全不同。


    人们对广告有 hydroxyl 与生俱来的厌恶、讨厌和警惕，人们往往对广告的真实性产生质疑，担心虚假的广告会使他们费心积攒的财物、金钱蒙受损失，这种担心显得不是多余的，从一开始，人们就把广告和损失划上了一个等号，特别是对于从未听说过的企业品牌或产品，对于不知名
    的中型、小型公司，没有公众的信任基础，媒体的编辑们自发地抵触、网站的版主们无偿地删除、阅读者们怀之以十二分的警惕。


    弱小的软文的写作者和营销者们，在第一天必须思考清楚的问题就是：我们不能再卖广告了，因为人们根本不信任广告，这是所谓软广告的群体基础，建立在一切不信任的心理之上。正确的方式是——软文必须从新闻入手，它传递的是新闻信息，它必须以新闻的手法来撰写，编辑们看起来它nn是新闻，网站的版主们认为它是值得传播的新闻消息，用户们认为新闻是可信的。


    ![](img/9c5a94eedde119b872450b830636a0d0_4_0.png)'
  - '[PAGE 5]


    # 软文写作概论


    # 什么是软文？


    除政治、军事、经济、犯罪、民生、社会问题以外的新闻、评论、文章通常为软文，如艺术、娱乐和生活方式都被视为软文。


    # 崛起的软文和娱乐消费、生活方式


    在过去的几十年间，软文大显崛起。随着报纸、杂志、广播、电视、互联网的一路发展，新闻发生了庞大改变，娱乐节目和报道占据了越来越多的媒体版面。


    最早影响消费者的是名人新闻，他们作为一种时尚趋势，通过新闻的广泛传播，影响着消费者，最初流行的软文源自于无意之间，华而不实。进而随着广告的崛起，新闻发生一种作用，即它可能有意地在实施营销，因此新闻学将这种新闻独立出来，称之为软新闻，事实上，这就是软文。研究人员开始注意到一个重要问题：即软文是如何通过传播手段来影响其消费者的，他们意识到：增加软文的数量，可能导致消费。


    最终形成的结果是，几十年后的今天，生活水平日益提高，软文大显涌现，它们渗透在我们的生活、娱乐、消费等方方面面，有意无意地引导着我们消费，引导着我们记住一些品牌。


    # 软文所起到的作用


    启发线索。引诱我们注意到一些品牌、采取一些行动，获得一种潜在的可能影响消费的知识。


    # 软文的本质


    教育消费者，宣传品牌。


    # 写作的本质


    写作就是中心思想，围绕中心思想来做文章，文章有启发性、有价值。'
  - '[PAGE 6]


    # 软文写作的特点


    1、社会性。它是面向社会公众的，用来传递概念和意识、传播知识与观念、传达感悟与发表见解。


    2、写作性。以沟通、交流、传播知识和信息为已任。


    3、灵活性。和其它写作需要相对固定的写作格式和样式不一样，软文写作注重宣事达理、抒发感觉、传播信息、表现手法灵活多样。


    注意：一切是为了有用而存在。所传播的知识和信息，对其他人有用。


    # 写作意识


    写作是一种兴趣，写作更是一种爱好。小时候学语文，老师通常会帮助我们分析作者思路、讲解结构安排、遣词造句的特点，分析作品为什么要这样写。对喜欢写作的人来说，读书即写作，写作即读书。喜欢观察别人怎么写的人，就善于掌握写作规律，善于思考写作手法，读书时，我们也会碰到许多我们眼前一亮的东西，比如新颖的描述、富有表现力的句子，带有哲理性的语句等等，把他们记下来，适时用在文章中，常写常练，容易成为写作高手。


    # 软文写作的四大弊病(写作新手们必读)


    弊病一：无法持续。不可否认，现在的作者比较浮躁，总是企图通过一篇文章就实现巨显的网站点击，或者实现大压的销售。热情是好的，但热情不持续，而且大多数作者，写上几篇以后，看到没有多少人点击，也没有为网站带来多少访问量，热情也就随即消亡，从此罢笔不写。有些作者，在写了几篇以后，由于没有经过系统的写作学习，结果越写越乱，言不达词，语不达意，停笔者不计其数。更多作者，有写作热情，也希望通过软文写作为自己的网站、为自己的企业创造价值，但是在学习上总处于观望状态，不能下定决心好好看写作，扎扎实实地实现成功。一分努力，一分收获，写作需要长时间的积累，需要持续不断的练笔，要坚定信心，一定能成。


    弊病二：难以下笔。写作是需要技巧的，就象武功的修炼，写作讲究功力。有许多作者，开始写的时候就头痛，硬着头皮往下写，实际是，是没有掌握写作方法和诀窍，不知道怎样往下写。但恰恰这些作者，不问不学不追求，不揣摩与不思考。即便是这样费了“九牛二虎”之力硬着头皮写出来的文章，在投稿或在论坛发表时，也常常被编辑直接点了“删除”，或者在论坛中“底定江山”，为什么文章不受欢迎，他们从来没有反思过，因此一年、两年、三年，这一举子也就停留在了“想写，但又写不出”的地步。


    弊病三：只见广告，不见文章。看一下网上的软文指导和软文知识就知道，大家都说：“软文就是软广告”，然后拿着几百年前的“脑白金”软广告说事。我们需要注意一下，当年“脑白金”的软文，是按广告发布在报纸上的，也就是说，类似于“1个字1块钱”给报社赞助一笔费用，'
  - '[PAGE 7]


    因为它不是高质量的软文，只好当广告发。所以，从“软广告”的角度来说软文，本身就是错误的，而且很多作者，也没有那么多资金去给报社和网站赞助，“照猫画虎”，以广告角度学写软文的，写不了几篇，就会发现言之无物，不知道该写什么了。另外，之所以有人强调“软文就是软广告”，是有那么一批人通过替企业写软文、发表软文来赚钱的，按着这个方向学写软文，那是死胡同。


    弊病四：继续忽悠。我们这个时代，“忽悠”二字用得越来越多，于是许多文章，既没有章法，也没有素材，更没有实质内容，整篇文章逻辑不 Agon，言语表达无力，甚至连个中心思想也没有，写完了，自己都不知道写的是什么，这样的软文，肯定是要被各网站编辑“枪毙”的。站长网鼓励作者写软文，但是站长网的编辑后台中，控制不太严格，尽管文章尽可能给发，但每天被删除的投稿仍然占到
    60%以上。文章要有实质性，即便是软文，同样要脚踏实地，言之有物。


    # 软文写作要善吊读者的胃口


    许多作者，直肠子一路通到底，想说什么就说什么，很多不错的思路，却没有酝酿的过程，就直接写出来了，既没有条理，也没有逻辑，最终容易被编辑毙稿。写文章的，实际上象导演，牵着作者的鼻袋走，确切地说，作者足在和读者斗智，指指挥着读者向东向西，极有兴趣的地方，“且听下回分解”，要引导读者注意哪个品牌，勾起他们的欲望，让他自己去找答案。


    +   1、引读者上钩


    作者就是读者的主宰，你可以决定读者的喜怒哀乐，也能象个大将军，将读者的思路指挥若定。最精彩的语言在什么时候出现，读者急于想知道的答案，怎么既不告诉他，又去引诱它？


    +   2、你才是最大的软文


    软文作者就像在钓鱼，钓的是读者的兴趣，所要获得的成果——是扩大个人影响力或品牌影响力。因此软文的发表频率、发表媒体、发表策略，都要多方考虑。文章就是下“钩”，收放一定要讲策略，初学者，不妨多找一些高手给看看，或者让几个朋友多提一些意见，对新手来说，文章是“改”出来的。


    # 软文写作的核心是说服力


    要强化说服力。我们常说谈判和演讲，需要说服力，你才能影响公众，而文章，则是以文字的方式说服别人。所有的成名人物，除了演艺明星，那是一大批娱乐记者在替他们说，成名人物特别是历史性的成名人物，大多都有很强的写作能力，比如毛泽东、马克思、黑格尔、泰.
    勒都是<|start|>写作打天下的;过去历史中世界各国的政论论战、今天公务员考试中的申论，都是<|start|>文章的说服力。


    文章是一种理性的产物，是一种思考的结晶，是一种高智蔷的成果，因此，具有分析性、评论性、哲理性、指南性的文章，才会是最好的软文。要提高文章的说明力，有一些技巧，例'
  - '[PAGE 8]


    如：1、观点，说服别人，有时可能只是一句话，例如“多数网站创业遇到的最大的困惑是难以扩张规模”。2、数据，数据最能说明问题，你一再强调：“搜索引擎有多么重要”，没有人多少人会理解，但你换一种说法：“50%的网站访问者通过搜索引擎阅读网页”，效果大不一样。3、引用事例，如“通过这种方法努力三个月后，他的网站月收入一万元以上。”'
  - '[PAGE 9]


    # 如何写软文


    # 软文即文章


    “文章千古事，得失寸心知”，软文即文章，文章即软文，要写好软文，当从文章下手，曹丕曾言：“文章乃经国之大业，不朽之盛事”。古有“ensiones”，如<|start|>朝李斯《谏逐客书》一文名振天下，因此，软文之软，实则写文章的功底，因此，要把写文章作为一生的能力加以锻炼，永远不要为了写软文而写软文。


    # 从编辑角度看软文


    编辑一天要看十篇甚至几十篇稿件，对于很多稿件，编辑只是一眼扫过，删除是无情的，那么，这些稿件通常会犯什么错误？


    1、摘不落说什么。除非特殊的情况，编辑一般不接受很长的稿件，他们喜欢短稿，哪怕只有两三百字，编辑也会在刊物上找到发表的位置，但问题是，作者如果不能直截了当地表达出自己的写作意图，编辑直接就给稿子判了“死刑”。


    2、使劲介绍自己。编辑打眼一看，这位作者使劲在介绍自己的公司、自己的产品，把企业简介和公司产品当文章来发，编辑连一眼都不想多看，读者可不关心你的公司是干什么的你是卖什么产品的，文章偶尔顺带提及一下没有关系，但非要把文章当广告，编辑可跟你不商量。


    3、言之无物。编辑看了个开头两段，找不出亮点，没有看到你文章所表出的“闪光点”，觉得很“俗”，也就不会再往下看了。如果一开头，就能观点独到，编辑会眼前一亮，发表不发表是其次，编辑会先欣赏一下，他接下来要考虑的是放成重头稿件。


    4、编辑也想省事。编辑也想省事，不动一字就把作者稿件刊发出去，那是编辑所追求的事，绪，所以编辑看文章，先看写作手法是否简洁有力，段落分明，逻辑性超强，对于这类稿件，编辑二话不说就想刊发。反之，没有条理、叙事不畅的文章，必遭淘汰。


    5、编辑不喜欢罗嗦的稿件，特别不喜欢“流水账”式的文章，对于此类文章，编辑打眼一看，就知道作者不会写作，除非文章中还有可圈可点的描写，否则这类文章多是弃稿。


    6、编辑很喜欢有评论性的文章，很喜欢那些精彩的观点。因为编辑都是有文化的，而且他们希望文章更深一些，能让更高端更有文化的人阅读。就像卖东西，谁不希望自己的东西卖给世界500强，谁不希望自己的产品来个国安专用，编辑也是一样的，对于那些普通读者看起来深邃雅蕴、高深枯燥的文章，编辑会深感这才是好文章。编辑最缺的就是读者，所以读者中的高端，才是他们极力追寻的读者。'
  - '[PAGE 10]


    7、不要搞错了对象。有些文章不是不好，而是文不对路，你介绍营销的文章，投给了人力资源的网站，你谈旅游的内容，投给了创业的编辑，所以编辑自己偶尔看看可以，但不能发给读者去看。


    8、写得不好是没有关系的。写得不好，编辑有耐心帮你改稿，但文章没有灵魂，经不起推敲，编辑是不愿意动手的。


    9、一篇文章讲几个角度是不行的。一篇文章，只有一个主题，作者想在一篇文章里表达几个主题，编辑是不耐烦的，因为这些文章太散，编辑不想带你发表。


    10、编辑希望你提高写作水平。即使你的投稿热情很高，天天投稿，但文章从不改进，编辑看上两三次，也就熟悉你了，下次你再投稿，编辑一看你的名字就会皱眉头，“这家伙写得不行”，从此你就进入了黑名单。


    拒稿是很平常的一件事，每一个作者，即便写作水平再好的高手，也已经被编辑打的遍体鳞伤、麻木不仁了，而你如何还想写作，需要继续忍受千百次的打击，如果你经受不了打击，报刊和互联网媒体上永远出现不了你的名字。


    # 软文四要


    # 主题要突出


    文章不论长文短文，都要围绕一个中心，把所有的篇幅、段落，以至每句话、每个字都不要偏离了主题。正所谓：说者无意，听者有心。无论写什么一定要扣紧主题，不能乱分权，还要收得紧而又紧，不让每段、每句、每个字游离主题，不论长短都要紧凑，绝不能拖泥带水。


    # 开头要重视


    文章开头很重要，也被称之头“风头”，用高尔基的说：“写文章，开头第一句是艰难的，好好像音乐里的定调一样，往往要费好长时间才能找到它。”一篇好文章，注定要有个好的开头。开头
    Diagrams是重要的写作特点，过于严谨的文章存在以下弊端：当你的文章常常过于注重修辞，过于注重造句，过于平稳地去写，你就不可能靠文章打响战役。当你的文章就没有了气势，就不可能被人们争相阅读，更不可能靠文章带动一大片的人，而你也绝不可能只靠写几篇文章，就马上能立地生威，引起大家的注意。


    # 正文要分析


    文章要让人看起来非常有条理，文章的段落按重要性一、二、三向下排列，每一段的开头第一句话，通常是对该段内容的总结提炼。要注意消除每一个废字、废话是写作重点，分析是文章的重点，编辑的主要工作，就是删除废话，确保文章里没有一个废字，使之言简意赅，内容紧凑。人们喜欢读分析式新闻，就是因为这种新闻讲得特别透。当你准备写作时，你一定要想到两个字——“分析”，如果你的文章能注意到这一点，读者肯定非常喜欢。


    # 结尾要回味'
