    # 软文概述


    # 软文有什么用


    没有多少人关注软文的价值，更没有多少人真正认识到软文石破天惊的卓越贡献。


    让我们把眼光投向股 Google，这个一直宣称自己是一家从来不花一分钱做广告的公司，外界一直认为它神速般的崛起奇迹源于口碑。但究竟是不是口碑制造了 Google
    神话呢？如果撕掉这层神秘面纱，我们将看到什么？


    在数年以前，卓学管理学派朱则荣就对 Google 的演进史进行了观察。我们从新浪科技的历史中可以发现这一神话演进的规律。


