    # 其它各类软文


    # 专题软文


    什么是专题软文？


    专题软文，是以专题形式所进行的一种软文写作和传播方式，通过在媒体或网站上建立专题网页，使之从互联网上大量收获检索umulate。


    # 专题软文写作特点：


    搜索一部电视剧名称，例如：《大秦帝国》，排列在百度搜索引擎第一页的，往往是新浪网、搜狐网的影视专题，特别是遇到热门电视剧，百度每天贡献给新浪网、搜狐网的流量惊人。


    # 专题软文写作指南：


    +   1、专题软文并不一定用来在其他媒体或网站发表，而是用于网站自身的专题。例如“网站地图”，每天在搜索引擎中有上百次检索量，但没有相关专题，因此这些来自搜索引擎上的搜索量被分散到各个可能的网站，而通过制作专题，可以源源不断的吸收到相关流量，这些专题本身，也容易被其他网站复制、转载。积沙成塔，网站发展将会稳步增长。


    +   2、专题软文可以与所经营的项目捆绑，例如你正在经营工艺品，可以将“玻璃工艺”、“水晶工艺品”、“烙花工艺”、制作成专题。


    +   3、专题可以独立推广，例如在百度百科或其它网站的资料来源上，可以标题：“参考资料：电子商务指南专题，http://www.zhuoxue.org”


    # 十大软文


    什么是十大软文？


    十大软文，是以“十大”为标题和主要内容的写作方式。


    # 十大软文写作特点：'
  - '[PAGE 67]


    《2009 年十大明星》、《十大管理者必参网站》、《网站推广十大技巧》、《十大最酷旅游景点》、《十大畅销旅游书》等等。如果是“十大网站”或“十大产品”，通常在第二条或第三条，列入自己的网站或产品。


    # 十大软文写作指南：


    +   1、来自于多参考，多收集。\n2、十大软文传播效率很广，网站和论坛大多容易转载。\n3、十大很容易产生影响力。


    # 内幕软文


    什么是内幕软文？


    以《XX 内幕》、《XX 揭秘》为主的文章写作方式。


    # 内幕软文写作特点：


    由于人们大多喜欢对“内幕”、“秘密”产生好奇心，所以以此为题的内容，容易产生强大的点击率。


    # 内幕软文写作方式：


    +   1、多在网上以“内幕”、“秘密”为关键词搜索文章，多方参考或加工。\n2、开篇最好曲折，行文最好具有传奇色彩。\n3、“内幕、秘密”有时来自于对档案、资料的搜集加工，是来自于对于背景知识和情况的掌握。


    # 固定软文


    什么是固定软文？


    固定的节日、节气、活动，每年都有，新一年的文章完全可以来自于对上一年文章的翻新，固定的产品，如苹果种植、杀毒软件，都已经形成了大量的固定功效、作用等介绍文章。'
  - '[PAGE 68]


    # 固定软文写作特点：


    比如春节、暑假、年会，这些节日与活动是非常固定的，特别对许多产品而言，也是季节性的，如空调、凉席、取暖器等等，因此在网上经营这类产品，或需要用此类关键词做流星时，文章通常来自于对上一年文章的翻新、整理。对产品类的固定软文，则通常来自于对相关所有资料的整理加工。


    # 固定软文写作指南：


    +   1、勤搜集、勤整理、勤加工、勤建档，积累的相关资料越多，写作越容易。\n2、按时间固定的文章，每一年多花点力气制作软文，到第二年、第三年就非常轻松容易。\n3、按产品固定的文章，要下的功夫是对资料的收集，比如围绕“养猫”，你搜集的资料越多，写文章越简单，只需要把内容相互拆、合、删、增式的加工整理而已。


    # 生活方式软文


    什么是生活方式软文？


    指围绕生活方式写作的软文，通常用于将产品融入生活。


    # 生活方式软文特点：


    不要推销一种产品，而要倡导一种生活方式。例如酒店预订就是一种生活方式，围绕酒店预订怎么节约时间、怎么轻松预订、怎么享受快乐、酒店趣闻、酒店生活，以及在酒店里如何品酒、享受某酒店的冲浪浴等等，都是一种生活方式的享受。这才是文章的重点。


    # 生活方式软文写作指南：


    +   1、以生活享受、快乐健康、轻松愉悦为主题，只写生活，在生活中融入你的产品。\n2、将新科技、新材料、新享乐主义、新便捷方式、新惊喜等等生活素材与产品结合起来。\n3、以高品味的生活为主体。


