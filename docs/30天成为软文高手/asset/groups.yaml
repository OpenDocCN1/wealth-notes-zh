    QQ联盟用的人比较少，很多站长都觉得做那个联盟不赚钱。实际上QQ联盟的推广，最好用软文来推。比如QQ千里眼功能、点亮金色手机，你单独播放QQ的广告效果是不好的。QQ的大部用户什么都不懂，他们也愿意花点零花钱，开通这些功能，或者在朋友邓里炫耀一下，这个时候，你就需要写软文，用软文的方式把怎么开通千里眼功能、怎么点亮金色小手机的知识普及一下，你需要写文章手把手地教他们，教他们怎么手把手地操作，顺便把你的联盟代码放上去，让他们即刻开通。QQ非主流里面有几个比较大点的网站，网站上也就放三五篇这样的软文，收入也不多，每月也就能从QQ联盟分上个几万块。


