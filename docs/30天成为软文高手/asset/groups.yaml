    # 备料


    要广泛地收集相关信息。文摘离不开文章——那些在各类媒体上已经发表的文章。媒体成千上万，文章浩如烟海，而所要摘编的相关信息就散落在这茫茫烟海之中。单看一两种媒体难免会孤陋寡闻，多看，尽可能地多看，方能搜取更多的信息。一个人的阅读虽总是有限的，需要借助于外力弥补阅读量的不足。可借助的外力有很多，比如，培养一支文摘作者队伍，求助于他们就某一个、某几个专题进行采摘，变一双眼睛为十几双、几十双眼睛。再比如，点击网上的相关连接，对某一个或某几个专题进行搜索，从中获取更多的相关资料，等等。当案头的相关信息堆成了小山的时候，下一步工序可以开始了。


    # 筛选


    首先是粗选，即大刀阔斧地取舍。一方面，对信息进行归类，将相同、相近或相联的内容归纳在一起;另一方面，对重复的、相对比较浅白的和不适合的内容予以剔除。其次是精选，即留有余地切割。对粗选保留下来的内容再进一步地筛选，去粗取精，去伪存真，保留下最核心的内容。


    # 加工


    加工，是文摘的高级阶段，其特点是综合性强、概括性强，要求具有很强的文字综合能力和布局谋篇的水平。对已发表过的文章进行编辑加工，决不是简单的文字删改和篇幅的压缩，而是一种复杂的高强度的脑力劳动。就加工前后文章内容的变化而言，文摘编辑加工就是将文章变成了素材，形成简洁的文摘卡。


    # 从文摘到巨著


    19 世纪到 20 世纪，整个世界的学术界“欧洲中心论”占了统治地位。爱因斯坦也表示：“西方科学的发展是以两个伟大的成就为基础，那就是：希腊哲学家发明形式逻辑体系(在欧几里得几何学中)以及(在文艺复兴时期)发现通过系统的实验可能找出因果关系。在我看来，中国的贤哲没有走上这两步，那是用不着惊奇的。要是这些发现果然都作出了，那倒是令人惊奇的。”


    这时英国一位老博士表示了不满，他说中国的科技与文明是无比伟大的，推出了一部巨著《中国的科学与文明》，这位学者叫李约瑟。


    英国科学家李约瑟所撰写的巨著《中国的科学与文明》(即《中国科学技术史》)，影响了整个世界的现代中西文化交流，那么他是怎么写作这部巨著的?一方面，他不断收集资料，每周能收到朋友们四处为他收集的一尺高的新书，如论述宋代的瓷源、晋代、鞑靼的文官制度，关于道教等资料;二是制作文摘卡，他根据学科范围，缉辑资料文件夹、照片资料夹、附属文件夹，建立了一个庞大的资料存储和检索系统。由于这是第一次用西方语言写成的多卷本著作，因此每卷必须列出庞大的各种参考书目，他还特意编排了参考书目卡片索引，以备长期查证。此外，还编有其它专门卡片索引，如中国技术术语卡片索引，还有一个包括古代数千名中国科学家、工程师和医生的人名索引，最终这部巨著就是以文摘为基础形成的。'
  - '[PAGE 31]


    # 软文传播


    # 软文的规模生产


    在《软文标准件》中，我们讲解了规模生产阶段：制作各种写作模板、标准套件、文萃建档，存在专业分工，有人专管收集素材，有人专管查实资料，有人专管改写拼装，有人专管媒体分发，流水线化作业。通过对各种模板的组合搭配，使软文口径统一，文章千变万化，成批量生产。


    同样一个话题，交由 50 位作者，可以瞬间变成 50 种不同的稿件，粉褶和主旨不变，但文章的风格、写作方向和内容，都已经发生了实制性的变化。同样一篇文章，交由
    50 位作者改写，瞬间也将变成 50 篇不同的文章。


    各企业在举办新闻发布会时，通常会向参加新闻发布会的记者提供“新闻稿原始稿件”，通常有五至十篇以上，由不同的作者完成，风格手法不一，各媒体记者收到这些原始稿件，会围绕不同的侧重点继续进行采访、加工，也会再加入企业介绍、企业荣誉等不同的背景材料，因此变成数十上百种、千变万化，但又口径统一的宣传稿件。


    思考：最终，围绕一个事件，我们为什么会在网上及各种媒体上看到数以百计甚至数以千计不同的报道、追踪报道？


    # 软文的传播介质


    我们将媒体分为主媒体、次媒体、边际媒体


    主媒体：中央级媒体。


    次媒体：地方级媒体及行业媒体。


    边际媒体：各种企业报、内参、资料、简讯及各类中小网站等。


    软文的二、三层次生产


    我们可以思考一下，任何一个新闻事件，都会先由主媒体进行报道，次媒体及边际媒体进行传播报道。那么：


    第一个问题：文章必须先发往主媒体，才能形成扩大范围的转载与传播。'
  - '[PAGE 32]


    第二个问题：次媒体，也就是省市等地方媒体及行业媒体，同样拥有大旺的专业记者、特约通讯员及评论员，他们是不是也要对新闻事件进行加工整理、引伸报道、或者发表各种评论？


    第三个问题：边际媒体，诸如每一家企业报、各类中小网站，是否也拥有大丛专业写作者，以及大强的写作爱好者？它们是否会对新闻事件进行引用、评论、改写、组合？


    因而我们可以得出结论，事实上，主媒体，通常起到的是引导、催发的作用，而真正的软文大规模生产、改编、传播，则是由二、三层次的媒体写作队伍来完成的，由此才能形成巨大的传播效果，也能将新闻事件所要传递的信息分布到五湖四海，四方八面。


    # 软文传播


    以海尔为例：海尔是一个会“讲故事”的企业，这既是新闻传播的奥妙，也是海尔总裁张瑞敏的窍门，为什么海尔的形象能让人信任，因为它通过了很多的具体故事，研制出能够洗地瓜的洗衣机，写个故事；海尔进了德国，写个故事；讲企业内部人才竞选，写个故事；写上门服务，再写个感人的故事。


    海尔现今由始至终的传播，就是编故事在编织，正是通过了这些故事，人们对海尔的感觉不再抽象，大家认识了海尔，而新闻学本身就愿意去传播故事，一个记者写篇报道，里面有很多生动的故事，这个报道人们就喜欢看，一个写作爱好者，夸夸海尔的故事写写说说，写篇评论，得，又一个人在帮海尔去传播。


    瑞士有很多企业，给你一堆资料，没有一份是讲企业背景，资料里都是讲故事，每个品牌都有什么故事，每一个手表家族有什么故事，所有的厚厚的宣传材料都讲的是故事。


    麦当劳天天传播它的管理标准，哈佛商学院会天天发它的管理案例，艾瑞不断发表其搜集的互联网分析数据。这些都是传播的主体。


    # 软文发表


    事实上，软文本身，要若较在那里，如果软文纯粹是企业和产品的广告，你发表在哪里都没有用，任何网站的编辑、论坛的版主都不接受这样软文。


    但是，如果写的是数据、资料、分析、评论、研究、观点、技巧，任何媒体都大力欢迎。


    如果作者是个个人：要在与本行业本领域相关的网站上独立专栏、博客，以主推个人名气为主，辅推企业与产品。如站长类软文，发表在 IT 写作社区、站长网、艾玛网、创业邦、站长站、ITbear
    中文资讯站等网站。如你经营的是游戏网站，在站长类网站上效果是不会太好的，有些“文不对题”，自然要发表在游戏类咨询网站上。'
  - '[PAGE 33]


    一般而言，除非分析到位、写作水平较高，可以自由向任何相关媒体投稿并发表以外，专业水平及写作水平不太高的作者，就好在自己申请到的专栏、博客发发，先和编辑、记者、版主交朋友，形成一定的影响力了，再向外扩散。


    如果作者属于企业，直接的企业和产品性软文，发表比较困难，因此要善于“曲线救国”，以发表产品应用、产品解决方案、管理方法、经营思想、领导人观点、创业故事、研究文稿为主。


    此外，还可以独立制作成电子书、通过电子杂志等方式，自建媒体，自行发布。


    对形成一定品牌的企业和专家，软文的作用会大大加倍，如五粮液在广州报纸投放的软文：以某天出版的广州某报纸为例，五粮液刊登了介绍其产品的软文。软文篇幅在 700
    字左右，主要从五粮液悠久的历史、独特的地理位置等几个方面介绍五粮液产品的优异。据分析，由于拥有巨大知名度，五粮液在广州报纸上很少投放广告，而五粮液采用刊登篇幅短小的软文来进行产品的推广，是一种较好的媒介组合方式。


