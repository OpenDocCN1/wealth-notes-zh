    当我们认识清楚这一点，就应该更清楚地知道，创业本质上其实就是一种赌博，而要博得收益最大化，就不能只依赖良好的愿望，完美的计划，以及虚无缥缈的运气。大部分时候，计划是靠不住的，愿望总是被现实摧残，而好运气来得比你想象得要晚。


    # 分析：


    以上两则样例，都是以人名为中心，以个人品牌的方式撰写软文，通常不断地撰写，容易在全社会或某个领域产生巨大影响力，名气的背后就是财富。


    # 样例三：


    # 朱则荣：站长培训调查折射网站知识硬伤


    毕业课堂创始人朱则荣：我国站长界对知识的学习需求是极其旺盛的，这本身非常好，但是，培训也反映出一些集中和突出性的问题，折射出网站知识普及中存在的大量硬伤，这是今后需要加快弥补和知识更新的重要环节。


    硬伤一：技术开发与培训，都不重视新手引导策略。


    硬伤二：熟练个人技巧掌握，缺乏宏观发展思想。


    硬伤三：知识雷同严重，站长往往将某一种知识当做“救命稻草”或“摇钱术”。


    硬伤四：网站培训没有形成有效机制。


    硬伤五：网站知识短时间内难以形成“网站发展能力框架”。


    # 名家软文写作特点


    要做企业家，先做社会活动家，要经营成功的企业，先打响你的个人名气，再重复一遍：名气的背后就是财富。


    “大学之所以大，不是因为高楼大厦，是因为里面有大师”，在营销企业品牌和推广网站时，有很多人只注意了自己的公司名称或企业产品本身，或者自己的网站是什么，以这种名义写软文，无论是发表在论坛还是网站上，都很容易被直接“删除”掉，因为大家都认为，你这可能是广告。


    但是，以人名为中心，打造名家或专家形象，没有人认为你发的是软文，都认为是名家观点或专家建议，所有的网站和媒体欢迎这些“名家”和“专家”的到场，只要你说的好，所有的编辑都会给你“头版头条”、“全站推荐”，就像
