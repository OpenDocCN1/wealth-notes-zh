    500 字左右的文章，象豆腐块那么大小，系统地介绍微波炉的好处、选购、使用、菜谱、保养方法等等，迅速在全国产生连锁反应，随即有关微波炉的文章铺天盖地而来。而格兰仕成为人中龙凤，被各种媒体迅速抬起。


