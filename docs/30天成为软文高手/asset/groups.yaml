  mdcn: '

    泡在那些论坛里，另一方面还在成天发愁怎么网上生意不好做的时候，你花费的最大成本是时间上的浪费，不妨花点精力学习写文章，让文章来替你营销。


    你肯定干过这种事儿：看到人家哪篇文章写得好，有价值，就复制粘贴到自己喜欢的论坛上去，每天，这种粘贴复制不知道被重复几亿次，如果说两点之间距离最短的话，那么在网络上，从
    A 网站到 B 网站，搬运一篇文章的距离是多短？所以，做网站人的都笑称自己是“搬运工”。


    你在网上，成天都在忙这种事儿？我没说错吧。


    人家都在忙着搬运什么呢？


    文章！没错，特别是原创的文章！


    注意看好：你的一篇文章如果出现在网易上。


    两个小时后……

    腾讯、TOM、人民网、新浪等多数网站相继出现


    24 小时后……

    大约两百至三百个网站上会出现。


    48 小时后……

    大约一千多个网站上出现。


    72 小时后……

    继续被扩大


    你的文章如果第一次扔在行业类网站上，比如站长网。


    24 小时后……

    十个左右的网站上出现


    48 小时后……

    二十个左右的网站上出现


    72 小时后……

    继续被扩大


    注：不同文章的质量、性质不同，因此传播的速度不一定。


    ## 在论坛推广


    如果你在网站发布在某个著名网站的论坛上，死定了！除非被该管理员放在首页推荐，但转载率并不是太高。


    ## 转载最差


    很多人认为，文章中带有 MM 等字样的，会比较火爆内容的，传播率高。其实你错了！这类文章根本没有实质内容，无非在某一个网站或论坛上点击率高，传播率是一种虚高。


    软文的转载率也很差，除非是以金钱开路。


    ## 转载率最高


    指南类、评论类内容转载率极高，这是因为内容对大家都有帮助。而新闻等等内容，并不是你能写的，记者没辈也不会去写你，不做考虑。


    ## 网上写作论之五：没事胡扯几句的即兴写作


    给媒体写稿需要一定笔力，这是多年练习出来的结果，但网上写作则不同，完全是没事胡扯，随感而发，即兴写作，并不需要注重什么固定的格式，也不讲究是“开门见山”，是“倒叙”，还是“追溯”。


    网络上的文字五花八门，最吸引眼球的常常是那些色诱、奇谈、故事、指南一类的文章，以及简短有力的评论。作为心情的放松也好，期盼找到共鸣也罢，信手而至，随手拈来，这就是特有的网络语言。


    即兴写作的特点是：和“用过即扔”的一次性杯子一样，如果你非要按章法去写，或者反复思考了半天才去动笔，那么你完蛋了，不要指望能够在网络上出人头地，你永远也难以写出多少数量，而且，不会创造多大的影响力。


    没事胡扯就是优点，随感而发就是特征。这是一种无所事事的写作，很多时候，邮件什么事情也没有，你也很高兴在自己的博客上写写字，邮件是最无聊的流水帐；有些时候，你就是想瞎扯两句，把自己的经验、故事写出来，管它管那个代表点击量的数字。


    也因此，全民胡扯占据了网络的主流，而纯文学则被逼到了角落，识别一篇文章是不是精彩，已经不是拿着放大镜去查看其语法、描写的时候了。而这股洪流也正在向网下蔓延，畅销书的作者们，没有几个是从文科科班出身的。


    ## 网上写作论之六：网上登龙术


    有些人常给媒体投稿，但往往失败，不是你的稿件质量不好，也不是你没有才华，更不是你说的话没有道理，而是你没有名气，你所说出来的话，没人在乎；你难以有客户，难以遇到投资商，你常常地很被动，并不是你的东西不好，而是你没有声望，人家不信你。


    朱则荣道：言轻而人微！---记住这五个字，反复参详，把它刻在你心里。


    ## 用文章砸开那些有名的网站、论坛


    - 你不是在和某一个人交往，而是和这个网站所需要的内容交朋友，你需要下点功夫去观察对方常刊登什么、什么是焦点。

    - 你知道他需要哪些文章，你也知道什么样的文章会变成重点头条，那就用文章开炮吧，不需要给任何人打招呼，也不必认识对方，接近的三五篇发上去，一点小意思，当几十篇扔上去的时候，你已经变成了对方网站最需要的写手。

    - 你的地位将空前绝后，对方的编辑和版主们迫不及等地想和你交朋友，他们甚至能提供他们自己所掌握的人脉和资源，帮助你写出更多、更好的文章。


    ## 用教程让自己升华


    - 那些著名网站，不管是网易还是新浪，都大量地急需清晰简洁的指导课程、参考指南、专题文集。越是空白，越是没人写的内容最好，准备好这些内容吧，然后去打电话、发邮件给那些编辑，告诉你新出的教程，只要内容符合他们的胃口，你在这些网站上就有了自己的地盘。

    - 那些同业同类的网站，严重地缺乏这种系统性的资料，当你准备好了，就和他们联系，他们会很乐意为你开辟专栏。

    - 这些专栏就是你的名片，可以帮助你打开投资者、任何关系网的大门，他们把你当作专家，他们更愿意接受你这位专家的意见，也乐意和你这位专家交朋友。


    ## 威望与名气的崛起


    - 与大站的记者编辑们交上朋友了，有什么重大消息或内幕或选题，他们第一时间会通知你，或者问问你的意见。你的观点和名字，将以专家的身份堂而皇之地出现在重大事件评论中。

    - 记者们随时可能给你做单独的文章，以你的一些观点为主，加上他们的一些形势分析，你的名字将迅速在那些著名的网站上出现。

    - 著名网站之间一直互相取稿，某一个网站上一旦出现关于你的报道，不出两个小时，所有著名网站上大多会出现，再过一两天时间，成百上千的网站上就会出现。


