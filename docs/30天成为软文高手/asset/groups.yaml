    # 朱则荣网上写作论（一）


    你的手掌上没有“笔下生花”的<|start|>纹，这并不代表着你不能拿起键盘做武器，为自己开天辟地，横扫六合。网络的世界里任由你去征战……


    ----朱则荣


    这是一个完全精华版的辅导课程，也是网上登龙术的必参，由管理科学家朱则荣撰写。你之所以在网络上不怎么成功，原因就是----言微而人轻！而这份课程就是教你创作如何能被自动传播的文章。


    +   一、从现在起，不管是在你的网站、论坛还是博客上，你的文章都将象流行趋势一样，快速地被人传播，甚至，你连网站都没有，却很容易出人头地。


