    ## 软文高手的视野 社区报


    ## 社区报：我们专注于身边


    美国新闻史上公认的社区报，是 1690 年 9 月在波士顿出版的《国内外公共事件》。经过 300 多年发展，社区报已成为西方报业的独特景观。尽管遭受互联网与金融危机的双重冲击下，但社区报的坚强生命力令大汗汗颜。


    美国全国报业协会则把社区报纸定义为：旨在通过提供新闻和资讯的方式服务并建设本地社区、提高社区居民生活质量、打造社区纽带的报纸。事实上，社区报的唯一标志就是它“对某个特定社区的服务性和归属感”。


    ## 英美大报发行量大幅下滑


    “2044 年 4 月最后一 日报读者将结账走人。”美国北卡莱罗纳州立大学的教授菲利普·梅耶在《正在消失的报纸：拯救信息时代的报业》中做出这样的预言。


    美国英国报业目前面临严峻的挑战，除了来自迅猛异常的互联网等新媒体的强烈冲击，2008 年底的金融海啸则让其雪上加霜。在美国，《落基山新闻报》、《西雅图邮报》相继倒闭、停刊印刷版，发行量核查机构(即
    ABC)于 2009 年 4 月发布的统计数据显示，《纽约邮报》、《亚特兰大宪章报》、《波士顿环球报》等著名大报分别下降了 7.5%-20%不等。在英国，22
    份大型全国性报纸发行量下降，每年都在以 5%——10%左右的幅度下滑。据报纸核查机构 2009 年 11 月的数据显示，在过去的一年中，《泰晤士报》发行量降幅高达
    9.18%，《卫报》发行量下降了 11.97%。


    ## 英美社区报异军突起


    然而，尽管西方的大报处在一片颓势之中，社区报却呈现出了对抗报业经济衰退的趋势。NNA(美国报纸协会)的调查显示，美国 7000 多家社区报目前拥有共计超过
    1.5 亿的读者，占人口总数的将近半数。


    虽然互联网的冲击渗透到了生活的各个角落，但对于“无报不成镇”的美国人而言，社区报依然扮演了极其重要的角色。在英国，也有消息印证了这一凛冬中的亮点。2009
    年 3 月公布的数据显示，有超过 1300 种社区报纸，其媒介到达率远远高于其他媒体。调查还显示，有 80.4% 的英国成年人(超过 15 岁)阅读社区报，而只有
    61.0%阅读全国性报纸。在阅读区域性报纸的读者中，有 28.9% 的人不读全国性报纸。在过去十年中，区域性媒体的阅读人数上升了 60.9%，可见，遍及城乡的社区报也是民众日常生活中不可缺少的部分。


    数据表明：虽然受到互联网等新媒体冲击，传统大报遇到生存困境，但立足地方新闻，大量成本相对低廉的社区报，不仅将继续存在，甚至已经成为挽救报业下滑趋势的希望所在。


    全世界有 97%的报纸为小报，它们发行量在 5 万份以下。美国 2004 年统计的 9321 份报纸中，只有 217 份大报。美国全国，从中产阶级集中居住的城市郊区到广袤的农村，再到少数族裔聚居的社区，小报包围了大报，大报日陷窘境，但小报却焕发新姿。在对
    1027 份全国性周报的调查表明，45%在农村，46%在郊区，9%分布在大都市的中心区域，比较典型的美国家庭会有两份报纸：一份城市大报，一份社区报。小型社区报和大报的数量比例达
    7：1，就总量而言，小报读者是大报的 3 倍。


    ## 小城镇的报纸比大报更具发展优势


    毫无疑问，小城镇的日报总体比大多数区域报纸或者全国报纸的情况好很多。根据 AUDI BUREAU 的发行量显示，2006 年 10 月至 2007 年 3
    月.星期日报的发行量下滑 2.7%，不足 2 万份，而集团报纸总体发行量下滑 4.6%，12 家都市报包括《纽约时报》、《洛杉矶时报》等 的平均发行量都下滑了
    7%。


    但小城镇有报纸却在享受发行量上升的喜悦。如休斯敦镇的两份报纸，一份日发行量上升 5%，达到 35416 份，周日刊的销量则上升 4%，达到 35293 份；另一份日刊和周日刊销售量分别都上升
    3%，达到 85195 份和 92347 份。密歇根州的小镇报纸在周日刊市场基本饱和的情况下，日刊销售量上升 16%，达到 48741 份。不仅发行量上升，许多社区报的广告收入和利润相当鼓舞人心。


    在广告的分类处理上，中国的传统都市报往往将大量广告堆砌在广告版上，读者阅读时往往感到十分乏味甚至跳过不读。而美国社区报将广告分类处理，大大提高了广告的“到达率”。而且读者也不易感到版面杂乱无章。有调查显示，大部分读者并不排斥阅读报纸上的广告，关键是报纸如何以一种合适的方式传递，美国社区报的广告经营方式是一种典范。


    除小镇报外，还有乡村报(country newspaper)、家乡报(hometown newspaper)、草根报(grassroots newspaper)等等。


    ## 内容为王 只有我们才是独家内容


    ## 大报永远无法打败小报


    大报以及大的网站，其内容基本上都是雷同的，他们之间竞争的已经根本不是内容，所谓“内容为王”的道理，对大报、大网站根本无法适用。发生一起飞机失事件，所有的 大报、大网站都会进行报道，读者看到的任何一份报纸或网站的内容区别不大，你可以在新浪看，也可以在腾讯看，还可以在上海热线
    上看，没有多大区别。


    但社区报的内容则不同，他们不报道大事件，只以“本地化”为核心内容，他们的内容可能是谁家走失了一条小狗、热心人帮助居民掏开下水道、有一家新的特色餐厅将要开业。这些内


    容在其它报纸和网站都不存在，它是的确确的独家原创内容，而且最贴近每个人的生活、原汁原味，充满乐趣。


    ## 独具竞争力的社区报


    社区报的内容主要以报道当地新闻和服务该区的居民为主，在内容上，恰恰与社区居民的共同利益息息相关的，也是本地居民最关心的內容，它有一种强烈的归属感，让你认同自己是社区报一员，融入这种氛围之中。本地利益、本地风俗、本地历史、本地栄誉、本地人物、本地生活、本地活动，强有力的融入感和参与感，黏附了大量最忠实的读者群体。


    社区报关注了小人物的故事。社区报立足报道社区内的新闻，例如苦涩、通知、祝福、比赛等。报道中常常提及社区内居民的姓名，赋予居民个人荣誉感，使居民间产生强烈的社区责任感；在报道方式上，强调用篇幅不定的故事性报道方法吸引读者。此外，社区报还报道居民关心的社区问题，促使社区居民对所关心的社区问题进行对话，交流、磋商，从而达成共识，解抚矛盾。因此它扮演的角色如同提供社区居民对话的平台。


    ## 盈利水平甚佳


    全方位社区服务意识，增加本地居民依赖感。社区报是为特定的目标受众服务的，除了展示本地人所感兴趣的话题与故事、报道当地的新近议题以外，丰富的与生活有关的公告启事、商品优劣信息、促销券、娱乐信息、出租与招租信息、招聘与找工信息、二手商品交易信息、宠物信息、征婚征友信息等，其中生日祝福、节日祝福甚至可能成为最大的广告收入来源，美国报业协会统计表明，有
    42%的居民已阅读一份固定的社区报超过 30 年。


    每 1 亿美元广告中，美国报纸约占 4400 万美元，而在报纸广告中，社区性报纸约占 30%。社会报拥有极为稳定的读者群，它们专注于社区，根本不须要与大报竞争，它们拥有自己的独家内容和发行渠道，大多数社区报是免费发放的，除了上门发放以外，还在超市、健身中心、医疗中心、餐馆、游客服务中心、美发厅等人流密集的地方发放，保证了读者群体的数量与稳定性。由于印刷成本低廉，精确的广告投放方式使他们不仅收支平衡，而且盈利，据估计，许多社区报纸的利润率都在
    20%以上，由于利润可观，社区报纸吸引了不少投资者的眼球。


    ## 社区报：我们来源于真实生活


    ## 与大报迥然不同的报道视角


    社区报引导读者从新的角度和方式了解国际和政治类新闻。作为服务社区的报纸，它的属性决定了社区报在报道中往往弱化对政治类国际类新闻的报道。但这并不意味着不报道。报道中，社区报往往会引入本地各个阶层大蚓人群的声音、观点，在这类新闻的选择上。它们也会考虑新闻本身在全国范围内的出现频率、差异性、重要程度和社会意义，而本地化的声音与观点，更加贴近民意，使报道内容发生变化，与大报的声音完全不同。


    对社区报的编辑记者来说，必须要有不同于一般记者的能力，他们需要特别善于在方寸之地和日常生活中寻找新闻，特别善于发现和挖掘平常人、平常事，才是社区报真正的报道对象。

