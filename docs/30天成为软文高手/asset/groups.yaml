    # 十九、专栏写作


    专栏写作和常规的写作或新闻不同，1、它必须要有一个强有力的观点做开头；2、它需要表现一种强烈的热情或愤怒，3、它需要传递一种情感，4、专栏作家必须在某一个领域或多个领域保持领先。专栏作家要努力发出自己的声音并发挥自己的潜能，努力使文章充满激情和活力，专栏作家最大的忌讳是行文枯燥、内容没有重点、语言<|start|>瑕。当一位专栏作家的时间是多久？一生。专栏作家更像是演员或老师，他们要做的事情是引起人们的注意。


