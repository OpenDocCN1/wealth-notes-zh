    # 事件软文的特点


    事件软文是策划的结果，并不需要你写，而是要让大家写，大家评，由此形成强劲的影响力。


    事件软文是怎么“出笼”的


    有一年北京图书展，有几个来自贫困山区的孩子，在展会上出售家乡的土特产，5元一份，希望人们借此筹款帮助贫困山区的学校购买一些图书。许多人纷纷慷慨解囊，予以支持。


    部分媒体的记者嗅到这一蒋，也纷纷予以报道，但是几乎所有的媒体，都从“献爱心”的角度进行报道。某记者展开了思考，是谁让他们在这里摆摊的？是谁从贫困山区把他们送到北京的？这些孩子的举动是真的还是假的？如果是假的，幕后又是谁在操纵？……


    当这位记者思考到了这一连串的问题以后，就以“某某事件”为题，进行一系列的追踪报道，以图捅开真象。新闻发出以后，引起了强大的社会反响。


    # 事件软文写作指南


    +   1、注重策划和持续报道，重点在于引发媒体和社会公众的广泛关注。\n2、并不需要你写多少文章，要广泛地调动许多人去写、去评论。\n3、转载传播率极高、影响力极大。\n4、事件可以是反面的，也可以是正面的，比如IDC的“断网事件”等等，可大可小。\n5、文章是系列的，是持续的，也可以在网站上制作专题，加大事件的影响力度。\n6、成名是迅速的。'
