    # 软文高手手册


    # 一、软文写作带给我们什么？


    统观全局能力、思考能力、分析能力、宣传能力、策划能力、说服能力、销售能力、专业能力、职业能力。


    # 二、二战世界缔帅的共同职业特征


    |  | 结 果 | 姓 名 | 职 位 | 经 历 |

    |---|---|---|---|---|

    | 1 | 战胜国 | 毛泽东 | 中共主席 | 曾创办《湘江评论》，曾任国民党中央宣传部长 |

    | 2 | 战胜国 | 邱吉尔 | 英国首相 | 进入军界的同时，担任报纸通讯员 |

    | 3 | 战胜国 | 罗斯福 | 美国总统 | 曾任哈佛校刊《绯红报》助理、主编 |

    | 4 | 战胜国 | 斯大林 | 苏共主席 | 曾创办《真理报》 |

    | 5 | 战胜国 | 戴高乐 | 法国元首 | 作家 |


    # 三、软文作者应具备的基本素质


    +   1、坚持不懈，练笔不懈。

    2、进攻心、创造力

    3、志在写作，爱好写作

    4、公正、严谨

    5、知识丰富

    6、富有同情心、爱心、热悄

    7、具备四多：多想、多看、多写、多观察。


    # 四、什么是软文


    国际新闻学惯例，凡是未涉及重大政治、军事、社会事件的新闻，一律称之为软新闻，即软文。因此，软文通常是以新闻通讯写法撰写的文章。软文是从重大新闻报道中脱颖而出的信息内容，人们根据这种信息来对自己的生活方式、工作方式和采购等行动做出指导和选择。'
  - '[PAGE 136]


    # 五、硬新闻与软新闻


    硬新闻：主要为重要的时事新闻，是人们在报纸头版或网站头条看到、在广播电视新闻节目一开始听到的，战争、政治、商务、犯罪等经常是硬新闻的内容。它具有时效性，争议性，影响广泛，通常硬新闻单刀直入，为的是让读者尽可能快地掌握重要信息。


    软新闻：通常是以专题新闻方式，许多报纸和在线新闻网站另外开辟专题栏目，登载生活时尚、居家生活、艺术娱乐等消息。大报甚至分专题开辟每周栏目，如食品、健康、教育等。新闻则往往从一则轶闻或实例引出故事，为的是引起读者兴趣，或者引导读者的生活方式和消费。


    # 五、软文写作两大原则


    +   1、始终提供对人们有益有帮助的正确内容信息。\n2、比照新闻从业道德，遵守公正自律。


    # 六、软文五大立场


    +   1、准确：确保传递出去的信息真实、可靠、具有价值。\n2、精确：精确锁定目标读者群体，陈述简洁、解释清楚、数字说话。\n3、推荐：的确值得认真地将信息推荐给社会公众。\n4、说服：强有力的说服力、证实性，解决疑难、消除疑惑。\n5、朴实：淳朴诚实、质朴笃实、朴素真实、踏实可靠。


    # 五、软文写作的要点


    +   1、准确的时间、地点、人物、事实、原话、功能、应用，反复核实。\n2、恰当溯源，要确定信息的来源的真实可靠。\n3、完整。一篇文章应回答读者或观众的一个准确问题，包括了阙述、证明、记录、例证等正确使用。\n4、保持中立。必须始终站在读者的立场和角度，用读者的兴趣、观察立场和思考方式来说清楚问题。\n5、客观。除专栏文章、专家观点等要善于使用情感和个人观点以外，软文撰写者尽管不加入自己的看法或观点。\n6、主题简洁、明确、条理清晰、有理有据，重点突出。软文也要直奔主题，说法明确，不要试图强行绕弯。\n7、删除一切废话废字，保持文章紧凑有力、干练简洁，没有陈词滥调和多余废话。\n8、除非综述，一篇文章只说明一个问题，多个观点多篇分述，软文的王道是以量取胜。'
  - '[PAGE 137]


    # 六、软文写作五环节


    标题、导语、主体、提议、重复


    1、灵活鲜明的标题。2、引人入胜的导语。3、深化题旨的文体。4、准确的提议。5、多次重复表达所要提醒的品牌或人名。


    # 七、软文写作八步骤


    +   1、写作策划，是单篇还是一组系列，是述载还是项目分解。2、进行现场采写、摘要典型内容、查询资料，做出笔记。3、从采写笔记中查找写作点，进行构思。4、写出一个赋有意义的标题。5、以标题为中心进行灵感迸发，或直接整理日常笔记中的内容，或根据内容<|message|>点度和写作方向组织相关材料。6、开始写作，注意在内容各部分之间的自然过渡。7、写作完成后，删除“多数、可能、好像”等非确定性词语和废话、废字，提供行文语气。8、修改标题、修改正文、检查错字、缮稿。


    # 八、软文写作的秘诀


    软文写作不是硬着头皮凭空想象着去写，它是典型的“米料加工”方式，加工自己的日常笔记(平时采写到的要点、记录日常所发现的问题、查阅的各种资料摘要)或加工大脑中平常储存的丰富知识碎片。


    # 九、记笔记


    要养成记笔记的好习惯，软文的批量制作，主要来自于平时所记录的笔记。每当你想要大量写作时，需要列出一组又一组的工作问题清单，然后把所有的笔记串起来，你可能需要随时备笔和笔记本，把各种各样的本子、笔放在口袋里、办公室里、汽车里和家中的各个房间里。灵感随时可能出现，或者在坐地铁时，或者在准备睡觉时，日常的热衷记笔记，是你写作前的准备。


    # 十、整体素材'
  - '[PAGE 138]


    当你为写作作计划时，你可以广泛地思考，以便决定获取哪些材料。你当然希望自己的观点敏锐，文章紧凑，角度新颖。但你在搜集素材过程中，可能会发现一个更新、更有意思的话题。比如，你本来打算写《男人为什么与地位相当的女人结婚》，但后来，你却决定写《婚后的男人为什么地位高于(或低于)女人》。不管你打算写什么，确定主题后，你必须割舍那些离题甚远的细节。


    尽管你对已有的素材深思熟虑，但你最好的洞见可能会在无意中出现，所以，一定要年龄头上放本子和铅笔。当一个引人注意的观点使你在床上坐起来时，你可以把它记在纸上，这样你就不会损失新得到的句子、观点或题目。


    写作前整理你的观点，会给你省出更多的时间用来写作，所以即使有一天你没有动笔写时也不会内疚。当你倾听、观察、谈话、阅读、记笔记澄清你最初的观点时，你仍在写作。


    # 十一、了解编辑的规范


    不同的媒体，都有各自的编辑规范。例如网站编辑会规定每行标题多少字，会规定每段之间空一行，规定文章中的小标题一定要单独一行，重要文章小标题要加粗等。一定要清楚这些规范，特别是网络界编辑常規的编辑特征。


    # 十二、软文原本是公关公司的专利


    大公司的大品牌一般动用公关公司为其批量制作和批量传播软文。


    例如海尔集团的公关公司，在国际级媒体的选择上充分考虑到海尔世界级名牌大号，在选择国际级媒体时选择了新加坡联合早报、加拿大信息港、意大利米兰中文网、哥伦布猎头、亚商世界在线等十几家国际媒体。在选择中央级媒体和高端类媒体时通过光明日报、国际商报、科技日报、经济日报世界报等媒体进行了重点宣传，达到了宣传中国民族品牌影响世界的几何级效果。在为海尔成套家电宣传的时，以Google搜索为例输入关键字“成套家电”搜到约有526,000项符合成套家电的查询结果。


    # 十三、注意直接观察


    直接观察是获取准确信息的最好方式(举例说明，突发事件，车祸类：现场描述，采访目击者,还原过程，后续报道，死伤者情况，处理结果)。


    # 十四、新闻价值'
  - '[PAGE 139]


    1，冲突(紧张、惊异)。2，发展(胜利、成功)。3，灾害(挫败、毁灭)。4，重要(对于一定的群体5，显著(突出)。6，新奇(异常甚至怪异)。7，人情味(情感背景)。8.及时(新鲜、省新意的)9.接近(地区性吸引力)。


    # 十五、在新闻中不要擅自议论


    应该客观地撰写新闻。报道中不要提出判断或定论。诸如此类的字眼“&ouml;、我们、我的、我们的”最好不用，除非是作者正在直接引用别人的话。在新闻中对人、地方和事情的好恶褒贬必须出自事实而非作者的观点。


    不合适：他做这工作很称职。合 适：他毕业于密执安大学，有十年工作经验。

    不合适：一项有趣的节目已经准备好了。合 适：节目如下。(让“有趣的”东西自己说话

    不合适：：证人撒了谎。合 适：原告<|start|>师说证人撒了谎。

    不合适：他跳楼自杀了。合 适：他坠楼身亡，验尸官认定是自杀。

    不合适：市莱克先生和夫人的爱子，6岁的小布莱克今天去世。

    合 适：6岁纳杰尼，布莱克今天去世，他是W，布莱克先生和夫人的儿子。

    不合适：法官告诉我(告诉记者)此案不予受理。

    合 适：法官说此案不予受理。


    # 十六、新闻文体的紧凑感


    必须写得清晰、紧凑。这种复杂的报道需要精心构思、组织，以保证各个分离的部分能有机地结合在一起。例如在一场雷电大作的暴风雨中，有下列事发生：


    +   - 一个闪电击中一座五层砖楼。

    - 闪电和狂风的力量使此楼的端倒塌。

    - 塌下的墙砺在一辆路过的汽车上。

    - 年轻女驾驶员被砺死。

    - 另外二人受伤。


    一定要对事实、结果行分析，挑选最重要、最具价值的报道点。


