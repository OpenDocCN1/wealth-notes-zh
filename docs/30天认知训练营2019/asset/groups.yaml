    ## 02过往：为何总是重蹈覆辙


    30天知识训练营·2019


    2 过往：为何总是重蹈覆辙


    你好，我是王烁。


    这一讲我想跟你讨论的是，历史到底有什么用？


    你先听三句话：


    - 在分析中，一切知识都是历史。

    经抽象后，一切科学都是数学。

    从假设看，一切判断都是统计。


    大统计学家拉奥（C. Radhakrishna Rao）在名著《统计与真理》的扉页上写下这三句话，振聋发聩，气势非凡，但没留下解释。好在你记住多少历史，把数学和统计学好，就行，显然这三门学科
    贯通一切。


    ### 历史存在于整体之中


    跟你讲讲我对这三句话的理解：


    我们所处的是现实世界，但可能世界则有穷多个。正如我将要写的下一个字有若干种选择，但我只能选一种，这个字就造出了现实世界，其余则变成无数个没有被发现的可能世界。世界上发生无穷多件事，每件事有无穷多种可能，其全集就是所有可能世界。


    站在现实世界和可能世界之间回看拉奥的三句话：数学界定了可能世界的空间，只要数学能够想象的，它就是可能的；从无穷多的可能世界收敛到一个现实世界，哪怕我选定一个字这样的小事，是统计学的；最后，所有知识都是关于现实世界的记录，所以是历史。


    思想总在顶部汇通。统计学家拉奥的看法跟历史学家马克·布洛赫（Marc Bloch）的看法一模一样：历史存在于整体之中。


    布洛赫是法国年鉴学派大师、总体史观的开创者之一。他认为，历史当然不是研究现在，但也不是只研究过去，而是研究时间中的人。时间是从过去到现在的整体，只强调现在或过去都没有意义，理解过去才能理解现在，理解现在才能理解过去。一个他说过的话、写过的字、创造的事物、触摸过的一切，都传递了关于他的信息。


    历史应当用一切可用的方法去研究一切，材料不限于历史文献，对象也不限于政治、军事、外交、经济、地理、社会乃至人类学都在射程之内。历史学家要穷尽可能，必须掌握这个行业所有重要工具，哪怕只是理解这些工具能用来做什么，操作困难在何处，限制又在哪里。


    他把这些写进了名著《历史学家的技艺》（The Historian’s Craft），年鉴学派总体史观的宣言书。


    ### 历史有什么用


    历史有什么用？年幼的儿子曾经问过布洛赫。


    布洛赫的学术生涯是在20世纪上半叶。1939年，二战爆发，53岁的布洛赫应征参军，然后法国一战即溃，一同崩溃的还有秩序、安全、地位、财产，曾经坚固的全部烟消云散，只剩下两件身份：法国人和历史学家。布洛赫是犹太人，但他没有选择逃亡。他说自己不能想象离开法国，那么就连呼吸都不会自由。


    作为法国人，他选择留下来；作为历史学家，他还得做点什么。


    历史有什么用？同一个问题由成年人又问了布洛赫一次。德军开进巴黎当天，法军总参谋部的军官们面面相觑。有人问布洛赫，“历史背叛了我们，对吗？”


    当社会陷于危机，自我怀疑，就会问这个问题：我们到底从过去学到什么？我们学得到底对不对？


    1941年春天，布洛赫终于有信心给出回答。《历史学家的技艺》是他回答的第一半。布洛赫题记献给同行：


    > “今天我们共同的志业受到了威胁。错不在我们。我们被不公正的命运击倒，仅此而已。相信那一天总会到来，我们的成果将获得自由，公诸天下。”


    国破家亡，人心流亡，布洛赫用写作来找解药，讲历史学的方法：历史必须是个整体，所以没有万能的方法，只能是持续的挖掘、比对，保持常识并保持对常识的警醒。


    这本书平静如常，虽是由战乱催生，但是也是长年思考的结晶。它是历史学家的证词，一位巨匠诚实讲述这行当的精要。如果不知背景读这本书，还以为他身处平静书斋，其实他在放不下书桌的地方写书。


    历史是整体的，过去与现实有活生生的关联，布洛赫的历史学不是说说而已，它有关选择与行动。


    本书写作开始于1941年，布洛赫55岁，东奔西躲，朝不保夕。拿起笔，他是历史学家，为后辈留下技艺；放下笔，他就拿起枪，变成抵抗组织里的地下组织成员。在所有可能世界之间，通过行动，布洛赫进入他选择的现实世界，把自己变成了历史的一部分。


    布洛赫说，人们都想要理解，通过理解成为历史行程的一员，光是知道远远不够。一门学问必须提供解释，否则就是大杂烩。历史不是陈列柜，它的作为超出学术本身。首先使我们更好地理解，然后指导我们的行动。仅仅满足于描述历史是什么样的，永远是对它的背叛。历史学家必须有强烈的个人意见，这是他们的责任。


    五十之年，惟一死，经此世变，布洛赫选择战斗。行动是他的另一半回答。


    在布洛赫总体史观里，历史与现实融为一体。只有体验现实脉动，才能真切理解历史。你理解历史悲喜剧的现在时，才能洞察它的过去时。如果不体察身边的人、事、时势，那就没有任何可能当好历史学家。


    1944年春天，布洛赫被捕。6月16日，盟军已经在诺曼底登陆，他却没有等到胜利，在里昂郊外被纳粹枪决，同时遇难的还有26位同袍。《历史学家的技艺》没有完成，他原本准备题献给妻子，但妻子已经遇难。


    知行合一，布洛赫将总体史观付诸实践：生活是一个总体，是现实与理想扯不断理还乱的纠缠。他没有背叛历史，表达了自己的意见，作出了自己的回答。


    ### 我们为什么一再重蹈覆辙


    布洛赫是答完了，但他把问题留给了我们：


    历史有什么用？如果我们一再重蹈覆辙？


    诚如布洛赫所言，历史关心的是时间中的人，从过去到现在，不过你我不是历史学家，我们更关心未来。我们希望从历史中获得关于未来的线索。这里有个悖论：


    我们之所以希望从历史中学习，是因为我们一再重复过去；但重复过去本来是不应该发生的，越重复则可预测性就越高，我们就越能避免。既然如此，为什么还是重复？


    我能想到三个回答。


    第一，历史之所以重复，是因为路径依赖，锁定在轨道上，大家不是不知道会发生灾难，但还是眼睁睁看着火车出轨，所有人都有无力感。物不极不会反，物极必反，不到最后关头没有可能回头。


    第二，绝大多数人从历史中学习，只是从最近一个可比的、相似的重大事件中学习。比如说，2008年金融危机确实是被反复研究透了，我很清楚地说道，下次全球金融危机到来时，绝不
    完全 会是2008年同一种病毒。我们总是能避免最近一次灾难马上重演，它只会在我们对它的记忆不再真切的将来重演。


    第三，历史只是无穷多种可能中的一种在现实中展开，掌握合理的反事实思考（counterfactual thinking）能力，才有可能揭开其层次面相。历史中藏着无数可发生却却没有发生的危机，只因有人预作绸缪，将灾难种子扼杀在萌芽之前，所以谓善战者无赫赫之功，历史对这种人
    Nothing, 将他埋没在故纸堆中。这是他的小悲剧，却是我们的 大悲剧。


    ## —— 本讲小结 ——


    总结一下，历史有什么用？总体史学给了我们示范。


    - 第一，理解过去才能理解现在，理解现在才能理解过去；

    第二，对历史必须有强烈的个人意见，否则等于是对历史的背叛；

    第三，理解之后必然是行动。


    今天的内容灵感来源于，年鉴学派大师布洛赫的书《历史学家的技艺》（The Historian’s Craft by Marc Bloch），推荐给你。正如读《史记》你要知道司马迁本人的故事，读《历史学家的技艺》，你要知道布洛赫本人的故事。


    ## —— 思考题 ——


    最后，我给你留一个思考题：


    我今天讲到善战者无赫赫之功，你能不能举出这样的例子？


    欢迎你在文章下方的留言区写出你的想法。


    聊完历史的用处，下Communication，我会跟你探讨，


    聊完历史的用处，下一讲，我会跟你探讨，我们每天都要用的钱，到底有什么用？什么样的钱，各有什么用处？又有多少种钱？我们下一讲见。


    ### 划重点


    - 1. 历史存在于一个整体当中，理解过去才能理解现在，理解现在才能理解过去。

    2. 历史总会重演，往往在我们记不清教训的时候重演。

    3. 我们看到的历史，只是无穷多种可能中的一种，你需要掌握合理的反事实思考能力。


    ## 03财富：钱有什么用


    30天认知训练营·2019


    03 财富：钱有什么用


    你好，我是王烁。


    每个人都是关于钱的专家，这一讲我却要冒天下之大不韪，跟你讲讲钱的用途。


    钱是最坏的主人，最好的仆人。如果你把钱当作惟一的KPI，不顾一切拼命刷，结果就是它当家作主，你变成它的奴仆。反过来，如果你把钱当作工具，那就是最好用的工具。要把这工具细细讲过来，一部教科书都不够，但听我说讲10分钟也能懂个八成，我希望是正好够用的那八成。


    ### 钱和信用


    狭义的钱，就是社会接受用来作最后结算的那个东西。买了货，接受了服务，最后付钱，过于两清，这事才真正结束；如果给的是支票、信用卡，那这事还没结束，支票和信用卡只是你会付钱的保证，最后对方要拿到钱才算数。


    支票、信用卡、信贷、债券、金融证券化产品等等等等，都是钱的衍生品，它是人们交易时愿意暂时接受的支付方式，但不是最终结算。链条可以很短，现金全额买房，房款两清，结束。链条也可以很长，用贷款买房，你是用未来20年还贷款的长期承诺买房，链条变长。


    ### 五种钱各有什么用


    讲清楚钱的概念，我现在讲从狭义到广义，各种钱各有什么用处。


    第一，比特币和黄金。


    第二，外汇。


    第三，现金。


    第四，股票和债券。


    第五，最后我讲房子。


    ## —— 本讲小结 ——


    ## ——♦ 本讲小结 ♦——


    总结一下，这一讲我给你讲了五种最基本的资产各自对应着什么层次的风险管理。理解这五种资产的用处，运用这些工具，做到跟你想管理的风险不错配，你就已经赢了绝大多数人。


    今天的内容灵感来源于一门课《全球金融危机（The Global Financial Crisis）》，这门课是耶鲁大学管理学院明星课程，由安德鲁·麦催客（Andrew
    Metrick）教授讲授，邀请了金融危机主要处置者之一、时任美国财长盖特纳（Timothy Geithner）主讲。我在耶鲁“世界学者”项目期间完整上过，收益很大，现在他们把这门课放上了Coursera，我把链接放在下方，推荐你也去学习。


    课程网站：The Global Financial Crisis


    链接：http://t.cn/RGNQMiL


    ## ——♦ 思考题 ♦——


    最后，我给你留一个思考题：我认为比特币不会死，你觉得呢？


    欢迎你在文稿下方的留言区写出你的想法。


    下一讲，我会跟你探讨一个古老的命题，人性原本到底是善还是恶？我们下一讲见。


    划重点


    - 1. 黄金和比特币是法币的潜在竞争者；

    2. 现代人需要配置一部分外汇；

    3. 现金是常态下的终极支付手段；

    4. 债券不比股票风险低；

    5. 房子能对抗通胀，但十次金融危机有九次是房地产惹的祸。


    ## 04 人性：人从什么时候变坏


    30天认知训练营·2019


    04 人性：人从什么时候变坏


    你好，我是王朔。


    今天我们探讨的问题是，人性本善还是恶？


    ### 性善论与性恶论


    认为性本善的人认为，以前有个黄金时代，距今大约一万年，男子狩猎，女子采集，群体分工、协作、分享，人人营养平衡，身心健康。那个时代没有战争，没有等级，没有财产当然也就没有贫富差别，也没有传染病。


    对那个时代的想象，奠定了一种极有影响力的思维：性本善。最初都是好人，只是后来变坏了。


    怎么变坏的呢？


    发明了农业。农业意味着定居，意味着阶层，意味着收获，意味着余粮，意味着分配，意味着得武装起来防止别人来抢夺余粮。无尽冲突从此开启：阶级分化了，财产产生了，战争来到了。连营养都变差了，绝大多数人忙于在田间劳作，却只能果腹而已。人类从此失去了乐园。


    ### 人性的四个象限


    | 性善论 理想主义 | 性善论 现实主义 |

    |---|---|

    | 性恶论 理想主义 | 性恶论 现实主义 |


    ### 人性的善是后天习得的


    ### 原始社会的田园调查


