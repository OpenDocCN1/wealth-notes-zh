    # 01趋势：世界是否在降维


    30天认知训练营·2019


    01趋势：世界是否在降维


    你好，我是王烁。


    这一讲我们讨论的是，世界正在降维。


    刘慈欣在《三体》里面写道：失去人性，失去很多；失去兽性，失去一切。理解这句话，你需要先理解现实主义和理想主义的区别。


    简单来说，理想主义认为基于规则、共识的合作常来安全，而现实主义则认为，只能靠自己。刘慈欣这句话代表了现实主义者对现实的理解，而理想主义者会这样反驳：只有兽性的话，才会失去一切。


    # 现实主义的国际政治


    第一次世界大战结束100周年刚刚过去。一战是西方世界分水岭，二战从内在动力和斗争逻辑看是一战的延续。战事使当时的世界中心变成焦土，一代精英死于战场。国家崩溃，人才凋零，心气沉沦。痛定思痛，精英们反省为什么共同选择了自我毁灭。


    # 进攻性现实主义


    当代现实主义政治学代表人物之一、芝加哥大学政治学教授约翰·米尔斯海默（John Mearsheimer）把这套逻辑极推到极致。


    # 国际政治的三个时代


    米尔斯海默的进攻性现实主义理论对不对？


    我想说它不对。人类社会的发展，就是不同层级群体逐渐接受法律、规则、共识的过程，从个体之间开始，经由家庭、宗族、村落、部落、国家，逐步上升。在越来越大的规模上，我们越超从丛林社会，建立秩序、规则和稳定。


    # 零和博弈让世界降维


    但是，我也不能说米尔斯海默就错了。


    人是观念的动物。人们被自己相信的东西所驱使，世界观里只有零和游戏的人看着什么都是零和游戏，也会行动起来把一切真的变成零和游戏。


    想这么大干什么？这跟你我有什么关系？'
  - '[PAGE 2]


    想这么大干什么？这跟你我有什么关系？


    在这新图景中，国家的外对内的行动空间更大，至于大到有多大，只取决于它的实力。不论你做什么工作，对未来有何计划，此刻都要意识到它变动的方向。而个人选择有限。“如果你是世界公民，那么你哪里的公民也不是”，英国首相特蕾莎·梅这句话已经成为时代预言。


    降维是我们这个时代面临的最大风险。接下来的航程连维度都不明朗，大家珍重。


    # —— 本讲小结 ——


    总结一下，要理解今天的世界正在发生什么变化，你需要先理解现实主义和理想主义。理想主义认为基于规则共识的合作带来安全，现实主义则认为只能靠自己，最极端的进攻性现实主义更认为安全是零和博弈。


    国际政治从最开始的进攻性现实主义阶段，演化到大国之间的防守性现实主义阶段，再演化到二战后基于规则的国际关系。当下的最大危险是可能出现返祖现象，进攻性现实主义重回舞台，使世界面临降维风险。


    这一讲内容受中国学者唐世平的《国际政治的社会演化》的启发。该书的英文版获得了2015年度国际研究协会年度最佳著作奖，唐世平是第一位获此荣誉的中国学者。


    另外，关于米尔斯海默的思想，在我另一个课程《30天认知训练营·2018》里展开讲过，我把链接附在下方，感兴趣你可以去学习一下。


    课程链接：加餐 | 用博弈论读懂中美关系


    > （特别提醒：已购买《30天认知训练营·2018》课程的用户可点击链接直接跳转到文章阅读，未购买课程的用户可以前往该课程，选择上述文章试读。）


    # —— 思考题 ——


    最后我给你留一个思考题：


    你是倾向于理想主义，还是现实主义？为什么？


    欢迎在留言区写下你的想法跟我交流。


    下一讲，我想跟你探讨的问题是，历史有什么用。我们下一讲见。


    # 划重点


    +   国际政治的三个发展阶段：

    第一阶段，进攻性现实主义的国际政治关系；

    第二阶段，大国之间的防守性现实主义的国际政治关系；

    第三阶段，二战后，基于规则的国际关系。

    当下可能出现返祖现象，进攻性现实主义重回舞台，使世界面临降维风险。


