    # 05选择：沉住气还是孤注一掷


    30天认知训练营·2019


    你好，我是王烁。


    今天我讲什么时候应该孤注一掷，什么时候可以耐心沉着。


    我们先来设想这样一个问题，微创创始人张小龙是业余高尔夫球手中的职业水平，拿了顶级职业-业余配对赛的最高荣誉。假如你有机会跟张小龙打球，假如你居然还赢，用什么办法成功机会会最大？


    别打满全场，就打一个洞，猜不好你一杆进洞了呢。要是选择打满全场，就算你运从天降，有一次一杆进洞，全场下来你还是会输——水平差距太大。


    如果你进拉斯维加斯赌场，本来是当作花钱买娱乐，下注买个乐呵。赌场对赌客的概率优势，明白白地写在执照里，你下场的预期收益是负的。


    但如果你走投无路，非得靠赌来解决问题改变命运，那么至少你不要分次下注，那只会稳定地逐渐输光。你应该全部押上，一次下注，接受命运的裁决，多半还是一次就输光，但好歹不是必然输光，总算有点点机会。


    赌场喜欢豪客，那是相对而言。假如盖茨去赌场，就要只赌一把，输家赔光，赢家全拿，这样的豪客赌场不敢接。


    体育比赛，一方领先了往往打成功率，增加控球，减少进攻次数，以期提升每次进攻得分的概率。如果是面对实力更强的对手，这选择挺合理；但如果自己的实力强过对手，这选择就欠考虑。


    强队一方领先，应该保持进攻频率，双攻守的次数越多，才对自己有利的实力对比才越发挥出来。你进攻次数多，虽然对方也多，但回来越多概率对你越有利。如果你想稳，减少进攻次数，虽然也减少了对方的进攻次数，但对方跟你孤注一掷，经常就是这样翻盘。


    概率越是稳定地站在你这一边，越要孤注一掷赌运气。相反，如果你是张小龙，如果你是拉斯维加斯赌场，如果你是西班牙足球队，那么就没有什么是好急的，沉住气，慢慢来，靠概率和水平就行的事，别赌运气。


    # 第一层：从实力出发的选择


    有人着眼长期，有人选择短期行为，各人各不同，可不可光是因为素质、教养、格调差别，有着强大的理论依据：


    对那些有资源、水平、优势的人来说，他们当然该着眼长期，因为着眼长期对他们有利；对那些没有资源、水平、优势的人来说，长期必败，不如短线一搏更好。这是第一层。


    延伸开来说，中国股市短期炒作的多，长期投资的少，虽然有多重原因，解决办法也没有可以一招制敌的，但至少不用做一件缘木求鱼的事，就是教育投资者。投资者不需要教育，他们比教授教育他们的人更知道真相，至少不装傻。他们本能地知道，在信息不对称监管不给力的市场上，长赌必输。


    当然，他们作为一个整体，短炒一样必输，毕竟大数定律放在那里。但至少对他们中的每个人来说，短炒赌运气机会还大一点。吴敬琏先生多年前说过中国股市像赌场，其实吴先生还是容气了，合法赌场占你多大便宜至少还是明牌。


    有人不明白中国股市为什么总是熊市长牛市短，把20多年走势图拉开来看，总是不脉冲式暴涨之后漫漫阴跌，一而再，再而三。其实没什么不好理解的：好不容易赌对一次，你不拿钱走人吗？


    # 第二层：受制于环境的选择


    这里正好讲到第二层：如果选择短期行为的人太多，那么那些有资源、水平、优势的人也无法继续保持沉着、着眼长期。


    市场上完蛋的可不只是散户，金融危机来临时华尔街上所有机构都危如累卵。他们有信息、技术、专业、关系的优势，为什么不沉住气慢慢玩？何必要跟大家一样并发行衍生品直到撑得要爆炸？


    因为做这生意一直赚大钱，不做这生意，你的下一季度报表就没有竞争对手的好看。做这生意，长期中公司也许会完蛋，但不做这生意，马上你自己就完蛋。“我们都知道舞会迟早结束，但只要音乐不听，我们就得跳。”当时华尔街最大机构的负责人老老实实地说。


    这不仅是大人物的事。我们来谈谈你吧。


    假如你很有能力，身处什么样的组织对你有利？


    所谓路遥知马力，你要选那些足够路遥的组织，假以时日，职业生涯自然步步高升，因为能耐站在你这边。


    假如你所在组织的金字塔结构比较陡峭，升迁的职位比较少，而组织决定升迁的标准是近期业绩，那么，哪些同事事能力不如你，只要他们都采用孤注一掷的策略，各自全力投入去干一件大事，赢了就上位，输了就丢饭碗。他们冒的风险很大，对他们不一定好，但你的能力优势就被他们的拼搏给抵消掉了。固然他们当中绝大多数都会失败，但只要有一个人成功，主管位置就是他的了。


    你怎么办？你也只能去冒险，哪里本来你只凭才华就够可以。选择冒险，那就得看运气，而运气会拉平你和同事们的能差差距。


    所以，那些公认且自认能力强的人，往往去了稳定的大公司，而创业者一般原本处在主流边缘；班上成绩最好的同学，往往过了相对平淡的一生。这些不是命运无常，而是每个人的理性选择，你也可以不这样选，但社会替大家作适应性选择，使这些成了人生常态。


    # 第三层：未来不确定下的选择


    现在讲第三层。


    这个世界看起来正处在一个大变化的早期。全球化退潮，共识耗散，分化极化，经济承压，社会撕裂，处处如此。我们已经熟悉的状态形成于两重合力：1978年以来内部改革带来长期增长，1991年冷战结束以来的大缓和带来全球化的突进。今天两重合力都在改变，焦虑四处蔓延。关于未来唯一可靠的预测就是它变得难以预测。


    我要讲的第三层就是，此时此刻，不必太过悲观。


    如果未来变得更动荡，你反而更有条件沉着一点，好比赌场把老虎机全部撤下，换成了21点牌桌，概率从稳定对你不利的状态切换到了不稳定状态，大多数时候还是对你不利，但不时出现机会降临。此时，凭借技巧、算力，一点运气，再加上等待机会出现的耐心，你就有机会战胜赌场。


    # —— 本讲小结 ——


    总结一下，这一讲我们讲了三层。


    +   第一层：当概率越稳定地不站在你这一边时，你越要孤注一掷。


    +   第二层：当大家都孤注一掷时，你也只好孤注一掷，你的才就被运气拉平了；而如果你不愿意孤注一掷，那么诀起站起来走出去，找到一个不需要孤注一掷的环境。


    +   第三层：当概率变得不稳定时，你反而不必着急出牌，因为真有机会了。当时势转移，未来难测，你不妨更沉着。


    这一讲的灵感来源于詹姆斯·G·马奇（James March）的书《决策是如何产生的》（Primer on Decision Making）。


    # —— 思考题 ——


    我给你留一个思考题：


    今天讲的比较好理解，但实际上大多数人实际做法正好相反，往往是概率对自己有利的时候孤注一掷，比如说，觉得一门生意十拿九稳，于是押上全部身家。根据今天讲的内容，这样做法错在那里？


    欢迎你在文稿下方的留言区写出你的想法。


    下—讲，我们会开启第二个模块，一起探讨我们可以用哪些新角度去看见社会。下一讲见。


    我们如何做选择？

    第一层：当你实力不占优势时，孤注一掷；

    第二层：当大家都孤注一掷时，你也只好孤注一掷；

    第三层：当未来不确定，你不妨更耐心。'
