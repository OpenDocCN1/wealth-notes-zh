    # 24 分阶思维：螳螂捕蝉，黄雀在后


    24 分阶思维：螳螂捕蝉，黄雀在后


    你好，我是王烁。


    这一讲，我们谈分阶思维，思维可以分成好几个层次。讲这个道理能举的最好例子就是捡钱。


    ## 不同思维阶次驱动不同行为


    看到地上有100块钱，你伸手去捡。这是一阶思维（first order thinking），发现机会就行动。大多数人都这样。


    但是，如果你养成了二阶思维（second order thinking），就会多想一层：慢着，如果地上真是100块钱，早该被人捡走了，所以，它不会是钱，所以，我不要浪费时间，视而不见继续走路才是正确的。


    经典经济学就是典型的二阶思维。这既是它最强大的地方，也是它被最招人批评之处。它假设别人不会遇到有钱不捡，所以踏地替自己省下了捡钱的功夫。它认为市场总是有效的，因为价格已经反映了所有能影响价格的信息。世上没有免费的午餐，地上没有白捡的钱。


    二阶思维很高明，但有时高明得有点犯傻。如果地上真躺着100块钱，放着钱不捡就是犯傻。二阶思维犯傻是因为它过度依赖一个前提：别人都是一阶思维。


    ## 如何用分阶思维做判断


    假设说你要判断股市是否触底，首先，你必须有能力同时在这几阶思维上展开思考：


    一阶思维：了解影响股市走势的各种实质信息，包括大国关系好坏、宏观经济走势、行业变化、企业管理、企业家能力。所有这些都实质性地影响股价。


    二阶思维：一阶思维涉及的信息是否已经被市场充分消化？


    三阶思维：二阶思维所涉及的信息反过来是否已经...


    ## 运用分阶思维的三点提示


    懂得思维分阶的道理，我有几点提示：


    第一，思维阶次理论上可以无限上升，实际...


    人都高明到了有二阶思维，所以都不捡，没人捡的话这20美元就有可能使真的。于是，席勒停下脚步弯下腰，就在手要碰到钞票那一瞬间，钞票飞走了——原来是有人恶作剧，在钞票上绑了线。


    就算我们机关算尽，终究还有造化弄人。


    ## ——◇ 本讲小结 ◇——


    总结一下，这一讲我们讲了分阶思维。


    每个人对一件事情的判断和思考都是分阶段的，关键在于你要搞清楚一起博弈的其他玩家都处在哪一阶段，你只需要比他们高一阶段就好了。


    但是呢，在真的搞清楚别人在哪个阶段之前，不要轻易认为别人愚蠢。你以为别人比你低一阶，搞不好是反过来你比别人低一阶。


    这一讲的灵感来自于《领导人怎么思考》（How Statesmen Think），作者是国际关系中的大学者杰维斯（Robert Jervis）。这本书是讲国际政治的，也就是讲各国领导人是怎么猜度对方的。其实也适用于我们在市场上生活中的互相猜度。


    ## ——◇ 思考题 ◇——


    给你留一道思考题：


    在哪些场景中必须考虑对手的思维阶次，哪些场景中不需要考虑这个问题？


    欢迎在留言区留言，跟我讨论。


    下一讲我们讲行动派的思维方式，下一讲见。


    ## ■ 划重点


    + 1. 思维阶次理论上可以无限上升，但揣摩人揣摩到三阶足够了。 2. 高阶和低阶思维可能驱动同样的行为，不要从行为去判断对方聪明还是愚蠢。 3. 用一阶思维寻找机会，用二阶思维验证是否已被同行消化，同时保有三阶思维的能力。


    # 25行动思维：如何聚焦


    25 行动思维：如何聚焦


    你好，我是王烁。


    这一讲给你介绍一个行动派指南。


    我这样的人，观察很多，思考不少，可是行动还不够。这一讲要介绍的打法，像激光一样聚焦于行动，根据行动来组织思考，寻找信息，对我很有触动，介绍给你。


    这个打法出自索普（Ed Thorp）。他有这个资格：他出身学派，靠着牌战胜了拉斯维加斯赌场，然后转战另一个赌场华尔街，自己摸索出了衍生品定价方法，跟后来拿诺贝尔经济学奖的“布莱克-斯科尔斯”期权定价公式一样。不同的是他没有去发论文，虽然错过了诺奖，但是用它创建了当代第一个量化对冲基金，多年间战胜了华尔街，赚了很多钱。从拉斯维加斯和华尔街这两个世界上最大的财富陷阱中全身而退满载而归，他靠的是自己的打法。


    他的打法有五条指南。


    + 第一条，大家都说不可能战胜赌场，可不可能得自己真试过才知道。

    第二条，习惯性地将思考所得用于获利，关键词是“习惯性”。

    第三条，制定可行计划，坚持直到成功。

    第四条，始终保持理性，不是在某个科学领域里保持理性，而是在与世界打交道的所有方面都保持理性。

    第五条，保留意见，直到有足够证据作出决策。


    我一条条讲解。


    ## 行动是第一目标


    索普的第一条总结：大家都说不可能战胜赌场，可不可能得自己真试过才知道。


    这一条的关键不仅在于要真去试，更在于去哪里试。


    ## 理性是行动的前提


    索普的第三条总结：制定可行计划，坚持直到成功。


    才可拜上将军。


    ## ——♦ 本讲小结 ♦——


    总结一下，这一讲我讲了索普的行动派五条指南。


    能够做到这五条的人，他们聪明，没有明显短板，有目的有针对性的研究能力特别强，需要时能做很深的理论研究，但不为研究而研究；


    他们的好奇心不发散，总是聚焦于行动；


    他们平时朵若木鸡，偶尔动如脱兔，别人尚在争论不休，他们已经一骑绝尘。


    祝你成为这样的行动派。


    这一讲的灵感来自于索普的书，《通吃一切市场》（A Man for All Markets），推荐给你。


