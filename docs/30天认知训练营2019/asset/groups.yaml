    ## 15 资源：别清空存量，清空存量思维


    你好，我是王烁。

    这一讲我们来讨论下怎么处置你的存量。

    罗振宇跟我说过一句诗，“我和脱不花这种人，不把存量当回事，随时准备清空”，罗振宇边跟我说这话边跟脱不花确认了眼神。我一是受到震动，如此果决，真是了不起；二是隐隐觉得哪里不对。这样真的好吗？

    原教旨经济学家会觉得这是理所当然的，沉没成本不影响未来决策。过去的一切凝聚成现实，而现实到来的那一刻就已不可改变，惟一重要的是未来。这是教科书式的正确答案。但是，人们在现实中则多半不会如此行动。我们都是自己过往经历塑造的产物，谁也不是只往未来这一个方向看，难道我们都做错了吗？

    这可不是抽象的哲学问题，它小到影响你要不要跳槽，要不要放下一切去追求梦想，大到影响我们今天在过去与未来之间的取舍。这问题在我后脑勺发酵了好久，终于，在打一局围棋的时候，我想明白了。


    ## 人生好比一局围棋


    围棋是最古老的战略游戏。规则极为简单：棋分黑白，纵横十九，气尽则亡，子多为胜，剩下的规则都是打打补丁，却能生发出无穷变化。

    一盘棋，少则百余手，多则三百手以上，每个对弈落子次数大概率在五六十次到一百五六十次之间，而真正需要作出决策的次数大概占到其中1/3，也就是说一盘棋需要作的决策次数是十几次到五十次左右。

    这跟现实同构。围棋可以看作是对现实的抽象：规则很少很简单，但变化极多，未来难测，你可以作计划，但得随时迎接变化。

    一人一生中所作的重大决策，上学、找工作、换工作、谈恋爱、婚姻、生育子女、退休、投资，再平淡的人生中也会有一二十个，你要是不是人生激荡的话，多到五十来个重大决策也正常。这跟巴菲特说投资差不多。他说，全部投资生涯总共作的重大投资决策加起来20个左右，其他的都是小事。

    围棋是关于棋子效率的游戏，子多为胜是其结果。作出几十个决策，布下一百来个棋子，如果这些棋子整体发挥出比对手更高的效率，你就赢了。现实也差不多，没有赶尽杀绝才算赢回这回事，自己觉得活得比别人好就是赢，它同样取决于你作出的那几十个人生重大决定。

    效率可以这样来描述它：

    假设第一步的效率是X1，第二步是X2，第三步是X3，到最后一步X150，你这盘棋的整体效率不是作加法，X1+X2+……X150，而是作乘法，X1*X2*……X150，整体效率是每步棋效率的乘积。

    有三点很重要。

    第一，每个决策都很重要，而且跟先后顺序无关。你的任何一个决策都不能是致命的，如果是，那它发生在开局还是终局都没有影响。

    常说说人犯错误要在年轻的时候，这说法之所以算是成立，是因为年轻人天然地同时下着好几盘棋，比如说要是他炒股失败手上亏光了，但人力资本还在，能补回来。如果年轻人只有一盘棋可下，那么什么时候亏光都是亏光，没有区别。

    推论是环境中存在的机会越多你越可以从容，机会越少你就越谨慎小心，因为搞砸了没有翻盘机会。一个人在北上广能放飞自我，如果逃离北上广回到老家，就得夹起尾巴做人。人没变，环境变了。

    第二，围棋盘上做不到，但在现实中你要尽量做到使每一步都是个组合。

    原因很简单：

    假设你要做两件事，一件事的预期收益是翻倍，另一件事的预期收益是亏一半，而你不知道哪件事会翻倍哪件事会亏一半，这时候你怎么选？

    如果你先做一件再做另一件，串联，那么预期收益是0，先翻倍后腰斩，或者先腰斩再翻倍，总之是哪里来的回哪里去；但如果你同时做这两件事，并联，那么预期收益是25%，一半翻倍另一半亏一半，合起来是百分之百减去百分之五十再除以二。风险变小，收益变大。永远不要同时只做一件事，不要听那些All
    IN的口号。

    第三，落在盘上的棋子也不能动，落子无悔，好比人生也没有重来，但是，棋子虽不能动，你的下一步落子，却可以让已经落下的子的效率发生改变。

    棋子的效率不是固定不变的，始终在变化之中，视对手的应对，视自己接下来的落子而变。从这个角度看围棋，可以把每步棋的使命都看作是尽可能提升已经落下棋子的效率，谁实现得更好谁就赢。

    我们的人生决策也是一样，新决策一定要让过去的所有决策整体绽放出最大效率。

    你无法事先把一盘棋全部都规划好，这是不可能的，你的智慧不允许，你的对手也不允许，但棋是一步步下的，每下一步棋都要努力让已经下的棋发挥更大效率，这个目标是可能实现的。一тические好棋是它得起盘上的棋子，你的一个好决策则是它对得起你过往所作决策的总和。

    过去并没有真的过去，它是可以被未来改变的。存量是不能被清空的，因为存量不是沉没成本，存量也是变量。围棋帮我明白了这道理。


    ## 应该清空存量思维


    那罗振宇、脱不花错了吗？

    倒也没有。

    存量是不能清空的，正如你不可以把棋子从棋盘上拿掉，但也可以让已经放到棋盘上的棋子发挥出更大效率；可以清空的是存量思维，因为我们不能被自己此前所作的决策所限制。不能因为过去有一个构想，就认为它必须延续到将来。不能因为对自己有个定位，就认为这个定位必须捍卫到永远，否则我将不我。

    情况变了，看法就得改。有人指责大经济学家凯恩斯看法改得太快，凯恩斯反应：先生们，难道环境变了，你们不改变看法吗？

    不过，绝大多数人确实不这样做。人类棋手之所以在围棋上输给AI，就是我们太受制于存量思维，困在自己最初的构想之中。我们下前几步棋的战术目的是什么，后几步棋就鱼贯而来，我们或者把它叫作棋理，或者叫作棋风，或者叫作气合，就是斗气。

    最极端的例子是日本围棋黄金时代的超一流棋手大竹英雄，他被称为围棋美学派代表人物，留下了一句名言：如果不下这步棋就输了，那我也不能下！因为那步棋的棋形太难看了。你可能会笑话大竹英雄，但生活中太在意立场姿态世界观的人，跟他有多大区别呢？

    人的这些毛病，AI系统都没有，它审棋盘，不管此前下了多少步，它把当下视作起点，把接下来这盘当作第一步来重新开始计算。正是因为清空了存量思维，它才能够清醒地评估存量，拿出此时此刻最大化重构存量价值的策略。一盘棋下来，它这样做的次数比人类多太多了。


    ## —— 本讲小结 ——


    好，总结一下，这一讲讲到了三种思维方式：

    第一种思维方式基于自我认知（identity driven）：我是怎么样的人？我们是什么样的组织？如果我做了这样那样的事，我还是我吗？我们的组织还是以前那个组织吗？

    第二种思维方式随时准备清空存量，只看自己想去的那个方向，想要达到的那个目标。爱情诚可贵，理想价更高，若为自由故，两者皆可抛。爱情、理想、自由这几个位置自由地嵌入各种关键词，就得到了这种清空存量打法。

    第三种思维方式随时清空存量思维，但珍视存量，因为存量也是变量。这种人不关心定位，所谓自己是什么样的人，身处的是什么样的组织，而是聚焦于如何使自己的存量接下来发挥最大效率。重新审视棋局，随时刷新思路。太阳每次升起都有一个新我，苟日新，日日新。


    个新我，苟日新，日日新。


    这一讲的灵感来自于一本书——《三十六计与围棋》。作者马晓春是我国第一位围棋世界冠军，也是在棋手这群聪明人中被公认为最聪明的那一个。我们这一讲讲了围棋对思考现实的启发，而这本“围棋三十六计”则是棋盘争斗与现实竞争的全面映射，两个方面都是顶级内容。如果你略通围棋及以上，一定要找这本书来看；如果你不通围棋，遗憾，你错过了很多。


    ## —— 思考题 ——


    我给你留一个思考题：


    这三种思维方式，第一种始终基于自我认知，第二种随时准备清空存量去实现目标，第三种强调清空存量思维，但是珍视存量。你理智上认同哪一种思维，实际上又是被哪一种思维驱动？两者为什么常常不一致？


    下一讲，我会跟你聊聊人是怎么理性作死的 下一讲


    + 围棋给人生决策的思考： 1. 人生每个决策都很重要，而且跟先后顺序无关。 2. 你要尽量做到使每一步都是个组合，不要一次只做一件事情。 3. 你的一个好决策则是它对得起你过往所作决策的总和。


    ## 16 选择：逃离作死


    你好，我是王烁。


    这一讲我想劝你，千万别作死；另外我也要提醒你，作死难免。


    “告诉我会死在哪里，我就不去那里。”这是查理·戈登的戏语，不小心包含了真理：不作死就不会死。但是，不作死这件事，又是何其之难。


    ## 作死往往是理性选择


    不作死难，难在作死不是作，要只要是作就好办了，作就是感性失控。感性失控造成的问题，可以用提升理性来解决，难是有解决方案。不幸的是作死本身是理性选择。


    一个蛋糕许多人分，每个人都面临选择，是 一起把蛋糕做大，哪怕自己分到的比例小一点，但最终到手的蛋糕比以前多呢？还是抢着多分蛋糕，哪怕导致蛋糕整体变小呢？在一个增长的大饼里分较小的比例，在一个萎缩的大饼里分较大的比例，选哪个？


    先说答案。大多数人大多数时候嘴上会选前者，实际上会选后者，因为前者是形象塑造，后者才是理性选择：你不动手抢，别人会动手抢；无论别人动不动手抢，你抢都比不抢好。抢对每个人来说都是占优策略，所以每个人都抢。


    ![](img/779997aa970e533f25d2fc2d33072952_32_0.png)


    ## 面对理性作死，如何应对


    种种作死，个个理性。那你该怎么办？


    + 一是绝不要加入作死中的组织。

    二是发现组织陷入加速作死循环必须跳船。一定要记住，作死循环进入加速期以后是停不下来的，你不要螳臂挡车。

    三是要明白组织难免作死，因为人总是很理性地选择作死。所以，你必须培养自己在需要时跳船的能力。要是无力跳船，明知组织进入死循环，还不得不一起作死，真是很惨。


    ## —— 本讲小结 ——


    总结一下，这一讲我告诉你作死，教你面对作死中的组织怎么办。


    ## —— 思考题 ——


    我给你留一个思考题：


    组织是难免作死，但有些组织保持不作死的时间会比较长，这些组织有什么共同特点？


    欢迎你在文稿下方的留言区写出你的想法。


    这是本章的最后一讲，前面三章我们讨论了大势、社会和组织，下一讲开始，我们关心你个人，我先给你讲讲你需要加持什么技能。下一讲见。


    ## 划重点


    + 1. 不要加入正在作死中的组织。 2. 如果你是决策者，在还可控的时候趁早清除“癌细胞”。 3. 如果你是普通人，要有跳船的能力，不要在一棵树上吊死。


    ## 17 提问：问得太少你吃亏


    你好，我是王烁。


    今天这一讲，讲提问。这世界竞争这么激烈，明显可以捡到的便宜已经很少很少，但其实提问就是一个。反过来説，问得太少你就吃亏了。


    好在不让你吃亏，绝大多数人都吃亏，大家都问得太少。问得太少有许多原因：


    + ——有的是太过自我，太想用自己的想法、故事、思路去説服对方；

    ——有的是太想用问题给对方和旁观者留下深刻印象，但这世界上哪里有那么多容易提的高级问题，想太多，于是就问得太少了；

    ——有的是太过小心，害怕自己的问题太过粗鲁或者太过敏感，其实你又想多了，对于被问的人来说，只有极少数问题对他是粗鲁的敏感的，如果提问是在私下，那就更少了；

    ——有的是太过自信，以为自己已经知道答案，不用问了。


    ## 提问的好处


    最关键的原因则是，一般人不知道提问的好处非常大。


    提问有很多好处，学习，交换信息，带来创新，增加了解，促进信任。归根结底是两件事：第一是获得信息，第二是使对方喜欢你。


    今天这一课用不着讲获得信息这一面，好处太明显，有事你不问别人难道问自己吗？我讲提问使对方喜欢你这一面。


    怎么通过提问让别人喜欢你？


    现代第一个成功学大师卡内基在《人性的弱点》（How to Win Friends and Influence People）当中给了个答案：“问别人喜欢回答的问题。”卡内基説对但不完整。任何时候想太多，先提问，别人大概率都会比你提问前多喜欢你一点。


    原因很简单。


    第一，假如其他条件不变，一个人在说话时会比不说话的时候开心一点。


    ## 提问的种类


    提问大体上有四种：


    + 1. 介绍式提问：你好吗？

    2. 镜像式提问：我很好，你呢？

    3. 转向式提问：用来开启话题转换话题时用。你怎么看贸易战？

    4. 跟进式问题：就是追问。


    ## 如何提问


    ## 被提问者，如何应对提问


    最后换位思考，假设你是被问一方，在竞争性/对抗性场合，特别是公开场合，遇到你不能回答的问题怎么办？


    前国防部长麦克纳马拉。他是越南战争时期的美国国防部长，那个时期美国反战声浪特别高，经常问他，他不想回答也不能回答的问题。这个方法的好处就在于，人在场景上的记忆比金鱼还要短，混过去就混过去了。


    第三，如果你有这才华，那就顺着话茬讲个笑话吧。大家笑笑就过去了；如果你不确信自己有这才华，那就选第二。千万不要自以为有讲笑话的才华，制造的却是不管你信不信反正我信了的车祸现场。


    仅次于车祸现场的，就是直接拒绝回答问题，它只会激起对方对问题本身以及对与你对抗的更大兴趣，建议你在大脑里建立一个快捷方式：每当你想直接拒绝回答问题，则跳转到第一和第二反应。第三反应慎用，第一和第二反应够用了。


    ## ——本讲小结——


    总结一下，这一讲我给你讲了怎么提问。


    你可以记得这么一个简单的原则，多问比少问好，追问最好。不要担心显得不聪明，也不要过于担心让对方不舒服。问得越多，不仅你知道得越多，对方还越喜欢你。


    这一讲也欢迎你转发给你的朋友，其实不管他做什么工作，多问总比少问好。


    这一讲介绍了多问比少问好的研究，出自哈佛商业评论上的一篇英文论文《提问有令人意外的力量》（The Surprising Power of Asking Questions，By
    Alison Wood Brooks & Leslie K. John），感兴趣你可以去看原文。


    论文链接：https://hbr.org/2018/05/the-surprising-power-of-questions


    ## ——思考题——


    给你留一个思考题：


    请你想想过去有没有提问把人问毛过，对照今天这一讲，讲讲原因在哪里。


    使用的技能，怎么提意见。我们下一讲见。


    ## ■划重点


    1.提问者：多问比少问好，不要担心显得不聪明，问得越多，不仅你知道得越多，对方还越喜欢你。2.被提问者：如果能回答诚实最好；如果不能回答，那就说你想说的，不管对方问什么；更有能力的就是讲个笑话吧。


    ![](img/779997aa970e533f25d2fc2d33072952_35_0.png)


    留言精选


    点击加载留言


    ## 18 提意见：有话好好说


    你好，我是王烁。


    这一讲，我给你讲讲有话好好说。


    前一段整理材料时翻出一张纸，是两年前参加耶鲁“世界学人”项目时的一则培训指南，训练我们怎样向别人提意见，以及怎样接受别人提意见。


    光说道理，你和我都知道应该欢迎别人向我们提意见。反馈对学习至关重要，没有反馈就不知道行为效果，也就无法校准、改正、提升。但只会回到现实，我们马上发现提意见是件难事。有多难，请回忆一下别人向你提意见时，你的内心活动。


    提意见属于困难对话，难在人们在互动中，不只有学习进步这一面需求，还有被认可被接受的另一面需求。两者之间关系很紧张。


    ## 提意见、听取意见的行为指南


    关于怎样提意见：


    + 1. 提意见要事先得到对方同意。人家不想听，你就不要主动提。

    + 2. 事先想想怎样提建议才会有效果，会给对方造成什么影响；要澄清自己的意图；你的意见要集中在对方此前言行给你造成的感受。一句话，虽然是提意见，尽量讲自己，别讲对方。

    + 3. 要及时，越快越好，而且最好私下提。许多话，当时不说，以后最好就别说了。


    ## 提意见的三层内涵


    现实则很惨淡。从接受培训到今天，两年过去，我提过意见也接受过意见，见过别人提意见也见过别人接受意见。这个美好的对话流程实现过几次？


    好，我配吗？


    韩非子说： “凡说之难：非吾知之有以说之之难也，又非吾辩之能明吾意之难也，又非吾敢横失而能尽之难也。凡说之难：在知所说之心，可以吾说当之。” 不是难在不知道，不是难在不会讲，也不是难在说不透，而是难在不知心。


    听到这里，你也用不着沮丧，觉得今天讲的指南最终还是没什么用。相反，它很有用。


    第一，对话大多数时候不能解决问题，但对话这件事本身你还是得做好。


    按照这一课讲的指南，你可以把话说到，至于对方能不能做到，在你的控制之外，做不到是他的错，你做好自己能做的。如果你在这样的对话中遇到同道，恭喜，你们有了个好的开始。


    第二，更重要的是，信任是世间真正的珍宝，却很容易消逝。你要是以 шляхом好朋友随便怎么提意见对方都能理解能接受，那就错了。即使彼此知心，也要精心维护，这套对话指南最适用的就是在朋友之间，一是能够用起来，二是用了有效果，至少有有效果的希望。想想就明白，敌
    Illuminate之间话术用处有限，朋友之间才是它真正能用武之地。


    ## ——◆ 本讲小结 ◆——


    总结一下，这一讲我们讲了怎么提意见，就是说难听话。你要意识到如果是想通过提意见改变对方，这基本上不可能；但如果你把目标调低，立足于把话说出来，那这套话术就适合你。


    这一讲的灵感来自《高难度谈话》（Difficult Conversations: How to Discuss What Matters Most）这本书。作者斯通（Douglas
    Stone）在哈佛大学开谈判课20年，这本书是他的代表作。困难对话是事实、情感、身份三个层次交织在一起的对话，这个精彩洞见就出自本书。


    你可以把这一讲，分享给你亲近的朋友和家人，在你们之间先用起来。


    ## ——◆ 思考题 ◆——


    我给你留一个思考题：


    你有没有成功说服过另一个人，说到他心服口服？是什么起了作用？


    下一讲，我来给你聊一聊写作，我们下一讲见。


    ## 划重点


    + 1. 提意见是困难对话，要改变对方很难，你要调低预期。 2. 不要争论对错，要谈感受。 3. 如果提意见的对话进行得好，你不妨致力于推动下一步的行动。


