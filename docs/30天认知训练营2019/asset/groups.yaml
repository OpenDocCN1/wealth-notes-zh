    # 06规划：你已经输在起跑线


    30天认知训练营·2019


    06规划：你已经输在起跑线


    你好，我是王烁。


    这一讲我要告诉你一个坏消息，你输在起跑线上了。


    从头慢慢讲。


    # 现代社会的两种养老机制


    现代人晓熟，20岁成人，工作40年，60岁退休，80岁离世。平均而言，大体如此。每一个人说到底是自己养活自己，工作40年的收入，管生活80岁的开支。


    实际上是通过代际财政实现的：前20年我们靠父母养育，后20年我们靠子女扶助，父母和子女靠他们的父母和子女，反复叠代，这就是代际相传的本义。家庭首先是个经济组织，解决收支与支出的期限错配难题。


    今天成熟社会又多了一重安排，就是社保，政府安排下的养老保障。各国社保做法不同，但逻辑都一样。社保的钱不是政府变戏法变出来的，也不是从天上掉下来的，还是每个人自己工作所得，只是换了个解决期限错配的形式：你工作有收入就向政府交社保，60岁退休就从政府领社保。政府居中，向今天的你收钱，将来再把钱给你。


    # 为什么我们这一代输在起跑线


    好了，现在道理讲明白了，终于可以回到重点了：你输在起跑线上了，在养老这件事情上。


    为什么这样说呢？


    第一，目测你会是社保交得多的那个群体。社保缴费大半进入统筹账户，大家交得差不多，领得差不多。你大概率会交得多。不信，看看你的学历、能力、学习力，在社会分布的哪一层？


    # 你怎么提前规划


    后果很严重。


    前面讲过，正常是工作40年的收入管活80年的开支，到我们这一代人，变成了工作40年管100年的开支，多出来的20年是养子女到20岁，但我们这一代指望不上下一代来养我们了。如果你是独生子女的话，同情你，另外再加20年开支。


    你的<|message|> 规划至少得包括下面三点：


    +   第一，必须储蓄，储蓄必须用来投资，而投资就是一生。


    +   第二，长期投资收益率高必须胜过通胀。


    +   第三，输在起跑线上的，只能在终点拿回来。


    # —— 本讲小结 ——


    总结一下，这一讲我把社保的逻辑讲清楚了，也给你我把账算清楚了。总之，你已经输在起跑线上了，必须做好在终点补回来的准备。而准备要从现在做起，因为终身保有工作能力的前提是终身学习。


    # —— 思考题 ——


    最后，我给你留一个思考题，七十岁还在工作，肯定不能靠体力，那靠的就是什么能力？


    下一讲，我会带你理解运势。下一讲见。'
