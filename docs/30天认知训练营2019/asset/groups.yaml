    # 12 战略：人际斗争有万能打法


    12 战略：人际斗争有万能打法…


    你好，我是王烨。


    这一章前面两讲，我们说了简单无出路，政治躲不开。再强调一次，所谓政治，我这里是广义的，指所有得凭力量对比才能解决问题场景，那些只要查找对比法律、规则就能解决问题场景不算。在绝大多数场景里都得靠力量对比，这一讲，我跟你讲在这些场景里面有个万能打法。


    # 万能打法的精髓


    曾有一位大机构负责人乐呵呵地跟我说，政治很简单，就是要搞得朋友多多的，敌人少少的。他说的不算错，却只说到了最后力量对比这一层。人多胜算大，但是分配的时候人多就不好了。


    最好是打的时候人多，分的时候人少。


    精髓就这一句话，不同年代不同体制下都管用，本来是大玩家们不立文字的底线能力、秘传心法，终为梅斯奎塔（Bueno Bruce de Mesquita）梳理出来公之于世。


    梅斯奎塔是美国政治学家，当过美国政治学会会长，治学的路线是现实主义政治学。现实主义政治学，用马基雅维利格言一句概括：没有永恒的朋友，只有永恒的利益。多补充一句话，政治的各种面相，是因为利益的不同层结构。


    这两年，玫瑰色褪去，世界变得险恶又狡狯，跟现实主义的视角和预言贴得越来越紧。风水轮流转，转到了这一节。


    你也好，我也好，每个人本来就是有点理想，而以现实为本，只是此刻已入冬，大家都比以前更现实，你不多用点现实主义理论武装自己，怎么过得这一个冬天？


    万能打法就是一句话：打的时候人多，分的时候人少。想得到好，怎么实现？


    诀窍是一个世界观和三个维度。


    # 万能打法的世界观和维度


    一个世界观，指驱动玩家的首要动力是获得权力，以及获得权力以后保持权力。这不用多说，是现实主义的经典假设。


    三个维度，指玩家考虑力量对比的时候要看三样：名义支持者（nominal electorate）、实际支持者（real electorate）、制胜联盟（winning
    coalition）。


    名义支持者指所有潜在支持者，实际支持者指那些有分量的支持者，制胜联盟指那些缺少其支持你就党充的实际支持者。这三者的关系是这样的：名义支持者可替代，实际支持者有影响，制胜联盟不可或缺。


    在名义支持者、真实支持者、制胜联盟三个维度下，梅斯奎塔用绝对现实主义的分析框架，重新梳理从政客到CEO的行为逻辑，谱出一部现代厚黑学。


    比如说，在这个三维视角下：所谓民主体制，就是制胜联盟很大，实际支持者更大，大到跟名义支持者差不多。所谓威权体制，就是名义支持者很大，实际支持者较小，制胜联盟极小。药都是这几味药，只是配方组合剂量不同。民主与威权都在同一个光谱上，没有截然区分的鸿沟，只是场景不同。


    无论哪种场景，把万能打法落实到具体路线，也是同样的五条细则：


    +   规则一：制胜联盟越小越好。


    只要是能打赢，制胜联盟规模越小，分配的人就越少，而且人越少你就越好控制。


    +   规则二：名义支持者越多越好。


    名义支持者越多，实际支持者和制胜联盟成员的可替代性就越强，所以就越听话；这还搞同样适用于实际支持者，也是越多越好。


    +   规则三：控制住关键资源。


    惟器与名不可假人，地位和名分最重要，这是老祖宗的告诫。现代社会跟这个稍有不同，关键资源主要表现为钱。


    +   规则四：你的制胜联盟不能养得太饱。


    太饱不利于他们继续保持忠诚。老祖宗也有同样的智慧。三国时代，就有智者这样来规划对史上第一大反骨仔名曰布的使用：要像养鹰一样用他。让他适当保持饥饿感，他就继续给你干；一旦让他吃饱，他就飞了。


    +   规则五：关键词是适度保持饥饿感，你可不能真的让制胜联盟饿着了。


    真饿着了他就吃你。你得保证胜利联盟的利益，绝对不能从他们的口袋中把钱掏出来给别人，无论是名义支持者还是实际支持者。实在要发善心的话，你得用自己的钱。


    # 万能打法在商业场下的应用


    万能打法不仅读懂帝王事，也能在今天的商战中实操。你看马云运筹了十年，终于把阿里巴巴的控制权安排妥当，跟万能打法的要求丝丝入扣：


    +   规则一，制胜联盟越小越好。


    # —— 本讲小结 ——


    总结一下，我们这一讲的万能打法，就是要解决一个千古难题，怎么做到打仗的时候人多，分配的时候人少。万能打法的关键在于运用名义支持者、实际支持者、制胜联盟。'
  - '[PAGE 23]


    键在于运用名义支持者、实际支持者、制胜联盟的三维结构。运用之妙，存乎一心，我们共勉。


    这一讲的灵感来自于一本书，梅斯奎塔写的《独裁者手册》（The Dictator’s Handbook）。你不必被“独裁者”这三个字吓到了，其实我觉得这本书更好的名字叫做《万能的政治打法》，学会这套打法对你有用。


    # ——♦ 思考题 ♦——


    我给你留一个思考题：


    我讲了古今很多万能打法的应用实例，你有没有见到过这套万能打法的应用实例？


    欢迎在留言区留言。


    下一讲，我会跟你聊聊怎么搭建关系网，我们下一讲见。


    # 划重点


    怎么让自己立于不败之地？ 1.你要控制住关键资源。 2.你要让支持自己的人多多的，但要让参与分配的人少少的。 3.参与分配的核心人员不能养得太饱，但也不能让他们真饿着。'
  - '[PAGE 24]


    # 13 关系：不可不铁，不可太铁


    13 关系：不可不铁，不可太... ↓


    你好，我是王烁。


    这一讲我们来看看看怎么搭关系网。


    人生而自由，却无不在关系之中。每个人都有三样资本：人力、财务、关系。假设人力和财务资本相同，谁就会搞关系谁获利大。关系网是人生重要资本，有时是最重要资本，对此我们中国人都心领神会，抨竟用拼音写的
    guan xi 这个词，都进入英语词汇表了。


    真正会搞关系的人是人生赢家。他知道哪里有好机会，有好机会都能抢上一手，好机会离了他还真不行。


    你知道怎么搭关系吗？


    # 帝王关系术


    我给你讲讲帝王是怎么搞关系网的。


    大臣无私交，是历代帝王最重要的一条政治规矩。大臣之间不能私下往来，不能随随便门，更不能互通信息，互相勾结就更不用说了，最好连历史交情都没有。


    # 冗余关系网


    说到这里，请你先反思一下自己的关系网。如果你的关系网凝聚力极强，所有朋友都认识所有另外的朋友，如果你的关系网同构性极强，你通过所有人接入的都是同一个关系网，那么你麻烦了。


    # 结构洞，从关系网中套利


    既没凝聚力又不同构的情况，社会学中叫做结构洞（structural holes）。之所以叫做洞，是因为关系网延展到这里好像是撞进了洞里，大臣无私交，无私交就产生了洞。'
  - '[PAGE 25]


    网。不必过好谁，有用就行了，做桥最有用。


    # 第三，同质关系收益递减。


    你不需要认识每个校友每个同事每个同行，每个群体熟悉几个节点就够了。如果只从效率考虑，每个群体熟悉一个关键人，掌握一个关键节点，就够了，但如果真这样的话，那么这座桥同时掌握在你和他手中，你依赖他才能跨越结构洞，正如他也是依赖你才能跨越结构洞。你们彼此套牢。你解套的办法是至少要在他之外多布一个点。林彪指挥百万大军，但时常越过指挥系统，直接指挥到连队，其实领导都需要这样。


    # 第四，你的关系网跨越越多的群体，有越多的结构洞，你就越自由。


    自由不是自己一个人想做什么做什么，而是与他人有独特丰富的的关系，关系越独特丰富，你就越自由。不想搞艺术的科学家不是好商人，混搭，随时出入于多个群体而不为任何一个群体所限的人，是人能获得的最大自由。


    说完这些，还得对你有个重要提醒。凡事不要做绝，你按结构洞搭关系网也不要做绝。人人都有亲人、朋友，这些人生中的核心关系当然有用处，但他们不是拿来用的，他们是我们的身心滋养，是我们安全感的最终来源。许多成功者说成功是与自己最重视的人，有丰富饱满凝聚力极强的关系，我相信他们说的是真话。


    # 维也纳小组


    这里说的还只是情感，即使在情感之外，就谈理性计算，要将含有多结构洞的关系网的能量发挥到极致，一个人远远不如一个团队，成员相互信任，凝聚力强，各有特长。人类的多数创新来自于拥有这些特点的小圈子。


    2000多年前的雅典学院将古希腊思想发扬光大、100年前的维也纳小组重塑20世纪思想史、30年前的中国社科院体改所群英开校散叶，成为中国经济改革的中坚力量，都属于这一类。


    我讲讲维也纳小组的故事。第一次世界大战后，以维也纳为中心聚集了一群知识精英，重塑了20世纪西方科学和哲学思想，分析哲学、当代科学哲学都从这里发源。


    维也纳小组的构成符合典型的结构洞理论，其成员有维特根斯坦、波普尔、哥德尔、卡尔纳普、石里克，来自物理学、数学、逻辑学、哲学的不同圈子。作为一个整体，小组跨越了许多结构洞，打通多个学科，新思维相互启发。


    维也纳小组也超越了典型的结构洞理论，所有成员都认识所有成员，定期交流，彼此激发，凝聚力极强，致力于在相对论和量子力学兴起的时代为科学寻找可靠基础，成为20世纪分析哲学和科学哲学的正源。


    其实，我也在维也纳小组关系网之中。我的导师的导师是洪谦先生，他的导师石里克是维也纳小组领袖，洪谦先生本人也是小组一员，我算是小组的三传或者四传弟子吧。


    帝王学将结构洞做到绝就够了，伟大的事业则往往来自高水平、彼此充分信任、背景多元化的亲密小圈子，这就要求有克制地部署结构洞。


    跨越再多的结构洞，到最后我们还是要与同道中人在一起，相互激励，彼此慰藉，才能迸发出整体最大能量，有所创造。要是失去分寸，学关系帝王术学到一丝不苟，即或成功，大家都被你一网打尽，但你也不过变成孤家寡人。


    # —— 本讲小结 ——


    总结一下，这一讲告诉你：


    搭关系，不要想别人对你有什么用，要想你对别人有什么用，而你对别人的用处大小，不在你本身，而在于你在关系网结构中的位置。要站在跨越最多结构洞的网中。同时你也要记住，这件事也不要做绝。


    这一讲受到卡尔·西格蒙德（Karl Sigmund）的书《疯狂年代的精确思考》（Exact Thinking in Demented Times）的启发，出身维也纳学术圈的当代学者写维也纳小组的故事。刚才讲过我算是维也纳小组的多传不肖弟子，举贤不避亲，把这本书推荐给你，体会一下现实中结构洞关系学的最优用法。


    # —— 思考题 ——


    最后，我给你留一个思考题：


    请讲讲你看到的小圈子大能量的故事，他们是不是与结构洞关系学暗合，又怎样避开了它的陷阱？


    欢迎你在文稿下方的留言区写出你的想法。


    下一讲，我会跟你探讨一下亲密关系的悖论，我们下一讲见。


    # 划重点


    1.讨好大人物往往占不到便宜，讨到饭碗，也失去自由。2.不要想别人对你有什么用，要想你对别人有什么用。3.你和另一个人的关系网结构越不同，你给对方的价值就越大。4.关系不要做绝，最亲密的关系是我们的归属。


