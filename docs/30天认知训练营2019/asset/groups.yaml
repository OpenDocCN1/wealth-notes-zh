    世界上只有三种人：君子、小人、伪君子。


    君子是稳定一致的，他只做好事；小人也是稳定一致的，他只做坏事；伪君子不同，他有时做好事，有时做坏事。


    伪君子何时做好事何时做坏事是有模式的：在涉及利益大小上，他遇小事做好事，遇大事做坏事。在时间先后上，他一直做好事，最后做坏事。小事做君子大事做小人，先做君子后做小人。由于现实中小事多大事少，所以识别伪君子并不容易，等到能识别的时候往往已经太晚了。伪君子暴露真面目总是在最后。


