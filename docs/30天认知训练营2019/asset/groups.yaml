    \n《前一篇 后一篇》\n\n留言精选\n\n点击加载留言\n\n# 05选择：沉住气还是孤注一掷\n\n30天认知训练营·2019\n\n你好，我是王烁。\n\
    \n今天我讲什么时候应该孤注一掷，什么时候可以耐心沉着。\n\n我们先来设想这样一个问题，微创创始人张小龙是业余高尔夫球手中的职业水平，拿了顶级职业-业余配对赛的最高荣誉。假如你有机会跟张小龙打球，假如你居然还赢，用什么办法成功机会会最大？\n\
    \n别打满全场，就打一个洞，猜不好你一杆进洞了呢。要是选择打满全场，就算你运从天降，有一次一杆进洞，全场下来你还是会输——水平差距太大。\n\n如果你进拉斯维加斯赌场，本来是当作花钱买娱乐，下注买个乐呵。赌场对赌客的概率优势，明白白地写在执照里，你下场的预期收益是负的。\n\
    \n但如果你走投无路，非得靠赌来解决问题改变命运，那么至少你不要分次下注，那只会稳定地逐渐输光。你应该全部押上，一次下注，接受命运的裁决，多半还是一次就输光，但好歹不是必然输光，总算有点点机会。\n\
    \n赌场喜欢豪客，那是相对而言。假如盖茨去赌场，就要只赌一把，输家赔光，赢家全拿，这样的豪客赌场不敢接。\n\n体育比赛，一方领先了往往打成功率，增加控球，减少进攻次数，以期提升每次进攻得分的概率。如果是面对实力更强的对手，这选择挺合理；但如果自己的实力强过对手，这选择就欠考虑。\n\
    \n强队一方领先，应该保持进攻频率，双攻守的次数越多，才对自己有利的实力对比才越发挥出来。你进攻次数多，虽然对方也多，但回来越多概率对你越有利。如果你想稳，减少进攻次数，虽然也减少了对方的进攻次数，但对方跟你孤注一掷，经常就是这样翻盘。\n\
    \n概率越是稳定地站在你这一边，越要孤注一掷赌运气。相反，如果你是张小龙，如果你是拉斯维加斯赌场，如果你是西班牙足球队，那么就没有什么是好急的，沉住气，慢慢来，靠概率和水平就行的事，别赌运气。\n\
    \n# 第一层：从实力出发的选择\n\n有人着眼长期，有人选择短期行为，各人各不同，可不可光是因为素质、教养、格调差别，有着强大的理论依据：\n\n对那些有资源、水平、优势的人来说，他们当然该着眼长期，因为着眼长期对他们有利；对那些没有资源、水平、优势的人来说，长期必败，不如短线一搏更好。这是第一层。\n\
    \n延伸开来说，中国股市短期炒作的多，长期投资的少，虽然有多重原因，解决办法也没有可以一招制敌的，但至少不用做一件缘木求鱼的事，就是教育投资者。投资者不需要教育，他们比教授教育他们的人更知道真相，至少不装傻。他们本能地知道，在信息不对称监管不给力的市场上，长赌必输。\n\
    \n当然，他们作为一个整体，短炒一样必输，毕竟大数定律放在那里。但至少对他们中的每个人来说，短炒赌运气机会还大一点。吴敬琏先生多年前说过中国股市像赌场，其实吴先生还是容气了，合法赌场占你多大便宜至少还是明牌。\n\
    \n有人不明白中国股市为什么总是熊市长牛市短，把20多年走势图拉开来看，总是不脉冲式暴涨之后漫漫阴跌，一而再，再而三。其实没什么不好理解的：好不容易赌对一次，你不拿钱走人吗？\n\
    \n# 第二层：受制于环境的选择\n\n这里正好讲到第二层：如果选择短期行为的人太多，那么那些有资源、水平、优势的人也无法继续保持沉着、着眼长期。\n\n\
    市场上完蛋的可不只是散户，金融危机来临时华尔街上所有机构都危如累卵。他们有信息、技术、专业、关系的优势，为什么不沉住气慢慢玩？何必要跟大家一样并发行衍生品直到撑得要爆炸？\n\
    \n因为做这生意一直赚大钱，不做这生意，你的下一季度报表就没有竞争对手的好看。做这生意，长期中公司也许会完蛋，但不做这生意，马上你自己就完蛋。“我们都知道舞会迟早结束，但只要音乐不听，我们就得跳。”当时华尔街最大机构的负责人老老实实地说。\n\
    \n这不仅是大人物的事。我们来谈谈你吧。\n\n假如你很有能力，身处什么样的组织对你有利？\n\n所谓路遥知马力，你要选那些足够路遥的组织，假以时日，职业生涯自然步步高升，因为能耐站在你这边。\n\
    \n假如你所在组织的金字塔结构比较陡峭，升迁的职位比较少，而组织决定升迁的标准是近期业绩，那么，哪些同事事能力不如你，只要他们都采用孤注一掷的策略，各自全力投入去干一件大事，赢了就上位，输了就丢饭碗。他们冒的风险很大，对他们不一定好，但你的能力优势就被他们的拼搏给抵消掉了。固然他们当中绝大多数都会失败，但只要有一个人成功，主管位置就是他的了。\n\
    \n你怎么办？你也只能去冒险，哪里本来你只凭才华就够可以。选择冒险，那就得看运气，而运气会拉平你和同事们的能差差距。\n\n所以，那些公认且自认能力强的人，往往去了稳定的大公司，而创业者一般原本处在主流边缘；班上成绩最好的同学，往往过了相对平淡的一生。这些不是命运无常，而是每个人的理性选择，你也可以不这样选，但社会替大家作适应性选择，使这些成了人生常态。\n\
    \n# 第三层：未来不确定下的选择\n\n现在讲第三层。\n\n这个世界看起来正处在一个大变化的早期。全球化退潮，共识耗散，分化极化，经济承压，社会撕裂，处处如此。我们已经熟悉的状态形成于两重合力：1978年以来内部改革带来长期增长，1991年冷战结束以来的大缓和带来全球化的突进。今天两重合力都在改变，焦虑四处蔓延。关于未来唯一可靠的预测就是它变得难以预测。\n\
    \n我要讲的第三层就是，此时此刻，不必太过悲观。\n\n如果未来变得更动荡，你反而更有条件沉着一点，好比赌场把老虎机全部撤下，换成了21点牌桌，概率从稳定对你不利的状态切换到了不稳定状态，大多数时候还是对你不利，但不时出现机会降临。此时，凭借技巧、算力，一点运气，再加上等待机会出现的耐心，你就有机会战胜赌场。\n\
    \n# —— 本讲小结 ——\n\n总结一下，这一讲我们讲了三层。\n\n+   第一层：当概率越稳定地不站在你这一边时，你越要孤注一掷。\n+   第二层：当大家都孤注一掷时，你也只好孤注一掷，你的才就被运气拉平了；而如果你不愿意孤注一掷，那么诀起站起来走出去，找到一个不需要孤注一掷的环境。\n\
    +   第三层：当概率变得不稳定时，你反而不必着急出牌，因为真有机会了。当时势转移，未来难测，你不妨更沉着。\n\n这一讲的灵感来源于詹姆斯·G·马奇（James\
    \ March）的书《决策是如何产生的》（Primer on Decision Making）。\n\n# —— 思考题 ——\n\n我给你留一个思考题：\n\
    \n今天讲的比较好理解，但实际上大多数人实际做法正好相反，往往是概率对自己有利的时候孤注一掷，比如说，觉得一门生意十拿九稳，于是押上全部身家。根据今天讲的内容，这样做法错在那里？\n\
    \n欢迎你在文稿下方的留言区写出你的想法。\n\n下—讲，我们会开启第二个模块，一起探讨我们可以用哪些新角度去看见社会。下一讲见。\n\n我们如何做选择？\n\
    第一层：当你实力不占优势时，孤注一掷；\n第二层：当大家都孤注一掷时，你也只好孤注一掷；\n第三层：当未来不确定，你不妨更耐心。\n\n# 06规划：你已经输在起跑线\n\
    \n30天认知训练营·2019\n\n06规划：你已经输在起跑线\n\n你好，我是王烁。\n\n这一讲我要告诉你一个坏消息，你输在起跑线上了。\n\n从头慢慢讲。\n\
    \n# 现代社会的两种养老机制\n\n现代人晓熟，20岁成人，工作40年，60岁退休，80岁离世。平均而言，大体如此。每一个人说到底是自己养活自己，工作40年的收入，管生活80岁的开支。\n\
    \n实际上是通过代际财政实现的：前20年我们靠父母养育，后20年我们靠子女扶助，父母和子女靠他们的父母和子女，反复叠代，这就是代际相传的本义。家庭首先是个经济组织，解决收支与支出的期限错配难题。\n\
    \n今天成熟社会又多了一重安排，就是社保，政府安排下的养老保障。各国社保做法不同，但逻辑都一样。社保的钱不是政府变戏法变出来的，也不是从天上掉下来的，还是每个人自己工作所得，只是换了个解决期限错配的形式：你工作有收入就向政府交社保，60岁退休就从政府领社保。政府居中，向今天的你收钱，将来再把钱给你。\n\
    \n# 为什么我们这一代输在起跑线\n\n好了，现在道理讲明白了，终于可以回到重点了：你输在起跑线上了，在养老这件事情上。\n\n为什么这样说呢？\n\n\
    第一，目测你会是社保交得多的那个群体。社保缴费大半进入统筹账户，大家交得差不多，领得差不多。你大概率会交得多。不信，看看你的学历、能力、学习力，在社会分布的哪一层？\n\
    \n# 你怎么提前规划\n\n后果很严重。\n\n前面讲过，正常是工作40年的收入管活80年的开支，到我们这一代人，变成了工作40年管100年的开支，多出来的20年是养子女到20岁，但我们这一代指望不上下一代来养我们了。如果你是独生子女的话，同情你，另外再加20年开支。\n\
    \n你的规划至少得包括下面三点：\n\n+   第一，必须储蓄，储蓄必须用来投资，而投资就是一生。\n+   第二，长期投资收益率高必须胜过通胀。\n+ \
    \  第三，输在起跑线上的，只能在终点拿回来。\n\n# —— 本讲小结 ——\n\n总结一下，这一讲我把社保的逻辑讲清楚了，也给你我把账算清楚了。总之，你已经输在起跑线上了，必须做好在终点补回来的准备。而准备要从现在做起，因为终身保有工作能力的前提是终身学习。\n\
    \n# —— 思考题 ——\n\n最后，我给你留一个思考题，七十岁还在工作，肯定不能靠体力，那靠的就是什么能力？\n\n下一讲，我会带你理解运势。下一讲见。\n\
    \n# 划重点\n\n添加到笔记\n\n我们这一代如何为养老提前规划？\n\n+   1. 必须储蓄，储蓄必须用来投资，而投资期是一生。\n2. 长期投资收益率必须战胜通胀。\n\
    3. 终身学习，终身保有工作的能力，你可能要工作到70甚至80岁。\n\n![](img/779997aa970e533f25d2fc2d33072952_11_0.png)\n\
    \n# 30人认知训练营·2019\n\n仅供...APP所有，未经许可不得转载\n\n前一篇\n\n后一篇：\n\n# 07 运气：比你想象得还不公平\n\
    \n30天认知训练营·2019\n\n07 运气：比你想象得还不...\n\n你好，我是王烁。\n\n这一讲，我想给你讲讲运气，这件看起来捉摸不定的事。\n\
    \n常识告诉你，成功取决于你的智力、努力，还有运气等等，天时、地利、人和缺一不可。常识也告诉你，智力、努力在于自己，而运气不在于自己，所以只能是穷尽人事，然后坦然面对天命。这些都是对的。\n\
    \n但常识没有告诉你，最后站在成功之巅的人，并不是你想象中的那一种。你以为他们用智力碾压你，比你还努力，运气又好到爆。\n\n如果真是那样，倒也无话可说。\n\
    \n但不是。他们的智力不能碾压你，他们不见得比你更努力，他们只是运气好到爆而已。\n\n# “才能对运气”的极简实验\n\n一群意大利物理学家和经济学家组了一个跨界团队，做了个极简实验，就叫作“才能对运气（Talent\
    \ VS Luck）”。之所以说是极简，是因为他们把成功之道简化成二元方程，成功=才能+运气，其它因素分别划归到这两项下面。\n\n在这个模型里，运气是随机降临的。当然，运气本身就是随机的，只不过真实生活里，被我们叫作运气的许多东西其实不是随机的，这个一会儿再讲。记住他们这里用的是狭义的运气，实验环境比现实还公平就好。\n\
    \n在模型里，才能的分布是钟形的。什么是钟形分布呢？钟形曲线的顶点在平均值，然后朝两端数值下降。绝大多数人的才能都在接近平均值的两边。2/3人的才能在距离平均值一个标准差的地方。这不是假设而是事实，现实中，人们的才能就是接近钟形分布的。\n\
    \n![](img/779997aa970e533f25d2fc2d33072952_12_0.png)\n\n你记住这俩数字，普通人占2/3，天才差不多千分之一。\n\
    \n运气、才能在模型中是这样相互作用的：好运气到来则收入增加，坏运气到来则收入减少。不过，好运气发生在不同才能的人身上效果不同，才能高的人遇到好运，收入增加得多，才能低的人收入增加得少。这也跟现实生活一致：运气来了，你还有能力抓住，才能高的人运用得更充分，白痴运气再好也没用。\n\
    \n# 现实比实验更不公平\n\n在现实中你确实偶尔会看到天才站到了塔尖，那也不是上面这些说错了，而是你一定要想到这是件多么罕见的事，相应地要意识到，得有多少大基数的天才被埋没。\n\
    \n# 你应该如何看待运气\n\n明白运气比我们想象得重要，对你有什么用？\n\n—— 本讲小结 ——\n总结一下，这一讲我给你讲了运气。\n你原来知道它重要，但你肯定不知道它这么重要。所以，如果你是分配者，你可以采取平均分配的策略，以应对运气的随机分布。同时，你值得明白，成功者往往真的是运气好。\n\
    \n> 这些内容来自一个跨界科学家团队对运气的研究，他们写的英文论文标题就叫天才对运气（Talent vs Luck: the role of randomness\
    \ in success and failure, by A. Pluchino, A. E. Biondo, A. Rapisarda），如果你还想了解得更细，我把链接放在下方，你可以自己去深究。\n\
    \n方，你可以自己去深究。\n\n论文链接：\n\nhttps://arxiv.org/abs/1802.07068\n\n# —— ◇ 思考题 ◇ ——\n\
    \n我给你留一个思考题：\n\n今天说了，站在金字塔尖的，基本上不可能 是天才，大多数都是普通人。偶尔我们会觉 得，站到金字塔尖的不是天才，也不是普通 人，而是弱智。他太傻了。那你觉得弱智站\
    \ 上金字塔尖的可能性存在吗？\n\n下一讲，我想跟你讨论的是 “三观”，很多 人把它作为交友的评判标准，但我劝你别太 苛求。为什么？我们下一讲说。\n\n\
    # 划重点\n\n运气比我们想象得更重要，对你来说：\n\n+   1. 不要嫉妒天才，要怜惜他们，因为他们的运气极大概率不会好。\n2. 与自己和解，当倾尽全力依然功败垂成，你就是输给了运气。\n\
    3. 不要迷信过往的成功，特别是面对每次都需要被命运考验的事。\n\n30人认知训练营·2019\n\n版权归... APP所有，未经许可不得转载\n\n\
    前一篇\n\n后一篇\n\n# 留言精选\n\n点击加载留言\n\n# 08共识：不要追求合三观\n\n30天认知训练营·2019\n\n08共识：不要追求合三观\n\
    \n你好，我是王烁。\n\n这一讲，我们聊三观。\n\n我特意查了一下，三观是世界观、价值观、人生观，其实都是一观：你我该如何做人。\n\n关于三观，你肯定已经听说过，世界上最遥远的距离就是三观不合；同时，你肯定也已经看到了，世界上大多数悲剧，就是因为人们一定要合三观所导致的。\n\
    \n# 三观形成的三个步骤\n\n在《正义之心》(The Righteous Mind)这本书中，顶尖道德心理学家海德(Jonathan Haidt)描绘了三观形成之路：\n\
    \n第一步，基因打好初稿。\n\n# 左派和右派是如何形成的\n\n你见过成人改三观的吗？这种人不是完全没有，我就见过一个，可是我见过的人有千千万呢。\n\n\
    # 三观不同的人，如何共处\n\n所以，回到主题，不要强合三观，它是先天后天特反复缠绕而成的意抄牢结(ideology)，强合三观必然引发血案，要么是你悲剧，要么是别人悲剧，要么是大家一起悲剧。\n\
    \n总结一下，这一讲，我给你讲了三观有很强的先天成因。\n\n(The Righteous Mind: Why Good People Are Divided\
    \ by Politics and Religion) 。\n\n# ——♦ 思考题 ♦——\n\n我给你留一个思考题：\n\n为什么今天，无论中外，任何一件大家关心的事都更难形成共识？\n\
    \n下一讲，我想给你讲讲两类人：狐狸和刺猬，特别是要讲讲狐狸可能掉进什么样的陷阱。我们下一讲见。\n\n# 划重点\n\n和三观不合的人怎么共处？\n\n\
    +   1. 不要认为你的三观比别人更正确，更不要撩拨对方的敏感点。\n2. 不要去跟人讲理，而应该讲故事。\n3. 接受三观不同，并寻找其中的套利空间。\n\
    \n# 09选择：反馈最后会把你带到陷阱\n\n30天认知训练营·2019\n\n09 选择：反馈最后会把你...\n\n你好，我是王烁。\n\n你一定听说过刺猬和狐狸的故事。如果没有听过也没关系，你只要知道故事里有两个关键角色就行。以塞亚·柏林说，刺猬知道一件大事，狐狸知道许多小事。\n\
    \n知道一件大事的刺猬，拿着锥子看什么都是钉子，以不变应万变。知道许多小事情的狐狸，不拘著于宏大叙事，也不急切地找到根本答案，兵来将挡，水来土掩，走一步看一步，根据反馈决定下一步，以万变应万变。\n\
    \n# 反馈的三种学习方法\n\n先申明一点，重视反馈没有错，不重视反馈那是自取灭亡。反馈是人们评价决策、校准行为的最重要依据。教师和学校教育的最大功能，就是为下一代系统性地提供反馈的学习，使他们步步进阶。不只下一代，所有人都是有反馈才有学习，反馈的质量决定学习的质量。\n\
    \n从反馈中学习一般有三种方法。\n\n第一种方法是從自己的经验中学习。\n\n# 适应性学习的陷阱\n\n坚持傻下去，意味深长。\n\n# ——◆ 本讲小结\
    \ ◆——\n\n在这一讲的最后，我给你两点提示：\n\n如果你是狐狸，请继续你的适应性学习，但不要太过沾沾自喜，尽量对刺猬好一点，同时把他们看紧一点，因为你总有一天要么搭他们的便车，要么被他们带进坑里。刺猬是狐狸的终极救赎，也是终极祸害。\n\
    \n如果你是刺猬，请明了自己大概率会失败，准备好承受后果，如果后果是你自己一个人承担，那就太好了。你是自费为社会做公益，社会将称你为英雄，因为要引诱你走上这条险路，请你把我们带出绝境，去到丰饶之地。\n\
    \n这一讲的灵感来源于一本讨论学习型组织的力作《企业行为理论》（A Behavioral Theory of the Firm），这是本很老的书，至今难说被超越。管理学界做过一次内部调查，大师多了，哪位能称作大师中的大师？就是引领大师的那种人，第一名即本书作者之一马奇（James\
    \ G. March）。\n\n# ——◆ 思考题 ◆——\n\n最后我给你留一个思考题，你是狐狸还是刺猬？为什么？\n\n到这里，我们关于社会模块的内容就讲完了，下claimed讲我们会开启组织这个模块，我们下一讲见。\n\
    \n# 划重点\n\n+   1. 如果你是狐狸，请继续适应性学习，尽量对刺猬好一点，因为你可能总有一天要搭他们的便车，同时把他们看紧一点，你也可能被他们带进坑里。\
    \ 2. 如果你是刺猬，请明白自己大概率会失败。但如果成功，整个社会将称你为英雄，因为要引诱你走上这条险路，把狐狸们带出绝境。\n"
  mdcn: "\n则是永恒战争，两者合力下，基于血缘关系的小村庄是保障基本安全的最小单位。\n\n推论是：大规模社会的政治、法律制度等上层构建使人们相互合作，并持续扩展合作秩序，并不是自然而然出现的。当他们难以为继的时候，社会有可能发生塌陷。塌陷的尽头是什么，亚玛诺米人的状态可不是黄金时代。\n\
    \n沙里翁的发现颠覆了那个时代的文化人类学主流，后者认为战争是文化现象，因为争夺物质资源而起。沙里翁则提供了进化论解释：\n\n暴力不是起源于理性争夺，而是本性使然。\n\
    \n他因此成为20世纪最有争议的人类学家，在发表第一篇论文之后就被逐出师门，即使到近年，当他被邀请加入美国国家科学院时，还有人辞去院士以表抗议。\n\n其实何必。\n\
    \n不论你在前面的四象限里处于什么位置，只有了解自然状态下的人真正是什么样的，才懂得化性起伪这件事有多么重要，才理解一层层的社会构造如果解体，我们可能会回归到什么极限状态，才明白维护合作秩序及其扩展这件事有多么难，而维持它又是多么重要。\n\
    \n人之异于禽兽，即在于此。\n\n# —— ◆ 本讲小结 ◆ ——\n\n总结一下，人类学家向我们展示了人在纯净的原始状态下是什么样子。我们面临的问题回到过去是解决不了的，只能往前走。人之异于禽兽者几希，但就这一点点是最贵的。\n\
    \n这一讲的灵感来源于一本英文书《高贵的野蛮人》（Noble Savages: My Life Among Two Dangerous Tribes），作者拿破仑·沙里翁（Napoleon\
    \ A. Chagnon）在原始部落中做田野调查，获得了人类社会初始状态的一线情报。\n\n# —— ◆ 思考题 ◆ ——\n\n我给你留一个思考题：\n\n\
    在今天讲到的四象限中，也就是性善论理想主义、性恶论理想主义、性善论现实主义和性恶论现实主义，你在什么位置？为什么？\n\n欢迎你在文稿下方的留言区写出你的想法。\n\
    \n下一讲，我会想带你理解一种处境，在动荡的大环境下，我们如何做个人选择。我们下一讲见。\n\n划重点\n\n人和禽兽到底有什么区别？\n1.人类从原始社会起，就是充满了暴力和战争的残酷社会。\
    \ \n2.无论你相信性本善还是本恶，都不影响你选择作恶还是行善。 \n3.美德都是后天培养出来的，真正的善只存在于成人身上。\n\n30人认知训练营·2019\n\
    \n《前一篇 后一篇》\n\n留言精选\n\n点击加载留言\n\n# 05选择：沉住气还是孤注一掷\n\n30天认知训练营·2019\n\n你好，我是王烁。\n\
    \n今天我讲什么时候应该孤注一掷，什么时候可以耐心沉着。\n\n我们先来设想这样一个问题，微创创始人张小龙是业余高尔夫球手中的职业水平，拿了顶级职业-业余配对赛的最高荣誉。假如你有机会跟张小龙打球，假如你居然还赢，用什么办法成功机会会最大？\n\
    \n别打满全场，就打一个洞，猜不好你一杆进洞了呢。要是选择打满全场，就算你运从天降，有一次一杆进洞，全场下来你还是会输——水平差距太大。\n\n如果你进拉斯维加斯赌场，本来是当作花钱买娱乐，下注买个乐呵。赌场对赌客的概率优势，明白白地写在执照里，你下场的预期收益是负的。\n\
    \n但如果你走投无路，非得靠赌来解决问题改变命运，那么至少你不要分次下注，那只会稳定地逐渐输光。你应该全部押上，一次下注，接受命运的裁决，多半还是一次就输光，但好歹不是必然输光，总算有点点机会。\n\
    \n赌场喜欢豪客，那是相对而言。假如盖茨去赌场，就要只赌一把，输家赔光，赢家全拿，这样的豪客赌场不敢接。\n\n体育比赛，一方领先了往往打成功率，增加控球，减少进攻次数，以期提升每次进攻得分的概率。如果是面对实力更强的对手，这选择挺合理；但如果自己的实力强过对手，这选择就欠考虑。\n\
    \n强队一方领先，应该保持进攻频率，双攻守的次数越多，才对自己有利的实力对比才越发挥出来。你进攻次数多，虽然对方也多，但回来越多概率对你越有利。如果你想稳，减少进攻次数，虽然也减少了对方的进攻次数，但对方跟你孤注一掷，经常就是这样翻盘。\n\
    \n概率越是稳定地站在你这一边，越要孤注一掷赌运气。相反，如果你是张小龙，如果你是拉斯维加斯赌场，如果你是西班牙足球队，那么就没有什么是好急的，沉住气，慢慢来，靠概率和水平就行的事，别赌运气。\n\
    \n# 第一层：从实力出发的选择\n\n有人着眼长期，有人选择短期行为，各人各不同，可不可光是因为素质、教养、格调差别，有着强大的理论依据：\n\n对那些有资源、水平、优势的人来说，他们当然该着眼长期，因为着眼长期对他们有利；对那些没有资源、水平、优势的人来说，长期必败，不如短线一搏更好。这是第一层。\n\
    \n延伸开来说，中国股市短期炒作的多，长期投资的少，虽然有多重原因，解决办法也没有可以一招制敌的，但至少不用做一件缘木求鱼的事，就是教育投资者。投资者不需要教育，他们比教授教育他们的人更知道真相，至少不装傻。他们本能地知道，在信息不对称监管不给力的市场上，长赌必输。\n\
    \n当然，他们作为一个整体，短炒一样必输，毕竟大数定律放在那里。但至少对他们中的每个人来说，短炒赌运气机会还大一点。吴敬琏先生多年前说过中国股市像赌场，其实吴先生还是容气了，合法赌场占你多大便宜至少还是明牌。\n\
    \n有人不明白中国股市为什么总是熊市长牛市短，把20多年走势图拉开来看，总是不脉冲式暴涨之后漫漫阴跌，一而再，再而三。其实没什么不好理解的：好不容易赌对一次，你不拿钱走人吗？\n\
    \n# 第二层：受制于环境的选择\n\n这里正好讲到第二层：如果选择短期行为的人太多，那么那些有资源、水平、优势的人也无法继续保持沉着、着眼长期。\n\n\
    市场上完蛋的可不只是散户，金融危机来临时华尔街上所有机构都危如累卵。他们有信息、技术、专业、关系的优势，为什么不沉住气慢慢玩？何必要跟大家一样并发行衍生品直到撑得要爆炸？\n\
    \n因为做这生意一直赚大钱，不做这生意，你的下一季度报表就没有竞争对手的好看。做这生意，长期中公司也许会完蛋，但不做这生意，马上你自己就完蛋。“我们都知道舞会迟早结束，但只要音乐不听，我们就得跳。”当时华尔街最大机构的负责人老老实实地说。\n\
    \n这不仅是大人物的事。我们来谈谈你吧。\n\n假如你很有能力，身处什么样的组织对你有利？\n\n所谓路遥知马力，你要选那些足够路遥的组织，假以时日，职业生涯自然步步高升，因为能耐站在你这边。\n\
    \n假如你所在组织的金字塔结构比较陡峭，升迁的职位比较少，而组织决定升迁的标准是近期业绩，那么，哪些同事事能力不如你，只要他们都采用孤注一掷的策略，各自全力投入去干一件大事，赢了就上位，输了就丢饭碗。他们冒的风险很大，对他们不一定好，但你的能力优势就被他们的拼搏给抵消掉了。固然他们当中绝大多数都会失败，但只要有一个人成功，主管位置就是他的了。\n\
    \n你怎么办？你也只能去冒险，哪里本来你只凭才华就够可以。选择冒险，那就得看运气，而运气会拉平你和同事们的能差差距。\n\n所以，那些公认且自认能力强的人，往往去了稳定的大公司，而创业者一般原本处在主流边缘；班上成绩最好的同学，往往过了相对平淡的一生。这些不是命运无常，而是每个人的理性选择，你也可以不这样选，但社会替大家作适应性选择，使这些成了人生常态。\n\
    \n# 第三层：未来不确定下的选择\n\n现在讲第三层。\n\n这个世界看起来正处在一个大变化的早期。全球化退潮，共识耗散，分化极化，经济承压，社会撕裂，处处如此。我们已经熟悉的状态形成于两重合力：1978年以来内部改革带来长期增长，1991年冷战结束以来的大缓和带来全球化的突进。今天两重合力都在改变，焦虑四处蔓延。关于未来唯一可靠的预测就是它变得难以预测。\n\
    \n我要讲的第三层就是，此时此刻，不必太过悲观。\n\n如果未来变得更动荡，你反而更有条件沉着一点，好比赌场把老虎机全部撤下，换成了21点牌桌，概率从稳定对你不利的状态切换到了不稳定状态，大多数时候还是对你不利，但不时出现机会降临。此时，凭借技巧、算力，一点运气，再加上等待机会出现的耐心，你就有机会战胜赌场。\n\
    \n# —— 本讲小结 ——\n\n总结一下，这一讲我们讲了三层。\n\n+   第一层：当概率越稳定地不站在你这一边时，你越要孤注一掷。\n+   第二层：当大家都孤注一掷时，你也只好孤注一掷，你的才就被运气拉平了；而如果你不愿意孤注一掷，那么诀起站起来走出去，找到一个不需要孤注一掷的环境。\n\
    +   第三层：当概率变得不稳定时，你反而不必着急出牌，因为真有机会了。当时势转移，未来难测，你不妨更沉着。\n\n这一讲的灵感来源于詹姆斯·G·马奇（James\
    \ March）的书《决策是如何产生的》（Primer on Decision Making）。\n\n# —— 思考题 ——\n\n我给你留一个思考题：\n\
    \n今天讲的比较好理解，但实际上大多数人实际做法正好相反，往往是概率对自己有利的时候孤注一掷，比如说，觉得一门生意十拿九稳，于是押上全部身家。根据今天讲的内容，这样做法错在那里？\n\
    \n欢迎你在文稿下方的留言区写出你的想法。\n\n下—讲，我们会开启第二个模块，一起探讨我们可以用哪些新角度去看见社会。下一讲见。\n\n我们如何做选择？\n\
    第一层：当你实力不占优势时，孤注一掷；\n第二层：当大家都孤注一掷时，你也只好孤注一掷；\n第三层：当未来不确定，你不妨更耐心。\n\n# 06规划：你已经输在起跑线\n\
    \n30天认知训练营·2019\n\n06规划：你已经输在起跑线\n\n你好，我是王烁。\n\n这一讲我要告诉你一个坏消息，你输在起跑线上了。\n\n从头慢慢讲。\n\
    \n# 现代社会的两种养老机制\n\n现代人晓熟，20岁成人，工作40年，60岁退休，80岁离世。平均而言，大体如此。每一个人说到底是自己养活自己，工作40年的收入，管生活80岁的开支。\n\
    \n实际上是通过代际财政实现的：前20年我们靠父母养育，后20年我们靠子女扶助，父母和子女靠他们的父母和子女，反复叠代，这就是代际相传的本义。家庭首先是个经济组织，解决收支与支出的期限错配难题。\n\
    \n今天成熟社会又多了一重安排，就是社保，政府安排下的养老保障。各国社保做法不同，但逻辑都一样。社保的钱不是政府变戏法变出来的，也不是从天上掉下来的，还是每个人自己工作所得，只是换了个解决期限错配的形式：你工作有收入就向政府交社保，60岁退休就从政府领社保。政府居中，向今天的你收钱，将来再把钱给你。\n\
    \n# 为什么我们这一代输在起跑线\n\n好了，现在道理讲明白了，终于可以回到重点了：你输在起跑线上了，在养老这件事情上。\n\n为什么这样说呢？\n\n\
    第一，目测你会是社保交得多的那个群体。社保缴费大半进入统筹账户，大家交得差不多，领得差不多。你大概率会交得多。不信，看看你的学历、能力、学习力，在社会分布的哪一层？\n\
    \n# 你怎么提前规划\n\n后果很严重。\n\n前面讲过，正常是工作40年的收入管活80年的开支，到我们这一代人，变成了工作40年管100年的开支，多出来的20年是养子女到20岁，但我们这一代指望不上下一代来养我们了。如果你是独生子女的话，同情你，另外再加20年开支。\n\
    \n你的规划至少得包括下面三点：\n\n+   第一，必须储蓄，储蓄必须用来投资，而投资就是一生。\n+   第二，长期投资收益率高必须胜过通胀。\n+ \
    \  第三，输在起跑线上的，只能在终点拿回来。\n\n# —— 本讲小结 ——\n\n总结一下，这一讲我把社保的逻辑讲清楚了，也给你我把账算清楚了。总之，你已经输在起跑线上了，必须做好在终点补回来的准备。而准备要从现在做起，因为终身保有工作能力的前提是终身学习。\n\
    \n# —— 思考题 ——\n\n最后，我给你留一个思考题，七十岁还在工作，肯定不能靠体力，那靠的就是什么能力？\n\n下一讲，我会带你理解运势。下一讲见。\n\
    \n# 划重点\n\n添加到笔记\n\n我们这一代如何为养老提前规划？\n\n+   1. 必须储蓄，储蓄必须用来投资，而投资期是一生。\n2. 长期投资收益率必须战胜通胀。\n\
    3. 终身学习，终身保有工作的能力，你可能要工作到70甚至80岁。\n\n![](img/779997aa970e533f25d2fc2d33072952_11_0.png)\n\
    \n# 30人认知训练营·2019\n\n仅供...APP所有，未经许可不得转载\n\n前一篇\n\n后一篇：\n\n# 07 运气：比你想象得还不公平\n\
    \n30天认知训练营·2019\n\n07 运气：比你想象得还不...\n\n你好，我是王烁。\n\n这一讲，我想给你讲讲运气，这件看起来捉摸不定的事。\n\
    \n常识告诉你，成功取决于你的智力、努力，还有运气等等，天时、地利、人和缺一不可。常识也告诉你，智力、努力在于自己，而运气不在于自己，所以只能是穷尽人事，然后坦然面对天命。这些都是对的。\n\
    \n但常识没有告诉你，最后站在成功之巅的人，并不是你想象中的那一种。你以为他们用智力碾压你，比你还努力，运气又好到爆。\n\n如果真是那样，倒也无话可说。\n\
    \n但不是。他们的智力不能碾压你，他们不见得比你更努力，他们只是运气好到爆而已。\n\n# “才能对运气”的极简实验\n\n一群意大利物理学家和经济学家组了一个跨界团队，做了个极简实验，就叫作“才能对运气（Talent\
    \ VS Luck）”。之所以说是极简，是因为他们把成功之道简化成二元方程，成功=才能+运气，其它因素分别划归到这两项下面。\n\n在这个模型里，运气是随机降临的。当然，运气本身就是随机的，只不过真实生活里，被我们叫作运气的许多东西其实不是随机的，这个一会儿再讲。记住他们这里用的是狭义的运气，实验环境比现实还公平就好。\n\
    \n在模型里，才能的分布是钟形的。什么是钟形分布呢？钟形曲线的顶点在平均值，然后朝两端数值下降。绝大多数人的才能都在接近平均值的两边。2/3人的才能在距离平均值一个标准差的地方。这不是假设而是事实，现实中，人们的才能就是接近钟形分布的。\n\
    \n![](img/779997aa970e533f25d2fc2d33072952_12_0.png)\n\n你记住这俩数字，普通人占2/3，天才差不多千分之一。\n\
    \n运气、才能在模型中是这样相互作用的：好运气到来则收入增加，坏运气到来则收入减少。不过，好运气发生在不同才能的人身上效果不同，才能高的人遇到好运，收入增加得多，才能低的人收入增加得少。这也跟现实生活一致：运气来了，你还有能力抓住，才能高的人运用得更充分，白痴运气再好也没用。\n\
    \n# 现实比实验更不公平\n\n在现实中你确实偶尔会看到天才站到了塔尖，那也不是上面这些说错了，而是你一定要想到这是件多么罕见的事，相应地要意识到，得有多少大基数的天才被埋没。\n\
    \n# 你应该如何看待运气\n\n明白运气比我们想象得重要，对你有什么用？\n\n—— 本讲小结 ——\n总结一下，这一讲我给你讲了运气。\n你原来知道它重要，但你肯定不知道它这么重要。所以，如果你是分配者，你可以采取平均分配的策略，以应对运气的随机分布。同时，你值得明白，成功者往往真的是运气好。\n\
    \n> 这些内容来自一个跨界科学家团队对运气的研究，他们写的英文论文标题就叫天才对运气（Talent vs Luck: the role of randomness\
    \ in success and failure, by A. Pluchino, A. E. Biondo, A. Rapisarda），如果你还想了解得更细，我把链接放在下方，你可以自己去深究。\n\
    \n方，你可以自己去深究。\n\n论文链接：\n\nhttps://arxiv.org/abs/1802.07068\n\n# —— ◇ 思考题 ◇ ——\n\
    \n我给你留一个思考题：\n\n今天说了，站在金字塔尖的，基本上不可能 是天才，大多数都是普通人。偶尔我们会觉 得，站到金字塔尖的不是天才，也不是普通 人，而是弱智。他太傻了。那你觉得弱智站\
    \ 上金字塔尖的可能性存在吗？\n\n下一讲，我想跟你讨论的是 “三观”，很多 人把它作为交友的评判标准，但我劝你别太 苛求。为什么？我们下一讲说。\n\n\
    # 划重点\n\n运气比我们想象得更重要，对你来说：\n\n+   1. 不要嫉妒天才，要怜惜他们，因为他们的运气极大概率不会好。\n2. 与自己和解，当倾尽全力依然功败垂成，你就是输给了运气。\n\
    3. 不要迷信过往的成功，特别是面对每次都需要被命运考验的事。\n\n30人认知训练营·2019\n\n版权归... APP所有，未经许可不得转载\n\n\
    前一篇\n\n后一篇\n\n# 留言精选\n\n点击加载留言\n\n# 08共识：不要追求合三观\n\n30天认知训练营·2019\n\n08共识：不要追求合三观\n\
    \n你好，我是王烁。\n\n这一讲，我们聊三观。\n\n我特意查了一下，三观是世界观、价值观、人生观，其实都是一观：你我该如何做人。\n\n关于三观，你肯定已经听说过，世界上最遥远的距离就是三观不合；同时，你肯定也已经看到了，世界上大多数悲剧，就是因为人们一定要合三观所导致的。\n\
    \n# 三观形成的三个步骤\n\n在《正义之心》(The Righteous Mind)这本书中，顶尖道德心理学家海德(Jonathan Haidt)描绘了三观形成之路：\n\
    \n第一步，基因打好初稿。\n\n# 左派和右派是如何形成的\n\n你见过成人改三观的吗？这种人不是完全没有，我就见过一个，可是我见过的人有千千万呢。\n\n\
    # 三观不同的人，如何共处\n\n所以，回到主题，不要强合三观，它是先天后天特反复缠绕而成的意抄牢结(ideology)，强合三观必然引发血案，要么是你悲剧，要么是别人悲剧，要么是大家一起悲剧。\n\
    \n总结一下，这一讲，我给你讲了三观有很强的先天成因。\n\n(The Righteous Mind: Why Good People Are Divided\
    \ by Politics and Religion) 。\n\n# ——♦ 思考题 ♦——\n\n我给你留一个思考题：\n\n为什么今天，无论中外，任何一件大家关心的事都更难形成共识？\n\
    \n下一讲，我想给你讲讲两类人：狐狸和刺猬，特别是要讲讲狐狸可能掉进什么样的陷阱。我们下一讲见。\n\n# 划重点\n\n和三观不合的人怎么共处？\n\n\
    +   1. 不要认为你的三观比别人更正确，更不要撩拨对方的敏感点。\n2. 不要去跟人讲理，而应该讲故事。\n3. 接受三观不同，并寻找其中的套利空间。\n\
    \n# 09选择：反馈最后会把你带到陷阱\n\n30天认知训练营·2019\n\n09 选择：反馈最后会把你...\n\n你好，我是王烁。\n\n你一定听说过刺猬和狐狸的故事。如果没有听过也没关系，你只要知道故事里有两个关键角色就行。以塞亚·柏林说，刺猬知道一件大事，狐狸知道许多小事。\n\
    \n知道一件大事的刺猬，拿着锥子看什么都是钉子，以不变应万变。知道许多小事情的狐狸，不拘著于宏大叙事，也不急切地找到根本答案，兵来将挡，水来土掩，走一步看一步，根据反馈决定下一步，以万变应万变。\n\
    \n# 反馈的三种学习方法\n\n先申明一点，重视反馈没有错，不重视反馈那是自取灭亡。反馈是人们评价决策、校准行为的最重要依据。教师和学校教育的最大功能，就是为下一代系统性地提供反馈的学习，使他们步步进阶。不只下一代，所有人都是有反馈才有学习，反馈的质量决定学习的质量。\n\
    \n从反馈中学习一般有三种方法。\n\n第一种方法是從自己的经验中学习。\n\n# 适应性学习的陷阱\n\n坚持傻下去，意味深长。\n\n# ——◆ 本讲小结\
    \ ◆——\n\n在这一讲的最后，我给你两点提示：\n\n如果你是狐狸，请继续你的适应性学习，但不要太过沾沾自喜，尽量对刺猬好一点，同时把他们看紧一点，因为你总有一天要么搭他们的便车，要么被他们带进坑里。刺猬是狐狸的终极救赎，也是终极祸害。\n\
    \n如果你是刺猬，请明了自己大概率会失败，准备好承受后果，如果后果是你自己一个人承担，那就太好了。你是自费为社会做公益，社会将称你为英雄，因为要引诱你走上这条险路，请你把我们带出绝境，去到丰饶之地。\n\
    \n这一讲的灵感来源于一本讨论学习型组织的力作《企业行为理论》（A Behavioral Theory of the Firm），这是本很老的书，至今难说被超越。管理学界做过一次内部调查，大师多了，哪位能称作大师中的大师？就是引领大师的那种人，第一名即本书作者之一马奇（James\
    \ G. March）。\n\n# ——◆ 思考题 ◆——\n\n最后我给你留一个思考题，你是狐狸还是刺猬？为什么？\n\n到这里，我们关于社会模块的内容就讲完了，下claimed讲我们会开启组织这个模块，我们下一讲见。\n\
    \n# 划重点\n\n+   1. 如果你是狐狸，请继续适应性学习，尽量对刺猬好一点，因为你可能总有一天要搭他们的便车，同时把他们看紧一点，你也可能被他们带进坑里。\
