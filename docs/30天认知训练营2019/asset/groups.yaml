    # 22缪箭思维：治标是智慧


    22 缪箭思维：治标是智慧


    你好，我是王姝。


    这一讲我要跟你讨论的是 一种思维方式，无妨缪箭。听起来比较难理解，听我一点点来给你讲解。


    我们总是面临无穷无尽的复杂性，市场无法把握，社会难以测量，人心不能洞察。我们孤零零一个人面对这些无限，怎么办？


    庄子曾经说过：“吾生也有涯而知也无涯，以有涯随无涯，殆矣。”就是说，我们的生命、我们的能力、我们的一切都是有限的，而我们要面对的东西是无限的，如果我们用我们的有限去对付那些无限，那我们就死了。


    唯一的办法，套用庄子的话来说，就是以有涯随有涯，也就是说以有限对有限。我们当然是有限的，那我们怎么在无限的复杂性中，去刻画出有限的简单性来，而这些有限的简单性是我们能够对付的。从无限中刻划出有限，与自己的有限相匹配。这样才有点机会。


    # 配对交易


    有点太抽象了。


    我具体讲件事，怎么从市场上挣钱。


    从市场上挣钱，谈何容易！都说股市里是：七亏二平一赚，那还是普通年景，熊市就更不必说了。往大里说，股指向何处去？何时是拐点？庄在何处？顶在何处？谁真的知道？往小里说，一家上市公司兴起衰亡之机，谁真能掌握？


    答案比问题简单，才叫好答案。上面这些问题的答案，都比问题本身更复杂。就算你穷尽了所有相关信息，答案并不会因此浮现，它还是藏在所有信息无穷无尽的相互作用之中，最终选择以自己的方式涌现出来。至于是什么方式，你没有预判。


    绝大多数人应该做的理性选择是跟随，放弃择时和择股。择时就是选择时机低买高卖，择股就是选择自己看好的股票。


    择时和择股都是自以为知道。但绝大多数人不会知道一家企业的兴衰会是什么样，更不知道它的兴衰是不是已经充分反映到股价里了，所以他们不应该选股，而应该买股票投资整个市场；他们不会知道价格现在是高还是低，所以他们也不该有低买高卖的企图，也就是放弃择时，而是转而去作为长期投资，最理想的是永远呆在市场里面。市场好他们也好，市场不好他们也不好。


    # 锯箭法


    每次谈起对冲，我就会想起一个词，锯箭法。这个词来自李宗吾《厚黑学》：有人中了箭，请外科医生治疗，医生将箭杆锯下就了事。这个人问医生为什么不把箭头取出？他说：那是内科的事，你去看内科好了。


    说起来是个笑话，但你想想，医生许多时候就是这样看病是对不对？听过好多次医生对我说对症治疗，最后终于忍不住问对症治疗什么意思。一位好心医生告诉我，就是对症状况治疗的意思，针对症状用药，减轻症状。至于造成症状的内因，要么是不知道，要么是即使知道也没什么好办法。


    对症治疗岂不就是锯箭法？锯箭法治标不治本，把露在外面看得见能下手的箭杆锯掉，里面看不见的箭头随他去。表面症状缓解，至于疾病，交给时间和命运。


    # —— 本讲小结 ——


    总结一下，这一讲，我给你介绍了一种思维方式，锯箭法；也给你介绍了一种锯箭法的应用，对冲。管不了的我们可以选择不管，聚焦在我能管的那一部分。这个方法能帮你缓解眼前的困境，只要你别忘了问题还在就行。


    这一讲的灵感来自塞巴斯蒂安·马拉比'
  - '[PAGE 45]


    这一讲的灵感来自塞巴斯蒂安·马拉比（Sebastian Mallaby）的书《富可敌国：对冲基金与新精英的崛起》（More Money Than God:
    Hedge Funds and the Making of a New Elite）。这本书是关于对冲基金最好的一部全景式介绍，想要进一步了解可以找来读。


    # ——♦ 思考题 ♦——


    我给你留一个思考题：


    极早期投资有一种做法叫作投赛道，就是一个新兴领域普遍撒下去，其实不怎么看每个投资的具体情况，这是不是锯箭法？它对冲掉了什么风险？它选择聚焦的风险是什么？


    欢迎你在留言区留言，跟我交流。


    下一讲，我们来讲逆向思考的正确做法。下一讲见。


    # 划重点


    1.对冲本质上是规避掉你不了解的风险，留下你更有把握的风险。2.具备多元视角的同时，你还要能集中聚焦到手头最重要的事情上。3.如果选择了锯箭法，永远不要忘了里面还有个你不了解的箭头。'
