    ## 19输出：写作进阶指南


    你好，我是王烁。


    这一讲，我来给你讲写作。


    对大多数人来说，写作是一个工具，做到有效就行了。有效写作就是能把想清楚的写明白。它不容易但人人都学会，只是需要方法、纪律和训练。


    在我的上一个得到课程《30天认知训练营·2018》里有一讲《怎样成为合格的写作者》，我专门介绍过有效写作的法门，减法式写作。一言以蔽之，就是不写那些没用的；而承载有效写作的文体是经典文体（classic
    style），围绕视觉来组织文章的结构，采取与读者对话的姿态。我假设你已经读过了，如果没有，建议去读。


    今天这一讲，讲给在有效写作之上，有更高追求的人。


    在有效写作之上谈写作，最重要的问题是搞明白为何写作。


    ### 写作的五个目的


    第一，写作可疗伤。


    写作可疗伤，有临床心理学的实证支持。受过巨大创伤的人，哪怕是把自己经历过的创伤写下来，就有抚慰创伤的治疗效果，原因不明。


    我试着解释一下。


    写下创伤，受伤者须把自己放在观察者的位置，把创伤放在被观察的位置，实现自己从创伤中短暂地抽离，创伤于受伤者从第一人称变成了第三人称。


    此外，人本来也有类似免疫系统的心理机制，创伤后激活心理的自我保护，逐渐抚平伤痛，复原心情，但这需要时间，写作是度过这段时间的好伴。受伤者笔下与自己对话，写作占据注意焦点，最终心理免疫系统在后台激活，疗伤生效。


    美国惊悚小说大家斯蒂芬·金就用写作疗伤。


    他20年前出车祸重伤，但差不多是从手术室出来就恢复写作，在经历生死的过程中写了一本书《谈写作》（On Writing），每天最多只能写40分钟，再多就要痛得昏过去。这种时候当然没心情写小说，书的副题是“关于技艺的回忆录”，一半是自传，一半是谈怎么写写作。前者审视自己走过的人生，后者梳理自己的技艺，给同行留下指引。结果呢，他恢复了，《谈写作》也成为关于写作的当代名著。他也了结掉一个心结：凭什么通俗小说家就没有资格谈写作？！


    如果你眼前有过不去的坎，坐下来先写吧。你会好一点。


    第二，写作创造美。


    文字本身的韵律、传达的思想、刻画的意象、起承转合的节奏，是最精萃的人文之美。许多人被文字之美打动，转而致力于在自己笔下重现。


    写作都是个体的，但又都是协作的。作者受前人文宇之美激发，有所取舍，回应以自己的创造，在笔下与前人对话，向后人发出信号，悠然心会，融入始终在延展中的用文字凝聚的技艺传承，探求文心，共同雕龙。


    社会能养活的专门以写作为生的人数并不多，但能用写作创造美的人则要多得多。写作创造美这件事，至少需要十种以上的大量训练才能登堂入室，一旦终于越过关口则前面一马平川。获得创造能力的成本很高，而发挥创造能力的成本很低，纸笔而已。能写而不写是你的巨大浪费，也是社会的巨大损失。


    第三，写作留下真实记录，至少是你诚心以为的真实记录。


    《易传》说，修辞立其诚。孔子说，古之良史，书法不隐。他赞美的对象是董狐，春秋末年晋国史官，秉笔直书，不避权臣。记录的责任不只属于历史学者，也属于每一位写作者。


    曾有位金融界大人物对我说，做事的话尽可以无所不为，写文章还是要写正确 的东西，毕竟文章千古事。这位大人物 的名声说实话有点多重灰色，但他20年前讲的话我记到今天，与这些年来耳闻目睹的人、事和文章对比下来，觉得他比许多人高明不少，也体面不少。


    第四，写作是为了推动改变。


    写作能带来的改变可大可小，使这个世界往你所认为善的方向多走一步，无论大小，都是改变，可以是改变自己的看法，可以是改变别人的看法，可以是激发行动，催生变化。什么改变都可以。


    每个人的写作都应该为了表达自我，但纯粹私人的写作毫无意义。森林里，一片叶子从树上掉下，无人在场，它到底发出了声音没有？要我说就是没有。不想带来改变的写作就是这片叶子。


    第五，写作是发出成本高昂难以伪造的信号。


    正因为写作总要致力于带来改变，写作者得用文字发出信号寻找同道。信息经济学提醒我们，信号越是成本高昂，成本越是只有你付得起，而其他人付不起或不愿意付，就越是难以伪造。


    写作的高昂成本有两个来源：一是写作需要大量训练，是难度最高的入际交流沟通手段；二是写作的定义就是留下文字，有记录就能回溯对比。言语出口随风而逝，字落于纸却是锚定放手。今天更是如此，互联网有永恒的记忆，爬虫确保了这一点。


    许多时候，用文字发出的信号不能作表面视之。当环境不允许直抒胸臆，写作者便发明曲笔的艺术，用文字同时承载传逾与遮掩两重使命，而曲意必须寻找言外之意（read
    between the lines）。有时，曲笔高明到无人分辨，后世也好争论不休。


    比如，《君主论》到底是马基雅维利对现实统治法则的真实看法，还是说只是讽刺作品？以塞亚·柏林(Isaiah Berlin)说分别是分不清的，于是他贡献新解，为这部经典已经太多的解读又增加了一种角度。前人说后人解，大家争当解人，希望在历史长河中被遮蔽的河道上寻找同路人。


    把这推到极处，古典思想大师利奥·斯特劳斯（Leo Strauss）更认为，大多数古典宗师流传下来的经典文本，都有外门（exoteric）和秘宗（esoteric）两种读法。且不说时代都有险恶环境，哗众并不存在有形威胁，最精深的思想总是面临着来自大众的普遍的无形戕害。真正的大师往往要自我于大众，只与选定的小众对话。


    所谓小众，指的不只是身边的小圈子，更是那些尚在求道路上的年轻人。他们中的幸运儿读透经典，穿过外门的屏障，通达本义的秘境，与大师相遇。


    # ——本讲小结——


    总结一下，这一讲我给你说了写作的五种目的：疗伤，追逐美，求真，向善，寻找同路人。


    你为什么写作？在有效之上，写作有更高阶追求的层次境界，要打开通达这些境界的大门，始于你对这个问题的回答。


    这一讲的灵感来自乔治·奥威尔的《我为什么写作》（Why I Write）。奥威尔认为写作必须旨在带来改变。如果说改变是用写作来追求善的话，那有时也会与用写作来求真、来创造美相冲突，奥威尔讲了在真善美不可兼得时的权衡取舍。


    他关于写作的几篇文章是写作者必读的珍宝，今天我向你着重推荐的是《我为什么要写作》，其实他关于写作还有其他两篇文章《政治与英语》《写作者与利维坦》，也都是杰作，一并推荐给你。


    # ——思考题——


    我给你留一个思考题：


    写作会不会消亡？


    为什么有此一问呢？因为写作很难，而说话太容易。过去写作比说话有个优势，就是说话总是当下的，受众有限。现在不同了，各种技术进步都是有利于说话的大规模实时传播的。那么，要付出很大努力才能掌握的写作，会不会日渐萎缩，最终消亡？


    欢迎在留言区写下你的看法与我交流。


    下一讲，我跟你讨论，学习有窗口期吗？年纪大了就学不会新东西了吗？我们下一讲见。


    ### 划重点

    - 1. 在有效写作之上，如何追求写作的更高境界？你要先明确写作的目的。

    - 2. 写作可以疗伤，追逐美，求真，向善，寻找同路人。

    - 3. 写作都是为了寻求改变，不寻求改变的写作没有意义。


    ## 20 学习：老狗这样学新招


    你好，我是王烨。


    这一讲，我想跟你探讨一个问题，人能真正做到终身学习吗？成年以后，还能学会新东西吗？这个问题对你我很关键，对得到也很关键，毕竟得到的slogan是“建立一所终身学习大学”。


    然而，终身学习这件事面临着一个巨坑。


    嘴上谁不想终身学习呢？问题是你学得动吗？我假设听课的你是成年人。据说成年人就学什么都慢，现在学习已经晚了。老狗学不了新招(you can’t teach an
    old dog new tricks)，这谚语是说谁呢？


    少少不努力，老大徒伤悲。主流的发展心理学一般认为学习有个窗口期。某些复杂技能你得在某个年龄段习得，过了这个年龄窗口就关闭了，你就没救了。想终身学习，首先就得对窗口期有个说法，否则何必为难自己做不可能的事？


    ### 马克思学吉他，拿自己做实验


    加里·马克思（Gary Marcus）决定搞清楚这件事。


    马克思是纽约大学心理学教授，研究方向是自然智能和人工智能。所谓自然智能就是人。他的本行就是发展心理学。发展心理学通过研究孩子来研究人类智能是怎么发展起来的。人工智能方向他也嗅有影响，搞了个公司卖给Uber。


    人已中年，马克思想要实现从小的宿愿，学弹吉他。作为严谨学者，他先查阅研究文献，发现学习关键期的说法很流行却没有多少实验证据，而没有实验证据的原因是缺少实验对象。成年以后才学乐器的人有几个呢？没有数据就没有结论。


    马克思决定自己上。自己研究自己还不行吗？


    他的初始条件是这样的：

    - 即将年满40岁；

    迄今这一生从未展现出任何音乐才能；

    他是个教授，有学术年假，有大量时间。


    除了有时间，其他全是劣势。


    从这里开始，他学了一年半吉他，最终在一个音乐夏令营上跟一群孩子搭班汇报演出出。水平怎么说呢？没有给孩子们丢脸。他知道了自己永远也不能成为音乐家，但后面会讲到这是他自己的生理构造所致。对我们来说最重要的是，他在这段旅程中没有看到任何不可逾越的障碍，使得成人注定不可能通过学习掌握新技能。


    也就是说，那个关键的窗口期没出现。


    ### 关于学习的六点结论


    是不是很振奋？给你介绍他的经验：


    第一，乐器很难，复杂技能都这样。


    乐器演奏难，难在它是记忆、感知、动作协调、肌肉控制、肌肉力量这一切的总和。演奏者的手势动作要像外科医生一样精准，速度要快，时间拿捏一点都不能错，甚至还要一心多用，各肢体以不同速度做不同动作，一手画方一手画圆。


    人本来不是这样长的，演化对人不可能就是这样安排的，要把人变成蘑菇长做这样别扭的事，只能靠大量反复练习，强行扭过来。


    第二，正是因为音乐演奏这么难，对人来说过于别扭，所以它不可能先天决定的。


    演奏技能不是演化而来的。大脑只是借用了许多已有的模块：关于感知的模块，关于语言的模块，关于肌肉协调的模块。


    演奏音乐所需要用到的大脑构造，如小脑、杏仁体、胼胝体、颞叶，进化原本给它们安排了另外的主要功能，结果被音乐给借用过来，朝着新用途重新训练这些模块，在这些模块之间搭桥，大量练习强化，直到形成不思而应的肌肉记忆。


    这是个难题悖论，却对你我成年人有利：正因为演奏太难、太不自然，必须大量练习才能获得高技能，所以不存在说谁有淡义上的音乐天赋，不存在一个决定了你是或者不是演奏天才的基因。


    第三，成年人学习新技能困难，已知的 主要问题是练习量不够。


    第四，存在通用学习方法。


    第五，好老师是这样的：


    提供进阶的结构：

    就是你现在处于什么程度，应该学什么，

    下一步学什么，他得心中很有数；


    提供针对缺点的解决方案：

    发现你的缺点，提出针对性解决方案，这是老师最重要的地方。


    如果你的老师符合上面这几条，恭喜你找到了好老师。


    # 第六，广义的天赋仍然存在。


    前面我们说了，没有狭义的音乐天赋，没有音乐演奏的基因也没有打五笔字型的基因，人类的复杂技能都不存在对应的特定基因。复杂技能大都出现在人类定居以后，到现在也就一万年时间，进化来不及。


    但是，没有特定技能的基因，不意味着天赋这件事不存在。


    以音乐演奏为例，它借用了感知、语言、记忆、声音这些功能所涉及的大脑回路，后者间接对应着特定的基因组合，它们间接影响着你学习音乐演奏的能力。


    马克思终于发现自己为什么一直缺少音乐才能。他从小就不玩秋千，也不喜欢睡摇篮，晕车，更晕过山车，因为他的耳前庭系统有问题，而耳前庭与节奏感知密切相关。马克思节奏感不行。没有节奏感的人，音乐演奏非常困难，但就算是这样，他也不能和小朋友一起同台演出吗？


    人与人确实不同，但不是我们以为的那样简单的不同。有天赋使一些人能够更快地掌握音乐，缺少天赋使另外一些人如马克思走到同样的地方需要付出更多努力，但马克思还是走到了这个地方。


    无论学习什么技能，没发现有什么东西注定我们已经太晚。至于掌握之上你还能走多远，看你的造化。


    不试试你怎么知道呢？


    # ——本讲小结——


    总结一下，年龄并不是学习的限制，不存在一个关键的窗口期，过了你就没戏了。只要你想学，什么时候都不晚。这句话听起来平常，但可能在人生的某个时刻，激励你。


    这一讲的灵感来源于，马克思的书，《从零开始》（Guitar Zero: The New Musician and the Science of Learning）。这本书是马克思人到中年从头学吉他的实录，以及作为研究者对成年人学习复杂技能的第一手观察和思考。


    # ——思考题——


    我给你留一个思考题：


    今天讲到成年人学习新技能比较困难的原因不是窗口期，而是专注力、记忆力下降影响了练习量。你是如何保持专注力的？或者说，针对成年后专注力下降，你有什么自我管理的办法？


    欢迎你在留言区留言与我讨论。


    下一讲，我讲的技能可能有点反常识，我希望你能做一些无用的事。下一讲见。


    ### ■ 划重点

    通用学习方法：1.将复杂技能分解为难度适宜的多个步骤。2.把单个步骤反复练习，直到实现肌肉记忆。3.将各个步骤重新组块，变成大一级的单元，在单元的层次上反复练习。


    留言精选


    点击加载留言


    ## 21 选择：做点无用的事


    你好，我是王烁。


    这一讲，我要劝你，做无用的事。


    一个人不能只做有用的事，这跟现实不现实、势利不势利无关。不能只做有用的事，这是人生多元化的关键策略。它关系到你现在的资源分配、未来的生死存亡。


    只做特别有用的事，效率爆表，没有一丝浪费，貌似完美，但事事有用，用术语来说，就是跟过去与现在过度拟合(overfit)，后果是特别适应当下。好戏是你你#...
    个个都致命。


    第一个问题，你是局部最优但远不是全局最优。


    什么是局部最优？什么是全局最优？


    ### 该做哪些无用的事


    不能只做有用的事，那么该做哪些无用的事？


    - 第一，多与他人交流，它是新意之源，交流本身比交流的内容更重要。

    - 第二，做你能做很久的事。

    - 第三，留出整块时间用于创造，做那些过程中给你带来巴胺、完成之后产生成就感的事。

    - 第四，做那些时间能帮你解决问题的事。


    ### 「够好就行」


    做无用的事，另外一种表述是“最好的敌人才 enemy of the good)”，出自伏尔泰，极度追求不如适可而止。


    在诺奖得主司马贺(Herbert Simon)那里，把它系统化作Satisficing理论，Satisficing是司马贺生造的词，由satisfy(满意)和suffice(足够)拼接而来，我姑且把它译作“够好就行”。


    功成万骨枯的竞争。要玩这些，够好是不行的，差一丝都不行，差一丝现在就失败，没有机会考虑将来怎么避免失败。环境越是赢家通吃，你越没有条件为应对环境变化留下余地。环境随时翻脸将你打倒，你明知这些，但身在局中，还是只能跟庄。


    如果你是“足够就行”，早早识别那些赢家通吃的游戏，躲着他们。


    # ——◆ 本讲小结 ◆——


    总结一下，这一讲，我告诉你两件事：


    第一个，你要做看起来对当下无用但又是

    有价值的事，这会增加你应对未来变化的能力。


    第二个，我教会了你一种决策逻辑，“足够就行”。


    这一讲的灵感，来自司马贺的自传，《科学迷宫里的顽童与大师：赫伯特·西蒙自传》（Models of My Life, by Herbert Simon），推荐给你。


    # ——◆ 思考题 ◆——


    我给你留一个思考题：


    哪些行业、事业、领域是赢家通吃的？哪些是“足够就行”的？


    欢迎你在留言区举例，与我探讨。


    下一讲，我们继续在个人这个维度探索，我跟你聊聊，如何打磨思维。我们下一讲见。


    ### 划重点

    1.做无用的事，可以是和他人一对一漫谈，也可以是用整块时间做自己感兴趣的事。

    2.人生没有最优解，大部分领域“足够就行”。

    3.但体育、艺术、战争这些领域，头部吃全部，只能争当第一。


    # 留言精选


    点击加载留言


    ## 22 锯箭思维：治标是智慧


    你好，我是王姝。


    这一讲我要跟你讨论的是 一种思维方式，无妨锯箭。听起来比较难理解，听我一点点来给你讲解。


    我们总是面临无穷无尽的复杂性，市场无法把握，社会难以测量，人心不能洞察。我们孤零零一个人面对这些无限，怎么办？


    庄子曾经说过：“吾生也有涯而知也无涯，以有涯随无涯，殆矣。”就是说，我们的生命、我们的能力、我们的一切都是有限的，而我们要面对的东西是无限的，如果我们用我们的有限去对付那些无限，那我们就死了。


    唯一的办法，套用庄子的话来说，就是以有涯随有涯，也就是说以有限对有限。我们当然是有限的，那我们怎么在无限的复杂性中，去刻画出有限的简单性来，而这些有限的简单性是我们能够对付的。从无限中刻划出有限，与自己的有限相匹配。这样才有点机会。


    ### 配对交易


    有点太抽象了。


    我具体讲件事，怎么从市场上挣钱。


    从市场上挣钱，谈何容易！都说股市里是：七亏二平一赚，那还是普通年景，熊市就更不必说了。往大里说，股指向何处去？何时是拐点？庄在何处？顶在何处？谁真的知道？往小里说，一家上市公司兴起衰亡之机，谁真能掌握？


    答案比问题简单，才叫好答案。上面这些问题的答案，都比问题本身更复杂。就算你穷尽了所有相关信息，答案并不会因此浮现，它还是藏在所有信息无穷无尽的相互作用之中，最终选择以自己的方式涌现出来。至于是什么方式，你没有预判。


    绝大多数人应该做的理性选择是跟随，放弃择时和择股。择时就是选择时机低买高卖，择股就是选择自己看好的股票。


    择时和择股都是自以为知道。但绝大多数人不会知道一家企业的兴衰会是什么样，更不知道它的兴衰是不是已经充分反映到股价里了，所以他们不应该选股，而应该买股票投资整个市场；他们不会知道价格现在是高还是低，所以他们也不该有低买高卖的企图，也就是放弃择时，而是转而去作为长期投资，最理想的是永远呆在市场里面。市场好他们也好，市场不好他们也不好。


    ### 锯箭法


    每次谈起对冲，我就会想起一个词，锯箭法。这个词来自李宗吾《厚黑学》：有人中了箭，请外科医生治疗，医生将箭杆锯下就了事。这个人问医生为什么不把箭头取出？他说：那是内科的事，你去看内科好了。


    说起来是个笑话，但你想想，医生许多时候就是这样看病是对不对？听过好多次医生对我说对症治疗，最后终于忍不住问对症治疗什么意思。一位好心医生告诉我，就是对症状况治疗的意思，针对症状用药，减轻症状。至于造成症状的内因，要么是不知道，要么是即使知道也没什么好办法。


    对症治疗岂不就是锯箭法？锯箭法治标不治本，把露在外面看得见能下手的箭杆锯掉，里面看不见的箭头随他去。表面症状缓解，至于疾病，交给时间和命运。


    # —— 本讲小结 ——


    总结一下，这一讲，我给你介绍了一种思维方式，锯箭法；也给你介绍了一种锯箭法的应用，对冲。管不了的我们可以选择不管，聚焦在我能管的那一部分。这个方法能帮你缓解眼前的困境，只要你别忘了问题还在就行。


    这一讲的灵感来自塞巴斯蒂安·马拉比


    这一讲的灵感来自塞巴斯蒂安·马拉比（Sebastian Mallaby）的书《富可敌国：对冲基金与新精英的崛起》（More Money Than God:
    Hedge Funds and the Making of a New Elite）。这本书是关于对冲基金最好的一部全景式介绍，想要进一步了解可以找来读。


    # ——♦ 思考题 ♦——


    我给你留一个思考题：


    极早期投资有一种做法叫作投赛道，就是一个新兴领域普遍撒下去，其实不怎么看每个投资的具体情况，这是不是锯箭法？它对冲掉了什么风险？它选择聚焦的风险是什么？


    欢迎你在留言区留言，跟我交流。


    下一讲，我们来讲逆向思考的正确做法。下一讲见。


    ### 划重点

    1.对冲本质上是规避掉你不了解的风险，留下你更有把握的风险。

    2.具备多元视角的同时，你还要能集中聚焦到手头最重要的事情上。

    3.如果选择了锯箭法，永远不要忘了里面还有个你不了解的箭头。

