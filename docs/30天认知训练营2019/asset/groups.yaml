    # 发刊词 | 直面现实，认知升级


    30天认知训练营·2019


    你好，我是王烁。


    欢迎你来到我的课程《30天认知训练营·2019》。


    得到App里的课程，绝大多数就是某个领域的某个话题，不过现实既不认识领域，也不可领域之间的边界，它是一系列真实处境，逼迫处境中的我们面对困 izvē问题，不管它来自哪里。


    还好我们是知识的游牧民族，不必固守哪个领域，兵来将挡水来土掩，每一个当下都坦然面对。在2019年春节这个时间点上的这个认知训练营，我与你一起直面现实，寻找解法。


    直面现实必然不轻松。在录制这30讲课程的时候，同事时不时感叹：真丧啊。我告诉她：现实就是现实，本身不存在丧与不丧，但直面现实绝对不是丧。洞察现实的真相，想办法与它周旋，不放过逆天改命的一丝机会，这需要很多勇气、不少智慧，以及一点慈悲。


    进入这30讲，你会面对这些问题：


    +   如果一代人整体输在了起跑线，不是比喻而是现实，你怎么办？

    如果命运稳稳地与你作对，你怎么办？又或者，如果命运的轮盘赌终于变得不那么稳定，你怎么办？

    你当然知道解决问题应该治本而不是治标，但如果能做的事情只是治标，你怎么办？

    如果比你水平高、比你懂得多、比你能力强的人，没有理由会失败的人，也几乎注定失败，你怎么办？

    你当然知道运气不公平，但如果它比你想象的还要不公平得多，你怎么办？

    如果你觉得世人皆醉你独醒，你只能与大家逆向而行，那么，你怎样才能在人流中逆行却活得下来、活得好、活得长？

    如果你终于发现，你原以为比你傻的人结果比你聪明，原以为比你聪明的人其实比你傻，你首先要自检什么？

    如果好人无几，小人很多，伪君子更多，你怎么办？

    如果最亲密的关系却最终不起拨弄，你本以为比黄金更坚固的感情实际上比玻璃更脆弱，你怎么办？

    如果三观不合是因为一半早已天注定，你还能怎么办？

    如果提意见并不能解决问题，你为什么还要提意见？怎样正确地提意见？

    我们都得在反馈中学习，但如果指引我们在学习中前进的反馈机制，最终会将我们一路带进陷阱，怎么办？

    你可能有无穷的抱负，但你的能力必然是有限的。要把无穷的抱负与有限的能力协调起来，你该怎么办？

    等等等等。


    重要的问题都是难题，最重要的问题没有正解。丘吉尔说，最糟糕的是给人一个马上就会被灭的希望。我也没有正解，但为你提供了能够帮助自己寻找答案的线索，还为你推荐了合理的打法。


    现实是个王八蛋，这一次，我来跟你讲怎么跟它好好打一场。


    提前祝你过一个充实的春节，它正是系统充电重启的时机。如果你决定在未来30天里跟我一起省视过往，正视现实，寻找对你有用有效的打法。


    恭喜你，你就是那种特殊材料做成的人！


    欢迎你加入！


