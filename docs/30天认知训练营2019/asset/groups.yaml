    # 23 逆向思维：逆行者必备清单


    23 逆向思维：逆行者必备清单.. ↓


    你好，我是王烨。


    这一课讲逆向思考。学习逆向思考，最好的学习对象是那些做空的人。


    所谓做空（short），跟做多(long)正好相反。做多是低买高卖，赚上涨的差价。做空是高卖低买。做空者是先借股票卖出，等股价下跌后再买回还掉，赚下跌的差价。


    做空不是我们在上一讲“锯箭法”里提到的配对交易。配对交易的本质是对冲风险。过滤掉不想要的风险，只拥抱自己看得准的风险。比如做多通用同时做空福特，就是配对交易，过滤掉宏观风险、行业风险，只留下这两家企业哪家管理更好的风险。


    # 做空是条荆棘路


    真正的做空者，不是做多做空两条腿走路，而是只有做空一条腿，就要用这条腿来挣钱的人。他们必然是真正的逆向投资者（contrarian investor）。别人热情洋溢买上去，他们一盆冷水泼下来。


    做空要付出的代价是风险没有上限。做多的最大收益不封顶，最大损失是本金。做空则反过来，股价最低也就是到0，最大收益是卖掉时的价格，最大损失则不封顶，赌错方向很惨。倾家荡产的人当中，做空失败被轧空的人比较多。


    所以，偶尔做空的人多，专门做空的人少，而专门做空又长期不衰的人则少之又少，其中最负盛名的是查诺斯（Jim Chanos），他创立的 Kynikos Associates基金公司一直专注做空。


    Kynikos是希腊语单词，对应的英语单词是Cynic，词源出自古希腊犬儒学派，他们愤世嫉俗，怀疑世俗价值。你可以想象能用Cynic给自己基金起名的是个什么人。别人寻找价值，他专门寻找负价值。


    愤世嫉俗的人很多，绝大多数止于此，用愤世嫉俗来持续挣钱的人，就是查诺斯了。他在世纪之交做空安然（Enron）一战成名，安然这家当时美国最耀眼的上市公司轰然倒地。以后十来年时间，市场从牛市到熊市，再到回到牛市，查诺斯始终屹立不倒，英国《金融时报》（FT）称他是当今世上最成功的做空者。


    查诺斯出身学院派，近年重回母校耶鲁大学开课讲怎么识别金融作弊，这是做空者的必修技能。我曾听过一节。当时的耶鲁大学校长列文（Rick Levin）事先开玩笑问他一句：你教的是怎么发现而不是怎么作弊对吧？


    做空是条荆棘路。竞技场对做空者来说是不公平的。股市从长期看是持续向上的，专注做空等于抱石头上山，不是完全不可能，就是十分劳累，比推石头下山的人累得多。


    做空者也从不受欢迎。推石头下山的人，都不喜欢推石头上山的人，一是觉得他们傻，二是觉得他们讨厌，制造麻烦。牛市时市场还能容忍，熊市时简直就是要打要杀。


    你看交易什么时候要585修改规则，那一定不是为了加大做多的难度，而是为了加大做空的难度。再急急了，直接禁止你做空。这种事就连美国市场在2008年的时候都做过，别的地方更不用说。


    做空者绝大多数时候都处于逆境之中，查诺斯长期做空，始终幸存，需要两重智慧：既要坚持逆向思考，还要能活下来。


    # 查诺斯如何找准做空对象


    逆向思考要先找准对象。


    找准对象的依据不能仅看价格是不是过高。不是说“价格高的时候，你觉得会跌”这就是逆向思考。查诺斯绝不仅仅因为觉得一家公司股价过高就做空。股价高有很多原因，不管是因为什么原因看好，看好的人继续看好的时间，完全可能超过你做空能坚持的时间。做空必须是公司基本面出了大问题，经营出了大漏洞。


    他筛选目标有几个范畴：


    第一，在好日子里杠杆加得太猛的。周期永恒，有繁荣就有衰退，而周期总是与杠杆伸缩密切相关。在好日子里杠杆加得太猛的，在坏日子里会被杠杆所伤，变成猎物。欠钱太多总是要还的。


    第二，被新技术碾压的上一轮赢家。互联网是财富制造机，但查诺斯不是去关注它在哪里制造财富，而是去关注它会消灭哪些财富：哪些商业模式会过时？哪些垄断会被填平？对于熊彼特说的毁灭式创造，查诺斯专注撞毁毁灭那部分。


    第三，一招鲜公司。无论什么时候，总是有拿出一件产品，迅速引爆市场，使所有人为之激动。人在激动的时候就线性外推：如果产品照这个势头占据全市场，如果能持续推出同样的爆款产品，等等。现实通常与线性假设相反。一招鲜公司很多，流行一变就凉了。想想游戏公司。


    第四，增长来自收购的平台型公司。如果增长不是内生而是来自于外部收购，查诺斯会倍加注意。这是块特别厚可反复开垦的领地。美国资本市场上市过一二十年重新流行一次收购增长的主旋律。中国股市它也不陌生，还记得前两年创业板的收购驱动型泡沫吗？


    收购主题曲总会伴随着“财技”这个关键词。增长很难，你得一切都做对，收购则只要有钱就行。太容易的事大家都做，出价就会变得太高。出价高又要买来的增长显得物有所值，羊毛总要出在什么地方，最后往往落在财务报表上作手脚。


    这就是财技的两面：收购时的融资安排，还有收购以后的财务马杀鸡。什么时候你听到这个词大家都在说，就要特别小心了。查诺斯最喜欢看到有公司提拔会计做CEO，这就是新目标。


    # 如何对待逆境


    发现目标采用逆向思维就行，而针对行动采取执行，则首先考虑的是能够活下来。


    查诺斯认为不要指望时机恰到好处。首先是这本身就很难，至少不可能稳定地反复精准捉到点；其次是时机真的恰到好处时，那也意味着所有人都看到了机会，借股票的利息必然飙升，做空反而划不来。现实中的做空总是看起来偏早。你不要想着怎么校准时机，而是要想着怎么在行动偏早的情况下还能活下来。


    正因如此，做空者是真正的阿尔法交易者，就是凭本事掏交易对手的钱而不是随大流掏市场的钱。时间不在做空者一边。借股票要付利息，时间意味着成本，做空花的時間越长成本越高；空间也不在做空者一边。股市长期而言向上，做空者总的说来是逆势而为。既要择时，又要择股，做空必须经过得起更严格的智识检测，且容错率更低。'
