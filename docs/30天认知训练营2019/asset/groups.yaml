    # 11 规则：创新必须讲政治


    你好，我是王烁。


    这一讲我想给你讲，政治很重要，就连创新都得要先过政治学这一关。


    # 政治无处不在


    政治是什么，政治学家有他们的解释，我给一个广义解释：


    政治是与法治相对而言的。所谓法治，就是追求一切由规则决定；所谓政治，就是追求一切由力量对比决定。


    没有纯粹的政治，因为自从智人从森林里走出来以后，打架就得在自己发明的各种规则之中打；当然也没有纯粹的法治，因为你我都知道，规则之所以存在，就是用来打破的。


    在法治的理想里，政治不该有一席之地；政治的世界却是可以部分兼容法治，法治是政治的工具，合适就拿过来用，不合适就放在一边，变成阻碍就打破它。规则只能约束实力，实力却能制造规则。世界就这么现实。


    # 如何获得同行的认可


    人毕竟不是机器，一个算法搞定，跟人有关的事绕不开人际动力学。你不理它，它会理你，只能去拥抱它，问题是怎么拥抱它？'
  - '[PAGE 21]


    你，其次看不惯那些次保守派；


    最后会变成双峰偏好，就是最保守的固然看不惯你，但更看不惯那些反对你的程度没他那么激烈的次保守派。


    面对新势力，旧联盟陷入内争，把内部的细小分歧看得比天还大：敌人可恨，叛徒更可恨，而跟我不一样的都是叛徒。


    恭喜你，你就要赢了。


    # ——◇ 本讲小结 ◇——


    总结一下，这一讲我们讲广义的创新政治学。


    哪怕是你想搞变革，搞创新，都必须讲政治。创新要想被采纳，核心是搞定同行，从政治的视角，我给了你五点建议。如果你有正在致力于创新的朋友，你也可以把这一讲分享给他。


    这一讲的灵感来自于《心流》的作者契克森米哈利，《创造力：心流与创新心理学》。


    # ——◇ 思考题 ◇——


    我给你留一个思考题：


    颠覆一个行业或者领域，第一个去颠覆的人往往会失败，而第二个去做的人，成功率会高很多，为什么？


    欢迎你在文稿下方的留言区写出你的想法。


    下一讲，我给你讲，完全由政治决定的场景下，也就是生活中绝大多数的场景下，我们应该怎么办，有一个万能打法。下一讲见。


    # 划重点


    如何让创新落地？ 1.积累实力，等待时机； 2.如果时机难以辨别，就先拖着； 3.把伟大的雄心，拆解成一个个不引人注意的小目标； 4.少传教，多做事； 5.按创新动力学的逻辑，争取同行的支持。'
