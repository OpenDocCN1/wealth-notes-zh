    # 07 运气：比你想象得还不公平


    30天认知训练营·2019


    07 运气：比你想象得还不...


    你好，我是王烁。


    这一讲，我想给你讲讲运气，这件看起来捉摸不定的事。


    常识告诉你，成功取决于你的智力、努力，还有运气等等，天时、地利、人和缺一不可。常识也告诉你，智力、努力在于自己，而运气不在于自己，所以只能是穷尽人事，然后坦然面对天命。这些都是对的。


    但常识没有告诉你，最后站在成功之巅的人，并不是你想象中的那一种。你以为他们用智力碾压你，比你还努力，运气又好到爆。


    如果真是那样，倒也无话可说。


    但不是。他们的智力不能碾压你，他们不见得比你更努力，他们只是运气好到爆而已。


    # “才能对运气”的极简实验


    一群意大利物理学家和经济学家组了一个跨界团队，做了个极简实验，就叫作“才能对运气（Talent VS Luck）”。之所以说是极简，是因为他们把成功之道简化成二元方程，成功=才能+运气，其它因素分别划归到这两项下面。


    在这个模型里，运气是随机降临的。当然，运气本身就是随机的，只不过真实生活రియ，被我们叫作运气的许多东西其实不是随机的，这个一会儿再讲。记住他们这里用的是狭义的运气，实验环境比现实还公平就好。


    在模型里，才能的分布是钟形的。什么是钟形分布呢？钟形曲线的顶点在平均值，然后朝两端数值下降。绝大多数人的才能都在接近平均值的两边。2/3人的才能在距离平均值一个标准差的地方。这不是假设而是事实，现实中，人们的才能就是接近钟形分布的。


    ![](img/779997aa970e533f25d2fc2d33072952_12_0.png)


    你记住这俩数字，普通人占2/3，天才差不多千分之一。


    运气、才能在模型中是这样相互作用的：好运气到来则收入增加，坏运气到来则收入减少。不过，好运气发生在不同才能的人身上效果不同，才能高的人遇到好运，收入增加得多，才能低的人收入增加得少。这也跟现实生活一致：运气来了，你还有能力抓住，才能高的人运用得更充分，白痴运气再好也没用。


    # 现实比实验更不公平


    在现实中你确实偶尔会看到天才站到了塔尖，那也不是上面这些说错了，而是你一定要想到这是件多么罕见的事，相应地要意识到，得有多少大基数的天才被埋没。


    # 你应该如何看待运气


    明白运气比我们想象得重要，对你有什么用？


    —— 本讲小结 ——

    总结一下，这一讲我给你讲了运气。

    你原来知道它重要，但你肯定不知道它这么重要。所以，如果你是分配者，你可以采取平均分配的策略，以应对运气的随机分布。同时，你值得明白，成功者往往真的是运气好。


    > 这些内容来自一个跨界科学家团队对运气的研究，他们写的英文论文标题就叫天才对运气（Talent vs Luck: the role of randomness
    in success and failure, by A. Pluchino, A. E. Biondo, A. Rapisarda），如果你还想了解得更细，我把链接放在下方，你可以自己去深究。'
