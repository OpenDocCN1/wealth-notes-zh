    # 第六，广义的天赋仍然存在。


    前面我们说了，没有狭义的音乐天赋，没有音乐演奏的基因也没有打五笔字型的基因，人类的复杂技能都不存在对应的特定基因。复杂技能大都出现在人类定居以后，到现在也就一万年时间，进化来不及。


    但是，没有特定技能的基因，不意味着天赋这件事不存在。


    以音乐演奏为例，它借用了感知、语言、记忆、声音这些功能所涉及的大脑回路，后者间接对应着特定的基因组合，它们间接影响着你学习音乐演奏的能力。


    马克思终于发现自己为什么一直缺少音乐才能。他从小就不玩秋千，也不喜欢睡摇篮，晕车，更晕过山车，因为他的耳前庭系统有问题，而耳前庭与节奏感知密切相关。马克思节奏感不行。没有节奏感的人，音乐演奏非常困难，但就算是这样，他也不能和小朋友一起同台演出吗？


    人与人确实不同，但不是我们以为的那样简单的不同。有天赋使一些人能够更快地掌握音乐，缺少天赋使另外一些人如马克思走到同样的地方需要付出更多努力，但马克思还是走到了这个地方。


