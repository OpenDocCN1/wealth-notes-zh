    # 17 提问：问得太少你吃亏


    17 提问：问得太少你吃亏


    你好，我是王烁。


    今天这一讲，讲提问。这世界竞争这么激烈，明显可以捡到的便宜已经很少很少，但其实提问就是一个。反过来説，问得太少你就吃亏了。


    好在不让你吃亏，绝大多数人都吃亏，大家都问得太少。问得太少有许多原因：


    +   ——有的是太过自我，太想用自己的想法、故事、思路去説服对方；

    ——有的是太想用问题给对方和旁观者留下深刻印象，但这世界上哪里有那么多容易提的高级问题，想太多，于是就问得太少了；

    ——有的是太过小心，害怕自己的问题太过粗鲁或者太过敏感，其实你又想多了，对于被问的人来说，只有极少数问题对他是粗鲁的敏感的，如果提问是在私下，那就更少了；

    ——有的是太过自信，以为自己已经知道答案，不用问了。


    # 提问的好处


    最关键的原因则是，一般人不知道提问的好处非常大。


    提问有很多好处，学习，交换信息，带来创新，增加了解，促进信任。归根结底是两件事：第一是获得信息，第二是使对方喜欢你。


    今天这一课用不着讲获得信息这一面，好处太明显，有事你不问别人难道问自己吗？我讲提问使对方喜欢你这一面。


    怎么通过提问让别人喜欢你？


    现代第一个成功学大师卡内基在《人性的弱点》（How to Win Friends and Influence People）当中给了个答案：“问别人喜欢回答的问题。”卡内基説对但不完整。任何时候想太多，先提问，别人大概率都会比你提问前多喜欢你一点。


    原因很简单。


    第一，假如其他条件不变，一个人在说话时会比不说话的时候开心一点。


    # 提问的种类


    提问大体上有四种：


    +   1. 介绍式提问：你好吗？

    2. 镜像式提问：我很好，你呢？

    3. 转向式提问：用来开启话题转换话题时用。你怎么看贸易战？

    4. 跟进式问题：就是追问。


    # 如何提问


    # 被提问者，如何应对提问


    最后换位思考，假设你是被问一方，在竞争性/对抗性场合，特别是公开场合，遇到你不能回答的问题怎么办？'
