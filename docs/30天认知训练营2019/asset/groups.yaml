    # 04 人性：人从什么时候变坏


    30天认知训练营·2019


    04 人性：人从什么时候变坏


    你好，我是王朔。


    今天我们探讨的问题是，人性本善还是恶？


    # 性善论与性恶论


    认为性本善的人认为，以前有个黄金时代，距今大约一万年，男子狩猎，女子采集，群体分工、协作、分享，人人营养平衡，身心健康。那个时代没有战争，没有等级，没有财产当然也就没有贫富差别，也没有传染病。


    对那个时代的想象，奠定了一种极有影响力的思维：性本善。最初都是好人，只是后来变坏了。


    怎么变坏的呢？


    发明了农业。农业意味着定居，意味着阶层，意味着收获，意味着余粮，意味着分 models配，意味着得武装起来防止别人来抢夺余粮。无尽冲突从此开启：阶级分化了，财产产生了，战争来到了。连营养都变差了，绝大多数人忙于在田间劳作，却只能果腹而已。人类从此失去了乐园。


