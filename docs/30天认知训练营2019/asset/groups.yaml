    # 28 自由：如何作一生就一次的选择


    你好，我是王烁。


    这一讲，讲怎么做人生选择，这么复杂的事，必须只能用最简单的框架来解释。

    我的解释只需要两个按钮。


    # 不要一次只做一件事


    第一类问题，你的人生里会有许多大事。你也许认为正确的做法是这样的：每件大事都全心全意全力以赴，做完一件，再做一件。

    其实，这样做大多数时候是错的。


    我拿出说好的两个按钮，按其中一个结果是翻番，按另一个是亏损一半，但你不知道哪个是哪个。你应该怎样才能保证获得正收益？


    如果先按一个再按下一个，全力以赴做完一个再做另一个，你将始终回到原点：先涨一倍再亏一半，回到原点；先亏一半再涨一倍，也是回到原点。假设你两个按钮同时按，则一个翻番一个减半，加起来除以2，你能获得25%的正收益。


    同样两件事，用串联来做还是用并联来做就会造成这么大的差异。它告诉你一个道理，同时间不要只做一件事，要做一个事件的组合。这就是最基本的多元化策略。在绝大多数时候，它减少你的风险，还增加收益，就是这么神奇。


    # 追求稳定，还是冒险


    第二类问题，面临各种人生大事时，你选择稳定还是冒险？


    还是用两个按钮。按一个每次按一次挣100万；按另一个每次挣1亿或者全部亏光各有一半可能，亏光就游戏结束。选定按钮就必须一直玩下去，不能停止、无法反悔。你按哪个？


    作为一道题，你应该按第一个按钮。第一个按钮好比上班打卡，第二个好比孤身创业。创业的人那么多，但你也想创业的话，应该想想那些选择创业的人，其条件跟上面有什么不同，你能不能做得到。


    # 面对人生只有一次的选择


    第三类问题，面临一生只有一次的选择时，你怎么做？


    世上没有两片完全相同的叶子，人不能两次踏入同一条河流，但这里所说的一生一次不是这种形而上学意义上的独特。人生中的大多数决定是可以重复的，或者近似地可以重复。人生百年，许多事周而复始如轮转，或者至少能用可重复的眼光来看待他们。所以把眼光放长，不执着于一时一地一事，指的就是这些。


    但反过来，越重要的事件越不怎么重复，最重要的事情往往不可重复。一生只有一次的选择，我们每个人最终会遇到，应该怎么做？


    依然是刚才这两个按钮，但现在只能按一次，而且再没有其他别的什么按钮等着你了，这基本上只有这两个按钮。按第一个给你100万，按第二个可能给你1亿可能什么也没有，一半一半。你选哪个？


    这个问题没有标准答案。钱对每个人的用途不同，100万对普通人很重要，但是是对王健林来说，1亿也只是个小目标。哪怕是对同一个人来说，1亿的价值也不是100万的100倍，它的值不是线性增加的。


    # —— 本讲小结 ——


    总结一下，这一讲讲了两层。

    第一层，人生选择表面上不是做题，实际上很多时候就是做概率题，懂概率能帮你做到正确决定；

    第二层，那种只发生一次的最重要的人生选择，看上去很像概率题，其实却不是。你只能做自己，而只要忠实于自己，就怎么都不会做错。'
