    # 13 关系：不可不铁，不可太铁


    13 关系：不可不铁，不可太... ↓


    你好，我是王烁。


    这一讲我们来看看看怎么搭关系网。


    人生而自由，却无不在关系之中。每个人都有三样资本：人力、财务、关系。假设人力和财务资本相同，谁就会搞关系谁获利大。关系网是人生重要资本，有时是最重要资本，对此我们中国人都心领神会，抨竟用拼音写的
    guan xi 这个词，都进入英语词汇表了。


    真正会搞关系的人是人生赢家。他知道哪里有好机会，有好机会都能抢上一手，好机会离了他还真不行。


    你知道怎么搭关系吗？


    ## 帝王关系术


    我给你讲讲帝王是怎么搞关系网的。


    大臣无私交，是历代帝王最重要的一条政治规矩。大臣之间不能私下往来，不能随随便门，更不能互通信息，互相勾结就更不用说了，最好连历史交情都没有。


    ## 冗余关系网


    说到这里，请你先反思一下自己的关系网。如果你的关系网凝聚力极强，所有朋友都认识所有另外的朋友，如果你的关系网同构性极强，你通过所有人接入的都是同一个关系网，那么你麻烦了。


    ## 结构洞，从关系网中套利


    既没凝聚力又不同构的情况，社会学中叫做结构洞（structural holes）。之所以叫做洞，是因为关系网延展到这里好像是撞进了洞里，大臣无私交，无私交就产生了洞。


    网。不必过好谁，有用就行了，做桥最有用。


    ## 第三，同质关系收益递减。


    你不需要认识每个校友每个同事每个同行，每个群体熟悉几个节点就够了。如果只从效率考虑，每个群体熟悉一个关键人，掌握一个关键节点，就够了，但如果真这样的话，那么这座桥同时掌握在你和他手中，你依赖他才能跨越结构洞，正如他也是依赖你才能跨越结构洞。你们彼此套牢。你解套的办法是至少要在他之外多布一个点。林彪指挥百万大军，但时常越过指挥系统，直接指挥到连队，其实领导都需要这样。


    ## 第四，你的关系网跨越越多的群体，有越多的结构洞，你就越自由。


    自由不是自己一个人想做什么做什么，而是与他人有独特丰富的的关系，关系越独特丰富，你就越自由。不想搞艺术的科学家不是好商人，混搭，随时出入于多个群体而不为任何一个群体所限的人，是人能获得的最大自由。


    说完这些，还得对你有个重要提醒。凡事不要做绝，你按结构洞搭关系网也不要做绝。人人都有亲人、朋友，这些人生中的核心关系当然有用处，但他们不是拿来用的，他们是我们的身心滋养，是我们安全感的最终来源。许多成功者说成功是与自己最重视的人，有丰富饱满凝聚力极强的关系，我相信他们说的是真话。


    ## 维也纳小组


    这里说的还只是情感，即使在情感之外，就谈理性计算，要将含有多结构洞的关系网的能量发挥到极致，一个人远远不如一个团队，成员相互信任，凝聚力强，各有特长。人类的多数创新来自于拥有这些特点的小圈子。


    2000多年前的雅典学院将古希腊思想发扬光大、100年前的维也纳小组重塑20世纪思想史、30年前的中国社科院体改所群英开校散叶，成为中国经济改革的中坚力量，都属于这一类。


    我讲讲维也纳小组的故事。第一次世界大战后，以维也纳为中心聚集了一群知识精英，重塑了20世纪西方科学和哲学思想，分析哲学、当代科学哲学都从这里发源。


    维也纳小组的构成符合典型的结构洞理论，其成员有维特根斯坦、波普尔、哥德尔、卡尔纳普、石里克，来自物理学、数学、逻辑学、哲学的不同圈子。作为一个整体，小组跨越了许多结构洞，打通多个学科，新思维相互启发。


    维也纳小组也超越了典型的结构洞理论，所有成员都认识所有成员，定期交流，彼此激发，凝聚力极强，致力于在相对论和量子力学兴起的时代为科学寻找可靠基础，成为20世纪分析哲学和科学哲学的正源。


    其实，我也在维也纳小组关系网之中。我的导师的导师是洪谦先生，他的导师石里克是维也纳小组领袖，洪谦先生本人也是小组一员，我算是小组的三传或者四传弟子吧。


    帝王学将结构洞做到绝就够了，伟大的事业则往往来自高水平、彼此充分信任、背景多元化的亲密小圈子，这就要求有克制地部署结构洞。


    跨越再多的结构洞，到最后我们还是要与同道中人在一起，相互激励，彼此慰藉，才能迸发出整体最大能量，有所创造。要是失去分寸，学关系帝王术学到一丝不苟，即或成功，大家都被你一网打尽，但你也不过变成孤家寡人。


    # —— 本讲小结 ——


    总结一下，这一讲告诉你：


    搭关系，不要想别人对你有什么用，要想你对别人有什么用，而你对别人的用处大小，不在你本身，而在于你在关系网结构中的位置。要站在跨越最多结构洞的网中。同时你也要记住，这件事也不要做绝。


    这一讲受到卡尔·西格蒙德（Karl Sigmund）的书《疯狂年代的精确思考》（Exact Thinking in Demented Times）的启发，出身维也纳学术圈的当代学者写维也纳小组的故事。刚才讲过我算是维也纳小组的多传不肖弟子，举贤不避亲，把这本书推荐给你，体会一下现实中结构洞关系学的最优用法。


