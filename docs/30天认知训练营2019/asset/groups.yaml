    \n不论你在前面的四象限里处于什么位置，只有了解自然状态下的人真正是什么样的，才懂得化性起伪这件事有多么重要，才理解一层层的社会构造如果解体，我们可能会回归到什么极限状态，才明白维护合作秩序及其扩展这件事有多么难，而维持它又是多么重要。\n\
    \n人之异于禽兽，即在于此。\n\n# —— ◆ 本讲小结 ◆ ——\n\n总结一下，人类学家向我们展示了人在纯净的原始状态下是什么样子。我们面临的问题回到过去是解决不了的，只能往前走。人之异于禽兽者几希，但就这一点点是最贵的。\n\
