    # 14 怎样避免集体无行动


    今天我们认知训练讨论的问题是：为什么应该把组织做小。


    这其实是已经有结论了的，但为什么组织应该被做小呢？因为集体没有行动。


    人类社会最大一个迷，就是少数永远战胜多数。无论是政治、社会、军事、文化、金融，都是这个结果。


    # 以少胜多的温泉关之战


    公元前479年，那个时代的第一次世界大战，希腊各城邦面对来犯的波斯大军。统一东方的大王之王薛西斯，要把西方也管起来，派出数十万大军。


    希腊有多少人呢？雅典是最大的城邦，也就能出三四千重装盾甲兵。希腊人全部加起来，也就是万把人作战。结果输的是波斯人。


    波斯第一次入侵希腊，斯巴达国王带300人在温泉关抵御波斯大军，全部阵亡。300人挡几十万人，没挡住不奇怪，奇怪的是竟然挡了好久。这事如何操作？


    人少好组织。


    # 集体行动的“零贡献难题”


    集体行动之难，横跨政治学与经济学。诺贝尔经济学奖得主奥尔森（Mancur Olson）说过：


    > “一个集体，要么成员很少，要么能 brainstorm 成员，要么有其他特殊安排，才能使其成员采取符合集体利益的行为。否则，以自身利益为重的理性成员不会采取对集体有利的行为。”


    # 走出“集体无行动”


    奥尔森的书出版于50年前，今天我们懂得更多。他所说的，与囚徒困境、搭便车、公地悲剧等概念彼此关联，描述同一类现象：'
