    # 08共识：不要追求合三观


    30天认知训练营·2019


    08共识：不要追求合三观


    你好，我是王烁。


    这一讲，我们聊三观。


    我特意查了一下，三观是世界观、价值观、人生观，其实都是一观：你我该如何做人。


    关于三观，你肯定已经听说过，世界上最遥远的距离就是三观不合；同时，你肯定也已经看到了，世界上大多数悲剧，就是因为人们一定要合三观所导致的。


    # 三观形成的三个步骤


    在《正义之心》(The Righteous Mind)这本书中，顶尖道德心理学家海德(Jonathan Haidt)描绘了三观形成之路：


    第一步，基因打好初稿。


    # 左派和右派是如何形成的


    你见过成人改三观的吗？这种人不是完全没有，我就见过一个，可是我见过的人有千千万呢。


    # 三观不同的人，如何共处


    所以，回到主题，不要强合三观，它是先天后天特反复缠绕而成的意抄牢结(ideology)，强合三观必然引发血案，要么是你悲剧，要么是别人悲剧，要么是大家一起悲剧。


    总结一下，这一讲，我给你讲了三观有很强的先天成因。'
