    么也改变不了，但是校友就有机会改变点什么。任何一所大学都有庞大数量的校友，表面上是个潜在集体，但它同时天然是个联邦结构的集体，任何学校的校友都按系按届、每届都是按班来组织的。哪个班级不是小集体？小集体就能爆发出行动力。


    事实也正是如此，大家都看见了校友的力量。


    有一点请注意，大集体分解为小解体的关键是平行的联邦制，不是上下的科层制。波斯人并不缺少科层制。


    # 把组织“做小”


    今天我们的故事从希腊人跟波斯人打仗开始，那就让它在另一个战争故事中结束。


    美国特种部队训练充分，装备精良，天上有无人机，地下有装甲悍马。这支部队按说足以碾压一切看得见的敌人，可是，为什么它却打不赢伊拉克基地组织（AQI）？


    AQI人数不多，训练不足，装备平平，通讯靠信使，可是迅速崛起为伊拉克最致命的一支力量，日后还滋生出伊斯兰国。


    AQI靠的是经得起各种打击的网状结构，既没有标准打法也没有标准层级。打掉AQI一个高级头目，它自己会再长出一个 来。美军这些年打掉的伊拉克基地组织“二号人物”大概有20来个之多，可是没什么用。


    一天醒来，美军特种作战司令看着一堆等着他签字的命令，悟了。自己就是问题：条线太长，动作成本太高，决策太缓慢。


    司令重组了特种作战结构，信息流不再自下而上再自上而下，每个作战小分队灵活调配资源，相 机决策。他不再签那么多命令，垂拱而治，精力放在确保信息流通畅。


    结果，一个小分队自己找到并干掉了AQI头号首领扎卡维。这个故事来自美军特种作战司令麦克雷斯托写的书《团队的团队》（Team of Teams: New Rules
    of Engagement for a Complex World）。


    大集体永远干不过小集体。大集体能做的是把自己变成小集体，小集体自治再组合起来，才能发挥出自己的其他优势，干掉对手。


    # ——◆ 本讲小结 ◆——


    总结一下，今天我们讲的认知是，少数战胜多数是常态。所以你要把组织做小，因为只有小集团才能够统一利益，灵活组织应对问题。


