    # 30 自在：如何设计人生大战略


    你好，我是王烁。


    这一讲，跟你讲人生的大战略（The Grand Strategy）。


    ## 国家大战略


    大战略这个词来源于国际政治学术语，指最高层次的战略。《牛津字典》上说，它是最高层次的治国术，领袖应该如何运用军事、外交、政治、经济和其他力量来确保他所认为的国家利益。


    我两年前参加耶鲁“世界学人”项目时，上了教授级学者加迪斯（John Lewis Gaddis）的《大战略》课。加迪斯专治冷战研究，这门课开有几十年，已成为耶鲁名课。


    加迪斯领衔，一群顶尖学者和自尼克松、基辛格时代就参与美国对外政策制定的老家伙伙同，面对耶鲁学生，用老家伙点经验年轻人讨论的形式，传授美国过去的大战略，理解现在的大战略，想象未来大战略。


    ## 人生大战略的九点提示


    借用加迪斯的智慧，给你的人生大战略九点提示。


    第一，要敢为天下先。


    第二，瞒着你自己位置越升越高，掌控越来越大的格局，你越要泰然从事。


    第三，在一切必然超出掌握的现实里摸索，你得有个方向，但不要过度准备。


    第四，在路上你要带上清单，而不是地图。


    第五，同样的道理：理论很有用，但你得知道怎么用好它。


    第六，你为未知意外所能做的最好准备，是拥抱自己的前后不一和自相矛盾，把它们变成你的战略优势。


    第七，自相矛盾也可以叫权变，时左时右，时进时退，把这事跟随即乱来分开来的是原则。既要有原则就要通权变，这话说来容易做来难。


    第八，对我们来说，正是因为每天都要在坚持原则与权变之间做取舍，所以分寸感极为重要。


    在目的与手段之间，能不能为达目的不择手段？不择手段会不会使你变成你所憎恨的那种人？这些终极问题没有标准答案。


    人生大战略要将有限的能力与无限的抱负协调起来，协调就意味着两者相互依存，缺了哪个都不行：没有稳定就谈不上正义，没有正义的稳定无价值；没有战争就没有和平，不为了和平的战争无意义，等等等等。为分寸下的最好定义来自马基雅维利，他称之为美德（Virtue）：做不得不做的事，但不为它所驾驭。


    这导出最后一条，也是只有你才能为自己选择的一条。协调有限能力与无限抱负的人生大战略，关键在分寸，每个人都得决定自己的分寸在哪里。


    你的分寸在哪里？加迪斯给我们提了个建议：


    分寸要向自由（freedom）倾斜。在目的与手段之间，在稳定与正义之间，在战争与和平之间，在所有这些与那些之间，分寸要向保护自由倾斜，这里的自由指消极自由，即每个人免受别人干预的那种自由。


    我同意加迪斯。


    ## ——◆ 本讲小结 ◆——


    总结一下，这一讲讲人生大战略，它是将有限能力与无限抱负协调起来的元思维：


    人生未可知，你我怎么管理不确定性？怎么在不确定性之下管理自己？


    计划和理论可以帮助我们一段路，但最后只能靠自己在未知地带摸索；我们无法超越任何一种重要的两难情境，唯一可以选的，是分寸。


    这一讲的灵感来自加迪斯（John Lewis Gaddis）的 新书《论大战略》（On Grand Strategy）。这一讲已经对这本书作了很多介绍，不再重复了。我就说一点，在我2018年所读书中，本书排在第一，强烈推荐给你。它还没有中译本，我建议你按照英文书名，去找来读。


