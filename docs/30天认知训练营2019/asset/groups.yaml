    君子是稳定一致的，他只做好事；小人也是稳定一致的，他只做坏事；伪君子不同，他有时做好事，有时做坏事。


    伪君子何时做好事何时做坏事是有模式的：在涉及利益大小上，他遇小事做好事，遇大事做坏事。在时间先后上，他一直做好事，最后做坏事。小事做君子大事做小人，先做君子后做小人。由于现实中小事多大事少，所以识别伪君子并不容易，等到能识别的时候往往已经太晚了。伪君子暴露真面目总是在最后。


    所以，人们惧恨伪君子，往往超过真小人。小人好防，他是一致的，没有认知挑战，你给他贴个标签，备注上针对他的打法，打得过就打，打不过就躲，然后这组操作模块就可以封存在大脑里，需要时随时激活就行了。


    ## 自我检测：马基雅维利量表


    如果想知道社会是怎么分配这三种人的，可以先从问自己这个问题开始：


    自己是君子、小人，还是伪君子？


    这个问题太难答了。承认自己是小人的稀少，承认自己是伪君子的人就更少。能承认自己是伪君子的简直已经是真君子。


    1. 至善是可能的。

