    # 10解题：宁复杂，别简单


    10 解题：宁复杂，别简单


    你好，我是王烁。


    这一讲我们讨论的话题是：为什么越简单越没有出路。


    有人寻找净土，有人遁入空门，有人想拨转时间回到过去，有人回归经典成为原教旨主义者，有人反身自求，在内心深处寻找自我，有人则弃绝自我，在坚强团结的小集体里找回庇护，等等等等。


    所有这些人有个共同点：面对人生种种难题，他们认为有一个答案，而答案就在于执一而从，一是简单，是纯净，是圆满，也是真、善、美。只要找到属于自己的这个一，然后固执之，践行之，于是外来烦扰内心怯惧统统退散。想得美，没有的事。


    ## 为什么简单无出路


    我讲三个理由。


    第一，滚滚红尘，绝无空门。


    人生的悲剧是稀缺，而稀缺永恒。稀缺对大多数人来说表现为缺钱，但远远不止于此，凡是你珍视的必然稀缺。稀缺伴随着你，到你去的任何地方，都是躲不开的。


    第二，更复杂才是缓解复杂问题的办法。


    为什么我说是缓解，而不是解决呢？因为解决不了。面对稀缺，要好比杂耍师玩锅盖盖锅的游戏。锅比锅盖多，要让锅盖看起来仿佛盖住了所有的锅，杂耍师不得不停腾挪，锅盖翻飞，左盖右盖。玩游戏的关键，是锅和锅盖的数量要多才能掩耳目。要是只剩下两口锅一个盖，就是水落石出玩不下去了。越简单就越难办。


    举个现今社会的例子，为什么欠一万块钱是孙子，欠一万亿是爷爷？欠一万亿的锅盖多，多到一定程度，就叫作首富。


    举个自然界的例子。虽然进化往未来看没有方向，但回溯的话我们能看到生物体变得越来越复杂，其原因是要最大限度适应环境。没有谁因为想逃避自己所处维度的难题，就想降维变成阿米巴虫这类单细胞生物。更何况阿米巴虫并不逍遥，它在自己的维度上有自己的难题，难度不会高维生物的小，只是你不是它所以不知道而已。


    稀缺永恒，人生实难，无论身在何处，哪个维度都是几个锅盖盖许多口锅，永远得靠左右腾挪。一味追求简单只是减少了腾挪空间，使游戏更难玩而已。


    第三，越简单就越无法回避悖论。


    ## 简单会走向悖论


    悖论有点像但不是语言游戏。只要存在自指递归（recursive）就有悖论，而自指递归无处不在，正如包含所有集合的也是个集合。


    # ——本讲小结——


    总结一下，给你三个建议：


    第一，宁可复杂，不要简单。


    第二，必须保持开放。


    第三，没有就地面对难题的决心和领悟，到哪里都是被难题追逐的命运。


