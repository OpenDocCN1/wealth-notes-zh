    欢迎你在文稿下方的留言区写出你的想法。


    下一讲，我会跟你探讨一个古老的命题，人性原本到底是善还是恶？我们下一讲见。


    划重点


    - 1. 黄金和比特币是法币的潜在竞争者；

    2. 现代人需要配置一部分外汇；

