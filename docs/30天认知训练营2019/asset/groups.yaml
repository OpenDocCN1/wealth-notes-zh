    个新我，苟日新，日日新。


    这一讲的灵感来自于一本书——《三十六计与围棋》。作者马晓春是我国第一位围棋世界冠军，也是在棋手这群聪明人中被公认为最聪明的那一个。我们这一讲讲了围棋对思考现实的启发，而这本“围棋三十六计”则是棋盘争斗与现实竞争的全面映射，两个方面都是顶级内容。如果你略通围棋及以上，一定要找这本书来看；如果你不通围棋，遗憾，你错过了很多。


