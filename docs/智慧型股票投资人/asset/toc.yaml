- - '###'
  - 2. 你挑選的每一支股票都應該是大型、卓越而財務穩健的企業。這些形容詞可能有些含糊，但其基本意義應該是很明確的。關於這一問題，我們將在本章結尾做進一步的討論。
- - '###'
  - 3. 每一家公司都應有長期持續發放股息的記錄（在 1971 年，道瓊工業指數的成份股全都符合此一條件）。具體而言，我們建議持續發放股息的記錄，至少應該從 1950
    年開始。[7]
- - '###'
  - 4. 投資者應將買進股票的價格限制在一定的本益比之內，而參照的每股盈餘應取過去 7 年的平均數。以這樣的平均盈餘來計算的話，我們認為其本益比應限制在 25
    倍；如果以過去 12 個月的平均盈餘計算，則應限制在 20 倍以內。但是，在這一限制下，幾乎所有最強勢且最熱門的股票都會被排除在我們的投資組合之外。更明確地說，這一限制幾乎會把所有的「成長股」全部排除在外，而這些股票正是過去若干年來投機者與法人投資者的最愛。為說明此事，我們必須說明其理由。
