  但见不得光的精英主义阶层最喜欢玩不透明，在天下大同阶段这个阶层无法生存。


  比如开始探索其他星球和开发；比如你说的所有话、做的所有事，甚至你的任何念头都会被捕捉到，但是对普罗大众不利的政治、经济、宗教等文化或者从业者都会被锁定，会公开。


