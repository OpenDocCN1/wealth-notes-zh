- "## 第二章 性之三修\n\n根据人的特性，可以分为灵性、人性、兽性，其中人性包括先天原始人性和后天驯化人性。\n\n要修就修全乎，别偏科，别缺胳膊少腿。\n\
  \n- **第一：**打压了灵性，那就正向做加法修回来；\n- **第二：**驯化出了新人性，那就正向做减法修掉。最务实的其实是人性的修行，可以获得生存谋略手段，获得物质基础，物质基础才能决定上层建筑；\n\
  - **第三：**打压了兽性，那就正向做加法修回来。\n\n总之，灵性修过了头、人性修过了头、兽性修过了头都不对，都应该经过正向修行正向引导，修行的目的：找回真正的自己。\n\
  \n### 1. 灵修\n\n#### 1.1 找自己\n\n你所有的念头、所有的想法、所有的情绪都不是你，愤怒、紧张不是你、想升官发财不是你、想结婚生子不是你、抑郁焦虑不是你、贪生怕死不是你……\n\
  \n都是社会保障体系的环节设计，都是被环境驯化后的你，都是假的。\n\n##### 1.1.1 灵性、人性、兽性\n\n要意识到自己有神性、人性、兽性，且三性平等。\n\
  \n动物属性和自我神识属性一个简单到极致，一个智慧到极致，都不会产生焦虑和精神内耗。\n\n其中恰巧是新驯化出的人属性那部分最束缚人，也是你精神内耗的根源，最没人性的也是人。\n\
  \n##### 1.1.2 我相和人相\n\n要意识到你认为的我不是真我，是社会稳定有序设计好的我；\n\n要意识到你本不是人，人是被驯化而来，为了社会稳定有序你被驯化成了人。\n\
  \n- **第一：**大部分人成为了一只自己不知道自己是狗的狗，他认为自己是人，真我是个人内心生出的认知，是对自己的绝对认同，是形成神圣内核的心力，能一眼看穿事物本质。\n\
  - **第二：**失去真我，就会成为资本玩物、政治玩物、社会玩物、他人玩物。看到狼吃羊没，什么时候想吃，就什么时候吃，你就是只羊，待宰羔羊。\n- **第三：**这个虚妄的假世界伪装成租客，一个充满贪嗔痴慢疑众生相的假我，你把自己的心出租给了这个假我几十年，这个租客住久了以为自己是房东，但他深知房子的产权不是他的，所以这个假我内心深处肯定不珍惜，所以他可劲造，把你的心弄的抑郁、焦虑、自卑，这个房子都快塌了他也不在乎；这种恶租客岂能容他！你是房东，你该知道了，你该醒了，必须把租客扫地出门！\n\
  \n清扫这个租客留下的垃圾观念、清扫这个租客留下的垃圾人际关系，把垃圾都清理出去，洗干净，真房东，要回家了。\n\n具体参考上面众生相里关于我相和人相的解释说明。\n\
  \n##### 1.1.3 灵魂与肉体\n\n要意识到我是由灵魂和肉体两个部分组成。\n\n肉体承载灵魂，灵魂驱动肉体。\n\n肉体肯定越老越腐烂，需要灵魂越老越干净。\n\
  \n死的时候灵魂修得越来越高级才圆满，这样符合宇宙守恒规律。\n\n- **第一：**肉体的你从外面看得见，向外求；灵魂的你从内心才看得见，向内求\n- **第二：**肉体是频率较低的波，具体频率和能量受人类世界的顶层设计所影响；灵魂是频率较高的波，跟宇宙跟自然一个频率\n\
  - **第三：**肉体成长需要营养，灵魂成长也需要营养\n- **第四：**肉体需要把体内的屎尿屁排出去，灵魂也需要把精神的屎尿屁排出去\n\n你是由灵魂和肉体两部分组成，灵魂才是真我，大脑为主的身体是假我，你的灵魂只是用你的身体几十年，大脑和身体就死了，你的灵魂不生不灭。你的灵魂从你出生那一刻就开始了地球之旅，从你大脑和身体死亡的那一刻，你的灵魂就开始了宇宙之旅。\n\
  \n比如用针扎你，你觉察到你的身体疼，但是你这个觉察不疼，那就是觉知就是你的幕后视角，这个觉察/觉知/幕后视角，这个注意力，就是你的灵魂。\n\n这个世界顶层设计的核心就是对你注意力的掠夺。\n\
  \n你的注意力在哪，结果就在哪，人生就在哪。\n\n比如你把注意力放在缺点上，一个缺点不断被盯着会被无限放大，放大到足以恶心死自己。\n\n何况每个人有无数个缺点，你这么喜欢盯着缺点，一个人都可以恶心死你无数次，更何况世界上有无数个人。\n\
  \n那你这辈子啥也别干了，净死了；以后你要是不喜欢谁，他还一直缠着你，你就向他展示缺点，没有缺点也要创造缺点，恶心死他。\n\n每个人一生都会出生两次，不是一次！\n\
  \n第一次是你爸妈生你，生的是肉体的你，妈妈怀胎十月，经历各种难受，冒着生命危险，才有了你；第二次是你生你，生的是灵魂的你，也叫涅槃重生。\n\n只有自己才能生，你怀胎几十年，经历人间炼狱，精神饱受煎熬，越是接近死亡越容易觉醒，才能生出真正的自己。\n\
  \n**你是你自己的父母，你是自己的孩子，像爱父母一样爱自己，像爱孩子一样爱自己**\n\n##### 1.1.4 大脑与直觉\n\n要意识到自己拥有大脑和直觉，大脑服务于直觉，直觉指挥大脑，直觉才是最高科学，直觉就是你的灵魂，直觉是人类思维之上的感知，是你的真我；\n\
  \n大胆跟着直觉走，你经历你承担，你承担你成长，越是跟着直觉走越像自己。好比在天成象，在地成形，在人成运：今天出门前杯子突然摔碎了，直觉会告诉你不对劲，不能出去，再重要的事也得缓缓，从长计议；\n\
  \n开车的路上突然有动物在路中间挡着你不让过去，过了一会还不走，那你就等着或者掉头；\n\n今天要出去办事，没有象形出现，就是直觉不太对，自己总觉得状态不是那么回事，但凡你继续出去办事，基本凉凉。\n\
  \n再说说大脑。\n\n- **第一：肉体是以大脑为主体的一堆肉。**大脑是身体最低级的器官，你还信它，把它当成神明，你所有的身体问题、心理问题、人生命运就是它害的。\n\
  - **第二：大脑让人类成了地球上灵性最低的低等生物。**一句话就能操控大脑，让大脑把你困在原地一辈子，你用一句话对着花草树木试试，对着鸡鸭鹅试试，都比你强。\n\
  - **第三：身体的每个器官都是道法自然般的强大，遇到问题都会下意识去解决问题，唯独脑子遇到问题不但不解决反而增加新的问题。**\n- **第四：大脑处理信息的能力只有1/1000，999/1000都处理不了，这不是个傻子吗？**老师一节课讲了一万字，你脑子记住了几个？它就这么菜。\n\
  - **第五：大脑是可塑的，只是以前被这个世界被环境塑造，你得把大脑拿回来自己塑造自己用，那是你的私人大脑。**刻意驯化刻意练习正知正觉正念，直到大脑形成你需要的新的下意识和潜意识，那是找到自己的开始。\n\
  - **第六：无脑成神。**想提升专业知识，好好使用大脑；想开启智慧，想解决内耗，不用大脑少用大脑，脑子一思考一干活，直觉就关闭。\n- **第七：干体力活的要比天天动脑子的人精神内耗少很多，多思多虑，脑子对于大部分人类是累赘。**\n\
  \n##### 1.1.5 物质与精神\n\n要意识到自己是由物质世界和精神世界两部分组成，物质基础决定上层建筑，精神引导物质。\n\n物质世界就是肉眼看到的客观世界；精神世界是用心才能看得到的主观世界。\n\
  \n- **第一：**文明经过几千年的发展，先后经过农业文明—工业文明，已经发展到顶峰并已经有走下坡路的迹象，精神文明时代开始起步，跟精神文明相关的行业也都刚踏上征程，但中间还有个过渡期：信息文明。信息文明可以把人类的科技水平带到最高，信息文明建立才能真正实现精神文明，精神文明时代就是天下大同阶段。\n\
  - **第二：**物质世界现在已经是夕阳产业，从起步到过度追求再到现在很多人开始厌恶，就跟经济规律那样，物质世界现在很内卷，名利权利房子车子票子想获取越来越难，所以再继续追求物质世界将很难获取成功。\n\
  - **第三：**但精神世界这个赛道刚起步，绝对的朝阳赛道。很多人都开始觉醒想觉醒，普通人更容易有实现阶级跃迁的机会。好比精神世界的改革开放才刚开始，遍地是机会。\n\
  - **第四：**过度追求物质世界容易变成跪族，跪下的一族。但追求精神世界的人不容易下跪、不容易精神内耗、不容易被当韭菜，是精神贵族。精神富养的时代已开始启航。\n\
  \n**像爱自己的身体那样爱自己的精神**\n\n- **第一：**很多人要么没关注修行要么太刻意修行，两个极端。要道法自然。\n- **第二：**精神饿了就给它吃，冷了给它穿，困了让它睡。\n\
  - **第三：**精神跟身体一样都需要锻炼才能强悍，锻炼身体时用力过猛或者方法不对，都会导致损伤病痛，身体强壮最管用但最残酷的方法就是当兵或运动员，痛并快乐，身体重生。\n\
  - **第四：**锻炼精神也一样，对的方法有：正知正觉正念，接触让自己愉悦的事和人；最厉害的方法：无情无念；最残酷但最管用的方法是精神内耗，精神内耗是为了让你强大让你涅槃重生而存在，是被封印的智慧，痛并快乐：精神重生。当精神内耗时，不要排斥，顺着它合理运用它，回过头你会感谢那段地狱般的岁月。\n\
  - **第五：**锻炼身体突破极限之后不再累了，同样，精神突破极限之后也不会觉得活着那么累了。你跑步超过10公里，脚自动跑，越来越轻松，但是在10公里之前那个难受啊，经常想着：不行啦，坚持不下去了……就一咬牙一跺脚的事，不就酸点疼点，干！精神在觉醒开悟之前也一样，会经历难以忍受的痛苦，比如各种内耗，焦虑、抑郁等等，你会觉得活着越来越没意思，想放弃一切甚至生命，健身教练再牛逼，锻炼也只能自己来，这个世界上从来没有什么救世主，突破只能靠自己，实实在在去经历去体验去见这个世界去见众生，才能见自己。不是天天虚头巴脑地跟随什么大师看什么书，遇到事照样把你打回原形。不管是肉体还是精神，干！\n\
  \n**用肉体问题辩证解决精神问题，肉体和精神好比是两个孩子**\n\n- **第一：**每个人的身体多少都有点问题，都有亚健康或小问题，小毛病根本不用看，你越膈应越在意，就会把自己把家庭拖入万丈深渊。跑这个医院那个医院怎么检查都没事，还是觉得不舒服，连民间的大仙儿巫术都看了也不行，最后没辙不去管它了反而好了；其实解药就是自己，最好的医生是自己。\n\
  - **第二：**精神出问题也一模一样。每个人都有心理问题，多少而已，根本不用在意它，越在意它越关注它越想解决它，它越来劲。解药就是自己，最好的心理医生是自己。不去管它反而好了。\n\
  - **第三：**肉体世界发育长大完善需要现实世界里饮食、养生、学校、上班、拼搏以及各种社会游戏进阶法则，等等这些都是营养，吸收的多、吸收的好，肉体世界就越强壮越强大；精神世界也一样需要营养，比如各种精神内耗各种痛苦，这需要通过修行来吸取才能强大。世界上都有各自很成熟的方法论和进阶法则，都给总结好了，找到对的并学习即可。这个过程里别让这俩孩子摄入过多的垃圾成分，不然肉体和精神都会出问题。\n\
  - **第四：**肉体世界比精神世界发育的早，且相互影响。肉体世界发育早是因为精神世界心灵成长起码得懂事之后才开始发育，肉体从出生就一直发育了，且小时候谁都不太会关注心灵成长，主要去讲究这个肉体怎么吃怎么发育；而且还有个天然的本能，就是身体越年轻越利于拼搏，也就越有利于肉体的现实世界更加茁壮成长，后来的读书、工作很自然地忽略了精神世界。前期主要是肉体世界主导精神世界，到了中后期主要由精神世界主导肉体世界，肉体世界经历的越多，精神世界越强大越丰富，同时精神世界越强大，肉体世界现实世界做事越顺手如意。\n\
  - **第五：**俩孩子达到各自的成熟状态难度系数不同，精神世界发育难度看似大于肉体世界，实则恰恰相反。因为精神世界只有你自己、完全由自己掌控、自己说了算，相比较会更容易达到或接近。但肉体世界相比较就很复杂了，外物太多，规则太多，不由自己说了算。\n\
  - **第六：**这俩孩子的成长和阶段性的被关注度，天然的不太同步。往往大家都太专注于肉体世界的拼搏就会导致精神世界的修行减少甚至停滞。钱可能挣的多了，但精神空虚。所以心理出现拧巴感觉到迷茫内耗，也就成了极其自然的事。俩孩子都想成龙都想达到最高境界的概率微乎其微。太过于追求最高境界，野心太大，身体和心灵都可能承载不了。身体垮掉、精神垮掉或者都垮掉。\n\
  - **第七：**既然精神世界大多数时候会指导肉体世界，既然肉体世界比精神世界难，既然肯定存在阶段性的顾此失彼，那就告诉精神世界这个孩子：有个事情需要你理解，肉体这个小家伙难伺候，我得趁它年轻时多关注它，让它赶紧的先发育先拼搏先经历先去看看这个世界，它拼的越努力给你带来的条件越丰厚你就开心经历的多你也就越强壮，要不然到老了你们俩都过不好，肉体越老越完蛋，还后悔一辈子，后悔就是精神世界你的事情了，最后肉体和精神你俩都难受，这不是傻吗？再说了，肉体世界早晚得听你的，别计较先关注肉体世界先感受一下世俗，才能让你这个精神世界清新脱俗，以后肯定你说了算，别计较别迷茫别拧巴。所以年轻的时候多去看看这个世界，多去干多让肉体去经历，少胡思乱想少关注精神，这个才是这俩孩子发展的正道。\n\
  \n**肉体世界和精神世界的抚养方式的四个层次**\n\n- **第一层：**精神穷养，身体穷养。属于绝对躺平，不是不可以，注意身心健康，别极端。\n- **第二层：**精神富养，身体穷养。这个是底线，身体健康精神快乐，不求他们大富大贵，至少是生活上生命的强者。\n\
  - **第三层：**精神穷养，身体富养。一般是工作狂事业狂，可能是事业上的强者，但心理容易出问题，身体也容易出问题。\n- **第四层：**精神富养，身体富养。做成了就是顶尖人类，普通人很难，概率微乎其微，前提是身体和心理都足够强壮。\n\
  \n**提高精神能量的方法：**\n\n- **第一：愤怒。**怒火是能量，遇到问题可以用怒火燃烧掉。\n- **第二：蔑视。**蔑视是能量，遇到问题用鼻孔看人看问题。\n\
  - **第三：鄙视。**鄙视是能量，遇到的问题根本看不上。\n- **第四：无视。**无视是能量，心中无念目中无人，豁出去，爱咋地咋地。\n- **第五：脏话。**脏话是能量，是哲学，遇到问题没有比一个脏字说出来提劲儿。\n\
  - **第六：接触灵性。**灵性的都是能量，花花草草猫猫狗狗、婴幼儿、强者。\n\n**物质世界和精神世界修到最后都需要稳定有序、心安自洽的四六法则**\n\n\
  - **第一：**精神世界稳定有序需要四步：破相+断相+正相+无相；又道又佛，超然物外，修出精神世界心安自洽的自己；\n- **第二：**物质世界稳定有序需要六步：身体健康+不负债有存款+低欲望+守静+接触灵性+长效生存之道；外儒内法，杀身成仁，修出物质世界心安自洽的自己；\n\
  \n提示：具体细节会在后面讲到。\n\n##### 1.1.6 爱自己\n\n###### 1.1.6.1 不爱自己的那一刻起，余生的每一分每一秒都是错的\n\n\
  - **第一：**不爱自己是万病之源，爱自己是本能，是基因。不爱自己是设计好的，是坑，是陷阱，只有不爱自己才会失去自己，你才会内耗，社会才会稳定有序始终。\n\
  - **第二：**无条件鼓励你、支持你、爱你的人，只有你自己。你苦苦寻找的那个人不是父母不是爱人不是好友更不是神明。\n- **第三：**全身除了你的大脑是个二蛋，你的每个部位每个器官每个细胞，都清楚的知道只效忠你自己保护你自己，誓死也要救你于水火。\n\
  - **第四：**全世界90%的病治不好，都是靠自愈。不管是身体疾病还是心理疾病，都只能靠激活内在的免疫系统这个真医生，要向内求。\n- **第五：**向外求要是能取得真经，皇帝早他妈长生了。还天子，不就是神的奴隶，本来咱叫人皇，最后一个人皇就是历史上被黑的最狠的纣王帝辛，从那以后变成了周天子，低了一等，还造出了周礼约束人。天地人三者共生，是平等的。小日本叫天皇，咱叫天子，妈的……哪次朝代灭亡不是人祸加上了天灾，皇帝作为天子你爹咋几千年来不断在弄死你。\n\
  - **第六：**如果连自己都接纳不了，你还想接纳其他人其他智慧？你还想觉醒开悟？你还想干成点啥事？呸！\n\n###### 1.1.6.2 什么是爱自己\n\n\
  - **第一：**肯定自己的成功\n- **第二：**不否定自己的过错\n- **第三：**接纳自己的一切\n- **第四：**我肉身灭世界一切俱灭，我的肉身随时会灭，别没来得及好好爱自己就灭了\n\
  \n###### 1.1.6.3 爱自己的五个方式\n\n- **第一：**我很满意我自己，一直满意到我死，你不满意我，你可以比我先死\n- **第二：**这辈子宁可自己把自己爱死，也不能让别人把我伤害死。人活着哪哪都是伤害，上下五千年打仗打了4800年，原生家庭伤害、学校教育伤害、职场伤害、爱情婚姻伤害、食物伤害、医疗伤害，苍天和大地时不时来场天灾的伤害，连呼吸一下也能被空气污染伤害，自己若还不爱自己，在娘胎里直接溺亡得了\n\
  - **第三：**只要让我不舒服的人和事都是错的，别跟我讲什么对错，即使你都对，你也别用你认为的对来伤害我，我来人间旅游几十年是跟你来分对错的？是来被你伤害的？呸\n\
  - **第四：**别人说的话不就是空气，放屁也是空气，现在满大街都在放屁的人，你在意个屁\n- **第五：**这辈子最重要的事是幸福，谁阻止我探索世界、阻止我成为自己、让我不舒服，就一定是错的，对也是错的\n\
  - **第六：**爱自己的一切，先从无脑爱开始，从瞎爱开始。哪怕是缺点，我这个缺点挺有意思；哪怕自己做了错事，我又做错了真好玩……\n\n###### 1.1.6.4\
  \ 幸福三要素\n\n- **第一：**极低物欲。吃饱穿暖喝足、五谷杂粮即可，最多偶尔小改善一下。什么车啊房啊教育啊还有医疗，滚\n- **第二：**悠闲自在。稍微有点事做即可，天天那么忙赶着去死啊，独立个人，最多夫妻经营，小而美，谁也别想管我，我也不想管谁\n\
  - **第三：**融入自然。搞个小院儿种点小菜养点花草撸猫遛狗，有天有地有烟火气，一个家就是全世界\n\n###### 1.1.6.5 只在乎这三样儿\n\n\
  - **第一：**我的情绪。但凡影响我情绪的人和事，断舍离\n- **第二：**我的资产。但凡刻意消耗我资产的人，断舍离\n- **第三：**我的健康。但凡伤害我身体健康的习惯，断舍离\n\
  \n###### 1.1.6.6 不爱自己就爱别人要付出的代价\n\n- **第一：**不会爱自己就去爱别人，这不是真爱。不爱自己怎么知道什么是爱，自己都没体验就去爱别人，这是瞎爱，没分寸的爱，虚假的爱，只会伤害别人甚至爱死别人\n\
  - **第二：**太阳越升起，越会落下；月亮越圆越会马上残缺；爱得太满，就会走向爱的对立面：伤害。所以不能太爱别人，即使你真的很爱，这是在保护他们\n- **第三：**你越爱什么，越在意什么，上天越会伤害什么，甚至让你失去\n\
  - **第四：**太爱别人就会无法放下。当失去时，撕心裂肺的痛，无法呼吸的痛，你真的承受不住\n- **第五：**太爱别人，就会相对忽略自己。爱是有限度有边界，不爱自己可是万病之源\n\
  - **第六：**爱可以，别太爱；在意可以，别太在意；最好无爱无意无念，像佛陀像老子一样，像苍天像大地像花草树木一样\n\n###### 1.1.6.7 人人都缺爱，但这个世界没人真正爱你\n\
  \n\n\n###### 第一：是个人都缺爱，多少而已，这是设计好的陷阱。\n你都不爱自己，把这无比重大的事情寄托给别人你放心？\n指望别人爱你，爱你个毛；自己都觉得自己狗屁不是，你一个狗屁还想爱家人爱他人爱世界？\n\
  \n###### 第二：别人爱你的前提条件。\n大部分父母爱你也是因为你是他的孩子，你要为他们养老送终\n\n###### 第三：你越想要别人爱你，反而你越缺爱；别人以你想要的方式爱你了，你得到之后马上就腻，对方如果不换一种新花样爱你，你就会腻，吵架抱怨甚至离开换人。\n\
  就像你越喜欢车，你就越缺车，开腻了就想换，有钱人恨不得把所有车换一遍，直到全体验完，车库里停满了，这个欲望才停止\n\n###### 第四：只有爱自己才会让自己心情愉悦，发自内心的自信，才会更有机会把事情做得更好混得更好，才有机会把别人照顾得更好。\n\
  比如你不爱自己的身体，都病倒个球了你还有能力爱谁？爱谁谁\n\n###### 1.1.6.8 自私到了极致就是爱\n\n- 第一：爱任何东西的前提是我。我爱我家我爱祖国我爱人类我爱你，这个里面的核心是我，不是爱，更不是你。没有我，爱啥爱？你啥你？\n\
  - 第二：佛陀和弘一法师抛妻弃子，别人说他们是大爱；雷锋做好事是为了自己心安自洽还写日记：自私是生物基因，自私可以，不伤害别人；伤害别人可以，别起念。等把自己爱满，找到了自己，爱己必能及人。\n\
  - 第三：爱自己家人你咋不爱其他家人？你好自私！\n- 第四：有时候你帮助的你给的只是你想给的，而不是对方想要的；或者你给了想要的，但对方认为你们的关系你帮他是应该的，不少亲密关系都会这么想\n\
  - 第五：经常帮助别人的很多人，偶尔会表现出高高在上的气息，不管是觉得自己牛逼还是觉得对方亏欠自己，有时候表情或者话语就会伤人，做了好事不落好，这样的人不少\n\
  - 第六：没有多少人真正愿意在内心承认不是靠自己只是靠别人才成功。事情做成后的多数人都会增加自负心理，都觉得没有贵人自己也能成，他们会抹除通过你成功的痕迹，你越是表达你帮了他，他反而对你越记恨\n\
  \n所以，要么施恩与人不求回报，要么冷眼旁观无动于衷，要不然自己受气\n\n###### 1.1.6.12 爱自己是一件事，做事就做到极致\n\n- 第一：只有一件事情做到极致，才有机会接近天道参破天机\n\
  - 第二：爱自己的时候就聚焦，只爱自己，忽略整个世界，只有专注才能成事\n- 第三：爱自己的优点更要爱自己的缺点。夸你时你顶多开心一下，老是揭短老是说你缺点你是不是想揍他\n\
  - 第四：潜意识你更在乎自己的缺点。再比如有人满世界说你拉的屎不仅丑还臭，你是不是想抽他：谁敢动我的屎试试！\n\n###### 1.1.6.14 只要对自己不好：别人一定会对你不好\n\
  \n- 第一：破窗效应。你往一个地方扔垃圾，别人会认为那就是垃圾场他也会扔。越是自虐，自己越是垃圾场，别人除了往里扔垃圾还会拉屎，人性下坠的力量让人上瘾\n-\
  \ 第二：人类不仅慕强还凌弱。你对自己不好就是自己看不起自己，内心认为自己是弱，你就会连自己都欺负，更何况别人\n\n###### 1.1.6.15 你的世界充满爱\n\
  \n- 第一：大地是爱你的：任何人任何事都不可能压垮你，有大地在，整个地球都在托举你。\n- 第二：苍天是爱你的：任何东西都可以离开你，唯独天不可能离开你，整个宇宙都在拥抱你。\n\
  - 第三：阳光是爱你的，空气是爱你的，水是爱你的，你身体的无数个器官和几十亿个细胞是爱你的，无怨无悔的爱你，义无反顾的爱你，你在，爱就在\n- 第四：既然生命有数，我将用整个撒哈拉用作倒计时，每粒沙子都是爱的见证！\n\
  \n###### 1.1.6.16 爱自己的心态\n\n尘埃般的地球，蝼蚁般的你，爱自己都爱不好？自信都自信不好？抑郁都抑郁不好？生气也生不好？活着不就这点破事。\n\
  \n别怂不拉叽，别吊儿郎当，爱自己就好好爱，自信就好好自信，抑郁就好好抑郁，生气就好好生气\n\n祝你：爱自己爱得死去活来，祝你自信不打烊，祝你抑郁顺利，祝你生气愉快\n\
  \n###### 1.1.6.17 这辈子最重要的事是让自己幸福\n\n- 第一：想让自己幸福从做自己开始，想做自己从爱自己开始，想爱自己从只管好自己开始，这辈子能管好自己已经很厉害了\n\
  - 第二：只要让自己不舒服，果断屏蔽或远离。哪天心情不好了就十倍奉还的怼他干他，与人相处有且只有这一个标准\n- 第三：不讨好任何人，物质不缺精神也不能要饭，不做灵魂乞丐\n\
  - 第四：只活在当下，只享受当下，只体验当下，根本没有过去没有未来，整个生命只是当下这一刻的叠加\n- 第五：接纳有人性弱点的自己，接纳神神叨叨的自己，接纳有合理兽性的自己，接纳有屎尿屁的自己\n\
  \n###### 1.1.6.18 爱自己需要一个过程\n\n- 第一：只爱自己。小时候没有爱别人的能力，所以小时候无忧无虑\n- 第二：爱自己的同时会伤害别人。从发现自己不快乐很内耗开始，寻找到根源是忘了爱自己，想重新获得爱自己这个超能力肯定需要代价，必须得集中精力把爱都回归自我，难免会不顾及别人的感受，难免会误伤甚至故意伤害到他人。\n\
  - 第三：爱自己也开始有能力爱他人。就跟大树一样，还是小树的时候跟身边的花花草草其乐融融，长大后离自己最近的花草死的死、伤的伤、残的残，因为大树底下的营养水分阳光不太可能给到其他花草，只是大树没有起念：我吸收阳光水分的目的，是为了干死身边的花花草草，但大树最终会吸引更多小鸟动物丰富这一方土地更多的花草。形成一方天地\n\
  \n##### 1.1.7 向内求\n\n###### 1.1.7.1 什么是向内求？\n\n- 第一：向内求，求出的是本自具足的真我；向外求，求出的都是欲望、讨好、在意别人等内耗的假我，向内求是答案，向外求是陷阱。自己就是答案，自己就是全世界：自己就是太阳，自己就是发动机，自己就是医生，自己就是财富，自己就是时代\n\
  - 第二：向内求是保护自己的能量、频率，精神内守，精神内敛。比如看到花，一般的人会被花夺魂，比如看到美女，一般的人会被美女夺魂，这样会导致能量外泄，频率紊乱降低。向内求是把鲜花、把美女的这种美好这种赏心悦目用于提升自己的能量，回收能量，内敛进来。\n\
  - 第三：向内求，基于第一性原理，只关注问题本质，从如何解决问题出发；\n- 第四：向内求，不是检讨自己否定自己，是把所有注意力都放在自己身上：只关注自己，只改变自己，只管好自己，关注别人没用，改变不了别人，更管不着别人；最大的敌人是自己，最好的朋友是自己，最爱自己的是自己，能伤害自己的是自己\n\
  - 第五：靠自己。把命运交给别人，是对自己最大的背叛。世间万物都可以用，但核心是自身有价值，自身有方法，是从自身出发的解决方案。因为连自己都不是绝对可靠，更何况别人\n\
  \n###### 1.1.7.2 显化骗局\n\n好多人用吸引力法则、量子纠缠搞的显化大法骗局，向内求才会显化\n\n- 第一：平时你的碎碎念是用脑，是向外求，求的是欲望，是低频的玩意儿，跟宇宙不同频，宇宙接收不到，吸引个屁，显化个屁，心想事成个屁\n\
  - 第二：吸引力法则指的用心，是向内求，求的是第一性原理、是本真，这样的起心动念产生的频率会跟宇宙网同频，宇宙才能接收到\n- 第三：比如挣钱，得向内求，得用心提升自我能力，而不是向外求，不是用被编程的脑子硬想挣钱，不是等天上掉馅饼；再比如夫妻感情得向内求，用心去成就对方呵护对方，而不是向外求用猪一样的脑子想要多少彩礼期待对方给自己更多的呵护；再比如人际关系，得向内求，提升自我价值，吸引他们邀请，而不是向外求希望自己融入\n\
  \n###### 1.1.7.3 你是自己唯一的敌人\n\n天底下最大的敌人就是自己，还不够？这个世界上只有一个敌人，就是自己。\n\n- 第一：人为什么会变成自己的敌人，因为不爱自己经常否定自己，想让自己变成其他人，你不想成为自己，也就是你想成为别人干死没觉醒的那个自己，他再没觉醒那也是自我神识，要干死他他能同意？体内老是感觉有俩小人儿在打架就是他俩在干，你的那个敌人，也就是天天否定自己不爱自己的那个小人儿\n\
  - 第二：那个小人儿是自己的敌人，把这个敌人干死，就剩下简单纯粹的那个小人儿，他很爱你，和他交朋友，他是你在这世界上最好的朋友，没有之一。因为你就是他他就是你，你要发现他爱他肯定他保护他直到他觉醒。\n\
  - 第三：如果你认为外在的是你的敌人，你就只会想打败他人、改造他人、抱怨他人。他都改变不了自己，你寄希望于别人改变后你才舒服，这他妈就是个春秋大梦。所以你唯一能做到的就是改造自己改变自己管理自己。外面的人都是你的朋友帮助你成长的养料。\n\
  - 第四：一切向内求。没有任何亲人，唯一的亲人就是内在觉性；没有任何敌人，唯一敌人是内在无明烦恼。\n\n###### 1.1.7.4 向内求一直求到本自具足\n\
  \n向内求才能变成有内核的真我，向外求会变成行尸走肉没有灵魂的狗。向内求一直求到本自具足，你啥都有啥都可以创造，自己可以完成生命所有闭环\n\n- 第一：你是信仰本身、自信本身、能量本身，不需要向外求别人鼓励别人认可别人安慰，你是真人你眼里看到的都是假人，去求假人帮自己这个真人？\n\
  - 第二：你是钱本身，自己可以创造挣钱机会挣钱项目，专注提升自我感兴趣的核心技能，你在哪钱就在哪，不需要追着钱跑\n- 第三：你是意义本身，自己的好、自己的坏、自己的对、自己的错、自己的屎尿屁就是意义本身，不需要向外求答案，求自己\n\
  - 第四：你是医生本身，可自学中医，靠自身免疫力和修复力，不需要向外求医生\n- 第五：你是智慧本身，从内心生出来的自我感悟，也可以靠自学万物知识，不需要靠向外求老师，所有知识原本就没有，还不是人发明的，凭什么不能是你？\n\
  - 第六：我只求自己，我是一切本身，我是一切的根源，一切皆有利于我，天地与我共生，万物与我唯一，我心即宇宙，我是宇宙中心\n\n###### 1.1.7.5 不要同情任何人，真正的慈悲是让该发生的事发生\n\
  \n- 第一：不要想着当别人的救世主，你连自己的命运都干涉不了，怎么可能干涉得了别人的命运\n- 第二：天底下没有可怜人或者人人都是可怜人，再有权有钱的也有可怜的一面。也就是你也很可怜，哪还有闲功夫可怜别人？\n\
  - 第三：当被文字定义成了可怜人，一定能找到对立面，就是可恨之处。没有这个可恨之处就不会成为可怜之人，先可恨再可怜，都是他们自己作出来的\n- 第四：可怜之人在社会形成了向外求的共识：我是个可怜的人，社会得同情我，你们不同情我就是没良心···这些人不仅不感恩，当你不提供帮助时，这类人还擅长倒打一耙\n\
  - 第五：当你同情别人，你就会背负他的命运。愿意接受别人同情的人，尝到了甜头会赖上你，他觉得你好拿捏，你会承担他的业力\n\n###### 1.1.7.6 只管好自己，只管付出\n\
  \n- 第一：只管好自己，只处理自己跟自己的关系，绝不在意别人的看法，别人是谁？别人是人吗？别人的眼光别人的看法，那是别人的，是别人的不是自己能控制的，也就是别人的看法压根不是自己的事儿，不是你的事你管它干嘛？这辈子只管自己能做主的事情，只有自己能做主的事才是自己的事，只管好自己\n\
  - 第二：你付出，可以随时收回，但是你索取，就会惴惴不安。因为付出能控制，是自己的事，索取得对方给，能不能得到是别人说了算，本质上与你无关。比如爱情，你只管付出真心，只管好自己，不干涉他的内政，婚姻持久的概率会增加。如果希望得到对方的爱、关心、金钱，这个念一起，命运就交到对方手里。\n\
  - 第三：人性是相反的，世界是相反的。你越索取，对方就会越反感，你越索取，姿态显得越低，还会被瞧不起，甚至让人觉得恶心。只管耕耘不问收获的意思是：收获不归你管，别tm多管闲事。爱出者爱返，福往者福来。\n\
  - 第四：比如做短视频，我只管录制内容，平台爱咋滴咋滴，粉丝爱涨不涨，黑粉爱咋黑咋黑，关我鸟事；再比如职场工作，我只管尽最大努力，结果爱咋滴咋滴，那是结果的事，领导爱生气就生气，那是领导的事，这就是他的命！\n\
  - 第五：每件事我都只管如何付出、如何做，事情之后要做的事永远只有三件：第一件别人对我的肯定或惩罚无所谓，我都接受和承担；第二件是肯定自己奖励自己，因为我尽力了肯定要肯定自己；第三件复盘做的不到位的地方，想尽各种办法，甚至不择一切手段，让下次越来越好\n\
  - 第六：向天地万物学习，内心平静，只向内求只管做自己的事，成长过程中大概率会伤害到其他人尤其是最亲近的人。利己可以，不要损人；损人可以，但不要刻意起念。比如我很丑，走在大街上把看到我的人恶心死了，关我鸟事！\n\
  \n###### 1.1.7.7 把命运交给别人，是对自己最大的背叛\n\n- 第一：生时孤独，死时孤独，生死之间亦是孤独，花草树木猫猫狗狗强者都是靠自己；生病靠自身免疫力；你本自具足\n\
  - 第二：从底层爬出来的人，根本不知道靠别人是什么感觉，深知一个人的觉醒开悟，1%靠别人提醒，99%靠千刀万剐：剥皮、剔肉、抽筋、削骨，把你拥有的全部敲碎，血肉模糊，碎成粉末，在痛苦怀疑崩溃绝望中重新组装、长出崭新的自己；\n\
  - 第三：比如家逢巨大变故、身患重病、身无长物人生低谷，没有大量地狱经历+深度思考能力，你醒不了。不要试图用过来人经验就能拯救别人，每个人都有自己的南墙要撞。\n\
  - 第四：再比如精神内耗，肉体世界的屎要自己拉，精神世界的屎也要自己拉。饭可以别人给你买别人给你做甚至别人给你喂，但最终还得嚼自己咽自己消化，营养才能自己吸收，废物自己排出去。总不能说：兄弟，我在忙，你帮我去拉屎吧···精神内耗的方法可以别人给也可以自己给，但精神营养得自己吸收，精神废物得自己排，世界上最牛逼的人来帮你最多也只是起到指引的作用。自己才是答案、自己才是钥匙、自己才是医生\n\
  \n###### 1.1.7.8 进入社会之前靠别人，进入社会之后靠自己\n\n- 第一：靠自己的价值\n- 第二：靠自己的智慧\n- 第三：靠自己的头脑和双手双脚\n\
  - 第四：靠自己的每一步脚印每一滴血汗\n- 第五：靠自己的极度专注单点击穿\n- 第六：靠自己的每日精进日拱一卒\n\n###### 1.1.7.9 不该谢我，最该谢的是你自己\n\
  \n看了我内容改善了精神内耗/挣到了钱，你得给自己磕头烧香\n\n- 第一：看到我视频的人多了，但很多人看不懂，很多人看到都想吐，一般都快进，听我说话还得慢放，多烦人的玩意儿\n\
  - 第二：你看到后起到正向作用，只能说明你悟性水平高，你自己有灵性，你有能力拯救自己\n- 第三：你也只是瞟了我的内容几眼而已，最后还得靠自己内心不断翻涌和斗争，靠线下不断实操实战才有了今天。如果真有作用，1%归我，99%归你，你靠的是自己\n\
  \n###### 1.1.7.10 极度不顺心时务必自救\n\n- 第一：你完全可以像疯狗一样发疯，你本就被社会驯化成了狗\n- 第二：你可以破口大骂，你有嘴；\n\
  - 第三：你可以诅咒命运，你有心；\n- 第四：你可以嚎啕大哭，你有嗓子；\n- 第五：你可以心安理得地躺平直至躺烦为止，你有床\n- 第六：你可以不鸟任何人，救世主从来都只有自己\n\
  \n总之，你得靠不一样的自己，靠自己身体的每个部位，靠只为你工作的几十亿个细胞，靠自身天道般的意志力，才能找到出口\n\n##### 1.1.8 干（提升执行力）\n\
  \n###### 1.1.8.1 干，是唯一答案\n\n- 第一：宇宙没有秘密、没有答案、没有认知、没有智慧、没有真理，所有的秘密、认知、智慧、真理，都是干出来的，所以：干！就是秘密；干！就是答案；干！就是认知；干！就是智慧；干！就是真理；干！才能找到爱好找到天赋找到自己真正想要什么；干！才能找到自己。你要把真我干出来，把真正的自己干出来\n\
  - 第二：不管是自然的宇宙天道，还是人为的苍生之局，还是只能靠己的个人之困，这就是阳谋，就是做好的局，就是设计好的游戏，就是坑，就是陷阱。但你没经历过，此阳谋还是无解。去干去体验，是唯一破局之道。没有经历不可能有发言权，实践出真知。\n\
  - 第三：一个人有一流的想法，三流的执行力，你就是三流的人；你有三流的想法，但拥有一流的执行力，你就是一流的人。因为再牛逼的人，是干出来的；再牛逼的公司，是干出来的；再牛逼的国家，是干出来的；再牛逼的智慧，是干出来的。\n\
  \n###### 1.1.8.2 先提升认知对普通人是误区\n\n“你挣不到认知以外的钱，人与人之间最大的差距就是认知”这些话听起来好有道理的样子，这种毒鸡汤...\n\
  \n- 第一：居然很多大企业家也对大众鼓吹这个，你们的认知不是干出来的吗？搞得普通人人心惶惶都想尽办法提升认知，普通人只有一条路：实践出真知。不干提升哪门子认知，听了几句很爽的话你就牛逼啦？去干干试试。\n\
  - 第二：因为认知先提高了大概率会看不上正在做的事，看不上这个时代，看不上身边的人；必然出现大道理都懂就是过不好这一生，必然出现一个思想深邃的年轻人大概率一事无成，必然出现眼高手低，必然出现不接地气。这种话对普通人就是诅咒，被一直锁死在底层，还很容易被认知课割韭菜，很容易被洗脑。这种听起来很爽的认知只是停留在大脑层面，大脑出现自己已经很牛逼未来很牛逼的幻觉，脑残\n\
  - 第三：行为跟不上认知带来的失衡，会让你物质世界混得不咋滴，肉体健康也出现问题，让你再也没有真正实力和精力再次带来失衡；也会让你的精神世界出现内耗，直到你认命为止变得心平气和，甚至抑郁到自杀为止，死了也平衡\n\
  - 第四：普通人根本没有资格先提升认知，去干，是你唯一的资格。你还没有到去拼智力拼脑子的时候，底层阶段提升的假认知反而会成为你的诅咒\n- 第五：全人类90%以上的工作干他个个把月就全会了，一点也不神秘，干可以祛魅，干可以让你保持独立思考。因为提高认知后还得去干，脱了裤子放屁，多此一举。\n\
  - 第六：只有干才能弥补行为和认知之间的差距，只有干才能从内心生出自己的认知，自己内心生出来的认知才会让自己处于平衡状态；只有干才能产生结果，这是想拿到结果唯一的方式，产生的一个个结果会组成你的人生\n\
  \n###### 1.1.8.3 提高执行力的常规方法\n\n- 第一：改变语言体系：执行力就是结果、执行力就是钱、执行力就是职位、执行力就是被尊重、执行力就是幸福、执行力就是你的命，执行力是你的一切；执行力就是干，越干越想干，没有道理就是干；提高执行力就是提高鲁莽力，提高闪电力，提高野蛮力，干对干错无所谓，干了再说，秒干。每天默念，贴到办公桌、做成厕所垫、沾到方向盘、设置成手机屏保，让这些字无处不在\n\
  - 第二：想提高执行力，根本不是如何提高执行力的问题，而是要理解到你就是执行力本身，孩子小时候都是知行合一，天生的，不会加入提升认知这个环节。花草树木猫猫狗狗婴幼儿强者等等都是知行合一\n\
  - 第三：做任何事只管干还是不干、怎么干，别管结果，别管其他人。因为结果我又控制不了，那是结果的事，什么结果我都接受；其他人我更控制不了，那是别人的事，什么人我都能接纳。我不能接受自己干事犹豫，不能接纳自己没干又后悔。干就干啦，不干就不干，能怎么滴。\n\
  \n\n\n第四：走运走运，走起来动起来才有运气，动，则万善相随。\n\n追求一个女孩，去追啊，给我站住，老子追的就是你，你跑不掉的……追求追求，刚才光追了，你还得去求啊，求求你了，我们相爱吧，答应我吧，我求你了……\n\
  \n追求一个人就去追、就去求，不要想要不要要去追求她。你要是这样想，遇到的都是我这样的情敌，我能让你一辈子是处男。\n\n第五：要多用直觉，直觉才是最高科学，直觉就是下意识、潜意识，就是第一反应，直觉是灵魂的语言，是你最强大的能力——灵性。\n\
  \n**直觉可以让事情变得简单，提高效率，提高行动力。**\n\n行动是唯一可以取得结果的方式，不是提高认知！\n\n行动是最快速提高认知的方式，不是先提高认知！用直觉带动大脑，用灵魂指挥身体。\n\
  \n**第六：认知要提高那就提高到最高，开悟甚至得道，就不会再撕裂再失衡了，因为悟道后会归于平静，身心灵平衡，天人合一的平衡。**\n\n总之，互联网以及碎片化的知识容易让人思想泛泛没有深度，容易导致自身内外失衡而内耗。要么深度学习，完全拿起来；要么刷个短视频图个乐完事，完全放得下。可别拿不起也放不下。\n\
  \n###### 1.1.8.4 知行合一\n\n**第一：行知合一。**\n\n知行合一四个字的顺序很容易误导普通人先知再行。\n\n先干就是提升认知的过程。而且先知不就是大脑先开始干活，大脑是太大了，大脑指挥直觉判断直觉，身体控制灵魂，那你不成了行尸走肉。先知道、先提高认知、先思考清楚就复杂了，效率降低，甚至会因为过度思考而犹豫不决，完蛋。\n\
  \n必须少用大脑多用直觉，把大脑刻意驯化成直觉的一部分、直觉的工具。\n\n**第二：知就是行，行就是知。**\n\n知到了不去做是不知，想到了不去做那是没想，只是你自以为想了，全世界没一个人能证明你想了你知了。\n\
  \n**第三：重点在合一。**\n\n比如吃饭这一件事：你得先买菜做饭吃饭刷碗，四个动作做完才完成了吃饭，四个动作合起来是一件事，不是单独的四件，动作只是动作，根本不叫事；知和行也都只是个动作，少一个就是零，知道再多不行动有屁用，只会低头种地不看天有屁用。\n\
  \n**第四：你本就是知行合一本身。**\n\n每个人天生知行合一，你看小孩，想放屁就放屁，拉屎就拉，不像你现在放个屁还得考虑场合、声音、角度。\n\n不能知行合一只是因为你失去了本能，你这个废物。\n\
  \n###### 1.1.8.5 我在执行力之上\n\n第一：我的执行力很恐怖，原因是我看不上执行力，就跟我看不上钱一样：我必须要挣钱但我就不关注钱，我只需要把自己的能力提升到它之上，它会来找我，我在它之上。\n\
  \n第二：我就认为我这么牛逼的人有执行力不是最基本嘛？\n\n谈执行力是看不起我，没执行力我都会看不上自己，执行力是我的骨髓、我的血液、是我的基因，而我，是它的造物主。\n\
  \n第三：我要的是卓越，是超越执行力。\n\n优秀只是及格，第一名只是及格：\n\n再好比：我想成功，勤奋和努力对于成功不是最基本的嘛，还用说？看不起谁呢！\n\
  \n第四：无念。\n\n我根本没有知行合一啊、执行力啊什么的这些概念，就天人合一，顺其自然，遇到啥解决啥，遇到啥体验啥，遇见啥干啥，超越这些人为的概念本身，心中无念，目中无人，就是干。\n\
  \n###### 1.1.8.6 不要犹豫\n\n- **第一：** 犹豫啥墨迹啥，怎么选择都有得有失：享受得到，承担失去。\n- **第二：** 既然每个选择都有得有失，也就是做任何选择都能得到，你都有收获，你一直得到一直收获，那还在意失去干嘛！\n\
  - **第三：** 既然每个选择都有得有失，也就是做每个选择都会失去，那就承担，不承担也得承担，那还犹豫个毛啊，闭着眼二选一完事儿。\n- **第四：** 而且从失去里面也有收获。比如选择了创业，失败了能收获经历和经验；比如选择了拉屎，失去了屎但收获了痛快。\n\
  - **第五：** 即使选择后全是失去，你本就一无所有，最终你也一无所有，连自己都会失去，你还有什么不能失去？怎么选择都是这狗屎一样的人生，那就干。\n\n######\
  \ 1.1.8.7 熟悉破方法\n\n很多人对没做过的事、未知的事恐惧和焦虑，那是因为你跟他们不熟。\n\n熟能生巧、熟能生自、熟能生知、熟能生胆、熟能生慧、熟能生静。\n\
  \n想跟一件事熟悉，想破解害怕、破解焦虑，有两个办法：\n\n- 一、直接干，多干几次就熟了。\n\n**第一：熟能生巧。**\n\n比如奥运冠军也是天天练习一个动作，跟一个动作熟悉十几年才有可能是世界冠军，只要对这件事熟练的次数和时间够长，最差也是省冠军、市冠军。\n\
  \n**第二：熟能生自。**\n\n再比如你刚到新学校、新公司、新城市等等，都是陌生地方，都是陌生的人，最开始不适应，甚至恐惧，哪也不敢去，也不敢轻易跟别人说太多。日子长了，你对每个地方、每个人都熟悉了，自然很放松，闭着眼都能找到拉屎的地方，很自然。\n\
  \n**第三：熟能生知。**\n\n比如创业，没干过肯定害怕，害怕没有未来、害怕回不到职场、害怕赔钱，但是干过一次不行干两次三次，再不行干十次八次，傻子也拥有创业的知识了。\n\
  \n**第四：熟能生胆。**\n\n比如有人欺负你你不敢反抗，那是因为你没反抗过，跟反抗这个事不熟，你反抗一次后就会发现原来如此，甚至感觉好爽，多干几次后完全熟练了，甚至见个人都想反抗试试。\n\
  \n- 二、提前演练，多演练多干几次就熟了。可以现实中模拟，也可以不断在脑子里的场景里建模，要模拟到具体细节。\n\n**第一：熟能生慧。**\n\n比如在未来可能或一定会遇到的重大困难，像失业、分手、离婚等等。提前模拟什么时间因为各种原因导致的失业，失业后你怎么处理你的家庭、你的贷款、你的下一步等等；提前模拟什么时候因为什么原因分手或离婚，离婚后自己怎么继续生活；现实中很多人分手离婚当成了家常便饭、每次都波澜不惊，那是因为经常离婚玩儿；做人的智慧。\n\
  \n**第二：熟能生静。**\n\n再比如怕死，你就去太平间、去墓地、重症监护室多看看，多想想家人或自己死亡时的场景和细节，很多人家人离世的越多他越淡定，就是因为跟死亡熟了，很平静。\n\
  \n不跟这些事情熟悉，等事情来了之后，尤其是连续几个大事件一起来了，不管是身体和心理，你真顶不住。\n\n**这个世界没啥秘密，熟悉而已。**\n\n######\
  \ 1.1.8.8 提高执行力案例\n\n- **第一：** 上大学时，跟很多学生聊天，他们的想法是真好，比我好太多，他们说完想法后就去睡觉、去打游戏、去泡妞了，最后只有我一个人去干了，我大学期间比他们优秀，毕业比他们更优秀。\n\
  - **第二：** 你学习了很多游泳的知识，我一点也不懂但就是敢下河，只要淹不死我就练，我就会了，你抱着课本抱一辈子不下水，照样是个旱鸭子。\n- **第三：**\
  \ 你学习了很多做生意的知识，我从没学过，我想创业了就干，失败了也挺好，还失败过好几次，酸爽，我一直越来越好，因为我一直在路上。\n- **第四：** 黄埔军校的军官都很优秀，但就是打不过毛泽东，毛泽东没上过军校，从来都是以战养战；于东来初中毕业，所有五百强商业连锁超市都干不过他。\n\
  - **第五：** 你学了很多缓解情绪内耗的方法，我可是一点也没学过，但是我就是去经历，只要胡思乱想了我找事干，总之一直干，干完就有体会。\n- **第六：**\
  \ 我跟一个部门老总在吃饭，他说杨总我遇到了一个问题，问题是这样的，需要协调另一个部门的老总，他还没说完，我拿起电话打了过去，饭还没开始，问题已经解决。一般人都会说先吃饭，吃完饭办事。我是听和做无缝衔接。\n\
  - **第七：** 上班时团队 PK，到了开会时间，我的队员秒到，我的团队都出发干活了，其他团队还没集合完毕，他们怎么可能和我比。\n- **第八：** 抗美援朝时，为什么小米加步枪的解放军能打跑世界第一的美军？解放军执行任务，让团队在什么地方蹲守，就一直守着，冻死了死在那儿也会守着，每个人都有视死如归的执行力！你再命令美国大兵试试，他们做不到！\n\
  \n###### 1.1.8.9 数量是王道\n\n第一：你一年里干了 5 件事，成功率 100%也就成功了 5 件；我一年里干了 50 件，哪怕成功率只有 30%，我也成功了\
  \ 15 件。也就是相同时间内我比你多了 10 次成功经验，还多了 35 次失败经验。你怎么和我比？\n\n第二：天天听这认知那认知、强者思维一大堆……没有强者能力，强者思维就只是阿Q精神；认知是随着不断的干提升的，强者思维是随着不断的干完善的，天赋或爱好是随着不断的干自己冒出来的，将军都是无数次打仗打出来的；有钱人都是从死人堆里爬出来的；觉醒开悟都是历经无数地狱磨练出来的。只有不断的干，认知和能力才能从自己内心生出来，只有从自己内心生出来，才是自己的，才能找到自己！\n\
  \n第三：结果是我能控制的吗？控制不了就不是我的事。只管耕耘不问收获，只管过程不管结果。比如在职场，一件事我只能管要不要干、怎么干，结果怎么样关我屁事，领导很生气关我屁事，活该！这是他的命！\n\
  \n我尽心尽力做了事，我要做的一定是先肯定我自己，我要奖励我自己才对，怎么可能会内疚自责？怎么可能会在意领导放的屁？\n\n第四：我选择我经历，我经历我体验，我体验我承担，我承担我成长，不管对错、不分好坏、不管结果就是干，横竖就是干，闭着眼干，只要在承受范围内，无限次增加干的数量，一直干到本自具足，干出自己的全世界！\n\
  \n等干到一定级别突破了普通人状态，再想着更稳重些。到那时可以想得清楚，说得明白，做得坚决。\n\n###### 1.1.8.10 完美主义\n\n第一：任何人离远了都没法看，任何事物离远了也都没法看，美女的屎也很臭。\n\
  \n天地万物都不会追求完美，比如太阳不可能一直在天上，总会落下，正因为黑夜，白天才有意义；月亮不会一直圆，总会缺，正因为缺，圆才有意义；人不会一直生，总会死，正因为死亡，活着才有意义。不完美恰恰是一种美，完美反而是一种遗憾。\n\
  \n大自然如此美正是因为，天地万物都有自身缺陷，也都有美好，各美其美，美美与共。\n\n第二：追求完美会背离天道，执行力下降，干的就少了，人生获得的结果也就少。\n\
  \n对于普通人，完美就是废物，完美主义是执行力的对立面，只要追求完美就会思虑过多，就会延迟行动，而行动跟获得多大成功，绝对成正比。\n\n第三：不完美之处，才成就了你。\n\
  \n很多天才都有缺陷，如果把缺陷治愈，天才立马变废柴。\n\n更何况一个人如果只是有个明显的疤痕、痣等特征，你要利用这些特点变成优势，强弱之势可以互相转化：因为正常的人跟你相比差不多的情况下，你一定会脱颖而出，越有缺陷，反而越有优势，越容易成功。\n\
  \n第四：很多人多少都有点完美主义，现实中遇到的精神内耗的根儿也在这。\n\n既想当又想立，既想上天又想入地，最后上不去下不来吊在中间你肯定难受啊。比如想拒绝别人又不想拒绝别人，想干这个又不想放弃那个……二选一就完啦，去干就完啦，失就是得，得就是失，不可能完美，很多事都是选择了就是选择了，选择后突然发现原来不过如此，离职了不过如此，离婚了不过如此、失败了不过如此……\n\
  \n快速决断的好处是集中精力，事情能处理好、情绪也能处理好。\n\n#### 1.2 觉察\n\n意识到身体之外还有一个我，把这个我可以作为肉体的我的观察者：我观察我自己。观察我的情绪，观察我遇到的问题，觉察地球，觉察到几千年前，觉知到自己愤怒了、焦虑了，知而止。\n\
  \n好比扎了我一下，我知道我的身体疼，是身体疼，但是这个知道不疼，就是觉知，就是觉察。好比我在看着小镇舍长写书，小镇舍长是我的肉体，我在看着我写这本书。\n\n\
  #### 1.3 守静\n\n**静能生慧。**\n\n就像杯子里的水，在定的时候，可以当镜子用，可以照到星星月亮，可以看到自己。只要受到干扰开始晃动，美好的东西就看不到了，也看不到自己，连自己都看不到了、不认识了。\n\
  \n心也一样，动了就很难产生智慧，甚至做出冲动后悔的事。\n\n因为静的时候，大脑开始关闭，灵魂才有机会被唤醒。\n\n若大脑一直处在干活状态，处在世俗之中，智慧离你越来越远，因为此时你的直觉是关闭的，灵魂是沉睡的。现实中你睡着了跟死了一样，我想怎么弄你就怎么弄你。灵魂沉睡了跟死了也一样，现实世界想怎么蹂躏你就怎么蹂躏你。\n\
  \n守静的方式有：\n\n少说话、冥想、闭目、打坐、站桩、休息、请假、退休、归隐等，都可以让自己静下来。\n\n#### 1.4 接触灵性\n\n宇宙的本质是频率，频率会传导、传染，灵性的本质也是频率，高频，自然频率、宇宙频率，所以你会看到在城里悟道的人很少，深山老林、乡间田野的老者活通透的比较多，身边全是低频的玩意儿，怎么可能悟道？\n\
  \n##### 1.4.1 天补\n\n多看天空、多看云朵、多看星星，多晒太阳、多晒月亮，滋阴补阳。\n\n##### 1.4.2 地补\n\n多接触大自然，山山水水，花花草草，猫猫狗狗，最好自己种养。\n\
  \n##### 1.4.3 人补\n\n- **第一：** 多接触婴幼儿、强者，尤其是悟道级强者。\n- **第二：** 多看些灵性书籍：《道德经》《楞严经》等。\n\
  - **第三：** 还有愿意肯定自己、帮助自己、让自己愉悦、跟自己同频的人。\n\n以上也叫格物致知，格万物都能悟道，都能疗愈自己、强大自己、找到自己。天地与我并生，万物与我为一。道在瓦砾、道在蝼蚁、道在屎溺。\n\
  \n### 2. 人修\n\n#### 2.1 苦难\n\n##### 2.1.1 心不死，道不生\n\n- **第一：** 不经历痛苦不可能觉醒开悟，不经历痛苦不可能变得强大。\n\
  - **第二：** 人教人不一定学会，事教人一教就会。\n- **第三：** 痛得越狠，醒得越狠。\n\n##### 2.1.2 与苦难共存：躲不掉的苦难\n\n\
  整个世界的顶层设计就是众生皆苦，你往哪逃？往哪躲？\n\n该经历的众生相，你一个也跑不了，时间早晚而已。\n\n##### 2.1.3 没有苦难也要制造苦难\n\
  \n- **第一：** 只要在承受范围之内，自己主动随意去经历，多经历。\n- **第二：** 你经历的苦难，都是你能承受得住的，不然不会给你。\n- **第三：**\
  \ 好好利用苦难，体验苦难，享受苦难，一切皆有利于我。\n- **第四：** 苦难是为了不苦难，没办法中的办法，置之死地而后生。\n\n##### 2.1.4\
  \ 与苦难斗争\n\n苦难的存在既然这么合理、这么有必要，我们要逆来顺受吗？\n\n正好相反，要跟苦难干！与天斗、与地斗、与人斗，其乐无穷；不管天灾还是人祸都得干他，不斗争如何提升自我、磨练自我、找到自我？\n\
  \n逆来顺受，苦难的意义便不再存在，即：苦难，就是用来被干的，不管是谁给你带来了苦难，干他！这是它的命！\n\n学会敢于斗争是第一步，第二步是善于斗争，就得学习斗争的谋略和手段。\n\
  \n术无正邪，人分善恶。如果懂谋略，不管阴谋阳谋，就像有了核武器，谁敢跟你掀桌子死磕？\n\n即使把对方逼急，他顶多敢跟你小打小闹，那也心里发慌，不敢激怒你。\n\
  \n推荐一些书籍。\n\n**读书只读两样，古代的经典和古代的禁书。**\n\n经典是道，谋略是术，讲五个系列的谋略书籍：\n\n**第一：天下无谋之密卷八宗**\n\
  \n- 《仕经》：官场如何保全自身的前提，并还能做出点功绩。\n- 《解厄鉴》：如何利用人性的弱点拿捏人性，来为自己趋利避害。\n- 《止学》：把“止”这一个大智慧发挥到极致，让人取得胜利、获得荣光，并减少失败和耻辱。\n\
  - 《韬晦术》：是历代智谋人士的枕箱秘笈，是阴谋学的祖宗。\n- 《守弱学》：强弱之势是如何转化的人生圣经，如何让弱者变强、让强者变弱。\n- 《权谋术》：任何人际关系中的一些策略和手段。\n\
  - 《小人经》：如何定义小人、如何防范小人、如何战胜小人，甚至如何成为小人的坏人哲学。\n- 《罗织经》：千古第一邪书，文明史上第一部集邪恶智慧之大成的诡计全书。\n\
  \n**第一：千门八将。** 阴谋的祖宗，36天局72地局，千门出天下变。\n\n**第二：水滚珠局、绕梁还田局、三仙献鼎局现在天天都在上演。** 经常看新闻好多人被水滚珠局骗了。包括张艺兴主演的东南亚拐骗题材电影，不就是用了八将：正提反托风火除谣。大部分已失传，只找到一部分。\n\
  \n**第三：鬼谷子72术36策，纵横捭阖之术的鼻祖。**\n\n**第四：鲁班经。** 欲练此功，必先绝后，风水局。\n\n**第五：阴符经。** 观天之道，执天之行，尽矣。天有五贼，见之者昌。五贼在心，施行于天。宇宙在乎心，万化生乎身。\n\
  \n理论学完，重点就是实践了，第三步是积累斗争经验。\n\n硬干也是一种干，先干起来，斗争起来，以战养战，以斗争学习斗争。\n\n当你干出了乐趣，斗争出了乐趣，会发现别样洞天，获得很多。\n\
  \n#### 2.2 低欲望\n\n第一：嗜欲深者天机浅，欲望是人类顶层设计的一个陷阱，让你失去自己的有效手段，社会稳定有序的核心概念设计。\n\n**第二：回归生命本质。吃饱喝足穿暖即可，偶尔小改善一下。**\n\
  \n毛泽东的衣服带补丁穿一辈子，僧服道袍一辈子也就那两件。\n\n平时非必要什么都不要买，几十块钱的衣服、鞋穿几十年很正常，出行需要的只是一个代步工具，住是刚需，买房可不是刚需，**柴米油盐才是刚需，阳光空气才是刚需；**\
  \ 买房是陷阱，如果买房之后能够产生正向现金流，不管是卖掉还是租掉，可以买。\n\n大部分买的房子就是个负债，给你放血的管子，买房不就是租了七十年。\n\n####\
  \ 2.3 不负债有存款\n\n##### 2.3.1 不要负债\n\n一旦负债，灵魂就跪下了，再也没有机会觉醒开悟；除非你是很清醒地把负债当成工具：利用负债可以赚钱，有钱人的负债是资产、是前景、是工具，但普通人的负债就是负债。\n\
  \n如果已经负债的：\n\n**第一：必须还债。**\n\n第一时间通知给债主，自己不会赖账，具体下一步的挣钱计划、地点、还款计划都告知他们，让对方放下心，更不用催债。\n\
  \n**第二：个人状态调整。**\n\n负债前后你的生命状态没有发生任何变化，也就是生命本质没变。负债之前该吃吃、该喝喝、该睡睡、该找点事干去干，负债之后还是该吃吃、该喝喝、该睡睡、该找点事干去干。负债对于你从生命本质角度上不存在。\n\
  \n**第三：你是有灵魂的，只是肉体负债，不是真正的你负债。**\n\n**第四：负债是来渡你的，一切发生皆有利于我。**\n\n虱子多了不痒，债多了不愁；愁的不是你。\n\
  \n- **第五：** 负债几十万的可以通过上班解决，几百万以上负债的还得通过创业。\n\n##### 2.3.2 存钱（守财之道）\n\n打江山容易，守江山难；赚钱容易，守财难。\n\
  \n但凡发了财，必然开始不装了，这种不装是人性被压抑 N 年后需要释放的你；这种不装，是无任何防御心态下的你；这种不装，是没有经历太多人性黑暗和人生磨难自以为是的你。此时的你，不听劝，一般都会乱投资、乱理财、乱消费、乱创业、乱借钱，甚至乱践踏道德和法律。\n\
  \n- **第一：** 存款可以不多，但必须有。你得活着，你家人得活着，且手有余粮心不慌，活着踏实些，更何况钱能解决 99%的问题，存款是解决问题的绝佳手段。不一定要大富大贵，最好能小富即安。\n\
  - **第二：** 谈钱不是俗，没钱你还活啥？没钱科技如何突破？没钱如何有实力提升人类福祉？悟道级强者除了出家修天道的，哪个不是善于利用钱、善于挣钱的人？毛泽东不谈钱怎么打仗，怎么建立国家，怎么给百姓谋福祉？谈钱不寒碜，普通人挣钱为了混口饭，悟道级强者搞钱为了人民、为了社会、为了天下大同。\n\
  - **第三：** 世界上除了你自己能给自己存钱，其他人或组织都在觊觎你的存款。你的存款是银行的负债，你的负债是银行的资产；你的负债是精英主义阶层的负担，你的负债是精英主义阶层的钱包；包括你的父母你的孩子，你的存款是他们的吸血包。所以你不存款、不保护好存款，命运里只剩下唾弃。\n\
  - **第四：** 存钱会越存越上瘾，而且越存越抠，隔三差五地会看看存的数字又涨了多少。至少对自己越来越抠，只对最亲近的人大大方方。一般人只会越穷越大方，因为穷人不懂得合理用钱，怜悯心还重，所以穷人的钱好挣；而且门槛低，穷人越穷；财发狠心人，尤其底层杀出的富人很无情，见多识广不好骗，跟奥运会体育竞技一样，有钱人是搞钱花钱专业运动员，钱花得不合理在他们的潜意识层面是污点，所以富人的钱不好挣，专业门槛高，富人越富。\n\
  - **第五：** 原则上不借钱给任何人。瞎往外借钱的，借出来的是仇人，人财两空，他自己不正干不存钱还欠债关你鸟事；哪个普通人不是省吃俭用存的钱，不是拼了半条命存的钱，不是为了一家老小存的钱，难道你存款就是为了借钱给他？救急不救穷＋长期对你好的最亲的人＋口碑信誉好，三个条件都满足，除此之外一律不借，直接一万个理由等着拒绝他，拒绝人还不简单。\n\
  - **第六：** 没存钱的赶紧存，勒紧裤腰带也得存。200 万以内不要考虑理财，存银行；鸡蛋要多放几个筐里，做理财组合、投资组合，千万别放一个篮子里。创业投资，永远只拿出不超过存款的一半去做人生尝试，投资投的主要是人，投人就要先调查这个人，咨询跟他最近共事的熟人。\n\
  \n#### 2.4 长效生存之道（商业思维+生存模式）\n\n长效生存之道：获取能踏实活到死的生存保障。\n\n这是幸福的前提，幸福是每个人一生最重要的事，所以获取长效生存之道是每个人一生最重要的事，从小就要为此奋斗终生，所做一切都要围绕此开展。\n\
  \n现实是，这么重要的理念 90%的人到死都不知道，这是故意设置好的障。\n\n##### 2.4.1 长效\n\n\n\n可以跨越时代，跨越经济周期，不用被淘汰，不用经常换行业，一辈子围绕一件事，如如不动，能够踏实地活到死。\n\
  \n世界上只有两种工作，一种不会被淘汰，一种随时会被淘汰。90%的人做的事是随时会被淘汰的，不管你是知名企业家，还是高学历，没有悟道就是时代需要时被驯化出来的一条狗，狡兔死走狗必烹。\n\
  \n比如煤老板辉煌十几年，好多都没了吧，破产、进监狱、流亡海外等等；开发商老板辉煌了十几年，好多都没了吧；互联网大佬辉煌了十几年，好多都没了吧。大学生哪怕是985/211毕业的高材生，大部分学的专业都具有时效性，有的可以干十几年，有的就几年，甚至有些大学毕业即失业。因为行业或者开设的专业，都只是时代对应需要，不需要时一夜之间一刀切完。大部分人是典型的有术无道，止于术，都不是悟道级，只是社会需要的一条狗。所以赚钱的第一步必须对学历、社会地位、权威等祛魅，他们都是狗而已，短暂辉煌的狗。\n\
  \n一个行业一个专业的落幕，是必然，是天道，也是人道，但这恰恰也是千千万万个老百姓和大学生需要从头开始的操蛋人生。所以，想要幸福就必须找到适合自己的长效生存之道。\n\
  \n##### 2.4.2 生存\n\n- 第一：回归生命本质，活着就是混口饭吃，是生存底线。\n- 第二：绝不是为了发大财，但可以发大财。**钱是工具，不是枷锁。**\n\
  - 第三：在生存面前，道德和法律都没有力量。\n\n###### 生存方式有三种\n\n- **第一：上班。**\n\n  但世界上靠上班生存的人只有50%左右，上班期间你去商场会发现人是满的。在很早的农村，大部分人都没工作才是常态。\n\
  \n  是城市需要工作，城里的人需要工作。如果农村的人都去上班了，城里就会被养出一大批不用上班的人；总之整体上会维持50%左右的社会群体是上班族，且这50%里的90%，会不断换工作、换公司、换行业。\n\
  \n  因为科技发展，发展越快，大家被淘汰被替代被更换的概率和频率越高。\n\n- **第二：创业。**\n\n  但常规的创业思路的结局是九死一生：给社会纳税，给房东交房租，给员工发工资，但最终一定是要么快速赔钱死掉，要么吹泡沫玩得久一点迟早还是破产。其实创业可以九生一死，下面会讲到。\n\
  \n- **第三：资源性资产。**\n\n  自家的宅基地、农田、山头、水井，中心区域可对外出租的全款房产等。有了这些资产，可以对抗经济周期，在别人收入锐减时，自己依然旱涝保收；有了这些资产，可以安享晚年；有了这些资产，在关键时刻比黄金金贵；有了这些资产，可以选择躺平，不用工作，踏实地享受活着。\n\
  \n  但绝大多数人一辈子也不会有这种意识，相反被替代的意识是搞资产配置：比如股票、期货、房产等，很多人把农村的农田和宅基地卖掉、户口迁出，殊不知，自己掉入了一场围猎自己的资本游戏，从此变成了无根之木，僵尸一样的活着，随风漂浮。\n\
  \n##### 2.4.3 赚钱思维\n\n###### 2.4.3.1 赚钱的六个本质\n\n- **第一：卖广告。**\n\n  推销自己或产品时，做产品不是第一、服务不是第一、经营管理不是第一，会叫卖产品、会叫卖服务、会叫卖情怀，会叫卖才是第一位。卖广告就是包装，包装就是有的可以夸张，没有的可以说有；不管是世界五百强，还是奢侈品牌，不管是卖房子卖车卖化妆品，本质全是如此。卖广告是营销的核心部分，普通人做生意成功率最高的是销售出身、营销出身。\n\
  \n- **第二：掠夺。**\n\n  如何利用人性合法合理的把别人的钱变成你的钱。\n\n  因为世界上的钱总数是一定的，凭什么你的钱越来越多？就是别人的钱越来越少。尤其是垄断，就差大张旗鼓地说：把钱都给我，不给我也得给我！\n\
  \n  那些金融大鳄被称为神，背后的秘密就是信息垄断、资源垄断、市场垄断，你在那个位置你也是神。所以要对那些大神祛魅，要对赚钱的心态变狠不能仁慈，要对自己的手段进行升级：野蛮手法、侵略手段。\n\
  \n- **第三：复制。**\n\n  熟人挣钱愿意带你你就复制，养一头牛挣钱就复制养两头养十头，摆地摊一个挣钱就摆两个摆五个，别人的思想别人的文案火了你就复制，做一个账号挣钱那就做两个做十个……复制的成本最低、效率最高，当你复制到一定程度自然会开窍，一通百通。创新是最可贵但也最难，普通人的灵性被打压很难有创新，复制是普遍成功道路。\n\
  \n- **第四：利用人性下坠的力量。**\n\n  因为整个世界的设计就是人性下坠，让本有的灵性下坠、兽性下坠，尤其是通过新驯化的人性，是经济业态的普遍现象，比如房地产、医疗、教育、美容、婚姻、烟酒、淘宝拼多多等，人性下坠的力量里最核心的是情绪相，通过影响、调动、调研、改变普通人的情绪来设计盈利模式，比如短视频。除了科技探索、光辉思想等为了天下大同的是人性向上的力量，其余全部是利用人性下坠的力量挣钱。\n\
  \n- **第五：造神。**\n\n  也是降维打击，人跟人沟通总会出问题、总会质疑、总会争吵。既然全体的人性已经下坠，那我做生意把自己提升，升高成神。比如产品神化、人物神化、品牌神化：\n\
  \n  请神一样的明星代言、写出神一样的销售话术、挂一堆神一样的信任背书、屌丝逆袭成神的活生生案例诱导、神一样的地区引来的产品等等……\n\n- **第六：成就别人。**\n\
  \n  以上五个都是术，都很残酷，我最推崇这最后一个。需要发现问题，并提出最优解决方案。想搞定客户就得先发现客户的问题，对症下药投其所好成就对方，你就可以挣客户的钱；发现了社会的问题，并提出解决方案，成就了百姓，你就有机会挣全社会的钱；发现下属的问题并助力其提升，下属升职加薪的越多越快，你升职加薪的速度也就越快。总之想挣谁的钱，想通过谁挣钱，就得先成就谁。\n\
  \n###### 2.4.3.2 挣钱的四种主要手段\n\n- **第一：出卖劳动力。**\n\n  90%的人靠出卖劳动力赚钱，劳动力的时间有限，所以挣钱也有限，大部分都是底层穷人，少部分可以凭借专业过硬+持久的耐力，可以赚足养老钱，但发不了大财，以下三种可以发大财。\n\
  \n- **第二：靠知识。**\n\n- **第三：靠钱生钱。**\n\n- **第四：靠资源性资产。**\n\n##### 2.4.4 如如不动之道\n\n\
  时代动我不动，时代变我不变，敌动我不动，敌变我不变。我做的事永远不变，让时代变成我的工具，让行业变成我的工具，让专业变成我的工具，让敌人变成我的工具。\n\n\
  ###### 2.4.4.1 长青行业\n\n只要人类还存在，就需要的行业；两个类型。\n\n- **第一：人类刚需行业。**\n\n  比如出生、死亡和中间的吃喝拉撒，相关行业有：农业、餐饮、殡葬、性爱。比如农业，可以倒卖蔬菜、倒卖中药，租冷库或者自建冷库，在收获季节大量收购价格最低的蔬菜，冷冻起来，到年底等价格高时卖出。\n\
  \n- **第二：天下大同需要的行业。**\n\n  务实的有：信息科技、生命医疗科技、人工智能科技、军工科技、能源科技，务虚的有思想、文化、教育。\n\n \
  \ 专注以上任何一个行业，单点击穿，做到行业专家，会发现新大陆。\n\n###### 2.4.4.2 换工具公式\n\n每个时代都有不同的赚钱工具，电脑、手机，尤其是手机互联网出现后，手机变得比亲爹都重要，所以要人机合一。\n\
  \n手机就是你，你就是手机，生存得靠手机，挣钱得靠手机，发展得靠手机。\n\n手机互联网也经历了时代变化：电商-微商-知识付费-短视频……\n\n比如小镇舍长，思想知识博主，电商时代就以电商需要的图文形式在电商平台挣钱；到了微商时代就以微博微信公众账号微信等平台需要的文字形式挣钱；到了知识付费时代就以知乎得到等平台需要的文字和语音形式挣钱；现在到了短视频时代，就以短视频的形式在短视频平台挣钱，等七老八十了换成了那个时期的工具平台，就以那个时期的规则和形式挣钱即可。但小镇舍长一直用的都是相同的知识，做的从来都是思想文化这一件事，如如不动。\n\
  \n###### 2.4.4.3 换汤不换药公式\n\n但凡做一件事做到极致并拿到结果，就会发现万事相通，万变不离其宗。\n\n整个世界都是根据人性演化而来，人类所有行为的的背后都是人性。\n\
  \n比如小镇舍长，以前做的是地产营销管理，营销的是人性，管理的是人性；现在哲学思想、心理健康很火，哲学讲的就是人性，心理问题就是人性问题，所以把讲地产、营销、管理相关的概念，都换成关于哲学、思想、心理、精神的即可；如果下个时代又不流行哲学改流行其他行业了，那就把讲哲学思想的、讲地产营销管理的改成流行的那个行业即可，换汤不换药，如如不动。\n\
  \n###### 2.4.4.4 换服务对象：四优势公式\n\n事业选择公式：优势过往+优势性格+优势行业+优势工具。\n\n优势过往指的是你的工作经验优势或背景优势。\n\
  \n优势性格指的是你的性格特点或爱好。\n\n优势行业指的是对应时代的朝阳行业，现在比如：**老年、宠物、女性成长、身心灵、中医、新三农、科技等等**。\n\n\
  优势工具有电商、微商、知识平台、短视频、AI、Web3.0。目前短视频最火。\n\n具体案例：\n\n- 第一：比如你是中小学生的英语培训老师，小孩生意不行了。你可以：英语培训+老人+短视频。\n\
  - 第二：比如你是建筑设计师，给人盖房子的地产不行了。你可以：建筑设计+宠物+短视频。做迷你的宠物公馆，给宠物盖房子。\n- 第三：比如你擅长聊天，你可以：聊天+老人+短视频，你说话不火，退休干部退休高知说话会火。\n\
  - 第四：比如你性格有点娘，擅长运动，你就可以：运动+娘到极致+短视频；娘到极致的篮球运动。\n- 第五：比如你做哲学心理学，喜欢表演，你就可以：夸张演绎+心理学案例+短视频。\n\
  \n###### 2.4.4.5 换地点\n\n降维打击，从高维的国家、高维的城市，把落后的项目带到低维的地点。\n\n- 第一：比如沿海城市淘汰的行业，搬到落后的内陆、搬到落后的东南亚等地区。马云不就是把美国的电子商务和支付搬到了相对落后的中国。\n\
  - 第二：比如地产行业前十年在中国很挣钱，现在不行了，但东南亚国家会效仿中国的发展模式，在初期搞地产就会挣钱，东南亚搞完了开始搞中亚国家，比如现在的吉尔吉斯斯坦，地产行业刚起势，利润非常高。\n\
  - 第三：比如跨境电商几年前搞欧美市场，用的是速卖通和亚马逊；现在搞一带一路沿线国家的市场，结合 TikTok 来做，正处于红利期。\n\n总之，你如如不动，你做的项目不变，换地点而已。\n\
  \n###### 2.4.4.6 换心态\n\n以前的工作心态是追求稳定，追求发展。但总有一帮人看透了游戏不想那么辛苦劳累，不想追求功名利禄，只想混口饭吃的同时，好好体验人世间。\n\
  \n这时，换心态即可：什么工作无所谓，工资只要差不多就行，体力活脑力活均可，挣点钱就休息一段时间，比如干半年休息半年，干两年休息一年；工作的目的不是为了内卷，不是为了勾心斗角，更不是为了发大财，就是玩，混口饭吃的去玩去体验。甚至列好计划，想去哪玩就去哪工作，想体验啥行业就去干什么工作，除了体验还是体验，体验感不好就换，体验腻了就换。\n\
  \n心态一直都是如此，如如不动。\n\n##### 2.4.5 沉淀法则\n\n老子经过沉淀，有了道德经；佛陀经过沉淀，有了楞严经；毛泽东经过沉淀，有了毛选……有了沉淀，才有你看到的所有知识和智慧。知识就是财富这句话，就是表面意思，不是学习了大学知识去赚钱，不是学习了技术去赚钱，而是你做的任何事任何思考痕迹，留存下来，连续留存，沉淀成有规律的知识体系输出出去，就是财富，而且是真正的财富，持续的财富，哪怕是种地也可以沉淀！未来将是内容为王的时代，只有沉淀才能形成系统性内容。\n\
  \n不管是创业还是上班，不管是靠劳动力、靠知识、靠钱还是靠资产赚钱，想做到极致，想做成专家水平，想让自己变成规矩，想让钱变成自己的工具，就必须拥有沉淀的能力，沉淀出属于自己的专业知识体系，沉淀成自己的生存逻辑体系，沉淀成自己的发家致富体系。届时你就是时代本身，你就是规矩本身，你就是人情世故本身，你就是财富本身。\n\
  \n掌握沉淀法则，主心骨强，不随波逐流，方可如如不动，也更容易找到自我，不易迷失。\n\n###### 沉淀三步走\n\n**第一步：记录**\n\n刻意练习出记录的习惯，不管你做任何事情，都可以把心得体会以及过程进行记录和总结，这是独一无二属于自己的资源。\n\
  \n记录的方式：文字、语音、视频。\n\n能锻炼出总结的能力和文案的能力：说话办事能一针见血总结出重点，文案将是信息文明时代极其重要的财富资源。\n\n**第二步：输出**\n\
  \n总结出来的内容得想办法传播出去，温故而知新，费曼学习法。\n\n输出的方式：讲给别人听，发表到群里、开会期间阐述、短视频或文章发表。\n\n别管对错好坏，只有往外输出展示自己，才有更多露脸头角的机会，是检验自身理论的第一步。\n\
  \n**第三步：实践**\n\n实践出真知，理论是行动的翅膀，实践是检验理论的唯一标准，实践是完善理论的唯一方式，实践是唯一可以取得结果的方式。\n\n通过这三步，最开始输出的只是碎片化的知识点，时间一长回头一看，那些被记录的痕迹，发现了规律，点开始连成线，再连成面，最后形成体系。掌握了沉淀的力量，傻子都有机会翻身：当年的犀利哥，要饭的，被记录下来，输出了出去；现在好多傻子或者守村人被记录了下来输出了出去都能火起来；种地的农民把种地的知识和过程记录下来并输出出去，就可能会火；养个小动物记录下来过程和心得体会并输出出去，就可能会火；幼儿园老师把教育小孩的心得体会和过程记录下来并输出出去，就可能会火……\n\
  \n小镇舍长在职场做职业经理人两三年，通过沉淀法则，27岁独创出地产圈新的管理体系和营销模式：《地主营销思维》《野蛮式营销管理》；做短视频输出哲学思想亦如此，前五个月大量碎片化的观点输出，在输出过程中不断解决粉丝观众的问题，最后发现了观点之间内在的联系，形成了今天这本书《给我一颗原始星球》/《三修》。\n\
  \n所有的知识、智慧、天赋爱好、事业等等，都是在大量的记录、大量的输出、大量的实践中，它自己冒出来的。\n\n###### 沉淀过程中需要的品质\n\n- 第一：笃定专注，单点击穿。\n\
  - 第二：抗住诱惑，死战不退。\n- 第三：每日精进，日拱一卒。\n\n##### 2.4.6 创业\n\n###### 2.4.6.1 每个人都有一个创业梦\n\
  \n- 第一：国家是创业，家庭是创业，开公司是创业，给你一个原始星球更是创业，找到真正的自己是精神创业，人生无处不创业，没有创业思维大概率被奴役，再说有几人想一直寄人篱下？\n\
  - 第二：大部分人不可能上班一辈子；更不可能被别人包容一辈子，什么时候都没有比靠自己来的最踏实。\n- 第三：别把创业看的高高在上，看的那么玄乎，别听有人说你不适合创业，种地都算创业，养猪养鸡养猫养狗也算创业，摆个摊也算创业，用手机倒卖东西也算创业，30年前农村家家户户都没工作都在创业，很多人确实不适合做大做强，但不适合创业这句话是伪命题。\n\
  - 第四：创业是原始生命力，没有创业的心，活着根本不踏实，原始阶段每个人都是老板。\n- 第五：创业最核心的就是：根据人性，大力出奇迹。别人干一次成功你就干两次，别人干五次你就干十次；失败了就去上班，攒点钱继续创业。\n\
  - 第六：创业是一种生活方式，绝不是刻意赚钱的工作。\n- 第七：在真正创业者眼里，从来没有失败，只有经历和经验。\n- 第八：创业不是准备好了才开始，因为没有实战永远也准备不好，想的再周全也会遇到问题，创业就是冲动一下的事，一咬牙二跺脚，就是干。不管会不会、行不行、合不合流程，先干，干的过程中遇到啥问题解决啥问题。\n\
  - 第九：创业当然有风险小、周期短、成本低的公式，不然就会进入顶层设计的陷阱导致九死一生。\n\n###### 2.4.6.2 创业四大思维：倒卖+手机互联网+轻资产+卧底\n\
  \n当下经济环境下，实体经济只适合政府、社会和资本去玩，普通百姓别碰这种重资产，开个实体店也容易死。\n\n普通人可以做服务实体的业务，或者第一步通过玩转互联网流量后第二步再碰实体，除此之外要么就只做虚拟经济。\n\
  \n**倒爷思维**\n\n- 第一：倒卖，只做渠道只做流量，流量永不过时。以后是消费者时代，只要有流量就掌握了消费端，工厂随便你挑。\n- 第二：倒卖是最赚钱的生意。国家倒卖地皮，银行倒卖钱，马云做了个线上倒卖平台，王健林开商场是线下的倒卖平台，小镇舍长做知识博主倒卖的是大脑里的知识。倒卖的量没有上限，但自己生产、养殖、种植等都有规模限制。\n\
  - 第三：倒卖回款周期最短。倒卖出去多少货，挣多少对应提成。\n- 第四：倒卖成本最低，甚至零成本。只需搞定客户端流量，前期不需要投入生产、租赁、装修、员工等各项成本，后期有了资本想玩产业链时再投入不迟。\n\
  - 第五：倒卖的产品可以是实体产品，比如衣食住行吃喝拉撒等等，也可以是虚拟产品，比如资料、课程、会员等。比如倒卖蔬菜、中药材，都有淡旺季，收获季节最便宜的单品，采购回来，放入冷库，在旺季价格走高时卖出，冷库前期租赁，后期自建；再比如倒卖宠物猫，只要能掌握短视频至少几千粉丝的流量或者线下宠物店资源，每年的利润也很惊人；再比如近些年精神内耗的人较多，倒卖身心灵疗愈的资料和课程，入口有电商平台、U盘、短视频等。\n\
  \n**手机互联网思维：人机合一**\n\n用互联网尝到甜头的个人，一般不想再去上班，在哪都能挣钱生存，什么时候都可以挣钱混口饭吃，那种美妙，无法言喻。\n\n\
  - 第一：现在不管企业还是个人，想要发展必须紧紧跟随时代，除了垄断行业，只要不使用互联网，只要不做短视频，发展必然受限，市场必然被蚕食。\n- 第二：除了黑五类，都能在手机互联网上倒卖。\n\
  - 第三：人机合一：空闲时把时间全部放在研究如何用手机赚钱上，从倒卖身边的资源开始做起，所有流量高的手机App下载一遍，每天大量输出、上传；研究摸索平台规则；手机就是你的未来，实际上就是你的命，手机就是你。\n\
  - 第四：小而美：以前的经济模式是集约化，以后会反过来：以小而美为主。以后个人IP比一般企业利润高将是趋势；除了个别行业，以后没有个人IP大概率生存状态堪忧。\n\
  - 第五：互联网是自我保护最好的武器，一个IP干掉一个企业、干掉一个区域的口碑、干掉一个官员、干掉竞争对手，将是家常便饭，有钱有势不如有IP。\n\n**轻资产思维**\n\
  \n创业根本不需要花钱，或者花小钱办大事，空手套白狼这句话倒是家喻户晓，现实却是背道而驰，基本都是砸钱创业。\n\n你要知道普通人挣钱攒钱是真不容易，创业一把就梭哈没了，这种逻辑肯定不对。\n\
  \n零成本或轻资产的核心：**倒卖+互联网。**\n\n举例如下：\n\n- 第一：小镇舍长爱人娘家的兄妹三人都做宠物生意，全部都是倒卖+手机互联网，客户打定金和尾款时再把定金尾款打给上游养户，不花钱，一部手机即可。\n\
  - 第二：一高中粉丝，喜欢写爽文，每个月赚8000元左右，每天幻想的各种画面连载到学生微信群、QQ群、公众号文章、小说平台、语音平台、短视频平台，不花钱，一部手机即可。\n\
  - 第三：在农村倒卖成熟季节价格洼地的中药材、蔬菜、药膳等产品，低成本、高收益。不能像老农民那样只知道低头种地，学会抬头看天看市场很重要。\n- 第四：用《地主营销思维》给有场地的企业赋能，客户流量和消费增加，企业利润增加，只是免费把场地和资源共享出去，进行的资源整合，你从中就可以做赋能公司、策划公司，或者实体企业营销改革自营，不花钱。\n\
  - 第五：小镇舍长给地产企业做培训和战略咨询，都是企业包吃包住，报销路费，讲话很客气和尊重，从不拖欠顾问费培训费，不花钱。\n- 第六：小镇舍长做短视频，没有幕后团队，没有买各种设备，没有报各种班，没有投抖加，不花钱，一部手机即可。\n\
  \n**卧底思维**\n\n- 第一：绝不贸然进入未知领域。创业之前必须对本行业绝对熟悉，要么熟人带，要么自己去这个行业卧底。\n- 第二：上班就是为了离职，按照创业的标准掌握核心环节、整合资源，出师后辞职即可。\n\
  - 第三：卧底时间一般2-6个月左右，具体看自己偷师学艺进度。卧底时的岗位选择：运营岗、财务岗、销售岗优先，能掌握全流程。\n\n###### 2.4.6.3\
  \ 精益创业模型\n\n创业不是一上来就大规模，搞品牌，搞管理等这些重资产和虚头巴脑的事，这是误区是陷阱。\n\n而是以能跑通全链条的最小模型开始，投入最少，周期最短，试错成本最低，普通人创业要的是稳。\n\
  \n- 第一：调研。做生意不是想当然，不是主观的异想天开，需要以事实为依据，以数据为支撑，这就需要调研。调研是一项很专业的商业行为，但是大部分人不知\n\n不知道调研、不懂得如何调研。跟打仗一样，不知己知彼，两眼一抹黑，等死去吧。\n\
  \n- **第二：单个产品的生产、包装、销售、售后闭环。** 以最小成本搞出样品，拿到市场让消费者去验证，不惜一些手段推销出去。\n- **第三：人员、场地、公司注册、财务等公司的基本运营，在开公司之前不是重点，等上述环节跑通，再傻瓜式操作即可。**\n\
  \n###### 2.4.6.4 合伙投资创业\n\n很多人创业大概率都会经历合伙一事，要么是自己作为创始人创业，要引入联合合伙人，比如资金合伙人、技术合伙人、资源合伙人等其他的能力合伙人；要么是你作为联合创始人，加入熟悉之人的创业项目。\n\
  \n- **第一：自己创业不要找最亲的人，亲兄弟也大概率反目；如果找了，切记只做成就对方的动作，多余动作不要做。**\n- **第二：不要三个人，很容易形成二对一，有一人极容易散伙出局。**\n\
  - **第三：作为联合创始人投资创业，可以入资金股，尽量不要入人力股，即：不干预不参与决策。**\n- **第四：投资之前询问与他近期跟他接触比较深的人，多年不见的熟人，突然找你投资，大概率是个坑。**\n\
  - **第五：如果是项目开始后邀请你加入，必须调研此项目：看历史财务报表，拿不出来就是坑。**\n- **第六：要签订合伙协议，明确责权利，明确股份多少有行业公式，明确退出机制，好话丑话都说前头。**\n\
  - **第七：每日公布电子系统的财务数据。**\n- **第八：不要加杠杆：借钱或贷款入资。**\n- **第九：不知根知底、不能找到其个人财产住处的不要投资，出了纠纷拉黑你分分钟，不要相信法律维权。**\n\
  - **第十：在商言商，不要掺杂情感，感情用事对生意是累赘是隐患。**\n- **第十一：初期先意思一下，赚了再继续跟；发现情况不对，钱也不多，就当陪兄弟玩了，也让自己开始接触创业，给自己未来布局，是找到未来出路和退路的一种方式。**\n\
  \n##### 2.4.7 如何做短视频？\n\n###### 2.4.7.1 心态\n\n- **第一：** 大胆点，每天展示自我活出自我，就去演讲就拍短视频，让喜欢你的人开心一整天，让讨厌你的人难受一整天，恶心不死他。\n\
  - **第二：** 每个人怎么活的说不清道不明，他自己都不知道，都是跟着感觉先说服自己的一套总结而已，比如我说的这些。你就是答案本身。\n- **第三：** 身边的人都是以看你笑话为主，所以一般人会不好意思，这样的人就是智障！看不起你想看你笑话的人，你还在意？\n\
  - **第四：** 坚持。大部分做不到，不是大部分人不适合做短视频，大部分人不适合做大部分事，因为坚持不了。都是一时兴起，热三天，或者干一俩月没效果就跑了。\n\
  \n- **第五：只管好自己。** 只管自己怎么拍摄、剪辑、文案创作等等，只管自己怎么做即可，向内求。不要管平台啥规则、粉丝会不会涨会不会黑自己，那是平台的事，是别人的事。\n\
  - **第六：先干起来。** 具体内容、细节在做起来之后慢慢调整，养成执行力大于一切的习惯，养成以战养战的思维，管他三七二十一，就是干，干就是答案。\n\n######\
  \ 2.4.7.2 人设\n\n- **第一：** 人设指的是最自然的你，符合自己规律、自己频率的状态的你。具体包含你的性格、所呆的地方、做的垂直内容、曾经的过往、你的爱好等等。不管是真实的你虚伪的你，搞笑的你严肃的你，简单的你还是复杂的你，总之必须自然流露出你最真实的一面。尤其是如今的社会，真实真相真理，才更容易火。\n\
  - **第二：** 但凡人设不真实自然，事情就会变得非常用力，一件事但凡需要特别用力、一直用力，好比谈恋爱、好比做项目、好比学习，特别用力就说明不合适。结局早晚崩掉，即使不是公开性的塌房，私下早晚也得出事。宇宙守恒，拧巴了就得拧回来直至不拧巴为止。只要内核稳定保真，可以适当加入修饰性的艺术成分，比如夸张、美颜等等。\n\
  - **第三：** 可以出镜也可以不出镜，可以配音也可以自己口述，看自己擅长哪一种方式，有些人出镜就会掉粉，不一定非得出镜，只是建议尽量出镜。出镜的优势之一是露脸才能形成IP；出镜的优势之二可以在镜头面前展示的方式更加丰富。\n\
  \n###### 2.4.7.3 流量\n\n流量的核心是情绪。\n\n- **第一：一切动作都是围绕情绪展开。** 因为短视频平台就是奶头乐，是以娱乐性为地基的平台，娱乐的本质是提供情绪，没有情绪谁还看？绝大部分都是闲着没事了才打开短视频打发时间消遣。学习型的平台那么多没有一个有客户粘性，来短视频平台可以学到东西挺好，但绝不是为了学习才来短视频平台。\n\
  - **第二：流量主要指的就是乌合之众的情绪，是普罗大众的情绪，是被编程被驯化成的狗的情绪。** 真正有智慧的人，尤其是悟道之人很少，形成不了流量，他们自身有足够的智慧，也没什么情绪，更不需要成为谁的粉丝，很难被人类玩的情绪游戏所诱导。\n\
  - **第三：所以如果小镇舍长哪天成了大 V，请一定远离。** 曲高必然和寡，不被封杀就不错了，还会让你成为大 V？真相不可能被多数人认可，真相也不允许被多数人认可；好比钱多了还是自己的钱吗？粉丝多了还是自己的粉丝吗？声音越大越只是情绪，越远离真相；小镇舍长是来玩的，他火不了更不想火，粉丝多了就不好玩了。\n\
  - **第四：** 通常流量分为泛流量和精准流量。有两个误区：一种博主走泛流量路线，粉丝很多但变现不行；另一种博主只认精准流量，认为泛流量没价值。首先这两种路线都可以跑通，关键找到自己适合哪一种，自己做的事适合哪一种。比如娱乐博主的粉丝以泛流量为主，做垂直类目货品的主播以精准流量为主等等。\n\
  \n###### 四个情绪种类\n\n- **第一：** 驯化出的人类情绪大概有 20 多种，最能快速引起流量的大众情绪有四种：愤怒、同情、猎奇、开心。\n-\
  \ **第二：** 讲真相的博主利用的是大家的愤怒，提供的是愤怒；拍摄老弱病残的人和动物包括农民农村利用的是大家的同情，提供的是同情；探险、炫富、玄学等利用的是大家的猎奇，提供的是猎奇；小杨哥、大圆哥等这种博主利用的是大家的开心情绪，提供的是开心。\n\
  \n###### 八个情绪开关\n\n- **第一：** 可以展现情绪的八个开关：**声音、文案、背景、音乐、穿着打扮、表情、动作和剪辑手法。**\n- **第二：**\
  \ 要发现自己的规律开关，有些人凭声音、语速、语调就可以展现情绪火起来，比如小镇舍长；有些人文案能力很强，优美的文案、炸裂的文案、搞笑的文案；有些人是技术流，剪辑手法很专业，能剪辑出目标人群所需要的情感，比如李子柒；有些人表情丰富，有些人动作有特色。\n\
  - **第三：** 具体比如声音，一个人中了大奖 100 万，他平静小声的说我中奖了，你是不是会认为他中了一块；如果中了一块钱，但是他非常亢奋手舞足蹈的大声说我中奖了，你是不是会认为他中了一百万，声音就是情绪！\n\
  \n###### 前 2 秒法则\n\n所有人刷短视频就是刷，极短的情绪刺激，前两秒不能吸引他，就刷过去了。所以前两秒必须要展现出情绪，可以在视频开头用任意一个情绪开关达到效果，也可以把整个视频中最有情绪的两秒剪辑到视频开头。爆点前置。\n\
  \n###### 四大内容来源\n\n做短视频的重点就是把内容当专业朋友圈发，专业朋友圈：把你的注意力全部用在当下做的短视频上，任何你能利用上的都可以作为当下所做的短视频素材，任何你做的每件事、遇见的每个人、脑子里的每个想法、都要跟做的短视频产生连接，哪怕是随意跟人聊天时的内容、吃顿饭、拉泡屎，都可以作为素材的灵感来源。\n\
  \n天不能白聊、饭不能白吃、屎不能白拉。\n\n素材的来源有四个：过往经历、当天经历、自我学习、蹭五个热点。\n\n- **第一：过往经历。** 以前最擅长、最熟悉、最感兴趣的事情，比如自己的职业、自己的爱好、自己的家乡、自己的家庭、自己的圈子等。\n\
  - **第二：每日感悟。** 新的每一天，你都会有新的感悟新的想法新的轨迹新的圈子，这些都是素材来源。\n- **第三：自我学习。** 为了做短视频肯定要每天坚持学习，看书、向别人请教、看短视频等等学习中的感悟都是素材来源。\n\
  - **第四：蹭五个热点。** 五个热点分别是：蹭历史热点、蹭名人热点、蹭政治热点、蹭当天热点、蹭人性热点。蹭热点时必须是自己的内容+热点，比如健身+热点，宠物+热点，哲学+热点，单纯的讲热点蹭热点会把账号作废，自己跟寄生虫一样。比如怎么蹭人性热点，包括婆媳、出轨等热点人性话题，再比如如何蹭政治热点，每个人都很关心政治，因为都生活在政治环境里，这是最敏感的话题，最容易引起情绪的话题，在初期完全可以使劲蹭，没流量时平台不会管控你的言论，后期火了再删除或隐藏敏感话题即可。\n\
  \n###### 大力出奇迹\n\n- **第一：** 所有事都是干出来的，需要经过无数次的干的积累，量变必然质变。想干赶紧去拍，墨迹啥。\n- **第二：**\
  \ 现在都是专业选手入场、知名人物等大咖入场，但是流量已经到了顶峰。流量有限竞争对手越来越多越来越比自己强大，此时的你凭什么涨粉？凭什么脱颖而出？只有拿生命做事业、拿生命博一次短视频的机会。别人一天发一条，你就一天发二十条五十条，乔乔在上海这个博主十几分钟一条视频，不管走到哪不管什么时候，有灵感了就发，活着就是为了发短视频。\n\
  - **第三：** 做事情只分天赋型和大众型两种人，大众型只能靠量、靠干，傻干硬干才有机会有存在感。普通的你没资格思考如何干，闭着眼使劲干是你唯一的资格，大部分人不是天赋型，而且短视频做成的大部分博主也都是降维打击，都是现实中混得不错的取得过结果的人，他们也是普通选手，也是靠量，更何况你。干的次数多了剪辑技巧就会了，干的多了文案能力就起来了，干的多了从哪找到学习最佳途径就出来了，干的多了就知道平台的规则和粉丝的规律了。\n\
  - **第四：** 你可以把流量不高的后期隐藏或删掉重发，有了粉丝重新发之前的观点照样会火。\n\n###### 复制\n\n少走弯路最好的方式是复制，比如大家公认的大师其实都是复制者，讲哲学的除了小镇舍长等少数博主其他都是复制古今中外的大师的观点，大师复读机，思想搬运者。\n\
  \n复制的方式：\n\n- 第一：只找流量高的作品。他能火，你只要展现方式得当一定也能火。\n- 第二：完全复制死路一条。要跟原有博主的表现不同，比如原博主是口播，你就做剧情演绎、思维导图、剪辑等新形式展现。\n\
  - 第三：整合一个主题里流量高的不同作品的观点，多个视频揉合成一个视频。\n- 第四：进这些博主的群，加他的微信看他的朋友圈，或者跟他连线链接套取他的整套模式。\n\
  \n###### 极致反差\n\n把事情做到极致就会形成反差，反差给人带来的情绪价值是最大的：刺激！\n\n比如你语速快，那就快到极致；你性格有点娘，那就娘到极致；你长相很和善，那就打扮成佛祖菩萨，慈祥到极致；你长得很漂亮，那就去农村，去农村的猪圈，在猪圈里给猪做阉割；别人都在城里给人理发，你去农村，给农村的孤寡老人，正在干农活的老人，穿的越烂，干的活越脏，免费给他们理发；用道具就用极致反差的道具，比如开锁，就开最大的或者最小的锁，用筷子就用最长或者最短的筷子，戴帽子就戴最大的最小的最破的最绿色的等等的帽子；发表观点最开始就极端一点，利用人类创造的二元对立制造二元对立（别犯法）；别人都在给小孩教英语，你去办老年英语培训班；别人都是去按摩店享受按摩，你去按摩店给技师按摩；别人都是孝顺爸爸妈妈，你让爸爸妈妈孝顺你……\n\
  \n按照这个反常识的逻辑，无数个案例无数个想法无数个创意，随意使用，出圈的概率会高很多。\n\n###### 大 V 带\n\n这是可以在极短时间内起飞的一个办法，这得看你个人实力或者运气。\n\
  \n比如小镇舍长在做短视频初期，被孟庆阳和娱圈魔姐两位博主宣传推广了一个视频，两三天涨粉超 10 万；小镇舍长也给一些使用自己观点的新生博主做了宣传，从几百个粉丝在一周内突破到几万甚至几十万粉丝的博主至少有十几个。\n\
  \n尽量想办法和一些大 V 形成互动，不管是他们单方面对你的宣传，还是你们有机会联合出作品，都是借力打力的方式。\n\n###### 2.4.7.4 变现\n\n\
  - **第一：直播。** 直播是离变现最近的方式，只要开播，就是营业，进来的人就是走进你店里的顾客：打赏、购物等消费行为一产生你就获利。直播可以带货，可以卖知识连线解疑答惑；带货可以分为实体产品和虚拟产品，虚拟产品可以是资料包、U盘、会员等。有些人适合直播，有些人适合拍摄短视频，直播的要求比较高一些，但按照人货场的专业包装，从服装、背景、产品、话术等方面，经过刻意练习可以得到显著提高。\n\
