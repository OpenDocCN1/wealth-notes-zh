  \ 人际关系\n\n除了亲密关系，其他的所有人际关系，就是自己跟自己的关系，处理自己跟自己的关系，就能处理好所有关系。\n\n能享受孤独的人比耐不住寂寞的人更会处理人际关系。但现在所有场合都在教导如何把对方分类，如何应对每一类人群，甚至卖得最火的书籍就是人情世故，这是因为适者生存，大环境已经被污染透。\n\
