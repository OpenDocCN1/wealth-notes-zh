  \n**你怕了，作为孩子、作为学生、作为员工、作为子民、作为消费者，才好对付，才好管理，才能达到目的，社会稳定有序。**\n\n当怕成了习惯，焦虑症自此诞生：对未来的恐惧、对婚姻的恐惧、对生病的恐惧，对气味、对空间、对声音的恐惧等等，甚至产生躯体化症状，惊恐症发作。\n\
  \n- **第一：** 这些情绪念头都是假的，设计好的坑。\n- **第二：** 允许的力量大于一切，允许这个情绪出现，而不是对抗。\n- **第三：** 这个情绪不能把你怎么样。第一，每次都没事，就是吓唬你而已；每次惊恐症发作时默念：你要真厉害，弄死我啊，怂货，没一次成功的笨蛋。\n\
  - **第四：** 没发作之前故意就等着这个情绪到来：你来啊，老子等着你。\n\n借假修真，不当真不较真，回不去了，有情绪也可以，也正常，要允许自己有情绪，要觉察到自己有情绪，刻意练习说停就停的能力。\n\
  \n生气时就好好生气，抑郁时就好好抑郁，飘风不终朝，骤雨不终日，体验即可，比如体验快乐，而不是追求快乐。\n\n体验七情六欲，是一种乐趣，因为情绪只是工具。\n\
  \n比如我的邻居遇到了事情需要我帮忙，这件事情我需要愤怒才能解决，所以我就表演了一下愤怒，事情搞定。我在愤怒，我也根本没有愤怒。\n\n#### 8.11 时间相\n\
  \n**时间是假的。**\n\n无非就是太阳转到这儿地球亮了，太阳转到那儿地球暗了，是人为定义这种现象叫时间。\n\n**原始阶段上百万年里哪有时间？**\n\n\
  花花草草猫猫狗狗婴幼儿的世界里哪有时间？\n\n**强者谁会被时间这俩字困住？**\n\n他们都是道法自然，遵循天道，是饿了就去吃，困了就去睡，没有什么饭点儿、睡觉点儿。\n\
  \n晚上过了11点还睡不着大概率就会辗转反侧，开始焦虑，最后失眠。\n\n**时间是工具，不是目的。**\n\n创造出的时间概念有昨天今天明天、白天黑夜、过去现在未来、一岁十岁五十岁、一点五点十五点，大概在什么时间大部分人会在做什么事，并以此设立政策、设立制度、设立行业，也就是世界上的人类在什么时间大概会发生什么事基本都是可控的，这样社会才会稳定有序。\n\
  \n比如有了白天黑夜这个时间概念，规定了白天工作，夜晚睡觉，如果不这样设定和宣传引导，统治阶级晚上大部分都睡了，其他人不睡，很容易把他们偷偷噶掉，他们出事了社会就乱了，所以不能允许这种不安全因素存在，就规定了白天大部分人都得上班，夜晚就得睡觉。\n\
  \n在6000年前的原始阶段里，夜里不睡觉去捕猎生存反而更好，因为晚上其他动物都休息了，人类晚上不休息更有利于生存。\n\n再比如一岁十岁五十岁这种时间概念，如果不这样规定，四岁可以上幼儿园，二十岁也可以上，那不就乱套了，危险系数增加，影响社会稳定有序。\n\
  \n##### 8.11.1 当下\n\n再比如有了过去现在未来这个时间概念，你就会因此而内耗，内耗了就没有精力，没有精力造反。因为有了这些概念你就会陷在过去、迷在未来，为了过去会后悔，为了未来会焦虑，但是过去已经消失，是0；未来有无限种可能性，明天可能就会死，未来是n；0和n都无法把握，只有当下是1，是唯一，是确定的。\n\
  \n**活在当下的意思就是当下到极致，极致的意思是没有过去，没有未来，只有当下，而不是想着活在当下同时又讨论着过去和未来。**\n\n时间是当下，那你的一生也可以正向理解为当下这一刻的叠加，没有过去、左边、右边、未来，只是当下这一刻的叠加，你的人生是在叠加，是向上的，而不是从左边到右边的人生终点，预见终点多无趣。\n\
  \n\n\n你遇到的所有人和事都是生命在叠加、在丰富；成功了生命在叠加，失败了生命也在叠加，因为增加了失败的经验、有了失败的经历；遇到好人生命在叠加，遇到坏人生命也在叠加，因为增加了识别坏人的经验、有了遇到小人的经历。正缘孽缘都是缘。\n\
  \n花草树木、猫猫狗狗、婴幼儿永远都是在当下，吃饭就是吃饭，喝水就是喝水，睡觉就是睡觉，你的灵魂、你的注意力，永远都在当下，把注意力放在当下的行动和当下的行动带来的感受上，这个世界管理的本质就是注意力的掠夺。\n\
  \n他们把时间定义成一条线，叫时间轴，从左到右的一条线，意思是人这辈子就是从左往右走，沿着直线走到终点结束，这得多没劲。\n\n**这个轴上你在这，有过去、有未来，故意让人幻想、故意让人焦虑。**\n\
  \n如果可以对时间进行定义，我希望它是实心儿圆形的，只修自身能量，能量越来越大，人生是放射型的，是愉悦的。\n\n没有过去没有未来只有能量，遇到的任何事情都会化作实心儿的能量；\n\
  \n如果可以对时间进行定义，我希望它是自下而上的，只享受当下，人生就是无数个当下的叠加，往上的叠加，人生是向上的，是愉悦的。\n\n没有过去没有未来只有当下，遇到的任何事情都会化作向上的营养。\n\
  \n**昨天我已经犯的错误，跟今天的我有什么关系？**\n\n**未来我可能犯的错误，跟今天的我有什么关系？**\n\n**我只跟当下的我实实在在地发生着关系。**\n\
  \n所以：一切都没关系。\n\n没有过去就没有后悔，没有未来就没有焦虑，只有当下就只剩享受，享受当下都享受不够，哪还有时间为了不能享受的假时间、假过去和假未来去花费力气？\n\
  \n##### 8.11.2 债务驱动\n\n顶层设计里的时间，过去可以作为大脑编程不断植入的信息，这是洗脑的主要素材来源，社会稳定有序。\n\n未来可以用来提前透支，以此创造出了债务驱动管理模式，包括经济债务和情感债务，你的肉体世界是经济债务驱动，你的精神世界是情感债务驱动。\n\
  \n**你活着要么背一身经济债，要么背一身情感债，一定没有足够精力去影响社会稳定有序。**\n\n其他的不要想，活着还债就行了。\n\n**经济债务驱动：**\
  \ 透支未来，提前消费，各种贷款，你要偿还的贷款是稳定的，你得每个月都得还固定数额，但是收入绝不会稳定，多数人的未来收入没有一点保障，甚至会经历多次一段时间内收入为\
  \ 0 的阶段，到那时你就崩盘崩溃。让所有人、所有单位、所有地方、所有国家负债，既能促进经济发展，还能操控人跟狗一样一直拉磨，目的：**社会稳定有序发展。**\n\
  \n**设计出的产品有：房贷、车贷、消费贷等。**\n\n**情感债务驱动：** 让所有人背负原生家庭的亲情债、婚姻的爱情债、兄弟情、师徒情等，既能促进经济发展，还能操控人跟狗一样一直内耗，目的：**社会稳定有序发展。**\n\
  \n**设计出的产品有：父母、子女、爱情、兄弟等。**\n\n太阳永不落下，也永远落下，没有白天黑夜，也一直都是白天、一直都是黑夜，你这里的白天是别人那里的黑夜；没有过去没有未来，也一直都是过去、一直都在未来。时间只是工具，不做时间的工具，有用你就用，没用也千万别因为时间的概念而内耗，借假修真，别当真、别较真。\n\
  \n#### 8.12 生死相\n\n生死是假的，天地万物都没有生死的概念，活着就是活着，死就死，无惧生死，没有恐惧，无惧。花草树木怕死？猫猫狗狗知道有死这回事？婴幼儿怕死？强者在乎生死？让你怕死是为了社会稳定有序，不怕死的生物最难管理，怕死的生物最容易管理。\n\
  \n出生是地球之旅的开始，死亡是宇宙之旅的开始，不是结束，会化作春泥，化作生灵，化作星星，化作暗物质。每个细胞都是你，细胞每时每刻都在死亡，也每时每刻都在新生。你一直在生也一直在死，不生不死也永生永死，方生方死、方死方生，无惧生死，可生可死，你在生死之上。因为宇宙不会放弃任何东西，出生时无数个宇宙微粒组成了你的肉身；\n\
  \n死亡时你的肉身又变成无数个微粒回归宇宙，你不增不减；出生时你的灵魂从宇宙原点以超光速来到地球，死亡时你的灵魂会以超光速回到宇宙原点，你不生不灭。\n\n有过濒死体验的人都知道灵魂的存在，濒死时刻，灵魂出窍，你会看到肉体的自己，原来肉体只是来地球这几十年的一个载体、一副驱壳而已。\n\
  \n##### 8.12.1 活着的意义\n\n活着没有意义，活着就是活着，不要道德绑架自己，不要刻意追求活着的意义，得不到会失望，得到会无聊，你会内耗的，这是个局，是坑，是陷阱，是设计好的游戏。\n\
  \n如果没有发明意义这俩字，你会思考活着的意义？\n\n文字游戏而已。\n\n**如果活着真有意义，你经历的一切就是意义，你的好、你的坏、你的对、你的错、你的屎尿屁都是意义，你就是意义本身。**\n\
  \n而且有了死亡，活着已经是意义本身。\n\n若执着活着的意义，你都不可能活着离开，你要真执着有本事你别死啊，活着的意义是没办法执着的一件事。\n\n**虽然活着没什么意义，但你可以活得有趣一点，阳光、空气、花、草、家人、个人爱好等等，都可以是乐趣、是知足、是心安。**\n\
  \n生命的本质绝不是攀比、房子、车子、学历、职位、钞票，你看看大自然的动物、植物、微生物等一切生物，吃饱穿暖后多一样东西都不要，你见过猴子打电子游戏吗？你见过猪开汽车吗？你见过狗报补习班吗？你见过王八天天送礼吗？蜉蝣，夜晚子时出生，只活三四个小时，在我们眼里的几个小时那就是它的一生。\n\
  \n在乌龟眼里我们也是蜉蝣，在宇宙眼里地球存在了几十亿年，也就是蜉蝣的几个小时，那咱人类几千年的历史更是啥也不是，一秒都不到的历史，你我更是啥也不是。\n\n\
  古代皇帝多牛逼，到现在你记住几个名字。皇帝都被你证明啥也不是。\n\n当你死后，你的葬礼上大多数人都在笑，说不定结束后直接去蹦迪。\n\n很多人活不好这一生，很大一部分原因是跟死亡不熟，想活明白就得把死亡研究明白。\n\
  \n怕有个屁用，就跟你不能不死似的。\n\n肯定要面对，面对亲人朋友的死，面对自己的死。\n\n认识死亡的过程确实会很辛苦甚至痛苦，但当你真正遇到至亲挚友离你而去时，当你无限接近死亡与死神擦肩而过时，这样的痛用语言根本表达不出来，那种撕心裂肺的痛，连呼吸都痛，会持续很久很久。\n\
  \n那个时候什么天王老子、皇帝老儿，什么求学困境、职场困境、生意困境，简直渺小到你压根儿都不会注意到它的存在。\n\n**所以趁你还活着，现在就想想如果有死亡，该做哪些、不该做哪些，列个清单，想着想着，你就会对死亡越熟悉，对它更了解，死亡发生的时候，你可以相对从容面对；**\n\
  \n不然有些死亡突然降临，没有提前的心理准备，你可能真的无法承受……如果哪天，你连死都能从容面对的时候，就可以轻松面对活着的一切，就可以驾驭遇到的一切问题，就可以享受真正属于自己的人生：\n\
  \n比如在职场上遇到特别棘手的问题，公司上上下下都不知所措时，我经常给他们讲的一句话：死个人都没啥事，星球上天天都在死无数的人，发生无数的大事，这点儿小破事儿能咋地！\n\
  \n即使解决不了又能咋地，即使离职不干了又能咋地！\n\n该想办法想办法，该干嘛干嘛。\n\n##### 8.12.2 向死而生\n\n向死而生：你现在就正在走向死亡，你无时无刻都是在走向死亡；不熟悉死亡、不研究死亡，你活不明白，因为人要么生，要么死，就这俩事；\n\
  \n**世界是反着的，是倒着的。**\n\n越是活着越要先研究死，死不明白就活不明白。**倒着活。**\n\n给生命做个倒排，画出整个生命尺度，每个阶段大概会经历哪些事情基本都是固定，你会知道哪些事情最重要、哪些无关紧要，才会在死的时候感觉真的活过。\n\
  \n精神内耗尤其抑郁，经常有想死的念头儿，但能走出来熬过来的，一定迎来新生，你的精神世界也是置之死地而后生；\n\n死可以解决一切问题，这是解决问题的终极办法。我不要了，大不了离婚、大不了离开、大不了离职、大不了死。尤其是死要好好用，当你精神内耗时，念头改为“有本事内耗死我啊！来啊！牛逼啥！敢让我难受！”即使是很严重的躯体化症状、惊恐症，也可以通过这种方法来进行思想斗争，思想斗争也是战争，不是你死就是我亡，光脚的不怕穿鞋的，愣的怕不要命的；最后你发现自己没死，你就赢了，任何内耗都是你的手下败将，都会对你俯首称臣。\n\
  \n**用死解决死，不存在问题，任何问题全是你说了算！**\n\n为什么抑郁的人想自杀？为什么精神问题的人犯病时会有濒死感？\n\n为什么经历再多不如大病一场，为什么越是无限接近死亡越容易觉悟？\n\
  \n为什么都离不开死，因为你本就离不开死，你唯一能确定的就是死。\n\n这就是天道，老天暗示得多明显，用这么多最客观、最残酷的事实都是在告诉你，置之死地而后生。\n\
  \n不仅是肉体还有精神，你以前知道的一切都得“死”，才能重生。心不死道不生，你以前认为的一切死得越透你越通透。\n\n不然你从 20 多岁只是肉体还活着，其实精神已死；再不然你就是肉体真死了。\n\
  \n###### 重获新生的秘密就在死上\n\n今天是余下生命的第一天，也可能是最后一天。\n\n做好任何人都会随时离开的准备，包括自己。\n\n你的家人随时可能会死，自己随时可能会死。\n\
  \n既然如此，不管是谁都要提前有个心理准备。\n\n如果是得了大病，是选择被当成猪羊一样的试验品上手术台，或者全身插满管子痛苦地多活几天几个月，还是回到家陪陪家人、好吃好喝、安详平淡地度过余下时光？\n\
  \n如果是意外突然离开：自己的情绪如何控制？家人如何安慰？后事如何办理？银行卡存款如何安排？既然随时可能会死，就不要把时间用在计较毫无意义的事情上，不要把时间用在批评责备上，不要把时间用在精神内耗、犹豫不前上，不要把时间用在损害身体的健康上。\n\
  \n既然随时可能会死，请珍惜当下，就是今天，就是现在，去好好陪伴家人，去享受阳光空气，去用心欣赏花花草草大千世界。\n\n去做自己想做的事，去追求喜欢的那个人。\n\
  \n去大胆地思考、大胆地创新、大胆地尝试，不怕犯错、不怕得罪、不怕失败，这些都是生命中的组成部分，去体验它、去玩它、去干它！\n\n每个人的最后一件事是死亡，请站好最后一班岗，把自己的最后一件事处理好再走，别死那么恶心。\n\
  \n比如我对自己的死这样规划：若正常死亡，那是真幸福，每天只管好自己，少让家人担心和生气。\n\n我死后请把我归还给大自然，谁也不能把我放进密封的盒子里，我生前有空间幽闭恐惧症，也习惯了自由，任何人不要举办我的祭祀活动，这是我唯一的愿望。我死后是风光大葬还是被狗吃了，对我来说都一样。若突然意外死亡，也挺好，没什么痛苦，遗憾始终都会有的。\n\
  \n提前写好遗书，银行卡、财产分配安排好，别死后还给家人添乱。若得了大病，要么中医自治，要么回家等死。别让自己临了还遭罪，跟牲口一样放在手术台被切来切去，更别让家人掏出毕生积蓄给自己治疗，多活那几年也没什么两样。\n\
  \n咱回家，想吃啥吃啥，想去哪去哪，陪陪家人，家是最踏实的地方，死得安心。\n\n总之，自己的事自己办。\n\n不是到了平均寿命才会死，是随时会死；不是到了离职、离婚、离开才可以被替代，是随时可以被替代。绝大部分人就是——随时会死的废物，一事无成。咋啦，成他妈什么事，有啥事可成，你死后不会留下一点痕迹。皇帝的家不最终也都没了，首富不也都没什么好下场？装什么人上人，都是一堆肉，狗肉一样的肉。\n\
  \n#### 8.13 教育相\n\n教育是假的，是为了社会稳定有序，为了城市阶段性发展。\n\n6000 年前原始阶段哪有教育？天地万物花花草草猫猫狗狗哪有教育？婴幼儿都不会说话能听得懂教育？举世强者是人类能教育得了的？2000\
  \ 多年前的教育只存在于贵族内部，独尊儒术后为了给百姓彻底洗脑，为了释放百姓的生产力，才让教育走进千家万户，要知道恢复高考也才是 1977 年的事。\n\n教育本质是开智，是找回真正的自己，而不是教化。\n\
  \n##### 8.13.1 教育目的\n\n现代教育除了为社会增加生产力和给百姓洗脑两个目的外，也为了体现更多的公平，更是为了转移注意力。\n\n学的知识是希望你看到的，还有禁书是不希望你有精力注意到的。\n\
  \n上学时间越来越长，是为了缓解就业压力，以及把最容易冲动的年纪留在学校，减少这个年纪流入社会的比例，再加上学校数年的道德和规矩教育，以减轻社会治理负担，保障社会稳定有序。\n\
  \n古代 20 岁都已经是见过世面、上知天文下知地理的大文豪，现在 20 岁还在技校学技术，还在大学读书。\n\n真正的教育在社会，但是进入社会后年纪已经很大，学习能力越来越差；也就是在学习能力最强的时候，关在学校学习不到真正的教育；在学习能力变差的时候，进入社会也没能力学习到太多真正的教育。这样的人类就不会太强、太危险，这是社会保障体系的环节设计。\n\
  \n在学校学的知识、你的专业，正好是当时的社会需要或者所在的城市需要，而且只是阶段性需要。当城市更新、社会升级，你毕生所学一夜之间变成废物，你随时会被淘汰。\n\
  \n尤其是现在科技发展日新月异，也许你大一报考的专业大四毕业时已经被社会淘汰，毕业即失业已经走进现实。\n\n尤其是最近以来的教材远远落后世界百十年，跟社会脱轨，跟实践脱轨，跟企业脱轨，大学无用论会持续一段时间，除非进行革命性改革。教育本应该在开始阶段的重要程度大于结尾或等于收尾阶段的重要程度，即小学教育跟大学教育都同等重要，甚至更为重要。\n\
  \n比如盖房子，打地基一般都比上梁重要，但现在的教育恰恰相反，小时候的教育太糊弄了，跟养猪流水线一样，只管喂养，不管死活。\n\n大学的教育也过于正式了，跟产品生产流水线一样，只管生产，不管销售。\n\
  \n在学校学的能力跟社会需要的正好相反。在学校教育的都是以务虚为主，是老百姓对孩子的教育，是门外文化、羊群文化，务虚的概念有老实、好人、守规矩、道德、梦想等，因为务虚不能直接产生结果。\n\
  \n只有务实才能取得结果，这个世界是由有结果的人说了算的，社会需要的都是以务实为主，是上层阶级对孩子从小的教育，是门内文化、牧羊人文化：谋略、手段、挣钱、天道真相、解决问题的能力等。\n\
  \n从一开始在教育环节就设计好了阶层，阶级跨越是普通人基本无法跨越的鸿沟。\n\n但在学校培养的习惯正是社会正需要，比如上学是不是跟上班很像？\n\n孩子每天早晨七点就被硬拉起来，下午五点放学还得加班写作业，他一天比你工作的时间都长，数年的习惯培养，直接送入社会工作，习惯可以无缝衔接。\n\
  \n勤勤恳恳，服从管理，积极进取……\n\n都是社会稳定有序所需要的品质。\n\n人类小时候最不喜欢的事是上学，长大后最不喜欢的事是上班；\n\n不喜欢上学也上了十几年，不喜欢上班也上了几年；\n\
  \n不上学了是因为被迫该上班了，不上班了是因为 35 岁被迫该淘汰了。\n\n##### 8.13.2 智慧与知识\n\n知识不等于智慧，有知识不一定有智慧，无知识说不定有大智慧，比如六祖慧能大字不识一个。为学日益，为道日损。\n\
  \n想要增加专业知识可以多学习多看书；\n\n想要开启智慧，书看多了、学习久了反而不利；\n\n脑子里全塞满了别人创造的玩意儿，那是别人，你越来越不是你，形成了小我、假我；形成小我、假我的过程恰好是失去大我、失去真我的过程；\n\
  \n你误以为这个被别人编程的小我是真我，实际上小我的你就是社会稳定有序的一条狗。\n\n知识都被分成了一门门的学问，而智慧不是一门学问，没有套路没有章法，每个人的智慧都独一无二，但知识都是千篇一律，标准化猪圈养殖场模式。\n\
  \n智慧越多越觉得自己渺小，越容易失去进攻性进取心，甚至容易躺平归隐，所以对于社会发展而言，不能让大部分人都拥有智慧；\n\n读书读傻了吧这句话经常听到：**知识越多越觉得自己专业，尤其是专家，知识越多学历越高的人越容易单身绝种，越容易较真儿，他们就是跟学习较真儿才有了今天，较真儿都变成了下意识，也越容易精神内耗；**\n\
  \n因为懂得知识越多想的越多，也不容易适者生存，学了半辈子的专业时代说变就变，专业被淘汰了；借假修真，不当真、不较真，知识多了反而容易较真儿。\n\n想要活得幸福、想要解决精神内耗的核心是开启智慧。\n\
  \n**开启智慧的核心是放下，就是不断放下、不断清零以前所有的知识，而获得知识的核心却是不断拿起、不断吸收。**\n\n智慧是道，知识是术，以智慧的方式学习知识是个人和社会最正确的选择，共同帮助人类解决问题，并实现天下大同。\n\
  \n不同的人需求不一样，定位不一样，使命不一样，选择了就得承担相应后果，不用执着。\n\n有道无术尚可求，有术无道止于术，真正的强者是人类教不了的：李小龙以武入道，郭德纲以相声入道，于东来以企业入道，毛泽东以政治入道，自己就是这个领域最强的老师，是自己的老师，是天下的老师，自成一派，包括古代的老子、佛陀等，都是悟道级强者，本自具足。\n\
  \n如果所有人都需要教育，第一本书是怎么出现的？\n\n第一个老师是怎么出现的？\n\n**你本自具足，你自己就是全世界，自己不看书就能写书，自己就是书，天地万物都是书。**\n\
  \n##### 8.13.3 孩子教育\n\n为什么大多数学生毕业就是废物？\n\n因为学生思维就是弱者思维，社会实战需要的正好相反。\n\n- 第一：进入社会之前一直都在依靠别人，进入社会发现只能靠自己。\n\
  - 第二：上学时习惯了固定答案思维，进入社会没有固定答案，干就是答案，你就是答案本身。\n- 第三：进入社会之前习惯了被教导、被给予，但进入社会没人愿意教你，需要主动学习。\n\
  - 第四：上学时永远都在纸上解题做题，进入社会需要的是实战，真正解决问题的能力，遇到任何问题永远都有方式方法，而不是退缩害怕。\n\n因此，真正的教育要反着来。\n\
  \n###### 8.13.3.1 三教理论（灵性教育、人性教育、兽性教育）\n\n三教理论指的是围绕人性的三个特性的教育，即：灵性、人性、兽性。\n\n因为整个世界的所有事情都是根据人性设计，教育的本质更得以正向引导这三个特性为核心。\n\
  \n跟教育本质不相关的，都是孩子未来的枷锁，都是孩子未来的诅咒。\n\n教育的真正本质应该是：\n\n让孩子找到自己，而不是按照顶层设计让所有孩子都失去自己。\n\
  \n怎么失去自己的就按照反向找回即可，即围绕人性开展教育。\n\n人性包括灵性、原始人性和驯化的新人新性、兽性，灵性被打压了得做加法教育，驯化出的新人新性得做减法教育以及能实现天下大同的教育，兽性被打压得做加法教育。\n\
  \n以上都是小孩教育，有了这个牢固的地基，大学教育顺水推舟即可，不用社会和学校老师用功地增加他们的管理成本。\n\n因为这时的孩子都是发动机，找到了自己就知道大学该学什么、该怎么学，职业规划很清晰，要么做自己喜欢的事，要么做在这个世界必须做的事，要么做老天让做的事。\n\
  \n**比如文字能力好的，将来开展灵性类事业，数字能力好的，将来开展人性科技类事业。**\n\n灵性觉醒让人很兴奋，人性的科技发展让人兴奋，完美手工艺让人兴奋，唯独填鸭式教育即使考满分也没那么兴奋。\n\
  \n**灵性教育：**\n\n主要包括：**真相植入、灵性接触、示弱引导**。\n\n真相植入是不管孩子懂不懂，就把以上世界顶层设计的真相，不断灌输、不断告诉他，让他背诵**道德经、易经、楞严经**等儿童版书籍，观看有灵性、灵魂教育意义的影视剧动画片。\n\
  \n灵性接触是让孩子多接触灵性的事物，比如花花草草、猫猫狗狗、婴幼儿、悟道级的强者，即天补、地补、人补。\n\n示弱引导是多主动向孩子请教。\n\n你生的哪是孩子，分明是老师，你给孩子花的哪是钱，分明是你交的学费。\n\
  \n**逆向思维，父母要做的不是一直跟他们讲大道理。**\n\n**而是向他们请教，向他们学习。**\n\n多向孩子请教，你越请教，孩子的智慧和天赋越能得到极速增长；\n\
  \n你越示弱，孩子越有自信、越有内核，就不会迷失自我。\n\n多向孩子学习。孩子生而神灵，灵性最高的就是孩子，智者复归于婴儿：知行合一、天人合一等这些天道也都是观察孩子才有了灵感，颈椎不好就是多观察孩子才有所恢复，给孩子花钱交的不仅是学费，还有医药费。\n\
  \n总之千万别跟孩子讲大道理，尤其是没做生意也没当官的父母，你讲的道理能叫道理？这种低级认知是对孩子的诅咒，孩子的厄运就在你讲的道理上。\n\n**人性教育：**\n\
  \n科技（能源科技+生命科技+AI 科技）+谋略手段+挣钱+历史+经济学+人际关系学等等。这些都是人性才能搞出的东西，手段和挣钱是生存底线，科技是未来发展、是天下大同的天时。\n\
  \n孩子的玩具包括看的视频和图书都是跟科技相关，以动画的形式、他们感兴趣的方式，从小就培养兴趣；\n\n手段可以不用，但必须有，从小学鬼谷子、36计、千门八将等等；挣钱更得从小刻意练习。上学图啥？上学\
  \ 20 年的标准答案思维和老好人思维会成为孩子日后的诅咒，必须改为连续练习 20 年挣钱的思维和习惯。\n\n**兽性教育：**\n\n主要指肉体层面，有健康方面、性教育、道德法律如何使用等。身体健康方面，比如学习背诵中医，上医治未病，学会起码自己少生病，或生小病自己也能治；再比如培养运动爱好和习惯；\n\
  \n**如果条件允许，也会培养孩子野外生存意识和本领。**\n\n文明其精神，更要野蛮其体魄，我就鼓励我的孩子打架，但凡有人欺负自己，干他，趁小时候打架不犯法多打几回。\n\
  \n###### 8.13.3.2 务实和务虚\n\n\n\n上层人给孩子的教育都是以务实为主，务虚为辅；从小就学习如何挣钱、谋略手段、丛林法则等各种天道思维，还有经济学、历史学、社会学、哲学等。\n\
  \n比如挣钱，他们的孩子三四岁就开始挣钱，上学上二十年图啥？不就是赚钱的生存能力，要是上 20 年出来就失业或者学的东西没用，上学干嘛！\n\n如果上了 20\
  \ 年练习了 20 年挣钱的本事，这一拳 20 年的功夫你挡得住嘛？赚钱不仅是未来保障，更是提升孩子能力、看透社会、看透人性最好的方式；\n\n先赚父母的钱，培养出他们赚钱的意识，知道赚钱不易，他们想买什么都得花自己挣的钱，也让他们学会怎么规划花钱；\n\
  \n更会通过赚钱思维促进孩子养成好习惯，起床、刷牙、运动、专注、帮做家务、不沉迷看电视看手机、读历史谋略手段、《道德经》《黄帝内经》这些书等等再赚别人的钱，倒卖是世界上最好的生意：银行倒卖钱，政府倒卖地皮，阿里巴巴就是个倒卖平台，我是倒卖自己脑子里的知识。\n\
  \n懂得搞流量永远不会被淘汰，而且学生的钱是最好赚，最适合新手起步时练手用；赚钱本事需要不断的刻意练习，包括原则、方式、面临的坑。如果 20 多岁毕业后再开始练习太晚了，你会发现学校那套老好人思维、标准答案思维成了孩子发展的诅咒，发现孩子折腾几年没起色，35\
  \ 岁了，折腾不动了也被职场淘汰了，后续的人生平淡平庸都可以，但面对生存不能让孩子变得焦虑。也会拖累于你的晚年生活。\n\n而普通孩子的教育是以务虚为主、务实为辅，比如梦想、道德、好人、诚实守信、守规矩、服从管理等，这些口号喊得世界第一又如何？\n\
  \n不产生结果，只有务实才能产生结果，务虚的多了才能满足底层工作岗位要求，这是顶层设计，是社会保障体系的环节设计。大部分学的专业都是社会保障体系的环节设计，都是时效性、季节性、短暂性生存手段，尤其以后科技发展太快，专业技能的时效性越来越短，孩子面临的生存环境比咱更加恶劣，老是被时代淘汰，老是重新开始咋行？掌握了长效的生存之道就不用焦虑，什么时候都能挣钱，在哪都能挣钱才对。但每个人的长效生存之道，是靠长时间无数次干的过程中，它自己冒出来的。\n\
  \n我 15 年前上大学学的东西都没用，更别说现在，未来还有学富五千年的人工智能，只会死记硬背的人类以后就是智障，是傻子。\n\n随着科技进步日新月异，教育已大部分无法跟上现实，教育无用论、大学无用论会持续一段时间，学历将成为贬值最快的东西，而家庭教育会在未来的一段时间成为一股暗主流。这是用心的家长能给孩子带来的机会。\n\
  \n普通家庭给孩子的教育只能另辟蹊径，遇到问题只要极端化处理，一定能找到方向找到答案：要么卷到极致，给她们最好的应试教育条件，比如请最好的私教，上最好的学校，报最贵的班，一般家庭没这实力，果断放弃这条最拥挤的赛道；要么给她们绝对不关注分数的教育，考零分也是一种体验，只管以三教为核心（下面会讲到），让孩子找到自己，这个赛道不拥挤，起码现在有尝试的机会。\n\
  \n在学校能识数字汉字即可，对成绩没啥要求。\n\n学校教的学校学，我只教学校不教的知识。\n\n- **第一、学校教育**，认识数字汉字即可；考 0 分也可以，一个数字而已；\n\
  - **第二、家庭教育：**在家里要设立专门家庭课堂，开发出家庭教育体系，包括传统文化教育、独立教育、性教育、死亡教育，着重培养孩子解决问题的能力、爱自己的能力、幸福的能力、创新创造的能力；\n\
  - **第三、**并建立起可以传承的属于自己家的家风家规家训。开设每周课堂、夏令营冬令营课堂，教授孩子门内文化：**如何赚钱、如何爱、认识世界真相、如何幸福、生命和死亡学、拥有解决问题的能力、学习谋略、学习手段、学习人类世界的一切真相、引导启发孩子的兴趣，再创造孩子感兴趣的环境，刻意练习，培养他的兴趣。**\n\
  - **第四、以兴趣带兴趣，兴趣养兴趣，兴趣玩兴趣。** 好比从战争学习战争，不用上军校也能打遍天下无敌手，比如李世民、毛泽东等。早早进入社会。以后的世界得有真本事，别还没锻炼出本事就被社会淘汰了，上学的时间太长，古代\
  \ 24 岁都封狼居胥了现在才刚毕业，35 岁又被社会淘汰。小学就得开始挣钱，16 岁就得开始跟社会正式接轨，遭受社会的毒打，他早晚得经历，体验世界要趁早。\n\
  \n都是时代产物，按照现在的生育率，十几年之后的所有孩子都能上大学，而且是好几个大学派老师上你家推销求着你孩子去。\n\n什么学区房、辅导班都脱离了教育本质，还让祖孙三代穷尽精力物力财力，你的钱没了就再也没有真正的实力给孩子提供实质性帮助。\n\
  \n买学区房的第一批孩子这几年开始大学毕业，结果呢，失业了，哈哈哈哈……学区房就是棺材板，孩子接受教育捆绑学区房，这是历史以来最大金额的教育最低消费，教育霸王条款。\n\
  \n**小时候上学会内耗，长大后上班会内耗，也就是孩子从上学的那一刻起，就是内耗萌芽的开始；**\n\n**这场悲剧的导演，让每个孩子的内耗一直茁壮成长直至耗尽气血年华。作为父母竭尽所能地让孩子成为自己人生的导演。**\n\
  \n不一定让孩子必须成为社会栋梁，只要不危害社会，让他们成为自己人生的栋梁，建设出自己想要的人生这项工程，比什么都重要。孩子若优秀，去报效祖国；\n\n孩子若没出息，当承欢膝下。这一生都在解题做题，不是训练孩子解题正确与否，要引导他们在任何时期解题过程中：\n\
  \n**面对问题的心态，做对题的心态，做错题的心态。**\n\n**题做对做错，不重要。**\n\n总之，20 年学的知识会被淘汰，大学专业会被淘汰，只有围绕人性才不会被淘汰，只有务实为主、务虚为辅才能取得结果。\n\
  \n物质基础决定上层建筑，灵魂指挥肉体，务实和务虚缺一不可。\n\n###### 8.13.3.3 家风家规家训\n\n- **第一：**人类想要强大，靠人类文明的传承；家族想要强大，子孙后代想要强大，靠家族文明的传承。\n\
  \  \n  一般是经过连续三代人的努力才能成就一代人的强大，没有传承，只是靠运气，世世代代大概率就是普通阶级。\n- **第二：**家族文明就必须有个悟道级的指挥纲领，即：家规、家风、家训。但绝不是古代贵族常规的家风家规家训。\n\
  - **第三：**对自家孩子的家风家规家训就是从这本电子书里提取，有关于如何演戏演得像个人去做人的，有关于如何不像人做事的。\n\n正是因为为了教育，人类的知识和智慧才会连续传承下去，人类才会越来越强，越来越专业，尤其是科技发展教育，必须摆到跟智慧同等高的地位，越有机会到达天下大同阶段。\n\
  \n个人家庭也是如此，没有家庭教育的传承不可能越来越强大，一般通过三代人的共同传承努力，才能成就一代人。\n\n好好利用教育，而不是被教育利用，借假修真，别当真，别较真。\n\
  \n#### 8.14 医疗相\n\n医疗是假的，天地万物谁需要医生？心理医生更是才出现百年。你越生病，就会越花钱，社会经济发展越快；\n\n**你越生病，越没精力造反，社会稳定有序。**\n\
  \n你出生时最健康，是后来被培养的思维、情绪和行为习惯，以及衣食住行的每一样儿，让你的肉体和精神越来越不健康。\n\n如果人人从小自学中医，上医治未病，家家都种点中药，都有中药柜，现在的医院，绝大部分都得倒闭。\n\
  \n社会上的医学架构应该让中医现代化，才是唯一出路。\n\n医疗科技发展到生命基因科技突破的那天，人类就不用再为健康担心，这是天下大同的前提条件之一。\n\n\
  但这个过程需要钱，钱从哪来，就需要人生病，第一提供实验标本，第二提供科研经费。\n\n为了天下大同，你必须承受科技发展带来的恶果！为了天下大同，现阶段你必须生病！为了新政权建立，你必须战死！\n\
  \n为了社会稳定有序，这几千年来你必须内耗！苦是为了不苦，生病是为了不生病，战死是为了不再死，内耗是为了不再内耗！这就是药方。\n\n中医起步早，是道，人体使用说明书，目前成熟稳定期，治本，研究活人的医学，靠人和自然，从自然中来，讲究天人合一，成本低，但不易学和推广；西医起步晚，是术，目前成长期，隔一段时间就得推翻，治标，是医学的补充，研究死人的医学，靠电靠机器，但容易学和推广。两者互补。\n\
  \n现在西医被诟病的地方主要在于西方医药资本家，这是全世界的最大资本，因为其他生意再好，比如军工资本，不可能天天打仗到处打仗，但是每个人都可以生病，从出生到死亡都可以生病，衣食住行都可以导致生病，所以西医资本是当今社会霍乱的最大根源；\n\
  \n由于当今是资本主义引导世界，资本主义里最大的资本就是医药资本，也就是，这个世界的幕后操纵者主要是西医资本家，他们只是聪明人，嗜血，不是悟道级强者，人类历史上的短暂过客。\n\
  \n养生很重要，年轻的时候不好好使用身体，过了 35 岁身体就开始玩你。\n\n**养生主要靠中医，学习中医最佳时间是小学阶段，开始养生是在挣钱的那一刻。**\n\
  \n没有一个人不后悔没有早开始养生，失去健康一切归零。\n\n**精神养生同等重要，精神内耗都不是一蹴而就。**\n\n防患于未然才永远是医疗头等大事，现在都把重点放到了生病后的治病上，只会给医疗资本、医疗从业者提供伤害病人的温床。\n\
  \n**借假修真别当真别较真，向内求，你本自具足，你是自己的肉体医生，90% 的病都是靠自身免疫力，你是自己的心理医生，只有自己才是自己的救世主才能拯救自己于水火；**\n\
  \n向外求，依靠别人，别人都是你的医生，你会变成所有人的病人。\n\n### 9. 管理四步走\n\n我的星球上所有的管理都是四步走，不管是个人、家庭、学校、医院、企业、宗教还是国家，无一例外。\n\
  \n**第一步信息植入，第二步奖励，第三步惩罚，第四步激发内驱力。**\n\n比如孩子管理：\n\n- 第一步：先告知他要怎么做、该怎么做、不该怎么做；\n-\
  \ 第二步：孩子做得好就奖励，精神性奖励，比如夸奖孩子；或者物质性奖励，比如亲亲、拥抱、买奖品等；\n- 第三步：孩子做得不好就开始惩罚，精神性惩罚，比如责备、侮辱、打压；或者物质性惩罚，比如罚站、罚钱或者挨揍；\n\
  - 第四步：都想激发孩子的内驱力，不需要前三个步骤的成本，孩子自己就可以管理好自己，不仅父母省事，效果还是最好的。\n\n#### 9.1 植入\n\n就是洗脑编程，通过文字信息，以父母的嘴、学校的书和老师的教育、职场的同事和领导，社会的各种媒体信息等途径告知给你。\n\
  \n每一个环节都创造了一套专属的专业话术。\n\n是不是所有父母说的话都差不多？是不是所有学生学的知识都差不多？是不是开公司的职场氛围都差不多？\n\n是不是各种影视剧及新闻信息的特定目的都差不多？是不是所有的政府宣传的价值观都差不多？\n\
  \n**做过销售的都知道，每一个产品都要有销售话术给客户洗脑，包括产品核心卖点、常见问题解答、抗性说辞演练、卖场的打造：阵地包装、环境包装、产品包装等，共同打造成侵染你的大染缸。**\n\
  \n**因为人是环境产物。**\n\n信息植入给你，你可以完成设计者要求的 30%，比如告诉业务员这个月业绩目标 1000 万，不加其他措施，他最多完成 30%，也就是\
  \ 300 万。\n\n#### 9.2 奖励\n\n创造出了精神性奖励和物质性奖励，比如宗教会说做得好可以上天堂，政治会说做得好你就是大好人好市民，学校做得好就是好学生，公司做得好就是好员工；\n\
  \n还设置了荣誉颁奖、奖金发放、工资提升、职位提升等等奖励；包括做生意也是如此，如果你买今天就可以额外优惠一个点或者可以抽奖等等，加了此措施你可以完成设计者要求的\
  \ 60%。\n\n比如告诉业务员这个月业绩目标 1000 万，再加上这条手段，他最多完成 60%，也就是 600 万。\n\n#### 9.3 惩罚\n\n\
  **创造出了精神性惩罚和物质性惩罚。**\n\n比如宗教会说做不到就会下地狱，会投胎成畜生；政治会有道德和法律对你的道德绑架以及法律制裁，公司会有侮辱式、打压式的职场\
  \ PUA 以及罚款、开除等手段，包括做生意：你要是今天不买明天就涨价。\n\n怕上火喝王老吉、不伤手的洗衣液立白等等，都是在吓唬你。\n\n惩罚就是在制造恐惧，演恐怖片，相当于在你身后放了一只老虎，不按照说的做你会死，所以你会拼命奔跑，拼命照做。\n\
  \n**但凡吓唬你的，跟黑社会性质一样，明显是通过拿捏人性达到他们的目的，物质和精神都被威胁。**\n\n**比如买房：**到了售楼部只要不交钱那话术：你要是还不买就涨价啦，还不买这套就被别人抢走了，夺命连环催。\n\
  \n**比如教育和医疗：**也变相成了黑社会，就差捅破那层窗户纸，就差主动上门主动打电话说：“你需要生病吗？我有服务，你再不生病我就把你拉进不再服务黑名单了啊。”\n\
  \n**再比如宗教**，是最大的精神黑社会，你光造福人传达正知正觉正念不就完啦，非得吓唬人。\n\n**尤其是当你质疑他们，那跟刨他们祖坟一样使劲吓唬你、诅咒你下地狱。**\n\
  \n以上的种种通过演各种恐怖片，各种心理暗示，玩的只是数字游戏和文字游戏，人类是世界上最经不住吓唬的生物，一个字一句话就能把你困在原地一辈子。\n\n通过制造恐惧，你可以完成设计者要求的\
  \ 90%。比如告诉业务员这个月业绩目标 1000 万，再加上这条手段，他最多完成 90%，也就是 900 万。\n\n#### 9.4 激发内驱力\n\n以上三个步骤跟训练狗一模一样，正常的社会运转，组织运转都可以实现，普通管理者够用；第四步若做到，就不需要前面三步，让人实现自我管理，能做到就可以做领袖做高管。\n\
  \n这种局面最好：成本最低、效果最好、内耗最少，但也最难。\n\n**常见的方法有：**使命、造梦、画饼、阶段性人生目标管理、职业规划、兴趣培养引导，士气的激发等。\n\
  \n以上这些方式都是因材施教，因地制宜，且都具有时效性，一般不能持续贯穿整个人生。\n\n激发内驱力的核心是围绕人性，如果能从小都在围绕三教理论模型为基础，以兴趣的方式，让孩子发现真正的自己，才能真正实现激发出内驱力，持久且能量最大。\n\
  \n### 10. 定期清理\n\n为了社会稳定有序，需要管理的核心群体是精英主义阶层。社会的动荡主要是因为精英主义阶层导致，在天下大同到来之前，这个阶层不会消失，任何手段也不可能消灭精英主义阶层，因为这个阶层的根源没有消失：比如人为造出来的欲望、等级、金钱没有消失，信息化时代没有到来等等。\n\
  \n有三种人最不好管：认知高、有钱、有权。\n\n认知越高、钱越多、权力越大的人，越不好管；而且认知越高的人认知会越来越高，权力越大的人权力会越来越大，有钱的人钱会越来越多。\n\
  \n**钱会流向不缺钱的人，权力会流向不缺权的人，智慧会流向不缺智的人。**\n\n这三种人还会合作、联姻，根系交织，让权力、金钱、智慧通过最原始的方式传播：血液传播、性传播、母婴传播。\n\
  \n这些群体如果不被定期清理，只会越来越强越来越多，容易失控引起社会动荡，甚至积累到一定程度就会颠覆原有统治，所以必须定期清理！\n\n除此之外的普罗大众，再怎么造反，都不用担心，都是小打小闹，比如杀人放火，坑蒙拐骗，甚至是农民起义，都成不了气候，只能成为牺牲品、利用品。即使天时地利人和都齐全的情况下打下了江山，也守不住。\n\
  \n#### 10.1 定期清理权力\n\n明明有制止贪腐的手段，为什么不用？\n\n比如公示财产、比如诛九族，还有好多方法都可以有效精准打击贪腐。因为让你贪就是个设计好的局，是个坑，是个陷阱，跟养猪一样，把你养肥就宰了。\n\
  \n- 第一：发展初期不留这个口子，欲望激发不出来，发展就会慢，没动力；一对比，位置都坐那么高了还是两袖清风，住茅草屋蹬自行车，就泄气了。\n- 第二：优秀人才招揽。如果其他行业都可以发财，唯独当官喝西北风，优秀的人不可能被招安。\n\
  - 第三：发展过程中一定会遇到问题，就可以借“打贪”以泄民愤，转移注意力，转移矛盾，并收复民心。\n- 第四：大型组织一定是臃肿的、论资排辈看不到希望的，让那些贪的人腾出位置，内部活力重新被激活，这是个完美闭环。\n\
  \n#### 10.2 定期清理金钱\n\n金钱最腐人心，因为创造出金钱后，金钱又创造出了欲望。\n\n- 第一：清理金钱的方式有：房贷车贷消费贷、创业骗局、理财骗局、投资骗局、泡沫经济危机、不断印钞通货膨胀等等，不同的人群对应被骗的方式不同，但本质都一样。\n\
  - 第二：就业；专业技能会随时被淘汰。\n- 第三：创业；创业需要经验和公式，普通人创业大概率把钱交给了房东、给员工发了工资、给政府纳了税，自己最后赔个精光还容易负债。\n\
  - 第四：普通人根本不可能富裕，早就设计好了。古代开始有针对百姓的 33 两白银，都有钱了谁还干活？都有钱了谁还听话？哪个组织不提前设计好平均收入？\n  \n\
  \  而且穷人互撕，富人互持，你身边的人一定不希望你过得好，会往下拉你；上面的人位置太有限，一定不会轻易放人上来，通常会往下踩你。\n  \n  还有你从小到大接受的务虚教育，不能产生结果不能挣钱的教育，加上各种消费主义陷阱和通货膨胀，你这辈子能挣到钱是本事，能守住钱更是八辈子的幸运。\n\
  - 第五：最近很多明星十几年没出来开演唱会、直播带货、拍垃圾影视剧，节操掉一地、跟百姓抢饭吃、晚节不保，那是因为突然连续出来，是因为钱被清理了，没钱了，负债了。有个几千万几个亿的小卡拉米不要嚣张更别狂，有个几百万的不要轻易理财，有个几十万的存好即可，啥也别乱想。\n\
  - 第六：如此一来，第一，财富清零，奋斗不止，社会稳定有序；第二，财富减少，威胁降低，社会稳定有序。\n\n钱是普通人最大的底气，失去了钱，做人就又开始懂规矩守规矩了，社会稳定有序！\n\
  \n> 这个世界上，除了你自己，全世界的人都在想着法儿地想从你兜里把钱掏出来，是任何人。\n\n#### 10.3 定期清理认知\n\n认知都是在不停变化的，即：**你终生必须保持学习，保持更新认知。**\n\
  \n创业的知识、营销的知识，医学的知识、修车的知识等等一切所谓的知识，是不是每隔几年都有新书热卖？\n\n时过境迁，跟不上时代都会被淘汰，经验主义教条主义的人都只研究了术，而没有悟道，就会被社会被时代一直牵着鼻子走。\n\
  \n包括很多大咖，顶级企业家，只要是时代过了，他们的认知就是垃圾，他们就是被遗弃的货，做什么再也做不起来。\n\n道，一成不变。\n\n清理认知的方式有：宗教、教育、禁书、转移真相注意力的媒体宣传等等。\n\
  \n所以，别有点权力就开始刺毛，别有点金钱就不知天高地厚，别有点文化就自视甚高，你们都是狗，都是被驯化的狗，都是苍生之局里的一环，都会成为社会稳定有序的牺牲品、祭品。\n\
