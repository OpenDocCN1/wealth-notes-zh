  \ 3-5 次。\n\n#### 3.3 自学中医\n\n- **第一：** 中医是身体使用说明书，应该从小学就得教授中医基础理论，人人都得学习。中医更是无上智慧：上医治国，中医治人，下医治病。中医讲究天人合一，治病也治心。道医、蒙医、苗医、佛医等都是中医，中医讲究的是山医命相卜。\n\
