- '## 第一章 原始阶段（天道）


  上百万年前，人类这个生物开始出现，在原始阶段一待就是上百万年，这期间的规矩只有一个：**天道！**


  天道就是宇宙规律，包括自然规律，从宇宙诞生之初，就一直存在。


  天道是老规矩，你上百年的家族规矩不是老规矩，人类几千年来的老规矩也不是老规矩，都是姗姗规矩新规矩。


  天地万物都遵循天道而行，包括人这个生物、花草树木、猫猫狗狗等一切；


  在后来人为的混乱阶段，除了普通人，都依然还在遵循天道，比如各种植物动物、婴幼儿、强者


  天道、宇宙规律、自然规律的存在，是为了宇宙稳定有序。


  此规律目前适用范围是：人类实质探测过的宇宙区域的万物


  ### 1.混沌一体


  原始阶段只有宇宙世界，只有天道，混沌一体：善恶好坏一体、是非对错一体、爱和伤害一体、贫富生死一体……


  对立且统一，万物一体，万法一体，万念一体。


  可理解为：


  既没有善也没有恶，或者既有善也一定有恶，有了善一定有恶，都善或者都恶就没有善恶，善到极致是恶，恶到极致是善


  既没有是也没有非，或者既有是也一定有非；有了是一定有非，都是或都是非就没有是非，是到极致是非，非到极致是是


  既没有对也没有错，或者既有对也一定有错；有了对一定有错，都对或都错就没有对错，对到极致是错，错到极致是对


  不遗憾就是一种遗憾，完美就是不完美；


  都有道德就不存在道德，道德绑架别人就是没道德；


  理想主义与现实主义、务虚和务实、唯物主义和唯心主义……


  它们相对宇宙来讲，只是一份存在，没有二元对立


  虽诞生了人类，但这个时候没有发明文字，不会说话，不会思考，也就没有定义；人类没有参与改造社会、改造自然、改造宇宙，只有一个平静混沌的宇宙。


  此时没有人类世界和个人世界，善恶美丑对错好坏都没有，什么概念也没有，更没有人道，也不需要找到自己的道。


  > “天地与我共生，万物与我唯一”。


  **天地万物道用一体：天道！**


  ### 2.天道=无


  天道是无，人道是有，天道是 0，人道是 1，宇宙就是由 0 和 1 组成。


  我们终其一生要追求的是无不是有，无病无灾、无忧无虑、无欲则刚……无极生太极，无中生有，才有了后来的人道


  #### 2.1 无情


  万物有灵没有情，天若有情天亦老。


  天地万物，既无情绪，也无情感。


  天没有情感，下大雨淹死你不管你是好人还是坏人；地没有情感，地震震死你不管你是婴儿还是孩子；花草树木没有情感，在原始阶段的人类也没有情感，你不会同情一个残疾人，没有亲情爱情友情各种情


  天没有情绪、地没有情绪、花花草草没有情绪、猫猫狗狗没有情绪、原始阶段的人类没有情绪、现在的婴幼儿没有情绪、现在的强者没有情绪，<u>只有平静，平静的笑，平静的闹，在情绪之外。</u>


  比如一只狗被另一只狗欺负，被欺负的这只狗在被侵犯时会龇牙咧嘴，另一只狗只要不继续欺负，这只狗瞬间忘却此事恢复如初，不会过了一年还在生气；再比如婴幼儿之间闹别扭，既不记仇也不放心上；再比如婴幼儿无情，他不会对任何东西有感情，不会同情和害怕任何人，皇帝的儿子他都敢揍；再比如强者平静如水，都是身受心不受


  天地不仁以万物为刍狗，圣人不仁以百姓为刍狗，父母不仁以孩子为刍狗。


  天无情，但天有阳光雨露，给了万物生命，世人觉得天爱苍生，都在为老天歌功颂德；


  花草树木无情，但绿意盎然和生产的氧气人类生存不可或缺，爱意洒满人间；


  帝王无情，李世民无情了杀掉自己的兄弟和父亲，才成就了千古第一盛世，武则天把自己的孩子基本全部杀完，才成就了千古第一女帝，哪个开国帝王将相背后不是皑皑白骨，打仗之前都会先预计花多少钱、打多长时间、死多少人，打仗就是死人，死谁？都是有计划有纲领，牺牲了你还得让你的后世歌功颂德；


  圣人无情，比如佛陀抛妻弃子，但世人皆说他有大爱，他渡你实则是渡己而已，若他动了渡你的心，必有所累，就不可能有无限能量渡更多的人，心理医生为什么是高危行业，因为都是人类思维，都还有情感情绪，到最后把他自己干抑郁了。


  你眼里的度人，在圣人眼里，只是一场“你问他答”的对话而已，他只管好自己，就像天给了你风和阳光雨露，花草树木给了你绿色氧气，他们只是管好自己，你能否接收吸取，那是你的事，他们对你都是无情的。


  <u>无情才是有情，无爱方成大爱，无情和有情、无爱和大爱，混沌一体。</u>


  包括对孩子的爱，社会复杂黑暗，若下不了狠心让其遭受毒打历练，这样的有情，反而害了他；包括对弱者的有情同情更是害了弱者，车站广场断手断脚乞讨的越来越多，失踪的孩子越来越多，皆是因为世人的有情，你不同情他们，就不会有势力盯上这块蛋糕。


  **放下助人情绪，尊重他人命运。**


  无情之人情商才会更高，因为容易情绪化的人情商高不到哪去，无情才会玩情绪演情绪，甚至控制情绪，无情之人在情绪之外，非无情之人都在情绪之内，是情绪之奴隶。


  #### 2.2 无聊


  - 月亮绕着地球转、地球绕着太阳转，转了几十亿年，无聊不无聊？

  - 太阳每天东升西落，地球每日白天黑昼，无聊不无聊？

  - 花草树木从出生到死亡一直待在一处，无聊不无聊？

  - 世界冠军年复一年日复一日重复同一个规矩和动作，无聊不无聊？

  - 婴幼儿每天躺平，玩一个你认为不是玩具的玩具一玩就是半天，无聊不无聊？


  很多悟道后的强者圣人会选择归隐，甚至抛妻弃子，门也不出，那地方毛儿都没有，无聊不无聊？


  每个人出生都会死亡，无聊就是死掉的浪漫。


  无聊是天道，好无聊=好生逼，好无聊=好享受，无聊到了极致就是有趣


  无聊的一个重要特征是周期、轮回。


  月圆月缺有周期，经济有周期、政权有周期、生命有周期、季节有周期……研究天文现象、政治活动、经济活动、农耕种植、宇宙元素、科技发展等等，都需要把周期当做核心课题之一。


  只有无聊的重复才有安全感，安全感才会带来幸福。夫妻之间如此、情绪状态如此、事业经营如此、社会治理亦如此。


  周期轮回的重要表现之一是博弈，任何二元对立之间的博弈亦有周期。比如善和恶周期性的博弈，清明与污浊周期性的博弈，盛世与衰败周期性的博弈等等，善到极致就会出现恶，清明到极致就会出现污浊，强盛到极致就会衰败，反之亦然。


  二元对立之间的博弈呈现波浪式滚动前行的正弦波模式。如果社会很黑暗、局面很糟糕时，那就推波助澜让它黑暗到极致、糟糕到极致，交给丑恶来开垦，看它造出个什么世界！


  周期的重要特征是反者道之动，即否极泰来、物极必反、福祸相依，一个状态出现必然走向其对立面。


  当你出生了一定会走向死亡，精力最强盛过了就开始走下坡路等待死亡的到来；当月亮圆了一定会缺，最圆的时候是缺的到来；


  太阳升起了必然走向落下，升到最高的时候就是落下的到来；经济活跃起来了必然走向低迷，经济最低迷时就是活跃的到来；


  当你人生低谷时一定会走向反弹，人生最低谷时是反弹的到来。


  所以，当你顺风顺水春风得意时就越要低调，当你混的越是不尽如意时越要高调……


  #### 2.3 无常


  天是无常的。说热就热说冷就冷，雨说来就来，天气预报也不准，有时慈悲的滋润万物，有时残暴的毁天灭地，天可以善良可以残忍；


  水是无常的。能变成固态液态和气态，水能救你也能杀你，水可以在天上可以在地下可以在大海，可以在杯子里可以在碗里也可以在水壶里，水无处不在；


  婴幼儿是无常的，说哭就哭说笑就笑，前一秒还在打架，后一秒就和好如初；


  人生是无常的，水无常形人无常态，每个当下都是偶然，说生就生说死就死，半点不由人，有时能赚到大钱有时都吃不饱。


  计划赶不上变化，只有猪圈里的猪，才什么年纪做什么事被定义好了，你可以变幻莫测，可以真真假假，比如人不一定要说真话，要说对自己有利的话等等


  然而个人和社会都喜欢确定性，其实是喜欢安全稳定，经验主义就会诞生、固执就会诞生、规则规矩制度就会诞生，都属于封闭性自治，也是弱者思维，是到了混乱阶段驯化演化的结果，是为了社会稳定有序，所以你接受的信息从来都是按部就班、循规蹈矩。


  相反，天地万物包括强者拥抱不确定性，接受无常，利用无常，享受无常，变成无常。


  无常是天道，原始阶段的万物生灵包括你皆与天道一体，你就是无常本身。


  当你意识到并变成无常本身时，一切无常的发生对你来说就是平常，一切发生皆有利于你，什么都能接受，什么都允许发生，来啥解决啥，遇到啥享受啥，**允许的力量大于一切！**


  #### 2.4 无相


  在原始阶段天地万物是无相的，无众生相，更没有定义更不会被定义，连文字都没有定义个 der 啊。


  没有文字没有名字、没有多愁善感、没有七情六欲、没有工作、没有任何概念。水在碗里就是碗的形状，在杯子里就是杯子的形状，水能变成固体液体气体；


  钱都是无相的，一直在变，最开始是贝壳，再后来变成了布、金、银、铜币，现在是纸币，以后应该是数字……还有，你跟王八说它会死的，它有反应吗？你跟狗说你太敏感太小气了，它有反应吗？


  你在幼儿园你跟驴说你得结婚得传宗接代，它有反应吗？


  是有了文字之后有了定义，人类开始着相，一句话就可以把你困在原地一辈子。


  即使到了人为的混乱阶段，人类里的婴幼儿、强者，千面随心，没有人设就是人设，谁也定义不了他们。


  你本无众生相：无文字相、无亲密关系相、无时间相、无生死相、无教育相、无医疗相、无工作相、无情绪相……


  你也没有缺点优点，只是你的特点；你的性格没有好坏，只是你的色彩。


  只要对你不是正向的定义，都是扣帽子、都是 PUA、都是站在他自己立场、自己利益下的偏见。


  #### 2.5 无为


  无为不是啥也不干，是找到自己的规律形成内驱力后的为。


  原始阶段天地万物都没有人为，没有管理，道法自然，天道在管，天道就是规矩，无为的管。




  比如大自然的风景最美，无人为，天然规律形成；每片叶子不同，每个人不同，人的身体精密程度远超光刻机，无人为，天然规律形成；天地万物这辈子只有一件事：只管好自己。


  只管好自己就能自律，即无为才能自律，不自律就会被他律。自律就是找到自己的规律，自己的频率和规律是老天给的，需要通过不断地干，在干的过程中它自己冒出来的，无为而为。


  不能自我管理，就一定会被他人管理，被谁管理就是顺应谁，自我管理是顺应自己，顺应自己才能做到无为而为。


  做天然的自己，做自然的自己。


  太阳只管好自己发光发热，不管其他星球。花草树木只管自己生产氧气，不管其他生命。


  你想像太阳和花花草草那样成就别人，就请你只管好自己，成就了自己才能成就别人。


  自己能做主的事才是自己的事，不能做主的事就不是自己的事，不是自己的事管它干嘛？


  只管自己要不要干、怎么干；别人对你什么评价是别人的事，因为你管不了，既然不是自己能管的事，别人咋评价都行，只管好自己该做什么该怎么做。


  到了人为的混乱阶段，也就是人类世界出现后，就需要对应天道规律的人道规律和规矩。


  家有家规，国有国法，在哪里都是无规矩不成方圆，都是人道的一部分，都是为了社会稳定有序。


  若你管不好自己，背离与生俱来的天道，就一定会被管理，陷入人道一直被管。


  出生前输精管输卵管，出生后父母管老师管领导管社会管，生病时氧气管导尿管导尿管，死了殡仪馆，管管管管管。


  整个社会都要向输卵管输精管学习，顺其自然、让精子是精子让卵子是卵子，只做引导，不 PUA、不灌输充满自身偏见的低维思想。


  出生前，输精管输卵管是顺应天道的天然管道，是为了服务你让你成为自己；


  出生后一直到死，全部被动地管，侮辱式管打压式管，结果让你失去了自己。除了工作管理以外，生活中你还管别人？


  问问自己愿不愿意被管？你不愿意；


  问问自己能不能管好自己？你不能！那你凭什么管。


  比如你付出，可以随时收回，但是你索取，就会惴惴不安。因为付出能控制，是自己的事；索取得对方给，能不能得到是别人说了算，本质上与你无关。


  比如爱情，你只管付出真心，只管好自己，不干涉他的内政，婚姻持久的概率会增加。**如果希望得到对方的爱、关心、金钱，这个念起，结果就交到了对方手里。**


  但人性是相反的，世界是相反的。你越索取，对方就会越反感，你越索取，姿态显得越低，还会被瞧不起，甚至让人觉得恶心。只管耕耘不问收获的意思是：收获不归你管，别多管闲事。


  爱出者爱返，福往者福来。<u>你越想要什么，就越会被什么控制，当你什么都不想要的时候，天地万物都是你的，降低对结果的期待，你想做什么，就只是去做而已，只管好自己。</u>


  <u>像天地那样、像花草树木猫猫狗狗那样、像婴幼儿那样、像悟道级强者那样</u>。


  混乱阶段的各种组织也需要做到无为而为，再牛的人去管人也管不过来，只有像天道规律那样合情合理的人道制度和规矩去管人，让人类都找到自己的规律实现自我管理自我驱动，从而把人道规律融入每个人的血液骨髓，形成他们共同的下意识，像原始阶段上百万年的天道那样，达到无为而为。


  #### 2.6 无我


  我是我，我不是我，我还是我。


  你认为的我，是混乱阶段发明了文字会说话会思考之后的我，是被驯化而来的我，有身份信息，有人际关系，有七情六欲等等，你觉得我是我但我有灵魂，灵魂不生不灭，肉体只是我的工具，用完再换，我还是我，肉体的我不是我；原始阶段的我这个字都没有，哪来的我？


  此时的我有灵性、人的特性、兽性，到了人为的混乱阶段，为了社会稳定有序，我的灵性被打压、兽性被打压、人性被驯化，把我大脑为主题的肉体驯化后的我，是假我，所以我不是我；


  但人类文明不可逆，还要追求天下大同，灵魂的我再牛，没有这个身体一切都是0，所以这个身体还得好好用，通过这个身体拥有的一切也得用，这时，我还是我。


  由于失去了真正的自己，所以人活着的首要事情是找到自己，只有找到了自己，才有机会超越自我，超越自我就是无我，只有无我才能链接高维；包括不要脸也是无我，都是原始阶段的特征，不要脸与生俱来，无我与生俱来。好面子、脸皮薄属于逆天而行。


  参考花花草草猫猫狗狗、婴幼儿、强者。


  #### 2.7 无念


  没有任何念头，无任何观念，没有任何想法，没有规划，没有计划，没有目的。比如活着就是活着，不会去想活着是什么、死亡是什么、活着的意义是什么。走到哪算哪，遇见啥解决啥，只专注事情本身，要不要做要怎么做，无心生大用，不会思考结果如何，反而收获是多的。参考花花草草猫猫狗狗、婴幼儿、强者、水。


  我的世界里只有0和1，不仅不内耗，能量一直是满的。


  - 第一、没事的时候是0，什么念头什么想法都没有，跟婴幼儿一样，跟天地万物一样，跟回到一万年前一样，没有文字不会说话。天地万法皆空，就是0。

  - 第二、有事的时候是1。比如这个世界驯化了喜怒哀乐忧思悲恐，我只有平静；一天有五件事要做，我只专注一件，解决一件是一件；面临好几个选择，我只选一；创造的时间有过去当下未来我只有当下，有1点两点五点十二点我只有当下。


  当下就是1。遇到事就1，不遇到事就0。


  0和1就是世界的本质，但这个世界创造了n：n个情绪，n个国家，n个语言、n个行业……让你无法0或1。


  第一阶段：失去了自己，内核不稳定，自己乱七八糟，这时的自己是n。

  第二阶段：找到了自己，定力十足，这时的自己是1。

  第三阶段：没有自己或者自己无处不在，无我，这时的自己是0。

  0是天道，1是人道，天人合一。


  #### 2.8 无住


  任何事不往心里去，过耳不过心，慈悲不沾身，身受心不受。随时都是清零状态，随时都是当下状态，没有过去和未来，参考花花草草猫猫狗狗、婴幼儿、强者、水。


  #### 2.9 无言


  这个阶段天地万物没有文字，没有语言，灵魂交流。


  天不会说话，地不会说话，花草树木不会说话，猫猫狗狗不会说话，婴幼儿不会说话，即使现在的你一出生就扔到森林你也不会说话，强者智者惜语拈花一笑。因为一说出来就错，一说出来就有立场，一说出来就是偏见，再伟大的作家也只是书写自己的偏见，再有智慧的悟道大师表达的也只是高于人类的偏见，大道无言。


  #### 2.10 无亲


  天道无亲，在原始阶段的天地万物没有任何亲密关系，天是孤独的，地是孤独的，人类族群是孤独的，花草树木都是孤独一生，到了混乱阶段为了社会稳定有序创造出了各种亲密关系，都是假的。


  婴幼儿跟你亲密吗？有奶便是娘，从小把他放到狼窝里他就认狼是娘，在他的世界里没有父母没有夫妻没有孩子这些概念。


  你出生时孤独，死亡时孤独，任何关系你都带不走都不属于你，你的一生都孤独。越优秀越孤独，优秀的过程就是孤独的过程，老子佛陀更孤独，归隐了都，追求的就是孤独。


  **人际关系带来的大多数都是痛苦，人是万恶之源，好孤独=好享受。**


  <u>心外无物，心之外世界上没有任何东西只有你自己，你的精神世界里只有你自己，你是绝对孤独的。</u>


  即使你跟爱人每天睡在一起，你在想什么对方根本不知道万分之一，表面上你跟对象过日子，实际上是你跟自己过日子；


  历史以来的所有人都是你，你眼里的所有人，都是你自己。你对所有人的评价，都是你内心在这个世界的投射投影，你评价的是自己；


  你拜佛拜的是自己心中的欲望，你拜的是自己；你娶媳妇娶的是当年自己的认知，换一个人也是你喜欢的类型你照样结婚，你娶的是自己。


  这个世界只有你自己，管好了自己，就管好了全世界，处理好了跟自己的关系就能处理好其他人际关系，爱己才能及人。


  始终如一、无条件鼓励你、支持你、爱你的人，只有你自己，你苦苦寻找爱自己的那个人不是父母不是爱人不是好友更不是神明，是你自己。


  全身除了你的大脑是个二蛋，你的每个部位每个器官每个细胞，都清楚地知道只效忠你自己保护你自己，誓死也要救你于水火；全世界90%的病治不好，都是靠自愈，不管是身体疾病还是心理疾病，都只能靠激活内在的免疫系统这个真医生。


  在这个绝对孤独的世界里，没有救世主，唯有自救。向外求要是能取得真经，皇帝早长生了，还天子？不就是神的奴隶，作为天子你爹几千年来了不断地弄死你。


  你被神奴役，又被法家锁喉，还被儒家捏肋，还活不活？


  **唯一出路：找回与天地共生的真我。**


  ### 3. 生命本质


  这个阶段，星球上的一切生灵都是和谐共生，道法自然。


  困了去睡，饿了去吃，憋了就尿，走到哪算哪，遇见啥解决啥……


  除了“食色性也”这个生命本质，其他都不存在。


  **天地万物，吃饱喝足后，多一点东西都不要。**


