  - **第五：自成体系。** 对个人世界、人类世界和宇宙世界的各种问题有自己成体系的理解。看人类的一切行为就跟看小孩子玩过家家一样，入世和出世之间可以随意切换。完全无相随心，到哪都能修，干啥都是修，需要解决问题时就从高纬入世降维解决问题；不需要自己时就淡然出世，安贫乐道，采菊东篱下。


  串联起这几个环节的就是干，即：**事上练；不断经历，不断熟练的过程就是事上练。**事上练对修行起到的作用至关重要。


  - 第一：到下一个修行阶段的催化剂，也是地基。没拿起过没资格谈放下，事上练就是拿起的过程，修行就是先拿起，再放下的过程。

  - 第二：纠偏，修行很容易修进误区，跟打游戏通关一样，各个环节都有陷阱和误区。**最好的老师就是干。**


  ### 3. 修行的乱状


  修行本是一种体验生命的宇宙客观事实，像其他天道一样顺其自然运行即可，但现在修行不仅变得紧迫还很痛苦，一点也不道法自然，一点也不可爱。


  #### 3.1 只有灵修


  人性有灵性、人性和兽性，只有灵性修行这不是偏科嘛？人修呢？兽修呢？只谈灵修要么是不懂，要么是骗钱。只是灵修，很容易走向虚无，很容易愤世嫉俗，很容易躺平。天天吃饱撑的虚头巴脑，生存呢？健康呢？最基本的都舍弃还叫修行？


  **最接近真修行的是道家道教：有灵魂修行，甚至修仙；也有兽修，道医救死扶伤更能自救，道家养生功法在养生领域也是无敌的存在，且道士自己种药采药制药。**


  更有人修，各种手段谋略都是人类顶级，最初级的也学会了一些风水、八字等等的术可以谋生，绝不会靠别人施舍生存。


  没有人修获得的物质基础，一切都是空谈，没有人修入红尘见众生，修行是无根之木。


  除了这个教派不仅务虚也更务实之外，其他教派的修行都是以灵修这种务虚为主。


  每个人都拥有身体和灵魂，都拥有物质世界和精神世界，都拥有大脑和直觉；也就是修行是要让自己的身体稳定有序，让自己的灵魂稳定有序；修行要让自己的物质世界稳定有序，让自己的精神世界稳定有序；修行要让自己的大脑稳定有序，让自己的直觉稳定有序；不偏不倚，不左不右，守中。


  假借灵修之名，骗色敛财者居多，妖言惑众者居多。


  甚至常常把无法证得的宇宙奥秘包括鬼神仙妖魔以及轮回转世挂在嘴边。


  你能看见你无法证明给我们看跟你没看见是一样的，你看不见也可以说自己能看见因为别人看不见，宇宙很神秘，没探索到的暗物质暗能量很多，自己研究没有问题，但公开讨论这些没有意义。


  好比关于造物主的讨论，神化造物主是典型的造神运动，造崇拜运动。


  - **第一：如果有造物主，那制造造物主的是谁？制造造物主的又是谁？往上接着推演，根本没有答案，因为宇宙允许没有答案，且大部分没有答案；**

  - **第二：如果有造物主，有没有可能造物主就是个智障，比如人类发明了人工智能，人工智能如果实现自我迭代，在他们眼里制造他们的造物主，也就是人类，在他们眼里不就是智障。**


  只谈今生，不讲轮回，轮回若存在，但记忆不连续，又有什么意义，要为人过好今生，过好当下；子不语怪力乱神，不管有还是没有，闭嘴不讨论，劝人只管好自己，不管牛鬼蛇神。


  #### 3.2 新型消费主义陷阱


  **第一：课程最贵，世界上最贵的课程，除了商业咨询就是修行课。** 动辄线上几节课都能几万起，线下课程几百万几十万的很正常。


  有钱人的钱骗了也就算了，居然给普通百姓洗脑：生命是无价的，无上智慧是无价的，卖房子算啥，卖血都得干……


  - **第二：道场盛行，应试教育化。**


  资本闻着味来了，这年头赚钱的行当不多，这块肥蛋糕资本早已开始商业化操作。


  第一步寻找“大师”：只要口条好，蹲过大狱的都可以是大师。


  创业失败的、讲国学的、讲玄学的、搞传销的、道士和尚这些人群是首选。


  第二步包装：给这些大师搞一堆名头，各种信任背书，甚至说他们是弥勒佛转世、紫薇大帝转世，有的会找一堆山区孩子给这个大师领养，大慈大悲，功德无量的人设完成。


  第三步建道场：有天有地有烟火气，一般寻找有自然之美的地方作为道场，学员可以来此求学问道，来汲取能量，有学堂、有食堂、有住宿部。


  第四步收割：线上365天直播，线下全国各地会议室营销，开光物件售卖、课程售卖、会员售卖、能量汲取售卖、天价见面费、带着学员去拉练。


  挣钱是为了混口饭吃为了养家糊口为了生存可以理解，甚至不挣钱的也很多，总之真正的悟道级大师绝不会割韭菜，但只教别人如何在你这花钱，却不教如何让别人挣钱，只有你挣钱，这样的地方是修行道场？这样的人是大师？卧了个槽，还不如传销。


  #### 3.3 着了修行的相


  众生相新增了一个修行相：


  **倾家荡产也得修行、不吃不喝也得修行，执着了，刻意了。**


  **万事万物皆是修行，一颦一笑皆是修行，吃喝拉撒皆是修行，呼吸睡觉事业打拼皆是修行，七情六欲皆是修行；**


  能开悟得道挺好，做个普通人拥有人类情感享受七情六欲可以哭可以笑可以感动也挺好，都是生命的体验，没有好坏。


  修行是无相的，任何人都可以修行，任何时候都可以修行，在哪都可以修，做啥都是修，任何形象都可以是大师。


  六祖慧能不识字，农民种地都能悟道；


  金刚怒目也是修行，不是单一的慈眉善目的影视剧形象；修行可以在深山，可以在庙观，也可以在红尘，小修在深山庙观，大修在红尘。


  #### 3.4 动作变形的修行


  - **第一：修出优越感。** 看不上自己周围的人，甚至都看不上人类，张嘴闭嘴都是你们人类怎样怎样，变得格格不入，一般发生在刚开悟不久。

  - **第二：修到向下虚无。** 一般发生在觉醒阶段，虚无就是觉得没啥意思。如果向上虚无直至归隐也算，但就怕觉得活着没啥意思，直接抑郁。

  - **第三：修到愤世嫉俗。** 自我感觉认知提升，看到很多真相，就是没看全，没看淡，变成愤青。

  - **第四：逃避现实。** 现实中越有钱的人修行的越多，明星、企业家出家的最多。刻意修行在某种程度上可以理解为吃饱撑的，逃避现实的一种方式，因为当人生处于低谷，或者社会出现危机时，这时候人类开始务虚，甚至走向虚无，修行的人在此时会大批量出现，寻求脱离痛苦，追求觉醒。穷则独善其身，达才兼济天下。


  **当你遭遇人生低谷，请你停止思考，你思考个鸡儿啊，修行修行，在行动中修正才是修行，行动起来才会从内心生出智慧。**


  读了多少伟大的思想，你也只是思想搬运工，拜了多有名的大师，你也只是大师复读机。

