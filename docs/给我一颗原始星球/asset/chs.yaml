  \n##### 3.3.1 颈椎病和精神内耗的关系\n\n颈椎病非常容易引起各种精神内耗：焦虑症、躯体化症、心脏神经官能症、惊恐症等。原因是但凡肩颈胸开始紧张，呼吸就开始受影响，就可能会引起濒死感，颈椎病最容易引起胸椎胸腔膈肌肩胛骨问题，这些都容易引起呼吸问题。\n\
