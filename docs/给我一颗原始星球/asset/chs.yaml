  尤其是后来认为创立了人类世界人类文明之后的人道，也就是混乱阶段，全都是假的，假的空气、假的食物、假的水、假的人际关系、假的理念、假的情绪等等。


  假的你都不斗争不反抗，那你的精神世界和肉体世界必然崩溃，失去自我。人心才是主战场，思想斗争也是斗争！


  #### 8.2 伤害


  斗争必然带来伤害，伤害是天道。在天道里斗争和和谐是混沌一体，可理解为既没有斗争也没有和谐，或者既有斗争也有和谐，它相对宇宙来讲，只是一份存在。


  人生而伤害，生而掠夺，生而索取。你没出生前不会伤害任何事物，从你一出生，就从宇宙掠夺了一个灵魂，一走路就会踩死地上的微生物，一张嘴呼吸就会把空气中的微生物消灭，你考上大学必然意味着有人落榜，你升官了必然会导致其他人落败……


  只是，__原始阶段的伤害是不起念的__。好比天下雨淹死了地上的人，不管好人还是坏人一起被淹死，但是天下雨的目的不是专门为了淹死谁谁；再好比树木长大导致大树底下寸草不生，但是树木长大的目的不是专门为了杀死身边的花花草草；再好比狼吃羊，狼只是为了生存，不是为了伤害羊，羊也没觉得这是伤害。


  __可以伤害，不是不让伤害__。


  - **第一、当有人伤害你时，对待熟人你必须斗争，对待陌生人尽量释放善意。**除非可能出现的伤害足够大；这时伤害对方是天道，是大道，是正道。

  - **第二、当生存这个生命本质都出现问题时，你可以选择去吃鸡鸭牛羊，甚至吃人；**你不是为了伤害别人，只是为了生存，没有起伤害别人的念。

  - __当生存都出现问题时，人为造出的道德是没有力量的，法律也没有力量。__

  - **第三、距离越近，越容易产生伤害！**天打雷，劈到的一定是正下方最近的区域；地震，掩埋的一定是正上方最近的区域；大树生长，寸草不生的一定是大树底下，与你最亲近的人才是你的主要伤害之源。


  所以要对陌生人常怀有善意，对熟悉之人要抱有防备。


  距离越远的陌生人一辈子就见一次，给他们一丝温暖的善意，人生将处处是惊喜，这个世界是反着的。


  #### 8.3 保持距离


  宇宙既对立又和谐，混沌一体，宇宙不会起念刻意制造二元对立，既有伤害也有爱。保持和谐、保持不被伤害的天道是：保持距离！


  一切人际关系必须保持距离，这是天道。


  因为不保持距离是伤害，甚至是毁灭。


  地球跟太阳不保持距离，地球都没了；花草跟大树不保持距离，花草都没了；城门不失火，就不会殃及池鱼……


  原始阶段没有亲密关系，只是食色性也，在人为的混乱阶段就据此创造了亲密关系：家庭关系父母、婚姻、子嗣，朋友关系等等，亲密关系的意思就是不保持距离，所以家家都有一本难念的经。


  比如婚姻，以前讲相敬如宾，互相尊敬，懂得保持距离，婚姻制度一直相安无事地存在；但今天的婚姻必然走向没落，甚至条件允许时可能会退出历史舞台，因为历史以来从来没有像今天如此宣传爱情：2006年才有了法定节日七夕节这个爱情节日，现在倡导自由恋爱也就几十年的光景而已，满天都是爱情电视剧电影和书本故事，爱情里全是“你要理解我、支持我、爱护我、关心我、呵护我”等等，意思不就是把距离越拉越近，导致婚姻制度面临崩溃，大面积的离婚现象必然出现！这是道，其他解析全是术。


  ### 9. 丛林法则


  “人善被人欺，马善被人骑”、“软柿子就是用来被捏的”、“狼吃羊、猫吃老鼠”、“弱小的狼会被族群遗弃”……


  到处都是弱肉强食，弱者的命就是被强者宰割，这是天道。


  当物种没有天敌，敌人将是同类，人吃人！这是天道，宇宙铁律！


  只要宇宙还存在弱肉强食这个丛林法则，就不会存在公平；亦或者说：不公平就是公平，能保持部分公平，就已经要了人类统治阶级的亲命，几千年来一直如此。


  公平是到了人为的混乱阶段人为创造出来的，是假的。




  本自具足，你自己就是全世界。你就是自己的天自己的地，你就是自己的父母自己的朋友，你就是自己的贵人自己的医生，你就是自己的阎王，你就是自己的老板，不需要别人提供工作，挣钱的机会自己创造就可以。人是创造型生物，学习型生物，你想学啥自学就会：走路不用教，自学；说话不用教，自学；从小把你扔进狼窝天生就会有狼性，不用教，自学；第一个老师第一本书怎么出现的，自学；世界各项进程只会在强者出现时才会加速改变，这些强者人类教不了的，自学；治病自学中医即可，本自具足。


  是到了混乱阶段后，这个世界有人怕你自学了他们不想让你学的内容，那就出事了，影响社会稳定有序，影响人类顶层设计的这个苍生之局。


  **所以把学变成了教，让你逐渐失去主动的自学本性，依赖被动的教导被动的给予。**


  比如教科书、教室、教学；不是，是学生、学校、学习、学堂；比如佛教、儒教；不是！是佛学、道学、儒学，强调的都是学而不是教；加上了这个“教”字，从纯粹的探索世界变成了有目的的改造世界。


  现在是互联网时代，你有手有脑子还有手机，你在哪钱就在哪，机会就在哪，一切就在哪！


  感恩一切，接受一切，更不服一切，可以用别人、用万物，生死一切，只靠自己。


  ### 11. 天道=强者思维


  有一部电视剧叫天道，参破天机之人都是强者，天机就是天道。


  花草树木猫猫狗狗、婴幼儿、强者都不会被一句话困在原地一辈子，不会内耗。


  你天生就很强，就是天道本身，这个规矩持续了上百万年，婴幼儿时期的你连皇帝的儿子都敢揍，首富的儿子的玩具都敢抢，没脸没皮无法无天，心中无念目中无人。


  你变弱是因为后来的混乱阶段，被灌输了弱者思维，这样社会才会稳定有序。


  人类对强者包容又崇拜，对弱者苛刻又现实。强者分好多种，有经商强者、种地强者、体育强者、政治强者、思想强者等等，外在展现的身份、样貌、性格不尽相同，但他们的内核都一样：天道。


  经商强者是企业专业运动员，种地强者是种地专业运动员，政治强者是政治专业运动员，思想强者是思想专业运动员，父母和孩子是亲情专业运动员、夫妻是婚姻专业运动员，都是陪跑的运动员，没人是裁判。


  他们的共同特征都应该是把一件事做到极致，专注，日拱一卒，每日精进，单点击穿，会更有机会参破天机。


  ### 12. 至简不变


  #### 12.1 大道至简


  天道就是大道，大道至简，真传一句话，假传万卷经。


  宇宙不存在那么多大道理，多余都是废话。


  真理存在的数量很少，只掌握在少数参破天机的人手中，且只适用于已实际探测过的宇宙区域。


  日常生活中的沟通、制度律法的建立、社会核心价值观的建立等等，都不宜过多。


  一是记不住，二是复杂。


  所谓的天道甚至可能是智障道，可能是人类突破思维的阻碍。怀疑一切，没有真理才是真理，就没有什么可以限制住你，你的智慧才存在无限种可能性。


  #### 12.2 天道永恒


  天道永恒，人道易变，天道亘古未变；人道一直在变：比如现代医学在不断推翻自己，企业经营管理不断在被淘汰，教育理念不断过时，行业发展不断迭代升级，每个人在不同年龄段的感受不断变更等等。

  '
- "## 第二章 混乱阶段（人道）\n\n6000 年前，人类这个生物开始发明了文字，学会了说话、学会了思考，人类变成了非常危险的生物，自此混乱阶段开启，人道出现。\n\
  \n目前此阶段已经持续至今 6000 年左右，这期间明面上的规矩只有一个：人道。从遵循了上百万年的天道换成了人道。但这 6000 年来的新规矩只是一般老百姓在遵守，除此之外的天地万物、婴幼儿、强者依然遵循天道。\n\
  \n这 6000 年也不过是麦子熟了 6000 次，一觉醒来，太阳还是那个太阳，太阳底下没有新鲜事。\n\n人道就是人类世界的规矩和规律，主要以各学派思想为主：道家、佛家、儒家、墨家、阴阳家、纵横家、名家等，具体的比如科学、道德、法律、仁义礼智信等等，人类的一切行为都在这些思想之下。\n\
  \n适用范围是地球、太阳系和我的星球。\n\n### 1. 人类世界发展树状图\n\n为了我星球的人类世界稳定有序和走向天下大同阶段，由此在混乱阶段整个苍生之局的顶层设计如下：\n\
  \n- 我在幕后的土壤里\n- 根据人性种下种子\n- 发出文字和金钱的芽\n- 长出政治、资本和宗教的树干\n- 再生成众生相的树枝\n- 用爱的名义的力量浇灌\n\
  - 直至开出天下大同的花，结出幸福的果实\n\n文字、金钱和爱，皆是我的工具；众生皆是文字的工具、金钱的工具、爱的工具。用文字和金钱造出给我赚钱的资本家，给我护法的政权，给我掩护的宗教。\n\
  \n皇帝是我的棋子，首富是我的棋子，宗教里的神是我的棋子；众生又是皇帝的棋子，资本的棋子，宗教等文化的棋子。\n\n政治、资本、宗教又利用文字、金钱和爱这三个工具，创造演化出了众生相：人相、我相、亲密关系相、时间相、生死相、教育相、医疗相……\n\
  \n#### 1.1 幕后\n\n只有幕后安全，在台前危险。皇帝厉害吧，危险！要么被儿子害、要么被媳妇害、要么被大臣害、要么被外来入侵者害，即使你是很牛的皇帝最多也就\
  \ 300 年，整个家族还是会被直接清算或者历史书上清算。\n\n首富厉害吧，危险！历史以来有几个首富得善终？教派的神厉害吧，危险！\n\n比如地球上的耶稣被钉死了，苏格拉底被当街打死了，中东的宗教战争更惨绝人寰。\n\
  \n看不见的决定看得见的。\n\n控制整个世界、影响整个世界的都在幕后，台前的大人物大家族不敢对这些隐形大家族怎么样。第一，表面的新闻、知识都不会有他们的信息。\n\
  \n在我的星球上，智慧和财富都是我发明，所以我拥有无上智慧，也可以轻松获得无量财富，但不到关键时刻不启动财富获取开关。\n\n我死后，给自己的家族制定了家规家风家训：要一直在幕后、要真善美、要奉献、要成就他人，要支持悟道之人作为政治、经济、文化的领袖，家族内部要做的是顺应局势。要么只探索世界不改造世界，要么世界因为我们家族的存在越来越好。\n\
  \n我的家族延续千年，因其中一代的智慧没开而没有遵守家风家规家训导致家道中落，其他新的悟道之人或者窥探到幕后这个秘密的精英主义阶层，开始崛起为新的千年家族、百年家族，大部分家族不是悟道级，只是聪明人，以获取财富为主，继续在幕后或操纵或影响或改变着这个世界：比如东方的关陇集团、西方的罗斯柴尔德家族、洛克菲勒家族等等。聪明之人开始出现。\n\
  \n虽然有些地方是宗教说了算，比如类似地球上的中东；有些地方是资本说了算，比如类似地球上的美西方；有些地方是政治说了算，比如类似地球上的东方；但幕后都是这些千年家族、百年家族在支持……\n\
  \n不管是哪种形式的政权，起步期都需要智慧高、财富高、权力高这三种人群的支持，集齐了这三种人，就可以左右整个社会。\n\n能给我的星球子民带来希望，走向天下大同的智慧，我主要利用的是地球上东方的道为主，西方的术为辅。如今的西方文明才刚相当于东方文明的春秋战国时期，还没大一统，还是神权封建社会阶段。悟道家族秉承的一定都是服务社会服务人民的大道，社会整体稳定有序，百姓安居乐业；但窥探到秘密的聪明家族也就是精英主义阶层恰恰相反，与大道相背全是术，社会整体短暂性稳定有序，纷争不断，百姓更容易追求物质，更加容易内耗水深火热，是全民抑郁时代的巨大诱因，但是由于西方偏执术偏执到了极致，科技的发展是西方最大的贡献，科技的发展才能带来天下大同。所以，中西方的道和术，都缺一不可。\n\
  \n#### 1.2 人性（种子）\n\n人类既然已经变成了极具危险的生物，就得控制和引导。管理什么，就得研究透什么，既然要管理人，就得研究透人性是什么？研究出了人性是什么之后，根据人性让你变得不危险即可：\n\
  \n人性包括灵性、人的特性、兽性。好比狗有灵性、狗性、兽性；鸟有灵性、鸟性、兽性等等。天道的你有灵性，灵性强的人容易觉醒开悟，开悟不好管；天道的你有兽性，兽性强的人太野蛮太强壮，不好管；唯独发现其中人的特性这一部分有个特点：极容易被驯化。\n\
  \n既如此那这个游戏的细节就应该如此设计：\n\n- 第一、打压灵性\n- 第二、打压兽性\n- 第三、驯化出新人性\n\n如此下来，你失去了灵性、兽性，增加了新的人性，以此你不再是真正的你。失去了自己的生物，都不可能足够强大，怎么可能还危险？<u>你如果是你，主心骨强，有坚硬内核，你遵循天道，就管不了你引导不了你；也就是必须让你不是你，让你失去真正的自己，变成我想要的你，让社会稳定有序的你。</u>\n\
  \n经过驯化后的人性包括：灵性、兽性、人性（先天人性和后天驯化人性）。\n\n<u>整个人类世界的一切，都是围绕人性设计和展开。</u>\n\n#### 1.3\
  \ 等级出现\n\n根据人性，设计出了等级，有了等级开始产生“食色性也”这个生命本质以外的欲望，有了额外欲望就有了软肋有了痛苦，人类开始了无限向外求的攀比，也就越来越失去自我，精致的利己主义群体：精英主义阶层开始萌芽，这个世界痛苦的制造者，人间修罗场雏形形成，人类将无限痛苦循环下去。\n\
  \n##### 1.3.1 灵性、人性、兽性这三性和人类世界的关系图\n\n对人性的顶层设计，导致了等级的出现，等级的出现，是为了社会稳定有序，都平等了还咋管？比如开始出现了君君臣臣父父子子……\n\
  \n你本身的灵性、人性和兽性是平等的，但被设计成灵性最高，灵性就是神性，你的神性被打压，但是他们把自己往上打造成神：政治之神、资本之神、宗教之神，因为人跟人之间总会有争吵总会有质疑不好弄，但神跟人沟通呢，神错了你得跪着还得说对对对。兽性被打压说成有兽性就是向下的畜生，人性被驯化出新的人的特性，被称之为高级动物，高于动物的动物。自此人类是食物链最顶端，但成了精神最底端的生物。\n\
  \n创造了法律和道德打压你的兽性。\n\n<u>灵性使人智慧、人性使人温暖、兽性使人健康。</u>\n\n<u>失去灵性，会失去自由；失去人性，会失去温度；失去兽性，会失去一切。</u>\n\
  \n##### 1.3.2 分类管理\n\n原始阶段上百万年里，没有等级，没有三六九等。\n\n就这样，星球以人类为主、人类以统治阶级为主的星球世界组织架构就形成了，金字塔结构。所有生物以及人类内部的三六九等自此开始出现，家庭上中下三代等级开始出现。并想尽办法控制每个阶层的人数比例，通过分类，定期进行管理和清理。\n\
  \n##### 1.3.3 欲望出现\n\n有了温差，空气才会动起来，产生了风；有了位差，水才会动起来，产生了水流，有了等级差，人才能被调动起来，产生了欲望。\n\
  \n比如一个班级有了成绩第一名，就会树立攀比的榜样标杆；比如公司团队有了第一名，奖金奖励最多，就会树立攀比的榜样标杆；没有第一名也得故意制造出等级差，刺激出欲望，达到目的。\n\
  \n有了欲望的生物，容易被操控，被引导，也就是容易迷失自我，社会就会稳定有序。没欲望的生物是不是很可怕？是不是很难管理？因为无欲则刚。\n\n###### 欲望的分类\n\
  \n- 第一：在原始阶段只有食色性也这个生命本质的基础需求。\n- 第二：在混乱阶段除了食色性也，开始产生并引导额外的食色性也欲望、权力欲望、金钱欲望、认知欲望、娱乐消遣欲望。\n\
  - 第三：天下大同阶段会保留原始阶段的食色性也这个基本欲望，和混乱阶段的娱乐消遣的享受生活欲望，以及思想创新和科技创新等极致真诚地表达自己的欲望。\n\n###\
  \ 2. 标志、原因、目的\n\n#### 2.1 标志：发明了文字\n\n人类发明了文字，开始学会了说话、学会了思考，才有了人类世界、人类文明，也就是人道。自此标志着人类结束了上百万年的原始阶段，开始进入众生皆苦的混乱阶段。“仓颉造字鬼神哭”“人类一思考，上帝就笑了”。\n\
  \n#### 2.2 原因：人类自此变得非常危险\n\n混乱阶段开始的原因是：人类自此变得非常危险！\n\n因为在原始阶段的上百万年里，人类一直不是危险的生物、贱的生物、恶心的生物。自从发明了文字，开始学会了说话、学会了思考，世界上最恶心最残忍的事情开始出现。人类的脑子可以想出各种伤害性极大的手段，比如阴谋诡计；人类的手脚可以制造出越来越危险的工具，比如现在的原子弹。\n\
  \n科技越发展，人类越危险！\n\n科技越发展，人类文明越脆弱；科技越发展，二元对立越激烈战争越频繁越惨烈；科技越发展，越解决问题，问题反而越来越多；而且人类数量越来越多，危险系数越来越高，就越要管理和控制，越管理越控制，人就会越失去自我，也就越容易内耗和痛苦。科技越发展，物质世界越来越丰富，人类的精神世界越来越累。\n\
  \n但是没有科技，也不可能实现天下大同，人类文明就这样在对立和统一的不断循环中，波浪式滚动前行，一直到今天。\n\n现在的地球，人类数量即将到达极值，科技发展即将到达极值，人类的物欲即将到达极值，以至于人类处于最危险时代最贱时代最恶心时代，这是末法时期，全民焦虑抑郁时期……\n\
  \n极度痛苦时，就是黎明前的黑暗，越黑暗越好：真善美想要洒满人间，就要先交给假丑恶来开垦这个世界。物极必反，否极泰来。\n\n#### 2.3 两个目的\n\n\
  明白了这个世界为何创造，如何创造，你就不会厌世，方便自己看清世界，再看透世界，最后理解世界看淡世界热爱世界。\n\n**目的之一：为了社会稳定有序。**\n\n\
  没有这场苍生之局，没有这么多众生相，人类的注意力很难被转移，不失去自己很难不内耗不痛苦，他们就会有更多的精力跟人道造反；反人类反社会反文明人群一直都存在。比如如果不打压兽性，不创造道德和法律，每个人都可以随意杀人放火，全世界早完了，无规矩不成方圆。\n\
  \n**目的之二：为了天下大同。**\n\n没有众生相就没有痛苦，人类就不会觉醒，人这个生物越痛越容易醒，痛到极致才能醒到极致，没有人或者组织是不经过地狱般的淬炼而变强大，比如科技和思想只有越强大，才越容易抵达天下大同。因为原始阶段里不可能会觉醒悟道，花花草草猫猫狗狗婴幼儿不可能觉醒悟道。\n\
  \n一切都是人为设计好的，人为为伪都是假的，凡所有相皆是虚妄。人道、人类世界、人类文明的出现，包括文字和金钱的发明，国家、经济、宗教、亲密关系、教育医疗、时间情绪等等所有众生相概念的出现，都是社会保障体系的环节设计，都是为了社会稳定有序，都是为了到达下一个阶段的游戏环节，是苍生之局。\n\
  \n### 3. 天道和人道图\n\n天道尚左，人道尚右，人类文明反天道反自然反宇宙，跟原始文明正好相反。所以，整个世界都是反着的，顺成人逆成仙，玄妙就在颠倒间。不试错不叛逆，就会彻底失去自我。这就是混乱阶段的苍生之局。\n\
  \n### 4. 阳谋\n\n我要光明正大告诉我星球子民关于混乱阶段的真相：混乱阶段的出现就是阳谋，就是做好的局，就是陷阱，就是坑，包括如何设计的细节，人手一份。你会认为这个世界充满了阴谋，错！这就是阳谋。但你没经历过，此运行了8000年的阳谋照样无解，此阳谋是来自8000年的巨大惯性，你能挡得住？去干去体验，是唯一能找到破局之道的机会。没有经历没有发言权，实践出真知。但这是阳谋，要开诚布公的告知给自己的星球子民，而不是让子民觉得世界是一场巨大的阴谋，什么都是阴谋，此阳谋无解。\n\
  \n### 5. 众生皆苦\n\n众生皆苦用现代词汇表达：众生都内耗。\n\n开弓没有回头箭，混乱阶段是一把双刃剑，承上启下。有了混乱阶段众生开始苦开始内耗，但没有苦难就不会觉醒不会开悟，也就是没有混乱阶段人类不可能变得强大，变得享受，强大到实现天下大同那一天。因为原始阶段和天下大同阶段的人类不存在觉醒或很难觉醒。原始阶段上百万年了没有任何发展、众生也不苦，咋醒？天下大同阶段人类又享受还不痛苦咋醒？不痛苦不撞南墙不经历地狱般的黑暗，没有机会变强。任何人任何组织的强大，都是在艰难困苦中磨炼而成，心不死，道不生！不痛，不醒；痛到极致，醒到极致。想要变强、想要保障、想要幸福，没有苦难也要创造苦难！\n\
  \n比如科技的强大都是在痛苦中崛起，尤其是战争，因为绝大部分科技的进步是因为军工科技革命，古代如此现在亦如此。尤其是一战和二战是因为发生了两次工业革命，这两次工业革命都是发生在军队，还有互联网革命的出现，也是因为美苏太空竞赛，美国的信息技术突破，太空竞赛结束后把技术军用改为民用才有了如今的互联网世界。只有军工才会集合最牛人才、最先进仪器、最大量资金、最长时间的坚持。从天下大同的表面角度看，战争是伤害是破坏天下大同进程的，但恰恰若没有战争，绝不可能到达天下大同。\n\
  \n但苦难不值得歌颂，即使伟大的苦难也不值得歌颂，苦难就是苦难，尤其是被设计好的世世代代的底层百姓的苦难，更不值得歌颂。歌颂苦难就是赤裸裸的 PUA。\n\n\
  ### 6. 被驯化成了人\n\n原始阶段没有人类世界、没有人类文明，混沌一体，没有分别心，都只是一种生物。那时候连文字都没有，也就是连人这个字都没有，哪来的人类世界、人类文明？\n\
  \n好比老虎，原本在森林里，后来被圈养到了杂技团，开始规定几点吃饭、几点工作等……杂技团就是所谓的人类世界，人还没被叫做人的时候就是在原始阶段，后来被定义成了人，关进了人类世界这个杂技团，开始驯化成人，经过几千年的不断驯化和演化，你才成了今天的人，你本不是人。\n\
  \n人生如戏：这辈子演戏演得像个人；人生如梦：梦到这辈子是个人。做什么都行，别做人，像个人就行。\n\n### 7. 不可逆\n\n混乱阶段不可逆，大河之水是不可能逆流的，比如人类学会了说话，不可能回到不会说话没有文字的时代；比如有了国家，不可能回到没有国家民族的时代；比如有了父母，不可能回到没有父母的时代；再比如有了科技，不可能让科技消失，这可是\
  \ 8000 年的巨大惯性……\n\n反科技反文明的人不是自不量力而是智障，刚看清楚一半儿就自以为是的伪正义，提不出最优解决方案的怨妇。\n\n### 8. 众生相\n\
  \n#### 8.1 人性相\n\n你认为的人性是假的，是为了社会稳定有序驯化出来的新人性，利用人性下坠的力量，让人类降频降维的手段而已。比如马斯洛需求层次理论，这是打造的欲望，马斯洛是统治阶级的一条狗。\n\
  \n除了生命本质，除了人原始的特性，像婴幼儿般，其他都是为了社会稳定有序驯化引导的新人性。根据新人性，生出了文字和金钱这一对双胞胎。\n\n原始阶段的人性包括：**灵性、人性、兽性**；混乱阶段的人性包括：**灵性、原始人性、驯化出的新人性、兽性**。\n\
  \n顺着人性做人，逆着人性做事。顺着人性做人指的是你认为的人是假的，人性是假的，做人再好再善良不能直接产生结果；顺着人性演戏演得像个人才能驯化编程迷惑大众，你是人但你不能真是人，你有人性但你不能真有人性；然后暗度陈仓逆着人性做事，做事才能直接产生结果，人性是假的怎么能顺着假的东西去做事，怎么可能成功。\n\
  \n有人性怎么可能做到那个位置（做事），没人性怎么可能一直在那个位置（做人）。\n\n这个星球的一切都是围绕人性而设计，所有众生相也是围绕人性而设计，上述讲过了根据人性创造出了等级，并开始出现政治、资本、宗教等文化这三个被造的神。\n\
  \n借假修真别当真，好好利用人性、体验人性。\n\n#### 8.2 文字相\n\n##### 8.2.1 破相\n\n文字是假的，原始阶段哪有文字？文字是为了社会稳定有序人为创造出来的最核心工具。能写出来的都是文字，包括文字和数字。\n\
  \n人类的精神世界被文字语法编程，物质世界被数字算法算死。\n\n整个世界是建立在文字之上，一切都是文字：你说的话是文字，你的思考是文字，你的情绪是文字，你的行为指令是文字，读的书是文字，看的媒体是文字，道德、法律是文字，导致内耗的胡思乱想是文字。\n\
  \n造字是人类史上最大的工程，这可是人类世界的编程代码，每个人都像一台电脑一样被文字编程。\n\n人类造出的东西你都得付出代价：造出了国家你是不是得交税，造出了药你是不是得花钱，造了字你想白嫖？\n\
  \n文字可以编程你，左右你的情绪你的思想你的价值观，来达到政治、经济、文化的目的，文字是你的工具，你不是文字的工具。\n\n造字很复杂，要不你造一个试试？为什么造、怎么造、造出来怎么宣传、怎么让所有人认可使用，比造原子弹难百亿倍，哪可能白造？你要付出的代价就是被洗脑被驯化被降维被降频，甚至被几个字就能困在原地一辈子，活了一辈子当了那几个字一辈子的狗。\n\
  \n花草树木会被几个字困住吗？猫猫狗狗会被文字困住吗？婴幼儿会被文字困住吗？强者会被文字困住吗？你被文字玩啦，文化不就是用文字教化，自从发明了文字，整个人类开始进入文字游戏：文字就是这个世界的编程代码，你看到的一切都是文字游戏，宗教、经济、法律、感情等一切都是。文字会变成语言，语言会变成思想，思想会变成行为，行为会变成结果，结果会变成你的人生，文字语言思想行为结果这五个是一回事，知行合一，要的是合一，文字就是你的人生！\n\
  \n人就是被文字编程过的一个个系统，你一开机就显示什么，遇到啥事会自动生成文字如何处理，文字控制着决定着你这个系统的一生；你的大脑就是电脑的硬盘，是死的，纠缠进去什么文字就会显示什么。\n\
  \n\n\n比如一直说谎你会认为是真的，这就是编程，文字的破坏力，吸引力法则。有了文字才有了这么多破事，文字使用时间久了次数多了就会形成你的下意识，你会证明它实现它，时间越久惯性越大；\n\
  \n比如父母那个年代没出轨小三这个词他们出轨的很少，我读大一时才有了出轨小三这个词，新闻全是出轨、聊天全是出轨，这代人跟这个字纠缠起来了，最终出轨的越来越多；比如以前睡觉是睡觉，不睡觉是醒着，现在有了失眠这个字，你就会膈应就会跟它纠缠，开始百度越搜越焦虑，最后自己实现了失眠证明了失眠；\n\
  \n比如如果算命的说你30岁会离婚，你就会跟这几个字发生纠缠，不断膈应，久了夫妻之间就会发生微妙的变化，矛盾越来越多，最后你自己证明了离婚实现了离婚；\n\n\
  比如如果只有当下这个字，大部分人就会只关注当下活在当下享受当下，整个生命就是当下这一刻的叠加；\n\n自从有了过去和未来这两字，你会陷在过去迷在未来；比如如果没有快乐难受等等这些字，人就跟天地万物一样没有情绪是平静的，你吃饭时快乐？撒尿时快乐？睡觉时快乐？\
  \ no！\n\n**是平静，快乐是假的。**\n\n资本需要你追求快乐，为了快乐你会消费，政治需要你追求快乐，快乐是假的你追求不到就会焦虑内耗，内耗了就没有精力造反，社会稳定有序发展；包括各种精神内耗和心理疾病专业术语的发明，每发明一个，人类就会跟它们发生纠缠一个，开始思考进入自己的潜意识，精神内耗加剧、心理疾病日益增多。脱离众生相的根就是破文字相，文字是一切的根源，有名，万物之始，也是烦恼之始。\n\
  \n##### 8.2.2 断相\n\n断舍离掉任何让自己不舒服的文字，断舍离掉任何消耗自身能量的文字，比如负面的语言，抱怨的语言，鸡毛蒜皮的语言，对自己没用的语言，这是个坑，是个局，是个陷阱\n\
  \n##### 8.2.3 正相\n\n借假修真别当真，正向的使用文字：使用正向的文字或者反为正用。\n\n被编程了几十年的巨大惯性需要利用这些假的但正向的字给自己编程，直到形成正向的新的下意识为止。比如强者的语言都是正向的，根本没有负面语言没有弱者气息。\n\
  \n比如处理夫妻矛盾时，前32年我跟大家一样都会吵架辩解，当我说的话我的思考，也就是我的文字体系换成了：“我的存在是为了我媳妇越来越好，我们结婚的目的不是为了吵架”、“这辈子只有一件事：只管好自己”、“我媳妇没有觉醒开悟现在只是一只被驯化的狗我不可能跟狗一般见识”、“让我们夫妻有对立矛盾是个陷阱是个坑是设计好的局”等等这些话给自己编程了几个月，说久了次数多了就形成了我的新的下意识，再发生矛盾时这些话第一时间会出来，矛盾就不可能发生，马上画上句号；再比如当你遇到问题不要出现这样的文字：我不行、我理解了但就是做不到等等，因为你的下意识认可了这些话，你会证明自己不行实现自己不行\n\
  \n一切都可以为自己所用，不好的一切也都可以反为正用，一切皆有利于我，遇到任何问题永远都有方式方法，不要讨厌错误，对错你可以利用，不要讨厌自己的情绪，精神内耗可以灵活转化为好事，不要讨厌政策，要利用政策；不要讨厌文字，要利用文字，文字很好玩；不要讨厌人性，要利用人性，人性很好玩，跟狗一样。\n\
  \n再比如你觉得风好大，好烦人；但我可以风力发电，我觉得风越大越好。风对你是伤害，但我把它转化成了对我有用的能量。同样的，你觉得别人的伤害是痛苦，挥之不去；但我觉得伤害是从宇宙开始有人类开始一直存在，伤害是天道；而且痛苦确实使我强大使我进步；既然伤害无法避免，既然伤害能让我变强，那请就给我最大的伤害，化伤害为力量，化悲痛为力量，化苦难为力量。我的今天，得益于我曾经遇到的所有人所有事，尤其是垃圾的人和事；我不会感谢他们不会原谅他们更不可能再给他们伤害我的机会，他们出现的命就是为了让我看透真相，为了丰富我的人生，正缘孽缘都是缘分\n\
  \n••••••\n\n##### 8.2.4 无相\n\n天地万物都不会说话，花花草草猫猫狗狗都不说话，人类在6000年前也没有文字不会说话，婴幼儿不会说话，强者惜语，甚至归隐拈花一笑不再说话，不屑于说话，不屑于使用人类创造的文字陷阱。无相是开悟后的状态，可遇不可求，建议如下：比如你要是弱，就别说话少说话，不说话之前没人敢惹你，不了解你之前没人敢惹你，你被人欺负完全是自己吸引来的。比如两个人在一起久了之后多一点灵魂交流，少一些口舌相伴。就是平平淡淡，就是安安静静，只要陪伴着，哪怕不说话，也会岁月静好。少说话就会减少争吵，少说话就会减少临时需求的起意，遇到事情正常沟通正常处理即可。即使是面对当年灵魂多么契合的爱人，时间久了也要精神内守。不然你会变成事儿爹事儿妈，天天事儿事儿的。人类就是被驯化的狗，满大街都是被驯化的狗，满世界都是汪汪汪，跟狗说那么多干嘛？这个世界上的大部分要么敏感，要么傻逼，你跟敏感的人说那么多干嘛？你跟傻逼说那么多干嘛？跟任何人相处的文字使用方式：有事开启熟人模式，没事开启陌生人模式\n\
  \n##### 8.2.5 二元对立诞生\n\n二元对立是苍生之局的一环，所谓的对错好坏都是工具。正是有了文字才开始有了定义，有了定义就一定有人认为对有人认为错，就开始分阵营拉帮结派，开始有了对立有了战争有了伤害，男女对立、家庭矛盾、阶级矛盾、帮派组织民族国家，善恶好坏，白富美矮矬穷，包括战争等，皆是因为二元对立。电视剧电影里最大的卖点一定是打架、宫斗等二元对立，二元对立思维是社会稳定有序的重要手段，人类变得很容易被洗脑被引导，注意力被转移，灵魂被转移，能量被转移。文字都有偏见，都是站在自身利益角度的表达，再伟大的作家也只是书写自己的偏见而已，只要说出来就错，错了就有人纠错，形成二元对立，错上加错。\n\
  \n我们要允许，允许的力量大于一切，这是天道，允许让花成花，让树成树。强者都不会磨损自己，像水流一样，都是沿着最小阻力流动，允许自己蜿蜒曲折上上下下，允许自己反反复复断断续续，而不是见了山就对抗见了坑就对抗。\n\
  \n比如我很喜欢花很喜欢绿叶，但冬天来临他们就会凋零溃败。首先花和树自己允许自己凋落，其次我也很自然的客观接受他们的凋落；但就是有些人会主观的选择对抗，比如觉得太可惜很遗憾，秋冬季节整体心情惆怅拉垮容易内耗…\n\
  \n比如我们的身体，我们的牙齿正好严丝合缝扣在一起，而不是上下的牙齿对抗打架，我们的骨头关节处也正好严丝合缝，而不是两节骨头相互摩擦打架\n\n要允许自己是个普通人，允许自己犯错，允许自己出现内耗，允许恋爱时轰轰烈烈，也允许婚姻时平平淡淡，因为婚姻就是搭伙过日子，婚姻柴米油盐酱醋茶，婚姻就是谁洗衣谁做饭；允许活着就是不断试错的一生，因为全世界都是错的；也要允许别人是傻逼，不要争吵不要对抗，不回应或远离不就完啦，沟通个屁，解释个屁。允许就是心宽、心宽就是圣人。\n\
  \n整个社会也要允许大家踏踏实实的做个普通人，天都是普通的天，只会下雨下雪下冰雹，有本事下点钱。大家都是普通人，即使是皇帝，大多数也都只是普通的皇帝。请允许自己普通，请允许父母普通，请允许领导普通，看不惯啥不服气啥心里委屈啥，父母还委屈你为啥是个普通的孩子，领导还看不惯你为啥是个普通的员工。\n\
  \n怕就怕一对比，普通人好悲惨当然会选择拼命逃离普通，但事实又是，绝大多数不可能逃离出去，都设计好了…如果工资福利待遇差距不大，看个病不走后门，教育不走后门，普通人吃的喝的没毒跟有钱人吃的一样全是特供…最搞笑的是宗教都在对比谁是世界第一大宗教…人类都还在说不要虐待猫猫狗狗，反倒开始自虐，虐人！\n\
  \n吃得苦中苦，方为人上人：吃得苦中苦不就是虐待自己拿自己不当人；方为人上人不就是虐待别人拿别人不当人；\n\n还有要努力要光宗耀祖，但事实是你越努力有钱人越有钱，少数能光宗耀祖的后来都出了事，祖宗的脸又被丢尽了，因为普通人根本承载不了那个位置那么多钱。\n\
  \n大多数人有了权和钱之后就开始践踏人性、践踏规则、甚至践踏法律，二元对立周期性的越来越激烈，因为这是这社会需要。\n\n没有邪恶，谁来伸张正义？有些人群还有存在的必要吗？要统治阶级干嘛？没有妖魔，哪来的神佛，谁还去烧香？越是灵山脚下妖魔越多；都公平了，还需要统治阶级吗？都道德了，还需要讲道德吗？但是如果没有统治阶级、没有圣人，当邪恶出现时，谁能有力量组织去对抗去消灭？没有超高思想没有绝对力量没有金钱积累，能战胜邪恶战胜妖魔？所以没有邪恶也要制造邪恶，没有妖魔也要制造妖魔，圣人不死，大盗不止！\n\
  \n好坏对错，善恶真假，神佛妖魔，皆是工具而已。\n\n二元对立这场游戏的设计，是阳谋，无解，了不得。任何事的结论变得不再绝对，都需要多角度分析，尤其是阴阳两面。<u>整个人类世界也就在二元对立的此消彼长的周期轮回里，波浪式前行。</u>\n\
  \n地球上东方的文字进化到了顶端，8.5万汉字早已停止进化，所有的现代现象都可以用汉字组合表达出来，每个文字都是一个哲学，文字优美，词语绚丽，成语辽阔，诗词更是美不胜收。西方的文字还在进化中，很多都是参考东方文字而发明，由于西方文明进程开始太晚，现在的60万个单词还在每年增加。英文的好处在于比汉字简单易学。汉字越用越团结，英文字母越用越分裂。\n\
  \n<u>文字的诞生，让人类从此进入星球的制霸阶段，站在了肉体的食物链顶端，但成了灵魂的食物链最低端。一句话一个词就可以把人困在原地一辈子</u>\n\n####\
  \ 8.3 金钱相\n\n金钱是假的，原始阶段的上百万年哪有钱？花草树木猫猫狗狗谁有钱？\n婴幼儿会在乎钱的事儿？强者想咋挣钱咋挣跟玩一样他们谁会在乎钱？\n\n\
  钱是工具，不是目的不是本质。每个时期金钱的表现形式一直都在变：最开始是贝壳、布块，后来是金子、银子、铜板，现在是纸，以后可能是数字。\n\n但是整个世界除了建立在文字之上，同样也是建立在金钱之上，是文字和金钱一明一暗一公一母生出了整个世界。一切都是金钱，没有钱啥都没有！没有金钱会有国家？哪个上位者背后不是有钱的百年家族在支持？没有金钱会有资本家会有马云？没有金钱会有宗教？庙香火越旺，佛像越大，这是金钱。没有钱能上学？能看病？能结婚？能生孩子？是钱生出了这一切。\n\
  \n所以不管是什么人、什么阶级、什么组织，包括国家，这一生大部分的时间都在挣钱，不择手段的积攒财富，完成原始资本的积累成了首要任务\n\n金钱不是一切，但金钱能解决个人或组织99.99%的问题，金钱是人活着最大的底气，没有之一。金钱也是除了悟道获得无上智慧以外最能带来快感的事情。\n\
  \n金钱这个假的工具可以判断人的真假：金钱让高贵的人更高贵，卑鄙的人更卑鄙；让深刻的人更深刻，浅薄的人更浅薄。因为有钱之后一般的你就不装了\n\n##### 8.3.1\
  \ 欲望升级\n\n金钱的诞生，除了交易这个目的之外，还有个重要目的：是为了让通过人性造出的等级而产生的欲望进行升级，并直接诞生精英主义阶层，让人间炼狱般的修罗场正式形成。\n\
  \n所有的欲望基本都需要金钱才能得以实现，从此人类彻底变成了欲望动物，欲望的奴隶，欲念一起，放大了人类的恶，叠加科技的发展让人类的恶从此深不可测，潘多拉魔盒正式打开，人间炼狱加剧，也很有可能人类因此走向失控，万劫不复\n\
  \n且有了欲望就产生了攀比，攀比可是万恶之源。攀比这个念一起，就没头儿，无止境，现实是总会有人比你优秀，是总会。一生之中的内耗绝大多数都是因为攀比，自卑是因为攀比，消费主义是攀比，教育买房买车是攀比，嫉妒是攀比，焦虑是攀比···欲望，就是你痛苦的根源\n\
  \n欲望一旦产生，将永无上限。喂不饱的，哪怕是对自己最亲近的人，都不要轻易培养他们的欲望；若是教育孩子，要正向使用欲望，把欲望当成智慧的试炼场。\n\n**这个世界就是个文字游戏，挣钱游戏，欲望游戏。**\n\
  \n钱很重要，得挣；但在这场设计好的游戏里，体验人生是主业，顺道挣钱（具体怎么积累财富后面会讲到），否则没机会跳出这苍生之局\n\n##### 8.3.2 对金钱的欲望诞生了精英主义阶层\n\
  \n苍生之局需要自动运转，总得一直有一帮群体，也消灭不了，他们能创造出很多事，让众生皆苦。所以就用人性、文字、金钱、欲望等工具的共同作用下创造出了这个群体：精英主义阶层。这是苍生之局里极其重要的棋子\n\
  \n###### 精英主义阶层的特征\n\n- 第一：极致的利己主义群体，以敛财为主。\n- 第二：精英主义天然是百姓的对立面，也是统治阶级的对立面\n- 第三：只要二元对立、额外的欲望、金钱等这些众生相不消失，也就是不到天下大同阶段，这个群体永远存在，怎么都消灭不了。野火烧不尽，春风吹又生\n\
  - 第四：只要有了钱，有了权，有了高认知这三个东西的任何一样，就会容易变成精致的利己主义，走向人民的对立面，变成精英主义阶层。\n- 第五：精英主义阶层的群体只要不使用狠绝的手段去清理，便会越来越多，多到如果你是好人你就是错的，多到社会需要推倒重来\n\
  - 第六：只要没有悟道，以下就是个死循环：百姓有了权力、有了金钱、有了认知，自然会被欲望牵着走向精英主义心理，导致精英主义阶层出现，屠龙者终成恶龙，变成了精英主义阶层又开始鱼肉百姓，百姓被鱼肉到一定地步就会被精英主义阶层煽动作为牺牲品、马前卒推翻统治者，而不是推翻精英主义阶层。统治阶级扫黑除恶、打击贪污腐败，扫的就是精英主义阶层、除的就是精英主义阶层、打的就是精英主义阶层。统治阶级一般在建立之初跟百姓是一体的，共生关系，后来国家统治瓦解，一般都是内部问题，这个内部问题就是上述讲的精英主义阶层群体越来越大，时间越来越久，包括统治阶级大部分也被渗透变成了精英主义阶层，内部问题已经到了无法解决的地步，这时稍微再来点天灾，就会改朝换代。一代一代又一代，循环往复以上的历史周期\n\
  - 第七：精英主义群体内部也分三六九等，最顶层的就是那些门阀、财阀。当有了足够金钱会成为资本家，有了足够权力会成为政治家，有了足够认知会成为宗教等文化家，顶层群体里容易出现控制世界的背后玩家，即：千年家族和一些新上来的百年家族\n\
  - 第八：精英主义阶层诞生了世界上最大的恶、真正的恶，深不可测的恶，以敛财为主，善恶好坏、大是大非不在其考虑范围内。老百姓能窥探到真相一二都会瞠目结舌，这些恶从不被揭示或者揭示一小部分恶来掩盖真正的恶，比如萝莉岛的揭露，实则是用萝莉岛掩盖萝莉岛，真正的黑暗远超乎已经揭示的。人类所有的恶，都是欲望惹的祸。去萝莉岛的都是精英主义阶层的顶层群体\n\
  - 第九：精英主义阶层是这场苍生之局的关键一环，有这个阶层在，人间炼狱，实现众生皆苦，才有保障。站在人类的正义立场，站在人民的立场，精英主义阶层是坏人，但站在天下大同的立场，没有对错好坏，他们不可或缺。只是很多星球低估了精英主义阶层的恶，导致游戏结束，万劫不复\n\
  - 第十：如果精英主义阶层的群体看到了这本书，我想对他们说：你们的使命已经完成，你们也很可怜很无辜，只是苍生之局的棋子，为了实现天下大同的一条狗。\n\n现在看清真相，还有最后一个使命，也是星球子民共同的唯一的使命：天下大同。想要实现天下大同，必须天时地利人和（后面会讲到具体细节），那就集齐星球百亿人的智慧共同攻坚，单点击穿。留给我们的时间不多了\n\
  \n金钱不是资本，金钱只是工具，是中性的，但金钱累积到一定程度造就了资本，资本嗜血，资本家的行为与资本家无关，他们都是资本的提线木偶，他们的行为是资本说了算。\n\
  \n###### **所有精英主义阶层的愿望一致：成为资本家！**\n\n只有不在金钱游戏内的悟道级强者，能跟、敢跟精英主义阶层的顶层掰手腕。人类历史就是悟道级强者和那些千年家族和百年家族博弈的历史过程。每当幕后家族把世界霍霍到了极点，百姓水深火热到了极点，民间自然会诞生出悟道级强者。因为足够痛才能足够醒，醒到极致就会出现悟道级强者，比如地球上的老子、孔子、毛泽东等人：混乱阶段就是在他们波浪式周期式反复式轮回式的博弈中前进，只有到了天下大同阶段，人类才会不再有额外的欲望\n\
  \n欲望的创造，既是众生痛苦的根源，也能诞生不会消失的精英主义阶层，精英主义阶层又能创造出更多的苦，能让百姓更苦，苦到一定程度能诞生伟大的悟道级强者，悟道级强者制定天下大同战略推动科技发展一直等到发展到极致那天，等天时地利人和齐聚，天下大同才能实现。也就是欲望是为了实现天下大同的必要组成部分，打造欲望是为了不再有额外的欲望\n\
  \n#### 8.4 爱\n\n人类世界都是假的，爱更是假的，原始阶段的上百万年里哪有爱和恨？花花草草猫猫狗狗会爱你恨你？婴幼儿会爱你恨你？天地爱你？天地不仁，以万物为刍狗，你就是条狗；圣人爱你？圣人不仁，以百姓为刍狗，你就是狗，狗肉一样的肉；父母爱你？爱是因为你是他的孩子这层身份，是因为你能给他养老，这种有前提条件的爱，是自私，是爱他自己，都是站在自身利益角度、人类自身感受角度，人为赋予的爱，是为了社会稳定有序。因为人类变成了这么危险的生物如果都没有爱、不宣传爱，人间得变成什么样儿？离毁灭不远\n\
  \n爱会拉近距离甚至会不懂得保持距离，违反天道，但最符合人道。爱是目前人类世界最高的能量，是管理世界最有力的工具；有温度的爱，是冷冰冰的工具。但也仅限于人类的三维空间内。宇宙内能量高低的顺序为：道、德、仁、义、礼、智、信，从上到下代表维度能量的高低。道在N维趋于无穷大；德是n-1维到4维，人活在三维世界，所以叫德高望重，厚德载物，德的能量高于三维世界的一切能量。道和德都是天道；仁就是爱，仁慈仁爱慈爱，爱是三维世界第三维的能量，仁可以在三维世界感化一切，因为仁者爱人，爱是人类能够感受到的最大的能量，所有开宗立派和打江山的核心价值导向一定是仁爱、兼爱、人人生而平等；再往下是义、礼、智二维能量；信是最低的，最起码最基本的一维能量。\n\
  \n##### 仁义礼智信是人道\n\n普通人的能量层次：**信智礼义**\n\n开悟者的能量层次：**仁德**\n\n能量最高层次是道，称为：**得道者**\n\
  \n当道德没了之后就开始讲仁义，当仁义不见的时候就开始讲礼智，没了礼智，骗不了人了，最后开始说：“你要有信用，我这个人很有信用，我们必须有信用”此时的社会对应最低维度的能量，是末法时代\n\
  \n人类世界的爱只有一种，是成就别人，这个世界才真正有温度。让别人成为别人，让别人越来越好，这才是爱，是真爱，是最大的爱，不以成就对方为前提的爱，都是欲盖弥彰。比如父母孩子之间不要讲爱，要讲成就，父母的存在是为了孩子越来越好，是成就孩子不是成就自己；再比如夫妻之间不要讲爱，老婆的存在是为了老公越来越好，老公的存在是为了老婆越来越好，哪怕离开了自己对方也能越来越好。很多人结婚是为了满足自己成就自己，再比如职场领导得成就下属，下属的专业越来越高、业绩越来越好、挣钱越来越多、职位越来越高，是不是意味着你的仕途和钱途越来越好？\n\
  \n所以任何组织的核心价值观一定是成就对方，比如为人民服务、以奋斗者为本、人类命运共同体，既能保持当下社会稳定有序，也是人类进入天下大同的唯一钥匙。社会可以出一些这样的小说、电视剧、或者大学学科，给每个人进行道、德、仁、义、礼、智、信的积分，信用分已经开始用了用处很大，其他六个也要都用起来，形成的社会治理体系，一定很和谐\n\
  \n#### 8.5 政治相、资本相、宗教相\n\n6000年前哪有国家、哪有货币、哪有文化艺术、哪有天赋哪有爱好、哪需要上班工作挣钱、哪有神仙哪有烧香拜佛？\n\
  \n政治、经济、文化是人性、金钱和文字共同生出来的三胞胎，政治生出政治家，经济生出资本家，文化生出宗教家，三者相互影响和转化。且世界后来的推动和变化主要靠这三类人群，只是有些地方政治说了算，有些地方宗教说了算，有些地方资本说了算，都属于统治阶级类别，人类的金字塔尖。社会稳定有序的本质是这些金字塔尖的人群稳定，他们一旦乱了，整个人类世界就会乱套。社会稳定有序就是混乱阶段的主旋律，也就是这三类人群想尽办法不被推翻就是社会稳定有序，历史主旋律\n\
  \n真正能影响世界的永远只有三五个国家，能改变历史进程的永远都是几百年出一个的悟道级强者，掌控片区社会走向的永远都是幕后的几个家族，能让人类下跪被驯化成狗的主流宗教只有三五家\n\
  \n##### 8.5.1 精英主义阶层\n\n掌握了金钱、权力或者高认知的人，只要没有悟道，在苍生之局下设计出的欲望的诱导下，容易变成精英主义阶层，具体形式如下：拥有绝对权力的统治阶级容易出现士族门阀、资本财阀；拥有普通权力的官员、老板、知识分子容易变成精致的利己主义者；这些都是精英主义阶层\n\
  \n想要破除朝代的历史周期律的核心，是如何跟精英主义阶层博弈。每个朝代的初期都是休养生息，慢慢盛世到顶峰，但精英主义阶层开始壮大，开\n\n始渗透政治、资本、宗教文化等各方面，百姓越来越苦，导致失业率尤其是青年失业率越来越高，通货膨胀越来越高，统治阶级的管理越来越吃力，稍微来点天灾人祸，朝代就会土崩瓦解，推倒重来。新的政治、资本、宗教文化这些统治阶级从屠龙者终成恶龙，没有悟道就还在苍生之局里，一直如此循环下去，这就是天道，天道守恒，失衡必会想尽办法归于平衡，人类的一切人道都在天道之下运行。\n\
  \n精英主义天然是百姓的对立面，也是能真正引起社会动荡的群体，人类世界里想象不到的恶大部分都来自于这个群体：**包括战争、资本陷阱、消费主义、利益代言人、最容易践踏道德甚至践踏法律的群体。**\n\
  \n统治阶级的经一般都是好经，负责念经的和尚可不一定是好和尚：统治阶级和百姓利益大方向都是为了和谐稳定，毕竟百姓完蛋意味着自己完蛋，但念经的和尚容易成为精英主义阶层，百姓和统治阶级两头儿出事都与他们无关。\n\
  \n世界上最大的恶最大的危险来自他们三个群体，因为没有开智、没有权力、没有财富的普通人不会那么危险，即使杀个人放个火社会乱不了，管理一下即可。这个世界最需要控制和管理的是这三个上流群体。如果不让百姓监督他们的权力和行为，只能靠天，因为他们这三类群体吃普通人，老天吃这三类群体。\n\
  \n趋利避害是新驯化演变的最核心人性之一，欲望一定会提着人类这个木偶往高处走，过上流社会的目的就是为了过上流生活。\n\n上面的位置和资源那么少，怎么可能轻易放下面的人上来？\n\
  \n这三个阶级的精英主义阶层开始造神，造崇拜，人类开始迷信权威，更加容易迷失自我，更便于管理，社会稳定有序。\n\n**股神巴菲特，不就是玩内部消息、人脉、垄断那老一套，跟他吃顿饭都得花上千万，把自己造成神，其实就是精英主义的一条狗，更是顶层设计的苍生之局下一条狗。**\n\
  \n白莲花的绽放需要黑泥泞，天下大同需要恶犬开道。\n\n###### 悟道级强者\n\n相反，像地球上的毛泽东这种悟道级统治者，不会陷入此众生相。\n\n悟道级强者的典型特征之一是不敛财，金钱不再是目标。\n\
  \n可以一辈子穿补丁的衣服，只拿微薄的工资，头顶白莲花，心中阳光执剑，与大众百姓为伍，为了正义，可以以血引雷霆，一辈子无我，杀身成仁，舍生取义，只为天下大同。\n\
  \n还有一种不是悟道级的白莲花：为底层发声的正义之士，俗称好人，数量也很少。\n\n悟道者和正义之士都需要得到保护和尊重，他们跟绝大多数人类要斗争，跟邪恶斗争，跟不公斗争。\n\
  \n但是好人和悟道者都喜欢天道的孤独，都不怎么合群，也导致好人很难联合起来，喜欢各自为战，这也给了极致的利己主义-精英主义阶层团结壮大的机会，且污泥般的这些势力反而喜欢团结，当这股势力团结到可以一手遮天，普罗大众整体的生存遇到危机之时，好人和悟道者们才会被迫的团结起来跟精英主义阶层掰手腕，整个人类历史就是在他们这两个群体之间松松垮垮波浪式博弈中前进。\n\
  \n但如果没有诱导出来的精英主义阶层，就没有毛泽东这种少数的悟道级统治者出现；\n\n没有诱导出来的精英主义阶层，百姓就不会那么苦，政治就不会打仗，资本就不会有资本主义、消费主义陷阱，宗教文化就不会给众生洗脑；\n\
  \n没有众生相、没有资本陷阱、没有宗教陷阱，人类就不苦，也就不会觉醒强大，不打仗，科技就不会迅速发展，所以这种精英主义阶层似的“坏人”，站在人民的立场是坏人，但站在天下大同的立场，有这些“坏人”是为了没有坏人：打仗是为了不打仗，生病是为了不生病，挣钱是为了不挣钱，死人是为了不死人，内耗是为了不内耗，苦是为了不苦……\n\
  \n统治阶级的本质也不过是一份职业、一份工作，都是混口饭吃的形式；除了少数悟道级政治家、企业家、思想家，其他都是幕后那些百年家族、千年家族的工具，都是苍生之局的一环。谭嗣同《仁学》：“两千年来之政，秦政也，皆大盗也；两千年来之学，荀学也，皆乡愿也。唯大盗利用乡愿，乡愿工媚大盗。”\n\
  \n组成百姓的一个个的你才是万物之基。有百姓，才有政治，百姓做苦力缴税供养政治，是百姓花钱雇的政治，百姓才是政治、才是官员、才是统治阶级；有百姓，才有资本，百姓做牛马作为生产资料供养资本，百姓才是资本、是老板；\n\
  \n有百姓，才有宗教的神，百姓的灵魂跪下给宗教烧香供养，百姓才是神。\n\n百姓是政治的爹，百姓是资本的爹，百姓是宗教的爹。\n\n但没有政治就无组织者、管理者，没有资本就没有钱发展科技，没有文字教化就没有统一方向，也就是没有政治、经济、文化，就不会有天下大同的那天，也就是**社会稳定有序的大环境以及实现天下大同，靠普通人根本不可能实现，只能由政治家、资本家、文化思想家，这三类统治阶级带来实现。**\n\
  \n政治家、资本家、文化教育家和百姓之间相互成就，针对以上三个概念，借假修真别当真别较真。\n\n##### 8.5.2 政治\n\n有文字历史以来，绝大部分的政治都是打天下、坐金銮、睡女人、抢财产，除了少部分悟道级政治家会杀身成仁，为人民服务，为了带领人类到达天下大同，其余的政治家全都是屠龙者终成恶龙。\n\
  \n人类变成了政治动物，关心政治成了常态，人类活在政治环境里，好比鱼活在水里，毕竟水质变化，关系到鱼类生死存亡。\n\n政治的本质是斗争学、是管理学，是利益分配学；政治家的本质是斗士、是管理者、是利益分配者；政策是基于利益分配的游戏规则。分配利益的主要工具有四个：媒体、货币、法律、武力。政治要解决的只有两个问题：国外稳定有序+国内稳定有序，也就是国外不能影响自己国家政治生态的稳定有序，国内百姓也不能影响自己江山的稳定有序。\n\
  \n对外治理靠科技、靠武力、靠外交，对内治理靠管理、靠人性。\n\n###### 社会的治理一直会围绕土改、房改、税改、教改、医改、生育、制造、军改等几个环节来回折腾\n\
  \n政治家族千万不要说自己、自己的父辈打下的江山，江山一直都在那，不用打，山川河流都在那，每一寸土地也都在那；真要说谁打下的江山，是无数条底层百姓的命换来的。\n\
  \n大部分政治家族都会误入歧途，开始垄断资本、垄断权力，形成新的关陇集团，这些门阀和财阀，在幕后操纵或影响社会。\n\n从政者不为百姓，死路一条，因为百姓的子子孙孙无穷匮也，可以不断干直至干死不为百姓的从政者为止。天道守恒，秋后算账也是算账，百姓吃不了你，天也会吃了你。越是伟大的帝王时期，恰恰百姓最苦；越是圣人时代，百姓最苦；圣人不死，大盗不止。\n\
  \n政治本不存在，现在又必须存在，将来可以存在。在天下大同阶段里：人人都是政治家，老百姓才是天下，老百姓是帝王尊者。比如科技发展到每个人都是信息库，依靠智能感应来获取大脑潜意识；对当地统治者进行服务性满意投票。这样的政治局面，不会出现人为干预，政治家只有一个心思：为人民服务。世界的管理将是走向无为而为的第一步。\n\
  \n##### 8.5.3 资本\n\n资本的本质是嗜血、是收割，是欲望的炼丹炉。\n\n资本最大的财产是穷人，世界上最稀缺的资源是穷人。只要不是悟道级企业家，他们的行为是资本、是钱说了算，与人无关，不管是谁成为资本本质都一样。\n\
  \n在一个政治周期里，资本会伸手政治，政治会联姻资本，普通人会更没机会，最后推倒重来，重新开启下一周期。\n\n同时掌握天量资源性资产、天量实物资产、天量现金资产的才是资本，类似马云这种台前的人物才刚入资本的门，是小资本，是资本代言人；至于手里有个几千万上亿的这些人，只是普通人里的富人，他们是资本的猎物玩物，随时会被收割精光。\n\
  \n更何况普通人，更难实现阶级跃迁。\n\n你的平均收入早就提前计算好了，最上流的圈子很小，他们彼此相互支持，甚至联姻，同心协力踩想要爬上来的人；\n\n底层的人互相见不得对方比自己过得好，会相互撕逼；强者互持，low者互撕，导致底层人很少有人突破阶级。\n\
  \n再加上各种洗脑概念从小到大无处不在的宣传，认知被按在地上摩擦一辈子，所以穷人会一直穷得很稳定。\n\n资本创造出了各种经济形态、各行各业、各种谋生存的工作方式，资本依靠的是创造出的工作有人在干，但所有的经济模式的本质都是吹泡沫：经济史就是一部谎言电视剧连续剧，要么在泡沫破裂之前退出，要么成为韭菜。所有生意所有行业一旦有点效果挣了钱，都开始吹泡沫，脱离最初本质。\n\
  \n比如养一头牛挣钱，是因为牛棚自己用茅草屋搭建、吃免费的草，随便找个地圈起来即可；但是养到 1000 头、10000 头时就开始脱离本质，贷款建牛棚上千万，买各种机器，雇各种员工，还出国学习，玩各种时髦儿的金融新模式，甚至送礼行贿，穿金戴银豪车豪宅……\n\
  \n这些跟养一头牛时的本质完全背离，最终结局一定是崩盘、破产、倒闭、跑路，时间长短而已，包括种地都是如此。\n\n资本创造出的工作，随着生产力提升，分工越来越细，导致从原始阶段的不用工作，到混乱阶段几千年以来的工作都是传承制，比如铁匠，负责勘探、采矿、冶炼、打铁、销售等上下游所有环节，会很有趣，也能跨越经济周期和历史长河，还与大自然接触，基本不会内耗；\n\
  \n直到今天出现如此细化的分工，叫螺丝钉，一人一个坑，别说见自然每天都不见天日，随时会被淘汰，变得可有可无。**螺丝钉意味着工作单一、乏味，所以绝大部分现代工作给普通人带来的必然是内耗。**\n\
  \n当社会不需要挣钱就可以谋生、当人类重新回到原始阶段的不需要工作时，资本将会消失，或者人人都是资本家、企业家、老板、股东，消费者才是老板、才是资本。\n\n\
  比如企业想要有利润，就得依靠消费者来买，所以**消费者才是老板**。建立数字信息库，每个人的需求就是生产资料，每个人的需求是企业最大的资产，企业的盈利大部分要以分红形式返还到消费者手里，消费者拿到钱又继续消费，这样形成：企业生产和资源不浪费、消费者永远有钱花的良性循环，也能杜绝企业资本以次充好、数量泛滥倒闭和资本制造消费主义陷阱的机会。\n\
  \n只要不是藏富于民自己赚的盆满钵满的资本老板，做出再伟大的事也都是 SB，都只是精致的利己主义者，都不值得歌颂，这是对资本、对企业家的唯一衡量标准。与现代资本主义时代的企业经营理念正好相反，现在的企业经营理念都是在企业利润、解决就业率、纳税等表面上下功夫；社会上主要宣传的排名也都是资本工具。\n\
  \n比如 GDP、财富排行榜、平均收入等等，而不是百姓幸福指数、普通人平均收入等等这些本应该是核心宣传的指标。\n\n资本必须被限制在合理区间，是社会治理的核心问题之一，也是难题之一。\n\
  \n##### 8.5.4 宗教\n\n原始阶段没有宗教。\n\n政治、资本形成的同一历史时期，也就是混乱阶段开启之初，就已经有了宗教，只是那时是神权社会，没有给宗教命名而已，宗教正式出现是\
  \ 2000 多年前。\n\n###### 所有宗教的核心特征\n\n- 第一：造神\n- 第二：宿命论\n- 第三：下跪\n- 第四：制造恐吓\n\n对普罗大众妥妥的降维打击，因为人管人、人跟人相处总会有争吵有质疑，但是神跟人沟通呢？\n\
  \n**即使神说错了你都得说对，还得跪着说！**\n\n这种来自未知且神秘的强大存在，就是**造神运动**，是为了社会稳定有序，后来很多统治阶级是为了自身利益而选择宗教。\n\
  \n而且每个地区的宗教都不相同，每个地区造的神也不同。\n\n老子、耶稣、释迦牟尼这几个人本身不认为自己是神是佛，或者说他们认为每个人都是神都是佛，天道无相，神佛也无相。\n\
  \n他们基本没写书更没创立宗教，是后人为了解释世界而创造。\n\n现在地球上的国家里，除了中国，其他国家大部分是神权社会，中国在先秦之后就已经不再是神权封建社会，西方、中东等还处在春秋战国阶段，现在地球上唯一不推崇宗教治国的是中国，只是允许宗教这种文化形式存在而已。\n\
  \n创造出宗教的那刻起，就给违反思想的带来了巨大利益；创造出道德的那刻起，就给违反道德的带来了巨大利益；创造出规矩的那刻起，就给违反规矩的带来了巨大利益。\n\n\
  **宗教是人类迄今为止最大的思想牢笼。**\n\n因为造神最容易引起盲目尊敬和盲目畏惧，盲目敬畏就会失去真正自我，全成了乌合之众，人类思想进步从何谈起？宗教正式命名的\
  \ 2000 多年来，人类思想一直处于倒退中，没有思想之光的指引，人类找不到出路。万法归一，万法皆空，更何况由法生出的教，万教皆空。\n\n宗教跟学派思想是两码事，比如佛家思想生出了佛教，道家思想生出了道教。\n\
  \n我们人类是思想者，思想者生出思想，思想生出宗教，所以宗教是思想者的孙子，但现实中人类被洗脑编程后，给自己的孙子下跪和崇拜，愚昧就会让社会稳定有序。\n\n\
  加了教字，就是教化。\n\n**思想家都是探索世界不改造世界，但宗教家是为了改造世界。**\n\n宗教是社会稳定有序整个链条的闭环，是精神内耗的配套。\n\n\
  因为在混乱阶段至今的 6000 年里人为设计的众生开始皆苦，但是太苦也不行，苦的都抑郁想自杀、苦的都想躺平也不利于社会稳定有序发展。\n\n**所以必须设置一个环节可以得到内耗的人力量，叫信仰！**\n\
  \n很多遭受重大苦难后的人们选择了宗教，有了精神依托，重新获得力量，不仅不会危害社会，生活态度还会变得更加积极，这样社会就会稳定有序。\n\n**宗教只是自欺欺人罢了，你真的虔诚吗？**\n\
  \n**你拜佛拜的是自己心中的欲望。**\n\n**最虔诚的地方不是宗教，是医院重症监护室！**\n\n**宗教是最大的思想黑社会、精神黑社会。**\n\n因为他们动不动就吓唬人！吓唬人不是黑社会是啥？“动不动就造口业、下地狱、轮回成畜生、万劫不复、惹了太岁、阴债太多”等等。世界上除了不能动底层人的认知，就是不能质疑信仰宗教之人的宗教，他们的命运被牢牢掌控和锁死。\n\
  \n宗教的好处也很多，是混乱阶段不可或缺的重要环节。\n\n比如宗教为什么可以给痛苦的人带来指引或拯救？\n\n- **第一、痛苦人的世界里就需要也只需要找到救命抓手这一件事；**\n\
  - **第二、达官显贵这些能量高的见了神都得跪下，更何况能量低甚至马上想死、能量马上消失的痛苦之人，在神面前更加卑微，绝对卑微就会产生绝对虔诚，从而产生绝对相信。**\n\
  \n神说的话就会成为唯一心理暗示，在内心深处不断种正向的心锚，最终去证明它去实现它，类似吸引力法则、心想事成；\n\n- **第三、宗教的语言体系绝大部分正好都是正向的。**\n\
  \n没有什么失败、心理疾病等负面词语，语言大环境舒服。人活在语言体系下，语言什么样子，这个人就是怎么样，信宗教的过程基本就是剔除负面语言体系的过程。\n\n-\
  \ **第四、宗教里相对世俗之人很少，同频之人居多，人员大环境舒服，且环境更大自然一些，天补地补人补都有了，利于身心净化。**\n\n还有具体的比如道教可以立国打天下，道教文化太牛逼是门内文化不普及；唯一的东方本土教，但现在相当多道士或者学了点玄学的人以牟利为目的，到处化太岁、还阴债、超度算命看风水，这是道教玄学鄙视链的最底端，但如果能做到不割韭菜+只正向引导+为了自己混口饭吃，可以理解；\n\
  \n再比如儒教，是被阉割后的儒家文化，也就是大儒主义，可以教化世人、运天下，是门外文化，导致人情世故等这种文化糟粕越来越盛行；\n\n再比如佛教可以抵抗部分内耗安天下，设计出了内耗必须设计出所谓的信仰来闭环，但现在搞的跟推销业务一样见到人就说：施主你的机缘已到……\n\
  \n更是畸形到了张嘴闭嘴都他么说别人造口业，尤其是你质疑他们马上说你造口业，张嘴吓唬别人造口业这句话才是造口业！\n\n教规更吓人，不听话还诅咒变成畜生。\n\n\
  宗教在三维空间已经构建的秩序根基很难动弹，比政治、资本生命力更旺盛，但也只是在玩三维空间内的文字游戏而已。2000 多年前发明了宗教，现在又发明了心理学，都是治标不治本，都是治疗配套，设计好的，精神疾病的名词药物仪器越发展越来越多，精神病人也越来越多。\n\
  \n如果宗教很好，为何存在了 2000 多年人类的苦越来越多？为何内耗的越来越多？思想一直从未突破先秦？天下大同到来的那天，就是宗教覆灭时，但他们的生命会换种形式存在：\n\
  \n比如像道教那样成为一种实用性的学术继续传承下去，再比如跟政府合作研究暗物质暗能量等玄学科学，再或者作为培养觉醒开悟之人的基地、学府、思想运动会委员会等等。\n\
  \n**借假修真别当真别较真。**\n\n很多信佛、信基督等等信各种宗教的人会有疑惑：\n\n**自己这么虔诚，各种积善布施，为什么还有这么多不顺？**\n\n\
  **因为只要还在众生相名利场里，不顺是常态。**\n\n**尽信书不如无书，尽信教不如无教。**\n\n有用你就用，听不懂或者有疑惑的不用即可。\n\n万教归一，万教皆空；万法归一，万法皆空。\n\
  \n你本自具足，自己就是宗教、自己就是佛、自己就是上帝、自己就是神，对自己保持绝对虔诚。\n\n#### 8.7 我相\n\n你认为的我是假的，你认为的我是被打压灵性、打压兽性、驯化新人性后的我，你认为的我只是肉体是躯壳。\n\
  \n比如我叫小镇舍长，这只是我的代号，一个称呼而已，我只是在扮演小镇舍长，在互联网上体验个三年两载就不用了，包括身份证上的名字，体验个几十载就不用了。\n\n\
  不要执着这个假“我”，以及这个假我相关联的一切。比如若你执着这个肉体，但它会死，没办法执着，没办法较真。\n\n你是你，你不是你，你还是你。\n\n借假修真不当真不较真。\n\
  \n#### 8.8 人相\n\n人是假的。\n\n我们本不是人，跟其他动物一样都是一坨肉，原始阶段哪有人这种概念，就跟狗一样，人是被驯化而来。如果原始阶段的是人，那为什么你跟现在是完全不一样的人？\n\
  \n再如果你现在是人，那现在把你出生时就扔到狼窝里让狼把你养大，你跟现在的人也完全不一样，现在的人会认为你根本没有人性。\n\n只是为了社会稳定有序，统一给这个群体的下个定义而已。如果最开始给我们这个生物的定义不是人，而是狗，那我们现在会称呼自己是狗。人类的所有问题都是人类思维导致，所以解决人类问题得站在人之上。\n\
  \n但是回不去了，你只能是人，要表演的像人。你是人，你不是人，你还是人。借假修真不当真不较真。\n\n#### 8.9 亲密关系相\n\n天道无亲，亲密关系是假的。\n\
  \n人为创造的亲密关系有父母、夫妻、孩子等，原始阶段哪有父母夫妻孩子？\n\n花花草草、猫猫狗狗、婴幼儿、强者的内心世界里，谁有父母、谁有爱人、谁有孩子？有了这些亲密关系，社会就会稳定有序，因为：\n\
  \n- 第一、有了亲密关系就有了顺序就有了秩序，比如上一辈下一辈，君君臣臣父父子子，社会稳定有序；\n- 第二、有了亲密关系就有了软肋，你就很容易被拿捏，不敢轻易造次，社会稳定有序；\n\
  - 第三、有了亲密关系就得为他们花钱，花掉你所有的钱，辛苦一辈子积攒的钱是自己的真正实力被消耗掉，是资本需要、社会需要，社会稳定有序；\n- 第四、有了亲密关系就开始讲爱，开始不懂得保持距离，开始违反天道，变得家家都有一本难念的经，天天跟父母耗、跟爱人耗、跟孩子耗，你就不再有精力跟他们耗，社会稳定有序；\n\
  - 第五、有了亲密就有了家庭为单位，社会管理的难度和成本，比直接管理个人降低10倍左右，社会稳定有序。\n\n针对亲密关系，借假修真别当真别较真，只是体验，用心体验即可。\n\
  \n##### 8.9.1 父母\n\n花花草草没有父母；猫猫狗狗没有父母，是你认为它有，实际上雄性动物只是为了交配，交配结束就走了，他不认为自己是爹，而且孩子长大后会跟父母进行交配或者争抢领地；\n\
  \n婴幼儿没有父母，把他从小扔到狼窝里他一样长大；强者没有父母，佛陀直接抛弃了自己的父母，李世民废了自己的亲爹，武则天杀了自己的孩子；如果你是男人，把你跟你母亲扔到荒岛上，用不了两年你们就生孩子了；如果你是女人，把你跟你父亲扔到荒岛上，用不了两年你们就生孩子了。只是最开始还带着伦理道德，时间久了，在这种没有伦理道德审判的原始地方，你们就会回归原始。\n\
  \n###### 8.9.1.1 孝道\n\n最初创造父母这个亲密关系时，创造了孝这个配套概念，一直到汉武大帝之前讲的孝还算地道，都是自上而下的孝，是父母先孝孩子，孩子才会孝父母，是相互的，这样的孝是道，孝道；汉武大帝独尊儒术开始，变成了单向，只讲孩子得孝敬父母，不再刻意要求父母；到了清朝更狠，把孝改成了\n\
  \n孝顺，意思是即使父母错了，即使父母对你不好，你也得孝，还得顺，百依百顺，愚孝大量出现。\n\n**都是为了社会稳定有序，而创造的文字概念、文字游戏**\n\n\
  几千年下来的这种父母和子女的关系，直接导致了打压式、侮辱式家庭教育出现，让父母跟子女的矛盾慢慢趋向白热化，家庭二元对立的目的达到，这是设计好的。\n\n整个社会的顶层设计就是打压和侮辱，这样你才会失去自我，打压你的灵性、打压你的兽性，侮辱你，说你是人，这不是骂你吗？\n\
  \n父母跟孩子这样的相处模式，就是社会稳定有序的重要一环。\n\n**悟道级的强者跟人相处都很舒服，是因为从不打压，从来都是用你能接受的方式，把能量、把方式方法给到你。**\n\
  \n不要跟父母争吵，那么大一把年纪，年纪越大越固执，这种固执属于封闭性自洽，而自洽是幸福的唯一标准，封闭性自洽也是自洽，是一种自我保护机制。尤其是人到中老年，如果每天都在颠覆三观，那他的世界就崩啦；年纪越大经验越多，经验的意义在于它的确定性，而确定性是人类自洽感、安全感、幸福感的重要来源，至于这些经验是对是错不再重要，即使你是悟道级的圣人，若天天想教育那些封闭性自洽的人，也是该死。\n\
  \n夺人之美，瞎干涉别人命运，不是帮人，是害人；\n\n而且父母生你的目的不是为了弄你，不是为了让你内耗，没有父母在孩子出生之前就商量好：我们生个孩子，慢慢折磨他、弄他、玩他，让他失去自己……这是局，是坑，是陷阱，是设计好的游戏，不是父母的问题。\n\
  \n###### 8.9.1.2 叛逆\n\n整个混乱阶段的人类世界都是假的，都是错的，都不正常，都是反着的。\n\n在合理范围内越叛逆，个人和社会的道路越正确，要正向引导孩子的叛逆，叛逆出磅礴的智慧，叛逆出独立的自己，叛逆出美好的未来。\n\
  \n几千年来父母对孩子的管理效果多好先不说，起码孩子叛逆反抗的是少数，但现在的00后为啥不好管，为啥能整顿职场，为啥有各种逆天的想法。根本原因是家庭结构发生了逆转。\n\
  \n以前家庭结构是正三角，人特别能生，比如一个爷爷奶奶生五六个孩子，一个爸爸妈妈又生两三个孩子，它是个正三角结构，物以稀为贵，众星捧月，辈分越高地位越高越尊贵，70、80后的你得跪着。你接受的是侮辱式教育；\n\
  \n现在的00后是倒三角家庭结构，爷爷奶奶外婆外公，往下是爸爸妈妈，最底下是你，都宠着你、惯着你、由着你，你的思想你的灵魂是自由的，你的物质条件是优渥的房子、车子一大堆最终都是你的。\n\
  \n但职场的管理体制还停留在侮辱式管理阶段，那你能惯着他？加班？滚；检讨？滚；洗脑？滚。这对人类未来发展是好事，时代进步、时代召唤，这样的孩子思想和物质的枷锁都少，可以天马行空，敢于叛逆、敢于说不，敢于坚持做自己，人类进步的本质之一就是下一代永远不听上一代的话。\n\
  \n**跟父母相处，舒服就多接触多体验，不舒服减少接触，尤其是跟父母关系处于崩溃边缘的，可以只负责他们的生老病死，法律上不断，情感上断，自己心安自洽即可，不要内耗不要对抗。**\n\
  \n每个时代的人的认知都是对应时代的环境产物。\n\n**两代人之间的年龄差距20岁，但认知差距可能是50岁甚至100岁，很难共情，很难相互理解，借假修真，别当真别较真。**\n\
  \n##### 8.9.2 婚姻\n\n站在人类历史尺度上更清晰，每个历史阶段婚姻的形式都不同：6000年前原始阶段每个人都出轨都是小三，到了发情期就交配；5000年前母系社会一个女人有十几个几十个老公，因为女人的采摘改善了男人狩猎食不果腹的生存现状，女人地位很高，孩子只知道母亲是谁；到了上下5000年的专制时期皇帝可以3000个媳妇、员外300个媳妇、有钱的老百姓可以三妻四妾，是因为上下5000年4800年都在打仗，打仗的意思是男人去死，男人一直死，女人剩的多男人少，男人就可以娶的多，打仗需要更多的男人，这样女人就像商品一样不浪费可以生出更多的男人接着打仗接着死，多余的女人可以去妓院青楼；到了民国时期流行近亲结婚，全是表哥表妹结婚，是亲姨妈亲舅舅家亲姑家的孩子，叫亲上加亲，肥水不流外人田；咱父母那一代是一夫一妻基本很少有人出轨很少有人离婚；30年前到了我们这一代开始有了自由恋爱，自由婚姻；现在的婚姻基本都出轨基本都离婚，不结婚的越来越多，以后有可能不结婚，结婚犯法，每个人的伴侣都是人工智能仿生人，能生孩子能陪伴能照顾自己能干活。\n\
