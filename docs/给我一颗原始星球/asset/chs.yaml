- '# 第二部分 如何破局（三修）


  活着，就是修行的过程，人生无处不修行，修行是一整套系统，有起因有过程有方法有坑。


  **都说修行很难，但本质极其简单，就是你做任何事都可以类比修行。**


  比如你学修车，最开始很混乱，一直入不了门，笨手笨脚，感觉很难，也老是出错；


  但做久了聚焦了用心了，随着操作次数增加，技术越来越熟练，突然会有一天，修车的技术你会一刹那顿悟，无师自通。


  只要坏车给到你，你就能查出问题并修好，出师。


  只是现在的修行太乱，乱成了一坨狗屎。


  谈起修行都被神话、被高高在上化、被高深莫测化、被高难度化、更被偏科化。


  ### 1. 修行的诞生


  宇宙的整个顶层设计是为了宇宙稳定有序，人类世界的顶层设计是为了人类社会稳定有序，个人世界的顶层设计也一定是让自己的一切稳定有序。


  原始阶段不需要修行或者人人都是修行本身，都很稳定有序。但从混乱阶段开始，由于发明了文字会说话会思考之后人的心发生了变化，导致不平衡不和谐出现，个人世界变得不再稳定有序。


  但宇宙能量守恒，一旦失衡，宇宙会想尽办法恢复平衡。


  自此宇宙从设定好了一切，变成：**宇宙唯一没有设定好的就是你的心；**


  所以需要修行把心修回平衡和谐、心安自洽，也就是修行就是修心的过程、设定好心的过程。


  心就是真正的自己，因为混乱阶段的顶层设计是根据人性让人类丢失真正的人性增加了假的人性，形成了众生相，所以修行就是不断破相的过程即：修行是宇宙顶层设计，修行是人道后新增的天道，是天道人道合一的开端，并贯穿人类存在始终。


  **第一：让宇宙世界稳定有序的顶层设计是天道，自然规律、宇宙规律，堪称完美，所以宇宙无数光阴中整体很平静很平衡很和谐很自洽。**


  **第二：让人类世界的顶层设计是人道，各学派思想，儒释道法等等。**


  已经很好但还不完美，尤其是独尊儒术后的犬儒主义，更是让人类思想倒退千年，叠加最近几百年来更操蛋的西方资本主义，一下子把今天干成了末法时代，人类的精神文明从未像今天如此失衡，需要有超越先秦思想的新思想来修正和完善，所以新的伟人圣人将出。


  **第三：个人世界：**


  由于人类世界的顶层设计不够完美，再加上后来的犬儒主义+西方资本主义，导致个人本来很完美的肉体世界开始失衡，病越来越多；也导致个人的精神世界失衡，内耗越来越多。


  因此，在当下更迫切需要修行去实现个人世界以及人类世界的稳定有序。


  ### 2. 修行路线图


  修行的过程大致分为六个阶段：


  **普通人-觉醒-开悟-悟后起修-得道-玄之又玄。**


  目前人类已经证得的是前五个阶段，玄之又玄的修仙等目前只存在于小说中，很多专门的机构和群体研究的玄学，包括暗物质暗能量的探索，都被控制在极小范围内，他们研究的是：天道、人道和天人合一之道这三者之外的道。


  人道困住了普通人类，也就是在苍生之局内的普罗大众；


  天道困住了佛陀、老子等等超然物外的悟道级强者；


  天人合一之道困住了毛泽东、谭嗣同等等杀身成仁的悟道级强者；


  宇宙没有终极答案，这三个道之上肯定还有道，道上之道，无止境。


  想要力压天道、力压人道、力压天人合一之道，等你先把三者修明白再说吧，能把天道、人道、天人合一之道修通，已是人类思想绝对的金字塔尖。


  #### 修行三步走


  - 第一：先见众生，得先入世，红尘中才是大修，不经历就没有发言权，尤其是不经历痛苦不可能醒悟，此阶段用儒家法家；

  - 第二：再见天地，就是格物致知，宇宙自然的天地万物本是同根生，天地与我共生万物与我唯一，此阶段用道家；

  - 第三：最后见自己，经历了人世间的痛苦，开始远离人世间，大自然治愈了自己，此时终于明心见性，找到了自己，此阶段用佛家。


  儒家法家道家佛家同根同源（后来的犬儒主义不算真正的儒家是阉割版）。


  只有入世见到众生相才会被刺痛痛到醒，只有入世才能获得物质基础和生存手段，物质基础才能决定上层建筑；


  见到了众生不再想见众生，开始喜欢接触灵性的天地万物，开始格物致知；最后格清楚了格明白了，发现天地与我共生万物与我唯一，见了本性见了真我，也就是见到了自己。所以必须先入世见众生，再格物致知见天地，最后方能有机会见自己，找到真正的自己。


  这场苍生之局是阳谋，阳谋无解，必须以身入局，先去经历，先去干；才能先看清，再看透，最后看淡。


  好奇这个世界，经历这个世界，恶心这个世界，理解这个世界，欢喜这个世界。


  #### 2.1 修行各阶段


  修行、觉醒、开悟、得道的这些文字概念是人为发明，是对宇宙客观事实的描述，是对你的生命到达某一状态时的总结。


  修行的过程就是不断破相的过程，比如想要觉醒就得打破否定普通人的认知，想要开悟就得打破否定觉醒者的认知，以此类推……


  ##### 2.1.1 普通人


  你会活在一切概念之下，亲密关系之下、二元对立之下、情绪之下、规则之下、文字之下、自信之下、金钱之下、时代之下等等；被他们带着走，被这些概念控制，看不清真相，这个阶段的人认知最低但还最固执，最容易内耗，你是众生相的狗，你是一切的狗。


  ##### 2.1.2 觉醒


  人类的顶层设计，这场苍生之局，主要就是针对觉醒人群。觉醒的人要么向内攻击，把自己陷于抑郁、焦虑，要么向外攻击，让社会焦虑。


  被现实无数次打击，醒了，看透了游戏规则，认知比普通人高，开始上道儿。


  但大部分在觉醒初期只是看透并没有看淡，内心深处会觉得这个世界原来跟想象的、跟教育的不一样，有种被欺骗的感觉，容易戾气重，容易反社会反人类反文明。


  人类思维之上，已经没有这些概念，处于无念状态；这些概念会跟着你走，金钱会跟着你走、规则会跟着你走，时代会跟着你走。


  ###### 万物都可以是你的狗


  有五个典型的特征：


  - **第一：极低欲望。** 没啥消费，如如不动，很省钱，连吃饭都很少，几十块的衣服能穿好多年。

  - **第二：很平静。** 开始懂得内观身体，甚至自学中医，也就是身体使用说明书；情绪稳定，追求平静平淡，根本不会追求快乐啥的乱七八糟的情绪；也不再跟人争吵辩解，甚至很少说话，心宽。

  - **第三：瞬间看透本质。** 宇宙万物的本质、人类世界的本质、个人世界的本质，也就是能做到见天地、见众生、见自己。

