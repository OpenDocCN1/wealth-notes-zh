  如果没有快乐、难受等等这些字，人就跟天地万物一样没有情绪是平静的。你吃饭时平静吧，睡觉时平静吧，上厕所时安静吧，看我的文章时平静吧，你吃饭时快乐？撒尿时快乐？睡觉时快乐？No！\n\
  \n是平静，平静才是大概率事件，贯穿生命始终，快乐是假的，情绪都是假的，都是社会稳定有序的概念设计。\n\n##### 8.10.2 恐惧情绪是陷阱\n\n**天地万物里的花花草草猫猫狗狗谁有害怕这个情绪？都是无惧。**\n\
