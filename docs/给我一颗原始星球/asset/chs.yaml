- "## 第五章：常见内耗概念 破！\n\n### 1. 精神内耗 破！\n\n**精神殖民时代**\n\n殖民主义500年了从未消除，从最开始的肉体殖民，到现在的资本殖民，马上准备开启精神殖民时代。\n\
  \n**第一：最大的流行病马上是精神内耗，这是人为创造的精神病毒。**\n\n情绪会传染，你哈哈大笑身边的人哪怕不知道原因也会跟着笑；\n\n抑郁焦虑也是情绪必然会传染，现在全社会都是这种情绪，整个社会都将被精神病毒感染。\n\
  \n**第二：精神资本主义陷阱即将到来。**\n\n新的产业出现，先是发明了抑郁焦虑等等各种精神内耗的词，说这是病，利用人性下坠的力量以这些负能量文字对大众进行编程；\n\
  \n然后打造顶格消费主义，催化加速全民精神内耗进程，再找专家代言、大学设置相关专业，最后发明各种仪器发明各种精神药物，一条龙闭环。\n\n#### 1.1 精神内耗是被封印的智慧\n\
  \n所有的精神内耗都是被封印的智慧，容易精神内耗的人灵性越强。正向引导这些智慧顺其自然破土而出就会成为高维能量。\n\n但为了社会稳定有序，为了众生皆苦，苦到能醒悟强大，就用低维的手段把精神内耗定义成了负向的疾病，被打造成另类受排挤被孤立，必须治疗吃药必须压制，让你一直处于低维，让你一直内耗，自己跟自己耗、自己跟原生家庭耗、跟爱人耗，就不会跟统治阶级耗，人类世界就会稳定有序。\n\
  \n- 第一：抑郁是在进化，是重生，因为真正的我开始思考。\n- 第二：社恐是自我保护，因为人是万恶的伤害之源。\n- 第三：焦虑是在提醒自己活在当下，焦虑源自于未来未知，但人根本没有过去和未来，人只有当下这一刻。\n\
  - 第四：暴躁是在提醒自己还有独立人格，只会服从和温顺最容易成为待宰羔羊。\n- 第五：敏感是直觉是悟性，越敏感直觉越准悟性越高。\n\n#### 1.2 惊恐症\
  \ 破！\n\n第一：精神内耗这个普遍现象是当下社会造成的，且百姓纳了税，社会100%有责任义务保护百姓尤其是弱者，纳入医保属正常诉求。\n\n- 第二：抑郁症很放松，想死；焦虑症很紧张，怕死。\n\
  \n第三：这俩内耗情况可能会在学生身上同时发生。\n\n第四：最令人痛苦的是惊恐症，焦虑到极致就会引发惊恐，躯体化症状。\n\n**破解方法：**\n\n- 第一：允许它发生，允许自己带着症状生活。\n\
  - 第二：这个念头不是你，是假的，是设计好的坑，陷阱。\n\n\n\n- 第三：天地与我共生，万物与我为一，我是花我是树我不是人我不会思考\n- 第四：惊恐也是我的情绪，我的每个情绪都很重要\n\
  - 第五：找到让自己放松的环境、动作。比如颈椎病紧张引起，那就放松颈椎，比如去医院急救室门口坐一会；比如憋气、跑步、冲澡\n- 第六：蔑视。反复发作无数次，濒死无数次，但结果是每次都没死，引发惊恐的就是废物，是手下败将，怂货怂包，下次就等着它来，有种来啊，弄死我啊\n\
  \n#### 1.3 抑郁 破！\n\n- 第一：抑郁是身体自救信号，挺过去就能看清世界更看清自己，看清楚这就是不得不做的局，不得不设置的陷阱，不得不挖的坑，抑郁的念头不是你，是被编程后的假我的大脑的念头，是假象。\n\
  \n总之这一切发生皆有利于我\n\n- 第二：抑郁期间的人不自然流露出的是智慧 不爱说话、不爱与人接触、不爱出门、不爱工作。语言都是假的，不爱说话就对了，开口神气散不利于身体健康；不爱跟人接触就对了，被驯化成人类之后人类变得很恶心很贱很危险，尤其是最亲近的人，是你的伤害之源；不爱工作就对了，本来原始阶段一百万年里都不用工作，工作只是为了混口饭吃\n\
  - 第三：抑郁时会这样就说明人类本该如此。抑郁时思维最有机会跳出人类思维范畴跳出三维空间，抑郁时不关注外在开始关注自己，向内求才开始回归本源，才是人生真正的开始\n\
  - 第四：抑郁想不开的朋友，你不能滥杀无辜。你想结束的是痛苦，不是生命，对吗？生命是无辜的；你的过去想杀了你，不是未来，对吗？未来是无辜的；你的精神在内耗你，不是身体，对吗？你身体的无数个器官和细胞，无怨无悔一心一意哪怕牺牲自己，也要护你周全，对吗？身体是无辜的\n\
  - 第五：你的精神强大到可以让身体跪下，可以让身体变成尸体，你动动念就可以让痛苦灰飞烟灭：精神内耗就凭你跟我斗？我可以弄死你跟你同归于尽，但你弄不死我只能让我痛苦，要么臣服我要么滚蛋，不然弄死你\n\
  - 第六：抑郁咋啦！谁还没抑郁过！就抑郁咋滴！太阳到了升起时就升起，一天就落下了；你到了上幼儿园年纪就去上学，三年就毕业了；你感冒了就难受，七天就好了。太阳升起时你抑郁了吗？幼儿上学时抑郁了吗？感冒难受时你抑郁了吗？没！那到了该抑郁的时间体验个几年不就完啦，你是体验不了抑郁这个事实而产生了额外的抑郁情绪，接受不了抑郁而抑郁，你是在用抑郁对抗抑郁，你必须觉察到这一点。抑郁是正常的你能自愈，就像太阳会升起是事实但它自动会落下，上学是事实但你自然会毕业，感冒是事实你会自动痊愈。而不是觉得抑郁了就不正常，更不是不会结束，一切都是设定好的正常事实，你本自具足是你能搞定！\n\
  - 第七：如果老天跟你一样，天天死去活来的，抑郁甚至自杀。大早上睁开眼一看：天没了…要是万物都跟你一样，别说老天，宇宙早没了。能蒙住自己眼睛的只有自己，活着就是意义本身，你在骑驴找驴，你一头活驴，怎么能跟死驴一样又瞎又聋，存在就是存在，发生就是发生，活着就是活着。**你最嫌弃觉得最没意义的对别人可能就是活着最大的快乐。**\
  \ 你就是一坨屎，也有屎壳螂最爱你，歪脖子树咋啦，狗尾巴草咋啦，蛆咋啦；没心没肺的肯定自己。你要睡不着就不睡，说你丑是他眼瞎，没提拔你是公司损失，你的一切才是你世界里唯一意义，神明都不能来亵渎\n\
  - 第八：所有的精神内耗什么抑郁焦虑等等，就是一种思想活动，我活动活动咋啦？你的精神世界完全是自己的，也就是在自己家我想干嘛干嘛，想抑郁就抑郁，想焦虑就焦虑；精神世界就是精神宇宙，这么大地方出现啥不正常，任何一种思想活动都正常，我抑郁焦虑算个屁，我是神经病都正常\n\
  - 第九：痛苦的过程总感觉很漫长，再漫长也只是个过程，做人做事重复是天道，断断续续是天道，有过程是天道。吃饭呼吸拉屎、刮风下雨日升月落月圆月缺哪件事不需要过程，哪件事不重复，哪件事不是断断续续；抑郁焦虑内耗了怎么可能一下子就好？康复之前怎么可能不存在反反复复断断续续？还有其他事情也一样，比如事业哪可能一直赚钱？要允许自己反反复复，允许自己断断续续，允许自己体验整个过程。从出生就注定了要死，生死之间就是个过程，不允许有过程不允许每天重复，那你出生时直接死了算啦\n\
  - 第十：屎尿屁和饭水空气一样重要。你所有的情绪都很重要，好情绪很重要，坏情绪也很重要；你所有的特点都很重要，优点很重要，缺点也很重要；你所有的经历都很重要，对很重要，错也很重要，得到很重要，失去也很重要；你遇到的所有人都很重要，善缘很重要，孽缘也很重要。\n\
  \n**我是一切的根源，一切发生必有利于我**\n\n### 2.伤害 破！\n\n在原始阶段的篇章里讲过伤害是天道的 混乱阶段里这个世界设计的游戏就是伤害你，伤害更是人道。所以别人伤害你，你伤害别人，天经地义！人生而伤害或受伤，矫情啥\n\
  \n#### 2.1 你为什么会被欺负？\n\n狗为什么吃屎，因为散发着屎味儿；你为什么被人欺负，因为你散发着弱者气息\n\n- **第一：要跟谁都敢翻脸，但凡让你不爽，加倍还他。**\
  \ 世界上99.99%的人都得罪得起，剩下的你得罪不起的0.01%，你根本碰不到\n- **第二：人在底层必须有虎狼之气，要有匪气。** 只有到达一定高度自然会优雅知性；穷人需要狂野一点，优雅谦卑是有钱之后才配做的事。只有强者才能止戈为武，柔弱是你变强之后的选择\n\
  - **第三：单纯的柔弱心软和不好意思只会杀死自己。** 理性的薄情和无情才是生存利器，因为柔弱心软就是软弱，软弱就是无能，破窗效应之下，全世界都会认为你可以被欺负\n\
  - **第四：金刚怒目也是修行，反抗攻击代表着磅礴的生命力。** 你不向外攻击就一定会向内攻击；向外攻击，你的生命力越磅礴，向内攻击天天干自己，你会越来越弱，赶着去死啊\n\
  - **第五：你要是弱，就别说话少说话。** 不说话之前没人敢惹你，不了解你之前没人敢惹你，你被人欺负完全是自己吸引来的\n\n多的也就几万人，几万这个数字对于一个城市一个国家完全忽略不计，每天全国平均死亡三万人左右，也就是你活了一辈子认识的人，一上午就干没了。\n\
  \n全没了也就全没了。对这个世界一点影响都没有，你在意的所有人只是一场虚无\n\n- 第七：你世界里的一切都是围绕你展开的发生。以自己为中心是天道，所有人注定都是过客，所有人的命就是离你而去，跟任何人刚认识，你们的关系就进入了倒计时\n\
  \n#### 2.3 被人伤害过阴影一直挥不去咋办？\n\n- 第一：他说你一句你难受一天，相当于他说了你一天，他伤害了你一次你难受几十年，相当于他伤害了几十年，他也只是在那一刻伤害了你，中间他没再当面伤害你吧，那你这个伤害和难受是因为你想出来的，人家干你一次，你干自己无数次，你是个狠人，狠人在地球上可都活得可滋润，你用错地方了，方向反了。但起码能证明你是个狠人是个能成功的人，想通这一点你前途无量\n\
  - 第二：谁没被人伤害过，谁没伤害过人，打平！只专注强大自己，现在伤害过你的人都没你过得好，就是对他最大的报复。否则你越走不出来，混的越差，且又给了他们继续嘲笑你伤害你的机会，那你不是活该，你只有越强大欺负你的人越少\n\
  - 第三：大部分伤害你的人一辈子不再会见到，你也可以想办法一辈子见不到，一辈子见不到不就是跟死了一样，你跟死人计较啥？\n- 第四：出一个恶心的方法看能不能帮能把你恶心好：过去的伤痛好比是拉出去的屎，回不来、放得下、随他去、化能量。拉出去的屎不能原路返回吧，是不是很自然的分解，化为宇宙的能量来源。总不可能有人把自己拉的屎再吃回去，也可能有人把拉出去的屎小心翼翼的存放起来吧，找个格子间，一个格子放一坨的，每个格子编好日期，生怕他坏掉，这是我的屎，我的，我要好好待它。没人这么变态对自己的屎产生感情吧。放不下往事的人，就像浑身涂满了屎一样，恶心自己，恶心别人，也恶心了屎。屎的命运就是要走的，就是要化为能量的，多正能量积极的屎，你还没你的屎积极。往事要随风的，是要化为人生前进之路上的营养。放不下往事的你，屎与你同在，阿们、阿弥陀佛、福生无量天尊...\n\
  \n#### 2.4 被人故意冤枉怎么办？\n\n太正常了，尤其是你稍微优秀那么一点就会招致是非，比如长得漂亮、受领导器重、工作突出业绩优秀，甚至你没任何优点也会有人看你不顺眼\n\
  \n- **第一：冤枉你的人比你还知道你有多冤枉。** 很多人会选择去自证清白，拿捏的就是你这种老实固执之人，这种人最容易陷入自证陷阱。让子弹飞很多人都看过，六子被冤枉吃了两碗河粉，为了自证清白切腹死了\n\
  - **第二：如果有人冤枉你偷吃了他的东西，就挖出他的眼睛，吃到肚子里，让他亲自去看看。** 人活着就要做一个有锋芒的善良人。**遇强则强，遇善则善，遇恶则恶，得比她还恶，该翻脸时就翻脸**\n\
  - 第三：以妥协求和平和平亡，以斗争求和平和平存。只有斗争才会让自己强大，只有斗争才会让敌人退却。遇到这类事情，思路不要放在害怕、妥协、自证清白上，这些都是对方拿捏你的原因，你要是退缩了，有打不起还躲不起的思想时正合了小人心意，巴不得你赶紧离开呢！但是凭什么是你离开呢？你被人冤枉不说最后还灰溜溜的走掉！佛争一炷香，人争一口气，必须要把思路放在斗争上，干他！具体怎么干？\n\
  \    - 第一：硬干，比如骂人，虽不道德但不犯法，往死里骂，要具备泼妇的潜质，骂出整条街都是老娘的气势，一般人绝不敢再惹你\n    - 第二：阳谋：比如你要反过来袒护他，说你们俩的关系是最好的啊，还要装作很惊讶不相信是他说的。还要大声说出去，尽量让所有人都知道\n\
  \    - 第三：阴谋：你也故意冤枉他啊，在组织内制造点舆论还不简单，借别人的嘴办自己的事。借刀杀人、斗争传播学这俩组合拳百试不爽，传播的舆论要尽量炸裂，炸裂到足以干掉他\n\
  \    - 第四：提升自我修为，要对自己藏拙和自嘲，对小人敬而远之、删除拉黑。总之，避免更多的污蔑来袭才是长久之道\n\n#### 2.5 被语言伤害时的处理方法\n\
  \n当陌生人用语言伤害你时，内心不接应，就不可能伤到你，所有恶念也都将原路返回...\n\n周围的人怎么看你回应是他们的事，爱咋看咋看，而且他们都等着看你的笑话看你的热闹，看热闹从来不嫌事大。\n\
  \n俄乌战争打得越狠你聊得越嗨，隔壁邻居出的事越大你越幸灾乐祸，你活着是为了给别人当笑话？\n\n- **第四：全是被编程的那个假我的大脑的记忆，记住了这次伤害，这个念头不是你，是假的，你的真我你的灵魂你的心能放下，能断舍离能屏蔽掉，只专注让自己越来越好。**\n\
  \n只要不触碰你生存底线，所有发生过的事都是屎，排出去不带一点犹豫，更不带一点念想\n\n### 3. 奉献 破！\n\n#### 3.1 爱自己就是奉献\n\n\
  **爱自己如果有错，全世界就没有正确的事了**\n\n- 第一：上学时都说要爱学校，我就是学校的一份子，爱自己不就是爱学校？\n- 第二：都说爱家庭，我就是这个家的一份子，爱自己就不是爱这个家？\n\
  - 第三：爱自己的身体不生病少生病，少让社会医院医生辛苦，这不就是奉献？难道全人类都使劲生病把医生累死、把社会瘫痪、把地球资源耗没是奉献？\n\n#### 3.2\
  \ 奉献是人道，索取是天道\n\n- **第一：每个人生而土匪，生而掠夺，生而索取。** 你出生就从宇宙中掠夺了一个灵魂，你张口呼吸空气中的微生物就被你吞了，你吃饭就会有动物或植物这些生灵死掉，你考上大学就一定会有人考不上，你升官就会有其他人被淘汰\n\
  - 第二：当然奉献也是天道，呼出去的二氧化碳拉出去的屎都是奉献，但是宣传奉献不是天道是人道。天天宣传奉献是为了掩盖少数人类欲望。奉献是付出，欲望是索取，宇宙是平衡的，过度索取就必须要过度付出来中和以维持平衡，谁也承担不起失衡带来的灾难后果\n\
  - 第三：正常为了生存而索取，天然就伴随着奉献。每个生物出生到死亡的过程是索取和奉献的动态过程。从娘胎里索取母亲，出生后索取空气食物阳光水分，也会奉献自己呼出的空气排出的废物，到死全部还回去，宇宙在不断循环中保持着平衡\n\
  - 第四：但自从混乱阶段的人类文明诞生后，开始额外索取功名利禄，额外索取房子车子票子...为了生存的索取是索取，多余的都是欲望；欲望是被人为设计，随着人类欲望越来越大，索取也越来越多，所以出现了卖力的宣传要奉献，以保持平衡。谁索取的多就要奉献的多，现实是索取多的不想奉献多，就通过向社会过度宣传奉献，转移支付成本（包括孝顺），让普罗大众过度奉献提前透支来弥补他们缺失的那份\n\
  - 第五：如果奉献是天道还用宣传还用教？吃饭咋没人教没人宣传，拉屎咋没人教没人宣传：大家记得拉屎哦，千万不要忘记哦...但凡需要使劲宣传的一定背离真相，一定是需要牺牲接受宣传的那些人\n\
  - 第六：减少欲望，屏蔽卖力宣传，做个无用之用的人，对自己是最大的用\n\n#### 3.3 主人翁意识\n\n- 第一：主人翁意识的精髓是：这是我的！表面的意思是你要奉献，实则是索取\n\
  - 第二：比如你上大学。\n\n> 所有的失败都只是经历和经验，都在丰富我的人生，不管遇到什么事永远都有方式方法！\n\n#### 3.1 你躲不了，因为无处可躲\n\
  \n人该经历的苦难，一个都少不了，就看什么时间经历，早经历是福报，晚经历只能卧槽。\n\n- 第一：比如身体：年轻时经常生病，就会早早注重养生，早早学会自救，等老了还能跟老太太跳广场舞，那些老了天天轮椅天天帕金森的，年轻时生猛的很，还打拳击呢；\n\
  - 第二：比如感情：年轻时没被渣男渣过，中年无情又无趣，突然被其他男人温暖一下，哎呀，被感动的是家也不顾、银行卡密码都敢给对方公布。余生在悔恨中度过，渣不死你；\n\
  - 第三：比如事业：手里但凡有点钱一定会忍不住投资啊创业啊，年轻时没折腾这些，退休了闲的蛋疼就该接触乱七八糟的人了，套儿就在那、陷阱就在那，一辈子积蓄瞬间灰飞烟灭，爬不起来了，晚年凄凉。\n\
  - 第四：小时候经常被打被骂活金刚活阎罗一个，踩着地球望着太空，要是六十岁还没经历被骂，骂你一句你想不通当场眼儿屁：耶？你卷我？六十年都没人卷我，你敢卷我？\n\
  \n#### 3.2 一帆风顺不是祝福，是诅咒\n\n- **第一：**一路顺境你就废了，再也没有机会找到自我，无法看透人性，不能提高实力。\n- **第二：因为一个人的觉醒，1%靠别人提醒，99%靠千刀万剐。**\
  \ 剥皮、剜肉、抽筋、削骨，把你拥有的全部敲碎，血肉模糊，在痛苦怀疑崩溃绝望中重新长出崭新的自己；\n- **第三：比如家逢巨大变故、身患重病、身无长物人生低谷，没有大量地狱经历+深度思考能力，你醒不了**\
  \ 不要试图用过来人经验就能拯救别人，每个人都有自己的南墙要撞\n- **第四：困难算啥，是不是所有的困难都死了，就你还活着。** 困难的命运只有一个：被干掉！每次困难来的时候我都想笑，因为它脑门上写着呢：我会被干掉。正眼瞧他算我输\n\
  \n#### 3.3 我经历 我承担 我成长\n\n- **第一：我特烦别人喋喋不休的给我建议给我讲大道理，你的道我不想理，** 我要理清楚自己的道，这才叫道理由\n\
  - **第二：我的人生应该我做主、我承担、我感悟。** 我愿意承担因为我年轻，我没有经历或者没有听你的道理而造成的任何后果。**我愿意承担，这就是人生的乐趣，只管体验，不怕后果，我的人生需要一些后果来丰富**\n\
  - 第三：你吃过的饭拉出来的屎再有营养我也不想吃，饭得自己吃屎得自己拉。你说的对不对我不知道我只是单纯的不想听，而且你讲的道理是你认为的，同一件事我经历后领悟到的不一定跟你一样，也就是你的道理即使是真理对我不一定管用\n\
  - 第四：我不主动找你给我讲道理，我没有经历具体事情之前，给我讲再多屁用都没有。**我的世界得我主动自己来，自己体验，自己感悟。** **我想要的是体验后由内心往外生发出来，自己的想法自己的道理。**\
  \ 要么我主动找你，要么你以身示范引导，要么闭嘴\n\n#### 3.4 所有经历都是人生新陈代谢\n\n- **第一：都是经历和经验，没有失败没有问题没有困难，更不可能否定自己！**\
  \ 即使以前做了错事有过很幼稚的想法遇到过很垃圾的人，它们的存在才丰富了你，你所有的经历都只是人生的新陈代谢\n- **第二：身体细胞换了一批又一批，身体代谢；**\
  \ 不同阶段有不同的想法甚至每天的想法换了一批又一批，思想代谢；遇到的人换了一波又一波，人际关系在代谢，仅此而已\n- **第三：没一个人会说：这些死去的细胞真差劲，屎尿屁真恶心，我得否定他们……但是没他们你就死了。**\
  \ 老细胞的死去、每天的拉屎撒尿放屁都有了身体健康。\n- **第四：所以即使是屎一样的想法排出去代谢掉就行啦；** 即使犯过天大的错修正代谢掉就行啦；即使遇到屎一样的人断舍离代谢掉就行啦……**为了思想健康。谁想否定你，就把他代谢掉！**\n\
  \n#### 3.5 犯错 破！\n\n- 第一：整个苍生之局就是人为设计的，人为为伪，都是假的都是错的，你不犯错才是大错特错，人活着注定就是不断试错的过程\n\
  - 第二：普通人的人生大概是设计好的，文字+数字锁死你在底层，一个底层怎么做选择不都是错的，所以大胆犯错即可\n- 第三：是个人都会犯错。第一次当人没经验，人会犯的所有错误大概率你都会犯，小孩会犯的、员工会犯的、男人会犯的都跑不了，失败的首富和总统都数不过来，你算老几\n\
  - 第四：允许自己犯错，允许自己试错，犯错后如果对方没完没了：我就错了怎么了，你能怎么滴，我没事闲的故意犯个错玩呢怎么滴？\n- 第五：犯错后一般先承认错误再分析原因最后提出解决方案现在流行：改正可以但绝不认错，酷！\n\
  \n#### 3.6 遇到问题的应对方向\n\n- 第一：面对所有问题。快速处理现有问题，缩短内耗时间；就跟生病一样别拖，拖久了嘎崩一下也说不准。这个阶段要锻炼出解决问题的能力，遇到任何问题永远都有方式方法解决。\n\
  - 第二：无视部分问题。有时候不处理也是一种处理，交给时间。先从个别事情练起，就跟有些人跟你说话你可以选择性不回复一个意思\n- 第三：无视所有问题。无为，让心安定下来，意识到心本自具足，意识到这个世界上看到的一切，皆因起了心动了念，这个念投影到这个世界上的呈现出来的相。比如：你想造原子弹了才有了它，你想搞个花园就有了花花草草，你想结婚就有了家，你想吃什么东西才有了那顿饭。你那颗心可以造出万物。你不看花，花对你来说就不存在，无色无我无相，一切都是虚妄都是虚相。心中无念目中无人也是一种处理方法\n\
  \n### 4.性格 破！\n\n你的性格没有好坏，跟着愿意肯定你的人在一起，你的人生将没有上限，跟着天天打压否定你的人在一起你的人生将没有下限\n\n- 第一：敏感经过正向引导会变成洞察力，变成足智多谋，但经过负向定义就会变成多疑焦虑\n\
  - 第二：性格张扬经过正向引导会变成主动和自信，但经过负向定义就会变成浮躁和虚荣\n- 第三：性格板正经过正向引导会变成沉稳，被负向定义会变成固执死板\n- 第四：暴力冲动经过负向定义可能会变成杀人犯，但经过正向引导会变成战功赫赫的猛将。\n\
  \n负向定义会被打压成心理疾病引发精神内耗，积极正向引导会变成智慧；所以，亲近肯定，远离打压\n\n### 5.缺点 破！\n\n\n\n你根本没有缺点，不存在缺点，你有的只是特点。\n\
  \n再说一遍你就是最好的，自己要绝对肯定自己绝对喜欢自己\n\n- **第一：优先就是缺点，缺点就是优点。** 说你稳重也就是说你磨叽不果断，说你干练利索就是说容易急躁。\n\
  \n#### 找到愿意肯定你特点的地方，找到愿意肯定你特点的人。\n\n很多家长领导都喜欢很自私地从自己的角度去评判一个人的好坏，去定义别人，而真正的高手从来都是喜欢夸别人鼓励别人\n\
  \n- 第二：如果真有优缺点，你要爱护好自己的缺点，很多人正是因为所谓的缺点才成就了自己。最强大脑看过吧，很多天才小孩有某种缺陷，节目组带他们去治好后反而自己的天赋也消失了\n\
  - 第三：如果真有优缺点，这俩对立面的存在是为了让你是个人。因为只把你所有的优点单独摘出来，你就是神，只把你所有的缺点单独摘出来你就是恶魔就是垃圾就是屎。\n\n\
  #### 写自传的一般都是造神只写优点和传奇经历\n\n- 第四：如果真有优缺点，我绝不会花时间去改缺点，这辈子时间这么有限，把自己优点发挥到极致的时间都不够用，哪有时间改那玩意儿！\n\
  \n### 6.怕孤独 破！\n\n- 第一：孤独是天道，天地、花草树木、猫猫狗狗、婴幼儿、悟道级强者都是孤独的，你本自具足，你自己就是全世界，不需要鼓励不需要认可，你自己就是发动机，核动力发电机\n\
  - 第二：你的精神世界只有你自己，你绝对孤独\n- 第三：人人追求优秀，越优秀越孤独，其实你追求的是孤独\n- 第四：别跟别人一般见识的极致是，别跟人类一般见识。比如当你不接触人的时候情绪最稳定，你的情绪会随着不同的人而改变；有些人说话就是气人，就是看不起你，你的情绪当然会失控，要么抑郁焦虑要么暴躁；有些人就是愿意肯定你鼓励你，愿意高估你，你的情绪当然会高涨，会舒服会愉悦。也就是你的情绪不稳定完全是因为别人，不是你的错。所以，要么享受孤独，要么接触让自己舒服的人。\n\
  \n### 7.不合群 破！\n\n- 第一：如果你足够善良，请你独来独往；如果你想做自己，请你独来独往；如果你想有智慧，请你独来独往；如果你想幸福，请你独来独往\n\
  - 第二：合群的人要么是人性丑陋扭曲的恶毒小人。因为合在一起必然会排斥、拆台、嫉妒另外一些人和群体才聚在一起，一群变态精神病；要么没主意，是个累赘\n- 第三：合群的人一般都是弱者，合群必然降智，降智必然成为乌合之众。乌合之众必然都没有自我都是狗，强者要么不合群要么让别人主动来合自己。只有弱者才会拿人情世故那种糟粕来侮辱真正的强者，强者懂礼仪等人间大道，更懂价值是一切关系的核心，就是不懂人情世故\n\
  \n#### 7.1能处理好自己跟自己的关系，就能处理好其他关系\n\n- 第一：短短的一生，只需要学会跟一个人相处，那个人是自己；如果把注意力放在如何跟他人相处上，这破地球儿\
  \ 80 亿人呢，数都数不过来还处，处个毛啊\n- 第二：自己这么复杂这么多变这么脆弱，花一辈子时间都不一定相处好，哪还有时间学习跟其他人相处？分不清主次，闲的蛋疼\n\
  - 第三：跟人接触肯定会有矛盾，你有时候都生自己的气，时不时都看不惯自己，更何况别人\n- 第四：想情绪稳定平和的面对这个世界，首先要认可自己接受自己与自己和解。作为全世界独一无二的自己，你都不能接受，怎么可能接受这个独一无二的世界\n\
  - 第五：和解的能力得练，是拿自己练。不然你怎么感知到和解是什么感觉，还没跟自己和解就先跟别人共情，这不是瞎共吗？莫在别人心中修自己\n- 第六：跟自己相处时，五个照顾：照顾好自己的身体，照顾好自己的情绪，照顾好自己的特点，照顾好自己的直觉，照顾好自己的资产\n\
  \n### 8.被孤立 破！\n\n被孤立是好事\n\n- 第一：要不是迫不得已谁愿意跟人在一起，有条件恨不得主动把全世界都孤立，被孤立不就是省了你的事\n-\
  \ 第二：被孤立证明的是你优秀或者与众不同，越优秀越离群索居，合群的人得多平庸，这个世界最不缺的就是庸人\n- 第三：天地万物什么不是一意孤行，天是绝对孤独，一心一意做天，所以皇天在上；地是绝对孤独，一心一意做地，所以厚德载物。能做到一意，还敢孤行，得多酷\n\
  \n### 9.社恐 破！\n\n社恐挺好，合群的人才有病，为了合群跟傻狗一样演戏\n\n- 第一：社恐是自我防御机制，因为人的痛苦绝大部分来自于人际关系，**社恐=天赋**\n\
  - 第二：人本可以不需要朋友甚至不需要家人，孤独是常态是天道。**社恐=天道**\n- 第三：得道高人都隐居山林，最牛逼的人也是社恐？**如果是那也是故意社恐，社恐=幸福**\n\
  \n### 10.内疚 破！\n\n事情没办好经常内疚自责咋办？\n\n- 第一：办啥办，没办好就没办好，局面已经不好了，还内疚？再让自己更加难受，这账算的还不如幼儿园。专注解决它完事，哪那么多愁善感\n\
  - 第二：工作生活遇到点儿挫折那不是家常便饭的小事儿，遇到个小屁事就内疚，你让那些天天想着改变世界的人咋活？比如我天天想改变世界，到现在一直没实现，怎么着，我还得愧对全世界不成，我给全人类每个人磕一个？磕死自己算了这么脆弱。内疚不可能，自责不可能。\n\
  - 第三：自己只能决定付出，至于收获和结果，根本不是你能决定的事，既然不是自己的事，你还那么在意它，你内疚你自责你焦虑你抑郁你活该\n- 第四：内心的自我意志要很强势，任何负面情绪敢侵占我心试试，来多少杀多少，统统弄死\n\
  \n#### 做完事的正确姿势\n\n尽心尽力的做完一件事之后，我只做三个动作，雷打不动\n\n- 第一：做事尽心尽力了第一步肯定是肯定自己，甚至下了班犒劳自己\n\
  - 第二：做的不好的地方进行总结，并接受任何惩罚\n- 第三：下次遇到类似问题如何改进，提出解决方案\n\n除此之外，任何人想 PUA 我，都得被我反 PUA\n\
  \n### 11.心软 破！\n\n- 第一：你不狠就是软弱，软弱就是无能，精神内耗等心理问题就是内心软弱，情绪内耗属于思想斗争，思想斗争也是战争，战争是全世界最残酷的事你还软弱，跟负面情绪不是你死就是我活，你面前只有一条路，弄死他们\n\
  - 第二：自古以来：财发狠心人，情困心软者；无爱破情局，无情破全局。麻绳专挑细处断，厄运专挑善良人，善良的人心软，心软是精神内耗尤其是抑郁症的温床\n- 第三：天之道，损有余而补不足；人之道，损不足而奉有余。金钱流向不缺钱的人，资本逐利，缺钱的人怎么会有挣钱的能力，钱给你不就打水漂；爱都流向不缺爱的人，越有钱有势越漂亮越优秀越是众星捧月；苦都留给能吃苦的人，你要是能吃苦，就会有吃不完的苦；越心软，命里来的都是硬茬\n\
  \n### 12.敏感 破！\n\n我以前高度敏感多愁善感，极度在意别人的看法，想的可多。本来给我带来万般痛苦的性格反倒成就了我\n\n- 第一：越敏感越容易三省吾身，越容易领悟到我是一切的根源，能够不断**调整自我，每日精进日拱一卒久久为功**。\n\
  - 第二：越敏感越善于察言观色，越容易站在对方角度考虑问题，也就越容易共情。共情能力修炼到极致：**能与天地万物共情，天人合一**。反思能力修炼到极致自我创造力将登峰造极，可以自造世界。\n\
  - 第三：越敏感越善良，善良的人是被迫成熟，一切人间冷暖逼的你善于表演善于伪装，没有真情绪没有真情感，伪装能力修炼到极致，别人看不出你已经不是人只是像人，相对人而言你已经升维至神\n\
  - 第四：越高度敏感多愁善感，前期看是困难是屎，后期一旦突破枷锁，共情、反思、伪装三合一，就是馈赠是天赋，无与伦比的天赋\n\n#### 敏感、多疑、在意别人的看法\n\
  \n- 第一：根本原因本质原因就是不爱自己。不爱自己是万病之源，但事实是所有人都只爱自己。爱别人也是因为自己舒坦，那还是爱自己\n- 第二：只是你自己以为别人会很在意。其实别人根本不\
  \ care。你这边痛苦，那边去蹦迪了\n- 第三：少部分人要真在意你就断舍离，别怕得罪人。哪怕你把认识的所有人都得罪完屁事也没有。你认识几万人够多了吧，人类八十亿，国内都14亿多，你认识的连零头都没，忽略不计。重新开始都行，重新找个地方重新认识一帮人，哪怕这辈子就是故意得罪人玩，你也没能力得罪多少人，够你玩几万辈子的\n\
  \n### 14.自卑 破！\n\n只有人类会自卑，除了花草树木猫猫狗狗婴幼儿悟道级强者，都不会自卑，被驯化成的人类是最低等的生物；你不是人类，你在人类之上，总有些人是人类教不了的。那人为什么不能是你！\n\
  \n#### 14.1 自卑是对自己最大的背叛\n\n自卑是对自己最大的背叛，只有自卑，才会看不上自己，慢慢也就失去真正的自己，这不就是苍生之局设计的初衷？自卑就是世界的顶层设计，不自信就会他信，他信就是个坑是个陷阱，都自信了谁还愿意被驯化成狗？\n\
  \n##### 一旦自卑，造成的心理阴影，需要花光一辈子的力气去克服\n\n- 第一：自卑是拿自己缺点跟别人优点相比。比习惯了，就忘了自己还有优点。自己干自己，成了缺点的狗\n\
  - 第二：越自卑越敏感，越敏感越容易激发自我保护机制。也就越容易失控变得有戾气，成了脾气的狗\n- 第三：越自卑越攀比。见到比你有钱的、比你地位高的、比你学习好的等等攀比成性，忘了初心，成了欲望的狗\n\
  - 第四：越自卑越在意别人的眼光评价。生怕做错事，开始变的唯唯诺诺磨磨叽叽，执行力低下，而只有执行力才能让你拿到结果，失去了执行力就失去了人生主动权。成了失败的狗\n\
  - 第五：越自卑越容易掩饰。为了掩饰自己的不足而说的多做的多，那肯定错的越多，越容易招致失败，反而更加凸显本想掩饰的自卑，成了虚伪的狗\n- 第六：越自卑越容易迷失自我。迷信权威迷信比你强的人，成为乌合之众，成为待宰羔羊，成了别人的狗\n\
  \n#### 14.2 没什么也不能没自信\n\n自信跟外在无关，即使一无所有，哪怕无脑自信也得自信，没什么也不能没自信\n\n- **第一：你的出生就是为了改变世界。**\
  \ 你从刚出生世界就多了一个不同的哭声，你改变了世界；你拉了泡屎，世界因你多了一泡屎，你改变了世界\n- **第二：自卑会放大自己的缺点，自信会弱化自己的不足。**\
  \ 比如你胖比如你矮比如你脸上有胎记有疤痕等等，跟正常人相比，如果你能自信，不仅会弱化别人认为的不足，反而还会让你更有魅力。\n- **第三：自信才会不轻易否定自己，才会不在意别人的评价，才会不容易发生精神内耗。**\
  \ 因为真正的自信，在自己内心有一套让自己舒服且自动屏蔽外界的自我评价体系\n- 第四：整个地球都在你脚下，地球上的事算个屁，有一个踩一个，有多少踩多少。\n\n\
  **我遇到的一切都是我筛选的结果：** 我找工作是我在面试面试官，我做你的员工是给你脸，我跟你结婚是你上辈子积德，我能活着是这个世界的缘分，我要死了是给阎王面子\n\
  \n##### 在自己能管控的范围内，你何止自信，就差上天了\n\n- 第一：再垃圾的人只要说到自己做过的牛逼的事，马上自信到啥牛逼都敢吹；小时候打架厉害，他能吹牛吹一辈子，靠这个自信一辈子\n\
  - 第二：你是部门领导在内部讲话牛逼哄哄的样子宛若神明，你是一家之主在家里讲话那态势宛若神明，你是老师在课堂上讲话宛若神明，给你个星球你就是这颗星球的神，给你个宇宙你就是宇宙的神，你就是自信本身\n\
  \n你已经很厉害了：自己学会走路、自己学会吃饭、自己学会上厕所、自己上学、自己找工作、自己创业、自己离婚找律师、自己生孩子、自己带孩子...\n\n你能活到今天就已经很厉害了，你是真的很厉害\n\
  \n### 15.叛逆 破！\n\n在我的星球上，会优先培养叛逆、特立独行、有个性的人，成立叛逆班。顺人性做人，逆着人性做事。顺成人，逆成仙，玄妙就在颠倒间。是因为混乱阶段人为创造的人道跟原始阶段的天道正好相反，天道尚左，人道尚右，所以：\n\
  \n**叛逆才正常，叛逆是天道**\n\n- 第一：人类世界就是一场设计好的苍生之局，设计好的假相，如果不叛逆全都顺从假相，人类哪还有未来，一群傻子哄一帮傻子这样的生物不完蛋？**创造出叛逆这个词，并打压此现象，是为了社会稳定有序**\n\
  - 第二：一代更比一代强的本质就是叛逆。就是下一代永远不听上一代的话，天天听老子的话你不可能超越他。你家里要出个极度叛逆的孩子一定是为了拯救你的家族\n- 第三：人类生存环境越来越恶劣，更需要叛逆！\n\
  \n### 16.讨好 破！\n\n我自己已经活的很不爽，为什么还要假惺惺笑脸迎合别人？让别人爽让自己更不爽？还要美其名曰：礼貌、素质、情商，要是这样作践自己是美德，作践越狠越美，干脆把自己弄死，这样情商最高\n\
  \n- 第一：讨好型人格是我对别人好，别人应该对我好，但是如果没有像他对别人一样好，他会很失望；\n- 第二：讨好型人格的内心软弱，自己看不起自己，被人欺负是常态，被欺负了不敢反抗更是常态，最后只能自己闷着内耗\n\
  - 第三：讨好别人等于乞讨，你一个要饭的，有啥尊严，最容易伤害你的就是你经常讨好的人，在别人的眼里只会觉得你是条向他摇尾乞怜的狗\n- 第四：人与人之间绝对平等，都得死，而且都是相互成就，没有谁比谁低一等，比如大家看小镇舍长的内容，说明能被你用是你给我脸，是你在证明我有用，我们是绝对平等\n\
  - 第五：讨好是人为设计的情绪陷阱，人类文明糟粕。**天地、花草树木、猫猫狗狗、婴幼儿、悟道级强者都不会讨好别人**\n- 第六：只有平等相处、只有只做自己、提升自我价值，是唯一能得到尊重的方式。没有实力没有价值，对别人的好，别人都以为是讨好，哪怕你是真心，也会被人呸\n\
  \n### 17.攀比 嫉妒 破！\n\n- 第一：攀比心是万恶之源，是欲望的化身，是变成狗的开始。因为总有比你好的，此念一起，看不到头儿。你遇到的问题也就永无止境，面临的前途也是无底深渊。你人性的恶也会变得深不可测\n\
  - 第二：天地、花草树木、猫猫狗狗、婴幼儿、悟道级强者会攀比吗？会嫉妒吗？这是苍生之局的顶层设计，是陷阱，是坑，是为了拿捏你，为了社会稳定有序，为了让你痛苦而搭建的核心概念\n\
  - 第三：你嫉妒别人，实际上是你认可他，你就会把能量给他，他就会越来越强，你越来越嫉妒，直到你死\n- 第四：人的能量是有限的，应该多关注自己，甚至嫉妒自己。嫉妒自己就是认可自己，力量才会回到自身。尤其是当我一无所有时，没人嫉妒我，那我就自己嫉妒自己。嫉妒死自己，我这么嫉妒自己，你嫉妒不？\n\
  \n### 18.算命 破！\n\n#### 改变命运\n\n念起即察，念是能量，控制起心动念或无念，任何人包括宇宙觉察不到，就可以改变命运\n\n- 第一：修行到一定程度的人，命运算不出来，他们如如不动，命运怎么着那是命运的事，关我屁事。运是面对剧本时的心态，能控制心态的人，运变；命是剧本，一般人改不了，但是不起念，宇宙就不会觉察到能量波动，它怎么拿捏你？命变。\n\
  - 第二：别说命运，在日常生活中你的想法被他人捕捉到，你就会很容易被牵着鼻子走。被人牵着鼻子走、被欲望牵着鼻子走、被文字信息牵着鼻子走。你那点心思别人都能猜到，你的命运都是确定的\n\
  - 第三：你再有钱有权，首富牛逼吧，能找到最厉害的大师，能帮你算的很准，能帮你挡一些业力，但这种治标不治本的向外求，只是延迟了命运的交付时间而已，他们的命运还是那样，该出事还是出事，该进去还是进去\n\
  - 第四：控制起心动念或无念就是向内求。只有向内求才能真正改变自己的能量，无念就是无住，应无所住而生其心。大脑里住的都是人造的人类思维，生出的是一颗带众生相的凡心。但你的真我、你的心你的灵魂在人类思维之上，没有住人类思维，生出的是清净心、平等心、平常心，是无，是空\n\
  \n#### 信命不算命\n\n- 第一：除了专业研究玄学的人群和组织，建议普通人别跟怪力乱神类较真儿，你讨论不出个所以然。如果极少数的人能看到，你无法证明给别人看，也就是你看不见也可以说看见\n\
  - 第二：可以信命，但不算命。人类是活在语言文字下的生物，算命也是文字；文字就会跟你发生纠缠，算的命好还挺开心；一旦算出来的是不好的，你就会纠缠进心里去；最终是自己证明了它实现了它；也就是不管算的准不准，人性大都会被那种力量牵着自己与它奔赴。**好比生活中你觉得谁有问题，就会努力证明他有问题。**\n\
  - 第三：如果命运早就是确定的了，你算它干嘛？如果命运是不确定的，就更没必要算了。无常是天道，生命是无常的，也是这个无常；才让单调的生活有了点缀。请你学会接受无常、享受无常、变成无常\n\
  \n### 19.思虑过多 破！\n\n#### 思虑过多的本质是注意力被掠夺\n\n注意力被掠夺的原因是大脑为主体的肉体被文字编程；也就是大脑只要不动少动，精神内耗就会消失和减少；天天搬砖的没几个精神内耗的\n\
  \n- 第一：每天必须保持足够的时间让大脑闲下来，停下手中的工作\n- 第二：认识到所有的思绪和顾虑都是假相，都是设置好的局，别跳\n- 第三：学会转念和断舍离。当念头过多时听听音乐、看看电影、运动一下\n\
  - 第四：生命是有限的，不要无限追求财富，不要无限追求知识；最寸土寸金的是生命，你从来都不可能拥有任何东西；你只有体验的权利；要用生命体验生命；而不是用生命去工作，工作只是生命的副业\n\
  - 第五：把注意力集中到当下行动和行动带来的感受上。让行动和感受统一，即：活在当下。比如吃饭就是吃饭，好好享受吃饭，吃饭是多么美好的一件事。食物入口的一瞬间，全是多巴胺，浑身带来能量；喝水就是喝水，跟着水走，他到了嘴里到了喉咙到了身体的血管，这都是能量\n\
  - 第六：不专注当下的人，思虑越多越弱智：即没享受到当下，也对不起过去和当下，更让未来充满不好的变数\n\n- 第三：别人的想法随时可能在变。你不是他你压根儿感知不到，神经病才会去在意一个你完全不能随时了解的人\n\
  - 第四：向内求，只关注自己。因为自己的想法自己随时都知道，你能掌控，不管身体还是心理，发现问题就能及时去面对去解决问题\n- 第五：真正牛逼的人极少，整个地球都极少。就凭你这一辈子认识几千人的能力，根本遇不到。你遇到的大概率都是乌合之众，都是被驯化的狗。这帮鸟人的建议不要听，评价不要听，批评更不要听。谁也定义不了你！你也定义不了你！宇宙只管生和死这两个瞬间，生死之间你说了算！\n\
  \n### 21.抱怨 破！\n\n怨恨是最大的无形杀手，是精神自虐。必须学会跟自己内心的怨恨和解\n\n#### 抱怨带来的坏处：\n\n- 第一：生病，生大病。怨恨的时候你的细胞会扭曲，功能不稳导致湿寒之气增多，时间久了就开始长东西，到皮肤就是脂肪瘤，到关节就是骨刺，到甲状腺就是结节，再严重点就是肿瘤\n\
  - 第二：变丑。因细胞扭曲，多了会影响面目，面目也会扭曲，相由心生就是这个逻辑。你走在大街上各种面孔的人都有，谁是怨妇一眼就能看出来。\n- 第三：老得快。没见过哪个牢骚满天飞的人活得久的\n\
  - 第四：不仅害自己还伤害别人，尤其是家人。\n\n\n\n一个人天天抱怨，整个家都不得安宁，家和万事兴，坏掉的就是怨恨之气。\n\n##### 第五：事业没好儿。\n\
  \n越哭丧个脸、皱个眉，或目露凶光，人越来越倒霉，看着就倒霉，好运、好人、好事慢慢地离你而去，越活越糟糕。\n\n#### 用别人的错来惩罚自己就是抱怨\n\n\
  - 第一：抱怨属于用别人的错来惩罚自己！被怨恨的那个人没有痛苦。因为怨恨的时候是你在发力，发力越大越痛苦。总是活在幻想中，自以为别人伤害了你。哪有那么多想害你的人，真正想害你的人极少。出了门大胆走，没人揍你没人砍你。\n\
  - 第二：远离烂人烂事。人生的不幸都来自于接触了烂人。发生了烂事，产生了怨恨，然后越来越烂的人和事就缠上了你。你会越来越烂。\n- 第三：要向内求，我是一切的根源，一切皆有利于我。我的眼里没有敌人，只有朋友；我的心里只有家人，没有缺点。你想想自己是不是一大堆毛病，但你跟别人相处，是不是全世界都在忍受你的毛病？别人跟你接触之后，是不是有很多人不在意？是不是很多人越混越好？\n\
  - 第四：要抱怨只能抱怨自己。从自己身上找问题——想就通了，从别人身上找问题——想就疯了。\n\n### 22. 执着，破！\n\n#### 22.1 以拿起来的心态放下，以放下的心态拿起来\n\
  \n- 第一：别动不动就劝人放下，都没拿起来过咋放下？没扛过麻袋，不知道那么重，他怎么知道放下？比如男人最致命的不是钱就是女人。智者要是没下过爱河，怎么提出不入爱河？没碰过异性，一个漂亮女人就可以让再大的大师犯错，装逼谁不会？马云没有见过大钱，怎么可能说出：我对钱没有兴趣…只要人民币数量够，就可以让你犯错，放屁谁不会？\n\
  - **第二：以拿起来的心态放下，以放下的心态拿起来**。一件事一直放不下，一直纠结，现在直接把它拿起来，就干他，管它呢，干了再说，拿起来了就是放下；或者想做一件事的时候，直接放下，不是为了成功，只是为了体验，甚至就是为了失败，体验失败，比如我允许面试的时候不成功，允许演讲的不好，我允许自己失败，上班就是为了离职，活着就是为了死，咋滴？\n\
  \n#### 22.2 什么都不要执着，六个建议\n\n- 第一：普通人怎么做选择都是错的，怎么选择都是操蛋一样的人生，大胆选择即可。\n- 第二：这个世界上没有人真正在意你，别人爱你都有条件，爱你也只是爱你取得的结果，不要在意别人。\n\
  - 第三：你一辈子也就认识几千人，对于世界，即使只是一个城市，也完全忽略不计，每天死亡几十万人，也就是你花一辈子认识的人可以30分钟内死完。你可以得罪别人，可以享受孤独。\n\
  - 第四：你所有的认知都是偏见，只要说出来就不完美；即使开悟也只是高于人类偏见的偏见，这个世界唯一的真理是没有真理，对你个人来说能解决问题就是真理。\n- 第五：你就用这个身体活几十年，连这个身体都执着不了，更何况通过这个身体获得的功名利禄房子车子啥的。\n\
  - 第六：宇宙被科学证实的才 3.8%，也就是你了解的一切片面到只占真实世界的 3.8%，小零头，也就是你执着的大概率都是假的，96.2%的概率都是假的，你可能都是假的，执着个屁啊。\n\
  \n#### 22.3 活着就是不断放手的过程\n\n人活着就是放手的过程，不是执着是放下，回头看你所有的执着都不过是一场笑话，一场空。\n\n- 第一：比如你生的孩子就是越来越远离你的过程。出生就要剪掉脐带，肉体上放手；上幼儿园视线上放手；上高中生活上放手；工作后依赖上放手；结婚后情感上放手；最后你死亡彻底放手。你要是放不下，最开始别剪脐带啊。\n\
  - 第二：比如长大就是不断放手阶段性最爱的过程。小学会把之前最爱的棒棒糖放手，可当时你以为棒棒糖就是天；初中会把之前最爱的玩具放手，可当时你以为玩具就是天；大学毕业会把之前最心爱的人放手，当时爱得死去活来没对方不行对方就是你的天；最后天塌了吗？\n\
  - 第三：再比如修行就是不断放手外在的过程。尤其是有钱人为什么出家的多，放弃了外在的功名利禄放弃了一切。\n\n人生哪有可执着的东西，还执着车子房子，执着一段感情，执着一段童年，执着一份工作？\n\
  \n所有外在的东西都会离你而去，连你的身体也会离你而去，你牛逼你执着，你有本事别死啊？\n\n#### 22.4 执着的是结果，但结果只是瞬间，过程才几乎是人生的全部\n\
  \n- 第一：你一辈子也就活了那么几个瞬间；别人在意你，只是在意你的某个瞬间；别人伤害你，也是在某个瞬间。\n- 第二：瞬间毕业了，瞬间孩子会打酱油了，瞬间就老了，人生也就那么几个瞬间值得回味；他乡遇故知，久旱逢甘霖，洞房花烛夜，金榜题名时。\n\
  - 第三：生命也好，工作也好，恋爱也罢，不都是体验整个过程？他说分手也就一句话，费那么大劲恋爱的过程，被一句话就结果了；太执着结果，对过程就会失去兴趣，人生也就无趣。\n\
  - 第四：结果怎么样那是结果的事，你管不了就不是自己的事，不是自己的事你执着个啥，神经病。\n"
- "# 第三部分 地主思维（精简版）\n\n营销大于公司的一切行为，没有之一，这是生意的绝对本质。营销是为了让尽可能多的人知道自己的生意，知道后尽可能多的实现线下来访，来访了之后再做最终的销售转化。如果项目现场的客户来访量是平时的\
  \ 100 倍甚至 1000 倍以上，整个城市所有组织和单位挨个组团来到你的卖场，你还担心生意不好？\n\n《地主商业思维》 适用人群：供职业经理人和创业者参考\n\
  \n提示：本思维首次公开发布，以往是作为企业内训课，很多行业都可以尝试用地主思维重新做一遍\n\n### 1. 思维简介\n\n#### 1.1 名字释义\n\n\
  地主思维，顾名思义，你有很多的地才是地主，这里的地指场地，以场地运作为核心的商业思维\n\n#### 1.2 思维起源\n\n本思维萌芽于 2014 年，正式形成于\
  \ 2016 年，期间经过 3 年市场验证，先后在 17 座城市，34 个落地项目实操，合作商家近 2 万家，举办流量活动 8 万余场，形成了近 600 万的线下流量。后来又经过\
  \ 3 年的升级实践，地主思维从 1.0 版本升级到了 2.0 版本，再到最后的 3.0 版本，于 2020 年小镇舍长选择归隐，地主思维暂时画上了句号\n\n\
  #### 1.3 地主思维常见服务行业\n\n本思维最初只赋能房地产行业，做集团营销管理体系搭建或老大难项目攻关\n\n后来延伸至：\n\n- 亲子领域\n-\
  \ 教育领域\n- 老年领域\n- 文旅领域\n- 商场、农庄等生活消费领域\n- 健身房、台球厅、酒吧等娱乐消费领域\n\n#### 1.4 地主思维解决的社会问题\n\
  \n本思维主要解决的社会问题是：场地资源过剩造成的严重浪费，也是社会浪费成本最多的地方；其自身的营销问题越来越棘手，客户越来越少；\n\n地主思维则是通过把闲置的场地或者处于闲置期间的场地统一运营起来，免费共享出去，以解决各自的营销痛点，实现海量的客户到访；\n\
  \n即：闲置浪费的被利用起来，同时低成本解决了棘手问题。\n\n与其在外面找客户，超过正常管理成本的管理外面业务团队，不如利用自家场地，让业务团队只专注一件事：把外面的客户海量的圈到项目现场\n\
  \n地主思维使用起来，门槛低，效果快，可复制\n\n### 2. 当下的部分经济问题\n\n- 第一：企业运营的成本越来越高\n- 第二：企业场地等资源浪费越来越严重\n\
  - 第三：传统营销手段效果越来越差\n- 第四：员工创造力不强，工作氛围越来越压抑\n- 第五：企业员工和客户的福利业态单调，消费欲望不足\n\n#### 2.1\
  \ 运营需要绝对细节，创新需要投员工所好\n\n中国大部分企业的运营很粗糙，包括所谓的世界五百强：把重点都放在如何压榨员工、如何传销式的给消费者洗脑掏钱上，经济上行时五百强，经济下行时开始爆雷。运营管理特别粗放，内部严重浪费，成本高企，员工幸\n\
  \n相反，考虑的则是如何适当控制利润控制规模的问题了。在地主思维眼里没有无效客户！\n\n- 第一：来到现场的客户今天不买不代表以后不买，来的次数多了就会容易冲动消费，哪怕是买房都属于冲动型消费，更别说你所属的其他行业，这就是流量的价值\n\
  - 第二：自己不买不代表身边的亲朋好友不买，经常来你家，下意识会优先推荐你的产品\n- 第三：每个人都是一个渠道，撕开了这个口子，就可以进入下一个圈层和无数个圈层，因为每个人背后都有无数个社会关系，每个关系背后都是各种组织和单位。地主思维专吃各种资源\n\
  - 第四：每个来访的客户都可发展成编外业务员，如果这个城市的大部分都在为你卖东西，这才是真正的全民营销\n- 第五：只要伺候好来访的客户，增加他们的体验感，每个人就成了项目的免费口碑传播工具，行走的大喇叭\n\
  - 第六：来访的客户可以增加现场销售氛围，提高现场真实用户转化率\n\n针对以上六点，要做好每一项的专属攻略，不然漫天的富贵来了你也接不住\n\n#### 3.3\
  \ 大客户思维\n\n- 第一：光有流量思维还不够，客户质量得上去，如果有些卖场天天来的都是农民工兄弟，来的客户质量不高、购买力不强，跟生意不匹配，到访就会成为压力；不仅不会促进销售，可能还会影响销售，所以大客户思维就是在流量思维的基础上，提升客户质量\n\
  - 第二：要把能接触到的每个人当成渠道，每个人背后都有所在的组织或企业，那他就是你的大客户，通过他撕开这条渠道的口子，把客户大批量搞到现场，搞到现场的每个人都是一个渠道，然后再撕开无数个渠道的口子。\n\
  - 第三：发传单、户外广告、拍摄视频等目前是最常见的营销宣传媒介手段，但客户触达率一般很低。比如发传单平均一个人一天300张，真正会咨询的不超过10个，留下联系方式的不超过5个，形成到访的概率不超过1个；发传单不是目的，到访才是目的。那为什么不直接调整所有的营销动作就是围绕到访？只是发传单，你要做不到定人定岗定位的监督，单页直接给你卖到废品站或者扔垃圾桶了都，毫无意义\n\
  - 第四：哪些群体消费能力强呢？企事业单位，尤其是待遇不错的单位，或者中高端小区的业主群体的组织。比如金融单位、政府机构、教育系统、国企单位、科技公司、中高端小区的物业、广场舞大妈等\n\
  - 第五：针对消费级别高、人数多的组织或单位，可以定向团购，并拟定团购协议，是大客户专属福利\n\n#### 3.4 软植入\n\n- 第一：想要实现软植入最简单粗暴的方式就是活动，以活动的形式可以吸引大量的群体，参加活动的群体防备心较低，只需要在活动过程中植入项目信息产品信息即可。比如现场能看到的听到的想到的都是跟你产品相关，比如活动过程中设置抽奖等互动环节，互动的问题都是项目产品信息，比如设置的活动流程动线图，就是产品的展示线路。比如活动过程中留出\
  \ 3-5 分钟做简单的产品宣讲。总之，客户来到现场了，就会感受到你的产品信息，在过程中有专业手段筛选出意向客户即可\n- 第二：活动又分为被动型和主动型，统称为圈层活动。被动型圈层活动指场地需求方主动举办的活动，比如少儿机构会举办六一儿童节，银行系统会举办内部运动会，医美行业会举办线下动员大会等等，都需要场地或者奖品福利等，都可以引流到项目现场，这些都属于被动型活动，我们要做的是配合。主动型圈层活动指的是根据时代和人性，或者根据场地需求方的特性，主动设置主题活动。比如搞第一届城市广场舞大赛，比如搞金融系统内部联谊会，比如搞城市少儿画画比赛，比如项目现场根据自身实际情况，专门预留出固定空间做固定项目：**图书馆、瑜伽馆、轮滑赛道、会议室、联欢会广场、烧烤露台等等**，可以针对固定单位形成邀约，制作邀约门票等等私人订制方式体现出尊贵感。再或者我自身条件单一有限，比如我是健身房，那就聚焦健身一事，制作排期表，邀约周边的企事业单位，在固定的时间段，可以让员工和客户来现场免费健身，现场有专业老师免费指导。\n\
  \n买房折扣，开发商还经常举办大型娱乐活动马戏团、冰雕展等等之类的，都可以把票给旅行社一部分；\n\n旅行社一定会给你免费旅游的机会；\n\n跟酒吧合作，酒吧就会提供免费无限畅饮的卡座；跟台球厅合作，台球厅就会提供免费打台球的金卡；跟健身房合作，健身房就会提供免费健身游泳的机会...\n\
  \n这些名额就可以作为员工福利、员工激励发给内部员工\n\n- 第四：资源整合思维不稀奇，多赢的一个好事，大部分的联盟社群命都很短，但是运营需要的是有内容，这个内容就是地主思维。提高各自资源使用效率、降低成本，尤其是可以实现可持续发展；因为平时拓展客户都是一次性行为，每天都得为新增客户发愁；如果整个城市大部分企事业单位都成了自己的异业联盟，那他们内部的员工和客户，也就是这个城市的中高端群体的主流群体，吃透了这部分客源，生意不愁，要做的只用维护这些B端群体，是点对面，不再是点对点。没业绩压力时只需要用地主思维的1.0版本就够用，经济形势不好、业绩压力增大时，可以把地主思维2.0版本和3.0版本同时用起来，每个联盟企业的卖场也是你的卖场，你组织的任何一场线下活动，异业联盟内部企业都可以来现场软宣传，但多少带点免费福利提供给来参加活动的人群。降低各自营销成本，整合各自场地、员工、客户等资源利用最大化，这才是组织正向内循环\n\
  \n#### 3.5 投员工所好\n\n- 第一：只有做自己喜欢的事，才有最高战斗力，士气都不用激发，每个员工都有内驱力、创造力，他自己干的开心，这么简单的一个道理，鲜有公司考虑到，更别说执行。既能让员工开心，还能降低公司管理成本，更能提高作业效率，如此一举多得的好事，地主思维就能做到\n\
  - 第二：拓展场地提供方时或者拓展场地需求时，按照员工的爱好制作拓客地图。爱好被满足，人脉圈层次提高，业绩还能完成，能力还能提高，是成长性的工作，这样的好事哪个员工不乐意？比如你喜欢泡吧，那就把所有酒吧都发展成公司的异业联盟，每天上班除了来公司报个到和下班时来公司作总结，其他时间相当于就在酒吧上班，把公司以场地为主的免费资源给到酒吧，或者搞一些针对酒吧员工以及会员客户的专题福利活动，酒吧老板会把你当朋友，酒吧就是你的家。比如你喜欢钓鱼，那就天天跟钓鱼协会、钓鱼的人群、钓鱼的地方在一起，用地主思维把城市所有爱好钓鱼的全部拓掉，给钓鱼协会举办专题钓鱼大赛、内部福利等活动，不就弄点水买点鱼，花不了多少钱。比如你喜欢美女，那就组织相亲大会，整合门当户对的企事业单位，把活动举办到项目现场合适的场地上。比如把国企的女员工介绍给公检法的男公务员，到时候公安局你都能随便进出，解决警察的单身问题你可是功臣。比如你喜欢宠物，那就把城市所有猫舍狗舍整合，把喜欢养猫养狗的家庭整合，举办宠物交流会、选美大赛、宠物相亲会等\n\
  - 第三：公司要做的就是制定地主思维的专业培训体系、考核体系、监督体系、成果验收体系，除了现场的一亩三分地，整个天下都是你的，都是你公司的，都是你员工的\n\n\
  #### 3.6 供给侧改革\n\n这么多闲置的场地，加在一起浪费的可是天文数字，这是一个严重的社会事件，浪费一粒粮食都可耻；分摊到每个经营者身上也基本都是最大的支出之一。\n\
  \n地主思维让浪费的场地变废为宝，利国利民，功德无量\n\n#### 3.7 大代理模式\n\n- 第一：传统的代理都是找第三方专业代理公司/渠道公司给现场带客户，传统代理模式也叫小代理模式。大代理模式指的是，能接触到的任何人都可以成为公司的代理，称为全民代理人，目标是让整个城市尽可能多的人都成为自己的代理合伙人\n\
  - 第二：首先把合作的联盟企业内部员工或客户发展成自己的推销员，推销的不只是产品，而是以推销地主思维为主。因为你自己直接推销产品都很生硬，更何况间接发展的代理人；我们是来谈战略合作，是来送免费的重要福利；如果你是打工的，如果能给公司带来免费的各种资源，这是露脸的机会，帮助了公司，或者你可以把这样的免费提供场地的机会介绍给自己的亲朋好友，在亲朋好友面前露脸，帮助了朋友；如果你是老板，你自己的公司想要发展的更好，我的地主思维能帮你，甚至也可以把地主思维这套体系跟合作单位共享并帮其搭建，如果你的竞争对手提前和我们合作可能对自己不利，体验一下未尝不可\n\
  - 第三：让自己内部员工，在任何时间、任何场合把这个概念深入骨髓，哪怕打个车也得把司机拓了，哪怕吃顿饭也得把饭店员工和老板拓了，把拓展场地需求方也就是圈层资源端，变成公司基因、公司文化，把地主思维变成公司制度。公司内部的一个员工就是一个策划公司，策划活动，源源不断的给你现场带来流量的活动策划公司\n\
  - 第四：针对内部员工以及全民代理人，分别设立奖罚机制。\n  - 排名、活跃度、发现金奖励并拍摄成宣传资料在项目现场以及员工群、全民代理人群公示\n\n###\
  \ 4. 地主思维版本+行业+案例解析\n\n#### 4.1 地主思维 1.0 版本——圈进来\n\n- 知己：自身能免费共享的场地资源列表以及功能划分\n\
  - 知彼：所有组织和企业，针对自己的员工和客户，都会定期或不定期的举办各种活动，根据他们的需求提供对应的场地，让他们把活动举办到项目现场，或者根据场地或者行业特性的娱乐性主题活动，邀请所有企事业单位和组织来参加\n\
  \n##### 4.1.1 房地产行业+案例分析\n\n面临问题\n\n- 问题一：场地资源过剩，闲置浪费严重；比如装修豪华的售楼部、功能丰富的会所、空旷错落有致的园林、位置绝佳的商铺等\n\
  - 问题二：营销越来越拉胯。不靠第三方的渠道公司或者短视频类工具自己卖不动，还经常策划费用很高的活动和组建渠道团队实现线下流量到访，费效比太高，白扔钱；员工幸福指数低，流失率极高\n\
  \n1.0版本的应用\n\n- 第一：制作场地使用手册（场地照片、面积、适合举办活动类型）\n- 第二：制作城市圈层客户地图（按行业和区域划分、竞拍）\n- 第三：组建专属业务团队\n\
  - 第四：地主思维的理论培训和落地实操培训\n- 第五：建立员工爱好档案\n- 第六：建立团队考核机制（四维度考核）\n- 第七：圈层活动申请流程（时间、场地、活动单位、人数、活动名称、其他支持、执行人、审批人）\n\
  - 第八：圈层活动排表（负责人、单位、人数、活动类型、进度）\n- 第九：圈层活动对接流程（物业、策划、销售、派出所等）\n- 第十：圈层活动执行（动线、登记、宣讲、意向客户筛选、互动、深耕）\n\
  \n如果你的项目现场有 10 个可以免费共享的场地，每个场地平均容纳 50 人，每天圈满就有 500 个线下到访，少则 200-300 个左右的到访，每个月新增\
  \ 5000 左右的到访；如果你是文旅项目，场地足够大，每个场地容纳 100-200 人，每天成千上万人到访也正常，每个月新增几万到访\n\n仅仅广场舞大妈这个群体吃透，业绩就会有巨大提升：广场舞大妈是每个小区的入场券，每个大妈背后都有一些公司、亲戚朋友、自己孩子在各大相关企业担任要职很正常，尤其是中高端小区和退休干部小区的广场舞大妈，质量不是一般高。\n\
  \n这个群体很活跃很容易形成传播效应，且小恩小惠就足以帮我们使大劲。\n\n比如组织第一届城市广场舞大赛，有评委有奖品，奖品邀请异业联盟商家参与并提供，你免费就把城市的所有小区搞定，现场人气、客户质量、异业联盟社群维护都能兼顾到，甚至把项目单独出一个区域设置成广场舞专项场地，每天都有人来，大晚上售楼部不打烊不怕没人气\n\
  \n\n\n如果开发商在节假日主动举办主题活动，要把这些主题活动做成VIP邀约，做成百姓度假游玩的选择项目之一，当成异业联盟的福利，挨家挨户给这些企业送邀请函，并统计预计来访人数，做好应对预案。\n\
  \n##### 4.1.2 健身房行业+案例解析\n\n###### 面临问题\n\n- 问题一：只有在周五晚上到周日客户才会多，其他时间没什么人，尤其是白天，相当于一多半的时间都在闲置；场地闲置、人员闲置、设备闲置。\n\
  - 问题二：在闲置的时间房租还得交、工资还得算、设备折旧还得承担。\n- 问题三：还经常花钱雇人在大街上拉人来店里免费体验，钱花了，但拉到的人质量一般。\n\n\
  ###### 1.0 版本的应用\n\n- 第一：把以前的宣传单页换成健身金卡邀请函，单页没有尊贵感，容易浪费，而且要采取预约制。\n- 第二：把场地在闲置的时间免费共享出去，并按照免费时间段进行划分。\n\
  - 第三：把健身房周边的企事业单位拉到现场免费畅玩一个小时到两个小时，名额有限、时间有限，可以把这个机会给到优秀员工，也可以给到VIP客户，这是福利。\n\n\
  比如，早上开会换到健身房，别老是单调地在办公室训话，让员工早起运动，还是在公司提供的福利健身房里运动，你看看你的员工战斗力会不会增强。\n\n比如，跟客户谈业务，直接预约健身房的免费时间段，请人吃饭不如请人出汗。\n\
  \n- 第四：如果健身房的人每天都排满，每个人出汗了都会买饮料，饮料消费会是以往的几十倍；来的人免费体验时间到了，总会有一定比例还想继续玩，那就得缴费；来的人多了，老会员续卡的概率会增加，办新卡的也会增加；健身房老板还可以跟周边企事业单位的负责人变成朋友……都是好处。\n\
  \n##### 4.1.3 高等教育行业+案例解析\n\n###### 面临问题\n\n- 问题一：高校的场地很多且利用率很低，室内场地室外场地都有，很多时间都是闲置的。\n\
  \n比如多媒体教室、大型会议室、操场、运动场、绿地广场等等。\n\n- 问题二：除了少数名校，绝大多数学校都要主动推销自己的学校专业特色、学生特色、老师特色，以增加校园招聘、学生社会实践、学生就业、老师项目实践等。\n\
  \n###### 1.0 版本的应用\n\n- 第一：按上面地产行业的模型组建个小型团队。\n- 第二：拓展城市内企事业单位或民间团体。\n- 第三：把场地免费共享给他们，但必须预约。\n\
  - 第四：比如企事业单位需要场地培训，可以来我校，但是我相关专业的学生可以旁听，这种实战理论比学校的纯理论教学有用多了。\n\n比如，企业有实习的机会，第一时间要给到我校名额。\n\
  \n比如，企业搞的大型活动可以让学生不出校门就长见识、见世界，大疆无人机试飞、起飞坪可以选择校园绿草地等等。\n\n比如，城市里的机关等各系统要举办运动会，可以来学校举办，以后学校的人脉更广，争取资源或者突发事件处理都会对我校有利等等。\n\
  \n- 第四：你的员工在移动销售点，要做好物料、展示、互动环节设计。喜欢健身的员工就负责拓展健身房，喜欢热闹的就拓展商场，喜欢孩子的就拓展亲子机构，喜欢老人的就拓展广场舞大妈等等。\n\
  \n#### 4.3 地主思维 3.0 版本—增场地\n\n- 第一：在自身项目现场条件允许的情况下，增加主题场地，吸引到现场才是重点。\n- 第二：根据自身行业和产品特性，设计目标客群的专属爱好场地，比如画画、读书、轮滑、露营等等；或者根据自身场地大小多少，设计社会组织经常举办的活动，比如party、会议、晚会、麻将等等。\n\
  - 第三：增加可以提高利润的场地。比如现场已经有了免费引流的场地项目，再额外增加客单价利润率高的单品项目，旅游景区就可以做亲子类的研学基地、国学基地等等。\n\n\
  ### 5. 通过地主思维可以获得什么？\n\n#### 5.1 企业可以获得\n\n- 第一：海量客户到访。\n- 第二：企业级合作伙伴。\n- 第三：快速在本地扎根。\n\
  - 第四：降低营销成本。\n- 第五：增加收入来源。\n- 第六：员工流失率降低。\n\n#### 5.2 员工可以获得\n\n- 第一：实现个人能力快速增长。\n\
  - 第二：实现个人人脉快速增长。\n- 第三：从而创新能力增强。\n- 第四：幸福指数增高。\n\n#### 5.3 社会可以获得\n\n- 第一：百姓减少硬性广告植入。\n\
  - 第二：变相获得社会的各种免费福利。\n- 第三：资源有效利用。\n- 第四：企业经营、百姓消费等社会活力增强。\n\n### 6. 创业方向启示\n\n####\
  \ 6.1 流量公司\n\n- 第一：作为第三方，用地主思维给实体企业带来线下流量，按人头/按场次/转化效果收费。传统的流量公司全是糊弄，革他们的命，比如活动公司、策划公司等。\n\
  - 第二：可以从一个城市的专业领域做起，比如亲子领域，先做到这个领域的top水平，所有的亲子机构资源都在你手里，哪些地方需要亲子的线下流量就展开合作，比如商场、旅游景区等。\n\
  - 第三：做大之后可以以城市为单位，深耕资源为主，把资源倒流给整个城市需要流量的机构；也可以专注细分领域，攻城拔寨，向其他城市扩张。\n- 第四：还可以跟需要流量的机构形成深度合作，比如共同出资打造更多收费的体验项目。以免费场地的免费项目为饵，到了之后一定会产生一定比例的新项目消费。新项目的位置、线下的动线设计和项目的选择很重要。\n\
  - 第五：结合手机互联网，做短视频，把自己打造成线上流量+线下流量的IP。\n\n#### 6.2 实体营销革新\n\n- 第一：自己是实体企业经营者，比如上面提到的地产、亲子教育、大学教育、文化旅游、商场、农庄、健身房、台球厅、酒吧等企业。\n\
  - 第二：根据自身项目的位置、行业特性、自我场地情况，选择性使用地主思维的1.0版本、2.0版本或3.0版本，也可以两两组合，有条件的三个版本都可以使用。\n\n\
  #### 6.3 某细分领域线上地主平台\n\n- 第一：专注在某一领域，做成该领域最大的线上地主平台。\n- 第二：比如整合全国所有的地产商，把永久闲置的场地资源或有闲置时间的场地资源全部整合到自己手里。比如售楼部、停车场、示范园区、样板间、商业街、工业园区、创业园区等等，利用互联网思维，建成全国最大的地产场地免费共享平台。链接场地提供方和场地需求方，任何企事业单位都得办活动，不办活动，我们自己也可以主动策划一些主题活动邀请对方来参加，做好场地的排期和对接工作。\n\
  - 第三：再比如整合全国所有的健身房，成立全国最大的免费健身房平台；整合全国所有的台球厅，成立全国最大的免费台球厅平台；整合全国所有的大学，成立全国最大的校企合作平台等等等等。\n\
  - 第四：盈利模式、推广模式可参考其他互联网平台，但运营模式必须要有内容，应用已经是互联网过去式，以后是内容时代，结合短视频，每天拍摄或者直播免费福利大放送。\n\
  \n#### 6.4 综合性线上地主平台\n\n集合所有细分领域，把所有闲置的场地资源整合在一起，做全国最大的线上地主平台，吃不了全国，深扎区域也可以，哪怕搞定一个城市，把整个城市有闲置场地的资源一方和所有企事业单位也就是场地需求一方，都整合并运营起来，财富当量也不会小。\n\
  \n### 7. 地主思维注意事项\n\n- 第一：业务团队的管理与考核，地主思维有专属的考核和管理标准。\n- 第二：各行业标准的建立。地主思维赋能的每一个行业，虽核心本质相同，但执行细节均有不同，因为每个行业都有自己的属性和目标客户群体，比如学校讲究老师和学生的安全，台球厅、健身房讲究自身的器材耗损，旅游景区的注意规则等等。\n\
  - 第三：跟踪回访。把客户引流到现场对地主思维来说轻而易举，但引流的目的是为了转化，现场意向客户的抓取、潜在用户、渠道开发、全民营销发展。\n- 第四：资源数据库。所有连接到的个人和企业，都按照行业分类建立数据库，并记录互动档案库，最后形成大数据，并定向互动，增加互动率。\n\
  - 第五：现场服务。车辆、吃喝拉撒、服务人员的态度、话术等等问题。\n- 第六：要有内容去做维护。需要定期或不定期地询问对方近期的内部活动情况，定期不定期地举办合作单位专属主题活动。地主思维重在运营。\n\
  - 第七：转化。一切的目的就是为了销售，现场再热闹，流量再多，没有转化等于零，整个体系会崩，人员会泄气。必须做好意向客户的挖掘和转化体系。\n- 第八：防止意外情况。引流量较大，难免会出现安全隐患，需要提前做好应对预案以及协议内的内容补充。\n"
