  ### 5. 能量 频率 振动 波


  地球绕着太阳转是能量、频率、振动、波，万物生长死亡是能量、频率、振动、波；老子佛陀在人间持续影响几千年是能量、频率、振动、波；自然生态、元素、科技、生意、人性、管理都是能量、频率、振动、波；


  你的念头、思绪、健康、财富皆是能量。


  #### 5.1 宇宙不会放弃任何东西


  因为能量守恒，所以宇宙不放弃任何东西。


  “生是宇宙的人，死是宇宙的鬼”；好比人死了，肉体不增不减，出生时无数个宇宙微粒组成了你的肉体，死后你的肉体又重新变成无数个微粒回到宇宙；


  再好比人死了，灵魂不生不灭，出生时灵魂以超光速来到你的体内，死亡时灵魂以超光速回到宇宙，有过无数次濒死体验的一定知道这种感觉：**灵魂出窍。**


  因为能量守恒，所以索取就必须得奉献，索取多就得奉献多。


  但后来混乱阶段的人类世界，顶层设计是穷人再多都是最稀缺的富人资产，爱流向不缺爱的人，钱流向不缺钱的人。


  这些索取太多的垄断阶级知道能量守恒，但又不愿意奉献那么多，就人为创造了很多概念，在书本上、在媒体上，在大街小巷上，让低频的容易被欺负的普通大众奉献来弥补自己没有奉献出去的那部分。


  比如海洋污染、空气污染主要是上层等级人群造成的，却让普通百姓承担骂名及清理工作……


  #### 5.2 相互关系


  宇宙内所有东西的本质就是能量、振动、频率、波。看不见的声音、光、电、信号、文字语言等等，看得见的山河湖海、日月星辰、花草树木、科技发展、你我他等等，本质都是能量、振动、频率、波。


  能量是万物的本体，振动才能产生能量，有频率才能振动，只有波才能产生频率，即能量、振动、频率、波是一回事。


  频率低，会变成看得见的，就是实体，包括手机车子房子还有你我他。


  现代物理学研究所有实体包括人体的分子结构，研究到现在发现最小粒子已不再是实体，是弦上的振动，是波。


  好比乐器不再是乐器，而是音乐的律动；手机不再是手机，是无线电信号；你不再是你，你是无，无你。


  只是频率低，变成了肉眼看得到的而已。“其大无外，其小无内；凡所有相皆是虚妄；色不异空，空不异色；缘起性空；无我，道生一一生二二生三三生万物，道就是无，无生了有，就是太极，太极生两仪，两仪生四象，四象生八卦”……


  频率高的，会变成看不见的，包括手机信号、电、还有人的灵魂。


  频率越高振动越快能量越大，比如老子佛陀他们仙逝已2000多年，但他们的精神能量从未消失，是地球上现存最强大的精神能量之一。


  频率高的会带动和影响频率低的，好比你接触负能量的你就成了情绪垃圾桶自然能量减少，接触强者你的能量就会提升；


  接触花草树木猫猫狗狗这些有灵性的也会提高能量。


  好比频率高的声音会盖过频率低的，频率高的水波会带动频率低的水波。


  我们的精神就是松果体发出的一种波。


  频率低时能量就低，低到一定程度就会焦虑抑郁等内耗，抑郁自杀的人就是精神能量没了，同理，人的身体能量没了也会死亡。


  反之，频率越高越容易觉醒开悟，越容易摆脱各种烦恼，包括身体烦恼和精神烦恼。做生意搞政治都是通过频率调整方向，一个新闻看大家的情绪频率反馈，作为大数据采样，悟道级的企业家政治家是稳赢的。


  原始阶段的人未开智，松果体不活跃，跟所有生物一样频率是低的，不存在觉醒；到了开智后的混乱阶段，松果体被开发，人类可以觉醒变得很厉害但也很危险。


  只要能抑制松果体，比如低频药物疫苗、比如低频音乐、比如低频思想、比如问题食物，都会破坏你的原有频率，造成精神频率或身体环境的不和谐，从而变得低频，导致你的身体或精神会出问题。控制能影响你眼耳鼻舌身意的行业即可，比如医疗、媒体、食品、娱乐等等。


  再比如音乐，古代有乐经，繁体字加上草字头就是药，音乐是治病的，基本以432赫兹为主，能让体内五脏六腑频率一致达到和谐。


  现在的主流音乐都被改成了440赫兹，它会让你保持低频状态。


  > 损耗自身能量的事不做，话不说、人不交、地不去。


  > 高手从来不会磨损自己，就像水一样，会沿着最小阻力前行，见山便绕，遇坑则填，道法自然，不卑不亢。


  只有思想家和极少数有独立思想的悟道级企业家或政治家才会流芳百世。被权力和金钱迷失本心的企业家、政治家是绝大多数，遗臭万年的也是他们。


