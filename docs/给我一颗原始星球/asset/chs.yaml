  - **第八：接广告、中视频计划、星图等。**\n\n###### 2.4.7.5 避坑\n\n- **第一：别背词。** 大部分博主都是对着文案念，只是练习得很自然，磨出了自己的网感。背词的效率极低，用剪映即可。\n\
