- pgno: 187
  md: '一定偏差，因此投资者加入滑点模式可以更好地模拟真实市场的表现。


    投资者使用固定滑点时，投资者下单的数量并不会影响最后的成交价格，只需要指定一个价差。当投资者下达一个买单指令时，成交的价格等于当时（执行 order 函数所在的单位时间）的平均价格加上价差的一半；当投资者下达一个卖出指令时，卖出的价格等于当时的平均价格减去价差的一半。价差可以设定为一个固定值，也可以按照百分比设定。


    固定值，是指这个价差可以是一个固定的值（比如 0.02 元，交易时加减 0.01 元），设定方式为 FixedSlippage（0.02）。


    百分比，是指这个价差可以是当时价格的一个百分比（比如 0.2%，交易时加减当时价格的 0.1%），设定方式为 PriceRelatedSlippage（0.002）。


    设置滑点函数的实例代码如下：


    ```

    # 设置滑点为固定值

    set_slippage(FixedSlippage(0.02))

    # 设置滑点为百分比

    set_slippage(PriceRelatedSlippage(0.002))

    ```


    提醒：如果没有调用 set_slippage 函数，系统默认的滑点是 PriceRelatedSlippage（0.00246）。


