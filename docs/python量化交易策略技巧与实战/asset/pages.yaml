    例如，在实现图像识别时，只要先把许多不同的图像样板和对应的识别结果输入人工神经网络，网络就会通过自学习功能，慢慢学会识别类似的图像。


    自学习功能对预测有特别重要的意义。预期未来的人工神经网络计算机将为人类提供经济预测、市场预测、效益预测，其应用前景是很美好的。


    # 2）具有联想存储功能


    利用人工神经网络的反馈网络可以实现这种联想存储功能。


    # 3）具有高速寻找优化解的能力


    寻找一个复杂问题的优化解，往往需要很大的计算量，而利用一个针对某个问题设计的反馈型人工神经网络，发挥计算机的高速运算能力，可能很快就能找到优化解。


