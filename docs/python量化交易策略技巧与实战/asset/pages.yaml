- pgno: 67
  md: '# 3.1 初识 Python


    Python 是一个有条理的、强大的面向对象的程序设计语言。虽然运行速度比不上传说中的速度之王——C 语言，也比不上 Java、C++。但完成同一个任务，C
    语言可能要写 1000 行代码，Java 可能要写 100 行代码，而 Python 可能只要写 20 行代码。


    # 3.1.1 Python 的发展历程


    Python 的创始人为 Guido van Rossum。1989 年圣诞节期间，在阿姆斯特丹 Guido 为了打发圣诞节的无趣，决心开发一个新的脚本解释程序作为
    ABC 语言的一种继承。Guido 之所以选中 Python（大蟒蛇）作为该编程语言的名字，是因为他是一个叫 Monty Python 的喜剧团体的爱好者。


    ABC 语言是由 Guido 参加设计的一种教学语言。在 Guido 本人看来，ABC 语言非常优美和强大，是专门为非专业程序员设计的。但是 ABC 语言并没有成功，究其原因，Guido
    认为是非开放造成的。Guido 下决心在 Python 中避免这一错误。同时，他还想实现在 ABC 语言中闪现过但未曾实现的东西。


    就这样，Python 在 Guido 手中诞生了。可以说，Python 是从 ABC 语言发展起来的，主要受到了 Modula-3 语言（另一种相当优美且强大的语言，为小型团体所设计的）的影响，并且结合了
    UNIX Shell 语言和 C 语言的习惯。


    Python 已经成为非常受欢迎的程序设计语言之一。2011 年 1 月，它被 TIOBE 编程语言排行榜评为 2010 年度语言。自从 2004 年以后，Python
    语言的使用率呈线性增长。


    由于 Python 的简洁性、易读性以及可扩展性，在国外将 Python 作为科学计算的研究机构日益增多，一些知名大学已经采用 Python 来教授程序设计课程。例如，卡耐基梅隆大学的编程基础、麻省理工学院的计算机科学及编程导论，都使用
    Python 讲授。众多开源的科学计算软件包都提供了 Python 的调用接口，例如著名的计算机视觉库 OpenCV、三维可视化库 VTK、医学图像处理库
    ITK。而 Python 专用的科学计算扩展库就更多了，其中 3 个十分经典的科学计算扩展库为 NumPy，SciPy 和 Matplotlib，它们分别为
    Python 提供了快速数组处理、数值运算及绘图功能。因此 Python 及其众多的扩展库所构成的开发环境十分适合工程技术、科研人员处理实验数据、制作图表，甚至开发科学计算应用程序。


    # 3.1.2 Python 的特点


    Python 具有 10 项明显的特点，具体如下。


    +   (1) 易于学习: Python 有相对较少的关键字，结构简单；有一个明确定义的语法，学习起来更加简单。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '+   (2) 易于阅读：Python 代码定义得更清晰。


    +   (3) 易于维护：Python 的成功在于它的源代码相当容易维护。


    +   (4) 一个广泛的标准库：Python 的优势之一是其具有丰富的库，在 UNIX、Windows 和 OS X 系统中的兼容性很好。


    +   (5) 互动模式：互动模式的支持，可以从终端输入执行代码并获得结果的语言，可以互动地测试和调试代码片段。


    +   (6) 可移植：基于其开放源代码的特性，Python 语言已经被移植（也就是使其工作）到许多平台。


    +   (7) 可扩展：如果需要一段运行很快的关键代码，或者是想要编写一些不愿开放的算法，可以使用 C 语言或 C++语言完成该部分程序，然后从 Python
    程序中调用。


