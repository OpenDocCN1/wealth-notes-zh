- pgno: 229
  md: '# 9.1 量化选股概述


    量化选股是利用数量化的方法选择股票组合，并期望该股票组合能够获得超越基准收益率的投资行为。总的来说量化选股可分两类，分别是基本面选股和技术面选股。


    但在实际股票投资中，往往是利用基本面选出要操作的股票，并将其放入自选股中；然后根据技术面来确定交易的时机，即根据技术判断来确定何时买入、何时加仓、何时减仓、何时全部卖出。


    基本面选股，又称财务因子选股。基本面选股可以进一步分为成长类因子选股、规模类因子选股、价值类因子选股和质量类因子选股，如图 9.1 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_229_0.png)


    图 9.1 基本面选股


    # 9.2 成长类因子选股技巧


    在 Python 量化选股中，成长类因子有 7 种，分别是营业收入同比增长率、营业收入环比增长率、净利润同比增长率、净利润环比增长率、营业利润率、销售净利率和销售毛利率。


    # 9.2.1 营业收入同比增长率选股技巧


    营业收入，是指在一定时期内，企业销售商品或提供劳务所获得的货币收入。例如，商业企业的商品销售收入，生产加工企业的产品销售收入，饮食业的饮食品销售收入，服务业的服务收入，仓储企业的仓储收入，运输企业的运费收入、代办运输收入，等等。营业收入的计算公式如下：


    营业收入=主营业务收入+其他业务收入，或营业收入=产品销售量（或服务量）×产品单价（或服务单价）。


    主副产品（或不同等级产品）的销售收入应全部计入营业收入；企业所提供的不同类型服务收入也应计入营业收入。


    营业收入同比增长率，是指企业在一定期间内取得的营业收入与其上年同期营业收入相比'
  merge: -1
  img_proc: true
- pgno: 230
  md: '所增长的百分比，可以反映企业在此期间内营业收入的增长或下降等情况。营业收入同比增长率计算公式如下：


    营业收入同比增长率=（当期营业收入-上期营业收入）÷上期营业收入×100%


    当期营业收入按使用者的需要可以是月度、季度或年度；也可以是会计年度起始日至会计报表截止日，如 2017 年 1 月 1 日至 2017 年 9 月 30 日等；另外，还可以是分析者采用的年化数据，如
    2017 年 10 月 1 日至 2018 年 9 月 30 日。


    上期营业收入，是指与当期营业收入相对应的上一个年度此期间的营业收入。


    营业收入同比增长率越大，说明企业的当期营业收入相对去年同期营业收入增长得越多，对企业盈利有正面影响；而营业收入同比增长率为负时，则表明企业的当期营业收入出现下降，应引起企业管理者或投资者的注意。


    营业收入同比增长率的历史趋势，可以反映企业的营业收入在不同的会计期间所发生的增长变化情况，对其进行连续观察有助于后期的预测。


    提醒：由于很多企业处于不同的行业，其业务的经营带有很强的季节性，因此，简单按月度或季度去比较营业收入并不客观，而营业收入同比增长率有效地剔除了这种季节性比较明显的企业按月度或按季度对比所带来的偏颇，使企业营业收入的分析具有一定的客观性。


    # 营业收入同比增长率选股实例


    成功登录 JoinQuant 聚宽量化交易平台后，单击导航栏中的“策略研究”→“环境研究”命令，打开研究环境页面。单击“新建”→“文件夹”命令，即可新建一个文件夹，然后将其命名为“量化选股”。


    再单击“新建”→“Python 3”命令，新建一个 Python 3 文件，并将其命名为“营业收入同比增长率选股”，然后输入如下代码：


    ```

    import pandas as pd

    dataframel = get_fundamentals(.query(indicator).filter(indicator.inc_revenue_year_on_year
    > 800), date=''2018-08-01'')

    dataframe1

    ```


    首先导入 pandas 包，并设置别名为 pd，然后调用 get_fundamentals()函数获取财务指标数据，返回值为 dataframe。indicator
    为财务指标数据表名；查询条件为营业收入同比增长率大于 800，即 indicator.inc_revenue_year_on_year > 800；查询时间为
    2018 年 8 月 1 日。


