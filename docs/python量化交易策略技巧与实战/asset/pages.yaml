    # 11.5 MACD 指标量化交易策略的风险指标


    风险指标有利于投资者对量化交易策略进行客观的评价。需要注意的是，无论是回测还是模拟，所有风险指标都只会根据每天收盘后的收益进行计算，每天更新一次，并不考虑每天盘中的实际收益情况。


    # 11.5.1 Alpha（阿尔法）


    投资面临着系统性风险（即 Beta）和非系统性风险（即 Alpha），Alpha 是投资者获得的与市场波动无关的回报。比如投资者获得了 15% 的回报，其基准获得了
    10% 的回报，那么 Alpha 或者价值增值的一部分就是 5%。


    Alpha 的计算公式如下：


    ```

    Alpha = α = R_p − [ R_f + β_p ( R_m − R_f ) ]

    ```


    各参数意义如下：


    R_p 表示策略年化收益率；


    R_m 表示基准年化收益率；


    R_f 表示无风险利率（默认值 0.04）；


    β_p 表示策略 Beta 值。


    在 “回测详情” 页面中，单击左侧列表框中的 “Alpha” 选项，即可看到 MACD 指标量化交易'
