  md: '# 6.1.2 Numpy 的矩阵对象


    矩阵（Matrix）是一个按照长方形阵列排列的复数或实数集合，是高等代数中的常见工具，也常见于统计分析等应用数学学科。


    Numpy 的矩阵对象与数组对象相似，主要的不同之处在于，矩阵对象的计算遵循矩阵数学运算规律，即矩阵的乘、转置、求逆等。需要注意的是，矩阵使用 matrix
    函数创建。


    成功登录 JoinQuant 聚宽量化交易平台后，单击导航栏中的“策略研究”→“研究环境”命令，打开研究环境页面。然后单击“新建”→“Python 3”命令，即可新建一个
    Python 3 文件，并将其命名为“Numpy 的矩阵”。


    在单元格中输入代码如下：


    ```

    import numpy as np

    numpy1=np.matrix([[2,6,8],[14,19,22]])

    print("矩阵数据内容: ")

    print(numpy1)

    numpy2 = numpy1.T          #矩阵的转置

    print("矩阵的转置后的数据内容: ")

    print(numpy2)

    print("矩阵的乘法: ")

    print(numpy1*numpy2)

