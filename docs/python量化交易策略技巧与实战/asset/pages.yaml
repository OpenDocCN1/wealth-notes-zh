  md: '# 2.6 量化交易策略的风险控制技巧


    风险控制，是指投资者采取各种措施和方法，消灭或减少风险事件发生的各种可能，或者减少风险事件发生时造成的损失。


    # 2.6.1 止盈、止损指标


    单击“风险控制”标签，并开启“风险控制”，如图 2.33 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_52_0.png)


    图 2.33 开启“风险控制”


    关于止盈、止损指标及意义如下。


    个股止损：当个股亏损超过止损线时，则清仓止损。


    个股止盈：当个股盈利超过止盈线时，则清仓止盈。


    持仓价值止损：当量化交易策略持仓价值总亏损超过设定的止损线时，则清仓止损。


    持仓价值止盈：当量化交易策略持仓价值总盈利超过设定的止盈线时，则清仓止盈。


    策略最大亏损：当量化交易策略总亏损超过设定的止损线时，则策略清仓止损并停止交易。


    策略最大盈利：当量化交易策略总盈利超过设定的止盈线时，则策略清仓止盈并停止交易。


    大盘信号止损：大盘信号止损有两种方法，分别是根据均线止损和根据跌幅止损。根据均线止损，是指当大盘 N 日均线与昨日收盘价构成“死叉”时，清仓止损。根据跌幅止损，是指当大盘
    N 日内跌幅超过止损线时，清仓止损。


    在这里设置“策略最大亏损”为 5%，“策略最大盈利”为 20%，如图 2.34 所示。'
