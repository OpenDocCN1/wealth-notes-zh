- pgno: 323
  md: "# 13.1 因子的类型及因子分析的作用\n\n因子在量化交易中可以分两类，分别是量化选股因子（好股票的标准）和量化择时因子（好股票买卖的标准）。量化选股因子大多为财务指数，如营业利润率、销售净利率、营业收入环比增长率等；量化择时因子大多为技术指标，如均线、换手率、波动率等。\n\
    \nJoinQuant 聚宽量化交易平台提供了因子分析功能，以便投资者测试自己的量化因子，相比之前只能在回测模块中一个一个地测试每个指标来说，因子分析功能规避了回测的噪音、复杂的资产配置和交易系统所产生的导致指标失真的问题。\n\
    \n# 13.2 因子分析的 Python 代码\n\n在量化交易中，要实现因子分析功能，需要自定义因子的类，继承 Factor 类，并实现 calc 方法，代码如下：\n\
    \n```\nclass MA10(Factor):\n    name = 'ma10'\n    max_window = 10\n    dependencies\
    \ = ['close']\n    def calc(self, data):\n        return data['close'][-10:].mean()\n\
    ```\n\n# 13.2.1 因子分析中的三个变量\n\n在自定义类中，有 3 个变量，分别是 name、max_window、dependencies。\n\
    \n+   1) name\nname 是因子的名称。在给因子命名时，必须符合 Python 中变量的命名规则，即名称只能由字母、数字和下划线组成，并且第一个字符不能是数字，另外不能与\
    \ Python 中的关键字相同，也不能与基础因子冲突。\n\n+   2) max_window\nmax_window 是用来获取数据的最长时间窗口，需要注意的是，其返回的是日线级别的数据。\n\
    \n+   3) dependencies\ndependencies 是用来设置依赖的基础因子名称。"
