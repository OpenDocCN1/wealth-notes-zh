    # 6.2.2 二维数组 DataFrame


    DataFrame 是一个表格型的数据结构，它含有 一组有序的列，每一列的数据结构都是相同的，而不同列之间则可以是不同的数据结构（数值、字符、布尔值等）。以数据库进行类比，DataFrame
    中的每一行是一个记录，是名称为 Index 的一个元素；而每一列则为一个字段，是这个记录的一个属性。DataFrame 既有行索引也有列索引，可以被看作由
    Series 组成的字典（共用同一个索引）。


    # 1) 创建 DataFrame


