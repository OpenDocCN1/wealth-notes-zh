- pgno: 86
  md: '![](img/e6d4c365781f4dd8cb814bd56923b0bc_86_0.png)


    图 3.36 数值类型


    有时候，我们需要对数值类型进行转换。数据类型转换只需要将数值类型作为函数名即可，具体如下。


    +   int(x): 将 x 转换为一个整数。

    float(x): 将 x 转换到一个浮点数。

    complex(x): 将 x 转换到一个复数，实数部分为 x，虚数部分为 0。

    complex(x,y): 将 x 和 y 转换到一个复数，实数部分为 x，虚数部分为 y。


    # 3.5.2 字符串


