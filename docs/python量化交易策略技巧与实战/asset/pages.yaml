  md: '交量比例等，因此，会用到设置函数。下面来具体讲解各种设置函数。


    # 7.2.1 设置基准函数


    设置基准函数的语法格式如下：


    ```

    set_benchmark(security)

    ```


    默认情况下，选定沪深 300 指数的每日价格作为判断股票量化交易策略好坏和一系列风险值计算的基准。当然也可以使用 set_benchmark 指定其他股票、指数、ETF
    的价格为基准。需要注意的是，这个函数只能在初始化函数中调用。


    参数 security，是指股票、指数或 ETF 的代码。设置基准函数的返回值为 None。


    例如，将 50ETF 基金指数（510050）设定为基准，其代码如下：


    ```

    set_benchmark("510050.XSHG")

    ```


    再如，深证成指（399001）设定为基准，其代码如下：


    ```

    set_benchmark("399001.XSHG")

    ```


    还可以设置具体某一只股票，如将招商银行（600036）设定为基准，其代码如下：


    ```

    set_benchmark("600036.XSHG")

    ```


    # 7.2.2 设置佣金/印花税函数


    设置佣金/印花税函数的语法格式如下：


    ```

    set_order_cost(cost, type, ref=None)

    ```


    设置佣金/印花税函数，用来设定每笔交易收取的手续费，系统会根据用户指定的费率计算每笔交易的手续费。该函数有 3 项参数，各项参数意义如下。


    参数 cost 是 OrderCost 对象，各项子参数意义如下：


    +   open_tax，买入时印花税（只有股票类标的收取，基金与期货不收）；

    close_tax，卖出时印花税（只有股票类标的收取，基金与期货不收）；

    open_commission，买入时佣金，申购场外基金的手续费；

    close_commission，卖出时佣金，赎回场外基金的手续费；

    close_today_commission，平今仓佣金；

    min_commission，最低佣金，不包含印花税。


    参数 type，是指股票（stock）、基金（fund）、金融期货（index_futures）、期货（futures）、债券基金(bond_fund)、股票基金(stock_fund)、QDII
    基金(QDII_fund)、货币基金(money_market_fund)、'
  merge: -1
  img_proc: true
