- pgno: 85
  md: '# 2）浮点型


    浮点型由整数部分与小数部分组成，浮点型也可以使用科学计数法表示(2.5E+02 = 2.5×10² = 250)。


    # 3）复数


    复数由实数部分和虚数部分构成，可以用 a + bj 或者 complex（a, b）表示，复数的实部 a 和虚部 b 都是浮点型。


    Python 的数值类型如表 3.1 所示。


    # 表 3.1 Python 的数值类型


    | 整 型 | 浮 点 型 | 复 数 |

    |---|---|---|

    | 150 | 0.8 | 3.14j |

    | -200 | -21.8 | -25j |

    | 0o60 | 2.5E+2 | 3+4j |

    | -0o80 | 2.8E-5 | 9.322e-36j |

    | 0x69 | -5E+3 | 3e+26j |

    | -0x260 | -8E-9 | -0.6545+0j |


    下面来举例说明一下数值类型。单击“开始”菜单按钮，打开 Python 3.7.1 Shell 窗口，然后单击菜单栏中的“File”→“New File”命令，创建一个
    Python 文件，并将其命名为“Python3-2.py”，然后输入如下代码：


    ```

    x1 = -30        # 整型变量

    x2 = 21.0        # 浮点型变量

    x3 = 4-8j        # 复数变量

    x4 = 0xA0F       # 十六进制

    x5 = 0o34        # 八进制

    x6 = 2.9E+7      # 浮点型使用科学计数法表示

    print(x1)        # 显示变量的值

    print(x2)

    print(x3)

    print(x4)

    print(x5)

    print(x6)

    ```


    单击菜单栏中的“Run”→“Run Module”或按键盘上的“F5”键，即可运行程序代码，结果如图 3.36 所示。'
