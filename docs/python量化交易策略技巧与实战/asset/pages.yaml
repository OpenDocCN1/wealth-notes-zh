  md: '![](img/e6d4c365781f4dd8cb814bd56923b0bc_293_0.png)


    # 11.5.5  Information Ratio（信息比率）


    Information Ratio 用来衡量单位超额风险带来的超额收益。信息比率越大，说明该策略单位跟踪误差所获得的超额收益越高，因此，信息比率较大的策略的表现优于信息比率较低的基准。合理的投资目标应该是在承担适度风险下，尽可能追求高信息比率。


    Information Ratio 的计算公式如下：


    Information Ratio = (R_p - R_m) / σ_t


    各参数意义如下：

    R_p 表示策略年化收益率；

    R_m 表示基准年化收益率；

    σ_t 表示策略与基准每日收益差值的年化标准差。


    在 “回测详情” 页面中，单击左侧列表框中的 “Information Ratio” 选项，即可看到 MACD 指标量化交易策略的 “Information
    Ratio” 信息，如图 11.21 所示。'
