  md: "# 4.1 Python 的选择结构\n\n选择结构是一种程序化设计的基本结构，它用于解决这样一类问题：可以根据不同的条件选择不同的操作。对选择条件进行判断只有两种结果：“条件成立”或“条件不成立”。在程序设计中，通常用“真”表示条件成立，即用“True”表示；用“假”表示条件不成立，即用“False”表示；并称“真”和“假”为逻辑值。\n\
    \n# 4.1.1 关系运算\n\n关系运算用于对两个量进行比较。Python 提供 6 个关系运算符，关系运算符及意义如表 4.1 所示。\n\n# 表\
    \ 4.1 关系运算符及意义\n\n| 关系运算符 | 意义 |\n|---|---|\n| == | 等于，比较对象是否相等 |\n| != | 不等于，比较两个对象是否不相等\
    \ |\n| > | 大于，返回 x 是否大于 y |\n| < | 小于，返回 x 是否小于 y。所有比较运算符返回 1 表示真，返回 0 表示假。这分别与特殊的变量\
    \ True 和 False 等价。注意，这些变量名的大写 |\n| >= | 大于等于，返回 x 是否大于等于 y |\n| <= | 小于等于，返回 x\
    \ 是否小于等于 y |\n\n单击“开始”菜单按钮，打开“Python 3.7.1 Shell”窗口，然后单击菜单栏中的“File”→“New File”命令，创建一个\
    \ Python 文件，并将其命名为“Python4-1.py”，然后输入如下代码：\n\n```\na = 18\nb = 6\nif ( a == b\
