  md: '图 12.18 中左边的箭头模拟神经元的输入信号，右边的箭头模拟神经元的输出信号。神经元主要做了两部分的工作：首先对输入信号进行综合，其次对综合后的信号进行处理，并得到输出信号。


    信号综合常用的方法是 Sunderland 输入信号进行加权求和；信号处理常用的方法是通过 sigmoid 函数对信号进行处理。sigmoid 函数的表达式为
    g(z) = 1/(1+e^(-z))，sigmoid 函数如图 12.19 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_317_0.png)


    sigmoid 函数的处理结果和真实神经元的处理结果比较类似（sigmoid 函数值集中于 1 和 0，对应于神经元细胞的兴奋和不兴奋状态），而且 sigmoid
    函数根据函数值可以很容易地得到导数值。


    人工神经网络其实是真实神经网络的简化。一个典型的人工神经网络如图 12.20 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_317_1.png)


    神经网络由 3 层组成，即输入层、隐含层、输出层。需要注意的是，输入层和输出层都只有一层结构，而隐含层可以是一层结构，也可以是多层结构。


    在图 12.20 中，x1 和 x2 是输入数据，y1 是输出数据。最上面的两个圆圈表示对神经元的恒定刺激，a1 和 a2 是隐含层输入信号的信号综合结果，z1
