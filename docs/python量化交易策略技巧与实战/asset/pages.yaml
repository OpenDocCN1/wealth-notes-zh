  md: '# 9.3 规模类因子选股技巧


    在 Python 量化选股中，规模类因子有 4 种，分别是总市值、流通市值、总股本、流通股本。


    # 9.3.1 总市值选股技巧


    总市值，是指在某特定时间内总股本数乘以当时股价得出的股票总价值。沪市所有股票的市值就是沪市总市值，深市所有股票的市值就是深市总市值。


    总市值用来表示个股权重大小或大盘规模大小，对股票买卖没有直接作用，但是很多情况下走强的是市值大的个股。由于市值越大在指数中占的比例越高，资金规模较大的投资者往往通过控制高市值的股票达到控制大盘的目的，这时候对股票买卖好像又有作用。


    # 总市值选股实例


    成功登录 JoinQuant 聚宽量化交易平台后，单击导航栏中的 “策略研究” → “研究环境” 命令，打开研究环境页面。双击 “量化选股” 文件夹，然后单击
    “新建” → “Python 3” 命令，新建一个 Python 3 文件，并将其命名为 “总市值选股”，然后输入如下代码：


    ```

    import pandas as pd

    dataframe1 = get_fundamentals( query(valuation).filter(

    valuation.market_cap > 15000

    )

    , date=''2018-08-01'')

    dataframe1[''code'']

    ```


    valuation 为市值数据表名；查询条件为总市值大于 15 000 亿元；查询时间为 2018 年 8 月 1 日。


    单击工具栏中的 运行 按钮，运行结果如图 9.9 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_237_0.png)'
