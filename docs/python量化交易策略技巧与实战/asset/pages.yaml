- pgno: 51
  md: '选股频率：每多少个交易日更新一次股票池。在这里设置为 1，即每一个交易日更新一次股票池。


    最大持仓股票数量：量化交易策略最多持有的标的数量。


    是否可重复买入：当持有标的时，是否可以再次买入。


    买入频率：每多少个交易日执行一次买入操作。


    个股最大持仓比重：标的持仓价值在策略中的最大占比。


    买入方式：买入方式有 4 种，分别是等权重买入、按固定数量、按总市值比例、按流通市值比例，与轮动模型相同，这里不再重复。


