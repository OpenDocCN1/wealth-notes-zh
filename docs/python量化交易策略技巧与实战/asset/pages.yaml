- pgno: 122
  md: '# 5.1 Python 内置函数


    程序需要完成多个功能或操作，每个函数可以实现一个独立的功能或完成一个独立的操作，因此学习“程序设计”必须掌握函数的编写。因为函数可以被多次调用，所以可以减少重复的代码，即函数能提高应用的模块性和代码的重复利用率。


    Python 提供大量功能强大的内置函数，在这里重点讲解常见的数值函数和字符串函数。


    # 5.1.1 数学函数


    数学函数用于各种数学运算。数学函数及意义如表 5.1 所示。


    # 表 5.1 数学函数及意义


    | 数学函数 | 意义（返回值） |

    |---|---|

    | abs(x) | 返回数字的绝对值，如 abs(-10) 返回 10 |

    | ceil(x) | 返回数字的上入整数，如 math.ceil(4.1) 返回 5 |

    | floor(x) | 返回数字的下舍整数，如 math.floor(4.9) 返回 4 |

    | round(x [, n]) | 返回浮点数 x 的四舍五入值，如给出 n 值，则代表舍入到小数点后的位数 |

    | exp(x) | 返回 e 的 x 次幂，如 math.exp(1) 返回 2.718281828459045 |

    | log10(x) | 返回以 10 为基数的 x 的对数，如 math.log10(100) 返回 2.0 |

    | pow(x, y) | x**y 运算后的值 |

    | sqrt(x) | 返回数字 x 的平方根 |

    | max(x1, x2, ...) | 返回给定参数的最大值，参数可以为序列 |

    | min(x1, x2, ...) | 返回给定参数的最小值，参数可以为序列 |


    单击“开始”菜单按钮，打开“Python 3.7.1 Shell”窗口，然后单击菜单栏中的“File”→“New File”命令，创建一个 Python 文件，并将其命名为“Python5-1.py”，然后输入如下代码：


    ```

    import math  #导入math模块

    print("-16 的绝对值: ",abs(-16))

    print("3.8 的上入整数: ",math.ceil(3.8))

    print("3.8 的下入整数: ",math.floor(3.8))

    print("3.8 的四舍五入整数: ",round(3.8))

    print("e 的 3 次幂: ",math.exp(3))

    print("以 10 为基数的 1000 的对数: ",math.log10(1000))

    print("5 的 4 次方: ",math.pow(5,4))

    print("16 的平方根: ",math.sqrt(16))

    print("3、6、13、19 数中的最大数",max(3,6,13,19))

    print("3、6、13、19 数中的最小数",min(3,6,13,19))

    ```'
