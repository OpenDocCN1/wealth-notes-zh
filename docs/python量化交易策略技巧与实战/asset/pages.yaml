    # 10.3.2 MFI 指标函数


    MFI 指标，即资金流量指标。在 Python 量化交易策略中，MFI 指标的语法格式如下：


    ```

    MFI(security_list, check_date, timeperiod=14)

    ```


    其中，各参数意义与 MACD 指标相同，这里不再赘述。


    返回值是一个字典（dict）类型，与 MACD 指标相同，这里不再赘述。


    MFI 指标用法具体如下：


    +   第一，MFI>80 为超买，当其回头向下跌破 80 时，为短线卖出时机；

    第二，MFI<20 为超卖，当其回头向上突破 20 时，为短线买入时机；

    第三，MFI>80，而产生背离现象时（价格在上涨，但资金流量指数在下跌），为卖出信号；

    第四，MFI<20，而产生背离现象时（价格在下跌，但资金流量指数在上涨），为买入信号。


    # MFI 指标函数实例


    双击“量化择时”文件夹，单击“新建”→“Python 3”命令，新建一个 Python 3 文件，并将其命名为“MFI 指标函数”，然后输入如下代码：


