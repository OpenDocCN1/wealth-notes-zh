    20%~30%的投资采用定量技术。


    # 1.5.2 国内量化交易的历史


    与海外市场量化交易的蓬勃发展相比，量化基金在国内尚处于起步阶段。2004 年 8 月光大保德信量化核心基金是国内第一只量化基金。在随后的近 5 年时间里，量化基金的发型一度处于空窗期。从
    2009 年开始，量化基金以每年四五只的发展速度缓慢前行。2014—2015 年的牛市阶段，促使量化基金正式进入投资者的视野。自 2015 年起，量化基金市场规模迅速扩张，数量及管理规模均快速增长，其中，量化公募基金现已超过
    1000 亿元的规模。


    量化私募基金的发展则更加迅速。截至 2017 年 12 月底，中国证券投资基金业协会已备案私募基金管理人 22 446 家，同比增长 28.76%；已备案私募基金
    66 418 只，同比增长 42.82%；管理基金规模 11.1 万亿元，同比增长约 41%。


    与此同时，国内证券、金融工程研究如雨后春笋般兴起，它们纷纷推出自行研究的数量化股票投资模型，按照一定的选股标准，如 Beta 值、市值、每股收益、市盈率等，以及市场的动态特征对市场行为和投资进行量化，帮助投资者实现证券投资组合管理，为未来量化投资的进一步发展奠定了基础。


    # 1.6 量化交易的注意事项


    量化交易的注意事项有六项，具体如下：


    第一，没有任何一个交易策略系统既能在趋势中获利又能在振荡走势中获利，只有在恰当的时间使用了适合的交易系统才能获取最大收益。


    第二，任何交易系统都是人设置的，由于不同的人对技术分析的理解、解读、使用不同，所以不同的人设置的交易系统是完全不一样的。因此，只有适合自己交易风格的交易系统才是最有效的。


    第三，把人为主观分析编成理性的计算机程序，需要我们舍去很多以往交易中的经验，而这'
