    ,num)\nprint(\"没调用函数前，全部变量的值：\",num)\nfun1()               #调用自定义函数 fun1()\nprint(\"\
    调用函数后，全部变量的值：\",num)\n```\n\n在这里可以看到，首先定义一个全局变量 num，其值为 1。然后自定义函数 fun1()，在该函数中利用\
    \ global 关键字声明全局变量 num，这样函数内与函数外的变量 num，将会同时更新。\n\n接着显示变量 num，这里就是 1，即全局变量的初值。随后变量\
