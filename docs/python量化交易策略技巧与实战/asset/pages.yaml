- pgno: 309
  md: '# 12.3 朴素贝叶斯在量化交易中的运用技巧


    在实际生活中，我们常常根据观测到的现象推测现象产生的原因。例如，我们看到草地湿了，需要判断是不是下雨导致的；今天的交易量大增，需要判断是有新资金入场，还是存量资金雄起了；去医院体检，检查结果为阳性，需要判断是真的得病了，还是医院误诊了。朴素贝叶斯算法可以根据历史数据的分布，提供一个最可能的结果，使判断出错的概率最小化。


    # 12.3.1 什么是朴素贝叶斯


    学过概率的人一定都知道贝叶斯定理，这个在 250 多年前发明的算法在信息领域内有着无与伦比的地位。贝叶斯分类是一系列分类算法的总称，这类算法均以贝叶斯定理为基础，故统称为贝叶斯分类。朴素贝叶斯算法（Naive
    Bayesian）是其中应用非常广泛的分类算法之一。


    朴素贝叶斯算法需要估计的参数很少，其对缺失数据不太敏感，算法也比较简单。理论上，朴素贝叶斯模型与其他贝叶斯分类方法相比具有最小的误差率。


    # 12.3.2 朴素贝叶斯的算法思想


    朴素贝叶斯的思想是这样的：如果一个事物在一些属性条件发生的情况下，事物属于 A 的概率大于属于 B 的概率，则判定事物属于 A。


    例如，你在商店上看到一个黑人，要让你猜这黑人是从哪里来的，你十有八九会猜来自非洲。为什么呢？因为在你的脑海中，有这么一个判断流程：第一，这个人的肤色是黑色（特征）；第二，黑色人种是非洲人的概率最高（条件概率，黑色条件下是非洲人的概率）；第三，没有其他辅助信息的情况下，最好的判断就是非洲人。这就是朴素贝叶斯的思想基础。


    再例如，如果在大街上看到一个黑人讲英语，那你怎么判断他来自哪里呢？首先，提取特征：肤色为黑色；语言为英语。然后判断，黑色人种来自非洲的概率为 80%；黑色人种来自美国的概率为
    20%。接着判断，说英语的人来自非洲的概率为 10%；说英语的人来自美国的概率为 90%。在我们的自然思维方式中，就会这样判断：这个人来自非洲的概率，80%×10%
    = 0.08；这个人来自美国的概率，20%×90%=0.18。因此，你的判断结果就是此人来自美国。


    # 12.3.3 朴素贝叶斯的算法步骤


    朴素贝叶斯的算法步骤具体如下。


    第一，分解各先验样本数据中的特征。'
  merge: -1
  img_proc: true
- pgno: 310
  md: '第二，计算各类数据中各特征的条件概率。例如，特征 1 出现的情况下，属于 A 类的概率 p(A|特征 1)，属于 B 类的概率 p(B|特征 1)，属于
    C 类的概率 p(C|特征 1)……


    第三，分解待分类数据中的特征，特征 1、特征 2、特征 3、特征 4……


    第四，计算各特征的各条件概率的乘积，如下所示。


    判断为 A 类的概率：p(A|特征 1)×p(A|特征 2)×p(A|特征 3)×p(A|特征 4)……


    判断为 B 类的概率：p(B|特征 1)×p(B|特征 2)×p(B|特征 3)×p(B|特征 4)……


    判断为 C 类的概率：p(C|特征 1)×p(C|特征 2)×p(C|特征 3)×p(C|特征 4)……


    第五，结果中的最大值就是该样本所属的类别。


    # 12.3.4 朴素贝叶斯的优缺点


    朴素贝叶斯的优点有三项，具体如下：


    第一，算法简单，有稳定的分类效率。


    第二，对小规模的数据表现很好，能处理多分类任务，适合增量式训练，尤其是数据量超出内存时，可以一批批的进行增量训练。


    第三，对缺失数据不太敏感。


    朴素贝叶斯的缺点有两项，具体如下。


    第一，朴素贝叶斯的假设如果与实际情况不符，会影响模型效果。


    第二，输入特征数据的表现形式，比如是连续特征、离散特征还是二元特征，会影响概率计算和模型的分类效果。


