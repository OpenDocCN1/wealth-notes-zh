  md: '# 图 3.34 限售解禁股数据


    # 3.5 Python 的基本数据类型


    Python 的标准数据类型只有 6 个，分别是数值、字符串、列表、元组、集合、字典。相对于 C 语言来讲，Python 的数据类型很少，但该有的功能一个不少。即使
    C 语言的代表作链表和二叉树，Python 同样可以轻松应对。下面先来讲解一下 Python 的基本数据类型，即数值和字符串。


    # 3.5.1 数值类型


    Python 支持 3 种不同的数值类型，分别是整型（int）、浮点型（floating point real values）、复数（complex numbers），如图
    3.35 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_84_0.png)


    # 图 3.35 数值类型


    # 1）整型


    整型，通常被称为整数，包括正整数和负整数，不带小数点。Python 3 整型没有限制大小，可以当作长整型（Long）类型使用，所以 Python 3 没有
    Python 2 的长整型类型。需要注意的是，Python 3 可以使用十六进制和八进制来代表整数。


    ```

    import pandas as pd

    # 从2015年4月16日到当前，平安银行、中倶宝安再只发票的限售解禁股数据

    dataframe1 = get_locked_shares(stock_list=[''000001.XSHE'', ''000009.XSHE''],
    start_date=''2015-4-16

    dataframe1

    ```


