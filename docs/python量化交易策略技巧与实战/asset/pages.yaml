    \ 之后的交易时间为 9:30~15:00，在此之前为 9:15~15:15；如果参照 “A9997.XDCE”，因为有夜盘，所以开始时间为 21:00，结束时间为\
    \ 15:00。\n\n> 提醒：由于量化交易策略可以应用于股票、股指期货、商品期货，并且商品期货有一些品种有夜盘，这样交易开始时间和结束时间就不一致，所以参数\
    \ time 和参数 reference_security 要根据具体交易品种来定。\n\n# 7.3.3 定时函数的注意事项\n\n定时函数的注意事项有\
    \ 5 项，具体如下。\n\n第一，参数 func 必须是一个全局的函数，不能是类的成员函数，实例代码如下：\n\n```\ndef on_week_start(context):\n\
    \    pass\nclass MyObject(object):\n    def on_week_start2(self, context):\n \
    \       pass\ndef initialize(context):\n    run_weekly(on_week_start, 1)\n   \
    \ # 正常运行\n    # 错误，下面的语句会报错\n    run_weekly(MyObject().on_week_start2, 1)\n# 定义一个全局函数\n\
    # 定义一个类\n# 在类中定义一个成员函数\n# 量化交易策略的初始化函数\n# 正常运行\n```\n\n第二，定时函数通过 history 或 attribute_history\
    \ 获得每天数据时，是不包括当天数据的。要获得当天数据，只能按分钟来获取。\n\n第三，定时函数可以重复调用，即初始化函数中可以有两个或多个同名定时函数，实例代码如下：\n\
    \n```\ndef on_week_start(context):\n    pass\ndef on_week_end(context):\n    pass\n\
    # 初始化函数中有两个 run_weekly 定时函数\ndef initialize(context):\n    # 在每周的第一个交易日和最后一个交易日分别调用两个函数\n\
    \    run_weekly(on_week_start, 1)\n    run_weekly(on_week_end, -1)\n```\n\n第四，每次调用这些定时函数都会产生一个新的定时任务。如果想修改或者删除旧的定时任务，就要调用\
    \ unschedule_all（取消所有定时运行）来删除所有定时任务，然后再添加新的定时任务。\n\n> 提醒：取消所有定时运行的代码是 unschedule_all()。"
