  md: '# 3.6.2 变量的赋值


    每个变量在使用前都必须赋值，赋值以后才会被创建。在 Python 中，变量就是变量，它没有类型，我们所说的“类型”是变量所指的内存中对象的类型。


    等号（=）用来给变量赋值。等号（=）运算符左边是一个变量名，右边是存储在变量中的值，例如：


    ```

    counter = 100      # 整型变量

    miles = 1000.0     # 浮点型变量

    name = "runoob"   # 字符串

    ```


    另外，Python 允许同时为多个变量赋值。例如：


    ```

    a = b = c = 15

    ```


    上述代码表示，创建一个整型对象，赋值为 15，三个变量被分配到相同的内存空间上。


    Python 还可以为多个对象指定多个变量，例如：


    ```

    a, b, c = 1, 2, "runoob"

    ```


    上述代码表示，两个整型对象 1 和 2 分配给变量 a 和 b，字符串对象 “runoob” 分配给变量 c。


    利用 type()函数，可以查看变量的数据类型。单击“开始”菜单按钮，打开“Python 3.7.1 Shell”窗口，然后输入如下代码：


    ```

    a, b, c = 20, 5.6, 4+3j      # 为多个对象指定多个变量

    print(type(a), type(b), type(c))   # 查看变量的数据类型

    ```


    然后按 “Enter” 键，就可以看到变量 a，b，c 的数据类型，如图 3.43 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_91_0.png)


