    |0 2016-03-04|000009.XSHE|6.549427e+07|0.0411|0.0440|

    |1 2016-05-23|000001.XSHE|3.885957e+08|0.0272|0.0329|

    |2 2016-07-08|000009.XSHE|1.571689e+07|0.0096|0.0098|

    |3 2017-01-09|000001.XSHE|2.286809e+09|0.1332|0.1563|

    |4 2018-05-21|000001.XSHE|2.522480e+08|0.0147|0.0149|'
