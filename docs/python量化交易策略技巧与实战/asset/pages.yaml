- pgno: 348
  md: "# 14.3.1 编写初始化函数\n\n双击“量化交易策略实战案例”文件夹，然后单击“新建策略”→“股票策略”命令，即可新建一个股票策略，然后双击策略名称，将其重命名为“MACD\
    \ 指标量化交易策略实战案例”。\n\n删除文本框中所有代码，重新编写代码。首先导入函数，然后编写初始化函数，具体代码如下：\n\n```\nimport\
    \ jqdata\nfrom jqlib.technical_analysis import *\ndef initialize(context):\n \
    \   # 定义一个全局变量，保存要操作的股票\n    # 000001(股票:平安银行)\n    g.security = '000001.XSHE'\n\
    \    # 设定沪深 300 作为基准\n    set_benchmark('000300.XSHG')\n    # 开启动态复权模式(真实价格)\n\
    \    set_option('use_real_price', True)\n```\n\n# 14.3.2 编写单位时间调用的函数\n\n单位时间调用的函数，即每个单位时间调用一次的函数（如果按天回测，则每天调用一次，如果按分钟，则每分钟调用一次），具体代码如下：\n\
    \n```\ndef handle_data(context, data):\n    #获取初始化中要操作的股票\n    security = g.security\n\
    \    #调用 MACD 函数，并获取股票的 MACD 指标的 DIF, DEA 和 MACD 的值\n    macd_diff, macd_dea,\
    \ macd_macd = MACD(security,check_date=context.current_dt, SHORT = 12, LONG =\
    \ 26, MID = 9)\n    # 取得当前的现金\n    cash = context.portfolio.cash\n    # 如果当前有余额，并且\
    \ DIFF、DEA 均为正，DIFF 向上突破 DEA\n    if macd_diff > 0 and macd_dea >0 and macd_diff\
    \ > macd_dea :\n        # 用所有 cash 买入股票\n        order_value(security, cash)\n\
    \        # 记录这次买入\n        log.info(\"买入股票 %s\" % (security))\n    # 如果 DIFF、DEA\
    \ 均为负，DIFF 向下跌破 DEA，并且目前有头寸\n    elif macd_diff < 0 and macd_dea < 0 and macd_diff\
    \ < macd_dea and context.portfolio.positions[security].closeable_amount> 0:\n\
    \        # 全部卖出\n        order_target(security, 0)\n```"
