  md: '![](img/e6d4c365781f4dd8cb814bd56923b0bc_54_0.png)


    # 图2.36 量化交易策略的“其他参数”


    滑点：下单后，真实的成交价格与下单时预期的价格总会有一定偏差，因此加入滑点模式有利于更好地模拟真实市场的表现。在下达一个买单指令的时候，成交的价格等于当时（执行
    order 函数所在的单位时间）的平均价格加上价差的一半；在下达一个卖出指令的时候，卖出的价格等于当时的平均价格减去价差的一半。滑点的固定值，是指买卖价格都会加减价差的一半（例如，0.02
    元交易时加减 0.01 元）；滑点的百分比，是指买卖价格比例都会加减价差的一半（例如，0.2%交易时加减当时价格的 0.1%）。


    动态复权模式：回测中每天获得的当天价格为除权价格，往前取到的价格为基于该日期的前复权价格。


    成交量比例：根据实际行情限制每个订单的成交量。成交量≤每日成交量×每日成交量比例。


    买入印花税：印花税由纳税人按规定应税的比例和定额自行购买并粘贴印花税票，即完成纳税义务。证券交易印花税，是印花税的一部分，根据书立证券交易合同的金额对买卖方计征。买入印花税为
    0。


    卖出印花税：卖出印花税为 1‰。


    买入佣金：佣金，是指代理人或经纪人为委托人介绍生意或代买代卖而收取的报酬。买入佣金为 3‰。


    卖出佣金：卖出佣金为 3‰。


