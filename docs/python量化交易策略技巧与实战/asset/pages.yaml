  md: "# 5.4 变量作用域及类型\n\n在 Python 程序设计中，程序的变量并不是在哪个位置都可以被访问到的，访问权限取决于这个变量是在哪里被赋值的。\n\
    \n# 5.4.1 变量作用域\n\n变量的作用域决定了在哪一部分程序可以访问哪一个特定的变量名称。Python 的变量作用域一共有 4 种，分别是局部作用域（local）、闭包函数外的函数作用域（enclosing）、全局作用域（global）、内建作用域（built-in）。\n\
    \n在 Python 程序设计中，变量以局部作用域、闭包函数外的函数作用域、全局作用域、内建作用域的规则查找，即在局部找不到，便会去局部外的局部找（例如闭包），再找不到将去全局找，再者去内建中找，具体代码如下：\n\
    \n```\nx = int(2.9)          # 内建作用域\ng_count = 0           # 全局作用域\ndef outer():\n\
    \    o_count = 1       # 闭包函数外的函数作用域\n    def inner():\n        i_count = 2  \
    \ # 局部作用域\n```\n\n在 Python 程序设计中，只有模块、类和函数（如 def、lambda）才会引入新的作用域，其他的代码块（如 if/elif/else、for/while\
    \ 等）是不会引入新的作用域的，也就是说这些语句内定义的变量，外部也可以访问。\n\n单击“开始”菜单按钮，打开“Python 3.7.1 Shell”窗口，然后单击菜单栏中的“File”→“New\
    \ File”命令，创建一个 Python 文件，并将其命名为“Python5-14.py”，然后输入如下代码：\n\n```\nif True:\n  \
    \  msg1=\"我是 if 语句中的变量，外部是可以访问的！\"\nelse:\n    msg2=\"我也是一个代码块变量\"\nprint(msg1)\
    \  # 可以直接调用 if 语句中的变量\n```\n\n由于 if 语句的条件成立，所以 msg1 已指向“我是 if 语句中的变量，外部是可以访问的！”，由于这个变量已存在，所以可以直接利用\
    \ print()函数输出。需要注意的是，由于 if 语句的条件成立，就不会运行 else 中的语句，所以 msg2 没有指向“我也是一个代码块变量”，即不能利用\
    \ print()函数输出 msg2 变量。\n\n单击菜单栏中的“Run”→“Run Module”命令或按键盘上的“F5”键，即可运行程序代码，"
