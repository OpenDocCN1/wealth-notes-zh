    \ True)\n    # 输出内容到日志 log.info()\n    log.info('初始函数开始运行且全局只运行一次')\n    ### 股票相关设定\
    \ ###\n    # 股票类每笔交易时的手续费用是：买入时佣金的万分之三，卖出时佣金的万分之三加千分之一印花税\n    # 每笔交易佣金最低扣5元\n\
    \    set_order_cost(OrderCost(close_tax=0.001, open_commission=0.0003, close_commission=0.0003,\
    \ min_commission=5), type='stock')\n    ## 运行函数(reference_security为运行时间的参考标的；传入的标的只做种类区分\n\
    \    ## 因此传入'000300.XSHG'或'510300.XSHG'是一样的)\n    # 开盘前运行\n    run_daily(before_market_open,\
    \ time='before_open', reference_security='000300.XSHG')\n    # 开盘时运行\n    run_daily(market_open,\
    \ time='open', reference_security='000300.XSHG')\n    # 收盘后运行\n    run_daily(after_market_close,\
    \ time='after_close', reference_security='000300.XSHG')\n```\n\ninitialize（context），即初始化函数，在整个回测模拟或实盘中最开始执行一次，用于初始化一些全局变量。参数\
    \ context，是 Context 对象，用来存放有关当前的账户或股票持仓的信息。\n\nset_benchmark ('000300.XSHG')，是指设定沪深\
