  md: '自动控制、预测估计、生物、医学、经济等领域已成功地解决了许多现代计算机难以解决的实际问题，表现出了良好的智能特性。


    # 12.4.2 大脑中的神经元细胞和神经元细胞网络


    为了更好地理解神经网络的工作过程，在这里先对神经元细胞进行简单讲解。神经元细胞结构如图 12.14 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_314_0.png)


    图 12.14 神经元细胞结构


    神经元通过树突（左上角的那些树状结构）来接收信息，这些信息可以是别的神经元传递过来的信息，也可以是直接的物理刺激（如声音对于细胞造成的刺激）。对这些信息进行综合处理后，神经元细胞体将处理结果通过轴突（下方的那条长长的传送结构）传递给别的神经元。


    大脑的神经细胞只有两种状态：兴奋或不兴奋（激活或抑制）。神经细胞通过某种方法，对所有从树突上进来的信号进行相加，如果信号总和超过某个阈值，就会激发神经细胞进入兴奋状态。此时神经细胞就会发出一个电信号，并且通过轴突发送给其他神经细胞。如果信号总和没有达到阈值，神经细胞就不会进入兴奋状态。


    单个神经细胞处理不了任何复杂的问题，必须形成神经元细胞网络才行。神经元细胞网络如图 12.15 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_314_1.png)


    图 12.15 神经元细胞网络'
