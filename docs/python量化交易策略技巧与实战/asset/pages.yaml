- pgno: 302
  md: '# 12.2.1 什么是支持向量机（SVM）


    支持向量机（SVM）是 Corinna Cortes 和 Vapnik 等于 1995 年首先提出的，它在解决小样本、非线性样本及高维模式识别中表现出许多特有的优势，并能够被推广应用到函数拟合等其他机器学习问题中。


    为了解释 SVM 算法，可以想象有很多数据，其中每个数据是高维空间中的一个点，数据的特征有多少，空间的维数就有多少。相应的，数据的位置就是其对应各特征的坐标值。如果想用一个超平面尽可能完美地分类这些数据点，就可以用
    SVM 算法找出这个超平面，如图 12.3 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_302_0.png)


    图 12.3 支持向量机


    所谓“支持向量”指的是那些在间隔区边缘的训练样本点，而“机”则是用于分类的那个最佳决策边界（线/面/超平面）。


    # 12.2.2 支持向量机（SVM）的工作原理


    下面用图形演示来说明，如何找出正确的超平面。


    第一种情况：图 12.4 中有 3 个超平面，即 A、B 和 C，那么哪个是正确的超平面呢？需要注意的是，SVM 算法选择的是能分类两种数据的决策边界。很显然，与
    A 和 C 相比，B 更好地分类了圆和星，所以 B 是正确的超平面。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_302_1.png)


    图 12.4 第一种情况的超平面'
  merge: -1
  img_proc: true
- pgno: 303
  md: '第二种情况：图 12.5 中同样有 A、B、C 3 个超平面，和第一种情况不同，这次 3 个超平面都很好地完成了分类，那么哪个是正确的超平面呢？


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_303_0.png)


    图 12.5 第二种情况的超平面


    对此，我们需要修改一下之前的描述：SVM 算法选择的是能更好地分类两种数据的决策边界。在这里可以看到，无论是星还是圆，它们到 C 的距离都是最远的。因此，C
    就是我们要找的最佳决策边界，即正确的超平面。


    提醒：为什么要选择边距更远的超平面？这是因为这样的超平面更稳健、容错率更高。如果选择 A 或 B，那么后期继续输入样本时，它们发生错误分类的可能性会更高。


    第三种情况：如图 12.6 所示，试着用第二种情况的结论做出选择。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_303_1.png)


    图 12.6 第三种情况的超平面


    也许你会选择 B，因为两类数据和它的边距离 B 更远。但是其中有个问题，就是 B 没有正确分类，而 A 正确分类了。那么在 SVM 算法中，正确分类和最大边距究竟哪个重要呢？很显然，SVM
    算法首先考虑的是正确分类，其次才是优化数据到决策边界的距离。所以，第三种情况的正确超平面是 A，而不是 B。'
