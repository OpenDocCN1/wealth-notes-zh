    \ date = None)\n    s = pd.Series([0]*len(df), index=df.index)\n    s[set(industry)\
    \ & set(df.index)] = 1\n    df[industry_set[i]] = s\n    #机器训练的 X 标签数据\n    X\
    \ = df[['log_NC','LEV','NI_p','NI_n','g','log_RD','801010','801020','801030','801040','801050','801080','801110','801120','801130','801140','801150','801160','801170','801180','801200','801210','801230','801710','801720','801730','801740','801750','801760','801770','801780','801790','801680','801890']]\n\
    \    #机器训练的 Y 标签数据\n    Y = df[['log_mcap']]\n    #调用 fillna 将缺失 Nan 全都填充为 0\n\
    \    X = X.fillna(0)\n    Y = Y.fillna(0)\n```\n\n接下来，开始利用 SVR 机器学习算法计算，并训练数据，具体代码如下：\n\
    \n```\n#开始利用 SVR 机器学习算法计算\nsvr = SVR(kernel='rbf', gamma=0.1)\n#训练的代码\nmodel =\
    \ svr.fit(X, Y)\n```\n\n接下来将机器学习算法运算得到的结果用到当日的股票上，计算预测值与真实值之间的差，并按照差距从小到大的顺序对股票进行排序，具体代码如下：\n\
    \n```\n#将机器学习算法运算得到的结果用到当日的股票上，计算预测值与真实值之间的差距\nfactor = Y - pd.DataFrame(svr.predict(X),\
    \ index = Y.index, columns = ['log_mcap'])\n#按照差距从小到大的顺序对股票进行排序\nfactor = factor.sort_index(by\
