  md: '# 6.1 Numpy 库


    Numpy 库是高性能科学计算和数据分析的基础包，不是 Python 的标准库，是 Python 的第三方库。为了更好地讲解 Numpy 库，在这里将借助
    JoinQuant 聚宽量化交易平台免费提供的基于 IPython Notebook 的研究平台。


    # 6.1.1 ndarray 数组基础


    在 Python 中用列表保存一组值，可将列表当作数组使用。此外，Python 有 array 模块，但它不支持多维数组，而且无论是列表还是 array 模块都没有科学运算函数，所以
    Python 不适合做矩阵等科学计算。因此，Numpy 没有使用 Python 本身的数组机制，而是提供了 ndarray 数组对象，该对象不仅能方便地存取数组，而且拥有丰富的数组计算函数，比如向量的加法、减法、乘法等。


    使用 ndarray 数组，首先需要导入 Numpy 函数库。可以直接导入 Numpy 函数库，也可以在导入 Numpy 函数库时指定导入库的别名，代码如下：


    ```

    import numpy          #直接导入 Numpy 函数库

    import numpy as np    #导入 Numpy 函数库并指定导入库的别名

    ```


    # 1) 创建 Numpy 数组


    创建 Numpy 数组是进行数组计算的先决条件，可以通过 array()函数定义数组实例对象，其参数为 Python 的序列对象（比如列表）。如果想定义多维数组，则需传递多层嵌套的序列，代码如下：


    ```

    Numpy1 = np.array([[10,-8,10.5],[-4,6.0,9.6]])

    ```


