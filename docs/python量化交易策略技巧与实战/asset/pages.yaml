- pgno: 49
  md: '# 2.5.1 轮动模型


    老股民都知道，在进行股票投资选择时，每个人都有自己的投资偏好。有些投资者有时候比较偏好成长股，有时候又会比较偏好价值股。有些投资者可能在某些阶段比较偏好小盘股，在另外的时期又比较偏好大盘股。市场风格就是由于投资者这种不同的交易行为产生的。


    单击“买卖条件”标签，就可以看到“轮动模型”和“择时模型”选项。选择“轮动模型”单选按钮，即可设置轮动模型，如图 2.29 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_49_0.png)


    图 2.29 轮动模型


    调仓周期：量化交易策略多少个交易日更新一次股票池。在这里设置为“2”，即每两个交易日更新一次股票池。


    最大持仓股票数量：量化交易策略最多持有的股票数量。在这里设置为“6”，即最多同时持有 6 只股票。


    买入方式：量化交易策略的买入方式有 4 种，分别是等权重买入、按固定数量、按总市值比例、按流通市值比例，下面来看一下各种买入方式的意义。


    +   （1）等权重买入，是指每次买入一定金额的股票。买入金额 = （持仓成本+可用资金）÷ 最大持股数。

    （2）按固定数量，是指每次买入固定数量的股票。

    （3）按总市值比例，是指根据股票的总市值大小，按比例买入股票。所占比例 = 股票 A 总市值 ÷（股票 A 总市值+股票 B 总市值+股票 C 总市值+…）。

    （4）按流通市值比例，是指根据股票的流通市值大小，按比例买入股票。所占比例=股票 A 流通市值 ÷（股票 A 流通市值+股票 B 流通市值+股票 C 流通市值+…）。


    在这里设置买入方式为“按流通市值比例”，如图 2.30 所示。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '![](img/e6d4c365781f4dd8cb814bd56923b0bc_50_0.png)


    # 图 2.30 “买入方式” 设置为 “按流通市值比例”


    卖出欲买进股票：是否卖出欲买进的股票，若卖出可能会再次买入同一只标的，将会亏损手续费，所以该项默认为“否”。


    # 2.5.2 择时模型


    择时交易，是指利用某种方法判断大势的走势情况，是上涨还是下跌或者是震荡。如果判断是上涨，则以买入持有为主；如果判断是下跌，则果断卖出清仓；如果判断是震荡，则进行高抛低吸。这样可以获得远远超越简单买入持有策略的收益率，所以择时交易是收益率最高的一种交易方式。


    > 提示：由于大盘趋势和宏观经济、微观企业、国家政策、国际形势等密切相关，想要准确判断大盘走势具有相当的难度。


    接下来设置“择时模型”，选择“择时模型”单选按钮，即可设置择时模型。择时模型分为买入条件和卖出条件，先来看一下“买入条件”设置，如图 2.31 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_50_1.png)


    # 图 2.31 择时模型的 “买入条件”'
