    volume=money=0。


    # 4） security_list


    参数 security_list, 用来获取数据的股票列表。如果其值为 None, 则表示查询 context.universe 中所有股票的数据。context.universe
    需要使用 set_universe 进行设定, 形如 set_universe([''000001.XSHE'', ''600000.XSHG''])。


    # 5） df


    参数 df 的值若是 True, 则返回 pandas.DataFrame; 否则返回一个 dict。参数 df 的默认值为 True。


    # 6） skip_paused


    参数 skip_paused, 用来设置是否跳过不交易日期（包括停牌、未上市或者退市后的日期）。如果不跳过, 则停牌时_HTTP会使用停牌前的数据填充, 上市前或者退市后数据都为
    nan。需要注意的是, 该参数的默认值为 False, 即不跳过不交易日期。


    # 7） fq


    参数 fq 是复权选项。参数值设为 “pre”, 表示前复权, 为默认设置; 参数值设为 None, 表示不复权, 返回实际价格; 参数值设为 “pos”,
    表示后复权。


