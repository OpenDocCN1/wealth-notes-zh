- pgno: 210
  md: '# 1) query_object


    参数 query_object 是一个 sqlalchemy.orm.query.Query 对象，可以通过全局的 query 函数获取 Query 对象。


    # 2) date


    参数 date 是查询日期，可以是一个字符串（格式类似“2018-4-24”）或者 datetime.date/datetime.datetime 对象；也可以是
    None，即使用默认日期，这个默认日期在回测和研究模块上是有差别 的。


    回测模块：默认值会随着回测日期的变化而变化，等于 context.current_dt 的前一天（实际生活中我们只能看到前一天的财务报表和市值数据，所以要用前一天）。


    研究模块：使用平台财务数据的最新日期，一般是昨天。


    需要注意的是，如果传入的 date 参数不是交易日，则使用这个日期之前最近的一个交易日。


    # 3) statDate


    参数 statDate 是一个字符串，表示财务报表统计的季度或者年份，有两种格式，具体如下。


    季度：格式是年 +q+ 季度序号，例如：“2018q1”“2017q4”。


    年份：格式就是年份的数字，例如 “2017”“2018”。


    > 提示：date 和 statDate 参数只能传入一个。传入 date 参数时，查询指定日期 date 收盘后所能看到最近的数据；传入 statDate
    参数时，查询 statDate 指定的季度或者年份的财务数据。当两个参数都没有传入时，相当于使用 date 参数，即使用默认日期。


    get_fundamentals ()函数的返回值是一个 pandas.DataFrame，每一行对应数据库返回的每一行，列索引是查询的所有字段。


    需要注意的是，为了防止返回数据量过大，每次最多返回 10 000 行。另外，当相关股票上市前、退市后，财务数据返回各字段为空。


