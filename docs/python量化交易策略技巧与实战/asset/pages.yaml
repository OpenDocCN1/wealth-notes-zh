  md: '# 6.2 Pandas 库


    Pandas 是基于 Numpy 构建的，可以使以 Numpy 为中心的应用变得更加简单。Pandas 提供了大量便捷处理数据的函数和方法，这也是使 Python
    成为强大而高效的数据分析环境的重要因素之一。


    Pandas 的数据结构主要有 3 种，分别是 Series、DataFrame 和 Panel。


    Series 是一维数组，与 Numpy 中的一维 array 类似。二者与 Python 基本的数据结构 list 也很相近，其区别是：list 中的元素可以是不同的数据类型，而
    array 和 Series 中只允许存储相同的数据类型，这样可以更有效地使用内存，提高运算效率。


    DataFrame 是二维数组，非常接近于 Excel 电子表格或者类似 MySQL 数据库的形式。它的列称为 columns, 行称为 index, 也就是说数据的位置是通过
    columns 和 index 来确定的。可以将 DataFrame 理解为 Series 的容器。


    Panel 是三维的数组，可以理解为 DataFrame 的容器。


    # 6.2.1 一维数组 Series


    Series 由一组数据（各种 Numpy 数据类型），以及一组与之相关的标签数据（即索引）组成。仅由一组数据即可产生最简单的 Series，也可以通过传递一个
    list 对象来创建一个 Series。需要注意的是，Pandas 会默认创建整型索引。


    成功登录 JoinQuant 聚宽量化交易平台后，单击导航栏中的 “策略研究” → “研究环境” 命令，打开研究环境页面。单击 “新建” → “文件夹” 命令，即可新建一个文件夹，然后将其命名为
    “Pandas”。


    双击 “Pandas” 文件夹，然后单击 “新建” → “Python 3” 命令，即可新建一个 Python 3 文件，并将其命名为 “一维数组 Series”，然后输入如下代码：


    ```

    import pandas as pd

    #创建最简单的 Series，Pandas 会默认创建整型索引

    pandas1 = pd.Series(["Python","C","C++","C#","Java","VB","VC"])

    print("显示 Series 中的内容: ")

    print(pandas1)

    print("只显示 Series 中的索引: ",pandas1.index)

    print("只显示 Series 中的数据值: ",pandas1.values)

    pandas2 = pd.Series(["Python","C","C++","C#","Java","VB","VC"],index=["a","b","c","d","e","f","g"])  #创建带有索引的
    Series

    print("显示 Series 中的内容: ")

    print(pandas2)

    ```'
