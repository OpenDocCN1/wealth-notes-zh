  md: '混合基金（mixture_fund）。


    参数 ref，是参考代码，支持股票代码、基金代码、期货合约代码，以及期货的品种，如“000001.XSHE”“510180.XSHG”“IF1809”。


    设置佣金/印花税函数的实例代码如下：


    ```

    # 股票类每笔交易时的手续费是：买入时佣金的万分之三，卖出时佣金的万分之三加千分之一印花税

