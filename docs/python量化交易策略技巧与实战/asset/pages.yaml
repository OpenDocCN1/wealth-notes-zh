  md: '深复制通过数组对象 copy 的方法完成，是对储存内存进行复制。这样对深复制数组中的元素进行修改时，原数组中对应的元素不会改变。


    成功登录 JoinQuant 聚宽量化交易平台后，单击导航栏中的“策略研究”→“研究环境”命令，打开研究环境页面。然后单击“新建”→“Python 3”命令，就可以新建一个
    Python 3 文件，并将其命名为“Numpy 数组复制”。


    在单元格中输入代码如下：


    ```

    import numpy as np

    numpy1 = np.array([8,6,5.2])

    numpy2 = numpy1

    print("浅复制数组中的数据：",numpy2)

    numpy2[1] = -18.6    #修改浅复制数组中的数据

    print("修改浅复制数组中的数据后：",numpy2)

    print("原数组 numpy1 中的数据也被修改了：",numpy1)

    print()

    numpy3 = np.zeros(3)

    numpy4 = numpy3.copy()

    print("深复制数组中的数据：",numpy4)

    numpy4[1] = -18.6    #修改深复制数组中的数据

    print("修改深复制数组中的数据后：",numpy4)

    print("原数组 numpy3 中的数据没有被修改：",numpy3)

