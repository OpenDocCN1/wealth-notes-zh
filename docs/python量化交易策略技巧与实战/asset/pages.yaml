- pgno: 189
  md: '# 7.3.1  定时函数的定义及分类


    定时函数，是指在回测和模拟交易中指定每月、每周或者每天要运行的函数。定时函数可以在具体每月或每周的第几个交易日（或者倒数第几天）的某一分钟执行。


    定时函数可以分 3 种，分别是每日定时函数（run_daily）、每周定时函数（run_weekly）、每月定时函数（run_monthly）。


    定时函数的语法格式如下：


    ```

    # 按月运行

    run_monthly(func, monthday, time=''open'', reference_security)

    # 按周运行

    run_weekly(func, weekday, time=''open'', reference_security)

    # 每天内何时运行

    run_daily(func, time=''open'', reference_security)

    ```


    需要注意的是，定时函数在日级模拟中使用时，如果设置 time= “open” 或 time= “9:30”，那么股票量化交易策略的实际运行时间是 9:27~9:30，但股票量化交易策略类获取到的逻辑时间（context.current_dt）仍然是
    9:30。


    # 7.3.2  定时函数各项参数的意义


    参数 func：是一个函数，并且该函数必须接受 context 参数。


    参数 monthday：用来指定每月的第几个交易日，可以是负数（表示倒数第几个交易日）。如果超出每月总交易日个数，则取临近的交易日执行。


    参数 weekday：用来指定每周的第几个交易日，可以是负数（表示倒数第几个交易日）。如果超出每周总交易日个数，则取临近的交易日执行。


    参数 time：一个字符串，可以是具体执行时间，支持 time 表达式。比如 “10:00” “01:00” 或者 “every_bar” “open” “before_open”
    “after_close” “close” “morning” “night”。


    +   (1) every_bar: 只能在 run_daily 中调用；按天会在每天开盘时调用一次，按分钟会在每天每分钟运行。


    +   (2) open: 开盘时运行（等同于 “9:30”）。


    +   (3) before_open: 早上 9:00 运行。


    +   (4) after_close: 下午 15:30 运行。


    +   (5) close: 下午 15:00 运行。


    +   (6) morning: 早上 8:00 运行。


    +   (7) night: 晚上 20:00 运行。'
