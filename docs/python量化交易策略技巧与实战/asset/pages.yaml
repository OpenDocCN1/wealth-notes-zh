  md: '# 10.1 量化择时概述


    量化择时，是指利用数量化的方法，通过各种技术分析的量化分析，找到自选股中股票的买点和卖点时机。在各种技术分析中，技术指标是非常重要的量化分析手段，也是最常用的量化分析工具。


    目前，应用于股市的技术指标有几百种，按照不同的计算原理和反映状况，可大致分为 4 类，分别是趋势指标、反趋势指标、压力支撑指标、量价指标，如图 10.1 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_250_0.png)


    # 1）趋势指标


    趋势指标是识别和追踪有趋势的图形类指标，其特点是不试图猜顶和测底，如均线指标、MACD 指标等。


    # 2）反趋势指标


    反趋势指标，又称振荡指标，是识别和追踪趋势运行的转折点的图形类指标，其特点是具有强烈的捕顶和捉底的意图，对市场转折点较敏感，如随机指标 KDJ、强弱指标 RSI
    等。


    # 3）压力支撑指标


    压力支撑指标，又称通道指标，是试图通过顶部轨道线和底部轨道线捕捉行情的顶部和底部的图形类指标，其特点是具有明显的压力线，也有明显的支撑线，如 BOLL 指标、XS
    指标。


    # 4）量价指标


    量价指标就是通过成交量的变动情况来分析捕捉价格未来走势的图形类指标，其特点是以“成交量是市场元气”为依据，揭示成交量与价格涨跌的关系，如 OBV 指标、VOL
    指标等。'
