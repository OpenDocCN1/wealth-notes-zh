- pgno: 324
  md: '# 13.2.2 因子分析中可以使用的基础因子


    在因子分析中，可以使用的基础因子很多，如价量因子、财务数据因子、行业因子、概念因子、指数因子、资金流因子，如图 13.1 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_324_0.png)


    图 13.1 因子分析中可以使用的基础因子


    # 1）价量因子


    价量因子，是指利用 get_price()函数获取的价量信息，如 open（开盘价）、close（收盘价）、high（最高价）、low（最低价）、volume（成交量）、money（成交金额）。


    # 2）财务数据因子


    财务数据因子，是指当日可以看到的最新单季财务指标，如 pe_ratio（动态市盈率）、turnover_ratio（换手率）、pb_ratio（市净率）、market_cap（股票的总市值）、circulating_market_cap（股票的流通市值）等。


    # 3）行业因子


    行业因子包含证监会行业分类，聚宽一、二级行业分类，以及申万一、二、三级行业分类。例如，A01（农业）、A02（林业）、B06（煤炭开采和洗选业）、B07（石油和天然气开采业）、C36（汽车制造业）等。


    其返回值是一个哑变量，如果某股票属于某行业，则返回 1；否则，返回 0。


    提醒：哑变量，又称虚拟变量、名义变量，是量化了的质变量，通常取值为 0 或 1。


    # 4）概念因子


    概念因子，即概念板块代码，如 GN028（智能电网）、GN030（物联网）、GN092（高端装备制造）、GN181（一带一路）等。'
  merge: -1
  img_proc: true
