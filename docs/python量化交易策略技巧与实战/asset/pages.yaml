    # 9.5 质量类因子选股技巧


    在 Python 量化选股中，质量类因子有两种，分别是净资产收益率、总资产净利率。


    # 9.5.1 净资产收益率选股技巧


    净资产，是指企业的资产总额减去负债以后的净额。它由两大部分组成，一部分是企业开办时投入的资产，包括溢价部分；另一部分是企业在经营中创造的资产，也包括接受捐赠的资产，属于所有者权益。净资产的计算公式如下：


    净资产=资产-负债


    净资产收益率是企业税后利润除以净资产得到的百分比，该指标反映了股东权益的收益水平，用以衡量企业运用自有资本的效率。该指标数值越大，说明投资带来的收益越高。该指标体现了自有资本获得净收益的能力。净资产收益率的计算公式如下：


    净资产收益率=税后利润÷净资产×100%


