    量化交易策略回测方法与技巧、Python 量化交易策略机器算法运用技巧、Python 量化交易策略因子分析运用技巧、Python 量化交易策略实战案例。

    - 在内容表现上形象生动，图文并茂：为了能够让投资者在学习知识的同时，不过于死板，本书采用了大量的图、表，以使整本书的风格更加生动、形象。


