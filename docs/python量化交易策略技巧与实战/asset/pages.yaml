- pgno: 4
  md: '# 前 言


    在大多数投资者的想象中，量化交易似乎应该是用十几个显示屏运行的数学模型，是交易速度以微秒来计的、深不可测的投资方法。诚然，复杂模型和高频交易属于量化范畴，但广义上，量化代表的是一种理性的思维方式。例如，当你着眼于真实数据，理性地运用逻辑分析和归纳统计得出市场的一些观点和规律，并据此制定和执行明确的交易策略时，你就是在做量化交易。普通个人投资者完全可以运用量化的方法来指导自己的投资决策，事实上，他们常常不经意间就已经用基于经验、逻辑和数学的量化投资的思维来指导自己的交易了。


    在金融市场上一直有句话，即美国是机构市，我国 A 股是散户市。据统计，美国现在量化交易方式所占比例已经超过 70%，但是我国还不到 5%。这样看来，量化交易在我国是有比较大的发展空间的。


    当前，我国的量化交易主要应用在商品期货上。随着股指期货的上市，期货市场和证券市场实现了真正意义上的互动，投资者不仅可以在期货市场上进行投机交易，同时还可以在期货与股票之间进行套利交易。利用量化交易对股指期货进行操作将会是投资者（尤其是机构投资者）的一个重要的发展方向。


    # 本书结构


    本书共 14 章，具体章节安排如下。


    +   □ 第 1 章：讲解量化交易的基础知识，即量化交易的定义、特点、应用、故事、历史及注意事项。


    +   □ 第 2 章：讲解量化交易平台，即 JoinQuant 聚宽量化交易平台的功能，账号的注册、登录及量化交易策略的创建，选股技巧，买卖条件模型，风险控制技巧，其他参数设置技巧，回测，模拟交易，实盘交易。


    +   □ 第 3 ~ 5 章：讲解量化交易开发语言 Python，即讲解 Python 开发环境及编程基础、流程控制与特征数据类型、函数与面向对象。


    +   □ 第 6 ~ 11 章：讲解 Python 量化交易策略的常用库、常用函数与对象、获取数据函数运用技巧、基本面选股技巧、技术指标函数运用技巧、回测方法与技巧。


    +   □ 第 12 ~ 13 章：讲解 Python 量化交易策略的机器算法运用技巧、因子分析运用技巧。


    +   □ 第 14 章：讲解 Python 量化交易策略实战案例。'
