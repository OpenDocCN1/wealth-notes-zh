- pgno: 18
  md: '# 第 1 章


    # 量化交易概述


    在股票市场中，大多数的交易是靠交易员手动敲键盘来操作的，“一失手成千古恨”的情况难免出现，我们把这种行为称为“胖手指”。相比之下，量化交易则如同点石成金的“仙人指”。量化交易中最美的童话就是“旱涝保收”，不管是牛市还是熊市，在大多情况下都可以赚到钱。


    +   本章主要内容包括:

    ✓ 什么是量化交易

    ✓ 量化交易与算法交易、程序化交易、技术分析、人工交易

    ✓ 为什么要学习量化交易

    ✓ 量化交易的特点与应用

    ✓ 量化交易的故事

    ✓ 国内外量化交易的历史

    ✓ 量化交易的注意事项'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 1.1 初识量化交易


    量化交易在国外已有 30 多年的历史，在这些年的交易当中量化交易的业绩相当稳定，得到了越来越多交易者的认可，市场规模不断扩大，甚至有超过非量化交易的趋势。


    # 1.1.1 什么是量化交易


    量化交易是指投资者利用计算机技术、金融工程建模等方法，对自己的交易策略进行定义和描述，以帮助投资者形成交易决策，并且严格按照设定的规则去执行交易（买、卖）的一种方式。


    量化交易可以帮助交易者制定交易决策、减少交易成本、套利和风险对冲，还可以帮助交易者在做市商时实现报价。


    # 1.1.2 量化交易与算法交易


    在当前的金融市场中，听到“算法交易”的次数可能比听到“量化交易”的次数还多。一般来讲，这两种说法是可以替换使用的，因为当前最流行的量化交易策略基本都属于算法交易的范畴。


    但是，量化交易和算法交易还是有区别的。算法交易通常是高度自动化的交易，也被称为“自动交易”或“黑匣子交易”。


    需要注意的是，当我们说“算法交易”时，并不是泛指所有高度自动化的量化交易策略，而是专门指那些持有期很短、交易比较频繁的交易策略，甚至专门指那些以降低交易成本为目的的交易策略。


    所以，本书讲的量化交易，范围比较广，不仅包括算法交易，还包括自动化程度不算高和交易频率也不是很高的其他交易。


    # 1.1.3 量化交易与程序化交易


    如果单从字面上来说，程序化交易是指所有高度自动化的量化交易策略，包括算法交易。在很多情况下，人们也确实是这么用的。不过，纽约交易所对程序交易有专门的定义，是指同时涉及
    15 个及以上的证券、总交易额至少为 100 万美元的电子交易。而这类交易很大一部分都是套利，因此当人们说程序化交易时，往往特指套利交易策略。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 1.1.4 量化交易与技术分析


    投资者很容易把量化交易和技术分析联系在一起，事实上，在量化交易中会使用一些我们常用的技术指标，而在技术分析中也会使用很多量化指标。而且，相当一部分量化交易策略和技术分析一样，都是依赖于对价格、成交额等交易信息的分析。不过，量化交易与技术分析还是有区别的。


    首先，有些技术分析方法很难被量化。例如，图形分析是技术分析的一个重要部分，可是有一些图形很难被量化定义，如波浪。因此，这些技术分析手段就无法应用在量化交易中。


    其次，量化交易并不仅限于技术分析涉及的交易信息。例如，基本面的信息数据，如收入、利润、购并等公司基本面信息，以及利率、通胀等宏观基本面信息，都可能被量化交易策略参考。


    因此，量化交易和技术分析的关系是既相互重叠又相互独立的。


    # 1.1.5 量化交易与人工交易


    量化交易与人工交易的对比，如表 1.1 所示。


    # 表 1.1 量化交易与人工交易的对比


    |  | 量化交易 | 人工交易 |

    |---|---|---|

    | 纪律性 | 忠实地执行设计者的思路,不存在主观情绪的影响,纪律严明 | 主观情绪化,恐惧、贪婪、赌气等人性弱点容易导致交易变形,纪律性较差 |

    | 精力 | 只要计算机正常、电源正常，不知疲倦 | 需要睡觉、吃饭、离开计算机;长时间在计算机前imeters不利 于身体健康 |

    | 效率性 | 理论上,从判断到下单瞬间完成,可以捕捉到突发行情 | 从决定到执行需要几个步骤,至少需要30秒,难以捕捉突发行情或捕捉的时机不好 |

    | 系统性 | 严格按照既定的一套或多套操作方法交易,可能判断系统优劣,并进行改进 | 随意性较大,很难评估优劣,对订单的处理“艺术性”更强 |

    | 可控制性 | 风险、胜率、回测率等可以根据历史数据来检测。在实际使用中根据设定的参数,风险是明确的。只要系统严谨,失控的可能性很小 | 风险不太明确,有失控的可能
    |

    | 可复制性 | 盈利模式可以无限复制,即“一劳永逸”。在时间上可以复制以往的成功模式;在空间上可以在无数个账户上复制成功模式 | 经验的形成需要足够的交易次数,并且只有交易员具备超强的心里素质时,以往的盈利模式才有可能复制。另外,一个交易员人工可操作的账户有限,所以空间上复制盈利的能力较差
    |'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 1.1.6 为什么要学习量化交易


    很多投资者可能会觉得，我做的是基本面分析，是做价值投资的，量化交易跟我有什么关系呢？即使你从没听说过量化交易，也可能是一名出色的投资者。但是，随着市场和技术的发展，无论是投资者还是证券公司等中介公司，对量化交易有所了解还是非常有必要的，因为它在发现新的空间和机会、优化当前的投资策略，以及降低交易成本方面都起着非常重要的作用，如图
    1.1 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_21_0.png)


    # 1) 发现新的空间和机会


    无论采用何种投资策略，决定成败的重要因素之一就是面临的竞争。在 1996 年，投资者几乎都在数波浪，很少有人关心公司的基本面。四川长虹（600839）、青岛海尔（600690）等上市公司，利润持续翻番，市盈率却是個位数。到上市公司进行调研，都不知道你来的目的，开股东大会也见不到几个股东。那时候确实是做价值投资的好时候，因为几乎没有竞争。


    目前，很多人都是价值投资者，大家都在研究财务报表、进行公司调研。很显然，价值投资的竞争已经非常激烈了。而量化交易还处在初级阶段，虽然有些人在进行这方面的尝试，但整体而言，规模还相当小，还有很大的进入空间。尤其是推出股指期货之后，更是扩大了量化交易策略的应用空间，提供了新的可能性。可以说，目前中国进行量化交易所面临的竞争还是比较小的，这就给量化交易者提供了发挥空间和机会。


    # 2) 优化当前的投资策略


    当前最成功的量化交易基金——“文艺复兴”（Renaissance Technologies）的创始人詹姆斯·西蒙斯（James Simons）说过，那些从事量化交易的数学家和物理学家，最大的贡献并不在于他们所掌握的理论知识，而是他们所带来的科学精神。投资者需要知道的是，绝大部分的量化交易策略实际上都是源于已有的策略。但是，当你必须把一项投资策略的所有方面都以量化的形式加以确定的时候，就不得不对这项策略的各个方面进行更深入的思考。


    看上去巴菲特和查理·芒格与量化交易没有关系，但在某种程度上，可以说他们本身就是人肉版的量化交易机器。巴菲特一直强调，投资最重要的是要保持理性，不能让情绪影响你的投资决策；'
  merge: -1
  img_proc: true
- pgno: 22
  md: '查理·芒格也强调要以“清单”的形式来进行投资判断，而这些都是与量化交易类似的原则。当你还不具备巴菲特和查理·芒格那样理性判断的功力时，了解量化交易的原则可以帮助你有效地提高当前投资策略的合理性。


    实际上，有研究显示，整体而言基于客观性标准的交易策略，比人工判断的交易策略能创造更多超额收益。当然这并不是说让你完全放弃主观判断，毕竟有些东西是很难以量化的。但是，学习量化交易的策略可以帮助你重新思考现有投资策略的各个环节，帮助你判断哪些地方可以更具备客观性，从而减少主观判断产生的错误。同时，也可以让你更加明确，哪些环节是真正依赖于你的主观判断能力的。


    # 3）降低交易成本


    对机构投资者来说，除了前面对所有投资者都适用的两个原因，还有一个更直接的原因，那就是量化交易策略可以帮助机构投资者有效地降低交易成本。


    对于拥有大量资金的机构投资者来说，自己的买单和卖单对市场的冲击产生的流动性成本是一项重要的交易成本。而量化交易的一个重要功能就是通过特定的算法有效地减少自己的买卖委托对市场产生的冲击，以降低自己的交易成本。


    据统计，2018 年中国基金的平均周转率为 2.9 倍。假如交易成本平均降低 0.1 个百分点，就相当于多增加了 0.1%×2.9=0.29%的收益率。而在基金排行榜上，这可能意味着好几位排名的差异。实际上，如果策略得当的话，能降低的交易成本很可能不止
    0.1 个百分点。


    # 1.2 量化交易的特点


    量化交易的特点表现在四个方面，分别是严格的纪律性、完备的系统性、妥善运用套利的思想、靠概率取胜，如图 1.2 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_22_0.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 1) 严格的纪律性


    量化交易有着严格的纪律性，因为只有这样才可以克服人性的弱点，如贪婪、恐惧、侥幸心理，以及克服认知偏差。一个优秀的投资方法应该是一个“透明的盒子”，所以投资者的每一个决策都应该是有理有据的，特别是要有数据支持的。


    假如有人问你，某年某月某一天你为什么购买某只股票，你就可以打开量化交易系统，系统会显示出当时被选择的这只股票与其他的股票相比在成长面、估值、资金、技术、买卖时机等方面的综合评价情况。这个评价是非常全面的，比普通投资者通过拍脑袋或者只看某一个指标确定的决策更具说服力。


    # 2) 完备的系统性


    完备的系统性具体表现为“三多”。首先是多层次，我们在大类资产配置、行业选择、精选个股三个层次上都有模型；其次是多角度，量化交易的核心投资思想包括宏观周期、市场结构、估值、成长、盈利质量、分析师盈利预测、市场情绪等多个角度；最后是多数据，即海量数据的处理。


    人脑处理信息的能力是有限的。当资本市场只有几十只股票时，定性投资基金经理是有优势的，因为他可以深刻分析这几十家公司。但当资本市场有成千上万只股票时，强大的定量化交易的信息处理就体现出它的优势了，即它可以捕捉更多的投资机会、拓展更大的投资机会。


    # 3) 妥善运用套利的思想


    量化交易正是寻找估值洼地，即通过全面、系统性地扫描并捕捉错误定价、错误估值带来的机会。定性投资的大部分时间都是在琢磨哪个企业做得比较好，那只股票可以挣钱。与定性投资不同，量化交易的大部分精力花在分析哪里是估值洼地，哪只股票被低估了，然后买入被低估的股票、卖出被高估的股票。


    # 4) 靠概率取胜


    靠概率取胜表现在两个方面：一是定量投资不断从历史中挖掘有望在未来进行重复的规律并且加以利用，二是在实际操作股票的过程中，运用概率分析来提高买卖成功的概率和仓位控制。


    # 1.3 量化交易的应用


    量化交易技术的多种具体方法，在投资品种选择、投资时机选择、算法交易、各种套利交易、资产配置等领域得到广泛应用，如图 1.3 所示。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '![](img/e6d4c365781f4dd8cb814bd56923b0bc_24_0.png)


    图 1.3 量化交易的应用


    # 1.3.1 投资品种选择


    同样是投资金融市场，有的投资者可以赢利数倍，有的投资者则会出现亏损，这是为什么呢？虽然原因很多，但最重要的还是在于个人的投资品种选择水平。


    我国沪深股市发展至今，已有 3000 多只股票。经过二十多年的风风雨雨，投资者也已日益成熟，从早期个股普涨普跌发展到现在，金融市场已经彻底告别了齐涨齐跌的时代。从近几年的行情来看，每次上涨行情中，涨升的个股占比不超过一半，而走势超过大盘的个股更是稀少。很多投资者即使判断对了股票大的走势，却由于选股存在偏差，仍然无法获取盈利，可见选股对投资者是多么重要。


    量化选择投资品种，就是利用量化的方法判断某上市公司是否适合买进。如果某上市公司满足该量化方法的条件，就把这只股票放到自选股中；如果不满足该量化方法的条件，就不将其加入自选股或从自选股中删除这只股票。


    # 1.3.2 投资时机选择


    量化选择投资时机，是指采用量化的方式判断买点和卖点。如果判断行情是上涨行情，即牛市，则可以买进后持有；如果判断行情是下跌行情，则要果断卖出空仓；如果判断行情是震荡行情，则可以进行高抛低吸，灵活操作。


    # 1.3.3 算法交易


    算法交易，是指设计算法，并利用计算机程序发出交易指令的方法。在交易中，程序可以决定的范围包括交易时间的选择、交易的价格，甚至包括最后需要成交的资产数量。'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# 1）算法交易的类型


    算法交易包括被动型算法交易、主动型算法交易和综合型算法交易三种，如图 1.4 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_25_0.png)


    图 1.4 算法交易的类型


    # （1）被动型算法交易。


    被动型算法交易，又称结构型算法交易，该交易除利用历史数据估计交易模型的关键参数外，不会根据市场状况主动选择交易时机和交易数量，而是按照一个既定的交易方针进行交易。该策略的核心是减少滑价（目标价与实际成交均价的差）。被动型算法交易发展最为成熟，使用也最为广泛，如在国际市场上使用最多的成交加权平均价格（VWAP）、时间加权平均价格（TWAP）等都属于被动型算法交易。


    # （2）主动型算法交易。


    主动型算法交易，也称机会型算法交易，该交易根据市场状况做出实时的决策，并判断是否交易、交易的数量、交易的价格等。主动型算法交易除了努力减少滑价，把关注的重点逐渐转向了价格趋势预测。


    # （3）综合型算法交易。


    综合型算法交易是前两者的结合。这类算法常见的方式是先把交易指令拆开，分布到若干个时间段内，每个时间段内具体如何交易由主动型算法交易进行判断。两者结合可达到一种算法无法达到的效果。


    # 2）算法交易的交易策略


    算法交易的交易策略主要有三种，分别是降低交易费用、套利和做市，如图 1.5 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_25_1.png)


    图 1.5 算法交易的交易策略'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 1）降低交易费用


    算法交易的策略之一是将大单指令拆分为若干个小单指令渐次进入市场，这样就可以避免大量资金同时进入市场使交易价格和交易费用提高。所以，量化交易可以降低交易费用。这个策略的成功程度可以通过比较同一时期的平均购买价格与成交量加权平均价来衡量。


    # 2）套利


    典型的套利策略通常包含三四个金融资产，如根据外汇市场利率平价理论，国内债券的价格、以外币标价的债券价格、汇率现货及汇率远期合约价格之间将产生一定的关联。如果市场价格与该理论隐含的价格偏差较大，且超过其交易成本，则可以通过四笔交易来确保无风险利润。股指期货的期限套利也可以用算法交易来完成。


    # 3）做市


    做市就是在当前市场价格上挂一个限价卖单或在当前价格下挂一个限价买单，以便从买卖差价中获利。


    # 1.3.4 各种套利交易


    套利交易是指利用相关市场或相关电子合同之间的价差变化，在相关市场或相关电子合同上进行交易方向相反的交易，以期望价差发生变化而获利的交易行为。套利交易模式主要有四种，分别为股指期货套利、商品期货套利、统计套利和期权套利，如图
    1.6 所示。


    ![](img/e6d4c365781f4dd8cb814bd56923b0bc_26_0.png)


    # 1）股指期货套利


    股指期货套利，是指利用股指期货市场存在的不合理价格，同时参与股指期货与股票现货市场交易，或者同时进行不同期限、不同（但相近）类别股票指数合约交易，以赚取差价的行为。股指期货套利主要分三种，分别是期现套利、跨期套利和跨市套利。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 2）商品期货套利


    与股指期货对冲相似，商品期货同样存在套利策略，在买入或卖出某种期货合约的同时，卖出或买入相关的另一种合约，并在某个时间同时将两种合约平仓。


    在交易形式上它与套期保值有些相似，但套期保值是在现货市场买入（或卖出）实货、同时在期货市场上卖出（或买入）期货合约；而套利却只在期货市场上买卖合约，并不涉及现货交易。商品期货套利主要有期现套利、跨期套利、跨市场套利和跨品种套利四种。


    # 3）统计套利


    有别于无风险套利，统计套利是利用证券价格的历史统计规律进行套利的，是一种风险套利，其风险在于这种历史统计规律在未来一段时间内是否继续存在。


    统计套利的主要思路是先找出相关性最好的若干对投资品种（股票或者期货等），再找出每一对投资品种的长期均衡关系（协整关系），当某一对品种的价差（协整方程的残差）偏离到一定程度时开始建仓，买进被相对低估的品种、卖空被相对高估的品种，等到价差回归均衡时获利了结即可。


    # 4）期权套利


    期权（Option）又称选择权，是在期货的基础上产生的一种衍生性金融工具。从其本质上讲，期权实质上是在金融领域将权利和义务分开进行定价，使得权利的受让人在规定时间内对于是否进行交易行使其权利，而义务方必须履行。


    在期权交易时，购买期权的一方称为买方，出售期权的一方称为卖方。买方即权利的受让人，卖方则是必须履行买方行使权利的义务人。


    期权的优点在于收益无限的同时风险损失有限，因此，在很多时候利用期权来取代期货进行做空、套利交易会得到更小的风险和更高的收益率。


    # 1.3.5 资产配置


    资产配置（Asset Allocation），是指根据投资需求将投资资金在不同资产类别之间进行分配，通常是将资产在低风险低收益证券与高风险高收益证券之间进行分配。


    量化交易管理将传统投资组合理论与量化分析技术结合，极大地丰富了资产配置的内涵，形成了现代资产配置理论的基本框架。它突破了传统积极型投资和指数型投资局限，将投资方法建立在对各种资产类股票公开数据的统计分析上，通过比较不同资产类的统计特征，建立数学模型，进而确定组合资产的配置目标和分配比例。'
  merge: -1
