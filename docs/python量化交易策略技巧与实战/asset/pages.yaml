  md: '当今，全世界有超过万亿美元的资产有的全部、有的部分是以量化分析为基础进行资产配置的。资产配置包括两大类，分别是战略资产配置和战术资产配置；还包括三大层次，分别是全球资产配置、大类资产配置和行业风格资产配置。


    # 1.4 量化交易的故事


    下面通过三个量化交易的故事，讲解量化交易的起源、算法基石、优势与风险。


    # 1.4.1 朱尔斯·雷格纳特的量化交易故事


    从现存资料来看，最早采用科学方法来研究和发现股票价格涨跌规律的人，既不是股票和股市交易起源地的荷兰人，也不是将金融实践发扬光大的英国人，更不是一开始就和金融共生的美国人，而是看起来有些“不靠谱”的法国人。


    最早采用量化方法分析数据变化并从中挖掘市场价格涨跌规律的是 1834 年出生于法国贝当的朱尔斯·雷格纳特（Jules Regnault）。雷格纳特出身贫寒，成年后到巴黎证券交易所成为股票经纪人助理，在跑腿送信的日常工作中，股票涨跌强烈激发了他探寻其规律并赢取股市财富的梦想。


    雷格纳特鄙弃内幕交易、造谣传言、跟风赶浪等投机手段，在他出版的《概率计算和股票交易哲学》一书中一一列举了当时股票交易中常见的“不诚实赚钱行为”。他先站在道德的高度对这些行为予以严厉抨击，他说：“正直的投资者想一想这种诡计就会脸红”；继而批评了试图在技术图表中寻找短线交易机会的投机者，他说：“他们学了很多，预测了很多，对概率卓有研究并自认为精于投机……但他们的快速破产是概率论的必然结果，这如同行星围绕轨道运行一样确定。”因为短线交易类似赌博，加上当时交易所可采用
    20 倍杠杆，所以频繁交易产生了许多快速破产案例。雷格纳特坚信“上帝已经以完美顺序为万物进行了测量、计算和分配”，并在书中详细阐述了自己发现的市场涨跌规律。


    为什么雷格纳特强调短线交易的人一定会“快速破产”？


    因为雷格纳特认为，短线交易与赌博非常类似。如果你与朋友赌博，你输的就是他赢的，但股票交易不一样，股票交易存在手续费（当时巴黎证券交易所每一次股票交易的佣金为实际交易金额的
