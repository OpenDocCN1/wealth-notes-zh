  md: '# 8.7 get_industry_stocks()函数的运用技巧


    get_industry_stocks()函数可以获取在给定日期一个行业的所有股票代码，其语法格式如下：


    ```

    get_industry_stocks(industry_code, date=None)

    ```


    参数 date 和返回值，都与 get_index_stocks()函数相同，这里不再赘述。


    参数 industry_code, 是指行业代码。行业代码有很多，常用的行业代码及意义如下。


    +   A01：农业。

    A02：林业。

    A03：畜牧业。

    A04：渔业。

    A05：农、林、牧、渔专业及辅助性活动。

