    在交涉中抛弃胜负观念是非常重要的件事。而在这种相互让步的过程中，如果在乎“胜负”的问题，将会错失解决问题的契机。而“先让步的话，感觉就是输了”，这种莫名其妙的自尊心，更身使得交'
