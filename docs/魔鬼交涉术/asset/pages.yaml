  md: '“让弱势在交涉之中变成一项利器。”


    “让拙于言词在交涉之中变成一项武器。”


    “怎么可能会有这种事！？”


    或许你会很不屑地这么说吧？然而，我们将通过本书，证明以上的标题所言不虚。你只要照做就行了。


    我目前从事律师工作，每天都不断地在进行交涉，通过交涉，解决许许多多事件。我也写过几本关于交涉和辩论的书藉，经常受邀演讲“交涉方法”一类的专题，并在商业杂志中接受有关交涉的专访。


    听到我这么说，或许你会觉得：“这家伙和我是不同人种。”


    然而，如果你知道我以前其实是个胆小、常被欺负的小子，你会做何感想呢？


    如果你了解了这样的我是如何变成一名律师，变成一位交涉专业人士的，你或许也能解开擅长交涉的秘密。'
