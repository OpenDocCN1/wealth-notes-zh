- pgno: 77
  md: '“倾听”的另一个好处是可以收集情报。


    交涉时最重要的，是掌握自己和对方的相对关系，以己之强，攻彼之弱。要想做到这一点，必须尽量收集对方完整的情报。


    法国著名的外交家凯利耶曾经说过：“最妥善有效的花钱方式，是把钱花在间谍身上。”由此可尽情报收集是多么重要。


    交涉之前，当然要做好了情报收集的工作，但是在交涉开始之后，同样也可以收集情报。在交涉中可以从对方身上套出来的情报，有以下五项。


    # ① 对方的需求


    一旦了解对方的需求，就能尽量提出令其满意的条件，从而实现我方的最大利益。举例来说，当厂商和材料供应商进行交涉的时候，如果厂商希望提前上市新商品，因此要求供应商缩短交货期
    的时候，供应商便可以用较短的交期做为交涉的条件，将价格抬高。


    # ② 对方的优势和弱点


    如果了解了对方的优势和弱点，就可以无视对方的优势，而针对对方的弱点展开彻底的攻击，让交涉朝有利的方向进展。举例来说，如果供应商的优势是先进的技术，弱点是出货延误，就可以无视先进'
  merge: -1
  img_proc: true
- pgno: 78
  md: '的技术，只针对出货延误进行强调，让交涉对我方有利。


    # ③ 对方的期限


    如果知道对方的期限，就可以将我方的期限订得比其晚一些，等到时间逼近对方的期限，再逼迫其做出让步。举例来说，如果已知对方一定要在 5 月 15 日之前完成这项交易的话，那么我方可在
    5 月 14 日以前做出完全不让步的姿态。对方没有其他选择，自然会在期限之前做出让步。


    # ④ 对方的价格中立点


    如果知道对方的中立点在哪里，就可以开门见山地谈到这个价格。比方说，如果对方刚开始要求的价格是一千五百万，我方若是可以预测对方的中立点是一千万左右，就能够一下子把价格压到一千万。


    # ⑤ 交涉决裂时的备选方案


    如果知道对方的备选方案，就可以了解对方对这项交易的执着程度。对交涉的执着程度越强，立场将会相对越弱。


    举例来说，如果除了从我方公司进货，对方没有其他渠道可以取得这类商品，也就是处于没有备选或替代方案的状态，那么如果不与我方合作对方便根本无法完成这项交易。换句话说，对方对这项交易十分执着，这对我方的交涉相当有利。'
  merge: -1
  img_proc: true
