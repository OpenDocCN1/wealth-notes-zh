  md: '# 混淆对方的降价法


    当然，交涉的时候故意混淆对方也是很重要的。以刚刚的例子来说，可以做出以下的让步。


    ![](img/988ea0d30fe47ee5a2ee2de4178dea5f_145_0.png)


