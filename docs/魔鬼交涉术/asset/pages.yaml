- pgno: 167
  md: '# 扮演“想要做的自己”


    所谓弱势的人，就是没有自信的人。如果没有自信的话，在交涉时想要让对方接受自己的要求，就会是一件相当困难的事情。


    因此，这里要教你拥有自信的方法。那就是让自己表现出似乎很有自信的模样。


    当我们失意的时候，身体也会无精打采，整个人都会弯腰驼背。而在开心的时候，脸上自然会绽放笑意；生气的时候，我们的表情会随着变凶，肩膀也会拱起来。身体和心灵的步调总是一致的。


    这么说来，心灵会支配身体？所以身体才会一直跟心灵的步调一致？其实并不是这么回事。让你的心灵配合身体也是有可能的。就算不开心，只要露出笑容，蹦蹦跳跳，人就会变得充满朝气。快步行走的话，心情会活泼起来，慢慢行走的话，人就会变得无精打采。


    之所以会这样，是由于人类的“一贯性法则”。人类是单一的 存在，所以会尽量让内外获得一致。因此，会设法让心灵的状态 与身体的状态同步。一般情况下，都是身体配合心灵，但也可以
    反其道而行。


    或许你会这么说：“难过的时候，怎么可能笑得出来！”


    事实并非如此。那只是你不想笑而已，那只是你想哭泣而已，所以你的心才维持在哭泣的状态。试着强迫自己挤出笑脸，真的笑出来吧。'
  merge: -1
  img_proc: true
- pgno: 168
  md: '试着让自己蹦蹦跳跳，试着为自己打气！这样做之后，先前的悲伤，便会一扫而空。


    # ◇ 以行动来改变自己


    “人会变成自己想要的模样。”我对这一点深信不疑。

    如果你心目中有自己理想的模样，只要起而效之就对了。天长日久之后，必会看到成效。

    那么，你已经知道这个让人变得自信的方法了。一点儿都没错，只要表现出自信的样子就行了。展现赞许的笑容、有力的眼神，抬起你的下巴，摆出潇洒自得的模样吧。同时，还要试着压低音量，充满自信地说话。你会随之发觉，周遭的人看你的眼神也会跟着改变。

    我以前也是一个很懦弱的人。然而，现在身边的人都 说我是个“充满霸气的人”。这是自身的改变。你当然也可以有这样的改变。

    歌德曾经这样说过：“拥有自信，便能获得别人的信赖。”

    来吧！试着表现出充满自信的模样吧！潇洒地挺起胸膛，露出自信的表情，迈出比平常更轻快的脚步吧！自信将会洋溢全身。


    > 人会变成自己想要的模样。

    即使没有自信，也要抬头挺胸，昂首阔步！'
