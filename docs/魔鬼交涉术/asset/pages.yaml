- pgno: 13
  md: '# 懦弱的少年


    年幼的时候，我是个身材矮小、非常懦弱、经常受到欺负的小子。在幼儿园里是淘气鬼们捉弄的目标，在家里也经常被哥哥欺负，老是哭个不停。


    上小学之后，虽然功课还算不错，但是由于不擅言词，就算遇到不开心的事也会选择沉默，无法反驳别人，我就是在这种不会吵架的状况下长大的。


    上大学之后，我一个人来到东京居住。当时受房屋中介的哄骗，租了一间离学校相当远的房子；也曾在街头被强迫推销，购买了贵得离谱的商品。现在回想起来，那时万万也料想不到缺乏沟通能力的我将来会成为一个以交涉为职业的年轻人。


    你的少年时代又是怎么样的呢？


    如果不是像我少年时代那样不堪，你或许早已具备了比我更优秀的交涉潜力。'
