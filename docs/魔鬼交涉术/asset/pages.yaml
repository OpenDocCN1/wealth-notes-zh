- pgno: 90
  md: '# 打破防御的必杀技：“一点都没错！”


    交涉的时候，要让彼此的主张可以取得中立点。有时候必须拒绝对方的主张，才能行使自己的主张。


    那么，老实人要如何否定对方的主张，让自己的主张获得对方的认同呢？


    像这种时候，就应该回答：


    **“我很清楚你的意思。”**


    **“你说得一点都没错！”**


    以此来表示赞同对方。


    “什么？！这么做的话，不是更会被对方吃得死死的吗？”


    或许你会这么想。不过，这并非只是单纯的赞同而已，只要接着陈述自己的主张就行了。


    # “YES-BUT”的陷阱


    “先同意对方的主张吧。”然后用以下的方式继续发展。


    “你说得一点儿都没错。不过……”


    一旦说出“一点儿都没错”，表示了赞同之后，对方的武装也会随之解除，之后再以“不过……”来加以反驳就可以了。这就是所谓的“YES-BUT”交涉术。


    不过这种做法也有不妥之处。即使说出“一点儿都没错”，但是'
  merge: -1
  img_proc: true
- pgno: 91
  md: '后面一旦接上“不过”，仍然会让对方感觉自己的意见遭到了否定，从而再次武装自己。既然已经让对方解除了武装，就不该让他再次武装。因此，最好不使用“不过……”这类的连接词。


    那么究竟该怎么做才好呢？方法有以下几种。


    如果对方说“价格太贵了”的话，可以回应：


    “一点儿都没错。因为它配备了最佳的性。能。”


    “你说得一点儿都没错。你应该很想知道价格会这么贵的原因吧？现在就请我向你说明原因所在。”


    “一点儿都没错。价格的确是个问题。不过，你知道这个价格到底是怎么确定的吗？”


    以上全都是“一点儿都没错”来同意对方的主张。但是之后接续的内容，全部都对“价格太贵”这个主张提出了反驳。这和“一点儿都不贵，因为……”所表述的内容相同，只是以“一点儿都没错”来开头而已。不过，就因为这些许的差异，对方的感觉却会截然不同。


    # ◆ 通过肯定打破对方的防御


    人们对于自己的主张究竟被接受还是被拒绝，总是非常关心。要是被人批评说“你错了”，身体会变得僵硬，进而采取防御的姿态。不过，如果对方说“一点儿都没错”的话，身心都会比较放松。在这之后，将会容易接受随后的说明，在心理状态上可以说是迥然不同了。'
