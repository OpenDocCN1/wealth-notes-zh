- pgno: 67
  md: '了相对强势的一方。


    结果，我把这套房子以月租十九万的价格租给了他。


    过了几年之后，我想把房子拆掉改建，因此想请房客搬走。可是，房客一直都很遵守租赁合约，没有其他终止租赁的理由，是我提出愿意付一百万搬家费的条件。不过房客表示，他目前没有金钱上的困难，这一百万他并不看在眼里，而且他真的很喜欢这套房子。在这种情况下，在相对关系中，房客要比我更强势。


    不过后来房客发生了资金困难，滞纳了三个月的房租。于是我以租金迟滞的理由，对房客发出解除租约的存证信函，并开始准备提起诉讼。


    这时候房客表示，只要给他一百万的话，他会马上搬走。但此时由于是房客未付房租在先，如果提出诉讼，便可能立刻解除租约，强迫其搬迁。于是，我撤回了一百万搬家费的提议，要求无偿搬迁。在此时的相对关系中，我比房客要更强势。


    # 天时地利人和


    从上述案例可以看出，在交涉的时候，双方的相对关系会对交涉的发展产生很大影响。如果自己明明处于弱势，却误认为身处于强势，在该让步的时候不让，之后便会蒙受相当大的损失。相反，明明自己处于强势，但却以为是弱势做出了让步，当然也是一种损失。


    室町时代的能剧大师世阿弥曾经说过以下这段话。


    “时分堪为惧，去年花盛开，须知今岁花不在。时亦有所别，男'
  merge: -1
  img_proc: true
- pgno: 68
  md: '时复女时。”（《风姿花传》）


    所谓的男时，是指气势强的时候，而女时则是指气势弱的时候。也就是说，人生在世会有时运高低、运势有无的变化。因此，在交涉的时候，也要注意并配合情势才行。


    好强好胜的人，通常都会漠视对方和自己之间的这种相对关系，只是一味地想要压过对方。然而，一旦漠视情势，总有自己转为相对关系中较弱一方的情形，便会自食恶果。


    而气势较弱的人对双方的相对关系通常很敏感，反而会特别注意。孙子曾经说过：“知己知彼，百战不殆。”


    只要清楚双方的相对关系，以此为基础，就可以选择战或不战，也可以选择适当的战术了。


