  md: "# 借由 “假设说话术” 牵制对方\n\n假设说话术除了具有套出对方情报的作用之外，还有 “牵制对方立场” 的效果。\n\n假设你提出 “如果价格方面觉得满意的话，是否就会购买”，而对方回答\
    \ “YES” 的时候，就等同对方答应你 “如果价格方面满意的话，我会购买”，此时就不太可能提出额外的服务或保修之类的交涉了。\n\n这是利用了心理学中的\
    \ “一贯性法则”。换言之，一旦一个人表明了自己的立场，就会被其所束缚，无法采取与其相矛盾的行动。以刚刚的例子来说，一旦说出 “如果价格折扣满意的话，我就购买”\
    \ 这类的话，事后就很难改口了。\n\n使用假设说话术，不仅不用提供自己的情报就能套出对方的情报，还有可能束缚对方。由于兼具了这两种作用， “假设说话术”\
    \ 才荣膺为交涉必胜的工具。\n\n先来看一个不使用 “假设说话术” 的案例。\n\n卖方：“一百个一亿元。” \n 买方：“我们公司预计购入三百个。那就是三亿，能不能折价到两亿五千万？”\
