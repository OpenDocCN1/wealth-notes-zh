- pgno: 160
  md: '# 替代手段决定输赢


    所谓的替代手段，是指一旦交涉破裂的话，接下来可以采取的手段。面对交涉，一定要先想好替代的手段才行。这跟气势强弱无关，而是所有交涉都必须具有的条件。


    有一家公司，原料一向固定从A公司购买。有一天A公司突然发了一份通知，要涨价10%。这时候，这家公司的采购表示，“办不到。我们必须维持之前的价格。”完全不接受新的价格。


    后来，他们收到了A公司寄来的解约通知。采购做梦也没想到交易会被解约，只能急急忙忙去寻找其他材料供应商。结果，他没有办法找到其他的替代渠道，在不得已的情况下，只好向A公司低头。如此一来，A公司看准了他们的弱点，一举把价格抬高了20%。因为没有其他渠道，这家公司的采购只好按照A公司提出的价格购买。


    这家公司起初的态度非常强势。然而，在供货厂商只有一家的状况下，由于没有替代手段，因此双方的相对关系也随之逆转。既然这家公司必须采购原料，只好落入了弱势的立场。


    由于非得从A公司进货不可，在这种状态之下，这家公司会对这桩采购交涉非常执着，最后被迫做出退让。然而，如果A公司不行还有B公司可选择的话，由于对交涉的执着程度较低，如果A公司抬高价格，这家公司的采购也不会自乱阵脚。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# ◇ 有了替代手段，就能轻松面对交涉


    所谓的交涉，目的在于获得自身的最大利益。因此，如果能够让对方让一步就尽量不让步。要想做到这一点，必须有替代的手段才行。


    以刚刚的交易为例，在知道除了 A 公司之外，没有其他原料供应来源的状况下，首先必须倾其全力寻找替代手段，再与 A 公司展开交涉。或者是这次就放弃这批原料，把心力专注在其他的业务上。如若不然，就会被撕掉退路，陷入不得不交涉的局面。


    当然，是否有替代手段的确相当重要，但对对方而言亦是如此。以刚刚的例子而言，如果这家公司是 A 公司的大客户，一旦 A 公司无法接到这张订单，立刻就会陷入资金周转困难从而破产的状况，那么，A
    公司就不得不让步降价了。不过，如果除了这家公司之外，A 公司还有其他的买主，那么 A 公司就能游刃有余，而不会有所退让。


    从以上的例子可以看出，在决裂的时候是否有替代手段，对决胜负确实具有莫大的影响力。因此，应该采取确保本身备有替代手段，同时破坏对方的替代手段这种战略。至于该如何破坏对方的替代手段，方法相当之多，比如可以约定在一定的期间之内，只能和自己的公司进行交涉，从而独占交涉权，等等。


    ![](img/988ea0d30fe47ee5a2ee2de4178dea5f_161_0.png)


    > 交涉时过于执着的人将处于不利的位置。

    准备好替代的手段，轻松地面对交涉吧！'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# “先”或“后”提出要求，怎样比较有利？


    由哪一边先提出要求，必须在交涉之前先考虑清楚。那么，究竟“先”和“后”怎样比较有利？


    **憨厚老实的人，在对方之后提出要求比较好。** 如果是自己先提出要求，会不会有“条件是不是提得太高了？”“会不会吓到对方？”“会不会激怒对方？”这类的担心呢？如果还不习惯交涉，在提出要求的时候，就经常会有这方面的担心。


    一旦有了这种无谓的担心，往往会提出比原本门槛还要低的要求。也就是说，如果原先希望的金额是一千万元，但是却想着，“这么做或许会引起对方的不快，还是打个折要八百万元就好了。”最后，常常会演变成这种后果。


    但这种做法，实在是不折不扣的错误。所谓的交涉，是以一开始提出的金额为基准，再进行拉锯战。起跑点是一千万元和起跑点是八百万元，衍生出的结果会大相迳庭。


    比方说，交涉的双方要求以折中点来解决事情。如果己方要求一千万元，对方只肯付五百万元，“那么就折中一下，付七百五十万元来解决吧。”不过，如果一开始己方要求八百万元，对方只肯付五百万元，“那么就取折中，六百五十万元吧。”如此一来，就会妥协于较低的金额。


    与擅长交涉的人谈话时，通常我都会说，“请先提出你的要求。”以此来礼让对方，因为气势较弱的老实人并不适合先提出要求。'
