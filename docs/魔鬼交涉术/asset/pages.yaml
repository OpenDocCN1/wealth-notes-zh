- pgno: 16
  md: '# 这招行得通！


    就在这时，我看了一本名为《实质利益交涉法：跳脱立场之争》（*Getting to Yes: Negotiating Agreement Without Giving
    In*）的书。


    这本书将类似我小时候那种“沉默不言、配合对方”的交涉，称为“软式交涉”，这是必将被对方牵着鼻子走的交涉类型。而当上律师之后，我所使用的交涉方式，则是以打垮对方为目的的“硬式交涉”，书中说明这种方法也不会带来很好的结局。


    事实的确如此。不过，除了软式和硬式之外，还有什么其他交涉方法呢？


    “哈佛交涉术”就是不同于这两种类型的谈判方法，它包括以下四项原则：


    +   1. 将人和问题分离。

    2. 焦点不放在立场，而放在利害上。

    3. 决定行动之前，先考虑诸多的可能性。

    4. 尽可能以客观的标准来强调结果。


    # ◇ 将人和问题分离


    简单而言，就是不要被感情牵着鼻子走。哈佛交涉术特别强调的就是不要在谈判的时候带入感情。


    举例来说，当先生问太太“我可不可以买一台新电脑”的时候，'
  merge: -1
  img_proc: true
- pgno: 17
  md: '遭到太太反驳：“你说的这是什么话，你只会考虑到自己的需要。休假的时候也不陪陪孩子，只会玩你的电脑。我怎么可能!会让你买！”


    在这种情况下，先生应该感觉自己遭受攻击了吧？所以他会反击。


    “你说的这是什么话？你以为是靠谁你才有饭吃的？”


    哇！相信你一定可以想象得到接下来的局面了吧。


    其实，在这种状况之下是完全无法讨论事情的。这么一来已经演变成了人和人之间的感情问题，至于电脑的问题，早就被扔到九霄云外了。


    如果这时候先生的回应是：“原来如此。真的给你添麻烦了。这个礼拜六我带孩子去打棒球好了。可是电脑是另外一回事。电脑如果有问题，我就不能在家里准备工作资料了。”接下来的发展应该就会变得截然不同吧。


    这就是所谓“将人和问题分离”的原则。


    # 焦点不放在立场，而放在利害上


    意思是说，在交涉的过程中不要死硬地抱着已经表明过的立场。


    举例来说，如果一开始的要求是现金一千万。而在交涉的过程中，如果可以取得价值一千万的不动产的话，所获得的经济效果其实是相同的。但是如果拘泥在“现金一千万”，就会看不到其他可能的解决办法，而变得无法灵活地进行交涉。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# ◆ 决定行动之前，先考虑诸多的可能性


    例如，当先生提出想买电脑的时候，太太不应该立刻决定“不行不行，我反对”，而是应该先考虑“能不能把旧的电脑拿去修理”、“买一台二手的应该也一样可以用啊”这类其他的可能，再一一加以分析。


    # ◆ 尽可能以客观的标准来强调结果


    在交涉双方之间受到意志或感情所左右而无法达成共识时，**寻求专家的意见或法律、习惯等客观的标准来取得中立点**，以此来排除主观感情因素。


    比如，当进行不动产买卖的时候，卖方主张“五千万”，而买方主张“四千万”。这时候可以采取“委托不动产鉴定专家，再依鉴定的价格来商谈交易”的做法，这样一来就排除了双方的主观感情因素，借由客观标准来取得突破。


    至此，你是不是也觉得哈佛交涉术是一套了不起的办法呢？


    我本以为，我的一切问题都获得了解决。我也十分相信“若是很好运用这套理论的话，一定可以交涉成功”。'
