  md: '理由是租住方不付房租，看起来这本是一场胜券在握的案子。我认为我方完全没有让步的必要，于是朝着完全不妥协的方向进行交涉。然而，对方也意气用事，导致一直无法达成和解的共识。虽然之后的判决是我方胜诉，但是对方却接着再提起上诉，结果到退还房子时已整整过去了一年的时间，我们仍没拿到之前未付的租金，损失相当惨重。“如果在开始，我可以顺利地和对方谈判以求和解的话，对方会不会立刻搬走呢？”我苦思着这个疑问。


    “那么拼命苦读才当上了律师，为什么会这么没用？会不会是我不适合当律师？早知如此，学生时代应该花更多时间玩乐才对……”'
