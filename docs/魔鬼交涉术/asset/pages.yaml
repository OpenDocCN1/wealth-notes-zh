- pgno: 14
  md: '# 本不适合当律师的我


    这样的我，之所以会对交涉术有所觉醒，要回溯到参加司法考试的时期。


    我在大学三年级的时候，决定参加司法考试。司法考试必须准备的科目是辩论学。这是一门主要研修如何严厉地批判对方的说法，并且证明自己的说法有多优异的学问，也可以说是对交涉力加以锻炼的一门功课。


    “这些真是太有趣了！”于是我专注于辩论学的研习，系统地学习了逻辑思维及辩论的方法。


    这么做之后，不可思议的事情发生了。在不知不觉之间，我和别人辩论的能力变得十分强大。我发现不管对方说什么，我都可以进行反驳。


    在二十三岁的时候，我通过了司法考试，并在二十五岁当上了律师。成为律师的我，以在司法考试中所学的辩论方法做为武器，可以彻底地辩赢对方、击溃对方，获得了相当不错的成绩。


    然而，即使可以让对方哑口无言，但是在交涉方面却仍是毫无建树。“咦？我明明已经摆倒对方了呀，为什么仍谈判不出好结果呢？那就再加强火力吧！”但是，我却发现虽然自己能让对方越来越没有反击的能力，结果却往往朝着更坏的方向发展。


    这个时期，在一场关于租赁的官司中，我负责为房东辩护，辩护'
