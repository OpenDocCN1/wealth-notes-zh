    # 《魔鬼读心术

    ——心理学家教你看人看到骨子里》


    （瑞典）亨瑞克·费克塞斯 著


    中文版 2010 年 10 月即将出版


    **来自北欧的超强读心术，瑞典最受欢迎的企业讲师，助你工作、生活皆得意！翔实呈现表情与肢体语言差别，让你一看就懂！**


    只要眼神接触，就能说出对上方手球的颜色，这可不是魔术，而是读心！握住犯罪小说家的手，就能找出小说家锁定的凶手和被害人，这也不是通灵，还是读心！能读心，就能轻松解决工作上的障碍、人际关系的烦恼；如果不懂得读心，纵使有
    A 级身手也枉然！掌握人心、洞悉人性，在瞬息万变的时代创造生存利基！


    ![](img/988ea0d30fe47ee5a2ee2de4178dea5f_4_0.png)


    （本书台湾版书影）


    动作、声音、表情、手势都在透露一个人的心思，而且常常跟言语传达的讯息相反。本书就要为你揭露这些隐藏的讯息，并以幽默的方式提供你一輩子受用不尽的读心技巧。


    本书作者是瑞典读心术大师兼心理学鬼才，他判读人心的程度，仿佛魔术师或拥有通灵超能力的人。他认为，一般人在沟通时，经由语言表达出来的仅有 10%的讯息，因此必须透过肢体语言、声音、表情等的综合解读，才能真正了解对方。


    在他设计的许多练习、肢体语言图片及风趣的解说带领下，你将能：一眼看出对方没说出口的情绪和意图；在他人丝毫未觉的情况下，以肢体语言和心理技巧让对方完全信服你；成为人肉测谎机；为自己和他人植入特定的正向情绪按钮（心锚），随时随地加以运用；不用开口告白，仅以细微的眉目传情，就让对方喜欢你；学会逗人开心的读心术技巧，适时施展，让周围的人大吃一惊。


    **读心并不神秘，请跟着本书仔细检视这些技巧，好好锻炼，让它们越磨越光，发挥最大功效。**'
