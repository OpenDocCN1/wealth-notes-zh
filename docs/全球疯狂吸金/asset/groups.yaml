    因为一诺老师自己投资很多项目、顾问很多企业，深入奔驰、宝马、丰田、三洋、万科、联想、腾讯等国内外知名企业学习，一诺老师的知识来自市场上成功的案例，不是书本！


    你看到很多闭门造车的讲师/作者，意淫出来的作品！结果你买了这些人的假书，发现越看越糊涂！这些讲师/作者还振振有词，说你基础太差了，这么简单都不懂？我呸！


