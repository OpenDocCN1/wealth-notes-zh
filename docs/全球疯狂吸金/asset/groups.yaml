    户，他会贡献更好的资源，因为这样更能确保成交，对你，关键是对他更有好处，记住——在进行分成的时候，你们难免会讨价还价，一诺老师通常的做法是五五分，也就是一人一半。


    如果对方想要拿更多，那他就要证明给我看，他比我更有价值。如果对方拿不出证据证明他比我更有价值，那么我给他一半他就会觉得赚到了，这样合作的反而更长久。


