    ### 第六节：眼光决定高度，高度决定价值


    一诺老师十几岁，开始游览祖国大好河山，走遍千山万水，


    广交八方英雄！可叹啊，英雄太少了，大多数是吃瓜群众！


    这不是最可悲的，最可悲的是你把他当英雄，而他把你大成吃瓜群众！


    这还不是最可悲的，最最可悲的是，他居然没有看出来你


    是英雄，所以为什么说：“英雄惜英雄，惺惺相惜！”


    因为天下英雄实在太少了！大多数都是吃瓜群众！


    怎么办？


    ![](img/ba95c5543d44302d19187a4e023c4277_33_0.png)


    给大家举个例子：


    大家都知道，一诺老师非常热爱学习，闲暇的时候也去一些地方上课学习，之前一诺老师每次学习非常客气，给别人留电话，合影拍照……加微信等。


    小钱靠努力 大钱靠吸引力 《全球疯狂吸金》 错过这本书.损失十个亿


    结果有一次,助理说:"一诺老师,有一个人自称跟您认识,和您一起参加过安南的国际研讨会课程。"


    一诺老师说:"哦, 然后呢?"


    助理说:"那个人发信息过来‘原来是他呀? 他就是一诺老师呀, 哈哈, 我当时谁呢? 之前跟我一起听过几堂课, 就成大师啦? 就到处演讲了?’ 一诺老师, 这个人怎么办?
    要不要删掉?"


    我说:"大肚能容容天下难容之事, 笑口常开笑天下可笑之人!"


    各位也没有发现, 一诺老师能够放下身段, 到了别人的会场就是一名学生, 出了那个会场, 一诺老师就是一诺老师!


    这就是我经常说的那句话:


    ![](img/ba95c5543d44302d19187a4e023c4277_34_0.png)


    > 鹰有时飞的比鸡低,

    但鸡永远飞不到鹰那么高!

    一诺老师


    结果, 有一天助理跑过来说:"一诺老师啊, 那个自称是你的朋友同学的又发信息了......"


    结果我一看信息：“我看喜欢*引华、*国顺、*文强、*金老师、*为老师、*心老师……，听说一诺老师跟他们关系不错，我想拜其中一位为师！让你们的一诺老师帮我打个招呼，打个折扣……”


    助理笑了：“这些人都是 一诺老师的弟子，都是 一诺老师一手培养出来的，结果祖师爷在此不拜，却要成为一诺老师弟子的弟子！”


    助理说：“一诺老师，您说这是为什么？”


    ![](img/ba95c5543d44302d19187a4e023c4277_35_0.png)


    这不是开玩笑，吃瓜群众宁可相信世界上 有鬼，也不会相信你会成功！一诺老师装成普通人去听一场演讲，结果他真的把你当成普通人！


    后来再去哪里听课，再也不合影、不轻易加微信！


    成功的人都是寂寞的，不要让吃瓜靠近你！


    就像《美人鱼》的男猪脚唱的：“无敌是多么寂寞……”


    ### 第七节：不择手段实现最高道德


    一诺老师教你每个策略，你在设计的时候都要保持平衡！


    什么叫平衡？


    比如，咱俩贩毒，把他给坑了，这平衡吗？不平衡。


    你知道吗？牢里关的都是好人。


    可是好人怎么会被抓起来呢？听着，每个人动机都是好的，每个人都会选择当下对自己最佳利益的行为。


    请问你，抢劫犯的动机是什么？钱。


    贪污犯的动机是什么？钱。


    你做生意这么付出，这么辛苦，你的动机是什么？钱。


    可见你们和这些罪犯动机都一样，大家都一路货色。


    (笑声、掌声、欢呼声！)


    请问，抢劫犯抢了 100 万，受害人损失了 100 万，这平衡吗？不平衡。


    还有，小偷偷了 100 万，受害人丢了 100 万，这平衡吗？也不平衡。


    贪污犯贪污了 1000 万，行贿的人行贿 1000 万却拿到 1 亿利润的工程，赚了 9000 万，这两个都赢了，可是国家却亏了 9000 万，所以国家能放过他们吗？不能，因为不平衡！


    所以，如果这个事一开始设计不平衡的话，迟早会出问题，你们只见贼吃肉，没见贼挨打，出来混迟早是要还的。


    所以，平衡比什么都重要。


    一诺老师课程跟大家打招呼时说“大家好”，一诺老师认为“大家好”这三个字这道出了合作的真谛，我好叫利益，你好叫情义，大家好就是道义。


    ![](img/ba95c5543d44302d19187a4e023c4277_37_0.png)


    诈骗犯和企业家使用的是同一个剧本，关键是后者平衡客户、股东、员工、国家、社会的利益！这就是最高道德！


    什么意思？一个人你只盯着我好，那是利益，如果你能兼顾大家好，你做的事儿就在道上，所謂得道者多助，失道者寡助，得道者神明佑之，福禄随之，小人远之，所欲必成！


    ### 第八节：本欲擭众生反被众生嘻


    来，跟着一诺老师的节奏，我们继续。


    有一个小和尚跟师父说：“您总说心想事成，可我咋老是不能心想事成呢？”


    师父问：“你想啥了？


    小和尚说：“我想要一个冰箱啊，这样施主们供养的水果供品放进去就不会坏，然后我就可以吃啊。”


    师父说：阿弥陀佛，善哉善哉！佛祖在圆寂之前，望着来给他送行的徒弟，留下一句千古名言——


    इस्संक्रमण के लिएसंवेदनशीलप्राणी ट्रांस जीवहोते हैं


    小和尚不理解，一脸懵逼的望着师傅……


    师傅告诉小和尚一句话，听懂的顿悟人生！


    ![](img/ba95c5543d44302d19187a4e023c4277_38_0.png)


    小和尚恍然大悟……


    师傅说：“你不能这么想，你要想——如果我有了冰箱，施主们来了，大家就可以一起分享这些供品，当你的梦想跟大家有关系的时候，大家就愿意帮你实现梦想，这样你才能梦想成真。”


    ![](img/ba95c5543d44302d19187a4e023c4277_39_0.png)


    每个老板出生都是光溜溜的，可是为啥到现在不一样了呢？这个社会的资源对每个人都是敞开的，一诺老师认为做老板，你要考虑你是在做一个多大的框架，装了多少资源进来。


    为什么好的投资商、供应商、人才、客户都进不来？为什么社会外部的资源进不来你的企业，为啥？因为跟人家没关系！


    ![](img/ba95c5543d44302d19187a4e023c4277_39_1.png)


    成人达己——是吸金的最高境界！


    ### 第九节：吸金大师要腾出精力来做大事


    孙子兵法说要先胜而后求战，啥意思？


    是得到所有战争获胜的必备要素之后才开战，而不是仗打了一半发现武器装备不行，粮草补给不行，情报搞错了，这个时候想赢却没机会了。


    兵法的最高境界是不战而胜，百战百胜是下策的，最好的赢家是不战而胜，最差也是打一次就够了。


    ![](img/ba95c5543d44302d19187a4e023c4277_40_0.png)


    很多人为什么没有让自己满意的财富？


    就是因为从来没有学过如何吸引财富，因为学校的老师教不了，学校的老师如果会早就财富自由了，明白吗？


    所以，成功之前不要乱动，要先学习！你不把学费交给老师，就把学费交给市场！(失败和挫折)


    百战百胜意味着要打好多次仗，劳民伤财啊。秦国的灭亡


    跟打仗是直接相关的，常年的战争掏空了国家的资源。


    所有的战争不是打人的，都是打钱的，所有的市场都是打钱的，孙子兵法不是教战法的，而是教不战之法的。


    做生意频繁出手的，出错的机会就很多。很多老板做生意东边赚点，西边亏一点，最后剩下一點点。


    这就像一个男人同时交往好几个女人。人的精力有限，管都管不过来啊。


    生意牵扯的人力物力财力，你顾不过来。对老板来说，减少出手的频率，一辈子做好一件事就不得了了。


    ![](img/ba95c5543d44302d19187a4e023c4277_41_0.png)


    毛主席一辈子也就只做了两件事情：


    - 第一件：把小日本送回老家了；

    第二件：把蒋介石送回台湾了。


    伟人也只做两件事情，咱们普通人能做好一件事情就够了。

