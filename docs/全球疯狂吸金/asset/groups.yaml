    乙土匪打劫了一个受害者，发现对方钱包里只有 500 元现金，于是乙土匪当天营业额只有 500 元。


    但是乙土匪发现钱包里还有一张身份证、一张结婚证、一张驾驶证和一枚结婚的戒指，于是把这些东西拿到当铺抵押换了 500 元现金，然后打电话告诉受害人：如果想赎回这些东西，汇款
    2000 元到我的账户来！于是受害人汇款给乙土匪 2000 元，换回一张当铺的当票。


    以上资源配置、资产整合的整个过程中，乙土匪一共实现了 3000 元的营业额，是甲土匪的 3 倍！


