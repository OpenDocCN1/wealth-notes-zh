    ## 小钱输努力.大钱输吸引因 《全球疯狂吸金》 错过这本书.损失十个亿


    条 01 元。所有的传情下午茶礼盒会在收到短信确认的第二周统一进行派送。


    截止 2008 年 11 月 12 日，已经有超过 7 万 4 千人送出了这份温馨的传情下午茶。


    为了提高网友的活动热情，立顿公司还设置了一些趣味小游戏。比方说红茶占卜，通过你喜欢什么样的茶，测试你的魅力值等等。


    为了鼓励大家积极参加活动，立顿还专门搞了一个送茶排行榜，每周送茶最多的 10 名网友会出现在首页的显著位置。


    ![](img/ba95c5543d44302d19187a4e023c4277_284_0.png)


    在这里，一诺要强调的是：这就是一个典型的交际嵌入病毒。以情感为载体，送礼物给朋友这个温馨的点子，通过一传十，十传百，立顿红茶迅速在网友里流动起来，人们纷纷登陆网站送茶传情。同时，这也是一个很成功的体验营销。


    立顿送出的礼包里东西并不多，一杯茶，一个茶包，个小


    面包，但很多人都体验到了立顿的茶。


    要说明的一点是，立顿在设计活动的时候筛选了活动的对象。八大城市的中心商圈的办公室，也就把送茶对象限制为有较强购买力的白领，他们成为立顿的消费者的几率更大。


    立顿在这次活动中获得了大量绝对真实的一手客户资料，包括姓名、电话、工作地点、手机、电子邮箱。而且立顿通过选择口味做了一次市场调查，看看哪种口味在哪个城市最受欢迎，这些都是很重要的据资料。


    一诺老师 2015 年在一家火锅店和一帮弟子吃饭的时候，王老吉的导购做促销，给我们每个人送红包，送一堆红包，上面印的是王老吉，一诺老师和弟子们就装兜里了。


    ![](img/ba95c5543d44302d19187a4e023c4277_285_0.png)


    过年的時候，你要发压岁钱吧？你的辖区治安员、别野物业服务中心、保安、清洁工、公司员工……还有家人、外甥、侄女等，要给他们发塞压岁钱对不对？钱没地方装，刚好装在


    王老吉给的红包里，然后发出去。


    完了以后一琢磨，一诺老师替王老吉做宣传了，这是很典型的一个交际嵌入的方式，也是王老吉很成熟的策略，很棒的策略，这叫交际嵌入，也可以增加转介绍。


    ### 第四大终极武器：游戏竞赛


    此外，游戏竞赛也是转介绍当中极其有效的妙招。一诺老师的一名弟子从事网上零售酒水的业务，他们设计了一款专供会员玩的在线游戏：酿酒游戏。


    ![](img/ba95c5543d44302d19187a4e023c4277_286_0.png)


    这款游戏是一个多人协作的通关游戏，一个人是不能玩的。


    过第一关的时候，你就要邀请好友过来注册，协助你一起酿酒。


    于是你邀请了 3 个好友分别帮助你采集粮食、发酵、勾兑(游戏中的环节)，用了 3 天的时间过了第一关，酿出了一瓶汾酒。


    于是，公司会在一周左右的时间给你寄来一瓶汾酒，酒瓶子上面还有你专属的名字。


    ## 小钱都努力、大钱都吸引因 《全球疯狂吸金》 错过这本书、损失十个亿


    你看，这样一来你不光赚了一瓶酒，你还学会了酿酒的知识(公司也完成了对顾客进行酒文化的教育)。


    ![](img/ba95c5543d44302d19187a4e023c4277_287_0.png)


    过第二关的时候，需要协助的人数和酿造的时间就增加了，你就邀请了更多朋友来协助你酿酒，而且学到了更多酒的文化，免费拿到了更高价值的酒。


    通过游戏竞赛的方式，老顾客都在邀请朋友过来协作玩酿酒的游戏，而公司也就赚到了更多新顾客。


    ## 第十五节：在蠢见领袖的鱼塘疯狂捞鱼


    迈克尔杰克逊被称为流行之王。


    百事可乐为了跟可口可乐公司竞争，请迈克尔杰克逊做代言人——迈克尔杰克逊说了，第一个我不喝可乐，我要告诉别人我也不喝可乐，第二個我手里不拿那个讨厌的罐子。


    百事可乐公司说，没问题，只要你出现就好了！


    ![](img/ba95c5543d44302d19187a4e023c4277_288_0.png)


    然后呢，这个广告片是这样拍的，迈克尔杰克逊一出场就开始跳太空舞，哇！舞步特别绚丽，接着迈克尔杰克逊一声尖叫，手指头一指，一道光闪了过去，光里边跳出来一个小迈克尔杰克逊——小孩子，穿一样的装束，小孩子跳的也是一样的舞蹈，最后小孩子跳到高潮的时候，拿出一瓶可乐的罐子，哇，观众一看就尖叫！


    那一年百事可乐的销量猛涨。


    这个意见领袖，公众人物他们往往是创造流行的，他们往往有着足够的话语权，有着足够的份量，吸金大师要想办法找到这批人，找到这批金字塔塔尖的人，找到这批意见领袖，找到这批有声望的人，然后利用他们来做吸金。


    一诺老师的一个弟子在北京开了一家卖烤鸡的实体店，招牌菜是烤鸡翅。最初创业的时候就 40 多平米一家小店，现在目前能做 2000 多万的营业额。


    最初创业的时候呢，他们一分钱广告费没有花，也没有做什么宣传，就做了一件事情：印制一万张卡片，拿这个卡片终身免费吃鸡翅。做了一万张卡，这一万张卡拿来干什么？


    不是卖出去，全部都是送出去的，送给谁？


