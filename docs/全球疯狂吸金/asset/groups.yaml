    有时候一个老师就可以让你发生魔术般的改变，例如苏秦、张仪、孙膑、庞涓、商鞅、李斯、吕不韦、白起、李牧、王翦、徐福、毛遂、范蠡、甘茂、范睢、西门豹、魏成、王诡、文种、田骈、白圭、计然、吕耕、范睢、李冰、赵奢、田单、李悝、许行......他们共同的老师是鬼谷子！


    ## 第二节：蓝图规划的关键(布大局成大事)


    你追钱很累，钱追你很爽！


    如何让钱主动追你呢？


    你需要做——蓝图规划！


    什么是蓝图规划？其源起于”工程学”，本义是统筹考虑项目各层次和各要素，追根溯源，统揽全局，在最高层次上寻求问题的解决之道。


    蓝图规划是运用系统论的方法，从全局的角度，对某项任务或者某个项目的各方面、各层次、各要素统筹规划，以集中有效资源，高效快捷地实现目标。


    ![](img/ba95c5543d44302d19187a4e023c4277_54_0.png)


    简单说来，蓝图规划就是布局，就是系统规划，就是为了企业的长远发展，寻找一套可操作的系统性解决方案的过程，即按照“以终为始，B 点思维”的原则——


    ## 小钱靠努力·大钱靠吸引力 《全球疯狂吸金》 错过这本书·损失十个亿


    基于对人性的假设，对目标市场的理解，对用户需求的把握，对竞争格局的认知，通过系统的分析，把经营理念、终极目标设定好，把用户心目中理想的完整产品描述清楚，把实现目标的关键要素和主要矛盾罗列出来，把潜在的问题和风险预见到，从而根据目标去整合配置资源，缺什么补什么，倒排时间表，形成一个通俗易懂的“脚本”，然后让各个职能的管理者按照“脚本”上的分工扮演好自己的角色。


    ![](img/ba95c5543d44302d19187a4e023c4277_55_0.png)


    田忌赛马中，虽然整体资源都比对方弱，但通过合理统筹，高效配置资源——


    - 用自己的下等马对对方的上等马，输一局；

    用自己的中等马对对方的下等马，赢一局，扳平；

    用自己的上等马对对方的下等马，赢一局，取得决定性的胜利。


    ## 第三节：蓝图规划的两大核心


    蓝图规划作为企业最高的发展纲领，作为事业大厦的设计蓝图，需要具备两大核心：


    ### 首先：是严密的逻辑性


    系统性思维将就严密的逻辑性，所以，顶层设计不仅要清晰描述企业的“终极目标”是什么，更要明确回答“获得成功”是因为什么；不仅要有合理的经营理念与愿景，更要有具体可操作的方法论，换句话说——


    > 不仅有顶天立地的梦想，

    更要有脚踏实地的计划！

    ——诺超师


    要按照发展愿景和战略目标，有针对性地提出系统完整、步骤清晰、分工明确的实施计划，并按需要组织的人力、物力、财力等资源条件配套安置，实施、管理、监督、检验，井然有序，环环相扣，纹丝不乱。


    ### 其次：是明确的可操作性


    顶层设计必须从实际出发，再回到实际中来，所有的蓝图规划方案及每个方案的所有措施，都要能归结到可执行的要素“5W2H”上，即明确所要执行的是什么任务(what)、为什么要做(why)、何时开始(when)、从哪里入手(where)、由何人负责(who)、如何去做(how)及要花多少时间和资源(how
    much)，以此确保执行者能够充分把握战略落地的要领，保证执行不出偏差。


    同时，还要充分估计各种执行风险，做好相应的预案准备。


    此外，因为蓝图规划所针对的是系统工程，所以从设计构想到评议决策，再到管理、执行、监督、检验，整个过程是一个群策群力的合作过程，需要高层管理者到基层员工的全员式参与。


    同时，又由于蓝图规划具有很突出的重要性和风险性，所以，对企业决策层、管理层和执行层都提出了相当高的要求。


    最后，一诺老师对顶层设计做个总结——


    蓝图规划就是把平庸企业变成卓越企业的系统规划，是一个无中生有，变废为宝的思维架构和实践体系。


    ## 第四节：蓝图规划的金三角


    根据一诺老师 19 年经验，首次公布蓝图规划金三角：


    ![](img/ba95c5543d44302d19187a4e023c4277_58_0.png)


    一是顶层决定性，蓝图规划是自高端向低端展开的设计方法，核心理念与目标都源自顶层，因此顶层决定底层，高端决定低端；


    二是整体关联性，蓝图规划强调对象内部要素之间围绕核心理念和顶层目标所形成的关联、匹配与有机衔接；


    三是实际可操作性，蓝图规划的基本要求是表述简洁明确，设计成果具备实践可行性，因此蓝图规划成果应是可实施、可操作的。


    ## 第四节：蓝图规划的万能公式


    在这些年的实践中，一诺老师对如何通过蓝图规划，打造好结构的企业有很多心得，最终一诺老师把它浓缩成为这个万能公式：


    好结构(卓越企业) = 好内容(优质资源) + 好流程(合理配置)


    我们做生意都差不多吧，找地址、工商、招人、设备、股权，但是有人赚钱有人亏钱，差在哪里？结构。


    结构都是由两个部分构成的，一个是元素，一个是排序。相对石墨来说，钻石的排序更加合理，特殊的配置方式来承载的。


    大家都在谈论系统，什么是系统呢？就是结构。


    就像建筑设计师，是设计房子的图纸，今天我们设计做商业项目的图纸，叫做——蓝图规划。


    一诺老师发现，好蓝图是被规划出来的，好的建筑需要很棒的设计图，如果没有图纸随便建，可能会建出有史以来最伟大的钢筋混凝土怪物。


    可是，在中国 999%的老板对自己的企业没有做完整的蓝图规划，头脑一热就创业了。


    ![](img/ba95c5543d44302d19187a4e023c4277_60_0.png)


    如果把企业比作一辆车，我们企业家往往是奔跑时发现路边有一辆车，然后赶紧上车往终点站赶……


    半路却发现车已经出故障了，刹车有问题了，只能边开边修，有可能到达终点，更多人半路抛锚。


    之所以不成功，就是因为他们从来不规划蓝图！


    ## 第五节：破译宏伟蓝图的成功密码


    蓝图是一个系统，一个系统包括两个方面，一个是元素，一个是结构。元素无非就是人，财，物。


    然后就是排序，怎样让每个元素合理的组合在一起，好的内容加好的流程构成好的系统。


    一个聋子，一个瞎子，一个瘸子，说我们整合一下吧，那不叫整合，叫残联。


    ![](img/ba95c5543d44302d19187a4e023c4277_61_0.png)


    事情不是做成的，事情是准备成的。你把事情做成的所有要素都准备齐了，事就成了。


    今天，你准备开工做一个项目，项目都是被规划成的，而不是干成的，首先你得有产品，有项目，卖什么，你得有用户吧，总得有人买单吧。


    此外，还有团队，谁来卖？内部的员工，外部的经销商，这些都是你团队的一部分。


    每一个项目需要钱来启动，总需要有资本吧。


    如果你今天做一个商业模式，找来了最有吸引力的项目，找来了最牛逼的渠道商，他们手里最不缺的就是用户，最牛逼的团队，最顶级的资本，你把这些人聚在一起，签约开香槟，事就成了，同意吗？


    > 事情不是做成的，事情是准备成的！

    —诺老师


    例如，你找到最顶级的供应商，告诉他：“去年你的销量是一个亿今年我支持你，让你在做到 1.2 亿，你愿意吗？”


    然后你又找到了最好的渠道商，你说：“王总，我现在有最好的产品，去年你赚了一个亿，今年我支持你，跟我合作让你赚到 1.2 亿，你愿意吗？”


    接下来你去找最顶级的团队，告诉他们：“我有最好的项目、有最顶尖的销售渠道，只是需要这个领域的精英团队来操盘，去年你赚了一个亿，今年我支持你，跟我合作让你赚到
