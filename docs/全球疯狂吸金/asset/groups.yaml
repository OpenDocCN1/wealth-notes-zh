    进入立顿的网站，首先呈现给你的是一个中国地图，上面只有 8 个城市亮着，点开这八个城市的地图，又只有几个核心商圈亮着，最后你填上朋友的办公室地址和手机号码就好了。


    如果你朋友不在立顿的送茶范围里，你也可以送一个传情贺卡给他。


    ![](img/ba95c5543d44302d19187a4e023c4277_283_0.png)


