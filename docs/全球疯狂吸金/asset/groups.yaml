    例如，在“山寨春晚”的策划中，策划人很聪明的将话题转向了“话语权”，当众人褒贬不一时，山寨当事人则称：“我们要的无非是一个话语权”，进一步的引发舆论的争议。


    而这种“八卦”的事件，恰恰需要的是争议和炒作！


