    最最可悲的是，你居然被这些吃瓜群众影响了……


    这不是最可悲的，最最最可悲的是你一而再再而三的被吃瓜群众影响着……我服了……你的梦想被吃瓜群众偷走了！


    ### 第五节：在什么山头唱什么歌


    市场瞬息万变，这个时候我们要看情况，问题是咋看情况。


    你说杀人犯吃喝嫖赌是好事还是坏事？有人说坏事，这是守规矩的人。有人说看情况，这是高手！绝对的高手！


    抗战时期，在南京杀日本人，这是民族英雄！


    大师让弟子还俗参加抗日，弟子问：“师傅，这是杀生啊！”


    大师就是大师，说了一句：“杀日本鬼子就是为中国人放生！”


    ![](img/ba95c5543d44302d19187a4e023c4277_29_0.png)


    没有绝对的对与错，只有改变对与错的必要！


    穿着棉袄大冬天去哈尔滨挺好，在屋里开着暖气你还不脱你傻吗？所以，看情况！


    人这一辈子最难的事就是看情况，这些年大家都在谈智慧，

    哈叫智慧？看情况。


    行为本身没有意义，关键看所处的情况。


    小钱躲努力,大钱躲吸引因《全球疯狂吸金》错过这本书,损失十个亿


    一个博士问船夫: “你懂数学吗?”


    船夫答: “不懂。”


    博士说: “你的生命已经失去四分之一了。”


    博士又问: “那你懂哲学吗?”


    船夫答: “不懂。”


    博士说: “那么你的生命已经失去四分之二了。”


    博士继续问: “文学你懂不?”


    船夫答: “不懂。”


    博士说: “看来你的生命已经失去四分之三了。”


    湖上起风了, 船夫问这个博士: “您会游泳吗?”


    博士说: “不会。”


    船夫说: “那么您的生命都没了。”


    船夫跳水游走了, 博士淹死了。


    ![](img/ba95c5543d44302d19187a4e023c4277_30_0.png)


    有很多企业家就是有知识没智慧。


    小钱靠努力.大钱靠吸引因《全球疯狂吸金》错过这本书.损失十个亿


    前段时间一诺老师看到一个报道，一个河南农妇，文盲一个，却把一个女博士生给拐卖了。你一个博士生居然被文盲给拐卖了？我服了U，这些年读的书都喂狗了！


    大家都在谈智慧，咋看情况呢？


    ![](img/ba95c5543d44302d19187a4e023c4277_31_0.png)


    有些人修佛修禅修智慧，结果见了基督徒也念阿弥陀佛，这是没开窍呢！你得在什么山头唱什么歌。


    一诺老师知道，今天你们在座的有许多是局长、秘书长、委员长，可是在今天在这个会场，你们暂时的身份是学生，一诺老师暂时的身份是老师。这就是看情况


    英国女王回家敲门，老公在屋里问：“谁啊？”

    “女王。”

    门没开。

    过一会女王继续敲门。

    “谁啊？”


    “你老婆。”


    这次门开了……


    ![](img/ba95c5543d44302d19187a4e023c4277_32_0.png)


    所以，人得清楚自己当下在这个场合的身份！


    有些人就本末倒置，很多老板在家里颐指气使可像老板了，到公司可像老公呢，对女秘书可好了。（摇头）


    全颠倒了！


    识时务者为俊杰，什么叫时务？就是看情况！


