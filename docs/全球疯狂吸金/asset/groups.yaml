    ## 第三个境界：卖股权


    股权买单的是股东，也就是投资者，股东是金字塔的顶层，是系统的所有者。那些看好你企业未来发展，同时又不愿出力干活(代理、经销、经营)的，可以投资成为你企业的股东，这个过程就是股权融资。


    股权融资属于直接融资，就是以公司股权来交换投资方的资金。割让股权换来的资金是企业的股本金，股本金是无须还本的，这意味着投资者需要与你共同承担风险，因此他们不但要享受利益分配的权利，同时也要参与分享企业决策的权力，这些权利和权力，与其投资额度成正比。


    ![](img/ba95c5543d44302d19187a4e023c4277_128_0.png)


    从操作层面看，股权融资的形式基本上两种：增资扩股和割股套现。


    增资扩股是由投资者向企业增资，致使企业总股本增加，投资者基于扩大后的总股本来计算其占有的公司股权比例。增


    资扩股的结果是企业获得了资金，而不是企业家获得了资金。


    割股套现是企业发起股东转让部分股权给投资者，换取相应资金。投资者是基于原来的股本金来计算其持股比例。


    这种融资形式，企业并没有获得资金，获得资金的是企业家(发起股东)个人。


    也就是说，投资者收购企业股权的资金流入了企业家个人的账户，而非流进了企业的账户。


    股权融资不但是权益与资金的交换，同时也是风险与利益的权衡。投资者虽然分享了企业分配的权益，但同时也分担了企业经营的风险。


    ![](img/ba95c5543d44302d19187a4e023c4277_129_0.png)


    企业吸收的外部股东越多，抗风险能力越强，反正天塌了大家的肩膀扛着，石头掉下来砸的是大家的脚，又不是你一个人疼。


