    当你在设计一个免费体验产品的时候，要考虑吸引力够不够。关于吸引力，你要注意两方面的平衡：价值和成本。


    举例，今天你只要免费注册【改变世界】APP 会员，一诺老师就送你一辆奔驰开，好不好？你会感觉很好，很乐意参与，问题是一诺老师就破产了，一诺老师没赚钱先破产了。


    是，送奔驰车价值是很高，但是成本太大了，发展一个注册会员，你这样的成本来说的话，那你肯定就亏大了。


    价值是很 高，但你成本要平衡的，你要平衡价值和成本。


    所以你要思考你这个体验产品用什么来做设计，价值够不够，成本是不是能够衡量的。


    成本有时候跟什么有关？跟你的销售额有关。


    比如说你送出去一百个免费的试用装，最终有多少个买单的？买单的金额是多少？算下来扣掉你的成本以后能赚多少？如果是 有赚的，那你就是值得做的。


    就是打平成本，哪怕是不赚钱，打平成本能赚到客户，这都是赚的。因为有后续购买，有后续消费，那你要把它打平，只要能打平，你发展这个用户都是赚钱的。


