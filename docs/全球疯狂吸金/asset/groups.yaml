    小和尚恍然大悟……


    师傅说：“你不能这么想，你要想——如果我有了冰箱，施主们来了，大家就可以一起分享这些供品，当你的梦想跟大家有关系的时候，大家就愿意帮你实现梦想，这样你才能梦想成真。”


    ![](img/ba95c5543d44302d19187a4e023c4277_39_0.png)


    每个老板出生都是光溜溜的，可是为啥到现在不一样了呢？这个社会的资源对每个人都是敞开的，一诺老师认为做老板，你要考虑你是在做一个多大的框架，装了多少资源进来。


    为什么好的投资商、供应商、人才、客户都进不来？为什么社会外部的资源进不来你的企业，为啥？因为跟人家没关系！


    ![](img/ba95c5543d44302d19187a4e023c4277_39_1.png)


