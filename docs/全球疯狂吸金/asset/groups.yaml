    ## 第二个杠杆：最小风险


    抢银行收益高，但是风险大，所以很少有人做。我给了你最大好处你怎么还不参与呢？因为你不想承担风险。


    牵一发就动全身，你只要做事，就一定有消耗，有消耗就有代价，有多大的动作就有多大的风险。打麻将下多大的注，就有多大的赢面，同时就有多大的风险。


    我们赚钱有一个捷径，就是你只要活的足够久，你一定能赚很多钱。


    ![](img/ba95c5543d44302d19187a4e023c4277_76_0.png)


    李嘉诚说：“别人都在考虑如何成功，我考虑的是如何避免失败，所以我做了各种预案来避免失败。”


    一诺老师总结，在中国做企业通常有三种死法：小企业死在市场竞争，中企业死在融资，大企业往往死在政商关系。


    做生意首先考虑的是怎样保住本钱，可是和你合伙的人他们也想保住本钱，你想安全，他也需要安全。


    一诺老师告诉你，谁做带头大哥，谁就承担最大的风险，


    同意吗？犯罪团伙的首犯判得最重，当然，干成了收益也是最大的，成正比的。


    如果你不想承担风险，那么你就要思考如何规避、转移、消除和降低风险！不光如此，你还要平衡风险！


    ## 第三个杠杆：最平衡


