    ## 第三节：蓝图规划的两大核心


    蓝图规划作为企业最高的发展纲领，作为事业大厦的设计蓝图，需要具备两大核心：


    ### 首先：是严密的逻辑性


    系统性思维将就严密的逻辑性，所以，顶层设计不仅要清晰描述企业的“终极目标”是什么，更要明确回答“获得成功”是因为什么；不仅要有合理的经营理念与愿景，更要有具体可操作的方法论，换句话说——


    > 不仅有顶天立地的梦想，

    更要有脚踏实地的计划！

    ——诺超师


    要按照发展愿景和战略目标，有针对性地提出系统完整、步骤清晰、分工明确的实施计划，并按需要组织的人力、物力、财力等资源条件配套安置，实施、管理、监督、检验，井然有序，环环相扣，纹丝不乱。


    ### 其次：是明确的可操作性


    顶层设计必须从实际出发，再回到实际中来，所有的蓝图规划方案及每个方案的所有措施，都要能归结到可执行的要素“5W2H”上，即明确所要执行的是什么任务(what)、为什么要做(why)、何时开始(when)、从哪里入手(where)、由何人负责(who)、如何去做(how)及要花多少时间和资源(how
    much)，以此确保执行者能够充分把握战略落地的要领，保证执行不出偏差。


    同时，还要充分估计各种执行风险，做好相应的预案准备。


    此外，因为蓝图规划所针对的是系统工程，所以从设计构想到评议决策，再到管理、执行、监督、检验，整个过程是一个群策群力的合作过程，需要高层管理者到基层员工的全员式参与。


    同时，又由于蓝图规划具有很突出的重要性和风险性，所以，对企业决策层、管理层和执行层都提出了相当高的要求。


    最后，一诺老师对顶层设计做个总结——


    蓝图规划就是把平庸企业变成卓越企业的系统规划，是一个无中生有，变废为宝的思维架构和实践体系。


    ## 第四节：蓝图规划的金三角


    根据一诺老师 19 年经验，首次公布蓝图规划金三角：


    ![](img/ba95c5543d44302d19187a4e023c4277_58_0.png)


    一是顶层决定性，蓝图规划是自高端向低端展开的设计方法，核心理念与目标都源自顶层，因此顶层决定底层，高端决定低端；


    二是整体关联性，蓝图规划强调对象内部要素之间围绕核心理念和顶层目标所形成的关联、匹配与有机衔接；


    三是实际可操作性，蓝图规划的基本要求是表述简洁明确，设计成果具备实践可行性，因此蓝图规划成果应是可实施、可操作的。


    ## 第四节：蓝图规划的万能公式


    在这些年的实践中，一诺老师对如何通过蓝图规划，打造好结构的企业有很多心得，最终一诺老师把它浓缩成为这个万能公式：


    好结构(卓越企业) = 好内容(优质资源) + 好流程(合理配置)


    我们做生意都差不多吧，找地址、工商、招人、设备、股权，但是有人赚钱有人亏钱，差在哪里？结构。


    结构都是由两个部分构成的，一个是元素，一个是排序。相对石墨来说，钻石的排序更加合理，特殊的配置方式来承载的。


    大家都在谈论系统，什么是系统呢？就是结构。


    就像建筑设计师，是设计房子的图纸，今天我们设计做商业项目的图纸，叫做——蓝图规划。


    一诺老师发现，好蓝图是被规划出来的，好的建筑需要很棒的设计图，如果没有图纸随便建，可能会建出有史以来最伟大的钢筋混凝土怪物。


    可是，在中国 999%的老板对自己的企业没有做完整的蓝图规划，头脑一热就创业了。


    ![](img/ba95c5543d44302d19187a4e023c4277_60_0.png)


