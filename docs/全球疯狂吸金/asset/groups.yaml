    时代变迁，你怎么看待你今天的生意、每一个产品的不同周期的表现、和你怎么判断你目前的项目暂时处在哪个周期？


    接下一诺老师讲的内容对你非常重要，好好听。


    第一个周期，叫导入期，就是原来没有这个产品，你是第一个做的、创始人、缔造者，这是第一个节点；


    然后进入了成长期，快速增长的周期；


    接着进入了成熟期，市场开始稳定；


    最后是衰退期，秋后的蚂蚱，行业不好干了。


    ## 导入期有什么特点？


    市场很难做啊，因为没有认知，用户心智模式片空白，要重新塑造价值，要扫盲，广告成本、教育成本通常比较高。


    ## 如果你能撑下来，你就成为先驱了，撑不下来就成了先烈。


    导入期是由先烈的尸骨铺出来的，活下来的是少数。


    如果你是导入期进入市场的，那么你的战略重点是培育。


    ![](img/ba95c5543d44302d19187a4e023c4277_168_0.png)


    导入期的产品什么时候能够火起来呢？


    一个偶发事件可以让他活起来，非典期间，一夜之间口罩变得好卖了。


    假设现在政府突然规定不让用汽油了，那么其他可替代的原料就会突然火起来。


    此外，随着先烈死了一批又一批，逐渐的更多同行者进来开荒，市场逐渐被培育出来了，也会步入了成长期。


    ## 成长期有什么特点？


    写下这句话，顿悟真谛！


    ![](img/ba95c5543d44302d19187a4e023c4277_169_0.png)


    需求井喷，供不应求，赚钱特别容易。


    手机刚普及的时候，做手机生意的人都发了。


    十几年前房地产形势好的时候，做房地产的那一批都发了。


    如果你是成长期前期进去的，赚钱很容易，这时候你的战略重点是放大，快速的融资，快速的扩张，凡是成熟期赚大钱的品牌，无一例外都是在成长期快速的增长跑马圈地成长起来的。


    这叫天时：时势造英雄，英雄亦适时也！


    广告投放、原材料囤积、市场扩张、人才挖角、有钱使劲往市场上砸，就这么起来的。不过，大家一看赚钱，就会跟风，在成长期后期，会有很多同行像雨后春笋一样冒出来，随着竞争对手越来越多，市场逐渐被催熟了，这就进入了成熟期。


    ## 成熟期的特点是什么？


    对手更多了，开始拼服务了，规则形成了，标准清晰了，利润透明了。


    市场上已经三分天下了，竞争格局已经很明确了。


    如果你的产品目前正处于成熟期，目前你要做的不是放大规模，而是思考下一步怎么办，因为下一步就是衰退期，冬天就要来了，要为下一波衰退期的来临提前布局，否则大环境一变，可是你没买诺亚方舟的船票怎么办？


    这时你的战略重点就是再创新，重新让自己进入到新的导入期在创新期间，即便没有突破，你依然有成熟期的红利可以吃老本，可是一旦创新突破，你就会进入新的成长期，从而老树开花抽新枝！


