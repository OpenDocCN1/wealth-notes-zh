    你可以走出去，安排心腹去别人的公司上班，三个人去，因为对手有营销部、公关部、企划部，每个重要的部门都安排人去，这是走出去，时刻监视别人的动向，你派去的卧底拿两份钱，一份你给的，还有份是对手给的。（卧底爽歪歪了）


    对方的政策，在哪儿做展销，怎么吸粉，而且对方花了大量的时间精力心血，每周都能放到你的办公桌上。使用这一招，至少缩短你十年的时间，而且别人帮你交学费，做老板最大的成本是试错，好点子就是执行的，重要的不是来源，你看腾讯


