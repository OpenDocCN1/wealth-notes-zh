    ![](img/ba95c5543d44302d19187a4e023c4277_196_0.png)


    给的又没太大吸引力却要留这么多信息，太麻烦了。所以你要思考让他留多少信息，通常让对方留的信息越多，资料越完整，跟踪起来越方便。如果只留了一个手机号，那你跟踪手段就两个：发短信和打电话，没别的了。


    如果加了微信，你还可以给他发信息、销售信、客户见证、或者语音沟通，甚至你录制录音、小视屏发给他！


    你的跟踪手段就变得更加多样化了。


    ## 第三个门槛：以及走多少个程序


    他要走多少个程序才能拿到这个东西。


    假设你要游过五千里长的长江，零下40摄氏度，游过去，再光脚走过八千米长的碎玻璃渣，然后从珠穆朗玛的山脚爬到山顶来听一诺老师讲课，你听课就听得很认真了，你知道吗？


