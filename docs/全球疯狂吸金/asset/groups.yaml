    ### 第七节：不择手段实现最高道德


    一诺老师教你每个策略，你在设计的时候都要保持平衡！


    什么叫平衡？


    比如，咱俩贩毒，把他给坑了，这平衡吗？不平衡。


    你知道吗？牢里关的都是好人。


    可是好人怎么会被抓起来呢？听着，每个人动机都是好的，每个人都会选择当下对自己最佳利益的行为。


    请问你，抢劫犯的动机是什么？钱。


    贪污犯的动机是什么？钱。


    你做生意这么付出，这么辛苦，你的动机是什么？钱。


    可见你们和这些罪犯动机都一样，大家都一路货色。


    (笑声、掌声、欢呼声！)


    请问，抢劫犯抢了 100 万，受害人损失了 100 万，这平衡吗？不平衡。


    还有，小偷偷了 100 万，受害人丢了 100 万，这平衡吗？也不平衡。


    贪污犯贪污了 1000 万，行贿的人行贿 1000 万却拿到 1 亿利润的工程，赚了 9000 万，这两个都赢了，可是国家却亏了 9000 万，所以国家能放过他们吗？不能，因为不平衡！


    所以，如果这个事一开始设计不平衡的话，迟早会出问题，你们只见贼吃肉，没见贼挨打，出来混迟早是要还的。


    所以，平衡比什么都重要。


    一诺老师课程跟大家打招呼时说“大家好”，一诺老师认为“大家好”这三个字这道出了合作的真谛，我好叫利益，你好叫情义，大家好就是道义。


    ![](img/ba95c5543d44302d19187a4e023c4277_37_0.png)


    诈骗犯和企业家使用的是同一个剧本，关键是后者平衡客户、股东、员工、国家、社会的利益！这就是最高道德！


    什么意思？一个人你只盯着我好，那是利益，如果你能兼顾大家好，你做的事儿就在道上，所謂得道者多助，失道者寡助，得道者神明佑之，福禄随之，小人远之，所欲必成！


