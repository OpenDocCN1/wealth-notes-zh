    助理说:"那个人发信息过来‘原来是他呀? 他就是一诺老师呀, 哈哈, 我当时谁呢? 之前跟我一起听过几堂课, 就成大师啦? 就到处演讲了?’ 一诺老师, 这个人怎么办?
    要不要删掉?"


    我说:"大肚能容容天下难容之事, 笑口常开笑天下可笑之人!"


    各位也没有发现, 一诺老师能够放下身段, 到了别人的会场就是一名学生, 出了那个会场, 一诺老师就是一诺老师!


    这就是我经常说的那句话:


    ![](img/ba95c5543d44302d19187a4e023c4277_34_0.png)


