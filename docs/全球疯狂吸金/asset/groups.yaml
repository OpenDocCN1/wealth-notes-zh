    ## 活动一样——


    2008 年 11 月的某个下午，在深圳市华强北宝华大厦工作的陈琳收到了份快递，她打开一看，里面是一杯冲调好的立顿红茶，一份面包新语小点心以及一份立顿下午茶创意包。


    这是怎么回事儿？


    原来，这是立顿搞的一个下午茶推广活动。从 2008 年 11 月 3 日至 11 月 28 日期间，立顿在网上发起了免费送出 20 万份传情下午茶礼盒的活动。


    > 情感营销，让品牌从同质化竞争中突围！

    —饶超师


    活动的参加很简单，只要登陆传情下午茶，从立顿所提供的原味红茶、红茶加糖和红茶加柠檬汁这三种经典口味的下午茶当中，为好友选择搭配他/她的一种下午茶，然后填上好友的真实信息并给好友留言。


