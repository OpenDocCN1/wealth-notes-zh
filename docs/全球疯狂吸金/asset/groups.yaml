    ### 第九节：吸金大师要腾出精力来做大事


    孙子兵法说要先胜而后求战，啥意思？


    是得到所有战争获胜的必备要素之后才开战，而不是仗打了一半发现武器装备不行，粮草补给不行，情报搞错了，这个时候想赢却没机会了。


    兵法的最高境界是不战而胜，百战百胜是下策的，最好的赢家是不战而胜，最差也是打一次就够了。


    ![](img/ba95c5543d44302d19187a4e023c4277_40_0.png)


    很多人为什么没有让自己满意的财富？


    就是因为从来没有学过如何吸引财富，因为学校的老师教不了，学校的老师如果会早就财富自由了，明白吗？


    所以，成功之前不要乱动，要先学习！你不把学费交给老师，就把学费交给市场！(失败和挫折)


