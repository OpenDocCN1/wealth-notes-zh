    ## 第四节：打造暴利项目的四个关键


    ### 第一个关键：完全独立控制


    你需要对你正在销售的产品拥有完全的控制权。


    这意味着你不能购买那些广泛地出售给任何人的产品，你的产品必须是你能够独立掌控的。


    换句话说，如果你的产品顾客可以从任何别的渠道得到，他为什么要从你的手里买？也就是说，你要从源头上掌控产品！


    ![](img/ba95c5543d44302d19187a4e023c4277_217_0.png)


