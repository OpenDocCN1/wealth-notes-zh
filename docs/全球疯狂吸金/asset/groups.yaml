    皮之不存毛将焉附，根基不在大厦何立？


    正所谓，君子务本，本立而道生。


    2019 年，让我们重新思考，重新革命，重新开始，一切回


    到原点——从产品出发！


    所以，有人问：“请问一诺老师，什么才是让客户不可抗拒


    的爆款产品？”


    一诺老师告诉你，记下这句话顿悟商业真谛！


    ![](img/ba95c5543d44302d19187a4e023c4277_122_0.png)


    起心动念利他，一切财富自来！


    ## 第二节：爆款产品的最高境界


    卖东西有 3 个不同境界：卖产品、卖商机和卖股权。


    因为卖的东西不一样，导致诉求不一样，收益不一样。


    消费者要效果，经营者要利润，股东要溢价要分红。


    说白了，不外乎是卖艺和卖身。(捂脸)


    杨白劳卖豆腐一辈子都还不清黄世仁的债，卖喜儿一夜就还清，可见卖艺不如卖身。


    > 产品卖给客户,商机卖给穷人,股权卖给富人！

    一诺老师


    卖产品赚的是每一单产品的价差，卖商机赚的是一群人帮你卖产品的价差，这些赚的都是业务层面的钱，属于卖艺。卖股权是把未来提前透支，把业务层面经营 20 年、30
    年才能赚到的钱，一年就赚回来，属于卖身！


    卖艺卖的好，卖身就值钱。


    产品零售卖的好，代理商就愿意经营赚钱，进而就有更多


    人愿意买你股票，投资成为你的股东，这是良性循环的链条。


    很多老板想，既然我现在经营的这么好，赚业务层面的钱就够了，何必割让股份给别人呢？


    其实你没有考虑一件事：变化！


    你今天生意好不代表明天生意好；


    今天团队稳定不代表明天团队稳定；


    你无法预期明天的经营环境是否会恶化；


    你无法预期明天会发生什么突如其来的变故，瞬间摧毁你的业务——非典、禽流感、拆迁、政策变动……战争，在这个世界上，几乎每个人对未来都是不确定的！


    ![](img/ba95c5543d44302d19187a4e023c4277_124_0.png)


    所以，最好的做法是，乘着自己还是黄花大闺女，正是风情万种迷死人的时候，赶快找个如意郎君嫁掉，以后有个长期饭票。万一过了这个风头，拖到年龄大了，人老珠黄，想嫁也没人要了，该出手时就出手啊！


    ## 第一个境界：卖产品


    产品买单的是用户，用户是金字塔的底层，是系统的消费者。大鱼吃小鱼，小鱼吃虾米，虾米吃泥巴，用户就是泥巴，是生物链的底端，可是没有泥巴大家都得死光光。


    用户感兴趣的是效果好、品质好、功能好、品味好、包装好、价格好……服务好等等一系列的元素，同时用户对你效果好、品质好、功能好、品味好、包装好、价格好……服务好，一点兴趣都没有！


    用户更想知道，因为你这些好，所以你能带给我的好处是什么？利益是什么？结果是什么？


    ![](img/ba95c5543d44302d19187a4e023c4277_125_0.png)


    请给我结果！这就是用户。


    如果你能读懂用户真正要什么，你就开始根植大地，屹立不倒了。


    产品是讲英语的，用户是听汉语的，广告是翻译官。


    重要的不在于你是什么，而是你在用户的印象里是什么，


    因为营销传播的核心是一场认知的革命，是头脑的革命，是抢占用户心智模式的革命。


    革命能否成功，很大程度上取决于你的广告传播，有没有用清晰简洁的语言，直指用户的内心，你做到了，你就成功了


    > 把产品的最大卖点和用户的最大痛点，用充满激情的语言，瞬间点燃用户的梦想！

    —塔塔师


    你能做到这一点，你就成功了！


    ## 第二个境界：卖商机


    商机买单的是商户，也就是经营者，他们是金字塔的中层，是系统的经营者。


    这些商户可能是你的代理商、加盟商、批发商、经销商、分销商、团购商、渠道商……


    合作商，是帮助你开疆拓土、跑马圈地打江山的中流砥柱。


    因为他们，你的事业得以发展壮大，生意得以遍地开花。


    他们因名利而来，因情义而留。


    和用户不同，商户不仅在乎你的产品，还在乎你有没有一套验证有效的吸金模式、推广方法和促销手段，更在乎你能不能赚钱。


    “这个市场很大，这个项目很好，能赚很多钱，快来跟我干！”听到这番话，他们的热血就被你点燃了。


    ![](img/ba95c5543d44302d19187a4e023c4277_127_0.png)


    需要注意的是，在你开始招募商户之前，有没有一套验证有效，能帮助商户赚钱的模式，如果没有，请认真打磨，否则后果自负。


    就像一诺老师的课程一样，一诺老师的弟子，只要把这些录制好的音频，发布到各大平台，然后留下自己的微信后，就可以躺在床上赚钱！


    粉丝买书、买课，弟子直接发就好了，都是制作好了！


    这就是验证有效的系统，简单、粗暴、有效！


    ## 第三个境界：卖股权


    股权买单的是股东，也就是投资者，股东是金字塔的顶层，是系统的所有者。那些看好你企业未来发展，同时又不愿出力干活(代理、经销、经营)的，可以投资成为你企业的股东，这个过程就是股权融资。


    股权融资属于直接融资，就是以公司股权来交换投资方的资金。割让股权换来的资金是企业的股本金，股本金是无须还本的，这意味着投资者需要与你共同承担风险，因此他们不但要享受利益分配的权利，同时也要参与分享企业决策的权力，这些权利和权力，与其投资额度成正比。


    ![](img/ba95c5543d44302d19187a4e023c4277_128_0.png)


    从操作层面看，股权融资的形式基本上两种：增资扩股和割股套现。


    增资扩股是由投资者向企业增资，致使企业总股本增加，投资者基于扩大后的总股本来计算其占有的公司股权比例。增


    资扩股的结果是企业获得了资金，而不是企业家获得了资金。


    割股套现是企业发起股东转让部分股权给投资者，换取相应资金。投资者是基于原来的股本金来计算其持股比例。


    这种融资形式，企业并没有获得资金，获得资金的是企业家(发起股东)个人。


    也就是说，投资者收购企业股权的资金流入了企业家个人的账户，而非流进了企业的账户。


    股权融资不但是权益与资金的交换，同时也是风险与利益的权衡。投资者虽然分享了企业分配的权益，但同时也分担了企业经营的风险。


    ![](img/ba95c5543d44302d19187a4e023c4277_129_0.png)


    企业吸收的外部股东越多，抗风险能力越强，反正天塌了大家的肩膀扛着，石头掉下来砸的是大家的脚，又不是你一个人疼。


    ## √消费经营股权融资模式


    一诺老师发明了一套特别的融资模式,将卖产品、卖商机、卖股权三合一：


    一诺老师把它命名为“消费经营股权融资模式”！


    它从而彻底解决了资金、客户、人才三大问题，在本书最后 一章一诺老师会详细剖析这套“消费经营股权融资模式”的操作细节和流程。


    它可以帮助你在 IPO 上市前就融资,把业务经营 30 年才能赚到的钱,只用 1 年就赚回来。


    将来有机会成为一诺老师的弟子,直接学习《股权的最高境界》,这才叫真正的股权！


    不过,一诺老师建议你先看下面的内容,循序渐进,这样收获最大。


    ## 第三节：打造爆款产品的完美流程


    爆款产品如何打造？


    首先产品由载体和功能两部分构成。


    功能就是用户想要的好处，载体就是表现的方式。


    例如，中国防感冒纸巾开创者：益加壹防感冒纸巾。防感冒是它的功能，纸巾是载体。


    ## 第一部分——载体：高频、重复、高大上


    选择产品载体的时候，可以参考以上 3 个原则：高频、重复、高大上也就是高频率、重复使用、看起来高端大气上档次。


    高频率、重复使用的好处是，你只要开发一次市场，用户就会高频率重复使用，产品自动就有了回头客。


    同时，因为客户会以貌取人，所以在外观上，要看起来高端大气上档次中国人自古就有买椟还珠的典故，好包装可以增加产品的卖相，好卖相可以多卖钱。


    有时候增加 10% 的包装费，就可以提高 100% 的定价！


    ## 小钱靠努力.大钱靠吸引力《全球疯狂吸金》错过这本书.损失十个亿


    三国中，卧龙凤雏齐名，都是才华横溢之辈，可为何卧龙诸葛亮飞黄腾达，而凤雏庞统郁郁不得志？时也？命也？运也？不得而知。


    但有一点公认，卧龙比凤雏长的帅！


    武松打死一只老虎，李逵打死四只，为什么只有武松成为打虎英雄？因为武松比李逵长得帅！


    所以，要帅！


    大家都知道，之前某位弟子，一诺老师安排他们把之前演讲音频整理成书《商业模式 XXXX》，I 服了 U，结果段落不清，字小的看到眼睛！几乎没有排版可言，跟谈不上什么美！


    ![](img/ba95c5543d44302d19187a4e023c4277_132_0.png)


    当时一诺老师告诉助理，不要写我的名字，结果说晚了一步，印刷厂一下子印刷 1 万本，还好一诺老师的粉丝非常认可一诺老师，很少对外观挑剔什么，还有就是由于内容是一诺老师音频课程的原汁原味，除了几个人反映排版丑陋、字太小，


    基本上没有什么投诉！


    ## 第二部分——功能：广谱、畅销、高价值。


    俗话说，女怕嫁错郎，男怕入错行。不是每个行业都一样赚钱，同时赚大钱的行业一定有个相对应的大市场。


    产品功能和概念在包装开发的时候，可以参考：广谱、畅销、高价值，也就是市场受众广阔、广泛被人接受认可的畅销概念、高附加值。


    例如，今天你卖一个左撇子专用的网球拍，市场份额就不会太大，因为用户太窄众了：你的用户既得是体育爱好者、又得会打网球、还得是左撇子！换句话说，这样的人群太少了。


    ![](img/ba95c5543d44302d19187a4e023c4277_133_0.png)


    如烟这款产品一出来，为什么能够在中国赢得上百亿的市场份额？


    因为它是替代香烟的产品，而中国的烟民实在太多了！


    ## 小钱靠努力.大钱靠吸引力 《全球疯狂吸金》 错过这本书.损失十个亿


    中国防感冒纸巾开创者——益加壹防感冒纸巾，是如何开发的？首先它选的载体是纸巾，是重复消费的载体，客户用了还要用。此外，它的主广告语是：怕感冒，用益加壹就好！


    产品核心诉求是防感冒。


    你知道嘛，中国所有的药物里面，最多的是感冒药，这几乎是人人都会得的病，是个绝对的大市场。感冒药市场，光 OTC 非处方药就是每年 400 亿，而预防是治疗的
    10 倍，也就是 4000 亿的大市场！


    就像当年的王老吉凉茶，主打“上火就喝王老吉”，结果一直没走出广东。后来从治疗定位成预防，主打“怕上火就喝王老吉”，马上就卖遍了全国，红遍大江南北。


    所以，益加壹防感冒纸巾，一出来就切中了 4000 亿的大市场，这也是它产品刚面世就受到市场火热追捧的原因之一，你也想开发出畅销的产品吗？想？！


    那么你需要先提炼出畅销的概念和功能。


    如何提炼？


    方法很简单——下节课再会！

