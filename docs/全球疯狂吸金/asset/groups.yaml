    ### 第二个绝招：请进来


    你还可以请进来，把同行的员工请进来，三倍的薪水来不来？策反对方员工这是投资，不是成本！切记！


    头一个月他为了拿 3 倍的薪水，他得表现一下，他原先的客户资源就可以为你所用了，关键是三个月下来，你要把他的个人资源转化成你的企业资源，把资源分离出来，至于三个月以后怎么用他，你就可以自己权衡了。


    你可以卧底，也可以挖角，还可以潜入到对方的大客户当中(对方的吸金活动怎么会漏了他的重要客户，几乎是不可能的)，更重要的是，你可以随时关注他们经常使用的吸金方法、广告、分销渠道、促销手法，你可以按照对方的广告提示，拨打对方


    的订购电话，全程录音，看看对方在电话里说些什么。


    你也可以提出各种刁难的问题，看看对方是如何回应的，这些都是极好的销售话术和说词。


    你还可以购买对方的产品，成为对方的客户，看看对方是如何服务的，这样有利于你改进自己公司的服务流程。


    然后你还可以更进一步看看对方继续卖什么东西给你，对方是如何在后续赚钱的，这样有助于你升级自己后续的盈利模式。


