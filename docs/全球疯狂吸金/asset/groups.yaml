    ## 第一个关键：垂直供应链扁平整合


    如何打造极致爆款单品？除了上述所说，还有一个关键：


    垂直供应链扁平整合当你准备进入某个行业时，你要了解整个供应链上下游各个环节，看看哪个环节赚的钱最多，然后停留在最赚钱的这个环节。


    ![](img/ba95c5543d44302d19187a4e023c4277_153_0.png)


    原料、加工、品牌、代理、分销、仓储、运输等各个环节，一直到用户手里，不是每个环节赚的钱都一样多。


    一诺老师就拿运动服装来说吧，耐克最大的代工厂在东莞，代工商给耐克最高档一双鞋子不超过 200 元，耐克贴上明星版、限量版之后，却可以卖到 5000 元，净赚
    4800 元。


    而代工厂扣掉厂房、设备、原料、工人等等各项费用之后，净赚不到 2 块钱。


    根据 “微笑曲线” 的理论，一个产业当中，最赚钱的通常是品牌和吸金这两端，而剩下的原料、加工、仓储、运输渠道、零售等，各个环节是整个供应链附加值最低的。


    ![](img/ba95c5543d44302d19187a4e023c4277_154_0.png)


