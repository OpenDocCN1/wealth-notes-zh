    ## 前 言


    大家都知道一诺老师自创立《商业模式》课程起，在教育行业辛勤奉献 19 年，凭借 100%实战案例教学，不仅桃李满天下，也为社会培养无数弟子，这些弟子都在授课《商业模式》、《顶层设计》、《利他模式》、《免费模式》、《盈利模式》、《股权兵法》、《融资兵法》、《信用融资》、《营销兵法》、《万能营销》、《成交心法》、《万能成交》、《品牌魔力》、《魔鬼营销》、《疯狂爆粉》、《魔力演说》等，一诺老师很荣幸能为社会培养这么多优秀讲师人才。


    大家都知道，一诺老师的课程采用 100%实战案例教学，案例全部来自于一诺老师原创！是一诺老师深入成功企业、走访全球成功人士、一诺老师亲自顾问案例及弟子实操案例。


    众所周知，一诺老师一直被模仿，从未被超越！一诺老师已经把整个培训界甩开了一个银河系的距离！


    见证奇迹的时刻！激动人心的时刻！不要哭、不要激动，现在就马上开始体验这本旷世绝学《全球疯狂吸金》！


    ![](img/ba95c5543d44302d19187a4e023c4277_3_0.png)


    ## 愿景：惠及全人类！ 使命：帮助更多人实现梦想！


    - ☆ 改变世界商学院・创始人

    - ☆ 改变世界 APP・创始人

    - ☆ 共产主义接班人、人民日报最佳评论人

    - ☆ 《猪买单》著作权人和商标持有人

    - ☆ 《全球疯狂吸金》著作权人和商标持有人

    - ☆ 《全球疯狂变现》著作权人和商标持有人

    - ☆ 一诺老师从事教育行业 19 年，能系统拆解古今中外企业家成功案例，并将总结的商业真谛深入浅出的穿插在教学中。


    一诺老师的梦想就是成就你的梦想！


    ## 一诺老师与德国前总统伍尔夫


    ![](img/ba95c5543d44302d19187a4e023c4277_4_0.png)


    2017 年 11 月 27 日，全球中小企业联盟大会在上海胜利召开，一诺老师应邀出席会议，席间德国前总统伍尔夫亲自会见了一诺老师，高度赞扬一诺老师对全球中小企业做出的杰出贡献，并充分肯定了【改变世界商学院】世界企业家摇篮的地位！


    面对一诺老师盛情邀请伍尔夫出席《全球中小企业・改变世界论坛》欣然接受并表示期待！


