    ## 第十一节： 在关联商家的鱼塘疯狂捞鱼


    此外，你要牢牢看紧的第二个人，就是你的关联商家。


    无论你要找什么顾客，别人都已经有了你要的顾客，你要的是跟这些关联的商家达成一个共赢的关系，让他心甘情愿把他的顾客推荐给你即可。如果你是一个卖女装的零售店，你可以考虑跟那些卖女鞋、女包、珠宝首饰、女子会所的商家们合作，直接接收他们的顾客就好了。


    你要明白一句话，听懂的多赚10个亿——


    ![](img/ba95c5543d44302d19187a4e023c4277_264_0.png)


    这些人就是你的关联商家，尽管你们不是同行，但客户都是重叠的。找到关联商家之后，如何跟关联商家合作呢？


    看看下面的案例。


    一诺老师的两位弟子，一个卖木门的企业跟一个卖门锁的企业，他们两家合作效果非常好。


    这个卖门锁的企业呢，平均每年大概要将近投十几万的广告费，投在网上，效果都很一般。


    他跟卖门的企业合作以后，他是这样的，卖门的企业为他推荐一个客户过来，他把第一单利润一半都给对方。


    卖门的企业，对他来说的话，很简单，他只要多句话推荐一下就可以了。但是对他来说的话，他就额外能赚到钱。


    对卖门锁的企业来说的话，他光这一点产生的利润比他平时网上投广告效果还要好。


    ![](img/ba95c5543d44302d19187a4e023c4277_265_0.png)


    看似他把第一单一半的利润让出去了，但是抓到了一个客户，这个客户续购，这个客户重复下订单，就不一样了。


    类似的案例，在一诺老师《弟子秘训》音频课程里面都经常讲到，不仅很详细，还有如何操作的实操步骤！


    大家可以登录【改变世界】APP 收听。


    你完完全全可以找到更多关联的商家。


    你要思考一下——


    顾客在买你之前要先买谁？


    顾客买你之后又再买谁？


    除了找上下游，你横着再找，顾客要配合哪一些东西才能把你的东西用到最好。这样一来，你可以找到很多的资源，找到很多的关联商家来合作。


    ### 一诺老师再给大家举个例子：


    在北京有一个高端家具定制家具公司，顾客特别少，以前呢就投放广告，发单，他什么都做，特别累，人累心更累！


    ![](img/ba95c5543d44302d19187a4e023c4277_266_0.png)


    后来经过一诺老师辅导之后，跟关联商家合作，他开发了一款产品就是定制木桌，这个木桌要卖 2000 块钱。


    然后呢他研究发现北京很多业主和别的地方不一样，北京人算得很精明，他喜欢自己跑到装修市场去，不愿意让师傅给买材料。他说：师傅啊，装修工人你需要什么材料你跟我说，

    我去买。他担心那些师傅偷工减料，缺斤短两的。


    业主喜欢自己去装修市场采购，这个定制家具公司他们知道这个消息以后，就跟所有的装修市场来谈合作，你是卖油漆的，你是卖涂料的，他就跟你谈了——


    顾客来你这边买够 2000 块钱油漆，我就送他一个 2000 块钱的定制木桌好不 好？我来赞助你好不 好？


    那合作商家乐不乐意合作？当然乐意！


    因为增加他油漆的销量了，增加他油漆的附加值了，而且他也不用花什么钱，所以很多合作商家愿意跟他合作，他找了很多商家一起来合作的。给对方不可抗拒的好处！


    ![](img/ba95c5543d44302d19187a4e023c4277_267_0.png)


    但是顾客需要付出什么呢？顾客买了 2000 块钱油漆，我现在要送你 2000 块钱的定制木桌，很精美的定制木桌，但是你要付 150 块钱的上门安装费，其实成倍基本就
    150 块钱。


    顾客一看，挺划算呀，150 块钱的确是成本费，你知道嘛，

    他定制木桌，材料费也就是 100 块钱，然后上门安装都是自己人，人工 50 块钱，这样是成本打平的，一分钱没花，一分钱没赚，赚了一个顾客。


    装修设计师上门来帮你定制，因为是定制没有现货啊。定制来了一个上门装修设计师，上门来帮你定制，发现你家里不光要定制木桌，因为现在很多家具都没有，橱柜、书柜、床通通都需要定制，你发现上门来了个什么？


    来了个推销员，走的时候带了几十万的合同走了。


    这位弟子就通过一诺老师指导的这一个策略，公司业绩立刻就上去了。


    ![](img/ba95c5543d44302d19187a4e023c4277_268_0.png)


    但是这里边需要几个策略，一个你跟关联商家怎么合作？关联商家凭什么跟你合作？是，你对他有没有增值？前提是你不要损坏他的顾客，人家说我把顾客推荐过来，然后到你这边


    上当受骗，他就不愿意了，前提是他要保证他的客户是安全的，同时他是额外能得到好处的。


    只要在这个基础上他是愿意来帮你合作的，要么你帮他促进销售，要么你帮他增加利润。


    记住这句话，顿悟人生真谛——人们只对好处说 YES!


    跟关联商家合作当中，我的建议，你可以把你的前端产品当做对方促销的赠品。


    ![](img/ba95c5543d44302d19187a4e023c4277_269_0.png)


    他拿一个东西出来送给他的顾客，就是买他的东西送你的这个东西，可以增加他的附加值，同时把你的东西连带出去了。


    当然这个只是前端产品，前端产品是不完整的产品，顾客要买完整的，怎么办？花钱，买后面的。


    或者是你当做对方追售的后端产品，你说，你看，你卖了服装你没东西卖了，你再卖我的饰品吧，再卖我的箱包吧！


    你还能多一样东西卖，我给你供货，然后我来替你服务，

    你故意给他的只是一个不完整的前端产品，你为他服务的时候就能做成追售你的后端产品，也能从里边再赚钱，这个都是可以的。先免费，后收费，免费就是为了更好地收费！


