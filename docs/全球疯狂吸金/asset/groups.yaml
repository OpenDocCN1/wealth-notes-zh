    ## 第十节：在竞争对手的鱼塘疯狂捞鱼(合作篇)


    好，一诺老师带你一起来看一下怎么把对手都变成帮手。


    有人说：同行是冤家，我恨死他了，恨不得拿刀砍了他！


    一诺老师告诉你：没必要的，你的竞争对手他和你一样，他们热爱这个行业，然后他们服务同一群顾客；跟你一样，你们应该可以成为很好的伙伴，但是很多人因为竞争对手打压，所以竞争都要搞得你死我活，死去活来，没有必要的。


    你只要找到大家更多的共赢的点，找到更多的合作的点，你会发现这个世界上都是合作伙伴，没有对手。


    ![](img/ba95c5543d44302d19187a4e023c4277_257_0.png)


    你知道林肯说怎么消灭敌人吗？


    把敌人变成朋友，然后敌人就被消灭了，还多了一个朋友，所以天下无敌！什么叫天下无敌呢？就是每个人都是合作伙伴。


    有一家大学他们招生一直是一个很困难的事情，他们是一


    个民营的学校，私立的，他思考怎么和别人有效地来做竞争？


    有一天突然找到一个点子，哇，那个点子实在是太棒了，他就跟别的大学来做合作，你知道吗，有些名牌大学他们师资队伍、他们的品牌、他们的知名度、他的广告预算、社会资源都是比较多的，招生根本就不发愁。


    ![](img/ba95c5543d44302d19187a4e023c4277_258_0.png)


    举例：北大、清华那些名牌大学，招生根本就不发愁，但是是每年招生的数额是有限的。


    比如北大就招一部分学员，比方招一万个、两万个，再多了放不下了，但是由于他是大牌子，所以报名的人可能有十万个，但是最终招一万个，那意味着有九万个是不收的。


    他就找那些学校一起来合作，尽管是竞争对手，他说 ok，很显然那九万个你是没法去服务他们的，那你不去服务他们，他们今年也是要读大学的，你们不收，他们可能到别处去读书。


    那你呢，把名单给我，我来跟踪，每成交一个，我付 500

    千块钱给你，可不可以？可以。


    对方招生办的觉得，恩，就提供名单给他也没什么事情，反正是 我不用的，对他来说的话，虽然牺牲了 5000 块钱，但是剩下的钱是净赚的，毕竟一分钱广告费没有花。招生的成本大大地降低了，而且一夜之间开发了大批的客户。


    还有一家餐饮公司他们做加盟连锁，需要招商，当时广告预算要花两百多万，但是不太确定广告费花出去能招多少客户，能招多少加盟商过来，然后也用同类的办法，就是找其他的竞争对手合作，因为对某些餐饮品牌来说，每个地方是有区域保护的。


    ![](img/ba95c5543d44302d19187a4e023c4277_259_0.png)


    比方这个县城我就招一家，这个县城可能有三家是公司想要加盟的，最终只招一家，还有两家是闲着的，没有办法给他做这个品牌的。


    他说，你只要把名单提供给我，每招成功一家，我付两万


    块钱给你，每招成功一家赚两万。对方肯定乐意合作。


    在这里竞争对手你发现都变成了什么？帮手。


    对手都变成了帮手，你完全可以采取这样的策略。


    因为对手他有些顾客是服务不过来的，你可以找很多竞争对手去谈！你这样说：现在呢，我猜可能你的顾客当中已经有很多顾客很久没买单了，已经有很多顾客流失了，已经有很多顾客不再回头过来了。我猜如果你能推荐给我的话，那我每成交一单，我愿意付多少利润给你。


    ![](img/ba95c5543d44302d19187a4e023c4277_260_0.png)


    你只要开诚布公来跟他谈，竞争对手是乐意来做的，这是完完全全皆大欢喜的事情。


    你跟竞争对手谈了：你没有成交的客户可以给我，你已经流失的顾客可以给我，你要淘汰的客户你也可以来给我，成交以后跟你来分钱，然后我们可以签定协议，这个都是可以的。


    包赚不亏、利人利己的事情，属于人类都会心动的！


    这样的话你可以跟更多竞争对手合作，你就能轻松拗到一大把顾客，可能这个顾客就是不喜欢甜的，但他喜欢吃你家咸的，换一个口味就成交了。


