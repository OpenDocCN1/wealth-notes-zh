    # 第三节：打造爆款产品的完美流程


    爆款产品如何打造？


    首先产品由载体和功能两部分构成。


    功能就是用户想要的好处，载体就是表现的方式。


    例如，中国防感冒纸巾开创者：益加壹防感冒纸巾。防感冒是它的功能，纸巾是载体。


    # 第一部分——载体：高频、重复、高大上


    选择产品载体的时候，可以参考以上 3 个原则：高频、重复、高大上也就是高频率、重复使用、看起来高端大气上档次。


    高频率、重复使用的好处是，你只要开发一次市场，用户就会高频率重复使用，产品自动就有了回头客。


    同时，因为客户会以貌取人，所以在外观上，要看起来高端大气上档次中国人自古就有买椟还珠的典故，好包装可以增加产品的卖相，好卖相可以多卖钱。


