    ## 有三种分成的模式：人头费、注册费和销售分成


    什么是人头费？就是按照人头来付费。


    就像百度竞价，不管有没有成交，只要把人带到你的网站，


    你就要付钱给百度。


    有些旅游区的商家也采用这种模式，只要导游把游客带到


    购物商家店里，商家就按照人头给钱。


    一诺老师曾经遇到过一家职业做会议邀约的团队，他们只要帮会议主办方邀请个人到会，主办方就按照人头给钱。


    什么情况下你用人头费跟对方合作？


    就是之前对方还没跟你合作过，也不知道你的成交能力怎么样，在不确定后续有没有收益的情况下，你就可以用人头费合作，好让对方安心。


    比人头费再好一些的方式就是注册费，也就是按照来的用户，留下的注册名单来付费。这样做的好处是，万一客户没成交，你还可以展开后续的跟进，反正有名单——你可以持续的为客户贡献价值，持续的保持联系，直到成交！


