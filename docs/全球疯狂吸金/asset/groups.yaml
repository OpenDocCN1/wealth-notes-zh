    你是公司的老板，下面有 200 号员工，送你一张；你是商会的主席要送你一张；你是记者认识很多人，送你一张；你是这边最活跃的推销员，认识很多人，送你一张；你是报社的社


    长，送你一张。送了整整一万张出去，后面生意就源源不断了。


    这个意见领袖就是一个活动的活的广告，移动的活广告。


    这个意见领袖是这么一群人。


