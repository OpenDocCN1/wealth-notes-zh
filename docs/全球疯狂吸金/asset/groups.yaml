    他们请别人，或者是带别人去那边吃，他们会告诉别人那边有个鸡翅的。他们平时聊天会聊起来，而且没有广告痕迹，没有广告痕迹的，分享，完全是分享。


    ![](img/ba95c5543d44302d19187a4e023c4277_290_0.png)


    你为什么会看一本好书呢？谁推荐的？可能是听一个老师、听朋友推荐的。为什么你知道一个好的电影呢？朋友推荐的。


    这就是圈子，圈子的文化，这个圈子是很有威力的，圈子


    是很恐怖的，赢见领袖是圈子当中最有发言权的最有影响力的人，你把这一个人搞定，整个圈子就拿下来了。


    有一种人脉的理论叫做六度空间的理论。


    他说全世界所有人，我们最多只隔着 6 个人，你找到任何一个人只隔着 6 个人，只隔着 6 个人，只隔着 6 个人……


    而且他们做过测试，结果很精准。


    那六度空间里的第一度空间的最核心的就是意见领袖，你只要找对人，很多事得办成了。


    这是重点，所有潮流的变革、趋势的引领都是从意见领袖开始的，所以你要善于利用这群人。


    ![](img/ba95c5543d44302d19187a4e023c4277_291_0.png)


