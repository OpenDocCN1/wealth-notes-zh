    为什么不是只盯着第一名呢？


    因为有时候第一名的方法你不一定学得来，例如：某个第一名在上海市市场一直领先，原因是他的政商关系比较好，市长是他亲戚。这个你怎么学？中国 3000 个县市，你不可能在每个县市都找个县长、市长当亲戚——主要是你妈没给你生那么多姐妹！（捂脸）


    当你综合去研究行业前三名竞争对手的时候，你会发现，可能第一名比较擅长互联网、第二名比较擅长传统渠道、第三


    名比较擅长做外贸，猫有猫道，鼠有鼠道，只要活的滋润的，各有各的门道。


    你就可以集中众人所长为你所用，将你的吸金方案优化，为你的成功加速。如何学习竞争对手的捕鱼方法？甚至打劫对方鱼塘的鱼呢？一诺老师教你两大绝招——


