    # 许绍雄出任改变世界商学院联席院长·形象代言人


    ![](img/ba95c5543d44302d19187a4e023c4277_5_0.png)


    1972 年、许绍雄在第 1 期无线电视艺员训练班毕业后加入无线电视，停在无线工作二年后转到丽的电视工作、四年后再次回到无线。许绍雄是第一个驾驶奔驰上班的艺员，所以他被人
    们 Benz 雄。2012 年，获得万千星辉颁奖典礼杰出演 员奖。2013 年香港 TVB2013 台庆颁奖礼，许绍雄凭借《My 盛 Lady》获得最 佳男配角。2014
    年，在周润发的电影《澳门风云》中饰演了奔 驰哥一角。2015 年，在郑中基、何超仪主演的《第七谎言》中 饰演了包机公。2016 年，同以电影《使徒行者》……'
