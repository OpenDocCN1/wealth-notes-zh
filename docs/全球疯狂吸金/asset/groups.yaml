    所有的参与方都是人，你要做一件事情就是把一群人凝聚在一起，你要做的平衡就是在平衡人。


    ## 第六节：整合天下财富的四个杠杆


    一个人上山摘桔子，你一天摘不了多少，你需要找一帮人，


    可是你发现一群人一起摘的更少，都抢光了。


    如果每个人各取所需，你要橘子皮做陈皮，他要桔子瓤做肥料，他要桔子汁提炼 VC，他要桔子籽做种植，这几个人一起上去摘，摘的桔子就比较多，各取所需啰。


    合作就像打麻将，你把废牌扔掉，从别人扔掉的废牌里找对自己有利的牌。


    ![](img/ba95c5543d44302d19187a4e023c4277_68_0.png)


    是的，你需要的资源早就为你准备好了，他们都可以为你所用，关键是凭什么？只要你学会这一课：《整合天下资源的四大要素》天下资源皆能为你所用！


    这四大要素是：最佳利益、最小风险、最简单、最平衡。


    ## 第一个杠杆：最佳利益


    在座各位企业家，你们需要思考，你现在的顶层设计，需要哪些人参与，你要满足每个参与方的最佳利益。


    每个人不是被你领导，是被自己的价值观领导，员工不是在成就你的梦想，是在成就他自己的梦想，他发现在你的平台上能成就自己的梦想，顺带的替你做点事。


    > 你能成就多少人，就有多少人成就你！

    —悟老师


    每个人都会选择最符合自己最佳利益的行为。


    - ☆员工为什么流失呢？觉得跟你混没前途！

    - ☆客户为什么会被人挖角？别人家好处多！

    - ☆经销商为啥会去卖别人的货？卖别人的更挣钱！

    - ☆银行为啥不给你投钱了？他发现投到别人那里赚钱更多！


    把这句话记下来：钱喜欢往大的地方去！


    - ☆为啥厂商不给你供货了？他发现产品交给别人销量更高！


    你要反复问自己：今天我的蓝图规划是否满足了每一个参与方最佳的利益？


    所有的项目里都有创造价值和传递价值的过程，今天这个时代，我们发现传递价值的方式发生了很大的变化，可是创造价值的人真正的开心了。


    之前要过年了，杭州有一半的服装店倒闭了，很多人网上买，为什么？更便宜。


    这个社会变化很快，以前鸡犬相闻打死不相往来，如今互通互联。如果你是真的有价值。你的舞台会更大，你的机会更多。这个时代是真正有价值的人的狂欢节。很多人的课程没人听，因为没价值！为什么一诺老师的音频课程你可以听
    3 遍、5 遍、10 遍、100 遍？因为有价值！


    ![](img/ba95c5543d44302d19187a4e023c4277_70_0.png)


    每个人都在坐井观天，位置决定角度，角度决定观点，观点决定世界观，世界观决定你的世界。


