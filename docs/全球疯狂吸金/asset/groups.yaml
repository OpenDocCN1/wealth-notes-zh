    ## 第一节：如何把对手拉开一个银河系的距离


    13 年前，一诺老师的一位弟子做珠宝的，送给一诺老师一枚很大的钻石。


    他懒洋洋躺在沙发上，左手拿着茶杯，用嘴轻轻吹动茶水的热气。云雾缭绕中，他右手拿着这枚钻石，凝视着对我说：


    一诺老师，您知道吗？作为宝石，必须具备美丽、耐久和稀少这三大要素。而钻石是唯种集最高硬度、强折射率和高色散于一体的宝石品种，远胜过其他宝石品种。


    自古以来，钻石一直被人类视为权力、威严、地位和富贵的象征。


    ![](img/ba95c5543d44302d19187a4e023c4277_48_0.png)


    钻石又被象征着对爱情的坚贞，一枚钻戒成为承载两人爱情最美好的信物，正所谓，钻石恒久远，一颗永流传，一诺老师您说，是不是因为钻石的成分比较特别，所以卖的比较贵，


    对吗？


    一诺老师喝了一口茶，摇摇头，笑着回答：“钻石是这个世界上最坚硬、成分最简单的宝石，它是由碳元素组成、具立方结构的天然晶体。它的成分与你常见的煤、做铅笔芯的石墨成分都是一样的。换句话说，钻石和石墨其实是一样的成分！”


    弟子有些好奇：“可为什么钻石和石墨的身价差几万倍呢？”


    ![](img/ba95c5543d44302d19187a4e023c4277_49_0.png)


    一诺老师：“因为它们的结构不同。碳元素在较高的温度、压力下，结晶形成黑色的石墨。而在高温、极高气压和缺氧的环境下，则结晶为珍贵的、无色的钻石！


    钻石是世界上最古老的宝石，它形成的条件一般为压力在 6.0Gpa(相当于 150-200 千米的深度),温度为 1100-1500 度高温，这样导致它的结构非常稳定，是天然矿物中硬度最高的宝石。”


    一诺老师一边说一边把这枚钻石递给弟子。


    弟子接过这枚钻石思绪万千……


    弟子不解的问：“一诺老师，钻石和石墨成分都是碳，可是身价差几万倍？”


    一诺老师压了一口茶，说：“这个问题问的好，因其结构不同；图书馆里的书，有序摆设和随意丢弃，找寻时难度不同，因其结构不同……”


    可见，好结构多么重要——


    《孙子兵法》：“故善战者，立于不败之地，而不失敌之败也。是故，胜兵先胜而后求战，败兵先战而后求胜”也就是说，真正会打仗的人，都是先谋划，先创造取胜的条件才开战。


    ![](img/ba95c5543d44302d19187a4e023c4277_50_0.png)


    凡事预则立不预则废，谋定而后动，大事可成。


    盖楼房时，必定先绘图纸，而后建筑。


    一诺老师反观自己从事教育这些年来，弟子当中不乏大大小小的企业老板，因此见惯了商海沉浮，看多了商战成败，是什么导致大企业穷途末路？又是什么令到小公司一夜成名，做强做大呢？究其根源，都是因为结构不同。


    什么是好结构？


    有序的、稳定的、平衡的，对各种相关资源能够合理统筹排序的程序，就是好结构。


    好结构可以让一个组织做到人尽其才、物尽其用、合理配置、协同增效、各方多赢的局面。


    很多讲师说要靠口才、靠演讲、靠信心、靠决心、靠梦想驱动，很显然这些人是吃瓜讲师培养出来的吃瓜讲师！


    演讲想要成功靠什么？——结构！(实战、落地、可操作)


