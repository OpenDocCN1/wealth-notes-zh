    你要找出你诉求中的关键词。飘柔的关键词是柔顺，海飞丝的关键词是去屑，潘婷的关键词是营养护发的，联邦快递的关键词是保证隔日到达。你要了解你竞争对手的诉求是什么，你要和他们进行区分隔离，重新命名之后就是新的。没有客户会砸开你的产品看每一种原材料，绝大多数人对产品本身是无知的，请问你穿了衣服那么多年，你懂衣服的每一块布料，每一根线头吗？你懂吗？你的产品在客户面前就是个黑匣子。


