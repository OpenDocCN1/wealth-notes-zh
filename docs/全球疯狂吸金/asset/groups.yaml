    在北方有个老板开了个海鲜馆，雇了个司机从南方给他运海鲜，结果经常接到司机半路打来的电话：“老板，车坏了，打点维修费过来！”如果老板不打钱过去，那么车就停在那里不动，几天之后，一车几十万的海鲜就都坏了。如果打钱过去，就发现维修费挺贵。过几天，司机又打电话来：“老板啊，被交警拦住了，要罚款。开收据两万，不开收据只要一万，你看开不开呢？”对老板来说，开不开都难受，因为又要花钱。


    后来老板想了个点子，把车以成本价，分期付款卖给这个司机，每个月从司机的工资里面扣一点购车款，结果再也没听过类似的电话。


