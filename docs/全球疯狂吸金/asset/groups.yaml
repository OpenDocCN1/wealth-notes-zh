    ## 第一个境界：卖产品


    产品买单的是用户，用户是金字塔的底层，是系统的消费者。大鱼吃小鱼，小鱼吃虾米，虾米吃泥巴，用户就是泥巴，是生物链的底端，可是没有泥巴大家都得死光光。


    用户感兴趣的是效果好、品质好、功能好、品味好、包装好、价格好……服务好等等一系列的元素，同时用户对你效果好、品质好、功能好、品味好、包装好、价格好……服务好，一点兴趣都没有！


