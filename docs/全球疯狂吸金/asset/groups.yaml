    ## 第二节：高端爆款产品畅销秘诀(超级赠品)


    高端产品，客户在购买的时候会犹豫，为此，你还要记得设计自己的赠品，就是免费送给客户的产品或者服务。


    赠品可以说是一个百搭产品，能够用在你吸金方方面面——你可以把它用在鱼饵产品里，增加对新客户的吸引力；


    你可以把它用在销售其他正式产品的时候，增加核心产品的附加值；


    你还可以定期通知客户过来领取赠品，当客户过来时借机促销其他的产品。


    有人说：“一诺老师啊，我这套东西没卖，我送出去了，这不就亏了吗？”


    不要这样想，你要思考：吸金是一个整体的协同作战，是一个协调的工程，不是一每一款产品都要赚钱的，而是整体获利的一个过程。


    就好像田忌赛马一样，用下等马对对方的上等马，输第一局输得很漂亮。然后用上等马对对方中等马赢一局扳平，用中


    等马对对方的下等马胜一局，赢得决定性的胜利。


    ### 吸金是一个整体获利的过程，讲的是各种资源的配置，最终能够更好的获利。获利才是你要的。


    ![](img/ba95c5543d44302d19187a4e023c4277_212_0.png)


    好多消费者在买东西的时候，因为有赠品买了，没赠品不买，因为赠品好买了，因为赠品不好不买。


    一诺老师 1000 次以上实验证明：很多人非常看重赠品！


    ### 赠品是你吸金中很有利的一个杠杆！


    在设计超级赠品的时候，要注意三点：


    ### 首先，赠品也要塑造价值，否则客户不稀罕；


    ### 其次，赠品要跟核心产品要能够关联互补；


    ### 最后，为了更好的促成交易，你可以用超级赠品。


    3 种以上的赠品组合，就叫做——超级赠品！


    一个赠品只能打动一种类型的客户，一诺老师的弟子们通常会送客户 3 个以上的赠品，这样几乎可以通杀。


