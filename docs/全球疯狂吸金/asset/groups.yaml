    而“山寨春晚”赞助费也拿到了几百万。


    ![](img/ba95c5543d44302d19187a4e023c4277_277_0.png)


    对于不知名的品牌，要想迅速成名，就需要借助社会热点事件、名人、社会文化等，形成人们和媒体关注的“社会话题”。


    例如，在“山寨春晚”的策划中，策划人很聪明的将话题转向了“话语权”，当众人褒贬不一时，山寨当事人则称：“我们要的无非是一个话语权”，进一步的引发舆论的争议。


    而这种“八卦”的事件，恰恰需要的是争议和炒作！


    因此：“山寨春晚”的策划名副其实的将成为 2008 年最成功的“话题口碑”传播案例。


    无独有偶，2008 年 5 月 18 日晚，由多个部委和央视联合举办的赈灾募捐晚会上，加多宝集团代表阳先生手持一张硕大的红色支票，以 1 亿元的捐款成为国内单笔最高捐款企业，他们的善举顿时成为人们关注的焦点。


    > 有话题炒作话题,没话题的创造话题炒作话题！

    — 悟老师


    第二天在一些网站社区里，不断流行着这样一个名为《封杀王老吉》的帖子：“王老吉，你够狠！捐一个亿，胆敢是王石的 200 倍！为了整治这个嚣张的企业，买光超市的王老吉！上一罐买一罐！不买的就不要顶这个帖子！”


    这个热帖被各大论坛纷纷转载。


    从百度趋势上不难看出：“王老吉”的搜索量在 5 月 18 日之后直线上升，而《封杀王老吉》的流量曲线与“王老吉”几乎相当。


    ## 小钱靠努力.大钱靠吸引因 《全球疯狂吸金》 错过这本书.损失十个亿


    3 个小时内百度贴吧关于王老吉的发帖超过 14 万个。天涯虚拟社区、奇虎、百度贴吧等论坛的发帖都集中在 5 月 23 日 18 点之前开始。接下来不断出现王老吉在一些地方断销的新闻。


    南方凉茶 “王老吉” 几乎一夜间红遍大江南北，一些人在 QQ 的签名档上开始号召喝罐装王老吉。


    可以说，话题口碑是转介绍当中，极具杀伤力的武器，而同时，它又是一把双刃剑，所以对于话题的选择，需要非常谨慎的设计。


    ![](img/ba95c5543d44302d19187a4e023c4277_279_0.png)


    当然，在转介绍的方法当中，你绝对不能忽视交际嵌入的威力。自古以来，人们都是群居的动物，我们都不能离群索居独自生活，都需要跟别人进行人际交往。


    ### 第三大终极武器：交际嵌入


    交际嵌入就是要把你的吸金活动，巧妙植入到客户的人际交往当中来，从而让客户在人际交往的过程当中，把你的产品、


    你的服务、你的企业传播给他所交往的人群。


    一诺老师的一个弟子是开花店的，学完《弟子内训》以后，

    做了一个交际嵌入的转介绍活动——“同城送花，温情传递”。


    ![](img/ba95c5543d44302d19187a4e023c4277_280_0.png)


    这位花店弟子对老顾客说：“现在我们正在举办一项老顾客回馈活动，叫做‘温情传递’，您只要在我们当地指定任何一个您的朋友，我们就以您的名义为她送上一束鲜花和您的贺卡，您只需要在这一张贺卡上签上您的名字，并且告诉我们您朋友的名字和联系方式，我们就亲自帮您送给她。”


    老顾客当然很高兴，纷纷留下自己朋友的联系方式让花店送花。通过这样的方式，花店就轻松获得了大量新顾客名单。


    当花店的员工把花送给新朋友时，还会对新顾客说：“您朋友对您真好，他很惦记您，这么忙还记得送花给您。您知道他为什么送花给您呢？因为今天是感恩节，一定要送花给最重要的朋友。人家送花给你，你也要买束花回赠朋友才对，要不然


    就失礼了！


    新朋友一想，也对，毕竟来而不往非礼也，通常也会买花回赠朋友。这样新朋友买花之后也变成了顾客。


    新朋友买花之后，送花的员工继续会给他讲：“正好现在我们正在举办一项顾客回馈活动，叫做‘温情传递’，您只要在我们当地指定任何一个您的朋友，我们就以您的名义为她送上一束鲜花和您的贺卡，您只需要在这一张贺卡上签上您的名字，并且告诉我们您朋友的名字和联系方式，我们就亲自帮您送给她。”


    这样一来，新顾客也会留下他需要送花的朋友的联系方式，花店会继续开发他的朋友。


    ![](img/ba95c5543d44302d19187a4e023c4277_281_0.png)


    很多新朋友在一番劝说下，通常都会购买一束鲜花回赠朋友。即便当时不买，也会在今后定期收到花店发来的短信跟踪，掉进花店的追售循环……


    同样的策略也可以用在不同的产品上，就像立顿红茶做的


