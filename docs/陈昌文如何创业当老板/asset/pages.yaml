  md: '# 第五章


    # 如何驾驭员工


    带团队，就是带 4 种人


    一个团队里，要管好的，其实就四种人。第一种，千里马型，千里马需要的是草原，而不是草料。这样的


    人，有能力干事，也愿意干事。这种人需要的是授权，授权是什么意 思呢？就是你当老板的要学会当这种人的下属，支援他做事。看他表 演就行了，而不是去控制他，去命令他。


    第二种：鸵鸟型员工，就是腿长，跑得快，但不跑，把头埋到沙 子里，这样的人，能干，但不干。这样的人就是需要不断的激励他，给机会，给平台，天天给他洗脑，打鸡血，他才有动力！


    第三种人。不会干的，不能干的，是猪一样的人，打着不走，牵 他，他就满地打滚。这样的员工，就直接告诉他，干了有什么好处，不干就杀了吃肉，开除。这样的人，直接给命令，让他干活。


    第四种人，想干，但完全没能力。有超强的动机和超烂的工作水 平。这种人呢，要保护他的工作热情，也要当好他的教练。


