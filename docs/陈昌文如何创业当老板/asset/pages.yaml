- pgno: 221
  md: '制度上假定恶就是当恶还没产生 或欲望还没产生的时候就将其抑制住,从道德上假定善意,从制度设 计上防治人的“恶”性发作。你无法要求你的部下全是天使,他会有
    魔鬼的一面,而我们制度的约束，就是减少他魔鬼这一面的释放。一 旦魔鬼的一面展示出来时，就可以以制度为参照抓住他的问题。




    如果没有制度依据，大家都含情脉脉：我相信你、信任你、你不 能辜负我的信任————当 然，你用人，就是因为信仼他的才能才用他， 而且我们还允许他有技术性的失误，因为我们自己犯过错误，也是在
    试错中一步步走向成功的。真正聪明的老板，知道下属犯错了，不吼 气、装傻、允许他犯点错误，当他知道错了之后，他会更努力地做， 珍惜你对他的信任。尤其是公司壮大了，授权实际上是非常重要的，
    一旦授权就不要横加干涉，这是所谓“疑人不用，用人不疑”，但不 横加干涉并不意味着连监督机制都没有。授权者要把握好到底什么样的 错误可以犯；哪些错误是致命的，这样的错误犯一次公司就会垮掉，
    一次都不可以犯。比如在原则问题上、道德问题上，如果还用这种毫 无约束的信任，那就是放任了。


    不是所有的人都是天使，人都有魔鬼的一面，没有束缚、没有约 束、就一定会出问题。我们自己不是天使，当然也不能要求我们的 员工和部下都是天使，我们要做的就是假定善意，辅以制度建设，将恶
    的一面抑制下去。


    # # 我的企业管理心得


    管理这种事情，公说公有理婆说婆有理，但我们去实践，就会获 得真理。在企业里，我们的管理是有目标的，是有绩效的，是帮助企 业更高效率的完成业绩的。只要是不赚钱的管理，就是错误的管理。


    我们看一个人的管理能力强不强，就是看他为企业带来的价值大 不大。


    企业的资源是稀缺的，管理者要把那些浪费公司资源的人与事去




    除，管理者应该有变废为宝的能力，让大家按照最优的路径去做事。 当一个企业有几十人'
