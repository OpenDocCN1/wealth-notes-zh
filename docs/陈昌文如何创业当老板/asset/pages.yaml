- pgno: 175
  md: '我的回答是：老人既然跟你了打江山，从贫寒的时候干起来的，就说明这个人很可靠，也有一定的能力。而新人，就算有能力，可靠性方面也要打一个问号。风险投资界有一句话：保住本金永远比挣钱更重要。就是要保证不亏，才算高手，保证不亏，就意味若立于不败之地。


    所以，我的态度很明显，用老人，用靠谱的人。新人就算很有本事，也是用其能力，先给老人做副手。只有经过风风雨雨的考验了，才重用，才彻底交心。


    小时候喜欢看三国，我们看曹操曹老板是怎么做的！几乎人人都知道，在武将之中能力最强的就是吕布，俗话说：人中吕布，马中赤兔。但是后来被称为武圣的并不是吕布，而是关羽。因为关羽具备了两个身为武将最重要的品质“忠”和“义”，吕布则是个三姓家奴，谁势力大就投靠谁。同样都被曹操抓住了，吕布原本还想找刘备求情，结果刘备说了一句“君不见丁原董卓之事呼？”于是曹操就把吕布给咔嚓了。关羽投降之后，曹操对他大力投资，关羽也是知恩图报，先是斩颜良诛文丑，解白马之围，后又华容道放了曹操。曹操的投资有了很大的回报。如果曹操是个投资人，那他肯定是个顶级PE，因为他懂得看人。


    其实曹操的选择就是，可靠比能力更重要，关羽是可靠之人，而吕布不可靠。所以，吕布不会受到重用，也不敢重用吕布。


