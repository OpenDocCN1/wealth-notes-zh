  md: '已经很简单了。今天讲给大家的概念是把这个数据都要公开让企业所有  有的人都知道。




    比如，我们数据化管理员工：一个员工每天为企业带来了多少收入，我们都很清楚，每天我们对他的用工成本是多少，我们也非常清楚。把这些信息公布给企业的每一个员工，滥竽充数者就活不下去，本来能出力，但混日子的人会更加勤奋。本来就很优秀的人，这就是对他的肯定，他当然会更加的努力，当然，企业的激励机制要跟上来。实际上，这就是利用信息化工具对大家进行包产到户，并且公布每个人的业绩，让大家不得不参与企业内部竞争。很多人认为这样不好，员工很不开心，实际上，现代社会竞争激烈，不能温温柔柔的过日子，我们在企业里，本来就要追求效率，就是要让大家有竞争意识。


    对客户的管理也要精准，到底哪些事情做了，客户满意，愿意付费，那些事情做了，客户根本就不在意。搞清楚了个过，我们就可以加大用户感兴趣的地方的投入。而不是盲目的乱投入，虽然整个公司很忙，但却没有多少业绩。


    对员工与客户的精准管理，清楚每一个员工的产出与支出，还可以很容易的挖掘到新的利润增长点，知道那些是低投入高产出的组合，可以给企业的发展方向提供一个参考。


    比如，你的公司请了一个策划，像这种职业，有时候很难判断他的价值，你就可以给他单独配一个业务人员，因为你有精准化的数据，这个策划的加入，这个业务人员的收入按照这个策划的做法，业绩是不是提高了，提高了多少，反复实验两次，就能得到一个大致的数据，好了，然后就在整个团队里推广。如果反不如以前没有策划的时候业绩好，你就要看看，是不是这个策划滥竽充数，水平有问题，在没有造成大的损失的情况下，请他走人。


    数据化管理，能清楚的知道你的每一个动作对企业的好处，让企业再也不是凭着管理人员乱打王八拳参与这个信息时代竞争！




    而且这个步骤非常简单，你自己可以做，请个文员也可以做。如 果你做，你就会爱上这件事，因为数据就是生产力。'
