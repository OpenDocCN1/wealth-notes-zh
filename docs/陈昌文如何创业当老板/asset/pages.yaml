    如何驾驭员工


    为什么要驾驭员工呢？答案很简单，因为如果你不驾驭员工，就 会不自觉的被员工驾驭。那为什么要给员工洗脑呢？因为你需要把你的 思想，想法装到员工的脑子里，你给员工下达的命令才能被很好的
    接收，才能很好的干活赚钱，没被洗脑的员工不是好员工。老是给你'
