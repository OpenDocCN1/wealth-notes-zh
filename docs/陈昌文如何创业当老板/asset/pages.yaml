  md: '# 只做一件事最赚钱的事


    为什么很多人碌碌无为，就是因为目标太多，想太多，一个人想太多，就没有执行力。而一个人如果只想一件事，只做一件事，他必定能行动起来，做得好的可能性就增加很多。


    一个老板，必须以结果为导向，结果导向就是赚到钱，有纯利润，我们不是搞科研的，我们做企业的目的是希望获得商业成功。


    赚钱就是要不断的探索新的赚钱方法，因为一定有更加优秀，更加简单，更加快速的赚钱方法。卖水果的赚钱方法与搞金融的赚钱方法差别太大，搞金融的一天就可以赚水果一年的收入。那么同样水平的人，为什么不去搞金融呢？我推荐有点脑子的人，想多赚钱的人，都进入金融这个行当去搞。


    老板就是找到当下最赚钱的事情去干，把不重要而非做不可的事情交给助理做！不重要，可做可不做的事情，就不做了。


    让公司所有的资金，人才帮你做第一重要的事情，不管你的公司是10个人，还是100个人，甚至1000个人，都只管一个最赚钱的业务。坚决不管理两个以上的业务。


    一个目标很容易就实现了，5个目标实现起来就有难度，10个目标能实现简直就是天才级的人物，我们大多数老板都是普通人，所以，找一个最有价值的目标干就行了。


    老板就是要有取舍的能力，抓住主要矛盾，就如同田忌赛马一样。田忌之所以能打败齐王，就是因为田忌懂得取舍，懂得把自己的优势排序。


    老板把什么人放在什么位置，把资金放在什么地方，把自己的精力放在什么地方，就决定'
