    姜太公怎么钓鱼的？直钩，也就是说没有鱼钩！而且离水面三尺！这事它怪异！怪异就要引起人的兴趣，怪异就要引起社会传播，市场认知度就要大大提高！这种做法我们今天有个词形容：事件营销。跟前几天，优衣库的那个试衣间是一样的效果。姜太公，简直就是营销高手。然后引起了周文王的注意，周文王就跑过去问姜子牙，你为什么这样钓鱼？姜子牙就说了句话：“守可直中取，不向曲中求。意思就是‘守可正而不是，不可邪而有余，凡事堂堂正正’。这是什么？这是销售中的成交话术。


