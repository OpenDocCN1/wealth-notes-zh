    # 到底什么才是企业稳定的基石


    21 世纪什么最重要？人才。但什么是人才？留学生？硕士，还是博士？MBA？我想，很多老板都没有真正去思考过这个问题。


    我们刚创业的时候，自己没什么资源，但就有小伙伴愿意跟着自己一起创业，一没技术，二没经验，三没钱。但依然有人不离不弃的开始了为期三年的奋斗，分文未取，自己还倒贴了很多钱。


    在这个过程中，我与很多大学生相处，很多高材生相处，他们都不能坚持奋斗，不能吃这个苦。他们是人才吗？


    创业者一定要区别出来，会一门技术的人，只是一个匠人而已，并不能升级为创业人才，或者是企业的核心。人才，是一种具备人文精神的人。很多高学历，高技术的人，并非人才。只是一个好用的工具。企业当然需要好用的工具，但企业的内核必须是受得了创业之苦的人。


    我能肯定的是，我的创业元老，就算在企业忽然一无所有的情况下，我们聚集在一起，依旧可以干一个企业起来。我只知道，我拥有一帮留学生，硕士，博士，三天不发工资，他们就得离我而去。他们肯定不是企业稳定的基石。


    对于我来说，就是创业初期的伙伴最重要。他们开疆拓土，是企业发展的推动者与见证者，把钱交给他们，


    无论多少，都不用打借条，放心得很，就算他们把金钱账算错了，我一看，也就当个笑'
