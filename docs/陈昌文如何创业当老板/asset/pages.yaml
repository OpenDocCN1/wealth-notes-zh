    诸葛亮当农夫的时候，嘴里经常讲一句话 “我自比管仲，乐毅”。 管仲是中国历史上最好的宰相之一，乐毅是中国历史上最牛逼的将军 之一。诸葛亮讲这句话就好像公司里来了个刚毕业的大学生，啥事没
    做过，却说，我有比尔盖茨的能力，有巴菲特的眼光。这是谦虚？还 是骄傲？


    普通人以为谦虚，人家就会给你机会。但在现实世界中，谦虚只 能让你把机会让给别人。一个人不能成功，就是因为他脑袋里的思维 系统有严重的问题。我以前在一个公司里做业务，本来业绩是第一，
    有一次选经理，老板问我想不想当，我就谦虚了一番，说我经验不足， 还要磨练磨练，公司里人才多得很，可以让他们当。妈的，我自己本 来是想当的！嘴上却不由自主的谦虚。而老板问另一个业绩不如我的
    家伙想不想当经理，那家伙马上说，自己当了经理会带领团队业绩 翻倍，并且自己天生就是当经理的料，当业务员屈才了。结果，那家 伙当了经理。我呢，本来是 想当经理的，就因为谦虚，少了一个机会。
    其实，我的人生当中，由于受到这些错误的观念影响，我发展速度降 低了很多。我甚至在想，有很多漂亮的妹子，就因为我谦虚，与她们 擦肩而过。我发现哪些不太谦虚的人，身边总是有很多妹子，而谦虚
    的人，妹子们连看都不想看他们一眼。'
