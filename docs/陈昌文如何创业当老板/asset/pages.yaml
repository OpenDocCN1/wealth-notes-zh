  md: '当老板必须要学会拍马屁。拍马屁学问非常深，对于我们商人来 讲，我们是无利不起早， 也就是说，拍马屁一定是对我们有，我们 才拍。而善于拍员工马屁，会让员工工作效率提高，工作时间延长，
    员工也会更加的兴奋与快乐，事情就能做得更好。


    作为一个老板，最忌讳自己在那里证明自己比下属聪明，比下属 正确。有的人有一个习惯，喜欢不断的给自己锦上添花，证明自己的 光辉形象，这样，时间长了，员工就不想问题了，
    什么事情就交给你 决定，自己不动脑筋做事了。本来你这个公司是有很多聪明的脑袋 的， 结果，由于你经常证明自己比下属聪明，大家慢慢都变成了行尸 走肉，没有思考力，你
    会很累。


    我在公司里的政策是，我基本就是定个方向，战术问题都必须大 家去思考，如果有人问我比如推广问题怎么做，我一般就是说自己不 懂，然后夸奖员工一番。说他很聪明，一定可以完美的解决这个问题。
    一般，这个员工听了就美滋滋的，就会努力的去解决这个问题。我就 是通过这种拍马屁的手法，把每个团队成员都变成某一方面的 精英。 也就是说，你想让员工想什么方向发展，你就向那个方向拍他。


    老板必须学会示弱，团队成员才会坚强，笨蛋老板是在员工面前 示强。结果团队成员只好示弱，所有的重担都落到老板一个人肩上， 事业小的时候，可行，当事业稍微大点，老板就马上遇到发展瓶颈了，
    因为你平常就没培养人才嘛。


    真正厉害的人，是永远看到别人优点的人，然后夸奖别人的优点， 被夸的人就很高兴，会不断的去注意他的优点，打磨他的优点，最后 还乐意为你所用，而且你的人际关系也会变得很好，而笨蛋呢？老是
    看到别人的缺点甚至要求别人改正缺点，这样，没有谁愿意接触 你， 看到别人优点的人，就容易形成用人所长的习惯，看到别人缺点的人， 就容易对人苛刻。感到无人可用。


    所以我建议各位老板从现在开始训练自己拍马屁的能力，每天都 试试，非常有效果。我记得惠普公司是每三个月都要专门表扬一些员 工。其效果跟拍马屁差不多。


