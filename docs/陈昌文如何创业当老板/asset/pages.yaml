  md: '商业的本质，就是战争，不讲人情，只讲业绩。凡是遵循这一条的，你就能带好你的团队。


    # 如何才能让员工心服口服


    做领导的，如何才能让员工心服口服？答案就是讲规则，企业必须建立一套非常清晰，透明对每一个人都公平的规则。


    比如我们公司，销售分等级，每个月你干到为企业创造 3 万利润为 1 级，5 万利润为 2 级，8 万利润为 3 级，10 万利润为 4 级，15 万利润为
    5 级，依次排列直到 20 级。 各级对应的底薪加提成是不一样的。你想做管理，那么必须到达


    第 5 级，也就是每个月为企业创造 15 万的利润。这是第一级别的管理，




    叫着一级管理。管理也分 2,3,4 直到 10 级管理。对应着相应的团队和利润。


    这个就像全国统一高考一样，还没有区域的别，通过了就晋升， 通不过，就是你技不如人，你也别抱怨公司领导不公平。如此，每一个员工就会感觉到命运掌握在自己手里，公司绝对不会因为谁拍马屁
    拍的好就晋升谁。如果你当老板，谁给你送好吃的，或者在你面前说 你好话，你就晋升他。谁不拍马屁，不送你礼物，你就打击他，你这 种人在古代，就 叫着昏君，昏君的下场，这里不多设，你去看历史书。


    有了规则，公司就叫法治，老板只需要找到最聪明的人一起来制 定规则，人最怕什么？最怕没有规则！不能把规则定下来，企业是没 有员工愿意死心塌地的拼命的。因为他不清楚付出了会有什么回报。


    另外，我们要晋升一个员工，还要考核他的价值观，他是否认同 公司的理念，公司的使命，业绩与价值观各占 50%，结合起来考核。同 样也要看他做业务的过程是否用了正规的手法，
    如果是通过欺骗顾客 得来的业绩，我们是要开除的，过程与结果必须都要好，所以，这几 点筛选下来，只有 20%的人能晋升，这也符合一个 20/80 法则。永远是


    20%的人晋升，永远是最优秀的人才有资格升级。但必须按照规则来， 而不是老板的个人喜好。如此，企业里的员工绝对心服口服，拼命干 活。


