  md: '+   1. 培训要针对现阶段企业发展要解决的具体问题而开展，不可为了培训而培训，这样就是浪费企业资源与大家时间，属于不务正业，明显没有效果。


    +   2. 针对解决具体问题，培训要有系统，员工不系统的学习，是不可能变得专业的。


    +   3. 用公司内部的业务骨干当培训老师，不要从外面请培训师，外面的人根本解决不了你公司的具体问题。


    +   4. 培训是要持续做的，有条件的公司，最好每周都做，别突击培训。就是说心血来潮了就整体培训两周。这种培训很多公司都采用，实际上是最没效果的，最有效的是每周培训两次，每次时间
    1 小时。


    +   5. 培训不是让公司所有的人都听一节课，而应该具体业务部门培训具体的内容。比如财务培训财务知识，人事就培训人事知识。老板就培训企业文化，价值观。


    +   6. 让公司的骨干重视培训的方法是与晋升结合起来，没有经过培训的人要补课，否则，不予晋升。公司只晋升价值观符合公司文化的人。


    +   7. 老板要舍得投入金钱来培训员工。培训其实能迅速提升公司的竞争力，老板不会亏的。


    可靠比能力更重要


    有次给人讲课，有个学员问了这样一个问题：如果刘备有一天遇到了刘伯温，觉得诸葛亮不行了，怎么样能忍心换掉诸葛亮呢？诸葛亮要是愿意做副丞相怎么办？


    其实很多老板都有这个问题，就是跟自己打江山的人感觉没有自己新招聘进来的人聪明，有能力。有想换掉老人的冲动，但又于心不忍，觉得老人跟着自己不容易。'
