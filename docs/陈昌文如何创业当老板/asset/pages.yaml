  md: '提出需要加大 100 万的广告投入，需要多招 20 个员工，或者，我们要 是能在中央电视台打广告就好了。类似这种理想化建议，提了也改变 不了什么，不具备可操作性。这种人是假积极。


    我们要重点培养的员工是，能提出意见，并能够提出具备可操作 性的解决方案的人！


    其实我们也可以引导员工变成这样的人。比如，你可以直接鼓励， 大家提意见，并提出具体可以操作的解决方案，这样多鼓励鼓励，就 会有部分员工变成这样的人，企业永远不是只有老板一个人动脑，老
    板需要把大家的脑袋都调动起来想问题，企业才能发展壮大。


    这个地方其实隐含了一条在社会上快速升官的秘密，就是如果你 是员工，你跟着一个老板，你就找出企业的问题，并且提出具体的解 决方案，给老板。假如你这样做，迅速的你就成了老板的心腹，被提
    拔，升官指日可待。


    讲回做老板，我们既然要培养员工提出问题，并且提出可操作的 解决方案，那么平常就要注意培养这样的氛围。我发现很多公司的老 板，一开会，总是自己在那里滔滔不绝，这下好了，大家都不说话了，
    不说话，直接导致员工不思考问题，最终只有老板一个人讲话了。那 企业也就快倒闭了。所以，当老板，要记得闭嘴，让员工不断的讲话， 表达，出解决方案，才是正确的思路。


    如何培养员工的干劲呢？我认为肯定不是当老板的亲自去培训员 工，这样做，员工天然有抵抗的情绪。所以我的做法是让公司里业绩 最好，赚钱最多的员工上去讲讲自己的心得。这样，其他人没有不服
    气的，


    而且也没有被洗脑的感觉，能很容易感染到大家，因为大家一看， 他这样能赚到钱，我们也能。自然就很兴奋的工作了。




    我经常与一些老板讨论，我们到底培养什么样的员工，有很多答 案，最常见的是说，要人品好，要有能力。其实，这些都不是正确答 案，我们永远只培养那些跟我们一条心的员工。我也是这样做的，如
    果你不跟我一条心，我把你培养的能力越大，那天把我直接干倒了，反而对我说我是个灾难，我为什么要培养你？'
  merge: -1
  img_proc: true
- pgno: 160
  md: '我以前做项目的时候，认识一个人，这个人最近打电话给我，想 与我聊聊商业模式，团队管理，以及互联网项目推广方面的问题。我 直接拒绝了，因为他不是跟我一条心，我培养了他，他为他自己挣钱
    而已。同样的时间，精力，我只会找我们团队里一条心的人聊一会，才是对自己的负责，对团队的负责。


    要特别重视销售部门，优秀的销售人员，是公司的生命线，我会 把大部分精力与公司的资源都向优秀的销售人员倾斜。在我们公司， 优秀的销售人员，一个月能搞几十万，年纪很小。部分做人事的，做
    财务的人员就有意见，曾经有个人事主管来找我说过这事，觉得不公平，凭什么自己做了 7 年才 5000 块一月，别人 3 年就几十万一月。我 告诉他，你要觉得不公平，你到销售部门去。他去干了两个月，又来
    找我，要求还是做回人事。说那工作实在不是人做的。


    为什 么优秀的 销售人员可以拿 到这 么高的薪水？而人事只能


    5000，答案很简单，我在 51job 上发一条招聘信息，能招聘来 10 几个 人事主管应聘，而我要发 500 条招聘优秀销售人员的广告，才有可能 招到一个优秀的营销人员。另一个就是优秀的销售人员压力是很大的，
    我们公司 对销售人员是无底薪制度，全靠提成。正因为别人顶着这么 大的压力，才有成绩，如果你不服，你就上。


    在企业内部，我是不与任何人做思想工作的。设定好标准，提成 比例，分红比例，你觉得你能行就上，不行就老实点。凡事都是以结


    果为导向，这样，真有 能力的人就会很拼，而且确实有人赚到钱了。 进而又会导致其他部门真有决心的人来找我，愿意放手一搏，这样我 周围的优秀人才就越来越多。


    # 老板必须赏罚分明


    学当老板，就学古代的开国皇帝是怎么做的，学大将军是怎 么做 的，就行了，商场如战场。


    宋太祖赵匡胤刚刚造反的时候，军队围着皇宫，要求皇宫里的守 门人开门投降，陈桥的守门人拒绝让赵匡胤进入。所以赵匡胤到了封 邸门，这个门的守门人看到赵匡胤已经造反，就做了个顺水人情，开
    了门放了赵匡胤进来。赵匡胤就当 了皇帝了，然后把这两个门的守门 人叫了过来。杀掉了帮自己开门的守门人，而赏赐官位给陈桥的守门 人。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '这就叫赏罚分明，我们做老板的，要赏的是尊重企业规则的人，对整个企业有好处的人，而不是根据自己的个人利益来行事的人。当老板，要特别注意远离这些见风使舵的小人。


    还有一件事，元朝的时候，广东有个叫何真的大将军，捉拿造反的王成。这个王成把自己的营寨修的很高很厚。何真围攻了很久也攻不进去。就悬赏1W钱，说谁捉拿了王成，赏钱1万。结果，王成的侍从就绑着王成出来了。


    何真看到王成后，笑着说，你怎么养了一个白眼狼啊！王成很惭愧。绑王成的侍从就问何真要赏钱。何真如数给他，接着派人烧了一大锅汤。王成很害怕，以为要煮了自己。结果，何真叫手下把那个侍


    从绑起来，扔进锅里煮了。然后大声宣布，如果有侍从绑主人的，就


    依这种办法处置。


    这真正做到了赏罚分明。答应了的事情，必须做。但也不能让做坏事的人有好下场。每个人必须尊重企业的规章制度。


    这就是我们老板应该做到的赏罚分明。


    # # 恶老板才能经营好企业


    中世纪欧洲对街头流浪儿童的治理方法，就是送进地狱一般的孤儿院，犯错就往死里打，这才成就了后来的文明社会。我的意思是所有的文明都是野蛮式进行的。一味地宽容与忍让，带来的只是变本加厉！包括我们的管理销售人员，如果我们对大家要求苛刻点，大家都猛出单，如果我们对大家放任自流，都不出单！管理公司也是这样，你对员工讲文明，员工就得寸进尺，后果就是公司倒闭，你必须野蛮，受不了的人就走了，剩下的就是精兵强将。


    做企业的人必须明白，企业就是盈利机构，不是谈情说爱，搞关系的地方。每个人的关系首先是同事，甚至也只能是同事。'
  merge: -1
