- pgno: 244
  md: '画的时候，头脑里就有很多现成的草稿，就手到擒来了。 古代有一位军事家，从小立志于军事，游历各国，每到一处，都


    指指点点，哪里可以安营扎寨，哪里可以设埋伏都想好了，战争年代 到来的时候，他就了然于胸。


    练本事，就是心里只有这件事，吃饭也练，睡觉也练，做梦也练。 比如张国荣，梅兰芳，为了演戏，都是时时刻刻琢磨，人戏不分，传 说张国荣跳楼就是因为演戏入迷，根本分不清是在演戏还是在生活。


    有如此精神，投入到自己的特长，良好的兴趣上面，自然能超越 大多数人，自然能过上人的生活。也能用自己的特长造福社会了。


    我们很多当老板的，创业的人，若是时时刻刻都在琢磨自己的业 务，肯定是收入飞涨了。


    理解了我今天讲的这些，大家就能理解，“创业就是生活”这句 话了。牛人的生活里只有事业，所以事业就成功了。


    # 如何说服任意一个人


    每个人的意志都是受利益驱使的，最原始的利益就是生存与繁殖。 一个人可能在某个阶段受到极大的打击。生活潦倒，精神萎靡，食欲 不振，甚至连对女人都缺乏兴趣，但这不是正常的状态。


    一个人的正常的状态，永远都是不满足的，只要后面没有生存的 威胁，他永远都想主动地获取更大的刺激。也就是说，他永远都有欲 望，不管是好的欲望还是坏的欲望，不管是保护现在拥有的东西的欲望，还是想要获得更多其它东西的欲望。


    一个人能感受到利益，就是因为他有欲望。 一个人有欲望，就会


    被人控制，被人说服。而只有死人没有欲望，所以理论上，我们可以 说服任何一个人，后面我会给出方法论。


    每个人的生活无论是有意识还是无意识地，都在受到某种利益的 驱动。即使你习惯了早九'
