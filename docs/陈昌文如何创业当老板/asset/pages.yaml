  md: '我本人做生意多年，当然也借钱给别人，有好几笔账现在也要不回来了，别人也没打算还我，当然，现在我也不缺这几个钱，索性，把他们的电话号码都删除了，以后再也不联系了，他们也不会主动联系我的，因为，他们压根就没打算还我。


