    随时关心自己的下属，同事，看谁有能力，记下来，以后就重点培养成管理人员。不想当将军的士兵不是好士兵。无能力发现优秀人才的老板是昏庸的老板。


    每天帮员工提升，每时每刻都是领导力的体现。老板不应该只关心事，关心公司的物，要培养人，真正的老板，就是天天培养人。人牛逼了，公司自然牛逼了。


    要学会做老师，大企业的大老板，本来就是一个老师，孔子、释迦牟尼，耶稣，马云，任'
