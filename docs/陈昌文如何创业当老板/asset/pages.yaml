  md: '# 孙子兵法的核心思想


    孙子兵法有四条核心思想。 第一：孙子兵法不是讲以弱胜强的，而是讲以强胜弱的。孙子兵


    法讲，有把握了再出手，不要拿国家民族的命运，去赌小概率事件， 也就是以弱胜强。创业者也应该这样，要做自己能力范围内的事情，


    做自己能搞的定的事情，慢慢的实力增加了，自己就可以去做对应实力 的事情了，这样自己的信心也会增加，企业也没什么风险。如果养成 了以弱胜强的性格，就算一时得手，也不可能每次都得手，迟早是
    要倒霉的。


    第二：凡事要计算代价，不要光想着赢，要算账，值不值得打， 杀敌一万，自损八千，赢了不 一定有多利益。输了，可能国家灭亡， 命都没了，最好做到不战而屈人之兵。这样，胜利了，他的兵，我
    们能收编过来，成为我们的兵，我们的军队就会更加强大。伟大的共产党就是这样打仗的。我们做企业的时候也应该这样对待竞争对手。


    第三：先计算自己一定会胜利，才发动战争，平时主要修炼自己， 而不是惦记着打败敌人。让自己本身很强大，成为不可战胜的一方。 让自己没有漏洞，等着敌人出漏洞，然后抓住机会就打。而不是自己
    冲上去就打，在打的过程中找胜利的机会，那就危险了。李嘉诚先生 收购别人的企业的时候，在别的企业财务状况不好的时候，李嘉诚就 出手了，平时就只管强大自己的实力。


    第四：孙子兵法不是教你打赢，而是首先教你认输。 为什么人们都喜欢听“永不服输”，因为人们不喜欢听坏消息，


