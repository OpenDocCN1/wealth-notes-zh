    # 如何选择合伙人


    创业选择合伙人，有几个要点必须注意。 创业选择合伙人，首先理应选择技能互补的人。比如，你懂营销，


    你就不要再选营销人了，可以选一个懂技术的，然后再选一个懂财务 的。只有能力互补，才会 1+1>2。合伙人之间技能互补，就会减少相互 之间的磨合，也会减少很多权利斗争。


    同理，我们要选择个性也互补的人，比如，你性格内向，不善于 交际，你就要选一个性格外向的人，善于交际的人去处理各种需要外 向性格才能处理的事情。


    创始人最注意的是要选择价值观相似的人加入。如果价值观不相 似，他能力越强破坏性会大，很难形成合力。创业者不应该跟任何人 妥协，一旦妥协了，这个公司就没有性格了，你的团队就没战斗力，
    慢慢的就成了一片散沙，各自为政，也就离死不远了。


    公司必须要求上班时间不做其他的事情，凡是上班时间聊 QQ 的，看电影的，不管是员工，还是合伙人，理应开除。


    公司才开始的时候，也不可妥协，因为人少就乱招聘，结果招聘 进来的都是不合格的，以后还要开除，纯粹是花钱给自己找麻烦。我 们争取招聘一个就合格一个，最高效率是不返工，一次做对。


