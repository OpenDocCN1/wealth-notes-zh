    社会了，成为一个工作狂就行了。这比在学校成为学习狂回报大多了。一切复杂的赚钱模式，就是没用的模式，就是赚不到钱的模式。


    我们创业人只追求最简单的模式，只要这个东西很复杂，我们就不玩， 大道至简，赚钱也是这样。赚钱是把事情变简单，不是追求复杂。比如马云搞的淘宝网，就把中小企业卖东西这件事情变得简单了，所以
    马云就赚钱。


    企业赚钱就一件事情。想尽办法提高自己的效率。就能赚大钱， 其实也是寻找商业机会的思路。也就是说，你能帮别人提高办事效 率，ok，你就等着收钱吧。


    我天天给大家吹的是赚钱，但我希望大家知道，成功的企业从来 不是以赚钱为目的得。我 个人是以成就自我为目的，给大家讲这些 经验，也是为了理顺自己的思路，顺便还有人打钱给我，我也做了一
    个 qq 的创业圈子，也就顺便赚点小钱。大家创业是以什么为终极 目的 呢？你好好想想。但是成功的企业绝对赚钱。


    不懂的价值的交换的人，永远也不懂得商业。昨天有人问我商业 的本质是什么？我认为就是价值交换。文明的发展史就是交易的发展 史，越是交易频繁的地方，就越是发达，相反，穷人一辈子就跟跟几
    个人交易过，所以贫穷。越是交易越富有，不管是思想上的交流，还 是物质上的交易，都会让你变得富有。


    我们是活在一个社会里面，是不能独立生存的。所以，我们需要 相互配合。把别人的长处，


