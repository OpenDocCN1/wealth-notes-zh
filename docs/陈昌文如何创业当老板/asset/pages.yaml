    # 在古代皇帝一个人为什么可以统治几亿人


    在很久以前，当我在电视上看到皇帝在朝堂上大声训斥那些大臣，而大臣们一个个唯唯诺诺，战战兢兢的时候，我就在想，那些大臣为什么不上去给皇帝一板砖呢，你们这么多人，皇帝却是一个人啊。有人跟我说，那是因为皇帝有侍卫，大臣们还没动手就被侍卫抓起来砍头了。那我又问到，那侍卫为什么要听皇帝的话啊。有人又跟我说道，皇帝有军队，谁敢不服。我又问到，那军队成千上百的人，为什么要听皇帝一个人的。这人想了想，跟我说道，那是因为跟着皇帝有肉吃，有钱发。我又问到，那他们这么多人干嘛不抢啊，把皇帝的肉抢了分不就行了。那人不说话了。


    其实这里面隐藏着当老板，当领袖，当老大的核心秘密，谁能领悟呢？


    在最初的原始社会，每个个体都是独立的，没有谁统治谁的问题。甲身材强壮，性情残辣，就可以肆无忌惮的抢夺别人的食物，威胁他人的安全。但是他仍旧没有统治其它人的想法。和甲相比，乙身体弱小，平时获取猎物很困难，还要随时应对同伴的抢夺。和乙有同等情况的，还有丙和丁。面对残酷的自然环境，还有凶恶的同伴，同病相怜的乙、丙、丁为了生存，结成了联盟。狩猎，我们三个人合作，抢夺别人的猎物，我们也是三位一体。乙丙丁三人虽然身体弱小，但是兄弟齐心，合体无敌。强壮而又凶狠的甲，也不是他们三个人合起来的对手了。甲平日里习惯了仗势欺人，为了恢复往昔局面，对乙丙丁三人说道，我要加入你们，有好处跟我一起分，有强敌我帮你们打。你们要是不答应，我就跟别人合伙，干掉你们。乙丙丁权衡下，答应让甲加入。于是三人变四人，战斗力再度加强，他们也不去狩猎了，




    专职抢夺别人打回来的食物，在抢夺食物的同时，他们还严防别人像他们一样结党，一旦看到其它人有团结的苗头，就坚决打压。渐渐地，当地所有的人都开始受他们的胁迫，四人团体开始领导和统治整个人群，部落形成了，四人团体成了部落的长老，确立了领导地位。随着部落人口增多，各种矛盾也随之增多，各种业务也随之增多。长老们为了解决


