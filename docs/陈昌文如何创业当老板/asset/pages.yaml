    # 老板与员工都要用自己的产品


    赚钱这件事情，其实只跟人的精神状态有关系，要赚钱，就要改变自己的精神状态。


    先讲一个创业理论，很多人都说他要创业，可是他一直都说在等等。


    我们做任何事情，都不是等准备好了再开始干的，是直接开始干，干事情的时候干错了，出现了负面信息，这都不用怕，一开始就直接




    开干，出现了负面信息，出现了错误，我们才好查找原因，我们才好改正。这样练习一两年，自然功夫就到了位了，钱也就赚到了。其实一般人创业，前三年都挣不到多少钱，而是在摸索的过程中，在试错的过程中，在总结经验的过程中。而那些想准备好了，再开始干的人，由于不是在市场上经过摸爬滚打，检验过自己的实力，反而容易一干就出大问题，整个大错误，最后灰心丧气，惨败而归。所有的筹码都输光了，就得了创业恐惧症。


    人活不了多少天的，干什么都不要等，一等几年就过去了，年纪大了，人就更老了。人一老，胆子就更小。


    我们创业初期，只交那些愿意跟自己流血流汗的朋友，少交那些酒肉朋友。陪你喝酒的人很多，能陪你流血流汗的人很少。出来创业，都是将心比心，当然陪你走到最后的兄弟，你也不能亏待别人。


    我们做低端客户的时候，总会遇到些很不顺心的事情，甚至多人故意找麻烦，来捣乱。但其实我建议开始创业的人，都尝试一下做低端顾客，这样，能培养你的耐心，你也能更多的了解人性，等以后做大了，这些宝贵的经验都会为你带来极大的好处。


