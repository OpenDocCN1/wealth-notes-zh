- pgno: 250
  md: '咧的，不愿意尝试，瞧不起那些创业没成功的人，喜欢嘲笑别人无能。我当初创业的时候，捣了好几 个项目，不是很成功，连跟着我一起的工 都始嘲笑我了，其实我
    心里知道这样的人 很无能，而且我知道我一定会赚到钱，我没有点破而已。我也没有必 要从信仰层面去跟这些人沟通。30 年前别人说下海能赚钱，穷人说别 人是骗子；20
    年前别人说炒股能赚钱，穷人又说别人是骗子；10 年前 马云说互联网能改变人们的生活，穷人有说他是骗子；现在说别人是 骗子的人生活质量一天比一天差，成为别人成功的见证者，而那些所
    谓的骗子成了时代的标志。其实不管别人骗不骗你，你去尝试了就有 收获，就算这个地方没赚到钱，但是干着干着就会发现其他的机 会。


    富人做事，是不需要别人理解的，只要他自己认为可以干，他就 开始干了。


    在现实生活中，您和谁在一起很重要，甚至能改变您的成长轨迹， 我的成长轨迹就是因为 我看了某位牛人写的一篇销售文章而已，从此 走上了销售之路，在销售的过程中，看到我
