  md: '我们做什么产品，要完全清楚能卖得出去，市场需要才做。也就 是不生产废品，只生产已经卖出去的东西；


    公司经营不是做到行业标准就完了，“标准” 不是 “理想状态”， 是改善的起点；


    我对营销的研究，就是 4P 理论。 只关注产品、价格、渠道、推广。这个社会不断有人提出 4P 理论


    过时了，而我认为 4P 是 “唯一正确的营销理论”。我研究任何商业理 论，只研究教科书，也就是那些再版了很多次的书籍。我不喜欢那些 流行书籍，那些流行的畅销书很多都是极端片面的，只是抓到了教科
    书里面的半耳理论，就大写特写，写得厚厚几百页，让很多新手把这 种畅销书完全看成是救命稻草，看成是唯一的圣经，实际上害人 不浅。




    所有企业都是制造业，都在制造一个东西。所有企业都是咨询业， 都是了解了顾客的问题后，按照问题出方案，做产品才能赚钱。


    对于经营企业来说：技术可以学，可以买，专利会到期，创意能 拷贝，但管理是学不走的，是真正终级的核心竞争力，老板最最应该 锤炼的是自己的管理能力，而不是学技术，做业务，搞策划与创意。
    企业的竞争，实际上就是管理的竞争。


    企业管理层要关注的有三点：是否实现了目标、是否改善了实现 目标的流程机制、是否培养了人。


    我从来不喜欢标新立异，也不太喜欢创新，我都是做大路货产品 与服务，只有大路货，才能上大路 上跑！


    伟大的创意人，就是能克制自己创意冲动的人，聚焦于解决具体 问题，其他一概不考虑。不能为了显摆自己聪明，而主次颠倒。


    这基本就是我经营企业的主要理念。


