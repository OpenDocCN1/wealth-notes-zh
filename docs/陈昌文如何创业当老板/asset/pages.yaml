  md: '# 如何给员工洗脑


    没被洗脑的员工不是好员工，用起来非常不顺手。假如我们把员工看成一台机器，比如就是一台电脑吧。洗脑就相当于给员工装一个系统。这个系统分为win7,win8,苹果系统。而员工的身体就是硬件配置。根据不同的配置装不同的系统。我们要控制员工，就要控制员工脑子里面的程序。


    洗脑第一步，我们需要考虑员工的硬件配置。这个员工受到过什么教育，性格内向还是外向，有什么爱好。比如这个员工的配置很低，小学只读到二年级，那么我们洗脑的目的，就不是让他让做好管理层了。可能就是让他做个保安，告诉他要爱岗敬业，做保安是伟大的，好好做。而一个程序员，你就得洗脑他，让他从早上到晚上都高强度的设计程序。回家也设计工程程序，告诉他，这样可以成为乔布斯那样的男人。千万不可告诉小学二年级学历的同学学习乔布斯，这就属于不考虑员工硬件，乱洗脑。


    洗脑第二步：给你的员工安装杀毒软件。啥意思呢？就是不利于我们老板赚钱的思想和想法。我们就否定他，告诉员工这样干是极其错误的。比如“偷公司的东西”，你可以设计一个制度写出来。偷东西，是一个错误，这样的想法出现了，就要当病毒一样的杀掉。有人干了，那么我们就要开除他。杀毒软件就是一个公司的规章制度，企业文化。


    洗脑第三步：给员工装上防火墙。我们当老板的，要仔细观察这个社会，外来的思想，对我们工作


    有利的，我们就鼓吹好，对我们没有好处的思想，我们直接不让员工接触，或者否定这些思想。比如员工想去创业，你得告诉他创业是很困难的，然后举出很多例子，并且告诉他打工可以很有前途，再给他


    举些例子。


    比如你的企业是干苦力活的，你就带员工去看古惑仔，打打杀杀的电视剧，电影。别给他们看有思维启发性 的东西，怎么做生意的东西。你把他们思维启发好了，他们就不干活了。要占用他们的业余时间，不让他们想问题，就告诉他们靠苦力吃饭光荣。


    洗脑第四步，羊群效应。制造一个大家都这么干，你不这么干就是错误的制度。羊群效应，也叫统一价值观。还有个学术术语叫“螃蟹效应”，就是说一只螃蟹在桶里，他就很可能爬'
  merge: -1
