    # 打造创业团队需要注意的 5 点


    创业是一个技术活，也是个艺术活，一定比上班难多了。打造创 业团队当然比一个成熟的公司招聘几个人做一个项目难多了。以下是 我打造创业团队的几点经验，希望对大家有帮助。


    +   1. 你的团队必须是运营合伙人。什么叫运营合伙人？就是这几个人必 须是投入心血，投入精力的人。什么都必须干，没有借口，没日没夜 为公司考虑的人，才能称为运营合伙人。


    我以前有一个朋友创业，有一个人投资了他 50 万，他当时也没什么 钱，就给了那个人 40%的股份，然后自己招人，拓展业务，没日没夜 的干了一年，没赚到什么钱，但是呢，他也不算厉害，第二年坚持了下
    来，直到第三年，公司开始盈利了，而且大赚几百万。按照这个趋势， 第四年，第五年，明显会上下千万。可是问题来了，他给一个人了 40%的股份，而这个个人除了给他
    50 万根本没进来过他的公司，也没有付出 任何心血，现在就要每年分这个人几百万。他心里面就很闷，于是 另外又开了一个公司，打算把业务都弄到新公司，老公司就不做了。
    那个没为公司花心血的人知道了这个事，直接就把他告上法庭了，弄 得大家都很难看。


