  md: '人和动物的区别就是人有文化，动物没文化，凡是文化程度低的 人几乎很难准的比文化程度高的人好。当然有个别例外，但我从来不 喜欢读例外。


    一个国家的文化强过另一个国家，一般，这个国家就发展得比较好，一个企业的文化强过另一个同行企业，当然，这个企业就容易发展好。


    我们国家从董仲舒 向汉武帝提出过所谓“罢黜百家，独尊儒术”这一建议开始，就以儒家思想统治老百姓，以法家思想为内核。




    所以，我就直接借鉴了这个模式，直接给企业员工上儒家思想，儒家思想我又把他分为三个体系，第一个，论语，第二个，春秋，第三个易经。论语对付初级员工，春秋对付中层管理者，易经对付高层管理者。


    我们的企业口号是，天行健君子以自强不息，地势坤，君子以厚德载物。为了怕有的人听不懂，我就告诉大家，自强不息的意思就是 天天使劲的干活，别休息。所以我们企业没有周末与节假日，也没有下班时间，就是吃饭睡觉工作。厚德载物我给大家的解释就是，别抱怨，就是要求大家不断的干活，也不可以抱怨。


    每个人天天早上就能看到我读论语，然后企业里的其他人，看到 我读论语了，慢慢就有这个意识了，自己也想读，一般跟我接触一个月过后，我就会叫他去买一本注音版的论语来读。为什么不买给他，不一开始就像很多企业一样强行灌输给员工企业文化呢？因为我知道，一般的人，你灌输给他，他要反抗的。反倒是不读了，说你洗脑。只有通过潜移默化，让他自己迈出第一步，然后他就会不知不觉的上瘾。所以，连买书都是让他们自己出钱去买。企业文化的建设，必须是人主动参与得一个过程。


    何况，这东西能和孔圣人联系在一起，非常有权威感，大家天天读就认为自己在学东西。


    而且任何一个人来我们企业，都会感觉到有学不完的东西，因为 论语，春秋，易经博大精深，他们一辈子也学不完，搞不透彻，学这个东西，学了就立马可以用到同事与客户身上，比如论语讲得就是人与人相处的事情。春秋讲一个文字，让大家判断什么事情该做，什么事情不该做。


    易经，让大家做事学会了变通，况且，这一套文化，把大家的心'
