    # 收入高低的根本原因!


    如果不干活就有饭吃，就不会有人干活，人性如此。 社会上的有些工作，属于指挥者和组织者，例如各级官员和老板，


    本质都是在组织社会生产活动，是组织社会生产的指挥员，所以他们 收入高。但要从事这种高收入的工作，需要有经过专业训练的头脑和 经验。普通人没有受过专业训练，所以干不了这种高收入的工作。


    社会上的高层职务，都是需要进行专业训练的，一般人缺乏恒心 和毅力，懒惰，所以做不了高层职务。


    收入低的工作不需要什么专业训练，你什么都不懂，也可以干收 入低的工作，因为不需要学习和训练，所以门槛低。门槛低导致大部 分人都有资格进入干这种工作，工作少，能进入门槛的人又多，就导
    致低收入。


    高收入的工作需要较高的智力和较多的经验；低收入的工作需要 的智力和经验相对较低、较少。


    所以要想从事高收入的工作，就必须提前进行学习和训练，积累 丰富的经验知识，提高智力水平。


    什么是智力？其实运用经验和知识以达到目标的效率，就是智力。 做成一件事，消耗的成本越小，智力越高，消耗的成本越大，智力越 低。'
