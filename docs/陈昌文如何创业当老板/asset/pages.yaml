    # 企业到底留下什么人？


    我们以前有一个业务部门，一个业务经理管理 10 个业务员。其中有两个业务员业务做得最好，但是这两个做得最好的业务员跟大家的关系不太好。


    关系不好的原因是在其他同事看来，这两个人不合群，老是抢他们的生意，造成了他们的业绩不好。


    但是在这两个业务做得好的人看来，是因为别人不像他们那么努力才导致业绩不好的，业绩不好的业务员嫉妒他们。


    主管业务的经理就建议，把这两个不合群但业绩好的人开除，以便重新建立部门的内部和谐。


    这种情况，其实在很多公司都有出现，正确的处理方法一定不是开除这两个业绩好的人，而是要留下他们并且重用，敲打那些业绩不好的人。'
