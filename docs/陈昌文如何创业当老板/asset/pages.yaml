  md: '这样的 话，我们就不能说 “因为生理需求被满足，人们才追求更 高级的欲望，有点见识的人应该都知道，很多贫穷的人开始追求成佛， 修道，信耶稣。按理论说，这是高级需求”，这种
    高级需求，恰恰是因 为，基本欲望永不满足，才诞生出高级需求的。所以从深层次上讲，这些求佛， 修道，信耶稣的人，还是想满足基本需求，就是生存与交 配。


