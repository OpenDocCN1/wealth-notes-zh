  md: '这应该是我们每个年轻人感到庆幸的事情，因为我们很多创业者，并不具备土地，资金，机械，工厂。但是，我们可以学习知识，并且 把知识注入到一个不值钱的东西里面，让他变得值钱。


    而且，知识有个特性，就是你会越用越多，越用越值钱。不像一 块地皮，盖一栋幼儿园，没办法再盖住宅楼了，因为地皮是有限的。


