    # 当老板要习惯送礼领悟送礼的艺术


    送礼是一种习惯，当老板要习惯性送礼。只要我去任何一个朋友，还是同行，还是陌生人家里玩，或者到别人公司玩，我都会送礼，淘宝上买些小玩具，字画，古玩，洋娃娃，很便宜。准备了一大堆，只要出去就根据对方特征，都会带上一份礼物。


    比如，别人叫我出去喝酒，如果这个人对我有用，我就会答应他，出去喝酒，顺便问问有几个人，几男几女，然后我就会准备好几个礼物，带过去。大家拿到我的礼物了，酒桌上自然都会敬我酒。我会自然而然成为焦点。




    而且我跟大家的关系会变得越来越好，不管是员工，还是朋友家的家人。


    送礼能让人记住你，这样很多事情就变得很好办了。中国是个关系型社会，经营好关系，沟通起来就很有效率，障碍就少一些。送礼要轻描淡写的送，不可把你送这个礼表现看得很贵重的样子，这样，别人就有心理压力，有了心理压力，别人就不愿意接受，甚至不愿意跟你玩了。


    比如前年有个刚大学毕业的小女生想跟我做网络。她送了个不到200块钱的礼物，然后不停的说，我生活很困难，没啥钱了。花了一个月工资给你送了一个礼物，你教教我怎么在网上赚3W块一个月，我赚到钱再来再送你好东西。我一听就头大，只想赶紧把礼物还她或者拿钱买下来，心理就想：“你赶快拿走！”，嘴上就说：“我也做不到，你还是找个工作做吧，别东西思想的了！”这样的人，我都不想见到第二次。为什么？因为她给人的心'
