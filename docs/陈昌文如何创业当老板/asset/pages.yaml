    # 创业的三个方向


    现在有三个主流的创业方向。 第一：解决已有的需求，这是大多数普通人能够看到的，也是


    最简单的创业。比如，发现妇女希望在做饭和清洁上少花费一些时间，就导致了现代的洗衣机，烘干机，洗碗机，活微波炉的诞生。有人需 要英语培训，你就去创办一个英语培训机构。有人需要吃饭，你就去
    开个饭馆，炒菜做饭，这就属于直接进入红海拼杀。大多数的创业都


    这样，满足一个已有的需求，这些创业呢？拼体力多些，竞争激烈， 也会很累，利润微薄。


    第二：发现悄然兴起的或者是潜在需求，这是需要有点心思的人 才能发现的。比如刚刚兴起的支付宝群，就有人建群收费敛财。这两 年比较火微博，微信自媒体创业，都有很多人成功了。再比如，我国
    改革开放造成许多地方的水质发生恶化，哇哈哈，乐百氏等公司遇见 到了一个正在兴起的瓶装水市场，这种创业呢，比第一种风险更大， 最怕的是早入场，成了炮灰，或者是错误的认为会形成这样
    一个市场， 而根本没形成，浪费了为数不多的创业资金与时间。 当然做成了， 利润也比解决已有需求这种创业高。


    第三：就是推出一项谁也没见过，甚至连想都没想过的产品或者 服务，比如，20 世纪 50 年代，不会有人提出要做一个随身听。但是索 尼公司却把他造出来了。1952
    年，索尼公司决定制造一种"迷你"收音 机，当时，收音机都是用真空管做的，世界上还没有哪家公司成功地 把晶管技术应用于收音机这种消费品。当索尼公司把这个想吃螃蟹
    的计划告诉一位外'
