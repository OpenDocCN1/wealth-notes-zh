  md: '记了里面写的什么，唯一记得很深刻是，说我们毛主席在外面读书，很长时间没有回家了，有一次，毛主席回家见到了他小时候关系特别好的一个发小，这个发小见到毛主席，就和毛主席闲聊天。发小说：“猪肉又涨价了，粮食又涨价了，布匹也涨价了。生活成本太高，过下去很艰难！”总之，就是类似的东西。带着悲伤和无奈。这以后，毛主席就再也不与这个发小交往了。


    我在这个故事里面，得到了很深刻的启发，毛主席从小就是一个大格局的人，我有一本毛泽东诗词。青年毛泽东写的诗词已经反映出毛主席的格局了。


