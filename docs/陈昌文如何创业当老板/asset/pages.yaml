  md: '第三点：招聘人，选人一定是择优录取。牛逼的企业，就是天天都在招聘。多找备选的人，大家要注明的


    是：优秀的人才是因为他本身很优秀，优秀的人并不是你培养出来的。




    我刚开始创业的时候，不懂这个道理，以为是人是可以培养出来的。不错，十年树木，百年树人，人确实可以培养，但要100年，我们都等不起。我刚开始创业时候，有一个成员，自己打工都找不到什么工作，混得很差。但是呢，他有一颗创业的心，当时我没几个人，就把他吸收了过来。结果，这个垃圾，我又是供他吃，又是供他住，他还不努力工作，经常表现得不开心，埋怨我没本事，不能快速的给他赚到钱，到处在团队成员里面说我的坏话。后来我忍无可忍，就叫他滚蛋了，滚蛋的时候，还欠了我一笔钱，也不还了。后来我见得人了，我就懂了，原来人和人是有区别的。努力的人，在那里都很努力，差的人不管是打工，还是创业，都是差的人。优秀的人，到哪里都会想办法成为佼佼者。优秀是一种习惯。这样的人会自己想办法解决问题，并且努力把工作做好，赚到钱。所以，我的理念就是，多招聘，择优录取。


    当然；第三点里面就延伸出来第四点了。第四点：就是不要企图培养人，如果他不仃，培养也没用，白白


    浪费精力和时间。如果他优秀，他就会一直保持优秀的习惯。你不用培养，他依然会出类拔萃。


    历史上有很多带团队非常牛逼的人物，我们看看他们是怎么带团队的。


    第一位，清王朝的建立者：努尔哈赤，大家可以在百度里搜这个人，看他的百科，然后找到他的为政举措，其实也是他带团队，开发市场的三个牛逼的方针：


    一：抗拒者杀，俘获者为奴。据城死守，“得后皆杀之”。什么意思呢？就是带团队，不听话的，坚决制造麻烦的人，开除，罚款，不给好脸色。




    二：投降者编户，分别编在各个牛录内，不贬为奴，不夺其财物。原来是当官的也给当官。原来有奴隶田产的，你就继续拥有你的奴隶田产。什么意思呢？就是说，听话的人，我就不找你麻烦，该给你的都会给你，不亏待你。'
  merge: -1
  img_proc: true
- pgno: 156
  md: '三：来归者奖。对于主动远道来归之人，努尔哈赤特别从厚奖赐。当他听说东海虎尔哈部纳喀达部酋长率领一百户女真来投时，专遣二百人迎接，“设大宴”，厚赐财物，对其他随从人员，也“厚赐财物”。这样就让主动归顺他的人越来越多。


    我们带团队呢，也应该这样，就是主动帮他们做事，解决问题的人，当然要给予奖励，在允许范围内给予厚奖，这样，努力干活的人就会越来越多。


    第二位带团队牛逼的人，当属秦始皇。秦始皇有一个制度，二十爵位制。就是他自己这个国家，有20个等级，


    从低到高，全靠杀敌才能升级。比如，你是一个小兵，但是你杀了一个军官，那么你把那个军官


    的脑袋砍下来，带回来。就给你升一级官。并且给你一百亩地。给你一个房子和仆人。


    这是什么意思？其实就是绩效考核，就是激励制度，有业绩，就有奖赏。


    这样，士兵看到敌人的军官，就像看到了升官的文书，看到了一百亩地，看到了一个房子和仆人，他们只想赶快把这个军官的脑袋砍下来了。


    所以，这个战争一开始，秦军就如狼似虎，杀了一个人，赶快把个头砍下来绑在腰间，继续砍头。敌人见到这样的军队，就不敢打了。最后就赶快投降了事。




    并且秦始皇还取消了贵族世袭制，大家只讲杀了多少人，就可以得到什么奖励，至于你爸爸是干什么的，跟你没关系。我们带团队也应该这样，大家只讲业绩，不问你以前是干什么的，也就是说你为企业赚到钱，你就能获得优厚的提成，否则什么也没有。


    这个制度，就是有功就赏，只讲业绩。秦始皇还有一个制度。就是士兵五个人一班，如果出去打仗，


    这个班里死了一个人，那么大家都要受到严厉的惩罚。如果不想受到惩罚，那么你需要将功补过。就是你们也要杀别人一个人。


    这个制度，实际上强调了团队协作，就是避免了大家只顾自己升官，而降低团队的竞争力的一个制度。大家一合作，结果，业绩更高。


    我建议大家多读历史。实际上，我们很多问题，历史上都已经有了完美的解决方案。'
