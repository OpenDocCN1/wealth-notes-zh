  md: '给理顺了，大家沟通，工作，没有什么好抱怨的，我真是感谢孔夫子， 他这套文化能治理国家，治理个企业还是绰绰有余的。


    文化建设好了，我们不能仅仅搞文化建设，大家都跑到我们企业 里来学儒家思想，没人赚钱，那还不都得饿死？


