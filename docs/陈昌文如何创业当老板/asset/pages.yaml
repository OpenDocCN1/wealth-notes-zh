    创业商学院 为创业者服务 137


    为什么要回答问题？因为证明一道题需要用很强的逻辑。用进退，我经常证明一个东西给别人看，自然逻辑思维就就好了


    快速给自己定位，到底要做领导者，还是管理者


    我们很多人创业没什么经验，以为领导者与管理者都是一样的， 反正就是什么事情来了，就做什么事情，而不是根据自己的特长来发 挥自己的优势。


    每个人都有自己的能力，性格的侧重点，很少有人既是领导者， 又是管理者。因为， 领导者与管理者修炼的功夫是相互排斥的。


    领导者，最重要的本事是，看行业趋势，社会大环境， 练的是把 复杂问题简单化的能力。 属于把控方向，定战略的人才。


    而管理者呢，是需要把简单问题复杂化的能力，把战略，方向， 落到实处的能力，把控公司的细节，产品的细节的能力。


    领导能力，要在很多事情里挑出重点，分析清楚，哪些事情可 以干，哪些事情不可以干，哪些事情要等才能干。要有透过现象看 本质的能力。


    而管理者呢？就需要把一个大问题，拆分成很多小问题，把大方 向分散成小细节，然后自己带队，去把这些事情做出来的能力。


    所以，管理者实际上是天天跟鸡毛蒜皮的事情打交道，是企业的 具体运营者。


