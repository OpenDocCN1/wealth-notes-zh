- pgno: 249
  md: '牛逼的老板一直在研究落地，也就是说动，笨老板，一直在研究理论，也就是说清楚与说服；其实，你听懂我这几句话，你就明白，泡妞也是这样哦。泡妞必须落地。这个话题，我就不在公开场合展开了。


    最后，总结一句，老板的精力聚焦于什么地方，就收获什么！希望老板们都聚焦于说动这个概念。


    # 想的不一样，决定了不一样的人生


    打工的圈子，谈论的是闲事，电视剧，别人的家长里短，赚的是工资，永远在为多几百，少几百而奋斗，想的午餐吃什么，晚上吃什么。我是从什么时候改变的？我是从不为几百块浪费脑细胞的时候，我是从想赚几个亿的时候，改变的，当我有这个思想的时候，老板求我留下给他干，我也不给他干了。我直接对老板讲，我要走了，打工太浪费时间。


    生意人的圈子，谈论的是项目，谈论的是招聘用工，谈论的是怎么挖掘人才，如何把项目做好，把营销做好，把广告做好，如何让员工马不停蹄的干活，想尽办法赚取暴利。想的是下一个月增长率是多少。连美女想的都比较多。就是想钱。


    做事业的圈子，读的是梦想，理想，谈论的是机会，赚的是财富，精神财富与物质财富都比较重视，想到的是自己未来要成为一个什么




    样的人和自己的父母，亲人，孩子的后顾之忧都解决了吗？智慧的圈子，读的是书，研究的是哲学，谈论的是宗教，社会阶


    层，社会结构，经济趋势，搞清楚自己到底该干什么。喜欢给予这个世界，不管是分享自己的心得体会，还是奉献自己的精神，智慧，这个层次的人都很乐意。他们发挥着上天赋予自己的天赋，贡献着自己的才学。遵循而行，一切将会自然富足！这个层次的人，达到了老子讲的，既以与人，己愈多。不知不觉就富家天下。


    人的穷富，就是思想，观念导致的。富人用眼光把握商机，找都要找个赚钱的机会，找不到自己制造


    一个赚钱的机会。穷人看到机会都不珍惜，都要等待，并且怀疑。并且还要对机会骂骂咧'
