- pgno: 247
  md: '复杂难办的事，变成很多步骤，其实都很简单。


    老板就是干，分析，判断，选择，决策。具体事务能不做的一律推给员工去做。废话，我都细分到了该用消毒餐具了，具体该上哪去弄你都不知道，好意思拿工资吗？


    不是应该这样做，而是必须这样做。当老板，必须把控方向，做分析，判断，选择，决策的事情，而具体的事情，一律交给员工干。


    举例：高考，两个小时，本来你能考 90 分。现在只给你 20 分钟，请问你能考几分？我想你能考 30 分就是天才了。本来作为一个老板（不分大小），如果你每天用八个小时来思考该做什么，做判断做决策，你至少能得个及格的分数。现在你拿六个小时做厨师，外加两小时打卡，挤出一个小时思考，不仅仅你比人家累，你肯定及格不了。因为，你没有干老板该干的事情，所以，你这个生意就没有老板，只有员工，那么你一定是要失败的。


    具体一点，一个朋友在街坊烤羊肉（随便烤什么吧，鱼也行，茄子也行），他要是雇员工来烤，自己在一边看着，然后思考，总结，调整。这生意就容易做大做强；反之，他要是自己去烤，这生意还能赚几个，就算了不起。


    最后得到一个纠结的问题是，难道我们这生意不管多大，一开始就要招聘员工吗？


    对，我想我已经分析的很透彻了，再小的生意，如果连员工工资都赚不到，你还做什么呢？而且，主要是，你不招聘员工，你就一直是员工。不会有老板思维，当然也就没发展前途了。


    老板思维是从你有员工的那一刻开始的。


    说清楚，说服，说动


    说清楚，说服，说动，老板应该把精力聚焦在那两个字上面？每个老板都应该一句话能说清楚自己做的什么业务，说不清楚，这'
