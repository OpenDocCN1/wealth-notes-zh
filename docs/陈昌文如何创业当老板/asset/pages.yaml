- pgno: 164
  md: '司的事情当儿戏，你就得让他尝苦厉害。


    下次他就老实了，他再不老实，你就开除他。选更加优秀的人上。只有这样，才能培养人的责任心。世界五百强绝对不玩儿戏，你


    胆敢犯错，要你肉疼。我以前经常讲一个故事。有一个女人被一个邻居的男人强奸了。


    这个女人本来要报警的，但是这个男人的老婆和这个男人就不停的道 歉。说不要报警，我们有老，下有 小，你要是报警了，我们一家人 怎么过啊。我们一家人给你做牛做马都可以。


    这个女人心一软，就接受了道歉。开始的时候，这男人的老婆和 这个男人对这个被强奸而不报警的女 人感恩戴德。过了 半年，事情急 转直下，变成了，这个被强奸的女
    人勾引他老公了。而且施害者还到处宣传这个被强奸的女 人是婊 子。


    这个被强奸的女 人受不了这个冤枉与委 屈，但是报警已经过了取 证时间，只得默默承受迫害。最后卖房撤离了 这个小区。


    我们如果经常接受别人的道歉，后果就是自己的生存空间越来越 小，自己的利益受到侵害，把自己辛辛苦苦建立起来的资源免费送 给他人，而且是赠送给不尊重自己的人。


    所以：不要接受道歉，要逼迫对方解决问题，承担错误造成的损 失。


    # 保护与培养团队里唱反调的人


    我有一朋友刚一开始创业，就跑过来，跟我说“多年媳妇熬成婆


    了，老子再也不用看谁的脸色唯唯诺诺的 工作了。我想怎么干就怎么 干，大家都得听我的！”我当时就甩了他一句，保护你团队里面跟你 唱反调的人。结果他可能刚当老板，非常兴奋，没当回事，这做老板
    的尊严仅仅持续了半年，就又去给人打工了。


    当然唱反调的目的是为了公司的业务，这是前提，是战略层面的 事情。但是在战术层面，'
  merge: -1
  img_proc: true
- pgno: 165
  md: '设计到业务具体怎么开展等，有人出来唱反 调是好事。


    因为你作为公司的创始人，就算你再聪明，也是不可能完全了解 项目，完全了解市场的。他在一线操作，如果你没在一线操作，你就 很难了解具体情况，自己做决定需要一线操作的人的意见，也要慎
    重听取反对意见。是人都会有盲点。而这些唱反调的人会帮你进一步 分析出来你忽略的地方。


    由于中国文化的影响，我们中国人总是好面子，而且非常含蓄。 很多事情，你需要问几次，对方才能告诉你真正的原因，加上你是上 级，非常多的人就唯唯诺诺的，即是有意见，也习惯性的保留。这对
    创业是非常不利的。


    国外的学者曾经做个一个实验，让一个人进入有五个托的团队。 六个人一起丈量一根短一点的绳子，一根稍微长一点的绳子，然后这 五个托就说短的那根实际上长一点，结果受实验的人四分之三的人都
    接受了这个错误的答案，而只有四分之一的人坚持真理，反对这 5个


    托。可见真正唱反调的人是多么的宝贵。 中国自古就有兼听则明，偏听者暗的说法。历史上很多昏君就是


    拒绝他的臣子们唱反调，导致大好江山被推翻的悲剧。而那些明君， 甚至非常喜欢听到反对的意见。并且，这些老提反对意见的人，是公 司里的积极思考者，他们在想问题所以才有反对意见提。能提反对意




    见证明对公司的事情非常用心。真正在商场上拼杀的话，需要的就是 这样的人，这也是领袖才能的表现，你甚至可以培养这样的人来做领 导者，而大部分不提反对意见的人都是跟随者。


    我们做生意，追求的是市场的客观，真相，事实，这种喜欢提反 对意见的人，就是帮我们进一步分析出市场真相，事实的人，真是可 遇不可求。


    所以我希望广大老板有保护与培养团队里唱反调的人的习惯，只 要他说得对，说得有理，是为公司整体业务考虑的，就值得表扬，值 得提拔。千万不要为了自己的面子，权威感，排斥唱反调的人。


    # 如何提升 企业员工的执行力'
