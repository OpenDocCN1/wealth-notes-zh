  md: '制造反作用力。要驾驭员工，首先要搞清楚，一个员工为什么要跟你混。第一，为了钱。第二，为了梦想，第三，为升官的。第四，为了混


    日子的。第四种人没有资格让我们给他洗脑，我们也不想驾驭这样的员工，直接让他滚。


    驾驭员工的核心秘诀就是员工要啥你给啥。不过呢，要达到一定的条件才能够拿到员工想要的东西。


    比如，员工要钱，你就给钱，你要告诉他要做些什么事情，做到什么程度，就可以拿到你想要的钱了。比如完成什么任务，可以拿到30%的提成，完成多少可以拿到50%，完成多少可以拿到70%。实际上很多传销，直销公司都是这个套路，我们只学习精华为我所用，不要去排斥着些好的驾驭员工的方法。


    驾驭员工的两大绝招，就是画饼加拖延。为了梦想的员工，你要告诉他，第一年学些技术，先把基础学好


    了，第二年让他学管理，第三年，让他开始带团队，然后第四年在做个什么事情，这样往后面拖，能拖几年是几年，然后告诉他这样就能够实现梦想了。其实这一招，很多大中型企业都用得炉火纯青。


    为了升官的员工，先给他说，做储备干部，储备干部做得好，两年后就为副主管。其实这一招，很多国营企业都在用。这些企业都是驾驭员工的行家手里。大家也可以找来这些企业的规章制度，好好研究研究，对我们驾驭员工有很好的借鉴之处。


