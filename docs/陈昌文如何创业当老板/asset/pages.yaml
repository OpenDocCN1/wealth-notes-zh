    # 第一章


    # 什么决定了你的命运


    > 到底是什么决定命运?


    李斯在做秦国的国相以前,在楚国上蔡那里做看守粮仓的小文书,这是一个吃不饱,但饿不死的职位。他最大的爱好就是在上岗时间溜号,牵着自家养的一条黄色的土狗,带着自己年幼的儿子,出上蔡东门,到野外追逐野兔。


    李斯有一个幸福美满的家庭,房子不大,但已足够居住, 薪俸不高, 但尚算衣食无忧。


    然而,一件偶然而有趣的事情发生了。有一天,李斯同学忽然内急, 他捧着肚子, 弯腰夹腿,直奔厕所而去。厕所里的几只老鼠正不无哀怨地吃着粪便,见有人来,吓得惊慌逃窜。李斯同学无暇多想,先畅快淋漓地解决了内急问题。


    李斯在边系裤带往回走时,就悲叹起厕所中那几只惊恐的老鼠来,它们不过就是想吃点根本没有人要的东西罢了,可是就是这么一个小小的需求,对它们来说都显得那么艰难,只要有人来它们就吓得四处逃窜,哪怕是来一只狗,也要让它们心慌好久,运气不好的,还会掉到粪池里丧命。




    刚好李斯是管理粮仓的。他想到,粮仓里的那些老鼠,吃的都是上好的米麦,住在大大的粮仓里面,人来了也不怕,随便往粮仓里的哪个洞里一钻,也从来不会有性命之忧。“我就纳闷了,同样是老鼠,差距咋就这么大呢?”


    他决定将厕所老鼠和粮仓老鼠的贫富差距作为一个课题来研究,为此, 他作了一个实验。实验很简单,他把仓鼠抓住,关在厕所里,再把厕鼠抓住,关在粮仓里。三天之后,
    他'
  merge: -1
  img_proc: true
- pgno: 10
  md: '检查实验成果。


    曾经的仓鼠现在也变成了吃不饱，见到人就惊恐万状的状态，曾经的厕鼠现在则吃得好，见到人也不怕了。


    此情此景，李斯不由百感交集，说出了他在中国历史舞台上的第一句台词：“人之贤不肖譬如鼠矣，在所自处耳！”


    李斯明白了一个道理：“鼠在所居，人固择地。”得出这个结论以后，李斯同学再审视了一下自己的处境，自己是粮仓中的老鼠，还是厕所里的老鼠？天下何处是我的粮仓？咸阳，唯有秦之咸阳，才是天下最大的粮仓。


    那就朝着咸阳，出发吧。鼠如此，人更如此！你所选择的环境决定了你这一生能否有所成就。


    我们创业的人，到底在哪里创业，决定了你的成就，先不管你有没有能力，你如果在落后的城市里，你有能力也没地方发挥。


    我最喜欢举得例子是，你在三线小城市，连招聘两个像样的大学生，你都招聘不到，还想逐鹿天下，不是笑话吗？这就是为什么大部分中国富豪都集中在北京，上海，深圳，广州的原因，想成大事的创业者，必须选择好自己的粮仓！


    # ## 2 创业商学院 为创业人服务


    年轻人应该以什么心态混社会


    现在很多年轻人，认为公司给他 3000 块的工资，他就只干 3000 块的事情。如果这样的心态，他这辈子就只能挣到 3000 块。但 如果他换一种心态，给我一个机会，让我去工作，我在工作当中


    中能够学习，能接触到很多牛掰的人。可以提升自己的见识，这样的心态就很聪明了。


    30 岁以前，大部分人都没有什么钱，但是有的是时间，每一天都可以拿时间去学习，去历练。别人之所以给你开 3000 块的工资是因为你只有 3000 块的水平，你的水平不提高，别人是不会给你涨工资的。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '但是别人给了你工资以外更多的东西，比如视野，比如智慧，比如人脉资源。这些东西才是年轻人应该积累的，而不要盯着那几个工资。


    很多人都想创业，一个真正厉害的创始人当然要有的人追随你，而这种人有一个品质，就是他一直在不计回报的贡献给周围的人价值，让周围的人都感觉到亏欠他的，他自己却没有债主心态，这样的人，就会一呼百应，想做点事的时候，就会很多人帮，会很顺利。而有计较心态的人，成功就很难。


    有计较心态的人，看不见长远的利益，只看见眼前的东西，这样的人反倒是最吃亏的。


    如果，你养成了跟老板，同事，甚至是谈恋爱的对象都非常计较的心态来与他们相处。其实你会生活在一个冷冰冰的世界中，大家都对你非常计较。很多事情都只能停留在眼前的成交上面。


    而如果你不计较，其实就会有很多人受你的恩惠，这其实就是一个投资，当你投资了很多有价值的恩惠给别人的时候，这个回报率会


    随着时间的推移，变得非常大、非常的惊人。也就是说，一个人如果非常在意明处的回报，那么他就不会有什


    么暗处的财富，长远的财富就非常的少了。其实，真正聪明的人，都是舍弃明面的财富而追求这些长远的，暗处的财富。


    我经常性对小伙伴们讲，我们只要赚到更多的钱，就马上搬到更加富有的地方去住，去办公，如果不富有的地方，我们不去，因为我们眼睛里看到的，都是贫穷的人，贫穷的房子，那么这些信息输入到我们的脑袋里，我们就自然变得贫穷了。因为人其实就是个生物机器，输入什么，就输出什么。


    先给大家讲个故事，深圳某大型公司的陈总，多年来在招聘人才时，在最后一关，她总会'
  merge: -1
