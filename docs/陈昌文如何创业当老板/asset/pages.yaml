    说起毛泽东，我就想起林彪。塔山阻击战时，东北野战军司令员林彪曾这样命令部队：“我不要伤亡数字，我只要塔山。”为什么会有这个命令？是因为在国民党数十次的进攻过程中，老是有部下不断的报告林彪，伤亡了多少多少人，又伤亡了多少多少人。又伤亡了多少多少人。


    最后，林彪同志就下了这道命令，“我不要伤亡数字，我只要塔山。”


    从这里面，我们也可以学学大人物的格局，大人物，就是不在意小事，要的是最终结果。


    我们当老板的，有时候老是碰到员工，完不成任务，他会找很多很多的借口，各种各样的理由，如果你接受了他的借口，他的理由，那么下一次他还来说他的借口与理由，而且大家都会效仿这样的员工。你这公司就别开起了，我们当老板，就只要一个结果，别给我没用的。我觉得，这就是我们应该学习的东西。


