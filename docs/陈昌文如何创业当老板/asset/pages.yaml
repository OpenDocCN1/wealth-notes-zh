  md: '发现你们的老板就是第四重境界的老板，那么立马辞职，想都不用想，因为，他这艘船啊，随时都要沉。当然老板们明白我这个理念了，自己去反思。调整自己的管理模式，把企业做好。


    # 用竞赛手段激励销售团队


    没有销售就没有金钱，公司就得喝屁，就是死掉的意思！销售团队是公司最最最重要的团队。俗话说：“火车跑得快，全靠车头带！”让团队内部竞赛的好处是，可以给平淡的工作带来工作激情，乐趣。


    可以纠正团队的不良行为，不良风气。还可以强化公司的团队文化。公司的车头就是销售团队，销售团队的管理并非是任意挥洒的艺术。而是更加接近一门逻辑严密的科学。今天给大家提供一个手段，通过设立团队内部的竞争文化，让销售团队快速提升业绩。


    你可以把你的销售团队分成两队。以我的经验，你需要注意以下几点。


    第一：不要举行个人与个人之间的竞赛，这样容易引起个人与个人之间的中伤行为与作弊行为，容易引起不满情绪。举行团队与团队之间的竞赛。这样，优秀的销售员会帮助团队里落后的销售员，团队里落后的销售员也怕因为自己的业绩不理想，影响到了整个团队的成绩，这样对整个团队的影响都是正面的。


    第二：你的奖励必须是围绕团队成员而展开的，要问他们获胜了想要什么，而不是你自己买了东西，想当然的给获胜的团队，如果你奖励的东西他们并不感兴趣，那么，恭喜你，以后你再用竞赛手段让他们拼命工作，他们只会骂你傻逼。


