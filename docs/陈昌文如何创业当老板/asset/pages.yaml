  md: '个老板的生意肯定不到哪里去。光说清楚了还不行，说清楚了，只能勉勉强强活下去。


    你要想把




    生意做好，你得一句话说明消费者购买我们的产品与服务。如果一个老板，唧唧歪歪10几句话都说不清楚他是干什么的！顾


    客哪里有有那么大的耐心来听你讲那么多！你的生意自然是好不了的。能一句话说顾客购买我们的产品与服务吗？很老板讲，你这家


    伙，就知道开玩笑，哪里有这种事。


    好吧，我举个例子。收礼只收脑白金，我再举个例子，送长辈，黄金酒。我再举个例子人头马就个酒，一句话：人头马一开，好运自然来！


    我还能举很多成功的企业，他们就是用一句话，就说服消费者买他们的产品。记住，不是说明清楚他们的产品，也不是说服消费者承认他们的产品与服务好。讲话的目的，不是让顾客清楚你是干啥的，也不是给用户介绍你的产品与服务多么牛逼，多么先进，多么好，不是
    从理论上，现实上让顾客心服口服，而是要让顾客掏钱，所以，老板的一切精力的焦点，都应该是说服消费者购买。这就是牛逼老板与傻逼老板的最重要区别，当然要加个之一！


    多少笨蛋一辈子把精力投入到了说明清楚自己产品或者服务上，或者更加聪明点的，会把精力投入到说服消费者这件事情上上。但 这都是浪费精力。


    说清楚，说服，与说动，完全全然不是一个层面的事情，要达到 说动的效果，其实根本不需要说清楚，也不需要说服。


    牛逼的老板，可能是个粗人，虽然没什么文化，但天然就懂这个 道理，比如团队管理也是这样，牛逼的老板讲话，目的不是跟大家解释什么东习，也不是与大家一起讨论，把大家说服，人哪，都觉得自记了不起，你以为他会服你？就算嘴上说服，心理还是不服。所以，牛逼




    的老板不讲废话，讲了，就要员工行动。这就叫做动。能说服员工，就有效率，成天研究说清，说服的老板，这样的团队，企业，就效率低下。'
  merge: -1
