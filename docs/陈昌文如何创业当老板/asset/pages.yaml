    # 创业的两种常用套路


    创业有两个套路，第一个套路，普通人玩的套路。是先做好一件力所能及 的小事，然后在这件事周围画同心圆，扩大一圈，把扩大一圈的事情做好，然后在扩大一圈，又 把进一步扩大的事情做好。最开始的时候呢，你要仔细估量自己的能力，资源。看到底能做
    好一件什么样的小事。用这个套路来创业，只要不急功近利，稳扎稳打，一般都能取得成功。而且如果你勤勤恳恳的干下去，随着时间 的流逝，你也有可能干出一个商业帝国来，实际上我们这个社会很多企业家都是这个套路出生
