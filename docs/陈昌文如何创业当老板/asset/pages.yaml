    曾经看到一个报道，说微软公司的员工从来不用自己的搜索引擎，而是使用谷歌搜索引擎。


    这意味着微软的搜索引擎一定做不好，因为员工都不使用自己的产品，就不能十分了解自 己的产品，也没有说服力去说服别人使用自己的产品了。


    用自己的产品，不是要求你喜欢自己的产品，而是要做好产品，你就必须得知道自己产品的优缺点，而想要知道自己产品的优缺点，你必须在使用的过程中才能慢慢发现。


    不管你是卖什么东西的，你最好从思想上，理念上先把这个产品 让你的员工大量使用，鼓 励他们使用，奖励他们使用。




    这样，员工就会自觉的把这个产品做好，卖好。因为做不好，卖不好，就是坑他们自己。


    我们不管是做产品，还是管理员工，最有效的方式不是说教，而是利益捆绑，让这件事与员工有关系，员工自然就上心了，这就叫“道法自然”。


