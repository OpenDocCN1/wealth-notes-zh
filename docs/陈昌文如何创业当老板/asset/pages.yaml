    最近这几年，随着互联网的发展，自媒体发展也迅猛无比，很多人 都尝到了做自媒体的甜头，赚了不少钱。运作一个自媒体有几个要 点。


    我 做生意一直有一个原则，就是必须是接近零成本， 然后赚回 来的是现金， 而玩 自媒 体恰 好就是这样 一个生意，我们的投入就是 几台电脑，两三个互联网人才，而收入
    差点，一年也有几十万， 如果 自媒体能做好， 那么上千万也不是不可能。如今 这个互联网时代，特 别是 90 后 00 后的 大学生，谁还去开工厂，搞饭店，做网店呢？这种
    传统生意，投入 太大，地面限制多。后续增长乏力， 竞争激烈。成 天要应付各种关系。简直就是跪着挣钱！ 特别没意思。


    自媒体就是属于我们发布东西，吸引粉丝过来，到 一定时候，粉 丝里单，比如我推出会员 制。 或者是商家需要做广告，那他出钱。自 媒体都有那些呢？ 典型的自媒体有微博，微信，一定级别的大
