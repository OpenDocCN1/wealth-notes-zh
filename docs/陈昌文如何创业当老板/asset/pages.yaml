  md: '# 如何利用空虚无聊


    我想每个人都有这样的时候，就是感觉到非常无聊与空虚。这个时候，总是想找点事情做。


    有部分年轻人，选择了打网络游戏，或者看黄片。来填补自己的空虚无聊，还有些人选择了打麻将等方式来填补自己的空虚无聊。


    而这些方式，玩过之后只会让自己走向更加的空虚与无聊。一个人为什么要找点事情做呢？原因就是没有事情干的时候，人


    会感觉到空虚无聊。所以人才会主动去找事情做。有的人找的事情毫无意义，就我开始举的例子，打网络游戏，看黄片，打麻将。去做这些事情的人，很难有事业的成就。


    而有的人，走向了良性循环，他们寻找了些有益身心的事情去填补自己的空虚无聊。比如：读些理财投资方面的书籍，填补空虚的同时，还可能改善自己的财务状况。比如一头扎进工作当中，不仅仅是把工作当任务完成了，而是把自己的工作做得尽善尽美，做到艺术的境界，为自己赢得了更高的回报与社会地位，还有同事的尊重，最后获得成就感。


    我们这个世界上，很多伟大的小说家，思想家，画家，就属于一头扎进自己工作中的人。最后功成名就。


