- pgno: 166
  md: '+   1. 老板给员工的目标必须明确，尽量的深化，细化，如果自己太忙，就交给自己的助手去深化，细化，然后自己检查下，布置下去。


    +   2. 目标安排下去，要与执行人员开一个会议，明确什么时间开始做，什么时间能结束。要彻底杜绝开了会不做明确决定的习惯！决定了，有行动的习惯。


    +   3. 自己也要积极的参与到任务的执行过程中，要去推进项目。


    +   4. 要负起领导的责任，你可以不做事，但必须要把握一个准确的前进方向，并且时时刻刻的提供给员工帮助，帮他们解决碰到的问题。积极提供他们所需要的资源。


    他们有疑问，及时的给予答复与解决。


    +   5. 如果精力允许，就要身先士卒，发挥榜样的作用，自己挽起袖子来干。如果自己不干，要挑选好责任人，让责任人代替自己发挥榜


    创业商学院 为创业者服务 195


    样的作用。


    +   6. 要明确员工需要什么，而不要老想着自己要达成什么目标。承诺员工干得好，会有什么奖励。给他们一个执行的理由。


    +   7. 绩效考核，做得好的人，一定要及时奖励。做得差的人，要及时惩罚。带兵打仗，奖惩是必须要用好的工具。


    基本上，这 7 条，不用全用，员工的执行力就能提上去了。


    老板用人，看哪三点


    做招聘时间长了，我渐渐从最开始的唯利是图，看一个人的能力到看一个人的人品与发展潜力了。只要这个人的人品好，有潜力，对其工作能力的要求是基本及格就行。'
  merge: -1
  img_proc: true
- pgno: 167
  md: '每个人都想要权与钱。但有些人到公司里来心术不正。窜上跳下，拉帮结派，两面三刀，玩弄权术，巧言令色，这样的人可能能力比较强，善于迷惑人。


    这样的人还是敬而远之比较好，是切不可以成为朋友或合作伙伴的。一旦他得到重用了，干其坏事来，破坏力也是极大的。


    其次是做人做事的态度，愿意不愿意服从老板的指挥，昨天招聘时候碰到一女性求职者，简历上看以前工作都蛮辉煌的，但嘴里说不接受加班，也不接受出差，你与她商量什么，她总是一副必须按照她的规则来的态度。这样的人就算能力再强也不要招聘到公司里来。因为公司就是大家相互配合，甚至是相互妥协才能出成绩的地方。能力是可以在工作中锻炼的，而态度的修养则是她爸妈的事。


    中国的私营企业不同于国企，也不同于外企，早九晚五，双休也能做大做强。小老百姓创业，没有干爹，玩的是丛林法则。全靠自己赤手空拳到市场上去拼杀，怎么可以在企业来养活生惯养的员工呢？


    所以我们看人不要只看表面的形象怎么样，也不要只看他的过去的工作经历，甚至只看他的能力，而是要看他做人做事的态度。


    最后，能力只是基础，只要招聘进公司，他能基本胜任就行。我们要的是他的人品好，态度好，他自然有发展潜力。


    有些人自认为能力很强、水平很高反而比较难以与人配合。人不可能是全能型的，在合作中始终要把人品和态度放在更重要


    的位置。发挥团队的力量，才能走得更远。“以德为先”，“德才兼备”不仅是选用人才的标准，也是选择


    朋友或者创业合作伙伴的标准，选择同行者或是同路人，我们要坚持自己的标准，决不妥协，否则选错了代价更大。


    # 如何管理业务员'
  merge: -1
  img_proc: true
- pgno: 168
  md: '业务员是最不好管理的群体，管好了，公司业绩飞速上涨，管不好，就等着破产。业务员岗位不是标准岗位，他们的工作很难从日常工作中去量化，比如，你看一个业务员表面很努力在跑业务，但他实际上在外的边网吧里玩。有的业务员嘻嘻哈哈好像不做事，但业绩却很好。这就让很多老板很头疼。要想把业务员这个群体管好，必须从管理业务员的心入手。我的策略是天天都会与业务员开个会，这个会不是很正式的。当然正式的也经常开。


    目的是:


    加强业务员的思想工作，让他们尽量认同公司，认同公司的文化；工资奖励要比同行高出 10%，分为月奖励、季度奖和年度奖，这样随便辞职的人肯定会有损失；做好每个业务员的职业规划，让他们有上升空间，有奔头，树立好因为业务做得好当上了业务主管、业务经理的榜样；公司要建立完善的客户档案，记录每一个客户的每一笔交易信息，将客户掌握在公司手里，而不是掌握在业务员手里；可成立专门的客服部门随时与客户联系，逢年过节由客服出面而不是由销售人员出面向客户送点小礼品，这样即使业务员辞职到别人的公司，也带不走我们公司的客户。


    另外，开公司并不是让所有客户都满意。我们小时候受的教育是：为人民服务，无论做什么事情，我们都希望人人对我们都满意。各种管理书上，各类媒体上，大家会看到许多公司或组织为每一个客户提供优质服务从而让人人都满意的案例，每个大企业的老板也经常在公司开场合讲，我们的目的是让我们的所有用户都满意，这些大企业老板讲话其实坑了很多创业者：有110民警早晨为打电话求助的市民买早餐，有某某公司半夜12点为用户免费修空调，有某某公司驱车几十公里为用户送一个价值十几元的商品等等。刚创业时，我里就下定决心，一定要做好服务让所有客户都满意。后来我发现，这个成本实在太高了，有的客户，我本来就赚了他几百块，结果后期不断的找我服务，我为了履行承诺，付出了上千块的代价还要加上人工。这样下去，我会被这些客户搞破产的。后来我想，可能是那些大老板骗我，根本不可能做到人人都满意，我就调整了自己的经营方针，谁给的钱多，谁是大客户，我就做好服务，谁是小客户，谁给的钱少，我就稍微做点服务就行了，亏本了，我就不干了，或者要干就要继续收费了，他不开心，我也无所谓，他说他以后再也不买我的产品了，我还非常


    开心，终于少了一个麻烦客户。


    所以，我们当老板的，不仅仅是在吸引客户来买我的们产品，我'
  merge: -1
  img_proc: true
- pgno: 169
  md: '们也要筛选优质的客户，服务于给我们带来大量利润的人，这样企业


    才能健康发展。


    # 坚持以客户利益为核心来驱动员工努力奋斗


    从企业活下去的根本来看，企业要有利润，但利润只能从客户那里来。企业的生存本身是靠满足客户的需求，提供客户所需的产品和服务并获得合理的回报来支撑；


    员工是要给工资的，股东是要给回报的，天底下唯一给企业钱的，只有客户。我们不为客户服务，还能为谁服务？客户是我们生存得唯一理由。既然决定企业生死存亡的是客户，提供企业生存价值的是客户，企业就必须为客户服务。因此，企业发展之魂是客户需求，而不是某个企业领袖。


    有很多老板喜欢提爱国祖国，爱人民，我这个人的思想是灰色的，我爱祖国，爱人民，但更爱我的客户，更爱公司、爱自己的家人，我对自己亲人的爱，总是胜过对一般员工的爱。这才是实事求是，实事求是是才有凝聚力。


    一个老板，喜欢讲空洞的话，讲得很好听，是不行的，实际上每个人都是明白人，都不会跟你交心的。因为你根本没跟员工交心。


    公司一方面必须使员工的目标远大化，使员工感到他的奋斗与祖国的前途、民族的命运是联系在一起的，这样有助于吸引人才的人才，这种人才才是为了使命而奋斗的；另一方面，大部分人都是普通人，所


    以公司坚决反对空洞的思想。能培养员工从小事开始关心他人。平时关心同事，以及周围有困难的人，修养自己。能做到儿几点，已经很不容易了。


    只有有良好的个人修养，才会关心祖国的前途；为国家，也为自己和亲人，这是两部发动机，我们要让他们都发动起来。实事求是，合乎现阶段人们的思想水平。客观上实现了为国家，为人民服务。


    为客户服务是企业生存的唯一理由，公司唯有一条道路能生存下来：就是客户的利益最大'
  merge: -1
  img_proc: true
