  md: '的书呢，又有点不过瘾的感觉。只好增加自己的辨力，如果买到垃圾书，马上扔。有的书介绍很好，实际上一看里面的东西简直是浪费时间。


    我们的精力应该是讨论手上的事情怎么做得好，而不是讨论策略，公司未来，方向，这都是操蛋的事情，手上的事情做好了，什么都有了，策略，未来，方向不用讨论。这些东西都是为赚钱服务的，所以，我们最终要干的仅仅是把手上的工作干好，赚钱。没事了，我是个极端务实的短视者，可就是靠这种理念，我才能赚几个钱。


    中国人都很保守，不管干什么，要很长时间才能热身，这还算可以的。有的人都是这个时代潮流已经过了，他才热起了，或者说还没热起来。昨天有人叫我讲开网店，讲淘宝这个啊，现代这个个时多多看一眼这方面的知识都是浪费时间，时代已经不届与淘宝创业者了。


    这个世界上只有智慧最值钱，混社会的智慧，如果你还没有钱，你就拿你可怜的那点钱去换这个智慧。如此简单的道理，能有几个人能看呢，能做到呢！


    我们当老板永远要思考一个问题，就是别人为什么愿意跟你混，其实这都是智慧问题，别人为什么主动工作。而不是你去管他，强制他。我是通过分权，分利益。分名，能分出去的尽量分出去。让有能力的人都满意，领导者是必须让主人动跟随的人，而不是强行让别人听话的人。


    我的一个理念是，我希望跟着我混的人都比我强。我变成最垃圾


    的那个人，不过我一直努力奋斗，我希望跟我混的人要么天赋异禀，要么比我更拼。不就是赚钱嘛，这鸟事都做不好吗？朱元璋连天下都打下来了呢！打天下当然不是朱元璋一个人的事情。所以，当老板一
    直要思考的就是怎么能让人跟你混。


    很多创业者都认为自己的环境，员工，企业不理想。我就认为我的企业环境，员工，都很理想，结果所有的事情就向理想的方向发展了。你的内心散发出来的东西，会直接影响企业的氛围，员工的情绪，所以，创业者必须把自己的心态调整好。


    我大部分的精力其实都是在分析自己，我们人的精力很宝贵，我们没有必要把精力分散到别人身上去。把自己给分析透彻了，看其他  人也明白了。心心相映，赚钱也就简单了，当老板也就顺利了。


    我为什么反对老板重视技术？因为一个老板不需要了解很多技术 就能把钱给赚钱了。老板最重要的是修炼自己的心态，其次是练习沟通能力，最后才是学技术，知识。所以文盲就可以当大老板了，只要  他心态好。'
