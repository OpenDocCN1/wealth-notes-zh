    我呢，就说，我赚钱，全靠做事认真，有耐心，喜欢把一个事情做透彻。读了不少赚钱的书籍，所以能赚点小钱。


    然后他就兴高采烈的让我推荐了他一本书。我也就兴高采烈的推荐了他一本非常非常流行的书《穷爸爸，富爸爸》。


    他回去过后，3小时就告诉我，他读完了，而且还做了 15 页的笔记。


    我一听，就骂他傻逼。读这本书，我自己已反复读了 10 多次，花了一周时间，做了不少笔记。才扔到账架上，偶尔还拿出来翻翻。其实书不在于好不好，而在于你读得有多认真，你认真了，自然能从里面




    翻点有用的经验，然后用到工作上。我告诉他，读一本书，第一次：你只是认识字。


    第二次：你认识了词语。第三次：你知道了句子。第四次：你看到了书里的故事。第五次：你读到了些道理。


    第六次：你从中体会到了些哲理。第七次：你开始明白作者的逻辑思路。


    第八次：学会了书中告诉你的竞争手段。第九次：把书里面的招式做成了符合自己的工具。第十次：上面九个步骤完成了，开始把书中的精华用自己的工


    作上，练到运用自如，那么这本书才算读完了。我问他：你为什么三个小时就读完了？而且你肯定没买实体书，


