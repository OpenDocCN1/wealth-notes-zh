    我就给你打一辈子工，相当于卖身为奴了。我的意见是，只有完全投 入到公司里来参与运营的人，才有资格分股份。


    +   1. 团队必须有核心。我见过很多创业团队的失败，就在于谁也不 服谁。很多创业团队， 要么是同学，要么是同事，大家看起来本事都 差不多。所以，就平分股份。很多公司做起
    来了，然后就出问题了， 要决策一个事情的时候，这几个人都非常自我，都要体现自己的 存在 感，都认为自己很牛逼。结果往往不是为了事业顺利发展而争论，而 是为了权利斗争。


    其实做企业必须要有一个头，一个核心，一个说了算的人。开始 创业的团队，也必须独裁， 独裁是效率最高的。商业就如同战争一样， 大家到战场上打仗。肯定有一个将军来指挥，
    大家都必须听这个将军 的。若是谁也不服谁，都想按照自己的想法来打。那么这场战争还没 开始，就已经失败了。


    所以，在分配股份的时候，你做为创始人，必须要拥有绝对多数， 要能左右团队的方向， 要有一票否决权，如果有人不服气，就请他离 开。乌合之众是干不了大事的，一个团队没
    有核心，就如同银河系没 有太阳一样，不可想象。


    +   2. 要性格互补，业务能力互补。比如你做为创始人，擅长营销， 那么你得找一个擅长做 产品的。你擅长财务，那你得找个擅长做人的。不能都只会人事，或者只会产品。那么
