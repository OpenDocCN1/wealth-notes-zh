  md: '我们那个地方是很穷很穷的农村，我家里也没有什么书籍，也就是说，我根本没有地方去吸取更加先进更加多的营养。我就只有一直学习课本。


    虽然很笨，但读书成绩一直名列前茅，不然我可能就成了工厂里 的打工仔了。


    现在 23:13 分，我刚刚搬完办公室，最近物色了一个新的办公室， 装修完毕，今天下午 2点一直忙到 9 点，从老的办公室搬到新的办公 室。时间到了 9 点又和一群创业的
    VIP 讨论了 40 分钟，解答了很多人 创业的疑问，然后我又来写文章，又来讲语音。


    目前，我还没吃饭。我的这种奋斗精神把自己感动了，赚钱自然 就是顺便的事情了。我的这种奋斗精神也感动了团队，团队成员也没 吃饭，也在奋斗，当我把这篇文章写完，讲一个语音过后，
    我们就随 便买点东西吃了。反正晚上少吃点，反而对身体好。


    我经常碰到一些人对我说，钱真的太难赚了。我就告诉他，小富


    由勤，大富由命，你如果能像我一样勤奋工作。其实你根本不需要多 聪明，自然会成为你那个行业的中上游，自然也就有钱赚了。


    从当老板的那一刻起，我就没有星期天，没有节假日了。也没有 下班的概念，我一直在奋斗，凭啥我能吃肉？答案已经显而易见。而 且，一个人一直奋斗的话，就会带动一群人陪着他奋斗，然后对自己
    事业的理解力会不断的深入，事业越做越好，自然就有更加优秀的人 加入他的团队。


    其实，在我做事的过程中，我并不是眼里只盯着钱的，我就是想 燃烧自己的生命，去服务别人，在做企业，做项目的过程中，我就是 希望跟着我的伙伴们有钱赚，有大房子，有豪车。然后实现他们的理
    想。结果，我就赚钱了。


    我想送给正在创业路上的朋友们一句看起来没什么营养，但真正 让我得利的的话：我一直在奋斗，小富由勤，大富由命。'
