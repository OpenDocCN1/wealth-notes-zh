    仗，一统天下。 我觉得，主要原因就在于，这些皇帝论功行赏，不是说，你是皇帝的亲戚，就提拔你当官，或者你是皇帝的发小，就提拔你当官，而 是你确实帮助皇帝打了很多胜仗才能升官。


    而一些草包呢？就是任人唯亲，凭自己的爱好，任意授予自己喜 欢的人官职，爵位，自己不喜欢 的，就拿来杀了。最后就只能打败仗。


    我当然不愿意做这种草包，所以，在我的企业里面，以营销部门 举例，谁能升官呢？


    +   1，谁为公司赚得钱多，谁就升官，谁开会就坐第一排，赚得少 的就坐第二排，以此类推。


    +   2，由于企业单子有大小，有的人出单多，但是都是小单，赚得少。 但为企业打出了知名度，积累了不少潜在客户，我也重点考虑这样的 人。


    总之就是严格执行能者上，庸者下的政策，其他部门也是如此。 以文化建设为纲，以赚钱为目的。以营销和创新为手段，这就是


