  md: '超市，就用的支付宝付款的。 第三：不变，虽然有很多东西都在变化，但我们这个世界上有些东西 是不能变的，比如你爸爸永远是你爸爸。与合作伙伴创业，你拿小头，
    合作伙伴拿大头，他肯定开心些，这也是不变的东西。


    今天我们主要讨论的是第二层含义，变化，我们老板的市场观念 应该怎么顺应时代潮流。


    市场观念的演变大概可以概括为以下几类。 第一：生产观念，是商业领域最古老的概念之一。在大家都不富


    裕，物质匮乏的年代，大家都认为，消费者喜欢便宜，量又足的产品。 所以，在这种观念熏陶下的老板，总是在追求提高生产效率，降低成 本，然后薄利多销。我们中国的很多制造工厂，血汗工厂的老板，玩
    的就是这种生产观念。可以说，在当今时代，已经是过得挺苦逼了。


    第二：产品观念。产品观念的老板，就是一心琢磨出来个好产品。 产品观念的人，认为消费者就是喜欢高质量，性能水平极高，富有创 新特色的产品。我觉得乔布斯的苹果公司把产品观念给发挥到了极限。
    产品观念有一个缺点就是，很多人并没有乔布斯那样的把控能力，自 己生产出来的东西，大家并不认可，导致自己白白的研究产品了。


    第三：推销观念。保险公司，就是典型的推销观念带动企业发 展的典型。以电话推销为主，包括很多忽悠人去买股票的，买投资理财 产品的企业，大多以推销观念主导他们的企业。推销观念是只管把自己
    的东西变成钱，顾客买了有没有用我们不管。


    第四：营销观念，这是一种什么观念呢？是直接满足顾客的观念， 顾客要什么，我们才去计划生产什么产品。以解决顾客的需求为目标


