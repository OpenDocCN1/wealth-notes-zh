  md: '精力专注到自己能干的事情上面。


    # 你想多一个仇人的话，就借钱给他


    我是从来不喜欢借别人的钱，也讨厌别人向我借钱，如果非要借 钱给别人，我都是抱着送 别人的心态。比如，给你 1000 块，算是帮点 小忙，不用还了，基本上，以后就很难成为朋友了。


    你可以用其他的方式接济你的朋友，但不要借钱给他。借钱给他 就是掏钱为自己买了一个 敌人。犹太人很会经商，犹太人之间，大家 彼此都很不错，但是你要借钱，他们很少答应，也不是因为大家彼此
    之间不信任，而是他们处世的一种精明。


    犹太人是很有自尊的，他们一般是绝不肯向人求助的，犹太人在 生活上借钱，与他们在生意上的借贷是不一样的。假如一个人向自己 的朋友去借钱，那说明这个人已经处于生活比较困难的时候了。有人
    借钱给他，他就总是感到忐忑不安，见了朋友就感觉很不好意思，虽 然朋友对他仍然很亲密，甚至那人浑然不觉借钱人的尴尬。而借钱人 为了避免这种愧疚的心情一般都会回避自己的朋友，希望自己尽快地
    还钱，那样自己才觉得在朋友面前会坦然，有了这种心理，这样的朋 友关系就会因为金钱变得很不自在，让人感觉不舒服。所以，犹太人 之间就心照不宣地达成默契：不借钱给自己的朋友。


    其实男女朋友之间也一样，最好都经济独立，若是借钱给对方， 总有一方感觉亏欠，有一方感觉自己很高尚，任你说的再好听，你心 理不会尴尬，其实心理都有细微的变化，而
    这细微的变化，就很容易 使感情变质。


    我们生活中还经常发生的事情，本来两个人亲密无间，结果一个 人借了另一个人几千块钱，由于一时半会还不上钱，结果经常见面的两 个人，就会出现一方再也不想见到另一方，因为一见面，就会想起来
    还欠着钱，由朋友，变成债务关系，最后变成仇人的很多很多。


    借钱经常出现这样一种情况，他刚来借钱的时候，他是孙子，你 是爷。等你要去钱的时候，就成了你是孙子，他是爷了。所以，不想 当孙子的，还是别借钱给朋友。'
