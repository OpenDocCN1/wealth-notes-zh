  md: '出来，多放几只螃蟹在桶里，这些螃蟹就相互 拉扯，最后是一只也爬不出桶。因为一个爬上去，另外一个就会扯下 来。


    洗脑第五招，也是绝杀招。 就是制造一个与外界完全不一样的企业环境，从企业文化，到企


    业环境，甚至是作息时间。让你这里工作的员工只能适应你这里的 工作环境，到其他地方去，他就难受。其实这也是为什么很都成功的 企业，牛逼的员工跑出去了，过一段时间他只好再回来的原因。因为
    出去了，他生存不了。就像你把员工养成了在 38 度水温室里生存的鱼。 外面的环境都是 20 度。他出去没法活，只得回来。


    # 如何对待员工


    如何对待员工？


    这是一个沉重的话题，我来分享一下我对待员工的经验。


    1，不愿意给优秀的员工分钱，是对公司利润的最大浪费。因为他




    们不会尽力。奴隶不要钱，但奴隶的效率最低。奴隶主发现给了不给钱 效率最低。所以就让奴隶变成了自由农民，然后按劳动给予他们报酬。


    2，珍惜最优秀的人才。平庸的人能识别谁是优秀的人，但是他们会嫉妒优秀的人，最终让优秀的人离开或者毁掉。优秀的人一般都有个性，很难相处，但老板要学会看结果，只要有业绩，我们就要珍惜他们，他们才会替我们赚钱。


    3，不要为有问题的员工浪费时问，部分老板喜欢教育那些有问题 的员工，甚至天真的以为他有能力改变这些员工。其实一个成年人很难被改变的。他的父母，老师都没改变他，何况你呢？十年树木百年
    才树人。老板应该花时问精力在那些优秀的员工身上，让优秀的员工 更加优秀，创造的业绩更多。企业的利润本来就只来至于 20%的优秀 员工。有问题的员工，开除就行了。


    4，员工每周都要交工作报告，并且写上工作成绩，不然就是对自 己的时问与金钱不尊重。公司毫无效率。不要去诘问那些不优秀的人 的意见，他们的脑子本来就是一棵摆设，如何变'
  merge: -1
  img_proc: true
- pgno: 154
  md: '得更优秀，你应该去问 优秀的人，问有成绩的人。兼听则明，不是让你听垃圾的意见。


    5，对员工定出高标准。不要怕他们达不到。给他们一个目标，让 他们去攀登，取法乎上，得其中。取法乎中，得其下。


    他们若是做得很好，并且达到了高标准，马上奖励他们。许多老 板在业绩好的时候，说自己领导有方。业绩差的时候，就怪员工无能。 这是非常愚蠢的性格，不要抢下属功劳。


    但也不能让你的员工有了成绩就躺在成绩单上玩耍，你要不断鼓 励他们攀登更高的业绩。




    # 如何带出如狼似虎的团队


    第一点：不要给团队成员高底薪，给了高底薪，大家就靠底新吃 饭了。很容易导致大家没有奋斗精神，其实那些大企业的老总，一般 都是跟业绩挂靠，做得好了有奖励，做得不好，其实也赚不了几个钱。


    给高底薪，实际上人害人害己。团队成员不拼命，自己也赚不到 钱。我提倡的就是计件制，一个人为公司赚了多少钱，就给他一个提 成比例。这个钱以现金方式当着同事的面发放。不要把提成发放到支
    付宝，因为支付宝里的钱，仅仅是个数字变化。我现在都感觉多 5000 少 5000 没什么感觉。如果用支付宝发放提成，那么我想慢慢的，员 工对这个钱也没啥感觉了。但是现金不一样，5000
    块，100 的有 50 张， 而如果另一个人的提成只有 300，那就只有 3 张，这样是非常具有冲击 力的。可以激励做得不好的，要努力做好。受不了的人，也就走了。
    他走我们也乐意。做得好的人，就会更加努力的工作。


    第二点：末位淘汰制。 什么意思呢？一定要给大家危机感，不能说做得再差都可以。但 是，团队中最差的人，我们可以设定 2 个月或者 4 个月统计一次，最 差的人直接淘汰，也就是让他走。完全不讲情面。大家平时可以在一起喝酒，吃饭，开玩笑都可以。但是统计出来数据后，就要严格执行。
    如果你的员工开始比较少说话，你可以 4 个月淘汰一个。如果员工比 较多，每一月都应该淘汰一个人。加大招聘力度。不断的筛选优秀的 人，淘汰弱者。


    V:ccw2020398 更多网赚资源分享'
