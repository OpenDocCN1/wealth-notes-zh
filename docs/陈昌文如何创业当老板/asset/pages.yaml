- pgno: 254
  md: '没有一个男人是生来就让人喜欢的，现代社会，男人就是应该靠自己的智慧与汗水为自己赢得江山美人，我从来不 喜欢抱怨，我也劝接触到我的人别抱怨，关于创业，我最喜欢说的一句话就是，干起来吧。


    无论是打传奇的高中生活，还是上大学打魔兽世界，还是现在做企业，我都能够体现我的价值。我玩传奇的时候，要不了多久，我就成为服务器里面的名人，并且经常带着一帮小弟去欺负别人。我玩魔兽世界的时候，刚玩就开始组建公会，开始挑起战争或者组织人去打boss，提升自己的装备，赚取金币。我做企业的时候，做项目的时
    候，开始的时候我也不懂，但我现在也能自给自足，还能给父母一些钱，也没有任何经济压力。


    我拥有的一切都来自于我的学习能力！也就是说我实际上真正拥有的财富是什么呢？是学习能力。只要有了学习能力，不懂的东西就会很快懂了。


    大学毕业之后，我做专业对口的工作只做了三年。写程序，做 ERP，


    创业商学院为创业人服务 301


    玩数据库，根本就没赚到什么钱，我可能是玩游戏把脑子玩坏了，感觉头脑也不怎么灵活了。现在人喜欢说“干一行爱一行”，我是相反的，我一直为了生存做我不喜欢做的事情。做业务员不喜欢，电话销售不喜欢，推广不喜欢，SEO
    不喜欢；给别人当主管，当经理，当营销总监也不喜欢，上大学学的专业是计算机也不喜欢，之所以读计算机是因为想玩网络游戏。


    可是不喜欢归不喜欢，有两点我是考虑清楚的：一是你可以不喜欢，但是你既然去做了，就一定要认真做。要去享受，你也必须享受，生活就像强奸，反抗不了就享受，所以我做项目也是如此，卖二手机
    脑我不喜欢，修电脑我不喜欢。可不喜欢归不喜欢，我认真做了，总是会吸收到一些经验，以后就不会再犯错误了。比如怎么找合伙人，怎么分配股权，都是在做一个又一个不太成功的项目中总结出来的经验。


    人生的每个阶段都是一种积累，必须要相信这种积累对将来是有好处的。谁认真，谁就获得最大的好处。有什么好处呢？即使不是很清楚，也不要轻易放弃现在做的事情。


    比如乔布斯大学的时候退学去学美学字，学书法，后来大家用的苹果系统就是采用这种字体，乔布斯有美学功底，所以做的手机啊，电脑啊，如同艺术品。这就是积累，生活中的每一个阶段都是在打造一颗珍珠，时间就像一根线，会把这些珍珠穿起来，你的现在，就是积累的结果。


    二是你要有强烈的求知欲。创业的过程中，自然会碰到很多问题，如果没有强烈求知欲的话，就会经常被难题卡壳，创业，其实是边学边干，边干边学。'
