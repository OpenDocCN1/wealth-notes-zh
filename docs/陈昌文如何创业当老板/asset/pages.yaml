  md: '问一个很奇怪的问题：“假如你目前的收入 并不是很高，但是以维持生活，目前正在考虑租房，有两种选择，一 种是和其他三位朋友合租高档小区两室一厅的精装修房，室内具家
    电齐全，周边都是成功人士，房租押一付三，平均每人每月还要分摊


    2000 元的房租和物业费、水电费；另外一个 是城中 村的小单间，聚居 着小商贩、民工和无 业人士，但房租很便宜，只要 500 元，房租押一 付一，但房间很小，除了一张床什么也放
    不下，你会如何选择？


    多年来，这个问题有很多人回答过，但归结起来只有四种答案。 第一种答案： 我会选择便宜的房子，环境我不在乎，至于别人什么意见，与我


    # 4 创业商学院 为创业者服务


    无关。通常，对于这种人，不论对方多么优秀，陈总一概不录用。 第二种答案： 我会选择住高档小区，人生匆匆，就是要学会享受。这种人她可


    能会留下，但不会重用，会分配文员或是打杂一类的岗位。 第三种答案： 如果大家都选择住高档小区，为了大家共同的利益，我会考虑合


    租，生活的压力也会激发我赚钱的动力。这种选择的人，除了应聘者 有特定的岗位要求外，她一般会安排他们做业务或是基层的领导。


    第四种答案： 我会选择高档小区，因为环境会影响到一个人的人生观和价值观，


