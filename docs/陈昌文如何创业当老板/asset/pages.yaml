    # 老板的市场观念应该随着时代潮流而


    我们做老板的市场观念应该随着时代潮流而改变，才能活下去，才能活得更好。


    谈这个之前，先跟大家聊聊《易经》这个易字。《易经》是我们中国的群经之首，这个易字，有三层意思，第一，


    简单；第二，变化；第三，不变；其实是概况了这个世界的一切做事情的法则，简单讲，就是我们做任何事情都要用最简单的方法达到目的，大道至简。第二，就是要懂得变化，世间唯一不变的就是变，要顺应变化，才能在市场上存活，诺基亚没有顺应智能手机的时代，被


    无情的淘汰了。现在还有很多传统企业没有把互联网当回事，这些企业也将被淘汰。银行没把互联网当回事，结果出现了支付宝，财付通，微信，抢占了他们很多市场，我昨天去'
