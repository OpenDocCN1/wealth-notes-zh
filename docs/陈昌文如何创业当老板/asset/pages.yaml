    # 人生重要的三个核心


    人生有最重要的三个核心，第一，身体健康；第二，优越的知识 系统；第三，工作出色，你必须要健康的身体，你才能够有动力学 习到优越的知识系统，然后才能工作出色。当然有没有身体不健康也
    很出色的，有，比如霍金，但我们不谈特殊人物。


    一直以来，我都想努力成为这个社会的上层，不断超越社会的阶 级限制，挑战阶级固化。其实每个朝代在打江山的时候，虽然最危险 但机会也最多，弄个将军，团长都有可能。随着国家的统一，时间的
    推移，阶级会越来越难以逾越，既得利益集团越来越强势，平民向上 游动的机会会越来越少。正因为我看过很多历史，所以我更加的珍惜 时间向上爬，因为越到后面，向上爬的难度越大。


    在 20 岁的时候，我就明白了努力的学习文化知识，了解与参悟 这个社会的结构，以及怎么混社会，怎么学本领，这包括了人际关系， 工作技巧，公司政治斗争以及销售等等，希望有志之士要重视我提的
    这几块东西。


    当然努力学习人际关系，是会给自己带来极大的好处，比如我到




    一个团队中，能清楚的知道各方的利益关系，跟谁走的近有利于工作 开展，干点啥事能升官发财之类的东西。都是很重要的谋生技巧。但 这只是人际关系，厚黑学之类的技巧。我不愿意让他成为我的主要谋
    生技能。这只是一个重要的辅助技巧。


    我前几年体检，查出了肾结石，原因很简单，就是一直在努力学 习知识，没有注意锻炼身体，当然不是什么大病，但是以给我敲响警 钟。


    所以经过长时间的学习与实践，我总结出了对于我们个人在这个 社会奋斗的重要的三个方面。第一健康的身体，身体是革命的本钱， 是一切的载体。如果没有身体，则学习知识有什么用？有了本事又有
