  md: '最近在读《李嘉诚传记》感触颇深。可以说，我们现在的创业者 的条件，大部分都比李嘉诚好得太多了，那么我们有什么理由不成功？ 又是什么根本性的原因造成我们很多人不能成功呢？成功的人都一样，不成功的人各有各的不同。


    对李嘉诚有了解的人就应该知道，李嘉诚的舅舅庄静庵是个大钟表商人，可是李嘉诚没有依靠过他舅舅。李嘉诚父亲去世的时候，李嘉诚 14 岁，他的父亲没给他留下一分线，就留下了一句话“做人一定要有骨气，求人不如求己，吃得苦中苦，方为人上人。失意时莫灰心，
    得意时莫忘形。”留下这句话的同时，还给李嘉诚留下了一个需要赡 养的母亲，一个需要上学的弟弟和一个妹妹。李嘉诚这时候还在读书， 摆在他面前的只有退学一条路，因为他需要挑起养家糊口的重担。


    李嘉诚的舅舅表示要资助李嘉诚，就是我们讲的这个大商人庄静庵。但只说，并没让李嘉诚去他的公司上班。小李嘉诚看透了世态炎 凉。明白了一个道理，“别人就算帮助自己也只是暂时的，求人不如
    求己，必须自己去找到工作，赤手空拳打出一片天下！”


    每次读到这里，我就在想我自己，衣食无忧，偶尔还挑社会的毛病，就有些脸红了，我决定以后向 14 岁的李嘉诚看齐。


    大家可以拿自己的心理状态与李嘉诚比一比，好的就吸收过来， 就知道应该以什么心态在社会上生存了。我们很多困难跟李嘉诚的困难比起来，都不算个事。


    接下来，14 岁的李嘉诚开始了在大街上找工作的历程。当年正是


    1943 年，香港被日本占领。百业萧条，街道上很多商铺都关门了。李嘉诚早上很早就开始一家一家的问，问到晚上很晚，虽然很勤奋，但 依然没人愿意收留他。


    有一天晚上，李嘉诚找工作回家，母亲高兴的说“你舅舅今天白 天来过，叫你明天去他公司上班，进了舅舅的公司，天天跟钟表打交道，这是一门好技术，日后定能发达。阿诚，你要好好干，听舅舅
    的话！


    令李嘉诚母亲没想到的是，李嘉诚平静的说“我不进舅舅的公司， 我要自己找工作。”母亲以为自己听错了，结果李嘉诚又果断的重复 了一遍：“我不进舅舅的公司，我要自己找工作！”


    我在想，这让现在很多找不到工作在家里啃老的大学生情何以堪 啊？让那些托关系，想进机关当公务员的人情何以堪啊？


    我想大凡人，都具有自强自立的精神，比如史玉柱辞去待遇好 的公务员下海，中国还有很多这样的人，如复星集团郭广昌，万通控 股董事长冯仑、新东方的俞敏洪，都是属于铁'
