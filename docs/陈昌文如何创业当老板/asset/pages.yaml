    # 老板越轻松，员工越忙，企业才有前途


    如果是老板越忙，员工越轻松，企业就要倒闭，即便是不倒闭，也永远做不大。


    很多企业为什么做不大？其实是对员工的要求太高了，没几个人符合老板的要求，他就只好自己干，不放心把责任权力，重要业务交给这些普通员工，导致普通员工没有成长，就老板自己拼命的成长。老板自己再拼命，终究是一个人而已。所谓众人拾柴火焱高。单枪匹马是不可能赢得市场竞争的。


    真正牛逼的老板，是把自己的工作都推给了各部门的主管，经理，员工，自己什么事也没有，就负责喝茶读报看书闲扯淡。


    那些产品的设计要老板亲自去抓。产品的销售也要亲主管。生产也要自己管的老板，简直是不合格的老板。


    有的老板，就是自己把公司人才的手脚捆着，不给锻炼机会，然后抱怨没人才。


    你做的越多，别人对你的依赖就越多。你越能干，你下面的人就越不能干。你越操心，下面的人就越不操心。一个聪明老板要做的，是不断地“推卸”自己的责任，让别人操




    起心来，让别人多干事情，让别人变得能干起来。如果把自己的责任推卸了，如果通过“推卸责任”让别人成长了，公司业绩自然就增长了。


    我们公司昨晚上传了1月份的月度总结，以前，都是我来做这个总结，现在，这个事情，我就交给主管来做，目的就是培养主管的能力。


    很多老板之所以自己操心、多干、能干，就是因为周围的人不操心、不多干、不能干。也不愿意把重要的事情交给这些能力普通的员工干，因为老板不满意这些人干出来的活。'
