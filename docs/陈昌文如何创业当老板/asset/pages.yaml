  md: '# 老板必须在思想上养成的 5 点习惯


    老板必须在思想上养成的 5 点习惯。第一：必须要知道自己的时间应该花在什么地方！时间是非常有


    限的，善待自己的时间，绝不要去打麻将，去喝酒浪费时间，每个企业都有许多事情要处理，要思考。你把时间花在什么地方，你的业绩就在什么地方。


    第二：时时刻刻想自己能为市场做出什么贡献。我们并不是为了工作而工作，而是为了市场而工作，不是一到公司，就钻到技术与手 段里面去，应该先问自己一个问题，顾客希望我做什么？然后我就做
    什么。


    第三：只利用自己的长处做事，利用，团队成员的长处做事。不




    可把自己的工作建立到自己的短处上面，自己做不了的事情绝对不去 做。不想做的事情，也别做。实在绕不过的事情，叫员工去做。


    第四：把精力集中在少数重要的事物上面，根据二八法则，一个企业最赚钱的业务一定是那 20%的核心业务，贡献了 80%的利润。所以，我们要把精力集中在那少部分核心业务上面。我们把每天的工作
    依据轻重缓急安排好优先次序，并且坚持这个次序，要事第一，重要的事情先做，不重要的事情，就放一放，只有这样，才能提升企业的营 业额。


    第五：老板要做的是战略决策，战术决策让团队里的其他人去做。 要认识到优秀的策略总是在不同意见中讨论出来的，做决定的时候没 必要下得很快，重要的决定，甚至可以回家睡一觉再做决定。或者多
    开会讨论几次，快速的决策大多数会让你后悔。


