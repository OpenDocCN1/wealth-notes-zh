  md: '化。比如现在互联网界的免费模式，实际上都是客户利益最大化的结果。360 免费杀毒软件之所以击败了收费的金山毒霸，瑞星杀毒等公司，就是因为客户利益最大化的力量。互联网上很多生意，都是先做到完全免费，再寻找盈利模式。


