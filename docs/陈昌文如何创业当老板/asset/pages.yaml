    # 《孙子兵法》与《吴子兵法》


    写《孙子兵法》的孙武与写《吴子兵法》的吴起谁会做营销？ 因为我是做企业的，所以孙武与吴起的军事思想我们暂且放下，


    我们来看两人是如何推销自己的。 在军事领域，两人是不分上下的，但比营销，孙武在吴起面前就


    是大师了！ 从著作说起，《孙子兵法》与《吴子兵法》都是讲军事理论的著


    作！孙子这两个字又具有天生的品牌效应，就如同苹果公司的苹果 一样。读起来朗朗上口，非常具有传播性与话题性。


    第一、看文采。


    《孙子兵法》不仅招揽了中华上下 2500 年想当将军的人去读，还 有许多梦想著书立说的读书人也来当粉丝，所以《孙子兵法》保存至 今，而《吴子兵法》仅剩 6
    篇的原因，我想和其文采脱离不了关系。 我读孙子兵法，朗朗上口，而读吴子兵法，总是有点拗口。所以，做 广告，做文案一定要朗朗上口。


    第二、看市场取向。 《孙子兵法》是一部纯理论的书，《吴子兵法》也是，但《吴子


    兵法》是以人物交谈为背景来阐释自己的思想，比较像对对话录。而《孙 子兵法》则是直接讲理论。 在现在看来《吴子兵法》有着强大的创意 优势，但在几千年前吴起的手段已经是玩过时了的，你不信随便找本
    “什么子”比如论语：孔子见老子，孔子曰了什么，老子曰了什么。'
