  md: '# 一个老板，必须是一个心理学高手


    什么产品可以赚取暴利做一个直指人心的产品。 根据马斯诺需求层次理论，这个人 类的需求，依次是先满足生理


    需求，再满足安全需求，再满足社交需求，再满足尊重需求，最后满 足自我实现需求！


    马斯诺的理论与，前一级需求被满足，人们才会诞生下一级的需求。


    意思就是，你饭都吃不饱，肯定是找饭吃，不会想到找女人，所以中国古话讲，饱暖思淫欲，先有饭吃，能穿的好，才想找配偶交配。 所以，人类的基本需求，就是吃饭加交配。


    这个理论，我们可以运用到商业上，到底做什么样的产品最有市 场。读懂这个理论，你就能设计好你的产品，赚取暴利。


    首先把这个理论进一步进化，需求，并不代表市场，有购买力才 能形成市场，有需求才只是会让人产生购买冲动。


    如果目标的购买力已经满足了上级一需求，那么我们就可以认为 目标已经产生了下一级需求。


    相反，如果目标的购买力只是以满足是基本需求，即使他有更高的 需求，我们也不认为更高的需求已经诞生了。因为更高的需求，他买不起，就像一般的打工仔也想要跑车，可是他没有购买力一样。


    另一个方面，将需求对应欲望更容易理解判断。 我发现，人的需要都诞生于基本欲望，而所有的欲望都追述到“生存和交配”上，这两个欲望衍生出了其他一切欲望。 举个极端例子，一个人追求超脱，无欲，修道。其实也是正


    为有欲望，得不到满足，所以他才去追求化解这种欲望。'
