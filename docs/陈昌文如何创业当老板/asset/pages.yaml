    # 吹牛逼，老板必修课


    老板的必修课，吹牛逼和扯淡，做互联网生意可用，做实体生意也可以用，切忌这招勾函，功力不够批量着模仿，我们做生意呢，别违法，只套取无形资源，不要用这招套取别人的有型资源，切忌切忌。


    听我的节目呢，要学会变通，不会变通的人是做不了生意的，这也就举一反三。


    每个行业都有一个圈子，我就说我最熟悉的互联网吧，互联网草根圈，其实也有一个圈子。这个圈子里的人几乎都相互有所耳闻，其实你也可以主动去找这些人，互联网的存在，让你很容易就能找到这个圈子里的任何人。


