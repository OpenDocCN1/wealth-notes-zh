  md: '都没事做，但是第二个月事情多，又要连续加班，这个时候，她就会 有情绪。有时候，她白天没事做，但公司的业务是晚上 8 点接到的，需要打合同，她下班了，而营销部就等着这个合同要签约呢！难道又
    要把事情推到明天上午吗？再比如公司的司机，什么时候出车说不清 楚，怎么可以学事业单位，国有企业，定岗，定责？


    那么到底怎么玩？其实非常简单，告诉你公司里，每一个来上班 的人，说，大家来公司，就是完成公司的目标，你是文员，就是要 完成打好合同这个目标，这个目标没完成，就是你没尽到责任。告诉
    司机，你就是来开车的，帮助公司完成需要开车的任务， 目标与任务什么时候出现不一定，但是出现了就要解决。公司的设计部，营销 部，财务部，生产部，都这样做，这个理念要灌输给每一个员工脑袋
    里。


    公司要弱化岗位责任制这种操作方法，只要目标出现了，大家就 赶快配合起来完成，这才是一个灵活团队，有竞争力的企业。


    不要扯什么以人为本，目标完不成，事情做不好，企业就要倒闭， 饭都没得吃，比如，有些司机，他拉货给客户，到了客户那里，也不 帮客户搬货，老板问他为什么不难搬货，他说他只负责开车。其他的不
    管。这样的员工，其实就是老板自己培养出来 为难自己，得罪客户的。这样的员工多了，企业毫无竞争力。你需要找一个能帮助顾客搬 货的司机或者培养司机这样做， 事情做不好的人，直接开除。


    物竞天择，适者生存。各位老板赶快把公司的岗位责任制这套制 度换成目标责任制，以市场经济的经营理念代替计划经济，政治经济 的经营理念。并且把这套思想灌输给每一个员工。


