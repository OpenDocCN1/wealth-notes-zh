    # 如何让员工变成上足了发条的赚钱机器


    总体来讲，就是要做到员工价值观单一化，让他们脑袋里除了赚 钱，啥也别想了。前面有一期节目，我讲过秦国的农战制度。这是秦 国发展成败强的根本原因，也是他一统天下的根本原因。商鞅让秦国
    人都变成了杀人机器，他怎么做得呢？四个字，利出一孔。战国时期， 商鞅在《商君书》中提出 “利出一孔”的思想。这个唯一的孔道，就 是“农战”。除 此之外的商业、娱乐等事项，尽在禁除之列。他的商
    鞅变法，就是以“利出一孔”和“驱 农归战”为中心思想。


    什么意思呢？就是只有杀人才能升官，才有尊严，才有钱花，才 有女人。不准搞商业，搞娱乐，不准读书。打击革除了杀人以外的任 何手段升官发财的人。这就叫利出一孔。当然，利出一孔最早是管
    仲提出来的。管子曰：利出于一孔者，其国无敌；出二孔者，其兵


