  md: '几亩土地就可以养活一家子。


    养活一家人的土地从几平方公里减少到了几亩土地，这就进入了农业社会，不过，这一时期，人类的财富还是主要跟土地有关系。谁 能拥有更多的土地，谁就能拥有更多的财富。


    随着科学技术的发展，人们利用自然资源的能力越来越强了，不仅仅会利用土地种植，还会利用地下的矿石，化石燃料，如煤炭，石油。还发明了各种机械，人类进入了工业时代；这个时候，人类的财富跟这些煤炭，石油，机器挂上了钩。石油的涨跌直接影响到了经济的涨跌，而且，美国的美元都是跟石油挂钩，这一时期，谁会利用机械，机器，工厂，谁就能拥有了财富！


    当然，未来的 10 年，20 年，以及现在正在发生的情况是，机械与土地与财富的关系会越来越弱化，那么什么会成土地，机械的替代品。与财富挂钩呢？这其实就是我们年轻人创业的方向答案很简单，大家看看中国最富的几个人是谁？马云阿里巴巴，李彦宏百度，马化腾腾讯，京东商城，世界上最富的人是谁，比尔盖茨，马克，扎克伯格，拉里佩奇。特斯拉电动汽车,苹果公司。这些公司是干啥的？明显他们是知识经济与信息经济的结合体。也就是说，这个时代你拥有知识，拥有信息就会与财富挂钩。


    下面给大家讲个简单的故事，大家就知道自己要赚钱，应该向那个方向发力了。


    一个日本工厂的一台印刷机坏了，自己的工人修了几天也没有找 出问题，维修师傅最后不得不告诉老板，自己的能力实在是没有办法 修好这台机器。


    日本老板于是请来了一位美国工程师帮助解决问题。美国工程师在机器旁边看了看，便拿粉笔在外壳上划了一条线，并对老板 说：“打开外壳，在画线的地方检查一下。”工人按美国工程师的指


    导操作，果然很快地发现并解决了问题。日本老板问美国工程师要多少报酬，工程师开口要 1 万美元。日本老板不服气地问：“你只是在 机器上画了一条线，就值 1 万美元？”


