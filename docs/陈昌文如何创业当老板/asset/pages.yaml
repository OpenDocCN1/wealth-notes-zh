    说起林彪，我就想起刘伯承与邓小平。刘伯承同志是一个非常细心的人，细心到每个士兵穿鞋，穿衣服都要管理，而邓小平同志是个大格局的人，其实刘伯承与邓小平在一起，就有些意见不合。但是呢，也相互弥补对方的缺陷。后来，邓小平能够做出改革开放这么惊天动'
