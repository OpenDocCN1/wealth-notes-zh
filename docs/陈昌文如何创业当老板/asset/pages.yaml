  md: '# 成功的创业经营理念


    # 建立公司管理制度的大原则


    很多创业者都不知道如何把公司正规化，今天我就来讲讲这个问题。


    不需要很多，就 4 条，你把我讲的这四条写出来贴到公司里执行， 公司就会正规化。


    +   1，行为规范：必须让员工知道我们提倡什么，不提倡什么，禁止 什么。比如迟到，早退，请假你都可以明确规定不提倡。


    +   2，激励机制：明确写出来什么样的表现能得到报酬与晋升，明确 按照制度来晋升。什么样的结果与行为会得到罚款甚至淘汰。


    +   3，写出来我们公司到底需要什么样的人，并且用合理的手段挑出 这样的人来做榜样。榜样的力量是无穷的，对榜样给钱，给职位。伟 大领袖毛就经常树立榜样。就能带动一大帮人跟着学。


    +   4，规定清楚我们如何做业务，要达到什么样的目标。 要让大家知道公司的目标，这个东西，老板要天天讲，公司的规


    范也要天天讲，老板讲完，领导讲，领导讲完员工讲， 并且还要分组




    讨论。 对遵守公司规章制度的人一定要有奖励。对犯错误的人要有惩罚，'
