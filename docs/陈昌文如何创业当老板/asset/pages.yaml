  md: '怎么办呢？学会放弃。你想说服别人，谋一个利益，但如果对方跟你找不到共同点，那就放弃，不要志在必得，弄得巧舌如簧。你想教化某人，引他上进，他跟不上，你也要放弃，孔子也不能把子路教成子贡或颜回，人跟人不一样。


    所以不失言，首先不是技术问题，是个态度问题。态度端正了，就不太容易失言，也不会把自己搞得很贱。


    接着补充讲一下不失人。不失人，这要求比不失言高太多了！不失言，大不了我不说话就是了，有人天生就不失言，因为他性格就不爱说话。但不失人，要求你该说的话一句也不要错过，该说话的人一个也不要错过。


    举个轻松一点的例子，你在地铁上看见某姑娘或小伙，一见倾心，却没有鼓起勇气上去要电话号码。之后魂牵梦萦，第二天到处做微博信求转发要找到他（她），这就是该说的话没说-失人了。


    因为一句话没说，面对面你就失去了他（她）-或者是爱人，或者是能决定你命运的贵人，或者是能辅佐你做大事的人才，或者是能与你一起成就的伙伴-岂不可惜！


    人的见识，深浅不同，我该不该跟他说话，说到什么程度，就要因人而异。如果他造诣精深，事理通达，我却没跟他说话，那是我没有知人之明，错失了人才！君子就听一句话，就知道他是不是那人，明不明白那事。是与不是，明与不明，就在一言之间。所以遇到能跟他说话的人，马上就要说，才不会失人啊！


    高手过招，就是一句话，这句话你没说，就错过高手了。




