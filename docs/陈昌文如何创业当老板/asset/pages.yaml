- pgno: 245
  md: '晚五，习惯了升职无望，习惯了同事每天晃 在眼前的炫耀，甚至习惯了妻子每天在身边无休无止的抱怨。你依旧 不可逃出被欲望驱使的魔咒。


    因为欲望驱使，有两重含义：向上的欲望驱使是让人愉悦的。这 样的欲望多种多样，有人喜欢权势，有人喜欢金钱，有人喜欢美女， 有人喜欢精神满足。向下的欲望驱使则是相同的，那就是恐惧，逃避
    伤害和死亡。


    当欲望想要牵着你的时候，也许你可以对着金钱、美女、权利微 微一笑，毫不动心。但你不一定能够顶得住恐惧的欲望比如：辣椒水和 老虎凳，剥皮。


    当欲望如鞭子般驱赶你时，或许你铮铮铁骨，横眉冷对，但也许 你抵不住美人指尖轻轻划过你胸膛时的舒痒。


    那么，也许你是顶天立地的硬汉子，软硬不吃。可是我们用上 面的手段攻击你最亲爱的人呢？比如你的老婆，孩子，父母。你有保 护你亲人的欲望，就会被我们说服。


    Ok,如果你还不服气，那我们就放张大招，这也是宗教的大招，颠 覆你的信念，请一个理论高手，洗脑大师来颠覆你的信念。


    揭穿令你坚持到底的信念不过是个骗局而已呢？ 由此，我们知道，任何一个人都可以被改变。这也是说服术的精


    髓。凡是明白此道的人，就可以说服大多数人。创业者必须天天研 究说服术。你说服的人越多，就有越多的人加入你的团队，有越多的 人买你的产品。


    创业商学院 为创业人服务 291


    一个人只要有欲望，就有方法能说服他，除非他是死人。


    生而为人，必受驱使。


    # 生意再小都要招员工才是老板思维


    生意再小，就算刚开始创业的时候，都要招聘员工，哪怕只是一 个。'
