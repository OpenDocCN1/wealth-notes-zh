  md: '# 第四章


    如何做个赚钱的老板


    # 把自己的思想灌到别人脑子里的原则


    孔子说：“可与言而不与之言，失人；不可与言而与之言，失言。 知者不失人，亦不失言。”


    什么意思？可以同他谈话，却不同他谈，这是错过人才或错过值得交往的人；而不可以跟他谈话，却同他谈，就是多余了。知者，也 就是有智慧的人，既不会失去人才或值得交往的人，也不会失言，就
    是与人多谈。一是自己不要失言，不要说错话，二是不要让对方失 了 你的言，不要让对方不重视你的话，错过你的话，或轻视你的话。一 般我们对前一方面比较晓得些，对后一方面就很不注意，因为一厢情
    愿。


    现在人不是常说吗，最了不起的是两件事，一是把自己的思想灌 到别人脑子里，二是把别人的钱掏到自己口袋里，这两件事往往联系 在一起，而你一旦怀有这样的目的，心不诚了，不考虑别人，就适得
    其反，反而把自己的话搞贱了，人也搞贱了，成了贱人了，划不来。'
