- pgno: 246
  md: '我们创业呢，首先要弄清楚，老板到底该做什么事。老板是完全不同于员工的一种生物。至少是思想上，所以，如果你以前是打工的，那么现在要做好改变思想的准备。


    老板该做的事，就是弄清楚该做什么。这听听起来是糊弄，是扯淡。其实却是正确答案。


    有句话叫，“只有想不到，没有做不到。”这话有争议，有争议就先搁置在一边，我们不争。但是另一个说法就肯定没争议了：“只有想得到，才能做得到”。如果你当老板，很多问题你都想不到，那么这个生意也就做不下去了。当老板，实际上要注重“想”这个字，而不是去干活，干活是员工的事情。


    创业最大的问题是，很多人根本不知道他们该干啥。他们经常说我知道，“我知道！我要创业，但我不知道怎么办”。


    表面上看，他知道该干啥，只是不知道該怎麼做。实际上，他仍然不知道该干啥。


    进一步思考一下，你是要在传统的生意里面去选一个来做，还是打算尝试点新鲜的行当，比如移动互联网营销等等？




    再进一步思考，究竟是要去卖烤全羊，还是要去卖手机软件，或者做互联网文化传播，或者做个自媒体？


    如果是卖烤全羊，你是要选择在城郊卖给那些比较有钱，开车来吃饭的，还是要选择在城中心，卖给普通大众？我们要选择多大的场地？进行何种装修？配备多少人？开业要不要做广告？老客户要不要发发卡打折。如果是做自媒体，你是要讲笑话呢、还是要讲商业财经，你是要采取文字的形式呢？还是语音，视频的形式。


    这样一步一步的追问下来，你会发现自己的问题其实真就是：不知道该干什么。而不是不知道该怎么干？这个区别相当大的。老板与员工的一个重要区别就是，老板要开始把握方向，而员工负责完成老板布置的具体任务。一旦你每一步都知道干什么，具体下来之后，往往你已经知道该怎么做了。


    比如问题具体到了是要用一次性筷子，还是要用消毒餐具？到这一步，执行起来已经非常容易，不管你选择哪种，一次性筷子到哪去买，消毒餐具用哪家的？是个人都能做吧？只要你知道该干什么了，你就只需要布置任务让员工去实现这个任务，而实现任务怎么做，是员工的事情，与老板关系不大。


    题外话，工业革命，经济发展，人类进步，其实就是得益于“分工”，拆开流程之后，超级'
