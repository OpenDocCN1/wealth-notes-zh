  md: '如何逼你的员工成长 我们很多老板为什么累？就是什么活都自己干，交给员工又认为员工办不好，最后还得什么都自己上，长此以往，员工没有成长，团队没有成长，老板累得跟狗一样。公司还是没有壮大。


    如果你想要公司快速发展，那么必须逼迫员工成长，只有团队成 长了，企业才能发展。


    创业商学院 为创业人服务 185


    那么我是怎么做的呢？ 第一：碰到任何问题，我都不会直接给答案，而是问当事人怎么办？就算当事人来问我，我也不会给答案。但要求他把解决方案给我。 他没有办法，只好去想如何解决问题。


    第二：当我拿到一个解决方案的时候，就算我很认可了，我还会 继续逼他再拿两个方案出来。强行锻炼他的脑袋。


    第三：当他把剩下的两个方案也给我的时候，我会与他讨论他给 出的三个方案，找出优缺点。然后我会给出我的解决问题的方案，让 他提出意见。最后选择一个最优秀的方案去执行。


    第四：当员工能力还不足以应付如何解决问题时，我会做决定如 何去解决，他负责执行。当他的能力不断提升的时候，我就会尝试着 让他自己去解决问题了。这个时候，我就做甩手掌柜，只看最后结果
    了。


    我用这套方法来管理团队的时候，员工的成长速度非常快，我也 是越来越轻松，就又精力去做更多的事情，管理更多的团队。


    # 培养与选择优秀员工的手段


    我们当老板的人，要把 80%的精力都放到优秀员工身上，因为企业 的利润 80%是优秀的员工创造的，大部分老板的精力老是被有问题的员 工所吸引，这样，企业就没办法发展了。


    什么样的员工是优秀的员工，我们是有方法去挑选的，在企业里， 如果员工不为老板着想，是不会提出什么意见与问题的。这种人当然 是直接不考虑给他机会，还有一种人，会不断'
