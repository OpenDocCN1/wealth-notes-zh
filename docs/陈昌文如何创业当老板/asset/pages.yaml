    是为了低价策略服务的很多策略组。这些策略串起来形成一条核心竞 争链条，这个时候，战略就形成了。也就是说，战略其实是选好一个 优势点，然后不断的优化出来的整体效果，是不是有点复杂？那么我
    给大家举个例子。比如沃尔玛的创始人，老沃尔玛，有一次商品打折， 反而营业额暴增，赚了不少钱，他就意识到了“低价”的威力 ！


