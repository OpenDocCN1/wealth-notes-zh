- pgno: 200
  md: '然而当时市场上就《孙子兵法》的体裁特殊，所以《孙子兵法》畅销。也就是说，我们做营销一定要差异化，突出特点。比如，大家都强调价格低，你就别强调你的价格更低了，你要强调你的质量好。当大家都强调质量好的时候，你要强调你的价格的。


    孙武一出来就把 13 篇《孙子兵法》献给了吴王，可以说是找了个很好的广告代理，就比如现在这个社会，找到了微博大 V 或者意见领袖帮你传播你的产品。但是吴起在这方面，不知道他做了些什么！


    第三、广告长短的设计。《孙子兵法》与《吴子兵法》可以说在军事理论上平分秋色，但


    《孙子兵法》短短 13 篇就搞定，《吴子兵法》长篇大论了 48 篇，我在想它之所以失传了 42 篇，大概是在把那书写在竹子上的年代，读书人在搬家的时候觉得麻烦就留下短小精悍的《孙子兵法》，把长
    的，文采不是很好的，自己又不太愿意多读的《吴子兵法》扔了吧！ 所以，我们做广告一定要短小精悍，太长了，力争让用户一下子就记住。


    第四、树立良好的公众形象。吴起的绯闻是从小传到大 的，吴起杀妻求将，弃母求官，小时候


    在家乡还杀人。一上来就给人一种不仁不孝的形象！当然买他单的人 很少了。你们看聪明的商人都喜欢做慈善，义卖，建立希望小学，建立医院，这都是为了给自己树立良好的公众形象。就连那些做传销的，也成天宣传他捐款给贫困地区！




    由此可见，孙子比吴起会做营销。整个世界都在读《孙子兵法》， 而《吴子兵法》可能中国的文化人都有很多不知道这本书的， 这 就直接证明了孙子比吴起会做营销。所以，我劝老板们常常读读《孙子兵法》。日本软银集团那个孙正义就是成天读《孙子兵法》，并且
    把《孙子兵法》做成了公司的企业文化。


