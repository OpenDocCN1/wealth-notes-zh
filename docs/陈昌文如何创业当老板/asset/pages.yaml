- pgno: 162
  md: '你发了工资出去, 就必须要有相应的收入。你可以用奖金激励员工，但不可以宽容与忍让。


    能把企业做大的老板，都是恶老板。慈母多败儿，严师出高徒。我们在网络上，杂志上看到的让员工快乐的工作，给员工咖啡，宽松的工作环境，误导了很多新一代的创业者。公司是不可能轻轻松松取得好成绩的，你真以为你的智力比我们这些刻苦拼搏的团队聪明吗？


    就算有个好方法，也是我们这种人先发现。所有成功的人，都是投入大量精力，刻苦工作的结果。比如，写


    富爸爸那个罗伯特清崎，他的花了10年的时间才在教育人们财商方面有所成就的。


    赚钱的核心是不断的去找新的赚钱机会，渠道，不是节约钞票，而是用你仅有的钞票去买机会，去测试，量入为出是穷人的思维，富人甚至有借钱思维。贷款思维。穷人一直在节约，结果越来越穷。


    富人做生意，卖的是体验，而有钱人，本来物质已经丰富了，他愿意买的就是体验，就是精神性的东西。所以，我建议想赚大钱的都卖精神性的东西。比如教育，培训，看那些最暴利的行当，比如迪士尼，比如游戏领域，比如现在的主播，约炮工具，其实都是精神性的产品，成本低，且暴利。


    无钱是不可以浪漫的，浪漫是有代价的。能营造浪漫，就有钱赚。聪明的老板，只与优秀的同事在一起聊天说话，布置任务让优秀


    的人去完成。任何事物，都要养成主动跟踪，检查的习惯。你把一个事物交给


    员工去做了，如果你不跟踪，他就可能不做或者搞砸。老板要学会指导方向与跟踪员工。把不优秀的人全部开除，加大招聘力度。公司有了优秀的人，业绩自然上去了。实行末位淘汰制，形成竞争机制。在资金允许的情况下，快速扩大规模。


    有了人，各种事情才好办。公司的人必须要富裕。人多力量大，人少了，每个人都认为我牛逼哄哄的，本来没那么有能力的人也在老板面前耀武扬威。要形成离开了谁，公司也能运作良好的理念与事实。


    节约是最大的浪费。穷人认为对的理念很多时候都是阻碍其成功'
  merge: -1
  img_proc: true
- pgno: 163
  md: '的理念。不懂，就算卖命工作，也只能贫穷。 节约会让人没有斗志，心量狭小，并且看不到机会，也找不到机


    会，会让富贵的人远离他。 你请的义工或者顾问，如果不能把你教得更聪明，或者，你吩咐


    的事情，他们总是找借口，那么就开除他。别手软。心地善良迎接来 的只是变本加厉。


    尊重自己的时间，人都是尊重自己，才有价值，才有地位，才有 前途，别人就不得不尊重你了，尊重，是用实力赢来的，不是寄希望 于别人讲礼貌，别人素质高。尊重是因为别人不敢不尊重你，凯撒说
    过，与其让别人爱你，不如让别人怕你。爱你，尊重你，可以背叛你。 而怕，是胜利者的终极武器。


    # 不要接受道歉，要逼让对方解决问题


    做为老板，经常碰见员工犯了错，就跑过来讲，老板，我把什么 什么事情搞砸了。老板，对不起，我迟到了。老板，你要的文件我没 写好，对不起。


    通常，没有水平的老板就会说，算了，没写好，下次早点写好。 或者问员工，到底是什么原因没写好啊？


    员工知道你要问他，把早就准备好的答案回答给你，你听了，一 般就是安慰一番，让他下次注意。还觉得自己心胸宽广。


    比较温柔，有人情味的老板，通常是没有效率的老板，害人害己。 实际上，我们应该不接受任何道歉。应该逼迫他弥补他的错误,


    并且要求他承担损失。


    迟到了，该罚款的就罚款。任务没完成，该扣奖金扣奖金，该扣 工资扣工资。他胆敢把公'
  merge: -1
