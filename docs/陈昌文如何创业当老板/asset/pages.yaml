    # 如何提高自己的逻辑思维


    经常回答别人的问题，多写文章，逻辑思维就会越来越强，严肃 说，语言文字的逻辑就是大脑的逻辑。


    写文章和说话有共同之处，都是一种门槛极低，但是做好极难 的事。大家都能说，都能写，但为什么有些人说得好写得好有些不行？ 因为它就像搭积木一样，规则超级简单，但是能够组合出什么来，这
    确实是依据大脑的逻辑性，想象力这些东西。


    提高文章的逻辑性，实质是要提高思维的逻辑性，我个人的经验 如下：


    多读逻辑性强的书，当然逻辑本身是一个学科，除此之外，逻辑 性最强的学科是数学。


    你看我解一道数学题，一定会用到逻辑；而证明一道数学题， 证明过程一定是逻辑严谨的。所以如果怀疑自己的逻辑思维弱，一定 要恶补数学，我读完大学了，没事的时候，还买两本高中数学书做做
    数学题，为的就是锻炼自己的罗辑思维能力。


    其次是多读一些逻辑性比较强的书，我一向比较推崇欧美发达国 家的，比如美国，英国，德国，这三个国家的人写的书，只要是被称 为经典的，不管是哪个方面的书，结构性逻辑性都特别强。你读逻辑
    性强的人写的书，你的逻辑性自然也会得到训练。


