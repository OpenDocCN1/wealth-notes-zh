  md: '就是能够飞在前面，是因为你有这个能力，所以你成为领头雁。当你没有能力的时候，就自己主动退下来。领头雁的位置不是终身制的，它是靠自身的能力来决定的。


    但是领头羊就不是。领头羊一般都是被任命的。领头羊和领头雁的区别在于，首先，


    大雁对自身体能的感觉能力是非常敏感的，而领头羊并不具备这种敏感性。然后，羊群之间并不进行信息沟通，但是大雁飞过的时 候，我们总能听到雁叫的声音，它实际上是在发送沟通的信号。这是一种信息的沟通，能够让大
    家步调比较一致，甚至还包含有：我不行了，我现在要调到前头，或者调到后头 等信息。它是雁阵里一个很好的信息沟通系统。


    但是在羊群里，领头羊是谁的个头大，体力好，谁就当老大。一旦做上领头羊的位置，就一直是领头羊了。就算能力下降了，大家也习惯了，是一种终身制。最后，这只领头羊没有能力带领大家向正确的方向走的时候，他依然还是领头羊。经济学上有一个羊群效应，即


    创业商学院 为创业人服务 169


    一只羊往哪走，后面的就会跟着走，这就有走错路的可能性。所以羊群之上还有牧羊人，需要它们协助牧羊人让羊群走到正确的路上去。所以领头羊并没有领导力，而领头雁是先有领导力，再成为领导的。


    如果我们把一个团队视为一个生物群体的话，有的组织就是一群羊，有的组织是一群雁。


    我们当老板的要打造大雁一样的团队，选择领导，要选领头雁，而不是选领头羊。


    你之所以能做领头雁，是因为你在那一刻最有能力，并且最愿意冲在前面，面对 了最大的空气压力和阻力，愿意去承担责任，于是大家就让你做了领头雁。


    而且你同时具有方向感，向羊群一样乱跑肯定是不行的。所以有方向感，自己 有本领，有能力是作为一个领导者必须的素质。


    现代社会竞争激烈，我的团队一定是让有能力，业绩最好的人担任领导，先有了领导力，才有领导的位子。我自己不行会立马下课。让最有本事，业绩最好的人 来指挥整个组织，没有谁现在是领导，一辈子就是领导的说法，根据实际情况，立马调整。这样的组织就有智慧了。'
