  md: '# 什么叫做智慧型组织


    我们当老板的人，要特别注意，领导与领导力是两回事。领导 的权力来自于他的职务，在企业里的位置。领导力的权力来自于与他的 见识，为人，真功夫！


    领导往往是任命的。而领导力是靠自己的本事赢得的，比如，你 想成为总经理，那么你 得先有总经理的能力。如果你没有总经理的能 力，就算你被任命为总经理，也是不长久的，你在这个位置上待得越
    久，对自己和企业都是一种灾难。


    给大家讲两种动物。一种是大雁，就是网上经常说，一会儿排成 S


    型，一会儿排成 B 型的天上飞的动物，不过，他们真实的情况不是排 成 S 型，B 型，而是人字型。大雁飞的时候。里面有一只大雁，叫领头 雁。一种是羊群，羊群里面有一只体格健壮的领头羊。


    如果你只是一头羊，可能会你被称为所谓的领头羊，但是实际上 你并不能真正领导一群羊。只有牧羊人才拥有这个能力。


    我们应该做领头雁，而不要做领头羊。按照我们通常的思维，领 头雁就是这群雁里的首领，它率领大家飞行。然而事实不是这样的， 雁群是一起飞飞的，起飞的位置有前有后，大雁对空气的阻力、对它
    自身的体能，都会有很好的感知，所以一旦形成某种格局的话，一只 大雁在前面飞，后面就会紧挨着跟随。


    它们会自行调节，使飞行过程当中的空气阻力最小，然后逐渐就


    排成了“人”字形。在飞行的过程当中，后面的大雁飞行是比较省力 的。首先，它所处的位置空气阻力小，其次，有一个回流会推动它。 这些因素看起来非常微小，但是对于长途飞行的大雁来说，能节省任
    何一点体力都非常重要，因为它们还有很长的路程要飞。


    领头雁是偶然产生的，起飞的时候，它飞到前头去了。 并不是固定某一只雁。 领头雁它不是固定的任命，它就是头雁，领着大家飞。它飞到一


    定程度，如果觉得体力不支了的话，会自动的放慢速度，后面的大雁 就会替补上去，成为新的领头雁。简单的说，即领导力，能力是第一 位的，第二位才是领导的职位。'
