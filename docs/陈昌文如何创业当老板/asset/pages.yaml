    首先我们要明确一点：我们出来创业，做生意，目的就是为了赚 钱。不是与人搞政治斗争的，我这个人从来也没有精力陪谁玩政治斗 争，简直是弱智玩的，我要赚钱。你喜欢斗争，你回家与你老婆斗去。
    企业就是大家在一起，分工合作提高效率赚大钱。


    我喜欢从战争的角度去看商业。战争其实就是为了利益，商业的 目的也是为了利益，只是形式不同罢了。


    战争与做企业，都是趋利避害的，战争不是以杀人为目的，因为 杀人是要付出代价的，杀敌一千，自伤八百，最好能直接让敌人投降， 就是给对方讲清楚投降我有什么好处，不投降我有什么坏处，让他投
    降，达到不战而屈人之兵的目的，财产与人都归我，我不付出成本最 好。


    不战而屈人之兵给我两条启示： 要做就做零成本的生意，不付出成本。 不要搞斗争，因为斗争会让自己消耗很多资源。所以，我也希望


    我的企业的人事关系非常简单，大家都是来赚钱而已。政治斗争会给 企业带来相当大的内耗。而怀有二心的有能力的人，他的动机不纯， 不是一心一意为企业赚钱，他会给企业带来相当大的成本，相当大的
    内耗。


