    这些人非常年轻的时候，就功成名就。其实呢，未出道之前，可 能读过几年书，但就是因为他们不谦虚，他们狂妄得很，所以，吸引 了注意力，自然就吸引了很多资源。看看现在这个社会，哪些人吸引
    了注意力？哪些人拥有了资源？凤姐，范冰冰，马云，周鸿祎，这些 人是谦虚的人吗？但凡成功者，绝非谦虚之人。偶尔谦虚只是手段， 不可当真。


    # 如何练本事，超越大多数人


    每个人都想过人上人的生活，每个人都想超越大多数人，这就要 求你有本事。而且，你的本事要超越大多数人。


    最好，这个本事是你的爱好，是你的优势，那么如何练习呢？ 在西方有一个军事理论家叫克劳塞维茨，他在西方的地位就如同


    我们中国的孙子一样，他有一部著作叫《战争论》在西方与《孙子兵 法》齐名。


    克劳塞维茨说，战略是任何时候都不能停止的工作，就是说，战 略要时时刻刻的去思考，去优化，去做调整。同理，练习一个优势也 是任何时候都不能停止的，比如，我们老板，今天虽然天寒地冻，但
    我们依然从早到晚思考业务，员工都回家了，但我们依然在办公室里 干活。


    中国古代画家有一句活“搜尽奇峰打草稿”，就是平时每看到一 山一河，一花一草，心里都在打草稿，思考怎么作画，如此，真正作'
