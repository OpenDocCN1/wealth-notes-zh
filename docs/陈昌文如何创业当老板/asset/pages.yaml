    身体，知识，事业，构成了一个人混社会的三角关系，任何一点 的提升，都会对剩下的两 点提供一个更好的台阶。任何 一条的倒退， 也会让你的另外两点弱化。


    仔细分析与思考， 最终得到的结论就是，我们需要并重这三条，




    才可以顺利的向社会上游阶层游动。


    # 企业必须重视制度建设


    这几年，国学、传统文化受到了广泛的重视，很多地方都轰轰烈 烈掀起了国学热，这是个 好事情。与此同时，像传统管理思想、国学 管理思想等，也流行了起来。中国文化很注重
    感情管理，比如 “疑人 不用，用人不疑” 就属于感情管理。毫无疑问，用这种方式管理企 业 是走不下去的。


    在企业管理上，在道德层面假定善意，但在制度层面假定恶意。 这是什么意思呢？我们假 定善意是指以善意与别人相对，这个是在道 德层面的。而这个制度上假定恶意是指在未来
    出现问题时明确监管出了 问题后按照这个制度去解决。


    任何事物都有两面性，人也是，每个人都有善的一面和恶的一面， 企业管理，也必须恩威 并施，实际上，这个地球上的任何事，我们都 要从阴阳的角度去处理。一个人是老是坏，
    是天使还是魔鬼，也是我 们自己的善恶相互博弈后的一种形式上的体现。我自己也是，有 好 的 一面，也有恶的一面，但是我会去抑制自己恶的部分。我们生存得社 会充满各种欲望
    和诱惑，你无法保证你的部下全部是天使，或者， 他们 曾经是天使就能永远是天使吗？从


    ![](img/e51ccfd5c34d83bb3b6c567930d247c4_220_0.png)'
