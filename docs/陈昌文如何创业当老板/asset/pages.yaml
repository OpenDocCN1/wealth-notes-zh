  md: '第一招：到任何地方，见到任何人，任何事情。不要感叹，不管 是好的还是坏的。比如，你见到一个企业的老板非常的年轻，但事业 已经做得很大了。不要感叹他了不起，也不要感叹自己没本事。又比
    如我们看电视，伊拉克又在打仗了，你不要感叹哪里的人民生活真辛 苦，也不要说什么，他们能赚钱，就是靠石油。因为，人一会学会感叹，脑子就不运动了，智商就降低，感叹完了，该学别人的没学到，我们
    是一个商人，每时每刻都要以商人敏锐的眼光去看待一切。


    看看你接触到的人，事，物有没有值得借鉴的事情，把他沉淀出 来，然后运用到自己的企业上，而不是出去感叹。人的思维不一样， 就算是同样的事，物，看到的结果也是相差十万八千里的，所以，我
    建议想做大小商人的人，从现在开始，只用商人的眼光去品味世界。


    你见到一个年轻有为的人，你就不要感叹他多厉害，你就要想， 他是靠什么把事业做出来的，他有哪些优点可以借鉴过来，我能跟他 合作什么，等会，我与他探讨什么话题。这，就算进入商人的思考模
    式了，感叹是平民的基本行为，快速摒弃。


    就算你见到地震了，也不要去想，这些人多苦啊，天老爷怎么这 么狠。你唯一要想的就是，这些人需要啥，我能搞点什么东西来卖， 一来帮助他们度过难关，二来自己也赚点钱。


    第二招：只抓核心。我们做企业的都有体会，当企业稍微发展大 一点，就发现事情真多，各种各样的杂事。人事啊，销售啊，财务啊， 买什么东西啊，如果当老板的什么都管，企业就进入繁殖期。公司也




    就很难发展了。很多小企业老板，就是因为这一点导致自己做不大。 任何一个企业，其实只有一个核心业务。如果你认为你的企业有好几 个核心点，那么恭喜你，你没有抓住核心。核心业务永远只有一个，
    其他的业务都是支撑这个核心业务的，所以，老板必须找到企业的核 心业务，然后 80%的精力做核心工作，20%的工作对非核心业务进行指 导，让同事去完成就行了。


    第三招：不管碰到什么事情，只想一句话，这个东西对我有什么 用，我怎么才能用好这个东西。只要有这个思维，慢慢的，一切就 为你所用。自然就变成最有智慧的人。


    这三个绝招用好了，对于你来说，将是一笔宝贵的财富。


