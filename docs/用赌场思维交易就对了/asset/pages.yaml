- pgno: 323
  md: '關於多月份績效紀錄，我使用的欄位與月份績效報告相同，但不包含「現金進出」，因爲多月份績效紀錄只用來追蹤「交易」部分的績效。


    # 個別資產的績效紀錄


    個別資產績效紀錄雖然並非必要，但還是有助於瞭解與改善交易偏頗。我個人覺得這部分報告很有用。個別資產績效紀錄採用的欄位，與多月份績效紀錄相同（22 欄）。這份報告的主要功能，是分析資產類別在多、空部位方面的方向性偏頗，以及非理性的風險管理偏頗。


    # 個別交易模型的績效紀錄


    如果採用兩種或以上的交易方法，這份紀錄可以追蹤、比較不同方法之間的表現。這份紀錄也採用多月份績效紀錄的22 個欄位，關鍵是分析每種交易模型的績效穩健程度。


    # 月份績效摘要總彙


    這份表格顯示較長期的績效統計數據，包括以下 22 個欄位。


    +   1. 月份 — 顯示年份與月份資料。

    2. 盈虧毛額 — 顯示扣減佣金之前的每個月盈虧毛額。

    3. 佣金 — 顯示每個月的佣金。除非是搶帽子或當日沖'
  merge: -1
  img_proc: true
- pgno: 324
  md: '銷，否則佣金佔盈虧毛額（第2項）的比率應該在1~2% 左右。


    +   4. 盈虧淨額—顯示扣減佣金之後的每個月盈虧淨額。


    +   5. 交易筆數—這項數據會顯示出交易過份頻繁的警訊。  對於搶帽子或當日沖銷者，這項數據會偏高，但就各  月份彼此之間的比較而言，數據最好低一點。


    +   6. 最大耗損—這是指月份內與跨月份的淨值最大耗損。  *標示月份內的最大耗損數據。


    +   7. 期初餘額—月初帳戶餘額。


    +   8. 報酬率%—代表月份報酬率，由第4項的「盈虧淨額」  除以第7項的「期初餘額」（除非當月份另有存入或  提領現金）。


    +   9. 現金進出—交易帳戶存入或提領現金。


    +   10. 期末餘額—月底帳戶餘額，通常也就是次個月的期初  餘額。


    +   11. 成功交易筆數—當月份賺錢交易的筆數。


    +   12. 失敗交易筆數—當月份虧錢交易的筆數。


    +   13. 平均獲利—成功交易的平均獲利金額。


    +   14. 平均虧損—失敗交易的平均虧損金額。'
  merge: -1
  img_proc: true
- pgno: 325
  md: '+   15. 勝率 — 成功交易佔總交易筆數的百分率，也就是第 11 項除以第 5 項。交易者通常都喜歡勝率高的交易系統，但某些最棒的順勢交易系統，其勝率往往不及
    50%。交易系統優劣的真正關鍵，是盈虧比率（第 17 項）與 W/L 持有時間（第 22 項）。


    +   16. 持有時間 — 部位持有天數。


    +   17. 盈虧比率 — 平均獲利（第 13 項）除以平均虧損（第 14 項）的比率。一般來說，這個數據應該遠超過 1.0，除非系統勝率（第 15 項）遠超過
    50%。


    +   18. 最大耗損% — 這是當月份或跨月份最大耗損金額（第 6 項）除以耗損發生前的帳戶淨值餘額。*標示月份內的最大耗損數據。


    +   19. 持續天數最長的淨值耗損 — 包括月份內與跨月份耗損在內。請注意，最大淨值耗損未必是持續天數最長的耗損。*標示月份內的數據。


    +   20. 月份 P：MD — 這是第 4 項「盈虧淨額」除以第 6 項「最大耗損」的數據，代表交易系統創造月份報酬所承擔的風險。這項數據愈大，代表交易系統愈穩健。


    +   21. P：MD — 交易系統截至目前為止（跨月或跨年）創造之總獲利所承擔的風險。總獲利是指交易系統持續累積的總獲利，而帳戶淨值耗損（MD）未必會隨著時間經過而增加，所以
    P：MD 數據會隨著時間經過而顯著'
  merge: -1
