- pgno: 275
  md: '# 破壞性情緒


    > 自大帶來毀滅，傲慢帶來滅亡--舊約箴言


    根據佛學的說法，煩惱魔這個障礙製造者會展現六種不同的破壞性情緒。這六種情緒分別為：傲慢（pride，慢）、嫉妒（jealousy，疑）、執著（attachment）、愚昧（ignorance，癡），貪婪（greed，貪）與厭惡（aversion，瞋）。傲慢是指我們的優越感；嫉妒是來自於我們希望擁有其他人的東西或素質；執著來自於害怕變動，恐懼喪失；愚昧來自於偏見與妄想；貪婪是因為我們想擁有更多；厭惡源自於對於外界的敵意。


    +   1. 傲慢：傲慢讓交易者不願迅認賠，即使種種證據顯示趨勢已反轉，仍然不願獲利了結。如果我們擔心別人對自己的評價，就會妨礙我們當下採取正確的行動，再也不能客觀體認市場多層面的、不確定的、持續變動的行為。


    **正確作法：不理會他人可能的想法，立即自我調適，面對目前客觀的市況。**


    +   2. 嫉妒：嫉妒情緒會讓別人的行爲（更好的進場或出場價格）影響我們的操作。務必記住，永遠都有某些人，他們的買進價格會比我們低，賣出價格比我們高。問題是：我們是否允許這種無可避免的現實影響我們的'
  merge: -1
  img_proc: true
- pgno: 276
  md: '操作？


    關於嫉妒情緒，我們實際上不可能真正知道別人究竟擁有什麼，只能想像他們擁有什麼。想要擁有別人所擁有的，只會讓我們喪失自己原本擁有的市場優勢。沒有任何兩個人會完全一樣；想要在金融投資領域內獲得成功，關鍵是發揮自己的長處。


    正確作法：不理會他人擁有什麼，我要自行做調適，面對目前客觀的市況。


    3. 執著：執著情緒可能透過各種形式出現，例如：執著於自己正確、執著於成功、執著於確定性、執著於穩定、執著於線性思考、執著於負面情緒、執著於執著、執著於平和、執著於偏見、執著於不虧損、執著於完美…等。愈是執著，愈是缺乏彈性，也就愈不能依據千變萬化的市況做出調整。


    正確作法：排除偏見，根據持續變動的市況做調整。


    4. 愚昧：佛學所謂的「愚昧」或「痴」，是指對於自身或外界錯誤觀點。我們可能表面上承認市場行為是多層面的、不確定的、持續變動的，但如果我們不能有效管理風險，不能從機率角度做思考，那麼我們的行爲還是不符合真實市況。'
  merge: -1
  img_proc: true
- pgno: 277
  md: '交易者自身的愚昧行爲，有可能會透過下列陳述表達：「我又輸了！我真的一無是處」、「我賠慘了」、「我是個輸家」、「我是白癡」等等。交易虧損或判斷錯誤，經常會引發破壞性的自我貶損。


    嚴謹、自律、成功的交易，取決於我們對於自身、成功、失敗與錯誤的定義。交易心理方面的技巧，處理對象並不是交易者，而是交易本身 註 32 。交易成功並不會讓我們成爲贏家；同理，交易失敗也不會讓我們因此成爲輸家。交易並不同於我們，交易只是我們所做的某種行爲。你如果問某人是谁，他通常會告訴你，他從事什麼行業。我們不是一種行業，我們所從事的行業，只是我們所從事的一種活動而已。


    （註 32 ）請參考 Brett Steenbarger 的《從輸椅上操作：交易心理學》（The Psychology of Trading, John Wiley
    & Sons, 2003，寰宇出版，F247）。


    那麼，我們又是誰呢？根據佛學的說法，我們是「空」（empty）。請注意，「空」並不是「沒有東西」。這種說法並不否認我們的實體。這是說我們要超越線性思考，我們是多層面的、持續變動的（就如同市場行爲或任何現象一樣）。


    **正確作法：我的交易並不是我。要超越虛妄的我執。**'
  merge: -1
  img_proc: true
- pgno: 278
  md: '+   5. 貪婪：貪婪是恐懼的相反情緒。非理性地害怕物質缺乏，這種情緒可能展現為多種破壞性行為，譬如：面對不確定環境而產生的草率舉動（而不是該有的謹慎風險管理）、不能獲利了結、不能隨著帳面獲利累積而適當調整停止價位。貪婪總是與害怕懊悔關連在一起，除了害怕虧損之外，貪婪是影響交易者績效的最大障礙。我們曾經在第6章詳細討論害怕懊悔的情緒，並提出種種應對技巧。


    正確作法：交易市場會持續提供無限的機會，不用懊悔過去，也不用擔心不足。


    +   6. 厭惡：萬物都會追求快樂，規避痛苦。這種追求快樂、逃避痛苦的本能，正是技術分析之所以對於交易有所助益的原因，也說明價格為何會有記憶的理由（請參考第1章）。


    厭惡情緒有多種表達形式，譬如：厭惡虧損、厭惡不完美、厭惡不確定、厭惡發生錯誤、厭惡變動、厭惡成長，甚至厭惡市場本身。如果我們不想受這類負面情緒傷害，就應該學習去接受這些情緒。虧損、不確定、變動等，這些都是交易不可避免的現實，我們愈充分接受這些現實，交易成功的機會就愈大。


    正確作法：我承認、並且接受市場行為是多層面的、不確定的、持續變動的。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 執著於虛幻信念


    佛學所謂的五蘊（也就是五陰魔的五陰），分別為：色（matter）、受（sensation）、想（cognition）、行（mental formations）、識（consciousness）。此五者也被視爲障礙，因爲它們也是我執的對象，因此而生虛幻。就交易而言，此五者讓我們遠離多層面的、不確定與持續變動的市場真實行為，轉移到一些我們主觀認定而虛幻的市場信念。


    +   1. 色（Matter, Form）：


    色包含我們內在的實體，以及外在的現象。


    +   2. 受（Sensation, Feeling）：


    受是對境而承受之主觀作用，譬如：愉悅、痛苦與中性。


    +   3. 想（Cognition, Perception）：


    想是指客體能否辨識而言（譬如：叮噹聲、箱子之形狀、桃子的味道…等）。


    +   4. 行（Mental Formations）：


    行包含客體引發的所有心智活動。佛教進一步將此劃分爲外界物體（譬如：書籍、電影等）引發之被動心智活動或想法，以及內 Department 部心智主動產生之心智活動。主動的「行」對於交易者心理影響甚鉅，以致於對於交易者本身和市場性質產生很多錯誤或虛幻的信念。'
  merge: -1
  img_proc: true
- pgno: 280
  md: '譬如說，交易者相信自己對於市場瞭解甚多，已經足以獲致成功，因此而忽略了許多有用的資訊。雖然某些限制（譬如：遵循 1%的風險管理準則）對於交易確實有好處，但有很多主動心智活動是建構在對於市場性質的錯誤信念之上。想要排除這類有關交易市場的虛幻信念，則要隨時記牢市場行為是多層面的、不確定的、持續變動的。


    5. 識（Consciousness, Discernment）：

    識包含眼（視覺）、耳（聽覺）、鼻（嗅覺）、舌（味覺）、身（觸覺），以及某種程度反映記憶與認知的意（知覺）。對於交易來說，過去之虧損或錯失的機會所造成的情緒性痛苦記憶，會干擾我們，使我們不能客觀感受目前的市況。想要排除這方面的痛苦記憶，必須先接受這些與記憶相關的情緒，然後提醒自己有関市場行為的多層面、不確定與持續變動性質，並適當引用賭場典範（本書最初三章已有介紹）。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '# ## 結語


    交易方面的許多偏頗心態，會阻擾我們客觀感知市場實際狀況，侷限我們掌握機會的能力。這方面的偏頗，最主要是害怕發生虧損與恐懼錯失機會，但它仍有可能會透過各種形式而造成影響。本章討論許多技巧，用以協助各位克服那些可能干擾交易的非理性恐懼。若想要排除這些偏頗，關鍵是溫和之道與創造力（細節內容請參考本書第
    12 章），以及堅持。


    一旦察覺某種交易偏頗行爲，就應該立即想辦法糾正，這才是健全心態。問題是，交易方面的偏頗行爲，多數都關連到我們對於自我價值與生存的最深層恐懼。若想要排除這些偏頗，通常需要採用漸進的手段。可是，如果我們發現不能立即而有效的糾正偏頗，往往就會引發挫折或沮喪的情緒。關於這點，我們務必要秉持溫和之道（gentleness）。對自己溫和一點。承認自己的恐懼感，溫和而逐步地尋求解決之道。容我引用一個有關車輛駕駛盤的比喻。設想你的車子需要做車輪重新定位。你並不需要因爲車子老是往右偏而生氣；車輪只要重新定位就行了。不論是做了
    10 次或 10,000 次的調整，你還是要耐心做調整，直到達成目的爲止。同樣的道理，當你察覺某種交易偏頗行爲，就要有耐心地想辦法糾正才對。


    工具都不完美。我們要能接受這方面的缺失，因爲這是我們利用正值期望報酬翻模型所必須付出的代價。'
