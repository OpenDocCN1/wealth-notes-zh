- pgno: 88
  md: '回頭觀察賭場模式：碰到賭客連續贏錢的時候，賭場會如何反應呢？是否會氣急敗壞地關門大吉？當然不會，當賭客贏錢的時候，賭場會奏起震天大響的音樂（或噪音），藉以凸顯賭客還是可能繼續贏錢的期待（雖然莊家享有機率上的優勢）。重點是要像賭場莊家一樣，即使碰到連續虧損，仍然要保持信心。只要擁有機率上的勝算，而且使用適當的風險管理方法，就不該放棄正值期望報酬交易模型。我們要訓練自己像賭場莊家一樣，堅信自己最終能夠獲勝，持續按照交易模型的指示執行交易。這就是所謂鋼鐵般的紀律，也是交易成功的必要條件之一。唯有在一種情況下，可以考慮放棄正值期望報酬模型：有另一套更好的交易系統可取而代之。


    有位專業交易者曾經問我，「既然已擁有一套正值期望報酬模型，爲何還要花時間做研究呢？」我回答，「由紐約到洛杉磯，你可以搭灰狗巴士。爲什麼還要考慮搭飛機呢？」繼續做研究，是爲了找到更棒的交易系統。可是，唯有當你對於新系統有了絕對的信心之後，才能用以取代既有的系統。


    # 紀律與正值期望報酬模型


    發展一套正值期望報酬模型，雖然需要耗費相當多的時間與精力做研究，但這可能還是整個投機程序中最簡單的環節。事實上，本書討論過程中，我們會提供很多這類簡單的模型，做爲進一步研究的基礎。首先，我要強調一點，我說這些模型'
