- pgno: 74
  md: '舉例來說，假定價格波動與價格相關分析的回顧期間爲 1 年。這種情況下，到了 2012 年 9 月 12 日，往後的計算便將不包括 2011 年 9 月
    11 日的資料，因此也就排除了 911 事件當天的影響。


    為了避免有意或無意之間捨棄資料，我們可以把相關資料納入考量。對於離群事件，究竟應該受到多少重視，評估上同時涉及科學與藝術成份，風險經理人除了採用純粹的計量工具之外，也要兼顧定性判斷。


    # 壓力測試


    前文討論 VaR 的過程中，我們強調風險經理人應該儘可能穩健、精準地估算當時與將來的價格波動 / 價格相關趨勢。可是，這方面的工作相當困難，最主要的問題有二：第一，價格波動具有循環性質；第二，價格關係會斷裂。某段期間出現劇烈的價格波動，往往會讓隨後期間的價格波動趨於緩和，反之亦然（請參考圖
    2.17）。由於存在這種循環性質，因此即使是最穩健、最嚴謹的價格波動分析，經常也有不足之處。事實上，風險經理人對於未來價格波動趨勢的估計，往往會站在錯誤的一方。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_75_0.png)


    對於 VaR 模型所蘊含的假設來說，價格關係斷裂也是個嚴重的問題。資產價格之間存在的歷史關連，不只將來可能會斷裂，而且關係斷裂往往發生在最不適當的時候，也就是價格波動最劇烈的時候。關於這點，且讓我們看看
    2008 年信用危機期間的黃金與股價指數表現（請參考圖 2.18）。首先觀察 2008 年上半年的情況，我們看到黃金與股價指數之間維持穩定而顯著的負關連（-0.8）。可是，等到信用危機發生時，由於人們迫切需要降低投資組合風險，因此原本存在的歷史關連就不復存在了。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_76_0.png)


    由於價格波動具有循環性質，價格關連也可能斷裂（再加上實體商品的價格波動存在季節性型態與季節性異常現象——參考圖 2.14 與圖 2.15），這也就是爲什麼
    VaR 模型本身並不足以成爲穩健風險管理工具的原因，也是爲何要進一步採用壓力測試的理由。'
  merge: -1
  img_proc: true
- pgno: 77
  md: 'VaR 模型試圖藉由歷史價格波動率與價格相關性，希望衡量出投資組合在特定期間內、發生某特定水準以上虧損的機率，但實際上卻無法顯示出特定虧損的嚴重性。而透過壓力測試，就可以估計出這類不太可能發生之虧損事件的嚴重性。另外，壓力測試也可以處理價格關連斷裂，並嘗試處理價格波動的循環性質。


    前文提到，VaR 模型的深入討論已經超出本書範圍，壓力測試的情況也一樣，此處只準備做概略性的介紹，說明壓力測試在風險管理金字塔內所扮演的功能。情境分析（scenario
    analysis）是最常用的一種壓力測試。在這類分析中，風險經理人會假設投資組合遭遇某些特定狀況，譬如說利率上漲 100 個基點，或遭逢 2008 年的信用危機。進行情境分析的主要目的，是希望能判定投資組合的哪些部分存在超額風險，應該做出哪些適當調整。


    # 金字塔頂層


    某些交易者初次聽到風險管理金字塔的「管理裁決」（management discretion），往往會讓心中的賭性再度燃起火 花。容我特別提醒讀者，此處談論的是風險管理金字塔，所以任何的管理裁決，都只能用以強化金字塔較底層之統計量工具的功能，絕不能拿管理裁決做為藉口，而放棄或疏忽嚴格的計量管理。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '就字面意義來看，「裁決」顯然與純計量數學模型衝突。因此，如果用以輔助計量風險管理模型的話，管理裁決的方式可能將不計其數，所以此處不可能全數列舉。我們準備藉由例子來說明管理經驗與判斷如何輔助計量模型。2011
    年 9 月 11 日，恐怖攻擊引發市場恐慌。許多避險基金的風險經理人即刻檢視投資組合的 VaR 數據與曝險程度，甚至針對嚴酷的風險狀態進行壓力測試。雖然所有的計量模型都顯示，投資組合的曝險程度仍然處於正常範圍內，但風險經理人最後仍然向首席交易員建議降低風險。


    另外一個例子更能說明管理裁決的含意，同時還能說明經理人如何根據經驗，否決掉金字塔底層計量模型所提供的交易訊號。有人曾經問我，我的風險管理是否屬於 100%
    的機械系統。我表示，我的系統有 99% 屬於機械化性質，但有 1% 仰賴主觀裁決。對於我的答案，他們似乎不太以爲然。於是，我進一步解釋，主觀裁決只能用來降低風險，絕對不能增加曝險程度。我特別舉了個例子來說明：2010
    年 9 月份的 CME 小麥期貨（請參考圖 2.19）。


    2010 年 8 月 5 日，小麥期貨收盤漲停。隔天，2010 年 8 月 6 日，盤中價格一度幾乎漲停，但隨後價格拉回而跌停收攏。2010 年 8 月 9
    日，價格繼續殺低，引發交易模型的賣出訊號。如果根據純計量的交易法則，當時應該賣出小麥期貨，但最後我還是以主觀判斷否決了純計量的賣出訊號。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_79_0.png)


    # 風險管理金字塔的優點與缺點


    本章討論的風險管理金字塔，涵蓋了相當廣泛的工具，包括：停損、部位設定、價格波動率、價格相關等較低層管理工具，再輔以最頂層的主觀裁決。每個層級的工具都有缺點，但可以藉由其他層級的工具來彌補。


    前述金字塔雖然是很穩健的風險管理模型，但畢竟不是萬靈丹，只能做爲進一步建構的基礎。這套模型的統計量工具可以透過主觀裁決做爲輔助，但我故意不談論主觀裁決介入的次'
  merge: -1
