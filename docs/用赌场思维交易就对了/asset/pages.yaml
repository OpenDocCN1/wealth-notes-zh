    至於出場方法，同樣可以運用多種工具，包括第 6 章所談論的分批獲利了結。此處準備運用另一種出場機制：當 5 分鐘走勢圖的 RSI 讀數向上穿越 75 即出場。這發生在下午
    2：20，賣出價格為 $26.26（參考圖 7.12）。


    # 時間架構背離交易


    我以為，順著長期趨勢發展方向進行交易，通常都是不錯的做法，但有一種低風險 / 高報酬的珍貴工具，我稱其為「時間架構背離」（timeframe divergence）。所謂的時間架構背離，是同時觀察多個時間架構，其中最短者出現背離的現象。舉例'
  merge: -1
  img_proc: true
- pgno: 195
  md: '來說，假定我們是在 2 分鐘走勢圖上進行交易。按照傳統的時間架構分析，唯有當所有時間架構都呈現多頭趨勢時，交易者才應該買進。可是，根據定義，這是屬於高風險
    - 低報酬的交易。反之，我們可以運用時間架構背離的機會，我們等待 2 分鐘走勢圖出現空頭訊號或 RSI 超賣讀數，該訊號顯然背離較長期之 30 分鐘、60
    分鐘與日線圖所顯示的多頭訊號。由於這屬於回歸均值的策略，所以要避開一些高風險市況，譬如在重大訊息即將公布之前，應該避免進行交易。另外，由於價格波動具有循環性質（參考第
    4 章），所以這種交易策略也應該避開價格波動顯著偏低的市场，因為這類市場有可能由價格波動穩定演變爲價格波動劇烈（因此風險也增加）。


    # 短期交易案例：CME 黃金


    圖 7.13 顯示我們如何運用時間架構背離現象進行短期交易。請注意，按照 9 期 RSI 判斷，所有時間架構都呈現多頭訊號，只有 2 分鐘走勢圖的 RSI
    暫時進入超賣狀況（讀數低於 35）。另外，當 RSI 進入超賣狀態時，10 期 ADX 讀數高於 20，意味著價格波動程度偏高。因此，所有進場條件都已經滿足，我們根據下一個
    2 分鐘線形的開盤價 $1,406.10 買進。關於風險管理，我們要在較長時間架構上尋找停損點。就 30 分鐘走勢圖而言，波段低點的支撐在 $1,402.60。交易採用
    2 分鐘走勢圖，顯然是想儘快獲利了結，而且這類系統的勝率應該偏高，所以我把獲利了結的限價賣單設定在 RSI 出現超賣讀數之前一支線形的高點 $1,407.30。這張限價單大約在
    4 分鐘之後成交（請參考圖 7.13 與 7.14）。'
