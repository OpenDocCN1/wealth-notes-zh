- pgno: 125
  md: '接著，我們準備討論兩種數學方法計算的歷史價格波動率指標，兩者都是由韋達（J. Welles Wilder Jr.）在1970年代提出，而且都需要計算資產的真實區間
    $ ^{\text{〔註19〕}} $ （true range）。


    （註 19） 請參考 J. Welles Wilder Jr 寫的 New Concepts in Technical Systems (The Research,
    1978)。


    韋達把真實區間定義為「真實高點」減掉「真實低點」，其中：


    +   ❋ 真實高點：目前線形最高價或前一枝線形收盤價的較高者


    +   ❋ 真實低點：目前線形最低價或前一枝線形收盤價的較低者


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_125_0.png)


    圖 4.13 CME 的 2010 年 10 月份活牛合約日線圖：真實區間'
  merge: -1
  img_proc: true
- pgno: 126
  md: '真實區間衡量的高、低價差，不只考慮當天的最高價與最低價，還將開盤跳空缺口考慮在內，所以更精準一些（請參考圖 4.13）。乖達利用真實區間的概念，建構價格波動率指標（譯按：乖達的
    ADX 指標，計算程序相當繁瑣，實際運用通常都採用電腦軟體。讀者如果想知道計算公式，可以上網查詢。作者此處的介紹相當混淆）。首先，讓我們考慮較單純的價格波動計算：平均真實區間（average
    true range，簡稱 ATR）。


    平均真實區間是計算資產價格在某特定期間內之真實區間的移動平均。最常見的 ATR 是取 14 期的簡單移動平均。雖說如此，但相關計算也經常採用 10 期簡單移動平均與
    14 期指數移動平均。如同稍早曾經強調的，這一切都只是數學而已，不是什麼神奇的魔術。移動平均計算採用不同的期間長度或加權方法，結果會稍微不同（請參考圖 4.14）。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_127_0.png)


    圖 4.14  蘋果電腦 2010 年日線圖：10 天指數加權 ATR 與 14 天簡單移動平均 ATR 的比較


    稍早曾經談到包寧傑帶狀差值的缺失，這些問題也同樣存在於平均眞實區間。讓我們重新溫習一下。根據某種資產價格計算的波動率指標，對於其他資產來說，通常沒有意義（不能彼此比較）。另外，對於特定資產來說，計算期間較長或較短，結果可能迥然不同。即使是相同資產，而且計算期間同樣是
    24 小時，但發生時間如果不同，結果通常也不同。韋達提供的另一種價格波動率指標「平均趨向變動指數」（average directional movement
    index，簡稱 ADX）可以解決前述一些'
  merge: -1
  img_proc: true
- pgno: 128
  md: '問題，指標讀數介於特定範圍內（0~100），屬於百分率擺動指標。因此，對於各種不同資產或各種不同計算期間，價格波動率讀數可以彼此做比較。請參考圖 4.15，其中顯示歐元現貨外匯的
    4 天期 ADX，價格波動率高標在 75，低標在 25。


    平均趨向指數通常是取趨向變動指數（directional movement index，簡稱 DMI）的 10 期移動平均。DMI 是一種動能指標，其數值乃比較當期價格區間與前一時期價格區間的差異。更明確來說，DMI
    是衡量正值淨趨向變動（+DI）與負值淨趨向變動


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_128_0.png)'
  merge: -1
  img_proc: true
- pgno: 129
  md: '（−DI）在某特定回顧期間（通常是10期或14期）的差異。

    +DI之所以發生，是因為某特定期間內，多數趨向變動值都高於前一期的趨向變動值。反之，−DI之所以發生，是因為某特定期間內，多數趨向變動值都低於前一期的趨向變動值。


    對於正值價格區間，計算公式為：

    +DI＝（+DI÷TR）×100

    其中+DI＝正值趨向變動量，TR＝真實區間


    對於負值價格區間，計算公式為：

    −DI＝（−DI÷TR）×100

    其中−DI＝負值趨向變動量，TR＝真實區間


    接著，我們可以計算DI差與DI和如下：

    DI差＝｜（+DI）−（−DI）｜

    DI和＝｜（+DI）+（−DI）｜


    趨向變動指數（Directional Movement Index，簡稱DX）的計算如下：

    DX＝（DI差÷DI和）×100


    最後，ADX的計算公式為：

    ADX＝SUM[(+DI−(−DI))÷(+DI+(−DI)), N]÷N

    其中N＝計算期數'
  merge: -1
  img_proc: true
- pgno: 130
  md: '客觀數學方法所推演出來的價格波動率指標，雖然對於順勢與逆勢交易系統都大有助益，但傳統技術分析也有助於交易者判斷價格波動循環的發展位置。舉例來說，請觀察圖
    4.16 的 CME 小麥期貨走勢圖，其價格陷入長達數個月的矩形整理，價格波動非常穩定，最後終於向上突破，價格波動急遽升高。反之，圖 4.17 由較短期觀點顯示價格波動循環的性質（2008
    年 8 月份 CME 原油期貨），我們先看到 2 天的旗桿狀垂直走勢（價格波動劇烈），緊跟著出現為期 14 天的橫向整理（價格波動穩定）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_130_0.png)


    圖 4.16 2010 年 CME 小麥期貨最近交割月份永續過線圖：穩定的價格波動向上突破'
