    # 結論


    關於交易心理的成長與發展，人們往往抱著不切實際的信念。我們經常認爲，交易偏頗如果不是「有」，就是「無」，黑白分明。實際情況並非如此，我們的情緒發展就如同音樂的音階變動。人們的心理發展通常都不是線性的，同樣的情緒（譬如：恐懼、貪婪、驕傲、極度…等）只有強弱之分，不會是全有或全無。舉例來說，交易者經過長期反覆訓練之後，表面上看起來，對於虧損似乎已經無動於衷。換言之，交易者可以斷然認賠，而且沒有任何情緒波動。可是，這並不代表交易者已經完全克服虧損可能牽動的所有情緒。當交易者碰到嚴重的虧'
  merge: -1
  img_proc: true
- pgno: 328
  md: '損，或遭遇不尋常的連續虧損時，情緒上仍然可能發生問題。


    發生虧損時，初學交易者的感受往往很深，而且念念不忘，後續交易也會顯著受到影響。對於同樣的虧損，進階交易者也會覺得懊惱，但程度比較緩和，後續影響的破壞性相對不顯著。至於頂尖交易者，他們也同樣不樂意遭遇虧損，不過虧損一旦發生，他們總能夠坦然接受，情緒很快就能抒解，後續交易也不會受到先前虧損的影響。所以，只要是人類，情緒偏頗就只有強弱的分別；只要經過充分的訓練，交易者就可以妥善處理情緒問題。交易過程如果發現情緒波動，不要覺得懊惱或沮喪，而是要試著去處理才對。


    其他的概念偏頗，通常也需要慢慢、分階段糾正。舉例來說，初學者經常偏向於做多，比較不願放空；比較願意在正常市況下交易，不願處理價格衝擊事件；覺得星期五較星期一更適合交易。關於前述偏頗，進階交易者受到的影響較輕，但也存在另一些偏頗，譬如他們寧可交易布蘭特原油，而不是
    WTI 原油。即使是非常老練的交易者，恐怕也多少存在偏頗心態，譬如有些人偏愛採用順勢系統，不願採用逆勢系統（註37）。


    > （註 37）此處所談到的偏頗，只是為了說明方便，千萬不要認為它們真的代表進階交易者與高階交易者之間的差異。


    隨著交易經驗慢慢累積與發展，不同階段往往都會對應著'
  merge: -1
  img_proc: true
- pgno: 329
  md: '某些常見的偏頗。初學者經常展現深具破壞力的偏頗，譬如：剛開始從事交易時，往往不願承認自己錯誤，也經常有「小賺-大賠」的問題。這類偏頗造成的影響很大，往往會導致情緒崩潰或徹底失敗，迫使交易者承認市場行為是多層面的、不確定的、持續變動的。處在這個階段裡，交易者要學習如何處理兩難的情境，一方面是不願虧損，另一方面是不願錯失機會。《孫子兵法》曾經提到，不要讓敵人陷入困獸之鬥的絕境…如果敵人知道完全沒有退路，只能死拼${}^{(註38)}。換言之，若因害怕虧損而不參與，又會害怕因此而錯失機會；同樣地，若因害怕錯失機會而參與，又會害怕因此而發生虧損。一旦體會兩者之間的關係，就足以促使我們發展、遵守賭場典範：不論結局如何，我們都抱著「要發生的，就讓它發生」的態度。很有趣地，當我們抱著這種心態而秉持賭場典範時，初學者也就會過渡到進階交易者了。


    (註38) 請參考《孫子兵法》(The Art of War, Oxford University Press, 1963) 第110頁。


    記住，「要發生的，就讓它發生」的態度，並不等同於不理会風險的魯莽。交易者必須管理風險；換言之，我們知道自己害怕發生虧損，但還是要嚴格秉持賭場典範（參考第12章）。我們能體認虧損的可能性，但我們已經累積充分的經驗，瞭解交易者必須接受這種虧損風險做為代價，藉以避免錯失賺錢機會的風險。'
  merge: -1
  img_proc: true
- pgno: 330
  md: '由初學者過渡到進階交易者，代表交易發展程序的一大突破，因爲這意味著由失敗而成功的變動。進階交易者最常碰到的問題之一，是讓有限程度的成功，演變爲自滿與排斥風險。自滿與排斥風險之所以發生，通常是因爲懶惰，或非理性堅持某種欠佳交易方法，因爲交易者誤以爲若非如此，將會退化到先前的情緒混亂困境與財務災難。如果是因爲自滿而非理性地排斥風險，解決辦法就是重新評估機率，鎖定特定的績效目標。反之，問題如果是非理性地害怕失敗，那就要仰賴研究，包括發展機械性交易系統，並做歷史資料測試。花愈多時間研究與測試其他正值期望報酬模型，愈能夠排除我們對於既有模型的非理性偏頗。研究其他模型，能夠孕育開放的態度，讓交易者可以根據本身的個性與交易風格，改進既有模型的功能。


    若想由進階交易者提升到高階交易者，通常要納入伴隨經驗而產生的直覺相關技巧，用以輔助純機械性方法。


    高階交易者也會運用市場共識看法（市場高度共識的看法，通常都是錯的）。舉例來說，當我建立部位之後，如果市場出現對我有利的拋物線走勢，而我猜想行情將出現大變動而推升行情創新高價，此時我就會冷靜觀察市場呈現的陶醉看法，然後立即結束
    50% 部位，剩餘部位也會立即調緊停止價位。這種認爲行情將創新的陶醉或極端情緒，通常都意味著市場即將出現頭部或底部。'
  merge: -1
  img_proc: true
- pgno: 331
  md: '高階交易者能夠清楚判別「期待」與「直覺」之間的差別。「期待」是把我們的主觀信念強加到市場行爲上，這是非常情緒化的做法。反之，「直覺」在情緒上是中性的，是我們對於市況發展的客觀感受。


    最後，我嘗試界定交易者在各發展階段的性質。關於高階（頂尖）交易者、進階交易者與初學者之間的差異，一方面是在於他們對待成長與技巧提升的態度。高階交易者瞭解，他們掌握的技巧不是一種靜態高原，而是一種不斷流動、不斷提升的過程，如同俗話說旳，交易成功「…是個旅程，不是終點」。進階交易者遭逢挫折時，總想設法回到過去的成功狀態，但頂尖交易者瞭解，實際上沒有可供返回的理想狀態，就好像我們沒辦法踏進同一條河兩次（河流與市場一樣，是多層面的、不確定的、持續變動的）。因此，對於頂尖交易者來說，挫折代表機會，可以讓他們得以重新檢視過去的盲點，藉此提升交易技巧（請參考表
    11.13）。


    表 11.13 交易者技巧階層


    | 技巧階層 | 方法 | 風險管理 | 交易紀律 | 挑戰 |

    | :--- | :--- | :--- | :--- | :--- |

    | 初學者 | 無 | 無 | 無 | 發展賭場典範邊循法則 |

    | 進階者 | 法則為主 | 停損 | 部位規模設定偶爾稍微違規 | 自滿嫌惡風險 |

    | 高階者 | 法則為主輔以直覺 | 風險管理金字塔式加碼 | 無瑕疵或幾乎無疵 | 發展新模型修正既有模型 |


    附註：此處所謂的初學者、進階交易者與高階交易者，只是基於說明方便而做的略略分類，實際上當然沒有明確的界線。'
  merge: -1
  img_proc: true
