- pgno: 238
  md: '案例：可口可樂：2008年10月信用危機期間，可口可樂股價由谷底反彈到$47.53。這個高點成爲後續走勢的上檔壓力，一直到2009年5月18日之前都沒有受到挑戰。由於$47.53代表顯著的
    psychological 關卡，因此當該壓力在2009年5月被突破時，長期順勢交易者就可以考慮進場建立多頭部位，並將停損設定在2009年3月份循環低點$37.44。等到新的多頭趨勢正式展開，原本的上檔壓力$47.53也就成爲新的下檔支撐。幾次對這個支撐的測試也構成上升趨勢線；隨後的漲勢也沿著這條趨勢線發展，直到2010年1月4日當週才遭到跌破。這條重要趨勢線被貫穿之後，投機客則可以考慮按照隔週開盤價$55.15建立空頭部位（請參考圖8.18）。


