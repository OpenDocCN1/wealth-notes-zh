  md: '如果我們將 RSI 極端交易系統運用於英鎊 / 美元外匯現貨交易，停損設定為 $350，並假定佣金與滑移價差為 $10。這麼一來，根據 1% 法則，帳戶資本就需要有
    $36,000。在這種情況下，$2,505 的最大淨值耗損應該不至於構成威脅，因爲這只不過佔整體資本的 6.96% 而已。不過從另一方面來說，這個模型的績效並不理想，因爲整個
    10 年期獲利只有 $5,974，換算爲年化平均獲利則爲 $597.40，報酬率僅 1.66%。


    交易者如果覺得報酬率 1.66% 實在太差，提升績效最簡單的辦法，就是把每筆交易所承擔風險提高爲資產總額的 2%（註 11）。這種情況下，年化報酬率可以馬上倍增爲
    3.32%，但帳戶淨值最大耗損也會倍增，佔帳戶資產總值的 13.92%。如果我們覺得 3.32% 的年度化報酬率仍然太差，不妨把每筆交易所承擔風險大幅提高爲資產總值的
    10%。如此一來，年度化報酬率將是 16.6%，看來相當不錯；可是，爲了取得這種績效，我們必須付出代價：因爲帳戶最大淨值耗損將增爲 69.58%。


    （註 11）請參考《操作生涯不是夢》（Trading for a Living, John Wiley& Sons, 1993，寰宇出版，F090）第 260
    頁，作者 Alexander Elder 提議，如果交易者冒險意願較高，每筆交易承擔風險可以設定爲不超過帳戶總值的 2%，用以取代部位規模上限。


    69.58% 的最大淨值耗損，爲何會被視爲「幾乎足以致命」？想想看，如果這發生在交易剛開始進行的初期（我們永遠都要假設這種可能性），則後續交易需要取得 225%
    的報'
