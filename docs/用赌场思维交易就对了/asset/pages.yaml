- pgno: 45
  md: '# 第2章


    # 價格風險管理方法


    > 船隻停泊在港口內是安全的，但這並不是船隻的功能所在。

    — John A. Shedd


    人們從事投資，通常不希望價值下跌，不希望將來回收投資時，價值變得更少。本章準備討論風險管理方法，並說明正値期望報酬本身，並不足以確保交易成功。此處將深入探索風險管理的全部相關細節，包括停損設定、部位規模調整、風險值（Value-at-Risk）、壓力測試、風險判斷等。我們將特別強調如何把這些工具结合在一起，以創造出穩健的風險管理系統。


    # 唯一的確定


    從事投機交易活動時，很多人都想明確掌握一些難以掌控的事。本書第 1 章開宗明義就談到正値期望報酬模型的發展，因為這是交易成功最重要的條件之一。可是，即使是最棒的模型，也不可能確保每筆交易都成功。事實上，除了價格波動之外（本書第
    4 章討論的主題），交易只有一件事能確定，那就'
  merge: -1
  img_proc: true
- pgno: 46
  md: '是一切都不確定。正因爲如此，所以對於我們所進行的每筆交易，都必須假定交易可能失敗。換言之，我們永遠都準備因應最糟狀況；所以，當最糟情況真的發生時，也不會覺得意外。


    很多交易者認爲，隨時防範最糟情況發生，這種心態實在太過悲觀。有些人甚至認爲，這種態度會招致厄運。當然，這也正是交易成功之所以困難的一部份原因所在。交易者必須100%信賴自己運用的正值期望報酬交易模型，但對於所進行的每筆交易，仍然要隨時防範失敗的可能。千萬記住，我們要從「莊家」的立場從事交易。莊家會設定每筆賭注的最高限額，絕不允許有任何例外。爲什麼？莊家雖然知道自己擁有機率上的勝算，但對於任何單筆賭博，還是不能排除賭客獲勝的可能性。


    有些人宣稱風險管理是交易成功的最重要因素，這未免又太誇張風險管理的重要性了。事實並非如此。你可以是全世界最棒的風險管理者，但如果不採用正值期望報酬模型，風險管理技巧頂多讓你輸得好看一點。不過，話說回頭，正值期望報酬模型如果會失敗的話，最重要的原因必定是風險管理發生問題。既然如此，一旦擁有正值期望報酬模型，爲什麼還會有人不妥善管理風險呢？很簡單：貪婪與急躁。如果缺乏耐心，我們就會捨棄適當的風險參數。我們迫不及待，沒辦法循著一條安全的道路致富。我們告訴自己，一旦有了
    $100,000、$500,000 或 $100 萬，就會嚴格遵循風險管理法則。另外，只要留意機率與勝算，再加上一些運氣，一切都不會有問題。'
