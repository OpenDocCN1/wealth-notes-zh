- pgno: 307
  md: '# 交易執行方面的考量


    這方面的考量，可以協助交易者體會實際交易可能碰到的麻煩，並預先做計畫。當我們做歷史資料測試（或甚至模擬交易）時，執行上通常都很順利，但實際交易的情況則非如此，很多方面都可能出差錯，譬如：滑移價差、期貨合約的展延、24
    小時市場的交易執行，以及其他等等。


    問：是否一天 24 小時皆可進行交易？


    股票交易的優點是，不用考慮一星期 6 天、一天 24 小時的執行問題。反之，不論期貨或現貨外匯，交易者都需要考慮 24 小時市場可能造成的麻煩。


    對於小額投機客來說，最單純的解決辦法，就是自行設定可供交易的時段；這尤其適用於搶帽子和當日沖銷。可是，對於波段交易或部位交易來說，設定時段可能會讓交易者錯失機會，或在所設定的交易時段結束時提早結束部位。關於這些問題，可以考慮採用「一筆成交
    - 取消全部」的指令（one cancels all）或採用「包圍」（bracket）指令，藉以管理隔夜風險，也可以避免重複交易的問題（註 35）。


    （註 35）有關重複成交的例子，譬如：當既有部位透過停止單結束部位時，限價單又被執行而無意之間成立新部位。「一筆成交，其他取消」（one cancels other）的交易指令可避免重複成交：就前述例子來說，停止單成交，限價單就取消而失效（反之亦然）。'
  merge: -1
