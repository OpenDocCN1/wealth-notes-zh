  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_169_0.png)


    有種部位規模相關策略稱為金字塔加碼（pyramiding），這不同於虧損部位的加碼攤平，也有別於回歸均值模型減緩懊悔情緒的技巧。首先，金字塔加碼只適用於順勢交易模型的成功部位。金字塔加碼在很多方面都剛好與加碼攤平相反；金字塔加碼的起始部位，其規模大於後續的加碼部位。加碼攤平的起始部位，規模最小，後續加碼部位愈來愈大，帳面虧損也加速成長（請參考表
    6.4）。因此，很多長期順勢交易者相當強調金字塔加碼，認為這是一種謹慎的部位規模策略。'
  merge: -1
