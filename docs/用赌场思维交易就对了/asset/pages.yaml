  md: '一種令人覺得無聊的活動。我常常把成功的投機客，比喻爲精算會計師，因爲很少人會爲了追求刺激而踏入精算會計這個行業。唯一值得慶幸的是，金融投機的賺錢潛能，遠超過精算會計師。如果想追求刺激，不妨去玩高空彈跳或跳傘。經營賭場的目的，通常是爲了賺錢，不是追求刺激。反之，只有賭客才會爲了追求刺激與賭博，因此勝算不站在他們那邊。


    正值期望報酬模型大概可以劃分爲兩大類：順勢交易與回歸均值，因爲市場呈現的行爲只有這兩種。一套模型不論多麼穩健，勝算總有些時候不站在它那邊。碰到這種期間，要能保持在場外觀望，需要有耐心和紀律，尤其是不做交易的紀律，直到市場呈現有利於交易模型的行爲爲止。我經常告誡學員，「如果覺得無事可做，就不要做任何事。」譬如說，如果你採取回歸均值的模型而碰到趨勢明確的市況（換言之，處在這種市況下，你的交易模型不具勝算），此時應該留在場外耐心等待，直到市況發生變化而你的交易模型重新擁有勝算爲止。交易市場只會唱兩種歌：明確趨勢與回歸均值。當市場高唱趨勢之歌，回歸均值的交易者就應該耐心等待趨勢曲終。等待的過程裡，我們會聽到趨勢賭場裡傳出來的陣陣歡呼，但回歸均值交易者絕對不可興起轉換陣地的念頭，想去那裡撈點好處。那是屬於趨勢交易者的賭場，只有他們才能享有正值期望報酬。對於回歸均值交易者來說，你的工作是耐心等待，等待市場重新奏起回歸均值的歌曲。等到時機來臨，你的賭場又會人氣鼎沸、熱鬧滾滾，這才是你賺錢的機會。'
  merge: -1
  img_proc: true
- pgno: 107
  md: '當市況不利於我們的模型運作時，想要保持交易紀律，關鍵之一是要瞭解價格波動的循環性質。市況變化速度，往往快得遠超過我們的想像。當我們空手留在場外等待時，總認為自己永遠沒有進場機會；一旦進場，又認為獲利目標永遠達成不了。這是因為當前市況會扭曲我們對於未來行情發展的判斷，尤其是在價格波動偏低的時候，這會讓我們覺得不耐煩，交易紀律也因此鬆懈。想要克服這個問題，就要提醒自己有關價格波動的循環性質：價格波動會由低轉高，或由高轉低，呈現循環發展（請參考第
    4 章）。雖然任何市況都是如此，但以空頭市場爲最，空頭市場的價格波動變化速度，通常都會明顯超過多頭市場。


    有關不利於交易模型的市況發展，我經常拿另一個比喻來說明。當你飢餓難當地走進一家最喜歡的餐廳，迫不及待研究著菜單，覺得每道菜都很可口，但你也知道自己不可能吃得下所有的菜。交易的情況也一樣，你最初可能想抓牢每個可能賺錢的行情，但最終將發現自己畢竟只能掌握那些自己擁有勝算的機會。這種情況當然也有例外；如同本書第
    8 章將討論的，如果交易資本足夠雄厚，你當然可以同時操作順勢與回歸均值的模型。可是，即使如此，任何特定模型也只能參與本身適合的市況，不能超越界線。'
