- pgno: 85
  md: '# 第 3 章 鋼鐵般的紀律


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_85_0.png)


    正值期望報酬模型之所以會失敗，通常是因為使用者沒有運用合理的風險管理方法，或因為交易者根本就沒有遵循模型的指示。本章準備繼續講解我們的賭場模式，討論交易者會基於什麼理由而不遵循正值期望報酬模型的指示，以及為何會背離適當的價格風險管理。最後我們會介紹幾種心理工具，協助交易者保持鋼鐵般的紀律。


    # 漠視紀律


    即使擁有一套正值期望報酬模型，資本充裕，而且採用謹慎的價格風險管理方法，交易還是可能失敗——這正是金融交易之所以深具挑戰性的原因所在。這個問題不妨用個例子來說明(^15)。有個不透明的箱子，裡面裝著
    57 顆綠球，43 顆紅球。現在，我請你由箱子裡拿出一個球，並下注賭該球的顏色。你選擇綠色。結果拿出的球是紅色。第二次，你仍然賭綠色，結'
  merge: -1
  img_proc: true
- pgno: 86
  md: '果還是拿到紅球。第三次，情況還是如此，你賭綠色，結果是紅色。第四次，你還是堅持賭綠色，不過又拿到紅色。經過四次失敗之後，你開始猶豫了。你知道箱子裡的綠球數量較多，賭綠球的勝算理當較高，但基於某種緣故，紅色出現的可能性似乎較高一一實際經驗「證明」如此。於是你不想繼續下注了，甚至轉而賭紅色。


    > （註 15）請參考 Nassim Taleb 的 Fooled by Randomness (W.W. Norton, 2001)。Taleb 雖然拿這個比喻說明負值期望報酬模型也能成功，但這個例子（顯然）也可以用來說明正值期望報酬模型可能失敗。


    請參考圖 3.1，我故意挑選這個經過歷史測試的模型，以及本章稍早已經討論了兩次的案例（圖 2.1 和圖 2.11），只是現在我們要從交易紀律的角度重新檢視。請注意圖形下端文字部分的「MaxConsecLosses」，這代表「最多連續虧損的交易筆數」。如同數據所顯示，這雖然是個正值期望報酬模型，最終獲利了
    $64,420，但過程裡曾經碰上連續 4 筆失敗交易。換言之，碰到連續 4 筆失敗交易之後，你如果不能（沒有足夠的資金）或不願（喪失信心）繼續使用該模型，不僅最終不能享有
    $64,420 的獲利，反而會遭遇最大淨值耗損 $23,160。更甚者，在遭遇連續 4 筆失敗交易而帳戶淨值損失 $23,160 之後，如果你決定改以反向操作(註
    16) 模型（賭紅球），接下來一筆交易將虧損 $6,320，徹底瓦解交易士氣。所以，單純擁有一套正'
