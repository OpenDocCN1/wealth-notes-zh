    圖 7.16 2011 年 1 月份 CME 原油期貨日線圖：時間架構背離交易的運作


    關於時間架構背離訊號的運用，前述黃金短線交易與此處的原油長期交易，兩者之間雖然有明顯的共通處，但也有些重要差異。短線交易必須額外考慮一些風險狀況，這是長期交易不需特別強調的，譬如說重要訊息（就業報告、公開市場操作委員會會議等）即將公布之前的事件風險，同時也要避開價格波動明顯偏低（低報酬
    - 高風險）的市況。


    這些因素都不會影響日線圖上的時間架構背離操作。此處之所以可以接受重大新聞事件與價格波動緩和的市況，主要是因爲週線圖與月線圖界定的交易動機足夠強勁。前述短線黃金'
