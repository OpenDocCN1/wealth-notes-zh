- pgno: 120
  md: '就應該比較高。可是，由於價格波動具有循環的性質，我發現本章探討的指標，更適合用來顯示價格波動循環何時發生變動。以下討論一些常用的價格波動指標。


    包寧傑帶狀通常都是以 20 天簡單移動平均為準，然後上、下各取 2 個標準差做為帶狀。所以，我們可以計算包寧傑帶狀上限與下限的差值，將其視為歷史價格波動率。當市場沒有呈現明顯趨勢時，包寧傑帶狀的寬度很窄，代表價格波動率很小。反之，當市場呈現明顯趨勢時，帶狀就會變得很寬，意味著價格波動劇烈（請參考圖
    4.6）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_120_0.png)


    圖 4.6  2010 年 Google 日線圖，以及包寧傑帶狀與帶狀差值'
  merge: -1
  img_proc: true
- pgno: 121
  md: '採用包寧傑帶狀差值做爲價格波動指標，優點是客觀，因爲這是透過統計方法計算資產的歷史價格波動程度。可是，這種計算是採用特定資產發生在特定期間內的歷史價格，因此所得到的價格波動跟其他資產無關。另外，由於計算是採用過去某段時間實際發生的價格資料，因此所衡量的價格波動未必能夠反映相同資產其他期間長度的價格波動，甚至不能反映期間長度相同但發生時間不同的情況。


    請觀察圖 4.6，我們發現當時的狀況顯示，Google 股價波動最小程序度是 $25，而最大則可達 $110 的價格波動。可是，如果我們觀察同一期間、相同條件的
    FedEx 走勢（請參考圖 4.7），我們發現價格波動最低水準在 $5 附近，最高水準則爲 $15 左右。如果我們再回頭觀察 Google 的情況，將日線圖改爲週線圖（圖
    4.8），結果就會發現價格波動最小在 $100 附近，最高則上升到 $300 左右。


    另外，運用包寧傑帶狀差值做爲價格波動指標，即使是採用相同的 24 小時回顧期間，也會因爲測量時間不同（換言之，早上 1 點或下午 1 點）而影響價格波動高、低水準（請參考圖
    4.9 與 4.10）。由於價格波動具有循環性質，某特定 6 個月回顧期間的偏低價格波動水準，可能會在另一 6 個月回顧期間呈現出價格波動偏高的狀況（請參考圖
    4.11 與 4.12）。'
