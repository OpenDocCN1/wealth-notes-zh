- pgno: 206
  md: '# 投資組合表格的解釋


    本章的所有資料都取自集中市場掛牌期貨合約的等活絡永續日線圖（equalized active daily continuation charts）。投資組合的綜合結果，都是按照每種資產的進場日期來計算。除非有特殊說明，否則所有績效結果都是採用表
    8.1 列示之資產的1 口期貨合約。


    表8.1 進行歷史資料測試之投資組合的組成


    | 資產類別 | 資產 | 資產代號 |

    | --- | --- | --- |

    | 股價指數 | CME 的電子迷你 S&P 500 | ES |

    | 利率 | CME 的 10 年期公債 | ZN |

    | 外匯 | CME 的歐元 | EU6 |

    | 外匯 | CME 的日圓 | JY6 |

    | 能源 | CME 的原油 | CL |

    | 能源 | CME 的天然瓦斯 | NG |

    | 穀物 | CME 的黃豆 | ZS |

    | 食物 | ICE 的 # 11 世界糖 | SB |

    | 金屬 | CME 的黃金 | GC |


    資料來源：CQG, Inc. © 2010. All rights reserved worldwide.


    本章的績效表將根據下列 8 項基準衡量交易模型的穩健程度：


    +   1. 總淨利（Total net profit，簡稱 Profit）衡量獲利能力（不考慮模型承擔的風險）；因此，本章所採用的其他衡量基準往往比這項數據更為有效。可是，這項數據還是有用的，因為各項投資組合成份的結果很容易加總淨利，使各種模型的比較很方便，不需另外計算。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '+   2. 交易筆數（Number of trades，簡稱 # Trade）是指整個歷史測試期間所進行的交易筆數。對於長期順勢系統來說，我們希望在不妨礙續效的前提下，這項數據愈低愈好。


    +   3. 天數（Number of days，簡稱 # Days）是指交易持有期間的平均天數。如同交易筆數一樣，假定其他條件相同，天數愈小愈好。


    +   4. 最大耗損（Maximum drawdown amount，簡稱 Max Draw）是指交易帳戶淨值由峰位到谷底之間的耗損金額。


    +   5. 最多連續虧損筆數（Maximum consecutive losses，簡稱 MCL）是指歷史測試期間曾經發生過的最多連續虧損筆數。


    +   6. 總淨利對最大耗損比率（Profit to maximum drawdown ratio，簡稱 P:MD）是指總淨利與淨值最大耗損之間的比率。這項比率值當然是愈大愈好。這可能是最具參考價值的基準數據，因為這讓我們得以瞭解整個歷史測試期間所達成的獲利，以及達成該獲利所承擔的風險。


    +   7. 勝率（Percent winner，簡稱 %W）是指成功交易筆數佔總交易筆數的比率。前文曾經談過，順勢系統的勝率通常較低，回歸均值系統的勝率通常較高。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '+   8. 盈虧比率 (Profit loss ratio, P:L)是指成功交易平均獲利對失敗交易平均虧損之間的比率。如同 P:MD 的情況一樣，這項比率數值愈大愈好。順勢系統的勝率較低，所以
    P:L 應該要很好。換言之，唯有大賺小賠才能達成優異的 P:L 數據。回歸均值模型的 P:L 數據通常較低，但系統勝率高，總淨利還是能夠得到彌補。


    # ### 順勢系統


    關於機械化交易系統，多數人偏愛採用順勢系統，這類系統的盈虧比率 (P:L) 通常較高，部位平均持有期間較長 (所以比較不需要持續追蹤與調整)。本書第 3 章已經詳細討論過各種交易者的心理特質，所以此處不再重複，而把討論重點擺在幾種機械性交易系統，以及提升這些系統的技巧。


    **RSI 趨勢系統：**


    RSI 原本是用來衡量行情回歸均值的傾向，所以當市場呈現明確趨勢時，這套系統可以賺取那些期待走勢回歸均值交易者的錢（參考圖 8.2 與表 8.2）。


    運用 CQG 語言編寫 RSI 趨勢系統的方法如下（譯按：9 期 RSI > 65 則進場建立多頭部位，停損設定在先前 3 天期的最低價；9 期 RSI <
    35 則進場建立空頭部位，停損設定在先前 3 天期的最高價）：'
  merge: -1
  img_proc: true
