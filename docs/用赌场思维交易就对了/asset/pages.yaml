  md: '# 結語


    當我在 1987 年剛踏進金融交易行業時，大約每隔 6 個月左右，就有一位父執輩朋友的小孩來找我，他們剛從大學畢業，不知道自己應該幹什麼，於是找我探聽有關從事投機交易的可能性。現在，仍然有年輕人跑來找我，仍然是詢問金融投機事業的可行性，但他們大多是我朋友的小孩。在這
    20 多年期間裡，我對於他們的回應始終相同：「別做這行。」如果你是因爲不知道應該幹什麼而決定從事金融交易，那就不太可能在這個領域獲得成功。你遲早會碰上連續
    4、5 筆虧損交易，帳戶淨值也隨之減少 10%，然後你就幹不下去了。為什麼？因爲當你拿金融交易與其他行業做比較，就會想「我爲什麼要忍受這些？全世界的各種行業之中，很少有哪種行業，會讓你精疲力盡忙了一整天，結果反而讓鈔票減少。」


    所以，對於那些打算從事交易的人，我總會問相同的問題：「你爲什麼想做交易？」除了想賺錢之外，如果沒有別的理由，我就會請他們打消念頭，因爲當不可逃避的連續虧損發生時，這些人就會放棄，想要另外尋找比較容易討生活的行業。可是，如果從事交易是因爲熱愛做研究、想要解決問題，那麼當逆境出現時，反而會強化鬥志，更想成功。就我個人來說，當操作不順利的时候，我會更堅堅持交易紀律、克制自己的情緒。古代煉金術經常會提到：「如其在上，如其在下」（As
    above, so below），翻譯爲白話文：「金融交易就如同日常生'
  merge: -1
  img_proc: true
- pgno: 353
  md: '活一樣。」換言之，本書探討的很多概念，譬如：自我價值、紀律、機率、沈著穩定…等，不只對於交易有用，對於日常生活也有幫助。


    金融交易若想要成功，必須在壓力之下維持平穩。本書所談到的調和情緒、沈著平穩、目擊意識等技巧，也可以用來處理日常生活的危機。交易經驗讓我們體會到，雖然我們無法控制市場的發展，但我們還是可以控制自己對於市況發展的情緒反應；同樣的道理，雖然我們無法控制生活上發生的許多危機，也無法控制別人對於這些危機的反應，但我們可以控制自身的反應，也可以自行決定如何去解釋這些事件。另外，我們如果能夠調和情緒，通常也能感染周遭的人，就如同音叉會與附近的聲音頻率產生共鳴一樣。


    成功的交易是一門藝術，我們必須透過重複磨練而讓自己適應一些不舒服、不自然的行爲，直到習慣成自然爲止。恐懼是交易的一部份，就如同恐懼是日常生活的一部份一樣。對於交易或日常生活來說，恐懼有重要的功能，讓我們能夠對危險產生警戒。若想要克服交易方面的危險，我們就要採用正佰期望報酬模型，並配合嚴格的風險管理準則。雖然我們已經儘可能降低危險的威脅，不過仍然無法完全避免恐懼；過去曾發生過的虧損，有可能會讓交易者產生不當的恐懼感，乃至於影響到將來的交易。本書第
    11 與 12 章討論了很多技巧，可以解決或減緩這類的非理性恐懼。'
  merge: -1
  img_proc: true
- pgno: 354
  md: '恐懼本身不是問題；可是，如果恐懼讓我們不能有效執行正値期望報酬模型，那就有問題了。設想某位愛好徒步旅行的人來到一處陌生的地方，打算穿越當地森林。他不瞭解這個地區的生態，但天生熱愛徒步旅行，所以他還是決定前往。不久，他碰上一條響尾蛇，突然警覺到危險。小心避開毒蛇之後，他找到一根棍子，預防隨後可能又碰上毒蛇。下次健行時，他就會準備防範蛇蟲的藥品，同時也會帶著手杖。對於已知的危險，當然有必要做預防準備，但如果因為某種可處理的危險而放棄自己熱愛的活動，那就未免太不智了。如同這位健行者一樣，交易者也要防範危險，但不會因為恐懼而放棄交易。克服恐懼情緒的關鍵，就是重複演練正确的技巧，同時加強研究，不要過份擴張信用。


    當我們重複經歷類似的恐懼事件之後，往往就能夠滅緩非理性的恐懼（這裡所說的非理性恐懼，指的是因過去不愉快經驗而被放大的恐懼，而不是當下確實存在危險）。舉例來說，請回想你第一次看電影《大法師》的情況。由於從來沒看過這部片子，所以當你看到有人的腦袋可以前後旋轉時，恐怕會嚇壞了。可是，相同的景象看了
    20 次之後，感覺應該就不一樣了，說不定還會覺得很好笑。相同的刺激重複發生，通常會讓我們的感觉麻痺，當初的恐懼感於是消失，因為我們很清楚接下來會如何發展。經過重複演練，配合研究，再加上保守操作，可以有效緩和我們最大的恐懼：對於不可測未來的恐懼。有關任何一筆交易的演變，我們雖然不確定知道最終結局將如'
  merge: -1
  img_proc: true
- pgno: 355
  md: '何（不同於重複看某電影），但如果重演練相同的操作步驟，對於正値報酬期望模型享有的優勢深信不疑，還是能夠有效緩和我們對於不可知未來的恐懼感。


    初學交易者認為，只要他們能夠克服最後的某個問題，整個交易就會完全沒問題，趨於完美。反之，成熟的交易者瞭解，不論他們如何克服手頭上的問題，交易仍然不可能完美；話雖如此，但他們仍然可以維持穩健的績效。他們知道，不完美就如同沙粒一樣，雖然會讓牡蠣覺得很困擾，但終究能夠孕育成為珍珠。總之，本書提出很多沙粒（譬如：針對金錢做交易、缺乏紀律、懊悔、完美交易症候群、預先猜測訊號…等），但我通過多年的努力，盡力試著把它們轉變為珍珠（譬如：風險管理金字塔，減緩懊悔的分批出場技巧、賭場典範…等）。我誠摯希望這些珍珠能夠促使各位的交易和生活持續成長，變得更靈活，更希望我的努力能夠達到拋磚引玉的效果，激勵讀者發現某種先前未察覺的心理困擾，將它們轉變為珍珠，最終能讓各位的交易與生活變得更加美好。'
