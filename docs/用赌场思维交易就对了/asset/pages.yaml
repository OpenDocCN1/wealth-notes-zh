  md: '隨著資產價值變動（以及價格波動程度變動）而調整停損金額，也會影響部位規模設定。我們繼續考慮實餛的例子。1991 年當股價為 $10 時，每筆交易如果準備承擔
    $500 的風險，對於每股 $0.5 的停損（相當於 5% 停損），我們可以交易 1,000 股。到了 1999 年股價上漲到 $50 時，如果繼續採用 5%
    的停損（相當於每股 $2.50），我們就只能交易 200 股了。


    風險值（VaR）除了考慮資產的歷史價格波動率之外，也要考慮投資組合內各種資產彼此之間的價格相關性。這是很重要的考量，因為部位規模設定如果只單獨考慮個別資產，就無法進行動態調整，也無法得到最佳的結果。


    舉例來說，若把 9 天與 26 天移動平均穿越系統，運用於 CME 最近交割月份與次一交割月份之原油期貨的時間價差交易中，10 年期的歷史測試顯示帳戶淨值最大耗損為
    $7,490。交易帳戶總值如果是 $100 萬，而且願意承擔 7.49% 的帳戶淨值最大耗損，在這種情況下，我們可以交易 10 口合約（部位規模）。如果盲目引用這項部位規模設定，運用於單純的（非價差交易）CME
    原油期貨合約中，結果相同歷史測試期間的最大淨值耗損將為 31.15%。這個例子說明了運用時間價差交易不同交割月份之期貨合約，由於其價格彼此之間存在顯著的正相關，因此將使得時間價差交易所承擔的風險，遠低於相應的單純多頭或空頭部位（請參考圖
    2.13）。'
