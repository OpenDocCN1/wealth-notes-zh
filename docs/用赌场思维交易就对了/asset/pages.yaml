  md: '排除歷史異常資料的做法，看似合理，但其實也很危險，因為其所引發的價格波動與價格相關，其實是實際曾經發生的事件；若排除這些資料，等於是假定市場參與者當時所經歷的風險並不存在。更甚者，我們知道價格是有記憶的，歷史上曾經發生的價格，將來大有可能還會發生（請參考圖
    2.16）。


    另一方面，隨著時間的經過，有可能因為採用固定的回顧期間，所以當計算期間向後延伸時，較早期間的某些資料就會自動被捨棄。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_73_0.png)'
