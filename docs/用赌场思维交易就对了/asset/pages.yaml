  md: '（註25） 2003年，當我出版《機械化交易系統》時，雖然某些期貨合約已經提供電子化交易，但主要還是透過公開叫價方式進行交易。所以，期貨交易所公布的成交量資料總是落後一天。基於這個緣故，《機械化交易系統》一書的討論，並沒有考慮成交量濾網。


    運用CQG，配合成交量濾網的RSI極端系統程式如下：


    ```

    ```

    Long Entry:


    RSI(@,9)[-1] < 35 AND Close(@)[-1] > MA(@,Sim,200)[-1] AND

    Vol(@)[-2] > Vol(@)[-1]


    Long Exit:


    RSI(@,9)[-1 ] > 65 OR OpenPositionAverage@EntryPrice

    (@,ThisTradeOnly) - Dollar2Price(@,7500) /OpenPositionSize

    (@,ThisTradeOnly)


    Short Entry:


    RSI(@,9)[-1] > 65 AND Close(@)[-1] < MA(@,Sim,200) [-1]

    AND Vol(@)[-2] > Vol(@)[-1]


    Short Exit:


    RSI(@,9)[-1] < 35 OR OpenPositionAverageEntryPrice

    (@,ThisTradeOnly) - Dollar2Price(@,7500) /OpenPositionSize

    (@,ThisTradeOnly)

    ```

    ```


    增添成交量濾網，績效改善程度雖然不大，但很明確，尤其是總淨利對最大耗損比率（P:MD）與盈虧比率（P:L）（參考表8.8與表8.9）。'
