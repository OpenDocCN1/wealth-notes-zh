    # 問：目前引用多少種策略？


    這個問題促使我們集中心力，去理解自己所投資的市場具有什麼樣的行為，同時也讓我們知道有哪些市場行為，並非我們能力之所及。舉例來說，如果我們採用傳統的順勢操作系統，則系統勝率通常不高，對此要有心理準備。反之，如果採用逆勢系統，則成功交易平均獲利對失敗交易平均虧損的比率'
  merge: -1
  img_proc: true
- pgno: 292
  md: '通常不太理想（有關各種交易策略與其性質的詳細內容，請參看第 3 章）。


    # 問：帳戶規模擴張到哪種程度，將妨礙你目前運用的策略？


    如同表 11.1 顯示的，當帳戶規模成長到某種程度，操作多種不相關資產藉以降低風險的能力將大打折扣。除了資產配置分散風險的能力受到限制之外，某些策略的執行也將窒礙難行，尤其是極短線的交易策略。


    # 問：是否自行發展交易模型？


    交易模型如果不是自己設計的，是否屬於黑盒子系統？對於黑盒子系統，我個人持著保留的態度。不論多麼穩健的系統，遲早都會碰上連續虧損的問題。以黑盒子系統來說，一旦遭遇連續虧損，我們根本不知道究竟是甚麼原因造成的，因此很容易就會喪失信心。


    # 問：你所屬的交易機構，是否透過特定程序訓練新進交易者？


    有關新進交易者的訓練，雖然取決於機構本身的條件與個人的心理架構，但我還是提供一個參考範本。


    首先，新進交易者應該針對將來準備採用之經紀商交易平台做模擬交易。這有幾方面的功能，包括熟悉相關平台的執行程序，進行歷史資料測試，發展正值期望報酬的機械性交易系'
  merge: -1
  img_proc: true
- pgno: 293
  md: '統，協助交易者在程序上、情緒上進入狀況。


    對於交易經驗有限的新手來說，我建議部位平均持有期間應該短些。當我剛開始學習交易時，當時普遍的看法認為，新手應該採用較長期的順勢交易方法；可是，這種建議涉及一些缺點。長期順勢系統對於交易紀律的要求較高，往往必須忍受較嚴苛的連續虧損，系統勝率通常不及
    50%，失敗部位的平均虧損金額也大於較短期模型。所以，對於初學者來說，長期順勢系統執行上有其困難，甚至對於稍有成度的交易者也困難。


    所以，我建議新手剛開始從事交易時，最好從搶帽子或當曰沖銷開始。這類短線操作可讓初學者集中精神於少數一、兩種資產，不斷強化所學習的交易準則，瞭解成功是可能的，並體會風險管理的重要性。當然，初學者從事短線交易也有缺點，譬如：交易過於頻繁、決策壓力太大⋯等，但我還是認為瑕不掩瑜，長期順勢系統的問題更多。另外，搶帽子與當日沖銷能夠更頻繁進行交易，學習速度較快，每筆交易所承擔的風險也比較少。


    # 關於績效紀錄


    本章的問卷部分結束之後，雖然會用相當篇幅討論績效紀錄的內容，但此處準備先透過問卷方式考慮一些議題，檢視績效紀錄可能產生的限制，包括採用假設性的績效紀錄、交易資產類別⋯等。'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 問：你的績效紀錄是實際發生的，還是假設性的？


    本章稍後會提供一份完整的交易日誌範本，協助各位記錄交易績效資料。很多初學者與進階者認爲，正值期望報酬模型的歷史測試紀錄，可以取代實際交易結果。撇開執行上可能出現的錯誤（以及其他操作上的問題）之外，我們還必須考慮實際交易時的流動性風險，而且在某些情況下（譬如遭遇連續虧損），交易者未必能夠嚴恪遵循紀律（一般來說，只有老練的交易者才能在遭逢連續虧損時，繼續堅持既有的正值期望報酬模型。相關討論請參考本書第
    6 章）。


    # 問：目前交易哪些資產？


    這個問題促使交易者考慮相關資產的價格波動程度、部位規模議題、流動性風險，以及各種資產之間的價格相關程度（correlations）。


    # 問：交易特別順利或不順利的期間，是否會影響正常的交易頻率？


    關於這個問題，初學者要考慮報復性交易的問題，較有經驗的交易者則要考慮交易系統如何受到多頭與空頭市場影響，或受到價格波動循環的影響。'
  merge: -1
  img_proc: true
- pgno: 295
  md: '# 關於操作方法


    下列有關操作方法的問卷，主要目的是協助各位糾正非理性的交易偏頗。另外，我們也希望協助讀者有系統地評估既有方法的優點和缺點，持續做修正，讓交易系統變得更穩健。


    > 問：你如何敘述所採用的各種方法？


    這個問題協助交易者把相關方法做分類：系統性 / 主觀判斷、順勢 / 逆勢、技術分析 / 基本分析等。各位的回答應該儘可能周詳。舉例來說，假定你使用一套以技術分析為主體的系統性逆勢系統，交易訊號是否允許被主觀判斷否決？若是如此，主觀否決被引發的條件是根據什麼：價格波動程度、價格相關、其他風險管理考量、或是基本分析（譬如新聞相關的風險事件）？


    > 問：所採用的方法，是否永遠在市場中持有部位？是否允許空手？如果允許空手，這種狀況大約佔多少百分比？


    交易系統如果永遠持有部位，帳戶淨值耗損通常較嚴重，勝率也較差。允許保持空手的系統，可能有幾個星期或幾個月完全退場觀望。交易系統持有部位的時間如果不夠長，就需要多交易幾種資產，如此才能確保穩定的績效。


    > 問：所有市場是否都採用相同的交易方法？如果不是，為什麼？'
  merge: -1
  img_proc: true
- pgno: 296
  md: '這個問題的答案，往往取決於交易所採用的是以技術分析或基本分析（包括季節性型態）爲主體的系統。若是以技術分析爲主的模型，每個市場通常都可以運用相同方法；但若是以基本分析爲主的方法，則需要針對個別資產的性質做調整。


    # 問：交易進場與出場的準則是否不同？


    這雖然是個「是」或「不是」的問題，但我們希望讀者更深入思考交易方法的策略。譬如說，如果修正進場或出場準則，績效是否能夠提升？


    # 問：相關交易方法是否特別適用於某種時間架構？


    交易方法如果運用於某種時間架構的績效特别好，這是是否因爲相關資產在該時間架構上，呈現特別顯著的順勢或回歸均值傾向？或是因爲持有時間較長，因此而節省了佣金成本、減少了流動性風險？


    # 問：交易方法是否特別適用於某些市況？


    交易方法的績效雖然會因爲市況不同而產生差異，但真正理想的交易系統，不論在多頭或空頭市場都能賺錢。另外，這個問題也凸顯出系統分散（同時採用性質不同的交易系統）的效益（參考本書第
    8 章）。


    # 問：所採用方法的長處與短處？'
  merge: -1
  img_proc: true
- pgno: 297
  md: '除了思考與規劃績效不彰期間的因應策略（以及其他議題，例如：執行缺失、空手期間太長、價格相關風險…等）之外，回答這個問題時，也可以讓交易者確認所採用的方法特質（長處與短處）是否符合自己的個性。


    # ■ 問：交易方法是否經常做調整？


    太經常調整或變更交易方法，可能意味著使用者對於相關系統缺乏信心，或罹患完美交易症候群。當然，任何交易方法都應該做調整，藉以提昇系統的效率，但這類的調整應該透過合理或系統性程序處理，絕對不該失之於情緒化。


    # ■ 問：交易方法是否能夠反映「分散」（diversification，多角度操作）的效益？


    俗話說，「分散交易是金融市場唯一的免費午餐。」本書第 8 章曾經談到資產類別的分散交易（同時交易多種資產），以及系統方法的分散交易（同時使用多種方法）。對於當日沖銷或極短線玩家來說，恐怕就不容易進行分散交易，因爲他們頂多能夠同時照顧
    2、3 種資產，也頂多能夠採用 1、2 種交易系統（除非是採用全自動化的系統）。可是，對於波段交易者或部位交易者來說，就應該充分運用分散交易的好處。記住，即使是績效非常穩健的交易系統，若只針對
    1、2 種資產進行交易，績效也難免會有劇烈起伏之處，連續虧損期間往往也會拉得很長，帳戶淨值耗損也更容易構成壓力。'
  merge: -1
  img_proc: true
- pgno: 298
  md: '針對單一資產做交易，績效可能大好或大壞。我們知道，市場趨勢可能持續發展好幾年。所以，當我們做歷史資料測試時，測試期間有可能正好完全處在多頭市場或空頭市場，因此當趨勢發生變動時，相關模型的歷史測試資料就會變得毫不起眼，實際交易也很可能就會失敗。


    # 問：如何決定交易對象（資產）？


    關於投資組合的組成，有幾點需要考慮，包括：資產的價格波動程度（避免信用過份擴張）、資產彼此之間的價格相關（確保交易足夠分散）、資產的市場流動性（減少滑移價差）。另外，所採用的交易方法也可能侷限投資組合的分散程度。舉例來說，如果不採用自動化交易系統的話，當日沖銷或搶帽子頂多只能照顧少數幾種交易對象，基本分析交易模型的情況也存在類似問題。


    # 問：如何決定進場、出場與停止價位？


    成功的交易雖然不需要知道何時、在哪裡獲利了結，但絕對需要基於風險管理而設定停止價位。另外，交易者也要設定明確的進場準則，或是完全機械化的準則，或同時參考主觀判斷。此處所謂的主觀判斷可能包括（但不侷限於）：價格衝擊事件、假日、午餐期間等。'
  merge: -1
  img_proc: true
- pgno: 299
  md: '本書第 2 章曾經談到，停止價位設定方法大體分爲三類：以數學方法決定的停止點，根據支撐 / 壓力決定的停止點，以及根據金額或百分率設定的停止點。


    問：如何決定部位規模？信用擴張程度？


    同樣地，這個問題的答案也要考慮相關資產的價格波動程度、彼此之間的價格相關等問題。


    問：獲利部位如何調整曝險程度？虧損狀態的部位是否能減少曝險程度？若是如此，如何做調整？


    這個問題需要考慮金字塔式加碼（pyramiding）、虧損部位減碼策略，以及減緩懊悔情緒的技巧（參考第 6 章）。關鍵是相關調整是取決於既定計畫，而非由情緒決定。


    問：交易是否參考基本經濟訊息？若是如此，這會如何影響風險管理？


    原則上，基本經濟面的訊息，只能用於風險管理的防禦，不能用於攻擊。初學者尤其要特別注意，絕對不能拿基本經濟面訊息當作藉口而放棄或鬆懈風險管理。另一方面，關於資產價值的根本變動（典範轉移），經濟基本分析很有幫助。


    問：如何處理價格衝擊事件？


    價格衝擊事件是指足以造成價格大幅波動、流動性減少的'
