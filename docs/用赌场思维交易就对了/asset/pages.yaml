  md: '# 跳空缺口的交易


    繼續觀察圖 8.21，我們發現 2010 年 12 月 29 日的開盤價向上跳空。當日沖銷者經常把跳空缺 口和開盤價格區間突破看成一體。缺口是指前一天收盤價和今天開盤價之間沒有交易的空檔。技術分析者把缺口分爲兩類，一是沒有被填補的缺口，一是被填補的缺口。缺口被填補，通常都不利於開盤價格區間突破的操作。開盤區間突破的交易，通常會把起始停損設定在跳空缺口的端點（參考圖
    8.21）。


    關於跳空缺口的交易，很多人會採用第二個確認準則，譬如：跳空開盤價格區間的突破，成交量必須放大，或價格必須突破前一天的高價或低價。


    案例：Altria Group Inc.：2010 年 12 月 29 日，價格走勢整天都守住下檔支撐 $24.70。12 月 30 日，開盤價格向下跳空突破
    $24.70 支撐，我們因此在 $24.67 建立空頭部位。起始買進停損設定在原先支撐 $24.70。此處把開盤價格區間定義爲開盤最初 15 分鐘交易的價格區間。開盤價格區間確定之後，態度較保守的交易者就可以把停損調整到開盤價格區間最高價上方一檔。這個價格區間如果向下突破，就可以確認向下跳空跌破
    $24.70 支撐的事實。早上 9：45，開盤價格區間被突破，這時候也決定了 50% 部位獲利了結的目標價位：突破線形下側端點 $24.60 的下方 1 檔（$24.59）。'
