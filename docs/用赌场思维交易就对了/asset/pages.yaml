    # 運用技術指標界定價格波動


    實際討論價格波動指標之前，首先要釐清一種常見的誤會：有些人可能認為，價格波動指標可以用來判定行情發展方向。實際上並非如此。除了 VIX 之外^{註 18}，幾乎所有價格波動指標（包括本章所討論的）都只是用來顯示資產價格波動程度的變動，它們全都跟價格發展方向無關（請參考圖
    4.5）。'
