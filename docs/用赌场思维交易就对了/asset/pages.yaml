- pgno: 38
  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_38_0.png)


    海珊被捕的消息只造成短線價格衝擊


    至於短線價格衝擊，我最喜歡引用的例子，是 2003 年 12 月 13 日星期六海珊總統被捕的消息。隔天，12 月 14 日星期天，現貨市場開盤時，美元兌換歐元的匯價暴漲。可是，在隨後
    24 小時過程內，外匯交易者慢慢察覺海珊被捕對於美元匯價不該造成長期影響，於是美元匯價便很快又回到原先的價位附近（請參考圖 1.13）。


    對於正值期望報酬交易模型的運作來說，我們爲何要重視辨識價值出現根本變動的能力呢？因爲這類模型基本上都是採'
  merge: -1
  img_proc: true
- pgno: 39
  md: '用移動平均、包寧傑帶狀…等數學化技術指標。如果完全不顧慮根本價值變動，則使用者就有可能錯誤解釋技術指標所顯示的意義，因此而誤判價格行為與資產價值，尤其是採用回歸均值的模型時，更是如此。


    如果是採用以數學法則為基礎的季節性型態模型，就需要特別注意異常年份。關於異常年份的例子，可觀察無鉛汽油對熱燃油之間的價差。一般來說，春天期間，無鉛汽油價格總是高於熱燃油，而價差通常會在
    5 月份達到高峰，這主要是預先反映夏天的車輛用油旺季（請參考圖 1.14）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_39_0.png)'
  merge: -1
  img_proc: true
- pgno: 40
  md: '可是，2008 年出現異常狀況，實際價格走勢不同於過去的季節性型態，主要是因為開發中國家對於熱燃油的需求旺盛，導致熱燃油相對於無鉛汽油的價格高漲（無鉛汽油並不是開發中國家的主要運輸燃料），請參考圖
    1.15。如果盲目相信技術性模型而漠視基本面變化，交易者可能就會把這種異常現象視為賺錢良機，因此趁低價買進無鉛汽油，同時放空價格偏高的熱燃油。反之，交易者如果兼顧基本面消息，就會察覺到石油產品價格關係出現了根本變動。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_40_0.png)'
  merge: -1
  img_proc: true
- pgno: 41
  md: '關於短線衝擊事件，我經常聽到交易者將此視爲機會各半的隨機事件。換言之，他們完全不重視這類短線價格走勢，因爲他們相信這些事件長期而言不會造成影響。可是，經過多年深入研究之後，我可以跟各位報告一個結論：短線價格衝擊並不屬於機會各半的事件。如果你順著長期趨勢（1到6個月的趨勢）發展方向建立部位，就有更高機會站在正確的一方。反之，如果採用回歸均值模型，就比較可能站在錯的一方（如圖1.16）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_41_0.png)


    圖1.16 在2001/09/11之前，E-Mini S&P 500的2001年9月期貨合約都還一直維持在略低於40天移動平均線的附近'
  merge: -1
