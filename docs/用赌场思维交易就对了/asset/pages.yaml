    # 參酌價格波動指標，建構正值期望報酬模型


    前文談到我們可以藉由兩種方式運用價格波動指標。第一，用以辨識價格波動特別穩定的期間，採用順勢交易模型，嘗試掌握走勢突破橫向盤整的契機。第二，用以辨識價格波動特別劇烈的期間，採用逆勢模型，試圖掌握價格波動率回歸均值的行情。'
  merge: -1
  img_proc: true
- pgno: 135
  md: '關於第一種情況〈預期行情突破盤整走勢，結合價格波動指標而採用順勢交易系統〉實際運用方式很多，但此處只準備介紹最簡單的例子。首先，我們要找到某種價格波動指標，用以判斷價格波動穩定的期間。雖然可供運用的指標很多，但此處採用
    ADX，因為其讀數含意適用於所有資產與計算期間。我們決定採用 10 期 ADX，因為這是一般最常用的期間長度，此外沒有什麼特殊理由。另外，所謂「價格波動穩定」，我們將其定義爲
    10 期 ADX 讀數低於 20。


    其次，我們需要建立某種客觀的數學準則，用以判斷所謂價格波動的突破。同樣地，這類的準則也很多，但基於方便起見，我將此定義爲價格穿越 20 期包寧傑帶狀的上限或下限。最後，我們還要設定絕對客觀的風險管理法則，還有獲利了結的準則。爲了單純起見，多頭部位進場之後，追蹤型停止賣單設定在最近
    3 天期的最低價，空頭部位進場之後，停止買單設定在最近 3 天的最高價（請參考圖 4.20）。'
  merge: -1
