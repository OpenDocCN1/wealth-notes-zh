    20 天期包寧傑帶狀的下限，則建立空頭部位。


    另外，當價格反向穿越先前 20 天價格的簡單移動平均，則結束既有部位（換言之，對於多頭部位來說，出場訊號是價格跌破 20 天簡單移動平均；空頭部位的出場訊號，則是價格向上穿越
