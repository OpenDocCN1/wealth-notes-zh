    Long Entry:


    RSI(@, 9) [-1] > 65


    Long Exit:


    LoLevel(@, 3)[-1]


    Short Entry:


    RSI(@, 9) [-1] < 35


    Short Exit:


    HiLevel(@, 3)[-1]

    ```


