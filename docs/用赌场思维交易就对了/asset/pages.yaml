    期 ADX 讀數雖然超過 50，資產價格還是有可能持續呈現趨勢走勢。對於這類高價格波動市場，即使價格波動有放緩的跡象，交易系統仍然要額外採用一項法則，規定價格必須跌破前一天的高價才能買進（突破前一天低價才能放空），如此才可以減緩假訊號的可能性。本書第
