- pgno: 60
  md: '交易多少單位，才不至於發生信用過度擴張的現象？」關於部位大小的問題，最明顯的答案是：「部位要小到不至於讓正値期望報酬模型破産，另一方面，績效還要能超過無風險報酬。」這種答案在理論上雖然正確，但內容實在太過籠統，沒有實務運用價值。若想要回答這個問題，就應該檢視每筆交易的風險程度，與相關交易系統淨値最大耗損（峰值到谷底）之間的關係。


    關於部位大小設定，基本原則是取管理資産的 1% (註 10) 。換言之，任何單筆交易，其部位規模都不應該超過整體管理資産的 1%。對於一般結構健全的正値期望報酬模型而言，如果每筆交易所承擔的風險設定為管理資産的
    1%，則交易帳戶淨値由峰值到谷底的最大耗損，就應該不會構成致命傷害。


    > （註 10）請參考 Jack Schwager 的《金融怪傑》（Market Wizards, Marketplace Books, 2006，寰宇出版，F015/F016），第
    181 頁。


    讓我們回頭觀察圖 2.1 的英鎊 / 美元外匯交易歷史資料測試，其涵蓋期間由 2000 年 1 月 1 日開始，截至 2009 年 12 月 31 日爲止。假定我們只從事最基本的
    10,000 外匯現貨合約交易。我們知道最後該模型的獲利為 $5,974，但在過程之中，帳戶曾經出現過多達 $2,505 的淨値耗損。為了進一步釐清淨値最大耗損與
    1% 法則之間的關連，我們需要觀察模型如何因應單筆交易預期發生的最嚴重虧損。'
