  md: '# # 第4章


    ## 善用價格波動的循環性質


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_113_0.png)


    > 巴卡拉賭場的莊家拿著一根可伸縮的棍子，把大家的賭資收攏。如果我可以向他借那根棍子，我就發了。


    —— 馬克·吐溫


    市場價格波動具有循環性質，此乃發展正值期望報酬模型的最重要工具。此處討論將特別強調如何運用價格波動指標，藉以強化交易模型（不論順勢或逆勢系統）的功能。


    # ## 唯一不變的東西


    趨勢是你的朋友，相信各位都聽過這種說法。沒錯，趨勢確實是你的朋友…至少在趨勢結束之前是如此。不幸的是，趨勢結束時永遠不會在財經媒體或報紙上刊登新聞，所以我們無從得知趨勢是否持續發展。關於市場行為，我們經常聽到另一種說法：資產交易大約有70%的時間是處於區間震盪之中。這種說法雖然沒錯，但對於交易者也沒多大幫助，因為我們不知道交易區間什麼時候會被突破。總之，交易者沒辦法仰賴空頭趨勢、多頭趨勢，或甚至沒有趨勢。換句話說，金融市場唯'
  merge: -1
  img_proc: true
- pgno: 114
  md: '一不變的東西，就是變動。乍看之下，這種永遠在變動的性質，對於交易者似乎毫無幫助。實際不然，我發現，這是很多正期望報酬模型運用的核心觀念。沒錯，交易不能仰賴趨勢永遠存在或不存在，但我們知道橫向發展行情，最終會演變為趨勢明確的市場，反之亦然。我稱呼這種事實為「價格波動的循環性質」，這有別於市場不確定性（參考第2章的討論），可說是市場上唯一確定的東西<sup>(註17)</sup>。


    > （註17）關於價格波動循環的法則，只有一種例外情況：典範轉移（paradigm shift），譬如說，相關資產不再掛牌交易（比如掛牌股票因為公司破產而下市）。


    不可否認地，我們永遠都無法預先得知價格波動緩和的橫向走勢，什麼時候會變化為趨勢明確的市場，也同樣無法知道價格波動劇烈的行情，什麼時候會緩和下來，但我們知道價格波動的既有情況持續得愈久，轉變為反向情況的機率就愈高。


    關於價格波動的循環性質，我最後想強調一點：價格波動市況生而不平等。如同各位將在本章看到的，當價格波動由劇烈轉趨穩定而採用逆勢模型進行交易，其風險程度將超過相反市況下運用順勢模型進行交易。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '為了說明運用於低價格波動市況下的突破系統，其風險通常較小的理由，且讓我們看看何謂低價格波動市況。低價格波動市況下，市場參與者對於資產價值存在著高度共識（所以價格很穩定）。當某種資訊發生而讓人們對於資產價值的看法產生根本變動，於是市場價格波動轉劇，趨勢持續朝突破方向延伸的可能性極高。


    讓我們藉由圖 4.1 做說明，這是 CME 高級銅 2010 年 9 月份合約的走勢。


