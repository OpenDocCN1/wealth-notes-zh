  md: '就會發現更大的麻煩。某些資產之間的價格相關很穩定，譬如澳幣/美元匯率與 S & P 500 迷你期貨；但另一些價格的相關性，則出現重大變動。正因為歷史相關性會出現重大變動，所以除了進行壓力測試（價格相關分析）之外，還要進一步分析
    VaR。


    以上說明 VaR 如何讓停損與部位規模設定更穩健，接著我們要探討 VaR 做為風險衡量工具時，如何結合歷史價格波動率與價格相關性，以衡量投資組合未來的風險。本書不準備詳細討論
    VaR 的內容。在我的另一本著作《機械化交易系統》（Mechanical Trading Systems）中，簡單扼要地說明了 VaR 的概念：


    風險值方法計算交易資產或投資組合的標準差 (standard deviation，也就是歷史價格波動率 historical volatility)，以及各種資產彼此之間的歷史價格相關，試圖回答一個重要問題：「正常市況下，投資組合在未來某特定期間內虧損
    X 金額的機率有多高？譬如說，某避險基金表示，其每天的 VaR 為 $3,000 萬，信賴水準為 95%。這代表什麼意思？這表示該避險基金的投資組合，在未來
    24 小時之內，虧損不超過 $3,000 萬的機率為 95% (註 13)。


    （註 13）請參考我的第一本著作 Mechanical Trading Systems (John Wiley & Sons, 2004)，第 170 頁。'
