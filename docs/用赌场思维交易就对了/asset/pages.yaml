    # 回歸均值交易者面臨的困擾


    回歸均值交易者也會因為種種理由，而對先前的決策感到懊悔。有些問題很容易運用本章介紹的方法獲得解決，另一些問題則很棘手。根據定義，資產價格回歸均值的發展過程中，交易部位經常會過早獲利了結；因此，如果價格從回歸均值的狀
    況演變爲趨勢明確的走勢，交易者就會錯失一大段行情。


    請參考圖 6.6，其中顯示歐元 / 美元現貨匯率走勢。2010 年 11 月 5 日，9 天期 RSI 向下穿越超買線而展現回歸均值的走勢。次個交易日，2010
    年 11 月 8 日，交易者按照開盤價 1.4060 建立空頭部位，起始停損設定在前一天高價 1.4248，獲利了結的限價買單則設定在前一天的 20 天簡單移動平均
    1.3955（參考圖 6.6）。空頭部位雖然在同一天內就獲利了結（每 100,000 基準貨幣獲利 $1,050），但在隨後的 6 個交易日之內，價格繼續下跌到循環低點
    1.3447，所以交易者嚴重錯過了一個大好的機會。'
