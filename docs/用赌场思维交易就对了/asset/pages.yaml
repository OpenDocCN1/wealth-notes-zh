- pgno: 146
  md: '交易者為何會過早獲利了結？為何不讓獲利部位持續發展？理由很簡單，他們怕煮熟的鴦子飛了，更害怕部位轉盈爲虧。害怕得而復失，這種心理影響很大，因爲交易者將因此沒辦法掌握眞正賺大錢的好機會，擔心有太多錢留在桌面上；換言之，你原有機會賺大錢，結果卻沒能好好掌握。交易者往往把多頭部位的出場點，設定在過去的價格高點附近。當價格漲勢逼近歷史高點時，可能發生兩種情況。第一，價格可能穿越先前的高點。這種情況經常發生，因爲行情總是會繼續上揚的。若是如此發展，我們就會後悔在先前的
    高點附近過早獲利了結。另一種可能發展，是價格沒能穿越先前高點；此時交易者若非要等到價格突破前高，而未動態調整停損點，最後或許就要面對帳面獲利得而復失的遺憾。事實上，以這兩種可能發展來說，交易者考慮的都是價格，而不是價值。


    關於這個問題，眞正的解決辦法，是從一開始就要瞭解，交易基本上不可能賣在最高點，或買在最低點，所以我們不該執著於不可捉摸的完美進 / 出場點，而應該考慮市況動態（由支撐、壓力、價格波動程度等因素界定）。如同我常說的，「永遠要根據價值做交易，而不是價錢。」人們總是擔心帳面獲利得而復失，結果導致部位過早獲利了結；爲了避免發生這種情況，正值期望報酬模型應該根據市況動態設出場法則，不該設定武斷的金錢價格目標。如果眞擔心帳面獲利演變爲實際損失，可以考慮把部位停止點儘快調整到損益兩平點。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '還有一種說法，「總有某個價格是你願意結束部位的。」如果我採用中、長期順勢模型放空某資產，確實有個價位是我願意出場的：那就是零。除此之外，我絕對不願設定任何武斷的金錢目標，並因此放棄部位的獲利潛能。為什麼？因為我的經驗顯示，任何價格都是可能的。身為交易者，我們對於行情的判斷，會受到最近與目前價格的影響。理想狀態下，我認為交易者不該因爲目前、最近或任何歷史價格影響而產生偏見，應該要訓練自己相信任何價格都可能發生。由於我相信任何價格都是可能的，所以在進場之後，會毫不猶豫立即設定停損，因為我知道有某種價格會勾消交易帳戶。如果我承認有某種價格會把我三振出局，那就不能排除有某種價格會讓我發大財的可能性。如果不設定停損，那麼在市場發展到最終高點或低點之前，我們的帳戶恐怕早就破產了；同理，市場的漲勢或跌勢，最終絕對會超越我們獲利了結的價位。可是，如同我經常說的，「即使不完美，你也可以賺不少錢。」


    # 寶貝兒子需要一雙新鞋


    這句話源出於賭場，賭客擲骰子之前，往往會唸這句咒語，希望能夠因此取得較高的勝算。金融交易設定某種金額目標，不論是一般性的，譬如每天$1,000，或是特定的，譬如：$3,500的房貸，都同樣會造成不利的影響，因爲這等於是針對市場活動設定了某種武斷的目標。市場根本不關心你是否需要$300或$300萬，如果透過某個金額數字來思考市場，將會讓交易者再也不能清晰看到市場的動態結構（價格波動程度、支撐、'
  merge: -1
  img_proc: true
- pgno: 148
  md: '壓力等）。想要像賭場一樣經營交易，我們就應該以機率（而不是個人的某種金錢需求）為立場來思考獲利。


    我相當熟悉「寶貝兒子需要一雙新鞋」的心態，因為當我在 1987 年剛買下紐約期貨交易所席位的時候，就爲剛成立的公司設定一個目標：每星期獲利 $2,500。我們只想到鈔票，而不是市場。毫不意外地，這個金額目標變成套在身上的枷鎖，讓我再也沒辦法靈活因應市場動態或機會。乍看之下，這似乎是經營事業的合理方式，但金融交易不屬於一般行業，不是工作
    X 小時，就能賺進 $Y 薪水的。經營這種行業，你必須讓自己適應市場其他參與者的情緒變動，貪婪、恐懼、無聊…等。市場有時候願意每星期給你 $2,500，有時候只有
    $500，但也可能是 $500 萬。我們習慣於每個月都有固定的收入，因爲我們的支出相當固定…但市場根本不知道這些，市場不理會我們每個月要支付多少帳單，也不關心我們的寶貝兒子是否需要新鞋。忘掉金錢目標吧；市場願意給多少，就拿多少。


    現在過了 20 多年，我從慘痛的經驗裡學到一項真理：要針對市場進行交易，而不是針對金錢。現在，每當我在月初期間就有不錯收穫時，有些不瞭解交易市場的朋友往往會說，「哇，今天才
    5 月 6 日，你已經賺了 9%。這個月最好不要再交易了，免得把賺到手的錢又賠掉。」這種說法強調的也是金錢而不是市場。市場不知道你已經獲利 9%，也不知道你已連續取得
    5 筆成功交易或連賭賠了好幾筆交易，市場不僅不知'
  merge: -1
  img_proc: true
- pgno: 149
  md: '道這些事，而且也不關心。市場只是提供給你每個月、每個星期、每天 24 小時參與交易遊戲的機會。至於你是否要設定某種莫名其妙的金錢目標，那完全是你個人的事。這跟市場完全無關，也不會影響市場將提供給你的任何東西。


    還有一種剛好相反的非理性心態。當這個月賺的錢已經足以付清房屋貸款之後，有些人的交易行爲就變得更積極、莽撞。這種態度也是針對金錢而不是市場。賺了一點錢之後，交易系統的勝算並不會因此提高，所以風險管理法則沒理由因此鬆懈。建立部位之後，即便是在獲利了結之前，那些帳面獲利也是你的錢，處理態度理當一樣。


    很多交易者在碰到虧損或連續幾筆虧損之後，心態上就會變得很在意金錢。突然之間，他們不再重視市場動態或機率，只希望能夠扳平。請注意，這種心態是相當危險的，因為這不只是針對金錢做交易，而且交易者只盼望「不輸」，而不是「贏」。一般人碰到連續虧損時，難免會開始懷疑：「我的交易系統是否真的具備正值的期望報酬？」「我是否應該繼續嚴格遵循風險管理法則？」這些問題的答案如果都是肯定的，就應該繼續按照計畫進行交易，不該受到連續虧損的影響。


    # 拿禁不起虧損的錢做交易


    如果根據單純的金錢考量（不理会市況結構）設定停損或獲利目標，這就是針對金錢而不是市場做交易。可是，這種說'
  merge: -1
  img_proc: true
- pgno: 150
  md: '法有個例外。我們往往會規定，任何單筆交易承擔的風險不得超過整體帳戶淨值的 1% 或 2%。乍看之下，這個法則似乎也是針對金錢做交易。但實際上根據這個規定，我們是按照市場結構設定停損，其金額不得超過前述
    1% 準則。所以，我們仍然是針對市場進行交易，只是這方面的判斷必須受到 1% 準則的限制，讓正值期望報酬模型有充分的機會發揮其正值報酬潛能。這如果意味著我們只能買進
    200 股單價 $25 的微軟，而不是 200 股單價 $600 的 Google，那也只能如此了。總之，我們要讓交易系統有機會發揮其機率上的優勢，不該讓價格波動程度較劇烈的資產憑空享有較高的停損額度，只因爲如此更「刺激」一些（請參考表
