- pgno: 255
  md: '2010年5月6日，價格繼續下跌，距離我的停止賣點92.70只有幾檔，我打電話給一位老朋友抱怨：「這筆交易，我可能浪費了很好的機會，把一大筆錢沖到馬桶裡。就在昨天，行情還在測試上檔壓力，現在卻逼近下檔支撐，說不定等一下我的空頭部位就會成交，然後價格卻又回到95附近。」他問，「那你要改價嗎？」我說，「不，當然不。只是覺得挫折感蠻重的。」掛了電話之後，我設法讓自己平靜下來，重複默唸著：「不要猜測，只要參與。」我琢磨著，「在這裡建立空頭部位讓我覺得很不舒服，大家都覺得不舒服……不舒服才會賺錢，舒服就會賠錢。我適當地管理風險，按照機率進行操作。至於行情要怎麼發展，就怎麼發展吧。」


    早上11:30左右，我的空頭部位在92.74成交。到了下午1:45，價格跌幅已經很大，讓我足以把停損買單向下調整到進場點92.74。經過大約15分鐘之後，跌勢變得更凶猛，一口氣跌到89.97。到了下午2:45，價格跌到89.00，這是外匯市場交易史上最大的單日走勢之一。我原本認為的「錯失機會」，結果卻是2010年獲利最豐碩的交易（請參考圖9.8）'
