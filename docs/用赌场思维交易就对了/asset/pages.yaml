- pgno: 143
  md: '# 第 5 章


    # 針對市場進行交易 而不是為了錢


    > 如果有人為了急需用錢而從事股票交易，結果會如何？在這種妄想下，他其實是在賭博。所以，他承擔的風險將遠超過精明的投機。

    — Edwin Lefevre


    投機客到頭來為什麼會針對金錢做交易，而忘了市場行情？本章將討論投機客針對金錢做交易的幾種情況，包括：不理會市況而設定金錢目標、基於金錢目標（而不是市況發展）獲利了結、不考慮價格波動狀況而盲目設定金錢停損（只因爲害怕虧損）。


    # $1 萬塊是很多錢


    著名投機客巴魯克（Bernard Baruch）曾經說過，「獲利了結不會讓人賠錢。」對於這種說法，我的觀點是，「話雖如此，但你所賺的錢，卻有可能在隨後 3
    筆交易虧光。」如果我們總是想趕快獲利了結，賺些蝨頭小利，恐怕將難以應付失敗交易的虧損。多數書籍雖然都鼓勵交易者儘快認賠，並且讓成功部位儘可能繼續發展獲利，但我們總是想著錢，而不是市'
  merge: -1
  img_proc: true
- pgno: 144
  md: '況，所以當我們忍不住將令人渴望的未實現獲利轉換為實際金錢時，我們也就提早結束部位了。本書第 6 章將講述一些方法，協助交易者一方面獲利了結，另一方面又能讓某些部位繼續發展。相反地，本章將專注說明中、長期交易者過早獲利了結的種種問題。我們從事金融交易，目的就是賺錢，所以交易者很自然就會去實現成功部位的獲利。可是，這種讓我們覺得理所當然的做法，往往也就是導致交易失敗的關鍵之一。反之，那些不自然、讓我們覺得不舒服的做法，往往才能讓交易成功。更簡單說，不妨把金錢看成毒藥。交易的對象是市場，不是金錢。每年都會有一些案例，我們可以看到重大走勢演變為驚人行情，但一般沒有經驗的交易者卻滿腦子只想到金錢，輕易地獲利了結，捨棄掉曾經掌握在手中的爆發性賺錢機會。


    讓我們看看一個典型的案例，這是 CME 天然瓦斯期貨發生在 2008~2009 年期間的一段走勢。2008 年 7 月 8 日，價格跌破重要支撐，很多技術性玩家在
    $12.628 放空。隨後一個星期內，價格再度跌破 $11.53 重要價位，這段發展代表每口合約的未實現獲利為 $10,980。對於多數人來說，1 萬 1
    千美元是相當可觀的一筆錢，尤其是在短短 5 天內賺到的（請參考圖 5.1）。可是，市場並不瞭解「相當可觀的一筆錢」是什麼意思，它只知道價格在隨後 9 個月內跌到
    $3.155，長期順勢交易者每口合約將可因此賺進 $80,000（如果在 $12.628 放空的話）。問題是：你是否能把握市場提供的機會，讓市場走勢本身決定你什麼時候獲利了結，或者你準備設定某種武斷的金錢獲利目標，規定自己在多少時間內、賺進多少錢（請參考圖
    5.2）？'
