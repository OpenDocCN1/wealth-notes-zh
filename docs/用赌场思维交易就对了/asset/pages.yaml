- pgno: 4
  md: '# 推 薦 序


    操盤手與職業賭手的賺錢方式是相同的。


    早期研究投資加碼策略時，研究過金字塔、倒金字塔、等量、變量等策略，如今看到本書提到這些方法，都與賭場的賭博策略一樣，才發現投資、投機與賭博之間，有這麼多的共通點。


    本書一開始就道破交易與賭博間的共通點，也就是李佛摩說的，只在勝算大的地方下手。用本書的話語來說，就是發展正值期望報酬模型。簡單來說，投資、投機、賭博要贏，就必須找到勝算較大的地方下單或下注。本書第一章就導入大量技術分析，藉以發展出勝算較大的系統與模型，接著談停損、停利、風險管理，再運用投资策略中「嚴守紀律」的規則來貫徹執行。


    第二篇談工具與技巧。什麼是工具？例如「均線、五日線、季線」皆屬之。什麼是「技巧」？例如股價持續在五日線之上屬短期上漲趨勢，在五日線之下則是短期下跌趨勢；若以季線'
  merge: -1
  img_proc: true
- pgno: 5
  md: '來看，只要把前面的「短期」換成「中長期」即可，這便是活用的技巧。投機要賺錢，當然得先找對工具，再熟練運用的技巧。本書以各式技術指標為工具、並正確運用技巧，導出「正值期望報酬模型」，最後再運用時間架構，演化出成熟完整的系統架構。


    本書最後以問答的方式，剖析人性對交易造成的阻擾。貪與怕，是人性最大的弱點。本書最後一篇討論人性與投資心理如何在交易中扮演阻撓者。一切投機獲勝的障礙，皆來自人性的弱點。唯有超越障礙、脫離人性情緒的干擾，才能成功獲利。


    有兩段與本書相關的專訪影音檔，可供大家參考。在「賭博與投機的異同點」中，一位成功交易員曾在專訪中談到賭場賭博；另外在「從操盤手到職業賭徒」中，一位曾是成功交易員的賭場職業賭手也談到，在賭場中如何才能經常賭贏，而賭博與交易又有哪些相同點。其中的關鍵是：在勝算大的地方下手、風險管理、正確的策略與模組、嚴格的紀律、擺脫情緒、去除人性的弱點。結論就是，正確的賭場思維，可造就成功的交易員。


    如果您對技術分析技巧、投資交易策略、人性投資心理，交易模組等議題有興趣，本書將成為您的最愛。作者將正確的思維、成功獲利的方法與模組，依序逐步寫出完整的交易操盤技巧，並無私地與讀者分享。好書值得推薦！樂意於此寫下推薦序。


    探金實戰系列作者 齊克用'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# 前 言


    > 除非作弊，否則你絕對無法擊敗賭場輪盤。

    — 愛因斯坦


    一年前，我跟一位陷入掙扎的交易者談論專業投機交易的種種。他提出一個問題，而這個問題最終驅使我出版了這本書。問題是：「真有人可以藉由金融投機牟取生計嗎？」這個人把一輩子的積蓄都押進去了，卻不知道是否真有人可以藉著投機交易賺取生計。回想當初剛踏入這個行業時，我也有類似的疑問。各位如果選擇這本書，心中有著類似的疑惑，那我要跟大家分享一些好消息和壞消息。


    好消息是前述問題的答案是「肯定的」。是的，專業投機確實是個可行的行業。沒錯，這是可以辦到的；不論是過去或現在，很多專業交易者都能辦到這點，相信將來也是如此。這不是偶然的現象，他們憑藉的也不是運氣。壞消息是：金融投機可能是個最艱辛的行業，因為從業者必須持續做些人性心理'
  merge: -1
  img_proc: true
- pgno: 7
  md: '上最難接受、最不自然的行爲（在本書探討過程中，我們將會經常深入談論交易之所以困難的理由）。


    所以，如何讓不確定的投機交易，轉變爲可行的事業呢？我們不必從頭開始，也無需仰賴運氣或禱告。我們只要把一個成功的既有商業模型，運用於投機活動就行了，而這套模型就是所謂的賭場典範^{(註
    1)}（casino paradigm）。賭場是怎麼賺錢的呢？輪盤賭博每次的勝負雖然都是隨機的，但賭場並不擔心，因爲他們享有機率上的優勢。對於金融交易而言，這種優勢也就是交易模型具備的正期望值（positive
    expectancy）。如果不考慮流動性風險（譬如模型所設定的進出場價格，與實際進出場價格之間的價差）與佣金成本，以一個具備正期望值的交易模型來說，只要交易筆數夠多、運用的時間夠長，就能賺錢。


    （註 1）雖然很多書籍都曾經談過「賭場典範」的概念，但討論最完整、最徹底者，應該是 Mark Douglas 的 Trading in the Zone (Prentice
    Hall, 2001)，第 101~106 頁。


    假定有位億萬富豪走進賭場，身上帶著 10 億美元的現金支票；我想，賭場的出納應該會很樂意兌換籌碼給他。可是，如果他到輪盤賭桌，要求把 10 億美元籌碼一次全部都押在紅色，管理員會很有禮貌地告訴他，輪盤下注有一定的金額限制，每次賭金不可超過
    $10,000。可是，賭場如果擁有勝算，'
  merge: -1
  img_proc: true
- pgno: 8
  md: '爲何要限制下注金額呢？因爲賭場知道他們雖然擁有優勢，但單次輪盤轉動大有可能出現紅色，若接受那麼大的賭注，只要輪一次賭場就垮了。所以，賭場要限制最高下注金額，迫使賭徒繼續玩下去，而賭場享有的機率勝算，最後終將讓他們贏得全部的
    $10 億美元。有關最高下注金額的限制，在金融投機交易領域裡，我們稱爲「風險管理」。


    賭場模型還有一項特質。因爲賭場在機率上佔有優勢，所以他們並不在意短時間內的輸贏或盈虧。當賭客贏錢的時候，賭場老闆不會慌張或失望，也不會暫停營業。他們會繼續營運，繼續發揮機率優勢，繼續管理風險。他們會堅持每天營運
    24 小時，每個禮拜營運 7 天，每年營運 365 天。不論任何一天、任何一週或任何一個月的營運結果如何，他們都會按照既定準則營運。在金融投機領域裡，持續堅持獲利期望值爲正值的交易模型，並做好價格風險管理，這稱爲交易者紀律（trader
    discipline）。


    成功的投機交易模型，其複雜程度當然遠超過賭場模式，這也是本書準備詳細討論的內容。從這個角度來解釋，讀者應該也就不難理解本書書名所代表的意義了。成功的交易者不忌諱從樓梯下方走過，交易帳號的末尾兩個數字也不必迴避
    13 這個數字……這些都不會有影響，因爲真正的金融投機交易靠的不是運氣。只有賭徒才需要運氣，專業投機考究的是機率優勢與風險管理。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '本書是按照由簡入繁的步驟講解。第1章將詳細說明交易的賭場模式與正期望值的模型。首先，我們將觀察技術分析爲何有助於發展正期望值的交易模型，以及單獨運用基本分析做交易的缺失。然後，我們將討論技術分析的限制，以及如何藉由基本分析減緩這方面的限制。


    第2章將探討交易賭場模式與價格風險管理之間的關係。本章將介紹我所謂的風險管理金字塔（*risk management pyramid*）。金字塔的最底部，是傳統的價格風險管理工具，譬如：停損設定、部位規模設定等。中間層級則是投資組合管理學派所採用的工具，譬如：風險值（*value-at-risk*）與壓力測試（*stress
    testing*）等。金字塔的頂端，則是涉及風險管理經驗的定性分析（*qualitative analysis*），我稱其爲管理裁決（*management
    discretion*）。


    第3章是賭場模型介紹的總結，並深入討論交易者紀律。我們首先界定投機交易紀律的意義，然後說明維持交易紀律的困難之處。接著，我們講解交易紀律與交易模型、風險管理之間的關連。交易者如果不能秉持嚴格的紀律，勢必會減損正期望值交易模型的續效。交易模型不論多棒，總會碰到不適合其運作的市況。處在這種市況下，交易者要有耐心，要嚴格遵守紀律，尤其是不進行交易的紀律，直到市場恢復有利於模型運作的狀況爲止。本章最後將觀察幾種適合交易者運用的市況，以及相關的陷阱。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '第 4 章探討一種相當神祕的市場性質：價格波動循環。沒有 有人可以擔保市場什麼時候會呈現趨勢、回歸均值、上升或下 降。我們唯一能夠確定的是，市場的價格波動總會呈現循環現
    象；換言之，價格波動會由劇烈而緩和，然後再由緩和而劇烈。 本章將介紹價格波動的各種衡量方法，並說明如何將其納入交 易模型。


    第 5 章準備處理一種相當致命 的問題，即使是最棒的正期 望值交易模型也會受到嚴重影響。我稱呼這種現象是「為了錢 做交易」。沒有經驗的交易者，其思考經常會以「錢」為中心。
    2008 年時，原油價格由每桶 $147 下跌到 $135，跌幅為 $12， 相當於每口合約價值 $12,000 的走勢。很多交易者覺得很滿意， 於是獲利了結，結果只能在場外看著價格在接下來幾個月內持
    續下跌，幅度高達每口合約 $100,000 以上。從事金融投機活 動時，交易者應該考慮的是行情，而不是鈔票。交易決策應該 由價格行爲主導，絕對不該根據你賺了多少錢或承擔多少風險
    而做情緒性的判斷。


    第 6 章探討如何儘量減少事後 的「懊悔」。當顯著的未實 現獲利，演變爲實現的虧損時，我們一定會覺得懊悔。若想要 處理這類的情緒反應，我們可以從技術面做考慮，在合理價位
    時先做部分的獲利了結，如此便可以避免過多的「獲利」後來 轉變爲「虧損」。還有一種相反情況，也會讓我們覺得懊悔， 那就是在我們獲利了結之後，市場出現重大走勢。爲了避免這'
  merge: -1
  img_proc: true
- pgno: 11
  md: '種情況發生，我們也可以考慮只做部分的獲利了結，而剩餘的部位，則可以運用追蹤型停止策略。


    第 7 章討論時間架構分析的重要性。首先，我們可以觀察這方面的傳統分析，換句話說也就是同時檢視多種不同的時間架構，讓我們更瞭解市場的實際狀況，同時也能夠掌握不同層次的技術支撐
    / 壓力。接著，我們介紹專業投機客經常運用的工具，我稱其爲時間架構背離（*timeframe divergence*）。當短期時間架構的走勢與較長期時間架構背離時，我們就可以順著較長期時間架構的方向進行交易，因為這通常代表低風險
    - 高報酬的進場機會。本章將協助讀者運用技術分析，讓各位更能充分運用交易機會。


    第 8 章討論各種正值期望報酬的順勢操作模型與回歸均值交易模型。另外，我們也會討論一些結合回歸均值技術指標的較長期順勢交易模型，讓使用者可以順著較長期趨勢方向，尋找低風險
    - 高報酬的進場點。


    第 9 章處理另一種交易者常犯的錯誤。我稱此爲「預先猜測訊號」（*anticipating the signal*）。人們之所以會預先猜測訊號，是因爲交易者通常都希望高價賣出或低價買進，而不想等到證據顯示頭部（或底部）已經發生之後才賣出（買進）。本章將告訴讀者，等待證據顯示頭部（底部）已經發生才賣出（買進）的優點，並討論幾種簡單的技術工具，協助交易者避免觸犯這方面的錯誤。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '第 10 章討論一些常見的交易陷阱，並且提供克服方法。我們將深入分析市場行爲，介紹一些技巧，協助交易者有系統地破除不切實際的幻想。然後，我們將探索一些有礙交易的情緒狀態，並協助交易者克服不理性的偏見。


    第 11 章廣泛探討一些有助於提升交易續效的分析方法。首先是一份問卷，協助各位瞭解投機活動應該留意的長處與短處，譬如：交易優勢判定、續效紀錄分析、交易方法、風險管理方法、交易執行考量，以及研究與發展的注意事項。然後，我會談論一種對於提升交易續效最有用、但經常被忽略的工具：交易日誌。


    第 12 章討論正值期望報酬交易模型操作成功所必備的一些心理議題。我稱此爲平穩心態（even-mindedness）。交易者如果運用正值期望報酬模型，而且採用適當的風險管理措施，就沒有必要擔心任何單筆交易的盈虧，因爲真正的關鍵是長期續效。如果太過在意單筆交易的輸贏，原因不外幾種：（a）對於自己使用的交易方法缺乏信心，（b）沒有做適當的風險管理，（c）受到先前交易經驗的影響，（d）沈溺於賭博心態。


    最後一章，我們將評估幾種工具和技巧，協助交易者控制情緒，以避免在陶醉與沮喪的兩個極端之間搖擺不定。


    理查·魏斯曼（Richard L. Weisssman）'
  merge: -1
  img_proc: true
