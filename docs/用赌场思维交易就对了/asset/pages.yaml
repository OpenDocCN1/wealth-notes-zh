    # 不要猜測，只要參與


    初學交易者總想要買低 - 賣高。本書第 6 章曾經討論過這方面的慾望，並稱其爲完美交易者症候群。交易者如果眞能買在最低點、賣在最高點，就能實現完美交易的目標，掌握市場全部的獲利潛能，交易也因此完全不會覺得懊悔，不至於招致任何情緒痛苦或潛在痛苦。我們雖然很容易理解追求完美的誘惑，但很多初學交易者也因此而被摧毀了。'
  merge: -1
  img_proc: true
- pgno: 253
  md: '完美交易者症候群代表我們追求完美、追求無風險報酬的慾望。反之，我則希望訓練交易者接受不完美與風險。成功的交易，必須放棄完美與舒適，轉而追求穩健。成功的交易，不應該去預測未來的行情走向或趨勢反轉，而應該參與當時已經被證實的趨勢，直到充分證據顯示趨勢發生反轉為止。這也是我經常說的，「不要猜測，只要參與（Don’t
    anticipate; just participate）。」


    # 突破案例：美元 / 日圓現貨匯率


    2010 年 4 月底，藉由 10 天期平均真實區間衡量的價格波動愈來愈穩定。隨著這種市況發展，下檔支撐 92.74 與上檔壓力 95.00 相當明確。5
    月初，我準備進行突破交易，決定把停止買單設定在上檔壓力 95.00 的稍上方，停止賣單設定在下檔支撐 92.74 稍下方（請參考圖 9.7）。2010 年
    5 月 4 日，行情向上測試 95.00，然後拉回，使得我更相信美元匯價即將突破 95.00 而展開一波多頭走勢。5 月 5 日，我又看到新的漲勢挑戰該壓力水準。我幾乎可以確定新的多頭行情已經展開。隨著價格由
    94.55 挺進到 94.65，然後是 94.75，我開始警告自己，「我是否認為 95.00 一定會被突破而等待進場機會？我不是專業玩家嗎？突破實際發生之前，我難道不應該提前預測嗎？」'
  merge: -1
