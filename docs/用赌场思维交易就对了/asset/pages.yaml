  md: '訓練初學交易者時，我發現有兩種情境很難克服：完美的進場價格，以及停損設定。很多人認為，只要進場價格正確，就不會發生虧損。因此，每當我要求學員們決定進場價格，並設定停損時，他們總是會猶豫或抗拒。他們在心理上，很難接受交易虧損的可能性。我們之間的對話往往如下：


