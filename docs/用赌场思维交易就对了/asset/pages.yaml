- pgno: 263
  md: '# 第**10**章


    # 超越障礙


    > 每件事都既真，也非真，同時是真亦非真，既非


    真，也非真。


    —龍樹（Nagarjuna）


    健全的交易心態，是金融投機成功最重要的條件之一。本章與第 11 章準備介紹一些技巧，協助各位克服有礙交易成功的偏頗心態，第 12 章則介紹各種工具，用以強化正確的交易行為。


    # 市場行爲的性質


    關於金融市場行爲，我們能夠歸納哪些一體適用、毫無例外的原則呢？所有的市場行爲都是多層面的、不確定的、持續變動的。想要歸納最根本的原則，我們就要剔除所有阻礙交易成功的無關妄想與偏見。


    # 多層面


    初學者總是想要找到最簡單的成功之道。不幸的是，交易'
  merge: -1
  img_proc: true
- pgno: 264
  md: '成功需要一套穩健而複雜的系統，也就是我所建議的賭場典範（casino paradigm）。對於初學者或外行人來說，我們之所以沒辦法提供一種簡單的投機成功竅門，主要是因爲市場行爲非常複雜，同時具有各種不同的層面。我經常說，市場行爲不是小孩子玩的那種「OX
    井字遊戲」，而比較像是三度空間的複雜棋局。


    談到三度空間的複雜棋局，初學者或許會覺得迷惑，因爲金融交易不是只要單純地買低 - 賣高嗎？更糟的是，除了「交易很簡單」的錯覺之外，我們也看到很多完全沒有交易經驗的人，他們可以大剌剌地進場買股票，然後在
    2、3 個鐘頭之後獲利了結。任何人如果提出這類論述，我希望提醒他，高爾夫球的初學者確實也可以擊出漂亮的一球，但這並不代表他可以在名人賽裡擊敗老虎伍茲。真正的成功者，必須有能力永遠保持高度的穩定性。


    事實上，一個完全缺乏技巧、沒有經驗的初學者，他之所以能憑過某筆交易賺錢，這正是市場行爲高度複雜的表現。從另一方面來說，市場行爲很複雜，甚至連我所建議的賭場典範也不全然足夠。金融交易者雖然可以像賭場經營者一樣，採用正値期望報酬模型，每筆交易都嚴格管理風險，但賭局所能夠做的某些限制，卻是金融市場所沒有的。譬如擲骰子賭局，每次只能由某個賭客擲骰子，而且骰子離手之後，其他賭客就不能下注了，賭客頂多只會輸掉下注的賭金，不會更多。這類的事，'
  merge: -1
  img_proc: true
- pgno: 265
  md: '限制都不存在於金融交易市場…風險、報酬沒有限制，任何人隨時都可以下單，同時可以下很多單…等。


    這就是我說「市場行為具有多層面」的意思，也是本章最初引用龍樹菩薩（Nagarjuna）教誨的理由。關於市場行為，初學者往往希望找到某種簡單明瞭的解決之道，但他們找到的每種東西都是既眞、也非眞，同時是眞亦非眞，既非非眞，也非眞。市場行為呈現的這種複雜、多層面性質，促使我們必須在無限之上設定限制。某些限制是交易者求取生存的必要之物（譬如：風險管理），但有些則是有礙成功或導致失敗的偏頗行為（譬如不願從事交易的一些莫名其妙禁忌：假日之前、星期五、艾略特波浪的第A浪與第C浪…等）。


    交易者必須拋棄錯誤的觀念，才能眞正面對多層面的市場行為，而且不至於因為太複雜而不知所措。整個程序雖然很艱難，但關鍵是要按部就班地一步一步走，盡量發揮自己的特長。舉例來說，初學者往往想盡快結束成功部位，失敗部位則儘可能拖延，結果「小賺大賠」就成為交易的常態；所以，第一步驟就是要發展正值期望報酬模型，任何部位都務必設定停損，而且部位只要出現顯著獲利，就應該把停損調整到損益兩平位置，同時成功部位要避免在最初第一天或第二天獲利了結。交易者一旦克服了「小賺大賠」的問題，眞能秉持「迅速認賠而成功部位持續發展」的原則，就可在市況條件允許的情形下，琢磨如何進一步採用分批獲利了結的手段。最終，累'
  merge: -1
  img_proc: true
- pgno: 266
  md: '積了充分的交易經驗之後，除了早期階段的機械性法則之外，也可以開始引用主觀判斷的準則。


    交易者經常說，「他們引發了我的停損單」，或「他們錯過了我的限價單」，好像把市場當作是對手。這種心態相當要不得，因爲這等於是推卸責任。我把這種態度稱爲「上帝旨意或歸咎他人」症候群。這些虛無縹緲的「他們」如果沒有引發我的停損，我就可以賺錢。事實上，心態成熟的交易者知道，市場不會針對我們故意做或不做什麼。如果我們的停損被引發，然後行情才朝原先預期的方向發展，那是因爲我們把停損設定得太緊密。體認市場行爲具有多層面性質，可以促使我們對於自己的交易負責。我們如果能賺錢，那是因爲我們的行爲與市場行爲一致；反之，我們就會虧錢。


    市場不會故意跟你作對或配合，因爲價格向上或向下的每檔跳動都是中性的。各位不妨觀察你沒有進行交易，也不打算交易的市場，就會發現情況確實如此，只因爲你的情緒沒有牽涉其中。然後，比較那些你正在從事交易的市場；突然之間，每檔價格跳動都會帶來痛苦或快樂。顯然地，這些情緒並非市場本身具有的，而是你加諸其上的。這類的情緒牽扯，讓我們沒辦法客觀判斷市況與各種資訊。一旦持有某種資產的部位，就會影響我們對於風險的評估能力（主要是害怕發生虧損），或妨礙我們對於獲利機會的評估能力（主要是擔心帳面獲利得而復失）。對於這兩種情況，交易者都會把非理性的情緒，強'
  merge: -1
  img_proc: true
- pgno: 267
  md: '加到中性、多層面的市場行爲上，因此侷限了我們客觀評估真實市況的能力，也妨礙了我們交易成功的能力。


    # # 不確定


    下一檔價格跳動究竟是向上或向下，沒有人能有絕對把握。由於金融市場隨時都存在不確定性，交易者任何時候、對於任何一筆交易，都不能放鬆風險管理。另外，由於市場行爲的不確定性，成功的交易者應該從機率角度做思考。強迫自己思考機率，這可能是交易成功最重要的關鍵之一。如果我們接受市場行爲的不確定性，就必須承認任何價格都是可能的，而在這種過程裡，無限而多層面的市場性質就會抹除任何妄想。


    初學者往往不知道如何處理金融市場行爲的不確定性。結果，他們可能反其道而行，想要尋找某種明確的解決之道。說來有些奇怪，本章想要提供的，也正是這種難以掌握的明確解決之道（但未必是初學者想要的）；「不確定性」就是所有交易者想要尋找而難以掌握的確定之物。由於不確定性隨時存在，這迫使我們必須針對當時市況做調整，而不是把我們的想法強加到市場上。'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# 持續變動


    「變動」是金融市場的另一項特質。價格的下個跳動雖然是不確定的，但不確定並不同於隨機。如果市場行為真是隨機的，那麼價格就會呈現鐘鈴狀常態分配。可是，實際分配卻有著高耸的峰位，以及肥厚的尾部（如同本書第
    1 章所談到的），所以這種不確定、持續變動的市況，提供了高勝算 - 低風險的機會。沒錯，我們雖然不確定價格波動是否會由穩定轉變為劇烈波動（反之亦然），但我们仍然能夠藉由正值期望報酬模型，運用這種價格波動循環性質（細節請參考第
    4 章）。


    遭逢連續虧損時，交易者通常會覺得喪氣，自言自語道，「他們把我搞慘了」、「我實在禁不起另一次虧損」、「交易簡直是不可能的」、「沒有人可以在這些市場裡賺錢」、「連續虧損永遠不會停止」……
    一旦落入這種負面的惡性情緒循環裡，我建議各位深呼吸，平靜地問自己一些問題：「我的交易方法是否具備正值期望報酬？」「我是否妥善管理風險？」這些問題的答案如果是否定的，就應該停止交易，直到你能重新發展正值期望報酬模型、穩定管理風險為止。


    反之，如果前述兩個問題的答案是肯定的，那麼交易者就應該強化下列概念，直到能夠重拾賭場典範、客觀看待市場為止。「市場行為是多層面的、不確定的、持續變動的。我採用一套穩健的正值期望報酬模型，而且隨時都做好妥當的風險管'
  merge: -1
  img_proc: true
- pgno: 269
  md: '理。任何交易模型都難免會失敗，虧損是從事金融交易不可避免會碰到的事件。因此，我要保持信心，按照預定計畫持續進行交易。」當各位籠罩在負面情緒、失敗虧損之中，務必要繼續奮戰，直到信心恢復為止。


    # 阻擾交易者成長的障礙


    整個交易生涯裡，我都秉持著佛教的宇宙觀，試圖解決交易過程可能遭遇的心理問題。更明確說，佛教有所謂的四魔（four maras）。「魔」（maras）是阻擾修佛過程的障礙製造者。就金融交易來說，這類障礙會阻擾我們客觀評估市場機會。這四種魔分別為：天魔、死魔、煩惱魔與五陰魔。


    這些障礙製造者看起來雖然都像客觀存在於外部的東西，實際上卻是幻象。舉例來說，不確定與虧損（關連著死魔）雖然是不可避免會發生的狀況，但它們只是主觀的痛苦與成長障礙。這些障礙製造者實際上是內部心理狀態的外部化；因此，想要克服這些障礙，也必須由內心著手，而不是外部。雖說如此，但我們多數人仍然把這些障礙製造者具體化，乃至於需要求助於佛陀（佛陀是已經克服障礙製造者的成道者；就交易來說，佛陀相當於頂尖交易者）或大師（大師是根據其經驗而教導人們如何克服障礙製造者的先行者；相當於交易領域裡的教練或專家作者），請他們協助與指點，藉以追求心理健全狀態（也就是本書第
    12 章所說的「平穩心態」）。'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# 虧損與不確定感的恐懼


    邁向交易成功之道的兩大障礙，分別是對於虧損與不確定的恐懼感（反映在交易上，就是擔心帳面獲利得而復失，結果演變為實際損失）。就佛教而言，這兩種障礙被人格化為死魔。


    金融市場的虧損，等同於我父親（他是股票選擇權經紀人）早在我還沒有從事交易之前教導給我的死亡。我記得他曾經指著華爾街三一教會墓園裡的一座墓，半開玩笑的跟我說，「華爾街有座墓園，每天都有初學交易者埋葬在此。」


    關於死魔，佛陀的教誨如何呢？想要克服這種障礙製造者，不能透過否認、憤怒、否定或沮喪等手段。死亡不會就此消失。你不能藉由意志力避開或克服死亡。若想要把死亡當作一種障礙來克服，只有接受與認同它。


    上一段文字裡，請各位把「死亡」取代為「虧損」。


    伊麗莎白·庫伯勒·羅斯（Elisabeth Kubler-Ross）在其《論死亡與臨終》《On Death and Dying》一書中指出了臨終前的五階段。這些階段也可以用來描述交易者所面臨的問題：虧損、缺乏控制力、不確定、懊悔，這些障礙讓交易者不能客觀觀察市場多層面的真實狀況。這五種階段分別為：


    +   1. 否認（denial）：說來或許令人難以置信，即使是最老練的交易者，我也聽說有人希望找到一套絕對不會發'
  merge: -1
  img_proc: true
- pgno: 271
  md: '生虧損的方法。不論是有意或無意，否認交易會發生虧損或市場存在不確定性，對於交易絕對會發生致命的影響，因為這讓我們不能從機率的角度思考，不能針對虧損預作準備，結果將是無法採行適當的風險管理措施。


    2. 憤怒（anger）：被迫承認虧損與市場不確定性時，我們的虛妄信念與市場的客觀真實之間就會發生衝突，結果讓交易者覺得憤怒。這種憤怒會向外發展，把客觀、中性的市場當做是洩憤對象，但怒意也會向內發展，因為我們必須承認自己錯誤、認賠…。


    憤怒如果能夠協助我們取得市場重要資訊，發展正值期望報酬模型，或協助我們更有效率管理風險，那麼一切還是值得的。這種可能性雖然不能說沒有，但應該非常罕見。反之，憤怒經常會讓我們喪失理智，沒辦法冷靜處理交易過程的種種問題。


    伴隨著憤怒而來的常見反應，就是報復性交易。報復性交易極具殺傷力，交易的動機不再是單純地賺錢，而是想扳回過去的損失。這種情況下，交易者要求市場必須做出某種行為，藉以勾消他們過去所犯的錯誤。所以，我們不只把市場看成是敵人，而且再也看不到其他交易機會。'
  merge: -1
