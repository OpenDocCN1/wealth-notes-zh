  md: '仔細檢視我們在 2010 年 8 月 30 日進場買進的 SPDR 黃金信託 ETF（代碼 GLD），就能說明月份績效紀錄的不足之處，以及為何要輔以多月份績效紀錄的理由。我們在
    2010 年 8 月 30 日買進黃金，8 月份根據市價進行結算的價格為每股 $120.91。可是，這只代表月底根據市價結算的價格。若要知道這筆交易最後的結果，就必須觀察多月份績效紀錄。參考表
    11.8，其中顯示該交易在 2010 年 8 月 30 日進場，然後在 2010 年 9 月 1 日出場。另外多月份績效紀錄也可以用來計算跨月份的淨值最大耗損，以及帳戶淨值創新高所需要的時間。


