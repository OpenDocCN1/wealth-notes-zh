- pgno: 260
  md: '# 結語


    想要在金融交易領域獲得成功，初學者需要學習很多工具和技巧，這是最主要的困難之一。很不幸地，交易者剛進入投機行業時，最初幾年恐怕要學著忘掉其他生活領域裡賴以成功的許多經驗。從事金融交易之前，我們都習慣買價格便宜的東西。正因為這個緣故，沃瑪特（Walmart）才能成爲最大的跨國企業之一。可是，這類的經驗卻不適用於金融投機交易。類似如安隆（Enron）和雷曼兄弟（Lehman
    Brothers）之類的便宜股票，價格只會變得愈來愈便宜；反之，類似如伯克夏·哈莎威（Berkshire Hathway）等高價股票，股價卻愈來愈高。各位如果想在金融交易領域內獲致成功，就必須想辦法訓練自己不要去預測交易訊號；沒錯，這很困難，因爲這違背了人們的自然天性，但也正因爲如此，所以才是有效的。'
