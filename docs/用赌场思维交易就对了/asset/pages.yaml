- pgno: 117
  md: '反之，讓我們考慮價格劇烈波動的市況下，等到指標顯示價格波動創峰位而開始下降時，交易者開始採用逆勢系統。這種情況下，交易者承擔的風險較高（相較於價格波動由穩定轉趨劇烈而採用順勢系統）。後續發展仍然有兩種可能性：走勢確實回歸均值，或者沒有。請注意，如果走勢沒有回歸均值（交易失敗），價格將恢復劇烈波動，因此風險也偏高。請參考圖
