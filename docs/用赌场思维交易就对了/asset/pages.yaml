- pgno: 151
  md: '不理会資產價格波動狀況，單純採用某固定金額做爲停損，往往是因為「交易禁不起虧損」。由於害怕發生重大虧損，交易者往往設定太過緊密的停損，如此幾乎可以保證一定會發生無數不必要的損失。交易之所以設定停損，是為了讓正期望報酬模型得以發揮應有的獲利潛能。因此，交易者不只應該根據市場價格波動程度設定起始停損，而且隨後還要根據市場指標調整停止點設定。


    # 時間即金錢


    交易系統若採用某種以時間爲基準的出場法則，意味著交易者不是完全根據市場動態因素結束部位。對於我來說，這也等於針對金錢而不是市場進行交易。雖然我必須承認，短線交易者有理由規避隔夜或週末風險事件，但我還是認為只因爲時間到了東部標準時間下午
    4 點，就必須突然了結部位，實在違反直覺，而且是武斷的。這種作法顯然不符合「儘快認賠而讓獲利部位持續發展」的原則。


    首先，我想強調一點，當我採用回歸均值短線模型時，也經常基於各種時間因素而結束部位，譬如：隔夜部位缺乏市場流動性、規避週末風險事件等。所以，我完全可以理解回歸均值短線交易，爲何要在某個時間點結束部位。可是，我也認爲根據這種時間因素結束部位，相當於針對金錢而不是市場進行交易。因此，當我使用這類交易系統時，要求系統勝率必須相'
  merge: -1
  img_proc: true
