- pgno: 333
  md: '# 第 12 章


    # 沈著穩重的交易者


    > 不顧一切追求、執著於某種快樂者，終將摧毀快樂。隨緣享受快樂而不勉強者，將永遠享有快樂。


    — *William Blake*


    交易者絕對不能抱持著死板的信念。雖然初學者經常展現極具破壞性的偏頗，譬如：過早獲利了結、讓虧損持續發展…等，但即使是老練的交易者，也可以藉由糾正某些偏頗而提升續效。舉例來說，有經驗的交易者雖然知道他們不該偏多或偏空，但每當調整交易模型或風險管理方法時，這方面的彈性往往就喪失了。本章準備探討很多心理、身體方面的工具與技巧，包括：冥想、觀想與研究，藉以協助交易者緩和情緒，促進創造力，克服各種交易上的偏頗。


    # 「我不管」的傢伙


    最近與童年時代的朋友一起吃飯（他們不從事金融交易相關行業），有個人問我，通常都教交易者一些什麼東西。經過解釋之後，另一個人說，「我懂了，你就是那種『我不管』的'
  merge: -1
  img_proc: true
- pgno: 334
  md: '傢伙。」雖然是開玩笑，但頗能一針見血，說明了交易者該有的心態。情緒化的交易是行不通的。只要不是對風險管理抱著草率的態度，使用的是正值期望報酬模型，你就不該對於交易結果產生情緒。如果你很在意，就代表你對於所使用的交易模型或方法研究得不夠透徹，或者是未能妥善管理風險，所以才讓先前的交易結果影響到後續的操作，要不然就是執著於非贏不可的賭徒心態，而不是相信自己的方法最終會贏。


    金融交易是個很奇怪的行业，你一輩子可能會從事數萬、乃至於數十萬筆交易，卻往往會執著於某幾筆交易的結果。華爾街有種說法，「最後一筆交易才算數（you are
    only as good as your last trade）。」這句話不僅不正確，而且會對心理層面造成重大傷害。記住，整個交易生涯裡，有時候你會因為運氣很好而賺錢，有時候會因為運氣很差而賠錢，然後還會碰到一大堆介於這兩個極端之間的交易，如果你在意每一筆交易的結果，情緒一定會被攪和得不堪負荷（尤其是每天
    24 小時的電子平台交易）。


    可是，實際上還有別的辦法。對於最近發生的虧損，或過早獲利了結而喪失的賺錢機會，你可以不要覺得懊惱，只要儘可能保持情緒沈著平穩，全神專注於目前的市況，從過去的錯誤汲取經驗、學習，再不斷提升交易技巧就可以了。什麼是「沈著平穩」呢？這也就是說，不在意單筆交易的盈虧或成敗。我經常把頂尖交易者比喻爲精算師，他們將整個精力都擺在統計'
  merge: -1
  img_proc: true
- pgno: 335
  md: '資料上，希望更精準判斷機率與風險。碰上不該發生的虧損時，他們並不會認為這是個人的失敗而放棄，他們會把這一切看成是從事交易所必須支付的代價。沈著平穩的技巧，目的是要緩和我們對於單筆交易結果所產生的情緒反應。不要執著於單筆交易；只要堅持正値期望報酬模型，妥善管理風險，經過一年之後，我們甚至再也記不起那筆交易了。千萬不要用單筆交易的結果來界定自己的成敗，賭場典範才是關鍵。成敗的衡量準則，是我們有沒有遵守交易紀律，嚴格執行正値期望報酬模型與風險管理方法。


    「沈著平穩」就是情緒永遠保持中庸之道。初學者經常擺盪於兩種極端情緒（進階交易者偶爾也會如此），一方面是贪婪情緒所引發的草率交易行爲，使他們完全忽略了謹慎的風險管理，另一方面是恐慌導致交易系統幾乎癱瘓，使系統再也不能有效反應交易訊號，不能妥善設定停損等（參考表
    12.1）。


    | 表 12.1 交易情緒精義 |  |  |  |  |

    | :--- | :--- | :--- | :--- | :--- |

    | 癱瘓 | 恐懼 | 沈著平穩 | 草率 | 盲動 |

    | 不能有效反應交易訊號 | 過早調整停損過早獲利了結 | 完美操作模型 | 偏離模型承擔超額風險 | 沒有適當設定停止點信用過份擴張 |


    一筆交易結束之後，不論盈虧，交易者都要克制可能因此而產生的恐懼或陶酔情緒。一筆交易賺錢之後，交易者可能會害怕把剛賺到手的錢又賠掉。某些人也可能會因爲達成了月份續效目標，而不願繼續進行交易，同樣是因爲害怕把錢又輸'
  merge: -1
  img_proc: true
- pgno: 336
  md: '掉。記住，任何交易機會都是獨立的，跟先前或隨後的機會都沒有關連。就只是因爲這個月已經賺了10%，也不至於對下筆交易的成功機率有任何的影響。市場根本不知道、也不關心我們究竟是賺了10%，還是賠了5%。市場只會持續提供機會給我們的正值期望報酬模型。是否要強制封蓋已經達成的績
    效，這完全要由交易者自己決定，因爲這個月還沒有結束。


    另一方面，賺錢也可能引發陶醉感，相信自己天下無敵，交易紀律因此開始脫序，不再嚴格遵循風險管理準則。如此一來，正值期望報酬模型也變成可商量似的，彷彿他們現在是在玩別人的錢。記住，沒有什麼是別人的錢，只要根據市價進行結算之後，交易所賺到的錢就是你的，經紀商的對帳單上寫得很清楚絕對不會錯。所以，先前的成功交易如果造成恐懼或陶醉的後果，並因此影響到正值期望報酬模型而使得它無法再正常運作，這都是不理性的、不負責的。


    發生虧損之後，交易者可能會因爲恐懼而癱瘓，不敢繼續按照交易系統的指示下單進場，停損設定也可能變得更緊密，或是過早把停損調整到損益兩平點。記住，由於交易模型的期望報酬為正值，所以我們的恐懼只是受到先前虧損的影響，實際上是沒有根據的，甚至還會造成反效果。同樣地，虧損往往也會讓交易者行爲變得草率，因爲急著想扳回損失，而不再嚴格遵循交易系統或風險管理準則。若想要克制虧損後的草率行爲，耐心就是關鍵。長期而言，如果不想發生虧損，就應該執行正值期望報酬模型，並嚴格管理風險。記住，任何單筆交易'
  merge: -1
  img_proc: true
- pgno: 337
  md: '都可能產生四種結果：正確操作而賺錢，不適當操作而賺錢，正確操作而賠錢，不適當操作而賠錢。所以，虧損之所以發生，如果是因為模型、風險管理法則或交易紀律本身的問題，我們就應該從錯誤經驗中學習，設法提升將來的操作效率。反之，如果虧損是發生在正確操作情況下，交易者就應該坦然接受損失，將其視爲這個行業無法避免的成本，然後再繼續堅持賭場典範。


    相對於草率與恐懼，沈著平穩是指交易者面對盈虧循環的情緒干擾時，應該保持中庸之道，不要讓這些情緒影響多層面的、不確定的、持續變動的未來。如同本書第 10 章所強調的，若想要保持沈著平穩，關鍵就是接受、釋放隨交易盈虧而來的情緒。我們要體認與接受我們面臨虧損而產生的情緒，然後抒解情緒，體認情緒只會造成短暫的影響，敞開心胸感受更廣泛的可能性，而不要執著於習慣性的情緒反應。


    第 4 章曾經談到，價格波動循環是金融市場少數明確現象之一。價格波動很穩定的行情裡，交易者會覺得沈悶、難以集中精神，注意力分散，交易紀律逐漸鬆懈，甚至捨棄正值期望報酬模型。反之，處在價格波動劇烈的市況裡，交易者情緒又經常擺盪於貪婪與恐懼兩個極端，並因此喪失注意力，無法堅持正值期望報酬模型。經過適當磨練之後，交易者才能保持沈著穩定，不論價格波動循環發展到哪種階段，都能嚴格執行正值報酬交易模型。'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# 高階交易者



    高階交易者具備什麼特質呢？他們理解交易保持沈著平穩情緒的重要性。如同參加奧運的游泳選手一樣，經過多年的練習之後，他們已能夠從容進出市場，不斷磨練技巧，精準執行賭場典範。高階交易者雖然不在意任何單筆交易的結果，但他們會持續自我超越，挑戰新的交易目標。他們會預先界定風險，不會受到非理性恐懼情緒的影響，因爲他們相信自己所擁有的優勢。高階交易者雖然知道每個機會都是獨一無二的，但他們也確信自己的正值期望報酬模型擁有機率上的勝算。他們能夠迅速放下最近發生的虧損，把整個心力全部擺在當前的交易上。他們雖然會從過去的錯誤中汲取教訓，但不會自虐。他們非常堅持風險管理，因爲只要照顧好防守層面，攻擊層面的目標自然會達成。他們體認交易的不完美性質，所以願意把一些鈔票留在桌上讓别人賺。他們會妥善管理風險，不會只顧著追逐機會。面對錯失的機會時，他們瞭解耐心的重要性，知道市場永遠會提供新的機會。他們保持彈性的態度，擅長掌握機會，隨時可以放棄自己的意見，但卻不會輕易放掉鈔票。發生虧損之後，他們會平靜地進行另一筆交易，而不會想扳回損失。他們很清楚，若想扳回先前的虧損，心態上只是想「不輸」而不是「贏」。他們維持沈著平穩的心境，把注意力擺在交易過程，而不是鈔票（參考第
    5 章）。



    高階交易者秉持著鋼鐵般的紀律，但又不會流於死板。他們嚴格執行交易方法，堅持風險管理，但又能隨著市場持續變'
  merge: -1
  img_proc: true
- pgno: 339
  md: '化的行爲脈動而做調整。隨著市況變動，他們也會變動，不論盈虧仍會繼續堅持交易紀律。害怕的時候，他們不放棄希望；陶醉的時候，他們也不放鬆戒心。他們會坦然接受盈虧結果，但不會放棄目標。他們瞭解，關鍵是掌握勝算，不必堅持買低－賣高。成功部位務必聽任繼續發展，如此將可以彌補無數的小額虧損。


    高階交易者會不斷自我挑戰，同時掌握自己所擅長的機會。舉例來說，如果他們原本習慣於基本分析，則會透過技術指標做模擬交易；如果他們原本擅長交易高科技股票，則願意模擬交易農產品期貨；如果他們原本操作搶帽子的逆勢系統，也會願意模擬操作長期順勢系統。他們知道不能讓自己侷限於某種死板的市場信念，而應該持續做研究、不斷嘗試，以設法創造出更大的活動領域。


    高階交易者深信自己所採用的正值期望報酬模型，但又不會因此而志得意滿。即使遭遇虧損（或連續虧損），他們也不會懷疑自己所享有的優勢，仍然堅定進行機率與風險管理的賽局。他們知道，除非市場穿越支撐／壓力水準的停止點，否則他們的判斷就是正確的，而持有反向部位的交易者為錯誤（因為價格沒有穿越支撐／壓力），因此這些交易對手必須認賠。對手的錯誤判斷，將提升高階交易者的信心，並且讓他們有耐心地聽任獲利部位持續發展。高階交易者的帳戶淨值持續成長，就證明他們是正確的，所以他們繼續持有部位，直到有效'
  merge: -1
  img_proc: true
- pgno: 340
  md: '的統計證據（譬如：帳戶淨值減少1%）顯示趨勢反轉為止。


    對於正值期望報酬模型所發出的每個交易訊號，高階交易者都會毫不猶豫地執行；對於失敗部位，他們會斷然認賠，因爲這是追求重大獲利所必須支付的代價。對於判斷正確的部
    位，高階交易者則會堅持。判斷錯誤雖然是可以接受的，但他 們卻不能接受繼續持有判斷錯誤的部位，所以除了以價格爲準 的風險管理之外，他們也會參考以時間爲準的準則，譬如：虧
    損部位的持有時間不得超過24小時。他們拋棄完美主義，採 用彈性、穩健的策略。


    有些人把高階交易者可具備的沈著平穩心態，看成是一種 不自然的心理技巧。所謂的沈著平穩，是指我們即使處在高度 壓力狀態下，也能夠讓情緒很快恢復平靜。這意味著，我們只
    要能夠克制對於破壞性情緒的習慣反應，就能進入內在平靜狀 態，所以這並不是一種不自然的心理技巧。有關過早獲利了結、 停損設定太緊、招致連續虧損…等過去所觸犯的錯誤，如何平
    心靜氣從錯誤之中汲取經驗而不演變成自虐，絕對是一種高難 度的自我挑戰，但這也是擺脫悲喜兩極情緒擺盪的必要技巧。


    高階交易者如何能夠隨時進入內在平靜狀態，因此在任何 市況下都能保持高度專注呢？關鍵就是東方哲學中所謂的目擊 意識（witness consciousness）。目擊意識讓高階交易者能夠
    客觀地觀察自己的行爲，藉以協助擺脫破壞性情緒循環的影響'
  merge: -1
  img_proc: true
- pgno: 341
  md: '（譬如：觀察虧損懊惱情緒的不利衝擊，以及過早獲利了結如何影響後續交易…等），見證真正客觀的市場與機會。發展目擊意識，高階交易者將擁有佛教所謂的「闡那」（jñāna），也就是「智慧」。這種闡那狀態是與「識」（vijñāna，區別對象的認知能力）共存。高階交易者瞭解，若想要穩定保持成功，關鍵不在於壓抑或否認那些干擾智慧的情緒，而是要在沈靜平穩的狀態下溝通這些情緒。


    如同節食的人一樣，當他想要開冰箱時，可以藉由嚼口香糖或伏地挺身來做無害的宣洩；同樣地，高階交易者如果因為無聊或情緒激動而想捨棄交易系統，也可以藉由研究心智等無害的方法來宣洩情緒。一般來說，這些因為無聊或極端情緒而產生的習慣性反應，可以藉由本章後續篇幅中所介紹的各種技巧來克服，譬如：適應力、創造力、冥想、觀想、肯定、休息與身心運動。


    # 交易者重新程式化


    我的第一本著作原本叫做《藉由機械化交易系統重新程式化》（Reprogramming the Trader with Mechanical Trading Systems）。我很喜歡這個書名，因為這強調金融交易是一種可以學習的技巧（相對於靠運氣或天生條件來說）。交易者只要嚴格遵循一套有效的交易準則，就可以排除偏頗行為，強化正面心理素質，並因此獲得成功。很多人認為，金融交易之所以不容易成功，主要是因為正值期望報酬模型難尋；這種說法'
  merge: -1
  img_proc: true
- pgno: 342
  md: '是純粹的神話。事實上，交易者之所以失敗，主要是不能秉持嚴格的紀律，不能徹底遵循正値期望報酬模型的指示。就如同那些想要減肥的人一樣，他們無法控制自己的口腹之慾，卻怪減肥食譜無效；同樣地，賭癮纏身的交易者，只要操作稍微不順利，就放棄正値期望報酬模型。所以，並不是方法不存在或無效，關鍵是方法使用者缺乏毅力。


    賭徒為何不能嚴格遵循正値期望報酬模型的法則？理由有很多。除了前文所提及的原因之外，最常見的理由其實與自我價值的認知有關。某些問題可以追溯到交易者對於金錢的信念，包括如何賺錢在內，以及這方面的自我設限。解決這些問題的關鍵，是要排除具有破壞力的信念。我們不只要知道成功是可能的，而且要相信自己大有理由成功。一般來說，除非能夠解決內在衝突，否則我們還是很難嚴格遵循正値期望報酬模型。從好的方面來看，若想要排除這些自我破壞的信念，並不需要去處理潛意識裡的每項早期創傷。我們只要辨識出這些自我破壞的行為，接受它們的存在，體認它們對於交易成功所造成的妨礙。接下來除非我們決定採取行動，糾正自我破壞的行為，不再對成功自我設限，否則這些行為將繼續影響我們的表現。


    關於自我價值，還有一種普遍的錯誤信念：貧困意識 (poverty consciousness)。換言之，就是認為我們的環境不足以提供生存所必要的物資；若想要取得這些物資，唯有透過超人般的努力。另外，貧困意識還會透過其他信念呈現：如果'
  merge: -1
  img_proc: true
- pgno: 343
  md: '想要取得額外的物資，唯一的辦法就是剝削其他人。這種信念在金融交易領域裡尤其普遍：有人賺錢，就有人賠錢。貧困意識對於交易者的傷害尤其大，因爲這會導致自我破壞的行爲，也會自我限制績效表現。貧困意識是一種非理性謬誤。舉例來說，天花疫苗的發明，讓全球數十億人受惠，但究竟有多少人因此而更貧困？其他的發明，譬如：現代化污水處理、牙齒醫學、資訊科技…等，也讓人類普遍受益。若想要克服貧困意識，千萬要記住市場是多層面的、不確定的、持續變動的。金融交易雖然是最具挑戰性的一種行業，但也提供幾近於無限的機會，前提是我們必須去適應市場所提供的，而不是在這些機會上強加一些限制。


    # 適應力與創造力


    本書第11章曾經提到，自得意滿與非理性厭惡風險，是進階交易者必須克服的最大挑戰。進入這個階段之後，交易者通常已經擁有不錯的成就，但隨著帳戶管理資產價值的成長，非理性厭惡風險的偏頻行爲也可能愈來愈明顯。若想要克服態度保守、厭惡風險的問題，關鍵就是要繼續思考機率，不要太在意金錢輸贏，設定更高的明確績效目標。而若想要達到這些目標，就必須強調學習、適應力與創造力。


    繼續維持中等程度的交易績效，會讓交易者自覺滿足，安於現狀。自滿通常也會讓交易者認爲，他已經懂得所有該懂的事情；這等於是自我設限，拒絕接受新資訊，不願尋找新機會。'
  merge: -1
  img_proc: true
- pgno: 344
  md: '金融交易市場的成功非常不簡單；因此，交易者一旦稍有成就之後，往往就會安於現狀。可是，如果我們不想超越自我，自滿將會造成停滯。若想要克服那方面的問題，交易者就應該持續學習，強調適應力與創造力，繼續成長。


    人類的創造力充滿無限可能。思考一些開放性的問題，將迫使我们超越既有領域去寻找新的答案。關於這類磨練交易技巧的練習，不妨考慮下列問題：


    ※ 我如何更有彈性地看待市場？


    有關如何克服拒絕成長與發展的惰性，這是最有效的工具之一。由於市場行爲是多層面的、不確定的、持續變動的，所以我們對於市場的看法，永遠要保持彈性。我們對於適應力的要求愈高，愈想磨練交易技巧，績效表現就會愈穩健。


    ※ 這是否是個我享有勝算的低風險－高報酬機會？


    對於每個市場機會，都思考這個問題，可以持續凸顯自己的優勢，由機率角度思考問題。


    ※ 如何才能承擔更少的風險？賺取更多的報酬？


    考慮這兩個問題的任何一個，雖然都有助於磨練技巧、提升創造力，但同時思考兩個問題，才能更均衡地照顧風險與報酬層面。另外，回答問題需要思考細節部分，譬如：調緊停損、'
  merge: -1
  img_proc: true
- pgno: 345
  md: '採用更積極的追蹤型停止策略、減少正相關資產的部位規模、分批獲利了結…等。


    # ※ 我做對了什麼？


    不成功的交易者往往已經具備了成功的潛在條件。雖說如此，但當我們沒有達成預期目標時，經常會籠統地說，「交易根本不可能」，而不是去肯定正確的行為，然後去尋找造成我們不成功的原因，並做必要的改善。


    模仿某位（某些）高階交易者的操作技巧，這也是提升創造力與適應力的有效方法。模仿過程中，不能只思考片面的假設性問題，譬如：「XX 交易者現在會怎麼做？」我們需要做更周全的考慮，包括所採用的正值期望報酬模型、風險管理法則、交易紀律準則，然後問：「XX
    交易者會如何處理模型發展、測試、執行與風險管理？」「他們是否會採納這種架構？」「他們是否會同時進行 3 筆正相關的交易，停損各自設定為 2%？」另外，對於自己既有的正值期望報酬模型與風險管理辦法，我們也可以將其成功的交易經驗，拿來作為創新的參考。'
  merge: -1
  img_proc: true
- pgno: 346
  md: '# 冥想


    冥想是可供交易者運用的重要工具，因為冥想可以讓心境完全放鬆，刺激阿爾發腦波活動（alpha brain wave activity）。冥想可以讓我們完全擺脫情緒糾結，因此也可以讓我們不受到市況牽制而更容易遵循相關交易法則。配合其他的放鬆技巧，冥想是克服市場情緒性反應的有效工具。平心靜氣地恢復空靈狀態，平息主觀的意識，進入目擊意識狀態。


    # 七支坐法


    七支坐法（seven-point posture）是協助我們心靈放鬆的方法。請注意，這並不是進行冥想的必要條件，而只是協助我們冥想的工具。就如同我們開車的時候，往往也會藉由一套動作來協助自己進入開車狀態，譬如說，繫緊安全帶、踩煞車、檢查後視鏡…等，七支坐法也具有相同的功能，目的是協助我們更容易進入冥想狀態。


    七支坐法的第一支，是盤腿而坐，最好採用雙盤蓮花座，但也可以採用單盤。如果覺得這些姿勢不舒服，不妨找張椅子坐，但必須坐得很穩當。第二支是結手印，雙手掌心向上，右掌在上，左掌在下。根據直貢法王（Drikung
    Kyabgon Chetsang Rinpoche）的《大手印禪修法》（The Practice of Mahamudra），雙手應該擺在臍下四指處^{{註39}}。第三支是脊椎，脊椎必須挺直。據說這是最重要的一支，可以協助放鬆呼吸。'
  merge: -1
  img_proc: true
- pgno: 347
  md: '第四支是肩膀向後而下沉，讓胸膛挺出。第五支，下巴內縮；第六支，舌頂上顎。第七支，雙眼微張觀鼻尖。（第 7 支比較特別，因爲一般冥想姿勢都主張閉雙眼，避免受到外界干擾。）如果你覺得雙眼微張會造成困擾，剛開始也可以閉眼，等到進入放鬆狀態，然後再張開雙眼。此處之所以主張睜眼冥想，主要是協助我們能在正常行為狀態下，進入冥想境界。


    (註 39) 請參考直貢法王（Drikung Kyabgon Chetsang Rinpoche）的《大手印禪修法》（The Practice of Mahamudra,
    Snow Lion, 1999），第 37~39 頁。


    # 冥想的心境


    有人誤以爲，冥想狀態應該完全沒有思想或情緒。東方冥想大師告訴我們，只要有心，自然就會想，也會有情緒，這些都是心的自然反映。處於三摩地冥想狀態（shamata）時，如果碰到起心動念，就應該讓它們自行消失。敦珠法王（Dudjom
    Rinpoche）曾經對他的學生索甲仁波切（Sogyal Rinpoche）說，「就像睿智老人看待孩童玩耍 ${ ^ { (註 40) } }$ 。」就像睿智的老人，在冥想過程中，我們要訓練直擊意識留意念頭與情緒，但不要介入。


    (註 40) 請參考索甲仁波切（Sogyal Rinpoche）《西藏生死書》（The Tibetan Book of Living and Dying,
    HarperOne, 2002），第 78 頁。'
  merge: -1
  img_proc: true
- pgno: 348
  md: '起心動念當然會讓我們分心。碰到這種狀況，應該把整個注意力擺在呼吸上，讓念頭與情緒自然消失。換言之，雜念興起時，不要直接對抗雜念，而應該專注於呼吸，讓雜念自然消失。一旦打坐冥想有了初步功夫，每當交易碰上情緒糾纏，就會愈來愈容易藉由直擊意識進入冥想狀態，讓心靈恢復沈著平穩。


    # 觀想


    觀想 (visualization) 藉由創造性精神影像強化有用的行爲。我們的精神深具創造力。這類創造力，有時候是正面的，有時候是負面的，有時候則是中性的。精神創造力雖然可以是主動的，但通常是被動的。換言之，環境如果出現刺激，我們的創造力就會針對該刺激而產生
    (被動) 反應。環境刺激如果是正面的，我們所創造的反應行爲通常也是正面的；刺激如果是負面的，我們的反應行爲也通常是負面的。反之，觀想可以讓我們的精神創造力脫離被動模式，主動創造我們想要的影像，藉此微妙地改變我們對於外在的感受。


    我們希望怎麼感受自己、市場，以及我們的市場行爲？我們的目標是感受多層面的、不確定的、持續變動的市場，以及我們在市場上展現的專注、嚴格紀律與靈活應變能力。當然，這些都是抽象概念，而觀想程序應該儘可能實在、明確。舉例來說，觀想美國就業報告公佈的情況，看看目擊意識如何看待我們對於可能情節的反應，包括對於持有部位有利、不利和中


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_348_0.png)'
  merge: -1
  img_proc: true
- pgno: 349
  md: '性的情境。換言之，我們要觀想自己當時身體感受，包括：如何呼吸、情緒反應、對於相關新聞的想法…等。


    其次，儘可能細膩地觀想一筆成功的交易。看看直擊意識如何看待實際進場之前的準備程序，包括如何分析走勢圖、新聞、市場人氣等，還有身體的感受與情緒反應，以及當時的想法。儘可能身歷其境地感受這些因素（走勢圖、新聞、人氣、身體、情緒、想法）如何隨著行情演變（譬如說，行情朝有利方向發展、折返、又朝有利方向發展）而變動，直到部位結束爲止。然後思考一些問題：如果更早或更晚進場，績效是否會更好？如果更早或更晚出場，績效會有何影響？採用本書第
    6 章介紹的分批出場策略，是否能夠提升績效？


    關於前一段有關成功交易的觀想，請進一步對照、比較失敗交易的情況。然後思考一些問題：我有沒有嚴格遵循正値期望報酬模型的相關法則？我有沒有嚴格遵循風險管理法則？關於這筆失敗交易，我的情緒或想法是否透露某些不祥的徵兆？


    觀想可以防範未平倉部位扭曲我們對於市況的客觀感受。通過這些技巧，我們就可以跳脫自己的立場，設想自己處在空手狀態，觀想任何特定交易的各種可能發展，包括有利、不利或災難性市況。不論持有多頭或空頭部位，有種技巧可以協助我們看清真實的市況：觀想部位已經結束，然後問自己：「行情將走高或走低？」透過這種方式，我們就可以訓練自己客觀看待行情，而不會替自己所持有的部位尋找合理化的藉口。'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# 身心運動


    > 我所追求的不只是更靈活的身體，還有更靈活的心智。

    —— 費登奎斯（*Moshe Feldenkrais*）


    根據費登奎斯的見解（他是費登奎斯方法的發明者，這套方法試圖通過運動改善人們的自我感知能力，並因此而強化各方面的功能），改變運動能力與改變自我感知，兩者之間是牢不可分的；因此，身心運用對於心理與生理健康都有幫助。透過我們過去不習慣的方式運動態動身體，不只會讓身體更靈活，也會讓心智運作更具彈性。我們知道，心理靈活程度是區別初學交易者（進階交易者）與高階交易者的主要特質之一，所以身心運動可以有效幫助我們由初學者提升為頂尖好手。


    身心運動特別能夠幫助交易者克服各種有害的心理狀態。舉例來說，Hatha Yoga（瑜珈）能夠有效抒解心理壓力、焦慮與心理停滯（停止學習與成長，不再接受新觀念）。Ha
    是梵文的太陽，代表陽，屬於主動的體能；tha 是梵文的月亮，代表陰，屬於被動的體能；yoga 是調和的意思。所以，Hatha Yoga 就是陰陽調和（調和陰陽體能）的運動。瑜珈術特別強調各種姿勢（asanas）與深呼吸之間的調和。'
  merge: -1
  img_proc: true
- pgno: 351
  md: '有氧與無氧運動有助於身體釋放血清素（serotonin）與腦內啡（endorphins），所以特別適合交易發生連續虧損而陷入沮喪狀態的人。散步則有助於克服交易導致的身心疲憊或心理停滯狀態。在交易心理學領域裡，因爲交易而導致的的身心疲憊問題，處理方面尤其具有爭議性。根據我個人的經驗，我認爲交易者想要渡過身心疲憊的階段，最好的辦法就是繼續進行交易，因爲交易獲利金額大約有
    80% 是集中在少數 20% 的交易中。所以，爲了避免錯失重大獲利機會，最好繼續進行交易，同時設法獲得休息，譬如：充分睡眠、按摩、身心運動（瑜珈、散步、打坐、冥想…等）。休息、睡眠與散步特別有助於恢復身心活力，因爲這些活動允許我們的潛意識進入回饋狀態，針對交易問題提出替代觀點。另外，身心疲乏狀態下的交易，也可以考慮減少部位規模（譬如說，正常大小的十分之一）。請參考表
    12.2。


    表 12.2  克服中心理狀態的解决辦法


    | 問 題 | 解決方法 |

    | :--- | :--- |

    | 焦慮 | 冥想，呼吸術，瑜珈 |

    | 心理停滯 | 瑜珈，散步，做研究 |

    | 沈悶 | 做研究，自我肯定 |

    | 身心耗竭 | 睡眠，冥想，按摩，減少部位規模，瑜珈 |

    | 沮喪 | 有氧運動，無氧運動，自我肯定 |'
