- pgno: 181
  md: '# 第 $^{7}$ 章


    # 時間架構分析


    > 雲是由一大堆看似雲的水氣所構成。如果近距離觀察，我們看到的就不是平滑的東西，而是一些不規則的微小結構。

    — Benoît Mandelbrot 博士


    時間架構分析（timeframe analysis）是建構正值期望報酬模型最有效的工具之一。本章討論涵蓋了傳統的時間架構分析，以及時間架構背離。我們將特別透過各種數學技術指標，嘗試瞭解各種時間架構之下的市場行為。


    # 傳統的時間架構分析


    我從 1987 年開始研究市場行為，希望能夠發展正值期望報酬交易模型，並深受技術指標的單純性吸引（相較於經濟基本分析）。我開始瞭解市場趨勢的重要性，而各種技術指標可以協助辨識趨勢。試圖判斷趨勢的過程中，我很快發現所有技術指標的功能與效果並不相同，而藉由數學方式推演的技術指標，能夠客觀回答「什麼是趨勢？」的問題。隨著研究愈來愈深入，運用各種數學技術指標協助判斷趨勢，我終於發現前述'
  merge: -1
  img_proc: true
- pgno: 182
  md: '問題並沒有單一答案。唯一令人覺得滿意的答案，是另一個問題：「什麼時間架構下的趨勢？」


    換言之，如果我们採用移動平均或 RSI $^{(註 23)}$ 等客觀的數學技術指標評估趨勢，某資產的月線圖與週線圖可能呈現多頭趨勢（9 期 RSI 讀數超過
    50），但根據日線圖判斷，該資產卻可能呈現空頭走勢（9 期 RSI 讀數低於 50），不過若從小時走勢圖觀察，該資產可能又呈現多頭走勢（9 期 RSI 讀數大於
    50）（請參考圖 7.1）。


    （註 23）章達的相對強弱指數計算公式如下：

    RSI = 100-100/(1+RS)

    其中 RS = （x 天內上漲收盤價的差價平均值）÷（x 天內下跌收盤價的差價平均值）。所以，RSI 屬於百分率擺盪指標，讀數介於 0 與 100 之間。RSI
    讀數大於 50，代表行情偏多，RSI 讀數小於 50，代表行情偏空；因此，交易者可以透過 RSI 判斷趨勢。


    因此，傳統的時間架構分析，通常都是由最長期時間架構開始，判斷某資產的趨勢、支撐與壓力狀況。由宏觀角度決定了市場行為之後，我們就可以進而檢視較短時間架構的趨勢、支撐與壓力。請參考圖
    7.2，其中顯示 2011 年 3 月份 ICE 糖期貨的 30 分鐘走勢圖。根據這份走勢圖，我們判定糖期貨處於空頭市場，並鎖定反彈過程壓力區的放空機會為
    $0.2893。可是，比較圖 7.3 與圖 7.2，我們如果將時間架構由 30 分鐘延長為 60 分鐘，就會發現上檔壓力並不是在 $0.2893，而是在 $0.2930（參考圖
    7.3）。'
