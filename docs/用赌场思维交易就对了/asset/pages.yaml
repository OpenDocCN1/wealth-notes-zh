- pgno: 203
  md: '# 第8章


    # 如何運用交易模型


    > 我愈努力工作，就會變得愈幸運。

    — 無名氏


    本章準備探索許多正值期望報酬交易模型，包括順勢與回歸均值的系統，希望藉此增進讀者對於市場行為與各種交易風格的瞭解。我們尤其會特別強調低風險 - 高報酬的較長期順勢模型。


    # 機械化交易系統


    機械化交易系統是根據明確準則而自動執行交易的模型，部位建立或結束完全不受投機客主觀意識影響。這些系統通常都採用數學技術指標（譬如：移動平均或擺盪指標）發展出客觀的進場、風險管理與獲利了結的法則。


    對於系統開發者來說，第一個挑戰是決定研究的起點。我建議，基本原則應該是愈少愈好。我們的目的是：在不影響績效表現的前提下，建構正值期望報酬模型所採用的參數愈少愈'
  merge: -1
  img_proc: true
- pgno: 204
  md: '好。模型所採用的技術指標，應該彼此互補：換言之，技術指標的功能不要重疊。更明確來說，建構順勢模型時，可以採用一種衡量趨勢的技術指標（譬如：移動平均）、一種擺盪指標（譬如：RSI）、一種價格波動指標（譬如：平均真實區間），以及成交量。其次，發展數學技術指標的相關模型時，交易者應該思考：「我想要較多訊號還是較少訊號？訊號多則假訊號數量也比較多，訊號少則訊號品質也比較好。」關於這個問題，每個人都有自己的答案，完全取決於自身的個性、偏好、風險容忍程度、報酬準則……等（請參考圖
    8.1）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_204_0.png)'
  merge: -1
  img_proc: true
- pgno: 205
  md: '機械化交易系統雖然很穩健，但表現通常不如顶尖玩家的主觀判斷，因爲後者的適應能力很強，能夠掌握某些獨特而不可預測的機會。不過，話說回來，機械化交易系統仍然是最安全、最可靠的方法，能讓相關決策儘量不受情緒影響（參考第
    3 章），發揮機器應有的功能（參考第 1 章），並協助交易者遵循謹慎的風險管理準則（參考第 2 章），取得正值期望報酬。請注意，系統不論多麼穩健，交易必然還是會遇上連續虧損的情況；所以，在投入資本實際從事交易之前，我們應該要針對交易系統進行周全的歷史資料測試，瞭解特定交易系統的各方面性質，以培養充足信心。


    前文曾經多次談到機械化交易模型，但目的都是藉由這些系統來解釋風險管理（第 2 章）、交易紀律（第 3 章）或價格波動循環（第 4 章）等概念。現在，我們準備說明如何採用數學方法建構機械化交易系統，協助交易者取得正值期望報酬。當然，此處討論並不打算涵蓋所有的機械化模型，而只準備講解基本方法。另外，我還要特別強調本書第
    3 章已經說過的一點：「我們探討這些模型，並非建議將這些系統運用於實際交易中，而只是做爲研究的起點，讓讀者有個跳板，可以建構出更穩健的正值期望報酬模型 ${
    }^{\text {(註 24)}}$ 。」


    （註 24）我的第一本著作《機械化交易系統》（Mechanical Trading Systems, John Wiley & Sons, 2004）已經談過這類話題，包括：投資組合構成、永續走勢圖、最佳化程序（optimization）、曲線套入（curve-fitting）等，所以我假定讀者對於這些概念已經相當熟悉，此處不打算重複。'
