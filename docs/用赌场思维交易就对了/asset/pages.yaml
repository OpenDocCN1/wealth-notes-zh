    停損設定方法種類繁多，幾乎只受限於交易者的想象力，但大概可以分爲三類：數學方法設定的停損，根據支撐／壓力設定的停損，以及根據金額或價格百分率設定的停損。根據某種數學技術指標設定的停損，在運用上最爲普遍，譬如把停損設定在前一天的
    20 天移動平均位置，或把停損設定在前一天的包寧傑帶狀（Bollinger Band）上限或下限（參考圖 2.7）。


