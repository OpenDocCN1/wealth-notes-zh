- pgno: 42
  md: '以上討論了以數學化技術指標爲基礎之正值期望報酬模型的各種長處與短處，以及克服短處的工具，接著我們將簡單複習如何把這些模型轉化爲機械化交易系統。我在這裡只說是「簡單複習」，因爲各位如果對於這方面議題有興趣，可以閱讀我的第一本著作《機械化交易系統：交易心理與技術分析之整合》（Mechanical
    Trading Systems: Pairing Trader Psychology with Technical Analysis）。此處不準備重述該書內容，只想強調以數學化技術指標爲基礎的機械化交易系統，能夠協助解決下列問題：


    +   ※ 相關模型是否具備正值期望報酬？


    +   ※ 相關模型過去曾經出現哪些缺失：最大連續虧損？帳戶淨值由峰位到谷底的耗損？交易勝率？交易平均持有期間？


    +   ※ 我是否願意在實際交易過程中忍受這些缺失？我是否需要另外尋找更適合自己個性的其他模型？'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 結語


    最後，我們要考慮一個問題：以交易法則為基礎的正值期望報酬模型，是否應該進一步引用所謂的交易者直覺呢？我個人使用的交易模型，是否屬於 100% 的機械化系統呢？對於這個問題，我的答案可以說「是」，也可以說「不是」。我確實採用以法則為基礎的方法，絕對不違背正值期望報酬模型或風險管理的法則。可是，除了法則之外，我也會考慮所謂的交易直覺。


    賭徒所謂的直覺，以及真正的交易直覺，此兩者是不同的。請注意，假如只是拿直覺當做藉口，而違背交易模型或風險管理的法則，這種情況絕對要避免。反之，如果是把交易直覺納入以法則為基礎的交易模型，那便又是另一回事了。


    交易直覺究竟是什麽呢？那是一種潛意識的判斷。事實上，它根本不是直覺，而是躲藏在潛意識之中的記憶，但很難整理出條理分明的頭緒。舉例來說，觀察某份價格走勢圖時，交易法則顯示應該在
    25 買進。可是直覺卻告訴我們，「我曾經看過這種價格型態，我知道價格會拉回到 12，所以我要等到 12 再買進。」這類判斷仰賴的就是直覺，也就是模糊的記憶。不幸的是，一般人的記憶力有限，所以我們無法明確地說，「我曾經在
    1976 年 3 月 13 日看過類似的價格型態，所以我知道價格很可能會跌到 12 或 11，而不是 25。」我們頂多只能說，「我看過類似的型態。因此，我準備等到
    12 再買進。」'
  merge: -1
