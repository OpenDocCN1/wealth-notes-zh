    HiLevel(@,10)[-1] OR RSI(@,9)[-1] < 20

    ```


    # 一目均衡穿越系統（Ichimoku Crossover Systems）：


    1969 年，日本新聞記者細田悟一（Goichi Hosada）設計了一套順勢交易方法稱為 Ichimoku Kinko Hyo，也就是「一目均衡走勢圖」（one-glance
    balanced chart）。目前，此種指標通常稱為「一目均衡雲圖」（Ichimoku clouds），因爲其形狀看起來像是天上的雲朵。一目均衡雲圖有 4
    種主要成份：


    +   1. 轉換線（Tenkan Line）：

    最近 9 期的（最高價 + 最低價）÷2。


    2. 基準線（Kijun Line）：

    最近 26 期的（最高價 + 最低價）÷2。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '3. 先行跨度B（Senkou Span B）：

    最近 56 期（最高價 + 最低價）÷ 2，繪圖往前移動 26 期。


    4. 先行跨度A（Senkou Span A）：

    （轉換線 + 基準線）÷ 2，繪圖往前移動 26 期。


    實際通用上，轉換線 / 基準線可以被視為傳統的短期 / 長期移動平均，因此而構成移動平均穿越系統。反之，先行跨度 A 與先行跨度 B 的差值（換言之，兩者所夾的區域），則代表往後
    26 期之支撐 / 壓力的「均衡雲」（請參考圖 8.5）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_215_0.png)'
