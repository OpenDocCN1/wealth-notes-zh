  md: '棄的問題。分析者可能故意排除某段期間的資料，也可能因為

    計算期間往後移動而無意之間捨棄了較早期資料。故意排除某

    段期間的資料，原因通常相當明顯。風險經理人可能認為，某

    段期間的資料受到一些將來不會重複發生之異常事件的影響，

    因此判定這段期間的資料不具參考價值。舉例來說，有關天然

    瓦斯的價格波動資料，風險經理人可能認為，2005年卡特里

    納颶風（Hurricane Katrina）屬於離群事件（outlier event），

    不應該被視為常態事件，因此這段期間內的價格波動與價格相

    關資料不值得參考（圖 2.15）。


