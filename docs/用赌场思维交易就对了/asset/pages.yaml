  md: '# 開盤區間突破


    1987 年，當我剛開始在紐約期貨交易所擔任場內交易員的時代，很多成功的投機客喜歡運用開盤區間突破的概念，藉以建構有效的當日沖銷交易模型。這類交易模型的基本構想是：開盤價格區間一旦被突破，趨勢持續朝突破方向發展的可能性，就會超過其他時段價格區間的突破。當然，每位交易者都會根據自己的持有期間、風險偏好、報酬要求…等條件設計交易模型。對於短線交易者來說，所謂的開盤價格區間，可能是指開盤最初
    5 分鐘的價格區間；對於較長期交易者而言，可能就會考慮開盤第一個小時的價格區間。不論交易者界定開盤區間的時間架構如何，他們都會順著突破方向建立部位，然後把停損設定在價格區間的另一端。


    案例：英特爾股票：2010 年 12 月 29 日，英特爾開盤向上跳空，開盤價為 $20.94，前一天（12 月 28 日）收盤價為 $20.88。開盤向上跳空雖然顯示當天走勢偏多，但心態保守的交易者仍會等待開盤價格區間確立。如同稍早談到的，開盤價格區間必須由交易者個人決定。就目前案例來說，我們採用
    15 分鐘的時間架構。因此，開盤最初 15 分鐘的價格區間為 $20.98~$20.90，我們把區間突破的停止買單和停止賣單分別設定在 $20.99 和 $20.89。早上
    10：00，價格向上突破而引發我們設定在 $20.99 的停止買單，於是建立多頭部位。原本設定在 $20.89 的停止賣單，現在變成多頭部位的停損單，防範向上突破爲假突破。'
