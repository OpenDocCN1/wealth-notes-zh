- pgno: 17
  md: '# # 第 1 章


    # 發展正值期望報酬模型


    > 拉斯維加斯萬一發生大地震，務必儘快躲到賭場大廳。那裡絕對安全。


    —— 某賭場老闆


    成功的交易模型都有一些共通構成要素。本章與後續兩章將討論這些共通要素。本章將說明正值期望報酬交易模型的發展程序，下一章將解釋健全的管理風險方法。第 3 章則討論交易紀律規範。


    # 技術分析為何有幫助


    在正值期望報酬交易模型的發展過程中，技術分析可能是最有價值的工具。根據技術分析者的說法，技術分析之所以有助於發展交易模型，是因為「價格是有記憶的」。這是什麼意思？原油價格曾經在
    1990 年創下每桶 $40 的高價，這個價位到了 2003 年仍然是當時上升走勢的壓力（請參考圖 1.1）。這個事實讓經濟學家想不透，每桶 $40 的價位在
    2003 年根本沒有理由成為上檔壓力，因為 2003 年的美元購買力截然不同於 1990 年。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_18_0.png)


    雖說如此，但對於技術分析者來說，2003 年的漲勢在 $40 遭逢壓力是很容易理解的事。價格之所以有記憶，是因爲交易者曾在每桶 $40 的價位時發生過痛苦、快樂、懊悔…等難忘的情緒經驗。我們稍後還會更深入討論這個議題。


    價格之所以有記憶，是因爲 1990 年的時候，有群交易者以當時的最高價每桶 $40 價位買進石油。他們當時大有理由買進：海珊總統入侵科威特，而且全球對於石油與相關產品的需求旺盛。可是，後來當石油價格大跌時，所有買進的理由便全都一滑而散，這些人只能祈禱或許諾：「拜託，老天爺，只要'
  merge: -1
  img_proc: true
- pgno: 19
  md: '讓價格回到 $40，我發誓以後再也不交易原油。」因此只要價格回升到每桶 $40 的價位，就代表這些交易者的痛苦可以暫告結束，如此一來自然構成賣壓。


    有另一群交易者也對於油價 $40 的印象特別深刻。1990 年的時候，他們在這個價位放空原油，所以他們是前一段所說石油買家的交易對手。當時，這群交易者在此放空石油，不論什麼時候回補，基本上都賺錢，因此對於每桶
    $40 的價位有著愉快的記憶。所以，等到油價在 2003 年回升到每桶 $40 時，這群交易者自然想重溫舊夢，於是也在此處造成賣壓。


    當然，對於絕大多數人來說，他們並沒有掌握到 1990 年的機會。他們當時身處場外，只能懊惱自己竟然沒有放空。金融交易市場很有趣，只要你願意等待，通常可以等到相同的價位再度出現。所以，等到
    2003 年再度出現每桶 $40 的價位時，這群人如果不想重蹈覆轍，很可能就會抓緊這次機會。這就是技術分析之所以有幫助的道理，因為多數人會去做讓自己覺得舒服或不再覺得痛苦的事。以目前這個例子來說，當原油在
    2003 年出現 $40 價位時，許多交易者便會藉此滿足他們的情緒：抒解痛苦或尋求快樂。


    可是，到了 2011 年 4 月份，當我寫下這篇文字時，原油價格已經是每桶 $108 了。顯然地，事情有了變化。當然，市場行情本來就會不斷變化。如同本書第
    4 章詳細描述的，價格變動與循環波動乃是市場常態。2004 年所發生的變動，是所'
  merge: -1
  img_proc: true
- pgno: 20
  md: '謂的「典範轉移」（paradigm shift）現象。典範轉移是指資產價值感的中、長期變化。典範轉移通常涉及基本面因素的變動。最顯著的基本面因素，可能是中國、印度與其他新興國家對於原油的迫切需求。


    關於技術分析，尤其是價格有記憶這件事，我們發現，典範轉移並不會因此讓人們淡忘每桶$40的價位。情況甚至剛好相反，2004年5月份期間，當油價向上突破$40關卡時，市場看法發生了變化，在$40放空原油變成了錯誤，而在$40買進原油才是正確的。因此，到了2004年12月，當價格重新回檔測試$40時，那些當初在5月份賣掉原油的人，現在有機會彌補錯誤的痛楚，而那些當初在5月份買進的人，現在有機會重新體會獲利的愉悦，至於那些當初錯失機會而沒有在$40買進的人，現在又有機會買進了。這時，原本$40的壓力，就變成了新的支撐（請參考圖1.2）。


    接下來，讓我們快速前進到2008年9月15日，由於雷曼兄弟破產導致信用市場幾乎癱瘓，原油（以及其他原物料）不可避免地邁入空頭市場。當時原油價格由$147.27暴跌到$95.71。當天與前後幾天，在講授投機與避險交易的課堂裡，有些人問我，「你認為油價會在哪裡見底？」對於課堂裡的學員們來說，我的回答似乎有點不可思議，「每桶四十美元。」當然，後來證明我的預測畢竟還太樂觀了一些，油價最終是在$32.48觸底（請參考圖1.3）。雖說如此，但實際價格走勢證明，即使經過了幾十年，市場對於每桶$40價位仍然存在記憶。'
