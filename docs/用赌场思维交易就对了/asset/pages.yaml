  md: '# ## 結語


    本章討論了多種正值期望報酬模型。各位可根據自己的需要，繼續做研究，並做調整，但請記住一個基本準則（第 9 章會詳細討論）：關於交易訊號，不要三心兩意。謹慎地做計畫，然後嚴格遵循。跟交易訊號討價還價，就代表交易紀律蕩然，交易模型所提供的正值期望報酬也就不可靠了。


    想要成功地從事交易，需要多方面的考慮與配合；所以，有關嚴格遵循交易計畫的說法，當然也有例外情況。譬如說，遵守交易計畫有可能違反風險管理準則（相關討論請參考本書第
    2 章），或是資產交易市場已經出現「典範轉移」（paradigm shift）。另外，短線交易者也應該避免在重大訊息（經濟報告、利率調整等）即將公布之前進場。'
  merge: -1
  img_proc: true
