- pgno: 312
  md: '問：你準備每個月花多少時間和資源做研究？


    這個問題的答案，當然取決於個人條件，以及所採用的交易方法，但每個月起碼要花 10~20 小時做研究，訂購價格資料做歷史測試與最佳化程序研究。


    除了以上的盡職調查問卷之外，交易者也應該要記載完備的交易日誌，用以分析交易績效。以下講解如何記錄每天的交易資料。


    # 交易日誌


    若想要瞭解交易方法的內涵，那麼我們能從交易日誌中看到的，要遠比對帳單多出很多。況且，閱讀對帳單是一種被動的事後行爲。相反的，記錄交易日誌則迫使我们積極介入，回溯交易活動，由現實角度診斷每天的交易決策程序。對於初學者來說，交易日誌尤其是一項重要工具，促使記錄者每天詳細分析交易計畫、風險管理、紀律、勝率、交易筆數、成功與失敗部位的平均持有時間、帳戶淨值耗損…等。


    除了下文將討論的記錄項目之外，我們也可以針對每筆交易保留重要資料，藉以回應下列問題：


    +   ※ 進行這筆交易的理由何在？


    +   ※ 起始停損設定在哪裡？'
  merge: -1
  img_proc: true
- pgno: 313
  md: '+   *   部位基於什麼理由出場？


    +   *   是否嚴格遵循正期期望報酬交易模型？


    +   *   是否嚴格遵守風險管理準則？


    +   *   是否背離賭場典範？理由何在？


    記錄交易日誌雖然是一件相當繁瑣的工作，但所有專業機構，包括：避險基金、商品基金、商品交易顧問、專業交易員、代客操作、以及造市者，都會詳細記錄這類的交易日誌。讀者如果不願做這方面的工作，就應該檢討爲何不願意的理由。是否交易方法存在某些我們不願意面對的瑕疵？我們是否違反
    1~2% 的準則？我們的交易是否過於頻繁？失敗部位是否持有太久？是否過早獲利了結？交易者必須坦承面對自己的缺失，否則就不可能改進。長期累積的問題，不會突然之間自己獲得解決。想要改變交易行爲上的問題，首先就必須先找到問題，承認問題存在…這一切都要仰賴交易日誌。


    # 月份績效紀錄


    我每天都會記錄逐筆交易的資料，然後編寫月份績效紀錄。這份表單是建構較長期績效分析表單（我稱爲「月份摘要總彙」）的基礎。個別月份的績效表單，都應該清楚標示年份與月份，該表單是由
    21 或 23 個欄位的資料所構成（如果紀錄包括進場時間和出場時間，則有 23 個欄位，否則就只有 21 個欄'
  merge: -1
  img_proc: true
- pgno: 314
  md: '位）。這些欄位包括：


    +   1. 資產 — 也就是交易對象，期貨必須註明合約的年份與月份（如果是選擇權，必須註明買權或賣權，以及履約價格）。


    +   2. 部位 — 註明多頭或空頭部位。原則上，交易方法不該偏多或偏空，但順勢操作應該在多頭市場建立多頭部位，在空頭市場建立空頭部位。


    +   3. 進場日期 — 我建議採用經紀商截記的時間和日期（而不是交易者所屬時區的時間）。


    +   4. 進場時間 — 部位持有時間愈短，進、出場時間資料愈重要。搶帽子與當日沖銷交易，可以根據交易執行時間分析績效與成功機率。對於波段交易者來說，第
    4 欄與第 8 欄資料還是值得參考的，雖然這對於較長期部位的幫助不大。


    +   5. 成交量 — 成交股數或契約口數。留意某些資產成交量資料顯示的偏頻、多空偏頻等。


    +   6. 進場價格 — 如果有兩個或以上的進場價格，記住要計算平均價格。


    +   7. 出場日期 — 原則上，成功交易的部位持有時間，通常會超過失敗交易的持有時間。


    +   8. 出場時間 — 參考第 4 欄。'
  merge: -1
  img_proc: true
- pgno: 315
  md: '+   9. 出場價格－如果採用第6章的分批出場方法，請按照數量加權計算出單一出場價格。


    +   10. 盈虧毛額－這是扣減佣金成本之前的盈虧金額。


    +   11. 現金進出－登錄存入交易帳戶、或由帳戶提領的現金。


    +   12. 佣金－除非是搶帽子或當日沖銷，否則佣金佔盈虧毛額（第10項）的比率應該不大。


    +   13. 盈虧淨額－這是扣減佣金成本之後的盈虧金額。


    +   14. 天數－這是部位持有天數。一般來說，成功部位持有的天數，通常會多過失敗部位。


    +   15. MTM耗損－此數據代表該月份之內，帳戶淨值由峰位到谷底的最大耗損。一般來說，這個數據佔帳戶總資產的百分率不應該超過5%。此項百分率如果超過10%，就代表有問題；百分率如果超過20%，就應該關閉帳戶。


    +   16. 成功交易－如果採用第6章建議的減緩懊悔情緒的技巧，此欄要登錄成功交易百分率。


    +   17. 失敗交易－失敗交易筆數可能超過成功交易筆數，但失敗交易的平均虧損數據應該顯著較小（長期順勢交易系統尤其會有這種現象）。


    +   18. 獲利－此欄登錄獲利金額。'
