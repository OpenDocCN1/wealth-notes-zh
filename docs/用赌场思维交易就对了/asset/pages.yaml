    # ## 耐心與紀律


    交易者違背紀律的另一個重要原因是：缺乏耐心。可是，

    交易者爲何會缺乏耐心呢？箇中原因顯然有無限多種，但最主

    要者有四，包括：無聊，對於交易系統缺乏信心，害怕沒有夠

    多的訊號，最後則是所謂「清教徒的工作倫理觀」。


    # ### 無聊


    當交易模型沒辦法經常提供訊號時，很多交易者就會顯得

    焦躁難安，不願繼續等待高勝算的機會。這往往是把金融交易

    視爲刺激活動的人正常的反應。我們如果採取適當的風險管理

    程序，嚴格遵循正值期望報酬模型的指示，那麼交易原本就是'
