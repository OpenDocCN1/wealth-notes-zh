  md: '# 清教徒工作倫理


    每當交易者談到每天或每個月的金錢目標時，我都會把 Huey Lewis and the News 樂團的網路連結傳給他們，並且特別強調 "Workin''
    for a Livin''"（謀生）內的一句歌詞："I''m taking what they givin'' ''cause I''m working for
    a livin''."（我拿他們所給的，因爲我靠此謀生）。你不是在工地裡搬磚頭，你是在市場從事交易，所以你只能拿市場當前願意給的。如果市場今天願意給$10,000，那就是你可以拿的。如果市場只願意給
    $50，你就只能拿 $50。如果市場今天不準備給任何錢，你也別不能強迫市場。所以，如果你把清教徒的工作倫理套用到交易市場，換來的恐怕是一場災難。


    想要強迫市場每天給你多少錢，那就太過強調金錢了，你所考慮的不再是機率與風險管理。每天的市況都不同，市場有時候不適合進行交易。碰到這種市況，就必須嚴格遵循不進行交易的紀律；如果你覺得自己當天「必須」賺多少錢，務必要自我克制，保持空手。碰到勝算偏低或風險過高的市況，絕對不可貿然進場。如果保持空手會讓你有「懶惰」的罪惡感，那就把這種感受運用到適當的事情上：做研究去吧。'
