- pgno: 216
  md: '一目均衡雲圖可以用來建構各種順勢交易系統，此處準備討論一種最簡單的轉換線 / 基準線穿越系統（請參考圖 8.6 與表 8.5）。


    運用 CQG 語言，一目均衡穿越系統可以編寫如下（譯按，轉換線向上穿越基準線，則建立多頭部位或結束空頭部位；轉換線向下穿越基準線，則建立空頭部位或結束多頭部位）：


    ```

    ```

    Long Entry:

    Imoku1(@,9)[-1] > Imoku2(@,26)[-1]

    Long Exit:

    Imoku1(@,9)[-1] < Imoku2(@,26)[-1]

    Short Entry:

    Imoku1(@,9)[-1] < Imoku2(@,26)[-1]

    Short Exit:

    Imoku1(@,9)[-1] > Imoku2(@,26)[-1]

    ```

    ```


    前述轉換線 / 基準線穿越系統如果結合「均衡雲」，績效表現會更穩健。更明確說，多頭部位買進訊號必須發生在均衡雲圖的上側，空頭部位放空訊號則必須發生在均衡雲圖的下側。另外，當轉換線反向穿越基準線，則結束既有部位（請參考圖
    8.7 與表 8.6）。'
