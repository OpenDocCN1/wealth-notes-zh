    5 級颶風威脅下沖浪。


    # 結語


    想要瞭解金融市場的風險、報酬狀況，價格波動研究是不可或缺的。即使不採用價格波動率指標，雖然也可以發展出不錯的正值期望報酬模型，但如果想進一步提升交易系統的效率，我總是會由價格波動工具著手。'
