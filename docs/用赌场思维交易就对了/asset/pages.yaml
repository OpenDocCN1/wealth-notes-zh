    } $ ，「長期而言，我們都會死。」每隔三、兩個月，就有初學交易者會問我，如果帳戶內只有 $ 2,000 或 $ 3,000，應該怎麼做？對於這類問題，我的答案很簡單：「什麼也別做。」多數情況下，對話至此就結束了。可是，某些人會進一步追問，「你是說，無論如何也不可能把
    $ 2,000 變成 $ 100 萬？」「沒錯，我就是這個意思！」


