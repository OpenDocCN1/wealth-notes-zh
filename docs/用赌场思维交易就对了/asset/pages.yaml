    這種程度的虧損，雖然還在風險容忍範圍內，但一般人恐怕很難眼睜睜看著 $9,062.50 的帳面獲利，演變為 $4,531.25 的損失。除非交易者的個性能夠欣然接受這種轉盈為虧的可能演變，否則就不適合採用金字塔加碼策略。


    現在，我們已經清楚說明向下攤平與金字塔加碼策略的含意，它們有別於回歸均值交易系統減緩懊悔情緒的技巧。回歸均值與逆勢系統普遍存在一些問題，包括交易者可能錯失進場目標價格、帳戶淨值耗損過大等。此處準備介紹如何透過限價單在各個支撐
    / 壓力區分批進場的方法，藉此減緩交易者事後懊悔的情緒。


    乍看之下，分批進場方法似乎和向下攤平很類似。兩者之間的主要差別，在於向下攤平是為了改善部位的平均進場成本，後續交易的部位規模會愈來愈大，而且帳面虧損也會持續累積。另外，向下攤平基本上是一種遭遇虧損之後的事後反應措施（不是事前經過周詳考慮的計畫），主要目的是避免認賠。'
  merge: -1
  img_proc: true
- pgno: 176
  md: '反之，分批進場則是回歸均值交易者為了達到特定目的而預先規劃的方案，藉由分批進場方式，分別建立規模較小的部位，避免全然錯失交易機會。


    # 案例：IBM


    2007 年 10 月，IBM 股價開始由循環高點 $121.46 拉回。若由 2006 年 7 月的循環低點 $72.73 來衡量，回歸均值交易者會發現有幾個費伯那奇折返比率的可能進場點，包括：38.2%的
    $102.85、50%的 $97.09，以及 61.8%的 $91.34。可是，究竟應該在哪裡進場呢？為了避免錯失進場機會，交易者可能乾脆不做選擇。如同我經常說的，「不要猜測，只要參與（Don''t
    anticipate, just participate）。」換言之，不要猜測哪些價位可能被測試，只要在每個支撐價位都設定買單就行了。假定交易帳戶持有 $200
    萬，2%準則相當於 $40,000，所以我們可以在每個費伯那奇折返水準買進 500 股，最後在循環低點 $88.76 設定 1,500 股的停損。


    請參考圖 6.10，我們看到 IBM 在 2008 年 1 月拉回到 50%位置，然後開始回升，並在 4 月份重新測試先前的循環高點 $121.46。'
