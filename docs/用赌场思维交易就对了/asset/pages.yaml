- pgno: 89
  md: '很簡單，當然是有根據的，它們只具備一些基本功能。打個比喻吧。你買了一輛嶄新的福特野馬，準備賣掉那輛 20 年車齡的老福特野馬。老車雖然還能跑，但顯然缺少新車款提供的各種花俏功能。我提供這些簡單的模型，目的並非讓各位拿去做實際交易，而只是做為進一步研究的基礎，希望各位能夠找到更穩健的交易模型。


    單純擁有一套正值期望報酬模型是不夠的。重點是交易者必須能夠實際執行這套模型的指示。換言之，即使給各位一套最棒的模型，如果該模型不符合你的個性，你沒辦法完全信賴該模型，結果還是沒用。


    請參考圖 3.2，這是一套簡單的 MACD 穿越系統，10 年期歷史測試運用於 ICE 的布蘭特原油市場。請注意，這是一套需要持續停留在市場內的系統；換言之，既有部位一旦結束，就要同時建立反向部位。更明瞭來說，當
    MACD 線向上穿越 MACD 訊號線，而且後者在零線之上，就要把原來的空頭部位反轉為多頭部位；同理，當 MACD 線向下穿越 MACD 訊號線，而且後者在零線之下，則把原來的多頭部位反轉為空頭部位。請留意圖
    3.2 下側說明部分的 AverageDuration（部位平均持有期間）為 150 個交易日。部位持有期間長達 6 個月，某些交易者或許覺得沒問題，但一般交易者恐怕難以忍受。'
