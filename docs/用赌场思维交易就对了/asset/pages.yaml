- pgno: 308
  md: '關於 24 小時交易，另一個解決辦法就是尋找一位可以接力交易的伙伴，但他必須採用相同的交易方法。很多交易機構或避險基金就是採用這類辦法。當然，這種辦法也牽涉到許多困難，大家在各方面都必須要有高度的共識。


    最後一提，某些人由於採用全自動化的交易 - 下單系統，因此可以一天 24 小時、每星期 6 天持續進行交易。全自動化系統在執行上有一些重要考量，尤其是模型的穩健程度、程式細節，以及如何因應價格衝擊事件等等。一般來說，機械化系統的表現，往往不如配合主觀判斷的交易法則模型。所以，如果想採用全天候的自動化交易系統，務必要謹慎評估交易時間延長與績效表現下降的得失。另外，這類系統需要做周全的模擬測試，確保電腦程式沒有錯誤，系統確實可以應付各種市況。最後，對於純粹的自動化系統來說，碰到價格衝擊事件或典範轉移的情況時，顯然不容主觀判斷凌駕系統訊號（除非連這些也納入自動化，但如此做顯然有困難，因為多數模型都是設定價格波動到達某種臨界程度便關閉系統，而非取決於價格衝擊事件或典範轉移）。


    +   問：關於集中市場掛牌的期貨，你如何挑選到期月份合約？


    這個問題雖然沒有所謂的標準答案，但我通常會在合約開始延展的前兩個禮拜採取行動。我會觀察交投最活絡的月份合約，所以我知道多數投機客什麼時候延展。然後，我會根據各'
  merge: -1
  img_proc: true
- pgno: 309
  md: '月份合約的市場流動性，以及部位預定持有期間，決定交易哪個月份合約。


    舉例來說，2011 年 2 月份的 CME 天然瓦斯期貨，是在 2011 年 1 月 27 日到期。因此，大約在 2011 年 1 月 15 日左右，雖然交易最活絡的還是
    2 月份合約，但我開始追蹤 3 月份合約的交投情況。2011 年 1 月 19 日，2 月份合約當時的成交量為 115,000 口，3 月份合約則為 81,000
    口。如果交易策略的部位平均持有期間是 2 天，我仍然會買賣交投最活絡的 2 月份合約。反之，如果部位平均持有時間為 4 天或更長，我就會交易 3 月份合約，避免合約展延發生麻煩。


    問：進場、獲利了結、認賠出場時，採用哪種交易指令？


    本書雖然不打算通盤討論各種交易指令的執行程序與優缺點，但交易者務必要瞭解各種類型指令的特質，包括：市價單、停止單、限價停止單、收盤停止單…等。


    關於進場與獲利了結的交易指令，我的選擇很有彈性，但對於風險管理方面的交易指令，我的態度就很明確了。舉例來說，停損一定採用停損單，確保部位能夠在可供交易的最佳價格立即成交（參考第
    2 章）。


    問：交易指令是否透過電子平台執行？採用自動化系統還是藉由人工方式下單？'
  merge: -1
  img_proc: true
- pgno: 310
  md: '利用電子交易平台，以人工方式下單，其中有很多好處，包括佣金較低廉、執行效率高、速度較快等。可是，執行方便、速度快，也同樣意味著容易發生錯誤。我建議，下單之前，最好先在紙上寫下來，以避免出錯。


    一旦發現自己誤建某個部位，就必須立即結束部位。想要勉強交易意外建立的部位，實在是令人望之生畏的任務。由於我們根本沒想要建立該部位，所以不會預先安排風險管理措施，也不會預先準備獲利了結的計畫。


    # 研發方面的考量


    初學交易者在研發方面雖然稍弱，但有了一些經驗之後，就不難在這個領域裡做些工作。下列問卷將促使讀者考慮自己有多少時間與資源可以運用於研發。


    問：敘述你的研發程序，包括交易方法的調整。


    設想你在大西洋發生船難。落水之後，看到一件救生衣，你當然毫不遲疑地穿上，因爲這關係著生死。同樣地，對於多數初學交易者來說，剛開始都不會採用正值期望報酬模型，也不懂得什麼風險管理。所以，經過一陣子磨練之後，等到知道所謂的正值期望報酬模型與風險管理，理當像溺水的人看到救生衣一樣，迫不及待地採用，因爲這關係交易成敗。'
  merge: -1
  img_proc: true
- pgno: 311
  md: '可是，你最先碰到的正值期望報酬模型，其績效是否是很穩健、是否符合你的交易風格與個性呢？想必可能性不高。這也正是研究、發展之所以重要的理由。回到前一段談到的船難比喻。穿上救生衣之後，暫時沒有溺水之虞，你可以稍微安心地觀察四周。看到不遠處有艘救生艇，你當然會游過去。如果發現救生艇有些破洞，恐怕難以承擔你的體重，這時你就會繼續尋找其他有用之物。反之，如果救生艇的狀況很好，你就會爬上去，等待救援。同樣地，對於最先碰到的交易模型，你會做進一步的研究，根據自己的習慣和交易風格做調整，設法提升操作績效。


    當我們獲救之後，當然會扔掉救生衣和救生艇，因爲這些東西畢竟不是一般生活的必需品，除非我們懷疑拯救你的海巡署船隻是海盜僞裝的。同樣地，放棄最初的正值交易模型之前，我們要先深入評估新方法（廣泛的研究、進行歷史價格資料測試、從事最佳化程序研究、模擬操作，以及小規模實際測試[^36]），才能確定新系統的績效更穩健，更符合我們的交易風格。


    > （註 36） 對於新的交易點子，可以先在實際市場建立小規模的部位做測試。舉例來說，如果正常交易投入的資金，是帳戶總資金的 1%，這類 的測試交易，部位規模可以設定為帳戶資產的
    0.1%。'
  merge: -1
