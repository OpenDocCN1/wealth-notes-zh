- pgno: 70
  md: 所以，在考慮 VaR 模型需要引用的歷史價格波動率與歷史價格相關資料時，有個問題需要考慮：「計算的回顧期間要多長？」記住，這只是數學而已，不是什麼神奇的魔術。換言之，回顧期間（計算涵蓋期間）沒有所謂「完美的」長度。若採用較短的回顧期間（譬如：90
    天），好處是數據更能反映出正在影響目前行情的價格波動與價格相關狀況。可是，凡事有利必有弊，回顧期間較短，相關數據也比較容易受到短期市況扭曲——這些市況將來並不會重複發生。反之，採用較長的回顧期間（譬如：250
    天），將更能反映出常態性的價格波動與價格相關，但也可能因此削減短期內所呈現的特有性質。另外還要注意一點。很多實體商品的價格相關與價格波動程度都會有季節性型態，所以除了常用的
    90 天和 250 天期間之外，風險經理人也要分析 3~5 年回顧期間的資料，以儘量抽離季節性態的影響（參考圖 2.14）。
