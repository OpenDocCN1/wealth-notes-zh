  md: '酬率，才足以挽回先前的損失。這種幾近於誇張的績效所能仰賴的，將是不到三分之一的起始資本。這種表現在理論上雖然還是可能的，不過顯然不值得期待。


    現在，我們已經說明過 1% 法則的運用狀況，但隨著帳戶淨值成長，部位規模又該如何調整呢？同樣地，如果帳戶淨值減少，部位規模又該如何做調整？當資產數量變動時，雖然可以透過多種方法調整交易部位的規模，但最常用的還是拉夫·溫斯（Ralph
    Vince）的固定比率方法$^{（註12）}$。


    > （註 12）請參考 Ralph Vince 的 Portfolio Management Formulas (John Wiley & Sons, 1990)。


    運用固定比率方法調整部位規模時，最穩健的做法，就是觀察歷史測試期間的最大耗損程度。讓我們回顧先前的例子（RSI 極端模型運用於英鎊 / 美元匯率現貨交易，請參考圖
    2.11），100,000 基本部位碰到的最大耗損是 $23,160，相當於管理資產的 6.43%（採用 1% 準則）。因此，根據歷史測試績效的狀況，如果管理資產價值成長為
    $395,000，則部位規模可以提升到 110,000 而預計的最大耗損將不會超過 6.5%。反之，如果管理資產價值減少為 $325,000，部位規模也應該調整為
    90,000，如此預期之中的最大耗損才不至於超過帳戶淨值的 6.5%。'
