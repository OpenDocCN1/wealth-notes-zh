    關於回顧期間的問題，風險經理人可以采用各種應對方法，包括指數加權的移動平均在內，藉以凸顯近期價格波動與價格相關資料的重要性。可是，這也會碰到類似的問題：權數如何選擇呢？換言之，該如何選擇適當權數，近期資料的影響才不至於過或不及。關於這些問題，我不想提供任何武斷的答案，我建議風險經理人與交易者試著觀察各種回顧期間，以及各種加權方法，體會如何精確拿捏目前與未來的價格波動與價格相關。關於歷史價格波動與價格相關計算，還要考慮資料捨'
