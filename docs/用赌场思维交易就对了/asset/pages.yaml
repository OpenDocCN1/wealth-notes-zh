- pgno: 26
  md: '由於市場價格呈現高聳的峰值，以及肥厚的尾部，所以有兩類交易模型更容易存在正值期望報酬：


    +   1. 逆勢模型（Countertrend models）：因為價格走勢具有相對強烈的回歸均值傾向。


    +   2. 順勢模型（Trend-following models）：因為行情出現極端走勢的傾向相對偏高。


    因此，三大類技術指標之中，前述兩種模型各統領一種，一是逆勢模型常用的超買／超賣（至少是暫時性的）擺盪指標（oscillators），一是順勢指標，譬如：移動平均、MACD、一目均衡雲圖指標（Ichimoku
    clouds）等。


    各位可能會問：如果市場價格行為只能呈現趨勢、或是區間走勢，哪來的第三類技術指標呢？第三類指標屬於價格波動指標（volatility indicators），用途是告訴我們行情什麼時候由回歸均值模式轉換為趨勢模式，或是什麼時候出現相反的狀況。事實上，這類指標對於我們發展正值期望報酬模型是不可或缺的，因此本書第
    4 章將用相當篇幅介紹各種價格波動指標，內容涵蓋其用途與限制。


