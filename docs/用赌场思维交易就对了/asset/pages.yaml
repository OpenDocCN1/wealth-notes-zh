    虧損部位向下攤平顯然不是精明的部位規模策略，金字塔加碼則可能是。問題是，金融市場大約只有 30%時間呈現明顯的趨勢，這是多數專業玩家認同的事實。對於順勢交易者來說，這個問題是可以接受的，因為順勢模型在
    30%期間內所創造的獲利，金額通常都會超過這些模型在剩餘 70%期間內所遭逢的虧損。可是，如果想成功運用金字塔加碼策略，市場不只需要有趨勢，而且該趨勢還要呈現拋物線式的加速發展。當行情持續走高（或下跌）時，金字塔加碼策略往往會造成交易者心理不安，因為交易者必須能接受以下狀況：帳面獲利有可能演變爲顯著的虧損。'
