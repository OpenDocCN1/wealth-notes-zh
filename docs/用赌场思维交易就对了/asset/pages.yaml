  md: '融交易市場的發展歷史，我們看過太多判斷正確卻進場太早的失敗者。對於短線交易者來說，「長期走勢判斷正確」是相當致命的缺失。舉例來說，大約在 2008 年
    1 月份，SemGroup 開始在 $100 價位附近放空原油。他們認為，石油價格明顯高估，絕對不能維持在當時價位。這個判斷相當正確，但該公司卻在 2008
    年 7 月 16 日宣布「資金調轉不靈」，只好把他們的 CME 交易帳戶賣給巴克萊（Barclays）。到了 2008 年 12 月 12 日，CME 交易帳戶內的
    2009 年 1 月份原油期貨合約在 $32.48 見底（參考圖 1.4）。


