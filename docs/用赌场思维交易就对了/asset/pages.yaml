    關於 RSI 趨勢系統，是否有什麼辦法可以擷取前述兩者之長呢？換言之，讓部位持有期間能類似 3 天期追蹤型停止期間，但績效能類似 10 天追蹤期間。這當然是可能的，我們可以引進許多變數，藉以擷取兩者之長，此處準備介紹其中一種方法：「極端出場讀數的
