    圖 4.17 2008 年 8 月份 CME 原油期貨日線圖：價格波動的循環性質


    關於客觀數學所推演出來的價格波動率指標，較常見的兩種類型為歷史價格波動率與隱含價格波動率（implied volatility）。前文討論的包亨傑帶狀差值、ART
    與 ADX 等，都屬於歷史價格波動率。另外我也會用統計方法衡量歷史價格波動率，也就是計算最近 20 天期的資產價格標準差（standard deviation）。這類指標的最大問題，是它們都屬於落後指標。換言之，這些都是根據實際發生的歷史價格計算的，只能顯示資產在過去某段時間內所呈現的價格波動狀況，未必能夠反映目前或未來的價格波動。'
  merge: -1
  img_proc: true
- pgno: 132
  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_132_0.png)


    圖 4.18 CME 天然瓦斯期貨過線圖：隱含價格波動率與歷史價格波動率


    關於這個問題，可以透過隱含價格波動率來處理。所謂隱含價格波動率，是指某特定資產之選擇權價格所隱含的價格波動率。因此，隱含價格波動率更能即時反映資產當時的價格波動狀況。隱含價格波動率雖然有多種計算公式，但我會綜合採用最接近到期之三個月份系列的價平買權與賣權（at-the-money
    calls and puts），以及最接近價平的三種履約價格做計算<sup>（註20）</sup>。圖 4.18 很有參考價值，其中不只顯示了歷史價格波動率的發展，也顯示隱含價格波動率的走勢。


    > （註 20） 同時採用最接近到期的 3 個月份系列選擇權，可以緩和選擇權接近到期時可能產生的價格波動溢價。'
  merge: -1
  img_proc: true
- pgno: 133
  md: '最後，關於價格波動的循環性質，有一點需要注意。當市場即將發佈經濟基本面重大報告（譬如：季盈餘、中央銀行政策報告、作物報告…等），隱含價格波動率與歷史價格波動率往往會出現背離的走勢。這類報告即將公布之前，由於不確定性增高，現貨與期貨交易者通常會退場觀望，使得期貨與現貨的價格呈現整理狀態（歷史價格波動率下降）。可是，這些現貨與期貨的選擇權，則會因爲不確定性增高而價格上漲（避險者會購買選擇權藉以規避期貨與現貨部位的風險，投機客也可能藉由選擇權下注），使得選擇權價格隱含的（期貨或現貨）價格波動率上揚。


    等到新聞發佈而市場充分消化相關資訊之後，歷史價格波動率會開始上升。另一方面，隱含價格波動率的反應則不容易預測。如果消息內容顯著不同於市場預期，隱含價格波動率可能飆高，因爲選擇權的投機性與避險買盤會增加。反之，如果消息內容與市場預期大致相同，隱含價格波動率則會下降（雖然歷史價格波動率當時可能呈現上升走勢，請參考圖
    4.19）。'
  merge: -1
  img_proc: true
