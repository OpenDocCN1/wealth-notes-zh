    圖 9.7 美元/日圓匯率日線圖：價格波動穩定的突破


    這個時候，我開始告誡自己：「不要猜測，只要參與」。我發現自己失去耐心，這是個警訊。如果連我都只能勉強按耐焦急之心，繼續等待明確的向上突破訊號，其他比較沒有經驗的交易者，恐怕更加難以忍耐。他們可能會在
    94.60 買進；他們會根據價格即將突破的預測而提前進場。所以，如果後來行情沒有成功突破 95.00，這些人就不是買在新多頭市場的低點，而是新空頭市場的高點。實際發展正是如此。漲勢在
    5 月 5 日一度挺進到 94.99，但最後仍以 93.81 做收。'
