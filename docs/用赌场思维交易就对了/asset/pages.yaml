    **問：交易特定投資工具時，是否設定投資部位上限？**


    關於這個問題，我的處理方式，是設定每種資產的最高可交易合約口數。舉例來說，CME 銅期貨每天的 average 成交量大約是 30,000 口合約。這種情況下，我規定自己頂多只能交易
    10 口銅合約，而不論帳戶規模有多大。如此一來，當帳戶規模顯著擴大時，這類市場流動性欠佳的資產，由於交易量不能增加，所以其在整體投資組合內所佔的比率將減少，但多少還是可以提供分散風險（diversification）的效益。


    對於某些期貨合約，我是藉由總成交量衡量市場流動性（譬如：CME 的 S&P 迷你合約），但有些期貨是藉由交易最活絡的近月份合約成交量來衡量其市場流動性。就我寫本章內'
