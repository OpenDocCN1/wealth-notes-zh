    # 較長期交易案例：CME 原油


    圖 7.15 顯示較長期的案例，說明 2011 年 1 月份 CME 原油期貨如何藉由時間架構背離建立部位。此處假定交易者採用日線圖判定其與週線圖和月線圖之間的背離訊號：換言之，週線圖與月線圖呈現多頭趨勢的訊號（根據
    9 期 RSI 判斷），等到日線圖的 9 期 RSI 跌破 35，就進場建立多頭部位，停損則設定在較長期週線圖最近循環低點的稍下方，獲利了結的停止賣單則設定在日線圖買進訊號發生之前一支線形的高點（請參考圖
    7.15 與 7.16）。'
