- pgno: 200
  md: '交易則非如此，因爲日線圖走勢即使偏多，但週線圖與月線圖上的較長期趨勢仍可能偏空（請參考圖 7.15）。


    # 結論


    時間架構確認與背離等運用，雖然頗有價值，但也有一定限制。首先，我們雖然可以採用各種客觀的數學技術指標來界定各種時間架構的趨勢，但這畢竟不是魔術，只是數學而已。換言之，關於趨勢的界定，沒有任何數學技術指標是萬無一失的，也沒有任何參數設定（譬如說，我們有時候採用
    50 期移動平均，有時候採用 26 期）是絕對的。不同參數（譬如 9 期 RSI 與 14 期 RSI）會呈現出不同時間架構的市場行為。


    其次，時間架構確認與背離運用，不容易做歷史測試，也不容易套用到機械化交易系統的最佳化電腦程式中。基於這個緣故，我們很難彙整相關交易系統的績效資訊，譬如：帳戶淨值最大耗損、最多連續失敗交易筆數、系統勝率、成功交易平均每筆獲利對失敗交易平均每筆虧損的比率…等。欠缺這方面的資料，我們就很難對交易系統產生信心，尤其是在操作不順利的期間。


    最後，時間架構背離雖然是判定資產價格長期趨勢、支撐 / 壓力的有用工具，但千萬不要因爲其功能而產生自滿心態。這項技巧雖然可以讓我們順著長期趨勢發展方向進行交易，但'
  merge: -1
  img_proc: true
- pgno: 201
  md: 趨勢遲早會反轉，趨勢一旦由多翻空或由空翻多，徵兆首先會出現在最短時間架構上，然後才會得到較長時間架構的確認，顯示新趨勢確實已經成立。我們最後提到的這點，目的不是建議交易者避開或放棄時間架構分析，而是要強調風險管理的重要，同時也讓讀者更瞭解如何由賭場觀點掌握時間架構背離現象。換言之，交易工具（包括時間架構背離在內）不論多麼高明，也不可能萬無一失。任何工具都不完美，接受這方面的缺失，是我們利用正值期望報酬模型所必須付出的代價。
  merge: -1
