- pgno: 25
  md: '這當然幫不了 SemGroup，因爲他們早已經在 2008 年 7 月 22 日申請破產《註 3》。


    (註 3) 請參考 Forbe.com 刊載文章 Inside the Semgroup Bust (作者 Christopher Helman，日期 2008-07-28)。


    這些市場缺乏完美效率的事實，對於我們短線交易者有什麼意義呢？正因爲市場缺乏完美效率，因此我們才得以發展正值期望獲利的交易模型。


    市場缺乏效率導致資產價格呈現出統計學上所謂的聳峰分 配 (leptokurtic distribution，請參考圖 1.5) 。換言之，相較 於效率市場的常態分配，實際上價格回歸均值的機率更高，而
    且尾部極端值出現的機率也較高（這種極端的價格趨勢，使得 價格報酬分配呈現出肥厚的尾部）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_25_0.png)


    圖 1.5 資產價格的聳峰分配與常態分配'
