    # ## 結語


    我能夠瞭解投機客會根據自己慣用的交易系統，採用各種跟時間架構或市況動能有關的法則，因此本章的某些主張未必適用於他們。本章的論述雖然是以中、長期順勢交易為主，但我相信本章強調的「針對市場而不是金錢做交易」概念，對於短期投機客也有幫助，尤其是在風險管理方面。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 第 6 章


    # 避免事後懊悔


    > 我看得很清楚：只有兩種可能狀況——可以這樣做，也可以那樣做。我最誠懇的建議是：不管做或不做——你都會後悔的。


    — Soren Kierkegaard


    如何才能更強化我們嚴格遵守交易法則的紀律呢？交易發生虧損或錯失賺錢機會，通常是導致交易紀律鬆懈的最常見原因。本章準備提供一些技巧，協助讀者克服這方面的問題。我們會提出明確的方法，儘可能減少事後的懊悔。


    # ## 紀律的溫柔面


    第 3 章談到嚴格紀律的重要性，強調這是發揮正值期望報酬交易模型與穩健風險管理方法的必要條件之一。本章準備進一步討論這個話題，但重點則擺在交易紀律的溫柔面。這些技巧主要是讓我們更容易執行正值期望報酬模型與風險管理方法。換言之，這些技巧的主要功能，不是讓正值期望報酬模型變得更穩健，而是讓交易者更容易堅持正確的方法。這些工具將儘可能嘗試減緩交易決策難免會產生的懊悔情緒。為了說明'
  merge: -1
  img_proc: true
- pgno: 156
  md: '這方面技巧，讓我們回頭考慮第 3 章談到的不透明箱子，裡面裝有 57 顆綠球與 43 顆紅球。如果要由箱子裡拿出一顆球，賭該球為綠色的勝算顯然高些。可是，拿到綠球的機率雖然較高，仍然有可能連續拿到紅球。然而，如果我們把綠球切成對半呢？這不會讓拿到一整顆紅球的機率增加，甚至不會增加到一整顆綠球的機率。可是，這會增加我們拿到綠色的機會，也是本章談論技巧想要達到的功能。


    本章討論假定交易者的資本相當充裕，可以在不違反風險管理準則的情況下交易多口期貨合約。此處所謂的資本充裕，是指任何單筆交易承擔的風險，都不超過帳戶資本的 1~2%（註
    21）。


    （註 21）一個有趣的題外話：雖然所有專家都同意資本不足是非常嚴重的缺陷（詳細討論請參考第 2 章），但對於鉅額玩家（管理資產價值超過 $1,000 萬者）與中型帳戶（帳戶資產價值介於
    $20 萬 ~ $1,000 萬者）來說，究竟何者佔優勢，則頗有爭議。很多文獻顯示鉅額交易者享有優勢，不過這類論述都發生於新聞瞬間傳遞的資訊革命之前，也就是電子交易和折扣經紀商還不普遍的时代。在這些發展之前，鉅額交易者確實享有優勢；可是，我認爲當今狀況並非如此。現在，優勢已站在中型交易者一方。流動性風險是鉅額交易者很難克服的問題，但這類問題不至於影響中型交易者。流動性風險可能透過各種形式呈現，譬如：鉅額交易者不容易實現帳面獲利、交易指令不容易執行、滑移價差相對嚴重等等。'
  merge: -1
  img_proc: true
- pgno: 157
  md: '我另外要聲明，本章討論的技巧，並不是減緩懊悔情緒的喲一方法；希望這部分討論能夠拋磚引玉，鼓勵讀者做更深入的研究。最後，我還要強調一點，本章討論只適用於順勢交易模型；更明確說，順勢操作者進場建立部位之後，如果行情朝有利方向發展，則可以考慮採用本章所討論的技巧，儘可能減少事後懊悔的可能性。進場建立部位之後，如果行情朝不利方向發展而部位遭到停損，交易者根本沒有機會引用本章所討論的技巧。


    # 順勢操作者所面臨的困難


    順勢操作者可能碰到的懊悔狀況很多，譬如：重大帳面獲利得而復失，最終演變爲重大虧損；過早獲利了結，結果只能在場外看著行情繼續朝我們原先預期的方向大幅發展；原本很容易處理的小虧損，演變爲災難性的損失。當然，交易者不能期待會有任何單一方法，能夠解決所有這類問題。本章希望能夠提供一些好的辦法，讓交易者儘量避免碰到這類困擾。


