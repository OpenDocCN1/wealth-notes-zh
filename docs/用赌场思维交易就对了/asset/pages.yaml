  md: '# 回歸均值系統


    就多數順勢系統來說，最大問題就是勝率太低。回歸均值模型的情況剛好相反，系統勝率很高，但維持高勝率必須付出代價，因爲回歸均值模型的盈虧比率（P:L）通常較低。


    # RSI極端系統（RSI Extremes System）：


    RSI 極端系統是本書最先介紹的回歸均值模型，該系統結合了回歸均值擺盪指標（RSI），以及長期趨勢指標（200 期簡單移動平均）。運用這套模型時，交易者必須等待
    RSI 擺盪指標進入極端超買或超賣狀態，然後再順著長期趨勢方向建立部位。就此處討論的案例而言，操作準則爲：收盤價位在 200 期簡單移動平均之上，而且 9
    期 RSI 跌破 35，此爲建立多頭部位的買進訊號；反之，收盤價位在 200 期簡單移動平均之下，而且 9 期 RSI 向上穿越 65，此爲建立空頭部位的賣出訊號。而當
    200 期簡單移動平均維持多頭趨勢，9 期 RSI 高於 65 時，就是多頭部位獲利了結的訊號；若是 200 期簡單移動平均維持空頭趨勢，9 期 RSI 跌破
    35，則爲空頭部位的結束訊號。另外，這套系統採用了一種防患萬一的停損：限定每口合約最多損失$7,500（請參考圖 8.9 與表 8.8）。'
