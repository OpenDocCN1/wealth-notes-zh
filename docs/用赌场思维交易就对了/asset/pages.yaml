- pgno: 220
  md: '# 包寧傑帶狀突破系統（Bollinger Band Breakout System）：


    第 3 章曾經介紹包寧傑帶狀突破系統，這是結構最單純的機械性交易系統之一。如同 RSI 趨勢系統一樣，目前這套系統的獲利，主要也是來自於回歸均值系統交易者。此處討論的包寧傑帶狀，是以
    20 期簡單移動平均為中心，然後上、下各取 2 個標準差做為帶狀寬度。傳統運用上，包寧傑帶狀原本屬於回歸均值模型。此處的突破系統，運用原則剛好相反：若收盤價突破帶狀上限，則建立多頭部位；若收盤價跌破帶狀下限，就建立空頭部位。追蹤停止點設定在
    20 期簡單移動平均（請參考圖 8.8 與表 8.7）。


    藉由 CQC，包寧傑帶狀突破系統的編寫方法如下：


    ```

    Long Entry:


    Close(@)[ -1 ] > BHI(@,Sim,20,2.00)[ -1]


    Short Entry:


    Close(@)[ -1 ] < BLO(@,Sim,20,2.00)[ -1]


    Long Exit and Short Exit:


    MA(@,Sim,20)[ -1]

    ```'
