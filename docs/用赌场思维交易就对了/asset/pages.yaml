- pgno: 31
  md: '最好轉頭就逃。我們都是人，對於任何特定市況，我們通常會產生相同的貪婪或恐懼情緒。所以，當我們感覺很好的時候，別人也會有相同的良好感覺，而這就是九成投機客之所以賠錢的原因。反之，當我們幾乎不敢進場時，通常就只有極少數的人敢進場，雖然這麼做在心理上會很不舒服，但往往這也就是賺大錢的好機會。


    讀者現在應該已經知道絕大部分投機客為何會賠錢了。只要深入研究這些投機客之所以賠錢的心理因素，就能有助於我們尋找交易致勝之道，也有助於我們發展正值期望報酬模型。1979
    年，兩位社會科學家丹尼爾·卡尼曼（Daniel Kahneman）與阿莫斯·特沃斯基（Amos Tversky）提出一套有別於效率市場假設的理論。他們不認為市場參與者絕對理性，經濟決策也非追求最大的風險調整後效益（risk-adjusted
    utility）。有關風險和報酬之間的關係，卡尼曼與特沃斯基於此提出很多疑問。這方面的研究成果，就是著名的「前景理論」（Prospect Theory，也叫「展望理論」）與「反射效應」（Reflection
    Effect）。簡單來說，根據這套新理論，市場參與者是理性的，決策程序也不客觀。


    在某個實驗裡，卡尼曼與特沃斯基要求人們在兩個賭局（或前景）之間做選擇：


    +   ※ 賭局A：100%的機會損失$3,000


    +   ※ 賭局B：80%的機會損失$4,000，20%的機會沒有輸贏'
  merge: -1
  img_proc: true
- pgno: 32
  md: '然後又在下列兩個賭局之間做選擇：


    +   ※ 賭局A：100%的機會獲利$3,000


    +   ※ 賭局B：80%的機會獲利$4,000，20%的機會沒有輸贏


    實驗結果顯示，關於第一組選擇，有92%的受實驗者選擇B，至於第二組選擇，80%的受實驗者選擇A。反射效應顯示，有關獲利的考量，我們的決策主要秉持著「厭惡風險」（risk-averse）的原則；至於損失方面的考量，決策則有強烈的「風險取向」（註4）（risk-seeking）。這意味著，所有的人（包括成功的投機客在內）的基本決策反應都相同：每個人都天生傾向於選擇小獲利與大損失（請參考圖1.10）。


    > （註4）請參考Daniel Kahneman與Amos Tversky發表於Econometrica 47（2）（1979年3月）的Prospect Theory：An
    Analysis of Decision under Risk，第263~291頁。


    那麼，投機客的成敗分野究竟在哪裡呢？成功的交易者能夠發展正值期望報酬的模型，嚴格遵循特定的交易法則，讓他們得以克服天生追求小獲利/大損失的決策障礙。他們懂得學習如何及早承認損失，並且讓獲利部位持續發展。我經常告誡學員們，「你們要不斷扪心自問，『我應該如何儘可能降低風險？如何儘可能增加獲利？』」正值期望報酬交易模型將迫使我们做一些讓自己覺得不自然、不舒服的事情。我們如果想成功，就要利用其他交易者天生不合理性與偏頗的決策行為，而且要克服自己在這些方面的障礙。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '![](img/4f4885b7fad5d7bd5221cd08845566cb_33_0.png)


    # 「就是要賺錢」


    有人經常問我，爲什麼我認爲某個市場將下跌。有時也會問我，爲什麼在基本面數據顯然偏空的情況下，竟然會去做多某個市場。如果有時間的話，我或許會說出一、二種理由，但通常我會回答：「你眞想知道驅動價格走勢背後的各種理由嗎？或者你只是想賺錢而已？沒有人會知道價格走勢之所以發生的每個理由。但事實上，根本就不用關心理由，賺錢才是最重要的。」


    基本分析的最大問題，在於它是一種主觀的看法——趨勢線之類的傳統技術指標也是如此。若想要藉由基本分析發展正值期望報酬的模型，恐怕更爲困難，因爲我們主要是希望藉由模型內嚴格的交易法則，協助我們克服先天的交易障礙，避'
  merge: -1
  img_proc: true
- pgno: 34
  md: '免為了追求蠅頭小利，而去承擔重大虧損。記住，不論價位如何，我們都隨時可以找到買進或賣出的基本面理由或論述，否則的話，就不會有人願意在該價位買進或賣出了。另外，這些論述會阻礙我們採行高勝算的行動，甚至會妨礙我們有效管理風險。對於交易來說，我們稱此為因為分析而產生的癱瘓（paralysis
    from analysis）。因此，正值期望報酬模型大多建立在擺盪指標或移動平均之類的客觀數學技術指標之上。關於偏空的存貨數據為何會引發股票行情上漲，或失業率下降為何會造成股價下跌，我們永遠不可能知道所有的理由，但我們可以根據客觀的數學技術指標，建立各種進、出場和風險管理法則。


    這是否意味著基本分析對於投機客沒有幫助？不是的。事實上，我是想要在談論基本分析的效用之前，先說明基本分析在現實運用上受到的限制。那麼話說回來，我們的正值期望報酬模型如何得助於基本分析呢？關於基本分析，我認為交易者應該好好考慮我們常聽到的一些建議（陳腔濫調？）。第一個建議是：「趁著謠言買進，聽到新聞賣出（Buy
    the rumor, sell the news）。」譬如說，假定市場傳言就業報告將顯示失業率下降而經濟狀況好轉；這種情況下，交易者可以考慮趁著謠言買進股票。可是，一旦就業報告真的顯示了預期之中的新聞，交易者就應該賣出了。為什麼？因為驅動股價上漲的理由已經成真，也就沒有動力可以再繼續推升股價了。然而，前述建議有個例外，那也就是我們常聽到的：「市場討厭意外。」'
  merge: -1
  img_proc: true
- pgno: 35
  md: '怎麼說呢？譬如說，市場謠傳失業率將降到 9.7% 而引發行情上漲，但實際公布的失業率如果是 9.1%，那麼就還是應該買進，因爲實際數據明顯超過市場原本預期的程度。


    正值期望報酬模型還能透過另一種方式運用基本面新聞。當市場發生預期之中的利多或利空新聞時，市場有時卻出現背道而馳的反應。舉例來說，2009 年 4 月 29
    日，美國能源部公布當週的存貨資料，顯示能源存量較預期水準多出一倍 ${ }^{(註 5)}$ 。雖然出現此利空消息，但原油價格還是上漲（請參考圖 1.11）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_35_0.png)


    圖 1.11  2009 年 6 月份 CME 原油期貨日線圖：雖然傳出利空消息，價格仍然上漲'
  merge: -1
  img_proc: true
- pgno: 36
  md: '(註 5 )請參考 Elaine Frei 刊載於 Oil Marketer 的文章 Crude Prices Rise Despite Oil Inventory
    Gains in US (2009 年 4 月 29 日)。


    利空背景下出現的漲勢，屬於最強勁的漲勢。所以，當市場發生利空消息時，行情如果沒有因此下跌，通常就是建立部位或加碼的好時機。如同我的好友理查・霍姆常說的，「如果連利空消息都沒能造成下跌，那麼市場對於利多消息會有什麼反應呢？」


    基本分析在正値期望報酬模型中最重要的運用，可能就是用以區分短線消息面衝擊與長期價值變動之間的差異。前文已經談過原油變動到每桶 $40 之上或之下的長期價值變動，這主要是由基本面的供需因素改變所造成的。反之，短期消息面的衝擊，只會造成突兀的價格走勢，而此時人們對於資產價值的看法，並不會有明顯的差異。'
  merge: -1
  img_proc: true
- pgno: 37
  md: '有關短線價格衝擊與長期價值變動之間的差異，且讓我們看幾個歷史案例。圖 1.12 顯示了高級銅長期價值看法上的一個根本變動。2005 年之前，$1.60
    始終是價格走勢上檔難以克服的壓力。可是到了 2005 年，市場對於銅價的看法出現根本變動，原本的上檔壓力 $1.60 反而成爲後續走勢的堅固下檔支撐（直到本書截稿的
    2011 年仍是如此）。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_37_0.png)


    圖 1.12 CME 銅期貨季線永續走勢圖：2005 年的長期價值變動'
  merge: -1
