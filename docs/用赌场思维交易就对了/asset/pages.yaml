  md: '# 效率不完善的市場


    雖然處處可見相反的證據，但學術研究員與很多經濟學家仍然提出所謂的效率市場理論。事實上，市場從來都不具備任何形式的完美效率，行情始終擺盪在恐慌與泡沫的兩個極端之間，而且將來應該還會繼續如此。如同我們稍早曾經提到的，價格行為的這種循環現象，正是市場的常態。


    聽起來雖然很荒唐，但效率市場假說不認為有所謂的「泡沫」，因為市場價格永遠是正確的。換言之，對於這些理論家來說，每朵荷蘭鬱金香在 1637 年 2 月 2 日的價格為
    2,500 基爾德，那完全是合理的，而到了隔天的 1637 年 2 月 3 日，價格突然下降為 2 基爾德${}^{(註2)}$，那也是合理的。我認為，這其實是典型的「拿破崙類比」（Napoleon
    Analogy）。


    （註 2）請參考 Edward Chancellor 的 Devil Take the Hindmost (Plume, 2000) 第 14~20 頁。


    讓我稍微解釋何謂「拿破崙類比」。在某個精神療養院，有個相當具有魅力的人，他相信自己拿破崙，而其他病人也相信他是拿破崙。醫生始終沒辦法說服這個病人，讓他瞭解他並不是拿破崙，而且也無法說服其他病人。有一天，這位病人由療養院逃走，結果才發現外面世界的人都不相信他是拿破崙。事實上當然是如此，因為他本來就不是拿破崙。他是個患有幻想症的病人，而且有能力說服其他患有幻想症'
  merge: -1
  img_proc: true
- pgno: 23
  md: '的人相信他是拿破崙。他或許永遠都不能說服自己相信自己不是拿破崙。同樣地，現在可能還有人相信，那些根據 2005 年左右次級房貸合成的抵押擔保債務工具（Collateralized
    Debt Obligations，CDO）仍然具有面額的價值。雖然他們仍舊如此認定，但這些合成的 CDO 終究已沒有任何價值。這就如同那位自以為是拿破崙的病人一樣，許多金融機構在
    2005 年房市泡沫期間，把這些合成的 CDO 看成是有價值的東西，但這些 CDO 終究還是沒有價值的。


    話雖如此，但就像多數人有可能產生幻覺一樣，價格也有可能暫時與價值脫鉤。本書的訴求對象是短線交易者，不是長期投資人，而短線交易者必須等待證據顯示前述精神病人已經逃離醫院，然後才可以針對不合理的泡沫化價格進行交易。我們必須等待證據顯示價格已經開始下跌，因為非理性價格在崩跌之前，有可能會變得更非理性，這正是市場缺乏效率的常態，也是市場價格分配的性質——相較於常態分配，實際價格分配的兩側尾部都會顯得較肥厚（換言之，兩側尾部的極端事件，發生機率高於常態分配所預測的水準）。沒有人知道行情頭部什麼時候會發生，除非價格已經開始下跌，才能證明頭部確實已經出現。凱恩斯（John
    Maynard Keynes）曾經說過，「市場保持非理性狀態的時間，可能遠超過你或我之財力所能夠維持的程度。」我也經常說，「不要猜測，只要參與」（Don''t
    anticipate, just participate）。務必要等待證據出現，等到頭部的賣壓出現再賣出，或是等到底部的買盤出現再買進。綜觀金'
