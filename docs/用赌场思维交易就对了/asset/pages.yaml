    # 整合討論：個案研究


    某位投機客運用 $100,000 建立期貨交易帳戶。他準備同時從事黃金、玉米與 S&P500 迷你合約的交易。對於任何單筆交易，他所能夠接受的風險爲帳戶淨值的
    2%。所以，對於每口合約，起始停損不得超過 $2,000。假定歷史測試資料顯示，黃金、玉米與 S&P500 迷你合約之間的價格相關很低；這種情況下，對於這三種資產來說，每種最高都可以承擔
    $2,000 的風險。話雖如此，但歷史價格關係可能斷裂。所以，他決定，三種資產承擔的總風險，仍然不宜超過 $2,500，相當於帳戶淨值的 2.5%。


    2010 年 10 月，交易模型同時出現兩個進場訊號。一是 2010 年 12 月份玉米合約的費伯納奇折返買進訊號，另一是 S&P500 迷你合約的突破訊號。就玉米來說，他準備用限價單在
