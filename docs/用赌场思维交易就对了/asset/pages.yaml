- pgno: 302
  md: '問：隨著管理資產規模放大，如何調整交易方法或交易市場？


    帳戶資產規模放大之後，不只允許我們交易價格波動較劇烈的市場，也可以建立多口合約部位，因此可以採用第 6 章所談到的分批進場、出場策略。


    問：關於報酬率，以及從峰值到谷底的原值最大耗損，你設定的目標如何？


    這個問題的答案，可以說明你屬於哪種類型的交易者。一般來說，報酬率愈高，最大淨值耗損也愈大。某些交易者願意接受 20% 報酬率與 5% 淨值耗損，另一些交易者則希望接受
    32%的報酬率與 8%的淨值耗損。


    我建議交易者根據個人交易風格與個性，設定適當的報酬率與淨值耗損目標。報酬率目標下限顯然應該超過無風險報酬率（美國國庫券報酬率）。就我個人來說，淨值耗損上限最好不要超過
    10%。關於這個目標，或許有人認為 10%太過保守，但這畢竟是取決於個人的風險偏好（請參考第 2 章）。


    問：你的交易對象包括哪些（現貨外匯、期貨、選擇權、股票、期貨價差…等）？


    每種資產各有其特有的流動性風險、時間限制、價格波動問題、價格衝擊事件…等。舉例來說，選擇權有各種履約價格，'
  merge: -1
  img_proc: true
- pgno: 303
  md: '這自然會影響所有履約價格選擇權的流動性。另外，選擇權持有人必須承受時間經過而導致選擇權價值減少的風險，但不必承受價格衝擊事件的風險。相反地，選擇權銷售者（還有期貨、股票、外匯交易者）則必須承擔價格衝擊事件的風險。有關各種交易工具特有的風險和機會，相關討論已經超過本書內容範圍，但交易者務必要瞭解這方面的細節，交易方法也要隨之做調整。


    # 風險管理


    這部分資料主要是用來補充本書第 2 章的討論。第 2 章討論一些較普遍的風險議題，譬如：停損設定、部位規模設定、資產價格相關、價格波動程度…等，此處的問卷則希望讀者把第
    2 章的考量引用到特定交易方法上。


    問：你如何決定部位規模上限？


    個別部位規模的上限，通常設定為整體帳戶資產價值的1~2%左右（參考第 2 章）。


    問：關於交易資產彼此之間的價格相關和價格波動率，你如何運用？


    價格相關與價格波動率乃運用於風險值模型（Value-at-Risk models）。此處準備討論一些工具，用以糾正資產價格相關方面的偏頗。談到偏頗，一般人都會想到多、空之間的偏'
  merge: -1
  img_proc: true
- pgno: 304
  md: '頗，或順勢、逆勢之間的偏頗，但即使是老經驗的交易者，也常發生價格相關方面的偏頗。


    簡單地說，價格相關程度隨時會變，而且會持續變動。雖然任何交易方面的偏頗都很危險，但對於價格相關程度的偏頗尤其可能引發嚴重後果，因為我們經常誤以為這方面的風險管理很周全。最安全的做法，就是利用價格相關做爲風險管理工具，避免信用過份擴張。


    如果藉由價格正相關來猜測交易訊號，那是相當不明智的做法。舉例來說，如果錯失了福特汽車的買進訊號，我們不能只因爲福特汽車與通用汽車的歷史價格存在高度正相關而買進通用股票，除非通用汽車本身也出現買進訊號。爲什麼？因爲價格相關只代表兩者之間的歷史價格存在高度相關，但不代表兩者之間的目前或未來價格仍然存在高度相關。譬如說，福特汽車之所以出現買進訊號，可能是因爲通用汽車發生罷工。由於價格相關性隨時可能會變，而且會持續變動，所以太過仰賴資產價格之間的正負相關，恐怕只會更危險（請參考第
    2 章的表 2.1 與表 2.2）。


    # 問：保證金對帳戶淨值最大比率為何？單一資產類別的最大風險為何？


    一般來說，保證金對帳戶淨值最大比率的下限爲 25%，上限則爲 50%。這個比率不該超過 50%，一方面是要保留一些'
  merge: -1
  img_proc: true
- pgno: 305
  md: '彈藥，防範既有部位平倉之前，又出現可供交易的訊號，另一方面則是要防範追繳保證金的情況。


    任何單一類別資產允許承擔的最大風險程度，通常設定為總資產的 1%~5%。前文曾經談到資產彼此之間的價格相關，只代表歷史價格之間的相關，所以我個人把這個比率設定為
    2~3%左右。


    # 問：增加或減少某資產類別之部位規模，是否會影響其他部位的規模，或影響其他的交易？


    有關不同資產彼此之間部位變動的關係，價格相關分析可以協助處理這方面的問題。


    讓我們來看個不錯（但稍微積極）的技巧，可運用於價格高度相關的資產：假定交易者打算藉由賣出停止單同時在 CME 美國 10 年期公債和 5 年期公債期貨建立空頭部位。這種情況下，部位規模要稍微小些，因為兩者之間存在高度價格相關。如果行情下跌而引發
    10 年公債的空頭部位，卻沒有引發 5 年期公債的停止賣單，則可以考慮把停損回補買單調整到損益兩平點的稍下方，並且增加 5 年期限停止賣單的規模為 2 倍。這種情況下，如果空頭走勢為假突破，5
    年期的停止賣單不會被引發，10 年期合約空頭部位設定在損益兩平點的停止買單會被引發。反之，如果向下突破持續發展，則公債空頭部位會增加，但風險不會顯著增加。（請注意，在重大訊息即將'
  merge: -1
  img_proc: true
- pgno: 306
  md: '公布之前，這種策略恐怕不適合執行，因為停止單的滑移價差經常會很大。）


    # 問：所採用的停止單類型？


    第2章曾經談到各種類型的停止單，包括：以時間為基準的停止單、指標驅動的停止單、價格停止單、價格波動停止單、金額管理停止單等等。務必根據自己的交易風格與個性，挑選適當的停止單類型。


    # 問：部位呈現顯著獲利或虧損之後，是否調整部位規模？


    關於這方面的調整，第2章曾經談到拉夫·溫斯（Ralph Vince）的固定比率方法。


    # 問：有沒有哪些極端事件，會促使你結束所有的部位？


    原則上，不論市況如何變動，我們都應該完全聽從交易系統的指示，但態度也不應該太過死板。價格衝擊事件有時候會引發價格劇烈波動，嚴重影響市場流動性。所以，我們應該預先決定，價格衝擊到達哪種程度，我們就結束所有的部位。，


    # 問：帳戶淨值耗損到達哪種程度，你才會關閉帳戶？


    我個人採用20%的水準，但我也聽說其他業者普遍採用37.5%的水準。把這個水準壓低一點，可以彰顯謹慎的風險管理心態。'
