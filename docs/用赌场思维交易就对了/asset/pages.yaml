- pgno: 59
  md: '關於金額或價格百分率的停損方式，有一點值得特別強調。停損設定務必考慮資產價值波動，而不要盲目設定某特定數字。換言之，就算承受得了 $1,000 以上的風險，也千萬不要對於任何交易都盲目設定
    $1,000 的停損；停損設定應該要考慮如何降低資產價值波動，而不要讓行情隨機波動引發停損（進一步討論請參考第 5 章）。


    最後，我們還要考慮停損設定的時間考量。事實上，稍早討論的工具也涉及了時間因素，譬如圖 2.9 所顯示的價格衍生停損，其中的停損設定為先前 3 天的最高價或最低價。除了價格與技術指標所衍生的停損設定，有可能會涉及時間因素之外，我們也可以運用時間本身，以迫使交易部位進行停損。


    讓我們看個典型的例子：我們可以設定進場建立部位經過 3 天之後，如果根據市價進行結算而發生虧損，就必須認賠。我個人建議，時間停損最好只運用於部位發生未實現虧損的情況。若把這種策略運用於未實現獲利部位，不僅違背直覺，而且也會嚴重影響交易績效（詳細討論請參考本書第
    5 章）。


    # # 量化部位規模設定


    停損設定雖然是最基本、絕對不可或缺的風險管理工具，但它還必須配合量化部位規模設定，否則並不足以確保風險管理成功。停損所要處理的問題是：「為了保障資本，失敗部位應該在哪裡認賠？」部位規模所要處理的問題則是：「我應該'
