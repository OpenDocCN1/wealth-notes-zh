  md: '市場收盤之後，我關掉電腦，照例打開電視，想看些財經新聞當做娛樂。就在這個禮拜五，市場剛收盤，他們訪問了兩位市場專家。一般來說，兩位專家之中，有一位會持著多頭論述，另一位則持空頭觀點。當天的第一位分析師認爲，道瓊工業指數會拉回到
    5,000 點，S&P 500 指數會回到 500 點附近。當這位專家剛說完「500 點」，另一位分析師馬上插話說，「你瘋了。」這時我想，「嗯，大多頭要出來說話了。」沒想到我本來以爲的大多頭，竟然認爲道瓊指數會回到
    2,000 點，S&P 500 則會回到 200 點。我瞄一下電視底端的指數，想確定我到底有沒有搞錯…沒錯，S&P 的 E-Mini 期貨確實收在 687.75。我心中盤算著，「市場如果收在
    687.75，而看法偏多的分析師竟然認爲行情會回到 500 點，那意味著價格應該見底了。」結果我的看法完全正確，2009 年的股票市場底部就出現在 3 月
    6 日星期五（參考圖 1.7）。如果採用回歸均值模型，交易者理當在市場看法絕對偏空的時機買進，或者是在 1630 年代的泡沫化市場中放空鬱金香（或者是在 2005
    年放空房屋市場）。


