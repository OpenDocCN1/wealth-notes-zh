    # 費伯納奇折返模型


    折返比率究竟應該從哪個循環高點或低點衡量，雖然沒有普遍能夠被接受的客觀基準，但很多交易模型還是會納入折返理論，用以判斷可能的進場或出場目標價位。


    道氏雖然早在 1900 年左右，就談到如何趁著行情折返而買進或賣出的技巧，但投機客目前大多採用艾略特（Ralph Nelson Elliot）在 1930
    年代發表的一些技巧，主要是根據費伯納奇比率（包括：38.2%、50%、61.8%…等）決定折返目標價位$^{(註27)}$。


    （註 27）請參考 John Murphy 的《金融市場技術分析》（Technical Analysis of the Financial Markets,
    New York Institute of Finance, 1999，寰宇出版，F155/F156）。


    圖 8.11 顯示自由心證交易者如何藉由費伯納奇折返比率，相對客觀地決定進場價位與風險 - 報酬關係。如同我們稍早曾'
