- pgno: 300
  md: '短期新聞事件。交易方法必須要有因應價格衝擊事件的具體方法，包括虧損部位的出場（參考第 2 章），以及獲利部位的管理（第 6 章）。


    +   問：說明所採用的技術指標，以及相關指標如何建構為交易方法。


    說明應該儘量詳細，包括進場、停損與獲利了結所採用的各類指標（譬如：趨勢線、支撐／壓力、擺盪指標、移動平均、價格波動指標、基本分析指標、神經網絡、統計指標、成交量／未平倉量、價差關係、季節性型態、循環分析…等），並說明這些指標如何影響交易。


    +   問：所採用的交易方法是否偏多或偏空？


    除了股票交易系統之外，我認為交易方法不該有偏多或偏空的傾向。交易系統應該儘量排除主觀偏頗，包括偏多與偏空在內。若想要消除交易者偏多或偏空的傾向，可以請他嘗試外匯交易，因為匯率是由兩種通貨（資產）的價格所構成，交易者永遠有可能做多某種資產而做空另一種資產。


    有人說，放空股票是不愛國的行為。關於這種說法，我的看法是，不支付資本利得稅才是不愛國。關於做多與放空偏頗的議題，丹尼斯．加特曼（Dennis Gartman，他是
    The Gartman Letter 的發行人）曾經說過，「金融交易就像傭兵打仗。」'
  merge: -1
  img_proc: true
- pgno: 301
  md: '換言之，誰出的錢多，我們就幫誰打仗；哪邊容易賺，我們就跟哪邊做交易。


    請注意，多頭走勢與空頭行情的性質不同（前述外匯市場是例外）。行情會出現崩盤跌勢，但我們沒見過「崩盤狀」的漲勢。舉例來說，道瓊工業指數花了 4 年的功夫才由
    7,500 上漲到 14,000 但只花了 13 個月就從 14,000 跌到 7,500（參考圖 11.3）。換言之，空頭市場的發展通常比較快速、激烈；因此，交易者通常需要針對市況做調整。


    ![](img/4f4885b7fad5d7bd5221cd08845566cb_301_0.png)'
  merge: -1
