- pgno: 96
  md: '總之，就布蘭特原油的歷史測試資料做比較，如果只關心風險調整後報酬率，我們應該挑選 RSI 趨勢模型，因爲其淨獲利對最大耗損的比率最高，請參考表 3.1
    的 P：MD 數據（淨獲利對最大淨值耗損的比率，也就是 ProfitToMaxDraw）。可是，有經驗的交易者應該能夠體認，究竟如何挑選正值期望報酬交易模型，很大成份取決於本身的個性，你必須挑選自己能夠確實遵循的系統，否則就是挑選了「毒藥」。交易者如果忽略了自己很難承受連續虧損的煎熬，結果就有可能在遭遇連續幾筆失敗交易之後，決定放棄
    RSI 趨勢系統，如此可能會蒙受 $16,400 的虧損，而不是獲得堅持到底所享有的 $99,990 獲利。如果發現自己想要勝率更高、連續虧損狀況更少的系統，或許就該挑選包寧傑帶狀突破系統，因爲其勝率最高，最不容易發生連續虧損。反之，如果你希望盡快認賠失敗部位，希望失敗部位的平均損失最小，而且希望儘可能從事短線進出，那麼較短期的
    RSI 系統最理想。所以，哪種交易系統最理想？這個問題沒有絕對的答案。每個人都要根據自己的需要，尋找適當的交易系統。


    # # 交易者類型


    雖然正值期望報酬模型會隨著不同人、不同的個性而有所不同，但一般來說，這些模型都可以被區分為以下幾種（參見表 3.2）：長期順勢操作、波段交易、當日沖銷、短線帽客。'
  merge: -1
  img_proc: true
- pgno: 97
  md: '| 類 型 | 持有時間 | 優 點 | 缺 點 | 重 點 | |---|---|---|---|---| | 長期 | 超過 10 天 | 盈虧比率
    | 凌遲煎熬 | 分散風險 | | 波段 | 2~10 天 | 彈性：順勢或逆勢部位 | 連續虧損之後還要堅持 | 部分獲利了結 | | 當日沖銷 | 少於
    1 天 | 不必承擔隔夜風險 | 緊盯螢幕 | 運用新聞事件 | | 短線帽客 | 幾分鐘 | 勝率 | 火中取栗 | 藉由時間控制風險 |


    # 長期順勢操作


    長期順勢操作者通常只會順著較長期趨勢建立部位。我們所謂的長期趨勢，是指延續了 6 個月或以上的趨勢。先前討論的 MACD 穿越系統與包寧傑帶狀突破系統，都屬於長期順勢系統。長期順勢操作者持有部位的期間，通常會超過
    10 個交易日，所以務必要堅持正確的部位。由於市場通常只有 30% 時間存在顯著的趨勢，所以交易者需要特別講究資產配置，而且要準備充裕的資本。這類型交易之平均獲利對平均虧損的比率相對較高，但為了確實掌握每個趨勢機會，勝率通常會偏低。因此，這類系統也經常符合「千刀萬剮凌遲」的形容。如果你不能忍受重大獲利可能演變爲小贏收場，沒有辦法把認賠視爲常態，如果想要擁有多高的勝率，顯然就不適合採用長期順勢系統。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '這類交易模型的重要輔助工具：


    +   ※ 足夠分散的資產配置，確保能夠掌握每個市場所呈現的趨勢機會。


    +   ※ 部分獲利了結：在合理的技術支撐／壓力位置先做部分獲利了結，通常是整體部位的三分之一或一半（支撐／壓力的判定技巧，請參考第 6 章）。


    +   ※ 運用擺盪指標、折返比率（參考第 8 章）、時間架構背離（參考第 7 章）等技巧，協助尋找低風險進場點。


    # 波段交易


    波段交易者可以順著主要趨勢方向建立部位，也可以參與逆勢走勢。部位持有期間通常介於 2~10 個交易日；所以，我把前文討論的 RSI 趨勢系統與較短期 RSI
    模型歸類於此。相較於長期順勢交易，波段交易者的勝率通常較高，失敗部位的平均損失也較小，但在一系列失敗交易之後，必須仍然願意按照系統的指示建立部位，而且成功交易平均獲利對失敗交易平均虧損的比率也會較低。


    這類交易模型的重要輔助工具：


    +   ※ 足夠分散的資產配置，確保能夠掌握每個市場所呈現的波段交易機會。'
  merge: -1
  img_proc: true
- pgno: 99
  md: '※ 部分獲利了結：在合理的技術支撐／壓力位置先做部分獲利了結，通常是整體部位的一半或四分之三（支撐／壓力的判定技巧，請參考第 6 章）。


    # 當日沖銷


    當日沖銷者可以順著短線或長線趨勢建立部位，也可以參與逆勢交易。根據定義，這些部位必須結束於相關市場當天收盤之前，所以不會受到隔夜風險事件的威脅。當日沖銷者持有部位的時間很短，因此需要挑選勝率較高的系統。當日沖銷者雖然不必因爲隔夜部位而擔心，但盤中必須經常擬定買賣決策，壓力相當沈重，而且必須緊盯著盤幕，因爲交易者很難針對盤中可能發生的走勢預作規劃（正因爲如此，這類模型也較難進行歷史測試）。當日沖銷雖然可以把風險分散到幾個不同的市場，但只能挑選流動性夠高的市場。


    這類交易模型的重要輔助工具：


    +   ※ 運用時間（尤其是收盤）做爲次要的風險管理工具。


    +   ※ 運用短期新聞事件（譬如政府公布經濟報告），尋找技術性支撐／壓力區的交易機會。


    # 短線帽客


    短線帽客的部位持有期間，可能是幾秒鐘，或幾個鐘頭。這類交易雖然不受趨勢方向限制，但所運用的模型，通常會儘'
  merge: -1
  img_proc: true
- pgno: 100
  md: '量掌握短期或盤中的逆勢交易機會。因爲這個緣故，而且短線帽客經常在走勢回歸均值的 位置結束部位（而不是讓獲利部位儘可能持續發展），因此有句話形容這種類型的交易：「在奔馳的列車前面撿銅板」。由於部位持有時間極短，交易頻繁，這類玩家通常會挑選流動性最高的一、兩個市場。跟當日沖銷者一樣，他們不會持有隔夜部位。可是，短線帽客通常不會在重大風險事件發生時進行交易（譬如：政府公佈重要經濟數據），這點跟當日沖銷者的立場不同。另外，由於進出頻繁，他們會挑選勝率高的交易系統，但成功部位平均獲利對失敗部位平均虧損的比率則很低。交易進行得愈頻繁，交易者承受的壓力也愈大，更須被綁在報價螢幕前。


    這類交易模型的重要輔助工具：


    +   * 通常採用 2~5 分鐘的走勢圖，做爲風險管理的主要工具。至於災難性停損，可能會設定在較長期走勢圖（小時走勢圖或日線圖）的支撐/壓力區。


    +   * 不論獲利了結或認賠，手腳都很快。


    +   * 避開短期新聞事件（譬如重要經濟報告），因爲這不利於超短線交易模型的風險-報酬架構。


    總之，發展一套理想的正值期望報酬模型，並不只是單純追求最高的風險調整後報酬：交易系統的性質，也必須符合使用者的個性。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# 交易紀律與價格風險管理


    交易紀律最容易發生問題的地方，通常都在風險管理方 面。如同本書第1章曾經提到的，根據丹尼爾·卡尼曼（Daniel Kahneman）與阿莫斯·特沃斯基（Amos
    Tversky）有關於「前 景理論」（Prospect Theory）的研究，人類普遍都有拒絕認賠 的心理偏頗，而所有社會制約更傾向於強化這種天生偏頗。不
    論是從小接受教育，或長大服務於社會，我們都被灌輸一種絕 對不可認輸的思想，我們把「認輸」跟「輸家」連結在一起。 很有趣的是，對於金融交易來說，贏家反而是那些願意認輸的
    人；在這個領域裡，我們必須學習如何跟「交易」分割，交易 盈虧並不代表我們本身的輸贏。當然，我並不是建議各位只要 看到交易稍有虧損就立即認賠，目的只是為了證明自己具備認
