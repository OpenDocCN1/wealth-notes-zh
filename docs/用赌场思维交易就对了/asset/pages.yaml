- pgno: 239
  md: '# 結合技術指標


    非機械化交易模型經常會綜合採用前文所提到的多種技術指標，甚至會配合基本分析通用（譬如：政府報告、氣象報告、國際政經發展、中央銀行利率政策…等）。這方面的組合雖然不計其數，但我們還是可以看個簡單案例。


