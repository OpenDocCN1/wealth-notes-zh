    \n人吃火锅，熬夜，都很容易上火，于是把中药结合饮料，把王老吉变成了“怕上火”功能性饮料，给众多容易上火人群的提供了解决方案，一下子拥有了巨大的市场。\n\n\
    ——因为很多人怕上火，不敢吃辣，怕嘴上起泡。所以王老吉解决了这个问题。\n\n## 举例 3：卖蜂蜜\n\n如果单纯卖蜂蜜往往不好卖，但是你可以把蜂蜜变成便秘、美容养颜、烧烫之类的问题的解决方案，这样蜂蜜的市场就大多了。\n\
    \n因为很多美女本来没有想要吃蜂蜜，听说隔壁王阿姨每天坚持喝蜂蜜，皮肤变好了，人也变健康了，还不便秘了。她也偷偷的每天晚上喝了起来。\n\n就像我们家族卖烤鸭，单纯一个烤鸭，对人就是一个菜的问题。但是我给他是包装一下：可以写上具有滋补，润阴，养颜，减肥功效之后，发现有些美女，就天天坚持吃一个烤鸭。本来他们是没有需求的，但是听说烤鸭可以减肥，果不其然，他真的瘦了。\n\
    \n如果你精通这个思维，几乎可以卖出任何产品。\n\n## （一）赚钱就是链接问题方案和答案的过程。\n\n古今中外所有的商业，都是在做对接这件事情，而营销只是链接的工具。\n\
    \n为什么我一个“悟”字，可以卖 10000 元，还有人抢着要？\n\n其实，因为我能让一些老板，感觉我能帮他解决问题，让他利润翻倍。那么他还会在乎这 10000\
    \ 元吗？\n\n如果你不具备这个思维，你就不了解赚钱的本质，但是一旦具备了链接思维，你就会发现机会到处都是，因为世界上的问题和答案都太多了，你只要集中精力解决某一个就可以了。\n\
    \n但是仅仅知道链接还不行，还得精通如何链接，下面是我总结的链接框架（即营销框架布局）：\n\n+   1、产品定位（产品或服务，梦想概念）\n\n比如：\n\
    \n+   送礼，是脑白金的定位；\n怕上火，是王老吉的定位；\n去屑，是海飞丝的定位；\n....\n\n布局，是卧龙 的定位。\n\n智慧，是刘一秒 的定位。\n\
    \n成功学，是陈安之 的定位。\n\n潜能开发，是安东尼罗宾 的定位。\n\n免费模式，是壹玖资本 的定位。\n\n没有一个好的定位和概念，再好的产品和服务都不好卖。反过来呢，给普通的产品一个好的定位和概念，也许突然就火了。\n\
    \n一定要占领消费者心智。产品是形，概念是神。\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_4_0.png)\n\
    \n现实中的一个经典案例：这个老婆婆现在就是单纯卖产品，是没有神，没有概念的。\n\n好了，我们策划人员，看他比较辛苦，就给他加点内容上去。\n\n然后找了一个泡沫，从手里拿出笔写了一句话：\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_5_0.png)\n\n然后把这个牌子放到老人制作的鞋垫旁边。\n\n\
    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_6_0.png)\n\n刚放上去，不到 5 分钟，就有人来买鞋垫了。\n\n\
    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_6_1.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_7_0.png)\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_7_1.png)\n\n而原来，等 30 分时=半小时，也不见得会有人理。\n\
    \n记住：产品是形，概念是神。 形神兼备，方能达到 \"神\" 一般销量的境界。\n\n+   简单理解：好产品需要好文案。  \n好产品需要好的策划。 \
    \ \n好产品需要好的商业模式。  \n好产品需要好的运作团队。\n\n好产品更需要包装，定位； 如果没有定位，没有区分，那么就是等于大家都一样，买啥都是买。\
    \ 没有差异化。\n\n有了产品定位，包装，那么下一步就是流量模型=传播出去。（获取流量）把产品，产品\n\n信息通过各种途径传递出去，展现在顾客面前。\n\
    \n顾客看了产品或产品信息会自动得出一个结论，你可能有他问题的解决方案，你的产品还不错，你真好厉害，佩服，然后主动来找你，比如访问你的网站、朋友圈、公司、店铺，拨打你的电话，主动联系你等等。\n\
    \n有了产品+流量。 下一步就是我们流量转化成成交模型了。简单理解就是把来找你的潜在顾客成交\n\n成交核心一般只有 2 点：\n\n+   - 价值（好处）\n\
    - 信任\n\n所有的营销方法，都是为了让好处和信任最大化，无论线上或线下，只是传递好处和信任的工具。\n\n简单理解，我看了你的产品还不错，然后看你人也不赖，我就愿意跟你买。\n\
    \n产品不够好，我不会买。人不咋地，我也不会买。满足以上 2 个基本条件，别人才愿意给你钱。\n\n如果你的店铺，为什么没有生意，或者为什么没有人愿意转介绍，试问你给客户多少价值？又有多少信任?\n\
    \n以上是从业营销 11 年总结出来的一个赚钱公式，即：赚钱=问题+答案；\n\n赚钱=问题一营销（产品，流量，成交）——答案；\n赚钱=选产品+引流量+会营销（会成交）+能坚持。\n\
    \n既然说到赚钱，我个人很喜欢倒推。那么我们为什么花钱？\n\n花钱（给好处，利益）=问题（你想要解决的问题[物质=产品+精神=服务]，如：做网站，好的文案…）+答案(你想要的结果）；\n\
    \n——简单理解，我们花钱，就是想得到我们想要的结果。\n\n当然了至于怎么花钱，我们一定有很多要解决的问题，你能解决我的问题，帮助我达到我想要的，我就愿意给你钱。\n\
    \n营销公式：产品模型-流量模型-成交模型+杠杆模型。一切商业均是如此。\n\n上面是我们《布局策略》基本营销公式。\n\n# 卧龙营销咨询《布局策略》：内部资料\n\
    \n很多人不知道怎么选项目。  其实事实也很简单。\n\n## 【怎么一周内找到合适的项目（产品）】【项目怎么找？没方向，迷茫？】\n\n建立一个项目广告库，没必要过于创新。我\
    \ 一直提倡：新模式=模仿+稍做创新；坚持：一广告，一项目。线下的直接拍照，回来总结反思。\n\n具体如何行动：1 天收集 10 个广告案例或者线下火爆的生意项目有问题吗？\n\
    \n10 个，建立分组。并研究战略，战术，思维，去测试一个你认定不错，非常有价值，找到这个行业前几名做的不错的人，研究模式，解读模式，复制模式，学习，反馈反省。微创新成为自己的体系。\n\
    \n小规模测试成功，大规模复制，放大，系统化，流程化，自动化。——所有项目标准万能公式。\n\n无论他是多大企业，多牛逼的人，多么成功的人，都是这么一步步来的。\n\
    \n小米，阿里巴巴，腾讯，京东，国美…  都是通过测试，复制；放大；优化；团队化，系统化，流程化，自动化；整合化，资本化，一体化。这样一步步来的。\n\n\
    6 大吸金项目方向：1，男人好色 2，女人爱美 3，小孩爱聪明 4，老人爱健康 5，人人想赚钱 6，人人要智慧……\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_9_0.png)\n\
    \n那么，广告怎么找？\n\n线下：街头传单，各种广告，超市，孵化器，天使投资人，平面广告，名片，圈子，朋友介绍，报纸，招商会，展会，各种市场，万达，十字街，培训机构当卧底，卧底，快递员，调研，电视……\n\
    \n10\n\n## 卧龙营销咨询《布局策略》：内部资料\n\n线上:\n\n+   1. 百度系列（百度百科，百度知道，百度文库，百度贴吧；爱奇艺…）\n\
    2. 阿里系列（淘宝，天猫，支付宝，阿里巴巴..）\n3. 腾讯系列（QQ，QQ 空间，微信，QQ 群…）\n4. 各种论坛（天涯，猫扑）;YY，各种贴吧，各种好玩软件（快手，小影，交友软件..），黑马会，网赚论坛，拉勾网，专业类型网站，招商网站，分类信息（58，赶集，百姓…），威客系列（猪八戒，威客中国，任务中国..），私募，天使投资（点名时间，众筹网，拉勾网），网盟，A5\
    \ 站长网…\n\n## 案例:\n\n我是怎么靠风水赚钱滴？\n\n每天习惯性加 10 到 20 个同行，看看他们是怎么引流，怎么释放价值的；每天习惯性加\
    \ 30 到 50 个群，在群里免费做服务，大家觉得准就给钱，觉得不准，就不要给钱。每天大概免费帮 50 到 80 人算命看八字，日保底收入 500 到 1000\
    \ 左右。长年累月就重复这一傻乎乎动作。目前车库都有。\n\n> 【警告：不要低估任何一只能坚持发 6 个月甚至更长时间的广告，背后一定有让你无法想象的利润】\n\
    \n> 【提示：你说人家刷朋友圈骗子，你说人家假货，你说这个，那个怎么可能赚钱，又怎么可能那么简单，怎么可能有人买，不试试怎么知道。不要妄言和否定任何一个广告和任何人，事，不测试，没有体验，没有了解，没有实战，都没有发言权。】\n\
    \n> 【产品类型】产品分类，无非：卖产品（实体产品+虚拟商品），卖服务。\n\n实体产品：糕点，家具，家电，办公用品，水果，蔬菜，图书，化妆品，建材，医药，日化，保健，看得见摸得着都是···\n\
    \n虚拟产品：\n\n+   0.各种网络账号，各种 VIP 账号，爱奇艺会员\n1. 网络游戏点卡、网游装备、QQ 号码、Q 币等；\n2. 移动/联通/小灵通充值卡；\n\
    3. IP 卡/网络电话/软件序列号；\n4. 网店装修/图片储存空间等。\n5. 电子书，网络软件\n6. 辅助论坛功能商品等\n外挂，游戏币，电子书，/约炮秘决，电影，各种大师视频，内部资料，手机号，YY\
    \ 账号，营销软件，企业管理软件，网站，p2P，光碟，CD，定制软件，百度竞价，网盟，网页制作…\n\n11\n\n服务：\n\n+   金融类：网赚项目，各种项目或创意，各种招商项目，天使投资，私募，理财（现货，基金，股票，期货；银行，p2p，保险…），代理记账，注册，贷款\n\
    \n+   教育类：vip 圈子，小吃技术传授，总裁培训班，学校，政府，律师，策划，咨询\n\n+   个性技能类：私人定制（形象设计，家居生活设计，店面设计…），经纪人（明星，舞团，各种节目，展览…），维护，服务器管理，IT（软件开发，员工外包..），展销会…\n\
    \n+   普通类：色情，瑜伽，舞蹈，音乐，健身，桑拿按摩，ktv，理疗，私人医生（厨师，理发师，美容师，减肥师，美甲，保姆，录像…）跑腿，外送（宅急送..），代要账，保镖，物流，旅游，劳务中介，打工者，雇佣兵，私人侦探，打假人士，家政，婚介，技术培训（舞蹈，音乐，美术。）\n\
    \n## 【选择产品的核心：】\n\n+   1，是否最大面积解决人类的问题\n\n+   2，产品是否可重复消费，像毒瘤一样，上瘾。\n\n盈利的重点在于开发客户终身价值，开发一次，消费一生。\n\
    \n+   3，产品是否可大批量复制\n\n为什么？卖导弹的不如卖茶叶蛋赚钱？ 因为需求量少。\n\n量大是所有成功致富的关键。（洗头：去屑海飞丝；洗衣：碧浪洗衣液；喝茶：怕上火，喝王老吉；欧莱雅：让你更美丽！）\n\
    \n## 【产品模型】商业的本质交换！赚钱必须要有一个产品。\n\n+   0、市场调查，寻找空白与差异化的市场定位。\n\n任何项目必须经过市调，市调，市调。\
    \ 而且拥有高手的市调习惯。 没有数量级市调=项目失败；\n\n所方案制定和项目成功落地，都一定需要高手级市调（市场调研），不了解情况，就制定方案的人都是怎么死的不知道。无论是商业还是战争，市场情报工作永远放到第一位。\n\
    \n再小的项目也是一个系统的工程：从产品，设计，研发，测试，文案，推广，包装，塑造，引流，成交，后端，售后，团队管理，资本运作，并购，风投，股权，整合……每一个，都是一个点，最后组成了一个项目落地方案。\
    \ 全方位的项目方案。\n\n做任何一个项目，首先要考虑的是什么？  想不想做任何项目，都能 100%成功那。\n\n+   1，市场调研，市场情报工作永远是第一位。\
    \ 市调，市调，市调，还是市调.... 这是一个项目最基本的点。\n\n+   2，研究消费者花费多少时间都不为过。企业的首要利益相关者是客户。如果客户不满意，其它任何事情都免谈…\
    \  这个永远是第二位要解决的问题。\n\n+   3，研究竞争对手花费多少时间都不为过。 找 100 个案例，专业研究行业前 3 名+留意黑马；\n\n\
    +   4，研究自身优势，劣势，已有资源花费多少时间都不为过。\n\n+   5，研究人性，布局花费多少时间都不为过。学会分钱，利益分配。 世界上所有事情都是搞定人为初衷！\
    \  舍得=先舍后得，欲取先予；分钱=先分，才有钱。 分的越多赚的越多。赚钱是表象，分钱是本质。  会赚钱是个人能力的体现。 会分钱可以把别人的能力变成你的能力，无数人赚不到大钱的原因，是只会使用自己的能力，分钱，让\
    \ 1000+个有能力的人帮你干，一定可以获得巨大的成功；\n\n无数人不能有大的成功的原因，是只想赚钱不想分钱，自己死磕干，3 代人死磕也不会有大的成功。就像李嘉诚：“每次分钱，分给别人\
    \ 6 成，自己只拿 4 成。”结果越来越多人愿意跟他合作，给他打工。  想大成功，必须学会分钱；  财散人聚，学会分钱，造梦，才能让更多有梦想的人，立场，价值观一致的人跟随你！\
    \  崇拜你，迷恋你；\n\n只需要做好以上 5 点，几乎做任何项目都能 100%成功。 相信我。\n\n这里为了方便各位理解，我讲一个真实的故事。\n\n\
    李明在上海工作，一直想找一个创业的机会，因为自己上班，很少有机会吃早餐，偶然发现身边的许多朋友也是如此。  于是想通过卖豆浆，早餐赚钱。于是，他按照卧龙的公司，开始第一步调研市场。\n\
    \n## 第一步\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_13_0.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_13_1.png)\n\
    \n经过详细市调，李明认为豆浆可以自己制作，区销售。 而且方便，快捷。 而且市场足够大。\n\n+   实操：李明想要在一座城市卖豆浆赚钱。\n\n+  \
    \ 通过研究市调，消费者，研究自己，研究竞品，发现一些问题。\n\n问题 1：市场上速溶豆浆卖 1.5 元/杯子，而现磨豆浆可以卖 2.5-3 元/杯，只能从口感上与速溶竞争，如何找到最好的豆浆产品？？？？\n\
    \n问题 2: 打算先往各个小区发名片和广告，看看有多少人回电话，还有其他什么市场调研好方法？\n\n## 卧龙营销咨询《布局策略》：内部资料\n\n问题\
    \ 3：自己有电动车，尽量安排合理路线，不过没妙招，如何保证准时送到？？？\n\n首先，解决第一个问题：如何调制豆浆？ 我们只跟行业顶级高手学习。 借用杠杆。\n\
    \n**【打造爆款豆浆产品】豆浆款设计不能盲动，须向麦当劳，肯德基学习。**\n\n市场以黄豆浆一统江湖，如果咱们仅仅提供单纯传统豆浆，受竞品价格制约，利润微薄。\n\
