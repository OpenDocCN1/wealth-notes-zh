    ## 第 2 节：被动流量 126 个策略模式


    ## 【被动流量】


    +   1,主动宣传的流量（活动，抽奖活动，传递价值，免费价值分享…）


    1，免费（义诊，检查身体，领取…）2，低价 3，试用（体验装）4，释放价值 5，线下广告（传单，平板广告小册子，封面…）6，优惠券 7，软文推 8，病毒推广
    9，员工（地推，扫街，招募经销商，代理，合伙人，自身使用，电话营销，互联网推广，口碑…）10，同时截流（引流）11，政策营销 12，时事事件营销 13，互联网推广（百度系，阿里系，腾讯系…免费+付费推广…）14，活动（联盟，聚会，免单，现场体验，拉人有礼，抽奖…）15，异业引流，其他…


    +   2；借力，合作的流量（竞争对手，整合各种资源，整合政府，学校，金融（银行），超市，店面…）被动导入的流量


    渠道推广（人人分销，政府渠道，学校渠道，商超店面渠道，企业渠道，大资源渠道，一级代理，二级代理，铁粉…），合伙人推广（股东，一级合伙人，二级合伙人…），借力整合流量，异业联盟…


    +   3，转介绍的流量（口碑，利益。）


    +   1，【软文推广】获得高精准流量模式；


    定位用户群（什么类型用户，用户在哪里出没。）-分析用户（需求，痛点，习惯，阅读方式…）-发现鱼塘（论坛，社群）-软文撰写（复制，交换…）——释放诱饵（软文释放价值）——


    ## 卧龙营销咨询《布局策略》: 内部资料


    引号加入我们鱼塘（公众号，QQ群，QQ号…）——鱼塘持续成交；


    案例：如何一篇文荔得几百个高精准客户？


    定位用户群：化妆品--- 女性(爱美的女性) 山茶油-- 宝妈(孕妇)……例子……


    根据我们所定位的人群，我们可以选择一个流量高的论坛【鱼塘】。


    例如如果你是做山茶油，定位于宝妈。根据山茶油的功效，我们可以在这个论坛中 afe 一个相应的圈子。


    这个圈子里的宝妈需求是什么？我们必须了解，他们喜欢什么样的阅读风格？【分析用户习惯，需求】可以看看那些流量高的帖子。


    好，根据我们市场了解到，这些宝妈的奶水不足，想要追奶。用户痛点】


    我们就可以去网上收集关于追奶的资料。(一定要精，而且是宝妈们最需要的。)整理成一份文档【诱饵】。这样就可以去论坛发帖。


    怎么发才能让宝妈迫不及待的想要这份资料呢？


    一句话：讲故事，讲故事，还是讲故事。


