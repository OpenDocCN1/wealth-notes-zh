    ### 3.顶层“客户价值取向或注意力”


    一个好的产品, 物质层面+精神层面, 只有两者结合, 形神兼备, 才能无往不胜。


    看似江小白卖的是一款酒, 其实在卖一种情怀, 和情感归属。


    任何在高端的产品, 终究是围绕人性服务展开, 没有情感的产品, 在高科技的产品都是苍白的手段而已。 (人性拥有社交需求)


    同样一款, 什么概念都没有? 是很难卖出去的。因为没有差异化。更别说自己的定位了。


    定位的产品概念比如:


    - 1."绿色"产品——“纯天然, 无刺激-28 天还给你紧致肌肤! 欧莱雅”...


    - 2."道德"产品——"每买一瓶农夫山泉, 将给爱心基金捐献 2 毛钱。"


    - 3."有机" 产品——"江中猴姑饼干, 有机, 更养胃!" …… 环保, 节能(省电) ……


    有了这些概念, 我们在包装上做一个符号, 然后就可以更贵, 消费者才会更愿意买单, 为价值付费。


    ### 4、【产品用户定位】不是所有客户都是我爷!


    有了产品, 有了包装, 品牌定位, 差异化, 下一步就是发现我们的精准客户。


    【客户管理系统】定位客户, 首先我们要对客户进行分级如下。


    企业客户：


    - 1，主要顾客群

    - 2，辅助顾客群


    企业顾客群：


    - 1,潜在客户

    - 2，意向客户

    - 3，小客户

    - 4，核心客户

    - 5，大客户


    1，潜在顾客群


    企业做大 3 点要求：


    一，一定要有一个清晰的界定！ 无界定，则模糊，注定做不大。

    为什么海飞丝广告做了几十年，仍然坚持去屑海飞丝。 而不是其他内容？因为这就是他的定位。 而脑白金的定位就是送礼！ 所以十几年一直打 "今年过节不收礼！ 收礼还收脑白金
    ! " 的广告。


    二，拥有足够的规模客户群体，不然一定受限。

    三，对顾客群的需求和偏好进行深入认识和了解。


    简单讲就是研究消费者花费多少时间都不为过。


    如何须找到这样顾客群？？


    我们必须明确要为那些人服务，锁定一个关键的市场，并进行【市调】与【客户消费心理】研究。


    怎么市调？


    线上市调：搜索引擎（百度）+电商平台（淘宝，京东，阿里巴巴，慧聪网，美丽说...）+论坛（天涯，猫扑..）+沟通平台（微信，QQ，陌陌.... ）;百度系；阿里系；腾讯系数


    量级的搜索市调；


    http://www.iqivi.com/w_19rrsotc39.html 看老朱5柱牛人是怎么市调的。紧跟牛人学习。


    把有限的资源用在目标客户群上，并这些目标客户需求进行分层：


    - 1，重要且迫切

    - 2，重要不是很迫切

    - 3，迫切但不重要

    - 4，不重要也不迫切


    如何把握客户又重要，又迫切的需求，就很容易成功。还需考虑一个问题，就是购买动机【成交理由】？


    温饱型客户是价格的敏感机器（经济因素：穷，没太多钱!，消费能力差);


    小康客户最关心功能（实用价值：安全，性价比高，多功能);


    富裕客户最关心心理因素（面子：身份感，价值感，荣耀，豪华，尊贵，vip..）


    不同社会阶层影响对各种解决方案的价值评估不同。


    那么如何给客户【独特价值】？？？


    四个方面考虑：


    - 1. 你强化了什么要素？？？ 即那些比现有解决方案更好的方面。

    - 2. 你弱化了什么要素？？？ 即把那些客户并不在意的，费力不讨好的东西尽量删除，马上删除，或降低标准；

    - 3. 你去掉了什么要素？ 即把那些客户用不到的功能去掉。

    - 4. 你创新了什么要素 即那些独创的方面。

    然后，初步产品创新设想出来后，一定要与目标客户沟通，检验创新是否有实际意义。


    同时，了解为此愿意支付多少钱买这个商品？ 他们的切换成本有多高！——市调最容易被忽略的一点。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_74_0.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_75_0.png)


    比如：这个电动车排名第一名。 为什么他总是排名第一？


    你强化了什么要素？？


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_76_0.png)


    - 1. 超长续航 200 公里。

    - 2. 送意外盗抢险。 不怕被贼，被偷了。

    - 3. 闪电发货。速度快。

    - 4. 全国联保 不用担心售后问题。

    - 5. 30 天无理由退换货。


    现在的电动车，能做到如此承诺的有多少？ 爱玛电动车，也没有这样的保障。所以，为何他能成为销冠？


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_77_0.png)


    艾玛电动车是这样的。虽然文案好像有点意思，但消费者观念也在升级。这些外表虽然好看，已经成为了外围。


    很多人除了外表，更看中一种续航 200 公里的能力。 即便卖点，也是可以接受的。


    实践表明，设计完善商业模式，分析和把握客户需求，是寻求产品市场最佳定位，是设计商业模式的一项首要工作。


    然后我们必须要定位具体化，咱们的产品和服务啥人需要？忙碌上班族，家庭主妇，还是退休老人？？


    很显然这样一款车子，主推的还是年轻化的年轻人。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_77_1.png)


    没钱的话，可以分期。 大大满足了年轻人没资金的需求。


    客户可以很多没有关系，确定一下不同区域当地人口与习惯是否是我们的潜在客户也是很有必要的。确定之后；然后才能有方向的去推进筛选精准客户。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_78_0.png)


    如图：


    核心客户：是我们的金牌客户，在特定时间，购买最多的1%用户，若总数为1000人，则核心客户为10名。


    重要客户：消费金额最多的5%客户中，除去核心1%后，假设所用1000人，出去核心，则花钱最多40名。


    普通客户：购买金额20%中，除去核心和重要，则以1000人计算，花钱最多的150名。


    除去上面3种客户，剩下80%的为小客户，大客户20%却占了80%的利润。


    所以我们了解了客户层级分布之后，下一步实施客户导向模式，针对客户价值设计配套的客户关怀项目。


    对核心客户进行定期拜访和问候，确保重要客户的满意度和忠诚度，借以刺激有潜力的客户升级更高客户层，这样，将使得我们企业在成本不变情况下，产生客观利润成长。


    而对于垃圾客户，直接清除世界。永久性拉黑。


    市场化运作过程中，20%的人创造80%利润，而20%利润是80%的普通客户。


    想要创造更多利润：我们应该把焦点放到20%的顾客身上！切记，切记…


    为何选择20%？


    1，20%顾客不差钱，对钱没感觉，对产品价值有感觉。80%对价值没感觉，对钱超有感觉。


    2，高端客户转介绍，全是高端； 低端客户转介绍全是低端，要么良性循环，要么恶性循环。


    3，顾客只有被区别对待，才会有不同的利润。


    一定要制造落差：想让客户十倍以上支持，就要对客户十倍以上落差区别，你想顾客感觉他跟所有都不一样，他就会反过来支持你，让你跟所有都不一样。


    凡是在江湖上混的不好的，都是不懂落差区别营销运用。


    企业 3 大核心资源：人，钱，时间； 营销最大智慧就是把有限的资源创造最大的利润；


    客户导向模式，不需要 100%满意所有客户，只需要维护好能给企业带来更多利润的那一批。 因为其他 80%会占用太多资源，而使得企业疲惫不堪！


    定位附属：我们定位客户之后必须要做的一些事情。


    【客户关系】即公司同消费者群体之间所建立的联系，我们所说的客户关系管理与此相关。


    简单讲，你可以通过微信，电话，短信，QQ,等产品比较高的沟通工具，链接消费者之间的关系。


    【客户分类】6 类：


    - * 核心客户

    - * 重要客户

    - * 普通客户

    - * 小客户

    - * 潜在客户：有意向购买，因为各方面因素迟迟没有付款行动。

    - * 垃圾客户：直接清除世界。


    聚焦服务核心客户，维护提升普通客户和重要客户为核心客户，潜在客户进行促销刺激为小客户和普通客户，垃圾客户直接清除。


    根据不同的层级划分，制定不同的服务流程提供公司效率和转介绍；


    ## 何为垃圾客户？


    - 1，没有钱   2，不讲信用 3，应收账款拖欠 4，很小的客户，付不起钱


    这些直接删除。


    对于产品客户定位，分层。我们已经讲解完毕。


    今天的【产品模型】课程内容，就到这里，我们晚上 9:00 继续讲解


    2017年8月14日 晚上分享：


    http://v.youku.com/v_show/id_XMlKzODE1MiM2MA==.html 先看着一个视频。


    刚刚看到的一个视频，可以简单的看一下。思考一下为何小男孩没有成功？


    其实，已经包含我们我们产品为什么卖不出去是一个道理。


    通过这个视频，简单总结几个【产品模型】的关键点；


    - 1，没有好的包装，再好吃也没有用。

    - 2，人性只愿意强者合作，谁都不愿意给傻逼合作。

    - 3，不管怎样，你的包装大于你的内容。

    - 4，别高看了你的目标对象，说的再好没有用。顺应人性才是关键。


    记住一句话：包装大于内容，包装大于形式。


    同样2个产品，一个很好吃，但包装不行，不见得一定卖的好。往往另外一个包装很好看，但是味道还算可以，那么一定另外一个包装的更好卖。虽然说前者味道口碑可以，但是销量一定没有后面的高。——这就是人性。


    人性总是从第一面，第一眼，就开始评定这个人的人品。如果刚开始就建立了一个不好的印象，那么后面的印象是很难改变的。


    任何时候，不要与人性作对。要知道，你自己也是人！也有这样的人性。这是所有营销必须遵守的法则。


    好了，扯远了。


    我们继续[产品模型]之产品定价策略


    【产品定价定位】产品定价：是获取利润最直接的利器。


    价格高低直接决定利润多少，价格影响着消费者购买意向及购买数量的多少。


    消费者购买决策时候，首先考虑产品的价格，其次分析符合不符合该产品的价值，自己花钱是否值得。


    如果用户认为能带来使用价值，就会购买；


    人们从来不会认为价值太高了，只会认为价格太高了。


    反之，如果换不了等同价值，就会拒绝。


    通常情况：一种产品价值很高，但不符合传递价值消费购买心理需求，价格虽低，但也不会购买。相反，定价高一些，反而畅销。


    比如：保健品。 成本价 9.9 元 但是如果卖 100 元一盒，甚至 150 元一盒，是没有人敢吃的。


    但是此时此刻你定价 2980 元，或者 3980 元，这个时候，人才相信这是真的，一定有效。愿意以这样的价格购买。


    再如：中国布鞋在美国，料子好，做工惊喜，几美元一双，可以穿几年，但购者寥寥无几。


    而韩国的布鞋，很薄的面子，绣着不可耐的花朵，做工精细，却卖 12 美元一双。竟然购者如云。——之所以这样，因为文化消费心理不同。 中国古老文化，对于西方美国，一点用也没有。


    所以，就导致了消费观念，和消费心理不同。


    价格一般设计是这样；


    - 1，生产成本 （成本+利润）

    - 2，价值规律 消费者需求等。


    跟着市场价格进行波动。消费者需求强度大小，是否处于垄断地位，决定价格是否高价的重要因素。


    简单理解，在前几年为什么大蒜可以炒到 20 几元一斤？ 尽是 因为一些商家，大量收购，然后垄断打算，肆意加价，炒作的一种行为。


    因为你在市场买不到了，都被这小子给收购到他的仓库了。即便能收购到，也是少量的。


    所以他垄断了 90%的货源，就可以垄断 90%的市场价格份额。

