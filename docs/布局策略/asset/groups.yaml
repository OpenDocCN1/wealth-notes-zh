    最重要的一个价值主张是提供优雅交流空间。在经历多年业绩下滑后，这家世界领先的专业咖啡零售商已经恢复了最初的承诺，要为人们提供一个交流场所，此后公司的业务和品牌重整旗鼓，星巴克对自己的使命已经有了更深认识，那就是成为消费者感情交流的场所。


