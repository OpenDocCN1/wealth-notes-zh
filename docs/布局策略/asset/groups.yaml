    例如如果你是做山茶油，定位于宝妈。根据山茶油的功效，我们可以在这个论坛中 afe 一个相应的圈子。


    这个圈子里的宝妈需求是什么？我们必须了解，他们喜欢什么样的阅读风格？【分析用户习惯，需求】可以看看那些流量高的帖子。


    好，根据我们市场了解到，这些宝妈的奶水不足，想要追奶。用户痛点】


    我们就可以去网上收集关于追奶的资料。(一定要精，而且是宝妈们最需要的。)整理成一份文档【诱饵】。这样就可以去论坛发帖。


    怎么发才能让宝妈迫不及待的想要这份资料呢？


    一句话：讲故事，讲故事，还是讲故事。


    ## 卧龙营销咨询《布局策略》内部资料


    接着我和他在 QQ 上聊了一会，把那个方子告诉了我，下午他老公还给我带了两瓶油。让我做菜热汤都用它。


    果然，第二天的时候奶水开始上涨，到第三天，宝宝已经喝不完，只好晚上挤掉。我相信很多宝妈都会遇到这种情况，如果你也想要这个方子，私聊我，把你们的 QQ 留下，我发给你。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_230_0.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_231_0.png)


    就这样，持续了两天的顶贴，我收获了 100 多个 QQ，不要问这些 QQ 有什么用。


    这些是高精准用户，没有一个是微商。当他们看了我整理的资料后，会发现茶油真是个神奇的东西，并且会有部分人会向我询问这个东西。


    经过第一次的信任，转化几率是否会大为提高呢？


    ## 2、【释放价值诱导引流】


    设计诱饵（推广文案+工具 注意：线下可以用宣传页，席位票…）——定位（鱼塘：QQ 群，社区，高端小区…）投放诱饵（引流到自己的鱼塘：QQ 群，微信群，公众号，会议营销现场…）


    ——设计一套成交模式（互动价值-信任-成交）。


    推广文案如下：


    超震撼，神奇《全自动营销系统》将在免费在群 XXXXX 首次分


    ## 卧龙营销咨询《布局策略》，内部资料


    享！


    免费分享：


    +   1、100%企业都能直接模仿的赚钱系统；

    2、实操案例：保隆品公司使用该系统，从亏损到开4家分公司；

