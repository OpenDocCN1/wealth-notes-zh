  - '[PAGE 11]


    服务：


    +   金融类：网赚项目，各种项目或创意，各种招商项目，天使投资，私募，理财（现货，基金，股票，期货；银行，p2p，保险…），代理记账，注册，贷款


    +   教育类：vip 圈子，小吃技术传授，总裁培训班，学校，政府，律师，策划，咨询


    +   个性技能类：私人定制（形象设计，家居生活设计，店面设计…），经纪人（明星，舞团，各种节目，展览…），维护，服务器管理，IT（软件开发，员工外包..），展销会…


    +   普通类：色情，瑜伽，舞蹈，音乐，健身，桑拿按摩，ktv，理疗，私人医生（厨师，理发师，美容师，减肥师，美甲，保姆，录像…）跑腿，外送（宅急送..），代要账，保镖，物流，旅游，劳务中介，打工者，雇佣兵，私人侦探，打假人士，家政，婚介，技术培训（舞蹈，音乐，美术。）


    # 【选择产品的核心：】


    +   1，是否最大面积解决人类的问题


    +   2，产品是否可重复消费，像毒瘤一样，上瘾。


    盈利的重点在于开发客户终身价值，开发一次，消费一生。


    +   3，产品是否可大批量复制


    为什么？卖导弹的不如卖茶叶蛋赚钱？ 因为需求量少。


    量大是所有成功致富的关键。（洗头：去屑海飞丝；洗衣：碧浪洗衣液；喝茶：怕上火，喝王老吉；欧莱雅：让你更美丽！）


    # 【产品模型】商业的本质交换！赚钱必须要有一个产品。


    +   0、市场调查，寻找空白与差异化的市场定位。


    任何项目必须经过市调，市调，市调。 而且拥有高手的市调习惯。 没有数量级市调=项目失败；


    所方案制定和项目成功落地，都一定需要高手级市调（市场调研），不了解情况，就制定方案的人都是怎么死的不知道。无论是商业还是战争，市场情报工作永远放到第一位。


