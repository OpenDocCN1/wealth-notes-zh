    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_188_1.png)\n\n搜集 100 个卖故事案例/当下经典语录，借鉴参考包装自己产品或销售话术，营销故事。\n\
    \n卧龙营销咨询《布局策略》：内部资料\n\n3.【产品组合套餐设计】 没有套餐设计，单调套餐=无聊寂寞！\n\n当你单卖一个产品很难卖的时候，组合更多的产品销售就变的容易了\n\
    \n+   1. 当某个产品需要培育习惯才能被客户接受的时候，先用刚需产品前置销售，将软需产品捆绑赠送，再靠软需产品后端赚钱（组合产品销售）\n\n例：移动机顶盒公司：(农村开发困难，大多数农民都不购买机顶盒，怎么解决？)\n\
    \n+   （1）.把钱投资开一家农资公司专门卖农药化肥。\n\n因为农村家家户户都需要购买化肥。然后 300 元的机顶盒开户费，180 元第一年的收视费以及无线移动机顶盒，塑造一下价值，争取标个\
    \ 600 块，把这些打包成 1080 块的一个赠品；免费赠送即可\n\n价值 1080 元的机顶盒，购买 1 年化肥免费送。然后靠 180 元/年。 服务费年费持续赚钱。\n\
    \n+   （2）.和当地镇政府合作，把这个服务当作一个惠农政策推出，面向农村推广\n\n案例 2：\n\n汽车机油（单卖机油很难卖，组合产品销售容易）\n\
    \n例：做一个册子，帮助你解决汽车问题，客户见证和公司介绍，480 元的汽车服务只能管 20 天，你要是想一年的服务价格是 4000 元，活动期间只要 2000\
    \ 元，并且一年 内的机油免费送，还签订八大保障协定，保证你的汽车不会出问题。只要出问题，免费维修。\n\n## 3.组合销售，提供更多价值\n\n盛总案例：盛总是做泸州老窖代理的，然而单纯卖酒很难，于是跟各大承接婚庆的酒店合作，做平台。\n\
    \n简单讲，他跟婚庆酒店合作。 打包一个酒水套餐出来，送给客户。 然后酒店给返利。\n\n比如：送你糖花生套餐 12 份 价值 120 元+2 箱价值 680\
    \ 元的泸州老窖+饮料 2 瓶+红酒 2 瓶价值 120 元。 每桌。\n\n免费送给您，你订了多少酒水。 但是你要结婚。必须到指定酒店。\n\n## 卧龙营销咨询《布局策略》：内部资料\n\
    \n这样一个套餐设计，大大增加了泸州老窖的自动化销售。\n\n同样还可以这样：提供一个这样组合套餐：（价值 360 元的烟酒水）婚庆每桌 2 瓶泸州老窖+2\
    \ 瓶红酒+2 盒烟+一箱水=55 元。\n\n并且拥有产品冠名权。然后让婚庆进行补贴，迅速做大做强。\n\n## 套餐设计思想：\n\n+   1,数量折扣\
    \  如：购买多个产品或者超过一定额度，将获得数量折扣。 目的：加强顾客忠诚，鼓励大额购买。\n\n比如：我去面包店买面包，一个 5 元。本来我想买 1 个。老板突然说：“10\
    \ 元给你 3 个。”我一算，挺划算。当即就买了 3 个。\n\n+   2，现金折扣\n\n促使用户尽快付款或提供价格减让。快速付款是的经营商节省管理费用和财务费用，并且可以避免坏账。\n\
    \n如：前 200 名，原价 1980，前 200 名 1600 元。\n\n+   3，职能折扣\n\n分销渠道不同，总经销商，批发商，零售商。百分比折扣不同，返点现金不同。总经销商给你\
    \ 5 成折扣。批发商给你 7 成折扣。零售商给你 9 成折扣。\n\n+   4，季节折扣\n\n对购买过季商品提供价格减让，这种折扣储存的任务转嫁给消费者。\n\
    \n+   5，促销折让\n\n如：零售商为生产商的产品做广告，生产商可能支付一半费用。如果零售商举办展会，生产商，会在线下提供一定数量的免费商品。或者今天光棍节，所有产品半价\n"
