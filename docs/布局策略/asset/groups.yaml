    线下+线上通用的逻辑。没有捷径。所谓捷径，都是骗子。


    ## 3、【时事事件营销流量】


    是企业通过策划，组织和利用具有名人效应，新闻价值以及社会影响的人物或事件，引起媒体，社会团体和消费者的关注与兴趣，以求提高企业或产品的知名度，美誉度，树立良好品牌形象，并最终促成产品或服务的销售目的手段。


    简单讲，就是通过把握新闻规律，制造具有新闻价值的事件，通过具体的操作，让这个新闻事件得以传播，从而达到广告的效果。


