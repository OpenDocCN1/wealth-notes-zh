    # 卧龙营销咨询《布局策略》：内部资料


    2，利润框架：假设每天供应 1000 杯子豆浆，年利润 1000 杯/天 X0.8 元/杯子（薄利多销的利润）X230 天/年（全年工作日）=18 万元。


    3，我们每年可以抽取盈利的 10%作为取得返利


    如：为渠道商提供免费豆浆+年底红包； 同时再抽取盈利 10%奖励消费群，比如：发放抽奖券，赠送新款饮品或卡通公仔等。


    4，事事都打情感牌，是社区营销精髓所在。渠道返利固定需要，但情感投资更为需要。


    稍微分析便可得知，愿意当区长，楼长，和组长的消费者并不缺这份红包或免费豆浆，他们乐意奉献自己的余热为大家服务；并享受那份助人为乐的快乐，这是招募渠道商能成功的关键所在。


    所以招募时,要强调“这是一份助人为乐的工作,跟赚钱无关,跟帮邻里街坊一个忙有关。”这里要考虑到人情，人性。 而不是单纯利益驱使。


    # 二，制定接地气的销售策略


    套餐式预订——目标细分法的运用。 接受预订存在两个问题：


    +   A，早上根本来不及接电话


    +   B，如果每周都是临时决定是否喝豆浆，咱们无法控制生产量，会造成缺货或积压。


    建议采用套餐式预订方式：


    +   A，两天式（周二，五） B，三天式（周一，三，五） C，五天式（周一-周五）。每天晚上根据数据统计做好第二天生产量。


    采用三餐预订方式，好处有三：


    +   A，杜绝零星购买，方便配送


    +   B，假如居民原先早餐每天喝牛奶，现在想保留和牛奶习惯，但也想换换口味，可选择套餐式预订，由此，登门槛战术成功。


    +   C，五天预订供货价可以享受 95 折，鼓励大家踊跃预订。


    周一至周周五送早餐，周六，日送不送？ 家家户户起床时间千差万别，豆浆凉了再热会导致口味损失。


    此外未送的豆浆存在哪里？


    休息日组长万一家里出门办事，怎么办？


    都是问题，建议前期先从简单做起，只做工作早餐。 非工作日，不送。


    # 三，我们未来发展方向


    咱们建立起销售渠道，制定销售策略，策划好推广思路，费力无数，难道就是为了早餐销售几杯不值钱的豆浆？


