    ## 第 3 节：卖解决方案模型！\n\n永远不要卖产品！切记！  切记！……\n\n没有任何人购买一个产品就是为了单纯买产品的，都是为了买自己想解决的问题和产品所能带来的好处和价值。\n\
    \n## 1、【产品痛点挖掘】一定要在客户伤口上撒盐！\n\n我们要做的就是找出客户当下最渴望，梦想，欲望，受骗，最大的痛苦，然后撒上盐，并让他们认为只有我们才能真正给他们最全面的解决方案。\n\
    \n你不舍的撒，别人就会撒！\n\n我们举出一个例子，美容美发美甲培训学校，需要的解决方案是什么那？\n\n## 第一张：确定目标顾客\n\n首先，像这样的职业培训学校，它的主要目标客户是谁？\n\
    \n- 1，初中毕业生\n- 2，高中毕业生\n- 3，社会上的未就业群体\n- 4，对现有工作不满意的人\n- 5，已经工作，来深造的...等。\n\n\
    ## 第二步：分析用户的需求\n\n那么这些目标客户群，他们最想要的解决方案（痛苦点）是什么样的那？\n\n- 1，找到一个好工作，高薪就业（就业）\n-\
    \ 2，自己开店当老板，创业赚钱（创业）\n\n还有那些那？\n\n- 1，当老师，从事职业技能教学；\n- 2，成为行业名师，专家，拥有行业名气；\n-\
    \ 3，成为培训师（如：美容店导购销售技巧培训...）\n……\n\n**痛点挖掘：就是找出客户群之所想，并深入挖掘并持续教育放大痛苦，让客户梦想，并认可以达到想要的方向。**\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_108_0.png)\n\n## 2, 【产品核心诉求点挖掘】诉求=哭着都想要！\n\
    \n一定要100%站在用户角度思考解决问题方案。\n很多企业有这样困惑，传单，宣传册发了那么多，大多石沉大海，效果非常差。\n\n他们宣传中大多是产品简介，产品特征，或产品独特卖点，没有100%考虑用户愿不愿意看；想听不想听？\n\
    给对方想要的，而不是你认为对方想要的。\n\n朋友圈和营销界曾经非常流行的一个段子，说的是一只小白兔去钓鱼——第一天，小白兔去钓鱼，一无所获。\n第二天，它又去钓鱼，还是如此。\n\
    第三天它刚到，一条大鱼从河里跳出来，大叫：你要是再敢用胡萝卜当鱼饵，我就拍死你。\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_109_0.png)\n\
    \n就想很多人发广告一个道理，没有人愿意看广告。\n而如果你此时此刻送对方一本价值非常高的书，或者资料，或者一个免费培训服务，对方就感觉很好。\n\n能很轻松的接受。\n\
    \n启示：——你给的都是你自己“想”给的，给的是自己认为最好的、最有价值的，而不是对方想要的，活在自己世界里的付出，不值钱！\n\n做营销，我们需要 100%将注意力放在用户的身上，先找出用户的核心需求是什么？客户的痛点是什么？客户最想实现而又没能实现的梦想是什么？（因为这些才是客户想要，并感兴趣的）\n\
    \n## 什么是痛点？\n\n比如目前培训行业老板通有的痛点是什么：\n\n- 1. 学了没法用。\n- 2. 交了不少高昂学费，仍然一无所获。\n- 3.\
    \ 上课激情满满，下课马上就软。\n- 4. 上了许多大师的课程，仍然无法落地。\n- 5. 学了太多，反而企业越做越差。\n……\n\n因为不同的客户群体和类型,\
    \ 痛点，习惯的方式和语言都是不尽相同。60，70 后是一种方式；80，90 后可能又一种方式；00 后又是另外一种方式了。\n\n所以，我们必须先了解用户，再用最熟悉的方式、最常用的语言沟通做一个调研，并结合实际，总结提炼核心诉求点。\n\
    \n你买这个东西是迫切解决什么？\n那么多同类产品，为啥买这个？\n为什么觉得这个能解决问题？\n什么原因？ 有什么期待？ 最痛苦的是什么？\n\n……\n\
    \n通过问题，我们很快就可以总结一系列客户核心需求，痛苦点的问题。\n\n> 营销起点：是以客户的需求和痛点以及梦想，不能单纯讲公司，产品特征、产品本身！围绕客户给予他哭着都想达到的结果！给予客户最想要的好处和利益。\n\
    \n## 3，【产品用户习惯分析】3 次接触点，习惯就可以养成。\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_111_0.png)\n\
    \n所有营销都是针对人来的，所以我们必须分析用户消费心理，100%清楚了了解用户习惯和人性。\n\n实操案例：支付宝培养用户习惯，每天领取积分，抵现金。\n\
    最近支付宝是不是推出了一个；线下支付扫摘付款领取黄金的活动。\n还有线下扫瞄支付，抽奖返现的活动？其实，都是在培养我们的消费习惯。\n\n支付宝培养用户手机转账，手机提现，转账不收手续费！\
    \ 而电脑则收部分手续费。 自然很多人都养成了用手机转账的习惯。\n做第一次可能有些陌生。 接触第二次就熟悉。第三次就轻车熟路了。\n（就想像爱一样：第一次手忙脚乱！\
    \ 第二次就淡定了一些，而第三次就轻车熟路了。）\n下一次直接可以使用，并觉得很方便。 就形成消费依赖了。\n\n普通情况力，养成一个好习惯需要 21 天，而购买只需要\
    \ 3 次就可以！ 所以我们在设计营销策略的时候，可以以 3 次做一个参照点。如：免费洗车 3 次，下次 80%就会习惯性还来这里洗车。\n\n因为时间问题，我们的今天分享已经分享了\
    \ 2:30 小时，暂时就到这里。 我们明天继续分享。\n\n8 月 15 日   早上分享\n\n我们继续讲解我们的【产品模型】基本知识。\n\n首先，我要提醒各位同学的是，我们虽然是学的营销基础知识，这些营销知识，只要你能真正简单懂一点，哪怕一点，都可以直接运用，优化一下我们的生意结构。\n\
    \n看似基础，实则并不基础，有了这些基础，才是我们做营销最根本的保障。\n\n简单讲，有些人的定位一开始就是错误的。\n\n有些人，产品定价就是错误的。\n\
    \n有些人品牌形象就是错误的。\n\n有些人根本没有使用过什么场景植入，影像化，故事化催眠的一些方法。\n\n有些人根本不懂什么叫消费心理，消费诉求，消费痛点，和梦想需求，以及全方位解决方案。\n\
    \n这些营销方案，必须的一些理论性关键词。言归正传，不扯远了。\n\n我们继续我们【产品模型】的讲解。\n\n## 4，【产品人性解析】做任何产品之前，一定要解析其人性。\n\
    \n从运营的角度去说说人性运营那点事情；\n\n运营策略，我非常信奉一句话：以最后目标结果为导向；\n\n因为这样子会给予我很明确的思路，然后根据思路再配套很清晰的方案。\n\
    \n对于一次营销活动，当前前提是对目标进行细分，这是活动的大前提，整个营销活动都是\n\n奔着这个目标去的。\n\n有了目标，我们就该好好的确定我们的定位受众！\n\
    \n**我们目标客户是针对谁？ 这个活动。**\n\n明确了目标对象，再来确定人性消费路径，不同的人，视角不同，结果也自然异同。\n\n如：“第一单返 50%，第二单返\
    \ 100%”和 “你今天吃饭不用花钱”就是不同角度的一个活动。\n\n**有了方向，我们先研究下人性特性：**\n\n说白了就是要抓住用户 “人性的弱点”，抓出大家的趋利、好色虚荣心、怕上当、善良、愤怒、好奇、感官动物等几个特征，一打一个准；\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_113_0.png)\n\n营销标准套路：\n\n**第一：3+3，给客户三个购买你的理由；给客户三个不购买你的理由；**\n\
    \n如果你在营销活动中，或者是你的产品能够把你这 3+3 弄清楚，我想问题不会很大了。\n\n**第二：他（客户）有什么价值**\n\n人性都是趋利避害的，没有好处的事情，谁都不愿做！\n\
    \n你做的任何一件事情或者你写的文章对于你的受众解决不了实际问题，他在这里获取不了价值，那么你的产品，你的活动也就不用考虑了。\n\n## 第三：要他（客户）干啥？\n\
    \n当你完成了以上的两件事情，你就要在你的营销活动中明确你的他/她需要做什么，是扫描二维码、分享还是买套餐后送什么……\n\n常见的方法：\n\n## 技巧\
    \ 1：告诉他，对他的好处是什么，而不是你要卖什么？\n\n例如：1元钱看电影，而不是某部电影多少钱；五折包邮，仅此一天，而不是我的产品怎么样，多少钱；今天吃饭不要钱啦……\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_114_0.png)\n\n## 技巧 2：一目了然，别让他猜；通俗易懂，不卖弄\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_114_1.png)\n\n## 技巧 3：对比+反差\n\n例如：原价\
    \ 100，现价 20；一元钱买汽车，可能么？\n\n当然，这点是需要大家配合其他活动来进行的；比如先把自己产品中很棒的产品，客户很喜欢的产品拿出来，原价\
    \ 300，现价 50；但是要购买下其他的产品达到多少钱了享受这个优惠……\n\n同样，原价 14 万的别克汽车，现价 12 万。但是你要在我们这里购买车险，座套，行车记录仪等。因为新车本来就需要买保险。\
    \ 这些都需要买，自然客户感觉还是赚了。\n\n## 技巧 4：数字为主\n\n实践证明文案中带阿拉伯数字，点击率提升 30%以上。\n\n比如：全天销量达到一万件和\
    \ 全天销量高达 10000 件，数字对于人性更加敏感。\n\n如果各位写文章，或者做文案，更多采用数字，而不是文字。\n\n如：这张图\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_115_0.png)\n\
    \n## 技巧 5：名人效应\n\n例如：快来尝习习大大最爱吃的包子；818，苍井空空降天猫内衣，汹涌首秀……\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_116_0.png)\n\
    \n## 技巧 6：说的就是你\n\n多用“你”字，可以将点击率提升 50%以上谁都无法逃离。\n\n例如：128720 人推荐的美食，你一定会喜欢！\n\n\
    你有一个价值 10 元的红包，点击领取……\n\n你也想看通过微信年赚 3000 万的顶级干货吧，加我领取\n\n## 技巧 7：说的还是你\n\n告诉他，他将失去什么？\n\
    \n例如：你可专享 5 折美食机会，仅此一天；错过今天，再等一年；\n\n例如：今天老板娘生日，你可以享受最低 5 折，超划算，错过再等 1 年。\n\n\
    事实是怎么样的那？ 其实就是是衣服要换季了，所以找一个理由来做促销。但是如果我们直接清仓换季，那么人性就不会愿意买。\n\n## 技巧 8：网络神语言\n\n\
    在文案中融入搞笑的元素也会有很好的效果\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_117_0.png)\n\n\
    总之，创意，文案，视觉效果，三者缺一不可，相辅相成。这是人性营销的一部分。\n\n> “时代在变，自古至今，人性恒通不变！”谁能领悟这句话，谁就能领悟营销真谛。\n\
    \n## 第 4 节：产品包装策划模型\n\n包装大于内容，0.8 秒的包装决定了产品起点!\n\n【测试，测试】你永远无法预知市场需要什么，也无法单方面确定最是的定价，广告或者包装策略，你必须询问现有客户和潜在客户的意见，才能找到这些问题的答案。\n\
    \n去测试，小子，不测试，麻痹自己是没有用的。太过自信=自负。\n\n> 不要迷恋自己的直觉和潜意识。这些往往最容易骗人。即使你是智商 200 的爱迪生也需要\
    \ 1000 次的灯泡实验。\n\n市调-测试，才是硬道理。\n\n真正好的营销方案和商业模式，资本运作，都不是凭空捏造出来的，都是经过反复市调+测试+优化的过程。\n\
    \n【产品包装】产品命名，包装类型，包装定位，包装类别，产品功效传递，产品娱乐价值包装。\n\n一个好的策划包含：策划部（营销…）——设计部（海报，包装，宣传片…）——执行部（活动…）\n\
    \n## 1、【产品命名】产品起名，命名，名称至关重要！\n\n名字的两个核心价值：\n\n## 1.利于传播\n\nA：字数越少越好 如：三星，苹果，小米，华为，联想\n\
