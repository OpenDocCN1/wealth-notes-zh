    能看懂这张图的，至少一年年收入可以达到 100 万。


    切记，千万不要外传！ 这是我们所有产品的战略架构图。 非常重要。这也是目前我们在做的一些事情。


    好了，今天正式进入我们【产品模型】的分享内容。


    市场调查，寻找空白与差异化的市场定位。


    所有产品都有自己的定位，不可能任何人都成为我们额客户。


    很多人说产品竞争力大，那么我们如何重新定位产品架构，挖掘市场空白点，打造一个新


    的蓝海市场那？


    很简单，就是在大概念中找细分领域，这就是空白点。


    以水为例： 空白细分领域不断分化。——开创蓝海的唯一途径；


    - - 娃哈哈是第一种矿泉水

    - - 乐百氏是第一种纯净水

    - - 农夫山泉是第一种天然水

    - - 可口可乐是第一种碳酸饮料

    - - 鲜橙多是第一种果汁饮料

    - - 乌龙茶是第一种茶饮料

    - - 星巴克是第一大 的咖啡饮料

    - - 蒙牛现在是第一大的乳制品饮料

    - - 红牛是最大的功能型饮料

    - - ........


    如果我们也要打造一个新的空白领域。我们也可以叫做小分子水，纳米水，煮白开水....


    水的分化：在中国，瓶装水分化为：纯净水（娃哈哈）、矿泉水（农夫山泉）、矿物质水（天与地）、维生素水（脉动）、高档矿泉水瓶装水（崂山）……在美国，分化更为激烈，有常规水


    （Aquafina）、高档水（依云）、加钙水（AquaCal）、尼古丁水（Nico）、咖啡因水（Water Joe）以及氟化婴儿水（Nursery）……


    以计算机为例：


    - - IBM 是第一家进入计算机领域的公司

    - - DEC 则是第一个进入微型计算机领域的公司

    - - 戴尔是第一家采用电话销售的计算机公司

    - - 微软是第一个进入软件领域的计算机公司

    - - 英特尔是第一个进入微处理器的计算机公司

    - - 康柏是第一个做便携式个人电脑的计算机公司


    因为市场竞争激烈，所以计算机在一段时间之后，开始分裂成几个细分市场：


    操作系统类别（微软，Linux）、芯片类别（英特尔）、键盘和鼠标类别（罗技 Logitech）、存储类别（Zip、Migo）、打印机类别（爱普生、惠普）、投影机类别（富可视
    InFocus）、扫描仪类别（UMAX）…


    基本上没有个人电脑和其他产品的融合创建的。分化的品牌中的单个类别（微软）的股市价值几乎史整个 IBM 公司的两倍。


    连感冒药这个品类也在分化：感冒药(感康)、长效感冒药(康泰克)、日夜分服感冒药(白加黑)、中西药结合感冒药(三九感冒灵)、低价感冒药(一元感冒药)、小儿感冒药(护彤)。


    要知道，在之前，哪里有儿童专用感冒药。


    现在因为市场竞争，竟然还分化为，0-2 岁儿童专用感冒药。3-6 岁专用感冒药。6-15 岁专用感冒药。


    比如：你家小孩刚出生，竟然生病了，那么你去取药，发现有大人感冒药，小孩感冒药，还有 0-2 岁专用幼儿感冒药。


    我想各位一定会选择 0-2 岁幼儿专用感冒药。而不会去选择小孩的，或者大人的感冒药。这就是在红海中，通过细分领域，找蓝海的策略。


    维生素的分化：孩子的、老人的、婴儿的、男人的、女人的、怀孕的女人、更年期的女人、节食的女士、健美的女士、感冒的人、吸烟者等等。


    牙膏的分化：美白的、坚固牙齿防蛀牙的、防过敏的、预防上火的、清新口气的，甚至还有竹盐咸口味的，营养牙膏（雕牌）、儿童牙膏。


    （外资）高露洁，佳洁士，中华，黑人；


    （民族）两面针，田七，黑妹，冷酸灵，蓝天；


    （新兴力量）LG 竹盐，纳爱斯，永南


    牛奶的分化：有原味的、各种果味的、含果粒的，伴果酱的、低糖的、无糖的、低脂的、脱脂的、高铁高钙的、添加各种微量元素的等等


    比如：很多人喝牛奶想补钙，那么一定会选择高铁高钙的这种概念的产品。有的人，因为糖尿病，所以不能吃糖，就选无糖的。


    还有一些人，喝牛奶，不想发胖，还想美容。那么就会选择低脂的。——这就是细分领域创造佼佼者。


    ## 产品分化策略


    化妆品的分化:


    - 论功能，有滋润的、美白的、祛斑的、防皱的、丰胸的

    - 论用途，有面霜、眼霜、手霜、足霜、腿霜、全身用的护肤霜

    - 论形态，又有精华液、乳液、膏体、还有膜的等等


    广告行业的分化：电视广告、网络广告、报纸广告、杂志广告、户外广告、广播广告；户外广告又可以继续分化：地铁广告、街道广告、零售点广告、交通广告、大看板广告、电梯广告、计程车广告、厕所广告。


    鸡蛋的分化：普通的鸡蛋，高价鸡蛋，胡萝卜素鸡蛋，婴儿的鸡蛋，高营养鸡蛋，低胆固醇鸡蛋、孕妇鸡蛋、高钙鸡蛋、非饲料鸡蛋等等。


    鞋子的分化：男鞋、女鞋、童鞋、凉鞋、拖鞋、运动鞋、足球鞋、篮球鞋、呼吸篮球鞋、休闲鞋、网球鞋、滑雪板鞋、自行车鞋等等。


    培训行业的分化：模式，系统，智慧，机制，模型，模板，理论，心法，原则，秘密，内参，秘密，工具，策略，方法，原理，领袖，布局……


    ## 开创蓝海成功的唯一途径：分化细分模式


    20 年来我发现：所有做起来的牛逼小公司都是从样板细分市场切入进去的。


    因为同质化眼中，市场竞争大，那么经过细分，就可以开创一个新的市场，新的定位和差异化。这点我们每个人都可以采用。


    适合于所有能创品牌的行业寻找所在行业及细分市场空白，通过穷尽分析和专业分析，找到统一行业内尚未被开发的其他有效细分市场空白点，并有机会构建先发竞争优势。

    '
  mdcn: '

    目标细分分解四个测试阶段，依次通关。


    第一阶段：请家人品尝，2 位起，多提建议，直到赞不绝口为止。 提醒：亲情会严重影响口味坚定，测试效果不准确。


    第二阶段：请好友品尝，4 位起，多提建议，直到赞不绝口为止。 提醒：亲情会影响口味坚定，测试效果不确定。


    第三阶段：请普通朋友品尝，10 位起，直到赞不绝口为止。 提醒友情也会影响口味坚定，但测试效果有参考意见。


    第四阶段：请大众品尝，50 位起，直到赞不绝口。 提醒：陌生人鉴别意义大，接近市场考核，测试准确度高。


