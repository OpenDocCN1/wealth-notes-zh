    \n2，产品宣传片（视频）：策划——拍摄（MT，微电影，病毒视频，记录宣传片）——发行（网站，电视，院线）中央CCTV报到!\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_173_0.png)\n\
    \n【产品宣传】产品宣传片，产品宣传页。\n\n思想：【确定宣传通道】\n\n我:\n\n+   1, 地段 比如店面招牌，淘宝页面…\n2, 借力 鱼塘借力，意见领袖，人际关系网…\n\
    3, 媒介 报纸，电视，网络…\n\n不同的时期，不同的渠道，不同地点，采取不同的宣传页面和宣传文案，主题均有不同。\n\n举例：少儿训练营：学校门口——（客户群：针对家长）百家板共同邀请打造领袖计划。\n\
    \n【产品客户见证=讲故事=画饼营销】特别注意：大量客户见证（愈多越好，几千+，几万+……）\n\n客户见证=（靠谱）证据策略；具体说就是要想获得顾客绝对的信任，必须提供大量的证据。\n\
    \n具体可分为4种类型：①图片化 ②文字化 ③视频化 ④语音化\n\n1）搜集公司所有活动、重大活动、领导考察、大客户合影通 通剪辑成册，所有员工人手\n\n\
    一份\n\n## 2）文字化\n\n将所有关于你个行业的媒体报道、权威机构的论文发展通通剪辑成册，所有员工人手一份\n\n## 3）视频化\n\n采访你所有优质顾客，让他们对你们的产品能做出高度评价，剪辑成册，所有销售人员人手一份，包括微信、网络转发、采访时切忌把你所有的答案写好，让顾客选择\n\
    \n## 4）语音化\n\n通过制造演讲录音或者广播，或者 MP3 进行音响播放和互联网传播。 或其他方式\n\n+   1， 亲身见证式：企业本身公关（企业文化，背景）见证，发说说，活动，收入截图，产品前景，用户量，代理量，赚多少钱\
    \  长期洗脑……\n\n【活动见证】活动现场体验情景 1\n\n+   +活动会场情景 1\n\n+   +峰会会场情景 1\n\n……\n\n活动现场体验中\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_175_0.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_175_1.png)\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_175_2.png)\n\n活动现场\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_175_3.png)\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_175_4.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_175_5.png)\n\
    \n## 活动现场\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_176_0.png)\n\n【渠道见证】学生学校渠道场景\
    \ 1+专卖店渠道情景 1+医院渠道情景 1 …………\n\n## 学生们收到眼贴礼物很高兴\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_176_1.png)\n\
    \n## 黄金视力眼贴走进重庆大学校门\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_177_0.png)\n\n\
    ## 再来进驻一家药店，一上柜台即受大众欢迎\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_177_1.png)\n\
    \n【产品资质见证】国家证书，指定经销产品。\n\n【视力恢复密穴】\n\n在双手的拇指上有三个相邻继的穴位，分别是明眼、风腰、大空弯。明眼、风腰能够改善眼睛疲劳和急性结膜炎，大空弯则可改善一切有关眼睛的症状。平时眼睛易疲劳的人，每天要按摩这三个穴位两次，此法特适合经常用电脑、耗眼睛的朋友。对抑制人性的白内障也有效果。\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_178_0.png)\n\n2，招收代理见证 ；客户见证（现场说法 视频，文案，聊天信息…），收入截图\
    \ ，用户，代理，现身说法，自从使用，加入代理后赚多少钱，经历...\n\n【用户说法见证】一个时尚品牌的流行，一定是具有影响力和地位的一部分人引导而来。\n\
    \n如：\"这旗袍，彭妈妈都穿了，我还没有那？\" 淘宝——明星同款，明星表情秀，明星代言词,...\n\n当身边人都有了 Iphone 手机，则你也不知道为何突然想要拥有。\n\
    \n所以我们要设计客户真实见证，注意 \"顾客的声音\" 跟具有同样困境的人，很容易产生共鸣。 我们就要尽量多找一些人，尽量先择个性和背景不同的人，这样效果会更好。\n\
    \n呈现 \"顾客的声音\"，从文字，声音，照片等符号，罗列，从目标客户群挑选对该产品的意见和看法。 注意：越详细，越详细，越详细，越好！！ 很重要！\n\n\
    如何让客户主动做见证？？\n\n最好有礼物赠送，这样事情就变的简单。 没啥好处，很少有人会主动当志愿者。（这就是人性是趋利的。）\n\n因为时间因素，我们的分享就到这里，晚上接着继续分享。\
    \ 感谢有你。\n\n2017年8月15日 晚上分享\n\n我们产品模型环节，设计，至少要花费 70% 的精力和时间。\n\n用 20%的时间用来建立信任和塑造价值，用\
    \ 10%的时间用来成交。 就像多米诺骨牌一样，我们需要用 70%的时间用来设计如何来搭建框架，倒推，布局。 20%时间建设，搭建。 10%的时间欣赏骨牌运行结果。\n\
    \n简单讲，客户看中的是产品价值，其次是对我们的信任，最后成交就可以直接敲定。\n\n我们继续上面的讲解：\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_179_0.png)\n\
    \n## 【用户见证】\n\n+客户使用产品情景图片 1 +孩子使用产品情景图片 1+老师使\n用产品情景图片++++++……\n\n宝贝眼睛突然红，肿，痒，\
    \ 贴了一天黄金视力眼贴，好了，妈妈终于放心了\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_180_0.png)\n\
    \n新发现，黄金视力眼贴对鼻炎也有效哦\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_180_1.png)\n\n\
    一定记得，大量客户见证++ 几千，几十万，更好。\n\n【代理见证】代理亲自体验产品情景 1 图片+客户因为产品好，\n选择创业这个情景 1 图片+视频\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_181_0.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_181_1.png)\n\
    \n3.影响力推荐见证：（意见领袖，行业权威（著名XX教授…），媒体，名人推荐）让意见领袖使用推荐…...\n\n需要找一些权威的人“推荐”自己产品或服务。人性喜欢权威的推荐。\n\
    \n举例：电视广告+明星艺人？（国内品牌广告都是这个路线）就是权威推荐，你喜欢这个明星，自然就很容易认可背后的产品。\n\n【行业权威见证】——【名气不够就以数量取胜】\n\
    \n理论讲，权威推荐需要利用有名气的人。从那个人“地位，影响力”也相应抬高了自身的地位。\n\n一般请名人推荐，需要花好多钱，那么如果无法采取推荐。那么就只能采用以量取胜的方法。就是不那么有名的名人，如果联合起来也有一定的影响力。找到这样一批人，给我们推荐就好。\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_182_0.png)\n\n简单选：多找一些医院主任推荐就好。没必要找大牌明星上阵。花那个钱。\n\
    \n如：XX 科室主任情景 1，+XX 专家研究所情景 1，+博士后研究生专家情景 1+医学界峰\n会情景 1++++++无限大，多，多好。\n\n专业的推荐也可以比得上明星的推荐。\n\
    \n【影响力人物见证】主持人乐嘉使用情景 1+马云使用情景 1 + 市 政 府 医 院 认 可 情\n景 1 ……………………\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_182_1.png)\n\
    \n【影响媒介见证】凤凰媒体情景1++湖南卫视情景XX ………………\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_183_0.png)\n\
