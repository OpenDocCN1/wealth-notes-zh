    所以在做营销的时候，包装一定要精致，精致，精致；漂亮，漂亮，漂亮；大气，大气，大气。专业，专业，专业，专业......


    产品宣传理念：是否迎合现代大众口味，是否激发梦想，引起共鸣，引发共振。


    说起包装？ 培训行业是怎么专业包装的那。


    【培训包装内幕：一点小小的总结】培训讲师是怎么包装自己的？


    1. 身份包装


    xx 创始人 xx 集团公司董事 xx 组织协会主席


    然后跟 xx 大师合影 xx 客户见证 xx 名人聚会 xx 公司培训


    获得 xx 证书 取得 xx 成就 写过 xx 畅销书 捐款 xx 万


    2. 地点造势


    名车摆放 明星助阵 保镖护送 人群围拥 记者追赶 气派会场豪华酒店


    # 3. 故事编造


    一个曲折的命运，突然一个急巨转折，蜕变成耀眼的成就辉煌的事业


    # 4. 海陆空宣传


    + 报纸 杂志 电视专栏 书籍 网络 假光盘 笔记 视频


    包装好这几点活脱脱的屌丝就可以变成枝头凤凰，这就是中国培训师的骗局。


    虽然很多人很看不起，看不懂，还别说。 对于大部分傻逼，还真是有用。 当然我也在 其中。 尽管做过一些策划。


    大道至简，这些都是围绕人性进行设计的。


    > 营销即人性。 所有事情都是搞定人为初衷！ 把人性研究透彻了，你就能无所不能！ ——wolong


    因为时间问题，我们今早上的课程就到这里。


    2017年8月15日 下午分享


    对于课程，如果单纯敷衍，讲几个成功案例+成功故事，3天2夜很快就结束了。


    毕竟很多东西，你没有经历，没有用过，看，懂，只留存于嘴上=没用。只有真正落地创造价值，才是我们学习的本质。


    好了，不扯淡了，我们直接上干货


    # 第5节：产品借力战略


    + 1，借自己的客户——打造自身产品品牌知名度。


    如：英特尔制定一个策略，只要电脑厂商的外包装和说明书和广告上，加上“内有英特尔”，就在英特尔的合作电脑商销售额中给予5%广告补助。


    比如：一个做纸箱的厂家。专业定制各种纸箱。只要在纸箱下面，留下某某厂家定制；+电话。那么就有一定优惠。这样做的目的，也是在做一 个广告。


    + 2，借竞争对手一打造自身品牌战略


    如：蒙牛·牛生成，在蒙牛牛奶上，标注：“向伊利老大学习！”——于是很多喝过伊利牛奶的，都想尝尝蒙牛牛奶如何。


    于是，我们通过第二个案例，给一个做啤酒的企业老板做了这样一个案例


    买2瓶清纯啤酒送青岛啤酒一瓶清纯是普通厂家的，青岛啤酒是知名品牌。


    我们通过买清纯啤酒就赠送青品啤酒一瓶。捆绑销售。结果很多人认为，清纯啤酒是青岛出来的新产品。直接带来了不错的销量。


    同样，有一个卖净水机的老板，跟中国农业银行合作举办了一个活动。


    存定期5万元送价值价值3980元净水机一台.也是在借中国农业银行力，来做活动。相当于找一个公信力比较强，大家有认知的品牌做活动。效果会更加好一些。


    # 第 6 节：资源整合模型


    “借力”营销，借人流，借信任，借影响力。资源整合是用资源和智慧帮助客户快速轻松达成目标


    1.如果有好产品缺资金，你需要整合资金，如果你没有掌握整合资金的方法，再好的项目也是纸上谈兵，无法开展。


    2.如果有好产品有资金缺人才，你需要整合人才的策略和方法及现场整合人才。如果你没有掌握整合人才的方法，你只能自己干，并且永远干不大。


    3.如果有好产品缺政府资源，你需要整合政府资源的策略和方法及现场整合政府资源，如果你没有掌握整合政府资源的方法，你很难做做强大，基业长青。


    4.如果有资金有团队缺好项目，你需要整合项目的策略和方法及现场整合项目。如果你整合不到好项目，你的资金很难获得高回报。


    5.如果有好产品缺营销，你需要 整合营销的策略和方法及现场整合营销。如果你整合不到好的营销，你的好产品永远变不了利润。


    6.如果有好产品缺渠道，你需要 整合渠道的策略和方法及现场整合渠道。如果你整合不了好渠道，你只能自己慢慢建渠道，产品很难达到快速销售。


    7.如果有好产品缺代理商，你需要 整合代理商的策略和方法及现场整合代理商。如果你整合不到好的代理商，你只能慢慢做直营。


    8.如果想把企业做强做大，你一定缺很多资源，你需要 整合未来所缺资源的策略和方法。如果你不能整合资源，你就永远做不大。


    9.如果想把企业做强做大，你必须与人整合，你需要 如何整合及整合后如何做到融合与契合；如果你与人整合后不能做到融合及契合，你将为此付出巨大的代价。


    10.如果想把企业做得轻松，你一定缺很多帮你做事的高手，你需要 如何整合帮你做事的高手。如果你不能整合到高手，你就永远做不大并且不能脱身


    以上 10 问，我们一定要去想尽一切办法去整合我们需要的资源，借用别人的流量，别人的钱，信任，别人的影响力为我所用才是最关键的。


    【整合资源导读：你所缺的，就是别人已经拥有的，你也想快速拥有，最快的方式，借过来用用!!! 条件是你给他点好处作为回报！ 】


    # 1、【借力】学会借助外部力量！   很重要！很重要！ 真的很重要！


    可以让你少奋斗 5 年，少学 2 年，少摸索 3 年，节省 10 年的时间的经验。


    在当今快节奏的世界里面，人类的知识总量每半年都会翻一番。


    你怎么能指望依靠个人力量掌握这么多必要知识？


    很多人我发现真是傻，什么都学，学营销，学文案，学设计，学视频制作，学各种各样的技能。


    最后学了根本都没用过，才是最可怕的。


    其实，有时候，很多东西你根本都不需要学。学好一招营销就可以。 其他技术类的东西，花钱来做。


    所以懂得合作：有效整合有知识，有技能和有关系的人。 才是我们最应该做的。


    就像赚钱：是赚的快，还是借的快。


    学习，是学的快。 还是借经验来的快？


    是学知识快，还是借一个专业的人过来快。 懂了就懂了……


    如何让停滞不前的业务立马盈利？


    很多老板一上来就说创新，跨界，异业联盟，加入生态圈，系统，众筹，革命，一大樻专业名词，然并软，我说怎么具体来做，他就说：咱家做不到啊~~


    卧龙总结了 2 点：


    # 1，做优化


    不断优化，不管是时间，资源，资本，以最少投资获得最佳收入才是王道。


    从产品，商业模式，到包装，到定位，到流量，成交，后端，都可以做一个全面优化。


    # 2，创新（做测试）


    在风险可控情况下，搜寻行业外的非常规方法，以快速得到惊人的进步。如果直接创新，则很难直接提升业绩，所以企业改变应着眼于做优化的战略调整，更加注重结果。实现最优化。


    比如说：你开了一个服装店，人流还是那么多。你就应该先从优化话术，陈列，服务热情，风险承诺，客户价值，等方面做进立刻可以执行的优化。


    而不是去做什么革命。都是不可取的。删除无效动作，聚焦有效策略发挥极致即可。


    所以很多人不知道做优化比创新更重要，知道也不会行动。优化比创新更快，更容易实现，这才是我们更应该做的。


    # 【优化最佳最快途径：借助外部力量】


    很多老板更擅长销售，而不是用商业策略去将企业的利润，业绩，最大化。也就意味着永远做无用功。


    然后没日没夜的工作，却收获甚微，苦逼死缠再多，再久也是无用。


    我们不需要那么辛苦，只需要换一个思维，有的人一辈子不明白这个道理。就是利用他人的帮助和投资来将我的业务最优化。


    邀请他人来参与经营，是让利润和固定资产价值最大化


    努力，为何不能从别人投资中获得最大回报那？


    我以 10 年的实战营销经验保证：一个人/一个单体/一个小团队，绝对做不大，更别说最优。


    一定要学会有效整合别人知识，技能和关系，随时随地与牛逼的人建立利益共同体。把各个部分结合在一起，打造一个无与伦比的体系。

