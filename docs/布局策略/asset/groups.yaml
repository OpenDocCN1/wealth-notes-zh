    # 第 1 节：塑造产品价值 58 个有效的方法策略模型


    【营销没谈价值前，所有打折、促销、赠送都是浮云！】齐白石何菜贩：一车菜多少钱?


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_246_0.png)


    菜贩：十元。


    齐白石：我给你画幅白菜，换你一车白菜，干不干？菜贩不知道齐白石画的价值，很不高兴地说：你这老头有病啊，要拿你的假白菜换我的真白菜！


    > ——启示：在顾客不知道产品价值之前，所有价格都是高的。


    记住一句话：客户永远不会说价值太高了，永远只会说价格太高了。客户之所以不买，很重要的原因就是因为他没有感受到这个产品能够给他带来多大的价值。


    【成交前价值塑造】价值决定价格，必须完完全显现出来，才能让客户接受更高的价格。


    什么叫塑造价值？


    举一个最简单的例子：杭州 2 日游 1 人 360 元。送净水机一台和杭州 2 日游 1 人 480 元。送价值 3980 元的净水机一台。


    塑造价值的目的就是刺激购买欲望！看谁能把一个普通的产品，塑造的让人心动不已，非买不可。


    你给客户想要的（价值），他就会给你想要的（钱）。我们必须打造“非买不可”的价值！


    策略案例：《一套沙发，9 种卖法》


    一套沙发到底能用几种方法卖出去？请看下面（数字仅为举例，无实际意义）。


    为什么会有如此之大的差距？


    第 1 种卖法：卖产品本身的使用价值，只能卖 8000 元/套


    如果你将他仅仅当一套普通的沙发，放在普通的商店，用普通的销售方法，也许它最多只能卖 8000 元钱，还可能遭遇邻家小店老板娘的降价到 7800 元招客暗招，这就是没有价值创新的悲惨结局


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_248_0.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_248_1.png)


    # 第 2 种卖法：卖产品本身的技术价值


    # 普通模式 1：收学费


    如果你将制造沙发的工艺，去收学员，一个学员可以收 1 万元学费。迅速把这套技术普及国内。卖产品的不如卖技术的。叠加操作可以锦上添花。1+1=11引爆模式。


    # 中级模式：卖专利（分享红红利）


    如果你将制造沙发的核心技术，去授权 n 多家厂家，每卖出一套沙发，就有我们提成 20 元专利费用。那么如果一套沙发卖出 20*n=无限想象大利润。


    # 高级模式：合伙人模式


    如果让授课学员+厂家成为我们的合伙人。大家一起干，分钱，分股份。有效利用自身优势，我们不出一分钱，产品+技术人才；双管齐下。迅速打通全国。那么利润将无法想象。(学员想就业+创业；厂家需要人才；对接一下。)


    # 第 3 种卖法：卖产品的文化价值，可以卖 11000 元/套


    如果你将它设计成今年最流行款式的沙发，可以卖 11000 元钱。隔壁小店老板娘嗨兮招客的嗨唱估计也使不上了，因为你的沙发有文化，冲着这文化，消费者是愿意多掏钱的，这就是产品的文化价值创新。


    # 第 4 种卖法：卖产品的品牌价值，就能卖 15000 元/套


    如果你将它贴上著名品牌的标签，它就能卖 15000 元/套。隔壁店 7800 元/套叫得再响也没有用，因为你的沙发是有品牌的产品，几乎所有人都愿意为品牌付钱，这就是产品的品牌价值创新。


    # 第 5 种卖法：卖产品的组合价值，卖 20000 元/套没问题


    如果你将沙发做成“城市客厅”系列造型，组合成一个套装，用温馨、时尚、精美的家庭包围，起名叫“我爱我家”，一组叫城市印象，一组叫香厅印象，一组叫爱的足迹，卖
    20000 元一爱没问题。隔壁店老板娘喊 7800 元/套喊破嗓子也没用，小孩子一家会拉着妈妈去买你的“我爱我的家”全家福。这就是产品组合的价值创新。


    # 第 6 种卖法：卖产品的延伸功能价值，卖 25000 元/套绝对可以


    如果你猛然发现沙发的材料竟然是：百分之百全铜、进口的西班牙进口云石、那我帮你挖掘出它的时尚、尊贵、优雅、个性、且还有收藏价值，卖 25000 元/套绝对可以。这个时候隔壁老板娘估计都不好意思
    7800 元/套了，因为谁也不信 7800 元/套的沙发会有收藏价值，这就是产品的延伸价值创新。


    # 第 7 种卖法：卖产品的细分市场价值，卖 30000 元以上/套也不是不可以


    如果你将你的那个具有收藏价值的沙发“祥云”或“龙”，取名“吉祥如意”或“龙腾虎跃”，针对过属龙的或结婚婚侣，卖个 30000 元以上/套,绝对会让给对方买什么生日礼物而伤透脑筋的小年轻们付完钱后还不忘回头说声“谢谢”，这就是产品的细分市场价值创新。

