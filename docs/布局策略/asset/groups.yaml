    路过的流量，指向实体店而言，门口人来往的路过，它是门店自身的特性，不需要进行任何宣传就会产品的潜在流量。


    有可能是商圈的要素。有可能是地铁；公交交通转换的要素。还有可能是旅游景区的缘故…..


