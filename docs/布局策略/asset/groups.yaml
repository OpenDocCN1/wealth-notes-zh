    # 卧龙营销咨询《布局策略》：内部资料


    2017 年 8 月 14 日 早上：


    万能营销模式=产品模型+流量模型+成交模型（前端，中端，后端）+杠杆链条模型；


    目前为止，我个人花费了几百万的学费，学了亚伯拉罕，余凌雄，刘一秒，刘克亚，资本系统，文化系统，秦汉资本，阿国，财神圈，冯晓强，纵横天下，陈安宁，翟鸿喆，716，等几乎所有培训行业，目前所有的营销培训体系，所有的核心，营销方法，都着重于在这
    4 个方面。


    所以，各位，不需要在花费大量时间和精力，金钱，去学习其他课程了。 我希望各位认真听本堂干货内容。


    所有营销，无异于这 4 个点，没有捷径，所谓捷径，一定是骗子。


    # 【产品架构模型】


    +   (0).市调模型，寻找空白蓝海与差异化的市场定位。

    (1).概念与场景概念或另一个场景概念构造模型。

    (2).产品定位模型。

    (3).卖掉决方案模型。

    (4).产品包装策划模型。

    (5).产品借力模型。

    (6).情感价值营销与前期情感营销。

    (7).资源整合模型（“借力”营销。借人值，借信任，借影响力。。）

    (8).商业模式设计模型

    (9).品牌打造与品牌战略模型。

    (10).借势与造势模型。

    (11).品牌形象打造与定位。

    (12).产品营销模型。

    (13).广告文案与传播途径模型

    (14).渠道模型设计（分销）

    (15).招商模型

    (16).团队管理机制


    今天我们主要学习这些内容。 一个完整的产品经理必须要学的基本路线。


    万能的赚钱原理：赚钱是很容易的事情，核心是改变观念掌握方法和原理。


    当你对这些原理了如执掌，你很容易把生意架构起来，而不是单纯的卖货思维。 技术壁垒可以找人攻克，如果没有运作原理，即便再牛逼的技术，也不知如何运作。


    那么，赚钱最关键的原理是什么？


    一个身价过亿的老板对我说：为别人解决难题就能赚钱，把自己擅长的事情市场化就会赚钱！'
  - '[PAGE 1]


    # （一） 赚钱就是帮助给钱的人提供解决问题方案


    简单理解：人性之所以购买某些产品和服务，就是因为想要解决自己的问题。 比如：病痛问题，赚钱问题，生活问题，情感问题，婚姻问题，幸福问题，贪欲……


    【问题=项目】 在 2015 年很多人虽然知道微商，但却不知道怎么具体来做。 然后我跟一个小伙子讲，其实很多人很盲目做这些事情，你不如你来做，高一些培训。


    他然后通过包装，定位，打造自己的产品，然后很多企业主都愿意找他学习。 为啥？


    因为实体生意不好做，很多老板是求着被洗脑，求着让你培训他。 所以就衍生了微商培训。通过这个趋势，问题，这个小伙子 1 年就赚了 200 多万。


    脸上痘痘好烦人：祛痘系列产品；


    个子矮，好想增高：增高系列产品（增高鞋，增高补钙片…）；


    阴茎小，常手淫，怕早泄：美国磁性内裤包你解决…


    想发财，不知道怎么办？ 成功培训，成功学。


    想做大，不知道怎么干大？ 资本放大，资本升级，商业模式放大培训。


    记住：所有财富的通道，都是替别人解决问题。你能够解决谁的问题'
  - '[PAGE 2]


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_2_0.png)


    （二）产品和服务只是顾客想要迫切解决问题中 想要得到的答案。


    如：沙漠里将要渴死的富翁，对一瓶水的迫切。


    如：今年实体生意不景气，很多老板找培训行业救命迫切


    普通人一般都随便找个产品，买卖思维。卖了就卖，卖不了不卖。得不偿失。可是，有了这2个思维，找产品之前，定然想的是给顾客想要什么样的答案。


    举例1：脑白金

    脑白金仅仅是普通的保健品，但由于保健品竞争很激烈，三株，太阳神，鹿茸…；但是史玉柱却把它变成送礼的方案，使得每逢过节的人都想到这个脑白金，脑白金也异常畅销。

    因为很多人送老人，不知道送什么产品。——因为脑白金解决了中年人的送礼问题。


    举例2：王老吉

    王老吉是普通饮料，超市里已经有太多太多竞争对手，竞争那么激烈，王老吉的发现很多'
  - '[PAGE 3]


    人吃火锅，熬夜，都很容易上火，于是把中药结合饮料，把王老吉变成了“怕上火”功能性饮料，给众多容易上火人群的提供了解决方案，一下子拥有了巨大的市场。


    ——因为很多人怕上火，不敢吃辣，怕嘴上起泡。所以王老吉解决了这个问题。


    # 举例 3：卖蜂蜜


    如果单纯卖蜂蜜往往不好卖，但是你可以把蜂蜜变成便秘、美容养颜、烧烫之类的问题的解决方案，这样蜂蜜的市场就大多了。


    因为很多美女本来没有想要吃蜂蜜，听说隔壁王阿姨每天坚持喝蜂蜜，皮肤变好了，人也变健康了，还不便秘了。她也偷偷的每天晚上喝了起来。


    就像我们家族卖烤鸭，单纯一个烤鸭，对人就是一个菜的问题。但是我给他是包装一下：可以写上具有滋补，润阴，养颜，减肥功效之后，发现有些美女，就天天坚持吃一个烤鸭。本来他们是没有需求的，但是听说烤鸭可以减肥，果不其然，他真的瘦了。


    如果你精通这个思维，几乎可以卖出任何产品。


    # （一）赚钱就是链接问题方案和答案的过程。


    古今中外所有的商业，都是在做对接这件事情，而营销只是链接的工具。


    为什么我一个“悟”字，可以卖 10000 元，还有人抢着要？


    其实，因为我能让一些老板，感觉我能帮他解决问题，让他利润翻倍。那么他还会在乎这 10000 元吗？


    如果你不具备这个思维，你就不了解赚钱的本质，但是一旦具备了链接思维，你就会发现机会到处都是，因为世界上的问题和答案都太多了，你只要集中精力解决某一个就可以了。


    但是仅仅知道链接还不行，还得精通如何链接，下面是我总结的链接框架（即营销框架布局）：


    +   1、产品定位（产品或服务，梦想概念）


    比如：


    +   送礼，是脑白金的定位；

    怕上火，是王老吉的定位；

    去屑，是海飞丝的定位；

    ....'
  - '[PAGE 4]


    布局，是卧龙 的定位。


    智慧，是刘一秒 的定位。


    成功学，是陈安之 的定位。


    潜能开发，是安东尼罗宾 的定位。


    免费模式，是壹玖资本 的定位。


    没有一个好的定位和概念，再好的产品和服务都不好卖。反过来呢，给普通的产品一个好的定位和概念，也许突然就火了。


    一定要占领消费者心智。产品是形，概念是神。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_4_0.png)


    现实中的一个经典案例：这个老婆婆现在就是单纯卖产品，是没有神，没有概念的。


    好了，我们策划人员，看他比较辛苦，就给他加点内容上去。


    然后找了一个泡沫，从手里拿出笔写了一句话：'
