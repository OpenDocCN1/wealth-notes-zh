    ## 再来进驻一家药店，一上柜台即受大众欢迎\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_177_1.png)\n\
    \n【产品资质见证】国家证书，指定经销产品。\n\n【视力恢复密穴】\n\n在双手的拇指上有三个相邻继的穴位，分别是明眼、风腰、大空弯。明眼、风腰能够改善眼睛疲劳和急性结膜炎，大空弯则可改善一切有关眼睛的症状。平时眼睛易疲劳的人，每天要按摩这三个穴位两次，此法特适合经常用电脑、耗眼睛的朋友。对抑制人性的白内障也有效果。\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_178_0.png)\n\n2，招收代理见证 ；客户见证（现场说法 视频，文案，聊天信息…），收入截图\
    \ ，用户，代理，现身说法，自从使用，加入代理后赚多少钱，经历...\n\n【用户说法见证】一个时尚品牌的流行，一定是具有影响力和地位的一部分人引导而来。\n\
    \n如：\"这旗袍，彭妈妈都穿了，我还没有那？\" 淘宝——明星同款，明星表情秀，明星代言词,...\n\n当身边人都有了 Iphone 手机，则你也不知道为何突然想要拥有。\n\
    \n所以我们要设计客户真实见证，注意 \"顾客的声音\" 跟具有同样困境的人，很容易产生共鸣。 我们就要尽量多找一些人，尽量先择个性和背景不同的人，这样效果会更好。\n\
    \n呈现 \"顾客的声音\"，从文字，声音，照片等符号，罗列，从目标客户群挑选对该产品的意见和看法。 注意：越详细，越详细，越详细，越好！！ 很重要！\n\n\
    如何让客户主动做见证？？\n\n最好有礼物赠送，这样事情就变的简单。 没啥好处，很少有人会主动当志愿者。（这就是人性是趋利的。）\n\n因为时间因素，我们的分享就到这里，晚上接着继续分享。\
    \ 感谢有你。\n\n2017年8月15日 晚上分享\n\n我们产品模型环节，设计，至少要花费 70% 的精力和时间。\n\n用 20%的时间用来建立信任和塑造价值，用\
    \ 10%的时间用来成交。 就像多米诺骨牌一样，我们需要用 70%的时间用来设计如何来搭建框架，倒推，布局。 20%时间建设，搭建。 10%的时间欣赏骨牌运行结果。\n\
    \n简单讲，客户看中的是产品价值，其次是对我们的信任，最后成交就可以直接敲定。\n\n我们继续上面的讲解：\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_179_0.png)\n\
    \n## 【用户见证】\n\n+客户使用产品情景图片 1 +孩子使用产品情景图片 1+老师使\n用产品情景图片++++++……\n\n宝贝眼睛突然红，肿，痒，\
    \ 贴了一天黄金视力眼贴，好了，妈妈终于放心了\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_180_0.png)\n\
    \n新发现，黄金视力眼贴对鼻炎也有效哦\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_180_1.png)\n\n\
    一定记得，大量客户见证++ 几千，几十万，更好。\n\n【代理见证】代理亲自体验产品情景 1 图片+客户因为产品好，\n选择创业这个情景 1 图片+视频\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_181_0.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_181_1.png)\n\
    \n3.影响力推荐见证：（意见领袖，行业权威（著名XX教授…），媒体，名人推荐）让意见领袖使用推荐…...\n\n需要找一些权威的人“推荐”自己产品或服务。人性喜欢权威的推荐。\n\
    \n举例：电视广告+明星艺人？（国内品牌广告都是这个路线）就是权威推荐，你喜欢这个明星，自然就很容易认可背后的产品。\n\n【行业权威见证】——【名气不够就以数量取胜】\n\
    \n理论讲，权威推荐需要利用有名气的人。从那个人“地位，影响力”也相应抬高了自身的地位。\n\n一般请名人推荐，需要花好多钱，那么如果无法采取推荐。那么就只能采用以量取胜的方法。就是不那么有名的名人，如果联合起来也有一定的影响力。找到这样一批人，给我们推荐就好。\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_182_0.png)\n\n简单选：多找一些医院主任推荐就好。没必要找大牌明星上阵。花那个钱。\n\
    \n如：XX 科室主任情景 1，+XX 专家研究所情景 1，+博士后研究生专家情景 1+医学界峰\n会情景 1++++++无限大，多，多好。\n\n专业的推荐也可以比得上明星的推荐。\n\
    \n【影响力人物见证】主持人乐嘉使用情景 1+马云使用情景 1 + 市 政 府 医 院 认 可 情\n景 1 ……………………\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_182_1.png)\n\
    \n【影响媒介见证】凤凰媒体情景1++湖南卫视情景XX ………………\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_183_0.png)\n\
    \n+   4. 赚钱项目文案诱导案见证：\n    突出：简单，容易，轻松 如：一个电脑，一根网线，开网店，轻松月入万元……\n\n【马云式画饼】【人性——人人想赚钱：把任何产品变成所有用户的赚钱项目，才是营销的最高境界。每一个用户都是我们代理和宣传员：一用户+一代理；】\n\
    \n## 卧龙营销咨询《布局策略》：内部资料\n\n开美容店的老板娘卖起洁牙菌丝，然后卖到乐器艺术中心去找了艺术中心老板娘做代理 \U0001F374 \U0001F46C\
    \ 卖洁牙菌丝 \U0001F457 \U0001F374 这是同人的头脑，你呢？??\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_184_0.png)\n\
    \n美女说还要晒晒牙齿 \U0001F60D \U0001F60D 卖洁牙菌丝，牙齿白了，笑容灿烂了，钱也赚到了\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_184_1.png)\n\
    \n真人+真人图片，没有就做一张，你懂的 XX\n\n人性相信什么，我们就预置什么。----〈布局系统〉\n\n记住：【见证就是最快建立信任的有效方式！ 多多益善！\
    \ 不伤大雅！ 懂了就懂了】\n\n## 【产品营销故事】\n\n通过讲故事的形式，很容易将产品形象导入大脑，因为人类都是喜欢听故事。 我们为产品包装精彩的故事，能迎合消费者群爱听故事的需求。\n\
    \n一个好故事可以提高产品附加值，抬高职场人身价，为一切平庸打造传奇和亮点；\n\n没有好故事，就没有好价格，就不会有高附加值。故事越精彩，产品越好卖。复制\
    \ LV 包，不然永远是淘宝同款。\n\n一个好的营销都有一个好的故事，把故事通过某种方式转嫁给消费者？ 故事营销是千万种营销方式里的一种。 故事，怎么讲？\n\
    \n一个产品讲故事，至少，先布局，设计框架，准备三个故事 ：\n\n（一）产品背景故事（产品历史，获得奖项，特色，由来（来自法国农场，加拿大奶牛···....））\n\
    \n（二）顾客故事（使用人数，带来的效果，客户真实见证对比，好评......）\n\n（三）第三方的故事（代理商，新闻报道，国家访谈，名人，专家推荐，朋友介绍，意见领袖推荐，专业机构背书（清华研究院，红十字会.）......）。\n\
    \n三个故事+一个理念（包装的概念=品牌定位）=故事型产品策划的核心。\n\n另外，大多数的故事营销，都只有情，没有色——什么是色？色就是心理引导。故事营销，就是“情色营销”！\n\
    \n一定要学会讲故事！ 讲故事=吹牛逼=骗人=造谣=创造情景生活； 不会讲故事的人，是永远不会发财的。\n\n为什么微商 2015 年那么火？\n\n什么原因？\n\
    \n难道真的微商刚开始就那么 good，容易做吗。 什么轻松一个微信赚 100 万，赚几个亿。\n\n一个微信，能赚那么多就是一个故事。\n\n这些做培训的怎么把微商拉到顶峰了那。\n\
    \n很简单就是讲一些故事，某某通过做微商赚多少钱。。。。\n\n+   某某企业入驻微商，业绩暴涨....\n\\- 某某人，入驻微商，业绩增量 30 倍...\n\
    \n通过几个成功故事的打造，顺利的带动了微商的发展。然后他赚了多少钱。赚了培训费几千万。\n\n同样案例：微商刷朋友圈，就是最好的案例。\n\n前提：在你已经建立了足够粉丝信任情况下，并且你给了他们一种你很厉害，很牛逼，很厉害的生活方式。自然很容易成交一大批粉丝。（编故事——收钱——就是这么简单。一天就收了\
    \ 10 几万。）\n\n天天就晒收入截图，晒发货，收货，进货。单子。以及开豪车：宝马，奥迪：……再没事去个星巴克，参加一些会场，跟牛人多一些合影。\n\n\
    瞬间就是在打造一种高逼格的生活方式。\n\n其实很多人买的不是产品，但是你给他的感觉就很厉害。所以，单纯的卖故事，比卖产品还赚钱。\n\n举例：台湾有家饮料公司新推出者一款饮料，销路一直不昜，后来经过营销专家建议，在每包饮料的包装上印上一则动人的，很有诗意的爱情小故事，并将此饮料命名为“爱情饮料”，主打年轻族群；\n\
    \n包装一换上马上吸引众多青年男女，他们边饮料欣赏故事，在朋友圈相互讨论分享，该饮料马上火爆起来；\n\n接着该公司又推出爱情征文大赛，消费者可将自巳的爱情故事投稿，饮料公司从中选出精彩爱情故事印在包装上，该征文大赛引发市场轰动，参赛者踊跃。有些参赛者甚至还做起兼职推销，饮料销量顿时暴增。\n\
    \n这一点是不是与江小白很相似那。其实这个案例比江小白要早 20-30 年。\n\n卧龙营销咨询《布局策略》：内部资料\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_187_0.png)\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_187_1.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_188_0.png)\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_188_1.png)\n\n搜集 100 个卖故事案例/当下经典语录，借鉴参考包装自己产品或销售话术，营销故事。\n\
    \n卧龙营销咨询《布局策略》：内部资料\n\n3.【产品组合套餐设计】 没有套餐设计，单调套餐=无聊寂寞！\n\n当你单卖一个产品很难卖的时候，组合更多的产品销售就变的容易了\n\
    \n+   1. 当某个产品需要培育习惯才能被客户接受的时候，先用刚需产品前置销售，将软需产品捆绑赠送，再靠软需产品后端赚钱（组合产品销售）\n\n例：移动机顶盒公司：(农村开发困难，大多数农民都不购买机顶盒，怎么解决？)\n\
    \n+   （1）.把钱投资开一家农资公司专门卖农药化肥。\n\n因为农村家家户户都需要购买化肥。然后 300 元的机顶盒开户费，180 元第一年的收视费以及无线移动机顶盒，塑造一下价值，争取标个\
    \ 600 块，把这些打包成 1080 块的一个赠品；免费赠送即可\n\n价值 1080 元的机顶盒，购买 1 年化肥免费送。然后靠 180 元/年。 服务费年费持续赚钱。\n\
    \n+   （2）.和当地镇政府合作，把这个服务当作一个惠农政策推出，面向农村推广\n\n案例 2：\n\n汽车机油（单卖机油很难卖，组合产品销售容易）\n\
    \n例：做一个册子，帮助你解决汽车问题，客户见证和公司介绍，480 元的汽车服务只能管 20 天，你要是想一年的服务价格是 4000 元，活动期间只要 2000\
    \ 元，并且一年 内的机油免费送，还签订八大保障协定，保证你的汽车不会出问题。只要出问题，免费维修。\n\n## 3.组合销售，提供更多价值\n\n盛总案例：盛总是做泸州老窖代理的，然而单纯卖酒很难，于是跟各大承接婚庆的酒店合作，做平台。\n\
    \n简单讲，他跟婚庆酒店合作。 打包一个酒水套餐出来，送给客户。 然后酒店给返利。\n\n比如：送你糖花生套餐 12 份 价值 120 元+2 箱价值 680\
    \ 元的泸州老窖+饮料 2 瓶+红酒 2 瓶价值 120 元。 每桌。\n\n免费送给您，你订了多少酒水。 但是你要结婚。必须到指定酒店。\n\n## 卧龙营销咨询《布局策略》：内部资料\n\
    \n这样一个套餐设计，大大增加了泸州老窖的自动化销售。\n\n同样还可以这样：提供一个这样组合套餐：（价值 360 元的烟酒水）婚庆每桌 2 瓶泸州老窖+2\
    \ 瓶红酒+2 盒烟+一箱水=55 元。\n\n并且拥有产品冠名权。然后让婚庆进行补贴，迅速做大做强。\n\n## 套餐设计思想：\n\n+   1,数量折扣\
    \  如：购买多个产品或者超过一定额度，将获得数量折扣。 目的：加强顾客忠诚，鼓励大额购买。\n\n比如：我去面包店买面包，一个 5 元。本来我想买 1 个。老板突然说：“10\
    \ 元给你 3 个。”我一算，挺划算。当即就买了 3 个。\n\n+   2，现金折扣\n\n促使用户尽快付款或提供价格减让。快速付款是的经营商节省管理费用和财务费用，并且可以避免坏账。\n\
    \n如：前 200 名，原价 1980，前 200 名 1600 元。\n\n+   3，职能折扣\n\n分销渠道不同，总经销商，批发商，零售商。百分比折扣不同，返点现金不同。总经销商给你\
    \ 5 成折扣。批发商给你 7 成折扣。零售商给你 9 成折扣。\n\n+   4，季节折扣\n\n对购买过季商品提供价格减让，这种折扣储存的任务转嫁给消费者。\n\
    \n+   5，促销折让\n\n如：零售商为生产商的产品做广告，生产商可能支付一半费用。如果零售商举办展会，生产商，会在线下提供一定数量的免费商品。或者今天光棍节，所有产品半价\n"
