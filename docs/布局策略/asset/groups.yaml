    ### 3.顶层“客户价值取向或注意力”


    一个好的产品, 物质层面+精神层面, 只有两者结合, 形神兼备, 才能无往不胜。


    看似江小白卖的是一款酒, 其实在卖一种情怀, 和情感归属。


    任何在高端的产品, 终究是围绕人性服务展开, 没有情感的产品, 在高科技的产品都是苍白的手段而已。 (人性拥有社交需求)


    同样一款, 什么概念都没有? 是很难卖出去的。因为没有差异化。更别说自己的定位了。


    定位的产品概念比如:


    - 1."绿色"产品——“纯天然, 无刺激-28 天还给你紧致肌肤! 欧莱雅”...


    - 2."道德"产品——"每买一瓶农夫山泉, 将给爱心基金捐献 2 毛钱。"


    - 3."有机" 产品——"江中猴姑饼干, 有机, 更养胃!" …… 环保, 节能(省电) ……


    有了这些概念, 我们在包装上做一个符号, 然后就可以更贵, 消费者才会更愿意买单, 为价值付费。


    ### 4、【产品用户定位】不是所有客户都是我爷!


    有了产品, 有了包装, 品牌定位, 差异化, 下一步就是发现我们的精准客户。


    【客户管理系统】定位客户, 首先我们要对客户进行分级如下。


    企业客户：


    - 1，主要顾客群

    - 2，辅助顾客群


    企业顾客群：


    - 1,潜在客户

    - 2，意向客户

    - 3，小客户

    - 4，核心客户

    - 5，大客户


    1，潜在顾客群


    企业做大 3 点要求：


    一，一定要有一个清晰的界定！ 无界定，则模糊，注定做不大。

    为什么海飞丝广告做了几十年，仍然坚持去屑海飞丝。 而不是其他内容？因为这就是他的定位。 而脑白金的定位就是送礼！ 所以十几年一直打 "今年过节不收礼！ 收礼还收脑白金
    ! " 的广告。


    二，拥有足够的规模客户群体，不然一定受限。

    三，对顾客群的需求和偏好进行深入认识和了解。


    简单讲就是研究消费者花费多少时间都不为过。


    如何须找到这样顾客群？？


    我们必须明确要为那些人服务，锁定一个关键的市场，并进行【市调】与【客户消费心理】研究。


    怎么市调？


    线上市调：搜索引擎（百度）+电商平台（淘宝，京东，阿里巴巴，慧聪网，美丽说...）+论坛（天涯，猫扑..）+沟通平台（微信，QQ，陌陌.... ）;百度系；阿里系；腾讯系数


    量级的搜索市调；


    http://www.iqivi.com/w_19rrsotc39.html 看老朱5柱牛人是怎么市调的。紧跟牛人学习。


    把有限的资源用在目标客户群上，并这些目标客户需求进行分层：


    - 1，重要且迫切

    - 2，重要不是很迫切

    - 3，迫切但不重要

    - 4，不重要也不迫切


    如何把握客户又重要，又迫切的需求，就很容易成功。还需考虑一个问题，就是购买动机【成交理由】？


    温饱型客户是价格的敏感机器（经济因素：穷，没太多钱!，消费能力差);


    小康客户最关心功能（实用价值：安全，性价比高，多功能);


    富裕客户最关心心理因素（面子：身份感，价值感，荣耀，豪华，尊贵，vip..）


    不同社会阶层影响对各种解决方案的价值评估不同。


    那么如何给客户【独特价值】？？？


    四个方面考虑：


    - 1. 你强化了什么要素？？？ 即那些比现有解决方案更好的方面。

    - 2. 你弱化了什么要素？？？ 即把那些客户并不在意的，费力不讨好的东西尽量删除，马上删除，或降低标准；

    - 3. 你去掉了什么要素？ 即把那些客户用不到的功能去掉。

    - 4. 你创新了什么要素 即那些独创的方面。

    然后，初步产品创新设想出来后，一定要与目标客户沟通，检验创新是否有实际意义。


    同时，了解为此愿意支付多少钱买这个商品？ 他们的切换成本有多高！——市调最容易被忽略的一点。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_74_0.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_75_0.png)


    比如：这个电动车排名第一名。 为什么他总是排名第一？


    你强化了什么要素？？


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_76_0.png)


    - 1. 超长续航 200 公里。

    - 2. 送意外盗抢险。 不怕被贼，被偷了。

    - 3. 闪电发货。速度快。

    - 4. 全国联保 不用担心售后问题。

    - 5. 30 天无理由退换货。


    现在的电动车，能做到如此承诺的有多少？ 爱玛电动车，也没有这样的保障。所以，为何他能成为销冠？


