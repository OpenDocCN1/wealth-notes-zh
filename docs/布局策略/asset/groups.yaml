    # 第 3 节：成交前端：建立第一笔生意


    【成交工具】电商（淘宝，阿里，京东…），自有商城，网站，货到付款，支付宝转账，银行卡转账,pos 机，员工入账，现金，微信转账……


    所有的 一切都有了，此时此刻就是收钱了。准备好收钱工具很重要。


    记住：不让消费者为买第一单付出太多没必要的时间！收钱要多元化！


    消费者问有支付宝吗？ 可以支付宝付款吗？你说不可以，然后对方抠头就走了。对方向，可否刷卡吗？你说不可以。那今天不买了。


    # 【成交话术的设计】


    # 【顾问式销售最好的模板】


    +   1, 问封闭式话题（专业的问题）


    +   2, 下一个结论（专业的回答）


