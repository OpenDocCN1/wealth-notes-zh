    ## 卧龙营销咨询《布局策略》：内部资料


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_17_0.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_17_1.png)


    什么叫做赞不绝口？？ 免费的都是好吃的，大众出于恭维，都会说几句客套话。站在消费者角度提炼本质，好喝=续杯！


    如果豆浆真的好，他们会说：能再来一杯吗？ 听不到这句话，众人夸奖就是虚情假意，目前这个口味离极致还有很多提升空间，继续努力吧。


    卖吃喝的，产品打造永远放在第一位。


    不断提升测试难度：专门找早餐，午餐，晚餐后做测试，即使在众人对美味敏感度下降的时候，还有人赞不绝口，甚至听到“你们卖吗？ 多少钱？ 早上有送吗？” 你，调试豆浆口味成功了。


    你们这个豆浆怎么卖？ 多少钱？


    尤其是小孩子，喝了还想再喝，那么说明豆浆被市场接受，被大众消费者认可。


    这里就是为何在消费者身上花费多少时间都不为过的本质原因。


    那么第一步：产品测试，打造出来后。 我们怎么与其他竞争对手，同类产品竞争？


    策划与鲜奶和速溶豆浆 PK 战：运用养生概念为豆浆饮品背书。 在小区推广豆浆，处于两大竞争对手前后夹击。 一是鲜奶，二是速溶豆浆。


    一杯牛奶强壮一个民族的观念深入人心，早餐喝牛奶是主流，而速溶豆浆凭借便捷冲泡工艺，也在大举侵占市场。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_18_0.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_18_1.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_19_0.png)


    针对牛奶，我们要强调豆浆特色：


    - A，素有“植物奶”美誉，还有丰富植物蛋白，磷脂，维生素，烟酸，铁，钙，镁铝等营养物质，尤其含含钙量比乳类高，非常适合老人和青少年。

    - B，鲜豆浆四季都可以饮用。 春秋喝豆浆可滋阴润燥，调和阴阳，夏季可清热防暑，生津解渴； 秋冬可驱寒暖胃，滋养进补。

    - C，豆浆是防治高血脂，高血压，动脉硬化等疾病的理想食品，可预防老年痴呆症，防治气喘病； 调节分泌系统，改善更年期症状，延缓衰老； 减少女性青春痘的发生，使皮肤白皙润泽；
    有瘦身功效；


    都知道豆浆好，但好到什么程度？ 研究自身产品优势，花费多少时间都不为过。找出自己独特的概念卖点。 至关重要。 越多越好。


    消费者说不出个所以然，我们要强调豆浆品质，为的是和鲜奶直接 pk！


    而针对速溶豆浆的优势，我们该强调：


    - A，不添加防腐剂

    - B，营养物质百分百保留。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_20_0.png)


    产品文案+优势，卖点解决了。


    那么更重要要【 建立自己的品牌和形象识别系统 】品牌名也生产力。


    俗话说：“名不正则言不顺，言不顺则事不成” 对于企业而言，起一个好品牌名字是至关重要的一个环节。品牌名字起的好，消费者容易记住，朗朗上口，有美好的联想，再加上生产经营环节也做的好，容易走俏，很快就成长
    为当地知名品牌。


    比如：“ 王大爷爆米花 ” 就是一个品牌。如果能做一个爆米花的熊仔形象就更容易加深印象。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_21_0.png)


