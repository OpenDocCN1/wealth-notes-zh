    没有一个大企业不做广告的（流量巨大），没有一个创业实体不做促销的（流量靠赔），剩下的都是无能。


    消费者=用户=流量=客户：


    +   1. 终端用户（解决问题，试用，体验）简单理解，最后能体验产品，使用产品的一批人。

    2. 代理用户（经销=省、市、区（县）、镇、代理商）帮你推广，一起分钱的代理商。批发商。

