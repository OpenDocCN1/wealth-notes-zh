  - "[PAGE 7]\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_7_0.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_7_1.png)\n\
    \n而原来，等 30 分时=半小时，也不见得会有人理。\n\n记住：产品是形，概念是神。 形神兼备，方能达到 \"神\" 一般销量的境界。\n\n+   简单理解：好产品需要好文案。\
    \  \n好产品需要好的策划。  \n好产品需要好的商业模式。  \n好产品需要好的运作团队。\n\n好产品更需要包装，定位； 如果没有定位，没有区分，那么就是等于大家都一样，买啥都是买。\
    \ 没有差异化。\n\n有了产品定位，包装，那么下一步就是流量模型=传播出去。（获取流量）把产品，产品"
  - '[PAGE 8]


    信息通过各种途径传递出去，展现在顾客面前。


    顾客看了产品或产品信息会自动得出一个结论，你可能有他问题的解决方案，你的产品还不错，你真好厉害，佩服，然后主动来找你，比如访问你的网站、朋友圈、公司、店铺，拨打你的电话，主动联系你等等。


    有了产品+流量。 下一步就是我们流量转化成成交模型了。简单理解就是把来找你的潜在顾客成交


    成交核心一般只有 2 点：


    +   - 价值（好处）

    - 信任


    所有的营销方法，都是为了让好处和信任最大化，无论线上或线下，只是传递好处和信任的工具。


    简单理解，我看了你的产品还不错，然后看你人也不赖，我就愿意跟你买。


    产品不够好，我不会买。人不咋地，我也不会买。满足以上 2 个基本条件，别人才愿意给你钱。


    如果你的店铺，为什么没有生意，或者为什么没有人愿意转介绍，试问你给客户多少价值？又有多少信任?


    以上是从业营销 11 年总结出来的一个赚钱公式，即：赚钱=问题+答案；


    赚钱=问题一营销（产品，流量，成交）——答案；

    赚钱=选产品+引流量+会营销（会成交）+能坚持。


    既然说到赚钱，我个人很喜欢倒推。那么我们为什么花钱？


    花钱（给好处，利益）=问题（你想要解决的问题[物质=产品+精神=服务]，如：做网站，好的文案…）+答案(你想要的结果）；


    ——简单理解，我们花钱，就是想得到我们想要的结果。


    当然了至于怎么花钱，我们一定有很多要解决的问题，你能解决我的问题，帮助我达到我想要的，我就愿意给你钱。


    营销公式：产品模型-流量模型-成交模型+杠杆模型。一切商业均是如此。


    上面是我们《布局策略》基本营销公式。'
  - '[PAGE 9]


    卧龙营销咨询《布局策略》：内部资料


    很多人不知道怎么选项目。  其实事实也很简单。


    # 【怎么一周内找到合适的项目（产品）】【项目怎么找？没方向，迷茫？】


    建立一个项目广告库，没必要过于创新。我 一直提倡：新模式=模仿+稍做创新；坚持：一广告，一项目。线下的直接拍照，回来总结反思。


    具体如何行动：1 天收集 10 个广告案例或者线下火爆的生意项目有问题吗？


    10 个，建立分组。并研究战略，战术，思维，去测试一个你认定不错，非常有价值，找到这个行业前几名做的不错的人，研究模式，解读模式，复制模式，学习，反馈反省。微创新成为自己的体系。


    小规模测试成功，大规模复制，放大，系统化，流程化，自动化。——所有项目标准万能公式。


    无论他是多大企业，多牛逼的人，多么成功的人，都是这么一步步来的。


    小米，阿里巴巴，腾讯，京东，国美…  都是通过测试，复制；放大；优化；团队化，系统化，流程化，自动化；整合化，资本化，一体化。这样一步步来的。


    6 大吸金项目方向：1，男人好色 2，女人爱美 3，小孩爱聪明 4，老人爱健康 5，人人想赚钱 6，人人要智慧……


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_9_0.png)


    那么，广告怎么找？


    线下：街头传单，各种广告，超市，孵化器，天使投资人，平面广告，名片，圈子，朋友介绍，报纸，招商会，展会，各种市场，万达，十字街，培训机构当卧底，卧底，快递员，调研，电视……


    10'
