    ## 最后【营销模式定位】


    营销模式：卖产品不如卖技术(渠道，培训)，卖技术不如卖服务(故事，设计…)，服务不如卖加盟（代理），卖加盟不如卖概念（品牌），卖概念（品牌）不如资本运作（天使投资人，上市融资，转销，直销，众筹(空手套，合伙人，股权融资)…）


    ## 真实案例：7 天卖出 17000 箱橙子，赚 35 万！


    ## 卖产品——卖渠道——卖故事；


    实操谏言：其实不管多小的生意，只要找到合理的方法，都可以做成一个大生意！


    ## 第一轮：狂刷朋友圈 5 个人；


    最早的开始，本来没有目标，因为这是个人的事情。通过朋友圈群发，影响了一批朋友有 124 箱子订单；


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_279_0.png)


    第一阶段：一共卖出 200 箱子。【自发，没有任何组织和设想，普通人模式：200*10=2000 元利润】


    ## 第二个阶段：幼儿园渠道扩展，合作 40 家幼儿园 4826 箱子！


    我们利用了家长和幼儿园老师之间的信任。让一个幼儿园家长，送学校 2 箱，然后给孩子吃。这样就不开担心水果安全问题？


    引导老师在放学时候问孩子：“好吃不好吃！” 好吃可以让妈妈买哦”，刚放学，一个半个小时，家长只需要在老师那登记，交钱，货到付款就行，卖了 172 箱子。然后有了这点，我们发动朋友圈，放大成功模式，让大家找自己孩子在那个幼儿园，这样很快就接到了
    40 家幼儿园。为免孩子购买一定让家长在那个幼儿园去谈，这样可以有效解决信息不对称，家长不至于孩子吃吗？ 绿色果园，这是否方法。园长不在乎几块钱的收益，送
    2 箱橙子即可！（天天和老师打交道，有情感，老师一箱 5 元，有利益。利益+情感让生意更容易。）


    ## 卧龙营销咨询《布局策略》：内部资料


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_280_0.png)


    疑问：去幼儿园免费送水果？ 会不会引起家长反感？ 或者有熟人关系...


    条件是：每个幼儿园送 2 箱子，给孩子，好吃的话，才给推荐。给幼儿园一箱 5 元补助。


    ## 第三个阶段：


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_280_1.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_280_2.png)


    这个时候，我们就是把山里面农民的辛勤故事传播出去，我们能使他们做些什么？

    这时候已经不是卖产品了。 情感升华，做公益！  让所有社群（微信群）转发。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_281_0.png)


    一场地公益活动开始了，活动内容：凡是在这 3 天时间里面身边朋友，都可以在微信平台定制橙子，所有预订客户订购，我们都将拿出 3 元捐助山区，作为爱心基金。而且所有参与购买的，都将列入名单，成立爱心基金。


    从第 5 天，这个消息，经过转发，爱心+故事 主要是得到了家长和老师的转发）阅读量就达到了 1 万多阅读量，得到了社会各界的大量支持。


    第六天，我们订单就到了 12896 箱。


    因为爱心的不断延续，这场活动，12 月 31 日，一共卖出 17023 箱。


    这样的公益活动一定要政府出面，才有公信力。推广才能更容易。


