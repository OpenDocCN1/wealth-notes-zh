    同样然后消费者对产品认知也要加以考虑，认知价值会对消费者认为合理的价格造成重大影响。就是消费者心中会产生一个可接受的价格区间，定位其区间，就认为是合理价格。


    比如：我们出一桶矿泉水，客户觉得 2 元可以接受，有些 3 元可以接受，有些最高 5 元可以接受，有些 1 元可以接受，我们去取一个最大的，价格区间，然后定价
    2.5 元。这就是合理价格。 大多数人都能够接受的市场价格。


    同样目标消费群的消费行为与态度，消费者对价格和价值的看法（如：物美价廉，值得为品质多花一点钱），消费者消费能力及对生活品位的要求都会影响定价高低。


    +   3，供求关系 产品种类，市场竞争等。


    对具体差异性，独特性的产品，消费者在购买时，并不特别注重价格，因为消费者的需求主要受到产品属性心智认知的影响，因此可定高价。


    比如：酸奶 VS 牛奶。 VS 高钙奶。 高钙奶比他们价格都高，而且量还很少。


