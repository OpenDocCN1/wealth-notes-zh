    ## 卧龙营销咨询《布局策略》：内部资料


    比如：一款生菜豆浆。可如此介绍：该款豆浆是美国娱乐界巨星麦当娜的瘦身秘方。生菜含有大量植物纤维，清肠养胃，是减肥佳品，所以麦当娜把生菜切成细条，然后与泡好的黄豆一起放进豆浆机搅拌，从而捧上一款无上瘦身妙品。有名人饮豆浆的故事做背书，相信会刺激消费者购买热情。


    5，干活像推土机那般——单爞到极致，一栋楼，一栋楼精细推广，做好免费品尝，争取客户覆盖率达到70%，提高送货效率。


    6，节前后适当赠送新款豆浆饮品或小礼品，持续与消费群进行情感沟通。


    李明具体如何打开渠道，销售的那？


    傍晚下班，李明在一栋楼5单元6层居民楼前，先请楼里居民免费品尝现磨豆浆，如果大家觉得好喝又便宜，行，每座单元选一户“送货组长”，小明骑电动车把豆浆直接送进组长手里，由他负责单元里面送货。钱？日结，周结。。。组长好处？利益均占。


    由此，这栋楼相当于有5个组长，当然，组长最好选退休老大爷老大妈，他们起的早，热心肠。


    现在早上只要敲开5户人家的门，也许最多能卖6（层）×5（单元）×2户/单元/层×2杯/户=120杯。


    从第一栋楼开始扫荡，接着是一栋楼，一栋楼开发，就有办法覆盖住小区消费群，效益就来了。


    如果销售渠道覆盖几个区，那么每个小区可选出3位区长，每栋楼在增设一位楼长，送货先送到区长手里，由他们分送给各楼长，楼长分配组长，组长分配用户，于是在销售系统里形成了区长是经销商，楼长是分销商，组长是是终端这样三级分销体系，各有各的分工，各赚各的利益。


    这样，送货问题，渠道问题就解决了。


    那么如何发挥渠道优势？分钱布局，让项目可持续？


    1，为渠道和消费群提供返利政策。这样能拉动渠道和消费者长久持续的消费和合作。好处？


    - A，为了面对可能出现的竞争对手，提前巩固消费群。

    - B，刺激渠道分销热情，保证豆浆按时送达。

    - C，拉动消费者购买热情，养成喝豆浆的良好习惯。


    ## 卧龙营销咨询《布局策略》：内部资料


    2，利润框架：假设每天供应 1000 杯子豆浆，年利润 1000 杯/天 X0.8 元/杯子（薄利多销的利润）X230 天/年（全年工作日）=18 万元。


    3，我们每年可以抽取盈利的 10%作为取得返利


    如：为渠道商提供免费豆浆+年底红包； 同时再抽取盈利 10%奖励消费群，比如：发放抽奖券，赠送新款饮品或卡通公仔等。


    4，事事都打情感牌，是社区营销精髓所在。渠道返利固定需要，但情感投资更为需要。


    稍微分析便可得知，愿意当区长，楼长，和组长的消费者并不缺这份红包或免费豆浆，他们乐意奉献自己的余热为大家服务；并享受那份助人为乐的快乐，这是招募渠道商能成功的关键所在。


    所以招募时,要强调“这是一份助人为乐的工作,跟赚钱无关,跟帮邻里街坊一个忙有关。”这里要考虑到人情，人性。 而不是单纯利益驱使。


    ## 二，制定接地气的销售策略


    套餐式预订——目标细分法的运用。 接受预订存在两个问题：


    - A，早上根本来不及接电话

    - B，如果每周都是临时决定是否喝豆浆，咱们无法控制生产量，会造成缺货或积压。


    建议采用套餐式预订方式：


    - A，两天式（周二，五） B，三天式（周一，三，五） C，五天式（周一-周五）。每天晚上根据数据统计做好第二天生产量。


    采用三餐预订方式，好处有三：


    - A，杜绝零星购买，方便配送

    - B，假如居民原先早餐每天喝牛奶，现在想保留和牛奶习惯，但也想换换口味，可选择套餐式预订，由此，登门槛战术成功。

    - C，五天预订供货价可以享受 95 折，鼓励大家踊跃预订。


    周一至周周五送早餐，周六，日送不送？ 家家户户起床时间千差万别，豆浆凉了再热会导致口味损失。


    此外未送的豆浆存在哪里？


    休息日组长万一家里出门办事，怎么办？


    都是问题，建议前期先从简单做起，只做工作早餐。 非工作日，不送。


