    没钱的话，可以分期。 大大满足了年轻人没资金的需求。


    客户可以很多没有关系，确定一下不同区域当地人口与习惯是否是我们的潜在客户也是很有必要的。确定之后；然后才能有方向的去推进筛选精准客户。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_78_0.png)


    如图：


    核心客户：是我们的金牌客户，在特定时间，购买最多的1%用户，若总数为1000人，则核心客户为10名。


    重要客户：消费金额最多的5%客户中，除去核心1%后，假设所用1000人，出去核心，则花钱最多40名。


    普通客户：购买金额20%中，除去核心和重要，则以1000人计算，花钱最多的150名。


    除去上面3种客户，剩下80%的为小客户，大客户20%却占了80%的利润。


    所以我们了解了客户层级分布之后，下一步实施客户导向模式，针对客户价值设计配套的客户关怀项目。


    对核心客户进行定期拜访和问候，确保重要客户的满意度和忠诚度，借以刺激有潜力的客户升级更高客户层，这样，将使得我们企业在成本不变情况下，产生客观利润成长。


    而对于垃圾客户，直接清除世界。永久性拉黑。


    市场化运作过程中，20%的人创造80%利润，而20%利润是80%的普通客户。


    想要创造更多利润：我们应该把焦点放到20%的顾客身上！切记，切记…


    为何选择20%？


    1，20%顾客不差钱，对钱没感觉，对产品价值有感觉。80%对价值没感觉，对钱超有感觉。


    2，高端客户转介绍，全是高端； 低端客户转介绍全是低端，要么良性循环，要么恶性循环。


    3，顾客只有被区别对待，才会有不同的利润。


    一定要制造落差：想让客户十倍以上支持，就要对客户十倍以上落差区别，你想顾客感觉他跟所有都不一样，他就会反过来支持你，让你跟所有都不一样。


    凡是在江湖上混的不好的，都是不懂落差区别营销运用。


    企业 3 大核心资源：人，钱，时间； 营销最大智慧就是把有限的资源创造最大的利润；


    客户导向模式，不需要 100%满意所有客户，只需要维护好能给企业带来更多利润的那一批。 因为其他 80%会占用太多资源，而使得企业疲惫不堪！


    定位附属：我们定位客户之后必须要做的一些事情。


    【客户关系】即公司同消费者群体之间所建立的联系，我们所说的客户关系管理与此相关。


    简单讲，你可以通过微信，电话，短信，QQ,等产品比较高的沟通工具，链接消费者之间的关系。


    【客户分类】6 类：


    - * 核心客户

    - * 重要客户

    - * 普通客户

    - * 小客户

    - * 潜在客户：有意向购买，因为各方面因素迟迟没有付款行动。

    - * 垃圾客户：直接清除世界。


    聚焦服务核心客户，维护提升普通客户和重要客户为核心客户，潜在客户进行促销刺激为小客户和普通客户，垃圾客户直接清除。


    根据不同的层级划分，制定不同的服务流程提供公司效率和转介绍；


    ## 何为垃圾客户？


    - 1，没有钱   2，不讲信用 3，应收账款拖欠 4，很小的客户，付不起钱


    这些直接删除。


