    很多策划大师非常注重品牌名称，他们通过市场调研：发现一个有趣现象：拥有一个好品牌名称，相当于成功 30%。


    http://www.iqivi.com/v_19rrhdkoss.html 课后各位一定抽时间看一下这个视频。


