    ## 卧龙营销咨询《布局策略》：内部资料


    2017 年 8 月 14 日 下午分享内容


    做策划营销 10 多年，我感受最深的就是，人最难转变的其实是思维方式，而不是技术，策略。


    好多简单的思维，道理，很多人怎么也转变不过来!


    比如：先舍后得，卖好处，接触风险；设立门槛，分钱等等。多半人只懂字面意思，而没有尝试真正去用，人最难的就是改变思维这一点，而技术只要你肯花时间，却是谁都可以学会的。


    学道-悟道-证道-得道。 重复。循环上升。


    - 1，初步了解（僵化接受）

    - 2，重复不断重复（固化学习知识）

    - 3，开始使用

    - 4，融会贯通

    - 5，再次加强（优化为自己所用）


    多数人都被表象迷惑。


    学了很多，看似懂了很多道理，你让他写一个策划案，落地，他根本无法落地。 然井软，嘴上一套，做起来，又是一套。 根本就是纸上谈兵。


    对于学习，要想真正有用，务必符合三个条件：


    1、简单。


    只要复杂，就无法落地，唯有简单，才能使用。 试问：你过去所学一切是复杂还是简单？


    不得不说，很多大湿的理论，我根本都无法用，因为太概念化了。——大道至简。


    复杂就是外围，就是表象，就会被迷惑。反而给人一种高深莫测，神秘的感觉。


    简单就是核心，就是根本，就能入实相。


    2、实用。


    实用的前提是使用，他都没使用，让你使用，你不就成为了炮灰，不就被带导向里面去了吗？


    所以找一个实战的圈子是非常关键的。 比如：如果史玉柱开一堂营销课程，我非常愿意报名。


    但是如果 是秒哥，我市调了一下秒哥的经历，发现他就是培训起家，那不如不报。


    无数人就是被这么“害死”的，走火入魔，就是成为了邪见的殉葬品。


    ## 3、有效。


    有效的前提是使用后有结果，他自己都没干出结果，他教你能让你有结果吗？


    一句话总结:线上学习有效的核心是学会了一套程序，流程，具体步骤。


    如：思维程序、操作程序、成交程序，引流程序，拓客程序，截流程序，黏住客户程序……


    如果程序有效，可供你参考。

    如果程序无效，会死机奔溃。


    这就是无数人努力学习，不仅没有结果，还越学越迷茫，越学越困惑，越学越傻，越学越呆，根本就在于你学了个让你奔溃的程序。


    线下学习生成的是体验，获得的是经历，产生的是触动，撞击的是灵魂，最终的结果是让你觉悟、觉醒了。


    人改变不是靠知道，也不是靠你懂，而是靠觉醒；能够真正深度理解，并举一反三；去测试，落地。


    人生有三大风险：


    - 风险三：跟错人。

    - 风险二：选错伴侣。

    - 风险一：学错知识。


    人生还有一个比学错知识更可怕的就是，错误的学知识。你学了什么，脑袋就会有什么，行为就会显现什么。——你现在显现的一切结果。是过去所学一切的显现。


    我们必须学习，有体验，有程序，才能真正落地。所以各位听了这些课程，就要找一些同行，分析一下，他们的玩法，多做一些破解。 那么才会真正落地。


    因为破局的过程，就是体验的过程。 破局的越多，懂的套路越多，最后可以随意的设计局。


    好了，扯远了。上面都是一些废话。


