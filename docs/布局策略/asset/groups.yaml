    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_170_1.png)\n\n## 线下宣传模式\n\n【POP 海报宣传】客户定位——循序渐进——接触性广告。\n\
    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_171_0.png)\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_171_1.png)\n\
