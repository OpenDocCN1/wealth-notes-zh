    如何规避大竞争对手，让刚起步的你也能快速成为行业佼佼者？


    我们通常采取的战术有 2 个：一个是定位，另外一个是我反复说过的，把握顾客 "情感"的场景设计战术。


    在大市场中细分市场。 "弱者" 最好是主攻 "大市场中的细分市场" .


    举例：我们可以想一下 "咖啡" 这个大的关键词，范围是不是很大，那么我们要想从最大的范围内取胜的话，就要避开星巴克，普通咖啡，灌装咖啡，UCC 等咖啡界具体的一决胜负。


    跟他们那些有资金，有实力无碍于鸡蛋碰石头，找死。


    那么我们要做的就是向下挖掘 "咖啡" 这个大概念，去创造，去发现 "有机咖啡"，"速溶咖啡" 等被细分的需求。 通过百度指数的搜索，就可以大概市场规模。


    然后再举例：如 "按摩" 这个大的概念 "弱者的战略" 考虑制胜的方法，从那个方向考虑比较好？


    当然我们会想到 "美女按摩" "盲人按摩"，"桑拿按摩" "水疗按摩" "美胸按摩" "壮阳按摩" … 等细分关键词。


    然后我们选定正确的细分领域，这些弱者的战略就直接吸引了上面的明确需求的人。


    为何不全做？


    大概念我们没那么多精力，也没那么多资源，我们关键词变小之后，吸引的顾客可能会减少；但是却可以吸引到明确目的的顾客，而且吸引他们之后把他们变成客户的几率也比较大。


    为何这样做？


    大市场中的很多细分市场，由于需求少和小，所以许多竞争者 "没有注意到"，或者 "故意忽视起存在"。


    类似洗头膏一样：去屑海飞丝。 只是一个去头屑的功能。 后来很多人就开发精油，柔顺，滋润，等主推细分功能。


    在这个夹缝中，如果提供有效的解决方案，就会满足对方的需求。 而且本身客户少，自然


    ## 卧龙营销咨询《布局策略》：内部资料


    可以掌握主导权。（也可以称之为小领域的佼佼者，是做大海里的小鱼，还是做小河里的大鱼？）


    竞争对手足够少，那么几乎就可以独占一个市场。


    不仅仅是找到市场空白进行填补，更重要的能带来足够的购买，客户，利润，这样我们才能持续发展。


    江中集团案例：吃了22 年饼干，江中猴姑推出后我才知道饼干还能养胃；喝了22 年饮料，自从江中蓝枸推出后我才知道饮料还可以养眼，江中集团瞬间秒杀了饼干和饮料的市场份额；


