    如果你猛然发现沙发的材料竟然是：百分之百全铜、进口的西班牙进口云石、那我帮你挖掘出它的时尚、尊贵、优雅、个性、且还有收藏价值，卖 25000 元/套绝对可以。这个时候隔壁老板娘估计都不好意思
    7800 元/套了，因为谁也不信 7800 元/套的沙发会有收藏价值，这就是产品的延伸价值创新。


