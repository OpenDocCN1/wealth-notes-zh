    \ 不伤大雅！ 懂了就懂了】\n\n## 【产品营销故事】\n\n通过讲故事的形式，很容易将产品形象导入大脑，因为人类都是喜欢听故事。 我们为产品包装精彩的故事，能迎合消费者群爱听故事的需求。\n\
    \n一个好故事可以提高产品附加值，抬高职场人身价，为一切平庸打造传奇和亮点；\n\n没有好故事，就没有好价格，就不会有高附加值。故事越精彩，产品越好卖。复制\
    \ LV 包，不然永远是淘宝同款。\n\n一个好的营销都有一个好的故事，把故事通过某种方式转嫁给消费者？ 故事营销是千万种营销方式里的一种。 故事，怎么讲？\n\
    \n一个产品讲故事，至少，先布局，设计框架，准备三个故事 ：\n\n（一）产品背景故事（产品历史，获得奖项，特色，由来（来自法国农场，加拿大奶牛···....））\n\
    \n（二）顾客故事（使用人数，带来的效果，客户真实见证对比，好评......）\n\n（三）第三方的故事（代理商，新闻报道，国家访谈，名人，专家推荐，朋友介绍，意见领袖推荐，专业机构背书（清华研究院，红十字会.）......）。\n\
    \n三个故事+一个理念（包装的概念=品牌定位）=故事型产品策划的核心。\n\n另外，大多数的故事营销，都只有情，没有色——什么是色？色就是心理引导。故事营销，就是“情色营销”！\n\
    \n一定要学会讲故事！ 讲故事=吹牛逼=骗人=造谣=创造情景生活； 不会讲故事的人，是永远不会发财的。\n\n为什么微商 2015 年那么火？\n\n什么原因？\n\
    \n难道真的微商刚开始就那么 good，容易做吗。 什么轻松一个微信赚 100 万，赚几个亿。\n\n一个微信，能赚那么多就是一个故事。\n\n这些做培训的怎么把微商拉到顶峰了那。\n\
    \n很简单就是讲一些故事，某某通过做微商赚多少钱。。。。\n\n+   某某企业入驻微商，业绩暴涨....\n\\- 某某人，入驻微商，业绩增量 30 倍...\n\
    \n通过几个成功故事的打造，顺利的带动了微商的发展。然后他赚了多少钱。赚了培训费几千万。\n\n同样案例：微商刷朋友圈，就是最好的案例。\n\n前提：在你已经建立了足够粉丝信任情况下，并且你给了他们一种你很厉害，很牛逼，很厉害的生活方式。自然很容易成交一大批粉丝。（编故事——收钱——就是这么简单。一天就收了\
    \ 10 几万。）\n\n天天就晒收入截图，晒发货，收货，进货。单子。以及开豪车：宝马，奥迪：……再没事去个星巴克，参加一些会场，跟牛人多一些合影。\n\n\
    瞬间就是在打造一种高逼格的生活方式。\n\n其实很多人买的不是产品，但是你给他的感觉就很厉害。所以，单纯的卖故事，比卖产品还赚钱。\n\n举例：台湾有家饮料公司新推出者一款饮料，销路一直不昜，后来经过营销专家建议，在每包饮料的包装上印上一则动人的，很有诗意的爱情小故事，并将此饮料命名为“爱情饮料”，主打年轻族群；\n\
    \n包装一换上马上吸引众多青年男女，他们边饮料欣赏故事，在朋友圈相互讨论分享，该饮料马上火爆起来；\n\n接着该公司又推出爱情征文大赛，消费者可将自巳的爱情故事投稿，饮料公司从中选出精彩爱情故事印在包装上，该征文大赛引发市场轰动，参赛者踊跃。有些参赛者甚至还做起兼职推销，饮料销量顿时暴增。\n\
    \n这一点是不是与江小白很相似那。其实这个案例比江小白要早 20-30 年。\n\n卧龙营销咨询《布局策略》：内部资料\n\n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_187_0.png)\n\
