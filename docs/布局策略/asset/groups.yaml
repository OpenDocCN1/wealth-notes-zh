    # 5,【低价】低价策略-低价产品，引流用


    比如：做一个宣传展架，写上超低价款。实际很多客单价不只是这点。


    记住：现在实体店坐等顾客上门就是等死的行为！不如让利前端，进行后端成交。


    利用预期目标利润设计引流，即设定好预期完成的利润，并计算好销售额，然后拿出部分利润前置，通过销售额与成交率计算出诱饵产品（获得新客户的成本）的成本。


    还是以案例的方式来讲解，有一家海尔店的老板，每年要投入十几万的广告费，由于地理位置比较偏，加上市场竞争激烈，所以销售业绩一直都很不理想，为了提升业绩，早已想尽了各种方法，依旧无法摆脱现有的困境。'
  - '[PAGE 235]


    # 卧龙营销咨询《布局策略》：内部资料


    现在各城市电器商场特别多，竞争也 很激烈！各种花样的促销层出不穷！


    由于电器产品的利润高低不一，成交一单的平均利润是多少，不方便计算，但是，我们可以运用预期目标利润来设计引流的思路做一个模拟推演后发你的思维。


    我问老板，如果每个月完成 40 万的业绩，利润设定为 6 万，你愿意拿出 1 万元吸引目标客户！他立刻表示同意。


    我接着说，假设平均一个客户在这里购买电器，能够贡献的业绩是 8000 元，完成 40 万的业绩获得 6 万元的利润，你需要成交 50 个客户对不对？他点头确认


    这些数据只是为了好计算才这样设定的！可以根据具体情况来设定由于不知道他的成交率是多少，为方便计算，现在我只能假定有需求的目标客户进店之后，他的成交率能做到
    50%，如果要成交 50 个客户的话，是不是需要吸引 100 个精准客户来进店，了解你的产品？他表示赞同。


    我再分析说，前你愿意拿出 1 万元获取目标客户，通过 50%的成交率和 8000 元每单的业绩计算，需要吸引 100 个精准客户进店，才能够完成预先设定的业绩和利润


    1 万元分配给 100 人，就相当于买进一个目标客户的成本是 100 元，对不对？


    再换一下计算数据，如果以 50 元的成本吸引 1 个目标客户，完成目标业绩的成交率只需 25%对不对？'
