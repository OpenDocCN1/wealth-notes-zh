    # 卧龙营销咨询《布局策略》：内部资料


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_133_0.png)


    如：三星——全球 13 强，只做天下人都喜欢的美的东西。


    三星的核心价值观：做出世界最美的产品。


    策略：全球成立 13 个设计院，500 个设计人员，研究当地人对美的喜好，设计出全世界最美的产品，成为全球最大的科技公司，超越苹果。


    三星都这么玩，还需要再次提醒吗？？？


    房地产建筑物，如绿城，星河湾，成功是因为造出全世界最美的房子。玫瑰园 1600 平米的别墅，1800 平米，1.5 亿。


    不管是什么产品，只要产品卖不出去，核心是产品包装的不够美。


    客户去买东西有预期心理价格，抓住这个价格把包装做到最美，即有最大的销量。


    普通的包装只能卖给普通的人。


