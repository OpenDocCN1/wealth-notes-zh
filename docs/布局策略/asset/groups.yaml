    其实，所有人都可以。只不过很多人不知道怎么去用。怎么落地，更没有体验过，亲身做过事件营销。我们本次课程，也可以算事件营销的一种方式。


    ## 4.【异性引流】


    男人好色，女人也好色。都想拥有自己的男神和女神。


    案例：


    嗨会是杭州私人定制电子商务有限公司旗下的 app 产品。嗨会”帮助更多有时间或有技能的人来实现自己的价值。新技能、新界面、递配对象只需 1 秒。


    产品特色：服务技能多，约逛街、约电影、约骑行、帮递纸条、陪打台球、陪上课......各种奇葩技能


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_234_0.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_234_1.png)


    ## 5.【低价】低价策略-低价产品，引流用


    比如：做一个宣传展架，写上超低价款。实际很多客单价不只是这点。


    记住：现在实体店坐等顾客上门就是等死的行为！不如让利前端，进行后端成交。


    利用预期目标利润设计引流，即设定好预期完成的利润，并计算好销售额，然后拿出部分利润前置，通过销售额与成交率计算出诱饵产品（获得新客户的成本）的成本。


    还是以案例的方式来讲解，有一家海尔店的老板，每年要投入十几万的广告费，由于地理位置比较偏，加上市场竞争激烈，所以销售业绩一直都很不理想，为了提升业绩，早已想尽了各种方法，依旧无法摆脱现有的困境。


    ## 卧龙营销咨询《布局策略》：内部资料


    现在各城市电器商场特别多，竞争也 很激烈！各种花样的促销层出不穷！


    由于电器产品的利润高低不一，成交一单的平均利润是多少，不方便计算，但是，我们可以运用预期目标利润来设计引流的思路做一个模拟推演后发你的思维。


    我问老板，如果每个月完成 40 万的业绩，利润设定为 6 万，你愿意拿出 1 万元吸引目标客户！他立刻表示同意。


    我接着说，假设平均一个客户在这里购买电器，能够贡献的业绩是 8000 元，完成 40 万的业绩获得 6 万元的利润，你需要成交 50 个客户对不对？他点头确认


    这些数据只是为了好计算才这样设定的！可以根据具体情况来设定由于不知道他的成交率是多少，为方便计算，现在我只能假定有需求的目标客户进店之后，他的成交率能做到
    50%，如果要成交 50 个客户的话，是不是需要吸引 100 个精准客户来进店，了解你的产品？他表示赞同。


    我再分析说，前你愿意拿出 1 万元获取目标客户，通过 50%的成交率和 8000 元每单的业绩计算，需要吸引 100 个精准客户进店，才能够完成预先设定的业绩和利润


    1 万元分配给 100 人，就相当于买进一个目标客户的成本是 100 元，对不对？


    再换一下计算数据，如果以 50 元的成本吸引 1 个目标客户，完成目标业绩的成交率只需 25%对不对？


    ## 卧龙营销咨询《布局策略》：内部资料


    再举一个例子，在一家商场的三楼开了一个酒吧，为了提高知名度，发了很多宣传广告，可惜并没有起到很好的效果，生意一直不理想。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_236_0.png)


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_236_1.png)


    ## 卧龙营销咨询《布局策略》：内部资料


    酒吧的环境、风格、装饰都非常豪华，约约的是，为何如此独具特色的酒吧就吸引不来客源呢？


    现在是不是有很多这样的店面都是这样的情况，装修非常好，但是没有什么生意。


    其实原因很简单，传统的广告并不能直接发放到精准客户手上，很容易被市场上各种铺天盖地的宣传所淹没。


    这种店面的引流，也可以运用预期目标利润的低成本诱饵产品（让利客户=买客户）吸引客户进店


    假如老板一个月想赚 10 万，愿不愿意拿出 1 万元的成本吸引客户？可想而知，获得的答案是肯定的假设一个准客户可以为老板每月贡献 500 元的收入，通过计算，只需要吸引
    200 个精准客户进店消费即可。（这些数字是为了好计算，暂定的数据）


    既然老板愿意拿出 1 万元的成本吸引目标客户，将这 1 万元的成本分配给 200 个准客户，每人可以分到 50 元，也就是说，花 50 元的成本，转换成市场价至少
    100 元以上的产品，投放到鱼塘对接精准客户，就能很轻松完成 10 万的利润啦！


    如果只是每月赚 4.5 万就够了，那么，1 个客户只需要为你贡献 250 元的利润，如果你把吸引目标客户的成本降低到 25 元，是不是赚的会更多？


    所以，老板们没有必要每天背着高额的开支等着生意，计算清楚之后完全可以主动出击。


    通过上面的两个案例，大家应该能够看到，运用预期目标利润进行低成本诱饵产品引流的方式，有三个指标是可以灵活控制的成本率、成交金额、和引流产品成本，为了最终达到设定的利润，每个指标都可以测试、监控和调节，投入产出的每一个点都能做到心里有数，再也不需要盲目的做那些不可监控的风险投入了。


