    \n![](img/82a0b1ad286e84bf4928c6e6098d8b1b_2_0.png)\n\n（二）产品和服务只是顾客想要迫切解决问题中 想要得到的答案。\n\
    \n如：沙漠里将要渴死的富翁，对一瓶水的迫切。\n\n如：今年实体生意不景气，很多老板找培训行业救命迫切\n\n普通人一般都随便找个产品，买卖思维。卖了就卖，卖不了不卖。得不偿失。可是，有了这2个思维，找产品之前，定然想的是给顾客想要什么样的答案。\n\
    \n举例1：脑白金\n脑白金仅仅是普通的保健品，但由于保健品竞争很激烈，三株，太阳神，鹿茸…；但是史玉柱却把它变成送礼的方案，使得每逢过节的人都想到这个脑白金，脑白金也异常畅销。\n\
