    成交后端：就是客户终身价值的体现


    客户终身生命价值周期：品牌认知（广告接触）—熟悉品牌特性（了解）——考虑需求（解决方案）——尝试/行动（试用，小规模购买）——使用（好用，长期使用，升级会员）——维持/回报（情感营销/持续价值）——（新品推荐，其他产品，服务）更新/再购买/不购买；


    什么是终身价值？就是平均一个顾客，一周，一个月，甚至一年或者一生在你这里会消费多少钱！


    【震撼分享：单纯只做一次买卖的都是傻逼！】


    简单理解，第一次购买往往是小量的，而且付出的成本很高。其实真正的暴利，都在后端。


    就想小米手机一样，刚开始成本价=免费；直接颠覆手机行业，那么无疑很多人对小米有非常好的口碑，后期升级版手机，就得到了狂热的销量。赚第一次的钱，往往都难以持续。懂了就懂了…


    【客户终身价值：十二大追销模式 （前端免费——中端盈利——后端利润持续——末端裂变引爆）】


    记住：不是所有产品都是拿来赚钱的，前端一定要学会让利，锁定途径，路径，消费方式，一定要让消费者占便宜。


    第一次成交之后继续第二次，第三次，第 n 次…


    ## 1，再销


    很简单，就是买了一个产品，再卖你同样的产品，这对于重复消费，非常有效。因为产品经常用。如：美容产品，食品等，进行再销，就是再次销售同样的产品。


    ## 2，增销


    增销就是买了一款产品，继续推荐更高级别的产品，如买了 iphone4，推荐 iphone5，6。升级版，至尊版，豪华版。


    如：同一款产品，有 2 个版本。一部分会买高级别本，利润高。


    举例：一个人看了一套房子，先生，还有一套房子，你看一下，跟这个户型差不多，价格比这个每平方高 1 千元，我们先去看看。然后有一部分人就会选择看下。这就叫增销。


    ## 3，减销


    卖他一个高价版本，他不喜欢，然后试图卖他一个低价版本，他买这个 iphone6 觉得贵，没关系，你可以买 ipnone5，然后试图降低成门槛，促进成交。（最大原因是钱的因素没买高版本）


    ## 4，跨销


    客户买了 A 类产品，然后试图卖他 B 类产品。如：客户买了面膜，当然还可以推荐香水，或遮阴产品。


    ## 5，搭销


    客户买了 A 产品，然后动说低价去买 B 产品。比如：客户买了香水，然后我们说，我们这边有促销活动，买了香水的客户，就可以用半价购买面膜或其他产品。


    这就是典型的搭销，因为你买了 A，所以 B 可以减价，可以减多少钱，可以打多少折，这就是典型促销。这个方法，思路非常巧妙，很有效果。


    ## 6，赠销


    你买了 A 产品，B 产品可以免费送你。但是不要认为 B 产品是免费赠送的，因为免费赠


    ## 卧龙营销咨询《布局策略》：内部资料


    送，是有价值的，B产品的利润实际上在A产品上就体现出来了，买了A可以免费送B和纯粹买A，这个主张更有诱惑力。（当然，也可以送一些更高级别的试用产品，引动增销）


    ## 7, 捆销


    A和B捆绑在一起多少钱，A和B不可以单独购买，只能捆在一起，这个时候会非常吸引人，这就是套装或套餐，现在很多套装销售方案，非常有吸引力，中国移动和中国联通就是卖套餐的。


    如：万能工具箱。 肥皂+毛巾=5元。


    ## 8, 锁销


    客户买了一次，就锁定一年，2年，甚至十年，如：中国移动，联通，手机免费送，只要签约时间合同，当然这一段时间就不能换了。锁销采用买一次，锁定1年，甚至更长。如：杂志订阅
    今年交240元，给你12月每月1份。分期付款，他已经买了你的，不可能卖别人的了。


    或者是充值卡，打折卡，积分卡，满1000消费，送2000元。


    锁销是推销的终极目标，如果能把一个客户锁住，能够赚未来的钱，是每一个人 doll 应该好好琢磨的事情。


    ## 9, 紧急追销


    客户刚买了一个产品，转身卖他另外一个产品。如：客户买了一块防晒霜，我们说：还有一块帽子和墨镜因为在做活动，可以以5折购买，你可以看看。


    ## 10, 连环追销


    就是客户买了A，然后你可以卖B，B他说要，然后你可以再推C，他说还要你在推D。


    如：客户买了鞋子，你说还有套服装这个鞋子很很配的裤子，然后继续卖上衣，帽子，皮带，眼镜。


    建议：不要超过3个，人容易烦。


    ## 11, 裂销（分销）


    通过利益让客户成为合伙人，推广者，分享者（砍价、分享返利，分享有礼...），代理商，加盟商，区域负责人，进而进一步让其推广，裂变，更多客户，让他收获一份兼职事业。


    ## 12, 渠道（代销）


    一定要学会，让 100 个人帮你赚 10000 人的钱。把的产品铺设到各大超市，门店，万达，药店，餐馆，出租车司机，飞机场，书店，还有线上大咖，大众点评，亚马逊，京东，墓掘网，58
    同城，赶集，百姓，贴吧，等这样的高流量平台。对接各种能为我所用的渠道，只要有人的地方，就会有需求，找出更多人群所在的地方，找一些渠道进行链接。找到节点，事情就事半功倍。


    ## 13, 层销


    通过把客户分为 A（潜在客户），B（第一次购买），C（普通客户），D（中级客户），E（高端客户），F（大客户）；G（拉圾客户）——直接放弃，扔掉；


    对潜在客户：让其试用，免费，体验，成本价销售，成本价锁定，引导第一次消费体验。


    对于一次客户：跟踪，定位，筛选，让其减价，分期，折扣，促销，反馈，升级，到普通客户。


    对于普通客户：经过价值培育，解决方案，疑虑，痛点，进行升级再造。让其到中级客户。


    对于中级客户：通过灵魂价值，信念价值，追求个性，定制，私人护理，私密，礼仪，荣耀，成就感，等进行洗脑植入，到高端客户。


    对于高端客户：对于再教育，让其成为利益共同体，精神共同体，事业共同体，发展为铁粉，合伙人，代理人，加盟商，负责人，股东，众筹等多重方式。引导大客户长期战略。


    对于拉圾客户：直接拉黑，杜绝浪费时间，精力。把更多时间用在能创造效益的精准目标客户身上。


