    # 6，回扣


    回扣是在特定时期内对产品购买者提供现金返还。进而刺激需求而进行简单价格减让策略。


    比如：每个返 400 元 年底全返。


    单元组合套餐设计：


    +   1. 同类产品捆绑折扣让利 如：产品单价 18 元/个 ， 买 3 个 45 元省了 9 元。


    +   2. 同样捆绑赠送如：单价面包 5 元一个，买 2 个送一个！ 花 10 元买了 3 个。


    挖掘用户需求，并提供组合套餐解决方案。如：卖杯子单独卖，当然是卖不好的。


