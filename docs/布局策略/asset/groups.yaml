  - '[PAGE 78]


    客户可以很多没有关系，确定一下不同区域当地人口与习惯是否是我们的潜在客户也是很有必要的。确定之后；然后才能有方向的去推进筛选精准客户。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_78_0.png)


    如图：


    核心客户：是我们的金牌客户，在特定时间，购买最多的1%用户，若总数为1000人，则核心客户为10名。


    重要客户：消费金额最多的5%客户中，除去核心1%后，假设所用1000人，出去核心，则花钱最多40名。


    普通客户：购买金额20%中，除去核心和重要，则以1000人计算，花钱最多的150名。


    除去上面3种客户，剩下80%的为小客户，大客户20%却占了80%的利润。


