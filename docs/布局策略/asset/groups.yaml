    (8).商业模式设计模型\n(9).品牌打造与品牌战略模型。\n(10).借势与造势模型。\n(11).品牌形象打造与定位。\n(12).产品营销模型。\n\
    (13).广告文案与传播途径模型\n(14).渠道模型设计（分销）\n(15).招商模型\n(16).团队管理机制\n\n今天我们主要学习这些内容。 一个完整的产品经理必须要学的基本路线。\n\
    \n万能的赚钱原理：赚钱是很容易的事情，核心是改变观念掌握方法和原理。\n\n当你对这些原理了如执掌，你很容易把生意架构起来，而不是单纯的卖货思维。 技术壁垒可以找人攻克，如果没有运作原理，即便再牛逼的技术，也不知如何运作。\n\
    \n那么，赚钱最关键的原理是什么？\n\n一个身价过亿的老板对我说：为别人解决难题就能赚钱，把自己擅长的事情市场化就会赚钱！\n\n## （一） 赚钱就是帮助给钱的人提供解决问题方案\n\
    \n简单理解：人性之所以购买某些产品和服务，就是因为想要解决自己的问题。 比如：病痛问题，赚钱问题，生活问题，情感问题，婚姻问题，幸福问题，贪欲……\n\n\
    【问题=项目】 在 2015 年很多人虽然知道微商，但却不知道怎么具体来做。 然后我跟一个小伙子讲，其实很多人很盲目做这些事情，你不如你来做，高一些培训。\n\
