    # 卧龙营销咨询《布局策略》：内部资料


    对于第一种目标细分产品定位：可以称之为“顶尖美发师就业班收费 6980 元/名”


    对于第二种想创业的目标细分产品定位：可以称之为“美发店年入百万创业班收费 10900 元”


    【产品宣传页】宣传样本 1：纯粹以技术培训为宣传点


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_139_0.png)


    宣传样本 2：宣传时尚概念，激发梦想。——大多数人 95%选择本页。


