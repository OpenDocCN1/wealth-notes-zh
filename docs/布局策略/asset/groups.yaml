    【产品组合拳的高级设计逻辑：】客户产生购买，信任度的建立是一个逐渐上升的过程。


    产生购买行为最关键的按钮：信任。


    没有信任，人性就不可能产生购买。


    一定要记住这句话！就像很多搞销售的，上去就想强奸客户，很多人感觉很意外。一般都得不到好的待遇。


    1、体验入门产品


    不用顾客承担任何风险，就可以体验到你的产品、服务，降低顾客进入你公司的门槛。


    比如：《免费策略》体验课。或者让你缴纳 100 元或 300 元或者 680 元的场地费的。其实，这些都是体验课。


    # 卧龙营销咨询《布局策略》：内部资料


    目的在于成就更高深的课程。当然，我们这次《布局策略》其实也是体验课。


    又比如：你做餐饮的，你做的砂锅很好吃，但是别人从来没体验过，肯定不会去，除非有人带他吃过一回。


    但是你现在给他一个 50 元产品体验券，让他免费吃一小锅。那么他就会非常愿意去尝试。因为没有门槛，谁都想占便宜。


    当他去体验了，发现真的不错。下一次她如果请客，一定会来这里。


    要知道客户来这里，不可能只吃 50 元砂锅吧。他一定也会点其他东西吃。当然这个成本钱，也会赚回来。


    如果你想着刚开始，刚开业就想赚大钱。就是因为不舍得，所以往往最后大钱没赚上，反而赔钱了。


    # 2、明星主打产品


    什么是明星主打产品。就是说你这个东西，是店里的招牌菜，卖的最好，最火。价格也适中。利润还可以。就属于爆款。比如：壹贫资本的 7900 元的《资本策略》这个销量是最大的。


    # 3、公司利润产品


    其次在升级到利润产品。就是说，这款产品利润更高。产品质量也有保证。更加差异化从明星产品客户中，再次筛选一批有实力购买的人。比如：《资本智慧》定价 39000
    元。


    # 4、核心能量产品


    比如：弟子班，事业部，合伙人....这个就是建立利益共同再次筛选的过程。而不是单纯的看中利润了。


    # 5、增值服务产品


    比如：帮助学员落地的一对落地服务班。团队打造班。等都是增值服务产品。再一次延伸利润链条，套餐链条。如：做健身


    - 1、体验入门产品（免费体验课）

    - 2、明星主打产品（幸福家庭卡）

    - 3、公司利润产品（私教课）

    - 4、核心能量产品（VIP 顾客私人订制）

    - 5、增值服务产品（家庭旅游、亲子活动等）


    # 4，【产品竞争策略】


    思考：竞争情报-整理分析-企业决策


    收集竞争对手的经营策略，销售趋向，新技术开发，市场占有率及资讯状况等情报的搜集和研究分析，为企业提供竞争情报服务。并拟定战胜竞争对手的战略策略，使得我们公司在市场竞争中立于不败之地。


    竞争情报进行筛选，收集，阐释和传播。


    - 1，为企业产品创新指明方向。

    - 2，为企业的市场营销寻找恰当的切入点。

    - 3，技术变革的动向。

    - 4，提供预警机制。

    - 5，锁定主要竞争对手。

    - 6，实施模式管理的基础。

    - 7，明确盈利的坐标，提供竞争动向。

    - 8，维持盈利的优势地位。


    情报规范：


    市场的竞争，看似是产品的竞争，有时候，就是信息的竞争，谁能获得最新的讯息，谁就掌握了致胜的法宝。


    - 1，以顾客为核心研究。

    - 2，选取合适的类数据供应商。如：快递送货量，供货商...

    - 3，透过竞争情报制定具体的经营策略，而不是抽象的研究报告。

    - 4，重视团体的集体智慧。运用头脑风暴，避免一叶障目，学会利用团体智慧。

    - 5，注重情报人才的培育。

    - 6，保证情报的时效。获取，加工，传递，利用整个过程，时效性很重要。指信息存在的价值是有时间性的，在有效时间发挥才有意义。


    # 卧龙营销咨询《布局策略》：内部资料


    竞争相关联信息：


    - 1, 竞争环境情报主要关于政治, 经济, 技术, 自然情报。

    - 2, 竞争对手的专项情报。


    （1）企业基本情况：公司地址, 联系方式, 性质, 业务范围, 法人, 注册资本, 股权分布, 关联机构等。


    （2）企业背景：关系, 股东资料, 重大事件, 政界支持等。


    （3）公司核心产品的研发, 生产与销售情况：性能价格比, 功效, 技术领先性, 生产目标与现实生产能力, 销售额与销售政策。


    （4）公司发展目标和战略选择：计划, 利润目标, 主战略模式, 成本领先, 还是技术领先。如：整体年全面促销计划, 新产品资料, 销售低价, 上市时间, 重点投放市场区域,
    和促销策略等。


    （5）市场销售：销售额, 销售区域, 重点市场, 库存情况, 客户类别, 数量及分布；营销管理政策与营销架构, 策略；呆死账管理等。


    （6）重点岗位人员情况：姓名, 年龄, 职务, 文化程度, 个性性格和爱好；与主管关系, 家庭背景和联系, 是否明显懈怠和离职倾向等。如：可以去智联招聘,
    拉钩网, 找公司职务诉求。


    （7）财务与资信状况：注册资本与实有资本, 开户行与开户日期, 评价存款余额与信用登记, 企业负债额与曾经获得最大的信用额, 是否有不正当理由拖欠客户应收账款的历史。


    （8）是否有明显不良的公共记录：如：重大产品和服务事故, 不良诉讼, 判决记录, 是否有丑闻负面等。


    （9）根据以上作出针对该目标企业的核心能力, 最短木板, 可能面临的机遇与风险综合分析判断。


    3, 用户与中间商有关情报


    潜在购买需求, 购买习惯与行为特征； 与竞争对手的业务往来, 金额, 结算方式以及自身的数量, 规模与区域分布等。


    # 卧龙营销咨询《布局策略》：内部资料


    4，企业自身竞争状况分析。自评。


    竞争情报收集渠道：除了网络技术，电话采访技术，个人面谈技巧等。还有以下常用策略。


    # 1，公开资料收集


    行业报告，百度，百度百科，报纸杂志....人肉搜索


    # 2,通过竞争对手关联机构


    像有关咨询策划公司，会计师事务所，上下游关联企业，包括一些新闻媒体都是相当有效的情报来源。注意不要越过法律渠道和职业道德，以免不愉快。


    # 3，情报人员通过实地考察与谈话进行搜集


    对于某些企业与某些情报而言，直接到实体访谈，直接是最有效收集方式，只不过无法接触太实质性的问题。所以需要一定素质。


    # 4，建立全员调查制度而广泛开展人际网络收集


    全体员工灌输情报收集意识，情报辨别，对功劳员工进行奖励。


    5，通过其他一些特殊手段收集如：不合法手段，挖公司人员，给于利益。黑客手段,间谍手段。


    面对竞争对手情报：“去伪存真，去粗取精”的过程。


    # 5，【产品活动】


    1，产品炒作活动模式：引导期——预热期——爆发期；


    # 执行营销方式


    确定主题：抢货遇险记！ 抢货话题，百万红包送不停！ 抢货人生！ 抢货漫画，发现场促销款，大促直播。


    手段：病毒视频，YY，微博大腕转发，帖子，微博直播。


    目的：以“抢”引发话题，产生预热。“抢”概念延伸，打造互联网热词。精准人群营销，越热。抢货热点，与品牌相关，抢货节日植入，线上上平台植入。抢货节预热，烘托氛围，建立炒作热点与平台链接。


    针对精准人群，宣传买卖渠道。抢货节相关亮点，好货，供应商直播。


    重点渠道：视频网站，SNS，微博。微博，SNS，BBS。淘宝，阿里巴巴。视频网站，SNS,微博。微博。卖家，电商论坛。PR，官微。


    # 卧龙营销商讨《布局策略》:内部资料


    活动基本方式: “策” 活动引 | 活动主题——活动形式——活动激励——活动发起;


    “策” 动微营销


    - 1、 市场前期品牌状况，我们的营销目标

    - 2、 方式: 新产品上市, 品牌推广, 产品推广。


    活动主题: 1、 行业相关/品牌相关/综合热点话题。 2、 品牌相关/知识普及。 3、 各种创意主题/产品相关 4、 产品促销。


    活动形式: 1、 有奖转发（活动）/扫一扫有礼 2、 有奖转发, 游戏, 应用 3、 晒图片, 写分享, 评论话题, 赢大奖！ 4、 促销信息分享, 对接电商平台,
    线上线下互动。


    活动激励: 1、 高价值礼品 2、 新品体验, 有品牌意义的礼品 3、 与品牌目标受众相关, 精神荣誉, 品牌意义的礼品 4、 优惠券


    活动发起: 1、 品牌 2、 品牌, 达人（与品牌相关的 Dermatology影响力人物） 3、 品牌, 在粉丝中挖掘产品达人 4、 平台发起, 品牌。


    # 卧龙销售咨询《布局策略》，内部资料


    活动营销管理：活动计划——活动执行——活动分析反馈；


    [活动计划]


    - 1、确认采用那些营销活动方案：讲座/演讲；沙龙，行业高端论坛；展览会；付费软文发布；短期促销活动；会议营销，社群座谈；

    - 2 预算+活动目标：目标客户在哪里？建立时间表，媒体，通讯，人员设备；谁可以参加？区域，地位；成本预算。

    - 3，营销活动启动：新闻发布，媒体发布消息，社群发布预告


    [活动执行]


    - 1，确认来会名单和人数，活动宣传：物料，电话，新闻；

    - 2，评估活动效果，确认预期效果。是否达到，成本计算。


    [活动分析] 1，备案，效果评估。


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_200_0.png)


    # 卧龙营销咨询《布局策略》: 内部资料


    # 第 13 节: 广告文案与传播途径


    # 1，【产品宣传工具】


    把产品信息通过各种途径（新闻，平面广告,电视台，广播电台…），工具（微博，微信，QQ，QQ群，论坛,其他 app…），传递出去，展现潜在顾客面前，潜在顾客看了内心自动得出一个结论，你可能有他问题的解决方案，然后主动来找你，比如：访问你的网站、朋友圈、公司，店铺，并搜索相关资料（百度百科，百度知道…），等等。


    # 2，【产品推广文案】


    定位的用户会在哪里出现（什么样的群，什么样的 app 平台，同行鱼塘（店面，渠道，社群…），哪里聚集的最多我们精准客户？）——用户心理分析——编纂文案（原创,复制，杂交，句子，文章…）-测试-发布-优化-大范围推广——死磕执行。


    # 【江湖小案例! ——网络营销案例】


    短小，而精悍。——人性男人好色。喜欢免费。 利益（）。


    群推广案例 1 给你们个骚女 QQ94585XXX 空间很多裸照和毛片哦！可以约她 骚爆了


    # 卧龙营销咨询《布局策略》：内部资料


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_202_0.png)


    宣传内容："给大大家群XXXX 免费看那种片，你懂的！"


    ![](img/82a0b1ad286e84bf4928c6e6098d8b1b_202_1.png)


    重复，重复，死磕，流量 TMD 就这样，一天搞到 500 还是很简单的。不需要太聪明，就需要执行力就好。


    # 3，【产品广告策略】


    广告吸引 3 大疑问：


    - 1, 不知道你一无所知

    - 2, 为什么听你的话

    - 3, 为什么相信你所说


    吸引客户的核心在于彻底打破这三大 “否定” 心理。互联网信息爆炸，每分钟都接触十几


    # 卧龙营销咨询《布局策略》：内部资料


    条广告，人都是趋利避害的，保护自己，采取理性，谨慎对待广告这就是人性。晓得不。


    如何设计一个广告诱饵，应打破 3 大 “否定”，这就是吸引鱼儿的秘诀。可以尝试下面三点；


    对于不知道：通过微信，QQ，QQ 空间，官网，视频，告诉他们你的存在。（设置或找到一个平台，通过工具（微信，QQ，淘宝，百度...）把广告信息传递出去就好。）


    对于不了解：让他们主动咨询你。比如：免费试用仅限前 200 名，无效请拨打 110 举报，详情咨询 QQ94585XX 或加微信 XXX


    对于不相信：建立信任就好。


    【 对于花钱做广告 】举例：花 50 元做个广告，客户看到广告，会有 100 元收入，那么这 50 元差额就是真正利润。而回报率就是 2 倍。


    具体怎么投放？

    百度竞价推广，腾讯一点通（QQ 空间），微信社交广告（朋友圈），联盟推广（各种网站），大咖推广（付费 2000 元），赶集，58 把帖子点击推广...


    通过广告是最轻松的，同时也是最费脑力的。只要能做好付费烧钱推广，几乎不会缺少任何流量。


    先测试。测试成功。一般情况下，测试小额广告不错，增加投资资金可以收到同样效果。


    下面我们要考虑的就是：


    - 1, 使得广告回报率最大（优化）

    - 2, 出现盈利后，将其再投资（放大）


    回报率广告+追加放大投资=楼梯式增长利润；


    看起来是金钱游戏，事实亦是如此。开始一定有质疑和不解，唯有实践了才有发言权。才真正能体会会不到的愉悦。


    这就是史玉柱 “脑白金” - “钱生钱” 躲过亿兆债务危机的法宝。


    【“钱生钱”广告模式：测试广告——树立广告榜样，获得很高的产出回报率——反复再投资】


    # 第 14 节：产品渠道模型


    【产品分销渠道设计】分销渠道：即公司用来接触消费者的各种途径。这里阐述了公司如何开拓市场，它涉及到公司的市场和分销策略。


    不管是采取众募，还是三级分销，还是其他什么分销。


    渠道设计九项目标


    - 1. 顺畅（最基本的功能，以短渠道较为适合。如：厂家直销，线上直接购买） 渠道太多，维护成本高，企业控制程度低 缺点：覆盖面窄 最基本 3 渠道模式：生产商-代理商-批发商-零售商-终端用户；线上渠道）

    - 2. 增大流量（广泛布局，多元化并进，追求捕获率）

    - 3. 方便（最大限度贴近消费者，广泛布点，灵活经营。如：线下体验店，便利店取货）

    - 4. 开拓市场（多着重为经销商，代理商，站稳之后，然后组建自己的网络。）

    - 5. 提高市场占有率（渠道保养至关重要。）

    - 6. 扩大品牌知名度（争取和维护客户对品牌信任和忠诚度。 互联网渠道，微信朋友圈）

    - 7. 经济性（考虑渠道建设成本，维系成本，替代成本及收益）

    - 8. 市场覆盖面积及密度（多家分销和密集分销）

    - 9, 控制渠道（企业应扎扎实实配置自身实力，以管理，资金，经验，品牌或所有权来掌握渠道主动权。）


    一句话：凡是有存在的地方，都可以作为渠道延伸。


    # 第 15 节：产品招商模型 招商就是找钱，找到合伙！


    # 【产品项目融资】


    项目融资，一切项目都必须具备融资优势，方能使得项目有序循环运作。


    - 第一，传统方式可以找银行或金融机构(担保机构)，贷款机构，商业融资…。

    - 第二，投资者，资本人。(朋友,私募，红杉资本,天使投资… )

    - 第三，众筹平台。(点名时间，QQ 自众筹，微信自众筹…)


    # 【众筹？】众筹只是可以筹钱吗？ 筹资 1000-10000 元资金，可以迅速获得 100-1000 个员工，


    直接拉你干活，一起分钱。众筹筹钱是 1.0 玩法，


    2.0 玩法就是不但筹钱，还可以快速获得大批免费打鸡血员工。

    3.0 裂变众筹玩法：分股份，分机制，抱团，再次众筹二级众筹模式，合伙人模式。【内部课堂教学详细】


    - 第四，找你的客户，即是你的消费者。(参股)

    - 第五，同行老板(个人研究的思维模板)。


    - 第六，构建资本估值融资(整合资源扩大资本的价值链，并购多家将要倒闭的店，联营参与上市公司进行估值融资)。


    - 第七，借助上市融资。(借用别人公司已经登录 A 股，B 股进行借助上市)。还有与股份相关


    # 卧龙营销咨询《布局策略》：内部资料


    关的就别说，这是企业老板不得已的融资方式！


    - 第八，股权融资（内部员工股权投资，分配融资。）


    案例 1：【内部融资银行】让员工融资送钱怎么办？


    办信用卡，利用三期（期权、期股、期物）给员工做信用！成立公司把几个骨干员工每人 20% 在右股权，变成股东（个人信用融资《万能资本模式》里的内容）。


    重要财产更名到员工名下，加上收入证明等，员工的身份和地位发生了改变。融到的钱，是老板在用，收入提高以后，员工的收入也会跟着提高。


    内部银行融资用了公司信用（是员工为什么把钱给公司的原囚，相信了公司的信用和实力）。


    内部银行——影子银行——储备银行！


    一定要记住：世界上最牢固的共同体就是利益共同体！


    - 1. 融资最重要的基础是：报告文学和科幻小说（数据+讲故事）。利他的名目。


    [融资催化剂：打造稀缺]


    - 2. 限人！


    - 3. 限额！


    - 4. 限时！（三限——制造稀缺）！


    稀缺的东西才值钱！老板最大的能力就是制造稀缺性的能力。


    # 第 16 节：团队管理


    一家企业真正的成功就是让个人化销售转变成工业化，流程化。


    简单讲：一切行动听流程！


    具体如何落地？


    # 卧龙营销咨询《布局策略》：内部资料


    - 策略 1：将行业前三名销售服务流程拿过来整合修改、为我所用。

    - 策略 2：将公司前三名销售服务人员的其技术，服务程序整理成文字流程。


    靠个人永远成就不了大事。


    如：李阳（疯狂英语）个人魅力比俞敏洪（新东方）的魅力大几倍，然而当俞敏洪团队一起上市的时候，李阳此时此刻是最痛苦的那个人。


    李阳比俞敏洪有魅力，为何成不了大事？就是因为他总是靠自己，不懂得靠别人。


    同样一个人，为什么诸葛亮那么聪明，蜀国最先灭亡？

    因为诸葛亮只相信自己，事必躬亲。从来不用下手，不让手下去思考，去管理团队。


    一个只用自己力量的人，即使再厉害，也是傻逼。


    所以说，不要一个人死磕。学会让 100 个人，去赚 1000 个人的钱很重要。


    李阳就是那么一个自以为魅力中心的人


    一个世界顶级高手在牛逼，能打过 10 个普通级高手吗？ 答案是否定的。


    好了，我们产品模型就到这里。完全结束。明天我们上午讲一场流量，下午讲成交。


    今天的课程就到这里。

