    # 3，【产品广告策略】


    广告吸引 3 大疑问：


    - 1, 不知道你一无所知

    - 2, 为什么听你的话

    - 3, 为什么相信你所说


    吸引客户的核心在于彻底打破这三大 “否定” 心理。互联网信息爆炸，每分钟都接触十几


    # 卧龙营销咨询《布局策略》：内部资料


    条广告，人都是趋利避害的，保护自己，采取理性，谨慎对待广告这就是人性。晓得不。


    如何设计一个广告诱饵，应打破 3 大 “否定”，这就是吸引鱼儿的秘诀。可以尝试下面三点；


    对于不知道：通过微信，QQ，QQ 空间，官网，视频，告诉他们你的存在。（设置或找到一个平台，通过工具（微信，QQ，淘宝，百度...）把广告信息传递出去就好。）


    对于不了解：让他们主动咨询你。比如：免费试用仅限前 200 名，无效请拨打 110 举报，详情咨询 QQ94585XX 或加微信 XXX


    对于不相信：建立信任就好。


    【 对于花钱做广告 】举例：花 50 元做个广告，客户看到广告，会有 100 元收入，那么这 50 元差额就是真正利润。而回报率就是 2 倍。


    具体怎么投放？

    百度竞价推广，腾讯一点通（QQ 空间），微信社交广告（朋友圈），联盟推广（各种网站），大咖推广（付费 2000 元），赶集，58 把帖子点击推广...


    通过广告是最轻松的，同时也是最费脑力的。只要能做好付费烧钱推广，几乎不会缺少任何流量。


    先测试。测试成功。一般情况下，测试小额广告不错，增加投资资金可以收到同样效果。


    下面我们要考虑的就是：


    - 1, 使得广告回报率最大（优化）

    - 2, 出现盈利后，将其再投资（放大）


    回报率广告+追加放大投资=楼梯式增长利润；


    看起来是金钱游戏，事实亦是如此。开始一定有质疑和不解，唯有实践了才有发言权。才真正能体会会不到的愉悦。


    这就是史玉柱 “脑白金” - “钱生钱” 躲过亿兆债务危机的法宝。


    【“钱生钱”广告模式：测试广告——树立广告榜样，获得很高的产出回报率——反复再投资】


    # 第 14 节：产品渠道模型


    【产品分销渠道设计】分销渠道：即公司用来接触消费者的各种途径。这里阐述了公司如何开拓市场，它涉及到公司的市场和分销策略。


    不管是采取众募，还是三级分销，还是其他什么分销。


    渠道设计九项目标


    - 1. 顺畅（最基本的功能，以短渠道较为适合。如：厂家直销，线上直接购买） 渠道太多，维护成本高，企业控制程度低 缺点：覆盖面窄 最基本 3 渠道模式：生产商-代理商-批发商-零售商-终端用户；线上渠道）

    - 2. 增大流量（广泛布局，多元化并进，追求捕获率）

    - 3. 方便（最大限度贴近消费者，广泛布点，灵活经营。如：线下体验店，便利店取货）

    - 4. 开拓市场（多着重为经销商，代理商，站稳之后，然后组建自己的网络。）

    - 5. 提高市场占有率（渠道保养至关重要。）

    - 6. 扩大品牌知名度（争取和维护客户对品牌信任和忠诚度。 互联网渠道，微信朋友圈）

    - 7. 经济性（考虑渠道建设成本，维系成本，替代成本及收益）

    - 8. 市场覆盖面积及密度（多家分销和密集分销）

    - 9, 控制渠道（企业应扎扎实实配置自身实力，以管理，资金，经验，品牌或所有权来掌握渠道主动权。）


    一句话：凡是有存在的地方，都可以作为渠道延伸。


