    # 卧龙营销咨询《布局策略》：内部资料


    # 2、再次消费的流量（老客户）


    如何让已经购买的客户，经常来？

    如何让咨询但未购买的潜在客户，下次来买？


    +   1、策略：建立数据库(微信，QQ群，手机号(短信)，身份证...)，保持沟通和联系（所有潜在客户：购买，未购买客户进行管理...) 客户系统管理体系。


    +   2、策略：培养习惯


    +   3、策略：代金券模式


    +   4、充值策略：现在办会员，即可免单 锁定客户。


    ....


    8 个常用的再次消费策略。


    # 1.终身服务；


    如：终身免费干洗，终身免费维修，终身免费复训，终身免费....


    # 2.生日送礼物；


    比如：说你今天你生日。送你免费理发一次。

    生日，送价值 20 元蛋糕一个。

    生日当天买衣服，可以半价。


    .....


    这里一定要回访，问候，送上祝福。真情实意，把客户当朋友。而不是总想着赚人家多少钱。


    +   3.举办客户答谢会；


    +   4.组织会员旅游；


    +   5.赠送节日礼物；


    +   6.平时不定期的抽取顾客名给于奖励；


    +   7.消费积分、返利；


    +   8.购物后，及时发送感谢信息，服务反馈情况；


    .....


    对于新客户，我们要不断促销，谈判，促成第一单。而对于购买过一次的，我们之需要让其购买更多。是决定了我们事业是否长久的关键。


    记住：这一核心基基就是我们能为他们提供更多超值，慷慨的回报。不说多少，比竞争对手多一点即可。'
  - '[PAGE 227]


    如何提高客户满意，客户长期成为我们回头客？


    定期与顾客接触联络，通过微信，短信，QQ 均可。


    +   1, 记住客户的名字 记住名字不重要，把握客户需求才是真。


    举例：买了商品 3 天之后。发短信。

    XX 先生，前几天你购买的商品好用吗？ 如果可以，希望听听你评价。


    一星期之后：XX 先生，感谢你的好评。 你的问题，让我为你介绍一下。


    怎么解决。


    赚钱的核心：就是不是说你拥有多少新客户，而是你拥有多少老客户。


    比如：你开一家店，就这么大范围。 曾经很多人都消费过，你却根本没有维护的策略，和方法。


    就那么多人，他是有限的。 单纯的赚一个时间的钱，第二次，第三次人家就不会相信你，不信任你了。


    你即便推出再牛逼的促销主张，我想也不会有太多人去购买你的东西。


    所以，各位多去维护一下客户，多为客户创造价值，才是根本。而不是一开始就想着赚钱。


    这是每个人都应该思考的问题。


    # 苹果手机为什么那么赚钱？


    很简单，其实新买入的并不是很多。 主要靠老客户的口碑，持续升级换代。 iphone1,iphone2,iphone3, iphone4, iphone5,
    iphone6....这个才是持续赚钱的源动力。


    > ——口碑传播的基础在于一定要发自内心，有感而发。'
