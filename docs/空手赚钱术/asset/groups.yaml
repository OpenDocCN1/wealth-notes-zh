    # 常见操作疑难


    还会上涨，将来不希望小李买走它。所以，想让理财师帮助设计一个解决方案。使赵先生 3 年后还能拥有房产产权，而 3 年间，还能收到小李 1800 的名义租金；3
    年后，也不向退还任何钱给小李。


    看上去，房东真是个“铁公鸡”，想“一毛不拔”地赚更多的租金。房子也不想卖，2 倍定金的违约金更不想赔。如果要满足房东的要求，那买家明显要吃大亏。这样的买家谁愿意做呢？


    房东与租客之间，就定金与房产产权而言，的确是个“零和游戏”，房东要产权，就要赔偿定金；房东不想赔定金，就要让产权，似乎没有其他解决办法。


