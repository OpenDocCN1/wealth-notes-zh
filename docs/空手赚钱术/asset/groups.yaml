    （1）无需高额首付，即可立即入住


    “首付”是很多买房人的痛，很多人坚持千年的“省吃俭用”，就是为了积蓄首付款，以便可以入住自己的家。尤其是很多刚入职 3-4 年的普通白领，他们可能有稳定的收入，可以支付月供，却由于首付款不够，也无法圆自己的“家圆梦”，甚至影响到了结婚生子。


    而这种“以租代售”的方式，虽然暂时挂以“租”的外壳，其实质却是“买”为导向。一方面，买家可以及时入住；另一方面，却是真正拥有了“家”的归属感。


    这种零首付方式的，相比于普通房贷首付 20%来讲，大大降低了“买”的门槛，可以吸引大把“无首付、有月供”的年轻家庭。


    （2）月供不高，容易承受


    很多情况下，名义租金都大大低于正常房贷的月供。因此，名义租金对买家造成的经济压力要小得多。


    同时，虽然“以租代售”的名义租金比市场租金要高出 35%左右，但由于其中的三分之一可用于最后购买时扣减房价，所以其实际租金 900 要比市场租金 1000
    要低。


    所以，实际上买家付出了较少的租金，就住到了喜欢的房产。


    （3）预付定金可以起到“强制储蓄”作用


    很多缺钱付首期款的年轻人往往不是因为月薪太低，而是因为开销太大。不成熟的消费习惯及给付家用等支出，导致了“月光族”的队伍逐渐庞大。


    所以，每个月的“预付定金”450 元的支出，相当于强制这些“月光族”储蓄购房款。450 元对他们的压力不大，却可以在 5 年内购房时少付成多。好像公积金的作用一样，变成对他们未来的一种保障。


    （4）免除装修、家具购置等开销，直接进行试住体验


    由于是“二手房”，所以买家往往不必再出钱装修，甚至很多情况下，不必再购置大件的家具、家电。这本身就是一种可观的费用节省。


    同时，由于具有“不满意可以随时搬走”的条款，买家可以拖着“试住”的轻松心情来体验实际的居住效果。不满意就以较低的代价离开——即失去了前面所交纳的所有款项。但这种成本，也远低于真正购入一间不满意的房产所造成的损失。


    “以租代售”相当于“先住后买”，充分保障了买家的自身利益，降低了“悔改成本”。


    （5）心理归属感完全不同


    “这房是我租的”和“这房是我自己的”——这代表了两种完全不同的“表达”语境。有过两年以上租房经历的人，绝大部分都对“租房”有苦难言，对于“买房”则热切期待。


    不仅是因为租房的舒适性差，更重要的是没有“归属”感，常常“任其破烂”。“反正也是租的”这种心理会导致租房内部环境的恶性循环。


    而“以租代售”则打破了“租”与“买”之间的分水岭，使买家从心理开始“认同”房产——毕竟，这将成为他们未来自己的家。


    所以，“这房是我自己的”将导致买家愿意认真维护房屋，甚至花心思布置、整理。


    此外，家庭生活很大程度上与房产相关；所以，心理有归属感的房产会对家庭和睦产生不可忽视的影响。


    （6）巧设期限，绕开 5 年高税规定


    国家为限制炒房行为，制定了“二手房五年内交易要交 20% 的个人所得税”的规定。这条规定实际上也是买家的隐痛——因为房东往往会将这些 20% 的税负转移到买家身上：动辄几万的税费，哪个买家不心痛呢？


    “以租代售”往往可以帮助买家躲过“5 年”限制，买卖双方可以根据“5 年”时期范围来制订合同生效期，避开 20% 的税费——单单这一项，就可以帮买家省下相当于几年的租金！多么吸引人的合作方式呀？


    （7）提前锁定房价，不为房价上涨犯愁！


    近年来，全国范围内，房价涨声一片。根本专家的预期，未来 5 年，房价很难下降；但与此同步，工资却难以水涨船高；哪个普通的工薪阶层者，能忽视“钱变相对值”的焦虑呢？


    所以，“以租代售”恰恰给买家这样的“保障”——合同期内，价格锁定——买家不用再担心房价的变动，只要在 5 年内筹集到首付款即可。这难道不是对买家最大的好处吗？


