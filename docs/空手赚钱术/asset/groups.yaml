    # 附录五：适合“以租代售”的房产10


    “以租代售”是一种销售方式与融资技巧的整合，然而这两点却都不是“以租代售”成功的关键——“找到大多数人愿意买的房子”才是硬道理。


    # 几层的楼受欢迎


    根据某项调查显示：有65%受访者优先选择底层、顶层不考虑；而仅有13%的受访者无所谓。


    为什么人们不愿意选择底层和顶层？


