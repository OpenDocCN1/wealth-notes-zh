    ### 第二章 空赚术快速进阶


    而图书、音像制品是典型的标准化产品，最容易大量复制。


    只有讲座，才能只进行一次销售，就成交大量的客户。


    要不就靠房子来帮你赚钱；要不就靠“人”来帮你赚钱——除了这两种方式，你别无选择。


    我们最喜欢的名言：


    > 世界上最难的两件事，一是把别人的钱放在自己的口袋里；二是把自己的思想放在别人的脑袋里。

    > ——无名氏


    我们可以把上面的警句换为：


    **世界上最赚钱的两件事：一是帮别人的口袋里增加钱；二是帮别人的脑袋里增加思想。**


    第一件事，可以赚到眼前的小钱；第二件事，可以赚到未来的大钱。谁能把这两件事组合起来，并坚持做下去，谁就能获得永续的财富。


    > 财富等于智慧的交换，其它都是这句话的注解。

    > —通夫之道


    你获得的财富与你付出的智慧成正比。就是说，你向越多的房东传播你的“智慧”，你就能获得越多的财富。


    “空赚术”最与众不同的地方，在于突破了把“房产”做为研究、分析、搜索对象的局限，直接把“标靶”锁定于“房东”群体。


    要学习“空赚术”，必须为自己重新洗脸，忘记过去所谓的投资知识，把自己变成一个“空杯”，重新倒入清澈的“通夫之水”。这样才能真正融入这种创造性的投资思维。


    把下面两句话牢牢记住！以后的每一步都需要它们的指示：


    - （1） 全心全意帮房东‘赚钱’；

    - （2） 房东信息库就是你的存款。


    从此以后，你要仔细分析房东这个群体的共同需求，找出最让他们“彻夜难眠”的要害，提供对应的“智力产品/服务”，维持长期关系，反复销售——这就是“空赚术”全部流程的最简概括。


