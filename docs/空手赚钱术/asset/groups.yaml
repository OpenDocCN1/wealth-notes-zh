    # 第一章 空魔术迷览


    房东的房产是沉睡的宝藏，能唤醒它的，只有你的智慧资本。所以，你的现金投资可以是“零”，绝对的“零”；因为，你的智慧投资才是最好的投资。


    智慧这种商品，非常奇妙。它不会被偷，不会被抢；呼之即用，毫无负担。不怕分享，不怕拚格战。只要被别人感性上认可，就可以产生巨大收益。更可以持续增值，打造终身美誉。


    # （2）最容易启动的赚钱机会，在于出租的房产


    很多投资者都只看到“转售”房产的暴利，却忽视了“转售”的长周期。一次转售，耗时三个月，赚3万。一次出租，耗时2周，赚1千。


    你说，哪个划算呢？


    你可能会说，直觉地算：三个月可以成交6次出租房产的交易，最多赚6千啦！当然是“转售”划算，赚钱更多。


    你错了，而且错得很可笑。


    因为你忽视了几个基本的前提：


    +   1. 市场空间。出租的房源信息庞大，远超过出售房产；更容易筛选。从需求方来看，租客也远多于买家。


    +   2. 流转速度。出租的环节少、流转速度快、成交容易；出售的环节多、流转速度慢、成交繁琐。


    +   3. 资金筹措。出租的房产仅涉及租金问题，一般几千元；而买卖则关系到动辄几十万、上百万的资金，交易方怎能不小心谨慎、过程怎能不缓慢、繁杂？如果买家资金不够，还要涉及到银行按揭事宜，则更加麻烦。


    +   4. 沟通难度。出租中，房东顺应的因素少，容易谈判及成交；出售中，房东顺应的因素更多，谈判必定繁琐。


    所以，从多个角度综合分析，你就会明白：为什么沃尔玛可以成为世界500强之首？一个很重要的原因就是，他销售的总是需求大、流动性高的日常用品。


