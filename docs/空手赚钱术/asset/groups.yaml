    ### 可能的顾虑


    房东与你面谈时，最关心的往往不是收益，而是风险。所以，你必须首先让他打消顾虑。


    常见的顾虑就是：


    - (1) 如果买家最后不买了，我需要退还他已经交的钱吗？


    答：完全不用。一分钱也不用退。租房押金根据“租房合同”规定，满租期可退；未满不退。还可扣除一些水电费。


    而其他的首付、每月定金等都给不用退还。因为买家最后不买，相当于违约：这些钱都做为“违约金”补偿给房东了。


    - (2) 如果中途房产升值，我不想卖给买家了怎么办？


    答：除租房押金要退还外。您要把买家已经支付的所有定金（包括首付、每月定金）都退还买家，而且还要增加这些金额一倍的违约金。如果您认为赔这些钱之外，卖了房子还能有钱赚，您就可以选择违约。


    当然，最好的办法，就是您最初不收首付。这样零首付对买家吸引力更大；您悔约时的赔偿金额其实很小。如果房价上涨都不能超过这些赔偿金，那上涨的幅度一定很小，再加上税费，您转卖其实更不划算。


    比如每个月租金里可以扣除 700 元做预付定金，两年后您决定转售给其他人。那您需要赔偿的金额就是 700*24*2=36600。


    如果房价都没有涨幅超过 3 万块，您转售还有什么意义呢？这些钱根本弥补不了所要交的税费。相反，如果涨幅超过这个数，您实际上就值得侮约啦！损失的３万块，跟未来的收益相比，也不算什么呀！


