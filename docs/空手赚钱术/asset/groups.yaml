    # “投资的本质”


    摘自《富爸爸·富爸爸投资指南》


    富爸爸说，“投资仅仅是一个由固定程序、策略和一系列能使人变富的措施组合而成的计划……这一切几乎能保证你成为富翁。”


    “一个能保证你成为富翁的计划？”我问。


    “是几乎能保证，”富爸爸重复道，“这其间仍有一些风险。”


    “你是说投资不是一个冒险而激动人心的过程？”我迟疑地问。


    “对，”富爸爸说：“当然，除非你认了投资就是你想象中的那个样子。不过对我而言，投资就像按照食谱烤面包一样简单无味。我个人并不喜欢冒险，我只想成为富翁。因此我只要照计划、食谱或公式去做就行了。这就是我对我投资的看法。”


    “既然投资就像照食谱烤面包那样简单，那为什么有那么多人不愿意遵循投资程序呢？”我问他。


    “我不知道。”富爸爸说，“我也时常问自己相同的问题。


    我很奇怪，每 100 个美国人中只有三个人是富翁，这是什么原因呢？这样一个致富机会人人平等的国度里，只有少数人成为富翁，这又是怎么回事呢？我想富，可我没钱。因此对我而言，制订一个富有的计划和找出与之相应的方法，然后照着它们去做，这是很自然的想法。你有没有想过，当他人为你指引一条光明大道时，你为什么还要试图走老路呢？”


