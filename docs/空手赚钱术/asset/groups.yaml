  md: "\n## “空手赚技术”：零投资、零风险的房地产空手赚钱绝技\n\n    房东自然会信服你——而不关心你的财产状况；即使你还是一个在校生，也一样可以凭借他们完全不熟悉的高超房地产投资知识来说服他们。\n\
    \n    这就是“空手赚技术”的一个非常重要的优点，完全可以从未富二白起步，凭借你的知识而不是资产，就能赢得别人的信任。\n\n    相反，其他的投资技巧里，房东往往会要求你证明财产状况，甚至会“以貌取人”。\n\
    \n    免费讲座的开销其实也并不大。你只要找到合适的课室即可。一次几百元，可以获得很多顾客线索，耗时又短，其投入、产出的效率较高。\n\n    注意：免费讲座上，最有说服力的手段，就是由已服务过的房东现身说法，谈自己的真实体会。这样的房东，找一个出来，就会极大提升你的会议效果。\n\
    \n### 表 4 讲座一般流程\n\n| 序号 | 项目 | 主要内容 |\n| :--- | :--- | :--- |\n| 1 | 登记入场 | 房东写下姓名及联系方式；领取宣传资料、反馈表、理财师名片\
    \ |\n| 2 | 造势活动 | 通过简单的身体运动来活跃气氛，调动情绪。（最好找其他人来组织集体运动。可以参考其他讲座视频来安排。） |\n| 3 |\
    \ 主题演讲 | 由理财师来讲解基本的房产理财思路。内容要简单、案例要多，多提问。 |\n| 4 | 收尾号召 | 发出找理财师老师免费咨询技巧的号召；或是，直接为收费讲座做广告——邀请有意向的房东当场索取报名表，便于事后跟进。\
    \ |\n| 5 | 事后跟进 | 根据房东留下的联系方式，电话回访，询问其具体需求及建议。 |\n\n### 收费资料\n\n在讲座，你可以顺便销售你自己的收费资料——当然，如果你不知道该怎么做，就备好这些资料，直接变成免费报告好了。\n\
    \n    当然，还有更取巧的办法——就是直接把你操作过的案例汇编成小册子，印刷出售，加上自己的相关分析与点评。不要小瞧这些资料，其实对投资知识匮乏的广大房东来说，这些内容非常具有吸引力。\n\
    \n    有一点要注意，如果你自己没有操作过一些案例的话，开免费讲座也是可以的，但最好不要试图去销售什么案例资料，否则很容易“穿帮”！\n\n    而且，其他地域的案例，也不太适合本地的情况。所以，你必须自己扎扎实实去实践，才能成为这方面的专家，也才有可能出售收费的资料。\n\
    \n### 收费讲座\n\n曾经有一个学员问我们，如何才能在4个月内赚到5万块。我们跟他说，最好的办法就是“开办讲座”。\n\n    只有讲座，才能一次性收费，而无后续繁琐的事；只有讲座，才能无需投入过多本钱。只有讲座，才能只进行一次销售，就成交大量的客户。\n\
    \n    所以，我们给他的建议，就是：\n\n> “用三个月的时间把自己变成‘以租代售’的专家，至少成交10单；用第四个月集中精力宣传你的讲座，用最后一天开课，用最后一个小时数钱！”\n\
    \n    想利用讲座赚钱，你只要：\n\n- 招到50名房东，每人收费1000元；\n- 或者，招到100名房东，每人收费500元；\n- 或者，招到200名房东，每人收费250元；\n\
    - 或者，招到500名房东，每人收费100元。\n\n    ……\n\n    随便你去计算数字。\n\n    如何才能招到这么多人呢？\n\n   \
    \ 一靠你的数据库；二靠广告；三靠传统的推销。\n\n    哪种最好呢？\n\n    各有利弊。所以，你必须综合利用这三种方法。\n\n    首先，根据数据库的名单，打电话介绍——这时，就不要再依赖信件了，因为信件的说服力永远比不上电话；\n\
    \n    其次，在你使用过的最广泛的媒体上做广告；这一点支出是必要的。\n\n    第三，聘请临时的电话推销员。靠高提成的方法来激励他们（无底薪的哟）。比如，正常情况下收费200元，你把它提高到350元；那150元做为提成来奖励推销员。\n\
    \n    那房东的联系电话从哪里来呢？就需要你开动脑筋了，一则直接到网上、报纸上找；另一方面，也可以直接从房产中介手里买……办法很多，关键在于敢于尝试。\n\
    \n### 把三者整合\n\n我们建议把“免费讲座”、“收费资料”、“收费讲座”三者融合起来。即：\n\n1. 通过免费讲座把房东吸引过来；\n2. 在免费讲座上发出号召，请有意向的报名参加收费讲座；\n\
    3. 在免费讲座上同时出售收费资料。\n\n    所以，讲座营销，也是“先送后卖”的逻辑。靠免费把人吸引过来，然后再集体销售。\n\n    当你把这种“钓鱼式”营销手法融汇贯通的时候，无论你未来是否投资于房地产，都可以广为应用——无往而不利。\n\
    \n### 一点忠告\n\n根据我们的经验，我们更愿意在 200 人的免费讲座上，销售 1000 元的收费讲座。\n\n    因为任何群体里，真正会认同你的永远是少部分人，而对于这少部分人来说，收费多少已经不再重要（就是说，价格弹性不高），只要能帮他们赚钱，这点收费其实并不贵。\n\
    \n    而且收费多，自然报名人数会少；所以，你可以提供更加细心的一对一辅导，帮他们提高。\n\n    而且，收费高，有助于确立你的专家地位——就好比：好车总是最贵的。所谓“好货不便宜，便宜没好货”。\n\
    \n    等你在本地的房东群体里确立高端的专业形象与口碑之后，更有利于你开展后续的服务及宣传工作。\n\n    如果时机成熟，你可以专职来做。成立自己的专业“工作室”，以便提供一个更加专业的形象向房东展示。\n\
    \n    当然，你也可以选择把钱投到房产上：买入房产，自己做房东，利用“以租代售”赚大钱。\n\n你了解《超魔力自动赚钱机》的威力吗？请点击立即加入：http://fangshenniuji.cn/chaomoli.html\n\
    \n## 五、 自动流水线\n\n在《房间秘笈》里面，我们倡导：“做得越少，赚得越多。”就是说，你的未来，应该是工作量递减，而收入递增的。\n\n    在那本投资者的入门读物里，我们介绍了几种“归隐术”的方法，可以实现这种赚钱方式：\n\
    \n- 放贷法；\n- 公司法。\n\n    其实，在“空赚术”这种相对自成一体的投资模式里，也有一种技巧，可以让你打造自己的“赚钱自动流水线”。\n\n\
    ### （1）找准伙伴赚大钱——初级自动线\n\n要不就靠房子来帮你赚钱；要不就靠“人”来帮你赚钱——除了这两种方式，你别无选择。\n\n    哪种好呢？\n\
    \n    各有利弊。我们建议你：两种都用。\n\n    一方面，把赚到的钱，做为首付，买入二手房，剩余的办理按揭贷款；通过“以租代售”的方式，高价出租。\n\
    \n    另一方面，随着你业务的增多，你必然需要寻找帮手。把相对繁琐而价值低的工作分给他去做。然后，从低到高，逐渐培养他。\n\n    初期，最核心的工作（比如讲课、签合同、房东信息库）必须由你来直接负责。\n\
    \n    在你的帮手逐渐上轨道之后，就可以直接与他合作，让他去开发客户了。最后，当你认为时机成熟的时候，由他来负责某个地区的开发工作，除了授课和数据库之外的事，都可以由他全权负责。你可以采取股权激励的方式留住他。\n\
    \n    随着你市场地域的扩大，你可以在每个地区都设置这样的帮手。\n\n### （2）构建网络传口碑——中级自动线\n\n我们说过，口碑传播的三大要素：附着方、关键人物、适宜环境。你所传播的“以租代售理财观念”本身具备了“附着方”的特点。你要想快速传播自己的业务，吸引更多的房东与你交易，就必须强化“关键人物”与“适宜环境”两个因素。\n\
    \n    在众多方法中，我们推荐你使用“非正式组织”这种方法来完成“口碑网络”。举例来说，你成功服务了10个房东，并且召开了两次讲座；手中拥有了100个房东线索的信息库。接下来，你发起成立了“聪明房东俱乐部”。邀请你信息库的房东参加不定期的俱乐部活动。\n\
    \n    第一期，你设计的主题是：如何避免把房子租给可疑的人。邀请几个有经验的房东介绍自己的做法。然后围绕这个话题展开讨论。与此同时，你把活动发言精华总结出来，发表在网上及本地报纸上。并注明自己是这个俱乐部的联系人。\n\
    \n    第二期、第三期……以此类推，你可以组织很多类似的活动，在活动中，自然而然地就把自己的业务宣传出去了。而且可以获得很多房东的转介绍。\n\n  \
    \  口碑只有在组织里，才能最快传播；你构建起“俱乐部”这个组织，使之成为传播自己理念的网络环境；随着俱乐部会员的增加，你会很快获得大量的业务——而且都是不需要你自己亲自宣传的。\n\
    \n### （3）公司化管理——高级自动线\n\n如果你很年轻，真的希望可以开办属于自己的公司，体验做“老板”的感觉；那么，我们可以给你以下的建议：\n\n\
    - 自有房产：成立服务类型的公司，专门负责管理出租房产。借鉴自己管理房产的经验，通过规模化的方法培训专职人员来管理（当你至少有 10 处房产的时候，才值得这样做）。\n\
    - 合作伙伴：与合作伙伴成立公司，统一运作原来的咨询、讲座等业务。以公司的品牌来推广。\n\n    在《房神秘笈》里我们强调过，公司化运作与个人单干，有很多不同的地方，需要你重头学起。也不是我们在这里能教的内容。\n\
    \n    从一个机会入手，你会发现更多的机会。所以，你现在可能想不到：在“空赚术”之后，接下去会碰到哪些机遇。但想把业务规模做大，进行“自动化”运作是必不可少的。\n\
    \n    所以，无论你选择何种方式。都需要与人合作，打造自己的团队——这是成功人士的必由之路。\n\n    这也是“自动化流水线”的另一种真谛：与人合作，把价值低的留给别人，自己向更高的层次发展；向更宽的“钱途”迈进。\n\
    \n### 切记：不要自投罗网\n\n![](img/5cf001339d867f196c8691a67eaef937_45_0.png)\n\n千万不要与房东签定某种长期服务的合同。比如，与房东签约，每月收租客交纳的租金后，分\
    \ 10%给你，做为服务费，要求你定期提供智力支持——而不是，“一次性”支付你的“服务费”。\n\n    这类合同是彻底的陷阱，千万不能签定。你不要以为以后可以每个月定期收钱，好像很轻松得意。但你实际上犯了一个致命的错误——“空赚术”不研究房产，只研究人心。这种长期服务，实际上把你捆绑在房子上，三年之内都难以脱身。\n\
    \n    以后，租客有了问题，会第一时间找你——因为是你把“以租代售”介绍给他的。\n\n    房东有了问题，会第一时间找你——因为是他长期“聘请”的顾问。\n\
    \n    你会发现自己陷身在没完没了的琐事之中。不但会耗费你大量的时间，而且会直接影响你的收益。\n\n    百鸟在林，不如一鸟在手。直接把钱拿走，然后就置身事外。是“空赚术”者最明智的选择。\n\
    \n即使你需要与房东培养长期的合作关系，也不需要使用这“长期服务合同”的方式自缚手脚。\n\n    以上，我们讲解了“空赚术”的6步流程：这些流程有些是可以交叉的（比如免费讲座与钓鱼广告），有些是有先后次序的（比如钓鱼广告与持续信件沟通）。但无论是哪种流程，都需要你自身的大量实践去体验。\n\
    \n    然而，你必须放稳心态，明白“量变”与“质变”的相互关系。也许，你在3个月里搜集了100个房东线索，却没有成交一单——这不要紧，因为根据基本的数量规则，你第4个月里，一定会大有斩获。\n\
    \n    所以，千万不要为前期的“缓慢”而气馁，更不能放弃。人生任何事业的发展，都是非线性的，99天里你可能都在爬行，但第100天里就可能一飞冲天——但是，如果你坚持不到第100天，就前功尽弃。\n\
    \n    所以，我们才让你把房东线索数（而不是成交的单纯数）作为自己进步的标尺：因为线索数就是“量变与质变”的指示牌，当你每天都能看到自己的线索数增加时，实际上就相当于你每天看到了自己的进步，成交当然指日可待——成功，只是“线索数再多那么一点”！\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_47_0.png)\n\n### 本章作业\n\n（请你在读完本课程资料第一遍后，再来填写本作业。）\n\
    \n- 请你写下至少三种本书没有介绍过的“吸引房东”与你联系的方法：\n- 房东对你说：“你就是一个骗人的中介。我见多了。”这时你该如何回应？\n- 空赚术中最有价值的环节是：\n\
    - 空赚术中最值钱的工具是：\n- 空赚术中最耗时间的环节是：\n- 空赚术中最难的环节是：\n- 你实践过的“吸引房东”最好的方法是（请在实践 3 个月后回答）：\n\
    \n## 几点寄语\n\n本书截止到此，就把基本的内容讲完了。我们相信，你已经基本明白了“空赚术”的全部流程。\n\n    但是，“明白”是远远不够的：“行动”才是真正的“学习”。\n\
    \n    所以，本节不是尾声，而是起点。\n\n    在这里，我们要向所有的学员发出一些心声，算是寄语，希望你们处于投资的迷茫路口时，可以为作指路之灯——无论你们是否投资于房地产，都可以应用：\n\
    \n### （1）先做智者，再做笨人\n\n当你们处于十字路口，不知何去何从的时候，要加倍小心。尽量搜索信息，反复琢磨——做一个善于用脑分析的智者。\n\n\
    \    但是，当你做出决策之后，就要忘记所有的噪音与干扰，坚持到底：决不放弃；无论是何建议与话谕，都抛在脑后——做一个绝对执行的笨人。\n\n    很多投资者之所以一事无成，不是因为“笨”，而是因为“太聪明”了。聪明的人总想走捷径，最后却往往走上最弯的长路。\n\
    \n    “空赚术”在目前的所有投资技巧里，是你们最合适的选择。所以，你们不要再浪费时间去想办法去“优化”它，甚至想去“推翻它”。你们只需要坚定不移地去实施、去执行，直到达到你们的财富目标。\n\
    \n    无论别人怎样说，你们都不必在意。因为，那些“噪音”的来源者，往往都是不了解情况的人。\n\n    你想了解《超魔力自动赚钱机》的威力吗？请点击立即加入：http://fangshenniuji.cn/chaomoli.html\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_48_0.png)\n\n### 一只手表就够了\n\n> 手表定理：带两只手表也未必能告诉你更准确的时间\n\
    \n    只带一只手表可以很容易的知道现在的时间，那是不是带两只手表就可以精准的确定你刚才看到的时间是正确的呢？答案是否定的，拥有两只或者两只以上的手表并不能告诉你更准确的时间，它只会让你失去对准确时间的信心。当然前提是这两只表时间并不一样。\n\
    \n    手表定理常应用于企业管理之中：\n\n    对于一个企业，不能同时采用两种不同的管理方法，不能同时设置两个不同的目标，否则将使这个企业无所适从；一个人不能同时选择两种不同的价值观，否则，他的行为将陷于混乱；一个人不能由两个以上的人来指挥，否则将使这个人无所适从。\n\
    \n    在房地产投资中更是如此，我们目睹过太多的聪明人，总在寻找快速成功的捷径，总在不断的尝试“新”的手段；却不知道，最好的往往已经在他们手中。\n\n\
    \    所以，你想真正的“快速成功”，就要“一以贯之”——空魔术一定可以帮你！\n\n    切记！你有一只手表，就够了。\n\n### （2）练好直拳，打遍天下\n\
    \n“空魔术”其实是一很简单的技术，或者说是“化繁为简”。比很多技术，如“零首付”、“期权交易”、“转租”……都要简单易学。所以，你不必再去费尽心机的研究其他的技术，只要把“推广以租代售”这一门技术学好，就会受益终身。\n\
    \n    它就相当于拳击运动里的“直拳”，一拳前击，简简单单，却威力十足。反复把这个最基本的动作练好，你就会成为“房地产理财专家”了。自然就可以\n\n\
    ### 投资的本质\n\n摘自《富爸爸·穷爸爸投资指南》\n\n    富爸爸说，“投资仅仅是一个由固定程序、策略和一系列能使人变富的措施组合而成的计划……这一切几乎能保证你成为富翁。”\n\
    \n    “一个能保证你成为富翁的计划？”我问。\n\n    “是几乎能保证，”富爸爸重复道，“这其间仍有一些风险。”\n\n    “你是说投资不是一个冒险而激动人心的过程？”我迟疑地问。\n\
    \n    “对，”富爸爸说：“当然，除非你认为投资就是你想象中的那个样子。不过对我而言，投资就像按照食谱烤面包一样简单无味。我个人并不喜欢冒险，我只想成为富翁。因此我只要照计划、食谱或公式去做就行了。这就是我对我投资的看法。”\n\
    \n    “既然投资就像照食谱烤面包那样简单，那为什么有那么多人不愿意遵循投资程序呢？”我问他。\n\n    “我不知道。”富爸爸说，“我也时常问自己相同的问题。我很奇怪，每\
    \ 100 个美国人中只有三个人是富翁，这是什么原因呢？这样一个致富机会人人平等的国度里，只有少数人成为富翁，这又是怎么回事呢？我想富，可我没钱。因此对我而言，制订一个富有的计划和找出与之相应的方法，然后照着它们去做，这是很自然的想法。你有没有想过，当他人指引一条光明大道时，你为什么还要试图走老路呢？”\n\
    \n    “我不知道。”我说，“大概我还没意识到那是一条成功之路吧。”\n\n    富爸爸接口说：“现在我知道了，为什么对大多数人而言，遵循一个简单的计划却难如登天。”\n\
    \n    “为什么呢？”我问。\n\n    “因为遵循一个简单的计划是一件单调而乏味的事情。”富爸爸说，“人性是很容易对老做一件事变得厌倦无聊的，因此他们总要寻求刺激和有趣的事情来做。就是这个原因，导致\
    \ 100 个人中只有三个人是富翁。他们起初照计划去做，没过多久，就感到这种日子索然无味。于是他们抛开计划，寻找一种能快速致富的魔法。他们的一生都在单调和趣味往返交错的过程中度过。所以他们没有成为富翁。他们不能忍受日复一日地遵循一个简单而枯燥的致富计划。许多人认为，投资致富的过程很神奇，同时他们还会认为，如果计划不够复杂，那就不算是个好方案。相信我，涉及投资时，简单要比复杂好得多。\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_51_0.png)\n\n### （3）被拒绝是好事\n\n无论你多聪明，无论你多有能力，被拒绝都将常伴左右。为什么会被拒绝呢？因为你有一些地方做得不够好。所以，拒绝就是信号，提示你改进的信号。\n\
    \n    我们一般都是这样做的。凡是客户拒绝时，我们必定向一个问题：“您觉得还有什么地方不满意？”\n\n    被拒绝，却不问原因的人是纯粹的蠢人。因为拒绝时，就是客户教你\
    \ 的时候，你多问个问题，实际上就多学了一些知识。\n\n    所谓的经验，就是犯错后才领悟的“知识”。你犯错了，却不学习，那 不是蠢人是什么？\n\n\
    \    所以，如果你养成了多问一个“为什么”的习惯，你将受益终身。\n\n    最后，要感谢所有的学员。因为，你们的行动，将帮助要本书及 本课程不断地优化及更新。\n\
    \n    这是一本活性的、动态更新的书。\n\n    这是一门与大家共成长的课程。\n\n    这是一段你们学习路程的记录。\n\n    这是一次让你们未来值得回首的学习之旅。\n\
    \n    期待你的故事！\n\n## 常见操作疑难\n\n何时该 5% 首付，何时该零首付？\n\n    “以租代售”是以买房、或是租房为参考对象的。其中“名义租金”的参考对象为“贷款月供”及“正常租金”。所以，“名义租金”绝对不能高过“贷款月供”，否则买家没有动力。\n\
    \n    简单来说，以租代售对买家的吸引力：（1）月供低；（2）首付低而首付如果超过 5%，那就很难让买家心动——别忘了，房东收了 5% 的首付，却没有转产权的。\n\
    \n    所以，首付不能太高。\n\n    如果“月供”与“首付”这两个因素都失去了，那以租代售根本就没有意义了！\n\n    如果房东根本不想卖房，又想通过“以租代售”来多赚钱，那么该如何帮他设计解决方案呢？\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_52_0.png)\n\n你 了 解 《超 魔 力 自 动 赚 钱 机》的\
    \ 威 力 吗 ？ 请 点 击 立 即 加 入 ： http://fangshenniuji.cn/chaomoli.html\n"
  mdcn: "\n## “空手赚技术”：零投资、零风险的房地产空手赚钱绝技\n\n    房东自然会信服你——而不关心你的财产状况；即使你还是一个在校生，也一样可以凭借他们完全不熟悉的高超房地产投资知识来说服他们。\n\
    \n    这就是“空手赚技术”的一个非常重要的优点，完全可以从未富二白起步，凭借你的知识而不是资产，就能赢得别人的信任。\n\n    相反，其他的投资技巧里，房东往往会要求你证明财产状况，甚至会“以貌取人”。\n\
    \n    免费讲座的开销其实也并不大。你只要找到合适的课室即可。一次几百元，可以获得很多顾客线索，耗时又短，其投入、产出的效率较高。\n\n    注意：免费讲座上，最有说服力的手段，就是由已服务过的房东现身说法，谈自己的真实体会。这样的房东，找一个出来，就会极大提升你的会议效果。\n\
    \n### 表 4 讲座一般流程\n\n| 序号 | 项目 | 主要内容 |\n| :--- | :--- | :--- |\n| 1 | 登记入场 | 房东写下姓名及联系方式；领取宣传资料、反馈表、理财师名片\
    \ |\n| 2 | 造势活动 | 通过简单的身体运动来活跃气氛，调动情绪。（最好找其他人来组织集体运动。可以参考其他讲座视频来安排。） |\n| 3 |\
    \ 主题演讲 | 由理财师来讲解基本的房产理财思路。内容要简单、案例要多，多提问。 |\n| 4 | 收尾号召 | 发出找理财师老师免费咨询技巧的号召；或是，直接为收费讲座做广告——邀请有意向的房东当场索取报名表，便于事后跟进。\
    \ |\n| 5 | 事后跟进 | 根据房东留下的联系方式，电话回访，询问其具体需求及建议。 |\n\n### 收费资料\n\n在讲座，你可以顺便销售你自己的收费资料——当然，如果你不知道该怎么做，就备好这些资料，直接变成免费报告好了。\n\
    \n    当然，还有更取巧的办法——就是直接把你操作过的案例汇编成小册子，印刷出售，加上自己的相关分析与点评。不要小瞧这些资料，其实对投资知识匮乏的广大房东来说，这些内容非常具有吸引力。\n\
    \n    有一点要注意，如果你自己没有操作过一些案例的话，开免费讲座也是可以的，但最好不要试图去销售什么案例资料，否则很容易“穿帮”！\n\n    而且，其他地域的案例，也不太适合本地的情况。所以，你必须自己扎扎实实去实践，才能成为这方面的专家，也才有可能出售收费的资料。\n\
    \n### 收费讲座\n\n曾经有一个学员问我们，如何才能在4个月内赚到5万块。我们跟他说，最好的办法就是“开办讲座”。\n\n    只有讲座，才能一次性收费，而无后续繁琐的事；只有讲座，才能无需投入过多本钱。只有讲座，才能只进行一次销售，就成交大量的客户。\n\
    \n    所以，我们给他的建议，就是：\n\n> “用三个月的时间把自己变成‘以租代售’的专家，至少成交10单；用第四个月集中精力宣传你的讲座，用最后一天开课，用最后一个小时数钱！”\n\
    \n    想利用讲座赚钱，你只要：\n\n- 招到50名房东，每人收费1000元；\n- 或者，招到100名房东，每人收费500元；\n- 或者，招到200名房东，每人收费250元；\n\
    - 或者，招到500名房东，每人收费100元。\n\n    ……\n\n    随便你去计算数字。\n\n    如何才能招到这么多人呢？\n\n   \
    \ 一靠你的数据库；二靠广告；三靠传统的推销。\n\n    哪种最好呢？\n\n    各有利弊。所以，你必须综合利用这三种方法。\n\n    首先，根据数据库的名单，打电话介绍——这时，就不要再依赖信件了，因为信件的说服力永远比不上电话；\n\
    \n    其次，在你使用过的最广泛的媒体上做广告；这一点支出是必要的。\n\n    第三，聘请临时的电话推销员。靠高提成的方法来激励他们（无底薪的哟）。比如，正常情况下收费200元，你把它提高到350元；那150元做为提成来奖励推销员。\n\
    \n    那房东的联系电话从哪里来呢？就需要你开动脑筋了，一则直接到网上、报纸上找；另一方面，也可以直接从房产中介手里买……办法很多，关键在于敢于尝试。\n\
    \n### 把三者整合\n\n我们建议把“免费讲座”、“收费资料”、“收费讲座”三者融合起来。即：\n\n1. 通过免费讲座把房东吸引过来；\n2. 在免费讲座上发出号召，请有意向的报名参加收费讲座；\n\
    3. 在免费讲座上同时出售收费资料。\n\n    所以，讲座营销，也是“先送后卖”的逻辑。靠免费把人吸引过来，然后再集体销售。\n\n    当你把这种“钓鱼式”营销手法融汇贯通的时候，无论你未来是否投资于房地产，都可以广为应用——无往而不利。\n\
    \n### 一点忠告\n\n根据我们的经验，我们更愿意在 200 人的免费讲座上，销售 1000 元的收费讲座。\n\n    因为任何群体里，真正会认同你的永远是少部分人，而对于这少部分人来说，收费多少已经不再重要（就是说，价格弹性不高），只要能帮他们赚钱，这点收费其实并不贵。\n\
    \n    而且收费多，自然报名人数会少；所以，你可以提供更加细心的一对一辅导，帮他们提高。\n\n    而且，收费高，有助于确立你的专家地位——就好比：好车总是最贵的。所谓“好货不便宜，便宜没好货”。\n\
    \n    等你在本地的房东群体里确立高端的专业形象与口碑之后，更有利于你开展后续的服务及宣传工作。\n\n    如果时机成熟，你可以专职来做。成立自己的专业“工作室”，以便提供一个更加专业的形象向房东展示。\n\
    \n    当然，你也可以选择把钱投到房产上：买入房产，自己做房东，利用“以租代售”赚大钱。\n\n你了解《超魔力自动赚钱机》的威力吗？请点击立即加入：http://fangshenniuji.cn/chaomoli.html\n\
    \n## 五、 自动流水线\n\n在《房间秘笈》里面，我们倡导：“做得越少，赚得越多。”就是说，你的未来，应该是工作量递减，而收入递增的。\n\n    在那本投资者的入门读物里，我们介绍了几种“归隐术”的方法，可以实现这种赚钱方式：\n\
    \n- 放贷法；\n- 公司法。\n\n    其实，在“空赚术”这种相对自成一体的投资模式里，也有一种技巧，可以让你打造自己的“赚钱自动流水线”。\n\n\
    ### （1）找准伙伴赚大钱——初级自动线\n\n要不就靠房子来帮你赚钱；要不就靠“人”来帮你赚钱——除了这两种方式，你别无选择。\n\n    哪种好呢？\n\
    \n    各有利弊。我们建议你：两种都用。\n\n    一方面，把赚到的钱，做为首付，买入二手房，剩余的办理按揭贷款；通过“以租代售”的方式，高价出租。\n\
    \n    另一方面，随着你业务的增多，你必然需要寻找帮手。把相对繁琐而价值低的工作分给他去做。然后，从低到高，逐渐培养他。\n\n    初期，最核心的工作（比如讲课、签合同、房东信息库）必须由你来直接负责。\n\
    \n    在你的帮手逐渐上轨道之后，就可以直接与他合作，让他去开发客户了。最后，当你认为时机成熟的时候，由他来负责某个地区的开发工作，除了授课和数据库之外的事，都可以由他全权负责。你可以采取股权激励的方式留住他。\n\
    \n    随着你市场地域的扩大，你可以在每个地区都设置这样的帮手。\n\n### （2）构建网络传口碑——中级自动线\n\n我们说过，口碑传播的三大要素：附着方、关键人物、适宜环境。你所传播的“以租代售理财观念”本身具备了“附着方”的特点。你要想快速传播自己的业务，吸引更多的房东与你交易，就必须强化“关键人物”与“适宜环境”两个因素。\n\
    \n    在众多方法中，我们推荐你使用“非正式组织”这种方法来完成“口碑网络”。举例来说，你成功服务了10个房东，并且召开了两次讲座；手中拥有了100个房东线索的信息库。接下来，你发起成立了“聪明房东俱乐部”。邀请你信息库的房东参加不定期的俱乐部活动。\n\
    \n    第一期，你设计的主题是：如何避免把房子租给可疑的人。邀请几个有经验的房东介绍自己的做法。然后围绕这个话题展开讨论。与此同时，你把活动发言精华总结出来，发表在网上及本地报纸上。并注明自己是这个俱乐部的联系人。\n\
    \n    第二期、第三期……以此类推，你可以组织很多类似的活动，在活动中，自然而然地就把自己的业务宣传出去了。而且可以获得很多房东的转介绍。\n\n  \
    \  口碑只有在组织里，才能最快传播；你构建起“俱乐部”这个组织，使之成为传播自己理念的网络环境；随着俱乐部会员的增加，你会很快获得大量的业务——而且都是不需要你自己亲自宣传的。\n\
    \n### （3）公司化管理——高级自动线\n\n如果你很年轻，真的希望可以开办属于自己的公司，体验做“老板”的感觉；那么，我们可以给你以下的建议：\n\n\
    - 自有房产：成立服务类型的公司，专门负责管理出租房产。借鉴自己管理房产的经验，通过规模化的方法培训专职人员来管理（当你至少有 10 处房产的时候，才值得这样做）。\n\
    - 合作伙伴：与合作伙伴成立公司，统一运作原来的咨询、讲座等业务。以公司的品牌来推广。\n\n    在《房神秘笈》里我们强调过，公司化运作与个人单干，有很多不同的地方，需要你重头学起。也不是我们在这里能教的内容。\n\
    \n    从一个机会入手，你会发现更多的机会。所以，你现在可能想不到：在“空赚术”之后，接下去会碰到哪些机遇。但想把业务规模做大，进行“自动化”运作是必不可少的。\n\
    \n    所以，无论你选择何种方式。都需要与人合作，打造自己的团队——这是成功人士的必由之路。\n\n    这也是“自动化流水线”的另一种真谛：与人合作，把价值低的留给别人，自己向更高的层次发展；向更宽的“钱途”迈进。\n\
    \n### 切记：不要自投罗网\n\n![](img/5cf001339d867f196c8691a67eaef937_45_0.png)\n\n千万不要与房东签定某种长期服务的合同。比如，与房东签约，每月收租客交纳的租金后，分\
    \ 10%给你，做为服务费，要求你定期提供智力支持——而不是，“一次性”支付你的“服务费”。\n\n    这类合同是彻底的陷阱，千万不能签定。你不要以为以后可以每个月定期收钱，好像很轻松得意。但你实际上犯了一个致命的错误——“空赚术”不研究房产，只研究人心。这种长期服务，实际上把你捆绑在房子上，三年之内都难以脱身。\n\
    \n    以后，租客有了问题，会第一时间找你——因为是你把“以租代售”介绍给他的。\n\n    房东有了问题，会第一时间找你——因为是他长期“聘请”的顾问。\n\
    \n    你会发现自己陷身在没完没了的琐事之中。不但会耗费你大量的时间，而且会直接影响你的收益。\n\n    百鸟在林，不如一鸟在手。直接把钱拿走，然后就置身事外。是“空赚术”者最明智的选择。\n\
    \n即使你需要与房东培养长期的合作关系，也不需要使用这“长期服务合同”的方式自缚手脚。\n\n    以上，我们讲解了“空赚术”的6步流程：这些流程有些是可以交叉的（比如免费讲座与钓鱼广告），有些是有先后次序的（比如钓鱼广告与持续信件沟通）。但无论是哪种流程，都需要你自身的大量实践去体验。\n\
    \n    然而，你必须放稳心态，明白“量变”与“质变”的相互关系。也许，你在3个月里搜集了100个房东线索，却没有成交一单——这不要紧，因为根据基本的数量规则，你第4个月里，一定会大有斩获。\n\
    \n    所以，千万不要为前期的“缓慢”而气馁，更不能放弃。人生任何事业的发展，都是非线性的，99天里你可能都在爬行，但第100天里就可能一飞冲天——但是，如果你坚持不到第100天，就前功尽弃。\n\
    \n    所以，我们才让你把房东线索数（而不是成交的单纯数）作为自己进步的标尺：因为线索数就是“量变与质变”的指示牌，当你每天都能看到自己的线索数增加时，实际上就相当于你每天看到了自己的进步，成交当然指日可待——成功，只是“线索数再多那么一点”！\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_47_0.png)\n\n### 本章作业\n\n（请你在读完本课程资料第一遍后，再来填写本作业。）\n\
    \n- 请你写下至少三种本书没有介绍过的“吸引房东”与你联系的方法：\n- 房东对你说：“你就是一个骗人的中介。我见多了。”这时你该如何回应？\n- 空赚术中最有价值的环节是：\n\
    - 空赚术中最值钱的工具是：\n- 空赚术中最耗时间的环节是：\n- 空赚术中最难的环节是：\n- 你实践过的“吸引房东”最好的方法是（请在实践 3 个月后回答）：\n\
    \n## 几点寄语\n\n本书截止到此，就把基本的内容讲完了。我们相信，你已经基本明白了“空赚术”的全部流程。\n\n    但是，“明白”是远远不够的：“行动”才是真正的“学习”。\n\
    \n    所以，本节不是尾声，而是起点。\n\n    在这里，我们要向所有的学员发出一些心声，算是寄语，希望你们处于投资的迷茫路口时，可以为作指路之灯——无论你们是否投资于房地产，都可以应用：\n\
    \n### （1）先做智者，再做笨人\n\n当你们处于十字路口，不知何去何从的时候，要加倍小心。尽量搜索信息，反复琢磨——做一个善于用脑分析的智者。\n\n\
    \    但是，当你做出决策之后，就要忘记所有的噪音与干扰，坚持到底：决不放弃；无论是何建议与话谕，都抛在脑后——做一个绝对执行的笨人。\n\n    很多投资者之所以一事无成，不是因为“笨”，而是因为“太聪明”了。聪明的人总想走捷径，最后却往往走上最弯的长路。\n\
    \n    “空赚术”在目前的所有投资技巧里，是你们最合适的选择。所以，你们不要再浪费时间去想办法去“优化”它，甚至想去“推翻它”。你们只需要坚定不移地去实施、去执行，直到达到你们的财富目标。\n\
    \n    无论别人怎样说，你们都不必在意。因为，那些“噪音”的来源者，往往都是不了解情况的人。\n\n    你想了解《超魔力自动赚钱机》的威力吗？请点击立即加入：http://fangshenniuji.cn/chaomoli.html\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_48_0.png)\n\n### 一只手表就够了\n\n> 手表定理：带两只手表也未必能告诉你更准确的时间\n\
    \n    只带一只手表可以很容易的知道现在的时间，那是不是带两只手表就可以精准的确定你刚才看到的时间是正确的呢？答案是否定的，拥有两只或者两只以上的手表并不能告诉你更准确的时间，它只会让你失去对准确时间的信心。当然前提是这两只表时间并不一样。\n\
    \n    手表定理常应用于企业管理之中：\n\n    对于一个企业，不能同时采用两种不同的管理方法，不能同时设置两个不同的目标，否则将使这个企业无所适从；一个人不能同时选择两种不同的价值观，否则，他的行为将陷于混乱；一个人不能由两个以上的人来指挥，否则将使这个人无所适从。\n\
    \n    在房地产投资中更是如此，我们目睹过太多的聪明人，总在寻找快速成功的捷径，总在不断的尝试“新”的手段；却不知道，最好的往往已经在他们手中。\n\n\
    \    所以，你想真正的“快速成功”，就要“一以贯之”——空魔术一定可以帮你！\n\n    切记！你有一只手表，就够了。\n\n### （2）练好直拳，打遍天下\n\
    \n“空魔术”其实是一很简单的技术，或者说是“化繁为简”。比很多技术，如“零首付”、“期权交易”、“转租”……都要简单易学。所以，你不必再去费尽心机的研究其他的技术，只要把“推广以租代售”这一门技术学好，就会受益终身。\n\
    \n    它就相当于拳击运动里的“直拳”，一拳前击，简简单单，却威力十足。反复把这个最基本的动作练好，你就会成为“房地产理财专家”了。自然就可以\n\n\
    ### 投资的本质\n\n摘自《富爸爸·穷爸爸投资指南》\n\n    富爸爸说，“投资仅仅是一个由固定程序、策略和一系列能使人变富的措施组合而成的计划……这一切几乎能保证你成为富翁。”\n\
    \n    “一个能保证你成为富翁的计划？”我问。\n\n    “是几乎能保证，”富爸爸重复道，“这其间仍有一些风险。”\n\n    “你是说投资不是一个冒险而激动人心的过程？”我迟疑地问。\n\
    \n    “对，”富爸爸说：“当然，除非你认为投资就是你想象中的那个样子。不过对我而言，投资就像按照食谱烤面包一样简单无味。我个人并不喜欢冒险，我只想成为富翁。因此我只要照计划、食谱或公式去做就行了。这就是我对我投资的看法。”\n\
    \n    “既然投资就像照食谱烤面包那样简单，那为什么有那么多人不愿意遵循投资程序呢？”我问他。\n\n    “我不知道。”富爸爸说，“我也时常问自己相同的问题。我很奇怪，每\
    \ 100 个美国人中只有三个人是富翁，这是什么原因呢？这样一个致富机会人人平等的国度里，只有少数人成为富翁，这又是怎么回事呢？我想富，可我没钱。因此对我而言，制订一个富有的计划和找出与之相应的方法，然后照着它们去做，这是很自然的想法。你有没有想过，当他人指引一条光明大道时，你为什么还要试图走老路呢？”\n\
    \n    “我不知道。”我说，“大概我还没意识到那是一条成功之路吧。”\n\n    富爸爸接口说：“现在我知道了，为什么对大多数人而言，遵循一个简单的计划却难如登天。”\n\
    \n    “为什么呢？”我问。\n\n    “因为遵循一个简单的计划是一件单调而乏味的事情。”富爸爸说，“人性是很容易对老做一件事变得厌倦无聊的，因此他们总要寻求刺激和有趣的事情来做。就是这个原因，导致\
    \ 100 个人中只有三个人是富翁。他们起初照计划去做，没过多久，就感到这种日子索然无味。于是他们抛开计划，寻找一种能快速致富的魔法。他们的一生都在单调和趣味往返交错的过程中度过。所以他们没有成为富翁。他们不能忍受日复一日地遵循一个简单而枯燥的致富计划。许多人认为，投资致富的过程很神奇，同时他们还会认为，如果计划不够复杂，那就不算是个好方案。相信我，涉及投资时，简单要比复杂好得多。\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_51_0.png)\n\n### （3）被拒绝是好事\n\n无论你多聪明，无论你多有能力，被拒绝都将常伴左右。为什么会被拒绝呢？因为你有一些地方做得不够好。所以，拒绝就是信号，提示你改进的信号。\n\
    \n    我们一般都是这样做的。凡是客户拒绝时，我们必定向一个问题：“您觉得还有什么地方不满意？”\n\n    被拒绝，却不问原因的人是纯粹的蠢人。因为拒绝时，就是客户教你\
    \ 的时候，你多问个问题，实际上就多学了一些知识。\n\n    所谓的经验，就是犯错后才领悟的“知识”。你犯错了，却不学习，那 不是蠢人是什么？\n\n\
    \    所以，如果你养成了多问一个“为什么”的习惯，你将受益终身。\n\n    最后，要感谢所有的学员。因为，你们的行动，将帮助要本书及 本课程不断地优化及更新。\n\
    \n    这是一本活性的、动态更新的书。\n\n    这是一门与大家共成长的课程。\n\n    这是一段你们学习路程的记录。\n\n    这是一次让你们未来值得回首的学习之旅。\n\
    \n    期待你的故事！\n\n## 常见操作疑难\n\n何时该 5% 首付，何时该零首付？\n\n    “以租代售”是以买房、或是租房为参考对象的。其中“名义租金”的参考对象为“贷款月供”及“正常租金”。所以，“名义租金”绝对不能高过“贷款月供”，否则买家没有动力。\n\
    \n    简单来说，以租代售对买家的吸引力：（1）月供低；（2）首付低而首付如果超过 5%，那就很难让买家心动——别忘了，房东收了 5% 的首付，却没有转产权的。\n\
    \n    所以，首付不能太高。\n\n    如果“月供”与“首付”这两个因素都失去了，那以租代售根本就没有意义了！\n\n    如果房东根本不想卖房，又想通过“以租代售”来多赚钱，那么该如何帮他设计解决方案呢？\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_52_0.png)\n\n你 了 解 《超 魔 力 自 动 赚 钱 机》的\
    \ 威 力 吗 ？ 请 点 击 立 即 加 入 ： http://fangshenniuji.cn/chaomoli.html\n"
