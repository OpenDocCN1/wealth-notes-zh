    ## 五、与众不同的成功法则


    看了“天才”的故事，你现在应该明白前面所讲的“空赚术”的特性了吧？它的效果突出，绝不是源自“偶然”；而是具有坚实的“成功法则”基石。


    ### 第一章 空赚术速览


    #### （1）吸引法则


    普通投资最容易发出的感叹就是：“房源都垄断在中介手中，如何直接找到房东面谈呢？”


    你其实并不需要主动出击，只要找到房东最经常接触信息的媒体，放出你的“鱼饵”就行！他们会主动上钩。他们会自动提供你所需要的一切信息。你根本就“拒绝”不会遭受“拒绝”。


    你的鱼饵是“免费报告”。“上钩”是因为他们有这种“提高租金多赚钱”的需求。


    > “钱是被吸引过来的，而不是追逐到的”


    上面的这句话，同样适用于“房东”。你贸然给房东打电话，必须会给房东带来打扰，在双方互不了解的情况下，根本谈不上“信息传递”；更谈不上“信任”。所以，“被拒绝”是非常正常的一件事。


    “打电话介绍业务”就是现在很多公司都倍加推崇的“电话营销”手段。这套基于“推销”与“追逐”策略的方法，失败率惊人的高。尤其是在“通讯工具发达、广告信息泛滥”的时代。


    曾听过一则有趣的小故事。一个年轻人问一位智者：如何获得知识与财富。智者说，知识与财富就像两个女人。当你追求“财富”的时候，她反而会弃你而去；而当你集中全力追求“知识”的时候，“财富”就会“妒忌”不已，反而追逐你来。


    “吸引法则”与此类似。你的免费报告就相当于特制的“鱼饵”，把具备某些特征（或具备某些需求）的房东吸引过来。没有任何“拒绝”的事发生。


    > 任何形式的慷慨付出都会为你带来快乐和意外好运。数千年来，许许多多的人都以很少的付出就换来了巨大的成功和财富，他们经常将收入的10%或更多用于他们认为值得付出的事业。这种慷慨付出的态度和行为仿佛在它们周围建立了一个强大的引力场，为他们赢得了远远大于他们所付出的财富。

    > ——博恩·崔西


    这套“钓鱼”的策略，就是“许可营销”的思维。仅钓上来，还远远不够，你必须创建一套数据库，把房东的信息都记录下来，便于跟进及后续关系的开发。


