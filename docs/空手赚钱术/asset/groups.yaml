    # 附录二：房屋转租合同样本


    ## 房屋转租合同


    根据《中华人民共和国合同法》的规定，甲、乙双方在平等、自愿、公平和诚实信用的基础上，经协商一致，就甲方将其依法承租的房屋转租给乙方使用、收益、由乙方向甲方支付租金等事宜、订立本合同。


    ### 一、转租房屋的情况


    1-1 甲方依法承租的房屋座落于\_\_\_\_、房屋设施包括附件《房屋附属设施、设备清单》。


    房屋已书面告知公房出租人/按房屋租赁合同的转租约定/征得房屋出租人书面同意，由甲方将上述承租房屋\_\_室（以下简称该房屋）转租给乙方。该房屋的建筑面积\_\_\_\_平方米。


    ### 二、租赁用途


    2-1 甲方已向乙方出示该房屋\_\_\_\_（租赁合同登记备案证明/租用公房凭证）（编号\_\_\_\_）。该房屋的用途为\_\_\_\_，乙方承诺按\_\_\_\_（租赁合同登记备案证明/租用公房凭证）所载明的用途使用该房屋。


    2-2 乙方保证，在转租期间未事先书面通知甲方，并由甲方按租赁合同的约定取得出租人的书面同意以及按规定报经有关部门核准前，不得擅自改变该房屋使用用途。


    ### 三、转租期限及交付日期


    3-1 甲、乙双方约定，甲方于\_\_\_年\_\_月\_\_日前向乙方交付该房屋。转租期为\_\_个月。自\_\_\_年\_\_月\_\_日起至\_\_\_年\_\_月\_\_日止。


    3-2 转租期满，甲方有权收回该房屋，乙方应如期返还。在租赁合同约定的期限内，乙方需继续承租该房屋的，则应于转租期届满前\_\_个月向甲方提出续租书面要求，经甲方同意后重新签订转租合同。


    ### 四、租金、支付方式和期限


    4-1 甲、乙双方约定，该房屋月租金总计为\_\_\_\_\_\_元。（大写：\_\_\_\_百\_\_\_\_拾\_\_\_\_元\_\_\_\_角整）。该房屋租金\_\_\_\_（年/月）内不变。自第\_\_\_\_（年/月）起，双方可协商对租金进行调整。有关调整事宜由双方在补充条款中约定。


    4-2 乙方支付租金的方式如下：


    \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_。


    4-3 乙方交纳押金\_\_\_\_元，合同期满即归还乙方。


    ### 五、其它费用


    5-1 在房屋转租期间，乙方使用该房屋所发生的水、电、煤气、通讯、设备、物业管理、\_\_\_\_\_\_\_等费用由\_\_\_\_\_（甲方/乙方）承担。


    ### 六、房屋使用要求和维修责任


    6-1 在转租期间，乙方发现该房屋及其附属设施有损坏或故障时，应用时通知甲方；由甲方按租赁合同约定，在接到乙方通知后的\_\_日内进行维修。逾期不维修的，乙方可代为维修费用由甲方负责承担。


    6-2 乙方应合理使用并爱护房屋及其附属设施。因乙方使用不当或不合理使用，致使该房屋及其附属设施损坏或发生故障的，乙方应负责修复。乙方拒不维修，甲方可或出租人可代为维修，费用由乙方承担。


    6-3 转租期间，甲方保证该房屋及其附属设施和设备处于正常的可使用和安全状态。甲方或出租人要对该房屋进行检查、养护的，应提前\_\_日通知乙方。检查养护时，乙方应予配合。如因乙方阻挠养护、维修而产生的后果，则概由乙方负责。


    6-4 在转租期间，出租人需要对房屋进行改建、扩建或装修的，甲方负有告知乙方的义务。具体事宜可由甲、乙双方在条款中另行商定。


    ### 七、房屋返还时的状态


    7-1 除甲方同意乙方转租外、乙方应在本合同的租期届满后的____日内应返还该房屋，未经甲方同意逾期返还房屋的，每逾期一日，乙方应按____元/平方向甲方支付该房屋占用使用费。


    7-2 乙方按本合同约定返还该房屋时，应经甲方验收认可，并相互结清各自的费用，方可办理退租手续。


    ### 八、转租、转让和交换


    8-1 在转租期间，乙方再转租房屋须事先书面通知甲方，并由甲方按租赁合同的约定征得出租人的书面同意。


    8-2 乙方向甲方承诺，在转租期间不将该房屋承租权转让给他人或与他人承租的房屋交换使用。


    ### 九、解除本合同的条件


    9-1 在转租期间，租赁合同被解除的，本合同也随之终止，因本合同终止使乙方遭受损失的，甲方应按月租金的____倍向乙方支付违约金。如支付的违约金不足抵付乙方损失的，甲方还应负责赔偿。但下列情况除外：


    - （一）该房屋占用范围的土地使用权依法提前收回的；

    - （二）该房屋因社会公共利益或城市建设需要被依法征用的或者拆迁的。

    - （三）该房屋毁损、灭失或者被鉴定为危险房屋的；

    - （四）甲方已被告知该房屋出租前已设定抵押，现被处分的。


    9-2 甲、乙双方同意，有下列情形之一的，一方可书面通知另一方解除本合同。违反合同的一方，应向另一方按月租金____倍支付违约金；给对方造成损失的，支付的违约金不足抵付一方损失的，还应赔偿造成的损失与违约金的差额部分。


    ### 十、其他约定事项


    ### 十一、本合同未尽事宜


