    ## 房屋转租合同


    根据《中华人民共和国合同法》的规定，甲、乙双方在平等、自愿、公平和诚实信用的基础上，经协商一致，就甲方将其依法承租的房屋转租给乙方使用、收益、由乙方向甲方支付租金等事宜、订立本合同。


    ### 一、转租房屋的情况


