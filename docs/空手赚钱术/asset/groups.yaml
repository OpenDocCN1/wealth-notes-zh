    > > 手表定理：带两只手表也未必能告诉你更准确的时间


    只带一只手表可以很容易的知道现在的时间，那是不是带两只手表就可以精准的确定你刚才看到的时间是正确的呢？答案是否定的，拥有两只或者两只以上的手表并不能告诉你更准确的时间，它只会让你失去对准确时间的信息。当然前提是这两只表时间并不一样。


    手表定理常应用于企业管理之中：


    对于一个企业，不能同时采用两种不同的管理方法，不能同时设置两个不同的目标，否则将使这个企业无所适从；一个人不能同时选择两种不同的价值观，否则，他的行为将陷于混乱；一个人不能由两个以上的人来指挥，否则将使这个人无所适从。


    在房地产投资中更是如此，我们目睹过太多的聪明人，总在寻找快速成功的捷径，总在不断的尝试“新”的手段；却不知道，最好的往往已经在他们手中。


    所以，你想真正的“快速成功”，就要“一以贯之”——空魔术一定可以帮你！


    切记！你有一只手表，就够了。


