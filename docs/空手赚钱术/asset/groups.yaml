    4-2 乙方支付租金的方式如下：


    \_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_\_。


    4-3 乙方交纳押金\_\_\_\_元，合同期满即归还乙方。


    ### 五、其它费用


    5-1 在房屋转租期间，乙方使用该房屋所发生的水、电、煤气、通讯、设备、物业管理、\_\_\_\_\_\_\_等费用由\_\_\_\_\_（甲方/乙方）承担。


    ### 六、房屋使用要求和维修责任


    6-1 在转租期间，乙方发现该房屋及其附属设施有损坏或故障时，应用时通知甲方；由甲方按租赁合同约定，在接到乙方通知后的\_\_日内进行维修。逾期不维修的，乙方可代为维修费用由甲方负责承担。


    6-2 乙方应合理使用并爱护房屋及其附属设施。因乙方使用不当或不合理使用，致使该房屋及其附属设施损坏或发生故障的，乙方应负责修复。乙方拒不维修，甲方可或出租人可代为维修，费用由乙方承担。


    6-3 转租期间，甲方保证该房屋及其附属设施和设备处于正常的可使用和安全状态。甲方或出租人要对该房屋进行检查、养护的，应提前\_\_日通知乙方。检查养护时，乙方应予配合。如因乙方阻挠养护、维修而产生的后果，则概由乙方负责。


    6-4 在转租期间，出租人需要对房屋进行改建、扩建或装修的，甲方负有告知乙方的义务。具体事宜可由甲、乙双方在条款中另行商定。


