    # “以租代售”案例


    小陈打工3年，实在受够了租房的苦痛，早就渴望可以买入一套自己的房产。但房价不断上涨，高额首付款让他只能望楼兴叹。


    我们的理财师团队接受了小陈的咨询申请。帮助他找到了李姨所拥有的一套出租房产。该房产价值14万，所在地段同类房屋的月租金为1000元。房产已经出租3年，遇到过4个租客。收租、家具保养让李姨也不胜其烦。


    二人在我们理财师帮助下，达成了“以租代售”的交易协议：新房租为1350元（即名义租金），其中450元作为以后购房款的预付定金。协议有效期为3年，约定3年后购买房价为15万，签订协议时，交纳购房5%的定金，即7500元，外加两个月的租屋押金2700元。并同时约定：不满意可以随时撤走，但所付的5%首付及名义租金不能退还。


    小陈是个非常聪明的人。他仔细分析过，3年里，除名义租金外，


    ## “空手赚技术”：零投资、零风险的房地产空手赚钱绝技


    他只要筹集 11 万元即可最终买入房产。也就是每年需要筹集 3.6 万左右。如果将来能申请到银行二手房按揭贷款，实际购房需要的现金会更少。


    更重要的是，3 年后房价多半还会上涨，现在就锁定了 15 万元的房产交易价，以后就再也不用为房价担心了。就算 3 年后自己没有凑足 11 万，那时房价如果上涨，也可以转让“购买权”，从而把自己交过的钱都赚回来。（比如，3
    年后房价 16 万，那时小陈可以向第三方出让“11 万”的购买期权，也就是说，小陈可以净赚 5 万元差价。）


    他非常满意这次“以租代售”交易，从此以后，小陈终于找到了“家”的感觉。每天把房子当作自己的家一样照顾，甚至还多买了两盆花放在阳台，过节时经常主动邀请李姨在家吃饭。


    看出这种交易的巧妙之处了吗？


    我们理财师为小陈所设计的交易有什么“隐藏”的神奇吗？为什么要这样安排呢？


    其实，这是一次成功的双赢交易，请看我们下面的详细分析。


    我们通过下图 1 来观察一下“以租代售”操作中，“租金”的组成变化情况。看到这点租金的变化了吗？


    就是这一点变化，导致李姨的租金每月租金立即增加 35%，三年后总收益增加 51%。更何况，李姨还多了一笔即期的收入——7500 元的“定金”。


