    那么，这种交易中，房东吃亏了吗？当然不是，因为：


    # 真正双赢的交易——“以租代售”对房东的 3 大益处


    对房东来说，无论是收益、灵活性、便利几个方面来看，“以租代售”的好处都是显而易见的。


    （1）收益高、风险低


    由于采取了“有吸引力”的方案，房东可以立即把房价（市场价）提升 10% 作为交易价，同时租金提升 35%。


    房东的收益提高是毋庸置疑的。而且无需其他繁琐的手续，可以一天之内就完成交易。


    （2）锁定稳定的租客，管理更省心


    由于买家是有诚意要购买的租客，所以愿意长期住在房屋里。房东的“一纸租约”实现直接锁定了“一个 5 年期”的租客。无需他再去为“招租”烦恼了。


    同时，这类“租客”会把它当成自己的家一样来爱护。因为他们是以“买”为目的来“租”的，所以，绝不会像对待其他出租房一样“粗心”。他们会费房东把“家”收拾得干净整齐。让房东省心省力。


    此外，租客为这间房子交纳了大额的“定金”，如果因为“拖延”而损失前面的金钱，他们会有“很高的痛苦指数”！所以，租客会更加积极的交纳房租，保证“购买”时的“贷款抵扣优惠”。


    （3）毫无风险，充分的法律保障


    在 5 年的“以租代售”期中，并没有转让房产产权给“租客”，双方只是普通的“租赁”关系。5 年后，“租客”必须补足房款，才可以获得产权。


    所以，房东无需担忧房产产权风险。


    此外，这样的“以租代售”交易法律认可吗？有法律保障吗？


    双方只需要在我们理财师的指导下，签定一份“租赁合同”，再附上一份“期权合同”即可——这一切都有坚实的法律基础，都是合理合法的。


    对交易双方，都有坚实的保障——任何一方毁约，都要承担相应的违约责任。对任何一方都有巨大的限制机制。


    如果买家中途放弃，则会失去所有已经交纳的款项（包括定金、预付房款、实际租金等）。如果买家 5 年期到时，无力出资购房，也会失去所有的已交款项（除了 2 个月的租金押金要退还外）——所以，房东是有充分的利益保障的。


    相反，如果房东违约，在 5 年期内希望转卖给第三方时，就需要赔偿 2 倍买家已交的“预付定金”——这就是对买家的保障。


    由此可见，“以租代售”的真正魅力了吧？


