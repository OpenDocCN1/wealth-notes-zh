    主动出击的依据，就是“客户数据库”（即“房东信息库”）。你必须搜集大量的房东信息，记录下他们的每一个喜好。这个信息库，将是你未来最大的财富。终身的人脉关系，就将维系于这个数据库中。


    你可曾听人说过：手机丢了没什么，只有里面的电话号码不丢就行。


