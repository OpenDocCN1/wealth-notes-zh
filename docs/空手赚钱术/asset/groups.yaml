    小苏与赵先生签订合同，规定小苏在此房里入住3年，每个月支付1100元（此时同类房产市场平均租金1500元）的名义租金，其中800元为“购房期权费”，相当的地预付定金，可以用来抵扣3年后买房时的价款。另300元作为实际租金。


