    ## 一、房地产世界的终极规则


    这里面有一个核心的问题：为什么是“以租代售”？


    相信很多学员读到这里，都会有此疑问。为什么要成为“以租代售理财师”？而不是其他投资手段的理财师呢？


    这一点说来简单，但却经历了我们大量的尝试与思考，是本书最值得玩味的“结晶”。


    **终极游戏规则**


    ![](img/5cf001339d867f196c8691a67eaef937_25_0.png)


    在《房神秘笈》里，我们曾经提到过，对出租房而言，最好的“升级”手段，就是“融资设计”。


    而在“炼金术”里，我们又强调了三种融资手段的各自特点。


    - 房东融资——难。因为房东手里握有房产，也就拥有了交易里的最大话语权。

    - 银行融资——繁。虽然房产最理想的融资对象就是银行，因为利率低、周期长。但最麻烦，最多负担的，也是银行。而且很容易受到个人财务基础的限制。银行不可能为你无限次的贷款。

    - 买家融资——简。买家融资虽然数额不大，但长期来看，却总领宜人。而且，买家常处于“弱势”。所以，是最容易获得的长期融资渠道。


    房地产就是一个“金钱换空间”的游戏，“融资”是这个游戏的主旋律。我们要透过现象看本质，凡是不需要“空间”的人，都是“图利”的一份子。其实，如果你自己尝试过其他的投资手段的话，你最终会醒悟：你的财富，无论是以何种名目，最终都是来源于“买家”。


    无论是“期权”，还是“转租”……你只不过是借助不同工具，经历不同的渠道来获得“买家”的“支付”罢了。


    所以，房地产这个世界的游戏规则就是：


    > 如何与房东合谋，简单、快速地从买家手里赚钱。

    > ——房地产世界终极赚钱规则


    请允许我们使用“合谋”这个略带贬义的词，但这是事实。


    - 银行借融资为名，与房东（开发商）合谋，从买家手里赚钱；

    - 房产中介以服务为名，与房东合谋，从买家/租客手里赚钱；

    - 各种类型的投资者（无论戴上什么帽子），还是与房东合谋（无论房东是否知道），从买家手里赚钱。


    在这个游戏里，没有第三者，只有“赚钱者”与“被赚钱者”。而买家必定成为后者。（即使投资者以低于市场价值的价格买入房产，但最终实现收益的，还是要等到买家付款。）


    所以，想做“赚钱者”的投资者别无他策，必须选择“如何与房东合谋”。更具体的分类则是：用自己的“钱”与房东合谋，还是用自己的“智”与房东合谋。


    很多可爱而幼稚的投资者，总想借“无知的房东”来赚钱。表现为，尽力寻找“被低估的房产”。却不知，找到之后，也不是说“一定就能赚到钱”；必须明白如何找到买家处理掉它才是真正地赚钱。


    而如果可以轻易地找到“买家”的话，房东为何会留给你“赚钱的机会”？任何低估“房东智慧”的投资者，都要吃苦头。任何忽视“终极赚钱规则”的投资者，都必定走弯路。


    现在，你该明白：为什么说，“空赚术”将是你与普通投资者的分水岭了吧？


    - 普通投资者的信念——房地产投资的获利关键在于“买得准”；

    - “空赚术”投资者的信念——房地产投资的关键在于“如何从买家手里赚钱”。


    我们在《房神秘笈》里提到过“投资的链条”理念。分析过几个最增值的环节，并说：要把精力放在最增值的环节上。


    普通投资者最容易犯的错误，就是总想把自己嵌入最增值的链条中，总梦想着一步位到的赚大钱。


    实际上，最扎实而务实的做法，就是附到最增值的环节中，帮那个环节赚钱，最后再把自己嵌进去，使自己成为增值链条中不可缺少的一环。


    因此，“空赚术”针对投资新手设计的“秘径”，让你躲开无数的陷阱。让你放弃“找到超值房产，赚房东的钱”的幻想，定位清晰自己的角色，投身于“赚买家的钱”的正路上来。


    ### 一条近在眼前的通夭秘径


    读过《房神秘笈》的人一定会对“以租代售”印象深刻，因为这种结合“租”、“售”特点的处理方法，实际上是非常巧妙的融资手段。


    它似租非租，似售非售，继承了二者的优点，剔除了二者的缺陷：房东无风险，有套利；买家低压，有保障。一举双赢。


    成交便利，资金流动快。协议条款少……是房东最赚钱的投资选择之一。


    可惜，真正懂得这种方式的房东少之又少。而懂得这种方式的投资者却苦于没有房产来操作。


    所以，“以租代售”就成了一条荒废的秘径，明明可以直通“钱途”，却无人穿行。


    加上前面我们提出的“合谋”观点，你现在就该理解“空赚术”的奥妙了。投资者贡献“智力”，房东贡献“房产”，二者合作设计“以租代售”交易，吸引买家“入套”。然后，投资者取得即期收益离开，房东依旧持有房产来持续获取未来收益。


    整个交易过程中，投资者无需涉及任何产权流、资金流的环节，只要提供智力支持，就可以帮房东“点石成金”；收益显著，而且周期很短。无论投资者对这个地区的房产特性是否熟悉，无论投资者从什么时候开始启动生意，都有大量的房东可以立即成为你的潜在合作者——所以，作为“空赚术”的学员，你不必再费尽心机去寻找“超值的房产”了。


    因为，房产可能因时、因地而变，但房东作为“人”，永远都有相同的“求财”特性。这是房东永远不变的“需求”。在任何时间、任何地点，投资者都可以“一击即中”；省却大量的对房产进行分析、调查、等待的繁琐过程。


    你还能找到更好的“合谋”方法吗？


    ![](img/5cf001339d867f196c8691a67eaef937_28_0.png)


    很多投资者都推崇“黄鼠狼条款”，就是在与房东签订的合同里做手脚，获得转让合同的权利，并希望找到接手合同的下家，获得转让差价——呵呵，简直就是把房东当弱智的投资行为。


    有句话说得好，把别人当白痴的人，自己才是白痴。


    在缺乏诚信气氛的中国商业社会里，房东绝不是文盲级傻瓜，他们都知道要去找律师保护自己的权益，都知道交易过程中可能的狡诈与陷阱。


    欺人者，人恒欺之。


    作为一个投资者，你即便依靠这种手段赚了一点钱，你能奢望房东还会信任你吗？你能奢望房东愿意与你长期维持关系吗？你能奢望房东帮你转介绍生意吗？


    自作聪明的投资者，实际上不是在“蒙房东”，而是在骗自己。


    所以，你必须把整个过程透明、公开，才能赢得真正的交易。这正是那些期望通过“转让合同”、“双重交易”等方式帮房东的人失败率居高不下的祸因。


    你必须告诉房东：“以租代售的目的确确实实帮您赚到最大的收益。”


    你必须告诉房东：“我的收益来源于您的收益的一小部分。”


    你必须告诉房东：“我会尽已所能，捍卫您的利益。”


    然后，房东才可能真心与你合作，并乐意你赚到应得的收益。


    当然，你也可能自会想到，帮助房东直接高价卖房的话，房东收益是不是更高吗？那么自己的收益是否也水涨船高了呢？


    大量的投资经历告诉我们自己，高价卖房与快速卖房，永远是一对矛盾。当房东着眼点是“高价”的时候，他们就很难在“速度”上让投资者满意。


    而且，卖房涉及到了大量的相关手续与条款，投资者更难说服房东采取“激进”的变通手段。


    更重要的是，迄今为止，我们也没有找到一种“放之四海而皆准”的方法，可以让房东“高价”卖房。（前提是不用再另行增加装修等任何投资）。


    而“以租代售”却是我们能找到的，适应面最广的，让出租房产的房东“高价”出租赚钱的手段。


    所以，“以租代售”标准化最强、适应能力最强、收益最直接，潜在的房东……


