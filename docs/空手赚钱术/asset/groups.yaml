    100 个人中只有三个人是富翁。他们起初照计划去做，没过多久，就感到这种日子索然无味。于是他们抛开计划，寻找一种能快速致富的魔法。他们的一生都在单调和趣味往返交错的过程中度过。所以他们没有成为富翁。他们不能忍受日复一日地遵循一个简单而枯燥的致富计划。许'
