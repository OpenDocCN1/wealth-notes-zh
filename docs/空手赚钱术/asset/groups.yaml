    > 如果一个项目需要招聘员工，才能赚钱——那么它也不是好项目；\n> 真正的好项目，即不需要用钱，也不需要用人；\n> 真正的好项目，是靠智慧整合别人的资源来赚钱。\n\
    >\n> ——房神论道\n\n《房神秘笈——解放3000万房奴的终极智慧》（电子版）于2007年初正式公布，好评如潮。在得到广大读者的热烈回应之后，他们中的很多人也都追问：书中的观点让人耳目一新，为什么不出续出新书将这种投资理念深化下去，造福更多的人呢？\n\
    \n其实，这个问题我们也一直在问自己：《房神秘笈》结合国内实际，提出了众多的投资手法——尤其是零首付投资思维——非常适合没钱、没经验的投资新手开展。\n\n\
    但是，根据我们的投资经验，虽然房地产是一个钻石矿，但能从中挖到宝贝的，仍然是少数——无论他们是否积极、努力——本质的区别在于“工具”的选择。\n\n同样去爬山，人们可以选择走路，也可以选择坐缆车。如果走路需要1天的话，坐缆车只需要1个小时就够了！\n\
    \n时间效率比24：1！\n\n这就是“工具”的价值！这就是“聪明”与“普通”的区别！而“工具”（或者称之为“方法”）更多源于智慧的头脑。\n\n请看下面一则在房产博客里曾经提到过的小故事：\n\
    \n## 空手变钱的女孩\n\n关于“提高识别机遇的能力”的培训中，一位美国的培训师要求：把学员的钱包、手表、口袋里的硬币及其他值钱的东西都放在公司的写字台上。然后，让公司把学员送到城里离家最远的地方，跟着开车离开；无论出了什么事都不要来接学员——学员必须靠一路挣钱回到家。\n\
    \n这种方法听起来有点疯狂？但却非常有效。有时，训练的结果甚至非常惊人。\n\n有一个女孩在出门前一言未发，只是把她的行头都放在桌面上就走了。四小时以后，她带回来一袋子钱。当其他学员抱怨乞讨和掉点几线有多难的时候，这个女孩正在一摆摆地数硬币。\n\
    \n所有的学员都要报出自己挣到的钱数，其他人基本上都挣了 2 到 10 美元。当问到这个女孩的时候，她很酷地说：“118 美元。”全班一下子静下来了。女孩身边摆着一摞摞的钱，她转过身来看着其他学员，及那些老谋深算的经理人员。\n\
    \n当问到她成功的秘密时，女孩说：我去了超市。有一个经理问：“你的钱不是抢来的吧？”\n\n“当然不是。我的方法是从一个老人那儿学来的，他在另一个超市这样做：我在停车场对买完东西的人说，如果他们答应我可以把手推车存放在车处还回来的一美元押金留下的话，我就替他们去还手推车。”\n\
    \n年轻的女孩就是以这样简单的方式击败了那些老手。她抓住了购物者的心理：刚刚从超市买了一堆东西的人实在没兴趣再把手推车还回去，把车锁上，取回那一块钱的押金。他们只想把车门关，马上回家，免得刚买的冰激凌溶化在路上……\n\
    \n简单的挑战，惊人的差别——财富与其说源于勤奋，不如说源于智慧。\n\n钱就呆在那儿等着你去挣。\n\n擅长赚钱的人无论何时何地都能看见机会。\n\n亲爱的学员，读到这里时，请你告诉我：“乞讨”的员工与“还手推车”的女孩，哪个最努力、哪个最辛苦呢？哪个最快乐、哪个最轻松呢？哪个最聪明、哪个最普通呢？\n\
    \n包括这个女孩在内，所有学员的任务都是一样的，但他们的付出却不一样，而他们的收获更是天差地别！\n\n“受苦”最少的人，获得了最大的回报！不是嘛？\n\n\
    真是对“努力就有回报”理念的一种莫大的讽刺。\n\n世界上永远有聪明的方法与笨的方法，而二者的区别就是：笨的方法，是人人都能想到、人人都能做到的方法；而聪明的方法，就是人人都能做到，却不是人人都能想到的方法！\n\
    \n又应验了那句话：没有做不到，只有想不到。\n\n在“空手赚技术”（以后简称“空赚术”）教材里，就将介绍这样一种方法：\n\n- **最简单：** 简单到任何人都可以立即上手，而无论你有什么文化基础，无论你的经济基础，无论你生活在何处；一学就会，一用就灵。\n\
    \n- **最快速：** 你使用的三个月里就可以见效——准确来讲，是“见钱”！获得收益：而且是别人心甘情愿地给你钱。因为你以最简单、最快速的方法为别人创造了价值。\n\
    \n- **无任何风险：** 在这种方法里，你不必投资一分钱——因为，你投资本课时，就已经把应该花的钱都投入进去了！所以，你应用这种方法时，就不再需要任何金钱投入了。\n\
    \n教育是回报率最高的投资，你很快就会明白这句话的含义。\n\n> **特别注意：关于本教材的使用**\n> 本教材是《空手赚技术》的培训教材，它虽然是独立成体系的投资手段，但这本书的很多内容都是基于《房产秘笈》及《超级零首付》的知识基础的。为节约篇幅，本书有很多需要用到这两本书的知识点都省略了。\n\
    > 如果您在阅读过程中，发现似乎缺少了一些内容，就请您翻开这两本书，基本都能找到答案。\n> 所以，本教材建议您先读《超级零首付》，再来学习《空手赚技术》。这样您会更快的理解本书教学的内容。\n\
    > 学习过程中如有不懂之处，可以通过Q群或是客服人员随时沟通与交流。\n\n# 第一章 空赚术速览\n\n这个世界的规律就是如此奇怪：你越想赚钱，你就越赚不到钱。\n\
    \n持续财富的秘密，就是“人脉”的持续扩张。\n\n你的现金投资可以是“零”，绝对的“零”；因为，你的智慧投资才是最好的投资。\n\n财富的秘密在于“一次生产，大量复制”。\n\
    \n相比于 58 元的《房神秘笈》，本课程的投资费用一下子增加了 20 多倍，相信相对于很多“月光族”之类的网友而言，是很大的压力。\n\n所谓“一分钱一分货”，到底是什么方法价值如此之高呢？\n\
    \n“空魔术”源自于房神团队中一位“天才”的赚钱创举；等会再介绍他的具体经过，先讲一讲这种“创举”的神奇之处：\n\n## 一、不可思议的神奇效果\n\n\
    ### （1）一分钱定金/首付也不需要\n\n人们所能看到、想到的方法，如“转租”、“期权转让”、“转定金合同”……无论交易额大小，都是需要 3 位数、4\
    \ 位数、甚至 5 位数的投资的。\n\n但这位“天才”却与众不同，除了路费与电话费之外，他真的没有掏一分钱！在平常人看来不可思议的事，他却轻松做到了——当然，当你知道方法之后，就会恍然大悟！手段并不复杂，关键是你想不到。\n\
    \n### （2）最少力气的客户开发过程\n\n普通的投资者，在找到合适的房东前，都要经历大量的被拒绝的过程；其间酸甜苦辣，自难言表，非大毅力之人难以坚持。所以，很少有投资者（包括看过《房神秘笈》的读者）能最后成功致富的。\n\
    \n然而，“天才”的方法，无意中应用了最新的营销思维，轻而易举地把潜在客户吸引过来，并毫无阻碍地引导他们付费成交。\n\n这还不算完，那些“成交”的客户大多成了他的终身客户，帮他转介绍；帮他优化服务过程——简直有些不可思议。\n\
    \n### （3）毫无风险的交易\n\n除了无需任何资金投入外，“天才”也无需办理任何过户、担保、抵押等事宜，过程非常简单快速。“天才”是完全与“风险”无关的，每笔交易都可以“一单结”、没有手尾。\n\
    \n### （4）海量的市场空间\n\n房地产投资新手最常说的一句话就是：“合适的房东不好找”——其实，不是“房东不好找”，而是因为你不是“高手”。\n\n\
    在“天才”眼里，合适的房东“无处不在”；不是“房东”少，而是“新手”找不到“房东”的真正的、通用的、深层的、未满足的需求！\n\n### （5）简单的收付款过程\n\
    \n以往的房地产投资过程里，往往充斥着大量复杂、繁琐的交易及沟通过程。比如需要引入交易第三方，订立复杂的交易条款，周期长、变数大的交易时间……都潜伏着众多的隐患与陷阱。\n\
    \n“天才”的方法里，把交易化繁为简，把交易参与方压缩最少。其合同内容一目了然，使参加交易的人不再费心于大量条款。进而，把收款周期极大缩短。\n\n“转租”里，每个月才有一次收益；“转让合同”或是“转售”里，要几个月才有流转。而在“天才”方法里，把流转周期压缩最短。\n\
    \n### （6）爆发性的业务扩张速度\n\n第一个月，一单；第二个月，三单；第三个月，十单……以后，每个月会加速膨胀。一年之内，你会看到惊人的扩张效益。而这种效益的前提，是“天才”一分投资也没有付出！所以，这种方法的回报率，就是无限大！\n\
    \n……\n\n效果还有很多，比如，你会很快获得大量的正现金流；你会从中获得精神的快乐等等。只有体验过的人，才会明白。\n\n相信，你此刻一定很好奇，这种“天才”的方法到底是什么？\n\
    \n你放心，为期4个月的“空赚术”特训营会把整个过程详细传授；你很快就会发现里面的秘密——但请不要外泄！绝对不能外泄。\n\n因为，这1280元的投资，将成为你与普通投资者（或者说：赚不到钱的投资人）之间的分水岭。你所获得的，将是“一级机密”。\n\
    \n## 二、 为什么普通的投资者赚不到钱？\n\n在接下去谈更深入的内容之前，请让我们从“方法原理”方面（非精神斗志方面）来谈谈，为什么普通的投资者赚不到钱？\n\
    \n简单来说，他们最常犯的三大错误就是：\n\n- （1） 总在想赚钱，却不想“贡献”\n\n这个世间的规律就是如此奇怪，你越想赚钱，你就越赚不到钱。相反，你越是帮助别人赚到了钱，你就越能赚到钱；而且会比那个被你帮的人，赚到更多的钱。\n\
    \n普通投资者，总是想方设法为自己的利益“巧言语利”，设置重重“巧心思”、“妙条款”。利用房东或是买家的急切心理（或是“无知”）来赚自己的钱。但天网恢恢，疏而不漏。\n\
    \n这种投资者总会遇到重重阻碍，比如房东不理解、买家不配合。殊不知，真正的阻碍源于他自身的“贪婪”。\n\n反之，放开心胸：彻底地为房东、租客、买家着想，你反而会获得大量的商机。\n\
    \n有一句话说得好：“帮助别人成功，自己才能成功”！\n\n所以，“空魔术”就是一门帮助“别人”成功的技术。“房东”赚到了钱，你就会赚到钱；买家获益了，你更会赚到钱！\n\
    \n- （2）总在想找信息，却不找“经验”\n\n普通投资者，总想着去找“房源”或是找“急卖”的房东信息，浪费了大量的有价值的房东线索；却不知道，很多房东都是有“需求”的潜在客户，你只在一面之差就浪费掉，实际上在浪费自己的财富。\n\
    \n看起来，你缺信息；实际上，你真正缺的是“经验”。\n\n你追求的不仅是“房产”信息的多少，更应该是学习的速度；而学习必须基于“经验”——经验一定源于市场一线；所以，你必须使用一种方法，可以在最短的时间内，接触最大量的房东——这就要求你所使用的方法，能适应于广大房东的需求、挖掘出大多数房东的共同欲望。\n\
    \n你接触不同类型的房屋越多，接触不同特点的房东越多、越快，你的学习速度就越快。你的经验积累也就越快。\n\n- （3）总在盼机遇，却不建“人脉”\n\n\
    人脉就是财富流淌的沟渠。你的人际数量决定你的“财富”流入的速度。成功的商人，总是花最多的时间与客户在一起——就是为人脉而投入时间与精力。\n\n普通投资者常说：不知哪里找投资机遇。\n\
    \n这句话的潜台词就是：关系少，信息闭塞。\n\n无论你有多少“专业技能”，如果不通过“人脉”网络传播出去，也不会有人来赏识你，认可你。\n\n所以，财富持续流入的秘密，就是“人脉”的持续扩张。\n\
    \n人脉决定了你成就的速度与高度！\n\n## 三、“空赚术”如何帮你一次性地解决以上的所有问题？\n\n“空赚术”基于以下的思维逻辑来构建投资体系，无论你是是否能一次性理解，都不要急于提出自己的见解——你只需要相信它，坚持去做，直到成功。\n\
    \n> “要成功，先发疯，头脑简单向前冲”\n\n### （1）最值钱的，不是房产本身，而是智慧\n\n你可以穷，可以没钱：只要你有智慧，就一定能赚钱。而且是快速地赚钱。\n\
    \n房东的房产是沉睡的宝藏，能唤醒它的，只有你的智慧资本。所以，你的现金投资可以是“零”，绝对的“零”；因为，你的智慧投资才是最好的投资。\n\n智慧这种商品，非常奇妙。它不会被偷，不会被抢；呼之即用，毫无负担。不怕分享，不怕拚格战。只要被别人感性上认可，就可以产生巨大收益。更可以持续增值，打造终身美誉。\n\
    \n### （2）最容易启动的赚钱机会，在于出租的房产\n\n很多投资者都只看到“转售”房产的暴利，却忽视了“转售”的长周期。一次转售，耗时三个月，赚3万。一次出租，耗时2周，赚1千。\n\
    \n你说，哪个划算呢？\n\n你可能会说，直觉地算：三个月可以成交6次出租房产的交易，最多赚6千啦！当然是“转售”划算，赚钱更多。\n\n你错了，而且错得很可笑。\n\
    \n因为你忽视了几个基本的前提：\n\n- 1. 市场空间。出租的房源信息庞大，远超过出售房产；更容易筛选。从需求方来看，租客也远多于买家。\n- 2. 流转速度。出租的环节少、流转速度快、成交容易；出售的环节多、流转速度慢、成交繁琐。\n\
    - 3. 资金筹措。出租的房产仅涉及租金问题，一般几千元；而买卖则关系到动辄几十万、上百万的资金，交易方怎能不小心谨慎、过程怎能不缓慢、繁杂？如果买家资金不够，还要涉及到银行按揭事宜，则更加麻烦。\n\
    - 4. 沟通难度。出租中，房东顺应的因素少，容易谈判及成交；出售中，房东顺应的因素更多，谈判必定繁琐。\n\n所以，从多个角度综合分析，你就会明白：为什么沃尔玛可以成为世界500强之首？一个很重要的原因就是，他销售的总是需求大、流动性高的日常用品。\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_13_0.png)\n\n**小心流动性陷阱**\n\n摘自《富爸爸·投资指南》\n\
    \n> 富爸爸常说：“大部分普通投资者亏本的原因，是因为投资进去很容易，但要退出来却很困难。如果你想成为一个智谋型的投资者，你需要知道怎样进行投资，还要知道怎样撤出投资。\n\
    \n![](img/5cf001339d867f196c8691a67eaef937_14_0.png)\n\n> 今天当我投资的时候，我必须考虑的最重要的战略之一就是叫作“退出战略”。富爸爸用这样的字眼来表达其重要性，以便我能理解它的重要地位。他说：“进行一项投资像结婚一样，刚开始时非常兴奋，但如果相处不融洽，离婚的痛苦就比开始的兴奋和快乐多得多。所以你必须真正意识到投资就像一桩婚姻的过程，进去常比出来容易得多。”\n\
    \n### （3）财富的秘密在于“一次生产，大量复制”\n\n很多投资者一年才做几单投资，即使他可以每单赚到 5 位数；一年最多也不超过百万。而且这是很难持续性扩大的收益。\n\
    \n但是，如果你可以生产出标准化的“产品”，就像“电脑软件”：生产一次；无限次低成本复制，那么，你就可以快速扩张。\n\n为什么比尔·盖茨是世界首富？因为他生产的是“软件产品”，而且是人人都需要的“操作系统”。为\
    \ 1 个人生产，和为 10 亿人生产，所花费的时间与精力几乎一样；但 10 亿人使用，却不能仅由 1 个人付费。\n\n虽然全球有数亿计的微软的盗版，但只因有几千万人付费。所以，比尔·盖茨连续\
    \ 13 年蝉联世界首富。\n\n- 什么样的房产可以“大量复制”？没有\n- 什么样的房东可以“大量复制”？没有\n- 什么样的买家可以“大量复制”？没有\n\
    \n所以，普通的投资者，只能困顿于“无法复制”的投资对象上；所以，普通的投资者只有不断的付出，才能不断地赚钱。“付出”（或者说是“生产”）一旦停止，财富立即“断流”。\n\
    \n看了上面的分析，你是否有同顿悟？如果，你曾经试过投资房地产，就一定会更深的体会。\n\n有了以上三个“思维”支撑，你将很快明白真正的“通天秘术”。激动人心的，就在下面……\n\
    \n## 四、 现在揭开“终极投资空赚术”的面纱\n\n现在来看看那位“天才”的创举——下面的每句话，都价值千金！\n\n“天才”在投资之初，从“转让合同”试起，做过“转租”，做过“以租代买”，做过“期权”……但全部失败，无一例外，不断受挫。最后一次尝试，甚至被假房东骗去了\
    \ 4000 元的定金。为时一年，一事无成，分文未赚。\n\n他屡战屡败之际，深刻自我反思。总结过往所有经历之得失，终于悟出房地产投资的真谛。\n\n他于是创造性地提出了以下的\
    \ 6 步“通天秘术”：从而一举扭转败局，成功致富。\n\n- (1) 他针对出租屋的房东最头痛的问题，写下一份报告《如何无需任何投资、不冒任何风险地让您的租金收入立即增加\
    \ 50%》；\n\n- (2) 然后在本地报纸的分类广告栏上刊登广告：“免费获取报告《如何无需任何投资、不冒任何风险地让您的房产租金收益立即增加 50%》请立即拨打电话：******。”\n\
    \n- (3) 只要有房东打电话过来咨询。“天才”立即询问具体的房产情况，加入房东信息库。并邮寄免费报告。他平均每半个月邮寄一次，并经常打电话与房东联系。如果房东对于“以租代售”有一定兴趣，他就主动上门，为房东设计一套增加租金收入的“以租代售”方案。要求房东与租客成功签定“租买合同”后，立即支付等于一个月租金收入的费用。\n\
    \n- (4) 第一个月，他找到 20 名房东信息。其中 1 人成交。他成功地赚到 1500 元。以此积累，不断增加。第四个月时，他的房东信息库已经积累到\
    \ 160 人。成交 12 单，收入超过 3 万。\n\n- (5) “天才”的好戏刚刚上演。他不满足这种赚钱速度，开始改变模式，从而收入井喷式成长。他在本地召开免费讲座，为房东提供“以租代售”的相关知识：1\
    \ 个多小时的免费讲座，吸引了大量的房东报名参加他的收费讲座，内容就是“以租代售”的操作细节。\n\n讲座每人收费 580 元——他召开讲座的第一期就赚到了\
    \ 1 万多，仅一天时间。在讲座上，他更是卖出了很多相关的资料。\n\n- (6) 随着房东信息库的不断膨胀，他的客户越来越多，大部分源自客户转\n\n你了解《超魔力自动赚钱机》的威力吗？请点击立即加入：http://fangshennjji.cn/chaomoli.html\n"
