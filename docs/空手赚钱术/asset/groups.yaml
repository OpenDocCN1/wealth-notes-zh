    #### （2）许可营销


    “许可营销”是由营销鬼才 Seth Godin 在《Permission Marketing》一书中提出的理念。


    其基本思维就是：获得潜在客户的许可，发送有价值的资料，潜移默化地培养信任关系并教育客户，最终达成销售，并维持终身关系。


    你要想了解“许可营销”的案例，只要想想在“房产网站”所获得的体验即可——我们就是许可营销的忠实拥趸。一举一动，无不遵从“许可→跟进→销售”的脉络。整个过程中，你会感觉被“不情愿地打扰”了吗？会感觉是被“推销产品”吗？


    许可营销最大的魅力，在于不被拒绝地完成了整个销售过程。销售过程中最大的障碍往往在于“信任关系”的建立。而信任需要时间。所以，许可营销就通过有耐心地“定期资料”发送，平稳打通了“信任关系”的时间跨度。


    当信任关系建立后（即房东相信你的“房产理财的专家能力”后），销售就将是非常简单的事了。


    无论你是否做过销售业务，你都必须承认“信任关系”永远是销售的核心。而它一旦建立起来，就将发挥长期、巨大的作用。


    #### （3）数据库营销


    终身客户，就是“忠诚”的表现。而成为“终身”的前提，你必须记住客户一辈子，而不是试图让客户记住你一辈子——终身的客户关系，一定是商家主动出击的结果。


    主动出击的依据，就是“客户数据库”（即“房东信息库”）。你必须搜集大量的房东信息，记录下他们的每一个喜好。这个信息库，将是你未来最大的财富。终身的人脉关系，就将维系于这个数据库中。


    你可曾听人说过：手机丢了没什么，只有里面的电话号码不丢就行。


    电话号码的意义，不就是“人脉数据库”吗？单有这个数据库当然不是全部的意义。更关键的在于“如何挖掘与利用”。


    数据库营销的基本思维，就是借助数据库资料，通过分析潜在客户的购买行为，来预测并激励他们的购买行动。


    如果你的数据库里提示，某个客户将于何时出差一段时间；那么，在此之前，他更可能出于方便考虑，而将房产出租。这就是利用信息的价值来销售。


    同理，如果你在客户的生日那天，送上一张贺卡；即使是寥寥几字，也会让他感动不止。


    **乔·吉拉德：只要6个月，我会在中国造成惊天动地的影响**


    乔·吉拉德，因售出13000辆汽车创造了商品销售最高纪录而被载入吉尼斯大全。他曾经连续15年成为世界上售出汽车最多的人，其中6年平均售出汽车1300辆。销售是需要智慧和策略的事业。在每位推销员的背后，都有自己独特的成功诀窍，那么，乔的推销业绩如此辉煌，他的秘诀是什么呢？


    乔·吉拉德有一句名言：“推销活动真正的开始在成交之后，而不是之前。”他深信：在成交之后继续关心顾客，将会既赢得老顾客，又能吸引新顾客。于是，乔·吉拉德每个月会给他曾经的顾客寄出上万张他老家签名的贺卡，让顾客们永远记住乔·吉拉德，永远记住，买车就只要去找一个人就可以了，那个人就是—乔·吉拉德。


    **记者：你在你的职业生涯中，像你刚刚所谈到的，给客户寄一些明信片每月每年，对那些有可能成为你买车客户的潜在客户，你也给他们寄吗？现在时代发展了，很多人都用电子邮件，你还是坚持来笔写明信片给你的客户吗？**


    **乔·吉拉德：寄送个人信笺。电子邮件是种偷懒的方法。世界在变，产生了电子邮件，电子帐单。个人联系永远都存在，并且占有重要地位。人购买人。你需要面对人。因为你买车不能仅仅靠电子邮件，你需要知道具体谁推荐给你车，他能为做什么。就像我刚刚讲到的，在中国给我6个月，只要6个月，我会造成惊天动地的影响。因为我会再度创造一个口碑相传，吸引客户不离不弃的销售王国。你摆脱不了我的推销。逃离我的推销只有一种可能，那就是你离开人世了。即使你升到天堂，你也会在地球上空听到乔治拉德的名字，你的灵魂还会回来找我。哈哈。**


    #### （4）会议营销


    人在群体里，最容易被催眠——你信吗？


    ![](img/5cf001339d867f196c8691a67eaef937_20_0.png)


    “空手赚钱术”：零投资、零风险房地产空手赚钱绝技


    销售本身就是一种说服的过程，从广义角度来看，就是“催眠”的过程——因为人们相信你的话，就是“被你催眠”了。群体的空间里，人们最容易被感染，最容易被说服。这就是为什么革命年代里，国民党的税多，其共产党会多？——因为共产党最擅长做“思想”工作。而最好的“思想”工作，就是“开会”，集体“催眠”。


    此外，从客户开发的效率来看。一个客户一个客户地拜访，你一天最多能拜访几个人？相反，你借助“免费”讲座的“鱼饵”，可以一个小时之内，“说服”大量的客户！


    所以，采用会议营销，无论是时间效率，还是金钱效率，都远比其他的上门式、电话式要高明得多。


    你如果在规范的销售导向的大公司里做过，就会明白会议营销的威力。从医药到IT，都在会议营销上收获不匪。


    “智力产品”更是如此。


    当然，如果你自认为“口才不佳”，“形象不雅”，难以登台：那就要加强这个方面的训练与自我调整。因为这项技能将使你获益终身。


    #### （5）口碑营销


    口碑营销是营销效果迅速放大的核武器。开发新客户最好的方法就是“转介绍”。如何获得转介绍？必须创造传播的“口碑”。


    “口碑”源于成功的案例、鲜明的形象、独特的卖点、直观的价值。老客户会推荐你的服务，往往不是因为“有提成”；而是因为多种因素使然：容易传播的卖点、传播者本身的人脉、有助于传播的环境……


    最好看看《引爆流行》这本书。你会明白“口碑传播”的奥秘。


    综合运用以上5种营销法则，你会发现“空赚术”妙不可言。每一个步骤的成功都绝非偶然。


    “天才”的所为，其实是吃遍各种各样的亏与苦之后，才总结出来的“正道”；是体验各种投资方式的利与弊之后，才悟透的妙计。看上去简单，却绝不“平凡”。


    “空赚术”绝不是异想天开的创造。它是让你避免再去碰壁与吃苦的锦囊。


    ## 六、请你马上实践，经济自由只要做对一件事


    所以，如果你是个新手，刚看过一些国内外的投资书，脑中还是一片糊涂的话，请你立即放弃所有的杂念，马上开始筹备这种非常手段。


    所以，如果你曾经过试其他的房地产投资手法，它们并没有让你获得满意的成效的话，请你立即停止所有的尝试，马上开始全新的“空赚术”。


    所以，如果你真的对自己充满期待，渴望美好生活的来临的话，请你立即订立具体的行动目标，马上开始这种其他人尚未了解的终极投资技巧。


    在宣传资料里，我们曾写过“机会窗”一词。就是说，这种投资技巧是有“生命周期”的，因为它的强劲威力。你应用之后，很快会有人效仿，甚至超越你。所以，你必须第一时间成为所在区域的“金牌以租代售专家”——否则，马太效应将只把机会留给少数的几个后来者。


    当房东了解多个“以租代售理财师”的广告之后，你就失去了机会；因为“许可营销”会把房东紧紧垄断在别人的“数据库”里。


    第一时间走出去，把房东吸引过来，把他们的信息记录下来：每天坚持完成这些基础的工作，你很快就会赚到钱！


    记住，你的财富与房东数据库的信息量成正比。集中精力于“数据库”的增加上，你会在最短的时间内创造最大量的财富。


    你的“经济自由”梦想，其实也只不过是一个数字游戏。坚持扩大房东数据库的容量，就是这个游戏的所有秘密。


