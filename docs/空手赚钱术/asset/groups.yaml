    # 一、

    ## 房地产世界的终极规则


    这里面有一个核心的问题：为什么是“以租代售”？


    相信很多学员读到这里，都会有此疑问。为什么要成为“以租代售理财师”？而不是其他投资手段的理财师呢？


    这一点说来简单，但却经历了我们大量的尝试与思考，是本书最值得玩味的“结晶”。


    终极游戏规则


    ![](img/5cf001339d867f196c8691a67eaef937_25_0.png)


    在《房神秘笈》里，我们曾经提到过，对出租房而言，最好的“升级”手段，就是“融资设计”。


    而在“炼金术”里，我们又强调了三种融资手段的各自特点。


    +   - 房东融资——难。因为房东手里握有房产，也就拥有了交易里的最大话语权。

    - 银行融资——繁。虽然房产最理想的融资对象就是银行，因为利率低、周期长。但最麻烦，最多负担的，也是银行。而且很容易受到个人财务基础的限制。银行不可能为你无限次的贷款。

    - 买家融资——简。买家融资虽然数额不大，但长期来看，却总领宜人。而且，买家常处于“弱势”。所以，是最容易获得的长期融资渠道。


    房地产就是一个“金钱换空间”的游戏，“融资”是这个游戏的主旋律。我们要透过现象看本质，凡是不需要“空间”的人，都是“图利”的一份子。其实，如果你自己尝试过其他的投资手段的话，你最终会醒悟：你的财富，无论是以何种名目，最终都是来源于“买家”。'
