    房屋已书面告知公房出租人/按房屋租赁合同的转租约定/征得房屋出租人书面同意，由甲方将上述承租房屋\_\_室（以下简称该房屋）转租给乙方。该房屋的建筑面积\_\_\_\_平方米。


    ### 二、租赁用途


    2-1 甲方已向乙方出示该房屋\_\_\_\_（租赁合同登记备案证明/租用公房凭证）（编号\_\_\_\_）。该房屋的用途为\_\_\_\_，乙方承诺按\_\_\_\_（租赁合同登记备案证明/租用公房凭证）所载明的用途使用该房屋。


    2-2 乙方保证，在转租期间未事先书面通知甲方，并由甲方按租赁合同的约定取得出租人的书面同意以及按规定报经有关部门核准前，不得擅自改变该房屋使用用途。


    ### 三、转租期限及交付日期


    3-1 甲、乙双方约定，甲方于\_\_\_年\_\_月\_\_日前向乙方交付该房屋。转租期为\_\_个月。自\_\_\_年\_\_月\_\_日起至\_\_\_年\_\_月\_\_日止。


    3-2 转租期满，甲方有权收回该房屋，乙方应如期返还。在租赁合同约定的期限内，乙方需继续承租该房屋的，则应于转租期届满前\_\_个月向甲方提出续租书面要求，经甲方同意后重新签订转租合同。


