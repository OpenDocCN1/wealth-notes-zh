    # 真正双赢的交易——“以租代售”对房东的 3 大益处


    对房东来说，无论是收益、灵活性、便利几个方面来看，“以租代售”的好处都是显而易见的。


    （1）收益高、风险低


    由于采取了“有吸引力”的方案，房东可以立即把房价（市场价）提升 10% 作为交易价，同时租金提升 35%。


