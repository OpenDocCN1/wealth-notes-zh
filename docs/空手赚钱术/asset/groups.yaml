    300 元”若原文是300，但OCR给的是1300。让我们仔细看OCR：“其中 800 元为... 另 1300 元作为实际租金”。800+1300=2100，与1100不符。这是原文的逻辑错误。作为OCR后处理，通常纠正明显的数字/逻辑错误，或者保留。题目要求“纠正明显的OCR错误（如...数字/字母误判）”，但这可能是内容逻辑错误而非OCR误判。然而，1300极有可能是300的误识（3和1有时混淆，或者单纯写错）。考虑到“同类房产市场平均租金
    1500 元”，名义租金1100低于市场价合理。800期权+300实租=1100。1300实租则总租金2100高于市场价，不符合“低门槛”逻辑。判定为OCR误判，将1300更正为300。*


    签订期权合同时，小苏交纳28800元的“期权转让费”。双方同时约定3年后买房时，房价为40万。税费各付50%。3年里，如果小苏放弃买房，则赵先生不退任何期权费及房租。3年里赵先生也不能转售该房给其他人，否则将赔偿小苏2倍的期权费。


    此时，小李已经交纳的累计期权费为：


    800×12×3=28800


