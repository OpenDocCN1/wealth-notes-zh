    # “空手赚米术”：零投资、零风险的房地产空手赚钱绝技


    无论是“期权”，还是“转租”……你只不过是借助不同工具，经历不同的渠道来获得“买家”的“支付”罢了。


    所以，房地产这个世界的游戏规则就是：


    > 如何与房东合谋，简单、快速地从买家手里赚钱。

    ——房地产世界终极赚钱规则


    请允许我们使用“合谋”这个略带贬义的词，但这是事实。


    +   1. 银行借融资为名，与房东（开发商）合谋，从买家手里赚钱；

    2. 房产中介以服务为名，与房东合谋，从买家/租客手里赚钱；

    3. 各种类型的投资者（无论戴上什么帽子），还是与房东合谋（无论房东是否知道），从买家手里赚钱。


