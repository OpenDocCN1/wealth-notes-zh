  md: "啊，肯定不是完美主义者。那可不一定，你可以通过下面几个问题测试一下：\n\n+   * 你有没有在 一些小问题上纠结好几个小时、好几天，甚至是好几周的经历？\n\
    * 有人指出你工作上的一个小错误，你的情绪就变得很低落？\n* 本来花十分钟就可以搞定的细节，非得花好几个小时去润色？\n* 即使完成一个任务后也总感觉没完成？\n\
    * 因为害怕听到朋友或同事的负面评价而隐瞒自己犯的错？\n\n上面这几条你要是有，你就得小心了。你之所以遭遇“高原效应”，也许并不是因为你不够努力，而是因为\
    \ 你太追求完美主义了。\n\n完美主义者最不能接受的两个字，是“失败”，因为害怕失败，完美主义者往往花费大量的时间去前期准备，把开始的时间一再推后，所以拖延症最严重的人群，往往就是最有上进心的完美主义者。所以突破“高原效应”重要的一步，就是转换思维，换个角度看待“失败”。\n\
    \n完美主义者往往都有all-or-nothing这种非黑即白的思维模式。解释一下，all-or-nothing的字面意思是“要么全有要么全无”，就是咱们中国人说的孤注一掷，要不就是“成功”，要不就是“失败”；要不就是“全部都要做得完美”，要不就是“压根就不做”。\n\
    \n作者说，这种想法太不现实了。你想想有哪个企业家没经历过任何失败就成功？哪个运动员在获得奖杯前不是在训练中失败过一千次一万次？硅谷有一种文化叫做“失败文化”，鼓励你快点失败，经常失败，失败了还要把经验分享给大家，他们甚至专门有一个大会叫做失败分享大会（FailCon）。\n\
    \n为什么要这么做？因为在通往成功的路上，肯定是要失败的，失败是好事啊，它清清楚楚地告诉你，哪些方法可行，哪些方法不行，你失败得越多越快，就说明你尝试得越多越快，可以修正改进的机会也就越多，成功的几率当然会更大。\n\
    \n所以，放手去做，别瞻前顾后，摒弃掉all-or-nothing的思维，也别把失败这件事儿看得那么重，它只是帮助你修正提高的一种方式。\n\n那么，即使放手一搏，不害怕失败了，做事情要做到什么程度，也是有讲究的。我们平时认为，做事情要努力做到极致才对，要对自己做得好！经济学家和为子学家说：不对！做事情要考虑成本和结果，只要最后的结果你满意，你的服务对象也满意，就行了。这在经济学理论中叫做“有限理性”（bounded\
    \ rationality），有限理性的提倡者西蒙是一位曾经获得过诺贝尔经济学奖的经済学家。\n\n举个例子，比如说你家今天晚上有客人要来，你要做一种酱汁，这个酱汁最好吃的做法是要到副从菜场买回来的新鲜蔬菜，但是这个时候菜市场都关门了，你家旁边的小蔬果店还开着，也有蔬菜卖，不过肯定是没有从菜场买回来的那么新鲜了。那买不买？肯定是买啊，只要你做出来的酱汁你满意，你的客人也觉得吃就够了，到底是不是从菜场买回来的，根本不重要，这就是使用有限理性解决生活问题的实例。\n\
