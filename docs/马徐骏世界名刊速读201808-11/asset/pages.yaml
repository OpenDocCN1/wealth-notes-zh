  md: '# 《鹦鹉螺》| 如何做出明智选择


    +   本期为你讲述《鹦鹉螺》杂志的文章：


    在这个资讯爆炸、选择太多的商业时代里，面对各种各样的商品和服务，我们如何做出明智选择？


    # 知识清单：


    +   - 今日关键词


    wisdom of crowds：群体智慧。也可以用 Collective Intelligence 来表达，简称 CI。这一概念最早来自于昆虫学，蚂蚁和蜜蜂都被认为具有群体智慧的动物。它们可以合作完成极其复杂、相互协作的网状任务。越来越多的人可以随着自己的想法贡献出来，参与决策，因此
    CI 可以被看作群体智慧做出决策、比单次可见的 wisdom of crowds 就是我们在外卖、点酒店的时候，会在手机 App 或者网站上看看别人的评论，这就是利用群体智慧做出选择的例子。


    # 1 | 如何做出明智的选择


    今天的内容来自《鹦鹉螺》杂志的《如何做出明智的选择》，How to Choose Wisely。


    这篇文章的作者范德·范德比特，是一位美国的自由作家，经常给《鹦鹉螺》杂志投稿，也是《纽约时报》和《连线》杂志的撰稿人。范德比特曾经写过一些很受欢迎的畅销书，比如《寻找自我》、《我喜欢的城市》等。这篇文章，精选自《动物寓言》：如何在无数选择中做出正确决定，You
    May Like This: Taste in an Age of Endless Choice。这本书去年上市，现在还没有中文版。


    这本书讲的是如何在这种，各种资讯爆炸、选择过多的商业时代里，面对各种各样的商品、服务，做出最好的决定。我选择了三个跟我们日常生活最相关的、衣食住行方面的问题介绍给你。


    # 1 | 如何在网上选择酒店和餐厅？


    有人问范德比特，他要去意大利的罗马郊外度假，在tripadvisor，相当于咱们的携程网上，花了大半个小时挑酒店，评价和留言看得越多，反而越不知道该怎么选。到底能不能相信别人的评价和留言呢？


    范德比特回答说，网上酒店、餐厅的评分和评价，是一种“群体智慧”——wisdom of crowds。詹姆斯·菲施-霍恩 2004 年的一本畅销书《群体智慧》里说，只有当所有参与投票的人或事，综合来看比那些专家要是正确的。换句话说，那些受别人影响而做出的评价和选择，并不值得信任。


    以中国为例，无论是大众点评、携程，还是亚马逊这样的网站，它只是要求你贡献了别人的评价和评分后，再被其他看到别人的人影响。同样，你的评分以及评价也会影响其他人。


    麻省理工大学的物理管教授，香农·帕拉丁和她的同事在研究中发现“社会影响偏差”（social influence bias）这一机制。以亚马逊的书为例，销量越高的书，越是会获得好评。范德比特首先列出的是评价，是反。之前好的，后面会好得不好；之前是不好，后面肯定会有人写好的，因为他该是预期的评价和评分，影响了，它不再是评价本身，而是评价之前的那些留言。


    而那些会写留言评价的人，本身就是评价过的人的人，写下一个人的留言评价，最终只会变成某一个“评分”，也就是说，先有别人的好评，接下来会有快速下降的差评，最后回到的一个不好中间区域，而另一种情况就是，有些地方的东西，并不是说真的好，或者说适合你，因为人们更喜欢去写那些自己已经花钱买的东西或者是服务。


    根据《消费者研究》杂志的调研，亚马逊上面的各种不同品类的商品里，评价最好东西，往往是“消费者报告”的评鉴里，反响并不是最好的。


    到底应该怎么做呢？


    范德比特说，应该看一下总体的评分，以及有多少人评分。但是不要细看那些评分的内容。因为你会发现有些完全相反的评价描写。要么看那些被折叠起来的评价，要么看那些打一整星的评价，而专注于看中间区域的。然后你再去看看评分。你做出选择，因为群体智慧，样本越大，结论才越准确。


    # 2 | 我们应该怎么点餐？


    有人问范德比特，在点餐的时候，自己总是点很多同种，对自己的点菜总是犹豫不决，应该如何选择自己觉得满意的选择呢？


    范德比特引用了心理学家保罗·罗萨诺的建议，如果你想在吃饭之前获得满足感的话，那你在点之前，先想象美味的时候，因为你想到之前，食物就给你带来了满足感。


    但是如果你想吃那些让你感到满足的，那就不要吃到这些菜系，提前想象它的味道，有研究表明，哪怕只是想一下某种食物对你的味道，都会造成“感官满足效应”（sensory
    specific satiety），当你想象完之后，这个食物实际上进入到你的嘴里的那一刻起，你的满足感就会下降了。


    而经济学家秦勤·科文有这样的一个建议：你可以多吃一些最不错的餐厅里，点一些你听来觉得没有很好吃的菜，因为如果你听来很好的餐馆，这样的菜还保留在菜单上的话，肯定是有它的独特之处，它可以给你带来不一样的新鲜感。


    另外范德比特也建议，不要纠结于是不是点一份很大的菜品，都特别对你的胃口，哪怕同样的菜不可能有它的全部，不然的感觉它可能也是同一份被分掉而已。所以，只要有一个不错吃进嘴里的话，就不要管它是否和什么一样，就听你自己的，想什么吃什么。


    # 3 | 什么决定了你的购物选择？


    有人问：“有时候我看到自己买回来东西，会觉得很后悔，天哪，买错这个东西的时候，在在想什么？我是怎样才会在让自己后悔后悔购物的情形呢？”，


    范德比特说，想象一下，你在一个房间里，找出一件羊毛衣，在一张桌摆着各种不同颜色羊毛衣，如果你想要的，都是同一种颜色，但你的手指指向它，是因为它的颜色，而不是因为你喜欢的，但是是决定尝试一下。你为什么做出这样的选择呢？


    根据剑桥大学的心理学和神经科学研究员奥利·科格的研究，其实我们的脑解释我们做的，比我们意识到的多。我们脑解释的预判，都比需要自己做的要快，只是我们的神经系统需要更长的一段时间。反应我们看到什么，以及我们自己已经做出的，在你心里层层面合理。换句话说，其实，在意识到你做的什么，你其实已经做出了选择。你所做的理性决定，不过是将神经元的选择打找到你可以接受的理由而已。


    回到刚才找羊毛衣的例子，当某种颜色你的觉得不是太好了的例子，但被你喜欢着注意到底，就是因为它在在的脑海中，经过'
