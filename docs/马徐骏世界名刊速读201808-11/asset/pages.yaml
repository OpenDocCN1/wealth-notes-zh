  md: '# 《哈佛商业评论》｜如何准备一场“杀手级”演讲


    马徐徐


    《马徐徐·世界名刊速递》本期为你讲述《哈佛商业评论》的文章。


    公开演讲是这个时代非常重要的技能。TED论坛的掌门人克里斯·安德森教了很多TED的演讲者，他有哪些演讲技巧分享给大家？


    在这条音频中，你会听到：


    +   - 一场精彩的演讲需要什么样的主题？

    - 什么样的演讲形式更好？

    - 如何克服演讲中的紧张感？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_49_0.png)


    # 知识清单：


    # 今日关键词


    killer presentation：特别惊艳、精彩绝伦的演讲。我们知道killer这个单词是“杀手”的意思，放在名词前面表示“杀手级的”，比如“杀手级应用”是killer
    app，“杀手级产品”是killer product。


    # 如何做出精彩绝伦的演讲


    今天的内容，来自《哈佛商业评论》的一篇旧文，是著名的TED论坛负责人，克里斯·安德森讲演讲技巧的，标题叫《如何做出精彩绝伦的演讲》，*How to Give
    a Killer Presentation*。在这篇文章里，克里斯·安德森把他对于演讲的理解，以及TED是如何帮助演讲者准备演讲的一些干货都分享出来了。


    # 一个完全不会演讲的孩子也可以登上TED的舞台


    有一次，克里斯·安德森和同事在非洲肯尼亚出差，他们遇到了一个叫理查德的男孩，他给他们讲了一件事：理查德家里是放牧的，住在家旁边，国家公园里面的狮子有时候会跑出来觅食，国家公园里面的狮子，于是他们就得想办法来保护自己家的羊。理查德发现，如果放一个稻草人或者夜里放一个灯在那边，对狮子是没有帮助的，狮子不怕，但是如果他举着火把在那边走，忽明忽暗，而且位置有移动的话，狮子就不敢靠近。于是理查德得到了启发，他拆了家里的录音机，用废旧的汽车电池，自己组成了一个装置，一个这个在黑夜里会有间歇地轮流亮灯，就好像是有拿着火把在走来走去。用这种方式，理查德成功地在不伤害狮子的情况下，保护了自己家的羊。后来这个装置还被推广到了肯尼亚其他的村庄，大家把它称之为lion
    light——逐狮之光。


    克里斯·安德森觉得这个故事非常棒，很值得在TED论坛上面给大家讲。但是，问题来了，首先理查德年纪太小，只有12岁，而且特别害羞，他又是一个黑人男孩儿，英语很差。在TED这样一个世界级的舞台上，他要面对的是1400名付费的听众，下面坐着的是包括比尔·盖茨这样的社会名流。


    但是最终，当理查德登上TED讲台的时候，取得了非常惊人的效果。克里斯·安德森的原话说，*Every time Richard smiled, the audience
    melted*（每一次理查德笑的时候，下面的听众都能融化了）。在这个演讲视频中，你可以看到，一个不会演讲的，12岁的，害羞的，英语很差的非洲男孩是怎么在世界级的演讲台上，做出了极其优秀和成功的演讲。


    # 克里斯·安德森的建议


    建议一：演讲必须有一个好的主题


    你得有一个好故事值得分享给大家，这件事必须是你自己印象非常深刻并且对你有所触动的，才能对观众产生影响。


    克里斯·安德森特别提醒，不要试图把所有的东西都放在一个故事里面，你什么样的人生经历，你是怎么从无到有创立一个公司等，大而全是不行的，切口要小，要有丰富的细节，同时要把难懂的概念简洁明了地表达，少用术语。


    你要引领观众一起思考，克里斯·安德森打了个比方：一个好的演讲就像一部侦探小说，在听的过程中，听众应该有那种智力被'
