  md: "除了享受“共享经济”的红利，也有更多的婴儿潮一代瞄准了“创业”。据考弗曼基金会（Kauffman Foundation）的统计，在美国，55～65岁的人创可选的可能性，比20岁~34岁的人高出65%；在英国，70岁以上仍在工作的人群中有近60%都是创业者。\n\
    \n别觉得老年人创业就是为了打发时间，文章里说，有大量的科学研究发现，老年人的生产效率会随着年龄的增长而衰退，但如果加上知识和经验这两个变量，老年人是具有独特优势的。\n\
    \n比如说，社交技能在AI（人工智能）领域里就属于稀缺品，这个时候，具有丰富社交经验的知识型老年劳动者就有了无可替代的优势，可以把自己的生活经验用在AI的社交能力提升上。\n\
    \n所以，拥有强知识储备和高层社交技巧的年龄员工，越老越成为香饽饽。这也激励着我们每一个人，都该保持终身学习的觉悟。\n\n# 新生代老年人（The New\
    \ Old）的消费模式\n\n新生代老年人的消费能力潜力无穷，根据市场调研公司Euromonitor的报告预测：到2020年，全球超过60岁的家庭总支出会高达1.5亿美元，为2010年的两倍，而其中绝大部分会用来娱乐。\n\
    \n根据美国探险旅游贸易协会的数据显示，超过40%的探险旅行者是50岁以上的中老年人，而在英国，65～74岁这个年龄段已成为探险旅行产业增长最快的年龄段。\n\
    \n这个年龄的消费群体，还有另一个市场——约会。在“在线约会”现在绝对不是只针对年轻人的业务。相比于年轻人，老年会员更愿意为有价值的约会服务买单，由此也诞生了Stitch这样专门针对老年人群的约会网站，同样的情况也发生于老牌约会网站match.com，超过1/4的会员在53岁~73岁之间。\n\
    \nThe New Old这一新兴市场有它的特点，文章说，他们一般不把自己当做老年人，这和小孩子不想别人把他们当做小孩是一个道理。老年人往往对那些专门针对他们的广告十分反感。英国最大的50+社群Silversurfers.com的老板Martin\
    \ Lock说：“如果在给老年人广告投放过程中让他们感觉不舒服了，他们会第一时间离开的那批人。”\n\n总结一下，哪怕人类的寿命越来越长，但如何面对衰老，却是每个人都要面对的问题。这篇特别报道告诉我们，而且也没这个时代中老年人来说，借助信息科技的帮助，退休可能只是新工作、新生活的起点，就像文章里说的，“我的人生我做主”。\n\
    \n> Now I manage my own future, I manage my own life.\n\n推荐阅读：《经济学人》|教育的未来\n《经济学人》|比特币是一种健康的泡沫\n\
