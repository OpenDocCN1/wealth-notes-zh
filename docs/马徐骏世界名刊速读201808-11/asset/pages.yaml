  md: '钱。市场不关心你对员工好不好，有没有对员工负责、有没有考虑员工的退休养老等等。


    那么什么人在这种环境里比较吃香呢？就是那些能够长时间、高强度工作、完成短期项目的人。很少有公司会胡诌，他们实际上就想招那种“有活你就来，短平快地给我干活，干好你就走，别占用太多的资源”的人。


    在新自由主义的浪潮下，员工与公司，不再是依附生存的关系，而是合作共赢、相互选择的关系。看清楚变化的员工，反过来也绝不会去期待公司对他们的未来负责，他们在接受一份新工作的时候，就在为下一份工作做准备，这就叫跳槽经济（quitting
    economy）。


    # 跳槽经济对我们意味着什么


    跳槽经济是公司与员工之间的一种动态关系。即公司要尽量压缩成本，按项目招人，活干完了就可以走了，也不期待员工对公司的忠诚度。对于求职者来说也是这样，每一份当下的工作，都是在为下一份工作做准备。


    在跳槽经济这种动态关系下，作为一个求职者，好工作的标准以及你与同事的相处模式都会有翻天覆地的变化。


    # 1. 好工作标准的改变


    在过去，好工作的标准是：薪水福利好、离家近、加班少、老板为你考虑未来、同事素质高、升职路径清晰……这些标准，占的多，那就是好工作。现在可不一样了，在跳槽经济下，好工作的标准是：要么这份工作能让你学到或者强化一些技能，让你为下一份工作做好准备；要么就是这家公司名声非常好，其他公司很愿意从这家公司里走出去的员工。


    那么什么是好工作呢？比如，在这家公司里，学的东西过于具体，只适合这家公司的这份工作，没有办法将这些技能用到一份工作当中去，或者是这份工作总得加班，你都没有时间去寻找其他的机会。


    所以，跳槽经济下，好工作的标准就是它能否帮助你找到下一份工作。这甚至不是未来的趋势，在美国硅谷工作的技术人员早就意识到了。当时，伯克利大学的社会学家莱纳德·黄（Linus
    Huang）在硅谷公司上班时，这个公司主要的业务使用的编程语言是C++，而当时另外一种编程语言Java开始崭露头角，成为很流行的编程语言。这家公司的员工在挑选要参与的项目时就倾向于去挑能够让他们使用Java语言的项目，因为这样可以让他们在市场上更有竞争力。


    # 2. 和同事相处模式的改变


    过去，工作最重要的是给上级留下好印象，比如说稳重能干、认真尽责。而且，你与同事还存竞争关系。在新的跳槽经济下，你和同事之间的关系特别重要了。因为工作一直在动态变化中，人员流动的速度也比以前快很多。如果你的同事先跳槽到另外一个公司，找到了一份很好的工作，那么他就会成为你非常有价值的资源。如果你的同事很欣赏你，他甚至可以直接向公司推荐你。反过来，你对你的同事，也有同样的价值。


    # 3. 招聘标准的改变


    跳槽经济下，人人都在为下一份工作做准备，这个时候谈对公司的忠诚感、归属感就没必要了。招人的时候，什么重要？激情——passion！在美国，大家有一个共同的文化认知，对他人自己做的事情有激情，才会努力去做。


    文章中引用了一个招聘经理的话，他说他在挑选应者者的时候，如果一个人看起来对年工作特别有激情，另一个人看起来很富有经验，那么他宁愿去招聘那个更有激情的人。工作所需要的基本技能，都可以学，如果你对工作要求的热情，肯定做不好。公司不在乎你熟悉不熟悉公司，他们在乎的是你能不能把你的注意力集中到项目当中去，快速、高效地完成它。


    哈耶克认为，面对高度复杂的现代经济，人类如此渺小，让市场组织大规模的生产和分配活动，是最好的办法。哈耶克明白，在自由主义经济下，需要新型工作者，但他没有给出“如何做职业决策，规划职业生涯”的方法。


    这个问题，另一位诺贝尔奖获得者盖瑞·贝克（Gary Becker）提出了解决方案，他提出了人力资本的概念（human capital）：人人都应该把自己当做一个小企业，需要具备大量的技能、素质的经验，并打开视野和人脉，简单地说，每个人都应该是自己的CEO。'
