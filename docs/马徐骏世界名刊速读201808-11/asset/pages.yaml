  md: '# 《彭博商业周刊》| 人工智能宝宝即将到来


    # 1、马徐盛


    新西兰一家公司制造的人工智能宝宝，具备了人类的外貌，和人类极其相似的大脑神经连接，而且还能够像人类一样主动探索、学习。这是它怎么做到的？在今天的文章中，你会了解：


    +   1. 什么是人工智能宝宝？

    2. 为什么要做出一个虚拟的人工智能宝宝？

    3. 拥有什么样的技能才能实现这一创新突破？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_137_0.png)


    # 知识清单


    # 今日关键词


    **humanize** [hju:manaiz]：human我们都认识，“人类”的意思，后面加上-ize就变成动词，“使...具有人性”的意思。比如“让AI更智能人性化”就是“humanize
    AI”, 这个用进“性...有人情味”的意思，比如说“让城市生活更有情感”就是“humanize city”。


    **lifelike**：栩栩如生的，逼真的。


    # I 人工智能宝宝即将到来


    今天的内容录来自《彭博商业周刊》的封面文章《A I 宝宝要即将到来》，*AI Babies Are Coming*, 作者阿什利·邦尼是一名专业专栏作者。


    斯佩伯格指曾经执导一部电影《人工智能》（AI），讲述了一个拥有人类外观的机器人男孩大卫，一个他渴望与人相处，融入人类社会，寻找爱的故事。


    我们一般会觉得，现实生活中的人工智能，像苹果手机的Siri，或马斯克的自动驾驶汽车。这些简单而直白的，跟人类有相似。不过这篇文章告诉我们，随着人工智能的不断发展，电影中的场景已经离我们不远了。


    有人做出了一种人工智能宝宝，它在形象上已经具备了人类的外观，而且拥有和人类极其相似的大脑神经连接，还能像人类一样主动探索、学习，简直可以说是人类的数据版。


    当某一天，材料科学发展发达，人工智能宝宝的系统就可以直接嵌入和人类外形一样的机器人的躯体里，那些电影中的场景，什么机器人管家、机器孩子就都实现了。


    这个技术究竟是怎么回事？又是怎么做到的呢？


    # I 像人类一样思考的人工智能


    上面提到的人工智能宝宝就是Baby X，它是一种由一家叫做“灵魂机器”的公司所制造的新虚拟形象。主导者是这个公司的创始人马克·塞格尔（Mark Sager），Baby
    X的形象来自马克的女儿，非常漂亮可爱，和真人婴儿没什么差别。


    它可是一个简单的虚拟形象，在精致的面孔背后，是灵魂机器公司开发出的前所未有的虚拟神经全脑。Baby X的大脑结构和现代计算机完全照人类，包括大脑皮层和外部到脑干的反应。比如说，如果Baby
    X的大脑在受到外界刺激时放电信号，它的视觉大脑，内部和血液脑，它就会做反应。这个过程和人类大脑的运作过程极其相似。


    现在，Baby X 已经升级到第五个版本，和人类的距离又近了一步。如果在她的面前放一个玻璃碗里的硬币，在这个屏幕上的反应和真人小孩是一样的。它会用手里在屏幕上的硬币，注意，它可是自己主动做出的行为，没有人给它这个指令。


    当Baby X 的手指按下钢琴键时，它会把产生的声纹传送到Baby X 的生物模拟大脑里，触发它听觉皮层里的听觉波段。如果它按照节奏多敲，它的大脑就会慢慢放松。这些体验结合到一块儿，就为我们带来了人类发明新事物、探索学习时的感受。


    这个意义特别重大，塞格尔的目标就是让Baby X 无限接近人类。


