  md: '# 《经济学人》你对自己的手机享所有权吗？


    数字时代，所有权的定义正在悄然改变。比如说，我们真的对我们的手机完全拥有所有权吗？


    在文章的内容中，你会了解：


    +   - 产品所有权发生了怎么样的改变？会带来什么样的问题？

    - 什么是维修权运动？

    - 消费者和商家的矛盾在哪里？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_177_0.png)


    # 知识清单


    # 今日关键词


    ownership [a''unəjip]：所有权。Owner 是“所有者，主人”的意思。ship 这个后缀 很常见，在这个词里表示“身份和资格”，比如，citizenship
    就是“公民身份和公民 权”。Ownership in the digital age，意思 是，数字时代的所有权。


    tinker [''tīkə]：修补、修理。意思是补充 修理（repair）。你会发现这个词形象， tinker 这样叮叮当当的词就是修理时敲敲打打 发出的，而我们这个字的意思就是这样，
    从前是代表了对某个东西任意放置样 东西，throw away（丢弃）或者 tinker（修 理），是如今正在发生着的样子。


    # 1 数字时代的所有权


    今天我们读到《经济学人》杂志的封面推荐 文章，你确定你拥有你自己手机的主权？ 《数字时代的所有权》，Are you sure you own your phone?
    / Tinkering in the digital age，这次《经济学人》花了2篇文章来讨论 一个“正发生着的变化”，那就是，数字时 代，产品的所有权正在发生变化。


    从前，所有权这件事是不存在什么争议的。 你买了一个东西，这东西就是你的，坏了 你可以修，自己修不好，找个修的修也行， 都随你。如果你不想卖了，可以将这个东西
    扔进垃圾箱，或者扔进垃圾桶。这是我们 一般人直觉里对于所有权的理解。


    但现在的问题是，消费者对于自己购买的 物品，所有权的范围越来越模糊，怎么处 理属于自己的东西也越来越复杂，不能 属于，而且这种情形有愈演愈烈之势。


    举个例子，就拿智能手机来说，手机的硬 件是你的，但里面的软件不是你的，你 只能是付费可以使用，而不能手机丢了； 无纸化，软件商也可以自己修改，甚至 不能找到人修，你必须送官方的维修点
    才行，不然就会失去保修的权利。


    数字时代，对于所有权的定义已经发生了改 变。


    # 2 消费者的抱怨和维修权运动


    我花了东西但是不能自己随意处置， 这听起来就很奇怪，但消费者也没办法， 因为现在很多硬件越来越复杂，软件在产品的 重要性越来越大，绝大部分消费者已经 没有能力理解这些复杂的东西，所以在购买
    商品之后，消费者处于被动的弱势。


    消费者的抱怨主要集中在三个方面：不自 由、不方便和隐私泄露。


    先说第一个自由。你花了很多钱买了东 西，却不能自己决定怎么办？不行！比如 埃隆·马斯克就不让特斯拉的用户，用特 斯拉来参与充电服务。说白了，不能 用来做Uber或者滴滴出行。


    其次是不方便。大部分人不会编程，但 在各种电器，从洗衣机到拖拉机，不再像 以前，大多简单的机械性产品，它们越来越 依赖大量技术，对软件的控制权越来越大。 功能是更多了，但是出了问题，消费者
    也没法自己修了。


    美国一个非常大的科技品牌商约翰-迪尔 拖拉机（John Deere）。它的制造商家不建 议大家出了问題自己修，因为这种拖拉机的 软件管得非常严格，普通人根本操作不了，
    只能送到指定的维修站修理，如果不行 自己动手维修拖拉机的事业。在这个时代 已经不太可能发生得了。这种修复起来特别 麻烦，甚至可能需要想办法改状态，造成 消费者额外麻烦，太大的产品就全坏了，
    直接放弃，这又造成了巨大的浪费和 污染。


    还有隐私泄露的问题。有一款叫 iRobot 的扫地机器人，不但在你家里跑地、吸 尘，还把数据卖给广告商，做有针对 性的广告。还有一款叫 We-Vibe 的成人
    玩具，需要靠网络获取有人陪伴万 式服务，因为有摄像头、麦克风之类 的时间就包含了你的私人信息。


    所以现在消费者开始抱怨，或者说不得 接受一个事实，我们并不像拥有自己 购买的物品的全部所有权，更像是没有被授权 的用户，并不是完全的所有者。


    所以在西方国家，从美国到欧洲，都发起 了一场叫做“维修权”的运动，right to repair，要求消费者能修理买到 repair，要求 消费者能修理买到
    repair，要求厂商提供一些 维修指南，一些零件的工具，至多是些 配件，不能自己重新维修。


    在美国，有十多个州，都已经在立法推动 这件事了，而欧盟也出台了相关政策，要 求制造和出售的产品能够容易维修。


    # 3 制造商的理由


    制造商也有自己的理由或者说苦衷。


    制造商现在的做法，主要是基于两方面的 原因。首先，在电器方面，电子产品能更 大全，全球生产，工艺复杂，一部智能机 里的各种组件，就远远这几家公司里它 的用户没办法完全搞清楚，怎么可能让消费
    者自己动手呢？万一修不好，反而不能用了。提供的更多的配件流入市场，又 会造成假冒商品的越来越多，损害消费者的 利润双方的利益。


    另外一点是出于安全考虑。因为现在各种 电子产品里，涉及个人隐私的成分越来越多，比如指纹识别甚至是面部识别功能， 那么用以类，如果说开放维修，让消费者 自己处理，或者交给第三方去修，万一
    隐私泄露，谁来负责？


    文章里说，在未来，所有权问题会变成一个 很大的争论的根源，因为电子产品越来越 复杂，各种服务越来越依赖软件，而 软件的版权越来越受到保护。消费者要 减少自己的数据流出来的话。


    举个例子，像我们都知道的亚马逊出品的 智能音箱echo，其实它的定价来说，可以 说是公司的，但是它可以帮助亚马逊收集 大量用户的语音信息，再用来输送服务，
    广告、网购，从这个角度来来说，亚马逊 赚了。商家提供很低的价格售卖硬件， 让用户得到了实惠，但也要付出代价：用 自身数据，来获取额外的利润，不然就不是 生意了，也长久不了。


    所有权这个词真的是公说公有理，婆说 婆有理，大家都知道自己的立场，但就像 文章最后说的那样，所有权不会消亡，但是 它的定义正在逐渐改变。


    其实随着技术不断进阶，我们的生活会越 来越方便，但与此同时，也一定会付出代 价，比如让渡一部分隐私或个人空间。这 个过程可逆吗？不可，但我们该 做好准备。'
