    马徐骏

    《马徐骏 世界名刊译读》本期为你讲述《哈佛商业评论》的文章。


    你对自己的认知和结果，可能与职场上别人对你的评价，相差十万八千里。哪些性格会对我们的事业造成严重损害，又该如何改变自己的性格表现呢?


    在这条音频中，你会听到：


    +   - 什么是职场性格阴暗面？

    - 我们用什么方法来测试自己的性格阴暗面

