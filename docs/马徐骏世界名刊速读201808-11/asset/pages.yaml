  md: '# **家庭背景声丨英文朗读威廉·怀特《十月午后漫步》**


    威廉·黑尔·怀特是英国小说家、批评家和宗教思想家。他喜好山水，这篇游记小品率真自然，流露出超然物外的情趣和洒脱。初秋时分漫步田野，农家风光尽收眼底。天上彩云朵朵，地上落英缤纷，成群的绵羊，赶车的农夫，生机盎然，像一幅优美的油画。


    这篇散文里的拟声写法，是威廉·怀特用单音节词创造出来的，自然景物发出的韵律，我们在聆听时可以特别注意。


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_167_0.png)


    威廉·黑尔·怀特 (William Hale White，1831.10.22—1913.3.14)


    # [ An Afternoon Walk in October ]


    It was a day by itself, coming after a fortnight''s storm and rain. The sun did
    not shine clearly, but it spread through the clouds a tender, diffused light,
    crossed by level cloud-bars, which stretched to a great length, quite parallel.
    The tints in the sky were wonderful, every conceivable shade of blue-grey, which
    contrived to modulate into the golden brilliance in which the sun was veiled.


    I went out in the afternoon. It was too early in the year for a heavy fall of
    leaves, but nevertheless the garden was covered. They were washed to the sides
    of the roads, and lay heaped up over the road-gratings, masses of gorgeous harmonies
    in red, brown, and yellow. The chestnuts and acorns dropped in showers, and the
    patter on the gravel was a little weird. The chestnut husks split wide open when
    they came to the ground, revealing the polished brown of the shy fruit.


    The lavish, drenching, downpour in extravagant excess had been glorious. I went
    down to the bridge to look at the floods. The valley was a great lake, reaching
    to the big trees in the fields which had not yet lost the fire in their branches.
    The river-channel could be discerned only by the boiling of the current. It has
    risen above the crown of the main stone arch, and swirled and plunged underneath
    it.


    A furious backwater, repulsed from the smaller arch, aided the turmoil. The wind
    had gone and there was perfect silence, save for the agitation of the stream,
    but a few steps upwards the gentle tinkles of the little runnels could be heard
    in their deeply-cut, dark, and narrow channels. In a few minutes they were caught
    up, rejoicing, in the embrace of the deep river which would carry them with it
    to the sea. They were safe now from being lost in the earth.


    There is enough in a very common object to satisfy all our hunger—more than enough.
    I never leave the curve which limits the tops of the trees round that field without
    feeling that there is in it something which I cannot exhaust.


    The attraction is not the same as that of the ''view'' seen in passing. The ''view''
    of a mountain peak or a waterfall is a surprise. I stay alone with my field for
    an hour or two and it begets, in addition to growing sense of loveliness, a religious
    peace, victorious over trouble and doubt.


