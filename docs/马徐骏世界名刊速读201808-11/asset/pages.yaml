  md: '# **《BBC历史》| 圣殿骑士团的兴亡**


    马徐骏

    《马徐骏：世界名篇读法》本期为你讲述《BBC历史》杂志的封面文章。


    圣殿骑士团曾经是欧洲历史上最富有、也最有战斗力的一支力量，却在鼎盛之时遭受了突然的命途。究竟是什么原因让他们突然消失于历史之中？

    在今天的讲稿中，你会了解：

    十字军东征是怎么回事？

    圣殿骑士团为什么会成为中世纪最富有的战士组织？

    圣殿骑士团的灭亡给我们带来了什么启示？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_140_0.png)


    BBC History

