    complex: 这个词除了“复杂”以外，还可以翻译成一个心理学名词，“情结”，就是藏在人心中的无意识冲动。比如有人极度怀念校园，被称为有校园情结，叫Campus
    complex, 有人特别崇拜当兵的，有军人情结，就叫Military complex, 所以xx情结，可以自己组成词。


