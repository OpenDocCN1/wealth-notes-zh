    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_61_0.png)


    知识清单：


    # | 今日关键词


    +   - self-talk · think aloud：都是“自言自语”的意思。

    - private speech：speech是“演讲、讲话”的意思，这是“自言自语”在心理学上的专用表达。

    - inner speech：内部对话。不发出声音，脑子里自己和自己说。


    # | 人为什么要自言自语


    今天的内容来自《科学美国人》的封面推荐文章《人为什么要自言自语》，*Talking to Ourselves*。作者查尔斯·费尼霍夫（Charles Fernyhough）是杜伦大学心理学教授，他的主要研究方向是儿童发展和记忆，他最新出的一本
    书《心灵物语》，*The Voice Within*，讲的就是咱们今天的主题，关于自我对话的研究。


    你肯定有过自言自语的经历，比如说你从超市结账出来，突然发现自己忘了买牛奶，脑子里可能就会对自己说：“哎呀，忘买牛奶了！”有时候甚至是脱口而出。再比如，在给老板汇报工作前，你也许就已经开始在脑子里设想这个场景，怎么开场、怎么汇报、结局怎么收等等。

    咱们今天就来讲讲，脑子里的这些声音，到底是什么，对我们有什么用。


    # | 大脑里的声音是什么？


    这种在脑子里跟自己说话的现象，在心理学上叫做内部语言。我们与自己的交流，可以分成有声版和无声版，有声版就是自言自语，说出声来；无声版就是“内部语言”，发生在
    大脑中的对话，不发出任何声音。自言自语和内部语言，在 一个人的心智成熟过程中具有非常重要的作用。


    内部语言，inner speech，对我们来说是个新词，这个词是俄罗斯心理学传奇人物利维·维谷斯基（Lev Vygotsky）创造的。维谷斯基从心事理学研究将近10年，他不仅被认为是20世纪俄罗斯心理学的关键
    人物，还被选为20世纪世界范围内最有影响力的100位心理学家之一。因为他的思想和研究成果丰富、独到，影响范围广，不幸的是与莫扎特一样英年早逝，所以就被后人誉为“心理学的莫扎特”。


    维谷斯基认为，人类的内部语言是为了表达自己的思维与想法。内部语言的初级形态是自言自语，当心智足够成熟后，自言自语会逐渐内在化，转化成内部语言。无论是自言自语还是内部语言，它们都在帮助人们管理、调节自己的行为。

    这一点在儿童身上体现得就很明显。维谷斯基做过 关于儿童画画的实验，小孩在画画的时候自言自语地说：“铅笔在哪？他需要一个蓝铅笔。”当发现没有蓝铅笔的时候，如果是心智发展程度比较高的小孩，会继续跟自己说：“现在没有不要紧，我可以先用红笔圈，红色画圈得深一点，就像蓝色啦。”实验中，这个小孩就是通过自言自语的方式，调节自己的行为。

    在另一个实验中，一个五岁半的小孩在画一辆车 的轮子，这个时间铅笔断了，他就停笔在纸上画也没没画出来。这个时候小孩就会自言自语地说：“铅笔断了，我要拿一根其他
    的笔。”然后他会拿起其他 的笔来继续画画。有些时候，他还会做 出改变，比如说画一个玻璃电 车，然后 自己解释说：“碰车啊，电车撞车了。”'
