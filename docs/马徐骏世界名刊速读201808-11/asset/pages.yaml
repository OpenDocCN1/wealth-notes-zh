  md: '# Sunday Before The War


    On Sunday, in a remote valley in the West of England, where the people are few
    and scattered and placid, there was no more sign among them than among the quiet
    hills of the anxiety that holds the world. They had no news and seemed to want
    none. The postmaster had been ordered to stay all day in his little post-office,
    and that was something unusual that interested them, but only because it affected
    the postmaster.


    It rained in the morning, but the afternoon was clear and glorious and shining,
    with all the distances revealed far to the heart of Wales and to the high ridges
    of the Welsh mountains. The cottages of that valley are not gathered into villages,
    but two or three together or lonely among their fruit-trees on the hillside; and
    the cottagers who are always courteous and friendly, said a word or two as one
    went by, but just what they would have said on any other day and without any question
    about the war. Indeed, they seemed to know, or to wish to know, as little about
    that as the earth itself, which beautiful there at any time, seemed that afternoon
    to wear an extreme and pathetic beauty. The country, more than any other in England,
    has the secret of peace. It is not wild, though it looks into the wildness of
    Wales; but all its cultivation, its orchards and hopyards and fields of golden
    wheat, seem to have the beauty of time upon them, as if men there had long lived
    happily upon the earth with no desire for change nor fear of decay. It is not
    the sad beauty of a past cut off from the present, but a mellowness that the present
    inherits from the past; and in the mellowness all the hillside seems a garden
    to the spacious farmhouse and little cottages; each led up to by its own narrow,
    flowery lane. There the meadows are all lawns with the lustrous green of spring
    even in August, and often over-shadowed by old, fruit-trees - cherry, or apple,
    or pear; and on Sunday after the rain there was an April glory and freshness added
    to the quiet of the later summer.


    Nowhere and never in the world can there have been a deeper peace; and the bells
    from the little red church down by the river seemed to be the music of it, as
    the song of birds is the music of spring. There one saw how beautiful the life
    of man can be, and how men by the innocent labours of many generations can give
    to the earth a beauty it has never known in its wildness. And all this peace,
    one knew, was threatened; and the threat came into one''s mind as if it were a
    soundless message from over the great eastward plain; and with it the beauty seemed
    unsubstantial and strange, as if it were sinking away into the past, as if it
    were only a memory of childhood.


    So it is always when the mind is troubled among happy things, and then one almost
    wishes they could share one''s troubles and become more real with it. It seemed
    on that Sunday that a golden age had lasted till yesterday, and that the earth
    had still to learn the news of its ending. And this change had come, not by the
    will of God, and not even by the will of man, but because some few men far away
    were afraid to be open and generous with each other. There was a power in their
    hands so great that it frightened them. There was a spring in that they knew they
    must not touch, and, like mischievous and nervous children, they had touched it
    at last, and now all the world was to suffer for their mischief.


    So the next morning one saw a revisit in his uniform saying goodbye to his wife
    and children at his cottage-gate and then walking up the hill that leads out of
    the valley with a cheerful smile still on his face. There was the first open sign
    of trouble, a very little one, and he made the least of it; and, after all, this
    valley is very far from any possible war, and its harvest and its vintage of perry
    and cider will surely be gathered in peace.'
