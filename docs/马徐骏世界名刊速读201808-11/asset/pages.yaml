  md: '# 《人文》追求节俭还是享受奢华


    《人文》追求节俭还是享受奢...


    《人文》追求节俭还是享受奢...


    马徐捷 世界名刊通 本期为你讲述《人文》杂志的文章。


    节俭是古今中外令人赞颂的美好品格，然而漫长的历史却用各种方式证明了人们对于奢华的狂热追求。


    在今天的阅读中，你会了解：


    +   * 哲学家推崇的节俭和人类追求美好生活的矛盾。

    * 整个人类历史是如何对待奢华的？

    * 社会观念在如何变化？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_186_0.png)


    # Philosophers Who Like Stuff

    Their case against frugality


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_186_1.png)


    人文：Philosophers Who Like Stuff

    人文：Eryns Westcott


    # 知识清单：


    今日关键词


    frugal [ˈfruːɡ(ə)l]：朴素的，节俭的。比如，“节俭的生活”，英文就是 frugal life。这个词汇有个很有意思的过法，就是词源发意记，“瘸/断”，你，“瘸/断就够多了”，美国


    Luxury [ˈlʌkʃəri]：奢侈的，奢华的。比如，“奢侈品牌”，英文就是 luxury brand。有一个品牌是这个词汇就比较紧密，就是“力士”，它的英文就是l，就在暗示你你在使用中享受感官享受。


    # I 物质哲学家


    今天的内容来自《人文》杂志的《物质哲学家》，*Philosophers Who Like Stuff*，作者是纽约市布鲁盖德大学的哲学教授埃瑞斯·韦斯特科特（Eryns
    Westcott）。


    《人文》杂志第一次出现在我们专栏中，它是美国最大的人文期刊基金会之一，美国国家人文基金会（National Endowment for the Humanities）出版的杂志，是一本季刊，每季两期。今天这篇文章来它最新推出的秋季刊。


    这篇文章讲的是，无论哪个国家都把节俭当做美德，但整个文明的历史都在证明人类对于奢华的狂热追求，而今天，我们只是要大家是否要持续追求至今的价值，只是提供另一思考问题的角度。


    # II 自相矛盾的人类


    从古至今，无论是哲学家、宗教领袖以及各个流派的道德家，他们都推崇节俭以及简约的生活。比如说老子、耶稣、柏拉图、苏格拉底、卢梭、尼采、托尔斯泰，并且他们都能给出令人印象深刻的理由：比如，奢侈性的一节的生活可以培养美德，道德性的一节的生活可以培养美德，伯门中国还有一相关的成语：俭以养德。长远考虑追求的一节生活可以让你未来更幸福。


    作者说，这么多的圣人虽然都达到了这种共识——要节俭。但如果普通人的行为未对照的话，你会发现大多数的行为其实大大违背这一观念的。


    文章里说，从古至今，人们对奢华生活的追求一直在存在，如果说节俭是没说的形式出现的话，那么人们就在用自己的实际行动来追求奢华生活的诱惑，称赞美以有条件的支持。


    咱们先来明确一个概念，圣人所说的节俭 frugal 指的是在生活上对物质的要求极低，有点上《道德经》里的老子，一瓢饮，足食的的味道。如果说，也崇尚简单生活，我用的东西都是
    MUJI 的请记，那么叫“简约”，简约就是简单的生活，因为它同样表达了对物质更高的要求。


    # III 奢华在漫长的历史上留下的痕迹


    在古老的文献中，你可以看到很多人对奢华生活的描述。比如，荷马在《荷马史诗》就用充满激情的笔触细腻地描述了奢华生活的种种细节，《奥德赛》第四卷中，讲到传说中的美女人海伦的时候，会用到这样的描述：“海伦丢出了她穷芳玉的房间里镶工镶嵌的装饰”，欧的羊毛毯“绝迹红眼睛做成的‘钟’，总之，极其精美华丽。


    在《圣经》中，所罗门门的财富也不遗余力地描述。比如，所罗王门的所所有器皿都是金，银的做的，要记做林宰肉一切器皿都是金，没有银子，在所罗王门中，银子是什么都不算。


    马可·波罗，曾经在《马可波罗游记》中描述圣亚莫辉煌的宫殿大肆赞美。


    就连教堂和寺庙，也经常耗费巨资去修建筑，比如，罗马天主教有着出蓄了为建筑和装饰圣物得大教基出着建罪罪罪罪罪罪罪罪罪罪，当然这个为后来引发了宗教改革运动，在当时官方的解释是说，这为了上赞美上帝。


    虽然人们会认为，所罗门的财富、忽必烈的圣亚、圣彼得大教堂都是老老百姓的血汗钱换来，也给教皇们带来了诸法大改革，甚至引起了民众的反抗，比如说英国革命。然而，作者也特别强调，无论明确德，还是那个著名，普雷丹者都会自己的统治者拥有无上的财富而骄傲。比如，在法国中中中，他们会为你穷富的驿道面不心满意足，喝怕怕在今天，就算贫穷的国家，在别国领导人访问时，人们也都希望自己的国家富裕有优越，而不是节俭，已提供过分的。


    对于奢华生活的追求自古有之，但实际上，人们对奢华生活的理解是随着时间和社会的发展在变化的。


    # IV 大消费时代的观念转变


    18世纪是个特殊的时段，在这个世纪，出现了很多变化，文艺复兴、宗教改革、发现新洲大陆，技术革命，工业革命出现等等，随着这些变化也产生了新的思维角度，人们有着对待财富以及世俗欲望的新规条。


    其中影响力最大的就是西方经济学家伯纳德·曼德维尔 (Bernard Mandeville)，他写了一本名为《蜜蜂的寓言》主要讲的一个故事，说的是蜜蜂社会奢华之风盛行，而各行业都兴旺起来，后来他们改变了这种对奢华的追求，开始崇尚节俭，结果蜂群社会加开凋谢，最终被对手打败而散散了。


    在曼德维尔之前，柏拉图的《理想国》是主流观点的典范，强调的是为了物质和社会利益密切联系，强调个人只能建立强大和稳定的社会，发展，繁荣兴盛的社会也会产生优秀的公民，而曼德维尔与之相反，他将个人幸福和社会福利利益分开了。


    曼德维尔的思想影响了一位对后世影响巨大的人物，那就是鼎鼎大名的哲学家亚当·斯密，亚当·斯密在《道德情操论》中认同这个观点，他认为，人们追求“自己的名利以及满足自己的舒适欲望”，会被“看不见的手引导”而为整个社会带来利益，这就是咱们现在都知道的“市场的手”。


    亚当·斯密的好朋友，大卫·休谟 (David Hume) 也提出了类似的观点，他说，“为了装饰和安乐是更生产的商品增加和同祥，对于社会是最有利的，如果你一个人不追求这些奢侈品，人们将会变得懒惰，放弃对生活的乐趣，对社会也没好处。


    其他的哲学家也提出了支持的观点，比如，有人为，正因为人们追求奢华生活的追求，才创造了许多工作岗位。人们为了更好的生活，也会更努力工作工作。伏尔泰对此也有类似的观点，他认为，对奢华生活的渴望和享受是文明的一部分。


    从休谟到大消费的新时代，尤其是在当下这种大消费的当下时代，因为人们的增加、生活水平的提高，渴望与享受奢华生活以已经变成了主流思想中的一部分。'
