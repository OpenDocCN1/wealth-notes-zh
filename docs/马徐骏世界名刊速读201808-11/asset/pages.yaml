  md: '# 周末英语加餐| 十一种孤独


    马徐骏

    周末英语加餐| 十一种孤独

    马徐骏

    你好，欢迎来到《马徐骏•世界名刊速读》的Weekend Review，周末复习。


    本周我们学到的表达有：

    辞职：quit / resign

    王牌：trump card

    路毙之物：roadkill

    情商： emotional intelligence /

    / emotional quotient

    孤独：loneliness


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_46_0.png)


    | 辞职：quit / resign

    周一我们讲了万知网站的文章《跳槽经济》，The Quitting Economy 。

    经济环境的变化，造成了求职目的和职场关系的改变，这篇文章的核心是，跳槽经济下，好工作的标准就是它是否能帮你找到下一份工作。你得奔着提升自己的技能和人脉去，让自己变得更值钱。在这个时代，每个人都是自己的CEO。


    我们讲过，quit和resign的区别主要是搭配不同，quit a job 、resign from a job都表示辞丢一份工作。quit这个词还有放弃或戒除的意思，在李安导演的电影《断背山》，Brokeback
    Mountain 里，杰克对自己的同性恋爱人说：“我爱你爱得都疼了，艾尼 斯，我希望自己知道怎么才能忘了你”——You are too much for me,
    Ennis. I wish I knew how to quit you.

    这是一句多么简单却动人的独白，quit这个词用得简直太妙了，这句话也被翻译成，“我戒不掉你”。

    来源：《万知》跳槽经济下，如何找到好工作


    | 王牌：trump card

    周二我们讲了《连线》杂志的封面文章，《“万货商店”亚马逊的下一步》，Amazon’s Next Move 。

    亚马逊做音箱，开发人工智能Alexa，是为了争夺交互界面，让用户更加方便地购物。 Alexa 对标的科技产品是苹果的语音助手 Siri，还有微软的Cortana。Cortana来自于微软一款知名游戏《光晕》里的角色，这个角色就是一款人工智能。Cortana这个名字，来自丹麦传说里英雄霍尔格的神剑的名字。

    《连线》的文章里说，Alexa是Amazon未来的王牌。王牌叫trump card，trump这个词本意是“王牌”和“法宝”的意思，特朗普的名字就是这个词。也因为trump有这个含义，所以去年竞选的时候，特朗普的支持者打过出一句标语：“trump
    that bitch!” 意思是“干掉那个碧池”。语言不太文明，但这个双关用得很好。

    来源：《连线》|亚马逊的下一张“王牌”


    | 路毙之物：roadkill

    周三讲的是《经济学人》的封面文章《路毙之物》，roadkill。

    这篇文章说的是锂电池的高速发展会在未来的二十年内，替代内燃机引擎，从而改变人类的能源使用方式和社会经济结构。

    Roadkill，字面意思是“死于路上”，正确的翻译应该是“路毙之物”，就是在道路上不小心被碾死的动物。用在这里，是 指在前 进发展的路上，发动机是那个死在路边的roadkill。这里的roadkill跟trump一样，又是一个双关语，“双关语”英文是pun，它可以
    让语言表达得含蓄、幽默，而且能加深语意，给人以深刻印象。

    再举个例子，I used to be a banker，but then I lost interest，可以翻译为“我以前 是个银行家，但是我现在没有兴趣了”。或者翻译成，“我以前是那个死在路边的，而是我现在利息没了”。interest
    既有兴趣又有利息的意思，这是个典型的双关语。

    可以说，理解双关语是明白外国幽默感的重要一步。

