  md: '# **家庭背景篇丨英文朗读约翰·拉斯金《两条道路》**


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_139_0.png)


    马徐骏


    约翰·罗斯金是维多利亚时代英国著名的作家、艺术家和评论家。他的父亲是位富商，经常带他去欧洲各地旅游，这也让对建筑、艺术产生了非常浓厚的兴趣，对美怀有特别强烈的渴望。


    在这篇文章里，他告诉年轻人，当我们人生路口徘徊时，选择那条通往安宁和光明的道路是多么的迫切和重要。因为当时光已逝，你的双脚仍在黑暗中举步维艰难时，无论你如何呼喊，那逝去的一切都都不会回来。


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_139_1.png)


    约翰·罗西金（John Ruskin，1819—1900）是十九世纪英国著名的艺术史学家、美学家。他一生为美术、建筑、设计、风景、教育、文化、科学、哲学诸方面的学术、研究和批评作出了贡献，在十九世纪后期的文艺理论批评领域占有重要地位。他是十九世纪英国著名的艺术评论家、美学家，也是当时著名的社会活动家。


    # *The Two Roads*


    It was New Year''s night. An aged man was standing at a window. He raised his
    mournful eyes towards the deep blue sky, where the stars were floating like white
    lilies on the surface of a clear calm lake. When he cast them on the earth, where
    few more hopeless people than himself now moved towards their certain goal—the
    tomb. He had already passed sixty of the stages leading to it, and he had brought
    from his journey nothing but errors and remorse. Now his health was poor, his
    mind vacant, his heart sorrowful, and his old age short of comforts.


    The days of his youth appeared like dreams before him, and he recalled the serious
    moment when his father placed him at the entrance of the two roads—one leading
    to a peaceful, sunny place, covered with flowers, fruits and resounding with soft,
    sweet songs; the other leading to a deep, dark cave, which was endless, where
    poison flowed instead of water and where devils and poisonous snakes hissed and
    crawled.


    He looked towards the sky and cried painfully, "O, youth, return! O, my father,
    place me once more at the entrance to life, and I''ll choose the better way!"
    But both his father and the days of his youth had passed away.


    He saw the lights flowing away in the darkness. These were the days of his wasted
    life; and he saw a star fall from the sky and disappeared, and this was the symbol
    of himself. His remorse, which was like a sharp sorrow, struck deeply into his
    heart. Then he remember his friends in his childhood, who entered life together
    with him. But they had made their way to success and were now honored and happy
    on this New Year''s night.


    The clock in the high church tower struck and the sound made him remember his
    parents'' early love for him. They had taught him and prayed to God for his good.
    But he chose the wrong way. With shame and grief he dared no longer to look towards
    the heaven where his father lived. His darkened eyes were full of tears, and with
    a despairing effort, he burst out a cry: "Come back, my early days! Come back!"


    And his youth did return, for all this was only a dream, which he had on New Year''s
    night. He was still young though his faults were real; he had not yet entered
    the deep, dark cave, and he was still free to walk on the road which leads to
    the peaceful and sunny land.


    Those who still linger at the entrance of life, hesitating to choose the bright
    road, remember that when years are passed and your feet stumble on the dark mountains,
    you will cry bitterly, but in vain. "O youth, return! Oh give me back my early
    days!"


    > > “A little thought and a little kindness are often worth more than a great
    deal of money.”

    > John Ruskin'
