  md: '# 《卫报》逃离自我贬低的状态


    马徐发


    《马徐发：卫报导读速递》本期为你讲述《卫报》的文章。


    你不会不会有这样的想法，总是觉得自己配不上自己的成就，得到的，一切都是咎有？这种想法其实不是特例，它是一种常见的人格特质，被称为“冒名顶替综合征”。


    在今天的内容中，你会了解：


    +   1. 什么是冒名顶替综合征？

    2. 如何对付冒名顶替综合征？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_173_0.png)


    +   1. Feeling like an imposter? You can escape this confidence-sapping syndrome.

    2. 17:58 PM · 14th April 2021

    3. Figue by Nick Bloore


    知识清单：


    +   1. 今日关键词


    imposter [''ɪmpɒstə]：冒名顶替者。“冒名顶替综合征”的英文就是 imposter syndrome，而 syndrome 在 smwdan
    这个词属于难单词，一般在英文中说 这个的综合征、症候群等，都是用这个词。


    humble [''hʌmbəl]：谦逊。博学者人谦虚，如无傲人骄傲，英文就是 Knowledge makes humble, ignorance makes
    proud.


    「觉得自己像个骗子，配不上自己的成就」你可以选择逃离自我贬低的状态


    今天的内容来自英国《卫报》，标题是（觉得自己像个骗子，配不上自己的成就？你可以逃离这种自我贬低的状态），Feeling like an imposter?
    You can escape this confidence-sapping syndrome。作者菲奥娜·巴克兰是一位经验丰富的生活教练。


    你有没有过这样的想法？比如，考试取得好成绩，你觉得是因为题目太简单；赢得比赛或者中彩票，你不过是运气好；高成 1 班或中彩票，你不过是运气好；高成 1 班或中彩票，你不过是运气好；别人夸你漂亮，会觉得人家只是客套一下……


    如果你有这种类似的想法，你很有可能就是患有“冒名顶替综合征”，人群中的一员。


    1 什么是冒名顶替综合征？


    冒名顶替综合征，imposter syndrome 是由心理学家苏珊·A·鲍琳斯 R. Clance 和德维兹（Susanne A. Irimes）在 1978
    年最先提出的一个概念。注意，它不是一种精神疾病，只是一种人格特质。


    有冒名顶替综合征的人，他们没有办法将自己的成功归因于自己的能力，而是将成功归因于运气和时机比较好。更坏的是，别人可能认为他们并没有那么优秀，只是个骗子（imposter），他们还会觉得自己配不上所获得的东西，总是怀疑自己的能力。


    冒名顶替综合征这种特质，和不自信的区别，反而感受会不一样不自信，而且这种特质的人内心想法也比较复杂。


    澳大利亚大学的芭芭拉·奥克利教授（Barbara Oakley）给了一个例子，她说冒名顶替综合征是一种什么感受呢？就像是一个教室，一个学生的感觉里面有一盘蜡烛。上课的时候，这个学生看到他的这张桌子上放的是“蜡烛”：他说，他看到别人的老师问他们的课题，他老师问他，考试的话分数也不低。但是我不行，这些年大家都帮我编了，不管老师、朋友还是家人，他们觉得我是凭靠优秀才考上这个专业的，但是我自己知道，不是这么回事儿，如果我下次考试题难一点，我就完了，我就是一阵废物。


    这个学生以为全世只他这么想，但你开一个上帝视角，就会发现，其实很多人都会有这样的想法。


    不止普通人会这么想，名人也会有这种情 况。比如名电影《哈利·波特》中饰演魔法演员的马文·沃森。她在接受采访时就 曾说过，她觉得不应该因此获得成感的，感觉自己像个骗子，而且觉得自己低微，遭受很强大，这就是典型的冒名顶替综合征。


    除了觉得自己的表现有别人认为是优秀 外，有些冒名顶替综合征的人还可能会感到，有人因为冒名顶替综合征的能力其实没有那么强，他们会过度努力，导致自己和他人的压力很大。有些人会情不自禁地去做，有些人会有很多人会情不自禁地去做，有些人会出现焦虑和压力情绪；有些人就是情不自禁地做出自我贬低。


    1 如何应对冒名顶替综合征


    用一句话来概括方法就是：认识自己，分享感受，接受不完美。


    认识自己，指的是你要意识到你的能力有一个清晰的认知。当你知道你能做什么，你就会知道你并没有被束缚有你的并不具备的能力，这件事。有冒名顶替综合征的人，会很多，但是这也需要时间。所以，作者说，你可以先观察你出现冒名顶替综合征时你身体和心理的反应，也许你的情绪会不舒服，或心脏会狂跳，用你的心中不断摸索着“别人会发现我挺废的”这种想法就是提醒自己，这不是真的，只是自己的感受。你能意识到它存在，就通过练习去控制它。你的存在，就通过练习去控制它。你的能力其实没那么差，你的能力其实没那么差，你的能力其实没那么差。


    冒名顶替综合征非常普遍。美国乔治亚州大学的研究者发现，在接受他们的采访的耶成功的女性中，有 93% 的人都曾遭遇过冒名顶替综合征。之所以大家谈论得很少，是因为大家觉得只有自己是这样想的，害怕被别人发现自己在想这些，于是保持沉默。


    但是如果有人提起这个话题或者分享这种感受，你会发现，绝对会有很多人长期感到内疚，因为他们发现，原来不只有自己会这种感觉。


    这个时候，找一个和你关系比较近的人交流很重要。你的伴侣、朋友、尊敬的老师、长久以来较好的父母或朋友。当你们谈论你的感受。最好找那些真正可以让你打起精神的人。和他们谈论生活、谈工作、谈论未来。谈话会打开，只能靠自我重新鼓起精神。当然，如果你给自己找一个精神导师，这个人都能在工作和生活中给你引导，那个新就能大作用。


    作者在这里给了小提示，如果你的交流对象，仅仅是跟我说“别乱想”，那你就可 以换个话题了。因为假如你可以主动停止这种感受，你就早就可以自己了。


    作者还建议说，要接受不完美的勇气。假使我们对自已经有耐心，就会让我们很难看到进步，人都是在前进的过程中 不断调整、不断进步的。生活也好，工作也罢，本来就有高峰、有低谷。当我们
    状态出现波动时，可能会疲惫，会犯错，然后就要接受自己，为自己有能力把事完成工作。其实，你需要的是多点时间，多点尝试。


    最后作者也建议，在你的心理赢得微优势，配合冒名顶替综合征状态也是好的，这一点，就是谦逊（humble）。


    好，总结一下今天的内容，也许你的学历很高，工作做得很好，但你觉得自己这些成功都是因为有运气好，而不是因为你的能力。你假装别人有一天会发现，其实你没有他们认为的能力配不上。总而言之，就是你觉得你的能力配不上你的成功……


    如果你曾经有过这种感觉冒名顶替综合征的感受，请信任，这并不丢人，只是你自己的感受。认识自己，去认识自己，找到自己身边的人帮你来认识和你自己。我们可以用对话获得清晰的认知，也需要给自己成长的空间。'
