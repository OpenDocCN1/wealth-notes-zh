  md: '好，总结一下今天的内容，《精益创业》中最小化可行产品和验证式学习是莱斯的两大招数，通过通用电子的例子咱们也知道确实是有效果的。这种方法其实在我们的身边也很常见，比如说美剧，有的就是一周拍一集，收视率高就一直拍，实在不好就砍掉，这不就是典型的精益思维么。再比如学英语和健身，这是咱们最感兴趣的两件事儿了，动辄报很贵、时间跨度很长的学习班，办很贵的健身卡，觉得自己从此以后都会努力，人生就不一样了，但可能学习班和健身房没去几次就不去了。


    咱们利用精益思维来想一下，你想学英语，与其买来词典，报各种班，不就如从最简単的事情开始，每天都跟读五遍金句，每次记住一个表达，边学边改进，可能某一天脱口而出一个地道表达就惊艳四座。方法其实不难，难的是愿意不断试错不断改进。正如文章里所说，每个人都做得到改变，你所需要的仅仅是勇气。欢迎你在留言中讲讲你会用精益思维来做什么，给自己一个有无限可能性的开始。


