  md: '# 《福布斯》深度专访特朗普：胜者为王


    马径俊


    《马径俊 世界名刊速读》本期为你讲述《福布斯》杂志的封面文章。


    这是在某期访谈专栏中，《福布斯》杂志对特朗普所做的深度专访。


    在今天的内容中，你会了解：


    +   - 特朗普做一切行为的根源在哪里？

    - 他如何处理商业及政治问题？

