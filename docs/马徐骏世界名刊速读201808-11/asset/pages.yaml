  md: '诊断出来了，但是这个病在被最终确诊前的15～20年就病了。也就是说，这些女性在50岁左右的初发的时候，就有了阿尔兹海默症，只不过症状很轻，很难被发现，而这个时间段，也是更年期发生的时间。


    阿尔兹海默症和更年期对大脑造成的改变也很类似。一些研究者认为，为什么女性更容易患阿尔兹海默症？可能就是更年期荷尔蒙变化触发了阿尔兹海默症。


    阿尔兹海默症的研究者也证实了这个说法。纽约大学的莉莎·莫斯科尼（Lisa Mosconi）曾和他的同事，使用脑部扫描技术来测量阿尔兹海默症患者不同的脑区域的葡萄糖代谢情况，他们发现，葡萄糖代谢降低，是阿尔兹海默症的典型特征之一；而大脑葡萄糖降低，也是更年期的典型变化。二者再一次展现出一致性。去年，研究者布林德得到了1000多万美元的基金支持，作为他进一步研究的经费，就是研究更年期大脑变化与阿尔兹海默症之间的关系。


    也就是说，更年期会导致大脑的脑浆降低，诱发阿尔兹海默症，那有没有治疗方法呢？


    # 更年期是否需要治疗？


    在更年期是否需要治疗上，文章指出，目前社会对于更年期的治疗关注不多，主要原因是社会整体文化，也就是说，更年期大多数女性都要求轻度的过程，忍一忍就过去了。但是这是不对的，到底是否需要治疗，应该取决于女性的身体状况。不是所有女性在更年期都会出现难以忍受的症状，也不是所有更年期的女性最终都会得阿尔兹海默症，但是如果症状特别严重，就需要治疗。


    一个非常流行的治疗方法是荷尔蒙替代疗法，这个替代疗法的基本逻辑就是：女性不是在更年期身体分化的荷尔蒙变少了吗？那就给这些女性补充替代的荷尔蒙。这个疗法在二十世纪80-90年代期间非常流行，但在临床实践中发现，它会让女性乳腺癌和心血管疾病的风险增加，于是，使用这个疗法的人就越来越少了。


    文章指出，这个疗法不应该完全被放弃掉，当年临床实验的失败，主要原因是参加实验的女性，年龄都在65岁以上，都接近了更年期窗口期。而实验采用的替代荷尔蒙来自于怀孕的母马，它们的荷尔蒙和人类有异，总之还是有差别。


    荷尔蒙替代疗法最好在更年期初期，大脑细胞还健康的时候使用。女性不应该害怕荷尔蒙替代疗法，如果说她的更年期的症状十分严重的话，在短时间内使用少量的荷尔蒙替代疗法，就可以极大地解决她们的问题。


    在饮食上，作者还建议女性可以适当补充脂肪类的食物，但是注意，是适当补充，并不是鼓励吃高脂肪的饮食，像花生、核桃等，都是脂肪类食物。健康的饮食方案，比如多吃水果、蔬菜和各种谷物的食物，对大脑的健康很有好处。同时，保持运动，也是应对更年期症状的好办法。它可以提高情绪和认知能力，也能提高骨密度。


    总结下今天的内容，更年期的荷尔蒙变化有可能是女性患阿尔兹海默症的诱因。是否需要治疗，取决于症状的严重性。健康的饮食和运动，都是应对更年期症状的好办法。


    # 本期英词


