    复合时间：Compound Time


    完美主义：perfectionism


    自满阶级：complacent class


    流量：traffic


    情结：complex


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_89_0.png)


    复合时间：Compound Time


    周一内容来自《观察者》网站《为什么成功人士每周都要花10小时的复合时间》，Why Successful People Spend 10 Hours a Week
    on ''Compound Time''。


    这篇文章把资本的“复利”概念引入到时间管理中，形成了“复合时间”的概念，我们讲了 compound interest（复利）和 compound time（复合时间）。那些成功人士，他们坚持在复合时间上投入，产生了利滚利的效果，我们看到的成功是他们坚持的结果。很多人只想得到结果，不想付出时间，最终一事无成。


    说到 compound 这个词，还有一个我们不太陌生的用法，就是复合药剂，也就是咱们中国人说的“复方”，用两种以上的药剂一起治疗某种疾病，像复方xx冲剂，复方xx片，英文就用
    compound 这个词。学会一个词，知道它在不同领域的意思其实不是很难的。我们学过的 future，一般指“未来”，但在金融上，futures 的意思就是“期货”。所以我总是强调，与其去背那些稀奇古怪的单词，用都用不上，还不如花点自己的存量去发掘一下，用熟、用透，如果该注意多学习真的有什么难处，那就找一条，不要贪近求远。


    来源：《观察者》|时代的“安利”


    完美主义：perfectionism


    周二我们讲了《赫芬顿邮报》的《别让完美主义阻碍你攻克“高原效应”， Hit a Plateau? Don''t Let Perfectionism Prevent
    You from Bursting Through it。


    “高原效应”是（The plateau effect），指陷入僵局、“卡”住了的状态。攻克高原效应的一个好办法，就是放弃完美主义的心态。用“有限理性”（bounded
    rationality）来克服。


    完美主义和完美主义者分别是 perfectionism 和 perfectionist。perfect 这个词在口语里是可以使用的，就是 very good
    的意思，但我很少听到有中国人会这么使用，老外倒是很多，带有一种夸张赞美的赞赏和肯定。


    比如说我朋友圈约了看电影，你朋友不但买好了电影票，位置很好，还做了做来多花和你们爱喝的饮料，这个时候显然你用 perfect，就比 good 感情色彩要强烈而且到位多。记得咱们之前内容讲过，提高情商，可以通过感受不同的情绪梯度来达到，这也是一个小有而得有点。


    另外再提一个问题，我曾在一些修 app 里听到有人朗读《哈利·波特》的小说，这个故事里有一个称呼叫做“部长”。注意，仔细看看这个单词的拼写，不是 perfect，而是
    Prefect，这两个词本来是“长官”的意思。跟 parfect 只有两个字母顺序不一样，语境里就有点读错了。这部小说里还有一个很有名的地名，叫女贞街四号，女贞是一种矮树，一般在园外用来私看，隔离生家宅和道路。女贞树的英文叫
    privet，我听到那位朗诵者读成了 private（私人的），这就有点不讲究了。


    所以小词其实比长的单词要难，因为长词好分辨，也容易念。小词相像的多，读音也不好判断，稍微不注意就容易读错，意思全不一样了，在学英语的时候就要特别当心。


    来源：《赫芬顿邮报》|别让完美主义成为阻碍


    自满阶级：complacent class


    周三是《新共和》的文章，叫《新一代雅痞》， NEW YUPPIES。


    这篇文章说的是美国的新雅痞，也被称为 complacent class（自满阶级），他们喜欢呆在自己熟悉的生活圈子里，不愿意走出来，这个会保持创新和创新。但他们对自己很满意。


    我们说了自满阶级的英文叫 complacent class，complacent 这个词是洋洋自得、沾沾自喜的意思。关于满意，我们学过至少三个说法：please、satisfy和content。please
    指的是让人有兴趣和愿望得到满足之后的满意，和 satisfy 兴致满足是，而 content 有一点旦相有别无求的意味，比 please、satisfy 程度更高。而
    compliant 是带一点贬义的意思的。平时使用的时候，建议多用satisfy和 content。


    来源：《新共和》|新雅痞是如何影响类面的


