  md: '# # 《BBC历史》｜温莎公爵放弃王位的真相


    《BBC历史》温莎公爵放弃……


    马徐骏

    《马徐骏说 世界名刊漫读》本期为你讲述

    《BBC史》杂志的封面文章。


    爱德华八世，也就是我们熟知的温莎公爵是英国历史上一个自动退位的国王，关于他的退位，最广为知道的原因是因为一段爱情，但真实的真的是这样吗？英国的历史学家根据史料，做了另一番解读。


