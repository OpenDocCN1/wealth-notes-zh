  md: '是在不断刷新和改变的，而《牛津通识读本》正是因为顺应了时代的潮流，采用了简洁、碎片化，不做终极解释的方式，才获得了巨大的成功。对于碎片化学习，总是会有很多争议，但我的看法是，在学校里有大量的时间，能够系统学习。而工作之后事情多，只能见缝插针地学习，只要坚持下去就是很不容易的。碎片化并不是什么坏事，总比嚷嚷着必须系统学习，但是却永远没时间学的人要好的多。


