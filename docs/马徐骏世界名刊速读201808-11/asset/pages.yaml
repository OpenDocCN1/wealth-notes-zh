  md: '呢？音箱就是个很好的选择，现在人们可能不是经常打开电视，但是都愿意享受音乐带来的快乐，所以用音箱作为一个交互界面就很适合。


    亚马逊的Echo，内置智能语音助手Alexa。你家里如果买了亚马逊的智能设备，只要喊一声Alexa，这个智能语音助手就会自动被激活、唤醒。Echo一经推出，就获得了消费者的认可，市场反响非常好，成了智能设备的标杆。目前为止，亚马逊的这个智能设备已经出售了上千万台。


    那这个音乐系统Alexa，亚马逊到底要拿它来做什么呢？


    # | 亚马逊的下一张王牌 Alexa


    Alexa最大的特点是：真人化，以及功能多。


    亚马逊追求的，就是让你有一个贴身的真人助手。这个助手无所不能，聪明、谦逊、乐于助人。亚马逊有专门的技术团队负责这件事情，不断去调整它的个性，包括说话的语音、语调和它的知识库。他们能做到什么程度呢？


    比如说就有专门的团队做研究预测，Alexa可以被问到 的热门话题。如果有重大的足球比赛，你冷不丁问一下，现在比分是多少？这个语音系统就能听懂，给出答案。今年4月份，Alexa的语音回复，已经开始有语气了，知道什么时候低声细语，什么时候停顿，什么时候深呼吸，还会说一些语气词，比如说“yay”（哇）和“ahem”（嗯），亚马逊的技术人员说，Alexa可能不认识你，但她绝对最懂你。


    再说到功能，日常生活中的功能就太多了。Alexa可以开关灯、叫车、教你说外语、陪你聊天，比如你想起一首歌中的一句歌词，跟Alexa说：“有句歌词是怎么唱的，是哪首歌来着？”Alexa就会帮你把这首歌找出来。要出门了，你搭配了一套衣服，亚马逊新一代的智能设备配备了摄像头，还可以给你拍照打分，不仅如此，还会在你挑选衣服的时候根据你平时的风格为你推荐。


    这对于行动受限的病人来说简直是雪中送碳。一个用户为他残疾的兄弟在天花板上安装了一个亚马逊的智能设备，他的兄弟就可以躺在床上做很多事情。帕金森的患者还可以通过这个智能语音系统来练习说话。按照亚马逊技术高层的话说，Alexa
    解决了很多他们自己之前都没想到过的问题。


    不仅如此，亚马逊还把这个智能语音系统免费授权给第三方开发者使用，Alexa在市场上得到了迅速的普及，几乎任何电子设备都可以内置语音系统，从洗衣机、电动牙刷、空气净化器、电视到汽车。第三方做好了技术上
    线后，亚马逊也随着受益，相当于别人免费替它开发了新功能，这就是双赢。


    # | 亚马逊的最终目的


    其实，这个Alexa的语音系统，就是为了让 人随时随地、不受限制地自由购物。比如给 孩子换尿布的时候，忽然发现尿布不够了，唤醒智能助手Alexa，一声令下，几个小时后，尿布就会送到家门口。不管你设想的就是与你无处不在的连接，不管是你在家里、在车里、在工作场所，只要有Alexa存在的地方，你就可以下单，这会大大简化你购物的流程，让消费变得更容易。


    总结一下，亚马逊从卖书起家，现在已然发展成了无所不包的百货商店。它的语音助手Alexa发展得如此之好，得益于亚马逊的先见之明，在它的竞争对手还把目光聚焦在手机的触摸屏上时，亚马逊却放眼，把目光放得更长远，做了智能音箱。可能每个科技巨头做人工智能的方式都不一样，但最后一定是为自己的核心业务服务的。接
    下，可以预见，在语音助手这个领域，科 技巨头们会有一场大战，就像文章里说的，语音助手之争，就是下一个交互界面之争。


