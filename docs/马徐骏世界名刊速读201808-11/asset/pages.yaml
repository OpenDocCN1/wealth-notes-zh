- pgno: 124
  md: '意到它，就是因为它在你的脑海中，经过各种各样的竞赛筛选之后，已经是最终的胜利者了。


    那你可能会问，神经元的选择依据什么呢？答案是，随机的。文章里举了受精卵的例子，在生殖过程中，亿万个精子争夺一个卵子，那么到底哪一个会胜出呢？是最强壮的那个吗？是游得最快的那个吗？都不一定，这完全是一种随机的选择。所以，你想要理解这种选择是非常困难的，因为影响你选择的随机因素太多了，与其纠结，不如让你的神经元替你决定好了。


    范德比尔特说，我们的选择其实是一种“既成事实”（fait accompli），没必要去深究，如果事后你觉得这种选择并不让你满意，你可以对自己说，这不过是我的神经随机反应出错了而已。


    好，总结一下今天的内容，在面对群体智慧的时候，样本量越大就越准确，同时尽量采纳中间的评价，并且不要被两极化的极端评价影响，至于像点菜、购物这样的个人行为，更多地相信自己的直觉，就算选错了，当做一次新鲜的体验就好，无伤大雅。我很喜欢范德比尔特说的，跟着感觉走，让直觉替你做决定。


