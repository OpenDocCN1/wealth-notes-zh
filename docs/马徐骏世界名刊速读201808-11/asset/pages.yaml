  md: '# 周末英语加餐 | 斯卡布罗集市


    马徐培


    你好，欢迎来到《马徐培·怎么读名刊速读》的Weekend Review，周末复习。


    +   - 1. 本周我们学到的表达有：


    名利场：Vanity Fair


    节俭：frugal


    潜规则：tacit code


    裁剪：tailor


    博学的：polymath


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_192_0.png)


    《名利场》：Vanity Fair


    周一我们讲的是《名利场》杂志最新发布的《2017 年度成就榜单》，The 2017 New Establishment List，今年这份榜单的总评委，是《乔布斯传》的作者沃尔特·艾萨克森。


    标题中这个 establishment 来自于它的动词 establish，“建立”的意思，所以 establishment 原来的意思是“地位高，可以理解为已经建立声望和地位的人，《名利场》的这个榜单其实就是评选各行各业的牛人。


    说到Vanity Fair，学英国文学的人有一本必须知道的小说，就叫《名利场》，它是十九世纪英国讽刺现实主义作家威廉·萨克雷的作品，讽刺了上流社会的骄奢淫逸，但是《名利场》这本书也不是这个意思，而是在告诉你上流社会是如何生活的。


    有意思的是，文学作品一般都是对上层社会的人情人性放批判态度，快乐好人的电影也总是在描写穷人是多么快乐，富人怎么虚伪伤心，但这其实是常识，从现实的视角来看，钱只要是自己劳动的，财富与尊严正当地位来的，有何不好？人生高潮，难道不更高也能吗？有更富贵的日子，生活质量更高，社会也会更好。


    Vanity Fair of the fair 有另一含义就是“市集”，英语里有个表达叫fair play（公平竞争），之所以这么说，是因为古代集市中做买卖，如果不公平肯定就没法交易的。由此看出，西方商业文明对于信誊和公平很看重。这引出了另一个表达—fair
    and square（光明正大的），fair（市集），square（广场），在广场上做生意，可不是光明正大的嘛，与之相反，地下交易也叫市语，是 black
    market。


    英国也一个非常有名的旧事，叫《斯卡布罗集市》，它的英语就是 Scarborough Fair，经典电影《毕业生》里，Simon 和 Garfunkel 唱过这首歌曲全球通。斯卡布罗集市市历史上真实存在过的一个商贸贸易活动，中世纪从斯克里夫尔到附近的斯卡布罗集市，从丹麦运到欧洲波斯的商，几乎所有的商人人都聚集于此，参加这个为期45天的集会，算是英国第一个商贸集市，那么多人聚集到一块，显然会有各种各样的娱乐活动，所以游乐场的英文叫
    fun fair，跟这个也是有关联的。


    来源：《名利场》2017 年度新成就榜单


    《节俭》：frugal


    周三讲了《人文》杂志的文章《像菲哲学家那样》，Philosophers Who Like Stuff。


    这篇文章告诉我们，不管史诗人如何来传说这篇文章，但整个文明的历史证明了，人类对奢侈持续的追求，是社会进步的重要动力。古希腊的国、无论哪个国家，富人都会为自己建造花园或者统治者都无法的财货和骄傲，在这一期中，我也讲了
    frugal（节俭的）和 luxury（奢侈的）。


    来源：《人文》设计奢华性享乐爱奢华


    《潜规则》：tacit code


    周二咱们讲了《时代周刊》的封面文章，《身败名裂的哈维·温斯坦》，The downfall of Harvey Weinstein.'
