    \ Capitalism Work, Who Can?* 这篇文章的两位作者，托马斯·巴克利和马修·坎贝尔，都是《彭博商业周刊》的资深记者。\n\n联合利华很多人都听说过，它旗下的一众品牌更是我们非常熟悉的，像力士、力士、奥妙、立顿、和路雪等等。咱们今天要讲的，是联合利华这个老牌企业，如何去对抗激烈的商业挑战，坚持自己的商业理念。\n\
    \n# 两种商业理念的碰撞\n\n联合利华在今年遭到了它最大的挑战，卡夫亨氏收购事件。\n\n卡夫亨氏(Kraft Heinz)曾向联合利华提出，要以1430亿美元的价格收购联合利华，虽然最终联合利华拒绝了这项收购，但此事件对联合利华的冲击非常大。\n\
    \n卡夫亨氏的操盘手是巴西私募基金3G资本(3G Capital)，3G资本以迅猛吞并企业，大力压缩成本、获得高额利润而闻名。他们的这种模式被称为“鲸吞”式，像鲸鱼一样吞并的方式。\n\
    \n比如，3G资本对卡夫亨氏的收购过程是这样的：卡夫和亨氏本来是两家公司，在2013年的时候，3G资本在股东休伦·巴菲特的巨额融资下先收购了亨氏，随后又收购了卡夫，接着使两家公司合并。合并后，3G资本便不假手生压缩成本、大幅裁员、关闭工厂，在强有力的措施下，卡夫亨氏在18个月之内就实现了盈利，营业利润率从18%上升到了26%。\n\
    \n这是3G资本的典型做法，但在联合利华看来，这就是“血汗工厂”。对于卡夫亨氏的收购，联合利华拒绝得相当彻底，他们说：“不管是在经济上还是在战略上，这一次的收购，对公司的股东都没有任何好处。”\n\
    \n联合利华为什么拒绝得这么不留情面呢？归根结底还是因为商业理念不同，甚至是截然相反。\n\n# 联合利华的商业理念\n\n联合利华创建于1929年，至今已有将近90年的历史了。联合利华的现任CEO是保罗·波尔曼(Paul\
    \ Polman)，他在2009年担任了CEO，掌管了联合利华。在此之前，波普曼曾经是联合利华的对手，宝洁和雀巢的高管。波普曼的到来对联合利华有着非同寻常的意义，因为他是联合利华创建以来的首位女性CEO。波普曼表现令的市值已经达到了1700亿美元，成为了世界上最大的日用消费品公司之一。\n\
    \n波普曼推崇的，是一种叫“可持续生活计划”的商业理念，他的目标是让联合利华成为“负责任的企业”典范。\n\n我们一般认为，企业为了追求利益就会以牺牲环境为代价。波普曼却认为，企业在发展自己的同时，多关注环境和社会的问题，可以让企业赚更多的钱。在波普曼看来，这并不只是出于企业对社会的责任感，而是出于对公司更好利益的理性考量。\n\
    \n波普曼曾经说过，亚当·斯密在写完了《道德情操论》17年之后，又写了《国富论》，他反复强调，如果你没有道德，你就不能挣钱。\n\n联合利华在波普曼的带领下，所有的业务和发展方向都以“商业与环境共同发展”为原则制定的。比如，从2008年到2016年，联合利华生产的每瓶产品所需要的能源都降低了将近四分之一，在成本上节省了超过4.7亿美元。"
