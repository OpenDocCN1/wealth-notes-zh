    # | 反乌托邦：dystopia


    周一的内容来自《连线》杂志的《银翼杀手回来了》，*Blade Runner is back*.


    这篇文章讲的是著名科幻电影《银翼杀手》续集《银翼杀手2049》的上映。《连线》作为一本科技杂志，所以会去关注一些科幻电影，因为《银翼杀手》可以被看作35年前，对于人类未来的一次模拟预
    言，同时它也让我们思考，高科技、低生活带来的一系列问题。


    就像文章里说的，科幻小说的力量，以及它的美妙之处，就是你可以不用真正生活在未来那些最糟糕、可怕的场景里，却能亲历它们。


    我们说了dystopia 是"反乌托邦"的意思，乌托邦即utopia，这个词来自于空想社会主义的创始人托马斯·莫尔的同名名作品《乌托邦》，本书里讲述了一个虚构出来的故事，有点像中国的《镜花缘》。


    一个航海家航行到一个奇乡异景"乌托邦"，在那里，财产是公有的，人民是平等的，社会按需分配，大家穿统一的工作服，吃饭是在公共食堂，官员是公共选举产生的。


    托马斯·莫尔的观点是，私有制是万恶之源，乌托邦这样没有私有制的地方才是美好的。但后来乌托邦被引申为"在幻想中，实际不可能存在的地方"，也被称为"乌有之乡"。


    dys-加上utopia，就组成了dystopia（反乌托邦），意思是充满了苦难和不幸的地方。


    这部电影的英文名*Blade Runner*，应该翻译成《刀锋行者》，为什么会翻译成《银翼杀手》呢？这是一个非常有趣的翻译方式，香港影视作品翻译喜欢用一些"癫狂、血腥"的字眼来吸引眼球，比如《魔鬼终结者》，其实英文名就叫
    Terminator（终结者），非卖加文文就《显得好黑暗。《海底总动员》，英文名却叫*Finding Nemo*，寻找尼莫儿，"总动员"显得好热闹。我本人很不喜欢这种翻译方式，甚至可能让我们错过一些优秀的作品，比如影视史上著名的*The
    Shawshank Redemption*（肖申克的救赎），被翻译成了《刺激1995》。


    说回*Blade Runner*，这部片子讲的是，一个追杀复制人的故事，有角道上其实是一个在人性矛盾的边缘，在道上其实是一个被追杀的人，同时也走在刀锋中，一不小心，自己也会凶多吉少。但是《银翼杀手》这个翻译已经很叫成习惯了，也基本没改成了，很遗憾。


    在影片最后，复制人死前朗诵了一首凄美的诗，这也是复制人的经典场景。不管是人类，还是复制人，都是为了生存而敌，我们是否有权决定别人的生死？


    > > I''ve seen things you people wouldn''t believe. I saw attack ships on fire
    off the shoulder of Orion. I watched C-beams glitter in the dark near the Tannhäuser
    Gate... All those moments will be lost in time, like tears in rain. Time to die...

    > <br>

    > 我见过你们人类不会相信的奇景。在猎户座的悬臂边缘目睹战舰起火。我看C束射线在坦恩尼斯门附近的黑暗中闪耀，所有这一切，都将消失于时光之中，如雨滴落入雨水。该死了……

    > ——《*Blade Runner*》《银翼杀手》


    来源：《连线》科幻的力量


    # | 维度：dimension


    周二我们讲了《新科学家》的封面文章《跨进第四维》，*Thriving Shapes*.


    这篇文章讲的是我们复杂的大脑连接，可能是更高维度在三维空间的投影，一旦我们破解了这个秘密，就能知道人的意识究竟是从哪里来的。


    Dimension（维度）这个词，其实咱们在科学里经常可以见到，现在流行的"3D效果"，就是三维里出现，和对章欣的科普小说《三体》里出现过一条非常厉害的高维文明形式，叫二向箔，二向箔是一种降维打击的武器，直接把所有三维世界的
    一个维度，在小说里就是三维世界被二维化，看小说的时候直接被章老师想的想象力震得说不出话来，"降维打击"的英文可以翻译成dimensionality reduction
    attack，缩写是DRA。


    来源：《新科学家》用代数数据研究大脑的复杂结构


    # | 冒名者综合征：imposter syndrome


    周三讲的《卫报》的文章《逃离自我怀疑的状态》，*You can escape this confidence-sapping syndrome*.


    "冒名者综合征"不是一种精神疾病，而是人格特征，很多人或多或少都会有，总觉得自己配不上目前的成功，进入自我低低的心理状态。要克服冒名者综合征，可以遵循"认识自己"或者"接受不完美"这样的心理练习。我推荐大家试试"冒名者"的练习，因为它是你最重要的内在资源，明白"有缺点的我，也是我"。


    "冒名者综合征"的英文是imposter syndrome，imposter 这个词可以翻译成"骗子"，中文还有一个表示"骗子"的用词是"fraud"，更多是一个表示"欺诈"的常用词，而imposter更侧重于"冒名顶替"，偷换身份，而骗局难度更高，所以使用率高其实是自然而然。


    syndrome 这个词的出现率也很高，但是之所以很多人不认识，是因为更多的是以缩写形式出现的，比如我们说流感时喜欢用"SARS"（严重急性呼吸综合征），艾滋病是AIDS（获得性免疫缺陷综合征）,  这篇文章的英文全称是Acquired
    Immune Deficiency Syndrome（获得性免疫缺陷综合征）。


    来源：《卫报》逃离自我怀疑的状态


    # | 长寿：longevity


    周四我们讲了《自然》杂志的文章《人类进化和延长》，*Massive Genetic Study Shows How Humans Are Evolving*.


    文章认为，我们的寿命越来越长，除了医疗技术更发达，生存条件更好了这些因素之外，是因为人类进化的过程中，已经淘汰掉了会影响寿命的有害基因突变，所以人类越来越长寿了。


    我们说了，长寿的英文叫longevity，一般我们说"长寿"，英文也叫life span，span是"持续时间"的意思，平均寿命就是average life
    span.


    来源：《自然》人类进化


    # | 修理：tinker


    周五我们讲了《经济学人》杂志的封面推荐文章，《数字时代的所有权》，*Tinkering in the digital age*.


    随着数字化浪潮袭来，越来越多的电脑都不是简单的机械结构，有复杂的硬件和控程序软件，作为产品，已经没像从前一样能进行一件产品的完整看了，我们面临这没法自己修理，对产品不能完全控制，和隐私泄露的问题，这种趋势已经发生，并且愈演愈烈。


    我们说了修理的英文叫tinker，我们还学过几个表示修理的词，repair、fix、mend，这些都是有区别。repair fix 的差别不大，基本都强调修复一些简单的形状和功能，它们可以通用；mend更多是"修补"的意思，在缝补，修修补叫ament.
