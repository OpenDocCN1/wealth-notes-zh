  md: '# # 《纽约客》| 从美国广播历史看网络假新闻


    《纽约客》| 从美国广播历史看...


    马徐骏


    《马徐骏·世界名刊导读》本期为你讲述《纽约客》的文章。


    互联网最被诟病的一点是假新闻多，可信度差。从美国广播的历史，可以看出它与互联网的发展轨迹有很多类似之处。那么，美国广播对于假新闻的处置方式能否为我们处理互联网假新闻带来启发呢？


    在这条音频中，你会听到：


    +   - 互联网和美国的广播业有哪些相像之处？

    - 美国的广播业如何杜绝假新闻？

    - 为什么杜绝假新闻不能靠监管？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_102_0.png)


    # 知识清单：


    +   **今日关键词**


    +   fake news：假新闻。我们曾经讲过false、fake和pirate 这三个词。false， 错误的，所以“非题”叫true or fake；pirate，海盗，所以“盗版光碟”叫pirate
    CD；而fake 就是“假”的意思，假货叫fake product。假新闻就是fake news。


    +   crack down：镇压、制裁。一般指权力机关自上而下的制裁。 censor，审查。 与它含义相近。对于音像制品、出版物的审查就用这个词，但crack
    down 的程度明显要强于censor， 基本就不是监督，而是取缔和消灭的意思了。 很多人对假新闻也是这个态度，希望政府能够采取crack down的方式来彻底消灭它。


    # 假新闻的谬误


    今天咱们来讲《纽约客》杂志上的一篇文章，《假新闻的谬误》， The Fake-News Fallacy。


    这篇文章的作者是80后美籍华裔陈立宇。他除了是《纽约客》的特约撰稿人，还给像《连线》、《纽约时报》这样的大刊写稿。陈立宇对于互联网文化，尤其是社交媒体下的新闻，有独到且深入的研究。今天这篇文章探讨的是，我们到底应该如何看待网上的假新闻。


    互联网被诟病最多的一点是，假新闻太多，别说是年纪大的人会上当，不少年轻人也没少被假新闻蒙蔽。对于假新闻，到底应该怎么看待和处理？陈立宇的这篇文章提供了一个很独特的视角。从美国广播业的发展历程，来对照互联网以及其中的假新闻。


    # 美国广播业与互联网


    现在一提广播，我们都觉得这好像是一种过时的传播形式了，但是，广播诞生之初是像互联网一样被给予了厚望的，这两者的发展历程也非常相似。而且，广播今天依然存在着，它可以作为一个观察的样本和参照物，来对比如今互联网的变化。


    广播在刚出现的时候，整个世界都为之称倾，因为在此之前，还没有过这么高效和有影响力的传播手段。它第一次使得所有的听众足不出户，就可以在同一时间，享受相同品质的内容服务。


    所以当时美国就有人说：广播是这个世界上最有力 的，社会教育工具！（ the most powerful instrument of social education
    the world has ever seen! ）


    这个评论跟互联网刚诞生时得到的评价是不是很像？


    从盈利模式来讲，美国广播业最开始想到的一种盈利模式，是私人出钱线下广播的一个时段，利用这个位置发布自己的言论，这跟互联网早期的BBS论坛方式非常相似。


    BBS的 全称为online-bulletin-board system （在线公告牌系统），等于自己花钱上网，然后在一个论坛页面上面抛出他的观点。论坛模式现在已经衰落，但在早期可是互联网的主要交流模式。
    而且美国广播和互联网，都变成了依靠着广告而盈利 的模式了。


    而在美国广播业的发展过程里，也出现过假新闻的问题，甚至造成过全国性的恐慌。在1938年10月30日那天晚上，美国的老百姓在广播里听到了一个爆炸性的消息，火星人正在攻击地球！
    于是有人拿起枪冲出门，要保卫家园，也有的人带着全家老小逃难避灾。 但其实这是当时播放的一个广播剧，名字叫《世界大战》。 是不是很熟啊？ 斯皮尔伯格曾拍过一部同名电影，就是根据这个广播剧改编的。


