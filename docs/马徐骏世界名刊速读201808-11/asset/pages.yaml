  md: "到现在，150多年过去了，煤炭资源又是什么情况呢？\n\n事实上，我们现在每年，比杰文斯那个时代消耗的煤炭数量都翻了30倍，但我们拥有的煤炭储量，按照如今的这种使用速率来说，依然可以供人类使用上千年。单在北海海底下，就蕴藏着几万亿吨级的煤炭。其实最有可能的，是在这些煤炭用尽之前，人类就已经不再烧煤了。\n\
    \n瑞德利说，对于石油的担忧跟煤炭几乎是如出一辙的，1914年的时候美国矿物局预计，美国的石油储量，只需再有十年；1939年的时候，美国的内政部只不过预计，美国的石油只够再用13年；总统吉米·卡特在1970年的时候也说，十年之内，美国的原油储备就会耗尽。\n\
    \n但是，现在已经是2017年了，全世界依然有大量已知和还未探明的石油储备，而且我们有更好的新技术来开采和利用。\n\n如果你还记得，咱们18.16号的内容《路痴之物》说的燃烧石油的内燃机引擎在未来会被用电池的电动机取代，你就知道，对于石油来说，它运送煤炭车也是一样的，在用尽之前，人类就已经不再需要它了。\n\
    \n接着咱们再来聊一下关于矿物的问题。\n\n在1970年，《科学美国人》杂志曾经刊登过著名的核物理学家弗里森·布朗的文章，他说过，锌、铅、锡、金和银的储量，到1990年，就会被耗尽。\n\
    \n曾经还有一本畅销书《增长的极限》，和哈里森·布朗观点一致，这本书说这些矿物资源，包括天然气最多也就供人类使用到1992年。我们的子孙后代就得为这些矿产可以使用了。这本书的观点，当年非常有影响力，甚至被引进了学校的教科书。\n\
    \n但是，现在离1992年是不是又过了快1/4个世纪了？我们对于锌、铅包括天然气的开采，跟1992年相比才翻了2倍，对于黄金和石油的开采翻了1.5倍，事实跟这些预言又是相反的。\n\
    \n瑞德利提供了一个特别简单的方法来判断资源是否紧缺，就是去查看一下这些矿产资源的市价，如果近期中没有上升趋势的话，就说明给非常的充足，没有耗尽的危险。\n\
    \n那为什么我们使用的资源越来越多，但是却没有耗尽这些资源的储备呢？\n\n# 发展才是硬道理\n\n根据瑞德利的观点，由于人类科技的发展，我们总是能找到替代的手段来解释资源的问题。比如说，在没有发现石油之前，鲸鱼被大量捕杀，濒临灭绝，其实就是为了去取得鲸鱼身上那一小点的鲸油做照明用，但是，当我们发现了石油、煤油出现了之后，谁还去大规模地捕鲸得到鲸鱼油呢？\n\
    \n由于科技的进步，人类正在使用更少的土地和水资源，因为我们对能源的使用效率变高了，石油的效率就要比使用木头高上千倍。瑞德利甚至还提了一个很有意思的现象：地球上面狼的数量是在不断增加的，虎的数量是在不停减少的，而老虎的数量维持不变，这是因为，狼一般般都生活在富裕国家，狮子生活在贫穷国家，而老虎一般生活在中等发达程度的国家。这个也就展示了，越富裕的国家，对于生态的保护就越好，森林就越多，这就是为什么科技越发达，我们就会越富裕，对于资源的消耗反而会越少的的原因。\n\
    \n这篇文章要告诉我们的是，人类出于生存的需要，总是更容易关注和传播负面的消息，但是我们要确定一个威胁是不是真的存在，必须去事实和数据显示，比如说历史里去查找依据，或者看矿产资源的市价波动，而不是人云亦云。\n\
    \n有些人会说，既然资源用不完，我们是不是就不用环保了？这更像是一个类似于节俭的问题，你说，穷人要不要节俭啊？当然要啊，但这并不意味着明明有钱却不紧着要挥霍，吃喝玩乐，同样的，穷人光是节俭，就不穷了吗？说到底，还是要靠致富来摆脱贫穷。\n\
    \n在资源问题上也是一样，发展才是硬道理。人类之所以越来越富裕，对于资源的利用效率越来越高，是因为我们发展出了新的科技，而不是靠节省。文章里还引用了前沙特阿拉伯石油部长亚马尼的一句话：“石器时代的终结，不是因为没有了石头，石油时代在石油储量耗尽之前也会终结。”这是因为，人类有了新的替代品。\n\
    \n《经济学家》｜路痴之物，即将消失的传统汽车\n\n# 本期金句\n\n+   *   **sustainable development:**\n  \
