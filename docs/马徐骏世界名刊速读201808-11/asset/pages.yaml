  md: '做。最简单就是雇佣一个清洁工。按照文章的说法，花钱买时间可以减小压力，提高幸福感，你也能更快乐。


    不过这篇文章的英文标题在四周的时候没讲，叫Uber, but for happiness。我特地放到周末来讲解，这个标题的意思是，Uber 不只是一个方便的服务，在它也节省了时间，从这个角度来讲，它也是一种可以让你更有幸福感的服务。我一直听到对于uber这个介词，有两种不同的念法，一个叫优ber，还有一个叫乌ber，到底哪个才是正确的呢？其实两个都对，uber
    本身就是一个单词，来自于德语，意思是“最好的、超级的”，跟super差不多，现在习惯念乌ber的人多一些，国外打车也基本都叫乌ber，但你读优ber，也没人能说你读得不对。


    # 审视：on trial


    周五咱们讲了《科学美国人》的文章，标题是《让你没有安全感的三种思维方式》，3 Toxic Thinking Habits That Feed Your Insecurity.


    我们讲了一个词 on trial（审视），特别注意，trial这个词，跟咱们之前讲过的trail特别像，很容易搞错。a和i两个字母颠倒了一下，但是发音和意思是完全不一样的，trail
    是追踪和拖拽的意思，trailer 有拖车和预告片的意思。而trial发音的时候注意t型要更夸张，是审讯、考察的意思。


    这种不长但是很相似的词，在学英语的时候就是一个容易掉进去的坑，需要特别注意。


    另外咱们咱们讲到了安全感，你可以说 sense of security或者sense of safety，sense of可以组合出很多表达，在英文里，sense
    既可以表示“感”，也可以表示“觉”，比如归属感 sense of belonging、荣誉感sense of honor，而味觉，嗅觉，可以说sense of
    taste和sense of smell，学会用这样像积木一样可以拆装的表达，在你不用背新词的情况下，词汇量都会有大幅度的提升。


