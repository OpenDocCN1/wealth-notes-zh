    # 知识清单：


    +   - 今日关键词


    Vanity \[væniti\] Fair’是《名利场》杂志的英文名。Vanity 是“浮华、虚荣”的意思，fair 在这个词，我们是说它最贴近的意思，即“举办者”绝对不较公平“就是
    Its not fair，fair 还有“展览会”的意思，所以和 vanity 组合在一起，就是咱们说的“名利场”。


    +   - 1份有价值的榜单


    今天的内容来自《名利场》，由两篇文章构成。第一篇文章是杂志最近发布的《2017 年度新成榜单》，The 2017 New Establishment List。在今年的榜单中，有四位来自中国。第二篇是文章《乔布斯与沃特·达芬奇的共同点》，What
    Steve Jobs Had in Common With Da Vinci，这篇文章是两个独特的意义。它的作者沃特达芬奇威廉（Walter Laesoon）之于之前是《时代周刊》的总编辑，乔布斯最一般投的《个人传记》乔布斯传奇，也是出自他手。


    《名利场》第一次出现在咱们专栏中，先来介绍一下。它是美国老牌生活杂志，创刊于1913年，它的宗旨是通过上流社会的方式、品味，如美食会话题、艺术等方面，但《名利场》绝对不形浮华的东西，只面八卦，八卦满满的杂志，相反，它曾两次获得过美国国家期刊奖，两次被评为美国最精稿杂志，是一本有着深度和深度的杂志。


    新成榜单是《名利场》每年的必读榜单，创建于1994年。榜单由世界范围内，引领了行业创新和进步的100位人物构成。评选的标准主要是这些人的影响力。


    +   - 2007 年度新成榜单（ The 2017 New Establishment List）


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_181_2.png)


    这份榜单一共一百人，前三名我们都很熟悉了。


    第一名是亚马逊的CEO，杰夫·贝索斯（Jeff Bezos），53岁，他去年也是第一名。在这份榜单中介绍的他的个人成就很有意思，在 2017 年美国时间 7
    月 27 日，根据创新高手，亚马逊股价水涨船高，按照贝索斯股份计算的，他的身家超过 900 亿美元，而900亿美元只有他之财比尔·盖茨的财富净值，也就是说贝索斯超越了比尔盖茨，成为世界首富。当然由于股价的变动，这个首富的头衔只保持了四个小时。


    第二名是Facebook CEO 马克·扎克伯格（Mark Zuckerberg），33岁，他去年的排名也是第一。这个人成就现在比较有趣，主要是领导了facebook，现在的facebook已经拥有了20亿用户，《名利场》说，facebook
    现在就像自来水一样无处不在。同时，扎克伯格和他的妻子将投入30亿美元用于医疗慈善事业。


    第三名每年变化较大，今年是苹果公司的CEO 蒂姆·库克（Tim Cook），56岁。他去年排在第 11 位。去年的第5名是 snapchat 的伊万·施佩格尔（Evan
    Spiegel），今年他排到了第28位。库克今年第一个人成就就是，苹果在他的领导下，市值已经超过了8000亿美元，即将成为一个市值万亿美元的公司。


    还有他们的一些名老人，比如说谷歌的母公司科尔瓦特科技的老拉里·佩奇（Larry Page）排了第四位，硅谷钢铁侠埃隆·马斯克（Elon Musk），排到了第五位位，facebook
    的首席运营官希利·桑德伯格（Sheryl Sandberg）排第12位。《从0到1》的作者，硅谷传奇投资人彼得·蒂尔（Peter Thiel）排第17位。'
