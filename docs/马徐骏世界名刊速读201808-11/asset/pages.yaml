  md: '# 《万古》｜跳槽经济下，如何找到好工作


    《万古》｜跳槽经济下，...


    **马徐骏**


    《马徐骏·世界名刊速读》本期为你讲述《万古》网站的文章。


    我们发现身边有很多人，频繁跳槽。这其实不只是个人的选择，在跳槽经济中，公司和求职者都在经历变化，什么样的工作是好工作？对于公司来说，他们更需要什么样的求职者？


    在这条音频中，你将听到：


    +   - 什么是跳槽经济？总跳槽到底好不好？

    - 工作的不稳定性给公司和员工带来了什么样的影响？

    - 跳槽经济下，应该寻找什么样的工作？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_30_0.png)


    # 知识清单：


    # 今日关键词


    quit：“退出”的意思。当我们想说辞职的时候，可以用“quit a job”。


    resign：也表示辞职。和quit不同的是，当我们说辞去某工作时，一般和from搭配，resign from sth。


    # 跳槽经济的盛行


    今天的内容来自《万古》网站，标题叫做《跳槽经济》，*The Quitting Economy*，作者是伊兰娜·格尔森（Ilanah Gershon），印第安纳大学人类学副教授。


    你可能听过这么一个说法，频繁跳槽对个人是不好的，在职场上会显得对企业缺乏忠诚度，影响职业生涯。这篇文章有价值的地方在于帮我们重新认识了新的经济环境下，作为个人，和雇佣单位、同事之间的关系，让我们明白我们到底在为什么而工作，什么样的情况下，我们应该跳槽。


    # 新自由主义的兴起


    按照文章里的说法，现在的人比过去跳槽更加地频繁，这跟新自由主义的兴起是有关系的。


    新自由主义，是经济学界的传奇人物哈耶克（Hayek）提出的，他是获得诺贝尔经济学奖的第一位自由市场理论经济学家。哈耶克主张，对于经济事务来说，国家不应该干预，应该让市场自由地去发展。他一辈子都在坚定地捍卫自由主义。


    上世纪30年代，哈耶克刚到伦敦，就叫板宏观经济学的创立者凯恩斯。因为凯恩斯认为在经济发展中，国家干预至为重要。可以说，两个人的观点是相对立的。凯恩斯1936年出版的巨著《就业、利息和货币通论》，在一定程度
    上，就是在 和哈耶克交火，在这一局中凯恩斯获得了胜利，很多哈耶克的追随者都转投到凯恩斯的门下。


    但是，从上世纪90年代开始，随着经济的发展，新自由主义逐渐兴起。越来越多新自由主义支持者认可哈耶克的观点：让市场自由发展，市场是衡量价值的最好标准。但与此同时，政府的适当干预是有必要的，它可以保证市场顺畅地运行，确保市场够促进竞争，刺激创新发展。


    在美国的主流市场，衡量一个公司的价值，它的市值和股价是最重要的两个标准。市场更看重的是这个公司短期内能给股东带来多少效益，也就是说，越来越多的公司主要对股东负责。这代表什么，对员工会有什么影响？文章中举了一个美国航空公司（American
    Airlines）的例子。


    美国航空公司之前认为他们的薪酬体系并没有什么竞争力，所以就宣布提高员工的薪水。这相当于把钱给给了员工，华尔街对此的反应很迅速，美国公司的股价迅速暴跌。道理很简单，挣的钱都是股东的，拿着钱给员工，不就相当于降低了股东的收益吗？


    所以，在这种情况下，公司为了保住股价，就得尽可能地降低成本，包括员工的薪酬福利等。成本越低，盈利越多，公司就越值钱。市场不关心你对员工好不好，有没有对员工负责、有没有考虑员工的退休养老等。


    那什么人在这种环境里比较吃香呢？就是那些能够短时间、高强度工作，完成短期项目的人。很少有人会说明说，我实际上就想招那种“我有多活就多活，短干短钱给我干”。'
