  md: '用网络的更多，另外年轻人的生活也有更多的不确定性。好多年轻人可能为了一份工作背井离乡，一个人到城市生活，感到没有结婚，也没有伴侣，所以经常会感到强烈的孤独。


    偶尔孤独是没关系的，但是长期感受孤独感对我们是有害的。


    # | 孤独感的危害


    为了摆脱孤独感，人们更容易做出危险冲动和坏的决定。比如暴食暴食、酗酒、吸毒、危险性行为，但是这是心理层面的。


    长期的孤独感对人生理的危害，不亚于吸烟和肥胖造成的各种疾病。文章里说，长期的孤独感相当于每天吸15支烟，相比普通人，孤独的人有26%的概率更早死亡，而且孤独对一个人的头脑和基因都有损害。


    其实这也很好理解，就像之前说的，孤独感本来就是一种生理预警机制，会影响你体内的激素分泌和免疫系统。长期的孤独相当于，人长期处于压力状态，体内的炎症也会增多，而且你对负面信息和威胁的感受力会加强。这还会形成一个恶性循环，让你陷入更多的恐惧焦虑当中，也会变得更加孤独。


    这张著名的UCLA孤独指数测量表，你可以对照着检测一下，得分在25分以上，说明你处在孤独程度比较高的状态，就要当心了。


    # UCLA孤独指数测量表


    回答以下10个问题，每个问题从1到4进行打分

    1分-从不

    2分-很少

    3分-有时

    4分-总是


    +   Q1. 你是否因为独自做事而感到不开心？

    Q2. 你是否觉得没有人可以倾诉？

    Q3. 你是否感到无法忍受独自一人？

    Q4. 你是否觉得没人能够理解你？

    Q5. 你是否觉得你在等待别人联系你？

    Q6. 你是否感到自己完全是独自一人？

    Q7. 你是否感到无法跟身边的人交流？

    Q8. 你是否感到缺少陪伴？

    Q9. 你是否很难遇到困难？

    Q10. 你是否感觉被其他人孤立？


    20分以下：平均水平

    25分以上：孤独指数较高

    30分以上：非常孤独


    # | 怎样对抗孤独？


    文章给出了两个方法，建立高质量关系和寻找使命感。


    先来说建立高质量关系，根据牛津大学的人类学家罗宾·邓巴的研究，对抗孤独感需要的是社交关系的质量，而不是数量。你需要与至少5个亲密的家人或者朋友，建立高质量的社交关系。你社交时间的40%要给这五个人，包括有事没事问候一下、经常关注他们的动态、经常聚会。


    而寻找使命感，就是给自己的生活在目标，寻找你生命的意义，哪怕就是经常帮助别人，都可以帮你对抗孤独感。有使命感的人不容易迷茫，你会朝着一个确定的目标努力，就像《精英日课》的万维钢老师经常说的，你要寻找，something
    bigger than yourself。


    总结一下，孤独感是一种人的生理预警机制，但长期的孤独感对人的健康是有害处的。为了对抗孤独感，我们需要至少5段高质量的社交关系，并且找到自己的使命感。


    就像我从文章里选出的今天的金句：有目标感，找到生活的意义，可以帮你打败孤独。


