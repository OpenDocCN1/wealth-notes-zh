    《马徐骏》杂文式阅读》本期为你讲述《名利场》杂志近期发布了“2017年度新成榜单”，其中有四位名人悉数来自中文版。这一榜单的评选标准是什么？乔布斯与其作者沃特·皮弗兹文，艾萨克森又是如何评价这份榜单的？


    在今天的内容中，你会了解：


    +   - 新成榜单排名前三的分别是谁？他们有哪些成就？

