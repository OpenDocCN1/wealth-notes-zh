    比如说，可以去读一些不同领域的书籍，小说、散文、杂文、论文，甚至剧本。另外，增加自己的知识储备和理解力，这才是对阅读速度帮助最大的。如果说阅读有什么shortcut（捷径），想要读得更多，读得更快的话，就只有“多读”这一条路。


    罗振宇老师经常提到一个词儿，叫手艺，其实从这篇文章来看，阅读也是门手艺。它需要你花时间投入，花力气打磨。不过，也有一种shortcut，就是在“得到”上学习，无论是学习专栏，还是每天听本书，都算得上是一种高效的shortcut
