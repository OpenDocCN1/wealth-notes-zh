  md: '# 周末英语加餐 | 尼特族和少年时代


    马徐骏

    你好，欢迎来到《马徐骏·世界各刊速读》的Weekend Review，周末复习。

    本周我们学到的表达有：


    +   - 飞特族：freeter

    - 插嘴：interrupt / chip in

    - 银发定时炸弹 & 婴儿潮一代：Silver time bomb & Baby boomers

    - 外包：outsource

    - 审视：on trial


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_12_0.png)


    # 飞特族：freeter


    周一咱们讲了《大西洋月刊》的一篇文章，《为什么日本的出生率这么低》，*The Mystery of Why Japanese People Are Having
    So Few Babies*。


    这篇文章分析了日本人口出生率低的原因是，年轻人找不到稳定工作，不敢结婚。咱们讲了两个词，freeter，飞特族。


    freeter=freelancer（自由职业者）和德语词arbeiter（工人）的组合，指的是没有全职工作，以打工、兼职等维持生活的人。文章里说了，日本的飞特族其实是因为我找不到稳定的好工作，不得已才这么生活的年轻人，他们不敢结婚，甚至不敢恋爱。文章里还提到：针对日本18～34岁男的调查发观，70%的未婚男性和60%的未婚女性，都没有在谈恋爱。现实是如此的残酷，很多年轻人更愿意在虚拟的世界里徘徊，因为更容易掌控，算是对现实的一种逃避，这个跟日本二次元文化的盛行也有一定关系。


    但是还有另一类人就比较奇葩了，叫尼特族，英文NEET，是“Not in Employment, Education or Training”的缩写，翻译过来是“不升学、不就业、不进修或参加就业辅导”的人，说的比较多的是15-34岁的年轻人，在中国咱们对这个族群有一个响亮的称呼，叫“啃老族”，你想嘛，不读书、不工作，啥事没有，靠啥着？不就靠爹妈养着嘛。当然这也并不是中国独有的现象，NEET这个词最早是起源于英国的，后来慢慢被全球都接受了。造就NEET族的，是咱们周三讲过的Baby
    boomers（婴儿潮一代）。


    # 银发定时炸弹 & 婴儿潮一代：Silver time bomb & Baby boomers


    周三讲的是《经济学家》杂志的特别报道，《新生代老年人》，*the new old*。


    里面提到的关键词是：Silver time bomb和Baby boomers，银发定时炸弹和婴儿潮一代。


    Baby boomers（婴儿潮一代），指的是美国第二次世界大战后出生的人口高潮，这个人群被称为“婴儿潮一代”，也是现在老年人人口的主力军。本来以为他们是Silver
    time bomb，银发定时炸弹，会给社会和经构带来不良的影响。没想到这波人非常强悍，退休了也闲不住，要继续工作，坚持革命，说是要家庭减轻负担，结果没想到年轻人也就是Millennials（千禧一代）的饭碗。


    Silver time bomb，银发定时炸弹以意想不到的方式爆炸了。在日本，很多老同志退休之后去应聘技术含量高的普通工作，比如银行柜员、超市收银员等，这些老人都有丰厚的退休金，对薪酬和福利都无所谓，你要是老板肯定也喜用这样的人，小年轻压根就没法跟他们竞争，结果出现了爷爷们欢天喜地上班，年轻人垂头丧气死宅的有趣现象。'
