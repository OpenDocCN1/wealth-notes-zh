  md: '吸引力。在一项看照片猜女性年龄的实验中，闻了并且喜欢葡萄柚味道的人，他们在猜年龄时，猜出的年龄比这些女性的实际年龄低12岁。散发花香的女性看起来要比实际瘦四磅。


    这么来看，气味能够传递的信息真是不少，可以透露情绪，传递情绪，在我们寻找伴侣时也在悄悄地起着作用。我们之所以没有意识到嗅觉的重要性，是因为它都发生在潜意识下。不过环顾我们的生活，总会发现这样的描述，像是“房间里弥漫着快乐的味道”“我和他是好哥们，我们臭味相投”“这个人总是散发一种让人安心的味道”。你看，都和气味scent相关，还记得闻怎么说吗？复习一下，sniff。


    作者在文章当中说，通常来说，我们的鼻子都在给我们传递重要的信息，比如说“小心，有一个危险的人可能在附近晃悠”“注意，有人可能生病了，这个病还可能是传染的，离远点”“打起精神，这个人可能是你的潜在伴侣”，正如作者所说：“倾听你的内在的声音，这些声音可能是你的鼻子在告诉你该怎么做。”


