  md: '# 家庭背景声 | 英文朗读乔纳森·斯威夫特《论礼貌与教养》




    乔纳森·斯威夫特是爱尔兰著名的讽刺作家、散文家和政治家，特别擅长用冷面笑话式的风格进行写作，因此被《大英百科全书》誉为英语文学史上最重要的讽刺作家。他的作品中最被我们熟知的就是《格列佛游记》。


    在《论礼貌与教养》这篇文章中，他对当时礼貌与良好的教养进行了区分，对于当时的英国社会极度追求繁文缛节的风气进行了调侃和批判，个人风格发挥得淋漓尽致。


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_183_0.png)


    Jonathan Swift （1667~1745）


    A Treatise on Good Manners and Good Breeding


    Good manners is the art of making those people easy with whom we converse.


    Whoever makes the fewest persons uneasy is the best bred in the company.


    As the best law is founded upon reason, so are the best manners. And as some lawyers
    have introduced unreasonable things into common law, so likewise many teachers
    have introduced absurd things into common good manners.


    One principal point of this art is to suit our behaviour to the three several
    degrees of men; our superiors, our equals, and those below us.


    For instance, to press either of the former to eat or drink is a breach of manners;
    but a farmer or a tradesman must be thus treated, or else it will be difficult
    to persuade them that they are welcome.


    Pride, ill nature, and want of sense, are the three great sources of ill manners;
    without some one of these defects, no man will behave himself ill for want of
    experience, or of that, in the language of fools, is called knowing the world.


    I defy any one to assign an incident wherein reason will not direct us what we
    are to say or do in company, if we are not misled by pride or ill nature.'
