  md: '# 周末英语加餐 | 迷人的假象


    周末英语加餐 | 迷人的假象

    May 27, 2019


    马徐锐


    你好，欢迎来到《博锐思·英学名刊速读》的 **Weekend Review**，周末。


    本周我们学到的表达有：


    +   投机：speculate

    可靠：reliable

    失眠：insomnia

    生育：labor

    混合：hybrid


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_205_0.png)


    # 投机：speculate


    周一我们讲了《万千》网站上的文章《着想不一般的成就》，An unlikely triumph.


    这篇文章说的是美国高等教育是怎么崛起的。让人意想不到的是，一开始美国办大学，不是为了教育，而是为了增加房地产地，也就是文章的关键词：speculate（投机）。结果这些大学为了活下去，进入了残酷的市场竞争，变成了四下生亡生出来的——杀敌者，在熬过了一开始的困难之后，形成了世界顶尖的高等教育体系。


    这篇文章除了帮我们梳理了很多美国高等教育的特色之外，还给我们两点启发。


    第一，机要重重要，结果如何才最重要。很多人报着报着重要的结果，但结果却没有改变，就像有句古话说，所有试图把世界建设成天堂的愿望，最后不过是把世界变成了地狱。


    第二，教育可以产业化，也可以市场化，但没有淘汰机制的市场化，都是要流寇。让一个系统更健康，那么推动新陈代谢，优胜劣汰，系统只会越来越健硕，变得越来越低效，最后死掉。


    也因为美国的大学没有抱持着特别高大的初衷和目的，所以美国人生读大学的心理也相对轻松。文章里提了一个很有意思的例子，美国一文章上，用的都是 college，大学学生也叫这个叫
    college student，但是 college 这个字叫大学的学是，大学应该叫 university，学院比大学要低一档，英国的大学生不太会说自己是叫
    college，都是指很古老，大学，我是 university student。我曾经注意到英美这一用法上的不同，之前只认为得这是因为美国人更随意，但是读完这篇文章才明白，它源于人大学对美国人心来说是什么特别严肃认真的事，大学面向的是中产阶级，只要有愿意就可以上，需要残酷竞争的，是那些顶尖的名校。


    来源：《万千》[美国的高教到底是崛起。


    # 可靠：reliable


    周二讲的是《哈佛商业评论》的文章《如何在职场建立信誉》，*How to Gain Credibility When You Have Little Experience*.


    在职场上，比起更看重，是让别人觉得你靠谱。关于 reliable，同事和我讨论“靠谱”这个译法，会不会显得太严重？我觉得不会，这个词的语感是可靠的，听我们在这个店里，无论是自己还在听故事，太严肃，压重的语气让人很不负担，当年英国首相梅博士身边干事编号10号有职衔的话，就让你身边的“人”不再prime
    minister，而叫她的名字 Tony，这把玩土的人吓了一跳，觉得太不正经了，但结果却开创了英国首相亲民政治的先河，拉近了跟民众、民众的距离。所以，我觉得
    reliable 当“靠谱”这个译法是没有问题的，也建议平时在口语中这么使用。


    说到这篇文章，作者建议，增加职场靠谱感的三个方法是：工作更专业、做事有原则、再加点小心眼，对于职场小白来说，别抱怨那么多，怕的是没事给你做。做事不管大小都是学习，哪怕有矛盾的
    pass（热情，）也要控制好目标，从小事做起，而职场新手来说，反而要不断激发自己的 passion，经验有了，需要的就是持之以恒的信心了。听听们文章里正好讲了到的自信，还记得吗？就是这个
    pass 前面加个前缀 com，com Passion.


    咱们来重温一下文章的这个点：你可能不是办公室最资深最有经验的那个人，但你可以成为最靠得住的人。*You may not be the most experienced
    person in the room, but you can become one of the most reliable.*


    来源：《哈佛商业评论》[如何建立靠谱的职场形象？


    # 失眠：insomnia


    咱们周三讲的是《新科学家》的封面文章《睡个好觉》，*Sleep The Good Sleep*.


    晚睡不仅会让你第二天精神不好，甚至还会带来很多你想不到的风险。这次我们生来探究好觉的奥秘，也证明了生物节律是很重要的。我们别说是作者文章里把人的大脑比作城市。城市里有高楼大厦，在晚上会亮得刺眼，小城市也有，方便清洁打扫城市，也就会导致到没有失眠的科学证据。用简单形象的比喻让人理解，这才是作者的厉害之处。


    咱们讲到了失眠的英文单词叫 insomnia，这个口语里 sleep bijacker 的情况，只是睡眠的一部分，用一个 sleep disorder 就可以。连续的大部分失眠与引发很多因素，太卫生节律有部经的经典电影故事《大卫·林奇》就有一个男人持续失眠了很久，最后发展出了另一种人生，居然做出了一系列反社会的行为。当然这部分并不是文章里提到的东西，但是对于那些晚上不想睡，白天起不来的同志们，可以当做反面教材来看。


    来源：《新科学家》[大脑中的垃圾处理系统


    # 生育：labor


    周四四说的是《时代周刊》的封面文章《女神的神话》，*The Goddess Myth*.


    这篇文章谈到了美国女性性的生育问题。生育英文叫labor或者give birth，通过这篇文章你会发现，不只是中国母亲含有压力大的问题，全世界都一样。不真正了解国外的情况，很容易在一些片面的资讯误导，觉得外面的妈妈都特别能胖，生孩子像玩一样。这篇文章告诉我们不是这样的。


    还有我们总是觉得国外的生活特别安逸、舒适，古老的欧洲祖县提不了，你过去美国都知道，美国的基建设施建设都国人比，大多数城市已经老化了，现在美国人也正在研发怎么翻新这些基础设施。中国城市的生活便捷和舒适程度，不说一定超过国外，但绝对不会不大于。我觉得通过看他们的生活，可以帮助一个更客观、平等的视角来看待国外的生活，树立自信心。


    来源：《时代周刊》[拒绝完美妈妈


    # 混合：hybrid


    周五我们讲了《鹦鹉教》杂志的文章，《为什么大多数怪兽都是混合型》，*Why Are So Many Monsters Hybrids*?


    混合物叫 hybrid，我们常见的油电混合的车就是 hybrid car，由于人类的发明机器们，所以古怪、不现实、分类的飞思百起引起他们的注意和警觉，也更容易产生恐惧情绪，所以大多数怪物的设计都有
    hybrd。而文章里还提到一个点，英雄很多时候也是 hybrid。怪物和人的区别，本质上来说，两者就是，好像就只是两国的，传统上是一种英雄，好端端的人（英国话的话），杀死了一条龙，最后自己却成为了新的怪物。


    另外关于恐惧的问题，我觉得有一个解释非常非常巧妙。人类最深的恐惧就是死亡，所有会引起我们联想起来死亡的东西，都会让我们害怕，比如无生命的机器或是会杀人机器人，比如毫无空气的密室会让我们害怕，因为人类是喜欢呼吸的，还有我们会害怕孤独或无法联系，或者机器人的设计里智能的“恐怖谷效应，恐怖谷效应”是
    196 年提出来，简单说就是，当机器人不高的时候，人们会非常反感，但程度不高的时候，人们会觉得可爱，但老毛狼，hello kitty，当机器人稍微超过一定的阈值，却会引发人们极度的恐惧和恐惧，因为会非常相信、恐怖的感觉，有如面对行尸走肉。


    来源：《鹦鹉教》[人的恐惧从何而来？'
