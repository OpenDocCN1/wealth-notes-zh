  md: '# # 《新共和》 | 新雅痞阶层 如何影响美国？


    马徐骏

    《马徐骏·世界名刊连读》本期为你讲述《新共和》杂志的文章。


    在美国，炫富型消费几乎看不到了，雅痞更愿意投资教育，更加注重“文化资本”的积累。然而，作者指出，这给美国带来了阶级分化等一系列社会问题。


    在这条音频中，你会听到：


    +   * 什么是新雅痞？新雅痞的生活状态是什么样的？

    * 新雅痞为什么被称为“自满阶级”？

    * “自满阶级”给美国带来了怎样的社会问题？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_80_0.png)


    # ## 知识清单：


    # ### 1 今日关键词


    +   * complacent class：自满阶级。complacent 这个词是洋洋自得，沾沾自喜的意思。

    * Aspirational Class：有抱负阶级。

    * Yuppie: “雅痞”，也被称为“优皮”，是根据嬉皮士的 hippie 造出来的，指的是西方国家中，年轻有为，充满上进心的人。


    # ### 新一代雅痞


    今天为你带来了一本第一次出现在咱们专栏里的杂志，叫做《新共和》。这本杂志的来头很大，是全美自1914年创刊以来话语权最高的意见领袖杂志之一，《新共和》的文章都带着一些自由主义的色彩。


    这次为你选取的是《新共和》8月刊的一篇文章，叫做《新一代雅痞》，NEW YUPIES。这篇文章的内容，主要是来自于最近新出的两本探讨“雅痞”的书里面的观点。第一本是科瑞德·哈克特写的The
    Sum of Small Things: A Theory of the Aspirational Class, 《琐事之和：一个关于有抱负阶级的理论》。另一本是泰勒·科文的作品
    complacent class, 《自满阶级》，这本书在万维刚老师的《精英日课》里曾经解释过。


    这篇文章说了两点：

    1.  什么是这个时代的雅痞阶层？

    2.  雅痞阶层带来了什么社会问题？


    # ### 雅痞阶层


    说到说雅痞，大部分人第一反应会联想到美国的嬉皮士，英文叫 hippie，听发音你就知道这个是音译，但是作为翻译，我认为这个翻得倒位。“嬉皮士”这类人指的是美国1960年代和1970年代，反抗习俗和当时政治的年轻人。典型的嬉皮士形象就是长发、破衣服、玩摇滚乐、吸毒、像披头士乐队的约翰·列侬就是典型的嬉皮士，而乔布斯年轻的时候也深受嬉皮士的影响，嬉皮士文化里那种反抗权威的精神，贯穿了乔布斯今后的人生。后来嬉皮士就越来越倾向于贩毒、拒绝叛逆但没有追求的年轻人。


    “雅痞”，yuppie，是根据嬉皮士的 hippie 造出来的，指的是西方国家中，年轻有为，充满上进心的人。雅痞一般都接受过高等教育，具有较高的知识水平和技能，做着比如医生、律师、记者、艺术家、学者，请如此类的工作，这些人的社会地位在西方都比较高。


    这个阶层从20世纪80年代开始兴起，带动了一波着装、消费行为及生活方式的潮流。你别看跟嬉皮士一样，也有一个“痞”字，但这完全是两种人。从外表上就非常容易区分。


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_80_1.png)


    严格来说，雅痞的生活方式，跟嬉皮士正好相反。对这类人，有一个更专业的说法，叫“有抱负阶级”，英文叫做 Aspirational Class。这个阶层，在美国相当于中产阶级以上或者更高。这个阶层的人跟嬉皮士完全不同，只关心赚钱，享受舒适、有格调的奢华生活。'
