  md: "# 《彭博商业周刊》|联合利华的商业挑战\n\n马徐敏 《马徐敏·世界名言导读》本期为尔讲述《彭博商业周刊》的文章。\n\n联合利华是一个老牌企业，在愈加复杂的商业环境中，它坚持的经营理念是什么？面对短期主义投资者的冲击，它又该如何发展呢？\n\
