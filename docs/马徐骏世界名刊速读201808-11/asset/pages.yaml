  md: '# 实用清单｜横扫出国英语障碍


    马徐骏


    今天就是十一国庆节了，你会是否出国旅行呢？如果你在路上或者准备在路上，请保存好这份清单。它会让你在国外的衣食住行更容易，也让你了解不同的文化差异下，更地道的英文表达。


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_147_0.png)


    文化差异篇：


    +   1. 假如你去美国，价格标签上的价格不是最终价格。因为在结账时还需要付营业税和小费。这个时候你就可以问一下是不是免税，有没有折扣，可以这么说 Is
    there any discount?


    +   2. 去欧洲旅行的朋友，很有可能会购买一些小特产回国。比如说伊比利亚火腿，装到随身行李箱带回国时，如果安检问你是什幺，不能说 leg, leg是人腿。火腿是ham。


    +   3. smoke free 和 l lax free。我们都知道 free 的意思是“免费”，但是smoke free 可不是“免费吸烟”的意思，是说“不能抽烟”。英语单词后面搭配
    free，一般都翻译“不能……”或者“没有……”，比如说‘免税店’就是 duty free。


    +   4. 人工柜台买车票，人家问你 one way？这可能不是问你“一位、两位”的意思，one way 是“单程票”的意思，“往返票”叫 round way。那“两张票”怎么说呢？
    two tickets。


    +   5. 如果是电话叫车，司机会问你，Where are you from ？千万别回答 China，人家是在问，“在哪排队”。在排队的时候，有老外问你，Where
    are you from？也千万别回答 China，人家是在问你“从哪排队”。


    +   6. 国外没有像中国这么方便的移动支付，有一些国家现金结账的时候，是可以提供刷卡提现服务的。提现服务就是帮你从信用卡里提取一些现金出来，方便你打车或者给小费。对方会问你“cash
    back”，这可不是“购物返还”的意思，是问你要不要“刷卡提现”。


    +   7. 吃牛排的时候，服务员会问你，How would you like your steak? 人家是问你，“有多喜欢牛排”，千万别回答“very
    much”。人家是在问“牛排要几分熟”。咱们在国内一般会五分熟啊、七分熟啊之类的。但是你跟对方说 five medium, 对方也会听不懂。“三分熟”叫做
    medium rare；“五分熟，或者 半熟”叫做 medium；“七分熟”叫做 medium well-done；“全熟”就是 well-done.


    +   8. 要是在国外吃麦当劳、肯德基等快餐，服务员会问你一句：here or to go？意思是“堂食还是外卖”，不是你学不会意思。你要说“堂食”，就说here，“带走”就说
    to go。如果你想要番茄酱不能说 tomato，要说ketchup。想点套餐的话得学会一个词，叫 combo，1号套餐就是 combo1, 2号套餐就是
    combo 2。


    +   9. 买饮料，想要吸管的话千万别用suck，服务员会疯的，不是说学会一个字，喝饮料用的吸管叫 straw。你跟服务员说这一个词，她也就懂了。


    +   10. 在饭店吃东西觉得很好吃，想再来一份。不能说Can I have another one? 这句话不是咱们中国理解的“再来一份”的意思，这句话的意思是我“对这个菜不满意，给我换个别的菜”，“再来一份”应该说one
    more, please.


    +   11. 国外的餐厅，厨师和服务员都会问你是否对菜品满意，这个时候，如果你觉得味道不错，可以回答Wonderful, Delicious.


    +   12. 在饭店吃完结了要结账，只要说check, please, 或者 bill, 结账就可以了。


    +   13. 去餐厅得给小费，没有零钱的话，你需要碎零钱，“破零钱”就是break money。有些餐厅已经把小费包含在账单里了，可以问一句Is the
    gratuity included in the bill? Gratuity就是小费的意思，也可以用tip代。


    +   14. 在国外如果有人给你发传单，建议不要随便接，说一 句 No，thanks就好。国外有些广场会有这种骗局，一个人装作很好放，对你笑，然后让你试一他手里拿的串串的手链，你看着也不怎么钱就戴上了，一戴上身边就有一圈人围住你，你不掏钱买下就不放你走。所以遇到这种也要小心，不要接，不要戴。就说，No,thanks.


    +   15. You''re welcome，是中国人学英语里最熟练的，也不能乱用，别人要是说 thank you，你说 You''re welcome
    是对的。但人家踩你一脚，说 Sorry，你就用 welcom e了，应该说 It''s ok.


    其实，只要掌握一些基础的话法在国外沟通就能无障碍了，然而，想要让自己的英文更地道，你需要了解更多东西方的文化差异和地道表达。


    就让我们在专栏中一起学习地道英语吧！


