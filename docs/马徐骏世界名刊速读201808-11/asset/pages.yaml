    \n所以说，对于网上的消息靠不靠谱这个事儿，大部分人心里是有数的，网络假新闻的影响力并没有您想那么大。\n\n其次，陈立宇对于现在处理网络假新闻的方式不认同。现在处理网上假新闻的消息，其实跟治病害的方式非常像，就是找到消息的来源，进行删除，就好像我们找到一种疾病引发的原因，然后从源头上面进行消灭。但问题是，都已经传播开了，病毒，处理源头也解决不了问题。就好像感冒已经发生了，治好第一个得感冒的人，也没办法阻止其他人患感冒。\n\
    \n有人主张说，能不能把人工智能引进来，像媒体警察一样帮我们区别，哪些消息是可信的，那些是不可信的呢？问题是，真假的标准，不是人类制定的吗？人类自己都很难分辨对错，把价值判断这种事情交给机器，靠谱吗？而且这也会剥夺人类思辨的乐趣。\n\
    \n陈立宇说，网上的真假新闻，你经历得多了，就可以更好地辨别真伪，这是一个学习的过程。而用机器来代替，会削弱人的适应力，就好像你永远呆在四季如春的环境里面，一下子去酷热或者严寒的环境里面，身体就可能受不了，要生病了。\n\
    \n难道就放任不管假新闻了吗？当然不是。陈立宇认为，政府的行政监管是行不通的，管理方法，可以参考美国广播业是怎么处理假新闻的。\n\n在美国，曾经为了管理广播里的言论，出台过一个公平原则，the\
    \ Fairness Doctrine，就是如果你在广播里发布了一条右翼的言论，那你必须按照相同的时间长度，再发布一条左翼的言论，来做一个平衡。\n\n但是咱们都知道，极端的东西，肯定没有那么多的受众，也就不太受欢迎。一旦广播的盈利模式变成了广告为主，那广告主肯定是希望有更多的\
