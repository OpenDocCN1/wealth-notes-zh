  md: '整体精神以及心理上也有着很深的影响。


    # 自然灾害重塑日本群体文化


    在日本文化中，他们认为人类永远都不可能与自然对抗或者征服大自然。当自然灾害来临的时候，个人唯一能做的就是保持镇静和坚强，默默忍受。这样的共同意识造成了日本社会强调集体不强个人，他们认为表达情绪会等于承认脆弱，寻求帮助是不好的行为，对此持负面态度。


    而如果一个人谈论自己精神健康上的问题，那在他们看来就是一件很羞耻的事情了。对于日本人来说，谈论压力就是一件让人很有压力的事情，甚至比压力本身更让人有压力。


    日语的特点，也能反映出日本人与人之间的关系。在与人交谈时，你要考虑对方的地位、关系，哪怕有一点儿的用语不对，对别人来说都是一种冒犯。种种因素结合在一起，就导致很多日本人非常排斥社交，极力避免在现实社会中与他人的交流和互动，因为压力太大了。


    压力也可以部分解释日本的低生育率问题。长期处在压力下，男性的精子、女性的排卵、以及他与生育相关的方面都会受到影响。压力大和皮质醇水平高，也会降低女性的性欲，有45%的日本女性表示对性生活完全无兴趣，也有“很讨厌性生活”，而25%的日本男性也表示有相同看法。


    对于压力，说得少不代表没问题，日裔美国历史学家比尔·简井 (Bill Tsutsui) 就说：‘在谈论压力方面，日本人比美国人谈论得要少多了，但是，日本社会简直就是个星球上最有压力的社会。尽管日本只有2.5%的人被诊断为抑郁症，而美国有6.7%的人被诊断为抑郁症，但是日本的自杀率却是全世界都出名的。’


    长时间的自然灾害也塑造了日本的艺术观，西方的艺术更喜欢表达自身，而日本艺术更强调社会性。


    日本人对于怪兽哥斯拉的痴迷就是一个很好的例子。哥斯拉的出现是日本人对于核恐惧的体现，最初的设定是破坏了核辐射而变成怪兽的远古恐龙。电影中，城市满目疮痍的镜头非常能引起日本民众的共鸣。到现在为止，和哥斯拉有关的电影已经拍了二十多部了。


    在日本人的群体文化当中，他们也有这样的一个集体观念，就是尽管东京一次又一次地被摧毁，但它总是会被重建起来。这种影响到了什么程度呢？在2011年的地震中，一对中老的夫妇在一栋楼里面困了三天，当营救人员把他们救出后，采访人员询问他们的状况，曾经在1960年经历过海啸的老爷爷，居然满面疮痍地说道：‘让我们再重建一次吧。’这个例子充分体现了日本坚韧的民族性，从这个角度来说，灾难对日本人也有有一点积极意义。


    好，总结一下今天的内容，自然灾害在生理上，对日本的基因造成了影响，让他们感受到的压力更大。与此同时，自然灾害也塑造了日本的集体文化，让他们压力水平很高却羞于谈论压力，导致很多人避免社交。社交本身可以缓解压力，但在日本，社交本身就令人有压力了。


    《大西洋月刊》「为什么日本的出生率这么低？”


    # 本期关词


    +   * traumatic：创伤的

    * trauma：创伤。用来表示精神、心灵、或者身体上的重大创伤，比如 injury 严重

    * post-traumatic stress disorder：简称 PTSD，创伤后精神紧张性障碍

    * collective：集体的

    * collective culture：集体文化

    * collective memory：集体记忆


    # 本期名句：


    社交确实可以缓解压力，但在日本，社交本身就令人有压力了。


