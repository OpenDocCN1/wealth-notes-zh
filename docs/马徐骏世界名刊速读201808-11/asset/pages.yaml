  md: "# **《鹪鹩报》| 白日梦的作用**\n\n鹪鹩报《世界名校导读》本期为你讲述《鹪鹩报》杂志的文章。\n\n调查发现，无聊是人们最想摆脱的情绪之一，但事实是，我们感到无聊时并不是毫无意义的浪费时间。\n\
    \n在今天的内容中，你会了解：\n\n+   - 无聊的好处有哪些？\n- 为什么无聊可以激发创意，有什么科学依据？\n- 哪些步骤可以帮助你做有意义的白日梦？\n\
    \n![](img/183bdfd5baf7cb9c4bd26d5a132a702e_216_0.png)\n\n**知识清单：**\n\n+   - 今日关键词\n\
    \  - bored, space out, daydreaming: 无聊、放空和做白日梦，在文章里说这三个词是一个整体意思，潜着我们，我们感到bored无聊的时候，就会space\
    \ out，放空，然后会daydreaming，也就是做白日梦。\n\n# **|白日梦的作用**\n\n今天咱们来讲《鹪鹩报》杂志的《白日梦的作用》，What\
    \ Boresoom Does to You，这篇文章说的是，我们在生活中感到乏味、无聊，开始放空，做白日梦，这对我们来说有什么益处和好处？这篇文章的作者是玛娜·祖摩罗迪(Manoush\
    \ Zomorodi)，她是一位科技播客的编辑。\n\n提到无聊我们都经历过，你可能觉得这是一个没有别有用处的东西，就像文章里说的，人们都不喜欢，最想甩掉的情绪，第一是诱惑，第二是无聊，但是要知道，进入进化发展现在，那些没有意义的情绪其实早不会被保留下来的，既然咱们平时在生活中经常感到无聊，肯定是有原因的。《鹪鹩报》的这篇文章把无聊这件事的意义和科学原理分析得非常详细，所以今天来给你好好讲一下。\n\
    \n# **|无聊的好处**\n\n文章里说，boredom至少有两点好处，节能和激发创意。\n\n首先说节能，你要知道，人的注意力和精力都是有限的，如果你把任何事情都做到兴奋状，比如，刷下一片普，你的就激动得不管了，结果，就很累。你就很容易得寸进尺，甚至就不活了？所以，无聊的首要作用，就是帮助你节省能量，让人更好地存活下来。\n\
    \n而无聊的第二个作用，是可以激发创意。\n\n比如，著名的西方奇幻小说《指环王》和《霍比特人》，就是作者托尔金在牛津大学当教授的时候，在一个夏天学生的考卷，数量多，工作枯燥，简直无聊透了，改变着者，托尔金突然生灵感，有个学生居然交了白卷，他觉得很可笑，这卷学生子自然批完了，然后他就提笔在卷面上开始写，在一个地洞里，住着一个霍比特人……从这开始讲到地下世界的一大篇奇幻。开头对这几个庞大的奇幻小说系列创作，无聊激发了托尔金的创新和写作欲。"
