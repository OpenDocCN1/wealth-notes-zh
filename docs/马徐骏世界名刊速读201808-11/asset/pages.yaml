  md: "过度自信，在主导群讨时，这些人就是一副领导做派，经常打断别人说话，还经常命令别人。\n\n在工作环境下，总要插话效果可不好。如果团队里有个总打断别人的人，团队的其他成员就没有办法顺畅表达自己的观点，分享关键信息，时间久了，肯定会阻碍项目的顺利推进。\n\
    \n# | 破局之道\n\n面对爱插话的同事，有三招可以帮助你：预告式发言、私下沟通、寻求团队协作共同解决问题。\n\n第一，预告式发言。预告式发言就是在你开始说话之前，先说一下你准备说什么，并且规定好什么时候可以插话、表达观点。本质上，就是设立大家共同遵守的规则。\n\
    \n职场顾问罗拉·罗斯（Laura Rose）建议这样说：“我接下来的话会分成几部分，所以先让我跟各位完整地讲一下来龙去脉，然后大家再各抒己见，说说自己的想法，咱们集合智慧。”这样既不得罪人，又能给自己流出时间和空间。\n\
    \n第二，私下沟通。预告谈话内容是解决插话的有效方法，但如果对方还是插话，私下聊聊也是个不错的选择，但要注意方式。与对方谈这个问题时，首先要明确你的目的，单纯的指责不仅不能解决问题，还可能激化你们的个人矛盾。以解决问题为目的，要先假设对方插话并非出于恶意，人家可能都不知道自己有这个习惯，甚至没有意识到自己说的话是一种插话行为。在这个前提下，你和对方沟通时，就可以心平气和地讲一下你所观察到的情况，这个情况发生了多少次、持续了多久、对别人和对别人造成了怎样的影响，有理有据。千万注意，不能当着别人的面和对方谈这个问题，要私下好好说，注意措辞。\n\
    \n第三，寻求团队协作共同解决问题。也可以不要把问题聚焦到某一个人身上，可以征求团队协助。你可以在团队谈话中，对所有的人都说：“咱们现在思考一下。我们的沟通方式，我们哪些地方可以改进。”这个时候就可以提出这个问题，比如：“当别人在表达自己的观点的时候，我们是不是应该先让对方完整地说完，再给出自己的观点呢？这样每个人都可以顺畅地表达自己的观点。”这么说，就可以把这个问题放到所有人面前，成为大家共同面临的挑战，共同要解决的问题了。\n\
    \n总结一下，人们插话的背后有多重原因，有可能是文化背景，也有可能急于展现自己的权力，当人们想向别人展现权力的时候，更容易主导谈话，打断别人。这句话也被我选做今天的金句：People\
    \ tend to dominate conversations and interrupt when they want to signal power\
    \ to others.\n\n无论是哪种原因，让每个人都有机会能够顺畅表达观点，一定可以让沟通更有效。如果有同事总喜欢插话，你也可以更苦恼。在开会的时候使用预告式的介绍就是一个有效的方法，私下沟通，借助团体的力量，当做一个话题的讨论也很好。其实这几招也不止在职场上可以用，你在生活中跟家人、朋友要谈重要事情的时候，为了保证沟通的效率，也可以这么做。\n\
