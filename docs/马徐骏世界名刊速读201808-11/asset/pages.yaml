  md: "操论》17年之后，写了《国富论》，他反复强调，如果你没有道德，你就不可能挣钱。\n\n联合利华在波尔曼的带领下，所有的业务和发展方向都是以“商业与环境共同发展”为原则制定的。比如，从2008年到2016年，联合利华生产每吨产品所需要的能源降低了将近四分之一，在成本上节省了超过4.7亿美元。\n\
    \n截止到2015年，联合利华超过55%的农产品供应商都来自可持续资源。这归功于联合利华对供应商技术革新的支持，比如说对于它们旗下的汤类产品，联合利华设立了一个100万欧元的基金，专门用来投资班加和加利福尼亚农场的番茄滴灌技术，既大大增加了产量，又节省了用水。\n\
    \n再比如，2016年，联合利华宣布它们已经成功地实现了600家工厂的零垃圾填埋处理，所有的垃圾都通过分解、回收、再利用得到了处理，效果非常好。波尔曼说，人们现在那儿工作得更开心。专门服务提升了，产品质量也上来了，还节省了超过2亿欧元。\n\
    \n波尔曼做的另一件了不起的事情是培养新兴市场的消费习惯。这些新兴市场，一般都是贫穷国家。比如说联合利华在印度和非洲地区，安装了很多厕所，这极大程度地降低了传染病的发生，与此同时，也大大提升了厕所清洁剂的销售。\n\
    \n联合利华在印度全球推广香皂时，就在水池里设立洗手课程。全球每年都有将近200万儿童因为腹泻和肺炎死亡，这是完全可以借由改变卫生习惯改变的。联合利华希望孩子们在学校会洗手和相关卫生常识，回家后再教给他们的家人。结果显示，这个训练让当地的腹泻发生率降低了25%。\n\
    \n这些举措也为联合利华带来了丰厚的收益，在2016年，被联合利华定义为可持续品牌的产品，占了他们销售额增长的60%，比他们同类产品线的增长快了50%。\n\
    \n环保与盈利两不误，连本期 的《彭博商业周刊》都说，联合利华向世界展示了，企业发展是可以与环境共生双赢的。\n\n从波尔曼上任开始，联合利华的年销售额已经从400亿美元，涨到了将近530亿美元，一路发展非常稳健。但波尔曼也面临着来自各方的压力与挑战。走可持续发展的道路，需要大量的时间和成本投入，有些投资者往往只关注企业短期的收益状况。甚至有些资本，根本不在乎波尔曼的那一套，就像3G资本，它们更希望，大力压缩成本，获得高额利润。\n\
