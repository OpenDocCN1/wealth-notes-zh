    关于思维方式，咱们讲了mind set 这个词，纳德拉把思维模式分成两类， fixed mind-set（固化思维），和 growth mind-set（成长式思维）。


    不管是学习者还是领导者，拥有 growth mind-set（成长式思维）的人更容易适应时代的变化，成为引领者而不是追随者。


    另外咱们文章里说了，在鲍尔默准备让位的时候，大家并不觉得做CEO的工作是差事，文章里有“ 差 miss 这个词的英文表达， plum assignment
    。plum，本意是“李子”，就是咱们吃的那个水果。做形容词用的时候，指“称心如意的、理想的”，一般用在工作和职位上， assignment 是“任务、工作”的意思，组合起来，
    plum assignment 就是“美差、好活”的意思了。这个表达形象而且地道。


