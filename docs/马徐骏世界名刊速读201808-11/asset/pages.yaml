  md: '# # 《经济学人》 | “无子化”的兴起


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_23_0.png)


    我们都知道无子化是很多国家担心的问题。在世界各地来看，生育率降低，不愿意生孩子的人越来越多，这是为什么呢？而那些没有孩子的家庭，他们生活得怎么样？


    在今天的音频中，你将听到：


    +   - 人们为什么不生孩子？是女性的因素更多，还是男性的？

    - 在德国，乌鸦妈妈指的是什么？

    - 无子群体的生活状态是什么样的？


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_23_1.png)


    # ## 知识清单：


    # ### | 今日关键词


    childless：这个词的意思是“无儿无女的，无孩子的”，变成名词childlessness也是这个意思。


    DINK：丁克。它是“Dual Income、No Kids”的缩写。dual的意思是“双，两个的”，income是收入，连在一起就是“双方都有收入，但是没孩子”的意思。


    # ### | 无子化的兴起


    今天的内容来自《经济学人》，标题是《无子化的兴起》， The Rise of Childlessness。


    这篇文章，将目光聚焦在发达国家，比如英国、德国、美国等。在这些国家里，无子化的现象越来越明显。这篇文章讲的是这一现象背后的原因。


    总体来看，人们会出于各种原因不要孩子，但是其中有很大一个群体，他们被南普顿大学的人口统计学专家安·伯林顿（Ann Berrington）称为永久拖延者，这些人觉得自己应该在完成了所有教育之后再组建家庭，组建家庭之后，还得再有一份稳定的工作和住所，在这一切都完成了之后，他们才觉得可以要孩子，而一般来说那个时候已经太晚了。


    # ### | 人们为什么不生孩子


    在做是否要孩子的决策时，女性是被各种因素影响的主体。


    1. 社会环境对职场妈妈的友好度影响女性是否生孩子'
