    # 沉浸： Immerse


    周四我们讲了《万志》杂志网站的文章《大自然的治愈力量》， The Healing Power of Nature 。


    这篇文章从科学的角度给我们解释了大自然到底对我们有什么益处。


    其实在做这篇稿子的时候，我们团队里就有小伙伴感慨，人一直生活在大自然里，我们的身体本来就是适应大自然的。 着样子说就是为了在自然都市生活，让我们在电脑前久坐，没完没了地刷手机，跟自然隔离，肯定健康不了啊，读了这篇文章，感觉更需要去回归大自然。


    咱们讲了immerse，也就是“沉浸”的意思，通常和in搭配， Immerse yourself in sth .“沉浸式体验”，英文是 immersion
    experience 。


    来源：《万志》，大自然的治愈力量


    # STEM


    周五咱们讲了《纽约客》杂志的文章《文明究竟是如何产生的》， How Civilization Started .


    这篇文章告诉我们，文明是个中性词，它每一次向前都会让人类付出代价，今天的我们未必就比祖先的幸福感更高。


    文章关键词叫 STEM ，这个词有两重含义，如果用小写， stem 指植物的主要部分，比如树干、茎， 我们在学单词的时候也会碰到 stem ，指的是一个单词的主要部分，比如
    unfriendly (不友好的)， stem 就是friend 。


    如果大写的话， STEM指的是四个单词的缩写，分别是Scien ce (科学) 、 Technology （技术）、 Engineering （工程）、 Mathematics
    （数学）的首字母。因为美国很重视STEM的教育，所以你会看到，有不少中国的留学机构会打出 STEM 培训的课程，专门针对要去美国读书的留学生。


    来源：《纽约客》文明是如何产生的？


    # 马徐俊


    本周我们讲到了选择。人生的道路其实都是没有回头路的，在关键时刻做出正确的选择，可能比付出多少努力还重要，但就算选错了，也别气馁。我有一句话喜欢，“每条道路，都是人生的必经之路。“只要从错误里吸取了教训，就不算走错了道路。


    本周的周末推荐是刘慈欣的科幻长篇科幻小说《三体》。另外吧，“每天听本书”也上新了孙少老师对你欣总结得着名的《三传》三部曲的解读。我写自也是科幻迷，这部小说看了不下十遍了，每一次看，都会有些新鲜的收获和不一样的感受，但是，这次听到孙老师的解读，发现他提炼出了15个思想实验，又让我多了一个理解的维度，启发非常大。强烈推荐给你。


