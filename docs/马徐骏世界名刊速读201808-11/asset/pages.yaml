    \n+   - **知识清单：**\n    - **今日关键词**\n        - **scent [sɛnt]：** 气味、味道。咱们通常提到气味、想到的第一个词就是smell，今天再来学一个词，scent，可以指人身体散发出来的味道，也可以体味，就是body\
    \ scent。\n        - **sniff [snɪf]：** 闻。如果我想用英语说“闻”这个动作，你肯定想到了第一个词还是smell 吧，闻，嗅\
    \ 这个动作还有一个动词，就是sniff。\n    - **你的秘密超能力**\n        - 今天的文章来自《发现》杂志的封面文章《你的秘密超能力，Your\
    \ Secret Superpower》。作者是法国著名科学作家乔治·泽拉卡斯。\n        - 这一页杂志的封面图很有意思，是一个男人穿着一套西装，口袋里插着口袋，一副很自信的样子，西装袖口露出超人的衣服，有隐藏在身体里的超能力的意思，对应今天的主题。不是香车，这张文章说的是我们的秘密超能力就是我们的嗅觉，这个被严重低估的能力，在我们不知不觉的时候，我们的吸引性，帮我们选择伴侣，那它到底是怎么做到的呢？\n\
    \    - **情绪有味道**\n        - 气味可以透露一个人的情绪情感，比如开心，悲伤，或者害怕，这是很普遍的反应，但是在生活中嗅觉容易被忽略。\n\
    \        - 德国神经科学家杰西卡·弗雷尔（Jessica Frey）就发现，人在生活中更靠嗅觉而不是味觉。\n        - 这并不意味着我们在嗅觉上就比较差。2014年的一项研究表明显示，人类至少可以分辨出一万七千种不同的气味，而之前估计只有一万种。\n\
    \        - 我们内在的嗅觉能力这件事本身就很简单，因为人类的话语言能传达那么多信息，气味传递的信息，而且大多数的气味和体味的信息，都是潜意识完成的。我们压根就意识不到。\n\
    \        - 其他的感官系统，比如视觉系统、听觉系统向大脑，意识是产生意识的核心环节，让我们意识到这些感官，而嗅觉系统向大脑皮层提供信息，会唤起无意识的感知和记忆。也就是说，气味让我们无意识、不知不觉地受到影响。\n\
    \        - 这些无意识就处理了的气味，给我们提供了关于他人的信息，比如情绪。情绪不仅有味道的，而且包含清洁的讯道，会传递这种信号。这包括有点绕，举个例子你明白了。\n\
    \        - 咱们刚才提到的神经科学家弗雷尔，在2015年发布了一个实验研究。在这个实验中，研究者们找来了一百六十八个男士。研究首先让这些男士参加讨论会，他们被随机地分成两组，被让去收集一些组，在过程中收集他们的汗液。这是第一组汗液。\n\
    \        - 这是这群人，研究者说，让他们去参加了一次计算机数学测试，随后告诉他们，他们的成绩比之前都更差了，平均，再一次。和前面说的一样，让他们去健身房，收集他们的汗液，这是第二组汗液。\n\
    \        - 随后研究者又找了一些志愿者参加认知能力测试，在测试之前，让志愿者闻了两组汗液。研究结果是很有意思。第一组汗液———就是被说没有说谎的那组人的汗液。闻了之后，志愿者在随后的测试中，注意力不集中，反应速度会比被试的状态还差。\n\
    \        - 还是这组人，闻第二组汗液，就是被说比之前好的那组人的汗液时，他们的情绪很好，在运动中，这种情绪就感染了实验参与者，也通过气味传递了接下来，实验的参与者。\n\
    \        - 生活中的例子也不少，比如说你要去见一个朋友的时候，他正好在用某款很香的水果，你能闻到那种水果的香气，当然也顺便知道那个水果很好吃，但是如果你的朋友刚刚看完恐怖电影，他散发出来的气味，也许更有可能是他的汗液散发出来的，你感觉有点恶心和害怕，这一切都是潜意识的，你的大脑直接处理了。\n\
    \        - 在科学上验证这一点的实验是这样的做的，2015年英国的研究者，他们利用电极来记录志愿者在闻不同气味时面部表情。他们是汗液，有两组，一组汗水来自看着恐怖片的观众，另一组来自看搞笑电影的观众。研究者发现，志愿者在闻着恐怖观众的汗水时，他们面部表情就表现恐惧；闻着搞笑观众汗水时，他们面部就呈现出高兴的表情。\n\
    \        - 换句话说，就像气味这种化学信号，其实是你大脑里敲响了警钟，引起你的注意。比如这个地方，有危险的地方，你可能在五分钟之前，这个地方走过一个心感到害怕的人。\n\
    \        - 身体散发出的气味不仅仅能揭示关于情感状态的信息，它还能帮助我们更好地挑选伴侣。\n    - **气味帮助挑选伴侣**\n     \
    \   - 人体气味不仅可以透露情感状态，还可以透露出健康状况以及和异性在生理上是否相匹配的信息。\n        - 《心理学家》期刊在2014年曾经发布过一个实验，这个实验验证的就是人类能不能通过汗液判断出对方的健康状况。\n\
    \        - 实验是这样的，医生们为了参与实验准备了八份汗液，这个汗液是8个健康人的汗水，参与实验的参与者闻了这些汗水的人，有3个人不健康，作者在这篇文章就说道，从进化的角度上来看，能够闻出感染或者疾病的人，不太容易选择有病的伴侣，有利于传播疾病。\n\
    \        - 科学家很早就知道，像老鼠这样的动物，可以通过闻彼此尿液来判断它们的基于性关系。研究显示，人类也有这种能力。\n        - 芝加哥大学的科学家做了这么一个实验，让一群女生闻不同男性在运动了两个小时之后留下的汗液，结果发现这些女性能够明显地挑出和他们基因最近的一些。你要知道，这些基因组会有大部分有非常大的差异，它们之间会有大量的共同点和差异，这些差异包括有少数几百种不同的变异基因。芝加哥大学有几百种不同的变异基因。这些基因有大有小，小的是影响一些小的方面，比如身高，有的是很大的，比如决定某些疾病风险的基因。研究团队发现，人们会倾向于选择基因匹配度不同的异性作为伴侣，这有利于保持遗传多样性，降低遗传疾病风险。"
