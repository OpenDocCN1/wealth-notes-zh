    # | 杀手级演讲：Killer Presentation


    周一我们讲了《哈佛商业评论》上的文章《如何做出精彩绝伦的演讲》，*How to Give a Killer Presentation*，作者是TED论坛的掌门人，克里斯·安德森。


    杀手级演讲叫 killer presentation，好的故事、自然流畅的表达，还有不断地训练是做出一场好演讲的基础。


    killer 这个词直译就是“杀手级”的，表示“一击毙命，完结对手”的意思。killer app，杀手级应用；killer product，杀手级产品，还有文章里的
    Killer Presentation，精彩绝伦的演讲。


    在英文中，表示“杀手、刺客”的还有一个词叫 assassin，这个词来源于中东一个叫 Hassan · Sabbah（阿萨辛·沙巴赫）的人，这个人组织了中世纪最著名的杀手集团
    Order of the Assassins，活跃在第一次十字军东征时期。专门刺杀来自天主教国家的十字军将领。由于太厉害了，后来他的名字就变成了杀手 assassin
    的代名词。有一个非常著名的游戏《刺客信条》，还改编成了电影，英文名 *Assassin''s Creed*，就是根据这个团体改编的。


    有用户留言问我 presentation 和 speech 都是演讲，有什么区别？其实在口语里区别不大。较真的话，speech 的意思就是干讲，纯用语言来打动别人，显得更厉害，一般领导人都是
    用 speech 的，而 presentation 就是通过各种方式，多媒体、舞台、灯光等，展示你需要别人知道的产品或理念，更轻松，也没那么正式。


    > 来源：《哈佛商业评论》| 如何准备一场“杀手级”演讲


    # | 狂热：mania


    周二我们讲了《福布斯》杂志的封面文章《皇帝的新币》，*The Emperor''s New Coins*。


    mania，意思是“狂热”，荷兰的郁金香狂热，叫做 tulip mania。比特币狂热，叫做 bitcoin mania。mania 的另一个用法指“一个人有什么样的癖好”，have
    a mania for sth。比如，爱好开快车，就是有 has a mania for driving fast cars。另外，mania 还有“狂躁、发疯”的意思，所以
    maniac 可以指疯子，或者狂热分子。比如形容你自己爱一样东西爱到了发狂的程度，没完没了，就 running maniac。比如疯狂的跑步爱好者，running
    maniac；宗教狂人，religious maniac。


    > 来源：《福布斯》 |《皇帝的新币》——加密货币


