  md: '# 家庭背景声 | 英文朗读塞缪尔经典散文《谈话的艺术》


    马徐骏


    塞缪尔·约翰逊是英国的大家，作为十八世纪中叶以后的文坛领袖，他影响了一代的文学趣味和文化风尚。


    《论谈话》写于1752年。在这篇美文中，他告诉我们，谈话的艺术在于要给人欢乐。而给人欢乐的谈话与知识的多少、地位的高低不成正比，人们可以通过不断地给人讲故事以博人一笑，但是不会讲故事的人也可以给人带来欢乐，一个天生的乐天派、一个生性平和的人和一个谦虚的人都可以给人欢乐。给人欢乐者受人爱戴，而受人爱戴无疑是所有人都喜欢的。


    ![](img/183bdfd5baf7cb9c4bd26d5a132a702e_125_0.png)


    Conversation


    None of the ills dictated by vanity is more general, or less blameable, than that
    of being distinguished for the arts of conversation. Other accomplishments may
    be possessed without opportunity of exerting them, or wanted without danger that
    the defect can often be remarked; but as no man can live, otherwise than in a
    hermitage, without hourly pleasure or vexation, from the fondness or neglect of
    those about him, the faculty of giving pleasure is of continual use. Few are more
    frequently envied than those who have the power of forcing attention wherever
    they come, whose entrance is considered as a promise of felicity, and whose departure
    is lamented, like the recess of the sun from northern climates, as a privation
    of all that enlivens fancy, or inspirits gaily.


    It is apparent, that to excel in this valuable art some particular qualifications
    are necessary; for every one’s experience will inform him, that the pleasure which
    men are able to give in conversation, holds no stated proportion to their knowledge
    or their virtue. Many find their way to the tables and the parties of those who
    never consider them as the least importance in any other place; we all, at one
    time or other, been content to love those whom we could not esteem, and been persuaded
    to try the dangerous experiment of admitting him for a companion, whom we knew
    to be too ignorant for a counsellor, and too treacherous for a friend.


    The first place among those who please, because they desire only to please, is
    due to the merry fellow, whose laugh is loud, and whose voice is strong; who is
    ready to echo every jest with ostentatious approbation, and countenance every
    frolic with vociferations of applause. It is not necessary to a merry fellow to
    have in himself any fund of jocularity, or force of conception: it is sufficient
    that he always appears in the highest exaltation of gladness, for the greater
    part of mankind are gay or serious by infection, and follow without resistance
    the attraction of example.


    Next to the merry fellow is the good-natured man such as indolence and insensibility
    confer. The characteristic of a good-natured man is to bear a joke; to sit unmoved
    and unaffected amidst noise and turbulence, profaneness and obscenity, to hear
    every tale without contradiction; to endure insult without reply; and to follow
    the stream of folly, whatever course it shall happen to take. The good-natured
    man is commonly the darling of the petty wits, with whom they exercise themselves
    in the rudiments of raillery; for he never takes advantage of failings, nor discounts
    a puny satirist with unexpected sarcasms; but, while the glass continues to circulate,
    contentedly bears the expense of uninterrupted laughter, and retires rejoicing
    at his own importance.


    The modest man is a companion of a yet lower rank, whose only power of giving
    pleasure is not to interrupt it. The modest man satisfies himself with peaceful
    silence, which all his companions are candid enough to consider as proceeding
    not from inability to speak, but willingness to hear.


    Such are the arts by which cheerfulness is promoted, and sometimes friendship
    established; arts, which those who despise them should not rigorously blame, except
    when they are practised at the expense of innocence; for it is always necessary
    to be loved, and not always necessary to be revered.


