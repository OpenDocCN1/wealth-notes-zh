  md: '# 周末英语加餐 |《超新星纪元》


    周末英语加餐 |《超新星纪元》


    +   • 马徐骏


    你好，欢迎来到《马徐骏-世界名刊速读》的 Weekend Review，周末复习。


    本周我们学到的表达有：


    +   群体智慧：wisdom of crowds

    茁壮成长：thrive

    思维模式：mind-set

    沉浸：immerse


    +   • 群体智慧：wisdom of crowds


    周一的内容来自于《鳄妈妈》杂志的《如何做出明智的选择》，How to Choose Wisely。


    这篇文章讲的是这个时代，面对越来越丰富的资讯和选择，我们如何做出明智选择，比如，如何上网定酒店，如何点餐，买东西怎么选。


    作者提出的主要建议有两条：正确使用群体智慧来做决策、遵从你内心的想法。留言里很多同学表示了对于文盲 quote：Just go with your gut，let
    your neurons decide（跟着感觉走，让直觉替你做决定）这句话的赞同。


    群体智慧的英文是，wisdom of crowds 或 Collective Intelligence（简称CI），这一概念最早来自于昆虫学，用在人类的群体决策里要注意的是，只有当所有人独立做出判断之后，综合起来，在群体智慧才是正确的。


    我看了这篇文章的时候想到著名科幻小说《三体》的作者刘慈欣写过一部长篇小说《超新星纪元》，讲的是世界上没有成年人之后，孩子们如何靠自己生存。这里面有一个场景就是，所有的孩子通过量子计算机在虚拟空间里集体决策得出结果。其实这背后的原理就是wisdom
    of crowds。


    另外，有一本社会心理学畅销书，古斯塔夫·勒庞的《乌合之众》，也讲到了群体智慧和群众心理的问题，这本书的标题就叫 The Crowd: A Study of
    the Popular Mind，推荐你看看，“每天听本书”中也有解读版本。


    这里补充一个‘乌合之众’的说法，mob，这个词有“暴民、暴徒”的意思，指的是不受控制的人群，还跟暴力行为有所联系。这是个贬义词，不能随便用。要表达中性的意思还是用
    crowd。


    来源：《路妈妈》如何做出明智选择


    +   • 茁壮成长：thrive


    周二我们讲了《麻省理工技术评论》的文章《微信能在美国蓬勃发展么？》，Can WeChat Thrive in the United States？


    在中国移动社交领域一统天下的微信，为什么在美国就没有发展起来呢？文章里给出的理由是：微信在美国没有网络效应，功能不落地。一个市场的后来者，哪怕在原有的领域和地区已经做得非常好，但是很难复制成功。想要成功，就应该出奇制胜。


    咱们讲了“茁壮成长”的英文 thrive，同样表示“兴旺、昌盛”的英文单词，还有 flourish 和 prosper，这三个词里，flourish 一般用来形容植物，比如茂盛的森林、长势很好的植被；thrive
    指得更宽泛一些，植物、人和事物都可以。


    这篇文章里面说到微信的“成功”，用的就是 thrive，在不确定的情况下，用 thrive 基本不会错，而 prosper 指“持续不断地成功、繁荣昌盛”的意思。


    著名的电影《星际迷航》里有一句非常有名的台词，Live long and prosper，这是瓦尔基里人的祝福语，可以翻译成“生生不息，繁荣昌盛”。配合这句话还有一个手势，叫“瓦尔基里祝福礼”。


    这句话和手势也是西方流行文化的一部分，如果你老外，特别是男生打交道的时候，用出来，他们会会心一笑，说明你懂他们的文化。


    Live Long and Prosper


    来源：《麻省理工技术评论》微信能征服美国市场？


    +   • 思维模式：mind-set


    周三我们讲了《快公司》的封面文章《重讲微软》，Microsoft Rewrites the Code。


    这篇文章说的是微软的现任 CEO 萨蒂亚·纳德拉是如何重新让微软焕发活力的。


    很多同学在留言中提到，learn-it-all（一切皆可学），而不是 know-it-all（什么都知道）的思维方式对于自己非常有启发。这也是我们专栏的价值，带你打住正在不断变化和演进的真实世界。


    关于思维方式，咱们讲了 mind-set 这个词，纳德拉把思维模式分成两类，fixed mind-set（固化思维）和 growth mind-set（成长型思维）。不管是学习者还是领导者，拥有
    growth mind-set（成长型思维）的人更容易适应时代的变化，成为引领者而不是追随者。'
