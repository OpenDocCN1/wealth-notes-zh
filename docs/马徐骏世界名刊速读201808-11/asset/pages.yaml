  md: "引发的后果是，有人被打得犯下了心脏病，还有人绝望地试图服毒自尽。总之，那大晚上，美国乱成了一锅粥。\n\n这是传媒业的一个经典案例。也引发了美国国内大辩论：广播作为一个有巨大影响的传播媒介，尺度应该在哪里呢？不少知识分子本来自期望广播可以承担普及知识、教化大众、创建更加平等的民主社会的功能，结果居然是这样。所以有人就主张政府要管理起来，对不真实的crackdown，镇压。\n\
    \n听到这儿，有没有觉得这种态度跟现在大众对于网络假消息的态度很像？但是文章作者陈立宇的看法却不是这样的，他认为，要遏制假新闻，就要更加商业化。\n\n#\
