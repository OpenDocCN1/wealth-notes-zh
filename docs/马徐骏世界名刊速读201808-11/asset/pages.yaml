    \n![](img/183bdfd5baf7cb9c4bd26d5a132a702e_171_0.png)\n\n这个蓝鲸计划，就是利用代数拓扑学来发现、分析这些几何结构，这个要是弄清楚了，可就太了不起了，它能造成多大的差别呢？\n\
    \n下面这张图是两张图组合在一块儿的，左边的图是杂乱无章的脑神经连接图，看起来让人眼花缭乱，而被这些脑科学研究家使用代数拓扑学分析之后，就变成了右侧这样，这些神经元变成了一个个的几何结构，井然有序。\n\
    \n![](img/183bdfd5baf7cb9c4bd26d5a132a702e_171_1.png)\n\n# 终极目标\n\n这些发现，对于人类，有什么用呢？\n\
    \n当我们的大脑思考、学习和记忆时，神经元会迅速连接，形成我们刚才说的神经元团，构成多维几何结构。这些结构转瞬即逝，就像是沙滩上用沙子堆成的城堡，海水一冲，就抹去了所有痕迹。\n\
    \n问题就在这儿，在神经元团当中发生的一切都太快了，科学家没有办法追踪到信息是如何从一个神经元传输到另一个神经元的。蓝鲸计划就能解决这个问题。研究者说：“代数拓扑学就你像是显微镜和望远镜的结合体，它既能让你看清高，也能放大网结构，寻找其中隐蔽的结构。就像能同时看清森林里的树木和森林全景一样。”\n\
    \n如果蓝鲸计划能够完全模拟人类大脑，刚才说的这些问题，比如追踪信息在神经中的传递、神经如何连接，简直就是要小一碟。它能够解释我们今天一开始提出的问题，人和人的大脑，细胞构成几乎是完全相同的，但为什么每个人体现出来的聪明才智是不一样的呢？那也许就是因为，每个人大脑当中的神经元形成的几何结构是不一样的，所以产生的作用也不一样。\n\
    \n弄清楚这些转瞬即逝的神经元团如何形成，弄清楚它们如何传递信息，然后又如何消失，以及这些复杂的几何结构的意义，就能明白大脑的运作方式，弄清楚大脑如何让我们产生想法和感觉。最终，就可以揭示脑科学的终极奥义，那就是，人类的意识，consciousness\
    \ 从何而来。\n\n好，总结一下今天的内容，在脑科学上，有一个重大的尝试，就是将现代代拓补学应用到神经科学中，我们的大脑中存在非常复杂的多维几何结构，也许在不远的未来，我们就能够真的弄清楚我们的想法、意识从何而来。正如文章当中所说，人类意识，也许只是高维结构的一个投影。\n\
