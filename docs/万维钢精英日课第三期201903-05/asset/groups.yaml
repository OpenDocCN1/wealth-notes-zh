    ## 期权的智慧4：现在和未来哪个更重要


    万维纲·精英白课3

    今天


    期权的智慧4：现在和未来… 12:20 8.48 MB


    今天咱们继续讲期权的智慧。我们这个小专题的主题并不是研究期权本身，而是研究怎么在不确定性的世界中把握机会和 quản lý风险。像“不确定性”、“机会”和“风险”这些词，老百姓一说都是泛泛而谈，说的可能都是一些主观感受而已，一说起来就...需要一个理性的、可量化、可操作的框架。


    金融理论就提供了这个框架。首先金融产品是有价的，好就是赚钱坏就是赔钱非常可测量。其次，金融市场中的不确定性跟真实世界的不确定性没有本质区别，可以说金融市场反映了真实世界的不确定性。更好的...人们在金融市场里，已经把操纵不确定性的各种手段都给拆腾明白了。现在问题仅仅是人们并没有意识到，像期权这种东西，并不只属于金融市场，这些手段可以类比到其他领域的风险操作。


    我们专栏熟悉的经济学家泰勒·科文（Tyler Cowen）去年出了一本书[1]，以经济学的视角分析人类社会未来的走向。科文使用了“贴现率”这个工具分析我们应如何面对像可持续发展和环保之类的问题。我读了这本书感觉意思不大，但是科文的博客有个读者，署名“CK”，是个证券交易员，给科文写了一篇读后感[2]。CK提出了一个原创的观点，说我们应该用*期权*来衡量人类文明的价值。


    我看CK这个分析相当于是用期权理解未来问题的框架。人文文明的命运是一个虚无缥缈的问题，但是期权思维，可以帮我们看清楚，应该如何在现在和未来之间做出取舍。


    现在和未来之间的取舍，或者说“现实和梦想”、“眼前的苟且”和“诗和远方”，是人生中最重要的一個两难问题。有時候我們說要“活在當下”、“過好每一天”、“花開堪折直須折”，有時候又說要“面向未來”。有時候說要“不計一城一池之得失”，有時候又說要“寸土不让”。那到底该怎么办呢？


    如果你永远只顾眼前而不为未来打算，你就肯定走不远；但是你也不可能永远只投资不要回报，或者只学习不工作。那这个“度”，到底应该怎么把握呢？期权就是专门操作这个“度”的。


    我们设想一个 call 期权。它允许你以一个固定的履约价格，在未来某个日期，买入一只股票。那么落实到“现在与未来”这个情境，就是——


    - 这只股票当前的價格，代表“现在”；

    - 期权规定的履约价格，代表未来的愿景；

    - 期权本身的价格，代表当前市场对未来愿景的看好程度。


    如果期权的價格很低，就代表你认为未来那个愿景不太可能实现；如果期权的價格很高，你就很看好未来。那么什么高，什么叫低呢？一只100元的股票的期权是2元，一只10元的股票的期权是1元，你能说100元那个股票的期权价值更高吗？交易员使用一个更科学的衡量指标，叫做delta。


    一个期权的 delta，代表当前股价每变动1元的情况下，期权价格变动多少。


    比如我们考虑一个当前股价是100元，履约价格是120元，到期时间是6个月之后，目前价格是10元的 call 期权。如果今天股价涨到了102元，那就说明它距离120元的目标更近了，这个
    call 的价格也应该涨一点，比如涨到了10.1元——那么这个期权的 delta，就是0.1/2=0.05。


    股票当前价格代表现在，期权价格代表未来，所以 delta，就代表相对于未来来说，现在到底有多重要。


    买 call 的 delta 的值总是在 0 和 +1 之间。Delta 的大小，就告诉了你怎么在现在和未来之间取舍。如果 delta 接近于 0，就表示期权的价格对当前股价非常不敏感，就是说当我们考虑未来的时候，现在并不重要。如果
    delta 接近于 1，就表示期权价格的变动跟当前股价几乎是一样的，就是说现在很重要。


    请注意，delta 并不是一个股票市场特有的、人为制造的东西！对任何一种不确定的未来场景，你都可以定义一个 delta，它的规律将是一样的——股票市场只是最方便地展现了
    delta 的规律而已。


    通过考察 delta 的变动规律，我们就能知道现在和未来在各种情况下的取舍。


    我们考虑三种情况。


    ### 1.宁做白须公，莫做少年穷


    如果一个期权的到期时间距离现在还很远，它的履约价格却现在高很多，那么 delta 就会很小。这时候投资者关注的是长远的表现，并不在乎近期股价波动。


    用占卜的语言来说，这是一个志存高远的“挂象”。这就好比是一个刚出校门...Delta 小，所以当前股价波动不重要，这就叫“不计一城一池之得失”。在这个情况...我相信...总而言之，从当前股价、履约价格和到期时间来看...


    ### 2.变革中的人


    Delta 的大小还跟股票的波动性很有关系：波动性越大，delta 就越小。这完全符合逻辑：如果股价每天都波动很大，或者面臨一个即將到來的大波动——比如公司即將發布財報——今天的股價是多少就沒有太大的意思。你既然選擇了买期权，就是在赌未来的变动。


    这个卦象相当於一個人搞了个创业，或者只身前往大城市闯荡，他的未來有無限的可能性。也許他本人有很高的愿景，也許他只是想走一步看一步并沒有什麼計划。他根本左右不了自己的命运。


    如果你看好他，你可以买他一个 call；如果你不看好他，你可以买他一个 put——但无论如何，那个 delta 的绝对值都是比較低的，因为他今天什么样真的不重要。


    ### 3.生逢乱世


    前面说的那个波动，如果你应对得当的话，机遇还是可以大于风险的，最多也就是创业不成把本钱赔光，最起码还有个破产保护——要不怎么会有专门买了你的 call 呢。


    但是有一种极端的情况，则是对称的风险，成敗得失全部利益均失。这就好比说一个人生逢乱世，或者出生在一个颓流离的家庭，连最起码的安全感都没有，那这時候应该怎么办呢？


    这时候应该怎么办呢？


    如果用期权模拟这个极端的情况，相当于你既买了 call，又卖了 put。你没有对冲风险，你是在体验风险。股价上行，你就能赚到钱；股价下行，你就一定跟着赔钱
    —— 而且输赢在很大范围内都不保底！


    数学上可以证明这个组合的总 delta = 1。也就是说你等于持有股票。你应该只在乎现在，完全不考虑什么未来。


    我们想想，这是不是很多贫困家庭的孩子行为模式。今朝有酒今朝醉，能享乐要及时享乐，因为明天什么都可能发生。


    我们专栏以前讲《指导生活的算法》这本书的时候讲过探索和收获的取舍，年轻人应该积极探索未知事物 —— 要不要尝试新的餐馆，要不要结交新的朋友 —— 老年人就可以好好享受探索的成果
    [3]。这一讲的话题更沉重，但是也更重要。


    现在重要还是未来重要？你得考虑自己现在是什么水平（当前股价）、对未来的的愿景（履约价格）、未来距离现在有多远（到期时间）、是不是赶上了大变革阶段（可能向上的波动性），以及是不是生逢乱世（波动的对称性）……期权思维能帮你想明白这个问题。


    关于期权的智慧，我们这个小专题就讲到这里。


    （THE END）


    注释

    [1] Tyler Cowen, Stubborn Attachments: A Vision for a Society of Free, Prosperous,
    and Responsible Inpiduals, 2018.

    [2] CK, The option value of civilization, https://marginalrevolution.com/marginalrevolution/2019/01/option-value-civilization.html
    June 2019.

    [3] 精英日课第一季，《数学家告诉你怎样慢慢变老》。


    ## 特别放送：重新认识“风险”


    万维钢 · 精英日课3

