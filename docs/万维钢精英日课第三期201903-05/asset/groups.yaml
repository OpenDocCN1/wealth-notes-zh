    ## 博弈论12：怎样筛选信号


    “学而时习之，不亦说乎”中的“习”，一般理解为复习和练习，我觉得不太对。我们知道刻意练习并不好玩。你必须在枯燥、孤独和挫折中提agg。我赞赏的一个解释是“习”应该代表实践，是学以致用。你本来谁都打不过，学了几个绝招之后出去指哪打哪大杀四方，这才叫不亦说乎。


    博弈论是一门可以学而时习之的学问。我们学习了一个博弈局面之后就举一反三，要像使用成语典故一样，在各个领域发现它的影子。有时候看起来非常不一样的几个事情，背后可能就是同一个博弈原理。比如我给你说几个事儿。


    ### 1. 怎样让信息可信


    一种常见的博弈局面是有 一方参与者知道一个关键信息，而另外一方不知道。一方强烈地想让另一方知道他的信息，但是又怕对方不信。一方强烈地想知道对方的信息，但是又怕对方说谎。


    ### 2. 逆向选择和正向选择


