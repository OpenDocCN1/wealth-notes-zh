    万维钢


    低落情绪并不是从信念系统推导出来的东西，所以有低落情绪不能怪信念系统。对人来说，情绪是比逻辑和信念都更自然的东西，是亿万年进化的产物。遇到事情不顺利而感到情绪低落，这就和受了伤会感到疼一样自然。逻辑思维可以在情绪出来以后帮我们调节这个情绪，告诉自己不要对负面情绪做过度的解读、提醒自己多想想大局、多想想正面的东西——但是不能避免情绪的出现。


    读者 David Tam：


    说到逻辑，我就想起了星际迷航的角色 Spork 和他的名言: It''s only logical. 但很有意思的是，这个高智纯逻辑的理性动物，却把舰长的职位让给了
    Kirk，甘做他的副手。而 Kirk 是一个做事有点冲动的人。这是电影的戏剧性安排，还是说，在现实生活中，走纯逻辑的理性路线的确是有陷阱呢？


    万维钢


    我认为逻辑思维能够很好地帮助我们“修身”，但是要说“齐家治国平天下”，还需要机遇和勇气。星际迷航里的人干的是冒险的事。

    比如现在我们面临两个选择，一个风险大但是成功的话回报很高，一个风险低但是回报也小，请问你选哪个呢？这根本就不是一个逻辑问题，Spork 在这种问题上并不能发挥特长——而这样的问题，恰恰是探险者最关键的战略问题。这个问题需要用直觉和勇气去判断，Kirk
