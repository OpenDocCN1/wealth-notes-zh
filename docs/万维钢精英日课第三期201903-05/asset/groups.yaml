    # 逻辑思维3：供给侧的逻辑使用者


    万维纲·精英日课³


    今天


    进入课程 ›


    逻辑思维3：供给侧的逻辑...


    咱先说个笑话。三个逻辑学家走进酒吧，酒保问他们，三位是都喝啤酒吗？


    第一个逻辑学家说，我不知道。


    第二个逻辑学家说，我不知道。


    第三个逻辑学家说，是的。


    这个笑话有点冷，需要用一点逻辑才能欣赏。要想否定“三人都喝啤酒”，只要有一个人知道自己不喝就行了。前两个逻辑学家说不知道，就说明他们自己是想喝的，只是不知道别人喝不喝。而第三个人一看前两个人都不说知道，那说明这两个人肯定都是要喝，而他自己也想喝啤酒，所以他就可以判断三人是都想喝啤酒。他们的回答有点怪，但是非常正确。


    完全符合逻辑的言行就会有点怪异。你可能会觉得，人有必要这样说吗？我们学习逻辑学并不是为了变成一个违章的人。今天这一讲说的是，你应该尝试做一个供给侧的逻辑使用者。


    # 1.逻辑与抬杠


    上一讲我们说了三种最常见的逻辑错误。其实还有一种更常见的逻辑错误，但是因为实在太常见了，我们已经不好说这到底算不算错误了。这个错误叫做“笼统陈述（sweeping
    statements）”。


    比如有个女性，经历过几次不成功的恋爱，她说“男人没有一个好东西”——这就是笼统陈述。这显然是个逻辑错误，全天下这么多男人，怎么可能一个好的都没有呢？


    再比如夫妻吵架，妻子说：“你从来都不打扫房间！”丈夫说：“你胡说！上个月5号我就打扫过！”妻子说：“你总是把厨房弄得一团糟！”丈夫说：“我刚去厨房倒了一盆水，现在厨房是一团糟吗？”


    当然你可以说丈夫是在抬杠，但妻子这种笼统陈述确实有问题。你打击的是一大片，我只要举出一个反例来，就把你的命题给反驳了。


    我们在正式场合也能看到笼统陈述，比如一个女权人士发表演说，说“每一个女性都是性别歧视的受害人”——可是难道我们就真的找不到一个没有受过性别歧视的女性吗？犯这种错误是接人以柄，遇到抬杠的就等于吵逻辑架，吵来吵去没有新信息。


    要避免笼统陈述，你说话的时候就需要加一些限定词（qualifiers），缩小陈述的范围。不要说“男人没有一个好东西”，你应该说“从我近期接触过的几个男性来看，其中大部分人的表现似乎不太怎么样。”


    “我自己的经验”、“近期”、“大部分”、“似乎”，这些就是限定词。有了限定词，你的话就精确了。类似的限定词还有——


    以我之见


    有时候


    可能


    大多数情况下


    看起来


    至少


    等等。这个精神是有一说一，别说二和三，别扩大范围。


    我以前听过一个笑话是这样的。一个工程师、一个物理学家和一个数学家，三个人坐火车在苏格兰旅行。他们看见窗外有一只黑色的羊。


    工程师说：“哈！苏格兰的羊是黑色的！”


    然后物理学家说：“不能这么说，你只能说苏格兰有些羊是黑色的。”


    这时候数学家说：“苏格兰至少有一个地方，其中至少存在这么一只羊，它至少有一面是黑色的。”


    这就是限定词的精确性。如果你觉得这些太麻烦，我们还有一句几乎是万能的限定语，叫做“在某种意义上”，英文用法是“there is a sense in which…”


    比如说，“在某种意义上，赵本山是最伟大的人”。对此别人很难从逻辑上反驳，因为他不知道你说的某种意义是哪种意义——也许在赵本山的女儿还是三个岁小孩的时候，对她来说，赵本山就是最伟大的人。


    “在某种意义上”，能让你的言论立于不败之地。可既然精确的说法这么好，为什么人们在日常生活中不这么说话呢？


    # 2.逻辑与表达


    那是因为我们想表达强烈的信念。当你妻子说你“从来都不打扫房间”的时候，她是在对你表达一种不满。她这句话有逻辑缺陷，但是她提供了一个信息。很可能你就是在家居里不怎么干活。你不能因为这句话有逻辑缺陷就认为这句话完全没意义。


    夸张，是一种常见的修辞手法。传闻甲骨文 CEO 拉里·埃里森到耶鲁大学做过一次演讲——其实这个事儿不存在 [1]——这篇演讲非常著名。埃里森说的大意是——


    请你看一眼你左边的同学，这是一个 loser。你再看一眼你左边的同学，他也是一个 loser。那你想想你自己是什么人呢？当然也是个 loser — 因为你们没有退学。我是世界第二富的人，我是这个退学生。第一富的比尔·盖茨是个退学生。第三富的保罗·艾伦是个退学生。我们这些人退学创业所以才会获得成功，你们这些好学生不退学，所以你们将来只能给我们打工。


    这里面每一句话都有逻辑问题。可是你不能不承认，他说的很有意思。他传递了一个让你无法忘怀的信息。


    有时候不讲逻辑是一种表达方式。不讲逻辑，可以传递强烈的情感。那如果别人跟你讲感情，你是不是一定要跟他讲逻辑呢？


    # 3.逻辑与情境


    相对于精确的逻辑表达，情感表达之所以容易引起误解，是因为说话的人和听话的人所处的思维情境不同。他默认和你处于同一频道，你应该能理解他的意思，但是你不在这个频道。


    尤金侃亚·程在《不讲逻辑的世界里的逻辑艺术》这本书中有一个重要例子。我们知道在美国，白人男性相对于少数族裔和女性来说是有一定优势的。比如哪个公司招人，会不自觉地就优先录用白男。我们可以说白男在美国是有特权的。


    可是如果你在公共演讲中说这句话，马上一就会有人站出来反驳你：“我就是个白人男性，可是我的收入就很低，日子过得很比我高很多，哪有什么白男特权？”


    这个人显然犯了一个逻辑错误。白男特权的意思并不是说任何一个白男的境遇都好于其他所有人——是说在其他各方面条件都一样的情况下，如果这个人是白男，他会受到额外的优待。这个优待也许并不明显，只是一个因素而已，而人生的境遇毕竟是由多种因素决定的。一个白男境遇差，并不能说明不存在白男特权。


    那你能说这个人没逻辑，然后你就把他否定了，然后就干脆忽略他吗？


    我们学逻辑不是为了打击别人。我们应该使用逻辑分析，去理解对方到底想表达什么，看看我们的分歧到底在哪里。很多情况下，是因为大家处在不同的情境，看问题的视角不同。


    在你的视角来看，你可以考察三种特权：富人特权，白人特权，男性特权。我们可以把这些特权的拥有者分成三层，如下图所示——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_31_0.png)


    最顶层的是白富男，三个特权都有。第二层是三个特权中占了两项，第三层是三个特权中占了一项，最底下一层是什么特权都没有。那么在这个分类逻辑中，一个穷白男虽穷，但是仍然拥有白、男两项特权，身处第二层，可以说是个很高的地位。


    可是穷白男本人可不是这么看的。他认为自己的地位很低！你们所说的其实是两回事。你的逻辑模型平等对待三项特权，可是在他看来，富这一项的作用实在是太大了，远远超过白和男。


    考虑到这一点，你应该做的不是否定他的看法，而是优化自己的逻辑模型。考虑到富的作用远远大于白和男，你的模型应该是下面这样的——'
  - '[PAGE 32]


    是下面这样的 ——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_32_0.png)


    在这个图里，穷白男的地位就大大降低了。他仍然位列所有穷人之首（这符合你的“特权”逻辑），同时又列于所有富人之后（这符合他的切身感受）。


    这才是使用逻辑的正途。逻辑只是对真实世界的一个抽象描述，不符合你逻辑的东西不一定就是错的，很可能只是你们抽象的方式不同。


    # 4.逻辑与供给侧改革


    所以我发明了一个词，叫做“供给侧的逻辑使用者”。需求侧的人是把逻辑当成了攻防手段，把辩论当成了文字游戏。供给侧的逻辑使用者，应该主动改变这个各说各话的局面，我们应该发挥自己逻辑分析的特长，给别人提供逻辑服务。


    咱们假想这么一个场景。你过年回家，遇到你的表弟和你的舅妈正在争执。表弟说：“那些保健品根本没有科学根据！”你舅妈说：“不对，我吃了保健品明显感觉身体好多了！”这时候你应该怎么办呢？


    需求侧的逻辑使用者会说舅妈不懂逻辑，竟然用自己的个例质疑科学结论。这个话是没错，但是这么说不能解决问题。供给侧的逻辑使用者，应该分析他们两人的分歧点在哪里。


    事实上，表弟和舅妈说的是两回事。表弟说的是保健品在统计上没有显著的疗效——但这并不等于对谁都没有疗效，只不过有效的人数不够多，不能排除是安慰剂效应而已。舅妈说的是自己的亲身体会——她不是在睁眼说瞎话，只不过她这个体会不能作为科学结论而已。


    你应该给舅妈讲讲，她感觉身体好了可能是正好碰巧了，不一定是保健品的作用，也可能是安慰剂效应。然后你再给表弟讲讲，所谓科学结论都是怎么来的，统计显著有一定的标准，没有大规模随机试验的结论也未必靠谱。你把话说明白了，争议可能就解决了。智者，应该帮人们互相理解。


    很多争议都是因为大家说的不是一回事儿。很多争议是因为大家不在一个情感频道上。“在某种意义上”，可能每个说法都有道理——而我们要做的是体察他说的到底是哪种意义。


    尤金尼亚·程反复提到一个词，叫“pedant”，意思是“炫学者”——炫耀自己有学问的人。炫学者说话会加一大堆逻辑限定语，他们不犯逻辑错误但是不接地气。我们学逻辑是为了看清事物的本质，是为了发现分歧促进理解，不是为了做一个炫学者。


    ……啊不对，请允许我重新表述一遍。以我个人谦卑的观点看来，我们中的多数人，学习逻辑，似乎，不应该，是为了去做一个炫学者。


    在某种意义上这基本上就是今天的全部内容。精英日课祝一部分读者，在听我们专栏的日子里，有时候，能有一定的收获。


