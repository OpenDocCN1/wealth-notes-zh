    ## 来自日课：永无休止的博弈


    读者 奇侠汤圆君：


    今天我读哲学史读到了休谟，突然感觉三观毁光了……故而想请教您个问题。休谟指出了归纳法的局限性，我们无法从已知推出未知，这点应该赞同。但我仔仔细想了想，科学本身就是建立在归纳法之上的。我突然想到个问题，“物理规律不随位置、时间变化而变化”这个结论是怎么得出的？我们如何确保物理规律在我们之前没有变过？又如何确保之后不会变呢？


    万维钢


    休谟说的完全正确。自然科学不能跟数学比。数学上证明一个定理，那就在逻辑上绝对是对的，但自然科学不是一个纯粹基于逻辑的体系。


    自然科学是经验+逻辑的体系。“物理规律不随位置、时间变化而变化”，这不是一个逻辑推导的结论，这是一个……信念。我们没见到反例，而且这个信念又是那么的简洁完美，所以我们愿意相信它。然后我们从这个信念出发，可以用逻辑推导其他的物理结论。但这个信念本身不是逻辑的。


    说到逻辑，下周我们要讲一本2018年的新书，《在这个不讲逻辑的世界里讲逻辑的艺术》（The Art of Logic in an Illogical World
    by Eugenia Cheng）。这本书里有简洁的数学和漂亮的推理，能帮助我们学会“讲逻辑”。


