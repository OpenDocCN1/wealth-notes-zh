    ## 美国社会的主要矛盾


    万维钢·精英日课³

    今天


    美国社会的主要矛盾


    咱们中国有个特别有意思的说法叫“社会的主要矛盾”。我们认为在每个历史时期，中国社会都有一个主要矛盾。比如说，现在的说法，当前中国社会的主要矛盾是“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾”。


    我们今天这一说的课题是当前美国社会的主要矛盾。当然美国两党并没有定期发布官方版的“当前社会主要矛盾”，我们要讲的只是一个学者的认识，而且他也没使用“主要矛盾”这个词。但是，他这个认识非常有道理，可以说代表了学界的共识，而且我认为非常符合“主要矛盾”这个提法。


    美国有个风险投资公司叫“合作基金会（Collaborative Fund）”，经常在自家网站发布一些分析文章。合作基金会的一个学者叫摩根·豪泽尔（Morgan
    Housel），去年年底写了一篇文章 [1]，回顾了美国经济从二战结束到今天的历史。豪泽尔的思路很清楚，他总结和援引了学界的认识，而且写的通俗易懂干净利索，值得全文阅读。


    我给你总结一下豪泽尔这篇文章的要点，同时说一点我的心得。但是我想先说说什么是历史。


    ## 历史是怎么前进的呢？


    这个问题有两个简单答案。一个答案是历史存在某种浩浩汤汤，顺之者昌，逆之者亡的“天下大势”。就像黄河的水一定是自西向东流向大海，每个水滴都被裹挟着前进，就算偶有抵抗也是螳臂当车。


    这个答案的毛病在于事后说总是很有道理，但是在事前，你不能用它准确预测任何事情。1945年的经济学家和美国人民完全没想到今天的美国是这个样子。1945年的中国人民更无法想象今天的中国。


    英国历史学家汤因比以前在中国有很多粉丝。汤因比认为世界各文明的发展都符合一些宏观的规律，他希望别人能把他总结的这些规律当做历史定律，就好像物理定律一样——但是他失败了。今天的历史学家都不买汤因比的账，甚至还有人把他当做“确认偏误”这个认知误区的典型案例。


    第二个答案，是认为这个世界根本就没有什么必须遵循的天下大势，所以历史不过就是一系列偶然事件的集合。这个答案是苍白的，绝对不会犯科学方法的错误。


    但这个答案的缺点是它没有用处：我们不但不能预测未来，而且也不能解释过去已经发生的事儿。那学历史还有啥用呢？


    那么我有一个想法。也许一个更好的答案应该是介于二者之间。我们不承认历史有必然规律，但是我们承认历史上各种*趋势*。


    比如说，技术进步是一个趋势，人口增长是一个趋势，生活改善是一个趋势，贫富差距的扩大或者缩小，也都是可能的趋势。


    这些趋势就是历史赛场上的参赛选手。有的趋势会在一段时间内占据主导地位。有的趋势一直进不了决赛，但也是一个角色。有的趋势辉煌一阵子就消亡了。趋势跟趋势可以合作可以对抗，互动的结果还可以孕育新的趋势。


    那么什么叫预测呢？我们无法预测比赛的结果。但是我们可以看出来一段时间之内，赛场上都有哪些参赛选手。你不知道刘邦和项羽谁能夺取天下，但你至少知道刘邦容易得罪他俩——这就比什么都不知道强得多。


    所谓“主要矛盾”，就是现在正在对抗的两个大趋势。


    有了这个视角，咱们结合豪泽尔的文章，看美国过去这几十年都有哪些大趋势。


    1945年，美国取得了二战的胜利，但是国家面临一个巨大的问题。当时美国有800万士兵在海外参战，其中650万将在18个月之内回国并且退伍，请问国家应该怎么安置这些人。这些老兵的平均年龄是23岁，他们想成家立业。那国家让他们住哪里？干什么工作？


    你儿子上大学，难道我儿子就应该上大学吗？你住大房子、开SUV、去国外度假，我为什么就不能？我至少可以借贷消费。


    结果就是美国家庭负债率进一步变大。


    最终这导致了2008年的金融危机。


    金融危机之后，很多债务被抹掉了，再加上利率低，家庭还债占收入比一下子降低到了35年来的最低水平 —— 所以这就是爆发危机的一个好处，有问题实在解决不了可以抹掉。


    现在美国社会的两个大趋势已经变成了 ——


    第一，各阶层越来越不平等。


    第二，人们在心理上，仍然认为各阶层就应该是平等的。


    这两个趋势的矛盾，就是当前美国社会的主要矛盾。


    这一切都起源于二战前的技术进步趋势和二战后的老兵趋势。历史没有必然的规律，只有此起彼伏互相影响和对抗的各种趋势。


    考察这段历史，我们会有一些感悟。


    首先，经济规律是你必须服从的东西。你要借贷消费，就要面对债务问题。这不是哪个政府说了算的事儿。规律是趋势的定律。


    第二，但是，有这个趋势，可不是说你的命运就被这个趋势定死了。这个趋势之外还有别的趋势。如果借贷消费的同时收入也在增长，那规律虽然还是规律，但已经不对你构成威胁了。


    第三，有些变量纯粹是不可控的。技术进步什么时候出现，它会带来什么样的需求，它又需求什么样的工人？国外有没有我们的竞争对手？这些你只能被动接受。可能美国运气好，信息技术正在开始大量雇佣工人。


    第四，但是，人仍然有可能做出一定的选择。比如说当年美国政府为了应对老兵趋势而选择维持低利率。


    再比如说现在美国两党的争论。是由政府采取措施让各阶层更平等一点，还是干脆改变对平等的期望？


    你只能看见参赛选手，你很难预测谁取胜。


