    \n提交留言可与专栏作者互动\n\n## 逻辑思维7：愚蠢争论的根源\n\n万维钢·精英日课³\n今天\n\n逻辑思维7：愚蠢争论的根...\n\n今天我们继续讲尤金妮亚·程的《不讲逻辑的世界里的逻辑学》这本书。有一个逻辑错误，可以说是大多数愚蠢争论的根源。\n\
    \n### 1.稻草人攻击\n\n你在生活中肯定遇到过这样的情况。很多朋友一起吃饭，你吃了一会儿觉得不能再吃了，就说了一句：“我不能再吃了，再吃就胖了。”你完全没有别的意思，可是座中有人突然就生气了——他说，你为什么。要吃长得胖的人？\n\
    \n你肯定会非常委屈。你说的只不过是自己怕胖，你绝对不是对胖子有意见。也许世界上的人觉得胖点挺好，你也觉得很多人胖乎乎的挺可爱，只不过你恰好不喜欢*自己*胖而已！这只是个个人喜好问题！\n\
    \n这就叫做“稻草人攻击”。你说的明明是A，他却把你说的等效成B——然后因为B不好，所以他说你说的不行，由此引发争论。他攻击的不是原本的你，而是他想象出来的一个稻草人。\n\
    \n- *彼得森发表一通言论（A）；\n- *纽曼：“所以你就是说……”（B）\n- *彼得森：不是啊！我的意思是……\n\n纽曼的发动稻草人攻击的标志是她说“So\
    \ you are saying……”——“所以你就是说……”整个对话中两人都出现了很多很多次如下的模式——\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_51_0.png)\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_51_1.png)\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_51_2.png)\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_51_3.png)\n\n### 2.根源\n\n你明明说的是A，他为啥非得犯个逻辑错误，把你的话理解成B呢？我总结大概有三方面的原因。\n\
    \n第一个原因是对方和你处于敌对的阵营。现在大家的评论是乔丹·彼得森在谈话中大获全胜，主持人纽曼是完败。可是我们要知道，纽曼是自由主义阵营的人，她这个节目的目的就是要跟彼得森战斗。如果节目里说着说着俩人达成了共识握手言欢，那才是真正的失败，那就等于纽曼断送了自己的职业生涯。\n\
    \n第二个原因是感情。喜欢讲逻辑的人常常看不起感情用事的人，殊不知感情，是最真实的东西。如果一个人感觉自己受到伤害了，他就是真的受到伤害——你的本意是不是要伤害他根本不重要。受伤害的感觉，对他来说无比真实。所以他一定要反击。\n\
    \n> \"如果一个人ictwo...\n\n### 3.提升你的逻辑敏感度\n\n我认为一般人犯低级逻辑错误的原因是不能理解自身眼界之外的东西。或者说的再严重一点，是不承认自身眼界之外还\n\
    \n的再严重一点，是不承认自身眼界之外还有别的东西。\n\n比如领导在会议上夸奖了几个员工和几个部门，但没提到老王，也没提老王的部门。老王就会想，是不是领导对自己有意见呢？而如果领导当着老王的面批评另一个人，老王又会想，这是不是在说给我看呢？\n\
    \n老王只能看到自己这点事儿，老王不接受“跟你没关系”这个解释。\n\n允许一个裸露镜头播出并不等于纵容色情文化、更不等于要把中国变成色情之国——这个逻辑非常简单，但是要想把它“内化”，真的不多想不动感情，你必须见识过很多电影才行。\n\
    \n为什么现代社会要讲“多元化”，要讲“包容性”呢？为什么那些所谓“白左”，要那么样的坚持包容和多元、乃至于连自家的先进文化的优越性都要放低处理呢？因为多元认知和包容心态真的是高姿态。当然什么姿态过分了都不对，比如我们前面讲过罗素悖论，我们知道包容不能是无条件的——但是包容是现代人在社会立身的第一步，因为这其实是一个讲逻辑的姿态。\n\
    \n我们假象一个场景。孩子从学校回来，说今天有两个同学在说话，还看他，还边说边笑，好像是在骂他。\n\n面对这个情况，认知水平比较低的家长，可能会跟孩子说你当时为什么不骂回去？他怕孩子吃亏，希望孩子是一个强大的人。\n\
    \n可是认知水平高的家长知道什么是真正的强大。他的第一反应是孩子你可能误会了！你的推测在逻辑上是不严谨不正确的，我们千万不要随便误会别人。你们平时不是在一起玩的很好吗？再说就算他们说你几句，那又能如何呢？明天你们就都忘了。\n\
    \n你猜哪个孩子将来更可能成为大人物。容人之量来自逻辑，逻辑来自认知。\n\n用不讲逻辑的方式去攻击别人，那个形象是很难看的，等于是自杀式攻击。讲逻辑不仅仅关乎辩论的成败，也不仅仅关乎决策的对错，更关乎你有没有一个健全人格。\n\
    \n咱們明天还有逻辑思维系列的最后一讲，说说逻辑与健全人格。\n\n注释\n[1] 精英日课第二季，《父爱式鸡汤》。\n\n[2] 围观网址 https://www.youtube.com/watch?v=aMcjxSThD54\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_52_0.png)\n\n〈前一篇\n\n## 日课精选\n\n写下我的日课\n\
    \n点击加载留言\n\n## 逻辑思维8：逻辑思维与健全人格\n\n万维钢·籍英日课³\n今天\n\n今天我们把尤金妮亚·程的《不讲逻辑的世界里的逻辑艺术》这本书讲完。\n\
    \n中国传统的读书人有一个非常理想主义的个人成长路线图，出自《礼记·大学》，认为人的完善应该按照下面这个顺序：格物、至知、意诚、正心、修身、齐家、治国、平天下。\n\
    \n当然这只是一个理想。现实是当今中国的大学并没有按照这个标准去培养国家的栋梁。我们的大学里有很多“精致的利己主义者”，甚至有的顶级名校里的学生，膜拜权威而不追求真理，畏威而不怀德，为了投机而出卖人格，跟大清的软才一样。反倒是西方秀才的大学，大搞自由技艺的教育，想让学生拥有健全人格。\n\
    \n逻辑思维不能解决你齐家治国平天下的问题。但是逻辑思维可以帮助你格物致知、诚意正心。\n\n### 1.讲逻辑\n\n讲逻辑似乎是个简单要求，可是大多数人在大多数情况下都不能完全做到。我们列举了非常多不讲逻辑的例子，不讲逻辑的样子是很像看的。\n\
    \n### 2.讲理性\n\n### 3.讲力量\n\n### 4.讲智慧\n\n- * 做事只对自己有利，而对别人不利，你是一个强盗；\n- * 对别人有利，而对自己不利，你是烈士；\n\
    - * 对别人、对自己都不利，你是愚蠢的；\n- * 最理想的情况是双赢：做对别人和自己都有利的事，这叫 “智慧”。\n\n我理解这个智慧和 “智能” 是两码事。智能是能力强，智慧是不但能力强，而且知道怎么用这个能力。想要做有智慧的人，要去帮助别人而且还能把事情做成，你就得跟人交往合作\
    \ —— 你就不但要擅长使用逻辑，还得擅长使用感情。\n\n总而言之，这个从讲逻辑出发获得健全人格的路线图差不多是下面这样的 ——\n\n讲逻辑 + 合理的信念体系\
    \ → 理性\n\n理性 + 多步骤高效能推理能力 → 力量\n\n力量 + 帮助别人 → 智慧\n\n能达到智慧这一步，也就算做到 “修身” 了吧。\n\n\
    在现代世界生活，人不可能独善其身，只想着做好自己的事情不和世界打太多交道。就算你不找事，事也会找你。你得工作，你得交税，你得买保险，你得抚养老人，你得管好孩子的教育。这其中每件事都充满争议。\n\
    \n公民到底要交多少税才是合理的呢？是应该只管最基本的公共服务，还是也要救助低收入阶层？孩子应该学什么？学校和家长各自有怎样的义务？我们不可能置身于争论之外。可是有参与争论的意愿，可不等于有参与争论的能力。\n\
    \n做个三观正、表态让人服气、说话能给人启发甚至帮助的人，是值得追求的。齐家治国平天下，那得有机遇和勇气；但是要说修身，你只需要从逻辑出发。\n\n(The\
    \ End)\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_54_0.png)\n\n## 模糊逻辑：灰度认知，灰度决策，黑白执行\n\
    \n万维纲·精英文摘³\n今天\n\n这一讲咱们说一个技术性的话题。你可能听说过一个名词叫“模糊逻辑”——国内也经常称之为“模糊数学”，我记得以前曾经一度是个流行话题。如果你从事自动控制之类的专业，你想必已经对模糊逻辑有所了解。而以我之见，这个思想也值得外行知道：这其实是一个把人的思维，量化成机械化操作的方法。\n\
    \n系统学习模糊逻辑有专门的教科书和课程，最好自己动手编程，实践操作一个项目。但是如果说其中最基本原理和思想，我尽力十二分钟给你说明白。\n\n我们考虑这么一个问题\
    \ [1]。比如你在路上开车，你的正前方有一辆车停下来了，你要踩刹车。那么这个刹车应该怎么踩呢？\n\n这显然跟你距离前车的距离，和你当前的车速有关。我们假设刹车有四种踩法，分别是猛踩、中踩、轻踩、不踩。有充分驾驶经验的你，知道应该用下面这一系列规则去踩刹车——\n\
    \n- * 如果距离很近，车速很快，就猛踩；\n如果距离很远，车速不是很低，就轻踩；\n如果距离中等或者较近，同时车速正常，就中踩；\n其他情况，不踩。\n\
    \n我这么一说你完全能明白。那请问，如果我们要设计一个机械化的自动刹车系统，应该怎么让它执行这些规则呢？\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_55_0.png)\n\
    \n### 1.模糊化\n\n### 2.规则运算\n\n如果角度是正低，角速度是0，那么速度是正低；\n如果角度是正低，角速度是负低，那么速度是0；\n\n\
    这三条规则又给速度计算出三个新的逻辑值来 ——\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_56_0.png)\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_56_1.png)\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_56_2.png)\n\
    \n加上前面那个，我们把速度的所有四个逻辑值计算结果叠加在一起，是下面这样的 ——\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_56_3.png)\n\
    \n这是一个模糊逻辑下的速度分布图。那速度输出到底应该是多少呢？这就需要 “去模糊化（Defuzzification）”\n\n### 3.去模糊化\n\n\
    如果一个速度是0.6的负低，0.4的零，0.25的零和0.25的正低，那这个速度到底是多少呢？去模糊化的方法有很多种，常见的一种是把它们叠加在一起，然后取图形的\
    \ “重心” 所在的位置，如下图 ——\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_56_4.png)\n\n\
    图中那个红点的位置，就是我们这个模糊逻辑控制系统最终的输出。\n\n总而言之，机器读取的输入是精确数值，角度和角速度是多少就是多少。可人的思考是模糊的，我们只知道高、低、左、右、零这些判断。所以我们必须先把精确值变成模糊值。然后根据人凭直觉想到的处理规则，对模糊值直接操作，得到一个输出结果\
    \ —— 也就是手掌移动速度 —— 的模糊值。可\b是具体操作又不能模糊，所以必须再把输出值给去模糊化。\n\n可以说，这一波操作是灰度认知、灰度决策、黑白执行。\n\
    \n*\n你看这个操作是不是非常符合人的思维习惯。主教练说，“如果对方后卫逼的比较紧，你们就多传球多跑动；如果他们搞区域防守，你们就可以自己带球……”那你说什么是“紧”、什么是“多”呢？这就是操作方法。\n\
    \n那些隶属度函数的具体数值，由工程师在实践中总结。\n\n这个方法的一个好处是它的控制非常平滑，不会一惊一乍做突然的动作。更重要的是，它把人类的模糊思维翻译成了精确的机器语言。这在人工智能时代就非常可贵了，我们可以先按照人的思路搭建好模糊计算规则，然后用训练的方法得到哪些参数，这就是所谓“模糊专家系统”。模糊专家系统的稳健性特别好。\n\
    \n上世纪八十年代，很多日本公司在家电、火车控制等等的领域使用了模糊逻辑的控制方法，模糊逻辑的第一个正式应用就是仙台市的地铁系统。美国公司倒是用的不多。\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_56_5.png)\n\n那为啥模糊逻辑后来不流行了呢？那当然是因为计算机更强大了。回到我们一开始说的那第一个思路，直接用神经网络机器学习的方法判断输出，对现在的计算能力来说非常简单。\n\
    \n但模糊逻辑仍然有个最大的优势：它“理解”它在做什么，因为它本身就是人类命令的翻译。而对比之下，神经网络完全是个黑盒子[4]。模糊专家系统，将来也许大有可为。\n\
    \n可我调研中发现一个非常奇怪的现象，有些人认为模糊逻辑是“伪科学”[5]：因为它的计算结果不是唯一的！可这不是完全合理的吗？我们在模糊化和去模糊化的过程中的确可以选择不同类型的函数和方法，但工程上的东西本来就是这样是灵活的，而且我们人类自己控制什么东西不也有自由度吗？如果模糊数学是伪科学，那神经网络算法简直就是神秘主义！\n\
