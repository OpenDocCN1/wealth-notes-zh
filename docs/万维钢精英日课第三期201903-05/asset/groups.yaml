    ## 博弈论11：真正的“诡道”是随机性


    万维钢 · 精英白课3


    今天


    进入课程 >


    博弈论11:真正的“诡道”是。


    我们说《三十六计》很不靠谱，有读者就问我，那《孙子兵法》如何呢？《孙子兵法》确实是一本实在在的用兵战略总结。但《孙子兵法》并不神秘，它的思想，比如像“知己知彼”、“国之大事”、“多算胜，少算不胜”、“君命有所不受”，在今天已经是常识性的东西。《孙子兵法》中包含了一些朴素的博弈思想，比如说“围师必阙”，就是我们前面说过的增加敌人选项。


    那为什么说它是朴素的呢？因为现代博弈论比《孙子兵法》要高级得多。


    我给你举个例子。《孙子兵法》里有一句叫“兵者，诡道也。故能而示之不能，用而示之不用……”，你看这句话有没有什么问题？


    这句话的意思很简单，就是说不能让敌人知道你的战术意图，你要迷惑对手。这个道理固然没错，但迷惑对手，就得是说反话吗？


    ### 1. 诡道的悖论


    我上中学的时候喜欢踢足球，我是一个守门员。我的技术不怎么样，但是我知道一些理论。我知道罚点球的时候，球到达球门只需要不到0.3秒，守门员不可能在这么短的时间内反应过来，所以只能事先踏一个方向。点球，是守门员和射手之间的博弈。我还听说，守门员可以通过射手的眼神来判断他射门的方向。


    有一次踢球，我们队被罚了点球。罚球的那个个人长什么样、这个球最后踢向了哪里、有没有罚进，现在我都忘了，但是我清楚地记得他的眼神。他的眼睛不停地瞪我右侧的方向。按理说他是想朝右侧踢，可是我突然多想了一步。


    我知道守门员应该看眼神来判断方向，那他是不是也知道？他会不会是故意往右边看，其实上是想往左边踢呢？


    又或者说，他会不会也想到了我能想到他的诡计，然后给我来个将计就计，还是会往右边踢呢？


    ### 2. 混合策略


    我们前面讲的各种博弈，你最终总是选择确定的 Ивана。这个我们后面再说。


    ### 3. 真随机的好处


    那你说这要求也太高了，难道踢点球之前还要做个计算不成？是的。如果你要罚的这些点球都价值连城，计算就是值得的。


    左右左右” 交替，再给中间多几个右吗？从统计角度看，这些安排都太整齐了，非常容易被 人利用。一般人想到随机性，会强烈地以为应该交替进行。比如你前两次罚点球都踢向了左侧，这一次就可能非常想踢右边
    —— 而如果你有这个心理，对手就可能会利用，他就可能会重点防守右边。


    唯一正确的做法，是执行真的随机性。比如你可以随身带一本书，每次罚点球之前随 便翻开一页，如果页码的个位数是0到3之间你就踢左边，如果是4到9之间你就踢右边。


    有人考察了都是业余选手参加的“石头剪子布”比赛 —— 真有这样的比赛 —— 发现业余选手的特点恰恰就是出手不够随机[2]。他们在原则上可以被人用概率论系统性地打败。


    不是真随机，就会被破解，这个道理和密码学是一样的。卓克老师在得到有个课程叫《密码学30讲》，其中专门说过这个道理[3]。


    随机性，才是真正的“诡道”。这个原理有很多应用。


    比如打网球。如果你知道对方的反手比较弱，是不是就应该一直给他回反手呢？不行，那样的话他就能预测你的回球了。就算你知道他喜欢正手，也得按一定的比例给他回正手，你必须使用混合策略。而职业网球选手真的做到了随机性非常好的混合策略。他们当然不会随身携带一个随机数发生器，但是他们比业余选手更随机。


    再比如足球和篮球中，如果你们队中有个球星特别能得分，那是不是应该一到前场就把球交给球星呢？不行，那样的话你的战术就是可预测的，对方防守球员就会重点盯住你们的球星。球星再好使，你也必须以一定的概率传球给别的球员。事实上球星在前场很大程度上是起到一个牵制对方防守兵力的作用。


    工商局检查产品质量也好，交警查违章停车也好，一般都是抽查。而你这个抽查可不能有规律。你要是固定在每天下午两点查停车，别人就会躲过你这个点。最好的办法是随机抽查。


    我听说慈禧太后吃饭从来都不是可着一盘菜猛吃，都是面对几百盘菜随机地选择，每样大概只吃一口，以至于那么多年人们愣是不知道她爱吃什么 —— 这样别人就不容易在她的饭菜里下毒了。


    还有，在“田忌赛马”中，想要避免被田忌坑，齐宣王的最佳策略，也是随机安排出场顺序。


    混合策略不是阴谋而是阳谋。专门说谎话是搞阴谋，可是阴谋是能够被识破的。使用混合策略，你就算把决策方式告诉对手他也没办法。阳谋不怕被识破……归根结底，大家都是纳什均衡的奴隶。


    参考文献

