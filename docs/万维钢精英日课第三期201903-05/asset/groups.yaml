    ## 《九个工作谬言》5: 生活不只是工作，工作可以是生活


    万维钢·精英日课³

    今天


    进入订阅 ›


    《九个工作谬言》5: 生活不.


    今天我们继续讲白金汉和古道尔的《九个工作谬言》这本书。这一讲我们切换到员工的视角：我们工作，到底是在干什么？


    最近一个热门话题是程序员抗议996的运动。所谓996，就是每天早上9点上班，晚上9点下班，每周工作6天。如果一个人长期这么工作，哪还有时间生活呢？身体能受得了嘛？所以程序员要维权。有人还搞出了一个“反996许可证”——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_76_0.png)


    代表这个软件不是用996的方法开发的，就好像清真食品的认证一样。这就给软件加上一个道德的标签，号召公司和开发者要平衡工作和生活。


    这个道理没毛病，人不能一天到晚上班。但我们要说另一个视角。


    如果一个人把工作等同于受罪，认为工资是受罪的报酬，那996就是不人道的。几乎所有时间都用来挣钱，以至于没时间花钱，还有比这更悲哀的人生吗？还有一种观念叫“拼命工作，拼命玩”，在我看来非常愚蠢：如果你的工作挣钱是为了能在玩的时候花钱，有个事实是玩花不了多少钱——你为啥找不到个轻松的工作，这还至于拼命吗？


    ### 1.乐之者的风格


    ### 2.怎样不被工作吞没


    ### 3.怎样施展特长


    容，少做一些痛恨的，多做一些热爱的。

    可能你痛恨写报告，但是热爱跟人面对面交流，那你能不能多找一些面对面交流的机会呢？一个好办法是把自己热爱的元素给*编织到*各项工作之中。比如你可以看看能不能找个人跟你一起写报告，那样痛苦感能降低一些。


    这么说来，996不是一个真正的问题。工作时间长短应该由你自己决定，那并不重要——重要的是你能不能在工作中找到自己热爱的事。只有这样的工作才能让你的生活有意思。


    多做一些热爱的，少做一些痛恨的，你就能在自己热爱的方向上成长。咱们再回顾一下什么叫特长——所谓特长，不是说你特别擅长，而是说你特别热爱，你在这个项目上是个“乐之者”：


    - 1. 做这件事之前，你很期待；

    - 2. 做这件事的过程中，你会进入心流状态；

    - 3. 做完这件事，你会有满足感。


    到底爱什么，可能是基因决定的，也可能是基因和环境配合决定，但不论如何这都符合生物演化给我们的本能：自我表达就是要传播基因——我们天生想要发挥自我。


    但是爱什么只有你自己能决定。


    比如说，你在那一周的时间内发现自己最热爱的是寻找数据中隐藏的规律。你的团队领导也许会说“你找到的那个规律不对”，她也可以说“你找到的那个规律没用”——但是她绝对不可以说，“不对，你*不热爱*发现数据中隐藏的规律。”


    对不对，好不好，你说的真不算。但是热爱不热爱，那只有你说了算。


