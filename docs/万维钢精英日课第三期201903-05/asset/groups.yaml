    \n## 问答：怎么提高“内化”水平？\n\n万维钢·精英日课3\n今天\n进入课程 >\n\n问答：怎么提高“内化”水平。\n\n## 来自日课：逻辑、悖论和直觉\n\
    \n读者 宝奎华、木头竹子、爱喝白开水：\n\n老师说的数学公式内化，而不是死背，能不能举个例子，说一说。这中间有什么窍门没有？\n\n万维钢\n\n把一个公式背得滚瓜烂熟，把一个字学到到哪里都认识，那还远不能叫内化。数学和逻辑推导是分层的东西，一个高级的推导会有很多很多层——所谓内化，就是你能把这个知识作为底层去运用。\n\
    \n我给你举个例子。有A、B、C三位同学，他们都知道“三角形内角之和等于180度”这条知识，但是他们的内化程度不同，咱们看看他们对这条知识的运用境界各自是什么样的。\n\
    \n## 来自日课：灰度认知和黑白决策\n\n读者 曹孔明：\n\n## 来自日课：怎样使用类比\n\n原则不是既有的婚姻制度下的原则吗？你突破性别原则和我突破其他原则有区别吗？不能类比吗？\n\
    \n万维钢\n\n以前我们专栏讲过“丑小鸭定理”，我们知道一切分类法都是主观的，丑小鸭和天鹅之间的区别和两只天鹅之间的区别一样大。从这个意义上讲，允许同性结婚，和允许人和笔记本电脑结婚，并没有本质区别。\n\
    \n但是，尤金妮亚·程使用的分类法还是有一个道理的：越往高层，越抽象。相对于一位异性，笔记本电脑这种东西连人 happens 不是、连生物都不是，应该算一种更抽象的原则，所以不能同等对待。\n\
    \n当然你也可以说这个所谓更抽象只不过是人的习俗决定的——但是，这恰恰是法律的特性：总要扎根于社会习俗。以前的社会习俗是不是一个种族都不能通婚，允许跨种族婚姻就算进步了。考虑到习俗，同性恋婚姻合法化的确比人和电脑的婚姻合法化更有道理一些。\n\
