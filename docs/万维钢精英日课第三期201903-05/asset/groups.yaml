    ## 问答：怎么对付“非理性”的人？


    问答：怎么对付“非理性”的人？


    ### 来自日课：有一种解放叫做禁止


    读者 ZHENIA：


    统计部门这个第四方监管如何保证公平正确？没有激励，要是它也偷懒呢？


    读者 Stone Tian：


    如果监管层也做player也要引入博弈的话，那监管层又需要另外一个监管层来监管，这不就 nuovui 了么？


    万维钢


    这个问题是中国皇帝经常面临的困境，也可以说是专制统治的根本困境。派官员管理人民，可是由官员会腐败，所以必须设立一个专门监督官员的机构。这个监督机构自己也会腐败，所以必须再设立一个监督和制衡这个监督机构的机构。就好比明朝有锦衣卫不行还得有东厂，有东厂不行还得再设个西厂，皇帝眼中靠得住的只有太监，因为太监没有后代就没有自己的长期利益，必须对皇帝忠诚。


    有些行为经济学家认为应该改变宣传语，改成比如说“真正的哈尔滨人都不乱扔垃圾！”这种激发地域荣誉感的说法。


    但是保护环境卫生哪有那么容易。真正解决问题的做法是投入人力物力，让环境已经变好。在已经很脏的地方扔垃圾毫无心理压力。但是这个地方明明很干净，要做第一个扔垃圾的人，那是非常不容易的。把流着污水的土路铺上漂亮的地砖，每天清洗，才是解决城市卫生的根本办法。


    ### 读者 陈勇：


    万老师，博弈是一个动态的过程，但在任何时刻博弈各方的最优策略已经确定，对理性的人来说，一个博弈的最终结果不是从一开始就是确定的吗，既然这样，为何大家还要博弈呢？谢谢！


    万维钢


    博弈动作发生在纳什均衡达成之前。如果现在的局面已经是均衡的了，那的确就没有什么可博弈的了。事实上我们生活中大部分事情都是均衡的，我们并没有一天到晚跟人博弈。


    但是均衡随时都可能会被打破。比如一个部门的权力格局本来已经均衡了，这时候突然空降了一个高管，或者突然有一个高管退休了，均衡就会被打破。


    在理想的情况下，新的局面刚刚出现，所有相关信息就已经被各方参与者知晓，各方迅速计算出了新的均衡点，那就会非常平稳地实现了过渡，表面上看没有什么博弈动作。但这其实也是博弈，了解自己的位置本身就是博弈的结果。


    如果有很多信息不明确，各方就会采取一些试探性的动作，包括威胁和承诺、讨价还价，这些都是博弈。只不过大多数情况下，博弈都体现在谈判上，而不必大动干戈。


    你说的很对，聪明人真没必要大动干戈。诸葛亮有句话叫“智者先胜而后求战，暗者先战而后求胜。”聪明人在头脑里模拟战争就足够了。


    但是聪明人也要做各种博弈动作。比如你去考了一个关键的证书，那这就增加了你的博弈筹码，别人就得重新给你安排位置。可是你要是没有证书，别人不会先给你安排位置。如果只有一个位置，先有证书的人可就把位置抢走了。


    现在中国并不对外打仗，但是你得有备战的动作。你不能说我们勤劳勇敢的中国人随时可以成立一支强大的军队，所以你们不要欺负我们——要知道成立军队是需要时间的。你已经有军队是一种博弈，没有军队就是另一种博弈。


    有些聪明人会不自觉地把“ 我能 ”当成“ 我有 ”，以至于就不屑于去做这件事情。其实“ 能不能 ”，和“ 有没有 ”，是两码事。


    先发制人，就是要把我们的能变成有，把对手的能变成不能。


    不过不一定所有局面都是先发有利，有时候后发反而有好处，咱们下周再讲。


