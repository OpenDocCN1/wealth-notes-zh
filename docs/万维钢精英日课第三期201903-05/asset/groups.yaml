    # 问答：人类有没有可能是被设计出来的？


    万维钢·精英日课³

    今天


    问答：人类有没有可能是被。


    # 来自日课：演化思维的四个工具


    # 读者心语：


    关于演化的实验，大肠杆菌在不断变大。是不是因为有足够的营养液？


    万维钢


    我们直观上考虑大的大肠杆菌汲取资源的能力更强，在试验那种封闭环境中，它可能就抢走了体形小的大肠杆菌的食物。在整个生物界来说，体形越来越大，也是一个非常常见、但是不绝对的趋势。这个趋势被称为“柯普规则（Cope''s
    rule）”。尤其是海洋生物，演化历史是体形越来越大。但为什么有这个体形变大的趋势，我看了截至到2018年的当前科学理解，都是尚无定论。也就是说，我们推测一个原因很容易，但是生物学家要验证这个假说，非常困难。


    # 来自日课：步步惊心的成长


    # 读者孟仲龙：


    过几十代以后，我们是不是也能演化出那种适应室内学习环境的近视，和适应将被出现的多媒体刺激的大脑呢？


    标准人。今天的日课又说应该让孩子按一个标准的程序成长，这是不是有点自相矛盾呢？


    # 读者 安东坡


    《生命视角》讲的是在孩子教育应该严格符合时间节点，《园丁与木匠》讲的是家长是怎样的人比学习如何教育孩子有用的多。所以孩子教育到底是 “精准教育” 还是 “陪伴成长”
    更重要呢？


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_97_0.png)


    # 万维钢


    成长的 “严格” 和 “灵活”，这是两个不同尺度的问题。没有人是标准人，这个说的尺度是说每个人的身材比例，比如四肢的长短，都不一样。而按照顺序给环境刺激，这个就相当于每个人都有两条胳膊两条腿一样。严格是大尺度的，灵活是小尺度的。


    成长的路上具体吃什么不重要，但是你得让人吃饱。家长具体怎么陪伴，玩什么不重要，但是你得陪伴。


    # 读者 陈玫、云且留住：


    蒙台梭利早教，是根据孩子生长发展的敏感期，通过一些游戏互动的方式教学等，请问万老师这种形式的早教可取吗？


    我们这一讲反对的是那种强迫孩子学习书本知识的压迫式早教，但是把孩子送到传统的玩闹型幼儿园是绝对没问题，而且还有利于孩子跟小朋友玩耍。那么相对于传统的、普通的、价格便宜的玩闹型幼儿园，像蒙台梭利这样的高端的游戏互动式幼儿园，有没有什么优势呢？


    2017年的一篇论文 [1] 说，荷兰的曾经若干以蒙台梭利方法教学的学校，曾经以抽签的方式录取了几百名学生，这就相当于给研究者提供了一个随机实验。而跟踪研究表明，蒙台梭利方法教出来的学生，在学业成绩上，跟普通学校没有区别。蒙台梭利方法自诩的优势是在孩子的性格养成方面，尤其是积极自主性和独立性，但是即便在这两个方面，测试表明，蒙台梭利方法培养的孩子跟普通学校出来的孩子也没有区别。


    The effects of Montessori education: Evidence from admission lotteries ☆

    Nienke Ruijs ¹ ²

    Show more

    https://doi.org/10.1016/j.econedurev.2017.09.001

    Get rights and content


    # Highlights


    - I use school admission lotteries to investigate the effects of Montessori education.

    - I find little evidence that Montessori education affects academic achievement.

    - Montessori students show similar levels of motivation.

    - Montessori students do not score better on measures of independence.


    对此我完全不感到惊讶。让孩子玩很重要，但是怎么玩，并没有那么重要。把孩子送进蒙台梭利学校会让家长感觉很好，孩子自己其实没那么多讲究。


    截此复习：早教军备竞赛的科学结论


