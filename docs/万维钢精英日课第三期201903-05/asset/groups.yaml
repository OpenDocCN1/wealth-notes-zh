    # 逻辑思维7：愚蠢争论的根源


    万维钢·精英日课³

    今天


    逻辑思维7：愚蠢争论的根...


    今天我们继续讲尤金妮亚·程的《不讲逻辑的世界里的逻辑学》这本书。有一个逻辑错误，可以说是大多数愚蠢争论的根源。


    # 1.稻草人攻击


    你在生活中肯定遇到过这样的情况。很多朋友一起吃饭，你吃了一会儿觉得不能再吃了，就说了一句：“我不能再吃了，再吃就胖了。”你完全没有别的意思，可是座中有人突然就生气了——他说，你为什么。要吃长得胖的人？


    你肯定会非常委屈。你说的只不过是自己怕胖，你绝对不是对胖子有意见。也许世界上的人觉得胖点挺好，你也觉得很多人胖乎乎的挺可爱，只不过你恰好不喜欢*自己*胖而已！这只是个个人喜好问题！


    这就叫做“稻草人攻击”。你说的明明是A，他却把你说的等效成B——然后因为B不好，所以他说你说的不行，由此引发争论。他攻击的不是原本的你，而是他想象出来的一个稻草人。


    +   *彼得森发表一通言论（A）；

    *纽曼：“所以你就是说……”（B）

    *彼得森：不是啊！我的意思是……


