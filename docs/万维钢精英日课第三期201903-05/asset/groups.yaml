    万维钢


    今天有个好消息，我的新书《你有你的计划，世界另有计划》马上就要办公室首发了！咱们专栏读者当然要享受特权优惠，在正式发售之前，你可以点击文稿里的图片，超前以9折拿下这本书。

    今天就把这本书的序言更新到这里，题目叫《欢迎来到真实世界》。


    ## 欢迎来到真实世界


    王先生每月到手工资有一万多元，这个收入水平在他所在的城市也不错，但显然也不算特别高，王先生想要更多。王先生对未来很有好的规划，他认为靠工资收入是发不了财的，他必须投资。

    王先生想要的东西，叫做“复利”——也就是说用钱生钱，而且用钱生出来的钱还能再生钱。王先生知道，如果每年能有哪怕10%的利息，利滚利之下，仅仅需要七年，一笔投资就能翻番。王先生并不指望像买彩票一样的一夜暴富，但10%的要求难道还高吗？他精心选择了几个投资产品。

    为了未来的幸福生活，王先生总是省吃俭用。每当要花钱的时候王先生就想，今天的一块钱就是七年后的两块钱，这哪里是钱，分明是种子！我能吃种子吗？

    王先生耐心地等待时间的回报。


    三十五岁这年，李女士下定了决心。她再也忍受不了领导的颐指气使，她不愿被别人指挥，她有一个企业家的梦想。李女士认为再不创业就赶不上这波大潮了，她毅然辞职。

    李女士早就做好了准备。她上过好几次创业课，完全知道创业公司是怎么运行的。她写了一份完美的商业计划书，她找到了几个志同道合的合作伙伴，她甚至已经说服了一位投资人。

    作为前期的投入，李女士已经卖掉了自己的房子。人人都说她这是一个冒险的决定，可是创业哪有不冒险的？

    明天，公司将正式开张。李女士就像一头狮子，做好了战斗的准备。


    赵总环视会场，心中有一点悲壮感。公司业绩持续下降，他刚刚临危受命成为新的CEO，今天是第一次主持会议。赵总让中层干部谈谈想法，可是谁也没说出什么有价值的思路。

    那我就来说吧。赵总拿出自己制定的一份公司管理改革方案，他告诉大家改革的必要性和紧迫性，然后逐条宣读——

    第一，公司从即日起实行准军事化管理，不分职位高低一律不许迟到早退，要有铁的纪律，下级必须服从上级。

    第二，对经理人员实行量化目标考核制，完不成目标的一律降级、甚至开除。

    第三，……

    赵总注意到了会场中的不满情绪，但是他知道乱世必须用重典。他决不允许公司倒在自己的手上，啊落个骂名也在所不惜。“我只要结果！”赵总壮怀激烈地说。


    我们每个人都生活在自己给自己讲的故事里。所有好故事里都有个英雄，有个经历奋斗战胜敌人的主题，中间会有一些冲突，但总会有个完美结局。王先生放弃短期的享乐，应该得到长期的好处。敢想敢干的李女士应该是当代青年创业者的榜样。力排众议、使出雷霆手段的赵总，更应该成就力挽狂澜的伟业。

    他们付出了努力和牺牲，所以他们应该收获很好的回报。这样的结局才是公平的，对吧？


    # 真实世界不是故事。


    # 真实世界没有主角。


    这个世界不是为了你，甚至也不是为了人类的幸福而存在的。世界不在乎你的命运，而且没有义务让你理解。


    # 真实世界没有主题。


    主流和非主流，好人和坏人，好的主义和坏的主义，这些划分常常站不住脚。从不同的视角看同一件事，你往往会有不同的看法。


    # 真实世界没有完美结局。


    如果你对世界上的事儿了解得多，你会发现，更可能的结果是王先生投资赔了钱，李女士创业失败，赵总拆腾一番被炒辞退地赶下台。

    你有你的计划，世界另有计划。


    这本书出自我在“得到”APP的专栏，《精英日课》。我们的读者是愿意审视自己的思想的人，是社会的中流砥柱，是人群中的精英。你不是来听故事的，你想了解真实世界。有关真实世界的知识有时能把人从故事里解救出来。

    '
  mdcn: '

    是第二种顾客。第一种顾客没有余额，第三种顾客没打算还钱。余额代偿是一个正向信号筛选的有力手段，能把别人最优质的顾客抢过来。


    为什么申请美国大学要填一个那么复杂的申请表、弄那么多麻烦的手续？因为这样才能把真的认为自己有机会、同时又有诚意的学生筛选出来。事实上，我听说美国就有不少高中生，明明符合一个大学的助学金条件，但是居然就没有申请这个大学——因为他们懒得填表！


    当然，最普遍的信息筛选手段是价格歧视。买同样一个商品，如果你能让商家赚20块钱，商家很乐意；但是如果有人能让商家赚5块钱，商家其实也乐意。可商家总不能明目张胆地看谁钱多就要高价吧？


    解决办法就是区别定价。咖啡要分成中杯、大杯和特大杯，软件要分学生版、家庭版、专业版和企业版，其实你考虑到地段、人工和研发费用，不同杯不同版的成本几乎是一样、或者就是完全一样的，只是想卖给有不同付费意愿的人而已。


    只要你掌握这个眼光，你会发现信号筛选简直到处都是。而没有这个眼光的人可能很难理解这一切。花那么多钱请明星做广告难道不是社会资源的浪费吗？大学为什么不教点实用的东西？商店搞那么多花样干什么？他很爱思考，但是全都没说到点子上。


    市场信号理论是1970年代才出来的东西，“纳什均衡”是1950年代才被明确提出的概念，难道此前的人类社会中就没有均衡态和发信号的现象吗？当然不是。


    身为一个局面的参与者，未必能洞察这个局面。身处一个时代，未必能理解这个时代。你不得不做了理性的选择可是又充满困惑，你觉得社会不对可是又说不明白哪里不对。学而时习之不亦说乎，人不学习行吗？


    ## 美国社会的主要矛盾


    万维钢·精英日课³

    今天


    美国社会的主要矛盾


    咱们中国有个特别有意思的说法叫“社会的主要矛盾”。我们认为在每个历史时期，中国社会都有一个主要矛盾。比如说，现在的说法，当前中国社会的主要矛盾是“人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾”。


    我们今天这一说的课题是当前美国社会的主要矛盾。当然美国两党并没有定期发布官方版的“当前社会主要矛盾”，我们要讲的只是一个学者的认识，而且他也没使用“主要矛盾”这个词。但是，他这个认识非常有道理，可以说代表了学界的共识，而且我认为非常符合“主要矛盾”这个提法。


    美国有个风险投资公司叫“合作基金会（Collaborative Fund）”，经常在自家网站发布一些分析文章。合作基金会的一个学者叫摩根·豪泽尔（Morgan
    Housel），去年年底写了一篇文章 [1]，回顾了美国经济从二战结束到今天的历史。豪泽尔的思路很清楚，他总结和援引了学界的认识，而且写的通俗易懂干净利索，值得全文阅读。


    我给你总结一下豪泽尔这篇文章的要点，同时说一点我的心得。但是我想先说说什么是历史。


    ## 历史是怎么前进的呢？


    这个问题有两个简单答案。一个答案是历史存在某种浩浩汤汤，顺之者昌，逆之者亡的“天下大势”。就像黄河的水一定是自西向东流向大海，每个水滴都被裹挟着前进，就算偶有抵抗也是螳臂当车。


    这个答案的毛病在于事后说总是很有道理，但是在事前，你不能用它准确预测任何事情。1945年的经济学家和美国人民完全没想到今天的美国是这个样子。1945年的中国人民更无法想象今天的中国。


    英国历史学家汤因比以前在中国有很多粉丝。汤因比认为世界各文明的发展都符合一些宏观的规律，他希望别人能把他总结的这些规律当做历史定律，就好像物理定律一样——但是他失败了。今天的历史学家都不买汤因比的账，甚至还有人把他当做“确认偏误”这个认知误区的典型案例。


    第二个答案，是认为这个世界根本就没有什么必须遵循的天下大势，所以历史不过就是一系列偶然事件的集合。这个答案是苍白的，绝对不会犯科学方法的错误。


    但这个答案的缺点是它没有用处：我们不但不能预测未来，而且也不能解释过去已经发生的事儿。那学历史还有啥用呢？


    那么我有一个想法。也许一个更好的答案应该是介于二者之间。我们不承认历史有必然规律，但是我们承认历史上各种*趋势*。


    比如说，技术进步是一个趋势，人口增长是一个趋势，生活改善是一个趋势，贫富差距的扩大或者缩小，也都是可能的趋势。


    这些趋势就是历史赛场上的参赛选手。有的趋势会在一段时间内占据主导地位。有的趋势一直进不了决赛，但也是一个角色。有的趋势辉煌一阵子就消亡了。趋势跟趋势可以合作可以对抗，互动的结果还可以孕育新的趋势。


    那么什么叫预测呢？我们无法预测比赛的结果。但是我们可以看出来一段时间之内，赛场上都有哪些参赛选手。你不知道刘邦和项羽谁能夺取天下，但你至少知道刘邦容易得罪他俩——这就比什么都不知道强得多。


    所谓“主要矛盾”，就是现在正在对抗的两个大趋势。


    有了这个视角，咱们结合豪泽尔的文章，看美国过去这几十年都有哪些大趋势。


    1945年，美国取得了二战的胜利，但是国家面临一个巨大的问题。当时美国有800万士兵在海外参战，其中650万将在18个月之内回国并且退伍，请问国家应该怎么安置这些人。这些老兵的平均年龄是23岁，他们想成家立业。那国家让他们住哪里？干什么工作？


    你儿子上大学，难道我儿子就应该上大学吗？你住大房子、开SUV、去国外度假，我为什么就不能？我至少可以借贷消费。


    结果就是美国家庭负债率进一步变大。


    最终这导致了2008年的金融危机。


    金融危机之后，很多债务被抹掉了，再加上利率低，家庭还债占收入比一下子降低到了35年来的最低水平 —— 所以这就是爆发危机的一个好处，有问题实在解决不了可以抹掉。


    现在美国社会的两个大趋势已经变成了 ——


    第一，各阶层越来越不平等。


    第二，人们在心理上，仍然认为各阶层就应该是平等的。


    这两个趋势的矛盾，就是当前美国社会的主要矛盾。


    这一切都起源于二战前的技术进步趋势和二战后的老兵趋势。历史没有必然的规律，只有此起彼伏互相影响和对抗的各种趋势。


    考察这段历史，我们会有一些感悟。


    首先，经济规律是你必须服从的东西。你要借贷消费，就要面对债务问题。这不是哪个政府说了算的事儿。规律是趋势的定律。


    第二，但是，有这个趋势，可不是说你的命运就被这个趋势定死了。这个趋势之外还有别的趋势。如果借贷消费的同时收入也在增长，那规律虽然还是规律，但已经不对你构成威胁了。


    第三，有些变量纯粹是不可控的。技术进步什么时候出现，它会带来什么样的需求，它又需求什么样的工人？国外有没有我们的竞争对手？这些你只能被动接受。可能美国运气好，信息技术正在开始大量雇佣工人。


    第四，但是，人仍然有可能做出一定的选择。比如说当年美国政府为了应对老兵趋势而选择维持低利率。


    再比如说现在美国两党的争论。是由政府采取措施让各阶层更平等一点，还是干脆改变对平等的期望？


    你只能看见参赛选手，你很难预测谁取胜。


