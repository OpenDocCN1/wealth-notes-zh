    ## “自学”的学问（上）


    万维钢·精英日课³

    今天


    进入课程 >


    自学的学问（上）


    物理学家史蒂芬·霍金的大学是在牛津上的，他 17 岁入学，只用了三年就毕业了。牛津的教学跟一般的大学不太一样，并不是什么内容都在课堂上讲，经常是教授指定一本物理书中的一章，让学生回去自己学。我没听说过霍金对当初教他的老师有什么感激之词，但是是他的两位老师对霍金印象深刻
    [1]。


    派却克·沈德斯教授曾经要求霍金读一本讲统计物理学的书并且做习题。过了一周霍金来见他，没交习题作业，但是带来 了“标出所有错误的 那本书”。沈德斯教授说，“我在那时候就很清楚，他对这课程比我了解得还多。”


    不过霍金完成了罗伯·白曼教授给他布置的所有习题。而白曼教授对指导霍金的感想是，“我想我真正的作用只是监督他学习物理的进度。我不能自夸曾经教过他任何东西。”


    当然，你不是霍金。我也不是。不过我想说的不 是霍金有多聪明，而是他这个学习态度和学习方法。


    态度是以“我”为 主，方法是由自学。


    ### 1.自学是大势所趋


    我认为我们对“自学”这种行为的看法需要改变。


    传统上人们认为自学，这种非组织的个人行为，是对正规学习的补充，有点艰苦还有点悲壮，是个没有办法的办法。说谁是“自学成才”，那就等于说他是个非科班出身的边缘人士，他的水平没有经过认证，也许只是个业余爱好者。


    但那是以 前。学习方法和学习媒介很有关系，而学习媒介现在很自由。


    在中国 的竹简 时代，书是一种特别贵的东西，别说自学，普通人想“上学” 都没 可能。贵族“诗书传家”，传的是真的书。


    等到后来有了印刷术，普通人上私塾终于成为可能。但是因为经典都是竹简时代 路途依赖形成的文言文，没有高水平老师教 育定还是不行 的。


    近代的书变得特别便宜，内容也都是简单的白话文，经过几年训练，水平一般的人也可以给孩子当老师，成建制的学校教育才得以开展。好 几个学生老老实实地坐在教室里听老师讲课，每个学校里老师讲的内容还都是一样的，这其实是大规模普及教育特有的模式。但是因为我们都是从小就这么学，我们以为学习就应该是这样的。但学习为何非得这样呢？


    以前的圣贤，像孔子和柏拉图带徒弟，用 的可是你一句我一句对话式的教学方法。手把手教，随时给反馈，这才是最好的教学。像皇太子读书，那更是好几个老师教一个学生。高级教学的要点是以学生为主，而不是以老师为主。


    现在人们对成建制批量学习这种做法的反思已经越来越多了。以前我们老讲过托德·罗斯的《平均的终结》这本书 [2]，对标准化教育的逻辑做过一番 较较。2018年美国还出了一本更激进的书，叫《对教育的指控》[3]，作者乔治梅森大学的布莱恩·卡普兰教授甚至认为整个现代教育系统根本就是在浪费时间和金钱。


    当然要想搞最理想的教育，让教育真正以学生为主，那的确也不现实，首先你没有那么多好老师。可是就算不能让老师以学生为主，至少码也应该让学生以自己为主才对。


    以我之见，只要获取信息足够方便，学生本人足够自立，自学，就是最根本的学习方法。


    现在是互联网时代，你可以很容易地得到基本上任何课题、任何难度和层次的任何一本书。而且你是一个足够自立的人。所以你应该以自学为主。


    ### 2.自学的好处


    你有没有种感觉，一个人老老实实地坐在电视机前看节目，这个场景挺傻的。你完全可以一边吃饭一边看，可以一边跑步一边看，或者一边玩手机一边看 —— 但要是“纯”看电视，你可能就太给那个节目面子了。


    而反过来 说，我读书的时候，就纯读书。哪怕读的是网络小说，我也从不一心二用。我认为这个根 本区别不是内容不一样，而是形式不一样。


    读书，你可以自己控制节奏。简单的地方读快一点，复杂的思想就慢慢品味，没意思的 可以马上跳过，读到 后面想起前面来还可以返回去。 阅读，是一种以我为主的变速运动。


    而看电视，却是“播放”，本质上是个被动的行为。就好像坐 车一样，被动行为很容易让人睡着。我希望将来 脑机接口技术成熟了能允许人用意念控制视频的播放速度，就好像阅读和
    开车一样。现在的所谓倍速播放、或者用鼠标 标来跳去，非常麻烦。


    那么课堂教学是什么呢？是没有快捷键、不允许跳跃的视频播放。老师要求全班同学步调一致，而他那个步调，是参照水平中等偏下的同学设定的。如果老师善于教学，还可以搞一些互动环节，或者讲讲自己对教学内容的独特理解，想办法让学生保持兴趣。而如果老师教学能
    力一般，那上课就如同听总 作报告一样—— 领导也是照着稿子念，而我们手 里就拿着报告稿，搞这个仪式还有什么意义呢？


    坚持 45 分钟全 神贯注听讲是不正常的事情，课堂教学是一种 压迫式的学习方法。我们对建制化学校教育的一切批评，什么学生害怕老师、学生没有创造性、学生有厌学情绪，高考一结束就把书全扔了
    —— 可能归根结底都是因为它是一个被动式的教育。


    一个人要想过得幸福，必须对生活有一定 的控制感 [4]。自学最有控制感。


    你自己决定学什么。你自己选择学习材料。你自己掌握学习节奏。你自己把握学习成效。很多老师和家长都爱说什么把“要我学”变成“我要学”——殊不知只要是跟体制就一定是要我学，只有自学才是我要学。


    现在美国有的大学搞了一些更倾向于自学的改革。比如基础物理课有这么上的——既然现在网络公开课那么多，就改成让学生自己回去通过看公开课或者读书的方式自学，然后在课堂上老师只领着做实验和做练习，起到一个答疑解惑的作用。


    也许在这个时代，课堂教学就不应该是学校的主要作用了。学生们应该以自学为体，以学校为用。学校可以像霍金的老师那样，监督学习进度。学校需要组织考试，颁发毕业证书，提供一个能在社会上竞争的信号。学校还是一个让师生聚在一起切磋技艺交流心得的地方，也许社交才是上学的主要功能。


    自学不受地域、时间、 金钱和年龄的限制。只要你心智成熟，就可以随时开始自学。


    但是你得心智成熟。


    ### 3.自学的准备条件


    英文里称呼“自学者”有个很好听的词，叫“autodidact”。一个 autodidact 不是我们说的“自学成才”那种轻量级的自学者，而是能让人肃然起敬的智者。


    想要自学，首先得会“自教”。选择什么样的教材？制定什么样的教学目标？你得有点自主能力才行。


    美国教育家苏珊·克鲁格（Susan Kruger）提出一个“成功教育金字塔”理论 [5,6]，认为学习这个活动本身，是教育金字塔塔尖上的行为。而要想成功学习，你必须先准备好金字塔下面的两个基座才行。这两个基座是自信心和自我管理能力。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_114_0.png)


    首先得有自信。我们以前讲过，人 在面对威胁的时候会让身体和大脑都进入封闭状态，那是无法学习新东西的。你面对学习材料得足够自信才行。


    我认为这个自信心来自文本能力。有的人一 看书就犯晕，有的人见到书籍却是如鱼得水。也许从小读些小说之类的东西可以培养对文本信息的亲近感，不过学习类文本跟 小说还是有本质区别的。给一本书，你得非常相信自己能从这里面得到想要的东西才行。


