    # 《计算机思维》5：设计 的边界


    万维钢·精彩日课³

    今天


    进入课程 ›


    《计算机思维》5：设计的境。 ↓


    咱们继续说《计算机思维》。上一讲说的 是软件工程，这一讲的主题是软件设计。


    说到设计，你是否曾经“发布”过什么东 西呢？你看着人，自己暗中设计和创造一 个作品，各种情况考虑周全、反复检查之 后，选定一个时间，拿出来给大家看。


    在校学生经常做这样的事情，比如参加表 演、作报告、甚至交作业也是一种发布。


    工作中并不是所有人都有这样的机会。 如 果你没发布过东西，我建议你尝试一下这 个体验，哪怕是做一桌子菜请朋友吃也 算。


    # 1.软件工程和软件设计


    软件工程要克服的最大困难是怎么确保不 出问题，它的主題大約是“实现”——要 忠实地实现各种要求。从软件工程角度来 说，开发一个软件应该按下面这个流程走 ——


    +   1. 确认需求；

    2. 把要求具体化，设定各种目标参数；

    3. 进行开工建设；

    4. 做好之后接收和测试；

    5. 交付给用户


    想要顺利完成这个过程是很不容易的。一 般来说，差不多有1/3的项目能按时完成； 1/3的项目会超时、超预算完成；还有1/3 的项目则于胎就完不成。其中的重大困难
    当然是软件这个东西实在太复杂，里面有 太多的模块和接口，千万万绪谁保不出问 题。


    # 2.设计的新思维


    没参与过创作的人很难理解设计有多重 要。我突发奇想要一个功能，你给我实现 一个功能，很多rain以难度和技术含量都 在实现上，其实不然。知道该要什么功 能，非常关键。


    软件设计是一个激进的思维方式转换。以 前的软件工程思维，是关注于功能和实 现；现在的设计思维，则要求我们要考虑 到用户和产品应用的环境。软件设计和一 般产品的设计还不一样。一般产品让你感
    觉好用、好看比较容易，可能最多考虑一 当人体工程学之类。而软件，跟用户是交 互式的关系。用户会在软件中做出各种行 为，软件是让用户活动的地方。


    软件设计的目標，是创造一个虚拟世界。


    # -1级，是流氓软件。这种软件不但不安全 而且很可能专门留了收集信息甚至攻击系 统的后门，而且完成度很低，一堆bug。


    # 0级，是轻蔑的满意。基本上可以用，但是 大家都知道其中有很多问题，也不怎么安 全。这种软件一般是为了抢占市场而匆匆 推出的，消费者为了使用软件提供的功
    能，也就认了。


    # 1级，是软件能够满足基本的需求，比较可 靠。


    # 2级，就要提出表扬了，软件能跟环境和用 户使用习惯达到完美配合。


    # 3级，是软件能主动规避负面的结果。


    # 4级，也就是最高级，是这个软件能给用户 带来喜悦。


    Unix —— 包括后来的 Linux 操作系统， 绝对是传奇。我上大学的时候第一次接触 Linux，其实我用的很有限，但真的是有认 知升级的感觉。没有什么花哨的界面，很
    多商用软件和游戏都不能用，但是 Linux 是一个跟 Windows 完全不同的世界，更 简单，更丰富，更深刻，可以说其中 有“道”——我感觉用 Linux
    的时候是 在跟一帮比我聪明得多的人打交道，好像 把我也带得变得聪明了一点。'
  md: "\n一方面是中国的人一直都很多，劳动力很便宜。工业革命能在英国发生，一个重要原因是因为英国劳动力贵 —— 要知道早期的蒸汽机挺贵的，就算拿到中国来也没有经济效益。据说圆明园的“大水法”\
    \ —— 一个喷泉装置 —— 本来是机械驱动的，后来改成了让太监驱动。\n\n另一方面清朝统治者不愿意搞技术升级，因为他们害怕汉人掌握高科技。\n\n不过想起前面讲的那三个故事，也许不仅仅是这些原因。\n\
    \n乾隆的祖宗看见西洋火炮好使，毫不犹豫地就装备了部队，而且依靠的就是汉人。为啥那时候就知道科技厉害，到了弘历这里就只知道喜欢娱乐性的机器人了呢？\n\n\
    我觉得那是因为弘历比他的祖先文明。弘历已经被传统文化给同化成了明朝人。\n\n人脑处理信息的能力非常有限。人能看到的东西，通常都是主观就想看到的东西。是思维模式决定你想看什么。\n\
    \n据我谦卑的理解，中国传统的思维模式，看的不是什么机械原理之类的东西。\n\n而是某种超越了物质世界、属于精神世界的东西。这个精神世界不是上帝那种神的世界，而是人的世界，是活人的世界\
    \ —— 是人际关系。\n\n当然这个人际关系绝不仅仅是办公室政治那种小尺度的东西，它包括宏大的主题，比如善与恶、华夏与蛮夷、皇帝与臣子、朝廷与小民，忠与奸等等。\n\
    \n这就是为什么大明的精英会拒绝采纳葡萄牙人提供的武器技术升级。正反双方的确都有利益的考虑，但是辩论的主题，起主导作用的思维方式，是人际关系的精神世界。\n\
    \n这也是为什么乾隆皇帝对西洋科技不敏感，因为他已经从祖先的实用主义思维演进到了人际关系精神世界思维。\n\n每个受过传统文化熏陶的中国人，都会本能地产生这个思维。所以这也是为什么王浩一说要回到中国就主动搞起了政治哲学。\n\
    \n这个思维认为人际关系精神世界比任何东西都重要。这个思维最重视做事的动机和美感，而不重视结果。这个思维永远都在试探对方的动机，想知道他到底是不是自己人。这个思维永远都在“辨奸”，想看看对方什么时候露出狐狸尾巴。这个思维认为人生最大的价值是在人际关系的精神层面达到完美，而一切物质上的东西都是低等的。\n\
    \n所幸的是今天的中国人已经不这样了。我们很注重物质和实力，我们非常强调高科技的作用。但是，人际关系精神世界思维仍然是我们基因传承的一部分。这表现在我们多数人主要把科技当做手段，而少有人把科学本身当做目的。\n\
    \n如果科技只是手段，什么是目的呢？是美好生活吗？我总感觉美好生活也只是手段。别人认可的生活才是美好生活 —— 所以，对很多人来说，人际关系精神世界，仍然是终极目的。\n\
