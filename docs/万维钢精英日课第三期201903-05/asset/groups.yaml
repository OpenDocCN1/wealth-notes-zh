    # 万维钢


    成长的 “严格” 和 “灵活”，这是两个不同尺度的问题。没有人是标准人，这个说的尺度是说每个人的身材比例，比如四肢的长短，都不一样。而按照顺序给环境刺激，这个就相当于每个人都有两条胳膊两条腿一样。严格是大尺度的，灵活是小尺度的。


    成长的路上具体吃什么不重要，但是你得让人吃饱。家长具体怎么陪伴，玩什么不重要，但是你得陪伴。


