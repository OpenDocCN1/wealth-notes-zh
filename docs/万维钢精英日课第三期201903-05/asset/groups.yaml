    ## 问答：开发一个操作系统，是更难了还是更容易了？


    万维钢·精彩日课³


    今天


    # 来自日课：工程的复杂


    读者千秋雪：


    万老师，你觉得现在这个时代相比八九十年代，开发一个操作系统是更难还是更容易了？


    读者李琼：


    我觉得，无论面对什么样压力，试图重新种一棵同类型的树都不是明智的。不顾一切倾尽全力的去种这么一棵树则是有险的。我们做的是，在别处栽下一棵新品种的小树苗，多少年后，它会硕果累累。而我怀疑的是，美国精英们可能正在偷偷的种树，而我们的精英们则在重新发明系统和芯片。然后又是一个关于弯道超车对反弯道摆脱的轮回。我这样是多虑了吗？


    万维钢


    另立门户、完全自主地开发一个新的操作系统是更难了，因为现代计算机比那时候要复杂得多。但是从一个现有的、开源的操作系统出发，定制一个属于自己的操作系统，则是比较容易的。而不管怎么开发，跟开发相比，要让别人愿意用你新开发的这个操作系统，却是非常非常的难。


    ## 来自日课：设计的境界


    +   1. 华为统治了 5G 领域；

    2. 5G 领域有一些人非用不可的杀手级应用；

    3. 华为手机是最好的、甚至是唯一的 5G 手机。


    都不干的时候也要消耗很多计算力。一台老计算机，装上 Linux 就能焕发青春；一台新计算机，装上 Windows 就会臃肿而心事重重。Linux 不死机不蓝屏，Linux
    没病毒。


    那这是为啥呢？因为 Linux 是个自由的、干净的、开源的、可控的、品质高尚的系统，而 Windows 则是贪婪、专制和愚蠢的产物。


    而且 Linux 免费！当然，因为 Linux 更尊重计算机和用户，它有点曲高和寡，不适合普通老百姓，以至于很多商业软件、特别是游戏没有 Linux 版。如果资金比较充裕，Mac
    是个折中的选择。


    ## 来自日课：方程的模拟


    读者 — RU既往_xiao：


    我想起《流浪地球》的一个情节，救援队想出点燃木星的计划，但是moss说这个计划科学家已经计算机模拟过，成功率几乎为零！然而人类还是选择了奇迹！那么既然计算机模拟这个好用，我们以后会成为算法的奴隶还是非理性地选择相信奇迹呢？


    万维钢


    作为一个曾经的从业者，我认为计算机模拟只是一个辅助性的工具。在核武器和飞机空气动力学领域它可能比较可靠，但是至少在我以前做的受控核聚变领域，计算机模拟能做的还很有限。这里面关键是个尺度问题。


    对大尺度现象，我们可以使用磁流体力学之类大尺度的模型；对小尺度现象，我们必须使用动力学之类小尺度的模型。但是有些物理现象是小尺度和大尺度一起起作用，这就很不好办了。都用大尺度模型，你看不到这个现象；都用小尺度模型，你计算能力有限模拟不了那么大的区域。这种多尺度问题非常难办。


    当然，纯理论更不行。在核聚变这个领域，是实验说了算的。总是实验发现了意想不到的现象，我们跟着过去看看能不能模拟。我们 的作用在于用模拟提供一点理解。


