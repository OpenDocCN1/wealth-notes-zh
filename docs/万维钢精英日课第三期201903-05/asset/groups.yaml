    ## 期权的智慧4：现在和未来哪个更重要


    万维纲·精英白课3

    今天


    期权的智慧4：现在和未来… 12:20 8.48 MB


    今天咱们继续讲期权的智慧。我们这个小专题的主题并不是研究期权本身，而是研究怎么在不确定性的世界中把握机会和 quản lý风险。像“不确定性”、“机会”和“风险”这些词，老百姓一说都是泛泛而谈，说的可能都是一些主观感受而已，一说起来就...需要一个理性的、可量化、可操作的框架。


    金融理论就提供了这个框架。首先金融产品是有价的，好就是赚钱坏就是赔钱非常可测量。其次，金融市场中的不确定性跟真实世界的不确定性没有本质区别，可以说金融市场反映了真实世界的不确定性。更好的...人们在金融市场里，已经把操纵不确定性的各种手段都给拆腾明白了。现在问题仅仅是人们并没有意识到，像期权这种东西，并不只属于金融市场，这些手段可以类比到其他领域的风险操作。


    我们专栏熟悉的经济学家泰勒·科文（Tyler Cowen）去年出了一本书[1]，以经济学的视角分析人类社会未来的走向。科文使用了“贴现率”这个工具分析我们应如何面对像可持续发展和环保之类的问题。我读了这本书感觉意思不大，但是科文的博客有个读者，署名“CK”，是个证券交易员，给科文写了一篇读后感[2]。CK提出了一个原创的观点，说我们应该用*期权*来衡量人类文明的价值。


    我看CK这个分析相当于是用期权理解未来问题的框架。人文文明的命运是一个虚无缥缈的问题，但是期权思维，可以帮我们看清楚，应该如何在现在和未来之间做出取舍。


    现在和未来之间的取舍，或者说“现实和梦想”、“眼前的苟且”和“诗和远方”，是人生中最重要的一個两难问题。有時候我們說要“活在當下”、“過好每一天”、“花開堪折直須折”，有時候又說要“面向未來”。有時候說要“不計一城一池之得失”，有時候又說要“寸土不让”。那到底该怎么办呢？


    如果你永远只顾眼前而不为未来打算，你就肯定走不远；但是你也不可能永远只投资不要回报，或者只学习不工作。那这个“度”，到底应该怎么把握呢？期权就是专门操作这个“度”的。


    我们设想一个 call 期权。它允许你以一个固定的履约价格，在未来某个日期，买入一只股票。那么落实到“现在与未来”这个情境，就是——


    - 这只股票当前的價格，代表“现在”；

    - 期权规定的履约价格，代表未来的愿景；

    - 期权本身的价格，代表当前市场对未来愿景的看好程度。


    如果期权的價格很低，就代表你认为未来那个愿景不太可能实现；如果期权的價格很高，你就很看好未来。那么什么高，什么叫低呢？一只100元的股票的期权是2元，一只10元的股票的期权是1元，你能说100元那个股票的期权价值更高吗？交易员使用一个更科学的衡量指标，叫做delta。


    一个期权的 delta，代表当前股价每变动1元的情况下，期权价格变动多少。


    比如我们考虑一个当前股价是100元，履约价格是120元，到期时间是6个月之后，目前价格是10元的 call 期权。如果今天股价涨到了102元，那就说明它距离120元的目标更近了，这个
    call 的价格也应该涨一点，比如涨到了10.1元——那么这个期权的 delta，就是0.1/2=0.05。


    股票当前价格代表现在，期权价格代表未来，所以 delta，就代表相对于未来来说，现在到底有多重要。


    买 call 的 delta 的值总是在 0 和 +1 之间。Delta 的大小，就告诉了你怎么在现在和未来之间取舍。如果 delta 接近于 0，就表示期权的价格对当前股价非常不敏感，就是说当我们考虑未来的时候，现在并不重要。如果
    delta 接近于 1，就表示期权价格的变动跟当前股价几乎是一样的，就是说现在很重要。


    请注意，delta 并不是一个股票市场特有的、人为制造的东西！对任何一种不确定的未来场景，你都可以定义一个 delta，它的规律将是一样的——股票市场只是最方便地展现了
    delta 的规律而已。


    通过考察 delta 的变动规律，我们就能知道现在和未来在各种情况下的取舍。


    我们考虑三种情况。


    ### 1.宁做白须公，莫做少年穷


    如果一个期权的到期时间距离现在还很远，它的履约价格却现在高很多，那么 delta 就会很小。这时候投资者关注的是长远的表现，并不在乎近期股价波动。


    用占卜的语言来说，这是一个志存高远的“挂象”。这就好比是一个刚出校门...Delta 小，所以当前股价波动不重要，这就叫“不计一城一池之得失”。在这个情况...我相信...总而言之，从当前股价、履约价格和到期时间来看...


    ### 2.变革中的人


    Delta 的大小还跟股票的波动性很有关系：波动性越大，delta 就越小。这完全符合逻辑：如果股价每天都波动很大，或者面臨一个即將到來的大波动——比如公司即將發布財報——今天的股價是多少就沒有太大的意思。你既然選擇了买期权，就是在赌未来的变动。


    这个卦象相当於一個人搞了个创业，或者只身前往大城市闯荡，他的未來有無限的可能性。也許他本人有很高的愿景，也許他只是想走一步看一步并沒有什麼計划。他根本左右不了自己的命运。


    如果你看好他，你可以买他一个 call；如果你不看好他，你可以买他一个 put——但无论如何，那个 delta 的绝对值都是比較低的，因为他今天什么样真的不重要。


    ### 3.生逢乱世


    前面说的那个波动，如果你应对得当的话，机遇还是可以大于风险的，最多也就是创业不成把本钱赔光，最起码还有个破产保护——要不怎么会有专门买了你的 call 呢。


    但是有一种极端的情况，则是对称的风险，成敗得失全部利益均失。这就好比说一个人生逢乱世，或者出生在一个颓流离的家庭，连最起码的安全感都没有，那这時候应该怎么办呢？


    这时候应该怎么办呢？


    如果用期权模拟这个极端的情况，相当于你既买了 call，又卖了 put。你没有对冲风险，你是在体验风险。股价上行，你就能赚到钱；股价下行，你就一定跟着赔钱
    —— 而且输赢在很大范围内都不保底！


    数学上可以证明这个组合的总 delta = 1。也就是说你等于持有股票。你应该只在乎现在，完全不考虑什么未来。


    我们想想，这是不是很多贫困家庭的孩子行为模式。今朝有酒今朝醉，能享乐要及时享乐，因为明天什么都可能发生。


    我们专栏以前讲《指导生活的算法》这本书的时候讲过探索和收获的取舍，年轻人应该积极探索未知事物 —— 要不要尝试新的餐馆，要不要结交新的朋友 —— 老年人就可以好好享受探索的成果
    [3]。这一讲的话题更沉重，但是也更重要。


    现在重要还是未来重要？你得考虑自己现在是什么水平（当前股价）、对未来的的愿景（履约价格）、未来距离现在有多远（到期时间）、是不是赶上了大变革阶段（可能向上的波动性），以及是不是生逢乱世（波动的对称性）……期权思维能帮你想明白这个问题。


    关于期权的智慧，我们这个小专题就讲到这里。


    （THE END）


    注释

    [1] Tyler Cowen, Stubborn Attachments: A Vision for a Society of Free, Prosperous,
    and Responsible Inpiduals, 2018.

    [2] CK, The option value of civilization, https://marginalrevolution.com/marginalrevolution/2019/01/option-value-civilization.html
    June 2019.

    [3] 精英日课第一季，《数学家告诉你怎样慢慢变老》。


    ## 特别放送：重新认识“风险”


    万维钢 · 精英日课3

    今天


    进入详情 >


    特别放送：重新认识“风险”

    00:33 388.84 KB


    万维钢


    今天我们总结的主题是“风险”。到底什么是风险？怎么判断风险的大小？如何管理风险？怎么面对风险？怎么利用风险？风险和回报、风险和成就的关系是怎么样的？我们把三季度日课里关于“风险”的认知帮你做了一个总结，希望能帮你重新认识风险。


    ### 一、风险的对称性


    - 1. 《汉谟拉比法典》的核心思想，就是交易双方要对称地承担交易的ˈ风险。建筑师给人造房子，住户搬进去，如果房子塌了，压死了住户的大儿子 —— 那么建筑师的儿子就得死。这就是古人一直以来的精神。你要做一件事情，你就得承担这个事的后果。

    - 2. 咱们中国也是这样。有明确生卒年月的中国古代皇帝一共是209人，他们的平均寿命只有39岁 —— 而普通中国人，只要不是一出生就夭折，平均寿命是57岁。所以中国皇帝中，非正常死亡率高達44%。皇帝，是个高风险的职业。

    - 3. 一直到近代也是这样，欧洲贵族得上战场，打仗得冲在最前面，死亡率比老百姓高。贵族的本义，就是用承担风险换取显赫的地位。


    截此复习：现代社会和利益收敛


    ### 二、风险的大小


    - 1. 风险需要比较，不要谈风险色变，得比较风险的“大”、“小”。数据显示，家庭托儿所中小孩因为事故死亡的概率是正规托儿所的7倍 —— 那请问，如果你特别注重安全，是不是应该把孩子送到正规托儿所去呢？

    像这种问题千万不要只看倍数，一定要看看概率的绝对值。事实是全美国每年死于家庭托儿所的孩子只有十几个 —— 而同龄年龄的孩子死于交通事故的数量是每年79个。那么如果正规托儿所离家比较远，家庭托儿所离家比较比较近的话，哪怕距离只相差20%，你如果只考虑安全，就应该把孩子送到家庭托儿所去。所以哪怕只考虑安全，也不能一听说有风险就变色，得把各种风险放在一起比较才行。

    - 2. 更好的思维方式是接受这个世界是有风险的。交通有风险，我们也不能不上街。与其担心各种极小概率的危险，还不如把心思用在别的事情上 —— 那些更重要的事情。

    - 3. “标准差”，就是专门描写风险大小的概念。随机事件大多可以用正态分布描写。正态分布有两个指标，也是我们考虑任何随机事件首先要问的问题。“均值”代表平均的回报率，“标准差”代表风险大小。均值越大越好，标准差越小越好。高风险必须给高回报，这个项目才有存在的价值。


    截此复习：怎么理解特别大和特别小的数、标准差和人生哲学


    ### 三、风险偏好


    - 1. 一个人的风险偏好，不是这个人本身的一项什么特质，而是跟具体的事物有关。说白了，就是胆大的人不是干什么都胆大，胆小的人也不是干什么都胆小。世界上没有带着“胆大”或者“胆小”标签出生的人，每个人都是在不同情景之下表现出不同程度的风险偏好。

    - 2. 但人的不同风险偏好可不是天生的，而是由这个人的“认知”决定的。每一件不确定的事，都有“风险”和“收益”两个方面。如果你对收益的感知大于风险，你就会认为值得冒险，反过来你就认为不应该冒险。

    - 3. 男女的风险偏好差异其实并没有那么大。一项综合研究表明，对生活各个方面总体而论，男性的确在整体上比女性更爱冒险。但是在其中一半的项目上，男女冒险程度几乎一样。而在20%的项目上，女性比男性更爱冒险。

    - 4. 总之，人的风险偏好并非天生，也不是由生理结构决定，而是由对不同事物的收益和风险大小的认知所决定的。有些认知是对的，有些认知是错的，还有些时候我们向社会习俗投降。


    截此复习：白人男性的冒险思维


    ### 四、管理 and 利用风险


    - 1. 塔勒布有个“杠铃法则”：一小部分（比如10%）安排高不确定性，一大部分（比如90%）安排零风险，而避免那些中等风险的东西。

    - 2. 比如你可以用少量的钱买高风险投资，用大量的钱买低风险投资。如果你想做一件有意义的大事，那就应该只在这个事情上冒险，而避免任何其他没有必要的风险，比如开摩托车和吸烟。阅读，要么读好书，要么读完全不用动脑的网络小说，避免中间。

    - 3. 理解两种非线性：一种是回报随着投入的边际效应递减，上升缓慢，到顶后越往后下降越快，会出负值，而且下不封底。它上行的利益有限，下行的危险却是无底的。在这条曲线上多走远一点点，损失就可能大很多。

    - 4. 另外一种是随着投入边际效应递增，下行风险有限，上行空间不封顶，像这样的事情儿，如果有机会，你应该主动参与。这是我们想拿call期权的地方。塔勒布把这个上凹下凸曲线称为“哲石石
    (philosopher’s stone)”。在反脆弱曲线上多走远一点点，收获就会大很多。

    - 5. 期权思维的本质是掌握对风险的主动权。一般人谈风险都是说要防范风险，是被动的；而期权思维则是积极主动的，我们要利用风险。特别是，它能让你识和抓住机遇。

    - 6. 对机遇光有思想准备不行，你得有动作才行。期权，就是我们锁定机遇的动作，是对从未来的风险和机遇中受益的权利的提前锁定。为此你会付出一丢丢价钱，但这常常是值得的。


    截此复习：纳西姆·塔勒布与魔石法则 问答：知道很多跟吃饭穿衣无关的事物是暗？


    ### 五、降低和对冲风险


    - 1. 组合投资的标准差总是小于其中每只股票标准差的加权平均，所以组合投资总是降低风险的。

    - 2. 如果你有办法让组合投资中的不同项目之间存在负相关的关系，那么你能大大降低风险。

    - 3. 这个道理既适用于投资，也适用于生活。

    - 4. 对冲仅是为了降低风险。只有在害怕风险的情况下，才值得去做对冲。如果风险不大，那集中才有力量。

    - 5. 风险和收益之间有矛盾。你不可能又要高收益又要低风险。

    - 6. 一定要避免所谓“尾部风险”。什么是尾部风险呢？就是在正态分布曲线里面，尾部发生的概率看很像很小，但是它对应的后果极其严重，也就是标准的黑天鹅事件。如果这件事存在一个尾部风险，哪怕这个风险很小，你也应该回避去做。这个道理连老奶奶都知道，可是有一些专家不知道。


    截此复习：对冲风险的数学原理


    ### 六、自由和风险


    - 1. 自由，意味着独自面对风险。风险，决定了你的气质。

    - 2. 不能直接面对风险的人，咋怕你能决定千里之外一个人的生死，你也是个傀儡，你也拿不了大主意，有重大决策也不能指望你。

    - 3. 雇员在公司有利益攸关，所以忠诚度高。公司替雇员遮挡了风险，雇员获得稳定，代价是不自由。想要自由，你就得独自面对风险。所以说“Freedom is
    Not Free”，自由不是白给的。


    截此复习：雇员和风险家


    ### 七、回报和风险


    - 1. 没有风险就成功，这根本不可能。说我只要肯省钱投资，每年老老实实赚个10%，日积月累一定能致富 —— 这是妄想。风险是必须存在的，关键在于怎么管理风险。在市场充满有效性条件下，根本就没有“风险收益不对称”的事件，有多大收益就有多大风险。

    - 2. 所谓投资，就是在风险和回报之间做一个取舍。你要安全可靠，回报率就很低。你要高回报，就得承担高风险。

    - 3. 想“用钱生钱”，就得冒险。那些把发财的希望寄托在复利上的人，是认知上的懒惰者。爱因斯坦根本没说过什么“复利是宇宙中最强大的力量”这种谣话。


    截此复习：复利的鸡汤和真实世界的增长


    答读者问 | 对*中庸*的一点浅见

    '
