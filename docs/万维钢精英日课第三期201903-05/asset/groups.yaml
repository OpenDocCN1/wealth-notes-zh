    # 博弈论13：博弈设计者


    万维钢·精英日课3


    今天


    博弈论13:博弈设计者


    中国有句诗叫“劳心者治人，劳力者治于人”。如果这就是曾经的社会现实，我认为这样的社会不但残酷，而且不合理。我们学习博弈论最起码底线就是不能“治于人”——要做一个独立自主的
    player，识别各种博弈局面，自己决定如何应对，我们拒绝被人安排。


    当然我们也不想“治人人”，人不能压迫人，player 跟 player 之间是平等的关系。不过学习博弈论的确有一个做效 player 更高级的视角。那就是做为规则的制定者，去给人设计博弈局面。


    ## 1.薪酬的结构


    有些人认为凡是存在的社会现象就都是合理的，我认为不是这样。我给你说一个明显不合理的现象。


    ## 2.拍卖故事


    ## 3.理性与数学


    第一，人们工作只是为了钱。


    第二，只要你监管不到，这个人就肯定就会偷懒，甚至会腐败。


    基于这两点，为了防止工人偷懒，你就必须用一个更高的工资去收买他。只有这份工作的工资足够高，他才会担心偷懒被抓住，他才会为了保住工作而不偷懒。要给多高的工资呢？你得考虑社会基本收入水平和工人偷懒被抓住的概率
    —— 越容易偷懒的岗位，工资就得越高。


    对官员高薪养廉也是这个道理。有人计算过一个非常复杂的高薪养廉公式，说官员工资应该由社会基本收入、贪腐被发现的可能性、对贪腐的惩罚力度和官员权力的大小决定。


    我看到这些一本正经的理论，就想起维克里得了诺贝尔奖的拍卖法。拍卖规则那么简单那么直观，实际应用都有可能出问题 —— 那高薪养廉公式对真实世界做了那么多近似，它还可能有实际应用价值吗？


    把博弈论用于制度设计，我看通常有两个默认的前提。一个是激励必须是基于可见的表现才行，这个人卖了多少东西，这个人写出几篇论文，不可见就没法操作。一个是参与各方得是为了单一的目标进行博弈。


    但现实生活并不总是这样的。科学家和政客并不仅仅是为了工资而工作。他们也想要工资，但是对他们来说，荣誉，地位和权力比工资更值得追求，而你没法量化。人是理性的，但理性不等于一门心思挣钱。


    以前凯恩斯有个感慨。他说经济学家能不能别总做事后诸葛亮，只知道解释世界 —— 我们能不能也像牙医一样，开个诊所，谁有问题我们就帮他设计一个解决方案。


    怎么才能设计一个完美的制度，让官员不腐败，让科学家不偷懒呢？目前来说，博弈论可能还没成熟到能开这种诊所的程度。


