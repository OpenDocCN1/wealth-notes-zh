    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_62_0.png)


    万维钢


    人做一件事情，可能有见不得人的动机，但也可能有高尚的动机——《头脑中的大象》这本书说的关键所在是很多时候连他自己都不知道他自己是什么动机。大脑是个多元政体，有各种声音，我们的偏见在于更相信自己好的动机，更相信别人自私和愚蠢的动机。


    所以理性的做法是干脆不要质疑和揣测别人的动机。而更好的办法是设法加强他好的动机。孟子说“恻隐之心人皆有之”，斯蒂芬·平克说人性之中都有“善良天使”——我们应该鼓励这好的一面。


    比如有很多成功企业家会赞助甚至直接买下一支足球队，这并不能帮他们直接赚钱，每年还得投入很多钱，你说这是为啥呢？可能他们是为了广告效应，可能他们是为了政治资本，可能他们认为这样花钱很好玩——但也有可能，他们就是想提高中国足球的水平。如果一个企业家声称自己投资足球全是因为爱国情怀，那肯定是不诚实的——理性分析，应该是各种因素都有。但是我相信，帮助中国足球提高水平这个因素在他头脑里所占的比例应该是比较大的。不管是因为啥，这都是好事儿，我们何必讽刺他呢？我们何不就当他全都是出于情怀呢？


