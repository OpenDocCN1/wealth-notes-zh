    ## 期权的智慧3：纳西姆·塔勒布与魔法石


    万维纲·精英日课³

    今天


    进入详情 ›


    期权的智慧3：纳西姆·塔勒布与魔法石


    我们继续讲期权的智慧。上 usual 我们提出一个价值观：如果有特权，你应该喜欢波动性，你应该喜欢让事情去极端。接下来问题就是如何寻找这种期权式的机会。


    生活中的确有很多这样的机会，但也有很多事不但不是机会，而且还是累赘和危险。我们人生在世也只有权利，还必须承担很多义务。理想的人生，一方面要通过行使权利而不断成长，让自己变得很厉害；另一方面又能安全、妥当地承担义务。


    好运气，你能把它效果最大化；坏的危险，你能把它限制在可控的范围之内。这简直就是人生的核心算法。


    对这个算法最有发言权的必须是纳西姆·塔勒布。塔勒布所有的书里我最喜欢的一本，就是《反脆弱》。 “反脆弱”这个概念现在已经深入人心了，要说怎么对付脆弱、怎么利用反脆弱，我看很多人的认识还不够，可能是因为其中的操作原理是一个数学思想。


    其实这个思想并不难懂，我们先讲一点数学。


    ### 1.两种非线性


    你可能经常听说“非线性”这个词，非线性 的东西经常带给人们反直觉的故事……那什么是非线性呢？


    咱们先说“线性”。线性，就是能按比例扩大。比如你买苹果，买一斤苹果是12块钱，那买10斤苹果就是120块钱——输入值增加多少，输出值就会按照固定比例、相应地增加多少。画在图上，如果横坐标是输入，纵坐标是输出结果，你会得到一条直线，所以叫“线”性——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_150_0.png)


    而所谓非线性，就是结果和输入的关系不是直线、不成比例。比如喝啤酒，你喝一瓶啤酒觉得很愉快，那你喝两瓶啤酒得到的愉快度，是不是喝一瓶的两倍呢？不是。我们知道经济学有个著名的论断叫“边际效应递减”，喝啤酒就是个边际效应递减的事儿，它的曲线是下面这样的——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_150_1.png)


    随着你喝啤酒的瓶数增加，愉快度并不是直线上升的：它越升越慢，达到一个峰值之后可能还会下降。


    ### 2.琴生不等式


    一切问题都是数学问题。要知道怎么具体应对这两种非线性，我们就需要了解这两种非线性函数的一个数学性质，叫做“琴生不等式（Jensen''s inequality）”，这个名字来自丹麦数学家约翰·琴生（Johan
    Jensen）。


    会让它更麻烦。但简单的项目就不容易延期，为啥呢？因为你可以把它分散开。比如修路就是简单项目，你可以把路分成若干段，每个工程队负责一段，哪里有意外状况不会影响到其他地方。可是像修桥、特别是像软件工程这种复杂项目就不一样了，你没法分段！那就特别脆弱。


    脆弱的，你就要让它均匀。


    ### 3.酒要少吃，事要多知


    单田芳有一句话叫“酒要少吃，事要多知”，说喝酒要每次少喝点，但是了解知识呢，你多了解一些没有坏处。为什么呢？因为知识是个反脆弱的东西。


    你不希望反脆弱的东西均匀分布。比如我是个网络小说爱好者，我时间有限每天只能追三部小说。起点中文网可能有几万个作者，我希望他们的才华最好都集中在我追的那三个作者身上。我对提高全中国人民的踢足球水平不感兴趣，我们只需要大约两千个职业球员和几十个球星。


    当然，为了出球星，你必须广撒网去找，你需要巨大的足球人口……但是，你不希望他们的才华平均分布。你喜欢极端。


    塔勒布在《随机生存的智慧：黑天鹅语录》这本书中有句话说：


    > 「一百个人里面，50%的财富，90%的想象力，和100%的知识勇气，都会集中在某一个人身上——不一定是同一个人。」


    我们观察这个世界，那些分布不均匀的东西，也许它就有集中的好处。也许之所以集中，就是因为你那是一个反脆弱的东西。


    为什么市场经济中的财富常常集中在少数人手里呢？因为钱能生钱，钱越多就越容易增长。为什么总是少数公司特别能创新，多数公司都平庸呢？因为创新能力也有集中优势。你不希望每个城市有个创新公司，每个公司有个牛人，你希望发挥牛人的聚集效应。在反脆弱曲线上多走远一点点，收获就会大很多。


    我们说广撒网有利于发现机会，但撒网只是第一步。发现好的方向，你得让它成长才行，否则你无法收割利润。学习是个反脆弱的过程，你得保持开放的态度对什么都愿意了解，但是你不想给每个领域平均分配学习时间。把大部分时间用于一本特别难的书，你才能有巨大的收获。你需要大胆地开始，无情地放弃。


    塔勒布据此提出“杠铃原则”：大部分资源用在最低风险的东西上，少量资源用于追逐最高的风险。如果健身是反脆弱的，我们就应该时而放松，时而猛练；如果健康饮食是反脆弱的，我们就应该时而节食好几天，时而大吃一顿。


    下面这张图能帮助你记忆这两种非线性曲线：上凹下凸曲线就好的是一个笑脸，是我们喜欢的；上凸下凹曲线是一个皱眉的表情，是容易出问题的……


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_151_0.png)


    这个心法是在生活中寻找这两种曲线。增加一点点投入，它的输出是边际效应递减，还是边际效应递增？它的风险和利益是怎样的一种不对称性呢？


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_151_1.png)


