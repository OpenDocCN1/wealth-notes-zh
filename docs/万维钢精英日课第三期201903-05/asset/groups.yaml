    # 《九个工作谎言》1：工作是具体的，公司是虚拟的


    万维钢·精美日课³

    今天


    进入课程 ›


    《九个工作谎言》1：工作是。


    今天开始我们来说一本上周，四月2日刚刚出版的新书，叫《九个工作谎言》（Nine Lies About Work: A Freethinking Leader’s
    Guide to the Real World）。这本书的两位作者，马库斯·白金汉（Marcus Buckingham）是个数据分析专家，阿什利·古道尔（Ashley
    Goodall）是个企业管理专家。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_63_0.png)


    我们专栏之前有一期叫《正确型人才和异型人才》，曾引用过他们三月份发表在《哈佛商业评论》上的文章[1]。我觉得这两个人很有思想，新书一出来就赶紧读，果然不错。


    简单地说，这本书讲的是基层领导应该怎样带好一个团队，如何帮助手下成长。这个题材并不新，精美日课以前也讲过一些，但这本书有两点特色，尤其值得在我 们专栏讲。


    第一个，这本书的一个关键思想是，现代企业通用的各种管理方法，与其说是为了提高工作效率和增加企业效益，不如说是为了方便高层“管”员工——这个“管”是管制的管。高层希望所有员工都是一个模子制造出来的，而这纯粹因为领导人的思维简单，他理解不复杂(g)世界。那
    些制度等于是在迫害员工。


    第二点，这本书充满了“以人为本”的思想。公司不应该是“用”员工的地方，而应该是培养员工的地方，公司应该像对待球星一样对待自己的员工。


    我个人非常喜欢这种对抗体制的话题，尤其这本书还是通过数据分析和现场调查得出的结论。这本书将告诉我们真实的工作场景*是什么样，以及*应该*是什么样的。


    这一讲咱们先来重新理解一下“公司”。


    ## 1.你是在为公司工作吗？


    假设你对一家著名的大公司很感兴趣，想要去应聘。你是优秀人才，不能轻易委身于哪个公司，所以你事先了解了一下这家公司的 情况。


    你首先调研了它的各种硬指标，品牌啊股价啊产品线啊前景啊等等。但是你更想知道在这家公司里每天的工作是一种什么样的体验。现在有些网站是专门让员工点评自己公司的，比  如美国的
    Glassdoor，中国“看准网”等等。你从这些网站了解了一些情况，像工资水平、福利待遇等等。


    在你研究公司的同时，公司也很希望增加它对你的吸引力。有志向的公司都非常希望在从业者中有个好口碑，可以说是求贤若渴。美国《财富》杂志还要每年都评选出“100个最受员工喜爱的公司”。


    在工资之类的硬指标之外，你还很想了解这家公司的“企业文化”。企业的品牌形象是给消费者看的，企业文化则是给员工看的。我们都听说过各种 异样的企业文化—— 有的公司氛围是非正式的，会在
    海滩上开会；有的公司很严肃，要求必须着正装上班；有的公司特别强调创新，每周给一天时间让员工可以做自己想做的创新项目；有的公司给员工提供幼儿园服务；有的公司的情怀体现在必须使用太阳能办公……


    那么请问，这些企业文化，对你真的有用吗？所以这些东西有一个共同点——


    它们不是你能控制的。它们是公司给设置的。


    你真实的工作体验，跟这些东西没有太大关系。不论公司有多大，你其实都是在一个*团队*里工作。


    ## 2.团队才是真的


    你每天真实的工作体验其实是坐在一个办公室里，和自己团队中的同事和领导打交道。团队内部的互动关系、工作的作风、交流的方式，才是你真正面对的东西。


    所以这本书的两位作者，白金汉和古道尔认为，团队才是根本。他们的研究中有一个特别重要的发现，那就是一个公司内部、不同团队的工作体验，这个差别之大，总是比不同公司之间的差别还要大。


    举个例子。我们知道思科是非常 的公司，思科显然有自己的企业文化。那么两位作者问了思科公司的5983个团队一个问题： “我清楚地理解工作对我的期望是什么。”
    结果思科这一个公司内部的这些团队，在答案中打多少分的都有，分布一点都不集中——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_63_1.png)


    也就是说，思科公司内部，有些团队的成员认为自己清楚工作对自己的期望，也有些团队的成员认为自己不太清楚。


    再看另一个例子。有个也是很大的公司叫健康使命（Mission Health），作者问它的1002个团队这样一个问题：“你对公司的未来有多大的信心？”结果也是答案非常分散。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_63_2.png)


    面对这样的 数据，请问“企业文化”还有什么意义呢？同一个公司内部的不同团队，对这么基本的问题都没有全公司一致的看法！


    我给你打个比方。这个道理就好比说你要考研。考研和考大学不同，你不但选择哪个大学或者研究所，而且还要选择导师。那么请问，就日常学习和工作体验而言，是选对了科研机构重要呢，还是跟对导师重要呢？答案一定是导师更重要。


    浙江大学也好、南京大学也好，都是庞然大物，其实跟你并没有太大关系。你每天大部分时间是躲在实验室里面搞科研，真正决定你前途的是导师，跟你打交道的是同组的师兄弟。如果你所在的大学说要开展什么新文化运动，那对你的影响是非常非常小的。


    再说的夸张一点。你打算移民澳大利亚，就找了一个已经在澳大利亚的同学问澳大利亚好不好——这个问题的实际意义不大。澳大利亚有过得好的也有过得不好的，你需要了解的不是平均印象，而是具体到*你*的生活。


    所以说团队比公司要重要得多。那什么样的团队是好团队呢？


    ## 3.团队的好与坏


    我以前听过一个说法，说如果办公室里有一位牛人，他干活效率特别高、能力特别强的话，那么他的办公桌附近的几个人，也会在他的刺激之下提高水平；而如果办公室里有一个人水平特别低，懒散不干活，他也能把周围几个人都给带动得不干活。


    真实的工作都是在本地进行的，直接影响你的，是你所在的团队。


    两位作者通过大数据分析，看看哪些因素能够直接影响一个团队的业绩，结果发现有八个问题起决定性作用。在这八个问题上体验良好的团队，业绩明显高于体验不好的团队。


    八个问题可以分成两类，一类是整个团队共同的体验——


    - 1. 在我的团队里，我周围的人跟我的价值观是一致的；

    - 2. 我总可以把后背交给队友；

    - 3. 我对公司的使命充满热情；

    - 4. 我对公司的前景充满信心。


    后面这两个问题其实是来自公司的，但是最终只能通过团队体现出来。


    另一类是个人的体验，也是四个问题——


    - 1. 我清楚地理解工作对我的预期是什么；

    - 2. 我在工作中每天都有机会施展我的特...

    '
  mdcn: '

    下层吸引消费者：我这个冰箱物美价廉，我这个手机性能卓越，我这个椰汁能丰胸。可是我们看那些高级的广告，都是试图打动消费者那个马斯洛顶层的自我。


    这也是为什么长辈给介绍对象不靠谱：他们看孩子只能看到马斯洛中下层，因为顶层的内容很难跨代交流。你家孩子爱好艺术但你觉得那不是卖点，你以为别人家孩子都只认房产证吗？


    如果这个“别人”是“外人”，我们的“马斯洛金字塔偏见”可能就更严重了。


    中国古人看自己，那是礼仪之邦，我们是知书达理、舍身取义的中华；我们看蛮夷，那都是只知道利害不知道大义的野蛮人。可是殊不知蛮夷看我们也是这样：他们可能觉得中原人都爱欺诈而且贪生怕死，草原人都是讲义气的豪杰。


    其实谁还没有个自我实现的需求呢？


    近代面对西方“列强”，我们认为他们强在“船坚炮利”；而我们中国之所以落后，那是被“礼教”所害——说白了，我们是因为在马斯洛顶层呆的太久，吃了过度文明的亏。


    于是中国从一个极端走向另一个极端：认为在国际上做事应该只谈利益！既然别人是“列强”，那我们就必须成为“更强”。


    这个想法其实没有大毛病，想在国际上混好，硬实力绝对是第一位的。但是，软实力其实也很重要。列强并不是只讲“没有永远的朋友没有永远的敌人只有永远的利益”，“胡萝卜加大棒”之类，列强的人民也有马斯洛顶层需求。


    有研究发现，西方选民投票，在很大程度上并不是从自身利益出发 [4]。人人都知道自己手里这区区一票根本左右不了大局，之所以出去投票，那其实是一种自我表达——那是要表达自己的政治理念，那是自我实现的需求。


    如果你认为在国际上做事应该只谈利益，我认为你那是一个错误判断。说我是有钱的中国大爷，跟我合作有好处拿，你们服不服？这是一个非常愚蠢而且难看的姿态。试问如果一个外国人到中国这么嚣张地炫耀，又有哪个中国人受得了。


    说你这个地方的人对我们缺乏好感，那你们还想不想做生意了？想跟我做生意就得认同我！这招对资本家也许有用——毕竟资本家有直接利益。但是对老百姓来说，你那生意的好处摊到我头上真没多少，我怎么可能因为那么一点点利益放弃自我实现的需求呢？


    总而言之，认为别人只讲利益，别人的认知充满偏误，甚至敌人非蠢既坏，这是一个普遍的偏见，有可能会妨碍我们的判断力。


    学会在马斯洛需求金字塔的高层跟人打交道，你才是真正的高层次。


