    ## 读者 晓添才：


    怀着崇高的理想做具体的事，应该是每个人最好的工作方式吧？现实中普通人们的工作基本都是被迫的，不过，如果获得了财富自由，人应该又会变成另外一个自己了吧？


    说我现在先忙着挣钱，等我财富自由了就去追求自己的爱好，比如写诗啊，画画啊，钻研哲学啊之类……我认为这纯粹是一个神话。


    那些一天到晚就琢磨怎么挣钱的人，钱再多他们也不会满足的。他们就算真的“财富自由”了，也只会换个方式接着琢磨挣钱。而像盖茨、马斯克、贝佐斯这些成了巨富以后去搞一些太空探险和慈善事业的人，他们从来都不是一门心思就想赚钱的人，他们一直都是在做自己想做的事情。


    我们说的“乐之者”并不一定非得有崇高的理想，他们只是坚持做能给自己带来快乐的事情。这不一定是一个能带来财富自由的策略，但是是一个很好的人生策略。人生一世也该做一些自己喜欢的事，而且应该一生中都这么做。


