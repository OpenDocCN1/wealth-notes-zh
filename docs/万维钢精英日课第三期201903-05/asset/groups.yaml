    # “外推谬误”


    万维钢·精英日课³

    今天

    进入课程 >


    这一讲我们说一个常见的思维错误，我先从一个故事讲起。


    在很多年以前，我上初中的时候，学校发了一本小册子《国澳门教育读本》。这本小册虽然是指定读物，但是写得挺好看。其中有一些比教科书前卫的思想，读了让人有一种紧迫感，很担心国家的命运。书中有个故事是这样的——


    说从前有个池塘，池塘的一个小小的角落里，长了一点点水藻。水藻的生长速度是每天面积扩大一倍。到第30天的时候，水藻已经占据了池塘的一半。那请问，还需要多少天，水藻会布满整个池塘呢？


    答案非常简单同时非常震撼：只需要一天。当然，那本小册想说的更令人震撼的事实是中国人口就像那池塘里的水藻一样在高速增长。


    作为一个初中生，意识到自己是一个水藻，我的内心有点不是滋味。我不知道编那本的书人今天会怎么想，今天的中国人正在为中国人口出生率太低而发愁。我们的人口增长显然没有延续当年的趋势，事实证明我们不是水藻。


    从马尔萨斯开始，人口专家就不懂人口。


    马尔萨斯人口论的核心思想 [1]，就是认为人口数量是“指数”增长的，而人类生产粮食的能力只是线性增长。指数增长的意思是曲线加速上升，每过几年就翻一番，就像水藻一样；线性增长则是固定速度稳定上升。那么只要过了某个时间点，指数增长就会远远超过线性增长。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_68_0.png)


    # 通常的情况是，你想多了。


    外推谬误简直无处不在。


    1820年人类才有了第一辆火车，速度是每小时70公里；到1976年，民用航空就出现了协和超音速飞机——那也就是说，人类的交通速度在150年内提高了20倍。按照这个趋势，太空旅行简直是不可避免的，那下一步必须去火星吧？


    # 一种情况是因为环境是有限的。为什么没有哪个公司能长期地指数增长？因为全球市场就只有这么大。如果你的市场占有率已经达到50%，你就不指望再把产量提高一倍了。


    # 一种情况是这个趋势会导致外界的变化，而外界的变化会反过来改变这个趋势。


    # 还有一个情况是突发性的改变。技术进步在本质上是不可预测的。正如马尔萨斯无法想象化肥，我们也无法想象将来的人会在什么时候、发明多少好用的新东西。而有些技术一但出来，就会立即大幅度改变各种趋势。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_68_1.png)


    这么说 Facebook 肯定不干。Facebook 自己的研究人员说，要这么论的话，我看你们普林斯顿大学在 Google 被搜索的次数也呈现下降的趋势，根据这个趋势我们判断普林斯顿到2021年就招不到学生了。


    这都是外推。Facebook 用了一个临时趋势的简单外推，普林斯顿用了一个更精致的模型。普林斯顿有病毒的经验，知道 Facebook 的高速增长趋势是不可持续的，他们考虑到了趋势的变化
    —— 但是仍然预测错误。事实上今天 Facebook 不但没有消亡，而且活得还挺好。


    根本原因，当然是 Facebook 不是病毒。Facebook 不是简单地繁殖，它会主动变异，它想方设法推出新的服务项目来留住用户。


    人可以影响趋势。


    过去这几十年来，我看只有两个大趋势始终没有变。一个是计算机性能增长的摩尔定律，一个是中国经济的高速增长。请注意，这可不是常态，这叫奇迹。


    变，是正常的；不变，是奇迹。


    中国有句话叫“长此以往，国将不国” —— 这句话一般都是反着用，正着用肯定是立flag，今天的中国依然是中国，只比过去更好。


    “外推谬误”的中国版叫“杞人忧天”。这个世界的确面临各种风险，但总体来说，那是相当抗折腾的。


    “长此以往”是非常非常罕见的事情。如果有人说什么是长此以往如何如何，我认为“外推谬误”是 сексу买少见的答复。


