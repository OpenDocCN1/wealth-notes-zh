    ## 逻辑思维1：学点逻辑思维


    万维钢·精英日课³


    今天


    进入课程 >


    逻辑思维1：学点逻辑思维


    今天开始我们来谈谈逻辑思维。我们要借助一本2018年出版的新书，叫《不讲逻辑的世界里的逻辑艺术》（The Art of Logic in an Illogical
    World）。这本书的作者为金侑亚·程（Eugenia Cheng）是一位英国的女数学家。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_27_0.png)


    我有个有意思的想法，如果我们这期节目将来有幸入选罗胖精选，那就是一期关于逻辑思维的罗辑思维。


    我们在生活中经常说，“你这话说得没逻辑”、“你犯了逻辑错误”等。什么是逻辑呢？逻辑，是说理的底数……逻辑。


    你可能学过难度很高的数学，但你很可能没有正式学过逻辑学。逻辑似乎说是不需要正式学习的。其实你已经会了，只是不知道而已。我给你举个例子，一提逻辑学，人们首先会想起亚里士多德著名的“三段论”，也就是大前提、小前提和结论
    ——


    - *大前提：人都要吃饭。

    - *小前提：中国人是人。

    - *结论：中国人要吃饭。


    可这不是废话吗？这还用专门学吗？这种学问有什么意义呢？我们要说的就是这个意义很重大。现代逻辑学的基本操作比这个三段论更基本，但是其中的学问远超过亚里士多德。而且现代人经常犯逻辑错误。


    “我会只不过我不知道”和“我会而且我知道”是两种非常不同的境界。英文世界形容一个人聪有很酷的词叫“sharp” —— 思维像刀一样锋利。多个逻辑学的眼光，你的思维就会犀利很多。


    想要理解逻辑是什么，我们必须理解数学是什么。


    ### 1.数学和逻辑


    我们精英日课专栏总是说“这个宇宙是数学的”。一方面表现在宇宙中的物理现象无比精确地、简直是不可思议地符合数学方程。而更底层的道理是，这个宇宙是讲理的。


    你给小孩一个苹果，然后再给他一个苹果，那他手里一定是拿着两个苹果 —— 除非他吃了一个或者扔了一个。1+1一定等于2。不管你在哪个国家、哪种文明、哪个星球，1+1=2这件事不会变，否则就是不讲理。


    这就是数学。数学是绝对正确的。亚里士多德研究的那一套自然科学，今天几乎全都过时了。但是2300年前的欧几里得几何，今天仍然完全正确。当然今天有“非欧几何”，但是请注意，非欧几何可不是说否定欧几里得几何学，而是说在换一个前提的情况下，推导出另外一套几何来。


    为什么科学知识可以是错的，数学定理却绝对是对的呢？


    因为科学知识是来自于经验的。这是一种所谓“归纳法”思维，比如说我今天看到太阳从东边升起，明天看到太阳从东边升起，那你可以把这个经验归纳成一条知识：太阳从东边升起。这个知识很可靠，但事情没有理由总是这样
    —— 也许哪天我们要实施流浪地球计划，太阳就不会从东边升起。


    科学讲证据。证据是永远也搜集不全的，所以你不可能保证科学知识的绝对正确。


    而数学，是逻辑的操作。我给你举个例子 ——


    如果你上过大学，那你就上过学。


    这就是一个逻辑推导。我们把它可以写成下面这个样子 ——


    上过大学 ⇒ 上过学


    只要你对“大学”和“上学”的定义跟我一样，那你就不得不承认，这个推导是绝对正确的，因为大学也是一种学校。数学大厦就是用这种绝对正确的推导一步一步构建出来的，所以数学永远都不会错。


    比如说勾股定理。直角三角形两个直角边的平方和等于斜边的平方，这听起来一点都不显然，但这个不显然的结论可以通过一步一步显然的推导构建出来。比如下面这张图就是一个证明
    ——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_27_1.png)


    证明过程中的每一步，都是像


    这是一个边长是 a 的正方形 ⇒ 它的面积是 a²


    这样显然正确的推导。如果你承认什么是直角三角形什么是正方形，你承认什么叫面积，你终将承认勾股定理。


    逻辑推导，并不增加任何新的信息。它只是让你换一个角度来看待这件事。你上过大学，换个角度说，你上过学。这句话说了和没说是不一样的，但是是不提供新信息。


    ### 2.抽象思维的好处


    其实严格地说，数学之所以绝对正确，是因为它研究的并不是真实世界里的东西。数字“1”并不存在于真实世界。真实世界里有一个苹果、一个橘子、一个人，但是没有抽象的数字“1”。数学世界是一个抽象的世界，是“柏拉图世界”，是“逻辑世界”。


    - 1.我们应该增加社会福利的支出，去救助穷苦的人。就算福利制度有漏洞，养了一些懒汉，那也是必须付出的代价。

    - 2.有人调查发现，人临死的时候，一般不会后悔自己做了什么事情，后悔的都是想做、却没有做的事情。

    - 3.“宁可错杀一千，不可放过一人。”


    那么你会发现社会中的很多现象都能用囚徒困境来解释。然后你就可以用解决囚徒困境的方法去解决它们。抽象思维能让你类比和推广。


    抽象思维的第三个好处是它能消除歧义，帮助我们对各种问题达成一致意见。逻辑推导是完全客观的，谁来操作都一样。


    比如说中医吧。中医有时候的确能治好一些疑难杂症。但中医的问题在于它是一个神秘的、非逻辑的系统。到底什么叫“上火”？什么叫“寒”？它没有一个像数学一样的准确定义。就算是位老中医根据自己的经验和手感能把病给人治好，他也说不清是怎么治好的。而现代医学则是逻辑化的操作，原理A、B、C，步骤1、2、3，明明白白童叟无欺，可以随时拿过来讲理。


    这个消除歧义的能力，对解决争议可是太有用了。


    ### 3.逻辑怎么用？


    最基本的逻辑推导就是


    A ⇒ B，


    意思是如果 A 成立，那么 B 就成立。这个推导是可以传递的，A ⇒ B，B ⇒ C，C ⇒ D，那么就有 A ⇒ D。亚里士多德的三段论，其实就是一个逻辑推导的传递：


    - *是中国人 ⇒ 是人，

    - *是人 ⇒ 要吃饭，

    - *所以，是中国人 ⇒ 要吃饭。


    任何数学定理的证明都是这样一步一步推导出来的，我们上初中时候都学过这种推导。尤金侄亚·程在书中举了一个这样的例子。请看下面这两句话，你能得出什么结论呢？


    - 1.如果认为女性是一种低等的存在，你就是在侮辱女性。

    - 2.如果认为“哈！这人怎么像个女人似的”是侮辱男性的一种侮辱性的说法，那你就是认为女性是一种低等的存在。


    显然，根据逻辑推导的传递，如果你认为“像女人”是侮辱男性，你其实就是在侮辱女性。而且我们还可以更进一步，如果你本身就是女性，你这么说就是在侮辱你自己。


    有了这种清晰的表述方式，如果两个人对一件事情有争议，我们就可以让他们把各自的逻辑推导列出来，看看他们的分歧到底在哪里。分歧可以发生在推导的出发点，也可以发生在中间过程。


    逻辑推导的出发点是我们对这件事儿的前提和假设，以及我们对各种事物的定义。如果我认为应该人人平等，而你认为有些人就应该高人一等，那咱们的前提假设就可能不一样。我心目中的“人才”是有能力的人，你心目中的“人才”是有潜力的人，那咱们的定义就不一样。


    比如说，咱俩对政府的医保政策有分歧，那我们可以分析一下分歧点到底在哪里。


    如果我认为凡是中华人民共和国公民都应该享有医保，而你认为只有为医保做出过贡献的人才应该享受医保，那这可能是咱们的价值观不一样。这是逻辑推导的出发点不一样，这个咱俩可以暂时各自保留意见。


    而如果咱俩都同意每个中国人孩子都应该享受医保，只是对怎么实现这一点有分歧，那就可能是咱俩中间的推理过程有分歧。那我们就应该一步一步地比对各自的逻辑推导，看看是不是谁在哪个地方犯了逻辑错误。


    两个真诚的人应该用这个方法解决争论。否则就是各说各话，脸红脖子粗啥用没有。


    那都有哪些逻辑错误呢？咱俩下一讲再说。


