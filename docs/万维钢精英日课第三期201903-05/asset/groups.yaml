    ## 单纯问题、两难问题和“棘手”问题


    万维钢·精英日课³


    今天


    进入详情 >


    单纯问题，两难问题和棘手。


    电影《天气预报员》里有一句台词，现在经常被人引用，叫做“成年人的生活里没有‘容易’二字”。


    > Nothing that has meaning is easy.

    > Easy doesn''t enter into grown-up life.


    — Weatherman movie


    成年人的确要处理一些非常不容易的事情。而有些“不容易”，比一般的“不容易”，更不容易。这一讲我们来说说什么是真正的不容易。作为成年人对付这样的事情，你需要的不仅仅是体力和智力，更是智慧和气度。


    作为对比，我想把人生在世面对的各种问题分成三类：单纯的问题、两难问题、和棘手的问题。


    咱们先看看未成年人的“容易”，为什么容易。


    ### 1.单纯问题


    你工作以后，有时候想象一天到晚面对的这些事儿，可能会感慨，还是当学生那时候简单啊。其实你想说的是“单纯”。学生日常解决的问题并不简单，需要掌握各种冷门的知识和抛弯拐角的解题技巧。很多人...但是是学生的問題很单纯。


    所谓单纯的问题，就是有明确的方向，有能让人放心的答案，解决了就可以宣布胜利的问题。


    比如你想考清华大学，这就是一个单纯的问题。它有明确的方向：你需要提高——而不是降低——自己的考试水平。它有让人放心的答案：考上就可以宣布胜利。


    单纯的问题就像参加爬山比赛一样，你只要向着一个方向努力就行，而你的成败与否是清晰可见的。面对单纯的问题你绝对不会感到迷茫，你永远都知道该干什么。往那个方向前进就是对，往别的方向走就是错。


    这种感觉非常励志。你只要“努力！奋斗！”就行。我们看那些高三的学生们，每天早上一起跑步一边喊口号，“拼，直到赢！搏，直到成！”真的是让人热血沸腾。


    当然在这条路上你会遇到阻力。可能是你自己的性格弱点，可能是外界的干扰，甚至可能是敌人攻击你。但是不要紧！你要做的就是战胜它们。你完全知道什么是你的助力什么是你的阻力，谁是你的朋友谁是你的敌人。


    有时候一大群人会共同面对一个单纯的问题。比如我们要修建一项农田水利工程。我们会分工，但是所有人都是为了共同的目标而走到一起来的，我们“心往一处想劲往一处使”。工程师攻关技术，领导组织管理，剩下的人撸起袖子加油干。这时候团结就是力量，谁要是说怪话瓦解我们的斗志，我们就要帮助他。要是有敌人敢阻止我们前进，我们就要打击他。


    如果生活中都是单纯的问题，我们的思想也会是单纯的，这种状态多好呢……


    我认为，这个世界最大的危险之一，就是某些人认为一切问题都是单纯问题。


    ### 2.两难问题


    等你变成成年人就会发现，很多事儿并不是“向着一个方向猛用力”的事儿。


    比如你手里有一点积蓄，想要买个房子，你有两个选择。离工作单位近的这个房子比较贵，也比较小，住着不太舒服但是省时间，而且将来也许会升值；远一点的房子比较大，将来有孩子会很方便，但是上下班很累。那你买哪个呢？又或者先租个房子，等等等再说？


    这才是成年人的世界。这种问题我们可以称之为“两难问题”。这个问题没有唯一正确的方向，这是两难的选择，你必须在两个方向之中做出“取舍”。


    其实生活中真正的问题，至少都是两难问题。有明确方向的事儿根本就不叫事儿。如果现在有一处房子，地点又好价格又便宜住着又舒服升值潜力还大，别人早就买走了——均衡的市场就不允许出现这样的房子。


    同样道理，如果有挣钱多干少还特别能提升个人潜能的工作，你早就选了，所以根本就不存在那样的选项。你通常面对的都是钱少但是安逸，或者钱多但是不稳定这样的职业选项。


    这种问题里没有敌人。你谁也怪不着，连自己都怪不着……所以你会很迷茫。这才是你怀念学生时代的时刻。你会羡慕那些有敌人的人。


    所以什么叫“不当家不知柴米贵”呢？我理解就是不得不做取舍的意思。单纯就想买一件东西，其实都是不贵的，只要一门心思攒钱就行。真正的问题在于买了这个东西你就不能买那个东西——这种必须取舍的感觉会让你觉得它们都很贵，要不然干脆都买了多好。


    不过你终将做出选择。你权衡各种利弊，选了一个认为最适合自己的。但是你不会有一种取得胜利的感觉——你没有战胜任何东西，你是不得已才如此。过段时间你可能会想，如果我当初选的是另一个，现在会怎么样呢？不过那都是一闪念而已，选了就选了，成年人得为自己的决定负责。问题，还是解决了，以后要往前看，这一
    篇已经翻过去了。


    不过两难还不是最难的。最难的，是你要给别人做主的时候。


    ### 3.棘手问题


    1973年，加州大学伯克利分校的两个公共政策专家，霍斯特·里特尔（Horst W.J. Rittel）和梅尔文·韦伯（Melvin M. Webber），提出一个新概念
    [1]，叫“wicked problem”。Wicked 这个词的意思是形容那些邪恶的、诡异的东西，我们尊重多数人的意见，称之为“棘手问题”，但有时俺翻称做“抗解问题”。


    那些长期存在的公共问题，通常是棘手问题。两难的问题还可以说有解，棘手的问题是无解的。


    比如现在美国的贫富差距越来越大，虽然经济在增长高科技公司在盈利，但是低技术的老百姓分享不到这个成果，导致很大的社会和政治问题，这就是一个棘手问题。全球变暖——如果你相信气候学家的说法——也是一个棘手问题。这些问题比你买房子的事儿可难多了。


    什么叫棘手问题呢？里特尔和韦伯提出，如果一个问题具备下面这十个特征中的几个，就是棘手问题——


    - 1. 这个问题没有清晰的定义。它不像高考数学题那样给你写好了条件让你证明。

    - 2. 它没有终极的答案。你永远都别想彻底解决它，它会一直存在。

    - 3. 你的解决方法不分对和错，只有好和坏，而什么是好什么是坏，只能你自己判断。

    - 4. 你采取一个什么应对措施，不会立即看到结果。你也许根本不知道你做得有没有用，也许还出现了意想不到的结果。

    - 5. 没有专门给你试错练习的地方，你的每一个动作都会有影响，你一上来就是实操。

    - 6. 适有什么进程，都不清楚。

    - 7. 没有先例可循。前人的经验不会对你有太多帮助。

    - 8. 这个问题很可能只是一个更深的问题的症状，但是它背后不只有一个问题，很可能根本就没有根本性根源。

    - 9. 有很多利益相关方对这个问题有自己的看法，他们想要的解决方案各自不一样。

    - 10. 如果你上手，那么将来不论是什么结果，你都得负责。


    咱们就想想美国贫富差距增大这个问题，如果你是特朗普，请问你怎么办？对高科技公司多收税，然后补贴穷人吗？富人会不乐意，再说直接发福利不是办法，会养懒人。反而全球化，强烈要求制造产业回流吗？那不ai符合技术演变的大趋势，也违背了自由主义的精神。那就干脆不管行吗？有人会掀革命。赵本山说，“……就这个问题，你先糍谁都不好使。”


    特朗普多么希望这是一个单纯的问题，多么希望能找到一个敌人啊……所以中国就是这个敌人。


    再比如全球变暖，就是典型的利益相关方的意见不一致。都说要节能减排，你发达国家现在不搞工业了可以减排，我中国全靠工业挣钱呢，我能减排吗？这公平吗？更何况，全球变暖对某些国家来说也许还是个好事儿，反正现在中国很多传统沙漠地区反而矿得到了。


    漠地区的气候都变湿润了。


    所以当一个什么瑞典女中学生指责世界各国政府对全球变暖的应对不力的時候，当围观群众笑话特朗普的时候，那些人其实都有点站着说话不腰疼。


    不是我们不够努力，也不是敌人太坏，而是这个问题本身太棘手。


    那怎么解决棘手问题呢？首先你就不应该指望*解决*棘手问题，你最多只能*应对*——你可能得做好跟它长期相处的准备。这就好像王立铭老师在得到《重病之王的解决方案》这个课程里说的那样，全部杀死癌细胞是不太可能的，但是控制还是可以追求的。我们应该追求*管理*这个问题。


    匹兹堡大学的约翰·卡米勒斯（John C. Camillus）教授，曾经提出过几个应对棘手问题的建议 [2]。


    一个建议是让利益相关的各方充分互相理解。最好大家坐下来开诚布公地把观点和要求谈透——不为达成共识，只为互相理解。这样我们最起码可以消除一些偏见，别都只顾自己，也听听别人想要的，也许就能采取一些最基本的行为。


    如果你是一个公司的领导人的话，卡米勒斯的一个建议是举棋不定的时候应该反思一下公司的认同感和意义——没错，又是“意义”。意义能帮助我们做出选择。我们到底是一家什么公司？我们的价值观是什么？我们擅长什么？我们渴望什么？有时候你这么做不是因为会计算——因为计算已经给不了你答案——而是因为有个性。


    还有一个建议是一定要行动。可以摸着石头过河，每次的决策都是小行动，慢慢试探，看看效果再决定下一步，但是不能不动。动，才叫应对；不动，你就是鸵鸟。


    你就这么应对着，跟着它演化。也许一段时间之后，它就被别的问题取代了。


    不过卡米勒斯教授作为一个学者也只能纸上谈兵，而我就更没有行动经验了。但我想说的是，这里有个认知问题。


    我发现有太多的人，包括很多领导者，都是单纯问题的思维模式。如果他对当前局面不满意，他就认为要么就是我们不够拼，要么是敌人太坏了。


    其实真不是。大家都是成年人，难道会有谁明知道这么做一定对而不这么做吗？难道那么简单的道理别人不懂吗？都是不得已的取舍而已。有敌人问题都是最好的问题，把敌人干掉不就完了吗？大多数情况真不是敌人的事儿。


    单纯的人还总希望能一劳永逸地解决一个问题。这种理想主义者一旦受挫，又会心灰意冷，成了一个愤世嫉俗的人。他以为别人都自私就他真想解决问题，可是他又解决不了。


    殊不知，那些顶着骂名，从来没做过一件快意事，小心翼翼永远不敢用力过猛，明知根本就没有胜利的彼岸等着他，还在那呕哑呕哑地维持着局面的人，才是真正值得尊敬的。


    参考文献

    [1] Horst W. J. Rittel and Melvin M. Webber, Dilemmas in a General Theory of Planning,
    Policy Sciences Vol. 4, No. 2 (Jun., 1973), pp. 155-169.

    [2] John C. Camillus, Strategy as a Wicked Problem, Harvard Business Review, May
    2008.


