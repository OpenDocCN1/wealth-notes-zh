    \ https://www.cds.caltech.edu/~murray/wiki/index.php/What_is_fuzzy_logic?\n[3]\
    \ 我不得不再找一个例子，它看起来不那么直观，但是有足够多的图。来自 https://www.doc.ic.ac.uk/~nd/surprise_96/journal/vol4/sbaa/report.fuzrules.html\n\
    [4] 参考我们专栏前面的文章《学习一个“深度学习”算法》 amerik\n[5] 知乎：模糊数学理论的争议？ https://www.zhihu.com/question/34898054\
    \ 另外，最近我们专栏谈范明晓了一个问题，说我们对人的头发的“多”、“少”这种形容词应该怎么进行数学定义，“如果我们说5000根是少，那么5001根就不算少吗？”这一讲模糊逻辑，就回答了这个问题。\n\
