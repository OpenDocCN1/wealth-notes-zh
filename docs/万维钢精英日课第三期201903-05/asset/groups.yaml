    M87 中心这个黑洞的质量到底是多少。以非

    前根据周围情况，天文学家的判断是质量

    在35亿到72亿个太阳之间，现在这张照片

    说明质量是65亿个太阳。不过这个新知识

    是关于这个具体黑洞的知识，不是新物理

    知识。


    那是不是说，这个发现对理论物理学家来说没什么太大意义。


    一 的确如此。广义相对论已经被多次验证，无需再次证明。对于黑洞，理论物理学家最关心的是广义相对论和量子力学结合起来，会在黑洞上表现出什么样的效果。比如说，有物理学家认为考虑到量子力学，黑洞的“事件视界”就不是平淡地过度了，而是一面“火墙”……但是要想证明这些猜想需要极其精确的观测，现在这个是肯定行不行的……也许永远都不可能。


    那“霍金辐射”呢？霍金不是说“黑洞不是这么黑的”，它会慢慢向外辐射粒子和能量吗？这个也观测不到吗？


    一 观测不到。除非你把一个探测器放到黑洞边上测量，可是所有黑洞都距离我们太远了。我们大概永远都不可能实地考察一个黑洞。


    那这么说的话，现在我们对黑洞的了解应该算是很多，还是很少呢？


    一 还不够多。比如说，像这次照片里这样的超大质量黑洞，它到底是如何形成的？是在早期宇宙就形成了，还是后来慢慢吸收周围的恒星才变得这么大？它怎么会这么大呢？还有黑洞的内部到底是什么样的？这些我们都不知道。甚至就连
    M87 这个黑洞向外喷射的那个喷流的形成原理，现在也没完全搞清楚。所以有这个观测手段实在是太重要了。


    最后一个问题。爱因斯坦会为这个发现感到激动吗？


