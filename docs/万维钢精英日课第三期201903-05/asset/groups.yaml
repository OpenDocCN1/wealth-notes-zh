    # 创作者的悖论


    万维钢·精英日课³

    今天


    进入课程 ›


    创作者的悖论


    前一阵电影《流浪地球》特别火爆，最近电视剧《权力的游戏》再一次引发了热议，不知道这些场面是否让你有所动，也想成为像刘慈欣和乔治·R·R·马丁那样的作家。


    写小说不是我的专长，但是我想跟你说说“创作”的事儿。我没写过小说，可是我知道好小说有多难写。搞创作有诸多方法、技术、知识和套路，那些“术”你以后可以慢慢学——这一讲，咱俩专门说说的“道”。


    咱俩先假想，有一天，你终于成为了一个成功的小说家。请问在下面两个对未来的你的描述之中，最能激励现在的你的是哪一个。


    ## 第一个描述——


    他写小说是半路出家。最初是一边工作一边写作，每天都很辛苦，但是他咬牙坚持下来了。他的家人给了他坚定的支持。他的第一部作品并不成功，但是他没有气馁。他潜心研究了刘慈欣、J.K.罗琳和乔治·R·R·马丁的写法，他把西方流行文学的技巧和中国元素巧妙结合在一起，终于得到了读者的认可。他的第二部作品得了雨果奖。他的第三部作品登上了畅销书排行榜，刚刚被优酷和
    Netflix 买走了改编权。粉丝们正在翘首以待他传说中的第四部作品。


    ## 第二个描述——


    他出手之前，中国的流行文化是家庭伦理剧、宫斗、权斗、霸道总裁、流量鲜肉和对西方科幻、奇幻小说的拙劣模仿。他开创了一个新的小说类型和自己的幻想宇宙。他笔下有很多人我们所未见过的人物形象，他行文风格独树一帜，连他贬贬的价值观都令人感到惊奇。


    如果第一个描述更能激励你，我很抱歉，你不适合从事创作工作。我建议你选个靠谱点的职业，好好挣钱养家，把孩子教育好。如果你喜欢小说，你可以作为读者享受小说。也许你的子孙后代中会有人有创作资质，而你的任务是保留他出现的可能性，给他做一点物质条件之类的准备。


    你要说人人都能发财，我完全赞同。但是有人说人人都能当作家，我完全不同意。这个世界不需要写作目标是取得第一个描述里那些成就的作家。


    以前有一种土味儿的民间故事，说某人从小家里穷得很受人欺负，还跟县里的财主有夺妻之恨，于是他头悬梁锥刺股发奋读书，终于考上状元当了大官，不但报了仇还娶了当朝宰相的女儿……如果这种故事能激励你，我求求你千万别当大官。我们中国不需要这样的大官……我估计宰相也不会需要这样的女婿。


    历史上真正当官当出水平的那个人，都不是为了娶宰相女儿，也不是为了给父母争气去当官的。他当官是要施展自己的理念。


    创作的最大回报，就是施展了自己的理念。


    前面第一种描述中的那些成就，叫做“外部激励”，是别人对你的认可。第二种描述说的，则是“内部激励”，是你自己对自己的内在要求。外部激励对很多简单、普通的工作非常有效，但是搞创作，不是简单工作。


    最近出了两本讲创作之“道”的新书，一本叫《唯一的观众》[1]，一本叫《热爱的悖论》[2]，这两本书都认为，你要真想搞好创作，就必须依赖内部驱动。


    为什么外部激励不行呢？从需求侧的角度来说，搞创作，并不是一个向着一个方向拼命使劲就能成功的项目。创作是个悖论。


    这个悖论是，你要是地迎合市场，你反而得不到市场；你要是不管别人怎么评价、就做自己，反而可能引领市场。


    请允许我打一个粗俗的比喻，这就如同现在流行的说法叫“舔狗”和“女神”。舔狗卑躬屈膝连人格都不要了去追求女神，可是女神根本都不正眼看他，最多也就拿他当个备胎。而女神那个又爱又恨的男友，可是一直都保持了尊严。


    让人又爱又恨的乔治·R·R·马丁，是舔狗还是男友。


    这个道理是喜好 = 熟悉 + 意外，女神要的不仅仅是暖男，你还得能给 surprise 才行。外部激励能让你在“熟悉”这个项目上把一切都做“对”，但是提供不了意外——因为当你为了别人给的荣誉而把一切都做对的时候，你就已经丧失了个人荣誉感。


    刘慈欣写科幻小说的年代，中国的排行榜上并没科幻小说。乔治·R·R·马丁之前的 主流奇幻小说都是 PG-13 的，从来没有过动不动就把握主要角色残忍地弄死这种写法。J.K.罗琳并不是做了一堆市场调研之后构思的哈利波特。你们爱看不看，他们想写就写。


    而供给侧的角度来说，外部驱动会让你陷入疲于奔命的状态。当我们赢得某种奖励的时候，我们的大脑会释放多巴胺，这能给我们带来快乐的感觉。但是这个感觉有两个不好的地方。


    一个是它非常短暂。每次胜利带来的幸福感都是暂时的，你很快就会渴望下一次胜利，你永远都别想“从此过上了幸福的生活”。


    另一个是，你会想要不断加大剂量。没钱的时候觉得百万富翁就挺好，真成了百万富翁你又会羡慕千万富翁……享受多巴胺刺激的阈值会越来越高，你永远都不会满足。


    这两个效应跟吸毒好像没啥区别。我们专栏以前讲过罗伯特·赖特的《为什么佛教是真的》那本书，我们知道这其实是演化给我们的设定，目的是激励我们永远这么奋斗下去。这个不满，其实就是“苦”，就是
    dukkha。


    永远这么奋斗下去是真苦啊。你会过度工作，你会抱怨工作和生活的 不平衡，你会身心俱疲。


    更大的烦恼在于，你这么努力奋斗，而奋斗的结果却是你不可控的。有些作家其实根本就不会写小说，可他的书竟然就火了。你兢兢业业扎扎实实写了一部得意之作，居然无人问津。然后转眼一看那个作家又出了一个小说，更火了。


    其实谁也不知道女神到底是怎么想的。失败会让你强迫自己更努力地工作，然后你会非常害怕下一次失败。《热爱的悖论》这本书考证所谓“热爱（passion）”，这个词在西方世界最早的意思，就是这种不正当的、自找苦吃的爱。


    把创作单纯当做兴趣爱好其实也不行。爱好的问题在于它很脆弱。第一次打牌赢了的人可能会继续打牌，那要是输了呢？


    创作事业对你真正的考验在于，如果作品失败了，你怎么办。只有爱好、用玩票心态创作的人，会在失败的时候容易放弃。而轻易放弃的人做不成任何大事。


    你必须有锲而不舍坚持下去。你还有充分的耐心，花大量时间去做一些非常繁琐、看上去连一点都不好玩的事情。


    那这个创作之“道”，到底是什么样的态度呢？


    《唯一的观众》这本书的建议是，你创作，应该是为了满足自己——这个唯一的观众。不要问别人喜不喜欢，应该问自己喜不喜欢。


    创作，最大的回报，是你有一个设想，然后你亲手把这个设想给实现了。


    我听说，J.K.罗琳当初写《哈利·波特》的缘起是这样的。罗琳本来不是小说家，她写过一些政论之类的文章，并不成功。有 天她坐火车的时候，突然想到了一个男孩在魔法学校的故事，就好像被闪电击中一样，那个故事奔涌着在她大脑里显现出来。罗琳意识到她必须把这个故事写出来，下了火车就赶紧找地方记录想法。剩下的就都是技术问题了。


    《哈利·波特》第一部出来被拒稿十几次，我想罗琳没有多少在意。她想写，就写出来，自己满意就行。


    追求这个回报，结果就是你完全可控的。


    而创作的悖论是你不在乎市场，市场反而更有可能反应好。如果市场反应好，那对你来说最大的好处是，你可以继续从事创作。


    《热爱的悖论》则进一步用我以 fify 前说过的那个古希腊的词，“Eudaimonia”，来


    的那个古希腊的词，“Eudaimonia”，来说明创作者应该追求什么。Eudaimonia，特指一种特殊的幸福：是通过从事某一种有意义的活动，把自己的全部潜能都发挥出来。这可以说是终极的自我实现。


    也许你身上真有某种创作天赋。带着这个天赋默默死去，那是很遗憾的事情；能把这个天赋充分发挥出来，那就很幸福。


    我认为这个所谓充分发挥，应该包括给世界打上你的印记。你觉得世界只有现在这些作品还不够，还缺你的那一类，然后你真的把它创作出来了。


    发挥永无止境，所以你不论成败都要持续地完善自己。这样你追求的不是外部给的结果，而是自我完善的过程。就算别人都不知道，只要你自己能感受到自己在完善，在变成更好的人，你也会感到充实。


    而到底是不是正在完善，只有你说了算。这样创作对你来说就非常可控，你就不会陷入 dukkha。


    所以我们真正应该羡慕刘慈欣的不是他的作品卖了多少钱，而是他发明了“黑暗森林法则”、“降维打击”这些东西。我认为这两个思想、包括《流浪地球》的全部设定，都是错的，但是刘慈欣发挥出来了，我不服不行。


    只有内部驱动的创作才值得赞美。你应该把创作本身当做目的，而不是当做取得别人奖励的手段。你说你考了状元得多少奖出多少书，你妈妈肯定很自豪，我们真不在乎。公共的注意力不是给你过小日子用的。


    可如果你有一个个性发挥，给世界提供一个新鲜的视野，我们会作为粉丝给你摇旗呐喊。


    在真实世界里想要做点事，我们总是面对这样的悖论。


    你越告诉自己要自然要无为，就越不像无为；你忘了自己，反而实现了无为。你越刻意追求心流，就越进不了心流；你专注于工作本身忘了什么心流不心流，恰恰就是心流状态。你要把爱马仕包包当做身份象征，爱马仕就担心你拉低他家的品牌形象；你对爱马仕不屑一顾，爱马仕就希望你背他家的包。


    如果不是这样，世界岂不是太简单太直白太乏味了吗？


    丧失人格不会追到女神，以我为主的个性发挥才是创作的源泉。


