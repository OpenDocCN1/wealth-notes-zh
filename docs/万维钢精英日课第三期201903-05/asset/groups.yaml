    # 博弈论11：真正的“诡道”是随机性


    万维钢 · 精英白课3


    今天


    进入课程 >


    博弈论11:真正的“诡道”是。


    我们说《三十六计》很不靠谱，有读者就问我，那《孙子兵法》如何呢？《孙子兵法》确实是一本实在在的用兵战略总结。但《孙子兵法》并不神秘，它的思想，比如像“知己知彼”、“国之大事”、“多算胜，少算不胜”、“君命有所不受”，在今天已经是常识性的东西。《孙子兵法》中包含了一些朴素的博弈思想，比如说“围师必阙”，就是我们前面说过的增加敌人选项。


    那为什么说它是朴素的呢？因为现代博弈论比《孙子兵法》要高级得多。


    我给你举个例子。《孙子兵法》里有一句叫“兵者，诡道也。故能而示之不能，用而示之不用……”，你看这句话有没有什么问题？


    这句话的意思很简单，就是说不能让敌人知道你的战术意图，你要迷惑对手。这个道理固然没错，但迷惑对手，就得是说反话吗？


    # 1.诡道的悖论


    我上中学的时候喜欢踢足球，我是一个守门员。我的技术不怎么样，但是我知道一些理论。我知道罚点球的时候，球到达球门只需要不到0.3秒，守门员不可能在这么短的时间内反应过来，所以只能事先踏一个方向。点球，是守门员和射手之间的博弈。我还听说，守门员可以通过射手的眼神来判断他射门的方向。


    有一次踢球，我们队被罚了点球。罚球的那个个人长什么样、这个球最后踢向了哪里、有没有罚进，现在我都忘了，但是我清楚地记得他的眼神。他的眼睛不停地瞪我右侧的方向。按理说他是想朝右侧踢，可是我突然多想了一步。


    我知道守门员应该看眼神来判断方向，那他是不是也知道？他会不会是故意往右边看，其实上是想往左边踢呢？


    又或者说，他会不会也想到了我能想到他的诡计，然后给我来个将计就计，还是会往右边踢呢？


    # 2.混合策略


    我们前面讲的各种博弈，你最终总是选择确定的 Ивана。这个我们后面再说。


    # 3.真随机的好处


    那你说这要求也太高了，难道踢点球之前还要做个计算不成？是的。如果你要罚的这些点球都价值连城，计算就是值得的。'
