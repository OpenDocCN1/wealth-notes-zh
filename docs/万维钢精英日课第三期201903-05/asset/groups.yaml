    今天有个好消息，我的新书《你有你的计划，世界另有计划》马上就要办公室首发了！咱们专栏读者当然要享受特权优惠，在正式发售之前，你可以点击文稿里的图片，超前以9折拿下这本书。

    今天就把这本书的序言更新到这里，题目叫《欢迎来到真实世界》。


    # 欢迎来到真实世界


    王先生每月到手工资有一万多元，这个收入水平在他所在的城市也不错，但显然也不算特别高，王先生想要更多。王先生对未来很有好的规划，他认为靠工资收入是发不了财的，他必须投资。

    王先生想要的东西，叫做“复利”——也就是说用钱生钱，而且用钱生出来的钱还能再生钱。王先生知道，如果每年能有哪怕10%的利息，利滚利之下，仅仅需要七年，一笔投资就能翻番。王先生并不指望像买彩票一样的一夜暴富，但10%的要求难道还高吗？他精心选择了几个投资产品。

    为了未来的幸福生活，王先生总是省吃俭用。每当要花钱的时候王先生就想，今天的一块钱就是七年后的两块钱，这哪里是钱，分明是种子！我能吃种子吗？

    王先生耐心地等待时间的回报。


    三十五岁这年，李女士下定了决心。她再也忍受不了领导的颐指气使，她不愿被别人指挥，她有一个企业家的梦想。李女士认为再不创业就赶不上这波大潮了，她毅然辞职。

    李女士早就做好了准备。她上过好几次创业课，完全知道创业公司是怎么运行的。她写了一份完美的商业计划书，她找到了几个志同道合的合作伙伴，她甚至已经说服了一位投资人。

    作为前期的投入，李女士已经卖掉了自己的房子。人人都说她这是一个冒险的决定，可是创业哪有不冒险的？

    明天，公司将正式开张。李女士就像一头狮子，做好了战斗的准备。


    赵总环视会场，心中有一点悲壮感。公司业绩持续下降，他刚刚临危受命成为新的CEO，今天是第一次主持会议。赵总让中层干部谈谈想法，可是谁也没说出什么有价值的思路。

    那我就来说吧。赵总拿出自己制定的一份公司管理改革方案，他告诉大家改革的必要性和紧迫性，然后逐条宣读——

    第一，公司从即日起实行准军事化管理，不分职位高低一律不许迟到早退，要有铁的纪律，下级必须服从上级。

    第二，对经理人员实行量化目标考核制，完不成目标的一律降级、甚至开除。

    第三，……

    赵总注意到了会场中的不满情绪，但是他知道乱世必须用重典。他决不允许公司倒在自己的手上，啊落个骂名也在所不惜。“我只要结果！”赵总壮怀激烈地说。


    我们每个人都生活在自己给自己讲的故事里。所有好故事里都有个英雄，有个经历奋斗战胜敌人的主题，中间会有一些冲突，但总会有个完美结局。王先生放弃短期的享乐，应该得到长期的好处。敢想敢干的李女士应该是当代青年创业者的榜样。力排众议、使出雷霆手段的赵总，更应该成就力挽狂澜的伟业。

    他们付出了努力和牺牲，所以他们应该收获很好的回报。这样的结局才是公平的，对吧？


    # 真实世界不是故事。


    # 真实世界没有主角。


    这个世界不是为了你，甚至也不是为了人类的幸福而存在的。世界不在乎你的命运，而且没有义务让你理解。


    # 真实世界没有主题。


    主流和非主流，好人和坏人，好的主义和坏的主义，这些划分常常站不住脚。从不同的视角看同一件事，你往往会有不同的看法。


    # 真实世界没有完美结局。


    如果你对世界上的事儿了解得多，你会发现，更可能的结果是王先生投资赔了钱，李女士创业失败，赵总拆腾一番被炒辞退地赶下台。

    你有你的计划，世界另有计划。


    这本书出自我在“得到”APP的专栏，《精英日课》。我们的读者是愿意审视自己的思想的人，是社会的中流砥柱，是人群中的精英。你不是来听故事的，你想了解真实世界。有关真实世界的知识有时能把人从故事里解救出来。'
