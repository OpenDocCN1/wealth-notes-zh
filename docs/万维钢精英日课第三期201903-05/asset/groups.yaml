    ## 《生命视角》8：演化的教训（完）


    万维钢·精英日课³

    今天


    进入课程 >


    《生命视角》8：演化的教训。


    今天我们把戴维·威尔逊的《生命视角》这本书讲完。演化思维不仅仅是一个理论，威尔逊认为它还是一个世界观。理论能告诉你这个世界是什么样的，而世界观能告诉你应该怎么大。所以我们这一讲的重点是怎么使用演化思维，特别是怎么在高观点下使用演化思维。


    威尔逊这本书讲的演化思维，跟一般教科书里说的进化论不太一样——他说的是一个更高级的版本。而在我看来，恰恰是这些前卫之处，才是我们用好演化思维的关键。


    咱先回顾一下中学课本是怎么讲进化论的。


    一切都是基因。演化由基因突变导致，基因突变完全是随机的。一个突变本身无所谓好坏，不适应环境的突变就是坏的，而这种情况很常见。

    基因随机突变，环境自然选择，这就是进化论。生物在各个方向博弈，大自然以万物为刍狗。什么“物竞天择适者生存”，什么“社会达尔文主义”，都是源自这个简单版本的进化论。


    ### 第一个关键思想是群体演化。


    生物个体之间不仅仅是互相竞争的关系，甚至都不一定以竞争关系为主——群体演化要求个体之间要合作。哪个群体内部有良好的合作，哪个群体作为一个整体就有更大的发展，哪个群体的基因就能更广泛地流传。


    合作，要求群体内部有某种协调，至少要能够压制像癌细胞那样的个体。人类的协调方法就有社会规范、公共道德，和个人与生俱来的羞耻感能力。


    我们现在知道，人首先是小群体的成员。那好的小群体是什么样的呢？


    第一，要有群体认同感。整个群体应该要有个共同的目标，比如为了可持续的美……这也就是所谓“意义”。

    第二，群体成员应该按比例共同承担利益和花费，不能让谁占便宜、谁吃亏。

    第三，每个人对群体决策都有发言权。

    第四，得有一定的监督。

    第五，渐进式的惩罚措施。

    第六，发生冲突应该公平、快速地解决，不要让矛盾生长。

    第七，群体应该有一定的自治权。

    第八，以上说的这些原则可以应用在各种尺度上。


    ### 威尔逊这本书第二个关键思想是文化和基因共同演化。


    一方面是表现基因的遗传。比如在物质匮乏环境中成长的孩子会有特定的行为模式，而这种模式是可以透过基因表达遗传的。但恰因决定行为的不仅仅是基因，个体就可以主动适应环境，而不被基因枷锁所限制。


    文化与基因共同演化……文化，能影响对基因的突变的选择。

    那么这就引出了一个非常激进的概念，叫做“有意识的演化（conscious evolution）”。它的意思是说我们可以有意识地选择自己的演化方向。


    演化思维认为首先得有多样性才有创新。五花八门各色人等聚集在一起，让想法碰撞连接，才有创新。硅谷和以色列做到了这一点。


    有两位懂得演化思维的学者，把演化思维和对创新中心的考察结合起来，出了三本……《雨林：建设下一个硅谷的秘密》[1]。他们总结了创新中心该有的七个特点，值得你了解——

    第一，是打破规则、敢于梦想。这个地方得比较自由，能吸引不愿意墨守成规的人。

    第二，要开放，要互相听取意见，要合作。


    作。


    第三，要有互信的精神。创新者得能信任别人同时还能被人信任。在硅谷，如果一个个人有损人利己的行为，不用法律惩罚，他在硅谷这个圈里就混不下去了。


    第四，要鼓励实验和迭代。创新过程就是突变和选择。


    第五，要公平。创新园区里的一个公司不应该谋求对其他公司的什么压倒性的优势，得公平竞争。


    第六，允许犯错误，允许失败，还要有韧性，失败了还能再起来。对失败友好的地方，创办新公司才容易，创新才可能。


    第七，为了鼓励别人到你这儿来冒险，你可以预先给一笔投资，然后别太在意回报。


    威尔逊说，人的本性很乐意加入一个互信的小群体，这有利于合作；但是人的本性是不信任自己所在群体之外的人，同时还害怕风险，而这是不利于创新的。


    那由此说来，主动的创新不太符合人的本性。这大概就是为什么创新中心那么少，而这七条经验那么重要。


    演化思维到这里就算给你讲完了。如果你是一个领导，今天的内容也许能让你有所警醒。演化思维带给我们三个教训。


    ### 第一个教训是群体演化会在各个层次上发生，我们追求整个地球上所有的生命一起协调发展，要避免那些低层次的恶性竞争。


    ### 第二个教训是演化给我们提供了学习和进步的方法——突变＋选择——而不是靠中央计划。


    ### 第三个教训是演化要逐步进行，不能操之过急，成长可能有窗口期。罗胖爱说的一个词叫“日拱一卒”，每次改变一点点，慢慢地改革。


    那我们对比一下，现在有的领导认为自己完全知道这个事业该怎么做，要求所有人按照他的蓝图行动，把人当工具用，凡是遇到挫折就怪别人没有尽心尽力，这是不是违背了演化思维呢？


    当然，也许前面说的所有这些你都用不上。但演化思维至少给我们提供了一个不一样的视角。


    以前我读过一本讲政治学的教科书，是迈克尔·罗斯金（Michael G. Roskin）的《政治科学》。罗斯金在那本书里有句话特别有意思——


    > “政治家和政治科学家这两种职业之间的关系与细菌和细菌学家之间的关系大致相当。”


    演化思维就给了我们这么一个跳出三界外的宏大视角。你现在再看那些大人物和小人物的成败，那些创新公司和传统公司的兴亡，是不是就像看蚂蚁、蜜蜂和大肠杆菌一样……我觉得这是一个奇特的趣味。


    （THE END）


    注释


    [1] Victor W. Hwang and Greg Horowitt, The Rainforest: The Secret to Building
    the Next Silicon Valley, 2012.


