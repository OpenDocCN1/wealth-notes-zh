  mdcn: "\n# 《生命视角》4：你来自传承（上）\n\n万维钢·精英日课³\n今天\n\n进入课程 ›\n\n《生命视角》4: 你来自传承。\n\n今天我们继续讲戴维·威尔逊的《生命视角》这本书。这本书的思维密集度非常高，我们不得不把节奏稍微放慢一点。\n\
    \n有很多特别宏大的、基本的问题，历史上各种思想家、哲学家、文人墨客思考过、困惑过，你要是是用演化思维一看，会发现答案无比清晰。\n\n真正的读书人，得敢于思考大问题。演化思维能满足你对宏大事儿的所有幻想。\n\
    \n这一讲咱们继续于大事。我们把人们经常思考的几个重大话题放在一起，用演化思维给大家一个终极解释。这些问题表面上看起来，似乎是不同领域的东西——\n\n-\
    \ 人的各种特性中，哪些是天生的，哪些是后天形成的？\n- 学习的原理是什么？\n- 社会传统价值观现在哪里？\n- 我们常说人生要有意义，比如公司都得给员工提供意义，那这个“意义”，到底有什么意义？\n\
    - 人生应该怎样摆脱枷锁，获得自由？\n\n所有这一切都可以用演化思维的两个概念来解释。\n\n第一个概念叫“先天性的（innate）”。这是你继承来的东西，包括与生俱来的基因编码和世代传承的文化模因。先天性的东西是不自由的，很多表现为潜意识的行为。你可能每天都在这么做，但是不自知。\n\
    \n另一个概念叫“适应性的（adaptive）”。“适应”是进化论的常用词汇，但在这里我们特指那些在基因编码和文化传递之外，你后天主动适应当前新环境的行为。适应性的东西，是你可以自我改变的。\n\
    \n把这两个概念想明白了，你就能想明白前面说的那些大问题。\n\n你可能会感到非常意外，我们的很多行为，其实都是先天决定的。\n\n有一种青蛙叫太平洋树蛙。生物学家发现，太平洋树蛙的蝌蚪，会针对三种不同的生存环境，做出三种不同的反应。\n\
    \n有的蝌蚪从出生到长大都生活在和平的环境中，水里没有任何捕食者。这些蝌蚪们整天就自由自在地游泳。\n\n第二种环境是水有鱼类捕食者。在这种环境里出生的蝌蚪，它们整天的行为模式就是尽可能地不动，避免被鱼发现；但是一旦感觉危险临近，这些蝌蚪会以爆炸的速度逃跑。\n\
    \n第三种环境，是水中主要的捕食者是昆虫，专门叮咬蝌蚪。这种蝌蚪平时也是尽可能不动，但是是感到危险的时候，它们的选择是掉头，把尾巴留给昆虫叮咬——因为尾巴不怕咬——以此保护自己其他器官。\n\
    \n那你说太平洋树蛙蝌蚪的这三种行为，是天生就会的呢？还是出生以后在环境中，通过跟鱼和昆虫的较量，自己学会的呢？\n\n答案是天生就会。研究者做了一个特别有说服力，而且特别直观的实验。这个实验能证明，真正决定蝌蚪行为的，并不是鱼和昆虫的存在本身——而是鱼和昆虫带来的、水里的不同化学物质。\n\
    \n研究者人为地制造了一种水，水里含有鱼释放的化学物质——差不多就相当于鱼的气味吧——但是并没有鱼，然后让一些蝌蚪在这个水里成长。同时还制造了含有昆虫气味、但是并没有昆虫的水，也让一部分蝌蚪在里面成长。\n\
    \n好，现在把这两组蝌蚪放进真有鱼的环境里，那你说它们会怎么表现呢？结果是鱼水里长大的蝌蚪面对鱼这种捕食者的存活率，大大高于昆虫水里长大的蝌蚪。这就说明，鱼水里长大的蝌蚪，天生就知道怎么对付鱼！\n\
    \n同样地，把两组蝌蚪放进真有昆虫的环境里，就是昆虫水里长大的蝌蚪存活率更高。\n\n看似是两种不同的蝌蚪，其实它们的遗传基因是完全一样的。研究者只是用不同的化学物质，开启了它们不同的行为模式而已——而三种行为模式，其实都是基因里写好了的。\n\
    \n我给你用编程语言打个比方。蝌蚪这个行为基因，就好像我们编程用的“如果……则……”语句一样——\n\n```\n如果 (水中有鱼的气味) 则\n    平时不动，危险时快跑；\n\
    否则如果 (水中昆虫的气味) 则\n    平时不动，危险时掉头；\n否则\n    自由游泳；\n```\n\n注意这段代码是在蝌蚪出生的时候执行的，而且只执行了这么一次。出生时的化学环境决定了蝌蚪整个幼年到青春期的行为模式。\n\
    \n好消息是它们不需要学习。坏消息是它们不能根据出生以后的环境改变，去随时改变自己的行为模式。\n\n看似是不同的行为，其实是同一个编码。蝌蚪，生活在基因编码的枷锁之中。\n\
    \n太平洋树蛙蝌蚪的行为模式由出生时水里的化学物质决定，而很多鸟类的行为模式，则是由妈妈留在鸟蛋里的荷尔蒙决定。\n\n生活在艰苦的环境中的雌鸟会感受到生存的精神压力。这个精神压力会导致雌鸟体内一种叫皮质醇的荷尔蒙的浓度升高。于是雌鸟产的蛋，也会含有高皮质醇。从这样的蛋里孵化出来的小鸟，有独特的行为模式。\n\
    \n它们是穷人家的鸟宝宝。\n\n它们出生时的体型比较小，但是它们肌肉反应很快，它们的飞行速度更快，它们比富人家的鸟宝宝更擅长战斗。它们仿佛注定就不是为了养尊处优的日子而生的，它们天生就是奋斗者。这些听起来似乎都是优点……但是，因为这些穷人家的鸟宝宝更好斗、更愿意为了获取食物而冒险，我们可以想见，它们会常常把自己置于危险的境地。\n\
    \n穷人家的鸟宝宝的这些行为模式，是出生以后一看看环境不太好，自己学习和摸索出来的吗？不是。是天生的。\n\n研究者在实验中，刻意选择富裕雌鸟的鸟蛋，只是往鸟蛋中注射一点皮质醇，其他一切条件都不改变，这样孵化出来的小鸟，它们的行为模式就跟穷人家的鸟宝宝完全一样。\n\
    \n鸟宝宝的行为模式，完全由鸟蛋里的皮质醇开启。所以这一切都是基因决定的，而基因都是一样的基因。我们可以设想，这就如同这些鸟的基因中有这么一行代码——\n\n\
    ```\nIF (皮质醇含量高) THEN\n    开启穷人行为模式\n```\n\n小鸟，一点都不自由。\n\n作为哺乳动物的代表，小老鼠的人生选择，并不比小蝌蚪和小鸟更自由。\n\
    \n如果食物充足环境好，母老鼠的生活就比较自在悠闲，她生下小老鼠之后就有许多时间去舔舐自己的小宝宝。那些经常被妈妈舔舐的小老鼠，他们成长的气质，就比较稳重、淡定、从容不迫，一看就是富人家的孩子。而那些小时候被妈妈舔舐得少的老鼠，则是另一种行为模式。\n\
    \n穷人家出生的母老鼠会更早达到青春期，她面对其他母老鼠的时候会具有攻击性。但是对公老鼠来说，这样的母老鼠更有性吸引力，所以她会更早地怀孕。而穷人家的公老鼠，则会更好斗。\n\
    \n简单地说，这些老鼠更早熟。它们简直是着急忙慌地配对，赶着生育下一代。从演化的角度这完全可以理解：环境这么艰苦都是有今天没明天的日子，如果不赶紧生育可能基因就流传不下去。\n\
    \n但是，老鼠这种行为模式，既不是理性判断的选择，也不是自己在环境中摸索出来的——它完全是由小时候被妈妈舔舐的次数决定的。只要实验人员用任何人工模拟的方法多舔一舔妈妈生的小老鼠，那些小老鼠就会具有富人气质。\n\
    \n老鼠在青春期的行为模式，也是写在基因里面的——\n\n```\nIF (被舔舐的次数少) THEN\n```\n\n## IF (被舔的次数少) THEN\n\
    \n早点配对生育\n\n树蛙是这样，鸟是这样，老鼠也是这样，那难道人类，会有什么不同吗？\n\n人当然不一样。人有思考、判断和理性决策的能力。只要行使这些权力，人理应能够摆脱基因的枷锁。更何况人是一种聪明得多、也复杂得多的动物。并没有像什么化学物质、荷尔蒙或者舔的动作那样的因素能单方面决定人的行为模式。\n\
    \n但是，人毕竟也是动物。我们也要受到基因的控制。荷尔蒙、幼年时所受到的照料，外部的环境，共同决定我们的行为模式。\n\n如果一个孩子从小生活在艰苦的环境中，缺少父母的关爱，再加上面临食物短缺甚至是暴力，他就会表现出特定的性格特点。\n\
    \n跟小伙伴一起玩，他对快乐场景的印象不深，但是对那些发生矛盾冲突场景的印象强烈。正做着这件事，周围有点风吹草动他马上就会转过头去做那件事。他善于参加冒险的活动。他非常有办法获得即时的回报，但是不重视长远的利益。他很早就乐于跟异性交往。\n\
    \n难道这样的孩子就不知道好好学习推迟享乐的道理吗？他不明白应该跟人好好合作吗？他的这些行为，可能都不是有意识的。如果环境就是不好，他这么做恰恰是最有道理的。\n\
    \n那当一个聪明的男高中生、明明成绩不错但是决定不考大学了，想要赶紧工作挣钱的时候，当一个女高中生才 18 岁就决定嫁人生孩子的时候，你跟他们讲你以为正确的人生大道理有用吗？\n\
    \n他们的身上，背负着基因的枷锁。我们每个人身上都背负着基因的枷锁——这些都是演化留给我们在富足或者艰苦环境中的生存策略——只是有些人幸运地开启了正好适合的基因表达而已。\n\
    \n不知道这一讲是不是让你对“遗传”有了新的认识。我们专栏以前讲过“生命历史理论”中的“快策略”和“慢策略”[1]，讲过“贫困病”[2]，讲过布莱克本和埃佩尔的《端粒效应》[3]。我们知道压力会导致人的生理反应，其中就包括皮质醇升高。我们知道贫困性格是可以遗传的，而且我们知道遗传的不是基因，而是基因表达。\n\
    \n但是之前所有那些理论，都不如戴维·威尔逊在《生命视角》这本书里说的明白。富足环境下的应对策略和艰苦环境下的应对策略，其实每个人的基因里都有——只是一个开启问题而已。\n\
    \n我认为这个演化思维给所有人都带来了希望。哪怕现在你的经济状况是贫困的，但只要你能给孩子很多关爱，他就可以拥有富裕的品性。\n\n据我理解，威尔逊说的这个演化思维的解释，目前在学术界还没有被广泛接受。但并不是说这个理论有什么重大争议。这个局面是传统上研究人的行为的、研究脑科学的、研究动物行为的，和研究生物演化的，是几拨不同的人。非得有一些像威尔逊这样的大家出手，才能把这些学科的相关知识放在一起考虑，形成综合的判断。\n\
    \n所幸的是我们现在知道了这个演化思维。\n\n但如果这么多行为都是继承的，我们自己怎么才能给自己做主呢？咱俩下一讲再说。\n\n注释\n[1] 精英日课第一季，《今朝有酒今朝醉，也是一种理性》。\n\
    \n[2] 精英日课第一季，《贫困病》。\n\n[3] 精英日课第一季，《你我的端粒》。\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_99_0.png)\n\
    \n〈前一篇\n\n# 《生命视角》5：你来自传承（下）\n\n万维钢·精英日课³\n今天\n进入课程 >\n\n《生命视角》5: 你来自传承\n\n上一讲我们说到，基因传递给我们的不仅仅仅是生理特征，也包括*行为*的模式。在演化思维的这个视角下，我们再看看卢梭的那句名言——\n\
    \n> 「人生而自由，却又无往不在枷锁之中」\n\n是不是另有一番滋味。从自由不自由的角度来说，基因带给我们的是枷锁。但是是从生存的角度来说，基因决定的行为模式其实是我们的生存本能，是预装的软件，是出厂设置的技能点。我们应该拥有这些不用学就会的能力而感到庆幸。我们是生命演化传承的产品。\n\
    \n而我们传承的还不只是基因。现代演化论者认为，人类的文化，其实也是演化的产物。\n\n把一群外地人直接放到北极，哪怕他们都身体很好智力很高，单凭自己也无法生存。可是有很多当地人，身体素质也许一般，却能在那里生存得很好。人都是人，这一群人与那一群人在基因方面没有什么本质的差别，真正的差别是文化传承。\n\
    \n威尔逊举了很多例子，比如说某个以渔猎为生的部落，因为一起意外事件，导致老人都死了，结果那个部落的一系列生存技能就失传了，剩下的人只能另外想办法谋生。像这样的例子不用多讲我们也明白：每个人都不是孤立的。今天的你站在这里表面上是个独立的人，其实你做事的方法，你的各种知识，都是文化传承赋予你的，你来自传承。\n\
    \n文化，可以说是人类最大的一个群体选择优势。文化是人群社会合作的产物。得以人创造，有人记录，特别是有人愿意教，有人愿意学，文化才能积累起来。其实我们以前也说过这个道理：为什么其他动物完成生育任务，把子女带大之后自己很快就死了，而人却在停止生育之后再活那么多年呢？因为人在养大了自己的子女之后，还有另一项使命——那就是作为社会中的博学者，把文化传承下去。\n\
    \n威尔逊认为，文化，其实是一个意义系统。这个系统的输入，是环境信息；输出，是告诉你应该干什么。\n\n为什么说这个系统是意义系统呢？因为在这个系统在基因本能之外，又给了我们另外的生活目的。它告诉我们在基本生存需求之外，还有什么别的东西应该追求。\n\
    \n```\nIF (遇到XXX细菌) THEN\n\n  杀死;\n\nELSE IF (遇到YYY细菌) THEN\n\n  杀死;\n\n.....\n\
    \nELSE\n\n  保留\n```\n\n基因和文化，都可以说是“先天性的”东西——是你继承的东西。那到底有什么能力是“适应性的”，是我们自己在主动适应新环境呢？\n\
    \n如果说基因是预装在我们头脑里的程序，那文化就是我们后来选装的程序。但它们都是程序。我们只是执行程序而已。\n\n有些传承让人感到很无奈。中国有些官员，说我为啥有了这么多钱还在不断地贪钱呢？因为小时候穷怕了。贫穷能让人爱奋斗爱冒险，但贫穷也可能会限制人的价值观。可是你能说我就要不要那些传承，我就要从头开始做个新人吗？\n\
    \n你不能。我看有些学者看中国文化这么不对那么不好，可是他思考和办事的风格，其实恰恰就是中国式的。人不是孤立的东西，你喜欢也好不喜欢也好，传承就在你身上。\n\
    \n但最新的演化思维带给我们三个好消息。\n\n## 一个好消息是我们传承的其实不是哪个特定的行为模式，而是各种写满了 “IF……THEN……” 的程序。\n\
    \n有些通过奋斗挣下偌大家业的企业家，回头一看自己的孩子居然醉心于没用的艺术！他怎么对财富就不感兴趣呢？他怎么不像我呢？其实孩子跟他的基因差不多，只不过被不同的成长环境开启了不同的行为模式而已。\n\
    \n也许每个人身上都有艰苦奋斗的程序，也都有艺术家程序，只不过不一定开启而已。\n\n## 另一个好消息是，文化可以改变我们。\n\n小鸟和小老鼠可能会被幼年决定一生，但人有文化，文化能提供不一样的意义和价值观。\n\
    \n## 第三个好消息是，人还有创新能力。\n\n演化思维告诉我们，最好的创新，应该跟本能相配合。是，你的确有选择的自由。但是，与其选择抑制本能，不如选择利用和引导本能，我们专栏以前讲过《正念自控法》，正是这个思路。\n\
    \n也许你就可以用文化和创新，开启自己未曾表现过的本能。\n\n现在对人的行为模式的研究，演化思维这一派，已经领先于传统上的 “白板” 派和后来出现的 “人脑就是通用计算机”\
    \ 派，可以说是正在成为主流。接下来我们继续看看演化思维的实际应用——特别是，如何利用演化思维，改变别人和自我。\n\n> 截至复习：《为什么佛学是真的：正念自控法》\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_101_0.png)\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_101_1.png)\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_101_2.png)\n\n# 活码长期有效\n\n# 《生命视角》6：借助群体，演化自己\n\
    \n万维钢·精英日课³\n\n今天\n\n进入课程 ›\n\n《生命视角》6: 借助群体，...\n\n我们继续讲戴维·威尔逊的《生命视角》。这一讲的主题是如何使用演化思维，在社会关系中，实现自我改变。\n\
    \n我们前面讲岸见一郎和古贺史健的《被讨厌的勇气》那本书的时候说过，阿德勒的哲学认为人的幸福感和一切烦恼的根源都是人际关系。我们说阿德勒那一套是“强人的生活哲学”——它是哲学。哲学可以说人*应该*如何如何，但是如果不经过科学方法的验证，你就不能说人*是*什么样子的。\n\
    \n威尔逊并没有提到阿德勒，但是以我之见，演化思维和书中提到的各项科学实验证据，在人际关系这个问题上，可以说是跟阿德勒的思想殊途同归。\n\n这是一个好消息，说明他们说的这些道理应该是真的。而更好的消息是我们现在有比阿德勒当年更深、也更实用的知识。阿德勒说人际关系是人生的一项原理——现在威尔逊说的更为激进。\n\
    \n威尔逊的关键洞见是，在个人、群体和社会这三者之间，真正占到基础性地位的不是个人，而是群体。\n\n你的首要身份不是自己，而是你所在的群体的一员。当然你可以是多个群体的成员，包括你的家庭、你工作的团队、你生活的小区等等，而这些关系，对你的影响是决定性的。\n\
    \n## 1. 摸手的作用\n\n吉姆·科恩（Jim Coan）是一个神经科学家，同时也是一个心理医生，经常给人做些心理治疗。大约在2000年左右，科恩有一个80多岁的患者，是参加过二战的老兵，患有创伤应激综合征（PTSD）。科恩很想帮助他，可是这位老兵非常不愿意配合治疗，你让他做什么他一概不听。\n\
    \n## 2. 积极教育\n\n咱俩想象一个常见的场景。你在逛超市的时候看见有个孩子在大哭大闹，他妈妈不但不好好管教他，还给他各种哄。孩子得寸进尺，提出各种非分要求；妈妈步步退让，最后什么条件都满足了。\n\
    \n## 3. 接受与投入疗法\n\n比如我们小的时候，可能因为家庭环境或者各方面的原因，性格有点孤僻，不太能融入社会。长大之后认识到自己的性格不太好，想要自我改变，应该怎么办。\n\
    \nACT 大约可以分为两个方面。一方面是投入，其实就是要用演化的方法改变自己，也就是突变 + 选择。\n\nACT 的另外一个方面是接受，这是观念上的自我改造，往往很多人都纠结自己的毛病\n\
    \nACT 的另一个方面是接受, 这是观念上的自我改造。其实很多人都知道自己的毛病在哪里，只是跳不出来。酗酒者知道酗酒的习惯不好，但是戒不了；性情孤僻的人并不喜欢孤僻的状态，但是他迈不出跟人打交道的第⼀步。这是为了什么呢？\n\
    \n有人打了个⽐⽅。这就好⽐我们⾝处⼀个周围都是⼭的环境，有些⼭很⾼，有些则是低矮的⼩⼟丘，我们都希望⾃⼰能站在⾼点。⾏为有问题的人，就相当于是站在了⼀个⼩⼟丘上\
    \ —— 他面临⼀个两难的选择：他知道更⾼的⼭肯定更好，但要想去，他必须从他的⼩⼟丘上下來才⾏。可是⼩⼟丘是对他来说是个局部的⾼点：喝酒的感觉确实挺好，不和⼈打交道确实安全\
    \ —— 从上⾯下來他会感到很难受！\n\n⽽ ACT 要求我们换个⾓度看这个问题。你不要把那个⼩⼟丘当局部⾼点，你应该把它当做爬⼭路上不得不过越的⼀个⼩障碍。\n\
    \n⽽为此，你⾸先得有⼀个⼤局观。你得知道对你来说真正重要的东西是什么，你得对整个的路线图有个⼤概的了解。\n\n有个研究是这样的。斯坦福⼤学有一些黑⼈学⽣，可能因为是黑⼈，是⼤学降低标准录取来的，他们来了以后会有一類自⼰并不属于这里的自卑感。⽽研究者用了一个⾮常简单的办法就能帮助他们。\n\
    \n研究者给刚入学的黑人新⽣看了一份调查报告，报告中说每一个斯坦福新⽣都有同样的困惑和不安。然后研究者让这些学⽣面对镜头谈谈⾃己的困惑和不安，作为给未来新⽣的记录。同时，在接下来的一周里，这些学⽣还要每天记录和印证⾃己的这个情绪。\n\
    \n这就相当于给这些学⽣看到了⼀份路线图。原来前⼈也都是这么过来的，原来我并不特殊，我跟别人一样。就这样，参加实验的黑人学生找到了对斯坦福的归属感，而研究表明，他们到高年级的时候，成绩和健康水平都超过了对照组。还有另一项研究说，哪怕让人仅仅是时不时写下对⾃己来说最重要的是什么，这些⼈的心理状况都能显著改善。\n\
    \n这一讲我们说了一个理论 —— 社会基线模型。提出了两个改善行为的方法，一个是基于演化的“学习 = 突变 + 选择”，并据此提出教育孩子的黄金法则；一个是建立大局观和对集体的归属感。\n\
    \n威尔逊认为人类社会的最基本单元不是个人也不是大社会，而是小群体 —— 你看这个说法是不是跟我们前面讲的《九个工作谎言》一书说的我们的实际工作是在小团队之中，是一致的？\n\
    \n教育孩子的黄金法则，表扬要慷慨，惩罚要温和，是不是跟《九个工作谎言》中怎样给下属提反馈，有相通之处？\n\n强调对群体的归属感，这是不是印证了阿德勒的招牌学说？\n\
    \n读书的一大乐趣是发现这些联系，以期达到融会贯通。新知识不见得非得让人感到颠覆才好的，从别的角度印证以前的说法，更能让我们放心。\n\n注释\n[1] 这个项目有个网站提供教程，似乎是免费的：https://www.triplep.net/；在中国也有推广：http://www.ccetchina.org/view/148\n\
    [2] 有关ACT的文献很多，这里有个小小的介绍：https://www.psychologytoday.com/us/therapy-types/acceptance-and-commitment-therapy\n\
