    ## 早教军备竞赛的科学结论


    万维钢·精英自课³

    今天


    进入课程 >


    早教军备竞赛的科学结论


    现在中国学龄前儿童的家长们正在面临一场军备竞赛。我们这一讲要说的是这是一场愚蠢的比赛，聪明理性的人不应该参加。


    周围大多数人都在做的事情，不一定就是对的事情。当前中国国情，学习的竞争早就发生在小学入学之前，而学龄班的市场已经覆盖到了零至三岁。四岁开始学英语，五岁会算数学题似乎是新标准。据说有的小学已经不好好教汉语拼音了，因为学校默认孩子在幼儿园就应该学会。


    早教剥夺了孩子的快乐童年。早教要让家长花费很多时间和金钱。面对严峻的现实，什么“人生是一场长跑，赢不赢起跑线不重要”这样的話纯属鸡汤。谁不知道人生是长跑？可是你总不能让孩子连小学入学考试都过不了吧？再说天才不都早慧吗？高水平运动员不都是从小苦练出来的吗？


    我们需要科学的指导。如果早教是培养高水平人才的必要条件，那就让孩子多点苦，家长多点累点花点钱，就都是值得的。如果不是，早教就是错误的。


    事实是，关于早教的问题，已经有科学结论了。


    如果你稍微做一点关于早教的调研，你会很难控制自己的情绪。你会认为中国的所谓“育儿专家”，表面上张口一个“脑科学”闭口一个“国际先进水平”，实际上跟那些讲“女德》、《弟子规》的国学大师一样，都是愚昧思想的贩卖者。


    当前科学理解，对“早教”这个东西，早就有非常清楚的结论。


    上世纪七十年代，德国政府可能是考虑到国家需要更多高水平人才，曾一度打算把传统的、让孩子玩闹为主的幼儿园，全都变成以教孩子写字算算术这种早教为主。但是德国人没有拍脑袋就决策。


    德国政府资助了一项大规模的研究 [1]。研究者选择了50个以早教为特色的幼儿园，和50个以玩闹为主的传统幼儿园，对所有这些孩子进行跟踪比较。


    一开始，的确是早教幼儿园出来的孩子学习水平更高，而且这个优势一直保持到孩子们上小学以后。这是完全可以理解的，毕竟早教幼儿园的孩子都提前学习了，孩子刚上小学一看老师教的自己都学过，心理上想必也有优势，可惜是赢起了跑线。这完全符合现在中国家长们的切身感受。


    但是，那个优势并没有一直保持下去。到小学四年级再看，早教组的孩子不但没有学习优势，而且他们的成绩还*显著低于*传统幼儿园出来的孩子。


    早教真的能让你赢起跑线，但是你真的领先不了多久。


    所以德国政府取消了改革幼儿园的计划。这就是为什么尽管现在发达国家的好高中、好大学比中国的高中和大学的学习强度高，但是发达国家的幼儿园没有中国那种早教——那不科学，那不是什么“国际先进水平”。


    类似的研究被多次重复，现在学界已经达成共识 [2]：早教带来的早期优势会在一到三年内被刷掉，然后还可能会被逆转。


    所以，就提高学习成绩来说，在最好的情况下，早教没用；在很多情况下，早教有害。早教，是拔苗助长。


    如果你的孩子因为没参加早教而没考上那个所谓重点小学，我劝你别担心。你可能还应该感到庆幸。你敢不敢先给孩子找个正常点的 小学，等到四年级再跟他们比。


    但早教的真正害处，比四年级时的学习成绩严重得多。


    德国那个研究发现，早教组的孩子不但成绩被人逆转，而且在社交和情感能力方面，还有明显的欠缺。这才是早教最大的害处。


    美国的一项研究做得更彻底。1967年，研究者把密西根州的68个贫困家庭的孩子随机安排到传统的、基于玩闹的幼儿园，和以老师直接教学为主的早教幼儿园中。为了保证效果，研究者还每隔两周家访一次，教给家长如何配合幼儿园的风格教育孩子。这个研究一直跟踪到孩子年满23岁。


    学习成绩方面的结论跟德国的研究一致，早教组有个初期的优势，然后很快就被抹平了。但 这项研究最惊人的发现是在孩子的为人处世能力方面。


    到15岁的时候，早教组的孩子违反学校纪律的次数，是传统组孩子的两倍。


    在美国当个穷人，日 子是很艰难的，长大很容易走上犯罪道路。到23岁，传统组有13.5%的人曾经因为犯罪而被捕；而早教组这个比例高达23.4%。早教组还有19%的人曾经用武器威胁过他人，而传统组一个都没有。


    总体而言，早教组的孩子更容易跟人发生摩擦，更容易犯罪，更不容易结婚。一句话，他们不擅长与人相处。


    当初只有短短一两年的早教，竟然造成了终身的危害！


    我需要再强调一遍，美国这个研究的对象是穷人家庭的孩子，而美国穷人的日子本来就很不好过，所以长大以后才有那么高的犯罪率。


    这个研究非常有戏剧性，但是仍然能说明问题：它说明早教伤害了孩子的社交和情感能力。其他没有专门用穷人的研究，戏剧性没有这么强，但是有同样的结论 [2]。那这是为什么原理呢？


    我们精英自课专栏去年读过加州大学伯克利分校的发展心理学家艾莉森·高普尼克（Alison Gopnik）的《园丁与木匠》这本书。高普尼克说，儿童在六岁以前，真正的任务不是什么学习读书写字和做数学题，而是玩儿
    [4]。


    玩闹也是学习。孩子在玩儿的过程中能探索周围的东西都是干什么的，揣摩周围的人都在想什么。更重要的是，跟别的孩子一起玩闹，是一种社交演练。孩子必须在实际互动中学会社平、尊重和社交界限，学会分享、帮助和友情，学会怎样跟人相处。


    所以哪怕你家孩子真是天才，天生以学习为乐，五岁就会微积分，也请不要耽误他玩。性情乖张行事怪异的天才已经太多了。


    在正常孩子都忙着社交的时候，有些孩子却被逼着去死记硬背拼音、单词和乘法表。他们把大好时光浪费在了那些只要再过几年就能轻轻松松学会的东西上。


    他们该玩的时候没玩够，甚至可能再也学不会怎样好好玩儿了。


    进化生物学家戴维·威尔逊（David Wilson），用演化思维考察儿童成长，提出一个概念叫“严格的灵活性（rigid flexibility）” [5]。成长的过程看起来灵活，其实很严格。儿童发育的每一步，都需要正确的环境信息输入。晚了不行，早了也不行。


    9个月以下的孩子不需要额外的音频和视频多媒体信息。长时间让孩子听音乐看电视会导致孩子长大以后不能集中注意力。


    18个月以下的孩子只有听真人说话、在有互动的情况下，才能提高词汇量。其他方法一律没用而且有害。


    两岁以下的儿童只适合接触三维的物体——也就是真实世界里那些具体的物体，比如玩具和人。而二维的东西，比如书本和图画，只会妨碍他们感知能力的发育。


    人的听觉、视觉、各种感知能力、大脑的发育是讲顺序的。提前给一个不该给的刺激，很可能让这个时候该发育的东西发育不好。


    六岁以下儿童的任务不是用惊艳的学习成绩给父母增光，而是健康地发育成长。强迫式的早教是害死儿童。


    早教课教的那点玩意有什么可学的？有什么可担心的？只要让孩子大脑正常发育，到时候想学还不容易吗？堂堂的高学历父母，被幼儿园老师治得心惊胆战，这不荒唐吗？真正的天才都是跟成年
    人比，以自己家孩子提前两年学会小学二年级知识为荣，那是愚昧。


    没有上过早教的孩子，或许还有？救救孩子……


