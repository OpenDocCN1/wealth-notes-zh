    ## 博弈论10：后发优势的逻辑


    博弈论10：后发优势的逻辑


    前面我们讲了先发制人的好处，但是生活中也经常有“后发优势”的说法。那到底什么时候应该先发，什么时候应该后发呢？


    人们通常都是力争先发的。你首先采取行动，造成既成事实，会让对手很被动。


    我记得我小的时候，大家把所有的易拉罐饮料都叫“健力宝”。健力宝率先占领了人们对易拉罐饮料的认知，以至于会让你犯语法错误。先发的品牌可以统治甚至定义一种产品。以前人们曾经管所有随身声音乐的设备叫“Walkman”。现在在机场边安检，工作人员不会让你把“平板电脑”从包里拿出来——而是说把iPad拿出来。


    你统治了这个领域，让后来的人情何以堪。也许现在就有很多人，用手机看短视频不叫看短视频，叫“看抖音”；听课不叫听课，叫“听得到”.....


    九十年代，春晚刚有小品的时候，活跃的小品演员有赵本山、潘长江、蔡明、宋丹丹......现在的春晚舞台几乎还是他们的。难道二十多年来就没有新的好演员了吗？如果这个地方的资源就只有这么多，那显然是先到先得。先发者抢占技术专利和标准，抢占市场份额，甚至抢占消费者的观念。


    如果先发有这么大的优势，别人又怎么能后来居上呢？特别是中国在过去几十年的进步，很多人就说是中国有“后发优势”。那后发优势又是什么呢？


    ### 1. 后发者优势的博弈


    咱们先说一个最简单的博弈游戏 [1]。甲乙两人手里各自拿个硬币，轮流把硬币摆在桌子上面。游戏规则是如果两个硬币同一面朝上，甲取胜；如果两个硬币相反，乙取胜。那这个游戏应该怎么玩呢？


    显然是谁后出手谁赢。甲要是先出手，不管甲摆正面还是反面，乙总可以摆个跟他相反的。如果乙先出手，甲总可以摆个跟他一样的。后出手稳赢。


    先发者暴露信息，后发者利用信息。


    ### 2. 领先者应该模仿


    我们这里说的先发和后发，是说面对同一个局面谁先采取新动作。有时候局面的领先者反而会选择后发。一个著名的例子是美洲杯帆船赛上真实发生过的故事 [3]。


    这个道理是如果你已经领先，就不要主动冒险了。应该让落后者先 trigger 不确定性。落后者不改变打法就一点机会都没有，他想赢就必须冒险——而领先者只需跟随就行。


    ### 3. 模仿和创新


    落后者作为上一轮的后发者，也有模仿的方便条件。


    后发优势 = 先发者的信息 + 后发者的出手权。


    信息是模仿机会，出手权是创新机会。


    怎么用的。


    首先，中国有一个巨大的市场，而外国公司无法轻易进入这个市场。哪怕中国加入了WTO，在很大程度上开放了市场，外国公司也不容易进入。这是因为中国有自己独特的文化和消费习惯。在适应中国市场、了解中国消费者方面，中国公司占据了天生优势。这是中国公司的一个出手权。


    再者，中国有大量聪明而又勤奋的劳动者，还有很好的基础设施，而很多发达国家没有。这是中国的另一个出手权。


    还有，中国政府还喜欢搞“产业政策”，也就是由政府出面，重点扶持某个产业。产业政策是张维迎和林毅夫争论的焦点，但是我们从后发优势这个视角看来，产业政策好不好，其实跟你在国际竞争中的相对位置有关。如果你现在是技术领先者，根本不知道下一个技术进步的方向在哪里，那产业政策就是政府在乱花钱。但如果你现在是个技术落后者，明确知道先进技术的方向在哪，产业政策就是最快速的模仿方法。产业政策是有中国特色的模仿。


    也许这些才是中国少走弯路、甚至形成弯道超车的真正后发优势。那发达国家作为领先者，为什么不主动模仿中国特色的打法？答案当然是想模仿也模仿不了。有些出手权只有中国才有。


    甚至在很多情况下，领先者就算有出手权也不用。我们专栏在讲麦肯锡报告《超越曲棍球杆的战略》的时候说过 [4]，成功的大公司是非常非常不愿意做出战略改变的。他们会假装那些新冒出来的小公司都成不了气候。改变战略是很难以受的事情。他们宁可眼睁睁地、但是是舒服地，让出航道。


    总结一下，先发优势在于占领，后发优势在于信息和这时候才有的出手权。如果先发者能占住，后发者只能被迫创新，那么这时候先发者的正确做法是模仿后发者——可是因为各种原因，先发者常常做不到。


    学习前人经验可以让你少走弯路。但是如果你想赢，想超过前人，那你就必须得有一个前人没有的超车动作才行。


    正是这个先发和后发的博弈，谁也不能保证一直领先。这个世界的剧情才是你追我赶，能让竞争永远进行下去。


