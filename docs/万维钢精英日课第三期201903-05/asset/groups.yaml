    \n提交留言可与专栏作者互动\n\n## 问答：到底什么叫“可计算”？\n\n万维钢 · 精英日课³\n今天\n\n进入课程 ›\n\n问答：到底什么叫“可计算…”\n\
    \n万维钢\n\n本周最主要的问题都是集中在“可计算性”上——\n\n### 读者漫漫要撒野：\n\n文章读到最后感觉有一个计算之神在操纵一切世间万物，但是所有的一些都能够计算么？似乎不是这样的。\n\
    \n### 读者阿丁：\n\n新手懵以理解“图灵停机问题”，总觉得有点神秘。万老师能解释一下吗？\n\n万维钢\n\n“可计算性”和“图灵停机问题”是计算机科学中的两个关键问题，我认为每个想要理解计算机的人都应该有所了解。今天的问答，咱们就专门说说这两个问题。\n\
    \n## 1. 什么叫“可计算”\n\n我们知道，计算机思维能给人提供一个观察世界的视角，能让我们审视自己的世界观。因为有了计算机，我们现在可以问出下面这些大问题——\n\
    \n+ 1. 计算机能解决一切问题吗？\n2. 人脑是一台计算机吗？\n3. 我们生活的这个世界，有没有可能像《黑客帝国》电影那样，其实是一场计算机模拟呢？\n\
    \n我先说结论。科学家和哲学家的当前科学理解，对第 2 和第 3 个问题，还没有答案——你只能猜想。但是对第一个问题，答案则是明确的否定：计算机不能解决一切问题。\n\
    \n那你可能会感到有点奇怪——如果计算机不能解决一切问题，那就就是说计算机是有局限性的吗？那人脑和真实世界怎么还可能是计算机呢？其实这并不奇怪，因为人脑和真实世界也可能是有局限性的。计算机有局限性，不等于是人脑就一定强于计算机，也不等于真实世界就不是计算机。\n\
    \n咱们先说说这里怎么叫“解决问题”，也就是怎么叫“可计算”。对计算机科学家来说，所谓可计算，就是给确定输入，经过计算机的有限次操作，能得到一个确定的输出。“可计算”的意思不但是“可以算”，而且是“可以算出结果来”。\n\
    \n咱们把问题简化一点。我们考虑这么一种问题，它的答案要么是“是”，要么是“否”，而在逻辑上不存在模棱两可的中间状态。请问，所有这样的问题，都是计算机可以解决的吗？\n\
    \n答案是否定的。哪怕像是“是否”这种问题，都不全是可计算的。比如说，图灵停机问题，就是不可计算的。\n\n## 2. 图灵停机问题\n\n让计算机执行一个“寻常的”程序，比如计算\
    \ 1+2+3+……这么一直加到比如说 10000，只要计算机的内存足够大，只要你给的最后一个数字是有限的，只要你愿意等待足够长的时间，它就终有算完、停机、输出一个结果的时候。\n\
    \n但是有些程序，却是永远都不会停机的。比如你可以让计算机一直循环执行下面这个命令——\n在屏幕上打印“你好”\n\n那么你就会看到计算机不断地打印“你好”这两个字。你要是不主动杀死这个程序，它就不会停机，它陷入了“死锁”。“死锁”是程序员的噩梦，有时候写程序说不定哪里没设计好，程序一运行起来就陷入了死锁。\n\
    \n所以程序员就有一个美梦。有没有一个什么软件工具，能就直接看一眼我写的程序，就自动判断它会不会出现死锁呢？\n\n这就是“图灵停机问题”。也就是说，有没有这样一个程序，它的输入是任何一段代码和这段代码的输入参数，而它的输出则是这段代码所代表的程序，在那个参数之下运行起来之后会不会自动停机——如果判断会停机，就输出“1”；如果判断不会停机、会死锁，就输出“0”。\n\
    \n想要做到这一点，这个判断程序必须只读、而不能去执行那段代码——因为如果执行，而那段代码又真的不停机的话，计算机就会陷入死锁，这个判断程序就不能输出“0”了。换句话说，这个判断程序得能像一个高水平程序员一样，看一眼你写的代码就知道其中有没有死锁。如果有这么一个判断程序，岂不是一个绝佳的\
    \ debug 工具吗？\n\n而图灵告诉你别做梦了，不存在的。\n\n在理论上就根本不可能存在那样的判断程序。这是一个不可计算的问题。\n\n为什么呢？证明非常简单，反证法。以下为了行文方便我不得不使用一点编程语言——\n\
    我们假设存在这么一个判断程序，称为 Halt(p, l)。其中 p 是 Halt 要判断是否停机的代码，l 是程序 p 的输入。\n\n也就是说，如果程序\
    \ p 运行输入值 l 的时候会停机，那么 Halt(p,l) = 1；否则，Halt(p,l) = 0。\n\n好，那么我们构造下面这么一个新程序 [1]，称之为\
    \ Z：\n\n```\nProgram (x)\nIf Halt(x, x) then\n    永远循环\nElse 停机\nEnd.\n```\n\n\
    我解释一下。Z 的输入，是任意的一段字符串 x。x 可以是一段程序的代码，也可以是一段程序的输入。Z 的规则是，如果 Halt(x,x) 是 1，则 Z 就永远循环下去，不停机；如果\
    \ Halt(x,x) 是 0，则 Z 就停机。\n\n那么请问，像这样一个程序 Z，如果把它的代码自身，作为它的输入，会怎样呢？它会停机吗？\n\n如果会停机，那这意味着\
    \ Halt(Z,Z) = 1，对吧？可是你带入 Z 的规则之中，这时候 Z 就应该不停止。反过来説，如果 Z 不会停机，那么 Halt(Z,Z) = 0，带入规则之后\
    \ Z 又会停机！悖论！\n\n所以 Halt 这样的程序，根本就不可能存在。证明完毕。\n\n这个证明是否让你想起了我们讲逻辑思维的时候说过的“理发师悖论”。Z\
    \ 就是那个“只给不给自己理发的人理发的理发师”。这个悖论的关键就在于，一段代码，既是可执行的程序，又可以作为输入的字符串。所以我理解，这个矛盾的根源在于，写代码和判断代码，都是能用语言描述的行为。\n\
    \n## 3. 不可计算意味着什么\n\n现在图灵给了一个例子，说明世界上有些问题是计算机无法解决的。计算机无法判断任何一段代码是否会停机。这说明哪怕所有问题都能用数字编码，计算机也解决不了所有问题。\n\
    \n这有什么意义呢？\n这意味着总有一些事情，你只能慢慢等着它发生，而不能事先知道它的结果。这意味着程序员必须得程序运行一下才知道其中有没有 bug。这意味着理论是有限的，必须得实践才行。\n\
    \n这还意味着，世界上有些事情，你只能看着它发生，而无法解释它为什么会发生。这是因爲你始终都无法预测它会不会停下来，又何谈什么解释呢？\n\n那也就意味着，我们不可能完全理解真实世界。我们头脑里只是世界的模型——而世界的模型不能代表真实世界。世界上总有一些事情，是你没有办法用什麽简化的模型预测的，你只能看着它发生才知道结果。这是否使你想起了我们第一季讲过的“不可约化的复杂”\
    \ [2]，和哥德尔不完备性定理……其实它们说的都是理性世界的局限性。\n\n而如果你是一善於感慨人生的人，这也就意味着，哪怕你再聪明，人生也是值得过的。总有一些事你想不到，你总得经历才知道。\n\
    \n好，下面我来回答你可能会问到的四个问题。\n\n## 第一，这里的“不可计算”，是因为不确定性吗？\n\n—— 不是。图灵停机问题完全可以没有任何不确定性。哪怕一切都是确定的，没有任何随机变量，最后结果仍然不可知。不可知不等于不确定。我十岁生日那天确定、一定、肯定吃过东西，可是我完全不记得吃的是什么——这件事不可知，但是并非不确定。\n\
    \n在一个完全确定的世界里，也有计算机解决不了的问题。\n\n## 第二，男女感情问题，是不可计算的吗？\n\n—— 好多人问我这个问题。我不是感情问题专家，但是我非常肯定地相信，感情问题是可计算的。因为人的情绪容易多变，感情问题有时候不好计算，但不等于不可计算。计算机科学家说的“可计算”是个严格的定义：只要图灵机能在有限步能算出结果来，就是可计算的。\n\
    \n事实上用计算机程序模拟一个人的脾气非常容易。至今没有任何一项属于人的特性，被证明是计算机在理论上也不能推演的。\n\n## 第三，你说的都是图灵机，是吧？\n\
    \n—— 图灵机并不是一种非常特殊的计算机，它就是我们寻常用的这种计算机。只要满足 1）数字化信息 2）数学式的、有限步的算法； 3）能停机，就是图灵机。\n\
    \n图灵机只能处理有理数，这是一个重大限制。但是没有任何证据表明，真实世界不仅仅是由有理数组成的。\n\n## 第四，可是根据量子力学，我们知道真实世界里是有不确定性的，图灵机能模拟不确定性吗？\n\
    \n—— 量子力学的哥本哈根解释认为量子随机性是真正的随机性。我们知道数学方程的解永远都是确定的，所以数学方程无法解释量子现象，那么既然如此，图灵机是基于数学的，所以图灵机就无法代替量子世界。\n\
    \n但是，图灵机可以模拟出一些假的随机数来，让你感觉就好像是真的随机一样。我们无法判断在真实世界里遇到的所谓随机现象，到底是不是外星人给我们模拟出来的假随机！\n\
    \n总而言之 ——\n\n有没有一件事情是人一定能做，而计算机一定不能做的？目前认为没有。\n\n有没有一件事情是真实世界里发生了，而计算机一定不能模拟的？目前认为没有。\n\
    \n……然而计算机仍然不能解决所有问题。这个世界就是这么有意思。\n\n注释\n[1]  这段程序来自 https://www.comp.nus.edu.sg/~cs5234/FAQ/halt.html\n\
    [2] 精英日课第一季，《一个神人的世界观》。\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_133_0.png)\n\
    \n万维钢·精英日课³\n帮你和全球精英大脑同步\n版权归得到App所有，未经许可不得转载\n\n〈前一篇\n\n# 日课精选\n\n写下我的日课\n\n\
    提交留言可与专栏作者互动\n\n# 《计算机思维》4：工程的复杂\n\n万维钢·精英日课3\n今天\n进入课程 >\n\n《计算机思维》4：工程的复杂\n\n\
    今天咱们继续讲《计算机思维》这本书。这一讲我们要说一个特别厉害的技能，叫做“软件工程”。以我之见，软件工程，可以说是工程管理和综合治理手段的极限。我希望你能从这一讲体会一下如何治理最复杂的系统。\n\
    \n可能你是一个产品经理，主导开发过一款APP。可能你是企业家，管理一个几万人的大工厂。可能你是个土木工程师，设计过一座跨海大桥。你非常厉害，咱们中国有很多这样的厉害人物。中国是手机APP开发大国，中国有很多超大型企业，中国有全世界最长的跨海大桥——可是为什么中国就没有属于自己的计算机操作系统呢？为啥国产芯片不行呢？\n\
    \n因为那些事儿，跟现代软件工程相比，还只能算是简单的事儿。\n\n程序员、CEO、计算机科学家，如果是拍一个超级英雄电影的话，这些人都可以是前台的英雄人物。但是躲在幕后操纵世界的，则将是一位、或者几位，软件工程大师。有句叫做“在计算机科学里，软件工程这一部分，对计算机科学家来说太难了。”\n\
    \n## 1.小和大\n\n编程是个非常适合自学成才的项目。很多人不是科班出身，自学编程技术，也容易找到一个程序员的职位，甚至还可以自己开发一个小软件。\n\
    \n但仅限于小软件。比如你可以自己写一个电子邮件客户端程序，或者写一个视频编辑工具。可如果要开发一个超大型软件，其间涉及到的学问，可就不是自学所能达到的了，那是需要在重大项目的实践中去领悟和提高的。自学也许可以让你成为一个优秀的侠客，而伟大的将军，则只能用千万士兵的鲜血铸就。\n\
    \n## 2.小思维\n\n早期的软件开发者想出了很多工程化的办法，起到了了一定的效果。比如以前都是用汇编语言，后来发明了高级编程语言，程序员就不容易出错……当然，这时候也不需要程序员个个都有修士的气质了。\n\
    \n## 3.大思维\n\n软件工程的问题不是你每年能培养多少高水平程序员的问题，而是复杂性问题。\n\n第二个感慨是，你这个团队做出来的软件的结构，往往和你这个团队的人员组织管理结构高度相似。所以软件工程不但是管项目，还要管人。\n\
    \n布鲁克斯这本书出来，人们才充分认识到软件工程的难度。现代软件工程要求，软件产品必须达到下面这五个目标，称之为“DRUSS”——\n\n+ Dependable，可信赖，让顾客真能指望上你这个软件；\n\
    Reliable，得可靠，不能总出毛病；\nUsable，软件是给人用的，得让人能够上手；\nSafe，用的时候不能出安全事故；\nSecure，它得不容易被黑客攻击才行。\n\
    \n现代主流操作系统，包括 Windows，Mac 和 Linux，各自都有接近一亿行代码，而且大致实现了这五个方面的要求。而即便是这三个可以说是成熟的软件系统，其中仍然还有大量的毛病。\n\
    \n那怎么才能获得这种大型软件工程的能力呢？我们前面说的办法都还是小软件思维，剩下的，就只有一些经验之谈，而没有什么特别系统的行动指南了。\n\n比如说，在系统安全方面，软件开发的首要原则是默认不给用户授权。如果非要授权用户接触一个什么东西，就必须得有显性的授权；每个程序进程只能拥有最有限的授权，等等。软件工程就是由这些原则、工作中遇到的规律、前辈传下来的经验组成的。\n\
    \n技术进步能解决一定的问题，比如更多的分层封装，搞虚拟机，客户端和服务器，高级编程语言，交互式开发环境，可视化的控制和数据流，更好的操作系统等等……但是技术解决不了所有的问题。\n\
    \n1987 年的时候，布鲁克斯写了一篇文章叫《没有银弹》[3]，又提出一个洞见：软件工程的根本问题，是人的问题。主导软件开发的这个人，必须得能够理解高度复杂的东西才行。\n\
    \n写程序是永远在更新的技术，软件分为很多层，会出现各种毛病，你得确保产品满足 DRUSS 五方面的要求，你得操很多的心……你得能够驾驭复杂。\n\n像这样的人才，都是绝对的帅才。这就好比带兵打仗，你不用说指挥十万人打仗，你能把十万人安全带到战场，不哗变、不闹事、都能吃饱饭就不错了。\n\
    \n布鲁克斯有句名言是这么说的——\n\n> “好的判断来自经验，而经验来自坏的判断。”（Good judgement comes from experience,\
    \ and experience comes from bad judgement.）\n\n正所谓一将功成万骨枯，驾驭大型软件工程的能力，只能通过大型软件工程培养出来。\n\
    \n我们前面讲《生命视角》的时候说过，有些创新能力难复制——因为它是长出来的。我们中国有很多软件开发者，但是我们缺少操作系统这种级别的大型软件开发积累。我们有几代程序员试炼出来的库函数吗？我们有\
    \ Windows 3.1，Windows 95 的种子吗？我们有前辈开发者总结出来的原则、规律和教训吗？我们有自己的标准和规范吗？软件每天都在更新，但软件工程的背后，是一棵经年累月长出来的大树。\n\
    \n我们这一讲正好赶上最近美国要封锁华为公司，而华为正在搞自己的手机操作系统。在软件工程上另起炉灶是一个几乎不可想象的任务，但是如果真有那样的机会，那就是现在。\n\
    \n咱们倒要让美国人看看，中国公司有没有驾驭复杂的能力。\n\n注释\n[1] 精英日课第一季，《一个大尺度的话题》。\n[2] Frederick Phillips\
    \ \"Fred\" Brooks, Jr, 1999 年图灵奖得主。《人月神话》（The Mythical Man-Month: Essays on Software\
    \ Engineering, 1975）是软件工程的名著。\n[3] Frederick Brooks, No Silver Bullet - Essence\
    \ and Accident in Software Engineering, 1987.\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_135_0.png)\n\
    \n# 《计算机思维》5：设计 的边界\n\n万维钢·精彩日课³\n今天\n\n进入课程 ›\n\n《计算机思维》5：设计的边界。\n\n咱们继续说《计算机思维》。上一讲说的\
    \ 是软件工程，这一讲的主题是软件设计。\n\n说到设计，你是否曾经“发布”过什么东 西呢？你看着人，自己暗中设计和创造一 个作品，各种情况考虑周全、反复检查之\
    \ 后，选定一个时间，拿出来给大家看。\n\n在校学生经常做这样的事情，比如参加表 演、作报告、甚至交作业也是一种发布。\n\n工作中并不是所有人都有这样的机会。\
    \ 如 果你没发布过东西，我建议你尝试一下这 个体验，哪怕是做一桌子菜请朋友吃也 算。\n\n## 1.软件工程和软件设计\n\n软件工程要克服的最大困难是怎么确保不\
    \ 出问题，它的主題大約是“实现”——要 忠实地实现各种要求。从软件工程角度来 说，开发一个软件应该按下面这个流程走 ——\n\n+ 1. 确认需求；\n\
    2. 把要求具体化，设定各种目标参数；\n3. 进行开工建设；\n4. 做好之后接收和测试；\n5. 交付给用户\n\n想要顺利完成这个过程是很不容易的。一\
    \ 般来说，差不多有1/3的项目能按时完成； 1/3的项目会超时、超预算完成；还有1/3 的项目则于胎就完不成。其中的重大困难 当然是软件这个东西实在太复杂，里面有\
    \ 太多的模块和接口，千万万绪谁保不出问 题。\n\n## 2.设计的新思维\n\n没参与过创作的人很难理解设计有多重 要。我突发奇想要一个功能，你给我实现\
    \ 一个功能，很多认为难度和技术含量都 在实现上，其实不然。知道该要什么功 能，非常关键。\n\n软件设计是一个激进的思维方式转换。以 前的软件工程思维，是关注于功能和实\
    \ 现；现在的设计思维，则要求我们要考虑 到用户和产品应用的环境。软件设计和一 般产品的设计还不一样。一般产品让你感 觉好用、好看比较容易，可能最多考虑一\
    \ 当人体工程学之类。而软件，跟用户是交 互式的关系。用户会在软件中做出各种行 为，软件是让用户活动的地方。\n\n软件设计的目標，是创造一个虚拟世界。\n\
    \n-1级，是流氓软件。这种软件不但不安全 而且很可能专门留了收集信息甚至攻击系 统的后门，而且完成度很低，一堆bug。\n\n0级，是轻蔑的满意。基本上可以用，但是\
    \ 大家都知道其中有很多问题，也不怎么安 全。这种软件一般是为了抢占市场而匆匆 推出的，消费者为了使用软件提供的功 能，也就认了。\n\n1级，是软件能够满足基本的需求，比较可\
    \ 靠。\n\n2级，就要提出表扬了，软件能跟环境和用 户使用习惯达到完美配合。\n\n3级，是软件能主动规避负面的结果。\n\n4级，也就是最高级，是这个软件能给用户\
    \ 带来喜悦。\n\nUnix —— 包括后来的 Linux 操作系统， 绝对是传奇。我上大学的时候第一次接触 Linux，其实我用的很有限，但真的是有认\
    \ 知升级的感觉。没有什么花哨的界面，很 多商用软件和游戏都不能用，但是 Linux 是一个跟 Windows 完全不同的世界，更 简单，更丰富，更深刻，可以说其中\
    \ 有“道”——我感觉用 Linux 的时候是 在跟一帮比我聪明得多的人打交道，好像 把我也带得变得聪明了一点。\n"
  mdcn: "\n一方面是中国的人一直都很多，劳动力很便宜。工业革命能在英国发生，一个重要原因是因为英国劳动力贵 —— 要知道早期的蒸汽机挺贵的，就算拿到中国来也没有经济效益。据说圆明园的“大水法”\
    \ —— 一个喷泉装置 —— 本来是机械驱动的，后来改成了让太监驱动。\n\n另一方面清朝统治者不愿意搞技术升级，因为他们害怕汉人掌握高科技。\n\n不过想起前面讲的那三个故事，也许不仅仅是这些原因。\n\
    \n乾隆的祖宗看见西洋火炮好使，毫不犹豫地就装备了部队，而且依靠的就是汉人。为啥那时候就知道科技厉害，到了弘历这里就只知道喜欢娱乐性的机器人了呢？\n\n\
    我觉得那是因为弘历比他的祖先文明。弘历已经被传统文化给同化成了明朝人。\n\n人脑处理信息的能力非常有限。人能看到的东西，通常都是主观就想看到的东西。是思维模式决定你想看什么。\n\
    \n据我谦卑的理解，中国传统的思维模式，看的不是什么机械原理之类的东西。\n\n而是某种超越了物质世界、属于精神世界的东西。这个精神世界不是上帝那种神的世界，而是人的世界，是活人的世界\
    \ —— 是人际关系。\n\n当然这个人际关系绝不仅仅是办公室政治那种小尺度的东西，它包括宏大的主题，比如善与恶、华夏与蛮夷、皇帝与臣子、朝廷与小民，忠与奸等等。\n\
    \n这就是为什么大明的精英会拒绝采纳葡萄牙人提供的武器技术升级。正反双方的确都有利益的考虑，但是辩论的主题，起主导作用的思维方式，是人际关系的精神世界。\n\
    \n这也是为什么乾隆皇帝对西洋科技不敏感，因为他已经从祖先的实用主义思维演进到了人际关系精神世界思维。\n\n每个受过传统文化熏陶的中国人，都会本能地产生这个思维。所以这也是为什么王浩一说要回到中国就主动搞起了政治哲学。\n\
    \n这个思维认为人际关系精神世界比任何东西都重要。这个思维最重视做事的动机和美感，而不重视结果。这个思维永远都在试探对方的动机，想知道他到底是不是自己人。这个思维永远都在“辨奸”，想看看对方什么时候露出狐狸尾巴。这个思维认为人生最大的价值是在人际关系的精神层面达到完美，而一切物质上的东西都是低等的。\n\
    \n所幸的是今天的中国人已经不这样了。我们很注重物质和实力，我们非常强调高科技的作用。但是，人际关系精神世界思维仍然是我们基因传承的一部分。这表现在我们多数人主要把科技当做手段，而少有人把科学本身当做目的。\n\
    \n如果科技只是手段，什么是目的呢？是美好生活吗？我总感觉美好生活也只是手段。别人认可的生活才是美好生活 —— 所以，对很多人来说，人际关系精神世界，仍然是终极目的。\n\
    \n## 注释\n\n[1] 这段史料来自侯杨方，《清史精讲》：为什么欧洲先进武器也无法拯救大明, 2019。\n[2] 樊栎, 18世纪的瑞士机器人与大清帝国的没落,\
    \ swissinfo.ch, 2017年8月31日.\n[3] http://www.sohu.com/a/253593989_776727\n[4] 尼克，《哲学评书》，王浩师友记,\
    \ 2014.\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_131_0.png)\n\n〈前一篇\n\n# 日课精选\n\
    \n提交留言可与专栏作者互动\n\n## 问答：到底什么叫“可计算”？\n\n万维钢 · 精英日课³\n今天\n\n进入课程 ›\n\n问答：到底什么叫“可计算…”\n\
    \n万维钢\n\n本周最主要的问题都是集中在“可计算性”上——\n\n### 读者漫漫要撒野：\n\n文章读到最后感觉有一个计算之神在操纵一切世间万物，但是所有的一些都能够计算么？似乎不是这样的。\n\
    \n### 读者阿丁：\n\n新手懵以理解“图灵停机问题”，总觉得有点神秘。万老师能解释一下吗？\n\n万维钢\n\n“可计算性”和“图灵停机问题”是计算机科学中的两个关键问题，我认为每个想要理解计算机的人都应该有所了解。今天的问答，咱们就专门说说这两个问题。\n\
    \n## 1. 什么叫“可计算”\n\n我们知道，计算机思维能给人提供一个观察世界的视角，能让我们审视自己的世界观。因为有了计算机，我们现在可以问出下面这些大问题——\n\
    \n+ 1. 计算机能解决一切问题吗？\n2. 人脑是一台计算机吗？\n3. 我们生活的这个世界，有没有可能像《黑客帝国》电影那样，其实是一场计算机模拟呢？\n\
    \n我先说结论。科学家和哲学家的当前科学理解，对第 2 和第 3 个问题，还没有答案——你只能猜想。但是对第一个问题，答案则是明确的否定：计算机不能解决一切问题。\n\
    \n那你可能会感到有点奇怪——如果计算机不能解决一切问题，那就就是说计算机是有局限性的吗？那人脑和真实世界怎么还可能是计算机呢？其实这并不奇怪，因为人脑和真实世界也可能是有局限性的。计算机有局限性，不等于是人脑就一定强于计算机，也不等于真实世界就不是计算机。\n\
    \n咱们先说说这里怎么叫“解决问题”，也就是怎么叫“可计算”。对计算机科学家来说，所谓可计算，就是给确定输入，经过计算机的有限次操作，能得到一个确定的输出。“可计算”的意思不但是“可以算”，而且是“可以算出结果来”。\n\
    \n咱们把问题简化一点。我们考虑这么一种问题，它的答案要么是“是”，要么是“否”，而在逻辑上不存在模棱两可的中间状态。请问，所有这样的问题，都是计算机可以解决的吗？\n\
    \n答案是否定的。哪怕像是“是否”这种问题，都不全是可计算的。比如说，图灵停机问题，就是不可计算的。\n\n## 2. 图灵停机问题\n\n让计算机执行一个“寻常的”程序，比如计算\
    \ 1+2+3+……这么一直加到比如说 10000，只要计算机的内存足够大，只要你给的最后一个数字是有限的，只要你愿意等待足够长的时间，它就终有算完、停机、输出一个结果的时候。\n\
    \n但是有些程序，却是永远都不会停机的。比如你可以让计算机一直循环执行下面这个命令——\n在屏幕上打印“你好”\n\n那么你就会看到计算机不断地打印“你好”这两个字。你要是不主动杀死这个程序，它就不会停机，它陷入了“死锁”。“死锁”是程序员的噩梦，有时候写程序说不定哪里没设计好，程序一运行起来就陷入了死锁。\n\
    \n所以程序员就有一个美梦。有没有一个什么软件工具，能就直接看一眼我写的程序，就自动判断它会不会出现死锁呢？\n\n这就是“图灵停机问题”。也就是说，有没有这样一个程序，它的输入是任何一段代码和这段代码的输入参数，而它的输出则是这段代码所代表的程序，在那个参数之下运行起来之后会不会自动停机——如果判断会停机，就输出“1”；如果判断不会停机、会死锁，就输出“0”。\n\
    \n想要做到这一点，这个判断程序必须只读、而不能去执行那段代码——因为如果执行，而那段代码又真的不停机的话，计算机就会陷入死锁，这个判断程序就不能输出“0”了。换句话说，这个判断程序得能像一个高水平程序员一样，看一眼你写的代码就知道其中有没有死锁。如果有这么一个判断程序，岂不是一个绝佳的\
    \ debug 工具吗？\n\n而图灵告诉你别做梦了，不存在的。\n\n在理论上就根本不可能存在那样的判断程序。这是一个不可计算的问题。\n\n为什么呢？证明非常简单，反证法。以下为了行文方便我不得不使用一点编程语言——\n\
    我们假设存在这么一个判断程序，称为 Halt(p, l)。其中 p 是 Halt 要判断是否停机的代码，l 是程序 p 的输入。\n\n也就是说，如果程序\
    \ p 运行输入值 l 的时候会停机，那么 Halt(p,l) = 1；否则，Halt(p,l) = 0。\n\n好，那么我们构造下面这么一个新程序 [1]，称之为\
    \ Z：\n\n```\nProgram (x)\nIf Halt(x, x) then\n    永远循环\nElse 停机\nEnd.\n```\n\n\
    我解释一下。Z 的输入，是任意的一段字符串 x。x 可以是一段程序的代码，也可以是一段程序的输入。Z 的规则是，如果 Halt(x,x) 是 1，则 Z 就永远循环下去，不停机；如果\
    \ Halt(x,x) 是 0，则 Z 就停机。\n\n那么请问，像这样一个程序 Z，如果把它的代码自身，作为它的输入，会怎样呢？它会停机吗？\n\n如果会停机，那这意味着\
    \ Halt(Z,Z) = 1，对吧？可是你带入 Z 的规则之中，这时候 Z 就应该不停止。反过来説，如果 Z 不会停机，那么 Halt(Z,Z) = 0，带入规则之后\
    \ Z 又会停机！悖论！\n\n所以 Halt 这样的程序，根本就不可能存在。证明完毕。\n\n这个证明是否让你想起了我们讲逻辑思维的时候说过的“理发师悖论”。Z\
    \ 就是那个“只给不给自己理发的人理发的理发师”。这个悖论的关键就在于，一段代码，既是可执行的程序，又可以作为输入的字符串。所以我理解，这个矛盾的根源在于，写代码和判断代码，都是能用语言描述的行为。\n\
    \n## 3. 不可计算意味着什么\n\n现在图灵给了一个例子，说明世界上有些问题是计算机无法解决的。计算机无法判断任何一段代码是否会停机。这说明哪怕所有问题都能用数字编码，计算机也解决不了所有问题。\n\
    \n这有什么意义呢？\n这意味着总有一些事情，你只能慢慢等着它发生，而不能事先知道它的结果。这意味着程序员必须得程序运行一下才知道其中有没有 bug。这意味着理论是有限的，必须得实践才行。\n\
    \n这还意味着，世界上有些事情，你只能看着它发生，而无法解释它为什么会发生。这是因爲你始终都无法预测它会不会停下来，又何谈什么解释呢？\n\n那也就意味着，我们不可能完全理解真实世界。我们头脑里只是世界的模型——而世界的模型不能代表真实世界。世界上总有一些事情，是你没有办法用什麽简化的模型预测的，你只能看着它发生才知道结果。这是否使你想起了我们第一季讲过的“不可约化的复杂”\
    \ [2]，和哥德尔不完备性定理……其实它们说的都是理性世界的局限性。\n\n而如果你是一善於感慨人生的人，这也就意味着，哪怕你再聪明，人生也是值得过的。总有一些事你想不到，你总得经历才知道。\n\
    \n好，下面我来回答你可能会问到的四个问题。\n\n## 第一，这里的“不可计算”，是因为不确定性吗？\n\n—— 不是。图灵停机问题完全可以没有任何不确定性。哪怕一切都是确定的，没有任何随机变量，最后结果仍然不可知。不可知不等于不确定。我十岁生日那天确定、一定、肯定吃过东西，可是我完全不记得吃的是什么——这件事不可知，但是并非不确定。\n\
    \n在一个完全确定的世界里，也有计算机解决不了的问题。\n\n## 第二，男女感情问题，是不可计算的吗？\n\n—— 好多人问我这个问题。我不是感情问题专家，但是我非常肯定地相信，感情问题是可计算的。因为人的情绪容易多变，感情问题有时候不好计算，但不等于不可计算。计算机科学家说的“可计算”是个严格的定义：只要图灵机能在有限步能算出结果来，就是可计算的。\n\
    \n事实上用计算机程序模拟一个人的脾气非常容易。至今没有任何一项属于人的特性，被证明是计算机在理论上也不能推演的。\n\n## 第三，你说的都是图灵机，是吧？\n\
    \n—— 图灵机并不是一种非常特殊的计算机，它就是我们寻常用的这种计算机。只要满足 1）数字化信息 2）数学式的、有限步的算法； 3）能停机，就是图灵机。\n\
    \n图灵机只能处理有理数，这是一个重大限制。但是没有任何证据表明，真实世界不仅仅是由有理数组成的。\n\n## 第四，可是根据量子力学，我们知道真实世界里是有不确定性的，图灵机能模拟不确定性吗？\n\
    \n—— 量子力学的哥本哈根解释认为量子随机性是真正的随机性。我们知道数学方程的解永远都是确定的，所以数学方程无法解释量子现象，那么既然如此，图灵机是基于数学的，所以图灵机就无法代替量子世界。\n\
    \n但是，图灵机可以模拟出一些假的随机数来，让你感觉就好像是真的随机一样。我们无法判断在真实世界里遇到的所谓随机现象，到底是不是外星人给我们模拟出来的假随机！\n\
    \n总而言之 ——\n\n有没有一件事情是人一定能做，而计算机一定不能做的？目前认为没有。\n\n有没有一件事情是真实世界里发生了，而计算机一定不能模拟的？目前认为没有。\n\
    \n……然而计算机仍然不能解决所有问题。这个世界就是这么有意思。\n\n注释\n[1]  这段程序来自 https://www.comp.nus.edu.sg/~cs5234/FAQ/halt.html\n\
    [2] 精英日课第一季，《一个神人的世界观》。\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_133_0.png)\n\
