    (2014).

    [2] Avinash K. Dixit and Barry J. Nalebuff, The Art of Strategy: A Game Theorist''s
    Guide to Success in Business and Life (2008).

    [3] 卓克, 07改进钥匙：你以为的“随机”都是“伪随机”，《密码学30讲》，2018.


