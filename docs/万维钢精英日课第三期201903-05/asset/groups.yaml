    # 来自日课：学点逻辑思维


    # 读者 玛珥树：


    卓克老师的科学思维课里提到过一个说法，我们数学上习惯于十进制是因为我们人类有10根手指，十进制对于我们来说是最方便也最易理解的，那么如果有一个星球，那里的智慧生物只有8根手指，那么他们习以为常的就应该是八进制的数学运算，那么我们之前所推导和发现的那些数学逻辑公式和定理还能是通用的吗？比如在十进制下，我们得出了2.3.5.7.11.13…是质数，那么在八进制下他们就一定都不是质数了，那就数学的逻辑还是否放之四海而皆准的逻辑吗？


    是的，十进制起源于人有十根手指，所以可以说是人类文明特有的一系列系统。但几何进制并不是本质，进位制就相当于表达数字的一种方言。我们跟外星人初次见面的时候确实不太适合使用本文明的语言，但我们仍然立即就可以交流数学。比如说，我拿一些巧克力豆，在外星人面前摆出几堆巧克力——

    第一堆放2颗，第二堆放3颗，第三堆放5颗，第四堆放7颗，第5堆放11颗。

    只要这个外星人懂数学，不管他们用什么语言符号，不管使用什么进位制，他总能数数，他总能发现这五堆巧克力的数目正好是前五个质数。然后他立即就可以抓起一把巧克力，摆出了13颗
    —— 当然，“13”是我们的系统，用他们的文明可能叫别的东西。

    而我一看，就知道他们懂质数。于是我微微露出了会心的微笑。

    巧克力豆是宇宙通用的。你给他12颗巧克力，他可以很容易地把它们等分成2堆、3堆、4堆或有6堆。可是如果你给他13颗巧克力，不管他是什么文明说什么语言，甚至不管他学没学过数学，他都无法再分堆——因为13是个质数！写出来是什么符号、用什么进位制，那都不是本质的。但是质数是本质的。

    我们说2、3、5、7、11、13……这些数是质数，并不是因为我们喜欢它们，更不是因为我们有几根手指，这完全不是我们任意的规定，而是因为它们具有不可分的特点。质数，全宇宙都一样。


