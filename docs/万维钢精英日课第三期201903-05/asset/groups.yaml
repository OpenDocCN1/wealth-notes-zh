    # 《计算机思维》1：冷酷无情的计算


    万维钢·糖类日课³ 今天 进入详情 ›


    《计算机思维》1：冷酷无情。


    今天开始咱们来讲一本今年4月份出版的新书，《计算机思维》（Computational Thinking），作者是两位计算科学​​家，美国的彼得·丹宁（Peter
    J. Denning）和芬兰的马蒂·泰德（Matti Tedre）。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_122_0.png)


    我们要借助这本书系统地、但同时也是快速地了解一下计算机思维 —— 我们要理解计算机是怎么回事儿，计算机能帮我们干什么，以及怎样把计算机思维用于其他领域。


    为了让你印象更深，咱们先玩一个小孩子爱玩的、小小的数学游戏 ——


    +   1. 把你出生的月份和日期这两个数字相加，得到一个数；

    2. 把这个数乘以 18；

    3. 把所得结果的各个数字相加；

    4. 把上一 步结果的各个数字再相加。


    而我能猜出来，你最后得到的那个数字是什么。答案在文稿最后的注稀里 [1]。


    这个游戏也许能让小学生感到惊奇，对大人来说就有点直白了。不过我想让你体会的是这一波操作的过程。


    你有什么感受吗？把一个两位数字乘以 18 可能让你感觉到了一点痛苦。你必须就兢兢业业准确无误地按我说的步骤操作，才能得到我想​​要的结果。你没有自我发挥的余地。


    在这个过程中，你是一个 computer。


    # 1.计算师


    Computer 这个词，现在我们都翻译成“计算机”。但是这个词最初的含义，可是是指人。早在十七世纪就已经出现了 computer，也许应该叫做“计算者”或者“计算师”。计算师不是数学家也不是工程师，他们是专门做计算的人。


    # 2.算法的妙处


    # 3.计算机思维'
  - '[PAGE 123]


    能证明数学定理。


