    Player作风


    博弈论我们已经讲完了，理论和技艺值得说的都说了，没说的你只随陨留心学习举一反三就好。这一讲我们说一点精神层面的东西。


    博弈论的首要精神是做个 “player”。这个词没有特别传神的对应中文，一般翻译成参与者、玩家或者运动员，我们干脆就叫 player。所谓 player，是能独立自主地参与博弈的人。Player
    这个身份，不太符合中国传统的身份认同。我们更熟悉的自我认同都是作为整体的一部分，我们是某个学校的学 生，是家庭的人、单位的人乃至国家的人。


    博弈论研究的是人与人合作、竞争、特别是对抗的学问，这些都不是我们日常干的事儿。我们日常不博弈，都是做些循规蹈矩的事儿。这就使得我们一旦面对真正的博弈，会表现得很不专业，可能有一些很土的行为。所以我想分析一下
    player 的自我修养。


    一个合格的 player，应该拥有四个作风——有限、务实、慎重、客观。这四个词非常简单，但是一般人根本做不到。


    ## 1.有限


    你可能终生都会参加各种博弈，但每一次具体的博弈，都不是决定终生的。博弈是有限的游戏。这一局不论是赢是输，既不会影响你是誰，也不会影响你会成为谁，你还是你。


    ## 2.务实


    我们中国流行文化中有个特别不好的东西，就是喜欢比“境界”。人们总是幻想，赢还不行，还得赢出高境界才行。


    ## 3.慎重


    Player是利益攸关的人。如果你言行会牵扯到利益，你的作风就会是慎重的。


    > "Academic politics are so vicious precisely because the stakes are so small."
    Henry Kissinger


    ## 4.客观


    - 这个博弈是什么，我想要什么；

    - 我现在有什么，我可以放弃什么；

    - 对手的情况

