    # 问答：怎样把零散的知识系统化？


    万维钢 · 精英日课3

    今天

    进入课程 ›


    # 来自日课：难以模仿的创新


    # 读者格格：


    我觉得丰田的改进是把系统的运转齿轮变得更细，这种用刮骨疗伤的极致痛感来改进确实需要很大的狠劲，但是这种向更细、更准的节奏，适应颠覆性创新吗？


    万维钢


    在一个现有的平台上不断地改进，这确实不是颠覆式创新。颠覆式创新应该是弄一个市场上原本没有的新平台，然后它一出来就颠覆了以前的老平台。但是丰田这个改进的方法
    —— 突变 + 选择 —— 也适用于颠覆式创新。它们的差别在于小改进的风险也小，大 octombrie的风险也大。


    颠覆式创新并不是从天上掉下来的。一个能形成颠覆效果的新东西，一定是自身已经长到一定程度的东西，只是以前的成长都是默默地，在等待合适的环境。


    比如说，日本车车是怎么大规模进入美国市场的呢？原本是美国人喜欢大车，日本车都是适应日本市场环境的、比较小的车，在美国没有竞争力。但是因为石油危机，油价上涨，美国消费者突然有了省油的需求，而当时日本车正好能满足需求。我们可以说这时候日本车颠覆了美国市场
    —— 因为美国汽车公司对高油价措手不及，而日本已经在省油领域深耕多年。


    所以颠覆式创新有个诅咒：一方面是总要先积累才能有力量去颠覆，如果仅仅是拍脑袋有个好主意，那别人就很容易模仿你，又怎么可能让你颠覆呢？而另一方面，如果前期没有市场，又怎么积累呢？


    所以颠覆式创新都具有运气的性质。一个办法是被动的。就是像日本汽车那样，本来只是适应本国的特殊市场，没想到世界环境改变、机会来了，就能突破。


    这个跟生物演化简直太像了。本来这个生物是本地的，因为环境改变而获得了更大的发展。


    还有像计算机和互联网的出现其实也是这个道理。本来只有军方和科研单位有使用计算机和互联网的需求，而这两个领域都不是纯市场的，都是政府给钱。但既然有需求，这个技术就有成长的小环境。在小环境里成长起来，万一将来大环境来了，就
    可以走向大环境。如果就是没有大环境，钱也沒白花。


    另一个办法则是企业主动的。是看准一个方向，宁可暂时不挣钱，拼命投入，等待时机的到来。这种突变的颠覆性很大，但是风险也很大。


    我们看iPhone一出来感觉很颠覆，但是苹果前期在其中有巨大的投入，而且其中也利用了美国政府多年栽培的技术。而早在1993年，苹果就推出过一个叫做“牛顿”的手持平板设备
    ——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_120_0.png)


    同样是领先于时代的产品，但是就没有形成颠覆效应。这是因为当时环境不允许 —— 技术条件不满足，性能差、价格贵。


    那我们能不能都等到环境允许了再搞呢？不行 —— 因为有公司会赌。那些公司会在环境还不允许的时候提前突变，不计成本地投入，这样等到环境一旦允许，别人没法跟他们竞争。这也是风险投资这些机制的逻辑。


    这种赌博有点像“有意识的演化”，相当于环境还没来的时候在实验室里先演化好。但这个实验室演化也是逐步的，每一次微小的改进还是得用类似丰田的做法，而不能追求一劳永逸。


    现在氢燃料电池汽车就是这样，目前没有市场，以后行不行也不一定 —— 取决于到时候跟纯电动车相比的性能细微差异，可是有的公司就已经投入了很多在赌了。赌，将来还有机会吃肉；不赌、只跟随，就只能喝汤。


    总而言之，颠覆式创新也是培育出来的 —— 创新，真的很像生物的生长。


    # 来自日课：演化的教训


    # 读者排鲁：


    “有意识的演化”的具体机制是什么？一些人拥有了乳糖的耐受性，真的是因为演化出了消化乳糖的基因吗？我们的意识应该不会引发基因突变。


    万维钢


    没错，基因突变本身是完全随机的，谁也不可能用意念控制基因突变。有意识的演化主要是指“表现基因”的遗传和利用文化主动提供一个对基因突变的选择。


    贫困行为模式的代际传递，传递的不是基因本身，而是基因表达。有些在贫困状态中长大的人，他们的某些特征会传递给下一代、甚至是第三代。这个知识是过去这二三十年才发现的，达尔文那时候并不知道。不过基因表达的遗传是有限的，是一种软遗传。


    乳糖耐受基因的流传，则是文化和基因共同演化的例子。某个个体因纯粹偶然的基因突变而获得了能消化牛奶的能力，如果他所在的群体并不放牧，他这个基因就没啃用，也流传不开。而如果他所在的群体正好是个游牧民族，正好又赶上了食物短缺，那么他这个能消化牛奶的能力就能给他和他的子孙后代带来巨大的生存优势，就可以流传下去。放牧，是人类主动的行为，不是以万物为刍狗的自然选择，所以也可以说“有意识的演化”。


    # 读者海角灯塔：


    现实中许多人在不停地学习，持续地努力，但是并没有取得特别大或者满意的进步或成绩。这是 是否可以理解为虽然在演化，但没有发生“突变+选择”？


    万维钢


    是的。我们看像《行星地球》这样描写地球上各种各样动物的生存状态的纪录片，一个突出的感觉，是动物们都生活得太不容易了。几乎每天都面临生死考验，一家人动不动就生离死别，食物永远短缺，找了上顿还不知道下顿在啊，为了喝口水都得冒生命危险……但是他们都很努力，说啥也要活下去。


    这才是正当的生物状态。说这个人很努力为啥没有取得重大进步 —— 难道别 人就不努力吗？一百年以前，在工业革命已经发生了的情况下，人们普通的生活状态仍然是每天工作很长时间也没有换来特别好的生活。持续努力、包括不停地学习，都是正常的。


    而取得特别大的进步或者成就，则是不正常的。那需要非常好的运气。对比到生物，那 就相当于生活在热带雨林这种特别富足的环境之中，大家不但吃饱喝足，还有精力...
