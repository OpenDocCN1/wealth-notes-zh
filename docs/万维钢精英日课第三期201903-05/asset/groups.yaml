    # 首张黑洞照片的意义


    万维钢·精英日课³

    今天


    进入课程 ›


    首张黑洞照片的意义


    北京时间4月10日晚上九点，天文学家向全世界公布了人类历史上第一张黑洞的照片。过去这一天来你想必已经看了不少的报道。今天我们精英日课专栏以对话问答的方式帮你分析一下这张照片的意义。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_70_0.png)


    先说说这次观测的重要价值吧，我看新闻发布会上说，这是第一个关于黑洞存在的直接证据。


    一 的确如此！这是物理学的又一个伟大胜利。世界上有很多自然现象是我们先观察到、一开始不理解，然后想办法提出各种理论去解释。而黑洞，则是在谁也没有观察到、甚至连做梦都没有想到
    的情况下，完全由物理学家从广义相对论出发，先理论推导出来的东西。


    一开始我们只是发现广义相对论*允许*有黑洞这种东西存在，但是是没有人知道黑洞是否真的存在。物理学家把黑洞当做一个有意思的思想实验，也可以说是一个思维玩具。


    > 但是后来居然就真的找到了很多黑洞，是吗？


    一 是的。黑洞是一个极其特殊的东西。因为光线无法从黑洞中逃出来，我们不可能直接看到它。如果是一个孤零零的黑洞，周围没有别的东西，那就完全探测不到。


    但如果黑洞周围有东西，黑洞就会左右这些东西的运动状态，我们就可以通过观察它周围的这些东西判断黑洞的存在。在这次观测之前，我们已经有了非常充分的证据，相当黑洞的存在。


    > 但是只是间接证据。


    一 只是间接证据，但是是强有力的证据。 比如天文学家观测到，在我们这个银河系的中心，有几十颗恒星，它们的运动轨迹明显是在绕着一个什么东西转。你看不见那个东西，但是你用周围恒星的轨道计算一下，发现那个东西的质量应该是太阳的400万倍。这么重，又看不见，那你说这是个什么东西呢？符合理论预期的只可能是黑洞。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_70_1.png)


    还有一种情况，如果黑洞周围没有恒星，但是有很多气体，那么黑洞的引力会“吸积”这些气体。这种星际气体都是带电的离子，它们的运动会产生磁场，它们加速之后会发出辐射，这个辐射的光我们可以看到。比如这次公布的黑洞照片，我们实际上看到的就是黑洞周围的气体发出的光，真正的黑洞是在光圈中间那个“黑黑的洞”里面。


    这个黑洞是室女A星系——也叫M87-的星系中心的超大质量黑洞，而天文学早就知道它的存在。黑洞吸积了带电气体之后，这些气体并不都掉进黑洞内部，有很多在磁场的作用下还会被黑洞再喷射出去，形成喷流。M87核心黑洞的这个喷流长度高达几千光年，天文学家早在1918年就注意到了——只有黑洞能解释这个现象。


    M87 中心黑洞喷流的实际观测图——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_70_2.png)


    黑洞喷流概念图——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_70_3.png)


    当然还有一个证据就是两个黑洞碰撞时发出的引力波。因为这些证据，我们非常相信黑洞的存在，只不过要说直接拍照这是第一次。


    > 这么一说我有太多问题了！每一个星系的中心都有一个黑洞吗？为什么这次公布的照片不是我们银河系中心的黑洞呢？


    一 现在观测结果是*几乎*每个星系的中心都有一个超大质量黑洞。这个黑洞很可能在星系的形成和演化过程中起到了关键的作用，也许在星系早期起到了种子的作用……但是我们现在还不确定。请注意，黑洞只能直接影响到它附近的一些恒星，对星系绝大多数恒星并没有影响。


    本来这次事件视界望远镜也观测了我们银河系中心的超大质量黑洞，它距离地球只有26000光年，比M87那个距离我们5500万光年要近得多一但我们这个黑洞有点小，质量只有400万倍太阳，不像M87的那个质量是太阳的65亿倍。更重要的是，我们这个黑洞的旋转速度有点快，等于说它一边动你一边拍照，照片就不清晰。


    下面这张图是M87那个黑洞在几天内的变化，可以说变化很小——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_70_4.png)


    看来观测还得讲运气啊。我看报道说在这么远的距离上观测黑洞，就如同拍摄月球上的一个椅子！所以这次是各地八个望远镜协同观测，最后照片是通过数据分析合成出来的……可这样的话，还能说这是真正的照片吗？


    一 取决于你怎么定义“真正的照片”。你拿手机给月亮拍个照片，一次成像，照片上的光线就是你肉眼能看到的光线，可以说是真正的照片。但是这种天文观测，首先照片上的颜色就不是真正的可见光线，而是对无线电波的示意图。望远镜实际接收的是无线电波。


    > 等等，那就说图中亮和暗并不是可见光的亮和暗……


    一 没错。图中的亮和暗，只是示意接收到的无线电波的频率大小，不过无线电波也是一种光，只是肉眼不可见。这么远的距离，中间可能有各种阻碍，可见光穿不过来，而无线电波的穿透力强，这就是为什么你在封闭的房间里也能收到广播。


    > 那为什么上不下不对称呢？黑洞难道不是球形的吗？


    一 这是因为黑洞周围的那些带电气体在旋转。下方气体在向我们走过来，上方的气体在离我们而去。根据相对论，光速还是一样的，但是光的频率会有一个变化，下方光线的频率变高了，上方变低了。


    所以最后这张照片其实是各地望远镜接收到的无线电波的合成。我知道所用的数据量非常大，以至于分析了两年。而且要使用软件方法排除大量的背景噪声。那请问这种合成跟“PS”有什么本质区别吗？


    一 本质区别就是PS是主观的，你想怎么美化就怎么美化，相当于艺术创作；而这个合成是客观的，是算式自动生成……


    > 是完全客观吗？没有使用任何人为的假设和判断吗？


    一 嗯……也不能这么说。噪声实在太大了，原始数据完全就是一大堆雪花点，不作任何假设直接提取结构是不可能的。数据分析者事实上都假设要看的这个东西具有某种结构。但是不一定假设黑洞结构，据我所知他们测试了几种不同的结构，结果是完全一样的。而为了保证客观，还分成四个小组各自独立分析数据，最后结果也是一样。


    行吧。称得上是一次全球合作的壮举。


    一 是的！科学发现，满足人类 好奇心，这是最大的合作动力。别忘了当初互联网的发明，也是为了满足物理学家交流数据的需求。


    > 那这次观测，除了证明黑洞的存在和再次验证了爱因斯坦的广义相对论，还有没有什么意外发现呢？毕竟“喜悦 = 熟悉 + 意外”。


    一 没有物理学意义上的意外。但是这个照片能有这么清晰，可以说就是最大的意外！照片的确带给我们一个新知识，就是M87中心这个黑洞的质量到底是多少。以

    '
  mdcn: '

    2.我在工作中每天都有机会施展我的特长；


    3.我的出色表现能够被人看到，得到认可；


    4.工作给了我足够的挑战，能够使我成长。


    这八个问题的特点是它们都是主观体验——你不用评价别人，你只需要问问自己的感受到底是什么样的。这样enum调查才有可能是准确的。


    那如果你是一个团队的领导，你应该怎么提升手下的工作体验呢？首先，你应该让员工感受到他的工作是有价值而且有意义的，有“something bigger than
    yourself”；其次，必须给员工成长的空间，即时肯定员工的业绩；第三，要解决好员工个性和团队整体之间的关系。


    所有这些说法听起来都很平淡无奇，难道不是所有公司都这么要求吗？但是魔鬼在细节之中！我们后面将会讲到，在这些问题上，大多数公司都想错了。


    * * *


    按以前尤瓦尔·赫拉利在《人类简史》和《未来简史》里的说法，公司其实是一个虚拟的东西，是人们想象出来的共同体。厂房、办公室、机器、计算机、产品、资金、员工，所有这些都不是“公司”——公司和法律、金钱一样，是一种“互联主观”，而不是什么物理上的存在。公司只存在于人的观念之中：只有当我们都相信它存在的时候，它才可以说存在。


    那么两位作者说，所谓“企业文化”，其实也是这么一个共同的想象。企业文化有用，但用处并不在我们的日常工作上。


    企业文化，就相当于孔雀的尾巴，是公司外表漂亮的羽毛。企业文化的真正作用是吸引你的注意力，让你愿意为公司工作。但是你一旦进来了，每天面对的就不再是那些羽毛了，你面对的是你的团队、周围的同事，直接的上级领导，都是具体的人和事。你会发现在公司和文化那些东西变得越来越淡，每天过的日子才是真实的东西。


    这些是企业管理的道理，但我觉得它对我们认识真实世界是一个很好的提醒。这里面有社会科学，这里有逻辑。我们很容易被各种大而化之的标签所感染，有时候分不清自己到底是跟什么打交道，可能是在向风车宣战而不自知。


    很早以前有本讲美国政客手段的书叫《硬球》，我看其中有个思想跟今天的内容有曲同工之处：对于政客来说，真正的政治是本地的。你总是跟具体的人打交道，办具体的事——而不是那些大而无当的东西。


    贯穿全书的矛盾，就是本地化的个性和全局化的共性之间的矛盾。我们后面慢慢说。


    注释


    [1] Marcus Buckingham and Ashley Goodall, The Feedback Fallacy, Harvard Business
    Review, MARCH - APRIL 2019.


