    ## 逻辑思维6：怎样使用类比


    万维钢 · 精英日课³

    今天


    逻辑思维6：怎样使用类比


    我上大学的时候曾去数学系听过一门课，讲课的老师叫余红兵。余老师特别推崇英雄人物，专业研究数学，业余研究党史。按余老师的说法，欧拉和高斯是数学里绝对的大神，如果这两位是司令，其他数学家只能算连长、排长以下。


    我记得有一次余老师讲到“高斯格点”这个课题，他忍不住发了一通牢骚。他说现在有些中学老师给学生讲竞赛题，也讲高斯格点，说这是“用图形帮助解题”，这不荒唐吗？！这是神的东西，岂容这样人来凑！


    所以按余老师的标准，你要敢于想跟高斯学点解题技巧，那纯粹是对高斯的侮辱——你不配。高斯的数学研究深不可测，就如同走过雪地的孤狸，用尾巴抹去了所有的脚印。但是，余老师说，高斯倒也是有一个方法，是我们凡人可以学的。


    那就是类比和联想。类比和联想是一回事儿。类比，就是发现不同事物之间的共同点；联想，用一个共同点去发现新的事物。


    ### 1.类比来自抽象


    上周末我们一家出去玩。那个酒店上午11点退房，那天人特别多，所有人都赶在那个点搬运行李下楼，电梯就忙不过来了。我们的房间正好在顶层，当时我上上下楼好几次，我注意到一个有意思的现象。


    ### 2.类比是分层的


    抽象其实是非常主观的动作。真实世界里的东西有各种各样的细节，抽象就要忽略一些细节。忽略哪个细节，取决于你想做什么类比。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_43_0.png)


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_43_1.png)


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_43_2.png)


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_43_3.png)


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_43_4.png)


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_43_5.png)


    ### 3.类比与争议


    类比有可能犯错误，引起争议——用诺戈登的话说，就是“引喻失义”。我们来分析一下怎么确保类比不犯错误。


    当你把 A 和 B 类比的时候，你是想说既然 A 和 B 有共同点 X，那么现在 A 正确，所以 B 也正确。但是在逻辑上这其实不一定：你得确保 X 是正确的，然后还得确保
    A 和 B 的确都是从 X 来才行。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_44_0.png)


    比如说下面这个例子——


    A 代表癌症筛查：我们要查的严一点，宁可这个人没有癌症给他查出来癌症也不要这个人有癌症没查出来。


    B 代表 MeToo 运动中打击性强奸：为了保护女性，宁可有时候冤枉一些男性，也不要让任何一个女性吃亏。


    X 代表 “宁可要假阳性，也不要假阴性”。


    X 是背后的更高一层的原则。现在 A 和 B 都符合这个原则 X，所以这个类比没毛病。


    反过来，我们也可以用类比法，去测试一个人声称的原则是不是真的原则。


    比如说，有一位女性去某公司应聘，公司把她拒绝了。你问公司说，拒绝这位女性是不是因为性别歧视呢？公司说不是，我们不录用她是因为她经验不足，我们的原则是看经验。


    那既然如此，我们就可以做个类比：如果是一位男性应聘者，有同样的经验，会不会被优先录用呢？事实上这个公司录用了一个经验还不如这位女性的男应聘者……所以它声称的原则是站不住脚的。


    这就好比说2016年美国总统大选，很多人说我反对希拉里不是因为她是女性，而是因为她是个说谎者！我完全能接受女性当总统，我只是不能接受希拉里。可问题是那些男性政客也说谎！……我们只能说你肯定还有别的原则。


    而很多类比之所以无效，是因为大家说的是不同层的原则。


    比如现在有一种潮流是允许同性像异性一样合法结婚，这可以说是把传统的婚姻原则做了一个开拓。那么有人反对同性婚姻，就做了这么一个类比：如果两个同性可以结婚的话，那两兄妹可不可以结婚？人和动物可不可以结婚？我能不能跟我的笔记本电脑结婚？我能不能跟我自己结婚？


    尤金·程说，这么类比是不合适的，因为原则的层次不一样。允许同性结婚，仅仅是改变了婚姻的性别原则而已。在性别原则之上还有别的原则，包括必须没有亲属关系、必须是成年人、必须是人、必须是生物——现在我们仅仅是改变了性别原则，可没说要改变别的原则！所以你不能这么类比。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_44_1.png)


    如此说来，当人们争论一个类比对不对的时候，其实是在争论原则。诸葛亮在《出师表》中说刘禅引喻失义，不是在批评他文学水平低，而是在说他不够讲原则，所以才有后面
    “宫中府中，俱为一体，陟罚臧否，不宜异同……” 这样的教训。


    你说一个原则，那我用类比法，给你举一个同样原则之下另外的例子，请问你同意还是不同意——不同意，你就不是真的在用那个原则。使用这个办法不是为了纱架，而是为了发现双方的分歧点到底在哪里。


    总而言之，类比是一种强大的思维方式。类比并不是纯逻辑。A 和 B 有共同点，你不能说因为 A 是对的所以 B 也是对的。A 和 B 可以类比，不等于 A 和
    B 是等效的，他们只是在某一个原则下相似而已。


    因为类比是不严谨的推理，很多人反对使用类比推理——但我认为那也不对。类比是一个非常有用的思维方式。类比可以让我们举一反三，类比可以启发我们创造新事物，类比可以让我们审视自己和别人的原则，类比可以帮助我们发现各方的分歧所在，类比可以帮助交流思想……类比的背后，是高级的抽象思维。


    《不讲逻辑的世界里的逻辑艺术》这本书，咱俩下周继续。


