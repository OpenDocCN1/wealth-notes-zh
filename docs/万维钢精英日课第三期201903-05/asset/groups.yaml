    \ >\n\n今天的标题可能激起了你的愤怒，但是别误会，这句话不是我自己说的，是我代表你说的。是你在顶层。\n\n“马斯洛金字塔”是一个把人的需求给分层的著名学说，是美国心理学家亚伯拉罕·马斯洛在上世纪四十年代年提出的人生在世，最底层的目的是生理上的，比如食物啊，休息啊，睡眠啊这些，比动物强不了多少。往上一层是安全需求，我们要求有稳定的收入，有健康的身体，不用一天到晚提心吊胆，还能给自己的家庭提供福利保障。再往上一层是关系需求，我们要有亲情、爱情和友情。这些都是哪怕再普通的人，也理应拥有的东西。\n\
    \n更往上一层，可能就有点不普通了，是声望需求。我们希望自己有所成就，在社会上受人尊敬，可以称得上是一个人物。\n\n金字塔的顶层则是“自我实现”的需求，这是人生的高境界，名利都已经不再重要了，我们只想做一些有意义的事情：我们要有所创造、有所发现，我们要解决这个世界的问题，为此我们非常乐意完善自己，提升自我，树立正确的三观，有高尚的道德，回避各种认知偏差，追求真理……\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_57_0.png)\n\n马斯洛本意是说人应该一层一层地往上走，但是后世的心理学家发现并不是严格的顺序。很多人连温饱都没有满足，就已经在追求自我实现，人的需求是复杂的。但不论如何，这个需求的分层，很容易让我们把人给分层：有的人蝇营狗苟就知道赚钱，有的人却在追求道德、科学和艺术，他们显然不是一个层次。\n\
    \n- * 1. 想想这一万元块钱能干什么吧，你可以用它给家里换个好一点的电冰箱！\n- * 2. 把这一万元存起来，可以增加你的财务安全！\n- * 3.\
    \ 想想这一万元意味着什么，它代表的是公司对你业绩的肯定，是对你的重视！\n\n- * 1. 这是一份非常稳定的工作，公司永远都需要这个岗位，你从此就不用担心被裁员了。\n\
    - * 2. 这是一个高度可见的工作，很多人能看到你的业绩。\n- * 3. 这是我们公司核心的业务，这个岗位可以让你真正看到公司是怎么运作的，能让你快速成长。\n\
    \n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_57_1.png)\n\n![](img/11c9b7c3721998fda4f24a8a7bc8cbba_57_2.png)\n\
