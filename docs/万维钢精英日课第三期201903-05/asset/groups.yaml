    其实并不是所有特性都有“功能”和“历史”问题。血液是红色，这也许并不是什么功能。有人说红色比较显眼，有利于受伤出血了让同伴来救助 —— 可是威尔逊说，很多自私自利完全没有互相帮助习惯的动物，它们的血液也是红色的，这你怎么算呢？也许血液的红色这个特性跟雪花一样，纯粹是物理机制决定的。


    接下来咱们讲一个实例，看看演化有多么厉害。


    ## 3. 一个演化故事


    生物学家理查德·伦斯基（Richard Lenski），完成了一项壮举。他从1988年开始，连续十几年研究大肠杆菌的演化。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_87_0.png)


    为啥研究大肠杆菌呢？这个东西最大的好处就是它繁殖特别快，最快每20分钟就能繁殖一代。你研究十几年大肠杆菌，就等于把人类的演化史都过了一遍。更好的是你可以把一个大肠杆菌冷冻起来，不管冻多少年之后再解冻，它还是活的！这样你就可以保留一个大肠杆菌的祖先的活体标本，让它跟它的子孙后代去进行比较。


    大肠杆菌，能让我们亲眼看见演化是怎么进行的。


    伦斯基先把同一种大肠杆菌分装在12个瓶子里分别培养。每个瓶子里装着同样的10毫升营养液，环境完全相同，但12个瓶子的演化是各自独立的。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_87_1.png)


    每瓶营养液够其中的大肠杆菌在一天之内繁殖7代。每天早上，研究者从每个旧瓶子里提取0.1毫升的含有大肠杆菌的营养液，把它放入含有9.9毫升纯营养液的新瓶子里，就这样让大肠杆菌不断演化。每过500代，研究者会把样本冷冻一次。就这样经过若干年，我们就获得了大肠杆菌的演化路线图。


    伦斯基这个实验的发现，可以说是发人深省。


    第一点，大肠杆菌始终在进化。它们的身体都变大了，生长速度都提高了。经过了十几年之后，新一代大肠杆菌的生长速度比最初的祖先要快60%。


    所以哪怕环境不变，自然选择也会通过让个体争夺资源和生育权来让一代比一代强。而且演化从未停止,即便到后期演化的速度比实验一开始的时候慢一些，大肠杆菌的体型仍然在变大，生长速度仍然在提高。


    第二点，虽然12瓶营养液是完全一样的，但是因为样品从未混合过，这12瓶大肠杆菌在演化的路上分道扬镳，可以说变成了12个不同的“种族”。


    如果让我强行用人类打个比方，那就相当于世界各地的人只要是分开居住的，哪怕环境一样，也会发展出不同的语言和文化，甚至是不同的生理特征。这一切只不过是因为完全随机的基因突变。


    第三点，研究人员一开始都是用葡萄糖来喂养大肠杆菌，2000代之后分出一组来，改成用麦芽糖培养。这就相当于大肠杆菌面对了一次突发性的环境改变！


    12个种族的大肠杆菌因为基因已经不一样了，它们最初适应麦芽糖的能力也不一样。但是又过了1000代之后，所有种族就都适应麦芽糖了。


    请允许我再次强行打个比方。这就好比说工业革命刚刚爆发的时候，的确是某些文明的适应力更强。但是经过一段时间，其它的文明最终也会适应。


    第四点，实验进行了15年之后，有一个种族的大肠杆菌，突然之间获得了能够消化柠檬酸的能力。


    营养液里一直都含有柠檬酸，但大肠杆菌这个东西本来是绝对不能消化柠檬酸的。实验人员一直往上追溯，发现这个能力来自那个种族祖上多少代的一次基因突变。那个突变，又在后来的演化中跟其他基因相配合，又过了很多代才导致了这个能力。


    可是其他的种族，因为历史上从来没有过那个突变，就始终没有获得消化柠檬酸的能力。


    我看这个故事简直可以类比太多的现象了。这里面有逐渐的进步，有发展的大趋势，有群体的奋斗，还有不可捉摸的运气因素。


    难道那个能消化柠檬酸的大肠杆菌种族做对了什么吗？难道别的种族做错了什么吗？其实并没有。纯粹是运气。只有演化思维能帮助我们理解这样的现象。


    ……以及很多别的现象。咱们下一讲再说演化思维在具体的政策制定方面的应用。


    ## 《生命视角》2：步步惊心的成长


    万维钢 · 精英日课³

    今天


    进入详情 >


    《生命视角》2：步步惊心的。


    今天我们继续讲威·威尔逊的《生命视角》这本书。我们要用三个惊心动魄的故事来讲一个道理。我先直接说道理。


    这个道理是，生命成长中的每一步，都必须有相应的环境配合。


    这也是上一讲我们说的缸贝亨的四个问题中的第四个，成长问题。生命的成长，不是搭积木也不是盖房子。“长”，和“搭建”，是完全不同的过程。长，是一个一边接受外部刺激，一边互动，一边学习，一边变成熟的过程。长，要求环境按照顺序提供正确的信息输入。


    威尔逊专门发明了一个词，叫“严格的灵活性（rigid flexibility）”。他打了个比方，这就如同你用一个专门的软件报税。不管你家的收入是什么情况，只要按照步骤输入相应的信息，软件就能自动给你生成税表。


    这个过程看起来很灵活，但实际上非常严格。软件本身不能有错误，你的输入信息必须可靠。如果发生混乱，你的税表就不对。成长也是这样。基因就是软件，环境就是输入信息。


    成长，是一个步步惊心的过程。


    ### 1. 眼睛的故事


    我们知道白内障是一种常见的眼部疾病，是眼球晶状体的透明度下降，导致光线进不来。白内障不算大病，做个手术就可以治好。我们要说的这个故事的起源，是有些例出生的婴儿，也有白内障。


    以前的医生担心，给新生儿做白内障手术，是不是有点危险呢？他们就决定等孩子长大一点再做手术。结果孩子长大了，手术做了，也成功了，光线也能进入眼睛了……但是孩子还是看不见东西。


    这是为什么呢？因为眼睛不是照相机。不会说哪个零件坏了，你修好马上就能用。


    眼睛，需要在光线的刺激之下成长。大脑不是天生就会处理视觉神经信号，这个能力是从一出生开始，一边长大一边学来的。如果婴儿阶段没有光线刺激，错过了这个成长阶段，长大以后有光也晚了。


    这就是“严格的灵活性”。成长，需要正确的环境信息输入。


    咱们再看一个例子。下面这张图是几十年前的的一个非常残忍的实验。有人把小猫养在一个四周全是竖线的笼子里。小猫看不见水平方向的任何结构，连自己的身体都看不见，只能看到这些竖直的线。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_88_0.png)


    结果小猫长大以后，它的视觉就有严重的问题。它没有办法识别物体的轮廓。


    为啥呢？因为识别轮廓的视觉功能，需要三种神经细胞共同起作用：一种负责水平方向，一种负责竖直方向，一种负责斜向。小猫幼年时期缺乏水平和斜向的视觉刺激，它的神经细胞就没有长全。


    眼睛的发育，对环境非常敏感。而这很可能就是为什么现在中国有这么多孩子得了近视。


    相同年龄段的儿童，尼泊尔儿童近视率只有3%，而中国广州儿童的近视率高达69%！这是为什么呢？进化给孩子的环境设定，是在大自然中成长。尼泊尔教育条件差，孩子比较符合这个设定；而中国的孩子大部分时间在学校学习。对眼睛来说，学校环境，可不是正常的成长环境。


    那学校环境差在哪里呢？有研究考察同样是6-7岁、同样是华裔、每天在学校里上学的时间也相同的小学生，新加坡小学生的近视率是澳大利亚小学生的9倍！这两个国家的重大区别是澳大利亚的学校教育非常强调户外活动——澳大利亚小学生每周有14个小时的户外活动时间，而新加坡只有3个小时。


    我看现在还有很多眼科专家抱着过时的观念不放，还以为是什么看书写累了导致近视，什么用眼过度，甚至还在要求学生做什么“眼保健操”——殊不知根本没有任何科学证据证明眼保健操有用。事实是现在国际主流的观点认为儿童近视的根本原因在于室外活动时间不够。


    那室外和室内根本差别是什么呢？这个目前还没有严格的定论。有可能是因为我们在室内能看的都是比较近的东西。但我看各方信息，更大的可能是因为室内光线强度不够。


    不管是哪個原因，这个道理是简单的：漫长的演化历史中，孩子每天都会花足够的时间在室外活动——孩子眼睛的成长需要室外环境。


    让孩子整天呆在室内，这是近一百年才有的事情。而这种环境巨大对人的影响绝不仅仅限于眼睛。


    ### 2. 免疫系统的故事


    成长离不开光线，成长还离不开细菌。


    以前人们曾经以为环境越干净就越健康，现在已经不是这么想了。有个概念叫“微生物菌群（Microbiome）”。我们身边、我们体内的绝大部分微生物，其实是我们的朋友。


    免疫系统不是一个机器零件，说安装就装一个、坏了就换一套。免疫系统跟眼睛一样，是慢慢长成的。免疫系统的成长，需要合适的微生物菌群环境。


    威尔逊打了个比方，人的免疫系统就好像是农场里的一家农民。农场里有秧苗，有野草，有自家养的猫和狗，也有老鼠和狐狸这些敌人。那么这个农民怎么识别哪些是秧苗和朋友，哪些是野草和敌人呢？他可不是天生就会会。


    免疫系统需要在成长的过程中慢慢摸索。它需要从小就接受各种微生物的刺激，在不断地互动和碰撞过程中学会分辨敌我，练习高达超的打杀敌人保存朋友的技巧。


    那么如果让免疫系统长期处在一个非自然的微生物菌群环境中，就等于不给他学习的机会，它就会出问题。现代医学认为免疫系统的问题不仅仅仅表现为生理上的症状，也包括心理上的症状，比如感觉压力大、抑郁、甚至是自闭症、孤独症；而且还能表现在行为上，比如恐惧、食欲不振、不愿出去和人交流等等。


    那我们想想，如果一个孩子有上面这些问题，是不是可能因为……他家里太干净了呢？


    威尔逊列举了一系列的研究来说明微生物菌群对免疫系统的作用。


    比如说，发达国家里、城市里患有免疫系统紊乱、经常过敏的症状的人，显著高于发展中国家和农村。


    有研究发现，剖腹产出生的新生儿，因为没有与产道中的菌群接触，患上免疫系统紊乱的概率就会增加。孕妇使用抗生素，可能会对孩子的免疫系统造成危害。


    反过来説，如果孕妇经常到大自然中去，接触更丰富的菌群，就对孩子有好处。而10-15岁的小孩如果经常接触大自然，他们长大后患有各种免疫系统疾病的可能性就会下降。家里微生物菌群的多样性越高，儿童患上哮喘的可能性就越低。为什么养老院里的老人总爱这里发炎那里疼？可能因为养老院太爱消毒了，那里的微生物菌群不正常。


    眼睛对人的影响是纯生理的，免疫系统的影响是生理的也是心理和行为上的。下面我们要说的这个，则主要是行为和心理上的。


    ### 3. 小鸟的故事


    像鸽子这样的鸟类有个有意思的特性：小鸟一出生，就知道跟着妈妈走。这是由于它们在鸟蛋里孵化的过程中就有了听觉，它们习惯了妈妈的声音。


    鸟蛋的蛋壳，对小鸟的感知能力发育至关重要。蛋壳能透气，对声音的穿透力也很强，所以小鸟在里面能够听见妈妈的声音。但是蛋壳不透光。小鸟出生之前，是看不到光线的。


    在1980年代，有人拿鸽子做了一个实验，他们让小鸽子提前感受到了光线。


    鸽子的鸟蛋需要23天孵化。在小鸽子出生的前两天，研究者把鸟蛋外面的硬壳给剥开，用强烈交替变化的光线去照射，刺激里面的小鸽子的视觉神经。


    里面的小鹌鹑的视觉神经。


    结果，小鹌鹑出生以后，就不会跟着妈妈走了。


    提前两天接触到光线，让小鹌鹑的视觉提前发育……从而干扰了听觉的正常发育，导致小鹌鹑出生以后听觉发生紊乱。它们无法识别妈妈的声音了。


    鸟类也好，我们哺乳动物也好，各种感知能力的成长是讲顺序的。这个顺序是先长触觉，再是空间平衡感，然后是味觉和嗅觉，然后是听觉，最后是视觉。每一种感知的成长都需要相应的外部刺激配合。


    而小鸟实验告诉我们，当你还不需要这个刺激的时候，可别让这个刺激提前出现。提前出现，就可能导致发育紊乱。


    那说到这里，你可能马上就会想到一个问题。我们对小孩的教育，会不会也有提前出现不该给的刺激这样的情况？


    你能问出这个问题，说明你有演化思维。答案是的确是这样，人类儿童的智力成长跟小鸟视觉有相似之处。


    威尔逊列举了大量的研究，说明对儿童早教的顺序非常重要。


    很多特别重视早教的家长，孩子还没出生就给播放“莫扎特音乐”，出生不久就让孩子看迪斯尼出的什么“小小爱因斯坦”DVD，强行用声光刺激。这种教育，就相当于用光线照射还没有孵化的
    小鹌鹑。


    有研究表明，9个月以前就被长时间暴露在这种多媒体环境中的孩子，他们长大之后会更容易发怒，更容易分神，不愿意集中注意力，不能推迟享乐。这有没有可能就是因为当初刺激过度了呢？


    威尔逊说的这些儿童早教的问题实在太严重了，我自己又去做了一些调研，我感觉这个问题非常重大，咱们接下来会用一讲专门说这个问题。


    这一讲我们说的是成长过程中的每一步都需要外界环境的正确刺激和配合，威尔逊为此提出一个概念叫“严格的灵活性”。


    如果一个孩子整天待在室内，他就容易近视。如果一直生活在特别干净的环境中，他的免疫系统就会有问题。如果对他的早教操之过急，就可能危害他将来的性情。


    我们今天这个生活环境，相对于人类漫长的进化史来说，是不正常的。


    这是演化思维带给我们的一個智慧。当然，这绝对不是说人就应该回归到原始社会或者农业社会那样的生活。“严格的灵活性”，只是一个理论而已，把它用在每一个具体的领域都得经过实验验证才行。我们今天讲的眼睛、免疫系统和感知能力的故事都有严格的科学验证，别
    的领域可就不一定了。


    事实上今天的人，寿命比过去长得多，哪怕晚婚晚育，生下来的孩子也是健康的。我看演化思维并不能解释这样的进步。


    但是，当你发现事情不正常的时候，演化思维可以给你提供一个解题思路。特别是，当你想要改变环境的时候，演化思维对你有一个警告。


