    ## 来自日课：博弈论10:后发优势的逻辑


    # 读者 zero:


    历史上第一个造反的，很少有成功的，这也算后发优势的一种情况？


    万维钢


    先发优势的关键在于占领。造反要想成功，就必须占领权力关键资源，比如说枪和钱。历史上大多数造反者大都是“官逼民反”模式，是被动而不是主动，是突发而不是预刻。时机不成熟，没有强烈的占领能力和占领意识，结果糟糕了自己只是把局面搞乱，给后人提供了信息和出手权。


    但如果时机合适，争夺权力绝对是一个先下手为强的业务。所谓时机合适就是当前出现了权力的真空。可能之前的领导人非常不得人心被逼下台了，也可能他死亡了但没安排好继承人，也可能是烽烟四起但各路造反者没有公认的领袖。总而言之，在这个时刻，没有掌控国家权力。


    这时候速度就是一切。有好几股势力都在争夺权力，谁能先抢到关键资源谁就胜出，而结局往往在有很大的偶然性。《独裁者手册》这本书提出一个模型，说这就好比房间里有100个人，谁只要能先说服5个有枪的人支持自己，谁就能统治所有的人。


    ## 来自日课：博弈论11:真正的诡道是随机性


    # 读者 段公子:


    万老师，是不是可以说，“阳谋”才能有纳什均衡，“阴谋”就没有纳什均衡？“阳谋”中有得好的信息对称，player之间几乎是平等的，而“阴谋”就缺这些，所以暗渡陈仓、火烧赤壁这样的玩法很难有第二次，因为它们是不平衡的。我是软件工程师，开源社区有个理念叫越开放越安全，但反而对开源的人也会说代码都开放了当然不安
    全，经常让企业领导很纠结要不要开源开放。这是不是说“开源社区”理解了“阳谋”的厉害，算是在追求一个光明的纳什均衡？


    ## 来自日课：博弈论12:怎样筛选信号


    # 读者 阿哲:


    几乎同样的商品以不同的商品价格卖给不同的消费者，但是消费者如果知道的话又会影响对商家的信任，反而影响商家利益，那请问均衡点在哪呢？


    均衡点就是既要区别定价，又不能做的太明显。你不能明目张胆地给一部分顾客一个定价，另一部分顾客另一个定价，表面上一定得是人人平等。只要你说出一个价格来，任何人来买你都得卖给人家。


    一轮一轮的套路（经过设计，发出信号，尤其是虚假信号）与反套路已经被总结成经验广泛传播。想问万老师，这种设计套路→破解套路→再设计套路→再反套路的循环，一般来说在现实世界里会存在几次？一些长久存在的简单骗术依旧好用，解密和教育收效甚微，这究竟是人性的弱点，还是道德的沦丧？


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_15_0.png)


    万维钢


    也不能说“收效甚微”。你看越是落后国家和地区才越是假货和骗术横行，发达地区的市场是相当规范的。人们在陌生的环境中可能犯愚蠢的错误，被骗子抓住弱点。如果大家都是老司机，真诚才是最好的办法。


    我们觉得今天骗子多，其实中国现在已经比过去强多了。过去中国流行过各种无比神奇的东西，比如什么“蚁力神”、“脑白金”，现在看简直是笑话。很多年轻人以为八十年代的中国人比较单纯，但事实上八十年代的产品质量和社会治安比现在差得多，有各种匪夷所思的案件。今天的骗术比过去可以说文明多了。


    下周我们将把博弈论讲完。我们要讲到博弈的演化，我们会看到，博弈能让社会变得更好。


