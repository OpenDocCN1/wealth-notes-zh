    万维钢


    今天为你特别放送一个“女生专题”，汇总了咱们三季专栏里，对女性的最新认知，对两性思维、职业生涯和成就差异的最新研究，还有对女性角色的最新探讨，还带你回忆一下日课提到过的几位了不起的女性。借此次特别放送，致敬咱们专栏的女性读者，以及所有读者的女性亲友——能有兴趣了解这些的女生，你们都很酷。


    # 一.关于女性的最新认知


    # 1.女生既擅长文科也擅长理工科


    中国最近几十年的高考成绩，都是女生领先于男生。有人说这是因为中国的应试教育更适合女生。但根据一项2014年发表的，对各国过去100年的数据的大规模综合研究，只要是公平竞争，女生的成绩是在哪个国家都比男生好。女生的确在文科更有优势，但是女生的数学水平也不差。


    # 2.女性不但学习成绩好，而且还是最好的领导者


    有人直接实验证明，一个团队中的女性越多，团队的合作水平就越高。如果一个团队全是女的，那合作水平就最高。


    # 3.女性没有主导这个世界不是因为女性被压迫，而是她们自愿的选择。


    # 4.两性成就的差异是因为两性的思维方式和人生策略不一样：女性有天赋，但是男性走极端


    # 5.女性的寿命比男性长好几年


    # 6.男女的风险偏好差异并没有那么大


    # 7."男人不坏，女人不爱"是个普遍观测到的统计事实


