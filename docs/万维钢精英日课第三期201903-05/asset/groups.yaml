    \n那好，请问有多少公司在用这个方法呢？很少很少。包括丰田的创新方法，真正能应用的公司也很少很少。甚至连听说过这些方法的人都很少。所以威尔逊感慨，推广演化思维，真是任重道远啊。\n\
