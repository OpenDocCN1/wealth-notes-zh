    2017年的一篇论文 [1] 说，荷兰的曾经若干以蒙台梭利方法教学的学校，曾经以抽签的方式录取了几百名学生，这就相当于给研究者提供了一个随机实验。而跟踪研究表明，蒙台梭利方法教出来的学生，在学业成绩上，跟普通学校没有区别。蒙台梭利方法自诩的优势是在孩子的性格养成方面，尤其是积极自主性和独立性，但是即便在这两个方面，测试表明，蒙台梭利方法培养的孩子跟普通学校出来的孩子也没有区别。


