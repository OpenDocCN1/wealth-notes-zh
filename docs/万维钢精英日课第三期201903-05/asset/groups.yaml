    # 《生命视角》3：善恶的演化逻辑


    万维钢·精英日课3

    今天


    《生命视角》3：善恶的演化


    我们继续讲戴维·威尔逊的《生命视角》。这一讲我们用演化思维解决一个古老的问题：这个世界上为什么一直都有好人、也一直都有坏人呢？


    基督教说上帝是充满善意地创造了这个世界，咱们中国也讲人性本善等，而且因果报应都是惩恶扬善。那如果是这样，损人利己的坏人要么就 shouldn''t 出现，要么也应该很快就被淘汰掉了，可是世界上为什么一直都有坏人呢？神学家和各路卫道士创造了各种理论来解释这个问题，但是说的都很牵强。


    另一方面，如果你从最简单的进化考虑，按照严复翻译的“物竞天择适者生存”这个原则，那么恰恰应该是最自私自利、最不顾一切专门抢占资源壮大自己的生物应该获得最大的生存繁殖机会。那如果是这样，世界上就不应该有舍己为人的好人存活。


    达尔文，当初提出进化论思想的时候，也曾经为这个好人的问题感到困惑。但是达尔文想到了一个答案。


    这个答案叫做“群体选择（group selection）”。是，好人可能会吃亏；但是，一个由很多好人组成的族群，因为互相帮助的缘故，相对于一个由很多坏人组成的族群，就有更大的竞争能力。好人群体就有更大的生存繁殖机会，所以好人基因就得以流传。


    > “群体中的自私打败无私。无私的群体打败自私的群体。除此之外都是注释而已。”（Selfishness beats altruism within groups.
    Altruistic groups beat selfish groups. Everything else is commentary.）


    ## 1.演化视角下的癌症


    从上世纪七十年代以来，人们就意识到，癌症，本质上是人体细胞的群体演化问题。


    这其实正是坏人的本质。坏人专门跟自己人竞争，只在乎个人不在乎群体利益。坏人的眼界太窄，竞争的层次太低。


    ## 2.母鸡中的战斗鸡


    这是一个非常著名的研究，我们前面讲巴拉巴西的《成功公式》的时候拿它说过事儿[3]，这是一个关于母鸡的故事。


    ## 3.道德的演化逻辑


    生命演化的历史中偶尔会出现一个极其罕见的现象。群体之间竞争的压力非常大的情况下，群体内部竞争就可能被抑制。这就好比说当一个国家面临战冲突的时候，国民往往就会团结起来一致对外。


    候，国民往往就能团结起来一致对外。


    而在生物界，有时候族群内部竞争会被压制到完全没有的程度。蜜蜂、蚂蚁、黄蜂、白蚁，就是这样的生物。单个的蚂蚁几乎没有智力，而一个蚁群却能表现出极其高超的智力水平。每个蚂蚁都会毫不犹豫地为了蚁群牺牲自己，结果就是蚁群是个强有力的竞争者。


    群体竞争，才是高水平竞争。


    可能因为远古时代的某一次基因变异，我们人类是所有灵长类动物中最善于合作的一支。黑猩猩也有政治，但是它们的合作都是小规模的。我们人与人的合作不仅仅局限在兄弟之间、家族内部，每个人都有可能在人类社会范围内进行合作，这才是人类真正的进化优势。


    要保持这样的合作，就必须有某种机制去限制群体内的竞争——这个机制就是道德。我们赞美好人，打压坏人。因为个体演化，坏人还是会不断出现；因为群体演化，坏人会一直被打压。


    现在西方社会的很多“白左”鼓吹的道德是包容一切，但是威尔逊说，从演化思维的角度，道德不可能包容一切行为。道德，必定有打压的一面。


    那如此说来，我们可以设想，哪怕将来人类实现世界大同，国与国之间都不打仗了，“群体选择”也不可能停止。看看人体就知道——人体是最和谐的生态组织，可是连人体内，都可能产生癌细胞！


