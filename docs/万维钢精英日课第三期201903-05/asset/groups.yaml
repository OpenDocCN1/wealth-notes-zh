    ## “自学”的学问（下）


    万维钢·精英日报³ 今天


    “自学”的学问（下）


    纳西姆·塔勒布出身于黎巴嫩名门望族，祖父一代位高权重。他的父亲是黎巴嫩的全国高考状元，名字上过报纸。不过老塔勒布对自己的状元身份非常不以为然，因为他不是全班最有出息的学生。老塔勒布毕业于一所耶稣会精英高中。他们班的倒数第一名，白手起家经商，成了全班最成功的人；另一个也是排名垫底的学生，去非洲倒卖木材在四十岁之前实现了财务自由，然后去做了历史学家。


    老塔勒布感慨，对商人和学者这两个职业来说，实际上地位跟状元之类的东西真没啥关系。所以老塔勒布没有送儿子进精英高中，他对儿子有更高的期待。他给了小塔勒布两个选择——要么就去搞钱，要么就去搞文化。


    小塔勒布选择了文化。他认为学校里教的太窄也太浅，决定不再追求什么优异成绩，只花最小的气力取得学位。他把大量的时间用于自学，他每周阅读30到60个小时——跟一般人的日常工作时间差不多——而且专门读西方经典。先是文学，然后是数学和科学，然后是历史和哲学。


    小塔勒布十八岁移民美国，继续这种马拉松式的读书，而且并没有耽误他拿到巴黎大学的本科学位和沃顿商学院的MBA。在沃顿，小塔勒布被概率和风险管理课程所吸引，他感慨老师有些东西没讲明白。比如有些极端的“小概率”事件，用流行的什么“六西格玛”分析是不对的，可是他自己不掌握更好的数学工具。他做了一个异常极端决定。


    他跑到书店，订购了几乎所有书名中包含“概率”和“随机”字样的书。他不上课、不看报纸也不看文学了，只读这些书。他用了五年时间专心研究随机现象。这段时间奠定了他人生的事业。他成了一个证券交易员，同时还在纽约大学有一个研究职位。因为他写的一本书，现在人们把极端的小概率事件称为“黑天鹅”。


    纳西姆·塔勒布，是一个自学者 [1]。


    ### 1.自学于文本


    并不是所有人都适合自学。我们上一讲说了，自学需要自信心和自我管理两方面的准备。进入具体的自学方法，自学成功的关键，在于你是否善于处理文本信息。


    文本能力是个基本功。就好像武术要骑马步一样，需要用大量的阅读时间积累出来才行，而当初塔勒布练的可是童子功。最起码你面对文字得有一种亲切感，才谈得上后面的操作。我们可以把文本功夫分成三级——


    第一级，阅读一段文字，或者听一节课，你能不能抓住它的要点。


    这是最基本的基本功。听起来并不难，但是请注意，这是一个非常主观的行为。你能看出来说什么要点，取决于你脑子里已经有什么东西，和你当前的视角。有人读《红楼梦》读的是爱情，有人看的是政治，还有人看的是菜谱。其实看什么都可以，你能看出东西来，跟自己的东西发生连接，就算有功夫。


    练习这个功夫的方法是记笔记。我以前说过一个“强力研读”的做笔记方法 [2]。而在这一歩，更简单的方法是使用所谓“康奈尔笔记法”。把一张纸分为左、右、下三栏，如下图所示——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_116_0.png)


    读书或者听课的时候在右边记下你看出来的“要点”，复习的时候在左边栏相应位置写下“线索”，在下面栏写下“总结”。注意一定要使用自己的语言，最好跟自己已经会的东西发生连接。


    这个方法能帮你把信息变成长期记忆。要做到看见线索能想起来要点，看见总结能背出来线索。做到这一步，就算把一本书“从厚读到薄”。


    第二级，是有一个问题，你能不能从一堆书里找到答案。


    一个问题要是用搜索引擎就能解决，那就不太简单了。我们关注的是你在学业中自发地冒出来的大问题。比如你用一本中国出版的教科书学量子力学，公式和做题你都会了，但是你感觉自己对“不确定性原理”这个概念没有搞清楚，那你怎么办。


    你应该看看别的书是怎么讲的。别被课本限制住，只有那些建制派才在意课本。课本只是指向月亮的一根手指，我们追求的是月亮本身，多参考几根手指更容易定位。


    有时候你会惊讶地发现像“不确定性原理”这么基本的概念，不同的书讲法都不一样，而有的书明显是讲错了！这能让你收获一段巨大的自信力！你的见识，超过了那个作者。


    第三级，是建立自己的系统。


    知识是个系统。而作为自学者，你的个人知识系统应该是具体的——也就是说你得把它写下来。你应该对每一个课题都有一个笔记本，根据自己的思路划分章节和专题，用自己的语言整理好所有的要点、心得到应对技巧。


    这个系统是你自己的，而你的关注点跟别人完全不同，所以没必要事无巨细地总结你认为没意思的知识点。不要平淡的废话，不要花哨的脑图，要字字见血直指人心。


    但是这个系统得有一定的完备性。最好从学习一开始就有所有规划，这门学问有哪些要点和问题，你要得到什么，相当于一个自己给自己的教学大纲。


    完备性的好处是能让你发现系统的漏洞。就好像武侠小说里练到一定程度发现自己还有缺陷一样，你需要另外再想办法弥补。系统要不断地增长。


    面对一个形成实体的系统，你会一种强烈的成就感。我上大学的时候有好几个笔记本。为了准备GRE物理专项考试，我还弄了一个综合所有课程的复习要点手册。那个手册其实对别人没用，但我当时的成就感实在太强，以至于专门让校印刷厂把它装订成了一本小书的样子。


    有了系统，你在文本意义上的学习就算差不多了。但是文本学习还远远不够。


    ### 2.自学于操作


    我们学习并不是为了—句话能说出个一二三四、ABCD，摆个有学问形象。我们学习是为了应用。你需要在实践中得到反馈。


    自学，是以我为主的学习，而不是“自己一个人”学习。你需要找人切磋一下，参加一个什么测试甚至比赛，跟人过招，才知道自己学到到底怎么样。


    现在人们对网络公开课的一个诟病就在它在反馈这方面不如线下。不过考虑到大多数人在学校里上课的时候也没有得到太多反馈，我倒是觉得为了网课的高效率而牺牲一点点反馈机会是值得的。但是你仍然需要反馈。


    而且你不需要等到实际工作才能获得反馈。你至少可以把自己的作品放网上让人看看。而且数学和编程这样的项目特别适合自学，因为会不会、做得对不对，你立即就能知道。习题答案和计算机运行结果就是给你的反馈。


    我儿子上了一个奥数班——请注意，在美国，各种奥数活动都是合法的。这个班每周只有一小时的课，老师留的作业也不多。但就是这样，还有些家长说孩子只是来享受数学，并不跟着参加比赛。我对此不太理解。


    数学和编程不是文化欣赏项目。对于一个严肃的学习者，这些是训练项目。上课只是提供一个交流平台，可能还有点仪式感，真正的功夫都在自己的练习之中。你的信心和水平只能在每一次成功解题和程序成功运行中提高。


    真正的程序员不可能去专门报个什么班来学习一种新出的编程语言。我看程序员都是在实践中学习，是先有一个什么需求，现用现学。传说在腾讯的QQ——以前叫OICQ——刚刚兴起时代，马化腾有一次突然想到需要有点网络安全管理，就让一个工程师设计一套安全系统。工程师的解决办法就是现用现学——过了几周马化腾去看他的进展，发现他正在阅读一本有关网络安全的教材：……“第一章：什么叫网络安全”。


    现用现学听起来有点不靠谱，但这才是最原始的学习冲动和最实在的学习行为。我要学，我不会，那我就学呗？


    要用，我不会，那我就学呗？


    科研中的常态是这样的。比如做这个研究，我们需要用到一个叫做 Matlab 的数学编程语言。你没用过 Matlab，这不是借口，而且我们等不了你去上什么 Matlab
    网课。你要做的是上网找个最简单的教程现用现学，先把这个问题对付过去再说。


    现在人们对 YouTube 和 B 站的一个用法，就是想干什么事儿不会，上去看看别人干这事儿的视频。我就曾经跟着 YouTube 给厨房换了一个下水道搅拌机，还给汽车换了个门把手。


    这种自学可以说是“自学于无形”——不需要什么仪式，没有那么多情绪波动，我们需要用啥就能学啥，学啥就能会啥——这岂不就等于说，没有我们不会的东西了吗？


    而反过来説，大多数人学英语最大的问题恰恰是学而不⽤，把学英语变成了健身项目和行为艺术。


    我有个朋友告诉我一个离奇的故事。说在清华大学，有一个美国留学生和一个韩国留学生，相爱了。美国人不会说韩语，韩国人的英语也不行——结果这俩人居然是对照着中文字典谈的恋爱。我觉得这个故事能激励你在实践中自学。


    ### 3.从自学到精通


    一个需要啥就能学啥，学啥就能会啥的人，必定是一个高自尊的人。他对生活有强烈的掌控感，无所畏惧，游刃有余，宠辱不惊。这个 autodidact 气质，比任何学历证书都更令人尊敬，比财务自由更令人羡慕。


    终身学习是一种修行。一个autodidact，修行的不仅仅某个具体的技能，更是人格的自我完善，是自身潜能的最大发挥，是我们前面讲过的那个 “Eudaimonia”。


    修行者都讲内部驱动，但我认为外部驱动也是不可少的。以我之见，自学者所应当追求的最高级外部驱动，叫做 “Mastery”。


    这个词通常翻译成 “精通”，但是它可不是一般意义上的精通。达到 Mastery，意味着你对这个领域具有统治力。


    纳西姆·塔勒布用五年时间达到了对 “风险” 这个领域的统治力。现在全世界没人能跟塔勒布平等辩论有关风险的问题，连预测界头面人物 Nate Silver 都不敢正面刚
    [3]。塔勒布说他坐飞机时候最喜欢的娱乐是在 Twitter 上跟人论战，可是现在愿意跟他论战的人不多了。尤其是风险问题。


    你敢不敢给自己一个这样的要求。Mastery 的境界，是哪个大学、哪个老师都教不出来的。自学是你唯一的途径。


    注释

    [1] 以上事迹来自维基百科和塔勒布的《反脆弱》一书。

    [2] 精英日课第一季，《说好的读书笔记来了》。

    [3] 精英日课第三季，《哪种不确定性？什么黑天鹅？》


    ## 总结：演化的智慧


    万维钢 · 精英日课³ 今天 进入课程 ›


    总结：演化的智慧


    万维钢


    今天我们带你把《生命视角》这本书做个总结。这本书提到的“演化思维”，跟我们学过的达尔文进化论有什么不同？它提供给我们什么样的思维工具和世界观？如何用演化思维的视角看待道德和意志、个人和群体、传统和创新？希望通过今天的复习总结，你能对演化有更深刻的理解。


    # THIS VIEW OF LIFE

    Completing the Darwinian Revolution

    DAVID SLOAN WILSON


    书名：生命视角：完成达尔文的革命（This View of Life: Completing the Darwinian Revolution）


    作者：戴维·斯隆·威尔逊，美国著名进化生物学家，丘纳姆顿大学生物学与人类学教授，公认的大师级人物。


    出版日期：2019年2月


    核心内容：如何把演化思维应用于社会经济领域。两个关键思想，一是群体演化，二是文化和基因共同演化。


    ## 五个概念


    【严格的灵活性】：rigid flexibility。如同你用一个专门的软件报税。不管你家的收入是什么情况，只要按照步骤输入相应的信息，软件就能自动给你生成税表。这个过程看起来很灵活，但实际上非常严格。软件本身不能有错误，你的输入信息必须靠谱。如果发生混乱，你的税表就错了。成长也是这样。基因就是软件，环境就是输入信息。


    【先天性的】innate。是你继承来的东西，包括与生俱来的基因编码和世代传递的文化模因。先天性的东西是不自由的，很多表现为潜意识的行为。你可能每天都在这么做，但是是不自知。


    【适应性的】adaptive。“适应”是进化论的常用词汇，但在 prioritize 指那些在基因编码和文化传承之外，你后天主动适应当前新环境的行为。适应性的东西，是你可以自我改变的。


    【社会基线模型】Social Baseline Model。这个理论说，人类在过去数万年间的演化历史中，我们基因经过各种各样的环境变化 —— 而不管自然环境怎么变，只有一个因素是不变的，那就是我们人类是群居动物。我们一直生活在一个合作性的、紧密联系的群体之中。


    【有意识的演化】conscious evolution。意思是说我们可以有意识地选择自己的演化方向。


    ## 四个工具


    第一个问题是“功能”：这个东西有什么用？比如说，人的手有什么用？手可以抓东西，而抓东西有利于人的生存。用演化思维分析，一个东西的用处必定是帮助生物适应环境。


    第二个问题是“历史”：这个东西是怎么一代一代从远古演化到今天这个样子的？比如人的手，是从远古时代鱼身上的鱼鳍演化过来的。


    第三个问题是“机制”。这个东西的物理机制是什么？人的手有肌肉、骨头、肌腱，还有神经系统等等，它们共同作用才能实现抓东西的功能。生物化学、分子生物学、神经生物学等等这些学科，都是研究机制的学问。


    第四个问题是“成长”。这个东西是怎么生长出来的？人的手，是从妊娠第五周开始就开始生长了……


    对演化思维来说，物理机制并不重要，我们最看重的功能问题和历史问题。


    ## 演化VS成长


    + 1.生命成长中的每一步，都必须有相应的环境配合。长，是一个一边接受外部刺激，一边互动，一边学习，一边变成成熟的过程。长，要求环境按照顺序提供正确的信息输入。2.鸟类也好，我们哺乳动物也好，各种感知能力的成长是讲顺序的。这个顺序是先长触觉，再是空间平衡感，然后是味觉和嗅觉，然后是听觉，最后是视觉。每一种感觉的成长都需要相应的外部刺激配合。3.当你还不需要这个刺激的时候，可别让这个刺激提前出现。提前出现，就可能导致发育紊乱。4.成长，是一个步步惊心的过程。


    ## 演化VS道德


    + 1.生命演化的历史中sometimes会出现一个极其罕见的现象。群体之间竞争的压力非常大的情况下，群体内部竞争就可能被彻底压制。这就好比宾馆里一个国家临战的时候，国民往往就能团结起来一致对外。2.在生物界，有时候族群内部竞争会被压制到完全没有的程度。蜜蜂、蚂蚁、黄蜂、白蚁，就是这样的生物。单个的蚂蚁几乎没有智力，而一个蚁群却能表现出极其高超的智力水平。每个蚂蚁都会毫无犹豫地为蚁群牺牲自己，结果就是蚁群是个强大的竞争者。3.群体竞争，才是高水平竞争。4.可能因为远古时代的某一次基因变异，我们人类是所有灵长类动物中最善于合作的一支。黑猩猩也有政治，但是它的合作都是小规模的。我们人与人的合作不仅限在兄弟之间、家庭内部，每个都有可能在人类社会范围内进行合作，这才是人类真正的进化优势。5.要保持这样的合作，就必须有某种机制去限制群体内的竞争——这个机制就是道德。我们赞美好人，打击坏人。因为个体演化，坏人还是会不断出现；因为群体演化，坏人会一直被打压。


    ## 演化VS基因


    + 1.基因传递给我们的不只是生理特征，也包括“行为”的模式。2.人有思考、判断和理性决策的能力。只要行使这些权力，人理应能摆脱基因的枷锁。更何况人是一种聪明得多、也复杂得多的动物。并没有像什么化学物质、荷尔蒙或者激素的动作那样因子的因素单方面决定人的行为模式。3.但是，人毕竟也是动物。我们也要受到基因的控制。荷尔蒙、幼年时所受的照料，外部的环境，共同决定我们的行为模式。4.富足环境下的应对策略和艰苦环境下的应对策略，其每个人的基因里都有——只是一个开启问题而已。5.最新的演化思维带给我们三个好消息。一个好消息是我们继承的其实不是哪个特定的行为模式，而是各种写满了“IF……THEN……”的程序。另一个好消息是，文化可以改变我们。第三个好消息是，人还有创新能力。6.你的确有选择的自由。但是，与其选择压制本能，不如选择利用和引导本能。7.学新东西，得跟继承的旧东西配合才好。


    ## 演化VS学习


    + 1.演化思维的学习方法，恰恰就是 学习 = 突变（variation）+ 选择（selection） 2.具体到教育孩子，演化思维给出了一个“黄金法则”，总共三句话：对好行为要给丰厚的奖励；对坏行为要给温和的惩罚；实在不行，再让惩罚升级。3.借助演化思维改变自己的方法，是一个建立大局观和对集体的归属感。


    ## 演化VS创新


    + 1.改进 = 突变 + 选择 2.对公司创新来说，“突变”有两种方法。一个是公司看看现在有什么新做法可以借鉴，拿过来一个一个主动测试。另一个就是像田间那样，不知道问题在哪里，但是知道一定有问题，在实践之中随时发现可以改进的地方。3.而在“选择”这一
    步，我们得先有一个标准。这个标准可以是增加销售额利润，提高生产效率，或者研发新产品。不管是什么标准，有标准就有了“选择压力”，用

    么标准，有标准就有了“选择压力”，用这个标准判断哪些突变应该坚持，哪些应该忽略。

    4.更激进的创新方法，叫做“快速结果法（Rapid Results）”。一个企业在平时正常运行的时候，一般不容易看出来哪个地方需要改进。但是如果这个企业突然面临一个大事件，导致一次超水平发挥，你观察一下大家都有那些超常的表现，这就是一个改进的思路。

    5.复制是有限的。哪怕一个新物种再有效率，它也不会迅速占领整个地球！它要受到地域的限制，可能离开熟悉的一方水土就无法繁衍下去，也许它只能在本地生长。把基因带掺到类似的群体中去，有可能需要很长很长的时间。


    ## 演化VS群体


    有演化优势的群体的八个特征：


    + 1.要有群体认同感。整个群体应该要有一个共同的目标，比如为了可持续的美好生活，我们都想把渔场维护好。这也就是所谓“意义”。

    + 2.群体成员应该按比例共同承担利益和花费，不能让谁占便宜、谁吃亏。

    + 3.每个人对群体决策都有发言权。本地人知道本地是怎么回事儿，决策不能让几个领导关起来拍板决定。小群体成员本来就不多，应该大家一起商量。

    + 4.得有一定的监督。如果有人做出伤害群体的行为，群体得知道。

    + 5.渐进式的惩罚措施。一开始发现有人违规，你可以非常友好地提醒他一下。如果不行，再把惩罚逐步升级。

    + 6.发生冲突应该公平、快速地解决，不要让矛盾生长。

    + 7.群体应该有一定的自治权。本地事物本地决定，不应该由群体之外什么权威人士告诉我们该怎么做。

    + 8.以上说的这些原则可以应用在各种尺度上。我们说的是个人组成的小群体，但小群体组成的大群体也可以这么办，只要把其中每个小群体视为一个个体，各自派代表参与大群体事物就行。


    创新中心该有的七个特点：


    + 1.是打破规则、敢于梦想。这个地方得比较自由，能吸引不愿意墨守成规的人。

    + 2.要开放，要互相听取意见，要合作。

    + 3.要有互信的精神。创新者得能信任别人同时还能被信任。在硅谷，如果一个人有损人利己的行为，不用法律惩罚，他在硅谷这个圈里就混不下去了。

    + 4.要鼓励实验和迭代。创新过程就是突变和选择。

    + 5.要公平。创新园区里的一个公司不应该谋求对其他公司的什么压倒性的优势，得公平竞争。

    + 6.允许犯错误，允许失败，还要有韧性，失败了还能再起来。对失败友好的地方，创办新公司才容易，创新才可能。

    + 7.为了鼓励别人到你这儿来冒险，你可以预先给一笔投资，然后别太在意回报。


    ## 演化VS教训


    演化思维带给我们三个教训。


    第一个教训是群体演化会在各个层次上发生，我们追求整个地球上所有的生命一起协调发展，要避免那些低层次的恶性竞争。


    第二个教训是演化给了我们学习和进步的方法—突变＋选择—而不是靠中央计划。


    第三个教训是演化要逐步进行，不能操之过急，成长可能有窗口期。“日拱一卒”，每次改变一点点，慢慢地改革。


    ## 若干金句


    + *我们每个人身上都背负着基因的枷锁——这些都是演化留给我们在富足或者艰苦环境中的生存策略——只是有些人幸运地开启了正好适合的基因表达而已。

    + *从自由不自由的角度来说，基因带给我们的是枷锁。但是从生存的角度来说，基因决定的行为模式其实是我们的生存本能，是预装的软件，是出厂设置的能力点。我们应该为拥有这些不用学就会的能力而感到庆幸。我们是生命演化传承的产品。

    + *文化是对人的赋能，文化让人更自由了。

    + *复制是有限的。哪怕一个新物种再有效率，它也不会迅速占领整个地球！

    + *丰田就是这么一点一点“长”大的。它身上也许没有哪个细胞能理解全局，但是整个身体却能运行良好。

    + *群体中的自私打败无私。无私的群体打败自私的群体。除此之外都是注解而已。

    + *政治家和政治科学家这两种职业之间的关系与细菌和细菌学家之间的关系大致相当。

    + *「人生而自由，却又无往不在枷锁之中」———卢梭。


