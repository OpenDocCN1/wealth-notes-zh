    # 《计算机思维》3：全新的科学


    万维钢·精英日课³

    今天

    进入课程 ›


    《计算机思维》3：全新的科学


    今天我们继续讲《计算机思维》这本书。我们要讲一个发展建设的故事——不过这里发展建设的不是一个公司也不是一个国家，而是一门新科学。我希望这一讲能增加你对“学问”的亲近感。


    你有没有过这样的想法：现在各个学科都要用到计算机，那为什么还要有一个单独的“计算机系”呢？这是大学在瞒一个浮夸的热点吗？是为了应市对程序员的巨大需求吗？不是。


    计算机科学系，不是给程序员提供职业培训的地方。计算机科学系是研究计算机的地方。我们来讲解“计算机科学”是如何发展壮大的，它为什么是一门“科学”。


    不要低估天下英雄。不要以为只有像爱因斯坦的广义相对论才算了不起。计算机科学里，也有层出不穷的高妙思想：……这是一个想法产生技术，技术刺激想法，想法又产生新想法的故事。


    # 1.自然科学的荣誉感


    从外面远处看一个很大的东西，你容易把它当成一个整体；而如果深入其中，你会发现它的各个部分之间存在严重差别。比如外国人在中国以外谈论中国，中国是一个标准化的形象——但是咱们中国人知道，中国的各个地区发展很不平衡，中国很复杂。


    大学也是这样。对一般高中生来说名校都很厉害，都是有光环的地方。而真正身处大学里面，它的各个科系其实是有区别的……这里面有个格调问题。教授们常常互相瞧不起，学科之间有个鄙视链。


    当然你也可以说这是“对小区别的自恋”，但这个小区别是存在的。我以前上大学的时候，有一次有个从美国回来的人作物理报告，说的是用计算方法解决物理问题。听完报告后，有个我很佩服的老师私下对我说，那人搞的东西“不是学问”。这位老师是个理论物理原教旨主义者，认为只有超越这种东西才是真学问，计算物理只能算是玩花活。


    我不是搞超理论的，但是我完全能理解这个态度。这是科学家的荣誉感。而在所有学科之中，自然科学能给人提供最大的荣誉感——理解自然现象，是最纯粹科研趣味。比如我们前面讲过“快速射电暴”这个现象[1]，老百姓对它感兴趣是因为把它当成了外星人发的信号，而在科学家看来，就算它跟外星人没关系，只要它是一个我们尚未理解的自然现象，它就是有意思的——因为这是大自然本身的东西！


    反过来说，如果你研究的是某款电动车的发动机，你搞了一个什么技术革新，哪怕这项革新有潜力带来巨大的利润，那也对不起，你这个入不了科学家的法眼——因为它不是一个自然现象。你研究的是个人为的东西。也许在这款电动车的架构之下有这个问题，换一个平台，可能你这个问题就根本不存在。所以这个鄙视原则是——


    自然的高于人为的


    那我们想问，“计算机科学”，是自然的还是人为的呢？


    1962年，普渡大学建立了美国第一个计算机科学系，紧接着斯坦福大学也建立了一个。按当今中国的实用主义价值视来这肯定是好事利，但是在当时，可是引发了很大的争议。其他系的教授们纷纷声讨，说“计算机科学”算什么学问，何德何能，居然要开山立派成立新系呢？


    当然这个灵魂拷问的背后还有一个利益的争斗。成立新系会把其他系的学生、经费和人员编制分流出去，等于是在削弱现有的系。电子工程系的教授完全可以说，我们也可以教计算机课啊？


    这就给早期的计算机科学造成了一个重大的选择压力。计算机科学系要振起，就不能仅仅是一个培训程序员的地方。计算机科学家必须在企业研发之外，搞出一些有学术味道的东西，得有拿得出手的发现、能提高大学的声望才行。


    其实他们不用担心。事实证明，计算机科学里中有太多拿得出手的发现了。


    # 2.从技术到科学


    人们研究计算机的初衷，无非是想实现自动化，搞自动计算或者自动控制，解决生产力问题。计算机是一个技术。但是计算机科学一旦成型，它自身的发展就跳出了纯技术的维度。


    《计算机思维》这本书举例了计算机科学的各种进步，请允许我大言不惭地做个总结，我认为它的发展可以分为三个方面——


    +   初级，是怎么更好地实现自动化，主要解决应用问题；

    中级，是研究“计算”这件事儿本身，上升到了类似于自然科学的层面；

    高级，则是把计算思维用到其他科学领域中去，是带来认知升级。


    咱们先说初级，也就是自动化。


    1940年代刚刚发明电子计算机的时候，大家都使用所谓“汇编语言”，是让人说机器的语言——直接把机器指令写在打孔卡上，给计算机读取。这个做法对人的要求实在太高了，费时费力不说，还特别容易出错。那么一个自然的需求就是，能不能让人按照容易理解的思维写程序，然后把写出来的程序自动翻译成机器语言呢？


    这就是所谓高级编程语言。1957年，Fortran语言被发明了，这是一个科学计算语言，特点是特别容易写公式。1958年，LISP语言出现，这是一个极其强大的符号处理和逻辑运算语言，甚至可以用于人工智能设计。1959年人又发明了COBOL语言，用于商务数据处理编程。


    然后要方便人们在一台计算机上操作，你就得有账号管理，得安排不同的程序同时运行，那么你就得有操作系统，你就得有系统思维。要想开发出来的软件好用、可靠、容易维护，你就得有工程思维。接下来还有了互联网，你需要网络思维和安全思维。


    所有这些自然生长出来的东西都是学问。再进一步，编程*思想*也在演化。传统编程语言是线性式的，程序员思维模式是操控计算机。后来要把软件做得很大的时候，出现了“面向对象”的程序设计。这是不一样的思维模式，程序员想的不是再操控计算机这一台机器，而是“类”和“对象”：每个类和对象就好像是一个小机器一样，是这些虚拟的小机器之间在互动。


    那么随着编程语言的发展，同时计算机硬件也在变得越来越快、越来越普及，基础教育界就把编程技能，看得和阅读、写作和数学一样，被认为是人人必备的第四个技能。


    但这些还都是比较浅层的计算机科学。


    # 3.从计算自身到“计算宇宙”


    计算机科学真正成熟的标志，是“计算机”这个东西，和“计算”这个行为本身，成了研究的对象。


    1967年，三个计算机科学家在《科学》杂志上发表了一篇文章，说现在计算机科学已经称得上是一门真正的科学了：就好像动物学研究动物、植物学研究植物一样，计算机科学，研究计算机。


    我以前听过一个说法，说真正的程序员，都认为计算机是有生命的。你得把计算机当做一个独立存在的东西才行，它有自己的脾气，有自己的特性和性格。要想操作好计算机，你得像动物学家理解动物一样，去理解它才行。


    这个感觉对外行来说可能有点奇怪。难道计算机不是人类设计制造的吗？怎么人类还不理解计算机呢？但事实就是如此，你能设计制造它，你可不一定就完全理解它。发明围棋的人并没有完全理解围棋。也许计算机是人类释放出来的一种怪兽！


    比如说，如果几个用户同时使用一台计算机，操作系统必须给他们分配计算机CPU时间，那么如何分配呢？你在理论上设计得再好，不上机去测试一下就永远不知道结果会是怎么回事儿。你得把计算当成一个生物，在它身上做实验。


    与此同时，“计算理论”也在发展。给你一个问题，你能不能估计一下它的难度有多大。计算理论最关心的是，随着问题复杂度上升，计算时间是线性增长呢，还是指数增长？如果是线性增长，我们认为它是一个“简单”问题；如果是指数增长，它就是一个“难的
    (hard)”问题。


    难的问题，计算机就帮不了太多忙。你就得想点别的办法。那么给你一个复杂问题，我们怎么把算法化，怎么拆解它？解决这个问题的信息结构应该是什么样的？什么样的问题是可计算的，有没有什么问题是不可计算的？'
  - '[PAGE 127]


    优化这个算法，来提高运算速度呢？再比如如果让你凭空发明一个编程语言，你应该怎么做呢？


    这些问题似乎像是工程上的，但又带有很强烈的数学味道！其实它们本质上是数学问题。现在有很多应用数学家就在专门研究这些问题。


    *


    到1990年代，计算机科学的江湖地位就算竖立起来了。人们甚至提出，计算，是在传统的理论和实验这两条路之外，第三条科研道路。但是紧接着的发展超出了计算机科学家的预计……其他学科，开始抢占计算机科学家的地盘。


    人们突然意识到，“计算”是个非常基础的逻辑，到处都是计算。生物学家说，DNA就是一个计算系统，DNA复制就是计算操作，生命本来就是一个计算现象！我们要用计算的眼光来研究生命。


    物理学家也可以说，基本粒子的运动就是信息交换啊，物理定律就是计算。


    甚至有人提出，整个宇宙就是一台计算机——我们很有可能是生活在一个计算机模拟之中。这个思想我们专栏以前讲过 [2]，其实缺乏足够的证据支持。


    但是我们现在想想，如果没有计算机科学，人们再怎么想，也很难想象宇宙是一台计算机——你根本就不会有这个概念！


    所以说，计算机科学绝不仅仅是解决自动化问题的学问，它还有计算机和计算理论自身的学问，它还给了我们一个非常不一样的观察世界的眼光。


    你是不是体会到了一点学术的魅力。一门科学就好像有生命一样，它不但要发展壮大，而且要在不同的维度上发展壮大。计算机科学就好像一棵树，它不但越长越高枝繁叶茂，而且在成长的过程中这棵树本身还在脱胎换骨，你过段时间一看树的材质都和以前不一样了。然后这棵树还影响了别人的认知，让人反思到底什么叫做“树”，甚至怀疑自己和整个世界就是一棵树……


    咱们还可以把计算机科学跟那些幻想小说里的魔法和修仙的世界做个类比。这门学问的发展，就如同一个人刚出道的时候被人看不起，但是他有很多奇遇，今天学个大招明天升级一项技能，然后过了几十年换了筋骨，再过几百年居然成仙升天了——同时他还带给我们一个全新的世界观……只不过，真实世界里学问的奥妙，比魔法世界那一套更复杂也更精彩。


    我看修计算机这个事儿，一点都不比修仙低级。


