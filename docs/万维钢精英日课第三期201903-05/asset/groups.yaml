    # 《生命视角》1：演化思维的四个工具


    万维钢·精英日课³

    今天


    《生命视角》1：演化思维的。


    今天开始我们来讲一本2019年二月出版的新书，进化生物学家戴维·威尔逊（David Wilson）的《生命视角：完成达尔文的革命》（This View of
    Life: Completing the Darwinian Revolution）。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_86_0.png)


    进化——或者更严格地说应该叫“演化”——可以说是物理学之外最重要的科学思想。作为生命，演化就是我们的天道。时至今日，演化的思想早就不只是关于物种传宗接代的了，已经从基因的演化扩大到了行为方式的演化、社会合作模式的演化、文化模因（Meme）的演化，乃至于技术进步的演化，达尔文进化论可以用來解释很多事情。


    以我之见，进化论是一个门槛极低、但是也非常容易让人犯错误的学说。很多科普作家，包括一些科学家都经常误读、误用进化论，而且有很多进化论课题在学术界仍然在争论。我们选的这本书的作者戴维·威尔逊，是公认大师级的人物，我们可以跟他学一点最正宗的演化思维。


    这本书说的不ürgen进化论本身，而是如何把演化思维应用于社会经济领域。面对一个社会经济现象，演化思维能帮你分析它是怎么来的，它会向何处演变，你可以用什么傢的政策去影响它。


    这是一种非常高级的思维方式。今天这一讲咱们先梳理一下演化思维的几个工具。

    演化思维，跟寻常的物理学思维，有什么本质区别呢？


    # 1.设计的和天然的


    下面图中是一个典型的雪花——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_86_1.png)


    雪花为什么是这样的？你大概早就知道，雪花之所以具有正六边形旋转对称性，是水分子晶体结构决定的；你还知道雪花的形成是在空气中先有一个小小的微尘颗粒，然后无数水分子附在上面生长出来的……而有关雪花的所有说法，本质上都是物理知识。是物理定律要雪花长成这样，没有别的原因。


    那么我们再看下面图中这个东西——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_86_2.png)


    是一个带把手的、比较粗糙的金属网，差不多像人的手掌那么大，网格是一个凸出的半球形。请问这是一个什么东西？它为什么是这样的？


    威尔逊每次讲课说到这个东西，人们一开始都猜不出来。有的说是打球用的，有的说是采集什么东西用的，有的说为了保护身体的某个部位用的……

    其实这是一个牛油果切丁器。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_86_3.png)


    不管你是怎么猜的，你一定注意到了一个点：这个东西跟雪花有本质的区别。雪花是自然形成的，而牛油果切丁器是为了一个什么目的设计出来的。只用物理定律，解释不了这个东西。


    # 2.四个演化问题


    诺贝尔奖得主、荷兰的动物学家，尼古拉斯·廷贝亨（Nikolaas "Niko" Tinbergen）提出，想要全面理解一个演化出来的特性，我们需要回答四个问题。这四个问题，就构成了演化思维的四个工具。


    第一个问题是“功能”：这个东西有什么用？

    比如说，人的手有什么用？手可以抓东西，而抓东西有利于人的生存。用演化思维分析，一个东西的用处必定是帮助生物适应环境。


    第二个问题是“历史”：这个东西是怎么一朵一代从远古演化到今天这个样子的？

    比如人的手，是从远古时代鱼身上的鱼鳍演化过来的。


    第三个问题是“机制”。这个东西的物理机制是什么？

    人的手有肌肉、骨头、肌腱，还有神经系统等等，它们共同起作用才能够实现抓东西的功能。生物化学、分子生物学、神经生物学等等这些学科，都是研究机制的学问。


    第四个问题是“成长”。这个东西是怎么生长出来的？

    人的手，是从 фон娘第五周开始就开始生长了……


    把这四个问题解释清楚，你就算是理解了这个东西是怎么回事。后面我们会反复提及这四个问题。'
