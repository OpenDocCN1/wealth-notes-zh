    ## 问答：“全面的长板”是战略性错误


    万维钢 · 精英日课

    今天


    进入详情>


    问答：“全面的长板”是战略性错误。


    ### 来自日课：“莫论是非”反馈法，“刮目自看”领导术


    读者谢天：


    夸别人的时候是不是也应该对事不对人呢？


    读者Joey Tan 333：


    对于教导孩子是不是也应该使用“有意识的好评”的方法呢？和成人管理相比又有什么不同呢？


    读者林丽英：


    我是孩子的“领导”(妈妈)，这些方法能用在管理孩子学习上吗？孩子有些学科就是成绩不好，难道我们不应让他多花点时间去过“短板”上吗？


    万维钢


    是的，夸别人也应该对事不对人。《九个工作谎言》这本书特别强调的夸人方法，不但是对事不对人的，而且是应该说自己的感受，而不是去做评判。一个行不行，那是很微妙的，给人打分这种行为本身就不科学——打高分也分都不科学。但是在他的一个具体的行动上，谈谈你自己的感受，这个绝对没问题，而员工需要的也恰恰是这个。


    夸孩子也是这样。要夸一个具体的行为，而不是夸人。我们以前多次讲过“固定思维模式”和“成长思维模式”的区别，固定思维模式的特征就是对人不对事。以前有人做过实验，夸孩子，一定要夸他这件事做得很努力——而不能说他是个“聪明孩子”，否则他会因为害怕被证明不聪明而不敢挑战更高的难度。


    孩子和员工最大的区别大约是员工是可以挑选的，所以“用人当用长”，你可以帮他们成长但是你先挑好的，而且实在不行可以解雇他们；但是自己的孩子不能选，还必须对他的成长负责。但是还有一个区别：你不能从小培养一个员工，但你可以从小培养自己的孩子。


    因为不能选，所以我们的确得关注孩子的短板；但是因为你可以从小干预，你在一定程度上可以影响他。我们专栏以前在讲《流行制造者》和《人人说谎》的时候讲过，人一生喜欢某些东西，是有窗口期的。当然这些书中说的喜好主要是艺术品味、支持哪个球队、政治倾向的窗口期。但是我猜想，在孩子爱不爱读书学习这方面，在早期，也许父母也能影响孩子。我们讲高普尼克的《园丁与木匠》的时候也说过，孩子六岁以前，是心智理论学习的窗口期。这一切的道理是在孩子很小的时候，父母如果应付得当，可以帮助他们健全成长。


    一个健全成长的孩子，通常不会特别偏科。智商是个综合能力，一般数学好的，通常语文和英语也学的不错，不会有明显的短板。中小学生只要正常用功，哪怕没有多大兴趣的科目，考个85分并不难。


    我看现在家长和老师所谓的短板，其实是想要“全面的长板”，希望孩子各项都很厉害。这就是战略性的错误。把一门不感兴趣的学科成绩从85分提高到97分，需要投入很大的精力，但是只不过长了区区12分而已；如果把几门学科的这个精力集中起来用于培养特长，那就有可能达到出类拔萃、以至于百分制考试因为爆表了而无法测量的水平。


    我看现在高考制度，还是让人有一定选择权的。只有数学、语文和英语是必考的，如果你不喜欢物理可以选择不考物理。在这样的制度下更应该发挥特长。所以最好的策略是第一，不要跟教育体制对抗，把每个必修课都尽量学到差不多的程度，但不要投入太多精力去追求什么精益求精；第二，选定一两个方向，专注发展特长。到了大学之后，你会发现现代社会非常乐意奖励特长。


    那如果孩子就是偏科，比如说不爱数学学就爱画画，以至于数学考60分都困难，这怎么办呢？这种情况下哪怕你逼着他学数学，他也不会考到97分。那与其压迫孩子，还不如就赌一把，让孩子在画画这方面尽情发展。只要他画得足够好，将来也能找到很不错、甚至是出类拔萃的工作，到时候没人在意他的数学成绩。反过来成说，压迫出来的全面发展，长大之后必定平庸。


    哪怕从人道主义角度，也应该让孩子做自己喜欢做的事情。我发现有些家长专跟孩子对着干，孩子越愿意干什么他们越不让干什么，孩子越反感什么他们越逼着孩子做什么。我就想问这些家长，你们是魔鬼吗？为什么不让孩子有一个快乐的童年呢？那一条路被“管”大的孩子，始终不知道、也不敢知道自己喜欢什么。他们小时候把学习当受罪，长大以后把工作当受罪，一辈子为别人而活，这样的人生不是悲剧吗？


    读者姜迁：


    人生并不是一帆风顺的，挫折和委屈是成长过程中必然的经历，如果长期沉浸在对人性和社会美好的体会憧憬中，对孩子究竟是利大于弊还是弊大于利呢？


    万维钢


    我们说发挥特长，并不是要一味地夸奖、放任自流。该批评是要批评，但是应该以正面鼓励为主。有些溺爱孩子的家长，他们的错误在于对孩子屏蔽了真实世界：明明孩子水平不怎么样，他们却让孩子以为自己是个天才。但是让孩子能够面对真实世界就可以了，没有必要自己也去故作秀弄一些挫折给孩子。


    中国以前是个穷国，现在社会上的成功人士，大部分小时候都受过苦，他们会说自己小时候经历的那些苦难都是有利于成长的——而却其实是个错觉，是认知失调。人不愿意白白经历苦难，就必须给苦难找个意义——其实很可能没啥好的意义。我看如果现在这些六十岁以上的人小时候没受过苦，他们的人格会更健全，心理会更健康，今天的中国会更好。


    我们看现在在美国这些取得了巨大成就的人，他们小时候并没有经历什么苦难。比尔·盖茨上高中的时候没有死磕法语和拉丁文，他没有忍辱负重地整天干自己不喜欢干的事情——恰恰相反，因为他喜欢编程，他家里帮他安排，他可以在一个大学里彻夜编程。他享受了当时一般美国高中生绝对没有的编程条件，这才是他成功的关键。


    读者 David Tam、陶淑山人：


    要是有员工只看著做得过且过，这个应该怎么领导呢？


    读者 吴廖本人才：


    如果上级和我的认知不一样，他觉得“需要”我某个技能才对团队有利，而我觉得我“应该”要这样做才能是我的强项，他说的并不对……这种情况我怎么办？


    万维钢


    工作中的领导与员工之间的关系是一个双向选择的契约关系。家庭出身不能选择，亲戚不能选择，师生不好选择……领导和员工为啥还不能选择呢？如果你发现一个员工就是不行，你可以解雇他。如果你发现领导的要求是你完全不喜欢的，你应该辞职。


    现代社会连离婚都是可以理解的，而且相当普遍。这个要点在于，如果员工就是不喜欢那么干，领导强制他必须那么干，或者哄着他干，其实都不好。每个人有自己的偏好，市场的作用就是让资源能够有效调配，让每个人尽可能地去做自己喜欢的事情。


    ### 来自日课：王霸之气何处有，众望所归几人


    读者 蓝海KEVIN：


    领导如何保证每次都能带领别人选择正确的方向前进呢？试问如果领导在做出某次或多次决策后，事后事实证明是选择了错误方向，那么如何保证给别人能够提供长期且稳定的“确定感”呢？别人对于其“领导力”必然提出质疑啊！


    万维钢


    有些领导，像朱布斯、巴菲特和巴顿将军这样的人，他们给人的确定感本来就来自他们能判断正确的方向，总能打胜仗，人们是因这个能力而信任他们。这样的人不存在被质疑方向的问题。


    而也有一些领导，像马丁·路德·金、丘吉尔、英国国王乔治六世这样，自身的战略战术水平其实很一般，他们提供的确定感主要是一种精神感召，让人相信这个事业的“大方向”是正确的：黑人一定能获得平等权利、对德国一定能打赢。


    这种相当于精神领袖。精神领袖就要少直接插手具体的事务。像马丁·路德·金是民权运动的领导人，每次重大演讲都必须是他，人们只爱听他讲。但是具体的组织工作，怎么安排一场示威游行，怎么指挥，如何谋划，那些都另外有人负责。精神领袖得有一个广阔的胸怀，得善于听取意见，甚至放权。


    读者 李忠良：


    公司各阶层领导都是资历决定的，很多都是时间熬出来的。


    读者 晓添才：


    傀儡皇帝到底是没有领导力的领导呢？


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_85_0.png)


    万维钢


    我们这一讲说的领导力，主要关注的是那种一呼百应、众望所归、能得到人们衷心拥戴的力量。有这样的力量就可以去做一些开创性、甚至是颠覆性的事业。而生活中有很多所谓“领导”，其实是靠摆资格、混资历、甚至是因为血统的原因占据了领导的位置，对这样的领导，我们可以从两方面去看他。


    一方面，这样的人所有的权威都是来自他所占据的这个位置，而不是来自他个人。人们尊敬和维护他，其实尊敬和维护的是他的位置。现代社会各种规矩是完善的，大企业主要靠惯性运行，这个人只要能很好地按照他的职务设定把该做的事儿做好，该签字就签字，那可能就没什么问题。


    领导只是有能带领大家前进的人。如果一切规章制度都是现成的，人们本来就知道该往哪走，那领导力的作用就不大，只要有个个人在那占住位置就行。他可以维护系统的正常运行，但是因为他没有个人魅力，他无法改变系统。所以要说主动改革，他肯定不行。


    另一方面，占住这个位置，这本身也可以说是一项特长，也有一定的领导力。英国国王乔治六世并没有多少个人威望，他的领导力来自血统。但是因为他是英国国王，民众就会重视他。在二战的关键时刻，他的意志坚定，对英国国民来说就是一个很好的鼓舞。


    咱们只要对比一下明朝那些宗室就知道了。北京城陷落崇祯皇帝自杀，明朝在各地的那些皇亲国戚因为血统的原因，在百姓、士兵甚至官员心目中还是有威望的。他们之中但凡有一个人能站出来，说我家让大明百姓供养了三百年，现在我要出来给百姓当个定心丸，南明至于那么容易崩溃吗？而我们看到的是宗室贵族里就没有一个像样的，勉勉强强被人推上皇帝位置，结果前方将士还在打仗他先跑了。


    如此说来，让一个本身没有领导力的人占据领导的位置，如果没事也就没事，一旦遇到动荡时期，就肯定指望不上。《易经》说“德薄而位尊，知小而谋大，力小而任重，鲜不及矣！”


