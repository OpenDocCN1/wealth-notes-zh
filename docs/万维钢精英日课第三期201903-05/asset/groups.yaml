    # 读者心语：


    关于演化的实验，大肠杆菌在不断变大。是不是因为有足够的营养液？


    万维钢


    我们直观上考虑大的大肠杆菌汲取资源的能力更强，在试验那种封闭环境中，它可能就抢走了体形小的大肠杆菌的食物。在整个生物界来说，体形越来越大，也是一个非常常见、但是不绝对的趋势。这个趋势被称为“柯普规则（Cope''s
    rule）”。尤其是海洋生物，演化历史是体形越来越大。但为什么有这个体形变大的趋势，我看了截至到2018年的当前科学理解，都是尚无定论。也就是说，我们推测一个原因很容易，但是生物学家要验证这个假说，非常困难。


