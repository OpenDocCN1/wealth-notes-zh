    # 逻辑思维4：逻辑、悖论与直觉


    万维钢·精英日课³

    今天


    进入课程 >


    逻辑思维4：逻辑、悖论与…


    现在我们经常说一个词叫“反直觉”。如果一个科学理论和我们的直觉正好相反，这个理论就能让我们的大脑感到兴奋。比如量子力学和相对论就非常反直觉。我们特别喜欢藏在料之外又有情理之中的东西。


    但是听多了反直觉的理论，你的口味会提高，你会觉得不反直觉的学说没意思。你甚至可能形成一个直觉：那就是直觉都是错的。


    但这个直觉恰恰说明，直觉不可能是错的。“我有一个直觉：直觉都是错的”，这句话是个逻辑悖论！


    我们继续说尤金·奈亚·程的《不讲逻辑的世界里的逻辑艺术》这本书。这一讲我们来说说逻辑和直觉的关系。理解这个关系，我们能够更加深入地理解逻辑到底是怎么回事儿。我们就从悖论开始讲起。


    # 1.芝诺的悖论


    所谓悖论，就是这么一种说法，你从一面看它是正确的，可是从另一面看它又是错的，以至于你无法判断它到底是对是错。很多悖论之所以是悖论，并不是我们的直觉有问题，而是逻辑有问题。


    咱们先说一个著名的悖论，芝诺悖论。芝诺是2400多年前的古希腊哲学家，他提出过好几个逻辑悖论，我们这里专说其中一个。希腊勇士阿基里斯和乌龟赛跑，乌龟先出发，乌龟跑出去一段距离之后，阿基里斯再去追。阿基里斯的速度比乌龟快，那么从直觉上来讲，我们知道阿基里斯一定能追上乌龟。


    但是芝诺讲了一番逻辑。我们假设阿基里斯起跑的时候，乌龟已经走到了A点。那么等阿基里斯跑到A点的时候，乌龟肯定又往前走了一段距离，达到了B点。再下一刻，等到阿基里斯跑到B点时候，乌龟又到了C点，以此类推。阿基里斯每次走到乌龟曾经到达的地方的时候，乌龟都往前走了一段距离……那样说的话，阿基里斯应该永远都追不上乌龟！


    对此你很难以反驳。事实上，直到两千多年以后，数学家有了极限的概念，我们才把这个悖论说明白。芝诺考虑的相当于把无穷多个 时间段加起来，他以为这个相加的结果应该是无穷大，但事实上结果是有限的。就像


    ```

    1/2 + 1/4 + 1/8 + 1/16 + …

    ```


    并不是等于无穷大，而是等于1。


    在这个题目上人的直觉没错，阿基里斯的确能追上乌龟，是芝诺的逻辑有问题。如果有哪个哲学家非得说芝诺说得对，完全无视事实，那是绝对不行的。


    # 2.罗素悖论与美国宪法


    下面这个悖论我敢打赌你听说过，是哲学家罗素发明的，叫罗素悖论。但是你不一定知道它的解法。


    村里有一位理发师，他立下了一个规矩：他一定要给、而且只给，村里那些不给自己理发的人理发——那么请问，这位理发师要不要给自己理发呢？


    这个问题你怎么回答都不对。如果理发师不给自己理发，那他就是一个不给自己理发的人，根据规矩他应该给他理发；如果他给自己理发，根据规矩他就不应该给自己理发。


    直觉上，此题无解。但在逻辑上，你可以改进逻辑。罗素制造这个悖论不是为了证明逻辑不行，而是为了说明“集合论”的问题。我们知道，所谓集合，就是一些东西的聚集。用集合的语言，理发师悖论可以这么表述——


    我们定义集合S，是所有不是自身子集的集合的集合——那么请问，集合S到底是不是S的子集呢？


    如果S是S的子集，那它就是自身的子集，根据定义它不应该是S的子集；如果S不是S的子集，它又应该是S的子集。这里有点绕，但是你体会一下，这其实就是理发师悖论。它们都具有“自己包含自己”的特点。


    要想解决这个悖论，我们必须重新考虑集合的定义，我们必须把“集合”和“集合的集合”给区分开来。更合理的集合定义必须分成下面这些层——


    + 1. 第一层，是一堆东西的聚集，称为“集合”。这里所谓的“东西”，都不是“集合”。

    2. 第二层，是集合的聚集，称为“大集合”。也就是说，“大集合”是通常说的“集合的集合”。

    3. 第三层，是大集合的聚集，称为“超大集合”……


    以此类推。然后我们规定，说集合的论断，必须明确说的是哪一层——那么S和S的子集就是在不同的层，所以S不会是S的子集。同样道理，理发师和他理发的那些人不在同一个层，所以他不会给自己理发。这样定义，就什么都能说清楚了。


    这是用逻辑修正直觉。


    # 3.知道和感到


    从这两个悖论你能看出，在逻辑上想明白一个问题，和从直觉上理解一个问题，是两码事。逻辑可以帮助直觉，直觉有时也能帮助逻辑。逻辑和直觉不是互相排斥的。


    有时候仅在逻辑上“知道”还不够，你还需要在直觉上“感到”。


    # 4.逻辑的边界


    直觉对逻辑有帮助，而且哪怕从理论上来说，你也不可能生活在一个纯逻辑的世界。真实世界里有很多东西是不讲逻辑的。


    比如学英语，像什么“单数复数”、什么“过去时态”，大多数情况下用简单规则就行，可是也有很多特例，而你完全不知道为什么要那么设定。更基本的是，这个单词为什么非要这样拼写呢？是因为它起源于德语吗？有时候有原因，有很多时候根本没有原因。你只能接受，而且还必须把它内化，才能在使用的时候脱口而出——英国人说英语的时候，可不是像编程一样先想逻辑。


    再比如说做选择。在餐馆点餐，你固然可以使用一些逻辑的原则，比如要求热量低、含糖量、没吃过的等等，你可以有各种原则，但最后你总会发现，即使把这些原则都用上，还是有几个选项无法决定。你终究得用一点直觉。特别是信息不足的情况下，直觉能帮我们快速决策。


    还有，艺术创作总是需要直觉的。不管你是创造一支乐曲、画一幅画，还是写一篇 文章，固然有逻辑上的要求和套路，但归根结底，总有一些东西是直觉上决定的。如果按逻辑推导就能创作出好东西来，岂不是人人都可以当艺术家。创作，总有一些说不清道不明白的东西，只可意会。


    说到这里，我们专栏以前讲过哥德尔不完备定理，我们知道想要用逻辑完整描述一个系统是做不到的。所以总结今天的内容，如果你想纯粹靠逻辑生活，首先你没有那么强大的逻辑意志力；其次直觉会对你有帮助；而且哪怕在理论上，真实世界也不是纯逻辑的。


    最后我忍不住想问，如果世界不是纯逻辑的，人生不能算法化，那“人工智能”又怎么说呢？这个问题太大，这就不是我们今天这一讲能说的了。


    参考文献

    [1] 关于这段典故的详细考证，见Jeffrey Kegler, Kurt Gödel: A Contradiction in the U.S. Constitution?
    https://jeffrey kegler.github.io/personal/morgenstern.html

    [2] 参见《别闹了，费曼先生》一书。


