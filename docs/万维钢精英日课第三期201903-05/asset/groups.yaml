    # 逻辑思维5：灰度认知和黑白决策


    万维钢 · 精英日课³

    今天


    进入课程 >


    逻辑思维5：灰度认知和黑…


    “灰度认知，黑白决策”是最近流行的一句话，我最早是听罗胖说的，也不知发明人是谁。这句话非常有道理。我们知道世界不是非黑即白的，其中有很多灰色地带，所以我们必须有灰度的认知
    —— 可是如果要做事的话，却不能是灰色的。


    比如天气预报说今天下雨的概率是40%，那意思就是可能下雨也可能不下雨，这就是灰度认知。可是在行动上，你要么带伞，要么不带伞，你不可能带一把40%的伞，这就是黑白决策。


    其实这个说法以前就有。早在1957年，毛泽东访苏联，当面向赫鲁晓夫介绍了自己可能的几个接班人。说到少奇、周恩来、朱德，都是有优点也有缺点；唯独提到邓小平，毛泽东说的都是优点。毛泽东说邓小平“……思圆行方；既有原则性，又有高度的灵活性；柔中有刚，绵里藏针。很有发展前途。”


    “思圆行方”，思维是圆的行異是方的，这不就是灰度认知，黑白决策吗？达到这个境界的人，才可以托付大事。那到底怎么个思圆行方，怎么把握原则性和灵活性呢？这里面有逻辑。


    我们继续讲尤金倪亚·程的《不讲逻辑的世界里的逻辑艺术》这本书。首先，并不是所有认知都是灰度的。


    # 1.为什么要讲原则


    世界上的人讲原则有的人没原则，他们的人格高度有云泥之别。讲原则过了头可能有缺点，比如做事太过死板、有点过腐甚至有点“倔”；但是不讲原则，就没有优点。


    讲原则，你才能讲逻辑，你才是讲理的，你说的话才值得听，你的行为才是可预测的，别人才会和你合作。如果一个人没原则，什么事情都干得出米，那就不绝对不能让他承担任何重要的责任，这样的-In就很难在社会上立足。


    尤金倪亚·程认为，讲原则，最符合逻辑的做法，是效法数学。数学讲“公理”——也就是无需证明的事实，是逻辑推导的起点。比如欧几里得，就是从五条最基本的公理出发，推导出整个平面几何学。我们的原则也应构成一个合理的逻辑体系，最好能从几条基本原则出发推导出整个行动指南。


    怎么找到自己的原则呢？最好的办法就是不停地追问自己，我为什么这么认为？一直追问到没有为什么、我就相信这个，为止——那就是你的原则。


    比如说，有的人认为政府应该通过社会福利项目救助穷苦的人，有的人认为每个人应该自立自强别指望别人。那你要问，你为啥这么认为呢？如果一个人的回答是“政府本来就应该这么干，我就这么认为！”那层次就有点低了。


    高水平的回答是这样的——人不是孤立的动物，人与人之间充满了联系。穷苦人的生活得到改善，不仅仅对他自己有好处，他的亲友、他周围的人都会受益，整个社会环境变好了对交税的人也有好处。帮助别人其实就是帮助自己。


    这个答案提供了一个更为底层的逻辑，一个更基本的原则。我们现在特别说“底层逻辑”、“第一性原理”这些词儿，其实就是在追问你的这套逻辑体系的公理是什么——也就是你的原则。


    两个讲原则的人哪怕有矛盾，也可以谈，讲一讲各自相信什么，也许就能在某一层原则上达成共识。你是国民党我是共产党，咱俩政治理念不同，但是抗日救国你得赞成吧？那现在我的部队是去打日本人的，你怎么就不能给我个方便呢？这就叫求同存异。


    效法数学的精神，原则应该是分层的，越深层的原则越少、越简单、越不容易违反。反过来说，如果一个人把什么东西都当做原则，只知道说我喜欢这个不喜欢那个，不知道为啥喜欢为啥不喜欢，那其实是只剩下任性了。


    从最底层的几个原则出发，去随时审视和判断自己的决策，你的行为就会非常笃定。别人看你特别靠谱，你自己看自己也有一种荣誉感。


    但是话说回来，我们能不能用原则指导我们的一切行为，让每一个决策都那么有逻辑呢？……那是不可能。


    # 2.灰度认知


    所谓灰度认知，就是真实世界的一些事情，并不符合逻辑。我要保持好身体，所以我重视食品安全，所以我不吃过期的食物，这很符合逻辑。那么如果现在有一瓶牛奶，写着3月26号过期，而现在是3月25号深夜，我为了不浪费，是不是应该趁着零点还没到赶紧喝呢？


    过期时间不可能是精确科学。牛奶的性质不会在午夜11:59:59到12点这一秒钟之内发生急剧变化，实在不想浪费的话等到明天早上再喝也没啥大问题。世界是有灰度的。


    再比如你决心戒酒。今天是中学毕业30周年聚会，30年没见的老师说要跟你喝一杯，请问你能不喝吗？酒喝多了有害，但是不喝到喝多之间，存在一个灰度。咋怕从纯逻辑来讲，这里也没有明确的分界线。


    尤金倪亚·程举了一个美好的例子，是简·奥斯汀的小说《傲慢与偏见》的一个情节。伊丽莎白问达西先生是什么时候爱上她的，达西先生回答说——


    > “我不知道是在哪一个时刻，哪一个地点，或者是你的哪一个形象、哪一句活让人爱上你了。那是在很长时间之前。在我意识到爱上你之前，我就已经爱上你了。”


    你看爱上一个人也不是非黑即白的，从完全没爱到确定爱上，它是连续过渡的一个过程。这种灰色地带特别不好决策。


    比如你为了减肥，决心要少吃饼干，但是你真的喜欢吃饼干。你想，只吃一小口饼干，难道还能影响减肥大业吗？肯定不会。那再吃一口呢？应该也没事。符合逻辑的结论是不管今天你已经吃了多少饼干，再多吃一小口也不会有本质的区别。那你到底应该吃几口呢？


    再比如前一段特别热门的 MeToo 话题。到底什么行为构成性骚扰？握手肯定没事，那碰一下肩膀算不算呢？


    要划线，逻辑上不支持绝对的划线。不划线，就有了得寸进尺的机会。吃一小口饼干没事，再吃一小口也没事，吃着吃着你就胖了。如果握个手没事，碰一下肩膀也没事，最后你可能就被性骚扰了。那这条线到底应该怎么划呢？


    # 3.黑白决策


    所谓黑白决策，就是哪怕不符合逻辑，也要划线。考大学有一个录取分数线，679分就能上清华，678分就不能。这两个同学只差一分，这一分之差完全可以用偶然来解释，也许678分那个同学平时的水平更高。这不符合逻辑，但是没办法，大学只能录取这么多人，就只能有这么一条线。


    而像吃饼干、喝酒、性骚扰这些事情，并没有什么严格的外界要求，都是自己对自己的约束，这怎么办呢？这个关键思想叫做“缓冲区 (buffer zone)”。你划线要预留一个缓冲区，如下图所示——


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_41_0.png)


    左边是白，右边是黑，中间是灰。你的线要划在非常靠左的位置，以至于过线之后的一大块灰色区域仍然是比较白的——那块区域就是缓冲区。过了缓冲区，灰色才变得比较黑。


    把线划在这里，有了缓冲区，你就有了足够的安全感。这是因为哪怕稍微越线一点，你仍然是安全的。你的坚守、你的原则、你的纪律，应该在缓冲区之外。


    比如吃饼干，如果每天吃三块太多了，吃两块行不行在两者之间，那么你就应该规定自己每天吃一块。一块饼干是绝对安全的，偶尔越线其实问题不大，但这条线的存在会让你在越线的时候感到很内疚。


    再比如职场性骚扰，我们可以这么划线：除了女主主动的握手之外，男女之间应该没有任何身体接触。这条线有点严厉，但是非常安全：稍微的越线行为不会给女性带来巨大伤害，但是能够给男性带来很大的警醒。


    其实商家在设定食品过期时间的时候，就已经留了一定的缓冲区。宁可过分安全，也不能有一点危险。事实上考虑到这一点，我们不应过分在意过期时间。


    这就是黑白决策。黑白决策保证了原则性。接下来我们说说的就比较高级了，我们说说“灵活性”。'
  md: '

    不但没有好处，而且还会受到惩罚，不合作的行为自然就会大大减少。


    3. 比自己管、私有化和政府管这三种监管方法更新颖的是让博弈各方之外的“第四方”监管。更高一级的监管是监管者和被监管者的合作。


    4. 你应该把政府也当做一个 player。而且政府也应该把自己视为一个 player。既然是参加博弈的 player，政府也需要博弈论。


    # 博弈策略三：先下手为强+后发者优势


    1. 动态博弈


    2. 小鸡博弈：只要你能确定对手的底线，那么先发制人，造成既成事实，就能逼迫对手就范。


    3. 悬崖策略是动态进行的小鸡游戏。双方每一步都在推动危机升级，这是一个危险的边缘游戏。


    4. 最好的办法给对方一个威慑，让他根本不敢出手。威慑有三个要素：实力、决心和让对手知道。


    5. 先发者暴露信息，后发者利用信息。


    6. 后发优势 = 先发者的信息 + 后发者的出手权。信息是模仿机会，出手权是创新机会。


    # 博弈策略四：威胁和承诺


    1. 威胁和承诺都是在博弈双方都没有采取实质性行动之前，一方通知另一方的声明。所谓威胁，就是我要求你不要去做某件事——我说如果你做了，我就会对你进行惩罚。所谓承诺，就是我要求你去做某件事——如果你做了，我就会给你一个奖励。


    2. 只有可信的威胁和承诺才有意义。


    3. 可信 = 别无选择。发出可信的威胁或者承诺有三个办法：给别人惩罚你的权力；主动取消自己的选项；建立声望。


    # 博弈策略五：随机选择策略


    1. 只说谎话就等于只说实话。想要真的迷惑对手，你必须把谎话和实话混合起来。


    2. 你的混合概率选择，应该把对手能得到的最大报偿给最小化。你要按照一定的概率，混合自己的打法。你混合打法的这个规律，必须是让对手无法利用的。


    3. 不是真随机，就会被破解。随机性，才是真正的“诡道”。


    # 博弈策略六：最高视角：观察不同博弈策略在人群中的演化。博弈永无休止。


    1. 即使纳什均衡并不只有一种，冥冥之中仍然存在着一些规律，在限制我们选择策略的自由。这些规律决定了社会的演化。


    2. 如果使用一个策略能带来好的报偿，人们就会模仿这个策略，这个策略就会流行开来。


    3. 策略的优劣不是永恒的。你必须考虑当前社会的博弈格局，特别是其他人都在使用什么策略，才知道自己的最佳策略是什么。到底要在什么比例的情况下随大流，甚至要不要随大流，都取决于具体的博弈格局。


    # 若干金句


    * 计谋要是太多，愚蠢的人就不够用了。博弈论研究的是*理性人*之间的博弈。


    * 研究博弈论就好像下棋一样，你要考虑你的每一个行动都是有后果的，你要事先想好对方会有什么反应，然后你再怎么应对，然后对方再反应……直到最后是个什么结果。


    * 理想青年喜欢找最优，理性青年寻找纳什均衡。


    * 博弈论是人类理性行为的第一性原理。


    * 有一种困境叫自由，有一种解放叫禁止。


    * 我们年轻时候的雄心壮志变成了对社会的低头，我们感慨世风日下人心不古，我们嘱咐子女不要锋芒毕露，可我们又暗自期望他们能走一条少有人走的路。一切都仿佛是个性和现实之间的对抗，殊不知一切的背后……都是数学。


    * 所有人都意识不到博弈的时候，可能你诗情画意都能赢。少数人意识到博弈的时候，谁意识到博弈谁赢。大家都意识到博弈了，那就只能比执行力——或者看谁能意识到新的博弈。


    * 一个合格的 player，应该拥有四个作风——有限、务实、慎重、客观。


