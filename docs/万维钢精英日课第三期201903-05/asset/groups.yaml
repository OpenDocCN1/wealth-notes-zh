    # 读者 zero:


    历史上第一个造反的，很少有成功的，这也算后发优势的一种情况？


    万维钢


    先发优势的关键在于占领。造反要想成功，就必须占领权力关键资源，比如说枪和钱。历史上大多数造反者大都是“官逼民反”模式，是被动而不是主动，是突发而不是预刻。时机不成熟，没有强烈的占领能力和占领意识，结果糟糕了自己只是把局面搞乱，给后人提供了信息和出手权。


    但如果时机合适，争夺权力绝对是一个先下手为强的业务。所谓时机合适就是当前出现了权力的真空。可能之前的领导人非常不得人心被逼下台了，也可能他死亡了但没安排好继承人，也可能是烽烟四起但各路造反者没有公认的领袖。总而言之，在这个时刻，没有掌控国家权力。


    这时候速度就是一切。有好几股势力都在争夺权力，谁能先抢到关键资源谁就胜出，而结局往往在有很大的偶然性。《独裁者手册》这本书提出一个模型，说这就好比房间里有100个人，谁只要能先说服5个有枪的人支持自己，谁就能统治所有的人。


