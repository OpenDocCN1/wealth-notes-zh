    代表这个软件不是用996的方法开发的，就好像清真食品的认证一样。这就给软件加上一个道德的标签，号召公司和开发者要平衡工作和生活。


    这个道理没毛病，人不能一天到晚上班。但我们要说另一个视角。


    如果一个人把工作等同于受罪，认为工资是受罪的报酬，那996就是不人道的。几乎所有时间都用来挣钱，以至于没时间花钱，还有比这更悲哀的人生吗？还有一种观念叫“拼命工作，拼命玩”，在我看来非常愚蠢：如果你的工作挣钱是为了能在玩的时候花钱，有个事实是玩花不了多少钱——你为啥找不到个轻松的工作，这还至于拼命吗？


