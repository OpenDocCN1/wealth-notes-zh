    ## 日课精选


    ## 补习班、考试和阶层的因果关系


    万维钢 · 精英日课³

    今天


    进入课程 >


    补习班、考试和阶层的因果。


    万维钢

    最近咱们专栏启动了一个活动，叫《所有人问万维钢》，希望大家能提出各种问题，如果你的问题被选中，我会尽我所能——不一定帮你找到问题的答案，但也许许可给你一个新视角。


    今天的这篇日课，就来自于一位读者的好问题，他的id叫Andy Guo，他的问題是这样的：


    喊了很多年的“为中小学生减轻课业负担”，都减下来了，反而是越来越重。刚开始是中学阶段，现在蔓延到了小学阶段，学校老师作业布置的多，课外辅导班更疯狂。心疼这些被“学业负担”压得喘不过气的孩子，请问从博弈论的角度来看，这个问题有何好的解决方法吗？


    今天这篇日课，就来自于这个问题。


    ### 1.补习班


    补习班并不是个新生事物，可以说古今中外都有。关于上补习班到底有多大作用，现在已经有很多研究过了。咱们先说结论：补习班几乎没用——就算有，也比公众所以为的，要小得多。


    ### 2.考试私教训练


    ### 3.阶层与入学考试


    - 1. 课外补习对差生最有效；

    - 2. 对数学和英语比较有效，对语文作用不大；

    - 3. 补习的效果主要发生在初中阶段。上了高中以后，课外补习只在数学方面、而且是只对差生有一定的效果。


    - 1. 学生的成绩反映了学生的智商；

    - 2. 学生的智商是继承于家长的智商；

    - 3. 家长的财富和学历，反映了家长的智商；

    - 4. 所以学生的成绩才会跟家长的财富和学历有关。


    注意这里我们只分析了家庭对考试成绩的影响。美国大学录取并不只看标准化考试成绩，还有课外活动等方面的考虑，富人家庭在那些方面有更多的优势。而从这个意义上说，标准化考试是最公平的录取方法。


    是，富人可让孩子从幼儿园到高中一路上去好学校，他们的考试成绩也真的更好——但是，富和最后成绩之间并没有那么显著的因果关系。不可忽略的事实是富有的家长通常也是高智商家长，而智商是可以遗传的。高学历家长没花那么多钱，也有同样的作用。


    现在很多人说，以前中国有很多来自农村的考生能上北大清华，可是现在北大清华录取的大都是城市中产家庭的孩子，这难道不是阶层固化吗？我认为不一定。以前中国不是市场经济，人才不能自由施展，很多高素质家庭并没有高收入——而现在是自由市场经济，高素质家庭很容易获得更好的生活条件。很可能以前考上清华的所谓“穷人家孩子”，他们并不是真正的“穷人家”的孩子。


    所以更科学的结论是，考试成绩只是反映了学生家长和学生本人*是什么人*，而不是他们花了多少钱。


    但是家长仍然会愿意给学生花补习班的钱。也许没什么大用，但这是唯一用金钱可控的操作。


    这就好像很多人把一生中大部分医疗支出都花在生命最后几个月一样：花钱总有些许可操作的空间，但是那个空间并不大。


