    # 特别放送：极简逻辑思维


    特别放送：极简逻辑思维 ↓


    万维钢


    今天我们来把刚刚讲过的《逻辑思维》专题，帮你做个总结，咱们从这个专题中提到的若干个逻辑错误这个视角，串讲起你应该知道的逻辑学概念和重要认知。希望这期总结能帮你更系统深入地学习逻辑思维。


    # 七个重要概念


    【三段论】：一提逻辑学，人们首先会想起亚里士多德著名的“三段论”，也就是大前提、小前提和结论——


    大前提：人都好吃饭。

    小前提：中国人是人。

    结论：中国人要吃饭。


    【逻辑推导】：A ⇒ B，意思是如果 A 成立，那么 B 就成立。这个推导是可以传递的，A ⇒ B，B ⇒ C，C ⇒ D，那么就有 A ⇒ D。


    【逆命题】：A ⇒ B，我们称之为“命题”。命题是有方向的。如果命题 A ⇒ B 成立，我们说 A 是 B 的“充分条件”，B 是 A 的“必要条件”。调转方向，命题
    A ⇒ B 的“逆命题”，是 B ⇒ A


    【否命题】：如果“橘子比苹果好吃”，那么“橘子不比苹果好吃”*是逻辑否定*；“苹果比橘子好吃”*是极端否定*。


    # 六个逻辑错误


    逻辑错误1：把反对逆命题当成反对命题


    例如：反对“所有女性都经历过性别歧视”这个命题，会用“我男性也经历过性别歧视”。这个反对是无效的，因为反对的不是这个命题，而是这个命题的逆命题“所有经历过性别歧视的都是女性”。


    逻辑错误2：用极端否定而不是逻辑否定


    例如：

    命题：所有女性都经历过性别歧视。

    极端否定：根本就没有任何性别歧视、女性地位比男性高。

    逻辑否定：有些女性没有经历过性别歧视。


    逻辑错误3：专门指责某一方


    逻辑错误4：笼统陈述


    +   1. 这个体系以内的东西不能互相矛盾；

    2. 这个体系以外的东西，你一定不信；

    3. 凡是从这个体系推导出来的东西，你就一定相信。'
