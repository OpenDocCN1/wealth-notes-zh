    你猜哪个孩子将来更可能成为大人物。容人之量来自逻辑，逻辑来自认知。


    用不讲逻辑的方式去攻击别人，那个形象是很难看的，等于是自杀式攻击。讲逻辑不仅仅关乎辩论的成败，也不仅仅关乎决策的对错，更关乎你有没有一个健全人格。


