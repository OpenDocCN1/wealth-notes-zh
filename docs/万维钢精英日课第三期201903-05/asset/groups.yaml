    最近一个热门话题是程序员抗议996的运动。所谓996，就是每天早上9点上班，晚上9点下班，每周工作6天。如果一个人长期这么工作，哪还有时间生活呢？身体能受得了嘛？所以程序员要维权。有人还搞出了一个“反996许可证”——


