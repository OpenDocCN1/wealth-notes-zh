    # 实用者、改进者、竞争者和终结者


    万维钢·精英日课³

    23分钟前


    进入课程 >


    这一讲我们用一点计算机思维来思考一个策略问题。


    最近我听到一个说法，说理工科的知识，在生活中几乎都用不上。我理解他的意思是说我们平时也就买个菜算个账用一点小学数学，最多再算算理财和保险；而像什么微积分啊量子力学啊这些东西根本用不上。一个证据是文科生不懂那些，日日子过得也不错。


    我反对这个说法。理工科的知识带给我们的不仅仅是具体的方法应用，更是一种思维模式，能帮助我们清晰思考生活中遇到的问题。而且有些理工科知识就是可以用于日常生活，比如我们专栏以前讲过的一本书《指导生活的算法：人类决策中的计算机科学》，就对生活有明确的指导意义。如果一个人不学了一大堆科学知识，日子却过得很糟涂，做出很多错误的决策，那只能说明这个人并不是真的懂科学。


    # 1.难题


    当一个计算机科学家说“难题”的时候，他说的是真正的难题。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_128_0.png)


    这个问题叫做“旅行推销员问题（Traveling Salesman Problem）”。这是一个最著名的组合优化问题。这是一个“NP困难”问题。


    # 2.启发式算法


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_128_1.png)'
  - '[PAGE 129]


    但是有些人并不满足于最近邻居算法。


    # 3.改进者和竞争者


    我们说了，旅行推销员问题其实是快递员每天都要面对的问题。而一个真正的快递公司 —— 美国 UPS，就对这个问题非常感兴趣。他们不满足于最近邻居算法，他们想要更好的启发式。


    这是因为 UPS 在这个问题上不是一般过日子的老百姓。他们有 55000 个快递司机，他们每天要前往 1600 万个投递地址。哪怕是能让每个快递员每天少走一英里，UPS
    每年就能省下三千五百万美元。


    UPS 是个改进者。几年前我看到一个报道 [3]，UPS 开发了自己的路线规划系统，叫 ORION。ORION 并不能终结旅行推销员问题，它也是一个启发式，但它能给出更好的答案。如果你面对的是一个几千万美元的问题，改进的功夫就是值得的。


    而计算机科学家还在另一个角度改进算法。我们知道最近邻居算法能得到大概比理论最短路径长 25% 左右的路径，但是这并不是绝对的，只是一的一般经验而已。有时候最近邻居算法给的答案不但不是最短的，还可能是最长的。那有没有一个算法，能确保给一个
    “肯定不坏” 的答案呢？


    1976 年，伦敦帝国学院的 Nicos Christofides 教授提出一个算法，能保证，它给出的路线比理论最短路线，最多长 50%。他的方法非常数学化，我也不会讲你也用问，但是我想说的是这件事儿有多厉害
    ——


    此后几十年一直有人想打破这个记录都没有成功。直到 2011 年，斯坦福大学和麦吉尔大学的一个联合团队，才打破了这个 50% 的记录 [4]，轰动一时。那他们创造的新记录是多少呢？是百分之
    --


    49.9999999999999999999999999999999999999999999999999999999999996【小数点后面有 49 个 9】


    那你可能会说，搞这样的改进值得吗？值得。因为他们不仅仅是改进者。


    他们是竞争者。


    # 4.日常问题和精英解法


    我家邻居有个小女孩刚上高中。她的父母有一次跟我们聊天，不经意地告诉我们，说女儿在学校里踢足球 —— 不是一般地踢足球，是踢 “竞争性” 的足球。


    我一听就肃然起敬。这不是业余爱好，不是陶冶情操，不是什么锻炼品格，这是冲着正式比赛和国家队去的。竞争，能让人舍得发挥最大的潜能。


    为什么我们在日常生活中用不上特别高级的技能呢？因为我们通常都是实用者。实用者的态度是够用就行，而 “够用” 很容易。


    这辆车的造型可能没有那辆车那么酷，但是安全、越野、油耗各方面性能其实都不差，而价格便宜了一半，那就买这辆吧。实用者追求以最小的投入获得比较高的产出。


    人们经常说什 “精益求精”、什么 “追求卓越”，其实实用者不需要那些。比如你要写个报告，为此要做很多调研，请问你应该调研到什么程度？答案是够用就行。在这个时代搜集信息是没有止境的，你必须学会适可而止。调研是这个边际效应递减的事儿
    —— 如果调研带来的好处已经比不上调研本身的成本，那你就应该停止调研。没有这个实用态度，你就寸步难行。


    可你不能什么时候都 “只选对的不选贵的”。有时候对的就是贵的。像 UPS 改进路线算法，那个边际效应很难减下来，你就得舍得大投入，你就值得用高级的手段。


    而对竞争者来说，“边际效应” 几乎就是个没有意义的概念。面对胜者通吃的局面，赢了就赢得一切，输了就啥也没有，那你就得真得全力以赴。也许赛车性能提高 5%，价格要提高五倍
    —— 那你也得花这个钱。竞争者不能计较性价比。


    如果一个人过惯了普通的日子，可能看什么问题都是实用者心理。比如有人说高考为啥要考那么难的数学呢？我们根本用不上啊！殊不知高考是个竞争项目，那么难的数学就是为了把问这种问题的人淘汰掉的……


    再比如说，以前中国的很多工厂，生产车间都是脏乱差，一点都不规范。你要说应该规范化，工厂老板可能会说规范很贵啊！对付对付差不多就行了。这种实用者会对自己的小精明沾沾自喜。


    比如有个段子说怎么判断生产线上肥皂盒里装没装肥皂呢？高级手段又是微电子又是 X 射线，而乡镇企业的一个小工想了个办法：用电吹风吹！空盒子自动会被吹走。


    过日子也许真的可以这么干。但是要想在国际竞争中占据一席之地，这种对付的办法可是行不的 [5]。你需要更强的安全性和可靠性，你会对生产环境有极端的要求。


    陶醉于实用主义小精明的人，对高级知识的力量一无所知。


    面对难题，弱者的思维方向是从实用者开始，在现实中被逼改进。而强者的思维方式是从终结者开始，实在解决不了，退而求其次才寻求改进。


    # 注释


    [1] 严格地说，计算量可以比阶乘更低一些。但是，已知 TSP 算法在最坏情况下的时间复杂度随着城市数量的增多而成为超多项式（可能是指数）级别增长。


    [2] 这个可互动的例子来自可汗学院, Computing>AP® Computer Science Principles>Algorithms>Solving
    hard problems: Using heuristics, created by Pamela Fox.


    [3] ARCUS WOHLSEN, THE ASTRONOMICAL MATH BEHIND UPS’ NEW TOOL TO DELIVER PACKAGES
    FASTER, Wired, 06.13.2013.


    [4] Erica Klarreich, Computer Scientists Take Road Less Traveled, quantamagazine.org,
    Jan 29. 2013.


    [5] https://www.douban.com/group/topic/44178861/'
