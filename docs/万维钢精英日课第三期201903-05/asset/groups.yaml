    \n# 读者阿丁：\n\n新手懵以理解“图灵停机问题”，总觉得有点神秘。万老师能解释一下吗？\n\n万维钢\n\n“可计算性”和“图灵停机问题”是计算机科学中的两个关键问题，我认为每个想要理解计算机的人都应该有所了解。今天的问答，咱们就专门说说这两个问题。\n\
    \n# 1. 什么叫“可计算”\n\n我们知道，计算机思维能给人提供一个观察世界的视角，能让我们审视自己的世界观。因为有了计算机，我们现在可以问出下面这些大问题——\n\
    \n+   1. 计算机能解决一切问题吗？\n2. 人脑是一台计算机吗？\n3. 我们生活的这个世界，有没有可能像《黑客帝国》电影那样，其实是一场计算机模拟呢？\n\
    \n我先说结论。科学家和哲学家的当前科学理解，对第 2 和第 3 个问题，还没有答案——你只能猜想。但是对第一个问题，答案则是明确的否定：计算机不能解决一切问题。\n\
    \n那你可能会感到有点奇怪——如果计算机不能解决一切问题，那就就是说计算机是有局限性的吗？那人脑和真实世界怎么还可能是计算机呢？其实这并不奇怪，因为人脑和真实世界也可能是有局限性的。计算机有局限性，不等于是人脑就一定强于计算机，也不等于真实世界就不是计算机。\n\
    \n咱们先说说这里ໂ么叫“解决问题”，也就是么叫“可计算”。对计算机科学家来说，所謂可計算，就是给确定输入，经过计算机的有限次操作，能得到一个确定的输出。“可计算”的意思不但是“可以算”，而且是“可以算出结果来”。\n\
    \n咱们把问题简化一点。我们考虑这么一种问题，它的答案要么是“是”，要么是“否”，而在逻辑上不存在模棱两可的中间状态。请问，所有这样的问题，都是计算机可以解决的吗？\n\
    \n答案是否定的。哪怕像是“是否”这种问题，都不全是可计算的。比如说，图灵停机问题，就是不可计算的。\n\n# 2. 图灵停机问题\n\n让计算机执行一个“寻常的”程序，比如计算\
    \ 1+2+3+……这么一直加到比如说 10000，只要计算机的内存足够大，只要你给的最后一个数字是有限的，只要你愿意等待足够长的时间，它就终有算完、停机、输出一个结果的时候。\n\
    \n但是有些程序，却是永远都不会停机的。比如你可以让计算机一直循环执行下面这个命令——\n在屏幕上打印“你好”\n\n那么你就会看到计算机不断地打印“你好”这两个字。你要是不主动杀死这个程序，它就不会停机，它陷入了“死锁”。“死锁”是程序员的噩梦，有时候写程序说不定哪里没设计好，程序一运行起来就陷入了死锁。\n\
    \n所以程序员就有一个美梦。有没有一个什么软件工具，能就直接看一眼我写的程序，就自动判断它会不会出现死锁呢？\n\n这就是“图灵停机问题”。也就是说，有没有这样一个程序，它的输入是任何一段代码和这段代码的输入参数，而它的输出则是这段代码所代表的程序，在那个参数之下运行起来之后会不会自动停机——如果判断会停机，就输出“1”；如果判断不会停机、会死锁，就输出“0”。\n\
    \n想要做到这一点，这个判断程序必须只读、而不能去执行那段代码——因为如果执行，而那段代码又真的不停机的话，计算机就会陷入死锁，这个判断程序就不能输出“0”了。换句话说，这个判断程序得能像一个高水平程序员一样，看一眼你写的代码就知道其中有没有死锁。如果有这么一个判断程序，岂不是一个绝佳的\
    \ debug 工具吗？\n\n而图灵告诉你别做梦了，不存在的。\n\n在理论上就op不可能存在那样的判断程序。这是一个不可计算的问题。\n\n为什么呢？证明非常简单，反证法。以下为了行文方便我不得不使用一点编程语言——\n\
    我们假设存在这么一个判断程序，称为 Halt(p, l)。其中 p 是 Halt 要判断是否停机的代码，l 是程序 p 的输入。\n\n也就是说，如果程序\
    \ p 运行输入值 l 的时候会停机，那么 Halt(p,l) = 1；否则，Halt(p,l) = 0。\n\n好，那么我们构造下面这么一个新程序 [1]，称之为\
    \ Z：\n\n```\nProgram (x)\nIf Halt(x, x) then\n    永远循环\nElse 停机\nEnd.\n```\n\n\
    我解释一下。Z 的输入，是任意的一段字符串 x。x 可以是一段程序的代码，也可以是一段程序的输入。Z 的规则是，如果 Halt(x,x) 是 1，则 Z 就永远循环下去，不停机；如果\
    \ Halt(x,x) 是 0，则 Z 就停机。\n\n那么请问，像这样一个程序 Z，如果把它的代码自身，作为它的输入，会怎样呢？它会停机吗？\n\n如果会停机，那流れ含义着\
    \ Halt(Z,Z) = 1，对吧？可是你带入 Z 的规则之中，这时候 Z 就应该不停止。反过来説，如果 Z 不会停机，那么 Halt(Z,Z) = 0，带入规则之后\
    \ Z 又会停机！悖论！\n\n所以 Halt 这样的程序，根本就不可能存在。证明完毕。\n\n这个证明是否让你想起了我们讲逻辑思维的时候说过的“理发师悖论”。Z\
    \ 就是那个“只给不给自己理发的人理发的理发师”。这个悖论的关键就在于，一段代码，既是可执行的程序，又可以作為输入的字符串。所以我理解，这个矛盾的根源在于，写代码和判断代码，都是能用语言描述的行为。\n\
    \n# 3. 不可计算意味着什么\n\n现在图灵给了一个例子，说明世界上有些问题是计算机无法解决的。计算机无法判断任何一段代码是否会停机。这说明哪怕所有问题都能用数字编码，计算机也解决不了所有问题。\n\
    \n这有什么意义呢？\n这意味着总有一些事情，你只能慢慢等着它发生，而不能事先知道它的结果。这意味着程序员必须得程序运行一下才知道其中有没有 bug。这意味着理论是有限的，必须得实践才行。\n\
    \n这还意味着，世界上有些事情，你只能看着它发生，而无法解释它为什么会发生。这是因爲你始终都无法预测它会不会停下来，又何谈什么解释呢？\n\n那也就意味着，我们不可能完全理解真实世界。我们头脑里只是世界的模型——而世界的模型不能代表真实世界。世界上总有一些事情，是你没有办法用什麽简化的模型预测的，你只能看着它发生才知道结果。这是否使你想起了我们第一季讲过的“不可约化的复杂”\
