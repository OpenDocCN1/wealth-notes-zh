    # 高境界和高科技


    万维钢·精英日课³

    今天


    进入课程 ›


    高境界和高科技


    最近我们专栏在讲计算机思维，说了一点计算机科学的发展历史。我就忍不住想，咱们中国现在是计算机应用的至少第二强国，但是中国人对计算机*科学*做出过什么贡献呢？


    我想起了三个伤心的故事，请允许我用最简略的语言给你讲讲。


    # 1.大明“葡械师”


    公元1630年，也就是大明崇祯三年，中国在澳门开了一支高科技武装的外籍雇佣部队[1]。他们包括160名葡萄牙士兵，200名澳门本地人和100名非洲和印度人，他们愿意向大明皇帝效忠。大明为此总共花费了53000两白银，不跟
    шер每年数百万两的辽饷相比，这点钱真不算什么。


    这件事情的主要推动者是我们熟悉的徐光启。徐光启不但是担任过礼部尚书和内阁次辅的高官，而且还是个科学家，而且还是个基督徒。徐光启完全知道西洋火炮的厉害。徐光启的建议是招募300名葡人，购买1200支火枪，让他们训练两三万中国士兵，打造一支葡械师。


    按复旦大学侯杨方教授的观点，这有可能是大明阻止后金——也就是日后建立清朝的建州女真政权——崛起，避免亡国命运的最好的一次机会。


    # 2.给乾隆皇帝的礼物


    公元1793年，英国的马戛尔尼使团到达北京，名义上的意思是祝贺乾隆皇帝八十大寿，实际上是想搞个贸易谈判，促进两国通商。乾隆皇帝对英国人的通商请求一律不感兴趣，但是他对马戛尔尼带来的600箱礼物很感兴趣。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_130_0.png)


    这是一个会写字的机器人。而且写的还是汉字，而且用的是毛笔，而且字体很好看。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_130_1.png)


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_130_2.png)


    它写的八个汉字是：“八方归化，九土来王”。


    # 3.讲科学还是讲哲学


    中国在计算机技术的使用方面现在肯定是领先全球了，但是我们在计算机科学方面，可以说没有做出什么特别可见的贡献。以我有限的眼界看来，中国人对人类认识计算机、对计算理论，唯一能拿得出手的东西，是王浩在数理逻辑方面的工
    作。


    传统中国为啥在科技方面落后呢？有一种说法是从利益角度考虑。'
