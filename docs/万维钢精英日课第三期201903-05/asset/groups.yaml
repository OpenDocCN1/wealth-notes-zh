    # 《九个工作谎言》2：定计划不如给情报，定目标不如讲意义


    万维钢 · 糊英日课³

    今天


    进入课程 >


    《九个工作谎言》2：定计划


    今天我们继续讲白金汉和古道尔的《九个工作谎言》这本书。我认为贯穿全书的主要矛盾，是员工的个性化成长和公司的体制化压缩之间的矛盾。


    按最高级的道德标准来说，给一个公司当雇员，这个行为是有问题的。约西姆·塔勒布在《利益冲突》那本书中讲过这个道理 [1]，说如果一个人因为害怕独自面对市场风险，去躲在一家公司里工作，用顺从换取收入和安全感……那他和奴隶又有什么区别呢？


    如果你把工作当成和公司的交易，那你就不是一个自由的人。我们知道道德说真正的自由应该是无条件地做一件事情 [2]，而你给我工资、我听你指挥，这不是有倾向性的“假设律令”吗？


    当然现实是大多数工作的人都是雇员。我们仍然想说自己是自由的，我们做这份工作并不仅仅是为了挣钱和安全感，也是因为我们认可公司的理念，工作也是我们的爱好，谁也不能强迫我，是吧。


    原则上你的确可以这么说，但是工作都是具体的。公司总要给你设定一些目标，然后考核你是否完成了目标；公司总会给你安排计划，然后考核你是否执行了计划。如果这不叫强迫，那么什么叫强迫呢？


    # 1.目标和计划


    “目标”，是企业管理经久不衰的话题，各种学说层出不穷。我们经常听说就 reun SMART、KPI、BHAG，还有现在新近流行的OKR。但是在白金汉和古道尔看来，这些概念没有本质区别——它们都是公司自上而下管理员工的手段。公司希望目标能起到三个作用，但是都不管用。


    第一个作用是给员工一个压力。有明确目标，你就不能混日子，对吧？直观上有道理，但是实际应用中反而可能起反作用。你可能听说过这个段子：为什么下雨天，出租车司机都早会回家呢？


    按理说下雨天打车的人更多，司机应该趁机多赚钱啊，但是据说有研究发现他们反而更早收工回家。这是 drivers 给自己设了每天的工作目标，比如必须挣500块钱，完成不收工。平时钱难挣，下雨天很快就能完成目标，司机的选择是很正常回家休息。


    # 2.情报服务


    我读这本书的一个感受是，传统的 management 方式就好像是指挥一支19世纪以前的军队。那时候的燧发枪打不准，都是排成整齐的队列一起射击。那种指挥真是如臂指使令行禁止，还有人给配乐，士兵踩着鼓点前进，生死不怯。


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_65_0.png)


    以前的工人也像是机器一样，机械化大生产，大家动作一致节奏统一……


    # 3.驱使和监督


    理解这种管理就像放羊。领导是牧羊人，你给羊群划定一个大概的方向，羊群自己就会根据本地具体的地形走去。但是如果羊群走偏了，你也需要纠正一下。'
  - '[PAGE 66]


    如果羊群走偏了，你也需要纠正一下。


    这个大方向，由公司的使命决定。高层领导的首要作用是提供*意义*，也就是告诉员工我们为什么要做这个事业。我们看现在大企业的领导，包括罗胖在内，一开会都喜欢讲一些务虚的、哲学的东西，这就是讲意义。这本书专门举了
    Facebook 的例子，扎克伯格一对全体员工讲话都是说意义。


    意义能让员工对公司有足够的参与感。我们上一讲说的决定团队优劣的八个问题中的两个，“我对公司的使命充满热情”和“我对公司的前景充满信心”，都来自公司的意义，只是必须落实到团队才行。


    基层团队领导的作用，则是具体服务和督促员工。这个方法说起来也很简单，两位作者说，你要保证每周至少要和你团队中的每个人都谈一次话，问他两个问题——


    +   1. 你本周的优先事项是什么？

    2. 我能给你提供什么帮助？


    交流的频率比交流质量重要得多。你要把它当做刷牙一样：你的刷牙技巧好不好没那么重要，关键是你每天都得刷牙才行。


    这个问话可以帮助员工理清自己的工作思路和进度，而且能让你掌握团队的情况。如果这个人需要某方面的帮助，而你恰好知道另一个人擅长这个，你就可以建议那个人去帮助他。你会想办法提供团队需要的信息和资源，你的领导水平会因为这种对话而慢慢提高。


    更重要的是，你能通过这样的管理，让整个团队充分了解互相都在干什么。前面八个问题中有两个问题是“在我的团队里，我周围的人跟我的价值观是一致的”，和“我总可以把后背交给队友”，其实如果一个团队在这两个问题上不达标，通常不是因为员工自私不愿意互相帮助，而是因为交流不畅。


    总而言之，与其提供目标，不如提供意义；与其提供计划，不如提供信息。


    这样一来，公司和员工之间的关系就不是强迫和被强迫的关系。高层讲讲哲学，你要是赞成就一起干。根据咱们共同的核心理念，你该讲逻辑讲逻辑该讲理性讲理性，你自己就能推导该干什么和怎么干。


    然后公司给你提供信息和后勤服务，领导帮你协调和交流。主动权始终掌握在员工自己手里，管理层只是引导、赋能和询问。


    这样的工作关系，我想就算是康德都不会反对。


