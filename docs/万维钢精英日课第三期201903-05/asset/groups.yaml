    ## 三.回忆几位了不起的女性


    ### 1.沃克夫人（Madam C. J. Walker）


    她是一百多年以前的一位黑人女企业家，她就是沃克夫人（Madam C. J. Walker）。


    沃克夫人创业的那个年代，美国黑人地位非常低，她深陷贫困，是个单亲妈妈，而且还有病。她做生意处处碰壁，到外地出差连旅馆都不让她入住。但是她居然就慢慢做大了。


    以前我听说一句俏皮话，说“巴菲特等待机会，索罗斯寻找机会，本拉登制造机会”。沃克夫人，就是个能自己制造机会的人。


    沃克夫人历史上第一个成为百万富翁的黑人女性。她的创业故事咱们就不细说了，我只想说一点。沃克夫人专门雇佣黑人女性在各地当推销员，当时一般无技工工人的平均工资是每周11美元，而沃克夫人给这些推销员的工资，是每天，5到15美元。


    她想用高工资改变黑人女性的形象。沃克夫人要求手下这些女推销员攒钱买房，好好教育孩子，而且还要给慈善机构捐款！她可以说是以一己之力提升了黑人女性的社会形象。她把挑战都当成机会。


    她有很好的期望，结果就有很好的收获。


    ### 2.塔米·舒尔茨（Tammie Jo Shults）


    2018年，美国西南航空公司的一架波音737客机发生了重大事故。飞机起飞不久，左侧发动机就爆炸了。机长很好地操控了飞机，用一个发动机又飞了40多分钟，迫降，结果只有一名乘客死亡，七人受伤。事后乘客纷纷对机长表示了感谢，说她有“钢铁般的神经”。


    这个机长叫塔米·舒尔茨（Tammie Jo Shults），她是一位56岁的女性。舒尔茨曾经在空军服役多年，飞的是F/A-18战斗机，而在参军之前，她大学本科学的是生物学和综合农业。


    舒尔茨能在关键时刻镇定自若，也许是因为她经历过很多事情。她有不同领域的综合经验，她有能力处理复杂问题。


    ### 3.丽莎·兰道尔（Lisa Randall）


    《叩响天堂之门》的作者、女理论物理学家丽莎·兰道尔可能是个天才。事实上她十七岁的时候得过西屋科学奖——这是美国高中生在理工科方面的最高奖。不过在我看来她更有意思的一个事迹是，五岁的时候曾经有段时间，彻底不说话。她妈妈知道这孩子聪明，也不怎么担心，认为她纯粹是为了获得关注。兰道尔后来的解释是，因为她“只想说真话。”兰道尔说，她如此努力的原因之一，是如果自己真有天赋的话，不想辜负了这份天赋。


    兰道尔有一个做事风格。她很忙，做事之前都有计划，计划可能会变来变去，而一个特别之处在于，她非常关心自己在每件事情中能得到什么。


    比如有一次她在某地攀岩，途中兴之所至，临时飞去另一个地方参加图书节，结果听了作者的报告感觉不好，又觉得白费了。 有一次作家跟兰道尔住的海边只相隔半小时路程，二人用手机短信讨论要不要去海边看星空，讨论了一个小时——兰道尔主要担心是当晚可能多云根本看不到星星。


    最后二人去了，果然多云，不过云层中还是能看到些许星星。这时候有个细节，兰道尔试图把一颗人造卫星指给作家看，但作家没能看到。从这些点滴之中，我们还是能看出三件事来：


    - *兰道尔天生就比别人聪明得多，而且极大限度地发挥了自己的才能。

    - *兰道尔不但物理厉害，而且在生活中的很多方面，包括业余爱好在内，都有不寻常的追求，不怕折腾。

    - *兰道尔做事的目的性很强，总想得到结果和发掘意义——宁可花很多时间计划和改变计划，也不愿做一件没有意义的事。


    ### 4.雪莉·桑德伯格（Sheryl Sandberg）


    Facebook 的现任 COO（首席运营官），一位非常成功的商界女强人，是让 Facebook 产生盈利的关键人物，同时也是个很活跃的作家。


    她的丈夫2015年因为意外事故去世了，给她留下了一个7岁的女儿和一个10岁的儿子。当时桑德伯格面临的一个巨大困难就是怎么帮助两个孩子度过这个痛苦。她的做法就非常积极主动，自己找到专家，跟专家一起调研了有关培养孩子抗击打能力的最新研究，最后不但帮助了自己的孩子，还写了《B选项》，能够帮助更多的人。


    桑德伯格是个非常懂得知行合一的人。她做事——不管是公司的大事，还是个人生活的小事——非常愿意寻求专家的意见，而且还都是领域内的一线专家的意见。她听说了一个理论，哪怕是个刚刚研发出来的新理论，都能马上付诸实践。


    这样的人做事就特别有章法，她每一个动作可能都不是随意的，都能讲出道理来。一旦失去章法，像遇到丈夫去世这样的打击导致自己的行为失控，她会感到非常不安。


    而且，桑德伯格并不死板。她自己在做事，同时还能以一个旁观者的视角观察自己，评估每个套路的实践效果，看看你跟她说的那个理论好不好使，随时获得反馈随时调整。


    中国有句话叫“上士闻道勤而行之”，我看桑德伯格就做到了这一点。当然她能做到这一点是有条件的——她在公司的职位很高，有很多决策机会能实践各种理论，她的朋友圈也是极其硬核，能给她提供第一流的建议。


    下面这张图，是桑德伯格丈夫去世以后，她在家里和两个孩子共同商定的“家庭规则”。这就是精英水平的做法章法。


    桑德伯格这样的人，真是咱们专栏读者的榜样啊。


