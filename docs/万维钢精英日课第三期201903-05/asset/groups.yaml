    # 期权的智慧2：如果有特权你应该喜欢什么


    万维钢·精英日课³

    今天


    我们继续来说说期权的智慧。期权就是可选项，可选项可以是个很宝贵的东西，因为你只有权利，而无需承担义务。股票期权是非常成熟的东西，袁老老师在得到APP的《财富思维课》里还讲过实物期权
    [1]，在这些领域，因为交易频繁，可以说市场是基本均衡的。再考虑到很多人用期权投机，这些期权的价值已经体现现在价格上了，而且可能还被高估了，并不适合非专业人士裸买。


    但是如果你有期权思维，你会发现有很多可选项的价值被低估了，没有被充分交易。很多时候人们不一定能意识到那是一个期权。


    中国球员武磊最近在西甲联赛表现非常好，他的身价已经达到了500万欧元。但是你可能不知道，武磊的第一次转会，是徐根宝把武磊买到上海崇明岛训练基地，才花了4万元人民币
    [2]。因为当时武磊是十二岁。


    # 1.期权的价格


    期权其实是一个很古老的东西。用定金锁定未来的交易价格，这种行为早在古希腊就已经存在。期权在近代股票市场上也是很早就出现了。但是期权到底应该如何定价，这个问题直到1970年代才被解决，而且还得了1997年的诺贝尔经济学奖。


    # 2.期权喜欢波动性


    # 3.特权挑选极端'
  - '[PAGE 149]


    一个就不错了……中国足球不行的根本原因在于缺球星，缺球星的根本原因在于踢球的孩子太少。


    塔勒布给期权做了一个定义——


    Option = asymmetry + rationality


    期权 = 不对称性 + 理性选择


    因为有不对称性，你这才是一个特权；而理性选择是你对特权的行使。理性选择并不是一个很高的要求，如果你只有权利没有义务，你真的不需要太高的专业技能，你只要懂得挑选就可以。没有特权的人只能勤学苦练，有特权的人看着别人勤学苦练。最成功的老板常常不是专业水平最强的人，但是他们非常善于使用特权。


    # 自己开公司是股票思维，风险投资是期权思维。你正在研发一个可能一鸣惊人的项目，那请允许我在这个项目还没惊人的这个时刻，给你投一点钱。如果项目不成，我的损失很小；如果项目能成，我保留了上不封顶的获利可能性。你自己尽心尽力，我享受不对称性。乔布斯为什么说要“保持饥饿，保持愚蠢（stay
    hungry, stay foolish）”呢？因为有特权的人不用太聪明，只要胃口够大就行。


    # 奋斗是股票思维，演化是期权思维。大自然不知道哪个方向是正确方向，它只是让各种生物在各个方向都尝试而已。万一哪个基因突变特别好，大自然就可以“选择”那个生物——这就叫“自然选择”。


    # 结婚是股票思维，暧昧是期权思维。一个具有优势地位的大小姐，她有众多的追求者，那么她就很可能会鼓励那些追求者们去做一些冒险的事情，来向她证明实力。比如她可以搞个什么“比武招亲”之类的活动。她不在乎谁落败，她只要挑最后胜出的哪一个就行了。“龙虾教授”乔丹·彼得森在《12条人生规则》这本书里对此非常感慨，说女性真是代表混乱啊……我们这一讲看来，这个混乱，就是期权喜欢波动性。


    # 供给则是股票思维，需求则是期权思维。生产者必须把产品做好，而你作为消费者，对选择产品只有权利没有义务。所以你会希望市场有多样性，你会希望商家冒险研发新产品，最好多来一些颠覆式的创新……你不在乎谁破产。


    那既然期权有这么多好处，为啥人们还要买股票呢？可能因为某些期权的价值被高估了，可能因为期权有到期时间，可能因为有些期权不可交易。而我认为最重要的理由，是买股票——也就是说亲自承担下行的全部风险——才是
    skin in the game，才是利益攸关，才有资格出手干预。关于这一点咱后面再说，我们还要再讲一点操作原理。


