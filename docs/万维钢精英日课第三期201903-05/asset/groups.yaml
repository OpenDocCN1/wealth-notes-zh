    ## 《九个工作谬言》4：“莫论人非”反馈法，“刮目相看”领导术


    万维钢·糖蒜日课³

    今天

    进入深读 ›


    今天我们继续讲白金汉和古道尔的《九个工作谬言》这本书。这一讲的主题是如果你是一个领导，你应该如何帮助你的手下成长。


    人不是机器。机器可以操作可以修可以放着不管，而人，是需要管理的。好领导不仅能用现成的人才，还能让人在他的手下进步。


    ### 1.负面反馈真的好吗？


    现在美国公司流行让员工互相反馈。就好像组织生活会一样，大家开展批评和自我批评，开诚布公360度无死角。


    ### 2.人到底想要什么


    所以结论是有关注远远好于不关注，而正面反馈显著好于负面反馈。那正面反馈应该怎么给呢？


    ### 3.怎样给反馈


    脑神经科学对大脑的理解是这样的。技能的成长，不是短板长得最快，而是长板长得最快。


    那么小李就会在这个方向上继续变得更好，他会成长为你们团队在那个方法上的权威专家。你把他的无意识变成了有意识。这有点像“穷宠淑女效应”：小李会往哪个方向变，取决于你把他往哪个方向夸。


    当然这也不是说别人做错了你就全忽略，但是给负面反馈一定要非常小心才行，必须坚持对事不对人的原则。白金汉和古道尔引用了几项相关的研究，认为正面反馈和负面反馈的配比应该控制在
    3:1 到 5:1 之间 —— 也就是说每给一个差评，你需要给三到五个好评才行。


    再比如说，员工遇到一个技术困难，不知道怎么解决，来寻求你的帮助。其实你也不太懂 —— 要不怎么让你当领导呢 —— 但是你可以给他一些启发。你可以问他三个 what
    ——


    - 1. 现在你手头的各项工作里，有哪些是进展良好的，你能不能借鉴一下这些管用的方法？这个问题就好像催产素一样，能给他提供安全感，把他的思路打开。

    - 2. 你以前遇到类似的问题，是用什么方法解决的？

    - 3. 有没有什么动作是你已经知道应该做的，有没有什么现成的解决方案？


    如果你搞过技术你就会有这样的经验：往往在跟人讨论的过程之中，哏怕那个人并没有提供什么新思路，但是因为你理清了思路，突然就想到解决方法了。


    所以要问 what, 不要问 why —— 问 why 没有启发的效果, 反而还有点追究责任的意味, 容易让他思维闭合。


    *


    总结来说，人和人互评，特别是提出负面反馈，很难做到客观公正。你理解不了别人，你最多只能谈谈自己的感受。员工真正需要的，是你的关注。


    老百姓看人看缺点，领导者看人一定一定得学会看优点。你得克制批评的冲动，养成随时能发现别人闪光点的习惯，这也是一项需要练习的技能。


    自己专业水平高但是只会亲力亲为，然后看队友干活怎么都不顺眼，这样的人肯定不能当领导。一个自己不一定有多少专业技能的人，却能帮着团队里那些技术高手提高专业技能，这才叫领导力。


    注释

    [1] 精英日课第二季，《激进的公司什么样》。

    [2] 后者叫“自利性偏误 (self-serving bias)”，也叫“行动者和观察者偏误 (actor-observer bias)”。我们在《别人都在马斯洛金字塔的下部，我在顶层》和《失败不是成功之母，成功是成功之母》中说过。

    [3] 精英日课第一季，《俭省》解读4 - 穷宠淑女效应。


