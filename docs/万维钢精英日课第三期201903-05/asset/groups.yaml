  mdcn: '

    从逻辑角度来说，小明考试没过这件事可以有各种原因。也许是小明不努力，也许是老师不好好教，也许是这次考试太难了，也许是小明病了，也许我国的教育系统逼着小明这样的文艺青年去死记硬背那种考试知识根本就是个错误。


    有句话叫“雪崩时没有一片雪花是无辜的”，你说你指责谁呢？所以尤金侬亚·程对这个问题的结论是与其琢磨该指责哪一方，还不如好好理解一下这个*系统*到底是怎么回事。


    这个结论对是对，但我觉得有点意犹未尽，所以我再多说几句。有些事儿的确是可以指责一方的。比如你的眼镜掉在地上摔碎了，这难道应该怪地太硬吗？肯定要怪你自己不小心。找到责任方可能比较难，但我们并不是完全没有办法。


    以前刚刚得知里皮要执教国足，我记得虎扑论坛上有人说，这回我们终于能破解中国足球的一个重大迷团了：中国队不行，到底是球员不行呢，还是教练不行。这是因為此前每一个中国队主教练都被球迷说不行，而我们公认里皮是绝对行的……当然里皮不能解决我们所有的疑惑，比如我们还可以说是足协、俱乐部老板或者球迷不行。


    到底应该指责谁呢？这个问题其实是有解的。我们以前讲朱迪亚·珀尔的《为什么为什么》那本书的时候，有一期叫《到底应该怪谁？》，其中讲到了大卫·休谟的“but-for”判据，讲到了珀尔的“充分概率”和“必要概率”，就是目前为止，逻辑学所能提供的最好答案。


    我看人们犯逻辑错误，或者是因为被某种强烈的感情所刺激，或者是出于某种目的，想要跳过逻辑，提出很激烈的说法。逻辑，总是要求你稳一点、慢一点，说得浅一点。逻辑要求我们不被感情挟持，保持理性的克制。这么做绝不是软弱，讲逻辑才是最硬的、能确保自己不受攻击的力量。


    以前毛泽东头脑特别清醒，曾经提出过一个“对蒋斗争三原则”：有理，有利，有节。在我看来这比“矫枭必须过正”不知高到哪里去了。讲逻辑就是有理。不犯逻辑错误，首先保全自己不受打击，才可能有利。不搞极端否定，坚持逻辑否定，就是有节。


    讲逻辑，有理有利有节，你在任何争论中都会立于不败之地。


    截此复习：到底应该怪谁？


