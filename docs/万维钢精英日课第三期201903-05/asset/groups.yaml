    ## 《生命视角》7：难以模仿的创新


    万维钢·精英日课³

    今天


    《生命视角》7：难以模仿的创新。


    今天咱们继续讲戴维·威尔逊的《生命视角》这本书。这一讲的主题是演化思维怎么看企业创新。


    以前凯文·凯利在《科技想要什么》这本书里就曾经把技术的演化和生命的演化做了类比。技术就像是一种生命一样，可以长大、可以生殖、可以交配，有基因突变和环境选择。我们需要用演化思维理解科技创新。


    凯文·凯利看的是一个比较宏观的视角。而威尔逊看企业创新，看出了一个方法论问题——我认为这个问题特别值得咱们中国人思考。


    最近人民大学的金灿荣教授做了一个报告，讲中美关系和中国未来的发展，非常鼓舞人心。金教授说了一个数据是这样的。美国每年批准的这么多专利之中，只有3%，最终能被企业收购。而在这些被收购了的专利中，又只有1%，最终真正实现了市场化。这样算来，就是只有万分之三的专利是有用的。可知创新意味着极大的浪费，创新，是一个非常贵的东西。


    金教授说，那么既然如此，中国企业现在这个模仿和跟随式的创新策略就是高效率的。我们可以专注于被美国人证明有效的那个“3”，把它拿到中国来做大做强，而没必要再去做其余
    9997 项研发。不过金教授认为，这个做法差不多只能再持续十年——因为十年以后，中国的技术水平会超过美国，那时候想跟随也找不到可跟随的对象了。


    事实证明中国的跟随策略非常成功。这其中的关键因素是咱们中国有全世界最完备的工业体系和最大的市场，我们非常善于把发明创造市场化。可是别的国家想这么干也没有这个条件。


    但是十年之后怎么办呢？威尔逊给我们提供了一个视角。我们先从丰田汽车公司说起，它在创新方面有自己独特的一套。


    丰田汽车起源于一百年前“丰田自动织机公司”，创始人叫丰田佐吉。从生产织布机开始，丰田公司就有一个独特的创新基因。


    话说有一次，丰田织机公司最新型的织布机图纸被人偷了。竞争对手拿着这个图纸就可以生产跟丰田一样的产品。当时丰田佐吉发表了一个讲话，他是这么说的——


    > 那……我们只要继续改进就行。


    我不知道今天有多少中国企业家有这样的自信气度。丰田真正了不起的地方不是图纸、不是专利、也不是哪一项具体的技术，而是创新的本领。


    经济学家通常假设，一个好技术只要一出来，很快就能传播开来，因为别人看见会模仿。但是威尔逊提醒我们，创新出来的结果也许可容易模仿，但是创新的本领，是很难模仿的。


    丰田公司的创新本领，是一个它自己都说不清楚的系统。


    造汽车是个非常复杂的事情，你要愿意找，随时都能找到可改进的地方。咱们举个简单例子：备料。


    工人在生产线边上挨排站好，每个工人只干几件事。要想有高效率，就要求不能把零件一大堆一大堆地搬散来；应该是一小盒一小盒的，放在工人伸手可及的地方。那么这就有
    一个合理备料的问题。给了多了太占地方施展不开，给少了又跟不上进度。


    为了让组装的工人干活又快又省力，备料的工人就加快备料的频率。可是备料工人也有一个效率问题。那组装和备料到底怎么配合最好呢？这 需要在实践中摸索和改进。


    而丰田公司每天都在改进。流水线上的任何一个工人只要觉得干活有任何不舒服，可能哪个螺丝不对，哪个零件供应没跟上等等，就 可以拉停整条生产线。然后应急团队就会立即过来帮着解决问题。如果上级认为这个问
    题有推广价值，这就是一次改进。每一个班组一天，平均要叫停生产线1000次！


    其实丰田也有办法减少叫停次数。比如说在常规的备料传送带之外，还有一个“库存缓冲带”，放着备用的零件。万一常规传送带上的零件没跟上递，你可以到缓冲区拿零件直接用。但是丰田公司不希望你总是去缓冲带拿零件，因为这就等于掩盖了备料的问题。


    研究者注意到，有一天，生产线拉停次数 只有700次，结果班组经理就不干了。经理说拉停次数这么少只有两种可能，要么就是有问题你们不汇报，要么就是有问题没发现，反正不可能没问题。于是他就下令减少放在缓冲区里的零件，让低效的问题暴露出来。


    像这样故意找毛病的做法，有多少公司能做到呢？


    以前我们专栏讲《敏捷项目管理》（Scrum）这本书的时候说过丰田的故事[1]。我们知道，在高端轿车生产领域，日本公司造一辆车只需要16.8个小时，平均一百辆车只有34个毛病；而欧洲包括宝马公司，造一辆车平均需要57个小时，而其每一百辆车有78.7个毛病。


    丰田这个做法，别人很难学会。美国和欧洲汽车公司为了保证效率，都是禁止工人随意叫停生产线；而丰田为了提高效率，要求工人多多地叫停生产线。


    其实连丰田自己都没搞明白自己为什么这么厉害，造汽车实在是太复杂了。后来是丰田专门请了一些搞管理咨询的人来研究自己，而这几个人碰巧学习过演化思维，他们才用演化思维对丰田的方法提供了一个解释。


    演化思维认为，


    改进 = 突变 + 选择


    对公司创新来说，“突变”有两种方法。一个是公司看看现在有什么新做法可以借鉴，拿过来一个一个主动测试。另一个就是像丰田这样，不知道问题在哪里，但是知道一定有问题，在实践中随机发现可以改进的地方。


    而在“选择”这一步，我们得先有一个标准。这个标准可以是增加销售利润，提高生产效率，或者研发新产品。不管是什么标准，有标准就有了“选择压力”，用这个标准判断哪些突变应该坚持，哪些应该忽略。


    丰田生产线的做 法相当 于被动等待改进出现。演化思维还提供了一个更激进的创新方法，叫做“快速结果法（Rapid Results）”[2]。


    一个企业在平稳正常运行的时候，一般不容易看出来哪里地方需要改进。但是 如果这个企业突然面临一个大事件，导致一次超水平发挥，你观察一下大家都有那些超常的表现，这就是一个改进的思路。


    比如说，曾经有 一个石油开采公司，有一次因为意外事件，450个人被困在野外要干3000个人的活，而且干了四个月。结果他们居然就把油井管理得非常好。那我们就
    要想想，他们是怎么干的呢？我们能不能把这个应急的做法干脆固定下来呢？


    换句话说，打硬仗是重大的学习机会。在这种特殊时期，公司的上下级关系、官僚主义的那一套就都没有了，听说特办。一线员工终于有了发言权，而他们本来就是最知道应该怎么办事的人。这场战斗打赢了，效益显而易见，这时候你再推广新方法，遇到的阻力就要小很多。“快速结果法”，可以说是一个变法引爆器。


    “快速结果法”，可以说是一个变法引擎啊。


    有个国际慈善组织叫“快速结果学院（Rapid Results Institute）”，在非洲使用这个方法搞了很多非营利组织做事的创新。


    那好，请问有多少公司在用这个方法呢？很少很少。包括丰田的创新方法，真正能应用的公司也很少很少。甚至连听说过这些方法的人都很少。所以威尔逊感慨，推广演化思维，真是任重道远啊。


    *


    威尔逊没提中国，可是我就忍不住想，丰田这一套，能不能移植到中国来呢？


    威尔逊认为丰田是很難学的。丰田就好像是一个生物，它是慢慢长出来的，它是演化的产物，而且自身也在演化——丰田是“演化的演化”。丰田每一个新员工都要有一个老师傅带著，就好像中国以前的国企那样是师傅带徒弟。丰田提拔干部都是尽量从公司内部提拔。丰田，来自传承。


    那我们设想一下，如果要在一个新地方复制丰田，你就会面对传承的问题。你不得不招很多新的工人，就算这些工人都是高素质的人，可是他们的师傅在哪里？新公司的文化传承在哪里？创新系统需要传帮带。


    演化思维认为复制是有限的。哪怕一个新物种再有效率，它也不会迅速占领整个地球！它要受到地域的限制，可能离开熟悉的一方水土就无法繁衍下去，也许它只能在本地生长。把基因传播到类似的群体中去，有可能需要很长很长的时间。


    现在中国的创新能力在很多领域已经领先于全世界，但不能说没有短板。如果给一个明显正确的方向，让我们搞攻关和改进，把技术细节实现出来，我想中国有最优越的研发能力和市场条件；但要说那种突破性的、颠覆式的、非计划的创新，我感觉还不够。


    我们需要更高级的创新气质，我们需要生长有中国基因的创新系统。


    注释

    [1] Jeff Sutherland, J. J. Sutherland, Scrum: The Art of Doing Twice the Work
    in Half the Time（《敏捷项目管理：事半功倍的艺术》）2014；精英日课第一季，《哪怕你兢兢业业地干活，大部分工作也被浪费了》。

    [2] 出自管理咨询家 Robert H. Shaffer.


