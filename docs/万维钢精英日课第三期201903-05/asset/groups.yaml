    # 花刺子模信使问题


    万维钢 · 精英日课³

    今天

    进入详情 ›


    请允许我用王小波用过的标题写一篇文章，我实在是佩服王小波。我们这一讲的内容，是王小波当年说过的一个现象的最新研究进展。


    1995 年，王小波在《读书》杂志发表了这篇叫做《花刺子模信使问题》的文章。这是一篇只要读过就不会忘记的文章。王小波说——


    > “据野史记载，中亚古国花刺子模有一古怪的风俗，凡是给君王带来好消息的信使，就会得到提升，给君王带来坏消息的人则会被送去喂老虎。……花刺子模的君王有一种近似天真的品性，以为奖励带来好消息的人，就能鼓励好消息的到来，处死带来坏消息的人，就能根绝坏消息。”


    王小波主要是在批评那些不但自己听不得坏消息、而且还要惩罚带来坏消息的学者的那些领导干部。学者搞学术研究总不能预设立场，只有真实的结论才有用。犹豫带来坏消息的学者会把国家变成谎言之国……可惜王小波的话并没有带来什么重大改变，现在
    24 年过去了，敢于带来坏消息的信使更少了。


    所以花刺子模君王的毛病是根深蒂固的。事实上，不光是领导，也不光是中国人，是古今中外每个人都有这个毛病。英文世界对此有个专门的名字词，叫“射杀信使（shoot
    the messenger）”，意思就是当我们听说一个坏消息的时候，我们会因为不喜欢这个消息，而连带地想要把带来消息的人给于掉。


    不过这通常不是因为我们出于策略性的考虑，想要以此来杜绝坏消息。哈佛商学院的莱斯利·约翰（Leslie K. John）、海莉·布兰登（Hayley Blunden）和刘黑迪（音译,
    Heidi Liu），最近发表一项研究 [1]，认为“射杀信使”，是人的一种心理本能。


    研究者做了几个非常简单的实验。一个实验是抽奖，研究者提供了一个帽子，里面放了很多纸条。抽一个纸条出来，如果上面写着中奖，受试者就能得到 2 美元。有两个实验人员参与抽奖，一个负责帮受试者从帽子里抽纸条，一个负责告诉受试者中奖没有。


    结果，统计发现，如果没中奖，受试者就会很不喜欢那个负责通知他中奖与否这个消息的实验人员。


    但这肯定是非理性的！因为那个实验人员只是负责通知消息而已，她不是替受试者抽奖的人，抽奖结果在她之前就已经定了，她只是一个信使！


    我们专栏经常说，人自做自己熟悉的事情的时候是非常理性的。听一个陌生人告诉自己坏消息肯定不是我们熟悉的事情。那我们为什么会有这种非理性的情绪呢？是不是因为坏消息影响了我们的心情，从而导致看谁都不顺眼呢？


    并不是。我们设想这么一个场景。现在航班要晚点两小时，机场安排了两个工作人员来把这个坏消息通知给登机口正在焦急等待的旅客。两个工作人员看上去没什么区别，只是他们中的一个人负责宣布这个消息，另一个人只是站在他旁边。那如果人们憎恨信使是因为心情不好还怒于人，旅客应该对这两工作人员都
    rad 不喜欢才对。但实验结果是旅客只憎恨那个宣布消息的人。


    那这是什么道理呢？研究者认为，这是因为我们想要一个解释。一个坏事发生了，理性考虑可能有各种原因，也许事发纯属偶然，也许就是我们自己的原因——但是我们本能地，强烈地想要把坏事发生的原因归于别人，我们必须找一个能负责的人。那么说出这个消息的人，就是我们最直接的备罪对象。

    如果跟这个消息无关，你为什么要告诉我这个消息呢？


    这是一个非常不讲理、但是又非常自然的情绪流动。研究者还有更惊人的发现。比如说一个病人去医院做皮肤癌检查，检验完毕，一个医生告诉病人，说病理的结果是你得了皮肤癌——那么实验表明，病人不但会因此而不喜欢这个医生，而且还会认为这个医生*希望*他得癌症！


    如果是这样的话，花刺子模君王如果要杀死医生，就是可以理解的：谁让你盼着我得癌症的？

    也许君王真的认为杀死坏消息信使能在一定程度上杜绝坏消息。放着那么多好人好事你不研究，你为何非得研究这些阴暗面？难道不是因为你的希望就是如此吗？


    我们想在生活中是不是也是这样。你满怀关切之意，告诉亲友一个坏消息，结果他对你产生了敌意。……而且这里也有一个坏消息——

    当别人满怀关切之意告诉你一个坏消息的时候，你也会对他产生敌意。


    在职场中，这样的事情屡见不鲜。心理咨询师曾经分享过这么一个故事 [2]，说一个朋友发现工作中的一个问题，报告给了领导。这个问题不解决就会大影响工作质量，于是整个团队连续加班两星期，把问题解决了。但是，不但领导没有因此表扬他，团队的同事更是对他有意见。

    根据今天说的这个研究结果，我猜想，大家在心理上，有那么一丝情绪，认为是他导致了这个问题。当然没有人会承认自己有这个想法，但是那个情绪一定在那里。


    那你说有没有什么办法，能让我们避免这个非理性的情绪呢？比如说，我们能不能给人普及一下这个心理学知识，告诉大家信使就只是信使，信使没有导致坏消息呢？

    哈佛这几位研究者认为这是不太可能有什么效果的。对此我完全理解。我们专栏以前说过，像“安慰剂效应”，其实纯粹是起源于心理上的，但是哪怕你知道有安慰剂效应，你还是会产生安慰剂效应
    [3]。


    我们讲《为什么佛学是真的》的时候说过 [4]，情绪这个东西，你无法阻止它出现——你所能做的只有在它出现以后，识别它、接受它、观察研究它，然后才能够跟它分离。而那是一个非常不一般的功夫。


    所以，“射杀信使”的原理，给我们最直接的教育，就是……不要当那个信使。

    有什么坏消息尽量让别人去说。这也可以说是为什么尽量不要给人提供负面的反馈。

    ……当然这是不负责的做法，所以我们得修改一下——如果你不得不传递一个坏消息，那你应该想办法让对方相信，你完全是出于好意。如果做不到这一点，那你至少应该有个思想准备，对方会有一筋想要射杀你这个信使的冲动。


    而另一个教训，则是不要射杀那个信使！想要严肃认真地搞点大事，你就得学会用理性克制自己的非理性冲动。说到这里倒是有段佳故。

    文史学者胡文辉，曾经专门考证过，王小波说的这个“花刺子模君王杀信使”的典故，到底是出自哪里呢？结果他没找到，连野史的记载都没有 [5]。但我总觉得王小波绝不至于凭空杜撰一个故事，就算是要杜撰，为何非得是花刺子模呢？要知道花刺子模是中亚历史上一个被成吉思汗的蒙古大军灭亡了的国家，并没有留下多少典故和传说。


    所以我进一步考证，还是找到了一点线索。英文维基百科中“射杀信使”的条目中 [6]，说这个常用语的来源之一，是来自中国的“两国交兵不斩来使”这句话。而我又在别处发现
    [7]，花刺子模在真实历史上，就的确发生了一次斩杀来使的事情！

    原来当初成吉思汗本来没想灭掉花刺子模。一开始，成吉思汗跟中东国家建立商贸往来，派了一支 500 人的商队，前往中东做生意。商队途经花刺子模，被该国一个官员给扣下来了，而且那个官员下令杀死了商队几乎所有的人，只放跑了一个。成吉思汗得知此事大怒，但是就是这样，也没说要灭掉花刺子模。

    成吉思汗给花刺子模君王派去了一名信使。

    信使带来成吉思汗的要求是斩首相关官员，ẫn通商路。

    但是也不知道花刺子模国王脑子里是怎么想的，他杀死了信使。这是我们能找到的唯一一次，花刺子模君王杀死信使事件。

    也正是因为这个事件，成吉思汗调动 20 万蒙古大军灭掉了花刺子模。


    所以，想要杀死信使是一种正常的人类本能'
