    特别放送：九个工作谎言和真相。


    万维钢


    咱们刚刚讲完《九个工作谎言》这本书，今天我们来帮你做个总结。咱们就按照书里提到的这9个工作谎言，来来讲一下这本书里提到的有关领导力、团队管理、目标、人才、反馈等等认知，希望对你重新理解和看待工作这件事有所帮助。


    ### 谎言1：人们很在乎自己是为哪个公司工作


    事实：人们在乎的是自己在哪个团队工作，因为具体工作都发生在团队之中。


    由此得到：


    - 1. 企业文化不是你能控制的，你真实的工作体验，跟企业文化也没太大关系。

    - 2. 你是在团队里工作，真实的工作都是在本地进行的，直接影响你的，是你所在的团队。

    - 3. 业绩好的团队，在团队体验和个人体验上，有这样八个共同体验：

    - 4. 如果你是一个团队的领导，提升手下的工作体验方法：


    ### 谎言2：最好的计划能取得胜利


    事实：最好的信息和情报能取得胜利，因为世界变化比计划快得多。


    ### 谎言3：最好的公司向下传递目标


    ### 谎言4：最好的人才是全面发展的人


    ### 谎言5：人们需要反馈


    ### 谎言6：人们可以可靠地互相评价


    ### 谎言7：人才分为有潜能的和没有潜能的


    ### 谎言8：最重要的是保持工作和生活的平衡


    事实：热爱自己的工作才是最重要的，因为那才是工作对人真正的价值。


    由此得到：


    - 1. 我们不应该追求什么工作跟生活之间的平衡，因为你平衡不了 —— 我们真正应该追求的，是在工作之内的幸福。工作的幸福就是对特长的自我表达。

    - 2. 如果你工作中有20%以上时间做的是你“乐之”的事，你就不会有过度疲劳。低于20%，每低一个百分点，你的疲乏力竭感就会上升一大块。

    - 3. 每隔半年，就用一周的时间，详细考察自己每天在工作中做的每一件事。你弄个表格，左边写上“热爱”，右边写上“痛恨”，把热爱的和痛恨的都记录下来。然后你看看能不能自己调整一下工作内容，少做一些痛恨的，多做一些热爱的。


    ### 谎言9：领导力是一个“东西”


    事实：我们追随有突出特长的人，因为他能带给我们确定感。


    由此得到：


    - 1. 科学的方法，不是其实一个抽象模型去测量一个领导者的各项能力指标 —— 而是研究他带给别人的是怎样的体验和感受。你不应该去考察领导者（leader）本人，你应该去考察那些追随他的人（followers）。

    - 2. 领导的定义是，有人追随他。

    - 3. 领导真正给人提供的东西，是“确定感”。领导的本质，就是在不确定的世界中给人提供确定感的人。


    ## 值得记住：


    - *我们很容易被各种大而化之的标签所感染，有时候分不清自己到底是跟什么打交道，可能是在向风车宣战而不自知。

    - *与其提供目标，不如提供意义；与其提供计划，不如提供信息。

    - *伟大的公司，不可能是一群奴隶建造起来的。

    - *梅西不是管出来的。梅西是惯出来的。

    - *一个自己不一定有多少专业技能的人，却能帮着团队里那些技术高手提高专业技能，这才叫领导力。

    - *工作的幸福就是对特长的自我表达。

    - *只要你始终处在一个被驱使、不自由的状态，不管这个状态是工作还是生活，你的人生都是失败的。

    - *对不对，好不好，你说的真不算。但是热爱不热爱，那只有你说了算。

    - *所谓特长，不是你特别擅长，而是你特别热爱。

    - *越是人才，越是极端的人。

    - *世界充满不确定性，但是它喜欢奖励冒险的人。世界往往是被这些人，而不是聪明无瑕疵的人，改变的。

    - *工作是具体的，公司是虚拟的。

    - *定计划不如给情报，定目标不如讲意义。

    - *挽弓当挽强，用人当用长。

    - *“莫论人非”反馈法，“刮目相看”领导术。

    - *生活不只是工作，工作可以是生活。

    - *王霸之气何处有，众望所归能几人。


