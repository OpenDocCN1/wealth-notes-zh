    ## 逻辑思维2：三个常见的逻辑错误


    万维钢·精英日报³ 今天 进入课程 >


    逻辑思维2：三种常见的逻...


    今天我们继续说尤金侨亚·程的《不讲逻辑的世界里的逻辑艺术》这本书。我感觉很多人犯逻辑错误并不是因为真不懂逻辑。日常生活中的逻辑都是比较简单的，你要给他讲理他其实能听明白，但是他总要自觉不自觉地犯这种错误。


    逻辑有点像交通规则。我们理解交通规则，我们知道开车不应闯红灯过马路不应该跨越交通护栏——但是我们总会忍不住地想要跳跃规则。


    哪怕没出事，你看看监控录像里面那些违反交通规则的行为也会觉得很离奇；一旦出了事，违反交通规则的一方就得受到惩罚。逻辑也是这样。如果你在正式的场合，情急之下说过有逻辑错误的话，不管造成没造成严重后果，你事后再看都应该感到无地自容。


    尤金侨亚·程写这本书的本意是让读者学会避免逻辑错误。不过在我看来，逻辑思维也可用作武器：我们识别一些常见的逻辑错误，就能够随时抓住“对方辩友”的漏洞了……


    这一讲咱们说三个最常见的逻辑错误。


    ### 1.逆命题


    最基本的逻辑推导—— A ⇒ B


    我们称之为“命题”。注意，命题是有方向的。如果命题 A ⇒ B 成立，我们说 A 是 B 的“充分条件”，B 是 A 的“必要条件”。调转方向，命题 A ⇒
    B 的“逆命题”，是 B ⇒ A


    我敢打赌这些说法你在学校都学过。我们这里要强调的是，命题和逆命题是完全不同的两码事：一个命题成立，完全不代表它的逆命题也成立。


    咱们举个例子。国际足联规定，一个国家的国家队队员必须是该国公民。那么我们可以说下面这个命题是成立的： 入选中国队 ⇒ 是中国公民 而它的逆命题则是 是中国公民
    ⇒ 入选中国队


    这就显然不成立了。是，现在有很多外援因为没有中国公民资格而无法入选中国队，中国公民资格对他们来说很重要——但是，你是中国公民可不代表你就一定能入选中国队。中国公民是入选中国队的必要条件，而入选中国队则是中国公民的充分条件。


    你看这个道理很简单，但人们就是会在这里犯错误。比如说，有一位女权主义者在微博说：“所有女性都经历过性别歧视”。用逻辑语言，她这个命题就是—— 你是女性 ⇒
    你经历过性别歧视


    微博上有人反对她的意思，说“不对啊，我是个男的，我也经历过性别歧视！”这个反对就是无效的。这个反对者真正反对的其实是上面那个命题的逆命题—— 你经历过性别歧视
    ⇒ 你是女性 而我们知道，命题和逆命题完全是两码事。这位反对者强烈地想说话，可是他说不到点子上。他有反驳的意愿但是没有反驳的能力，他只是在发泄围观群众的感言而已。


    那到底应该怎样否定一个命题呢？


    ### 2.否命题


    如果我说“橘子比苹果好吃”，你应该怎么否定我这句话呢？


    从直觉上来说，可能很多人给的答案是“苹果比橘子好吃”——这个答案是错的。正确的否定是“橘子不比苹果好吃”，因为哪怕橘子和苹果一样好吃，我说的命题也错了。


    “橘子不比苹果好吃”，这是逻辑否定。如果你非要说“苹果比橘子好吃”，那就是一个极端否定。人们在日常生活中经常喜欢用极端否定，但那是不合逻辑的，你应该使用逻辑否定。咱们再举几个例子。


    命题：吴亦凡是个好演员。 极端否定：吴亦凡是个坏演员。 逻辑否定：吴亦凡不是个好演员。吴亦凡可能是个平庸的演员，但不等于他是个坏演员。


    命题：全球变暖绝对是真的。 极端否定：全球变暖是假的。 逻辑否定：全球变暖可能是真的。也许是真的也许是假的，我们现在还没有充分的证据。


    命题：吃保健品对你的身体有好处。 极端否定：吃保健品对你的身体有坏处。 逻辑否定：吃保健品对你的身体没有好处。没有好处，不一定就有坏处。也可能保健品对身体没什么影响，吃不吃都无所谓。


    命题：小王是男的。 极端否定：小王是女的。 逻辑否定：小王不是男的。不是男的，不一定就是女的。有一种说法认为有1.7%的人是双性人。


    命题：奥巴马是黑人。 极端否定：奥巴马是白人。 逻辑否定：奥巴马不是黑人。事实上奥巴马的爸爸是黑人、妈妈是白人，所以奥巴马是个混血儿。


    命题：所有女性都经历过性别歧视。 极端否定：根本就没有性别歧视、女性地位比男性高。 逻辑否定：有些女性没有经历过性别歧视。


    这个道理非常简单。你要否定黑，不一定非要说它就是白的，灰色足以否定黑。但灰色不太符合我们的思维习惯。


    不论是中文还是英文中的所谓“反义词”，其实都是不合逻辑的。黑的反义词是白吗？什么黑对白、上对下、左对右，你要写对联还行，但是从逻辑角度来讲，要否定黑，不一定是白，它可以是灰；要否定左，不一定是右，它可以是中间地带。


    但是人们实在太喜欢使用极端否定了，就好像逻辑否定还不过瘾似的。上级说这个官员是个好官要提拔他，你的逻辑否定应该是他不是一个好官，不应该提拔，他可能是个腐官。但老百姓不愿意这么看问题，老百姓更愿意看到他不但不是个好官，而且还是个坏官，他不但不应该升职，而且还应该下台。


    这可能是因为我们在感情上觉得不出手则已，一旦出手就应该往死里打击，什么“狡兔必须过正”——殊不知你这个出手如果不合逻辑，它就是脆弱的，它就会遭到合法的反击。


    最近发生的一个热点是成都七中的变质食品问题。真相究竟如何我也不知道，所以我们干脆假设一个场景。某个学校的一些食品确实是过期了，但是家长们觉得这还不够说明问题，所以就人为制造了一些过期食品的照片发到网上，希望引起更大规模的舆论关注。这个做法对吗？这个做法是脆弱的。我看评论里有人引用了音乐家侯德健的一句话，放在这里特别合适：“我们是不是需要用谎言去打击那些说谎的敌人？难道事实还不够有力吗？”


    我们为什么需要用极端否定呢？难道逻辑否定还不够有力吗？


    ### 3.应该指责谁？


    另一个常犯的错误是出事之后应该指责谁。小明这次考试没过，家长指责小明不好好学习，小明说这是因为老师不负责任不好好教课。家长又说，那为什么别的同学能考好呢？如果你努力学习，就算是老师不好，你也应该能考好！


    这个事儿，其实是一个“与（and）”逻辑。两个因素，A，小明没有努力，B，老师没有好好教，同时导致了C，小明考试没过。这是 A and B ⇒ C 为了让
    C 不发生，我们需要“非(A and B)”，而从逻辑上来说，非(A and B) = 非(A) or 非(B)


    比如我说“小张是个青年女性”，这句话是说“小张是个青年” and “小张是个女性”。要否定这一点，就是小张或者不是青年，或者不是女性，或者既不是青年也不是女性[1]。


    这个道理是如果一件事情是几个原因综合促成的话，那么只要其中任何一个原因不成立，这件事情就可以不发生。也就可以说，从逻辑上讲，你可以指责任何一方。


    但是如果你一上来就专门指责某一方，那就恰恰是不合逻辑的。因为各方都可能出问题。

    '
  mdcn: '

    们服不服吧…… — 你这么想当然可以，但问题是你想从这次公关中得到什么呢？你想得到的是公司在国外的核心利益不受侵害，是对方的市场，是对方的认可，哪怕对方的同情都行。


    正确的应对是考虑对方怎么想。管用的公关必须站在对方视角说话，先同步，才能领导。


