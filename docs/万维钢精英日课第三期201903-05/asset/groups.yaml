    ## 美国能在五年内重返月球吗？


    万维钢·精英日课³

    今天


    进入课程 ›


    美国能在五年内重返月球…


    3月26日，美国副总统彭斯到NASA（国家宇航局）做了一个演讲，明确提出，要求在五年之内把宇航员再次送上月球。这是一个十分惊人的消息，我想帮你做一点快速的分析。


    ### 1.历史


    咱们先说说背景。送宇航员登陆月球，是人类文明的伟大壮举 —— 但也是国际政治竞争的产物，是形象工程。


    1961年4月，苏联第一个把宇航员送入了外太空，给美国带来了极大的震动。1961年5月，肯尼迪就宣布了阿波罗计划，要求在1970年之前把美国人送上月球并且安全返回。登月项目从一开始就等于是关乎社会制度优越性的较量。


    美国赢得了这场较量。1969年7月，也就是肯尼迪讲话八年之后，阿波罗11号成功把美国宇航员送上了月球。而苏联，因为火箭技术始终不过关，从未完成载人登月。美国通过登月项目带动了相关行业的科技进步，培养了一大批人才，得到一系列科学发现，更重要的是在冷战的关键时刻收获了制度自信。但是，除此之外，月球本身，并没有给美国带来什么资源开发上的好处。


    这就是为什么1972年12月，阿波罗17号登陆月球 —— 也是美国第六次登陆月球 —— 之后，人类就再也没有载人登月。月球上并没有什么对现阶段的人类特别有用的东西。做到，证明你能，很重要；再做，就不重要了。


    所以载人登月是个形象工程。当然形象工程不等于不该做，有时候形象工程是意义最大的工程。以我之见，好的形象工程必须满足两个条件：第一，难度极高。有难度，才能证明你的实力，你在做这件事的同时才能提高自己。第二，得让老百姓能看懂，得引人注目。


    比如中国举办2008年北京奥运会就可以说是一个形象工程 —— 奥运会本身带来的收入远远比不上为了办奥运投入的直接和间接花费，但是奥运会让我们感觉很好。我记得那几天我甚至有一个感觉，我希望北京奥运会永远都不结束。举办奥运是中国进步的标志性事件。而且我认为中国现在需要搞载人登月。载人登月项目将是中国成为世界领袖路上的标志性事件。


    NASA 非常理解形象工程。真正有用、有巨大经济价值的航天技术，比如卫星、遥感这些，都是根本不需要载人的 —— 但是NASA仍然搞了很多像空间站、航天飞机这样的载人项目，这些项目并没有带来什么非载人不可的科学发现和经济效益，但是老百姓爱看载人航天。NASA非常善于搞形象公关。


    但是，过去这几十年来，NASA也有所转向，仅有的几架航天飞机退役之后就不再搞载人航天了，转为深空探测。NASA把探测器发射到黄星系这种太阳系的边远角落，让探测器在火星表面着陆，这些活动因为不载人、重量轻体积小可靠性强，非常省钱，不用拿宇航员的生命冒险，而且所有该做的探测都能做。NASA取得了一系列重大科学发现，大幅度提升了人类对太阳系的认识，科学家应该挺满意……但是，老百姓没有那么强的自豪感。


    这可能就是为什么，特朗普政府现在要求尽快重返月球。


    ### 2.计划


    其实就算不是这次特朗普政府说，美国也原本就有重返月球的计划。早在小布什时代就有这样的计划，后来因为项目超支被奥巴马砍掉，但是相关的研究一直都在进行。


    现在NASA的雄心不是重复载人登月，而是登陆火星。重返月球，只是这个大计划中的一步。具体来说，NASA当前 的计划有三个大部门 ——


    第一，是一个新型的超大型运载火箭，叫 “太空发射系统（Space Launch System, SLS）”。设计负载量70吨到130吨，既能载人又能载货，目标是能把飞船送到火星。


    第二，是 “猎户座飞船（Orion）”。这种飞船是回归传统的宇宙飞船思路，但是内部空间比阿波罗飞船大2.5倍，最多可容纳6名宇航员，而且可以回收利用，专为深空旅行设计，目标也是至少能去火星。


    第三，是一个围绕月球运动的空间站，“深空门户（Gateway）”。这个空间站将会搞成模块化，上面可以储备物资，可以让宇航员驻留。


    也就是说，大目标是登陆火星，而月球可以作为一个中继站。如果你认为火星是一个值得的目标，那登月的确有一个经济上的好处。月球南极被发现有水 —— 不是液态水，是存在于火山坑阴影区里的冰。这些水可以用来制作火箭的氢燃料。有人测算，在月球做这个燃料的成本是每公斤500美元
    —— 但是要从地球上做好了带来，则要每公斤4000美元。所以理想的做法是在月球制备燃料，给去火星的火箭来一次加油。


    就登月项目而言，这个做法是使用 SLS 运载火箭发射猎户座飞船，把人和物送到深空门户月球空间站，这件事儿可以定期、多次进行。然后以深空门户空间站为基地，随时派人往返月球表面，或者再出发去火星。


    那你可能注意到了，NASA的计划里不包括从深空门户空间站前往月球表面这一段，那这段怎么办呢？这正是新时期美国太空项目的一个新特色，那就是把项目外包给私人商业公司。NASA将会通过招标的形式，让商业公司开发载人月球登陆器。


    事实上，前面几个大部门，也不是NASA独揽自己干，也是跟商业公司合作。例如 SLS 火箭是NASA跟波音公司共同开发的，猎户座飞船则主要由洛克希德·马丁公司设计制造。当然波音和洛克希德·马丁一直在做美国政府的项目，有点像准国企。


    现在情况是美国出现了很多家私人的、比较小规模的太空探索公司，比如像马斯克的 Space X，贝佐斯的 Blue Origin 等等，还有一些是更小的创业公司，背后还有各路风险投资支持，跟互联网公司一样。这些商业公司可以用比NASA更低的成本提供火箭发射业务，也有雄心壮志要自己探测火星。


    那特朗普五年重返月球的要求能实现吗？非常难。


    ### 3.可行性


    NASA的计划很不错，但是实质性进展很一般。SLS 火箭本来2017年就要来一次测试发射，但是至今没实现，之前的目标是2021年首次发射。这次彭斯讲话了，波音表示要加速进度，NASA
    勉强提出争取在2020年发射。


    猎户座飞船，原本计划2023年才搞第一次载人测试，真正去月球本要等到2028年。


    深空门户绕月空间站，原计划2022开始搭建，现在看起来到2024年只能是不完整地投入使用。


    至于说从空间站到月球表面登陆这一段，现在还不知道请哪个公司、怎么搞。


    美国的现况是以前的航天飞机都退役了，现在想送宇航员去国际空间站，都得买俄罗斯宇航飞船的票。美国现在没有正在运行的载人航天系统。


    不过彭斯的逻辑也对。当初肯尼迪宣布阿波罗计划的时候，美国可是连把人送到外太空轨道都做不到，可是仅仅八年之后就登陆月球了。那现在技术进步这么多，前期也有了这些积累，五年怎么就不能行呢？所以彭斯要求NASA
    “转变思维（a new mindset）”，要用一个大胆的目标鞭策自己。


    那为啥非得是五年呢？当然是因为特朗普理论上可以还有五年总统任期。事实上2017年底的时候，特朗普就命令NASA着手弄一个快速重返月球的计划，NASA没敢明确下保证书，最初才给了一个2028年的目标
    —— 结果现在特朗普要求提前到2024年。


    可是说说归说，彭斯讲话这里可没提钱。特朗普可是刚刚把NASA的经费削减了一点点，那现在项目加速，钱从哪里来？将来还必须得等国会批准这笔预算才行。


    所以现在的基本情况是 ——


    美国有个雄心勃勃的新登月计划。

    登月只是作为未来登陆火星计划的一部分。

    重返月球的做法将会更灵活，由私人公司承担相当关键的任务。彭斯甚至提出，如果NASA和波音搞的 SLS 火箭不能按时交付，也可以看看私人公司有没有能提供这个服务的。

    短期实现困难重重。

    而这个任务时间段，仍然有很强的形象工程意味。

