    # 问答：“贫穷的美德”还适合今天吗？


    万维钢·精英日报³


    今天


    进入深链 >


    # 来自日课：你来自传承（上）


    # 读者提问：


    所谓穷人模式、富人模式，就基因对生物生存的意义来看应该没有好坏之分，都是生物适应环境的选项，开启哪一种都是为更好地繁衍、生存，是这样吗？这个时代开启穷人模式，一定是不好的吗？


    万维钢


    演化给生物的设定，在不同环境下开启不同的行为模式，确实是为了更好地适应各种环境。从这个意义上来説，一个行为模式的确不存在绝对的好坏，应该相对环境而言。


    今天我们一説起都认为适应贫困的行为模式是不太好的，但是别忘了，就在不久之前，人們还在赞美贫穷的各种美德！比如“穷人的孩子早当家”、“男孩要穷养”之类。


    # 一个是不能推迟享乐。如若著名的“棉花糖实验”，发现无法拒绝棉花糖的诱惑、不能等到实验人员回来就把眼前的棉花糖吃掉的孩子，长大以后的成就显著不如那些能经得起这些诱惑的孩子。但是现在进一步的研究发现，那些孩子之所以不能等待，是因为他们来自贫困家庭。他们的生活不稳定，眼前有糖不吃，可能转眼就被兄弟姐妹抢走了。他们已经养成了这样的习惯。如果环境险恶，这么做其实是对的，这个行为模式是对环境的适应。我不是种族歧视，但是我感觉这个现象在美国黑人身上体现的比较明显。


    # 一个是过于注重小利益。中国作为传统农业社会价值，包括美国也有所谓新教伦理，都是比较注重节俭的，对那种有点钱马上就花掉的行为非常鄙视。匮乏时代的人，很善于精打细算，这可能是“穷人的孩子早当家”的来源。但是正如《稀缺》这本书所说，这里有个管窥效应，只看眼前这点小利益会限制我们的思想。可是如果生活就是很艰难，不精打细算行吗？如果家里很穷，自己放弃上大学的机会，早点挣钱养家分担负担，这难道不是美德吗？


    # 还有一个特点是争斗意识更强。这体现现在性情不是很随和，比较敏感，容易跟人发生冲突。但是从另一方面来说，你也可以说这是更强烈的竞争意愿，是“男孩要穷养”的理论依据。老一辈的中国人都是从艰苦时代过来的，喜欢说“奋斗”，锵击毕露，你能说这是缺点吗？


    # 来自日课：你来自传承（下）


    # 读者连接：


    # 来自日课：借助群体，演化自己


    # 读者金丝铁马：


    # 读者头发未梳的遗憾：'
  - '[PAGE 109]


    也说，像名牌汽车这样的奢侈品，销量反而增加了，这说明我们仍然非常在意社会对自己的看法。


    事实上，我们以前讲《规模》这本书的时候有一期叫《城市快节奏的数学》，其中就有研究显示，越是城市化，人与人之间的连接就越多 —— 人没有变成孤独的原子。只是因为很多连接不是发生在面对面，我们会有一种孤独感。


    这个孤独感的确是个问题。以前罗伯特·帕特南有本书叫《独自打保龄：美国社区的衰落与复兴》，就表达过这个担心。主要是联系人都不在身边，那么社区会有衰落的危险。不过我看美国的经验表明人们最终还是关心自己居住社区的，而且事实证明互联网反而增加了同城的聚会活动。


    # 读者 朱海涛：


    万老师，你在讲阿德勒学说的时候谈到，“比如说有一天吃完晚饭，你家小孩主动收拾了碗筷，你就表扬他，说做得好！真是个好孩子！我要给你奖励！—— 请问，这跟动物园驯兽师训练动物有什么区别？你这是一种居高临下的态度，你是通过表扬去操


    把孩子当工具。”，为什么在这里又说要夸奖孩子呢？


    ![](img/11c9b7c3721998fda4f24a8a7bc8cbba_109_0.png)


    万维钢


    阿德勒的标准是哲学家的标准，是一个高贵的品质。威尔逊这里说的演化思维给的育儿指南，是一般意义上的规律总结，对此我们应该有所区别。


    我认为《九个工作谎言》给的建议最实用。你不要直接评价这个行为“对”在哪，你应该表达你自己对这个行为的感受。“孩子你今天帮老师擦黑板了？我非常高兴！”


    威尔逊会说你这就是表扬，这跟驯兽师没有本质区别；而阿德勒也会满意。


