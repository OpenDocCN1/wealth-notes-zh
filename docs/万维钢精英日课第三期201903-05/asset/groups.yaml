    ## 来自日课：灰度认知，灰度决策，黑白执行


    读者 夏颖：


    通常的算法是“如果 A and B”的话，“那么……。”后面的赋值为 A 和 B 二者中的最小值。这个算法中给的赋值取二者中的最小值是出于什么逻辑呢？


    万维钢


    这个是我们时间有限当中没有详细展开。在“规则运算”这一步，模糊逻辑是把相关的规则则变量变成函数的赋值运算。咱们举个例子说明。

    在寻常的明确逻辑中，“如果 A and B，那么 C”，这句话的操作是必须 A 和 B 都为真，也就是 A = 1 并且 B = 1，C 才会为真，C=1。如果
    A、B 中有一个是 0，C 就是 0。

    这番操作我们把它推广一下，我们可以理解成 C 是 A 和 B 中的最小值。受这个启发，在模糊逻辑运算中，A、B、C 都是 [0,1] 之间的小数，我们就直接设定
    C 是 “and” 关系中最小值。类似地，如果 A 和 B 是 “或 (or)” 的关系，那么 C 取 A 和 B 的最大值。

    我理解这个赋值方法只是人为的设定。“模糊逻辑”整个这一套都是人为的，有很强烈的工程味道，我们没有充分


    有很强烈的工程味道，我们没有充分的理由说就应该这么设定，只是这么设定简单而且有效而已。


    ## 来自日课：你在马斯洛金字塔的下部，我在顶层


    读者 曹礼明：


