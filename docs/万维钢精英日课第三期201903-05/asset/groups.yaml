    ## 期权的智慧1：只是权利，不是义务


    万维钢·精英日课3

    今天


    进入课程 >


    期权的智慧1: 只是权利不...


    今天开始我们用一个小专题来讲讲 “期权” 的智慧。期权本是一个金融概念。目前咱们中国股市还不允许交易期权，但一直以来都有呼声，将来可能会开放，而美国和香港股市都有期权。


    不过我们讲期权，并不是研究怎么做期权的投资或者投机，我们是用期权思维研究做事的方法。期权思维并不仅仅属于金融市场，你在生活中也可以使用。期权思维的本质是掌握对风险的主动权。一般人谈风险都是说要防范风险，是被动的；而期权思维则是积极主动的，我们要利用风险。特别是，它能让你识别和抓住机遇。


    有句话叫 “机遇只偏爱有准备的头脑”，但据我观察，现实世界是有准备的头脑太多，而机遇太少。所以如果机遇光有思想准备不行，你得有动作才行。期权，就是我们锁定机遇的动作。


    这一讲我们先说期权的基本知识。


    ### 1.什么是期权？


    “期权” 这个词听起来很有专业味道，并不是日常用语。但是在英文中，它其实是一个特别简单的词，叫 “option”，直译就是 “可选项”。这个可选项的意思不是像做选择题那样给你四个选项让你必须得从中选出一个。Option，是说你可以选，也可以不选
    —— 它是你的权利，而不是义务。


    如果没有期权思维，你不一定能意识到 “可选项” 这个权利有多么宝贵。


    我给你举个例子。比如你有失眠的毛病，每天晚上躺下都担心睡不着，可是越担心就越睡不着。有一天，你得到了一种安眠药，这个药非常好使，任何情况下吃了就能睡着。你吃过几次，效果良好。


    这个安眠药，就是你的可选项。其实你并不是每天都吃它，有时候你不吃药就能睡得挺好。但是有这个药放在家里，你就 有一种踏实的感觉，你就完全不用担心失眠。可以用，但是不是一定用，这个权利，
    你说好不 好。这就相当于参加高考之前已经有一所很好的大学提前录取你，给你保 底了，那你还用担心考试发挥失常吗？


    权利常常都伴随着义务。比如你生在古代大户人家，家里已经给你定下了一门亲事，对方条件不错 —— 这桩亲事虽然是你的一项权利，但同时也是义务。协议已经签了，你悔婚就会受到社会的谴责，这就
    不叫可选项。而今天的一个女神，如果身 边有个备胎随时愿意跟她结婚，但是女神也可以选择别人，这才叫可选项。


    那你可能说生活中哪有那么好的事儿呢？只讲权利不讲义务？有的……只不过有时得花钱买。最常见的，就是股票期权。


    下面这个就是 5 月 24 日这天，苹果公司的一个股票期权 ——


    AAPL Aug 2019 180.000 call

    OPR - OPR Delayed Price. Currency in USD


    9.95 -1.15 (-10.36%)

    As of 3:59PM EDT. Market open.


    这是一个 “call”，也就是 “看涨期权”。它的意思是允许你在 2019 年 8 月 16 日这一天，以每股 180 美元的价格，买入苹果的股票。


    这就是一项权利，而不是义务。如果 8 月 16 日那天苹果的股价高于 180 美元，哪怕它涨到了 500 美元一股，你也有权利以 180 美元的价格买入 ——
    多出来的差价都是你赚的。反过来说如果到时候股价不到 180 美元，那你什么都不用做。


    当然，这个权利不是白给你的。5 月 24 日这天，这个 call 的价格是 9.95 美元 —— 你花这个钱，去换取那个权利。比如说，如果到时候的股价是 200
    美元一股，你这个 call 就会值 20 美元，你实际上净赚了差不多 10 美元。


    还有一种期权叫 “put”，中文叫 “看跌期权”，意思是到时候你有权以固定的价格*卖出*一只股票。我觉得英文的说法更形象，call 是说你有权把它拿过来，put
    是你有权把它放过去。


    现在很多上市公司会把期权作为给员工、特别是给管理层的一个激励。比如你们公司现在的股价是 90 美元。董事会决定，给你一个期权，允许你在两年以后以 100 美元的价格买入公司的
    10 万股股票。如果到时候的股价是 110 美元，你这个期权就会值 100 万美元！而如果那时候股价不到 100 美元，你这个期权就没有任何用了。


    对你来说这是一个很好的激励，你会全力以赴把股价干上去。对董事会来说，这是一个廉价的许诺：股价真上去了，董事们也跟着赚钱；股价要没上去，董事们在你身上啥钱也没花。


    所以期权真是好东西啊。还有更刺激的玩法。


    ### 2.期权投机


    期权可以用来投机。


    AAPL Aug 2019 185.000 call

    OPR - OPR Delayed Price. Currency in USD

    7.55 -0.84 (-10.01%)

    As of 3:59PM EDT. Market open.


    ### 3.期权是一种保险


    对投资者 —— 而不是投机者 —— 来说，期权其实就是一个保险。


    以一边持有一只股票一边卖call，也可以一边卖空一只股票一边买call，这使得你在冒险的同时能把损失控制在一个限度，在观望的同时提前锁定一笔盈利。


    所以对手里拿着很多股票的人来说，期权是一个保险。大户操作保险，这件事非常符合逻辑。而反过来説，如果你手里的资金太少，不持有股票而去裸买期权，你就等于以一个小户的身份去给大户提供保险，这不荒唐吗？


    人家说，啊，我有保险，所以我不在乎股价波动 —— 而你呢？你就是那个波动。这不可悲吗？


    很正常吧？


    如果你有期权思维，就应该马上意识到，你这相当于是用抵押金买了一个 call。如果一年以后房子升值，你有权以当初的低价买入这个房子；而如果房价跌了，你大可违约，无非就是损失了那一点抵押金而已！这不就是
    call 期权吗？


    考虑到这一点，你正确的操作是多签几份合约！等房屋升值，你可以把这些合约转卖出去。我不知道在中国允不允许这么干，但是在美国，我听说有人是这么干的。


    因为买房的手续麻烦，这个期权很可能是个不充分的市场，签约抵押金很可能没有反映期权的真实价值。所以遇到这样的事情，你应该果断签。


    怎样发现这样的机会呢？关键在于如何合理评估一个可选性的价值。咱們下一讲再説。


