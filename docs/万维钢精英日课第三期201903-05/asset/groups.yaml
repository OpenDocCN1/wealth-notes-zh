    问答：弱者报复，强者原谅，智者忽略..


    ## 来自日课：骄 争论的根源


    读者 子听，我的头像很T啊：


    万老师，您说的那个领导在老王旁边抨击别人的故事，老王推测是自己的原因。然后您的意思应该是他的逻辑敏感度低，可现实生活中用蛛丝马迹推测的例子很多啊，尤其在中国官场，领导的话是很值得揣摩的。那么揣测是不是在这种情况下很吃香？


    万维钢


    我们假设有个刚从大学毕业到单位上班的小李。小李面对这样的情况，肯定不会多想，他从纯逻辑判断，领导当着他的面抨击别人，绝不等于是指批评他。他这个逻辑完全没毛病，而事实上也对——因为领导也知道小李头脑简单，你这里有万种风情他也看不懂，有话还不如直接跟他说。


    老王工作多年，他知道领导有时说A，心里想的就是B，所以老王考虑到了领导其实是在批评自己的可能性。当一个人说自己“怕丿”的时候，的确也有可能是在暗中讽刺周围有人太胖了——可问题是谁会这么做？她这么做
    with 隐意乂呢？


    - 1. 自己在单位的地位是否稳固；

    - 2. 最近领导跟自己有没有什么矛盾；

    - 3. 领导批评那个人事儿，到底是不是真的是一个值得这么批评的事儿。


    老王应该把敏感度放在这些事儿上，而不是用非逻辑的方式端摩别人的话。如果我妻子说她胖，我知道她肯定不是为了讽刺我。如果我妈妈说我胖了，我知道她绝无恶意。如果我女儿说我肚子大，我知道她的意思是这挺好玩。解决逻辑争议的最好办法是往“上”走，考察更大的方面。语言是不精确的，但是只要我们把大的逻辑关系搞清楚，我们可以理解语言。


    读者 Mia：


    万老师，请教您如果证据确凿的情况下，比如孩子听到了具体的內容，就是在嘲笑他，大人让孩子不骂回去，那不就是教孩子忍气吞声了吗？孩子有委屈不抒发出来，会不会憋坏呢？


    万维钢


    如果是动手了，那是校园霸凌，咱们必须反击，而且我认为应该强势反击。

