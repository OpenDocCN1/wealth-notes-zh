    最后，我们要简单总结一下。这一模块，我们讨论了五个问题：自由的角度、政府干涉及、福利国家、公民社会以及移民问题。这些涉及到人类政治社会中的大多数。


    从分梳与冲突的角度看，人类不会进入一种永久的和谐状态。政治本身的一个功能，就是要处理好人与人之间的分梳与紧张。很多时候，分梳甚至无法回避。应该政治的解决方案，可能还能缓解政治化的力量。


