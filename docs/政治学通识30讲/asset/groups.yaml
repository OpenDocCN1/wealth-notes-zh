    你先走

    “人类天生就是政治动物”——亚里士多德《政治学》开篇。


    人为什么是政治动物？借助山《政治秩序的起源》的观点：

    第一，人类一开始就是过集体生活的。有集体就有政治。


    第二，人类喜欢制定规则。规则是为了减少人与人集体行动。当这些在更大范围内采取集体行动，这些规则就是政治的约束。


    第三，政治可以约束人类的暴力潜能。史芬芬平克在《人性中的善良天使》中讲到，约束我们暴力倾向的第一种力量就是纪律。


    第四，人追求的不仅仅是物质，还有认可。人类政治活动主要就是为了寻求认可。


