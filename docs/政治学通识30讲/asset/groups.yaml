    # 课后思考


    在这里，我还要留给你一道思考题：除了拉丁美洲国家，你还知道有哪些国家在民主化过程中同样深受贫富分化的困扰吗？欢迎你在留言区分享你的观点。


    我们这一讲是课程第五模块的最后一讲。我们这一模块中，先后讨论了五个问题，它们分别是：**发展中国家的共同体危机、“蒙博托陷阱”、威权主义的经济奇迹、民主转型的难题以及政治分歧如何影响民主**等，由此为你理解发展中国家政治提供了一个基本框架。尽管只有短短五讲，但我希望，借助这五次课程的理论与方法，你以后观察发展中国家的政治事件时，能拥有专业训练的视角。从下一讲开始，我们将进入课程的总结部分。


