    叶旭辉

    为了正确理解政治，我们必须修正一个特别的假设：我们必须停止认为领袖们能够独自领导。


    以民主方式产生的权力同样需要受到约束：权力本身没有欲望，但是人有。


    天赋人权说的现代起源可以追溯到14-16世纪的文艺复兴和17-18世纪的启蒙运动，当笛卡尔提出“我思故我在”命题的时候，人类对自我价值的认同达到了前所未有有的高度。人是一个客观的存在，每一个存在物都有自身的价值，同时都有自己的权利，这种权利不是上帝赋予的，也不是国王赐予的，而是与生俱来的，换言之，它是一种基于人类本性的一种权利。这种与生俱来的权利，就是自然的权利。


    权利既然归根于人性，那么要获得天赋人权的内容就要回溯到人性。每个人的首要的任务就是保全自己的生命，他会利用一切可能的方法来保卫自己，因此他有生命权利；每个人都是意志自由的动物，他可用自己的判断和理性去做自己愿意做的事，因此他有自由权利；每个人都具有理性以区别动物，共同的理性意味着人与人之间的平等，因此他有平等的权利；每个人都可以占有自然资源，以此来维持生理的存在，因此他有财产权利；每个人都是自己的主人，他不受制于他人的干涉和驱使，因此他有自治的权利；理性有着自我完善的本能，因此每个人都有追求幸福的权利。如此这般，人类便有了生命、自由、财产、平等、自治和追求幸福的权利。


    另外一个方面，人也是脆弱的、胆怯的和无力的，他不能够仅靠他自己的力量征服这个世界，因此他需要人与人之间的联合，人与人的联合因为各自的自然权利又处于冲突状态，即当我主张我的权利的时候，你也有同样的权利。人要求权利，于是人与人之间就产生了竞争；人要求安全，于是人与人之间就产生了猜忌；人要求名誉，于是人与人之间就产生了觊觎。生活在竞争、猜忌和觊视的环境下，人又有什么幸福而言呢？


    于是进化出了社会契约的精巧制度：放弃人性中的某些权利，换得一个公共权力来保障自己最低限度的法律上的权利。这就是政治权力和法律权利的起源。拿洛克的比喻来说，那就是：在受猛狮和狐狸骚扰与被狮子吞噬之间，我们宁愿选择前者。


    政治的权力和法律的约束是对天赋权利的一种威胁，但是它们是不可缺少的制约。通过社会契约创立了国家和政府，制定了法律，这意味着，公共权力来源于人民的授权，这是人民意志的宣告。当政府和法律置人民利益于不顾的时候，人民有权废除旧的社会契约，创立新的保护人民天赋权利的政府和法律。


