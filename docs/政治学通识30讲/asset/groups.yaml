    分权会带来灵活性，解决“船大掉头难”的问题，所以现在也看得到越来越多的企业也开始进行转型，从过去的“中央集权”模式转为更灵活务实的“小团队模式”。\n但现代也没有极简模式，好比小米，将重要权授予中层，但把最终权力留给自己。这不是“放权”，而是“制衡”。从另一个角度，小米所处的发展阶段已经不一样了。\n\
