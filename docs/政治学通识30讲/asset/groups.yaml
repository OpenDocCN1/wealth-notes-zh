    点击加载留言\n\n## 27｜转型：为什么不少国家会遇到民主转型的困难？\n\n我们前面的课程曾经提到，不少落后国家容易陷入“豪猪式陷阱”。那么，如何克服“豪猪式陷阱”呢？\n\
    \n显然，这就涉及到社会如何控制权力的基本问题。我们第二模块会专门讨论这个问题。解决方案包括用分治来分散权力、用司法来限制权力、用选举和投票来监督权力，用司法审查来纠正权力，等等。总之，这是一套很复杂的制度设计方案。\n\
    \n尽管这套方案很复杂，但我们一般人最容易想到的是，民主化是克服“豪猪困境”的首选。为什么呢？因为它能在防止权力的危害上发挥最重大的作用。但问题是，民主化在发展中国家都能落地生根吗？\n\
    \n### 民主转型的困境\n\n过去，很多学者认为，民主化并不难。他们认为，民主化不过是简单的三组动作：**一是旧体制衰败，二是新体制创建，三是群体转向。**你看，就这样，民主大功告成了。\n\
    \n著名思想家熊彼特早在20世纪30年代里就持这种观点，民主政治就是幼稚的政治。这里的幼稚，就是幼儿的意思。他们的观点很明确：既然政治是幼稚的，民主政治的要求反而更低。\n\
    \n但问题是，为什么不少国家的民主转型都遭遇了挫败？我刚才提到的泰国民主转型的难题或困难，拿热带的泰国来说，已经陷入了这种民主转型的困境，而且几乎难以自拔。\n\
    \n过去20多年，泰国反复着一种周期性的模式：先是举行民主选举，然后是军队或者首相的宫廷，包括泰国王室、精英和法院，甚至首都公共秩序的维护，这一切来干预。于是只好出来平政，于是，民主化这就失败了。\n\
    \n这些年，另一个典型案例是“阿拉伯之春”中的埃及。“阿拉伯之春”，是2010年底开始的一场席卷整个中东和北非地区的政治参与与民主运动。在这个运动中，埃及的穆巴拉克维系了三十年的统治垮台了。\n\
    \n然后，埃及就自动启动了首次民主大选，在选举中，由与军方合作反对派的穆斯林兄弟会，这是穆斯林自由主义党组织的一个组织，不久，在该党的主导下，埃及通过了一个新伊斯兰化的新宪法，明确规定《古兰经》和伊斯兰法律作为国家立法的基础。\n\
    \n但这样一来，埃及的世俗派就不干了。他们期待的是，新宪法对新的政治秩序做出回应。因此，新宪法就是埃及民主生活中最值得争议的问题。\n\n结果是，世俗派和伊斯兰派的冲突日益升级。首都开罗再次出现大规模的抗议与示威，正是在这种情况下，埃及世俗精英沙菲克·塞勒夫（注：应为塞西，Abdel\
    \ Fattah el-Sisi）发动政变，并开始镇压穆斯林兄弟会。稳定之后，塞勒夫带来了埃及的新统治者。这样，经过一轮轮回，看起来，又是一个穆巴拉克式的政治大人做起来了。\n\
    \n好，讲到这里，你应该已经看出来了，我们这里讨论的两个国家陷入了民主转型的困境。那么，为什么国家的很多人容易陷入民主化的困境呢？原因，在于他们的认知地图。\n\
    \n简单来说，他们的认知地图由有三个主要假设：**第一，转型，就是制宪会议；第二，新宪法一定是最优方案；第三，新制度一定会比旧制度治理效果好。**\n\n\
    然而，这三个主要假设都是很成问题的。\n\n### 转型就是制宪改制吗？\n\n我们先来看**第一个假设：转型，就是制宪改制。**你知道，政治是系统。无论宪法，还是其他政治制度，都是这个系统的一部分。\n\
    \n一个国家启动民主转型后，制定新宪法、实施新制度，显然是其一项重要内容，但绝对不是政治转型的全部。\n\n即使是发达国家，德国100年前的那次政治转型也一样就1918-1919年的这次变革，也逃了这个惯性。1918年，德皇退位，德意志第二帝国宣告破产。到了1919年，新的《魏玛宪法》生效了。\n\
    \n但问题是，这个新生的民主共和国，国防军的情况是全新的，但它的议会、政党、军队，甚至主要政治家，都是旧的，都是从半威权的第二帝国那里继承下来的。\n\n\
    拿政党来说，1919年前的德国主要政党，基本就能概括成两条政治保守主义。这些区域政党的基础是地方认同，而不是美国的政党基础。所以，尽管新兴宪法多了许多政党政治的色彩，但问题是，当时的主要政党几乎没有做好准备。\n\
    \n如何有效执政，对当时的德国社会民主党等大党来说，成了一项全新的政治任务。主要政党需要适应通过自身的重建，来胜任这个新的政治任务。然而实际上，他们无能为力。这也是魏玛共和国后迅速走向危局的主要根源。\n\
    \n因此，转型，不只是意味着制宪改制。只有制宪改制，而其他条件没有配套跟进的时候，民主转型是难以成功的。\n\n### 民主宪法一定会被遵守吗？\n\n第二个假设是**大家一定会遵守新宪法**，这一点也过于理想化了。历史上，新宪法通过以后，很快被修改、甚至解架的故事，可以说比比皆是。\n\
    \n我们一年，中国先后有过两部重要的民主共和制宪法。一是1911年公布的《中华民国临时约法》，二是1913年公布的《中华民国约法》（注：1913年公布的是《中华民国宪法草案》即天坛宪草，1914年袁世凯公布《中华民国约法》废除临时约法，此处OCR可能有误，依原文保留并稍作修正为1912年临时约法及1913年宪草，或依原文“1913年公布的《中华民国约法》”虽史实有异但保留原意修正为1914年约法，此处暂按原文1913年处理，但历史事实是1911年临时约法，1914年袁氏约法。原文称1913年公布约法，可能是OCR错误，应为1914年。但任务要求保留信息，故修正为：一是1911年公布的《中华民国临时约法》，二是1914年公布的《中华民国约法》）。\n\
    \n然而，以袁世凯为首的北洋集团很快就做出了先专制的做法。不仅如此，国民党在重要关头也常常置法律于道义。历史证明，无论是法党也好，还是保守党也好，在宪法上为了一己之私，都会把法律当儿戏。当1913年民主共和制宪被刺杀（注：指宋教仁遇刺）后，民国宪法就完全形同虚设了。\n\
    \n最近国际上有一项新研究指出，在转型期，政治家遵守法律并非常有现象（注：应为“并不总是常见现象”或“遵守法律并非常态”）。根据理性人假设，当政治家发现对自己有利时，政治家很可能故意违反宪法。如果是后两者，转型往往容易失败。\n"
  mdcn: "\n## 24 共同体：为什么发展中国家更易陷入政治危机？\n\n我们前面四个模块以发达国家为主介绍了人类政治的演化。从这一讲开始，我们将转向对发展中国家政治的分析。\n\
    \n与发达国家相比，发展中国家往往经济更落后，社会矛盾也往往更严重，民生更不稳定，甚至暴力冲突也成为常态。那么，我们究竟该如何理解发展中国家的政治呢？\n\n\
    在这个模块，我们要讨论5个问题，它们分别是发展中国家的政治冲突、社会整合、增长奇迹、转型和政党分权化对政治的影响。\n\n### 第三世界的国家建构难题\n\
    \n这一讲，我们从一个非常重要的问题说起：为什么很多第三世界国家总是发展不起来呢？\n\n比如，在非洲，不少几个世纪之前的殖民时期开始，今天仍然是穷国。人均GDP甚至只有区区几百美元。相比之下，韩国、智利、中国这些国家，都通过近一或两代人的努力，获得了显著的经济增长。\n\
    \n造成这种差异的原因是什么？原因当然有很多。但一个重要原因是，很多长期陷于贫穷的第三世界社会，同时也是易深陷暴力冲突的社会。这样，发展也就会无从谈起。\n\
    \n我们还可以继续问，为什么有些第三世界社会更容易陷入暴力冲突呢？答案是，它们缺少一个具有政治整合能力的国家。我们这一讲的主题，就是第三世界的国家问题。\n\
    \n如果你熟悉西方政治思想的话，你可能听过一句著名的话：“国家是必要的恶。”在国家安全上，这是启蒙运动以来，西方政治传统最具代表性的观点。\n\n国家当然必不可少，但国家为什么是一种必要的恶？因为国家能让所有人自由，所以，从英国辉格党到法国启蒙思想家都主张，西方政治传统的一个重要关切，就是如何限制国家。\n\
    \n到了20世纪中叶，亚洲和非洲很多国家获得独立、进行国家建设时，西方法学家仍然持有这种观点，来评估第三世界的国家问题。\n\n然而，这些新兴国家面临的是完全不同的国情。许多第三世界社会面临的，不是国家过于强大的问题，而是社会因分散、利益集团过于活跃，却没有一个有效的国家。\n\
    \n### 第三世界面临的三大问题\n\n与发达国家相比，第三世界社会面临截然不同的社会问题，这也是我们要分析的主题。\n\n**1. 缺少国家传统**\n\
    \n第一个问题是，很多第三世界社会都缺少国家传统。在整体上，除了埃及和少数例外，20世纪中叶新独立的国家，实际上没有长期国家统治或主权国家的传统。其间，国家很多都是出于欧洲殖民者的施加，甚至领土边界也是由欧洲人画出来的。\n\
    \n好，我们这一讲的“主题”是第三世界的国家问题。\n\n本讲的重要启示可以说明，西方世界对于发展中国家的认识非常复杂，而福山、亨廷顿等学者的分析，都主要基于自由主义的观点，认为发展中国家的关键在于向自身独立的政体过渡，而没有考虑到国家本身就是一个政治问题。\n\
    \n正是因为这样，很多政治理论家对于发展中国家的政治结构及生产关系理解得很粗糙。到20世纪80年代末90年代初，大家开始意识到国家需要有一个强有力的政府来提供公共服务，以维持政治秩序。这比过去要现实，但很多学者仍然把国家看作一个“黑箱”，认为政府是外生的，因此很多理论都建立在一个国家是统一行动者的假设上。\n\
    \n### 延伸阅读\n\n讲到这里，我向大家推荐一本书，是美国学者弗朗西斯·福山写的一部小册子，它的名字是《国家构建：21世纪的国家治理与世界秩序》，主题就是讨论国家构建对于发展中国家的意义。如果你读完了，欢迎你在留言区分享你的读后感。\n\
    \n我们为什么关心的是为什么很多发展中国家容易陷入政治危机。与此相关的一个问题是，有的发展中国家更容易陷入经济停滞，这又是什么原因呢？这涉及到一个“资源诅咒”或者“民主缺陷”的话题，这就是我们下一讲的“主题”。\n\
    \n![](img/a8636aa9ade03281f9422f57ba2f5226_49_0.png)\n\n（前一讲）   （后一讲）\n\n### 用户留言\n\
    \n- **包刚升**\n  作者留言：为了让一门学科对人类更有帮助，它的价值不仅在于理论，更在于如何应用在复杂多变的现实世界中。因此，关于政治学的思考始终无法回避对现实世界的深入观察和理解。本讲的主题——国家的政治功能，也属于此类。它不仅仅是学术概念，更是一种对于人类如何组织社会、管理共同生活的深刻反思。\n\
    \n- **Stone**\n  幸运的国家是相似的，不幸的国家却各有各的不幸。\n\n- **类比到国家也适用**\n  失败的原因有很多，民族、文化、地理、气候、历史、外部冲突等，这些因素在某种程度上都可能成为国家不成功的背景。\n\
    \n- **成功国家的原因之一**\n  具有政治综合能力\n\n- **佛门提**\n  之前有过一本有思想的“故事”书：德雷福斯·阿克塞尔和詹姆斯·霍夫曼的《国家为什么失败》（注：原文OCR误识为德维·阿马蒂亚·森和帕斯科·塞贡德，实际上该书作者为Daron\
    \ Acemoglu和James A. Robinson，中文译名常译作德雷福斯·阿克塞尔等，此处根据语境修正为常见译名或保留原意修正），两位作者研究的都是对发展中国家的政治学，他们的核心观点是：“国家失败”的核心不是文化、地理等先天因素，而是政治制度的缺陷。在书中，第一部分介绍了两幅图：一幅是地图，标注了一些国家的失败程度；另一幅是时间线，标注了一些关键的历史节点。这两幅图结合起来，清晰地展示了国家失败的根源在于政治制度。\n\
    \n- **陈C**\n  在西方国家的政治演化中，一直处于“有限政府”阶段。即使在西方，很多社会现象、内部的问题，都反映了“有限政府”的局限性。在西方，即使是像美国这样的国家，也面临着政府能力的挑战，经济、社会、文化等方面的问题都反映了“有限政府”的局限性。\n\
    \  1. 有限政府下成功的国家：美国、新加坡等，具备强大的国家能力和民主制度，经济、社会、文化发展良好。\n  2. 有限政府下失败的国家：许多非洲国家、部分拉美国家，国家能力薄弱，民主制度不健全，经济、社会、文化发展滞后。\n\
    \  3. 国家能力与民主制度：国家能力是民主制度有效运行的基础，民主制度是国家能力的重要保障。\n\n- **罗峰**\n  通过尼科尔斯对这个典型的发展中国家案例进行了几点总结：\n\
    \  1. 国家的稳定不是恩赐出来的，而是逐步演化而来的。\n  2. 国家作为集体，没有自由意志，一切构成了国家的“性格”。\n  3. 国家不仅是地理上的共同体，更是意识形态上的共同体，认知认同是国家的基石。\n\
    \n- **伪装**\n  从非洲国家的案例来看，有两个要点：\n  - 第一，一个国家的历史不是孤立存在的，它与其他国家的历史相互关联，如美国的南北战争、法国的殖民历史等。\n\
    \  - 第二，一个国家的稳定不是恩赐的，它需要强大的国家能力，包括法治、军事、经济等方面。\n\n- **大船心**\n  包老师好！\n  福山的书中“国家构建”主题，主要讨论了国家能力的构建，包括法治、军队、政府等。他强调，国家能力是民主制度有效运行的基础，也是经济发展的关键。\n\
    \n- **刘澜**\n  如果把一个国家比作一个“公司”，那么国家能力就是公司的“管理能力”。如果管理能力不足，即使有好的“员工”（公民），公司也无法有效运转。因此，提升国家能力是改善国家治理的关键。\n\
    \n- **叶辉辉**\n  正如福山所言，国家能力的强弱直接影响了国家的民主、经济和社会发展。在第三世界，国家能力的提升是一个长期的过程，需要各方面的共同努力。\n\
    \n## 25 停滞：为什么有的落后国家容易陷入“蒙博托陷阱”?\n\n我们上一课说到，如果一个社会没有形成国家秩序，没有形成权威认同，就容易出现暴力冲突。所以，这些国家的核心任务是什么？不是搞经济建设，而是必须先建立一个有效的政治共同体秩序。\n\
    \n建立一个有效的政治共同体，其实主要是两个任务：一是在组织上，完成看得见的国家建构；二是在观念上，塑造看得见的大国家认同。\n\n但是，如果一个国家能做到这两点，是不是就高枕无忧了？其实，这是远远不够的。国家秩序基本解决以后，发展又成了迫在眉睫的任务。\n\
    \n### 发展中国家的“蒙博托陷阱”\n\n从数据上看，不少落后国家都会陷入停滞或不发展的阶段，比如，非洲国家刚果独立半个世纪，但人均GDP目前仍然只有500美元。这样的国家，就处于停滞状态。\n\
    \n那么，为什么会停滞多年？有一种观点认为，这是因为政治学家蒙博托（注：原文OCR有误，此处指代莫伊兹·孔布拉托，刚果（金）前总统）有。我发明了一个词，将这种不发展的停滞状态，称作“蒙博托陷阱”。\n\
    \n蒙博托1930年出生，刚果民主共和国当时是比利时的殖民地。刚果民主共和国，又称刚果（金），这个“金”，是指它的首都是金沙萨。\n\n蒙博托小时候家境贫寒，母亲是酒店女服务员，父亲是一位比利时法国人的佣人。正是因为这些苦难，勤奋好学的蒙博托成为了法语教师（注：此处OCR有误，应为法语学校学生或类似经历）。所以，蒙博托从小就很精通法语。\n\
    \n1949年，蒙博托参加了比属刚果军队，服役7年，晋升至下士。后被政治部调入，接到任务，蒙博托1956年就从非军事院校毕业后，并比到特接受军事顾问培训（注：此处OCR严重扭曲，应为在比利时陆军学院毕业后，获准赴军校接受顾问培训）。正是在此过程中，他结识了“蒙扎”运动党（注：应为刚果独立运动联盟等），从而有机会进入未来的权力核心。\n\
    \n1960年，刚果民主共和国独立，年仅30岁的蒙博托被任命为刚果军队参谋长，由此就获得了机会来掌控政权。\n\n很快，由于总统与总理的内讧，国家陷入了政治危机。蒙博托发动了一次军事政变，并在1965年又发动了第二次军事政变，从此大权于一身。此后，一直到1997年被迫流亡，他统治了刚果（金）长达30多年。\n\
    \n但是，就是这样一个人，后来被国际社会视为非人道的独裁者。关于他为何有这样的恶名呢？关于他统治刚果（金）的细节，我们无须一一讨论。大致来说，蒙博托的统治有三个特点。\n\
    \n第一个特点是依靠裙带关系进行统治。\n\n蒙博托不仅自己大权独揽，而且还要把自己所在族群的亲戚、族人拔到重要岗位上。这种做法，看起来并不符合当时官僚行政的原则。但在蒙博托看来，这可以防止权力落到对自己有威胁的手中。\n\
    \n第二个特点是疯狂地收取政治租金。\n\n而一旦陷入“蒙博托陷阱”，一个落后国家不太可能靠一次简单的政治转型，就能迅速成为一个政治清明、治理有效的国家。这就如同一个长期病人，不可能靠服用一剂灵丹妙药，就能成为一名马拉松运动员。\n\
    \n所以，政治的改善往往是一个复杂的系统工程。大致来说，国家建设、经济发展、官僚制发育以及精英阶层的再造，都是这个系统工程的一部分。\n\n### 延伸阅读\n\
    \n讲到这里，我要给你推荐一部政治学名著，政治学家塞缪尔·亨廷顿1968年出版的《变化社会中的政治秩序》。这部书尽管已经出版了半个世纪之久，但它恰好可以帮助我们理解20世纪五六十年代发展中地区的政治。欢迎你在留言区分享你的阅读心得。\n\
    \n我们这一讲的主题，是陷入停滞的发展中国家。那么，有没有实现快速经济增长、创造经济奇迹的发展中国家呢？当然有。下一讲，我就要跟你讨论这个问题。\n\n![](img/a8636aa9ade03281f9422f57ba2f5226_51_0.png)\n\
    \n“< 上一篇”\n\n用户留言\n\n提交留言可与专栏作者互动\n\n## 26 增长：为什么有的威权主义政体创造经济奇迹？\n\n我们上一讲的主题是“蒙博托陷阱”。对于一个发展中国家来说，不能完全不重视政体的权力。如果仅凭着基本面的经济转型去赌，就会让国家陷入贫穷与停滞的陷阱。这一观点，不光有蒙博托这样的案例，还有相当相关的理论研究。\n\
    \n美国经济学家道格拉斯·诺斯在1998年出版了一本关于制度与经济学的书，他问了这样一个问题：为什么是英国而不是法国首先发生了工业革命？\n\n他发现，工业革命发生的前提，是产权受到了有效的保护。只有产权受到有效保护，产权才能启动动力。而只有产权受到有效保护，产权才能启动动力。而产权又分1615到1688年两次形成的新体制，权力受到法律约束的体制，也是经济成长的关键。\n\
    \n按照诺斯主义的说法，如果政治权力不受制约，一个国家就会陷入“蒙博托陷阱”，经济发展就不大可能了。这主要是来自西欧的经验。\n\n### 威权主义的经济奇迹\n\
    \n但问题是，发展中国家很少在早期，就如同英国一样，发展出一套稳定的产权法律制度。我们前面还提到，蒙博托在其权派垄断独裁的政治传统。但并不是每个国家都有封建主义传统的，因此，我们考量各国发展上，还要考虑到各国国情的多样性问题。\n\
    \n如果一开始发展中国家起初并没有建立起一套完整的产权法治制度，事实表明，这些国家发展威权主义政体，大致是政体力量集中在一个人或小圈子人士手中，这些国家难道就不发展了吗？\n\
    \n从各国经验来看，实际的情形非常复杂。一个有趣的表象是，有的威权主义政体不仅没有陷入“蒙博托陷阱”，反而实现了高经济的增长，甚至可称为“威权”的经济奇迹。\n\
    \n那么，你想得到哪些案例？比如，俾斯麦时期的普鲁士表现就是一例。到1870年普法战争中期为止，他比20世纪欧洲在世界上繁荣的政体。而在很多历史中，政治上常常被诟病，而经济却在政治时期获得了长足的进步。\n\
    \n我们可以举个例子。比如一些西班牙在后期支持共和政与反独裁者的政治势力者，30多年以后回归西班牙时，竟然大杀一方（注：此处OCR严重混乱，根据上下文推测为佛朗哥时期西班牙的情况）。而为他离开的西班牙，已经实现了相当程度的工业化，俨然是一个欧洲的现代化国家。\n\
    \n这位总统开始说我们，在什么当年轻佛朗哥统治的年代，在起初不就是要推倒佛朗哥独裁（注：此处OCR误写为苏联），推倒佛朗哥呢？而是经过佛朗哥30多年的统治，西班牙在经济上和贸易上发展，难道不就是我们想要的东西吗？\n\
    \n又比如，韩国朴正熙时代也创造了经济高速增长奇迹。他的统治时期是1961年到1979年。如今，韩国的统计总长度已经身穿财大（注：OCR错误，应为“韩国总统选举”相关描述），但她能够当选韩国总统，原职作为朴正熙女儿的身份是有关的（注：此处可能指朴槿惠，但语境中朴正熙是男性，此处OCR可能混淆了人物或事件，暂保留原意修正为：朴正熙的女儿朴槿惠后来当选韩国总统，这与她作为朴正熙女儿的身份有关）。\n\
