    ## 14 政府形式：议会制，还是总统制？


    包帅 | 政治学通识30讲


    我们前面的课程已经讲过了两个模块，但无论是权力范围管理社会，还是思考如何控制权力，都具体地与政治制度安排有关。有意思的是，同为发达民主国家，具体的政治制度安排差异也是很大的。


    这一模块，我就要跟你讨论具体制度设计的不同，对实际政治运作的影响。当然，这方面的研究成果多，要用几次讲座来讲、说明白，实是相当困难。


    我的课程安排是，我们要通过解读几个典型国家，比如政体、政党、选举制度、央地关系等，来帮你领会制度设计背后的政治智慧。


    ### 美国政府为什么“关门”？


    这一讲的主题，是总统的行政权力会如何影响联邦政府的运作？这里的最高权力配置，主要就指行政机关与立法机关之间的关系。行政机关，就是总统、首相或总理领导的部门；立法机关，就是议会或国会。


    像英国这样，由民选的议会决定首相与阁员人选，然后由首相与内阁行使行政权，对议会责任，这样做就叫做议会制。


    像美国这样，民选的总统行使行政权，同时，议会独立行使立法权，总统与国会互相制衡，这样做就叫做总统制。


    为了说明总统制与议会制的不同，我先给你讲个故事。2011年10月1日，由于美国没有新政府预算，美国国务院的预算案、政府被送入关门状态。那么，奥巴马政府为什么会关门呢？


    直接原因当然简单。美国财政实行的是预算制，国会批准的花用。没有国会批准预算，白宫就要来钱都没有运转。


    但这只是直接原因，还有没有更深层的原因呢？美国媒体通常认为，当时，主要有两个争议点：


    一是，金融危机之后，联邦政府已经债务高筑，债务已经多次触及或接近批准的债务上限；

    二是，奥巴马政府通过医疗保险法案，遭共和党反对，共和党试图修改法案的制定，他们想借此来迫使奥巴马让步。


    ### 美国政府为什么容易“关门”？


    这个解释很有道理，但还，为什么呢？我们知道美国常常像个坏那。相比之下，英国的财政与政策，英国反对党也不支持政府的预算收支，为什么英国政府没有出现政府关门事件呢？


    这就涉及到英国议会制模式与美国总统制模式的差异。在议会制模式，议会或下院是由选举产生的，然后，议会下院选个首相人选及内阁组成。这样来，首相自然是要对下众负责的。


    但与同时，首相往往是下院多数党联盟的领导。所以，首相高上需要时议下院众，但实际上又或上下院的多会下院。这样，的预算或法案会得到下院众，**这就是英国政府不容易“关门”**的原因。


