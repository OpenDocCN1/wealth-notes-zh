    \n![](img/a8636aa9ade03281f9422f57ba2f5226_13_0.png)\n\n1. 起催化作用的政府：“掌舵”而不是“划桨”，州政府不仅是提供公共服务，还应向各行各业提供前瞻性信息服务，引导社会创新，政府要积极参与到经济、能源、环境等各个领域的工作之中。\n\
    2. 社区拥有的政府：授权而不是服务，州政府应将其管辖权和权力从政府转向社区，让社区有权控制资源来管理自己的社会意识，从政府依赖转变为社区依赖。\n3. 竞争型政府：把竞争机制注入到公共服务当中，政府应当利用竞争机制提供公共服务，包括拍卖、公开招投标、合同承包等方式。\n\
    4. 有使命的政府：改变因循守旧的组织，把政府的活动与结果相联系，将政府从预算导向转变为任务导向型组织。\n5. 讲究效率的政府：按效果而不是按投入来分配公共资金，让管理人员自主管理。\n\
    6. 受顾客驱使的政府：满足顾客的需要，而不是官僚组织的需要，顾客是公共服务的最终目标，要尊重顾客对政府的监督。\n7. 有商业心的政府：有收益而不浪费，政府要寻找在公共政策上还能有利润的领域，以投资收益来维持政府运转。\n\
    8. 有远见的政府：防患于未然，政府要有预防意识，预研对策，而不是头痛医头，脚痛医脚，要为未来做好规划。\n9. 分权的政府：从等级制到参与协作，政府下放权力，积极采用合作与式管理，让一线员工参与公共事务的决策。\n\
    10. 以市场为目标的政府：通过市场力量来进行竞争，即政府工作运作在体现市场竞争机制下有效配置政府资源，政府也应当进行市场化运作。\n\n你提问：感谢回答请将著作摘录。\n\
    \n> **伪善：**\n有句话叫“存在即合理”。这句话放在政治领域可以说是有绝对理由的。而一个团队的现状，不是没有更好的办法，而是现在处于一个合理变差的结果。\n\
    我觉得有些理解为什么有那么多不喜欢政治了，不一定是黑暗或者阴谋论，而是无奈。\n\n> **陈C：**\n1. 官僚制的一些特性：“单一性原则”，并不在于怎样合理应对具体的政策需求，而在官僚机构各个角落，要面对每一个实体单位的任务。而官僚机构中存在的这种权力集中的现象，也是（线性）。\n\
    2. 再观察整个行政现象，也许有它存在的意义。黑格尔的书中有这么一句话：“经常被人利用，但没人不喜欢这句话”。我认为合理的逻辑是“合理”，而“合理”的，则不应去探寻“合理”与否。\n\
    3. 政治系统的改革，需要以统治技术为基础，而这一点也经常与科技发展密切相关的。在一个正在高度竞争的体制下，我们面临着一个选择，到底要怎样。\n\n## 07\
    \ | 暴力：内战何以发生以及如何难以和平解决？\n\n我们前面讲过，按照韦伯的说法，国家是一个合法使用暴力的机构。但有一种情形出现时，国家就无法垄断暴力了，那就是国家处于内战状态。\n\
    \n### 为什么内战会发生？\n\n中国历史的大趋势，是“合久必分，分久必合”。这里的“分”，不只是指国家分裂，而且还往往是国家处于内战状态。即像东汉末、西晋末、五代十国，以及明中后期等时期的混乱状态。\n\
    \n其他国家的内战也不少，比如17世纪的英国内战，19世纪美国南北战争，20世纪30年代的西班牙内战等等。\n\n无疑，内战对付各都意味着巨大的痛苦。组织战争需要付出巨大的代价，战争也意味着大量的生命、财产伤亡。然而，为什么内战总是人类社会的噩梦？甚至是到今天，还有人死于国家以暴力手段的厮杀。\n\
    \n关于内战为什么会发生，国际学术界已经贡献了很多重要的理论，主要有包括社会结构论、认同论、资源争夺、权力争夺、失误假设、动态等。\n\n但是这些理论是什么，我们大致都支持这样一个基本观点，即人类社会中存在着反叛的巨大动力，而反叛国家能力的加强，却极大削弱了反叛力量。\n\
    \n比如，中国古代的农民战争，不少就是“民不聊生”。像唐末黄巢起义，宋末方腊起义，明末李自成起义，都是因为政府无力控制社会秩序，民众起义反抗。\n\n又如近代，20世纪40年代，在非洲国家尼日利亚的石油生产，在伊朗的石油生产，以及中东国家的石油生产，都出现过类似的情况。中央政府，无力控制国家石油开采，内战爆发。\n\
    \n你看，这两个例子看似具体情形不同，但大体都是相似的。从理论上去说，包括仇恨和国家能力，是导致内战的两个重要因素。\n\n### C-H模型：理解内战爆发的原因\n\
    \n看到这里，你可能会产生一个很奇怪的问题：既然内战的逻辑是相似的，那么，为什么有的国家容易爆发内战呢？这个问题一直困扰了世界很多的发展。\n\n2001年，他们的研究\
    \ 保罗·科利尔（Paul Collier）和 安凯·霍夫勒（Anke Hoeffler），对国内战争进行了研究。\n\n2001年，他们的研究，被称为科利尔-霍夫勒模型，简称C-H模型，发现了影响内战的5个关键因素。我这里为你简单介绍一下他们的发现：\n\
    \n1. **第一个因素是反叛武装对资源掠夺的容易度。**\n   特别是，当一个国家有很多廉价的油田、金矿、钻石矿时，反叛武装就容易获得财富。\n   比如，中非有个国家叫塞拉利昂，它有丰富的钻石资源，一个小地方就能控制国内的采矿权。电影《血钻》，就是以塞拉利昂的钻石开采为背景的。\n\
    2. **第二个因素是反叛的启动机会成本的高低。**\n\n## 政治学认知升级清单\n\n好，这一讲我们分析了内战何以发生以及为何难以和平解决。\n\n\
    我们希望可以给你的启示是——博弈论是分析政治现象的重要视角。博弈论的思维，主要就是基于政治行为者的互动策略，来分析他们可能的选择。\n\n举例来说，美国总统宁可政府关门，也不愿意跟反对党作重大让步。主要原因就是，总统相信，一旦政府关门，白宫通过新闻传播，会让反对党背上更大的政治包袱。总统希望美国公众能够形成这样一个印象——正是反对党的恶意阻挠导致了美国政府无法运转。\n\
    \n这样一来，当再次重启谈判时，总统觉得只需作较少让步，就能达成协议。借助博弈论思维，这样的事情就会一目了然。当然，真实的情况往往要比这里分析的更为复杂。\n\
    \n这个模块，我们以国家为中心，讨论了权力如何管理社会。有效的权力固然是重要的，但权力一旦产生，就有被滥用的风险。所以，我们下一模块的重点，就是讨论社会是如何控制权力的。\n\
    \n### 课后思考\n\n那么，你认为，在社会如何控制权力这个问题上，人类已经产生了哪些政治发明呢？这是我留给你的思考题。欢迎你在留言区分享你的观点。\n\
    \n![](img/a8636aa9ade03281f9422f57ba2f5226_15_0.png)\n\n## 08 | 城邦：以民主控制权力的首次尝试为何没有成功？\n\
    \n我们第一课就谈到了国家。国家是政治起点，是执政的来源。有了国家之后不，我们的第二模块就是要看看，有了国家之后，权力一旦产生，就产生了权力是否会伤害百姓的担忧，于是如何控制权力，就成了人类政治进化的第二个根本动力。\n\
    \n为了控制权力，人类从古到今产生了很多政治发明。有些政治发明是成功的，成就了我们今天的整个控制权力的方法。我们的第二模块就是讨论这个话题，包括雅典、共和、立宪、议会、民主与创新等六个主题。\n\
    \n### 雅典的民主如何进行？\n\n既然说权力要控制，那么社会究竟该控制权力到底呢？你很可能首先想到民主的方法。这一讲，我就带你进入古代城市的政治实验，就是古代社会用民主方法控制权力的首次尝试。\n\
    \n民主并非19世纪以来的新事物，而是一项古老的政体安排。它的专利权属于古希腊的希腊城邦。公元前5世纪到公元前4世纪，是雅典民主的鼎盛时代。\n\n但问题是，在伯罗奔尼撒战争中，雅典城邦失败了。在后山，大师的改进进入了历史的舞台，那么，人类以民主的方法控制权力的首次尝试为何没有成功呢？\n\
    \n你可以试着先，我们顺着解下去，主要原原因是，在古代交通、通讯条件下，民主体系搞到了可上规模下，古代民主体系只能统治较小的国家。而雅典就搞一个大帝国模式失败的。\n\
    \n但问题是，早在遭遇亚历山大的军队之前，雅典城邦的行政权力也失灵了。因为形成了一种奇异的反动效果，特别是，柏拉图和亚里士多德这些哲学家们，普遍反对民主。这又是什么问题呢？\n\
    \n了解雅典民主的具体知识，并不是我们的主要目的。如果你对希腊学知识，还可以听听《苏格拉底、西方文明的源头》，我们看关注的是，古希腊民主制度的问题，仍然是今天人类讨论民主问题时绕不开的话题。柏拉图对古希腊民主的批评，仍然是今天很多思想家对民主制度的批评。\n\
    \n为了理解这一点，我们还需要简单回顾下来雅典民主的基本情况。**雅典民主有三项基本原则。**\n\n- 一是大众政治的原则。成年男性公民平等地参与政治，他们有两个办法来体现公民权：一个是统治，一个是选举，而且通常还是选举办法。这就可以，谁也无法单独控制权力。\n\
    - 二是公民政治的原则。雅典公民通过6000人大会和民众法官机构来公共处理公共事务，同样可以防止个人控制权力。\n- 三是多数决定的原则。雅典公民既大会投票制，无论是投票、陪审法庭还是公共会议都采取多数决。这就保证了权力掌握在多数人的手中。\n\
    \n## 政治学认知升级清单\n\n好，通过这一讲，我们可以更深入地理解“政治是一项系统工程”。为了解决问题，政治创新当然是必要的，但政治创新同时必须具有有效性。这样，这种政治创新才能获得持久的生命力。\n\
    \n举个例子，明朝有一个人叫万户，他突发奇想，在椅子腿上绑了17个大型烟花筒，想要升空和登月，最后却被火药炸死了。\n你看，他的梦想没有错，方向没有错，甚至技术路线都没有错。但是，因为他没有火箭发动机、没有氧气设备、没有降落装置等等，即使他的大方向是对的，也没有用。\n\
    同样，雅典城邦的民主制，固然解决了控制权力的问题，但如何让整套民主制有效运转，就是一个更复杂的系统工程了。\n\n听到这里，我想你已经知道了，我们这一讲的重点是，人类以直接民主的办法来控制权力的首次尝试，没有成功。既然如此，人类还有别的办法来控制权力吗？第二个重要的政治发明叫做共和制。那么，共和制是一种怎样的发明呢？这是我们下一讲的重点。\n\
    \n### 课后思考\n\n最后，我还要给你留一个思考题：雅典民主制遇到的哪些问题，今天在很多民主国家同样存在呢？欢迎在留言区分享你的观点\n\n![](img/a8636aa9ade03281f9422f57ba2f5226_17_0.png)\n\
