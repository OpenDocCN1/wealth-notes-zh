    # 英格兰议会的起源


    其实，这里涉及到一个基本的政治学原理：如果一个政治制度诞生，它的生长和演化，既不是由创造这个实体的初衷决定的，又不是由纯粹的政治因素所单独决定的，而是有着一套自己


