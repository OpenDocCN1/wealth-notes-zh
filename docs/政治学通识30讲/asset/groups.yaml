    - 2. 你看问题更理性、更客观、也能更快地看到什么是政治现象背后的关键问题。


    很简单：普通人对与政治的观点，在很大程度上是被大众文化塑造出来的。而这门课程会为你提供政治学专业训练的滋养。


    下面，我们就来着着个区别有多大。


    ## 海盗船上的政治学


    你可能看过一部著名的电影，叫做《加勒比海盗》，如果不是海盗，也没关系。但是你想象，这么多年，大众文化塑造的海盗船长一般都有什么印象呢？残忍、血腥、霸道，杀伐果断，一言九鼎。或者，其实我们就是照着黑社会头子的形象来想象海盗的。


    但你可能没有想到的，在大西洋海盗的黄金时期，大概是17世纪的晚到18世纪早期，有的一海盗船竟然是实行民主制度的。几几乎到美洲，英国的普通平民拥有投票权提高了100多年。


    ## 那么，为什么有的海盗船会实行民主制度呢？


    这需要我们深入当时的实际情境中去理解这件事。


    首先我们要知道，海盗抢夺商船并不是一件容易的事情。海盗要么是吃软饭，要么自己往远处去。而商。欧洲海盗还有海盗在大西洋上巡逻。海盗一旦被抓到，就会被抓死。所以，海盗干的是风险很高的业务。


    而且海盗打仗，和军队不一样。它没有提供给你的，没有外部，不会帮你的。你、自相八的，所以是不大行的。你看，这就是他们必须面对的一个非常不利的外部条件。


    所以，在内部，海盗团伙必须要维持非常有效的一协调。而这个统一协调，其实就是个政治问题。从政治学角度看的话，海盗也必须要有一个结构。


    很有趣的事情，是：海盗船上的政治结构同普通商船很不一样。


    普通商船，的权力结构，跟我们今天熟悉的，公司非常相似。有明确的船长，也就是CEO，船长他在商船，船长他一般说一话九响。换句话说，船长是恰恰是比较独裁的，这种独裁今天由多的CEO在公司内部比较独裁是一样的。


    但是海盗不一样，他的权利比较松散，他给船长就比较容易滥用权力。比如，克扣船员工资，降低伙食水准等等。


    有一份偷盗记录，1724年，一艘商船的船长用鞭子打骂两条逃命的船员，结果竟然导致两个人的死亡。这样的事，在当时竟然时有发生。


    ## 那么，海盗船长是如何领导或者管理海盗船的呢？


    10年前，美国有一位叫托马斯·巴科特·巴诺德的学者，他写了一本书，叫做《海盗共和国》。老实说，这本书是有争议的。但是，它的好在于：它是建立在档案馆基础上的。


    他想象的很不一样的一个结构跟我们一般人的想象很不一样，简单地说，有三个主要特征：


    - 1. 第一，海盗们以民主方式召开船员大会，投票选择船长；

    - 2. 第二，海盗们通常以比较平均的方式分配战利品；

    - 3. 第三，海盗们还通过民主方式对重大问题作决定。


    当然，一旦战斗打响，船长就被赋予了绝对的权力，以便整个海盗团能有序进行。你看，这不是和今天的民主政体有点像？


    比如，1693年，在“幻影号”上发生了一次选举。后来他者哈吉普斯利·埃弗雷里当选为副手。他认为啥当选呢？两个情景同今天美国选举差不多。埃弗雷里向全体船员提交了一份计划，并进行了公开演讲，获得了船员大多数支持。这样，他才能做他们的船长。


    这条船上的分配规则也是非常平等的。船上拿拿最多份的两个人，船长、副手拿普通船员的1.6到3倍，而其他所有船员的收入都是一样的。我们的，对比之下，当时很多商船船长的收入是普通船员的10倍以上。


    这条海盗船，的决策规则也很有意思。在平时，重大的问题，比如民主投票方式来进行的，这是一个非常民主的制度，包括要去哪里抢，要不要攻击商船，船长可以做什么，但是，一旦进入战斗状态，船长就拥有了绝对权威，必须服从船长指挥。


    ## 海盗船上的政治结构有何不同？


    好了，问题来了：为什么商船一般是独裁的，那么海盗为什么是民主的？


    根据政治学去知道的政治学，比如说，经济越发达，社会越公平，教育程度越高，社会更加公平，那么，民主制度越有可能。这确实，但是，海盗船上制度都提醒我们，民主的出现可能源于内部。


    政治学的考察认为：当一个团体的成员在力量或实力上更均等时，这个团体更可能实行民主。具体来说，就海盗船和商船而言，海盗之间更接近一种平等，商船上则更可能是等级结构。


    你可以考虑三个因素。


    第一，海盗船没有股权机制，抢来是，这看商船完全不同。所以，从产权上看，海盗是可以理解为会员制，也就是海盗团体的共有产权。


    第二，船上的武力结构不一样。在商船上，常常是船长，只有一位数，武力在船上最强。而在海盗船上，每个海盗都有武力，实力差别并不是很大。就算海盗船长武力最强，他总有想弄事的时候？大家一起不同意，只要他有转身，就暴露在其他海盗的枪口了。


    所以，海盗船的政治结构要想稳定，必须依靠多数船员对船长的自愿服从与认同。这就是海盗能够实现民主制的内在逻辑。


    第三，还有一个很重要的原因是海盗船有更高的风险性。一个重要的因素是生存概率。这需要有“人才”的加入。当一艘海盗船有更高的民主制度、分配更公平的时候，能吸引更多人加入。


    你观察一下现在的公司，什么公司内部气氛民主？往往是那些高风险、高要求、人才严重欠缺的公司，其实跟海盗船的规律有异曲同工之妙。


    ## 政治学认知升级清单


    好，两节课结束了。在课程的第一讲，我之所以要先讲海盗的故事，是想说明三个重要观点。


    - 1. 第一，大众文化中对政治的想象，你需要小心，它可能不恰当。比如“人人为自己”这种，它可能是很糟糕的，也不合常理。我们要学习政治学，就是想理解和理解来摆脱大众文化对我们政治观念的塑成。

    - 2. 第二，政治无处不在。不管在国内、国际、公司、家庭、学校、任何组织中，都需要解决协调问题。

    - 3. 第三，政治规则不是由人的主观意愿决定的，而是由社会结构、人类生存面临的各种约束决定的。不能只靠“人人心怀善念”就能决定政治制度。政治规则，就是约束。


    关于最后一点，我再次提醒大家，要警惕大众文化对政治的塑造，它们往往倾向于告诉你，政治状态是由人的主观意愿决定的。但政治学不是这样看的。


    为此，在下一讲中，我将专门介绍一个案例，来讨论从主观意愿到客观政治规则之间的巨大距离。我们看看英国是如何独立后的政治制度。


    ## 课后思考


    最后，我还想提一个思考题：哪些流行的政治观念是被大众文化塑造的？而在你的生活中，你能区分哪些？


    欢迎大家留言区分享你的观点。


    中国入脑子是最缺这个领域的正确信息。那多少有些遗憾，这些入今天依然觉得学校里的“政治课”极度乏味，那是因为课上的信息是伪的，天然缺为勾连，连伪逻辑。


    匮乏塑造了人类的模样，匮乏塑造了人类的历史。食物的匮乏让我们走入到草莽，性资源的匮乏让人们彼此搏斗，而蛋白质中的匮乏让人们不得不吞噬彼此的血肉。


    布鲁斯探究人类的天性，归纳成竞争、第二是猜疑，第三是友善。竞争是为了争夺稀缺资源，人们在竞争中间倾向于用暴力解决别人，人类是在争夺中的输家，时常把心向人侵，自己往往因为一些鸡毛蒜皮的小争，觉得自己受到了一些蔑视，所以奋起抗争，以奋起抗争。


    基于上述的缘故，如果没有一个权威力量让大家信服，那么人们便在这种竞争状态下发展。如果人们都生活在“一对一切人的竞争”这种境况里，那么可想而知，产生不少有心有资源，发展下去。你知道，产生或增多，则人就越想争能坏所有人，人只能透过共同的价值网络里，才能秩序井然，百业兴旺。


    其实，大众对政治权力运作本身的看法，就是一种道观的立体。古往今来，无数人把政治视为少数人在黑暗中“操作”的阴谋，少教精英“天下‘，统治者计之众也，也是各种玄文小说最津津乐道的题材。


    但事实是，君主专制时代，因为掌握掌控一切的很小。精英到底离不了这一切的社会结构，既经精英以及思想的观念，但这些精英与非众往精英及以完全相同的。普通大众往往也以一种意想不到的方式塑造着政治生态，思恩纳特·托克维尔的《旧制度革命前夜》中探讨的法国文学或如何推动大众履及理的社会心理，从而从革命派覆大覆社合。如此看来，政治真的是有消消精英大众相互的，‘游戏人生’，有时候也是绝对的，在人生态，上表演的顺势或逆势的历史！戏剧！


    政治是系统问题，而大众思维是线性的。


    拿美国的平权运动来讲，大学入学政策看似给予了部分少数民族更多的机会，而实际上底层收取政要也会为西裔学生所不。我们知道不存在为自我实现的话，导致黑人社会中出现反面现象：好孩子被干，不正义是现在学校是被干的事。线性思维去解决系统问题最终导致系统问题越来越复杂。


    然而这种优惠政策在美国当前的民主体制下已经是没有回头路了。


    绝对的认知僵硬，大众主观意识造成很多的主要原因之一，而商业逻辑做作的出发点，只为了制造焦虑情绪的幻觉，副作用是让人们自为的真的，刻板印象产生。


    中西对比来看，中国内政，每次听不中西方的人说他们国家的政治体就是一个一言堂，用过去的观念理解当代社会太。而对政体，及利时的时代，就面临公共事务，涉及司法，建家，警察系统，被私下解决，对教育，用观念系统大文化变，虽然做出的决定，但往往在事后果然。


    西方的不喜，媒体宣传成的政治观念。大众也会被动变成或成的政治观念：中美之间的政治概念。白人中人众大观念，导致社会体存在永久变。


    一些极大众文化里，许多怪异行为，大众现象不断涌现。政治的逻辑也有边界与约束条件，就推的，还想到有政治能力不产生，但回人来看，的确民不一跟而就的，像看珊瑚礁，适合的政治比高级的政治要牢固得多。


    天赋人权这种说法我第一次听到的时候也热血沸，认为每个人都有平等或的，但是完全没有考虑到现实的人不平等的啊？前一子看到大学开有书里社会学的老师讲，现在‘卡卡卡拉拉’的主题演讲，出现在述成心有成意。根据说，所罗马世界中的大部分都变成了罗马公民，虽然乎并不真卡卡拉的权责，是从古至今没有无人拉去费责或，忽略了在现场中给罗马选成了不可挽回的影响，那就是直接导致罗马最终覆灭。


    柏拉图说民主是坏政治，我们要一位位人配，这听起来不也，性权配加上荣耀和智商表具的高进，社会秩序，促进整个社会，人性的弱点，为世不的弱点，但没有了性为，谁来保证这个明君无才，即使他们变，他后代，也能保证其变。所以被大众观念造成的，甚至被哲学观念塑造的理理理想都可能是非现实的，甚至是完全错误的。


    政治学的着理认为：当一个群体的成员力量或实力上更等时，这个群体更可能实行民主之间。来接近一种‘均衡实力’的均势状态。看到了‘均衡实力’，均势了罗得思维里进出的柯特斯的故事，门中就有‘均衡实力’的，说，问题就有，这两个‘均势’在本上应该是致的，也是说现实是实力接近的有者的结果，如果一方有武者，另一方能引，基本不可能现实，由此引出一个观：这是美国的人有枪，所以美国民民主。


    本在的例子，其实是一个哲学，在提题大单，恶人集的地方到能找到幸福。关于人性争论的争论是人类永的，但是争论久不代表就会有结果：如果人本善，那么所有的制都不应该？如果人本恶，那么必须有合的制进行性才？！人的目的攫取更多的富，时段的间，所时间关系成敌人。而，在大家有利益下，谁也没有必的把！是为了各共同的利益，大家都更求，大家族为了利益最大化的机会，也越了毫无法益，在团体实现了为自己。在这的条件们，因为对于人性善的论变得没有意义，国在一个良好的制里，恶人变的到了制利，本权利益到得了天下太于善人，这个制对他们毫影响！


    关于第一海海上的政治结构模，跟之念的上，实说老非合于思，但你没的过去可理论，比如，经发我会更容易谈论生，文或者的定地方更易实民，民高发达更易民，但的海民有原因，政治的考认为：当一个群成员实力或实力上更等时，个群更可能实行民主之。具体来说，海上能上更于船是更近于的结，是形的竞争的互同，是思到的人的，在志善作下得。


    在中国北方的草原和草原族的对立就一个典型的政治斗争。照今天解构的政权作认，可以对下这理解：


    - 1. 大众文化对于政治的想象，需要小心。在中原王朝中，有草原民族在夷，游牧百是看，逐草无民与民为奴，中原王朝是一在，都是具有勇的弱者，南下劫打打。

