    # 发刊词｜政治学是一门认世界的必修课


    包创升-政治学通识30讲


    你好，我是包创升。


    我的本职工作是复旦大学政治学系的老师。但从今天开始，我还要有一个新的身份，那就是到APP里，为你提供政治学领域的认知服务。你听在听我的课程，是我花了一年时间为你准备的《政治学通识30讲》。


    你能听到我这段话，至少说明两点：


    - 第一，你不认为，政治是和你无关的。政治，不正是“肉食者谋之”。

    - 第二，你不认为，政治是人都懂的。谁都可以讨论政治，但并不一定谁都能懂政治。


    有了这两点共识，我就可以带着你迈入政治学大门了。


    ## 你首先可能会问，政治到底是什么呢？


    如果你认为，政治只是一个专门的领域，若干社会分工中的一种，那它确实跟你关系不大，你在新闻上看看就可以。


    但是，我要跟你说的政治学，不是这样的。它是你理解世界的一个重要窗口。换句话说，如果你少了解政治，你对世界的认知就缺少了一个重要的视角。


    如果你会比较一下政治学与经济学，你就容易理解这个问题。


    学过经济学的人都知道，经济学研究的是资源分配的学问。也就是，在稀缺性条件下，人怎么通过市场机制配置资源。


    但是，只要你观察一下真实世界，你就会知道——这个世界很大一部分资源，其实不是由市场来配置的。


    有的资源是靠权力来配置，比如财政资金的分配；有的资源是靠先到先得的规则来配置，比如在银行排队取号；有的资源是靠素养和素质来配置，比如名校的资格；有的资源甚至是靠偷抢来配置，比如北京市的车牌；如果你的视野继续放大，人类历史上最有决定性的资源配置，其实靠的是战争。


    你看，这才是真实世界。


    所以，只用经济学的理论，解释不了这么多变多端的现象。这个时候，你需要看到那些更为重要的手，更是施加需要更深的框架，更深更复杂的互动。这样，你就走到了政治学的山脚下。


    在听你讲课的过程中，我会陪着你看着这条山路走上。一路上，你会发现一些你已经熟悉的词，如国家、权力、民主、自由……但是，你会重新理解它们。


    > 政治，其实是我们人类社会最最重要的那一层关系。平时，我们生活在其中，看到它似乎无多大变化，甚至感觉不到它的存在。但是，它确实在那里。它像地球磁场一样，规定着我们每一次努力的方向，边境和天花板，影响着每一次协作的边界、准的和成败。


    政治的变动，可能发生在极深极深的地壳里。但有时，一些变化，会在我们的命局中掀起巨浪。一些人，甚至是几代人的命运，从此面目全非。


    我知道，你得到APP的用户，你有强烈的冲动要理解这个世界。所以，即使你对从事政治这件事并无兴趣，对你的所有市井、收入和消费可能都来自你纯粹的市场，跟政治的关系似乎并不大，但是，我还是邀请你跟我一起，暂时跳脱出层壳亮的外面——


    - 看看它的样子，

    - 想象它的逻辑，

    - 探究它的历史，

    - 拜访那些曾经试图改变它的人。


    当你学会这门课后，再下台的时候，你会发现政治的目光，会加思加利和深度，因为，你对它的理解会更加透彻。


    1760年，后来出任美国第二任总统的约翰·亚当斯在参加独立战争，陪同乔治·华盛顿进入英国军队。这时，他的妻子从家乡写来一封信，对亚当斯只是问候。不问军事略有抱怨。而亚当斯在5月12日的回信中有一句话，后来变得非常有名。


    他这样写道：


    > “为了我的孩子们能够自由地来研究数学与哲学，我必须研究政治与战争。”他接着说：“我的孩子们应该研究法学，哲学与商业……以便我的孙辈能够研究绘画、音乐与诗歌……”


    我邀请你学习这门课，其实就是希望你的一生中可以同时扮演这几代人的角色：因为要想懂哲学，商业与艺术，所以，就必须解政治与战争。


    在开始我们的课程之前，你心里可能会有一些疑虑，因为政治学这门课程经常被公众误解。


    但是，请你放心。我们这门课程不会用抽象的大概念界定世界，不会过分理想化的方式来解读政治，更不会把政治学等问于简单批判现实的学科。


    我要带你的风景，是政治学领域那些从古到今最经典的观察。


    - 有的时候，我要带你到政治现场，来看看以国家为基础的各种政发展到底是怎样兴起的。

    - 有的时候，我要你带着大人性，来人类面临的各种复杂的问题中，来看看人们在关键时刻是怎么作出决定性抉择的。

    - 还有的时候，我要带你去在理想与现实的小缝隙中，来探究人类政治的改善有着怎样的可能。


    我们下面具体说，你上完这门课程的收获：


    ## 第一个收获，是结构化的认知。


    外行看政治，看到的是一个个事件；内行看政治，看到的是事件背后的整个结构。

    换句话说，重要的不是一个的故事，而是这些故事发生在其中的整个政治系统。


    学完这门课程，你在所熟悉的这个世界、你的全新认知中将会成为一个高度结构化的世界。


    ## 第二个收获，是全新的思维模式。


    如果说经济学课程的目标，是帮助你“像经济学家一样思考”，那么，政治学课程的目标，是帮助你“像政治家一样思考”。


    现代政治学的三种基本思维——国家思维、权力思维、因果思维将贯穿整个课程，它们帮助你理解理解很复杂的现象。特别是，你会发现，很多看似不合逻辑的现象背后，其实往往有着强大的政治动因。


    ## 第三个收获，是关键概念地图。


    概念是认知的起点，概念也是思维模式的根基。很多人知道知道几个政治学的概念，但很少有人都知道，这些概念是概念、概念与概念之间有着千丝万缕、逻辑化与真实意涵，以及概念与概念之间的联系。


    这门课程为你准备了100多个专业概念，让你观察世界时，能够手握一个清晰、清晰的概念地图。


    ## 第四个收获，是你会跟很多重量级的思想家成为朋友。


    从柏拉图、亚里士多德、霍布斯、洛克、斯密、卡尔，到亨廷顿、达尔、迪韦，福山，斯宾格勒，你会发现他们不仅如何提供政治解决方案？这门课程将锻炼人类历史上数十位思想家的政治智慧，——一类现于目前的。


    ## 第五个收获，是领导力的启迪。


    政治常常都要面对一个一个重要的关键时，不得不作出一个又艰难而影响深远的。


    ## 领导力收获，是领导力的启迪。


    执政党常常都要面对一个个重要的关键时刻，不得不作出一个个艰难而影响深远的抉择。所以说，领导力的启迪，将成为我们课程的重要副产品。


    当马尔默大法官既要捍卫最高法院的地位，又要避免跟总统、国会发生正面对抗时，就需要非常高超的战略智慧；


    当撒切尔夫人既要设法赢得选民们的支持，又要对积弊难除的福利制度进行改革时，就离不开领导力这项关键素质。


    我们课程的这些案例，将成为你研习战略思考与领导力的重要素材。


    最后，我要为你做一个简单的自我介绍。我是包刚，我，在北京大学获得博士学位，曾经在伦敦政治经济学院做过访问研究，现在执教于复旦大学政治学系。过去十多年，我一直在研读、讲授和研究政治学。每年，我都会在复旦大学讲授政治学的基础课程和专业课程。


    到目前为止，我已经出版了四部著作。像《民主制度的政治学》、《政治学通识》与《民主的迷惘》这几部作品，还有幸获得了《新京报》年度社科书”、“《纽约时报》年度中文好书”等荣誉。


    尽管我长期在复旦大学讲授政治学课程，但是，当接受罗振宇老师的课程邀请后，我还是遇到了不小的挑战。我是一个习惯了在书房里写作、在真实课堂里讲学的学者，要我们每次只用短短10分钟的音频，不借助到面的互动，就要把一个重大的政治学问题讲清楚、说明白，其实并不容易。


    为了让用户有最好的体验，我用了整整一年时间构思课程大纲、起草文章、倒推重来，反复修改、推敲打磨。得到重要的，其实是每位主讲人要把他的生平所学与专长，用最精炼的篇幅，以最适合音频环境的讲述方式，提供给各位。


    经过这样的准备，这门课程今天终于上线了。所以，我有足够的理由相信，你，作为《政治学通识30讲》的第一批用户，一定会不虚此行。


