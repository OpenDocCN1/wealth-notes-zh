    社会科学也一样。像亚当·斯密的经济学理论，也是有边界条件的。如果到处都是从事抢劫的“看得见的手”，那“看不见的手”就不会起作用了。


    # 第二，我希望你能建立的思维方法，是“变量”思维。


    很多时候，政治现象，往往是他社会因素变动的一个结果。比如，我们今天讲到的，没有起码的财富积累，就不会出现国家。


    再比如说，民主制度，它的出现，同样也需要很多条件。在古代，国家层面的民主，主要是出现在城邦啊，而不是较大规模的国家。这为什么会有国家，这个问题，你可以可以先思考，因为我们后面很快就要讨论。但总之，国家层面的民主，也是财富、技术和社会条件这些变量的变化所带来的结果。


    再强调一遍，政治学是理性思考政治现象的学科，它的主要任务不是喊口号，也不是简单地给政治现象做道德裁判。政治学一直在追问，政治领域到底“发生了什么？”以及“为什么会发生？”


    好的，我们这一讲已经阐明了国家兴起的逻辑，但并没有回答为什么国家是我们今天所看到的样子。这是我在下一讲要与分享的。


