    \n第三，政治学者想到的今天的观念来评判昨天的历史。政治学不是视角，是解释者和政治事物主体应该后者的逻辑。你学了政治学这门课，就应该摆脱简单化，国家化的思维方式。\n\
    \n# 课后思考\n\n最后，我留给你一个思考题：在人类政治史上，还有什么现象看起来既明显不合理却又长期存在的呢？原因是什么？欢迎你在留言区分享自己的观点。\n\
    \n我们这一讲的主题是君主制，但统治国家仅有君主不够的，还需要一个官僚系统。那么，官僚系统的运作有什么特点呢？这是我们下一讲的主题。\n\n![](img/a8636aa9ade03281f9422f57ba2f5226_11_0.png)\n\
    \n+   - **老史**\n  思考题：在人类政治史上，还有什么现象看起来既明显不合理却又长期存在的呢？原因是什么？\n- **佛朗汀**\n  最近听到对小米联合创始人刘德先生的访谈时讲到1个词叫“阶段性正确”，我认为是包老师今天课的内容有相似之处，老师所提及古代的政治学思考非常非常需要，教授的情感着看历史上政治制度是“阶段性正确”。我想，一个政治制度不仅存在及是否需要废除，后它入到当时历史背景中，从生产力发展水平，社会文明程度等“系统因素”角度来思考，才能理解某些“阶段性正确”的特点。\n\
