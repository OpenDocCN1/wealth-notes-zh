    现在很多人喜欢说：“我不关心政治，我想他们都应该听听我老师的意见，因为是他们影响了政治。”


    1. 有些知识以为的经济关系，其实背后都是政治因素。

    2. 你可以不关心政治，但我们的生活到处都是政治。

    3. 掌握政治学的思维方法，对我们的生活大有益处。


