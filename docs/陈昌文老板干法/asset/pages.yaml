- pgno: 277
  md: '# 第二、看市场取向。


    《孙子兵法》是一部纯理论的书，《吴子兵法》也是，但《吴子兵法》是以人物交谈为背景来阐释自己的思想，比较像对话录。而《孙子兵法》则是直接讲理论。在现在看来《吴子兵法》有着强大的创意优势，但在几千年前吴起的手段已经是玩过时的了，你不信随便找本“什么子”，比如《论语》:孔子见老子，孔子曰了什么，老子曰了什么。然而当时市场上就《孙子兵法》的体裁特殊，所以《孙子兵法》畅销。也就是说，我们做营销一定要差异化9突出特点。比如，大家都强调价格低，你就别强调你的价格更低了，你要强调你的质量好。当大家都强调质量好的时候，你要强调你的价格了。


    孙武一出来就把 13 篇《孙子兵法》献给了吴王，可以说是找了个很好的广告代理，就像现在这个社会，找到了微博大 V 或者意见领袖帮你传播你的产品。但是吴起在这方面不知道他做了些什么。


    # 第三、广告长短的设计。


    《孙子兵法》与《吴子兵法》可以说在军事理论上平分秋色，但《孙子兵法》短仅 13 篇就搞定，《吴子兵法》长篇大论了 48 篇，我在想它之所以失传了 42 篇，大概是在那个把书写在竹子上的年代，读书人在搬家的时候觉得麻烦，就留下短小精悍的《孙子兵法》，把长选的、文采不是很好的、自己又不太愿意多读的《吴子兵法》扔了吧。所以，我们做广告一定要短小精悍，不要太长了
    9 力争让用户一下子就记住。


    # 第四、树立良好的公众形象。


    吴起的传闻是从小传到大 的，吴起杀妻求将、弃母求官，小时候在家乡'
