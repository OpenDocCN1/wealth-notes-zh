- pgno: 251
  md: '# 7. 企业管理是法治还是人治


    管理这种事情，公说公有理，婆说婆有理，但我们去实践，就会获 得真理。在企业里，我们的管理是有目标的，是有绩效的，是帮助企业 更高效率的完成业绩的。只要是不赚钱的管理多就是错误的管理。


    我们看一个人的管理能力强不强，就是看他为企业带来的价值大不 大。企业的资源是稀缺的，管理者要把那些浪费公司资源的人与事去除， 管理者应该有变废为宝的能力，让大家按照最优的路径去做事。


    当一个企业有几十人的时候，如果老板什么事情都亲力亲为的话， 这个企业基本就发展不起来了。老板会非常累，总是会感觉管理不好。 当企业发展到一定规模，老板的任务就不是管理企业里的事与人了，
    是直接变成寻找优秀的管理者加入公司，招聘优秀的管理者加入公司。优 秀的管理者进来了，老板只需要管理这些优秀的管理者，企业就会突飞 猛进的发展。


    不管公司怎么发展，业绩有多差，老板都不应该抱怨下属无能，不 应该骂娘。杜绝与股东勾心斗角，你永远不能说是别人的错，反正自己 没错。有 4 点理'
