  img_proc: true
- pgno: 246
  md: '了起来。中国文化很注重感情管理，比如“疑人不用，用人不疑”就属于感情管理。毫无疑问，用这种方式管理企业是走不下去的。


    在企业管理上，在道德层面假定善意⁹但在制度层面假定恶意。这是什么意思呢？我们假定善意是指以善意与别人相对，这个是在道德层面的。而这个制度上假定恶意是指在未出现问题时，明确出了问题后按照这个制度去解决。


    任何事物都有两面性⁹人也是，每个人都有善的一面和恶的一面。企业管理也必须恩威并施。


    实际上，这个地球上的任何事，我们都要从阴阳的角度去处理。一个人是好是坏，是天使还是魔鬼，也是我们自己的善恶相互博弈后一种形式上的体现。我自己也是，有好的一面，也有恶的一面，但是我会去'
  merge: -1
  img_proc: true
- pgno: 247
  md: '抑制自己恶的部分。我们生存的社会充满各种欲望和诱惑，你无法保证 你的 部下全部都是天使，或者，他们曾经是天使就能永远是天使吗？


    从制度上假定恶，就是当恶还没产生或欲望还没产生的时候身就将 其抑 制住。从道德上假定善意身从制度设计上防治人的恶性发作。你无 法要求你 的部下全是天使，他会有魔鬼的一面，而制度的约束，就是减
    少他魔鬼这一 面的释放。一旦魔鬼的一面展示出来时，就可以以制度为 参照抓住他的问题。


    如果没有制度依据，大家都含情脉脉，我相信你、信任你，你不能 辜负 我的信任。当然，你用人，就是因为信任他的才能才用他，而且我 们还允许 他有技术性的失误，因为我们自己也犯过错，也是在试错中一
    步步走向成功 的。


    真正聪明的老板，知道下属犯错了，不吭气、装傻、允许他犯点错误。 当他知道错了之后，他会更努力地做，珍惜你对他的信任。尤其是公司 壮大 了，授权实际上是非常重要的，一且授权就不要横加干涉，这是所
    谓“疑人 不用，用人不疑”。但不横加干涉并不意味着连监督机制都没有。


    授权者要把握好到底什么样的错误可以犯多哪些错误是致命的，这 样的 错误犯一次公司就会垮掉那一次都不可以犯。比如在原则问题上、道 德问题 上。如果还用这种毫无约束的信任，那就是狠枉了。


    不是所有的人都是天使，人都有魔鬼的一面，没有束缚、没有约束、 就 一定会出问题。我们自己不是天使，当然也不能要求我们的员工和部 下都是 天使，我们要做的就是假定善意，辅以制度建设，将恶的一面抑
    制下去。'
  merge: -1
  img_proc: true
- pgno: 248
  md: '# 6、如何做企业文化建设与经济建设


    人和动物的区别就是人有文化，动物没文化。凡是文化程度低的人 几乎很难混得比文化程度高的人好。当然有个别例外，但我从来不喜 欢 谈例外。


    一个国家的文化强过另一个国家，一般，这个国家就发展得比较好。 一个企业的文化强过另一个同行企业，当然，这个企业就容易发展好。


    我们国家从董仲舒向汉武帝提出过所谓 “罢黜百家，独尊儒术” 这一建议开始，就以儒家思想统治老百姓，以法家思想为内核。所以，我 就直接借鉴了这个模式，直接给企业员工上儒家思想。儒家思想我又把
    它分为三个体系：第一个，《论语》；第二个，《春秋》；第三个，《易 经》。


    《论语》对所有员工，《春秋》对中层管理者，《易经》对高层管理者。


    我们企业的口号是，天行健，君子以自强不息；地势坤，君子以厚 德载物。为了怕有的人听不懂，我就告诉大家，自强不息的意思就是天 天使劲的干活，别休息。所以我们企业没有周末与节假⽇，也没有下班
    时间，就是吃饭、睡觉、工作。


    厚德载物，我给大家的解释就是，别抱怨，就是要求大家不断的干活， 也不可以抱怨。


    每个人天天早上就能看到我读《论语》，然后企业里的其他人看到 我读《论语》了，慢慢就有这个意识了，自己也想读，一般跟我接触 一个⽉过后，我就会叫他去买一本注音版的《论语》来读。为什么我不买
    给他？就像很多'
  merge: -1
  img_proc: true
- pgno: 249
  md: '企业一样一开始就强行灌输给员工企业文化呢？因为我 知道，一般的人，你灌输给他，他要反抗的。反倒是不读了，说你洗脑。 只有通过潜移默化，让他自己迈出第一步，然后他就会不知不觉的上瘾。
    所以，我让他们自己出钱去买书。


    企业文化的建设必须是人主动参与的一个过程。何况，这东西能和  孔圣人联系在一起，非常有权威感，大家天天读就认为自己在学东西。 而且任何一个人来我们企业都会感觉到有学不完的东西，因为《论语》《春
    秋》《易经》博大精深，他们一辈子也学不完，搞不透啊。


    学这个东西，学了就立马可以用到同事与客户身上，比如《论语》  讲的就是人与人相处的事情。《春秋》讲一个 “义” 字，让大家判断什 么事情该做，什么事情不该做。《易经》让大家做事学会了变通，况且，
    这一套文化把大家的心给理顺了。大家沟通、工作，都没有什么好抱怨的。


    我真是感谢孔夫子，他这套文化能治理国家，那么，治个企业还 是绰绰有余的。


    文化建设好了，我们不仅能仅仅搞文化建设，大家都跑到我们企业里 来学儒家思想，没人赚钱，那还不都得饿死？所以，经济建设是企业的 重中之重。如果经常读历史，就会发现古代开创基业的皇帝为什么能够打胜仗，
    一统天下。我觉得，主要原因就在于这些皇帝论功行赏，不是说是皇帝 的亲戚，就提拔你当官，或者是皇帝的发小，就提拔你当官。而是 你确实帮助皇帝打了很多胜仗才能升官。而一些草包呢？就是任人唯亲，
    凭自己的喜好'
  merge: -1
  img_proc: true
- pgno: 250
  md: '任意授予自己喜欢的人官职、爵位。自己不喜欢的，就拿 来杀了。最后就只能打败仗。


    我当然不愿意做这种草包，所以，在我的企业里面以营销部门举例， 谁能升官呢？


    +   1、谁为公司赚的钱多，谁就升官，谁开会就坐第一排。赚钱少的就 坐第二排，以此类推。


    +   2、由于业绩单子有大小，有的人出单多，但是都是小单，赚的少， 但为企业打出了知名度，积累了不少潜在客户，我也重点考虑这样的人。


    总之就是严格执行“能者上，庸者下”的政策，其他部门也是如此。


    以文化建设为纲9以赚钱为目的9以营销和创新为手段，这就是我 经营企业的经验。'
