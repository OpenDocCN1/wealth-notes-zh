  md: '只知道做个好人，那么做企业基本只有失败收场。


    # 16、“岗位责任制”换成“目标责任制”


    我们很多老板很喜欢定岗、定责，让员工按时上下班，工作都在公司里完成。


    举个例子：我们招聘一个行政文员，给她4000 块一个月，一天工作 8 小时。早上来上班，8 点到 12 点，没事做，在那里浏览网页，看淘宝网。中午午休的时候罗
    12 点到 13 点，刚好，需要打一个合同，这个时候是午休，叫她打合同罗她就有情绪。等到下午 1 点上班打合同呢，又来不及，整个业务链条就因为这个行政文员要午休，时间往后推了
    1 小时。出现这个问题，就是因为老板自己把时间给定死了，员工就养成上班的时候，上班；下班的时候，公司的事情跟她没关系的习惯。


    这其实是国有企业、事业单位的作风，是计划经济的产物，非常过时与落后。在激烈的市场竞争竞争中，如果企业是这种体制来做事，竞争力可想而知。


    这种定岗、定责还会碰到什么情况呢？就是连续一个月这个文员都没事'
