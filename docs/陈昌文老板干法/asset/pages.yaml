- pgno: 196
  md: '这样，优秀的销售员会帮助团队里落后的销售员，团队里落后的销售员也怕因为自己的业绩不理想，影响到整个团队的业绩，这样对整个团队的影响都是正面的。


    第二 你的奖励必须是围绕团队成员而展开的，要问他们获胜了想要什么菁而不是你自己买了东西，想当然的给获胜的团队。如果你奖励的东西他们并不感兴趣，那么，恭喜你，以后你再用竞赛手段让他们拼命工作，他们只会在背后骂你。


