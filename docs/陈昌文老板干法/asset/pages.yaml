  md: '# **14、老板应该做什么**


    任何行为都会消耗时间与精力，优秀的老板就是把自己的精力与时 间投资在最有回报的地方。一个老板必须想清楚自己到底应该做什么才 最划得来。


    首先来讲，我认为赚钱最重要，因为有了钱，就能过很好的生活， 能生存。有了钱，就能繁殖后代。其实每一个物种本质上只干两件事， 第一生存；第二繁殖。而这两件事，都是建立在资源的基础上，而对大
    部分人来说，有钱就有资源。


    那么赚钱，一个人能赚的钱是非常有限的。我必须得带队伍，可惜 没有现成的队伍给我带啊，那我必须得做好招聘工作。这样推理下来， 我应该把大量的时间、精力投入到招聘优秀的人才上，其次是带队伍。


    我喜欢研究历史，曾国藩与石达开打仗，曾国藩基本都是输，其实 曾国藩基本上与任何人打仗都输。但一个经常打败仗的人，为什么获得 了那么高的声誉？为什么地位如此之奇？是因为曾国藩到任何一个地方，
    不问军机粮草、地方政务，首先问的就是这里有没有人才，有人才了， 他就叫人赶快记下来，然后培养。比如，李鸿章、左宗棠这些人，都是 曾国藩培养的。曾国藩自己打不过了，就找能人去打，能人被打死了，
    他又找一个能人去打。只要他不死，他就到处找能人，而且他大部分时 间都在网络人才，所以他的人才极多。有一句话形容说，曾国藩的大营 基本把整个清朝的人才都聚集起来了。所以买曾国藩当然能赢得最后的
