    一个班，如果出去打仗，你这个班里死了一个人，那么大家都要受到严 厉的惩罚。如果不想受到惩罚，那么你需要将功补过，就是你们也要杀 别人一个人。这个制度实际上强调了团队协作，就是避免了大家只顾自
    己升官，而降低团队竞争力的一个制度。大家一合作，结果业绩更高。


    我建议大家多读历史 9 实际上，我们很多问题，历史上都已经有了 完美的解决方案。商业的本质就是战争，不讲人情 9 只讲业绩。凡是遵 循这一条的 9 你就能带好团队。'
