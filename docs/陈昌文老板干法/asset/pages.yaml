  md: '这个项目干了两年，结果，主要是被其中两个最用心、最负责任的 同事给干成了，一年可以赚 500W,这个时候，已经有一年半不来公司的 那个同事要求分他 100W
    的利润，两个不怎么上心的同事，也要求分享 100W 的利润。


    这简直就是在扯淡。多劳多得，在任何地方都是真理，少劳动者或不劳动，自然就少分利益甚至不分利益。不是说签订了合同，努力工作 的人，就得给不努力工作的人打一辈子工。


    言必信，行必果。孔子说，那是小人。孟子说：“大人者，言不必信，行不未果。”说了都可以不算，这么么讲？君子没有必要为了坚持小信 用而不顾大道理。孔子自己遇到过这样的事，他经过蒲邑，遇到卫国大
    夫公孙氏占据蒲邑反叛，蒲邑人扣留孔子。孔子的弟子们和蒲邑人搏斗， 非常激烈。蒲邑人害怕了，对孔子说：“如果你不去卫都，我们就了你，” 孔子和他们立了盟誓，蒲邑人将孔子放出东门。孔子接着前往卫国。子
    贡说：“盟誓难道可以背弃吗？” 孔子说：“这是要挟订立的盟誓，神 是不会理睬的。”


    孔子说过：“言必信，行必果，径硅然小人哉！”这里的小人，不 是无耻小人，是没见识的人，是识浅狭狭的人。径硅，是敲打石头的声音，像小石头一样坚硬固执，说什么，就做什么，这样的人，不是君子，是小人。


    言必信，行必果，怎么倒成了小人？这是一个看问题的角度而已。 孟子说：“大人者，言不必信，行不果果，唯义所在。”大人只看道义 所在。不会死守自己说过的话，也不会死守过去计划。一件事，发现
    做错了身难道还要继续吗？


    当老板也是人罗经常讲话罗许诺的事情，由于事情与时间的发展， 变得与以前构思的不一样了。那么，我们还应该执行以前讲过的话吗？ 答案是，说话是可以不算数的，只坚持真理。现在怎么做，是正确的，
    是对自己企业最'
