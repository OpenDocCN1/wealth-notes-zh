    一持久罢了 *你也可以做到多锥手熟尔！


    # 24. 牛人从来不是靠飒会的


    牛人从来不是靠机会，而是靠实力，就算没有机会，也会自己创造机会。我们很多人看见别人成功了， *经常说，他就是运气好，是时代给了他机会，如果我生在他那个年代，也能怎么怎么样！如果有人给我几
    千万，我也能怎么怎么样。


    我小的时候接触过一种说法。说的是：如果姜子牙不遇到周文王， 就只能钓一辈子的鱼；如果诸葛亮不遇到刘备，就只能一辈子种地。我 曾经一度深信这种说法，认为一个人就算有再大的能力，没有机遇也是
    枉然。这就是'
