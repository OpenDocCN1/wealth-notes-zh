- pgno: 160
  md: '# 很多人感到怀才不遇的原因。


    后来接触商业，阅历丰富了，自己开始创业，突然觉得七窍一下子通了，对于很多事的看法也完全改变了。大部分人常常把结果说成是原因，这种说法很隐蔽，仅仅从逻辑上说，很难察觉其中有什么问题。实际上，是因为他们有那么大的能力，所以才有那样的机遇。根本不是他们机遇好。


    姜太公怎么钓鱼的？直钩，也就是说没有鱼钩！而且离水面三尺！这事它怪异！怪异就要引起人的兴趣，怪异就要引起社会传播，市场认知度就要大大提高！这种做法我们今天有个词形容：事件营销。姜太公，简直就是营销高手。然后引起了周文王的注意，周文王就跑过去问姜子牙，你为什么这样钓鱼？姜子牙就说了句话：“宁可正中取，不向曲中求。”意思就是“宁可正而不足，不可邪而有余，凡行事堂堂正正”。这是什么？这是销售中的成交话术。周文王一听，高人啊！赶快给他安排个工作！


    再来看诸葛亮是怎么种地的？诸葛亮好结交青年才俊，自比于管仲、乐毅！他后来怎么找到工作的？当年他结交的徐庶推荐给刘备的。这种做法我们今天也有个词形容叫口碑营销。


    刘备去找他，他跟刘备谈了三分天下的计策，这叫什么？有备而来，而且是有真功夫的。诸葛亮若没真本事，刘备会三番五次的去请他？靠运气吗？诸葛亮没出山之前，还作了一首民歌让农民唱，这也是口碑营销。'
