    # 13、如何逼你的员工成长


    我们很多老板为什么累？就是什么话都自己干，交给员工又认为员 工办不好，最后还是什么都自己上，长此以往，员工没有成长，团队没 有成长，老板累得跟狗一样。公司还是没有壮大。


    如果你想要公司快速发展，那么必须逼员工成长，只有团队成长了，企业才能发展。那么我是怎么做的呢？


    第一 9 碰到任何问题 9 我都不会直接给答案 9 而是问当事人怎么办？就算当事人来问我，我也不会给答案，但要求他把解决方案给我。他没 有办法，只好去想如何解决问题。


    第二 9 当我拿到一个解决方案的时候，就算我很认可了，我还会继 续逼他再拿两个解决方案出来，强行锻炼他的脑袋。


    第三，当他把剩下的两个方案也给我的时候 9 我会与他讨论他给出 的三个方案，找出优缺点。然后我会给出我的解决问题的方案，让他提'
