    生意再小，就算刚开始创业的时候，都要招聘员工，哪怕只是一个。我们做企业呢，首先要弄清楚，老板到底该做什么事。老板是完全不同 于员工的，至少是思想上，所以，你要做好改变思想的准备。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '老板该做的事多就是弄清楚该做什么。这话听起来是糊弄，是扯淡。其实却是正确答案。有句话叫贝“只有想不到的，没有做不到的。”这 话有争议，有争议就先搁置在一边页我们不争。但是另一个说法就肯定
    没争议了：“只有想得到，才能做得到”。如果你当老板罗很多问题你都想不到，那么这个生意也就做不下去了。当老板，实际上要注重彩想” 这个字，而不是去干活，干活是员工的事情。


    做企业最大的问题是，很多人根本不知道他们该干啥。他们经常说 “我知道，我要做企业、做项目、做生意，但我不知道到底该怎么办？” 表面上看，他知道该干啥，只是不知道该怎么做。实际上，他仍然不知道该干啥。进一步思考一下，你要是在传统的生意里面选
    个项目来做，'
  merge: -1
  img_proc: true
- pgno: 240
  md: '还是打算尝试点新鲜的行当，比如移动互联网营销等等。再进一步思考，究竟是要去卖烤全羊，还是要去卖手机软件，或者做互联网文化传播，或者做个自媒体？


    如果是卖烤全羊，你是要选择在城郊卖给那些比较有钱、开车来吃饭的，还是要选择在城中心，卖给普通大众？要选择多大的场地？进行何种装修？配备多少人？开业要不要做广告？老客户要不要发张卡打折。如果是做自媒体，你是要讲笑话呢？还是要讲商业财经？你是要采取文字的形式呢？还是语音、视频的形式？


    这样一步一步的追问下来，你会发现自己的问题其实真就是不知道该干什么。老板与员工的一个重要区别就是，老板要把握方向，而员工负责完成老板布置的具体任务。一旦每一步你都该干什么，具体下来之后，往往你已经知道该怎么做。


    比如，问题具体到了是要用一次性筷子，还是要用消毒餐具？到这一步，执行起来已经非常容易，不管你选择哪种，一次性筷子到哪去买，消毒餐具用哪家的？是个人都能做吧？只要你知道该干什么了，你就只需要布置任务让员工去实现这个任务，而实现任务该做些什么，是员工的事情，与老板关系不大。工业革命、经济发展、人类进步，其实就是得益于“分工”，拆开流程之后，超级复杂难办的事变成许多步骤，其实就都很简单了。


    老板就是做分析、判断、选择、决策，具体事务能不做的一律推给员工去做。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '举个例子：高考，两个小时，本来你能考 90 分，现在只给你 20 分 钟，请问你能考几分？我想你能考 30 分就是天才了。本来作为一个老板 （不分 大小），如果你每天用八个小时来思考该做什么，做到判断决策，
    你至少能 得个及格的分娄。现在你拿六个小时做厨师，外加两小时打杂， 挤出一个小 时思考，不仅仅你比人家累，你铁定及格不了。因为，你没 有于老板该干的 事情，所以，你这个生意就没有老板，只有员工，那么
    你一定要是失败的。


    具体一点，一个老板在街边烤羊肉（随便烤什么吧，鱼也行，茄子 也行），他要是雇员工来烤，自己在一边看着，然后思考、总结、调整， 这生 意就容易做大做强；反之，他要是自己去烤，这生意还能赚几个钱，
    就算他 了不起。


    那么，难道我们这生意不管多大，一开始就要招聘员工吗？对。我 想我 已经分析的很透彻了，再小的生意，如果连员工工资都赚不到罗你 还做什么呢？ 而且，主要你不招聘员工多你就一直是员工，没有管理
    就不会有老板思维， 当然也就没有发展前途了。老板思维是从你有员工 的那一刻开始的。


    # 3、你需要别人别人也需要你


