    顾客到底买的是什么？答案是：好处。


    好处就是能给对方带来什么快乐跟利益，能帮他减少或避免什么 麻烦与痛苦。客户永远不会因为产品本身而购买，客户买的是通过这个产 品或服务能给他带来的好处。


    三流的销售人员贩卖产品（卖产品物质性的部分），一流的销售人 员卖功能性的部分（就是顾客能感受到的好处）。对顾客来讲，顾客只 有明白产品会给自己带来什么好处，避免什么麻烦才会购买。所以，
