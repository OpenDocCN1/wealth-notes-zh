- pgno: 55
  md: '# 3、如何练本事超越大多数人


    每个人都想过人上人的生活，每个人都想超越大多数人，这就要求你有本事。而且，你的本事要超越大多数人。最好，这个本事是你的爱好，是你的优势，那么如何练习呢？在西方有一个军事理论家叫克劳塞维茨，他在西方的地位就如同我们中国的孙子一样，他有一部著作叫《战争论》，在西方与《孙子兵法》齐名。


    克劳塞维茨说9战略是任何时刻都不能停止的工作，就是说，战略要时时刻刻的去思考9去优化，去做调整。同理9练习一个优势也是任何时刻都不能停止的。比如，做为一个老板，虽然天寒地冻，但我们依然从早到晚思考业务，员工都回家了，但我们依然在办公室里干活。


    中国古代画家有一句话“搜尽奇峰打草稿”，就是平时每看到一山一河、一花一草，心里都在打草稿，思考怎么作画，如此，真正作画的时候，头脑里会有很多现成的草稿，就手到擒来了。古代有一位军事家，从小立志于军事，游历各国，每到一处都指指点点，哪里可以安营扎寨，哪里可以设置伏都想好了，战争年代到来的时候，他就了然于胸。


    练本事,就是心里只有这件事，吃饭也练,睡觉也练,做梦也练。比如张国荣、梅兰芳，为了演戏，都是时时刻刻琢磨，人戏不分。传说张国荣跳楼就是因为演戏入迷，根本分不清楚是在演戏还是在生活。有如此精神投'
  merge: -1
