  img_proc: true
- pgno: 33
  md: '由此可知：从事低收入工作的，都是学习训练中的失败者，也就是 被淘汰下来的智力和知识经验较低的人群。为什幺在学习训练中会失败 并且被淘汰呢？最主要是好吃懒做、懒惰、贪玩，控制不住自己的情绪，
    没有毅力和恒心，面对艰苦的学习训练，坚持不下去。总结起来，归根 结底一个字：懒！


    坚持学习、智力较高的人，一定会从事高收入的工作，进入较高的 社会阶层。那么，是不是收入低，就一定是智力低下呢？也不尽然。为 什幺？因为学校教育本身就不完善，而且有些教育内容，其教育目的本
    来就是培养你去做收入低下的低等阶层公民的，你接受的这种教育越多， 你以后越穷，收入越低。很多大学生毕业后，收入没有农民工高，就是 这个原因。他们上学没有学聪明，反而学傻了，究其本质，是接受了错
    误的教育。以至于，他们以后都不相信接受教育能发家致富了。


    所以我们要善于识别教育的内容。只要走上社会之后，自己刻苦自学，多向别人请教，就可以改变自己的命运，改变自己的收入情况。如果有 懂的人指导你，那么你就会改变得越快，收入提升得越迅速。因为收入
    低的本质，是缺乏训练导致的经验、知识和智力低下，进一步导致丧失 了进入高收入社会角色的资格，跨不过这个门槛，导致收入低。


    你只需要刻苦自学穷刻苦自我训练穷提高自己的经验、知识、智力 水平*尔就可以跨过这个高收入社会角色和低收入社会角色之间的门槛。 当你跨过这个门槛的时候，你就进入了更高的社会阶层，也就成为了大
    家所说的的社会成功人士。'
