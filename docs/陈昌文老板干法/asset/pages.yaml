- pgno: 119
  md: '# 4、具备哪几点，老板更容易成功


    第一个多了解人性，了解市场，了解客户。了解人性，大家可以阅读我的另一本书《陈昌文方法之老板心法》，不管你干什么，想做好，都必须了解人性。


    谈一下了解市场，从哪几个方面去了解市场呢？


    拿只笔，写出来你的同行，了解同行一天到晚都在干什么？同行的利润是多少？同行的营销策略是什么？同情的推广策略是什么？你都要知道！怎么知道呢？找人打入别人企业的内部去学习，或者自己亲自去给同行企业打工，快速了解同行的战略战术、赚钱门道。了解好了过后，回家修改成自己能够利用得上的策略，根据自己的具体情况去操作。自己想不出来的问题，去看看同行是怎么处理的，毕竟同行沉淀了很多年了，有优秀的解决方案，抄过来就行了，不要养成什么事情都自己干的习惯，要想办法借力打力。我不建议大家去创造一个什么新的商业模式、新的盈利点，我建议大家就是去抄同行，他怎么赚钱，你就怎么赚钱，你可以在他的基础上改进，但别自己创新。创新这件事费时、费力、费钱，面临的失败风险还很大。


    站在同行的肩膀上，我们才能走得更远。


    了解客户呢？就是了解客户的心理需求。卖东西本质上卖的是客户的心理认同、心理需求。


    第二个，有自己的圈子。当老板多必须要建立自己的老板圈子，独学就孤陋寡闻。这个圈子呢，由于现代有网络旁可以随时沟通。圈子分为网络上的'
  merge: -1
  img_proc: true
- pgno: 120
  md: '圈子。与现实生活中的圈子。老板要注意这些虚拟的文化， 这些东西非常有价值，穷人只知道看得见、摸得着的东西，对这些虚的 文化、精神财富、思想方面的东西，他们欣赏不了。你越想玩大，就越
    要注意这些文化性质的东西。


    一般进入一个圈子，都是有门槛的，物以类聚，人以群分，尽量进些 高端点的圈子，你才能吸收好的智慧，看到些好的商业模式、管理思想。 而你进入一个低端圈子，如果你水平都比他们高，就成了你花钱去给他
    们贡献智慧了，非常划不来。


    做电商的有电商的圈子，干软件的有干软件的圈子，干培训的有干 培训的圈子，干物流的有干物流的圈子，做时尚美容的有做时尚美容的 圈子。很多你认为是疑难杂症、瓶颈的事情，你一个人在那里想死都想
    不出来解决方案，在圈子里一问，结果立马就知道答案了。互联网时代， 要非常注意借助别人的大脑来解决自己的问题，非常快捷。以前叫科 学 技术是第一生产力。我看现在可以改成智慧就是生产力。别人的大脑就
    是生产力。


    人与人之间呢，是相互影响的，什么级别就找什么人，不要去找比 自己低很多的人交流。因为你获得不了什么，只能削弱自己的竞争力。 而比你低的人却从你身上吸收到了好东西，增加了竞争力。凡是不尊重
    这条规律的人，好自为之。所以接下来的问题就是，根据自己能力的提升，自己的圈子也要升级，不能半年了还在那个圈子混，认识的还是那几个人， 圈子要越混越好，越混门槛越高。认识厉害的人多了，路就好走些，记住，
    我们的目的是为了学习思维、智慧，不是去求人，也不是去借钱。


    真正能帮助到你的是，思维提升、智慧提升。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '第三个，习惯性充电。我这个人上厕所的时候，手里必定抱着一本书。虽然我妈妈告诉我，《黄帝内经》里写着，上厕所不可久坐，因为上厕所是鬼门开，久坐对身体不好，但我依然还是上厕所读书。习惯性充电
    包括，参加各种各样的培训，别舍不得花那几个钱，那么多大企业家还 去读MBA呢，傻瓜们总是自己不努力怪怪培训没用。阅读各种各样的书籍，把阅读训练成一种享受。当然，学习不光是看书，还有看人，广交有能
