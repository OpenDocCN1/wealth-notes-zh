  md: '# ## 12. 如何读书


    为什么很多人读书都白读了？甚至起反作用，让自己变得更加愚蠢？


    因为不是学习型读书，而是批判性、纠结性，带着好胜心在读书！


    读书要有收获，关键在于正确的读书观。我们读书，或者跟人讨论问题，有一个非常普遍的毛病，就是总想显得比别人高明，总是想去 批评别人的不对，或者要鸡蛋里挑骨头、找毛病。而不是专注于自己有什么体会，学到了啥。就算别人说得非常有道理，有些家伙还要想方设法，非要找一个说法，证明别人讲得不对，或者是换个角度，让他站不住脚，好显
    得自己有本事，显得自己知道得多。


    跟人提问题，或者是交流读过什么名著，不是交流学到了啥，开口就是：“我觉得他那地方说的不对！”总之就是要压倒别人。这种读 书方式呢，不是怀着学习的虔诚，而是抱着批评、挑毛病的快感，往往
    书上讲的是啥，根本就读不进去了，是学不到真本事的。


    那怎么读书. 才能学到真本事？只关心自己 能学到什么？有什么用。把这些观点放到自己身上去体会，放到实际的事情上去琢磨。这几条把 握好，读书就会让你突飞猛迸的进步。不要去纠结文字错误，不要去纠
    结别人用词不准确，不要去看不起写书的人。只管对自己有什么益处，在实际工作中碰到这种情况，有什么借鉴意义，才算没白读。其实，就 算书上真的写错了，不管错误得多么荒谬，至少也能让我们知道别人看
    问题的角度，这也是价值。'
