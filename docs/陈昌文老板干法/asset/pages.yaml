  md: '# 穷人和富人的思想差别


    穷人与富人的差别就是思想的差别身你是什么样的思想。就会有什 么样的人生。人要改变很简单，不是看你有多少学历、多大背景，而是 看你从何时转换你的观念。如崇说读了大学。依然是农民工的思想，那
    么 你就算在北上广，也是有个大学毕业证的农民工而已。


    穷人缺什么？表面缺资金，本质缺野心，脑子缺观念。有机会也不 去了解，骨子里缺勇气。改变呢，缺行凯 事业缺毅力！其实这些东西，你就算读再多书也学不来，而成功跟书本知识的关系不是很大，跟我刚
    开始提的这几点关系最大，应该有意识的去训练这些东西。


    世界上最聪明的人是借用别人撞的头破血流的经验作为自己的经验， 世界上最愚蠢的人是非用自己撞得头破血流的经验才叫经验！世界上最 聪明的人花很大的精力与金钱去观察这个世界身而穷人只知道低头干活。


    穷人喜欢抱着过去不放，拒绝新的观念和挑战。每个人都有退休的 一天，但并不是每个人都能拥有退休后的保障。聪明人不断的给自己脑 袋增值，就算年纪大了，依然也能赚到很多钱，比如巴菲特，他并没有
    因为自己年纪大了，赚钱能力下降，相反，这些靠头脑赚钱的人，年纪 越大，经验越丰富，赚的钱越多。'
