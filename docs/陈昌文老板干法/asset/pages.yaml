- pgno: 226
  md: '记散伙，算是怎么回事啊？


    我们要避免跟这种投机者一起工作，这会影响人的好心情。这种人如果当老板，只要被大家知道他的心思了，都没人愿意跟他混。


    真正的牛人是爱惜自己建立起来的企业，爱惜自己团队的人。.所谓藏富于民，赚来的钱财也是与大家分享的，哪里有落袋为安的想法？


