    是去配合顾客的观念。最聪明的销售不是只知道介绍自己产品的优点， 而是一开口就问用户需求，再用自己的产品去配合客户的需求。


    如果顾客的购买观念跟我们销售的产品或服务的观念冲突厉害，那 就先改变顾客的观念，然后再销售。客户是掏钱买他想买的东西，而不 是你想卖的东西。我们的工作是协助客户买到他认为最适合的产品。其
