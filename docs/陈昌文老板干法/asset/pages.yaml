  md: '第二，不讲虚话、套话。


    我们不是做官的，我们是要出业绩的，所以只能讲有生产力的实话。如果你 的每句话都能给人带去利益，就会受到别人的重视。别人不听你讲话，就是 他的损失。你长期坚持这样讲话，只要你一讲话，大家就会安静下来听你讲。
    你就会受到尊重，受到重视，然后地位就高了，领导力自然产生。


    如果你喜欢讲空话、虚化、套话、废话，就是作贱自己，慢慢地就没人 重视你了，你就会变成废人。


    君子讲话根据对方的情况，考虑对方能不能听得懂，能不能接受，能不 能帮助到别人。小人讲话，只管自己讲得爽，对方明明接受不了他的理念， 他还强行灌输。讲得别人认为他是骗子、忽悠。听者听这样的人讲话就感觉
