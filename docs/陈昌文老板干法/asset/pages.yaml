- pgno: 31
  md: '牛人就是能在逆境中保护自己的人。在逆境中丧命的人身不管他说是为了尊严也好。为了面子也好多宁死不屈也好。我都认为他是笨蛋。


    # 、收入高低的根本原因


    如果不干活就有饭吃。就不会有人干活，人性如此。社会上的有些工作，属于指挥者和组织者，例如各级官员和老板。本质都是在组织社会生产活动，是组织社会生产的指挥员。所以他们收入高。但要从事这种高收入的工作身需要有经过专业训练的头脑和经验。普通人没有受过专业训练。所以干不了这种高收入的工作。


    社会上的高层职务，都是需要进行专业训练的，一般人缺乏恒心和毅力，又懒惰，所以做不了高层职务。收入低的工作不需要什么专业训练。你什么都不懂，也可以干收入低的工作，因为不需要学习和训练，所以门槛低。门槛低导致大部分人都有资格进入干这种工作。工作少，能进入门槛的人又多，就导致低收入。


    高收入的工作需要较高的智力和较多的经验；低收入的工作需要的智力'
  merge: -1
  img_proc: true
- pgno: 32
  md: '和经验相对较低、较少。所以要想从事高收入的工作，就必须提前 进行学习和训练，积累丰富的经验知识，提高智力水平。


    什么是智力？其实运用经验和知识以达到目标的效率，就是智力。 做成一件事多消耗的成本越小智力越高；消耗的成本越大智力越低。 智力高的，有资格进入高收入的工作岗位，获取高收入。当今社会一切
    都要靠自己，一般人都希望发财，这是常识。


    社会阶层越高，人们从事的职业需要更高的智力和更多的经验、知 识才能胜任。社会阶层越低，人们从事的职业需要较少的智力和经验、 知识就可以胜任。社会底层的职业，相对需要很少的训练（识字就行，
    有些工作甚至文言都可以胜任）和很低的智力（只需要神经正常，甚至 轻度弱智都可以），就可以胜任。


    发现了没有？原来在低收入和高收入之间，在社会底层和社会中高 层之间，存在一个门槛，也就是学习和训练的门槛。大部分人比较懒惰， 缺乏恒心和毅力，无法承受学校中高强度的学习和训练，被筛选下来，
    成为学习训练中的失败者。这些失败者在训练和学习中失败之后，丧失 了继续参加训练的资格，就只有从学校中进入社会。


    其实进入社会，才是学习的开始。但这需要大量的金钱和良好的条件。有一定经济基础的人，才能支付得起培训的费用，养成主动被培训的习惯。由于这些学习训练中的失败者学到的知识和经验很少，思维缺乏训练，
    导致智力能发挥出来的潜力很低，他们只有被迫从事低价值的、低收入 的工作。'
