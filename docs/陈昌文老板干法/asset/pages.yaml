  md: '做，但是第二个月事情多，又要连续加班，这个时候，她就会有情绪。 有时候，她白天没事做，但公司的业务是晚上8点接到的，需要打合同， 她下班了，而营销部就等着这个合同要签约呢！难道又要把事情推到明
    天上午吗？再比如公司的司机，什么时候出车说不清楚，怎么可以学事 业单位、国有企业，定岗、定责？


    那么到底怎么做才合情合理呢？其实非常简单，告诉你公司里每 一个来上班的人，说，大家来公司，就是完成公司的目标的，你是文员， 就是要完成打好合同这个目标，这个目标没完成，就是你没尽到责任。
    告诉司机，你就是来开车的，帮助公司完成需要开车的任务，目标与任 务什么时候出现不一定，但是出现了就要解决。公司的设计部、营销部、 财务部、生产部，都这样做。这个理念要灌输到每一个员工脑袋里。


    公司要弱化“岗位责任制”这种操作方法 9只要目标出现了，大家 就赶快配合起来完成 9这才是一个灵活的团队、有竞争力的企业。


    不要扯什么以人为本，目标完成不了，事情做不好，企业就要倒闭， 饭都没得吃。比如，有些司机，他拉货给客户，到了客户那里，也不帮 客户搬货。老板问他为什么不搬货，他说他只负责开车，其他的不管。
    这样的员工，其实就是老板自己培养出来为难自己、得罪客户的。这样 的员工多了，企业毫无竞争力。你需要找一个能帮顾客搬货的司机或者培养司机这样做，事情做不好的人，直接开除。


    物竞天择，适者生存。各位老板赶快把公司的“岗位责任制”这套 制度换成“目标责任制”，以市场经济的经营理念代替计划经济、政治 经济的经'
