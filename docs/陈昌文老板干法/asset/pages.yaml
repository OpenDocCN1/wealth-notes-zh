  md: '有利的，就怎么做。


    # 10、两种企业营销思维


    两种企业营销思维：自我导向与他人导向。


    自我导向的企业，关注的是自己的产品是否优秀，成群结队的举行 鼓舞士气的会议。自我导向的思维认为，意志坚强、有决心、工作努力、 销售技巧高明就必将获得成功。对于自我导向思维的企业，我只能说，
    也许他们会获得成功。


    我比较推崇的是他人导向型企业思维。这种思维要求把注意力放在 竞争对手、市场上。习惯于找出竞争对手的弱点加以利用，并且为了避 开对手的长处，不惜调整自己的产品方向。他人导向的企业不会认为自
    己企业有精明的人才能成功。更加善于根据市场的具体情况做出对应 的产品和市场策略。找找竞争对手有哪些弱点。这样，往往取得四两拨 千斤的效果。


    在只有几个人的小企业，个人素质非常重要，但人数一多，特别是 在前几名的竞争对手之间，实际上人数都差不多，优秀人才也差不多， 这时候策略是否对头最重要，所以我推崇他人导向型企业思维。


    另外，老板在做组织调整时乡往会高估自己以及员工短期调整的 能力，低估长期改变的能力，结果是自己非常着急地推动一件事情，短 期做不到就很着急，着急之后就放弃。值得做的事情往往需要时间和耐
    心才能实现。


    我们做很多新业务，短期不能盈利，很多人就着急。其实做一个新 业务，'
