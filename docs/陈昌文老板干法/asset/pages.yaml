  md: '随着科学技术的发展，人们利用自然资源的能力越来越强了，不仅 仅会利用土地种植，还会利用地下的矿石、化石燃料，如煤炭、石油。 还发明了各种机械，人类进入了工业时代。这个时候，人类的财富跟这
    些煤炭、石油、机器挂上了钩。石油的涨跌直接影响到了经济的涨跌， 而且，美国的美元都是跟石油挂钩。这一时期，谁会利用机械、机器、 工厂，谁就能拥有财富！


    当然，未来的 10 年、20 年，以及现在正在发生的情况是，机械、土 地与财富的关系会越来越弱化，那么什么会成为土地、机械的替代品， 与财富挂钩呢？大家看看中国最富的那几个人是谁？马云阿里巴巴、李
    彦宏百度、马化腾腾讯、刘强京东东商城，世界上最富的人是谁？比尔· 盖茨、马克·扎克伯格，特斯拉电动汽车、苹果公司。这些 公司是干啥的？明显他们是知识经济与信息经济的结合体。也就是说，
    这个时代你拥有知识、拥有信息，就会与财富挂钩。


    一个日本工厂的一台印刷机坏了，自己的工人修了几天也没有找出 问题维修师傅最后不得不告诉老板，自己的能力实在是没有办法修好 这台机器。日本老板于是请来了一位美国工程师帮助解决问题。美国工
    工程师在机器旁边看了看，便拿铅笔在外壳上划了一条线，并对老 板说：“打开外壳，在画线的地方检查一下。”工人按美国工程师的指 导操作，果然很快发现并解决了问题。日本老板向美国工程师要多少报
