    管理最重要的是建立规章制度，设定企业办事流程， 而不是老板天 天提要求，然后盯着大家有没有完成业绩。这样，又累，又没效率，还 经常生闷气。没有规矩不成方圆。公司要尽量法治，少量人治。


    # 8、民主还是独裁


    我见到非常多的初创企业的创始人纠结这个问题。独裁形式 的管理 呢，总觉得太霸道，大家会不满意。而采取民主的方式管理团队，就是 什么事情'
