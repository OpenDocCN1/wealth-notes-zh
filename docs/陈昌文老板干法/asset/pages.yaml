  md: '# 26、追随自己的内心，人才会越来越有竞争力.


    我来自于贫穷而落后的山村。父母都是贫穷的农民，没有什么文化，值得骄傲的仅仅是母亲通过努力读了个高中，这或许多多少少的改变了 我的命运。


    我的童年乃至于整个青年时期贺都是文化的荒漠，每每想起这大好 年华却完全没有吸收到有竞争力的思想、思维方式、智慧，心里都隐隐 作痛。小学、初中、高中、大学那种教科书般的知识仅仅增加了些
    许竞争力,并没有给我极大的改变。


    后来我回忆我的童年与青年时期，骨子里仍旧是个幼稚得可笑的灵 魂。人的思想、文化，必须要受过专业的训练斋才会有竞争力。而农村 的孩子一般都是不可能受到专业的训练的。没有这种优质的社会教育，自然农村的孩子竞争力弱爆了。


    在一次偶然的机会中，我受到了一个大神级的人物点化，才渐渐明 白了学习的重要性。从此，疯狂的吸收社会知识，进而悟到了不顾一切 的追求自己的内心，才是生命的意义。我不甘于做一个普通人了。


    我从一个 IT 技术工发展到一个办公室管理人员，再跳到工程销售， 进而创业，都完全是追随自己内心的结果。这个过程中，放弃了很多东西，但得到的思想性的东西更是让人觉得难能可贵。每一次追随自己的内心，
    我感觉到我的思维都得到了极大的提升，知识也得到了一个极大的飞跃。 比起以前的'
  merge: -1
  img_proc: true
