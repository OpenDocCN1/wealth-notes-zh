  md: '# 21、收窄目标 9 定向狙击


    什么叫定位，就是你必须得清楚你到底要干啥，你的目标是什么，不可稀里糊涂的。不管是在做企业，还是人生当中，这个都非常重要，比如你要做互联网生意，或者你要做一个水果店，这都是定位。


    在你的一生中，你要做总经理，还是要做董事长，还是要做 IT 技术工，还是要做一个律师？这都叫定位。我们绝不可稀里糊涂的过一生，因为一辈子很短，做一回人也很难得。在做企业的过程中，定位的好处是多得不得了，我列举如下。


    第一，定位可以帮助你收窄客户的目标群体，你知道你要营销的对象是谁。卖给女人与男人的策略商业模式都是不一样的，研究的方向自然就不一样。


    第二 身当你定位清楚了你的目标客户群体后多就可以仔细研究你的用户了。因为目标清晰而具体多你也知道研究谁了。


    我们来看一个非常厉害的产品定位的案例，这个产品就是脑白金。脑白金的定位思路首先是老年人用的保健品。这个保健品只针对老年人，目标不是小孩，不是年轻人，这是第一次收窄目标。接下来第二次收窄目标，谁来买这个脑白金呢？送礼的人。第三次收窄目标紧跟跟上，孝敬爸妈脑白金。三次收窄后，几乎就确定了送礼人是儿女，用保健品的是爸妈，这就是典型'
  merge: -1
  img_proc: true
