  md: '总结一句，怎么让工积极干活？就是碰到任何问题了，摆到桌面 上，谁有能力谁解决！谁把问题解决了就给谁分钱，这样做，公司里没 人会抱怨。你抱怨说明你无能嘛。有没有发现，有点像曹操啊，有问题了，
