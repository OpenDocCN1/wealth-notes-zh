- pgno: 218
  md: '司开始盈利了，而且大赚几百万。按照这个趋势，第四年、第五年，明显会 上千万。可是问题来了，他给了一个人 40%的股份，而这个 人除了给他 50 万，根本就没来过他的公司，也没有付出任何心血，现在就要每年分这个人
    几百万。他心里面就很不爽，于是另外又开了一 个公司，打算把业务都弄到 新公司，老公司就不做了。那个没为公司花 心血的人知道了这个事，直接就 把他告上法庭了，弄得大家都很难看。


    其实，马云同志也是这么玩的，细节我就不说了。我就说怎么处理 这种情况吧，创业的过程中，钱是最不重要的，而几个愿意花心血的 人才是最重要的。如果你要钱，别投资给你钱的人股份，最多给提成或者
    这个钱是有一个上限的，提前签好协议，不可能你给了我 50 万，我就 给你打一辈子工，相当于卖身为奴了。我的意见是，只有完全投入到公 司里来参与运营的人， 才有资格分股份。


    2、团队必须有核心人物。我见过很多失败的创业团队，就在于谁也 不服谁。很多创业团队要么是同学，要么是同事，大家看起来本事都差 不多，所以就平分股份。很多公司做起来，然后就出问题了，要决策
    一个事情的时候，这几个人都非常自我，都要体现自己的存在感，都认 为自己很厉害。结果往往不是为了事业顺利发展而争论，而是为了权利 斗争。


    做企业必须要有一个头，一个核心人物，一个说了算的人。开始创 业的团队也必须独裁，独裁是效率最高的。商业就如同战争一样，大家 到战场上打仗，肯定有一个将军来指挥，大家都必须听这个将军的。若
    是谁也不服谁，'
