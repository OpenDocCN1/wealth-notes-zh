    # ## 3、怎么让员 1：与裨跟生魂与共乃


    怎么让员工与你“生死的与共”，把公司当成家？ 一共有五点：

    **第一点，让员工与你荣辱与共。**


    如何能做到呢？把他变成一根绳上的蚂蚱，就是你背叛我没有好下 场。


    比如，大家都看过《水浒传》，林冲要上梁山，先得拿个投名状， 这个投名

    状就是到山下随便杀个人，把人头拿上来，就算你落草为寇。


    大家做企业的时候，变通变通。也就是说，你需要与员工进行一个 捆绑，'
