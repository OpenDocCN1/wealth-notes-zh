  md: '# 18、伟大领袖毛泽东的军事思想精华


    伟大领袖毛泽东的军事思想，集中西方战略思想之大成。有三个人 对他影响最大：写《孙子兵法》的孙子、写《战争论》的克劳塞维茨和 战争之神拿破仑。《孙子兵法》他自然是烂熟于心，西方的军事思想他
    也刻苦学习，毛泽东曾在延安专门开过克劳塞维茨《战争论》的学习班。


    毛泽东的军事思想主要是三条：游击战、运动赢 人民战争。


    第一 9 游击战打得赢就打 9 打不赢就跑。这是典型的创业思想 9 就 是我们做任何个项目 9 都要量力而行。实力小，做小项目 5 实力大了， 才干大项目。这源自《孙子兵法》的“故用兵之法，十则围之
    9 五则攻 乙 倍则战之，敌则能分之，少则能逃之，不若则能避之。故小敌之坚， 大敌之擒也。” 也就是说，我有 10 万块，我只做 2 万块的生意。这样资 金充裕，心里踏实有信心，能够自由发挥。有些人创业，只有
    10 万块， 却借来 100 万身战战兢兢的做生意，心里不踏实，好大喜功，弄得自己 心力交瘁。只有极少数人能这样玩成企业家呀大部分人这样玩最后都会 惨兮兮的。


    毛泽东说的，“打得赢就打，打不赢就跑”，就是《孙子兵法》“少 则能逃之，不若则能避之”. 你若不跑，则“故小敌之坚，大敌之擒也”， 要被敌人消灭的。前面的“十则围之，五则攻之，倍则战之，敌则能分之”，是讲十倍于敌的兵力优势才能打包围战，五倍于敌的兵力优势可以打进
    攻城战，因为防守成本低，进攻成本高。两倍于敌的兵力优势可以对阵作战。 如果和'
