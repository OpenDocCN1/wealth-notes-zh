- pgno: 276
  md: '# 陈昌文方法之老板干法


    《孙子兵法》不仅招引了中华上下 2500 年想当将军的人去读，还有许多梦想著书立说的读书人也来当粉丝，所以《孙子兵法》保存至今，而《吴子兵法》仅剩 6 篇的原因，我想和其文采脱离不了关系。我读《孙子兵法》朗朗上口，而读《吴子兵法》总是有点拗口。所以，做广告、做文案罗一定要朗朗上口。'
