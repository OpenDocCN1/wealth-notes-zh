    要加上人工。这样下去，我会被这些客户搞破产的。后来我想根本不可 能做到人人都满意，我就调整了自己的经营方针呀谁给的钱多，谁是大 客户，我就做好服务；谁是小客户，谁给的钱少，我就稍微做点服务就
