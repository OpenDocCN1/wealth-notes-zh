    # 25.  只有立刻行动勇才能成功


    了解清楚你有什么资源，然后直接以此为资本，不用等什么条件成熟歹也不用问别人借钱，就以自己现在可以调动的资源, 直接开干。


    很多大老板， 都是几百块、几千块起家的， 经过几年的奋斗， 身价  几百万，甚至几千万、上亿的。创业,拼的不是你有什么关系，拼的不 是你借到了多少钱,拼的是智慧、动脑与勤奋。'
