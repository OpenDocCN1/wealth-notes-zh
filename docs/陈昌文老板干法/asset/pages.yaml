  md: '群里面有一只体格健壮的领头羊。如果你只是一头羊，可能会 你被称为所谓的领头羊，但是实际上你并不能真正领导一样群羊。只有牧 羊人才拥有这个能力。


    我们应该做领头雁，而不要做领头羊。按照我们通常的思维，领头 雁就是这群雁里的首领，它率领大家飞行。然而事实不是这样的，雁群 是一起起飞的，起飞的位置有前有后，大雁对空气的阻力，对它自身的
    体能，都会有很好的感知，所以一旦形成某种格局的话，一只大雁在前 面飞，后面就会紧接着跟随。它们会自行调节，使飞行过程当中空气 阻力最小，然后逐渐就排成了“人”字形。在飞行的过程当中，后面的
    大雁飞行是比较省力的。首先，它所处的位置空气阻力小，其次，有一 个回流会推动它。这些因素看起来非常微小，但是对于长途飞行的大雁 来说，能节省任何一点体力都非常重要，因为它们还有很长的路程要飞。


    领头雁是偶然产生的，起飞的时候，它飞到前头去了，并不是固定 某一只雁。不是固定的任命它就是头雁，领着大家飞。它飞到一定程度， 如果觉得体力不支了的话，会自动的放慢速度，后面的大雁就会替补上去，成为新的领头雁。简单的说，即领导力.能力是第一位的，第二位才是
    领导的职位。就是能够飞在前面，是因为你有这个能力.所以你成为 领头雁。当你没有能力的时候.就自己主动退下来。领头雁的位置不是 终身制的.它是靠自身的能力来决定的。但是领头羊就不是，领头羊一'
