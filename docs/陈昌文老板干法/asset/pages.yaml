- pgno: 137
  md: '第三，总觉得别人对不起自己，都是自己在吃亏，这纯粹是小心心态。


    第四，好面子，老是在大家面前伪装自己、装腔作势、不真实。没有人愿意跟虚伪的人做朋友，也没有人喜欢这样一个领导。有领导力的老板，必定是一个真性情的汉子。


    第五贸喜欢隐藏自己，不与团队成员交心，不放心把事情交给团队成员去做，就算给事情做，也不完全放权。如果你这样做罗团队成员没有成就感、没有存在感当然团队的战斗力就不强。


