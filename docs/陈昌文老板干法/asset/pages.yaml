- pgno: 171
  md: '利益捆绑、风险捆绑。企业要做成大家的平台，而不是你一个人的 平台，比如员工持股。


    当兵的为什么相互之间感情很好？一起扛过枪，一起下过乡，如此而已。


    # **第二点，让员工主动解决问题。**


    首先讲一个怎么拔出公司里的杂草。比如，有员工说 “碰到困难了，干不了” 的话。你可以把大家召集起来，问谁能解决这个问题，这个说困难的员工的工资就给谁，这个员工就辞掉，以后能解决这个问题的人解决这个员工的问题。比如，你们公司里给3000块钱工资一个人，请了两个保洁工人，感觉到保洁做得不好，你就可以说，谁能5000块钱把保洁做好，ok，100%
    H 需要一个人，这件事情就好了。


    不是人多就能做好事，而是人才才能做好事。你这样子设计制度，让大家都知道你的做法，只要有人干得不好，就有人主动来找你，说老板把他的工资给我，我保证干得漂亮，干不漂亮我工资都不要。ok,这样啥问题都解决了。


    当老板不是自己去干活，而是设计制度去调动别人来为自己解决问题。员工做事了，回报当场兑现，我们公司要是谁出了单子，我是秒资金到账支付宝的，根本不让员工等待，及时反馈给他，他就很兴奋，而且我们的提成非常高，我是分员工60%的利润这样一个比例。看似我赚得少，实际上我赚得最多，我在意无形的东西。发放提成要让所有员工都知道，这样会带动其他人努力。当然批评员工要私下里批评9这样他会认为你对他好。'
