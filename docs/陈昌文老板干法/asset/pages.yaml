  md: '# 1. 团队中的 4 种人


    一个团队里要管好的其实就四种人。


    第一种，千里马型。


    千里马需要的是草原，而不是草料。这样的人有能力干事，也愿意干事。


    这种人的需要的是授权  授权是什么意思呢？就是你当老板的要学会当这种人的下属，  支撑他做事，  看他表演就行了，  而不是去控制他， 去命令他。


    第二种，鸵鸟型员工。


    就是腿长， 跑得快，  但不跑，  把头埋到沙子里。  这样的人能干  但  不  干 。


    这样的人  就是需要不断的激励他，  给机会，  给平台，  罗天  天  给他  洗脑  打鸡  血，他才有动力！


    第三种  人罗不会  干 的，  不能  干 的。


    是猪一样的人， 打  着  不  走，  牵 他  留  他  就 满 地 打 滚 。  这 样 的 员 工 就 直 接 告 诉他，干了有什么好如  不干就  “杀”  了吃肉、开席。这样的人，


    直接给命令， 让他干活。'
  merge: -1
