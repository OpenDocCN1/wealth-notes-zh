  md: '精力集中在那少部分核心业务上面。我们把每天的工作依据轻重缓急排好优先次序，并且坚持这个次序，要事第一，重要的事情先做， 不重要的事情，就放一放，只有这样，才能提升企业的营业额。


    第5 9 老板要做的是战略决策 9 战术决策让团队里的其他人去做。 要认识到优秀的策略总是在不同意见中讨论出来的，做决定的时候没必 要下得很快，重要的决定甚至可以回家睡一觉再做决定。或者多开会讨
    论几次，快速的决策大多都会让你后悔。


    # 23、牛人没啥了不起 惟手熟尔


    你看到的每个牛人都没啥了不起 身唯一的区别就是他手比较熟练。


    怎么解释？我小的时候，初中语文课本里，有一篇课文叫《卖油翁》， 里面有个人叫陈康肃， 非常擅长射箭。一次，他在自己家里的园子里射箭， 有个卖油的老头放下挑着的担子，站在一旁，不以为然的看着他，
    久久 不离去。老头看到陈康肃射出 10 箭，9 箭都能射中，但老头脸上没有赞 叹之色，只不过微微点头而已。'
  merge: -1
  img_proc: true
- pgno: 158
  md: '陈康肃心理不爽，就问这个老头：“你也会射箭？我射箭的本领难道还不牛B吗？”老头说：“没有什么了不起的，只不过手熟练而已！”


    陈康肃非常生气的吼道：“就凭你个卖油的老头，也敢轻视我射箭的武艺？”老头说：“凭我倒油的经验就可以明白你没什么了不起的。”于是老头取过一个葫芦放在地上。然后拿出一枚外圆内方的铜钱盖在葫芦的口上，慢慢的用勺子把油倒进葫芦，油从铜钱中间的孔中注入进去，却不沾湿铜钱。


    老头说：“我这点本事也没啥了不起，惟手熟尔。”就是说仅仅是因为我天天练习的结果。陈康肃一下子就没底气了，他忽然发现自己擅长射箭并没有任何可以炫耀的地方，只好笑着把老头打发走。


    这个卖油翁的“惟手熟尔”，一直是我做企业、讲话、管理团队、经商的最高追求。其实，这个社会上混得好的人，有一门你非常羡慕的本领的人，你完全不用羡慕他，仅仅是因为他天天练习，自然就出水拏琴。


    很多人看不起老套路，看不起天天练习那些司空见惯的本领，这是一个误区。成为最顶尖的人物，就是因为这个人天天练习基本功，天才又是什么呢？就是基本功极其扎实的人，也就是惟手熟尔！只有手熟，才能保证射出10箭能中9箭。


    其实我们混社会，只需要练习一套东西，练到手熟，有的人瞧不起，说你只会一套，别理他，继续练你自己这一套。因为两套就不精了。不要看到别人的套路简单，你就是不会。你照着卖油翁那个样子去倒油，你就倒不进去。你照着刘翔的套路去跨栏，你就跑不了那么快。所以，我们每个人要练习自己的那个套路，并且练习得手熟。要想手熟那你一辈子只练一个套路。'
