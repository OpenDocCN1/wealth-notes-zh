  md: '陆昌文方法之老板干

    法


    这个大家可以根据自己的具体情况去设计。总体方针一定是员工拿大头，自己拿小头。


    总结一下：


    +   1、员工价值观必须单一化，就是生存、赚钱。


    +   2、调动起人的欲望 9 企业才能发展，员工才会拼命。如果员工没有 欲望，或者欲望多元化，你这个企业就没法发展了。同时，尽量安排员工做 自己最擅长的，调动他们自觉自发的奋斗精神。


    # 31、团队重于一 9 金钱等而次之


    有一个朋友咨询过我一个 问题，他说有人告诉他，不要长期持有一个企业，高峰期卖掉，上市或退出是最好的结果。一个人或团队很难永远都与时俱进，瓶颈迟早出现，而更重要的是：装在口袋里的才是钱！
    太多的投机者，都是这个态度在做事。


    企业或者项目出现增长乏力，行业出现衰退，出现瓶颈，可以考虑 换项目;人员能力不足，可以考虑物色优秀的人才；团队不能与时俱迸，可以考虑培训、进修、引进新的人才。整天想着公司不行了，团队成员
    不行了，惦'
