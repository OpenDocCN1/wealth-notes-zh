    树人。老板应该花时间、精力在那些优秀的员工身上，让优秀的员工更 优秀，创造的业绩更多。企业的利润本来就只来自 2% 的优秀员工。有 问题的员工，开除就行了。


    1、 员工每周都要交工作报告，并且写上工作成绩，不然就是对自己 的时间与金钱不尊重。公司毫无效率。不要去询问那些不优秀的人的意 见，他们的脑子本来就不好使，如何变得更优秀，你应该去问优秀的人，
    问有成绩的人。兼听则明，不是谁的意见建议都听。


    1、 对员工定出高标准。不要怕他们达不到，给他们一个目标，让他 们去攀登，取法乎上，得乎其中。取法乎中，得乎其下。他们若是做得 很好，并且达到了高标准呢，马上奖励他们。许多老板在业绩好的时候，
    说自己领导有方；业绩差的时候，就怪员工无能。这是非常愚蠢的性格， 不要抢下属的功劳。但也不能让你的员工有了成绩就躺在成绩单上玩耍， 你要不断地鼓励他'
