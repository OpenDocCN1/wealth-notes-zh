  md: '你把员工养成了在38度水温里生存的鱼. 外面的环境 都是20度，他出去没法活，只好回来。


    # 8、如何做企业内部培训


    1、 培训要针对现阶段企业发展要解决的具体问题而开展，不可为了 培训而培训，这样就是浪费企业资源与大家的时间，属于不务正业，明 显没有效果。


    2、 针对要解决的具体问题，要有系统的培训，员工不系统的学习是 不可能变得专业的。


    3、 用公司内部的业务骨干当培训老师，不要从外面请培训师，外面 的人根本解决不了你公司的具体问题。


    4、 培训是要持续做的，有条件的公司最好每周都做，别突击培训。 就是说心血来潮了就整体培训两周，这种培训很多公司都采用，实际上 是最没效果的。最有效的是每周培训两次，每次时间1小时。'
  merge: -1
  img_proc: true
