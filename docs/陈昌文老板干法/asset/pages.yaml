    # # 7、人生重要的三个核心


    人生有最重要的三个核心。


    +   - 第一 身体健康；


    +   - 第二 优越的知识系统；


    +   - 第三罗工作出色。


    你必须要健康的身体，你才能够有动力学习到优越的知识系统， 然后才能工作出色。当然也有身体不健康但也很出色的人，比如霍金，但我们不 特殊人物。


    一直以来，我都想努力成为这个社会的上层，不断超越社会的阶级 限制，挑战阶级固化。其实每个朝代在打江山的时候，虽然最危险，但 机会也最多，'
