- pgno: 203
  md: '质高。尊重是因为别人不敢不尊重你。凯撒说过，与其让别人爱你，不如让别人怕你。爱你尊重你多可以背叛你。而怕，是胜利者的终极武器。


    # ## 20、不要接受道歉 9 要逼迫对方解决问题


    做为老板，经常碰见员工犯了错，就跑过来讲，老板，我把什么什 么事情搞砸了；老板，对不起，我迟到了；老板，你要的文件我没写好， 对不起……通常，没有水平的老板就会说，算了，没写好，下次早点写
    好。或者问员工，到底是什么原因没写好啊？员工知道你要问他，把早 就准备好的答案回答给你，你听了，一般都是安慰一番，让他下次注意， 还觉得自己心胸宽广。


    比较温柔、有人情味的老板，通常是没有效率的老板，害人害己。 实际上，我们应该不接受任何道歉，应该迫迫他弥补你的错误，并且要 求他承担损失。迟到了，该罚款就罚款。任务没完成，该扣奖金就扣奖金，该扣工资就扣工资。他胆敢把公司的事情当儿戏，你就得让他尝尝厉害。
    下次他就老实了，他再不老实，你就开除他，选更加优秀的人上。只有这样，才能培养人的责任心。世界五百强绝对不玩儿戏，你胆敢犯错，要你肉疼。'
  merge: -1
  img_proc: true
- pgno: 204
  md: '我以前经常讲一个故事。有一个女人被一个邻居的男人强奸了。这个女 人本来要报警的，但是这个男人的老婆和这个男人就不停的道歉，说不要报 警，我们上有老，下有小，你要是报警了，我们一家人怎么过啊。我们一家
    人给你做牛做马都可以。这个女人心一软，就接受了道歉。开始的时候，这 男人的老婆和这个男人对这个被强奸而不报警的女人感恩 戴德。过了半年， 事情急转直下，变成了这个被强奸的女人勾引她老公了。而且施害者还到处
    宣传这个被强奸的女人是婊子。这个被强奸的女人受 不了这个冤枉与委屈， 但是报警已经过了取证时间，只得默默承受迫害。最后卖房撤离了这个小区。


    我们如果经常接受别人的道歉，后果就是自己的生存空间越来越小，自 己的利益受到侵害 9 把自己辛辛苦苦建立起来的资源免费赠送给他人，而且 是赠送给不尊重自己的人。所以：不要接受道歉，要逼迫对方解决
    问题，承 担错误造成的损失。


    # 2L 保护与培养团队里唱反调的人


    我有一个朋友刚开始创业，就跑过来跟我说“多年媳妇熬成婆了，老子 再也不用看谁的脸色唯唯诺诺的工作了。我想怎么干就怎么干，大 家都得听 我的！”我当时就甩了他一句，保护你团队里跟你唱反调的人。
    结果他可能 刚当老板，非常兴奋，没当回事，这做老板的尊严仅仅持续 了半年，就又去 给人打工了。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '当然唱反调的目的是为了公司的业务，这是前提，在战术层面，涉及到业务具体怎么开展等，有人出来唱反调是好事。因为你作为公司的创始人，就算你再聪明，也不可能完全了解项目，完全了解市场。他在一线操作，你如果没在一线操作，你就很难了解具体情况。自己做的决定需要一线操作人员的意见，也要慎重听取反对意见。是人都会有盲点，而这些唱反调的人会帮你进一步分析出你忽略的地方。


    由于中国文化的影响，我们中国人总是好面子，而且非常含蓄。很多事情你需要问几次，对方才能告诉你真正的原因，加上你是上级，非常多的人就唯唯诺诺的，即使有意见，也习惯性的保留。这对企业是非常不利的。


    国外的学者曾经做过一个实验，让一个人进入有五个托的团队。六个人一起丈量一根短一点的绳子，一根稍微长一点的绳子，然后这五个托就说短的那根实际上长一点，结果受实验的四分之三的人都接受了这个错误的答案而只有四分之一的人坚持真理，反对这5个托。可见真正唱反调的人是多么的宝贵。中国自古就有兼听则明，偏信则暗的说法。历史上很多昏君就是拒绝他的臣子们唱反调导致大好江山被推翻的悲剧。而那些明君，甚至非常喜欢听到反对的意见。并且，这些老提反对意见的人是公司里的积极思考者他们在想问题身所以才有反对意见提。能提反对意见证明对公司的事情非常用心。


    真正在商场上拼杀的话，需要的就是这样的人，这也是领袖才能的表现，'
  merge: -1
  img_proc: true
- pgno: 206
  md: '你甚至可以培养这样的人来做领导者，而大部分不提反对意见的人都是跟随者。


    我们做生意，追求的是市场的客观、真相、事实。这种喜欢提反对意见的人身就是帮我们进一步分析出市场真相。事实的人9真是可遇不可求。


    所以希望老板们有保护与培养团队里唱反调的人的习惯，只要他说得对，说得有理，是为公司整体业务着想的，就值得表扬，值得提拔。千万不要为了自己的面子、权威感，排斥唱反调的人」'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 22、老板用人 9 看人品和态度


    做招聘时间长了，我渐渐从最开始的看一个人的能力到看一个人的 人品与发展潜力了。只要这个人的人品好，有潜力，对其工作能力的要 求是基本能及格就行。每个人都想要权与钱，但有些人到公司里来心术
    不正，上窜下跳、拉帮结派、两面三刀、玩弄权术、巧言令色，这样的 人可能能力比较强，善于迷惑人。这样的人还是敬而远之比较好，是切 不可以成为朋友或合作伙伴的。一旦他得到重用了，干起坏事来,破坏
    力也是极大的。


    其次是做人做事的态度，愿意不愿意服从老板的指挥。我碰过这一 女性求职者，简历上看以前工作都蛮辉煌的，可嘴里说不接受加班，也 不接受出差，你与她商量什么，她总是一副必须按照她的规则来的态度。
    这样的人就算能力再强也不要招聘到公司里来。因为公司就是大家相互 配合，甚至是相互妥协才能出成绩的地方。能力是可以在工作中锻炼的， 而态度的修养则是她爸妈的事。


    中国的私营企业不同于国企，也不同于外企金朝九晚五，双休也能 做大做强。小老百姓创业，没有爹爹，玩的是丛林法则。全靠自己赤手 空拳到市'
  merge: -1
  img_proc: true
- pgno: 208
  md: '场上去拼杀贸怎么可以在企业里养娇生惯养的員工呢？所以我 们看人不要只看表面的形象怎么样，也不要只看他过去的工作经历，甚 至 只看他的能力，而是要看他做人做事的态度。


    记住，能力只是基础，只要招聘进公司，他能基本胜任就行。我们 要的是他的人品好，态度好，．他自然有发展潜力。有些人自以为能力很强、 水平很高，反而比较难以与人配合。


    人不可能是全能型的劳在合作中始终要把人品和态度放在更重要的 位置。发挥团队的力量，才能走得更远。以德为先、德才兼备多不仅是 选用人才的标准势也是选择朋友或者合作伙伴的标准。选择同行者或是
    同路人. 我们要坚持自己的标准多决不要协身否则选错了代价更大。


    # 23. 可靠比能力更重要


    我有次讲课，有个学员问了这样一个问题:如果刘备有一天遇到了刘备温，觉得诸葛亮不行了，怎么样能忍心换掉诸葛亮呢?诸葛亮要是'
  merge: -1
  img_proc: true
- pgno: 209
  md: '其实很多老板都有这个问题，就是跟自己打江山的人感觉没有自己新招聘进来的人聪明，有能力，有想换掉老人的冲动，但又不忍心，觉得老人跟着自己不容易。我的回答是：老人既然跟你打了江山，从贫寒的时候干起来的，就说明这个人很可靠，也有一定的能力。而新人，就算有能力，可靠性方面也要打一个问号。


    风险投资界有一句话：保住本金永远比挣钱更重要。就是你要保证不亏 9 才算高手。保证不亏，就意味著立于不败之地。


    所以，我的态度很明显，用老人 用靠谱的人。新人就算很有本事，也是用其能力，先给老人做副手。只有经过风风雨雨的考验了，才重用，才彻底交心。


    小时候喜欢看三国，我们看曹操曹老板是怎么做的？几乎人人都知道，在武将之中能力最强的就是吕布，俗话说：人中吕布，马中赤兔。但是后来被称为武圣的并不是吕布，而是关羽。因为关羽具备了两个身为武将最重要的品质“忠”和“义”，吕布则是个三姓家奴，谁势力大就投靠谁。同样都被曹操抓住了，吕布原本还想找机会求结，结果刘备说了一句“君不见丁原、董卓之事乎？”于是曹操就把吕布给咔嚓了。关羽投降之后，曹操对他大力投资，关羽也是知恩图报，先是斩颜良诛文丑，解白马之围，后又华容道放了曹操。曹操的投资有了很大的回报。如果曹操是个投资人，那他肯定是个顶级
    PE，因为他懂得看人。


    其实曹操的选择就是，可靠比能力更重要，关羽是可靠之人，而吕布不可靠。所以，吕布不会受到重用，也不敢重用吕布。'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# ## 24、这样的人应不应该留


    我们以前有一个业务部门，一个业务经理管理 10 个业务员。其中有两个业务员业务做得最好，但是这两个做得最好的业务员跟大家的关系不太好。关系不好的原因是其他同事看来这两个人不合群，老是抢他们的生意、客户，造成了他们的业绩不好。但是在这两个业务做得好的人看来，是因为别人不像他们那么努力才导致业绩不好的，客户也是
    主 动找他们的，业绩不好的业务员嫉妒他们。


    主管业务的经理就建议，把这两个不合群但业绩好的人开除，以便重新建立部门的内部和谐。这种情况其实在很多公司都有出现。经过我的了解和调查，这两个人的品行首先是没有问题的，他们也确实比任何人都拼命，那么？正确的处理方法一定不是开除这两个业绩好的人，而是要留下他们并且重用，敲打那些业绩不好的人。一个有能力的人总是不合群的，企业的目的是做好业务盈利多而不是大家在一起谈情说爱。我曾经见有的老板糊涂，居然开除了业务做得好的人，结果没过多久，企业的业绩就开始下滑，最后企业就倒闭了。


    如果大家喜欢读历史，就会发现一些厉害的人物，比如刘邦、李世民，都会用一些很能帮自己打仗，但自己并不喜欢的或者大家不喜欢的人物。因为刘邦、李世民非常清楚，我们要的不是内部和谐，要的是最终的胜利。要的不是自己开心，要的是国家安定。所以刘邦封了他讨厌的雍齿为侯，李世民'
  merge: -1
  img_proc: true
- pgno: 211
  md: '用了让他屡次不爽的魏征。


    所以，正确的处理方式一定是顾全大局，不要不分青红皂白的否定 他们的能力，企业的大局就是盈利，就是赚钱。所以身必留下业绩好 的拼命三郎。而不是追求什么内部和谐。


    # 25、到底哪些人才是企业稳定的基石


    我们应该如何定义人才？


    我们刚创业的时候，自己没什么资源，就有小伙伴愿意跟着自己 一起创业。一没技术，二没经验，三没钱，但依然有人不离不弃的跟着 开始了为期三年的艰苦奋斗，分文未取，自己还倒贴了很多钱。在这个
    过程中，我与很多大学生相处，很多高材生相处歹他们都不能坚持奋斗， 不能吃这个苦。


    仓I业者一定要区别出来，会一门技术的人只是一个匠人而已，并不 能升级为企业的人才，或者是企业的核心。人才，是一种具备人文精神 的人。很多高学历、高技术的人，并非人才，只是一个好用的工具。企
    业当然需要好用的工具，但企业的内核必须是受得了创业之苦的人。'
  merge: -1
  img_proc: true
- pgno: 212
  md: '我能肯定的是，我的创业元老就算在企业忽然一无所有的情况下，我们聚集在一起，依旧可以干一个企业起来。我只知道，我拥有一帮留学生、硕士、博士，三天不发工资，他们就说得离我而去。他们肯定不是企业稳定的基石。


    对于我来说贺就是创业初期的伙伴最重要。他们开疆拓土，是企业发展的推动者与见证者。把钱交给他们，无论多少，都不用打借条，放心得很。就算他们把钱账算错了歹我看一看，也就当个笑话了。无所谓
    的。


    阿里巴巴的那些创业合伙人都是名校毕业的吗？其实基本不是罗阿里巴 巴说，当初是因为招聘不到人了，随便拉些不优秀的人昌这些不优秀的人因为找不到其他工作歹只好在阿里巴巴干下去。结果在解决问题的过程中，都
    变成了企业的中坚力量。这些看似平凡的人，他们不好高鹭远，而是踏踏实实的把一份工作干好。他们才是企业稳定的基石，绝非什么高材生，懂什么技术的人。


    老板如果不能理解什么样的人才是真正重要的人，那么具备这种人文精神、具备创业必将成功信仰的平凡人就会离你而去。而留下来的，就仅仅是些高学历、高技术，你认为是人才的人，但其实，他们仅仅是好用的工具。当市场好、顺风顺水的时候，你有好工具当然也能活得很滋润。当市场行情差的时候，如果你没有真正重要的人在你身边，那么恭喜你，你的企业立马完蛋了。这就是为什么很多企业在市场下行的时候，瞬间倒闭的原因。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '所以，必须要重视跟自己一起吃过苦的人，无论他的背景有多糟糕。“苟富贵，勿相忘！”


    # 26、以客户利益为核心驱动员工


    从企业活下去的根本来看，企业要有利润，但利润只能从客户那里来。企业的生存本身是靠满足客户的需求，提供客户所需的产品和服务并获 得合理的回报来支撑。员工是要给工资的，股东是要给回报的，天底下
    唯一给企业钱的，只有客户。我们不为客户服务，还能为谁服务？客户 是我们生存的唯一理由。既然决定企业生死存亡的是客户，提供企业生 存价值的是客户，企业就必须为客户服务。因此，企业发展之魂是客户
    需求，而不是某个企业领袖。


    爱客户、爱公司、爱自己的家人。我对自己亲人的爱，还是胜过 对一般员工的爱。这才是实事求是，实事求是是有凝聚力。一个老板， 喜欢讲空洞的话，讲得好听是不行的，实际上每个人都是明白人，都不
    会跟你交心的。因为你根本没跟员工交心。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '公司一方面必须使员工的目标远大化，使员工感到他的奋斗与祖国 的前途、民族的命运是联系在一起的，这样有助于吸引天才型的人才， 这种人才是为了使命而奋斗的；另一方面，大部分人都是普通人，所以
    公司坚决反对空洞的思想。培养员工从小事开始关心他人。平时关心同事？以及周围有困难的人，修养自己。能做到这几点，已经很不容易了。


    只有有良好的个人修养，才会关心祖国的前途；为国家，也为自己 和亲人，这是两部发动机，我们要让他们都发动起来。实事求是，合乎 现阶段人们的思想水平。客观上实现了为国家，为人民服务。


    为客户服务是企业生存的唯一理由。公司唯有一条道路能生存下来：就是客户的利益最大化。比如现在互联网界的免费模式，实际上都是客 户利益最大化的结果。360免费杀毒软件之所以击败了收费的金山毒霸、
    瑞星杀毒等公司，就是因为客户利益最大化的力量。互联网上的很多生意都是先做到完全免费，再寻找盈利模式。


    有的公司是 为股东服务，股东利益最大化，看看很多公司的崩溃说 明这条口号未 来就是对的；还有人提出员工利益最大化，但现在日本公 司已经有好多年没有涨工资的了。因此我们要为客户利益最大化奋斗，
    质量好、服务好、价格最低，那么客户利益就最大化了。客户利益大了， 他有更多的钱就会再买公司的产品与服务，我们也 就活下来了。这个当 中有一个诀窍，就是你要保证你有合理的利润。也不是说为了客户，我
    们就不挣钱了。不挣钱，我们就活不下去。'
