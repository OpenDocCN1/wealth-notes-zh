  md: '# 13、当老板要习惯性送礼字领悟送礼的艺术


    送礼是一种习惯，当老板要习惯性送礼。只要我去任何一个朋友，或是同行，或是陌生人家里玩，或者到别人公司玩，我都会送礼。淘宝上买些小玩具、字画、古玩、洋娃娃，很便宜。准备了一大堆，只要出去就根据对方特征，都会带上一份礼物。


    比如，别人叫我出去喝酒，如果这个人对 我有用，我就会答应他。出去喝酒，顺便问问有几个人、儿男儿女，然后我就会准备好几个礼物，带过去。大家拿到我的礼物了，酒桌上自然都会敬我酒。我会自然而然的成为焦点。而且我跟大家的关系会变得越来越好，不管是员工，还是朋友的家人。送礼能让别人记住你，这样很多事情就会变得很好办了。


    中国是个关系型社会，经营好关系，沟通起来就很有效率，障碍就少一些。送礼要轻描淡写的送，不可把你送的这个礼表现得很贵重的样子，这样多别人就有心理压力了。有了心理压力多别人就不愿意接受多甚至不愿意跟你玩了。


    比如几年前有个刚大学毕业的小女生想跟我做网络。她送了我个不到200块钱的礼物，然后不停的说，我生活很困难，没啥钱了，花了一个月工资给你送了一个礼物，你教教我我怎么在网上赚3W块
    我一个月，我赚到钱了再送你好东西。我一听就头大，只想赶紧把礼物还她或者拿钱买下来，心理就想：“你赶快拿走！”嘴上就说：“我也做不到，你还是找个工作做吧，别东西想的了！”
    这样的人，我都不想见到第二次。为什么？因为她给人的心理压力、情感压力实在是太大了。我接受了她这个礼物，得教会她月入3万块，'
  merge: -1
  img_proc: true
- pgno: 75
  md: '要是做不到，这种人都般都会对我破 口大骂，还是不愿意好。


    所以，我们将心比心，当我们送礼给别人的时候，一定要轻描淡写，不要给别人心理压力。


    这说明一个什么问题呢？我们佛经里面讲“无住生心，无相布施。”就是给别人东西的时候，不要给别人心理压力，这样别人才容易接受，施恩不图报。这样人家可能会发自内心的帮你。而你有所求，别人躲你
    都来不及。但是，你虽然轻描淡写的送礼，中国人都讲究礼尚往来，以 后你有什么要他帮忙的，其实他都非常乐意，你用了 一个很小很小的成本，交换了一个愿意帮你的后备人员害是非常划得来的事情。


    以前有一个寺庙里面的故事。说一个人跟老婆离婚了，放弃一切就 去当了个和尚。这个和尚呢，就给方丈当助手。经常有些大财主送方丈 些宝贝，送些红包。这个和尚是连拆封都不拆，直接就收起来给方丈了。后来其他和尚就对这个助理和尚说：“你拿一点嘛，反正那么多好东西，方丈也用不完！”这和尚说：“我要这些有什么用呢？我人都是寺庙的
    To”后来方丈亲自试探他，找人给了这个和尚几块金子，看这个和尚 要不要！结果呢，这个和尚仍然是包装都没拆封，就给方丈了。后来，老方丈不行了，左思右想，还是觉得这个助理和尚最靠谱，不会剥削大家。就直接把衣钵传给了这个助理和尚。其他的和尚也放心这个助理和尚当
    方丈，整个寺庙都是他的了。


    无所求，反而获得了最多的东西。当然我们是生意人，无利不起早，但是呢，我们表面上必须做到滴水不漏。'
