  md: '# 24、创业的三个方向


    现在有三个主流的创业方向。


    第一，解决已有的需求。


    这是大多数普通人能够看到的，也是最简单的创业。比如，发现妇 女希望在做饭和清洁上少花费一些时间，就导致了现代的洗衣机、烘干机、 洗碗机、微波炉的诞生。有人需要英语培训，你就去创办一个英语培训
    机构。有人需要吃饭，你就去开个餐馆，炒菜做饭。这就属于直接进入 红海拼杀。大多数的创业都是这样，满足一个已有的需求。这些创业 拼体力多些，竞争激烈，也会很累，利润微薄。


    第二发现悄然兴起的或者是潜在需求。


    这是需要有点心思的人才能发现的。比如微博、微信、小视频自媒 体创业，都有很多人成功了。再比如，许多地方的水质发生恶化，娃哈 哈、乐百氏等公司遇见到了一个正在兴起的瓶装水市场。这种创业呢，
    比第一种风险更大，最怕的是早入场，成了炮灰，或者是错误的认为会 形成这样一个市场，而根本没形成，浪费为了为数不多的创业资金与时间。'
