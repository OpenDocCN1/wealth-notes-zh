  md: '# **25、创业的两种常用套路**


    创业有两个套路。


    第一个套路，普通人玩的套路。是先做好一件力所能及的小事，然 后在这件小事周围画同心圆身扩大一圈罗把扩大一圈的事情做好 9 然后 再扩大一圈，又把进一步扩大的事情做好。


    最开始的时候呢，你要仔细估量自己的能力、资源。看到底能做好 一件什么样的小事。用这个套路来创业，只要不急功近利，稳扎稳打， 一般都能取得成功。而且如果你勤勤恳恳的干下去，随着时间的流逝，
    你也可能干出一个商业帝国来。实际上我们这个社会很多企业家都是按 这个套路来干的。


    第二个套路是属于大人物或者说谋略家⁹ 战略家玩的套路。


    从一开始，就计划好了要干一件大事，设计好用 5 年甚至 10 年来拼搏。


    比如马云干电子商务，就是典型的这个套路。一开始就设计好了非得玩 这个，


    拿了风险投资，花 10 几年来把这件事情实现。这个套路一开始就 是个巨大的


    圈子。今年画一截，明年再画一截，后年再画一截。花了 10 多年，终于画了


    个牛叉的圈子，就是阿里巴巴、淘宝网。


    拿风投的很多企业属于这个套路，先设计一个巨大的饼，然后一年 一年


    通过烧钱来实现这个巨大的饼。


    这第二种套路呢，是聪明人玩的，需要有预见未来的能力，对一个 人的


    战略能力、趋势把控能力、耐心和毅力都是极大的考验，真正强者 的游戏。


    成功了就是典型的 “十年寒窗无人问，一朝成名天下知！ ”'
