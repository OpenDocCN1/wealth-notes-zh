    苹果公司的乔布斯，也是这种层次的创业，在功能机大行其道的时候，乔布斯创新式的推出了智能机，以后就一直是智能机的领导者，打败了雄踞手机市场霸占 **10**
    几年的诺基亚，成为了全球市值最高的公司。


    这种创业收益当然是相当大，但对人的素质要求是极高的，所以不推荐初级选手玩这种层次的创业。初级选手选悄然兴起的行业与发现潜需求的创业是最好的，也最容易成功。'
