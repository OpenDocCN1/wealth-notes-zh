    这个世界上只有智慧最值钱，混社会的智慧。如果你还没有钱，你就要 拿你可怜的那点钱去换这个智慧。如此简单的道理，能有几个人能看破呢， 能做到呢！


    老板永远要思考一个问题，就是别人为什么愿意跟你混，其实这都是智 慧问题，别人为什么要主动工作？而不是你去管理他，强制他。我通过分 权，分利益，分名，能分出去的尽量分出去。让有能力的的人都满意。领导者
    是必须让人主动跟随的人，而不是强行让别人听话的人。


