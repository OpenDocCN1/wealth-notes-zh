  md: '# 29、管理有四重境界


    最高境界：看清楚每一个人本来的特长、优势，按照每个人的特长、优势来分配工作，使他的特长符合企业的发展。其实，我们在招聘的时候，就要选好相应特长的人来做我们相应的岗位，优秀的企业就是这样做的。


    差一点的境界：用利益诱惑员工。比如我们骑在驴子背上，驴子不 走，我们拿个竹竿，前面吊一个红萝卜。驴子要吃红萝卜，永远向前跑。 给他一个目标，把利益摆在他面前。这就是用梦想的艺术来管理团队，
    管理企业。很多伟大的企业实际上也是这种模式。


    第三等境界：洗脑员工。比如我们企业旁边有做金融的公司，每天 早上还喊口号，企业里还实行军事化管理，这种管理呢，是越管理越不 好。是笨蛋老板玩的套路，大部分企业老板都喜欢这种玩法。这种玩法，
    企业必然是一个普普通通的企业，没有什么发展前途。优秀的人才是向 往自由的，就算在这种企业里，也是会迅速跑掉的。


    第四等境界：叫与民争利。老是算计员工，用罚款等来管理员工，员工业绩好点，多挣些，老板就把他的提成调低一点。这样的管理模式 叫自取灭亡。'
