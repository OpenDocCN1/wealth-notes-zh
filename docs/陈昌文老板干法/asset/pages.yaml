  md: '要学会做老板。老板本来就是一个老师。毛伟人、孔子、释迦牟尼、耶稣、马云、任正非、俞敏洪都是伟大的老师。一个园丁不断的施肥与洒水，偶尔除草，细心呵护你的花园，自然会看到满园花开，没什么好急的。很多老板之所以失败，就是太急切了，一段时间没成绩，就坚持不下去了，就开始自我怀疑了。


    要给员工一个梦想，让员工去拥抱它、实践它。有梦想的员工是快乐的。尽量不开除人，让大家有家的感觉，有真情的人跟着我们走，就能成就大事业。但实在无真情、只知道混工资的员工，我们也没办法，必须放弃。


    给员工描绘梦想不可用术语，不能含糊，目标不能模糊不清，必须具体、鲜明。梦想要刻在员工脑袋里，你随时随地找个员工来问，我们共同的梦想与目标是什么？你的员工都能回答出来的话，你就算是一个合格的描述梦想的老板。


    # 10、如何对待员工


    如何对待员工？这是一个沉重的话题，我来分享一下我对待员工的经验。不愿意给优秀的员工分钱是对公司利润的最大浪费。因为他们不会尽力。奴隶不要钱？但奴隶的效率最低。奴隶主发现了不给钱效率最低，所以'
