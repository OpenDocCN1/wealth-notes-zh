- pgno: 253
  md: '都商量着来呢，很多事情讨论半天也没个结果，有了结果，这种结果好像是大家相互妥协的结果，并不是解决问题的最好方案，而且影响决策效率。企业目的不是为了让大家高兴的，而是为了做好事情、生存、赚钱。


    很多创始人开始总是想设计一个好的管理架构，觉得自己一个人决 定事情不太好，什么事情都需要拿出来讨论，问大家的意见，而往往大 家的意见都很难统一，结果是实行民主的人会发现，他自己认为好的解
    决方案几乎不能实行。


    那么，大家在创业初期不会有非常多的资源与人脉，甚至连像样的 技术都没有，但是为什么要创业呢？说白了还是自己有一定的雄心壮志。 既然你拉扯了一个团队或者有有几个合伙人的话，事实证明你是最有能力
    的，否则别人在你一无所有的时候，为什么要跟你创业？况且小企业本 来就招不来什么牛人，都是一些非常普通的伙伴。这个时候，你可以问 问自己，我们既不谦虚，也不骄傲，这个团队里最有能力的人是谁？恐
    怕最后的答案还是你自己吧？所以我认为，初创企业开始就应该由你拍 板，也就是选择独裁。


    独裁实际上是非常有效率的政治制度，而初创企业的重心是业务， 怎么能拉到业务怎么来，怎么能增加现金怎么来。开始的时候，本来就 需要一个强有力的领导来带领团队，你完全不需要有心理压力。


    如果大家喜欢读历史，会发现打江山的时候，一定是独裁统治最有 效率最容易获得成功。而团队里采用民主讨论的往往是公说公有理， 婆说婆有理，光顾着玩政治斗争了，不做业务了。在初创企业中，一定
    要避免这种倾向。本来开始创业的时候，资源有限，精力有限，更加要 养成劲往一处使的习惯。'
