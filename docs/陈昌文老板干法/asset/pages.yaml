  md: '的定向狙击，只做非常狭窄的市场，目标清晰，奠定了基础的成功。


    市面上有很多保健品，但是都不怎么出名，为什么呢？这些保健品都稀里糊涂的，好像谁都可以买来吃一样。没有个特别的地方，就会显得可有可无。当然就很难引起消费者的注意。


    格力空调，这样的名字实际上就是把格力完全定位在空调上，这就非常好，只要一提炼格力，大家就想起空调，清晰的目标力让大家记住了它。再举一个例子，汽车沃尔沃，就是定位安全。所以买小汽车的人只要想到安全就必然是沃尔沃。这就是定位的威力。


    营销的本质，就是在消费者头脑中的战争。赫必须要在消费者头脑中留下痕迹，务所以你必须收窄你的目标，清晰的告诉消费者你是干啥的身千万不要给消费者模糊的印象。因为现代社会物责丰富不能清晰明了定位一个概念给消费者多，消费者很快就会把你给忘记。如果你清晰的


    定位一个概念在消费者脑子里，消费者想起这个概念就能想起你，那么你就成功了。


    第三，我们收窄目标后，就知道了具体要卖一个什么产品给用户，其他的跟我们主目标不相关的产品或服务，能砍掉就砍掉。少则得，多则惑，凡专精于艺，必有动人处。其实这也是毛主席的：“集中优势兵力，打开灭战。”“伤敌人十指，不如断敌人一个指头！”的策略。'
