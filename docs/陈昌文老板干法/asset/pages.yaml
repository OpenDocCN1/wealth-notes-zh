  md: '**作为一个老板，最忌讳自己在那里证明自己比下属聪明，比下属正确。** 有的人有一个习惯，喜欢不断地给自己锦上添花，证明自己的光辉形象，这样，时间长了，员工就不想问题了，什么事情都交给你决定，自己不
    开动脑筋做事了。本来你这个公司是有很多聪明的脑袋的，结果，由于 你经常证明自己比下属聪明，大家慢慢都变成了行尸走肉，没有思考力， 你就会很累。


    我在公司里的政策是，我基本就是定个方向，战术问题都必须大家 去思考，如果有人问我比如推广问题怎么做，我一般都是说自己不懂， 然后夸奖员工一番，说他很聪明，一定可以完美的解决这个问题。一般，
    这个员工听了就美滋滋的，就会努力的去解决这个问题。我就是通过这 种拍马屁的手法，把每个团队成员都变成某一方面 的精英的。也就是说， 你想让员工向什么方向发展，你就向那个方向拍他。


    老板必须学会示弱多团队成员才会示弱多笨蛋老板是在员工面前示弱，结果团队成员只好示弱，所有的重担都落到老板一个人肩上。事业小 的时候，可行，当事业稍放大点，老板就马上遇到发展瓶颈了，因为你平
    常就没培养人才嘛。


    真正厉害的人，是永远看到别人优点的人，然后夸奖别人的优点。被夸的人就很高兴会不断的去注意他 自己的优点，打磨他的优点。最 后还乐意为你所用，而且你的人际关系也会变得很好。而笨蛋呢？老是
    看到别人的缺点，甚至要求别人改正缺点，这样，没有谁愿意接触你。 看到别人优点的人，就容 易形成用人所长的习惯；看到别人缺点的人，就容易对人苛刻，感到无人可'
