    # 《孙子兵浩》核心思想对志板的喝示


    《孙子兵法》有四条核心思想。


    第一，《孙子兵法》不是讲以弱胜强的，而是讲以强胜弱的。《孙子兵法》讲，有把握了再出手，不要拿国家、民族的命运，去赌小概率事件，也就是以弱胜强。


    老板也应该这样，要做自己能力范围内的事，做自己能搞得定的事，慢慢的实力增加了，自己就可以去做对应实力的事情了，这样自己的信心也会增加，企业也没什么风险。如果养成了以弱胜强的性格，就算一时得手，也不可能每次都得手，迟早是要倒霉的。


    第二9凡事要计算代价9不要光想着赢9要算账9值不值得打。杀敌一万，'
