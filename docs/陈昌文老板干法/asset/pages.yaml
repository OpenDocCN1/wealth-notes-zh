  md: '而不是自己越干越累，让员工闲着。


    # ## 2、不要要求员工有忠诚度


    商业的本质就是交易9而别人愿意付钱给你'' 明显是你创造了他想 要的价值。如果你没有创造他想要的价值，他是不可能对你有任何忠诚度、 任何感情的。有的老板喜欢谈忠诚，不管是对员工还是对客户，都纯属
    逻辑思维混乱。


    与其说商业上有“忠诚度”，不如说交易上要有“诚信度”。你别 欺骗顾客，顾客下次需要这个东西了，他的选择成本就低，因为他不知 道其他商人是不是会骗人。


    人为什么会看不清楚真理，就是因为太贪心了，想占别人便宜，就 会把自己的双眼蒙蔽上。做为老板，在企业里我们是为员工服务的，只 有让员工有了发展，能学到新东西，能赚到钱，员工才会拼命。有的老
    板企图通过会议，通过不断的搞感恩的心这些培训来让员工少拿钱，还 多干活，这样干的老板，经常是偷鸡不成蚀把米。我们真正应该做的是， 直接给员工一定比例的金钱分配。这个比例要远远高于同行，整个同行
    的优秀人才都会跑你这里'
