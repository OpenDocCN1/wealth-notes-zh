  md: '最后大家会拼个全行业亏损，这种事在中国经常发生。其实，滴滴打车 与快的打车就属于这种只玩点战术的玩家，大家都亏损，不过现在他们 合并了。


    如果老沃尔顿也是这种只知道玩点战术的人，那么也就没有今天的 沃尔玛了，老沃尔顿的厉害之处在于，把低价玩成了战略。


    如果你理解了这点，你就能理解为什么老沃尔顿连住旅馆都住最便 宜的，却肯放上亿美元的卫星。放卫星的目的是为了配合公司的物流系 统，最终造成 “更低的价格” 这一步，竞争对手就一时半会儿看不懂老
    沃尔顿想干啥，就算看懂了，也犹犹豫豫不敢跟进，毕竟放一颗卫星呢。 这就是发现一个有用的战术后，让每个环节都去配合这一个优秀的战术， 慢慢的就形成了“链条式的调整与磨合”，这一步挺难的，考验的是你
    的运营能力。


