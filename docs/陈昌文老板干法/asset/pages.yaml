    业，甚至是最核心的金融领域都被民企企身比如支付宝、财付通等金融产 品抢占了很多市场，就是因为这些国企反应太慢、调整自己的政策太慢。 布来邮局是鐵道的龙头老大.屑于反应慢.缓民营销课这公司抢占了南场。


