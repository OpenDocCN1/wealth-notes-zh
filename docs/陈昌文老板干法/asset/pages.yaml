- pgno: 219
  md: '都想按照自己的想法来打，那么这场战争还没开始，就已经失败了。


    所以，在分配股份的时候，创始人必须要拥有绝对多数，要能左右团队的方向，要有一票否决权，如果有人不服气，就请他离开。乌合之众是干不了大事的。一个团队没有核心，就如同银河系没有太阳一样，不可想象。


    3、要性格互补，业务能力互补。比如你做为创始人，擅长营销，那你得找一个擅长做产品的。你擅长财务，那你得找个擅长做事的。不能都只会人事，或者只会做产品，那么这个团队结构就不健康。团队人才要具有多样性，鸡鸣狗盗之徒，也能派上用场的。


    性格也最好互补，你是个急性子，就得找个慢性子。你是个抹不开面子的人，是个老好人，就得找个人来做“恶人”，有些话你不喜欢开口，就得找别人来开口。


    4、创业团队能拿股份的人必须是任务角色。什么叫任务角色呢？这是与职业经理人的岗位角色区分开来的。职业经理人有一个毛病，不是自己的事，就算对公司非常重要，他也不过。我们公司就有这样的人，我让她帮我业务方面的忙，她就会找借口，不愿意做，这样的人肯定是不能做合伙人的。合伙人是有哪里有问题，就到哪里，没有任何借口。如果你是一个军队的统帅，你要打仗，你每下达一个命令，下属都有理由不执行的话，这个仗也不用打了


    5、信念坚定。找合伙人的时候，绝对不能因为人少就凑数，宁缺毋滥。'
