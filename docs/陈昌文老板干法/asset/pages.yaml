    领导往往是任命的，而领导力是靠自己的本事赢得的。比如，你想 成为总经理，那么你得先有总经理的能力。如果你没有总经理的能力， 就算你被任命为总经理，也不是长久的，你在这个位置上待得越久，对
    自己和企业都是一种灾难。


