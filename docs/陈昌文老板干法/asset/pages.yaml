    这个战争一开始，秦军就如狼似虎，杀了一个人，赶快把他头砍下来绑 在腰间，继续砍头。敌人见到这样的军队，就不敢打了，最后就赶快投 降了事。


    秦始皇还取消了贵族世袭制，大家只讲杀了多少人，就可以得到什 么奖励，至于你爸爸是干啥的，跟你没关系。


