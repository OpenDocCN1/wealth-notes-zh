  md: '亡型。基本上是市场好的时候，能过两年滋润日子，市场一差，企业立马倒闭。如果打工的明白这个观念了，你发现你的老板就是第四重境界的老板，那么立马辞职，想都不用想，因为他这艘船随时都要沉。


    当然老板们明白我这个理念了，自己去反思。调整自己的管理模式，把企业做好。


    # 30、最高境界的管理字就是管理人的欲望


    我讲过秦国的农战制度，这是秦国发展成强国的根本原因，也是他一统天下的根本原因。商鞅让秦国人 都变成了杀人机器，他是怎么做的 呢？四个字：利出一孔。


    战国时期，商鞅在《商君书》中提出“利出一孔”的思想。这个唯一的孔道，就是“农战”。除此之外的商业、娱乐等事项，尽在禁除之列。他的商鞅变法就是以“利出一孔”和“驱农归战”为中心思想。


    什么意思呢？就是只有杀敌才能升官，才有尊严，才有钱花，才有女人。不准搞商业，搞娱乐，不准读书。打击靠除了杀敌以外的任何手 段升官发财的人，这就叫利出一孔。当然，利出一孔最早是管仲提出来的。管子曰：利出于一孔者，其国无敌；出二孔者，其兵不诩；出三孔者，不可以举兵；出四孔者，其国必亡。'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 陈昌文方法之老板干


    什么意思呢？就是经济权益由国家统一掌握，这样的国家强大无敌；分两家掌握，军事力量将削弱一半；分三家掌握，就无力出兵作战；分四家掌握，其国家一定灭亡。商鞅同志把这个思路变成了你想要过好日子，只有靠杀敌，没有其他出路。如果想过好日子，可以靠读书加杀敌两条路，那么可能有人就选择读书去了。如果想过好日子的渠道变成读书也可，经商也可，杀敌也可，那么又有人去经商了。如果想过好日子变成了大家推荐当官也可，那么可能很多人就要天天做好事，准备被推荐，就没上前线杀敌了。


    商鞅就把其他的路全部堵死，只留下你想过好日子就上前线杀敌，谁杀得多，谁的日子就过得好。秦国人自然就没办法，只好变成了杀敌魔鬼般的军队。


    我就把这条思路拿过来直接做企业了。企业的首要目的就是赚钱嘛，生存嘛。我天天在企业里宣传，想受到尊敬，你就得最有经济基础，赚钱最多。然后天天讲，月月讲，年年讲。没钱，你没办法出去旅游；没钱，你小孩子上垃圾学校；没钱，你买几件好点的衣服就心疼。就是除了赚钱，其他的事情都没什么意义，你来这里，就是赚钱的。我讲完了让员工讲，'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 第四章人性管理


    让赚到钱的员工讲！总体来讲，就是要做到员工价值观单一化--多化让他们脑袋里除了赚钱，啥也别想了。


    有部分人受不了我这种观念，自己工作做不好，赚不到钱，他被打击了，就直接会离开，这种创造不出来利润的人，也不是我们要的。


    其实这种单一化的价值观，在很多厉害的企业营销中都有体现。比如，电脑芯片的不断升级，他的广告就是让你感觉到你落伍了、过时了，你就不得不不断地去买新产品。比如苹果手机，他每年都发布新品，就是给大家营造一种单一的价值感，勾起你的欲望，让你感觉你的手机过时了，不断的买新品。


    只有勾起人的欲望多人们才会消费，企业生产的产品才卖得出去，社会才会发展，企业才会进步，国家的GDP才能增长，人们拼命的去满足自己的欲望。消费拉动生产，意味着社会的进步与繁荣。企业要想发展，就必须勾起员工对金钱的欲望欲望欲望强烈打家自然感疯狂的工作，我根本不需要设定什么规章制度+绩效考核，我的员工都是吃饭、睡觉、工作，对其他任何事情都不感兴趣了，我叫他们去玩多他们都不去。没有星期天没有节假日，没有下班，只有上班。我认为最高境界的管理身就是管理人的欲望身把员工的个性优势和利益捆绑在一起身体让他们热爱工作身多罗时还能得到很高效的回报。只有不懂人性  老板秀才把规章制度多绩效考核放在第一位。


    当然要全面调动员工的积极性，必须设计一个合理的利润分配制度。'
