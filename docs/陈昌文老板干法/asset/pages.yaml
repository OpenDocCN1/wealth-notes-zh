  md: '方型选手。


    # 22、老板必须在思想上养成的 5 点习惯


    老板必须在思想上养成的 5 点习惯。


    +   第一，必须要知道自己的时间应该花在什么地方！时间是非常有限 的，善待自己的时间，绝不要去打麻将，去喝酒浪费时间。每个企业都 有许多事情要处理，要思考。你把时间花在什么地方，你的业绩就在什
    么地方。


    +   第二，时时刻刻想自己能为市场做出什么贡献。我们并不是为了工 作而工作，而是为了市场而工作。不是一到公司，就钻到技术与手段里 面去，应该先问自己一个问题，顾客希望我做什么？然后我就做什么。


    +   第三，只利用自己的长处做事，利用团队成员的长处做事。不可把 自己的工作建立在自己的短处上面，自己做不了的事情绝对不去做。不 想做的事情，也别做。实在绕不过的事情，叫员工去做。


    +   第四身把精力集中在少数重要的事物上面。根据二八法则，一个企 业最赚钱的业务一定是那 20%的核心业务，贡献了 80%的利润。所以， 我们要把'
  merge: -1
