- pgno: 167
  md: '陈吕文方法之老板干法


    # 第四种人，想干，但完全没能力。


    有超强的动机和超烂的工作水平。这种人呢，要保护好他的工作热情，也要当好他的教练。


    一个团队就这四种人，分别用四个方法来管理他们。


    对于千里马，授权给他；对于笨鸟一样的人，就激励他，引导他；对于猪一样的员工，直接命令他干活；对于想干，但完全没能力干活的人，就教他。


    所以，只要思路清晰，根据人员的角色定位，看人下菜碟，带团队也不难。


    老板越轻松 9 员工越忙，企业才有前途。如果是老板越忙，员工越轻松，企业就要倒闭，即便是不倒闭，也永远做不大。


    很多企业为什么做不大？其实是对员工的要求太高了，没几个人符合老板的要求，他就只好自己干，不放心把责任、权力、重要的业务交给这些普通员工，导致普通员工没有成长，就老板自己拼命的成长。老板自己再拼命，终究是一个人而已。所谓众人拾柴火焰高，单枪匹马是不可能赢得市场竞争的。


    真正厉害老板，是把自己的工作都推给了各部门的主管、经理、员工，自己什么事也没有，就负责喝喝茶、读报、看书、闲扯淡。


    那些产品的设计要老板亲自去抓，产品的销售也要亲自管，生产也要自己管的老板，简直就是不合格的老板。


    有的老板，就是自己把公司人才的手脚捆着，不给锻炼机会，然后抱怨'
