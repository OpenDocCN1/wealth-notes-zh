- pgno: 116
  md: '的思索点就是把敌人变得简单劣势把事情变得简单。让你的部队只要一动 手， 就能有收获，而不是炫耀本事，去做那些困难的事情。这也是我选项目的指 导方针，我只做那些非常非常简单的项目；或者把项目变得非常非常
    简单， 然后让员工去做。


    每一个英雄的灵魂都是孤独的，每一个王者都是寡人！如果你想成 为强者，那么你就要明白，强者的道路上，你只能靠自己。父母、亲戚、 朋友、同事都是靠不住的。因为你要成为强者，这就是一个孤独的路途。你的心思
    必然是凡人不能理解的，你的亲人、朋友如果是凡人，他们就 会情绪化， 就 会伤害到你的心思。


    每一个人都有很多很多的缺点，但真心没必要改正，我只关注我的 优点，并且每个小时都发挥自己的优点。24个小时连起来就是优秀的一天，365天 连起来就是优秀的一年，100年连起来就是优点发挥了一辈子
    歹 就是一个优秀 的人。我为什么要改变我自己？


    每一个强者，都有一颗坚强而倔强的心，只有保持这颗心，才能过 着坚强而倔强的人生。强者不需要弱者的欣赏！不管是爬到人生高峰，还是没 有 爬到人生高峰，强者只需要顾影自怜，自己欣赏自己，自己鼓
    励自己，自己 给自己加油。


    不向任何无知而暴力的思想、意识形态低头，也不参与低层次的人 的废 话式的对话。我的亲戚、朋友老是劝我要低调点，要学会温柔。他们 为什么 要劝我？其实他们自己都不知道。答案很简单，没有人喜欢异类，一个优秀的'
