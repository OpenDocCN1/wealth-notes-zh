- pgno: 29
  md: '# **9、牛人就是能保护好自己的人，

    笨蛋就是保护不了自己的人**


    从前有一个秀才，考中了状元，又娶了当朝丞相的女儿，官拜一州知府。上任途中，坐船经过一条大河，船夫劫财劫色，害了秀才的性命。秀才临死之前，痛斥贼人丧尽天良、残害无辜、恶有恶报，早晚不得好死。此话果然应验，十八年后，凶手被官府捉拿归案，凌迟处死。虽说冥冥之中，报应不爽


    然而，死去的秀才能活过来吗？曾经的娇妻美眷、良辰好景，已化为昨日黄花。寒窗苦读换来的锦绣前程、父母师长的殷殷期望、光宗耀祖报效国家的壮志雄心，一旦付之流水，便再也无法挽回。


    另有一个大儒，名声传播四方，国王认为是个贤人，写信请他来朝中为相。大儒接信之后，匆忙上路。也是途经一条大河，遇到船夫劫财害命。大儒的修为果然高深，淡然一笑，说钱财是身外之物，你们想要，我就全部送给你们好了。盗贼们十分高兴，便放走了大儒。大儒从容上岸，漫步徐行。


    那些盗贼们却越想越觉得不对劲儿，这位先生说说话文文绉绉的、风度翩翩、气质高雅，定非凡人，倘若放走了，后患无穷，不如杀掉干净。'
