  md: '营理念。并且把这套思想灌输给每一个员工。


    # ## 17. 用胆大包天的目标刺激企业进步


    人这种生物很奇怪，要挖掘人的潜力身最好树立一个胆大包天的目标。不断强化这个目标给自己争给团队多给企业。让大家信以为真。并且为之挖掘出自己所有的潜力。


    古今中外，我研究过很多企业和个人，发现凡是有成就的个人与企业都给自己树立了一些常人看着胆颤的目标。讲个人，比如周恩来：为中华之崛起而读书。比如伟人毛泽东的目标：解放全人类，解放全中国。


    目标定得胆大包天，就会让人有奋斗终生的责任感和使命感，会激励自己奋发努力，拥有不断进取的强大动力。


    优秀的企业都是不断提出胆大包天的目标罗不断实现胆大包天的目标的企业。


    世界五百强第一的沃尔玛，在1945年刚创立第一家店的时候，山姆。沃尔玛就提出了一个目标：在5年之内，要成为阿肯色州最好、获利能力最高的杂货店。要实现这个目标，这家店的销售额必须成长3倍以上。从年销售额'
