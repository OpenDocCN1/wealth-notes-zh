- pgno: 112
  md: '# 老板与普通人的差别


    老板和普通人是有差别的。


    第一个，老板脸皮厚，厚到“不要脸”所有的成功者丢脸的时候都比有脸的时候多得多。无脸的人才能赚钱，看看大企业家的成功历史，你们就知道了。


    普通人呢，他适应的人很少，所以只能在社会底层。做老板，一定是需要受委屈的，而普通人常常认为，老子天下第一，受不了委屈，所以就做不了老板。


    第二个老板•对自己心很硬。说要怎么干，就怎么干，但腰杆很软，为了把事情办成，见人就点头哈腰。普通人呢，对自己心很软，很容易放弃，没有不达目的誓不罢休的心，见人也不喜欢点头哈腰，美其名曰罗清高、有志气，其实是傻不拉几的。因为根本没人在意贺甚至他自已也很讨厌自己的清高，因为没钱嘛。


    第三，老板敢于争取机会。敢于追求还不属于自己的东西，敢于占有资源。'
  merge: -1
  img_proc: true
