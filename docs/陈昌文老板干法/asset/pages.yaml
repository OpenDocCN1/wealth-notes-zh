    # 老板的最高境界是做一个隐形的领导者


    《道德经》里有句话，“欲先民，必以身后之”，好的领导者是隐形的。如果你的团队找对了人，作为老板，你只需要天天解释公司的愿望，不需要指挥大家如何行动。一个好的老板是不需要每天都告诉别人应该做什么的，因为就算10几个人的小公司，事情也是蛮多的。人事的、营销的、产品的、设计的，你就算非常聪明，也不能把这几部分都玩精通。如果你不善于调动其他人的大脑主动工作，只知道用自己的大脑工作，那么，你充其量也就是个项目经理的命了。


    当企业越来越大，比如由200人，你就更难安排每个人需要做什么了。所以，真正有境界的老板只干一件事''就是宣传公司的愿景9让员工理解公司'
