  md: '这件事，利他利己。


    陈昌文老板读书会和老板社群传播的是陈昌文方法，传播的是儒家 思想，只有这个，没有其他任何东西。我的目的，是带着大家变得优秀， 不断的成长，不断的辐射，精耕细作。我们只细分市场。社群绝对不
    多元化，只搞读书会+陈昌文老板社群。


    我个人，做到早起早睡、锻炼身体、尊师重道。我的尊师重道，就 是只抄袭大师、天才，我只请教高人，按照高人的套路做一切，我不自 作聪明，不原创。我只用天才、大师的头脑，搞传播、变现；搞基因繁殖、
    裂变；搞流量、变现。


    社群的一切讲课内容，源自于我们的教程，每一本书，讲师和学员、 粉丝，学的是一模一样的知识、智慧。不允许不负责任的胡乱讲，走偏。 记住，因果不虚。’勿造业。


    读书会+陈昌文老板社群反复循环售卖。一再强调，社群的核心 思想，就是儒家思想、陈昌文方法。我的写作范围广一些，但是会回来， 但都是以儒家思想去解读各种经典的，儒家思想是我们的法器。我们用
    我们的法器，去正各种经典，也就是以经解经。


    美人卖笑千金易，壮士穷途一饭难。我日日打造讲师团队，给群员讲课，给粉丝讲课，带领讲师不只是发家致富，更要利益他人，无限的去利益他人，不要做一个翻跎小人、宵小之徒，我本人没那么功利，并
    非唯利是图，我们的使命是把儒家思想和陈昌文方法传播给十亿人，十 亿人就会让我们衣食无忧。'
