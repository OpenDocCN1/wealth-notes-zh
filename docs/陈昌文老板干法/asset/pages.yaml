  md: '# 17、培养与选择优秀员工的方法


    当老板的人，要把80%的精力都放到优秀员工身上，因为企业的利润80%是优秀的员工创造的，大部分老板的精力老是被有问题的员工所吸引，这样，企业就没办法发展了。


    什么样的员工是优秀的员工？我们是有方法去挑选的。在企业里，如果员工不为老板着想，是不会提出什么意见与问题的。这种人当然是直接不考虑给他机会，还有一种人，会不断的提出建议，比如，他提出需要加大100万的广告投入，需要多招20个员工，或者，我们要是能在中央电视台台打广告就好了。类似这种理想化建议，提了也改变不了什么，不具备可操作性。这种人是假积极。


    我们要重点培养的员工是能提出意见，并能够提出具备可操作性的解决方案的人！其实我们也可以引导员工变成这样的人，比如，你可以直接鼓励大家提意见，并提出具体可以操作的解决方案，这样多鼓励奖励，就会有部分员工变成这样的人。企业永远不是只有老板一个人动脑'
