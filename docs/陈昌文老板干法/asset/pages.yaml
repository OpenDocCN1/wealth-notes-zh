    太多的人想变富有, 他们看见富人去打高尔夫球, 他们也去打。他们看见富人送小孩子去私立学校读书, 他们也把自己的小孩子送进去。他们看见富人买豪车, 他们也借钱买豪车。他们看见富人买豪宅,
