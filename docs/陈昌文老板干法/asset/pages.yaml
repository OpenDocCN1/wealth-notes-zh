  md: '好项目的门道我可以告诉你，你要想找到一个好项目，就必须找到 市场的一个需求多请默念这句话 遍。


    什么是需求？需求不是你凭大脑想出来的，它是一个真正的市场需 求。我看现在很多老板选择的项目就是扯淡，根本没有找到市场的真正 需求！在那里自以为是的想象了一个业务，就开始闭门造车了，还想改
    变世界。市场需求是通过观察市场获得的，或者是通过自己的切身体会， 自己有一个问题想解决，那么跟自己一样想解决这个问题的人很多，这 就是一个需求。


    仔细说说什么是好项目的市场需求，比如卖快餐这是一个显性市场 需求，什么叫显性市场需求？就是每天要吃饭！所以开个饭店满足的就 是显性市场需求。有人要喝啤酒，你卖啤酒就是显性市场需求。


