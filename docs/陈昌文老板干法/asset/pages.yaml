  md: '又有人问了，你只会一个套路，如果遇到其他问题，你这个套路解 决不了怎么办？我说，你留点问题给团队里的其他人行不啊？越是一件 事都不会的人，越是担心这个世界上如果有我不会的事情怎么办？
