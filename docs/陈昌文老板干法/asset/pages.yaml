    且也没有被洗脑的感觉，能很容易感染到大家，因为大家一看，他这样 能赚到钱，我们也能。自然就很兴奋的工作了。


    我经常与一些老板讨论，我们到底培养什么样的员工？有很多答案， 最常见的是说，要人品好，要有能力。其实，这些都不是正确答案，我们永远只培养那些跟我们一条心的员工，我也是这样做的。如果你不跟
