    # 28. 人类的财富究竟跟什么有关系


    老板需要了解，人类的财富究竟跟什么有关系？现代社会已经进入 了知识经济时代，这之前，人类的财富都是跟土地有关，一切财富都是 可以用土地来衡量的。比如一个古代的猎人，要养活全家身就得有几平
    方公里的土地，以便于他转来转去打猎。当人们发现通过种植可以用很 少的土地养活更多的人，人类就告别了渔猎社会，农业就产生了。这个 时候，几亩土地就可以养活一家子。养活一家人的土地从几平方公里减
    少到了几亩土地，这就进入了农业社会。不过，这一时期，人类的财富 还是主要跟土地有关系。谁能拥有更多的土地，谁就能拥有更多的财富。'
