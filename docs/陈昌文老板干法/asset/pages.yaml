  md: '所以我们就要把管理能力、领导力、号召力等提高起来，说白了，如果在这个生意中有什么具体事务是需要我们亲自去做的，比如我们是干餐饮的吧，比如打扫卫生、比如切配、比如调味、端盘子，我们还要亲自上。那么这个生意你想做大一点，想收入增加一点，那都是不可能的。


