- pgno: 254
  md: '所以直接选择独裁。


    现在很多人都是大学毕业，不管什么事情都喜欢表达自己的观点，喜欢标新立异、特立独行。平常吹牛就算了，但在创业的时候这就不行，其实真才实学没有，就为了证明自己肚子里有货，总喜欢显摆自己。很多争论往往不是为了更好的完成业务的争论。


    给大家讲个商业历史。在1978年的时候，中国刚刚改革开放。邓小平同志亲自批示与美国通用汽车公司在中国合资经营轿车与重型汽车项目。后来出任我国副总理的李岚清接待了通用公司董事长汤姆斯·墨菲。通用公司董事长汤姆斯·墨菲与中方谈好了合资经营，要赚一起赚，要赔一起赔。本来，通用汽车是第一个来到中国的外资公司，我国对这个项目非常重视，也是通用公司进入中国市场的一个非常好的机会，但是，董事长汤姆斯·墨菲回到通用公司召开了董事会，董事会一讨论这个事，觉得中国当时太穷了，最后竟然否决了董事长汤姆斯·墨菲的提议。所以通用汽车进入中国的步伐就戛然而止，这家全球最大的汽车公司直到1997年才开始到上海建厂，而在通用公司董事会否决进入中国的时候，德国大众汽车积极与中国谈合作，所以到1997年的时候，大众汽车在中国的年销量已经达到50万辆。


    中国为什么有很多德系车诸如大众、奥迪、奔驰、宝马、保时捷，特别是大众汽车、桑塔拉这种车，几乎占领着中国的出租车市场，至少我在上海看到的是这样一个情况。而中高端车，奥迪、奔驰、宝马依然是大部分中国人的选择。这都可以说是当年美国通用汽车公司那帮董事会成员贻的机会。'
