    我们的任务，就是让所有人都成为讲师，当讲师。打造至少百万个 讲师， 在外部讲课，在内部讲课，日日不断的讲课。给粉丝讲课，给学 员讲课，给 客户讲课。


    我们努力奋斗，寻找的只是可爱的人，共度余生，或者携手事业， 我希 望各位都能幸福吧。


    我建立这个社群的目的，是提升大家的智慧+财富。就这点事情。 我们 社群，只锁定功成名就的人，也只给这些人传播文化。我希望各位 理解我讲 的儒家思想、陈昌文方法，不要乱学、乱传，你们没你们想象
    的那么聪明， 传偏了，传错了，害人害己。


    陈昌文


