  md: '道打价格战、拼体力的人在做的生意。《孙子兵法》里有句话：见日月 不为明目，闻雷霆不为聪耳。意思就是做这种人人都知道的市场需求、 非常常见的生意，就是做表面功夫的生意。而要想找到一个好项目，就必
    须找市场的隐性需求。这就是我说的找到一个好项目的第一步，找到市 场需求的真正涵义。


    那什么是隐性的市场需求？比如婚恋市场，每个单身狗都想找到配 偶，这就是隐性需求。由于中国男人太多，女人太少，这个生意其实很 容易就赚大钱了。但我觉得这个还够不上说是隐性需求。顺着这个思路
    深挖一下，想想女性。女性同样想要钓金龟婿，而中国的现实情况是普 通的男人非常多，美女也非常多。但是美女看不上普通男。有意思的， 中国的优秀男人相对美女来说是极少的。也就是说，美女想要找优秀男人，
    比普通男找美女的难度更大。


    这里面就有一个极度赚钱的隐性需求，就是培训美女找优秀的男人。


    赚大钱的人.总是想的不与普通人不一样，做的与普通人也不不一样。 所以，乔布斯讲非同凡响。


    找到隐性需求是第一步，第二步就是你需要做一个满足市场需求的 与众不同的产品，也就是说你要在差异化上做成文章！你与众不同， 才能卖高价。如果产品都一样，那么只能打价格战，生意就变成了体力
    活。举个例子，同样是卖牛腩，很多人仅仅能做到养活自己。而某牌牛 腩通过互联网自媒体 的宣传，微博、微信宣传，节约了大量的宣传成本， 同时通过漂亮的盘子、有格调的环境，提高逼格，卖到了非常高的一个
