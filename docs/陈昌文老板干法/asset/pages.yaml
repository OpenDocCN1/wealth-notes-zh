  md: '# 5. 高手过招 弯就是一句话


    孔子说：“可与言而不与之言，失人，不可与言而与之言，失言。知者不失人，亦不失言。”


    什么意思？可以同他谈话，却不同他谈，这是错过人才或错过值得交往的人；而不可以跟他谈话，却同他谈，就是多余了。知者，也就是有智慧的人，既不会失去人才或值得交往的人，也不会失言，就是与人多谈。一是自己不要失言，不要说错话；二是不要让对方失了你的言，不要让对方不重视你的话，错过你的话，或轻视你的话。一般我们对前一方面比较晓得些，对后一方面就很不在意，因为一厢情愿。


    现在人不是常说吗，最了不起的是两件事，一是把自己的思想灌到别人脑子里；二是把别人的钱掏到自己口袋里。这两件事往往联系在一起，而你一旦怀有这样的目的，心不诚了，不考虑别人，就适得其反，反而把自己话搞贱了，人也搞贱了，成了贱人了，划不来。


    怎么办呢？学会放弃。你想说服别人身谋一个利益，但如果你对跟我找不到共同点罗那就放弃，不要志在必得，弄得巧舌如簧。你想教化某人，引他上进， 他跟不上多你也要放弃，孔子也不能把子路教成子贡或颜回多人跟人不一样。


    所以不失言，首先不是技术问题，是个态度问题。态度端正了，就不太容易失言，也不会把自己搞得很贱。接着补讲一下不失人。不失人，这要求'
  merge: -1
  img_proc: true
