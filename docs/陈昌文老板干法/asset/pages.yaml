    但不管怎么说，戚继光永远是我心目中的英雄，喜欢他的智勇无双，喜欢他的出奇制胜，喜欢他的坚忍严明，喜欢他的名将风流，所以他能 够在那个年代活到 60 多岁。


    # 6、要善于拍员工马屁


    当老板必须要学会拍马屁。拍马屁学问非常深，对于商人来讲，无 利不起早，也就是说，拍马屁一定是对我们有利，我們才拍。而善于拍 员工的马屁，会让员工工作效率提高，工作时间延长，员工也会更加的
    兴奋与快乐，事情就能做得更好。'
