- pgno: 255
  md: '而通用公司的董事长汤姆斯。墨菲的决定本来就是对的，结果因为一民主，几乎是痛失了进入中国这么一个庞大的一个市场的先机。纯粹是煮熟的鸭子被通用公司董事会的那帮家伙给硬生生滴搞飞了。


    其实重要的问题就得由牛人来拍板，民主的后果是得到一个非常槽 糕的结果。就像我们创业一样，你跟家人、朋友商量的结果，一般都是 叫你别干了，好好找个工作算了。大家给你扯后腿很起劲。


    商鞅当年对秦孝公讲了句话，“夫民不可与虑始，而可与乐成。论 至德者不合于俗，成大功者不谋于众。”就是说，民众开始的时候 9 不 可以与他们讨论问题，但是当事情做成功的时候
    9 可以与大家一起享 果实。


    能做成大事的人，都不与众人谋划。当然，当企业发展到一定阶段 的时候，你能引进些牛来做高管的时候，自然要与现代西方的民主管 理思想接轨，但这是后话。所以，创业初期罗致比民主好。


    # 9、说话可以不算数，只坚持真理


    我讲这个，很多人会说，你怎么教人言而无信？就比如公司的股权 分配假如有 5 个股东，开始的时候，大家都投资了 20W，说好一起干 一个项目的，签了合同，立了字据，利润平分。在干的过程中呢，有两
    个人很用心，有两个人得过且过，有一个人经常做自已私人的事情，甚 至后来根本就不来公司上班了。'
