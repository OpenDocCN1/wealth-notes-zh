    # 18. 《孙子兵法》与《吴子兵法》的营销策略


    写《孙子兵法》的孙武与写《吴子兵法》的吴起谁会做营销？


    因为我是做企业的，所以孙武与吴起的军事思想我们暂且放下，我 们来看两人是如何推销自己的。在军事领域，两人是不分上下的，但比 营销，孙武在吴起面前就是大师了！从著作说起，《孙子兵法》与《吴
    子兵法》都是讲军事理论的著作，“孙子”这两个字又具有天生的品牌 效应，就如同苹果公司的苹果一样，读起来朗朗上口，非常具有传播性与话题性。


    第一、看文采。'
