    不管我说什么，都有人说他学不到东西。每次我听到 “学不到东西” 这话，都觉得无比郁闷。你又不是三岁小孩，等着谁来教你？无论学什么，你要主动去学，你才能学到。等着被动接受，最好的结果是高分低能，也就是你充其量只能听懂，而没有能力去干。真正的学会，是要听明白、理解了，马上上去实践。


