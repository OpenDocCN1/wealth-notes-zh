- pgno: 28
  md: '在内心中种下种子。正确的行为和意识越多，正的种子也就越多。 反之，错误的行为和意识越多身负的种子也就越多。理解这一点非常重要， 这个世界所发生的一切都是缘起缘灭，没有无缘无故的成功，也没有无
    缘无故的失败。


    为什么要讲这个呢？这个世界上所有的成功都是由内因和外因共同 作用的结果，内因起决定作用。很多人都在抱怨，这个世界多么不公， 别人运气那么好，自己运气那么差等等。其实，老天是公平的，这个世界
    界遍地都是机会，关键看你是否具备能够抓住外在机会的内在素质。如 果没有这种素质，机会来了，你也会视而不见，或者看到了，也抓不住。


    所以人的穷富罗皆是由自己正面与负面的意识行为造成的结果。怨 不得谁，而且身解了这些，就能明白身人的穷富都是自己可以控制的。'
