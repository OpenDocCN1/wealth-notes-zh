  md: '第一种，选择性成交。比如对顾客说：你到底觉得A产品，还是B产品好？如果他说B产品好，那么你接下来只需要闭上嘴巴，盯着他选择。


    第二种，客户一旦在考虑成交的时候，就不要再继续推销你的产品了。不要再讲你的好处，你会因为话多而去掉一个单了，但绝对不会因为聆听而丢掉一桩生意。优秀的销售员都知道什么时候保持沉默，他会让客户聊得尽兴。销售人员应该多观察人，把观察同事、家人、客户，都当成一种习惯。要留意他们的话语、肢体语言流露出来的信号，以及脸部的表情变化。对别人的思想、感情、行为观察得越仔细、越敏锐，就越能明白什么时候是关键点，该怎么做。


    第三，要有要求人的勇气，只有会开口要求人的人才是人生赢家。大多数人害怕失败与被拒绝，而不愿意开口要求自己想要的和需要的东西，经常用猜测、含蓄、暗示等各种方式，却不愿意冒险直接提出要求。


    一个人的生活是否快乐，大多取决于自己的能力以及是否开口要求想要的事物。直接要求，是一个销售员必须学会的招式。完全不要怕被拒绝，大不了换一个。有时候在一个不可能成交的客户身上浪费太多的时间，不如直接要求后被拒绝了身换下一个顾客。'
