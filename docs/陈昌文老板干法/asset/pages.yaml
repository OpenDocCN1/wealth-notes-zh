- pgno: 62
  md: '弄个将军、团长都有可能。随着国家的统一，时间的推移，阶级会越来越难以逾越，既得利益集团越来越强势，平民向上游动的机会会越来越少的。正因为我看 过很多历史，所以我更加珍惜时间向上爬，因为越到后面，向上爬的难度越大。


    在 20 岁的时候，我就明白了努力学习文化知识，了解与参悟这个社会的结构，以及怎么混社会，怎么学术领，这包括了人际关系、工作技巧、公司政治斗争以及销售等等。


