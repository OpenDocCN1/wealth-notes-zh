  md: '按照 就班的工作。或许开始还有一点梦想，但随 著时间的 流逝，自己的收入并没有增加，存款寥寥无几，体会到生活艰难，挣钱 不易，梦想就随之消失。但很多人根本就没有反思下，你打工怎么可能
    挣钱很容易呢？就算你工作做得再好，赚得再多，老板也要拿走很大一 部分，你的，刚刚够用而已。随著你的收入提高，你的消费也提高了， 你根本剩不下钱，从此就进入恶性循环。


    所以，我一直建议一个人必须找到他喜欢的事业、他擅长的东西去 赚钱，去工作。现在是互联网时代，只要你喜欢，你总能利用你的特长 帮助到相同的爱好者解决些问题。只要你擅长，总是有人喜欢你的。慢
    慢的，你的粉丝越来越多，你也就赚钱了。而且，这个过程会让你很开心，也会让你的特长进一步变得更加的擅长。不过，你得忍受开始的孤独、 开始的迷茫、开始的探索阶段。没有收入，任何事情，开始总好像是艰
    难的，实际上呢，你如果工作努力，也会发现并没有那么难。


    你知道的越多。你就发现以前都是自己吓自己。摸着石头过河。其 实也淹不死多少人。


    永远用自己的长处去经营企业。


