    员工进入到企业里, 都带着各自的原型, 与企业的思想、制度等步 调是不统一的, 这样的员工用起来就非常不顺手。假如我们把员工看 成一台电脑, 统一一步调就相当于给员工重新装一个系统。这个系统分为
    win7、win8、苹果系统等, 而员工的原型就是硬件配置。根据不同的配 置装不同的系统。我们要让企业运作得有效率有效果, 事半功倍, 就要 统一一步调,
    重新给员工安装脑子里面的程序。


    第一步, 我们需要考虑员工的硬件配置。这个员工受到过什么教育? 性格内向还是外向? 有什么爱好? 比如这个员工的配置很低, 小学只读 到二年级, 工作经验也不行,
    那就不是让他做好管理员工了, 可能就是 让他做个保安, 告诉他爱岗敬业, 企业的每一个环节都不 不重要, 马虎 不得。而一个'
