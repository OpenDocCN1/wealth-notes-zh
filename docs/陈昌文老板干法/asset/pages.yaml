  md: '大部分情况下，要取得什么样的结果，取决于我们的行为。也就是 说我们可以通过控制自己的行为，从而操纵结果。举个例子，任何选择 都有好坏两面，你选择了坏的一面，就产生了坏的结果；选择了好的一面，就产生
    了好的结果。比如说，两个陌生人，因为一件小事产生矛盾，你可以选择退让，也可以选择据理力争。


    选择退让可能就没事了，选择了据理力争，两个人就有可能吵起来、打起来，甚至产生命案。网上著名的梯婴案就是这样产生的。如果母亲 选择退让一步，也就不会摔死婴儿了。如果另一个人也选择退让一步，也就不会判死刑了。这件事情看似偶然，实则背后有必然的联系。母亲
    肯定平时也是好强的人、喜欢据理力争的人。犯罪的那个人平时肯定也 是一个脾气暴躁的人。这两个人的性格脾气是由长期的意识和行为产生 的结果，这样的结果预示着他们两个人必然各自有一天会产生不良的后
    果。只不过是碰巧两个人撞一块了，于是悲剧也就不可避免地发生了。


    这样的例子数不胜数，想想现在过得不幸的人们，哪个不是因为自 己的意识和行为造成的？如果不改变自己，不产生正的因素，不幸的经 历将会一直伴随他们。


    人生就是每阶段的小结果串联起来的。既然我们的结果在很大程度 上都受我们自己的支配，也就说明我们的人生是受我们自己支配的。你 想成就什么样的人生，就去做产生这结果的事情。所以，那些认为人的


    命注定的思想显然是错误的。这种因果不仅是受行为的支配同样也 受内心意识的支配。正如佛家所讲的种子因，你的每一个行为、每一个 意识都会'
