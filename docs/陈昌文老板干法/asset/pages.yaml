    # 6、学会这三招字改变一生


    学会并且养成这些习惯，可以改变你的一生。


    第一身到任何地方，见到任何人、任何 事情，不要感叹身不管是 好的 还是坏的。


    比如，你见到一个企业老板非常的年轻，但事业已经做得很大了。


    不要感叹他了不起，也不要感叹自己没本事。又比如我们看电视，伊拉 克又 在打仗了，你不要感叹那里的人民生活真辛苦，也不要说什么他们 能赚钱就是靠石油。因为，人一学会感叹，脑子就不运动了，智商就降低，
    感叹完了，该学别人的没学到。我们是一个商人，每时每刻都要以商人 敏锐的眼光去看待一切。


    看看你接触到的人、事、物，有没有值得借鉴的地方，把它沉淀出来， 然后运用到自己的企业上，而不是出去感叹。人的思维不一样，就算是 同样'
