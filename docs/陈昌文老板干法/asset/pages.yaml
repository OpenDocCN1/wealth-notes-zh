  md: '# 26.  把战术打成战略身获得绝对优势


    如何把战术打成战略，获得绝对优势，让对手看得懂，也学不会，想跟也跟不上，想拼也拼不过！


    这很难吗？实际上极其简单，首先讲优秀的战略是如何形成的？就是首先打造一个核心竞争力，也可以说开始打造一个优秀的点，一个具体的战术，比如低价策略。然后，其他每个动作，都围绕这个低价策略进行了优化，最终形成包括物流策略、采购策略、用人策略，都是为了低价策略服务的很多策略组。这些策略串起来形成一条核心竞争链条，这个时候战略就形成了。


    也就是说，战略其实是选好一个优势点，然后不断的优化出来的整体效果。


    是不是有点复杂？那我给大家举个例子。比如沃尔玛的创始人老沃顿，有一次商品打折，反而营业额暴增，赚了不少钱，他就意识到了“低价”的威力！


    但低价只是一个卖点，也就是一个战术。竞争对手都看得懂，也学得会，也敢拼低价，他不可能天天打折9 这样竞争对手也会不断的打折。'
  merge: -1
  img_proc: true
