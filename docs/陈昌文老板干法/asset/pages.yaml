  md: '要想把业务员这个群体管好，必须从管理业务员的心入手。我的策略是天天都会与业务员开个小会，这个小会不是很正式的。当然正式的也经常开。目的是加强业务员的思想工作，让他们尽量认同公司，认同公司的文化；工资奖励要比同行高出
    10% 分为月奖励、季度奖和年度奖，这样随便辞职的人肯定会有损失；做好每个业务员的职业规划，让他们有上升空间，有奔头，树立好因为业务做得好当上了业务主管、业务经理的榜样。


