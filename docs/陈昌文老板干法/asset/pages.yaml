  md: '类其实是被词语、语言操控的。从很小的时候，你周围的人、社会，就开始给你的头脑进行语言、词语的逻辑编码了。有的人的脑袋被编码了大量负能量的东西，这样的人，就缺乏笑容，他的人生应该是灰暗的。有的人比较幸运，他周围的人给他编码了大量正能量、阳光的语言与词汇在他的头脑里。他思考问题的方式、他的逻辑思维就会是正面的，他的人生自然就会越过越好。


    词语有神奇的描述与引导人的力量，你若用错了词语与语言，就会伤害到自己。当大家明白了这门终极哲学的时候，你如果从现在开始，重新对自己头脑里的词语、语言进行编码，只吸收阳光的、正能量的词语多就会改变你思考问题的方式方法，也会改变你的人生观、世界观、价值观。


    这是改变一个人的终极法宝。


