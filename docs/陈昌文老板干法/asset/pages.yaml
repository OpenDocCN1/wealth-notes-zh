    # ### 如何说服任意一个人


    每个人的意志都是受利益驱使的，最原始的利益就是生存与繁殖。


    一个人可能在某个阶段受到极大的打击，生活潦倒、精神萎靡、食欲不振，但 这不是正常的状态。一个人正常的状态永远都是不满足的，只要后面 没有生 存的威胁，他永远都想主动获取更大的刺激。也就是说，他永远
    都有欲望， 不管是好的欲望还是坏的欲望，不管是保护现在拥有的东西 的欲望，还是想 要获得更多其它东西的欲望。


