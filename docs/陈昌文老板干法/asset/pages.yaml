  md: '我以前做项目的时候，认识一个人，这个人想与我聊聊商业模式、团队管理，以及互联网项目推广方面的问题。我直接拒绝了，因为他不是跟我一条心，我培养了他，他为为自己挣钱而已。同样的时间、精力，我只会找我们团队里一条心的人聊一会，才是对自己负责，对团队的负责。


    要特别重视营销部门，优秀的营销人员是公司的生命线。我会把大部分 的精力与公司的资源都向优秀的营销人员倾斜。在我们公司，优秀的营销人员一个月能搞几十万，年纪很小。部分做人事的、做财务的人就有意见，曾经有个人事主管来找我说过这事，觉得不公平，凭什么自己做了
    7 年才 5000 块一个月，别人 3 年就几十万元一个月。我告诉他，你要觉得不公平，你到营销部门去。他去了两个月，又来找我，要求还是做回人事，说那工作实在不是人做的。


    为什么优秀的营销人员可以拿到这么高的薪水？而人事只能 5000，答案很简单，我在 51job发一条招聘信息，能招聘来 10 几个人事主管应聘，而我要发 500
    条招聘优秀营销人员的广告，才有可能招到一个优秀的营销人员。


