  md: '+   4、 要负起领导的责任。你可以不做事，但必须要把握一个准确的前进方向，并且时时刻刻提供给员工帮助，帮他们解决碰到的问题。积极提供他们所需要的资源。他们有疑问，及时给予答复与解决。


