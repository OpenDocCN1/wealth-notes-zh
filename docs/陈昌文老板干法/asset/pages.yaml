  md: '# 陈吕文方法之老板干法


    程序员，你就得告诉他可以成为乔布斯那样的男人。千万不可告诉小学二年级学历的同学学习乔布斯，这就属于不考虑员工硬件，乱安程序。


    第二步：给你的员工装杀毒软件。啥意思呢？就是不不利于企业的思想和想法，就否定他，告诉员工这样干是极其错误的，比如偷公司东西。你可以设计一个制度写出来。偷东西是一个错误，这样的想法出现了，就要当病毒一样的杀掉。有人干了，我们就要开除他。杀毒软件就是一个公司的规章制度、企业文化。


    第三步：给员工装上防火墙。老板要仔细观察这个社会，外来的思想对我们企业有利的，我们就利用好；对我们没有好处的思想贸我们直接不让员工接触费或者否定这些思想。


    第四步：身羊群效应。制造一个大家都这么干歹你不这么干就是错误的制度。羊群效应贸也叫统一价值观。还有一个学术术语叫螃蟹效应。就是说一只螃蟹在桶里，他就很可能爬出来，多放几只螃蟹在桶里歹这些螃蟹就相互拉扯金最后是一只也爬不出桶。因为一个爬上去歹另外一个就会把它扯下来。


    第五步：9制造一个与外界完全不一样的企业环境9殿企业文化到企业环境，甚至是作息时间。让你这里工作的员工只能适应你这里的工作环境，到其他地方去，他就难受。其实这也是为什么个贝多成功的企业，优秀的员工跑出去了，过一段时间他只好再回来的原因。因为出去了，他生存不了。就像'
