    # 第二9 只抓核心。


    我们做企业的都有体会，当企业稍微发展大一点，就会发现事情真多，各种各样的杂事。人事啊、销售啊、财务啊、买什么东西啊，如果当老板的什么都管，企业就进入繁旅期。公司也很难发展了。很多小企业的老板就是因为这一点导致自己做不大的。


    任何一个企业，其实只有一个核心业务。如果你认为你的企业有好几个核心点，那么恭喜你，你没有抓住核心。核心业务永远只有一个，其他的业务都是支撑这个核心业务的。所以，老板必须找到企业的核心业务，然后
    80%的精力用来做核心工作，20%的工作对非核心业务进行指导，让同事去完成就行了。


