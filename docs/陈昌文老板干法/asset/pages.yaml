  md: '# 14、服务对象的选择与取舍


    如何选择你的客户群体？选择其实就是取舍，而取舍是一个大智慧。 说起来，人人都能点头称是，但是做起来，却不是那么容易。一方面我 们的本性会让我们不自觉的贪多，忘记主动的去舍弃。比如，我喜欢摄影，经常去摄影论坛里看，就能看到很多人，甚至有些老鸟不会主动放弃一
    些东西，导致整个图片不是那么美观。构图的第一法则就是简单、简单、 再简单，主体单一、单一、再单一。一次只拍一个东西，少就是多，这 很难吗？稍微学过一点构图的人，都有这个基础。可是无数小白，包括
    很多自以为是高手的小白，画面塞进了很多东西，主题感不鲜明，不知 所谓。


    谈到某些人做小生意，叫我他会舍弃一部分客户，专攻一部分客户。 他就要跳起来，本来生意就不好，顾客都没有几个，还要叫老子砍掉一 部分，这不是作死的节奏么？


    当然？对于大多数人来讲，勇敢的向“死亡”迈进一步，这并不 是那么容易！


    其实，只要稍微研究过《经济学原理》的人，都能明白这个基本常 识。.没有哪一个产品、哪一种服务、哪一个企业能让所有人都满意！所以 我们只能针对很小很小的一群客户号尤其是刚开始资金十分有限的时
    候。我们收缩自己的客户群体，重点研究能给我们带来利润的客户群体多 而砍掉部分鸡肋客户群体。形象一点说，就是你一开始资源有限、能力 有限，不能服务那么多“主人”，所以呢，盯上一两个有钱人就行了。
    不要想当然认为，我把东'
