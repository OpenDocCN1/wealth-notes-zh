- pgno: 242
  md: '别人一样。


    讲个故事，有个人想知道天堂与地狱的区别，请求上帝向他解释清楚，上帝一言不发，带他去参观天堂与地狱。他吃惊地发现天堂和地狱看上去 一模一样，都有阳光和微风，都有绿树和草坪，不同的是在这两个地
    方生活的人。天堂里的人个个健康快乐，相互关爱，脸上洋溢着幸福 的笑容。而地狱里的人一个个面黄肌瘦，互相厮打，眼中流露出的都是 贪婪和仇恨。于是他问上帝，天堂和地狱里的人为何如此不同？上帝带
    他去了天堂和地狱的餐厅，结果餐厅亦是一模一样，设施一样，饭菜一样。 不管是在天堂还是地狱，每个人都用一把比自己的胳膊长得多的勺子吃 饭，而且手必须握着勺子的最远端，因为勺子太长了，所以没有人能自
    己喂自己吃饭。天堂里的人互相帮助，把勺子里的饭菜喂到对方的嘴里'
  merge: -1
  img_proc: true
- pgno: 243
  md: '去，因此每个人都吃得饱饱的；而地狱中的人只想往自己的嘴巴里喂饭，结果由于勺子太长吃不到，所以饿得皮包骨头、痛苦不堪。


    其实，天堂和地狱的区别并没有我们想象的那么大。我们不需要等到死后再决定是去天堂还是去地狱。其实，我们每一天都面临着天堂和地狱的选择。


    当我们选择和别人和睦相处、互相帮助、精诚合作时，生活就变成了天堂；当我们选择贪婪、掠夺、霸道和自私时，生活就变成了地狱。


    没有人能依靠自己的力量活一辈子。每时每刻多我们都在分享别人创造出来的各种科技和文化成果，这种分享带给我们生活上的便利和精神上的满足。当你独处时，一曲贝多芬的命运交响乐亦能让你热血沸腾。有时候，人们对于使用别人的劳动成果太可以习以为常了，以至于经常忘了感激。当我们有痛苦和悲伤时，总希望别人能够分担和理解，但是当我们拥有财富和资源时，却总是想独享享用，在拥有的同时失去了世界上最美好的东西。


    试想一下，假如你把拥有的 6 个苹果全部自己吃掉，那么你仅仅尝到了苹果的味道；但假如你把 6 个苹果分给周围的 6 个人吃，那么当他们有水果时一定会分给你吃，也许你吃到的水果总数还是
    6 个，但你吃到了橘子、李子、桃子、香蕉、葡萄和西瓜，因此你尝到了 6 种不同水果的味道，见到了 6 种不同水果的颜色。更重要的是，6 个原本素味平生的人也会从此变成你的兄弟或者合作伙伴。'
  merge: -1
  img_proc: true
