    # 28、打造创业团队需要注意的 5 点


    创业是一个技术活，也是个艺术活，一定比上班难多了。打造创业 团队当然比一个成熟的公司招聘几个人做一个项目难多了。以下是我打 造创业团队的几点经验，希望对你有帮助。


    +   1、你的团队必须是运营合伙。什么叫运营合伙？就是这几个人必须 是投入心血、投入精力的人。什么都必须干，没有借口、没日没夜为公 司考虑的人才能称为运营合伙人。


    我以前有个朋友创业，有一个人投资了他 50 万，他当时也没什么钱，就给了那个人 40%的股份，然后自己招人，拓展业务，没日没夜的干了一年，没赚到什么钱，但是呢，他也算厉害，第二年坚持了下来，直到
    第三年，公'
