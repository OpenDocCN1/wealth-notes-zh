  md: '做生意的一个毛病，老是吃着碗里，看到锅里罗什么都想去摸一摸。别以为守就是不思进取的。守，也可以叫深耕自己的领够是胜的积累，而且可以加速积累自己的优势。


    当年，玉石把所有的公司都卖掉，这些公司包括连锁零售店、电影制片、百货公司等，就只剩下一个房地产。而且在房地产这个领域内，进一步集中资源做一个业务，就是只针对白领的住宅房产，深耕出了一个万科。


    从个人角度来讲，行作出状元，就是专注、坚持。任何一个人只要专注一个领域，三年开始赚小钱，五年成为专家，十年成为权威、赚大钱，十五年成为世界顶尖级。当然我说的专注与坚持，不是你在这个领域混日子，而是要每天都勤勤恳恳的修行，一直在学习新知识与实践。


    做企业的时候，你守住一个地方，能守住这个世界顶尖级来身你的企业能够活在他人的想象之外。守，是一个从量变到质变的积累。你天天在这个领域里积累，就没人知道你的水有多深罗因为他们没有一个地方深耕过这么久，没有达到过这个深度。你就能形成别人永远也攻不破的竞争壁垒。


    我本人就是一个专业主义者，这一辈子，就围绕着“老板”这两个字，把“老板”给研究透彻。我写书、出书，做老板社群圈子，与人分享当老板的经验、团队管理的经验，天天学习+实践。除了吃饭、睡觉，就是这样事。


    我的思路就是身不轻易选择项目来做身选好一个项目多干于一辈子。什么叫竞争？竞争的本质就是你没法跟我争，而不是我要跟你争。因为我在一个领域里专研得非常深劣你都不知道我的水有多深，怎么跟我争？'
