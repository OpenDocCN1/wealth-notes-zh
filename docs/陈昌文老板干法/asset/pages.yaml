  md: '没动力。有了贫富差距，差的能穷起拼搏的，老板也能获得收益；受不了的，就会自动离职，而且，大家看到确实有人赚到大钱，也就会有一部分人静下心来拼。如果大家都一样，说说笑笑上班，就成了过家家了。贫富差距能产生势能9有势能企业才有动力。


