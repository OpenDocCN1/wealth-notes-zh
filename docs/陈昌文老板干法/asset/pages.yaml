- pgno: 77
  md: '西装给所有人，然后每个人哪怕只给我一分钱，积少成多，十四亿人就是一千四百万耶！那要是大家都愿意买你的产品呢？


    所以不要把顺序搞颠倒了，不是我们生产一个产品去找客户，我们的首要任务是找到客户，然后生产产品。我们首要任务是要保证人家购买，而后才是考虑获得更多的客户。


    那么，如何来找到我们要重点服务的群体？答案是：尽量选择和你相似的群体。拿卖早餐举例，如果是我，我肯定更愿意选择白领这个群体，这不仅是因为他们比较有钱，更是因为我和他们的思维更加接近。这意味着我能比较好的理解我的顾客，理解他们的想法、喜好和需求。


    与之相比，学生这个群体就不那么合适我，因为本来我就不赞成了便宜和味道牺牲卫生、营养的这种饮食习惯。即便我换位思考，拼命去理解他们，我自己都不赞同的事又岂能理解得透彻，又怎能做得很好？


    所以，结论就是最好的客户群体就是和自己相似的人。这样，你能透彻的理解你的客户，容易抓住客户的需求与喜好，而且你也乐意服务于你的客户。你就能做强，然后做大。只有当你选择好了一个正确群体作为目标，才谈得上构建商业模式，才谈得上卖什么，怎么卖，在哪里卖，谁来卖，什么时间卖等具体的问题。


    如果你不完成选择和取舍目标群体的过程，就要问：我该卖什么，如何去宣传等等具体问题，那么你这是用仅有的一颗子弹，在资源极其有限的情'
