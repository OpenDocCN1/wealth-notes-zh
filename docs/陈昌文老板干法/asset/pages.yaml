  md: '诸恶莫作，众善奉行。


    时时刻刻琢磨做点好事，不做恶。


    时时刻刻准备隔离一些人。


    我唯一要做的，只有一个任务：道德+智慧。除了这个，其他的事情，对我毫无意义。


    我的唯一目的，呕心沥血提升大家的道德素质+赚钱能力。我就干这件事，我日日循环的文章、文字、授课，都是这个目的，疯狂提升大家的道德+智力+赚钱能力。


    陈昌文老板读书会和老板社群是精神财富、智慧财富的聚集地。大家来这里，也是老老实实的学习精神财富、智慧财富，都谦虚虔诚点，才来；觉得自己牛叉的，千万不要来，这是我们老师日日要讲的。述而不作，信而好古，不要瞎搞。


    凡所有相，皆是虚妄，若见诸相非相，即见如来。要管理好几万人、几十万人，靠的是大爱，靠的是德行、境界、智慧，跟能力无关。唯独无性格、无脾气、无喜好的人能干。这种人，也不是人了。


    本社群的读书会，以及陈昌文老板社群，这是个做圈子的项目。传播儒家思想、陈昌文方法的项目，这是个品牌营销的项目，这就是我们一辈子的伟大事业了，而且流量会持续攀升，会有精神和物质境界的复利效应。大家可以获得巨大的双利益，无论是讲师，还是粉丝。老老实实干到底就行了，'
