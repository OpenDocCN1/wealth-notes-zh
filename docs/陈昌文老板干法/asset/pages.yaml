- pgno: 114
  md: '到底做老板与普通人谁好呢？你们自己去想，但是做为一个人，我希望大家想三个问题！


    +   1、你现在有什么？


    +   2、你想要什么？


    +   3、你愿意放弃什么？


    问清楚自己内心这三个问题了，你就知道你该选择做老板呢？还是要选择做一个普通人。当然，我当然希望你选择做老板，因为对社会，你贡献得更多；对自己，你享受得更多。


    # 2. 老板的主要任务是什么


    老板的主要任务，是思考怎么把事情变得容易。


    猎豹的妈妈教小猎豹捕杀羚羊的时候，不能在百步之外发动追击，要悄悄的摸到5步以内。然后只需要从草丛中一跃而起，就能扑倒羚羊。如果一下没扑到，羚羊一跑，追上的机会就小了。很明显，如果从一开始就在百步之外发动追击，羚羊反应时间长，直接开跑，猎豹休想追上羚羊。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '我们中国古代有个词语，叫百步穿杨。就是射箭在一百步外能射中，这叫本事。但当老板的，别到处去寻找这种有本事的人来当员工。一个是找不到；二是因为成本高。其实我们找不到这样的员工，也是有解决方案的，就是直接跑到靶子面前，玩两步穿杨！你一定能射中。


    举个例子，中国人最会做饭，但少有世界级的连锁中餐厅？为什么？因为中国菜太复杂了，玩的是百步穿杨。麦当劳、肯德基为什么分店开到全世界？因为他们的食物，包括厨房的机器，都是流程化的定制产品。招聘过来的员工，稍微培训下，就变成高手了，因为操作很简单。所以，招聘几个毫无经验的大学生，也能经营一个麦当劳、肯德基店。这就是为什么麦当劳、肯德基可以把分店开到全世界的原因，因为简单。而中国的餐馆，你就算想开分店，第一家店与第二家店的口味都不一样了，原因是每个厨师的手艺不一样，味道也不一样。想把菜的味道做得一样，太难。这就是为什么中国餐馆很难规模化的原因。


    聪明的老板做事，不是显示自己的本领有多强，而是竭尽全力的把工作变得简单。其实聪明的老板讲话也是这样，都是通俗易懂的话，不管是员工，还是客户一听就懂，大家都知道怎么干，而不是故作高深，讲了一堆，员工根本听不懂，结果就是没效果。所以，只有简单的东西才容易规模化，容易教会员工，企业才容易做大。


    > 《孙子兵法》讲：“善战者势无智名多无勇功劣胜于易胜者也！”就是说，善于打仗的人只做简单的事，只打打得过的敌人。老板也是如此。你所有'
  merge: -1
