  md: '# 14. 生存不易学学谋略手段很重要


    很多人觉得讲手段，讲谋略，非常的不道德，心理总是有点介意。


    特别是一些学生和一些一直打工、从来没有做过营销，或者自己做过生意的人，对用手段与谋略嗤之以鼻。人类如果不用手段与谋略贤那么早就在原始社会被其他动物吃光了。正因为人类会储藏野果，制作猎杀动物的石头、木棍身用血的教训换来了对付敌人的手段，对付饥饿的办法，才在激烈的竞争中、弱肉强食的大千世界里，得以生存和发展。大家的祖先如果不使用手段与谋略，早就变成使用手段与谋略的人的盘中餐了，哪里还有你？


    在现代社会中，如果你不想被社会边缘化,被淘汰,那么你就得比别人更有手段，更加有谋略。因为你要生存需要配偶，要房子，要车子。


    给大家讲两个动物，以改变部分人这种反感使用手段、和使用谋略的观念。


    天鹅，高翔云霄，令狐狸望尘莫及。天鹅组织性强，夜间在草丛睡眠，派一天鹅“哨兵”站岗，发现敌情，叫醒其它天鹅，群起抵抗，令狐狸无法得手。但狐狸巧使“小计”，逼近天鹅，故意用身体摩擦草丛的沙沙声惊动天鹅“哨兵”。“哨兵”惊叫，群天鹅惊醒，狐狸却伏在地上不动，群天鹅见无敌情，安然又睡。狐狸又惊动“哨兵”，“哨兵”又叫醒群天鹅，群天鹅又不见敌情，几经折腾，那群天鹅怪叫着向“哨兵”抱怨、发火，用翅膀扑打它，而后又睡。这以后，无论“哨兵”怎样呼叫，群天鹅也不以为然，只管安然入睡。狐狸则靠着这套“疲惫战”、“麻痹战”和“离间计”的成功，大胆地向天鹅走去，尖尖的嘴稳稳地咬住了天鹅的颈。'
