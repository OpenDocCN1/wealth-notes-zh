  md: '话，你可以 3～6 个月淘汰一次。如果员工比较多，每个月 都应该淘汰一次。加大招聘力度，不断地筛选优秀的人，淘汰弱者。


    第三点 9 招聘人 9 选人一定是择优录取。优秀的企业就是天天都在 招聘。多找备选的人，大家要注意的是：优秀的人才是因为他本身很优秀，优秀的人并不是你培养出来的。


    我刚创业的时候，不懂这个道理，以为人是可以培养出来的。 不错，十年树木，百年树人，人确实可以培养，但要 100 年，我们都等 不起。


    我刚创业时，有一个成员，自己打工都找不到什么工作，混 得很差，但是呢，他也有一颗创业的心，当时我没几个人，就把他吸收 了过来。结果害我又是供他吃，又是供他住，他还不努力工作，经常表
    现得不开心，埋怨我没本事，不能快速的给他赚到钱，到处在团队成员 里面说我的坏话。后来我忍无可忍，就叫他滚蛋了，滚蛋的时候，还欠 了我一笔钱，也不还了。后来我见得人多了身我就懂了，原来人和人
    是有区别的。努力的人，在哪里都很努力；差的人不管是打工还是创业， 都是差的。优秀的人，到哪里都会想办法成为佼佼者。优秀是一种习惯。 这样的人会自己想办法解决问题，并且努力把
    工作做好，赚到钱。所以， 我的理念就是，多招聘，择优录取。当然， 第三点里面就延伸出来第四点了。


    第四点，不要企图培养人。如果他不 行，培养也没用，白白浪费精 力和时间。如果他优秀，他就会 一直保持优秀的习惯。你不用培养，他 依然会出类拔萃。历史上有很多带团队非常厉害的人物，我们看看他们
    是怎么带团队'
