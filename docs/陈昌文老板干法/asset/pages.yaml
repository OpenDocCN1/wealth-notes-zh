  md: '# 我当老板的赚钱逻辑


    我工作的奋斗精神走过了三个阶段：不怕累，累不怕，怕不累！有的孩子在学校里读书的时候，读得一塌糊涂，没关系，现在混社会了，成为一个工作狂就行了。这比在学校成为学习狂回报大多了。一切复杂的赚钱模式，就是没用的模式，就是赚不到钱的模式。老板只追求最简
    单的模式，只要这个东很复杂，我们就不显大道至简，赚钱也是这样。


    赚钱是把事情变简单，不是追求复杂。比如马云的淘宝网，就把中小企业卖东西这件事情变得简单了，所以马云就赚钱。


    企业赚钱就一件事情。想尽办法提高自己的效率，就能赚大钱 9 这 其实也是寻找商业机会的思路。也就是说，你能帮别人提高办事效率，ok,你就等着收钱吧。我天天跟大家说的是赚钱，但我希望大家知道，成功的企业从来不是以赚钱为目的的。我个人是以成就自我为目的的。
    你是以什么为终极目的呢？但是成功的企业绝对赚钱。


    不懂得价值交换的人，永远也不懂得商业。有人问我商业的本质是 什么？我认为就是价值交换。文明的发展史就是交易的发展史 9 越是交 易频繁的地方，就越是发达。相反，穷人一辈子就没跟几个人交易过，
    所以贫穷。越是交易越富有，不管是思想上的交流，还是物质上的交易， 都会让你变得富有。


    我们活在一个社会里面，是不能独立生存的。所以，我们需要相互 配合，'
