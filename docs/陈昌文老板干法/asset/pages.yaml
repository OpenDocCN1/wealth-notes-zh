  md: '# 21、老板的5个层次


    很多人都想当老板，但老板分为很多个层次。


    +   1、卖菜级别。小买卖，只会算数。这种老板连算账都不会算。简单的低买高卖，或者自己种了卖，只能算几个小钱，连时间账都不会算的级别。


    +   2、小企业级别。这种老板知道招聘员工来干活了，会算账了，靠团队过活，最出力的还是老板自己，总觉得就自己操心，其他员工怎么也 不把公司的事情当回事。中国大部分老板就是这个层面的，基数也最大。


    +   3；中型企业级别。这种老板稍微领略了“为将之术”，会了些简单的笼络员工的本领，讲些好听的话，甚至企业里也开始有了专门的培训 部门。有那么三、五个骨干业务员跟着这种老板混，也是基数非常大的一批老板。


    +   4、大型企业级别。这种老板领略了“统帅之道”，已经知道笼络几'
  merge: -1
  img_proc: true
- pgno: 155
  md: '个将才。已经知道利润都要分给别人一部分，甚至领略了要尊重普通员工这样的普世价值观，很多行业领袖级老板就是这样的。


    5、宗师级别的老板。企业做成怎么样，已经不关心了，这种老板唯一要 干的事情就是成就他人，发掘企业里每个员工的潜力。搭好平台，找到或者培养出来厉害的角色，把企业做好。自己则隐退幕后，看起来一无是处，甚至你都不知道他的名字。


    我们这里只讲第 4 层级的老板怎么达到，至于 1,2,3 层级，我不想讲，第 5 个层级的老板你先达到第 4 层再去探索吧。


    我接触过各行各业的大老板，身价上几十亿的都有。发现一个规律多 真正的牛人，并不是智商有多高罗人有多精明但情商都很高身特别知道怎么让人舒服 9 也就是交际能力特别的强。这个能力我认为是非常之重要的。人类社会是一个关系社会，赚小钱靠努力，赚大钱靠资源整合，而整合就必须得善于结定人。这其实是一个对内、对外都很重要的能力，但主要还是对外。


    第二个能力是凝聚力，因为一个人不可能完成很多事情，要成为一个成 功的老板，你必须凝聚到有能力的、有技能的人在你的周围，为一个 目标共同奋斗。要想成为第四个层面的老板，需要有意识的练习与人结交的能力和凝聚力。当然还有很多能力很重要，但我认为这两个能力你可以在生活中开始实践了。拿着你的同事、朋友、父母开始练习，总有一天你会用上。大家可以仔细考量一下马云同志，马云就是情商加凝聚'
