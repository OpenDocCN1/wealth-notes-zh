  md: '我们穷人要翻身, 没有理由讲辛苦; 我们穷人要翻身, 没有理由讲兴趣。不断的做工作吧。智者创造机会, 强者把握机会, 弱者等待机会, 就算机会来了,
    弱者也把握不住, 因为平时他没有准备好。我一直都在为自己的未来而奋斗。宁可被人笑一时, 不可被人笑一辈子。吃别人所不能吃的苦, 忍别人所不能忍的气, 做别人所不能做的事,
    就能享受别人所不能享受的一切。


    真正想进步的人必须不断否定自己的价值观。


    穷人会否定富人的价值观。因为穷人认为富人说的都是错的, 所以穷人肯定不会按照富人说的去做, 所以就穷。社会中高层的人要是去到社会底层的圈子里, 他会全身不自在,
    他也会认为周围的人都是错的。同样的道理, 社会底层的人到社会中高层的世界, 也会认为大家都是错的, 而他自己是对的。


    但社会底层的人没有想过如果他对是对的, 他为啥不是高层的人? 为啥没钱? 为啥没权? 如果高层的人是错的, 为啥高层的人是官? 有钱? 有权? 原因就在于,
    不同的社会阶层, 他们的价值观是互相抵触的。所以, 如果你想往上爬, 其实也蛮简单, 就是不断否定自己的价值观。并且接受高层人的价值观。你自然就爬上去了。


