- pgno: 261
  md: '# 12、我经营企业的主要理念


    我们做任何产品要完全清楚能卖得出去 9  市场需要才做。也就是不 生产废品，只生产已经卖出去的东西。公司经营不是做到行业标准就完了  9  “标准”不是“理想状态”，是改善的起点。


    我对营销的研究，就是 4P 理论，只关注产品、价格、渠道、推广。这个社会不断有人提出 4P 理论过时了，而我认为 4P 是唯一正确的营销理论。我研究任何商业理论，只研究教科书，也就是那些再版了很多次  的书籍。我不喜欢那些流行书籍，那些流行的畅销书很多都是极端片面的，只是抓到了教科书里面的半页理论，就大写特写，写得厚厚几百页，让很多新手把这种畅销书完全看成是救命稻草，看成是唯一的圣旨，实际上害人不浅。


    所有企业都是制造业 9  都在制造一个东西。所有企业都是咨询业，都是为了了解顾客的问题后，按照问题出方案、做产品才能赚钱。


    对于经营企业来说，技术可以学，可以买，专利会到期，创意能拷贝，但管理是学不走的，是真正终极的核心竞争力。老板最最应该锤炼的是  自己的管理能力，而不是学技术、做业务、搞策划与创意。企业的竞争，  实际上'
