  md: '们攀登更高的业绩。


    # 11、如何带出如狼似虎的团队


    第一点，不要给团队成员高底薪。给了高底薪，大家就靠底薪吃饭了，很容易导致大家没有奋斗精神，其实那些大企业的老总，一般都是跟业绩挂钩，做得好了有奖励，做得不好，其实也赚不了几个钱。给高底薪，
    实际上是害人害己。团队成员不拼命，自己也赚不到钱。我提倡的就是计件制， 一个人为公司赚 了多少 钱，就给他一个提成比例。这个钱以现金方式当着同事的面发放，不要把提发放到支付宝，因为支付宝里的钱，仅仅是数字变化，员工对这个钱没啥感觉。但是现金不一样，
    5000 块， 100 的有 50 张，而如果另一个人的提成只有 300,那就只有 3 张，这样是非常具有冲击力的。可以激励做得不好的，要努力做好。受不了的人，也就走了。他走，我们也乐意。做得好的人，就会更加努力的工作。


    第二点，末位淘汰制。一定要给大家危机感，不能说做得再差都可以。但是团队中最差的人，我们可以设定 2 个月或者 3 个月统计一次，最差的人直接淘汰，也就是让他走。完全不讲情面。大家平时可以在一起喝酒、吃饭、开玩笑，但是统计出来数据后，就要严格执行。如果你的员工开
    始比较少得'
  merge: -1
  img_proc: true
