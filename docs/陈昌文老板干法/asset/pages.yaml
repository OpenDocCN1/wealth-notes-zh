  md: '# 5、什么是地狱


    在古老的欧洲，有一个人在他死的时候，发现自己来到一个美妙而又能享受一切的地方。他刚踏进那片乐土，就有个看似侍者模样的人走过末问他：“先生，您有什么需要吗？在这里您可以拥有一切您想要的，所有的美味佳肴，所有可能的娱乐以及各式各样的消遣，其中不乏美女，都可以让您尽情享用。”


    这个人听了以后，感到有些惊奇，但非常高兴，他暗自窃喜：这不正是我在人世间的梦想嘛！一整天他都在品尝所有的佳肴美食，同时尽享美色的滋味。然而，有一天，他却对这一切感到索然乏昧了，于是他就对侍者说：“我对这一切感到很厌烦，我需要做一些事情。你可以给我找一份工作做吗？”


    这就是我们很多普通人失业的时候，玩了很长一段时间，突然想找工作了，因为一直失业只人会感觉到特别难耐。


    他没想到罗他所得到的回答却是摇头M“很抱歉，我的先生歹这是我们所里唯一不能为您做的。这里没有工作可以给您。”


    一个人失业时间长了，他就很难再找到工作，也没有人愿意雇用过这样的人。这个人就非常沮丧，愤怒地挥动手说：“这真是太糟糕了！那我不如去地狱！”“您以为，您在什么地方呢？”那位侍者温和地说。


    其实一个人失去工作就等于失去快乐。但是令人遗憾的是，有些人却要不'
