- pgno: 54
  md: '# 第二章 老板如何打好基本功


    马云就去测试，他作为一个互联网技术的小白，正好是站在小白用户的角度去测试网站的。只要开发一个新功能，先让马云用，他能很容易的用好这个新功能，网站才合格。因为大多数用户跟马云一样，也是互联网技术盲嘛。所以，在马云这里，不懂互联网技术是一个优势，他一直在发挥他的优势。


    再比如，马云擅长演讲，他自己当了7年英语老师，这是他的优势。所以，他就经常到处演讲，扩大了阿里巴巴的品牌影响力。这也是利用他的优势。老板要把很多机会都让给员工，让员工得到锻炼能力的机会。你手下的员工强了，你的企业就更加有前途。


    我们做企业身也是从自己擅长的地方切入市场9慢慢的就会发现其他的盈利点身后可以做大企业。比如，滴滴打车是从出租车市场切入的，如果他直接从代驾市场切入，代驾市场利润丰厚，但是有E代驾这个强大的竞争对手。滴滴必然会被打得满地找牙。但是滴滴从出租车市场切入拥有了大量的用户群过后，已经有了稳固的根据地，可攻可守。由于出租车的用户群体体量与代驾用户群重合的很多，而且体量明显大于代驾人群。所以这样一个打法直接就把E代驾给秒杀了。


    如果马云去学互联网技术，做阿里巴巴呢？可能现在马云只是个技术员。所以，永远用自己的长处去经营企业，永远不用自己的短处与对手死磕。'
