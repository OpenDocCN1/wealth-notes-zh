- pgno: 79
  md: '# 第一9 当老板别整虚的


    清楚知道大家都是来挣钱的，每个人首先要解决的就是生存问题。


    首先谈分钱的机制。多劳多得，鼓励有能力的人做事，为公司创造 效益就分他钱。少劳少得，做得少，当然给他的少。不劳不得，这一条 非常重要，没有劳动的人，当然就不给他钱，企业绝对不养闲人。劳而
    无功，分文不给。这一点也非常重要，要成为公司每一个人都知道的制度。 企业是经济动物，不是讲感情的地方，没有什么苦劳的说法。中国人最 是抹不开面子，喜欢讲苦劳这样的事情，其结果就是部分老板被这些不
    创造利润的人活活拖死。我最开始的团队中也有几个这样的人，就是当 初抹不开面子，浪费了我不少精力和物力，减缓了我们的发展速度。


    第二，公司的权力问题。


    尽量把权力下放。有的老板喜欢抓权力，什么都攥到自己的手里， 结果就造成其他人只动手不动脑子，什么都等着你安排，大家也不愿意 担责任。这样的话，老板会累死的，大大小小的事情都要管的老板就是
    个体户。权力下放的好处很多，其实人都需要成就感、自豪感，大家 有权力了，他做好了事情，就会感到愉悦。就会更加进一步的做好事情。 也能为企业培养人才梯队，随着业务的扩张，自己才有可用人。既然权
    力下达了，当然就要责任跟着权力一起跑，利益跟着权力一起跑。谁下 的命令谁负责，做好了有赏，做坏了有罚，赏罚分明。


    第三，团队成员的精神问题、文化建设问题。'
