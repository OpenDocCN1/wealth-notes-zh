- pgno: 162
  md: '很多人不愿意动脑·勤奋，也不愿意吃苦，就想借钱创业起家，纯 粹是空想，必然失败。


    有的人看起来很有才华，也有目标，但是终其一生也没什么成就， 为什么呢？因为他们永远只是想做事，永远觉得条件不成熟，要等一等， 等等再行动。其实行动最好的时间就是马上开干。条件永远是不成熟的身
    干着干着就成熟了。


    很多人就是因为太明白，所以不行动。秀才造反，三年不成。真正 的牛人，都是立刻行动，并且坚持一辈子。一个人不是要知道很多道理， 而是要学会行动。全身心的投入到自己的项目中去，魂牵梦绕，不要去
    找那些不赚钱的人商量事业，不要去找那些没有雄心壮志的人谈理想， 读到最后只能让自己变得萎靡了。


    你必须找老板，找赚钱的人谈理想，谈雄心壮志，他们才会给予你 鼓励。找老板，找赚钱的人谈理想，谈未来是为了催眠自己，把自己催 眠成老板思维。但是有可能你没那么幸运，因为老板都很忙，不愿意理你。
    那么你就选择自我催眠，自我引导。


    高人都是孤独的，皇帝都叫寡人。普通人需要老板引导·而老板就 靠自己引导自己。公司选人身老板选合伙人，都选那种命好的人，选那 种嘻嘻哈哈开心的·见到什么都很兴奋的人做伙计。那种犹犹豫豫不开
    心的人旁在心理上其实是扭曲的你我们就让他远离。只有很兴奋的人才 喜欢行动。而公司是靠行动的人创造业绩的身不行动的人是公司的负担。'
