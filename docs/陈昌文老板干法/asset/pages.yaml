  md: '当然做成了，利润比解决已有需求这种创业高。


    第**九**就是推出一项谁也没见过 **9** 甚至连想都没想过的产品或者服务。


    比如， 20 世纪 50 年代，不会有人提出要做一个随身听。但是索尼公司却把他造出来了。 1952 年，索尼公司决定制造一种迷你收音机，当时，收音机都是用真空管做的，世界上还没有哪家公司成功地把晶体管技术应用
    于收音机这种消费品。当索尼公司把这个想吃螃蟹的计划告诉一位外面的顾问时，对方说： “晶体管收音机？你们有没有搞错？即便是在美国，晶体管也只是用在不以赚钱为目的的国防用途上，就算你们做得出应用晶体管的消费产品，又有谁买得起元件如此昂贵的收音机？
