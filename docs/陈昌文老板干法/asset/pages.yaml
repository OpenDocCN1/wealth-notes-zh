  md: '# L 如何搞清楚自己是谁


    其实大部分人根本搞清楚自己的角色，当然就搞不清楚自己的兴趣爱好、自己的特长，自己能靠什么赚钱，自己这一辈子想怎么过？


    我来帮助大家重新定义自己，准确的搞清楚自己是谁，自己的兴趣是什么？自己的爱好是什么？推动你工作生活更进一步。


    首先，大家准备十张白纸，在顶端写上“我是谁”三个字。然后在每 张纸上，回答这个问题，我是谁？


    比如，我就写了十个答案，


    +   1、读者；

    2、思考者；

    3、我是老板；

    4、我是张良，就是帮着刘邦混的那个张良；

    5、我是大将军，是统帅；

    6、我是陈吕文，是团队领导；

    7、我是谋略家；'
