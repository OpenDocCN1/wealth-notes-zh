  md: '7.2万美元，增长到25万美元。很多人都认为沃尔顿疯了，脑子不正常，但他达到了这个目标，成为了阿肯色州和附近5个州获利能力最高的商店。当达到目标后，沃尔顿继续给公司订立胆大包天的目标：1977年的时候，他提出4年内销售额要达到10亿美元，公司利润要增长两倍以上；在1990年的时候，沃尔顿提出要在公元2000年，商店数量翻倍；在销售额为300亿美元的时候，提出了要超过世界上最大销售额的公司，通用公司，而通用公司是1250亿美元。这种疯狂的目标让整个企业的人都兴奋不已，像上了发条的机器一样，拼命工作，挖掘潜力。最终，沃尔玛成为世界500强第一。


    再讲一下李嘉诚，1971年6月，李嘉诚正式成立了负责地产业务的长江实业有限公司。在“长实”成立大会上，他为日后定下的目标：超越号称香港“地产业之王”的“置地”。置地公司由英国商人保罗·罗打，跟当时“怡和洋行”的香港负责人联手创立，号称全亚洲最大的开发商。李嘉诚提出的这个目标，让李嘉诚的秘书都不相信，但是他就天天说这个目标，最后大家干看着看着就信了，最后居然真的超过了置地，成为了香港地产业的龙头。


    伟大的人是总是相信自己的目标身后然后感动周围的人相信自己的目9一起参与到实现目标的过程中来。伟大的目标多能够压榨干自己的所有才华9压榨干团队的所有潜力9人的潜力可能真是无限的。所以，你也订立些胆大包天的目标吧，如果你的目标轻而易举都能实现，定下来也没什么意思啊。目标远大，可以刺激自己，也可以刺激团队。'
