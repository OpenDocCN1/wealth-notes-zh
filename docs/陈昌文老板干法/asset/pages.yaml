  md: '所以学好心理学也是做老板的利器，管理人嘛 9 就是解决人的心理问 题。能把每个人的心理问题解决了 9 那么什么事情都好办了。


    我认为领导者、企业家只解决两个问题，第一个问题，当然是大家能赚到 钱。第二个问题，就是整个企业的氛围身也就是队员的情绪问题，把队员的 情绪问题解决好了，大家的战斗力爆发，你啥啥也不用管了，收钱睡觉就是了。


    我们的精力应该是讨论手上的事情怎么做得好，而不是讨论策略、公司 未来、方向。手上的事情做好了，什么都有了，策略、未来、方向不用讨论。 这些东西都是为赚钱服务的，所以，我们最终要干的仅仅是把手上的工作干
    好，赚钱，没事了。


