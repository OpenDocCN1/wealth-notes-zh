  md: "世界上的很多道理本来十分简单，但由于我们被自私和贪欲所蒙蔽， 所以时常忘记什么是生活中最重要的。当我们只知道独占时，我们已经 失去了整个世界。\n\n\
    我们总是在别人的帮助和支持下才能顺利度过此生，顺利完成一个项目。父母给我们挚爱，兄弟姐妹给我们亲情，同学给我们友谊，兄弟给我们关怀，老师给我们知识，同事给我们帮助，家庭给我们温暖，学校给我们欢快，剧院给我们激情，球场给我们狂热，公园给我们宁静……我们在不断汲取别人给予的身体和精神营养的同时，千万\
    \ 别忘了把自己的智慧、思想、友情、爱心与别人分享。当别人需要你时，千万别忘了伸出你充满爱意的双手。\n\n在这个世界上，总有人需要你，就像你永远需要别人一样。\n\
    \n# 4、如何正规模化 管理你的企业\n\n如何把公司正规化？就 4条。\n\n+   1、行为规范。\n 必须让员工知道我们提倡什么，不提倡什么，禁止什么。比如迟到、\
    \ 早退、请假，你都可以明确规定不提的。"
