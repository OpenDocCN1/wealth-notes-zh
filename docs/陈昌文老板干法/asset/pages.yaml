  md: '# **第二章 老板如何打好基本功**


    努力，对方只需要不费力的说“不”就能化解掉。那么在 整个“猎杀”过程中，无疑我们的消耗要远远大于对方，无论是打电话， 写邮件，还是上门拜访，都需要消耗时间、精力、金钱。稍有理智的人
