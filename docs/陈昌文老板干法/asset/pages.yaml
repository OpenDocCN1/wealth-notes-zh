  md: '短期不盈利特别正常。组织架构调整后，第一阶段效率一定下降， 问题常常增多。很多老板因此怀疑自己的决定，就走回头路。这是非常 错误的行为。如果原来的设想是合理的贸就应该痛哭坚持下来，走完新
    组织的磨合期，这样，收获业绩的阶段才会到来。


    # 11. 应为市场第一的方法


    企业的战略就是“我是谁”，搞清楚企业在社会上的定位，就搞清楚企业的战略，就搞清楚企业的经营使命与社会责任。


    要想把企业做强做大，做成一个品牌，做得有章可循，就要把企业 战略、经营使命和社会责任三位一体来看待。


    老板要有围棋思想、全局思想，不谋全局者，不足谋一域。没经验 的老板容易只看重一个方面，比如只知道把产品做好，或者只重视推广， 或者只重视财务，这都是错的。


    企业的社会责任等于为社会解决问题。企业的经营使命是为了承担 一个社会责任，解决一个社会问题。解决这个问题，就是战术，也是战略。 就能顺'
  merge: -1
  img_proc: true
- pgno: 259
  md: '手推出具体的业务组合和产品结构。


    先抓住一个项目、一个服务、一个产品，搞清楚 “我是谁” 的定位过后，企业文化布局都会一一浮现，这就是战略的形成。


    360 以前是靠免费杀毒形成了几个亿用户的流量，有了流量之后就做 网址导航，做广告，分发游戏，他就这样做成了一个上市公司。大家总 是在找下一个互联网风口，其实没有人知道风口在哪，360
    也不知道。那 么他们锁定了什么？锁定中国 互联网安全的概念。这个锁定即是一个经 营使命，也是一个社会责任，同时也是 360 的战略。这就是最智慧的玩法。


    各位老板也可以把自己的公司按照这个思路梳理一下。锁定一个社 会责任，做成中国乃至世界的领头羊。之前 360 的业务只针对普通消费者，没有针对机构、企业、政府的业务。通过几年的发展，诞生了企业安全集团
    O


    我 以 前 以 为 360 会跟百度竞争搜索，现 在 明 白 360 的高 招 是 不 跟 百 度抢肉吃，自己做了一块大大的红烧肉，互联网安全。


    其实在中国赚钱完全没有必要虎口夺食，因为可以吃饭的地方太多。 在能人的眼里，到处都是黄金，只叹拼命捡也捡不完；在普通人的眼里，中国市场竞争激烈，且没有什么机会。


    360 做了一件很重要的事情就是创意开发的互联网安全大会，第一 届 有 1 万多人参加，第二届 2 万多人，第三届达到了 3 万人。为什么要 做这个会？就是要做成
    360 的互联网安全道场。'
