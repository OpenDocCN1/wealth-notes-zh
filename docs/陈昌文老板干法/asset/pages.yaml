    一个人为什么要找点事情做呢？原因就是没有事情干的时候，人会感觉 到空虚无聊。所以人才会主动去找事情做。


    有的人找的事情毫无意义，就是我开始举的例子，打网络游戏、看 不该看的、打麻将，去做这些事情的人，很难有事业的成就。而有的人， 走向了良性循环，他们寻找了些有益身心的事情去填补自己的空虚无聊。
