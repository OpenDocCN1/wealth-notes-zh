- pgno: 260
  md: '提社会责任9自然就会形成特殊的品牌，这是战略高度。社会责任不是企业的负担9很多格局小的老板认为社会责任是企业的负担，其实，社会责任是企业的品牌，是企业的利润。以后的企业想做大做强，都要做首席知识官q让用户没有办法，只有问你，你承担为社会解决这方面问题的责任9互联网就会让你的企业变成垄断。以后所有的企业都将是互联网企业9现在才刚刚开始。


