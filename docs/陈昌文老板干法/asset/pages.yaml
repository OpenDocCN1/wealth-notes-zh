  md: '感情建设。所以创业能不能有一个好的开始，就看你平时是怎么行军的。我每一步都为下一步铺垫着机会。毛泽东思想，我从来都是当成创业思想来解读的。


    第三9人民战争，是一个划时代的战争认识论和方法论9这个时代谁开创的？是战争之神拿破仑。人民战争的“人民”，对应的是什么词？是贵族。所以人民战争，对应的是贵族战争，又称为古典式战争。在拿破仑之前，欧洲战争基本上是国王之间的事。战争是政治的延续，谈得拢就谈，谈不拢就打。打的目的是让不服的一方服，接受条件，该割地割地，该赔款赔款，该嫁女嫁女。所以打也不会往死里打，胜负一定，或者胜负预期一明确夕就停战谈和，签合约。


    所以战争不是人民的职责，人民是战利品普战利品是不参战的。所以，贵族战争是讲成本效益核算的，是有限投入。各国国王的职业军队规模都不大，因为养军队太贵。在拿破仑之前的军界，主流的看法是该尽量量避免战斗。战争像两个或多个“绅士型”国王间的格斗，战术上进退退，很少赶尽杀绝；战略上以消耗对方为主，而不是以消灭对方为主。妥协是战争的唯一目的。但拿破仑横空出世，坏了这个规矩。拿破仑开创了人民战争，人民战争就是无限投入的举国军事体制。靠着法国民命的革命热情，实现了人民战争两个基石。


    一是把国家的一切人、一切资源，都投入战争，这就是人民战争的汪洋大海。二是新的征兵制，革命政府国会通过的相当于征兵法案的命令，于'
