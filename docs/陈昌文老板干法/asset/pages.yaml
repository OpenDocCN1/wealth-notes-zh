  md: '老鹰是岩鸽的天敌，岩鸽巢穴中那成群的幼鸽，是老鹰垂涎的佳肴。母鸽为保护子女，与老鹰斗志斗勇。当空中盘旋的老鹰闪电般冲向群幼鸽时，母鸽箭一般地向老鹰迎头冲去。老鹰立即转移目标，直扑母鸽，母鸽一个急转弯儿折向而飞，老鹰全神贯注，穷追不舍，母鸽加速飞临陡崖，突然一个大翻身，直落地面。在即将触及地面时，又突然拉起，直上云霄。身体重、速度快、惯性大的老鹰，无法适应陡然的变速，常常失控，不是撞死在陡崖，就是跌摔在地面。母鸽这一招，真可谓绝妙的“诱敌就范”！


