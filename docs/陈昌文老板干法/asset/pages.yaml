  md: '的，你真以为你的智力比我们这些刻苦拼搏的团队聪明吗？就 算有个好方法也是我们这种人先发现。所有成功的人，都是投入大量 精力、刻苦工作的结果。比如，写《穷爸爸富爸爸》的罗伯特清崎，他
    花了 10年时间才在教育人们财富方面有所成就。


    聪明的老板只与优秀的同事在一起聊天说话，布置任务让优秀的人 去完成。任何事情都要养成主动跟踪、检查的习惯。你把一件事情交给 员工去做 了，如果你不跟踪，他就可能不做或者搞砸。老板要学会指导
    方向与跟踪员工的工作进度。把不优秀的人全部开除，加大招聘力度。 公司有了优秀的人业绩自然上去了。实行末位淘汰制，形成竞争机制。 在资金允许的情况下，快速扩大规模。


    有人了 9 各种事情才好办。公司的人必须要富裕。人多力量大，人少了，每个人都不认为自己牛哄哄的，本来没那么有能力的人也在老板面前耀武 扬威。要形成离开了谁，公司也能运作良好的理念与事实。在这方面，
    节约是最大的浪费。穷人认为对的理念很多时候都是阻碍其成功的理念。 不懂，就算卖命工作，也只能贫穷。节约会让人没有斗志，心量狭小， 并且看不到机会，也找不到机会，会让富贵的人远离他。你请的员工或
    者顾问，如果不能把你教得更聪明，或者，你吩咐的事情他们总是找借口， 那么就开除他，别手软。心地善良迎接下来的只是变本加厉。


    尊重自己的时间。人都是尊重自己，才有价值，才有地位，才有前途。别人就不得不尊重你了。尊重是用实力赢来的，不是寄希望于别人讲礼貌， 别人素'
  merge: -1
