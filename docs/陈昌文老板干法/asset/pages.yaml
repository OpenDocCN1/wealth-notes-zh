  md: '# 17. 说清楚字说服与说动


    说清楚，说服，说动，老板应该把精力聚焦在哪两个字上面？


    每个老板都应该一句话讲清楚自己做的是什么业务，说不清楚，这个老板的生意必定好不到哪里去。光说清楚了还不行，说清楚了，只能勉强勉强活下去。你要想把生意做好你得有一句话说服消费者购买我们的产品与服务。如果一个老板唧唧歪歪10几句话都说不清楚他是干什么的，顾客哪里有有那么大的耐心来听你讲那么多！你的生意自然是好不了的。


    ‘那么，能一句话说动顾客购买我们的产品与服务吗？举个栗子，收礼只收脑白金。我再举个栗子，送长辈，黄金酒。我再举个栗子，人头马一开，好运自然来！我还能举很多成功的企业，他们就是用一句话来说动消费者买他们的产品的。记住不是我说清楚他们的产品，也不是说服消费者承认他们的产品与服务好。讲话的目的9不是让顾客清楚你是干啥的冒也不是给用介介绍你的产品与服务多么牛义。多么多么好，不是从理论上、现实上让顾客心服口服9而是要让顾客掏钱。所以，


