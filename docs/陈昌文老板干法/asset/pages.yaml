- pgno: 291
  md: '我们主要讨论的是第二层含义，变化。老板的市场观念应该怎么顺应时代潮流？市场观念的演变大概可以概括为以下几类。


    第一，生产观念。这是商业领域最古老的观念之一。在大家都不富裕，物质匮乏的年代，大家都认为，消费者喜欢便宜、量又足的产品。所以，在这种观念熏陶下的老板，总是在追求提高生产效率，降低成本，然后薄利多销。我们中国的很多制造工厂，血汗工厂的老板，玩的就是这种生产观念。可以说，在当今时代，已经过得很难看了。


    第二，产品观念。产品观念的老板就是一心琢磨出来个好产品。产品观念的人认为消费者就是喜欢高质量、性能水平极高、富有创新特色的产品。我觉得乔布斯的苹果公司把产品观念发挥到了极限。产品观念有一个缺点就是，很多人并没有乔帮主那样的把控能力，自己生产出来的东西，大家并不认可。


    第三，推销观念。保险公司就是典型的推销观念带动企业发展的典型。以电话推销为主，包括很多忽悠人去买股票的、买投资理财产品的企业，大多以推销观念来主导他们的企业。推销观念就是只把自己的东西变成钱，顾客买了有没有用他不管。


    第四，营销观念。这是一种什么观念呢？是直接满足顾客的观念，顾客要什么，才去计划生产什么产品。以解决顾客的需求为目标的观念，或者说根据现在的云计算、大数据，统计出人们的心理需求，然后制造一个人们想要的产品，卖给他们。'
  merge: -1
  img_proc: true
- pgno: 292
  md: '陈昌文方法之老板干法


    营销观念与生产观念、产品观念、推销观念的本质区别是身营铭观念注重买方的需要势而其他三个观念注重卖方的需要。营销观念考虑的是如何满足用户 ,才能赚到钱。而生产观念、产品观念、推销观念多考虑的是如何把自己的产品卖出去罗变成现金。


    , 在互联网时代 , 生产力极度过剩 , 物质丰富异常 , 凡是奉行生产观念、产品观念、推销观念的企业都会过得很不如意，他们会发现市场竞争非 常激烈 , 自己越来越不适应时代潮流了
    , 包括一些大牌企业 , 仍然没有 反应过来 , 而出现了衰败的迹象。


    很多人虽然听说过营销观念 , 但并没有深刻的去理解营销观念的 本质是先满足用户需求 , 根据用户需求去制造产品这样一个模式。凡是搞 明白了这种观念的企业 ,
    业绩都非常好 ; 凡是还按老套路干的企业 , 竞 争压力都很大。


    典型的就是小米手机 , 就是营销观念 , 让用户自己到官方网站上去 讨 论怎么设计这款手机 , 而小米手机玩得这么大了 , 居然没有其他手机 厂商把这种理念给学过来
    , 不得不说很多老板的思维僵化得厉害啊。


    结论就是 , 观念落后的商人肯定被观念先进的商人打得满地找牙。 营销观念就是老板应该顺应的时代潮流。'
