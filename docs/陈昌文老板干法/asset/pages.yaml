    就是在做无用功，今天不是原始社会，你无法猎杀任何人，如果可以那样，干嘛不背后一棍子敲昏完事？不仅如此，在心态上说，猎杀这种心态， 会让你心理变得阴暗。你是去猎杀对方的，这事本来就不能公开宣扬，
