  md: '做生意不在于做的时间长与短，而在于顿悟的早与晚。


    有的兄弟干了10几年，手上才几十万现金，这就是纯粹不会做生意，没有开窍。生意人每天都应该反思，争取领悟到一些什么，而不是一日一日的重复，没有变化。人生的成败往往就在一念之间罗佛法当中讲善念与恶念，比如我们愤怒的打人、吵架，酿成严重的后果，起因可能微不足道。而改变人生的轨迹也许只是随便交往了一个人或者看了一本书。


    很多人说年轻是本钱，但不努力就不值钱，不奋斗的青春意义不大。而赚钱呢？其实并不难，只要找到一个好项目，死磕两年，百万、千万富翁都很简单。


    天上最美的是星星月亮，还有嫦娥，人间最美的是真情，比如爱情，与父母之间的感情、兄弟之间的感情、团队之间的感情，但是，你若没有金钱，爱情啊、父母之间的感情啊、同事之间的感情啊，大概你都体会不到。


    富人就是不知满足的人，不断的去追求。洛克菲勒讲，尽一切可能的获取金钱，然后尽一切可能的施舍。贵就贵在能脱俗，不与众人谋划，不干众人都干的事情，自然就贵了。贫就贫在少见识，一个人贫穷就是因为少见识、没头脑、观念陈旧，哦就哦在没骨气。人必须有骨气，说到做到，完全靠自己去做成一些事情，不要指责别人，只要问题解决不了，永远是自己的错。


    你认为你可能，你就可能；你认为你不可能，一切皆不可能。当您将信心放在自己身上时，你将永远充满活力。喜欢计较眼前的人，会失去未来。富人靠资本赚钱•穷人靠知识致富，靠学习改变。我们人这一辈子不是别人的楷模•就是别人的借鉴。别人看不起您•很不幸；自己看不起自己•更不幸。'
