  md: '的愿景9告诉员工我们想要去哪里，然后给他们提供到达目的地的支持9剩下的事情9都由员工自己去做。厉害的老板9从最开始创业就要做好这样的文化建设9否则等长成歪脖子树了再想改正就难了。


