    犯了这六个错误的老板，就属于没心没肺的人，团队的凝聚力自然就很差，你这个老板当然也就当不好。大家检查一下自己，有则改之，无则加勉。


    我给大家提供一个改变的思路，其实，一切问题都是立场问题，你只需要完完全全的改变自己的心境。就是你的目的是为了成就团队成员，而不是一切为了自己，这样，大家会被感动得泪汪汪的，凝聚力、战斗力马上爆表。但是要注意，必须选择优秀的人成为你的团队核心，你才交心。自己没有判断力多弄了几个白眼球跟着自己，然后你成就他，你受了伤，只能说明你脑子不好使！'
