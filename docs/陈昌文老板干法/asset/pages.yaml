  md: '或者客户要拒绝认识我们呢？关键就在于，我们让她怀疑，这个人给我带来的坏处要比好处多！也就是跟你交往，损失远大于收益。例如你在大街上拦住一个美女，你的这个行为其实是侵犯了她的自由权益，给她带来了麻烦，故此她拒绝你也毫不奇怪。


    只有一种情况例外：当她也想认识你的时候，只有这种情况下，你主动去认识她，是在向她提供价值，而不是骚扰。当然如何判断她也想认识你是另一个话题，暂且不说。


