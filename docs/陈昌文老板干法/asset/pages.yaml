  md: '当老板不是所有事都自已上，随便插手下属的工作，下属就感觉不爽。个人意志强加到下属身上，容易打击积极性，也不能满足下属的成就感。双方的工作期望最好在前期就达成共识，中途不要表现得自已很聪明，去插手下属的工作，弄得下属不知道该怎么办了。


