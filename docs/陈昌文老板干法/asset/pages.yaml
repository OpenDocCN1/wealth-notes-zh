- pgno: 30
  md: '于是，盗贼们又追上去，把大儒给宰了。


    有人说了，你看，遇到打劫的，不合作吧，像秀才那样犟着他，他 要杀你；合作吧，像大儒那样，慷慨地把钱送他，他也要杀你。该怎么 办呢？下面我讲个牛人的故事。


    1918年十月革命不久，那时前苏联国内处于战乱之中。有一天，我 伟大的无产阶级导师列宁同志乘车去莫斯科郊区。路上，列宁乘坐的 汽车被一伙劫匪拦住。列宁同志的司机和警卫想反抗，列宁同志冷静地
    制止了他们。列宁同志要求大家，按照劫匪的要求，一一下车，双手抱 头蹲在路边，包括列宁本人。结果是，在没有暴露列宁同志身份的情况下，劫匪们抢得列宁的汽车扬长而去，列宁他们安全脱身，赶快跑回莫斯科。
    随之，列宁同志签署了肃清匪徒的命令莫斯科郊区的治安很快就好了 起来。


    可以想象一下，如果当时列宁同志罗采取非理性的对抗行为，比如 骂劫匪，像那个秀才一样教育劫匪或者还端着大人物的架子不放，像大 儒一样露出自己是个人人的形象，那会是一个怎样的后果?世界历史可
    能都要转向了。


    被打劫不是一件愉快的事情，谁也不想遇到。可是一生中，难免 有时会处于被打劫的境地。从理性的角度分析，如果被打劫的人不识 劫匪，劫匪也不认识被打劫的人歹他们之间就只存在一个矛盾一。如果被打劫的人同意把钱给劫匪，同时装出一付可怜相，求饶，让劫匪
    觉得饶人一命也没有什么不良后果，他为什么还要杀人？杀人罪与抢劫 罪相比，判刑要重得多啊。我们要时刻牢记，劫匪并不都是法盲，他们 中有些人，甚至比律师更精通法律。'
