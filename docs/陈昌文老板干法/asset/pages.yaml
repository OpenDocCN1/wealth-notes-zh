  md: '没人才。你做得越多，别人对你的依赖就越多；你越能干，你下面的人就越 不能干；你越操心，下面的人就越不操心。


    一个聪明老板要做的是不断地“推卸”自己的责任，让别人操起心来，让 别人多干事情，让别人变得能干起来。如果把自己的责任推了、卸了，如果 通过“推卸责任”让别人成长了，公司业绩自然就越增长了。


    很多老板之所以自己操心、多干、能干，就是因为周围的人不操心、不 多干、不能干，也不愿意把重要的事情交给这些能力普通的员工干，因为老 板不满意这些人干出来的话。


    其实，这就是公司成长的代价，总是要给能力差的人交学费的，人总是 要犯错误的，但只有给他们交学费，给他们锻炼的机会，他们才会成长。


    很多老板在用衡量自己的标准衡量员工，而员工是不可能像老板这么上 心努力的，因为公司不是员工的，员工有员工的水平。假如老板能做到 100分， 员工只能做到80分但没关系身老板的任务是不断的培养90分、100分的员工。而
    不是只知道让自己做到 100分。当90、100分的员工多了，企业的整体效益就上来了。


    老板只管理公司两个重要问题，一是保证企业有钱，不会倒闭；二是企业 的方向问题。除此之外，所有的问题都是具体的业务问题 不应该由老板亲自 去抓。老板都应该逐步推卸给自己的管理者和员工。


    企业就如同国家一样，君主只管政治方向正确，其他具体事务由各 个大 臣、管理者、老百姓去干。老板的方向就是自己越干越轻松，让员工忙去，'
