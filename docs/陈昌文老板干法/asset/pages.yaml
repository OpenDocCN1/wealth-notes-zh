  md: '我的一初目的，都是打造讲师团队、管理团队、领导层、领袖。不 赚钱 是做人问题，我以后只讲做人问题，讲人情世故问题，不再大块时 间叙述商业。讲人情世故、做人、态度、虔诚、感恩、尊师重道是我的
