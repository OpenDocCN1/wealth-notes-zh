    为什么讲这个？因为这让很多老板头疼。没有能力的人当不了核心 人员，就算侥幸当了核心人员，正好找借口让他走人。


    首先要明确一点：做生意的目的首先就是为了生存、赚钱，不是与 人搞政治斗争。我这个人从来，也没有精力陪谁玩政治斗争，我的目的 是要赚钱。你喜欢斗争，你回家与你老婆斗争。企业就是大家在一起分
    工合作，提高效率，赚大钱。


