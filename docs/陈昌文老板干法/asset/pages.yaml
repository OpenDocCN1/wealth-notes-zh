    # 16、用竞赛激励销售团队


    没有销售就没有金钱，公司就得玩完，就是死掉的意思！销售团队 是公司最重要的团队。俗话说火车跑得快，全靠车头带！让团队内部竞 赛的好处是，可以给平淡的工作带来工作激情和乐趣，可以纠正团队的
    不良行为、不良风气，还可以强化公司的团队文化。


    公司的车头就是销售团队。销售团队的管理并非是任意挥洒的艺术， 而是更加接近一门逻辑严密的科学。通过设立团队内部的竞争文化，可 以让销售团队快速提升业绩。


    给大家几点建议：


    第一 9 不要举行个人与个人之间的竞赛 9 这样容易引起个人与个人 之间的中伤行为与作弊行为，容易引起不满情绪。举行团队与团队之间 的竞赛，'
  merge: -1
