  md: '把别人的长处、成果拿来自己用。当然这需要你付出代价去换取 别人的劳动成果，或者换取别人的帮助。商业社会的本质就是交换。一个不懂得付出对别人有价值的东西的人9是根本不可能赚到钱的。因为
    他不懂得商业的本质，他不愿意交换。他只愿索取。也就是说不懂得 为社会做出贡献的人，就一定赚不到钱。


    有个人问我，怎么可以赚到很多钱，我回答啊：“改变自己，永远 想办法改进自己，修正自己。自己穷，为什么不学习，为什么不换套路呢？ 为什么不像强者学习呢？一年一年的重复那些傻瓜的生活节奏，那么就
    只有没钱，还想得到什么呢？”


    系替传里有句话：“穷则变，变则通，通则久”说的就是，穷了就改变。


    老板要顺应市场，永远不要去尝试改变市场的事情。虽然我最尊敬 的牛人乔布斯讲：“活着就是为了改变世界！”但我不敢讲，我只敢讲：“活着就是为了挣钱！”作为一个老板、一个领导者，永远不要讲跟你
    混的人看你不顺眼，这样的话，你讲什么都没用了。如果发生这种情况，要么他滚，要么你滚。


    与同伴沟通，与下属沟通，70%是情绪，30%是内容。所以我们能 见到很多牛叉的领导者？其实他说的都是没啥用的话。但是呢，大家就 是激情高涨，为什么？因为他有
    70%的东西在发挥作用。这才是最厉害 的领导者贸一定是善于调动大家情绪的高手。人不是机器，人是有情 绪的动物。'
