    1、 珍惜最优秀的人才。平庸的人能识别谁是优秀的人，但是他们会 嫉恨优秀的人，最终会让优秀的人离开或者毁掉。优秀的人才一般都有 个性，很难相处，但老板要学会看结果，只要有业绩，我们就要珍惜他们，
    他们才会为企业创造价值。


