    # 23、老板的市场观念应该随着时代潮流而改变


    老板的市场观念应该随着时代潮流而改变，才能活下去具才能活得 更好。


    《易经》是我们中国的群经之首身这个“易”字有三层意思，第一，简单号第二，变化；第三身不变。其实是概括了这个世界一切做事情的 法则。简单讲，就是我们做任何事情都要用最简单的方法达到目的，大
    道至简。第二势就是 要懂得变化身世间唯一不变的就是变，要顺应变化，才能在申场上存活，诺基亚没有顺应智能手机的时代，被无情的淘汰了。


    现在还有很多传统企业没有把互联网当回事，这些企业也将被淘汰。银行没把互联网当回事，结果出现了支付宝、财付通、微信，抢占了他们 很多市场，第三，不变。虽然有很多东西都在变化身但这个世界上有些
    东西是不能变的”比如你爸爸永远是你爸爸。与合作伙伴创业，你拿小头， 合作伙伴拿大头，他肯定开心些，这也是不变的人性。'
