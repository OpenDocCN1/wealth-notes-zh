    上却不 由自主的谦虚。而老板问另一个业绩不如我的家伙想不想当经理，那 家伙马上说，自己当了经理会带领团队业绩翻倍，并且自己天生就是当 经理的料，当业务员屈才了。结果，那家伙当了经理。我呢，本来是
