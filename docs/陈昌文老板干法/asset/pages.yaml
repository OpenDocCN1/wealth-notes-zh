  md: '谁捉拿了王成，赏钱 1 万。结果，王成的侍从就绑着王成出来 To 何真看到王成后，笑着说，你怎么养了一个白眼狼啊！王成很惭愧。 绑王成的侍从就问何真要赏钱。何真如数给他，接着派人烧了一大锅汤，
