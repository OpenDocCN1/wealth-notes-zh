- pgno: 117
  md: '人，就是异类。这些人潜意识都想让你变得跟他们一模一样，让你认同他们的思想。只是，这永远也不可能。


    如果我们的意识形态与他们一样了，我们就再也得不到他们的关注，再也赚不到更多的钱了。其实有很多人，本来有一个优秀的梦，心底里本来有一颗成为强者的种子，可是，被自己的亲人、朋友，甚至另一半，用“爱”的名义抑制了灵魂。


    成功者都有一个特质，他注定是孤独的。为什么古代的王把另一个王抓住，很少有马上杀掉的？总要聊上几句？就是因为孤独，也因为惺惺相惜。


    # 3、哪几种人适合当老大


    哪几种人适合当老大？


    第一种，从小喜欢当孩子王。喜欢当班长、劳动委员、班干部，喜欢指挥别人，管理别人的。养成了一种天性，见人就能炉火纯青的指挥别人。别人也不明白怎么回事就听他的话，干活去了。


    第二种•表演意识特别强的人。里根总统就是演员出生罗施瓦辛格也是演'
  merge: -1
  img_proc: true
- pgno: 118
  md: '员，当了州长。其实我们中国很多大贸包括部分当官的，都是“演戏”高手。并且特别会操心，大家不自觉的就被“迷惑”并且心甘情愿的跟这种人干活。


    第三种罗喜欢吹牛的人。当老大不会吹牛就不行，你也可以叫画饼，也可以叫给员工愿景。比如，你上学的时候，让小弟跟你祝贺你怎么吹呢？你说弊端欺负你，老子替你收拾他。天天吹，小弟就会交保护费。马云当年创业的时候，十八个人挤在一个屋子里，马云说，以后每个人拥有50套房子。华为的任正非给大家说，以后大家买个大点的房子，阳台一定要大。大家问为什么？任正非说，因为以后挣很多钱，钱要拿到阳台上晒晒，不然要发霉。当老大就是要吹牛，乐观的吹货其实创业者，都必须是乐观的人。.


    第四种：大方的人。如果你前面三招罗或者说三种人，你都不会做，还有最后一招，大方。吝啬的人，是一定当不了老大的。《水浒传》里面的及时雨宋江，就是个大方的人，别人要什么，他就给什么，所以他
    是老大。梁山最开始的那个首领叫白衣秀才王伦，别人要啥他都舍不得给，所以林冲把他干死了。


    什么叫大方呢？比如你有一瓶好酒罗你拿出来让大家喝。历史上大名鼎鼎霍去病，十七岁被汉武帝任命为嫖姚校尉，开始建功立业，为什么他能屡战屡胜；在河西战役期间，汉武帝特地从京城送来一坛美酒，霍去病没有独自享用，而是将酒倒入泉水中，让全军将士饮用，将士们感动得流泪，这战争不打，就已经胜利了。后来，此泉就称为酒泉，当
    地也就以泉命名。'
  merge: -1
