- pgno: 245
  md: '+   1、 激励机制。


    明确写出来什么样的表现能得到报酬与晋升？明确按照制度来晋升。 什么样的结果与行为会受到处罚，甚至淘汰。


    +   1、 明确需要什么人。


    写出来公司到底需要什么样的人，并且用合理的方法挑出这样的人 来做榜样。榜样的力量是无穷的，对榜样给钱，给职位。伟大领袖毛泽 东就经常树立榜样，就能带动一大帮人跟着学。


    +   1、 规定清楚我们如何做业务多要达到什么样的目标。


    要让大家知道公司的目标，老板要天天讲。公司的规范也要天天讲， 老板讲完，领导讲；领导讲完，员工讲，并且还要分组讨论。对遵守公 司规章制度的人一定要有奖励，对犯错误的人要有惩罚，奖罚从来都是
    老板的利器。比如，想要员工按时上班不请假，可以有全勤奖。请假当 然就要扣钱。


    其实每个公司 …… 的问题都差不多，只有 …… 是特定的问题，需要 特殊处理。而大多数老板连这 …… 共同的问题都处理不好。


    # 5、 企业必须重视制度建设


    这几年，国学、传统文化受到了广泛的重视，很多地方都轰轰烈烈 掀起「谪學幾」述是个好事情。与此同时，像传统管理思想、国学管理 思想等也流'
