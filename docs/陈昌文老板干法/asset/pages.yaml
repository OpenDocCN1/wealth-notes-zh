  md: '# 6、人有三件混社会的武器


    第一多思考的方法务理性的去看待这个世界多以远见而不是以情绪来做人生决策。


    比如很多愤青只要一说日本，他们就破口大骂。连好的东西都否定了。岂不知，我们中国从日本那里学到了很多东西。从科技手段，到现代文明、企业建设，到思想，我们都从现代日本人那里学到很多。不要情绪一来了，就只知道否定。


    第二价值观。


    我们碰到一个事情，要先思考多然后才用价值观去判断对错。不能还没有思考，直接用价值观判断对错。比如. 有一种经商的观点是“客户永远是对的”。如果认为客户永远是对的，就要无限制的满足客户要求。真正碰到无理取闹的客户，你又满足不了，然后现实与你的价值观就发生了冲突，就会难过。


    如果我们先思考一下。有的客户就是不对，那么就可以修正你的价值观。也就是说，喜欢思考会让你不断的学习与进步。而直接用价值观判断对错，'
