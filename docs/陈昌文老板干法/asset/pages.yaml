    基本上，这7条不用全用，员工的执行力就能提上去了。


    # 15、如何管理业务员


    业务员是最不好管理的群体，管好了，公司业绩飞速上涨，管不好，就等着破产。业务员岗位不是标准岗位，他们的工作很难从日常工作中去量化。比如，你看一个业务员表面很努力的在跑业务，但他实际上在外边网吧里玩。有的业务员嘻嘻哈哈好像不做事，但业绩却很好。这就让很多老板很头疼。'
