  md: '# 陈昌文方法之老板干法


    比不失言高太多了！不失言，大不了我不说话就是，有人天生就 不失言，因为他性格就不爱说话。但不失人，要求你该说的话一句也 不要错过，该说话的人一个也不要错过。


    举个轻松一点的例子，你在地铁上看见某姑娘或小伙，一见倾心， 却没有鼓起勇气上去要电话号码。之后魂牵梦萦，第二天到处微博、微 信求转发要找到他（她），这就是该说的话没说，失人了。因为一句话
    没说，面对面你就失去了他（她），或者是爱人，或者是能决定你命运 的贵人，或者是能辅佐你做大事的人才，或者是能与你一起成败的伙伴。


    岂不可惜！


    人的见识深浅不同，我该不该跟他说话，说到什么程度，就要因人 而异。如果造诣精深、事理通达，我却没跟他说话，那是我没有知人 之明，错失了人才！君子听一句话，就知道他是不是丹。人身明不明白那事。
    是与不是，明与不明身就在一言之间。所以遇到能跟他说话的人罗马上 就要说，才不失人啊！高手过招。就是一句话，这句话你没说，就错 过高手了。'
