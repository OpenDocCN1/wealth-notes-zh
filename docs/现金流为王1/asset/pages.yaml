    # 新加坡優質 REITs  解構示範


    對投資者來說，以上文七大因素分辨優質和「化妝」REITs，基本財務知識十分重要。財務分析並非千篇一律，要視乎不同行業、不同公司的特性、因素作出相應分析才有意義。筆者以自己鐘情的一隻新加坡REITs——大中華豐樹商業信託（Mapletree
    Greater China Commercial Trust，SGX：RWOU）為例，示範如何解構 REITs 的財務特性。


    大中華豐樹商業信託的主要資產在香港，收入 70% 來自位處九龍塘最繁忙交通交匯處的優質商業物業——又一城（Festival Walk）。投資該REITs 主要是看中其資產質素及未來租金增長。


    # 負債及流動性


    投資REITs 如投資一間公司，除分析物業及管理屬質量外，亦需分析REITs 本身的財務情況。以大中華豐樹商業信託為例，其負債比率為


    ![](img/034fb7f1e667b45ed25196fc40e47173_79_1.png)'
  merge: -1
  img_proc: true
- pgno: 80
  md: '40%。負債比率即是總負債/總資產的百分比，即負債比率愈高，負債水平亦相對愈高。


    負債包括流動負債（Current Liability）及非流動負債（Non-current Liability）；資產包括流動資產（Current Asset）及非流動資產（Non-current
    Asset），因此當分析公司的流動性（Liquidity）時，不能只看負債比率，亦同時要看流動比率（Current Ratio）及速動比率（Quick Ratio），比率數字屬高或低亦需視乎不同行業。流動比率是流動資產/流動負債，因此流動比率愈高，公司的資產流動性愈高。如果公司的資產主要是非流動資產，但負債主要是流動負債，就需留意公司是否存在短錢長用的問題，當流動負債到期時（1年內到期），流動資產是否足夠償債，如不充足，公司是否有能力作再融資，使之成為長期負債，又或公司所持固定資產是否能夠變現成為流動資產以應付短期債務。如公司有以上的问题，就代表該公司可能存在債務及流動性的問題。


    # # 流動性與再融資能力


    大中華豐樹商業信託持有的現金水平不高，流動性會出現問題嗎？根據其截至2016年6月30日的財務報表，公司資產集中於物業投資資產（S$58億），而公司負債亦主要集中於非流動負債（S$21.69億）；流動資產方面，公司手持現金僅S$1.42億，短期銀行負債S$3.61億，流動比率只有0.32左右，以一般企業來說是極低水平，然而，這是否代表它的流動性嚴重不足？


    答案是，REITs持有大量投資收租物業，一般不會大量持有現金，因為一隻房託基金如果大量持有現金，已不是流動性好與不好的問題，而'
  merge: -1
  img_proc: true
- pgno: 81
  md: '是一種浪費。對投資者來說，如果REITs持有大量現金，那為何要投資該REITs，還要付基金管理費用，不是很傻嗎？一隻大量持現金、流動性「十分好」的REITs代表它沒有做好資產配置，是流動性泛濫，那該REITs還有投資價值嗎？


    其實，單純以流動比率的高與低，去評估一家公司的流動性是低手做法，流動比率只是一個參考值，要評估其流動性尚要看行業特性。房託特性是持有大量定期產生現金流的物業，物業視為非流動資產，而房託一般持有現金不多，同時公司如果有流動負債，看似是短錢長用，流動性不足。然而，房託基金更重要的特性是其極高的融資及再融資能力（Refinancing
    capability），其物業在會計上雖是非流動資產，但房託已將其證券化（Securitization），集資及融資能力是一般企業不能比擬。


