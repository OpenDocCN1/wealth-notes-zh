  md: '# 分清面息率與孳息率


    上述是債券首次發行（IPO）時的情況，假設投資者在IPO買入的價格是$100票面值（Par Value），但債券有二手市場，隨著市場變化如市場利率、公司經營情況等因素有變，債券價格會根據供求浮動，價格可升可跌。假設投資者在二手市場買入債券，而買入價格是$97，到期時發行人仍然會償還$100予投資者，中間投資者每半年仍會收到發行人按$100票面值以票面息率計算的利息。假設票面息率是6%，買入價格是$97，到期時收回$100，即是到期時多賺了3%；債券年期為3年，平均每年多收1%，所以實際收益率應為6%+1%
    = 7%（實際計算方法會較複雜），比票面息率的6%高，而這個實際收益率我們叫做孳息率（Yield-to-maturity/YTM）。所以買債券時投資者除了要留意票面息率，更重要的是孳息率。


    # 槓桿直債的操作


    談論了債券的基本概念，接着會講解債券投資的實戰技巧和槓桿操作。債券投資實戰可講很長篇幅，由選債、公司基本面分析、財務分析、債價能力、市場利率走勢、債券Duration、融資成本，以至實戰落盤等等。
    為免篇幅太長，太多理論，筆者決定先以實戰案例向讀者講解，太學術的理論在此不贅。先旨聲明，以下僅供參考，不涉及任何推蔭及投資建議。


    ![](img/034fb7f1e667b45ed25196fc40e47173_92_0.png)'
