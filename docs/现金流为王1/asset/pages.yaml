- pgno: 98
  md: '# 3. 價格風險（Price Fluctuation Risk）


    價格風險顧名思義就是債價下跌，多數因為公司不利因素及利率上升。公司不利因素意指令公司信貸風險上升的因素；而利率上升導致債價下跌，則視乎債券的年期（Duration），因關乎債券價格對利率變化的彈性。基於「回歸理論」，利率上升對短期的債券價格影響較少，愈近到期日，債券價格愈tend
    to be 100，即愈接近票面值；相反，債券年期愈長，債券價格對利率變化的敏感度愈大。因此對於滿足於債券現有Yield（不是coupon rate）的投資者來說，只有持有債券至到期日，便不需要理會債券的波幅，如債價大幅上升，投資者就財息兼收，可謂進可攻退可守。


    但槓桿債券投資者要留意，如果債價大幅下跌，觸及補倉點，投資者是需要於指定時間內補倉的，因此我建議投資者不要用盡債券的槓桿成數，有必要留一點buffer。


    # 4. 流動性風險（Liquidity Risk）


    流動性風險即是債券的流動性問題，投資者是否容易在市場上沽出債券。


    # 預期加息 避選長年期債券


    大家預期美國將會加息，故應盡量避免選擇年期太長的債券，特別是没有reset terms的永續債券（Perpetual Bond），除非你認為發行人非常穩健，同時收益率（yifield）亦都滿意，值得長期持有收息，同時你有能力'
  merge: -1
  img_proc: true
- pgno: 99
  md: '持有至到期（永續債券沒有到期日），收回所有本金。此外，避免選擇評級高但收益率低的債，這些債券較受加息影響。當然，對同時評級不高的債券，你又可能擔心持有至到期，因此還債是一門藝術。對槓桿債券投資者而言，更應選擇穩健的企業（穩健也不一定代表高評級低收益），高槓桿比率（但也一定要用盡），並宜保留一定倉值（Margin
    Value）。為對沖利率上升令融資成本增加，投資者可選擇購入利率掉期以鎖定為固定利率。


    # 債券一手與二手市場


    大部分香港人都沒有投資債券的經驗。與外國相比下，債券在香港實在是太不流行，大部分投資者都不外乎買樓收租或投資股票。每當提到債券時，大部分人的反應是聯想到「雷曼債券」，認為債券投資都是高風險的，反映雷曼爆煲事件，令香港人留下了不能磨滅的陰影。幸好政府近年多次推出通脹掛鈎債券（iBond），才令大家有機會接觸到債券。


    投資世界從來都是講求門檻的地方。一手市場IPO的債券，只有專業投資者（Professional Investors，簡稱PI）才可參與，要求是800萬港元流動資產，可向券商申請。由於投資一手IPO債券具一定門檻，非PI人士要買債券只能通過二手市場，因此一般而言，新上市的IPO債券在市況正常的情況下，在二手市場放售時都是高於票面值的溢價債券（Premium
    Bond），PI一般的情況下可以說是穩賺，而且PI認購IPO時更只需要「篤手指」，最高可達100%融資，基本上是無本生利，與券商共同分享利潤，俗稱「分餅仔」。


    ![](img/034fb7f1e667b45ed25196fc40e47173_99_0.png)'
  merge: -1
  img_proc: true
- pgno: 100
  md: '一般散戶如資金相對充裕，並具一定投資知識的，可考慮於二手市場買入投資債券。債券的交易方式與股票不同，股票一般是場內交易，債券則屬場外交易（Over-the-counter：OTC）。場外交易並不是透過一個電子化的中央結算平台自動配對進行交易，相反，它是以自營買賣的模式為主，當然過程中也可以選擇透過代理協助進行買賣。因此，買債券的過程如買樓，一般人買賣債券可透過證券行，而資產達到私人銀行門檻的投資者可透過私銀買賣，兩者分別在於私銀融資比例較高和融資利率較低，但佣金會比證券行貴，其他方面如買賣流程等則分別不大。


    用買樓比喻買債券，大家較易明白。私人銀行和證券行就如地產代理公司，客戶經理就如地產經紀，債券就如地產代理公司的樓盤。由於債券是OTC交易，因此買賣雙方是透過買方與賣方代理議價的方式進行交易。作為代理（銀行或證券行客戶經理），他們亦明白債券投資者一般為長線投資，持貨時間較長，而客戶經理的收益率純粹為0.15%–0.5%左右的交易佣金。投資者有時甚至持有至到期日，客戶經理連賣出佣金都落空。


    # 落盤有技巧 省掉成本


    在已經「無屯肉食」的交易下，客戶經理很自然會想盡辦法在不透明的OTC市場上取得最大利益。由於證監監管嚴格，經紀們當然不能「出術食慣」，最終的成交價格必然是公開透明。站在證券行的立場，要獲得最大利益，唯有儘可能撮合自己行的買家與賣家成交，這就解釋了為何往往證券行報出來的債券價格的買賣差價這樣闊，皆因證券行希望留多一些buffer撮合自己行的買家與賣家，儘管其他行的債券出價更好。'
  merge: -1
  img_proc: true
- pgno: 101
  md: '舉例，我希望買入一隻債券，並向經紀下達買入指令。假設該債券上一次成交的價格為$103，經紀一般會報價$104-104.5左右，儘管市場上其他行有些賣方可能願意以$103出售。經紀一般會以本行的出售盤為優先，並主動詢問本行的賣方是否願意以市價$103沽出，如果賣方不願意，經紀會追價至$104，甚至追到底價$104.5，總之以撮合本行的成交為首要目標，如果成功，經紀便能賺取兩邊佣金。


    當知道上述的實際操作情況，下單策略便需要適當調整。筆者一般的做法是，當經紀報價$104.5，筆者會要求試$103，跟經紀說不介意等待，如果一段時間都成交不了才稍作調整。當經紀發現本行的盤不能滿足時，最後必然會在其他市場上尋找合適的沽盤進行交易，投資者從而能省掉$1-1.5的成本。要知道債券的投資金額高，$1-1.5的成本已非常大，以一手債券20萬美元為例，1.5%已相當於3000美元或2.33萬港元，金額愈大，實際差價數字便愈大。懂得上述的實戰落盤技巧能讓你省掉不少。


    # 哪裡可獲免費債券資訊？


    由於債券市場是OTC Market（Over-the-Counter），透明度較低，坊間提供的免費資訊不多。零售銀行門市一般沒有提供債券的資訊，不少朋友反映銀行會推銷其他理財產品或債券基金。原因如上述所說，第一是零售銀行的客戶服務員不認識債券；其二是債券佣金不高，銀行基本上「無乜肉食」。而且債券所需的投資知識比較高，一般以專業投資者為主，對推銷者的認知要求亦較高，因此銀行一聽到債券二字，二話不說就推銷你債券基金。


    ![](img/034fb7f1e667b45ed25196fc40e47173_101_0.png)'
  merge: -1
