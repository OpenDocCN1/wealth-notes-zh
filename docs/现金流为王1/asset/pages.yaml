  md: '# 2.1 REITs + Bond 投資法

    可攻可守


    筆者當年決意辭職創業去找尋理想，但創業風險不少，為了好好安頓家庭所需，我積極做好資產配置，創造一個具穩健現金流的被動收入組合（Passive Income
    Portfolio），以應付家庭每月的經常性開支。


    身為有家庭的人，上有高堂下有妻兒，一家大細都等我開飯。正如不少讀者朋友都體會到，隨著近年通脹加劇，銀紙愈來愈不值錢，一個中產家庭基本開支每月 7-8 萬是必需的（基本開支包括供樓、水電煤、管理費、差餉、家中雜費、養車、請工人、照顧長輩、小朋友學費、食飯、基本娛樂、醫療保險等等），當然要壓縮開支也總有方法，在此不贅。因此，建立一個被動收入組合，能持續及穩定產生現金流，對每一個典型中產都相當重要。


    # 目標：被動收入不低於 12 萬


    當時，筆者對「財務自由」的目標是：以每月基本家庭開支 8 萬元計，被動收入必須不低於此開支的 1.5 倍，即 12 萬，因為要靠被動收入仍可'
