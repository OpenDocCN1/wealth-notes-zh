  md: '# # 2.10 避開「變種債券」

    Coco Bonds


    跟政府給你懇賺的iBond相反，市場上有些已變種的債券，例如幾年前才面世的Coco Bond，其特性與固定收益產品的原意背道而馳，投資者要小心。


    早在開始寫博客前，筆者已多次向身邊朋友解釋Coco Bond的風險，奈何很多身邊朋友竟跟筆者說，經banker不斷游說，按奈不住買了數隻大銀行發行的Coco
    Bond，貪其大銀行兼高息，而且私銀更提供高達50-60%的融資率，槓桿後回報返1x%，好不和昧。但在一眾Coco Bond投資者中，有多少人真正明白箇中風險？因此，筆者希望讀者注意一下相關風險，明白穩中求高回報才是致勝之道。


