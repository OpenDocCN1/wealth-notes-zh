  md: '![](img/034fb7f1e667b45ed25196fc40e47173_137_0.png)


    # ### 3.4 從貿易生意學經營策略


    常說「創業難，守業更難」，筆者作為一個走過創業路的人也十分同意。要找一盤一開始就賺錢的生意一點也不難，但要令一盤生意持續賺錢卻一點也不容易。原因很簡單，因為市場是多變的，在資訊流通的年代，別人看見你的生意賺錢就會即時加入市場與你競爭，除非入場門檻很高。供應多了，價錢自然下降，導致毛利收窄，直至沒有新參與者加入，這其實亦反映了這盤生意對潛在市場參與者來說已不再吸引，這就是經濟學的市場均衡狀態（Market
    Equilibrium）。這亦正証说明了「創業難，守業更難」的道理，守業讲求的是經營策略，遠比創業的層次高。要建立一盤成功的生意，如何成功建立護城河（Barrier
    of Entry）是非常關鍵。


    對一故有意創業的年輕人來說，除非你爸是李生，否則沒有家底支持，是不可能以「資本」作為生意的護城河，去想「資本運作」也是徒勞無功，因為你还未到那个層次。對於沒有資本實力的創業者來說，最容易做的生意就是貿易生意。貿易生意基本上是一門左手交右手的生意，需要的


