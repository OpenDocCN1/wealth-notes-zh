  md: '# 一次性收益不能複製 不應奢望


    世界上有不少人都有機會獲得一次性收益，如中六合彩，又或是早年投資物業賺了大錢，但樓市不可能一直以同一種方向同一種速度上升，而市場又沒有限制或阻止其他競爭者。因此，筆者認為樓價升值的收益，只能算是一種一次性收益，姑勿論是運氣使然與否，這類一次性爆炸性收益也難以持續。活在香港，大家應該不難遇到以上情況，同樣情況金融界也存在。筆者以前在行內都有不少舊戰友有相似經歷，在因緣際會下發現某些套利/獲利的途徑，但套利的window不會永遠打開，稍縱即逝。除非金額相當大，一世也使不完，否則大家都會面對同一個問題：「下一步該怎樣？」


    其實賺錢往往不只為了賺錢，重點是過程中還獲得了甚麼？資金？關係？人脈？經驗？而怎樣利用這些金錢以外的資源才是創業成功的關鍵。一盤生意、一家自己的企業、一個屬於自己的品牌，才是真正長遠有價值的資產。


    企業賺錢，除了錢落袋裡的現金流外，公司的業績及Goodwill也同樣重要。業績就是公司盈利的紀錄，即使所賺的現金已全部分配，企業損益表上的業績也是十分有價值，證明了企業的盈利能力。有了業績，就自然有Credit/Goodwill，公司慢慢就有融資能力。這些都是企業可持續性發展和成功的要素。套用資本市場概念，以市盈率先（P/E）10倍計，公司一年賺一千萬，公司市值就是一億。因此，不要小看業績的價值，它比單純賺錢所能獲得的其他好處要多很多，這點值得大家深思。


