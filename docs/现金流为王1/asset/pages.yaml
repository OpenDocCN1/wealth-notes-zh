  md: '# 2.3


    # 踏足私銀

    債券選擇更多


    很多炒買個股的散戶，都會發現到頭來一場空，中間有贏有輸，但最後輸錢佔大多數，打個平手已算是「執身彩」，卻免不了輸掉時間，以及資金的機會成本，即投放於其他投資的潛在收益。這些例子在賭場賭客身上也屢見不鮮，贏完錢卻不願離場，最後輸掉本金。


    # 散戶愈多 風險愈高


    其實，散戶開始時愈贏得多就愈有風險，因為他們深信自己的贏錢方法才是王道，或者自己行正好運。散戶只有從輸錢中，才會領悟到以炒買股票所賺的錢不能長久，炒賣幾隻股票所賺到的金錢是否足以令你日後生活無憂？如果自信可以的話，那閣下必定天生有炒股的敏銳觸覺，但買賣買賣所付出的時間也是成本，是勞力換取回來的收入，仍然未能做到真正的「自由」。


