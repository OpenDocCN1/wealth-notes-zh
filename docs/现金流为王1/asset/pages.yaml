  md: '# 銷售策略三部曲 加速資金回籠


    筆者的銷售程序一般分為三個階段。第一個階段的定價會大幅低於市價，假設項目總成本為3000元/呎，市場的小單位呎價為5000元/呎，那麼此階段的銷售定價約為4000元/呎，低於市價1000元/呎，吸引投資者較快入場，同時讓資金迅速回籠。第二階段銷售時，大部分單位接近完成，即接近現樓交易，因此定價較接近市價，但仍低於一般市價。完成第二階段時，由於銷售金額已足夠我於成交日支付全數樓價金額有餘，故第三階段並不急於散貨，並會提價至市價，令第一及二階段入市的投资者能夠撝出獲利。而追班投資者亦自然地成為我的「攤臺」，會經常要求下次有項目時第一時間通知。獲得投資者捧場，亦令筆者每個項目都能在第一階段開售時就做到迅速資金回籠。一般而言，筆者大部分的项目都能做到成交日前售出所有單位。


    以上述為例，項目總成本價為3000元/呎，平均出售價為4000元/呎，項目的利潤就是1000元/呎，回報率即1000/3000 * 100% = 33.33%。由於筆者只用了20%的訂金便能起動整個項目，加上50%的工程費用及厘印實用，故成交日前所動用的實際資金僅1000/呎。因此，該項目的資本回報率（ROC）實際為1000/1000
    * 100% = 100%。在半年左右的時間，做到100%的資本回報率，是相當不錯的成績。


