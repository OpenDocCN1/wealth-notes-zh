    創業，執行力確實十分重要，當然不是每個人都適合創業，要好好評估自己的性格和特質。每人每日其實都可能曾有少量機遇擦肩而過，能否捉緊就是關鍵。當想到，就應去即時執行，坐言起行，莫待明天，很多時間拉長了，動力就會減低。起步永遠最吃力，當起步後慢慢會遇到不同的問題，遇到問題就去解決，過程會學習到不少。問題遇到愈多，能學到的就愈多，成功率就愈大，因你慢慢會成為該市場的專家，知道的比其他人多，漸漸形成一種優勢。'
