- pgno: 196
  md: '# 考量自身實力 才選擇相應消費


    現今世界，人們不懂得自我分類，作出理性的消費決定。所謂的自我分類，即是綜合考慮個人現時的收入及將來所能產生的收入再加上增長，亦即是個人的綜合消費能力的分類（傳統分為基層、中產、富裕及富豪），從而準確地評定自己屬於哪個階層的消費者。即使未能做到綜合考慮現時及將來的收入，至少也應知道自己現時此刻是屬於哪一類別，再作出理性、相應的消費決定。


    面對市場的Wide range of choices，不同階層的消費者出現自我消費能力誤判的情況十分常見，更有相當一部分人消費前，根本從沒考慮過


    ![](img/034fb7f1e667b45ed25196fc40e47173_196_0.png)'
  merge: -1
  img_proc: true
- pgno: 197
  md: '自己屬於哪個消費類別及可承擔能力，最後出現收支不平衡。年介中年雖滿有計劃但沒有條件實行，甚或面臨退休才發現自己根本沒有條件退休的大有人在，但事實上亦是可以預期的結果。普遍人會抱怨香港樓價遠超負擔能力，政府沒提供足夠資源，沒有醫保，沒有退休保障。這可能是事實，然而不少人本身不是條件不足，不是貧窮，不是缺乏消費能力，而是消費前沒有準確評定好自己的消費者類別而作出相應而合理的消費，陷入「中產貧窮」的局面。


    香港大部分人也會認為自己是中產，不是說不準確，但以現今社會來說，「中產」的範圍實在太闊，若以現今社會的消費選擇而言，說「中產」可分成十個階級也不太過。家庭入息五萬元是中產，月入十多萬又是中產；有家庭每月開支三萬，亦有不少家庭每月開支超過十萬。因此，消費模式是一個重要的因素。


    社會進步，生活水準高了，消費選擇增加是事實。以幼稚園為例，有免費的學券幼稚園、有每月二千元學費的非牟利幼稚園、有三至四千元學費的私立幼稚園，也有五至八千元的名幼，也有過萬元學費的國際學校，偏偏不少「貧窮中產」、「窮忙中產」寧相選擇學費昂貴的名幼及國際學校。當然，負擔得起是沒有問題的，但不少家庭一邊讀一邊叫苦連天。手機有六千多元的iPhone，有一千多元的國產小米、華為，功能差異很大嗎？對某些消費者來說可能是，但對筆者而言差別不大，但價錢可差得遠。然而，市場普遍消費者都是使用iPhone級數的手機，這是否反映社會大部分人都富有了起來？不是，這只是消費模式的轉變。


    ![](img/034fb7f1e667b45ed25196fc40e47173_197_0.png)'
  merge: -1
  img_proc: true
- pgno: 198
  md: '住屋抑如是，市場上愈來愈多studio flat新樓，說穿了就是豪宅割房，small lump-sum is king。當大家說買不起樓或換不起樓的同時，又去買全套數萬元的Dyson系列去吸那300呎實用面積的「假豪宅」私樓，用後將Dyson放入迷你倉。事實上，不少富裕家庭即使居住干呎豪宅，也只是用普通吸塵機或掃把去清潔家居。消費前要想清楚基度是「必要」，甚麽是「想要」。


    # 開支愈高 愈難財務自由


    香港人喜歡比較，消費品要比較，學校要比較，住屋要比較，就連結婚擺酒甚至影結婚相都要比較，別人去日本我要去歐洲，但又有多少人在做這些消費決定之前，有想清楚自己其實是屬哪一個級別的消費群？有多少人的消費能夠理性地作出對應自己消費類別的消費？今天戶口裡有100元，不代表你就有100元的消費力，你今天消費了100元，那明天怎麼辦？今天你作出了超出自己消費能力的消費，將來你就得作出犧牲，很公平的。


    財務自由是一個相對的狀態，是被動收入與開支的角力。一個每月開支二十萬的家庭要財務自由，被動收入每月就不能少於二十萬。魚與熊掌：你想要「今天的享受」還是「明天的自由」？相信每個人答案也不同，但這是你再人的選擇。'
  merge: -1
  img_proc: true
- pgno: 199
  md: '# ## 富中產或窮中產 關鍵在可持續現金流


    香港有不少中產人士，收入高，表面上財務狀況非常健康。然而收入來源很單一，主要靠每月工資，是靠勞力和時間換取的主動收入，因此從結構上看，長遠並非如表面般健康。假如經濟不穩，原來穩定的工作突然變得不穩定，或十多年後開始計劃退休，而小朋友十多年後仍在中學階段，同時計劃海外升學，開支只會有增無減，屆時現金流狀況便會由健康變為不健康。當收入無明顯增幅而開支增加，人的壓力自然增加，甚至需要延遲退休計劃。


    同為中產，即使淨資產及每月收入相若，有部分可如期50歲退休環遊世界，有部分卻到50歲時財務狀況不但沒有進步，反而倒退，最後需要延遲退休。原因為何？


    ![](img/034fb7f1e667b45ed25196fc40e47173_199_0.png)'
  merge: -1
  img_proc: true
- pgno: 200
  md: '![](img/034fb7f1e667b45ed25196fc40e47173_200_0.png)


    # 「收入可持續增長」是關鍵


    兩種中產的分別在於「收入可持續增長」的問題。無論你職位多高，用勞力獲取的收入（主動收入）是需要用時間換取，但總有一天你會停下來（假如你有退休計劃），打工就是手停口停。要改變上述情況，人其實應及早計劃，開始重組自己的收入來源，增加並分散個人被動收入，將集中力放於提升收入的可持續性，而非單純依靠每月工資支持生活，或單單集中於資本增值的投資。要強調，筆者並非反對資本增值的投資，而是希望讀者明白持續現金流的重要。賺錢每個人都想，但風險、不確定性、流動性需要同時考慮。'
  merge: -1
  img_proc: true
- pgno: 201
  md: '債券、REITs不一定是王道，只是在衆多投資之中，屬較為簡單直接而又能夠計到數的投資。有人說，加息周期為何還持有債券和REITs？首先，加息周期待何時到來筆者不知道，但各國開始實行負利率是已知事實，美息何時加至「正常」水平則是很大的問號，而在新常態經濟中，何謂「正常」水平利率是更大的問號。可能過一兩年，美聯儲會告訴你正利率原來就是現在的「正常」水平。


    # 計不到數的投資 只帶來不確定性


    投資REITs，關注的是其資產質素，因REITs的90%盈利會派息，基金旗下的資產當遍、租金收入直接影響派息的可持續增長，相對於持有低回報的本地住宅物業，無論是回報率、經濟規模效益、資產流動性，REITs都更勝一籌。至於債券，選擇短年期的債券，只要投資者能夠持有至到期，而發行人又沒有違約，即使做了槓桿，只要控制好倉值比例，也是進可攻退可守的投資。


    組合中配置計到數的投資有助你去計劃，至於在短線賺價的投資，除非是套利，否則在筆者看來不是計劃，只是增加組合的不確定性。中產家庭，宜及早及分散收入來源，建立多種被動收入，將過度集中的固定資產減磅，或利用借貸增加資產流動性，從而慢慢提升每月現金流水平。


    一個人的狀務狀況是否健康，長遠來說，應看結構是否健康。


    ![](img/034fb7f1e667b45ed25196fc40e47173_201_0.png)


    第四站：投資有法

    真正財務自由'
  merge: -1
  img_proc: true
- pgno: 202
  md: '![](img/034fb7f1e667b45ed25196fc40e47173_202_0.png)


    # 退休人士的資產「鐵三角」


    香港有不少中高產人士，即使人工高，職位高，努力工作多年，供樓多年，臨退休前終於將層樓供完，發現子女到了成家立室的年齡，將一層供滿的樓送轉贈。在這班年近退休的中高產人士當中，不少都與大多數人一樣面對著同一個問題，就是退休時都欠缺新增的現金流。


    老一輩的概念往往是「食老本」，將一筆退休前儲落的退休金每年「就住使」，而沒有想過建立一個穩健而具現金流的投資組合，只利用投資組合定期產生出來的現金流支持退休後的日常生活開支，不用蠶食到本金一分一毫。


    他們退休時往往手持數百萬現金，有一到兩層供完的自住樓和收租樓，沒有負債。他們的財務狀況很簡單，一句講晒，就是財務狀況「太健康」。太健康表示很穩定，穩定是因為沒有負債，同時亦代表資源沒有好好地利用，但這又是否代表沒有風險？'
  merge: -1
  img_proc: true
- pgno: 203
  md: '![](img/034fb7f1e667b45ed25196fc40e47173_203_0.png)


    # 不投資 不代表無風險


    前輩常對筆者說，投資有風險，不投資就沒有風險。在現今世代，這句話是不正確的。在新經濟模式下，每一個人都是投資者，即使你沒有意識去作出「投資」行為，但實際上你也是在投資。具體一點來說，即使你甚麼也不做：每天上班，每月出糧，工資儲起，持有現金，你就是在投資現金資產，在賭銀紙升值（銀紙的購買力上升）。今日，各國爭相推行極度寬鬆貨幣政策，印銀紙，貶匯率，負利率，高息環境在可見的將來或難再現，意味著銀紙貶值的機率遠高於升值的機率，因此投資（持有）現金是有風險的，風險就是銀紙貶值，資產升值，購買力下降。未能成功將手上資產有效地轉化為資本的話，永遠不可能達到財務自由。


    ![](img/034fb7f1e667b45ed25196fc40e47173_203_1.png)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '筆者對「資本」定義為「會產生一連串現金流(a stream of cash flow)的資產」。沒有有效資本，被動收入是零，收入來源僅靠打工所得每月工資，打工所得的工資是出賣自己時間的報酬，而時間是有機會成本的，因此建立多元化的被動收入是很重要的。收入來源過於單一代表風險集中，相反，擁有多元化的被動收入才能將自己「贖身」，從老鼠籠中走出來，在任何經濟情況下皆立於不敗之地。


    # 加按自住物業 增加流動資金


    香港不少高中產人士的問題是現金流不足，因此說「太健康」也不對，因為收入集中於每月工資，資產集中於自住物業，幾乎沒有被動收入。如果有穩定收入，借貸能力高，應在退休前及早向銀行申請加按。自住物業不是資本，要將其轉化為資本就是利用銀行加按套現，將現金投資有現金流的資產，產生被動收入，優化現金流組合。


    假設準備退休人士預期所得到的退休金達數百萬元，同時又持有已供完的物業，則可考慮在尚有借貸能力的時候將物業加按，擴大個人資產負債表，令流動資金水平增加。如足夠800萬港元流動資產，便合資格申請成為PI，同時符合私人銀行的最低入門門檻，可投資的渠道及選擇更多，股票及債券等金融資產也有更好的倉值，融資利率更低，讓全盤投資策略進一步優化。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 增加被動收入儲蓄 立不敗之地


    退休人士可考慮的投資包括債券, REITs及工農物業等, 筆者認為是高門檻投資的「鐵三角」。三者的特點是低價格波動性, 有按值可做低槓桿, 具良好現金流。具按值代表有槓桿可以利用,
    槓桿可提升資產回報率, 有槓桿不一定要盡用, 但在低息年代應該要適當運用, 資產組合的槓桿若使用得宜, 是進可攻退可守的投資策略。


    香港是全世界唯一視房地產為賺錢工具的地方, 因此香港人無一不熟悉房地產 (住宅), 也十分熱愛房地產投資, 可以說去到一個瘋狂熱愛的程度, 盲目投資住宅的不計其數,
    也就懶得去學習其他投資工具, 以致很多香港人有錢但投資知識貧乏 (除了買樓)。


    對後生一輩的投資者, 我一般傾向有攻有守的投資策略, 但對步入退休年齡的人士來說, 理財計劃應更偏向穩健, 並以資產組合產生的被動收入是否能夠足以覆蓋生活開支為主要考慮。除此,
    有能力的不應只滿足於此, 應努力增加被動收入儲蓄, 作為投資高息投資物的buffer, 原因是高息投資如債券雖然保本, 但債券會受加息因素所影響。為使資產組合立於不敗之地,
    除要不時留意息口的轉變趨勢, 更重要的是增加「被動收入儲蓄」, 提升自己的持債能力。時刻記住, 保本性質的債券, 只要發行人夠實力, 投資者有能力持債至到期,
    永遠不敗, 大市愈差就愈能凸顯出債券之優勢。


