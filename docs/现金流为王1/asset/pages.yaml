  md: '內賺取最高回報」為目標。要做到這一點，首先要經常謹記這個原則，然後便是想盡辦法達到。上文曾解釋為何大面積的工廈單位價錢較小工廈低兩至三成，原因是它們大面積且裝修殘舊，又或是有生意線和機器在內，故呎價相對低廉。其實，這些單位除了有議價空間外，還可以爭取到其他的商業條款，如成交期。


    數年前，筆者資金不多，眼見市場的工廈價錢異常低廉，極具投資價值，同時亦有相當創造價值的空間。當時業主所持單位過萬呎，裝修非常殘舊，亦有生產線，租又租不出，而由於面積大，雖然呎價低，單位售價的
    lump sum 亦大，放盤一段時間亦未能成功售出。為了做到用最少的資金去做這個項目，筆者不議價，但要求業主給予 7 個月的成交期，成交前只支付 20% 訂金，且容許期間以租約的形式進場清拆及裝修。業主見放盤能售出，即時爽快同意。


    取得這個商業條款的好處是，筆者能以最少的資金（20% 的訂金）去起動整個項目。在支付 20% 的訂金後，第一時間當然由則師進場覆呎及設計圖則，工程團隊亦隨即根據圖則施工，工程一般需時
    3 個月完成，同時將由認可建築師（簡稱 AP）簽署的圖則交予律師準備分契文件。事實上，筆者在圖則完成以及第一間示範單位完成後，便立即放盤予地產經紀推出市場銷售。'
