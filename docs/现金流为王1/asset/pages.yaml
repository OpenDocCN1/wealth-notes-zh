- pgno: 74
  md: '市場對 REITs 進行估值的方法有很多，如現金流折現模型 (Discounted Cash Flow，DCF model)、股息增長模型 (Dividend
    Growth Model) 等等。其實 REITs 有別於一般上市公司股票，估值模型用不著搞得那麼複雜，筆者認為分析 REITs 的估值只須用兩招，就是看其市帳率
    (PB) 和 DPU 增長率。


    市帳率大於 1 表示市值比資產淨值 (NAV) 有溢價，小於 1 則代表折讓，這直接反映 REITs 的估值是否昂貴。大部分香港上市的 REITs，市帳率都是有折讓的，原因與在低息環境下，REITs
    在對其資產進行內部估值時所用的資本化率 (Capitalization Rate) 偏低有關，令旗下物業資產估值偏高，故有估值便宜的假象。因此，在進行估值時，宜同時留意和比較不同
    REITs 所使用的資本化率。


    由於 REITs 會將其 90% 可分派收入以股息的形式向股東進行分派，因此無須擔心股息率與盈利不同步的問題。要觀察其盈利能力和 ROE 表現，直接看其 DPU
    增長率最實際。如一隻 REITs 的市帳率不高、ROE 良好，同時 DPU 增長率長期保持穩定高水平，那該 REITs 便是一隻可多拿得優質的 REITs。


    # 4. 分散風險


    即使某 REIT 旗下的資產多麼優質，若果過分集中某一類別，或所持資產數目不多，其租金收入來源都可能過分集中，風險不夠分散，投資者應避免單一地投資該 REIT。換言之，在考慮整個投資組合的資產配置上，應儘量避免投資與該
    REIT 重疊的物業類別或相同區域的資產，將投資組合的風險分散。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 5. 負債水平


    當兩隻 REITs 的質素差不多，筆者會較傾向投資負債水平較低的一隻。當黑天鵝出現時，資本市場會出現較大波動，如於 2008 年金融海嘯，很多高負債的 REITs
    都因為旗下資產大幅貶值令負債比率急速上升，再融資出現困難，使公司出現流動性風險，REITs 價格大幅下跌。因此，兩隻 REITs 客觀因素相若，筆者會選擇負債比率較低者，原因是以同樣槓桿的水平而兩者表現差不多，代表了負債比率較低的營運表現較出色。同時，負債水平較低的公司，其再融資的空間較多，當黑天鵝來臨時，市場往往出現併購機會，公司負債水平較低自然能通過融資更能把握市場機會。


    當然，筆者不是建議投資負債水平極低的 REITs，其實 REITs 的負債比率水平已被要求不高於 35%，本身其實已不高。如果一些 REITs 持有過多現金而又沒有負債，可能代表其經營能力不高，沒有有效利用槓桿收購有潛質的資產，發展過於被動。與其投資持有過多現金、流動性過高的
    REITs，投資者倒不如將投資資金自行存入銀行算了。


    # 6. 管理層及未來發展計劃


    融資必然存在成本，對物業持有者而言，將旗下物業資產上市融資最大的成本是要與眾多股東分享利潤。試想一下，如果企業沒有未來發展計劃使其有龐大的集資或融資需要，為何要將旗下高質素、高回報的物業資產上市？


    ![](img/034fb7f1e667b45ed25196fc40e47173_75_0.png)'
  merge: -1
  img_proc: true
- pgno: 76
  md: '所以，以逆向思維分析，在沒有未來發展計劃的前提下，上市的REITs應該不是優質的物業資產。如果該 REIT 未來發展及增長有限，大股東很大程度上是利用財技將物業資產上市「cap
    水」，筆者稱之為「財技REITs」或「化妝 REITs」。這些 REITs 在市場的佔比不少，以下會再講講 REITs 可以如何「化妝」。


    # 7. 避開「化妝」REITs


    筆者留意到不少在本港上市的 REITs 有利用財技「化妝」之嫌。有關財技不外乎：


    +   一、大股東提供前期租金收入保證，從而谷大前期租金收入；


    +   二、大股東放棄前期收取派息，以提高投資者的派息水平；


    +   三、大股東利用利率掉期協議 (Interest Rate Swap) 降低前期利息成本；


    +   四、基金的管理人收取管理費，前期以收取基金單位代替現金，使前期現金收入增加。


    以上說了很多「前期」，意思是說大股東往往利用前期的「化妝品」，吸引投資者在上市時認購，及後大股東「cap 水」後便打回原形，後期回報大幅下滑。香港有不少 REITs
    在上市時都有用上「化妝品」的其中一種或更多，投資者在投資前要多留意。


