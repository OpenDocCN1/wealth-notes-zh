  md: '可分為自有資金、貸款資金或其他外來資金，而無論是何種資金都有成本，稱之為資金成本（Cost of Fund，COF），當中亦包括了自有資金的機會成本。每個人的資金成本都不一樣，因人而異，因此不同人適合做的資本運作生意都不一樣。


    資本運作模式下的投資項目、業務或生意，概念基本上離不開利差的套利，即投資項目的回報率與資金成本（化成利率）之落差。舉例，債券槓桿操作（Bond Leveraging）和傳統貨幣套息交易（Currency
    Carry Trade）都是典型資本運作模式下的投資項目，前者是將企業債券抵押融資後再反覆投資債券的操作行為，後者則是借低息貨幣投資高息貨幣的套利行為。兩者特點都是回報率比利率（資金成本）高，資本運作投資者不可能借高成本的錢，去投資低回報的項目。


    套利行為的行內專業名詞為套戤（Arbitrage），官方定義為在某種實質資產或金融資產（在同一市場或不同市場）擁有兩個價格的情況下，以較低的價格買進，較高的價格賣出，從而獲取低風險的收益，簡單而言就是低買高賣（buy
    low sell high）。以上舉的兩個例子都並非無風險套利，但套利行為一般都有一個共通點：套利投資項目的風險部位一般歸邊鮮明，因此比較容易運用其他衍生工具進行對沖，例如購買債券違約掉期（Credit
    Default Swap，CDS）對沖違約風險；購買反向方向貨幣遠期合約（Currency Forward Contracts）對沖貨幣風險等。因此，衍生工具不是對賭工具，而是一個對沖工具。'
