  md: '筆者最近主力催谷一爿外國補濕水產品，筆者本身是完全沒有概念的。同事提供的市場數據顯示香港一年四季都是長期缺貨，而同事已有渠道在外國直接找到供應商取得大貨，價錢折讓極大，歐羅下跌更令成本進一步下降。取得大貨首推出市場，同事表示該貨即使以較高價格出售也不憂賣，因為市場供應不多，但筆者堅持以極低價格推出予所有批發商發零售商，平絕全城，市場為之震撼，同事也摸不著頭腦，而事實亦證明筆者的決定是對的。


    # 資金回報率 取決付款條件


    此貨一出，由於價錢極平，數天之間接獲的訂單已超過筆者買入的貨量數倍，連之前未接觸過的買家都主動來找我們要貨，還即場交付訂金，而筆者堅持每個買家都派一些貨，從而取得更多市場大手買家的聯繫。筆者根本志不在該批貨的利潤，目的是要在本地市場壟斷該貨，成為大莊家。筆者更明確向所有同事表明，凡在市場上發現有任何貨源的訂價比我們低，我們通通都要買下來。目的是讓市場任何大手買家要貨時，必然第一時間想起我們。當市場被壟斷，到時自然就有定價權，是長遠的現金流生意，確實無須急在一時。


    貿易業務一般雖然毛利不高，但資金回報率就相當高，關鍵在於付款條件（Payment terms）。筆者公司向供應商下單一般只需付30%訂金左右，待airway
    bill或bill of lading發出後才付餘款。而筆者的大貨客戶一般都會於貨期確定後即時付20-30%訂金予我方，因此實際要墊付的資金不多，時間亦不長，資金回報率自然高。貿易業務的另一好處是業績累'
