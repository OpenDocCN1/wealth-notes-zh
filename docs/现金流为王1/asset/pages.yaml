  md: '![](img/034fb7f1e667b45ed25196fc40e47173_157_0.png)


    # 檳洲爭議只是序幕？


    檳洲發展計劃的爭議，簡單說就是說好用檳洲約33公頃掠地興建17,000個公屋單位，最後因政府多次「摸底」，認為掠地問題不易處理，涉及收地補償的金額龐大，在取易不求難的原則下，轉而打有原居民居住的綠化地主意，先發展朗屏路毗鄰佔地5.6公頃土地，興建4,000個公屋單位，作為檳洲發展計劃的第一期。然而，這並不代表餘下13,000個單位落空，政府表示為使項目儘快上馬，檳洲發展計劃將分4期興建。客觀分析，其實這也合理，原居民居住的綠化地屬自用性質，價值當然遠低於露天倉地（掠地），所涉及的收地補償金額也較少。根據寮北發展的情況，新界寮北極元無的農地如打鼓嶺農地，回收價都已接近2000元/呎，試問元朗的露天倉地（掠地）會是何價？超過2000元/呎幾乎是必然的事。龐大的收地預算、談判所需的時間，以及如何安置被趕走的掠地使用者，要解決這些問題不是一時三刻的事情。


    其實情況一如所料，香港的土地問題是先天性的，而新界的土地問題千絲萬縷，是歷史遺留下來的問題，除錢以外，根本沒有其他方法解決，而錢最終也只能解決業主的補償問題，真正土地用家（業界）的問題仍然無法解決。筆者預期的，檳洲發展計劃最終仍會按計劃上馬，如政府所說，先收綠化地興建4,000個公屋單位發展第一期，下一步將會是收餘下37公頃掠地，用於發展餘下13,000個公屋單位，問題只是要取得收地補償金額的共識。同時，洪水橋發展計劃及元朗南發展計劃將緊隨其後接火上馬，屆時市場會開始真正意識到掠地的功能及價值及其稀缺性，最先反映的會是倉地租金，然後便是倉地的估值及價格。目前為止，無論是


    ![](img/034fb7f1e667b45ed25196fc40e47173_157_1.png)'
