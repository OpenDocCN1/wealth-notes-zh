- pgno: 34
  md: '# 第一個 10 年(22-32 歲)——開荒年代


    人生可分為三個 10 年，第一個 10 年是 22-32 歲，畢業前就應該著手規劃。10 年裡又可分為兩個 5 年，對於年輕人來說，5 年是可預見的距離，但轉變可以很大。22-32
    歲是一般人畢業後的首個 10 年，由選工作、努力工作/學習、進修、升遷、轉換工作，到適婚年齡開始組織家庭、置業、結婚生小孩等等。


    理論上，第一個 10 年應該是最忙碌、充實的 10 年，如果你發覺自己在第一個 10 年無方向、無所事事，可能你就是沒做好人生規劃。


    要在第一個 10 年完成所有目標，正確的理財觀不可或缺。擁有良好的理財觀加上豐富的財務知識是重要的，除了幫助你在首 10 年努力達到目標，也令你在第一個 10
    年裡累積財富。


    賺取第一桶金往往是最困難的，若然你在第一個 10 年就能累積到第一個 100 萬，有了第一桶金，加上過程中累積到的人脈、工作經驗、人與人之間的溝通技巧、從工作所累積的專業知識，你在第二個
    10 年時的人生規劃就可以有更多選擇。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 第二個 10 年(32-42 歲)—— 黃金年代


    你在第一個 10 年累積得愈多，第二個 10 年 (32-42 歲) 就可以真正地「尋找自己的藍海」。人各有志，只有自己才會真正知道路怎樣走才適合自己，所以人生規劃不可能每個人都一樣。儘管如此，規劃仍然是必需的。


    第二個 10 年是黃金 10 年，在穩健的基礎下，有人選擇創業，有人繼續打工累積財富，有人專注家庭，開始自己人生的另一頁，為自己的人生增添色彩。


    # 第三個 10 年(42-52 歲)—— 創業年代


    第三個 10 年 (42-52 歲) 基本上大局已定，應該開始計劃並準備退休或退而不休的生活。這階段已經過了精力最旺盛的時期，不應再依靠勞力腦力賺取金錢，被動收入應該為最主要的收入來源。這三個
    10 年後，亦即是 50 歲過後，子女長大了，可以真正享受人生，做自己想做的事，到那時候，健康最重要。


    很多人沒刻意規劃自己的人生，也沒有想過理財投資的問題，更不會意識到被動收入的重要性，努力工作數十年後，仍然繼續埋頭苦幹工作，做公司/老闆想你做 的事，而不是自己想做的事。時間眨眼又十年，身體開始覺得累了，回頭看才發覺自己收入雖然高，但全部需要用勞力腦力換取，這時才醒覺增加被動收入、理財及規劃的重要性。在現今的新經濟環境，這些例子將會愈來愈多，成為大部分「向下流」香港人的寫照。


