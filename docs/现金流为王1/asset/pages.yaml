  md: '積，當公司累積一定的盈利業績時，向供應商訂貨自然不用付現金，通過向銀行申請開出信用證（Letter of Credit）或做Invoice Financing就可，利率不高，令本身毛利不高的貿易業務搖身一變成為無本生利的生意，這是為何筆者一直不介意交稅的原因，思維與傳統喜歡報大開支避稅的生意人截然不同。如有物業在手，更可利用物業抵押，向銀行申請營運資金貸款或備用信用證額度，發揮產融結合的力量，令貿易公司孕育成一個優質的業務平台，向不同合作伙伴吸納更多的業務，使無本生利的生意繼續發大。


    # 創造價值 從夕陽行業找機會


    在資訊發達的年代，市場機會多的是，創業成本比以前低，開始時亦無須一定要放棄手上工作，到時機成熟時才出擊；也不定一開始就要做大生意或長遠壟斷的生意，做得到固然好，但在資本不足的情況下也無必要將對生意的要求和目標定得太高。相反，以打游擊的心態慢慢累積資本方為上策，到羽翼豐滿之時就必須要有轉型意識，應用「資本運作」的思維做生意，最後建立一盤能持續盈利的生意，長遠為自己產生穩定現金流。


    世上沒有夕陽行業，關鍵在於你能創造多少價值。當每個人都做同一種生意（不論是零售、飲食或貿易），參與的人數太多，利潤空間收窄，市場沒有增長，那這個市場就會被稱為夕陽行業。但如果果你做的能跟一般人不同，不論是營運方式或做法，你就是創造價值，在所謂的夕陽行業裡，這反而是你的機會。


