  md: '# 3.13 投資日本樓

    聰明對沖匯風險


    在新經濟環境下，作為小投資者，第一時間要想的是銀紙貶值的影響（持有現金的成本），然後是資產配置的部署。不要小看你持有現金的風險，單是2008年至今，銀紙的購買力下跌最少兩三成（視乎不同類別的購買力）。在各國均採用量寬作為解決問題主要手段的年代，環球市況不明朗，要對沖持有現金的風險，資產組合必然是配置具一定回報的固定收益投資產品或磚頭等實物資產。


    要留意，債券收益雖然高且固定，但正因因為固定的特性，其對抗通脹或銀紙貶值的力量是有限的，只能靠固定回報補償，惟其資產的升值能力低，在高通脹的年代，計算回報時需要將其產生的固定現金流折讓（Discount），因此債券只能說是具高防守性的資產。說到具防守性，能夠絕對對沖銀紙購買力下跌風險的，必然是中國人最傳統的投資——磚頭。


