    攀是值得的。


    但有一點筆者必須要提一提，筆者讀到最近有博客分享其通過借私人貨

    款（P-Loan），將所得的 100 萬資金全數投資於高息股，雖然借貨利率不

    高，但每月償還款額達 85,000，即代表其供款年期相當短，估計只有一

    年期，存在著很大現金流錯配（cashflow mismatching）的問題。每月

    供款 8.5 萬，供款中相當大部分是本金，而高息股則每半年派一次息，如

    果是自己的收入及預期所得的花紅失預算，會即時陷入財政困難。這種

    做法相當危險，是財商低，甚至是傻的做法。


    借私人貨款買高息股的問題，第一是影響做按揭時計算借貸能力，雖然

    目前未必是買樓的良佳時機，但往後數年情況難以估計，故借私人貨款

    一般都會傾向做較短年期，惟做較短年期的私人貨款，令每月供款額大

    增，風險較高。第二是高息股的選擇，市場上有很多看似高息的股票（如

    內銀、公用股等），但未來派息未必能夠持續，而即使派息可持續，如盈

    利未能持續也無意義。


    # 派息與盈利同步的重要性


    這就是為何筆者一向建議，追求穩定收益的投資者投資 REITs，因 REITs

    會按其盈利不少於 90% 派息，其他所謂的高息股的派息比率與公司盈利

    沒有掛鉤的必然性。大家不要只著眼於息率的高低，更重要的是每年穩

    定派息的增長，前題是派息與盈利能夠同步，否則派息從價格中派出，'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# 第一站：滾動你的投資雪球


    其實與賣股套現無異，這與「債基」（債券基金）如何每月保證派息的道理一樣。（「債基」保證派息的來龍去脈，筆者稍後解釋。）


    重申一次，長線投資收息股應關注該股每年的**股息增長及可持續性**，前提是**盈利和派息**能同步。股價增長，或是每年股息派發的增長，都可體現該企業價值，一種是股價（帳面）體現，另一種是現金流的體現。其實，上市的股票已證券化，要套現可以直接賣出股票，不一定「期待」收息去體現現金流，因此長線持有收息股的焦點不是現金流，而是其每年的派息（盈利）增長及其可持續性。以何種方式體現（股價、股息或紅股）則視不同投資者本身策略的需要。


    我相信價值投資，投資股票等同投資公司，公司的表現離不開盈利或將來的**盈利**。股息、股價只是體現上市公司價值的一種方式，背後如果沒盈利支持都是沒有意義的。


    試想想，投資一隻股票，如每年盈利及股息持續雙位數增長，而股價卻不斷下跌，假設沒其他因素，你應該感到高興還是失落？筆者肯定感到高興，因為發現了一隻市場錯價的股票，也難得地找到市場有極好的再投資機會，而股息在持續盈利支持下，長遠而言，價值總會回歸，這就是真正的價值投資。


