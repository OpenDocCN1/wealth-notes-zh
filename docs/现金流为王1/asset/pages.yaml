  md: '# 不要自以為比市場聰明


    要注意一點是，筆者很少會做再平衡（re-balancing）的動作，意思是不論大市升跌，一般情況下，筆者絕少會主動去做減持或換馬，以維持組合內的初始比例。相反，筆者會利用組合產生的現金流（利息/股息）進行再投資，以不同種類的高現金流資產為目標，同時再投資時一般不會再做槓桿（新投入的資金除外），令組合的風險更為分散，同時達致自然去槓桿的效果。隨著時間愈長，組合的槓桿比率會逐漸下降。


    一般適合投資「REITs + Bond」組合的證券平台如一般私人銀行或自動化證券平台 Interactive Brokers 等，它們對各種證券如股票、債券、REITs
    等的倉值是綜合結算的，即實際操作上無須將不同證券類別戶口內的倉值調撥使用。而筆者在「REITs + Bond」組合的投資策略上提出以槓桿買入債券，而 REITs
    則不用槓桿，在實際操作上只是一種投資行為上的約束。


    人往往會受市場的情緒所影響，當市場追捧債券時，債券價格上升，投資者很容易突然改變投資策略增加債券的再投資。而歷史告訴我們，當市場上多數人認為是對的，多數情況下都不是。大家手上都沒有水晶球，不應主動去預測大市的走勢，更不應試圖去賺取abnormal
    return（即經常自信比市場更聰明），應該專注投資「計到數的項目」，做好有紀律的資產配置才是致勝之道。'
