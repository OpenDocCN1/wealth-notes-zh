    # 香港機會窗口

    已關閉？


    較早前，筆者讀到內地一篇瘋傳的文章，內容大意是「香港這座城市所有的機會窗口已幾乎關閉」，當中主要原因是香港人不懂搞實業，只會搞金融、地產；不懂創造，只會埋首工作；能吸納數萬億的資本，但沒好好運用，大部分只去了炒炒買賣；沒有實體經濟，因而沒能有效消化海量的資金，因此錢多了就通脹，直接將樓價推向頂，封死了後續一切創造價值的空間：稅率低，但對生活、營商沒有幫助，因為土地財政本身就是一種課稅。


    以上幾點說得好，值得香港人反思。但難道香港就已經沒有任何機會窗口了嗎？筆者對此不認同，香港在很多方面仍然存在著很大優勢，至少筆者仍然看到市場有很多很多機會。儘管中央已在國家發展的規劃上部署好，讓數個一線城市作試點，一步一步意圖將香港的優勢及功能複製，筆者仍然認為儘管硬件（如政策）到位，軟件（如人民素質、法制等）卻遠遠未到國際水平，想要走出去、與國際接軌，尚有一條很漫長的路要走。'
