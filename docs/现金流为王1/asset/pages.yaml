- pgno: 123
  md: '# 債券與REITs 機會成本概念有別


    投資債券的朋友需要特別留意，買債與買股票或REITs的策略和考慮是有分別的。債券有別於股票的地方是其保本、每日計息的特質，因此可視作進可攻退可守，當債價升有資產增值（capital
    gain）時，可考慮財意業收，價跌時則可持有至到期賺取利息收入。買債的目的不是要炒價，而是賺取利息收入，請不要曲解原意。


    有一點要留意的是，任何換貨或涉及再投資的決定，都離不開機會成本的概念。舉個簡單例子，假設你買入的債價是100，買入時YTM是10%，現升至115，假設市場上現有同質的債券YTM有9%，那麼你繼續持有舊債的機會成本已不再是9%（100為基礎的9%），而是10.35（115為基礎的9%），這比你買入該債的yield還要高，故此應該選擇換馬。所以當你所持的債券價格上升，你繼續持有舊債的機會成本其實是也比以前上升，也就是說，不要只考慮你買入時的YTM，而需要考虑mark
    to market的YTM，這是你換馬其他資產所考慮的重要因素之一。


    以上的機會成本概念是重要的，但要留意上述例子是假設其他因素不變。以上的概念，短期債券比REITs更明顯（影響的比重依次為債券>REITs > 高息股），因為債券到期時價格會回歸Par（100）。對REITs及其他高息股則只能作為一個分析基礎，不能完全應用。REITs/股票不像債券，本身沒有到期日，其資產價債值又會隨市場因素（如通脹、QE等）而改變，因此，REITs及高息股組合的比例需要適時作出調整。


