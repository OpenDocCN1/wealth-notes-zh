  md: '# 資金有成本 易心急做錯投資決定


    返回本篇文章的主題，資本運作模式在低息環境下看似是一門容易、穩賺的「生意」，然而，畢業生及年輕人在缺乏合適投資項目的情況下貿然大幅舉債，抱著「人有我有」、「借吃先」的心態借入信用卡貸款或私人貸款，往往會出現問題。


    當一個人取得銀行貸款後，由於貸款有資金成本，在一段時間後仍然找不到合適的投資項目，自然會產生一定心理壓力，特別對於缺乏投資實戰經驗、心理素質較脆弱的初生之犢來說，最後容易因心急而作出錯誤投資決定，藥石亂投。這情況很正常，莫說是初生之犢，即使專業如大型基金，如手持太多
    idle fund，亦會心急尋找資金出路，以致錯誤投資於質素差的項目。人有錢就身痕，不少人在樓市獲利套現後，本來打算靜候下一個投資機會，因為不忍看著銀紙急速貶值，最後亂投股市導致損失慘重。


    因此，即使在低息的大時代下，關鍵不是你能有多快借多少錢，也不是你的資金成本有多低，更重要是你有沒有合適的投資項目或目標，而要成功找到合適項目，所需要的是準備及計劃。不論做生意或投資股票，任何投資都需要做足功課，世上沒有完全能對沖的風險，只有你不熟悉的市場、缺乏足夠認知的產品，那就是最大的不確定性，也就是最大的風險。


