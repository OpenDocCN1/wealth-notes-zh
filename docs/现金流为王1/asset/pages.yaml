- pgno: 24
  md: '「步行」可比作一般打工仔，每天營營役役的工作，為的只是安穩的生活，但只靠勞力，手停口停。如果你沒有父薩，你的財富只能累積每月的餘錢，這條方式是「加數」，因此人生所能走的路不遠，旅程經歷和風景亦有所局限。


    「單車」可視為主動型投資，這種交通工具，雖然也要用力踩才能前進，但可事半功倍。你將本金投資再投資，其回報是以本金乘以回報率計算，是「乘數」的概念。「單車」（主動型投資）這種工具，若運用得宜，往下傾的斜坡即使無須用力也能快速前進，但風險會比「步行」高一些，要懂得風險管理，即需運用剎車技巧，亦要有隨時跌倒的準備。風險的高與低，很大程度在於你對該工具的熟悉程度，也取決於你的風險管理技巧。


    「列車」可理解為一個「讓錢自動流入的系統」，使你無須再付出勞力、精神去換取金錢，亦可視之為財務自由的狀態。只要成功構建好這個「讓錢自動流入的系統」，就等於登上了可高速行駛的列車，時間將會是你最好的朋友，因為即使在睡覺的時候，列車會繼續運行，金錢會為你工作，而你卻不再需要為金錢而工作，你可以好好欣賞沿途的風景。'
