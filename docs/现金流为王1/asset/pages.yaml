- pgno: 116
  md: '# 債券基金有除淨 派息價跌


    債券基金和債券的分別，詳見下表：


    | | 債券基金 | 債券 |

    | --- | --- | --- |

    | 性質 | 一般為封閉式基金。 | 債券性質，投資者為債主，投資期間定期收到利息，到期可取回本金。 |

    | 年期/到期日 | 沒有到期日。 | 有到期日，到期時投資者可收回相等於面值(Par)100的本金。 |

    | 派息 | 一般每月派息。 | 一般每半年派息一次。 |

    | 價格 | 有二手市場價格，可於二手市場交易，基金單位價格的高低根據市場供求情況而定。派息時除淨，價格可能會下跌。 | 有二手市場價格，可於二手市場交易，基金單位價格的高低根據市場供求情況而定。由於債券到期日投資者可收回相等於面值(Par)100的本金金額，因此一般愈近到期日債券價格會愈接近面值(Par)100。派息時不需除淨，價格不受影響。
    |

    | 風險 | 持有一籃子不同的債券，一般超過100隻，風險較為分散。惟為了拉高總體收益率，大部分債券屬低評級或垃圾級別。 | 債券由單一機構（政府或企業）所發行，投資者的風險為債券發行人的違約風險。
    |

    | 入場費 | 一般為2萬港元。 | 一般為10萬到20萬美元（約78萬到156萬港元）。 |

    | 手續費/管理費 | 手續費較高，另每年收取管理費，視乎不同債券基金。 | 只有認購費，沒有管理費。 |

    | 交易方式 | 一般銀行及證券行的網上平台操作。 | 證券行或私人銀行，交易方式為OTC。 |


