  md: '其實是表示經濟復甦強勁使美國具備長遠加息的條件。在經濟環境向好的情況下，房地產需求必然增加，REITs 旗下物業的出租率、租金亦會水漲船高。


    根據過往多年的歷史數據，REITs 在進入加息周期之前有一定的波動，但在一個完整的加息周期中，REITs 往往跑贏其他資產及證券，因此利率與 REITs 的表現呈正向關係。投資者不必過分擔心加息對
    REITs 價格的影響，反而當加息時，市場持不同看法的投資者會沽貨，會出現更多入貨機會。


    # 七大因素 精選優質 REITs


    市場上有優質 REITs 和「化妝」REITs，如何分辨兩者，筆者主要考慮以下七個因素：


    +   1. 股息增長潛力


    筆者曾提及，要投資組合有「動能」，現金流不可或缺。從這方面考慮，挑選優質房託比挑選優質股票更簡單直接。原因很簡單，房託的盈利不少於 90% 用於派息，即表示其盈利表現與派息是一致的，因此投資者較有把握地從其派息率，定出投資組合的現金流再投資方案。在尋找優質
    REITs 時，筆者往往以 REITs 的每年 DPU（每基金單位分派，即其股息）增長作為第一準則去篩選。可以說，一隻 REITs 的 DPU 能夠做到每年增長，基極也有譜，也反映該基金的經營管理能力。


