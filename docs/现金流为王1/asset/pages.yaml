  md: '金流回籠的所需時間（即「回本期」的計算），結果生意營運數個月至半年後，收支仍然未能平衡，而由於一開始投入的資本佔用了相當部分的後續營運資金，如此一來，便很容易出現資金鏈斷裂，若未能有額外資金注資，公司便需要結業。以上情況十分普遍，反映不少創業者都缺乏基本的財務管理知識，儘管他們都有很好的創業點子。


    # 須同時考慮供求變化


    市場上也有不少創業例子是在 rule no.1 和 2 都未完成的情況下，以爲自己能在短時間內成功或闖出名堂，立即急不及待跳級，擴充規模，在短時間內大量開分店。但由於護城河未鞏固好，當市場上的潛在競爭者入場時，需求迅速被沖淡，出現供應方面（Supply
    side）的市場變化：又或是閣下生意上的 initial idea 只是一時興起，貪新鮮過後需求急速下降，出現需求方面（Demand side）的變化。謹記做生意須同時考慮供求兩方面的因素和市場變化，市場永遠是多變的，創業者的思維要永遠跑在市場前面。


    做生意請求創造價值，同時要有全面的知識和正確的財務管理思維，這些在學校裡都沒有教，大學工商管理課程教的都只是流於理論，做生意若只跟著千遍一律的理論，事實上可能死得更快。做生意請求實戰經驗，一邊打工一邊學習都能從旁累積到珍貴的實戰經驗，當然這也取決於你持創業的思維去打工，還是打工的思維去打工了。'
