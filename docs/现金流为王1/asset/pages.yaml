  md: '# 2.9 為何投資 iBond

    必賺？


    香港實在太少人認識債券，政府發行iBond除派錢予市民之餘，也向廣大市民灌輸債券的概念，可謂比澳門直接派錢來得更有深度。iBond 5 的認購反應熱烈，香港政府發行
    100 億，認購金額達 60 億，證明大家都似乎知道 iBond 是穩賺不蝕的了。但大家又是否知道，為何 iBond 於首日掛牌在市場立即沽售可保證獲利？10
    個人裡面，知道原因的可能不足 3 人。


    iBond 全名為香港政府通脹掛鉤債券，由香港政府發行，是一種 3 年期港元政府債券，每手面值一萬港元，每半年派息一次，其息率分浮息及定息，浮息與香港最近六個月的通脹率（以綜合消費物價指數為準）掛鉤，定息為
    1 厘，最終派息率以高者為準。於 2011 年 7 月起每年發行一批，至今已經發行第 5 批。


