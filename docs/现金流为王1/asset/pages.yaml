    # # 棕地功能及價值

    遠被低估


    筆者一直未有留意發展規模較小的橫洲發展計劃，亦萬萬想不到這個涉及發展面積極33公頃的項目竟閘得如此火熱，成為 了整個大形勢發展的序幕。其實所謂棕地，是指己受破壞的土地，包括用於放置大型機械及物流倉儲的倉地及貨櫃場等等，當中價值最高且本已十分稀缺的是「露天倉地」（OS地）。土地資源稀缺是香港先天的問題，而689政府將解決香港住屋問題列為重中之重的首要任務，方法是想盡辦法大舉增加潛在可發展住宅的土地供應量。然而，口講容易，執行困難，當中必然有所取捨，最後被「捨」的相關團體必然會走出來反對，令發展計劃面臨種種挑戰，最後成功與否且看政府的決心。以目前情况来看，上述發展計劃寧在必行，最後還是用錢解決。凡事總有個價，香港政府資金充裕，上百億的收地資金，錢從何來？自然是從納稅人口袋裡去拿吧。


