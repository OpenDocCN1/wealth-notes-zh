    # 何謂利率掉期？


    筆者在此也簡釋基金如何利用利率掉期（IRS）對沖利率上升風險。假設基金的貸款息率は Libor+1.5%，由於 Libor 是浮動，如果市場加息，Libor
    會上升，借貸成本就會上升，但 spread 是 1.5% 不變的，變的只是


    ![](img/034fb7f1e667b45ed25196fc40e47173_83_0.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'libor。為對沖libor上升風險，基金會買入利率掉期，根據IRS協議，基金會定期以定息（fixed rate）去換取浮息（floating rate）。基金會收取的浮息就會用以支付銀行的浮息貸款。因此，對基金而言，無論市場加息與否，基金實際只需要支付一個定息貸款，因此可說期內完全沒有利率風險。


    # 如何買新加坡 REITs？


    新加坡 REITs 的投資種類多元化，物業組合包括商場、辦公室、工廈、住宅、物流項目等，如上文所說的大中華豐櫓商業信託是不錯的選擇，因主要資產是香港又一城，收入
    70% 來自香港大型收租資產，故比在一般私人銀行有 50% LTV（loan-to-value ratio），可做 2 倍槓桿。資產質素高，九龍塘地段可說已具不败的價值，而且是我們每日都可看得到監察得到的優質物業。


    投資者想投資新加坡 REITs，可以經私人銀行平台，對於沒有私銀平台而又想投資該 REITs，可以利用 Interactive Brokers 網上證券平台，融資率高達
    60%，融資利率低至 1 點幾至 2%，是一個不錯的平台。


    此外，部分證券行提供新加坡股票買賣服務，投資者需繳付交易佣金、成交金額 0.04% 的結算費、成交金額 0.0075% 的 SGX（新交所）行動費。輝立的交易佣金介乎成交金額的
    0.28 至 0.35%（視乎交易金額），最低收取 33 披元（或 23 美元/150 港元）。市場上數間大型的證券行的交易佣金為成交金額 0.2%，其中經電子系統落盤的最低收費是
    20 披元或 15 美元；經網上支援電話落盤最低收 110 披元或 60 美元。新加坡股票的交易時段為早上九時至下午五時，交收日 T+3，交易亦可以每手作為交易單位。'
