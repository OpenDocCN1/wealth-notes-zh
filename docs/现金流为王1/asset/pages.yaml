  md: '認為他們都是商界或金融圈中人的時候，發現他們對經濟金融的知識相對比較（較筆者的預期）局限，思維步伐也較緩慢，普遍停留於傳統理論及操作，投資的問題也僅限於股票、買樓、基金……相比起筆者早前在深圳前海參加經濟論壇所見的內地年輕，他們來自不同界別，但宏觀經濟視野很闊，滿腦子都是想著市場有何商機、如何利用科技配合未來需求，甚至製造目前不存在的需求，帶動市場走向新的方向。


