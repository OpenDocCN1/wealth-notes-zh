  md: '# 極高評級 基本上零風險


    iBond 由香港政府發行，惠綸給予 iBond「AA+」評級，穆迪評級為「Aa1」，而標準普則給予「AAA」的評級，可以說是 risk free。以一個
    risk free 發行人發行的債券回報應該是 7 少？以同是 AAA 的 3 年期美國國庫債券為例，券息率約 1%。而 iBond IPO 認購的收益率平均有
    4%-4.5%，同樣是 risk free asset，但 iBond 比 3 年期美國國庫債券高出 3%，你說是不是穩賺？


    有人會說 iBond 幾里回報毫不吸引，但槓桿後回報就可以乘大 20 倍。每一隻債券都有不同的融資額，愈高評級的債券一般會有較高的融資額，例如評級高如 iBond
    的債券就有高達 97% 的融資額。當年 iBond 我認購了 38 手，以 IPO 認購價 100，每年 4% 回報計，槓桿後（融資率 97%，槓桿達 33
    倍）的回報率達 80% p.a.，所以大家應該明白 iBond 首日掛牌為何必升無疑了，因為如果呼升，班基金佬第一時間走出來掃貨，第一口價就已經去到 105
    了。如果有人願意以 103 價格首日掛牌场外賣給我，我會非常歡迎，定必來者不拒，將買入的 iBond 抵押予銀行，套回 97% 資金出來套息，回報也很不錯。'
