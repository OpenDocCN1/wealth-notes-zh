    # 第二站：滾動你的投資雪球


    儲蓄4萬，筆者稱之為「被動收入儲蓄」（Net Saving from Passive Income）。每月的「被動收入儲蓄」為4萬，一年為48萬，再定期利用該筆資金買入資產，持續產生穩定現金流收益，複式增長，每年的被動收入會不斷增加，被動收入儲蓄亦會不斷累積。


    被動收入儲蓄的累積及再投資這概念，相當重要，因為我們面對銀紙貶值及通脹之苦，財富組合的購買力正被蠶食，若被動收入只足夠覆蓋目前每月基本家庭開支，莫說要改善生活質素，在不久的將來，很可能連維持現時生活質素也難以做到。因此，追求財務自由應同時考慮通脹的因素，而被動收入儲蓄的再投資操作，則能為整個被動收入組合注入「動能」，讓雪球滾動，追上通脹的同時令財富愈滾愈大。這才是真正可持續的財富組合（Sustainable
    portfolio），做到真正「使來使去都係面幅浸」，即使到百年歸老時，組合仍能自動運作，為家庭及下一代帶來保障。


