- pgno: 93
  md: '| 阿里巴巴控股 | 3.6 | 28-Nov-2024 | 96.256 | 96.729 | 4.086 | 4.024 | BABA | US
    | +/-Low |


    以上是阿里巴巴發行的債券。從上可見，這債券價格為$96.729，低於$100，我們叫作below par，低過票面值的債券，亦是貼現債券(discount
    bond)，債券到期時投資者可收到$100，所以投資者如果以現價買入，實際到期回報率比固息率高。如果投資者預期自己將會持有該債券至到期，應該主要考慮YTM，而不只是Coupon
    Rate，而Coupon Rate只會影響債券到期前期間所收取利息的現金流。


    此債券最主要的風險就是阿里巴巴違約，以這種規模的公司而言，違約可能性極低，可以說香港幾間本地中小型銀行執笠都未到阿里巴巴，故安全性應該不用質疑，但YTM收益就只有4%左右(其實以這級數的債券而言已不錯)，為了全面發揮這類高評級債券的優勢，投資者可以利用槓桿宣傳操作(Leveraged
    Bond)。


    槓桿宣傳操作原理，以上述例子，其實是買入一隻4%回報的債券，將之抵押予銀行，利用銀行低息融資的優勢，套現80%資金，再將套出的資金再次買入該債券，再將債券抵押予銀行融資，將套現資金再度買入債券，如此類推，重複操作。當然實際操作不用這樣複雜，買入債券時直接只須支付20%資金就可以買到100%面值的債券，其餘80%由銀行融資，槓桿比率就是1/20%=
    5倍。以上做法就等於套息交易，借低息資金買入高息資產從而套取息差。


