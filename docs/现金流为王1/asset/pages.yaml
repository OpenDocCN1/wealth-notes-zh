  md: '# # 2.2 REITs + Bond 優勢互補 愈滾愈大


    筆者選擇投資債券，皆因其相對低風險、高融資率、高現金流的特性，可以適用低息環境下的便宜資金，進行有效套息交易。其實，債券最大的缺點是持有債券至到期並沒有資本增值的效果，因為債券只能做到保息保本（債券到期取回本金），這是優點同時也是缺點。


    # ## 穩定現金流＋長遠資本增值


    在不斷量化寬鬆的大時代下，銀紙長遠會以高速貶值，沒有資本增值的力量實在難以抵抗通貨膨脹。要做到投資組合產生穩定現金流，而又能收得像實物資產/磚頭般的長遠資本增值，將傭息再投資REITs是最穩健之選，同時REITs亦具有高含值的特點，也具有高而穩定現金流的特點，因此兩者除了互補，亦能夠相互作用再投資的操作，優化整個投資組合，使雪球愈滾愈大。


    ![](img/034fb7f1e667b45ed25196fc40e47173_63_0.png)'
  merge: -1
  img_proc: true
- pgno: 64
  md: '筆者的投资一向注重現金流，任一種投資的回報有多大爆炸性也好，過程中或短期內沒有產生任何現金流，其實也只是一塹死水，是缺乏「動能」的投资。


    投资需要「動能」，意思是說一項投資只要產生現金流，除了提供流動性以外，其所產生的現金流就能够用於再投資，而再投資的項目即使是性質相同，也不一定是同一種投資產品（可以是REITs、Bonds或其他具有現金流的資產，例如穩定派息的股票，包括高息股如一些公用股、內銀股等），即使也是REITs，也可以是領展、新加坡豐樹信託之外的選擇。總而言之，投资具有現金流的資產，它們定期產生出來的現金流收益，可用以再投資其他不同種類中具有現金流資產，重複以新增的現金流再投資，能令被動收入來源更多元化。這樣就能做到分散風險的效果，使投資帶動的現金流收入來源（被動收入）多樣性增加，進一步優化整個投資組合。


    # 攻防策略 建立自己的投資模式


    不同投資者的背景、投資理念、強弱、特點也不盡相同，故其投資風格、取態不可能完全相同，大家亦無需要去複製他人（包括筆者）的投資組合模式，投資需因應個人情況去考慮、做決策。投資對與錯只在於你事前有沒有做足功課，清楚投資產品的資訊，沒有做足夠盡職調查（Due
    diligence）的話，就算投資理念再好也是徒勞。'
