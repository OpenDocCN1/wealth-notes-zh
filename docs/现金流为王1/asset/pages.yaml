    以上各業務板塊除大宗商品和其他貿易業務外，均以地產為核心，伸延至其他相關的上下游業務，互有關係，而且具有一定協同效應。以上各個板塊都有各自的RO及管理團隊，大小事務都不需筆者去操心。以目前的科技，只需一部手機，即使不在公司亦能獲得公司的各種業務數據。基本上，即使筆者外出旅遊一個月，公司已上軌道的業務也不會出任何問題。


