  md: '![](img/034fb7f1e667b45ed25196fc40e47173_38_0.png)


    筆者一向信奉 80/20 法則（或稱為「帕雷托法則」Pareto Principle）。此法則提出世界上大多數現象都是「80%的成果，取決於20%的原因」。例如，一間公司
    80% 的業績是由 20% 的員工賺取回來，意思是 80% 的生產力集中在 20% 人手上。


    20% 的高質素員工是如何煉成的？他們就是持創業思維的打工仔，做事以公司的利益角度出發，工作質素自然不一樣。要注意，這不是單純工作勤力與否，重點在於思維。如果沒有創業思維，像機器一樣去打工，即使多勤力為公司賣命，每晚
    OT 到凌晨都是徒勞，日子久了就真的變成一部機器，只會愚蠢的工作，工作質素成謎。所以，聰明的打工仔要聰明地工作，不要浪費自己和公司的時間。'
