- pgno: 86
  md: '計到數，賺取穩健現金流，對於不必要的外匯風險，建議儘量做對沖，切勿為貪圖額外匯兌收益而去賭博。如果閣下有很強的信念認為該貨幣會升值，那倒不如直接炒買外匯來得更直接有效。投資，切勿忘記初衷，本末倒置是大忌。


    要對沖外匯風險，最直接的方法是利用借貸該貨幣去買入該 REITs 或股票，原理是以相同的外幣負債去購買相同的外幣資產。有一點要留意的是，除了該 REITs
    或股票的計價貨幣外，還要留意該 REITs 或股票所持有資產的所處國家的貨幣升值或貶值，因為會直接影響物業資產的帳面值及 REITs 資產淨值。此外，投資者亦需要留意該
    REITs 本身是否已有進行外匯對沖的財務安排。以大中華豐樹商業信託為例，本身並沒有任何外匯對沖的財務安排。


    如有私銀戶口，對沖外匯風險可如下操作：一般私銀對大中華豐樹商業信託此 REIT 提供約 50% 的融資率，筆者建議的策略是 50% 以本幣（港元或美元）轉新加坡元（坡紙），餘下
    50% 直接借坡紙買入。原因是該 REIT 雖以坡紙計價，但旗下主要資產主要是香港資產（港元計價），以負債對沖錯幣風險實際意義成疑。因此，筆者不考慮坡紙升跌對該
    REIT 股價的影響，而只針對買入該 REITs 時的錯幣交易進行對沖——借 50% 坡紙買入 (position A)，餘下 50% 以港元/美元兌換成坡紙
    (position B) 後買入。當坡紙貶升，position A 會虧，但 position B 會賺；當坡紙下跌，position A 會賺，而 position
    B 會虧。這樣操作仍未能完全對沖所有匯率風險，但至少已將波幅不大的匯率風險降低。'
