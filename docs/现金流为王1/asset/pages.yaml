  md: '# ### 2.7 投資債券 穩健等收息


    一般零售銀行都有五花八門的投資產品，花多眼亂，客戶經理一般介紹的 ELN (Equity-Link Note)、投資相連保險、某某基金等等，風險高低回報，但就偏偏很有市場。當你想問有關投資債券的資訊時，投資經理就會向你推銷債券基金，說了半天才知道原來銀行只有債券基金產品，基或是客戶經理連債券（或稱直債
    straight bond）和債券基金（簡稱債基）都未分得清楚。


    # ### 買債券 等同做債主


    很多人一聽到債券就怕怕，可能是受當年雷曼債券事件的陰影所影響，所以市面上比較少聽到有朋友投資債券。債券不普及亦有另一原因：債券投資高門檻，入場費一般雖為 10-20
    萬美元，但以 20 萬美元為起標的佔大多數，並不在一般散戶的投資能力範圍內，而且債券不同一般投資產品，投資者必須對債券有基本認識才知其回報及風險。加上賣債券銀'
