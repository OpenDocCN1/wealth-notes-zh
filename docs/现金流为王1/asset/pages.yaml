- pgno: 59
  md: '有讀過筆者博客的朋友應該知道，我的被動收入組合內的金融資產以REITs（房地產信託基金）及Bonds（公司債券）為主，簡稱「REITs + Bond」組合。


    組合內的Bond以短債為主，一般不長於3年（部分有5年）。我會利用債券本身的倉值（LTG，Loan To Value）做槓桿投資，增加回報率。所謂槓桿投資債券（Bond
    Leveraging）是指買入一隻債券後，將之抵押予銀行，利用銀行低息融資的優勢，根據該債券的融資率向銀行貸款借回相當部分的資金，將套現出的資金再度買入該債券，如此類推，重複操作。


    當然，槓桿投資債券的實際操作不用這樣複雜，假設債券票面息率為5%p.a.，債券的融資率為80%，私人銀行的融資利率1.5%，買入債券時直接只須支付20%資金就可以買到100%面值既債券，其餘80%由銀行融資，槓桿比率就是1/20%
    = 5倍，淨回報率超過18%。當然，筆者一向不建議用盡槓桿，但即使不用盡槓桿，要做到淨回報10%以上不難。以上做法就等同套息交易（Carry trade），借低息資金買入高息資產從而套取息差。


    筆者組合的REITs一般不做槓桿，利用其價格波動性（Volatility）較低及高倉值（即高融資率）的優勢，可作為槓桿債券組合的有效緩衝（Buffer），並作為滿足臨時現金需要的「提款機」，提升了整個投資組合的資金流動性及穩健度。要做到「REITs
    + Bond」組合有足夠的防守力，首要記住債券組合槓桿不用盡，REITs組合的Buffer要充足，這樣才能令組合立於不敗之地。


    ![](img/034fb7f1e667b45ed25196fc40e47173_59_0.png)'
