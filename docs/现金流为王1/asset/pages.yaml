    # 做生意的

    三大 Golden Rules


    > 第三站：港元投資滙富創業 主動出招


    早陣子路過大圍一間新開的特色咖啡室餐廳，老闆是年輕人，裝修很骨子，上下有兩層，面積也不小。餐廳主力做特色飲品和甜品，而應該是為了應付沉重的租金，午市也供應
