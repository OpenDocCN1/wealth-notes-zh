    2-3%（視乎閣下的工作及信用度），低至幾萬、高至百萬元的貸款唾手可得。


    # **資金氾濫 借貸易如反掌**


    在市場資金氾濫、銀紙購買力不斷下降的大環境下，最好做的生意莫過於「資本運作」模式的業務。資本運作簡單來說就是錢追錢，讓資本為你工作，為你帶來回報，計的數是資本內部回報率（IRR）。資本的來源


