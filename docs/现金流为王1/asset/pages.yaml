- pgno: 33
  md: '這個看似完美的 package，實際上是「被規劃」的人生！人生應該由自己去規劃，只有自己親身經歷，無論是好與壞，都是有價值的經驗，及至成功一刻才能夠真正感受那份成就感。


    # 人生的三個10年


    說到如何規劃人生，筆者認為應該由5年計劃開始，太短太長都沒有意思。相信普遍年輕人的5年計劃都不外乎「買車買樓、結婚生仔」，可是這只是目標，目標設高一點也無妨，最重要的是如何具體實踐，然後堅持執行。能做好以上，便是一個好的人生規劃，成功只是遲早的事。


    ![](img/034fb7f1e667b45ed25196fc40e47173_33_0.png)'
