  md: '# 3.12 投資馬來西亞 爆岀下個深圳


    亞投行的成立和一帶一路的發展，為東南亞國家帶來了不少機遇。當中，筆者最看好馬來西亞的發展，因此在約一年多前已開始研究如何投資、發展開拓馬來西亞市場。在最具發展潛力的地方投資，只要方向沒有錯，投資回報只是多與少的問題，雖不中亦不遠。經過多次親身考察，最終鎖定大馬新山。


    新山位於新加坡對岸，位處柔佛州，與新加坡只是一峽之隔，近年已有不少中國房地產開發商如碧桂園、萬達、富力、卓越等在當地大量買地發展房地產，因此當地目前全是地盤，不論居住環境和治安方面都有很大的改善空間。然而，新山給筆者的感覺就像是十多年前的深圳，投資和發展潛力相當大，這個方向不會有錯。目前，最為香港人熟悉的是碧桂園金海灣項目，而下一個將會是為期二十年、由四個島嶼組成的巨無霸酒店及商住項目「森林城市」，同樣由碧桂園發展。該項目總投資達2,500億元人民幣，為目前中國企業最大的海外投資項目。


    ![](img/034fb7f1e667b45ed25196fc40e47173_165_0.png)


