  md: '![](img/034fb7f1e667b45ed25196fc40e47173_48_0.png)


    # 身家百萬或千萬

    取決投資門檻


    賺取了第一個 100 萬，那再賺取第二個 100 萬就更加容易，而且快得多！


    關鍵在於你的目標是 100 萬變成 200 萬，還是 1000 萬甚至更多。完成首個 100 萬後，為何有些人最終能滾出 1000 萬以上的財富，有些人卻只能多賺
    100 萬？


    因為投資有門檻，這是一般人所忽略的。門檻愈高的投資項目或產品，風險調整後回報（risk-adjusted return）愈高，而投資選擇亦愈多。


    # 散戶愈少 回報愈易掌握


    何謂投資門檻？不同投資有不同的要求，包括相關知識和投資金額。傳統投資理論告訴我們，回報愈高，風險愈高。然而從事實來看，這理論不一定適用於所有投資工具。據筆者的分析，在相同或接近門檻級別的投資選擇來說，這理論比較準確。'
  merge: -1
  img_proc: true
- pgno: 49
  md: '在門檻較低的市場（如股市）上，散戶眾多。他們有羊群心理，同時亦受很多因素影響，所以投資者要追求穩定而高的回報就愈不容易，這種不確定性也就是風險。


    若果除去這一「散戶風險」，風險調整回報就變得吸引了，這正兄解釋了為何高門檻投資在同一風險的情況下，一般會有較高投資回報，投資選擇亦愈多。不要忘記，高門檻投資（如債市）需要的除了是資金，一般還須具備一定知識。因此，愈少散戶的投資領域，資產回報愈理想性，投資者也愈有把握取得預期回報。


    # 新經濟常態下百萬已不是富翁


    香港有幾多百萬富翁，有幾多千萬富翁？根據2016年花旗銀行的一個調查顯示，如不計物業，只計流動資產（現金、股票、債券等），千萬富翁約有六萬人，以2015年底香港人口732萬計，也就是每124人就有一名千萬富翁。百萬富翁人數亦多達76.8萬人，佔成年人口13%，按年增9.6%，即大約每十人便有一個。這些數字很吸引眼球，但其實受訪者只有4,120人，受訪地區、對象、工作、職位不詳，因此以上數字只反映富翁人數按年有所增長（前設是兩年的統計方法一致），而最吸引眼球的實際富翁人數，意義其實不大。


    儘管上述數字未必準確，但據筆者分析，香港的富翁人數比一般人想像的多。事實上，在數十年前，擁家財百萬還算得上是富翁，然而今時今日，特別在金融海嘯後，各國爭相印鈔紙將貨幣貶值、長期維持低息政策、過分依賴貨幣政策「醫治」不振的經濟，百萬已不再是富翁，一


    ![](img/034fb7f1e667b45ed25196fc40e47173_49_0.png)


    第一站：賺取第一桶金認識資本的力量'
  merge: -1
  img_proc: true
- pgno: 50
  md: '個高級白領或投行分析員的年收入可能已有此數。更甚者，千萬身家在現今世代也不能稱得上富翁，極其量只是邁向富翁的一張入場券。因此，當年財爺說自己是一名中產，其實是正確的描述！不是中產，難道是富翁？坊間對此說反應頗大，正正反映普羅大眾的財富思維還遠未跟得上市場的轉變，但筆者認為這也是可以理解的。


    # 千萬富翁 靠穩定回報累積身家


    而且，於 2015 和 2016 年，百萬富翁輸得很慘烈。據統計，百萬富翁 2016 年投資普遍錄得 30% 以上虧損。相反，千萬富翁則有 10% 以上的正回報。原因為何？答案是筆者前面所說投資門檻問題。


    ![](img/034fb7f1e667b45ed25196fc40e47173_50_0.png)'
  merge: -1
  img_proc: true
- pgno: 51
  md: '百萬富翁的資產配置主要集中股票、基金及細價樓，2015年股、樓皆跌，至2016年細價樓出現較明顯的回調，雖然後段止跌回升，但細價樓出租回報率不高，槓桿更受按揭條例所限。無奈，股、樓正是大多數人認識的投資工具，受散戶因素影響，增加了市場的不確定性，影響預期回報。


    對於千萬富翁，他們的資產配置中，有相當一部分屬於固定收益投資（如債券），穩健性傾向較高。他們普遍認為投資不需有爆炸性收益，追求的是穩定回報率，財富才能得更有效地累積。


    千萬富翁最大的優勢，在於他們可以選用門檻高的投資工具，這些投資工具不需要複雜，簡單便是美。他们更可利用私人銀行平台提供低息融資，將資產抵押予私人銀行，取得低息貸款，無須還本只須還息，利率可低至1%多，故適當使用槓桿，就能有效增加回報率，亦同時提高資產組合的整體流動性。在具備這些優勢的情況下，千萬富翁為何要與市場及散戶「搏鬥」？


    # 只懂盲目買樓 現金流低


    其實，香港人一直熱愛投資房地產，可說去到一個瘋狂熱愛的程度，盲目投資住宅的不計其數，也懶得去學習其他投資工具，以至很多人有錢，但投資知識匱乏，除了住宅樓，對固定收益及其他非住宅物業的投資，認識僅為皮毛。


    ![](img/034fb7f1e667b45ed25196fc40e47173_51_0.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: '當然，過去六至七年間，投資住宅的資產增值的確不錯，因為後金融海嘯的新常態經濟，取代了傳統經濟的運行模式，一方面極度低息環境、銀紙快速貶值，另一方面實物資產快速升值，以上種種都在「懲罰」無產階層。


    正由於低息及實物資產飛升，如果你在2008年擁有百萬，甚或數十萬也好，只要你在香港借錢買樓，不管買的是甚麼樓，樓價升值，升值後加按套現，再多買一層，如此類推，一拆二、二拆四，轉眼已成數百萬富翁，甚至千萬富翁。筆者身邊有不少打份牛工的打工仔朋友，正是如此暴發起來。


    正所謂時勢造英雄，以前老爸教落千萬不要借錢，有債要儘快還清，負債是羞家的事。但現今筆者與一班「上岸」朋友聚餐，大家不是鬥身家，而是鬥多負債，以多負債為榮，因為負債多，證明自己的借貸能力和銀行對你的信任，可謂時移勢易。


    然而，展望未來，繼續盡借樓按投資細價樓又是否最佳的投資選擇？在現今市場，先不談自住物業，投資住宅其實有四大短處：一、租金回報率基底（有2-3%已不錯）；二、有辣招；三、使費高；四、出租麻煩。


    如果你熱愛投資房地產，其實不用自己買賣物業，投資REITs已盡得實物資產之好處，而且化解了投資住宅的所有短處：


    一、回報率高（普遍有4-8%）；二、沒有辣招；三、使費低；四、出租物業有人代勞；五、槓桿：買入REITs如領展，公司本身有向銀行融資，小股東買入REITs時銀行又會提供倉值（如部分券商提供領展之可融資比率達70%），這可是雙重槓桿（Double
    gearing）。'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'REITs 的特點是盈利90%用以派息，收租收入相當穩定，因此投資REITs很容易，只要留意其派息增長率就已足夠。試想想，8%回報率的REITs每年派息都有增長，長升長有，我們也不太看重其股價升跌了。如果你更進取，以槓桿投資
    REITs，回報率則更高。


    事實如此，為何我們仍死抱投資住宅物業這方程式？


    # # 多元化被動收入 打破財富極限


    世界及樓市政策不停變化，只抱過去十年都成功的投資策略，最終只會被新的遊戲規則所淘汰。投資者要不時檢討自己的投資策略，判斷現時應用的那套是否仍具優勢。


    其實，大部分人的理財策略都一成不變。然而，昨天成功的策略不等如明天也會成功。隨著財富累積，層次不斷提升，若投資策略未能同步跟上，瓶頸很快會出現，這就是所謂的財富極限。


    如前文提及，投資永遠是講求門檻的領域，愈高投資額就有愈多投資選擇，回報風險比也愈高，100萬的投資組合跟1,000萬的投資組合，回報率相差可以非常遠，1億以上的投資組合又是另一個層次。若這三種投資組合皆採取相同的投資策略，財富上要有新突破相信非常困難。


    所以「財富法則」必須要擴闊收入來源，關鍵在於突破你的單一收入來源。要從第一個100萬到踏上真正富足之路，除靠工資的主動收入之外，被動收入的來源亦宜分散。若收入來源單一，財富容易受經濟環境


