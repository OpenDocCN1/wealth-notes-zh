- pgno: 73
  md: '在分析 DPU 增長時，筆者會將之分為內部及外部增長。內部增長取決於旗下物業資產的出租率和租金上升空間、物業資產增值的能力（當中包括以翻修擴建、宣傳推廣提升物業營運收入），以及通過有效管理降低物業營運成本的能力。外部增長取決於集團背景、資金實力、融資能力、操盤能力、營運團隊物業買賣和物業開發的能力和經驗。


    # 2. 旗下物業資產質素


    挑選優質的房託基金，重要考慮因素必然是旗下物業資產的質素。要審視物業位處的地點（是一線區還是二線區？是核心區還是民生區？）、級數/檔次（是甲級還是丙級？）、旗下物業是否契合經濟週期和供需結構的物業類別（酒店/商鋪/商場/甲級寫字樓）等因素。再配合地區的經濟狀況及政策因素（如自由行數量的減少）作出分析，從而判斷其物業資產的供需結構是否有利。如果大於求，租金未來難以攀升，相反如果供不應求，租金會有一定的潛在上升空間。這點將直接影響
    REITs 的 DPU。擁有優質物業資產的 REITs，其 DPU 的增長才長遠有保證。


    # 3. 估值


    估值對投資者來說非常重要。無論一間上市公司如何優質，股價太高代表利好因素已反映在價格上，因此如果股價增長比盈利增長運快，投資者要考慮高進的風險。當大家都知道這
    REITs 十分優質，地點及質素都卓越，投資者和基金都蜂擁而至爭相認購，它的價格就會被追高，甚至超過物業資產的內在估值，所以投資者應根據各種因素對每隻有意投資的
    REITs 進行估值分析。


    ![](img/034fb7f1e667b45ed25196fc40e47173_73_0.png)'
