  md: '年進駐該區活化工廈，改建發展甲級寫字樓、酒店、商場，使該區工廈供應進一步收縮，價格非常硬淨。除商業元素外，荔枝角區與荃灣、葵涌不同，區內有多個已發展的大型私人屋苑，如四小龍等，亦有助帶動工商物業的總體需求。


