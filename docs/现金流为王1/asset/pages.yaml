    # 債券風險與

    投資技巧


    理論上，只要策略得宜，債券是穩健而回報率相對高的投資。債券價格波動性較低，因此只要有持至到期的準備，理論上債券是高回報、進可攻退可守的投資。


    當然，我們亦不能忽視投資債券的風險，此風險主要為 1、違約風險；2、利率風險；3、價格風險；4、流動性風險。


    # 1. 違約風險(Default Risk)


    違約風險即是債券發行人違約，例如公司破產、無力償還本金或利息。遇上這種情況，要視乎債券的結構，例如債券是否有抵押品或母公司擔保，又或者公司有備用信用證擔保（Standby
    LC），如果有擔保，債券投資者（即公司的債權人）有第一優先索償權利，除非抵押品不足償還或擔保人同時破產，投資者的索償權有一定保證。而即使債券沒有任何擔保或抵押品，債權人地位仍優於一眾股東（包括股票投資者），公司變賣


    ![](img/034fb7f1e667b45ed25196fc40e47173_96_1.png)'
  merge: -1
  img_proc: true
- pgno: 97
  md: '資產後會先償還債權人，歷史數據反映，企業債這約後的資金回收率達 85%。


    # 2.利率風險(Interest Rate Risk)


    市場利率風險上升，債券價格就會下跌，原因是現有債券的相對回報(Relative Return)下降，但不代表所有債券都會下跌，所以在預期利率將會開始回升時，選債技巧十分重要，故專業投資者會分析收益率曲線(yield
    curve)、預測利率走勢、加息幅度、經濟可否承受大幅加息、通脹預測是否有大幅加息的必要等因素。因此，利率風險同時導致價格風險。另外，做槓桿債券的投資者特別要注意一點，由於槓桿債券的融資利率一般是浮息，市場加息同時令融資成本上升，令套息空間收窄。


    ![](img/034fb7f1e667b45ed25196fc40e47173_97_0.png)


    ![](img/034fb7f1e667b45ed25196fc40e47173_97_1.png)


    第一站：滾動你的投資雪球'
