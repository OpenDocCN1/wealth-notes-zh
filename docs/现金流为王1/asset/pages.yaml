  md: '![](img/034fb7f1e667b45ed25196fc40e47173_106_0.png)


    # 不保本 不一定派息


    首先，何謂Coco Bond？Coco Bond全名為Contingent Convertible Bond (或然可換股票券)，顧名思義，是可換股票券的一種，原理其實與優先股相若；在指定的情況下，債券持有人所持之債券隨時可能會被迫轉換為股份，持有人就從債主變成股東，因此Coco
    Bond並不被視為保本債券。投資者買入Coco Bond時表面上是一種債券，然而該債券設有觸發事件 (Trigger event)，不同公司發行的Coco
    Bond的觸發事件、合約條款也有可能不同。Coco Bond的發行人大部分以銀行為主，而銀行所發之Coco Bond的觸發事件一般為其一級資本充足比率 (Tier
    1 Capital Ratio)，當比率下跌至7-8%，Coco Bond就會自動轉換成股'
  merge: -1
  img_proc: true
- pgno: 107
  md: '票，而當該情況出現，銀行股票的股價很有可能已大瀉，變相入股該銀行，投資本金難免錄得大幅虧損。此外，Coco Bond 不保本之餘，發行人亦有權不派息，有些甚至設定
    Discretionary Interest Payment 條款，即發行人可隨意選擇派多少利息，說白點就是連本息都不保證。因此，由大銀行所發行的 Coco
    Bond 回報雖然吸引，有部份更高至8-10%，槓桿後回報近20%，但投資者不應將投資Coco Bond 視同投資一般公司債券。正確來說，Coco Bond
    不應視作債券來投資。


    Coco Bond 的誕生，是經歷金融海嘯後，各國央行開始明白到銀行及金融體系安全的重要性。由於很多大銀行是「大到不能倒」，因此當銀行流動性出現問題時，政府不能不救，最後只能用納稅人的金錢去注資挽救銀行，市民對政府自然怨聲載道。為免事件重演，國際清算銀行在制定《巴塞爾資本協定》時，對銀行的一級資本充足比率有比較高的要求。根據《巴塞爾資本協定3》(Basel
    3)，銀行的一級資本充足比率須達到6%或以上，而 Coco Bond 則可以計算在額外一級資本（Additional Tier 1 Capital）內，使銀行在不用攤薄股份權益的情況下，提升銀行的一級資本充足比率，變相鼓勵銀行大量發行Coco
    Bond。Coco Bond 的發行量由2010年不足50億美元，大幅升至目前近700億美元，增長速度相當驚人。


    # 銀行一旦大換股 或現新一輪風暴


    Coco Bond 本身沒有問題，相反它有助提升銀行的後備資本，使大眾或存戶對銀行體系的信心增加。然而，由於產品有利可圖，各大投行大力


