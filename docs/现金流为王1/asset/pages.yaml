    # 投資外幣REITs 對沖錯誤風險


    對於投資外國上市的外幣計價REITs或股票，投資者必須要留意其外匯風險，避免無息錯匯價。


    由於大中華豐樹商業信託是新加坡REITs，借新加坡紙投資是最佳對沖匯率波動的方法。當投資者買入外幣計價REITs或股票，投資者需要將手持的港元兌換成外幣去買入該REITs，等於持有外幣資產。假如該幣匯率兌港元貶值，投資者便會錄得外匯損失。由於我們投資REITs的目的是要


    ![](img/034fb7f1e667b45ed25196fc40e47173_85_0.png)'
  merge: -1
