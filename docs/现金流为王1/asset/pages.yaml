  md: '其實香港的營商環境仍有可取之處，無論在人才、稅率、國際聲譽、自由度都有優勢。只是金融海嘯後，美國多次大量寬帶來世界貨幣政策經濟的新玩法，香港是外向型經濟，加上聯匯的牽制，面對著市場大起大跌，香港只能隨波逐流。與此同時，互聯網時代的來臨，世界出現鉅變，當香港人尚未了解新經濟模式的新玩法，而只為置業、政治而極度憂慮的時間，多年來留守在傳統產業（金融、地產和服務業）的香港人，思想明顯還未能完全跟得上步伐。然而，世界是不會停下來。這世代，無論美國、台灣、內地都在向「互聯網
    +」的方向發展各類型產業。不論香港以前在傳統產業上有多大優勢，都要面對現實轉型。香港人在過去數十年很成功，大家也習慣了這種成功模式，要改變可能不是一時三刻能夠接受得了。


    # 「互聯網 +」時代 創造新產業是大趨勢


    互聯網是世界性的即時資訊平台，現行新世代不能缺少，從商業的角度，所有互聯網商業模式都是「互聯網 + 傳統商業」的模型。所謂「互聯網 +」，就是互聯網將能改變任何產業，發展方向都會加入互聯網概念。例如互聯網
    + 金融 = Fintech（金融科技）；互聯網 + 貸款 = P2P；互聯網 + 跨境貿易 = 跨境電商。1.0 時代是互聯網 + 信息，2.0 時代是互聯網
    + 交易，3.0 時代是互聯網 + 綜合服務。1.0 時代已經過去，2.0 時代已經開始了好一段時間，目前正由 2.0 演變去 3.0。傳統產業要不被淘汰，就要跟得上時代轉變。'
