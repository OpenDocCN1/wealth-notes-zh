  md: '# 2.11 債券風險與投資技巧


    2015年人民幣債券價格跌幅頗大（平均跌幅約百分之幾，債券來說已是頗大），原因是人民銀行主動上調人民幣中間價，引導人民幣一次性貶值4%，投資者因恐人民幣匯價持續走低，遂拋售手上人民幣資產，轉而持有外幣資產。事實上，更重要原因是槓桿人民幣債券的投資者斬倉，拋售人民幣債券，推低人民幣債券價格。


    有讀者可能會不明白，在人民幣債券價格本身沒有下跌的情況下，人民幣匯價下跌，為何槓桿人民幣債券的投資者需要補倉或斬倉？原因很簡單，債券投資者之所以槓桿債券就是為了套取息差，而美元的拆借成本比人民幣要低很多，投資者為了將息差最大化，必然借入美元。投資者在買入人民幣債時，持有的是人民幣資產，而借入的是美元。因此，當人民幣兌美元匯價下跌時，投資者所持有資產價值下跌，而負債則上升，故即使債價本身並沒有下跌，投資者亦需補回差價，即補倉。'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 交叉貨幣槓桿投資 須管理外匯風險


    其實交叉貨幣（Cross currency）的債券槓桿操作，等同槓桿了匯率的升跌，是雙刃刀。應用同一個例子，如果人民幣不是下跌，而是上升，投資者會獲利，相反便會虧損。筆者曾以同樣方法在短時間內獲利1.5倍，當時中央正大力推動人民幣國際化，人民幣幾乎是每年保證升值。


    筆者當時買入人民幣存款證（Certificate of Deposit，CD），回報約3%，然後抵押予銀行借回美元，貸款利率1.5%。由於是自己銀行發出的CD，融資率高達97%，槓桿倍數為33.33倍。即使人民幣兌美元匯率不變，息差為1.5%，槓桿後的回報率已達1.5%
    x 33.33 = 49.995%p.a.。當年一年間人民幣兌美元匯率由6.5x上升2000點子至6.3x，升值幅度約3%，即匯率部分回報為3% x 33.33
    = 99.99%，總回報（息差＋匯率收益）達150%。此次是筆者唯一一次使用槓桿做交叉貨幣的套息交易。


    善用槓桿，回報非常可觀，但如上文提到槓桿是雙刃刀，使用槓桿同時亦不只要做好風險管理。一般專業投資者做套息交易時都會將外匯風險鎖定，方法是買入相反方向的遠期合約(Forward)或貨幣掉期(Currency
    Swap)，目的是只套息差，規避或管理好其他風險。做套息交易的專業投資者會儘可能避免做單邊操作，除非像筆者當年對人民幣單邊升值非常有信心，否則必須做好對沖其他可能潛在風險的準備。


    ![](img/034fb7f1e667b45ed25196fc40e47173_111_0.png)'
  merge: -1
  img_proc: true
- pgno: 112
  md: '# 人民幣債券 配合遠期合約對沖


    如上提到，由於資金成本的問題，要模擬人民幣債券，借入的貨幣必然為美元，故存在著人民幣貶值的風險。要對沖人民幣貶值風險，可同時買入購匯方向（即買入美元賣出人民幣）的遠期合約，到期日需與債券到期日相吻合，最好為債券到期日多三天，因為債券一般是T+3交收。


    假設買入債券時的即期價格（Spot Rate）為6.30，一年期的遠期合約一般為6.50左右（約2000點溢價）。債券到期時，假設當天匯率為6.80，債券槓桿部分會虧損5000點子，但遠期合約會獲利3000點子，對沖成本仍為2000點子；相反如當天匯率為6.00，債券槓桿部分會獲利3000點子，但遠期合約虧損5000點子，對沖成本仍為2000點子，即約3%，因此，如買入的人民幣債券的息差為6%-7%，減去對沖成本的3%，仍然有利可圖，投資者亦可放心放大槓桿進行套息交易。


    # 人民幣貶值預期下的買債策略


    如今預期人民幣貶值，投資者也可利用外匯遠期合約作反向操作套息獲利。


    上文提到借入美元買入人民幣債券會產生人民幣貶值的風險，因此做套息交易時為對沖人民幣貶值風險，不惜付出3%溢價購入買美元沽人民幣的FX Forward 以鎖定美元兌人民幣遠期匯率。但市場瞬息萬變，作為專業投資者，應該值得在不同市況下都能以最佳的應市策略獲利。說是最佳的應市策略，其實應說成最有效利用市場特點獲利的策略。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '![](img/034fb7f1e667b45ed25196fc40e47173_113_0.png)


    在中央引導人民幣貶值時，由於市場對該種貨幣的貶值預期，加上人民幣相對美元為高息貨幣，根據利率平價理論（Interest Rate Parity），買入美元沽出人民幣的遠期合約價格會出現明顯溢價，即是比較貴，以上述例子就是比現匯價貴3%。以相同邏輯，如果反向操作，即購買入人民幣沽出美元的遠期合約，價格必然會有折讓。因為市場普遍預期人民幣貶值，一年後遠期合約的人民幣匯率價格比現在低是很正常。


    假設今天的現匯價為6.4367，一年期買入人民幣的遠期合約價為6.6190，比現匯價折讓2.83%。既然如此，我們只需作反向操作，直接買入美元債券，將之抵押銀行借出人民幣，將人民幣兌成美元再買入美元債券，只要債券利率高於人民幣拆借成本就有套利空間。


    ![](img/034fb7f1e667b45ed25196fc40e47173_113_1.png)'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# 海航集團美元債券實戰案例


    以海航集團美元債券為例，到期日為2018年3月，買入人民幣的遠期合約價應比上述更大折讓，為免太複雜難明，假設遠期合約價仍為6.6190，比現匯價折讓2.83%。


    該美元債券YTM為7.20%，融資率60%（即2.5倍槓桿），人民幣融資利率3.8%pa.，槓桿後回報約為11%。但是次操作是借入人民幣後，將人民幣以現匯價6.4367兌成美元，再買入美元債券，到期時由於已買入一年「購入人民幣」的遠期合約，協議匯率為6.6190，即當債券到期時，發行人將美元本金償還給投資者，投資者可以6.6190協議匯率將美元兌回人民幣，償還人民幣貸款。因為協議匯率（6.6190）比現時現匯價（6.4367）高，即投資者以相同美元數量可兌換更多人民幣，在償還所有人民幣貸款後仍有餘額，這部分就是FX
    Forward帶來的鎖定回報。


    是次操作槓桿2.5倍，FX Forward的回報為2.83%×2.5=7.075%。因此，總年回報為11%＋7.075%=18.805%。以一年左右、沒有任何匯率風險的短期債券來說是相當不錯的回報。當然，上述操作需有一個私人銀行戶口。由此可見，只要擁有一個私銀平台，可有低息融資進行低風險的套息套匯交易，一年要獲取10%以上的穩定收益易如反掌。


    投資，從來都是講求門檻的地方。門檻指的不只是資本，更重要的是知識及資訊，以及是否擁有富人的視野。'
  merge: -1
  img_proc: true
