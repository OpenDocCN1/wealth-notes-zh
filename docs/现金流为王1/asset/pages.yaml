- pgno: 31
  md: '先旨聲明，筆者絕對支持年輕人創業，人生不應該由起點到終點都是打工，我更絕對贊成年輕人應以創業心態去工作（詳見1.2章節）。但只想發美國矽谷模式Startup夢的話，請你醒一醒，因為只想不做沒有用，應該如何執行才最重要。


    # 打破「窮忙族」的宿命


    而如果你仍相信那套傳統思維，跟著傳統的路去走的話，你的人生已可算是落在固定軌道上。筆者不是算命師傅，但大概都能預測到你將來的人生，準確度大約有八至九成。


    以一個普通打工人士為例，一生收入大概在1,400萬至2,200萬港元左右（假設工作30年，每月平均收入4至6萬元），當然不同打工人士收入有高有低，收入較高的生活水準會好些，較低的會差一些，在此僅以一個平均數作例子。


    支出方面，以一個人大約有80多歲壽命計算，退休時間約有30年，若退休後每月開支大約15,000元（假設已有樓自住，無須租樓，未計醫療開支及通脹），30年的退休開支就要540萬。一層自住樓大約500萬，30年按揭利息總支出179萬（假設利率維持2.15%）。如果闢下一生人的收入為2,200萬，退休開支和自住樓連利息開支已佔1,219萬，只餘下981萬，即30年的打工生涯，每月只能以2.7萬元去應付日常生活開支，如果還要養妻活兒，實在難有儲蓄。


    ![](img/034fb7f1e667b45ed25196fc40e47173_31_0.png)'
  merge: -1
  img_proc: true
- pgno: 32
  md: '可以想像，在人生有限的收入下，如果不作投資，沒有額外的現金流，人生的變化不會多，可以做的非常有限。每日營營役役，付出了寶貴的時間，卻未能換來應得的財富和安穩的生活，這正是典型「窮忙族」的寫照。


    從以上邏輯推論，要過多姿多彩的人生，跟著傳統的思維去走幾乎是不可能的。


    想走出這個死胡同，脫離「窮忙族」，及早規劃人生是必須的。如果閣下目前仍只擁有傳統的打工思維，希望讀完本書後能夠有一些啟發，儘快開始生涯規劃，儘早賺回時間和人生，做自己喜歡做的事。


    # 儘早規劃 尋找自己的藍海


    筆者認為，每個人都必須要有生涯規劃，愈早做愈好，沒有規劃的人生難以成功。


    近年坊間流行「贏在起跑線」之說，然而起跑線真的這麼重要嗎？當然，在現實社會裡，身處食物鏈愈高處愈好，但若然起跑線一開始就設在食物鏈的高處，亦意味著缺少了這條「起跑線」的經歷，而這些經歷卻是對人生下半場的發展，起著決定性作用。正如一個剛畢業的年輕人，擁有無數金光閃閃的沙紙，但沒有工作經驗，甫入職場便是集團行政總裁或是高級管理層，這個package
    看似完美，但實際上充滿缺憾。試問一個沒有前線經驗、沒有公司營運經驗的CEO，又如何憑空管理好整個集團？


    ![](img/034fb7f1e667b45ed25196fc40e47173_32_0.png)'
