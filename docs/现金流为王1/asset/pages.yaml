    私銀或其他低融資成本的證券平台雖然是一個很好的理財管理平台，但偏偏大部分的私銀客戶或一般散戶都不懂得好好利用在低息環境下低息融資平台的好處。相當一部分的私銀客戶是全權交由私銀經理代為管理，反而變成了投資銀行家在客戶身上賺錢的平台。理財始終需要親力親為，亦需要具備基本的認知。謹記，你不理財，財不理你。'
