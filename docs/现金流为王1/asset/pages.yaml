  md: '模式去經營一盤地產生意。簡單而言，工業的增值操作是創造價值，除了帶來高回報率和額外現金流外，還為投資者帶來新的生意機會，只要結合商業模式運作，該盤生意便能成為長遠為你帶來被動收入的系統。


    對於較具資本實力的投資者而言，可選擇買入整層工廈，然後再進行分契拆售，這種操作的回報率更高，且資金回報的時間更快，以商業模式操作的概念，能做到貨如輪轉的效果。


    # 有配套小單位 市場需求大


    買入大面積單位或整層工廈，呎價一般比細單位低約兩三成，視乎面積與新舊程度。在香港，九龍區的細單位工廈租金可達26元 / 呎，對一些經營網購需要倉儲功能小單位的用家，或需要儲存大量文件的會計／公司秘書行業，又或是一些需要找一個市區且能夠24小時出入的co-working
    space 的freelance工作者而言，他們能夠負擔的租金有限，一般商廈對他們而言實在太貴，而且所需的空间根本不需要太大。成本低、lump sum小、有裝修和配套且具管理的工廈小單位，就能填補這個市場空缺，可以說是一個Niche
    market。月租金數千元，實際用家可以負擔，對業主/發展商而言，呎價更相當吸引。以目前長沙灣或荔枝角區而言，這類型分拆工廈的市價約為6000-7000元/呎的水平。


    大面積且裝修殘舊，又或是有生息線和機器在內的工廈單位，呎價則相對低廉。原因是面積大，且用家要先清場再裝修的成本相當高，不容易找到租客。租值低，呎價自然低。因此，將大單位分契拆細，再配以雅觀的裝修設計，以市場細單位價格出售，可說是一種「增值套利」的商業營運模式。


