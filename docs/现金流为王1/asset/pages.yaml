    # 借私人貸款投資 做法危險


    自住樓不能產生現金流，所以自住於已供滿的物業，算是一種消費。在目前銀行水浸的低息環境，按揭利率低至H+1.3%，另有回贈，回贈金額足夠你付半年以上的利息，而罰息期僅兩年，兩年後轉按再收一次現金回贈，即實際上兩年內只需支付一年多一點的利息，而支付的利息金額少得可憐；銀行生意真不易做。因此，加按資金只要投資於穩定收益的資產，回報率稍高於按揭利率，已可產生額外的被動收入。加按出來的資金算是流動資產，可以申請私銀平台，有私銀平台的幫助，要投資確


