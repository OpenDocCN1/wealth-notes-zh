    對年輕創業者而言，不須每一門生意都要求長遠持續獲利，這是不現實的。因此，可以的話應該先做到短暫獲利，儲夠子彈，賺得一桶金後才有資本轉型做「資本運作模式」的生意。以上述韓國產品貿易業務為例，筆者接手後已完全放棄電商銷售平台，轉為純批發生意，從不坐貨，但仍然能壟斷某數款產品於香港的銷售，成為莊家之一。原因是價格取勝，筆者公司在產品的價格上只賺取極少差價，在上市市場上，基本上沒有任何一個供應商的價格比我們更平。我們能做到如此低價是因為利潤主要體現於出口退稅，而出口退稅需要數月時間，不是每個商家都等得了。對於這門生意，筆者看的是使用的資金數量和利潤體現的時間，計的是IRR，也就是資本運作的概念，3個月時間賺10%，年化回報就是40%。


