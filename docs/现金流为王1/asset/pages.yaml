    # 初哥宜投資短年期債券


    如果上述技巧掌握得宜，在一般情況下，根本不用擔心債券價格波動導致的補倉問題。當然，對於債券投資初哥而言，想減少債券價格波動帶來的風險，宜選擇年期較短的債券。因為債券的特性是到期保本，故此當債券愈近到期日，債券價格的波動會減少，並且會回歸票面值（Par價格，即$100），對於債券投資初哥而言，相對較容易掌握，投資回報率更容易準確計算。


    對於債券的槓桿操作，雖然市場上有部分證券行對非私人銀行客戶亦會提供槓桿，惟筆者一向不建議。槓桿債券有高回報主要是利用套息交易，因此關鍵在於息差，在利息成本高的情況下，利差不夠闊，雖然一開始仍有不少的利潤，但面對加息或其他風險時持債成本會增加，持債能力不足會導致有機會產生虧損，與投資
    Fixed income 的原意不同，這種做法亦與筆者的投資理念相違背。


