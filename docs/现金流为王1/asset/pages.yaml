  md: '資本不多，雖然毛利少，但時間短，轉數快。做貿易生意首先要選定一種存在價差的產品，當然每做一件要取得成功，你必須要對此十分熟悉，做足功課，務求令自己在短時間內變成行內專家。例如你是做韓國化妝品的，那最起碼你自己本人是用家，了解產品的潛力和未來趨勢，了解市場價格，然後最重要的環節就是尋找貨源。


    # 貿易生意入門易 適合創業初哥


    互聯網發達，只要你懂英語（懂多國語言更好，不懂的可以去學），要在網上找到供應商或供應商指定的分銷商（Distributor/Dealer）一點也不難，有誠意的可親身飛往當地面談，成本也只是一張來回機票。接下來便是分銷渠道（Sales
    channel），只要你懂得利用互聯網，就能輕易地建立銷售平台，而且是零成本。做電商或網上代購的好處是，你即使手無一貨都可以銷售，無需坐貨，只需要一大堆貨品的照片，便可全力打市場。


    筆者一位好朋友，現在是筆者貿易公司的負責人，他當時也只是一人公司，手無一貨，自學韓語，隻身跑到韓國尋找市場具潛力的化妝品和服裝，進入當地門市偷偷拍攝貨架上的產品，有時甚至在當地時裝店的試身室內偷拍，然後將相片放在網頁和FB專頁上，收到訂單才入貨，再安排寄貨。慢慢地，他成功建立了自己的品牌，開始有部分香港和內地的零售店買手與他接觸，憑著手持大額的訂單，成功直接向供應商以大折讓的價格取貨，短時間內壟斷了某數隻韓國產品在香港的銷售。當然，這類韓國產品換款相當快，市場潮流經常轉變，難以長遠壟斷一隻產品而持續獲利。因此，這類貿易銷售業務能帶來短暫的盈利，但要長遠持續就必須及時轉型，並且配合適當的經營策略。'
  merge: -1
  img_proc: true
