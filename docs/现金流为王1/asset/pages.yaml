- pgno: 171
  md: '投資日本物業，最大風險不是物業本身的價格升跌，而是日圓匯價的波動風險。安倍晉三2012年底上台後，加速實施一系列刺激經濟政策，最引人注目的就是寬鬆貨幣政策，日圓匯率開始加速貶值，直至近期各國貨幣戰，日圓匯價才開始喘息回穩。但在各國寬鬆貨幣政策救經濟的新時代經濟大環境下，日圓匯價再下跌的風險不低，且幅度難以預計。


    # 當地銀行做定期 賺息差抵融資成本


    投資日本物業同時要對沖日圓匯率風險，最直接做法是在日本當地銀行做按揭，借入日圓購入日圓計價資產，匯率風險便會自然對沖。投資者可 在當地的中國銀行、建設銀行或交通銀行申請按揭貸款，按揭成數最高可達五至七成，利率在2-3%左右，年期最長20年。剩下的就是首期部分的匯率風險，假設當地中國銀行批出五成按揭貸款，一般人做法是將手上的港元本幣兌換成日圓後，匯往日本直接支付首期。


    但要對沖匯率風險，較明智做法是將手上的港元/人民幣以定期方式存入日本中國銀行，畝做3年定期，收取約4%的定期存款利率。將人民幣定期存單抵押予當地中國銀行，以低息借出日圓，由於人民幣利率比日圓利率高，可套取1-2%息差，賺取的息差差不多可以抵銷借入日圓按揭的融資成本，同時可對沖日圓下跌的匯率風險。投資，永遠要利用低成本的弱勢負債，持有強勢資產。


