  md: '倉地本來已經不夠，加上新界東北發展計劃即將上馬，以及未來洪水橋和元朗南發展規劃，政府將會大規模收地，令倉地市場供不應求的情況更趨嚴重。根據元朗南發展區最新規劃方案，元朗南可發展的183公頃面積，近六成屬棕地，包括已荒廢農地或用作露天倉貯（Open
