  md: '# ## 2.4

    真正的高息股：

    房託 (REITs)


    投資REITs及高息股，都可產生持續的現金流，大家應多加研究。筆者在第一站曾提及，REITs盡得房地產升值之好處，而且化解了投資住宅的辣招及回報率低之短處，同時具有高倉值的特點，是穩健投資之選。那究竟REITs是甚麼？


    # 低負債 高派息


    REITs (Real Estate Investment Trust) 中文全名為房地產投資信託基金，簡稱「房託基金」。沒錯，REITs 如其名是一隻基金，性質是上市的封閉式基金
    (closed-end fund)，所以其基金單位就像股票，按現行市價買賣，而市價很大程度由市場供求決定。理論上，基金單位的價格與本身的資產淨值沒直接關係，即其二手價格可能較基金本身的資產淨值出現溢價或折讓。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '房託基金集中投資各類型房地產項目，如大型商場、購物中心、酒店、服務式公寓、辦公室、停車場項目等。其收入主要為租金，也包括物業升值所帶來的收益，此可體現於出售物業帶來的實際收益或物業重估的帳面收益。租金收入和物業升值的收益，都會帶來基金資產淨值的上升。


    房託基金與房地產開發商大有不同，房託以租金為主要收入來源，而開發商則以銷售物業為主要收入來源。由於租金收入較銷售收入更為穩定，收入波動性較低，業務風險也較低，且派息比率有保證，預測投資收益的現金流入也較為「有數得計」。


    有別於其他上市公司的股票，房託基金最大的特性是會把大部分稅後盈利以股息派予基金持有人。要留意的是，不同國家或地方對房託基金派息率要求都不一樣，但原則上都要求基金須將大部分盈利派發予股東。


    以香港為例，證監會的「房地產投資信託基金守則」規定，在香港上市的房託基金，須將最少 90% 的稅後淨收入以股息定期向投資者派發，也限制其借貸比率不能高於 35%。因此，房託基金的資產負債結構十分穩健，一般企業常見的負債過高情況在房託身上不會發生，加上其收入來源以租金為主，是一隻現金牛，每月現金流入穩定，房託的股東能夠定期收到穩定的現金派息。所以說，房託是風險低、穩健、計到數的投資。


    不少人擔心，美國聯儲局加息可能會使 REITs 價格受到明顯影響。筆者認為，即使會加息，美國目前也沒有條件續續加息，而且加息幅度應有限，更遑論進入加息周期。此外，有別於債券的固定票面息率，REITs
    的收入、盈利和股息卻是浮動的。如果聯儲局在若干年後真的大幅加息，


