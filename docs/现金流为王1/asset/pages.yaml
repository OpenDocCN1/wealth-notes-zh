  md: '# 推薦序


    芷凡 著名財經 BLogger、《財富未來》作者


    坦白說，從前看一本著作時，多只會閱讀其內容，未必會留意序言，無論是作者自序還是友人所寫的推薦序，最多只是輕輕看過便算。自從自己有機會出版著作，用心編寫出一本著作之後，發現寫自序時是一個與讀者溝通的地方，透過自序可以有效告訴讀者編寫這本著作時的心路歷程。後來被邀請替其他作者寫推薦序，每次也用心去閱讀談論與作者的關係與感覺。因此，如今到書局拿起任何著作時，多會看看人家的序言，因為明白到這是一個精讀，透過別人的推薦序亦能窺探到一些有關作者的掌跡。


    回想一下，原來認識 Starman 並不是很長時間，記得他於 2015 年中才開始寫 blog，當看到他的文章時，發現非常另類，所討論的投資工具非一般之餘，每每所談及的數字都與一般打工仔所理解的不一樣。三十出頭的小伙子，甚麼每月六位數字被動收入，動不動
    10 萬、20 萬美元的債券投資，起初實在不敢相信，本身太小人之心了，不知道 blogger 有否問題。


    同樣的感覺，我在看另一位「離地」blogger 百樂時也一樣，於是我多會做一些 due diligence，想辦法去驗證這些 blogger 的可信度，包括建議另一位
    blogger 巴黎邀請他作 live、建議 IMoney 記者作個訪問，亦主動邀請他出來飯局，因為只要從不同的渠道了解及觀察一個人，是龍是鳳，一看便知。始終，若這人沒有財商的話，談三兩句，觀察其即時反應，很容易「露底」，有些東西是裝不出來的。


    ![](img/034fb7f1e667b45ed25196fc40e47173_6_0.png)'
  merge: -1
  img_proc: true
- pgno: 7
  md: '一連串的due diligence後，愈來愈想了解Starman的致富之路，他從開始到今天的身家數字，雖不可能被完全透露及交代細節，但從語意間的資訊，屈指一算，還是有跡可尋，他的致富思維、方法與眼光也相當合理，算是把「離地」的部分成功「接地」了。今時今日，親身見過面，若不對路的，難以逃過本尊法眼，哈哈。財務知識不能假裝吧，若有人能裝出豐富的財務知識，那麼此人就真的有相關知識，要賺錢也不會難。


    有一點令我印象深刻，就是Starman文章中思維的老練。著作一開始，看到Starman以旅行到目的地比喻人生的道路，走路慢而風險低，坐飛機快但失去了過程。他會選擇搭火車，可不費勁之餘又可以欣賞沿途風景。而有一點更貼切的，他不是實二代，一開始到火車站上火車前，仍是要用腳慢慢地走一段路，這比喻找第一桶金的過程，猶如要成功抵達火車站，也需要努力。


    看見Starman的手筆，絕對不像一位三十出頭的小伙子，與他交談後，得知他工作年資不長，打工的日子只是數年，但寫起文章時好像在職場上領悟到不少。由打工、第一桶金、百萬到千萬富翁，由散戶的投資項目跳到散戶不能參與的領域，把人生分成三個十年，每個十年再分成兩個五年，在每一個階段都有其想法，我們又怎麼想得到作者的人生階段，原來只是正在第一個十年轉往第二個十年的時期呢？'
  merge: -1
  img_proc: true
- pgno: 8
  md: '說回這本著作，當中寫下不少Starman自己的操作理念，市面上多沒有相關範疇的財經著作，這包括債券、REITs、人民幣這些投資工具，再到投資工廈、倉地、農地農莊、投資馬來西亞、貿易生意、海外物業等等，這些內容都是一個投資者的經驗之談，而並不是在象牙塔中的學者所寫出來的教科書，舉例如債券投資，可能不少教科書會把債券的學術細節一一說明，但作為投資者是如何理解債券的相關資訊，找著那些重心作投資決定，看看這本實戰秘笈吧。


    我不用說太多「祝這本著作大賣、一紙風行」等話語，因為我知道這都是必然的。


