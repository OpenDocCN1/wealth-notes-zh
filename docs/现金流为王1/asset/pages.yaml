  md: '日農莊、後花園，在工餘時間嘗試種菜，在戶外露營車內與家人享受親近大自然的悠閒感覺，是一個有意義的投資項目。


    想投資農地的投資者要注意，筆者發現目前新界大部分的小型農莊項目，嚴格來說都有違規風險。若希望改造成像筆者一樣的休閒農莊項目，並在農地上擺放露營車或有蓋物，其實需要先向城規會提交申請「休閒農莊」用途。投資者可根據每一地段的土地，查看城規會就該地段的規劃用途（Use
    Guideline）。第一欄為經常准許的用途，第二欄為非經常准許或帶條件性准許的用途，事前須經城規會批准方可進行。對一般農地來說，「休閒農莊」一般為經常准許之用途。


    此外，如業主希望在農地上擺放露營車或其他非結構性的有蓋物，亦須同時向地政總署申請短期豁免書（Short-term Waiver），定期向地政總署繳交豁免費用即可。


