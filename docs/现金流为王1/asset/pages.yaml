  md: '# 3.5 投資工廈取代住宅  待價值釋放


    目前住宅市場受制於政府 SSD、DSD 等辣招，DSD 加辣後，買入第二個住宅物業更要繳付 15% 印花稅。目前按揭收緊至六成，收租物業最高五成，在重重辣招下，住宅物業的投資價值已所剩無幾，加上政府政策側重增加住房供應（包括私人及公共房屋），以目前住宅的價錢（特別是細價樓）及回報率，理論上已沒有合理的投資價值。


    目前不少老一輩仍有意買入住宅長線收租，主要基於他們的知識及資訊的局限，缺乏其他更好投資渠道。要知道手持現金是有成本的，亦即是銀紙的貶值風險，而缺乏理財知識和廣泛投資渠道的一般人，就只能奉行買樓收租的傳統智慧對抗貶值風險。


    # 工廈供應已成定局 需求卻穩增


    建築成本不斷上升，已與現時部分單層工廈的建築呎價相若，加上政府政策側重增加住房供應，工廈未來的供應基本上不會再增加。工廈是在'
