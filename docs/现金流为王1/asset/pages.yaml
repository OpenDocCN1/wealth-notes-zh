  md: '但如盲目地把西方的那一套，原原整整地硬加於我們中港台的经济體身上，的確是需要作出一定程度的本地化和改良。


    不得不提的，是書中對現今香港年青人發展空間和機遇的反思。這也是Starman兄和小弟一直以來，每次見面必談論的議題。人生，真的有樓就萬事足嗎？有樓收租就是成功？


