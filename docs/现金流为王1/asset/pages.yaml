  md: '# ### 2.13 投資債券與 REITs 的機會成本概念


    環球市場不景，機構投資者在未能看透後市的情況下，傾向選擇較保守、穩健的投資策略，以致大量資金停泊在短期債券、REITs 身上，持盈保泰，穩健收取固定收益。這導致債價及
    REITs 價格急升，更有不少多次升穿歷史高位，孳息大幅下跌。


    雖然近日市場預期美國會開始加息，但幅度有限，始終在各国都低息的情況下，美國加息只會令美元進一步強勢，對美國剛復甦的經濟百害而無一利。因此，筆者不認為美國有條件大幅加息，市場的偏低息環境會持續，債券及
    REITs 最終只會繼續受追捧。


    2015 年尾，日本首相安倍晉三再度推出新一輪刺激經濟措施，總規模將高於 28 萬億日圓（約 2 萬億港元），遠超此前盛傳的 20 萬億日圓（約 1.47
    萬億港元）。筆者認為，這個遊戲一開始便不能回頭，像抗生素一樣，只能一直服食。這個環球經濟局面史無前例，以往的經濟理論亦不能解


    ![](img/034fb7f1e667b45ed25196fc40e47173_121_0.png)'
  merge: -1
  img_proc: true
- pgno: 122
  md: '擇，加上各國根據博弈論預測其他對手的行為而作出相應行動，令局面更難以扳轉。如果價信及REITs價格在將來仍然維持高位，對想入市的投資者可說是十分頭痛。


    # 帳面錄收益 沽出還是持有？


    有讀者向筆者報盈喜，表示早前跟筆者開始建立的「Bond + REITs」投資組合，在適當運用槓桿下，錄得不錯的帳面收益，詢問筆者意見，是繼續持有還是沽出？對於這問題，筆者一如以往不會正面回答。讀者要考慮的是不同投資產品的特性，長期持有的價值及增長空間，而更重要是繼續持有的機會成本，再作綜合考慮。


    筆者以「Bonds+ REITS」組合投資多年，作為投資者，對於近一兩所錄得的龐大帳面收益，理論上應該是值得高興，但作為長線投資者，同時亦面對進退兩難的問題。資產價格上升，同時代表孳息下跌，繼續持有的機會成本上升。對於投資相對穩定收益的資產，投資者應考慮現時的孳息（Current
    Yield），而不是買入時的歷史孳息（Historical Yield），因為現時的孳息包含了再投資的機會成本。


    ![](img/034fb7f1e667b45ed25196fc40e47173_122_0.png)'
  merge: -1
