- pgno: 144
  md: '工廈的價值和用途如果不能有效地釋放，將造成極大浪費。目前不少工廈作爲網購實體店、樓上舖、陳列室、工作坊、半寫實辦公室、藝術工作室等。政府政策只有一條路可走，就是擴張並規範化工廈的用途，使工廈價值真正釋放。事實上，政府亦在《2030年長遠策略報告》中提及，會主動研究擴張工廈用途，鼓勵轉型。當工廈價值能夠被政策釋放時，其價格自然會反映其價值。在價值體現前，以5%的回報率收租等待，絕對是不錯的選擇。


    有不少人都有一個錯覺，認爲投資工廈入場費極高，無一千幾百萬都唔使諗，其實主要因爲普通工廈單位的面積大，而按揭成數最高僅四成，lump sum動輒一千幾百萬。其實這是錯覺，只是大家沒有留意，即使是市區，仍然有不少原則細單位工廈（非拆售工廈）1000呎內，呎價平均三、四千元左右，總價由二百多萬到四百多萬左右的選擇仍然很多，適合長線收租，回報4-5%基本上可以達到，且樓價目前仍低水，升值空間大，三年內賣出亦不用繳付SSD。相反，目前市場住宅回報一般僅2-3%，樓價再大幅上升空間已不多。所以，目前已開始見到有部分住宅投資者換馬，賣出部分出租物業，轉而購入數層市區細碼工廈收租。


    # 須留意周邊配套 西九龍看好


    地區而言，筆者較看好西九龍，特別是荔枝角區，主因該區七至八成以上用家爲租客，大部分工廈之業權高度集中，如羅氏、利豐及其他廠老闆家族。這類大業主偏向長線持有收租，一般不願出售，以致市場放盤極少，而租賃市場蓬勃，加上大集團如德京發展、宏基資本、新地等近'
