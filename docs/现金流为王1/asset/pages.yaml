  md: '# 3.10


    # 物業產融結合

    財富幾何級數升值


    2015年中，筆者以低於市價在上水購入一幅倉地後，立即進行建倉工程。由於該地涉及斜坡，需要加建擋土牆，令整體工程延誤了整整超過六個月，失了點預算。經過近一年的建築工程，整個9萬呎的現代化物流倉項目終於完成了，並已全部租出，租金回報率超過10%，以資本化率（Capitalization
    rate，簡稱Cap rate）5%左右計算，目前估值2.53億，呎價約2800元/呎，在不足一年的時間裡增值超過一倍，可算是十分成功。


    # 銀行融資 將帳面升值實體化


    整個貨倉項目建築面積約9萬呎，分拆成11個獨立契小貨倉，筆者公司同時提供物業管理。市場對物流貨倉需求旺盛，而新界倉地及貨倉的供應嚴重不足，未來情況將會更加嚴重，筆者與市場研究公司合作，收集


