- pgno: 158
  md: '政府、業主、用家都大大低估了棕地的功能及價值，往往都會在問題真正浮現時才意識到，情況好比十年前，大家仍未意識到住宅供應問題一樣，到問題真正來到的時候才亡羊補牢，最後用多少力氣才能追回十年的時間？


    筆者作為小投資者，雖然早已意識到問題，但可以做的，就只能從經營業務及投資的角度出發。這段時間，筆者一直努力物色具條件的露天倉地，買入作投資及興建大型貨倉收租，回報非常可觀，可以說是史無前例。單是一個星期，已收到4組買家同時開票購買筆者折售的倉地，感覺是非常緊急，估計是其正在租用的倉地業主收回，不再續租。


    # Real-estate PE 大勢所趨


    有見及此，筆者隨即著手在開曼群島成立一雙新的私募股權基金（Cayman PE），以SPC架構成立（有別於傳統的GPLP），同時已有不少PI（專業投資者）及數個機構投資者有意作為Class-A
    Investors，主力投資香港倉地市場及另類房產項目（Alternative investments）。無論筆者看得多遠，跑得多快，以有限的資金體量，實在難以追得上市場往後數年的發展及變化，機會一瞬即逝。Real-estate
    PE正是一個有效的投資模式及未來大趨勢，這是最近與該方面專業的律師團隊努力研究的方向。香港應該朝著這方向走，可惜香港人才只局限於過時的傳統專業範疇，步伐遠較歐美地區甚至中國內地落後，實在可惜。'
