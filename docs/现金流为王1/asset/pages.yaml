  md: '# 2.12 債券基金多屬垃圾債  DIY 組合更可取


    市場上有不少人將債券和債券基金混淆了，其實兩者在性質上存在極大分別。債券基金的性質本身就是基金，並不是債券，只是該隻基金所投資的資產 (Underlying
    assets) 為債券而已，但性質上依然是一隻基金，並不是債券。因此，千萬不要將債券基金當成是債券去投資。


