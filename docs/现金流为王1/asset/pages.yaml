  md: '# 導讀

    富足路上的重要車站


    人生就如行走在一條很長的路上，走得愈遠愈前，看到的風景愈多愈美。


    雖然人的生命有限，而且每人的起點都不同，你亦難有選擇權，但我相信，我們都有能力去選擇和決定自己人生路上的「中途站」及「終點站」。當然，人生的分支路很多，必須選擇自己認為對的路，要想清楚才走，因為走錯了想回頭，會浪費不少寶貴時間。


    # 步行、踏單車、搭列車？


    你亦可問問自己，會選哪種方式去走過人生大道？


    有人選擇步行，有人會選擇騎單車，亦有人會選擇乘搭不同的交通工具。選擇步行的人會比較累，每一步都靠自己的努力，想看前面美麗的風景，就得一步一步前進，覺得累只能停下來，但懂得欣賞當下風景的人，仍會覺得快樂。


    有人希望走快一點，想在有限的人生裡，能走多點路看多些風景，讓人生變得多姿多彩。他們知道單靠自己的步伐不能走得多遠，於是選擇踏單車，雖然都需用力去踏，但前進速度較快較省力，也能走得更遠。當'
