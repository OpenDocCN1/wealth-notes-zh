  md: '# 推薦序


    # 黃元山 中文大學全球政治經濟社會科學碩士課程客座講師


    筆者一直認為，香港雖然作爲國際金融中心，股市興旺，但散戶卻一直對投資的認識不足，最喜愛的是聽「專家」貼士來炒股，最後不單未能賺錢，連財富穩健增值也做不到，甚至慘蝕收場。


    資產配置是投資裡很重要的範疇，資產需要多元化；債券在投資組合裡十分重要；投資回報不應過分造取……這些都是希望財富增值的投資者須要知道的事情，但一般散戶卻一點也不了解。讀過Starman的文章後，覺得其對資產運作熟悉，尤其是債券，而且條理分明，我尤其同意他對謹守紀律的重要的看法。


    筆者常常說投資其實很簡單，因爲只要觀念正確，並謹守紀律，持之以恆，原來財富增值也不是很難的事。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 推薦序


    # 百樂 著名財經Blogger、《財務自由速成法》作者


    記得那天從香港數碼港的創業大賽完成一整天的評審工作，回家路上，身心雖有點兒疲累了，突然收到Starman兄的短信，看到內容的一刻，很是興奮，路旁的行人還以為小弟中了彩券頭獎耶！


    究竟是甚麼事情，令百樂如此上心？


    Drum roll please……


    Starman兄終於出書了！


    但更為雀躍的，是Starman兄邀請小弟提筆為他的大作，參與寫序的行列。十分感恩的同時，亦希望藉著此文分享Starman與百樂的一些點滴。


    記得多年前，已留意到一位非常上進的80後青年，在網上熱心分享他對理財和投資的心得。那時百樂剛把科創公司的股票完全套現，全職投入在矽谷的地產開發項目，並開辦了100HappySouls.com的《Life
    as a Startup Academy™》快樂創富人生平台。


    那時Starman兄也在Blog上分享工匠的投資點滴。大概是家庭背景，人生價值觀和生意理念相似的關係，英雄所見略同，大家很快就網上熱絡起來，互相交換戰場上的筆記和心法，很是痛快！'
  merge: -1
  img_proc: true
- pgno: 11
  md: '成了摯友好一段日子，近這兩年來，百樂每次回港，我倆更從密麻麻的時間表中騰出寶貴的空間來，共聚一刻，把酒談心一壺，家享，國亭，天下亭，無所不談……


    題外話說完了，現在回到本書。


    因天窗出版社的工作效率超高，距離交序稿日期只有三天而已，百樂早前已預留了半天給香港城市大學作學生就業/創業分享，加上之前承諾了友人的約會，實則上僅僅有兩天剩，去把這個極有意義的任務完成……


    邪刻，更覺時間原來是如此的可貴……


    手上拿著少於兩天的寶貴資源，立刻把自己關在書房內，從目錄開始，仔細地閱讀Starman兄在書中的每一頁，每一句，每一字。


    因有不少內容（例如市場對沖策略）的確需要反覆思考，才能完全掌握其背後心法，中文閱讀能力蠻差勁的百樂，最終花了大概十二小時，到了夜店關門前的時份，才把全書讀完。


    看畢全書的一剎那，老實說，是有著一種頗為任意而逍遙的感覺……'
  merge: -1
  img_proc: true
- pgno: 12
  md: '首先，如一直有追看Starman兄博客分享的朋友，絕不難找到Starman那一針見血，點到即止，藥到病除，授人以魚不如授人以漁的筆跡和獨特風格。


    但更令百樂喜出望外的，是書中除了把多年來博上最精要的部分（如債券，REITs，和其對沖的原理），在思維上有層次地重新整理外，還加入了很多實則操作和應用例子，並在人生價值觀方面，作出了深入淺出的思考模式說明，讓讀者們有一個更全面的人生理財規劃。


    這種全方位的章節鋪排，對年青人而言，特別是90後的朋友，將有極大的參考和實戰價值。


    另外，Starman兄也花了不少篇幅在談論香港現時的經濟形勢和轉型期帶來的挑戰。


    百樂大部分時間都在世界各地遊歷，從宏觀的角度看，特別覺得這部分描寫得非常到位。


    在矽谷的創意產業生態圈打滾已有一段日子，百樂深明Google、Facebook、Snapchat、Uber、Airbnb的生態模式，中國BAT的連番收購和在矽谷設立科研中心的部署，以及整個創投業界的遊戲規則，都有着我們參考的地方。


