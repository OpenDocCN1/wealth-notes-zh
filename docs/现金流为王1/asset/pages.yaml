  md: '# 3.7 拆售工廈實戰

    半年回報 100%


    筆者數年前已洞悉這個市場機會，一邊投資價格低水的工廈，一邊組建團隊進行分架拆售項目，是市場上首批進行分架拆售項目的投資者。至今已完成超過 20 個工廈拆售項目，拆售的單位近
    700 間，全部由自己的管理公司管理。從管理公司的資料，能夠了解市場真正用家，包括經營業務、租金水平等。要知道絕大部分筍盤都不會流出市場，最後只會由「自己人」來消化，平時我們在地產公司所能獲得的都不會是最筍的樓盤。為了取得市場一手資訊，同時更好控制盤源和銷售渠道，筆者亦開辦了自己的地產公司，形成找盤源、買入後改裝增值、銷售和管理的一條龍式「垂直產業鏈」。


    # 向業主要取商業條款 降低起動資金


    如前文所說，做生意的 rule no.1 是要應用資本運作 的概念去經營生意，要懂得計算內部回報率，意思就是以「要用最少的資金，在最短的時間


