    # 看清政府規劃

    新界地尋寶


    除工廠外，筆者在大約兩年前已開始留意新界農地及倉地的投資機會，發現潛力極大。在做任何投資前，首先是要對市場有所認識，做足功課及市場調研。筆者最近亦收到不少讀者來郵詢問有關農地投資的問題，發覺大家對於新界地及城市規劃的認知不多，因此想與大家分享一下新界土地投資的基本概念及潛力。


    要尋找新界地的投資潛力，不得不留意政府的規劃圖。政府的規劃圖大致可分為分區計劃大綱圖 (Outline Zoning Plan, OZP，見圖)，發展審批地區圖
    (Development Permission Area, DPA) 和發展大綱圖 (Outline Development Plan, ODP)。以上都是政府公開資訊，但會去認真研究的人是極少數，沒有認真做功課便說市場沒機會的人要成功，除非上天將塊肉放入你口中，否則等一世都難有機會。對政府未來規劃有了基本概念後，大家便會開始發覺某些土地已經供不應求，供應將會在未來數年嚴重大幅減少。


