    當然，四大內銀的大股東為中金和財政部，可以說有「阿爺」包底，而中金和財政部的主要收入來源為四大內銀之派息，估計削減派息幅度亦應有限度。筆者亦曾多次提及，對筆者而言，四大內銀中只會考慮建行。


