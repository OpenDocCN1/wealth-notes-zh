- pgno: 44
  md: '![](img/034fb7f1e667b45ed25196fc40e47173_44_0.png)


    # 專注「有數得計」投資 致富不是夢


    當你明白複利的力量，就會明白時間的重要，亦會明白5%年回報已足以令你致富。你會再浪費時間去投機炒股，還是專注「有數得計」的投資，讓時間將你的雪球滾大？


    對於一般非「投資專家」的普通人，不應對投機回報和資本增值有過分的預期，因大部分普通人認為會令資產資本增值的因素一般已經在價格反映（Price-in factors）。因此作為普通打工仔，有正職，又不是專業投資者，時間不多，更不應對這類筆者稱之為非常回報（Abnormal
    return）有過分臆想，而應對「有數得計」的投資下功夫。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 第一站：賺取第一桶金 認清資本的力量


    所謂「有數得計」，即是會定期產生現金流的資產，這類資產值得累積，使自己的收入來源更廣。以勞力收入作爲前鋒，再將勞力收入的儲蓄投資往有定期現金流的資產，累積一段時間，直至非勞力收入（被動收入）比勞力收入（主動收入）更多，財務自由就指日可待。


    會持續產生現金流的資產包括：


    +   1. 穩定派息的股票（高息股如一些公用股、內銀股等）；


    +   2. 以一籃子租金收入為主、同時會定期將不少於90%盈利分派予股東的房地產信託基金（REITs）。例子有領展（0823）、越秀房託（0405）和置富產業信託（0778）等；


    +   3. 固定收益資產（Fixed-income asset）如定息企業債券（例子有內房債世茂房地產、路勁基建等等）；


    +   4. 買入「實磚」（實物磚頭）物業收租（包括住宅、工廈、商厦和鋪位等等）。


    上述都是能持續產生現金流收益的資產，然而它們的特性和收益率（Yield）都不同。在資金不多的情況下，投資一開始不必強求太分散，可選擇一些具穩定增長的高息股，好處是回報率「有數得計」，基本上每半年派息一次，到時再用收回來的股息分散投資其他具增長潛力又會穩定派息的股份。要注意的是企業派息背後是否有盈利支持，切勿只看周息率或一味貪高息。由零開始到第一桶金，一點也不困難，關鍵在於你是否on
    the right track，以及能否堅持，謹守紀律。


    ![](img/034fb7f1e667b45ed25196fc40e47173_45_0.png)'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 擁第一個100萬 應否先買樓？


    買樓，彷彿已成爲每個香港人的人生目標，不少人當成功累積到第一個100萬後，都會將之做首期買樓，之後將一半收入供樓，這些人有部分有自住需要，部分是當投資。筆者並不反對，但必須說明一點，當成功累積到第一個100萬後，投資選擇便會增加，這亦意味著以買樓作為投資的機會成本已經大大增加。只是買樓是中國人的傳統智慧，大家都熟悉，加上傳媒的喧染，將有樓與成功劃上等號，令大部分人都以買樓作為人生目標。


    誠然，在新經濟常態下，資產價格長遠只會繼續上升，買樓最大好處是可以利用長達30年以上的低息樓供，自住物業在可負擔的情況下當然應該考慮，但不代表可以不計數不問價高追。要知道目前業主們都有很強的持貨能力，叫價相當進取，同時在辣招滿佈的市場下，市場交投非常疏落。如果市場沒有貨，而叫價比市場價高一兩成，買家便要小心。


    # 買樓「半自住半投資」觀念錯誤


    要知道，買樓並不是唯一的選擇，不買樓不會死，所謂的「半自住半投資」是錯誤的觀念。自住就是自住，投資就是投資，是兩種概念。不買樓可以租樓，不會無得住；投資就是看回報率和資本增值空間。香港住宅物業在辣招滿佈的年代，短期內尚有多少上升空間可疑。一般住宅租金回報率約2.5-3.5%左右，如果有一種投資回報率高達10%，你還會選擇買樓作「半自住半投資」嗎？


    ![](img/034fb7f1e667b45ed25196fc40e47173_46_0.png)'
  merge: -1
  img_proc: true
- pgno: 47
  md: '![](img/034fb7f1e667b45ed25196fc40e47173_47_0.png)


    100萬，在今時今日的香港不算多，但可說已突破了第一個磚頭門檻。除了大家熟悉的住宅和股票，大家可留意工業物業和債券。工業物業是目前最便宜的「磚頭」，租金回報5%尚算普遍，lump
    sum有大有小，可做按揭，雖然按揭成數僅四成，沒有住宅高，但工業物業的價格低水，在政策的限制下，其真正價值仍未體現，相對於價格可能已經over priced-in的住宅物業，更具值博率。


    100萬budget，亦可考慮買入入門版債券，基本的入門門檻為10萬美元一手，利率6-8%左右的選擇不少。若不做槓桿，企業債券的風險不外乎企業違約風險，只要細心研究，風險比股票更為可控，而且是穩定派息和保本投資工具，投資者可選擇賺價沽出獲利或持有至到期收息，是進可攻退可守的投資工具。


    擁有不少於100萬投資本金，筆者建議可買入入門版的債券，透過運用其保本和穩定派息的特性，利用派息的現金流再投資門檻相對較低的高息股和REITs。當投資組合慢慢變大時，可再考慮分散投資到實磚，如相對高回報的工業物業，再利用按揭套現的資金再投資債券或其他高現金流的資產，達至實現多元化的現金流投資組合。


    ![](img/034fb7f1e667b45ed25196fc40e47173_47_1.png)'
