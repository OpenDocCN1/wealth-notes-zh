  md: '# REITs + Bond組合


    正正是想擁有屬於自己的生活和理想，驅使筆者在工作幾年之後，就建立了一個具穩定現金流的投資組合——「REITs + Bond」（房地產信託基金混合債券）的投資組合。現時，組合每月產出六位數字的被動收入，以保障家庭每月所需，同時將「剩餘的被動收入」（被動收入扣除日常開支後的部分）累積，將其再投資（re-invest）於組合內，為整個投資組合注入動能，讓雪球愈滾愈大。


    投資雪球能產生穩定的現金流，而現金流可用作再投資。我個人的投資都是穩健而同時可持續產生現金流，從來不追求爆發性收益，只要求「計到數」的收益，使組合既能穩定增長，又不用自己操心，亦能根據「計到數」的現金流作未來計劃。有了防禦力高的防守性投資組合，在創業時便能無後顧之憂地大膽嘗試，只為追求理想而非純粹為金錢而工作，令人生變得多姿多彩和有意義。'
