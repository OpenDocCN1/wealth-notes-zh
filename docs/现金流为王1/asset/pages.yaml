    # 投資有法

    真正財務自由


    由沒財可理財到有意理，你已成功踏上了快速前進的列車。各式各樣的投資只是一種工具，投資端求的是必法，只要理念正確，時間將會是你最好朋友。因為你的投資將會慢慢自動形成一個「讓錢自動流入的系統」，讓財富每秒鐘以「本金乘以回報率」的形式滋生，令你明白「乘數」比「加數」的力量大多少倍。正確的人生價值觀將會你的人生除了金錢以外，還增添了色彩和意義，令你擁有真正富足的人生。


