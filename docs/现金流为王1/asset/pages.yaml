  md: '# 香港優勢仍在 惟思維落後


    舉例，內地前幾年的滬港通、開放融資融券等金融改革，市民瘋狂炒股，場外配資，引致市場出現過度槓桿，散戶數量大得誇張，市場散戶因素的不確定性自然極高，最後市場泡沫要爆要去槓桿，過程相當痛苦，中央迫於無奈入市干預，不惜嚴禁市場沽空，命令國企（即「國家隊」）入市，出現球盤也落場踢的局面，嚇得不少外資落荒而逃。2016年上海、深圳等一線城市樓價急升，單月升幅達50%，市場出現首付貸、100%融資、自己人賣給自已人，為的是套取銀行資金的情況極為嚴重，情況猶如2015年的場外配資，市場出現過度槓桿，難道這些都不是泡沫？筆者夠膽說這是瘋狂的泡沫，在香港這個成熟、經歷過多次地產和金融風暴的地方是不會發生，而市民的经验、質素以及成熟的政策，也是內地不能比擬的。香港在這方面較內地成熟得多，仍然具有優勢，但優勢能夠持續多久？不知道。香港人要有危機感，不進則退。


    文中指出的問題，其實不獨是香港，大部分已發展國家去到一个樽頸都會面對相同問題。工資、租金等成本上脹，使傳統產業開始面臨經營困難。而香港既不是一個國家，只是一個城市，內需規模不足以支撐經濟。香港是知識型、外向型經濟，核心產業集中於地產、金融及服務業，產業單一從來都是香港的問題，但香港人必須接受「香港只是一個功能城市（functional
    city）」，而不是一個國家的規模，故香港只能以functional city的層面去規劃發展，以國家的層面去規劃的話，將會一事無成。


