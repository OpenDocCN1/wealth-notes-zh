  md: '「撘」、受氣、承受工作壓力等等。正所謂「人生有多少個十年」，人生不應只為了「被補償」而生活，打工的意義不應單純為了每月工資，而應該為了脫離窮忙生活而努力儲備足夠的彈藥。當然，工作中賺取的人生閱歷也非常寶貴，羽翼豐滿的一天就是脫離現在崗位、去做自己真正想做的事情的時候。至少也應以此為目標，人生才能活得多姿多彩。事業、家庭、成就、理想在人生中應該取得平衡。


