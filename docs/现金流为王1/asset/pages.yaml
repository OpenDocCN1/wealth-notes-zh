  md: '# 1.2 打工要偷師

    邁向第一個 100 萬


    要在人生中尋求突破，第一是放棄傳統打工思維，贖回自己寶貴的時間和人生，尋找自己的藍海；第二是要精明地理財，有規律地持續進行有穩定現金流回報的投資，再利用投資產生的現金流再投資（re-investment），產生多元被動收入，不斷進行資本運作，長遠讓金錢為你工作，而非為金錢而工作。


    # 以老闆思維打工 工作質素高


    何謂放棄傳統打工思維？不是慫恿你貿然去創業，而是建議你以創業思維及心態去打工。


    我認為，對一般沒家底的年青人來說，畢業後即使有創業的志向，也不應該立刻創業，因為對於初生之犢來說，未有工作經驗，對一間公司基本運作沒有概念，更別提企業管治理念，即使幸運地找到一盤好生意的'
  merge: -1
  img_proc: true
- pgno: 37
  md: '意念及機會，若公司沒有良好的運作能力，公司盈利亦難以持續，最終失敗機率非常高。因此，對於剛畢業的年輕人來說，應該先踏踏實實找份工作，受薪學習最著數，以吸取相關工作經驗為首要考慮。


    不過，做一個打工仔，無論你在哪一個行業，職位是高或低，思維上也不應只是打工的思維。你必須擁有創業者或企業家的思維模式，一個人的思維層次愈高，工作質素定必愈高，因為你所考慮的都是以老闆角度出發。。


    在一間公司內，老闆最緊張公司是否賺錢，多數打工人士卻只在意出糧是否準時、加薪和花紅的多與少，因為大多數人都持打工思維去打工，緊張的部不是公司利益，而是自身的利益，因每個月的薪金，就是他們從公司所能賺取的全部。


    ![](img/034fb7f1e667b45ed25196fc40e47173_37_0.png)


