  md: '# 第三站：多元投資＋創業 主動出擊


    擁有地產壟斷優勢的大地產商早已囤地，亦有不少財力雄厚的市場投機者在發展規劃大綱公佈後，大量掃入相關土地，購入後遠租也懶得出租，荒廢著等升值。像筆者基於市場供需、考慮市場真正需要而著實投資發展的投資者或投資團體屬極少數。因此，最近有些得知最新政府規劃藍圖中，自己所投機購入的倉地不納入規劃範圍便急急求售，對筆者來說正好是一個市場機會。筆者始終喜歡「主動增值」的項目，投機者關注的只是規劃爲資產帶來多少價格升幅，而非規劃爲市場供求帶來甚麼影響。


