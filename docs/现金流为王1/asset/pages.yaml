  md: '一間公司，一項業務，一個項目，都必須要找一個負責人全權負責跟進，該負責人稱為RO（Responsible Officer）；項目經理（Project
    Manager）負責跟進和協調好工作的細節、時間表、監察好項目的進度等工作；項目團隊（Project Team）則負責執行項目的各項工作。RO、項目經理和項目團隊必須保持緊密溝通，設立好清晰而有效的匯報溝通機制，在實際工作时要work
    as a team with the same goal，目標一致，共同努力向目標邁進。上述三方都會獲分派項目公司甚至集團的股份及分紅權，只要項目達標，會再分派performance
    bonus shares，大家都為股東，心態自然不一樣。


    # 建立自動運作系統


    筆者的角色是業務開拓者，不停在市場尋找業務機會，每次一鎖定目標，會先進行市場調研，收集足夠的數據分析，如數據正面，會即時研究如何落地執行，絕不浪費一分一秒。開拓新業務，最重耍是方向是否正确，只要方向正確，其實已成功了一半，餘下一半便取決於如何執行和後續的跟進工作，這便考驗管理者選人的能力了。方向正確，選對了人和團隊，根據過往經驗，成功率接近90%，接下來的10%便看市場了，而這往往就是最大的不確定性。


    每次開拓新業務公司，筆者一開始在一段短時間內都會完全負責公司的大小事務，然後就慢慢將自己的角色淡化，準備交棒，而人選必然是現有團隊的骨幹成員，既有過往項目管理的經驗，也有向上流動的動力和對公司歸屬感，找「對」人的機率非常高。最後，筆者會完全交棒退出。


