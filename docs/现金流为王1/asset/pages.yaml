  md: '此外，散戶可透過某幾間大證券行做「分期投資計劃」投資新加坡REITs。由於該REIT資產優質穩健，價格波幅不大，通過「分期投資計劃」最高可做70%的融資，分12或24個月分期；融資利率低至1.88%，交易還免經紀佣金。但要留意的是，由於供款期一般只有兩年，每月需供本息，有現金流錯配（cashflow
    mismatch）的問題。因此，投資者應先衡量自己的財力，如只夠購買一萬股，應該只買一萬股，切勿因為證券行高融資率而倍大總投資金額。投資者利用該計劃投資時，應以「分期付款」的心態去投資REITs，而非「以小搏大」、「做大槓桿」去增加總投資額的心態去投資，只有真正私人銀行戶口才有條件做槓桿式投資。


