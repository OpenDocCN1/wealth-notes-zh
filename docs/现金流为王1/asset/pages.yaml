  img_proc: true
- pgno: 19
  md: '不過，隨著職級的提升，還得面對辦公室政治，這可說沒一點生產力。然而，要上位，你不得不參與這遊戲。對一位有上進心的年輕人來說，可謂進退兩難，漸覺打工很沒意思。有天我反問自己：這份工作雖能給我高薪厚職，但人生難道除了工作賺錢以外，就不能擁有屬於自己的生活和理想？難道這就是普遍香港人的命運？


    # 想要自主人生 先自製安全網


    我不甘心，從那天開始，無時無刻都想著如何發揮身邊潛在的市場機會，並付諸實行，多次勇敢地作出大膽的投資，包括工廠改裝、農地發展等另類物業投資項目，亦漸漸燃起創業的決心，開始慢慢組建自己的業務團隊，決心跳出安全地帶（Comfort
    zone），贖回自己的人生和時間。這個決定不容易做，因為考慮到機會成本不輕。當時筆者已成家立室，太太剛剛誕下大女兒，我需要為整個家庭負責，所以辭職出來創業的包袱比以前大了。


    創業需要資金，同時做生意不一定賺，收入亦不穩定，為了安頓好家庭，必須創造一個具穩健現金流的被動收入組合（Passive income portfolio），以應付家庭每月的經常性開支。幸好我已累積到一定的資金，因為那份工作除了花紅派得不錯，還有一個好處：工時長，逼使自己根本沒時間去消費，加上自小養成節儉性格，因此已有本金以錢撬錢。'
