    # 「財務自由」的意義


    談了那麼多投資及創業，目的都是想財務自由。近年「財務自由」一詞熱爆全球，人人都買一本《富爸爸窮爸爸》學習怎樣財務自由，每個討論區、網站都熱烈談論這個話題，彷彿「財務自由」就象徵著一個人的成功，所有打工一族都熱切追求。大家又有否仔細想過其實追求「財務自由」的同時，實際上最終是在追求甚麼？人生到底又需要些甚麼？


    「財務自由」是一個甚麼樣的概念？《富爸爸窮爸爸》作者清崎對財務自由的闡述較為直接，若一個人每個月的被動收入等於主動收入，他已經叫做財務自由了。對一般打工一族來說，主動收入就是每月的工資（需付出勞力換取的回報，手停就口停）；被動收入是無須依靠勞動，憑藉持有可持續帶來穩定現金流的資產所產生的收入（包括物業收租、透過投資債券、股票定期收取利息、版權費收入等）。以一個更嚴謹的定義，當一個人的被動收入可以完全支持所有生活開支，才真正叫做財務自由，筆者認為這更恰當。因此，當一個人達到財務自由，他已無須為維持生活而工作，可以做自己想做的事情，這正是財務自由要表達的最重要一點。


    ![](img/034fb7f1e667b45ed25196fc40e47173_178_2.png)'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 走向自己的路才是重點


    然而，財務自由是否就等於成功？個人認為財務自由只是一種狀態，只代表一個人當時的財務狀態，而不是終點站，甚至根本不是一個「站」，因為它根本不能反映出一個人的成就。正如金錢不等如成就。若視財務自由為終極人生目標，只因工作不開心，每天都想逃避工作，這是不健康的。


    就財務自由這概念而言，走向財務自由之路才是重點，過程才是最重要。有能力憑自己創造價值走向財務自由的人，一定不會以財務自由為目標，因為有能力的人會不停創造價值，不斷進步。沒有建立好自己的事業，單純靠買物業收租而達到財務自由是沒有意義的。有很多人在過去幾年樓市向上的時間買入物業，賺個盤滿钵滿，每月收租已足夠過活，但由於本身正職工資所限，壓力測試要求收緊，加上樓價處於高位，樓價大幅上升的時間已經過去，這些人亦只能以財務自由為人生目標，每天期盼樓市繼續升值，租客每月準時交租幫手供樓。這些人自以為很成功，但試想想，若全世界成功的人都是收租佬，世界還會有進步嗎？


    # 有成就才是成功


    一個自信有能力的人，不應每天都期望自己中六合彩，因為當夢想成真，一朝醒來擁有大筆財富，中間卻完全沒有任何過程和經歷。儘管你


