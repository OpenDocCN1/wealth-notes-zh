  md: '# 3.11 平價農地 價值升級成農莊


    香港百物騰貴，相對平價的磚頭資產除了工廈外，還有農地。農地價格便宜，原因與工廈差不多。農業在香港已經式微，大部分的農產品均從外地或內地進口。對於一般人的認知而言，農地只能用於農耕，商業價值十分低，農地價格也就極為便宜。


    有了投資工廈的成功經驗，筆者在想，既然農地這般便宜，如果能夠在極低市場價值的農地上加入一點點商業元素，為農地提升商業價值，這將會是另一種主動增值的價值投資。


    # 代種服務 針對忙碌港人


    筆者數年前在元朗郊區購入一幅數萬呎的農地，與工廈項目的操作手法相約，將農地包裝成一個具規模的有機生態農莊，並將其分割成數十個小農莊，再分契出售。改造大面積農地的平均成本，當然比獨立建造一'
  merge: -1
  img_proc: true
- pgno: 163
  md: '個小農莊來得更有成本效益，價值和售價自然較高，加上公眾空間的設施是大家共同享用，令基建工程的建造成本得以有效攤薄。每塊小農地或小農莊，建築面積數十呎至數百呎不等，價錢由十萬元起至百多萬元，出售呎價約為700元/呎，而當時購入成本僅250元/呎，扣除成本，利潤以倍計。此外，筆者公司保留項目的管理權，提供耕種土地的維護、定期灑水和代種服務等，使平日沒有時間打理的用家，假日一家大小來到自己農地體驗耕種的同時，也可以即時享受部分農作物收成。項目一開售，以「十萬元起就可以做地主」作口號，反應非常熱烈，不出數月成功全部售出，獲利超過一倍。


    有了第一個項目的成功經驗，筆者隨即更大膽買入附近位置更好的逾十萬呎農地，進行升級增值，繼續創造新需求。筆者曾於美國留學，眼見當地郊區有不少人將露營車（Caravan）放在郊外大片草地上，旁邊有一個大湖。在露營車內露營方便舒適，又能真正與大自然融為一體，晚上觀星，早上垂釣，實在好不寫意。生活在人口煙稠密的香港，連最基本的居住問題都未能解決，莫說家中要有一個大花園或私人農莊。因此，筆者認為「休閒農莊加露營車」概念在香港必定有市場，將本身幾乎沒有商業價值的荒廢農地變成擺放露營車的私人休閒農莊，價值必定大大提升。


    # 擺放露營車 須向城規會申請


