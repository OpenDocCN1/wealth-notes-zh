  md: '推銷，投行為了銷情，更積極提供融資予 Coco Bond 投資者（高槓桿的背景其實是該行可能也發了不少 Coco Bond），最後銀行賺個盤滿鉢滿，投資者亦有高收益，看似雙贏。但隨著
    Coco Bond 普及盛行，市場開始推出各式各樣與 Coco Bond 相關的衍生工具及相關對賭產品，例如 CDS（Credit Default Swap）等等，進一步增加
    Coco Bond 的槓桿，同時亦拉長了整條資金鏈，牽連甚廣。銀行如過分依賴 Coco Bond 作為其資本來源，將對整個銀行體系來說絕對不健康。


    另一個更大的問題是，如果銀行資本比率不足，觸發一連串換股，若投資者同時沽售這批股份，銀行股價將會即時急跌，投行隨即收緊融資率，繼而引發新倉潮，促使相關衍生工具等價格下跌（或
    CDS 急升）。由於市場大幅度去槓桿，只要有一個 counter party 違約，足以觸發骨牌效應式資金鏈斷裂問題，新一輪金融風暴隨即開始。


    根據《金融時報》資料，Coco Bond 的投資者約有 20% 為個人投資者（非機構投資者），而當中又有多少投資者能清楚明白 Coco Bond 的合約條款及風險？到危機發生，類似逃債風波的事件又會再次出現，市民對銀行體系的信心盡失，這是大家都不想看到的事情。其餘
    80% 機構投資者，對沖基金的加入，使整個 Coco Bond 市場加速槓桿化，與此同時，最可怕的是其背後的衍生工具及相關對賭產品，複雜程度即使是專業人士亦無法估計。'
