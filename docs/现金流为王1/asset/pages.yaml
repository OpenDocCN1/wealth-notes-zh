- pgno: 160
  md: '![](img/034fb7f1e667b45ed25196fc40e47173_160_0.png)


    了大量有關新界地供應及需求預測的數據，斷定這個方向沒有錯，因此立即大規模投資倉地發展。市場反應證明筆者當時的推斷沒有錯，更可能是低估了。


    該項目還未完全完工之際，已由4個獨立用戶家全部承租，平均租金約12.5元/呎，每月收租110萬，全年租金收入1,320萬。由於測量師行根據市值租金水平，以5%左右的資本化率推算估值，目前估值已大幅提升。銀行則根據測量師估值報告，向筆者公司提供最高四成的按揭貸款，而通過銀行承做四成按揭，筆者已幾乎取回全部投入本金。假設供20年，每月供款約50萬，其中33萬為本金，17萬為利息，租金收入足以覆蓋供款有餘，每月正現金流60萬，还未計算33萬本金供款部分。'
