    + Bond」絕對是一個擁有穩定現金流的投資組合。


    # 1,000 萬「雙高」組合示範


    在低利率、低經濟增長的「L形經濟」大環境下，市場的預期回報率偏低。在長期低息環境下，要獲取穩定高回報必須要適當地運用槓桿。買樓之所以能在低息環境下為投資者帶來豐厚的財富，正是因為買樓能輕易運用長達
    30 年的銀行低息槓桿，借入貶值的銀紙買入長遠增值的資產。筆者多次強調，槓桿是兩刃刀，雖有風險，但只要適當地控制風險，增加和強化投資組合的現金流部分，事實上風險相當可控，更能利用低息環境的優勢，提升整體回報率。


    「REITs + Bond」組合最大的優勢是「雙高」（高倉值、高現金流），債券保本但長期對抗不了通脹，REITs 不保本但會隨通脹資本增值，兩者的優劣互補。以
    1,000 萬的投資組合為例，筆者建議一開始建立「REITs + Bond」組合的初始比例為 30:70（REITs：債券）。筆者投資「REITs + Bond」組合的策略是以槓桿買入債券，REITs
    則不用槓桿，作為債券槓桿的 buffer。以 1,000 萬的「REITs + Bond」組合為例，總投入資金實際為 510 萬，總借貸金額為 490 萬，組合的負債比率為
    49%。組合內'
