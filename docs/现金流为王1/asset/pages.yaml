- pgno: 161
  md: '房地產項目具有長遠資本增值的特性，且具有潛在爆炸性收益的投資優勢，唯一缺點是缺乏流動性，套現不容易，即使物業升值，某程度上也只是帳面風光而已。然而，透過銀行的低息融資則能彌補該缺點。如果項目本身在扣除利息支出後能帶來正現金流入，透過銀行融資能將升值部分套現，那麼房地產項目的升值再也不只限於帳面，而是真正落入口袋的現金流，而業主也沒有出售項目的需要。同樣道理能套用在所有物業投資身上，這就是產融結合的力量。在低息環境下，產融結合的優勢就愈明顯，同時資產價格也會持續升值，只要把握好時機，以資產儲蓄資產，財富便能以幾何級數累積。


    # 產融結合 爆發力驚人


    將產融結合提升至資本市場的層次，效果將能發揮得淋漓盡致。若以上操作應用於上市公司，在財務的安排上，如果將整個項目的升值部分以公允價值 (Fair value)
    入帳，整個項目便能被資本化，再透過發行可換資產債券，更可將項下的資產證券化。筆者相信這種資產證券化模式將會在未來十年內大行其道。事實上，REITs也是一種資產證券化下的產物。


    一個具潛力高回報的實體項目，結合金融財技，即所謂產融結合，是現代化項目不能忽視的，其爆發力更是難以想像。在現今世代，若以傳統模式經營實體項目和實業，只能賺取正常收益
    (Normal return)，試問除了壟斷市場的巨頭，其餘市場參與者能如何競爭？


