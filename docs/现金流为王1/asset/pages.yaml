- pgno: 135
  md: 'QE、長期低息的新經濟模式大時代下，土地資源已所剩無幾，世界各地包括內地的資金卻衝著香港而來。以上種種造成了今天香港一個地產主導的經濟體系，各大行業、大部分大路的生意都由地主/業主所控制主導，慢慢侵害各行業的生態系統，營商環境變差，經濟結構不健康，人的價值觀亦受到影響。


    在別的國家如馬來西亞，開發廳或經營烘焙坊教室，租金成本能夠控制在總營運成本的10-15%水平，這才是對相關行業有利的營商環境。做生意要懂得審時度勢，創造價值的同時要對自己做有利的事。


    做生意不一定要選margin（毛利）高的來做，也不一定要做大turnover（營業額），著眼應在於需要用多少資金，在多長時間內賺取多少回報，這是內部回報率（IRR，Internal
    Rate of Return）的計算方式，是資本運作的名念。做生意要有把握，必須應用資本運作的概念做生意，這是rùle no.1。然後，便是建立自己的品牌，鞏固自己獨一無二的優勢，以創造價值為核心，建立自己的護城河，這是rule
    no.2。最後才是將成功的營運模式複製，做大規模，迅速搶佔市場，也就是rule no.3。以上的三條守則必須順序做好，切忌心急跳步，否則失敗機率會大大增加。


    # 成本高 + 回籠慢 資金鏈易斷裂


    不少創業者都有很好的點子，但由於缺乏經驗，亦沒有計算回報率，結果成本超支，生意一開始投入的資本過高，即是over budget，然後自然佔用本來數月的營運資金。同時，又由於沒有準確計算好投入資本後現


