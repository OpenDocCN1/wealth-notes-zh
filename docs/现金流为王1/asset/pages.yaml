  img_proc: true
- pgno: 143
  md: '香港眾多物業類別來說，價錢最低廉的一種。受著迷你倉大火影響，政府針對工廈違規加大力度執法，令工廈價格受到一定影響。然而，事隔一段時間的今天，隨著其他物業資產價格、辦公室租金不斷上升，市場對工廈的需求其實不跌反升。


    近年來，大量想「走出去」的內資企業及想「走進去了」的國際性大型企業均會落地香港，令香港核心商業區租金上升，迫使不少企業將後勤辦公室及數據中心遷移至非核心商業區的商廈，甚至工廈。在每年多間大型企業進駐核心商業區的同時，負擔不起昂貴租金的小公司不免要搬到九龍東、九龍西及新界的工廈，特別是做物流或貿易生意、需要用到倉庫或「半倉寫」的公司。


    未來工廈供應不會增加，反而政府近年的「活化工廈計劃」引來投資者、企業大量收購工廈改為酒店、甲級商廈等。例如「波叔」用5億元購入V City附近的屯門有成工業大廈，將活化至零售項目；新地將葵涌聯泰工業大廈全幢改裝至零售消閒項目，並命名為「活@KCC」；荔枝角
    D2 Place已是完成工廈活化的零售項目。市場上的工廈數量只會愈來愈少。


    # 政策未配合 價格仍低水


    工廈是香港工業時代遺留下來的產物，其歷史任務已經完結，大部分工業廠房及生意線已經北移，工業在香港已式微。目前工廈價格低水，原因是政府對工廈的相關政策未能與時並進，工廈的價值未能真正釋放，目前價格只能反映純工業用途或倉儲的價值，已是低無可低的水平。


