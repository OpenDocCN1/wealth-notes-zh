    筆者估計數年內被趕走及收回的倉地或倉庫涉及近1,000個。土地業主當然高興，因政府的收地價錢是天價，新界東北極荒蕪的農地，回收價都接近2000元/呎，可想而知，元朗南近公庵路的大量倉地會是何價？業主高興，卻苦了本地物流業界的經營者，部分用家得悉租約到期後不獲續租，已紛紛在市場尋找倉地，惟市場供應已極少，一年來持續上升的租金已反映市場情況。


    # 政府無力解決 地產商積極圈地


