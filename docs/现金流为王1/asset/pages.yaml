  md: '重要是現金流。只有能產生現金流的資產，才能透過不斷的現金流「再投資」，令組合不斷自我優化，做到風險分散，現金流收入多元化。筆者在本書提出的「REITs+Bond」組合正是一個進攻、退可守的資產配置組合。


    人生就如一條很長的道路，如果大家都希望能夠在人生有限的時間裡欣賞更多風景，令人生活得精彩，請趕緊登上這部快速行駛的列車。然而，請謹記「財務自由」只是一個重要的中轉站而非終點站，而這個中轉站只是賦予你更多選擇而已，到達中轉站後要去哪裡，這就是閣下的選擇了。人生最重要的是有選擇權。


    最後，希望大家能從本書中得到一點啟發，對大家的人生有一點正面影響，這就是筆者寫這本書最大的願望。祝大家都擁有一個富足的人生！


    歡迎大家通過電郵或社交網站與我交流，到時告訴一下我的選擇吧！


