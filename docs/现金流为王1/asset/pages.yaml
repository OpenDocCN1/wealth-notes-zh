    # 領展、置富看好  與民生關係密切


    在本港上市的REITs中，筆者比較看好的是置富(0778)和領展(0823)，原因是它們的物業和租戶組合跟民生（中產的民生）關係密切，受零售放緩和自由行減弱的影響相對較低，收入也比較穩定。


    以置富為例，全港擁有17個商場，當中不少位於大型屋邨，兩大旗艦商場為置富第一城及置富嘉湖；十大租戶包括百佳、中原、美聯、中銀、長實地產、利嘉閣、大快活、屈臣氏、7-11和恒生。領展更不用說，擁有全港大部分公屋的商業零售設施和停車場，覆蓋面基廣，公司總資產超過1,600億。


