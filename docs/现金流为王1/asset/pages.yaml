  md: '# 推薦序


    King Sir 葉景強 資深物業投資客、《葉景王道》作者


    很高興能為Starman寫序，我與他相識的過程十分特別。話說有天，《Money 智富》財經雜誌的記者找我做事訪，在訪問當中記者提及她在上星期訪問了一位跟我的投資概念相近的嘉賓，但他很神祕，從不露面，就是這樣令我對他有點莫名的好奇，很想知道他是何方神聖。


    直至一次在投資界好友聚會當中認識了他，我發覺他是一位積極上進、滿腹創業大計、為理想而實鬥的人，我們談得十分投契，惺惺相惜。看完此書後，更發現我倆的理念非常相近，都是希望鼓勵年青人把握青春光陰，積極學習正確的投資理念，為未來能達至財務自由而努力。


    人生匆匆幾十年，相信沒有人喜歡工作到老，因此學習投資絕對是人生最重要的一課。每個人的投資取向都不同，有些人比較進取，喜歡投資股票、外匯；有些則較保守，喜愛投資債券、REITs及房地產，這其實沒有錯或對，最重要是否切合個人的性格以及自己所訂立的目標。


