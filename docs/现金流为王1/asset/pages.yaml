  md: '筆者認為，投資債券基金本身問題不大，但投資心態要微調一下。由於債券基金沒有最終到期日（Final Maturity Day），屬長線投資，好處是門檻低、風險分散、可槓桿操作、每月派息；壞處是高息債基內的
    underlying 債券多屬低評級或垃圾債券，而大部分投資者都忽略最重要的一點，就是債基的派息是從基金價格中派出來，即是會有除淨。當債基派息時，假設沒其他市場因素的情況下，基金價格會下跌，這跟股票派息原理一樣。這點就是與債券最大分別之處，債券基金是基金，而債券就是債券。


    # 買債基不保本 不宜做槓桿


    買入債券基金，要有心理準備基金價格會下跌，而投資者亦要很清楚自己的投資目標是每月收取穩定現金流。債基吸引力在於其低門檻槓桿，但要留意，坊間經常聽說所謂「做一轉
    / 兩轉」，意思其實等同於槓桿倍數（Leverage Multiplier）。債券基金內含多隻低評級債券，可以說是風險分散，但價格仍會上路。債券基金的價格波動雖然一般比股票低，但做槓桿後價格上路是要乘以槓桿倍數，加上如基金價格下跌，就可能要補倉。因此，以為不用理會市況，大被蓋頭後長控每月等收息賺現金流的算盤未打得響。


    買債券基金的正確心態應該是儘量不做槓桿，並要計算好回本期（即收息要收多少個月才能覆蓋本金），要有長線投資、每月收息當出糧心態。在可以選擇的情況下，筆者不建議買入債券基金。有不少於
    10 萬美元資金的情況下，筆者寧願買入入場級的短期公司債券收息，賺價可考慮沽


