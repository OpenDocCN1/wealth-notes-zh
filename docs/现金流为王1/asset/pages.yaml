  md: '# ### 1.1 規劃「三個 10 年」  防「向下流」


    從理財角度看，一個人的收入應該多元化，即除了打工份糧，亦應開拓買樓收租、買股票收股息、買債券收取利息等收入。


    打工需要付出勞力腦力，所得收入為主動收入，但問題是，一個人一生可付出的勞力及腦力有限，所以，為了保障退休後的生活能夠維持一定水準，每個人都應好好利用辛苦賺來的工資，進行投資或資本運作（運用你本身或融資得來的資本進行投資），換句話說是錢摳錢，從而產生長遠而穩定的被動收入。


    # **賺取第一桶金的捷徑？**


    如果閣下是富二代或者已經擁有一定資本，筆者先恭喜你，閣下已經贏在起跑線，可即時跳至本書的第二站，研究資本運作的心法，學習如何迅速讓資本增值，在短時間內將身家翻倍，讓自己立於不敗之地，然後再去追尋理想，做更有意義的事情。


    ![](img/034fb7f1e667b45ed25196fc40e47173_28_0.png)'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# 第一站，賺取第一桶金 認清資本的力量


    但如果阁下像大多数人一样，没有富裕的家底，请在此第一站「起跑线」就位，由累积第一桶金开始。同时，笔者亦会恭喜你，因为你获得的会比富二代更多，由零走向财务自由的路，沿途风景很漂亮，值得你细心欣赏。懂得欣赏，你的人生将会变得不一样。


    每一个人的起步点都不一样，没必要去想太多，人生起跑线不是自己决定，但中途站及终点在哪里，则由自己计划、自己编写。你抱怨社会也没用，只会浪费 时间，而年轻人最宝贵的资产当然就是时间，大家要将其好好珍惜及利用。


    # 做专业人士 Vs 搞 Startup


    如何赚取第一桶金？笔者认为从来都没有捷径，既不应该跟着传统思路走，也不应该随潮流去创业！


    过去数十年来，社会普遍认为是读好书，入名校，读大学修专业学科，毕业出来做专业人士，就可成为社会的天之骄子。随着时代转变，传统行业到了樽颈，大学生数目大幅增加，专业人士供应量多了，自然没上一代吃香，起薪点也下降了。而随着香港作为世界金融中心的地位冒升，投资银行从业员的起薪点较其他行业及专业人士高，市场又开始追捧投行职位，不少高考状元和海归名牌大学毕业生全成了投资银行家（iBanker），大学的经济金融学系都变得炙手可热。


    时至今日，金融业出现饱和，大家又 开始追捧科技相关的 Startup (初创企业)。传媒经常报道一些初创企业的成功例子，最为津津乐道的是


    ![](img/034fb7f1e667b45ed25196fc40e47173_29_0.png)'
  merge: -1
  img_proc: true
- pgno: 30
  md: '手機應用程式（App）Startup 如 Snapchat、GoGoVan 等，在短時間內被創投基金（Venture Capital）或科技巨企看中，以巨額注資或收購，動輒以十億美元計算，年輕的創辦人搖身一變成為身家豐厚的企業家。


    # 香港 Startup 不易成功


    其實，傳媒報導的成功例子實中無一，而且大家都忽略了這些成功 Startup 背後的主要因素。一個 Startup 要成功，除了一個初始的核心概念（Initial
    idea），更重要的是後續資源的支援，包括整個產品開發的發展流程、多次市場測試、收集市場測試數據及進行多次微調的技巧、確立市場定位後主打市場的方向……以上種種除了需要專業而有經驗團隊的協助，更重要的是資金的支持。


    美國矽谷多年來成為初創企業孵化基地的代名詞，孕育不少成功的 Startup，大部分更在納斯達克上市。這些成功初創企業一路走來，非常了解成功的祕訣，他們亦深明長江後浪推前浪，必須培育下一代初創企業。因此，成功的初創企業大多有做資本運作，成立創投基金，哪怕只投中一間成功跑出，其回報亦非常可觀，成為具有爆炸性收益的投資項目。由於有源源不絕的資源投入矽谷孵化基地，令這地方擁有成熟健全的初創企業生態鏈。


    反之，在香港這個欠缺科技基建配套的城市，Startup 要成功絕非易事，即使有香港政府成立的創科局所提供的支援，香港 Startup 要成功，亦可說是難過登天。當然，除非你能找到一個伯樂，引導並支援你走上成功之路，那就另作別論。


    ![](img/034fb7f1e667b45ed25196fc40e47173_30_0.png)'
