- pgno: 80
  md: '可以参考一下我在《关系攻略》里写过的《职场危机前的妙招：称病》。


    # 本讲小结


    总结一下，这一讲我给你分别讲了如何平衡好授权和越权，分寸最为重要。


    你要能意识到授权之下，大权还是在领导手中的，你要尽快明确自己新的职责范围，出圈的地方多询问，别视而不见。而如果你真遇上了危急情况，你要大胆越权。


    # 思考题


    同事获得了领导授权，代管本部门，开始对你吆五喝六的时候，你该如何应对呢？


    # 参考答案


    避其锋芒、强调大局、等待冲突。


    首先是避其锋芒。

    这个对你吆五喝六的同事，一定不是你的盟友。

    他对自己的实力非常担心，对自己获得授权这事充满了紧张。

    不要直接跟他冲突，或者强调他的权力不是全权。


    其次是强调大局。

    做好分配给你的工作，对那种充满牢骚的同事，要用大局来劝说。“这是领导的安排，我们还是要服从。”


    第三是等待冲突。

    冲突一定会发生，但不应该由你挑起，这个部门里那种性如烈火、一点就着，或者背后站着强人的同事，是引起冲突的合适角色。

    当冲突开始之后，领导可能会询问你对被授权者的态度。那个时候你就可以给出你的评价。

    “我觉得他可能对权力看得重了，大家是一起做事情的，关注点出了错，就容易起冲突。”


    话说三分就够了。

    当然你也可以选择支持对方，成为对方阵营里的一员。（从他的表现看，不推荐）

    别做冲突的发起者，要做冲突的终结者。'
