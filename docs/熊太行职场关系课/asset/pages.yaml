  md: '# ## 27 调解矛盾：下属斗狠了，你要吃苦头


    上一讲，我讲了配置团队的方法，这一讲，我会告诉你如何调和团队成员之间的矛盾。


    调解任何人之间的矛盾都非常难，费心费力。职场上许多带团队的人，其实都在回避矛盾问题，不去真正解决。有的领导是放任流：“我不管你们的私事，你俩出去解决。”还有一种领导是严控流：“谁内斗让我发现，我就灭了指。”


    这两种流派都是错误的。放任流会让内部的争斗越来越大胆，如果到了需要外来力量去干涉的地步，领导自己就有麻烦了。更糟糕的是严控流，看上去好像把一切不团结的苗头都掐死了，其实所有人都在不能谈论冲突的环境中压抑着，一旦爆发就是大事。


    # ### 下属之间的四类矛盾


    我们首先要认识矛盾，它看起来千差万别，但从领导的角度看，下属之间的矛盾就四种：利益矛盾、机会矛盾、责任归属和私人恩怨。


    # **第一种，利益矛盾**


    大多数利益矛盾都是因为“某一方或者双方都认为分配不公”导致的，看上去是甲乙相互之间不服气，实际上是他们都 不服领导的安排。


    我经常接到同学的留言，说自己不服某个同事：


    > > 我干的活最多，拿的钱却最少，有同事没干啥却评为优秀。我很不服气，他凭什么啊！


    对这位同学来说，看起来在抱怨和同事的关系，但真正要解决的其实是他和领导之间的关系。


    遗憾的是，有些做领导投入的人都看不懂这样的抱怨，他们把利益矛盾看作是下属之间的嫉妒，甚至还准备利用这种嫉妒。下属直接指责你的不全是给你留余地，如果你还听不懂客气话，恐怕就要有麻烦了。


    处理利益矛盾只有两个思路：


    +   一个是做增量，给不服的人新的机会，让他去争夺外面的资源；

    一个是给好处，把领导手中还掌握着的一些资源拿出来，投入到分配当中去。

    你要尽量把蛋糕做大，不要已经在分配过的利益之间重新洗牌。'
