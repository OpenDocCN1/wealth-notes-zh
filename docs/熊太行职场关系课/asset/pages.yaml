  md: '# 第二， 从微观场景打入，给你具体的行动指南


    有的人苦恼，“明白了许多道理，却终究没能过好这一生。”想靠“明白道理”来解决一切现实中遇到的问题，这几乎不可能。看起来无比正确的真理，反过来说也很有道理，正所谓，真理的反面还是真理。


    比如说，代表中国古典智慧的《菜根谭》里说，“宇宙内事要善摆脱。”而电影《蜘蛛侠》里也有我们熟悉的道理：“能力越大，责任越大。”这两句话都有道理，但我们行动起来却很难找到分寸。而在职场中行事的你，需要的正是具体的尺寸和可靠的行动指南。


    所以，这门课我会少讲大道理和宏观规律，尽量从我们日常遇到的场景打入，给出每个场景的最佳应对方案。市面上同题材作品，还在跟你谈人类保护双腿的意义，我会直接塞给你一把结实的手杖，让你去披荆斩棘。


    # 第三， 带你认识一个完整的职场周期


    我会做你的关系军师，带你从零开始重新认识职场。这门课由浅入深，从你进入职场的第一天开始，到你成为领导掌握别人的生杀大权，干掉第一个人结束，经历一个完整的职场周期。


    第一章，我会带你认识职场上基本原则和四种最重要角色，关系是和人相处，你就需要首先学会认人。


    第二章，我会给你五个关系锦囊，教给你五项基本技能，带你在职场中打开局面。


    第三章，我要给你全面剖析，你在职场上最重要的一类关系，你和领导的关系。


    第四章，你的实力已经日渐成熟，我会教你如何经营自己的职场势力，巩固实力。


    第五章，我会带你迎接职场上重要的竞争，带你打胜仗。


    第六章，成为领导的你，应该如何处理新的局面，我会详细地告诉你。'
