- pgno: 5
  md: "现代心理学各流派普遍认可的人格理论，是“大五人格”，这五个维度是：开放性、责任感、外倾性、友善性和神经质。\n\n用五个维度来衡量人际关系上的鹰派和鸽派可以发现：\n\
    \n| | 鹰派 | 鸽派 | \n| :--- | :--- | :--- | \n| 开放性 | 偏好奇 | 偏封闭 | \n| 责任感 | 倾向于冲动\
    \ | 比较坚定和可靠 | \n| 外倾性 | 自信、大胆善于社交 | 偏被动 | \n| 友善性 | 不少人有冷漠和残忍的一面 | 习惯顺从 | \n|\
    \ 神经质 | 逆境中有失控的可能 | 比较稳定 |\n\n这两派人并没有什么优秀和低下，事实上看香那些伟大的事业都是两派人携手完成的。\n\n我们要的不是纠正对方，不是“你变成我这样才好”，我们要的是理解自己、理解对方，克服自己的短板、学习对方的所长。\n\
    \n对鹰派来说，有几点可能要着力克服一下：\n\n+   1. 迷之自信\n\n一个鹰派一把手最好是有有一个强有力的鸽派副手，把他从迷之自信当中时不时地拉回来。董明珠女士就属于非常典型的人际鹰派。这也是为什么她的照片出现在开机后问候画面时，许多人觉得这是一种冒犯。\n\
    \n+   2. 冲动是魔鬼\n\n尽管在电视剧里，白素贞被塑造成一个追求真爱的好女孩儿，但白素贞是典型的鹰派，即使是电视剧也保留了“水漫金山”这个重要的鹰派内核。在原著小说《白娘子永镇雷峰塔》里，白娘子用一个极度鹰派的口吻对她家相公说：\n\
    \n> “若听我言语喜喜欢欢，万事皆休；若生外心，教你满城皆为血水，人人手攀洪浪，脚踏浑波，皆死于非命！”"
