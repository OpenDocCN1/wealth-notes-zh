  md: '如果你是领导，也不要对秘密活动的小圈子刨根问底，这会让对方嫉恨你。你可以说，“休息日别玩太累”。轻点态一句，有敲打的意思就够了。


    最后，我还要提醒你，布局力量虽然重要，但观察领导的动向更为重要，如果你的布局让领导觉得不舒服，任何情况都应该立刻停下来。领导不一定愿意接受你的强大，每个人的布局力量都是有风险的用功。


    你实力大到有一天，领导可能会面临一个选择：“接纳你成为盟友”或者“感受到威胁出手打击你”。他会如何作这个选择？


    +   * 第一，你的成长能节省他的时间精力吗？


    业务能力是一方面，如果你变强之后会让整个团队收入和绩效增加，领导当然是高兴的。


    除此之外，他还会有管理上的考虑。


    +   * 第二，你的力量增长会增加无谓的损耗或者风险吗？


    如果某一个手下成长很快，但是他为人高调傲慢，让整个队伍人心浮动，摩擦不断，那领导就要作全盘的考虑，没有人愿意用一棵树来换一片树林。


    +   * 第三，你的力量强大之后，是尊重他，辅佐他更上一阶，还是想取而代之？


    其实这三点就是收益原则、进步原则和安全原则。在自己布局力量的时候也要多用三原则拷问自己的策略，站在对手、盟友的角度来研究他们的安全、进步和收益，你就有可能低调而高效地和他们的展开更多的合作。


    ![](img/463ba23747f3bc168dba9e89f7a31f14_115_0.png)


    # 本讲小结


    总结一下，这一讲我给你讲了低调，低调的关键是不追求个人的虚名和荣光，因为把事情做成，成功本身就会给你最好的报答。当你把注意力集中在“做事”上，不在乎别人的佩服和追捧的时候，你自然就会变得低调起来。


    下一讲，我们从积蓄力量的模块进入到竞争模块，我要给你好好讲讲职场上的竞争。下一讲见。'
