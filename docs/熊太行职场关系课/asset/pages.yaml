- pgno: 103
  md: '# 第三，最规矩的人


    如果联手对象以往曾经背叛其他联手对象，甚至他的盟友，你就要提起你的戒备心，千万不要松懈。


    新人和实力较弱的人也能和强者联手，但是你要付出的代价可能会更高。把自己更多的利益让对方，这个联手就更可能成交。


    # 联手容易出现的两大错误


    一位 C 同学曾经在留言里分享过他的短期结盟经历，他的问题就很典型。


    > 我是一名新人销售，前几天有一位客户来咨询，我的资历有限经验少，很担心拿不下他，领导就找了一位老同事 B 来帮忙。B 和客户接触了几次，对方很满意，我就忙别的去了。


    一个星期后，听说客户已经去了别的公司，B 还跟我埋怨说，他给我打开了局面，我没有后续跟进，我觉得很委屈。


    C 同学说的这种错误，是刚刚开始联手的人常犯的错误：


    # 第一个错误：工作没分好


    即使有的公司内部有规定，合作应该怎么分配工作，但两个不同的人分配时，真实成交的分工就可能不一样。


    如果是强强联手，两个人能够快速达成一个差不多的工作量分配。如果是强弱配，通常由强大的一方负责技术含量更高的工作，较弱的新人要分担一些琐碎的零活。


    具体到这个例子中，B 和 C 应该早一点明确各自的定位，要有一个人开口说：你做什么，我做什么。强者开这个口一般来说比较顺理成章，如果弱者作安排也可以彬彬有礼。


    C 可以主动跟他确认：“客户的服务计划得麻烦您了，我来约时间，定场地，把准备工作做好，有啥需要帮忙的您随时跟我说。”


    如果 B 觉得这个条件可以接受，大家就可以联手。联手就意味着你们不够熟，B 不要默认新人 C 懂规矩，新人也千万别觉得老人能自己把事都做了。如果两个人之间有迷惑，就多问一句确认一下。


    # 第二个错误：利益没分好


    这位 C 同学后来主动找 B 同事道歉，对方没有太责怪他，但是提出：“以后如果还有这样共同开发客户的情况，我们按比例来，我六你四。你看不行？”


    C 同学觉得有点别扭，问我：“熊老师，B 还是记恨我吗？”'
