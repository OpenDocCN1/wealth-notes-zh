- pgno: 137
  md: '# 本讲小结


    总结一下，清理战场是修修补补的泥水匠工作，但对你的安全和下一次进步都至关重要。得体的清理工作能表现出你的心态、对关系的认识和你的交际技巧。竞争是秀场，清理战场的时候就是聚光灯下的大舞台，全公司都看着，一定要处理好。


    下一讲，我们会讲竞争中一种特别特殊的局面——胜者已经内定，我们应该如何“陪太子读书”。下一讲见。


    # 思考题


    你的新团队里有个表态坚决对抗、挑衅你的前对手。现在你决定和他谈一次，希望他能够配合你工作，你准备谈哪些内容呢？


    # 参考答案


    如果是裁员难度很高的不完全职场，你可能必须要哄哄你的这位前对手了。比如，可以这么谈话：


    +   1. 提到大领导对大家的期待。


    +   2. 提到我对团队的期待。


    +   3. 公司要发展，这是一个大潮流，顺之者昌，逆之者亡。


    +   4. 希望大家心往一处想，劲往一处使。


    +   5. 你很优秀，出去肯定也有机会。


    +   6. 但是如果要在 这里，希望我们-起把事情做好。


    +   7. 或者你已经做好了准备，想要公司主动裁掉你么？


    +   8. 既然不是，我希望大家能够好好合作。


    +   9. 这个部门我是带头的，我会公正对大家，不要有什么担心。


    +   10. 这个单位有些爱挑动是非的人，推心置腹说一句，他们希望你来闹事，我觉得你可以离他们远一点，有事我们两个人来谈。


    ![](img/463ba23747f3bc168dba9e89f7a31f14_137_0.png)'
