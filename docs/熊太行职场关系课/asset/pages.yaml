- pgno: 161
  md: '这个时候你还要跟接手团队里的业务骨干谈谈，这是团队里最有价值的人。你要告诉他们，你的目的是把事情做好，希望对方帮忙。


    如果遇到长期被老领导低估的人，你可以给予一些物质激励，该加薪可以加薪。这样很快就会有人出来支持你，无论他是什么角色，都应该稳住他，接纳下第一个起身相迎的人。


    稳定之后，你可以再逐步引入自己其他的人手，同时继续辨别团队里的人，淘汰掉能力、人品上有缺陷的人。你的人越来越多，就从客场变成了主场。


    # 三、坚决不要吸纳对手本人


    无论是吸纳还是清理法，面对的其实都是你之前对手的团队。第三种情况是，你的对手本人要不要加入你的团队？


    有位 Q 同学曾经给我留言，谈到了他之前好心收留一位下属：


    > 这个家伙跟我竞争部门经理失败，我想他也挺有潜力，就让留下当副职，心想我比他实力强，对他也不错，应该能降得住他。


    > 结果前几天有个跟领导汇报工作的机会，他就上蹿下跳，各种讨好……


    Q 同学这样的好心人不在少数，但是你在职场上，尤其是带领一个团队的时候，应该首先尽力维护自己和团队的利益，不要被“胸怀大”之类的虚名束缚住手脚。


    在吸纳对手本人这件事上，我的建议是一刀切：不要留。


    把对手放进你的团队无非是两种情况：


    第一种情况是“留了有祸”。


    如果对手的团队已经并入了你的团队，把他们的前领导留下，会让这些刚被吸收的人感到困惑，其中有些人可能还会接受他们前领导的指示。如果安排前对手做副职，会更加剧这种混乱。


    另一种情况是“没有必要”。


    如果对手已经没了团队，自己一个人想加入你的团队，那你更没有必要留他。要知道他在公司里还有其他关系，他极可能变成拆台者和监视者。


    所以只要你有选择余地，就不要让前对手进入团队，可以跟你的领导协调一下，让公司“另有任用”，对你俩都是更好的选择。


    怎么跟对手开口呢？'
