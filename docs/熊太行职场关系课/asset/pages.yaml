- pgno: 6
  md: '# 3. 学习悲悯


    鹰派人往往在智力和业务能力上都不差，但强人一定要有悲悯之心。否则的话，很容易成为那种超级英雄电影里“科学怪人”的形象，觉得水平不如自己的人都该去死。


    《狮子王》里的辛巴，是一个学习悲悯的正面鹰派，他骨子里是鹰，但从小和两个鸽派朋友一起长大，这让他懂得了平和和悲悯，性格更加复杂，属于鸽包鹰的典型，鸽包鹰容易麻痹对手，鹰式反击到来的时候，对方才会明白晚了。


    “一鹰两鸽”是非常好的组合，很多作品都是这么搭配的。


    复杂的性格能让你在人际关系当中更加主动，尽量避免做让别人一眼看穿的人。要多和性格互补的人做朋友。


    # 4. 避免逆境崩盘


    鹰派在遇到挫折和打击的时候很容易崩盘，运气好的鹰派可能会扛下来挫折，把自己向鸽派靠拢，一个更好的办法是尽早从别人那里去体验挫折和崩盘。


    《笑傲江湖》里，任我行是非常典型的鹰派，任盈盈则是以鹰为主，任我行遭遇了多年黑牢，用仇恨支撑着自己，但任盈盈早早遇到了令狐冲这个鸽派，令狐冲给他讲述了一个自己受挫和崩盘的故事，任盈盈倾听的同时萌发的不仅是爱意，还有性格上的进步，她从此变成了一个鸽四鹰六的人，这种比例最容易出狠角色。


    # 5. 一定不要做十分鹰


    一个国家里，有鹰派和鸽派非常正常，今天你上台，明天我上台，对手强了就让鸽派去温存一下，对手弱了就让鹰派动手欺凌一下。一个唱红脸，一个唱白脸，就有了运用策略的可能。


    同样，人际关系当中，做十分鹰就会有十分的敌人，而你也会变成一个可以预期的人，这样的风格很容易中别人的圈套。


    《天龙八部》里的“岳老三”看上去是凶神恶煞，总是自己说了算，但在实际操作中，他和“四大恶人”不断地给各种不怎么样的人物当打手，甚至被段誉这个大鸽派牵着鼻子走。


    无论是鹰还是鸽子，都不是什么基因决定的，和星座血型也并没有什么关系，有些人可能会受到一点家庭影响。


    大多数人的行事方式是青春期定下的，有的人是遭遇了变故，有的人尝到了甜头，从此就这么继续走下去了。'
