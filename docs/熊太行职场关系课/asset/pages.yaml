  md: '# 第二大误区：因为职场不是人生的全部，就不把关系当回事


    有些人认为职场不过是生活的一小部分，到点下班后不愿意多花一秒在工作上。他们爱把这类话挂在口头上：人要身体健康、人要有家人、人还要谈恋爱……职场没那么重要。


    其实，职场是你人生的主旋律，是我们大多数人成就感、人际关系和财富的主要来源。大多数人一生都要工作30~40年，每个工作日都要把超过一半的清醒时间，用在工作相关的事情上。25岁到40多岁这个人生阶段，职场尤其重要。重视职场，学会经营职场关系，才是认真对待自己的人生。


    # 第三大误区，认为职场竞争就是你死我活


    有的人把职场看作你死我活的修罗场，他们为了“活下来”，表现得心狠手辣。遗憾的是他们活得一点也不好。侵略性的策略也许能够让他们获得一次两次胜利，但想长期跟人合作，上升到更高的级别会非常艰难。


    真相是，职场不是修罗场，而是秀场。


    领导在主席台上，同事在观众席上，观看你在场地里和对手展开竞争。你需要取得胜利，但获胜的姿态也相当关键。你要做的不是消灭对手，而是和盟友、对手一起在舞台上起舞，展示自己的实力。你拿到的剧本不是“权力的游戏”，而是“演员的诞生”。


    理解了这三个误区之后，我相信你能认识到关系对职场发展的价值。而这门课就是要给你这样有实力的人才以助力，帮你在职场上少跌坑，走得更稳、更远。


    # 这门课我会怎么讲？


    这门课有三个特点，是你很难在其他问题产品里看到的：


    +   第一，  大量真实案例的拆解


    在得到运营一整年课程《关系攻略》的经历，让我收获了一个最有价值的宝库，那就是用户真实的留言。


    我阅读了2万条以上的用户真实留言，这些留言中有40%是关于工作和职场的。我给超过1万人做过具体的建议指导，积极地影响了他们的生活。这些真实的问题和案例，也成了这门《职场关系课》的基石。'
