  md: '# 本讲小结


    总结一下，你成为领导之后，对三种盟友有不同的应对之道。但无论哪种情况，真诚的态度是沟通的基础。只要盟友的增长大于流失，你就仍然可以强大，不必过分担心，你的实力会给你带来新的盟友。


