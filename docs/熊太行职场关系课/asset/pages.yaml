  md: "# 内战：选拔优胜者\n\n内战与外战不同，内战的主要目的，是选拔优胜者。内战中，你的对手是同事，你的目标明确，就是获胜后升职、加薪，或者其它的进步机会。内战中的裁判员、评判者可能是你的领导，也可能是几位领导或者整个公司管理层。\n\
    \n因此，内战的策略就要区别外战。外战要尽情展示自己的\boldsymbol{能力}，同时要\boldsymbol{保护领导}，展示\boldsymbol{忠诚}。内战同样要展示自己的\b\
    oldsymbol{能力}，但还要展示\boldsymbol{和睦}的人际关系。\n\n千万不要急着去“干掉对手”，能在大仗里和你成为对手的一定也是个人才。评审团对你的观感，才是更需要注意的。\n\
    \n打内战有四种常见的错误：\n\n**首先是欺诈和欺骗**\n\n采用任何作假的手段去对付评审团，都会让你蒙受惨痛的失败。\n\n**其次是造谣中伤**\n\
    \n如果你把注意力集中在毁灭对手身上，写匿名信，造谣，你会成为第一嫌疑人。\n\n**第三是违背人设**\n\n这不是做坏事，但同样会让人觉得不舒服。\n\n\
    比如，你的人设是忠诚可靠，就不要冒险去跟对手打赌。不要让人觉得你“变得面目全非”或者“暴露出本来面目”，这两个评价一旦出现，以后再想被信任就很难了。\n\n\
    **第四是不要“让”**\n\n只要没有内定的情况发生，就要奋力拼搏，一定不要表现出“这次我让你”的姿态，对手会觉得你在侮辱他，而评审团也会觉得你胆怯、害怕失败。\n\
    \n这四点错误你在打内战的时候，千万不要犯。\n\n![](img/463ba23747f3bc168dba9e89f7a31f14_131_0.png)"
