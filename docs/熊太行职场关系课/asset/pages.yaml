  md: '# 情绪管理的典型错误


    情绪在受到严重刺激的时候最难管理，我重点说被领导批评的局面。


    我有一位朋友N先生是位30多岁的科研工作者，他有一位50岁、脾气不太好、想当副校长的女领导，这位女领导经常批评他。


    N 是这样描述的：


    我的领导是院长，她希望在退休前成为副校长，所以希望我的研究尽快出成绩。但她脾气很大，一个地方做错，可能就会在微信群里发几百字来批评我和我的下属。有几次她当着所有人批评我，一点情面都不留。


    我的这位朋友是位留洋博士，人非常聪明，但是情绪管理这件事，他有三点误会：


    首先，把压抑自己当情绪管理。


    他每次被批评，都是在煎熬中度过的。这种压抑确实能够练出他的耐心，但同时也消磨他对工作的热情和热爱。这样的上下级关系是苦苦维持的关系，当工作变成痛苦，人很快就会生病。


    其次，把管理情绪等同于“不顶撞”。


    N先生“在‘不张嘴’这里的表现已经很好，他肯定不会顶撞领导，但是在控制表情和肢体语言的方面，他表现不佳。人在被批评的压抑状态下，不自然的小动作会特别多，你的表情、动作，都可能被领导看作‘不服气’或者‘挑衅’。


    第三，独立承受情绪伤害。


    领导也有情绪，而且还不小。而N先生在被领导批评的时候，只是感受到情绪上的痛苦，这是硬扛了全部的情绪伤害。这种情况之下，N只能觉得“我已经没法忍受她的折磨了”，压力越来越大。


    # 情绪管理的行动指南


    只是封住自己的嘴，不会让你的情绪管理得到真正的改善。和忍住气相比，不生气是一个更好的方案。


    情绪要前置到“认知环节”去管理，在“走心”那部分去拆解问题，正确认识你遇到的挑战事件，可能让你少承担很多的负面情绪。在“走心”环节做工作，你就能控制后面“上脸”和“张嘴”两个环节不失控。'
