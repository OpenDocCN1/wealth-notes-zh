- pgno: 20
  md: '我给你一个标准，要根据你的必要花销备好一笔离职准备金，比如对于刚毕业的你来说，最低是三个月的房租。这笔准备金会给你提离职的底气。


    三个基本原则+零号原则，就像是物理学的牛顿三定律，构成了职场世界的基本规则。职场三原则是我们这门课的入门功夫，也是我们提升自己的修炼法门。即使你现在地位再高，每天多琢磨一下自己有没有遵循这三个原则办事，有没有尊重别人的安全、进步和收益，都会有成长，有进益。


    # ## 本讲小结


    总结一下，我今天给你讲了职场上最基本的三个原则，安全、进步和收益原则，正常环境下的职场人都会遵循这三条原则。但如果你处于一个非职场环境，千万别忘了还有零号原则：离开。


    职场上这些基本原则会贯穿这门课，我们后面还会多次提到，让你明白具体环境下，这些原则应该如何使用。


    # ## 思考题


    我给你留一个思考题：


    你的领导对你说：“虽然你这半年表现不错，但上次你已经是优秀员工了，这次让托尼代表我们部门去参与技能大赛的竞争，希望你支持他。”


    +   A. 根据安全原则，一切听领导的，当场同意。


    +   B. 根据进步原则，坚持作为独立候选人参赛。


    +   C. 根据收益原则，支持托尼，但是希望领导在下个月做明年预算审批时全力支持自己。


    +   D. 根据零号原则，愤然辞职。


    选B是安全原则的坚定信徒，你没有错。不过我还是建议你该尝试一下C。


    领导希望你让出的是一个很好的机会，考虑到你的感受，才来跟你讨论这件事，简单地答应，领导心里可能会有疑惑，会观察你的反应“这家伙说的我愿意，是真的吗？”


    这个交换里没有他没有的、紧缺的东西，这个提议会让他觉得舒服、放心。也让自己少一些辛苦，是比较划算的一个交换。'
