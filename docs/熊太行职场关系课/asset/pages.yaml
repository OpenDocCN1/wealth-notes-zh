- pgno: 118
  md: '# 21 理解竞争：不是战场，而是秀场


    之前的四章我们分别讲了，职场上的四种角色，你需要掌握的五种基本技能，和领导的相处之道，如何构筑自己的势力。这四个方面的内容，都是为竞争作准备的。


    第五章，我们就来讲职场上的竞争。前四章所有的知识点和技能，在这一章将会融会、打通。如果你有什么不明白的，要及时回到前面去复习。


    在这一章的最开始，我有一个最重要的任务，就是带你正确理解职场竞争。我要告诉你的是，职场竞争不是要争个你死我活，职场竞争是开放式竞争。


    什么叫开放式竞争呢？


    +   首先，没有哪一次失败会注定你的结局，即使你在这次竞争中失败，或者占下风，没有获得最后的收益，还有下一次机会等着你。


    +   第二，职场不是修罗场，而是秀场。如果用动物界作比，职场竞争更像是两只求偶的羚羊跳跃、触角，竞争者会在领导面前展示自己的实力和技巧。


    如果从领导的角度去看待竞争，他不是为了给下属排序，更不期望看到谁更狠，更不择手段。领导希望看到的是你的进步，他想看到下属身上不同的优点，然后安排到更合适的地方。


    可惜职场上很多人不明白这一点，一提到职场竞争，可能就以为应该拼个你死我活，反正适者生存，就像《动物世界》里狮子捕杀斑马一样，手软、怜悯就输了。


    所有表现平庸或者不可理喻的人，几乎都是在理解“竞争”二字的时候，有了根本上的偏差。对职场竞争理解有误，可能对你一时的影响不明显，但明明白白地展示了你的格局，也直接会决定你未来职业发展的高度。


    我看过一位很资深的职场人士，他在谈论内部竞争的时候引用《三体》的那句：“失去人性，失去很多；失去兽性，失去一切。”如果把丛林法则照搬到职场上，那你就大错特错了。这样理解职场上的竞争，以为要在任何场合都让对手不愉快，那你就会变成一个见谁怨谁的斗犬，人缘很差。


    还有的人认为职场上可以一团和气，完全不存在竞争，这样的人很快会交变成表现平庸或者自命清高的人。


    还有的人沉浸在职场竞争中的攻击快感和里，不顾及吃相，从来没考虑到领导也在从旁边观察你的行为。结果就是，虽然他能够斗倒几个对手，却一直无法获得提升。


    这些人都属于没有理解职场竞争的真正含义，你也可以看看你自己身边是不是就有这样的人。'
