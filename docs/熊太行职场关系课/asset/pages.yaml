- pgno: 157
  md: '赵匡胤怎么对待这个局面呢？他做了这么几件事：


    +   1. 请石守信和另外几个老将将军喝酒，表示亲近；

    2. 酒桌上谈到了他不放心几位老将将军带兵，说明意图；

    3. 建议他们去各地当地方官，让他们都变成有钱人，给出好处。


    这就是“杯酒释兵权”。酒桌上，石守信积极表态，第一个表示要退休，给其他人都作了表率。


    赵匡胤的经验告诉我们，过去的盟友可以做下属，注意好这几点就可以了：


    +   1. 你用他，他要尊重你的权威；

    2. 你和他亲，但他要给更疏远的人作出忠诚的表率；

    3. 你要给盟友该给的好处；

    4. 不要让老盟友再带兵了。


    具体到现代职场上，也有四点应用：


    +   1. 下属和领导再近乎，也绝对不能有轻慢的态度，应该比一般人更加尊重领导；

    2. 报答盟友最好的方案是物质满足，而不是分享权力；

    3. 不要在你之下，再设一个几乎拥有全权的副职；

    4. 职场上如果你像赵匡胤一样本身业务就很强，就能够大大减少对盟友的依赖。


    我们处理和旧盟友的对策，也仍然有“零号原则”：合作不下去就不合作，没了谁地球也一样转。如果你最近大规模地更换盟友，说明你的实力刚刚上了一个新台阶。


