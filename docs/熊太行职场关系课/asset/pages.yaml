- pgno: 86
  md: '# ## 15 逃生通道：离开不适合自己


    这一章，我都在给你讲上下级之间的相处之道。学习这些技巧是为了工作更顺畅，但是你一定要记得你没法让所有人满意。所以，最后一讲，我们要讲的情况是，如果你跟领导实在合不来，还有一个选择就是换一个领导。


    离开不适合自己的领导，我有两个忠告：


    +   - 第一， 大多数离开领导的行为都是辞职，但辞职不是唯一方式。

    - 第二， 离开的时候对你的领导多一点耐心，你就能多一些机会，少一些隐患。


    # ### 判断：领导还能跟吗


    当你有辞职这个想法的时候，一定要先想清楚自己到底想要什么样的领导共事，再作决定。我收到过来自 J 同学的提问：


    我工作两年了，属于核心业务部门。直属领导不懂业务，整天管桌面要干净，用心写周报之类的小事。


    我因为见人不爱打招呼，老被他批评。虽然他也夸我工作能力强，还给我涨了薪水，但是因为这些莫名其妙的小事被批评，我觉得很憋屈。我该辞职吗？


    这个问题就相当于问：这样的领导还值得跟吗？我们用职场三原则来看这件事，J 的领导不算优秀，但不是糟糕的领导。领导肯定 J 的能力，给他涨薪水，照顾了 J 同学的收益原则。


    领导要求桌面干净、用心写周报，是典型的废话讲话，其实是希望跟下属有更加密切的联系。


    领导对核心业务不熟，他担心有能力的下属会取代他的位子。从安全原则出发，领导需要你经常表达自己的忠诚。


    我在第一章说过了，和领导同步消息要像空间站对发射中心的联络一样，要定期做，没什么事也要做。这样他能安心，你也能得到他的支持。所以别误会，他不是挑你的毛病，而是怕你不再给他出力了。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '那 J 同学应该怎么办呢？什么样的人，才是不应该继续跟的呢？有三个标准：


    # 第一种，不喜欢你的


    这里说的不喜欢，是厌恶的意思，不是“不偏爱”。如果真的被领导不喜欢，做得再好也只能维持现状。J 同学的领导是赏识 J 的，意味着 J 以后有升职的空间。


    # 第二种，不满足你的


    你觉得薪水太低，希望加工资领导没答应；你好不容易去见女朋友的家长，领导非让你临时加班；你想休年假，领导拒绝，这都是个人诉求没有被满足。从这个角度看，领导愿意主动加薪给
    J，他没有不满足 J 的要求。


    # 第三种，有缺陷


    领导不懂业务，说话不算话，这都属于严重缺陷。


    “不喜欢、不满足、有缺陷”三个条件全部凑齐的时候，你应该果断辞职。但是像 J 这种情况，只有一个条件不符合，他的领导只是不懂业务，这个时候别急着辞职。


    领导赏识你，即使工资低，领导本身能力有限，你也可以熟悉行业情况，在团队中积累经验后再走。领导能力强、对下属好，但不愿意提升你的收入，你也可以熬一熬，从他身上学到东西，跟着团队上一个台阶后再走。现实中大多数能满足两个条件的领导，已经是不错的领导了。


    # 准备：提辞职的三大错误


    但如果你确定要辞职，就赶紧准备，一是做工作上的准备，二是也要做心理上的准备。同时，你也要避免提离职的时候犯错误。


    你可能会觉得，“辞职还有啥不会的？”那你就想得太简单了。


    我认识一位年轻姑娘 A，工作压力大，收入也一般，在同事面前和领导大吵一架之后，她结束了上一份工作。她出去玩了几个月，回来找工作时问题出现了。她过去甲公司信心满满，也托朋友做了内推，但是面试完第一轮就黄了。


    半个月后，A 开始自我怀疑：“我投的岗位怎么都没中呢？是不是我能力不够好？”


    一个月后，A 开始焦虑：“我学历好、履历棒，怎么还没找到工作？是不是大环境不行？”'
