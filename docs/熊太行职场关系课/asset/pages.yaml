- pgno: 56
  md: '我给了她一个方法，让她每天说话的时候留意，如果说“我是一个如何如何的人”，就把这句话记下来，下星期我们看着她的记事本，复盘一下她是如何评价自己的。一个星期下来，她记了这么几句话：


    +   - “我这人不容易发火……”

    - “我脾气这么好的一个人都……”

    - “我不是那种由着我男朋友的人……”

    - “我这个人就这样，要就不做，要做就把事做好。”

    - “我是特别注重生活的一个人，我觉得工作不应该是生活的全部。”


    她看着这些记录也惊呆了，她评价自己的时候，用了大量的负面词汇。


    还有一条朋友圈，我是偶尔看见的，半夜她发了一条：“有些人不要太过分，别觉得我好说话就一而再再而三……让你一次……”说到这，我要特别提醒你，千万不要用朋友圈去惹同事。


    C 到底错在哪里，主要有四个问题：


    # 第一个问题，自我评价过于随意


    “我是一个 xxxx 的人”这个句式不可以随便说，这就是在对别人发布你的人设。用这个句式时，用词一定要精挑细选。


    你可以说自己拥有什么样的特质，比如“我喜欢好吃的”，但不应该说“我这人是个吃货”。


    现实中如果别人听到你做这样的自我评价，会竖起耳朵，并在心里给你打上这个标签。如果你随便评价自己，那么你就要承受标签所带来的一切影响。


    # 第二个问题，把自己和负面词汇连接


    “我这人轻易发火”，是在强调“我很能忍耐，但你已经激怒我了。”只要你在评价自己，就不要和负面的词汇、表达挂钩。正确的表达是：“我的性格很温和了。”


    而且，“我脾气已经很好了”也不行，好脾气的暗示是，再好也是有脾气的。不要把自己和负面词汇连接，中间有表示否定的词也不行。


    # 第三个问题，最好只用简单句描绘自己


    你仔细听 C 还说了这句话，平时在生活中你也一定经常听见别人说：“我这人，要就不做，要做就做到最好。”其实她要表达的意思是“我想把事情做好。”


    “要就不做”，北京人管这叫“话仫料”，可能是为了表达形式上的工整，其实这是容易引发误会的废话。尤其是领导下命令，你来一句“要就不做”，领导得琢磨半天。所以能用一句话直接说清楚的，就不要说别的信息。正确的表达就是“我很想把这个事情做好。”'
