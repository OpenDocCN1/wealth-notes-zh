- pgno: 97
  md: '# # 17 同盟圈：维护盟友关系


    上一讲，我给你拆解了“基本盘”这个概念，这些人可能不在你的职场上，但却是你职场竞争的起点。这一讲，我讲如何维护你的盟友关系。


    有同学问过我一个问题：“盟友关系都建立起来了，我是不是可以高枕无忧了？”如果这么想一定会吃亏的，盟友关系从来就不是一成不变的。


    在第一章里，我给你介绍过和盟友基本的相处之道，这一讲，我要重点讲盟友关系发生变化的“关键一刻”。


    我单独用一讲来讲盟友维护，是因为你在盟友身上托付很多，被抛弃甚至背叛时，你的损失会非常巨大。与其研究如何在盟友背叛之后收拾残局，更好的办法是把工作提到前面来。我们来研究盟友关系破裂前的那一刻，就是双方实力发生变化的一刻，我们应该如何应对。


    # ## 如何理解盟友的变化


    你可能会遇到这样的情况，曾经是盟友的人突然对你冷淡，有的甚至开始挑剔、找茬、为敌。第一章我讲过这种情况如何处理。


    首先要确认你有没有误会对方。


    +   - 两条行动上的建议是：积极同步消息和直率沟通。

    - 两条心态上的建议是：积极理解和不怕拒绝。


    这是 we 和盟友相处的日常策略，如果你做到这四点，可以很好地消解误会。


    但是有些矛盾，不是误会，它真实存在，正在发生。比如你的盟友即将把你抛弃，再比如你发现你的盟友频频失误，需要换一个更合适的了。


    无论你是抛弃者还是被抛弃者，这种变化的出现，归根到底是结盟双方的实力发生了变化。


    怎么识别一个职场人的实力是不是发生了变化呢？


    一个人在公司里的实力到底有多强，不同行业和不同性质的公司都有自己的判断之道，比如在一个创新型的科技公司，是否承担最重要的产品可能就是一个实力的标志。但是一些偏传统生产的公司，比如门户网站，管理越大的队伍，手下的人手越多，话语权就越大。


    尽管有区别，也有一些共同的规则，如果你的盟友获得了更多审批、签字、制定预算的权力，那一定是他的权力在上升。'
