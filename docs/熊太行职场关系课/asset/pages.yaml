- pgno: 111
  md: '# 本讲小结


    总结一下，这一讲我希望你记住的是，故意说谎、破坏规则、泄露秘密，以及一切对你明枪暗箭的人，都不应该在你的阵营里。别怕冲突，该切割就切割。除掉雷，盟友们会支持你，大家都会更安心。


    有一句话叫做“明修栈道、暗度陈仓”，下一讲我会给你讲，在布局力量的时候，如何保持低调。下一讲见。


