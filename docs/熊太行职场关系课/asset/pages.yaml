- pgno: 64
  md: '另外，有几种欺凌情况比较特殊，我也给你相应的应对策略：


    +   1. 被直接领导排挤。


    这一类是无法反击的死局，建议尽快寻找新的工作机会，重新开始。


    +   2. 被高层级副职排挤。


    这种向下的排挤一般都是派系问题，这时要尽量靠近自己的直接领导，让你的领导明白一个道理：“对方正在算计咱们。”尽可能地领导拉进来支持你。


    +   3. 来自下属的排挤。


    刚被提拔成领导，或者是空降领导容易遇到这种局面。这个时候应该避免被激怒，动手换掉带头反抗的人，找到授意下届们对抗的人在哪里。我在《关系攻略》里写过新领导如何清场（《如何与你的领导发生冲突？》），你可以参考。


    最后，我要重新强调一下我们的职场零号原则：不是所有的欺凌行为都值得我们去反击，有些地方根本不值得你待下去。找到一个更好的工作，跳去一个更大的平台，永远是成功的反击欺凌方式。


    # ## 本讲小结


    总结一下，职场上老兵和新人都可能遇到欺凌，面对职场上不友好的情况，你首先要判断这是不是欺凌，然后再根据情况作出相应的策略。


    # ## 思考题


    如果你的盟友要拉你加入到一个排挤新人的活动，你会接受还是拒绝？试着写下几点理由。提示一句，这可能用到我们上一讲的知识要点。


    # ### 参考答案


    “有点没必要，他如果能力有问题，呆不住很快就走，这个时候我们再来一下，倒让别人觉得我们好像在欺负人了。我建议等等看，看他有没有实力真能证明自己。”（推开）


    “哎，新发现一个不错的馆子，周日一起去吃啊？”（岔开话题，修复关系）'
