  md: '# 我希望你怎来学习这门课？


    如果你是即将踏入职场的学生，可以跟着这个成长路径一步步来学，如果你已经是职场老鸟，但也面临着关系问题，你可以从复盘自己的职场关系开始学习，找到自己问题的症结所在。


    我想在这门课开始之前再申明一点，这门课默认讨论的是“职场环境”。并非每个人所做的工作都是职场，有的工作属于非职场，比如家政服务员、独立作家、明星私人助理，如果你从事这样的工作，那这门课讨论的场景和你的工作不会丝丝入扣地贴合，但可能会在原则和方法上帮到你。我在预习课里会详细拆解“职场环境”和“非职场环境”的区别，你也可以先去学习。


    最后，我想聊聊我对你的期望。


    开始的你，在面临职场上的各种冲突、冒犯的时候，只能做本能反应。你把这门课跟下来，过去那种低着头向前挣扎的状态就此结束。你能看清职场上的每个玩家，分清哪个角色是敌是友，有计划地组织自己的力量，任何情况出现，都能镇定自若，胸有成竹。


    遇到职场上有困难施头、敌军压境的时候，别人会像刘备一样唉声叹气，像张飞一样暴躁如雷，而你能像诸葛亮一样淡定地说一句：“别慌，我已经筹划好了。”


    《职场关系课》这门课，给你指了一条明确的路，从起点到成熟职场人的升级之路。


    学习这门课，让你强大，让你赢。


