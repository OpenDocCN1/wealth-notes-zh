- pgno: 21
  md: '# ## 02 领导：获得支持的关键是信任


    你好，我是熊太行，欢迎来到我的得到课程《职场关系课》。


    上一讲，我给你讲述了职场上最基本的三原则，这一讲我们讲如何获得领导的支持。


    为什么它是讲完三原则后的第一讲呢？因为这个问题实在太重要了。除非你是老板，否则每个人都会领导。打败愚蠢领导挽救公司的故事都是神话，在领导的支持下做成大事才是智慧。


    # ### 信任是获取领导支持的关键


    领导会支持什么样的人呢？根据我多年观察总结的经验，你需要具备两个特征：


    一个是基本实力，也就是你的知识积累、智力、体力、敬业精神和顽强的斗志。


    另外一个 是“互信状态”，信任才是获取领导支持的关键。大多数人都知道要提升基本实力，公司的成长体系也会就基本实力培训，提高业务能力。但很少会给你强调“互信状态”的重要性，更难的是明明白自教教你怎么做。


    这也是这门课程的价值所在，这一讲重点就是如何维护“互信状态”。


    基本实力和互信状态不是简单的加法，更像是一种乘法。如果互信程度是 80%，你去做事的效果就能发挥出 80%；如果互信程度是 120%，有了领导的信任，你的实力能有更大的作用。


    如果你和领导产生了误会，互信状态为零，那领导对你的支持就是零，不离开这里，就没有任何机会。


    学历低的人可以用敬业来补，斗志薄弱的人可能因为一招牌而被领导用，但是“互信状态”如果不维护，你对领导来说就是不可用的人。


    # ### 破坏互信状态的两打错误


    信任是逐步建立的过程，但是可能会因为一个错误就毁于一旦，下面我就给你讲会破坏信任的两大错误。


    我曾经收到过一条来自李同学的留言：


    熊老师，我凭自己的本事考进了我们这家公司，我们部门的分管副总和我爸爸是同学，入职后爸爸带我去拜访了领导，让我多去走动。我一直觉得有点不好意思，过去串门也不知道该说什么好。总觉得做好了工作不要麻烦他最好，这样的关系还要维护吗？'
  merge: -1
  img_proc: true
- pgno: 22
  md: '虽然不是直接领导，但是李同学和分管副总维持了“高互信状态”，这是别人梦寐以求的。这时就应该尽可能维持这种状态，利用领导的支持来做事。


    有两种错误会破坏互信状态，一种叫**信号黑洞**，另一种叫**信息冗余**。


    领导和下属的关系很像是航天指挥中心和空间站，我们看着宇航员进入空间站，该吃饭吃饭，该睡觉睡觉。其实每一刻空间站都在发回有用的数据，告诉指挥中心：我在工作、一切正常、我听你的。


    职场也是如此，信任这两个字，首先得有信，要和你的领导互通信号。告诉他你在工作，状态良好，听从指挥。


    “信号黑洞”的错误就在于认为自己可以是职场孤岛独立运行。像李同学所说，“我凭自己的能力考上了本公司。”自己明明在进步，却不想去跟领导同步消息：“不知道该说什么好。”


    把自己变成信号黑洞的有两个人。


    一种人对正常人际交往有回避和恐惧，像李同学渴望副总为自己骄傲，却把正常的信号沟通当成“表忠心”或者“拍马屁”。其实宇航员和指挥员哪有什么拍马屁呢？大家目标一致，就是两点：一个是“一飞冲天”，也就是进步；一个是“平安落地”，也就是安全原则。


    还有一种信号黑洞是“猫系员工”，家猫是我们最晚驯化的动物，不黏人很冷淡。“猫系员工”也有类似的态度，他们喜欢说：“我不是来跟人的，我是来做事的，抓好老鼠就OK。”有的领导觉得下属“喂不熟”，就是遇上“猫系员工”了。家猫如果失去了主人会活得非常艰难，有实力的员工只要愿意和领导保持沟通，就已经可以有足够好的关系，也能获得足够的支持了。


    第二类错误是信息冗余。


    这类人可能做错事、瞎折腾。有一种特别典型的员工，平时很迎合领导，总是琢磨领导的心思，每天都在逢迎领导。这就是“犬系员工”，其实狗能看家、打猎，是人类的好帮手，但是如果每天都看见狗在摇尾巴，就很容易让大家误会只会拍马屁。


    “犬系员工”在讨好领导个人上，投入了太多的精力，容易让领导忽略他本身的实力。《鹿鼎记》里韦小宝说：“我不学无术，谁对我不好劲谁一定有真本事。”这就是一种反向思维的领导观。而且，“犬系员工”还很容易被同事瞧不起。


    具体到职场中，如果想要维持高互信状态，关键就是消除信息不对称，让你的领导收到你的信号，在行动中不断加强信号。这就是“确认过眼神，是可以信赖的人”。


    小结一下，职场上最容易犯的两种错误：


    +   1. 要避免成为信号黑洞，你一定要让领导知道你的想法；

    2. 要避免制造信息冗余，你要珍惜你领导的注意力，给领导传达恰当的信号。'
