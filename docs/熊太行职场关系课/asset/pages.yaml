    你的霸道会有一个力量槽，在关键时刻会爆发出惊人的力道。

    2. 不要怕别人笑你软弱

    对比你更弱小的人客气有礼貌，不是害怕对手，而是害怕自己变成自己都不喜欢的人。许多鸽子在突然获得权力或者财富的时候，突然就转了鹰派，那他看人的不是鸽眼也不是鹰眼，而是标准的势利眼，在一堆朋友面前呵斥一个犯了小错误的饭店服务员一点也不露脸。

    你不是软弱，你的爪和甲，在你强大的心胸之下。

    3. 交一些生命值更高的朋友

