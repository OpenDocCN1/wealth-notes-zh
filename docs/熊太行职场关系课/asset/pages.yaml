- pgno: 35
  md: '# 05 中立同事：做一个「总统先生」


    你好，我是熊太行，欢迎来到我的得到课程《职场关系课》。


    前两讲我们拆解了职场上的两类角色，一类是对手，一类是盟友。但职场上除了这两类人，还有一类处于中立地带的普通同事，我们称之为“中立同事”。


    中立同事和你之间没有直接的竞争关系和利益冲突，也没有共同的敌人，他们不会取代你的位置，也不用担心自己的位子被你夺走。但他们却是你每天都要遇到、需要日常相处的人，更重要的是，他们人数众多。


    我专门用一讲来跟你说中立同事，跟他们相处得当，你可能会收获意外的惊喜，遇到潜在的盟友；但如果相处不愉快，他们就可能成为你潜在的敌人。


    和中立同事成为敌人，破坏性是很大的。虽然你托中立同事成事业非常难，但要想把一件事情搞黄，有时候中立者的一句坏话就够了。领导会觉得：“没有利害关系的人都给你差评，你这个人也许真的有问
    题。”


    # 和中立同事的相处原则：多快好省


    中立同事的本质是一种界线分明、避免冲突的礼貌关系。你和他们开展社交的目的，不是追求和他们成为朋友，而是为了让他们对你抱 有善意。


    有善意就够了，和中立同事相处，你需要时刻谨记职场基本原则里的进步原则。你的时间和精力就这么多，一定要把注意力重点放在对手和盟友身上，他们才是你获得提升的关键。


    而跟中立同事相处就要讲究交际效率，我给你归结出了四个字，就是：“多、快、好、省”。


    第一个是多，尽可能多地去和中立同事开展接触


    如果你所在的公司规模比较大，或者你的工作需要跨部门，那你可能要接触几十名甚至上百名中立同事。不要忙着找人交朋友，先让所有人记住你，印象深刻地记得你。


    一个人想要在职场上出人头地，必须要有尽可能多的人提及你，知道你这个人。不信你观察一下你的领导，他可能没有朋友，但一定有很多的熟人。


    这其实很好理解，公司在举行各种比赛、投票的时候，大家都更倾向于投票给认识的、彼此微笑过的人。所以，对你抱 有善意的陌生人越多，你在职场上就越安全、越稳固。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 第二个是快，尽快释放你的善意，最简单明了的方式就是称赞


    比如“今天这件衣服真合体”“新发型，太好看了”“你上次那个 PPT 做得太好了”。高效释放出你的善意，不要不好意思，因为你和对方没有直接的利害关系，他更容易相信你的称赞是因为他的魅力。


    # 第三个是好，指的是帮同事一些小忙，也请这些同事帮你一些小忙。这些小忙是你们彼此抱有善意和亲近的开始


    # 最后是省，不要把大量的时间和精力投入在某个中立同事身上，这对你在职场上的强大没有直接帮助


    之前有同学曾经问我，要说出一趟圈，要不要给他部门不太熟的同事每人带个礼物，我建议不要带。大规模地给中立同事送礼，会让别人对你有更高的期待，还会给你带来沉重的经济负担。


    # 总统策略


    曾经还有一位同学 F 给我留言，她有一种喜欢讨好人的性格，和没有利害关系的同事相处，很快就变成了乙方，成了给对方付出劳动力的可怜人：


    > 我们几个同事经常一起吃饭，刚开始我最年轻，有的时候就主动帮大家拿外卖、给大家清理餐桌，后来这些事逐渐就理所当然变成了我的事了。再后来有新的人进来了，这些事还是我在做，新人一点眼力劲儿都没有，他们根本就不在乎老员工的感受。想要不管这些事了，但又怕那几个刻薄的人说我矫情。


    F 同学的情况其实很容易解决，只要暂时不吃外卖就可以了。我建议她可以尝试做饭，带饭盒去公司，把自己自然而然地从拿外卖清理餐桌这些事上解脱出来，等到小群体形成了自己的事情自己做的风气，再重新加入。


    但是她认识上的错误，可能不是一天两天能够改变的。她认为资历浅，就要为中立同事做事来讨好他们、表示对他们的尊重，只会把自己带进一个无底洞。


    你不能做“生活委员”或者“知心姐姐”，你需要采用的是“总统策略”。你应该看过美国大选候选人拉票的样子，他们微笑、问候每个人、对引发争议的事情不表态，说话从来不会太满，而且会选择偏保守的建议。


    总统策略就是对一个礼貌而友善的陌生人应该采用的策略，你在对待中立者同事的时候，也可以采用这个策略。这个策略有六个要点，分别是三个小习惯和三个处事建议：'
