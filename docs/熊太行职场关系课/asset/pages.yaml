  md: '我们可以想象这样一个画面，你把弓拉满瞄准对方的状态，对方也会忌惮不敢进犯。鹰派同学要特别注意别贸然进攻，鹰最强的时候是在天上，而不是扑下来落在陆地上。


    # 第二，不怕事


    不怕事的关键是被对方进攻、暗算的时候，一定要及时反击。鸽派同学千万别怂，对手的攻击是捕风捉影，你就要请领导查，是谁在污蔑你，别想用一句“清者自清”就算了。只要你摆出反击的姿态，领导就会明白，原来我的这个手下性子很烈，要让他继续跟我干，不能随便欺负他。


    反击未必是也告对方一个黑状，大多数时候，只要声明“这么冤枉我，太不公平”就够了。对手就知道你有防备，而领导也知道了你的决心。


    # 最后一句，能了事


    我们中国人有一句老话，叫做“冤冤相报何时了”。当对手开始表现合作态度的时候，报复就可以停止。


    你可别小看这九个字的口诀，这是中国的古老智慧，也被现代的科学实验所证实：博弈论学者罗伯特·阿克塞尔罗德有一本书叫做《合作的进化》，记录了他组织的一个计算机策略竞赛。


    他用电脑来模拟两个人，如果甲选择合作，而乙选择背叛，乙会获得全部利益。如果双方都选择合作，那么双方受益。如果两个人都选择背叛，两个人会两败俱伤。


    在这个游戏里，从来不报复的“老好人”很快就失败了。同样，只懂得背叛的“老毒物”陷入互相报复的死局，也失败了。这跟职场上一样，只懂得横冲直撞四处黑别人的家伙活不长久。这个分析过程很复杂，如果你还想了解，可以去看书。在这里，你记住三条原则就够用了。


    这个实验最后活下来的，也是执行这样策略的电脑：


    +   1. 不主动背叛。

    2. 在被攻击之后执行反击。

    3. 只要对方再次选择合作，就停止报复。


    这个策略，就跟我们不挑事，不怕事，能了事的策略，完全一样，对不对？


    把交情和竞争分开的人，是真正的高手。如果你和对手过去有私交，竞争过程中也仍然可以维护交情，问候他的家人，假期过了送一些小礼物给他的孩子，一来可以麻痹对手，二来也是为未来铺垫。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '竞争关系早晚有结束的时候，提前做了有交情的表示，未来也就有修复关系的可能。对任何对手，留有余地都是好的。因为你不知道什么时候，你们就会结盟、就会合作。做人留一线，日后好相见。


    # # 本讲小结


    总结一下，这一讲我们讲了三个重点：


    首先，不要随便把对手变成敌人，分清这两种角色。


    其次，鹰派别先动手、下狠手。鸽派别怕冲突，也不要先给对方冷淡信号。


    最后，面对冲突的九字真言：不挑事，不怕事，能了事。


    # # 思考题


    我还是给你留一个思考题：


    你的对手因为工作失误被免职，可能会被分配到你的部门来成为你的手下，但这人的能力还是不错的，这个时候你的态度应该是：


    +   * A. 冷嘲热讽，先过瘾再说。


    +   * B. 立刻把他纳入战斗力，希望他重创辉煌。


    +   * C. 跟他谈一下，希望对方能够和自己好好合作。


    +   * D. 跟手下说，谁要是敢和他做朋友就死定了。


    # ## 参考答案


    这一讲的题目答案很简单，就是 C，要跟对方好好谈谈，再做判断。


    这个场景是对手走背运被发过来，这个时候抱着“您这是临时的，以后有机会翻身，但是现在到我这里了，希望能尊重我的权威，我们一起把事情做好”的态度，是温和得体的。


    《亮剑》里有类似的情节，李云龙犯了错误，被首长降为副团长，他的老战友孔捷过来当团长，孔捷明白队伍是李云龙才能调动的，所以对他非常尊重和客气，最后两个人也终于合作打了胜仗。


    第 6 章我会给你讲另外一个局面，如果你提升了，到了对手的头，做他的领导，这个时候不要留下对手。和这个形势有区别。和官场不同，完全职场上，降下来的人，还有升回去的机会。'
