- pgno: 57
  md: '# 第四个问题，不说工作之外的事


    C 还说了一句 “工作不应该是生活的全部”。这是一个绝对的真理，但在工作场合说这句话，除非你是老板才行。


    在职场上不要发呆跟工作无关的人说，如果你上班三天，全公司就都了解了你的婚恋观、感情观，那么领导还敢重用你吗？


    # 三步打造你的职场人设


    传递错误的人设是一件很危险的事，但怎么找到正确的人设，就要因 人而异了。


    我一个朋友 M 就曾经问过我， “你觉得我应该挑选一个什么样的人设？ ”


    我告诉他：


    人设这件事必须自己选，别人帮你树立一个和你性格不符合的人 设，你又真的朝那个方向努力，就会特别痛苦。


    现实中这种事很多见，明明是一个话不多心思重的下属，领导非要 “你得变开朗一些”，最后这个下属总觉得自己辜负了领导期待。


    那怎么才能找到符合自己的人设呢？


    # 第一步，写下你认可和喜欢的特质


    我让 M 写下来 “你期待变成什么样的人”。


    M 第二天给了我一大堆词汇： “忠诚勇敢、有责任感、细心周到、尊重秩序、帮助他人、开朗幽默……”


    # 第二步，挑选别人最容易跟你合作的那个特质


    我对 M 说： “作为朋友，我觉得这些词你都符合，但是太复杂的人 设，别人是记不住的。” 你在一段时间当中（至少 12 个月内），就只能强调自己的一个特质。M
    想了想，觉得大家认可、自己也得意的，就是 “细心周到”。


    # 第三步，努力活成你选中的样子


    人设的发布可不仅仅是，告诉同事 “我是个细心周到的人” 这么简 单。这句话更多的作用，是给自己积极的心理暗示，能够让自己变得更像期待中的样子。


    从离开单位的时候检查门窗设备，到观察同事的身体、发型变化，你一 旦开始用 “细心周到” 来要求自己，就会发现世界变得富有细节。同样，如果你发布自己的人设是
    “乐观开朗”，你就能把一切不利的局面解读出正面的意义。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# 基本人设：服从与感恩


    当然，在你努力强调的人设之前，还有两个基本人设，也是你在领导面前需要经常强调的：一个是服从，一个是感恩。


    # 第一，服从


    手底下的人，先得听话，好用。领导可能还关注你的其他人设，比如喜欢学习，但服从是第一位的。即使你带了团队了，对自己的领导还是要反复强调服从。


    当然别硬头硬脑地去跟领导说 “我这人就是特别听话”，太呆了。但是换成下面这些话，就会好很多。


    +   - “把事情做成才是最重要的。”

    - “我这就去。”

    - “已经办好了。”


    你有没有发现，这些话给下属听，也能表现出你作为领导的效率和决断。


    # 第二，感恩


    只会服从，你永远只是个 “手下”，要想变成 “人才”，人设里一定要强调 “有恩必报”。


    从工作角度来说，一个领导应该为公司提拔能力最强的人。但是从领导个人利益看，提拔一个 “有恩必报” 的人，可能是更好的选择。领导个人的利益和公司的利益并不完全一样，尤其如果公司规模够大，两者利益可能完全不同。


    不只是领导，盟友和中立同事都愿意帮有恩必报的人。但表达 “我是个有恩必报的人” 可以艺术一点。


    我有个朋友，他张嘴就会说：“我这人就这样，有恩报恩，有仇报仇。” 这话太愣了，有仇报仇是负面表达，完全不该提。你只要说 “我特别记得别人的好” 就可以了。


    还有一种表达方式，是直接用感激的口吻去提及某人对自己好，我们在第 7 讲 “如何称赞他人” 中提到过。如果大家经常听见你表达对别人的感恩，你得到新的帮助就要容易得多。因为你每次表达都向听者强调：“我希望你也来帮我，做我的朋友”，“我这个人有恩必报”。


    服从和感恩都要藏在你想要发布的人设之后，如果你是职场新人，可以暂时不发布自己的独特人设，可以只强调服从和感恩。从你开始表达服从和感恩的那一刻起，你会发现你和别人的关系会逐渐改善、缓和。'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 本讲小结


    总结一下，这一讲我给你讲了如何打造自己的人设。


    人设要求精，不要求多，越精准，越能让更多的人记住你。有了这么一个基础，未来可以针对个别人再深度展开。


    # 思考题


    如果有人帮了你一个小忙，每次都要当众夸耀这事，你应该如何应对呢？


    # 参考答案


    赶紧把话接过来，与其让对方炫耀，不如让自己感恩。


    简单叙述对方帮助自己的事迹，称赞对方的古道热肠，表示自己会永远记得，表达“同事之间这样互相帮助，我们公司这个大家庭真温暖”的意思。


    这期间，要有耐心，要微笑，不要有一丝的不耐烦。


