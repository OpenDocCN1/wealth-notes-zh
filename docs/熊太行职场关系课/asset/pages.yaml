- pgno: 18
  md: '当然，变通行为也是越界，职场上做太多、太泛滥的变通行为，会让自己承受过高的风险。许多刚入职场的 人恐惧变通行为，因此损害了重要的关系。工作时间长了之后，大多数人都能接纳、容忍变通行为的存在，这也是成熟职场人的思路。


    为他人而做出变通行为的时候，可以做两件事：一是声明损失：二是提议交易。


    你帮人打卡的时候就可以说： “好啊，我帮你打卡，不过你也别来太晚，领导来了发现人不在，咱俩就都惨了。” 这就是声明损失。


    你也可以提议交易： “好的，对了，明天开会讨论我的方案，记得帮我多说几句好话。”


    变通行为都有交易价值，让对方感受到你为对方冒了风险，目的就达到了。 “绝对的安全”之外都有 “偶尔的变通”，变通会盘活关系，也可能带来进步。


    # ## 进步原则


    人在职场，必须要谋求晋升，不进则退。


    你可能会想， “我做个佛系员工，勤勤恳恳过小日子就可以了” 。这是不行的。我们预习课里提到过非职场和不完全职场，那类工作也许还可能 “过小日子”，典型职场上根本不存在过小日子的可能。职位级别原地踏步，等到变成年高位低的老员工时，你就是裁员会瞄准以及被职场欺凌的对象了。


    进步原则是一个长线原则，必须每天努力，日拱一卒。进步原则不是要你每天都斗赢对手，而是每一天结束时都比前一天的自己有所益。


    有挑战和培训的机会，你要敢于去争取，有提升、获奖机会要积极响应。千万别摆出淡泊名利的姿态，如果领导觉得你不在乎提升机会和收入，你可能会成为最先牺牲的对象。


    # ## 收益原则


    有把控风险的文臣和每天备战的武将还不够，职场王者的灵魂里还需要有一个拿着算盘的商人。职场上要有算账意识，不能单方面付出，要学会维护自己的利益。


    我曾经听到过一个真事，一位著名作家喜欢批判世俗。他有助手，之前就是一位有经验的媒体人。工作几年后，助手希望把薪水从 6000 元加薪到 8000 元。作家的回应是：
    “你这个人怎么这么腐朽！” 助手感到非常惊讶，因为他的其他工作机会收入远比现在高。结果，作家失去了这位得力的助手，助手很快就找到了收入更高、前途也更好的工作。'
