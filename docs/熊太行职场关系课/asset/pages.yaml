- pgno: 95
  md: '具体的做法，我总结了面对基本盘的“四个要”：


    > 比你强的要尊重；


    > 比你弱的要扶植；


    > 和你相当的要盘活；


    > 不学好的要放弃。


    # 首先，比你强的要尊重


    比自己身份高、地位尊、年纪长的基本成员，尊重已经足够，对他们是调低期待。我们容易对有有权势的亲友期待过高，这是不对的。你要明白他们的难处和苦衷，表现出你的实力和潜力，只在关键时刻向他们求助，他们就可能帮你。


    # 第二，比你弱的要扶植


    比自己弱的基本盘成员，一定要至少表现出热情和善意，文化程度低、家庭条件不好的基本盘成员也有他的用处，只要人品可靠，就是有价值的人。


    我在课程《关系攻略》里提到了“职场和亲”这种手段，应该尽早开始培养和自己关系友好的年轻人、子侄辈，帮助他们推荐实习、工作的机会，他们强了会变得更有用。


    # 第三，和你相当的要盘活


    与和你实力相当的基本盘成员相处起来，你可能最是舒服的。但你也可以做更多加分项，比如，介绍不同来源的基本盘相互认识，盘活资源。


    # 第四，不学好的要放弃


    毒瘾、赌瘾、家暴和长期酗酒的人，即使是基本盘成员也要放弃他，不要跟他一起走向毁灭。


    和基本盘成员的相处技巧是，不要讲原则。这个技巧特别适用于求助场景，无论你是求助一方，或者是被求助的一方，都不要谈公司利益、公正、正义这种大道理。


    求助不要羞耻，最好直接说“我想要做什么，您看看能怎么帮我”。很多人会不好意思开口，害怕麻烦别人，那你可能就错过了重要的机会。


    基本盘成员之间的风险，是由提供帮助的一方来把握的，提需求的人可以敞开说自己的想法，但也要认真听取对方的意见。'
  merge: -1
  img_proc: true
- pgno: 96
  md: '如果你是求助的一方，你绝对不要板起面孔说：“对不起，我们有纪律，我作为一个忠诚的公司员工，不能……”这叫官腔，对付的是疏远的人，或者是向对方索要代价的说辞。对基本盘成员绝对不要打官腔。


    不让你讲原则，不是让你没原则，对基本盘成员不要打官腔，不要满口谈原则。正确的做法是把对方和自己放在一个利益共同体当中去谈论：


    “最近查得特别严，好多人都犯错误了，我不能让你俩冒险。别把咱们的事耽误了，这样，我们先走正规流程，然后我也去打听……”这样就会让对方知道，你跟对方是站在一边的。


    # ## 本讲小结


    总结一下，基本盘谈不上强弱，关键在于亲疏，只要是稳定的基本盘，就是好的基本盘。


    你的基本盘成员大多数都不在职场内，但会有千百种触手伸入职场当中。个人能力的提升发生在职场内，但有些功夫要下在职场外。


    下一讲，我会给你讲积累力量的第二讲，如何维护盟友关系，这一讲是第一章里盟友内容的进阶版。下一讲见。


    # ## 思考题


    成年后想扩展自己的基本盘，有几种办法？你可以试着举例。


    # 参考答案


    深造：最好的一种方式，学历教育和非学历教育都能带来很多同学校友。


    婚姻：本人的婚姻，儿女的婚姻，其他亲戚之间的婚姻。


    之前我在《关系攻略》里有一篇《千万不要给人介绍对象》就提到了在计划经济时代，一些领导愿意当媒人，其实就是巩固自己的权力。年纪比较大的亲友，如果再婚，时常能带来很重要的关系。


    加入某些兴趣俱乐部，能收获一些定向的朋友。


    远亲戚的聚会、组织同学会，这两种聚会都可以找回一些关系，重新变得亲近起来。


