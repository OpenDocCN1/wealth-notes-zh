- pgno: 162
  md: '你完全可以跟对方说明白：“这是一个小部门，留您在这里也是屈才。我也跟领导说过了，推荐协调给其他的部门……”客气话多说，说客气话是不要钱的。


    # # 招安对手行动指南


    具体到“招安”这个动作，你还有很多事情需要注意，我归纳了五条原则：


    # ## 第一条：承认先来后到


    越早出来投奔或支持你的人，越看好你。你要对他好一点，哪怕他是你不喜欢的人。这样别人看见了你的态度，就会更愿意投靠你。


    # ## 第二条：要一个投名状


    我在第二讲里提到过投名状，如果领导猜疑你，你可以主动做艰难任务，或者打击领导的敌人，用投名状表现忠诚。现在你是领导，也可以要求下属做这件事。


    《水浒传》里林冲想要入伙梁山，王伦就要求他交一个投名状，要他下山去劫道杀人。投名状是个常见而可靠的招数，战场上经常让降兵降将打先锋。


    你可以给刚招安的人一些艰难，但是能努力做到的任务，看看他的斗志。等到他完成任务，给予他应得的报偿就好了。


    # ## 第三条：不要自己下场打人


    如果迫于压力收下了自己不喜欢的人，千万不要按捺不住，直接去给对方小鞋穿，这会让刚入伙的其他人觉得恐惧。


    其实，当领导的人只要表现出对下属的不满，这个下属很可能会遭到其他同事的欺凌。如果对方主动沟通、表示忠诚的话，你可以在这时保护他，改善他的处境。


    如果对方觉得留下来不合适，你也要制止欺凌，但可以趁机好送他离开。无论如何，都不要参与到对下属的欺凌当中。


    # ## 第四条：边缘化策略


    对那种实在除不掉、赶不走的人，给他最边缘、损害最小的业务，最好让他吃一碗省心茶饭，不要让他重要的位置上危害到全团队。


    # ## 第五条：栽人任何时候都不晚


    栽人最好的时机首先是刚接手团队的时候，其次是现在。


    任何时候你都可以为了团队更健康而栽人。对手术团队来的人经过几个月的考察、辨别，有的人已经成了自己的战斗力，这时候你就可以把没有融入自己团队的累赘去掉。'
