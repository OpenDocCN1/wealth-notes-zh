  img_proc: true
- pgno: 150
  md: '《论语》说，“不患寡而患不均”。有的领导学了这一句，就觉得应该在下属之间均贫富，这样做团队里没有一个人会满意。比过去多拿到利益的人会觉这是我应得的，就得闹起来才有结果；被减少收益的人会觉得我被欺负了，领导对我不公平。


    所以利益矛盾的解决之道，是领导投入更多的资源，在制度上作调整和倾斜，在未来的增长中实现平衡，不要已经把夹到碗里的菜再拨回到锅里。


    如果你是“夹心层领导”，有上级还有下级，利益矛盾会更加复杂。你可能不得不把一些利益优先给大领导的亲友团，这个时候要事先和你团队中的左右手打好招呼，要让团队中的人明白，这是整个部门运转下去的成本和安全保障。


    # 第二种，机会矛盾


    团队内会因为争夺机会而产生矛盾，比如争取同一个客户，或者重要培训、竞赛、评优的机会。


    下属之间健康的竞争能提高团队的凝聚力，不健康的竞争一定会给你带来风险。要想减少下属竞争机会而产生的矛盾，做好这几点是关键：规则统一、长期考察和机会均等。


    规则统一是对所有人一视同仁。


    比如你可以反复强调“不论谁做出过什么成绩，都不能拿灰色收入。这是我们公司不能侵犯的底线，谁犯规谁就离开”。这就是一个明确的表态，你解释规则说得越明白，这类恩怨就会越少。


    长期考察是你要告诉下属，你提拔一个人，不是看一次两次的表现。


    当领导更不要拿一次项目决定性胜负。“你俩谁完成这事谁当副总监”，这种态度就非常儿戏，可以给这次项目的胜利者物质奖励，但要始终把提拔人的权力紧握在自己手中。


    机会均等是不搞简单的平均主义。


    “这次你让他，下次他让你”，这个态度就有问题，确保下属之间有公平的机会就够了。


    # 第三种，责任矛盾


    当了领导之后，你可能会对下属之间互相推卸责任的行为特别厌恶。但如果只是简单地觉得推卸责任的人全都不能用，就太粗暴了。


    有一种人容易犯推卸责任的问题，是因为他特别在意领导的评价，希望自己在领导心中是完美的，遇见批评他立刻就会惊慌失措，所以推卸责任。我称之为“优等生心态”，这就是“关系领域里的未成年人”。


    但这些人的旧时日，也可以成为很好用的下属，其实他们有很高的自尊水平。但是这种人得调教，正确的应对方式是：“别着急说怪谁，跟我说说这件事的前因后果。”'
  merge: -1
  img_proc: true
- pgno: 151
  md: '这句话是降温策略，涉及到追责调查的时候，要先用这句话稳定住下属。你若是充满情绪，那你听到的一定全是推诿，没有真话。


    领导主动去弱化犯错的后果，给员工降温，员工会迅速从压力中解脱，把注意力重新集中在工作上。反过来，如果领导用的是很急躁的领导方式，那下属也会养成先推诿责任的态度。


    # 第四种，私人恩怨


    私人恩怨和之前的矛盾已经有了本质的不同，双方互相针对的是个人。如果你还想用这两个人做你的下属，最好有足够大的办公室，有两个互相不来往的部门。只有对他们进行时空方面的隔离，才能避免出更大的事。


    你也别指望利用两个人的恩怨来制衡团队，团队里有两个人反目成仇，其他人都 会感受到站队的压力。


    矛盾可以解决，恩怨无法结束，所以不要调解。如果双方都没有过错，可以放弃你没有那么急需的一方。如果是严重的纠结，最好是同时放弃双方。


    # 处理下属矛盾的四类错误


    很多领导在处理团队成员时会有一些典型错误，总结起来主要是四类：粉饰太平、迷信内斗、大包大揽和偏心偏爱。


    +   - 第一，粉饰太平。


    有些领导爱说，“这些都不是事儿，别计较了”。把员工的损失说成“不是事儿”，无视了员工的不满，还强调了自己的不在乎，会让员工憎恨你。


    +   - 第二，迷信内斗。


    别指望你能操控内斗。


    汉武帝是个领导力极强的皇帝，他也曾经相信自己能把卫青和李广两个气质完全不 合的人管在一起，结果非常惨烈。


    李广对大将军卫青安排的任务不满，被追责的时候自杀，李广的儿子砍伤卫青，卫青的外甥霍去病又射死了李广的儿子，酿成了惊人的官场惨案。汉武帝这么厉害的领导都无法驾驭内斗，普通人最好就不要玩火了。


    ![](img/463ba23747f3bc168dba9e89f7a31f14_151_0.png)'
  merge: -1
  img_proc: true
- pgno: 152
  md: '+   - 第三，大包大揽。


    两个下属内斗闹情绪，领导千万不要张嘴就说：“别争了，这事我来！”自己把活儿干了是不对的，要告诉下属这个逻辑，“有意见可以提，闹情绪不干活，就是跟我做领导的过不去了”。


    +   - 第四，偏心偏爱。


    人难免会偏心，有的领导偏心老乡、校友，还有人偏心笨蛋，唐僧看猪八戒那个笨样，就不让孙悟空对他太苛刻。


    带队伍，应该压抑你的个人偏好。你的偏心凌驾于公司的章程之上，那团队就会开始争宠，变成后宫了，带一堆马屁精是没法前进的。


    # # 调和矛盾的行动指南


    按照处理矛盾的时间顺序，我给你准备了十六个字的指南：


    制定规则、发现情况、直言不讳、顺势而为。


    +   - 第一，制定规则。


    矛盾发生之前就应该制定规则。


    如果你是一个企业的管理者，要给大家分发印制好的员工手册，把员工的行为规范重点写下来。如果你是一个部门的负责人，就要多通过口头上的强调来订立规矩。


    如果下属起冲突，就要尽快固定下来应对这种局面的规则，用案例来断新的案子。


    +   - 第二，发现情况。


    矛盾出现的时候，掌握更多的情报才能让你知道怎么处理。你要用好耳目睹舌类的下属。耳目睹舌不是奸臣，让忠诚寡言的人多向你汇报下面的动向，你能掌握更全面的信息。


    +   - 第三，直言不讳。


    处理矛盾的时候，跟下属说话可以客气但是不要太弯弯路，特别是两个下属间的利益之争，私下沟通的时候可以说得更直接、更赤裸。你回避谈利益，下属就更不敢谈，越来说去也谈不到要点上。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '+   第四，顺势而为。


    宣布最后处置时，你尽量不要剥夺一方已有的东西。


    剥夺一个人到手的东西会触发敌对情绪，也会增加员工的挫败感。这个人要么恨你，要么可能变得颓废，这都不是我们想见的。最好是承认现状，杜绝冲突发生的可能。


    你可以从发展的角度来解决问题，帮助对方从构筑职场安全的角度来认识问题。不要苛求下属摆“高姿态”，而是告诉他：“你的人和工作都很宝贵，不要让自己冒险，我会帮你排除职场上的隐患。”


    # 本讲小结


    总结一下，面对下属的矛盾，很多人是回避的态度，但如果你肯承认矛盾，愿意和下属谈论矛盾，你已经胜过了大多数的领导。


    记住，做一个决策之前，要考虑下属的安全、进步和收益，让他们安心。


    下一讲我会给你讲带队伍之后，如何处理和过去盟友的关系，我们下一讲见。


    # 思考题


    你的两个下属发生了争吵，你要求两个人都冷静一下。其中一位私下找到你，告诉你另一位曾经在背后讽刺挖苦你能力不足，听完之后，你会如何行动呢？


    # 参考答案


    不能把这个报告看做是一个可行的证据。尤其是这个场景可能发生在几年前的话，更应该谨慎。


    此外，要谨慎去找在场的第三人核实。第三人的人品可靠的时候还好，如果第三人明白了有一个人的命运握在自己手里，他可能会按照对自己最有利的方式去处理此事。


    对这位举报者表示“知道了”就已经足够，不要多说一个字。'
