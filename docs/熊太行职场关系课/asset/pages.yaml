  md: '在跟被裁的人谈过之后，你应该尽快跟他同批来的人通气：“我准备裁掉谁了，不是因为他是从那个部门过来的，而是他这几个月没有发挥出实力。我希望你能够理解我，支持我，像你这样努力的同事，我是非常看重的。”分化他们之间可能的联系，同时防止被裁掉的人向过去一起来的人散布谣言。


    # 本讲小结


    总结一下，这一讲我们讲了如何招安对手，吸收前对手的人，只挑对自己有用的。


    接管新团队，要准备好自己的心腹人一起带过去。至于前对手本人，最好不留。遵循这些原则把工作做到位，你就可以万无一失。


    在这一讲快结束的时候，我们还提到了裁人，裁人是你职场上一个重要的里程碑，具体怎么裁，我下一讲重点给你讲。下一讲见。


    # 思考题


    你的对手成功上位，刚刚成了你的领导，他言语客气有礼貌，但明确表示自己不愿意留你，你的正确态度是：


    +   - A. 跟他大吵一 架，坚决留下来做钉子户；

    - B. 跟他大吵一 架，然后愤然辞职；

    - C. 串联那些同样感受到危机的同事，联名信大字报都用起来，让他根本带不成队伍；

    - D. 表示理解对方的态度，愿意离开，但同时希望对方在公司内部推荐自己，支持自己去另外一个分公司任职。


    # 参考答案


    D 是一个很好的做法。


    对手在送神、清理的时候，可以用干净爽快的离开来进行交易。


