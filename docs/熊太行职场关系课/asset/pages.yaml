    有人一定急着问了，那鸽子怎么办呢？我们是不是注定沦为鹰的口中食物呢？


    这次我们来谈谈鸽派人的生存攻略。


    还是回到鹰派和鸽派的大五（Big Five）人格特质上：


    | | 鹰派 | 鸽派 |

    | --- | --- | --- |

    | 开放性 | 偏好奇 | 偏封闭 |

    | 责任感 | 倾向于冲动 | 比较坚定和可靠 |

    | 外倾性 | 自信、大胆善于社交 | 偏被动 |

