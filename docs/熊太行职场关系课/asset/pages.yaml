- pgno: 34
  md: '汉高祖刘邦评论他能够打败项羽的原因，就提到了这一点，刘邦对人态度可能冷淡或者粗暴，但是会大大方方地封自己的盟友做诸侯王。


    项羽看见别人生病会流泪，但到了要给盟友封王、给他们好处的时候，却经常犹豫甚至赖账，许多盟友就这样成了他的敌人。所以，这件事情上，不要用集体利益、大局观做借口，谁帮了你，就要对他好！


    # ## 本讲小结


    盟友关系是要用心维护的重关系，你要有这样三个意识：


    +   1. 对盟友不要期待过高，也不要任他提要求，被他绑架。

    2. 结盟关系会在达到目标之后自然结束，所以不要怨恨。

    3. 许诺给盟友的利益，一定要全力实现，不要食言。


    其实，一个人在职场上，时间和精力可能只够维护两三位重要的盟友。但大多支持你的人，是对你抱有善意的中立同事。


    # ## 思考题


    我给你留一个思考题：


    你的盟友有私事相求，你恰好拥有这方面的资源，难度和风险都不大，你的做法是：


    +   A. 欣然答应，不做任何附加条件。


    B. 让他让渡一些自己的利益来跟你换。


    C. 表现出特别为难的样子，看看他愿意不愿意贿赂一下你。


    D. 同事之间不要那么多公司外的事，坚决拒绝。


    # ### 参考答案


    选 B 没有错，不过我还是建议你选 A。


    选 A 不能就那么简单了，要跟对方解释清楚，“你的运气真好，这事儿不好办，偏偏咱们运气太好，什么都赶上了，这事儿就成了。”


    现场要对方拿点什么来看，就容易伤害到自己的“吃相”。


    “跟他要点啥”适合什么场景呢？适合那种一再麻烦你的人。


