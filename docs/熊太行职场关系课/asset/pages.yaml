- pgno: 166
  md: '被解约的员工本身压力极大，很容易因为情绪不稳定而出事。同时团队内部也会被解约员工所惊扰，其他员工会积极打听一切相关的细节，担心自己有类似的麻烦。


    如果你见到某个下属就压抑不住自己的怒火，记得回到第六讲重温一下情绪控制。


    # ## 第二个错误：因私人恩怨解约


    在作出解约的决定之前，记得再问问自己，有没有因为个人恩怨辞退这个下属？比如你可以问自己：


    > “这个决定里，我有情绪吗？”


    > “这位员工是工作没做好？还是因为跟我说话态度不好？”


    > “有没有可能是误会呢？还是因为我嫉妒呢？”


    领导确实会嫉妒下属，我在《关系攻略》中提到过，嫉妒有成就嫉妒和性嫉妒。职场上这两种嫉妒都会出现，如果员工能力出众，让领导觉得冒犯，确实可能会遭到成就嫉妒；而对长得好看，或者说话有风情的员工，也会产生性嫉妒。


    决定解约之前拷问一下自己，对下属和自己都好。你可能会说，都已经要决定了，还要核实这件事吗？


    要。就像护士给病人输液，即使天天见这个病人，打针前她也要跟病人核实名字，这就是一道保险阀，许多失误往往是在最后一关挽救的。


    # ## 第三个错误是举棋不定


    有位 D 同学曾经给我留言，提到了他辞退下属的一段经历：


    > “这个人工作总是敷衍了事，年纪轻轻跟退休了一样，而且爱说扫兴的话，特别影响其他同事的工作心情。”


    > “我想把他开掉，但是担心他没有工资会生活不下去，也担心他会恨我。其他员工看到我辞退人，是不是也不好？”


    这就是典型的举棋不定，其实前面的几个缺点，已经足够让这个下属被淘汰了。但 D 同学又想了太多的细枝末节，冲淡了“这个人不能胜任工作”这个主要问题。


    其他情况也会让一些领导举棋不定，比如准备从两三个人里挑出一个解约。


    “作辞退决定最好的办法是找个集中的时间，把一个决定的优缺点都列出来，觉得利大于弊，就作出决定。而且不要再去重新思考，不要反复纠结。”'
