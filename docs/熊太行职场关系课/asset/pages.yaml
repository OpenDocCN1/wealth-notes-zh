  md: '# 发刊词 | 带上军师去战斗


    你好，我是熊太行，欢迎加入我的《职场关系课》。


    我是一个人际关系研究者，专长是洞察和理解各种人际事件之下的人性和利害关系。


    你可能听过我在得到开设过的课程《关系攻略》。我用了一整年的时间，陪着 15 万位得到用户，详细地梳理了他们身处社会这个大丛林中，可能遭遇到、旁观到的二百多种人际关系，包括家庭关系、情感关系、职场关系，给他们提供各类复杂场景下的应对策略。


    这一年，围绕家庭关系、情感关系、职场关系，用户们也向我提出了非常多他们关心、焦虑的问题。这些问题都很重要，也各有各的特殊性，但在当中，我意识到重要而又最紧急的，大多是职场关系问题。


    所以，在普遍适用的《关系攻略》课程结束后，我和得到团队都认为，应该抓紧时间把这门《职场关系课》做出来，让它尽早帮你。


    为什么职场关系重要又紧急？因为跟其它几个领域相比，职场，是一个充分竞争的领域。职场上，聪明、强大的候选者太多了，雇主和团队换掉一个难以合作的雇员，可比找这个傻雇员教好要容易得多。


    你可能觉得自己不会搞关系，你也可能不屑于搞关系，或者你觉得搞关系压根不重要，但这些都不是成熟职场人的处世之道。这门课我就是要帮你破除对关系理解的误区，手把手教你怎么建设好你的职场关系。


    # 第一大误区：认为关系不重要，靠实力就行


    “职场上关系有那么重要吗？我在职场上一直都是拼实力的。”这是典型的“关系无用论”。与这种观点相反的另一个极端是“关系决定论”，认为关系是职场上的第一生产力，总抱怨别人“说到底还是要靠关系才能赢的”。


    事实上，这两种观点都不对。


    职场上的硬实力，就像一个大侠的身体素质，它是你下场竞争的基础，我们都是依靠硬实力来在职场上立足的。但是职场上的人际关系，是你跟人比武时的招数和战术。没有招数乱打，再强壮的人，不仅有击败对手的可能，还难逃挨揍的命运。


    职场上关系不是没用，也不能决定一切，正确的认识是，关系是一个成熟职场人的必备技能。你最佳的策略一定是两手抓：一手打造出色的个人能力，一手修炼处理职场关系的段位，缺一不可。


    当然，如果你把关系理解成突破法律和伦理底线的做法，那也会死得很难看。我们要做的是，在有限的资源下，寻找破局、造势的最优解法。'
