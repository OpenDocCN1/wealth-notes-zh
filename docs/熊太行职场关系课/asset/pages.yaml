- pgno: 139
  md: '> 后来，我干脆宣布退出了竞聘。但我心里特别憋屈，跟几个同事说我的苦闷，真想找领导吵一架，我该怎么办？


    我来说说 C 同学犯的四个错误：


    +   *   第一个错误：坚持决斗，成了搅局者：


    内定意味着竞争的结束。口不择言，发誓要继续赢，你就成了搅局者。原本对你有三分愧疚的领导，一下于就会变成维护秩序的强大势力，这会让你陷入危险之中。


    当然，这个公司的提拔方式可能确实有问题，如果不愿意继续忍受，可以考虑换一份工作。


    +   *   第二个错误：不分敌友，迁怒于传信者：


    领导来告诉 C 同学，资历浅，别太太重，这些话非常委婉，他不能直接告诉你说，这个位置已经内定了。


    这种竞聘是一群人作决定，不是领导一个人说了算的。


    领导早点告诉你内定这件事，有三个意义：


    +   1. 他对你实力的认可；

    2. 他希望照顾你的感受；

    3. 他希望你把注意力放在日常出成绩上，放在你们共同的事业上。


    所以告诉你真相的领导不是你的敌人，把责任推给他是对他的不公平。


    +   *   第三个错误：阴阴怪气，做憤世嫉俗者：


    抱怨领导处事不公不能解决任何问题。这类抱怨第一个误伤的就是直系领导，如果你再捎上抱怨大领导，就很容易给自己和全部门惹麻烦。


    你要特别当心那些明里暗里引着你领导坏话的人，他很有可能不是为你打抱不平，而是就等着传你的话。


    +   *   第四个错误：高调退出，成了抢戏者。


    高调宣布退出，是不给领导们台阶下。就算你没有怨恨的心思，弃权退出也很容易被领导当作是抗议和不满。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 转变心态，把逆境当舞台


    那面对内定这种不公平的竞争情况，我们应该如何应对呢？


    你要先确认所谓内定局面的真伪。有人会传播自己已经获胜的消息，让对方知难而退，这是一种比较低层次的斗争技巧，不过有吋候确实有效。搞清楚最好的办法就是去问你的领导：“这次的竞争，您觉得局面如何，我有机会吗？”


    大多数内定，你的领导都会有所耳闻。“只要尽力了，问心无愧就好。”“在我心里你是最优秀的。”“本职工作最重要，以后这样的机会还会有很多。”如果你听到这些表达，那人选多半已经定了。


    如果确定了真的是内定局面，你也不要完全灰心，别忘了竞聘过程是聚集了全公司关注的大仗，公司所有人都会关注这个过程。赢家只有一个，但舞台是所有人的。内定局面出现，说明现在不是你的收获期，但却是很好的播种期。


    你应该尊重公司的安排，展示你的冷静和靠谱，让领导看到你的识大体。为了避免被贴上搅局者的标签，可以适度收敛锋芒，但这不妨碍好好梳理你的经验和想法，扎扎实实做汇报，借这个机会向全公司人展示你的实力。这是最高效地吸引中立同事对你好感的时候，而且也会在领导心里加分。


    我还有一个朋友过去在公司实力出众，但和公司领导不对付，领导想把他调到效益差的部门，决定利用公开直播竞聘的方式，内定结果排挤他。


    他当时已经决定离开，接到这个羞辱活动之后，思虑再三仍然参加了，而且漂漂亮亮地做了演讲。好多平时不熟悉的同事，都因为这次演讲记住了他。后来他离职创业的第一个机会，是平时不熟悉的同事给他的，就是因为他公开演讲的出色表现。


    千万不要小看内定的局面，转化思路，它就是你的舞台。


    # 竞争失败的四条行动建议


    内定是竞争失败局面里，最让你难受的一种，而其他竞争失败的局面临同样难熬。如何面对竞争失败的情况？


    我给你四条行动建议，让你在竞争失败的情况中尽快调整好自己：


    +   1. 接受现实。

    2. 摆正心思。

    3. 重新振作。

    4. 等待机会。'
