  img_proc: true
- pgno: 121
  md: '首先说成绩，竞争一定会有胜负，所以成绩仍然是至关重要的。成绩是你进入“大名单”的凭证，获得竞争资格的必要条件。


    其次是人气，就是你的人缘、关系。之前我讲了几种职场上的重要关系，对手、盟友、中立同事和领导。谁看好你？谁支持你？这些都可能会影响最后的结果。怎么在竞争中维护人气，我会在后面的章节具体展开给你讲。


    最后一个词很引人注目，是一个特别有中国特色的词：吃相。吃相的含义非常丰富，意味着职场竞争的风度、节操和美感。我们说一个人“吃相难看”，就说明这个人喜欢玩小聪明，做事不规矩，没有节操。如果一个人在职场
    上被打上了吃相难看的标签，别人在和他合作的时候就都会有所顾虑。


    这三点把握好了，运用的时候你要记得“扬长避短”。


    如果你是鸽派的职场人，日常阶段会是你的舒适区，有的时候你可能会内心抗拒打 仗，但这就很容易吃亏。如果你是一个典型的鸽派，那就应该要求自己接受挑战，准备竞争。


    而鹰派的职场人善于在每次竞争中都全力以赴，但你如果每次都表现得太好胜，就容易得罪人，甚至成为许多人的眼中钉、肉中刺。所以平时不妨节约力量，也多提醒自己，展现合作性也很重要，不要好胜心太强。


    我要提醒你一点，不管发生什么事，你都不要把竞赛当作赌博，把小仗当作大仗来打。拉领导进来站台讲理、一决胜负，这是非常孩子气的做法，对公司也没有任何好处。


    更不要寄希望于自己 在比赛中超水平发挥，这是极小概率事件。这种平时准备不足，依赖临场发挥的赌博行为，会让你动作失衡、心态失衡。要记住，没有任何一个人能够次次都走运。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '# 本讲小结


    总结一下，在竞争中，你要经常提醒自己：


    职场不是个修罗场，职场只是一个考场。对待竞争要有长期的眼光，不要只顾着自己一时情绪的宣泄不顾吃相，也不要提到竞争就想着要逃避，用积累和展示实力的态度去看待竞争，你会收获更多的可能性。


    下一讲，我会给你讲解打小仗的正确操作方式，下一讲见。


    ![](img/463ba23747f3bc168dba9e89f7a31f14_122_0.png)


    # 思考题


    如果你遇到一位同事，在合作中喜欢占便宜、抢功，吃相非常难看。但他即将和你有一次小规模合作，看他的意思很愿意和你一组，你准备如何答复他？


    # 参考答案


    > 第一种思路：答应合作，但是把分工说清楚，关于分工的事情也邮件同步给领导，避免对方搅功劳和推卸责任。


    > 第二种思路：婉言拒绝和对方同组的要求，从技术上找到借口，告诉对方自己和别的同事已经达成组合了。


    > 这两种思路都是可以的，无论选择哪条路，都不能给对方拆台挖坑，哪怕对方是一个烂人也不要。'
