- pgno: 107
  md: '# ## 19 清理门户：剔除害群之马


    这一章的前三讲，我介绍了基本盘、长期盟友和短期联手对象三种人。这三类人和你的亲疏远近不同，其实他们就构成了你的“阵营”。如果你是带队伍的领导，这个阵营里还可能包括你的下属。基本盘是地基，长期盟友是主结构，短期联手对象是楼顶的小阁楼，这三讲是教你如何做加法。


    这一讲，我们做减法，讲怎么从阵营里剔除害群之马。


    我在《关系攻略》也讲过人际交往中的减法攻略。为什么要专门拿出一讲来谈“阵营”里的减法？


    因为你在职场之上，对手随时都在盯着你的动向。如果你的阵营当中有危害你的安全、进步和收益的成员，本来就会给你的阵营造成伤害，还可能引发成员的彼此猜忌，甚至对手、敌人的内外夹攻，会有“牵一发而动全身”的影响。


    在你的阵营中做好减法，就能规避风险，让你更加安全，阵营更加团结。对自己的阵营如果不清理，你可能会被害群之马背后下刀，或者被他的愚蠢所连累，最终变得四面树敌、大厦崩塌。


    ![](img/463ba23747f3bc168dba9e89f7a31f14_107_0.png)


    # ### 三类害群之马


    害群之马会如何伤害你呢？


    害群之马在“群”里，他就是你阵营中的一员。依据职场三原则，害群之马也分三种：危害安全的、妨害进步的和侵吞收益的。


    **第一种，威胁阵营安全的害群之马**


    这个成员会因为愚昧或私心在职场上做高风险行为，直接危害你和盟友的安全。常见的危害行为包括：


    +   1. 违法违纪，比如贪污、索贿受贿。

    2. 冒犯他人，在公司里大规模树敌，甚至跟自己阵营的人起冲突。

    3. 泄密，把自己公司、部门的事情说给对手阵营的人听，把涉密的事发在社交媒体上，甚至匿名爆料。

    4. 撒谎，不同步正确消息。'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# 第二种，威胁阵营进步的害群之马


    你和盟友想要往前走，这个人会因为能力不足或目光短浅，坏事或者拖后腿。比较典型的有两种表现：


    +   • 第一种是嫉妒。因为嫉妒你，或者你们共同盟友的成就而拆台。

    • 第二种是逞能。这种人表现欲过强，渴望获得领导的认可，为此他们很容易做出伤害盟友的事。


    # 第三种，威胁阵营收益的害群之马


    有一样人要特别留神，他喜欢争夺更多的利益。他对你的索取比其他盟友要多，而且总是不满意。


    别觉得满足了他就行了，这种羊骀太多的人不会被喂饱的。如果对这种人给予太多让步，会带来新问题——其他盟友、下属会怎么想呢？所以，破坏阵营内部的利益分配规则，会导致阵营的瓦解，这种人一定要防范。


    需要注意的是，害群之马不是你的敌人，所以绝对不要把他推向敌人和对手。害群之马在大多数时候都是有点的人，有些时候他只是不合适，或者跟你不对脾气。


    # 对待害群之马的三大错误


    很多人在对待害群之马的时候，会犯一些常见错误。有位 K 同学给我留言：


    > 公司来了个新人，领导让我带他。这小子自视甚高，我教他工作的事他翻白眼。


    最近我在工作上出了点小差错，领导训我的时候，这人竟然在旁边添油加醋。他做出一点成绩还邀功，现在的年轻人都是这样的吗？


    我一怒之下就把这个傻徒弟痛骂了一顿，最近他消停多了，不过我一直还很担心，是真改了，还是隐藏起来了？


    K 同学接到的任务，是训练新人，让他能够处理工作。这个新人是一个中立同事，最多是个短期联手对象的级别。


    但是 K 是怎么定位这个年轻人的呢？“傻徒弟。”而职场上的师徒是最好的上下级关系，这是接近基本盘的亲近关系。把一个狂妄的人随便认作自己的徒弟，祸事就容易惹到自己身上了。'
