- pgno: 112
  md: '# 20 做忍者：布局时保持低调


    上一讲我介绍了如何从团队中剔除掉害群之马，这一讲我要讲如何在布局力量时保持低调。


    梳理过自己的基本盘，维护好了长期盟友，挑选合适的联手对象，再剔除掉不恰当的阵营成员，你在职场上的布阵已经出了效果。你的力量从涓涓细流，到湍急的溪水，最终会成为大江大河。


    但在这个过程中，一定要记得两个字：低调。低调不是教你怂，我是要你避开不必要的挑战和损耗。低调有这么重要吗，要专门拿一讲来讲？就是因为现实中大量不低调的人吃了苦、吃了亏，惹了大麻烦。


    强调“低调”就是说，你在职场上要一直“低调”吗？当然不是。


    职场上，根据你力量使用状况的不同，可以分为“布局”和“发力”两个阶段。布局阶段要全力积累优质的人际关系，发力阶段就全力争取胜利。我们说的低调，就是布局的时候要低调。


    竞争、评优这些事属于发力阶段，这个时候千万别含糊，要把实力高调发挥出来就好。基层员工也会有发力的机会，比如技能竞赛、运动会，都是需要表现精气神儿出来、需要高调的阶段。


    而在布局力量的阶段，你就该低调了。哪些事要低调呢？你可能要和一系列的人互动，开展工作时间之外的社交活动。也许是和隔壁部门的对接人喝酒，也许是和部门里的两三个同事星期一一起吃饭，甚至陪着领导爬山、钓鱼。


    这些事都应该捂得紧紧的，不随便往外嚷嚷，更不要晒朋友圈。你可别觉得自己的一切都堂堂正正，因为你的布局活动能够反映出你的战略意图。聪明的对手看看你跟谁吃饭，跟谁喝咖啡，给什么人评论或者点赞，就可以把你的战略意图推测一个大概。


    无论身边的人是敌是友，有条规律都适用：让自己没那么容易被摸透，你就会更加安全；尽可能摸透身边的人，你就会更主动。


    当然，你要把“低调”和“沉默”以及“小透明”区分开。


    沉默是话少，但低调不是话少，只是在特定的场景下话少。也别觉得低调会让你变成人微言轻的“小透明”，小透明是实力不足，被迫悄然无息。低调是实力可观，尽可能不引人注目。


    经营力量时的低调，不是低实力，而在于低攻击性。在你的对手开始警惕、防备甚至围剿你之前，低调能帮你快速取得成绩，比如获得了越来越多的授权，结交更有力的盟友，中立同事里对你有好感的也越来越多了。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '同时，不随便说人坏话，不去排挤和孤立同事，不怼领导，不起无谓的冲突，还有边界感和嘴严，都会让你的攻击性逐渐变弱。你要一边长本事，把力量长上去；一边尽可能保持低攻击性，把盟友留下来。


    # # 低调的常见错误


    我一开始就说了，不低调会犯大错，我来给你讲一个典型的案例。有位 A 同学给我留过言：


    > 团队里我的学历最高，工作也努力。领导很欣赏我，两个重要项目都点名给了，开会时还跟两个同事说让他们多支持配合。


    但是我真正推进的时候，需要同事抽时间和我一起参与项目，他们都不积极。我觉得他们缺乏最基本的职业精神，就说了几句重话，他们转头就跟领导告状了。领导反而建议我要考虑同事们的感受……


    # 这就是第一类不低调的错误：装老大


    事实上，越是身居高位的领导，说话越是和和气气。好多上级对下级说话都用“您”，权威和魅力都让他不需要表现出控制狂的姿态。往往是临时的牵头人，分组干活的负责人，容易因为拿到了临时授权而指手画脚。


    A 应该是第一次协调几个人的工作，这是提升的前兆。队友工作不够积极，就要想办法调动他们的积极性。鼓励、申请奖金，让他们用愉悦、积极的心情一起奋斗，这些方法都可以，但抖威风是不行的。管理的第一步，绝对不是装老大和发脾气。


    A 同学，还提到过自己的困扰：


    > 因为我是硕士毕业，业务能力比其他人强，最近完成了一个大项目，大领导都亲口称赞过。我很愿意帮新来的同事，经常提提建议，指出他们哪些地方做得不对。结果发现我的人缘好像变差了，有人私下说我坏话。他们是嫉妒我吗？


    # 这就是第二类不低调的错误：装老师


    之前我给你讲过，师徒关系是最好的上下级关系。但 A 不是领导，因为其他同事年轻、资历浅，就自动代入老师身份指手画脚是非常危险的。


    最坏的情况是：在领导眼中，你在培养自己的势力范围；在其他同事眼中，你是一个争抢年轻人的安人；在被你帮助的年轻同事眼中，你是一个热心得可能让对方戒备的人。


    学位或者领导的青睐都无法保证你传授内容的正确，一旦有什么错误，对方吃了亏，就可能怨恨你，如果你去贸然去指出同事的错误就更加无礼了。


    如果你遏制不住自己好为人师的冲动，最好的办法是考取行业内的培训师，或者接着领导“带新人”的任务，先接任务，再做老师。'
