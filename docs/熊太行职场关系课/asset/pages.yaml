- pgno: 135
  md: '清理战场阶段最大的一个难题：我们真的能宽恕、原谅、留下对手吗？


    这是最微妙的关系，到底要不要留对手在自己的团队当中，长期以来都存在争议。赞成留的人可能会说，领导要有胸怀，能用人，格局才会大。不赞成的人，更是出于安全考虑。


    我的答案是：可以原谅，但是有条件。


    首先，邀约前对手停战。


    记仇完全没有必要，竞争结束就可以直接喊停了。都是同事，仗打完了，现在我对你抱有善意，希望你也一样。如果你想要对方加入自己的队伍，一定要给这样的机会。先示好的人通常也能被大家看作爱才、有胸怀。


    其次，对手表示愿意服从。


    这一点很关键，别上来就表示有胸怀，有些人并不值得你这样当好人。连口头上都不敢敷衍你，那不是什么有骨气，那叫不懂事，这种人赶紧送走，不要留了。


    还有一点，不要留下过去一整个派系的人，要把他们打散。仍然希望保留自己小团队、独立王国的人，一定是诈降，要趁早处理掉。


    # 第四，老领导，不仅是感激


    职场上最重要的关系是你和领导的关系，但是当你走上领导岗位，前任领导和你的关系就变得越来越微妙。


    第一种情况是老领导也同步提升。


    这种关系最好，如果你们是师徒式上下级关系，那简直就是你们这个门派的一个大胜。


    第二种情况是和老领导成为平级。


    这种关系要尽快表达自己的尊重。中国人最重年纪资历，你跟领导平级可能会让他心里有想法。这个时候如果你尽快表达对其经验的尊重，和昔日栽培的感激，不仅能够减少这种厌恶感，还能防备有坏人挑拨你们的关系。


    第三种情况是超越老领导。


    某个人可能以前做过你的领导，在你被提拔之后你成了他的上级，这个时候就要认真跟对方谈一下，叙叙旧，希望对方支持、辅佐。如果对方在你之下觉得屈辱，赶紧送走，不要再留。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# 第五，新手下，要用人不疑


    “用人不疑”这个词，很多人都做不到。但是你一定要记得前半句：“疑人不用”。


    接手新团队的时候，可能会收到很多来源不一，各有帮助的人。如果你觉得谁有问题，他就一定有问题，趁早不留。


    倒不是因为你未卜先知，而是如果你对一个人手有强烈的厌恶感，沟通中你可能会带着情绪，年深日久，他对你的不满会更加强烈。所以，如果你怀疑一个人，最好就不要用，刚接手的时候淘汰人是最好的时机。


    筛选新来的人非常重要，甚至是性命攸关的事情。


    三国年间，蜀汉的大将军费祎是诸葛亮钦定的接班人，也是非常优秀的领导。但是，他招了一个魏国的降将在自己的团队里，还非常信任这个人，但是他没有做好甄别和筛选，结果，这个降将在酒席上刺杀了费祎。一代大将就因为用了可疑的人，就这么死了，非常可惜。


    当然，过了这一拨筛选之后，你就要认认真真地去用他、信任他。如果你有权限开人，就把自己的团队好好整理一下。如果你有资源招人，用好招人的名额。不要让别人，尤其是对手来过于新人，要确保招进来的人都是自己的。


    清理战场阶段，是大战之后的回访、复盘工作，看上去风轻云淡，其实静水流深。你要把握住两句话：“把敌人逐出城外。留下的都是对我友善的人。”


    ![](img/463ba23747f3bc168dba9e89f7a31f14_136_0.png)'
