  md: '具体怎么前置情绪管理呢？还是用N先生的经历来解释一下。领导开始批评N先生，N先生应该做的不是头皮一炸，去想“我搞砸了”，而是应该做以下三点：


    # 第一，听话音


    不要单纯接收领导话里发泄的情绪，领导的批评也分三部分：


    比如：


    “你的进度太慢了”，这是在复述事实；


    领导说“这样我们会被兄弟院校超过”，这是在讲述道理；


    领导责怪你“你根本没有认真做事”，这实际上就是在发泄情绪。


    把领导的批评拆解一遍，就能引导你把关注点放到应该关注的地方去，而不是陷入情绪不能自拔。


    # 第二，传圣旨


    N本身是一个副职、带头人的角色，他有自己的手下和研究生，他可以把领导的诉求理性地传达出去。比如，“领导给大家提的要求，大家都听到了吧。”就是积极的和理性的表达。


    这不是教你推锅给别人，而是一个解释和传达领导意图的过程。当你传达给别人时，你就能卸下话里的情绪，把有价值的信息提炼出来。“领导不是在骂人，而是希望我们更好。”这不仅仅是自我安慰的文字游戏，更有建设性的信息传达。


    # 第三，做笔记


    挨批评的时候，往往很尴尬。我问N先生，这时候你目光看哪呢？他说会在领导和桌面之间徘徊。这还不错，但不是最好的选择。这个时候盯着领导看，很可能被看作“不服气”，情绪会上脸，没有受过好的表演训练，想控制非常难。


    这个时候盯着桌面、地板，会像一个犯错的小学生，会被别的同事或者你的下属看成软弱。


    正确的做法是用纸笔做记录，既能缓解尴尬，也能把正在气头上的领导，拉回到理性的讨论中。比如，在领导提及有些重要的概念、举例的时候，你甚至请教他某个词的具体写法。


    但别用电脑，不然领导会觉得你心不在焉。


    这三点做到了，你就做到了情绪管理的前置，你的所有语言输出，就都是深思熟虑的对策，而不是简单不可控的情绪。你的情绪管理，就比别人高明。'
