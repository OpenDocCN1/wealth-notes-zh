- pgno: 52
  md: '# 向人求助的行动建议


    要想让别人心甘情愿地帮你，你要注意以下几点：选对人、选场合、选时机、避免中间人和多念好。


    # 第一， 选对人， 就是你要选择向谁求助


    在职场上，面对困境我们可以选择求助的人往往不止一个。


    以前我就遇到过有同学的留言：


    > 我要休假，手上的工作可能要拜托给同事，我是应该托给新来不久业务不熟悉，但是好说话的同事呢？还是应该请托刻薄严厉资深同事呢？


    这就是一个选择求助对象的场景，在这种场景之下，你要重温一下我们的职场基本三原则。


    安全原则高于一切，一个不熟悉业务的新同事如果工作失误，烂摊子要你来收拾，新同事也会被你连累。


    # 第二， 选场合


    除非破冰类的求助，不然，尽量采用一对一的沟通。一对一沟通，方便对方拒绝，他人在场的场合会给被求助者压力。


    最糟糕的一种求助，就是当着共同领导的面开口用大道理去压对方。这种绑架式的帮助行为，可能带来深深的怨恨，如果你需要用这种办法，一定要赶紧给对方一些善意的表示，越客气越好。


    # 第三， 选时机


    如果确定一件事是自己无法摆平的，越早求助越好。一方面早开口别人帮你更容易，另一方面早点求助，大家一起商量怎么办，这是一种信任的表示。但最后关头再去抱别人大腿求助，就是在为难别人。既然最后都要求助，赶早别赶晚。


    # 第四， 避免中间人


    生活中托不认识的人办事、帮忙，一般都会麻烦中间人，但在职场上不要找中间人。如果跟对方不熟，又求到了对方，就说明对方非常重要。与其托别人去开口，不如趁着这次就多和对方接触，不要错过大好机会。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# 第五，多念好


    只要同事光明正大帮了你，就要多提这件事，称赞对方的侠义行为，哪怕日后成了对手。在这里也要强调一点，帮忙的人，没有真正不求回报的。如果你不能当面称赞对方，那就逢年过节把感激的话多说一说。帮你的人以后一定还会再帮你，因为你的成就里有他的贡献。


    # 别人向你求助如何应对


    职场上遇到同事求助，还是要分情况：


    +   - 首先，破冰式求助一律帮。

    - 其次，选票式求助，考虑三件事：你的机会大不大，他的开价好不好，这人是不是一个懂得尊重别人的人。


    一些日常求助比较难把握，不过我给你总结了“四个不帮”。


    有个朋友跟我提到他们公司的一位同事，求人特别得罪人，你听听她是怎么说的：


    你们部门某某有视频网站的会员，你给她说借给我一下，我想看最新的电视剧。


    对方刚刚露难色，这个同事立马说，她上回借给别人了，一定能借给我的。


    看你跟她熟，让你跟她说一声，你看你一百个不乐意，算了不求你了。


    这就属于最差的求助者，犯齐了“四个不帮”：


    # 第一，不划算的，不帮


    这个人贪图蝇头小利，一个月的视频会员也不过十几块钱，而你如果要帮她这个忙，需要解释半小时，她觉得你的时间不值钱。


    # 第二，二手的忙，不帮


    你要再去求别人、搭人情去办事，这个忙就没必要帮。


    # 第三，比价，不帮


    “她都借给那谁了，也会借我”，说这话的人不要帮。这种人是把人际关系看作菜市场卖白菜。就好像在说，你都四毛钱卖给她了，也得四毛钱卖给我！这样去比价，只会让对方感到厌恶。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 第四，被拒后说刻薄话的，不帮


    对方不帮忙可能有自己的苦衷，但求助不被答应就说刻薄话，这种人教养极差，而且以自我为中心，可以对她客气，但不要再帮她的忙了。


    帮忙的真相就是：你最应该关注求助的人，他的人格或者脑子有没有问题。你要求助的时候也一样，表达清楚一点就已经足够：我是个正常人，我知道感恩。


    # 本讲小结


    这一讲，我希望你一定要记住，作为一个求助者，职场上的求助要诚恳，别耍花招，并且很重要的是，要给对方提供拒绝的选项。


    # 思考题


    别的部门同事工作失误，有了一个纰漏，这可能会影响他评优，他希望进入公司系统帮他修改一个数据。这件事对你风险不高，但如果他坦白了自己的错误，也不会付出太多的代价。


    试着拟一个回复，拒绝掉这个请托。


    # 参考答案


    目标很明确，就是拒绝。


    私自进入公司系统修改数据，不仅违背劳动纪律，而且是违法行为，如果造成严重的后果，还可能会触犯刑律。但是不能说“我不敢”而是要说“您不能”。


    “这个事情风险很高，我是可以改，但是还有一个超级权限在我的主管那里，我给你改一个数据，四五个人都知道。如果他们查这事，我们都会有大麻烦，不查，我们的把柄都会在你们那里，早晚是一个雷。”


    我建议赶紧跟你的领导沟通，说清楚失误这件事，我来在技术支持上帮你圆场，确实这事挽回损失不难。相信你领导也不会想着把事情闹大。你看这样如何？”


    要声明共同的风险，要给出“我会给你做什么”的态度，对方就更愿意接受你的拒绝。'
