- pgno: 39
  md: '我列了一个午餐桌上禁忌话题的不完全清单，你可以看看自己有没有犯过这些错误。如果你能够直接回避那些引发争议的话题，你就能够远离大多数冲突。


    禁忌话题清单：


    +   城市人更好或者农村人更好 | 本地人更好还是外地人更好 | 公立重点学校更好还是国际学校更好


    +   看中医还是看西医 | 要一个孩子还是要两个孩子 | 可以吃转基因还是必须吃非转基因


    +   多储蓄还是应该多贷款消费 | 家里的钱该男人管还是女人管


    # 本讲小结


    我们总结一下，怎么和中性同事相处：


    +   你可以遵循“多、快、好、省”的原则，制造对你友善的陌生人。


    +   相处时，别当生活委员或者知心姐姐，而要学会当总统先生，你可以对照着总统原则的六个要点练习。


    +   午餐是最好的跟中性同事社交的场景，这个场景最重要的是友善和礼貌。


    # 思考题


    我还要给你留一个思考题：


    一个中性同事偷偷找到你，希望你做一个假证，坑害另外一个中性同事，他们两人是死敌，你会怎么做呢？


    +   A. 助人为乐是快乐之本，就算坑人也坚决答应。


    +   B. 提到自己的难处，委婉拒绝。


    +   C. 坚决拒绝，怒斥这个提议者的无耻，回头就告诉那个被暗算的人要小心。


    +   D. 看他俩谁的前途比较好，在领导那里比较红，再做决定。


    # 参考答案


    选 B。不要轻易卷入冲突，留神小人，诚恳地说自己的错误就好了。


    不要选 C，对方搞阴谋你不愿意加入，但是别急着去做道德仲裁者，因为你不知道他们双方以前发生过什么样的冲突。


    不要怕找借口，找借口是给对方留面子，是为了客气。关于找借口这件事，你可以温习一下《关系攻略》里的《职场危机前的妙招：称病》。'
