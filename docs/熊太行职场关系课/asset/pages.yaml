- pgno: 50
  md: '# ## 08 求助他人


    上一讲我给你讲了如何称赞别人，称赞是“给”别人好意，不会特别难。这一讲我们就来探讨一下五个锦囊中的难点，职场上如何求助别人。


    为什么要单独拿出一讲求他人？因为在职场上，求人帮助不仅是示弱，还是一种非常重要的交际方式，你在求助过程中会展示自己的品行、智力和魅力。


    会求助的人，能拉近和同事的距离，能找得到人替自己分担繁重的任务，收买经验，成为未来的领导者。不会求助的人，会在不该开口的时候求助，损伤关系，而在需要帮助的时候放弃求助，把自己陷入到危险的境地。


    那怎么才能正确地求助呢？其实，生活当中托人帮忙、办事，对方能否答应有两个因素：


    +   - 第一是交情的亲疏远近；

    - 第二是有没有利益的交换。


    在生活中求人，基本上是七分实力，三分关系。手上资源越多，看上去实力越强、越有本事，就越容易有人愿意帮你。


    职场上求人，实力和亲密两点仍然适用，但职场的特殊性在于：求助者和被求助者彼此之间更加熟悉和了解，很难指望从吹牛、夸大、隐瞒等小技巧中获益。不仅如此，求助者和被求助者的关系也更加脆弱，双方随时可能成为对手，卷入竞争关系。具体来说，就是日常帮小忙很多，帮有竞争、有风险的忙很少。


    # ### 职场求助的典型错误


    职场求助的时候，会有一些典型错误。我曾经收到过一位K同学的留言，讲她求助被拒绝的过程，非常具有代表性：


    我和女同事M都是同一批进的公司，培训的时候就在一起，一块吃食堂、借她抄培训笔记，后来在一个部门，互相帮助合作得也不错。最近我们部门要提一个副主任，我俩都有希望，但另一个男同事也有机会。我想让她支持我，另外还有两人也支持我，我们就能赢，她答应了。


    但是看投票结果，她应该还是自己想赢，票就分散了。最后男同事得到了这个机会。这两天她又来拉我一起吃饭，我心里很矛盾，不想跟她闹太僵，但是又痛恨她的背叛。我该怎么办？


    K同学和M的关系破裂，关键在于没有认识到几种求助的不同。


    有一种求助是拉近关系用的，这就是“破冰式求助”。培训的时候她借给对方笔记，就是破冰式求助。原理就是人工制造出一个人情债，求助之后向对方致谢，就有了更深入的交流。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '还有一种是日常分担工作，这叫“分工式求助”。你擅长书法，那给客户手写节日卡片的事我就拜托给你。我用表格软件用得好，我就帮你做表格。交换劳动，工作能完成得更好。


    这两种求助，都属于“非竞争性求助”，只要总体来往保持差不多，求助和助人就会让你们彼此保持良好的关系。


    但是 K 同学求助 M 的时候，情况发生了变化，出现了竞争。前面我们说过，现在两个人的关系是对手关系。向有竞争关系的人求助，我们称之为“选票式求助”，这是最容易让同事反目的一种求助。提升职务、评职称、评先进，或者过去一些老单位分房、给子女安排工作，涉及争取机会的求助都属于“选票式求助”。


    “选票式求助”发生冲突，大多数情况是双方对这个机会的认识不同：比如 K 的想法是“我平时帮你不少，为什么这个时候你不肯帮我？”但是作为 M，她的想法很可能是“平时大家互租是有帮助，但还不足以让我牺牲自己的机会去成全你。”


    要解决这种困境，记住八个字：“放下历史，勇于开价。”


    什么叫放下历史？你之前对别人多好，先别想，在竞争关系开始之后，一切恩义清零。


    什么叫勇于开价？你要考虑对手如果支持你，你能够给他多大的回报和好处。


    正确的姿态是：


    +   - 第一步，先挑明两个人之间的竞争关系：“这次竞聘，我知道咱们俩都有机会。”这是先肯定对手的实力。

    - 第二步，温和和确认彼此的交易情：“我们两个人一直关系不错。”

    - 第三步，提出结账提议，“一个人先上一步，比两个人斗，让其他人坐收渔翁之利要好。”

    - 第四步，一定要明确求助需求和交换条件。“这次的评选标准是……我觉得我可能更合适，所以我想请求你帮我，别管成或者不成，下半年的评职称，我都会全力支持你……”


    话说得越明白，越容易获得对方的认可和支持。


    坏的求助是什么样的呢？“咳，你看你反正也没啥机会，不如干脆把票投给我。”就算真是这样，也绝对不能说这个话。一句话说出来，侮辱了对方的能力，还侮辱了对方的善意。


    还有的人喜欢翻旧账，“咱俩平时这么好，你这次可得支持我啊。”这是在说：我平时养着你，所以这次我不准备付出代价，就要白吃你。这么说话的人，往日对别人也不怎么样。只要你进行选票式求助，那“下次我会还你”，就一定比“这次我就要吃你”要好得多。


    还有两种求助比较少见，一种是包庇式求助，一种是拯救式求助。


    包庇式求助是自己做错了事，别人知道了，希望对方不要声张。拯救式求助是自己遇到了大麻烦，求有实力的人来出手挽救局面。这两种求助都是高风限求助，被拒绝的可能性很高。'
