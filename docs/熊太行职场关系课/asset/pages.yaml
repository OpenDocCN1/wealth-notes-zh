  md: '# 本讲小结


    总结一下，今天我给你讲的是如何准备打大仗。


    大仗拼的不是凶狠，而是积累和视野，开战之前联络自己的全部关系。而大仗分两种，你要记住，外战不要拆台，内战要看胸怀。


    下一讲我会给你讲打仗过后，胜者应该如何清理战场，下一讲见。


