- pgno: 88
  md: '第三个月，A 要交房租了，她最终大幅降低自己对公司和工资的要求，做了一份远不如原来的工作。


    几个月后她才知道，甲公司的业务领导和 HR 对她进行背景调查的时候，和她争吵的老领导对她作了负面评价。


    A 在离职阶段犯了几个错误：


    +   *   前期缺少离职计划；

    *   中期不做情绪管理；

    *   后期缺少终点维护。


    # 首先说离职计划


    决定离职就应该做计划，辞职前最好想清楚以下 5 个问题：


    1. 我是想换工作，还是压根就不想工作；


    这决定了你应该找好工作再跳，还是休息 3 个月再说。


    2. 我是想转行，还是在行业内换一家公司；


    前者你可能要接受全新的培训或者实习，后者意味着你要赶紧跟同行、同学等有资源的人通气。


    3. 我是不喜欢现在的公司，还是不喜欢现在的领导；


    不喜欢现在的公司可以谋求同类公司优先，如果更在意的是人，你就要从挑选领导入手。


    4. 我是不喜欢现在领导给我的待遇，还是他的做事风格；


    这决定了你可以为一个做事对脾气的领导，下调多少预期薪水。


    5. 我离开领导是为了更好的发展机会，还是对他的厌恶。


    如果是前者，你不应该接受挽留，如果是后者，在公司大领导跟你提出调岗可能的时候，你可以考虑这个提议。


    这五个问题弄清楚，你自然而然就知道如何去开口和领导告别，也知道如何应对领导的反应了。'
