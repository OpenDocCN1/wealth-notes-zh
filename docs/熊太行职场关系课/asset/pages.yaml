- pgno: 66
  md: '# ## 11 预备功课：搞清楚领导的发展规划


    上一章我给你讲了职场上的五个基本技能，学习了这些基本原则之后，我就要带你进入实战阶段。


    我将带你进入一个新的章节，你需要学习怎么处理职场上最重要的关系，就是和你直属领导之间的关系。这一章我会给你的攻略是，如何成为被领导信任的人。


    想要获取领导的信任，你需要做好五件事：


    +   1. 如何搞清楚领导的发展规划；

    2. 如何打造职场上的“师徒关系”；

    3. 如何平衡好越权和授权；

    4. 如何更好地和领导沟通反馈信息；

    5. 如何离开不适合自己的领导。


    这一讲，我们说第一件重要的事，如何搞清楚领导的发展规划。


    如果你希望成功，在职场上你一定会做自己的发展规划。规划不是年度计划，它并不以年度为单位，它是你对想要做成什么事、想要变成什么人做的中长期设想。


    比如说：


    +   * 几年后做到什么样的职位；

    * 管理多大规模的团队或者多大规模的资金；

    * 收入水平如何；

    * 能力上有多大提高；

    * ………


    给自己做好发展规划，你会明确自己努力的方向。但在职场上，光明确自己的规划还不够，领导的发展规划，你也最好早点弄清楚。


    明确了他想要努力的方向之后，把自己的努力方向向他靠拢，做出一点成绩，就能快速获得提升。有句老话叫“干活不由东，累死也无功”。但是如果你的努力方向和他不一致，就可能会很快失去信任。'
