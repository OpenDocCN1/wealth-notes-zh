- pgno: 98
  md: '一般来说，权力上升有几个重要标志，按重要性排序是这样的：


    +   - 最重要的标志，是被授予拍板权；

    - 其次，是转而负责更好的项目；

    - 然后，是管理更多资金，管更多人；

    - 最后，才是获得更高的职称和更好的待遇。


    而对口头 的表扬褒奖，最好别认真。


    所以，当这些变化在你的盟友身上发生时，你要重新审视你们的盟友关系了。


    # # 维护盟友关系容易犯哪些错


    在确认盟友的实力上升，并且出现了抛弃你的苗头时，你处理要特别小心，很多人容易在这种情况下犯错误。


    有位 K 同学就曾经跟我提到过他和盟友反目的故事，非常典型。


    > 熊老师，我和同事的关系一直不错。我们一直有共识，就是我们不闹矛盾，一个人先出人头地，就拉另外一个人一把。但我发现这个人最近的心思变了。


    去年初领导把他列进了中层培养人选，我差一点，没赶上这趟，后来他对我的态度逐渐变了。请他吃饭、喝酒，能约出来的时候越来越少，工作当中对我也变得更加冷淡，秋天的时候他升了部门负责人，后来就跟我打起了官腔。


    怎么应对这样的盟友呢？


    K 同学犯了几个非常常见的错误：


    # ## 首先，想共享富贵


    “苟富贵，勿相忘”是很多年轻人结盟的时候常见的表态，这件事不要太认真。盟友身份对等时候做的口头约定，如果想要兑现，盟友必须要齐头并进，进步提升的进度差不多。


    # ## 其次，不承认现实


    盟友的前进之路非常明确——本部门的后备领导，这个时候 K 应该支持盟友顺利接班，而不是反复去确认，要盟友表态和自己继续保持盟友关系。因为盟友即将接任领导的职务，之前我说过，你的直接领导就是领导，他不是你的盟友，你必须认清形势，忠于他，跟他合作。'
