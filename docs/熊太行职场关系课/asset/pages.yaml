  md: '这就是典型的想多了，在经历过一次失败的结盟之后，B 知道 C 的职场经验并不丰富，所以吸取教训，把利益划分提前说，而且直接拿到面上说。“这是和我联手的分配方案，如果觉得条件合理能接受，就一起合作。接受不了，我听一下你的建议。再不行，我们就不合作了。”


    联手对象之间没有情分，你不好意思谈利益，对方一定会侵占你的利益，那时候你就吃哑巴亏了。就算你撕一场能拿回利益，也会严重影响你的工作效率和职场风评。大方亮底谈利益，是体面人的做事方式。


    # # 联手的行动指南


    要想联手机为顺顺当当地完成，需要作一些妥当的准备，我在这里给你总结了四条行动指南：


    +   1. 我有备胎；

    2. 我有斗志；

    3. 我有靠山；

    4. 我不做贼。


    # 第一， “我有备胎”


    无论这次联手对你而言有多重要，都一定要明白，联手只能用来解决锦上添花的事。这就像年夜饭上的一只兔子，有它过年，没它也要过年。千万不要把生死攸关的事情，押在一个联手行为上。


    如果你的联手对象发现，你可以和其他人甚至是他的敌人联手，所联手的事情也只是你成绩功劳里的一小块，就更不容易背叛你。


    相反，过分强调你离不开他，碰巧对方发现他的背叛能让你完全出局，他就可能会蠢蠢欲动。


    如果你没有其他可以联手的对象，一定也要表现出一种“我一个人也能把事干了”的豪气。


    # 第二， “我有斗志”


    决定联手的时候，千万不要退卸推脱，看起来是对方替你了活了，其实只会暴露你的虚弱。展示你的活力和斗志会让对方尊重你，明白你对工作的态度是渴望进步和认真的。同时，有斗志也会表现出态度，就是“如果背叛，我会报复你”。


    # 第三， “我有靠山”


    这个靠山不是别人，就是你的领导，职场上最重要的人际关系就是你的领导。'
