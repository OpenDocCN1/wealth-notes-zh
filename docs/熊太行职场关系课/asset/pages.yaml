    | 神经质 | 逆境中有失控的可能 | 比较稳定 |


    鸽派的性格让他成为非常好的朋友，他们人缘往往很好，尽管他们不是最善于交际的自来熟。鸽派是任劳任怨可以倚重的一种力量，尊重权威让他们成为优秀的员工。'
