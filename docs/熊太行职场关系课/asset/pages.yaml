- pgno: 49
  md: '# # 本讲小结


    总结一下，这一讲我们讲到称赞有开拓新关系和维护老关系两种功能，你应该像一日三餐一样去习惯它。而且，称赞有一套成熟的流程和礼貌礼节，你需要的是学习并且接纳它。


    # # 思考题


    大领导来你们部门检查工作，你的领导汇报工作的时候提到并表扬了你。大领导问了你的姓名、学历和职业经历，并称赞了你的贡献，这个时候你应该做的是什么？


    +   A. 竖起耳朵，重点听大领导有没有给你提一些职业上的期待或者要求。


    +   B. 感谢你领导的栽培和教导。


    +   C. 谢谢大领导的称赞，表达忠心。


    +   D. 简单描述团队在项目中的艰辛。


    +   E. 大肆自吹自擂自己在项目中的贡献。


    # 参考答案


    多选：ABD。


    注意场景，领导对大领导汇报工作，你只是一个他提及的员工而已。归功于领导，称赞集体的努力，都是得体的。


    感谢大领导可以，但这样的当场表忠心是大忌，直接领导容易有怀疑。


    这场戏，你不是主角。


