  md: '# 外战：争取收益


    外战就是公司、部门要开展大规模对外竞争，比如重要的竞标、争夺大客户等。外战的目标是完成业绩、争取收益，无论和团队其他人关系如何，这一刻要劲往一处使。


    认识到外战要尽力是很好的职业精神，很多人就猛冲猛打，把斩将夺旗看作第一目标。但我要提醒你，还有更有价值的胜利，就是借此机会赢得领导的绝对信任。


    有两个原因：


    第一，领导是你职场中最重要的关系，外战也是为你的领导而战。只惦记着自己出尽风头，甚至越级获得大领导的赞美，领导可能对你心存顾忌。


    第二，为领导夺取一点成绩，只是有一份功劳，但是替领导挡住一颗子弹，才是投名状。功劳能换到奖励，但忠诚才能赢得机会。


    千万别觉得“领导失败了，也许我就有机会”，这是极大的误会，在大仗中失败的部门全都是败军，大领导也许会在败军中挑一个人暂时维持局面，但从来没有一个人因为打了败仗还可以获得重用。


    我曾经看过一位W同学的留言，提到了自己在公司大型活动当中遇到的困扰。


    > 去年公司准备一个展会，团队加了很多天的班都很努力，但有一个特别讨厌的同事，什么活儿都不干，每天摸鱼，还要抢功。


    我就给她安排了一个她根本完不成的任务，大家都忙没空帮她，我们都准备让她出丑。展出前一天领导来检查，发现了她工作一团糟，我原以为领导会大发雷霆让她好看，没想到领导啥也没说，一夜没睡把她的活儿赶紧先干了，然后又找我谈话。他跟我说，这样不好。


    我觉得他对我很失望，我应该怎么办？


    W同学犯的就是外战的最大禁忌——内部拆台。


    外战是一种快速完成公司或者部门业绩的狂飙，所有人的注意力应该且只应该在该业绩上。这时给对手下一个小绊子，让他丢人出出洋相，似乎能让他被领导嫌弃，但实际上你的行为就和在战场上对战友打黑枪性质差不多。


    要知道大仗不仅仅关乎利益，而且关系到你的领导，甚至整个部门的安全，大领导完全可能因为你们办事不利，就把你们的领导废掉。


    为了想干掉不得体的、偷懒、狂妄的同事，就用手段让自己尊重、喜欢的领导陷入危险当中，这就说明领导在你心中，还不如那个妄人。这也是为什么领导特别不喜欢“内战内行，外战外行”的人。所以，外战一定要尽力。'
