- pgno: 89
  md: '# 其次是中期情绪管理


    提出辞职之后要尽量控制情绪，无论他贬损你下家的公司，或者评价你未来的计划，你都应该尽量微笑以对，没有必要激怒对方。要知道你的目标是结束你们的上下级关系，不是争出个输赢对错。控制情绪的方法，你可以去复习一下第二章。


    # 第三是终点维护


    已经结束一段工作了，就不要去吐槽领导或者同事。但凡提到前东家，尽可能用中立或者友好的评价，多提一下过去的同事情谊。关系维护好了，前领导能成为你重要的人脉资源。


    这三个阶段，这些点都注意到了，一般 wouldn''t 会跟领导发生冲突。此外，如果你决定去脱产深造或者旅行一段时间，最好是开始记账，调整你的消费习惯。大账单会让你感受到压力，甚至作出对自己长远看来不利的选择。


    # 提辞职的技巧


    在各种策略决定之后，你就得直接面对领导了。你要明确，这次沟通我们的目的就是希望领导不为难我们，赶紧放人。记住这句大俗话：


    > 在你离职手续办完之前，这个人随时可以开除你。


    有位 P 同学跟我说过一件很委屈的事情：


    上星期我接到猎头 的电话，说一家我很心仪的企业来挖我。那天我特别高兴，提 前下班约了几个朋友吃饭，顺手发了个朋友圈，还屏蔽了领导。


    结果第二天就被领导叫去谈话，是同一办公室的人告诉他的。领导把我跟了三个月的项目直接派给别人干，我预计损失有几万元。


    P 同学的应对犯了很多低级错误：猎头 的电话一文不值，离你获得工作还很远；朋友圈不要乱发，分组了也不能放飞自我。


    最重要的是他刺激了领导的情绪。他早早就开始耀武扬威，宣扬自己的好去处，吐槽公司的不靠谱，那只会激怒领导。人一旦被激怒，行为就难免不可预期。


    跟领导提离职正确的做法是什么呢？想要不刺激领导，最好的办法就是缩短他焦虑的时间。提交辞职申请的时候，领导才知道你辞职，这是最理想的。


    你可能会说，“我突然要辞职，是不是对领导的一种侮辱呢？”'
  merge: -1
  img_proc: true
- pgno: 90
  md: '当然不会了，你嚷嚷得全世界都知道你要辞职，领导还被蒙在鼓里，那才是对领导的侮辱。第一个就让领导知道，而且是用正式的方式让领导知道，这恰恰是尊重。


    只要你想好了，就不要接受领导的挽留。一旦你这次接受挽留，下次辞职的时候他就会双倍焦虑，就可能会有情绪和愤怒。


    我用十六个字总结了一个完整的辞职流程：


    +   - 提出辞职；

    - 解释原因；

    - 谈论去向；

    - 感激祝福。


    下面我来分别解释这四个动作：


    # 第一，提出辞职。


    第一句话就提出辞职。这不是通知别人的死讯，对方不会接受不了。你拐弯抹角，对方不仅能猜到，还能有对策。拖得越久，越不容易辞掉。


    # 第二，解释原因。


    有的领导会问你，“为什么辞职呀？”大部分时候，领导只是想知道自己的管理有没有问题，这个时候你真跟领导提意见就刺激他了。你要给出一个正当理由，说说家庭、父母的原因、个人身体的原因，也许更好。原因可以俗一点，不要太离奇，免得领导感觉你在侮辱他的智商。


    # 第三，谈论去向。


    如果你确实拿到了 offer，可以说出公司的名字，不然说出大方向就可以。极少数的领导会想着留人，如果不直接说加薪或者升职，就根本不要考虑了，领导只是客气一下。


    # 第四，感恩祝福。


    感恩的对象是领导，“您对我的关心我不会忘”“您对我好，我们就有交情”。祝福的对象是公司，这是一句客气话，“祝公司发展越来越好，以后还有合作机会”。


    提出辞职并提供正当理由，一般都会跟老东家结怨。一定不要在这儿解决往日的恩怨，他发泄情绪你也要尽可能忍耐，他挖苦刻薄完了就会放人。


    ![](img/463ba23747f3bc168dba9e89f7a31f14_90_0.png)'
  merge: -1
  img_proc: true
- pgno: 91
  md: '最后强调一句，辞职这件事如果需要有一个给你情感上的支持，一定不要找同事，风险太高，可以找可靠的同事、老朋友、过去的老师和开明的家人。他们不仅是你情感上的支持者，还可能带来新的工作机会。


    # 本讲小结


    总结一下，一定要先想清楚自己到底想要什么样的领导和工作，再作决定。一旦作出决定就尽快辞职，避免引发领导的焦虑。你还要意识到，你真正离开前，领导随时可以先开除你。


    # 思考题


    领导决定把你的辞职申请放两天再批，这个时候你应该如何应对？为什么？


