- pgno: 25
  md: '# # 本讲小结


    总结一下，这一讲你需要记住以下四点：


    +   1. 互信状态，人的实力才能发挥出来。

    2. “信任”，你给领导很多信息，他才会给你重任。

    3. 只有“投名状”才能打败“猜疑链”。

    4. 永远别忘了“走为上”。


    # # 思考题


    我给你留一个思考题：


    脱不花刚进入职场的时候，遇到一个能力出色、人品也很好的领导，出于对领导的敬爱，她主动帮助领导邮寄了信件。


    领导后来对她说：“你是我的下属，但不是我的私人助理，这是我自己的事情，还是我自己来吧。”


    如果你是当年的脱不花，你会如何理解领导的这几句话呢？领导是不信任你么？


    # 参考答案


    脱不花信赖领导的人品和能力，她也应该相信领导不让她寄信件的理由。


    我看有同学说，脱不花应该明白，领导可能有别的心思，比如有需要保密的信件，领导根本不信赖她，才会让她不要给自己邮寄信件。


    但是我要提醒一句，如果领导觉得有些事要对你有借口，那你最好就相信借口。


    领导是你最重要的关系，也是初入职场的你需要率先信任的一个关系。你除了信他，没有什么更好的选择。


    而且领导最大的可能性，就是觉得一个出色的员工不应该给自己打杂，高看年轻人一眼的领导，日后都能收获年轻人的友谊。'
