- - '##'
  - 一、思考成功的概率和逻辑
- - '##'
  - 二、整合
- - '##'
  - 三、按照社交团购的思路来做
- - '##'
  - 四、品控
- - '##'
  - 五、如何选品
- - '##'
  - 4."四败一一服装"。你们希望帮助本地商场上线，帮助他们像拼多多一样做团购。但服装和食品不同，服装是属于全国性的规模效应。不难发现，服装电商，无论是阿里，还是拼多多上的卖家，有很多都是厂家直接在做的。因为服装，消费者等得起，也因为当地不能满足他们个性化的、多样化的需求，同时还要廉价。在这里，你们用同城思维去开展一个全国性规模效应的生意，逻辑不成立。
- - '##'
  - 5."五败一一规模效应"。在你们的品类选择上，你们没有区分，三公里规模效应、同城规模效应、全国规模效应，而是试图用同城思维来做三个不同层级的生意。三种规模效应，三种玩法，对一个初创公司而言，这是致命的。
- - '##'
  - 6."六败一一地推"。这种ToB平台生意，又是区域性的，广告的效果是很差的，需要的是强大的线下团队进行地推。这不是我说的，是关明生当年给王兴的建议。这和你们以前做游戏的逻辑完全背离，我不知道你们是否具备地推的能力。
- - '##'
  - 7."七败一一布局"。你们选择的切入点是三四线城市的县城，这是个错误的选择。县城是一个很小的市场，正是因为本地不能满足人们日益多样化的需求，电商在县城才有机会。再者，县城的商家差不多到了商品流通的最后端，商家的利润很薄，且在县城做团购，量也很少。商家很难获利，消费者也很难以更廉价的商品，你们更难从中获益。
- - '##'
  - 8."八败一一逆势"。从去年开始，很多大企业都在做渠道下沉，上山下乡，深入市场的毛细血管。腾讯研究院出了一本《分水岭 大时代》，讲了这种现象。最近风头正劲的雷布斯在前两三年面临业绩下滑，但这两年他们在三四五六七线城市，甚至县城，开了很多线下店，小米业绩得到增长，如今马上上市。除了小米，天猫、京东、苏宁等都在布局线下。他们的做法，都是利用自己强大的供应网络以及数据智能，直接触达终端的线下门店。这和你们的策略也是相悖的。
- - '##'
  - 9."九败一一网络效应"。细细梳理一下你们的选择，不难发现你们在一些领域是直接和已经形成网络效应（这里又分同城网络效应和全局网络效应）的平台进行竞争，在食品和美团、饿了么竞争，在3C和京东、天猫竞争，在服装和阿里、京东、拼多多竞争等等。你们几乎没有可能比他们做得更好了，也几乎没有激发网络效应的可能。
- - '##'
  - 10."一胜一一远离互联网中心，边缘突破"。前面说了九败，这里说说那一胜。你们有一定的技术实力，但缺乏好的破局方向。在这个大时代，机会我认为不再是互联网中心的那那些事儿，就是说不能盯着那些已经做得好的，然后试图去做得更好而越过他们，这种可能性极低。我认为应该用你们的互联网技术去做远离互联网中心的事儿，去做一些巨头们不做的脏活累活，去和一些传统的，有好的前景的模式结合，用你们的技术和他传统商业的运营能力结合。这些可能会更大一些。
- - '##'
  - 一、100款利润品的选择。
- - '###'
  - 1."TOFA"模型，每个地域的消费者都有一些相对特殊的消费偏好。通常来讲，按照对时尚偏好性和风险承受能力的不同，可以将消费偏好分成四个象限，具体为T：保守型；O：乐天型；F：理财型；A：前卫型。夜未央同学希望从试点开始试验模式，因此需要首先了解试点
- - '###'
  - 2.所在区域人群的年龄分布问题：随着社会的迅速变迁，区域人口流动的特性越来越明显，这也导致了不同区域的人口结构也出现了一些不平衡分布的特性，并最终导致区域内"家庭结构"有相对特殊的共性。从家庭生命周期来讲，按照不同的时间段，家庭可以按照"单身阶段""新婚阶段""满巢阶段""空巢阶段""鳏寡阶段"。不同的家庭，需求显然也是不一样的，因此同学不妨调查一下所在区域各个家庭类型的比例。由此来作为产品选择的依据。
- - '###'
  - 3.阶层的分布：不得不承认，社会是有不同的阶层的，每个阶层的消费能力，消费习惯、偏好都是不同的。因此对于所在区域的阶层判断，对于产品挑选也非常关键。润总上次在线下大课中分享的数据显示，目前我们社会的阶层分布大约是：11%左右为生存而购物的下层人士；38%左右的喜欢折扣商品，且多购买生活用品的劳动阶层；32%左右的喜欢模仿上层人士的中产阶级；14%左右的重品牌，喜欢购买体现生活方式和品位的上层人士。同学不妨也调查一下所在区域的阶层结构。
- - '##'
  - 二、如何制造爆炸性分享。
- - '###'
  - 1.和家电卖场合作，搞全套家电拼团，拼团内容包括了整套家电（比如总共15种商品），拼团开始之后，单个商品下单数量不限，但拼团完成的条件是所有的产品都必须要有至少一个单，这样一旦出现了绝大部分的商品都已经有订单，但还有一两个产品没有订单时，所有的参与拼团的消费者在损失规避的心理下，都会想办法去推这个拼团活动，于是就很有可能产生爆裂式分享。同样的打法可以用在洗漱用品、汽车用品、全套家具等等，按照品类拼团还有一个好处是，消费者在推朋友时，会有意推给那些可能真有需要的朋友，因此会比较精准，给消费者的社交红利就更大。
- - '###'
  - 2.挑选和识别第三方卖家。
- - '##'
  - 一、贵司的转型主要有两大挑战
- - '###'
  - 1.基因：从游戏转型向拼团电商，无论是人才结构、管理模式、运营模式，还是资金规模、投入产出周期，都有非常大的不同。能否做好这个跨越，是第一个挑战，也是最大的挑战。
- - '###'
  - 2.效率：一个企业的精力是有限的，如果主营业务的多年积累对新业务完全没有帮助，新业务也是很难做起来的。无论是技术方面的积累，还是品牌、渠道方面的积累，都会节省大量的时间和试错成本。因为从0开始需要很长时间，我相信你想做的，也一定会有人想到，并且开始
