    這篇文章之前在臉書頻頻被轉載，原文叫《Nurse reveals the top 5 regrets people make on their deathbed》（臨終病人最後悔的五件事），原文是一位名叫Bronnie
    Ware的護士寫的。Bronnie Ware專門照顧臨終病人，所以有機會聽到很多人臨終前說出他們一生中最後悔的事。最後她發現，大多數人到了生命的盡頭，有五件事是他們最後悔的，你知道這第一、三、五名分別是什麼嗎？


