    \n## Lesson 3\n### 生命中最重要的問題——「你要什麼？」\n\n# 一直問自己問題，你人生的問題會愈來愈少\n\n在這一篇中，我不斷以各種方式問：「你要什麼？對你來說，到底什麼是重要的？」請不要小看這些問題，這些問題會開啟你「思考的一扇門」，讓你開始動動你那幾百年沒用的腦細胞，從現在開始思考你的人生「該」往哪裡走，「想」往哪裡走，或是「不想」往哪裡走。\n\
    \n人生很弔詭，如果你一直問自己問題，人生的問題會愈來愈少；如果你一直不願問自己問題，人生反而會充滿問題。\n\n所以，「你要什麼？」（註6）\n\n註6：踏上YouTube搜尋「生命中最重要的問題：你要什麼？」有我的演講影片。\n\
    \n# Lesson 4\n不是沒錢、沒時間。\n是你覺得不重要。是你沒有心\n\n> 「心在哪裡，時間就在哪裡。」\n\n![](img/7a3931d50c2c9383cc41488956e04ae5_51_0.png)\n\
    \n# 錢和時間背後代表的意義\n\n我聽過很多人說自己「沒時間」，卻一天到晚在Facebook打卡，放上照片寫著又跟誰誰誰出去玩了好幾天；我也常看到很多人說自己「沒錢」，結果又買了哪台新手機能、最新的iPhone或3C商品。所以問題不是你沒錢、沒時間，而是你覺得那件事或那個人不重要，因此沒有把心放在這些人、事、物身上。\n\
    \n# 人只會做自己覺得重要的事情\n\n人選擇做任何事或選擇不做任何事，背後都有其目的性，只是你有沒有發現罷了。其實從我們對時間和金錢的安排，就可以看到我們在乎的是什麼。\n\
    \n人只會做自己覺得重要的事，這是不變的真理。就算你說你不想上班，但背後的原因還不是你在乎上班之後能拿到的薪水，你在乎拿到這些薪水後能換到的東西，所以才會一邊抱怨還一邊做下去。所以從你現在做的事情，我們一定可以看出你在乎什麼東西，或是你再乎這件事將來能換到什麼東西。\n\
    \n我這輩子最常聽到人家說「我沒辦法」的理由是「我沒錢」、「我沒時間」，我相信你們也不例外。那麼接下來，就讓\n\n\U0001F4A1 世界上最值錢又最不值錢的東西：時間。\n\
    \n我來幫你釐清一下什麼叫做「沒錢」、「沒時間」。\n\n# 基本上，「沒時間」根本就是鬼扯！\n\n你知道世界上最值錢又最不值錢的東西是什麼嗎？答案都是「時間」。\n\
    \n時間為何最值錢？因為無論你再有錢，你的一天還是24小時，就算你老爸是郭台銘，你也不可能花錢把一天變成24小時又多1分鐘，所以時間是「無價」的。再多錢都買不到、換不到的東西，不就是最值錢的嗎？這點我相信大家都知道，所以不想再贅述。\n\
    \n# 「時間」為什麼最不值錢？\n\n就時間而言，你根本是「不勞而獲」。因為無論你喜不喜歡，只要過了半夜12點，老天爺又會給你24小時，所以只要你還活著，每天都有「新的24小時」可以用，所以你怎麼可以隨便說：「我沒時間？」所以那些在沒有一定時間範圍內，還跟你說沒時間的人，背後勢必有「不能說的秘密」，這個秘密是什麼呢？套句盛竹如的名言，讓我們繼續看下去。\n\
    \n## Lesson 4\n不是沒錢、沒時間，是你覺得不重要，是你沒有心\n\n你不會對你覺得很重要的 人、事、物說：\n\n「我沒時間。」\n\n我常聽人說：「我沒時間。」本人以前是專業的翻譯，我幫大家把「我沒時間」翻成大家比較容易懂的話，那就是：「（這件事情不重要，所以）我沒時間。」\n\
    \n因為只要你覺得它重要，無論你多忙、多累，你都會撥出時間。不相信嗎？看看以下的真實案例吧。\n\n我有個朋友，他這輩子不可能從沒有六點起床過。每次約他早上跑步，他都說：「我不可能這麼早起來啦！我每天都二、三點睡，真的不可能，難道你要我只睡三小時喔？」\n\
    \n我大概約了他十次吧，沒有一次是成功的，約到最後我都不想約了（請見後文，我也養成不想約他的「習慣」了）。後來我也真的相信「要他這麼早起床是不可能的事」，而他自己八成也是這麼認為。\n\
    \n直到上個月，因為聽說他喜歡的美眉當天早上也會去跑步，所以他二話不說，六點準時出現在永和河濱公園運動場。（還不是六點起床，是六點出現。）\n\n當時一見到他，我驚訝地問：「你昨天幾點睡？」\n\
    \n\U0001F4A1 凡事都是相對，而不是絕對。\n\n他說：「四點。」\n\n我問：「你不是說不可能這麼早起？你昨天不是更晚睡？」\n\n他啞口無言。\n\
    \n# 只要你覺得它重要，你就會撥出時間，而且願意「付出代價」\n\n人一直覺得「我真的做不到」的事情，或許你也真的覺得他做不到；但只要背後的原因不一樣了，或是他想付出的人不一樣了，他就做得到了。因為他覺得這件平常做不到的事情，今天「天級的」值得了，所以重點不是事情本身，是它背後的價值。\n\
    \n所有事情都是相對而非絕對的。如果覺得這件事很值得，你就做得到，無論它再難，需要花多少時間，你都不會抱怨，你都會忍，因為你不覺得那是犧牲。人都有一種特質，就是會「看著事情背後的價值來做事」。同理可證，當你覺得它不值得，無論它再簡單，你都會說：「我做不到，我沒時間。」如果有人逼你做，你會怪東怪西、會怨天尤人。\n\
    \n當我在Facebook寫上這個朋友跑步的例子時，很多人說如果因為重色輕友，他們也會這麼做。我提到朋友的這個例子，只是想舉比較常出現，而且大家能感同身受的例子。但你願意付出\n\
    \n![](img/7a3931d50c2c9383cc41488956e04ae5_55_0.png)\n\n代價的地方，絕對不會只出現在你喜歡的對象身上。\n\
    \n從這位朋友的例子不僅能看出只要你覺得重要，就會撥出時間，而且你願意付出代價，我們還能看出背後更重要的一件事：「凡事沒有絕對，只有相對。」所有事物的價值，都是經過比較而來的。以他這個例子而言，把「和喜歡的對象見面」跟「犧牲睡眠」抓來超級比一比，他覺得跟喜歡的人見面重要多了，所以他當然願意犧牲睡眠，而且還犧牲得無怨無悔，犧牲到讓我徹底見識了有異性沒人性的強大力量。\n\
    \n# 凡事沒有絕對，只有相對\n\n任何事情都是相對而非絕對，無論是金錢、時間，或任何事物都是如此。其實我們在做每一個決定時，都會在下意識中先比較事物背後的價值，而不是它的價格或你需要付出的時間。我舉個例子：\n\
    \n你是個科技公司的業務經理，今天晚上七點總經理和副總找你做業務簡報，在場有很多重要人士，假設這個會議在你心中的重要程度是10000分，是個非你不可的會議。\n\
    \n現在時間是下午兩點，在你準備簡報的同時，最要好的同事走到你旁邊對你說：「兄弟，我昨天剛和女朋友分手，心情很不好，晚上想找你吃個飯。」雖然你和他交情很好，也覺得他「心\n\
    \n\U0001F4A1 是價值，不是價錢。\n\n情不好」這件事很重要，但在你心中的重要程度可能只有2000分，你知道晚上有件重要到等級10000分的事情要做，所以只好拒絕了他。\n\
    \n到了下午六點，你老婆打電話到辦公室問你：「兒子發高燒到39度，你能不能帶孩子去看病？」你心裡很緊張，剛滿一歲的兒子發燒在你心中的重要程度或許是7000分，但比起待會重要程度10000分的會議還是差了點。你很擔心孩子的安危，但仍然請老婆或別人帶孩子去看病。\n\
    \n到了下午六點五十分，再過十分鐘就要開會了，你的心情七上八下，一方面擔心待會的簡報，另一方面又掛念兒子的安危。這時你接到老婆的電話：「小孩發高燒到41度，已經昏迷不醒，我叫了救護車，你快點趕來醫院！」\n\
    \n這時，在你心中「小孩發高燒」這件重要程度7000分的事情，因為「小孩昏迷不醒」，瞬間重要程度增加到超過10000分，於是你立刻跟總經理請假，飛奔到醫院去看小孩。至此，不參加會議所要付出的極大代價，對你來說已經不算什麼了。\n\
    \n以上的故事，我相信絕大多數的爸媽都會做同樣的決定。\n\n你發現了嗎？\n\n![](img/7a3931d50c2c9383cc41488956e04ae5_57_0.png)\n\
    \n就算你某個時間已經事先被敲定了，就算那件事很重要，但你也不是真的沒時間，只是你還沒遇到讓你覺得更重要的事情罷了。如果遇到了，你還是會把先前的事事情給取消或排開，無論你要付多大的代價。\n\
    \n由此看來，我們可以知道一項約定的先來後到其實並不重要，重要的是在你心中這件事情（或這個人）的重要程度。如果真的覺得重要，你死命也會抽出時間的。\n\n\
    所以「沒時間」真的只是相對，而不是絕對。因為每個人在同一個時間只能出現在一個地點，因此時間有個很好玩的「排擠效應」——當所有事情同時發生時，你會排擠掉其它的事情，留下在那段時間裡你認為最重要的事情。\n\
    \n你現在能明白「不是沒時間，是你覺得不重要，是你沒有心」了嗎？\n\n# 你在意的是價值，不是價錢\n\n除了沒時間之外，我最常聽到的推托之辭中首推「沒錢」。請問：「如果今天要你拿出一百萬元，你會覺得這筆金額是多還是少？」\n\
    \n有人覺得拿出一百萬元很多，有人覺得很少，這端看你的戶\n\n你在意的是價值，不是價錢。\n\n頭存款、月薪以及你現在對金錢的價值和安全感而定，但我請你先把這個問題的答案放在心裡。如果你的答案是「我覺得拿出一百萬很多，我拿不出來」，今天我告訴你有台原價三百萬的全新賓士車，現在只要賣你一百萬，你買完後立刻轉手，就可以現賺兩百萬，這時你還會覺得一百萬你拿不出來嗎？\n\
    \n或許有人開始覺得這一百萬沒那麼多了，因為它能換來三百萬的價值；有些人甚至會去借錢來買，因為他看到這一百萬的價值；但有些人還是會覺得：「還要先出一百萬，我不要！」或還是有極大的顧慮。\n\
    \n我再繼續問下去好了。\n\n在一次身體檢查中，醫生發現你得了絕症，但最近法國發明了一種新藥，它保證能救你一命，只是這個新藥需要花費一百萬元。這時不管你手頭有沒有一百萬，你還是會回答「我拿不出來」嗎？\n\
    \n如果是\uFEFF我，就算我窮到快脫褲子，也會拼了老命想辦法去借到一百萬。我不知道我借不借得到，但我知道非借到不可，因為這一百萬能「換到我的命」，我看到它背後的價值，所以這一百萬超值得。\n\
    \n我看過太多 vign 天哭窮的人，每次新的 iPhone 或 3C 商品上市\n\n## Lesson 4\n不是沒錢、沒時間，是你覺得不重要，是你沒有心\n\
    \n他們總是搶先預定；但如果要約他們吃個飯，唱個歌，出外玩，這些人又回到「哭窮模式」了。所以你看出來這是怎麼回事了嗎？他們不是真的沒錢，而是因為「在乎的東西不同」，所以他們「窮的程度」也因此不同。我們可以做出以下結論：「人只要遇到自己想要的東西，他們就不窮了，他們就有時間了。」\n\
    \n所以人對「金錢」的價值判斷也是相對的。金錢不過是個物質交換的工具，端看你花錢最終能換到的價值而定。這邊提到的「價值」，通常是很主觀的，每個人在乎的東西不一樣，但「時間」和「金錢」可以讓我們看到更深的層面，那就是「瞭解自己」跟「你要什麼？」（註1）\n\
    \n註1：請見〈生命中最重要的問題——「你要什麼？」〉一文。\n\n一切都沒有對錯，只是你要什麼？\n\n# 你要什麼？\n\n# 讓你看到自己在乎什麼，願意為什麼付出代價\n\
    \n想把時間和錢花在哪邊，這一切都沒有對錯，每個人覺得有價值的東西不同，只是要讓你知道自己真正在乎的是什麼，也讓你瞭解大多時候說「沒時間」、「沒錢」，其實只是極為表面的理由罷了。在你邁向心靈成長的路上，「探索自己」是極為重要的一件事，如果你看不到自己做這件事最根本的原因，看不到自己最終想用金錢和時間換來什麼，你就無法真正瞭解自己。\n\
    \n而「錢」和「時間」，這二件需要付出代價的事情，就是幫助我們看見自己真正想要什麼的好工具。\n\n# 你要什麼，你在乎什麼？\n\n# 像剝洋蔥一層一層剝下去找到答案\n\
    \n如果你願意為了剛出生的女兒放棄睡眠，半夜三點起來哄她睡覺，這代表你很在乎你的親生骨肉；如果你沒什麼錢，但還是願意為了iPhone付出金錢的代價，這代表iPhone對你很重要。再看深入一點，iPhone給你科技的便利性或虛榮感，會比你要付出的金錢代價還來得重要，但是便利性或虛榮感對你真的那麼重要嗎？如果你願意為了喜歡的人而早起犧牲睡眠，表示這個人對你很重\n\
    \n## Lesson 1 不是沒錢、沒時間，是你覺得不重要，是你沒有心（\n\n要，再看深入一點，這或許代表擁有另一半的價值對你很重要，但擁有另一半對你來說為何那麼重要？所以「從我們願意付出代價的事物，可以看出我們在乎的是什麼」。\
    \ \n\n很多人活了一輩子都不知道自己內心真正的渴望，這是很可惜的事情。「你要什麼？」、「你在乎什麼？」這是人生中最重要的課題，我們將可以從你願意付出代價的人、事、物來一層一層找到解答，這是金錢和時間可以讓我們看到的很寶貴的東西。\n\
    \n# 人是習慣的動物，如果你常說「沒時間」，以發人家就不會再找你了\n\n人是習慣的動物，我們每天刷牙、洗臉、吃三餐（或是吃宵夜）、洗澡，這些都是我們從小慢慢養成的「習慣」，沒有人規定你要這麼做。但是你知道嗎？你也會「習慣」找某人，或「習慣」不找某人。\n\
    \n我聽過一句話：「朋友找你，你不能常拒絕別人；因為若是你經常拒絕，久了別人就不會再來找你了。」就好像我以前當翻譯一樣，我發現當我因為時間來不及而拒絕某個翻譯社的稿子幾次後，他們以後就不會再找我了，因為翻譯社也習慣不找我了。\n\
    \n每個人都會遇到同樣的情形。你可能常約某個朋友出去，約個幾次，他都說：「我沒時間。」久而久之，再好的朋友也會失\n\n人，只會做自己覺得重要的事。\n\n\
    去耐心。因為你持續地拒絕，某種程度上就是在告訴他：「我們的約會沒那麼重要。」\n\n這就好像男人追女朋友一樣，男人約了幾次，如果女方都沒有回應，或是推說自己沒時間，男人們自然會認為：「她應該不喜歡我。」我聽一位女性朋友說過：「如果男方怎麼約，女生都會答應，那你的勝算一定很大；如果約了好幾次，女方都拒絕，那你的希望就很小了。」\n\
    \n最後還是回歸一句老話：「人不會做自己覺得不重要的事情。」如果你一 aztán拒絕人家，你就等同用行動告訴對方「我不喜歡你」、「你不重要」或「我有其它事情比你重要」，所以我不想跟你出去。\n\
    \n# 過去的「經驗」造成現在的「習慣」\n\n既然人是習慣的動物，那習慣是怎麼來的呢？我再幫你往下看得更深入點。「習慣」就是從過往的「經驗」累積來的。如果先前的經驗是好的，當你下次再面對同樣的情況時，就會聯想到上次的經驗，也因此會繼續做下去；如果上次的經驗是不好的，你很有可能會被上次不好的經驗影響，所以下次就不想再做了。\n\
    \n給你做個實驗，如果你今天跟另一半吵架或是工作上很不順利，想找人談談心事，你會「第一個」想到誰呢？\n\n## Lesson 4\n不是沒錢、沒時間，是你覺得不重要，是你沒有心\n\
    \n給你十秒鐘，在心中想好一個人選，然後寫下他的名字，我拜託你一定要寫，因為這能讓你看到真相：\n\n好的，你開始想像這個人，我相信他（她）一定是以前幫助過你，讓你有好的經驗的人。沒錯，這就是「過去的經驗」造成「現在的習慣」。如果人家找你幫忙，而且有過好的合作經驗，那往後勢必也會繼續下去。男女朋友是如此，同事合作關係是如此，任何事情都是如此。\n\
    \n而這種「好的經驗」累積起來就是種「信心」，而信心常常是要靠一次一次的累積才能建立的。\n\n# 有借有還，再借不難。\n\n# 你想要別人的時間，你就得付出自己的時間\n\
    \n很多人常抱怨這世界很不公平、很不合理，我從來不這麼認為，因為我覺得這世界「超合理」。知名德國哲學家黑格爾（Georg Wilhelm Friedrich\
    \ Hegel）說過：「凡存在，必合理；凡合理，必存在。」網路漫畫家馬克也說過：「脫離自己的思維，你會發現所有的事都真他媽的合理。」\n\n如果你覺得你的薪水很不合理，那是從你的角度覺得不合\n\
    \n你想要什麼，你就得付出什麼。\n\n理；我相信從老闆的角度來看，他覺得你的薪水很合理。我有個朋友是上市公司的老闆，他曾告訴我：「我的員工上班時間都在鬼混，看Facebook，我覺得我的薪水付得有夠不值得。」\n\
    \n立場不同，想法也會不同，你懂了嗎？\n\n這世界是很公平的，如果我們常常不給人家時間，以後你需要別人幫你的時候，人家也不見得會給你時間。人與人之間的互動就是一種循環和交換，就好像投手和捕手在互相傳球一樣。\n\
    \n法國哲學家米拉（Miela）曾這麼形容人與人之間的關係：\n\n感情就像投手和捕手互相傳球\n\n投手投一顆球過來，捕手把球接住再丟回去，有來有往，「你要什麼，你就得先付出什麼」。\n\
    \n你需要朋友的時間，就得先把你的時間挪給朋友，朋友才會為你留時間；你要朋友的信任，你得先要信任他，將信任像球一樣丟給他，他再把信任回傳回來。\n\n有來有往，像一個緊密的「圈」一樣，彼此相繫，如同合作無間的投捕手，朋友的緣份也會長長久久。\n\
    \n## Lesson 4 不是沒錢、沒時間，是你覺得不重要，是你沒有心（\n\n如果你是投手，一直把球丟過去，對方就是不接球；或你是捕手，對方一直生氣暴投，總丟一些你用盡全力才能接的球。\n\
