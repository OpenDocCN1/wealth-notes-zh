    ## 世上沒有意外，你是一切問題的根源，也是一切問題的答案


    電影《功夫熊貓》裡的烏龜大師說過：「世上沒有意外。」給我一篇文章的時間，讓我告訴你原因。


    世上沒有意外，我們現在擁有的一切，不過是自己和許許多多人的選擇交織出來的結果。


    在一本書裡要人家看影片是很奇怪的事，但因為我這本書不一樣，這部影片也不一樣，如果你手邊有電腦或手機，請你先認真看完這段影片再讀文章，你會更瞭解我想表達的意思。這部影片三分鐘而已，你的人生都不知道浪費多少個三分鐘看搞笑影片了。所以，我請你先想辦法上網看這部影片，因為「這世上沒有意外」，就從這三分鐘開始。


    請上YouTube搜尋這段影片：「世上沒有意外」。


    ## 不是運氣，是機率


    ## 世上沒有偶然，只有必然


    首先，如果你相信這世上有「意外」、有「運氣」這回事，你就會落入「受害」的陷阱裡，這代表你無法決定周遭的一切，所以會怪罪於所有自己不滿意的事情，但其實你是一切問題的根源，也是一切問題的答案。看完那段三分鐘的影片，你會知道無論好壞，都是你和周遭的所有人做了什麼而造成的。如果少了你的某一個選擇，你要的或你不要的結果，都不會發生。


    這世上沒有偶然，只有必然，自然界也是如此，要下雨就必須達到某種條件，條件成形就絕對會下雨。如果有例外，勢必是達到了另一種「不下雨」的必然，所以連下雨也不是「意外」。


    2009年6月23日，當時台灣有則著名的新闻標題是「看《秘密》寫祈禱文，大樂透得主花650元中9.37億元」(註1)。那時大家的重點都放在「原來用吸引力法則可以中樂透」，當時真的掀起一陣《秘密》風潮，我身邊就有不少人每天買彩券，每天祈禱（幻想）自己能中頭獎。因為人都會選擇自己想看到的東西(註2)，


    註1：「看《秘密》寫祈禱文，大樂透得主花650元中9.37億元」

    新聞全文：http://blog.cnyes.com/my/leelih68/article128395


    註2：請見〈帶著預設立場，你有眼睛卻看不到，你有耳朵卻聽不到〉一文。


    所以看完整篇，你只會覺得：「這人真幸運，看來我也要去買本《秘密》來看。」但如果大家都用吸引力法則就可以中頭獎的話，全台灣那麼多人把《秘密》讀爛了，他們也想中頭獎，但誰能跟我解釋為何一堆整天瘋狂想中樂透的人卻還是窮光蛋？


    聰明的你，應該看看這篇新聞還寫到：「這位得主平常就有購買大樂透的習慣，每次購買一百元至三百元不等，而且都以家人生日的自選號碼為主。但這次買了一注電腦選號，沒想到這一注電腦選號，讓他幸運獨得9.37億元。」


    你看到重點了嗎？


    「這位得主平常就有購買大樂透習慣，每次購買一百元至三百元不等」，台彩有統計過，中獎獎金在億元以上的中獎人的購買行為多半是每期都買。你真的看到重點了嗎？


    「每．期．都．買。」


    這世上沒有意外，中樂透頭獎也是一樣，你要說那是運氣嗎？如果今天你沒有足夠的行動，你哪會有中獎的機會？如果我今天把《秘密》給翻爛了，每天都在想著「我要中頭彩」，卻從來不買彩券，中頭獎的機率就是0%。這就是機率問題，常買的、買多的人機會多；不常買的、買少的人機會少，就這麼簡單。


    💡 運氣，不過是建立在「有行動上的機率」罷了。


    ## 如果你沒有採取行動，這一切都不會發生


    這是真人真事，我有個同事叫小美，幾年前她在網路上買了個耳機麥克風，中了統一發票頭獎兩百萬。嚇到了吧？我竟然認識統一發票兩百萬得主。你一定覺得我這同事「運氣」不錯吧？


    我上次特地問她：「妳當時中獎的前一陣子，有特別想要中獎嗎？」


    她說：「沒有耶，我就是選電子發票，然後突然收到購物網站的通知而已。」


    你可以說是她的運氣真的很好，好到居然中了頭獎。但這些我們所謂的「運氣」，其實都是建立在「有行動上的機率或實力」罷了。


    如果她今天沒有做以下四件事情：


    - 1. 買那個耳機麥克風。

    - 2. 沒有選擇網路購物。

    - 3. 沒有在那一秒買下去（因為發票號碼會不一樣）。

    - 4. 甚至沒有選擇讓電子發票自動幫他對號碼（如果她自己對獎，不一定能對到頭獎號碼，或許就把這張發票給搞丟了也不一定）。


    上述如果任何一項她選錯了，或就算時間差了一分鐘，她中獎這個事實就「絕對」不會發生。但這一切都這麼準，因為所有條件都滿足了，所以小美中了兩百萬。你覺得中頭獎是全然依賴小美的運氣嗎？這一切不過是小美做完一切選擇後，必然創造出來的結果。


    如果她只是每天「想要中獎」，卻沒有做夠多能產生發票的行為，兩百萬得主不會是她。


    中兩百萬，是小美主動創造出來的結果。


    所以連中獎機率一億分之一的事情都不是全然的運氣，都是我們做了某件事，或不做某件事所創造出的結果，你還想把你遇到的壞事，歸罪到運氣，或怪罪到別人身上嗎？


    ## 瑞士乳酪理論


    你還記得2011年年底台大醫院將愛滋病患的器官移植給受捐者的重大「意外」嗎？發生這麼嚴重的醫療疏失，起因於至少連續發生三個「不可能的失誤」。有愛滋病毒的邱姓男子在死後捐贈器官時，其血液被檢驗出呈愛滋病毒陽性，但發生了以下事件，造成無法彌補的憾事：


    - 1. 院內人員以電話進行確認時，負責通報的台大醫檢師講的

    是「reactive（陽性）」，但沒電話的移植小組協調師卻誤聽為「non-reactive（陰性）」。

    - 2. 按照該醫院標準流程，除口頭告知外，醫檢師還要把報告以電子檔郵寄給移植團隊，而移植團隊則必須在看過電腦確認後，才能做手術。但移植團隊移植前未二度確認，因此造成遺憾。

    - 3. 主導撰寫台大醫院《器官捐贈小組標準作業程序》（SOP）的創傷醫學部主任柯文哲於8月28日向媒體表示，撰寫作業流程時少寫了捐贈者檢驗結果的最後確認步驟，「一顆螺絲鬆了，導致整台飛機墜機」。


    這起事件就是英國學者J. Reason於1990年提出，用來描述醫療疏失原因的「瑞士乳酪理論」。瑞士乳酪有許多孔洞，孔洞之間並不相通，然而當切成一片一片，轉動適當角度，所有的孔洞便有可能連成一線。若是那麼剛剛好每個洞都對上了，光線就穿過去了。


    你會說台大醫療團隊誤植愛滋器官事件是個意外嗎？不是，因為只要任何一顆螺絲沒有鬆，就不會發生如此憾事。世上沒有偶然，我們以為是意外的一切事情，都是所有乳酪轉到「對的方向」後必然會發生的事。你的成功、失敗也都是如此，一切都沒有意外。


    ![](img/7a3931d50c2c9383cc41488956e04ae5_141_0.png)


    所以無論所謂的好事、壞事，只要是發生在你身上的事情，都一定直接或間接與你相關。因為你就是這大塊乳酪切片的其中一片，只要你的任何一個行為不一樣了，結果就不一樣了；只要你把自己的那一片乳酪轉對方向了，你要的結果就會發生，你不想要的結果就不會發生了。轉對，轉錯，都是你自己造成的。


    💡 你是一切問題的根源，也是 一切問題的答案。


    ## 你，承遠有選擇


    ## 你是一切問題的根源，也是 一切問題的答案


    看到這裡，如果你開始覺得：「唉……如果一切都是因為我造成的，所以發生什麼壞事，我都只能怪自己囉？」實果！如果你有這種想法，至少你可以發現你是傾向往負面思考的人。


    大家都知道的老理論：半杯水，你是看到只剩一半，或是還有一半？這無關正面思考，只是你常選擇看事情的哪一面(註3)？


    你怎麼不說：「所有好事也都應該是我造成的？」


    你可以回想一下，目前你人生中發生過的好事：考上好學校、加薪、升官、找到理想的工作、找到好老公，這一切都是你在事前做了什麼才有的結果。所以無論結果好壞，它都是你造成的，所以「你就是一切問題的根源，也是
    一切問題的答案」。


    我再次強調，希望你知道「我就是一切問題的根源」，可不是要你自暴自棄或鞭打自己。既然你是「一切問題的根源」，表示所有結果都因你而起，因此你也可以改變這一切，「你就是一切問題的答案。」這句話無比重要，因為它代表你對自己的人生有絕對的主導權，你可以為自己的人生負起完全的責任。


    註3：請見〈轉念，是所有問題的答案〉一文。


    ## 你對自己的人生有絕對的主導權


    著名的希臘哲學家亞里士多德（Aristotle）曾提出「因果法則」，他認為：「我們生活在一個井然有序的宇宙裡，無論人們是否瞭解萬事萬物背後的原理原則，每件事情的發生，必定都其來有自。」


    暢銷書《成功人士完全念力手冊》也提到：「因果法則簡單來說，就是『事出必有因』。人生中的每個結果，都是一個或一連串的原因所致，任何事情都不是偶然的。如果希望人生擁有什麼東西，或期待發生什麼結果，只要先找到同樣擁有這些東西的人，然後訓練自己做與他相仿的事情，鍥而不捨地直到獲得與他相同的成果為止。這完全是可以預知的未來，而且是可以自己掌控的。」


    我們常以為成功人士是因為運氣比較好，有貴人相助或是時機對了，但他們不過是做了很多努力，因此大幅增加成功的機率或實力罷了。


    贏家通常把成功歸功於努力工作與靈活運用，並且不斷檢討自己；但輸家卻總把失敗歸咎於運氣不好，永遠只會怪罪大環境、怪老公、怪老婆、怪老闆，卻永遠不怪自己。你知道嗎？你抱怨的一切不只是你創造出來的，還是你「選擇」出來的。


    💡 不是東西貴，是你買不進。


    ## 就因為你永遠有「選擇」，

    所以你得為自己的人生負責


    我們每天從醒來開始，就不停在「選擇」，選擇要不要按掉鬧鐘繼續賴床，選擇早餐要吃什麼，選擇幾點出門，選擇穿什麼衣服，選擇走哪一條路，選擇以什麼樣的心情面對這一天，選擇現在該做什麼？該怎麼做？選擇要罵老闆還是罵隔壁機車的同事；你的人生隨時都在選擇，也隨時都「有」選擇，只是你沒有發現罷了。


    如果你抱怨開車油價貴，你可以選擇坐公車、騎機車，或騎腳踏車上班，拿時間去換你覺得很昂貴的油錢。如果你抱怨東西貴，但老闆有權選擇他要賣多少錢，而你也有選擇不買的權利，所以不要再抱怨東西貴了，錢在你手上，又沒人拿著槍逼你買，這只是你「想要」、「需要」，還是「一定要」的問題而已(註4)。如果你真的很想抱怨東西貴、房價高，請別忘了世界知名哲學大師Jim
    Rohn說的經典名言：「不是東西貴，是你買不起。」


    你現在應該知道，你隨時都有選擇，但你或許還沒意識到，其實我們人生的一切，不過是建立在「無數的選擇」上罷了。


    註4：顯見〈生命中最重要的問題——「你雲什麼？」〉一文中 ——釐清你是「想要」，還是「需要」？


