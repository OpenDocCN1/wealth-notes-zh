    令我沒想到的是，當我決定離職，決定不再把英文當主業，開始從事業餘工作而且不做正職，卻遇到很大的反對聲浪。因為我的每一項決定都在違背長輩們的既定思維，而大家都覺得我應該走英文這條路。當時，全世界都在反對我，覺得我不是做業務的料，有人覺得我瘋了，說我腦袋壞了，還有人罵我「智障」。我不厭其煩地告訴所有人：「對英文，我真的累了，它現在真的不是我要的。」但他們也一樣不厭其煩地「提醒」我：「你的英文很好，不要浪費你的天分。」


    可能是我的邏輯太好吧！我知道「我的英文很好」跟「這不是我要的」完全是兩碼子事。這就像阿基師很會煮牛肉麵，但不代表阿基師想天天煮牛肉麵給別人吃。


    當時大家都停留在對我的刻板印象中，讓我覺得英文就像是困住我的象牙塔，這象牙塔不但框住了以前的我，也框住了現在的他們。


    剛開始這令我覺得很不舒服，但後來我轉念了(註5)，因為我知道他們是為我好。親朋好友一定都希望你走一條安全、不會錯的路，而英文＝我，所以英文就是我一輩子該走的路。


    但真的是如此嗎？


    我不怪他們當初的反對，但我跟他們說：「這是我的 人生，請你們讓我自己選擇。」我最後還是選擇離職，一個人面對千軍萬馬的反對聲浪，天知道這需要多大的勇氣！但這是我的
