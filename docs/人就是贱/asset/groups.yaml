    ## 沒有預設立場，你才能看到真相


    ## 開放，就是不帶任何預設立場去審視物


    「開放」，指的是「不要同意，也不要不同意，在你做決定前不要有任何預設立場」。


    在我們面對保險人員推銷時，你是不是從一開始就想著：「又來了，又要賣我什麼終極無敵深單了？等你講完，我再來找個藉口拒絕吧！」或是去逛商店遇到店員來關心時，永遠會說：「我只是看看而已。」好像每個店員都是世界知名魔術師劉謙，多聊個兩句，你皮包裡的錢就會憑空消失一樣。


    有一次我跟同事吵架，她在我面前咕咕逼人地講出她的想法，但當時我的腦袋只想著一件事，那就是：「呵呵，我才不聽妳說什麼，等妳一把話說完，我再來嗆妳。」當我發現心裡有這樣的聲音時，我覺得自己不只是很糟糕，還是非常糟糕。因為如果她也跟我一樣「等我把話說完了再來嗆我」，我們的溝通就是在浪費時間，因為我沒有真的把耳朵打開聆聽她說話，我只想把自己想講的話說完而已。


    就像那句話說的：「在一起需要兩個人，分手只需要一個


    人。」我會說：「溝通需要兩個人的聆聽；不聆聽，一個人就可以宣告溝通失敗了。」


    「聆聽」不等於同意，你永遠有最後決定權，所以你不必「不開放，不聆聽」


    我們會有那麼多的預設立場，甚至不聆聽，是因為我們都有種錯覺，誤以為「聆聽」就是同意，好像我不在腦中先拒絕、不先有預設立場就輸了一樣，所以才會在有人想向你推銷之前，在你跟別人吵架時，在你不同意對方說法時，甚至在接觸到你不相信、不那麼瞭解的事物之前，就先在腦中拒絕了，所以對方有講跟沒講並沒有差別，因為你什麼都聽不進去。但這樣的想法不只會讓你聽不到別人的聲音，還會讓你的心再也無法接受不同的想法和思維。


    請不要小看這件事，一個無法接收不同想法的人，他就像是宇宙的中心，覺得自己什麼都是對的。一個覺得自己什麼都是對的人，你覺得他還有進步的空間和機會嗎？如果你遇到無法接收不同想法的人，你又會有什麼感覺呢？


    下次發現自己又開始有預設立場時，請你用力在心裡「叮咚」一下，告訴自己：「我的預設立場又跑出來了！我要打開耳朵聽聽他想表達的意思，最後決定權還是在我手上，所以我沒理由不聽聽他們想表達的想法。」


    接受、同意對方可以有不同意見。


    你不見得要同意對方，

    但請「同意對方可以有不同的意見」


    除了做到「開放」，把耳朵張開、聆聽這世界的聲音外，我們還得做到一件事，那就是——同意別人可以有不同的意見。


    「同意別人可以有不同的意見」這句話其實是從英文來的，原文是：「Agree to disagree.」太多時候我們就是因為「不同意對方可以有不同意見」，太過於控制欲，覺得「自己是對的，對方是錯的」、「對方很笨，自己很聰明」，所以才會有情緒，才會不高興。


    但是你有沒有想過？「每個人都是覺得自己是對的，才會去做每一件事的」，所以當你覺得你是對的時候，對方也覺得他是對的，兩方只是立場不同罷了，所以你真的不用太生氣別人做了什麼蠢事。


    如果你真的很想改變對方，那就用溝通的、用影響的，讓他知道你希望他改變決定的理由以及他為什麼要這樣做的原因。一味地用控制、用逼的，都沒辦法讓對方長期心甘情願去做你希望他做的事。只有讓他知道「為何而戰、為誰而戰」（註2），讓他知道做這件事情對他的原因和重要性，你才能真正改變一個人。


