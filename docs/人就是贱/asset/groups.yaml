    ## 帕金森（Parkinson）管理定律：


    > 「一定有時間，看你願不願意而已。」


    英國的管理學學者帕金森（Parkinson）曾提出一個有名的管理定律，有人稱之為「身在職場，不得不明白的管理定律」。「如果你給一個人八小時做五件事，他會剛好花八小時把這五件事做完；但如果你一樣給他八小時，卻交代十件事要求他一定要做完，正常來說，他需要花兩倍的時間才能完成。但其實不然，員工還是會在八小時內，完成你指定的十件事情。」


    這就是帕金森的定律：「給你多久時間，你的工作就會做到多久。（Work expands so as to fill the time available for
    its completion.）」


    根據這個理論我們可以得知，只要你覺得這些事是你一定要做到的，你就會「開始」動腦設法提升效率，讓自己能在有限的時間內把「所有事情」都做到。（這也表示我們以前都沒什麼在動腦想創造雙贏，你應該知道普通人一輩子只開發了腦袋的2%～7%吧？）


    哈佛．艾克（T. Harv Eker）在《有錢人想的跟你不一樣》一書中也提到同樣的概念：「雖然你無法擁有全世界所有東西，但是我真的認為，你可以擁有『你真正想要的一切』。」


    這當然包括「時間」的運用，如果你真的想同時做好很多事情，就絕對可以創造「雙贏」。


    如果這樣還是沒辦法讓你看到真相，我直說吧！


    不是沒時間，是你不會用，是你不會安排。


    是你做事沒效率，是你什麼事都想自己一個人做。是你不會找到對的人幫忙。


    是你什麼事都拖到最後一秒鐘，才把自己搞得很慌亂。


    如果以上都不是，就是你讓太多「沒那麼重要」的人和事進入你的生命。當你做了太多不重要的事，你就沒時間把時間留給重要的人、重要的事，你更無法把時間留給你的「心」。


    ## 會遲到，是因為你不在乎


    我有位年收入千萬的企業家朋友曾說過：「因為在乎，所以我絕對不會忘記，我也絕對不會遲到。」我很佩服他說出這句話的勇氣，難怪他會有那樣的收入。正因為他「在乎」，所以他不


    只要你真的在乎，你不會忘記，你不會遲到。


    會拿任何理由來當成自己忘記和遲到的藉口。


    經過二年的觀察，我發現跟你約會時，會連續遲到個二、三次的人，他們跟任何人約會就幾乎不會「準時或提前到」；會準時到的人，他就幾乎都會準時到，無論你約哪裡。


    更好玩的是，我發現每個人都有「習慣遲到的分分鐘數」，有人習慣遲到五至十分鐘，有人習慣遲到長達半小時。像我以前就習慣遲到五至十分鐘，不多也不少，幾乎沒有例外。


    這不是路程遠不遠的問題，更不是交通堵塞、工作忙碌的問題，這還是「你覺得不重要」的問題。


    以前大學時，我跟一位同學每天早上約好九點整，在離我家一分鐘路程的頂溪捷運站碰面，準備一起去K書中心看書。三個月之中，我沒有一天準時，每天都遲到五至十分鐘（我真是服了我自己）。她最後跟我說：「拉米，我很難過你每天都遲到，因為這代表你不重視我們的約會。我從士林過來，但我沒有一天遲到過。」


    看著她落寞的表情，我知道自己做錯了什麼。現在回想起來，她說的沒錯，如果我真的很在乎一個人、一件事，或在乎我的承諾以及別人對我的信任，我是不可能遲到的。


    Lesson 4 不是沒錢、沒時間，是你覺得不重要，是你沒有心


    ## 「我不確定，到時候再說。」


    不知道你身邊有沒有那種「永遠沒辦法跟他確定時間的人」？這種人通常很「忙」，你跟他約時間，他是不願承諾的。他們永遠會跟你說「到時候再約」或是「我沒辦法跟你確定」。但我們仔細想想，如果你真的覺得這一件事情很重要，你會回答「我不確定，到時候再說」嗎？


    如果你你的未婚妻跟你說：「我們結婚日期就訂在12/25號中午，你當天早上七點整一定要到我家來幫忙。」


    你會跟她說「我不確定，到時候再說」嗎？


    ## 不願承諾的真相


    這種人通常跟時間的關係很差，他們「表面」上看來很忙，但就算實際上沒什麼事情，他也不願承諾。因為他不覺得你的事情很重要，而不承諾的原因只是擔心到時會不會有更重要的事情發生。也有可能是他在打安全牌，因為如果跟你確定了，他就一定要做到，所以他不想做這個「承諾」。


    所以你看到「真相」了嗎？


    對想約定好時間的人來說，這種人真的很討厭，因為你只有在時間接近的時候，才能知道他是否真的會答應你。就跟習慣遲到的人一樣，我們通常沒辦法信任這樣的人。如果有人常常沒辦法跟你確定時間，我相信你也很難會把事情交代給他。畢竟，誰喜歡跟一個常常沒辦法確定時間的人來往？而且，當對方總是無法確定時間時，就表示我們也無法確定自己的行程，讓彼此形成雙輸的局面。


    💡 如果真的相信，你敢承諾的。


    ## 如果你真的相信，你為什麼不敢承諾？


    老話一句：「己所不欲，勿施於人。」如果你也不喜歡不願承諾的人，我們就不要做這樣的人。要就要，不要就不要，別總是習慣等到最後一分鐘再給答案。人有一種很特殊的能力，就是「能看出對方是不是真的有事」的直覺，有些人你看得出來他是真的沒辦法那麼早確定，但多數人不過是在給自己留退路罷了。


    別忘了，如果你真的很在乎一件事，而且真的相信自己能做到，你會願意先承諾，你會願意先付出時間的，新郎、新娘在結婚時都願意做此承諾終身了（我知道有人會跟我靠夭：「以後還不是做不到？」）。我現在先不論以後做不做得到，但他們在承諾的當下，都是「相信」自己以後能做到，所以才敢承諾。如果你真的相信你做得到，你有什麼好不敢承諾的？


    如果我叫你承諾：「今天會繼續呼吸下去。」你會不敢嗎？所以這是「相信」與「不相信」的問題。


    Lesson 4

    不是沒錢、沒時間，是你覺得不重要，是你沒有心


    如果「沒錢」、「沒時間」可以阻止你，

    那就什麼都可以阻止你。


    只要你真的想要，你會說「我去擠時間」、「我來想辦法」、「我再跟你確定時間」。如果你真的想做一件事，就不要允許自己拿「沒錢」、「沒時間」這些爛理由來阻止你前進，因為如果「沒錢」、「沒時間」可以阻止你，就什麼都可以阻止你。


    當你下次不小心脫口說出「沒錢」、「沒時間」的時候，請你「叮咚」一下，把它當作一個關鍵字，好好思考「我是真的沒錢、沒時間」，還是「我覺得它沒那麼重要，所以我不願為它犧牲這些錢和時間？」在你聽到別人說「沒錢、沒時間」時，你也必須知道那只是很表面的說法，背後的原因不過是對方沒看到做這件事的價值罷了。


    探索你的心，為自己負責。當你開始練習不再說「沒錢」、「沒時間」，不久之後，你會開始看到事物背後的價值，而非表面的價錢和時間，也讓你看清楚這輩子非常重要的問題：「我願意為什麼付出代價？我到底要什麼？」
    (註2)


