    ## Lesson 3

    生命中最重要的問題——「你要什麼？」


    「你要什麼？」是個很重要的問題，

    因為人生就像一場馬拉松，而你必須問自己：

    「我愛的終點在哪裡？」


    或許你覺得：「人生，何苦那麼嚴肅？過一天算一天就好。」你說的沒錯，只想過好每一天，不去想未來要的是什麼，這並沒有錯，但「這真的是你要的嗎？」其實人生就像一場馬拉松，出生是你起跑的一刻，死亡是你越過終點線的時刻；每度過一天，就等於你又往前跑了一小步，跑完馬拉松的全程，你人生的馬拉松也就此結束。


    人生的起點和終點，或許我們不能決定，但我們能決定想跟誰一起跑、怎麼跑，以及要跑到哪裡去。


    或許你覺得人生的馬拉松還很長遠，你懶得思考、不願思考，或逃避思考，你只想「無腦地度過每一天」。但或許你沒發現，其實這場馬拉松你是踩在輸送帶上面的，就算你不動，人生的馬拉松還是每天在前進的。你可以不思考，每天讓輸送帶這樣帶著你走，但等到你跟所有人一起被輸送帶送到人生的終點時，你才發現：「原來這不是我想跑的馬拉松！」你想等到那天才來後悔嗎？


    或許你覺得時間過得很慢，永遠都有時間(註2)，那麼就讓我來提醒你一下吧！你今年幾歲了？你曾經有目標嗎？你的目標做到了多少？


    註2：請見〈不是沒錢、沒時間，是你覺得不重要，是你沒有心〉一文。


    💡 就算你會拖延，但時間不會等你。


    我在大學畢業23歲時訂下一個目標，五年內一定要當上主管，但訂完這目標後，我就沒放在心上，更別說為我的目標而努力。過了五年後的28歲，我發現我的薪水反而比五年前更少。你能想像那種感覺嗎？你可以想像如果我不改變，再過二十年，我還是會過著我不要的人生。


    時間不等 人，就算你什麼都不做，它也會帶你到什麼都不做之後該去的地方，給予你該有的結果。


    如果你不想等到跑到終點再後悔，請你現在就開始思考：「我要什麼？這是不是我想參加的馬拉松？」


    ## Lesson 3

    生命中最重要的問題——「你要什麼？」


    ## 生命，有時不在於找到對的答案，在於找到對的「問題」


    「生命，有時不在於找到對的答案，在於找到對的『問題』。」當初看到這句話，我沉思了很久，雖然還不瞭解這句話的意思，但依稀能感受到這句話的意義，於是我開始不斷問自己問題。漸漸地，我開始能瞭解這句話的精義，那就是：「問題對了，對的答案就會出現了。」


    ## 問題對了，對的答案就會出現了


    關於「你要什麼？」我常用一個簡單的情況來問大家：


    「如果今天你是個房東，在台北市有十間房子，一間自己住，九間租給別人。你什麼都不用做，每個月的月初就有五十萬的房租自動匯到你戶頭，生生世世、直到永遠，你會怎麼過你的人生？」


    請你花個五分鐘，至少寫下三個答案：「如果什麼事都不用做，每個月就有五十萬，你會做什麼？」


    💡 問題大了，對的答案才露出來。


    我看過有些書會請你寫下一些心得，但我也知道你從來沒照著做過。因為人就是討厭動腦思考和執行，所以才會落得現在這個地步，但這次不一樣。


    > 「在這個人世間，我到底要什麼？」


    對你來說，這是個無比重要的問題。你現在不問，難道要等你七老八十，躺在病床上才問自己「我到底要什麼」嗎？所以請靜下心來，問自己：「如果沒有時間和錢的限制，我想做什麼？」花點時間，寫得愈明確愈好，開始！


