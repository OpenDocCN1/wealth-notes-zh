    我常用這個方式來形容一個人在物質或心靈層次的成長：如果我把一個人的成長當作爬樓梯，當你的層次在五樓時，你可能覺得自己還不錯了，因為你是從一樓爬上來的，你知道一樓的生活；所以當你在五樓時，你也知道你不想再回到一樓了；但當你爬到十一樓時，你會發現「原來當初我住五樓時是那個樣子呀！」你也不會想再回去了。


    這樣的重點在於：你能不能讓自己不斷提升，讓你覺得「我不想再回去了」。


