    💡 不因做到而自傲，不因沒做到而鞭打自己。


    凡事看兩面：你做對了什麼，就勵自己繼續保持；你沒做到什麼，就努力改善


    有一次公司總裁跟大家分享她的故事，她說：「小時候如果我考98分，回家後媽媽第一個問我的問題是：『那2分怎麼丟掉的？』第二個問題是：『有幾個同學拿滿分？』」


    大家在聽到這個故事時，不禁發出驚呼聲，覺得總裁的媽媽實在是太苛求了。但沒想到後來總裁卻說：「等到我有了孩子，我也問我兒子同樣的問題。」台下頓是一片譁然。


    「我今天是個競爭力滿強的人，都要歸功於此。不是說單純地要跟你旁邊的人比，是要你跟自己比。我常問我兒子：『你有沒有盡力？如果你盡力了，那無所謂。但如果你盡力了，還丟了10分、20分，那就說明你時間花錯了，我們要看看是哪裡錯了，這樣才可以前進。』大家的聰明才智都差不多，差別在於誰會針對已經做到的事繼續加強，誰會針對犯過的錯誤改進罷了。」


    聽完她這番話，我們恍然大悟，難怪她是總裁，我們不是。


    做到了，繼續保持做得好的地方，設法再做得更好，同時也找出「沒做好的地方」，讓自己慢慢成長。不因做到而自傲，不因沒做到而鞭打自己，凡事看兩面，是讓自己成長最快的方式。'
  - '[PAGE 174]


    # 看著你有的，也看著你沒有的


    小時候，每當我對自己很沒信心、覺得自己什麼都做不好、開始心慌的時候，我就會用力告訴自己：「拉米，別慌，去看著你已經做到的地方，去看著你現在擁有的一切。」


    那時我會找一個自己的優點或是我已經做到的事情，這個優點就是我心慌時的「地基」。說也奇怪，每當我看著我的「地基」，一把注意力轉換了以後，我就不慌了，可以不疾不徐地處理我接下來該做的事情，因為我看著我現在擁有的東西。


    當我覺得自己很厲害的時候，我也會用力告訴我自己：「別這樣就滿足了，看著你還沒做到的、你還沒有的。而且，人外有人，別自以為這樣就很了不起。」於是我就不自滿了，因為我看著「我還沒做到什麼？我還可以怎麼做？」


    於是我的生命，就在這一進一退之間，看著我有的，也看著我沒有的，同時看著太極的圓，不慌張也不自滿地慢慢進步了。


    開放，凡事看二面，唯有同時看著黑白兩面的「圓」，你才看得到人生的「太極」。'
