    # 犯錯又如何，我現在該怎麼做？


    上個月我接到一個難度極高的翻譯，由於事前評估過於草率，我沒想到以前一小時能翻一頁的量，在這次的案子，平均卻要四到五個小時才能翻譯完一頁。六年前我也曾遇過類似的情形，那時我曾經責怪自己：「我真是笨，怎麼把case也要接？」於是當時就在犧牲、抱怨、慌張的情緒中，好不容易才完成了那份翻譯稿件。


    這次，我想到主管說過的那句話：「我一直在找問題。」當下便轉了個念——既然已經接下了這個翻譯，就別想太多。抱怨、後悔都於事無補(註1)，努力去做就是了。而且「如果我解決了這次的十級風暴，以後碰上類似的八級風暴就再也難不倒我了」。何況我這次用心完成了稿件，以後客戶或許還會繼續幫我介紹新的案件呢！


    當我的心「決定」要這麼想，心情便平靜了起來。我開始認真安排可以翻譯的時間，跟雇主道歉，說明自己錯估時間和難度，並希望雇主能把時間延後。如果雇主不同意，我就再找別人


