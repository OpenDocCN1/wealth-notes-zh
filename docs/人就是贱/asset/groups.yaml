    \n所以我也想問你一樣的問題：「你要什麼？」\n\n# 你真的知道你要什麼嗎？\n\n# 還是你已經失去了「做夢」的勇氣和能力？\n\n小時候，老師要你在課堂上寫出「我的志願」，幾乎所有同學都能寫出「我要當老師」、「我要當科學家」或「我要當總統」這類大家或許真的很有興趣的目標；但等到出社會了，要你說出：「我要什麼？」所有人卻都回答不來了。有時候可能是我們「真的不知道自己要什麼」，也有可能是「我們知道做不到，於是失去了做夢的勇氣」，以致於不斷隨波逐流，大家做什麼，你就做什麼，這社會要我們做什麼，我們就做什麼。\n\
