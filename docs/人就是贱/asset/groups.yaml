    - (ψ)² 你唯一的人生，值得你奮哉一次。


    最後，我老實說，這是個需要承認的課程，我保證它絕對不像你以前上的課程一樣，坐在那邊聽完就行了。它是需要你離開安全區，讓你改變的一個課程，所以它適合真正想要改變的人。如果你是個不想改變的人，你不適用這篇，因為改變人生，成為自己想成為的人，那是需要勇氣的。如果你沒勇氣，卻又忍不住看完這一篇，我跟你說聲抱歉，因為上三階段課程是需要一個願意勇敢、願意改變、願意讓自己發揮能力的人才適合去上的，所以如果你不願付出、不願勇敢、不願改變，我會說：「別傻了，你不適合的。」


    但如果你真的願意給自己一次改變的機會，我會認真問你：「為你的人生衝一次，你敢嗎？」


