    💡 只要你想要，你會找到方法；如果不想要，你會找到藉口。


    練舞、家人的反對、我還有工作要做、還有一堆事情要處理……。以前遇到這麼多困難，早該放棄八百次的我，竟然都不覺得這些是困難，因為我心中只想著一個目標，那就是：「它對我很重要，我要做到它！我一定要：沒有事情擋得住我！」


    ## 注視你要打的落點，而不是你手上的球


    「讓結果發生！」這是我當時唯一的想法。因為有這個一定要做到的目標，所以不在乎過程是如何，我也不覺得辛苦，就因為「我看著我的目標」。我要達到這個目標，而不是看著我眼前的障礙讓我裹足不前，就好像打保齡球一樣，必須注視著球在遠方的落點，而不是手上那顆讓你覺得很重的保齡球。


    於是在2010年的12月25日，我完成了這支7分鐘的舞。因為這支在人群中表演7分鐘的舞蹈，它讓我打從心裡相信「只要我想做，我一定做得到」，也讓我從此不再對我想要的事說做不到或不可能，我會說：「它很難，但讓我去想辦法，去努力。」練習這支舞花了我三個月的時間，但它給我的力量和「相信」卻可以讓我用一輩子。


    你可能會跟我說：「我也想跟你一樣勇敢啊！但我就是很害怕，那我可以等到我不怕了，等我不怕了再去做嗎？那些人有錢有勢，又歷經大風大浪，當然不會怕啊！」


    我一定會回答你：「你當然可以等到不怕了再做，只是你可能永遠等不到那一天。而且你完全搞反了，有錢人並不是不會怕，他們是先願意勇敢才有錢的，而且有錢了之後，他們也還是『會怕，但還是要去做』。」


    💡 會怕，但還是要去做。


    ## 你唯一的人生，等你勇敢一次


    ## 有錢人也是「會怕，但還是要去做」


    前幾天有機會跟我朋友Evely聊天，她是某間大公司的總經理。我問她：「你每天面對那麼多事情，會不會有一些是你做起來很不習慣、很不舒服的？」因為在我眼中，她就是個做什麼都很自在、很習慣去銷售、很有自信、很習慣同時處理很多事情，而且是「什麼事都沒在怕」的人。


    她接下來的回答，著實讓我聽到時下巴都快掉下來了……。


    「我沒有一天是舒服的。每次接到總裁打來的電話，我都不想接，因為他打來就表示有一堆問題了，但我都會第一時間接起來，因為我要讓他知道『我．不．怕』，愈怕我愈要接。」


    聽完這段話，我跟她說：「謝謝你，我以前就一直在想，像你們這樣的成功人士，是不是也會害怕，但我身邊沒有這樣願意面對自己恐懼的人，所以我不知道該跟誰確認我的想法。謝謝你，你讓我知道我的想法是正確的。」


    所以你知道了嗎？成功人士並不是不會失敗，也不是不會害怕


    怕，只是他們在面對問題和恐懼時，會告訴自己：「會怕，但我還是要去做。」


    所以你知道你和成功人士的差別了嗎？


    > 「凡人心所能想像並相信的，終必能夠實現。」

    ——拿破崙．希爾《思考致富》


    「凡人心所能想像並且相信的，終必能夠實現。」這是成功學之父拿破崙．希爾（Napoleon Hill）留給後世的格言，是他用二十年的光陰採訪了美國504位成功人士的最重要感想。


    以前看到這些格言時，我能明白他們講的沒錯，但我沒有太多感覺。但自從完成Michael Jackson那支舞蹈後，我才深刻體會到這些成功人士都是「來真的」，因為「那是沒做過的人寫不出來的體驗」，因為我也做到了，所以才「發自內心地相信了」，而不只是表面上的「我知道書上講的沒錯」如此而已。


    知名好萊塢影星丹佐．華盛頓（Denzel Washington）在對美國賓州大學畢業生演講時曾說過：「我老婆告訴我：『要得到一些你從未擁有的，你必須做一些從未嘗試的事；人生中沒有任何事比勇於冒險更有價值，沒有任何事。』」


    ## 上帝很公平，祂不會將成功分給所有人


    很多人總幻想得到一些自己不曾有過的財富、聲望，卻從不嘗試自己沒做過的東西，只會抱怨周遭的事物，抱怨上帝對他不公平。我老實跟你說，我覺得上帝超公平的，所以成功才會屬於那些願意勇敢、願意挑戰自己的人，所以上帝才不會將成功分給所有人。還記得維基百科對安全區的定義嗎？「非常成功的人通常會走出自己的舒適區，去達成自己的目標。」


    你走出你的舒適區，你試著勇敢了嗎？如果沒有，如果你還是躲在強大舒適區的龜殼裡，你告訴我你憑什麼成功？你憑什麼過跟別人不一样的生活？


    ## 如果我們一輩子都只敢挑有把握的事做，那你怎麼知道你的能耐會在哪？


    如果你 心中有很想做的事情，卻一直看著「我會失去什麼」、「我會丟臉」，那麼這些障礙是永遠看不完的。讓自己思考「我要什麼？」、「我到底要什麼？」(註5)、「做到這件事對我為何那麼重要？」、「如果做到了，我一定會很開心」，你就不會陷入不敢行動的困境，而這一切的改變，不過是轉變了一個思考方向罷了(註6)。


    註5：請見〈生命中最重要的問題，「你要什麼？」〉一文。

    註6：請見〈轉念，是所有問題的答案〉一文。


    下次，當你覺得你很想做一件事，卻發現自己的心一直被恐懼佔據時，我請你永遠記住這句38度金門高粱的廣告詞(註7)，然後當你害怕時在心裡對自己說：「如果我們一輩子都只敢挑有把握的事做，那你要怎麼知道你的能耐會在哪？」


    你唯一的人生，等你勇敢一次。


    ## Lesson 03


    學到的東西不持久。不是誰的問題。

    是「你」的問題


    > 「為什麼學了沒用？

    因為你學了以後，沒有『用』！」


    ![](img/7a3931d50c2c9383cc41488956e04ae5_195_0.png)


    ## 學到的東西不持久，不是誰的問題，是「你」的問題


    這本書快到尾聲了，我必須告訴你另一個真相，不然你看完《人，就是賤》以後，還是會怪這本書沒用。


    以前上潛能開發課程的時候，我常被問到一個問題：「這課程的效果能持久嗎？」


    每次聽到這個問題，我總會給發問者一個大大的微笑，並回答：「如果你當下有學到東西，那麼它能不能持久不是課程本身或老師能決定的，是你決定的。」


    如果你曾經覺得某個觀念、某個想法、某本書或某個課程讓你很有感覺，收穫很多；但時間久了，你開始發現這些觀念、想法、好書、課程，開始對你沒有影響力了。這時，你會思考：「是不是這些書、觀念、課程或老師沒有用？」


    我老實告訴你吧！只要你當下覺得有收穫，後來卻覺得「軟掉了」，請不要把責任怪罪到那本書、那些課程，或是那些老師身上，因為那都是你自己的問題。


    一切不是別人的問題，是你的問題。


    因為除了你自己，這世上沒有人能一輩子盯著你。問題在你身上，是你自己沒有努力讓這些收穫在你身上持續下去的。


    國中時，補習班的英文老師教得很好，她打通了我好多文法觀念，開啟了我以後「不斷思考英文」的路，也讓我在國中、高中的學生生涯，英文成績都是班上的第一名。然而，當時跟我一起去補習班的最好同學艾倫也聽懂了老師說的觀念，卻沒有持續把老師教他的觀念拿出來複習，拿出來用。因此雖然他當時懂了，但後來就再也不懂了，於是他考大學時英文只有8分。


    這就像鑄劍的老師父把倚天劍鑄好交給你，你剛拿到手的時候欣喜若狂，發現它可以拿來砍樹殺敵；但過了幾個月，你對倚天劍沒興趣了，從此沒把倚天劍拿出來磨一磨、殺殺敵人，最後它漸漸生鏽，變成一把爛劍。有一天敵人殺過來了，你情急之下拿出倚天劍準備殺敵，卻發現倚天劍竟一砍就斷，這時你會怪倚天劍沒用？還是怪當時老師父沒把劍鑄好？


    所以別再塞拖了，如果你當下有學到東西，但後來這效果不持久，那不是誰的問題，是「你」的問題。


    ## Lesson 13


    ## 自責。後悔？

    一秒鐘都不要


    > 「我做過的事情從不後悔。」

    ——日本劍聖，宮本武藏


    ![](img/7a3931d50c2c9383cc41488956e04ae5_199_0.png)


    ## 別自責，別後悔，因為那沒有意義


    看完這篇後，我要你開始做一個很簡單的練習。這個練習將改變你的一生，讓你不再沉溺於過去的錯誤與悔恨之中。


    從現在開始，當你做錯任何事，我是指「任．何．事」，都不要為所犯的錯責怪自己或後悔一秒鐘。無論你犯的錯有多嚴重、多愚蠢，無論有多少人罵你、笑你，都不要去鞭打自己或後悔當初的決定，就連0.1秒都不要。


    當你發現在後悔或責怪自己時，請大聲在心中告訴自己：「停！自責、後悔，都是沒有用的，因為我已經做出當時最好的選擇了。現在最重要的是：我從這次的錯誤中學到什麼？我現在該做什麼？我下次該怎麼做？」


    接下來，我來告訴你理論基礎。


    ## 如果後悔、鞭打自己有用，那就不後悔、鞭打自己；如果沒用，請停止這無聊的行為


    「人只要活在這世界上，不可能不犯錯。」我想這點沒人敢否認，但你有沒有想過？在犯錯的當下，你常花多少時間去責怪


    💡 永遠別說：「早知道。」


    自己？在事後又花多少時間去後悔當初不該這麼做？


    讓我告訴你吧！如果你花一秒鐘在責怪自己，你就是在浪費那一秒鐘；如果你花一秒鐘在後悔，你也是浪費那一秒鐘。你自責、後悔的時間愈長，就離解決問題的起點愈遠。


    人為什麼要後悔呢？「後悔」這兩個字從字義上來看就是：「希望當初可以把某件事做得更好。」也可以說，如果時光倒流，能重新做選擇，我會有不同的決定。基於這個定義，所以你才會後悔。但聰明的你，發現「後悔」這兩個字在邏輯上就有個超級大問題嗎？


    ## 時．光．不．能．倒．流


    你後悔，不過是在哀怨，不過是希望時光能倒流，能改變過去的決定或行為；但就連白癡也知道時光不能倒流，所以你花任何一秒鐘在後悔上有什麼用？《丹尼士文摘》裡提及：「後悔是一種耗費精神的情緒，後悔是比損失更大的損失，比錯誤更大的錯誤，所以不要後悔。」


    無論做錯什麼事，你都做了當時認為最好的選擇，所以沒必要感到後悔


    這個觀念很重要，因為光是瞭解這個觀念，你就能從後悔和自責中徹底自由。


    我們會後悔，大多是覺得：「我當初如果不這麼做，現在就不會是這個結果了。」但你可以仔細回想一下，在犯下任何過錯的時候，你不也認為自己當時是對的，所以才去做的嗎？


    或許你後悔當初選擇嫁了這個老公（或娶了這個老婆），但在結婚的當下，你不也覺得他（她）可以陪你度過一輩子，才跟他結為連理？所以你根本不需後悔。


    如果你後悔當初選工作時，沒有選比較有前途的工作，那也是因為你在決定的當下，基於各種原因，認為那時的選擇是最好的，所以你當然也不需要後悔。


    因為如果你知道有更好的選擇、更好的方式，你就會去做；就算你知道該怎麼做好，但你當時還是選擇不那麼做，或許是你不想付代價，或是害怕些什麼，或是純粹想偷懶。但總歸一句，你還是做了當時「最好的選擇」，所以你現在還是不需要後悔。


    日本史上最著名的劍聖宮本武藏說過：「我做過的事情從不後悔。」這就是一種對自己的行為負完全責任的心態(註1)。


    註1：請見〈世上沒有意外，你是一切問題的根源，也是一切問題的答案〉一文。


    ## 永遠別說：「早知道……。」


    「後悔」常見的搭配詞是「早知道」，例如：「我好後悔當初……早知道我就……了！」


    這句話你是不是很熟悉？千金難買早知道，千金還不只是難買早知道，是根本買不到早知道！好比窮人如果早知道，就都去買樂透中獎號碼了，這世上也就不會有窮人了。所以不要再說「早知道」，這三個字對你的人生沒有任何幫助。如果你很愛說這三個字，我勸你趁早讓這三個沒意義的字離開你的生命。


    自責也是一樣。我們常看到很多人只要一做錯事或不順心，就會心情難過，開始自責、鞭打自己。或許是不自覺，也或許是以為這樣可以減輕你犯錯的程度，讓別人原諒你，但你的自責和內疚並不會讓現狀更好，別騙自己了，那是假象。自責、鞭打的唯一作用，就是延緩你從失敗中站起來的時間罷了。所以同樣地，你也不需要花任何一秒鐘在自責上，因為那同樣是在浪費你的生命。


    ## 永遠問自己：「從這件事情當中，我學到了什麼？」告訴自己：「失敗又如何？現在該怎麼做？」


    我要你練習不要自責和後悔，但不是要你厚著臉皮，面對所有失敗都一副無所謂的樣子。在你每次犯錯或發現自己在自責時，你可以微笑問自己：「嗯，這次我做錯了，但從這件事情


    中，我學到了什麼？」或是：「這次失敗了，那又怎樣？誰沒失敗過。那我現在該怎麼做？」


    如果你是保險業務，這個月因為沒達成業績被主管叫進去辦公室訓了一頓。在轉身離開辦公室的當下，你心情一定不好，或許還會習慣性地責怪自己：「我好糟喔！我怎麼什麼都不會？」但是，當你發現你在自責的時候，問自己：「嗯，這個月我的確沒做好，但從這件事情中，我學到了什麼？」或許業績沒達到是因為你沒有努力跑客戶，下個月再改進就行了；也或許是你的專業知識還不夠，把這些專業知識補充好，以後面對客戶就不會語塞了。其實換個角度想，每次的失敗，都是讓你成長的動力(註2)，所以永遠不要責怪自己，鞭打自己，永遠不要，因為那沒用。


    再提醒你一次——每當我出現想自責的念頭時，就會在心裡告訴自己這兩句話：


    「失敗又如何，我現在該怎麼做？」


    「從這件事情當中，我學到了什麼？」


    每次我說出這兩句話，心情就會好很多，因為它讓我「接受失敗」，不再因為無法接受做錯事而讓情緒有所起伏。而我沒想到的是，承認失敗竟然可以讓我更接受現實，帶給我一種平靜的力量。


    註2：請見〈轉念，是所有問題的答案〉一文。


    💡 不怕死的最大，當你愛上自己時，你就無敵了。


    ## 「接受」，讓你自在


    ## 接受，帶給你平靜的力量


    接受，不是你放下、不是要你放棄，只是要你不帶情緒，沒有好壞、沒有對錯的接受這是個客觀的事實，如此而已。


    ## 別逃避，去「接受」。

    就連你最自卑、最不擅的往事也是如此


    我從小額頭就很高，所以從小「清朝人」、「秃頭」這些關於頭髮少的外號就一直跟我形影不離。我也曾經因此極度自卑，覺得爸媽怎麼會把我生得跟別人都不一樣。只要別人直視我，眼神飄到我頭頂上的時候，我的腦袋就開始跟自己對話：「他一定是覺得我的額頭很高！」


    之後我就一直在找證據，找什麼證據呢？找有沒有人額頭比我高的證據。結果國中沒被我找到，高中倒被我找到一、二個同學跟我額頭一樣高的。結果我有比較開心嗎？！


    並沒有。


    我只是很同情他們，覺得他們跟我一樣可憐，也開始更同情


    自己。我高中過得一點都不開心，因為我被自己的額頭卡住了，就這麼簡單。我做什麼事都提不起勁，因為我沒自信。


    後來只要有同學虧我額頭高、頭髮少的時候，我總是很想閃避這個話題。但是我發現我愈閃避，這些同學就愈愛虧我；而他們愈虧我，我就愈不舒服，這簡直就是一個無止境的惡性循環與惡夢。


    不怕死的最大，當你接受自己的現狀時... 你就無敵了


    直到一次的潛能開發課程後(註3)，我終於接受了「額頭高」是我的身體的一部分，它沒有對錯，我接受它就是了。當我發現自己可以接受額頭高的那一秒鐘，我感受到的是完全的自由，那是種無比的自在。


    從那一秒開始，我笑了，因為我知道我無敵了，這世上將沒有任何東西能打倒我，就因為「我·接·受·了」。


    從此，當別人虧我的時候，我都會大方承認，笑著說：「是啊！我額頭的確是很高，我已經接受我以後會秃頭了，不過那就是我。」


