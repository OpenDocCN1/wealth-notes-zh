    ## 擁有你的心，而不是

    讓你的心控制你


    ## 傷痛無法被刻意遺忘，但你可以學會治好自己


    大學時，我第一次失戀，當時腦袋一直想到以前的畫面，所以每天都過得很痛苦，幾乎踏上的每件事，都能讓我對號入座，回想起當時甜蜜的景象與現在的好景不在。當時，我終於能體會「行屍走肉」是什麼意思，我整顆腦袋都被痛苦塞滿了，看到什麼都不對，看到什麼都痛苦，也第一次感受到心痛的感覺。每次一想到分手了，就讓自己陷在難過的情緒好久。當時的我，什麼事都不想做，也什麼事都不能做，因為腦袋都塞滿痛苦的回憶，我還能做什麼？


    就這樣過了一個月，我開始意識到我幹嘛一直允許自己去想分手這件事？而且還食髓知味，每天花好多時間在痛苦、埋怨、鞭打自己，連我自己都覺得很煩。看起來，我好像無法控制我的思緒，所以才會讓自己這麼難過，但「看起來」終究只是「看起來」，我發現「人真的是變態來著，明知道一直想會難過，但還是要讓自己一直想」。


    擁有你的心，而不是讓你的心控制你。


    ## 人真的是變態來著，

    明知道一直想會難過，但還是要讓自己一直想


    因為不想再當個折磨自己的變態，我開始思考一件事，這也成為至今我人生中最重要的一个問題：「我可不可以靠自己的力量，來『打斷』那些痛苦的思想呢？」


    我當時感覺我可以，於是我開始練習控制自己的心。


    從此，每當我又開始難過，想起與前女友的點點滴滴，當我一發現自己在難過時，我都會閉上眼睛一秒鐘，在心中用力告訴自己：「停！！！」（其實少了幾個字，就是「你他×的給我停！！！」）


    我把自己當作一台大型行動隨身聽（當時還沒有MP3，猜到我的年紀了吧！），當心中又開始播放讓自己難過的言語或畫面時，我就會刻意讓自己按下「STOP」鍵，把心中那一幕幕悲傷的畫面或思緒按掉。


    剛開始，我需要花很大的力氣，不斷提醒自己，在心中不停地按「STOP」，有時候剛按完「STOP」，腦袋又不由自主地「PLAY」起來。但只要一被我發現，我就又很努力地按下「STOP」。於是我發現，自從開始練習「控制自己的心」，不到幾天，我每天難過的次數和每次難過延續的時間都變得愈來愈


    ![](img/7a3931d50c2c9383cc41488956e04ae5_91_0.png)


    短。因為那就像一齣悲劇，如果你才瞄不到幾秒鐘就被人家一直關機重開，這樣你還哭得下去，也算我服你了。


    又過了不到一個月，我練到每當腦中一浮現「難過的fu」時，我就立刻在心中喊：「你他媽給我停～～！」讓腦中的惡魔只能出現幾秒，沒機會繼續成長茁壯。


    經過這樣的練習之後，我發現人生最重要的絕招——「原來情緒是真的可以控制的」。當時，我並沒有刻意讓自己在打斷思緒後，去想一些美好的畫面，我就是不停打斷它，然後做接下來該做的事，去該去的地方，想該想的事。


    ## 我可以擁有我的心、我的情緒，而不是讓它們控制我


    經歷了那次失戀，我發現原來我可以靠自己的力量，主動控制自己的心。以前只要有壞事發生，我的心和情緒都會輕易控制我，讓我難過、不爽或自責好幾天，因為那時我並不是心和情緒的主人，是我允許它們控制了我。直到那次失戀，我才開始感覺到，原來心和情緒就像是一部汽車，真正握著方向盤在開車的人是「我」。既然如此，我怎麼可以讓我的車帶著我到處亂跑，還跑到我不想去的目的地呢？


    那次失戀，讓我展開這輩子最受用的自我訓練。每當我遇到情緒波動時，我就用「STOP」這個方法，讓我的思緒不要專注在負面的事情上，不讓我的人生被這些鬼情緒攪擾。


    💡 轉念，是所有問題的答案。


    ## 轉。念


    ## 轉念，才是所有問題的答案


    後來我發現，用「STOP」這一招的確是可以治標，解決當下過不去的情緒，但我難過的點其實並沒有真正消除，真正治本的方式其實得靠「轉念」。轉念，就字面上來說，就是「轉」向你的「念」頭。


    自從《秘密》這本書出版之後，「吸引力法則」便成為大家討論的話題。我相信你一定也看過很多「正面思考」的書或觀念，但真正的轉念並不是要你不去看負面的情緒，然後用正面的想法去壓抑，去逃避負面的事。轉念是要你學會從不同的角度看事情，所以你並沒有逃避任何負面的情緒或事情。


    ## 請練習用不同角度看事情


    有一位老先生每天捧著一束花到過世妻子的墳前跟她說話。有兩個人每天看到這種情景，其中一個人說：「這老先生多愛他太太啊！每天都來跟她說話。」另一個人則說：「錯了，他以前一定做了很多對不起他太太的事，所以現在才需要每天來懺悔。」


    同樣一件事，不同的人會以不同的角度看待，一百個人就可能有一百種角度和想法。你雖然只是一個人，但你也可以練習用不同角度來看同一件事情。悲觀的人具有把好事想成壞事的傾向，樂觀的人則有把壞事想成好事的能力。而把壞事轉化的能力，最重要的理論基礎在於「事物本身沒有意義，除非我們賦予它意義」。


    ## 事物本身沒有意義，除非我們賦予它意義


    「事物本身沒有意義，除非我們賦予它意義」是《有錢人想的跟你不一樣》書中的一句話，第一次看到這句話，我忍不住睜大眼睛，反覆思考這句感覺很有哲理、又似乎很沒道理的話是什麼意思？後來，我發現這句話就是轉念最重要的精髓。而轉念，不過是訓練我們用不同角度來看事情、看世界、看人的方式。


    ## 發生什麼事情並不重要，重要的是你怎麼看待這件事情


    有位白手起家的建商，賺了許多錢，但因經濟不景氣導致經商失敗，欠債累累。這天晚上，他一時想不開要跳河自殺，便在三更半夜來到河邊。他在河邊看見一位少女哭哭啼啼，便問道：「小姐，三更半夜你來這裡，是要做什麼呢？」


    小姐回答：「我被男朋友拋棄了，我不想活了！因為沒有他，我活不下去。」


    事物本身沒有意義，除非我們賦予它意義。


    建商一聽，便說：「這就怪了。在還沒有男朋友之前，你還是活得好好的？」


    少女恍然大悟，當下就放棄了尋死的念頭。


    此時，建商心想：「在沒有這麼多錢以前，我不也是白手起家的嗎？」


    少女此時反問建商：「三更半夜，你又為何來這裡？」


    建商回答：「也沒什麼啦！只是出來散散步。」


    被男朋友拋棄的確令人難過，但要是我們一直想著「以前在一起有多甜蜜」，只會讓自己愈想愈難過，導致很多人把自己的心愈鑽愈深，最後鑽到死胡同、鑽到無底洞裡出不來，這時若不是搞得你自己關自縊，就是朋友被你煩到想自縊（我說真的）。


    但就如建商說的：「沒有男朋友之前，你還不是活得好好的？」轉念，只是要我們在遇到事情時，努力試著往另一個方向去想（我指「努力」去想，不是叫你又放縱自己，無意識地回到之前的鬼打牆裡）。


    面對失戀，真的只能有「難過」這一種想法嗎？


    ![](img/7a3931d50c2c9383cc41488956e04ae5_95_0.png)


    失戀了，你可以很難過、怨天尤人個三、五年，讓自己變成行屍走肉，讓全世界都覺得你很可憐。你成功讓大家相信你很可憐了，但那又如何？最後痛苦的還不是你自己？同樣是失戀，你也可以有以下幾種想法：


    - 1. 另一半是因為真的不適合才會分手。如果以後結婚了，也只是徒增困擾罷了，所以這是好事。

    - 2. 即使分手了，對方依舊給了你一段甜蜜的回憶，所以這是好事。

    - 3. 或許是對方不要你了，你可以覺得對方不識貨，沒眼光。擁有你是，我一輩子的幸福，但失去你，我才能找到更好的人，所以這是好事。

    - 4. 如果是因為對方劈腿而分手，我相信你也不希望跟這樣的人共度下半輩子，所以早點分手反而是好事。


    你可以有無數個理由告訴自己分手是好事。對於同一件事情，你可以有千千萬萬種想法。悲觀的人常常會選擇讓自己難過的念頭，但樂觀的人，卻總是找得到讓自己開心的理由。


    我直說吧！無論這件事情看起來有多糟，你一定找得到一種角度，一個讓心不再難過、讓你放過自己的理由。


    所以分手是好事還是壞事？你的心決定它是好事，它就是好事；你的心決定它是壞事，它就是壞事。而且你的決定會跟著你


    學會轉念，因為你的心會跟著你一輩子。


    一輩子，所以我請你好好學會「轉念」這件事。


    ## 你的心決定它是爛事，它就是爛事，

    而且你的決定會跟著你一輩子


    我再舉個最極端的例子，你會發現無論多難過的事，我們都能用轉念來解決。大約五年前的某一天，我爸有幾天沒回家，我問媽媽：「爸到哪裡去了？」


    > 我媽回答：「阿嬤過世了，爸爸回南部奔喪。」


    當下我聽到的第一秒就淚崩了。那時我才知道，原本阿嬤對我來說就跟空氣一樣，直到她過世，我才知道她對我有多麼重要。自從我有印象以來，每年過年回南部，阿嬤總會準備一桌真的很豐盛的菜給我們小孩們吃，我當時以為是阿嬤跟阿姨們一起做的，因為我不覺得她都快90歲了，會有那個體力自己做出這樣一桌菜來。


    一直到阿嬤過世後，我問媽媽，她才告訴我：「都是阿嬤一個人做的。她知道我們每年初二會來吃午餐，所以她都會從當天一大早就開始準備。」聽到這句話，我又開始淚如雨下，因為我終於知道她有多麼在乎我們。


    以前的我，跟阿嬤沒有太多互動，但仍會跟和藹的阿嬤點頭


    微笑。知道她過世的那一秒鐘，我愣住了，我很生氣地問媽媽：「為什麼你們當初不告訴我阿嬤病危，讓我有機會去見她一面，還是我主動問才跟我說？」我當下有很大的憤怒和疑問。


    媽媽說：「我們想說你們一年才和阿嬤見一次面，沒有那麼親，就不讓你們擔心那麼多了。」


    之後幾個月，我滿腦子都在想：「你們憑什麼可以不告訴我？」心中有強烈的遺憾與後悔(註1)，覺得以前我為什麼不跟阿嬤說聲謝謝，或多跟她說些話。


    但後來，一個念頭讓我徹底轉念，讓我的心從阿嬤的過世中自由，因為我開始從阿嬤的角度去想這件事。


    有一天，我再次想起阿嬤滿臉皺紋卻又慈祥的臉，我想到：「阿嬤在天堂，她一定一定不希望我為她這麼難過，也一定不希望我因而討厭爸媽。阿嬤過世了，爸媽一定比我更難過，畢竟那是他們的媽媽，他們不跟我說，一定有他們的理由。最重要是，如果我是阿嬤，在天上看到我這麼難過，一定也不會開心的。」


