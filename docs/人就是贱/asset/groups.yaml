    發生」的問題，而只是「何時發生」的問題，請你耐心地「給時間一點時間」。


    哥倫布（Christopher Columbus）第一次航行在沒有航海圖的北大西洋時，他每天在航海日誌上寫著：「今天我們繼續航行，方向西南西。」


    當時情況非常惡劣，因為暴風雨不斷侵襲，已損及小桅船，而船上也有一些水手醺醺著黯然變。哥倫布在茫茫大海中，感到希望逐漸渺茫，信心似乎也開始動搖。


    然而，在無助之時，哥倫布回過神，再次堅定地告訴水手：「今天我們繼續航行，方向西南西。」最後，他終於找到新大陸，也留下這句經典名言：「今天方向西南西。」


    這是我在重考大學時，老師告訴我們的故事，我一直沒有忘。雖然堅持是最難的事情，但是只要我確認方向沒錯，當我覺得很煩、很累、想放棄時我都會告訴自己：「今天我要繼續航行，方向西南西。」


