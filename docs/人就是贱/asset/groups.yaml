    人生，是一個圈——真相，觀你的心自由'
  - "[PAGE 18]\n\n# 這本書，也是一個圈\n\n另外，這本書本身也是一個「圈」。首先，這本書的每個段落都可以分開閱讀，就像任何東西的一個「點」一樣，每個段落都表達出完整的意義。所以如果你真的很懶，你要跳著看我也沒意見，但看到最後，你終究會連成一個「圓」。\
