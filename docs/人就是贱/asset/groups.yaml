    ## Lesson 8

    ### 世上沒有意外，你是一切問題的根源，也是一切問題的答案


    慣，但習慣分成「習慣去做」，或「習慣不去做」，只不過大家都「習慣不去做」罷了。


    如果你也是那個習慣不願選擇、不敢做決定、習慣不去做的一份子，當你以為不做選擇就不用負責任，就可以縮在自己設定好的安全區裡，其實你是在拿自己的人生開玩笑。因為當你不做決定的時候，其實你已經在做一種決定了，你的答案是「選擇安於現狀」與「選擇不改變」。


    ## 你可以不選擇，但時間不會等你


    很可悲的，時間的迷宮不會等人，你的「不選擇」也是一個選擇，它一樣會帶你到「不做選擇」該去的地方，該有的結果。


    人真的很犯賤，給你選擇的時候你不選，一旦最後結果不是你要的，又要抱怨自己沒選擇。


    法國著名作家米蘭．昆德拉（Milan Kundera）曾說過：「永遠不要認為自己可以逃避，我們的每一步都決定著最後的結局，我們的腳正在走向我們自己選定的終點。」


    達賴喇嘛也說過：「要知道我們的現在，看看我們五年前的選擇就知道了；要知道五年後的我們，看著我們現在的選擇就知道了。」


    💡 如果你一直做同樣的事，卻想要不同結果，你一定是瘋了。


    如果你對現在的結果並不滿意，請你選擇改變而非抱怨，因為抱怨對改變狀況而言是「無效」的行為。如果你走進一條死巷，你是會停下來不斷抱怨前方怎麼沒路了？還是退回來選擇換個方向走呢？


    愛因斯坦（Albert Einstein）曾說過：「如果你一直 在做同樣的事，卻想要不同的結果，那你一定是瘋子。」


    看到最後，你還是可以當個很犢的受害者，繼續怪政府、怪世上所有人，做你之前在做的事，然後還希望你的人生有所改變，當個愛因斯坦眼中的「瘋子」。因為這是你的人生，你擁有「絕對的主導權」。


