    💡 轉念，是所有問題的答案。


    # 轉。念


    # 轉念，才是所有問題的答案


    後來我發現，用「STOP」這一招的確是可以治標，解決當下過不去的情緒，但我難過的點其實並沒有真正消除，真正治本的方式其實得靠「轉念」。轉念，就字面上來說，就是「轉」向你的「念」頭。


    自從《秘密》這本書出版之後，「吸引力法則」便成為大家討論的話題。我相信你一定也看過很多「正面思考」的書或觀念，但真正的轉念並不是要你不去看負面的情緒，然後用正面的想法去壓抑，去逃避負面的事。轉念是要你學會從不同的角度看事情，所以你並沒有逃避任何負面的情緒或事情。


    # 請練習用不同角度看事情


    有一位老先生每天捧著一束花到過世妻子的墳前跟她說話。有兩個人每天看到這種情景，其中一個人說：「這老先生多愛他太太啊！每天都來跟她說話。」另一個人則說：「錯了，他以前一定做了很多對不起他太太的事，所以現在才需要每天來懺悔。」'
  - "[PAGE 94]\n\n同樣一件事，不同的人會以不同的角度看待，一百個人就可能有一百種角度和想法。你雖然只是一個人，但你也可以練習用不同角度來看同一件事情。悲觀的人具有把好事想成壞事的傾向，樂觀的人則有把壞事想成好事的能力。而把壞事轉化的能力，最重要的理論基礎在於「事物本身沒有意義，除非我們賦予它意義」。\
    \ \n\n# 事物本身沒有意義，除非我們賦予它意義\n\n「事物本身沒有意義，除非我們賦予它意義」是《有錢人想的跟你不一樣》書中的一句話，第一次看到這句話，我忍不住睜大眼睛，反覆思考這句感覺很有哲理、又似乎很沒道理的話是什麼意思？後來，我發現這句話就是轉念最重要的精髓。而轉念，不過是訓練我們用不同角度來看事情、看世界、看人的方式。\n\
    \n# 發生什麼事情並不重要，重要的是你怎麼看待這件事情\n\n有位白手起家的建商，賺了許多錢，但因經濟不景氣導致經商失敗，欠債累累。這天晚上，他一時想不開要跳河自殺，便在三更半夜來到河邊。他在河邊看見一位少女哭哭啼啼，便問道：「小姐，三更半夜你來這裡，是要做什麼呢？」\n\
