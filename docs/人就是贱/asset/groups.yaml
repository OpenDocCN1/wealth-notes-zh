    ## 成功，就是不斷的解決問題。


    一位退休的主管上個月跟我分享了以前做生意的心得，她說：「我在做進出口生意時，從不怕遇到問題，我甚至希望早一點遇到問題。因為每解決一個問題，就表示我又多知道一個問題的答案，所以我一直在找問題，當問題都出現完了，就表示我都學會了。後來，我的事業也因此成功了。」


    當時聽到她的這個想法，我睜大眼睛，眼角開始往右上角這個心理學中表示「不可思議」的方向飄去。因為平常人不是在逃避痛苦，就是在追求快樂，大家遇到問題光躲都來不及了，哪還有人會去「找問題」的？


    另一方面，我心裡想的是：「難怪她做什麼事都這麼成功，因為她不怕遇到問題。」而且她說的沒錯，就是因為人都習慣逃


    成功，就是不斷的解決問題。


    避問題，所以才造成不會的還是不会，讓自己永遠在原地踏步。


    ## 我們抗拒遇到問題，是因為不具備解決問題的能力


    在求學時代，相信大多數人都很害怕三角函數，我也不例外。每次一翻開數學考卷，看到出現三角函數的演算題，那恐懼的程度簡直像自廢武功，彷彿還沒開始算，分數就沒了一樣。


    後來重考時，我認真地把三角函數給學會了。之後當我在考試中再次看到三角函數時，我發現我居然不害怕了，因為我知道只要題目不是太難，我是拿得到這分數的。


    這時，我才發現原來我「害怕遇到問題」的最終原因，是因為「我不具備解決問題的能力」。一旦我把不會、不熟悉的東西都慢慢學會後，原本讓我害怕的問題，竟然變得不那麼可怕了。


    如果你害怕開車，你一定是還不習慣開車、停車或認路，因為你聽過計程車司機害怕開車的嗎？如果你是業務員，但是你害怕銷售，你一定是對銷售還不在行，因為你聽過哪個Top
    Sales害怕銷售的嗎？NBA傳奇球星Michael Jordan不可能害怕打籃球，舞神Michael Jackson不可能抗拒跳舞，擅長溝通的人不會害怕與人接觸。如果你把一件事學會了、做好了，你是沒道理抗拒它的。


    Lesson 5

    別「允許」自己被困在同一個點上


    ## 我是因為害怕才學不會的？


    或許你會說：「我就是害怕才學不會的！」這種話我真的聽很多了，而我只想對你說：「少來！實事求是，別倒果為因，也別找藉口，你是先學會了，才不害怕的。」


    我認識一位英文老師小藍，她在當老師之前很害怕上台講話，之後因為工作的關係，逼得她一定要練習上台。經過幾年的練習，小藍已經很習慣上台講課了，當然也就不再害怕在人群前說話。上個月我聽到她談笑風生地對台下的學員說：「現在看到講台，要我不拿麥克風上台講點話，我反而不習慣呢！」


    所以，從抗拒問題到面對問題，不過是你解決問題難易程度的差別罷了。


    只要你已經習慣這個問題，也能輕鬆解決它，你自然不會抗拒；反之，只要你抗拒它，就表示你解決這問題的能力還不夠。但最怕的是你常遇到這個問題，卻因為害怕所以永遠學不會，於是問題就這樣永遠困擾著你。


    《成功人士完全念力手冊》中提到：「在所有重要的工作技能中，你最弱的那一項，決定了其它技能所能發揮的最大幅度，也決定了你的收入、升遷速度及工作前途。」


    💡 你躲得了一時，躲不了一輩子。


    面對任何問題都一樣，愈抗拒愈持久。如果你不針對你的弱點去處理，你將一輩子受這些問題所苦。逃避問題或許能獲得一時的輕鬆，但當下次問題來了，你還逃得掉嗎？再下次，再下下次呢？你躲得了一時，躲不了一輩子。


    去年年初，NBA球星林書豪在全世界刮起一陣旋風，當時報導寫著：「林書豪被各強隊列入看守重點，除了祭出包夾外，並封住他慣用邊與右手的弱點，讓他只能往左邊進攻，造成不少失誤。」


    如果你是林書豪，或他的教練、好朋友，我相信你一定會建議他：「努力把左手練好。」因為就連路邊的阿嬤都知道林書豪要在NBA這種世界等級的籃球殿堂混飯吃，有這麼大的罩門是不行的。沒錯，如果我們身為旁觀者，一定會給他這樣的建議。


    你懂嗎？身為「旁觀者」。


    後來林書豪也的確利用去年夏天勤練左手，現在左手運球已經不是他更上一層樓的阻礙。但同樣問題如果發生在自己身上，又有幾個人願意針對自己的缺點進行補強呢？


    其實我們都知道自己的問題在哪裡，只是為了逃避痛苦而不願面對，不願徹底解決罷了。但別忘了，「我們最弱的工作技能，決定了其它技能所能發揮的最大幅度，也決定了你的收入，


    ![](img/7a3931d50c2c9383cc41488956e04ae5_79_0.png)


    升遷速度及工作前途」。我們在逃避的問題，往往就是讓自己無法進步、更上一層樓的關鍵。


    當我們遇到問題，覺得很煩、不想解決時，可以學習從「正反」兩個方向來想。從正面的方向來想，「如果我把這個問題解決了，學起來了，以後這樣的問題就難不倒我了」；從反面的方向來想，「如果今天我不解決這個問題，拖久了，以後可能會更慘，所以我還是花點時間學會處理這問題吧」。


    💡 你做一件事情的方式，就是你做所有事情的方式。


    ## 面對問題，別允許自己犯同樣的錯


    ## 人就是懶，總愛犯同樣的錯


    大學時，我跟同學Andy比賽互相考單字，輸了要罰錢。當時讓我們「最抓狂＋心肝」的單字，不是我們一看就會的單字，也不是我們從來沒看過的單字，而是「看過，很熟，卻又叫不出來的單字」。


    當時的我們都很賤，最愛看到對方臉上出現那種「天啊！這個字我好熟啊……」那副心有不甘、懊惱的表情；經過那幾個月的單字比賽後，我發現我們在字典上查過不知道幾百次，卻一直沒記起來的單字，永遠都是那幾個，而會搞混的，也永遠是那幾個。


    我和這位同學永遠被困在同樣的單字、同一個點上，但我們當時沒想到的是，如果花點時間，把這些不會的單字都認真背起來了，這些單字不就永遠考不倒我們了？


    我在第一篇文章中提到「人生，就是一個圈」，而且「你做一件事情的方式，就是你做所有事情的方式」。我們的人生就是那次背單字的縮影，我們永遠「允許自己」被困在同樣的問題


