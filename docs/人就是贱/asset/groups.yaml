    💡 做自己，但也不能無視別人對你的看法。


    驗，他們說的話有90%是對的。」


    # 敞開心胸接納別人的真心話，

    不要有預設立場，你才看得到事件的全貌


    別人給你的所有建議都是中性的，沒有好壞，無關對錯。他們對你的意見都是讓你「看到別人眼中的自己」的最佳工具。你不一定要因為別人的意見而左右自己的想法，但是你必須把別人對你的意見聽進去，或許他們真的看到了什麼你沒發現，或你不願承認的事實。而我也必須提醒你，一個真的在做自己的人是不會常把「我在做自己」掛在嘴邊的。如果你只是常拿「我在做自己」當藉口，我想你必須真的打開耳朵，聽聽別人的聲音，然後做些改變。'
