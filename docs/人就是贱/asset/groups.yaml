    「想要，你會找到方法；不想要，你會找到藉口。」這些道理我從書上都看過，也知道那是真的，所以我在書中一直提到：「知道」跟「做到」那真是天差地遠，因為唯有你真的做到了，你才會打從內心「真的相信」那股力量。


