    ## 人生就像走迷宮，它是你做完一生所有選擇後，必然會走到的目的地


    相信大家都走過迷宮，或看過小老鼠走迷宮，小老鼠每逢轉彎處都要選擇左轉、右轉或直走。選對了，就可以繼續走到目的地；選錯了，退回來換個方向，遲早也會走到目的地。我們的人生也跟小老鼠走迷宮一樣，在人生無數次選擇與轉彎之後，你的目的地就會出現了。


    我主管的朋友以前是郭台銘的鄰居，最近他跟我主管說：「唉，以前郭台銘跟我借錢，想談投資，但我拒絕他了，因為我覺得他不會成功。」


    一般人看到這個故事，會覺得他應該很後悔當初沒借錢給郭台銘。首先，這沒有什麼好後悔的(註5)，不過我們還是得知道，你萬萬沒有想到「人生，有時候一個選擇就會改變一生」。人都是怕麻煩的，大多數人的選擇通常傾向多一事不如少一事，只要是不確定的事情，都先拒絕再說，但我們也常因為下意識想保護自己，而把人生大好機會給拒絕掉了。


    根據心理學統計，人的一生到了最後，懊悔的往往不是做了什麼，而是沒做什麼，這一生就結束了。因為平凡人都怕麻煩，所以才那麼多事情不願做、不敢做，或是不敢做選擇，到終老時


    註5：請見〈懊悔，自責？一秒鐘都不要〉一文。


    當我們90歲的時候，應該講的是故事，而不是夢想。


    才來後悔自己虛度了這一生，但其實老天隨時在給你選擇的機會，只是你自己一直沒勇氣選擇改變罷了（註6）。


    中國最大網站阿里巴巴的執行長馬雲說：「當我們年紀大的時候，應該講的是故事，而不是到了90歲還在談夢想，還在後悔當時不肯改變，沒有行動。」


    如果你不滿意你現在的工作，那是因為你在幾年前選擇了這份工作，那也是因為你工作了幾個後，發現不對勁、不喜歡了，卻選擇不離職，反而選擇「接受」，選擇「撐到領年終還繼續抱怨」。


    一樣的例子，你不滿意你的另一半，那是因為你之前選擇跟他（她）在一起，那是因為你選擇不跟他溝通，選擇不找出問題的答案，甚至是「選擇」不離開他（她），選擇跟周遭親友抱怨，讓你們的關係更惡劣。你面對婚姻、面對另一半的方式，面對人生的心態（註7），以及你要不要改變現狀，這一切都是你的選擇。所以，請你不要怪罪到任何人頭上，因為所有事情你都是有選擇的，你擁有絕對的主導權。


