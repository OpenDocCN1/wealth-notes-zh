    222 改變我一生的強大力量\n\n發現真相，讓你自由，\n從此開始。\n\n## Lesson 1\n\n## 人生，是一個圓\n——真相，讓你的心自由\n\
    \n> 「只要你不同意，這世上沒有任何人，任何事情能傷到你。」\n\n![](img/7a3931d50c2c9383cc41488956e04ae5_13_0.png)\n\
    \n## 人生，是一个圆\n\n## ——真相，让你的心自由\n\n这是《人，就是贱》的第一篇主体文章，也是让你\n\n解我写出每篇文章背后，所要传达的核心概念的一篇文章。\n\
    \n「人生，是一个圆」，这个概念其实是我当初从学英文里体悟到的。当我不断去思考：「为什么这个文法概念是这样？」、「为什么关系代名词要这样用？」、「为什么『love』和『like』明明就不是实际上的动作，它却是动词，为什么？」\n\
    \n我问了自己一堆为什么，试图从英文中找一个逻辑，清晰一条脉络；经由不断思考、不断动脑把这些英文的概念都想通以后，我发现最重要的一件事，那就是——「整个英文的概念，就是一个圆」。\n\
    \n每个英文的小概念就像是一个点，当把几个点想通后，我再继续思考，这几个被我想通的「点」，很快就因此连成一个「面」。最后这些一点一滴的想法，竟然汇成了一个「圆」。到最后，无论你从任何一个英文的「点」来问我，我都知道这个点是在哪边，我都可以从这个点，结合成一个面，最后画成一个\n\
    \n真相，讓你的心自由。\n\n圏，因為我已經融會貫通了。\n\n當初我以為這樣的「圏」，只出現在英文這個領域；但令我驚訝的是，之後從幾位超強的畫畫老師和Java程式設計老師口中，我聽到了一模一樣的想法。他們分別都覺得畫畫和程式設計是一個「圏」，只要把學到的每一點都精通了，最後這些重要的觀念，就會自然而然連成一個圏，讓你通透這領域的一切。\n\
    \n# 當你融會貫通某一件事情，你就像連成一個「圏」\n\n我這才發現，當你融會貫通某一件事情後，你自然會察覺道世上所有的東西、所有的道理，都是一個圏（就像太極的圏一樣）。只是你融會貫通的地方還不夠多，沒辦法把這些「點」，變成一個「面」，進而再連成一個「圏」。\n\
    \n# 真相，讓你的心「自由」\n\n有人終其一生不去思考，不去行動，所以可能連一個圏的一個點都沒辦法想通。因為你根本沒在「用腦袋思考」，你逃避用腦袋思考，所以這輩子根本不可能想通任何事情。原諒我在第一篇就這樣刺你，因為我的文章不是要讓你來取暖的，因為不刺你，你就沒辦法看到真相，更沒辦法知道你當前的處境。如果不知道自己身在何處，你要怎麼朝著你想要的地方前進呢？\n\
    \n所以我會盡可能地在接下來每一篇文章刺你，請你做好心理\n\n![](img/7a3931d50c2c9383cc41488956e04ae5_15_0.png)\n\
    \n準備。我的書不是要讓你看得很舒服的，但我會讓你看到真相，因為你以前從來沒想過，「真相」竟然能讓你的心「自由」。。\n\n帶你看到人性的真相，讓你療癒自我，進而讓你的心自由，就是我寫書的最大目的。\n\
    \n其實人性，跟學英文、素描、Java電腦程式之間，完全沒有差別，當你慢慢瞭解自己，瞭解人性，去思考別人 Campe自己 line behavior，你會發現「人」的行為模式，也就是「你」的行為模式，都是有脈絡可尋的，只是以前你不知道，或是你沒有看得那麼深入罷了。\n\
    \n老實說，這本書，就是你打通「看穿人性」任督二脈的重要武功秘笈。每一篇文章，我都在用化繁為簡、由簡入深的方式讓你瞭解人性。這十五篇結合起來，就成為讓你看透人性、看透自己的入門書。我盡我最大努力把它寫得很簡單，一方面因為這就是我想創作的風格：寫實、深刻，卻簡單易懂。\n\
    \n另一方面是因為我看到坊間很多心靈成長的勵志書，它們的內容、想法、邏輯都很好，但可惜的是——我看不懂、看不下去。一本再好的書，沒辦法讓人看下去，那也是沒用的。\n\
    \n所以我的每個例子、每一句話、每篇文章，都是以跟你講話或說故事的方式呈現，讓你在這繁忙的生活中，不需再耗費心思\n\n知識不是力量，知識要拿來運用才是力量。\n\
    \n去猜、去理解我想傳遞給你的文字意義。我不希望你花精力去思考文字，但我要你去思考人性和每篇文章背後的意義。\n\n但光是思考，還是沒有用的，一本絕世武功秘笈，你光看懂了、想通了，還是沒用。\n\
    \n你如果不親自去練這所有的招式，空有《葵花寶典》，空有所有門派的傳教秘笈，卻不親自在你的人際關係，不在你每一次遇到問題、陷在情緒之中或難過時用出來，就算你擁有再多武功秘笈也是徒然。因為學習是拿來用的，只要你沒把學到的用出來，一切都是空。\n\
    \n我再說一次，這本書，是讓你打通「瞭解人性」這條處世之道的武功秘笈。\n\n或許你會覺得我講話太猖狂，但這是我十幾年來幫人解決心靈問題的體驗。這篇文章的每一個字、每個概念，就像我當初「思考英文」一樣，是在人生中不斷思考，不斷練習，不斷「跟自己的心對話」，不斷嘗試失敗，不斷去觀察所有成功、失敗案例才得來的體驗，每個概念都得來不易。所以這本書的例子都是我親身經歷或是察覺到的，無一例外。\n\
    \nLesson 1\n人生，是一個圈——真相，觀你的心自由\n\n# 這本書，也是一個圈\n\n另外，這本書本身也是一個「圈」。首先，這本書的每個段落都可以分開閱讀，就像任何東西的一個「點」一樣，每個段落都表達出完整的意義。所以如果你真的很懶，你要跳著看我也沒意見，但看到最後，你終究會連成一個「圓」。\
    \ \n\n以主題來看，你會發現這本書的每個主題，都跟其它主題有相關性，每篇文章的附註都與另一篇有關係，每篇文章都會帶領你到另一篇。所以你無論從哪一篇開始看都可以，就好像一個圓要從哪裡開始畫都一樣，只要知道怎麼畫圓，無論從任何一個「點」開始畫，你都可以把它畫成一個「圓」。\
    \ \n\n人性，也是一樣，無論你從哪邊開始看，只要你看完了，它都可以形成一個完整的概念。\n\n-   1. 當你心情過不去的時候，你可以再看一次〈轉念，是所有問題的答案〉。\
    \ \n-   2. 當你遇到挫折和難關時，你可以翻翻〈別「允許」自己被困在同一個點上〉。 \n-   3. 當你害怕，被「恐懼」阻止你該做的事情時，你可以看〈違反人性的成功之略——「會怕，但還是要去做」〉。\
    \ \n-   4. 當你不能說自己想說的話，做你想做的事時，你可以看〈做自己，你行嗎？〉。\n\n\U0001F4A1 只要你不同意，這世上沒有任何人、任何事能傷到你。\n\
    \n每篇文章，都有它不同的使用場合，所以你必須把所有文章讀完，讀「熟」，你才能知道何時該用哪一篇 bateria，讓它成為你的力量。而我真的相信，在你感到過不去或覺得人生困惑時，一定有一篇文章能給你那燦的力量。\n\
    \n# 只要你不同意，這世上沒有任何人、任何事能傷害你\n\n如果你真的很懶，要我推薦一篇萬用文章，我絕對會推薦〈轉念，是所有問題的答案〉，因為所有的問題，都來自於你的心，只要「心」學會了轉念，你周邊的所有問題都不會再是問題。只要你真的把這篇文章來實際應用，相信我，你不會只是知道這是真的，而是真的能親身體驗，打從內心確實相信——「只要你不同意，這世上沒有任何人、任何事能傷害你」。\n\
    \n這本讓你「看懂人性」的書，其實還有個很大的目的——讓你擁有更多的選擇。以前你看不到「人」（也就是「你」）之所以做某些事情背後的目的或企圖心，現在你看得到了，你就可以選擇要不要去解決它，選擇讓你擁有自己的心，擁有你的心情，而不是讓自己永遠被情緒困住，走不出來。\n\
    \n人生，能有所選擇是件很開心的事，而我要你擁有人生中最棒的選擇——擁有自己的「心」。\n\n最後，我衷心希望這本書你不要只看一次，因為這裡面的\n\n![](img/7a3931d50c2c9383cc41488956e04ae5_19_0.png)\n\
    \n「心招」，不是只看一次就夠了。只看一次，你或許看得懂，但如果多看幾次，你會瞭解我說的每個字、每句話、每段文字、每篇文章和這本書想要傳達給你的東西。\n\n\
    也就是「人性的圖」。 \n\n我沒辦法勉強你做任何事，因為這是你的 人生，我只知道我是因為這本書裡的所有概念、態度才帶領我成為了自己想成為的人，也成為一個快樂的人。當你被這本書的某一句話、某個概念打動了，也歡迎你在我的臉書粉絲團【人，就是賤】裡留言。\n\
    \n你好，我叫拉米，很高興透過這本書認識你。讓我們利用這本書，讓這世界變得更好。這目標很大，但我不會放棄，因為我相信，我一定會做到。\n\n歡迎來到探索心靈，探索人性的世界——《人，就是賤》。\n\
    \n## Lesson 2\n\n## 人，就是「蔭」\n\n> The truth will set you free.\n「真相，讓你自由。」\n\n\
    ![](img/7a3931d50c2c9383cc41488956e04ae5_21_0.png)\n\n## 人，就是「賤」\n\n其實人是一種「不斷重蹈覆轍」又不斷「犯賤」的動物。我這邊指的「人」，沒錯，我指的就是「你」，和你周邊的所有人，當然也包括作者我本人。不瞞各位看倌，我就是從研究身邊所有人、Facebook朋友以及我本人的所作所為，才發現人的行為（人性）有個固定模式，如果要我總結成一句話……喔不，我不需要一句話，我只需要一個字，那就是「賤」。\n\
    \n我對「賤」的定義簡單來說有以下四種：\n\n-   1. 你明知不該做還硬是要做（「口嫌體正直」，這個詞是日文，意思是「嘴巴說不要，但身體是誠實的」）。\n\
    -   2. 明知「該做」卻還不做。\n-   3. 整天重蹈覆轍，犯一樣的錯卻還在抱怨。\n-   4. 直到失去了，才知道珍惜。\n-   5. 總是讓恐懼阻止你做對的事情。\n\
    \n人賤沒什麼不好，因為這就是人性，但如果你一直「允許自己」繼續依照那犯賤的人性過生活，我不騙你，你永遠沒辦法成功，而且你還會愈活愈不快樂。\n\n凡事沒有對錯，只是「你要什麼？」。\n\
    \n唯有能先發現自己很賤的個性，你才有可能瞭解人性，進而跳脫人性，最後遠離「人性本賤」，成為一個自己想成為的人，成為一個快樂的人。\n\n本書深入淺出、一針見血的十五篇主題，讓你從各個角度看清自己或周遭親友做每一件賤事背後真正的原因，讓你不只看到人性的「表土層」，還讓你一次看穿人性的「地心」，教你戰勝你的心，讓你看到真相，最後讓你的心「自由」。\n\
    \n看完這本書以後，你可以自己決定還要不要繼續當個「賤人」。想繼續當個賤人，或從此改變自己，這一切都沒有對錯，只是你必須問自己：「這是你想要的嗎？」\n\n\
    如果不是，那——「你要什麼？」（註1）\n\n註1：請見〈生命中最重要的問題——「你要什麼？」〉一文。\n\n![](img/7a3931d50c2c9383cc41488956e04ae5_23_0.png)\n\
    \n## Lesson 3\n\n## 生命中最重要的問題\n——「你要什麼？」\n\n> 「生命，有時不在於找到對的答案，在於找到對的『問題』。」\n\n\
    ![](img/7a3931d50c2c9383cc41488956e04ae5_25_0.png)\n\n## 為何「你要什麼」如此重要？\n\n你知道嗎？所有偉大的哲學家走到人生終點時都在思考同一個問題，那就是：「你要什麼？」\n\
    \n所以我也想問你一樣的問題：「你要什麼？」\n\n# 你真的知道你要什麼嗎？\n\n# 還是你已經失去了「做夢」的勇氣和能力？\n\n小時候，老師要你在課堂上寫出「我的志願」，幾乎所有同學都能寫出「我要當老師」、「我要當科學家」或「我要當總統」這類大家或許真的很有興趣的目標；但等到出社會了，要你說出：「我要什麼？」所有人卻都回答不來了。有時候可能是我們「真的不知道自己要什麼」，也有可能是「我們知道做不到，於是失去了做夢的勇氣」，以致於不斷隨波逐流，大家做什麼，你就做什麼，這社會要我們做什麼，我們就做什麼。\n\
    \n大學畢業了，人家都出國唸書拿學位，你也出個國吧；大家都在考公務員，我也來補個習吧；三十歲了，人家都結婚了，我也找個人嫁了吧。\n"
