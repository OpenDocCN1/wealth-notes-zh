    上，卻總是抱怨自己一天到晚遇到問題。


    ## 勇於面對問題，就是成功的第一步


    華爾街的投資大師戴維斯（Jonathan Davis）為了讓自己從犯過的錯誤中記取教訓，在辦公室的牆上專門設了一個「錯誤牆」，將自己犯的錯誤整理出來，掛在牆上。每天上班前，他都會先回顧自己曾犯的錯誤。當客戶來訪時，看到戴維斯犯過這麼多錯，卻又勇於面對，認為他在未來犯的錯會越來越少，更會放心地把資金交給他打理。


    無論你有錢沒錢，有權沒權，只要你還在呼吸，你都會不斷遇到問題。當你看見成功人士都一帆風順的時候，卻沒看到他們背後失敗過多少次，付出過多少心血和時間。只是他們跟你不一樣，他們面對問題的態度跟你不一樣，面對失敗的承受能力也比你強。


    在你遇到問題，開始不安或緊張時，深呼吸，微笑地告訴自己：「很好，問題來了，我可以多學到一樣東西了。現在，我該怎麼辦？」


    在犯錯時，告訴自己：「我又發現一個行不通的方法，下次我不會再犯同樣的錯了。」如果你心情因為這些問題變得很糟，你還是可以對自己說：「很好，我可以學習如何『駕馭』我的


    ## 犯錯又如何，我現在該怎麼做？


    的心。」每次遇到問題，都是你練習駕馭心情的最好機會。先讓你的心情穩定下來，因為慌張、不安，對解決問題一點幫助都沒有，完全沒有。


    ## 犯錯又如何，我現在該怎麼做？


    上個月我接到一個難度極高的翻譯，由於事前評估過於草率，我沒想到以前一小時能翻一頁的量，在這次的案子，平均卻要四到五個小時才能翻譯完一頁。六年前我也曾遇過類似的情形，那時我曾經責怪自己：「我真是笨，怎麼把case也要接？」於是當時就在犧牲、抱怨、慌張的情緒中，好不容易才完成了那份翻譯稿件。


    這次，我想到主管說過的那句話：「我一直在找問題。」當下便轉了個念——既然已經接下了這個翻譯，就別想太多。抱怨、後悔都於事無補(註1)，努力去做就是了。而且「如果我解決了這次的十級風暴，以後碰上類似的八級風暴就再也難不倒我了」。何況我這次用心完成了稿件，以後客戶或許還會繼續幫我介紹新的案件呢！


    當我的心「決定」要這麼想，心情便平靜了起來。我開始認真安排可以翻譯的時間，跟雇主道歉，說明自己錯估時間和難度，並希望雇主能把時間延後。如果雇主不同意，我就再找別人


    註1：請見〈自責，後悔？一秒鐘都不要〉一文。


    ![](img/7a3931d50c2c9383cc41488956e04ae5_83_0.png)


    幫忙。


    我事先想好如果雇主答應延期，我會怎麼做？如果他不答應延期，我又該怎麼做？當我把這兩個問題的答案都想清楚，無論他的回應為何，我都有辦法解決，自然我的心情也就穩定多了。


    遇到問題時，先問自己你的下一步該做什麼，或不該做什麼？


    當你知道了下一步的計劃後，心，自然也就平靜下來。


    所有問題，只要轉個念頭，一切就容易多了。不要允許自己一直被困在同一個點上，很多人的毛病，就是卡在無法「轉念」。轉念也是需要練習的，把它當做一個課題來練習，你會發現光是學會「轉念」這件事，將為你的人生帶來多大的價值(註2)。


    ## 你可以不用自己做，但你不能不會


    有些人不太容易發現自己的問題，因為在他們身邊有很多可以幫他們，這種人通常是主管，或是身邊「求救」資源很多的人。我並不是說請人幫忙不好，但在你求助之前，應該先想想「我是真的沒時間？這件事別人做會更適合、更有效率？」還是其實是我不會做，甚至害怕做這件事？


    註2：請見〈轉念，是所有問題的答案〉一文。


    💡 你可以不用自己做，但你不能不會。


    老爸退休前是一間公司的法律事務高層主管，他那時不會打字，也不太會用電腦。他有自己的秘書，所以之前他都用手寫好稿子，再交給秘書幫他打字。以他的職位，大可完全不用自己打字或寄email，交辦下去就好。但老爸說不希望浪費秘書的時間再做一次自己就可以做到的事，所以他想學會打字和寄信這些簡單的文書功能。於是在我退伍的那一年，他每天花一小時，要我到公司教他打字、寄email。


    經過這幾年來的練習，現在退休的他卸下了主管的光環，沒有秘書，也沒有屬下，但他已經學會自己打打字、上網查資料、看文章、看YouTube、收發email。因為他已經學會了，所以他的人生不再需要秘書、屬下或是我，而這些人也不會永遠在他身邊。


    你可以不用自己做，但你不能不會。只要學會了，你的人生從此不再由別人掌握，你可以拿回人生的主控權。就算你做得比較慢，做得沒那麼好，但至少你知道方法，一旦真的需要做的時候，就不必求助任何人。


    老爸沒有等到退休了，沒人幫他打字、處理公文的時候才去學打字、學文書處理，所以現在遇到朋友要請他幫忙法律問題時，他才可以「無痛銜接」，自立自強。


    同樣的道理，你會等到停電了才去買手電筒？還是等到失火


    ![](img/7a3931d50c2c9383cc41488956e04ae5_85_0.png)


    了才去買滅火器嗎？凡事真的不要等到來不及了才去學，才去做。趁還有時間、還沒壓力的時候就把該學的學會，因為等到壓力來了再學、再去彌補，那樣的痛苦是千百倍。在別人逼你自己之前先逼自己學會，讓自己成長，等哪一天真的需要了，你就可以從容應對。沒有人在嫌武器多的，在敵人還沒出現時就該把武器先準備好，等敵人都殺到你面前了才去磨刀，這樣來得及嗎？


    ## 你騙得過所有人，但你騙不過自己


    二十歲時做錯事情，身邊大多數人都比你年長，會覺得你才剛出社會，還是個孩子，不會沒關係。但當你四十歲時，身邊的人都比你小，他們會認為：「你都幾歲了，為什麼連這麼簡單的小事也不會？」什麼時候該學什麼就去學，不要逃避，不要閃躲；你可以躲得了一次、兩次，但躲不了一輩子。該面對自己的心情時，就學著好好面對。你可以騙過所有人，但你唯一騙不了的，就是自己的心。


    > 潤泰集團總裁尹衍樑說：「讓我進步的，全都是挫折！」


    股神巴菲特（Warren Edward Buffett）有一次在佛羅里達大學演講時，有學生提問：「談談你投資上的失誤吧！」


    > 巴菲特幽默地回問：「你有多少時間？」

    '
  mdcn: '

    給你多久時間，你的工作就會做到多久。


    前還沒遇過比她更忙、更沒時間的人，但如果連她都有時間，我憑什麼說「我沒時間」？


    ## 帕金森（Parkinson）管理定律：


    > 「一定有時間，看你願不願意而已。」


    英國的管理學學者帕金森（Parkinson）曾提出一個有名的管理定律，有人稱之為「身在職場，不得不明白的管理定律」。「如果你給一個人八小時做五件事，他會剛好花八小時把這五件事做完；但如果你一樣給他八小時，卻交代十件事要求他一定要做完，正常來說，他需要花兩倍的時間才能完成。但其實不然，員工還是會在八小時內，完成你指定的十件事情。」


    這就是帕金森的定律：「給你多久時間，你的工作就會做到多久。（Work expands so as to fill the time available for
    its completion.）」


    根據這個理論我們可以得知，只要你覺得這些事是你一定要做到的，你就會「開始」動腦設法提升效率，讓自己能在有限的時間內把「所有事情」都做到。（這也表示我們以前都沒什麼在動腦想創造雙贏，你應該知道普通人一輩子只開發了腦袋的2%～7%吧？）


    哈佛．艾克（T. Harv Eker）在《有錢人想的跟你不一樣》一書中也提到同樣的概念：「雖然你無法擁有全世界所有東西，但是我真的認為，你可以擁有『你真正想要的一切』。」


    這當然包括「時間」的運用，如果你真的想同時做好很多事情，就絕對可以創造「雙贏」。


    如果這樣還是沒辦法讓你看到真相，我直說吧！


    不是沒時間，是你不會用，是你不會安排。


    是你做事沒效率，是你什麼事都想自己一個人做。是你不會找到對的人幫忙。


    是你什麼事都拖到最後一秒鐘，才把自己搞得很慌亂。


    如果以上都不是，就是你讓太多「沒那麼重要」的人和事進入你的生命。當你做了太多不重要的事，你就沒時間把時間留給重要的人、重要的事，你更無法把時間留給你的「心」。


    ## 會遲到，是因為你不在乎


    我有位年收入千萬的企業家朋友曾說過：「因為在乎，所以我絕對不會忘記，我也絕對不會遲到。」我很佩服他說出這句話的勇氣，難怪他會有那樣的收入。正因為他「在乎」，所以他不


    只要你真的在乎，你不會忘記，你不會遲到。


    會拿任何理由來當成自己忘記和遲到的藉口。


    經過二年的觀察，我發現跟你約會時，會連續遲到個二、三次的人，他們跟任何人約會就幾乎不會「準時或提前到」；會準時到的人，他就幾乎都會準時到，無論你約哪裡。


    更好玩的是，我發現每個人都有「習慣遲到的分分鐘數」，有人習慣遲到五至十分鐘，有人習慣遲到長達半小時。像我以前就習慣遲到五至十分鐘，不多也不少，幾乎沒有例外。


    這不是路程遠不遠的問題，更不是交通堵塞、工作忙碌的問題，這還是「你覺得不重要」的問題。


    以前大學時，我跟一位同學每天早上約好九點整，在離我家一分鐘路程的頂溪捷運站碰面，準備一起去K書中心看書。三個月之中，我沒有一天準時，每天都遲到五至十分鐘（我真是服了我自己）。她最後跟我說：「拉米，我很難過你每天都遲到，因為這代表你不重視我們的約會。我從士林過來，但我沒有一天遲到過。」


    看著她落寞的表情，我知道自己做錯了什麼。現在回想起來，她說的沒錯，如果我真的很在乎一個人、一件事，或在乎我的承諾以及別人對我的信任，我是不可能遲到的。


    Lesson 4 不是沒錢、沒時間，是你覺得不重要，是你沒有心


    ## 「我不確定，到時候再說。」


    不知道你身邊有沒有那種「永遠沒辦法跟他確定時間的人」？這種人通常很「忙」，你跟他約時間，他是不願承諾的。他們永遠會跟你說「到時候再約」或是「我沒辦法跟你確定」。但我們仔細想想，如果你真的覺得這一件事情很重要，你會回答「我不確定，到時候再說」嗎？


    如果你你的未婚妻跟你說：「我們結婚日期就訂在12/25號中午，你當天早上七點整一定要到我家來幫忙。」


    你會跟她說「我不確定，到時候再說」嗎？


    ## 不願承諾的真相


    這種人通常跟時間的關係很差，他們「表面」上看來很忙，但就算實際上沒什麼事情，他也不願承諾。因為他不覺得你的事情很重要，而不承諾的原因只是擔心到時會不會有更重要的事情發生。也有可能是他在打安全牌，因為如果跟你確定了，他就一定要做到，所以他不想做這個「承諾」。


    所以你看到「真相」了嗎？


    對想約定好時間的人來說，這種人真的很討厭，因為你只有在時間接近的時候，才能知道他是否真的會答應你。就跟習慣遲到的人一樣，我們通常沒辦法信任這樣的人。如果有人常常沒辦法跟你確定時間，我相信你也很難會把事情交代給他。畢竟，誰喜歡跟一個常常沒辦法確定時間的人來往？而且，當對方總是無法確定時間時，就表示我們也無法確定自己的行程，讓彼此形成雙輸的局面。


    💡 如果真的相信，你敢承諾的。


    ## 如果你真的相信，你為什麼不敢承諾？


    老話一句：「己所不欲，勿施於人。」如果你也不喜歡不願承諾的人，我們就不要做這樣的人。要就要，不要就不要，別總是習慣等到最後一分鐘再給答案。人有一種很特殊的能力，就是「能看出對方是不是真的有事」的直覺，有些人你看得出來他是真的沒辦法那麼早確定，但多數人不過是在給自己留退路罷了。


    別忘了，如果你真的很在乎一件事，而且真的相信自己能做到，你會願意先承諾，你會願意先付出時間的，新郎、新娘在結婚時都願意做此承諾終身了（我知道有人會跟我靠夭：「以後還不是做不到？」）。我現在先不論以後做不做得到，但他們在承諾的當下，都是「相信」自己以後能做到，所以才敢承諾。如果你真的相信你做得到，你有什麼好不敢承諾的？


    如果我叫你承諾：「今天會繼續呼吸下去。」你會不敢嗎？所以這是「相信」與「不相信」的問題。


    Lesson 4

    不是沒錢、沒時間，是你覺得不重要，是你沒有心


    如果「沒錢」、「沒時間」可以阻止你，

    那就什麼都可以阻止你。


    只要你真的想要，你會說「我去擠時間」、「我來想辦法」、「我再跟你確定時間」。如果你真的想做一件事，就不要允許自己拿「沒錢」、「沒時間」這些爛理由來阻止你前進，因為如果「沒錢」、「沒時間」可以阻止你，就什麼都可以阻止你。


    當你下次不小心脫口說出「沒錢」、「沒時間」的時候，請你「叮咚」一下，把它當作一個關鍵字，好好思考「我是真的沒錢、沒時間」，還是「我覺得它沒那麼重要，所以我不願為它犧牲這些錢和時間？」在你聽到別人說「沒錢、沒時間」時，你也必須知道那只是很表面的說法，背後的原因不過是對方沒看到做這件事的價值罷了。


    探索你的心，為自己負責。當你開始練習不再說「沒錢」、「沒時間」，不久之後，你會開始看到事物背後的價值，而非表面的價錢和時間，也讓你看清楚這輩子非常重要的問題：「我願意為什麼付出代價？我到底要什麼？」
    (註2)


    註2：請見〈生命中最重要的問題——「你要什麼？」〉一文。


    ## Lesson 6


    ## 別「允許」自己被困在同一個點上


    > 「促使我進步的全是挫折。」

    ——潤泰集團總裁，尹衍樑


    ![](img/7a3931d50c2c9383cc41488956e04ae5_75_0.png)


    ## 別怕遇到問題，


    ## 因為你一定會遇到問題


    網路知名漫畫家馬克曾說：「若我的人生學會了一百件事，那其中九十五件是在逆境中學的。」


    ## 成功，就是不斷的解決問題。


    一位退休的主管上個月跟我分享了以前做生意的心得，她說：「我在做進出口生意時，從不怕遇到問題，我甚至希望早一點遇到問題。因為每解決一個問題，就表示我又多知道一個問題的答案，所以我一直在找問題，當問題都出現完了，就表示我都學會了。後來，我的事業也因此成功了。」


    當時聽到她的這個想法，我睜大眼睛，眼角開始往右上角這個心理學中表示「不可思議」的方向飄去。因為平常人不是在逃避痛苦，就是在追求快樂，大家遇到問題光躲都來不及了，哪還有人會去「找問題」的？


    另一方面，我心裡想的是：「難怪她做什麼事都這麼成功，因為她不怕遇到問題。」而且她說的沒錯，就是因為人都習慣逃


    成功，就是不斷的解決問題。


    避問題，所以才造成不會的還是不会，讓自己永遠在原地踏步。


    ## 我們抗拒遇到問題，是因為不具備解決問題的能力


    在求學時代，相信大多數人都很害怕三角函數，我也不例外。每次一翻開數學考卷，看到出現三角函數的演算題，那恐懼的程度簡直像自廢武功，彷彿還沒開始算，分數就沒了一樣。


    後來重考時，我認真地把三角函數給學會了。之後當我在考試中再次看到三角函數時，我發現我居然不害怕了，因為我知道只要題目不是太難，我是拿得到這分數的。


    這時，我才發現原來我「害怕遇到問題」的最終原因，是因為「我不具備解決問題的能力」。一旦我把不會、不熟悉的東西都慢慢學會後，原本讓我害怕的問題，竟然變得不那麼可怕了。


    如果你害怕開車，你一定是還不習慣開車、停車或認路，因為你聽過計程車司機害怕開車的嗎？如果你是業務員，但是你害怕銷售，你一定是對銷售還不在行，因為你聽過哪個Top
    Sales害怕銷售的嗎？NBA傳奇球星Michael Jordan不可能害怕打籃球，舞神Michael Jackson不可能抗拒跳舞，擅長溝通的人不會害怕與人接觸。如果你把一件事學會了、做好了，你是沒道理抗拒它的。


    Lesson 5

    別「允許」自己被困在同一個點上


    ## 我是因為害怕才學不會的？


    或許你會說：「我就是害怕才學不會的！」這種話我真的聽很多了，而我只想對你說：「少來！實事求是，別倒果為因，也別找藉口，你是先學會了，才不害怕的。」


    我認識一位英文老師小藍，她在當老師之前很害怕上台講話，之後因為工作的關係，逼得她一定要練習上台。經過幾年的練習，小藍已經很習慣上台講課了，當然也就不再害怕在人群前說話。上個月我聽到她談笑風生地對台下的學員說：「現在看到講台，要我不拿麥克風上台講點話，我反而不習慣呢！」


    所以，從抗拒問題到面對問題，不過是你解決問題難易程度的差別罷了。


    只要你已經習慣這個問題，也能輕鬆解決它，你自然不會抗拒；反之，只要你抗拒它，就表示你解決這問題的能力還不夠。但最怕的是你常遇到這個問題，卻因為害怕所以永遠學不會，於是問題就這樣永遠困擾著你。


    《成功人士完全念力手冊》中提到：「在所有重要的工作技能中，你最弱的那一項，決定了其它技能所能發揮的最大幅度，也決定了你的收入、升遷速度及工作前途。」


    💡 你躲得了一時，躲不了一輩子。


    面對任何問題都一樣，愈抗拒愈持久。如果你不針對你的弱點去處理，你將一輩子受這些問題所苦。逃避問題或許能獲得一時的輕鬆，但當下次問題來了，你還逃得掉嗎？再下次，再下下次呢？你躲得了一時，躲不了一輩子。


    去年年初，NBA球星林書豪在全世界刮起一陣旋風，當時報導寫著：「林書豪被各強隊列入看守重點，除了祭出包夾外，並封住他慣用邊與右手的弱點，讓他只能往左邊進攻，造成不少失誤。」


    如果你是林書豪，或他的教練、好朋友，我相信你一定會建議他：「努力把左手練好。」因為就連路邊的阿嬤都知道林書豪要在NBA這種世界等級的籃球殿堂混飯吃，有這麼大的罩門是不行的。沒錯，如果我們身為旁觀者，一定會給他這樣的建議。


    你懂嗎？身為「旁觀者」。


    後來林書豪也的確利用去年夏天勤練左手，現在左手運球已經不是他更上一層樓的阻礙。但同樣問題如果發生在自己身上，又有幾個人願意針對自己的缺點進行補強呢？


    其實我們都知道自己的問題在哪裡，只是為了逃避痛苦而不願面對，不願徹底解決罷了。但別忘了，「我們最弱的工作技能，決定了其它技能所能發揮的最大幅度，也決定了你的收入，


    ![](img/7a3931d50c2c9383cc41488956e04ae5_79_0.png)


    升遷速度及工作前途」。我們在逃避的問題，往往就是讓自己無法進步、更上一層樓的關鍵。


    當我們遇到問題，覺得很煩、不想解決時，可以學習從「正反」兩個方向來想。從正面的方向來想，「如果我把這個問題解決了，學起來了，以後這樣的問題就難不倒我了」；從反面的方向來想，「如果今天我不解決這個問題，拖久了，以後可能會更慘，所以我還是花點時間學會處理這問題吧」。


    💡 你做一件事情的方式，就是你做所有事情的方式。


    ## 面對問題，別允許自己犯同樣的錯


    ## 人就是懶，總愛犯同樣的錯


    大學時，我跟同學Andy比賽互相考單字，輸了要罰錢。當時讓我們「最抓狂＋心肝」的單字，不是我們一看就會的單字，也不是我們從來沒看過的單字，而是「看過，很熟，卻又叫不出來的單字」。


    當時的我們都很賤，最愛看到對方臉上出現那種「天啊！這個字我好熟啊……」那副心有不甘、懊惱的表情；經過那幾個月的單字比賽後，我發現我們在字典上查過不知道幾百次，卻一直沒記起來的單字，永遠都是那幾個，而會搞混的，也永遠是那幾個。


    我和這位同學永遠被困在同樣的單字、同一個點上，但我們當時沒想到的是，如果花點時間，把這些不會的單字都認真背起來了，這些單字不就永遠考不倒我們了？


    我在第一篇文章中提到「人生，就是一個圈」，而且「你做一件事情的方式，就是你做所有事情的方式」。我們的人生就是那次背單字的縮影，我們永遠「允許自己」被困在同樣的問題


    ![](img/7a3931d50c2c9383cc41488956e04ae5_81_0.png)


    上，卻總是抱怨自己一天到晚遇到問題。


    ## 勇於面對問題，就是成功的第一步


    華爾街的投資大師戴維斯（Jonathan Davis）為了讓自己從犯過的錯誤中記取教訓，在辦公室的牆上專門設了一個「錯誤牆」，將自己犯的錯誤整理出來，掛在牆上。每天上班前，他都會先回顧自己曾犯的錯誤。當客戶來訪時，看到戴維斯犯過這麼多錯，卻又勇於面對，認為他在未來犯的錯會越來越少，更會放心地把資金交給他打理。


    無論你有錢沒錢，有權沒權，只要你還在呼吸，你都會不斷遇到問題。當你看見成功人士都一帆風順的時候，卻沒看到他們背後失敗過多少次，付出過多少心血和時間。只是他們跟你不一樣，他們面對問題的態度跟你不一樣，面對失敗的承受能力也比你強。


    在你遇到問題，開始不安或緊張時，深呼吸，微笑地告訴自己：「很好，問題來了，我可以多學到一樣東西了。現在，我該怎麼辦？」


    在犯錯時，告訴自己：「我又發現一個行不通的方法，下次我不會再犯同樣的錯了。」如果你心情因為這些問題變得很糟，你還是可以對自己說：「很好，我可以學習如何『駕馭』我的


    ## 犯錯又如何，我現在該怎麼做？


    的心。」每次遇到問題，都是你練習駕馭心情的最好機會。先讓你的心情穩定下來，因為慌張、不安，對解決問題一點幫助都沒有，完全沒有。


    ## 犯錯又如何，我現在該怎麼做？


    上個月我接到一個難度極高的翻譯，由於事前評估過於草率，我沒想到以前一小時能翻一頁的量，在這次的案子，平均卻要四到五個小時才能翻譯完一頁。六年前我也曾遇過類似的情形，那時我曾經責怪自己：「我真是笨，怎麼把case也要接？」於是當時就在犧牲、抱怨、慌張的情緒中，好不容易才完成了那份翻譯稿件。


    這次，我想到主管說過的那句話：「我一直在找問題。」當下便轉了個念——既然已經接下了這個翻譯，就別想太多。抱怨、後悔都於事無補(註1)，努力去做就是了。而且「如果我解決了這次的十級風暴，以後碰上類似的八級風暴就再也難不倒我了」。何況我這次用心完成了稿件，以後客戶或許還會繼續幫我介紹新的案件呢！


    當我的心「決定」要這麼想，心情便平靜了起來。我開始認真安排可以翻譯的時間，跟雇主道歉，說明自己錯估時間和難度，並希望雇主能把時間延後。如果雇主不同意，我就再找別人


    註1：請見〈自責，後悔？一秒鐘都不要〉一文。


    ![](img/7a3931d50c2c9383cc41488956e04ae5_83_0.png)


    幫忙。


    我事先想好如果雇主答應延期，我會怎麼做？如果他不答應延期，我又該怎麼做？當我把這兩個問題的答案都想清楚，無論他的回應為何，我都有辦法解決，自然我的心情也就穩定多了。


    遇到問題時，先問自己你的下一步該做什麼，或不該做什麼？


    當你知道了下一步的計劃後，心，自然也就平靜下來。


    所有問題，只要轉個念頭，一切就容易多了。不要允許自己一直被困在同一個點上，很多人的毛病，就是卡在無法「轉念」。轉念也是需要練習的，把它當做一個課題來練習，你會發現光是學會「轉念」這件事，將為你的人生帶來多大的價值(註2)。


    ## 你可以不用自己做，但你不能不會


    有些人不太容易發現自己的問題，因為在他們身邊有很多可以幫他們，這種人通常是主管，或是身邊「求救」資源很多的人。我並不是說請人幫忙不好，但在你求助之前，應該先想想「我是真的沒時間？這件事別人做會更適合、更有效率？」還是其實是我不會做，甚至害怕做這件事？


    註2：請見〈轉念，是所有問題的答案〉一文。


    💡 你可以不用自己做，但你不能不會。


    老爸退休前是一間公司的法律事務高層主管，他那時不會打字，也不太會用電腦。他有自己的秘書，所以之前他都用手寫好稿子，再交給秘書幫他打字。以他的職位，大可完全不用自己打字或寄email，交辦下去就好。但老爸說不希望浪費秘書的時間再做一次自己就可以做到的事，所以他想學會打字和寄信這些簡單的文書功能。於是在我退伍的那一年，他每天花一小時，要我到公司教他打字、寄email。


    經過這幾年來的練習，現在退休的他卸下了主管的光環，沒有秘書，也沒有屬下，但他已經學會自己打打字、上網查資料、看文章、看YouTube、收發email。因為他已經學會了，所以他的人生不再需要秘書、屬下或是我，而這些人也不會永遠在他身邊。


    你可以不用自己做，但你不能不會。只要學會了，你的人生從此不再由別人掌握，你可以拿回人生的主控權。就算你做得比較慢，做得沒那麼好，但至少你知道方法，一旦真的需要做的時候，就不必求助任何人。


    老爸沒有等到退休了，沒人幫他打字、處理公文的時候才去學打字、學文書處理，所以現在遇到朋友要請他幫忙法律問題時，他才可以「無痛銜接」，自立自強。


    同樣的道理，你會等到停電了才去買手電筒？還是等到失火


    ![](img/7a3931d50c2c9383cc41488956e04ae5_85_0.png)


    了才去買滅火器嗎？凡事真的不要等到來不及了才去學，才去做。趁還有時間、還沒壓力的時候就把該學的學會，因為等到壓力來了再學、再去彌補，那樣的痛苦是千百倍。在別人逼你自己之前先逼自己學會，讓自己成長，等哪一天真的需要了，你就可以從容應對。沒有人在嫌武器多的，在敵人還沒出現時就該把武器先準備好，等敵人都殺到你面前了才去磨刀，這樣來得及嗎？


    ## 你騙得過所有人，但你騙不過自己


    二十歲時做錯事情，身邊大多數人都比你年長，會覺得你才剛出社會，還是個孩子，不會沒關係。但當你四十歲時，身邊的人都比你小，他們會認為：「你都幾歲了，為什麼連這麼簡單的小事也不會？」什麼時候該學什麼就去學，不要逃避，不要閃躲；你可以躲得了一次、兩次，但躲不了一輩子。該面對自己的心情時，就學著好好面對。你可以騙過所有人，但你唯一騙不了的，就是自己的心。


    > 潤泰集團總裁尹衍樑說：「讓我進步的，全都是挫折！」


    股神巴菲特（Warren Edward Buffett）有一次在佛羅里達大學演講時，有學生提問：「談談你投資上的失誤吧！」


    > 巴菲特幽默地回問：「你有多少時間？」

