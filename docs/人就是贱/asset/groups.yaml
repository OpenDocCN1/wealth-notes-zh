    ![](img/7a3931d50c2c9383cc41488956e04ae5_151_0.png)


    ## 堅持的力量


    《212度》是本英文書，薄薄的，只有76頁，副標題是「額外的一度」（The Extra Degree）。


    作者強調在華氏211度（約攝氏99.444度）時，水是熱的，但非要到了華氏212度（約攝氏100度）時，水才會開，而也只有滾開的水才會冒出蒸汽，才能變成能量，才可以驅動一部火車。


    華氏211度的熱水和華氏212度的蒸汽只差一度，但差那一度，就決定了你只是熱水，或是成為能量；就這一度，決定了你是優秀和卓越的差別。


    不！那多餘的一度（The extra degree）或許就是成功與失敗之間的差別。


    水燒到210度，你說夠不夠熱？夠。


    水燒到211度夠不夠熱？夠，但沒辦法冒出蒸汽。


    很多時候，當你氣餒自己怎麼還沒成功，想放棄的時候，其實有時並不是你走錯路了，也不是努力太少，只是你茶壺中的水


    給時間一點時間，今天方向西南西。


    還沒燒到華氏212度，所以還沒辦法成為能量。


    中國最大互聯網站阿里巴巴的創辦人馬雲，說過一句經典名言：「今天很殘酷，明天更殘酷，後天很美好，但是絕大多數人死在明天晚上，見不著後天的太陽。」


    你說這問題出在哪裡？你沒有任何問題。


    唯一的問題，只是時間還沒到你就放棄了。如果你知道自己的方向正確，也有一直在努力，我請你把這句話永遠記在心裡——「如果你放棄了，你就不知道你離成功有多近了。」


    ## 給時間一點時間，今天方向西南西


    前幾天找我諮詢的朋友跟我說：「我一直很努力，但想做的事情卻一直沒實現，這讓我覺得很尷尬、很煩。」


    「你真的確定你走的方向是對的嗎？」我問她。


    「我很確定。」她堅定地回我。


    「那你不用擔心了，因為今天方向西南西。」我這麼說。


    有些事情，只要你的方向對了，努力夠了，那不是「會不會


    發生」的問題，而只是「何時發生」的問題，請你耐心地「給時間一點時間」。


    哥倫布（Christopher Columbus）第一次航行在沒有航海圖的北大西洋時，他每天在航海日誌上寫著：「今天我們繼續航行，方向西南西。」


    當時情況非常惡劣，因為暴風雨不斷侵襲，已損及小桅船，而船上也有一些水手鬱鬱寡歡。哥倫布在茫茫大海中，感到希望逐漸渺茫，信心似乎也開始動搖。


    然而，在無助之時，哥倫布回過神，再次堅定地告訴水手：「今天我們繼續航行，方向西南西。」最後，他終於找到新大陸，也留下這句經典名言：「今天方向西南西。」


    這是我在重考大學時，老師告訴我們的故事，我一直沒有忘。雖然堅持是最難的事情，但是只要我確認方向沒錯，當我覺得很煩、很累、想放棄時我都會告訴自己：「今天我要繼續航行，方向西南西。」


    別放棄，或許你離成功的距離，只差「1」度。


