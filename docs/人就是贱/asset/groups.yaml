    ## 為何那支點燃別人的蠟燭不是你？


    每個人都希望這世界可以多一點熱情、付出、有愛的人，但我只想問：「為什麼那個人不是你？」


    我要再鬼打牆般地問你一次，你希望別人成為熱情、付出、有愛的人，但：「為什麼那個人不是你？」


    我說過了，人們這個世界上通常都是互相影響的，如果你是個熱情的人，你就能成為一支點燃這世界的蠟燭。一顆熱情的心，會點燃另一顆熱情的心，儘管有些時候，你的蠟燭只能點燃自己，但更多時候，真的不要以為自己只是小小的燭光，因為你不知道誰會看到了你的熱情，也因此跟著熱情了起來。我也是支小小的蠟燭，我的力量很小，但我想用我的書點燃這世界，一次一個人，當點燃了夠多的蠟燭，我相信這世界將因此而不同，我真的深深、深深地這麼相信。


    如果你天生不是個熱情的人，那或許你是個願意付出的人，也或許你是個有愛的人，更或許你是個真誠的人。無論你本身擁有的特質是什麼，請你把自己玩大，然後去感染，去影響你身邊的人，讓他們跟你一樣熱情、付出、有愛、真誠。


    一個傳一個，別以為你的力量很小，你可以想像一個人把燭光傳給下一個，這樣就有兩個燭光，然後這兩支燭光再傳下去，就有四支燭光，2變4，4變8，8變16，最後就有無數的燭光，這世界也就亮了起來。但這一切，就因為有你這「第一枝燭光」。


    ## 你想什麼，你就得拿什麼來換


    如果這樣還是沒辦法讓你主動付出，去發揮你自己的能力，我老實告訴你好了，在我認識越來越多人，跟更多人深談過後，我真的相信老天是極度公平的，祂不會給你你不想付出的東西。之前聽過一個成功的創業家跟我說：「你要什麼，你就得拿什麼來換；你要時間，你就得先拿時間來換；你要金錢，你就得拿金錢來換。」


    她創業成功，把棒子交給別人，現在過著退休的生活，時間可以自己安排，金錢可以自己掌控，因為創業需要時間和金錢，這些她都付出過，所以她現在也都擁有了。別以為這道理只有在創業上成立，這世界的道理都一樣，就像我在自序中說的：「生命，是一個圈。」都一樣，只是你有沒有發現罷了。


    如果你要真愛，你得先付出真愛。


    你...你要什麼，你就得...先付出。


    這時我保證有人會開始想：「我先付出真愛，先把自己交出去了，我會不會因此受傷？」


    我跟你說：「你可能真的會受傷，但如果你不先付出真愛，你是得不到真愛的。」


    如果每個人都期望別人先付出愛，別人先付出熱情，別人先對我付出，總愛問：「為什麼他不先對我這麼做？」


    我只想「賞」你一句話：「你也是別人眼中的『他』。」他們也在期待你先付出愛，先付出熱情。如果每個人都期待別人先付出，自己等著先被別人付出，這世界將沒有人付出。但如果每個人都知道「我要什麼，我就得先付出什麼」，並且照著去做，我們的世界將變得十分美好。


    你還是可以不同意我說的任何一句話，但我知道我的確是因為這麼做而得到很多愛、很多付出、很多熱情、很多支持。如果 你一點都不熱情、付出，也不願付出真愛，但你卻可以得到別人的熱情、付出、真愛，那你就照著你行得通的方式做。


    如果你得不到，廢話少說，你就照著我的方法做，持續做，不要停。


    你要什麼，你就得先付出什麼。從你開始，把這個愛的迴力鏢丟出去，它會飛進所有人的心，最後飛回你心裡。


