    ## 💡 不怕死的最大。


    我發現每當我接受自己並說出這句話的時候，對方通常就無話可說，沒辦法再繼續虧下去了。因為「不怕死的最大」，當我都不怕死了，你又能如何？更重要的是，我發現當我說出這些話的時候，我處於一種「接受自己」的平靜。


    人有時候是很壞心的，因為你在虧別人的時候，不過是想看到對方的尷尬和不自在罷了。所以當你可以與自己的缺點和平共存，並且接受它的時候，虧你的人自然會自討沒趣，而你也會因為接受了，再也不會被你外表的缺點所困擾。


    或許你在意的外表缺點永遠不會消失，你也永遠沒辦法改變它，但你真的可以換個角度，以客觀的眼光看待它，告訴自己它就是你身體的一部分，它沒有對錯，而且「我愛我的身體」。


    如果你覺得自己很矮，那就用手摸著你的心，微笑地告訴自己：「是啊，我很矮，但它是 我身體的一部分，我接受它，我愛我的身高。」如果你 的眼睛很小，讓你很自卑，請用雙手摸著你的眼睛，微笑著告訴自己：「是啊，我的眼睛很小，但它是
    我身體的一部分，我愛我 的小眼睛。」如此一來，就算全世界都在看你所謂的缺點，你也能坦然面對，因為它是 你獨一無二的身體的一部分，它沒有對錯，它就是個事實，而且你愛它。


    這世上每個人都有缺點，更沒有人不會犯錯，連馬英九、歐巴馬這些有幕僚群的總統們都會犯錯了（還犯了一堆錯），你又


    怎麼會不犯錯？這世上沒有人是完美的，沒有人不會犯錯，當你能接受自己是不完美的，也一定會有犯錯的時候，你便有力量去面對錯誤，而且不再自責、後悔，有勇氣去面對一切。


    人的心其實很有趣，只要轉個念頭，你會發現人生其實是個選擇題，而不是是非題；選對了，你便可以擁有你的心，而不是讓你的心擁有你(註4)。


