    # 人，就是「賤」


    其實人是一種「不斷重蹈覆轍」又不斷「犯賤」的動物。我這邊指的「人」，沒錯，我指的就是「你」，和你周邊的所有人，當然也包括作者我本人。不瞞各位看倌，我就是從研究身邊所有人、Facebook朋友以及我本人的所作所為，才發現人的行為（人性）有個固定模式，如果要我總結成一句話……喔不，我不需要一句話，我只需要一個字，那就是「賤」。


    我對「賤」的定義簡單來說有以下四種：


    +   1. 你明知不該做還硬是要做（「口嫌體正直」，這個詞是日文，意思是「嘴巴說不要，但身體是誠實的」）。

    2. 明知「該做」卻還不做。

    3. 整天重蹈覆轍，犯一樣的錯卻還在抱怨。

    4. 直到失去了，才知道珍惜。

    5. 總是讓恐懼阻止你做對的事情。


    人賤沒什麼不好，因為這就是人性，但如果你一直「允許自己」繼續依照那犯賤的人性過生活，我不騙你，你永遠沒辦法成功，而且你還會愈活愈不快樂。'
  - '[PAGE 23]


    凡事沒有對錯，只是「你要什麼？」。


    唯有能先發現自己很賤的個性，你才有可能瞭解人性，進而跳脫人性，最後遠離「人性本賤」，成為一個自己想成為的人，成為一個快樂的人。


    本書深入淺出、一針見血的十五篇主題，讓你從各個角度看清自己或周遭親友做每一件賤事背後真正的原因，讓你不只看到人性的「表土層」，還讓你一次看穿人性的「地心」，教你戰勝你的心，讓你看到真相，最後讓你的心「自由」。


    看完這本書以後，你可以自己決定還要不要繼續當個「賤人」。想繼續當個賤人，或從此改變自己，這一切都沒有對錯，只是你必須問自己：「這是你想要的嗎？」


    如果不是，那——「你要什麼？」（註1）


    註1：請見〈生命中最重要的問題——「你要什麼？」〉一文。


