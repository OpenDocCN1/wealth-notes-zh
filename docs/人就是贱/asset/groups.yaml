    ## 不採取行動的風險


    最近我看了暗殺賽拉登的電影《凌晨秘令》，裡頭有句台詞讓我特別抄了下來。


    當時美國中情局的情報員一直力勸白宮的官員出兵，但因為


    註7：請見〈帶著預設立場，你有眼睛卻看不到，你有耳朵卻聽不到〉一文中——萬物，就像太極，你要看著物的兩面才看得到全貌。


    如果今天我不採取行動，將來我會有什麼損失？


    無法百分之百確認賓拉登是否在建築物裡，白宮的官員遲遲不肯批准這次的行動。最後這位官員問情報員：「如果我允許你們貿然採取行動，但裡頭的人不是賓拉登，你知道我們會有多大的損失嗎？」


    聽完這句話，我也覺得官員說的沒錯。如果我是那位情報員，應該也無話可說吧！而且誰知道賓拉登是不是真的在裡面？


    然而情報員卻反駁道：「那你怎麼不去算一算，如果裡頭真的是賓拉登，但我們卻沒有採取行動的損失是什麼？」


    白宮官員聽到這句話頓時啞口無言，隨後答應向總統報告這次的行動。


    下次當你猶豫不前，當你在顧慮：「如果我採取行動了，我會有什麼損失？」你可不可以也從另一個角度來問自己：「如果今天我不採取行動，將來我會有什麼損失？」


    根據心理學研究，人總是習慣著負面的東西。若是只看著自己現在會失去的，你會想放棄；


    你選擇看哪一邊？


    你的人生只有一次，有些事情不做不會怎樣，但做了會很不一樣；這是你的人生，你自己選擇。


    ## 你只能做自己，因為其它角色都有人了


    這世界其實很荒謬。你活在你爸媽的期望裡，你爸媽活在他們爸媽的期望裡，你也活在你女朋友、朋友、同事的期望裡，而你的女朋友也活在你的期望裡。所有人好像都在為別人而活，那到底誰為了自己而活？


    如果今天是你生命的最後一天，

    你還會那麼在乎別人的想法嗎？


    賈伯斯（Steve Jobs）雖然離開了世人，但他在史丹佛大學演講的那一席話，卻對很多人造成極大的影響，包括我。


    他是這麼說的：


    > 「我十七歲時曾讀過一句話：『如果你把每天都當成最後一天來過，總有一天你會證明自己是對的。』這句話對我影響很深。


    過去三十三年來，我每天早上都會對著鏡子說：『如果今天是我生命中的最後一天，我還會想做今天要做的事嗎？』如果很久以來，我的答案都是『不會』，那就表示我需要改變了。每當遇到生命中的重大抉擇時，只要想到我將不久於人世，便可以幫助我做出決定。因為，當你面對死亡時，幾乎每件事——所有外界的期待、所有的做慢、所有對錯、難堪或失敗的害怕——都會消失，只留下真正重要的東西。


    你的時間有限，不要把它浪費在為別人而活。


    記住，你即將不久於人世，這是我所知道讓你不會陷入害怕失去的泥沼裡的最好方法。你已經一無所有了，沒有理由不傾聽內心真正的聲音。


    你的時間有限，因此，不要把時間浪費在為別人而活。最重要的是，你要有勇氣傾聽你的真心與直覺，它們其實早已知道你真正想要的是什麼，其它都是次要的。」


    所以當你還在猶豫不前，為別人的理想、期盼過日子的時候，請你問自己：「如果今天是我生命的最後一天，我還會做今天在做的事，說出我現在正在說的話嗎？」就如同賈伯斯說的：「傾聽你的真心與直覺，它們其實早已知道你真正想要的是什麼。」你現在所要做的，就是去傾聽內心對你說的話，它一直在對你說話；只是你從來沒有認真聽，或是你也從來不願意聽，甚至害怕去聽懂了。


