    \ \n2. 當你遇到挫折和難關時，你可以翻翻〈別「允許」自己被困在同一個點上〉。 \n3. 當你害怕，被「恐懼」阻止你該做的事情時，你可以看〈違反人性的成功之略——「會怕，但還是要去做」〉。\
