    💡 你要什麼？你到底要什麼？


    我在臉書上常說：「這一切都沒有對錯，只是這真的是你想要的人生嗎？」（註1）


    你知道你心裡「真正想要」的是什麼嗎？或許你不相信，其實大多數人是不知道自己要什麼的。


    ## 大多數人是沒有目標、沒有夢想的


    我有個台大畢業十幾年的朋友，有一次他在一個一百多人的活動中上台跟大家說：「我從台大畢業十幾年了。我問過很多同為台大畢業的朋友，卻發現他們竟然都不知道自己到底要什麼。我想既然連台大畢業生都不知道自己到底要什麼，應該很多人也不知道自己人生的目標吧？」


    這番話引起台下議論紛紛，因為多數人認為台大畢業生沒目標、沒夢想，不代表其他人也同樣沒目標、沒夢想。


    我沒興趣針對「學校優越感」的問題打筆戰，但他這番話的確令人驚訝。不可否認的，台大的學生的確是全台灣學科成績排名前10%以內的學生，如果連如此頂尖的人畢業了都還不知道自己人生的目標，那「沒夢想、沒目標」這個問題或許也會發生在你的身上。


    註1：我的臉書：Jau Ji

    臉書粉絲團：「拉米心靈諮詢」、「人，就是膽」


    ## Lesson 3

    生命中最重要的問題——「你要什麼？」


    「你要什麼？」是個很重要的問題，

    因為人生就像一場馬拉松，而你必須問自己：

    「我愛的終點在哪裡？」


    或許你覺得：「人生，何苦那麼嚴肅？過一天算一天就好。」你說的沒錯，只想過好每一天，不去想未來要的是什麼，這並沒有錯，但「這真的是你要的嗎？」其實人生就像一場馬拉松，出生是你起跑的一刻，死亡是你越過終點線的時刻；每度過一天，就等於你又往前跑了一小步，跑完馬拉松的全程，你人生的馬拉松也就此結束。


    人生的起點和終點，或許我們不能決定，但我們能決定想跟誰一起跑、怎麼跑，以及要跑到哪裡去。


    或許你覺得人生的馬拉松還很長遠，你懶得思考、不願思考，或逃避思考，你只想「無腦地度過每一天」。但或許你沒發現，其實這場馬拉松你是踩在輸送帶上面的，就算你不動，人生的馬拉松還是每天在前進的。你可以不思考，每天讓輸送帶這樣帶著你走，但等到你跟所有人一起被輸送帶送到人生的終點時，你才發現：「原來這不是我想跑的馬拉松！」你想等到那天才來後悔嗎？


    或許你覺得時間過得很慢，永遠都有時間(註2)，那麼就讓我來提醒你一下吧！你今年幾歲了？你曾經有目標嗎？你的目標做到了多少？


    註2：請見〈不是沒錢、沒時間，是你覺得不重要，是你沒有心〉一文。


    💡 就算你會拖延，但時間不會等你。


    我在大學畢業23歲時訂下一個目標，五年內一定要當上主管，但訂完這目標後，我就沒放在心上，更別說為我的目標而努力。過了五年後的28歲，我發現我的薪水反而比五年前更少。你能想像那種感覺嗎？你可以想像如果我不改變，再過二十年，我還是會過著我不要的人生。


    時間不等 人，就算你什麼都不做，它也會帶你到什麼都不做之後該去的地方，給予你該有的結果。


    如果你不想等到跑到終點再後悔，請你現在就開始思考：「我要什麼？這是不是我想參加的馬拉松？」


    ## Lesson 3

    生命中最重要的問題——「你要什麼？」


    ## 生命，有時不在於找到對的答案，在於找到對的「問題」


    「生命，有時不在於找到對的答案，在於找到對的『問題』。」當初看到這句話，我沉思了很久，雖然還不瞭解這句話的意思，但依稀能感受到這句話的意義，於是我開始不斷問自己問題。漸漸地，我開始能瞭解這句話的精義，那就是：「問題對了，對的答案就會出現了。」


    ## 問題對了，對的答案就會出現了


    關於「你要什麼？」我常用一個簡單的情況來問大家：


    「如果今天你是個房東，在台北市有十間房子，一間自己住，九間租給別人。你什麼都不用做，每個月的月初就有五十萬的房租自動匯到你戶頭，生生世世、直到永遠，你會怎麼過你的人生？」


    請你花個五分鐘，至少寫下三個答案：「如果什麼事都不用做，每個月就有五十萬，你會做什麼？」


    💡 問題大了，對的答案才露出來。


    我看過有些書會請你寫下一些心得，但我也知道你從來沒照著做過。因為人就是討厭動腦思考和執行，所以才會落得現在這個地步，但這次不一樣。


    > 「在這個人世間，我到底要什麼？」


    對你來說，這是個無比重要的問題。你現在不問，難道要等你七老八十，躺在病床上才問自己「我到底要什麼」嗎？所以請靜下心來，問自己：「如果沒有時間和錢的限制，我想做什麼？」花點時間，寫得愈明確愈好，開始！


    - 1. ________________

    - 2. ________________

    - 3. ________________


    以下是我想做的三件事：


    1. 及正 每個月都固定有五十萬的收入，我要花半年時間，慢慢享受一個人的環遊世界之旅。想買什麼東西就買，想去什麼地方就去，不需要問任何人，也不必跟任何人報告。


    2. 在市和買一間自己很喜歡的房子。它不用很大，但要有一間屬於自己的練習室和有座椅的露台。在每天早上醒到自然醒後，我會在露台上吃早餐、喝咖啡，接著去練習室揮汗跳舞，跳自己喜歡的舞。


    3. 每個月固定捐三萬塊給需要幫助的貧窮人家，或者養流浪狗的愛心爸爸、媽媽。每個禮拜抽空去全台灣做流浪狗義工，親自照顧狗狗。


    為什麼「每月自動會有五十萬元收入」的前提那麼重要呢？


    因為大家不能、不敢、不願去作夢的原因，絕大部分都是因為「沒錢、沒時間」（註3）。而沒時間的原因，絕大部分又來自於「要把時間拿去賺錢」（你說是不是嘛？）現在我把這些會影響你「作夢」的因素都去掉，你就可以知道在沒有金錢和時間的限制下，你到底要的是什麼？


    而這個夢想，必須是「當你真的實現後，會覺得非常開心的夢想」。


    註3：請見〈不是沒錢、沒時間，是你覺得不重要，是你沒有心〉一文。


    💡 你内心最深层的渴望是什么？


    看深一点，看得再深一点，在这些梦想的背后，你「最终要的是什么？」


    我希望你是真的写下来了，因为这个答案对你太重要了。现在你知道你的梦想是什么了，但有些人可能还不清楚：「我为何要这个梦想？」


    而「我为何要这个梦想」会如此重要呢？因为「做一件事情的原因，永远比怎么做那件事来得重要。」。所以你必须问自己：「在这个梦想或目标中，我最终要的是什么？」


    只有当你像剥洋葱一样，一层一层往下剥，剥到问题的最核心时，你才会知道：「原来我要的是这个呀！」而你要的这个东西，通常是抽象的。


    不要被虚假的答案迷惑，我要听到你心裡最底层的原̇因和渴望


    举个例子：


    如果你的目标是买一栋漂亮的房子，你接下来要做的事不是立刻开始努力赚钱，而是先问自己：「为什么买一栋漂亮的房子对我这么重要？」


    这时你可能会回答：「因为我从小就一直很嚮往住在漂亮的房子裡。」


    這聽起來很像是答案，但這是個「假答案」，因為我在問你原因，而你沒有真的回答我的問題。你必須意識到這件事，否則你的人生會永遠被一堆很表面的假答案所迷惑。


    回到正題，你得像剝洋蔥一樣，一層一層地剝下去。


    我再問一次：「為什麼買一棟漂亮的房子對我這麼重要？」


    如果你的答案是：「我想要有自己的房子，因為在裡面我可以裝潢成自己喜歡的樣子，有自己的更衣室、按摩浴缸，還有一間小小的書房，我可以在裡面做自己喜歡的事。」


    這時候我會說：「嗯，你有點接近了。」


    我再接著問下去：「為什麼這樣的生活對你那麼重要呢？」


    你回答：「因為我覺得這樣的生活，會讓我覺得很快樂，很有成就感，讓我喜歡我自己。」


    Bingo！我就是要這個答案：「擁有快樂與成就感，讓我喜歡自己。」


    為什麼知道「有自己的房子，是因為它可以讓你感到很開心、很快樂」這麼重要呢？因為當你追根究柢去探究「為什麼」


    ## 我在哪麼？我到底要什麼？


    時，你會得到一個無形的答案。


    在工作上，你真正乎的可能不是錢，而是「成就感」；就算你真的在乎錢，你可能也是在乎錢背後能換來的東西和成就感；在感情上，你真正乎的不見得是另一半具備經濟基礎、長得又高又帥，而是有能給你一種「可以信任、可以互相扶持一輩子」的感覺。


    當你看到你做一件事情背後真正的動機，你會非常堅定，不再被外在的迷霧所惑


    回到前例：「為什麼買一棟漂亮的房子對我這麼重要？」這時你必須知道，你要的是房子能帶給你的「快樂」，而擁有房子這件事，只是個幫你實現快樂的「工具」。


    我沒說這工具不重要，但最重要的是快樂。你必須花一輩子去追求內心深處真正的渴望，不然你不會快樂的。


    我建議無論在任何領域，尤其是在設定夢想和想要的另一半的特質時不斷問自己這個問題：「我要什麼？我到底要什麼？」因為當你真的清楚這些問題的答案後，你才會很清楚你最終的目的地在哪裡。


    回答完你的「我要什麼」之後，或許很多人會再接著說：


    ## Lesson 3 生命中最重要的問題——「你要什麼？」


    「等我做到了這些事情以後，我就要……。」


    我直接幫你打斷這句話。


    給你個忠告，如果你想活出自己想要的人生，我勸你從此別再說：「等我……我就……。」而是把這句話換成：「我現在還做不到這麼多……不過我現在可以做些什麼？」


    夢想不去執行，終究也會變成空想。


    ## 不。要。等


    上個月我去接待一位年輕的企業家Kathy，親切的她跟我說了個故事：


    > 「我的爸爸事業很成功。他從很久以前就跟我媽媽談過，他要在50歲時退休，然後帶媽媽出國遊山玩水。我爸的事業的確很成功，但他在49歲時發現自己罹患癌症末期，50歲就離開了人事，所以他根本無法實現他的承諾。這件事，讓我學會了三個字：『不。要。等』。」她平靜地說。


    如果你知道自己要什麼，不要等。

    問自己：「我現在可以做到什麼？」


    這世上知道自己夢想的人並不多，但每當我知道別人有夢想以後，我最常聽到他們說的一句話是：「等我……我就會……。」這是很可惜的事情。因為，有了夢想不開始執行，夢想經過不斷拖延，終究也會變成空想。


    來對號入座吧！我聽過的實際案例有：「等我中了樂透，我就要幫爸媽買棟房子，好好孝敬他們」、 「等我比較不忙了，我就要開始運動」、 「等孩子長大了，我就會去做自己想做的事
    情」、「等我有錢了，我要開一家養老院」。


    或許你會覺得這些話都很合理，當然是告訴自己：「等我做到了，我就會……」不然要怎麼說？


    不是的，你該跟自己說的是：「既然我沒辦法做到那麼多，不過我現在可以做些什麼？」


    因為如果你常說：「等我做到 A，我就會去做 B。」


    我想請問你，你所謂的「等我做到 A」，你真的有做到過 A 這個目標嗎？


    就算你真的做到了 A，你又真的會去做到 B 嗎？


    「等我有錢、有時間了，我就要來好好陪我爸媽，孝順他們了。」每次我聽到有人這麼說，都會想問他們：「你何時會有錢？何時會有時間？」就算你等得到那一天，你爸媽等得到那一天嗎？


    ## 真正要做的人，不會說：「等我……我就……」


    如果你想追一個女生，你會說：「等我有錢、有時間；等到她喜歡我了，我再去追她。」是嗎？


    不會的，因為等到「萬事俱備」時，這女孩早就跟別人跑


    💡 人生不是只有0分和100分，你現在可以做什麼？


    了。這世界不會等你，我們都在等待中錯過了太多東西。不要等到你完全有錢、有時間，再去做這些自己很想做的事情。你應該問自己的是：「在如此有限的時間、金錢裡，我可以做到什麼？」


    如果你說：「等我有錢了，我要來開養老院。」我會問：「那你現在能做到什麼？你是不是能利用假日或下班時間去服務老人？」


    如果你常說：「等以後有時間了，我再認真把英文學好。」我會問：「那你現在能做到什麼？是不是能少看點電視、少看點無腦偶像劇，利用每天短短的時間來背單字、聽英文、練習講英文？」


    ## 人生不是只有0分和100分，你現在可以做什麼？


    如我剛才所說的，我的目標是：「去至台灣做流浪狗義工，每個月捐三萬給愛心媽媽的狗場。」這些目標我目前還做不到，所以我就什麼都不做嗎？


    不是的，我問自己：「我現在能做到什麼？」


    於是我固定抽出時間去當流浪狗義工、每天在Facebook上分享流浪狗認養的照片、每個月捐錢給需要的狗場，或召集朋友抱不需要的衣服寄到動物收容中心讓狗狗禦寒。


    當我還做不到想做的一百分的時候，我知道這世上不是只有零分和一百分。從零到一百分，這中間有太多分數可以拿了，即使拿了一百分的人，也是一分一分這樣加上來的。。「等我……我就……」這只不過是你給自己的藉口和不想付出代價的理由罷了，別以為我不知道，因為我以前也是過來人，你別想騙我這個過來人。


    如果全世界的人都等到有時間、有錢再來幫助別人，等到中了樂透以後再去做善事，我們的世界將不會進步，你的世界更不會進步。


    > 「別讓恐懼阻止你做對的事情。」

    > ——諾貝爾和平獎得主，翁山蘇姬


    當我在Facebook的粉絲頁寫下這句話時，這句話被按「讚」的數字，大約是平常的五倍。我很喜歡用Facebook來觀察大家對哪些話有共鳴，就這個例子來看，「大家都讓恐懼阻止我們做對的事情」，或許還不只恐懼，很多時候，你明明知道該做什麼，可是因為周遭的環境、旁人的冷言冷語，或受到自己的心態、情緒或「逃避痛苦，追求快樂」（註4）所影響，讓你不去做「你明知道該做的事情」。


    註4：請見〈違反人性的成功之 pest ——「會怕，但還是要去做。」〉一文。


    別讓恐懼阻止你做對的事情。


    同樣的，面對恐懼，被周遭環境所影響時，最好的方式就是「問自己對的問題」。


    ## 問題對了，行動就對了


    除了「你要什麼」這個大方向的問題之外，在被任何外在環境或自己情緒所影響時，我還會問自己以下三個問題：


    - 1. 這是我的「想要」，還是我的「需要」？

    - 2. 這是我的「想做」、「會做」，還是我的「該做」？

    - 3. 到底是「過程」比較重要，還是「結果」比較重要？


    ## 這是我的「想要」，還是我的「需要」？


    「這是我的想要，還是我的需要？」我建議你把這個問題放在心中，常常去思考這個問題，因為它不但能幫你克制亂花錢的衝動，而且可以幫助你更瞭解：「對我而言，現在什麼事情更重要？」


    有些人物質慾望比較低，只要能把錢拿來換「需要」的生命必需品就可以過得很舒服；但有些人「想要」的比較多，所以得多賺點錢去滿足自己或家人除了「需要」以外更多「想要」的部分。這些都沒有對錯，就看你要什麼。當我開始不斷問自己這是「想要」或「需要」，我發現人生開始不一樣了。


    💡 這是我的「想要」，還是我的「需要」？


    每次從皮包拿出錢來時，你可以問自己：「這是我的想要，還是我的需要？」如果只是想滿足口腹之慾，或是非生活必需品，就可以判斷這是你的「想要」，而且它對未來並沒有任何產值或加分。


    所以在金錢不是很充裕時，這些「想要」都可以儘量減少，先滿足「需要」的部分就好。（當然，有福利才有戰力，偶爾讓自己享受一下是沒問題的。）


    可惜的是，很多人都分不清「想要」和「需要」。我聽過太多人說自己很窮，然而幾天後就買了新電腦、換了新手機、又吃了什麼大餐，或趁著打折時買了價格昂貴的包包。結果這些「想要」的東西讓他們的生活更加難過，甚至最後連「需要」的東西都付不出來，這不是本末倒置嗎？


    舒淇說過：「十萬塊錢是一餐，五<|start|>十塊也是一餐，有得吃、有得住、有得穿，難道還不夠嗎？」十萬塊一餐是「想要」，五十塊一餐是「需要」，你分得出你現在花的每一塊錢，是想要還是需要嗎？


    這一切依然沒有對錯，只是你要什麼？這是你的想要，還是你的需要？


    ## 這是你的「想做」、「會做」還是「該做」？


    人總是習慣做自己「想做」、「會做」的事情，但很可惜如果 你想讓自己進步，讓你想要的結果發生，就不能只停留在你「想做」、「會做」的事情，你必須去做「該做」的事情。於是當我發現自己下意識在逃避「我明知該做的事情」時，我就會問自己：「這是我的『想做』、『會做』、還是我的『該做』？」


    每當我問自己這個問題時，我總能清楚地告訴自己：「只停留在想做、會做是不行的，我得去做我該做的事情了。」


    ## 對我來說，到底是「過程」比較重要，還是「結果」比較重要？


    這個問題的答案見仁見智，或許有時你會覺得「過程」比較重要，有時你會覺得「結果」比較重要。你不一定要認同我說的，也不一定要認同我這本書的任何一個觀點，但請你開放你的心，不要有任何預設立場。如果
    你一直認為「過程」比「結果」更重要，我請你問自己下面這個問題：


    請問是「追女朋友的過程」比較重要，還是「追到女朋友」這個「結果」比較重要？


    如果你還是覺得結果不重要，過程比較重要，我來舉個例子：對大多數上班族而言，上班是個「過程」，拿到薪水是你想


    ## 到底是過程比較重要，還是結果比較重要？


    要的「結果」，假設你「很熱愛工作」，也就是說你很享受工作的「過程」。如果你堅持「過程」比「結果」重要，假設我是你老闆，我就會跟你說：「這一個月來辛苦你了，既然你對工作這個『過程』超感興趣，所以『結果』就不是那麼重要了，這個月的薪水就不發了，可以嗎？」（我一定是個很賤的老闆。）


    當老闆不發薪水給你時，你還會覺得過程比結果重要嗎？


    ## 看深一點，

    ## 看到你做每件事的最終目的


    我們做每一件事情，都有它的「目的」。

    你的「最終目的」是什麼？


    有些人會說：「何必做什麼事都要有目的？」你說的沒錯，你想要順其自然，但你只是沒發現，其實我們做每件事情都是有「目的」。


    你以為呼吸很自然，但呼吸是為了要活下去，「活下去」就是呼吸的目的，是你要的「結果」；睡眠的「目的」是要讓身體休息，補充能量；工作的「目的」是要賺錢，拿你工作賺的錢，去換其它你想要換的東西。就連你出門漫無目的地散步走走，都是為了想要放鬆心情的這個「目的」，不是嗎？


    既然做任何事都有目的，而且剛才提到「結果很重要」，所以你根本沒必要抗拒「有目的性的做事」。


    阿里巴巴創辦人馬雲說過：「有結果未必是成功，但沒有結果一定是失敗。」


    做到了就是堅持，沒做到就是固執。


    所以你必須常問自己：「做這件事，我最終要的什麼？」因為這是讓你直接看著遠方的目的地，不被沿途風景或情緒所影響的關鍵問題。


    ## 看得夠遠，你不會被眼前的障礙卡住


    世界頂尖的F1賽車手在開車的時候，眼光是注視著最前方的彎道，所以他的反應時間不到0.45秒，但一般駕駛看的是「前方車輛的車牌」，所以反應時間需要0.7秒。這代表如果你看著遠方的目標，你就不會被眼前的障礙卡住(註5)。


    ## 做到了就是堅持，沒做到就是固執


    我有個親人花了好多年考公務員，在還沒考上之前，大家都說：「不要再固執了，去找一份正職的工作吧！」


    也很多人 在背後諷他：「都幾歲了，還不去做正事？」一年後他終於考上了，大家就說：「當初的堅持是對的，現在鐵飯碗多值錢呀！」


    當你做到一件很不容易完成，或大家都不看好的事之前，很多人會覺得你很「固執」，要證明你是「堅持」而非「固執」的最好方法，就是「做到它」。當你做到之後，你會發現原來在別


    註5：請見〈違反人性的成功之路——「會怕，但還是要去做。」〉一文中——看著夢想，因為那是你力量的來源。


    人眼中，堅持和固執的一線之隔，原來只是有沒有達成「結果」而已。


    ## 讓結果發生，別過度堅持在「方式」上


    一般人無法成功，多半是因為過度堅持在「按照我想要的方式來做」、「我的情緒來了，老子（老娘）不想做」。但我想問你：「是按照你的方式重要，還是能達到結果重要？是情緒重要，還是達到結果重要？」


    有次我跟一位同學約晚上六點在台北車站碰面，準備在附近吃頓大餐。我訂位的時間是六點十分，但朋友六點三十分才到，而且連電話都不接。我當下很生氣，就向他抱怨：「你為什麼不早點跟我說你會遲到，現在連訂位都沒了，這不是第一次了，為什麼每次都要搞這種飛機？」


    沒想到他也很生氣地回我：「我不是到了嗎？我之前手上有些事在處理，沒辦法立即回電給你呀！」


    我聽完還是很不高興，但我知道再這樣吵下去，這頓飯我就確定不用吃了。


    於是我問自己：「是繼續跟他吵下去，讓對方知錯認輸比較重要，還是好好吃這頓飯比較重要？」

