    # Lesson 7


    # 做自己，你行嗎？


    > 「你只能做自己，因為其它角色都有人了。」


    ![](img/7a3931d50c2c9383cc41488956e04ae5_107_0.png)


    ## 重點不是你說什麼，而是你怎麼說


    這二年多來，因為上了一個潛能開發課程的關係，有機會和許多人聊到「你要什麼？」(註1)。令我意外的是，我以為聽到最多的答案會是「我要賺錢」或「我要找個好老公、好老婆、好工作」之類的標準答案，沒想到，我聽到不少人都說出同一個答案，那就是：「我要做自己。」


    當我聽到第一個人說「我要做自己」時，我以為這只是個案，後來聽到愈來愈多朋友說出這個答案，我才發現，「原來做自己，對他們來說有這麼難呀！」我在課程中還學到另一個很重要的概念，那就是：「當很多人都說了同一件事時，這件事不一定是真的或是對的，但其中一定有值得我們注意的地方。」


    這麼多個案，讓我不得不發現其實「大家都不敢做自己」，但為什麼你不敢做自己呢？因為你怕別人討厭你，所以你不敢說自己想說的話，也不放做自己想做的事。


    ### 不敢說自己想說的話


    小靜是我的大學同學，她的人緣很好，在我眼中是個「沒有人會討厭她」的那種類型。有一外我問她：「我覺得你跟每個人都處得滿不錯的，我之前問到好多人都說他們沒辦法做自己，你覺得你可以『做自己』嗎？」


    她的答案完全出乎我意料之外。


    「拉米，你別鬧了，如果我真的做自己，早就會被社會遺棄了！」她睜大眼睛看著我，彷彿我問了一個很蠢的問題似的。


    被・社・會・遺・棄？


    聽起來好「嚴重」的五個字呀！我忍不住追問：「為什麼你沒辦法做自己？」


    「因為我不能說自己想說的話啊！我如果都說真話，會得罪很多人的。」她理所當然地回答。


    她說的沒錯，我想這也是大多數人無法做自己的首要原因——「不敢說真話」。


    我後來仔細思考過這個問題，因為一直以來我就是個有話直說的人。我打電話給人家，都是第一句就切入重點，沒有在刻意寒暄的，但我也沒有被「社會遺棄」啊！所以我和這位同學的差別到底在哪裡？後來我終於找到幾個「能做自己」的人（有空


    註1：請見〈生命中最重要的問題——「你要什麼？」〉一文。


    你可以問看看，能做自己的人真的不多），最後我找到了答案，這個答案就是——能做自己的人，都是個好翻譯。


    是的，你沒看錯，我也沒打錯，「好．翻．譯」。


    因為你不懂「翻譯」的能力，所以你沒辦法把想說的話轉換成別人可以接受的語言，最後讓你有意見也不敢表達，真心話也不敢明講，甚至不敢拒絕別人。


    ## 重點不是你說什麼，而是你怎麼說


    我以前在英文教學雜誌社工作，負責製作國中英文月刊。有一期我們要做一篇「禮貌性問句」的英文句型，我便問了隔壁的外籍主編，有什麼樣的英文句子是可以顯示出禮貌的。


    他列了好多常見的「Would you please……？」、「Could you do me a favor……？」等句子，但因為句型還不夠湊成一篇，我一直逼問他：「還有沒有其它的句型？」


    他最後語重心長地說：「拉米，其實重點不在於你用什麼句型，重點是在於你說話的語氣。如果妳用了『Would you please……？』，卻是以很兇的語氣跟人家對話，這個『Would
    you please』還不是白說了？即使你只是以平鋪直述的句子跟人家說話，但你的語氣很好、表情微笑，人家還是覺得你很有禮貌。」


    那位很像馬蓋先的外籍主編還現場示範語氣給我看，讓我知道重點真的不在於你用了什麼 Erie 句子，而是你用什麼語氣跟人家說話。


    所以，重點不在於你說什麼，重點在於你怎麼說。


    你或許會問：「這跟我不能做自己，不能表達自己想說的話有什麼關係？」其實人生很多道理都是相通的，就看你有沒有發現而已。


    你不能就實表達自己想說的話，是因為你沒辦法把想說的話轉個彎，翻譯成別人聽得懂、能接受，而你也想說的句子。所以「翻譯」是你練習做自己的過程中，最需要學好的能力，這樣的能力只要你會講中文就有，因為你不過是把「你內心裡很想講的實話」翻譯成「別人也可以接受的話」，我老實說這是需要練習的，但你不要跟我說你做不到，不然我會覺得這就像你在跟我說「沒錢、沒時間」一樣鬼扯(註2)。


    註2：請見〈不是沒錢、沒時間，是你覺得不重要，是你沒有心〉一文。


    ![](img/7a3931d50c2c9383cc41488956e04ae5_111_0.png)


    從A點到B點有無數種方式，

    而你想說的話，也可以無數種方式表達出來


    如果你想訂除夕從台北到高雄的高鐵車票，回來跟家人吃年夜飯，不巧高鐵票都賣完了。難道你會因此不回高雄嗎？不會。


    除了高鐵，你還可以選擇坐客運、坐火車、坐飛機或租車開回去。如果再熱血一點，你甚至可以三天前就騎機車、腳踏車回去，因為從A點到B點有無數種方式，看你怎麼走而已。


    你心裡想說的話也是一樣，你可以直接說，也可以寫信，更可以利用Line傳訊息，或是撒嬌地說、拐彎抹角地說，可以請別人幫你說，或等到對方心情好的時候再說。總而言之，如果你真的很想說，沒人規定你一定要用什麼方式說出來，只要能完整表達出內心的意思就好，但就是不要不說，因為不說會內傷，這點我想你懂。


    ## 如果你自己也能接受，那就可以講出來


    我看過很多種「翻譯」（轉化）話語的方式，其中我認為「惟識深層溝通」技巧裡提到的標準是最簡單易懂的，它的概念是一——「你說出口的話，如果自己身為當事人也可以接受，那就
    可以講」。你想講的話，如果你是對方也可以接受，就不需要害怕動輒得咎，害怕講出口會被討厭。這時可能有人會問：「如果 我自己可以接受，但別人還是沒辦法接受該怎麼辦？」


    人生的很多問題是你「幻想」出來的。


    ## 因材施教，所以你得不斷修正


    沒錯，因為每個人能接受的程度不同，在經過你判斷之後，覺得這樣講自己和對方都可以接受，那你就說吧！但如果你說出來以後，他還是沒辦法接受的話，你可以跟他說聲抱歉，把這件事記起來，下次再用更婉轉或其他不同的方式跟他溝通。因為每個人生長的背景不同，可以接受的方式也不同，所以很多時候，有些人可以直接跟他說，有些人必須拐彎抹角地告訴他，還有些人則得透過其他人來轉達，但最終只要能達到你的目的「將想說的話表達出來」就行了。但首要條件就是你必須去嘗試，很多時候你會害怕別人
    生氣、討厭你，但其實他們根本不覺得有什麼，這些都只是你的預設立場所「幻想出來」，自己嚇自己的。


    > 馬克·吐溫（Mark Twain）說過：「我人生中大約有90%的困擾，都是自己幻想出來的，事實上它們根本沒真正發生過。」


    ## 執行、修正、釀成結果


    要學會做自己，你得先學習當個稱職的「翻譯」；要當個稱職的翻譯，你就得跟所有成功人士做一樣的事：「執行——修正——創造結果」。你得先開始練習，再從執行中慢慢修正，然後達到你要的結果，也就是表達出你心裡的想法，並讓對方也能接受，如此而已。但如果你不肯跨出第一步，不敢表達你內心真正的想法，永遠害怕對方是否會因你說出真心話而討厭你，你就只能一輩子戴著面具過日子。


    ![](img/7a3931d50c2c9383cc41488956e04ae5_113_0.png)


    ## 如果該做的都做了，有些人還是沒辦法接受怎麼辦？


    先容我小小岔個題：如果你是那種很難接受別人對你有話直說的人，首先，我敢保證你一定是很容​易受傷、很沒自信而且人緣不好的人。


    你就像個一碰就碎的玻璃娃娃，人家跟你相處時必須隨時帶著防備，深怕又講錯什麼話弄傷了你，隨時都要顧慮著你的心情，讓別人對你總有一種戒心，更無法靠近你。這樣惡性循環下去，你也是造成別人無法做自己的最大因素。在這裡我不想描述太多，我只想跟你提一個觀念——如果你會因他人的話語而受傷，那一定是你心裡在意的事情被說中了，因為你不會被自己不相信、不介意的事情傷害。


    ## 你不會被你不相信、不介意的輿情傷到


    如果你是個身高185公分的籃球校隊隊長，長得又帥又斯文，功課又好，異性緣更是 incompatible，常​常有女同學寫情書給你，你也對自己的外在條件很有自信。這時有個曾被你拒絕過的女孩​子突然跑來跟你說：「我覺得你是個死矮子，長得又矮又醜，這輩子應該不會有人喜歡你。」


    如果你真的對自己很有自信，你還是有可能會生氣，覺得這女的是瘋子，但你不會被她的話「傷到」，因為你知道她說的不是事實。就算今天姚明跟你說：「我覺得你超～～矮的。」金城


    💡 你不會被你不相信、不介意的輿情傷害到。


    武鄙視你：「你長這樣也敢出來混喔？你應該交不到女朋友吧！」我想你只會覺得姚明和金城武他們是瘋子。你的身高或許比姚明矮了40多公分，長相也沒金城武那麼帥，但因為你知道自己不矮、不醜，所以你絕對不會被傷到。


    但如果你從小就覺得自己很矮，一直很介意自己的身高和長相，這時偶爾有人說你又矮又醜，我相信你被這個人傷到的機率就很高了。可是不管你真的很矮很醜，卻從不介意自己的身高和長相，即使人家講話再怎麼難聽，你還是不會被傷到。


    所以你知道嗎？「只要你不同意，只要你有信心，這世上沒人傷得了你。」如果你被人家的言語傷到了，或許就代表你心裡的某一部分同意他所說的話。


    好了，我自己拉回正題。


    「如果我再怎麼小心說話，還是有额人討厭我怎麼辦？」


    Lesson 7 做自己，你行嗎？


    ## 做自己，不要怕


    ## 要做自己，你不能怕別人討厭你


    大家不能做自己，不敢說真心話其實只是原因之一，最大的根源，其實是大家怕說出真心話後別人會因此討厭你。斬草不除根，春風吹又生，如果你想開開心心地做自己，就必須「不怕別人討厭你」。


    ## 這世上一定有人討厭你


    我先告訴你一個事實，你如果能接受，剩下的就搞定了！那就是——無論你表現得再好，用畢生精力討好你認識的所有人，還是會有人討厭你。


    如果你跟《那些年，我們一起追的女孩》電影裡的沈佳宜一樣，是個品學兼優又漂亮的好學生，可能就會有功課不好的柯景騰覺得你很臭屁而討厭你，也可能會有其他女生因為嫉妒你條件太好而討厭你。如果你是個壞學生，整天不念書，好學生自然也不會喜歡跟你來往，甚至討厭你的不成材。


    在社會上也是一樣。無論你再八面玲瓏，講話多麼得體，也不可能讓所有人都喜歡你。因此如果你的人生目標是「讓所有人


    💡 愛做自己，你不能怕別人討厭你。


    都喜歡我」（我真的聽朋友說過這是他的人生目標），我勸你還是遲早放棄吧！沈佳宜說過：「人生本來就有很多事是徒勞無功的。」討好所有人，不但是世上最徒勞無功的事，還會讓你過得很痛苦。


    ## 「我不怕別人討厭我了。」


    我的學姐小艾是位國中英文老師，有一次她上台分享自己的故事，並說了一句令我驚誥不已的話：「以前的我一直很擔心別人討厭我，在乎別人對我的看法，在乎學生怎麼看我，這樣的人生讓我過得很痛苦。直到後來，我終於不再害怕別人討厭我了，我的心才真正得到自由。」


    「我・不・怕・別・人・討・厭・我・了。」


    這短短幾個字，她說得如此平靜，卻如此有力量，讓在台下的我突然很感動，在筆記本上用力刻下「我・不・怕・別・人・討・厭・我・了」這幾個字。我不知道為什麼，中文字這麼多，我是當翻譯的，也看過不少書，但這短短九個字的排列組合，我為什麼從來沒有聽別人合在一起講過？是因為我才疏學淺，還是大家真的都很怕被別人討厭？


    看著她在台上繼續談笑風生地跟來賓互動，我懂了。當她平靜地說出：「我不怕別人討厭我了。」我知道小艾學姐真的自由


    了，她再也不會受別人的眼光所苦了。我能想像她說出這句話需要多麼大的勇氣，太多人就是怕別人討厭自己，所以才會在乎別人的看法，但既然再怎麼做，都會有人討厭你，你又何必太在意別人的看法呢？


    ## 我不想破壞關係，但我不怕破壞關係


    凡事就像中庸之道，過與不及都不是好事。在你做到「我不怕別人討厭我」之後，你還要記得「我不想破壞關係，但我不怕破壞關係」。因為唯有不想破壞關係，你才能待人真誠，為人付出，做個可愛的自己。但也唯有不怕破壞關係，你才能說出真心話，擁有真摯的友情和感情。


    倘若因為擔心關係出現裂痕，就什麼話都不敢跟對方說，短時間你的確可以維持彼此的情誼，但時間拉長了，這份感情（友情）其實是在慢慢被腐蝕，這點我想你懂的。


    如果你還是不敢說真話，請你換個角度來看：如果今天你的另一半或朋友想跟你說真心話，你會希望他們因為怕破壞關係而打死不講，還是寧願他向你敞開心房，說真心話？很多事情換個角度來看，一切都不一樣了。


    「我不想破壞關係，但我不怕破壞關係。」把這句話記起來，如果你用得好，光是這句話就能讓你自由。


    一、我不想破壞關係，但熱不怕破壞關係。


    ## 想好好做自己，「拒絕別人」是你一定得面對的課題


    很多人不能做自己，不敢拒絕別人也是原因之一，他們很怕因為拒絕別人而破壞關係。


    首先，如果你是這樣的人，你一定對自己很沒自信，因為連自己不想要都不敢直說，表示你在乎別人的眼光多過於自己真正 的想法。你習慣了掩飾，習慣了偽裝，所以常在別人面前陪笑臉，當個所謂的「好好先生」，但如果你再這樣過你的人生，我想你的人生有很大的可能性會被我結尾的故事說中。（我知道你很想看你人生的結尾，但好酒沉甕底，我拜託你先忍住別往最後面翻。）


    如果你是個有朋友的人，你應該常會遇到朋友的邀約（我偶爾會聽到有人說：「我沒朋友。」所以溫馨小提醒：如果你自認沒朋友的人，你可以跳過這一段，因為你沒有這個問題^^）。有些邀約你想去，有些邀約你就真的沒興趣；你想去的就很簡單，你會和朋友約時間，但遇到你不想去的呢？


    這時很多人就會在心裡OS：「我不想去，該找什麼理由來拒絕？」我查過《拒絕大全》，這些拒絕的理由包括：.「裝窮，說自己沒錢」、「沒時間」（註3）、「我好累，不想出門」，還有人說：「只要說家裡有事，就無敵啦！」


    註3：請見〈不是沒錢、沒時間，是你覺得不重要，是你沒有心〉一文。


    ![](img/7a3931d50c2c9383cc41488956e04ae5_119_0.png)


    你不敢說實話，你的朋友自然也聽不到真話，這是「雙輸」


    這時便會出現一個大問題：如果妳習慣以上述所有理由去敷衍別人，而我是你的朋友，我會被你誤導：「其實你是有興趣的，只是因為……所以不能去。」那等到「你發薪水了」、「忙完了」、「不累了」或「家裡總有沒事的一天吧？」我再來約你，你是不是就會答應我了？


    不會，你會再找更多的理由來敷衍我，或勉強自己答應。很抱歉，這兩種作法都只會讓你更沒辦法做自己。


    不僅如此，隱瞞真心話對彼此都不是好事，因為你不敢說實話，你的朋友自然也聽不到真話，這是世上最糟糕的「雙輸」局面。換成你在邀約朋友時，你會希望他有話直說，還是希望他用一堆bullshit的理由來唬弄你？很多時候，換個角度想，你的所作所為就會不一樣了。


    ## 我們有時都太低估對方可以接受實話的能力


    我們往往會低估對方可以接受誠實答案的能力，又過度幻想彼此可能因為自己的拒絕而破壞關係。其實很多時候，這一切都不過是你的「幻想」罷了。如果你今天約朋友去吃有名的「台電酸菜白肉鍋」，對方跟你說：「真的很不好意思耶！我從小就很不愛吃酸菜白肉鍋，上次吃了以後，還是覺得不太喜歡。這次你


    💡 你低估別人接受實話的能力。


    先找其他朋友一起去吧！我知道你也很愛吃麻辣鍋，等下次你想吃麻辣鍋時我們再約，好不好？」


    聽到對方的這樣的回答，你會有受傷的感覺嗎？我揀大多數人都不會。


    ## 你是在拒絕這件事，而不是拒絕這個「人」


    一個好的拒絕，跟你拒絕的態度與方式（你如何「翻譯」你的話）有關。另外，如果你在拒絕之後，還是給對方一個機會，對方也就能有台階可下。就對方而言，只要你提供額外的選項，對方就知道你不是在拒絕他這個「人」，而是單純就事論事。而且你也提供對方自己不喜歡什麼東西的資訊，就不會再度造成「對方不知道你不喜歡，卻還一直約」這種雙方都很窘的情況。這樣的回答，一方面你可以表達內心的想法，對方也能知道你的喜好，這才是一種「雙贏」的局面。


    我知道大家從小就討厭背英文句型，我也不例外，所以我從不背句型，我用理解的。不過我建議在你還沒辦法理解前，把這個一生受用的「拒絕句型」給背起來：


    > 「真的很不好意思，我不是很想去耶！因為我對這件事沒那麼有興趣。可是下次如果你想去×××，我也很喜歡×××……到時我們再一起去好不好？」


    ## 別讓「做自己」成為你的藉口


    ## 做自己，是要在尊重別人的前提下才能成立。


    大家都聽過「過猶不及」這四個字，任何事情做得過頭，就跟做得不夠一樣，都是不合適的。大多數人沒辦法做自己，但有些人過度強調要做自己，這也不是好事。


    人是群居的動物，如果你一味秉持：「只要是我喜歡，有什麼不可以？」你可能會得罪很多人而不自知。做自己，是要在尊重別人、不影響別人的前提下才能成立。


    ## 別太在乎別人的看法，但也不能無視別人對你的看法


    如果好幾個人都覺得你為人傲慢，做事很不積極、不合群，我在這一章剛開始時說過，他們說的不見得是對的，但是當大家都看到相同的事情，而你卻不這麼認為的時候，請不要再用「我在做自己」來當託辭，因為你在謊稱做自己的過程中，已經造成別人的困擾了，而且很有可能是因為你想像的自己跟別人看到真實的你並不一樣。


    我有個朋友是幾間公司的總裁，這輩子閱人無數，她說過：「你的朋友如果心平氣和地指出你需要改進的地方，根據我的經


    💡 做自己，但也不能無視別人對你的看法。


    驗，他們說的話有90%是對的。」


    ## 敞開心胸接納別人的真心話，

    不要有預設立場，你才看得到事件的全貌


    別人給你的所有建議都是中性的，沒有好壞，無關對錯。他們對你的意見都是讓你「看到別人眼中的自己」的最佳工具。你不一定要因為別人的意見而左右自己的想法，但是你必須把別人對你的意見聽進去，或許他們真的看到了什麼你沒發現，或你不願承認的事實。而我也必須提醒你，一個真的在做自己的人是不會常把「我在做自己」掛在嘴邊的。如果你只是常拿「我在做自己」當藉口，我想你必須真的打開耳朵，聽聽別人的聲音，然後做些改變。


    ## 做自己，你到底想成為什麼樣的人？


    ## 你還活在「大家的期待」中嗎？你到底要什麼？


    人就是太在乎面子，所以才老是活在別人的眼光中。我看過太多人從選學校、選科系到選工作，都是因為面子；去應徵科技大廠的工程師，就因為公司名片拿出來很好看的虛榮心作祟使然；甚至選老婆、老公都是因為「大家都認為他（她）很好，所以我就選他（她）」。


    我從小就喜歡英文，當初我滿懷夢想進入英文系，想說英文系裡，應該很多人喜歡英文才是！左問右問，沒想到大多數人對英文其實都不是特別有興趣，只是因為「分數到了就填英文系唄」、「英文系比較好找工作」。我們選科系的原因竟然是因為「符合社會（或爸媽）期待」，大家從小到大就找不到「我到底喜歡什麼，我對什麼有興趣」，但我當時真的不懂，因為知道「你要什麼」這不是世上最重要的事情嗎(註4)？


    ## 如果你打從心裡想做一件 Pháp，即便明知大家都反對，你還是會去做


    我從小英文就很好，也很喜歡英文，我敢說所有認識我的人


