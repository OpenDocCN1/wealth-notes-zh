    # 【推薦序】


    # 全球三階段潛能開發課程創辦人


    # ——羅伯·懷特 專文推薦


    最近我有幸受邀至位於台北的豐盛生命授課，這次的旅程十分神奇，讓我獲益良多；在課程中我遇到了拉米這位畢業生，從他閃閃發光的雙眼，我知道他不一樣。我發現由於他在三階段課程中的體驗和他在人生中創造出的正面結果，為此他寫了這本書。他的新書《人，就是賤》指出我們每個人都擁有選擇，同時深入探討人性的每一面。我很喜歡他「世上沒有對錯」這個觀點，他用簡單、有力量的方式指出人類的行為模式並沒有對錯，這一切只是我們在所有選擇和決定之後所必然產生的結果。


    這本書的很多主題都與三階段課程有關，雖然它與實際體驗課程不盡相同，而我也希望你為了更卓越的人生來體驗這課程；


    《人，就是賤》這本書問了很多不容易回答，卻又十分重要的問題，例如你目前如何面對你的人生？更重要的是，你該如何活出你此生的使命？


    恭喜你拿起了這本書，因為這表示你在乎自己和你未來的人生。你正在冒一個很大的險，這個險就是讓你用更深入的方式更了解自己，也更清楚你在這個世界上的定位。


    三階段潛能開發課程共同創辦人，羅伯·懷特 (Robert White)'
  - '[PAGE 3]


    # 【自序】


    # 一本書，解開你的所有心鎖？


    你可以不相信我寫的任何一個字，但我請你試著做到一次我說的，一次就好。你會發現，「真相，竟然可以讓你自由」。


    你一定讀過很多勵志書，或許也聽過不少激勵演講，或許這些講師或書能讓你在短時間內充滿能量，但長期看來，你又回到以前的那個你了。


    後悔、埋怨、自責、放不下、做不出選擇，這些長期的負面信念和鬼打牆都讓你的心靈無法真正自由。我曾經很努力實踐諸如正面思考、吸引力法則之類的想法，但在我不斷實行後，我發現最有效、最行得通、最能讓人持續前進的方式並不是刻意把你的心帶到哪個地方，而是告訴你真相。


    真相，就是一個事實，沒有好壞，無關對錯，而且你也無法否認。


    當你知道後悔、自責，不過是懊悔「不能改變的事」，你還會繼續這麼做嗎？當你發現一切的不合理，其實都超級合理，只'
  - '[PAGE 4]


    是每個人看事情的角度不同罷了，於是你不會對別人如此苛求，你也不會生這麼大的氣。


    我也很想告訴你，我是一生下來就知道這些東西，學會這些心態，但那不可能。因為這本書裡的每一句話、每個字都是我在上課時或在書本中學到的，經由不斷思考，然後在日常生活中遇到困難、沮喪、害怕、心裡過不去的時候，一次又一次地挑戰我的心，去跟我內心說話得來的心得。


    當我將這些理念應用在生活中時，我發現我自由了，我的心不再受任何事物的牽絆，也不再有做不出選擇的時候了。


    今天，我把它寫出來，交給了你。因為我相信在我身上和無數案例中證實可行的信念，也一定會在你身上發揮作用。


    這本書只要有一個觀念，讓你在看完後能用在日常生活中，它的價值就不只這兩百多塊，它就是無價。如果看完後發現沒用，你大可把它丟掉，它不過是兩百多塊，對你無傷。


    噠噠米輸入法的發明人劉重次曾說：「練習是一下子，使用是一輩子；不要讓一下子，害了一輩子。」我不會跟你說它容易或簡單，我想跟你說只要你努力去練習；做到了，它就是你的，而且你會一輩子受用。但只要你不練，你還是永遠得不到。'
  - '[PAGE 5]


    只要你的心自由了，這世上沒有你成為不了的人。


    人，永遠都有選擇，你可以選擇如何過你的人生。


    我聽過無數人對成功下定義，我最喜歡的就是這一句：「成功，就是過你想過的生活，做你想做的事，說你想說的話，去你想去的地方，成為你想成為的人。」人無論賺多少錢，到最後你愛的還是快樂、成就感以及心靈上的自由。如果沒有這些，你的心還是空的。


    這本書，可以給你所有上述成功需要的條件，因為成功，不在於你會什麼，你擁有什麼，而在於你是誰。而只要你的心自由了、堅定了、相信了，這世上沒有你做不到的事，沒有你成為不了的人。


    最後，謝謝我的蠃人、我爸、Evelyn、Joy媽媽、二姐，在這段實現夢想的路上，有你們，真好。


    拉米，2013.9.16 11:36 am.


