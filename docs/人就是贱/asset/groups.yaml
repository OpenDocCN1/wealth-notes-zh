    ## 有「在聽」，但沒有「聆聽」


    昨天晚上跟我的「醫龍團隊總主治醫師」聊天，為什麼她是我的醫龍團隊呢？因為我每次心裡有什麼疑問，我都會問她，而她也都能給予我所需要的療癒。聊了一個晚上，我們聊到一個共同的感覺：現在很多人其實沒有在「聽」別人說話。


    我永遠記得我大學失戀時，那或許是我這輩子第一次這麼需要人幫忙，所以很多人會想安慰我；好玩的是，有些人雖然「想聽」，卻不想「用心聽」。


    有一次，我邊走邊跟某個朋友訴說失戀的痛苦，正聊到我心裡很深入的想法時，他卻回我：「我知道踏口有家麵店很好吃，我們等一下去吃好不好？我跟我女朋友有吃過喔……。」


    接下來，他的話題全都圍繞在這家麵有多好吃，我也整個「回不去了」，你應該不難想像我當時的表情。


    另外一個朋友也很讓我「印象深刻」，是他主動問我：「你失戀了喔？」


    我就向他訴說我的痛苦，但聽完後他卻說：「你這沒什麼


    把别人的心事，當成一千萬的生意搬除聽。


    啦！我以前比你苦多了……。」接著就開始劈哩啪啦地講他過去的痛苦故事。最後，竟然變成是我在安慰他。（你能想像我心裡有多想飄離話嗎？）


    我知道他們不是故意的，但我也清楚他們沒有把心和耳朵「放在我身上」。


    如果你是個老闆，正在跟另一個老闆談價值一千萬的生意，當時對方離題了，聊到他平常多喜歡遊山玩水，閒話聊了半小時，你會不會把話題拉回這一千萬的生意？我保證你會，因為你「在乎」。


    對跟你講心事的人來說，他的心事就像是那筆一千萬的生意，只是你有沒有也把他的心事當成一千萬的生意呢？


    我們有沒有在聽，其實對方都知道，都感覺得出來。就好像當你講話時，你也很清楚對方有沒有認真聽，還是只是「有在聽」而已？他的回應和表情是完全騙不了人的。


    ## 如果只有一次機會，你還會「隨便聽」嗎？


    人是被經驗所影響的動物，所以我常會覺得「別人找你聊心事，你常常只有一次機會」。如果你有專心聽別人說話，或許對


    方就會把你認定為「可以講心事的朋友」。。


    如果你不專心、不聆聽、沒興趣，又剛好這個人還有其他好朋友，或許他這輩子就不會再找你了。


    凡事沒有對錯，因為我找到了會傾聽我說話的知心朋友，所以那兩個朋友也從此錯過聽我講心事的機會了，從此錯過。


    這世界是一種循環，「你要什麼，你就得先付出什麼」。


    只要你先付出你的聆聽，當你真的有需要的時候，別人也會願意聆聽你。但如果你一直沒「聆聽」別人說話，就不要抱怨自己找不到真心的朋友，因為「世上沒有意外」(註1)，一切都是你應得的。


