  md: '

    只有那些瘋到認為自己該改變世界的人，才能改變這世界。


    既是「畢業典禮」，也是「開始」的意思；你畢業了，但這也是你「開始」踏出去的時候了。或許你會問：「那我現在到底該做什麼？」我會說：「去練習你在書本上學到的一切，然後去發揮你的天賦和使命吧！」


    ## 找到你的使命，活出你的使命


    ## 這世上最大的浪費，就是天賦和才能的浪費


    我真的認為世界上最大的浪費，就是天賦和才能的浪費。很多人明明天生樂觀、開朗，是個可以影響周遭所有人，甚至影響這世界的人，但偏偏你連自己這一關都過不去，你是要怎麼照顧別人、影響這世界呢？我一直相信，一個人得先把自己照顧好，才有辦法將自己的人生發揮到極限。


    所以我才要寫這本書，讓你先從自身開始療癒自己，讓你看到真相，回歸最真實的自我。最後，更重要的是你要為周遭的人，為這世界付出你本身就有的天賦和能力。


    看好，我是要你發揮你本身就有的天賦與能力，請不要對自己說：「我沒有任何天賦和能力！」因為我不會相信這種鬼話。


    ## 找到你人生的「使命」


    要如何發揮自己的使命呢？首先，當然要找出自己的使命。


    找出你的使命，我沒說錯，你也沒看錯。


    💡 真正的使命，是會被你不斷確認的。


    是的，去找出你的使命。


    我真的相信每個人來到這世界上，都有屬於自己的使命，只是你有沒有發現而已。如果你看到孤兒會很心疼，你就去為孤兒做些事情；如果你看到獨居的老人、殘障人士會覺得不捨，你就去為他們做些什麼；如果你跟我一樣，看到流浪狗在街頭流浪會流眼淚，你就跟我一樣，去為牠們做些什麼，不要等（註1）。


    當你對某群人、某些動物會在乎，會放不下，你覺得這件事就是你生命中該做的事，那就是你的使命。


    「使命」的英文是「mission」，但「mission」更常見的意思是「任務」。你的使命就是你生命中的「任務」，你必須完成這些任務，人生才會圓滿。


    ## 真正的使命，是會被你不斷確認的


    如果你問我該如何確認自己的使命，我會說：「真正的使命，是會被你不斷確認的。」每次我去流浪動物收容中心或看到路邊的流浪狗時，我都會覺得我好愛這些有毛的孩子，牠們真的是上帝帶給人類的天使。


    所以我很相信，真正的使命，是會被你不斷確認的。


    註1：請見〈生命中最重要的問題——「你愛什麼？」〉一文內——「不．雲．等」。


    ![](img/7a3931d50c2c9383cc41488956e04ae5_213_0.png)


    相信我，如果老天給你這個使命，你會知道的，因為你的心會不斷跟你說：「就是它了。」去找到你的使命，因為達賴喇嘛說過：「人生不是只關於自己，還關於你周遭所有人、所有動物和這個世界。」每個人的使命都不一樣，但找出你的使命，活出你的使命，那就是你活著的最高價值。


    ## 不要怕，釋放你本身就有的能量


    有些人可能對於尋找自己的使命感到很害怕，覺得是不是要做些什麼特別的事，或如果沒有完成會怎麼樣？你不用怕，因為這樣的貢獻並不一定要為某一個特定族群付出或努力，我也沒要你做你本來沒有的，我只是要你釋放出本身就有的能量，然後去影響周遭的所有人，如此而已。如果你連這樣都不願意，請你乖乖回去過著你渺小的人生，從此別再靠天自己有什麼夢想不敢做或做不到。


    因為你連自己很有感覺的使命都不願去做了，我還能期待你活出你的人生嗎？


    這世上只有一種成功，那就是成為你想成為的人。


    ## 成功就是「成為一個別人想要成為的人」


    如果你是個熱情的人，請你將自己的熱情發揮出來，然後用你的熱情，讓周遭的人也跟你一樣熱情。用你本來就擁有一切特質去影響別人，讓你成為一個別人想要成為的人。


    人在這個世界，不是你影響我，就是我影響你，通常是能量強的影響能量弱的（有時候是負面能量強的，影響正面能量弱的），但其實更多時候，是彼此互相影響著。


    去年底，我跟三個朋友一起去當蔡依林的演唱會，坐我左邊的是一位很熱情的朋友，坐在我右邊的人是個不認識的陌生人。我們坐的是搖滾區，當蔡依林在舞台上對台下的觀眾大喊：「大家給我動起來！」的時候，我左邊的朋友就跳起來開始用力嘶吼；但是我右邊的陌生人就像和尚拿著螢光棒敲木魚一樣，極度冷靜、有規律地上下搖動，一下、二下、三下。


    我看看左邊用力嘶吼的朋友，再看看右邊敲木魚的陌生人，當下在心中做了個決定：「我坐搖滾區就是要來hi的，我不能被右邊的敲木魚先生給影響。」我決定看著左邊熱情的朋友，於是我們跟著蔡依林瘋狂hi翻小巨蛋。


    時光倒流，如果當時坐在我身邊的朋友，都是敲木魚先生，你覺得我有辦法玩得盡興嗎？我很難，因為人是互相影響的。


    我想你一定也有這種體驗，就是當你跟同學、朋友一群人約出來玩的時候，總有幾個人是比較會炒熱氣氛的，當這些人在的時候，只要一、二個就會帶起所有人的話題。但我也發現，有時候只要某幾個人，或是整個團體有某個人不在，整個氣氛就變得悶悶的，而這些人就是點燃整個團體的熠光。


