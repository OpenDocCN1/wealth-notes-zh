    中國最大互聯網站阿里巴巴的創辦人馬雲，說過一句經典名言：「今天很殘酷，明天更殘酷，後天很美好，但是絕大多數人死在明天晚上，見不著後天的太陽。」


    你說這問題出在哪裡？你沒有任何問題。


    唯一的問題，只是時間還沒到你就放棄了。如果你知道自己的方向正確，也有一直在努力，我請你把這句話永遠記在心裡——「如果你放棄了，你就不知道你離成功有多近了。」


    # 給時間一點時間，今天方向西南西


    前幾天找我諮詢的朋友跟我說：「我一直很努力，但想做的事情卻一直沒實現，這讓我覺得很尷尬、很煩。」


    「你真的確定你走的方向是對的嗎？」我問她。


    「我很確定。」她堅定地回我。


    「那你不用擔心了，因為今天方向西南西。」我這麼說。


    有些事情，只要你的方向對了，努力夠了，那不是「會不會'
