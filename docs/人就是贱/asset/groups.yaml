  md: '

    選擇只看一眼，你是死忠一樣。


    我的朋友小琳對自己的長相很沒自信，她從小就認為大家都覺得她長得很醜。有一天我幫她做諮詢，她跟我說了這個秘密，我告訴她：「我從頭到尾就覺得這根本是妳的幻覺。」這世上很多人總愛幻想根本不會發生或不存在的事，小琳也不例外，就像馬克・吐溫說：「我這輩子有幾千個問題，其中大部分都沒真正發生過。」


    於是我叫小琳去做個有趣的問卷調查，要她在一個禮拜內，去問三個人：「你覺得我最自卑的地方是什麼？」我跟她打賭一頓飯，不會有人回答出：「我覺得是你的外表。」


    一個禮拜後，結果出來了，有人回答她的家世，有人回答她的身高，有人回答她的工作，但就是沒人說：「我覺得是你的外表。」事實證明她對外表的自卑真的只是她自己的感覺，因為旁人都不覺得如此。


    值得討論的是有位朋友聽到小琳的問題後，反而很生氣地跟她說：「我拒絕回答這個問題，就算你有什麼自卑的地方，你不要看那地方不就好了？」


    ## 選擇只看正面，或刻意不看負面，問題就不存在了嗎？


    小琳很不以為然，外表是她自卑幾十年的地方，就算她假裝不看，刻意不看自己的外表，但就像房間裡有一堆垃圾，你刻意不看，但垃圾就是在那裡。最好的方式就是找到心裡的垃圾，然後把它清掉，或是接受房間可以是這麼亂的，然後與這房間和平共處，而不是明知房間裡有一堆垃圾還視而不見。


    你選擇不看你抽菸會帶來的壞處，你還告訴自己：「抽菸可以幫我提神」、「讓我解除短暫的不愉快」，用正面思考的方式來催眠自己。但事實上，尼古丁就是一天天在侵蝕你的健康，最後你的身體和健康檢查報告會告訴你無條件正面思考將帶來的最終結果。所以凡事要看二面才是王道，你可以看到抽菸帶給你的好處（提神、打發時間），但你也必須意識到它會帶來壞處，而如果你不想它帶來的壞處，不要視而不見，請改變。


    ## 面對問題才能斬草除根，你還在拿正面思考逃避問題，逃避面對自己的缺點嗎？


    我提到的每個例子都是真實故事，我有個同事開會從來沒準時過，主管提醒她以後要準時來開會，不然會影響其它準時的同事。她居然如此回答：「主管，你別老是看著我遲到的部分，你就不能正面思考一下，看看我每次開會都只遲到十分鐘嗎？我還是有到的。」


    你能說她說錯了嗎？並沒有。


    我不會說正面思考有什麼問題，但你可以換個角度來看：


    選擇只看正面，問題就不存在了嗎？


    「如果一直這樣正面思考，我可以完成我想要的目標，達到我想要的結果嗎？這真的是我想要的嗎？」(註4) 以這個案例來看，遲到是你想要的嗎？如果是你想要的，就繼續這麼做；如果這結果不是你想要的，請正視問題，然後改變它或是解決它。不要總拿正面思考來當作理由，不是每個觀念都可以亂用在任何地方的。


    我絕對同意正面思考能在心情慘亂或不穩定的時候給予你穩定、正面的力量，但如果正面思考只是你用來「逃避負面」的方式，那你大可不必鬼扯出一堆冠冕堂皇的理由來欺騙別人、欺騙自己，那背後的原因不過是你不肯付出解決問題所需要的代價，和你不敢直接面對問題、不願讓自己更進步的藉口罷了。


    正面思考是讓你「穩定軍心」的工具，還是讓你「逃避負面」的藉口，這點我想不只你自己知道，別人也看得出來，所以你不需要自欺欺人。


    註4：請見《生命中最重要的問題——「你要什麼？」》一文。


    ## 萬物，就像太極，

    ## 你要看事物的兩面才看得到全貌


    太極，一個圓中有兩面，白者像陽，黑者像陰，白中一個黑點，黑中一個白點，表示陽中有陰，陰中有陽。


    太極的圖形跟你看事情的角度一樣，只有同時看著黑白兩極，你才看得到「整個圓的全貌」，否則永遠就像瞎子摸象，你永遠也摸不到一個真相。


    年度暢銷作家李欣頻在《為何心想事不成》書裡提到：「正面思考不是逃避負面的避風港，而是我們必須以積極無懼的態度，同時直視正負二極，選擇中道。」


    以無懼的態度同時直視正負二極，就像少林足球裡趙薇飾演的守門員一樣，運用太極借力使力的方式，看著負面情緒，然後將問題和情緒化解，那才是斬草除根、一勞永逸的方式(註5)。


    註5：請見〈轉念，是所有問題的答案〉一文。


    💡 不因做到而自傲，不因沒做到而鞭打自己。


    凡事看兩面：你做對了什麼，就勵自己繼續保持；你沒做到什麼，就努力改善


    有一次公司總裁跟大家分享她的故事，她說：「小時候如果我考98分，回家後媽媽第一個問我的問題是：『那2分怎麼丟掉的？』第二個問題是：『有幾個同學拿滿分？』」


    大家在聽到這個故事時，不禁發出驚呼聲，覺得總裁的媽媽實在是太苛求了。但沒想到後來總裁卻說：「等到我有了孩子，我也問我兒子同樣的問題。」台下頓是一片譁然。


    「我今天是個競爭力滿強的人，都要歸功於此。不是說單純地要跟你旁邊的人比，是要你跟自己比。我常問我兒子：『你有沒有盡力？如果你盡力了，那無所謂。但如果你盡力了，還丟了10分、20分，那就說明你時間花錯了，我們要看看是哪裡錯了，這樣才可以前進。』大家的聰明才智都差不多，差別在於誰會針對已經做到的事繼續加強，誰會針對犯過的錯誤改進罷了。」


    聽完她這番話，我們恍然大悟，難怪她是總裁，我們不是。


    做到了，繼續保持做得好的地方，設法再做得更好，同時也找出「沒做好的地方」，讓自己慢慢成長。不因做到而自傲，不因沒做到而鞭打自己，凡事看兩面，是讓自己成長最快的方式。


    ## 看著你有的，也看著你沒有的


    小時候，每當我對自己很沒信心、覺得自己什麼都做不好、開始心慌的時候，我就會用力告訴自己：「拉米，別慌，去看著你已經做到的地方，去看著你現在擁有的一切。」


    那時我會找一個自己的優點或是我已經做到的事情，這個優點就是我心慌時的「地基」。說也奇怪，每當我看著我的「地基」，一把注意力轉換了以後，我就不慌了，可以不疾不徐地處理我接下來該做的事情，因為我看著我現在擁有的東西。


    當我覺得自己很厲害的時候，我也會用力告訴我自己：「別這樣就滿足了，看著你還沒做到的、你還沒有的。而且，人外有人，別自以為這樣就很了不起。」於是我就不自滿了，因為我看著「我還沒做到什麼？我還可以怎麼做？」


    於是我的生命，就在這一進一退之間，看著我有的，也看著我沒有的，同時看著太極的圓，不慌張也不自滿地慢慢進步了。


    開放，凡事看二面，唯有同時看著黑白兩面的「圓」，你才看得到人生的「太極」。


    ## Lesson 13

    ## 違反人性的成功之路

    ## —「會怕，但還是要去做」


    > 「別讓恐懼阻止你做對的寄情。」

    —諾貝爾和平獎得主，翁山蘇姬


    ![](img/7a3931d50c2c9383cc41488956e04ae5_175_0.png)


    ## 人性八字：「逃避痛苦，追求快樂」

    ## 「成功，不過是在比誰從失敗中站起來的速度快而已」


    上禮拜我去參加一場演講，一位二十歲出頭的妹妹對我們說出這句話。聽到這句話我十分驚訝，因為大家都在討論該如何成功，卻很少人討論到如何面對失敗，面對恐懼。


    其實我一直體驗到世上最大的秘密，那就是——這世上成功人士做的事情和想法，幾乎都和一般人不一樣。這不僅僅是「有錢人想的跟你不一樣」，甚至常常是完全相反，因為他們不斷在做違反人性的事。


    ## 人性就八個字，「逃避痛苦，追求快樂」


    相信很多人都看過《別急著吃棉花糖》這本暢銷書，它透過史丹佛大學的一個長期實驗，告訴我們能抗拒短期誘惑，違反人性的人，長大以後的收入將是小時候無法抗拒誘惑的好幾倍，甚至好幾十倍。


    但什麼是人性呢？人性其實很簡單，就是「逃避痛苦，追求快樂」這八個字，這一點錯都沒有，因為它就是「人性」，是每個人生下來為了保護自己所會做的自然反應。但為了要達到目


    人性八字：「逃避痛苦、追求快樂」。


    標，成功人士會逼自己違反人性，先克制自己的小欲望（害怕、貪吃、貪睡、遲到、拖延），好完成他們日後更大的夢想。


    而普通人則是不斷依照人性在走，遇到短暫的快樂就想先去做，一想到痛苦的事情就先逃避一下（「讓我再多睡一下」、「偷吃一點沒關係啦」、「明天再開始減肥吧^^拽咪」、「我沒錢、沒時間」、「我會怕，我不敢啦！我還沒準備好」……）。


    你能說普通人不想成功嗎？他們的確想要成功，但他們只是停留在「想要」的階段，而成功人士則是「一定要」。到底是滿足眼前的小欲望比較重要，還是完成日後的大欲望比較重要呢？


    這答案大家都知道，但滿足眼前的小欲望，無法克制自己，這還是人性。也難怪香港首富李嘉誠說過：「這世界很公平，你想過普通的生活，就會遇到普通的挫折。你想過上最好的生活，就一定會遇上最強的傷害。」


    能體悟到這句話的他，一定是做了很多違反人性的事，這也難怪李嘉誠能成為香港首富。但無論你做不做得到，你必須先意識到有錢人的心態，真的跟你「完·全·不·一·樣」！


    ## 糟透了的舒適區


    昨天早上起來，正想拿起杯子喝水，猛然一看，發現杯子裡


    竟有很多一粒粒的小黑點。


    「嘩？我不記得我有喝芝麻糊呀！」仔細一看，才發現那些黑點原來是很多螞蟻在杯子裡一動也不動地被淹死了，而且桌上還有許多螞蟻前仆後繼地往杯子裡爬。原來是我昨天喝的紅茶太甜了，吸引了很多螞蟻進來。當時我想的是：「為什麼這些螞蟻明知下面有一堆同伴的死屍，還是要前仆後繼地走進這灘必死無疑的糖水呢？」


    這時我腦中浮現兩個英文字「miserably comfortable」，也就是「糟透的舒適區」。


    維基百科.(Wiki)對「舒適區」的定義是：「舒適區(Comfort zone)指的是 一個人所處的一種環境的狀態和習慣的行動，人會在這種狀態之中感到舒適並且沒有危機感。」這就像我剛提到的人性八個字——逃避痛苦，追求快樂。


    在維基百科對於舒適區的定義中，令我最驚訝的是這句話：「非常成功的人通常會走出自己的舒適區，去達成自己的目標。」


    維基百科是「很中性」的百科，雖然它也是人編出來的，但它的描述大多偏向事實，不太會出現評論性的字眼，所以「非常成功的人通常會走出自己的舒適區，去達成自己的目標。」這句話或許從維基百科的觀點來看，它就是個不爭的事實。


    ## 糟透了的舒適區，你要嗎？


    對蝌蚪來說，杯子裡的糖水就是他們的舒適區，但這看似甜美的舒適區，無法為他們帶來任何舒適，反而換來死亡，也就是所謂的「糟透的舒適區」。


    而我們的人生，又有多少次因為貪圖安全、舒服，讓自己就從杯中的蝌蚪一樣，一再陷入「糟透的舒適區」裡呢？


    ## 勇敢，你需要的是勇·敢

    ## 穿越，是唯一的出路


    沒有人希望遇到挫折，在面對問題、面對挑戰時常選擇逃避或放棄，這是人之常情，沒什麼令人意外的。有鐵人也會遇到問題，而他們的選擇卻是去面對、去解決問題。這二年多來，我分別上過不同中心開的領袖課程、財富課程和身心靈課程，我發現這三種課程都告訴我同一件事情，那就是遇到問題時，有一個最最最重要的關鍵，那就是「穿越，是唯一的出路」。


    後來，我也在周遭的成功人士身上驗證到這一點。當初我曾思考：「到底是這些課程模仿成功人士，還是這些成功人士都上過這些課？」後來我發現這不是誰模仿誰，這就是成功的必經之路，而「不逃避，選擇面對」，需要的常常不是「自信」，而是「勇敢」。


    ## 你需要的是勇敢，不是自信


    我先來釐清一下「自信」和「勇敢」的差別。「自信」就是：「你先相信你能做到，然後你去做。」但「勇敢」則是：「你不確定自己做不做得到，你或許會害怕，但你還是要去做。」


    💡 你需要的是勇敢，不是信心。


    兩者感覺有點像，但差別非常大，容我舉個親身的例子。


    最近聽兩個朋友說：「我還沒準備好，我不行啦！」聽到這關鍵句，我突然很有感覺，腦袋「叩咚」了一下，因為他們在我眼中，明明都是「早就準備好」的人，就跟大學時代的我一樣。


    大學時，二哥推薦我去än世雄家教班當英文輔導老師。在英文的專業裡，我最有信心的就是英文文法。當他問我：「我這邊有個打工機會，你要不要去än世雄補習班當英文輔導老師？」


    「我還沒準備好，我想把文法書都溫習完再去。」我回答的如此迅速，如此不假思索，連我自己都嚇一跳。


    但其實我很清楚自己當時心裡的恐懼，我內心真正的聲音是：「拜託，那邊很多建中、北一女的耶！如果有學生把我問倒怎麼辦？老師被學生問倒，那不是很糗嗎？」


    或許二哥看出我的恐懼與藉口，他對我說：「你放心，你永遠沒有準備好的一天。」


    「你．永．遠．沒．有．準．備．好．的．一．天。」


    聽到這句話，我覺得好刺耳！彷彿一個裝睡的人，被用一桶100度C的滾水潑到臉上一樣清醒。


    ![](img/7a3931d50c2c9383cc41488956e04ae5_181_0.png)


    於是我問自己：「我是真的想把文法再讀熟一點再去，還是我只是怕被人問倒而已？」


    「我在害怕，我很確定。」


    答案太明顯了，我沒辦法騙自己，於是我硬著頭皮上了。（我還在心裡補了一句髒話，罵我自己怎麼那麼）。


    「勇敢」可以帶動1%的自信，

    但「害怕」也可以摧毀99%的自信


    後來證明之前的一切都是我的「幻想」。學生的問題，99%以上我都回答得出來，只有極少數的1%是我解釋不出來的。而且其中大多數還是很基本的問題，基本到我覺得我讀完國中英文就可以解決8成以上的問題了。


    你要說我當時沒自信嗎？可是我有自信99%的文法問題我都會，所以我會更精準地說：「我有自信，但是我不夠勇敢。」


    但因為我的「不勇敢」，所以我只看到那1%我沒把握的，而不是那99%我確定會的（註1）；而且當我看著那1%我害怕的部分，這恐懼就會愈來愈大，大到讓我不敢行動。從這個例子你可以看得出來，有「自信」不見得能讓你行動，但「勇敢」可以。因為


    註1：請見〈帶著預設立場，你有眼睛卻看不到，你有耳朵卻聽不到〉一文。


    無論你認為自己做不做得到，你都是對的。


    你的「不勇敢」（害怕）會拖垮你所有的自信，無論你會的東西有多少。


    同樣的例子我在別人身上也不知道看過多少次了。每次我聽到別人說：「我沒把握，我還沒準備好。」我心裡想的是：「拜託，你只要拿出五成功力就搞定了，別再騙自己了……。」


    但通常無論我怎麼說服，他們最後還是會丟下一句：「啊我就是不行啊……」讓我不想再繼續浪費口舌勸他們。你說不行，那就不行吧！這是你的 人生，不是我的。


    ## 不管你認為自己做不做得到，你都是對的


    人性很好玩，總會「選擇性看到自己想看到的東西」(註2)。就好像你跟一個剛陷入熱戀的朋友聊天，無論你聊到什麼，他（她）的表現就好像鬼打牆一樣，無論你怎麼聊，他們都會聊到另一半的好；當你跟一個剛分手的人聊天，他無論什麼話題都可以扯到前男（女）友很糟糕，或是他剛分手很難過，需要你安慰這類的話題。


    人只會看到自己想看到的東西，所以美國汽車大亨福特（Henry Ford）說過一句經典名言：「不管你認為自己做不做得到，你都是對的。」所以如果他相信他做不到，就算1000個人說


    註2：請見〈帶著預設立場，你有眼睛卻看不到，你有耳朵卻聽不到〉一文。


    他做得到，他還是會想盡辦法證明他做不到。這真的不是能力的問題，而是相不相信的問題。


    所以當你下次也「不小心」脫口說出「我還沒準備好」時，你可以問問自己：「我是真的沒準備好嗎？還是我在害怕那1%的不確定？」


    ## 機會是留給願意勇敢的人


    後來我瞭解，很多時候「我還沒準備好」，不過是給自己一條退路罷了。真相是害怕失敗，不願面對自己的弱點；害怕成功，害怕成功之前要付出的代價，也害怕成功之後要持續付出的努力。


    「我還沒準備好」到底是不是你的藉口，只有你自己知道。但機會是留給願意勇敢的人，因為很多時候，你真的沒有準備好的一天。如果當初我婉拒了當英文輔導老師，今天學到這經驗的就是別人，而不是我。


    做什麼事都一樣，不要永遠等到準備好時再去做。因為等你一切都準備好了，這機會和經驗也都不會是你的了。況且，有些事情，是等能力夠了再去做；但更多事情，是先去做了，才會學到能力的。中國最大互聯網阿里巴巴的執行長馬雲說過：「一件事情有四成把握就要去做，人生最怕的就是自我設限。」所以你


    選擇面對恐懼，才是唯一的出路。


    還要拿「我還沒準備好」來當成自己不做的藉口嗎？


    越逃避，你就越躲不掉，


