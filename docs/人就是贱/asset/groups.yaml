    老爸退休前是一間公司的法律事務高層主管，他那時不會打字，也不太會用電腦。他有自己的秘書，所以之前他都用手寫好稿子，再交給秘書幫他打字。以他的職位，大可完全不用自己打字或寄email，交辦下去就好。但老爸說不希望浪費秘書的時間再做一次自己就可以做到的事，所以他想學會打字和寄信這些簡單的文書功能。於是在我退伍的那一年，他每天花一小時，要我到公司教他打字、寄email。


    經過這幾年來的練習，現在退休的他卸下了主管的光環，沒有秘書，也沒有屬下，但他已經學會自己打打字、上網查資料、看文章、看YouTube、收發email。因為他已經學會了，所以他的人生不再需要秘書、屬下或是我，而這些人也不會永遠在他身邊。


