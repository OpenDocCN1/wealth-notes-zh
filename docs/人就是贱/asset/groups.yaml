    ## 你真的張開眼睛，打開耳朵了嗎？


    人的眼睛和耳朵是很奇特的，它們會「自動」選擇想看到的東西，自動忽略不想看到的東西。就像男女朋友在曖昧或追求時，每天總想著對方，眼中只看得到對方的優點，然而分手後卻每天埋怨對方，只看得到對方的缺點。明明都是同一個人，為什麼從一個追求時沒有任何缺點的人，變成一個分手時沒有任何優點的人呢？


    一切的問題，就因為我們刻意選擇看人、看事情的角度，而這個現象，不只會出現在兩性關係上。


    ## 人，只看得到自己想看到的東西


    兩年前我上了一堂潛能開發課程(註1)，在課程的後期，我覺得我跟以前的自己完全不一樣了。如果要我形容，我會說我的內心如同歷經了「核爆般的改變」，甚至認為我已經不是以前的自己了。我很感動這堂課程讓我有如此巨大的改變，因為我改掉愛遲到、每天沉迷於運彩、下班回家後就黏在台大批踢踢站台上看鄉民打嘴砲等一拖拉庫的壞習慣，我也變得更活潑開朗。


    註1：請見《改變我一生的強大力疊》一文。


    人，只看得到自己想要的東西。


    那時我是個在家接案子的全職翻譯，整天跟我相處的人只有我媽媽，我跟老媽說：「媽，我上了這個潛能開發課程真的改變很多，你感覺到我變了很多嗎？」


    「我覺得你一點都沒變，你的房間還是很亂，我要你做的你還是沒做。」


    我心裡有了一個很大的OS：「天啊！老媽，你兒子變了這麼多，長崎核彈都在你兒子心裡爆炸了，為什麼你還是覺得我沒變，還是只看到我的房間沒收？」


    「媽，我錯了，我馬上把房間收好。」好吧，沒做好我就乖乖認錯。


    但我不死心地追問下去：「但除此之外，你真的沒看到我有『任何改變』嗎？我指『任．何．改．變』？」


    「真的沒有，我只覺得你為什麼要花錢上這課程，把這時間拿來賺錢不是很好嗎？」老媽一樣面無表情地回我。


    當時我真的不懂，甚至懷疑是不是我的改變沒有明顯到讓媽媽也察覺到。但後來我才發現真正的原因。


    有一天，我約我爸出來聊天，我跟他說：「爸，我上這課程


    Lesson 11 帶著預設立場，你有眼睛卻看不到，你有耳朵卻聽不到


    改變了很多，我想推薦你也來上課。你有沒有感覺到我變了很多？


    爸爸回答：「我覺得你真的改變很多，不到三個月的時間，無論是你講話的方式，還是你的態度，整個人都不一樣了！你變得很活潑，做起事來不再扭扭捏捏，我很好奇是什麼樣的課，可以讓一個人在這麼短的時間內改變這麼多？」


    當我爸說出這句話時，在我的小腦袋裡出現了一個很大的問題：「為什麼每天跟我相處不到一小時，還講不到幾句話的老爸看得到我巨大的改變，而且形容得那麼明確，但幾乎整天跟我在一起的媽媽卻什麼都看不到？」


    答案逐漸在心中成形。二個月後，在一次十分鐘的電話中，我確認了這個答案。


    那天我打電話給以前在職訓中心的主管周姐，她算是跟我很熟的同事，我以前在她面前就是很放得開的。那次的電話中，周姐問到我的近況，我一五一十地回答，最後她在電話的尾聲跟我說：「拉米，我覺得你改變了很多。」


    「你覺得我什麼地方變了？我們才聊不到十分鐘你也聽得出來？」我滿臉懷疑地問周姐。


    人的心就像傘落傘，打開才有用。


    「你變得很開朗，變得更健談，整個人聽起來是不一樣的。」周姐這麼回答我。


    令我好奇的是，我爸不常跟我相處，連周姐跟我講電話的時間也不超過十分鐘，為什麼他們都看得到我的改變，而每天跟我在一起的我媽卻看不到？


    ## 有預設立場、不開放，你什麼都看不到


    我終於懂了，因為我媽「已經有預設立場了」。她不覺得我曾改變，所以就算我改變得再多，她還是選擇看不到，正確來說應該是「她選擇看到我沒做到的事情」。我一點都不怪她，因為當個「家管」就是「家」裡什麼事都要「管」嘛……這或許就是她從小以來的習慣，或許連她自己都沒察覺到，而「選擇只看到某一面」這個好玩的人性，當我回想起來，卻從太多人
    tilt 自己身上都看得到。


    ## 人的心就像傘落傘，打開才有用


    幾年前我沉迷股票時，很看好面板股的友達，所以看新聞都是看友達的利多消息。如果友達有不好的新聞傳出，我都覺得那只是短時間的負面消息，市場應該不會在乎那麼多，可以說我看新聞都是有「選擇性」的。而且最可怕的是，我以為「我看好友達，所以整個股市也會跟我一樣看好友達」，所以我在友達這支股票上有很強的預設立場，光憑幾個新聞就斷定友達沒問題，


    Lesson 11 帶著預設立場，你有眼睛卻看不到，你有耳朵卻聽不到


    「不開放，就看不到真相」，所以你能想像我閉著眼睛做股票會有什麼下場——慘賠。


    英文有一句名言：「人的心就像降落傘，打開才有用。（The mind is like a parachute, it won''t work unless it''s
    open.）」但其實要自己「開放」地看著這世界，真的很不容易，必須時時刻刻提醒自己才做得到。


    在一起需要兩個人，分手只需要一個人。


    ## 沒有預設立場，你才能看到真相


    ## 開放，就是不帶任何預設立場去審視物


    「開放」，指的是「不要同意，也不要不同意，在你做決定前不要有任何預設立場」。


    在我們面對保險人員推銷時，你是不是從一開始就想著：「又來了，又要賣我什麼終極無敵深單了？等你講完，我再來找個藉口拒絕吧！」或是去逛商店遇到店員來關心時，永遠會說：「我只是看看而已。」好像每個店員都是世界知名魔術師劉謙，多聊個兩句，你皮包裡的錢就會憑空消失一樣。


    有一次我跟同事吵架，她在我面前咕咕逼人地講出她的想法，但當時我的腦袋只想著一件事，那就是：「呵呵，我才不聽妳說什麼，等妳一把話說完，我再來嗆妳。」當我發現心裡有這樣的聲音時，我覺得自己不只是很糟糕，還是非常糟糕。因為如果她也跟我一樣「等我把話說完了再來嗆我」，我們的溝通就是在浪費時間，因為我沒有真的把耳朵打開聆聽她說話，我只想把自己想講的話說完而已。


    就像那句話說的：「在一起需要兩個人，分手只需要一個


    人。」我會說：「溝通需要兩個人的聆聽；不聆聽，一個人就可以宣告溝通失敗了。」


    「聆聽」不等於同意，你永遠有最後決定權，所以你不必「不開放，不聆聽」


    我們會有那麼多的預設立場，甚至不聆聽，是因為我們都有種錯覺，誤以為「聆聽」就是同意，好像我不在腦中先拒絕、不先有預設立場就輸了一樣，所以才會在有人想向你推銷之前，在你跟別人吵架時，在你不同意對方說法時，甚至在接觸到你不相信、不那麼瞭解的事物之前，就先在腦中拒絕了，所以對方有講跟沒講並沒有差別，因為你什麼都聽不進去。但這樣的想法不只會讓你聽不到別人的聲音，還會讓你的心再也無法接受不同的想法和思維。


    請不要小看這件事，一個無法接收不同想法的人，他就像是宇宙的中心，覺得自己什麼都是對的。一個覺得自己什麼都是對的人，你覺得他還有進步的空間和機會嗎？如果你遇到無法接收不同想法的人，你又會有什麼感覺呢？


    下次發現自己又開始有預設立場時，請你用力在心裡「叮咚」一下，告訴自己：「我的預設立場又跑出來了！我要打開耳朵聽聽他想表達的意思，最後決定權還是在我手上，所以我沒理由不聽聽他們想表達的想法。」


    接受、同意對方可以有不同意見。


    你不見得要同意對方，

    但請「同意對方可以有不同的意見」


    除了做到「開放」，把耳朵張開、聆聽這世界的聲音外，我們還得做到一件事，那就是——同意別人可以有不同的意見。


    「同意別人可以有不同的意見」這句話其實是從英文來的，原文是：「Agree to disagree.」太多時候我們就是因為「不同意對方可以有不同意見」，太過於控制欲，覺得「自己是對的，對方是錯的」、「對方很笨，自己很聰明」，所以才會有情緒，才會不高興。


    但是你有沒有想過？「每個人都是覺得自己是對的，才會去做每一件事的」，所以當你覺得你是對的時候，對方也覺得他是對的，兩方只是立場不同罷了，所以你真的不用太生氣別人做了什麼蠢事。


    如果你真的很想改變對方，那就用溝通的、用影響的，讓他知道你希望他改變決定的理由以及他為什麼要這樣做的原因。一味地用控制、用逼的，都沒辦法讓對方長期心甘情願去做你希望他做的事。只有讓他知道「為何而戰、為誰而戰」（註2），讓他知道做這件事情對他的原因和重要性，你才能真正改變一個人。


    註2：請見〈生命中最重要的問題——「你要什麼？」〉一文。


    Lesson 11 帶著預設立場，你有眼睛卻看不到，你有耳朵卻聽不到


    ## 你還在只看正面嗎？


    ## 選擇只看一面，你是死腦一條，就算那是正面也一樣


    「心」打開了、不帶預設立場了，你才可以不帶有太多情緒看到周遭人、事、物真正該有的樣子，而這個「真正的樣子」，其實是「二面的」。凡事都有兩面，就連人都有正面和背面，你如果只喜歡女友的正面，永遠不想看到她的背面，你說會有什麼結果？而如果你只看負面和問題，勢必是死路一條，這大家都知道，不需要我廢話多說。


    因為《秘密》一書的關係，最近非常流行「正面思考」，也有些人開始很堅持「只看事情的正面」，我不會說這樣是好或不好，但通常過猶不及都不是好事，就算你選擇只看正面也一樣。因為如果只看事情的正面，你還是不開放，因為你在刻意選擇，只是你選擇的是正面，你還是看不到事物的「正反二面」（我不是指「好、壞」）。


    因此面對所發生的壞事，你需要的可能不是一味地選擇正面思考，而是「直接面對壞事，練習轉念」（註3）。


    註3：請見〈轉念，是所有問題的答案〉一文。

