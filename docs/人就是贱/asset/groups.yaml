    你來上這個課程，我也不會因為你來上課而賺到一毛錢的介紹費。我做這一切的原因，只因為我在最後一篇文章提到，我是因為這個課程才逆轉了我的人生，我希望這本書能為這世界帶來些什麼，而「三階段潛能開發課程」是我目前知道最快的方式，所以我想要把這個課程分享給你。我希望透過這個方式，讓我們一次一個人，改變這世界。


    ## 你想要改變，但你也害怕改變，這不是很「賤」嗎？


    如果你很滿意現在過的生活，恭喜你，請你繼續照著目前的生活模式過下去。但我在第一篇中就提到了，人生最賤的莫過於你在中間地帶游移不定，你不往左，也不往右，你就卡在十字路口，讓四面八方來的車子從你身旁呼嘯而過，讓你更不舒服。你想要改變，但你也害怕改變，因為改變就代表「不確定」。我提到丹佐·華盛頓的老婆曾對他說：「要得到一些你從未擁有的，你必須做一些自己從未嘗試過的事。人生中沒有任何事比勇於冒險更有價值，沒有任何事。」


    我衷心地認為，這個課程值得你去冒險一次。


    如果你需要證據：林依晨、小胖林育群、宥勝和《商業周刊》創辦人金惟純都上過這課程，也因此獲益良多，你可以去搜尋這些人的名字加上「心靈課程」，就會看到相關新聞。


    - (ψ)² 你唯一的人生，值得你奮哉一次。


    最後，我老實說，這是個需要承認的課程，我保證它絕對不像你以前上的課程一樣，坐在那邊聽完就行了。它是需要你離開安全區，讓你改變的一個課程，所以它適合真正想要改變的人。如果你是個不想改變的人，你不適用這篇，因為改變人生，成為自己想成為的人，那是需要勇氣的。如果你沒勇氣，卻又忍不住看完這一篇，我跟你說聲抱歉，因為上三階段課程是需要一個願意勇敢、願意改變、願意讓自己發揮能力的人才適合去上的，所以如果你不願付出、不願勇敢、不願改變，我會說：「別傻了，你不適合的。」


    但如果你真的願意給自己一次改變的機會，我會認真問你：「為你的人生衝一次，你敢嗎？」


