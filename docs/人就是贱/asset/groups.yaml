    所以當你想起一年前、三年前的你，當你覺得自己以前怎麼那麼傻、那麼不成熟的時候，恭喜你，那表示你成長了。相反的，當你覺得「以前的我，跟現在的我沒差多少」時；抱歉，那真的、真的只代表一件事……就是你沒進步。


    所以我勸你們真的永遠不要覺得：「我這樣很好呀！幹嘛還需要再進步？」因為當你這樣覺得的時候，你就等於限制了自己成長的機會。而這個課程，就是讓你從你原本的樓層，往上升個好幾層樓，甚至好幾十層樓的最好方式。


    ## 這個課程什麼都沒教，卻也什麼都教了


    每當朋友問我，為什麼這個課程可以讓我改變這麼多，我總會說：「這課程什麼都沒教，但它也什麼都教了。」因為它是个體驗式的課程，就如同我在書上常提到的：「知道沒有用，瞭解沒有用，做到才有用。」這個課程本身就是讓你去體驗進而實踐的課程。就好像騎腳踏車一樣，只要你經歷過一次，就會由衷地相信你以前在書上學到的都是真的，那是種發自內心的「真相信」，跟你只知道這道理是對的，是完完全全不一樣的境界。


    你懂嗎？完·完·全·全·不·一·樣。


    ## 相信，真相信，不相信


    前幾天，我聽到一個很好的比喻，「相信」和「真相信」的差別就是，「相信」是指雖然你沒看過外星人，而你相信這世上


    只要你真的相信，沒有能夠擋你。


    有外星人，但當全世界都覺得這世上沒有外星人，甚至指著你的鼻子罵你是白痴的時候，你可能曾疑惑，你可能會懷疑自己，因為你的程度只有「相信」而已。


    什麼是「真相信」呢？舉例來說，只要你看過一次外星人，以後無論有多少人在你面前說這世上沒有外星人，你也不會動搖，一切就因為你經歷過；當別人不相信，說你是白痴、智障的時候，你會覺得是別人瘋了，是別人不懂，不是你的問題。


    一切，就因為你經歷過一次，所以會有「真相信」。我在〈幡念，是所有問題的答案〉文中提到，如果你還沒有那樣的體驗，去努力讓自己體驗一次何謂堅持、勇敢與奉獻，當你做到一次，這股力量就會永遠存在你心中。


    上完這三階段的課程，或許我不該稱它為課程，因為這三階段是我人生的縮影，讓我發現以前從書本上學到的一切都不只是「我知道它是對的」而已。因為這一切我在課程中都體驗過，所以這都是我的「真相信」。


    那種「真相信」，是沒有人可以奪得走的。


    在這短短的幾個月當中，我創造出很多結果：我從一個不注重結果的人，變成一個很有結果的人；我從一個每天都遲到的人，變成一個不遲到的人，變成一個很重視自己承諾的人。好玩的是，當我越重視承諾，我就越愛我自己，我就越自由。


    ## 你會開始相信一些事，你也會開始不相信一些事

    ——這是個讓你創造出「結果」的地方


    老實說，我一直在書中強調，你不可能看書就學會游泳，也不可能看書就學會騎腳踏車，這些體驗即使書裡強調得再多，也不如你親自來走一遭。我敢這麼寫，就因為我在這三階段課程中做過這些事情，在這幾個月中我創造出很多想要的結果：


    - 1. 每個月我做到我的業績，賺到我想要賺到的錢。

    - 2. 四個月內畫完全班每個同學的素描。

    - 3. 每天背十個單字。

    - 4. 學會Michael Jackson的三首舞蹈，在50個人面前表演。

    - 5. 每個禮拜去養老院做義工兩小時。


    在這一百多天的旅程中，我都做到了，而且是同時做到。以前我是最會放棄的人，當我想放棄的時候，我總會騙我自己：「我其實沒有這些東西也沒關係。」但其實我內心很清楚知道：「我只是不想付出這代價罷了。」在經過這一百多天的旅程後，它讓我從此相信這世上是有雙贏的。


    那支我表演的Michael Jackson舞蹈(註2)，它改變了我的一生，


    > 註2：影片網址：http://www.youtube.com/watch?v=jk1_QGvkWEw

    > 或上Youtube搜尋「拉啦向舞神MJ致敬」


    這世上最大的損失，就是不...會損失什麼。


    讓我從此相信——只要我真的想要，我一定做得到！在這三個月後，我從此不相信「沒錢、沒時間」（註2）；只要你真的想要，你也別跟我說「我不行」，或是「不可能」這種鬼話。就如同我說的，它什麼都沒教，但也什麼都教了，然而只有願意打開心、願意將自己交出來的人，才曾學到最多，當初的我，就是願意將自己交出來的人。


    沒錢？沒時間？


    這世上最大的損失，就是你不知道會損失什麼


    老實說，這個課程並不便宜——五天課程19800元，時間是週三、四、五的晚上，還有六日兩個整天。


    好的，看完這一行字，你有什麼感覺？


    我是研究人性的，我自己也是過來人，我知道你想說什麼：「我沒錢、沒時間。」對嗎(註3)？


    我老實跟你說，如果你的答案是「沒錢」，我相信你跟錢的「關係」一定不好。你必須思考一下，到底是你擁有錢，還是錢擁有你？你和錢是不是常有糾結的情緒？你是不是在花錢的時候常有罪惡感，而不是快樂的感覺？


    註3：請見〈不是沒錢、沒時間；是你覺得不重要，是你沒有心〉一文。


    所以我不想問你價錢，我想問你「價值」，我只想問你一個問題，如果今天你來上這個課程，而課程沒有效，你在十年後的存款或許是100萬跟98萬200塊的差別而已。但如果這課程有效呢？而且不用多，這個課程只要讓你戒掉一個壞習慣就夠了，假設這19800元能讓你「做事更有行動力」、「從此不遲到」，你覺得這個價錢值不值得？


    如果你心裡的答案是「值得」，那麼我請你認真考慮一下這個或許能改變你一輩子的課程，更何況我還沒遇過上完了三階段課程，卻覺得一點幫助都沒有的人，一個都沒有。


    ## 我沒時間？


    同理可證，如果你的答案是：「我沒時間。」或許錢對你不是問題，但你或許一直以來就是個常說「我沒時間」的人。你或許常被時間追著跑，更扯的是，你或許根本就是個常浪費時間，卻還一天到晚說「我沒時間的人」。


    ## 我說中了嗎？


    如果你看到週三、四、五的晚上以及六、日整天就說你真的沒時間，我只想問你：「那你到底何時會有時間？」我還沒說那是哪一週，你就跟我說沒時間，這不是太過份了嗎？我在討論的是你的人生，如果你連這幾天的時間都擠不出來，我很難相信你


    - 做，就對了。


    的另一半、你的小孩、你在乎的人能「分」到你多少時間？


    所以是你在控制時間，還是你讓時間控制了你？


    ## 最大的損失，就是你不知道你會損失多少


    我在〈做自己，你行嗎？〉裡的「不採取行動的風險」一文中提到，每當我猶豫不決時，常會問自己兩個問題：「做了這件事，我會有什麽損失？」以及「不做這件事，我會有什麽損失？」


    通常當我問完這兩個問題前，我都是「不要做」（因為害怕），但當我問完這兩個問題後，我的答案幾乎都是「去做」。


    這19800元和五天時間，如果它沒效，它就只是19800元和五天；但如果它有效，而你沒去上，你知道你會損失什麽嗎？


    你或許不知道你會損失什麽，但這就是你最大的損失。


    只要你是成年人了，沒有人可以阻止你為自己做些什麽，我也不會說這個課程是你一定要上的。這世上沒有人「需要」這個課程，因為上這個課程是需要一個願意開放、願意打開自己內心的人，才能學到最多的。

