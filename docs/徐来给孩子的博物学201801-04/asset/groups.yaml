    - 1. 一般认为，澳洲野犬的入侵对澳洲本土的袋狼来说产生了巨大的影响。袋狼在竞争中逐渐落败，分布区域也不断缩小，并“退守”到了塔斯马尼亚岛。但最终灭绝袋狼的是人类。为了保护自己的牲畜和家禽，人们开始猎杀袋狼。等到幡然悔悟的时候，已经没有袋狼可保护了；

