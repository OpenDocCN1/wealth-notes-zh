    \n再次感谢每一位用户的支持和陪伴，谢谢你们。\n\n解剖学·人类 | 水晶头盖真有...\n\n你像你这么大的时候，还没有互联网，大家就通过看书看报看杂志，来了解外面的世界。很多书里都讲过，都有很多科学的、非科学的、很玄的伪科学。就是已经被实践或者科学实验证明是错误的科学理论或猜想。\n\
