    # 问答*活动“癌”到底是什么？


    你好，我是徐来，非常感谢你订阅我的专栏“给孩子的博物馆”。每个周六，我都会在这里回答你的问题。


    我收到很多小朋友的问题，有些已经考试过了，正在跟着开始自己新一年的寒假生活吧？怎么样，接下来的寒假有什么样的计划呢？有会去的，不妨请爸爸妈妈看看你去年去外一转，或者去博物馆里逛一逛。试验着，没有机会发挥一下自己在这个专栏里学到的博物学知识。


    当然了，假期来了，我也给你们准备了小礼物。最后再来告诉你怎么拿到礼物。


    好了，来看看今天的五个问题吧。


    地球是怎么出现的，又是什么时候出现的？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_28_0.png)


    有一个问题比较难回答，地球是什么时候出现的？答案很简单，大约46亿年前，这个我们在前面内容中也曾提到过。所以，46亿年，差不多就是咱们地球的年龄了。可能会让你有些惊讶的是，太阳系里几乎不多是这么大。换句话说，地球几乎都是与太阳系统同步形成的。


