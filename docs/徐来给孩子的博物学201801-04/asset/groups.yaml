    \    - 行为学·动物 1 半岛为什么会杀出一个座头鲸？\n\n1. 穿山甲擅长挖洞，但并不会穿山。它们用利爪挖开泥土，用细长的舌头蘸取蚂蚁来吃。穿山甲的甲鳞实有保护作用，成年后的穿山甲，几乎没有天敌，除了人类；\n\
    2. 因为恋巫术的传说，很多人相信，穿山甲的甲片能够帮助自己打通身体当中的某些通道，所以会把穿山甲当成药材来吃，这导致很多人猎杀穿山甲。穿山甲的数量急速减少，已经变成濒危动物；\n\
    3. 穿山甲很难在人工饲养的环境下生存。它们的孕期很长，通常每胎一仔，而且需要很长的育幼时间。更重要的是，它们对食物的要求非常高，还特别容易在人工环境下感染致命疾病。目前，只有在台北动物园有公认的成功繁育记录。穿山甲在北京野生动物救助中心也曾经饲养过一只穿山甲。\n\
