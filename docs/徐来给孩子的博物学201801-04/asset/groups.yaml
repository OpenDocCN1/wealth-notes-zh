    2. 大斑凤头鹛在喜鹊巢穴中下蛋的过程非常复杂，需要雌雄两只鸟高度配合。如果它们的蛋被喜鹊扔了出来，它们将在随后袭击喜鹊的巢穴，血洗喜鹊的后代作为报复。


