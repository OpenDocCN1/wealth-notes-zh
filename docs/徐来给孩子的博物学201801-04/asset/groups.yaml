    - 生态学_动物｜不会游泳，算什么好鱼？\n\n1. 在1958年到1976年之间，冰岛和英国发生了三次武装冲突，史称“鳕鱼战争”。经过这次冲突，国际上逐渐确立了12海里领海和200海里专属经济区的规则；\n\
    2. 真正的鳕鱼是鳕形目、鳕科、鳕属的三种鱼：大西洋鳕鱼、太平洋鳕鱼和格陵兰鳕鱼。它们曾经是欧洲和北美洲最重要的渔获。欧洲人也因此形成了吃鳕鱼的习惯；\n\
    3. 市场上被称为鳕鱼的鱼类，只有很少一部分是真正的鳕鱼，其他的鳕鱼或者比真鳕鱼贵，或者比它便宜，有些是鳕鱼的近亲或者远亲，有些跟鳕鱼一点关系都没有。\n\n\
    > 鳕鱼：真正的鳕鱼是鳕形目、鳕科、鳕属的三种鱼：大西洋鳕鱼、太平洋鳕鱼和格陵兰鳕鱼。它们曾经是欧洲和北美洲最重要的渔获。欧洲人也因此形成了吃鳕鱼的习惯。\n\
