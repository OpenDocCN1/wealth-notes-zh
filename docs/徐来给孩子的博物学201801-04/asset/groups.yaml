    \n简单来讲，就是非正式的学校。后来，玛丽跑到了法国巴黎。在这里，她顺利地进入了巴黎大学，并且正式开始了自己的大学生涯。在拿到学位之后，玛丽很快遇到自己的祖国波兰，把自己的学问传授给同胞。然而，波兰的大学却拒绝给她工作的机会，原因很简单：她是女性。\n\
