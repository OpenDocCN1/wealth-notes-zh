    现在，“吸烟影响健康”已经变成一种共识，你的爸爸妈妈、爷爷奶奶，或者他们的亲戚朋友，有人吸烟吗？ 如果看到他们的吸烟，不妨去劝劝吧！或者看看健康的故事讲给他们听，并鼓励他们尽快戒烟。


