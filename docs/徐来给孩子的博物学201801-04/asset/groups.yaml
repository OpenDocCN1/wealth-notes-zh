    古代美洲原住民毫无关系。


    一个著名的神秘故事，就这样被破解了。


    # ——◆ 博物学家养成记 ◆——


    今天讲了一个关于伪科学的故事，你还听过哪些伪科学的结论或者故事吗？在留言区分享给我吧。


    +   1. 水晶头骨是一个非常著名的“神秘符号”，有很多离奇的传说，著名的2012年世界末日论，就与它有关；


    +   2. 已记录的最早持有水晶头骨的人是一位法国古董商人。但是，考古学家从未在有效的考古发掘中发现过水晶头骨；


    +   3. 许多博物馆和研究机构都对水晶头骨进行了深入研究，一致认为现在已知所有的水晶头骨，其制作工艺都是基于近现代的高速打磨技术。没有任何迹象表明，它们来自古代的美洲原住民。


    水晶头盖骨：一个非常著名的 “神秘符号”，据记录最早持有水晶头骨的人是一位法国古董商人。但考古学家从未在有效的考古发掘中发现过水晶头骨。


