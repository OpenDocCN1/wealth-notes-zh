    +   1. 鲸分成须鲸和齿鲸两大类。齿鲸中的一些物种生活在淡水河流里，被称为淡水豚。现在淡水豚一共有四种，两种生活在南美洲，两种生活在亚洲。其中生活在长江里的，叫白䱗豚；

    2. 白䱗豚曾经长期被称为白鳍豚。这是一个错误的名字。䱗是古人对白䱗豚的称呼，这个字比较难写，也不太常用，所以讹传讹地被错当成了鳍；

    3. 白䱗豚灭绝的原因是人类的活动。虽然渔民很少主动猎杀白䱗豚，但人类活动导致长江野生鱼类减少，白䱗豚食物匮乏，人类捕鱼活动误杀白䱗豚，以及船舶误伤导致白䱗豚数量下降；

    4. 淇淇是人工饲养条件下活得最久的一头白䱗豚。这是一头雄性白䱗豚，科学家曾经试图为之寻找配偶进行繁殖，但是都失败了。淇淇死于2002年。


    白䱗豚：一种生活在长江里的齿鲸，白䱗豚已被认定为功能性灭绝，原因是人类的活动。虽然渔民很少主动猎杀白䱗豚，但人类活动导致长江野生鱼类减少，白䱗豚食物匮乏，导致白䱗豚数量下降。'
