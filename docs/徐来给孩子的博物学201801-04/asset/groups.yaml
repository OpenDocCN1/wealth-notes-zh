    演化学·动物 | 达尔文雀身上…


    徐来


    前段时间，我跟你讲了达尔文和他写的《物种起源》的故事。达尔文年轻的时候，作为随船博物学家，乘坐英国海军的小猎犬号进行一次为期将近5年的环球航行。在这次航行中，他积累下大量的标本、笔记，这为他后来深入思考生物演化的问题，并最终发现生物进化论提供了非常非常重要的证据。


    小猎犬号之旅算得上是世界上最有名的环球航行之一了。在说到这次航行的时候，我特别强调了加拉帕格斯群岛这个地方。


    它是一个靠近赤道的群岛，这里有7座大岛，20多座小岛，数不清的动物生活在这里，许多都是当地独有的生物。通过这个岛上的生物，达尔文深刻领悟到了环境和物种变化的关系，并且最终启发了他写下《物种起源》。而所有启发他的动物中，最为著名的是达尔文雀。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_145_0.png)


    # 被忽略的“大发现”


    达尔文雀不是一种鸟，而是15种鸟。鸟类学家们曾经认为，这15种达尔文雀亲属关系很近，但是后来的研究发现，它们虽然同在1个科内，却并不是同一个属的近亲，而要分别归入5个属—换句话说，它们之间的亲戚关系，并没有人类想象的那么近，但都是小型的雀鸟。


    达尔文在加岛的时候采集到一批达尔文雀， 有近70件。但他刚开始的分类方法错得十分离谱。他发现，这个群岛上的这些小型雀鸟，嘴的造型都特别。所以，他一开始根据嘴巴的形状，给它们分了类：嘴尖尖的是燕雀，嘴宽宽的是蜡嘴雀，嘴细细的是鹅嘴…总之，达尔文看到它们嘴的形状千差万别，觉得它们分属不同类别的鸟儿，彼此之间关系很疏远。


    所以并不重视这些标本，在他的日记里没提到这些标本。后来在鸟类学家的帮助下，达尔文终于知道，自己找到的这70件标本属于13到15种鸟类，虽然嘴巴的形状千差万别，但确实是关系很近的亲戚。于是他开始重新审视这批标本。


    然而，因为当时没有做好记录，所以达尔文没有真正意识到这些鸟儿的意义，也难以成为可靠的证据写到书里面。也许是觉得自己带回来的其他标本更重要吧，总之，在《物种起源》的最初两个版本当中，他甚至连都没提这批鸟儿。只是在自己的游记当中记录了这些鸟，以及它们大小和形状差异巨大的嘴巴。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_145_1.png)


    # 揭开达尔文雀的秘密


    很遗憾，达尔文并没有真正发现达尔文雀的秘密，这个秘密要在达尔文去世100多年后，才被揭示出来。揭示它的人，也来自英国，叫做大卫·拉克。


    他注意到了达尔文雀嘴的形状，于是，决定去达尔文采集标本的地方去看一看—这就带来一个考察团去了加拉帕格斯群岛。在这里，他们工作了5个多月，积累了大量的材料。随后，他带着40只雀鸟准备返回英国。途径美国的时候，他在旧金山停留了一阵。这里的科学家也曾万里迢迢地跑到加拉帕格斯群岛去采集标本—实际上，旧金山有世界上最大的达尔文雀收藏—有超过8000只达尔文雀的标本。


    拉克这下子真的是有点老鼠掉到米缸里的感觉。他顾不得吃饭，也顾不得睡觉，开始测量这些标本。一开始，他认为，之所以这些达尔文雀不同种的嘴巴也不1样，是因为不同的雌鸟对雄鸟相貌有不同的偏好，有些喜欢嘴大的，有些喜欢嘴小的，最终导致了彼此之间的差别。


    但后来他终于意识到，不同的达尔文雀嘴型的变化，实际上是不同的食物导致的。当一种鸟生活在某个小岛上的时候，因为岛上植'
  - '[PAGE 146]


    物的特征，它们的嘴也越来越趋向于适应某些当地特有的植物；而当有几种鸟生活在同一个岛上的时候，为了避免彼此之间的直接竞争，它们各自会选择不同的东西作为自己的主要食物——这种食量的差别也慢慢导致了嘴型的差别。


    这种变化，被称为适应辐射，意思就是同一个物种的不同个体，到了不同的环境生活之后，逐渐适应这里的环境，并且生理上出现更符合具体条件的变化。达尔文雀就是适应辐射的典型代表。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_146_0.png)


    # ## 演化的绊锤


    拉克的这个发现非常有意思，但有一个问题：他实际上是以自己看到的情况为起点，向前反推演化过程的。想法非常巧妙，间接证据也很多，但还是缺乏直接证据。虽然科学领域的很多事情，间接证据只要足够多，就可以说服人；但即便如此，能找到直接证据来表明环境会影响达尔文雀吗？


    很多科学家都想弄清楚这个问题，所以，也跟随达尔文和拉克的脚步，来到了加拉帕戈斯群岛。最终解决问题的，是一对科学家夫妇，格兰特夫妇。他俩在一个小岛上做研究，这个岛小，鸟也少，只生活着两种达尔文雀，而且每年只有150对鸟要繁殖，所以，他们有条件去详细记录每一只鸟的情况。


    就在1977年的时候，岛上出了一件大事：闹旱灾了。那一年下的雨只有平时的五分之一那么多。雨水一少，很多植物就不结种子了，岛上鸟类的食物立即就变得非常紧张。格兰特夫妇在前一年统计的将近400只幼鸟当中，只有1只从这场大旱中成功地活了下来。成年的雀鸟也死掉了。


    很快格兰特夫妇就发现了有意思的地方，干旱来临的时候，食物短缺，很多雀鸟被饿死了。但是如果某只雀鸟的嘴更厚一些，那么它们就有可能吃到更干硬难吃的种子，从而活下去。果然，经过实际的测量，他们发现，雀鸟嘴的厚度确实增加了。


    没过多久，格兰特夫妇的一位学生在岛上无意中捕捉到一只嘴特别粗的幼鸟。他们判断这是从附近小岛飞过来的‘偷渡客’。这只鸟跟当地的达尔文雀杂交，然后把自己的特点传了下去，不仅长寿，而且子孙满堂，所以，它的特征很快在鸟群中扩散开来。经过30年的繁衍，如今这只鸟的后代已经成了岛上的第三个达尔文雀品种。人们亲眼目睹了一个新物种的诞生。


    # **博物学家养成记**


    好了，今天我们讲到了适应辐射的概念，适应辐射，就是同一个物种的不同个体，到了不同的环境生活之后，逐渐适应这里的环境，并且生理上出现更符合具体条件的变化。除了我给你讲的达尔文雀，你还知道那些动物身上有适应辐射的现象呢？在留言区分享给我吧。


    如果觉得今天的内容很有趣，我猜你也应该喜欢下面的文章，点击文章标题，可以直接跳转阅读：


    +   - 科学史点志 |《物种起源》：一本改变世界的书

    - 行为学·动物 | 孔雀为什么开屏？

    - 构造学·地质 | 地球到底有几层？

    - 遗传学·生物 | 穿秋裤会让我们退化吗？


    +   1. 达尔文在加拉帕戈斯群岛上发现了达尔文雀；这不是一种鸟，而是15种左右的鸟。他们关系很近，但是嘴的差别非常大；

    2. 达尔文最初对达尔文雀的分类是错误的。当他意识到这些鸟彼此之间亲缘关系很近的时候，也无法弄清楚其中的缘由，而只是对这种现象进行了记录；

    3. 英国科学家拉克经过研究发现，达尔文雀嘴的差别是由它们生活的不同环境所决定的。这种情况后来被称为适应辐射；

    4. 格兰特夫妇在加拉帕戈斯群岛研究达尔文雀的时候，因为一场大旱，而找到了环境影响鸟嘴的切实证据，随着的鸟系‘偷渡事件’更是让我们亲眼目睹了新物种的诞生。


    达尔文雀：由曲森斯·达尔文所发现，当中有约13种在加拉帕戈斯群岛生活。这些鸟几乎都是同样体形（10 - 20 cm）。但鸟嘴的尺寸跟形状有很大的不同，因为鸟嘴高度需要适应其食物种类。这就是适应辐射。


