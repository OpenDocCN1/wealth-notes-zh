    的尸体被下了毒。


    盗猎者在杀死大象之后，秃鹰就会很快地发现大象的尸体，并且在附近大量聚集。大象的尸体很快就会被人们发现。为了避免被发现，盗猎者在大象身上下毒，避免过早地暴露行踪。可就是这样也并没避免慌不择食的秃鹰们跟着被毒死，更要命的是，人们悲伤地发现，这些死去的秃鹰大都是正在养育孩子的父母，它们的死去，同样会让它们的孩子失去父母的保护而死。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_99_0.png)


    # ■ 博物学家养成记 ■


    围绕着大象的象牙，产生了无数让人难过的故事。如果你看到有人想购买象牙，或者使用新产出的象牙制品，请向他转述象牙带来的悲惨故事，好不好？


    +   1. 科学家发现，成年雄性亚洲象的象牙，其平均长度出现了迭代递减的趋势，甚至推测未来的亚洲象可能会不长象牙；非洲象当中，不长象牙的成年象也越来越多。科学家认为，这种情况与象牙贸易无法禁绝，特别是对象牙的盗猎行为有关；


    +   2. 人们获得象牙，是为了制作各种工艺品。随着象牙供货量的增加，它们也曾经被用来制作一些其他东西，比如钢琴的琴键，以及桌球的球。因为象牙的至少三分之一部分是深埋在大象的头脑当中的，所以为了尽可能多地获得象牙，盗猎者总是会杀死大象，并且打开它们的头；


    +   3. 除了大象之外，还有一些动物会死于非法的象牙贸易。比如在非洲的一些保护区，珍稀的非洲白背秃鹫就经常被毒杀，因为它们会取食大象们被下了毒的尸体。


