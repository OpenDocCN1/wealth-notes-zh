    \n  除了「 地球电讯」，我还很喜欢林欣浩老师的「 数学有意思」这门课。最近，我女儿和女儿一起听，发现全是她上小学时没听到过的内容。我当时就在想，如果小时候能有这样的老师给我讲这些内容，那今天的我会变成什么样子呢？\n\
    \n  另外，我还有一个最新消息要告诉你。「 少年得到」今天上线了郝广才老师的写作课！郝广才老师，就是「 得到」里「 今天」订阅专栏的主理人。他是中国著名的作家，也是我的偶像。据说这次「\
    \ 少年得到」非常难得，把郝广才老师33年积累的、最珍贵的家底都挖出来了，编成了一门特别有意思的写作课。这门课肯定是要听的，因为写作这件事儿，是一辈子都学不完的，他的课一定能对我有帮助。你听完这门课，肯定会有很大的收获！\n\
    \n  另外一个好消息，我给所有我们博物学专栏的同学们都申请了特别福利。你需要到手机应用商店搜索「 少年得到」，点击下载这个App，注册完后，点击你的头像进入到「意见反馈」里面，输入我们的福利暗号：博物学\n\
    \n  这三个字，就能得到我们专为你争取的，也只有博物学专栏的同学们才能独享的10元奖学金。\n\n  钱真的不多，但是我的一份心意。以后我有新的课程，也会在「\
    \ 少年得到」推出，让我们相约少年得到。现在就下载吧！\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_186_0.png)\n\
    \n  2018年4月9日\n\n### 尊享福利：「 少年得到」奖学金\n\n  领取期限：\n\n  4月16日24：00截止\n\n  领取方式：\n\
    \n- 第一步，请到各大应用商店，搜索“少年得到”，点击下载App；\n- 第二步，注册后，在App首页点击个人头像，进入“意见反馈”，输入暗号：博物学。\n\
    \n  特别说明：\n\n  本活动为期一周，奖学金会在4月17日当天发送到您的「 少年得到」App账户。\n\n  查看方式：\n\n  在「 少年得到」App首页点击个人头像，进入“我的账户”，再点击右上角“充值记录”，即可查看。\n\
    \n  你也可以保存下方图片，通过微信扫一扫，下载“少年得到”\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_186_1.png)\n\
    \n  徐来\n\n  最后还想说明一下，“ 给孩子的博物学”这个课程在少年得到也有开设。不过，跟得到这个专栏，内容基本上是相同的，所以要提醒大家一下，注意不要重复购买。当然，如果你觉得这个课程好，就替我向自己的同学、朋友推荐“给孩子的博物学”吧！\n"
  mdcn: "\n## 问答｜植物有没有记忆？\n\n  你是徐来，欢迎订阅我的专栏《给孩子的博物学》。今天是清明节假日的最后一日，不知道你们在这个假期里有没有出门踏青呢？\n\
    \n  现在，我们把清明节当做一个个祭祖祖先的日子。但实际上，最早的清明节并不是主打“祭祀”的，清明节本身是一个节气，而不是节日，后来这个节气就与另外两个节日：寒食节和上巳节逐渐合并，这才有了清明节。前面这两个节日里包含的祭祀、游艺之类的传统项目，也被吸纳到了清明节里面。其实，如果天天公举，清明节这个时候确实很适合踏青，观察一下植物，认识一下昆虫，聆听一下鸟鸣，这都是博物学研究的基本途径。\n\
    \n  好了，来看看本周末你们提了什么有趣的问题吧。\n\n### 科学家为什么要用小老鼠做实验？其他的老鼠可以吗？\n\n  当然可以！小白鼠是大家最熟悉的一类实验动物，它是黑色的老鼠，有可能是大鼠也可是小鼠。除了白色的小鼠之外，还有其他各种老鼠，比如灰马、豚鼠、兔子、鼹鼠，甚至还有一些长吻的鼠，都可以作为实验动物来使用。\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_183_0.png)\n\n  但我们不能随便拿一只老鼠过来就做实验，因为实验动物本身要符合一定的条件。在加上不同的实验有不同的目的，做实验的时候必须要仔细筛选能够反映实验目的的鼠种。包括适合的年龄、性别、体型等等，同时也要注意避开一些可能会影响实验结果的因素。有时候，为了确保实验组对照组的样本的差别最小化，人们还需要培育彼此基因几乎完全相同的老鼠，来避免基因差异给实验结果带来的影响。\n\
    \n### 鱼有没有耳朵？\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_183_1.png)\n\n  这个问题很有意思，而且，还牵扯到一个概念。我想，你在这个问题里说的耳朵，是指哺乳类两边儿大一个的那个“耳朵”，和人类一样。大多水生动物的这样的“耳朵”。不过，准确来说，这并不是耳朵，只是耳朵的一部分，叫做耳廓。耳廓加上耳道构成了我们的外耳，这是耳朵最常被看到的部分。\n\
    \n  但是既然有耳廓，就一定有相应的内耳。在内耳有一个很有名的结构，鳕鱼鳔内的，它负责把声音转换成神经信号传给大脑，而我们感知声音、平衡的也是内耳，在外耳和内耳之间，还有一个中耳。外耳、中耳和内耳构成了完整的耳朵。\n\
    \n  鱼也能听声音，所以它们肯定有耳朵的。但是它们只有内耳，而没有外耳和中耳的结构，所以，它们听觉的两边或者上方没有耳廓，也许是因为这一原因，所以很多人误以为鱼类没有耳朵吧。\n\
    \n### 植物有没有记忆？\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_183_2.png)\n\n  你问了一个很有意思的问题。在很长的一段时间里，连科学家都认为植物是没有记忆的。这倒不奇怪，因为早期研究神经系统时，发现动物有神经系统，植物没有，就认为植物没有记忆。\n\
    \n  经有科学家尝试还原一个早期地球的环境来做实验，看看有没有可能从让无机分子在一定条件下形成有机分子。这个实验被称为“米勒-尤里实验”，直到现在，它在生物学教科书当中都是描述生命起源的经典实验。不过也有越来越多的科学家相信，这个实验对早期地球环境的模拟是错误的。\n\
    \n  总之，对这个问题，科学家仍然没有太多头绪。解答这个问题也将是生命科学发展的最重要任务之一。\n\n  生理学·植物｜含羞草，你到底是动物还是植物？\n\
    \  构造学·地球｜寻找地图原来的样子\n\n## 结束语 | 博物达人，我有话想对你说\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_185_0.png)\n\
    \n### 小师弟,你好\n\n  《 给孩子的博物学》这个专栏终于走到了最后一天，我很幸运地跟你一起学习了一整年，非常感谢你订阅这个专栏，同时我也非常不舍。\n\
    \n  对我来说，这是非常艰苦的一年。不止要应付日常的工作，我想，我在旅行和出差的时候，比如泰国曼谷、越南芽庄、日本京都、新西兰但尼丁和荷兰阿姆斯特丹……这些酒店里的电脑桌一定会奇怪，为什么我总是深夜里坐在它们前面打瞌睡——因为我正急着把自己知道的，以及亲眼看到的博物学知识讲给你听。\n\
    \n  这一年，我也收获了很多东西。这个专栏给了我一个机会，那就是重新梳理自己的知识系统，温故而知新。这种从旧知识中获得新感受、新见解的喜悦感，想必你在学习专栏的过程中也常常体会到吧。如果你能在过去的一年中，有所收获，那对我来说真的是巨大的成就感呢。\n\
    \n  其实，我从大家每天的提问当中，就能感受到这一点。你们许多问题的角度和难度都让我倍感惊讶，很多八九岁的小朋友，提出了非常高质量的问题。我在你们的这个年纪，还完全没有过这么深度的思考。而你，可能已经在博物学庞大的知识体系中，找到了自己感兴趣，或者自己的天赋领域，就好像在知识的繁茂丛林当中，寻找到了属于自己的那一棵大树，那种感觉应该很喜悦吧？\n\
    \n  从某种意义上来说，博物学是近现代科学的幼年阶段。在这个阶段，人们观察世间万物，通过了解动物、植物、矿物和宇宙天体的形态、结构，再对它们进行分类和描述。在博物学的基础上，近现代科学家们又发展出了很多新的学科，逐渐把知识纳入到科学系统当中。或许，这个专栏带你走过的只是科学认知的幼年阶段，但是，这个专栏的结束，并不意味着你探索世间万物的终点。你将继续前行，以博物学为跳板，无限拓展自己的知识疆界。\n\
    \n  期待某一天，我能从你那里，听到新的，关于博物学的故事。\n\n  探索未知的路上，我们还会再相见！\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_185_1.png)\n\
