    ### 博物学家养成记


    关于弓形虫，我想再说两句。弓形虫和蛔虫这样的寄生虫不一样，它进入咱们人类的身体之后啊，绝大多数情况下，不会对我们的健康产生什么实质性的影响。只不过，如果准妈妈们在怀孕期间首次感染弓形虫，那么有一定的概率会传染给胎儿，造成胎儿的健康问题。所以，很多人担心这个问题，以至于不养猫了甚至把猫遗弃掉。


    其实，大家不需要这么担心这个问题。因为首先，弓形虫影响胎儿健康的前提是，准妈妈 们必须是在怀孕期间“首次感染”它；其次，并非所有的猫都随时会排出弓形虫卵，实际上只有猫第一次感染弓形虫之后的两周左右时间里，它才会排出弓形虫的卵；最后，弓形虫的卵会和猫的粪便混合在一起，只要不处理猫的粪便，进食前保证清洁双手，也不会感染弓形虫——实际上生吃肉感染弓形虫的风险更高。


    总而言之，只要保证个人卫生，不生食，准妈妈们的也没有必要担心弓形虫的问题啦。


