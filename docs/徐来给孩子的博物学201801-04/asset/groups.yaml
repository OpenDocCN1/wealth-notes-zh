    # 生理学动物丨为什么米老鼠看上去很可爱？


    世界大好，奇妙的事情每天都有，我们一起去发现吧~


    生理学动物丨为什么米老鼠..


    +   徐来


    米老鼠这个卡通形象，你认识得该很熟悉吧，还有唐老鸭，米妮，黛丝，布鲁托……应该都是你非常熟悉的角色了。


    不过，对比米老鼠非常唐老的感觉，可不一定对米老鼠这代卡通有亲切感，可能不如有唐老鸭亲切。因为米鼠，可有很多副画面可以看。米老鼠的米奇和唐老可着于千万千万动画片中可看的两种。而在我的小，他只有一部动画可看：米老鼠和唐老哥几乎就是我们童年生活的全部了。


    可你会觉得，就要从米老鼠说起--可能你会很惊讶吧：米老鼠和唐老哥有什么关系呢？嘿，这里关系可大了。


    # 米老鼠的变化


    米老鼠是迪士尼公司推出的一个动画形象。据说，最初它的名字叫米老鼠莫提，后来改成了米奇--这也表示已经有一个称号成立了。这个形象诞生到现在已经快80年了。它第一次正式亮相是在1928年，那是在一部动画电影里，名字叫做《汽船威利》。


    这个汽船威利在电影史上非常重要，因为它是世界上第一部真正的有声动画片--没错，在那几年之前，无论电影还是动画，主角的台词都是没有声音的，或者是在放映的同时，整个乐队在旁边给你配乐。但这部动画开始通过音频技术、把声音来放进了影片当中，算是一个创举了。


    如果有机会看到这个动画，你会发现，其中的米老鼠跟你现在看的米老鼠不太一样。现在咱们看的米老鼠，看起来就是一个小可爱，脾气也好，也很聪明。但那个时代的米老鼠非常淘气，贪吃。倒是有专门研究电影文化的学者，对米老鼠这种性格上的变化进行考证和分析。他们发现了一个很有意思的现象：随着米老鼠越来越受到人们的喜爱，他也会越来越强烈要求米老鼠去承担一些社会责任，比如要求一些正向的引导，所以会向迪士尼公司提要求：米老鼠应该像个迪士尼公司应该做什么--听起来就像爸爸妈妈跟小孩的话一样。米老鼠本来就变得越来越乖巧了。


    不过，改变的不是米老鼠的性格，也包括它的形象--它的形象越变越高大，身材就越苗条，同时，原本突出的鼻子也慢慢缩回去了。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_47_0.png)


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_47_1.png)


    # 什么是幼态持续


    听到这里，你可能会觉得，嗯，这不不过是一个动画形象逐渐变化的事儿嘛，都是人为改变，从不大的沙子，就是诗人说的那样，一粒沙中可以看到整个世界，从这样一个似乎很简单的变化中，科学家们看到了非常重要的现象。


    这位科学家的名字叫做史蒂芬·古尔德，他是美国哈佛大学教授，研究的是进化论这门学问，他就对这种现象进行了深入的专门研究，他发现，米老鼠这个卡通形象的外形变化，符合生物学中进化论的一个重要规律：幼态持续。


    +   1. 眼睛的大小在头部面积当中占的比例越来越大，也就是说，眼睛越长越大；

    2. 头越来越大，头的长度占全身身高的比例随之变大；

    3. 耳朵的位置发生变化，头顶变得更圆，听起来更可爱。


    在古尔德看来，这样的变化可不是随便发生的--虽然动画的创作者和绘制者可能是在无意中一点点改变它笔下角色的，但这样的变化，其实正好对应着生物进化的现象。


    这个现象叫做“幼态持续”。幼态就是生物在幼年时的情态特征，但是一些生物在长大成人的形态中，仍然保留着一些幼年形态特征，这就是幼态持续。这些幼态特征保留下来，一直到成年，就是所谓的“幼态持续”。上面说的眼脑大、头大、耳朵大的这几个特征，就都是幼态持续的特征。


    没有幼态持续现象的生物，就是一直发育完全成熟的，比如老鼠，虽然也是哺乳动物，但它的幼年和成年差别不大。


    所以米老鼠的可爱，是因为它的形象设计符合了“幼态持续”的规律。


    米老鼠为什么越来越可爱？当然是为了让米老鼠看起来更像婴儿，更讨喜。这也是很多动画角色的共同特点。


    # 为什么米老鼠越变越可爱


    你可能会问：为什么婴儿脸是可爱的？从进化论的角度来看，人类之所以觉得婴儿可爱，是因为婴儿的某些特征（比如大眼睛、圆脸等）能激发人类的保护欲，从而提高婴儿的存活率。


    这种机制被称为“婴儿图式”（Baby Schema），由奥地利心理学家康拉德·洛伦兹（Konrad Lorenz）提出。


    在动画角色设计中，这种婴儿图式被广泛使用，以增加角色的吸引力。


    除了米老鼠，其他动画角色如唐老鸭、布鲁托等，也经历了类似的形象演变过程，变得更加可爱。


    这种变化不仅限于动画角色，许多现实中的动物也经历了类似的演化过程，比如狗的品种选择。


    通过选择那些具有婴儿图式特征的动物，人类培育出了许多更加可爱的动物品种。


    这种现象不仅存在于动物界，也存在于人类自身。


    人类在进化过程中，保留了许多幼态特征，如大脑容量增加、面部比例变化等，这些特征使得人类在成年后仍保持一定的可爱度。


    总结来说，米老鼠越来越可爱的原因是其形象设计符合了“幼态持续”的生物学规律，这一规律使得角色在视觉上更加吸引人。


    这一发现不仅限于动画领域，也广泛应用于生物进化论和动物行为学中。


    通过了解这一规律，我们可以更好地理解为什么某些动物和人类在成年后仍保持可爱，以及这一现象在进化过程中的作用。


    这一研究不仅丰富了我们对生物进化的理解，也为动画设计和动物育种提供了科学依据。'
