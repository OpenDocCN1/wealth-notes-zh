    ## —— 博物学家养成记 ——


    从这个意义上说，我们或许每时每刻都在创造奇迹。可能我们在做那些我们本性的时候，未必会想到它。所以，自己去做任何事，都会格外努力。这样才能去争取那个可能毫无当中的造出来的奇迹。


    你想？如果不是也是这样的，那就和我一起努吧。


