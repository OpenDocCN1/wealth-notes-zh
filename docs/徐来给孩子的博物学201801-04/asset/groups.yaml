    - 2. 但他的目的只是为了纯洁血统。不过，在他的影响下，很多医生开始研究香烟给人带来的危害；

    - 3. 缪勒的回顾性研究和哈蒙德的前瞻性研究都发现，吸烟和口腔、咽喉和肺部癌症有密切关系。吸烟的时间越久，由此带来的健康影响越大；

