    袋狼：现已灭绝，因身上斑纹似虎，又名塔斯马尼亚虎。虽然早有人提出保护袋狼，但保护令下达是在1936年。当时野外已没有袋狼，而保护令发布之后不到两个月，最后一只袋狼也在动物园里被冻死了。


