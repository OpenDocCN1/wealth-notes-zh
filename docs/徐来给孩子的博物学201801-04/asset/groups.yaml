    ## 博物学家养成记


    样。考虑到发现环境的情况，曼特尔初步断定，这是生活在距现在几千年前的一种体型庞大的食草动物。但这个动物到底是什么，他可说不出来。


    曼特尔把这个化石给当时世界上最有名的古生物学家看，但是大师觉得，这只是古代犀牛和马的化石。这个判断让曼特尔灰心意冷，觉得原来只不过是发现了很平庸的东西而已。然而一个偶然的机缘，他发现，这些牙齿跟一种南美洲蜥蜴的牙齿非常相似，这重新点燃了他的斗志。他把这种动物命名为禽龙，并且为它撰写了论文。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_138_0.png)


    之前那个断言是犀牛或河马的大师，在读了曼特尔的论文之后，很快就改变了自己的看法，接受了其观点。后来，曼特尔尝试向博物馆申请经费，结果也失败了。最后，他竟要接受最大的精神痛苦，而且也需要面对肉体上的痛苦。


    糟糕的事情还不止于此。当时大英自然历史博物馆的馆长欧文也盯上了曼特尔的收藏和学术成就。在1841年的一次演讲中，他把当时已经发现的9种大型史前爬行动物合在了一起，并把它们称作
    dinosauria，恐龙这个名称由此而来。


    接下来，欧文就开始动歪脑筋了。他趁着曼特尔受尽病痛折磨的时候，有计划地在科学文献里删除了曼特尔的记录，把他曾经命名过的动物，用自己的方法重新命名一遍，宣称那是自己发现的。而且，他还利用自己的影响力，让学术刊物不要刊登曼特尔的论文。


    1852年，曼特尔因为服药过量而陷入昏迷，不久之后去世。有些人猜测他可能是无法忍受肉体和精神痛苦而自杀。但他还是如此热爱古生物事业，以至于在遗函中把大部分化石都捐了出去，甚至捐献出了自己车祸后变形的脊椎，希望能用于医学研究。


    还好，如今我们还记得曼特尔，记得他在古生物研究，尤其是恐龙研究方向做出的卓越贡献。如果你的小伙伴也喜欢恐龙，那么找个机会，跟他说一说曼特尔和恐龙的故事，让更多人了解到他的工作，好不好？


    - 人们已知最早有明确记录的恐龙发现是在1676年。当时人们从牛津的采石场里找到了一些骨头。1763年，这些骨头被命名，但当时人们并没有意识到这到底是什么；

    - 1824年，巴克兰正式命名了一种恐龙：斑龙，这是第一种被正式命名的恐龙。与此同时，1822年，曼特尔和他的妻子发现了另一种恐龙，1825年，曼特尔将这种恐龙命名为禽龙；

    - 曼特尔命名了禽龙之后，引起了著名古生物学家维格诺的注意，对恐龙的关注由此爆发出来。虽然曼特尔在恐龙化石上投注了很多精力，但他经营不当最终破产。随后，他的很多研究被另一位著名古生物学家欧文抹杀。幸运的是，如今大多数科学家依然把他的工作视为恐龙研究史的开端。


    最早的恐龙发现：人类已知最早的有记录的恐龙发现是在1676年。当时人们从牛津的采石场里找到了一些骨头，但没搞清楚那是什么。1824年，巴克兰第一个正式命名了一种恐龙：斑龙。


