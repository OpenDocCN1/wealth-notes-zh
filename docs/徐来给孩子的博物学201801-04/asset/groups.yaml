    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_42_0.png)\n\n## 科学家·计算机｜计算机是怎么战胜人类的？\n\
    \n一起发现吧！\n\n我们家小朋友最近开始学下围棋。前两天，她人模虎虎地，兴致勃勃地，卷着讲下棋出师。其实，她看起来像思索了半天，告诉我们说，有话说只有下棋很厉害。\n\
    \n听她说这句话，我愣了一下，才意识到她说的是阿尔法狗。阿尔法狗这个名字你应该听说过。其实，它并非叫阿尔法狗，它的全名是AlphaGo，在英语里，go是写成小写g加一个o，而不是大写GO，意思是围棋，阿尔法狗直接读出来的意思是“最棒的围棋”。\n\
    \n今天的故事，就要从阿尔法狗讲起。\n\n### 人工智能围棋手\n\n阿尔法狗第一次引起大家的关注，是因为它打败了围棋的欧洲冠军樊麾。但这件事并没有引起太多人的关注。毕竟围棋这个东西一个是东方人的游戏，中国、日本和韩国这三个国家才代表着围棋的水平。其他地方，无论是欧洲还是美洲，下棋的人都要弱得多，所以虽然是欧洲冠军，但樊麾在世界各国棋手中排序，其实已经靠后了。大家都知道，之所以阿尔法狗能5比0大获全胜，只是因为樊麾太弱了。\n\
    \n不过，很快和阿尔法狗对这些人还以些比赛了，它以4比1的比分轻松获胜。而它的小胜李昌镐这一阿尔法狗身上拿下世界第一位为止唯一的一个击败阿尔法狗的人——因为从此后，再也没有人赢过这个专门下围棋的电脑程序了。\n\
    \n其实，直到阿尔法狗大棋士李世石，很多人还是不服的——李世石不还挺顺一局吗，说明还不是打不过的。不过，很快大家就觉得不太对了。阿尔法狗的输赢全靠自己。它在全球和它和韩国最厉害的两个围棋选手，并取得全胜，最后到了2017年，阿尔法狗宣布自退，但它的崛起已经让所有人看到了人工智能的力量。\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_43_0.png)\n\n### 阿尔法狗的4种武器\n\n- 第一叫蒙特卡洛树：这是一种计算方法，在一局对弈时，它会先尝试各种可能性，然后不断地指导向赢面最大的那几步。\n\
    - 第二叫深度神经网络：它实际上用上用来优化神经网，让机器学习，去增加更快速高效的办法找到更好的那几步，所需要计算的东西，也就会更少。\n- 第三叫自对弈：天才也是从菜鸡成长起来的，我们会用人类千年来也经练交给它\n\
    - 第四叫强化学习：不仅不仅仅让机器学习所有人类的经验，还就让它超越人类专家，我们让它相互对弈，继续进步。\n\n就靠这么4个武器，阿尔法狗构成了围棋界的一大传奇。你不得要说说阿尔法狗的诞生过程？不是，可惜就结束。就在不久之前，研发阿尔法狗的个团队做过一个版本，叫阿尔法围棋，而名字叫做阿尔法零。为什么要叫“零”呢？因为阿尔法狗版本，它从根本学下围棋都只会情况了。然后开始跟本下个棋。最后，它只用3天时间，就打败了用了“阿尔法狗”李世石那个版本，后来只用了21天就战胜了阿尔法狗大师，到了40天的时候，它已经是所有阿尔法狗版本中最强个一个。\n\
    \n### “深蓝”的战绩\n\n前面我们说过，阿尔法狗并不是是下棋的，而是用了4种特殊方法，配合在一起，先找出人类的目标，然后在各自的上去去算每一步棋。但这并不等于它硬算，这个方法不能。实际上，在此之前，就有个电脑是赢过国际象棋的，它在全球上好的棋手——准确地，是世界上最好的国际象棋棋手。他的名字叫卡斯帕罗夫。\n\
    \n那是20年前的事儿了。当时美国的IBM公司研发出了一套程序名字叫深蓝。深蓝就是后跟人类来下棋的。在1996年的时候，它是当时国际象棋冠军卡斯帕罗夫进行了一次比赛，在6局里面，它只赢了两局。\n\
    \n不过深蓝显然不会善罢甘休，这种程序，不就是为了赢过人类。所以，只用了一年的时间，深蓝就被升级成了“更蓝的蓝”，再次了很大的提升，它每秒钟能算两次，能够计算出每一步棋之后紧接的12步怎么走，而且最优秀的人类棋手，大概能计算10步左右。\n\
    \n这一次，更蓝的蓝终于赢了。最厉害的时候卡斯帕罗夫不太相信，觉得一定是其他对手在背后帮助更蓝的蓝。但是电脑程序的棋手不在参与，就所有人都认可了电脑远远超越了人类。\n\
    \n现在，在华盛顿的美国国家历史博物馆，可以看到当年更蓝的蓝的一部分。\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_43_1.png)\n\
    \n### 永远无法战胜的对手\n\n世界上最好的国际象棋高手卡斯帕罗夫和世界上下最好的国际象棋，都败给了电脑程序。但从某种意义上说，他们并不是人类当中最好的棋手。从战略上说来，人类最好的棋手是一个叫马格列斯利的人，在自己的棋手生涯里，他只输过17局，但没有输过任何一场比赛。这是世界上战胜最好的棋手。他一下叫西洋棋的棋。\n\
    \n重要的是，他也曾经和电脑程序对过，并且可能是世界上唯一一个无法被电脑程序战胜的棋手。\n\n那是卡斯帕罗夫和深蓝比赛之前的1994年。当时，玛格列斯利参加了一场名为30前的比赛，对手是一个叫“狄克劳”的电脑程序。\n\
    \n比赛的局多，双方都不在下棋，继续没啥，输，他同意也没办法。但在第五局结束之后不久，玛格列斯利生了病，医生检查之后发现，他得了很重的，而且仅仅7个月后，他就去世了。\n\
    \n但狄克劳的创造者并没有就此善罢甘休。他觉得，按照自己的意识，程序员一定能够，他先是写了一篇论文，设计了一个用数学方法的尽详盘棋所有可能的程序。没有，没有人能战胜它，即使自己也跟自己下，也只能下到棋。\n\
    \n然而，这一切琼斯利已经永远无法看到了。\n\n——博学家养成记——\n\n人工智能与人类智慧的较量已经成为现在热议的话题，你觉得人工智能将来会打败人类，主宰地球吗？把你的依据和思路在留言区说说你的看法吧。\n\
    \n- 1. 阿尔法go的go，是日语里围棋的意思。阿尔法狗之所以能胜过人类围棋手，靠的是蒙特卡洛树算法、深度神经网路、监督学习和强化学习和4种方法；\n\
    - 2. 国际象棋程序深蓝曾经在1997年打败过当时世界上最好的国际象棋大师卡斯帕罗夫。它每秒钟能运算2亿次，推算出12步棋的走法；\n- 3. 廷斯利可能是世界上唯一一位不会被计算机打败的棋手。他是西洋跳棋的世界第一人，在与计算机对弈的比赛中，他因为癌症去世了。而在去世之前，他和计算机的比赛一直是平局。\n\
