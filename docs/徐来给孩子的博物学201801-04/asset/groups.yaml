    ### 什么是水晶头？\n\n水晶头盖，顾名思义，就是用整块儿水晶雕刻成的类似人脑一样的东西。水晶头盖，以前被人认为是珍贵的，但实际上水晶都是无色透明的石英罢了，作为一种矿物，石头在地球上的储量那是相当大。所以，即便是大块儿的水晶头盖也不是很罕见的东西。不过，水晶这个东西，非常硬，而且十分难加工，需要慢慢的琢磨。很早以前，人们没有掌握如何处理水晶的方法，水晶头盖曾很珍贵。\n\
