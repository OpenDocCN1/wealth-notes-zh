    # 问答+发奖丨一块牛肉从多少米的高空掉到地上才会烤熟？


    你好，我是徐来。欢迎学进我的专栏《给孩子的情科学》。


    前两天，我带着我们家的的小朋友去了一趟动物园。动物园真的是一个很有意思的地方，很多人经常去动物园，却不知 道应该怎么看待动物。其实，在动物园里，要注意一下动物的作息。比如狮子老虎这样的猛兽，一般都是在清晨或者黄昏活动，如果中午或者下午逛动物园，它们肯定是无精打采的。所以，你该更多地注意到那些白天活动动物、多留意它们的作为，尤其是彼此之间的互动行为。


    另外也要注意观察兽舍，尤其是那些被养了很多树皮、木块、落叶，或者用沙土铺垫，上面打了好多洞的兽舍。这样的兽舍往往还上了很复杂的树枝，空中有树枝和绳子。不妨想一想，兽舍为什么要这样设计，每一样装置跟兽舍里的动物是什么样的关系。


    好了，现在来回答本期的问题：


    > > 我想了解一下前一段时间中科院陈凯研究所在做的的那个很厉害的“克隆猴”。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_53_0.png)


    这个克隆猴，准确地说是“体细胞核移植克隆”，猴子是哺乳动物，有性繁殖的动物，有精子，有卵子，卵细胞的细胞核，含有这个动物一半的DNA。如果把卵细胞的DNA拿走，再放进一个完整的体细胞的细胞核。它就拥有全部的DNA了。这个卵细胞就会在新的细胞核的指挥下分裂，分化，形成胚胎，并变成一个新的个体。这个个体的DNA没有经过爸爸妈妈各出一半的过程，是和原先那个一模一样的，咱们之前讲过的克隆羊多利就是就是这么来的。


    可你知道吗，多利其实是一个克隆出来的奇妙生物，后来第二个说过克隆羊、克隆牛，那克隆猴到底厉害在哪里呢？


    那是因为在克隆猴很难，一方面猴子的卵子弹量很小，你稍微扭一下它就容易了；另一方面，猴子的细胞核也是跟以前的不一样，人类是第二次工作非常难，所以，中国科学家做出克隆猴被认是
    非常了不起的一件事。


    我将我5岁多的女儿问两个问题是：

    1、人是从哪里来的？沙子是从哪里来的？


    第一个问题，其实在我前段时间的专栏里答过，在11月的那时候，我跟你讲了一次《今天的太阳是什么》，你可以把这一期的专栏文章再看一遍，复习一下。


    第二个问题，有点意思的。它也不是太好回答，因为沙子的成分有很多种，它们的来源都不太一样。


    比如说在内陆地区，像是一些沙漠地区，这里的沙子主要成分是石英，它们化、在阳光和风雨的作用下逐渐风化，粉碎形成，它们在海边的碎屑、成分主要是碳酸钙，它是是鸟、贝壳及贝壳的碎片构成的；像是冰岛有著名的黑沙滩，主要是火山喷出来的火山沙。


    还有一些特定的地区，沙子是人类制造出来的，比如在著名的玻璃海滩，海边的沙子，实际上是海水打浪了成年的小颗粒，另外像是第二次世界大战当中著名的沙曼岛在很巨大的奥马哈海滩，海滩上的沙子有很大一部分是钙泥，海岸线上的盆具小颗粒。不过，总的来说，地球上的沙子主要来自于岩石的风化，以及珊瑚、贝壳之类海洋生物形成的。


    > > 我问我5岁的女儿问：为什么小便是黄色的，而不是其它什么颜色，比如玫红色火龙果尿尿却不是红色？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_53_1.png)


    我们的尿液之所以呈现颜色，是因为其中有一种叫做胆原素的东西。尿胆素 实际上就是我们血细胞的红血球。红细胞是构成了我们的东西。红细胞在失去用处之后，会被分解，成为尿胆素。一部分进入我们的大肠，把便便染成那个颜色；另一部分转移到肾里，让尿染色。当然有的时候尿液也会变成其他颜色。


    尿液颜色异常，有时和疾病有关。比如尿液如果变得暗色，这很可能意味着尿蛋白、说明健康出了问题。绿色或者黑色的粪便也可能是血液或者药物有关，不过，食物很可能改变尿液的颜色，比如说一些色素食品就会这样。我们吃芦笋吃多了，尿液有可能发绿。而甜菜、火龙果吃多了，其中的有色素成分，如果多吃下去，尿液的颜色也会变深红色。你以为觉得尿液没有如此改变，可能是因为量还不够嘛。


    一块牛肉从多少米的高空掉到地上才会烤熟？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_53_2.png)


    这个问题听起来有点奇怪。物体在大气层中坠落的时候，表面会因为空气摩擦而加热。理论上来讲，说，真的确有人研究过这个问题。结论可能会让你失望。


    如果牛排开始下落的高度，低于250公里，那么它的表面可能无法被加热到足够的温度。如果牛排从250公里以上的高空往下坠落，那么这块牛肉将会达到6倍音速，为了相当高的牛牛排，不过，不幸的是，因为温度减小的速度也很快，所以牛排足够热到让牛排烤熟的程度。当然，把牛排放得更高一些，让加热的时间变长，但这么一块牛排落体就会完全被
    掉，并且在气流的作用下被吹散。总之，你没有办法用空气摩擦把一块牛排完全烤熟。


    我替我女儿一问：狗的听力比人类灵敏，那么听的声音也会比人类听到的声音更大吗？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_53_3.png)


    总体上，狗的听觉比人灵敏得多，能听到比人更加细微的声音少...（注意，此部分文字位于截图中最底部，部分被截断）到远比人更加细微的声音——至少年轻的狗是这样。人类听不到50米外的声音，但有些狗即使是几百米外的声音，也能听见。所以虽然我们很难真的知道狗听到声音是什么感觉，但可以合理想象，同样的声音它们会觉得更响。


    此外，狗狗能听到的频率还比人更高，有些人根本听不见的声音狗能听见。所以很多养狗的人发现自己的狗怕吸尘器。对人而言，吸尘器的声音主要是吸进去的风产生的噪音和震动；但很多狗都能听到发动机旋转产生的高频声音，这个声音就太过尖锐吵闹了。


