    # 演化学-动物 | 大象能不能不长牙？


    世界好大，奇效的事情每天都有，我们一起去发现吧！


    > > 让化学-动物 | 大象能不能不一...  ↓


    徐来


    一 说 身 子 最 长 的 动 物 ，你 一 定 默 认 而 出 ： 是 大 象 。 但 是 你 眼 中 的 大 象 可 能 都 是 一 种 动 物 ， 但
    是 ， 大 象 分 成 非 洲 象 和 亚 洲 象 两 大 类 ， 非 洲 象 很 多 大 ， 非 洲 象 更 要 小 些 ， 非 洲 象 背 的 中 间
    部 分 是 凹 陷 的 上 去 ， 而 且 亚 洲 象 则 是 隆 起 的 ： 非 洲 象 的 耳 朵 是 三 角 形 的 ， 亚 洲 象 则 是 圆 的
    而 且 比 较 小 ： 非 洲 象 的 前 额 隆 而 平 ， 而 亚 洲 象 的 前 额 则 是 隆 起 的 。


    还 有 一 点 是 ， 非 洲 象 无 论 公 母 ， 成 年 之 后 ， 都 会 长 出 长 长 的 象 牙 来 。 而 经 常 看 到 有 长 牙 的
    象 走 的 象 多 。 我 们 经 常 在 相 关 媒 体 上 看 到 ， 很 多 人 为 了 谋 取 私 利 ， 去 猎 杀 大 象 ， 私 藏 下 象
    牙 ， 世 界 上 绝 大 多 数 国 家 都 是 违 法 的 ， 他 们 终 究 会 受 到 严 厉 的 法 律 惩 罚 。 但 是 大 家 的 牙 齿
    实 在 太 珍 贵 ， 还 会 有 人 身 以 自 法 ， 去 伤 害 大 象 。


    那 么 ， 我 们 不 如 大 胆 想 一 下 ， 大 象 是 不 是 能 不 长 牙 呢 ？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_98_0.png)


    # 大 象 为 什 么 会 没 有 牙 ？


    是 不 是 觉 得 ， 可 是 这 个 问 题 提 得 有 点 儿 没 头 没 尾 的 ？ 我 是 这 个 问 题 的 答 案 大 家 很 可 能 会 让
    你 大 吃 一 惊 ， 一 大 象 不 长 大 牙 这 件 事 ， 很 可 能 真 的 会 发 生 。


    有 些 科 学 家 ， 在 研 究 了 生 活 在 亚 洲 地 区 的 大 象 之 后 ， 惊 讶 的 发 现 ， 现 在 生 活 在 野 外 的 大 象
    性 态 象 牙 大 ， 他 们 现 在 正 在 逐 渐 变 得 短 了 。 当 然 ， 这 并 不 是 说 经 过 几 十 年 进 化 后 的 大 象 会
    成 为 小 象 ， 而 是 说 ， 每 一 代 长 出 的 公 象 ， 它 们 长 牙 的 平 均 长 度 都 要 比 前 代 要 短 一 些 。 这 样
    一 来 ， 野 生 性 大 象 象 牙 的 长 度 似 乎 有 很 大 的 可 能 一 直 变 短 下 去 ， 直 到 完 全 消 失 。 而 对 非 洲
    象 的 观 察 也 发 现 ， 天 生 不 长 象 牙 的 象 ， 正 成 得 越 来 越 多 见 了 。


    你 可 能 会 担 心 ， 如 果 长 不 出 象 牙 了 ， 那 对 大 象 会 不 会 有 什 么 不 利 的 影 响 呢 ？ 这 就 相 对 于 大
    象 为 什 么 要 长 出 长 长 的 象 牙 来 了 — — 不 过 ， 很 遗 憾 ， 对 于 这 个 问 题 ， 科 学 家 们 目 前 并 没 有
    什 么 确 凿 的 结 论 ， 他 们 只 是 大 致 了 解 象 牙 会 存 在 怎 样 的 用 处 。


    比 如 说 ， 对 于 雄 性 的 大 象 来 说 ， 象 牙 可 以 用 来 做 武 器 使 用 ， 或 许 对 于 他 们 来 说 ， 象 牙 越 长
    ， 就 是 越 师 气 的 。 也 有 一 些 人 认 为 ， 象 牙 可 以 用 来 打 猎 ， 模 糊 的 ， 毕 竟 比 鼻 子 更 像 是 可 以
    助 助 力 大 象 来 剥 去 树 皮 ， 或 是 挖 出 地 下 埋 藏 的 食 物 如 草 之 的 。 总 之 说 法 很 多 。 但 是 ， 不 管
    人 们 确 实 对 象 牙 做 上 面 提 到 的 各 种 各 样 的 情 况 下 是 不 太 可 能 的 ， 但 它 们 在 缺 少 这 些 情 况 下
    的 影 响 中 ， 并 不 会 至 少 它 还 能 活 下 去 。


    但 是 ， 新 的 问 题 又 来 了 ， 原 先 有 好 的 象 牙 怎 么 会 越 来 越 短 ， 以 至 于 有 可 能 会 消 失 呢 ？


    我 之 前 跟 你 说 过 的 ， 生 物 的 各 种 特 性 ， 实 际 上 都 是 由 基 因 上 控 制 的 。 你 的 个 头 长 多 高 ， 很
    大 程 度 上 是 你 的 爸 爸 妈 妈 的 身 高 来 决 定 的 。 大 象 的 象 牙 也 是 一 样 ， 象 牙 能 长 多 长 ， 也 是 小
    象 的 象 爸 象 妈 妈 决 定 的 。


    如 果 长 着 长 长 的 大 牙 的 大 象 越 来 越 少 ， 那 么 能 给 象 宝 宝 提 供 大 长 牙 基 因 的 象 爸 象 妈 也 就 越
    来 越 少 ， 这 样 小 象 们 的 象 牙 自 然 就 越 来 越 短 了 。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_98_1.png)


    # 盗 猎 到 底 有 多 可 怕


    这 有 点 奇 怪 ， 不 是 说 长 牙 给 大 象 们 带 来 了 好 处 吗 ？ 无 论 是 猎 物 ， 还 是 打 架 ， 或 者 是 挖 掘 食
    物 ， 虽 然 武 器 并 不 是 决 定 性 的 ， 但 是 有 实 打 实 的 好 处 。 为 什 么 这 样 的 大 象 都 没 有 办 法 留 住
    自 己 的 后 代 ， 让 大 的 基 因 流 传 下 去 呢 ？


    原 因 很 简 单 ， 有 着 大 长 牙 的 大 象 都 被 打 死 了 。


    象 牙 是 一 种 非 常 美 丽 的 材 质 ， 白 色 ， 微 带 一 点 淡 黄 ， 质 感 很 温 润 ， 看 着 特 有 的 光 泽 。 所 以
    ， 无 论 是 东 方 还 是 西 方 ， 都 试 图 用 象 牙 来 制 作 各 类 装 饰 品 。 今 天 ， 也 在 世 界 各 地 的 博 物 馆
    里 ， 都 能 看 到 少 年 的 象 牙 制 品 ， 有 些 雕 刻 得 非 常 精 美 。


    其 实 ， 从 本 质 上 来 说 ， 哺 乳 动 物 的 牙 齿 构 成 都 不 多 ， 猪 ， 牛 ， 是 马 驴 猪 ， 还 是 海 象 的 牙 ，
    至 多 是 差 一 个 牙 冠 的 牙 齿 ， 大 白 牙 ， 等 等 大 大 性 牙 ， 它 们 的 牙 齿 都 差 不 多 。 只 是 象 牙 真 的
    是 大 太 多 了 ， 特 别 适 合 用 来 制 作 各 种 装 饰 品 ， 更 重 要 的 ， 在 古 代 ， 杀 死 一 头 大 象 相 对 来 说
    是 比 较 困 难 的 ， 所 以 象 牙 会 格 外 珍 贵 。


    渐 渐 的 ， 人 们 猎 杀 大 象 的 能 力 提 升 了 ， 象 牙 的 供 应 也 就 越 渐 增 加 。 人 们 开 始 利 用 象 牙 做 成
    各 样 希 奇 的 东 西 ： 餐 具 、 感 到 的 牙 的 牙 签 、 发 簪 、 最 让 人 目 不 敢 信 的 白 牙 的 牙 签 套 、 桌 球
    ， 对 ， 就 是 那 种 桌 面 用 绿 色 绒 布 铺 着 ， 然 后 两 个 人 拿 着 木 杆 子 似 的 东 西 在 桌 球 上 滚 动 ， 实
    际 上 ， 在 工 业 革 命 之 后 ， 象 牙 在 欧 洲 的 主 要 消 耗 点 ， 都 在 这 玩 儿 上 头 。


    这 种 情 况 在 19 世 纪 的 时 候 才 得 到 缓 解 ， 桌 球 渐 渐 流 出 替 代 品 ， 但 到 50 年 前 ， 象 牙 才 从 领
    导 领 域 完 全 退 出 。


    因 为 长 着 大 牙 的 象 必 须 杀 死 大 象 。 虽 然 大 象 可 以 长 出 很 长 的 象 牙 来 ， 但 象 牙 的 生 长 三 分 之
    二 是 完 全 埋 在 头 里 面 ， 而 且 ， 长 牙 的 象 头 和 头 骨 也 在 一 起 ， 为 了 尽 量 多 得 一 点 儿 象 牙 ， 人
    们 总 是 直 接 将 大 象 杀 死 ， 然 后 把 它 的 整 块 头 部 都 给 砍 掉 ， 以 便 取 出 完 整 的 象 牙 来 。 这 是 一
    件 非 常 残 酷 的 事 情 ， 听 起 来 就 觉 得 很 可 惨 了 。


    现 在 ， 虽 然 象 牙 的 贸 易 已 经 被 列 为 非 法 违 规 了 ， 但 是 像 当 然 有 很 多 盗 猎 者 是 舍 不 得 此 业 的
    ， 所 以 仍 然 有 很 多 盗 猎 者 面 而 走 脸 ， 我 们 每 天 都 能 收 到 某 个 保 护 区 内 大 象 被 杀 害 的 消 息 。


    # 其 他 动 物 也 被 盗 猎 者 害


    更 糟 糕 的 是 ， 在 这 些 血 腥 的 贸 易 当 中 ， 受 到 伤 害 的 不 仅 仅 是 大 象 ， 还 有 其 他 的 动 物 也 不 幸
    被 卷 入 。


    在 非 洲 西 部 一 个 叫 作 加 比 亚 的 国 家 ， 有 一 个 叫 巴 博 登 格 的 国 家 公 园 ， 这 里 生 活 着 很 多 大 象
    ， 还 有 很 多 其 他 的 动 物 。 在 2013 年 7 月 份 ， 这 个 公 园 的 工 作 人 员 发 现 ， 这 里 有 一 大 批 大 象
    被 杀 掉 了 ， 而 这 头 大 象 一 起 死 去 的 ， 有 多 达 6 000 只 非 洲 白 自 背 虎 鲸 。


    秃 鹰 这 样 都 不 好 看 了 ， 所 以 ， 可 许 你 会 说 ， 就 看 个 背 壳 可 能 就 足 够 让 你 好 好 了 。 但 是 ， 要
    知 道 白 背 虎 鲸 是 一 个 非 常 特 别 的 物 种 ， 在 1922 年 的 时 候 ， 国 家 保 护 活 动 多 达 27 万 只 ， 到
    2004 年 的 时 候 ， 也 被 认 为 是 一 种 不 在 天 然 危 险 的 动 物 。 但 到 2012 年 ， 它 就 被 划 为 一 级 被
    保 护 危 危 。 而 到 了 2015 年 ， 它 又 被 上 调 了 ， 变 成 了 “ 极 危 ” ， 意 思 是 它 们 已 经 绝 对 危 险 了
    。


    实 际 上 ， 这 种 物 种 的 降 得 快 已 经 远远 的 超 过 了 大 红 熊 。 数 量 的 日 降 很 大 ， 让 所 有 的 动 物 学 家
    都 为 它 们 感 到 担 心 。


    可 是 ， 为 什 么 这 么 珍 稀 的 动 物 ， 一 次 性 就 死 了 600 只 呢 ？ 原 因 非 常 简 单 ， 那 头 大 象 的 尸 体
    被 丢 了 。'
