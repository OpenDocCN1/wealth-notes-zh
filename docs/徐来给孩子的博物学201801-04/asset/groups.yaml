    这个问题听起来有点奇怪。物体在大气层中坠落的时候，表面会因为空气摩擦而加热。理论上来讲，说，真的确有人研究过这个问题。结论可能会让你失望。

    如果牛排开始下落的高度，低于250公里，那么它的表面可能无法被加热到足够的温度。如果牛排从250公里以上的高空往下坠落，那么这块牛肉将会达到6倍音速，为了相当高的牛牛排，不过，不幸的是，因为温度减小的速度也很快，所以牛排足够热到让牛排烤熟的程度。当然，把牛排放得更高一些，让加热的时间变长，但这么一块牛排落体就会完全被
    掉，并且在气流的作用下被吹散。总之，你没有办法用空气摩擦把一块牛排完全烤熟。

