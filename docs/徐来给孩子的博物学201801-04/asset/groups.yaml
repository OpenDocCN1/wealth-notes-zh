    \ \n-   行为学·动物｜行军蚁到底有多吓人？  \n-   行为学·动物｜鸟到底可以飞多久？\n\n-   1. 现在世界上共有18种长臂猿，其中7种在中国境内有分布记录。主要集中在西南地区和海南岛。其中，历史上的长江流域也曾经分布有长臂猿；\n\
    -   2. 长臂猿擅长跳跃和唱歌。唱歌还被作为长臂猿群体之间争斗的一种方式。除了争斗之外，也是彼此交流的一种沟通和娱乐方式。其次，长臂猿的情感也很丰富，需要人类的小心保护。\n\
