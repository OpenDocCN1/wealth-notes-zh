    # 古生物·化石 | 谁会因为抢骨头而纠结?


    世界你好, 奇妙的事情每天都有, 我们一起去看吧!


    徐来


    想问你一个问题，你有没有抢过同学的恐龙玩具啊？或者，你的恐龙玩具有没有被其他同学抢走呢？抢别人的东西，不管是出于什么原因，肯定都是不对的，用自己的东西或别被抢走，也要及时告诉爸爸妈妈或者老师，请他们协助自己来处理。


    你先不会觉得有点奇怪，今天我怎么一开始先问抢恐龙玩具的事儿呢，难道这个和我今天要说的故事有关吗？


    还真的被你猜中了，我今天要说的，就是一个发生在美国的故事。由于抢夺化石的‘战争’。注意，这个战争是打引号的‘战争’，因为这不是真刀真枪的战争，而是一次冲突，这个冲突涉及两名在古生物学界，被大家称为‘化石之战’。


    # 化石之战：柯普VS马什


    化石之战的双方，一个叫柯普，一个叫马什，都是古生物学史上响当当的名字。


    先出场的是柯普。柯普是当时美国最著名的古生物学的学生，也是起格很厉害。年轻时就做了博物馆的馆长。而且，在1866年的时候，他发现了个头不很大的恐龙化石。这个恐龙化石个头不小，估计身长至少有7.5米。更重要的，实际上他是最早发现的恐龙恐龙之后，第二种被发现。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_73_0.png)


    # 装错了镰刀龙的头


    接下来柯普又碰到了好事。他收到了一箱化石，这种化石简直太特别了。因为里面一种新类型。这种类型，不是蛇，也不是水底爬行动物。跟他的关系不大，但是特别地。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_73_1.png)


    # 挖化石挖到打群架


    为了获得更多地古生物化石，马什决定向东部进发。他组织了一支远征队，进入印第安人的保留地探索化石。而柯普呢，也毫不示弱，同样组织了团队，加入了同样的地点，两人开始了正式的竞争。


    # 命名中的忙中出错


    不过，也因为他们俩的‘战争状态’，所以，两个人都出现了大意为把抢先发表而产生的竞争关系。前面说的把镰刀龙的头装反了就是其中之一。类似的情况，马什也犯过。


    > —— 博物学家养成记 ——


    写文章时，我们要多思考思考，求其甚之心，确不，确实太急。否则，有可能给我们留下巨大的遗憾。比如之前出过这样一个题目，考试太急或急做事情考出了错误嘛，如果有事，不妨在评论区和大家分享一下自己的经验和教训吧。'
