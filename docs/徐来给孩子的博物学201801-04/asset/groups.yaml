    - 1. 爆发在美国古生物学家柯普和马什之间的"化石之战"，是古生物学历史上最著名和最令人唏嘘的一段故事；

    - 2. 双方在化石挖掘、整理和命名的过程中爆发激烈的竞争，竞争刺激了他们的学术工作。在"化石之战"中，他们俩一共发现了超过140件新化石标本，其中马什发现了86种，而柯普发现了56种；

    - 3. 同样因为竞争关系，他们求胜心切都犯下了一些错误。柯普错将薄片龙的头给装到尾巴上去了，而马什则没有注意到，自己命名和炒作起来的雷龙，其实就是自己几年前命名的迷惑龙。其中最严重的错误来自柯普，他因为给暴风龙命名时没有注意到拉丁文已经被占用，所以丢失了自己发现的第一只恐龙的学名。


    化石战争（Bone Wars）：发生于19世纪后期，当时的两位著名古生物学家柯普与马什，互相竞争谁发现了更多、更著名的新恐龙。激烈的竞争导致了很多贿赂、个人攻击、暴力等行为。


