    此外，狗狗能听到的频率还比人更高，有些人根本听不见的声音狗能听见。所以很多养狗的人发现自己的狗怕吸尘器。对人而言，吸尘器的声音主要是吸进去的风产生的噪音和震动；但很多狗都能听到发动机旋转产生的高频声音，这个声音就太过尖锐吵闹了。


