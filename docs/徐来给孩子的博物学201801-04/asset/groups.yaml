    行为学·动物 | 猫为什么能预知死亡？

    行为学·植物 | 世界上真的的有僵尸吗？


    - 1. 家猫是被人类驯化的斑猫。斑猫有5个亚种，家猫来自非洲野猫这一支。因为来自荒漠地区，所以家猫继承了野外祖先少喝水的习惯；

    - 2. 通过分析古代猫骨中的微量元素，考古学家们发现，至少在5000年前，人类就已经开始主动饲养猫了。而古代埃及壁画上猫的形象则显示了它们是怎样一点点脱离野性和对领地的需求，变成一种家养动物的；

    - 3. 感染了弓形虫的老鼠，性情会发生变化，不但不怕猫，反而故意往猫面前凑。科学家认为，这是弓形虫操纵的结果，因为只有在猫体内，弓形虫才能繁殖。有些人进而猜测，感染了弓形虫的人类会更愿意亲近和饲养猫。


