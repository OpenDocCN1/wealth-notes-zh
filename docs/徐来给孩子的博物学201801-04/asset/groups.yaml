    # 问答|为什么黑色的花很少见呢？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_17_0.png)


    大家好，我是徐来。非常感谢大家喜欢给孩子们的植物学这个专栏。天气是一天冷过一天，随着时间的推移，期末考试又快到了，不知道各位小用户们，你们什么从这个专栏里重要的收获呢？希望你们能在这最后一篇文章中，也希能学到你们有用的学习方法，应用到学习和考试当中。


    按惯例，今天我回应大家问题的时间。来看这周五个问题。


    纯棉的衣裤洗了会缩水，为什么棉花长着被淋了它却没有缩小？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_17_1.png)


    确实，棉布会缩水，洗完晒干之后，会变“小”些。棉花并没有这个问题。


    因为棉花在变成棉布的过程中，经过了 很多加工，要拉长、捻索、编直。在清洗过程中，棉花的纤维会浸湿水分，再晒干的时候就会收缩，这一缩原 来紧绷的纤维就松了，就要往回
    收缩，我们就说它缩小了。


    不过，棉布缩小的情况并不是特别 严重，羊毛衫缩小的情况可要比棉布 严重多了。羊毛是一种动物纤维，它跟棉 花这种植物纤维不同的是， 羊毛上有个鳞片，洗的时候被水一泡泡
    的鳞片就打开了，洗的时侯被水拉长的，鳞片就一 收就就一收缩一收就小一块儿。 所以， 羊毛衫会缩水，但羊毛长在羊身上就不会缩水。


    # 为什么眼睛不会起雾？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_17_2.png)


    我平时 一直戴着眼睛的。到冬天的时 候，戴眼睛的朋友最痛苦了，无论是 从室外进屋内，还是从室内走进热气的室内，眼睛上都会起雾。如果不戴眼睛就不会有这样的烦恼了。


    起雾，实际上就是空气中的水汽被温度较低的对象表面凝结起来形成的 水珠。它得满足两个条件，一个是空气 中要有比较高水汽，另一个是 要有温度较低的对象。只要满足这两个
    条件，就会起雾。


    这么一来，也好理解为什么眼睛起 雾了。因为眼睛都是咱们身体的一部分， 它表面的温度不会太高，而人的体表 是满足两个条件，即眼睛的温度 不会太高，而眼睛的温度是接近体温的，
    但眼睛的温度比室内外的温差还是要 高的。


    # 为什么黑色的花很少见呢？


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_17_3.png)


    黑色的花确实比较难见到，甚至有些花 卉在自然状态下很少能看到黑色的花。 传统上的说法是，黑色比较喜欢吸收太 阳光中的能量，在自然界中容易受热 导致温度过高，从而损伤花。这种说法
    在某种程度上是正确的，但是黑色花朵 在自然环境中很少见的原因并不仅仅 是温度。'
