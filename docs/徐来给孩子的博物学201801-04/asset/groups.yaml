    ## 遗传学-动物|小白兔为什么白又白？


    世界好，奇妙的事情每天都有，我们一起去发现吧！


    徐来


    小白兔，白又白，两只耳朵竖起来...这样的歌词，你一定熟悉吧。小白兔浑身雪白又圆润，确实很可爱，毛茸茸的一跳一跳的小兔子，真让人想去捏一下它的耳朵。其实，除了小白兔之外，你一定还能见到很多白色的动物，比如在实验室里面常常见到的小白鼠，小白兔在实验室里面很常见的小白鼠。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_36_0.png)


    ### 白色动物，曾经代表祥瑞


    有些动物会长成白色的，这一点在人类很早时就发现了，而且，在大多数时候，白色的动物都被视作是非常好的象征。


    比如说，有些著名的古代帝王，他们在开始征服天下的时候，往往会得到白色动物的帮助。


    ### 自然界的白色动物


    那么，自然界的白色动物，原本是什么情况呢？


    要说到白色的动物，其实自然界还真的多，比如说北极熊，白虎。


    极地动物大多具有厚厚的白色皮毛，与冰雪的环境融为一体。


    海洋里也有白色的动物，比如小海豚。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_36_1.png)


    ### 如何区分白化病和白变？


    其实，动物和人一样，身上也会有白变，白化病和遗传导致的白化。


    的。


    ### ——♦ 博物学家养成记 ♦——


    怎么样，你现在知道如何区分这两类不同的白色动物了吧？下次再看到白色动物的话，按照咱们今天学习的只是，尝试去分辨一下吧。


    我们前面讲过很多跟动植物颜色有关的内容，如果你忘记了，建议今天借机会复习一下下面的相关内容，点击下方链接，可直接查看。

    - 遗传学·动物 | 如何让红色的眼睛变成白色？

    - 问答 | 为什么奶牛都是黑白？

    - 生理学·动物 | 乌鸦的骨头为什么是黑的？

    - 遗传学·植物 | 胡萝ト是什么颜色的？

    - 问答 | 转基因和基因变男有什么区别？


    - 1. 古代的中国人习惯于把白色的动物视为一种祥瑞。为了追求这种祥瑞，很多人会去做假，把毛色浅的动物说成是白色的，或者通过染色来制造白色动物；

    - 2. 白色动物的出现存在两种可能性，一种是所谓白化病，这是由于动物体内酪氨酸酶异常，导致无法正常合成黑色素导致的；另一种是所谓白变，这是动物体内一部分黑色素细胞出现异常导致的。这两种可能性都与基因有关；

    - 3. 白色的动物因为可能存在其他的基因缺陷，并且紫外线抵抗能力较弱，再加上颜色太过醒目，所以在自然界生存能力并不强。而人类刻意培育出来的白色动物，比如白老虎，因为长期近亲繁殖，遗传单一，也容易受到各种遗传病的困扰。


    > 白色动物：动物呈白色与基因有关，一般有

    两种情况：1.白化病。即体内酪氨酸酶异常

    ，导致无法正常合成黑色素导致。2.白变。

    动物体内一部分黑色素细胞出现异常导致。


