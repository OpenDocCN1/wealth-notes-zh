    ### 蒙哥马利街的吉祥物


    故事发生在一九七中期的美国。美国的 西海岸，也是连接中国有着太平洋的那 一边儿，有一座城市叫旧金山。现在旧金 山可大，是在一开始的时候，旧金山是一个四百人的小镇。


    不过，那时四下附近的地区发现了黄金，所以很多人千里迢迢来到这淘金，希望一夜之间找到一块儿黄金，变得有钱人。之以来，旧金山就像吹气球一样，膨胀起来，用了20年时间，从500人
    涨到了15万人，到了旧金山，别看着现在15万人，但在那个时候，它已经美国西部最大的城市了。


    人口一膨胀，问题也就跟着来了，其中 之一是流浪狗，有有些动物， 甚至狗的数量比人还多。在旧金山的蒙哥马利街就成这么一条流浪街，街上的人都认识，还给它起 了各叫的名字。


    布默做了一件非常了不起的事情。它救了 一条狗。当时，它注意到街上有一条 身体很大的狗，在撕一只很瘦弱的狗。 个就冲了过去，救下了那瘦狗，并且它赶上了大狗。随后，它把瘦狗带到自己的窝里，让狗狗自在一起。瘦狗腿
    上有很深的伤口，街上的人，有人 都说瘦狗活不了天。不过，反正 也没有一条流浪狗，所以也没人管它。


    可是布默没有放弃，它一直在照顾瘦狗，帮它清洗伤口，给它带吃的。神奇的事情发生了，那瘦狗人带点怀疑， 竟然恢复了健康。蒙哥马利街的人看 到了这个现象，也觉得很有意思，于是
    是给瘦狗起了个叫拉撒路—一拉撒路是 神传造中一个死而复生的人，这个名 字很适合那条瘦狗。


    从此，布默和拉撒路一起行动了。 不过，好日子没过几天，麻烦就来了。旧金山市政府开始捕捉鼠了—毕竟，流 浪狗太多，会造成一个问题，鼠咬人， 会传播疾病，还会把狗屎弄得到处都是
    。


    不过，蒙哥马利街的人却不想让大家狗 被赶，因为布默和拉撒路在旧金山做了一件很重要的事情：拿耗子。老鼠是很 让人头疼的动物，但偏偏这两家伙有 头、拿耗子。据说，最厉害的一次，街上
    有个水果铺子，店主整理铺的时候用，水 冲出来就压在大片的地板上。刚好赶上布默和拉撒路在边上，那两狗就看见了 老鼠，就开打比赛一样，比哪只狗先 吃耗子。据说，那一两狗在20分钟内
    死了85条老鼠。


