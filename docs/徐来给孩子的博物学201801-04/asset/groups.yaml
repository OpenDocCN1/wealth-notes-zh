    \n世界之大无奇不有。奇妙的事情每天都发生。一起发现吧！\n\n分类学·动物 | 什么鱼能引发... \n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_45_1.png)\n\
    \n徐来\n\n咱们这个专栏，前面说的内容多一直都很科学，说点儿实验室的事儿啊，说点儿科研机构的的事儿啊。今天咱们说点儿武戏，咱们从战争说起。人类历史上，有过很多很多的战争，多得多算不过来。但是有一场战争很特别，特别在哪儿呢？交战的两个国家，一个国家是老牌的军事强国，人口好几十万，另一个国家呢，刚成立没多久，总共不过30万人口——30个话就占一市辖区的这个地方北京的一个区，咱们中国的，这个朝阳区的人口都有接近400万了。\n\
    \n那么一个国家，怎么可能跟那么大的一个国家打得起来了呢？怎么就说这场战争跟一种鱼有关系呢？咱们今天就从这个军事强国讲起。\n\n### 冰岛为什么要跳英国？\n\
    \n这个军事强国，就是英国。而那个小国，是冰岛。冰岛是谁啊？你或许没有听说过，这是一个欧洲国家，位置非常靠北，是世界上最北极附近的国家之一。人口很少，地方也很小，就一个小岛。当时，冰岛才独立没多久，可想而知，它有多弱。\n\
    \n冰岛是一个岛，在它周围的海域里，有一种罕见——鳕鱼。我总觉着鳕鱼是个宝贝，你可别误会，别觉得鳕鱼是特别珍稀的鱼类。并不是，鳕鱼只是一种相对来说比较常见的鳕鱼，在澳洲和北美洲，鳕鱼是大家都经常会吃到的鱼。这种鱼，肉质非常细腻，个头相当大，数量又多，所以很受欢迎。还有一种更夸张的说法：欧洲的渔民打鱼，甚至要撞到才特别爱吃的鳕鱼鳍，甚至可以直接从船上跳下去，踩在鳕鱼的鳍上往外抓。\n\
    \n所以，欧洲的人们经常都会有美味的鳕鱼吃，如果吃得太多了吃不完，就用盐腌起来，或者风干，做成鳕鱼干，方便长期保存。\n\n当然，因为人类的捕捞，它们的数量下降得很快。所以呢，现在大量捕捞这个鳕鱼，还是比较注重的，说，不能全都打完，让我们的后代没有鳕鱼吃，你说是不是。\n\
    \n但刚一开，大家没有注意到这个问题，只是觉得，唉，海门儿，自己经常驾着渔船去的那些个海域里，怎么鳕鱼越来越少。\n\n越来越怎么办呢？那就往鳕鱼多的地方去啊。欧洲的渔民，尤其是欧洲北部的渔民开始到处找鳕鱼，有点儿像，北去找，大家就发现冰岛是个宝地了，我刚才才是说了吗，渔民都往冰岛周围扎营。这些渔民当中呢，是英国的渔民觉得最打他们来得最近，呼啦啦地，全跑冰岛去抓鱼了。\n\
    \n英国渔民往冰岛一聚集，冰岛人慌了：好家伙，你们自己家门口打鱼打完了，还来找我家啊，这也太没道理了。更重要的是，冰岛太靠北方，天气太冷了，所以农业不太容易发展，工业也不很，就靠打渔，这是是被英国人给抢了就活不下去了。所以，冰岛政府就沿着岛屿往外画了12海里，画了一个圈，说这12海里的海，是我们的领海，相当于我国的延伸，你们谁都不许进来。\n\
    \n其他国家呢乖乖地退出了这个12海里范围。但英国的渔船大，别的例如也在捕鱼呢，英国海军还派出了几十条军舰，保护自家的渔船。可冰岛也是拼下心来要保护自己的利益了，为了几条英国的船，装上一大炮也开出来了，抗战英国渔船打完了，试图擦擦英国渔民，甚至偶尔对渔船开几枪，同时又出示鱼，英国人呢，虽然不敢就在人家家门口，但心里也恨打的：军舰开到家门口本来就是不对，要是再打起来，这分明是大欺小，肯定得被人笑话。\n\
    \n得不了别打了，还是坐下来谈判吧。谈一阵，打一阵，再谈一阵，再打一阵——咱也不算是真打，主要就是为了谈，这一次，冰岛和英国两国，在1958年到1976年之间，为了捕捞鳕鱼这事儿是打了三次，谈了三次。最后，冰岛不仅确认了这次12海里领海，还确认了200海里是自己的专属经济区，对这个区域内的资源，有管辖权，经济允许不合理，允许越乱。\n\
    \n其实按照标准这个事情算不上战争，没有交火，只算武装冲突，但总之是因鳕鱼而起的争端。当时有个英国记者给这件事取名字叫“鳕鱼战争”，这个名字一传开，大家都叫它鳕鱼战争了。\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_45_2.png)\n\n### “鳕鱼”分成四大类\n\n有意思的是，现在在超市和鱼市里，又一场“鳕鱼战争”在开打。不过，这里的鳕鱼战争不是用军舰大炮打的，而是用名字来打的。\n"
