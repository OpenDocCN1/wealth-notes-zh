    分类学·动物 | 长江里也会有海豚吗？


    +   1. 长江里生活着两种海豚：白鱀豚和江豚。但是江豚不属于淡水豚，它主要生活在海里，被称为露脊鼠海豚；

    2. 加州湾鼠海豚很可能会成为继白鱀豚之后第二种因为人类活动而灭绝的海豚。它在1958年才被发现，但自1997年以来，数量一直在快速下降，最近一次调查显示，仅剩30多头；

    3. 名贵食材"花胶"是大型鱼类的鱼鳔。其中最名贵的金钱胶来自黄唇鱼。黄唇鱼濒危之后，商人们开始用它近亲加州湾石首鱼的鱼鳔来替代金钱胶。这之后，加州湾石首鱼也成了濒危物种。

    4. 捕捞加州湾石首鱼需要使用特殊的流刺网。跟这种鱼体形相似的加州湾鼠海豚很容易陷入这种渔网而死亡，这是目前对加州湾鼠海豚生存最大的威胁。


    > 加州湾鼠海豚：加州湾鼠海豚在1958年才被发现，自1997年开始，数量快速下降，如今仅剩30多头。原因是它跟加州湾石首鱼个头相当，人类在用特制的网捕捞石首鱼时误伤了它。


