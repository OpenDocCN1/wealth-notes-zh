  - "[PAGE 7]\n\n# 生理学动物 | 放屁会影响全球气候吗？\n\n世界好大，奇妙的事情每天都有，我们一起去发现吧！\n\n生理学动物 | 放屁会影响全...\n\
    \n徐来\n\n今天来专栏文章的标题有点奇怪的是吧。\n\n我在文化上，会对那些看起来没有污秽的东西产生排斥，所以“放屁”这个词有的时候，会指用来骂人。不过，骂人可不是好孩子。在这里，我说的“放屁”肯定不是它的字面意义，一种生理现象。\n\
    \n虽然在各种文化当中，它都被认为是个不太好的东西，或者容易溅到脏东西，但其实放屁的是一种再正常不过的生理现象了。从某种意义上来说，屁，还是一种非常重要的东西，并且在某些时候有举足轻重的地位。这到底是怎么回事呢？今天，我来给它说一说这个屁。\n\
    \n# 屁到底是怎么回事？\n\n如果屁有意识的，它一定会觉得自己很无辜。因为人们总是会拿它来记一些奇怪的事情，比如，人们觉得屁是看不见摸不到，而且还带有臭味的，所以常常用来形容某个事情不好，或者“根本不存在”。\n\
    \n那么，屁到底是怎么来的呢？其实，屁的来源分两种情况：\n\n第一种，是被直接吃进肚子里的空气。在我们咀嚼食物的时候，嘴里会含有一些气体，会跟着食物被吸进下咽的肠胃。如果不能及时把气排掉，我们的肠胃可能会造成气体溢出，打嗝；有些，会从消化系统的末端出来，这时我们就打屁。\n\
    \n第二种是，我们吃下去的食物经过嘴巴的咀嚼，进入肠胃里，和消化液搅拌均匀，会变成可被吸收的东西，然后再进入小肠把营养吸收掉，在进入大肠再吸收一些水分，最后再把残渣排出体外。而大肠里面，会生活着很多细菌，比如大肠杆菌，听名字知道很多，它主要生活在肠里面。消化后剩下的食物残渣，对它们这类细菌来说已经没有太大的用处了，但对细菌来说，这是很大的营养物质。细菌分解食物残渣过程中这些细菌，让它们能够分解食物残渣过程中产生大量的气体，屁的主体就是这样产生。\n\
    \n# 屁为什么会有臭气？\n\n那么屁为什么会常常带有臭臭的呢？其实道理很简单，在细菌分解食物残渣的时候，会产生各种各样的气体。这些气体有的是无臭无味的。它们的存在让屁闻起来也是臭臭的。\n\
    \n不过，我想你注意到了，有的时候，屁的味道跟我们吃的食物有很大的关系。比如你说，如果一次吃食很多臭豆子，那么屁的气味会变得更有点特别，我们有的时候会管这种气体叫“毒屁”。还有洋葱、大蒜、大蒜一类含有特殊气味的蔬菜，也有可能影响屁的气味。\n\
    \n更重要的，如果我们吃多了肉和、豆子以及豆制品这样的富含蛋白质的食物，那么屁就会显臭显臭。因为，蛋白质当中含有硫这种元素。这些富含蛋白质的食物残渣进入大肠后会被细菌分解，会形成很多含有硫元素的化合物。这样的化合物往往是很臭的—它们甚至可以被称为是“臭屁”的元凶了！\
    \ \n\n好，既然我们已经知道了屁是怎么产生的，又找出了让它变臭的元凶，那会有什么办法可以让屁减少，或者至少不那么臭呢？\n\n知道它是这么回事，那么有针对性地改变也就有那么一点儿可能性的。\n\
    \n比如啊，我们知道薯类蔬菜是会增加屁的，像红薯、土豆或者萝卜，除此之外的其它蔬菜，方便其青菜，就可以减少屁的产生。一方面它会让肠胃蠕动变好，减少细菌接触食物残渣的时间，另一方面，它含有的营养物质蛋白质也不易发酵产生臭味。所以，如果想减少屁量，可以多吃蔬菜；\n\
    \n再比如说肉类，肉里面含有很丰富的蛋白质，我们知道它多了吃屁味会更臭，所以，如果可以减少它的，就也让屁变得不那么臭。当然吃肉可以还是应该吃的，我的意思是不能为了吸减少而吃肉，可以多吃蔬菜；\n\
    \n# 屁为什么会影响全球气候？\n\n虽然屁算是很有意思的一个东西，但它确实让人类造成了一些麻烦，这个麻烦就是当今世界最重要的话题之一：全球气候变化。\n\
    \n你一定听说过全球气候变化这件事。简单来说，因为人类的活动额外排放了一些气体，这些气体会让地球变得热一些。虽然这个温度的变化，平均到某个地点，在某一个时间，具体的某一个小地点，产生的影响就会很难预料。科学家们普遍认为，世界上渐渐的极端天气，比如说洪水、冰雹、台风、干旱等等，都跟这种平均温度的一点上升有关。\n\
    \n极端天气肯定不是好事情。所以，大家就开始盘算，到底是哪哪些因素导致了这个结果。研究发现，主要是人类活动排放的一些气体。而这些气体主要来源于人类燃烧煤炭、石油这样的燃料有关，这些燃料在燃烧后气体会产生二氧化碳。二氧化碳气体在大气中就像是“一床被子”一样，把地球捂住了，让地球的温度升高了。\n\
    \n后来，科学家发现，在排掉的气体中，不只是二氧化碳一种，牛羊这一类动物的屁里，也有气体，叫甲烷。而且每一份甲烷对地球的保温能力比二氧化碳高几十倍，同样甲烷的总量要少很多，不如二氧化碳后果更严重，但即便如此也不能忽略它。\n\
    \n按理说，牛羊虽然放屁，可一只牛、一只羊里面的甲烷量竞没那么多。但牛，糟糕的是，牛养的数量真的不少，地球上现存大约15亿头牛，和18亿头羊，每一吨都比较中国的人口还多。\
    \ 羊虽小，但牛就大，现代育的牛都是特别大的牛，一头牛的重量比几十个人，里边的多牛羊，每天都吃大量草，肚子里面的甲烷也是很多了。再加上它们的打嗝和粪便分解释过，也能产生大量甲烷。\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_7_0.png)\n\n> —博物学家养成记—\n\n现在有很多科学家，正在积极研究牛羊的这个放屁问题。因为它们的甲烷都在牛羊的肠道里，细菌会释放出。所以，有科学家希望通过改造这些细菌来解决甲烷排放的问题。\n\
    \n你觉得还有什么方法可以减少牛羊排出甲烷所造成的问题呢？不妨在评论区说说，给科学家们一些启发！ \n\n+   1. 屁的来源有两个，一个是吞咽的时候进肚子里的空气，其中一部分会以屁的形式排出体外，二是大肠中的各种细菌对进入大肠的食物残渣进行发酵，会在发酵过程中产生的气体；\n\
    \n+   2. 有些屁之所以会有臭味，是因为含有大量含硫的物质，比如肉类和豆制品，其中含有很多硫元素，含硫的蛋白质被分解之后产生硫化氢气体。\n\n+ \
    \  3. 反刍动物之后牛和羊，它们的屁会含有甲烷。这个甲烷，每份产生的温室效应比二氧化碳大20多倍。科学家希望通过改造它们的肠道细菌来解决全球变暖的问题。\n\
    \n注：消化系统气体和胃胀气、胃胀气紧张；推动消化道蠕动排出的气体，有研究指出，牛羊等反刍动物放屁所产生的甲烷可能导致全球变暖。"
