    \n世界之大无奇不有。奇妙的事情每天都发生。一起发现吧！\n\n分类学·动物 | 什么鱼能引发... \n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_45_1.png)\n\
    \n徐来\n\n咱们这个专栏，前面说的内容多一直都很科学，说点儿实验室的事儿啊，说点儿科研机构的的事儿啊。今天咱们说点儿武戏，咱们从战争说起。人类历史上，有过很多很多的战争，多得多算不过来。但是有一场战争很特别，特别在哪儿呢？交战的两个国家，一个国家是老牌的军事强国，人口好几十万，另一个国家呢，刚成立没多久，总共不过30万人口——30个话就占一市辖区的这个地方北京的一个区，咱们中国的，这个朝阳区的人口都有接近400万了。\n\
    \n那么一个国家，怎么可能跟那么大的一个国家打得起来了呢？怎么就说这场战争跟一种鱼有关系呢？咱们今天就从这个军事强国讲起。\n\n# 冰岛为什么要跳英国？\n\
    \n这个军事强国，就是英国。而那个小国，是冰岛。冰岛是谁啊？你或许没有听说过，这是一个欧洲国家，位置非常靠北，是世界上最北极附近的国家之一。人口很少，地方也很小，就一个小岛。当时，冰岛才独立没多久，可想而知，它有多弱。\n\
    \n冰岛是一个岛，在它周围的海域里，有一种罕见——鳕鱼。我总觉着鳕鱼是个宝贝，你可别误会，别觉得鳕鱼是特别珍稀的鱼类。并不是，鳕鱼只是一种相对来说比较常见的鳕鱼，在澳洲和北美洲，鳕鱼是大家都经常会吃到的鱼。这种鱼，肉质非常细腻，个头相当大，数量又多，所以很受欢迎。还有一种更夸张的说法：欧洲的渔民打鱼，甚至要撞到才特别爱吃的鳕鱼鳍，甚至可以直接从船上跳下去，踩在鳕鱼的鳍上往外抓。\n\
    \n所以，欧洲的人们经常都会有美味的鳕鱼吃，如果吃得太多了吃不完，就用盐腌起来，或者风干，做成鳕鱼干，方便长期保存。\n\n当然，因为人类的捕捞，它们的数量下降得很快。所以呢，现在大量捕捞这个鳕鱼，还是比较注重的，说，不能全都打完，让我们的后代没有鳕鱼吃，你说是不是。\n\
    \n但刚一开，大家没有注意到这个问题，只是觉得，唉，海门儿，自己经常驾着渔船去的那些个海域里，怎么鳕鱼越来越少。\n\n越来越怎么办呢？那就往鳕鱼多的地方去啊。欧洲的渔民，尤其是欧洲北部的渔民开始到处找鳕鱼，有点儿像，北去找，大家就发现冰岛是个宝地了，我刚才才是说了吗，渔民都往冰岛周围扎营。这些渔民当中呢，是英国的渔民觉得最打他们来得最近，呼啦啦地，全跑冰岛去抓鱼了。\n\
    \n英国渔民往冰岛一聚集，冰岛人慌了：好家伙，你们自己家门口打鱼打完了，还来找我家啊，这也太没道理了。更重要的是，冰岛太靠北方，天气太冷了，所以农业不太容易发展，工业也不很，就靠打渔，这是是被英国人给抢了就活不下去了。所以，冰岛政府就沿着岛屿往外画了12海里，画了一个圈，说这12海里的海，是我们的领海，相当于我国的延伸，你们谁都不许进来。\n\
    \n其他国家呢乖乖地退出了这个12海里范围。但英国的渔船大，别的例如也在捕鱼呢，英国海军还派出了几十条军舰，保护自家的渔船。可冰岛也是拼下心来要保护自己的利益了，为了几条英国的船，装上一大炮也开出来了，抗战英国渔船打完了，试图擦擦英国渔民，甚至偶尔对渔船开几枪，同时又出示鱼，英国人呢，虽然不敢就在人家家门口，但心里也恨打的：军舰开到家门口本来就是不对，要是再打起来，这分明是大欺小，肯定得被人笑话。\n\
    \n得不了别打了，还是坐下来谈判吧。谈一阵，打一阵，再谈一阵，再打一阵——咱也不算是真打，主要就是为了谈，这一次，冰岛和英国两国，在1958年到1976年之间，为了捕捞鳕鱼这事儿是打了三次，谈了三次。最后，冰岛不仅确认了这次12海里领海，还确认了200海里是自己的专属经济区，对这个区域内的资源，有管辖权，经济允许不合理，允许越乱。\n\
    \n其实按照标准这个事情算不上战争，没有交火，只算武装冲突，但总之是因鳕鱼而起的争端。当时有个英国记者给这件事取名字叫“鳕鱼战争”，这个名字一传开，大家都叫它鳕鱼战争了。\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_45_2.png)\n\n# “鳕鱼”分成四大类\n\n有意思的是，现在在超市和鱼市里，又一场“鳕鱼战争”在开打。不过，这里的鳕鱼战争不是用军舰大炮打的，而是用名字来打的。"
  md: "\n## 彩蛋丨一只再也不能回家的蛙\n\n徐来\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_40_0.png)\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_40_1.png)\n\n最近有一款游戏很火爆，名字叫“旅行青蛙”，它有一个极简的游戏场景，一只萌萌的小蛙，小蛙喜欢看書，也喜欢旅行，还会给你寄旅行中拍的明信片。这款游戏被很多人追捧，人们对蛙的关注也是前所未有。\n\
    \n所以，今天为你放送一篇彩蛋，给你讲讲自然界中真实存在过的“一只”再也不能回家的蛙。\n\n一只再也不能回家... \n\n曼狄卡的蛙再也不会回来了。\n\
    \n当然。他知道这一天终将来临。他的六岁外孙也终于知道什么是“孤独”、什么是“坚强”——因为它是最后一只。它离去的那一天，意味着一个漫长故事的永久落幕。\n\
    \n这一天在2016年9月26日到来。世界上最后一只巴拿马树蛙，终于也没能回到它的家乡。\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_40_2.png)\n\
    \n2005年，一队研究者前往中美洲，试图在一种致命病毒蔓延到无可挽回之前尽可能多抢救一些幸存者。他们发现了Toughie，把它带回美国，由亚特兰大植物园的研究者马克·曼狄卡负责抚养。2008年，科学家确认它属于一个新物种——巴拿马树蛙（Ecnomiophyla\
    \ raborum），第二年IUCN红名册将它列入“极危”。这时，它的原种群已经彻底崩溃。\n\n凶手是一种真菌——蛙壶菌（Batrachochytrium\
    \ dendrobatidis），常缩写成Bd。人们还不确定蛙壶菌为什么突然在巴拿马出现，但很可能是因为非洲爪蟾贸易而传播到这里来的。此刻，它是整个地球上速度最快的单一灭绝事件。\n\
    \n这种真菌感染大部分两栖类物种，在体表生长，以菌丝刺穿皮肤获取养分；被感染皮肤则会彻底增生，阻断和外界的盐分交流。在非洲，蛙类已经和它共存了很久；但在中美和南美，两栖类动物从未遭遇过这样的病菌，往往毫无抵抗力。一旦蛙肤表面被壶菌盖满，就会因为无法调节渗透压，心脏停跳而死。在某些物种里，壶菌病死率接近100%。\n\
    \n它刚刚被我发现时，没有一个人意识到它拥有摧毁整个物种的能力，没有一个人意识到灭绝可以来得如此残暴如此迅猛。但是这个场景对人类而言本不该陌生：毕竟五百年前，欧洲人就是这样携带着病原体抵达新大陆，杀死了90%以上的原住民人口。而巴拿马树蛙，成了这场灾难的最新牺牲品。\n\
    \n倘若Toughie还在家乡正常生活的话，此刻它也许正展开有膜的小爪，从树冠上一跃而下，滑翔几十米落地。它大概会觉得自己在飞——但亚特兰大植物园的隔离室里没有飞翔的空间。\n\
    \n或者它也许正在照料自己的后代，巴拿马树蛙是父亲负责养大孩子——但人类所知的最后一只雌性已经在2009年死去。\n\n哪怕已经到了灭绝的边缘，人们也对这些物种所知甚少。很多年里人们甚至不知道它叫声如何；上一次有记录的鸣叫也是2007年，没有录音，唯一听过的人也无法描述这个声音。\n\
    \n直到2014年底，垂垂老矣的Toughie突然开始歌唱。这时，距离它最终离世只剩下不到两年。也许它终于明白，这将是世界上孤独的蛙鸣，而它已经是世界上孤独的蛙。\n\
    \n现在，它走了。\n\n但还有几个和它同一批被抢救回来的物种正在隔离室里等待着。我们还能努力为它们实现人工繁殖，甚至找到对抗蛙壶菌的办法。无数两栖类研究者正在这个领域奋斗，也许有一天我们终能够夺回失地，让它们的后代再归世世代代生活的中美洲雨林，重新繁衍生气。\n\
    \n毕竟，我们所盼望的，不过是一只蛙的归来而已。\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_40_3.png)\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_40_4.png)\n\n留言精选\n\n提交留言可与专栏作者互动\n\
    \n## 问答｜发奖｜细菌为什么不吃塑料？\n\n徐来\n\n你好，我是徐来，欢迎你来学习我的专栏。这四天北京的天气可真冷。刚刚过去的周四应该是入冬以来最冷的一周了。不过，虽然是北京，但北京一直没怎么下雪。反倒是南方很多城市都下雪了。你们今年有没有机会看雪景，推雪人呢？\n\
    \n当然，下雪也会给交通带来了一些麻烦。或许大家也受到了影响出门旅行的计划。这也确实是会给我们日常生活带来很多麻烦之一。\n\n今天回答选题环节里的第一个问题恰好是和雪有关的。\n\
    \n风是怎么来的？雪是怎么来的？它俩有关系吗？\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_41_0.png)\n\
    \n徐来\n\n关于风是怎么来的，我在前面的专栏里讲到过，其实就是空气快速流动形成的。像是我们国家冬天北方地区会有大风，主要是因为从中亚到西伯利亚一带地方会形成冷空气，然后一路南下，这个南下的过程，就是大风一直往南吹。\n\
    \n下雪，是因为空气中的水汽比较多，温度低的话，水汽就会凝结成小水滴，再冷一点，小水滴就会凝结成小冰晶，这就是雪了。\n\n一般情况下，下雪的过程是这样的，冷空气南下，和南方比较暖的空气相遇了，把暖空气中丰富的水汽变成了雪，掉了下来。然后随着冷空气不断加温，战胜了暖空气，继续快速移动，就带来了大风。所以啊，下雪的时候一般风不大，雪停了才会刮大风。但如果这个过程被压缩到很短的时间里，就会出现风雪交加的情况，乃至暴风雪。\n\
    \n为什么海马是爸爸生孩子？\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_41_1.png)\n\n徐来\n\n\
