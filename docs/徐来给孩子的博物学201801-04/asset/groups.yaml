    你可能会觉得，细胞复制自己，不是挺好的嘛。其实一点都不好。


    首先，人体的细胞发挥正常功能，需要很多细胞分工合作，听从调控指挥，如果一个细胞不管不顾开始自己分裂，那它的正常功能就发挥不了。


