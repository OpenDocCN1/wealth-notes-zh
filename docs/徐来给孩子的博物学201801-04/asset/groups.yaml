    ## 分类学·动物| 长江里也会有海豚吗？


    世界好大，奇妙的事情每天都有，我们一起去发现吧！


    +   分类学·动物 | 长江里也会有…


    在咱们专栏里，我给你讲过不少鲜的故事。我们讲过抹香鲸，讲过大蓝鲸，讲过鲸的须鲸，也说到过世界上最大的蓝鲸。今天要讲的是海兽，不过，不是你 所想的那个庞然大物的鲸，而是个子比
    较小的豚。


    鲸这一类动物，大概分成两个群体。一个群体体型非常大，它们的嘴里都不长牙齿，而是长着非常密集的像筛子一样的 嘴毛外唇，嘴唇上长胡子，而且在嘴齿里多长着小齿，叫须鲸。它们吃东西绝
    大多数都是小鱼小虾，唱一大口吃，然后 靠着胡须把水过滤，就能吃掉那一份份。 因为有须毛，所以这一类被称为须鲸。


    不过，我们今天所要说的不是须鲸，而是 另一类——齿鲸。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_106_0.png)


    ### 白鲸豚还是白鳍豚？


    齿鲸，顾名思义就是长着牙齿的鲸。牙齿 不能拿来吃水草，所以它们没有吃小兽海 小水母过日子，而是靠捕杀比较大多海 鱼来进食。有些吃鱼，有些吃大型鱿鱼， 有些爱吃虾，有些，有些甚至要捕杀其
    种类的鲸。


    齿鲸里面，有的个头很大，抹香鲸就是 种大型齿鲸。但是齿鲸也有齿，个头对 来说比较小，比如说各种海豚——没错， 海豚就是鲸里面的一类。


    海豚，听你名字就知道，主要是生活在海 里的。不过，这一类动物当中也有些生活 在海里，而只生活在江河里。这样的豚 有四种，南美洲和亚洲各有两种。南美洲 的两种分别生活在亚马孙河和拉普拉塔河
    中，叫亚马孙河豚和拉普拉塔河豚；亚洲 的两种分别生活在恒河和长江里，恒河 叫恒河豚，长江中那个叫白鳍（）豚。


    白鳍豚的白字取得好妙。很多人都 错写成这个动物的名字去。在小说中， 们总是把这个动物的名字写成“白鳍 豚”。鳍是鱼鳍的鳍，水生动物嘛，用 鱼的鳍好像也是很好理解的事情。
    问题是，白鳍豚并不是说只有鳍是 的，它浑身上下颜色都像白花花。


    现在大家都知道了，别说写白鳍，连说颜色， 都不是了。其实，白鳍豚的白是 白鳍豚的种族。那是古时候中国人 的最早的名字。在汉代的词典中就已经 这个字了。字就是用来描述白鳍豚这种
    动物名。我不知道这是一种什么鱼， 它是来动物，以为是鱼呢？所以 这个字下面是个鱼。


    不过，因为在大多数字典里，都没有收入 这个字，所以动物学家们一致给写成了 鳍的鳍，很多人就这样以讹传讹了下来。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_106_1.png)


    ### 谁杀死了白鳍豚？


    不过，我们现在已绝看不到白鳍豚了。白 鳍豚已经能灭绝了，功能性灭绝的意味 是有些动物因其生存环境被破坏，数量非 常稀少，以至于在自然状态下基本丧失了 继续繁殖的能力，甚至丧失了维持生存的
    能力。


    咱们现在说物种灭绝，尤其是体形比较 大的动物类，几乎都是人的第一责任。人 类破坏，甚至是过多的食物，导致它们 的灭绝。你可以说在得白鳍豚也是这 样，被人们捕捉到灭绝的程度的吧。
    不过，实际情形却不太这样。


    白鳍豚的颜色比较浅，漂在江水里远远地 看是白白的，渔民都管它叫江猪——白鳍 豚都是比较老实啊，水色，渔民会 觉得这是一个比较吉利的颜色，江猪的 时候，白鳍豚就预示着它自己有好运气，
    也会捕杀它，害怕因此而破坏了好运气。


    你可能就感觉奇怪了，没有人去杀白鳍豚， 为什么白鳍豚也还是灭绝了呢？


    实际上，影响动物作为一个种群而存在的 因素，可以是人类的捕杀，也可以是它 赖以生存的环境被破坏——后面那种情况， 比前面那种的影响更要大一些。


    就拿白鳍豚来说吧，渔民们几乎不主动 猎杀白鳍豚，看起来似乎不会影响到它们 的生存。但是，人们还是在长江里做到很多 其他的事情。比如说，人们要在长江里打 渔。人爱吃鱼，白鳍豚也要吃鱼。原本
    江里有那么多鱼，但是它们吃的鱼， 减少了。渐渐地，渔民们在长江里就 打不到多少鱼了。渔民了，白鳍豚的食物 也不够了。更严重的是，捕鱼的行为会 伤害白鳍豚，拖网经常会给白鳍豚最
    终导致它们死亡。


    此外，作为一种哺乳动物，白鳍豚是需要 常常浮出水面来呼吸的。但长江上向来 往的种种活动给它们带来了很大的风险。一 旦被轮船的螺旋桨打中，即使不死也会受 非常严重的伤害。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_106_2.png)


    ### 最后的“淇淇”


    更命的是，我们对白鳍豚了解得很少。 水生的动物藏在水里，科学家很难观察到 它。人类调查江的白鳍豚也没有几个，其 中就有名的“淇淇”。淇淇是三年前一头 他，起这个名字很容易的一个原因是
    当时人们还管这种动物叫白鳍猪——那是 38年前，也就是1980年被渔民捕捉到， 并且送给研究机构的。


    通过饲养和接触淇淇，科学家们终于可以 近距离观察白鳍豚了，了解了它的习性。淇淇 的存在给我们留下了很多宝贵的记录。不 过，随着淇淇的年龄一点点变大，科学家
    们开始考虑另外另一件事：得想办法让淇淇 找个伴。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_106_3.png)


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_106_4.png)


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_106_5.png)


    你别看淇淇名字有点像是小姑娘，但其实 它是雄性。当时，长江里还能见到些白鳍


    它是雄性。当时，长江里还能见到些白鱀豚，所以科学家设法捕捉了一头雌性白鱀豚，起名叫“珍珍”。淇淇和珍珍，一开始还挺陌生的，慢慢地就熟悉起来，感情也不错。只不过珍珍年纪太小，还没到可以结婚的时候——它俩的婚事就先耽搁了。可谁知道，真的就像俗话说，天有不测风云，珍珍突然得了重病死了。


    后来，科学家又尝试着给淇淇找女朋友，但也都失败了。再往后呢，长江里白鱀豚越来越罕见，别说女朋友了，连找个同伴都已经不可能。晚年的淇淇得了很多病，也很孤独。2002年7月14日早上8点多，工作人员走进淇淇所在的房间时，发现它沉在池底，已经永远地停止了呼吸。


    淇淇去世之后，人们为了纪念它，把它的形象放在了“中国水生野生动物保护”的标志之后，科学家们又组织过一些考察，但都没有发现白鱀豚还存在的确切证据。现在，科学家们认为白鱀豚已经处于功能性灭绝的状态。功能性灭绝的意思是，现在尚不能确认这个物种已经灭绝，但即使在某处还有个休存在，它们的数量也太少，难以发挥生态功能也难以逃脱近亲繁殖。


    ![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_107_0.png)


    ### 博物学家养成记


    除了白鱀豚之外，长江里还生活着另外一种鲸类。你知道另一种鲸叫什么名字吗，它和白鱀豚有什么不同呢？你可以去网上找找资料，去了解一番。


    如果你觉得今天的内容很有趣，我猜你也应该喜欢下面这些文章，点击文章标题，可以直接跳转阅读：

    分类学 动物 | 你知道“水中大熊猫”是谁吗？

    行为学 动物 | 半路为什么会长个座头鲸？

    生态学 动物 | 脑去哪里上课了？

    生态学 动物 | 你追过鲸吗？


    - 1. 鲸分成须鲸和齿鲸两大类。齿鲸中的一些物种生活在淡水河流里，被称为淡水豚。现在淡水豚一共有四种，两种生活在南美洲，两种生活在亚洲。其中生活在长江里的，叫白鱀豚；

    - 2. 白鱀豚曾经长期被称为白鳍豚。这是一个错误的名字。鬣是古人对白鱀豚的称呼，这个字比较难写，也不太常用，所以讹传讹地被错当成了鳍；

    - 3. 白鱀豚灭绝的原因是人类的活动。虽然渔民很少主动猎杀白鱀豚，但人类活动导致长江野生鱼类减少，白鱀豚食物匮乏，人类捕鱼活动误杀白鱀豚，以及船只误伤导致白鱀豚数量下降；

    - 4. 淇淇是人工饲养条件下活得最久的一头白鱀豚。这是一头雄性白鱀豚，科学家曾经试图为之寻找配偶进行繁殖，但是都失败了。淇淇死于2002年。


    > 白鱀豚：一种生活在长江里的齿鲸，白鱀豚已被认定为功能性灭绝，原因是人类的活动。虽然渔民很少主动猎杀白鱀豚，但人类活动导致长江野生鱼类减少，白鱀豚食物匮乏，导致白鱀豚数量下降。


