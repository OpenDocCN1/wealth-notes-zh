    \ 265 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n\n## 生理学·植物 | 为什么说树活一张皮？\n\n世界好大，奇妙的事情每天都有，我们一起去看看吧！\n\
    \n生理学·植物 | 为什么说树活一张皮？\n\n徐来\n\n我年轻的时候，曾经在江苏扬州住过一段时间，扬州是一座很古老的城市。大概在2500年前这里就已经有城市了，这座城市的位置非常好，交通便利，物产也很丰富，所以，在古的时候，每期每代，这里都是重要的商业中心，是以繁华著称的，这座城市有非常多的古迹，也会有很多好玩的景点。如果有朋友来到扬州较多，我通常会先带他去一个比较奇特的地方，这个地方，有一个传说——我今天就再跟你说说这个传说，以及它背后的故事。\n\
    \n### 扬州城里的“大槐安国”\n\n对大多数游客来说，乾隆巷最出名的是“八怪纪念馆”，不过，我带朋友们来到这个地方，主要目的并不是为了参观“八怪纪念馆”，看那些著名画家的作品和生平事迹。我们的着点，其实是在“八怪纪念馆”的门外。\n\
    \n在八怪纪念馆的民宅旁边，有一处小花圃，原先只是简单的绿地，现在也装上了漂亮的石栏杆，放了几石头桌子石头椅子，供小息。在小花园的一侧，则是一颗很大的槐树。\n\
    \n这才是我带朋友们来参观的东西——它可不是一棵普通的槐树，而是别有玄机的，据我了解，扬州的专家，判断，这棵老槐树是唐代种下的一棵老槐树，换句话说，这棵树到现在，已经至少有1200岁了！\n\
    \n树木的寿命要比动物的寿命长得多。假设，1000岁的树，也算不上太古老。要知道，现在世界上活着的树龄超过2000年的树也有不少，里面多是合欢树里的“阿山神木群”，里面很多红杉，树龄都超过了2000年，而在美国还有现存的裸果松树，树龄超过了5000年。这还只是单一的树，我之前跟你讲过，植物可以进行无性生殖，它们可进行克隆。在美国有一群鹅枥，依靠着这种方式，至少活了8千万年。\n\
    \n虽然这棵槐树按年龄来说，说不上是一数二的，但它却拥有一个传说。这里的传奇，不是指我们在一般的传说故事，而是一个特定的术语，是唐宋传奇的一种小说体裁，一般指用文言写作的短篇小说。唐代有《当，出过很多的著名篇目。其中有一篇叫《南中太守传》，大槐的意思就是，有人在槐树下午休时做梦，梦见自己进入了大槐安国，迎娶了公主，当上了南迁地方的地方官，不久之后，不过是大槐上的一窝蚂蚁罢了，而南中也只是槐树树蔭的一根枝桠。\n\
    \n这篇《南中太守传》是作者李公佐曾经长期在扬州为官，这篇作品的写作出也可能是扬州。从某种意义上来说，那棵槐树或许是扬州李公佐笔下的大槐安国吧。\n\n###\
    \ 大树里面有君子\n\n你有没有去看这棵大槐安国，只发现一个很有趣的情况。这棵树虽然很大，但是树心儿却是空的。只剩下外围的外壁，一圈儿插在那里，而另一边全都在外壁，一个门洞似的，看起来就像是一间大树做的小房子一样。\n\
    \n说来也奇怪，虽然树心已经没有了，但这棵大树依然活着，树苗部位也是枝繁叶茂的，到了生长季节，也能造出好大一片树荫来。\n\n可是问题来了，这棵槐树的树心明显已经烂掉了，难道树心烂掉了，树还能继续活起来，这就要从植物底层是怎么东西说起起。\n\
    \n我们平时所看到的植物，绝大多数，它们的体内都有一种叫做血管的组织，你可以把血管想象成一根根细细的小管子，它们一头扎在植物的根里，把头养分从地中抽取出来，另一头，连着头顶上的叶子。\n\
    \n我在“到底可以长多高”那篇文章里，曾经跟你说过这个结构的作用。借助这些小管子，通过毛细作用和蒸腾作用，水和小分子就可以被源源不断输送到植物的全身，从这个意义上说，这些管道结构就是植物的血管。\n\
    \n就像咱们人类的血管，动脉和静脉两种一样，植物的维管结构分成两部分，一部分叫木质部，一部分叫韧皮部。木质部分你有名字知道，它是树里面，所以说树木有点儿关系，而韧皮部则跟皮的名字一样，也就是树皮的部分。\n\
    \n这两个部分，各自的工作不太一样，木质部主要负责输送水分和矿物质，而韧皮部，主要运输的是营养物，比如淀粉等。\n\n你可以为，这些维管组织跟我们人类的血管一样，用就是几十年，而维管组织可是不一般，苹果刚来水果来，苹果树身上的韧皮部器官，能够不超过3年，而木质部的导管，也就是用1年多的样子。\n\
    \n好在，在木质部和韧皮部之间，还有一个形成层。它从中间那小层细胞开始，往两边生长，接着索质的，就形成新的韧皮部，接着韧皮部的，就形成新的木质部。这样一来，树木也就有了源源不断的新血管可以用了。\n\
    \n### 为什么说树活一张皮\n\n新血管是有，可是，那些被废弃的老血管怎么办呢？韧皮部情况好办，因为它们总是树皮的一部分，有的植物就会让皮慢慢往外长，变得越来越厚，有些，干燥会坏掉的老韧皮部会直接被掉，有一些则会全到到树皮的外层，比如樟树，那些掉下来的，就是被废弃的韧皮部。\n\
    \n相比之下，木质部就比较麻烦了。因为它是最里面的，一旦里面的部分失效后，那些旧的木质部就永远运不出来，只能就那样留在里面，与此同时，那些空隙的管道会被侧根之类的物质填满，这样，这些管道变成会变得更加坚硬的木纤维，这就是为什么树木中心的材料，要比外面一些材料更加，更好用的缘故。\n\
    \n听到这里，你应当明白吧。如果一棵树被动物啃食，生虫或者被其他什么外力，树心会全被掏空了，那么，它失去的只是最里层的已经死去活死的木质部导管而已。这些分区的流失，实际上并不会影响到树木的生存，因为实际上输送水分矿物质和营养物质的运输管道，只是靠近树皮的一那层一层而已。有时候我们说树活一张皮，原因也就在这里了。\n\
    \n——博物学家养成记\n\n如果有机会去扬州旅游，一定要记得去那棵老看看那棵或许是大槐安国的唐槐。记得，看到的是，它就跟同行的朋友们讲一讲，为什么一只剥最外面那一圈了，却依然还活着。\n\
    \n-   1. “传奇”除了指传奇故事，它还指唐宋时期的一种小说体裁，一般指用文言写作的短篇小说。唐朝作家张生所写的《南柯太守传》就是传奇的代表作品之一。\n\
    -   2. 维管组织是维管植物内有结构，它分为木质部和韧皮部，木质部有韧皮部，其中木质部的导管主要输送水分和矿质，而韧皮部除筛管输送糖分等营养物。\n-\
    \   3. 维管有使用年限，死之后，韧皮部会死或者死去的部分扔掉，而木质部只能继续在树干中工作起来。随后，这些空隙的管道会被侧根等物质填满，变得变得更加坚硬。而韧皮部是树皮的部分，老化的树皮会脱落，让树木可以保持呼吸。\n\
    \n维管结构：分成两部分——木质部和韧皮部。前者输送水分和矿物质，后者输送营养和糖分。树心朽烂掉的是木质部老旧的导管，而韧皮部还\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_2_0.png)\n\
    \n人人都是自然科学家\n\n## 语言学人类｜谁破解了罗塞塔石碑上的古代文字？\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_3_0.png)\n\
    \n前一阵，我在《群星为什么有尾巴》里提到了冯·哈曼的那个飞艇，名字叫做罗塞塔号。\n\n还记得我当时是怎么说罗塞塔号的吗？它实际上是考古学家破解一种失传的古代文字的工。科学家给它起这个名字，是用了一个比较新的手法，希望它能帮助人类破解太阳系的秘密。\n\
    \n那么，罗塞塔到底是个什么东西，它又是如何帮助考古学家破解古代文字的呢？今天，我就来给你说说罗塞塔的故事。\n\n### 什么是罗塞塔石碑\n\n罗塞塔其实是一座城市的名字。这座城市在埃及的北部，城市不大。18世纪末的时候，法国纳、拿大偶像的拿破仑带领军队进攻略，拿破仑很会打仗，当时他带着两万五千人的军队，和埃及的十万大军作战，只损失了300人，就取得了决定性的胜利。\n\
    \n这个拿破仑有点儿意思，他自己受教育的程度很高，在数学、天文学上的造诣是很高的。他知道埃及是个文明古国，预料到在这里会挖掘到很多有意思的东西。所以，他不仅带去了一支军队的军队，还带去了好多学者，一边儿打仗，一边儿还做点儿科学研究。\n\
    \n当时，驻扎在罗塞塔这个地方的人，是拿破仑手下的一个军官，名字叫做布夏特。为了防范埃及军队的反击，布夏特开始加固罗塞塔城外的要塞。士兵们挖地基的时候，挖到一块巨大的黑石头，一下子激动起来。\n\
    \n布夏特过去一看，喏，好大一块石头。高度超过一米，宽度呢一米不到，厚30公分，是黑色花岗岩材质，上面密密麻麻刻着稀奇古怪的文字。布夏特会有感觉了什么叫做埃及文字。布夏特一看，就刻有图画，阴着看是一块石碑的一部分。虽然看不出石碑上刻的是什么，但他知道这种和古埃及有关的报告给总领了自己的指挥部。而后者，则直接把石碑送到了拿破仑专门设立的埃及博物馆。因为这块石碑是在罗塞塔这个地方被发现的，所以大家都叫它罗塞塔石碑。\n\
    \n不过，拿破仑占领埃及没多久，英国人就开始过来了，直接给法国人给跑了。罗塞塔石碑又落到了英国人手里。英国人一看，这是好东西，就直接装船返回了伦敦。现在你去大英博物馆，在展示埃及文物的那个厅里，最重要的一件展品就是这块罗塞塔石碑。而法国人，只带走了石碑的拓片。\n\
    \n所谓的拓片，就是把纸张在石碑上淋湿，拍平，然后用墨里的小刷子去涂纸的表面，石碑上刻了字的部位会显进去，碰到墨水，就留出了白色的印记。\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_3_1.png)\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_3_2.png)\n\n### 物理学家读出了一个名字\n\n经过检查，学者们发现，罗塞塔石碑上有三种不同的文字。其中一种，是古代希腊文，这是当时的学者们了解的，他们就可以解读出其中的内容来。而另外两种，则是他们不认识的。\n\
    \n这两种中，一种看起来，都和古埃及人，通过拼音的方式来构成语言。这和古埃及，是普通人使用的文字。而另一种，看起来像像漫画一样，比如画个眼镜，画一个老鹰，画一个狮子。这种文字出现在古埃及人的很多寺庙和墓碑里，看起来似乎和祭祀活动多有关系。\n\
    \n其实，学者们早就知道这两种文字的存在了。但是他们始终无法读出其中的内容。现在，谁写明白，有下面两种古代希腊语的引导，破译上面两种古代埃及的文字，只是时间问题了。\n\
    \n全世界的学者们都开始赛跑，英国和法国的竞争尤其激烈。\n\n英国队派出的选手名叫托马斯·杨。这个杨先生很有派头，不只是个物理学家，还是一位物理学家。他的一些研究成果后来也影响到牛顿。从某种意义上说，爱因斯坦也曾受到过他的启发。\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_3_3.png)\n\n当然，英国人让托马斯·杨来研究罗塞塔石碑并非毫无道理。因为托马斯·杨本人也是一位语言天才，他可以讲10多种语言，对其他事情的涉猎也颇具兴趣，比如是最后一位百科全书式的学者。所以，如果要找一个人读古埃及文字，托马斯·杨，足够。不过，托马在破译这块石碑上的工作，成就有限。实际上，他只拼出了一个单词：托勒密。这是当时埃及国王的名字。\n\
    \n### 商博良大获全胜\n\n就在托马斯·杨对罗塞塔石碑努力工作的时，英德皇家学会收到了一封来自法国的信。是一个名叫商博良的17岁的年轻人写的。他想向皇家学会提一张图，以便更好一点的罗塞塔石碑拓片。\n\
    \n皇家学会吃了一惊，难道这个人也能破译罗塞塔石碑上的古埃及文字？皇家学会很快就联系了起来。不过，人家有礼貌地来拒绝，也不得不得回应对方。于是，一开始托马斯·杨给博商博良回信。一边教托马斯·杨，同时问他，一块罗塞塔石碑的拓片值多少？被一个小子给破解了，那岂不是太没面子了。\n\
    \n不幸的是，这么纠缠的一件事情，真的发生了。正当托马斯·杨继续保持优势的时候，商博良只用了几年时间，就完全破译了石碑上最上面那些看起来复杂而又好听古埃及文字——那一年也，又一家学者破解出来的普通民用的古埃及文，这让罗塞塔石碑上的内容，终于被完全解读了出来。\n\
    \n原来，这确实是一块与国王托勒密有关的石碑。它位于一个叫托勒密五世的国王。这位国王加勒比第一年一年的纪念。上面刻的，是托勒密五世立获的正当性，以及这位国王做的许多好事。\n\
    \n通过博良的工作，大家不但完整罗塞塔石碑的内容，而且还获得进一步了解古埃及各种国家、部落、城市、墓室铭文的可能性。\n\n埃及各种神庙、墓葬里图形文字的可能性。所以，大家都觉得商博良的工作很有意义。\n\
    \n### ——♦ 博物学家养成记 ♦——\n\n你呢，你有学习汉语之外的其他语言吗？喜欢学习什么语言呢？在留言区和大家分享一下你学习外语的心得吧。\n\n\
    宇宙学·彗星丨彗星为什么有尾巴？\n\n-   1. 拿破仑的军队入侵埃及的时候，一位军官在罗塞塔这个地方修建工事的时候，发现了罗塞塔石碑。后来，英国人打败了法国人，这块石碑被送进了大英博物馆，成为这里的镇馆之宝；\n\
    -   2. 罗塞塔石碑上刻有三种文字：古埃及圣书体、古埃及世俗体和古希腊文。最终，英国物理学家托马斯杨和商博良共同破解了石碑上圣书体和世俗体的内容。原来这是托勒密五世国王加冕称王一周年的纪念物。\n\
    \n罗塞塔：一块制作于公元前196年，刻有古埃及法老托勒密五世诏书的石碑，且有三种语言版本，考古学家借此解读出失传千年的埃及象形文字意义与结构。\n\n今天是博物学陪伴我的第267天\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_4_0.png)\n\n人人该听的自然科学课\n\n徐来\n\n今天，是博物学陪伴你的第\
    \ 267 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n\n## 行为学动物｜两岸猿声为什么啼不住？\n\n世界好大，奇妙的事情每天都有，我们一起会发现吧！\n\
    \n你听过李白的《早发白帝城》吗？这首诗非常朗朗上口，几乎背得出来，读着读着，诗意就出来了：朝辞白帝彩云间，千里江陵一日还。两岸猿声啼不住，轻舟已过万重山。\n\
    \n这首诗是诗人站在长江边上所作，长江是诗人最熟悉的河流，所以他能将这首诗写得那么栩栩如生，读起来就特别有画面感，仿佛身临其境。\n\n那么，诗中的猿是指哪些动物呢？根据科学家的研究，长江流域曾经生活着一种叫长臂猿的动物，它们栖息在高大的乔木上，善于跳跃和悬挂，是典型的树栖猿类。\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_5_0.png)\n\n### 曾经分布到四川的长臂猿\n\n关于长臂猿分布的最有力的证据，就是一些化石和骨骼的出土。这些出土的标本分布范围广，从南到北，跨度达到7000公里。其中，最北的长臂猿骨骼化石是在四川省北部发现的。这说明，至少在数千年前，长臂猿在四川地区也有分布。\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_5_1.png)\n\n### 长臂猿的“语言”：跳跃和鸣叫\n\n\
    虽然长臂猿在长江的两岸都发现了它们的踪迹，但科学家的研究表明，诗中的“啼”很可能指的是长臂猿的鸣叫，而非人类的啼哭。长臂猿拥有非常发达的发声系统，它们可以通过跳跃和鸣叫来进行长距离的交流，这种行为在生物学上被称为“长臂猿合唱”。\n\
    \n据观察，长臂猿的合唱往往在清晨开始，此时是它们活动最频繁的时刻。它们会站在树冠层，用响亮的声音彼此呼应，有时会持续数小时。\n\n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_5_2.png)\n\
    \n### “哀鸣”到底是怎回事\n\n古人听到长臂猿的鸣叫，结合当时多愁善感的时代背景，往往会联想到离别的悲伤，因此用“哀”来形容它们的声音。而现代研究发现，长臂猿的叫声其实非常悦耳，有时甚至被形容为“森林里的交响乐”。\n\
    \n### 博物学家养成记\n\n玩耍或者照相的小猴子、小长臂猿或者小黑猩猩，碰到这样的情况，想一想我们今天的故事吧，不要和它们一起照相，因为人类对它们的消费和伤害可能是无法弥补的。\n\
    \n-   行为学·动物｜半路为什么会杀出个座头鲸？  \n-   行为学·动物｜动物真的会做祭祀吗？  \n-   行为学·动物｜浣熊为什么爱洗东西？ \
    \ \n-   行为学·动物｜行军蚁到底有多吓人？  \n-   行为学·动物｜鸟到底可以飞多久？\n\n-   1. 现在世界上共有18种长臂猿，其中7种在中国境内有分布记录。主要集中在西南地区和海南岛。其中，历史上的长江流域也曾经分布有长臂猿；\n\
    -   2. 长臂猿擅长跳跃和唱歌。唱歌还被作为长臂猿群体之间争斗的一种方式。除了争斗之外，也是彼此交流的一种沟通和娱乐方式。其次，长臂猿的情感也很丰富，需要人类的小心保护。\n\
    \n长臂猿：产于亚洲，无尾，手腕关节灵活，擅于作手臂渡越的动作，动作快速灵巧，有森林特技家的美誉。善长鸣叫，是争斗、沟通和娱乐的表现方式。\n\n今天是博物学陪伴我的第268天\n\
    \n![](img/a78d2f6ae4f22f8288ba71e0f6a7c79d_6_0.png)\n\n人人也该听的自然科学课\n\n徐来\n\n今天，是博物学陪伴你的第\
    \ 268 天，恭喜你，又收集了一个新知识！下一期我们继续研究。\n"
