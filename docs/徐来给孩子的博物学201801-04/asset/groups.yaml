    \n那么，水晶头盖到底是怎么发现的？\n\n实际上，水晶头的说法可以追溯到很久的时间。最早的水晶头记录，是一个法国人有关，他叫欧仁·博班，是一位考古学家，据古语言学家，这个人很小的时候就到墨西哥，后来加入一支考察队，到处搜刮古董，成了当时非常著名的古董商人。\n\
