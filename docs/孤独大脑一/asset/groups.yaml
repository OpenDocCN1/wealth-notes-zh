    ## 聪明有钱人怎么想？


    聪明人未必要有钱，有钱人未必要聪明，但有些家伙既有钱又聪明，而且运气也很好。


    既然如此，不妨从他们那里学点儿什么。


    最近黑石的苏世民在中国比较活跃，作为美国的聪明有钱人，他和中国的聪明有钱人的对话，有不少值得分享的观点和思想。


    黑石的另外一个创始人彼得森，也贡献过很多有趣的人生原则。


    以下均来自网络公开资料，大多出自新书《我的经验和教训》，以及苏世民与沈南鹏的对话。


    本人仅作学习整理，如无注明，主要是苏世民的想法。


    其中，我加入了一些自己的思考和点评。如果与大师生们的心意不符，请自行分辨。


    - 一、如何看待中国？加倍下注。

    - 二、疫情之后世界会怎样？世界总会复苏。

