    结果是：当年橄榄大获丰收，对橄榄油压榨机的需求大幅增加，他让压榨机所有者按照他开出的条件转租机器，从中大赚一笔。


    假如橄榄收成不好呢？损失也是有限的。


    这个故事的关键点在于：


    +   1、 即使在今天，气候也很难预测；


