  - '[PAGE 178]


    花落，都是通过卫星摄像头和一个神奇的蒙特卡洛发生器结合现实模拟出来的。


    假如我没有因为"全球个体隔离计划"而被放在现在这个盒子里，我能看到的可能是一模一样的景象，同样是通过眼睛进入我的大脑，产生一样的情绪反应。


    ……切如此真实。


    这个时候，家人们已经入眠。只有躲在被子里看书的外孙。


    我悄悄摸到他的房间，整面的电子屏天花板模拟出银河的模样，散发出迷人的幽蓝。


    他冲我伸了下手头，我伸出指头作嘘状。我们默契地击掌，拥抱，拍他年轻但厚实后背，说晚安。


    我丝毫觉察不到，或不愿去觉察，真实的外孙其实远在另外一个基地空间。


    几乎所有人都会忘掉"替代人"这回事，一方面是因为机器人的工艺突飞猛进，一方面是因为人们在面对虚拟的亲人时，反而更能释放自己的情感。


    就像梦境比白天更真切。


    ===


    2050年，距离全面实施"全球个体隔离计划"已经10年了。


    12年前，全球联盟执行长盖茨坚信人类无法抵御病毒的第六波进攻。他认为唯一的方法是：


    将隔离计划升级为让每个人单独封闭于一个纳米级洁净空间。'
  - '[PAGE 179]


    经过18年的艰苦卓绝的斗争，以家庭为单位的隔离计划彻底失效了，快速演化的病毒变得像花粉一样，在空气中无处不在。


    我想起30年前去买樱桃树。本计划买两棵，因为樱桃树需要两株彼此授粉才能开花结果。


    园艺店的女士说，你不用买两棵。我确定你家附近有人种了樱桃树。


    我疑惑地问：很远也可以吗？


    她满是自信地微笑说：放心，花粉们能飞到。


    在尝试了用量子计算和基因重组等技术暂时阻挡了病毒的第五次进攻之后，全球联盟启动了最后的堡垒计划：单独隔离全世界的每个人。


    生产和生活物资已经不是问题。量子计算加速了奇点的来临，AI在绝大多数领域已经超过了人类。


    1999年，瑞·库茨维尔博士在《心灵机器时代——当电脑超越人脑》一书说，未来互联网将把全人类乃至其他生命和非生命体汇聚成一个完整意识体的概念。


    随后，他提出库茨维尔定理：人类技术发展将以指数增长，智能机器将变得比人类更强大。


    很幸运，人类在2040年前后实现了他的预言。--赶在病毒彻底击垮人类之前。


    换而言之，人类社会已经可以用智能机器人代替工作，而人类则躲在几乎无尘的盒子里。机器人生产各种富足的物资，食物，玩具，咖啡，纸巾……然后送到盒子旁，并更新电池，清除垃圾。


    “全球个体隔离计划”绝非实施残忍的单人牢狱，因为其中一个极为重要又极其聪明的设计，世界反而变得更加美好了。'
