    老喻

    2015年


    # 2005年·收留


    老喻：


    深圳取消了边防证。


    我领了结婚证。


    我被收留啦。


    我曾经被时光收留，曾经被城市收留，但我必须被某个人收留之后，才算得上不再流浪。


    我需要一些可以被自己无条件讨好的人。


    你不会留意到那些与你朝夕相处的人的岁月痕迹，因为你们处于相对静止的时光流淌中。


