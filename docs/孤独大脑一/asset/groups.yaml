    几乎所有的城市，都在地产的巨潮之下涌动起来，我目睹旧城的消亡，新城的崛起。摩拳擦掌的塔吊，布满了整个天际线。在看似毫无希望的郊野，无数个新城市中心如野蘑菇般冒出来。


    在所有的商业领域，人们都惴惴不安，但又对这股向上的力量坚信不疑，跌倒的再爬起来，下滑的再涨回来，死掉的被遗忘。


