    ### 2016年·照片


    小喻:


    我几乎想不起来你长发的样子。


    你那时的手机大多还没摄像头，人们还没开始热衷合影，社交媒体也没现在这样虚假浮华。


    你可能想象不到今天人们的面孔有多么精致而刻薄，看不出一点儿悲伤或俏皮。


    现在我只有一张你长发样子的照片。还有一张在我的脑海里，那是在维多利亚港，头发被风吹起，刚刚好是一个忧伤的年轻人的不合时宜的长发该有的样子。


    我喜欢那张照片，于是应允它的自由和流浪，并因为它的隐匿而维护其完美。


    当你只记得细节而忘记情节，又或者忘却了情节的温度（没有了温度的情节其实只剩下细节，就像化掉的冰棍，虽然糖分和奶油都在），记忆便开始乘机征服你--你也乐于沉溺于由此而生的幻觉中。


    人生就是一连串的够不着和留不住。


    多年以后，你将无法想象，自己曾经身处一个如何魔幻的浪潮之中。


    你会感慨自己何以能够撞上这场父辈们数个世纪都无法触及的超级运气，又和绝大多数人一样不敢当真，难以投入。


    然而，一旦将时光拉至更大的尺度，我就会意识到整个人类何尝不是处在一个超级大运里？


    我们刚从树上爬下没多久，我们的文明不过数千年，以宇宙时光对照来看，我们假如早生几秒钟，可能就是一个在原始森林里躲避野兽的猿人。


    反过来想，我们可能又是极其不幸的，也许按照宇宙时光尺度晚出生几秒钟，我们就可以遨游宇宙、意识上传、长生不老了。


    再早一点儿，再晚一点儿，又会怎样呢？


    即使我们把寿命延长至1000年，不过是将我们命运的尺码放大了一号而已。


    青春不会因为拉长而被强化，死亡反而可能用拖长的阴影来放大人类的惶恐。


    老喻


    2016年


    ### 2004年·依赖


    老喻：


    今年我告别了一些人，也认识了一些人。


    我发现了自己的一个秘密，思考时我是偏向于叙述的，但生活时却刻意逃离叙述。


    我无法克服对现实的仪式、名义、场景等等一本正经的东西的荒诞感，可又不得不参与其中。有时好想对自己的躯体说--要不你自己去参加那个酒会吧。


    但我知道自己必须和躯体缚在一起。这并非肉体对灵魂的奴役，而是自我意识的前提。


    公司人越来越多，我们搬进了一整层办公室，玻璃混凝土风格的装修野心动劲，入口是拼成一整面墙的原始岩石。


    很多时候，我都沉浸在自己的世界里，试图自给自足。


    假如一场对话没让我点燃自盲自语的火焰，我就巴不得早点儿结束对话。我不喜欢见客户，所以尝试在公司内部用系统来替代自己。结果，找上门的客户更多了。


    我到底是在追求自由？还是在逃避现实？还是二者是一回事？


    又或是，我试图在“现实”和“感知”的撕扯中，维持着一种张力。比“现实”更真实的真相隐匿其中。


    对于这个世界的底层，我有一点点怀疑；可对于这个世界的表层，我毫无自理能力。


    我对躯体的操控并不那么高明。我依赖于自己的家人，我需要被收留。


    老喻，我赞成你此前的话，我们彼此并不互相依赖，去除这种依赖性，并不会消解时空中虚妄的后果。这些经由人类的想象力加工出来的因果，串起了我们的岁月，令过去不被遗失，让未来不太恐怖。


    去除依赖性，会让你我互不相欠。你不必感恩我所做的好事，也不要责怪我挥霍的时光。


    一切都是挂在时光枝桠上的叶子。


    小喻


    2004年


    ### 2015年·起伏


    小喻：

    '
  mdcn: '

    ## 反省

    人们常反省自己的恶习，直至这反省也成为恶习的一部分。


    ## 黄峥的“三位一体”算法


    40岁的黄峥，是中国仅次于马云的富豪。


    在送掉100亿美金之后，黄峥仍然拥有350亿美元的财富。而这一切，在短短的5年之内发生，并且只能在这个时代的中国发生。


    关于拼多多的奇迹，人们有各种分析。两年前黄峥被各种怀疑的时候，我写过一篇《你们都在笑拼多多，我买了点儿他的股票（“拼多多简史”之一）》，那时拼多多股价跌到十几块。


    直到现在，还总有人说自己因此赚了钱，又问我是否还拿着股票。


    很遗憾，我不是专业投资者，赚钱的人也纯属自己运气好，跟我没什么关系。


    关于拼多多的分析，有很多维度，例如从传统商业看中国的“不均可”的潜力，从电商竞争的角度看突破点，从社交电商的角度看商业模式，从技术的角度看AI的魔力......


    然而，所有这些分析都忽略了一个最本质的因素：创始人。


    没错，研究拼多多的文章，都会提及黄峥并不复杂的经历。


    但只是感慨他年轻，聪明，运气好，有贵人相助，仅此而已。


    本文将给出拼多多如此厉害的本质原因，那就是：


    黄峥个人的“算法”。


    ### 二


    先说结论：


    **黄峥的个人算法是：“三位一体”的创业者。**


    这“三位”，是：发明者，管理者，投资者。


    - 1、**先说发明者。**


    这是指黄峥的技术背景，以及拼多多公司的算法基因，和庞大的工程师队伍。


    黄峥最早与“大佬”们搭上，是因为丁磊找他解决某个技术问题。


    拼多多宣称的“分布式AI”，实现了“以消费者为导向，在消费者习惯的场景提供高性价比的购物体验”的产品优势。


    当然，公司不是实验室，黄峥也不是高精尖的天才，拼多多在技术上体现出了极大的灵活性和工程优势。


    他像数字时代的爱迪生，而不是特斯拉。


    因为这种灵活性和执行力，拼多多得到了腾讯在流量上的巨大支持。


    - 2、再说管理者。


    这次黄峥不当CEO，是计划“花更多的时间和董事会制定公司中长期战略，研究完善包括合伙人机制在内的公司治理结构。”


    段永平的带路，加上黄峥的悟性，让拼多多的管理一开始就有某种少年老成的成熟。


    黄峥一方面强调“本分”，认真地讲愿景和价值观；


    另一方面，刚创立时拼多多就在打打杀杀中冲出来。有多少创业者熬得住被经销商在楼下围攻？


    这种反差，让我想起看《滚雪球》时，书呆子巴菲特和芒格为了所投公司，赤膊上阵与工会斗争的场景。


    管理就是担当，是打仗，是为资本负责，拼的是真刀真枪。


    以上两方面矛盾吗？一点儿也不。


    本分，首先是不骗自己，做正确的事。骗别人最大的坏处是，最后把自己也骗了。这是黄峥从段永平那里学到的最重要的东西。


    本分和人品没啥关系，本分其实就是“理性”，是一切思考、计算、决策中的第一因素。


    所以，黄峥讲公司的愿景，也很真诚，虽然不是煽动人心那种。


    因为愿景和使命这类似乎很虚的东西，最能给股东带来长期的回报。


    我猜测他是亚当·斯密和达尔文的信徒。


    商业美德不是自我标榜，而是一种理性的选择。


    - 3、第三说投资者。


    黄峥讲自己对价值投资属于“天生就懂”。段永平也说过，这类东西，懂的人点一下就知道了，不懂的人一辈子也懂不了。


    听起来很宿命论，但可能就是事实。


    黄峥经营拼多多的关键秘密之一，是价值投资思维。


    当然，说起价值投资，巴菲特说自己是懂投资的企业家，懂经营的投资者。一脉相承。


    你有没有想过，为什么拼多多可以疯狂烧钱，疯狂补贴？这个和其技术基因似乎有点儿矛盾啊。


    黄峥给出了答案：


    如果把创业过程中的各种决策都当做是投资决策，那么我们去分辨我们用时间和钱换来的东西哪些是资产（asset）哪些是费用（cost），那些随着时间流逝、对加深生意的护城河有利的往往是“资产”，那些时间越久对自己越不利的可以看成是费用。


    没错，很多烧钱的公司，烧的是费用。


    而拼多多，烧出来的是资产。


    要做到这一点，又需要强大的企业数字中枢。


    简单说，就是算得出投入产出，算得过总账，算得出长期的账。


    由此，拼多多的第一封致股东信里说：


    拼多多将是个勇于投资未来，立足长远的公司。它有时可能看起来激进，有时显得过于保守，但它其实都是遵循一个简单的一贯逻辑，那就是专注于这个机构的内在价值。


    你看，“发明者、管理者、投资者”这三个角色，是不是说着说着就一体了？


    ### 三


    其实，“发明者、管理者、投资者”三位一体的家伙，还有一个人。


    那就是贝佐斯。


    - 1、作为发明者，贝佐斯和黄峥一样，是数字化时代的工程师，毕业于普林斯顿，学的是计算机，毕业后去华尔街做软件工程师。

    - 2、作为管理者，贝佐斯很幸运地是在西雅图创业。这个美国西北角的城市非常奇怪，除了诞生了微软，还有波音、星巴克、Costco等一大堆伟大的公司。贝佐斯就曾经得到了Costco创始人的指点，算是开了管理的天眼。

    - 3、作为投资者，贝佐斯在华尔街混过，也是价值投资的信徒。


    但是，对于数字化的公司，价值投资怎么玩儿？这一点连巴菲特也没看明白。所以他和芒格都为自己居然没买亚马逊的股票而懊恼。


    贝佐斯想明白了一件事，在虚拟的数字化世界里，一样是有“资产”的。


    我称之为“数字化房地产”。


    没错，这个世界最赚钱的生意，仍然是房地产。只是，发生在数字世界。


    贝佐斯想明白了一件事，这件事巴菲特很晚才理解。那就是：


    亚马逊的价值在于提供近似于水电的基础设施服务。


    加上从Costco创始人那里的偷师，亚马逊打出了“超低价+巨量+微薄利润”，大量吸引用户，形成规模效应后，以更低的基础设施成本和更低的价格吸引更多用户，形成飞轮效应。


    此外，贝佐斯对于“自由现金流”的理解和运用，也与巴菲特的价值投资同宗同源。


    看起来是不是眼很熟？


    没错，这也是拼多多的打法。


    很多人怀疑：拼多多这么补贴，能赚钱吗？


    也有人说：烧钱换来的客户，能持久吗？


    更有人问：靠便宜货打五环外的市场，如何进入主流呢？


    这些想法，压根儿没有理解拼多多的商业模式的本质。


    ### 最后


    总结一下，“发明者、管理者、投资者”三位一体的创始人，是拼多多崛起的最大秘密之源。


    从这个角度看，这家公司的奇迹，得益于“算法驱动+愿景驱动+价值驱动”，分别对应了“发明、管理、投资”这三个核心词。然而，未来竞争将更激烈。


    **对于投资人而言**，假如你想要发现下一个拼多多，可以用这个“三位一体”模型套一下，去研究公司的创始人和当家人；


    **对于年轻人而言**，如果你将来想成为一个黄峥这样的牛人，需要拥有一个更多元（而一体）的能力框架。


    ## 流浪之城


    ### 1999年•火车


    老喻：


    你好吗？


    让我们来做一个游戏。


    - 你告诉我一个“早知道就好了”的道理；

    - 我给你讲一个你忘掉了的故事。


    我是在去深圳的火车上给你写这封信。这是最早的一班，路上大约要两三个小时，但票价只有快车的一半。


    从石碑村出发去广州东站时，天还没亮。火车还是绿皮的，音乐是《春天的故事》，天呐，1997过去这么久了，为什么还放这个音乐？


    我一切都好。手上在做的⼯作正要发芽，尽管眼前仍无迹象，我心底早已看见。倒不是因为远见，而是别无选择。


    可别人看不到。


    为了躲避房东，我去中山图书馆混了一天，不过不是看书，而是看了两场记不住名字的录像。


    再后来，搬去城中村。农民的房子，以不能更低的租金，成为这个城市最后的收留之地。


    棱和棱之间近得可以握手，一道狭窄的阳光射入暗黑的房间。


    虽然光线只有两厘米宽，却有100%的亮度；虽然某刻只照到某个角落，却能扫过100%的桌面。


    现实有一点点让人绝望，但我从未对其失望。


    小喻


    1999年


    ### 2020年•花园


    小喻：


    我很好。


    此刻是温哥华最好的季节，初夏阳光炎热，空气却是清凉的。


    怕热的你居然在湿热的广州停留了15年，一个人关于时空的命运是多么不可思议。


    人们钟爱久远到与世隔绝的记忆。然而我仍然在你的岁月余波之中。就像我远在万里之外，也没能间隔大洋彼岸的牵挂。


    其实你并不需要我的道理，我也未必忘记了你讲给我的故事。


    我在怀疑你我之间的连贯性。如爱因斯坦所说，时间的先后也许只是一个持久而顽固的幻觉。


    在围棋的世界观里，现实是一个棋盘，过去、现在、未来都平铺在上面。


    一道神秘的光线，正如你那时黑暗小屋里的狭窄光线，轻轻扫过我们的一生。


    ### 时光是矗立还是平铺？


    倘若两周后的某个时刻，将有某件事令你不爽，那么，对于“时光矗立者”来说，即使该事并不影响未来两周，但那事已潜入时光的空中楼阁，提前压在你头顶14楼之上。


    而且，即使这件事过去了，它依然在你脚下的楼层泛出异味。


    对于“时光平铺者”而言，则是安然行进于时空的苍茫大地之上。


    就像我昨天驱车于加拿大西部的菲莎河谷，壮阔的崖壁之间，远处的暴雨仿佛是云朵下的淋浴，只打湿了一小片大地。


    晴朗和阴部同时发生，那大约就是过去和未来的样子。


    我们只是穿行其间。


    所以，就生活而言，时光也如房子般，容积率越低越舒服，平铺、延展、可串起，而不必彼此压迫。


    你与我无关，亦无需对我负责。


    我们彼此之间是完全陌生的。


    老喻


    2020年


    ### 2000年•书吧


    老喻：


    我从未想过你将成为一个什么样的人。我有限的努力，也不是为了你，而是为了让此刻的我更安宁一些。


    出租车绕行在高架桥上时，朋友们望着四处的高楼和塔吊说，深圳哪里有这么多的人来买房子啊？


    我也不知道。我只知道自己的那本起初无人看好的地产书卖得很好，公司的生意像草原上的野火，隔不久就要换个办公室。


    最会做生意的地产公司在广州，最会做产品的地产公司在深圳，我往返于两地，并混迹于万科周刊论坛。


    我认识了挺多有意思的人。


    一切像是春季的初芽，微不足道，势不可挡。


    快到年底的时候，我们总在一个新开张的书店聚会。那里有酒，有弹唱歌手，有书，有年轻的男男女女，有种种可能。


    在一个流浪的城市，到处都是流浪的青年。这间书店在一个剧场般的三岔路口，像是影视城里的布景，真假难辨。


    它原本是一个底商，可是在某种奇妙的聚光灯的作用下，一切与剧情无关的元素都被拿掉了，像是西部片里初始小镇的独立小木楼。


    进门时，你既能感受到某种庄重的仪式感，又如步入童话世界般无需为结局担忧。


    书店的名字叫"物质生活"。


    小喻


    2000年


    ### 2019年•无关


    小喻：


    当我们相约，从各自的时间节点，向中间汇合，心底竟有点儿不该有的好奇。


    该忐忑的不是你吗？


    因为，我们的交汇之处，对你而言是未来，对我来说是过去。


    你并非我的因，我也不是你的果。我们是交织在一起的时间变量。


    作为未来的我，像树干向上展开的枝桠，但我只是其中的一枝，并不比小树芽般的你更广阔，因为无限的其它可能性要么消失，要么潜入地下变成前途未卜的种子。


    被打开的人生的黑盒子是不可逆的。你奔向我，是过去将来时；我奔向你，是将来过去世。


    时间并非整齐而连续，现实不是记忆的原料。无论我们多么努力，都无法摆脱世俗的庸常。惟有记忆能够消除迷雾，以叠加另外一层迷雾的形式。


    我们所感知的世界，正是多重加工的产物。


    今年我做了很多事。在时光的长河中，我仍旧是随波逐流的。


    你还记得1995年你在大学毕业留言册上的那句话吗？


    关于工作的理想，你写道：


    有钱去做与钱无关的事情。


    前半截我不确认自己做到了，但我现在开始做后半截的事情了。


    老喻


    2019年


    ### 2001年·BBS


    老喻：


    你我的汇合，也许就像“时光之网”的网友见面。


    每年照例有很多大事，例如911。


    中国加入了世贸，但世界似乎离我们还是很远。


    我花了很多时间混在万科论坛，有三个人格分裂的ID。


    “物质生活”也搬上来了，我和两位美女一起担任版主。论坛上有各种怪人，其中有位女生号称要睡遍所有男版主。但包括我在内的所有男版主都声称自己是唯一被遗漏的那个。


    在那里，人们总是可以快速嗅出自己的同类。并且经常嗅错。


    论坛的主编有天去考察了一家叫腾讯的小公司，午饭后的他发帖说，这家公司如果不能转型To B的业务，将来毫无出路。


    新世纪乱哄哄地开始了。


    我还是那么心不在焉。我和这个世界上发生的事情总是有种疏离感，甚至无法确认那些正在发生的事情是真的很在发生。


    小喻


    2001年


    ### 2018年·空


    小喻：


    也许你说得对，我应该拿一个“早知道就好了”的道理，换一个我忘掉了的故事。


    请记住以下的话--


    - •时光并不随我们向前。她留在原地招待年轻人。

    - •人的一生由那些他人根本不在乎、也未曾关注过的片段构成。

    - •人生没有目的和意义。但在不同的阶段，会有不同的“没有目的”，和不 一样的“无意义”。


    我理解你说的虚无感。但是请相信我，你将永远不会再有你此刻的那种“虚 无”。


    时空的建筑师盖出来的房子，和我们居住的房子一样，仅有的意义就是墙壁 里的“空”。


    空间的价值常以“空间浪费”来呈现，时光价值之评判，或决定于时间何时被 虚度、而非其怎样被追逐。


    我们所暂时拥有的一切，都不过是用于构建这类比宇宙间所有的原子还要多 的“空”。


    老喻


    2018年


    ### 2002年·喝酒


    老喻：


    真希望我们有一天可以在一起喝酒。


    有趣ﵴ= 只要我或者你在独自喝酒，其实大概率就是我俩在一起喝酒。


    花间一盏酒，独酌无相亲。举杯邀明月，对影成三人。


    最近，我常去“物质生活”喝酒。


    年轻人ﵴ≈ 似乎可以永远年轻下去，喝醉的人总是可以醒来，女生的漂亮容颜将比时光更长久，前途不必疑虑，青春的肉欲和才华一样无罪，大家井然有序地聚众茫然。


    在这个特区，稚嫩的野心仿佛有流浪的特权。


    今年有篇很热闹的文章，叫《深圳，你被谁抛弃？》。太好笑了，深圳本来就是流浪之城，还能如何被抛弃呢？


    我觉得自己仍然像大学宿舍的男生，丝毫不去考虑未来。论坛上他人的回帖，书吧酒桌上的话语，比世俗间的一切名利更浓郁，更安全。


    然而，年轻的酒桌上，我依然有些孤单。也许每个人都是。大家都假装在守护一片逃避的篝火，以令世界不至于太过残忍。


    我们未必是一类人。


    只是，我们对情绪强度的偏爱，胜过对情绪种类的偏爱。


    小喻


    2002年


    ### 2017年·孤独


    小喻：


    别为你的跌跌撞撞忧心。


    不存在所谓完美而适宜的环境地--如在宁静的花园阅读，在淼淼的湖畔发呆，在完全放下的时光里去做理想的事情，在彻底黑暗的某刻为所欲为。”


    人总是在勉强、乃至不适宜的状况下去完成适宜的事情，无论是美好或罪恶，伟大或猥琐，良善或贪婪。


    人世最大的浪费，是去等候某个无可挑剔的时刻以完成某事。


    假如跌跌撞撞是年轻人的一部分，那么，我一直保持着年轻状态，尤其是蠢的那部分。


    少年时代没什么好怀念的，彼时我们大多无所事事。


    那些无所事事多么值得怀念啊。


    老喻


    2017年


    ### 2003年•奔忙


    老喻：


    不管我如何与现实剥离，都无法阻挡公司的生意。


    我像早上赖床的家伙，说：妈妈，今天我不想去学校。妈妈说：你必须去，你是校长啊。


    即使是在非典时期，我也在飞来飞去，从广州飞沈阳，所有的人都戴着口罩，只有我一个坐在最后一排吃盒饭。


    几乎所有的城市，都在地产的巨潮之下涌动起来，我目睹旧城的消亡，新城的崛起。摩拳擦掌的塔吊，布满了整个天际线。在看似毫无希望的郊野，无数个新城市中心如野蘑菇般冒出来。


    在所有的商业领域，人们都惴惴不安，但又对这股向上的力量坚信不疑，跌倒的再爬起来，下滑的再涨回来，死掉的被遗忘。


    仿佛这是一场永不休止的狂欢。


    我有点儿商业的天赋，但毫无商业的野心。


    我无法理解自己的命运。我想要被那么一点点确定性包裹，然后在一个有点儿不确定的大海中遨游。


    时光之流淌是确定性的，时光之过度是不确定性的。确定性令我们安宁，不确定性赋我们人生。可我们总是弄反，追求“确定性”的度过，陷入“不确定”的流淌。


    我有时怀疑自己的叙述性倾向让自己错过些什么。这些叙述原本是属于你的工作。也许我们时空混乱般交错在一起，看起来却像是个分裂的人。


    一个人的分裂，未必是同一时间下基于人格的分裂，也可能是同一个人格基于不同时间的分裂。


    这算是我对自己的忧虑和心不在焉的自我安慰吧。


    今年，我剪掉了自己的长发。


    小喻


    2003年


    ### 2016年·照片


    小喻:


    我几乎想不起来你长发的样子。


    你那时的手机大多还没摄像头，人们还没开始热衷合影，社交媒体也没现在这样虚假浮华。


    你可能想象不到今天人们的面孔有多么精致而刻薄，看不出一点儿悲伤或俏皮。


    现在我只有一张你长发样子的照片。还有一张在我的脑海里，那是在维多利亚港，头发被风吹起，刚刚好是一个忧伤的年轻人的不合时宜的长发该有的样子。


    我喜欢那张照片，于是应允它的自由和流浪，并因为它的隐匿而维护其完美。


    当你只记得细节而忘记情节，又或者忘却了情节的温度（没有了温度的情节其实只剩下细节，就像化掉的冰棍，虽然糖分和奶油都在），记忆便开始乘机征服你--你也乐于沉溺于由此而生的幻觉中。


    人生就是一连串的够不着和留不住。


    多年以后，你将无法想象，自己曾经身处一个如何魔幻的浪潮之中。


    你会感慨自己何以能够撞上这场父辈们数个世纪都无法触及的超级运气，又和绝大多数人一样不敢当真，难以投入。


    然而，一旦将时光拉至更大的尺度，我就会意识到整个人类何尝不是处在一个超级大运里？


    我们刚从树上爬下没多久，我们的文明不过数千年，以宇宙时光对照来看，我们假如早生几秒钟，可能就是一个在原始森林里躲避野兽的猿人。


    反过来想，我们可能又是极其不幸的，也许按照宇宙时光尺度晚出生几秒钟，我们就可以遨游宇宙、意识上传、长生不老了。


    再早一点儿，再晚一点儿，又会怎样呢？


    即使我们把寿命延长至1000年，不过是将我们命运的尺码放大了一号而已。


    青春不会因为拉长而被强化，死亡反而可能用拖长的阴影来放大人类的惶恐。


    老喻


    2016年


    ### 2004年·依赖


    老喻：


    今年我告别了一些人，也认识了一些人。


    我发现了自己的一个秘密，思考时我是偏向于叙述的，但生活时却刻意逃离叙述。


    我无法克服对现实的仪式、名义、场景等等一本正经的东西的荒诞感，可又不得不参与其中。有时好想对自己的躯体说--要不你自己去参加那个酒会吧。


    但我知道自己必须和躯体缚在一起。这并非肉体对灵魂的奴役，而是自我意识的前提。


    公司人越来越多，我们搬进了一整层办公室，玻璃混凝土风格的装修野心动劲，入口是拼成一整面墙的原始岩石。


    很多时候，我都沉浸在自己的世界里，试图自给自足。


    假如一场对话没让我点燃自盲自语的火焰，我就巴不得早点儿结束对话。我不喜欢见客户，所以尝试在公司内部用系统来替代自己。结果，找上门的客户更多了。


    我到底是在追求自由？还是在逃避现实？还是二者是一回事？


    又或是，我试图在“现实”和“感知”的撕扯中，维持着一种张力。比“现实”更真实的真相隐匿其中。


    对于这个世界的底层，我有一点点怀疑；可对于这个世界的表层，我毫无自理能力。


    我对躯体的操控并不那么高明。我依赖于自己的家人，我需要被收留。


    老喻，我赞成你此前的话，我们彼此并不互相依赖，去除这种依赖性，并不会消解时空中虚妄的后果。这些经由人类的想象力加工出来的因果，串起了我们的岁月，令过去不被遗失，让未来不太恐怖。


    去除依赖性，会让你我互不相欠。你不必感恩我所做的好事，也不要责怪我挥霍的时光。


    一切都是挂在时光枝桠上的叶子。


    小喻


    2004年


    ### 2015年·起伏


    小喻：

