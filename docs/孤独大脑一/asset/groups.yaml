    这是一个多好的故事啊！伟大的领导者用语言和行动建立互信和公信力，这些语言和行动无论事关大局，还是细节上的，都会一次又一次地证明领导者尊重下属，以下属为荣。


    杰克·韦尔奇更进一步地认为：


    **最优秀的领导者在涉及利益时应先人后己。**


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_102_0.png)


    ### 故事2


    这次的主角是杰克·韦尔奇自己。


    故事是关于杰克·韦尔奇和德鲁克之间的一次传奇对话。


    这个对话有很多版本，我选择了一个比较简洁的。


    杰克·韦尔奇刚当上董事长时，去向德鲁克求教企业成长的难题。


    德鲁克问他：“假设你是投资人，通用电气有哪些事业，你会想要买？”


    这是一个暗含着人类行为“禀赋效应”的大脑实验。


    禀赋效应是这么说的：


    当你拥有一样东西之后，你对这样东西的评价会高于你没有拥有它时。


    伟大的德鲁克帮助杰克·韦尔奇完成了一次逆向思考。


    醍醐灌顶的韦尔奇由此意识到：


    让通用电气的每一项业务都成为业界领先者。


    于是，一个至今仍被人称道但又充满争议的管理思想诞生了：


    只做第一或第二。否则就砍掉。


    杰克·韦尔奇是个著名的行动者，上任通用电气后，在公司整体经营数据良好的情况下，他疯狂裁员，员工人数由最高时的41万人裁减到23万人，裁员率高达40%。


    就好像给一个健康的人做截肢手术。


    杰克·韦尔奇因其冷酷无情，被称为“中子弹杰克”。


    为什么叫中子弹呢？因为中子弹是一种杀人厉害却较少伤物的武器。


    韦尔奇一方面裁员，一方面推动了公司业绩的大幅增长，将公司的生产率提高至6倍以上。在其长达20年的任期内，通用电气市值从120亿美元增长到4100亿美元。


    我们放下战略和管理不谈，在这两个故事里，杰克·韦尔奇表现出一种分裂的特质：


    - 一方面他表现出对员工“兄弟”般的关爱；

    - 一方面他又冷酷且残忍。


    这二者都是真实的。


    杰克·韦尔奇在《赢》一书中总结了自己做生意遵循的四条基本原则：


    1. 要有强烈的使命感和切实的价值观；

    2. 在经营管理的任何环节都保持坦诚的态度；

    3. 发挥业绩差别的力量并建立精英化的组织；

    4. 捍卫每个个体的尊严与发言权。


    杰克·韦尔奇在公司的运营管理中，综合了“热血”和“冷血”。


    据GE前员工回忆，有一年，GE中国的业务部门拿下上亿的订单。杰克立刻来问，谁是销售主管，得到了多少奖励。当他听说奖励金额时，很不高兴，说奖励得太少了，要重奖。


    另一方面，杰克·韦尔奇制定了一个非常有名的年终评估制度——强制性的2-7-1法则（又名“活力曲线”）：


    业绩在前20%的直接加薪、晋升，业绩在后10%的，没有任何借口，直接被辞退，在中间的70%不变。


    杰克·韦尔奇学的是化工，一路读到博士，算是个读书人。毕业后进入GE。从工程师做起，技术相当了得。后来一路升迁，第21年升职任CEO，直至退休，干了41年。


    所以，可以这么说：杰克·韦尔奇是一个野蛮的读书人。


    如你所知，即使“孤独大脑”写到某个时效话题，讨论的也是与时效无关的主题。


    先说说我对杰克·韦尔奇的几个基本认知：


    ## 1、时代造就了杰克·韦尔奇不可复制的传奇。


    抛开他众所周知的经营管理优势不说，杰克·韦尔奇在任的20年，横跨了里根（1981-1989）与克林顿（1992-2000）两任总统创造的大牛市。


    回头看看中国，以科技公司为例，第一波互联网热潮造就了腾讯、阿里、百度等公司，第二波移动热潮造就了美团、今日头条。


    ## 2、韦尔奇的战略遗产是其“商战思维”而非“商学结论”。


    杰克·韦尔奇卸任后不久，GE迅速“衰退”。2001年伊梅尔特接手时，GE股价为每股40美元，到2018年年底还不到8美元，总市值650亿美元，只有顶峰时期的1/10略多。


    于是人们讨论，到底是继任者不行，还是说杰克·韦尔奇先前埋下了恶果。


    纠结于此的人，大多没懂什么是战略。


    杰克·韦尔奇的战略偶像，是“西方兵圣”克劳塞维茨，《战争论》的作者。


    1981年，韦尔奇出任通用电气首席执行官之后，他在描绘其战略思想的演讲中，明确地引用了克劳塞维茨的观点作为通用电气如何变革的思想启迪：


    > 克劳塞维茨在经典著作《战争论》中总结，人们不能把战略沦为公式。详尽的计划必然会失败，因为肯定会遇到不可避免的阻力，如偶然事件、不完美的执行、反对派的独立意愿。


    而领导力、士气还有将军们的本能牺牲等人的因素发挥了最主要的作用。


    于是，韦尔奇强调3S战略：


    - 简洁（Simplicity）

    - 速度（Speed）

    - 自信（Self-confidence）


    簡而言之：


    - 韦尔奇无需为自己的战略在数年后是否仍然奏效负责；

    - 我们要学习的，是他的战略思维。


    ## 3、GE的衰败是正常的均值回归。


    假如GE仍然很厉害，那才奇怪。


    运气很好之后，大概率会有差运气。


    为什么苹果公司和巴菲特看起来会例外？


    因为他们很奇怪。


    ## 4、行业与企业的生命周期不可抵挡，以及负熵不易。


    哪里有常开的花呢？


    尽管韦尔奇很重视使命和价值观，但是他仍然没有找到一个像乔布斯那样的使命。又或者，他的行业运气不如乔布斯的持久。


    如此一来，想要实现熵减就更不容易了。


    ## 5、2000年前后企业逻辑的巨大变革。


    在互联网一统江湖之前，企业规模一直是有“规模瓶颈”的，直到数字化成为超级企业的灵魂，企业才开始突破恐龙诅咒，一帮毛小子跌跌撞撞也能把公司干到万亿美金规模，而且越大越强。


    韦尔奇没那么好的运气。他已经竭尽所能了。公司规模越来越大，最后他所用的超级企业黏合剂是金融，然而，金融很难像数字化那样，形成一个企业有生命力的神经网络。


    我们会发现，数字化时代，超级企业八爪鱼式的多元化，要比韦尔奇时代的精简式多元化厉害得多。


    有趣的是，在互联网时代，行业老二或者老三非死不可，老大一统江湖，完全验证了韦尔奇的哲学。


    ## 三


    杰克·韦尔奇到底厉害在哪儿？


    抛开CEO那些高大上的东西，我们说说与平常人的关系，尤其是对你我这些所谓读书人的启发。


    难道是要讲“读书人要学会野蛮”这种陈词滥调？


    难道是要说“透明、求真”这类达利欧式的鸡汤？


    在我看来，杰克·韦尔奇超越时代的秘密武器有两个：


    真理和真诚。


    这正是伯纳德·威廉斯所强调的真理的两种美德：


    准确和诚实。


    - 前者和读书人有关。

    - 后者和野蛮有关。


    读书人的使命就是追求真理和准确。学化工的要琢磨分子式，学物理的要琢磨公式和计算。爱因斯坦局部推翻了牛顿，但不影响读书人顺着他们的轨迹追寻真理，哪怕真理只是暂时的。


    做企业也是一样。


    韦尔奇从德鲁克那里学到的，是意识到作为一个化工博士，在思考企业战略时，也应该是追寻真理的。


    那么，为什么真诚和“野蛮”有关？


    我们赞美的“野蛮”，其实是那些打破表面的假客气和装腔作势，摧枯拉朽，直奔本质。


    这种“野蛮”，是战场上兄弟之间废话少说生死相许的协作，是资本上用真金白银下注的切肤之痛，是不会为了恭维而不指出对方可改进之处的坦率赤诚。


    所谓被歌颂的野蛮，就是如射出去的箭那样的诚实。


    从这个角度，大多数读书人都是虚伪的。


    **引而不发的诚实，并非诚实。**


    读书人的问题是，即使理解了“真理”，也知道如何做是对的，甚至有具体的路径和方法，也无法克服世俗的羁绊，一辈子都不曾为求真流过血。


    多年以后，GE的老员工回忆起韦尔奇，常常会说：


    **杰克教会我们，不讲废话。**


    在GE全球最高级别的管理层会议上，每个人限定在8分钟内做完陈述，“那些不演练，或是不能高效说话的人往往会接收到‘死亡’信号。”


    不说废话，就是求实求真。


    罗素早就说过：这个世界的问题在于聪明人充满疑惑，而傻子们坚信不疑。


    也许，我们最该向韦尔奇学习的，就是当一个野蛮的读书人：


    追寻真理，赤诚行动。


    作为一个创业者，我和大家一起复习一下杰克·韦尔奇那些厉害的工具：


    ## 1、企业文化和价值观。


    这是马云从韦尔奇那里学到的东西之一。


    韦尔奇每年年初在高管开年会上的演讲，会被录制成录像带，分发到基层，组织全员学习讨论，就公司的目标和文化进行深刻领悟。


    ## 2、追求简单和重复。


    杰克·韦尔奇说：一旦你产生了一个简单的坚定的想法,只要你不停地重复它,终会使之成为现实。提炼、坚持、重复,这是你成功的法宝；持之以恒,最终会达到临界值。


    ## 3、领导者要为下属的前进道路扫除障碍。


    杰克·韦尔奇拿“冰壶”比赛举例：


    一名选手掷球时，另外三名队员在冰壶滑行的前方快速左右擦扫冰面，使冰壶能够准确到达营垒的中心。那些擦扫冰面的选手所做的事情就是竭尽全力地扫除一切影响冰壶接近目标的障碍。


    他认为，优秀的领导者也应该如此，竭尽全力地帮助下属扫除前进道路上的障碍。


    ## 4、领导者要将自己视为“首席解释官”。


    领导者要不断向所有人解释公司的使命和行动，要像传教士那样不厌其烦。


    ## 5、去拥抱你的队员。


    杰克·韦尔奇说：


    好领导就好像好教练，自己站在场外，看到队员有了出色表现时，会无法抑制内心的激动，情不自禁地欢呼雀跃，当选手们走出赛场时，他们会不顾选手汗湿的衣服而给予热情的拥抱，他们还知道如何跟每一个队员打交道才奏效。


    ## 最后


    史蒂芬·平克在《当下的启蒙：为理性、科学、人文主义和进步辩护》说：


    > “按启蒙运动的说法，我们可以通过理性和同情来促进人类的繁荣。”


    杰克·韦尔奇不仅是企业界的启蒙者，他也证明了一个读书人，可以凭借真诚和勇敢，创造自己和公司的传奇，并收获财富和荣耀。


    让我们用他的38句箴言，来怀念他。


    1. 让员工发现和看见自己的工作的意义及其实现机制。

    2. 好主意来自四面八方，点子的沟通应该随时随地。

    3. 对高级人才只要认为值得，付出绝不吝啬。

    4. 始终使用最顶尖的业务人才，不惜代价挖到手。

    5. 在用人方面，头脑里没有任何怪结，完全打破等级、门户、辈分之见。

    6. 只参与行业内最有前景的领域，割离没有创新空间的部门。

    7. 任何行业，只把眼光盯住龙头老大。

    8. 不涉足业绩经常为外边环境的变化所左右的、自己无法控制的周期性行业。

    9. 只面向现实的经营前景，从不按照自己的期望、预测的所谓远景考虑问题。

    10. 灌输公益价值观和融入社区的意识，争取实施全球化战略中的地利人和。

    11. 建立起对于充分的准备工作和对大量图表进行现实分析的极端癖好。

    12. 让优秀的人才在公司的主战场和第一线感受他们自己的价值。

    13. 机会来临全力争取。

    14. 换人不含糊，用人不皱眉。

    15. 在职业生涯中间发现和形成人才储备，随时调用。

    16. 剔除没有激情的人。

    17. 制定跳起来才可能够得到的目标。

    18. 先于变化采取行动。

    19. 将员工的学习与晋升直接挂钩。

    20. 将自己的文化包括自信灌输给公司的每个人。

    21. 建立公司内部学校。

    22. 讨论和研究可以连续几个小时的进行，但是一定要争吵，以贴近真实答案。

    23. 不同事业部之间无界限的交换意见应该是很正常的事情。

    24. 随时准备全面分析对手可能采取的行动。

    25. 通过数字化使公司更加灵活。

    26. 让每个人、每个头脑都参加到公司事务中来。

    27. 将公司的内部和外部文化区别，并且要求自己和其他所有人在贯彻内部文化方面始终言行一致。

    28. 管理越少，公司越好。

    29. 与员工沟通，消除管理中的警察角色，不要一味企图抓住下属的小辫子。

    30. 在公司内部，点子、刺激、能量必须源源不断并且以光速传播。

    31. 官僚主义往往与形式主义为伴。

    32. 寻找有团队激励能力的人。

    33. 与控制欲强的、保守的、疑虑的管理者断绝关系。

    34. 不要花太大的精力试图改变不符合公司文化和要求的人，直接解雇他们，然后重新寻找。

    35. 小心关照公司的最佳人员，给他们回报、提携、奖金和权力。

    36. 不要以命令组织公司的运行。

    37. 与部署中最聪明的人和睦相处、密切配合。

    38. 态度决定一切。

    39. 将最巨大的支持和资源授予最优秀的人才。


    # "长期主义"&"短期哲学"


    植物才是这个世界的统治者。


    25亿年前，最早的植物在地球上出现。


    7500万年前，人类及老鼠的最后共同祖先出现。


    1500万年前，猿从非洲迁徙至欧亚大陆，成为了长臂猿及猩猩。人类祖先从长臂猿形成。


    植物不仅来得早，也可能走得晚。


    在电影《我是传奇》的末世景象中，人类濒临灭绝，纽约曼哈顿街头空无一人，却长满了各种植物。


    对比人类，植物的特点是“静”和“慢”。


    缺什么吆喝什么，“静”和“慢”正是人类推崇的美德，尤其是在当下这个喧嚣而迅猛的时代。


    向植物学习“长期主义”，其意义不言而喻。


    例如著名的红杉资本，就用了树的名字。


    红杉是世界上最高的植物之一，能长到115米高，目前已知最老的红杉约有2,200岁。


    投资公司用这个名字，再好不过了。红杉中国自称“创业者背后的创业者”，致力于发掘和培育产业界的“参天大树”。


    即使是在植物界内部，长得快的树木，似乎很难成材，也不容易长大。


    植物的长期主义，似乎和人类的一致：


    想远一点儿，想大一点儿。


    那么，什么是植物的“短期哲学”呢？


    ## 二


    长期主义需要“延迟满足”，但千万别过头。


    经济学家本·斯坦在《投资21戒》里说，自己过于劝诫人们存钱养老了。


    他说，当年岁渐长，以超乎自己想象的速度老去，逐渐意识到，生命还应当注重经历和享受。


    推迟享乐甚至是大额消费，将财产留待年老以后却无力享受，或者将其作为遗产留给下一代，在我看来并不是正确的人生态度。一旦能够给孩子们留下相应水准的遗产，就让他们自求多福吧。趁年轻，你应该好好享受生活才是。


    当然，我所说的植物的“短期哲学”，并非简单的对“长期主义”的平衡。


    我想说的，是关于“四季”。


    四季并不属于人类。


    一个四季对我们来说，只是催命的计时器；对于植物来说，却是一世的轮回。


    记得初中时的英语课上，学到春夏秋冬四个单词，老师让同学们挨个站起来用英语说自己最喜欢的季节，轮到我，答：All。


    我一直认为，季节的魅力在于交替之间。


    人一直在模仿植物，播种，发芽，开花，结果，凋谢，轮回。但人不能拥有植物那种四季交替的小周期。


    很多植物过的是轮回转世的生活，例如红杉，最多可以转两千多次。


    而人类只有一次。


    人不能如植物般四季循环，只有一轮春夏秋冬似的幼长老死，很多人还过不全。


    不过，单季内似乎也可以有个小型四季循环，例如年轻人的未老先衰，稍安不久又重打鸡血的中年，老房子着火似的人老心不老。


    然而如上种种，只是一列单向列车上下蹦下跳的折腾而已。


    对人类来说，一年四季太狠了，像一部90分钟的电影，管你好看嫌太短、难看嫌太长，说完就完。


    然而对于植物，出芽的欣喜，枝叶的茂盛，花果的收获，落去的伤感，四季就是一辈子，每次就像玩儿不腻的小孩儿过家家，或每次见到主人都欣喜若狂的狗儿。


    这不就是我们所期盼的，假如人生像一个可以干干净净重新再来的游戏，该多好呀。


    植物与这个世界的关系，与时间之间的关系，用一个不正确的比方，多像：


    - 两个人既海枯石烂长相守，此谓“长期主义”；

    - 又有每年换个老公老婆般的新鲜初见，此谓“短期哲学”。


    ## 三


    我喜欢植物。


    每当下雨天，我就想：喂，它们有水喝啦。


    十余年前在广州，我在郊外房子的院子里种了很多树。


    除了几棵大树，多是芒果、荔枝、龙眼、黄皮、大树菠萝等果树。水果别指望有多少，但等待的喜悦，无以言表。


    有年芒果大丰收，挂满两棵树，吃不过来，竟没摘完。


    那次我在芒果里找出两个特别的，装扮了一下，如图。后来去台湾，知道当地用青芒果做成“相思果”，味道特别，这张照片倒是有“同曲”之妙。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_116_0.png)


    最近在温哥华布置新院子，除了设计师布置的基础花草，我照例想多种果树。


    老外喜欢种果树，但却不吃。有次和朋友从家里走去女儿的学校，正是夏季，沿途摘人家院子里伸出来的果枝上认识或不认识的各种果实试吃，有主人有的在，笑着说多摘点儿。


    这些水果，大多喂了鸟，或者是被松鼠和浣熊吃了。所以温哥华适合种的水果，多是鸟不爱吃的无花果和各种杏子。


    我种了黄色和橙色两种杏子，一棵梨树，一棵柿子树，两株蓝莓。樱桃格外招鸟，但也非种不可，而且需要两株彼此授粉。还有预定的山楂树，枣树，香椿。爬藤类的则有葡萄和奇异果，以及观花的铁线莲和紫藤。


    我家LD尤其反对种苹果，我说你天天用iPhone好意思不种棵苹果树吗？如此贴切的理由并不见效，因为苹果的确容易生虫子。


    但我还是打算悄悄种上两棵，不是为了坐在树下思考，自己也不爱吃苹果，就是觉得“苹果树”光凭这几个字就值得种。


    记得2008年第一次到加拿大，去布查德花园迷路，停车问一户人家，女主人正带两个男孩进门，转身来热情指路，她身旁一株挂满果实的苹果树，不像被虫吃过的红通通的苹果遍地都是。


    ## 最后


    此刻我正在书房，右侧是书架，里面塞满了用来自植物的纸张印刷的书籍。


    借助书籍，人类可以分享彼此的一生。当我们追溯造物主亿万年的造化，当我们读到千年前古人不朽的文字，也能感知植物的那种轮回式的智慧和乐趣。


    左侧窗外是刚种下的桂花和樱桃树，以及马醉木。这种植物有毒，马误食后就像喝醉了。


    植物的名字很有趣，比方说玫瑰是因为好看而得此名，还是这个名字因为玫瑰好看而显得美丽？又例如樱桃是因为果实好看好吃而令其名如此性感吗？


    人类植树，布置庭院，心底是想模仿植物与时间之间的那种令人羡慕的关系。


    然而，精确而言，人的一生更像一株盆栽，《这个杀手不太冷》里杀手里昂带来带去的那种。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_118_0.png)


    里昂说：“它永远都很开心，从来都不问问题，而且也跟我一样--没有根。”


    电影的加长版里，有这样一段对话：


    > **里昂：“你也需要时间长大。”**


    > **玛蒂达：“我已经长够了，里昂。我正在变老。”**


    > **里昂：“我正好相反，我够老了，但我需要时间长大。”**


    在电影的最后，玛蒂达来到了孤儿院，将里昂生前唯一的朋友--那盆绿植移出了窄小的花盆，栽种在大地之上。


    那个盆栽叫银皇后，是多年生草本植物，株高30—40厘米，茎直立不分枝，节间明显。叶互生，叶柄长，基部扩大成鞘状，叶狭长，浅绿色，叶面有灰绿条斑，面积较大。


    根黄，豆芽状，很小。


    银皇后喜温暖湿润和半阴环境，不耐寒，怕强光暴晒，不耐干旱。


    它适合待在通风条件不佳的阴暗房间里，就像它的朋友杀手里昂一样。


    玛蒂达去的孤儿院在罗斯福岛，位于纽约。


    所以，那株回归大地的银皇后，很快就会死掉，在时间之外的阴暗空间与里昂重逢。

