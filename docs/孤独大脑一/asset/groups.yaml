    \n对人而言，是：\n\n- 强烈的动机；\n- 一个人的目标和愿望；\n- 一个人的心流。\n\n这个模型的价值比看起来有趣、有意义得多。\n\n我们由此可以解释很多让你困扰的问题。\n\
