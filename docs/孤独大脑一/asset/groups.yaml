    ## 生命游戏


    著名数学家，普林斯顿大学和剑桥大学教授约翰·康威因感染新冠病毒于2020年4月11日去世，享年82岁。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_195_0.png)


    康威活跃于有限群的研究、趣味数学、纽结理论、数论、组合博弈论和编码学等范畴。


    他年少时就对数学有强烈的兴趣：


    - 四岁时，其母发现他背诵二的次方；

    - 十一岁时，升读中学的面试，被问及他成长后想干什么，他回答想在剑桥当数学家。


    后来康威果然于剑桥大学修读数学，现时为普林斯顿大学的教授。


    康威首次提出超实数(surreal numbers)的数字系统，他本人称这是自己对数学的最大贡献。


    (以上信息来自维基百科和新闻。)


    康威是个有趣的天才，他设计了数不清的游戏。他说自己这辈子哪怕一天也没有工作过，一直都在玩游戏。


    其中最著名的一个，就是：


    生命游戏。


    ### 二


    这个游戏在一个很像围棋的棋盘上玩儿，不同的是，围棋落子在交叉点，而生命“游戏”发生在格子里。


    每个方格里会有生命细胞，要么是死，要么是活。是不是也有点儿像围棋棋子的死活？


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_196_0.png)


    这个游戏怎么玩儿呢？


    我们知道围棋的游戏规则非常简单：气尽棋亡，隔手提劫。


    “生命游戏”的规则也非常简单，在讲规则之前，先说一下规则设定的“思路”：


    生命游戏是一个零玩家游戏。它包括一个二维矩形世界，这个世界中的每个方格居住着一个活着的或死了的细胞。


    一个细胞（如下图中的黑子），在下一个时刻的生死取决于相邻八个方格中（如下图中的白子）活着的或死了的细胞的数量。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_197_0.png)


    如果相邻方格活着的细胞数量过多（如下图的黄人），这个细胞（如下图的❇□）会因为资源匮乏而在下一个时刻死去；


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_198_0.png)


    相反，如果周围活细胞过少，这个细胞会因太孤单而死去。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_198_1.png)


    实际中，玩家可以设定周围活细胞的数目怎样时才适宜该细胞的生存。


    从生命的角度看，如果这个数目设定过高，世界中的大部分细胞会因为找不到太多的活的邻居而死去，直到整个世界都没有生命；


    如果这个数目设定过低，世界中又会被生命充满而没有什么变化。


    “生命游戏” 的一个过于简单的隐喻是：


    一个人太孤独会死，太热闹也会死。


    康威为“生命游戏”设定了如下规则：


    在一个格子世界里，每一个格子里最多可以长一个细胞。细胞根据规则，一代一代地存活、繁殖或死亡。


    ### 规则一：生


    与2或3个细胞相邻的细胞将活到下一轮，如下图方块中心打绿钩的细胞；


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_199_0.png)


    ### 规则二：死


    与4个及以上细胞相邻，则因为过度拥挤而死；与1个或0个细胞相邻，则因为孤独而死，如下图中心打红叉的细胞：


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_199_1.png)


    ### 规则三：繁衍


    一个空格若与3个细胞相邻，则在下一轮时，这个空格内将产生一个新细胞，如下图中心打黄圈的细胞。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_199_2.png)


    在每一代中，生死、繁衍都是同时发生的。每一代的细胞构成了一个群体，或者说"生命历史"中的一小步。


    可以把最初的细胞结构定义为种子，当所有在种子中的细胞同时被以上规则处理后，可以得到第一代细胞图。按规则继续处理当前的细胞图，可以得到下一代的细胞图，周而复始。


    ### 三


    举个例子（来自杨洋博士），来演示一下这个游戏怎么玩儿：


    **第一代**（如下图），随机地选择某个状态。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_200_0.png)


    我们按照 “生命游戏” 的规则分析一下：


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_200_1.png)


    根据规则，下一代将发生如下变化。


    **第二代**（如下图的右下部分）


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_200_2.png)


    继续迭代，我们在第二代的基础上，按照游戏规则运行。


    **第三代**（如下图的左上部分）


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_201_0.png)


    然后，还可以继续一代又一代地演化下去，周而复始。


    这个“生命游戏”看起来太简单了，到底有什么意义呢？


    ### 四


    在这个游戏里，充满了随机性和涌现。


    初始图案会不断地变化，这些变化常常是意想不到的：


    有时候，看似很复杂的初始图案在经历许多轮之后会全部消失，或者说灭绝。


    **灭绝**


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_202_0.png)


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_202_1.png)


    有时候，会形成稳定状态。


    ### 静物


    有一些细胞的分布形态非常稳定，不管你运行几代，它们永远都保持一样的形态，毫不变化。这些分布形态就叫做静物(still life)。例如下面这些形态。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_203_0.png)


    ### 振荡器


    有时候，会形成振荡状态，在不同的图案间反复切换，这类叫做振荡器（oscillator）。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_203_1.png)


    ### 移动的振荡状态


    有时候，会形成“移动的振荡状态”。


    例如下面的“太空船”，这种图案可以在方格世界中不停地移动。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_203_2.png)


    ### 滑翔机


    例如下图，是生命游戏中的一种可持续繁殖模式：“高斯帕机枪”不断制造“滑翔机”。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_204_0.png)


    ### 五


    在康威的“生命游戏”里，随机并且简单的初始状态，看似杂乱无序，但是在极其简易的规则下，细胞会逐渐演化出各种精致、有形的结构。


    经过“演化”，有些死亡，有些静止，有些则像有生命一样移动起来，这些结构往往有很好的对称性，而且每一代都在变化形状，甚至可以跃入另一个层级的演化。


    “生命游戏”的意义在于验证了某些科学家的宇宙观，即：


    > 最简单的逻辑规则，能产生出复杂有趣的活动。


    康威的“生命游戏”，来自冯·诺依曼关于机器自我进化的思想：


    > 细胞自动机。


    细胞自动机是为模拟包括自组织结构在内的复杂现象提供的一个强有力的方法，也称为元胞自动机。


    细胞自动机模型的基本思想是：


    > 自然界里许多复杂结构和过程，归根到底只是由大量基本组成单元的简单相互作用所引起。


    细胞自动机主要研究由小的计算机或部件，按邻域连接方式连接成较大的、并行工作的计算机或部件的理论模型。


    它分为固定值型、周期型、混沌型以及复杂型。


    冯·诺伊曼设计元胞自动机的初衷是：


    为自然界的自我复制和生物发展提供一个简化理论。


    也许是物理学家们处在科学鄙视链的上游，那个年代，不只是冯·诺伊曼，薛定谔也写下了《生命是什么》，从量子物理学的角度去理解生命的本质。


    在那次传奇般的跨界演讲中，薛定谔神奇地预测：


    如果每个生物分子由1到25个字母组成的一个单词决定，并且该单词由5个不同的字母组成，那么就会有372,529,029,841,191,405种可能的不同组合——这远远超出了任何有机体中目前所知的分子类型的数量。


    薛定谔进而总结到：


    “微型密码应该对应于一个高度复杂而精准的发育蓝图，并且可能以某种方式包含了使密码起作用的程序，这一点已经不再难以想象了。”


    后来，因揭示DNA结构而获得诺贝尔奖的三位科学家，都声称《生命是什么》在他们通向双螺旋之路上发挥了重要作用。


    让我们再回到“生命游戏”和“元胞自动机”。


    元胞自动机对于生物现象的最大影响在于：


    生命的起源更像是一种相变，而进化则像是秩序和混沌之间的挣扎。


    徐彦易在《环球科学》的一篇文章里写道：


    冯·诺伊曼的追随者们感到它对生命的解释有着非凡的意义。


    在这个大背景下，康威在1970年提出了元胞自动机的最佳样本——生命游戏。


    纪录片《史蒂芬·霍金之大设计》如此介绍：


    > “像生命游戏这样规则简单的东西能够创造出高度复杂的特征，智慧甚至可能从中诞生。


    这个游戏需要数百万的格子，但是这没什么奇怪的，我们的脑中就有数千亿的细胞。”


    - 换而言之，“生命游戏”的隐喻是，我们所处的世界，生命的诞生，智慧的形成，可能也是某种“生命游戏”的结果。


    ### 六


    那么，这个世界到底有没有设计者？


    从“生命游戏”里类似“滑翔机”的图案，我们似乎可以说：在没有设计者的情况下，“设计”和“组织”也会自发出现。


    但是，上面的“滑翔机”是在康威的三条规则之下形成的。


    那么，是否可以说，造物主设计这个世界，使用了极其简单的规则，然后外加随机性？


    进而，类似于“生命游戏”所发生的方格子棋盘，是不是就是宇宙的时空结构？


    有趣的是，人们发现“生命游戏”里那些移动的图案，也有自己的不可逾越的“光速”。


    “生命游戏”用一种非常简单而且可视的方式，加上计算机的模拟演化，向我们呈现了“涌现复杂性”和“自组织系统”。


    这个复杂的世界，是否就是从几条极其简单的规则中“涌现”出来的？


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_207_0.png)


    例如，贝壳每次长一层细胞（类似于指甲），这个生长的过程就是一个一维元胞自动机。


    图示：Meinhardt, H. (1995). The Algorithmic Beauty of Sea Shells. Springer Verlag.
    pp. 179


    有人说，这个世界的“终极算法”，可能一共没有多少行代码。


    又或者如我在自己的《人生算法》里，也试图用物理和概率来探索世俗世界的“炼金术”，发现不确定世界背后的“简单规则”。


    （了解更多，请点击《人生算法》。）


    假如这么一直剥下去，这个真实的世界，会不会像钱钟书没有完成的那本小说《百合心》的书名：


    ### 生命如同百合之心，层层剥开，终至虚无？


    甚至于，如哲学家丹尼尔·丹尼特所指：


    康威生命游戏说明，复杂的哲学建构，比如意识和自由意志可能就是由一些简单的物理定律触发的，而这一切本质上是决定论的。


    ### 七


    生命游戏背后的元胞自动机思想，在地理学、经济学、计算机科学等领域得到了非常广泛的应用。


    在我看来，在商业领域，那些厉害的公司和商业模式，也是元胞自动机的随机性结果。


    尤其是在信息产业领域。


    记得微博刚出现的时候，很多人极为困惑：这是啥玩意儿啊？简单得太离谱了吧。


    的确，微博的始祖推特在2000年的产品原型手稿是下面这样的：


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_209_0.png)


    再说说现在火爆的抖音，其产品前身musical.ly也是简单得离谱。


    当然，抖音的成功，还有赖于字节跳动强大的算法与运营。


    用一个未必那么精确的类比，所谓成功的公司或者商业模式，就像“生命游戏”里“移动的振荡状态”，而且还能二次演化。


    ![](img/edee7c19bfed5e1e4689a3d1da26549f_210_0.png)


    这块儿尽管很有趣很实用，我也懒得展开写了。


    正在n次创业的我，常常这样拷问自己：


    1. 公司的那个简单的原型图是什么？

    2. 可以大规模复制的玩法（也就是规则）是什么？

    3. 方格子的舞台和边界在哪儿？

    4. 公司将涌现出什么富有生命力的形态，又将如何演化？


    ### 八


    1944年9月，薛定谔在都柏林写道：


    > 对于统一的、普遍性的知识的不懈追求，是我们从先辈那里继承下来的最好品质。


    希望你看前面的那些文字，不要简单地感慨，这不就是我们老祖宗说的“一生二，二生三，三生万物”吗？


    知道和懂得，是两回事。


    “聪明的”总结，与“傻傻的”探索，也是两回事。


    也希望你能理解，不管我写“孤独大脑”和“人生算法”时，多么喜欢用金钱和世俗的成功来比喻，都不是在试图用科学和公式来包装“成功学”。


    我是在用统计力学，来玩儿一个“人生炼金术”的游戏。游戏指向探索，而人生是背景音乐。


    自然科学和社会科学之间的“简单套用”和“浅层类比”很难，也毫无意义。


    惟一的价值也许在于一点点启发。


    维基百科说到，2004年，康威和普林斯顿的另一位数学家西蒙·B·科钦证明了自由意志定理，这是量子力学中“无隐藏变量”原理的一个特殊版本。


    该定理指出：


    在一定的条件下，如果实验者可以自由决定在特定的实验中测量什么量，那么基本粒子必须自由选择它们的自转，使测量结果符合物理定律。


    用康威的略微夸张的措辞来说，就是：


    如果实验者有自由意志，那么基本粒子也是如此。


    那么，科学研究是否会让我无所不知的拉普拉斯复活？


    康威基于随机性的游戏，是否反而揭示了“决定论”？


    无止境的探索，会否摧毁人性，导致彻底的虚无？


    我对这一点儿也不担心。


    就像费曼是个坚定的还原论者，同时也是杰出的量子物理学家和概率思考者。


    复杂与简单，随机与决定，可逆与不可逆，自由意志与拉普拉斯兽，这些对立的背后，也许存在着同一个“元胞自动机”，构建了宇宙之间的“生命游戏”。


    如歌德所说：


    存在是永恒的；因为有许多法则保护了生命的宝藏；而宇宙从这些宝藏中汲取了美。


    ## 最后


    让我们怀念一下“生命游戏”的设计者约翰·康威。


    即使多年以后，当人们想起他，仍然会记得那些好玩儿的东西。


    例如他完全沉迷在数学和游戏里，他的办公室乱到自己都待不下去，他会很可爱地在新出版的数学书后面的索引里找自己的名字以满足于虚荣心……


    他提醒我们：这个世界仍然是有趣的。


    在这个乱糟糟的岁月，请允许我胡改“生命游戏”之父康威的一个忠告：


    别理那些蠢货！在这个有趣的宇宙里，玩儿得逍遥。


    我并不责备春天，它已再次出现


    安德列•波切利，唱于米兰大教堂


    辛波斯卡，《告别风景》


    我非不责备春天，

    它已再次出现。

    我不会责怪，

    因为，年复一年，

    它履行着职责。


    我知道，我的忧伤

    并不能阻止新绿。

    叶片只在风中

    俯身。


    看到什么东西让

    水边成丛的槠木沙沙作响，

    这不会使我痛苦。


    我获得了一个消息，


    那湖汨的堤岸

    依然美丽，一如从前——

    就像你活着的时侯。


    我并不怨恨

    这景色，

    这阳光令人炫目的海湾。


    我甚至可以想象，

    此刻，

    不是我们，而是两个别的人

    坐在倒下的白桦树干上。


    我尊重他们的权利：

    低语，大笑，

    陷入幸福的沉默。


    我甚至认定，

    他们被爱绑在一起，

    他伸出有力的臂膀

    将她搂在怀里。


    也许是新孵出的小鸟

    在苇丛中窸窣作响。

    我真诚地祝愿

    他们能够听见。


    我并要求

    浪花的变化，

    它们时而迅疾，时而迟缓，

    并不遵从我命令。


    我对林边湖水的深度

    没有任何期许，

    最初是碧绿，

    随后成为蓝，

    最后又变得幽暗。


    只有一点我并不赞成：

    让我回到这里。

    我放弃——

    生存的特权。


    我比你活得更久，这已是够，

    足够我

    在远方苦苦地思念你。


    （胡桑 译）


    老喻，摄于温哥华


