    这个工具就是 CDS(Credit Default Swap信用违约互换)：相当于你给别人的房子买保险，赔钱的话算你的。


    CDS被比喻为“为大火正要吞没的房子投保，房子是别人家的”。


    就像我上面编造的帮土豪的青花瓷买保险的故事。


    CDS费率每年只要1.5%，合约的期限可以长达30年。


    用我们上面的概率计算来看，这个看起来像赌博的游戏，胜率接近100%，而爆炸的风险则很小。


