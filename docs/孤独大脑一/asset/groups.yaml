    # 时光的对冲


    “那棵树苗看样子救活了。”


    妈妈说的是桑葚树。上次我从一个华人的苗圃买来很多祖国的植物，枣树、核桃、山楂、黑柿子树、八月瓜、寒红梅、香椿、金银花、花椒树……妈妈一边嫌我买太多，一边挥舞着铁锹种下。


    唯独那株桑德树，她坚决不种。


    “桑树……伤心树，不能种！”


    可怜的小树苗，因为湖北人的“s、sh”不分，被赶出了家门。


    家对面是一条不窄的绿化带，我们将小树苗临时种在树墙下的空地上。结果没两天，园林工人开着割草车将小树苗铲断了，妈妈又去救回了残枝，只剩下指头长，上端还裂开了，怎么看都活不过来。


    “好伤心。”妈妈说。


    这个口头禅可和桑树没啥关系，她喜欢用“好伤心”来形容一切好或者不好的东西。


    坐在车上，她说：“好伤心，那时候去镇上照个相要走一天。”


    她因为不肯扔东西和我们争执，拿着喝光的牛奶瓶恋恋不舍说：“好伤心，那时候买油要摔个罐子，生怕打了。”'
  md: "\n“现在我们手上管理的资金有好几十亿，可是我们还是什么都不知道。”\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_321_0.png)\n\
    \n马克·施皮茨纳格尔在放山羊做奶酪之余，也写书。\n\n他推崇自由市场经济，信奉奥地利学派。他认为美联储和政府的不断干预反而会加剧风险累积。\n\n很有趣，他的基金正是靠这种风险累积来赚钱的，这也算是一种对冲吧。\n\
    \n马克·施皮茨纳格尔16岁开始在芝加哥期货交易所当学徒，95%的时间都在亏损。他从中学到：\n\n- “学会承受损失，以及在损失扩大成灾难之前及时抽身”。\n\
    - “我必须愿意长期看起来像个傻瓜，忍受微弱的损失来等待大赢家。”\n\n很遗憾，他的赚钱智慧对于普通人没有直接帮助。\n\n我也不相信“交易员”是一个好职业，除非你极其聪明，会一门乐器（像《大空头》里的鼓手，马克·施皮茨纳格尔会弹钢琴和吹号），以及能够做出投资之外很酷的事情，例如世界上最好的山羊奶酪。\n\
    \n马克·施皮茨纳格尔写过一本书，叫《资本之道》。封面有个大大的“DAO”，正是来自中国的道家的“道”。我还在书中看到了“Shi”这样的字眼，也许说的是“势”。\n\
    \n他放山羊做奶酪，也许是想起了庄子说的：日出而作，日入而息。逍遥于天地之间，而心意自得。\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_322_0.png)\n\
    \n列子可以御风而行，众人艳羡，说他得道了。而庄子不以为然，认为列子并不算是得道，因为他依然依靠起风。\n\n而风，并不是宇宙间的那个“常”，非恒有之物。\n\
    \n假如列子习惯于御风高高在上，假如有一天风停了呢？\n\n塔勒布则推崇用斯多葛哲学解决反脆弱的问题。就像庄子在《逍遥游》表达的“无待”：\n\n不用等待起风，不在乎他人评价，不去比较，独立而存，遗世而行。如此，方得“逍遥”。\n\
    \n对比而言，尼德霍夫太早成名，太早拿到太多冠军，他太想拿第一，太想证明自己，太想拿回自己失去的东西。\n\n罗素说：我绝不会为我的信仰而献身，因为我可能是错的。\n\
    \n别为你的信仰押下全部赌注，信奉道家或斯多葛学派，做一个贝叶斯主义者\n\n## 最后\n\n我赞成尼德霍夫的说法，人生是一场投机。\n\n但我的观点是:\n\
    \n生命不是一个靠拥有而证实的过程，而是一个因失去而证伪的过程。\n\n斯多葛哲学说：对成功者而言，能够抛弃无用的东西是必须具备的能力。\n\n忙碌的人忙于任何事情，除了生活。所以，你打算做自己的“山羊奶酪”吗？\n\
    \n马克·施皮茨纳格尔花100万美元买的湖边农场太超值了，温哥华附近的农场大概要好几倍的价格。羡慕之余，我突然意识到，也许“未来春藤”是我的奶酪？\n\n\
    从世俗的智慧来看，尼德霍夫给我的启发是:\n\n他是第一层的“聪明人”，能够在他参与的每一个领域成为最厉害的人。但是他的成功总是充满了脆 弱性，总是承受者得失之苦。\n\
    \n就像拳击台上的冠军，宿命终究是被击倒。\n\n那么，什么是第二层“聪明人”呢？\n\n我们必须上浮到世俗世界头顶的抽象空间，对人世、对自己形成超然的鸟瞰感。\n\
    \n我们要赞美这个世界，也要怀疑这个世界。\n\n我们必须知道，那些我们自以为知道的人世间规律，在无尽的未知宇宙里，只是一个非常小的过家家游戏，充满了虚妄的规则，和天真的假设。\n\
    \n## 神秘小径\n\n早上八点，绝对不会超过八点零一分，康德准时走出家门，那是他有课的日子。他的一生仿佛早被设置好，去除了一切“多余”的成分，甚至包括结婚生子。\n\
    \n与尼采一样，散步是康德生命的一部分，他始终走哥尼斯堡那段途经公园的闲静偏僻的小路。人们在他经过时，纷纷掏出自己的表来对时间。\n\n唯一的一次例外，是因为读卢梭的《爱弥儿》入迷，以致错过了散步的时间。\n\
    \n康德“遇见”卢梭并如此“一见钟情”，让人意外。\n\n卡西尔在《卢梭·康德·歌德》一书中说：也许再没有哪两个思想家像康德和卢梭一样在生活个性上是如此不同的了。\n\
    \n康德没有生活，也没有“大事”，他度过了机械地定规的差不多是抽象的独身生活，一辈子都没有离开哥尼斯堡。\n\n> “康德终生恪守书斋，从未参与任何重大的现实斗争。纵观其一生，学术乃是生活中第一大事，余皆庸常。”\n\
    \n据传，康德曾说：“当我需要女人的时候，我无力养活她们。当我有能力养活她们的时候，女人对我已不再是一种需要。”\n\n卢梭一生颠沛流离，长期远离故土，上下漂浮于各个阶层，交往过多位女性，生活中充满了无序和混乱。\n\
    \n康德理智、有序、刻板；卢梭躁动不安、紧张、激烈。康德为什么被卢梭打动，以至于他书房唯一的装饰品是卢梭的肖像？\n\n### 二\n\n卢梭不像康德那样爱散步，尽管他写过《一个孤独漫步者的遐想》。但是，生命的最后一刻他却是在散步之中。\n\
    \n我们假设历史上的某一天，康德和卢梭都来到一个叫“爱弥儿”的小镇，他们分别住在小镇的不同角落，位置如下图，蓝色的线条是道路，构成了规则的正方形：\n\n\
    ![](img/edee7c19bfed5e1e4689a3d1da26549f_326_0.png)\n\n有一天，他们不约而同地想去拜访对方，都是八点出门，以相同的速度散步，都选了最短路径，但是每个分支的选择都是随机的，请问：他们相遇的概率是多大？\n\
    \n这道题看起来简单得不该在这里出现，最短路径一共有三个，如下图：\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_327_0.png)\n\
    \n简单计算一下，假设康德随机选择了“1、2、3”当中任何一条路，那么卢梭走同一条路的可能性是1/3。有问题吗？\n\n上面看似理所当然的答案是错的。\n\n\
    因为忽略了“决策点”，以及由此带来的“条件概率”。\n\n正确的计算应该是怎样的？\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_327_1.png)\n\
    \n如上图：卢梭出门后的第一个“决策点”是黄色点，他向上或者向右的概率都是50%；\n\n他的第二个“决策点”是绿色点，他向上或者向右的概率也是相等的，考虑到前面50%的条件概率，在此基础上的向上或者向右的概率都是25%。\n\
    \n康德处于对称的位置，也是要经过红色和橙色两个决策点，概率分配（或者是平行宇宙的分裂）是一样的。所以，两个人相遇的概率计算如下：\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_328_0.png)\n\
    \n根据上图计算：\n\n- 两人在道路1相遇的概率是：50%×□25%=1/8；\n- 两人在道路2相遇的概率是：25%×□50%=1/8；\n- 两人在道路3相遇的概率是：25%×□25%=1/16。\n\
    \n所以，两人相遇的概率，是上面三个可能性之和，是5/16。\n\n我很喜欢这道题，它给我如下启发：\n\n1. 做一道题时，不要过早简化，以至于去除了有生命力的信息；\n\
    2. 从头推理，模拟过程，找出“决策点”；\n3. 本题是两个决策树相交的过程。\n\n我又想了一下，假如康德和卢梭故意不想遇到对方，他们会怎么走？\n\n\
    卢梭会选择走道路1，康德会选择走道路2。\n\n他们会很聪明地躲过彼此，无须多言。\n\n### 三\n\n康德说道：\n\n> \"我自以为爱好探求真理，我感到一种对知识的贪婪渴求，一种对推动知识进展的不懈热情，以及对每个进步的志得意满。我一度认为，这一切是以给人类带来荣光，由此我鄙夷那帮一无所知的芸芸众生。\"\
    \n\n> 是卢梭纠正了我。盲目的偏见消失了，我学会了尊重人性，而且假如我不是相信这种见解能够有助于所有其他人去确立人权的话，我便应把自己看得比普通劳工还不如。\"\
    \n\n康德称卢梭为“人性和道德领域里的牛顿”。李伟写道：就卢梭而言，他之于康德的意义，不只是在批判哲学的“主题”和“学理”，而重点是在“态度”，对待人、人性和知识的态度。\n\
    \n深受启发的康德在《道德形而上学原理》中写道：道德命令“所涉及的不是行为的质料，不是由此而来的效果，而是行为的形式，是行为所遵行的原则”。\n\n卢梭自认为《爱弥儿：论教育》是“我的所有作品中最好、最重要的一部”，在很大程度上是一篇关于人类天性的哲学论文，致力于探讨关于个人与社会关系的政治和哲学问题；特别是个人如何在不可避免趋于堕落的社会中保持天性中的善良。\n\
    \n卢梭说：\n\n> “大自然希望儿童在成人以前，就要像儿童的样子。如果我们打乱了这个次序，就会造成一些果实早熟，它们长得既不丰满也不甜美，而且很快就会腐烂。就是说，我们将造成一些年纪轻轻的和老态龙钟的儿童。”\n\
    \n卢梭在《爱弥儿》里也写道：\n\n> “人之所以合群，是由于他的身体柔弱，我们之所以心爱人类，是由于我们有共同的苦难。”\n\n卢梭先后当过镌刻匠、家仆、收税人、官吏、家庭教师、乐谱编写人、外交秘书、乐师和作曲家，折腾了一辈子，直到最后才找到了他真正的天职：思想家和作家。但直到最后，他也未曾真正“享受”过自己的名望。\n\
    \n而康德，如卡西尔所写：\n\n秩序和法则、齐一和连贯，乃是康德生命的北斗。我们知道他如何把这种一贯性贯穿到简直是微不足道的、鸡毛蒜皮的小事中。\n\n\
    对于康德和卢梭两个伟大心灵的相通，刘尔解释道：\n\n> 一个生活单调刻板至极限、终生不愿出哥尼斯堡小城一步的人，何以对人生的广泛问题有如此极具穿透力的慧眼？\n\
    >\n> 其答案，或许正在卡西尔这本书所揭示的哲与诗的关系之中——康德确实是大博大了，以至于他几乎把卢梭那颗敏感的诗心当成了自己的“第六感官\"，并假此为自己精严严明的哲思找到了最具灵性的感性和前提。\n\
    \n卢梭的一生，仿佛是康德的实验样本。\n\n于是，康德说出了那句很多人已经忘记其本意的著名句子：\n\n\"**有两样东西，人们越是经常持久地对其凝神思索，它们就越是使内心充满常新而日增的惊奇和敬畏：我头上的星空和我心中的道德律。**\"\
    \n\n卢梭的颠簸与诗意，和康德的沉静与哲学，在心灵最深处的小径100%相逢了。\n\n## 男人味儿比女人味儿更难获得\n\n每个人都是自己的国王，经常不小心将这幻觉带到自己的王国之外。\n\
    \n太多荷尔蒙或太少荷尔蒙都无法成就一场有趣的饭局。\n\n被蠢人激怒，要么证明你还不够聪明，要么证明你仍然年轻。\n\n迷人之物常常是原始的，古怪的，陌生的。\n\
    \n生不如死会让时间显得很长。所以，据统计结婚的男人活得比较久。\n\n有诚意的思考者，应该对自己的思考负责，而不是对人们是否理解这种思考负责。\n\n必须埋没足够多的智慧，才会涌现出智慧。\n\
    \n被人看出你的优越感，说明你的优越还不够深刻。\n\n不管你对自己的智慧多么自信，让诚意大于智慧总是安全的。诚意本来就是智慧的一部分。\n\n人们通过美颜相机对自己的容貌产生幻觉，但什么都不用借助就可以对自己的智慧产生错觉。\n\
    \n总体而言，网络增加了社会的蠢，因为智慧本身就难以传染，而愚蠢则会利用网络加速传染。\n\n人们期待互联网可以形成某种超越人类智慧（以及愚蠢）的超级智能，但极有可能，这个超级智能会利用并强化网络中的人类愚蠢，而不是去拯救。\n\
    \n在外星人看来，地球人对地球的赞美只是因为他们没有能力离开地球。\n\n只有“解释”（泛指一切靠“解释”谋生的事儿）这个新兴产业，才会形成如此奇怪的产业链：解释者，对解释的解释者，对解释的解释的解释者……\n\
    \n智慧极难达成共识，但基于共同利益的智慧可以。\n\n陆地生物即使来到大海的最深处，也无法理解大海。\n\n生命中的剥离总是要连皮带肉的，充满痛苦，并失去一些你本不想失去的东西。\n\
    \n好看的人或物都有某种不在意是否被观看的气质。\n\n衡量恶的标准之一是，女人可能因此失去女人味儿。\n\n这个世界的确是“男女不平等”。作为弥补，男人味儿比女人味儿更难获得。\n\
    \n有些人追求无用之事，仅仅是因为他做不了有用之事。\n\n一个富裕社会，不会要求做无用之事的人去证明自己也有能力去做有用之事。\n\n一场糟糕的对话，其后果应该由其中比较聪明的那位负责，而非归咎于比较蠢的那位。\n\
    \n蓝领工作的优点是对客户低级的愚蠢负责。\n\n智力行业的服务者比餐厅的服务者更容易遭受所谓贵宾的羞辱，因为高级的愚蠢带来更大伤害。\n\n嚣张给人以力量，旁人也喜欢恰到好处的嚣张。\n\
    \n人们习惯用昂贵的东西来比喻廉价的东西，例如会说一碗粉丝吃起来像鱼翅，而不会反过来，说鹅肝吃起来像腐乳。只有在某些罕见时刻，你在一个高级餐厅尝到一道昂贵的海鲜，好吃得像小时候啃刚摘下的黄瓜。\n\
    \n有些智慧如童子功，一旦在童年错过，成年后怎么都补不回来。\n\n儿童教育的目的，是教会他们那些有童子功属性的东西。\n\n教孩子太多成年人也很容易学会的东西，是对童年的犯罪。\n\
    \n极少数人可以利用他人经验来实现自己的理性，这不能证明理性可以不赖于经验而存在。\n\n基于自卑的自尊，充满了某种自我毁灭式的的强硬。\n\n意识的分裂并不可怕，可怕的是分裂之后的重组式变异。\n\
    \n假如赢家的权益不被保障，输家便不会“愿赌服输”，结果整个赌场（包括赌场自己）都没有真正的赢家。\n\n品味是一种蹩脚的商业竞争元素，它需要某些野蛮元素的支撑。\n\
    \n一个人利用自己的缺点，比利用自己的优点更容易做成某件事。\n\n自由不在于选择的结果当中，而是存在于选择的过程当中。\n\n对于更高维度的观察者而言，样本是没有大小好坏之分的。人之命运即样本。\n\
    \n过分讨好的人，常常也会过分抱怨。\n\n假如你想要撒一个谎，尽量减少定语和辅助信息，因为每一个多余信息都可能暴露你的谎言。\n\n真理和谎言的共同秘密是，尽量减少定语和状语。\n\
    \n免费，是指想从你身上赚得比“收费”更多。\n\n野草比你“刻意要种的草”长得还好。但假如你要刻意来种野草，它就不如“你刻意要种的草”长得好了。\n\n\
    娱乐行业最喜欢那些“能够给普通人造成天赋幻觉”的领域，例如唱歌，表演，时尚，甚至还包括智力和写作。\n\n显得有用的道理和真正有用的道理，通常不是一个道理。\n\
    \n在赌性较重的国度，人们衡量一个行业是否有前途，不是关注这个行业赚钱的平均期望值，而是热衷于这个行业的头奖有多大，哪怕概率极小，哪怕这个行业期望值极低。--这也就是彩票的原理。\n\
    \n煽情的情感不依赖于煽情的表达，甚至受损于这类表达。\n\n“其实我也想过”的感觉90%都是幻觉。\n\n不言而哈，一句话有其使用场景，需要受定语状态等的限制。\n\
    \n但是，我在本文的句子只是一种杂耍，不代表任何观点或结论，没有逻辑，没有中心思想，没有主题。\n\n如有雷同，纯属巧合。\n\n## 龙飞船成功发射的5个原力\n\
    \n北京时间5月31日凌晨3：23，  \nSpaceX 的载人龙飞船成功发射，  \n是什么力量改写了人类航天史?\n\n> 本视频并非实况。\n\n原力……\n\
    \n马斯克并非技术天才，\n\n而是一个科技包工头。\n\n我们喜欢赞埃隆·马斯克是钢铁侠那样又会搞科研又会做生意的天才，其实并不是。\n\n没错，他自学了火箭的基本原理，但是SpaceX的技术突破，靠的是一大帮有火箭技术高手和发烧友，以及NASA的支持。\n\
    \n确切说，埃隆·马斯克是一个“有梦想的技术包工头”。\n\n他理解技术，会算账，敢做梦，会忽悠，执行力超强。\n\n2001年，埃隆·马斯克诞生了“火星绿洲”这一概念：其实就是打算向火星发射一个装着植物的冲天炮，借此吸引公众对于太空探索的兴趣。\n\
    \n结果他一算账，发现生产火箭的原材料价格，仅是当时火箭售价的3%。\n\n由此他冒出了一个传统工程师看不懂的商业灵感：\n\n做一家太空运输领域的西南航空公司。\n\
    \n别忘了埃隆·马斯克有两个学位：沃顿商学院的经济学学士，宾大的物理学学士。\n\n后来，通过垂直整合，自行生产85%的发射设备及软件模块，SpaceX能将火箭发射价格降至十分之一且仍拥有70%毛利率。\n\
    \n再往后，一路坎坷，屡败屡战，直至今天。\n\n某种意义上，任正非也是“技术包工头”这类角色。\n\n（相关主题，请看《聪明人的10个工程思维》。）\n\n\
    ![](img/edee7c19bfed5e1e4689a3d1da26549f_338_0.png)\n\nNASA不是大笨蛋，\n\n是敢于扶持民企的绝地委员会。\n\
    \nNASA了不起。\n\n人们夸埃隆·马斯克的时候，会忍不住嘲讽NASA。\n\n既然如此，就要降低太空交通成本，关键在于可重复使用的火箭和飞船。\n\n\
    马斯克希望将费用降低至20万美元一人，单次至少运送100人，未来几十年里使火星人口达到数百万。\n\n这件事儿真有那么紧迫吗？\n\n近期的疫情似乎在说：有。\n\
    \n（请看一下这方面的故事：《替代者》。）\n\n更大的一个潜在风险是核弹的威胁。从统计学的计算来看，这类极小概率风险会不断累积。\n\n## 压力四\n\n\
    ## 哪有什么“用硅谷模式做火箭”，\n\n背后是充满好奇心的少年。\n\n硅谷模式就是敢于试错、不断试验的科学方法。\n\nNASA模式是指，在实际发射中，要力争做到“万无一失”，所以说：失败不是一个选项。\n\
    \n然而，二者的底层，都是无畏而严谨的科学精神。\n\n对未知科学世界的好奇心，来自那些曾经在后院做过土火箭的少年，来自那些收获了名利之后依然像孩子的企业家。\n\
    \n他们不怕摔倒，不怕受伤，没有被过早地埋葬于中年人的油腻温柔乡。\n\n好奇心的反义词是厚黑、世故。\n\n如果“只计利害，不问是非”，如果到处是面无表情、深不见底的中年的成功人士，如果连孩子也一个个被训练成大人口调、绝不吃亏的小人精，谁去造火箭？\n\
    \n## 原力五\n\n别信天才，\n\n要相信孩子。\n\n别相信天才，尤其是成年人“天才”。\n\n要相信孩子。\n\n我们要警惕那些梦想拯救世界的大人，宠爱那些梦想拯救世界的孩子。\n\
    \n别用搞男足那一套搞科学了。\n\n马斯克处在标准的中年油腻男的年龄，但他的太空梦，仍是那个十来岁少年的延续。\n\n所谓：太空梦，少年心。\n\n他一点儿也不孤独。有年暑假，我们一家去西雅图流行文化博物馆，来到科幻主题区，看到许多星球大战和星际迷航的展品。亚马逊的创始人贝佐斯正是《星际迷航》是骨灰级粉丝。\n\
    \n据说在他的多年乞求下，派拉蒙影业勉强在《星际迷航3：超越星辰》中给他安排了一个小角色。是不是让你想起了《生活大爆炸》里的谢耳朵？\n\n342\n\n\
    贝佐斯于 2000 年时成立了一家名为蓝色起源 （ Blue Origin）的载人航天，他迷恋太空旅行，同样来自童年的梦想。\n\n我记得看过，包括马斯克在内的“PayPal黑帮”们聊天，说起“谁小时候玩儿过火箭”，一半的人举起了手。\n\
    \n这些源自少年时代的冲动，既盲目、又持久，也值得安抚。\n\n在 少 年 马 斯 克 读 到 《 银 河 系 漫 游 指 南 》 时 ， 1983-1986年的中国，还是一个懵懵懂懂的乡下孩子。我们刚刚填饱肚子，用着粮票布票，挤在全厂唯一的彩电前看《射雕英雄传》。\n\
    \n现在的中国孩子，应该有比当年的少年马斯克更好的物质条件。\n\n这个话题大到要说“无用的知识”和“有用的知识”，说到宏大或细微的梦想；但请让我以一个和蔼的愿望收尾：\n\
    \n请允许孩子在院子里撒点儿野，\n\n让他们玩耍，犯错，漫无目的，\n\n让他们在考试之余不改童心，好奇依然。\n\n请允许孩子们不必非要成为“成功者”，\n\
    \n由他们向往无尽的未知宇宙，\n\n这个世界原本属于无需应允的他们。\n\n## 时光的对冲\n\n“那棵树苗看样子救活了。”\n\n妈妈说的是桑葚树。上次我从一个华人的苗圃买来很多祖国的植物，枣树、核桃、山楂、黑柿子树、八月瓜、寒红梅、香椿、金银花、花椒树……妈妈一边嫌我买太多，一边挥舞着铁锹种下。\n\
    \n唯独那株桑德树，她坚决不种。\n\n“桑树……伤心树，不能种！”\n\n可怜的小树苗，因为湖北人的“s、sh”不分，被赶出了家门。\n\n家对面是一条不窄的绿化带，我们将小树苗临时种在树墙下的空地上。结果没两天，园林工人开着割草车将小树苗铲断了，妈妈又去救回了残枝，只剩下指头长，上端还裂开了，怎么看都活不过来。\n\
    \n“好伤心。”妈妈说。\n\n这个口头禅可和桑树没啥关系，她喜欢用“好伤心”来形容一切好或者不好的东西。\n\n坐在车上，她说：“好伤心，那时候去镇上照个相要走一天。”\n\
    \n她因为不肯扔东西和我们争执，拿着喝光的牛奶瓶恋恋不舍说：“好伤心，那时候买油要摔个罐子，生怕打了。”\n"
  mdcn: "\n“现在我们手上管理的资金有好几十亿，可是我们还是什么都不知道。”\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_321_0.png)\n\
    \n马克·施皮茨纳格尔在放山羊做奶酪之余，也写书。\n\n他推崇自由市场经济，信奉奥地利学派。他认为美联储和政府的不断干预反而会加剧风险累积。\n\n很有趣，他的基金正是靠这种风险累积来赚钱的，这也算是一种对冲吧。\n\
    \n马克·施皮茨纳格尔16岁开始在芝加哥期货交易所当学徒，95%的时间都在亏损。他从中学到：\n\n- “学会承受损失，以及在损失扩大成灾难之前及时抽身”。\n\
    - “我必须愿意长期看起来像个傻瓜，忍受微弱的损失来等待大赢家。”\n\n很遗憾，他的赚钱智慧对于普通人没有直接帮助。\n\n我也不相信“交易员”是一个好职业，除非你极其聪明，会一门乐器（像《大空头》里的鼓手，马克·施皮茨纳格尔会弹钢琴和吹号），以及能够做出投资之外很酷的事情，例如世界上最好的山羊奶酪。\n\
    \n马克·施皮茨纳格尔写过一本书，叫《资本之道》。封面有个大大的“DAO”，正是来自中国的道家的“道”。我还在书中看到了“Shi”这样的字眼，也许说的是“势”。\n\
    \n他放山羊做奶酪，也许是想起了庄子说的：日出而作，日入而息。逍遥于天地之间，而心意自得。\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_322_0.png)\n\
    \n列子可以御风而行，众人艳羡，说他得道了。而庄子不以为然，认为列子并不算是得道，因为他依然依靠起风。\n\n而风，并不是宇宙间的那个“常”，非恒有之物。\n\
    \n假如列子习惯于御风高高在上，假如有一天风停了呢？\n\n塔勒布则推崇用斯多葛哲学解决反脆弱的问题。就像庄子在《逍遥游》表达的“无待”：\n\n不用等待起风，不在乎他人评价，不去比较，独立而存，遗世而行。如此，方得“逍遥”。\n\
    \n对比而言，尼德霍夫太早成名，太早拿到太多冠军，他太想拿第一，太想证明自己，太想拿回自己失去的东西。\n\n罗素说：我绝不会为我的信仰而献身，因为我可能是错的。\n\
    \n别为你的信仰押下全部赌注，信奉道家或斯多葛学派，做一个贝叶斯主义者\n\n## 最后\n\n我赞成尼德霍夫的说法，人生是一场投机。\n\n但我的观点是:\n\
    \n生命不是一个靠拥有而证实的过程，而是一个因失去而证伪的过程。\n\n斯多葛哲学说：对成功者而言，能够抛弃无用的东西是必须具备的能力。\n\n忙碌的人忙于任何事情，除了生活。所以，你打算做自己的“山羊奶酪”吗？\n\
    \n马克·施皮茨纳格尔花100万美元买的湖边农场太超值了，温哥华附近的农场大概要好几倍的价格。羡慕之余，我突然意识到，也许“未来春藤”是我的奶酪？\n\n\
    从世俗的智慧来看，尼德霍夫给我的启发是:\n\n他是第一层的“聪明人”，能够在他参与的每一个领域成为最厉害的人。但是他的成功总是充满了脆 弱性，总是承受者得失之苦。\n\
    \n就像拳击台上的冠军，宿命终究是被击倒。\n\n那么，什么是第二层“聪明人”呢？\n\n我们必须上浮到世俗世界头顶的抽象空间，对人世、对自己形成超然的鸟瞰感。\n\
    \n我们要赞美这个世界，也要怀疑这个世界。\n\n我们必须知道，那些我们自以为知道的人世间规律，在无尽的未知宇宙里，只是一个非常小的过家家游戏，充满了虚妄的规则，和天真的假设。\n\
    \n## 神秘小径\n\n早上八点，绝对不会超过八点零一分，康德准时走出家门，那是他有课的日子。他的一生仿佛早被设置好，去除了一切“多余”的成分，甚至包括结婚生子。\n\
    \n与尼采一样，散步是康德生命的一部分，他始终走哥尼斯堡那段途经公园的闲静偏僻的小路。人们在他经过时，纷纷掏出自己的表来对时间。\n\n唯一的一次例外，是因为读卢梭的《爱弥儿》入迷，以致错过了散步的时间。\n\
    \n康德“遇见”卢梭并如此“一见钟情”，让人意外。\n\n卡西尔在《卢梭·康德·歌德》一书中说：也许再没有哪两个思想家像康德和卢梭一样在生活个性上是如此不同的了。\n\
    \n康德没有生活，也没有“大事”，他度过了机械地定规的差不多是抽象的独身生活，一辈子都没有离开哥尼斯堡。\n\n> “康德终生恪守书斋，从未参与任何重大的现实斗争。纵观其一生，学术乃是生活中第一大事，余皆庸常。”\n\
    \n据传，康德曾说：“当我需要女人的时候，我无力养活她们。当我有能力养活她们的时候，女人对我已不再是一种需要。”\n\n卢梭一生颠沛流离，长期远离故土，上下漂浮于各个阶层，交往过多位女性，生活中充满了无序和混乱。\n\
    \n康德理智、有序、刻板；卢梭躁动不安、紧张、激烈。康德为什么被卢梭打动，以至于他书房唯一的装饰品是卢梭的肖像？\n\n### 二\n\n卢梭不像康德那样爱散步，尽管他写过《一个孤独漫步者的遐想》。但是，生命的最后一刻他却是在散步之中。\n\
    \n我们假设历史上的某一天，康德和卢梭都来到一个叫“爱弥儿”的小镇，他们分别住在小镇的不同角落，位置如下图，蓝色的线条是道路，构成了规则的正方形：\n\n\
    ![](img/edee7c19bfed5e1e4689a3d1da26549f_326_0.png)\n\n有一天，他们不约而同地想去拜访对方，都是八点出门，以相同的速度散步，都选了最短路径，但是每个分支的选择都是随机的，请问：他们相遇的概率是多大？\n\
    \n这道题看起来简单得不该在这里出现，最短路径一共有三个，如下图：\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_327_0.png)\n\
    \n简单计算一下，假设康德随机选择了“1、2、3”当中任何一条路，那么卢梭走同一条路的可能性是1/3。有问题吗？\n\n上面看似理所当然的答案是错的。\n\n\
    因为忽略了“决策点”，以及由此带来的“条件概率”。\n\n正确的计算应该是怎样的？\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_327_1.png)\n\
    \n如上图：卢梭出门后的第一个“决策点”是黄色点，他向上或者向右的概率都是50%；\n\n他的第二个“决策点”是绿色点，他向上或者向右的概率也是相等的，考虑到前面50%的条件概率，在此基础上的向上或者向右的概率都是25%。\n\
    \n康德处于对称的位置，也是要经过红色和橙色两个决策点，概率分配（或者是平行宇宙的分裂）是一样的。所以，两个人相遇的概率计算如下：\n\n![](img/edee7c19bfed5e1e4689a3d1da26549f_328_0.png)\n\
    \n根据上图计算：\n\n- 两人在道路1相遇的概率是：50%×□25%=1/8；\n- 两人在道路2相遇的概率是：25%×□50%=1/8；\n- 两人在道路3相遇的概率是：25%×□25%=1/16。\n\
    \n所以，两人相遇的概率，是上面三个可能性之和，是5/16。\n\n我很喜欢这道题，它给我如下启发：\n\n1. 做一道题时，不要过早简化，以至于去除了有生命力的信息；\n\
    2. 从头推理，模拟过程，找出“决策点”；\n3. 本题是两个决策树相交的过程。\n\n我又想了一下，假如康德和卢梭故意不想遇到对方，他们会怎么走？\n\n\
    卢梭会选择走道路1，康德会选择走道路2。\n\n他们会很聪明地躲过彼此，无须多言。\n\n### 三\n\n康德说道：\n\n> \"我自以为爱好探求真理，我感到一种对知识的贪婪渴求，一种对推动知识进展的不懈热情，以及对每个进步的志得意满。我一度认为，这一切是以给人类带来荣光，由此我鄙夷那帮一无所知的芸芸众生。\"\
    \n\n> 是卢梭纠正了我。盲目的偏见消失了，我学会了尊重人性，而且假如我不是相信这种见解能够有助于所有其他人去确立人权的话，我便应把自己看得比普通劳工还不如。\"\
    \n\n康德称卢梭为“人性和道德领域里的牛顿”。李伟写道：就卢梭而言，他之于康德的意义，不只是在批判哲学的“主题”和“学理”，而重点是在“态度”，对待人、人性和知识的态度。\n\
    \n深受启发的康德在《道德形而上学原理》中写道：道德命令“所涉及的不是行为的质料，不是由此而来的效果，而是行为的形式，是行为所遵行的原则”。\n\n卢梭自认为《爱弥儿：论教育》是“我的所有作品中最好、最重要的一部”，在很大程度上是一篇关于人类天性的哲学论文，致力于探讨关于个人与社会关系的政治和哲学问题；特别是个人如何在不可避免趋于堕落的社会中保持天性中的善良。\n\
    \n卢梭说：\n\n> “大自然希望儿童在成人以前，就要像儿童的样子。如果我们打乱了这个次序，就会造成一些果实早熟，它们长得既不丰满也不甜美，而且很快就会腐烂。就是说，我们将造成一些年纪轻轻的和老态龙钟的儿童。”\n\
    \n卢梭在《爱弥儿》里也写道：\n\n> “人之所以合群，是由于他的身体柔弱，我们之所以心爱人类，是由于我们有共同的苦难。”\n\n卢梭先后当过镌刻匠、家仆、收税人、官吏、家庭教师、乐谱编写人、外交秘书、乐师和作曲家，折腾了一辈子，直到最后才找到了他真正的天职：思想家和作家。但直到最后，他也未曾真正“享受”过自己的名望。\n\
    \n而康德，如卡西尔所写：\n\n秩序和法则、齐一和连贯，乃是康德生命的北斗。我们知道他如何把这种一贯性贯穿到简直是微不足道的、鸡毛蒜皮的小事中。\n\n\
    对于康德和卢梭两个伟大心灵的相通，刘尔解释道：\n\n> 一个生活单调刻板至极限、终生不愿出哥尼斯堡小城一步的人，何以对人生的广泛问题有如此极具穿透力的慧眼？\n\
    >\n> 其答案，或许正在卡西尔这本书所揭示的哲与诗的关系之中——康德确实是大博大了，以至于他几乎把卢梭那颗敏感的诗心当成了自己的“第六感官\"，并假此为自己精严严明的哲思找到了最具灵性的感性和前提。\n\
    \n卢梭的一生，仿佛是康德的实验样本。\n\n于是，康德说出了那句很多人已经忘记其本意的著名句子：\n\n\"**有两样东西，人们越是经常持久地对其凝神思索，它们就越是使内心充满常新而日增的惊奇和敬畏：我头上的星空和我心中的道德律。**\"\
    \n\n卢梭的颠簸与诗意，和康德的沉静与哲学，在心灵最深处的小径100%相逢了。\n\n## 男人味儿比女人味儿更难获得\n\n每个人都是自己的国王，经常不小心将这幻觉带到自己的王国之外。\n\
    \n太多荷尔蒙或太少荷尔蒙都无法成就一场有趣的饭局。\n\n被蠢人激怒，要么证明你还不够聪明，要么证明你仍然年轻。\n\n迷人之物常常是原始的，古怪的，陌生的。\n\
    \n生不如死会让时间显得很长。所以，据统计结婚的男人活得比较久。\n\n有诚意的思考者，应该对自己的思考负责，而不是对人们是否理解这种思考负责。\n\n必须埋没足够多的智慧，才会涌现出智慧。\n\
    \n被人看出你的优越感，说明你的优越还不够深刻。\n\n不管你对自己的智慧多么自信，让诚意大于智慧总是安全的。诚意本来就是智慧的一部分。\n\n人们通过美颜相机对自己的容貌产生幻觉，但什么都不用借助就可以对自己的智慧产生错觉。\n\
    \n总体而言，网络增加了社会的蠢，因为智慧本身就难以传染，而愚蠢则会利用网络加速传染。\n\n人们期待互联网可以形成某种超越人类智慧（以及愚蠢）的超级智能，但极有可能，这个超级智能会利用并强化网络中的人类愚蠢，而不是去拯救。\n\
    \n在外星人看来，地球人对地球的赞美只是因为他们没有能力离开地球。\n\n只有“解释”（泛指一切靠“解释”谋生的事儿）这个新兴产业，才会形成如此奇怪的产业链：解释者，对解释的解释者，对解释的解释的解释者……\n\
    \n智慧极难达成共识，但基于共同利益的智慧可以。\n\n陆地生物即使来到大海的最深处，也无法理解大海。\n\n生命中的剥离总是要连皮带肉的，充满痛苦，并失去一些你本不想失去的东西。\n\
    \n好看的人或物都有某种不在意是否被观看的气质。\n\n衡量恶的标准之一是，女人可能因此失去女人味儿。\n\n这个世界的确是“男女不平等”。作为弥补，男人味儿比女人味儿更难获得。\n\
    \n有些人追求无用之事，仅仅是因为他做不了有用之事。\n\n一个富裕社会，不会要求做无用之事的人去证明自己也有能力去做有用之事。\n\n一场糟糕的对话，其后果应该由其中比较聪明的那位负责，而非归咎于比较蠢的那位。\n\
    \n蓝领工作的优点是对客户低级的愚蠢负责。\n\n智力行业的服务者比餐厅的服务者更容易遭受所谓贵宾的羞辱，因为高级的愚蠢带来更大伤害。\n\n嚣张给人以力量，旁人也喜欢恰到好处的嚣张。\n\
    \n人们习惯用昂贵的东西来比喻廉价的东西，例如会说一碗粉丝吃起来像鱼翅，而不会反过来，说鹅肝吃起来像腐乳。只有在某些罕见时刻，你在一个高级餐厅尝到一道昂贵的海鲜，好吃得像小时候啃刚摘下的黄瓜。\n\
    \n有些智慧如童子功，一旦在童年错过，成年后怎么都补不回来。\n\n儿童教育的目的，是教会他们那些有童子功属性的东西。\n\n教孩子太多成年人也很容易学会的东西，是对童年的犯罪。\n\
    \n极少数人可以利用他人经验来实现自己的理性，这不能证明理性可以不赖于经验而存在。\n\n基于自卑的自尊，充满了某种自我毁灭式的的强硬。\n\n意识的分裂并不可怕，可怕的是分裂之后的重组式变异。\n\
    \n假如赢家的权益不被保障，输家便不会“愿赌服输”，结果整个赌场（包括赌场自己）都没有真正的赢家。\n\n品味是一种蹩脚的商业竞争元素，它需要某些野蛮元素的支撑。\n\
    \n一个人利用自己的缺点，比利用自己的优点更容易做成某件事。\n\n自由不在于选择的结果当中，而是存在于选择的过程当中。\n\n对于更高维度的观察者而言，样本是没有大小好坏之分的。人之命运即样本。\n\
    \n过分讨好的人，常常也会过分抱怨。\n\n假如你想要撒一个谎，尽量减少定语和辅助信息，因为每一个多余信息都可能暴露你的谎言。\n\n真理和谎言的共同秘密是，尽量减少定语和状语。\n\
    \n免费，是指想从你身上赚得比“收费”更多。\n\n野草比你“刻意要种的草”长得还好。但假如你要刻意来种野草，它就不如“你刻意要种的草”长得好了。\n\n\
    娱乐行业最喜欢那些“能够给普通人造成天赋幻觉”的领域，例如唱歌，表演，时尚，甚至还包括智力和写作。\n\n显得有用的道理和真正有用的道理，通常不是一个道理。\n\
    \n在赌性较重的国度，人们衡量一个行业是否有前途，不是关注这个行业赚钱的平均期望值，而是热衷于这个行业的头奖有多大，哪怕概率极小，哪怕这个行业期望值极低。--这也就是彩票的原理。\n\
    \n煽情的情感不依赖于煽情的表达，甚至受损于这类表达。\n\n“其实我也想过”的感觉90%都是幻觉。\n\n不言而哈，一句话有其使用场景，需要受定语状态等的限制。\n\
    \n但是，我在本文的句子只是一种杂耍，不代表任何观点或结论，没有逻辑，没有中心思想，没有主题。\n\n如有雷同，纯属巧合。\n\n## 龙飞船成功发射的5个原力\n\
    \n北京时间5月31日凌晨3：23，  \nSpaceX 的载人龙飞船成功发射，  \n是什么力量改写了人类航天史?\n\n> 本视频并非实况。\n\n原力……\n\
    \n马斯克并非技术天才，\n\n而是一个科技包工头。\n\n我们喜欢赞埃隆·马斯克是钢铁侠那样又会搞科研又会做生意的天才，其实并不是。\n\n没错，他自学了火箭的基本原理，但是SpaceX的技术突破，靠的是一大帮有火箭技术高手和发烧友，以及NASA的支持。\n\
    \n确切说，埃隆·马斯克是一个“有梦想的技术包工头”。\n\n他理解技术，会算账，敢做梦，会忽悠，执行力超强。\n\n2001年，埃隆·马斯克诞生了“火星绿洲”这一概念：其实就是打算向火星发射一个装着植物的冲天炮，借此吸引公众对于太空探索的兴趣。\n\
    \n结果他一算账，发现生产火箭的原材料价格，仅是当时火箭售价的3%。\n\n由此他冒出了一个传统工程师看不懂的商业灵感：\n\n做一家太空运输领域的西南航空公司。\n\
    \n别忘了埃隆·马斯克有两个学位：沃顿商学院的经济学学士，宾大的物理学学士。\n\n后来，通过垂直整合，自行生产85%的发射设备及软件模块，SpaceX能将火箭发射价格降至十分之一且仍拥有70%毛利率。\n\
    \n再往后，一路坎坷，屡败屡战，直至今天。\n\n某种意义上，任正非也是“技术包工头”这类角色。\n\n（相关主题，请看《聪明人的10个工程思维》。）\n\n\
    ![](img/edee7c19bfed5e1e4689a3d1da26549f_338_0.png)\n\nNASA不是大笨蛋，\n\n是敢于扶持民企的绝地委员会。\n\
    \nNASA了不起。\n\n人们夸埃隆·马斯克的时候，会忍不住嘲讽NASA。\n\n既然如此，就要降低太空交通成本，关键在于可重复使用的火箭和飞船。\n\n\
    马斯克希望将费用降低至20万美元一人，单次至少运送100人，未来几十年里使火星人口达到数百万。\n\n这件事儿真有那么紧迫吗？\n\n近期的疫情似乎在说：有。\n\
    \n（请看一下这方面的故事：《替代者》。）\n\n更大的一个潜在风险是核弹的威胁。从统计学的计算来看，这类极小概率风险会不断累积。\n\n## 压力四\n\n\
    ## 哪有什么“用硅谷模式做火箭”，\n\n背后是充满好奇心的少年。\n\n硅谷模式就是敢于试错、不断试验的科学方法。\n\nNASA模式是指，在实际发射中，要力争做到“万无一失”，所以说：失败不是一个选项。\n\
    \n然而，二者的底层，都是无畏而严谨的科学精神。\n\n对未知科学世界的好奇心，来自那些曾经在后院做过土火箭的少年，来自那些收获了名利之后依然像孩子的企业家。\n\
    \n他们不怕摔倒，不怕受伤，没有被过早地埋葬于中年人的油腻温柔乡。\n\n好奇心的反义词是厚黑、世故。\n\n如果“只计利害，不问是非”，如果到处是面无表情、深不见底的中年的成功人士，如果连孩子也一个个被训练成大人口调、绝不吃亏的小人精，谁去造火箭？\n\
    \n## 原力五\n\n别信天才，\n\n要相信孩子。\n\n别相信天才，尤其是成年人“天才”。\n\n要相信孩子。\n\n我们要警惕那些梦想拯救世界的大人，宠爱那些梦想拯救世界的孩子。\n\
    \n别用搞男足那一套搞科学了。\n\n马斯克处在标准的中年油腻男的年龄，但他的太空梦，仍是那个十来岁少年的延续。\n\n所谓：太空梦，少年心。\n\n他一点儿也不孤独。有年暑假，我们一家去西雅图流行文化博物馆，来到科幻主题区，看到许多星球大战和星际迷航的展品。亚马逊的创始人贝佐斯正是《星际迷航》是骨灰级粉丝。\n\
    \n据说在他的多年乞求下，派拉蒙影业勉强在《星际迷航3：超越星辰》中给他安排了一个小角色。是不是让你想起了《生活大爆炸》里的谢耳朵？\n\n342\n\n\
    贝佐斯于 2000 年时成立了一家名为蓝色起源 （ Blue Origin）的载人航天，他迷恋太空旅行，同样来自童年的梦想。\n\n我记得看过，包括马斯克在内的“PayPal黑帮”们聊天，说起“谁小时候玩儿过火箭”，一半的人举起了手。\n\
    \n这些源自少年时代的冲动，既盲目、又持久，也值得安抚。\n\n在 少 年 马 斯 克 读 到 《 银 河 系 漫 游 指 南 》 时 ， 1983-1986年的中国，还是一个懵懵懂懂的乡下孩子。我们刚刚填饱肚子，用着粮票布票，挤在全厂唯一的彩电前看《射雕英雄传》。\n\
    \n现在的中国孩子，应该有比当年的少年马斯克更好的物质条件。\n\n这个话题大到要说“无用的知识”和“有用的知识”，说到宏大或细微的梦想；但请让我以一个和蔼的愿望收尾：\n\
    \n请允许孩子在院子里撒点儿野，\n\n让他们玩耍，犯错，漫无目的，\n\n让他们在考试之余不改童心，好奇依然。\n\n请允许孩子们不必非要成为“成功者”，\n\
    \n由他们向往无尽的未知宇宙，\n\n这个世界原本属于无需应允的他们。\n\n## 时光的对冲\n\n“那棵树苗看样子救活了。”\n\n妈妈说的是桑葚树。上次我从一个华人的苗圃买来很多祖国的植物，枣树、核桃、山楂、黑柿子树、八月瓜、寒红梅、香椿、金银花、花椒树……妈妈一边嫌我买太多，一边挥舞着铁锹种下。\n\
    \n唯独那株桑德树，她坚决不种。\n\n“桑树……伤心树，不能种！”\n\n可怜的小树苗，因为湖北人的“s、sh”不分，被赶出了家门。\n\n家对面是一条不窄的绿化带，我们将小树苗临时种在树墙下的空地上。结果没两天，园林工人开着割草车将小树苗铲断了，妈妈又去救回了残枝，只剩下指头长，上端还裂开了，怎么看都活不过来。\n\
    \n“好伤心。”妈妈说。\n\n这个口头禅可和桑树没啥关系，她喜欢用“好伤心”来形容一切好或者不好的东西。\n\n坐在车上，她说：“好伤心，那时候去镇上照个相要走一天。”\n\
    \n她因为不肯扔东西和我们争执，拿着喝光的牛奶瓶恋恋不舍说：“好伤心，那时候买油要摔个罐子，生怕打了。”\n"
