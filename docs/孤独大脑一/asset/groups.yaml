    # 四个角分别是：


    - 1、大脑与算法的交叉点：AI。


    创造了阿尔法狗的Deepmind公司的CEO哈萨比斯，就是横跨脑神经科学与计算机科学的天才；


    - 2、科学与算法的交叉点：硅谷模式。


    价值假设和增长假设，是把科学家精神，与企业战略、数字经济完美结合在一起。科学试错在虚拟经济中发扬光大。亚马逊的飞轮，Facebook的增长黑客，释放了惊人魔力。


    以“试错”为内核的科学方法，贯穿“认知飞轮”的九段，用的是以“科学方法之试错＋互联网和AI之加速”，而得出的加速试错的方法：


    - a. 生成、验证，形成可评价的闭环，大量试错，以区别相关性与因果性；

    - b. 找到底层机制，但又要意识到“结论”以及“常识”都只是暂时的；

    - c. 人生是一场永无终结的实验本身。


    # 3、科学与人文的交叉点：认知心理学、行为经济学、非理性的原动力。


    丹尼尔和阿莫斯的天赋与努力，令人们终于将认知心理学和行为经济学视为科学。


    # 4、商业决策人文的交叉点：愿景，使命，自由意志，心流，价值观。


    伟大的企业表明，文化和价值观具有强大的“计算力”，能够带领企业穿越迷雾。


    # “中腹”


    我们似乎在这个棋盘上，发现越来越多的内在关联与巨大秘密。


    阿尔法狗战胜人类围棋第一高手，背后的目的，是为了探索一种通用算法，我们也可以称之为终极算法。


    那么，在我们的“认知地图”之上，存在着某种“终极算法”吗？


    围棋有句谚语：金角、银边、草肚皮。意思是说角最有价值、边次之，棋盘中间的价值最小。


    围棋里还有一句谚语：高手在腹。从阿尔法狗的棋谱看，它对肚皮的重视与擅长程度，远超人类。


    围棋棋盘最中央的那一点，我们称之为天元。即：底层算法。


    # 底层算法


    什么是底层算法？让我继续用渺小而强大的蚂蚁来比喻：


    - 1、人和人之间的差别没那么大，就像蚂蚁之间不会有太大差异。就像桥水基金老板说的，“我阅人无数，没见过有人天赋异禀。”

    - 2、你自己就是一个蚁群。每时每刻，每个决策的你，每个行动的你，就是一只蚂蚁。无数个不同时刻的无数个你，叠加在一起，构建了一个智能系统。

    - 3、蚂蚁之间的传输控制协议，是这个智能系统的算法。不同时刻的你之间的关系和连续性，是你的算法。

    - 4、该算法采用了强化学习--机器学习的一种。它能像alpha zero一样自我学习，不断进化。


    我们要“机器学习”，而非成为简单的学习机器。


    我们当中的大多数人，为什么不能成为很厉害的人？


    1、我们的认知系统，都是建立在钟表宇宙里的。然而现实却充满不确定性，不可预测，难以计算。这既是我们的痛苦之源，也是那些厉害的人的秘密。


    2、问题还不止于此，我们甚至无法真正控制“自我”。大脑中并不真正存在一个中心，“我”只是由无数个“涌现”串起来的电影角色。


    3、进一步，我们花时间试图控制不可预测的那些东西，却对自己自暴自弃。


    我们的知识都是牛顿时代的，我们的行为方式是牛顿时代的，我们的学习方式，也是牛顿时代的。


    厉害的人是怎么做的？


    他们既承认大多数物质系统具有复杂性质，又知道，钟表式科学的这种典型策略在封闭环境依然是奏效的。


    所以，他们尝试在个人半径里，来打造“机器”。


    这个“机器”，既有符合牛顿力学的机器的意思，又是“机器学习”。


    让我们看看对强化学习的描述，它强调如何基于环境而行动，以取得最大化的预期利益。其灵感来源于心理学中的行为主义理论，即有机体如何在环境给予的奖励或惩罚的刺激下，逐步形成对刺激的预期，产生能获得最大利益的习惯性行为。


    你的动机、欲望、热爱、梦想、自我认知、价值观，负责实施奖惩的刺激。


    哈佛大学心理学家罗伯特·凯根说：


    > “从出生开始，我们便踏上持续学习（Learning）和成长（Developing）的旅程。这两股力量往往交织在一起，但又不尽相同。如果仅仅是知识储存量的增加（in-formation），以既有的思维模式来运算资料，谈不上真正的学习，更谈不上成长。成长是指思维模式本身发生改变（trans-formation）。”


    是的，我们大脑神经是可以后天塑造的，每秒即逝的那个“我”，并没有被不可逆的时光之河裹挟而走，而是被写入“我”的底层算法。


    这种控制与相应，与“扔个石头到水中能听到一声响”完全不同。所以经常看起来是模糊的，遥远的，不确定的，甚至是反人性的。


    然而，我们只能控制我们可以控制的，让其他涌现而来。


    # 还原论与“涌现”


    还原论，是一种哲学思想，认为复杂的系统、事务、现象可以通过将其化解为各部分之组合的方法，加以理解和描述。


    涌现，强调的是一种整体突现性质，这些词最初用来说明：一定有机体水平上所具有的实体性质不可能还原为更低水平上的要素之和。


    对还原论、决定论、钟表般精确的宇宙等概念的反思，产生了整体论、突现论等思想，这些思想强调，生命现象（如意识、本能）作为一种组织特征不可能通过其组成要素的特征来解释，或者说，组织行为不可能还原为其要素行为之和。


    对于还原论和涌现论，我的观点是：


    - 1. 这个世界的法则正在由“因果论”转为“概率论”；

    - 2. 如劳克林所说：一个人类通过微观来主宰万物的思想被无数事实扫地出门的时刻。这不是说微观法则是错的或是没用了，而是说在很多情形下被它的孩子和孩子的孩子，即较高的世界的组织法则，认为是无关的；

    - 3. 但涌现论并不能否认还原论，在科学研究的基本方法上，我们仍然需要还原论。即使是极力推崇“涌现论”的物理学家，本质上都是还原论者。


    还原论，决定了你是否有机会进入高手的行列；


    涌现论，决定了你是否有机会成为超一流高手。


    基于此，人生算法是：


    - 1. 以还原法，剖析认知闭环。认知闭环，作为认知的基本单元，对应于科学的分子、原子、细胞、DNA；

    - 2. 以涌现法，阐述了一个人是由不同时间点的无数个认知闭环构成的“复杂系统”。每个认知闭环，就像是一只蚂蚁，单个蚂蚁也许不聪明，但（基于认知飞轮的）蚂蚁社会却涌现出了超凡的智能。


    # 总结


    “认知飞轮”，解决“不充分”的这一内部世界的难题，实现“正确地做事”；


    “概率分层”， 解决“不确定”的这一外部世界的难题，实现“做正确的事”。


    关于正确地做事，认知飞轮提出了：


    好奇感知，灰度认知，黑白决策，疯子行动；


    关于做正确的事，概率分层提出了：


    扩大认知半径，控制探索半径，减小行动半径。


    人生算法的实施框架是；


    - 1. 以还原论的方法，建立了“认知飞轮”的基本单元；

    - 2. 通过从初段到九段的升级，打造一个自动化的、不断进化的“认知机器”

    - 3. 以概率论的方法，建立了“外部世界”的基础框架，引入“涌现+复杂”的世界观与行事方式；

    - 4. 以加快的“强化学习”，让自己的“认知机器”在复杂环境中不断演进，从“思考自动化”，跃升为“学习自动化”。


    # 最后


    几乎所有的文字，都是与现实对冲的谎言。它以坦率的对当事人已经发生之事的忏悔或评价，妄图营造出现实中无法获得的完美平衡。


    2008年我“按计划”在35岁退休，移民到加拿大。全家搬去是2010年，那时我开始琢磨研究“思考的本质”。这不是什么宏大的理想，和我热衷于数码产品没啥差别，只是某种孩童式的好奇，亦因此而“单纯”。


    我写孤独大脑，是该探索的文字呈现。前三年订阅数没超过7000，在小范围内传播，承载了我的独自思考，与身在异国的岁月变迁。


    我试图探索的，是不随空间和时间摇摆的“元命题”，与学术、鸡汤、干货都无关系。这动机始于童年，很庆幸其无暇未被成年岁月染尽。


    加国的静谧与祖国的喧嚣，横跨太平洋的十多个小时的时差，温哥华的清凉与深圳的燥热，绞肉机般赋予了孤独大脑“雅努斯”般的写作氛围。


    叔本华写道：从根本上说，只有我们独立自主的思索，才真正具有真理和生命。因为，惟有它们才是我们反复领悟的东西。他人的思想就像加别人餐桌上的残羹，就像陌生客人挪下的衣衫。


    就像童年时我去过一个好玩儿的沙滩，有很细的沙，很美的石头。我忍不住要告诉好朋友自己的经历和体验，希望他们也能去玩儿。《人生算法》有类似的愿望：捡起鹅卵石，不是为了收藏，而是扔进水中，打出水花。


    我希望能够和你一起去探索。只有你投身进来，参与其中，以批判性思维独立思考、批判，并代入个人的具体“参数”，在生活和工作中亲身实践，方有价值与意义。


    是认知重构，而非认知集邮。


    不确定性是对自由意志的赞美。随机性如阳光，个体命运是土壤里的一粒冒出芽的种子。


    大自然的算法，提供了一个未知的不确定游乐场。


    但是其中确定性的部分，例如刚好够孕育出生命的地球，几乎100%会在第二天升起的太阳，浓度刚好的氧气，任你瞎折腾依然自动运转的身体器官，亲友给你的毫无理性的爱，足够养活你，溺爱你。


    具备上述要素的游乐场，在宇宙间出现的概率非常非常低。


    其实你我都是中了类似的宇宙头奖来到地球。我们在运气上不同的地方，远小于1%。


    在这个不确定游乐场，你要勇敢些，别纠结，向前看，玩开心哈！


    # 病毒时期的概率


    请你来做一个测试题：


    - A. 如果社会上流行一种致命的疾病，染病的人会在-一周之内没有痛苦地死掉。你染上这种病的概率是千分之-。请问，假设你有可能染病，那么你愿意最多花多少钱来预防得这种病?


    - B. 同样是这种病，假设你的老板要派你到疫区调查情况。到了疫区之后，你染上这种病的概率是千分之-。请问你的老板要给你多少赔偿，你才愿意到疫区去?


    这道题，来自2017年诺贝尔经济学奖得主塞勒。当他还在罗切斯特大学读博士时，发现了某个“奇怪”的现象（这一点要最后才说），于是设计了如上那个问卷调查问题。


    塞勒的研究生论文题目是“生命的价值”。我们通常会说生命无价，怎么能为其估价呢?


    没错，鲜活的生命无法估价，而从经济角度“统计意义上的生命”，也许是能估价的。


    塞勒引用了谢林论文中的一段：


    > “如果一个6岁的挪威小女孩需要几千元美元来做手术，这样她才能活到圣诞节，人们寄去救她的钱就能塞满邮局。但是，如果取消征收-项销售税，马萨诸塞州的医疗设施就会老旧损耗，导致本可通过疾病预防措施就可避免的死亡人数增多，却没有几个人会流下同情的泪水或是捐款。”


    我们可以看到：


    - 医院代表“统计意义上的生命”；

    - 女孩代表“可识别的生命”。


    接下来，塞勒举了一个例子，来描述过“生命定价”的难题。


    假设我们正在修建一条新公路，安全工程师告诉我们中央隔离带如果加宽1米需要耗资4200万美元，但这样做可以在未来30年里平均每年减少1.4次死亡事故。我们应该加宽隔离带吗？


    显然，在现实中，我们不得不为生命定价。


    这件事从道义的角度来说很难，从技术的角度来说也不容易计算。


    塞勒最终找到了一种计算方法：


    去找到那些高危工作的额外薪水，以及该职业的死亡率，然后通过概率倒推，来估算出生命的价值。


    比方说吧，假如电影里有个家伙用左轮手枪去玩儿俄罗斯转盘游戏，六个弹夹里装了一发子弹，如果这个人在单次游戏中，愿意为十万美元扣动一次扳机，那么他给自己的生命的估价就是：


    $10\text{万美元} \div \frac{1}{6} \text{（死亡概率）} = 60\text{万美元}$


    塞勒的这项研究成果，至今仍被美国政府用于成本-效益分析。2015年，该国一个生命的价值约为700万美元。


    在《错误的行为》一书中，塞勒论述的重点并非生命的价值，而是行为经济学的奇怪现象。但在本文中，我想带出的，正是“生命的价值”这个话题。


    先用塞勒预热，再来说说梁建章近期的文章《隔离的经济账》，也许会显得“和谐”一些。


    在防疫的关键时刻，人命关天，怎么可以给生命估价？


    梁建章想说的是：


    隔离成本和过度防御。


    人命帐和经济账没办法分开算。


    先说微观。


    例如，像井下矿工、超高建筑施工等岗位，死亡风险高很多，但我们不能简单说取消这些岗位。


    所以，按照塞勒的理论，社会应该为这些岗位的人赋予更高的报酬，来购买他们的死亡概率。


    否则，社会为之付出的整体代价更大。


    再比如说，即使最好的汽车的安全系数已经很高了，但我们还是要允许厂商生产气囊数量不是那么多的入门版车型。


    不考虑成本的话，有可能汽车仍然是极少数人专享的“时间机器”（就像私人飞机）。


    事实上，人类为道路交通付出的代价是惊人的：


    每年，道路交通事故在全球造成约 130万人死亡，2000万至-5000万人受到非致命性伤害。道路交通事故是所有年龄组的主要死亡原因，也是 15-29岁年轻人的主要死亡原因。


    对于管制部门而言，必须从统计数据出发，关注统计意义上的生命。


    同时，官方应该做的，是强制执行的下限标准，而非要求所有人尽善尽美。


    再说宏观。


    研究表明：


    人均收入每增加一倍，在其他条件大致相仿的情况下，人均寿命就会增加1-3年。


    梁建章做了一个毛估估的量化计算：


    - 一般来说，发达国家生命的价值在10-60倍的人均GDP之间。

    - 假设生命的价值按照30倍的人均GDP来计算，人的一生按照80岁约等于30000天来计算。


    $30000 \text{ 天} = 30 \times \text{人均 GDP}$

    $\rightarrow 300 \text{ 天生命} = 30\% \text{的 GDP}$

    $\rightarrow 1\% \text{的 GDP} = 10 \text{ 天的生命}$


    - 那么，从数学上来讲，人均GDP每减少1%，人均寿命就会减少10天左右。


    基于这个数字，梁建章算了个经济账：


    - 一次大面积的流感，对于整个人类社会的影响，相当于人均寿命减少1.5天左右。

    - 假如因为流感，对30%的人隔离14天，就会损失 $30\% \times 14 / 365 = 1\%$ 的GDP。

    - 如上所述，1%的GDP倒退实际上会使整体的社会在医疗、基础设施和环境治理方面的倒退，人均寿命就会减10天左右。


    一个是1.5天，一个是10天，隔离对"生命"造成的伤害，远远大于流感造成的损失。


    当然，这只是一个思想实验。并不代表我们就该像面对流感那样，来对待2020年的这次莫名肺炎。我赞成所有对上述"算账"不满意的人们的反对观点，我自己对隔离等政策没有任何态度。


    但是，从计算的角度看，大规模的隔离，可能导致统计意义上的生命损失，也就是人均寿命降低100天甚至更多。


    过度重视，与此前过度忽视一样，都是非理性的。


    探讨统计意义上的生命，绝非忽略可识别的生命，如北野武所说：


    > “灾难并不是死了两万人这样一件事情，而是死了一个人这件事，发生了两万次。”


    # 三


    财新记者综合多位一线危重症救治专家的数据和意见发现，即使在医疗干预的情况下，新冠肺炎患者的病征概率发展如下：


    - 有15%-20%会发展成重症病人；

    - 重症病人25%-30%会发展成危重症；

    - 危重症新冠肺炎病人的死亡率，在10%-20%之间，最高可达30%-40%。


    这几个数据，第一眼看到，会感觉非常震撼。


    但仔细算一下，我取了相对高的值，初期患者的死亡率是：


    $20\% \times 30\% \times 20\% = 1.2\%$


    实际上，官方截止近日的数据是：


    在湖北，新冠状病毒感染的死亡率是2.8%；在中国其他地方，死亡率是0.2%。


    这个数字仍然不低，但也显得不像单独看“重症、危重症、死亡”三者之间的概率关系那么惊人。


    上面这个简单的概率计算方法，还告诉了我們，冠狀肺炎的防护和治疗，应是一个体系工程。武汉病患很不幸有如此高的死亡率，是因为一时间医院资源紧缺，出现了类似于金融的挤提。


    # 四


    统计意义上的概率计算，绝非数字游戏。


    19世纪初，伦敦霍乱肆虐，动辄夺走数万人的生命。


    （以下素材来自《霍乱时期的理性》）


    1848年的夏天，35岁的斯诺开始正式挑战传统的毒气瘴气学说，去探寻霍乱流行的原因。


    凭借着顽强、科学和理性，斯诺采用了一种“对照研究”的方法，最终提出自己的理论：


    > 霍乱是在病人摄入了一种尚不明确的物质而导致的，这种物质存在于其他已患病病人的排泄物中，摄入的途径要么是通过直接的接触这种物质，要么（更加可能的方式）是饮用了被这种物质污染的水。


    现代流行病学延续着斯诺的研究标准：回顾一个特定的时段，匹配对照的条件，观察疾病的频率和分布，推断和确定事件的决定和影响因家。


    另外帮助了斯诺的重要角色，是一个叫法尔的人。


    法尔在报告中记录了全伦敦的某年内的霍乱死亡数为7466例，其中4001例在Thames河的南边。用这个数据可以计算分区的死亡率。南区的霍乱死亡率为千分之八，是全城的三倍，而西北郊区的为千分之一。


    结合这些数据，斯诺认为伦敦的致命霍乱，来自水源传播。


    即使如此，直至英年早逝，斯诺都没有得到当局的承认。然而，他开创了一门强大的学科，并被誉为现代流行病学之父，我们每个人都受惠于他。


    科学方法+概率计算，让人类活得越来越久。


    **人类与病毒的斗争，是一个长期的复杂系统。我们既要关注每个鲜活的生命**，**也必须从“统计意义上生命”的角度出发，用科学的方法去探寻解决之道。**


    # 五


    让我们从两个角度来理解这种复杂性：


    **1、人与病毒之间的复杂性。**


    > 约翰·霍普金斯大学健康安全中心的传染病医师阿梅什·阿达尔贾说：“流感病毒的存在本身并不是致人死亡的原因。传染病总是与其宿主有复杂的互相作用。”


    在大多数病例中，人体感染流感病毒后，由于试图恢复自身健康，而最终杀死了自己。


    我们看到新闻中提及美国流感惊人的死亡人数，是因为在流感死因统计里，世界卫生组织和美国疾控中心将其分为直接死亡原因、间接死亡原因和根本死亡原因。各国的统计方法不一样。


    **2、抗击病毒的社会复杂性。**


    我在得到App的《人生算法》里提过一个故事：


    “911”之后，很多美国害怕坐飞机，于是选择开车长途旅行。因此而不幸死于车祸的人数，远远超过飞机事故。


    我不愿也不能去分析非常时期各种死亡概率的此消彼长，但是我们要理解和承认这种复杂性。


    **尤其是对于决策者，永远只能在迷雾中进行决策。**


    我所说的“灰度认知，黑白决策”，就是指要在不确定的环境下，在信息有限的条件下，避免简单思维，用科学的、量化的概率计算，来支持果断的决策。


    全社会在高度聚焦冠状病毒肺炎的抗击中，也别忘记了许许多多灰度区域的人群。


