    我和外孙聊过这个话题。史前年代，人们仍可讨论概率的时候，我发现了一个有趣的事情，不管一个人多么聪明，数学多么好，也很难真正做到理解概率。


    假如一个人不会从心灵层面，感触到一点点对概率的怅然，就不算真的懂了。


    我：在现实中，当人们讨论起这个不幸遇难者的命运，永远只会去说那戏剧化的、宿命般的出门前的一分钟，仿佛一切都是那60秒所决定的。没有人会讨论百万分之一。


