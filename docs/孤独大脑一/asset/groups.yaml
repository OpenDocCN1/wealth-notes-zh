    ## 反省

    人们常反省自己的恶习，直至这反省也成为恶习的一部分。


    ## 黄峥的“三位一体”算法


    40岁的黄峥，是中国仅次于马云的富豪。


    在送掉100亿美金之后，黄峥仍然拥有350亿美元的财富。而这一切，在短短的5年之内发生，并且只能在这个时代的中国发生。


    关于拼多多的奇迹，人们有各种分析。两年前黄峥被各种怀疑的时候，我写过一篇《你们都在笑拼多多，我买了点儿他的股票（“拼多多简史”之一）》，那时拼多多股价跌到十几块。


    直到现在，还总有人说自己因此赚了钱，又问我是否还拿着股票。


    很遗憾，我不是专业投资者，赚钱的人也纯属自己运气好，跟我没什么关系。


    关于拼多多的分析，有很多维度，例如从传统商业看中国的“不均可”的潜力，从电商竞争的角度看突破点，从社交电商的角度看商业模式，从技术的角度看AI的魔力......


    然而，所有这些分析都忽略了一个最本质的因素：创始人。


    没错，研究拼多多的文章，都会提及黄峥并不复杂的经历。


    但只是感慨他年轻，聪明，运气好，有贵人相助，仅此而已。


    本文将给出拼多多如此厉害的本质原因，那就是：


    黄峥个人的“算法”。


    ### 二


    先说结论：


    **黄峥的个人算法是：“三位一体”的创业者。**


    这“三位”，是：发明者，管理者，投资者。


    - 1、**先说发明者。**


    这是指黄峥的技术背景，以及拼多多公司的算法基因，和庞大的工程师队伍。


    黄峥最早与“大佬”们搭上，是因为丁磊找他解决某个技术问题。


    拼多多宣称的“分布式AI”，实现了“以消费者为导向，在消费者习惯的场景提供高性价比的购物体验”的产品优势。


    当然，公司不是实验室，黄峥也不是高精尖的天才，拼多多在技术上体现出了极大的灵活性和工程优势。


    他像数字时代的爱迪生，而不是特斯拉。


    因为这种灵活性和执行力，拼多多得到了腾讯在流量上的巨大支持。


    - 2、再说管理者。


    这次黄峥不当CEO，是计划“花更多的时间和董事会制定公司中长期战略，研究完善包括合伙人机制在内的公司治理结构。”


    段永平的带路，加上黄峥的悟性，让拼多多的管理一开始就有某种少年老成的成熟。


    黄峥一方面强调“本分”，认真地讲愿景和价值观；


    另一方面，刚创立时拼多多就在打打杀杀中冲出来。有多少创业者熬得住被经销商在楼下围攻？


    这种反差，让我想起看《滚雪球》时，书呆子巴菲特和芒格为了所投公司，赤膊上阵与工会斗争的场景。


    管理就是担当，是打仗，是为资本负责，拼的是真刀真枪。


    以上两方面矛盾吗？一点儿也不。


    本分，首先是不骗自己，做正确的事。骗别人最大的坏处是，最后把自己也骗了。这是黄峥从段永平那里学到的最重要的东西。


    本分和人品没啥关系，本分其实就是“理性”，是一切思考、计算、决策中的第一因素。


    所以，黄峥讲公司的愿景，也很真诚，虽然不是煽动人心那种。


    因为愿景和使命这类似乎很虚的东西，最能给股东带来长期的回报。


    我猜测他是亚当·斯密和达尔文的信徒。


    商业美德不是自我标榜，而是一种理性的选择。


    - 3、第三说投资者。


    黄峥讲自己对价值投资属于“天生就懂”。段永平也说过，这类东西，懂的人点一下就知道了，不懂的人一辈子也懂不了。


    听起来很宿命论，但可能就是事实。


    黄峥经营拼多多的关键秘密之一，是价值投资思维。


    当然，说起价值投资，巴菲特说自己是懂投资的企业家，懂经营的投资者。一脉相承。


    你有没有想过，为什么拼多多可以疯狂烧钱，疯狂补贴？这个和其技术基因似乎有点儿矛盾啊。


    黄峥给出了答案：


    如果把创业过程中的各种决策都当做是投资决策，那么我们去分辨我们用时间和钱换来的东西哪些是资产（asset）哪些是费用（cost），那些随着时间流逝、对加深生意的护城河有利的往往是“资产”，那些时间越久对自己越不利的可以看成是费用。


    没错，很多烧钱的公司，烧的是费用。


    而拼多多，烧出来的是资产。


    要做到这一点，又需要强大的企业数字中枢。


    简单说，就是算得出投入产出，算得过总账，算得出长期的账。


    由此，拼多多的第一封致股东信里说：


    拼多多将是个勇于投资未来，立足长远的公司。它有时可能看起来激进，有时显得过于保守，但它其实都是遵循一个简单的一贯逻辑，那就是专注于这个机构的内在价值。


    你看，“发明者、管理者、投资者”这三个角色，是不是说着说着就一体了？


    ### 三


    其实，“发明者、管理者、投资者”三位一体的家伙，还有一个人。


    那就是贝佐斯。


    - 1、作为发明者，贝佐斯和黄峥一样，是数字化时代的工程师，毕业于普林斯顿，学的是计算机，毕业后去华尔街做软件工程师。

    - 2、作为管理者，贝佐斯很幸运地是在西雅图创业。这个美国西北角的城市非常奇怪，除了诞生了微软，还有波音、星巴克、Costco等一大堆伟大的公司。贝佐斯就曾经得到了Costco创始人的指点，算是开了管理的天眼。

    - 3、作为投资者，贝佐斯在华尔街混过，也是价值投资的信徒。


    但是，对于数字化的公司，价值投资怎么玩儿？这一点连巴菲特也没看明白。所以他和芒格都为自己居然没买亚马逊的股票而懊恼。


    贝佐斯想明白了一件事，在虚拟的数字化世界里，一样是有“资产”的。


    我称之为“数字化房地产”。


    没错，这个世界最赚钱的生意，仍然是房地产。只是，发生在数字世界。


    贝佐斯想明白了一件事，这件事巴菲特很晚才理解。那就是：


    亚马逊的价值在于提供近似于水电的基础设施服务。


    加上从Costco创始人那里的偷师，亚马逊打出了“超低价+巨量+微薄利润”，大量吸引用户，形成规模效应后，以更低的基础设施成本和更低的价格吸引更多用户，形成飞轮效应。


    此外，贝佐斯对于“自由现金流”的理解和运用，也与巴菲特的价值投资同宗同源。


    看起来是不是眼很熟？


    没错，这也是拼多多的打法。


    很多人怀疑：拼多多这么补贴，能赚钱吗？


    也有人说：烧钱换来的客户，能持久吗？


    更有人问：靠便宜货打五环外的市场，如何进入主流呢？


    这些想法，压根儿没有理解拼多多的商业模式的本质。


    ### 最后


    总结一下，“发明者、管理者、投资者”三位一体的创始人，是拼多多崛起的最大秘密之源。


    从这个角度看，这家公司的奇迹，得益于“算法驱动+愿景驱动+价值驱动”，分别对应了“发明、管理、投资”这三个核心词。然而，未来竞争将更激烈。


    **对于投资人而言**，假如你想要发现下一个拼多多，可以用这个“三位一体”模型套一下，去研究公司的创始人和当家人；


    **对于年轻人而言**，如果你将来想成为一个黄峥这样的牛人，需要拥有一个更多元（而一体）的能力框架。


    ## 流浪之城


    ### 1999年•火车


    老喻：


    你好吗？


    让我们来做一个游戏。


    - 你告诉我一个“早知道就好了”的道理；

    - 我给你讲一个你忘掉了的故事。


    我是在去深圳的火车上给你写这封信。这是最早的一班，路上大约要两三个小时，但票价只有快车的一半。


    从石碑村出发去广州东站时，天还没亮。火车还是绿皮的，音乐是《春天的故事》，天呐，1997过去这么久了，为什么还放这个音乐？


    我一切都好。手上在做的⼯作正要发芽，尽管眼前仍无迹象，我心底早已看见。倒不是因为远见，而是别无选择。


    可别人看不到。


    为了躲避房东，我去中山图书馆混了一天，不过不是看书，而是看了两场记不住名字的录像。


    再后来，搬去城中村。农民的房子，以不能更低的租金，成为这个城市最后的收留之地。


    棱和棱之间近得可以握手，一道狭窄的阳光射入暗黑的房间。


    虽然光线只有两厘米宽，却有100%的亮度；虽然某刻只照到某个角落，却能扫过100%的桌面。


    现实有一点点让人绝望，但我从未对其失望。


    小喻


    1999年


    ### 2020年•花园


    小喻：


    我很好。


    此刻是温哥华最好的季节，初夏阳光炎热，空气却是清凉的。


    怕热的你居然在湿热的广州停留了15年，一个人关于时空的命运是多么不可思议。


    人们钟爱久远到与世隔绝的记忆。然而我仍然在你的岁月余波之中。就像我远在万里之外，也没能间隔大洋彼岸的牵挂。


    其实你并不需要我的道理，我也未必忘记了你讲给我的故事。


    我在怀疑你我之间的连贯性。如爱因斯坦所说，时间的先后也许只是一个持久而顽固的幻觉。


    在围棋的世界观里，现实是一个棋盘，过去、现在、未来都平铺在上面。


    一道神秘的光线，正如你那时黑暗小屋里的狭窄光线，轻轻扫过我们的一生。


    ### 时光是矗立还是平铺？


    倘若两周后的某个时刻，将有某件事令你不爽，那么，对于“时光矗立者”来说，即使该事并不影响未来两周，但那事已潜入时光的空中楼阁，提前压在你头顶14楼之上。


    而且，即使这件事过去了，它依然在你脚下的楼层泛出异味。


    对于“时光平铺者”而言，则是安然行进于时空的苍茫大地之上。


    就像我昨天驱车于加拿大西部的菲莎河谷，壮阔的崖壁之间，远处的暴雨仿佛是云朵下的淋浴，只打湿了一小片大地。


    晴朗和阴部同时发生，那大约就是过去和未来的样子。


    我们只是穿行其间。


    所以，就生活而言，时光也如房子般，容积率越低越舒服，平铺、延展、可串起，而不必彼此压迫。


    你与我无关，亦无需对我负责。


    我们彼此之间是完全陌生的。


    老喻


    2020年


    ### 2000年•书吧


    老喻：


    我从未想过你将成为一个什么样的人。我有限的努力，也不是为了你，而是为了让此刻的我更安宁一些。


    出租车绕行在高架桥上时，朋友们望着四处的高楼和塔吊说，深圳哪里有这么多的人来买房子啊？


    我也不知道。我只知道自己的那本起初无人看好的地产书卖得很好，公司的生意像草原上的野火，隔不久就要换个办公室。


    最会做生意的地产公司在广州，最会做产品的地产公司在深圳，我往返于两地，并混迹于万科周刊论坛。


    我认识了挺多有意思的人。


    一切像是春季的初芽，微不足道，势不可挡。


    快到年底的时候，我们总在一个新开张的书店聚会。那里有酒，有弹唱歌手，有书，有年轻的男男女女，有种种可能。


    在一个流浪的城市，到处都是流浪的青年。这间书店在一个剧场般的三岔路口，像是影视城里的布景，真假难辨。


    它原本是一个底商，可是在某种奇妙的聚光灯的作用下，一切与剧情无关的元素都被拿掉了，像是西部片里初始小镇的独立小木楼。


    进门时，你既能感受到某种庄重的仪式感，又如步入童话世界般无需为结局担忧。


    书店的名字叫"物质生活"。


    小喻


    2000年


    ### 2019年•无关


    小喻：


    当我们相约，从各自的时间节点，向中间汇合，心底竟有点儿不该有的好奇。


    该忐忑的不是你吗？


    因为，我们的交汇之处，对你而言是未来，对我来说是过去。


    你并非我的因，我也不是你的果。我们是交织在一起的时间变量。


    作为未来的我，像树干向上展开的枝桠，但我只是其中的一枝，并不比小树芽般的你更广阔，因为无限的其它可能性要么消失，要么潜入地下变成前途未卜的种子。


    被打开的人生的黑盒子是不可逆的。你奔向我，是过去将来时；我奔向你，是将来过去世。


    时间并非整齐而连续，现实不是记忆的原料。无论我们多么努力，都无法摆脱世俗的庸常。惟有记忆能够消除迷雾，以叠加另外一层迷雾的形式。


    我们所感知的世界，正是多重加工的产物。


    今年我做了很多事。在时光的长河中，我仍旧是随波逐流的。


    你还记得1995年你在大学毕业留言册上的那句话吗？


    关于工作的理想，你写道：


    有钱去做与钱无关的事情。


    前半截我不确认自己做到了，但我现在开始做后半截的事情了。


    老喻


