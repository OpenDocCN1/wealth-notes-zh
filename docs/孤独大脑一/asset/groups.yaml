    ## 三


    事实上，在经历了多年隔离之后，人类已经习惯了以家庭为单位来生活。从家庭隔离到个体隔离，最大的挑战是家庭成员的分离。


    地球联盟的AI实验室研发出一种以假乱真的替代机器人，可以与真人建立起一种映射关系。


    比方说，一家四口，父母姐弟。虽然被分别隔离在四个不同的空间里，但是每个空间里都有一个真人和三个替代人。


    以父亲为例，全球联盟为他准备了替代人妻子、替代人女儿和替代人儿子。


    而他的真实的妻子，在另外一个单独的隔离空间里，拥有替代人丈夫、替代人女儿和替代人儿子。


    替代机器人并非简单模拟真人，而是与真人完全建立起一种实时的“映射”。


    所以，在四个不同的隔离空间里，发生着一模一样的事情，不管从理论上，还是从体验上，父母姐弟几乎都还算是生活在一起。


    同时，完全屏蔽掉了病毒在人和人之间的传播。


    据一个由真人和超级AI联合组成的研究机构调查表明，人类的幸福度反而增加了。


    原因之一是，在真人和替代人的映射之间，有个一秒左右的“混乱调谐器”，用于缓冲可能产生的不确定性。例如家人之间偶然的情绪失控与争吵。


    由于人类的一切都独自在单独的盒子里发生，超级智能稳妥有序地接管了人类繁杂事务，战争、犯罪、贪婪、污秽，似乎一夜之间全部消失了。


    全球联盟因此做出一个决定：人类不再需要随机性了。


    在一个极度安稳而美好的世界里，人们可能的随机性，以及由此引发的欲望，会破坏那些牢不可破的个体隔离盒子。


    全球联盟委员会认为，只有建立全新的伦理体系，才能让人类安全渡过这次有史以来最急促的生活倾覆。


    经过一场彻底的文化革新，随机性作为一种概念，被消除了。


    2040年，成为人类新元年。


    此前，被归为史前文明。


    ## 四


    我和小男孩约在一个秘密的虚拟聊天室里。


    2050年，贩卖一切与“随机性”有关的东西，都是违法的。


    我必须小心谨慎。


    男孩：为什么飞机会坠毁？史前太可怕了。


    老喻：史前的飞机事故率约为百万分之一，几乎是最安全的交通工具。一个美国男孩坐上飞机那一刻，他遇难的概率比当上美国总统的概率还要低。


    男孩：幸好这类事今天再也不会发生了。


    小男孩所说的史前，是指2040年之前。


    他说飞机再也不会失事，是因为现在所说的飞机，基本上是指星际飞船。


    在2028年之后的第五次病毒袭击之后，世界上最后一家航空公司也破产了。此后的飞行器都由机器人操作，归属于地球联盟。


    消除了随机性概念的世界里不会有飞机坠毁这类事件，即使其不可避免地仍会发生，也将被"反随机校准器"修复。


    老喻：这么说吧，几乎每个经常坐飞机的人都会担忧。比方说，你选择了a航班，因为出门时耽搁了一分钟，所以多等了十分钟地铁，所以错过了a航班，你不得不选择b航班。


    人们潜意识里就会想，万一b航班不幸出事，那么我出门耽搁的这一分钟是不是就成了致命的60秒？


    男孩：但是反过来，假如a航班出事了，那么这耽搁的一分钟不就成了救命的60秒？


    我明白了这个小男孩为什么会找到我。塔勒布说过，理解数学是件天生的事情。以我的观察，理解概率更是如此。


    小男孩有着惊人的理解随机性的天赋，就像一个雨后临时形成的水坑里来由地冒出一只生命力顽强的小蝌蚪。


    老喻：假如这个人不幸在a航班空难中丧生。请问以下哪一种反事实思维更容易发生--


    - 1、如果飞机没有坠毁；

    - 2、如果大卫·彼得搭乘的是另一架飞机。


    男孩：反事实1发生的概率是一减去百万分之一，反事实2发生的概率是50%。


    老喻：那么，这个人不幸遭难的随机性原因，是选择a航班或者b航班的50%，还是a航班失事的百万分之一？


    男孩：是航班失事概率的百万分之一。在这个人出门的那一瞬间，a航班和b航班的失事概率是相等的。


    老喻：但是，在现实中，当人们讨论起这个不幸遇难者的命运，永远只会去说那戏剧化的、宿命般的出门前的一分钟，仿佛一切都是那60秒所决定的。没有人会讨论百万分之一。


    男孩：看起来，随机性在"发生前"和"发生后"看起来似乎不一样。


    老喻：很久以前，有个叫阿莫斯的人在笔记中写道：


    > "依据明影理论，备选状况或者可能出现的场景决定着我们对现实的预期，决定着如何看待现实、如何回顾现实、如何对现实做出解释，同时，也决定着我们会因之陷入何种情感状态。"


    男孩：什么是现实？


    老喻：现实就是一团充满各种可能性的云彩。


    小男孩的虚拟成像在我面前默不作声，流露出童年所特有的那种天真和忧伤。


    对于一个没有机会在现实中触碰随机性的孩子而言，不管他多么有天赋，都无法真正理解"可能性"的真实含义。


    我突然感觉到：成年人毫无希望，只有小孩子值得拯救。


    然而，我要救的人，不是他。


    待续……


    # 聪明人如何成功?


    第一部分，是我为谷歌前CEO埃里克·施密特新作《成就》写的推荐序；


    后面两个部分，是我的两个预言：**教练**和社区，会成为创业者和公司的两个机会点。


    第二部分（第一个预言），讲的是如何向最厉害的人**影响**。秘密就是主动寻找教练（导师）；


    第三部分（第二个预言），讲的是一直被我们忽略的“**社区**”，可能成为个人和公司的新价值点。


    三个部分合在一块儿，也不算太夸张《聪明人如何成功》这个心智的标题。


    ## 一、敏锐并温暖着


    > “你是否需要用世俗的成功来证明自己？”这是每个聪明人都曾经纠结过的事情。


    聪明人总想着仗剑走天涯，无须去理会人世间那些琐碎无聊的事情，依然可以征服世界，成就斐然。但事实并非如此，即使被视为天才的谷歌创始人也不能例外。


    谷歌的创始人之一拉里·佩奇说：“年少时，第一次考虑自己的未来时，我决定要么当个教授，要么创建自己的公司。我觉得，这两种职业都可以给我足够的自主权，让我自由地从基本物理原则出发思考问题，而不必去迎合那些所谓的“世俗智慧”。


    然而，真的可以绕开“世俗智慧”，去取得“世俗成就”吗？


    聪明人要取得世俗意义上的“成就”，最缺的是什么？《成就》这本书，就是从与众不同的角度，来解答这个问题。假如你是个“聪明人”，我推荐你看一看。


    这本书的主角比尔·坎贝尔被誉为万亿美元教练，他曾经帮助很多顶级聪明人最终取得成功，其中就包括谷歌的创始人佩奇，以及苹果的创始人乔布斯。


    他是如何做到的？聪明人可以从他的方法中收获什么？


    《成就》讲述的是一个“硅谷最高机密”的故事。一个传奇的橄榄球教练，征服了世界上最聪明的一帮家伙，帮助创业公司成长为亿万级企业。


    这本书给出了不少对创业者和管理者很有用的理念、工具和方法，你不妨在阅读中去自己发现。而我想从另外一个角度，与你探讨《成就》一书所引发的思考，即聪明人为什么无法成功？


    我在比尔·坎贝尔伟大的职业生涯中，发现了这一悬念的三个解答。


    解答一：聪明人想要成功，必须学会榨干自己。


    聪明人往往有很高的“峰值智慧”，用读书时候的话来说，就是别人不会的题他会做，但大家都会做的题，他反而会丢分。


    比尔·坎贝尔打橄榄球时，个人条件非常有限，但他却能榨干自己的全部能量。所以，他不仅散发出极其耀眼的个人光芒，还激发了整个团队。


    聪明人不愿意竭尽全力，一方面是因为“不愿意”，另一方面是因为“不能”。


    不愿意，是因为聪明人总想让自己表现得举重若轻，认为“玩儿命于”是笨蛋才做的事情。


    不能，是因为秤干自己其实是另外一种天赋。


    硅谷是个顶尖聪明人扎堆的地方。比尔·坎贝尔就像闯进瓷器店的大象，他毫不介意自己的“粗鲁”与“看起来不够聪明”，打碎了聪明家伙们的“不愿意”。


    体育带给一个人的最大价值之一，就是提升“压榨力”。从橄榄球教练，到硅谷天才们的教练，比尔·坎贝尔探索出了某种模式，从生理和心理两个层面，让聪明人学会了如何榨取出自己的最大输出功率。


    **解答二：聪明人想要成功，必须构建“个人系统”。**


    比尔·坎贝尔在苹果公司有一段很长的光辉经历，他是乔布斯最信任的人之一。他曾经竭力反对董事会炒掉“混蛋乔布斯”，又曾目睹乔布斯在脱胎换骨之后，重返苹果，创造出史诗般的复兴。


    在这个过程中，比尔·坎贝尔发现了一个秘密：人们总以为“个人魅力”是很重要的领导力，而真相是，乔布斯直到成了优秀的经理人，才成为真正的领导者。


    只有构建了“个人系统”，聪明人才有可能打破“聪明却无法成功”的诅咒，在商业上取得一番成就。


    **解答三：聪明人想要成功，必须实现“自身规模化”。**


    “自身规模化”，来自里德·霍夫曼的《闪电式扩张》一书。


    当我们谈及乔布斯和马斯克时，总喜欢赞誉他们是罕见的天才。甚至有很多人认为，马斯克是现实版的钢铁侠，完全靠自学成为电动车和火箭专家。


    事实上，马斯克更像是一个技术包工头，他靠吸引了一帮顶尖技术高手而创造了奇迹。


    这同样是乔布斯的秘密。这位狂人认为苹果公司最重要的秘密之一，不是别的什么，而是组建了了不起的团队。


    和人相处，绝非聪明人的强项。例如乔布斯和马斯克看起来都像个浑球儿，为什么他们能够吸引到一流人才为他们卖命呢？


    个人魅力的东西我们学不来，但《成就》一书给出了比尔·坎贝尔关于团队打造的“最高机密”，这些内容也是我作为一名二次创业者迫切想要学习的。


    最后再说说比尔·坎贝尔最触动我的两点：


    - 1. 聪明人必须摆脱“证明自己聪明”的执念；

    - 2. 聪明人也可以做到热情、温暖、善良。


    谷歌创始人佩奇与亚马逊创始人贝佐斯，在谈及比尔·坎贝尔时，都不约而同地用了相似的表达：他有敏锐的头脑和温暖的心。


    用成就他人来成就自己，这句话很俗，但比尔·坎贝尔用充满爱和被爱的耀眼一生，践行了这一点。


    ## 二、向厉害的人偷师


    这部分，是我对个人创业者（也包括职场人士）的一个预言，也算是个建议：


    找一个厉害的人做自己的导师，会成为一种风尚。


    我们的文化里原本有“认师傅”的传统。不过这类认师傅，往往双方都心事成重，过于兴师动众，也伴随着太多利益的纠葛。


    比尔·坎贝尔的“企业教练”的角色，非常值得我们借鉴推广。


    我在得到App的“邵恒头条”里，写过如下这些文字。


    自己做重大决策，心里常常没底。你觉得有必要跟身边的长辈或者是公司里的上级有意识地建立导师关系吗？选派成为人生导师呢？


    回答：做好决策的的确是一件不容易的事情，你需要懂得决策的基本规则，需要相关领域的经验，还要有理性。你甚至还要犯很多错误。


    所以，和身边的长辈或者公司的上级建立导师关系当然是很好的办法。不过还有另外一种路径，你可以通过“向最厉害的人偷师”，来快速地获取决策经验。


    说到人生导师，我想给你介绍一个年轻人，Airbnb创始人Brian Chesky。


    我们都知道，和巴菲特吃顿午餐是特别贵的事，2019年的价格已经超过了3000万人民币。不过，Brian Chesky这个年轻人，他曾经足足向巴菲特问了4个半小时的问题，还没把巴菲特问烦。巴菲特还主动邀请他吃午餐，他一分钱都没花。


    接下来，我就要用Chesky的例子，来教教你怎么“向最厉害的人偷师”。具体来说，我有四个建议：


    - 1. 追根溯源

    - 2. 充满好奇心

    - 3. 不怕丢脸

    - 4. 立即实施


    我们先看第一点“追根溯源”，找到权威。


    刚才说到的Chesky，他在每次去请教之前，都会研究和确定一个领域最权威的人是谁，然后直接向这个人去学习。


    这个方法其实也是美国前国防部长麦克纳马拉非常推崇的。他曾经说过这么一句话，“身处战争或创业中的人只能以最直接的方式去学习”。换句话说，没有时间浪费在那些不够权威的人身上。


    所以你会看到，Chesky向别人请教的时候，总会找到最权威的人。


    比如说，他会向苹果公司的乔纳森·伊夫去学习设计理念，向迪士尼公司的鲍勃·伊格尔学习管理才能，向Facebook创始人马克·扎克伯格去学习对产品的追求。


    当然，有的时候他选择导师也有点出人意料。比方说他想要学习酒店管理经验，他并没去著名酒店，而是去了一家有名的餐厅，来学习这家餐厅如何款待客户和摆放食物。


    当然了，要想到这样的“追根溯源”，首先一个前提就是，你得能通过深度思考去发现问题的本质。


    这就是我给你的第二条建议：充满好奇心。


    寻找导师，不能是为找而找，你必须有一个强烈的好奇心，脑子里得有一个真问题。如果没有问题而盲目聊天，那肯定是达不到效果的。


    如果你有强烈的好奇心，那么你的好奇也会引发导师的好奇。比如巴菲特就对Chesky创立的Airbnb非常好奇，他当时还说过，“真希望这是我自己想的”。你看，只要有好的想法，两个人就可能会有惺惺相惜。


    你可能会说，Airbnb那么有名，Chesky当然有机会见到那些名人，而我们这些无名之辈，该怎么办呢？


    其实，Airbnb在创业初期的时候也只是一家小公司，Chesky四处敲门也不是没有吃过闭门羹。可是，他表现了一种不怕丢脸的学习精神，我觉得非常值得我们每个人学习。


    这也是我给你的第三条建议：不怕丢脸，快速行动。


    比如说，Chesky和几位创业者总是软磨硬泡，想要请求YC的创始人格雷厄姆和他们谈谈。但是格雷厄姆很忙，是一个大咖，他并没有那么多的时间给每一个创业者。那怎么办呢？他们就决定硬闯，一定要把导师堵在办公室里，一定要说上两句。他们总是第一个到，最后一个走，比别人更不怕丢脸，也比别人更加勤学好的。


    你可能会说，这不是招人嫌吗？


    其实，即便是厉害的人物也是从毫无经验的小白进化来的。如果他们看到那些特别勇于探索、孜孜不倦想要寻求答案的人，他们有可能也会发自内心地去欣赏和帮助他们。


    最后，我要说到最重要的一个建议，当你从导师那里获得建议之后，你应该立即实施。


    你向导师请教的目的不是为了聊天，而是为了实践。


    Chesky见完巴菲特之后，为防止忘记，就在抵达机场以后，立刻写了篇3600字的报告分享给团队成员。


    而且，他马上就把从导师那里“偷”来的智慧复制到了整个公司。比如说，启动了“周日之夜系列”活动，总结一周学到的经验。再比如说，他会通过邮件与全公司员工交流，让新雇员每礼拜参加1小时的Q&A会议等等。这些都是他从巴菲特那儿“偷”来的经验。


    还有另外一位投资人，叫赛贝尔。他就称赞Chesky说，“他不会花很多时间去想象后果，而是会积极行动”。这位投资人每次告诉Chesky去查阅某项资料，他都会立即去行动。


    我在《人生算法》课里，其实也提到过行动的重要性。乔布斯曾说过，做事的人和做梦的人最大的差别就在于，能不能马上开始行动。乔布斯自己就特别喜欢直接打电话给某个领域最厉害的人请教问题，根本不在乎是否被拒绝。


    ## 三、重新发现社区价值


    《成就》这本书里提及的比尔·坎贝尔，让我格外感受到了一个关键词：社区。


    刚到加拿大的时候，我发现，官方、企业、学校、各类机构，包括个人，都在反复说要服务好社区，为社区创造价值。


    后来我才意识到，他们说的社区，与我们说的社区不是一回事。


    比尔·坎贝尔在人格上格外耀眼之处，并不是一个特例。


    他帮助普通人，哪怕身份悬殊；他以大教练的身份去指导小毛孩儿，他能够与萍水相逢者成为交心的朋友……这些行为在我们的文化里很罕见，但是在美加的社区文化中，其实并不奇怪。


    我家老二在温哥华曾经参加一个课后的足球俱乐部，老师是位意大利人，职业教练出身，教一帮八九岁的小男孩时毫不含糊，而且永远充满热情和幽默感。


    孩子们参加的童子军，全部是由义工操办。我记得其中有一位英国来的女士，在医院做护士，很忙很辛苦，每周仍然抽出三天来为童子军服务。


    加国是个很“碎”的移民国家，各个族裔各玩儿各自的。人们生活中没有特别宏大的事情，本国首富是谁也没人关心，大家就关心孩子去哪里游泳，周末去哪里野餐。


    有位移民告诉我，他有点常上海来的朋友去社区的小公园儿玩儿，他的朋友看了说：这算啥呀，简直连上海游乐场的百分之一都不如。


    这位移民回应说：这个社区公园虽然不大，但是我步行几分钟就能到，孩子们几乎每天都来玩儿滑梯。你说的那个大游乐场，也许一年就去几次吧。


    我不想给“社区”贴上国家或者文化的标签。事实上，中华民族的宗族文化，计划经济时代的工厂，记忆里的街坊，都是特别了不起的“社区”。这今为止，我小时候最美好的记忆，就是20世纪80年代初期工厂里乌托邦式的和睦和欢乐。


    并非“回忆压倒一切”，历史的前行和改革的活力，总是在让这个世界变得越来越好。


    只是，财富的步伐太快，社区的灵魂没跟上。


    社区，亦称社群、共同体或礼俗社会，是由19世纪德国社会学家滕尼斯提出，指与“社会”相对的通过血缘、邻里和朋友关系建立起来的人群组合。


    后来也指：因为共享共同价值观或文化的人群，居住于同一区域，以及从而衍生的互动影响，而聚集在一起的社会单位。


    我预言：“社区”，可能成为当前个人和公司的新价值点。


    为什么这么说？


    与当下稍微缓和的新冠疫情有关。


    这场百年不遇的冲击，让隔离在家的人们重新理解了家和社区的价值与意义

    '
