  - '[PAGE 377]


    有一个价值两亿的明朝青花盘，被一个土暴发在家里的客厅炫耀。有次你去他家做客，发现他家有三个熊孩子，每天打打闹闹，经常打坏东西，家长呵斥也没用。


    你心想，尽管主人很小心，早晚那个盘子会被熊孩子们毁掉。


