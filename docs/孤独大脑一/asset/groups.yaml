  - '[PAGE 411]


    我赞成你的“时光平铺论”。倘若如此，对于时光的评价，就不该用“此刻”之果实的大小，而是由“过去、现在、未来”所构筑的形状。


    所以，比例比绝对值重要，火焰比木材重要，温差比温度重要，得失比占有重要。温和的得失比剧烈的得失重要。


    好吧，也许这些都是借口。我仍然在频繁出差，每周飞三四次。


