    他看到新闻说加拿大的科学家可能在两年后发明出特效药物，孩子般笑着说要坚持两年，然后去加拿大。


    他再次用自己的双肩扛走了我人生中被设定了比例的那部分不幸，在幻想中静静地熄灭了。


    他是试图实现里的骑士，一辈子都在将就，他将最强大的一面，全部用在我身上，关键的时刻总是挺身而出。


    生命的悲剧是，你试图寻找史诗般的广阔画面时，那段人生已经结束。


    你所说的那个仿佛让时间静止的肥皂泡，绽碎了。


    我卖掉了公司。


    我们登陆了太平洋彼岸的陌生国度。'
