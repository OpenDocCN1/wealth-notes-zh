    \n# 有琴霁月\n\n日常穿LC或PH，集氣CGSS、全家Volks 14口、LL\n关注 02 / 1 粉丝 540\n\n我的同学的父亲顺利住院治疗了，她总结了亲测有效的两个救助方式，希望能帮助但正在苦苦寻医的确诊患者：\n\
