    ## 40、电子钟价格如何？


    ## How Do Electric Clocks Rate?


    Electric clocks today are the closest approach anyone has yet made to the ideal
    of a completely accurate, chore-free way to tell time.


    They eliminate clock-winding. They''re accurate to the minute. But here''s even
    bigger news for many: most popular electric clocks actually cost less than the
    leading wind-up clocks!


    Wind-ups are powered by springs that need to be wound periodically throughout
    their lives. Old-type alarms, for instance, need two windings. The "time" spring,
    and the "alarm" spring. Every night.


    In contrast, you plug in an electric clock and forget it. Electric clocks never
    need winding. They are powered by tiny electric motors that run in precise time
    with the 60-cycle current in your home.


    This particular kind of motor was invented by Henry E. Warren of Ashland, Mass.
    It is the motor that makes modern electric time possible.


    The first clocks using this motor were built in 1916, but ran head-on into trouble
    ... they gained or lost time every day. The cause, it turned out, was electric
    current that


    didn''t stay at a steady 60 cycles. To correct this, the inventor had to develop
    a Master Clock which almost all power stations now use to maintain an exact 60-cycle
    output.


    As with most new products, the earliest electric clocks were expensive, costing
    from $25 up. Today, electric alarms and colorful electric kitchen clocks sell
    for as little as $3.98 plus tax!


    Electric clocks have brought other changes to timekeeping: color, styling, modern
    design, new materials for cases. There are electric desk clocks, wall clocks,
    mantel and occasional clocks. Their styles range from ultra-modern suspended mobiles
    to nostalgic early American designs. And the leading brands bear trusted names:
    General Electric and Telechron—direct descendants of the original Warren-invented
    electric clock.


    Everything considered, electric clocks today are the best, most practical means
    of telling time. They are a vital part of our modern electric age, in which electricity
    does more and more to make life easier and more enjoyable! Clock and Timer Dept.,
    General Electric Co., Ashland, Massachusetts.


