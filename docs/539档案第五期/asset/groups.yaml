    # 25、这次不要自己来


    ![](img/e18e480d5d97a6b8fafe6f4c5de21452_108_0.png)


    # This is not a “do-it-yourself” kit!


    Think back to the last time when you felt less chipper than usual. Chances are
    someone, wholly unqualified, but with the best of intentions, told you what to
    do or what to take for your “run-down condition” or “nervous state” or recurring
    aches and pains.


    Such advice makes it appear that the practice of medicine can be a sort of “do-it-yourself”
    activity. Actually, self-diagnosis and self-treatment can be extremely risky.


    Medicines, except for the usual household remedies, are safe only when prescribed
    by your family physician who knows their properties.


    For instance, even a “mild” cathartic, if taken for what seems to be just a stomach
    ache—but which is actually an unsuspected attack of appendicitis—may cause the
    most serious complications.


    One of the most wasteful and possibly dangerous forms of self-medication is the
    use of over-the-counter reducing remedies. Although such products are often “guaranteed”
    to reduce weight quickly and easily, don’t be taken in by the glowing promises.


    When it comes to drugs or diagnosis or treatment, do the safe and sensible thing—rely
    on no one but your physician.


