    # in All Hospitals?


    Condensed from Your Life

    William S. Dutton


    In a ward of the vast Philadelphia General Hospital reserved for policemen and
    firemen, a badly wounded officer had lain in coma for two weeks. Medical skill
    had been unable to bring him back to consciousness. His bed was screened off.

    "You won’t disturb him," a nurse assured two Gray Ladies—volunteer Red Cross workers—a
    pianist and a singer. She added, "We’re afraid that nothing will."

    A spinet piano was wheeled in, and several old melodies were softly played and
    sung. Then the singer began "When Irish Eyes Are Smiling." She had sung only a
    line when


    a man’s voice joined hers—and there was no mistaking from what bed it came. The
    Gray Ladies did not falter, and the voice continued all the way through the song.

    Afterward the head nurse sought them out. "You wonders, you!" she said. "More
    than Irish eyes are smiling! Our man is going to live!"

    He had crossed the bridge offered by the Gray Ladies—a bridge as intangible as
    a rainbow, yet no less real to many in dire need.

    Each of us has extra strength on which to draw—if we will—in times of serious
    illness or injury. One of the saddest problems of the sick-room is the patient
    who has lost this


    # 费城灰衣女士让重病患者重拾活下去的欲望，取得极大成功！


    # 为什么不是所有的医院

    都有这么美的音乐


    生活的真谛

    威廉·s·达顿


    在费城总医院留给警察和消防员的一间病房里，一个伤势非常重的人，已经昏迷躺了 2 个星期。医学方法一直无法让他恢复意识。他的床被屏风隔着。


    “你们不要打扰他，”一个护士对两个灰衣女士——红十字会志愿工作者——一个钢琴家和一个歌手，说道。她又补充道，“不过，恐怕也没什么能打扰到他。”


    灰衣女士推进来一架小型立式钢琴，开始演奏，一些旧旋律轻轻飘扬。然后，歌手轻唱“当爱尔兰人的眼睛微笑起来。”她唱完一句后，一个男人的声音飘了出来——毫无疑问，声音是从被隔开的那张床上飘过来的。灰衣女士没有停下来，继续轻唱。


    然后，护士长找到她们说：“太神奇了！爱尔兰人的眼睛微笑了！他能活下去了！”


    他穿过了灰衣女士搭的桥——像彩虹一样无形的桥，然而，却和许多迫切需求的东西一样真实。


    在重伤，或重病时——如果我们还有活下去的欲望——我们应该尽力去努力。病房最悲哀的一个问题就是，没有这么美的音乐。


