    这些经典文案出自：克劳德·霍普金斯，尤金·斯瓦茨，大卫·奥格威，马克斯韦尔·萨其姆，约翰·卡普尔斯，盖瑞·亥尔波特，乔·卡伯，本·苏瑞兹，约翰·卡尔顿，杰·亚伯拉罕，丹·肯尼迪，杰夫·保罗，约瑟夫·休格曼……等等数百位世界顶尖撰稿人之手。（其中，盖瑞·亥尔波特撰写的经典广告文案就有
