    # HOW TO HAVE THE Best Looking Haircuts in Town for a Dime


    When did you last wait your turn in a busy barbershop? Or kill a beautiful Saturday
    morning getting the kids’ hair cut? And fork up a nice big chunk of change for
    the privilege? It may surprise you to learn that, for hundreds of thousands of
    American families, barbarous old-fashioned ways like these are a thing of the
    past. And by the way, if you think you can spot such families by the bowl-cut
    look that used to go with home haircuts, you haven’t caught up with the greatest
    do-it-yourself trend since the home perennial. Every single day one new home appliance
    is giving more and more kids that fresh-from-the-barber look that used to cost
    $1.25, $1.50, maybe even $1.75 per haircut. And this same appliance is helping
    Dads keep that neat, trim look, so that haircuts last almost twice as long. The
    thing that does the trick is the new Supreme Electric Haircutting Kit for home
    use. Why Supreme?


    Well, before fussy folks—executives and two-car families—could be sold on cutting
    hair at home, a quality product had to be developed, and Supreme is it. All others
    lack the exclusive features and refinements that make home haircuts not only foolproof
    but fun. Here’s what they’re finding out in homes where the pleasant hum of a
    Supreme Electric Haircutter is heard as frequently as many other home appliances:
    if you can comb hair, you can cut hair. Four exclusive trimmer attachments in
    the Supreme Haircutting Kit actually work on a comb principle. They mean you can
    simply “comb in” a perfect trim, on the sides, the back of the neck … even give
    Junior the best crew cut he’s ever had. Best of all, “No Waiting,” no waste …,
    which brings us to the promise in the headline. It doesn’t mean that the Supreme
    Electric Haircutting Kit costs only a dime, because it doesn’t. The man who sells
    you yours will expect you to hand him $14.95. But here’s why you won’t mind: how
    many haircuts will $14.95 buy today? Probably only ten or thereabouts. And counting
    the kids, how many haircuts does a family of four or five get in a year? It could
    be as many as sixty or more. So figure it out as we did: In just a couple of years
    of Supreme home haircutting, you’ve pulled the price per haircut down to the ten-cent
    level. Put it another way: get a Supreme Kit today and save more than $50 a year!


