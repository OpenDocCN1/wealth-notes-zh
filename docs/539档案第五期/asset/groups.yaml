    - 一位出版界的朋友通过我的方法，当年就让他的公司业务量增加了 40%。

    - 另一个朋友，做国际珠宝生意，仅对他的一封销售信的指导，转化率从 2% 上升到 6%，足足翻了 3 倍。

    - 还有一位朋友，在没有增加任何成本的情况下，通过我的方法，让他的利润增加了 5 倍。

    - 我还帮助一位朋友，使他们的公司在 3 个月内完成了一年的销售业绩。

    - 我为自己写的近 40 遍销售信（纯粹的销售文案，而不是文章），平均每一封信都给我带来 10 万元的收益。


    有些人通过我的免费营销通讯（www.libingchi.com），学会了写销售信……有些人通过我的书籍，把学到的方法，运用到生意中，获得了巨大的成功……有些人通过我的私下指导，让产品销量翻了数倍！


    这一切都是由于我的建议，方法，利用我的“独门秘笈”的结果。


