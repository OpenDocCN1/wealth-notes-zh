    And you don’t need a textbook to get expert results.

    ★ ★ ★ ★ ★ ★


    When dropped on leaves, the plant foods soak up every drop of water they can get.
    But there’s never enough to go around. So they pull water right out of the leaves.
    And that’s the beginning of burn.


    In the past, the only ways to hold down burn were to give the grass a bath or
    raking after feeding... or feed the grass in "watered-down" nibbles every month
    or so.


    But Vigoro scientists weren’t satisfied. They wanted a formula so burn-free it
    could be fed in amounts large enough to last a full season—with no watering in
    required.


    Why? Because every burn—even a slight scorch that goes unnoticed—is a setback.
    And setbacks lay the grass wide open to attack from weeds, sun, insects, disease.


    With the help of an instrument called an isoteniscope, the scientists measured
    the thirst of every plant food ingredient and experimented with new compounds
    that could replace the thirsty ones.


    These tests finally paid off in a brand-new formula with every ingredient in a
    nonburning form. And on March 18, 1958, U.S. Patent Number 2,827,358 was awarded
    to this amazing product called New Golden Vigoro—the first, complete, non-burning
    plant food ever made.


    Lawn experts, independent laboratories and billions of blades of grass agree:
    New Golden Vigoro is the only foolproof lawn food. The box on this page tells
    why.


