    不言而喻；如果羊毛能承受住专业溜冰选手这样的穿着磨损，那么它也能带给你更多保障。溜冰者和滑雪者穿的裤子、夹克、毛衣……粗糙的狩猎衣服……冬季套装，以及美国制造的纯羊毛外套，精纺套装，都能带给你无与伦比的性能。


    因为卷曲的纤维能使这些羊毛把热空气留住，让你感到无尽的温暖……且不会让你看起来显得臃肿。


    不管你是偶尔周末去旅行，还是专门的运动员，你都会想找一套舒适、长期经穿，而且版型漂亮的衣服，没有什么能和羊毛制品相提并论。


