    # How big is an egg?


    Great new advance in food technology makes possible better, more uniform cakes


    Chickens are likely to cackle as triumphantly over an egg weighing 2½ ounces as
    one that weighs 4 ounces. Eggs vary not only in size and weight, but also in quality,
    making it impossible to pick at random any two eggs that are identical. While
    it is of no concern to the chicken, this difference in eggs can make a world of
    difference in cakes — the difference between a cake that is just so-so and the
    fine, proud, evenly-textured one that every woman wants. This problem has brought
    about one of the really great advances in food technology — the development and
    use of processed eggs. These, today, are simply freshly-laid eggs, without the
    moisture. They contain every element of eggs just out of the nest. When moisture
    is added to them, they perform the same functions.


    Their advantage is enormous. Their quality is uniform. They can be measured into
    the recipe with just the right amount called for. They''re more convenient, of
    course. This is why processed eggs have come into such general use in so many
    foods that are a part of our daily living — ice cream, baby foods, noodles, meringues,
    frosting mixes, and so many others. Since we at Pillsbury buy one out of every
    120 eggs laid by all the chickens in the country (and since it clearly costs us
    more to put them into our cake mixes than to leave them out), we hope this may
    help you to understand why we do it. We believe that, in a cake mix, you want
    the easiest way (and the surest, too) to the finest cakes you can bake. We believe
    that the way to give that to you is to put the country-fresh eggs right in the
    mix.


