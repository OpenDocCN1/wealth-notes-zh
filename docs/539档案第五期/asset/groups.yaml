    ## Fluorides for Healthy Teeth


    NEXT TO THE COMMON COLD, dental decay is man''s most widespread chronic disease.
    But now Science has accomplished a major breakthrough against dental decay by
    using fluoride these three ways: 1. fluoridation of drinking water; 2. direct
    topical application, by dentists, of a fluoride solution to the teeth; 3. stannous
    fluoride in tooth paste.


    You are the one who chooses the fluoride tooth paste you will use. And here are
    some surprising facts which can guide you: (1) Not all fluoride tooth pastes contain
    stannous fluoride, the recognized decay-fighting ingredient. (2) Some fluoride
    tooth pastes can lose as much as 80% of their active fluoride right in the tube.
    (3) Only one tooth paste on the market today provides the most favorable "climate"
    in your mouth for the stannous fluoride to work best.


    ## Which Tooth Paste?


    The newest brand, Pepsodent Fluoride, sets new standards by which you can judge
    all others.

    First, it contains stannous fluoride, the fluoride recognized by dentists (as
    a tooth paste ingredient) for its ability to toughen tooth enamel against decay.


    What''s more, though latest laboratory tests prove all leading fluoride tooth
    pastes lose active fluoride right in the tube (one brand loses a good third, others
    lose up to 60 per cent). Pepsodent holds onto almost 90% of its decay-fighting
    active fluoride — even after 6 months.


    Another difference: Pepsodent''s new long-lasting fluoride formula makes tooth
    enamel much more resistant to decay acids than other fluoride tooth pastes. This
    was proved conclusively by laboratory tests.

    Moreover, only new Pepsodent Fluoride controls the mouth acid level during use
    to provide the most favorable "climate" for stannous fluoride to do its work.


    That''s why more and more people are finding out that new Pepsodent Fluoride gives
    you more of what you buy a fluoride for.

    P.S. For cleaning teeth their whitest wearing can beat familiar White Pepsodent.


