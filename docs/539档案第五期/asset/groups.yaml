    Wonderful progress has been made in protecting the lives of mothers and babies—thanks
    to excellent prenatal care and improved obstetrical techniques.


    Equally important, some 95 percent of today''s babies are born in our hospitals—where
    most birth emergencies can be handled promptly and effectively.


    Information for expectant mothers: If your general health is good—if you have
    no family history of diabetes, kidney, heart or other serious diseases—the chances
    are excellent that no major complications will occur before your baby''s arrival.


    For your own and your baby''s welfare, however, your physician may suggest these
    safeguards:


    +   1. Eat a variety of foods. Your baby will be no stronger or sturdier than
    the building materials your diet provides. For you and your baby, a varied diet
    is best.


    +   2. Watch your weight. Too much weight strains the heart and other organs.
    Normal increase is around 16 to 20 pounds. Your doctor will decide how much you
    should gain.


    +   3. Get needed rest and exercise. Walking is one of the best exercises and
    it''s usually all right to play golf and dance in the middle months of pregnancy.


    +   Get plenty of sleep and at least an hour of relaxation every afternoon.


    +   4. Keep in touch with your doctor. No serious problem develops during pregnancy
    without a warning signal. Your doctor can foresee and act to avoid difficulties—if
    he''s consulted early and as often as necessary.


    +   5. Make your hospital reservation early. The maternity wards of most hospitals
    are crowded nowadays. The sooner you make your reservation, the better.


