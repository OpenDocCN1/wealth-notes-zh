    # 17、为什么 Zippo 人在打火机小轮子上投入 300000 美元


    ![](img/e18e480d5d97a6b8fafe6f4c5de21452_81_0.png)


    # Why the Zippo Man spent $300,000

    on this tiny wheel


    IN THE SPRING OF 1946, the Zippo man made a sad discovery. Some of the striking
    wheels in his Zippo lighters were not as good as he had been led to believe.


    Sure, there were plenty of good wheels, but some poor ones had crept in, too.
    They would not give the kind of year-in, year-out service that he demands of every
    part in a Zippo.


    So in spite of booming business, he called a halt. Nobody was laid off. He just
    wouldn’t ship any more lighters. The Zippo man began his search for the finest
    striking wheel in the world.


    Experiments were made with every


    kind of steel he could lay his hands on. He had thousands of wheels made. But,
    perfectionist that he is, the Zippo man still wasn’t satisfied.


    He talked to some of the world’s great metallurgists. Then with his own craftsmen,
    and a bit of luck, he developed a striking wheel that makes your Zippo lighter
    a lifetime companion.


    This is one important reason why the Zippo man is able to offer you his incredible
    guarantee. No matter how old it is or what its condition, if a Zippo ever fails
    to work, he’ll fix it free!


    Zippo Manufacturing Company, Bradford, Pa., and Canada Limited, Niagara Falls,
    Ontario.'
