    # Some facts and fallacies about

    HEART ATTACKS


    The chances of surviving a heart attack are steadily increasing.

    TRUE—No long ago, most people felt that a heart attack or a "coronary" usually
    meant sudden or early death—or a life of invalidism.

    Now we know that most victims—about 80 percent—recover from their first attack,
    and many of them recover fully enough to enjoy many useful years.


    Recovered coronary patients should keep their weight down.

    TRUE—Next to good medical care, nothing is more important for people who have
    had heart disease than to keep their weight at a desirable level.

    It is just as much of a burden on the heart to carry around ten pounds of extra
    weight all day as it would be to carry around a ten-pound bundle constantly.


    After recovery, most coronary patients go back to work.

    TRUE—The patient who has made a good recovery is not handicapped when he works
    under proper conditions. Placed in a job which does not unduly tax his heart,
    and given proper medical supervision, he can engage in daily work without harm.
    Indeed, most doctors encourage their patients to return to work.


    A person who has had one heart attack will certainly have another.

    FALSE—The recovered patient should not live in fear that he will have another
    attack. He may—or he may not.

    By sticking to their doctor''s recommendations about diet and weight control,
    work, sleep and rest, more and more patients who have had heart attacks are living
    comfortably without further trouble.


    Heart attacks are caused by strenuous activity.

    FALSE—Most heart specialists now believe that physical exertion has little, if
    anything, to do with a coronary attack. In fact, attacks often occur during sleep
    or rest.

    Many factors—including age, sex, occupation and diet—are believed to play a part
    in coronary disease.


