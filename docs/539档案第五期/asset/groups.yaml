    ## 作业


    ## 31、如何给孩子 “御寒”


    ![](img/e18e480d5d97a6b8fafe6f4c5de21452_130_0.png)


    ## How to “chill-proof”

    your children


    Some helpful advice about clothes from Beulah France, R.N.: child care specialist
    and author of “How to Have a Happy Child”


    A young neighbor of mine is having a miserable childhood, just because his mother
    doesn’t know how to dress little boys for snow! All winter long I hear her calling:
    “Be careful, Peter. Don’t get wet, Peter. Don’t stay out too long, Peter. Don’t
    … don’t … don’t, Peter. You’ll catch cold.”


    Unfortunately, she may be right. Too often winter fun does end in a siege in bed,
    because many times a child who looks properly dressed for the cold is not. Healthy
    dressing is not so much a matter of how many clothes you put on a youngster, but
    what clothes you select.


    My years devoted to child care have taught me that wool clothing lets children
    have the carefree times they deserve, while giving them the best possible health
    protection. And there are good reasons why this is so, as I learned when I studied
    textiles in college.


    To begin with, wool traps and holds insulating air that shuts out cold, locks
    in warmth—gives continuous comfort and protection, regardless of weather. Pure
    wool can “take” even the wetness of a snowdrift—for each wool fiber has its own
    “raincoat” that makes the fabric naturally water-repellent.


    At the same time, wool prevents perspiration (often caused by lively play) from
    collecting next to the skin, because there are tiny pores in each wool fiber that
    can absorb moisture vapor. That’s why, with clothing of wool, your child is protected
    from the clammy dampness and the shock of rapid cooling that can so often lead
    to “catching cold.”


    Besides safeguarding health, today’s American-made woolens and worsteds give remarkable
    comfort and durability. Thanks to the natural elasticity of the wool fiber, pure
    wool clothes give a child unhampered freedom for play. And coats, suits, slacks
    and sweaters of wool pass all the endurance tests an active child can give them,
    year after year. When it comes to dressing your youngsters wisely, nothing measures
    up to wool.


    This special message is sponsored by American Sheep Producers Council.

