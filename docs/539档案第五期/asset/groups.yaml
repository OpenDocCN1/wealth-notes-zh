    ## 32、我们理性地看下你秋天的大额消费


    ![](img/e18e480d5d97a6b8fafe6f4c5de21452_134_0.png)


    ## A candid look at your Big Fall Investment


    by Faye Henle, financial columnist for Newspaper Enterprise Association, appearing
    in over 100 newspapers from coast to coast


    Since women manage 65% of our country’s wealth, it is obvious that the feminine
    mind can cope with more than cake frostings and lost car keys. Women are surprisingly
    astute when buying stocks, home-freezers—and clothes. For instance, I was intrigued
    last week watching a friend of mine shop for her fall coat.


    Like most of us buying anything important, she put the prospective coat to a merciless
    cross-examination. "Will it go with all my clothes and keep me warm, too? Can
    I wear it for both dress-up and shopping? What if I get caught in the rain? Will
    it take driving... sliding in and out of the car? All in all, is it worth the
    price?" Well, she finally chose a beauty. And I wasn’t surprised to see the 100%
    wool label. Because I knew only a pure wool coat could have pleased her.


    I recently read a fascinating article about the wool fiber. For one thing, nature
    provides it with a remarkable elasticity—it can be stretched up to 30% and still
    return to shape. This is why a wool coat always looks so good—wears so well—sheds
    wrinkles so easily.


    The article went on to say that every wool fiber has a waxy shield that repels
    rain and snow. And, strangely enough, this shield has tiny pores that absorb moisture
    vapor. This explains why a pure wool coat protects you against the weather—but
    never gives you that clammy, sealed-in feeling.


    And nature also gives every wool fiber a "permanent wave." These crimped fibers
    form millions of tiny air pockets in a wool coat. They provide insulation to keep
    you warm—much the same as the storm windows on your house.


    Add all of these special dividends to the rich colors and textures of the fine
    American-made wools you see in coats today, and it’s not surprising people say,
    "Nothing measures up to wool." You get your money’s worth out of this fall investment—every
    time you leave your house.


    This is a special message sponsored by American Sheep Producers Council.


