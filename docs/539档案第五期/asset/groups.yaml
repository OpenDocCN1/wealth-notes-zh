    ## 条纹 “安全保障”


    现在，一款条纹牙膏诞生了！

    它将杀死引发蛀齿和口臭的细菌

    带给你持续的安全保障


    自从科学家们找到了引发蛀齿和口臭的细菌后，他们就一直致力于研究一款能杀死这些细菌的牙膏。牙膏本身并不能有效地杀死细菌。它只能把它们清除。但是，那些没有被刷走的细菌，很快就会大量繁殖。


    二战期间，科学家们发现了一种最有效的杀菌物质——六氯酚。


    医学院的外科医生发现，手术前，用六氯酚洗手，杀死的细菌数是传统洗手方法的7倍。也许更重要的是，他们发现六氯酚能提供一种持久的安全屏障，能有效隔离细菌。


    利华兄弟公司把他们新研发的一款红白相间的六氯酚牙膏——条纹牙膏，和市场上竞争力最大的牙膏品牌和漱口水进行测试时，他们发现了同样的杀菌优势。


    测试表明，条纹牙膏能杀死引发口臭和蛀齿的细菌，效果要比其他任何知名品牌的药膏或漱口水都好。最令人印象深刻的是，条纹牙膏能形成一层安全保障，在两次刷牙期间，持续保护使用者。科学家发现，其他的牙膏“只有很少，或者完全没有持续效果”。


    红色条纹就是六氯酚牙膏，条纹牙膏能带给你牙膏加漱口水的

    好处。今天就去买条纹牙膏吧。


