    # 24、疲劳——一个伪朋友


    # FATIGUE-

    A FRIEND

    IN

    DISGUISE


    ![](img/e18e480d5d97a6b8fafe6f4c5de21452_104_0.png)


    Nobody welcomes fatigue. Yet, it can be a friend in disguise. Without a sense
    of fatigue, we would often push ourselves beyond our endurance—and the diagnosis
    of certain diseases, of which fatigue is an early symptom, might be long delayed.


    There are many kinds and many causes of fatigue. For example, there’s simple physical
    fatigue which you feel after a strenuous "work-out." You rest or get a good night’s
    sleep—and it vanishes.


    Fatigue may also be caused by low blood sugar—especially among people who eat
    little or no breakfast. Any healthy person who "tires out" before noon should
    have a breakfast high in protein foods—especially meat, eggs and milk.


    In contrast, there’s the persistent and ex- hausting form of fatigue that’s entirely
    un-


    related to physical effort or diet. This is nervous or emotional fatigue caused
    by anxiety, tension or boredom.


    If you are persistently tired, take a look at your way of life. How much exercise
    do you get? Physical activity is often the one thing most needed to overcome emotional
    fatigue.


    When fatigue persists, you should consult your physician. A check-up will reveal
    whether there’s any disease to account for tiredness. A frank talk about your
    worries may help untangle the emotional knots that make you "tired all the time."
    Whatever the cause, fatigue shouldn’t be ignored.


    Remember: for the most common forms of fatigue, "tonics" are seldom, if ever,
    of any value. Fatigue, like any other symptom of physical or mental distress,
    should be investigated by your physician.


    ![](img/e18e480d5d97a6b8fafe6f4c5de21452_104_1.png)


