    ONE thing''s sure... I can''t blame my parents for what I was. I come from a good
    family. My mother was a famous small-game hunter. I won''t mention her name, because
    you might recognize it.

    I can''t quite blame the boss, either. Sure, he neglected my training. But he
    was a tender-hearted guy who hated to say no. And I was just a six-months-old
    puppy, full of the dickens and raring to go.

    So, left on my own, I fell in with a fast crowd... three other neighborhood dogs.
    Boy, did we live it up! Gardens to dig in, garbage cans to spill, cats to chase,
    shrubs to run under. Wow!

    There was one dog down the street who was different, though. Stayed in his own
    yard. Came when called. Very mannerly little fellow. We sneered and called him
    "Powder-Puff Ruff." But secretly I envied him — he seemed so happy.

    Well, I went on from bad to worse; till one day I really ruined a


    neighbor''s prize rhododendron. The boss was fit to be tied! First he talked about
    getting rid of me. Then he hustled me off into the car. I thought I was a goner!

    But do you know where I wound up? At an obedience training class. There they taught
    the boss to teach me how to become a "civilized" dog. In no time I could "come,"
    "sit," "stay"... and by golly, I liked it! What''s more, we got to be great pals,
    the boss and I.

    So take my advice... if you''ve got a puppy or a dog who''s headed the way I was,
    get him going straight right now. An obedience training class is one good way.
    Another is to read up on the fundamentals of dog training. I know a dandy booklet
    you can get free... "What Every House Dog Should Know." Just send your name and
    address to the Gaines Research Kennels, Dept. L, Kankakee, Ill. You''ll make life
