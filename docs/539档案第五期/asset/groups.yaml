    你有企业吗？你想拥有一个企业吗？


    # 由基韦斯特百万富翁学院发起的

    最新热门4小时研讨会

    将揭示11个惊人的秘密

    可以让佛罗里达州的任何企业

    甚至在即将到来的经济衰退中

    都能获得巨额利润！


    费用低廉的迈阿密“迷你研讨会”，揭示了著名的（收费惊人）“整整”4天研讨会的核心内容，关于如何让任何企业，顾客像洪水般涌来，通过聪明的营销，获得巨额财富……这将是你度过的最兴奋、最充实的4个小时！


    盖瑞·亥尔波特是世界著名的广告及营销专家，也是基韦斯特百万富翁学院的创始人。（图一）


    这个神奇的学院，位于有者115年悠久历史的哈博庄园。（图二）


    > “我一直是个商人，也是一个活动分子，我可以告诉你，盖瑞·亥尔波特教授的所有内容，都切中要点！”托尼·塔西诺（托尼上尉），基韦斯特市长。（图三）


    佛罗里达州电头——你最近去过基韦斯特海滨吗？如果去过，你应该看到过基韦斯特百万富翁学院的新家。


    它位于这座海滨城市中历史悠久的海滨区中心位置，前街461号，占地面积整整5000平方英尺，世界著名的哈博庄园2层。这座具有115年悠久历史的宏伟的红砖建筑（已经载入历史古迹）位于'
  - '[PAGE 12]


    前街，就在马洛里码头不远处。你一眼就能看到它。


    这个学院气氛非常活跃，每日固定员工 24 人，还有 30 多个国际网络教师，包括许多现今美国最著名的赚钱专家。


    但是，不要想着在大厅里能遇到面带青涩，到处乱逛的孩子。基韦斯特百万富翁学院，远远不同于你心中的传统大学——它的整个课程，都是专门为小企业主，以及企业家，还有其他真正准备赚大钱的人士设计的。事实上，该学院的定位就是“一个能让你赚更多钱的机构”。而且，给出了可能是有史以来美国教育史上最大胆的保证：


    > “在基韦斯特学院 4 天，

    你学到的合法，一定会让你赚大钱的信息，

    要比你在任何传统学院或大学 4 年学到的还多！”


    我们学院举办的 4 天课程，收费为每人 6950 美元，（还不包括差旅费，食宿费！），整个课程持续整整 4 天。而且，这套课程总是提前几个月就销售一空。之前这些研讨会的举办点，包括皮尔庄园，洛杉矶世纪广场酒店，犹他州普罗沃杰弗逊研究所，和绿茵礁岛的鹰礁度假胜地（这里是基韦斯特学院母公司埃弗雷特&劳埃德所在地，这里也是他们去年夏天漂线电视广告“和玛丽莲一起变瘦”的拍摄地）。


    # 为什么会有人支付近 7000 美元

    参加一个 4 天的研讨会？


    答案很简单。参加该学院这次神奇的研讨会，可以获得巨大好处。据盖瑞·亥尔波特，学院创始人，盖瑞·亥尔波特广告公司的创作主力透露，从这个研讨会毕业的人中，有很大一部分人都赚到了数量惊人的一大笔钱。


    例如：一个来自加利福尼亚州的商人，名叫雷克·尼斯旺格，'
  - '[PAGE 13]


    他听亥尔波特的课程，不超过一个小时。但是，在接下来的 12 个月里，他利用从中学到的东西，使自己的收入增加了 3 倍。


    来自西北的物理学家兼发明家比尔·威廉斯，采用亥尔波特的建议，为自己的新企业带来了 4300 万美元的收入。亚利桑那州的一个人，运用亥尔波特的一个建议，就赚了
    3000 万美元——这还是该学院基本课程的一部分——亚特兰大的一个商人，利用他学到的一个简单方法，就赚了 900 万美元。


    还远远不止这些！从这些研讨会毕业的学员，回家后用他们学到的新方法，几乎在一页之间，就能使自己的收入增加 2 倍—3 倍，这几乎是司空见惯的。该学院的文件柜里，放满了世界各地的学员成功案例。


    但是，这里有一些真正的新 event，你需要听一下：基寺斯特百万富翁学院，最近举办……


    # 一个特殊的 4 小时


    # “迈阿密那场整整 4 天的研讨会的迷你版” 研讨会

    ——参加的学员每人只需 79 美元！


    为什么该学院要几乎像是白送一样，释放自己在之前收费 7000 美元研讨会上讲的核心信息呢？


    # 难道他们疯了吗？


    没有。他们提供这个特殊的 4 小时迷你研讨会，只是一次很好的商业实践。用亥尔波特的话说就是：“在这 4 小时内，我们可以很容易地教任何精明，想赚大钱，有商业道德的商人很多新的，非常实用的赚钱秘诀和策略。他（或她）很快就可以用这些秘诀和策略，使自己的收入翻
    2—3 倍。然后，他们肯定特别想参加我们的 4 整天全程研讨会——他们会觉得 7000 美元的课程费，将是自己一辈子最划算的投资，只需通过这次迷你研讨会赚的钱中的一小部分就'
  - '[PAGE 14]


    可以支付。


    “当然，看起来似乎有点要滑头的意思，”约翰·卡尔顿，该学院的一个主要老师，也是著名的广告专家，说道。“但这完全符合道德。事实上，我们做的一切，都是为了让这些
    4 天全套课程的潜在学员，品尝一下该课程将带给他的财富和成功的味道。”


    # 任何人都能通过这个效果惊人的 4 小时研讨会

    学到东西吗？


    亥尔波特承认，在 4 小时里，他无法教你所有东西——但是，他坚信，他教给你的东西，肯定能让你去使用，并快速赚到钱。


    “除非你在研讨会上昏昏欲睡，或真的笨到出奇，”亥尔波特说道，“你学到的东西，将让你快速获得很多新客户，乞求你收下他们的钱。或者，它将帮你成立一个能打败所有竞争对手的新企业。或者，如果你愿意，你甚至可以在家，或者办公室，几乎不用花太多精力，兼职赚大钱。”


    # 你将学到：


    亥尔波特的信息简明扼要——真正赚大钱的关键在于，让你的销售努力事半功倍。


    不管你觉得自己是多么优秀的一个销售员，或者不管你对自己的企业，以及购买你的产品，或使用你的服务的客户的需求有多么了解，因为你的精力有限，你每天能接触的客户数量就那么多。


    这就是为什么这个研讨会非常有效。因为它揭露了国内最好的营销人，以及广告人的所有秘诀，技巧；以及销售方法。亥尔波特和他“那群广告专家”致力于吸引企业主，并向他们展示……'
