    # The Incredible Story of the Zippo Lighter


    — and a man who believes a lighter should work forever


    THE MAN who made the first Zippo, and who still runs the show, learned his trade
    in his father’s Pennsylvania machine shop.


    He developed manual skills. He mastered the sweet science of machinery. And he
    learned one thing more.


    He learned to love workmanship for its own sake. He became a craftsman in the
    19th Century American tradition — the breed of men who made things that worked.
    And lasted. For a long, long time.


    Today, he makes a cigarette lighter that works. The Zippo. And he constructs each
    Zippo so carefully that he is able to offer the most sweeping guarantee in the
    annals of American business.


    Regardless of age or condition — if a Zippo ever fails to work — he’ll fix it
    free!


    Some modern businessmen who make products that become obsolete on a schedule don’t
    have much respect for the Zippo man’s business sense.


    But he does pretty well. And he has a rare good feeling when he goes to bed each
    night. The feeling that comes from making a product that works. Every time. Year
    after year. Generation after generation. Always — or he fixes it free.


    Zippo Manufacturing Company, Bradford, Pa. In Canada: Zippo Manufacturing Company,
    Canada Ltd., Niagara Falls, Ontario.'
