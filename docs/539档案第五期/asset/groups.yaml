    造成疲劳的原因有很多种。比如，大量的“体力活动”过后，你就会感觉身体疲劳。休息一下，或者经过一夜的充足睡眠，它就会消失。


    低血糖也能引起疲劳——尤其是那些早餐吃的很少，或者不吃早餐的人。任何中午之前感到“疲劳”的健康人，都应该吃一顿高蛋白的早餐——尤其是肉，鸡蛋或牛奶。


    相比之下，还有一种与体力活动或者饮食完全无关的持续疲劳。这是由于焦虑、压力或无聊引起的紧张或情绪疲劳。


    如果你感到持续疲劳，那么你就要审视一下你的生活方式了。你每天做多少运动？体力运动通常是克服情绪疲劳最有效的方式。


