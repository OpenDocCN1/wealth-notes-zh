    which brings us to the promise in the headline. It doesn’t mean that the Supreme
    Electric Haircutting Kit costs only a dime, because it doesn’t. The man who sells
    you yours will expect you to hand him $14.95. But here’s why you won’t mind: how
    many haircuts will $14.95 buy today? Probably only ten or thereabouts. And counting
    the kids, how many haircuts does a family of four or five get in a year? It could
    be as many as sixty or more. So figure it out as we did: In just a couple of years
    of Supreme home haircutting, you’ve pulled the price per haircut down to the ten-cent
    level. Put it another way: get a Supreme Kit today and save more than $50 a year!


    # 如何在城里花一毛钱

    就能有最美的发型


    你上次在理发店排队理发是什么时候？上次为了给孩子理发，浪费了一个美丽的星期六早晨是什么时候？上次为了剪个漂亮的发型花了不少钱，又是什么时候？


    有个消息可能会让你大吃一惊，那就是，无数美国家庭已经告别了这种令人苦恼的传统理发方式了。


    顺便说一下，如果你觉得这些家庭理的发型，和之前人们在家自己理的发型一样，像个锅盖头。那么，你就落后了。你还没有赶上现在最流行的自己在家理发的趋势。每天，一个新家电都会给更多的孩子带来清爽，漂亮的发型，就和在理发店花
    1.25 美元，1.5 美元，甚至 1.75 美元理出来的一样。而且，这个设备还可以让爸爸的发型保持整洁、整齐，发型保持时间，几乎是之前的 2 倍。


    这款新型理发工具就是终极家用电动理发套装。为什么说是终极？


    想让挑剔的人——高管，和拥有两辆车的家庭——购买这种在家理发的套装，它的品质必须好，终极家用电动理发套装就是这样的产品。所有其他家用理发工具，都没有让家庭理发简单，有趣的独有特性，和超高品质。


    很多家里经常会响起终极电动理发工具愉快的嗡嗡声，这些家电的使用频率和其他家电一样，他们发现：如果会梳头发，你就会剪头发。


    终极理发套装上有 4 个独特的剪发附件，实际工作原理就是一把梳子。意思是，你可以简单地“梳”出完美的发型，两侧，后侧，


    梳一梳就可以……甚至可以给孩子理出他有史以来最漂亮的发型。最棒的是，“不用等待”，没有浪费……这就是我们在标题中的承诺。


    并不是说，终极电动理发工具只要一毛钱，它不是。它的售价是 14.95 美元。但是，你意识不到的是：在今天，14.95 美元能理发几次？可能只有 10 次左右。算上孩子，一个四五口人的家庭，一年理发要多少钱？可能需要
    60 美元，甚至更多。所以，按照我们的方法你算算。只要短短几年，用终极电动理发工具理发的家庭，你的理发成本就会下降到 10 美分以下。


    换句话说：今天购买终极理发套装，一年就能节省超过 50 美元。

