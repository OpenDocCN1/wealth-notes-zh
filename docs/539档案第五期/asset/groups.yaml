    首先，羊毛能够留住温暖，把冷气挡在外面——不管是什么样的天气，它都可以持续给人舒适和保护。纯羊毛甚至能够“带走”雪花的湿气——因为，每个羊毛纤维都有自己的“雨衣”，使织物能够自然防水。


    同时，羊毛还能防汗，玩耍通常会让孩子出汗，它可以吸收皮肤上的汗水。因为每个羊毛纤维中都有细小的毛孔，可以吸收水蒸汽。这就是为什么羊毛衣服可以保护孩子免受潮湿，还有出汗后身上湿冷而导致的“感冒”。


    除了保护健康，如今美国制造的毛织品还非常舒适、耐穿。由于羊毛纤维有自然弹性，所以，穿纯羊毛衣服，孩子不会觉得有束缚。羊毛外套、西装、裙子和毛衣都经过了所有的耐力测试，孩子可以穿很多年。当说到给孩子穿什么衣服才是聪明的选择时，羊毛绝对是不二之选。


