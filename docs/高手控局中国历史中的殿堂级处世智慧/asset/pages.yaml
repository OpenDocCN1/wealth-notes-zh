  md: '# 张登：加剧对手阵营的矛盾


    > 把“挑拨离间”当乐趣的，是小人；把“挑拨离间”当手段的，是凡人；只有把“挑拨离间”当战略的，才是聪明人。


    前323年，魏国人公孙衍发起了“五国相王”的运动，也就是魏、韩、赵、燕和中山五个国家的君主相互承认对方的“王号”。在此之前，只有周天子才能称王，诸侯们只能按照早期分封的“公、侯、伯、子、男”的爵位称谓。当然，楚、吴、越三个南方国家已经僭越加上了“王号”。“五国相王”既是对彼此地位的承认，也是对对抗崛起的秦国的结盟运动。在“徐州相王”中，齐国和魏国国君已经彼此承认对方的“王号”，故而这次“五国相王”引起齐国的不满，它认为中山国只是一个二流国家，不配称王，同列为耻，因而派使者告诉魏、赵两国共同出兵讨伐，去其王号。


    中山国夹在魏、赵之间，通过相王运动在国际上获得一席之地实为不易。齐国的动议令中山国君非常惊恐，他赶紧召集臣子们商议。大臣张登请求给自己车马资财，去瓦解齐、魏、赵的阵营。他带着重金先找到齐国的执政田婴，对他说：“齐国联合魏、赵讨伐中山国，对谁有利？”田婴请张登详说。张登说：“中山国距离魏、赵近，距离齐国远，讨伐中山国，这是加强了魏、赵两国的实力，对齐国却没好处。”


    田婴认为张登说得有理，问他该怎么办。


    张登说：“如今，齐国承认中山国的王号和地位，魏、赵两国必定恼怒，攻击中山国，中山国必定倒向齐国，这是加强了齐国，削弱了魏、赵。”


    田婴认同张登的说法，但遭到另一大臣张丑的反对。张丑说：“同欲者相憎，同忧者相亲。为了与中山国结好，而寒了别国的心，不可取。”


    田婴没有接受张丑的意见，仍然与中山国交好。其实，张丑说出了事情的本质：魏、赵、齐三国的欲望是相同的，都担忧对方势力增强，故而暗地里彼此相憎；它们准备削弱的中山国，则与之有共同的忧虑，是怕自己变弱。'
