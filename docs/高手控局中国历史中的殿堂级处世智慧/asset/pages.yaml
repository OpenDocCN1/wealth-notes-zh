- pgno: 203
  md: '当时，秦王尉的大批官员均已外任，只留下一两个人给秦王打下手。在李渊看来，这合情合理，因此同意了。在随后的几年里，李世民每次出征，必定携杜如晦同行，君臣之间结下了深厚的情谊。


    唐武德九年 (626)，杜如晦的高光时刻来了。随着与唐王争霸天下的外部势力全部被扫平，其内部矛盾开始暴露出来。东宫太子府的属官魏徵、王珪都劝李建成除掉李世民，避免陷入“人为刀俎，我为鱼肉”的下场。但李建成疑虑重重，加上秦王府已成气候，迟迟不肯下手。他企图收买和拉拢秦王府的铁杆支持者，如尉迟恭等人，进而削弱对自己的威胁。可惜这一招不奏效，遭到了尉迟恭等的拒绝。拉拢不成，他便派人刺杀，同样遭到失败。


    为了斩杀李世民的这条臂膀，李建成上书李渊，给尉迟恭找了个罪名，将他打入大牢。在李世民的求情下，尉迟恭被放了出来，但双方的争斗已是箭在弦上，不得不发。


    尽管李世民内心渴望成为储君，但不论是按照法统还是道统，李建成都是无可争议的储君，要争夺帝位，必定要与东宫兵戎相见。权柄之争，是你死我活的斗争，纵然是骨肉血亲、父子兄弟，也容不得私情。


    秦王府的文臣武将虽然是秦王府的属官，但更是朝廷命官，他们获得的荣誉和官位都是朝廷颁赐的。为李世民争夺利益和争夺帝位，这是两回事：争夺利益，是团队之争；争夺帝位，则是造反的死罪，是一条不归路。故而，面对东宫太子的步步紧逼，李世民犹豫不决，尉迟恭和长孙无忌等重臣也都非常疑虑。


    长孙无忌建议立刻招来杜如晦，但此时杜如晦和房玄龄等秦王府旧臣都被外放到了地方，一时间无法咨询。李世民当即解下佩刀交给尉迟恭，让他无论如何都要招来房玄龄和杜如晦。就这样，房玄龄和杜如晦化装为道士，从外地赶回长安，秘密进入秦王府。


    杜如晦分析了当前局势：太子李建成是合法的储君，如果他率先发难，秦王府一众人等将死无葬身之地。纵然事后李渊追究罪责，业已成为事实。秦王府方面，臣僚们并没有获得主上明确的发难信号，都处于未做准备状态，一旦太子发难，士兵们极有可能放下武器，四处奔逃，有眼光的志士，恐怕不等太子发难就已经逃离了。如果秦王'
  merge: -1
  img_proc: true
- pgno: 204
  md: '李世民不立刻做出决断，失败是必然的。秦王府唯一能成功的方法，只有占得先机。


    杜如晦的话，令李世民醍醐灌顶，当即与文武官员们制订了详细的计划，又召集心腹将佐，向他们明确传达了自己的指令。


    剩下的一切，就不用多说了。历史上的“玄武门之变”发生，太子李建成与齐王李元吉被杀，唐高祖李渊被迫封李世民为皇太子，后来又让出皇位。后来，论功行赏，杜如晦被拜为兵部尚书、晋爵莱国公，赐食邑1300户。


    对于这个封赏，淮南王，也就是李世民的叔叔李神通十分不满，他认为杜如晦不过是一个介刀笔吏，抄抄写写罢了，为何功居前列？真正做出贡献的，应该是那些冲锋在第一线、流血牺牲的将士。李世民向他解释，杜如晦虽然不曾上阵杀敌，但是运筹帷幄，如果没有他，他们会流很多血，且未必能够成功。他的功劳和地位，可以与汉高祖的大臣萧何相比。李神通听后，便不再说什么。


    毫无疑问，杜如晦是一个团队中不可或缺的人物。尤其是在创业团队中，决策人物非常重要，他们能够对各方局势做出判断，给出合理建议，进而让团队朝着正确的方向前进。很多时候，往往是决策人物的缺失，导致进取型团队的失败。以项羽为例，他的智囊团队中仅有范亚父一人，而且他的决策不被重视。如果项羽听从范亚父的话，在“鸿门宴”上诛杀刘邦，整个历史也就改写了。'
