  img_proc: true
- pgno: 189
  md: '到了淮南后，九江王府的太宰负责接待随何，过了三天也没有安排会见。


    随何对太宰说：“大王不愿召见我，是认为西楚国强大，而汉国羸弱，这正是我来这里的原因。大王召见我，如果我说到了大王的心坎上，那说明我们意见相投；如果我说得不对，我宁可将我们这20人的脑袋一起交出来。”


    太宰听后回禀了英布，英布立刻安排与随何会面。


    随何对坐在大殿上的英布说：“汉王派我来见您，原因在于我疑惑大王您为何与西楚那么亲近。”


    英布说：“亲近的因由，是我与项王如同君臣，所以面朝北，像臣子那样侍奉他。”


    随何说：“大王您和项王同为诸侯，却像臣子那样侍奉项王，一定是认为他强大，可以把自己的王国托付给他。那么，项王攻打齐国，亲自背着修筑城墙的工具，身先士卒地厮杀时，您就应该率领自己的全部人马去助阵，并且做战斗的先锋，但是您并没有这样做，只是派了4000人象征性地助战而已。汉王来攻彭城时，您应该调动全部人马，帮助项王攻打汉王，可是您却袖手旁观，坐观二人成败。这是您以臣事君的姿态吗？大王，您表面上投靠西楚，实际上是为了获得更大的权益。我认为这非常不可取。大王不愿背弃西楚，是认为西楚强大，但楚国的军队非强，终究要背着杀害义帝、辜负天下人的恶名。”接着，随何向英布分析了当前的形势。


    刘邦虽然战败，但是回兵后驻守成皋、荥阳一线，获得了萧何源源不断送来的蜀地、汉中的粮食和兵员。汉军修筑坚固的堡垒，挖掘宽阔的护城河，分兵把守咽喉要道。楚军要想撤到自己的地盘，中间隔着梁地，彭越的游击军会不断地骚扰并破坏补给线。楚军孤军深入，进取攻不下坚壁垒垒，退却又无法摆脱汉军的追击，一定会失败，故而楚军是不可依靠的。


    随何的一番分析，宛若口吐莲花，说得英布大为折服，口头答应归附汉军，但不愿泄露消息，给自己留了余地。当时项羽派来的使者也在淮南，敦促英布尽快出兵进攻刘邦。为了彻底堵死英布的后路，随何找到楚国使者所住的宾馆，直接闯了进去，坐在楚国使者上位的'
  merge: -1
  img_proc: true
- pgno: 190
  md: '席子上，厉声说：“九江王已经归附汉王，楚国凭什么让他出兵击汉？”听闻此话，楚国使者准备溜走。随何趁机对英布说：“事情已经到了这一步，再没有转圈的余地，大王您应杀掉楚国使者，不能让他回到项羽身边。我们应立刻向汉军靠拢，协同作战。”


    英布说：“就按先生说的办。”随即杀了楚国使者，投向汉军的怀抱。


    随何只用一席话就策反了英布。但是项羽死后，天下大定，刘邦论功行赏，却故意贬低随何的功劳，说随何是陈腐的儒生，治理天下怎能用什么都不懂的儒生呢！随何跪在殿阶下上奏：“陛下您当年与项羽在彭城大战，英布尚未归汉，您认为调动步兵五万、骑兵五千，能够击败他吗？”


    刘邦说：“不能。”


    随何进一步说：“陛下派我领着20个人到淮南，我用一席话就让英布归附，实现了陛下的目的，我的能量恐怕超过了五万步兵加五千骑兵吧。如今陛下却说我是腐儒，这是为什么呢？”


    刘邦改口说：“我正在考虑你的功勋。”之后，刘邦便任命他担任护军中枢。受汉高祖信任的谋士陈平，也担任过这个官职。


    随何以一席话就解决了数万大军不能解决的问题，帮了刘邦的大忙，给项羽


    添了不少堵。在刘邦麾下的智囊团队中，可以说张良、陈平是第一梯队，郦食其和审食其是第二梯队，随何算是第三梯队的佼佼者，业务能力之强，也是十分罕见的。'
