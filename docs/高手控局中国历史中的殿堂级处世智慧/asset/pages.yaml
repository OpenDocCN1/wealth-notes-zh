  md: '由于土木堡一战朝廷丢弃了大量军械，所以于谦紧急派人到南京运回126万件，补充给守城部队。他还派人到土木堡收集丢弃的盔甲、火箭、箭矢和火炮，仅捡回来的铠甲就有5000多副、火铳一万多杆。于谦很清楚，土木堡之变，最大的失误是后勤补给不足，因而他非常关心北京保卫战的粮草。当时，京师用粮储藏在通州，达数百万石，但在短期内很难运到北京城。为了免于资敌，有人建议烧掉这些粮食。于谦认为，这些粮食是保卫京师安全的重要资源，坚决不能毁掉。他征用500辆大车，日夜运粮，同时还发动官员、士兵、百姓运粮。他承诺，凡是运20石以上粮食的人，不但按常规标准付运费，每天还多发一两白银。这一承诺，彻底激发了人们运粮的热情。不到10天时间，通州的粮食奇迹般地被运到了北京城内。


    北京保卫战的胜利，毫无悬念。瓦剌军在西直门、德胜门、彰义门遭到激烈抵抗，尤其是隐藏在德胜门外民民居中的明军，见瓦剌骑兵靠近后便火箭齐发，重创瓦剌。也先攻城没有占到便宜，得知勤王的各路军队都在靠近，他害怕被断了后路，因此撤军而去，在清风店（今属河北）又遭到明军袭击，于当年十月退出塞外。


    在这场挽救大明朝的战争中，于谦做了两件事：首先是立郕王为新君，来个釜底抽薪，彻底断了明英宗的影响力。不然战斗时，也先用明英宗做舆论工具，守城将士的心理会受到极大影响。若也先用明英宗当肉盾牌，明军便不敢开火。一旦明英宗失去皇帝的身份，将士们就不再缩手缩脚，可以大胆抵御了。其次，制订周详的计划，对于分区划分、人事安排、军械粮草、人员补充做了非常严密的部署。


    于谦德才兼备，能力过人，又勇于担当大事，实在可以说是国之良士，不可或缺的精英。'
