- pgno: 31
  md: '中了秀才的曾国藩似乎开了窍，一年后就中了举人，他异常喜悦。只是他高兴得有点早：道光十五年(1835)，他赴京参加会试，名落孙山；道光十六年(1836)，不甘心的他再次参加会试，依旧是落榜。


    好在曾国藩是个反应弧比较长的人，这要是一个心理脆弱的恐怕早就放弃了。两年后，他再次参加会试，终于中了进士，二甲殿试第42名，赐同进士出身。按照惯例，中了进士后要拜访座师。只是以曾国藩的成绩，恐怕见不到主考官穆彰阿，点翰林更是没有他的份，那必须是头几名才行。运气好一点，他会被分配到一个偏远的县当县令。当然，曾国藩也预料到了这个结局，但是他不甘心，因而找湖南同乡郭嵩焘聊天。郭嵩焘建议他去找另一个同乡劳崇光。劳崇光是穆彰阿的得意门生，与曾国藩的私交颇为不错。


    为了给穆彰阿留下好印象，曾国藩写了一首诗，请劳崇光代呈。写诗是要靠天分和才华的，一个考了7次才中秀才的人，写出来的诗必定四平八稳、庸常可知。穆彰阿只看了一眼诗稿，就将其放在一边。劳崇光纵然是得意门生，也不敢问。过了几天，曾国藩见没有动静，又挖空心思写了一篇诗文，请劳崇光代呈。可想而知，结局还是一样。


    曾国藩这个人最大的特点，就是足够执着。他又一次写了诗文，请劳崇光代呈。这一次，劳崇光是硬着头皮答应帮忙的，并警告曾国藩不会再有下次了。然而，正是这一次打动了穆彰阿。当然，不是他的诗写得好，而是他太执着了，穆彰阿看重的正是这一点。


    曾国藩的木讷、老成持重，也许在旁人看来是缺点，但在穆彰阿眼里恰恰是优点。就这样，曾国藩点了翰林。穆彰阿是道光帝跟前的红人，位居首席军机大臣、文华殿大学士。有了他的提携，曾国藩10年间获得7次升迁，在礼部、兵部、工部都干过副职（侍郎），成为二品大员。除了穆彰阿之外，曾国藩还搭上了三相帝师、领班军机大臣祁隽藻的线，正是这条线日后挽救了他的仕途。按理来说，就算是翰林，也很难有这样的显贵搭上关系，毕竟在京城扔一块砖头都能砸中一堆红顶子。但曾国藩就是有这样的手段，他与祁隽藻的胞弟祁宿藻是同榜进士，十分投缘，一来二去，也就与这位同学的大哥熟悉了。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '道光帝驾崩后，咸丰帝上台。早在还是太子时，咸丰帝就很讨厌穆彰阿，登基后便一纸诏书将穆彰阿罢了官，就差没砍他脑袋了。至此，穆彰阿的党徒们的运气也就到头了。曾国藩作为穆彰阿的得意门生，是妥妥的穆党铁杆，自然也在打击的范围之内。刚好当时咸丰帝下诏求进言，曾国藩就写了一道《敬陈圣德三端预防流弊疏》，说得好听点是直白地指出皇帝的不足，实际上是把咸丰帝骂了有个血淋头。咸丰帝看了奏章，气得暴跳如雷、七窍生烟。史载：“疏上，帝览奏大怒，摔谕地，立召军机大臣，欲罪之。”这时候，站在一边的老臣祁雠藻轻轻说了一句：“主圣臣直。”这一记马屁拍得极是时候，不但给咸丰帝降了火，也有了进一步进言的机会。祁雠藻向咸丰帝解释，求直言的诏书是皇帝下的，如今像曾国藩这样敢说真话、直话的臣子不多，如果就此把曾国藩处理了，那么就会失信于群臣，再也不敢有人进言了，您也就听不到真话了。所以，咸丰帝不但没有治曾国藩的罪，反而给他派了新的差事。


    从道光十八年(1838)起，曾国藩整整做了13年京官。除了日常公务外，他还干了另外一件事，那就打造坚实的朋友圈。太常寺卿唐鉴、大学士倭仁、刑部侍郎吴廷栋、江西道御史窦培、通政司副使王庆云……这些官员有的精通理学，有的擅长诗文，有的好金石学，有的是通儒，在气质上与曾国藩相通，因而在公务之余，他们经常饮酒畅谈。所谓“十年磨一剑，一朝试锋芒”，曾国藩的京官生涯，使他在为人、为学、为官等方面都练得炉火纯青，在人性的洞悉方面更是登峰造极，剩下的就是做大一番大业了。


    太平天国的爆发，给了曾国藩这个机会。咸丰二年(1852)，曾国藩的母亲去世。按照惯例，他要回乡丁忧，也就是离职守孝。此时，太平军已经杀入湖南，并占领了岳州（今岳阳）。曾国藩上书请求进行团练，在地方上组织乡民抵抗太平军。得到允许后，他便与湖南巡抚张亮基一起练兵。为了训练出一支敢战、善战的军队，曾国藩亲自挑选军官，尤其注意将有师生、同窗、同乡关系的读书人招入军中。他拒绝社会上的闲散人员当兵。因为这些人固然悍勇，然而往往也十分油滑，遇到攻坚战容易开溜。有师生、同窗、同乡关系的人，彼此知根知底，作战时能形成牢固的协作团体。而且，这些人有一定的文化知识，能够更好地理解作战意图。就这样，曾国藩的湖南老乡、双峰教书先生罗泽南进入军营，罗泽南的学生王鑫、李续宾、李续宜、李杏春、蒋益澧、刘腾鸿、杨昌濬、康景晖、朱铁桥、罗信南、谢邦'
  merge: -1
