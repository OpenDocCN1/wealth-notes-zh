  md: '# # 商鞅：我如何了解老板内心的真实想法


    > 如何说服身份比较高的人？


    > ——让他觉得这个想法是他自己想出来的……


    商鞅出生卫国公族，但卫国是个小国，对于他这个大神来说庙有点儿小。因而他投奔魏国，想在那里找到施展自己才华的平台。魏国的国相公叔痤虽然看重商鞅，但到了病重临终前才来看望他的魏王推荐商鞅。他对魏王说：“我的门客商鞅虽然年龄不大，但是个英才，希望大王能重用他。”魏王随便答应了一句，便准备离开。公叔痤让左右的人都出去，悄悄地对魏王说：“大王如果不打算用他，最好杀了他。”魏王随口答应了，但他认为公叔痤已病入膏肓，意识未必清醒，因而对他的话并不在意。


    魏王走后，公叔痤立刻叫来商鞅，对他说：“刚才我向大王推荐了你，我从他的神情看出他不会用你；我又进言让他杀了你，你快走吧，走得晚了就可能会被抓。”商鞅摇了摇头说：“大王不会听你的话用我，又怎会听你的话杀我呢？”于是商鞅并未逃走，依旧留在魏国。魏王果然没有重用商鞅，但也没有杀他。很显然，公叔痤并不了解他老板的真实想法。


    战国时代的国君广泛求贤，知识分子们也频频跳槽。公叔痤死后，商鞅知道他在魏国得不到建功立业的机会了，听说秦国发布了求贤令，就去了秦国。当时秦孝公当政，来面试的人很多，要想在众人中脱颖而出，就必须攥住领导的心，使他有了解自己的欲望。商鞅先在秦都的招贤馆住了下来，和那些被秦孝公召见过的人聊天，以了解情况。之后，他拜见了秦孝公信任的臣子景监，向景监陈说自己建功立业的雄心。景监被他打动，随即向秦孝公推荐他。当时，秦孝公已接见了一拨又一拨面试的人，其中多浮夸之人，少实学之才。


    秦孝公见了商鞅，只听商鞅大谈“仁道”，为君应该像尧、舜那样，以仁义礼智来教化百姓……秦孝公尽管对这一套陈腐之说十分不耐烦，但见商鞅说得兴高采烈，只好耐着性子听下去。《史记》中记载：“孝公既见卫鞅，语事良久，孝公时时睡，弗听。罢而孝公怒景监曰：‘子之客妄人耳，安足用邪！’景监以让卫鞅。卫鞅曰：‘吾'''
  merge: -1
  img_proc: true
- pgno: 92
  md: '说公以帝道，其志不开悟矣。’”通过这次接触，商鞅了解到秦孝公对做尧、舜那样的上古贤君没有兴趣。


    五天之后，秦孝公第二次召见商鞅时，商鞅改谈“王道”。秦孝公把自己的坐席稍向商鞅的身旁拉了拉，然而越听越觉得乏味。面试结束后，他又一次责备了景监。不过，商鞅请求秦孝公再面试一次自己。


    秦孝公第三次召见商鞅时，商鞅改说“霸道”。孝公越听越精神，不知不觉地与商鞅靠得越来越近。两人谈了整整一天，都不觉得疲倦。


    之后连续几天，秦孝公都召见商鞅单独面谈，最终接纳了商鞅的治国之策，任命商鞅为左庶长，开始变法。后人们禁不住问：为何商鞅不在第一次就陈述“霸道”呢？这是因为，商鞅需要了解老板内心的真实想法，看他是否是自己的“真命天子”。战国乃是大争之世，如果秦孝公采纳了仁道或者王道，也许商鞅就拍拍屁股走人了，继续寻找下一个雄主。与公叔痤相比，商鞅更善于了解老板的想法，也懂得了解老板的方式。


    对于有抱负的员工，找到合适的老板比找到一份高薪的工作更加重要。对于企业或团队来说，老板决定了其发展的天花板。如果天花板较低，即便是英才，也只能低着脑袋、弯着腰做人；反之，如果老板本身目光远大，则员工的发展不可限量。商鞅的三段式话术，是他测量秦孝公内心的一把尺子，也从另一个角度告诉秦孝公什么是适合秦国的、什么是不适合秦国的。通过三次谈话，商鞅既了解了老板的真实想法，也坚定了老板的变法意愿。毕竟在变法的背后，最坚定的支持者来自国君。最终，他在秦国掀起了中国历史上影响深远的一次变革。'
