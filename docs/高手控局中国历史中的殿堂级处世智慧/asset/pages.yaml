    齐王想了想，最后只得放弃。


    古人云，“名不正，则言不顺”。齐国一旦获得九鼎，就有了天命这个号令，齐王当然迫切地想得到九鼎。但是颜率却不断提高搬运九鼎的门槛，大大增加搬运成本，使齐王知难而退。


    齐王很清楚，九鼎只是一种象征，不需要动用那么多人马搬运，但是齐和东周故地不接壤，搬运九鼎必须向他国借道，这势必会遭到他国的反对，甚至是为他人做嫁衣裳。周王室虽已极为衰微，但是还没到彻底消亡的时候，齐王只能放弃。在这个过程中，颜率巧妙地采用提高门槛的办法，使得齐王意识到办成这件事几乎没有可行性。


    平王东迁后，诸侯日渐崛起，直接管理的地盘越来越小。即便如此，周王室仍然持续了500多年。这一方面依赖于诸侯们还需要天子的名号，另一方面也因周王室有颜率这样的贤才。颜率料事于未行之前，一席话挽救国家于水火，堪称团体中的话术天才。'
