- pgno: 229
  md: '那样派遣国相，也不能直接任命官员，南越实际仍由赵佗统治。面对强者，赵佗选择了示弱。


    汉高祖去世后，吕后登上政治舞台。在吕后当政的第七年，汉王朝与南越交恶。在经济上，对南越实行经济封锁，禁止出口铁器和其他生活用品；在军事上，命令隆虑侯周灶率领大军去征讨。由于汉军不适应当地的酷热气候，又染上瘟疫，所以战事迁延。赵佗的情报也很准确，得知周灶是跟随刘邦打过天下的名将，不是易与之辈，就写信给周灶，表示愿意求和。一年后，吕后驾崩，周灶班师，这场仗并没有真正打起来。后来，赵佗还对毗连的另一诸侯国长沙国耀武扬威了一番。


    不论以何种手段保全自己，这时候赵佗开始抖了起来，他先是打压东边的闽越国，接着控制住西边的西瓯、雒越部落，一时风头无两。赵佗干脆自称“南越武帝”，过足了皇帝的瘾。


    汉文帝刘恒上台后，再一次正视赵佗。这一次与上一次不同，上一次他只是没有纳入汉王朝统治序列的异姓王，好比没有接受朝廷招安之前的弼马温自称“齐天大圣”，是与天日争辉的僭越行为。而陆贾再次出场，充当了太白金星的角色。


    文帝让陆贾带着自己的信，将其亲手交给赵佗。后世将这封信称为《汉文帝赐南越王赵佗书》。这封信不长，归纳起来有两层意思。第一，你的祖坟我修葺了，你的族人我照顾了；第二，你应该守规矩，称臣。文帝的信虽然写得平淡浅淡，但是赵佗并不傻，这是一封暗藏杀机的信。他的反应和孙悟空极为相似，表示愿意重新归顺天朝，年年进贡，永远称臣，做大汉的藩属国，并亲手给文帝写了回信。这封信实在太精彩了，照录如下。


    蛮夷大长老夫臣佗昧死再拜上书皇帝陛下：


    老夫故粤吏也，高皇帝幸赐臣佗玺，以为南粤王，使为外臣，时内贡职。孝惠皇帝即位，义不忍绝，所以赐老夫者厚甚。高后自临用事，近细士，信谗臣，别异蛮夷，出令曰：“男子蛮夷外粤金铁田器；马、牛、羊即予，死牡，毋与牝。”老夫大辟，马、羊、羊齿已长，自以祭祀不修，有死罪，使内史藩、中尉灋、御史平凡三辈上书谢过，皆不反。又风闻老夫父母坟墓已坏削，兄弟宗族已诛除。吏相与议曰：“今内不得振于汉。外亡以自高异。”故更号为帝，自帝其'
  merge: -1
