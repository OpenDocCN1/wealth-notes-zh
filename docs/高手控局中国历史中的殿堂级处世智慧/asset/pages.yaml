  md: '# 郭子仪：守持忠信，低调做人


    当你把自己看高时，危险就来了。低调，是最聪明的“高调”。


    郭子仪，唐代著名的军事家与政治家，在平定安史之乱中立下大功，可以说有再造大唐江山的功勋。与历史上其他功高盖主的大臣不同，唐肃宗、唐代宗、唐德宗三代皇帝都对他十分礼遇，唐德宗甚至尊他为“尚父”，使他进位太尉兼中书令。郭子仪本人不但位极人臣，被封为汾阳郡王，他的儿妇们也都是高官显贵。《新唐书》中记载：“八子七婚，皆贵显朝廷。”在纷繁复杂的中唐时期，郭子仪是如何做到功业与身家两全的呢？


    作为军事家的郭子仪，对人情世故有着深刻的洞察。早先，郭子仪和李光弼都是节度使安思顺帐下的牙门将军。二人虽是同僚，但是并不和睦，在一张桌子上吃饭，彼此不交谈，甚至相互怒视。后来安思顺离任，郭子仪被任命为节度使。节度使的权力很大，对麾下将士有生杀予夺之权。李光弼只求一死，请郭子仪赦免自己的妻儿。当时安史之乱已经爆发，唐玄宗命郭子仪向东讨伐赵、魏等地的叛军。郭子仪走下台阶，拍着李光弼的肩膀说：“如今国家遭逢叛乱，连皇上都避难去了，哪里是报私怨的时候，我希望能和你一起荡平叛乱。”李光弼一听，尽释前嫌，从此二人相互配合，与叛军作战。在平定安史之乱的过程中，郭子仪和李光弼二人几乎立下了一样的功劳。


    郭子仪率领大军与吐蕃作战时，一向与他不睦的大臣宦官鱼朝恩指使人挖掘了郭子仪父亲的坟墓。大臣们得知后，都担心郭子仪会因此造反。郭子仪回到朝廷后，代宗皇帝将此事告诉了他。郭子仪一边流泪，一边说：“我长期带兵，无法禁止士兵们破坏百姓的坟墓，如今有人挖掘了家父的坟墓，这是上天的惩罚啊。”唐代宗对郭子仪的胸襟很是赞赏，对外的疑虑也打消了。鱼朝恩请郭子仪去赴宴。外间传言鱼朝恩将对郭子仪不利，宰相元载希望他多带一些武士，但郭子仪却只带了几个仆人。鱼朝恩见他带的人那么少，就问他为何。他就将外间的传言告诉了鱼朝恩。鱼朝恩听后，哭着说：“幸亏您是忠厚的长者，否则一定会对我起疑心。”就这样，郭子仪消除了鱼朝恩对他的忌惮。


    郭子仪的儿子郭暧娶了代宗皇帝的女儿升平公主，成了驸马爷。一次，小两口吵嘴，郭暧说：“你不就是仗着你爹是皇帝吗？”'
