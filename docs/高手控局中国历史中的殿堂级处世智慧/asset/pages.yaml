  md: '# 黄权：进取有建树，退而能全身


    人生，一味退缩，终会退无可退；只知前进，也难免会有去无回。需要牢记三件事：一知进退，二识深浅，三懂取舍。


    黄权早年巴西郡担任低级官员，后来得到益州最高行政长官刘璋的赏识，被征召为主簿，相当于秘书长。


    黄权很有远见，当得知刘璋准备引刘备入川，用来抵御汉中的张鲁时，他力就极力反对。他对刘璋说：“刘备和他的属下骁勇善战，引他入川，如果将他当下属，则无法满足其心愿；如果将他当宾客，则一国无二主。如果宾客稳如泰山，则主人危若累卵。将刘备引来，很危险啊！”刘璋不仅没有听黄权的忠告，反而将他外派到广汉当县令。


    刘备入川后，果然如黄权所料，反客为主，夺取益州。刘备的大军进攻广汉时，黄权闭门不降，后来因主公刘璋投降，他只得投降。刘备让刘璋驻守荆州，逐渐将他边缘化。对于黄权，刘备非常欣赏他的才能和志节，封他为偏将军。建安二十年(215)，曹操南征张鲁，黄权对刘备说：“汉中好比蜀地的大腿和手臂，如果汉中被曹操占领，我们就危险了。”刘备认为黄权很有远见，便任命他为中护军。之后，刘备攻破巴郡首领杜濩、朴胡部落，又发动汉中之战，在定军山斩杀曹操的大将夏侯渊，进而占领汉中。这一切，都是黄权在背后做操盘手。


    章武元年(221)，刘备称帝，准备讨伐东吴。黄权认为这个行动从战略上来说过于轻率，蜀汉军队在上游，顺流而下，易进而不易退。他请求率领前军做试探性进攻，让刘备坐镇后方，待机而动。刘备未采纳他的建议，而是任命他为镇北将军，率领江北军队监视曹魏动向，避免自己进攻东吴时被曹魏插屁股。


    事实再次证明了黄权敏锐的洞察力。刘备的大军在夷陵遭到陆逊的火攻，精锐尽丧，败退到白帝城。与此同时，黄权返回蜀地的道路也被吴军阻断。面对这种局面，相较于投降当时的仇敌东吴，投降曹魏对蜀汉的伤害较轻，因而黄权率军投降了曹魏。'
