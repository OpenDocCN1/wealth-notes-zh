  md: '国，如果输了，越国就会在背后袭击它；如果赢了，它一定会进攻晋国。"


    晋君立即决定把大军调集到边境，以应对不测。吴军东征后，果然击败了齐军，使得鲁国转危为安。胜利的吴军十分骄傲，又陈兵于晋国边境。但晋军早有准备，将疲劳的吴军杀得大败。越王勾践得知后，果然向吴国发动偷袭。夫差得到消息后，挥师教训越国。可是由于吴军长期作战，士兵疲惫不堪，几乎丧失了战斗意志，连战三次都失败了，吴国很快就灭亡了。越王称霸，成为春秋时期的最后一位霸主。


    此次外交中，子贡在鲁、齐、吴、越、晋五国间周旋，陈说利害，使得各国国君都对他俯首听命，堪比挂六国相印的苏秦。他以一己之力，保全了鲁国，打乱了田常篡夺国政的阴谋，还使得骄纵的吴国灭亡，又顺势恢复了越国，使其称霸。说他的三寸之舌顶得上百万雄兵，丝毫也不为过。'
