  md: '裴度在宪宗朝立下的第一个大功是安抚魏博（军事重镇，管理魏州、博州、相州、贝州、卫州、澶州六州）。魏博是唐朝设在河北的军阀，节度使田季安十分跋扈，不听朝廷节制，俨然一方王侯。田季安死后，他的儿子田怀谠年幼，无法处理魏博六州的军务，因而军务被家奴蒋士则掌控。蒋氏目光短浅，处事全凭个人情感，因私废公，导致将士们非常不满。唐宪宗早已将魏博割据视为眼中钉，希望激起兵变，收回大权。


    田弘正是魏博的都知兵马使，将士们想拥戴他做主帅。一天，他去拜访田怀谏，被将士们围了起来，请求出任节度使。田弘正提了两个要求，只要将士们答应，他就愿意担纲：其一，不能杀害田怀谏一族；其二，要遵守朝廷的法度。唐朝自安史之乱后，藩镇割据，一些骑兵为了利益最大化，前一任节度使离任或年老时，士兵们动辄聒噪哗变，杀掉前一任，拥戴新帅，这几乎成了常态。节度使不服从朝廷，士兵们也动不动就挟持节度使发动叛乱。田弘正提出这两点，正是源于以上原因。将士们答应了他的条件。他当即夺取印信，自称留后，诛杀了蒋士则，将田怀谏迁出府衙，并保护他的安全。


    唐宪宗得知魏博之变后，派裴度去安抚，裴度宣布了朝廷的诏书。田弘正十分尊重裴度，并请求他在自己办公的大厅墙上题字，记录这次会面，表示愿意听从朝廷号令。之后，田弘正请裴度视察其他六州，宣读朝廷旨意。裴度此次出使，非常出色地完成了朝廷的任务，从而迈上报的台阶。元和十年(815)六月，成德节度使王承宗、平卢节度使李师道派刺客刺杀了主张制衡藩镇的宰相武元衡，裴度也被刺客刺伤。唐宪宗大怒，时隔三日后就任命裴度为宰相，对反叛的淮西藩镇用兵。两年后，淮西节度使吴元济被俘虏处死，淮西荡平。惶恐的成德节度使王承宗也交出两个州，向朝廷谢罪。一年后，李师道被其部将所杀。


    在裴度的运作下，唐宪宗削弱了藩镇，强化了中央集权，实现了“元和中兴”。唐宪宗本人也被历史学家称为“小太宗”，称赞他有唐太宗李世民那样的识人之明。


    裴度在政治、军事上的做法都十分老练，为延续唐朝国祚立下大功，这与他非凡的问题处理能力是分不开的。'
