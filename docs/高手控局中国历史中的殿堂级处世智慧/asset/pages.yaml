  md: '与大明帝国相比，无论是资源还是人员，瓦剌都只能算是一个小部落，也先充其量就是一个酋长而已。他像之前的无数次一样，寇边的目的无非是打秋谷，也就是劫掠财物和人员。未曾料到的是，一个部落酋长竟然俘虏了帝国皇帝，这令他喜出望外。他觉得敲诈明朝的机会来了，说不定还能借此灭了大明，建立举世瞩目的功勋。


    皇帝被俘，在朝堂上引起一阵混乱。侍讲徐珵借星象有变化，向监国的郕王（明英宗的异母弟）建议迁都南京，避敌锋芒。兵部左侍郎于谦坚决反对，并大声说：“建议迁都的人，应该立刻斩首。”京师是国本，一旦迁都，就意味着将北方的大片领土拱手让人。于谦还举例说了宋室南渡后，再也不能恢复的事。于谦的建议得到了吏部尚书王直、内阁学士陈循等官员的支持。郕王见于谦等大臣意志坚定，便肯定了他们。


    也先俘虏了明英宗后，觉得实在应该好好利用一下。次年，他带着明英宗到了大同城门下，让明英宗向城上守将发布口谕。《明史纪事本末》记载：“二十三日，也先拥上至大同城下，索金币，约赂至即归上。都督郭登闭门不纳。上传旨曰：‘朕与登有姻连，何外朕至此！’登遣人传奏曰：‘臣奉命守城，不敢擅启闭。’”也先欺骗大同守将，只要给够钱，他就把明英宗放回去。但大同守将郭登识破了也先诈开城门的诡计，拒绝了也先。打不开城门，那就勒索一些钱吧。也先用明英宗当肉票，向明朝狮子大开口。


    明英宗在也先手里，朝堂上无主，这对大明王朝来说十分危险。因为帝国时代，皇帝掌握最高权力，如果哪个守将听了明英宗的话，打开城门，那可为祸不浅了。当下一举，是釜底抽薪，让也先手里的明英宗失去价值。在于谦的提议下，郕王朱祁钰登上皇位，是为明代宗。也先得知消息后，恼羞成怒，率领大军直逼北京。


    于谦早已获得情报，一方面稳定内部，取得高级官员们的一致支持；另一方面进行积极的部署和动员。明代宗授予于谦“提督各营军马”的大权，所有将士均受其节制。于谦将京师三大营改成10个团营，以便统一指挥。为了在军事上形成绝对优势，他还调集京畿、河南备操军，沿海备倭军，江北及北京诸府运粮的官军，以及浙江兵进京，短期内就拥有了22万的人马。同时，他还派出监察御史白圭等15名高级官员前往京畿、山东、山西、河南募兵，作为应急部队加以训练，充当预备队。'
