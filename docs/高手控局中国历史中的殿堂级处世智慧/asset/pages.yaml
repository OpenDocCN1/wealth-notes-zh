- pgno: 136
  md: '范仲淹很清楚饥荒与供求之间的关系。两浙饥荒，不是整个宋王朝都缺粮，而是区域性缺粮。饥民买不起粮食，是因为商人们趁饥荒囤积居奇。但他又不能用自已的权力去打击商人，因为这些商人背后都有官僚背景，唯一的办法就是用市场的方式来解决。


    当粮食短缺，也就是供不应求时，粮价必然会上涨；反过来，当供大于求时，则粮价必然会下跌。只要改变供求关系，饥荒问题自然就解决了。当然，在短期市场没有发生变动前，他及时采用“以工代赈”的办法，让寺庙扩建、改造公共设施，暂时收留饥民，避免了饿死人的事继续发生。


    这一年的灾荒非常严重，两浙路的州县饿死不少人，但杭州的损失却很小，没有发生饿死人的事，这是因为范仲淹举措得当。很显然，范仲淹不仅有经济学的常识，而且深通人性，充分利用商人谋利的心理，反其道而行之，不用政府花一分钱，就使得大量粮食被运到杭州，从根本上解决了问题。


    范仲淹对官员的要求很严格。庆历新政时考核官员，他一手拿着考核报告，一手拿着笔，凡是不称职的官员，就在花名册上划掉，被时人称作“一笔勾销”。


    和他一起搞新政的富弼都不看不下去了，对他说：“你一笔下去，就会让一家人痛哭啊。”范仲淹说：“一家人哭，总好过一路人哭。”范仲淹说的是“路”是北宋的行政区，差不多相当于现在的省。


    范仲淹虽对官员考核严格，但用人上又能做到注重才能且不拘小节。孙洐、滕元发都曾被朝廷处罚而罢官，但范仲淹请他们做自己的幕僚。他的朋友对此感到不解，范仲淹解释道：“有才能且人品好的人，朝廷迟早会用他们；不幸蒙受污点的人，负有才能，不用他们就真的成为遗才了。”正因如此，范仲淹帐下人才很多，这也是他无论在政事还是军事上都能成功的原因。'
