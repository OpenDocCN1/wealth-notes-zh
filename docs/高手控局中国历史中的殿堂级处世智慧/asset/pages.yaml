- pgno: 202
  md: '# 杜如晦：团队中的决策大师


    当你只剩下一个选择时，无论这个选择多么不好，都总比没有选择强得多！


    隋末天下大乱，薛举割据于陇西，李轨称王于凉州，刘武周起兵于马邑，窦建德崛起于河北，王世充自立于洛阳……一时间，群雄并起，隋朝晋阳留守李渊也树立大旗，加入争夺天下的洪流中。


    在这场竞速中，李渊之子李世民，也就是后来的唐太宗，立下了不世之功。李唐王朝之所以能够成功，除了推行正确的策略与拥有强大战斗力的军队外，一个很重要的原因就是充分发挥了人才优势。以秦王李世民为例，他的麾下不但有一批能征善战的将领，还有一个完善的智囊团体，为其提供战略指导。


    李世民于贞观十七年(643)命画家阎立本绘制24位功臣的画像，将他们悬挂在凌烟阁，以昭示他们立下的功勋。在这个既有文臣也有武将的序列中，名列第三的杜如晦尤其耀眼，是这个团队的核心人物之一。可以说，李世民能够建立不世之功，登上帝位，杜如晦起了巨大的作用。


    李世民立志扩大自己的基本盘，对人才的网罗可以说无微不至。征召杜如晦后，李世民最初让他担任秦王府的法曹参军，主管司法事务。太子李建成见李世民羽翼颇丰，对自己形成巨大威胁，因而上奏李渊，要求外调秦王府的官员，以削弱秦王府与太子府抗衡的能力。


    事实上，太子府与秦王府的争斗已经让李渊焦头烂额。一方面，秦王李世民确有统兵之才，要荡平群雄，李渊还得依赖他；另一方面，李世民雄厚的势力也挑战了太子李建成的储君之位，李渊不希望发生骨肉相残的事。外放秦王府的官员，削弱秦王府的势力，进而打消李世民对皇位的觊觎，可以说是两全其美的事。


    李渊的诏书下达后，秦王府的官员纷纷被外调出长安，这令李世民非常忧虑。房玄龄对李世民说：“府中的其他官员被外放，没有什么是可惜的，只有杜如晦，要想办法将他留下。大王如果安于做个王爷，那用不上他；但若想执天下的权柄，就非他不可。”李世民当即上书，请求留下杜如晦。'
