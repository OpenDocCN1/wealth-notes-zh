- pgno: 200
  md: '永嘉六年(312)二月,石勒奉命进攻建业(今南京)。当时江淮一带雨水连绵,汉赵军队疾疫流行,加上粮食不足,决战不利,死了很多 人。面对随时可能崩溃的大军,右长史刁膺认为应该暂时向对面的晋军投降,等机会成熟时再反击。石勒的谋臣夔安、孔袭、支雄也都附和这一建议。但张宾坚决反对,他一针见血地指出,石勒率军攻陷了晋朝的帝都,俘虏并囚禁了天子,杀死了很多晋臣,这时候如果向对方投降,必定会遭到清算。邺城城墙增厚,设施完整,建造有三台(铜雀台、金虎台、冰井台),易守难攻,且有山河之险,应该作为发展的根据地,占领它,而不是在这里与晋军做无谓的消耗。


    石勒担心撤军会遭到晋军的追击,张宾却认为晋军志在自保,汉赵撤军他们只会弹冠相庆,绝不会来袭击后方。他还建议让辎重先撤,大军在后徐徐撤离,如此便可保无虞。石勒对张宾的建议非常认可,升迁他为右长史,不直呼他的名字,而是称“先生”。至此,张宾完全进入了石勒集团的决策层。


    晋朝幽州刺史王浚势力很大,一直想灭掉石勒。鲜卑段部的军事集团是他的雇佣军,共有5万余人,王浚命令他们进攻石勒的根据地襄国(今邢台襄都区)。石勒面对强敌的围攻,指挥士兵与敌人血战,损失非常严重。石勒准备突围,谋臣们则主张坚守疲敌,等敌人的锐气磨尽再反击。


    张宾不同意这些主张,他认为鲜卑段部的核心人物是段末柸,我方可以暂时不出战,敌人攻城,后面就会空虚,这时候悄悄挖地道出去俘虏主帅,就能取胜。石勒接受了张宾的谋划,挖了20余暗道,突然杀出,抓获了段末柸。段部雇佣军的士气遭到毁灭性打击,大败亏输。石勒释放了段末柸,并与他歃血为盟,彼此不再攻伐。没有了鲜卑段部的支持,王浚的实力大减。


    张宾认为,王浚虽然是晋朝的臣子,但一直有叛逆之心,想自己当皇帝。我们可以先向他示弱,假装支持他,然后寻机灭掉他。石勒认为张宾说得有道理,便给王浚送去厚礼,并称臣,表示愿意支持他登上皇位。王浚信以为真,认为石勒是真心投诚,因而未加防范。石勒向王浚上表,表示要在当年(314)三月赴幽州,加入劝进的队伍。但二月,就在张宾的支持下,石勒就发动了偷袭幽州的计划。军队行进到柏人县时,石勒犹豫了,止步不前。原来,他是恐惧。'
  merge: -1
  img_proc: true
- pgno: 201
  md: '石勒的恐惧是有理由的：偷袭幽州的军队需要走十天左右的行程，而乌桓、鲜卑部落的骑兵很快就会发现他们。更为可怕的是晋朝猛人、并州刺史刘琨也近在咫尺，弄不好偷袭幽州不成，反而会被三方吃掉。身处险地，张宾果断地说：“我们长途奔袭，在于兵贵神速，我们都是轻骑兵，就算被发现了，也能很快撤回。刘琨与王浚虽然都是晋臣，但他们一向不和，很乐意看到对方灭亡。我们需要快快做出决断，还停在这里干什么呢？”石勒高兴地说：“我不能做的决断，先生都为我做了，没有什么可疑虑的了。”石勒立即派使者给刘琨送信表明想法，刘琨果然不再插手。


    三月，石勒的军队渡过了易水，依旧没有引起王浚的警惕。军队到了城门外，石勒驱赶上千头牛羊入城，宣称是给王浚送礼来了。王浚的士兵没有反应过来，加上道路被堵塞，石勒杀入城中，俘虏了王浚，一代枭雄就此丢掉性命。


    光初二年(319)二月，石勒自称赵王，设置百官，后赵立国。张宾以勋臣的身份统领朝臣，位同宰相。在石勒集团的发展中，每到关键时刻，张宾都能给出正确的建议，并帮助老板拍板。若非他的果决，石勒的事业肯定会大打折扣。


