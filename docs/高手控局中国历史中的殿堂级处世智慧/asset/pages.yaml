- pgno: 74
  md: '食于前，亲手调羹”。玄宗向李白咨询当下实务，李白应对如流，回答得十分妥当。之后，玄宗任命李白为“供奉翰林”，负责起草诏书，充任皇帝的高级秘书兼幕僚。这一天，可以说是李白的高光时刻。


    最初，玄宗凡有出行，必让李白扈驾，并将饮宴、郊游都以诗文的方式记录下来。李白诗才敏捷，倚马可侍，一再受到玄宗的嘉奖。


    天宝二年(743)，宫中的牡丹花盛开，玄宗与贵妃杨玉环以及王公贵族们举行聚会，下诏李白伴驾。为此，李白写下了那首著名的诗作《清平乐》。朝朝宴会，夜夜笙歌，没完没了的彩虹屁，最初李白还有一些被重用的错觉，但时间一久就明白了、厌倦了。他的志向是做帝国的幸辅，而不是当文学侍从，给皇帝装饰门面、粉饰盛世。


    供奉翰林的身份，使他在长安拥有了更广的社交面，上至王公，下至布衣，只要能作诗、喝酒，或者与他性情相投者，都能成为他的朋友。他醉酒狂歌，与贺知章、崔宗之等八人彻底放飞，被时人誉为“饮中八仙”。


    酒喝得多了，他在业务上逐渐怠慢，以至于玄宗派出宫廷内将来召时，李白经常处在酒醉中，而无法伴驾。


    一次，他酒醉中被召，奉命起草诏书，仰着脚让玄宗的宠臣高力士给自己脱鞋子，引得宫人事后非议。其实，玄宗很清楚，文学弄臣的身份是拴不住李白的，与其让他过这种不快乐的生活，还不如还他自由。李白的性格并不适合浊污的官场，至于宫人的诽谤还是其次。就这样，玄宗赐金，李白还山，结束了他短暂的官场生涯。


    翰林是高级文臣，在某种程度上可以说是宰相的储备人才。如果李白遵循官场游戏规则，一步步晋升为相，并非不可能。这种规矩发展到后世，尤其是明清时期，虽然不设相，但内阁辅臣多为翰林出身，乃至成为一条铁律。


    离开长安后，李白来到洛阳。在这里，他认识了另一位朋友—杜甫，大唐文学史上最闪亮的两颗星终于相遇了。杜甫比李白小11岁，是李白的小徒弟。李白完全没有大明星遇到粉丝的那种俯视感，而是像当年孟浩然待他一样，以平等的姿态与杜甫相交，还与杜甫约定，一起游览梁宋（今开封、商丘一带）。当年秋天，他们践行诺'
