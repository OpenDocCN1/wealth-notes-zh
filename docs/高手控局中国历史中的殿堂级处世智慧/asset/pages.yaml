- pgno: 228
  md: '# 赵佗：面对强者时的智慧


    在情绪冲动的情况下做出的决策伤人伤己，总是让人追悔莫及。能忍住自己的脾气，是一种修养，更是一种能力。


    赵佗，恒山郡真定（今河北正定）人，秦朝南海郡龙川县令。秦末群雄逐鹿中原，赵佗阻断了岭南与中原的通道，杀掉了秦朝在南海郡的官吏，任用亲信为官，建立了包含桂林郡、象郡在内的割据政权南越，自称南越武王。


    一山不能容二虎，天下不能容二主。汉高祖十一年（前196）夏天，刘邦决定解决赵佗的问题。大夫陆贾表示不需一兵一卒，他就能让赵佗投降。刘邦当即任命陆贾为大使，让他带着诏书和礼物以及随从出发了。


    陆贾到了番禺后，赵佗故意装束成当地人的打扮，表现得非常傲慢。陆贾对他说：“你本是中原人，祖坟和族人都在中原，现在背叛父母之国，不念祖宗，放弃华夏衣冠，打算以南越弹丸之地和天子对抗，大祸恐怕即将来临。秦失其鹿，英雄共逐之，只有当今陛下先入关中，夺取咸阳。项羽背叛义帝，自称西楚霸王，诸侯们都臣服于他，可以说他非常强大了，但与汉王争天下，还是失败了。您与项羽比，谁更强呢？你在南越称王，宰相和将军们都建议提大军来征讨，只有当今陛下不愿百姓再遭受战乱的痛苦，派我前来，授予你王的印信和符节，你应该面向北恭敬地称臣，否则朝廷会挖掘你的祖坟，屠戮你的家族，命一名上将军率领十万人来征讨。到那时，你的部下就会杀了你然后投降。”


    陆贾的话，吓得赵佗冷汗直流。这倒并非陆贾恐吓他，与汉王朝正面对抗，其结局必然如此。只是在此之前，他从未如此清晰地面对这种危险。不过，作为一方豪雄，赵佗也有他过人的地方。他怕是怕，但表现得却十分得体。


    他一改刚才的倨傲，非常恭敬地向陆贾道歉，说道：“我与蛮夷相处得太久了，染上了一些坏习惯，忘记了咱们中原的礼仪，还请先生原谅。”就这样，赵佗向汉朝称臣，接受了诏书和印绶，成了汉王朝的藩属国。当然，由于天高皇帝远，汉王朝既不能像管理别的诸侯国'
