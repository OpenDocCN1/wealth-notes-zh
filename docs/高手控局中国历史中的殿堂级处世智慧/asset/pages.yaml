- pgno: 10
  md: '他们既能效命于刘邦，当然也能效命于项羽。项羽的大将、被封为九江王的英布，不就投靠了刘邦吗？所以，在楚汉争霸战中，坐镇关中的萧何源源不断地为前线的刘邦输送物资和兵员，使得刘邦战败后都能很快回血。但是刘邦依旧对他存有怀疑，多次派使者慰劳一所谓慰劳，不过是一种政治考察。萧何的门客提醒他，应该派遣能丛军的子侄兄弟到刘邦身边，在军前效力。对此，萧何心领神会，也立刻照做了。


    《史记·萧相国世家》中记载，萧何家的子弟到了军前，“汉王大悦”。很显然，这是萧何自送子弟为质，是取信于刘邦。刘邦当然是心照不宣，此后便不再派人慰劳了。让领导释疑，但不显山露水，这就是萧何的智慧。


    汉王朝建立后，萧何功劳最大，封户数最多，并以出众的管理才能，成为丞相的不二人选。大定天下后，刘邦先后将韩信、彭越和英布清除出局。在刘邦亲征英布时，萧何与太子留守后方。与楚汉之爭最危险的时期一样，刘邦即便是在最忙碌的时候，也不忘问来自长安的使者一句：“丞相在做什么？”使者如实回答：“丞相除了兢兢业业地工作外，还善于安抚百姓，在百姓中有好的名声。”听了这话，刘邦默然无语。


    按理来说，下属恪尽职守，领导在和不在一个样，这样的好员工，不应该得到几句口头表扬吗？刘邦为何反而默然无语呢？这是源于领导者的思考方式。萧何已是一人之下、万人之上，不但熟知权力运作模式，而且手上有兵有钱，如果他要想造反，缺的是什么呢？当然是号召力。号召力从哪里来呢？当然是道德魅力。他在百姓中有好的名声，那不就是号召力的来源一道德魅力吗？这能不刘邦沉默无语吗？


    萧何与刘邦之间的这层嫌隙，有没有人看得出来呢？


    有。萧何有个名叫召平的门客，原来是秦朝的东陵侯，当别人都在为萧何备受皇帝信任而祝贺时，他却穿了一身孝服。萧何斥责他没有规矩，他却告诉萧何：“你的死期不远了。”萧何大吃一惊，恭敬地询问，召平陈述了其中的利害。萧何能走到这一步，当然是一点就透的，于是立刻向召平请教。召平给他的对策只有两个字：自污。'
