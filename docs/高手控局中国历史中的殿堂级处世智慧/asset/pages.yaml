  md: '# 触龙：抓住大BOSS的内在需求


    > 永远要记住：和掌握权力的人说话，“打动”比“说服”更重要。


    前266年，赵国国君赵惠文王去世，他的儿子丹即位，是为赵孝成王。赵孝成王年幼，由母亲赵威后摄政。秦国趁赵国国君新立，主少国疑，人心不稳，便发起进攻，一连攻下赵国的三座城池。危机之下，赵国向齐国求援。但齐王要求赵国派长安君，也就是赵威后的小儿子到齐国当人才肯出兵。


    战国时期，结盟国家之间为了表示互信，互派贵族子弟当人质是一个传统，秦始皇的父亲秦庄襄王就曾在赵国为质。为质的公子到了盟国后，并不会遭受羁押，反而会有独立的住所和较大的生活自由。当然，比起在自己的国家，生活上肯定会差几个等级。一旦两国变成敌对国，为质的公子就会成为弃子，危险也就增加了。赵威后十分宠爱长安君，获悉齐王的要求后，当然不肯答应。有不识相的大臣接二连三地给老太太讲大道理，都被骂了出来。赵威后更是扬言：“再来劝谏的，老妇我必朝他脸上吐唾沫。”


    按理说，摄政的赵威后已经极为恼怒了，大臣们应该没有谁再敢去触霉头了，但是左师（执政官）触龙依旧向赵威后进谏，而且还成功了。那么，触龙是如何说服大BOSS的呢？这就不得不说说触龙的话术了。


    赵威后听说赵国政坛上的常青树一触龙请求进宫，当然知道他葫芦里卖的是什么药，毕竟都是千年的狐狸，演什么聊斋呀……因而，她摆好气势汹汹的架势，就等触龙劝谏的时候唾他一脸。触龙进宫后，远远看见太后，就一路小碎步、气喘吁吁地跑到赵威后跟前，告罪说：“我的脚有些小问题，连快跑都不行，很长时间没有来看望您了，但我又担心您的身体，所以常想来看看你。”


    赵威后淡淡地回应道：“我全靠坐车才能走动几下。”


    触龙又说：“太后，您的饮食没有减少吧。”


    赵威后逐渐放松警惕，说道：“时下也就每天喝点稀粥。”'
