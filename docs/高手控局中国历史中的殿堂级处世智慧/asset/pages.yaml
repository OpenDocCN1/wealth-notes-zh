- pgno: 129
  md: '# 李世民：非常之时，宜用非常之策


    想让别人“听我的”，就必须先想明白“别人凭什么听我的”。


    隋朝大业十三年(617)，太原留守李渊起兵争夺天下。当时，各路豪杰点燃的烽火已遍及全国，威胁着隋帝国。李渊树起大旗后，太原周边郡县传檄而定，只有西河郡的郡丞不听号令，将李渊视为叛贼。通常来说，早期建立帝业者，大多都从经营自己的根据地开始，如刘邦经营关中、曹操经营邺城，但李渊却不打算夺取整个三晋地区。他的战略是直接奔袭大兴（唐改名为长安），控制整个关中，从而经营全国。李渊的策略是经过深思熟虑的，当时大兴城是全国的政治中心，虽然局势动荡，但自北周以来的贵族上层都集中在以大兴城为圆心的关中地区，一旦拿下关中，则不不但可以获得优质的人力资源，而且将占有天然的地理优势。因而，他的主张得到了文武大臣和李氏子弟的支持，长子李建成和次子李世民尤为踊跃。


    西河郡是一个大郡，领隰城、永安、平遥、介休、灵石、绵上六县，正好挡住了李渊进军大兴城的前路。起家之路上的第一战，就是夺取西河。李渊把这项任务交给了长子李建成和次子李世民。两人率军一路奔向西河。出发不久，兄弟俩就发现了新的问题，那就是军纪。他们率领的士兵，是新募不久的，这些兵的构成十分复杂，有的是举起义旗那天从牢房里释放的囚徒，有的是击溃土匪历山飞后投降的匪徒，有的是街头的混混，还有一些突厥人，总之全都是狠人，没一个是省油的灯。行军路上，就有人跑到老百姓家里偷鸡摸狗。带领一群乌合之众去打仗，很可能战鼓一响，人就跑光了。通常而言，主帅会采用两种方式治军：一是制定军法，将军人的职责灌输给他们，通过教和练，将普通人训练为合格的军人；二是杀人立威，抓住一个剥几头杀掉，以杀鸡儆猴的方式，树立军威。第一种显然不合适，因为李家兄弟没有时间打磨一支纪律严正的军队。那么，第二种呢？同样遭到了李世民的否定。李家兄弟在这支军队中没有任何根基，杀人不但不能立威，反而很可能会立刻引发哗变乃至叛乱，恐怕还没有到西河，自己就先人头落地了。再说，自己本来就兵力有限，杀一个兵，就会使得自己的力量减弱一分。那么，如何赢得这些人的心呢？


    士兵有偷了百姓一只鸡的，李世民就让军需官配给老百姓一只鸡的钱；偷了一条狗的，就还给一条狗的钱。李世民不关心士兵们的道'
  merge: -1
  img_proc: true
- pgno: 130
  md: '德与良知，更重视的是战斗力。再说，这些人敢跟着他冒着杀头的罪造反，怎么可能是良善之辈？同时，他与李建成放下贵族公子的架子，与普通士兵同吃同睡：士兵未食，他们不食；士兵未饮，他们不饮。


    这些下层百姓出身的士兵，还从未见过主帅如此平易近人，因而很快与李家兄弟打成一片。李世民对小过失采取睁一只眼闭一只眼的态度，就连那些最刺儿头的家伙也笼络了过来。所以，当大军到西河城下时，两兄弟已经彻底赢得了这些士兵的心。


    夺取西河，与剿灭土匪历山飞不同，这是实打实的。与正规军作战的夺城之战，战斗顺利，就会拔掉进军关中的第一颗钉子；战斗失利，那么就意味着连走出太原都成问题，这样大本营内必然人心浮动，很可能事业就被扼杀在摇篮里。因此，这一战的意义非同小可。


    作战前，李世民在士兵中进行了充分的动员，并许下重赏。战斗一开始，这些人奋力杀敌，冒着矢石奋力向前。西河城虽然坚固，但挡不住这群如狼似虎的士兵。仅仅用了五天，李氏兄弟就拿下了城池。对于城中的百姓和士兵，李世民一律赦免，只将郡丞高德儒一人斩首示众。


    此战的胜利，充分展示了李世民驾驭士兵的能力。说得更明确一点，此战的胜利显示了李世民解决问题的能力。在不能按照常规解决问题时，能不能突破普通思维，创造性地解决问题呢？这显示了一个人的胆识和勇气。


    按照普通人的看法，在进军西河的路上，军纪是李家兄弟的头等大事，但李世民不被眼前的问题所困惑，而是看得非常长远，西河才是他的问题。从夺取西河的角度来解决军纪问题，自然就能抓住关键。


    非常之时，用非常之策。仅此一点，就可看出李世民身上的领导者才能。从某种程上论，不是他把握住了历史，而是历史选择了他。对于当下的企业领导，什么样的人能够成为领头羊，其最大的才能恐怕还是见识。见识跟不上，解决问题的能力也就平庸了；反之，见识卓绝，则问题就能迎刃而解。'
