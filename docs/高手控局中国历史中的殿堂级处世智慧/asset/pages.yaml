- pgno: 12
  md: '# 陈平：职场弯道超车实用技术


    高手破局，讲求的是阶梯和路径。在真正的利害面前，面子问题根本不是问题，拿来主义才是实用主义。


    西汉宰相陈平出身低微，是典型的穷小子。他的一生，堪称逆袭的典范。


    秦末天下大乱，这样的境况为陈平实现人生理想提供了舞台。不过要登上这个舞台需要资本，资本从何而来呢？


    陈平出生于战国末年的魏国，经历了秦国扫六合的时代，父母早亡，由哥哥抚养长大。他家有30亩地，哥哥整日劳作，陈平却不喜干农活，只愿意抱着书本读，或到处交朋友。《史记•陈丞相世家》中记载：“伯常耕田，纵平使游学。”


    陈平的哥哥虽然是个农夫，但却心胸宽广。弟弟不愿意耕田，喜欢读书交友，他不但不责怪，而且全力支持。陈平虽然出身穷苦人家，但却长得一副富贵相，身材高大而皮肤白皙。乡里人经常嘲笑他，有个邻居在村子里遇到陈平的嫂子，就故意问道：“你家陈平吃了什么，长得那么白？”平常就厌恶小叔子的嫂子一听，立刻揭短地说：“他一个穷酸相，吃的还不是糠！”陈平的哥哥得知此事后，立即就将妻子赶回了娘家。


    陈平到了结婚的年龄，乡里的上层人都嫌他穷，不肯嫁女给他。他又不甘心娶社会地位低的女子，就这样成了大龄剩男。乡里有个巨富名叫张负，他的孙女嫁了五次门，都是刚过门丈夫就死了，因此被视为“克妻命”，再没有媒婆肯上门了。陈平却不怕，一心想娶张家女子，但他太穷了，根本沾不上人家的门边儿。


    好在陈平脑子灵活，他得知张负好交游，经常出现在社会贤达的筵席上，于是找到一个机会，为一家办丧事的人帮忙，并为张负提供方便。张负看到这个人大大英俊，鹤立鸡群，十分欣赏。散场后，他要求和陈平同行，并去陈平家拜访。陈平也不扭捏，带张负去了他位于陋巷里的家。陈家虽家徒四壁，破席为门，细心的张负却发现，陈家门前的泥地上有很多车辙痕迹。这一番往来，虽然彼此没有摊牌，但都了解了对方的目的。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '张负回到家后告诉儿子张仲，要将寡居的孙女嫁给陈平。张仲当时就笑了，陈平可是全县的笑柄。《史记》中只记录了一句张负 的回应：“人固有好美如陈平而长贫贱者乎？”翻译成白话文，就是：你
    见过像陈平那么帅，却能长久贫灶的吗？


    谁说长得帅不能当卡刷？这桩婚事还真就成了！张家不但倒贴钱 给陈平，而且出酒肉宴请宾客，为他们风风光光地办了婚礼。张负在 送亲前一再告诫孙女，千万不能因陈家贫穷而怠慢，要像对待父母一
    样对待陈平的兄嫂。张负将孙女嫁给陈平，眼光自是不凡，这番话更 体现了他能成为巨富的教养、胸襟和格局。


    陈平借妻家之力提高了身份，又因为是读书人而常被邀请主持社 祭。社祭是一项公众性的祭祀活动，主持人一般是社会贤达，其中一 项工作是将祭祀后的酒食分给参加活动的人。在当时的社会，酒和肉
    都属于奢侈品，因此分酒食这项工作往往要由有威望的人来做。陈平 挥刀分肉，每个得到肉的人都很高兴，认为他很公平，并不由自主地 赞扬他。事实上，分肉要善于把握人心，参加社祭的既有头面人物，
    也有穷苦百姓。面对一整头猪，有的人喜欢瘦的，有的人喜欢肥的， 有的人喜欢带骨头的。陈平不是分得均匀，而是抓住了人的心理，其 对人性的洞察能力可见一斑。故而，当人们赞扬他“善为宰”时，他
    也禁不住飘了起来，说了一句大话：“让我宰持天下，也如同分祭肉 啊！”


    有了妻家的支持，陈平交朋友的层级立刻就不同了。当时陈胜、 吴广揭竿而起，六国贵族纷纷复国，陈平也被朋友拉着一起投奔复国 的魏王咎，担任太仆。陈平积极地为魏王咎出谋划策，但遭到魏王咎
    身边人的诋毁，谋划也就无法实施。陈平是个聪明人，他不会把才智 浪费在一个愚蠢的人身上，因此立刻就逃跑了。他追随的第二个东家 是项羽。在项家军中，他很快就崭露头颅，被封为“信武君”，和大
    将项悍一起领军。是时，刘邦出汉中与项羽争天下，项羽所封的殷王 很快被击败，投降了刘邦。陈平在此事中无所作为，遭到了项羽的迁 怒。于是，陈平封金挂印，再一次逃跑了。


    陈平两次换东家，相当于进行了两次风险投资。很显然，陈平是 一个理性的投资人，他不会堵上全部的身家性命，一旦风险评估达到 警戒线，就会立刻抽身。这也是他能够在风起云涌的秦末乱局中生存
    的智慧。相较之下，张耳、陈余、郦食其等人不能不说是豪杰，但都 在第一波浪涛中就被拍死在了沙滩上。'
