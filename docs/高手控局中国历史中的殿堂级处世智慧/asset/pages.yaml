- pgno: 46
  md: '赵仓唐说：“身为人子，三年不见父亲，这是不孝；身为父

    亲，三年不关心儿子，这是不慈。”赵仓唐一针见血地指出魏文侯父

    子之间的隔阂。


    事实上，魏击早就想打破与父亲之间的隔阂，只是他不知道用什

    么样的方式比较合适，因而对赵仓唐说：“我一直想打破这个隔阂，

    可是没有合适的人作为使者。”


    赵仓唐说：“我就是那个合适的人。”随后，他问魏击魏文侯有

    什么喜好。魏击告诉他，魏文侯喜欢晨凫（一种野鸭子）和北犬。


    赵仓唐当即命人捕捉晨凫，又购买了矫健漂亮的北犬，然后带着

    这些礼物来到了魏国的国都。到了宫门外，他对侍臣说：“请您向君

    侯呈报，就说孝不孝子魏击派了使者来，不敢和满朝的大夫们一起觐见

    您，希望将晨凫交给您的后厨，把北犬交给您的侍从。”


    赵仓唐的话说得非常得体，礼物也送到了魏文侯的心坎上，因此

    魏文侯单独召见了他，问道：“击，好吗？”


    赵仓唐的回答是：“唯。”


    魏文侯感到很奇怪。赵仓唐的回答十分含糊，让他不明其意。因

    而，魏文侯又问了一遍，结果赵仓唐的答复还是一个“唯”字。


    这让魏文侯十分不快，说道：“好就是好，不好就是不

    好，‘唯’是几个意思？”


    赵仓唐说：“您已经封我的主上为中山国之主，但仍然直呼其

    名，所以我不敢回答您的问题。”


    魏文侯恍然大悟，赶紧改口说：“中山君还好吗？”


    赵仓唐说：“我来拜见您时，他亲自送我登上了车。”


    赵仓唐的这番话说得非常有深意：一方面说明魏击身体很好，另

    一方面说明魏击对这次派使者见父亲非常重视。


    魏文侯又指着宫廷里的侍从说：“中山君长高了吗？你看和他们

    谁差不多呢？”'
