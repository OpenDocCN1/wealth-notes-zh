- pgno: 169
  md: '# 彭越：强盗头如何管理部下


    君以此兴，必以此亡。小到一个人，大到一个国家，因为某项优势上位，但这项优势又在历史长河中逐渐蜕变，则会成为致命的劣势。任何事物都有两面性，你可能一时占了它好的一面，但长期来看，势必也会不好的一面反噬。


    彭越是汉初名将，在楚汉之争中因袭扰项羽的后方建立了大功，被汉高祖封为梁王，与韩信、英布并称“汉初三大将”。彭越出身低微，早期在钜野湖中以打鱼为生。秦末群雄并起，各自造反，彭越也趁机拉起了队伍，干起了落草强盗的行径。不过，他这个强盗头与众不同，这也是他能够做大做强的缘由。


    彭越伙同强盗盘踞在湖泽中时，正逢陈胜、吴广掀起反秦大起义。不少不务正业的年轻人来入伙，对他说：“陈胜、项梁都叛秦了，您也起兵吧，我们愿意跟着您，干一番惊天的伟业。”但是彭越拒绝了，他说：“他们现在好比两条龙厮杀，胜负未定，我们还是等一等，看看局势再说。”


    一年之后，来投奔彭越的年轻人达100余，都请求彭越做他们的大哥。彭越再次拒绝道：“你们这些无知的年轻人，我是不会和你们一起干的。”


    年轻人还是执意要彭越当老大，彭越这才勉强答应下来，说道：“既然你们让我做大哥，就要听我的。”


    年轻人齐声说：“诺。”


    彭越说：“既然要起事，就要定下规矩，明日太阳初升时，我们在这里集合，凡是来迟的，立刻斩首。”


    年轻人齐声说：“诺。”


    第二天太阳初升时，有10多个人迟到了，还有1个人甚至到中午才来。彭越很难过地说：“是你们推举我当老大的，定下了规矩却不遵守，如今迟到的人这么多，都杀了不可能，就杀了那个最后来的人吧。”'
  merge: -1
  img_proc: true
- pgno: 170
  md: '年轻人嬉皮笑脸地说：“何必这样严肃呢？今后奉行您的号令就是了。”


    彭越没有理会众人的求情，直接将那个最后来的人杀掉了。至此，众人神情肃然，再也不敢松松垮垮，更不敢与他对视，甚至面对他时连大气也不敢出。


    彭越下令筑造土坛，并用那个人的头来祭祀，给出了起义的宣言。原本是一群乌合之众，在彭越的训练下，变成了一支纪律严明、指哪打哪的精锐部队。彭越带着这群人出发，期间还不断有人加入。不久，他的队伍就发展到了1000多人。


    当刘邦的起义队伍攻打昌邑时，彭越去援助他。城没有拿下，刘邦带着自己的人向西去了，彭越则继续盘踞在钜阳泽中，二人自此结缘。项羽入关后，将各路起兵的诸侯都封王了，唯独彭越什么也没有给。当时，彭越的队伍已经发展到一万人。


    前206年秋天，齐国王室的后裔田荣自立为王，反叛项羽。他派使者带着将军印信面见彭越，任命他为大将，让他进攻济阴（今山东菏泽定陶区西北）的楚军。项羽命令大将萧公角迎击，结果被彭越杀得大败。


    一年之后，刘邦率领诸侯与项羽作战，彭越率领三万人在外黄归附。当时魏王豹因彭越在战争中收复了魏国故地的十几座城，任命他为魏国相国。彭越继续率领军队，为魏王效力。


    刘邦与项羽争天下，彭越就在梁地袭扰项羽，并经常切断他的粮草。当项羽率军决战时，他便立即退却。项羽一离去，他又很快夺回失去的城池。就这样，他搞起了游击战，让项羽不胜其烦。


    魏王豹在荥阳被杀后，彭越一直独立率领他的军队，成了事实上的—方诸侯。为了笼络他，张良建议刘邦封他为梁王。在垓下决战前夕，刘邦给了彭越一个承诺。彭越率领大军和诸侯一起参与了对项羽的围剿。项羽败亡后，彭越果然被封王，定都于定陶。


    汉高祖立国之后，基本上不信任异姓王。梁国太仆忿怒了彭越，彭越打算处死他，太仆就向刘邦告状，说彭越有谋反之心。就这样，彭越被抓了起来。本来刘邦只是想将他废为庶民，流放到蜀地。谁知'
  merge: -1
  img_proc: true
- pgno: 171
  md: '彭越在流放路上遇见了吕后，便向吕后哭诉，说自己无罪。吕后将彭越带了回来，对刘邦说：“彭越是枭雄，流放他难道不是放虎归山吗？不如杀了他。”就这样，彭越被杀。


    彭越从一个强盗头开疆拓土，成为诸侯王，可以说到达了人生的巅峰，也证明他具有非凡的能力。但遇到有雄才大略、充满猜忌之心的刘邦和吕后，他没有像范蠡、张良那样选择功成身退，导致杀身之祸。可以说，彭越的成就，源于他的能力；彭越的败亡，也是源于他的能力。'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 公孙氏：成于锋芒内敛，败于骄狂自大


    权力最有趣的地方是：人们总是低眉顺眼地追寻它，抬启鼻孔使用它。因此，权力总会向人呈现出两副面孔。


    在汉末群雄中，辽东公孙氏可谓一股不被忽视的力量。不论是统治区域之广阔，还是辖下户数之众，它都堪称魏、蜀、吴之外的第四大势力。辽东公孙氏起家很早，初平元年(190)，小吏出身的公孙度就被任命为辽东太守。这一年，曹操与袁绍等人组成反董卓联盟，包括孙坚在内的群雄都“假公济私”，以讨伐董卓的名义壮大自己的实力。所以说，公孙氏与袁绍、曹操等人是站在同一起跑线上创业的。


    公孙度赴任之前的辽东，与汉末其他州郡一样，政治资源由地方豪族势力把持着，行为不法，政令不一，社会非常混乱。任职的地方官为了站稳脚跟，不得不委曲求全，和这些地方势力搞好关系。公孙度出身辽东玄菟郡，十分了解这种情况，因而上任后极力打击本土豪强。襄平县令公孙昭曾征召公孙度的儿子公孙康，却任命他为伍长，以羞辱公孙度。公孙度到了太守任上，立刻收捕公孙昭，将他公开处决。之后，公孙度又命属下搜集豪强们的违法证据，包括豪门大姓田韶家族在内，有100多家因此覆亡。从此，郡县以下的豪族们战战兢兢，夹着尾巴做人。


    公孙度对内统一政令，令行禁止，并着手处理辽东周边的危机。东汉王朝强大时，与辽东毗邻的夫馀国、高句丽、乌桓都俯首听命；一旦中央权威下降，这些小邦就趁火打劫。对此，公孙度采用了分化瓦解、各个击破的战略。


    夫馀国被夹在高句丽和乌桓之间，畏惧二者吞并自己，想要寻找一个强者做靠山。公孙度适时抛出橄榄枝，将女儿嫁给了夫馀王仇台。之后，公孙度向东攻击高句丽，向西讨伐乌桓，夫馀国都是其重要的联盟力量。高句丽和乌桓的臣服，令公孙度声名大振。当时中原战乱，知识分子纷纷到辽东来避难。高士如管宁、邴原、王烈、太史慈等，都曾在此生活。由此，辽东出现了“强不凌弱、众不暴寡、商贸之人市不二价”的安定局面。公孙度还派兵渡海夺取东莱等县，设置营州，并任命骁将柳毅为营州刺史。'
