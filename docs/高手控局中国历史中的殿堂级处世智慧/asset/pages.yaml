  md: '颜率说：“这恐怕也行不通。楚国对九鼎早就垂涎欲滴，他们在叶庭专门建立了夺取九鼎的机构。九鼎一旦进入楚地，想也别想它能再出来。”


    齐王说：“那我怎样才能把九鼎搬到齐国来呢？请先生指教。”


