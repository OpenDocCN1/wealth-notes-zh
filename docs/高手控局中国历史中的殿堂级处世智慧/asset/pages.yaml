- pgno: 223
  md: '# 刘邦：自己不猛没关系，能驾驭猛人就够了


    > 如果你太在意别人的看法，那么你的生活将变成一条裤衩。别人放什么屁，你都得接着。


    汉高祖刘邦出身草根。论武力值，他打不过樊哙；论谋略，远不如张良；论指挥才能，离韩信很远。但他身上有一种他人没有的东西，那就是领导气质。正是这种气质，使得他能够驾驭各色猛人，从而建立大汉江山。


    我们在前篇说过，九江王英布在刘邦的谒者随何的游说下，叛楚归汉。项羽得知消息后，立刻率兵进攻英布。英布当然不是西楚霸王的对手，被打得大败，从小道逃跑，投归汉军。


    英布来了之后，被安排在宿舍里，每天食用十分粗陋的饭菜，等了几天也没有见到刘邦，这让他十分不爽。


    不久，他总算被召见了。进了刘邦的大帐之后，他看见刘邦穿着平常衣冠，一左一右两个美女正在侍候他洗脚。这让英布大为羞惭，随即怒火中烧。按照礼节，刘邦和英布都是诸侯，应该穿袞服，也即是礼服会师，用极为隆重的礼仪来接见他。在女子伺候洗脚的时候见英布，这跟见个仆人没有什么区别，是非常无礼的，难怪英布又羞又怒。


    英布与刘邦会面结束，心中五味杂陈，后悔当初不该被随何忽悠，叛楚归汉，落得今日的下场。急怒之下，他差点儿拔剑自尽。这时候，刘邦安排的侍从带着他来到安排好的府邸。他抬头一看，大喜过望，进了院落，简直又惊又喜。原来，刘邦给他安排的住所高大轩敞，规模和等级都很高，侍奉的人鱼贯而出，有好几百人，和汉王的规格一样。如此礼遇，英布很快就将刚才的羞惭抛到九霄云外了。


    刘邦为何要用这样一种方式对待英布呢？这其实是一种心理战术。英布的九江王和刘邦的汉王，都是项羽封的，地位平等。如果刘邦按照诸侯相见的礼仪见英布，那么英布的归附就相当于合作，两个人是合作伙伴的关系。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '刘邦在洗脚时安排见英布，故意折辱英布，给他一个下马威，是提醒他现在的落魄处境。尔后，再以极高的礼遇对待，怎能不让英布这个武夫感激涕零呢？果然，英布来到淮南召集自己的残部，得到精锐几万人。在后来刘邦与项羽的决战中，英布立下了大功。


    刘邦在洗脚的时候会见人，在《史记》中还有一处记载。我们在前篇曾提及，纵横家的牛人郦食其拜见他时，他也是 在两个美人的伺候下洗脚，结果惹得郦食其一顿狂怒。刘邦赶紧穿上正式的衣服，向郦食其赔礼，并向其请教。刘邦这种前后屈恭的态度，给人一种认识到错误能立刻改正、善于礼贤下士的姿态。这对于像高阳酒徒这样不按套路出牌的人，当然是印象深刻。刘邦就是用这种方式收服郦食其和英布的。


    不过，对于不同的人，往往采用不同的手段。韩信在刘邦手下当了很久的小官，觉得没什么上升空间，就辞职不干了。刘邦最得力的助手萧何连声招呼都不打，立刻骑马去追，以至于刘邦误以为萧何也逃跑了。追回来后，萧何请求刘邦重用韩信，刘邦答应了，想用任命一般官员的礼仪公布一下就行了，但萧何认为不可，一定要举行大典，登坛拜将。


    为何任命韩信，必须举行那样排场的典礼呢？这是因为韩信不是普通人，要收服这样的人，必须以国士视之。就像豫让说的，“众人遇我，我故众人报之；国士遇我，我故国士报之。”于是，刘邦先行斋戒，命令士兵修祭祭坛，选定吉日，然后拜将。至此，汉军拥有了锋利的战刀，韩信为刘邦打赢了一场又一场的战争，直到取得终极胜利。


    刘邦麾下的猛人众多，除了跟随自己起家的老哥们，还有很多角逐天下的诸侯，但都成了他的属下，拥戴他登上天子之位。这与他超群的领导力是分不开的。'
