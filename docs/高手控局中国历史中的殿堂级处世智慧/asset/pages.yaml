- pgno: 226
  md: '汉文帝三年五月，匈奴右贤王侵袭汉朝边郡上郡。文帝到离边境比较近的甘泉宫，命丞相灌婴率领军兵和骑兵共计八万余人，进取高奴（今陕西延安附近），同时从中尉所属的军队中选拔精锐，交给卫将军加强长安的防守。灌婴率领军兵与匈奴右贤王尚未决战，匈奴军就窜到塞外。文帝从甘泉宫出发，先到高奴，之后到太原，赏赐了他当代王时的旧部。


    当时的代地，是防御匈奴的前沿。高祖刘邦将年龄比较大的儿子刘恒封为代王，目的也是将对抗匈奴的重任交给他。刘恒此时赏赐代地官员，免除当地税赋，一方面是对龙兴之地的重视，另一方面也是慰勉当地官民，加强抗击匈奴的信心。济北王刘兴居的情报显然不够灵通，他将刘恒到太原慰劳旧部当成御驾亲征的信号，以为皇帝要出塞和匈奴决战，就发动了叛乱。


    汉文帝刘恒在代地得知刘兴居叛乱后，立刻命令灌婴率领大军返回长安，同时任命虢蒲侯柴武为大将军，率领十万大军平叛。昌侯卢卿、共侯卢贾师、宁侯魏遨、深侯侯赵将夜等将领归柴武节制。文帝还命令祁侯结贺军在营阳防守。对楚汉之争稍有了了解的人都知道，荥阳是军事要冲，楚汉两军在这里进行过一场血战，刘恒有着非常深远的战略目光，让结贺守住荥阳。万一柴武战败，战局也不会一发不可收拾。


    当年七月，汉文帝进一步瓦解刘兴居的部署。他下诏说：“济北王悖逆，还让济北国的官员和百姓受到牵连，只要济北的官员和百姓在朝廷大军来临前，停止追随刘兴居的叛乱活动，出城投降者献出城池的，都将被赦免无罪，而且可以保住原来的官位。开始就道迹济北王的死党，只要肯投降，同样赦免。”文帝的这一招釜底抽薪，非常管用。


    当年八月，柴武击溃叛军，济北王刘兴居自杀。济北国被废除，重新变成济北郡，收归朝廷管辖。回头再说匈奴，右贤王被汉军逐出塞后，匈奴大单于栾提冒顿自然知道发生了什，几个月后（文帝四年），就给汉朝写了一封信。


    信中说，上一年贵国的官员和右贤王发生冲突，右贤王未曾向我请命就出兵，破坏了我们两国的和平盟约，我惩罚了他，让他进攻西面的月氏国。得到上天的庇佑，我们灭掉了大月氏，他们的部族或'
