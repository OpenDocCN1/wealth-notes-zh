- pgno: 205
  md: '# 赵普：团队发展的顶层设计者


    只有不惧用最差的一面揣测人心，才能在任何情况下都做出万全的准备。


    赵普是五代至北宋初年的著名政治家，北宋王朝的开国名臣，也是赵匡胤、赵光义兄弟团队中的顶层设计者。北宋的建立及其运作机制，都有赵普的参与。可以说两宋300余年，基本上没有脱离赵普在宋代初期设计的政治结构。因此，他是宋朝事业发展中真正的奠基性人物。


    赵普出身官僚世家，祖父和父亲都担任过司马（军职）一类的官。后周显德年间，他在永兴军节度使刘词幕下做幕僚。刘词病逝后不久，他投入赵匡胤幕下，担任司法官员。柴世宗去世后，幼主柴宗训即位。赵普为赵匡胤谋划上位，做出了紧锣密鼓的安排。


    显德七年(960)正月元日，情报说契丹与北汉联兵来袭。在没有对情报进行核实的情况下，宰相范质等大臣就下令让赵匡胤出征。初三那天，赵匡胤率领禁军到了开封东北四十里之外，夜宿陈桥驿。当天晚上，赵普让赵匡胤的亲近将领在军中散布言论，说：“皇帝年幼，无力亲政，我们为国家战斗，谁去了解呢？不如点检赵匡胤为天子，再出征。”这些言论煽动了将士们的兵变情绪。赵匡胤的胞弟赵匡义和赵普趁机将一件准备好的黄袍披在假装醉酒的赵匡胤身上，将士们罗拜三呼万岁。


    赵匡胤假装十分惊讶，好像被逼迫无奈当皇帝一样，很勉强地说：“你们贪图富贵，逼迫我当天子，能听我的命令，我就答应，不然的话，我不能当你们的主上。”将士们连声应诺。赵匡胤兄弟军牢控制住军权后，赵普一方面派人回去告知留在都城开封的赵氏家人，让他们不要慌乱；另一方面通知赵匡胤的结拜兄弟、殿前都指挥使石守信，以及殿前都虞侯王审珪等，让他们做好内应工作。由于一切安排周详，赵匡胤率军回都城时，几乎没有遇到抵抗，只有侍卫亲军马步军副都指挥使韩通准备反制，被军校王彦升诛其一家。


    赵匡胤回到都城时，宰相范质正在吃饭，听闻消息后，和另二相王溥、魏仁浦一起来见。赵匡胤痛哭流涕，说自己这么做都是被士兵威逼的。还不等范质回应，旁边的军校罗彦环便手持钢刀，大声喊'
  merge: -1
  img_proc: true
- pgno: 206
  md: '道：“我们没有主上，今天必须立赵太尉为天子。”其余的士兵都跟着呼喊起来。范质走下殿阶，掐着另一宰相王溥的手说：“都是我们仓促派选的罪过啊。”王溥的手掌几乎被掐烂，但他们都清楚大势已去，在得到赵匡胤保全年幼的周恭帝的承诺下，举行了禅位仪式。


    军校罗彦环后来被赵匡胤任命为控鹤左厢都指挥使，累官至节度使。很显然，他在朝堂上的那声大喊，并不是偶然的。他本就是赵匡胤的亲信，是赵普安排他在朝堂上演了一出戏罢了。北宋建立后，赵匡胤任命赵普为谏议大夫、枢密直学士，成为赵匡胤最倚重的文臣。


    赵匡胤篡夺了后周皇权，义成军节度使李筠率先反对，并联合从前的敌人、北汉皇帝刘钧起兵。就在赵匡胤踌躇不定的时候，赵普建议御驾亲征。行军途中，赵普又说：“我们应该昼夜兼程，让仓促起事的敌人没有反应的机会。”


    李筠的从事阎丘仲卿认为，用一支军队反抗赵匡胤，没有胜算，虽然北汉答应出兵，但是胜利的机会也很渺茫，不如率军西下太行山，拿下怀州、孟州（今河南孟县），守住虎牢关，待占领洛阳后，再向东夺取天下。但是李筠拒绝了这一建议，他认为自己是后周老臣，只要起兵，其他大臣和将军就会响应。不过，他高估了自己的影响力，也低估了赵匡胤的反应能力。


    在赵普的谋划下，宋军大将石守信和慕容延钊兵分两路夹击李筠。在泽州高平县（今山西晋城市高平），李筠的军队被斩首三千。在泽州城南，赵匡胤和石守信一起击败了李筠的主力大军。李筠坚守泽州，城破后点火自焚。


    李筠的叛乱被平定后不久，原后周淮南节度使李重进又在扬州发动了反对赵匡胤的战争。赵普认为，淮南外无援助，内无粮草储备，李重进本人也不得人心，建议“速取之”。这是一场没有悬念的胜利。赵普对敌人的判断，展现了他的对敌情的深刻了解和丰富的政治经验。


    自唐末以来，梁、唐、晋、汉、周五个王朝轮替，全都是军事将领上位。用当时一位节度使的话说：“天子宁有种耶，兵强马壮者为之耳。”赵匡胤就是获利者之一。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '如何改变这样的局面，建立长久的王朝呢？赵匡胤向赵普倾诉自己的困惑。赵普对这个问题早已深思熟虑，因此当赵匡胤提问时，他便捷出了症结所在。他说：“五代为天子，军将为天子，在于藩镇权力太大，主弱臣强。藩镇大将不但有军权，还有事权和财权。要解决这个问题，无非就是剥夺他们对事权的专擅，罢去对钱粮的征收，再收回掌控的精兵。”赵普的一席话，归纳起来可以称为十二字方针：削夺其权，制其钱粮，收其精兵。


    赵匡胤击节赞叹，从而上演了史上著名的“杯酒释兵权”。跟随赵匡胤起家的石守信、高怀德、王审琦、张令铎、慕容延钊等握有重兵的大将都交出了兵权，赵匡胤则赐给他们良田美宅，让他们享受生活。如此一来，既保全了君臣之间的恩义，又避免了历代开国皇帝屠戮功臣的惨痛事件。


    当然，杯酒释兵权只是一个表象，深层次的解决方式还在于确定分权机制：在朝廷上，以参知政事（副相）、枢密使（副使）与三司使分割宰相的权力，相互制衡。在地方上，以文职代替武职，推崇文官，让他们的地位在武将之上；设置知州及副职通判为行政官员，重要文件由两个官员一起签；通判要充当皇帝耳目，对知州有督察之责。同时，将厢兵中骁勇的士兵收编到禁军，从而使得由皇帝指挥的禁军无论在数量还是质量上都高于地方部队，没有一支地方军能够与禁军抗衡，也就是“强干弱枝”。在钱粮问题上，在地方设转运使，将大部分地方钱粮输送到中央。地方军除了领兵作战外，无论是财权还是事权，他们都不掌握，而且政治地位较低，叛乱的可能性就微乎其微了。


    在宋太祖赵匡胤执政时，赵普独相（一人担任宰相）达10年之久。他为宋太祖、宋太宗兄弟俩制定了“先南后北、先易后难”的战略。在这一思想的指导下，北宋逐渐灭掉了割据荆南的高氏政权、后蜀政权、南汉刘氏政权、南唐李氏政权。随后，吴越与福建、漳泉等地的割据势力也相继投降。最后，北汉也被灭。


    赵普在宋太祖、宋太宗两朝三度为相，地位极高，与两位皇帝私下里犹如兄弟，是赵宋王朝建立团队中的第一智囊，也是策划人，几乎参与了政治、军事、民政等所有方面重要方针的制定和实施。宋太宗将他比作管仲、诸葛亮、房玄龄和杜如晦。'
