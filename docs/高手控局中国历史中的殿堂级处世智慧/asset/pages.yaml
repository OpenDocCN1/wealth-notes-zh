  md: '张鲁治汉中，以南郑为统治中心，自号“师君”，既管理教众，又管理政务，实际上是将他的教徒组织成了军民一体的军事集团。他下令在各处设置义舍，提供衣食，行路者可以免费使用。老百姓犯了小错，罚修道路一百步；犯了一点大罪，原谅三次而不悔改者再处以刑
    罚。这正是汉中能够安定的因素之一。各地受战乱影响，逃往汉中的百姓日益增多，仅从子午谷逃往汉中的百姓就有上万家。当时曹操无 暇顾及汉中，只好承认了张鲁的地位，奏请朝廷任命张鲁为镇民中郎
    将，领汉宁郡太守。


    张鲁统治巴郡、汉中长达30年。有人垦地时挖出来一枚玉印，将 其视为祥瑞。文武官员都劝张鲁称王，只有功曹阎圃劝他不要称王。 阎圃向他分析道：“汉川不过十万户，财富多，土地肥沃，地势险
    要，能够自我保护。如果辅佐天子，能够成为齐桓公、晋文公那样的 人物，最差的也也能像司马懿光武帝的宠独有那样，不失富贵。就实际而言，你能按照自己的心意任命官职，独自决断汉川事务，不用称王，但有王的实权。一旦称王，就会招来无穷祸患。”张鲁接受了这个建
    议，拒绝称王。


    建安二十年(215)，完全腾出手来的曹操亲率十万大军征讨汉中， 抵达阳平关。张鲁原本打算投降曹操，但其弟张卫不愿投降，便率领 数万兵马在阳平关抵抗，结果被曹操击破。这时，张鲁打定主意要投
    降，但功曹阎圃认为，此时投降属于被迫，必定不会得到曹操的重 视，应该退守朴胡抵抗，在曹操攻不下来时再投降，才能体现出价 值。张鲁接受了这个建议，率军前往巴中。属下建议他临走前烧掉府
    库里的钱粮物资，以免资敌。但张鲁拒绝了这个建议，他认为烧掉府 库里的钱粮物资，就断绝了百姓的希望，一旦有灾荒，百姓肯定会饿 死很多。因此，他封存好府库，率军离去。


    两军交战，既然已到了厮杀的程度，那么烧掉府库里的钱粮物资 乃至坚壁清野，都是不得不用 的手段。但张鲁拒绝这么做并非失策， 而是基于两点：既然觉得要用和平手段解决问题，那就要给双方都留
    出余地——避开曹操的兵锋，是为避免直接交战，再见面时不至于没有 台阶下；不烧府库，是为表达诚意，况且府库里的钱粮物资是统治的 基础，是百姓最后的依赖，一旦烧了府库，他不但会开罪于曹操，也
    会失望于百姓。这种双输的事，张鲁当然不干。


    曹操大军进入南郑后，见府库完好，钱粮物资未动分毫，十分赞 许张鲁的行为，就派人去宽慰招降。张鲁率领家人和文武官员来参'
