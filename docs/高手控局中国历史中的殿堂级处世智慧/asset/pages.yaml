- pgno: 38
  md: '# 胡雪岩：给他人撑伞，为自己铺路


    所谓资源，就明晃晃地摆在那儿，不是有没有的问题，而是谁来用、怎么用、用来干什么的问题。想明白这三问，你就读懂了胡雪岩。


    胡雪岩在晚清商界是一个传奇。他没有受过多少教育，12岁父亲病故后，就不得不想办法谋生。他的人生之路，是从小伙计，也就是从最底层开始的。他最初在杭州的杂粮行、金华火腿商行干活，后来到了杭州的“信和钱庄”，工作内容是打扫卫生和倒夜壶，直白地说就是杂役。他虽然干的是杂役，但是为人十分乖巧，很会来事，尤其是能看懂老板的眼色。所以三年之后，他成了钱庄的业务伙计，这就好比环卫工人转成了银行柜员。


    胡雪岩的发迹，始于康阜钱庄。那一年他19岁，在钱庄当学徒。钱庄的老板姓子，没有儿子，便将胡雪岩视作亲儿子，临死前把钱庄的经营权交给了胡雪岩。那时的胡雪岩虽然年轻，但是在钱庄的历练让他明白了一个道理—花花钱几人抬人。


    人要懂得彼此成全，也就是建立自己的人脉网，有了这张网，才能赚大钱。这时候，一个名叫王有龄的读书人出现在他的视野里。胡雪岩和他进行了一番交谈后，发现他对衙门里的运作十分熟悉。原来王有龄的父亲王變担任过知县，曾将儿子带进衙门为自己办文案。王有龄办文案的能力很强，但是考试却不得要领，以致考了好几回，连个举人都没有捞着。无奈之下，家里就给他捐了官。所谓捐官，就是花钱买官。当时，清王朝的财政十分困难，为了增加收入，捐官之风盛行。不过，捐官多是候补，要有了补缺机会才能实现。不然，只可有名，而无其实，就领不到一分钱的俸禄。王有龄既无官，那么缺的就是一个机会。胡雪岩从商人的角度考虑，生意不会自己找上门，补缺也一样。他将500两银子交给王有龄，让他去打点，王有龄的机会就这样来了，不久就补了实职。


    清咸丰元年（1851），王有龄调任湖州知府，开始“反哺”胡雪岩。很快，胡雪岩得到了代理湖州公库的机会。所谓湖州公库，也就是当地的财赋收入，相当于拿到了政府财政管理经营权。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '胡雪岩先是办起丝行，他用公库的现银扶持农民养蚕，蚕产得丝后，拿到杭州、上海出手，除去利润后，将公库的钱上交浙江省“藩库”，这个过程是不需要交一厘利息的。胡雪岩做事八面玲珑，与浙江官场上方人物的交往日深，生意越做越大。当时他得到一个消息，浙江巡抚黄宗汉将离任。他立刻带了一船上特产和1.5万两银子直奔苏州，拜见江苏学政何桂清。


    此次拜访中，他向何桂清表达了两个意思：一是浙江巡抚将空缺；二是赶紧进京打点，拿下这个职位。何桂清得到内部消息，又有了资本加持，于是立刻运作，果然被任命为浙江巡抚。有了何桂清的支持，胡雪岩的钱庄、生丝、药店、当铺遍布整个浙江省，并朝全国发展。


    咸丰七年(1857)，何桂清升迁两江总督，王有龄也成为江苏布政使。有了此二人的支持，胡雪岩的生意在江浙一带无往不利。胡雪岩的飞跃性发展，得益于1860年英法联军的入侵，大量的募兵经费被存入他的钱庄。当时王有龄已调任浙江巡抚，他将办理粮草、军械乃至浙江省的漕运等事务都交给了胡雪岩。可以说，胡雪岩掌控了当时浙江省一半的财政。


    当然，生逢乱世，难以避免风险，关键在于如何掌控风险。咸丰十一年(1861)，太平军攻破杭州，王有龄自尽，何桂清早已逃跑。从表面上看，胡雪岩的两大靠山都倒了。但是，山可以崩，人也可以动。左宗棠出任浙江巡抚后，胡雪岩很快又搭上了他的线。胡雪岩能得到左宗棠的重视，一个很大的原因在于他的理财手段。左宗棠可以通过军事取胜，但不能用同样的方法安民。收复杭州城后，最重要的事情就是善后。胡雪岩出钱办粥厂、施医药、抚恤受到战祸的百姓，获得了好的名声。左宗棠将浙江全省的钱粮、军饷都交给他处理，也使他获得了巨大的利润，进而走上官商之路。


    胡雪岩的善铺人脉和高超的交际手腕，与其深谙人性是分不开的。下面以为左宗棠筹措军饷、向洋行借款为例进行探讨。胡雪岩向左宗棠引荐了泰来、汇丰两家洋行的经理，其中汇丰是中间人，泰来是借款方，事情办得相当顺利。事后，左宗棠有一事不解，既然是向泰来借款，为何要拉上汇丰？胡雪岩解释道：“汇丰是洋行的行业领袖，有了汇丰出面，调度款项会更加顺畅。好比朝廷派钦差来浙江办差，到了地方与大臣沟通，事情未必顺畅，但这时候左大人一出面，'
  merge: -1
  img_proc: true
- pgno: 40
  md: '不但地方上配合，朝廷也认可。”这一顿彩虹屁，即便是左宗棠，也难免落入彀中。


    当时清廷向洋人借款，要以海关税收为抵押，也就是需要海关出具税票做担保。由于胡雪岩的生意大、信用好，重要的是钱庄确实有大量银子，故而洋行免了这道程序。当左宗棠询问这一道流程时，胡雪岩并不显摆自己，而是将此归功于左宗棠在外国人心目中的分量。


    同治十一年(1872)，胡雪岩的资本达到2000余万两，他不但掌控着多个行业的生意，还购置了万亩良田。左宗棠向朝廷奏报他的功劳，他被授予江西候补道，赏穿黄马褂，成为真正的红顶商人。


    左宗棠率军出征，实际上已经脱离了胡雪岩的商业基本盘浙江。不过，胡雪岩的目光更加长远，他积极满足左宗棠的军事需求，解决军械、粮草和药品短缺等问题。当时，向上海的洋行借款十分艰难，因为英国人对左宗棠的西征持观望态度。不过，胡雪岩转变思路，向借款利率最高的英国人借款，这使得英国人的态度发生180度大转弯，不但给予金钱支持，还为西征军提供了大量快枪。胡雪岩先后主导向洋人借款1870万两银子，从而解决了西征军的军饷、粮秣和军械问题，保证了左宗棠军事上的成功。


    胡雪岩的成功，有时代的原因，但更与其个人有着莫大关系。无论是对王有龄、何桂清还是左宗棠，他首先都是成就了对方，对方成功了，他也就成功了。他精通社交之道，商业上的成功，与其说是对事业的投资，不如说是对人的投资。'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 昊棠：不为送错的礼物懊悔


    > 很多人不是没有过好运气，而是当运气来临时，他没有本事接住！


    做正确的事，不见得一定会成功，但起码可以在好运来临时，不至于让机会白白溜走。


    昊棠于道光十五年(1835)中举，此后宦途蹭蹬，一直到道光二十九年(1849)才被任命为淮安府桃源县（今属江苏）县令。在任三年，昊棠为官十分清廉，经常布衣草鞋，到乡村间访贫问苦，严厉打击地方上的不法分子。他不但肃清了原来的匪患，还组织百姓治理了多年未能解决的水患。不过，这些良政并未引起上级的注意。之后，他被平调到淮安府的清河县做县令。


    清河县是一个问题县，多年来胥吏们织成了一张错综复杂的关系网，私自向百姓摊派杂税。而且，当地赌博成风，盗贼十分猖獗。昊棠到任后，决定先从吏治开始。他先将县衙里的老书吏除名并驱逐县境，从而使得小吏们群龙无首。之后，他将为恶的两名衙役处以杖刑，赶出县衙。他向上级淮安府请兵，亲自带兵剿匪，只用了一个月，就将当地的匪患肃清了。他义在乡村实行联防政策，由土绅组织禁赌会，一旦发现设赌的村落，就向当地土绅问责。昊棠在清河政绩，同样没有引起上级的注意，倒是因打击盗贼的手段而得到了嘉奖。


    咸丰二年(1852)，邳州发生暴动，昊棠被调任为代理知州，去围剿暴民。昊棠到任后发现，当地百姓暴动，纯属活不下去了。原来邳州连年发生水灾，百姓歉收，但是官们们魔化瞭防，税赋丝毫不减。昊棠仍然先从吏治入手，打击贪腐，然后进行赈灾。


    在剿匪问题上，他十分清楚，所谓的“匪”都是百姓，要么是被裹挟，要么是求个活路，因而他命令土兵到处张贴“首恶必惩，胁从解散”的布告，亲自带兵捉拿“匪首”。很快，暴动就被瓦解了。他知道，匪患发生的主要原因在于百姓没有生计，因此不从根本上解决问题，就不可能彻底肃清，老百姓有了活路，才能缓解与朝廷的对立情绪。因而，匪患一缓和后，他立刻亲自勘察地形，兴修水利，并以工代赈救济饥民。他还下令由土绅和官方合办育婴堂，收养弃婴，使'
  merge: -1
  img_proc: true
- pgno: 42
  md: '2000名婴儿得到收养。邳州的另一个暴乱源头，是从山东过来的捻军。于是，他亲自领兵在邳（邳城）、沭（沭阳）交界的高塘沟设伏，击退捻军，斩首数百级，从而保全了地方。


    吴棠在官场上没有任何靠山，企图凭借清廉的官风和一己之力获得升迁，这在腐败的晚清官场中是不可能的。上级用他的时候，会给他一个代理州县 的职务；一旦当地靖安，立刻又将他擢回清河县，让他继续当县令。不过，吴棠的转机很快就来了。他无意中结交上一个贵人，使得他从此通天，在官场上一路青云。


    一天，有人向吴棠报丧，说他的好友某人去 世了，运载灵枢的官船就停在河边，准备返回原籍。吴棠一听，立刻命仆人先准备300两银子送过去，自己随后吊唁。仆人拿着银子到了河边，果然看到一艘官船上挂着白色的孝布，就将银子交给了船上两个泪流不止的年轻姑娘，并说这是自家老爷的一点心意。家属收下银子后，写了个帖子向吴棠表示感谢。


    仆人将帖子交给吴棠后，吴棠越看越疑惑，因为帖子上的落款是“镇江府”，而他的那个朋友从未在镇江府任过职，显然是送错了银子。原来，吴棠朋友的家人报丧后，急着赶回原籍，回船后就立刻起锚了。停留在运河边的丧船，运载的是从镇江府来的另一位名叫惠征的官员灵枢。既然送错了，也不可能再把银子要回来，吴棠干脆就将错就错，以地方官身份亲自登船祭奠。船上的家属见吴棠与自家先前并无往来，仅因地主之谊，既送银子又祭奠，大为感动，牢牢记住了他的名字。


    惠征虽是旗人，但并无什么权势，到死也只在安徽做到四品道台。不过惠征有一个女儿却大名鼎鼎，那就是叶赫那拉·杏贞—慈禧太后。


    吴棠送银子的时候，叶赫那拉氏还没有出阁，回京后不久就被选秀入宫，得到了咸丰帝的宠爱。咸丰十年（1860），吴棠被任命为四品徐海道台。这一年，叶赫那拉氏已经成为身份尊贵的懿贵妃，在清廷内部有了极大的影响力。一年后，吴棠被任命为二品江宁布政使，同时代理漕运总督。吴棠中举后踏入仕途长达25年，无论他怎么拼搏，如兴修水利、剿匪、赈灾，都仍只是县令。可是遇到贵人后，他只用了两年时间，就从九品县令飞速上升到二品布政使，升迁之快，令人咋舌。'
  merge: -1
  img_proc: true
- pgno: 43
  md: '此后，吴棠可以说是坐上了升迁的火箭。同治二年(1863)，吴棠被实授为漕运总督。仅仅过了一年，朝廷就让他署理江苏巡抚，接着署理两广总督。因漕运事务太过繁杂，吴棠未能到任，朝廷就让他就近署理两江总督之职。慈禧太后对吴棠当年赠送银子、登船吊唁的情谊，给予了巨大的回报。清朝的大员“署理”，是指前任官员离任后，暂时让别的官员代理。这种代理往往有挂职锻炼的性质，意味着将向更重要的位置迈进。同治五年(1866)，吴棠被调任为闽浙总督，它是清朝九大总督之一，妥妥的封疆大吏。


    同治六年(1867)，吴棠被调任为四川总督，四年后署理成都将军。清朝在四川设总督，又另设将军，这在别的地方是极其少见的职权设置。为了相互制衡，两个职位通常委派此前在不同地域任职的官员，由一人兼任两职更是少见。在清朝260余年的历史上，共有75位成都将军，只有8位是汉官，吴棠就是其中之一，可见清廷对他的信任。


    吴棠的发迹，一方面与其个人优异的才能有关，另一方面也是因为他搭上了慈禧这个贵人。若非仆人送错银子，为他促成那次吊唁，也许他的才能不会得到真正的施展。可见，能力对于一个人来说固然重要，社交中能否遇到贵人同样重要，这对今人仍有借鉴意义。'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# 贰 纵横 • 顶尖的社交艺术


    作为独立的个体，人最重要的属性是社会性。真正懂得社交的人，绝不是处处谨慎、趋利避害的滑头，而是像游弋海里的鱼、翱翔于天际的鹰——既有傲然独立、自由前行的能耐，更有与海天融为一体、和光同尘的本事。'
