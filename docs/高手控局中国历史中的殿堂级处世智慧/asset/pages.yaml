- pgno: 5
  md: '# 壹 方圆 · 成事者的大人情观


    人情即“人之常情”，其本质是人性。世故是透彻了解事物运转的规律，懂得过去、现在、未来三者之间的关系，是对人性历史的洞悉。一个人不论是何种身份，居于何种位置，他首先是一个人。明白了人情，也就抓住了人性的本质。在为人处世中，尽可能地瞭解别人，站在对方的角度思考问题，在合作中寻求利益的一致性，远优于其他任何方法。真正的大人情观，不是拍马逢迎的小道，而是一种价值观。'
