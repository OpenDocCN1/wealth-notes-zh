  md: '# 郭隰：我最合适的总经理人选


    千金买马骨，可以被看作阳谋手段，也可以被看作阴谋手段。各种泡沫炒作，不就是千金买马骨的“黑化操作”吗？


    周赧王四年（前311），流亡在外的是燕国公子职在赵武灵王派出的军队护送下，回到燕国即位，是为燕昭王。此时的燕国，君臣离心，上下一盘散沙，大部分国土被齐国占领，百姓纷纷逃亡。此时要振兴燕国，最要紧的是笼络人才，凝聚人心。在此，我们不妨先看看昭王即位前燕国的局势。


    燕昭王的父亲燕王哙（燕国第三十八任君主）宠信相国子之，后来竟把君主之位“禅让”给了子之。子之登上王位后的第三年，不靖王位被他人所夺的燕国太子平与将军市被密谋决定推翻子之，因而派遣市被率兵围攻王宫。市被久攻王宫不下，又与太子平发生龃龉，掉转矛头进攻太子，两军都在都城厮杀，最后市被被杀，陈尸街头。齐宣王趁机派兵入侵燕国，燕国军民以为齐国是来平息内乱的，几乎未加反抗。齐军趁机占领燕土，杀了燕王哙和子之，太子平也在这场战乱中死去。这场战乱前后持续数月之久，死伤几万人，导致燕国都城一片破败景象。燕昭王正是在这种背景下即位的。


    燕昭王听说郭隰很是贤明，想让他推荐一些人才，就亲自去拜访他。见面以后，他却发现郭隰须发半白、垂垂老矣。本着礼贤下士的态度，燕昭王还是向郭隰求教，请他推荐一位经理人。郭隰一点儿也不谦让，拍着胸脯说：“让我辅助您执政吧。”


    面对郭隰这种毫不谦虚的态度，燕昭王多少有些失望。


    这时，郭隰给燕昭王讲了一个故事：


    从前有位国王，他很想得到千里马，于是派人 在全国张贴布告，宣布说愿意用一千金购买一匹千里马。但是过了三年，他连一匹千里马也没能买到，因此非常失望。这时有位侍臣说：“大王，只要您给我一千金，我一定能买到千里马。”国王当即将一千金交给侍臣，命他办理此事。侍臣听说某地有千里马，赶去时却发现那匹马已经死了，他就请求用五百金将马骨买回去。拥有马骨的人答应了他。国王见买回来的只是马骨，非常生气，斥责侍臣说：“我要的是活着的千里'
