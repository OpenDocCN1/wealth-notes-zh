- pgno: 36
  md: '道光十八年(1838)，左宗棠又一次进京参加会试，绕了一个大圈跑到南京拜访陶澍。陶澍视左宗棠为上宾，指着自己的位置说：“将来你也会坐上这个位子的，甚至还会在我之上。”当他得知左宗棠之女左孝瑜的年龄后，还为儿子陶树求了亲，从此陶、左两家成了亲眷。陶澍完全忽视两家的门第，以总督之家向布衣之门提亲，可见左宗棠身上闪烁着何等的魅力。毕竟，英才身上的光辉是遮不住的。


    陶澍任两江总督时，江苏巡抚是林则徐，督抚同城办公，二人志同道合。陶澍多次夸赞左宗棠，还未见面，左宗棠就给林则徐留下了深刻印象。后来，林则徐调任云贵总督，请左宗棠当幕僚。当时陶澍已病逝，左宗棠因照顾陶家老小脱不开身。多年后（1850年），林则徐返乡回到福建，特意绕道长沙，邀请左宗棠见面。两人在湘江的船中彻夜长谈，林则徐把自己在新疆整理的资料交给左宗棠，认为将来能够整顿西北大局的，唯有左宗棠。后来，林则徐向他人谈及这次会面时，称左宗棠是“绝世奇才”。


    咸丰二年(1852)，太平军围攻长沙，好友郭嵩焘向湖南巡抚张亮基荐举左宗棠，使左宗棠成为入幕之宾。张亮基在左宗棠的协助下，多次击退太平军的进攻。太平军围攻长沙三个月后，最终无功而去。湖南注定要成为左宗棠的发迹之地。张亮基调任湖广总督后，左宗棠也曾追随入幕；但张亮基被调往山东为巡抚后，左宗棠却回到了湖南。当时，太平军正在湖南北部驰骋，益吾的人接应着响啊，长沙危如累卵。湖南巡抚骆秉章焦头烂额，左宗棠又一次进入湖南巡抚幕府。骆秉章把军事事务悉数交给左宗棠，自己乐得做甩手掌柜。左宗棠也不负所托，昼夜思虑对敌，逐渐扭转了湖南的糟糕局面。


    左宗棠的名声越来越大。在一干大僚的举荐下，清王朝赐予他四品衔。由此，左宗棠终于看到了人生的曙光。从40岁开始，一直到49岁，左宗棠先后在张亮基、骆秉章、曾国藩的幕府当师爷。然而，仅仅过了4年，他就被任命为浙江巡抚。这一跃升固然与他镇压太平天国的军功有关，然而在过往的大半生里，他的社交往来和人脉铺垫已经使他的名声上达天听。陶澍、林则徐、胡林翼、曾国藩、骆秉章、张亮基无不成左宗棠成功之路上的风帆。备受咸丰帝信任的大臣潘祖荫在一封奏折中写道：“是国家不可一日无湖南，而湖南不可一日无左宗棠也。”此后，左宗棠历任闽浙总督、陕甘总督，并为维护祖国的主权完整，率军进入新疆，立下了彪炳千秋的功勋。'
  merge: -1
  img_proc: true
- pgno: 37
  md: 现在，我们可以回答本节标题的问题了：为何人人都看重左宗棠？一个人在社交中的魅力，来自他自身。一个人的人品、才华和能力，决定了他会结交什么样的朋友。优秀的人之间，具有天然的作用力，彼此之间既是试金石又是磨刀石，既能检验对方又可互相提高。
  merge: -1
