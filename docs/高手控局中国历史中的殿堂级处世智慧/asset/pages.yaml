- pgno: 227
  md: '杀或降，楼兰、乌孙等26国也都归附于我，我让草原上的部族成为一家人。如今，我们想停止干戈，互赠礼物，实现真正的和平。


    匈奴灭了大月氏，威服整个草原，大单于柴提冒顿为何要给汉文帝写这么一封信呢？很显然，这是一封充满威胁意味，但外交辞令华丽的信。信中说要停止干戈，实现真正的和平，但明里暗里都在彰显自己强大的武力。


    那么，文帝是如何回应的呢？文帝的回应同样文质彬彬，他说自己很欣慰，两国终于可以实现古代圣王所倡导的太平了。匈奴和大汉是兄弟之国，我们赠给你们的礼物很丰厚，但背弃盟约的事情总是你们挑头。至于右贤王做的事，发生在我国大赦天下之前，现在就不必再责罚他了。如果单于想实现真正的和平、安定，就明发布告，让你的官员遵守盟约，不要随意越界。当然，我们也会守约的。文帝的信滴水不漏，绵里藏针，既没有过度责备匈奴人，也将匈奴毁约在先的事说得明明白白。柴提冒顿见了信，也明白文帝不可轻欺。不久，柴提冒顿就病故了。汉匈之间的历史，将迎来新的一页。


    文帝不是好战之君，但在处理匈奴入侵和济北王叛乱时，举重若轻，游刃有余，杀伐果断之中有静气，无疑是古代政治家中极具领导才能的人。'
