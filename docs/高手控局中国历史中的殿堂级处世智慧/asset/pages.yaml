- pgno: 209
  md: '# 赵襄子：以弱致胜的秘密


    > 一个不成熟男子的标志是他愿意为某种事业英勇地死去，一个成熟男子的标志是他愿意为某种事业卑贱地活着。


    前633年，晋文公为了称霸，进行了军事改革，设立中、上、下三军，每军设将、佐各一名，依次为中军将、中军佐、上军将、上军佐、下军将、下军佐。六名将佐为世袭制，称为“六卿”，出则为将，入则为相，成为晋国百年霸业的支柱。先后有狐氏、先氏、郤氏、胥氏、栾氏、范氏、中行氏、智氏、韩氏、赵氏、魏氏11个家族把持六卿，按照“长逝次补”的原则，轮流担任执政官（正卿）。


    然而，晋国成也六卿，败也六卿。至春秋末期，起家六卿的贵族们相互兼并得厉害，最后只剩下智、韩、赵、魏4家，无论谁上台，都会架空晋国国君，拥有独立的地盘与军队系统。


    前493年，晋国执政智文子荀跞病故，中军佐赵鞅凭借在军队中的巨大影响力，替代荀跞成为正卿，开启了长达17年的执政生涯，世称“赵简子”。赵简子执政后，逐步将晋国的军政、外交、司法大权全部揽到自己手中。《史记•赵世家》中说：“赵名晋卿，实专晋权！”


    赵简子认为要成就大业，就要先培养继承人，因而他非常重视对儿子的教育。他曾将儿子叫到一起集中训话，并将修身之语写在木牍（制作书简的木片）上，发给儿子，希望他们将之作为座右铭，时时告诫自己，重视学习，不要懈怠。三年过后，他把儿子们召集起来，逐一考核。有的儿子记得木牍上的一些话，有的则完全不记得，长子伯鲁甚至不知道将木牍丢到哪里去了，这让赵简子十分失望。轮到庶子，也就是小娄生的儿子赵毋恤时，他倒背如流。这引起了赵简子的注意，他内心十分高兴，也开始重视起这个庶出之子来。


    赵毋恤作为庶子，按照当时的继承人制度，是没有继承权的。但是他性格沉毅，身上没有纨绔子弟的气息，爱好学习，手中经常拿着经典书简。一次，赵简子又将儿子们召集在一起，对他们说：“我将一块宝符藏在了恒山（指今河北大茂山，汉代避汉文帝刘恒讳，改名常山，系古恒山），你们谁能找到，我就重赏他。”'
  merge: -1
  img_proc: true
- pgno: 210
  md: '赵氏诸子一听，纷纷率领仆人，骑着马朝恒山奔去，有的扒拉树洞，有的翻捡石缝，有的拨开草丛，似乎要把这座山翻个底儿朝。但是茫茫大山，对于几个人来说，要寻找一块宝符，无异于大海捞针。天黑的时候，所有的儿子都回来了。赵简子问他们找到了没有，他们无不伸出空空的双手摇头。此时，早早就回来的赵毋恤却说：“我找到了宝符。”


    赵简子问：“宝符在何处？”


    赵毋恤说：“凭借常山的险峻，进而攻占代国，代可为赵所有。”


    赵简子大吃一惊，久久地盯着这个儿子，想不到这个年幼的孩子竟有这样的战略眼光，因而废掉世子伯鲁，改立赵毋恤为世子。赵简子病逝后，赵毋恤成为赵家的当家人，世称“赵襄子”。


    按照递补次序，智伯瑶（荀瑶）成为晋国的正卿，大权重新回到智氏家族。智伯瑶执政后，极力发展家族势力，并设法削弱其他家族。他对韩、赵、魏三家的掌门人说：“执政者应该以国家为念，晋国丢掉霸主的位置很多年了，我们每家献出一万户给公室，以巩固公室的地位。”


    韩康子、魏桓子明知这是智伯瑶打着晋国国君的旗号肥己，但慑于智氏家族的强大势力，不敢违命，各自乖乖地献出了一万户。只有赵襄子拒绝了这一要求，他对智伯瑶说：“土地是我从先人那里继承来的，哪敢随便舍弃呢？”智伯瑶大怒，联合韩、魏两家一起攻赵。赵氏打不过三家联军，便不断撤退。赵襄子记得父亲说过：“晋阳是我们的根据地，如果哪天局势危急，就撤回晋阳，以地理之险抗拒敌人，寻找机会。”


    待赵襄子撤回晋阳，智伯瑶很快就率领联军围困晋阳。晋阳墙高沟深，粮食充足，暂时可以挡住敌军。但赵军的弓箭很快就用完了，只怕防御不能持久。这时一个家臣对赵襄子说：“我听说先主公修建晋阳宫殿的时候，曾用荻蒿荆条筑墙，为何不拆开看看？”赵襄子立刻命令众人拆掉宫墙，发现墙体是空的，里面藏了大量的荻蒿荆条，都是制作箭杆的优质材料。赵襄子喜亦忧，对那人说：“箭杆是有了，可是制作箭镞的材料从何而来呢？”'
  merge: -1
  img_proc: true
- pgno: 211
  md: '家臣说：“先主公当年修建宫殿，曾用大量的铜铸铜柱，正可一用。”


    赵襄子立即命令众人将宫殿的铜柱拆下来，熔化后制作箭镞。


    当智伯瑶率领三家联军攻城时，迎接他们的是密集的箭雨，联军因此受到重创。就这样，晋阳城被包围了三年，依旧没有被攻破。一天，智伯瑶率领韩康子、魏桓子一起视察战场地形。看到晋阳东北的晋水时，他顿时心生一计，说道：“晋水绕晋阳城而过，如果挖一条人工河直通晋阳，然后堵住上游，等水足够多的时候，猛然掘开水坝，顺人工河而下的洪流，不就可以淹了赵家吗？”


    说完，他因自己的足智多谋而哈哈大笑。韩康子、魏桓子听后先是一愣，随即也陪着笑起来。


    实际上，两个人心里苦得不得了。因为韩氏的封邑平阳（今山西临汾市西南）、魏氏的封邑安邑都有一条像晋水一样的河，将大的城市建造在河流旁边，这是发展人口和经济的必然途径，但也容易遭到水淹。智伯瑶既然能用水灭赵，自然也能用水灭韩、魏。韩康子、魏桓子二人心里越想越怕。


    晋阳城被水淹后，百姓们全都上了屋顶避难，住在屋顶过夜，在屋顶上生活做饭，但就是不投降。面对危若累卵的局势，赵襄子急得像热锅上的蚂蚁。


    这时候家臣张孟谈说：“我看是时候了，韩、魏两家虽然跟着智伯瑶，恐怕不是真心的，不如我去说服他们反水。”


    当天夜里，张孟谈用一根从城墙上垂下去的绳子出了城，悄悄地拜会了韩康子和魏桓子，约他们一起反击智伯瑶。二人最初还比较犹豫，经张孟谈说明其中利害，最后终于同意反击。


    第二天夜里，智伯瑶睡到三更，只听外面喊杀声不断，赶紧从床上爬了起来，发现自己的营帐里全是水。他以为是大坝溃堤了，赶紧叫士兵们堵住水口。可是刚一出帐门，就看见韩、赵、魏三家联军驾驶着小船，在攻击落水的智氏士兵，原来是韩、魏用水灌了智伯瑶的大营。智伯瑶没有来得及抵抗，就被抓住处死了。之后，三家联军掉转兵锋，杀向智氏的城邑，彻底灭掉了智氏一族，并瓜分了他的地盘。'
  merge: -1
  img_proc: true
- pgno: 212
  md: '就这样，赵襄子以弱势之力获得了最终的胜利。纵观赵襄子的一生，首先是他善于隐忍，暗暗积蓄力量，增强自己的实力，不与强者争锋，以庶子出身获得父亲青睐，成为当家人。


    之后，又一退再退，躲避强敌，在晋阳扛下了敌人猛烈的攻击。弓箭射完了，就拆掉宫殿，熔铜柱造箭；粮食吃完了，就吃草根和树皮，甚至出现了人吃人的现象。但他最终寻得了敌人的弱点，一举获得成功。赵襄子身上有一股不服输的领导者气质，这是他取得胜利的根本原因。


    三代以后，赵襄子的侄孙赵烈侯和魏文侯一起得到周烈王的承认，成为诸侯。可以说，赵襄子是赵国的实际开创者之一。


    作为赵氏家族的领导者，赵襄子着眼于未来，对形势有准确的把握，并进行了积极布局，使得后代子孙成就了王业。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# 晋武公：蛇吞大象，不是没可能


    > 本事不大，脾气就不要太大，否则你会很麻烦。能力不大，欲望就不要太大，否则你会很痛苦。


    公元前678年，曲沃武公趁称攻破晋国都城翼城，杀了晋侯缗，登上了晋国国君之位，开启了小宗替代大宗的漫长之路。之后，他又用财宝贿赂仍然挂着天子招牌的周釐王，得到了他的认证后，让自己坐稳了诸侯的位子。


    什么是大宗，什么是小宗呢？以周王室为例，周天子有很多儿子，作为继承人登上天子之位的那个儿子，就是大宗，没有登上天子宝座但被封到各地的贵族，如晋、郑、燕、鲁、卫、曹等诸侯国，都属于小宗。同样，在诸侯国内，诸侯也有很多儿子，有继承权的那一支是大宗，没有继承权的是小宗。晋武公的家族就属于小宗，他原本是不可能成为晋国国君的，但因为他有一个强悍的祖父，使得他的家族像一条巨蟒，逐步地将晋国这头大象吞进了自己的肚子里。那么，蛇是如何吞下大象的呢？


    晋国的第十二任国君晋昭侯有个叔叔，名叫成师，很有威望和才能。为了表示对叔叔的敬重，晋昭侯准备将曲沃（今山西曲沃县）封给成师。对此，晋国大夫师服非常不赞同，因为这违背了周礼的规定。


    曲沃的规模比晋国的都城还要大，如果臣下的土地、人口和力量都强于国君，这不利于统治。但晋昭侯不为所动，坚持将曲沃封给成师，世称“曲沃桓叔”。尽管曲沃桓叔已经58岁了，但是他政治经验丰富，不断树立仁德形象，很多有才能的人都投靠他。经过他苦心孤诣地经营，曲沃很快就成了晋国的第二个政治、经济和文化中心，实力也超过了首都翼城。曲沃名义上虽是晋国的小宗封地，但实际上已经成了独立于晋国的政权。随着力量的增强，曲沃的野心也在膨胀，就连晋昭侯的身边都有曲沃桓叔的亲信，但这位糊涂的国君却未采取任何措施。


    晋昭侯在位的第七年（前739），与曲沃桓叔勾结的大臣潘父杀掉了晋昭侯，打算迎接曲沃桓叔进入都城。但晋国的其他臣僚和百姓不认同曲沃桓叔，将他击退，立晋昭侯的儿子公子平为国君，是为晋孝'
  merge: -1
  img_proc: true
- pgno: 214
  md: '侯，最后弑君的潘父被处死。晋孝侯八年（前731），72岁的曲沃桓叔去世，他至死也未能踏入晋国都城。他把这一梦想留给了儿子姬鱓，世称姬鱓为“曲沃庄伯”。


    曲沃庄伯性格刚毅，善于笼络人心，简直是他父亲的翻版。他不断地侵袭国都，与晋孝侯斗了六年。晋孝侯十五年（前724），晋国东部的赤狄袭扰晋国，晋国军队前去抵御，都城空虚，曲沃庄伯趁机进攻，杀死了晋孝侯。眼看曲沃庄伯就要成功了，但晋国旁边的小诸侯国荀国看不下去了，伸出援手，和晋国人联手再次击退了曲沃一方。曲沃庄伯见已经丧失先机，只好退回到自己的地盘。随后，晋国的大臣们立晋王转之弟姬邹为国君，是为晋鄂侯。


    功败垂成的曲沃庄伯不屈不挠，于晋鄂侯六年（前718）春天再次攻晋。为了在角逐中占据绝对优势，他联合郑国、邢国一起出兵，甚至还花重金贿赂了周天子。周桓王派大夫尹氏和武氏领兵协助，一起进攻翼城。晋鄂侯不敌，逃出都城，躲到了随邑（今山西省介休市东南），同年忧愤而死。眼看曲沃庄伯要赢了，但这时他和周桓王闹翻了，周桓王转而支持晋国，派大臣虢公率兵将他打了回去。在周天子的支持下，晋鄂侯的儿子光被立为国君，是为晋哀侯。


    晋哀侯二年（前716），带着一万个不甘心的曲沃庄伯也去世了。尽管父子两代都未能成功，但是晋昭侯、孝侯、鄂侯的非正常死亡，加之连年的战争，也极大地削弱了晋国国君一系的力量。而曲沃方面，又一位雄主登上宝座，他就是曲沃庄伯的儿子姬称，世称“曲沃武公”。双方开始了新一轮的争斗。


    晋哀侯八年（前710），晋国占领了都城南边的陉廷。所谓敌人的敌人就是朋友，陉廷人与曲沃武公联合起来，于第二年联军伐晋，陈兵于陉廷。曲沃武公坐在战车上，亲自指挥作战，猛将韩万为他驾车，梁弘挥着戈在车右战斗。晋军兵败，曲沃武公穷追不舍，在汾水边的烂泥地里死死地咬住晋哀侯不放。由于拉车的战马深陷泥潭，晋哀侯才暂时逃过一劫。不过，还没来得及喘口气，当天夜里，他再次被追上最后被抓为了俘虏。


    晋国人得知国君被俘，便立晋哀侯的小儿子为国君，即晋小子侯。得知晋国有新的国君，而俘虏来的这个君主就没有意义了，曲沃武公一怒之下让韩万杀了晋哀侯。晋小子侯当了四年国君，就被曲沃武公诱骗到自己的地盘上杀死了。已经与曲沃方面闹翻的周桓王决'
  merge: -1
  img_proc: true
- pgno: 215
  md: '定维护一次正义，派虢公领兵支持晋国，将曲沃军打得大败。晋哀侯的弟弟姬緡被立为新君，是为晋侯緡。周桓王两次支持晋国大宗，都有一个关键人物，那就是虢公，善战的虢公是他手里的一张王牌。晋侯緡的宝座还没有坐热，周桓王那边就和虢公闹翻了，虢公为了保命逃到虞国。趁周天子无人可派，曲沃武公出兵拿下翼城，晋侯緡只能逃走。


    晋侯緡二年（前703）秋天，周桓王再次打出天子的旗帜，拉着虢国、芮国、梁国、荀国、贾国等一众小国群殴曲沃武公。曲沃方面退出翼城，晋侯緡重新复位。在之后的26年里，曲沃方面继续和晋侯緡死磕。这期间，一直支持晋国大宗的周桓王去世了。周桓王的儿子周庄王即位。不过，周王室内部也出现了小宗与大宗的争权，周庄王的弟弟王子克企图夺哥哥的权，发生了一场内乱。


    晋侯緡二十八年（前678），曲沃武公打败晋军，杀死了晋侯緡，将都城迁入翼城。当时的周天子是周庄王的儿子周釐王。曲沃武公拿出大量财宝贿赂他，周釐王认可了他登上晋国国君宝座的事实，从此曲沃武公成了名正言顺的诸侯，变成晋武公。曲沃方面前后用了70年，三代人前赴后继，熬死晋国六任国君，犹如巴蛇吞象，最终以小吃大，获得了胜利。


    晋国小宗之所以战胜大宗，除了曲沃方面在军事上不断削弱翼城的晋君实力外，很大一个原因是它政治上的成功。曲沃首先在政治上孤立身为大宗的晋国国君，对贵族们施以恩惠，甚至得到了周天子的支持。另外，三代君主均为明主，治下政治清明，支持率较高，影响力也渐渐地超过晋国大宗。


    “曲沃代翼”，表面上是以小宗为代表的贵族集团战胜了国君，实际上是人心的背，即便大宗后来有周天子的支持，在道义上占据上风，但依旧无法避免覆灭的结局。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# **魏文侯：小信成，则大信立**


    诚信是一个人在世上能够获得的最有说服力的名片。有了这张名片，你的其他头衔、荣誉、过往才会被人真正认可。


    魏文侯魏斯是三家分晋后，联合赵烈侯、韩景侯一起向周天子请封的发起者。韩、赵、魏三家晋国大夫，后来成为被天子认证过的正牌诸侯，魏文侯也就成了韩、赵、魏三家的大哥。魏文侯当大哥有一个准则，那就是立信。


    魏文侯曾与虞人约定，某天一起出去打猎。当天，魏文侯与一群官员饮宴，笙歌曼舞，室内充满欢乐的气氛，可宫殿外下着瓢泼大雨。魏文侯看了一眼沙漏后站起来，告诉客人继续饮酒观赏歌舞，自己要出去一趟。亲近的臣子就问他：“今日如此欢乐，外面又下大雨，主公要去哪里？”


    魏文侯说：“我与虞人约定今天一起打猎，虽然饮宴十分欢快，但怎能因此失约呢？”说完，他就命令侍从官准备车马、弓矢，自己则穿着避雨的蓑衣，朝山林里去了。


    大雨如注，虞人以为魏文侯不会来了，没想到时间刚到，魏文侯的车子就出现在他的眼前，他顿时大喜过望。虞人只是个小官儿，但魏文侯不因他身份低微就轻视与他的约定。正因为魏文侯连这种很小的约定都不违背，所以他得到了韩、赵两国君主的尊重。


    三家分晋后，韩、赵、魏三国瓜分了晋国的版图。三国土地犬牙交错，他们都想将分散的地块整合起来，故而彼此之间离心离德。赵（此时尚未得到周天子认证，名义上仍是晋国大夫）的当家人先派使者秘密会晤魏文侯，希望联合魏国一起出兵，灭掉韩国，瓜分其土地，但遭到魏文侯的拒绝。魏文侯让使者把自己的话转达给赵献侯：“我把韩国视作兄弟之国，怎能去打兄弟呢？”不久，韩国也派使者会晤魏文侯，目的与赵国一样。魏文侯同样拒绝，让使者转告韩武子：“赵国是兄弟之国，我们怎能打自己的兄弟呢？”韩、赵知道了魏国的态度，十分佩服魏文侯。魏文侯为了消除彼此的猜忌，向韩、赵当家人分析了当前的局势。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '韩、赵、魏三家，赵国最强，韩、魏较弱，赵国无论是企图灭魏还是灭韩，都会导致韩、魏联合起来对抗；反之，赵国如果搞各个击破的阴谋，无论是联韩还是联魏，最终都是唇亡齿寒，得利的只能是赵。虽然赵国是韩、魏的最大威胁，但是如果两国联合攻赵，他们也不会获得更大的利益。韩、魏联合的力量最多与赵国持平，打起来只会两败俱伤，自损元气。就算联合灭掉赵国，韩、魏两国也难以避免内斗。与其如此，不如大家诚心相待，抱团向外发展，打破困局。


    魏文侯在外交上的努力，赢得了韩、赵的支持，彼此间没有了牵制，都走上了向外发展的道路。赵国在魏国的北方，向北发展会造成互斗；同样，力量较弱的郑国是韩、魏的共同邻居，向郑国方向发展，会引起与韩国竞争。那么，唯一的发展方向就是向西，进攻秦国。


    魏文侯二十七年（前419），魏国大军渡过黄河，在少梁（今陕西韩城西南）修建了多座军事堡垒，为打击秦国囤积粮草和军械。秦国立刻展开反击，试图夺取这些堡垒，但都没有成功。为了阻止魏军前进的脚步，秦国沿着黄河建造了大量城墙，将其作为防御工程。


    翟璵出身奴隶，但其才华得到了魏文侯的重视，被任命为相。翟璵善于识人，给魏文侯推荐了吴起，魏文侯当即任命他为魏军主帅，负责进攻秦国的军事行动。魏文侯三十三年（前413），吴起指挥魏军在西河大破秦军，撕开了秦军的西河防线。之后，魏军长驱直入，进入秦国境内，直趋渭河平原上的重镇郑地（今陕西省华县）。秦国朝野震惊。


    魏军一旦拿下郑地，渭河平原上出产的粮食就会成为其源源不断的补给，而秦国也就失去了最大的粮仓。当时秦国的都城在雍（今陕西省凤翔县），魏军会一路杀到城下，灭掉秦国。


    秦简公为了避免灭国，向齐、楚求援。齐、楚立刻出兵从背后捅魏国的屁股，魏文侯言齐、楚得手，并不慌张，因为丢失的几块土地都是飞地，对魏国而言不算什么损失，因而命吴起继续进攻秦国。吴起在郑与秦军厮杀，吸引了秦国的主力军。魏国太子魏击指挥军队趁机渡过黄河东岸，夺取了秦国西河防御线上的重要城市繁庞（今陕西韩城东南）。'
  merge: -1
  img_proc: true
- pgno: 218
  md: '秦国的西河防线被撕开后，其军事据点被一一拔掉。魏国相继占领了临晋（今大荔东南）、王城（今大荔）、元里（今澄城东南）、洛阴（今大荔西南）、合阳（今合阳东南）、阴晋（今华县东）等城市。到魏文侯三十八年（前408），整个西河地区全部落入魏国手中。


    吴起号令严明，士兵们对当地百姓秋毫无犯。魏文侯十分清楚，军事上的胜利并不是真正的胜利，软实力的胜利才是最终的胜利。他需要的不只是秦国的土地，还有这片土地上的人心。于是，他决定从文化上入手。


    魏文侯亲自拜访孔子的高徒，大儒卜商，希望他到西河讲学。卜商当时已是百岁老人，而且双目失明，不可能亲自授课，但魏文侯依旧拜他为师。卜商被魏文侯的诚意所打动，带领学生公羊高、谷梁赤、段干木，还有子贡的学生田子方到了西河。


    卜商虽然不能讲学，但他是一面旗帜，他的高足们将他的思想传播给了年轻的学子，从而开创了“西河学派”，为魏国培养了大批合格的人才。西河人受到教化，从而成为魏国之民。


    魏国占据西河地区后，又夺取了函谷关（今河南省三门峡西），遏制住秦国向中原地区的发展通道。


    为了彻底将秦国锁死在洛水西面，魏文侯下令在洛水东岸修建城障，南端与阴晋相接，北面与雕阴（今陕西省甘泉县道镇）相连。秦国这条巨龙，就像被铁链锁住一般，在此后的18年里，未能向中原迈进一步。魏国有
    了西河这个大粮仓，又控制了关西与中原的通道，国富民强，列国人才都来效力，从而成为战国初期最强的国家。


    所谓小信成则大信立，大信立则大事成。在之后的几年里，魏国相继与赵国联合，灭掉中山国，又击败了齐国和楚国。


    魏文侯四十三年（前403），韩、赵的老当家人都已去世，魏文侯是晋之三家大夫中资格最老的。于是，他率领韩赵、赵籍一起拜会周天子。自春秋以来，周天子就有名无实，只剩下天下共主这个还在闪光的金字招牌了。


    但他手里毕竟还掌管着礼法程序，没有他的认可，韩、赵、魏虽然拥有自己的土地和官僚系统，但名不正，言不顺，与其他诸侯国往'
  merge: -1
  img_proc: true
- pgno: 219
  md: '来时，在外交上很是被动。此次拜会，他们得到了周威烈王的认可，成为与齐、楚、燕、秦并驾齐驱的诸侯，战国七雄的格局由此形成。


    综观魏文侯的一生，可以说是他以信取人、以信立国、以信成就霸业的一生。'
