  md: '# 裴度：遇事不慌，静观其变


    有些事，不上秤二两重，上了秤一千斤都打不住。


    裴度出身河东裴氏东眷，唐朝著名的世家大族，在宪宗、穆宗、敬宗、文宗四朝为官，数度拜相，被时人视为郭子仪再世重生，对唐代政治产生了重大影响。裴度熟悉官场和人情，处事灵活多变。我们不妨以他任中书省任职时的一件事情为例进行阐述。唐敬宗时，裴度被任命为司空、同平章事。不过上任不久，就发生了一件大事。


    一天早上，裴度在中书省的政事堂办公，保管官印的属吏突然慌慌张张地闯了进来，告诉裴度中书省的大印丢了。在场的下属们听了，无不大惊失色，面色如纸。在当时，官员丢了官印是死罪，属员也要被贬官。裴度也大吃一惊，不过他随即冷静下来，告诫保管印信的官员不要声张。


    中书侍郎问裴度有何良策找回大印，裴度却只管喝酒，告诉众人他自有办法，不过所有人都必须保守这个秘密。


    过了两天，保管印信的属员发现，大印完好无损地又回来了。他赶紧向裴度禀报，裴度只是点了点头，表示自己知道了。


    事后，中书侍郎问裴度：“大人，你为何知道官印会完好无损地被放回来？”


    裴度说：“官印不能盗卖，普通的小偷偷了它，不但卖不掉，而且是死罪。只有一种可能，是中书省的官员偷了印，私自给有关关节的文书铃印去了。如果追查得紧，为了销毁罪证，他必定会损毁官印。只要不通风声，拿了印的人用完后必定会放回原处。”


    中书侍郎连称裴度高明，被他解决问题的见识所折服。


    保管印信的官员见官印失而复得，请求裴度增加安保人手。裴度却让他不必紧张，依旧像从前一样，只需暗中盯着即可。不久，他就抓到了那个偷官印的人，果然是中书省的一个门吏，他铃了印的通关文书也被追回了。'
