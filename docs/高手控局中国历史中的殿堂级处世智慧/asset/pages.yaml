  md: '曹氏一门，在整个宋代都有着较高的门第，丝毫没有堕落。


    曹彬的5个儿子都受到了皇家恩宠，两个儿子担任了节度使，孙女则为宋仁宗皇后，曾孙娶了宋仁宗之女永寿公主。其家族之显赫，可与唐代的郭子仪相比。'
