  md: '# 颜率：提高门槛以化解危机


    > 一场谈判结束之后，若双方都感觉自己输了，是糟糕的谈判；若有一方觉得自己输了，是平庸的谈判；若双方都认为自己没有输，才是高明的谈判！


    东周晚期，周天子的权威日益下降，位同小侯。楚徙庄王问鼎之后，不少诸侯打起了周王室“九鼎”的主意。


    传说“九鼎”由大禹所铸，上面有天下九州的地图和物产的记录。夏朝灭亡后，商朝的开国君主成汤把九鼎搬到都城；商朝灭亡后，周武王将九鼎从朝歌搬到镐京；周平王东迁，将九鼎搬到洛邑。谁得到九鼎，就意味着天命所归。秦国自秦穆公之后，不断东扩，逐渐蚕食周王室的土地，兵临东周君城邑之下，向东周君索要九鼎。东周君召集群臣商量对策。大臣颜率说：“君上不必忧虑，我去齐国借兵退敌。”


    颜率到了齐国后，对齐王说：“秦国暴虐无道，企图夺取周王室的九鼎，我们君臣思虑后，认为与其将九鼎交给秦国这样的不义之国，不如交给齐国这样的仁义之国。齐王出兵，既能挽救周王室获得美名，又可得到九鼎这样的宝物，希望大王您尽力。”齐王欣然接受，随即派遣五万齐军去救援。秦军见齐军来救，就放弃了对东周君的威逼，撤退了。


    齐国帮周王室解除了危机，要求周王室兑现承诺，为此，东周君寝食难安。颜率再次表示，由他来解决问题。颜率到了齐国后，先发表了一通对齐国援救周王室的感言，接着问齐王：“我们打算把九鼎交给您，不知您准备走哪条路呢？”


    齐王说：“我准备借道梁国。”（即魏国，因其都城在大梁，故名。）


    颜率回禀说：“恐怕不行，梁国君臣早就想夺取九鼎，他们在晖台和少海等地方谋划了很久。九鼎一旦进入梁国领土，恐怕您就不可得了。”


    齐王说：“那我改道楚国。”'
