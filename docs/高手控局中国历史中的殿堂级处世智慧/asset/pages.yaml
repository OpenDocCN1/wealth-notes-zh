- pgno: 166
  md: '# 项羽：“分蛋糕”是门大学问，可惜我不会


    打天下靠本事，坐天下靠智慧。所以，有本事、没智慧的管理者，虽能创业，却不见得能守业。


    秦二世二年（前208）九月，秦军上将军章邯渡过黄河，与另一位秦国大将王离汇合，一举击败赵军，将赵王赵歇、赵国大将张耳一起包围在巨鹿城。张耳派陈泽、张廪二将向驻扎在巨鹿北面的陈馀和各路诸侯求救。陈馀给了二将5000人马去救援，可这点几人马不够塞秦军牙缝的，结果全军覆没，二将战死。至此，诸侯营垒虽然多达十余座，但无人敢向章邯挑战。


    楚国义帝派宋义率军救援。到了安阳，宋义却驻扎不前，在原地停留了46天，原来他是想等秦、赵两军厮杀得两败俱伤时再出战。副将项羽大怒，杀了宋义，义帝便任命项羽为上将军，让他率领全军救援。秦二世三年（前207）十二月，项羽的大军到了巨鹿县南的黄河边（另一说为漳水），他先下令将领英布和蒲将军率两万人渡河，然后命令全军渡河后凿沉船只、破坏炊具，只带了三天的口粮向敌人发起进攻，以示没有退路。这就是“破釜沉舟”典故的由来。


    项羽的军队以一当十，冲进了秦军的大阵，进行了九次战斗。秦将章邯逃走，苏角被杀，王离被俘，其余将领则或逃走或投降。营垒里的诸侯士兵们听到战斗的声音，纷纷登上城墙观看，均被楚军的气势所震慑。项羽大破秦军、解围巨鹿城之后，召各路诸侯来见。各路诸侯见了他，全都跪着向前，没有人敢抬头仰视他。至此，项羽成为诸侯联军的统帅。


    章邯率领的秦军与项羽大军在棘原对峙。章邯派内史司马欣向秦二世汇报战局，赵高故意不让秦二世接见他。司马欣在宫门外等了三天，害怕遭到赵高的迫害，便绕路回去了。


    司马欣认为，赵高嫉贤妒能，无论是打了胜仗还是败仗，身家性命都无法保全，希望章邯带领大家选一条明路。陈馀也给章邯写信，劝他投降。之后，项羽又两次击败秦军。最终，章邯决定向项羽投降。二人在洹水南岸的殷墟上盟誓，项羽封章邯为雍王、司马欣为上将军。'
  merge: -1
  img_proc: true
- pgno: 167
  md: '项羽的大军进击得很快，于秦二世三年（前207）八月就拿下了武关。两个月后进入咸阳，秦朝宣布灭亡。之后，项羽自立为西楚霸王，大封诸侯：刘邦被封为汉王；秦国的三个降将章邯为雍王、司马欣为塞王、董翳为翟王：魏国的地盘被一分为三，魏王豹为西魏王、申阳为河南王、司马卬为殷王；原来的赵王歇改封为代王，赵歇的大将军张耳被封为常山王；当阳君英布被封为九江王；番君吴芮被封为衡山王；共敖被封为临江王；原来的燕王韩广改封为辽东王，韩广的部将臧荼却封了燕王；原来的齐王田市改封为胶东王，田都为齐王，田安为济北王。齐国王室后裔中出力最多的是田荣，和张耳齐名的陈馀因没有随项羽入关，故而没捞到王的爵位，心中对他充满怨恨。


    自春秋战国以来，随着生产方式的改变，道路和交通有了很大的发展，原来受山川和河流阻隔的地方被打通了，周天子分封诸侯的间接统治方式逐渐行不通了。项羽分封诸侯，导致的结果就是重新走上春秋战国以来互相攻占，抢地盘、抢人口、抢财富的老路。田荣不认可项羽的分封，杀死了胶东王田市、济北王田安，齐王田都则逃亡楚国。随后，田荣自立为齐王，拥有三齐的全部地盘。


    同样反对项羽的还有陈馀。由于他没有随项羽一起入关，项羽只封给他三个县，爵位是比王次一等的侯。


    陈馀得知故主赵王歇改封为代王，张耳却得了常山郡，非常愤怒，写信给田荣，希望能一起反抗项羽。田荣当即给了他一支部队，打不过他的张耳只好逃走，赵歇重新被立为赵王。


    项羽封完诸侯们之后，以为天下从此太岁了。可是他回到都城彭城不久，屁股还没有坐热，就听说了田荣造反的消息，只好充当救火队长，去扫荡三齐。田荣被灭后，项羽在齐地实施焦土政策，弄得怨声载道。这时田氏的另一个领军人物田横出场了，他继续反对项羽。


    就在项羽和田横纠缠的时候，汉王刘邦偷袭了项羽的彭城。对于这种背刺行为，项羽非常愤怒，掉头打败了刘邦。在楚汉相争中，除了极少数的几位诸侯王外，几乎一水儿地背叛了他。


    在反秦起义中，项羽打了最硬的一仗，灭掉了秦军的主力，以一己之力扭转了战场上的不利局面。但他没有独享胜利的成果，而是将地盘、财富分封给所有参与起义的诸侯，虽然谈不上公平，也算是仁至义尽。事实上，在任何一场财富的瓜分中，都不可能做到绝对的公平。'
  merge: -1
  img_proc: true
- pgno: 168
  md: 平，只有利益的平衡。很显然，项羽没有做好平衡。得到分封的这些诸侯，很快就开始反对他。这是由人性的贪婪所决定的。在刘邦与项羽竞争最激烈的时候，郦食其也曾建议刘邦裂土封侯，但很快遭到了张良的反对，刘邦也认识到了裂土的弊端。这是因为，一旦裂土，诸侯便拥有了与主封者同等的地位，新一轮的地盘之争将在所难免。项羽的失败，从本质上说并非军事上的失败，而是人性把握上的失败。这一点对创业者来说，不可不察。
  merge: -1
