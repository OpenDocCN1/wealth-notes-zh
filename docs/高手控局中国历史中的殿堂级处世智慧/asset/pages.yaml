- pgno: 23
  md: '孙权摇了摇头说：“我只想尽一方力量，辅佐汉室，你所说的，恐怕非我能及。”


    鲁肃在诸侯并争、勢力各据一方、江东何去何从尚不明朗的情况下，就为孙权指明了今后的发展方向，不得不说其才大如海。只是这时候的孙权虽然是江东之主，但内心是犹疑不定的。他的哥哥孙策活着的时候，用武力压制住了吴郡、会稽郡、丹阳郡、豫章郡、庐陵郡、庐江郡等江东六郡的士族集团。这些士族在当地拥有强大的影响力，并未彻底向孙氏的军事集团俯首，而是一直处于观望状态。以华歆为例，他虽然投降了孙策，但却未出任孙策团队的官职，而是辗转逃到江北，最后进了曹操的阵营。孙权能够统领父兄留下的文武官员，让江东士族与自己合作实属困难。鲁肃的一席话，表明他早就看清了江东的发展方向。


    汉献帝建安十三年(208)七月，曹操大军南下，直扑荆州。当年八月，刘表病死，其子刘琮投降，屯兵樊城的刘备得知消息后弃城而去，在当阳被击溃。曹操拿下荆州，下一步就是占据江东了。孙权只有两条路可以走：一是战，二是降。朝堂之上，持投降态度的人不在少数，尤其重臣张昭，更是认为只有投降一条路。众人你一言我一语，唯有鲁肃沉默不语，他趁孙权上厕所时跟了上去。孙权见鲁肃逡巡，就问道：“子敬，你有什么话要对我说吗？”


    鲁肃说：“我和朝堂上的那些人也可以投降曹操，只有将军不能。”


    孙权问：“为何？”


    鲁肃说：“我们投降了曹操，纵然是做个小官儿，慢慢升迁，再不济也能做到州郡的长官。将军您投降了，该给什么官职呢？”


    由此可见，进言的时机、地点、方式非常重要。对此，鲁肃可以说做得恰到好处。张昭等一众文武官员言降时，如果鲁肃直言抗敌，必定会遭到大佬张昭的斥责，甚至会遭到众人的围攻，陷入孤立之境。这种劣势的“主战派”，难以让孙权动心，甚至会产生戒心。厕所是个私密的地方，会让人暂时放松下来，而且有一定的保密性，如果孙权内心有抗敌但又不想让群臣知道的想法，在这里表达出来最为妥帖。在投降这个问题上，鲁肃首先说的仍然是利害。曹操收复江'
  merge: -1
  img_proc: true
- pgno: 24
  md: '南，必定会重用江南士族，那些投降者照样会做官，只是换了个主子而已。孙权本就是主子，他该去哪儿呢？


    这是打动孙权并最终坚定其意志的关键。


    另外，鲁肃已经想好了联合刘备抗击曹操的战略。为什么一定要是刘备呢？除了军事上相互依赖外，刘备的皇叔身份在这里起了很大的作用。因为曹操征讨孙权打的是朝廷的旗号，孙权名义上还是汉朝的讨虏将军、会稽太守，若反抗就是地方不服从朝廷，属于叛逆。有了刘备的皇叔身份，无疑会提高孙权的政治影响力，使他能以讨伐汉贼的名义与曹操对抗。


    待孙权坚定了自己的想法后，鲁肃立刻渡江寻求与刘备的联合。在长坂坡，鲁肃找到了刘备。此时的刘备损兵折将，对前途也缺乏清晰的认识。在他的奋斗之路上，每一次失败都是寻求依附新的势力。当鲁肃问他何去何从时，刘备的回答是：“投奔老朋友，苍梧太守吴巨。”鲁肃直言吴巨是个庸人，不值得投奔，并拿出了孙刘联合的方案。接下来那场影响历史走向的大战已不必细说，鲁肃和周瑜、诸葛亮一起奠定了三分天下的基础。


    在孙刘联盟中，鲁肃扮演了非常重要的角色。他深谙人情，在孙刘之间充当着润滑剂。正是在鲁肃为都督主政大局的时期，孙权和刘备都获得了发展的机会，避免了被各个击破的危险。'
  merge: -1
