- pgno: 158
  md: '# 陈胜：忘了为什么出发的，走不远


    天底下的失败者有一个共性——可以承受苦难，却担不起突如其来的福分。


    陈胜是拉开帷幕反抗序幕的第一人。他本来只是出身底层的小人物，但因为有胆识，竟然举义成功，建立了自己的政权。然而面对胜利，陈胜忘记了初衷，在事业发展的早期就开始走下坡路，以至于仅过了半年就兵败身死。


    秦二世元年（前209）七月，朝廷征召大量戍卒去渔阳（今北京市密云西南），陈胜就在人群之中。因为长得比较魁梧，他被任命为屯长（小队长）。他和900多个农民在两个军官的驱使下，日夜不停地朝渔阳进发。走到蕲县大泽乡（今安徽宿州西寺坡乡）时，天开始下起暴雨，道路也被洪水冲垮，导致他们一行人无法继续前行。眼见如此，戍卒们非常恐惧，怕耽误了行程。按照秦国的法律，征召的戍卒没有按期限到达，会全部被处死。


    人一旦处于极端的困境，就会铤而走险。也就是说，恐惧令人勇敢。陈胜看透了这些软弱可欺、被临时组织起来的农民的内穴，便找到另一个屯长吴广。他虽然与吴广不是故交，但同为戍卒一起行走后，便经常在一起聊天，因而建立了较为密切的关系。陈胜对吴广说：“我们现在去了渔阳是死，逃跑被抓住也是死，反正都是死，为何不选择干一番大事业呢？”


    为了说服吴广，陈胜向他分析了当前的局势：“天下人对秦国的严苛统治，已经到了忍无可忍的地步，胡亥是秦始皇的小儿子，本来不该即位，该即位的是始皇帝的长子扶苏，但他因屡次进言而被杀掉了。还有个名叫项燕的楚国大将，很受百姓爱戴，现在百姓不知两人生死，我们可以借他们的名义起事。”吴广很佩服陈胜的胆识，便力挺他起义。


    陈胜和吴广都是底层出身，以底层出身去推倒贵族，这在秦之前还没有发生过。陈、吴二人觉得自己的影响力不够，因而决定借鬼神的预兆为自己戴上神秘的光环。他们在一块布帛上用朱砂写上“陈胜王”三个字，塞进渔人送来的鱼肚子里。戍卒们将这条鱼煮熟，吃饭时发现了布帛上的字，都感到很惊奇。戍卒们宿营时，吴广潜伏到一'
  merge: -1
  img_proc: true
- pgno: 159
  md: '堆比较远的篝火边，模仿狐狸的叫声，并大声喊叫：“陈胜王，大楚兴。”入睡的戍卒们被这怪异的叫声吓醒了，从此看陈胜犹如看伟大的人物一般。“篝火狐鸣”的把戏，确有些装神弄鬼的意味，但是对于没有文化、愚昧的底层群众很受用，陈胜、吴广在这群人中树立了威信。这一点，在后世的反抗者中，不论是黄巾军还是红军，乃至洪秀全的太平天国，都无一例外地被效仿，成为一种号召方式。


    一天，吴广趁押解他们的军官喝醉，故意扬言说要逃走。喝醉的军官大怒，挥舞着鞭子要教训吴广。这一行为犯了众怒，被群起而攻之。在混乱中，吴广抢夺了军官的佩剑，将他杀死。陈胜也杀死了另一个军官。陈胜将900个戍卒召集到一起，开始了他的演讲。他站在一个土台上说：“我们遇到了大雨，已经耽误了期限，超了期限按律当斩，就算侥幸不死，到了边塞也还是会送命。”之后，他说出了那句响彻历史的名言：“王侯将相，宁有种乎？”戍卒们受到他的感染，纷纷高呼起来，愿意为他驱驰。


    从陈胜的起义准备和一系列的操作来看，他很有胆识，而且充满组织才能和领导天赋，知道如何为发动起义做铺垫，也知道如何鼓动人心，利用人心。他和众人袒露右臂，作为起义的标志，并修筑祭天的坛，一起盟誓，以公子扶苏、大将项燕的名义发动了起义。陈胜自立为将军，吴广为都尉，很快就拿下了大泽乡。接着，他们又夺取了蕲县县城。


    陈胜起义的消息不断扩散，人们纷纷“斩木为兵，揭竿为旗”，加入他的队伍。随着起义的队伍越来越大，人才也越来越多。不到一个月，他们就攻克了铨县（今安徽省濉溪县）、鄌县（今永城西）、苦县（今鹿邑县）、柘县（今柘城县）、谯县（今亳州谯城区）。


    随着地盘不断扩大，陈胜意识到要建立自己的根据地，首先要占领有战略价值的区域，因而他率兵直指“陈”这个地方。在春秋时期，陈是陈国的国都。后来，楚国灭掉陈国，也曾迁都到陈，将其作为都城。秦统一六国后，陈成为郡守的驻地，可见这里位置的重要。当陈胜率领600多乘战车、1000多名骑士、上万名步兵来时，郡首早就逃得没影了，只有副长官郡丞还在抵抗。不过，他们哪里是陈胜的对手，因此很快就失败了。


    陈胜进城之后，召集了三老（掌管当地教化的官）和有名望的人。这些人虽然不是底层百姓，但是对秦国的暴政早已不抱希望，因'
  merge: -1
  img_proc: true
- pgno: 160
  md: '而纷纷劝陈胜称王。陈胜就这样戴上了象征权力的冠冕，建立了“张楚”政权。张楚这杆大旗，拥有极强的号召力。痛恨秦朝统治的百姓们似乎看到了光芒，纷纷杀掉本地主管造反，反秦的烈火在全国各地燃烧起来。此刻，陈胜的事业发展到了高光期。他任命吴广为假王（相当于王的副职），让他率领义军主力向西攻击荥阳，取道函谷关，拿下秦国的都城咸阳；命令宋留率军攻打南阳，入武关，迂回夺取关中；命令将军武臣、邓宗、周市、召平各率一支人马，北渡黄河，进攻原属赵国的地域（今山西北部、河北西南部），向南进攻九江郡，把起义的烽火点燃到淮南。与此同时，起义军还进攻了原属魏国的大梁地区。起义军四面出击，前方似乎闪烁着一片光明。


    不过，陈胜的好运气很快就用完了。率领义军主力的吴广到达荥阳城下后，发动了多次攻击，都未能拿下这座城池。陈胜改变策略，命令大将周文在吴广牵制住秦军主力的同时率兵向西，绕荥阳，直奔函谷关。沿途百姓纷纷加入，一时间士兵人数发展到10万。秦二世得知后，立刻赦免在骊山修筑陵墓的几十万刑徒，任命少府章邯为将，率领这支临时凑起来的部队抵挡起义军。周文不是章邯的对手，兵败自杀。


    章邯击败周文后，继续向东攻击起义军。此时，进攻荥阳的起义军面临着腹背受敌的危险，吴广则被与他不合的将领田臧假借陈胜的名义而杀。事后，陈胜不但没有治田臧的罪，反而赐予他楚令尹的大印，任命他为上将军。关于吴广的死，究竟是陈胜授意，历来没有定论，但从他对田臧的态度来看至少是默许的。毕竟，此时的陈胜已非起兵时的陈胜。有个曾和他一起种地的农民来拜访他，住在他的宫廷里，因是熟人，出入比较随便，也总是提起陈胜贫穷时候的事，这让陈胜很没面子。经他的宾客一挑唆，陈胜就把这个人杀了。当年说过的“苟富贵，勿相忘”，早已被他丢到了爪哇国。


    陈胜任命朱房为中正，胡武为司过，监督和管理大臣与将军们。这两个人贪婪成性、心胸狭窄，凡是他们不喜欢的将军都会加以迫害。一些将军在战场上冲锋陷阵，回来后还不能避免被投入牢狱。陈胜不按照法司的规矩办事，完全信赖这两个小人，导致很多人离开了他，也使得原本发展迅猛的起义军四分五裂。


    陈胜为王后的种种表现，也直接影响到他的将军们。他们不断争权夺力，逐渐成了一盘散沙，似乎已经忘记了推翻秦国的目的。北征的将军武臣自立为赵王，拿下燕地的将军韩广自立为燕王。周市夺取'
  merge: -1
  img_proc: true
- pgno: 161
  md: '了魏国旧地，虽然没有自立为王，但却将魏国王室的后裔宁陵君魏咎立为王，自己则担任魏相。起义军将领们的涣散，给了秦军大将章邯调整的机会和时间。他杀向陈县，直取起义军的心脏。陈胜亲自领兵血战，无奈不是章邯的对手，只好逃到城父（今安徽蒙城西北），但最终被叛变的车夫庄贾杀死。


    陈胜的失败，在很大程度上是他自己造成的。他占据了先声，各地起义军都奉他为王，原本有道义上的优势，但是他未能很好地利用这一点，导致将帅离心离德，最终失败。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 赵王武臣：不顾小节，丢了王位和性命


    如果不懂得克制地使用手中的权力，那么它迟早会变成刺向自己的刀子。


    赵王武臣原本是陈胜的部将。大泽乡起义后，陈胜、吴广建立了张楚政权，任命武臣为将军，邵骘为护军，张耳、陈馀为左右校尉，率领3000名士兵攻打赵地。武臣从白马津渡过黄河后，对外发布檄文说：“秦国数十年酷毒的暴政，北面有修建长城的苦役，南面有五岭的戍守，百姓困穷，民不聊生。如今陈王登高一呼，天下反秦者云集，已经在楚地建立了张楚国，方圆2000多里。受到压迫的人们纷纷反抗，杀死本地的郡守、都尉、县令。诸位豪杰们，现在是建立功勋的时候了……”


    武臣的一通檄文，无疑点燃了民间反抗暴政的烈火。他的部队很快就发展到了几万人，攻下了赵地的十几座城。不过，燕赵一带仍有很多秦国将士坚守城池。范阳人酬通认为，一座一座地攻占城池，时间长，代价大，不如发布檄文，只要投降的，就立刻授予官职。武臣接受了这个建议，很快就有30多座城池不战而降。前期的武臣，勇猛善战，进取心强，能够宣传大泽乡起义军的精神，善于采纳部下的建议，建立了不少功业，其作为可圈可点。


    前209年八月，武臣夺取了赵地的中心城市邯郸，也就是战国时期赵国的都城。此时，张耳、陈馀劝武臣自立为王。武臣自称赵王后，以陈馀为大将军，张耳为右相，邵骘为左相。称王的武臣脱离了起义军的序列，不再听从陈胜的命令。作为起义军最高领袖的陈胜，深感武臣挑战了自己的权威，准备杀掉他的家人，然后派兵进攻武臣。房君劝陈胜说：“我们的敌人是秦国，如果这时候与武臣结仇，不是又树立了一个敌人？不如认可他的王位，祝贺他，并让他领兵向西，攻打秦国……”陈胜勉强接受了房君的建议，随即派使者向武臣祝贺，并命令他率军攻秦。但武臣不听号令，而是派大将韩广义攻打燕地、李良进取常山、张蹶谋取上党。


    武臣自立为王后，他的部下也有样学样。韩广夺取燕地后，很快就自立为燕王，不再听武臣的诏令。武臣大怒，派张耳、陈馀收拾韩广。离谱的是，韩广没有被打败，武臣却被燕国的士兵俘虏了。有了武臣这个肉票，韩广决定好好勒索一下赵国，他要求分割赵国一半的'
  merge: -1
  img_proc: true
- pgno: 163
  md: '领土以交换赵王武臣。张耳和陈馀这两个鬼精不可能这么容易就范，便派出一波又一波使者，想通过外交努力让燕国释放武臣。韩广懒得和他们废话，直接将派来的使者拉出去杀掉了。


    派往燕国的十几个使者被杀后，张耳和陈馀开始慌了。这时候，一个在史书上连名字都没有的小人物出场了。之所以这样说，是因为这个人是“厮养卒”，大概就是连正规士兵都不算的勤杂兵。可就是这个小人物，说自己能救回赵王。张耳和陈馀此时没有其他办法，就死马当活马医，把这个人派了出去。厮养卒到了燕国后，对燕国将领说：“你们知道我是来做什么的吗？”


    燕将很不以为然地说：“又是一个来送死的吧。”


    厮养卒不接他的话茬，反问道：“你们认为张耳、陈馀是什么样的人？”


    燕将不傻，说道：“那是贤明的长者。”


    厮养卒又问：“那你们知道他们想干什么？”


    燕将大笑：“不就是想救赵王吗？”


    厮养卒笑了，说道：“那你们就大错特错了。他们二人久久不肯答应割地，是期望你们杀了赵王。这两个人都是豪杰，挥马扬鞭就夺取了赵国的几十座城池，怎么肯久居人下？只是最初人心不稳才没有称王。如今赵地已经平定，等你们杀了赵王，他们正好瓜分赵国的土地，并打着为赵王复仇的旗号来进攻你们。一个赵王尚且让你们头疼，两个王夹攻，燕国能不灭亡吗？”


    厮养卒的一番话，彻底击溃了燕国君臣的心理防线，以致他们当场就让厮养卒驾着车把武臣带了回去。


    武臣返回邯郸后，并没有反省这场轻率的内部争斗，也没有做任何调整，这意味着更大的祸患将会降临。所有发动起义的武装豪杰，都以自己会成为笑到最后的胜利者，登上报孤道寡的宝座，殊不知等待他们的，是死神收割人头的镰刀。'
  merge: -1
  img_proc: true
- pgno: 164
  md: '被赵王武臣派去攻取常山郡的李良获胜后，派人报捷，又被武臣派去夺取太原郡。李良率领大军前进到石邑（今石家庄西南）时，秦国大将王离率领防守长城的劲旅南下，封锁了太行山的咽喉要道井陉关，堵住了李良的去路。秦将王离是将门之后，祖父是秦国名将王翦，父亲是悍将王贲。王离精通上兵伐谋、下兵攻城道理，决定用攻心计对付李良。于是，他给李良送去一封没有缄口的信。这封信是以秦二世胡亥的口吻写的，劝告李良认清局势，投降秦军，不但追究他造反的罪行，反而封赐能使他显贵的官职。李良看完之后，对这封信的真实性充满怀疑，没有做任何回应，而是率兵回到邯郸，准备向赵王武臣请命增加兵马再战。


    李良率领自己的将校到了邯郸城外，远远看到一队车驾，前呼后拥，羽葆伞盖，鼓吹相从。看到这个排场，李良以为是赵王出行归来，立刻和将校们跪在路边行礼。


    实际上，车中之并非武臣，而是武臣的姐姐。她参加宴会归来，喝得酩酊大醉，以为道旁的只是普通的将军，也就没有下车答谢，而是派了小吏来致谢。李良和小吏进行一番沟通后，才得知车中之人并非赵王，而是赵王的姐姐，顿时觉得受到极大的轻视，并怒形于色。李良在军中的威望和地位都极高，是赵军中善战的名将之一，普通将校见了他要行大礼，比他地位高的人，按照礼仪也要下车谢礼。


    秦汉素来多刚烈之士。李良在属下面前受到这种侮辱，没有拔剑自杀就算了，偏偏有人还火上浇油。有个将领说：“现在的豪杰之士纷纷竖起而叛秦称王，赵王原来的地位还不如您，现在做了王，他的姐姐竟然不肯下车行礼，将来荡平天下，我们会有好的礼遇吗？请让我追上诛杀她。”


    实际上，李良收到王离的信后本身就已经有所动摇，如今受到赵王姐姐的羞辱，内心的天平彻底倒向王离。所以他当即下令，追斩刚才羞辱自己的人。就这样，赵王的姐姐糊里糊涂地掉了脑袋。


    杀了赵王武臣的姐姐后，被愤怒冲昏头脑的李良也清醒了。武臣的姐姐确实羞辱了自己，但杀了她是另一回事，这就等同于谋反。一不做，二不休，他下令士兵突袭邯郸城。这边，毫无防备的赵军想不到会遭受自己人的攻击。李良一直杀进王宫，将赵王武臣处死，斩了左相邵彊，张耳和陈馀则跑掉了。之后，李良打不过张耳和陈馀重新组织的赵军，投降了王离。'
  merge: -1
  img_proc: true
- pgno: 165
  md: 赵王武臣的后半生，堪称不断作死。作为陈胜的部将，他几乎犯 了和陈胜一样的错误，“不拘细行”，既没有宽大的胸襟，又不能约 束亲属，做了自己部将的一回肉票之后，不但不检视自己，还依旧浮
    浪不加警惕。陈胜死于自己的车夫之手，武臣死于自己的部下之手， 可谓重蹈覆辙。陈胜在大泽乡起事，犹如一个创业团队。随着事业越 做越大，这个团队分裂了，各自走上了独立发展的道路。作为领头羊
    的将军们却不注重自身修养，而是被欲望和虚名所诱惑，最终走上了 不归路。
