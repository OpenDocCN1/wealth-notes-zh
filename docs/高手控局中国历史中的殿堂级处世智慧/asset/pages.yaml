- pgno: 69
  md: '立了很高的威望。再加上他身高八尺四寸，膀大腰圆，一部胡须垂到腰间，气势十分不凡，就连西晋的一些名士都认为他是非常之人。王浑多次向晋武帝司马炎推荐刘渊，使他得到召见的机会，宾主交谈得十分愉快。


    事后，司马炎对王浑说：“刘渊真的令人印象深刻，春秋的由余、汉代的金日磾也不过如此。”王浑毫不客气地说：“刘渊的文韬武略超过由余、金日磾太多了，陛下要经营东南（指东吴），可以让他领兵，不愁不一鼓荡平。”司马炎对王浑的建议十分感兴趣，又咨询大巨孔恂、杨珧的意见。孔、杨二人听后，坚决反对，他们都认为刘渊是枭雄，一旦拥有独领军队的机会，就如同龙游大海、虎入深山，而难以控制。司马炎这才作罢。


    泰始六年（270）以后，秃发鲜卑部多次反叛，西经的秦州刺史胡烈和凉州刺史杨欣相继被杀。西晋派兵讨伐，均以失败告终。晋武帝下诏寻求能平叛的将帅，尚书仆射、上党人李惠推荐刘渊为帅。眼见刘渊再次拥有独领一军的机会，孔恂再次提出反对意见，他认为秃发鲜卑部的反叛只是小害，让刘渊去平叛将会酿成大害。司马炎再次放弃重用刘渊的打算。尽管刘渊早年未能得到西晋王朝的重用，但从朝廷重臣一再推荐他担任军事统帅这件事来看，他早年在并州种下的种子已经发芽。


    刘渊胸怀大志，固然得到了一些朝廷重臣的重视，但同时也遭到部分士大夫的忌惮，故而有向司马炎建议议杀掉他，这令他很为忧惧。东莱人王弥与刘渊交好，准备离开洛阳回乡。刘渊在九曲河边为他践行，倾诉衷肠：“我因与王浑、李惠是同乡，故而他们向朝廷推荐我，可是有些人妒忌我，竟然进言害我。其实，我并无做官之心，恐怕会死在洛阳，再也无法与你再见了。”


    话刚说完，刘渊悲愤长啸，声音悲凉慷慨，使在座的客人都流下了眼泪。这事被司马炎的同母弟、齐王司马攸知道后，便派人去了解情况。得到呈报后，他立刻进宫向司马炎进言说：“刘渊是一个霸才，应该赶紧杀掉他，不然领州就无法长久安定王浑立刻阻止说：“刘渊是一位长者，我可以为他担保。我们以诚相待，都是用德行感化远方的人使他们归附，怎能因胡乱猜忌而杀人呢？”司马炎接受了王浑的劝谏，没有杀害刘渊。'
