- pgno: 191
  md: '# 晁错：善于分析的管理大师


    > 每个人都应该有一项技能，它不是通过继承得来的，也不是被人赐予的，更不会被人夺走。


    汉初，朝廷与匈奴作战，多以失败告终。尤其是“白登之围”，汉高祖率领的汉军被匈奴大军包围，将士们饥渴多天，最后连弓都拉不开了。若非陈平用奇谋，让匈奴单于将包围圈打开一个口子，汉军得以逃出来，后果将不堪设想。之后汉朝以和亲的方式来保证和平，然而这不能完全避免匈奴的侵袭。汉文帝即位后，匈奴依旧经常在上郡、渔阳郡一带捣乱，让汉王朝始终处于匈奴的阴影下。这时，一个牛人出现了，他就是晁错。


    晁错上书汉文帝，认为在对待匈奴的问题上，有战无不胜的将军，没有战无不胜的民众。他的意思就是，打仗优先考虑的应该是选将，让优秀的将领来练兵，正所谓“兵熊熊一个，将熊熊一窝”。


    选将的思路，其实是个管理学问题。对于部门发展来说，部门经理（领导）的作用至关重要。部门领导选对了，部门的工作效率就高，部门就能够良性运作，不断产生效益。反之，部门领导选错了，整个部门的工作就会出现问题，企业也会受到拖累。


    晁错说完选将，接着说强兵。他认为在战场上取胜，有三点非常重要。


    其一，占据有利地形。也就是在战前进行全方位的侦查，充分了解战场环境，这样才能依靠地理之便占据战场的主动性。步兵、车兵、骑兵、弓弩、长戟、矛锏、剑盾等不同的兵种和武器，适用于不同的环境，且各有优势。如果在战场环境中士兵无法发挥兵种和武器的优势，就可能出现10个士兵打不过一个敌人的情况。


    以骑兵为例：在平原地区，发挥骑兵的机动性和冲击性优势能够碾压敌人；但是在崎岖的丘陵或沼泽地区，骑兵则会遭到步兵伏击，尤其是重骑兵更会成为靶子。这一点在今天的商业活动中，同样有借鉴意义，那就是要了解市场环境，充分做好产品调研。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '其二，对士兵的训练。士兵没有经过训练，就不能形成对将领的服从习惯，也就无法很好地执行军令。这将导致士兵进攻时行动迟缓，追不上敌人；撤退时跑得比谁都快，打散撤离的队形。前方的军队与敌人短兵相接，后面的队伍还拖拖拉拉，不能协同作战，犹如一盘散沙。没有经过严格训练的士兵，一百个人也无法击败训练有素的十个敌人。这也是一个管理学问题。好的员工，本质上就是好的士兵。管理得当，他们就能高效地完成工作；缺乏管理或无管理，他们就犹如散养的羊，不可能产生任何效能。


    其三，器械要精良。刀剑等武器不精良，就犹如赤手空拳；盔甲不坚固，就像光着身子作战；弓箭射不远，就和手持短刀差不多；射箭但是命中率不高，就如同没有射一样；射出的箭击中了敌人，但不足以致命，就像没有箭镞一样。工欲善其事，必先利其器。工作中的设备，如果是落伍的、老旧的、不配套的，故障不断，就会使效能大大下降，而且工作频频出错。


    当然，它本质上仍是管理学问题。兵法上说，武器不精良，就是把士兵的性命交给敌人；战士缺乏训练，作战不力，就是把将领的性命交给敌人；将领如果不能胜任，那就是把国家交给敌人。所以，君王选将是非常重要的。晁错从选将、强兵、利器三点分别阐述了自己的观点，可谓经典。他不是张良、陈谋式的人物，所以没有什么奇谋，但是他的建议都切实可行，完全具备可操作性。汉王朝一旦按照他的章程行事，就不会被敌人找到漏洞而轻易侵袭了。


    战国的历史上，燕、赵、秦都与匈奴接壤，且不说赵、秦这样的强国，就是二流的燕国也能单挑匈奴。为何到了汉朝竟然要用和亲的方式才能确保和平呢？很显然，症结就在晁错说的那三点上。


    晁错向汉文帝分析了地理位置和管理问题，而后分析了敌我优劣。这属于对竞争对手的调查和研究。先说劣势，翻山越岭，跨越险阻，中原战马的耐力不如匈奴，此其一；在危险的道路和逼仄的地方一边奔驰，一边射箭，我们的战士不如匈奴，此其二；在恶劣的环境里，忍饥挨饿，备尝艰辛，我们的士兵也不如匈奴，此其三。再说优势，在平原上用战车突袭，骑兵奔袭，协调作战，匈奴不如我们，此其一；士兵穿着坚固的铠甲，用长枪和强弓杀伤敌人，就武器优势来说，我们有胜算，此其二；五仗为伍，十人一什，共同进退，匈奴人打不过我们，此其三；射手埋伏在后，万箭齐发，集中力量射杀敌人，匈奴的皮甲和木头盾牌几乎没有防御性，此其四；各个兵种配'
  merge: -1
  img_proc: true
- pgno: 193
  md: '合，各种武器结合使用，步兵肉搏，匈奴没有胜算。总体来看，敌人的优势有三，我们的优势有五，如果动员十万人去对付只有几万人的匈奴，无异于以十打一，必定能够获胜。晁错还进一步指出，以敌制敌，这是我们的传统战略。利用归附的游牧部族与匈奴作战，用其长攻敌人之长，这种分化瓦解、以夷制夷的思路，多为后世战略家使用。匈奴分为南、北匈奴，彼此攻伐，最终走向灭亡。曹操将匈奴分为五部，使之不相统属，形不成合力，只能听命于中原王朝。在这一点上，晁错早就给出了战略指导。


    晁错的文章《言兵事疏》，实际上是最早的管理学理论著作。汉文帝非常赏识晁错，极为重视他的建议，提拔他为中大夫，作为自己的政策顾问。'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 岑彭：成就大事者的气度与胸襟


    胸襟宽大的人，不仅放过了别人，更放过了自己。


    岑彭，东汉开国名将，位列“云台二十八将”第六，有成就大事的气魄，是光武帝刘秀创业团队中最具襟怀的人物，为光武帝的事业发展做出了巨大的贡献。他最显著的贡献之一，是为光武帝招揽了很多优秀人才，树立了他爱惜人才的美誉。


    岑彭是南阳棘阳（今河南省新野县）人，最初担任棘阳县长（汉制，大县主官为县令，小县为县长，合称令长）。刘秀的哥哥刘演起兵反抗王莽政权，攻陷了棘阳，岑彭只好带着家人投奔南阳太守甄阜。


    甄阜责怪岑彭没有守住县城，于是扣押了他的母亲和妻子。岑彭无奈，只好率领很少的士兵返回与刘演作战。随着甄阜战死，岑彭受到的束缚解除。他收拢队伍退到宛城，抵御刘演的进攻。在刘演连续围攻几个月后，城里的粮食已经用尽，出现了人吃人的现象。岑彭不愿拖累城中百姓，便打开城门向刘演投降。


    刘演的部将们都吃过岑彭的苦头，因而对其充满恨意，建议将其杀掉。刘演认为岑彭是难得的人才，为人有忠义的名声，便向更始帝刘玄上书，请求留下岑彭的性命，封给他官职。岑彭被封为归德侯，归于刘演麾下。


    更始帝刘玄的政权内部争权夺利，他本人也对功臣不放心。在大臣李轶和朱鲔的撺掇下，他杀掉了刘演。这使得刘演的弟弟刘秀彻底寒了心，从此与更始帝刘玄离心离德。刘演死后，岑彭被调拨到大司马朱鲔的属下，担任校尉。岑彭追随朱鲔讨平了淮阳郡，被升迁为淮阳都尉。岑彭平定了淮阳守将徭伟发动的叛乱，因功升迁为颍川太守。当刘茂率领他的势力攻占颍川时，岑彭没有办法履行职责，只好投奔河内太守韩歆。


    更始帝二年(24)，刘秀进军河内。岑彭劝韩歆归降刘秀，但韩歆不听，最后战不过，才被迫投降。刘秀要杀韩歆，岑彭说：“我曾是大将军刘演的旧部，他对我有救命之恩，我还没来得及报答，他就被害了，这成为我心中永远的遗恨。今天见了他的亲人，我愿宣誓死效'
  merge: -1
  img_proc: true
- pgno: 195
  md: '命。”他又劝刘秀不要杀韩歆，说韩歆是个仁人君子，是创业中必不可少的人才。刘秀很高兴，赦免了韩歆，封岑彭为刺奸大将军。刘秀非常看重岑彭的才能，对他委以重任。当时吕植在淇园拥兵，岑彭请命劝降他，既避免了血战，又壮大了刘秀队伍的力量。


    更始帝三年(25)，刘秀在河北千秋亭称帝，是为光武帝，任命岑彭为廷尉。当时天下尚未统一，刘秀与刘玄二帝并立，赤眉军和其他曾经反抗王莽的起义军各自为政，不相统属。更始帝的大司马朱鲔坚守洛阳，刘秀麾下的11名大将一起率军围攻，连续几个月都没能攻破。岑彭献上劝降的计策，得到光武帝刘秀的认可。尽管朱鲔是杀死兄长刘演的谋主，但那是私仇，现在刘秀已经贵为皇帝，应该顾及公德，因而承诺朱鲔投降后不会对其进行报复。


    岑彭去城下劝降，对他说：“我从前受到您的大恩，一直想报答但没有机会，现在更始帝败亡，您坚守城池还有什么意义呢？”朱鲔担忧遭到清算，得到岑彭的保证便投降了。刘秀赐封朱鲔为扶沟侯、平狄将军。


    岑彭在“云台二十八将”中位置靠前，为光武帝刘秀立下了赫赫战功。他与吴汉的好杀、贾复的武勇有所不同，但凡能够不用武力征伐的，他都采用招降手段，不多杀戮，将损失降到最低，尽可能地削弱对面位。他非常严格地约束士卒，对百姓秋毫无犯，获得了广泛的美名。光武帝称帝后第五年，交趾郡、荆州等地方依旧没有平定，岑彭给交趾州牧邓让写信，说明光武帝的仁德与威福，不发一兵一卒便将其归附于东汉政府。岑彭又命令偏将军屈充向江南发布檄文，先后将江陵、武陵等郡归附于东汉政府。


    岑彭是创业团队中典型的领导者，具有高瞻远瞩的目光、宽广的胸怀，能够收纳各方阵营中的人才为己所用。对于品德好、声望高、能力强的人，他极力保全，即便曾经是敌方阵营的人物，他也会向光武帝求情，这奠定了东汉发展的人才基础。岑彭的一些决策方式，也影响到了光武帝的认知，使光武帝迅速地用最小的代价统一了全国，建立了开明的王朝。


    反观那些失败的创业团队，不仅缺乏有胸襟的领导者，在发展了基本盘之后，也缺乏吸纳外来人才乃至地方人才的能力，仅凭最初的创业伙伴支撑局面。这导致他们在不断扩大事业的过程中缺乏人手，无法进一步发展，更甚者嫉贤妒能，内部倾轧不断，最终走向失败。'
