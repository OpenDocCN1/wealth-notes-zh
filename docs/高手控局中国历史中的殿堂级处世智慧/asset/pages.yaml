- pgno: 155
  md: '# 范蠢：懂得何时从繁华中抽离


    成功之前的寂寞是难免的，一个人在寂寞时所做的事，决定了自己和他人根本的不同。


    范蠢是春秋时期越国的大臣，也是越王勾践灭吴称霸的首席谋主。然而，事业成功后，他却激流勇退，从热闹与繁华中抽离，换了一种人生继续生活。无论是何种身份、从事什么行业，范蠢都能取得一番成就，其中很大的一个原因是：他懂得人性，知道什么时候应该“退”。退不是一种消极的人生态度，而是在掌握大形势的前提下重启生活。


    春秋时期的吴国和越国是世仇，两国经常互相攻伐，冲突由来已久。周景王元年（前544），吴国入侵越国，抓了一批战俘，其中一个战俘负责给吴王余祭看守座船，他便借机刺杀了余祭。周敬王十年（前510），吴国进攻越国，占领了檜李（今浙江嘉兴南）。


    吴王阖闾十年（前505），越王允常得知吴国大军占领楚国都城郢都，吴国空虚，便趁机攻入吴国境内。越王勾践元年（前496），吴王阖闾得知越王允常死亡，当即进攻越国，新即位的越王勾践在檜李（今浙江嘉兴南）御敌，命令三荆囚徒徒步行走，在吴军前自杀身亡。吴军被这一幕震撼，越军则趁机发动偷袭，最终吴军大败，吴王阖闾的脚拇指被越军砍了下来。吴王阖闾赶紧撤离，结果因为脚伤不治而死，临死前嘱托儿子夫差为自己报仇。吴、越之间，由此成为死敌。


    越王勾践三年（前494），勾践不听大夫范蠢的劝谏，先发制人，率军进攻吴国。吴王夫差得知后，号令精兵全部出动，两军大战于夫椒。越军不敌，大败，仅剩5000余士兵退守会稽山（今浙江绍兴南）。吴王夫差乘胜追击，将越军包围在山上。面对这种困境，越王勾践诚恳地向范蠢道歉。史书上有这样一段对话：


    > 越王谓范蠢曰：“以不听子故至于此，为之奈何？”蠢对曰：“持满者与天，定倾者与人，节事者以地。卑辞厚礼以遗之，不许，而身与之市。”勾践曰：“诺。”乃令大夫种行成于吴。'
  merge: -1
  img_proc: true
- pgno: 156
  md: '范蠡建议越王勾践向夫差赠送大量美女、财宝，并且亲自服侍夫差，表示臣服，以彻底麻痹吴国，进而获得吴国的信任。这是因为，就当时的国力来说，吴国强，越国弱，越国要想翻身，首先得活下去，正所谓“留得青山在，不怕没柴烧”。勾践接受了范蠡的建议，从此对他言听计从。就这样，君臣二人像奴隶一样，在吴国忍辱负重三年，得到了夫差的信任，被放回越国。


    回到越国后，勾践卧薪尝胆，亲自耕种，与百姓一起生产、练兵，提升国力和凝聚力。范蠡向越王勾践推荐了政治精英文种，并对他说：“打仗和谋略这种事，文种不如我；但是治理民生，增加收入，我不如文种。”勾践就于是国政完全委托给文种，由他来
    处理国家大事。


    在 国家 建设上，范蠡向勾践提出了一系列建议：在农业上，劝课农桑，积攒谷米，不在农时征百姓服劳役，不滥用民力；在吏治上，罢黜危害百姓的官，重用百姓爱戴的官；在军事上，重视士兵训练，提高士兵战斗力，组织专门攻坚的死士。为了进一步麻痹吴王夫差，越国经常送重礼和美女，使得夫差以为越国已经完全成了臣服于自己的附属国。


    时间就这样过了一年又一年。越王勾践准备讨伐吴国报仇，但遭到了范蠡的反对。范蠡认为，越国必须达到“十年生聚”这一理想目标，成为真正的强国，不然无法一举击败吴国。两年后，吴国进攻齐国，夺取艾陵。当时，吴国君臣已经起了嫌隙，夫差杀了名臣伍子胥。这让越王勾践看到了报仇的机会，急切地问范蠡：“现在是报仇的时候吗？”范蠡依旧持否定态度。


    前482年，吴王夫差率领精锐的大军到达黄池，与诸侯会盟，国内由太子留守，防守的只有老弱残兵。勾践又问范蠡：“现在可以报仇了吗？”范蠡回答：“是时候了。”从此时开始，范蠡辅佐越王勾践以蚕食的方式，一步一步削弱吴国。趁着吴国空虚，越国发兵攻击。正被诸侯们奉为霸主而飘飘然的夫差，得到消息后虽然恼怒，但也没有办法，只好秘密让人带着一笔巨款到越国请求罢兵。越国不敢轻视吴国的强大实力，便同意了他的罢兵请求。越国的这一次进攻带有试探的性质，吴国没有反击而是送钱，这证明双方的实力已经发生变化。'
  merge: -1
  img_proc: true
- pgno: 157
  md: '前478年，越国讨伐吴国，两军激战于吴松江，吴军战败。这是越国第一次面对强敌时取得胜利。三年后，越国已经彻底压过吴国，对吴国大举用兵，但围而不攻，使得吴国大军溃散。又过了两年，在范蠡的指挥下，越军杀进吴国，夫差自杀，吴国灭亡。


    在越国的复国与复仇之战中，范蠡堪称第一功臣。在群雄称霸中，他又辅佐勾践扬威东方诸国，压了晋国、齐国等一头，成为春秋时期最后一位霸主。然而，范蠡不久便辞官而去，临走前给大夫文种留下一封信，希望他能和自己一起离去。文种很不理解范蠡的做法，如今功业已成，正是享受富贵之时，为何要离开庙堂呢？过了不久，越王勾践赐予文种一柄宝剑。文种仔细一看，正是当年吴王夫差赐予伍子胥自尽的“属镂剑”。此刻他明白了勾践的意思，后悔没有早听范蠡的话，只好拔剑自杀。


    范蠡离开越国后，渡海到了齐国，改名鸥夷子皮。由于善于治理产业，他很快就成了一个大富翁。齐国人觉得他很贤明，就将他推荐给齐国国君，让他担任相国。范蠡叹息着说：“居家就能达千金之富，居官就能做到卿相，这是普通人所能达到的极点了。一个人拥有财富又享有盛名，这是不祥的。”因而他尽散家财，将其分给邻居和乡党，然后辞官离去了。


    范蠡到了陶这个地方，自称陶朱公，做起了生意。没过几年，他又成了一个超级大富翁。后世，陶朱公被神化为财神。范蠡善于谋略、经营，为官能做到仕途的极点，经营产业则很快就能富可敌国。他一生三次散尽财产，离开官场，并不是奉行消极的人生哲学，而是从盛名之中退出。正因如此，他才能在春秋乱世中保全身家性命，安然无虞地度过一生。'
  merge: -1
