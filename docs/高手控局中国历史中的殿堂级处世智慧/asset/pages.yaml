- pgno: 121
  md: '# 汉文帝：如何解决既要面子又要维护公义的两难问题


    尊严这种东西，你得有实力捍卫；否则，那就是死要面子活受罪。


    刘恒的母亲薄氏，因为不得汉高祖刘邦的宠爱，所以跟着刘恒去了封地代国，成了代国的王太后。薄氏的弟弟名叫薄昭，没有什么好名声，加之薄氏家族人丁单薄，故而显得比较弱小。


    汉高祖的老婆吕后死后，大臣们联合起来除掉了吕氏家族，准备从刘邦年长的儿子中选一个立为皇帝。本来齐王刘襄很有希望，但是刘襄的舅舅家势力很大，大臣们畏惧再出来一个强大的外戚集团，所以只好放弃。这样一来，代王刘恒就成了候选人，也就是汉文帝。


    汉文帝和舅舅薄昭下棋，规矩是谁输了，谁就喝一盏酒。薄昭是个棋臭篓子，连着输了好几回。他身后的郎官（侍从官）负责给他倒酒，就护着自己的主子，倒的酒总是浅一点，不倒满杯。汉文帝的郎官看不下去了，大声斥责薄昭的郎官。薄昭非常生气，但是在汉文帝面前忍而不发。等汉文帝的郎官下班了，薄昭便派人守在他必经之路上，一记闷棍将他打死了。


    汉文帝得知真相后非常生气。虽然薄昭是自己的舅舅，但法律是国家的公器，他也不愿徇私。可是按照规矩，刑不上大夫，更何况薄昭是皇亲国戚，普通的司法官员根本不敢给他议罪。


    汉文帝的母亲这时候已经从王太后变成了皇太后，别说官员们不敢惹她，就是诸侯王们也对她能让三分。不治舅舅的罪，就无法体现法律公平，法律不公平，就不能真正地实现理想的仁政。汉文帝想让舅舅悔罪，就派了大臣去陪薄昭饮酒，并直白地告诉他，希望他能自裁谢罪。薄昭仗着自己是皇太后的弟弟、当今皇上的舅舅，根本不把大臣的话当一回事儿。


    汉文帝见舅舅不上道，只好出了一个“怪招”。他让大臣们穿上孝服，去薄昭的府上吊孝。薄昭家没有人去世，却来了这么一帮人吊孝，其目的不言自明。薄昭明白了汉文帝的意图，只好自尽了。这下演戏成真，汉文帝的目的也达到了。'
  merge: -1
  img_proc: true
- pgno: 122
  md: 读正史，我们往往以为汉文帝是仁爱儒雅、方正廉达的君主。殊不知，作为统治者，他有着突破常规观念解决问题的能力，往往会从人们想不到的角度，达成一个本应该正义的目的。当然，汉文帝的做法，既维护了法律的严肃性，使薄昭受到应有的惩罚，也维护了其母薄太后的尊严。如果皇舅被判极刑，下诏处死，汉文帝的威望也会受到冲击。他用这种异于常人的思维方式，解决了一个两难问题。
