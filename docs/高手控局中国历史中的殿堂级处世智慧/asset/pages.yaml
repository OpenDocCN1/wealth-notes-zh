  md: '# 毛遂：一针见血的力量


    > 内心焦虑的人更容易被说服，如果他没有焦虑，就给他制造一些焦虑！


    赵孝成王八年（前258），秦国大军围攻赵国都城邯郸。赵国公子平原君赵胜打算去楚国求救，建立合纵联盟，一起对抗秦国。他打算给自己的使团凑齐20个人，可是勉勉强强才凑了19个能入眼的。这时，一个名叫毛遂的人请求加入使团。赵胜见这个人有点儿面生，就问道：“先生来我门下多久了？"


    毛遂答：“三年了。”


    赵胜说：“有能力的人，好比锥子放在布袋中，会脱颖而出。你来我门下三年了，没见有人称道你的优点，也没看到你有什么好的表现，你还是算了吧。”


    毛遂答：“我今天正是请求你将我放在布袋中，若是早日在布袋中，别说锥子尖露出来，只怕锥子柄都冲出来了。”


    要想发挥一个人的才能，你得给他提供展示的平台。被置于无事可做的环境，纵然是管仲再世，也不会有所建树。毛遂的话，抓住了要害。于是，平原君赵胜立刻让他加入使团。赵国使团来到楚国后，平原君赵胜就向楚考烈王陈说合纵。两人从早上谈到中午，楚王依旧拿不定主意。这时站在台阶下的毛遂实在忍不住了，握着剑柄走上台阶，对平原君说：“合纵之事，两三句话就能说清楚，你们怎么谈了大半天呢？”


    楚王看到平原君使团的随员跑来插话，十分生气，呵斥毛遂说：“我在和你的主君谈话，你跑来干什么？"


    毛遂按着剑柄说：“大王呵斥我，是因为楚国地盘大、人口多，现在我距离大王只有十步，人多势众发挥不了作用，我片刻间就能取大王的性命。既然我的主君坐在席上，你为何要呵斥我呢？我曾听说，商汤只有70里的土地，但能称王于天下；周文王只有百里的土地，但能使诸侯向他臣服。这难道是因为他们人多地大吗？这是因为他们擅长利用形势来发挥自己的力量。如今，楚国土地广达5000多'
