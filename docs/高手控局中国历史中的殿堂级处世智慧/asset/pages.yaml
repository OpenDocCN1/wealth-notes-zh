- pgno: 7
  md: '天性不足：其一，缺乏战略性人才，不能对整个社会形势进行整体判断；其二，缺乏执行人才，无力开拓新局面；其三，缺乏公关人才，无法在诸侯中争夺话语权。


    刘邦最先得到的是公关人才。当他的大军到达砀郡时，一个自称高阳酒徒的狂生来拜访他。此时自以为已是一方诸侯的刘邦却不甚在意，一边让两个美女伺候自己洗脚，一边接待来客。高阳酒徒郦食其十分不满，阴沉沉地问道：“你是想帮助秦朝打诸侯，还是想率领诸侯推翻秦朝呢？”


    刘邦很愤怒，天下人都知道他是反秦的，岂有帮助秦朝的道理？因而，他激烈地斥责了郦食其。郦食其当即怼了回去，认为这不是一个人对待长者应有的态度。这时候，刘邦身上的草根精神就显露出来了，态度来了个一百八十度的大转弯一向郦食其认输。对于草根来说，面子不是最重要的，只要你能帮助我，我就将你纳人我的旗下。


    郦食其是刘邦手中最强的公关人才，有着战国时期纵横家的风采。正是因为他，刘邦才能在诸侯中纵横捭阖、应对自如，不必再一座城市、一座城市地厮杀，就赢得了大小势力的支持。郦食其凭借其三寸不烂之舌，说服秦朝的武关守将放弃抵抗，从而使刘邦率先进入关中，可谓一言胜过百万兵。


    刘邦得到的最重要的人才，还有被称为“汉初三杰”之一的张良。正是张良，为他打开了战略布局。为什么必须是张良呢？沛丰集团里没有这样的人吗？还真的没有。萧何、曹参等人的才能当然也都不低，但他们属于平民精英，缺乏进行顶层设计的政治眼光。张良出身韩国贵族，祖上数代为相，从他出生的那一刻起，就在为成为高层管理者做着准备。只是张良虽然和刘邦有较深的渊源，但是他一直谋划复国，始终追随韩王成，所以刚开始并没有真正加入刘邦的团队。直到韩王成在彭城被项羽所杀，他才归于刘邦。一方面，他运筹帷幄之中，决胜千里之外；另一方面，他辅佐刘邦驾驭各方势力，为自己所用。紧接着，刘邦又吸纳了战略性人才陈平。


    当然，如果没有优秀的执行人才，刘邦仍旧不能成就帝王之业，这就不得不说到韩信。韩信是典型的开拓型人才。张良制定的战略布局，是由韩信实现的。在刘邦的团队中，韩信是唯一能够率领大兵团作战的人才。为什么这么说呢？冲锋陷阵，斩将夺旗，樊哙就可以；率领一军，夺取一城，曹参能做到；但是要率领百万之师，协调多个'
  merge: -1
  img_proc: true
- pgno: 8
  md: '军团，同时解决管理与作战问题，屡出奇谋，大破强敌，则非韩信不可。他攻魏、灭代、破赵、挟燕、掠齐，为刘邦消除了最多的敌人。这也是“汉初三杰”中萧何、张良被封侯，而韩信被封王的原因所在。


    回过头来，我们再说说说沛丰集团。对于刘邦来说，这个具有乡党性质的团队最重要的一点就是忠诚和可靠。在刘邦最困难的时候，这个团队里的人没有放弃他。萧何是他的财务总监和后勤部长，为他的每一场战争提供了财力支持、后勤补给和兵员供应，故而即便战争失败了，刘邦也能尽快回血。曹参是沛丰集团中罕见的既能率领兵团作战又具有管理能力的综合型人才，曾攻破两个诸侯国，夺取120多个县，为刘邦立下了赫赫战功，后来还继任萧何做了丞相。至于周勃、樊哙、卢绾，他们都是能打的战将，可确保刘邦拥有一个稳固的、以自己为核心的军事集团。


    在刘邦的团队中，人们往往忽略文人集团。刘邦年轻时虽然讨厌儒生，并且多次戏弄他们，但在成就帝业的过程中，对儒生却十分礼遇。除了郦食其外，陆贾、叔孙通都是儒者，他们为刘邦构建了称帝后的礼法框架。刘邦称帝后，陆贾曾屡次引儒家经典说教。对此，刘邦撇泼地说：“我马上打得天下，要诗书何用！”陆贾立刻怼了回去：“马上得到天下，岂能在马上治天下！”就像当年面对郦食其的批评一样，刘邦再次展现出创业家的胸襟，接受了陆贾的一系列建议。


    在与最大的竞争对手抗衡之前，刘邦几乎笼络了所有能笼络的势力，包括那些曾背叛过他的人。赵王张敖、淮南王英布、燕王臧荼、梁王彭越、长沙王吴芮……这些人有的很早就起家了，具备成为一方诸侯的实力，如彭越；有的是敌方阵营的将军，如英布。但只要是在后面捅项羽的屁股，或者在肋下给他一刀者，刘邦都视其为自己阵营的人。其目光之长远，用人之不拘一格，远胜项羽。举凡诸侯王、纵横家、策士、儒生、出身低微的贩夫走卒，杂而用之，可以说是刘邦最终获得成功的重要原因。'
