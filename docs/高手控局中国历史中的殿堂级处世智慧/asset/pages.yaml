- pgno: 3
  md: '# 序


    处世之学，反映了人的格局。


    中国古代史上有大量有趣、有料、有胆的故事，展现了古人的话术、见识、谋略，以及对人性的洞察和解决实际问题的能力。这些故事从表面上看是“术”，但实质上是“道”。如《孟子·公孙丑上》中说：“虽有智慧，不如乘势；虽有镃基，不如待时。”对形势的分析与把握，远比盲目的行动更加重要。这就好比一个农夫，尽管身强力健，拥有充足的农具，但由于不懂得把握时令物候，所以无论怎样辛勤劳作，所获都会十分有限。孟子所说的“乘势”与“待时”，狭义上可以理解为借势与等待合适的机会，广义上则包含了更丰富的内容。“势”可以是知识储备、社交魅力、口碑影响、人力资源、自身建设，“时”则是机遇、关键点、客观条件，等等。


    我们与古人的生活环境虽然迥异，但就人性而言并无多少不同。处世之学，总的来看有三种关系：其一，如何自我管理；其二，如何与他人交往，建立有清晰边界的人际关系；其三，如何与这个世界相处。


    以自我管理为例：一个人犯了错之后，他有没有纠错能力、纠错周期是多久，决定了一个人的路可以走多远。本书中讲的曹操宽宥了反叛两次的张绣，其实就是为张绣提供了自我纠错的机会，让他从自己身上找问题。与他人交往的能力，决定了人的事业边界。古代著名的创业家，如汉高祖刘邦、蜀昭烈帝刘备、晋宣帝司马懿（追封），都是著名的交际大师。他们在创业过程中结交了大量的优秀人物，并将合适的人才引入自己的团队，从而拓展了自己的事业版图。另一些有生存智慧的人，则能在复杂的局势中，依靠对人性的洞见和对社交圈子的布设，改变自己的命运，实现生命突围。《黄帝内经》中所述“行不欲离于世，举不欲观于俗”，说的就是我们与这个世界相处的方法一人的行为虽不能脱离于世俗，但是在行动上要有自己的认知，不落褒白，不陷俗套一这就是高手。成事者，通常能做到和光同尘，但又有独立的见识，打破常规思维。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '当然，作为在复杂社会中生存的普通人，我们往往要用半生甚至更多的时间去参透和领悟种种处世之道。不过说到底，我们仍旧要在俗世中提升自己的修为。《资治通鉴》中指出：“才者，德之资也；德者，才之帅也。”一个人的才与德，是他安身立命、成就事业的根本，是拥有交际、成就事业、解决问题、吸引他人和领导他人的核心力量。


    某电影中有一句经典台词：“见自己，见天地，见众生。”这说的何尝不是处世安身、问鼎人生的大旨微言？


    是为序。


    二〇二三年四月四日于北京'
