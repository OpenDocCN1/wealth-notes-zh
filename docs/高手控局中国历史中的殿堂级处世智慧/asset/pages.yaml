- pgno: 34
  md: '# 左宗棠：为什么人人都看重我


    当你对他人的一切足够了解，能够深入他的领域，和他在各方面找到共同点、在同一层次上对话时，你才能真正与他产生联系。记住，人脉永远是近路。


    左宗棠是湖南湘阴人，虽然读书十分用功，但是中了举人之后，就再也未能更进一步。这是因为，左宗棠偏重于实用之学，而晚清的会试内容依旧走在八股的老路上，与其学术取向不尽一致。左宗棠虽然没有考上进士，但却以举人的学历，最后成为疆臣，建立了不世的功业，与曾国藩、李鸿章并称“晚清三大名臣”。


    要知道，明清以来，入阁必须是翰林，也就是进士中的头等，这几乎成了一条定律。左宗棠却以举人的学历进入内阁，成为大学士，这不但在清代的历史上罕有，在整个中国古代史上也是罕见的。他的身上真的闪烁着“主角光环”吗？


    左宗棠出身书香门第，他的父亲左观澜担任过知县。从6岁开始，他就跟着父亲在省城长沙读书。相较于八股之学，他更热衷于经世致用的学问，尤其喜欢读明人顾祖禹的《读史方舆纪要》、顾炎武的《天下郡国利病书》，把解决现实问题的学问当作毕生之学。19岁那年，父亲去世了，守孝的左宗棠听说长沙名士贺长龄在籍，便去拜访。


    贺长龄比左宗棠大27岁，是二品的布政使，但与这个青年有了一席谈话后，便连呼他为“国士”。原来，那本著名的实学巨著《皇朝经世文编》挂的是贺长龄的名，实际是魏源所编，左宗棠拜访他，等于找到了自家的门。


    贺长龄极力提倡经世致用之学，左宗棠的出现怎能不令他视若“国士”呢？当左宗棠谈及节衣缩食买书来读时，贺长龄痛快地表示：以后你不必买书了，想读什么书，来我的藏书楼取便可。此后，左宗棠成了贺家的常客。不论左宗棠提出读哪本书，他都亲自一级一级地登上狭窄的楼梯，把书取来交给这位年轻人，有时候还要上上下下跑好几趟。每次左宗棠来还书，两人都会就书中的内容畅谈半日。贺长龄叹息地说：“天将降大任于君矣，望季高（左宗棠的字）笃志践行之！'
  merge: -1
  img_proc: true
- pgno: 35
  md: '道光十一年(1831)，得到贺长龄关照的左宗棠来到长沙城南书院读书。这里的书院山长是贺长龄的胞弟贺熙龄，他同样是经世致用之学思想的践行者。城南书院位于蛤岭高峰，可以说是传播湖湘文化的中心。贺熙龄比左宗棠大24岁，翰林出身，曾担任湖北学政、山东道监察御史等职，虽然只教了左宗棠一年，但此后十年二人书信不辍，保持了终生的师友关系。他在名为《舟中怀左季高》的诗中写道：“九月湖湘水倍清，卷云亭上故交行。六朝花月豪端扫，万里江山眼底横。开口能谈天下事，读书深抱古人情。而今迈步从头越，莫叹前程未可寻。”同样出身湖南的毛主席，写过一首名为《忆秦娥·娄山关》的词，其中一句“而今迈步从头越”就出自此诗。可见湖湘文化精神影响之大。


    湖南巡抚吴荣光在长沙创办了湘水校经堂，贺熙龄便推荐左宗棠来这里是读书。吴氏不但是封疆大吏，而且是经世派的学者。他认为学子读书只偏重科举之学实为陋习，故而在学院里大力倡导通经史，用于治世的学问，树立起一股新学风。这对左宗棠而言，简直是如鱼得水。他的学习成绩极为优异，“书院膏火以佐食”，相当于获得了助学金，从此不用交学费，还有生活补助。


    左宗棠在校经堂的考试中多次获得第一，然而参加乡试时却落榜了。因为考官是八股文专家，不可能看上左宗棠的文章。巧的是当年正值道光帝五十大庆，要从落榜的人中作“搜遗”，也就是挑选遗落的人才。这样一来，左宗棠的考卷入了选。尽管考官对卷子内容仍有质疑，但是在吴荣光的坚持下，左宗棠终于位列举人。


    中举之后的数年里，左宗棠进京参加会试，但都与进士无缘。他的老师们却官运亨通，就连在北京考试时结识的好友胡林翼也中了进士。眼看左宗棠科场蹭蹬，他的老师们都觉得过意不去。吴荣光推荐他到醴陵漕江书院当山长，相当于书院校长。在这里，左宗棠遇到了他人生的另一位大伴—两江总督陶澍。


    道光十七年(1837)，陶澍回乡经过醴陵。如何安排这位湖南大佬的食宿，当地县令想得非常感谢周到，他请左宗棠专门在宿舍门上写了一副对联：春殿语从容，廿载家山，印心石在；大江流日夜，八州子弟，翘首公归。陶澍见了这副对联，击节称赞，派人询问对联是谁写的，要求立刻相见。陶、左二人一见如故，不知不觉聊到了天亮，从而成为忘年之交。左宗棠在写给友人信中曾说：“督部期望为近日疆臣第一，而虚心下士，至于如此，尤有古大臣之风度。”'
