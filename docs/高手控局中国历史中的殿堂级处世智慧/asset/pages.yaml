- pgno: 70
  md: '咸宁五年(279)，匈奴左部帅刘豹去世，刘渊回去奔丧，暂时代理左部帅。10年后，刘渊正式被任命为北部都尉，获得管辖一部匈奴的实权。期间，他将洛阳学到的知识用到部族管理中，申明法令，力倡公正，打击不法之徒，得到了下层牧人的拥戴。他轻视钱财，经常接济败落的并州士族阶层，得到了一大批士子的投奔。乃至幽州、冀州的名士都因为他的名望，愿意为他效力。


    永熙元年(290)，晋武帝司马炎驾崩。刘渊终于松了一口气，感觉架在自己脖子上的那把刀终于消失了。新继位的是著名的白痴皇帝司马衷，由外戚杨骏辅政。他们对刘渊缺乏正确的认识，直接授予他五部大都督，封爵为汉光王侯。


    西晋爆发“八王之乱”，司马氏诸王火并，再无暇顾及并州的事。匈奴五部的贵族们经常与刘渊书信往来，实际上已经收归在他的旗下。当时成都王司马颖（晋武帝第十六子）暂时控制了皇帝，获得了朝政大权，便任命刘渊为电骑校尉，后来又封他为冠軍将军，希望他能为自己效力。刘渊建议司马颖以邺城（今河北临漳）为根据地，像当年的曹孟德一样另外建都，独立发展势力，这样盘踞在洛阳的其他宗室力量就鞭长莫及，然后将各怀鬼胎的贵族分散击败。司马颖大喜，封刘渊为北部单于、参丞相军事，让他回并州召集部众。从此，刘渊开始放飞自我。


    刘渊回到并州的左国城（今山西离石）后，匈奴贵族刘宣立刻率领一千人拥戴他为大单于，聚集起能控弦的战士5万人。不久就传来司马颖战败，带着皇帝向洛阳方向奔逃的消息。刘渊跺着脚说：“司马颖真是个蠢材，不听他的话，但他与他有约定，不能不去救他。”刘宣等人立刻反对，认为司马氏家族兄弟相残，正是他们恢复呼韩邪（汉武帝时南匈奴单于）事业的机会。


    刘渊认为刘宣说得对。不过，他认为做呼韩邪那样的人，志向还是小了一点，要做就做出汉高祖那样的伟业，就算次一等也要能像曹操那样。他认为，刘备以益州的一州之地与天下抗衡，是因为打出了汉的旗号，得到了想光复汉王朝的有识之士的支持。他是汉朝皇帝刘氏的外甥，应该打出汉的旗号。


    元熙元年(304)，刘渊在南郊筑坛祭汉高祖刘邦、蜀汉昭烈帝刘备，追封刘禅为孝怀皇帝，自立为汉王，并设置百官与官署。乱成一'
