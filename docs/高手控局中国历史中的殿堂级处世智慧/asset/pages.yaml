- pgno: 75
  md: '言，同游汉代梁孝王园林遗址，期间遇到了另一位大诗人高适。都说同道中人拥有天然的吸引力，三人都胸怀大志、满腔报国抱负，再加上“三观”一致，所以相处得十分愉快。这次会面，让杜甫终生念念念不忘。


    天宝四年(745)秋季，李白和杜甫在鲁郡（今山东兖州）第三次相遇。两人同游山东、河北一带，纵马驰骋，赋诗饮酒。


    杜甫写了《赠李白》这首诗：


    > 秋来相顾尚飘蓬，未就丹砂愧葛洪。


    > 痛饮狂歌空度日，飞扬跋扈为谁雄？


    “飞扬跋扈为谁雄”把李白身上那种狂放的姿态描写得十分传神，可以说是描摹李白形象最经典的句子。李白也写下《鲁郡东石门送杜二甫》回赠杜甫：


    > 醉别复几日，登临遍池台。


    > 何时石门路，重有金樽开？


    > 秋波落泗水，海色明徂徕。


    > 飞蓬各自远，且尽手中杯。


    杜甫现存诗中有15首提到了李白，甚至在写给其他朋友的诗歌中也不忘问候李白。他在《春日忆李白》中写道：


    > 白也诗无敌，飘然思不群。


    > 清新庾开府，俊逸鲍参军。


