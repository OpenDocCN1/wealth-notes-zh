- pgno: 107
  md: '邓禹的话术水平很高，建立在他对问题的清晰洞察上。他用了三点来说服将领们：其一，兵在精而不在多，自己的精兵少，不能与敌人硬碰硬；其二，无论是前方还是后方，自己都没有补给，不能与有充足补给的敌人直接对抗；其三，敌人士气高涨，战斗意志强。他既说出了敌人的优势、自己的劣势，又分析出敌人的致命弱点，即缺乏长远的眼光，不能坚守。此外，他还给出了解决方案，即足兵足食，寻机歼敌。


    无论是面对领导还是下属，邓禹的谈话水平都可谓臻于化境，他不愧为古代史上有名的战略大师。'
