- pgno: 231
  md: '先人是指谁呢？一是指赵佗的父母和先祖，意思是不敢忘怀故国，也就是不能背叛祖宗的文化；二是指文帝的先人，也就是汉高祖刘邦，两人定有盟约，赵佗向大汉称臣，大汉认可赵佗家族的统治。在军事上，赵佗告诉文帝，他有抵抗汉军的资本；在道义上，他希望文帝保护好祖宗坟墓，善待他的族人，更重要的是继续认可他的地位。


    第三部分，赵佗说自己到南越已经49年了，现在是抱孙子的老人了，但是吃不好，睡不好，对音乐也没了兴趣。为什么呢？是因为没能侍奉大汉。他取消帝号，恢复原来的称号，希望和朝廷能像高祖时互通使者，保持密切的联系。之后送上了礼物清单。当然，这些礼物以土特产为主，对汉朝皇帝来说，象征意义大于实际意义。


    赵佗在这封信里表达的意思，汉文帝刘恒会接受吗？当然会接受。陆贾还因这次出使成功获得了文帝的嘉奖。


    赵佗从秦始皇时期就在南越为官，他一直活到汉武帝建元四年（前137），生命长达100多岁，是古代史中记载的著名的长寿人物。面对实力远在自己之上的强者，赵佗懂得示弱，但他的示弱不是一味地退让，而是以示弱的方式实现利益最大化。'
