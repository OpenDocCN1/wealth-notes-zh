- pgno: 84
  md: '田常委因子贡为使臣，赐给他车马和仆从，让他奔赴吴国见了吴王夫差。子贡说：“我听说大王您一直想称霸诸侯，显名于列国。现在齐国进攻鲁国，一旦它灭了鲁国，就会阻碍吴国的称霸脚步。您去营救鲁国，不但能遏制齐国，获得仁义的美名，还能对晋国敲山震虎，一举三得。”


    吴王夫差十分认可子贡的说法，但他担心吴国出兵之后，吴国的世仇越王勾践会在自己的背后插刀子，不如等他灭了越国之后再去救援鲁国。


    子贡摇摇头说：“您灭了越国，只怕鲁国也会被灭了。您担心越国背刺，可以让越国一起出兵，这样越国剩下的兵少，就掀不起什么大浪了。”就这样，子贡又充当吴王的使臣，奔往越国。


    越王勾践一见子贡，就问道：“不知先生来有何见教？”


    子贡说：“我是来救您的。”


    越王请子贡说得详细一些。


    子贡说：“我请吴王去救援鲁国，可是他担心您在背后袭击他，准备先灭了您再去援鲁。”


    越王大惊失色，跪下来对子贡说：“还请先生指教。”


    子贡说：“吴国国君夫差暴虐不仁，他不肯听忠臣的话，受到奸邪的引诱，连年征战，百姓痛苦不堪。吴王好大喜功，您将丰厚的礼物送给吴王，请求他出兵，并承诺您会协助吴国，这样他就对您没有疑虑了。等他东征后，和齐军大打一仗，如果打输了，损兵折将，您就有了复国和报仇的机会。如果吴国击败齐国，一定会去向晋国展示军威，我去说服晋国，劝说晋君收拾吴王。吴军刚和齐军血战，又和强大的晋国作战，必败无疑。这样吴国的国力下降，您就能灭了它。”


    越王接受了子贡的建议，派大夫文种带着大量礼物拜见吴王，并将一支军队交给了吴王。吴王大喜过望，率军东征。另一边，子贡又充当越国的秘密使臣，到了晋国。他对晋国的君臣说：“吴国东征齐'
