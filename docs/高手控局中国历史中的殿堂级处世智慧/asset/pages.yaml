- pgno: 232
  md: '# 光武帝刘秀：开创二元体制的权力模式


    且视他人之疑目如盏盏鬼火，大胆去走你的夜路。


    新朝的王莽政权被推翻后，更始帝刘玄登上皇位。由于对建立大功的刘演、刘秀的猜忌，更始帝为了削弱二刘的影响，杀了时任大司徒的刘演，但为了安抚刘秀又晋封其为破虏大将军、武信侯。此时的刘秀十分惶恐，担心屠刀会降临在他的头上。要摆脱危机，只有一个办法，那就是离开都城，发展自己的势力。当时“更始政权”并未获得地方上的认同，黄河以北的州郡还持观望态度，光禄勋刘赐建议让刘秀招抚河北，但遭到大司马朱鲔的反对，他认为这是放虎归山。刘秀迫切地想得到这个外放的机会。


    主簿冯异建议刘秀厚加结交左丞相曹竟及其子曹翜。曹翜担任尚书，在更始帝刘玄面前很有影响力。果然，刘秀得到了这个外放机会，被任命为大司马，赴河北慰抚。刘秀渡过黄河后，率领自己的班底开拓地盘，但是他的处境十分困难。


    西汉宗室后裔刘林（西汉赵缪王之子）、赵郡豪族李育，在邯郸拥戴一个名叫王昌（又称王朗）的人称帝。这个人自称汉成帝的儿子刘子舆，还得到了河北的另一家汉室王族广阳王之子刘接的认可，遂起兵响应。这样一来，在河北也出现了一个朝廷。为了和刘玄的汉朝区别，被称为“赵汉”。刘秀准备暂离河北，得到上谷、渔阳两郡的支持后，才站稳了脚跟。不过，要完全把河北变成自己的地盘，刘秀还需要一个盟友，那就是真定王刘扬。刘扬是汉景帝的七世孙，世袭王爵，拥兵十余万，他也支持邯郸的赵汉皇帝王昌。刘秀需要将他拉过来，为自己所用。为了搞定刘扬，刘秀亲自去了真定王府，向刘扬的外甥女郭圣通用求婚。通过联姻，刘秀取得了刘扬的支持，在南柔之战中击败王昌，彻底得到了河北。


    刘秀的创业团队，由一个庞大的功臣集团组成。由于他们主要来自南阳，故而称为“南阳贵戚”。称帝后的刘秀需要平衡皇权与功臣集团之间的关系。他采取的方法是扶植外戚，也就是给皇后家族加官进爵，让他们进入朝堂，避免功臣占据全部政府席位。皇后郭圣通的背后是真定王刘扬，虽然刘扬在建武二年（26）谋反被诛，但刘秀并未株连皇后背后的势力。'
  merge: -1
  img_proc: true
- pgno: 233
  md: '事实上，刘秀与郭圣通的婚姻是一场彻头彻尾的政治婚姻。他并不喜欢郭圣通，他的真爱是阴丽华，即他的原配妻子。还是太学生时，刘秀就发出了“娶妻当得阴丽华，为官当作执金吾”的赞叹。但他需要一个微弱的平衡，因而直到建武十七年(41)，也就是光武帝称帝后的17年，他才决心废后。


    在没有培植起新的足以平衡朝堂功臣集团力量之前，废后意味着自断羽翼，所以光武帝只是将郭皇后移出中宫，并未动摇郭家所代表的势力，反而是进一步加强了他们的势力。他封郭圣通的弟弟郭况为节侯，从兄郭竟为新都侯，从弟郭匡为发干侯，就连郭家女婿陈茂也被封为南侯。阴丽华被册封为皇后，其子刘庄被立为太子，光武帝开始培植阴家的势力。


    西汉亡于外戚王莽，为何光武帝不吸取这一教训，打压外戚势力，反而培植其力量呢？这是因为，光武帝刘秀面对着和汉高祖刘邦一样的处境。王朝建立后，皇帝发现自己面对一个更加严峻的问题—功臣集团。当年汉高祖建立西汉，就是以吕后的外戚集团来平衡功臣的势力，但是吕后一死，大臣们联合起来打着扶立汉室的旗号诛杀了吕家的势力，就连嫡长子汉惠帝刘盈那些年幼的孩子也被全部杀掉，迎立外藩的代王刘恒即位，是为汉文帝。这是典型的杀嫡立庶。虽然它被史学家们写成了正面典型，但身为皇帝的刘秀未必这么看。


    功臣集团的威胁性，还可从下面的事例中看出。建武十五年(39)，进行土地清查时，地方官员进京述职，刘秀看到陈留的官员上呈的木牍上写着“颍川、弘农司州，河南、南阳不可问”，他不明其意，向官员询问，官员也说不清楚。这时刘秀12岁的儿子刘庄说：“河南是帝城，南阳是帝乡，这里是跟随父皇您的功臣们的故土，大量田地
    被抢占，官吏怎么敢过问呢？”刘秀找来当地官员询问，果然如此。功臣们仗着跟随皇帝打下天，爵位高，在家乡强占大片土地，自然不乏为非作歹者，地方官连税都不敢征收。刘秀不愿像汉高祖刘邦那样血腥地处理功臣，这样处理的代价很大，他虽是皇帝，也未必有胜算。最好的方式当然是政治手段，何况他是这方面的高手。


    皇后阴丽华的弟弟阴兴担任黄门侍郎，兼任守期门仆射，管理皇宫卫队，后来又被赐爵为关内侯。建武二十年(44)刘秀病重时，甚至想任命他为三公之一的大司马，但阴兴认为自己德不配位，刘秀才作罢。阴丽华的异母弟阴识被封为阴乡侯，担任能与皇帝接近的侍中，负责京城安全的执金吾。皇后最小的弟弟阴就
    被封为信阳侯，阴'
  merge: -1
  img_proc: true
- pgno: 234
  md: '就的儿子阴丰娶了光武帝的女儿酃邑公主刘绶。光武一朝，外戚阴家一门五侯，阴家推荐的人，光武帝都任命他们为州郡的主官，多达十余人。阴氏成了东汉仅次于皇帝的显赫家族。


    光武帝明面上是权力的最高掌管者，但为了平衡与功臣的关系，他实际上建立了一个与皇后家族共同掌权的二元体制。这一点深深地影响了东汉政权。汉明帝刘庄即位后，进一步限制了功臣集团，但为避免外戚集团坐大，所以对母族阴氏和前太后郭圣通家族一视同仁，继续重用功臣的代表邓禹家族，在宗室、外戚、功臣、官僚之间寻求平衡。他将皇后马氏的兄弟也都封了侯。马廖为顺阳侯，官至九卿之一的卫尉；马防为颖阳侯，官至光禄勋；马光为许侯，后来也担任了保护皇帝安全的卫尉。


    整个东汉一朝，阴、马两皇后的家族权力很大，但因为皇后极力限制家族势力扩张，皇帝的平衡也做得很好，所以问题并未凸显。汉恒帝的皇后窦妙，汉和帝的皇后邓绥，汉安帝的皇后阎姬，汉顺帝的皇后梁妠，并无限制自己家族的觉悟，在皇帝去世后，她们直接控制了朝政大权，并让自己的家族渗透到皇位传递中，导致外戚与宦官争权，政治越来越糜烂，最终汉王朝覆灭。


    刘秀创立的二元体制，寻求外戚与功臣的平衡，避免了血腥争夺，在明帝、章帝、和帝时期都起了很关键的作用。对于东汉王朝而言，它的确是有效的，但在皇权体系下，也有其弊端。与其他王朝相比，作为创业者，刘秀应该算是最擅长处理与功臣关系的领导者了。


    优秀的领导者，具备了以下六种能力。一是拥有前瞻性的目光，拥有制定组织发展战略的能力；二是有感召力，能够做到公平和公正，对团队成员有精神上的吸引力；三是有影响力，在事业发展中，威望足以服众；四是有决断力，面对智囊团队提出的各项建议，能够采纳正确的建议；五是有控制力，在目标实现过程中，能够驾驭团队朝着目标前进，并获得成功；六是有不怕输的坚韧力，无论遇到怎样的困难，都百折不回、迎难而上，成为勇敢的带头人。很显然，刘秀是具备以上六种能力的领导者。'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 曹操：风险控制与纠错能力


    风浪在所难免，我们能做的，就是不要在同一条河里、被相同的风浪掀翻两次。


    东汉建安元年（196），曹操将汉献帝迎到许昌，从而开始他“挟天子以令诸侯”，扫荡群雄的征程。作为创业家，在人情方面他非常注意以下两点。一是人脉关系中的风险控制；二是犯错以后有没有纠错能力，纠错周期是多长。


    定都许昌，是曹操事业的重大转折点。他打着天子的旗号，师出有名，行兼并和诛灭之实。从创业者角度来说，这就是市场拓展。


    抛开后来人的上帝视角，把曹操放在当时的历史版图上看，他只是创业者之一，是否能够成功，还是未知数。当时袁术在淮南根基稳固，兵多将广，准备称帝；孙策脱离了袁术集团，在江东攻城略地，有了自己的基本盘；吕布占据徐州，窥伺曹操；袁绍在河北与公孙瓒酣战，高歌猛进，拓展市场；董卓部将张济的侄儿张绣占据了宛城，并与荆州刘表结盟，像一柄利剑直刺曹操的肋骨。


    面对众多的割据势力，就轻重缓急而言，曹操决定先拿下宛城，折断顶在自己下肋的那把利剑。解决宛城问题有两种方式，一是招降，二是战争。招降是最好的方式，不用损失人马，而且能减少钱粮损耗，但招降是需要资本的，招降后的内部整合也是一个大问题。


    建安二年（197），曹操率领大军进驻淯水（今称白河）。张绣见曹操兵容甚盛，器械精良，自度不是对手，率众投降曹操。曹操进驻宛城后，举行酒宴款待张绣的文武官员，这实际上是彼此表达诚意的好机会。


    通过酒宴，双方确认了自己的位置。曹操虽是赢家，但创业不可能是一个人打天下。张绣作为地方豪杰，不但有卓越的军事水准（人才管理能力和市场运营能力），还有人马。曹操收降张绣，一方面要让张绣为我所用，另一方面要把张绣的人马整合进自己的团队。反过来，张绣投降曹操，也是有条件的。一是自己能否得到曹老板的信任，二是自己能够获得多大的利益。以上这些，都不可能拿到明面上说，要在人情世故上体现。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '整个酒会上，曹操行酒时，猛将典韦始终手持一柄斧刃超过一尺的大斧不离曹操左右，搞得张绣的文武官员无人敢仰视，都是低着头向曹操敬酒。在气势上，曹操就压住了张绣的将领们。


    从风险控制的角度来说，曹操给了张绣的属下一个心理暗示，那就是不要有异心，不然没有好果子吃。再说，未投降之前，宛城城高池深，张绣的兵力也以一博十，有主场优势。一旦投降，已经丧失这种优势，剩下的只是在新老大那里获取好的位置而已。这就要看每个人的姿态了。


    所以，曹操向张绣的文武官员敬酒，实际上是摸底，而张绣的文武官员向曹操敬酒，则是输诚。如果双方都朝着这个方向努力，张绣集团能够很好地被曹操整合。不过，只要是入，就有弱点，只要有弱点，在人情上就绝不可能滴水不漏。


    张绣集团原来的领导者是张济，张济死后，遗孀邹夫人被张绣视为母，得到了极好的照顾。坊间有一个段子，说曹魏父子（曹操、曹丕）爱人妻，江东君臣（孙策、周瑜）爱萝莉。曹操爱人妻，要张济遗孀邹氏为妾就是实锤之一。张绣跟了曹操，固然是政治上的投靠，从个人关系上说，是上下级关系，但不是主子和奴隶的关系。上下级关系中中间有一条基本线，就是上对下仁、下对上忠。主奴之间没有这条线，主一对奴隶是生杀予夺，予取予求。


    曹操在还没有彻底将张绣的基本盘整合进自己的团队时，这么做实际上是打破了张绣的底线。接下来发生的事，更是让张绣嗅到了阴谋的味道。张绣手下有一名将领叫胡车儿，以割悍善战著称，曹操私下给胡车儿送金银，这是典型的收买行为。按照朝廷法度（曹操代天子出征，代表的就是朝廷法度），曹操对投诚者封赏，是要公开的、自上而下的，或封官，或赐爵。私下给级别较低的官员封赏，意味着对投诚者的领导不信任，是为了架空做准备。


    张绣将自己的疑虑告诉了谋士贾诩，贾诩建议他袭击曹操。贾诩认为，曹操兵不血刃，没有付出任何代价就招降了张绣，低估了张绣的实力，故而对张绣缺乏重视，甚至是轻视他。在这个前提下，张绣集团的文官武将也不会获得重视，得不到该有的尊重。张绣反水，既有人囚因素，也有群众基础。张绣奇袭曹操，将他杀得措手不及，衣甲都没有穿好，就上马逃窜。猛将典韦、曹操长子曹昂、侄儿曹安民都被杀，曹操大败而去。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '此次征张绣，开场极佳，结局惨败。建安三年(198)三月，曹操第二次征张绣，率军包围了张绣的驻地穰城。不过很快就传来袁绍企图趁虚而入夺取许昌的消息，曹操将信将不信撤军。张绣的斥候立刻传来情报，张绣下令追击曹军，同时特意报与刘表共享，让刘表出兵夺取曹众，断了曹操的退路，前后夹击，试图灭曹。


    曹操早已料到这一点，分兵出击，击败了张、刘的联军，随即快速撤退。这次，张绣亲自率精锐追击曹操，谋士贾诩苦苦劝谏张绣不要追击，但张绣不听，结果被曹操击败。张绣收拾被击溃的士兵，退回军营后，贾诩建议张绣立刻再追击。张绣当即领兵再追击，结果击破了曹操殿后的军队，获得了很多战利品。


    事后，张绣问贾诩：“为何我不听你的建议追击会失败？我已经失败了，你又劝我追击，却能获胜呢？”


    贾诩说：“表面看，这是军事上的胜利，其实不过是人心罢了。曹操击败您和刘表的联军，快速北撤，为了安军心，必定会亲自殿后。将军您虽然善战，但并非曹操的对手，所以追击必定失败。曹公虽然赢了，但却不尽全力回击，肯定是后院起火。他以为我们败了就不会再组织二次追击，因此留下他人殿后。此时，获胜之军必定骄傲，殿后也就松懈了。因此，将军再去追击，就能获胜。”


    张绣对贾诩的判断大为钦佩，自此对他言听计从。


    曹操回军对付袁绍，本着“敌人的敌人就是我们的朋友”的原则，两大集团都动手拉拢对方的敌对者。建安四年(199)，袁绍派人招降张绣。客观地说，袁绍的这次招降是做了充分工作的，他知道贾诩对张绣的影响力，因而极力讨好贾诩。不过，当张绣准备投诚袁绍时，贾诩却当着张绣的面拒绝了袁绍的使者，劝张绣投降曹操。他给张绣分析了投袁的劣势，袁绍虽然兵多将广，谋士众多，但是气量狭小，不能容人。张绣投降袁绍，不过是锦上添花。投降曹操则有三点好处，其一，曹操奉天子号令讨贼，师出有名；其二，曹操处于弱势，正是用人之际，您去了是雪中送炭；其三，曹操胸襟广阔，能够不计前嫌。


    张绣接受了贾诩的建议，归顺了曹操。前面说过，人是有弱点的，并不是不犯错，而是犯了错有没有纠错能力，纠错的周期有多长。曹操在征宛城时轻视张绣，并突破了张绣的底线，因而招致失'
  merge: -1
  img_proc: true
- pgno: 238
  md: '败。几次与张绣作战，也没有占到便宜，这让他意识到张绣的价值。因而当张绣第二次投降时，他拉着张绣的手，示以亲和，而不是威慑。为了取信于张绣，他还让儿子曹均娶了张绣的女儿，两家联姻，并且奏朝廷，封张绣为扬武将军。毫无疑问，这是一次非常成功的纠错。张绣此前伤害过曹操，因而在官渡之战中与袁军作战十分卖力，立下了大功。曹操也奉着有功必赏的原则，奏请朝廷封张绣为“破羌将军”。


    可以说，二次招降张绣，是曹操自我纠错的一个典型事例。此事成，则有心投降曹操的割据势力心理压力大；此事败，曹操统一北方的阻力会变大，甚至影响事业发展。如何将张绣集团彻底整合进自己的团队，表面上看是考验曹操的用人智慧，本质上是对人之常情的把握。这一点其实不难，那就是曹操如何对待张绣。建安十年(205)，张绣追随曹操大破袁谭后，曹操将张绣的食邑增加到2000户，在诸将中位居第一。至此，张绣手下的精锐尽归曹操，像贾诩这样的战略人才也归入曹操麾下，成为曹操五大谋士之一。张绣追随曹操作战，直到建安十二年(207)在征乌桓的路上病逝，也算是鞠躬尽瘁。


    在曹操对张绣的“相爱相杀”背后，贾诩这个人物很容易被忽略，实际上他不但是“张绣投曹”背后的推手，还是“奠基三国”的操盘手。靠着对人性的通透理解，进入曹操阵营后，他收敛锋芒，一步一步扶持曹丕，从世子成为魏帝。贾诩本人，最后官至太尉，晋爵寿乡侯，是曹操五大谋士中地位最高的。'
