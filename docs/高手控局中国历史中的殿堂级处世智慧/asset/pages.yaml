- pgno: 150
  md: '同样的套路，前篇中的蜀王上了钩，而卫国国君却能避免厄运。换一个角度，用不同的眼光来看，结果就大不同。


    同样是做局，秦惠文王成功了，智伯却失败了。这也提出了一个问题：谁才是真正的智者？那些洞悉人性的人，才是真正的智者。现代商业竞争也是如此，它考验的是人性。有了智者领航，胜负在没有开战时就已经决出来了。'
