  md: '里，披甲执锐的士兵多达百万，这样的力量足可称雄于天下。可是秦将白起一来，楚国第一仗就丢了郢、郢两座大都市，第二仗被烧了夷陵，还毁掉了祖宗的陵墓和祭庙。这是巨大的耻辱、万世的仇恨，大王您却无动于衷，不知何为羞耻，竟然和我的主君谈合纵谈了半夭。合纵能给楚国带来最大的好处，您还犹豫什么呢？
    ”


    毛遂的话一针见血，戳到了楚王的痛处，同时也将合纵结盟的意义说得透彻明白，犹如当头棒喝，可谓醍醐灌顶。楚王当即表示，要与赵国结盟。


    毛遂立刻命令左右侍臣端来铜盘，将鸡血、狗血、马血放在铜盘里，跪着将盘子内陈上，举行歃血为盟的仪式。首先是楚王将兽血涂抹在嘴唇上，其次是平原君赵胜，再次是毛遂，最后其他19个使团成员。之后，楚王命令春申君黄歇率领楚军北上救赵。与此同时，魏国大军也在信陵君魏无忌的率领下前来救援。城内的平原君募集了3000名死士，命令李俣率军出击。在内外夹击之下，秦军大败。秦国大将王龁率军撤退到河东的汾城，另一将军郑安平就没有这么幸运了，他的两万余人被困，无力突围，只好向赵国投降。至此，邯郸之围被打破。


    事后，平原君赵胜对毛遂说：“我的门下贤人众多，我以养士而自豪，自以为眼界超前，能识别贤明的人，但却忽略了先生。先生一到楚国，立刻使赵国的地位犹如九鼎和洪钟大吕。我以后再也不敢说自己善于识人了。”


    从此，毛遂被视为座上宾。毛遂谙谙谈判技巧，在重要的谈判中，首先陈述各自利益，尤其是对方的利益。秦国之害，对楚国来说丝毫不亚于赵国，它攻破了楚国的旧都，还烧毁了它的王陵和祭庙。这一巨大的耻辱，犹如一记响亮的巴掌打在楚王的脸上，无疑激起了楚王的怒意，当即就确定要结盟。软绵绵的谈话，不足以震撼对方；只有一针见血，才能真正地发挥语言的力量。'
