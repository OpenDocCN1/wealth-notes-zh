  md: '# 丁谓：如何完成不可能完成的任务


    想达到一般人无法企及的高度，就需要完成一般人不可能完成的任务。


    丁谓，北宋人，进士出身，累官至尚书左仆射、门下侍郎、平章事兼太子少师，进爵晋国公。丁谓的人品不怎么样，在北宋就很受诟病，被称为“五鬼”之一。但是他解决实际问题的能力很强，故而得到宋真宗的信任，被任命为宰相，得以执政。


    丁谓的记忆力极好，别人读文章往往需要读很多遍才能记住，而他读一遍即能背诵。任职三司时，堆积的文牍犹如一座小山，官吏们很久都不能解决。丁谓一上任，好似风卷残云，几天之内就全部解决了。对于一些疑难问题，他能拿出中肯、切实的意见，令上级与下属都十分满意。大中祥符二年(1009)，宋真宗下诏修建玉清昭应宫这一浩大工程。这项工程占地480亩，即32万平方米，包括宏大的宫殿、楼阁、明堂、桥梁、水池等，房屋共计2610间，预计15年建成。丁谓接手这项工程后，将它划分成2000余个区，进行综合统筹，只用了8年时间就完成了，工期几乎缩短了一半。当时的士大夫认为，这座宫殿超过了秦始皇的阿房宫，“竭天下之才，伤生民之命”。那么，丁谓是如何完成这个任务的呢？我们不妨以另一工程为例进行阐述。


    宋真宗是个奢华且做作的皇帝，喜欢玩“祥瑞”的把戏，制造老天眷顾他的假象。一次，宫中发生火灾，一夜之间将他的宫殿烧了个精光。好在内侍们救火及时，皇帝的性命才得以保全，而后暂住在一座偏远的离宫办公。为了尽快建成宫殿，宋真宗在离宫召开了御前会议。大臣们讨论了一上午，认为原来的宫殿是五代以来太祖、太宗多个皇帝逐渐扩建的，欲恢复宫殿原貌，工程量大，不可能一蹴而就，短则五年，长则十年。宋真宗一听，顿时大怒，自己在这个小破宫殿里办公五到十年，实在有损皇家威严。他宣布散会，将大臣们都撵了出去，只留下参知政事丁谓、户部和工部的官员将之前开会时说的话又说了一遍，丁谓却奏禀只用三年就能完成。宋真宗大喜，命丁谓全权负责。户部和工部的官员一听这么短的工期，顿时傻了眼，而皇帝早已回了后宫。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '丁谓到了工地，发现火灾之后遍地都是废墟，要重建宫殿，首先要将这些废墟清走。重建工程还需要大量的木材和石料，施工则需要大量的新土。要解决这些问题，最大的难题在于运输。如果筹划不当，不要说修建宫殿了，恐怕修整出一个平庸的工地就需要耗费大量人力和物力。眼看夏天就要结束了，在冬天来之前，要是不能先为皇帝建造出几座完整的宫殿供其居住，恐怕会因“欺君之罪”而脑袋搬家。


    为了解决问题，丁谓吃住都在工地上。他调查后发现有一条水沟通往汴河，这是皇宫的御河。他顿时灵机一动，和负责的工部官员制定了如下方案。


    第一，在工地上挖十条大沟，把挖出来的土作为施工用的新土；


    第二，将汴河的水引入所挖的大沟里，采用水运的方式，将各地的木料、石材通过水沟运到工地。


    第三，完成木材、石料等建筑材料的运输后，排干沟中的水，将烧毁的宫殿废墟回填到沟中，解决废墟外运的问题。


    丁谓的这一套组合拳下来，极大地节省了时间和人力，只用了两年半就基本完成了皇宫的复建。他赢得了宋真宗的敬重，并被视作肱股之臣。现代管理学中，有一门学科叫“运筹学”。人们通常认为这门学科是在第二次世界大战时开始出现的，将领们需要将大量的物资、军械、弹药运送到作战区域，从而参谋人员们研究出了科学的运筹手段。事实上，运筹学在我国有很悠久的历史，丁谓就是深谙这门学科的大师。


    运筹学作为一门解决实际问题的学科，在处理相关问题时，通常有以下几个步骤：首先是确立目标；其次是制定方案；再次是建立模型；最后是给出解决方案。丁谓在皇宫复建工程中，首先从解决根本问题，即废墟处理和土方运输入手，从而达到一举三得的效果。在现代机构管理和运营中，运筹学的应用已经十分广泛。最成功的案例当属第二次世界大战结束后，遭到破坏的德国首都柏林缺乏粮食，战败的人们遭受着饥饿和寒冷的威胁，美国制订了严密的援助计划，从航空入手，避免了人道危机。


