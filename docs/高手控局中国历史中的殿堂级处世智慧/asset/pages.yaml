- pgno: 208
  md: '# 㸲 运筹・领导者的能力素质


    领导者不必是专业人才，但必定是善于整合资源之人。昭烈帝刘备文不如诸葛，武不如关张，但却是团队领导，就在于他善于用人所长：智则取其谋，愚则取其力，勇则取其威，怯则取其慎。在任何时代，运筹都是领导者必须具备的最大能力。'
