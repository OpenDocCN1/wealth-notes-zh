- pgno: 54
  md: '# 馆陶公主：三朝社交达人


    结交正确的人，才有通道做正确的事。与其说做事先做人，不如说做事先“交”人。


    馆陶公主刘嫚，是汉文帝刘启与皇后窦漪房的女儿。她在汉初的政治格局中有相当大的影响力，与其长袖善舞的社交有密切的关系。


    文帝时期，刘嫚被封为长公主，嫁给了汉初功臣陈婴之子陈午。由于窦皇后的宠爱，刘嫚性格泼辣，不拘泥于流俗，再加上汤沐邑丰厚，故而她广交朝中贤达，以致官员们争相奔走其门下。


    汉景帝即位后，刘嫚作为与皇帝一母同生的胞妹，更加荣宠无比，被加封为大长公主。当时汉景帝的妃子栗姬所生的儿子刘荣被立为太子，为了能够在以后仍然屹立不倒，刘嫚着意结交栗姬，想将女儿嫁给刘荣。栗姬仗着自己是太子的生母，完全没有将这位公主放在眼里，于是拒绝了她的好意。


    刘嫚见此路不通，转而与景帝的另一个妃子王夫人交好。王夫人深知刘嫚在宫廷中的影响力，因而经常参加公主的宴会。一次，王夫人带着四岁的儿子胶东王刘奭（后改名为刘彻）参加公主的宴会。公主将这个可爱的小侄子抱在怀里，开玩笑地说：“儿啊，你想要媳妇吗？”


    刘奭点了点头。


    大长公主刘嫚就指着身边的女官和侍女一个一个地问：“你要她做你的媳妇吗？”


    刘奭都摇头否定了。


    之后，刘嫚指着女儿陈阿娇说：“那你要娶阿娇吗？”


    刘奭奶声奶气地说：“若能娶阿娇，我就用黄金造一所房子给她。”'
  merge: -1
  img_proc: true
- pgno: 55
  md: '刘嫖见这小娃儿的话这么有气概，非常高兴，便向汉景帝请旨，将女儿阿娇许配给刘嶁，这得到了汉景帝的同意。至此，大长公主刘嫖和王夫人结成了政治同盟。


    为了进一步巩固与王夫人的关系，刘嫖请求汉景帝将王夫人所生的隆虑公主嫁给儿子刘缗。这样一来，刘嫖的女儿成了王妃，儿子则成了驸马，堪称亲上加亲的双重保险。有了这几层关系，刘嫖出入宫廷就更加频繁了。为了推倒太子刘荣，刘嫖不断地在汉景帝面前诋毁其母栗姬。汉景帝虽熟念及与栗姬的旧情，但其实与她已产生嫌隙。


    汉景帝身体不佳，栗姬正好在身边侍候，汉景帝对她说：“我百年之后，希望你能善待其他妃子们。”此时，汉景帝实际上已有托孤之意。刘荣被立为太子，一旦自己驾崩，太子登基为帝，其生母势必被加封为皇太后，成为宫廷最有权威的人。由于栗姬平常就对其他妃子们嫉妒不已，此时听了汉景帝的话，更加愤怒不已，完全不搭话，而且出语讥讽汉景帝。汉景帝怏怏不乐，但是没有当场发作。


    刘嫖经常出入宫禁，对宫里发生的一切了如指掌。她获悉汉景帝与栗姬的裂痕后，伺机而动。恰好汉景帝的皇后薄氏被废黜，刘嫖就指使朝臣奏请立栗姬为皇后。汉景帝刚废了他祖母薄太后在他是太子时指定的正妻，还没缓过神来，大臣就夹来掺和，顿时大怒，指责大臣所奏不当，处死了奏事的大臣，同时迁怒于栗姬母子，并废黜了太子刘荣，改封他为临江王。


    由于大长公主刘嫖经常在哥哥面前称赞胶东方王刘嶁贤明，王夫人也顺从汉景帝的心意，在皇后的位子空悬了一阵子之后，最终王夫人成了赢家，儿子刘嶁则被立为太子。


    汉武帝登基后，立陈阿娇为皇后，身兼姑母和岳母的刘嫖又有拥立之功，因而地位更加显赫。因她是汉文帝窦皇后的女儿，随窦皇后的姓氏，被尊为“窦太后”，凭借太后令牌，拥有在皇帝的御道上行车的特权。


    刘嫖历经汉文帝、汉景帝、汉武帝三朝，堪称政坛常青树，直到后来皇后陈阿娇无子失宠，汉武帝也对这位权力政治十足的姑母有了猜疑，她的影响力才逐渐减弱。尽管如此，在刘嫖生命的最后，汉武帝也曾驾临其庄园的宴会。汉武帝还将女儿夷安公主嫁给了刘嫖的孙子昭平君。'
  merge: -1
  img_proc: true
- pgno: 56
  md: 纵观刘嫖的一生，其手腕之高，影响力之大，在整个中国皇室公主中也是罕见的。不论是朝臣，还是内官、皇妃，都愿意与她结交，这与她热衷于社交是分不开的。正因如此，在每个关键时期，她都有广泛的人脉可用。即便是晚年失势，她仍然能得到爰叔这样的高人指点，从而得到汉武帝的肯定，确保其尊荣不倒。
