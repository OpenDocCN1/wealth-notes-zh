  md: '公主怒怼：“是又怎样？”


    郭暖说：“我爹还不稀罕呢！”


    《资治通鉴》中对这一段情节有精彩的描写：“汝倚乃父为天子邪？我父薄天子不为！”


    公主被气哭了，抹着眼泪回到宫里向皇帝老爸告状。


    郭子仪得知后，将郭暖打了一顿，并送去皇宫请罪。代宗皇帝是个深谙人情世故的高手，一边安慰女儿，一边对女儿说：“他说得没错，郭子仪要是想当天子，天下就不是咱们家的了。”就这样把公主哄回去了。同时，他又安慰趴在地上请罪的郭子仪说：“俗话说，‘不痴不聋，不做阿家阿翁’，小儿女之间的事，且不必理会。”


    唐代宗也很清楚，在藩镇林立、节度使各自为政的情况下，大唐就剩下郭子仪这么一根顶天白玉柱了，要是再把郭子仪逼得造反了，大唐就可真的完了。


    郭子仪晚年时，御史中丞卢杞来拜访。当管家通报后，郭子仪立刻令家人，尤其是女眷和歌妓全部回到后堂，并严令她们不得出现在前厅。卢杞与郭子仪交谈了很久才离去，郭子仪这才松了一口气。


    管家感到很奇怪，郭子仪的资历比卢杞深，而且是皇亲国戚，为何对卢杞的拜访这么小心呢？郭子仪告诉管家，卢杞虽然长得比较丑，心胸又狭窄，但十分会逢迎皇帝，所以一定会被皇帝重用。


    女眷们看到样子难看的卢杞，不免会发出笑声，即便不是笑他，卢杞也会记恨在心，伺机报复，到那时再后悔就晚了。后来，卢杞做到了宰相，名臣杨炎、颜真卿都因被他记恨惨遭陷害而死。


    郭子仪虽然被封为郡王，但是在家里丝毫没有郡王的威仪。他王府的门大开着，丝毫没有一览门深似海的样子，可供宾客们随便出入。他麾下的将士们来告辞，看见夫人和女儿对郭子仪呼来喝去的，一会儿让他拿手巾，一会儿让他端水，他还乐此不疲，像个下人一样跑来跑去。他的后辈们看到他这个样子，都觉得十分丢脸。一天，一个人跪在地上对他说：“王爷，您贵为国家重臣，立下了大功，身份'
