  md: '# 冯谖：脱颖而出的“技巧”


    在正确的时间、用正确的方法说出来的话，即便不加修饰，也是“金玉之言”；在错误的时间、用错误的方式说出来的话，无论如何润色，终归都是废话。


    孟尝君田文是齐威王的孙子、齐国宗室田婴的儿子。他继承了父亲的封地薛城，养了三千门客，与赵国的平原君、魏国的信陵君、楚国的春申君合称“战国四公子”。


    孟尝君的门客里，有擅长剑术的技击高手，也有能言善辩的策士，还有身怀奇谋的谋士，当然也有一些吃闲饭的。田文认为，自己的封地物产丰厚，不在乎多养一个闲人，因而将那些蹭吃蹭喝的人都留着。冯谖就是这么一个人，孟尝君不知他有何长处，但还是留着他，给了他最低的待遇。


    冯谖上马不能杀一敌，入幕不能定一策，但他认为自己并非那种可有可无的员工，最低待遇配不上自己。可是，怎样才能让老板知道自己不是一般员工呢？


    一天，提供饭食的人员来了，将一碗没有肉的饭丢给他。冯谖就靠在柱子上，拔出长剑，用手指弹着剑锋。伴随着长剑发出虎啸龙吟的声音，冯谖唱道：“回去吧，我们还是回去吧，吃饭连鱼肉都没有啊。”管后厨的人把听到的话告诉孟尝君，孟尝君下令给冯谖增加鱼肉，提高伙食待遇。


    冯谖安生了几天，看到有的人出入坐着车，就靠在门边上弹剑唱道：“回去吧，我们还是回去吧，出门没有车啊。”


    很快，就有人打了小报告，把冯谖唱的歌告诉了孟尝君。孟尝君笑了笑，让人给冯谖安排车驾，从此他成了有车一族。有了车的冯谖经常出门拜访朋友，还对朋友吹嘘说：“孟尝君非常重视我。”


    冯谖尽管拥有了上等门客的待遇，但很快又弹起了剑、唱起了歌。这次唱的是：“回去吧，我们还是回去吧，没有钱养家啊。”'
