  md: '就在诸葛亮的隆中草堂里，刘备进行了第一次面试。


    首先，刘备提出自己的问题：汉朝衰败，奸臣窃取大权，天子蒙受委屈。我不度德量力，想把大义彰显于天下，可是我的智慧有限，到现在还没有什么成就，但是我不会放弃，您有什么可以救我的吗？


    接下来的一段回应，就是名动天下的《隆中对》的内容，也是诸葛亮赢得老板赏识、奠定辉煌人生基础的第一张卷子。以后，他还要答多张这样的卷子，比如《出师表》。诸葛亮分四部分给出答案：


    自从董卓这个军阀以边帅的身份入京，天下豪杰并起，跨州连郡者不可胜数。曹操和袁绍相比，名气小、人数少，但是能够以弱胜强，打败袁绍，不是因为天时，而是因为人谋。弱小不可怕，只要长于经营，也能击败强大。这是给刘备以信心。


    接着，诸葛亮分析了天下的局势。如今曹操已经拥有百万之众，挟天子以令诸侯，不可与他正面对抗。江东具有长江天险，历经孙坚、孙策，到孙权已是三代领导人，他得到百姓归附，贤能之人得到任用，我们可以与他结盟。在这里，诸葛亮为刘备指明了一个基本方向，那就是谁是敌、谁是友。


    之后，诸葛亮为刘备分析了地缘特征。荆州北据汉、沔，利尽南海，东连吴会，西通巴、蜀，此用武之国。益州险塞，沃野千里，天府之土，汉高祖刘邦就是凭此汉中争夺天下的。益州的主人刘璋暗弱，他的北面有张鲁寇贼，民殷国富而不知存恤，这里的智能之士渴望得到一位英主。你可以夺取这两个州，成为起家的根基。眼见刘备的眼里不断地闪烁着光芒，诸葛亮还不忘来一单彩虹屁：将军既帝室之胄，信义著于四海，总揽英雄，思贤如渴。


    最后，诸葛亮给出了刘备争夺天下的具体策略：依靠荆州、益州的地理优势可以自保，西和诸戎，南抚夷越，外结孙权，内修政理；一旦机会成熟，命一员上将军率领荆州军队进攻宛、洛，刘备率领大军出秦川，两线出击，洛阳、长安便会收复，老百姓箪食壶浆迎接，汉室可兴。


    诸葛亮的话，犹如暗夜里的明灯，照亮了刘备那颗长期以来沦陷在黑暗中的心。所以，毫无悬念，刘备被俘获了。对此，刘备的老搭档关羽和张飞很是不满。这时刘备给出一个精彩的比喻：“孤之有孔明，犹鱼之有水也。'
