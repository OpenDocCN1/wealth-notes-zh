  md: '这一番对话，就是触龙的厉害之处。他的前两番说辞看起来遭到了太后的反驳，但他一步步后退，将太后引入自己的话术圈套，使自己变被动为主动，直击赵威后的内心。


    接着，触龙又说：“从这一代向上追溯三代，甚至推到赵国建立之时，赵国国君的子孙被封侯的，他们的子孙还有能继承爵位的吗？”


    赵威后说：“没有。”


    触龙又说：“不仅是赵国，其他诸侯国有吗？”


    赵威后说：“我没有听说过。”


    触龙说：“他们当中祸患来得早的，就降临在自己头上；祸患来得晚的，就降临在子孙头上。地位尊崇却没有功勋，俸禄丰厚但没有功绩，还占据大量珍宝，您现在把长安君的地位抬得那么高，封给他大片肥美的土地，不趁现在让他为国立功，您百年之后，凭什么让长安君在贵族中站稳脚跟呢？所以，我认为您为长安君考虑的，没有为燕后考虑得长远啊……”


    触龙的一番话，毫无疑问地抓住了赵威后内心的痛点，她对触龙说：“按你的意图办吧。”


