- pgno: 114
  md: '# # 肆 阅世・解决问题的见识与能力


    纵观历史，纸上谈兵者、眼高手低者屡见不鲜，随声附和者、唯唯诺诺者比比皆是。真正能掌控各种局势走向乃至掌握自己命运走向的人，往往是那些不显山露水，既能办大事又能解决小问题的高手。不要迷信天赋与学问，高手都是在世事中练出来的。'
