- pgno: 14
  md: '陈平的逃亡路上还有一段插曲。他离开项羽后，走到一条河边，上了一条渡船。船到河心时，他看到从船舱里又走出来一个人，极不像善。陈平明白了，这俩人恐怕是劫道的，见自己长得俊美，以为是携带钱财的有钱人。他立刻装作要帮忙的样子，将衣服脱下来扔到舱板上，光着膀子帮忙划船。见其衣服掉落没有发出任何声响，身无长物一目了然，两个水寇也就作罢了。要知道，水寇害命，无非为财，既然无财，也就不必杀人。陈平非常了解这类江湖人物的心理，故而一见二人，便摸清了他们的路数，使出了保命手段。


    陈平的第三个东家是刘邦。不过此时刘邦已是一方诸侯，不是随便什么人都能够见到的。这时陈平善交朋友的好处就显现了，在刘邦处任职的往昔友人魏无知向刘邦引荐了他。在史书中，魏无知就是个打酱油的，连附录在别人传记后的资格都没有，而太史公却用了整整一篇章来写陈平。但要是没有这么一个不起眼的朋友，陈平的命运很有可能会被改写。所以，不要轻视任何一个人，鸡鸣狗盗之徒，用对了地方，依旧不失有用武之地。


    刘邦与陈平谈得很投机，问他在项羽手下担任什么职务，陈平回答是都尉。刘邦于是任命他同样的职务，并让他担任自己的参乘，负责监督诸将。古代乘车，车上除了有驭手外，还有一个陪坐人员，即“参乘”，一方面充当主人的保镖，另一方面有参谋的性质，其被信任度自不可言。与刘邦一同起家的铁哥们儿见陈平这么个新来的菜鸟受到刘邦如此重视，都愤愤不平。尤其是让他监督诸将，这等于是骑在了老伙计们的头上！大将周勃、灌婴率先发难，向刘邦告了一状。周勃说：“陈平虽然长得好看，就像帽子上的玉饰，好看不中用，先是在魏王麾下，后来又跑到项王麾下，现在又到了大王您的帐下。他收取将领们的好处，谁给的好处多，他就把谁安排在好的地方。对于这种反复无常的小人，您怎么能重用呢？”


    毫无疑问，周勃的话在刘邦的心中撬开了一条缝。对于刘邦而言，与能力相比，忠诚更加重要，何况陈平的能力尚未得到验证呢！不过，刘邦不是那种被人牵着鼻子走的人，要责难陈平，首先得从推荐人身上下手。于是，他召见了魏无知。魏无知并不否认陈平身上的缺点，但却向刘邦提出另一个问题：“方今天下大乱，我向您推荐的首先是有能力解决问题的人。假如推荐像孝己、尾生那样道德高尚但无助于胜利的人，您有机会重用他们吗？现今争胜负，只要有助于胜利，一些品德上的小瑕疵算得了什么呢？”很显然，魏无知避开了陈'
  merge: -1
  img_proc: true
- pgno: 15
  md: '平的品德问题，而是自己荐人得当与否。在这一点上，他就很好地抓住了刘邦的心理。大乱之世，没有行动力，一切都是空谈。


    刘邦没有怪罪魏无知，而是召见了陈平。刘邦的问题直指忠诚度，而陈平的回应也很简单：“我侍奉魏王，魏王不肯用我的筹划，所以我离去了；我侍奉项王，项王信任和重用的都是他的亲眷故旧，所以我离去了；听说大王重视人才，我光着身子来投奔您，不接受众将的钱财就没有资用。我的计谋大王能用就用，不能用钱财都还在，一分都没有动，请让我离开吧。”


    陈平的这一席话，有三层含义：其一，魏王、项王都不是成大事的人，前者不听进言，后者只信任小圈子里的人；其二，大王您重视人才，我才来投奔您；其三，我确实接受了众将领的钱财，但是做任何事情都得花钱，况且我并没有私用，而是准备做大事。他先是指出魏王、项王的短处，而后戳中刘邦小圈子诋毁自己的事实。但是，他没有撇清自己，而是十分务实地指出了钱财的作用。


    刘邦对陈平的话很满意，让他继续监督诸将。此后，再没有人来刘邦耳边聒噪了，连立下战功最多的周勃都撼不动的人物，别人就更不用说了，何况陈平用实际行动证明了自己的能力。此后，他进出奇计，为刘邦夺取天下立下大功。


    汉高祖、高后驾崩之后，面对吕氏夺权、刘氏不稳的局面，陈平又成为稳住大局、迎立汉文帝的人。他是高祖大臣中的智囊，也是创业团队成员中相规陨落得少见的几个平稳走向人生落幕的人。回过头来说，汉高祖平定天下后论功行赏，陈平被封为户牖侯，后又改为封户更多的曲逆侯。他向刘邦提起了此时已被边缘化、当年推荐他的人魏无知，刘邦根本不记得还有这号人物。经陈平提醒，他才封魏无知为高良侯（或作高梁侯），使其位居列侯。'
