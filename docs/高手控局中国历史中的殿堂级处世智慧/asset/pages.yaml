- pgno: 118
  md: '# 张释之：领导临时起意，看我从容化解


    做正确的事，不仅能体现有本事，而且能说明这是有本事的人才有资格做的事。


    张释之，西汉著名法官，最初担任骑郎，也就是皇帝出行时的车骑随从。他从骑郎起家，累迁公车令（秩六百石的官员）、中大夫、中郎将（秩比两千石，负责皇帝禁卫）、廷尉，以尊重法律、量刑得当著称。


    张释之任谒者仆射（负责传达的官员）时，一次陪伴汉文帝到上林苑去看老虎。上林苑是皇帝私人的野生动物园，汉文帝向管理这个庞大动物园的园长（上林尉）询问园里动物的情况。园长不善言谈，口齿不灵便，回答得磕磕绊绊。汉文帝十分不高兴，又问旁边的啬夫，也就是小职员。这个小职员对答如流，很对汉文帝的胃口，也获得了汉文帝的赞赏。事后，他让张释之写一道诏书，罢免上林尉，让那个啬夫代替。


    张释之没有听从，而是向汉文帝提出几个问题。他问：“绛侯周勃怎么样？”


    文帝答：“是个有真才实学的人。”


    又问：“东阳侯张相怎么样？”


    文帝答：“也是个有才干的人。”


    张释之说：“周勃和张相都不善言谈，但是他们很有才能。陛下您因为啬夫善于言谈，而不考虑他其他方面的能力，就让他代替上林尉，这是鼓励夸夸其谈的作风啊。这样一来，上行下效，只怕会举措失当。秦国就是这样败亡的。”


    汉文帝听后只说了一个字“善”，啬夫升职的事就不了了之了。在回去的途中，汉文帝向张释之咨询了很多秦国兴亡之道，并将他升为公车令。张释之于汉文帝的一时心血来潮没有无脑地去执行，而是耐心解释，使得汉文帝放弃了自己的想法。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '张释之担任廷尉时，一次和汉文帝、汉文帝宠爱的慎夫人，以及满朝大臣到霸陵视察。那天汉文帝的心情很好，登上了高大的山陵，眺望北面的新丰道，对慎夫人说：“你看那条路，就是通往邯邵的路。”汉文帝刘恒没有当皇帝前，被封为代王，对赵、代等地非常熟悉。他这是在回忆早年的生活，有点儿怀旧的味道。他命令慎夫人弹秦瑟，自己唱歌，唱着唱着，他的心情开始低落，感到人生转瞬即逝，指着霸陵说：“用北面山上的石头做椁，在棺椁的缝隙里填上切碎的苎麻丝系，再涂上漆，就打不开了吧。”汉文帝说这话，实际上是将霸陵指定为自己的陵墓所在地。其他大臣对皇帝说的话，当然是齐声附和，各种花式的彩虹屁，但张释之却说：“如果棺椁里有吸引人的东西，即便封铸整个南山，也还有缝隙；如果棺椁里没有吸引人的东西，即便没有棺椁，也不必忧虑吧。”


    汉文帝认同了张释之的说法，将他升迁为廷尉。后来，汉文帝驾崩，遗诏只用瓦器陪葬，不允许用金银器皿。一直到五代，后周皇帝郭威还对周世宗柴荣说，自己经过汉代诸帝的陵时，发现大多被盗掘了，只有汉文帝的霸陵，因为里面没有值钱的东西，没有使盗墓贼产生兴趣，所以完好无损。这是汉文帝接受了张释之劝谏的结果。


    汉文帝出行到中渭桥上，突然从桥底下窜出来一个人，惊了汉文帝骑乘的马，差点儿将汉文帝摔下来。卫队抓住了那个人，将他交给张释之处理。张释之判定：“冒犯法驾，罚金四两。”（此处罚金指的是铜。）张释之将审理结果上报给汉文帝后，汉文帝非常不满意，认为惩罚得太轻了。张释之回答道：“已经定下的法律，天子和百姓都应该尊重它，不能有所偏私。如果不按照法律限定，量刑过重，以后还怎么取信于百姓呢？我担任廷尉，是天下法官的首领，如果不按照律令审案，地方官也会不按照律令办事。这会导致老百姓们惶恐不安，国家就危险了。”


    汉文帝认可了张释之的处理意见，不再过问。


    有个窃贼盗取汉高祖庙里祭祀用的玉环时，被守卫抓住了，并交给廷尉处理。张释之对这个人判了死刑。高祖庙是汉文帝父亲的祭祀神殿，偷这里的东西无疑是从老虎嘴上拔毛，惹得汉文帝大怒，要求张释之灭他族。张释之上奏说：“盗窃太祖庙的物品判死刑，已经是极致了。如果因为这个灭族，以后有人挖了高祖陵墓的土，该判什么罪呢？”'
