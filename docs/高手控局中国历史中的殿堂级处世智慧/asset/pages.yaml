  md: '张登正是看清了三国阵营的这一缺陷，因而转身出使魏、赵两国。他对两国国君说：“齐国一开始坚决反对中山国称王，现在又积极拉拢中山国，这是为了以后对付你们，你们应该抢在齐国之前与中山国相王，使齐国失去牵制你们的机会。”魏、赵两国国君同意张登之说，承认了中山国的地位。至此，魏、赵、齐联合出兵的计刣不但破产，而且中山国的地位也获得了承认。


