- pgno: 151
  md: '# 田忌：成于功业，败于人情


    不要对任何人有过度的期待，人走茶凉才是人际关系的常态。


    我们看历史人物，往往只看到他的成功，而很少关注其失败之处。对于创业者而言，成功固然重要，失败者的经历也不可忽视，因为那是反面教材。


    田忌是战国时期齐国的大将，贵族出身，平时喜欢和贵族，包括齐威王赛马。当时赛马的规则是这样的：每个人的马分为上、中、下三等，比赛时上等对上等、中等对中等、下等对下等。齐威王身为一国之君，其拥有的同等级马匹肯定优于其他人，故而每次与田忌赛马，田忌必输。


    当时孙膑受同学庞涓迫害，落魄流亡于齐国。他在赛场上看到这种情况后，便建议田忌用下等马充当炮灰与齐威王的上等马比赛（输了一局），然后用上等马与齐威王的中等马比赛（赢了一局），最后用中等马与齐威王的下等马比赛（赢了一局）。如此两胜一负，田忌最终赢得了比赛。


    齐威王十分诧异，往日一直输的田忌居然能赢，便问他原因。田忌当即推荐了孙膑。齐威王大喜，认为孙膑是个奇才，要任命他为将军。孙膑以自己双腿残疾为由，婉拒了齐威王的任命。齐威王就任命他为军师，作为田忌的高级参谋。


    前354年，小霸主魏国进攻赵国，包围了赵国的都城邯郸。赵国派使者向齐国求援，相国邹忌建议不予救援，让魏、赵二国互攻以消耗实力，齐国则作壁上观。


    田忌、段干朋则认为应该救援，不救援：一则不合道义，二则如果魏国击败赵国，会增强魏国的实力，对齐国不利。


    不过，在具体怎么救援的问题上，段干朋提出了更具体的方略。他认为，如果齐国与强大的魏军硬碰硬，未必是对手，就算打得过，自身也会损失很大。不如等魏国攻破了赵国的都城邯郸，到时候赵国被削弱，魏军也损耗严重，齐国再出手，不但降低了取胜难度，而且'
  merge: -1
  img_proc: true
- pgno: 152
  md: '会令赵国更加感激齐国帮其夺回首都。齐威王认为他说得有道理，便采纳了这个建议。接下来，就轮到田忌和孙膑闪亮出场了。


    前353年，赵国都城邯郸被魏军拿下，赵王出逃。此时，田忌和孙膑率领的大军也到了齐魏两国的边境。当时魏国大将庞涓正率领8万大军进击卫国，田忌决定立刻与之作战。


    孙膑认为，魏国自从变法以来，军力强盛，“魏武卒”战力强悍，不可小觑，不如直接攻击魏国的都城大梁。这样一来，魏军必定撤离赵国，救援自己的都城，齐军在半路设伏，以逸待劳，魏军必败。


    这就是著名的“围魏救赵”的战术。魏惠王得知齐军向都城杀来，立刻派使者召庞涓回援。田忌和孙膑在桂陵设下伏击圈，一举击败魏军，并俘虏了庞涓。


    桂陵之战，魏军虽败，但是占领赵国的主力军并未遭受损失。


    一年后，经过楚国的居中调解，占领邯郸的魏军撤出。魏惠王与赵成侯谈和，并释放了庞涓。桂陵之战的失败，并未打消魏惠王称霸的野心。前342年，魏军进攻邻国韩国，韩国只得向齐国求救。这次田忌从“围魏救赵”中学到了经验，建议齐威王等魏、韩互相血拼得差不多了再发兵。因此，齐国虽然答应了救韩，但发出的援兵却走得很慢。再说韩国得到了齐国的承诺，虽然连战连败，但依旧拼力抵抗，对魏军造成很大创伤。


    田忌照抄了前一次的作业，仍旧率军进攻魏国都城大梁。相同的战术，相同的味道，庞涓简直快被气死了。


    不过，庞涓身为一军之将，上了一次当，未必会上第二次。


    为了让庞涓上当，孙膑建议田忌采用“减灶法”：第一天让后勤制造出有十万人起灶做饭的假象，第二天只有五万人，第三天则只留下三万人。魏军的斥候将一路探查到的情报上报给庞涓，这令庞涓大喜。因为齐军在外一向有“怯战”的名声，这次面对庞涓率领的主力大军，从留下的后勤支持痕迹来看，士兵已逃亡大半。为了一雪桂陵之战失败的耻辱，庞涓丢下步兵，率领精锐骑兵向齐军奔袭而来。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '马陵地形狭窄，两旁多险阻，士兵无法作战，孙膑估计天黑时庞涓率领的魏军会到达此处，于是建议在这里设伏。齐军砍伐道路两侧的树木，阻塞道路，并让一万名弓弩手埋伏在两边的林中。


    魏军进入马陵后，天色昏暗，庞涓看到有棵大树被剥掉了皮，露出白色，隐隐约约看到上面有字，便命令士兵点燃火把，只见树上写着“庞涓死于此树之下”八个大字。殊不知，这正是孙膑给齐军留下的攻击信号。埋伏在林中的齐军见树下有火炬，立刻万箭齐发，魏军顿时死伤惨重。庞涓见大势已去，便拔剑自杀了。随军作战的魏国太子申也成了俘虏。此战中，魏军损失八万人。魏国从此一蹶不振，沦为二流国家。


    此战中齐军胜利，一方面与作战方略得当有关，另一方面也与齐国上下齐心有关，就连“反对派”邹忌也鼎力支持。需要注意的是，身为相国的邹忌与田忌不合，尤其是桂陵之战取胜后，田忌声名鹊起，邹忌更是担心他会取代自己。那么，为何马陵之战中，他会支持呢？这得益于门客公孙阅的建议。公孙阅认为，如果田忌取胜，则作为相国的邹忌也有策划之功；如果田忌战败，败军之将即使不死在战场上，回国之后也会被治罪。这样，邹忌的相国之位就没有威胁了。


    作为军师的孙膑，早已看出田忌与邹忌之间的纷争，因而在获胜后问田忌：“将军想做大业吗？”


    田忌点了点头。


    孙膑建议他班师回朝时暂时不要自解兵权，而是留下一部分士兵，就算是老弱残兵也行，把守住军事要冲马地（今山东省淄博市西南）。此处道路逼仄，战车只能一辆、一辆地通行，堪称“一夫当关，万夫莫开”。然后，大军背靠泰山，左依济水，右拊高唐，轻车快马直奔都城临淄的雍门。如此一来，田忌在齐国说一，没有人敢说二。邹忌是个聪明人，他肯定会立刻逃离齐国，到时候再回朝就无害了。


    田忌认为孙膑的话有些危言耸听，便没当回事儿。再说邹忌本希望田忌战败，谁知这次竟然立下更大的功劳，因而十分恐慌。公孙阅却说，这事好办。他派遣了一个人冒充田忌的属下，大张旗鼓地在市面上找人算命，对占卜的人说：“我是大将军田忌的属下，如今将军大破魏军，名震天下，打算图谋大事，请您来占卜吉凶……”问卦的'
  merge: -1
  img_proc: true
- pgno: 154
  md: '人刚离开，公孙闬就把这个占卜先生抓了起来，并交给了齐威王。如此一来，田忌就有了“谋反”的嫌疑。


    此时已交出兵权的田忌得知这一消息后大为恐慌，只好逃奔楚国，孙膑也只能退隐。等到齐宣王上位后，知道田忌当年是被诬陷的，才将他召了回来，但他已年老，再无作为。田忌在其军事生涯中，毫无疑问是出色的将领，但是就洞悉人心来说，他是失败的。越是立有大功的将军，在君主时代反而越危险。客观地说，兵法制胜，并不在于斩将夺旗，而在于洞悉人心。孙膑深知上司们的内心世界，纵然你没有异心，但你所拥有的强大行动力和资源调配力本身就是一种威胁，而这一点很容易被反对者利用。


    孙膑建议田忌控制军事要冲，未必是支持其谋反，不过是淘汰掉竞争者。这其实也是一种“赛马”策略。邹忌则深知这一点，赛场上的胜利，未必是跑赢最好的马，而是只需将最好的马挤出赛场就行，他还一次性挤走“两匹”。邹忌连续担任田午、田因齐、田辟彊三代齐王的首席大臣，其政治手腕之高，对人心洞悉能力之强，不可谓不高明。'
