  md: '# 诸葛亮：顺势而为，随时而动


    造势并不意味着一定要大张旗鼓、投入重金，它有一个核心策略，就是找到一个支点。这个支点通常包括三个要素：一是新颖，二是悬疑，三是争议。


    《三国演义》中对诸葛亮出场的描写非常巧妙，几乎可以说他是带着神秘的光环出现的。很显然，这是一场话术造势。刘备遭到追杀，骑马越过檀溪，无意中遇到了隐居的水镜先生司马徽。刘备请求司马徽出山辅佐自己，司马徽自称山野之人，做不了官，但是提到了两个人，“卧龙、凤雏，得一人都安天下”。


    当时，刘备手下非常靠得住的谋士是徐庶，只可惜他还没被刘备焐热，就被曹操诓骗走了。临走时，徐庶向刘备推荐了诸葛亮。刘备问徐庶与诸葛亮的才能高低，徐庶自比驽马和寒鸦，称诸葛亮是麒麟和凤凰，并告诫刘备，要想请诸葛亮这个大才出山，必须亲自去，不能像招聘普通人一样，简单地派个人去。这是徐庶在为诸葛亮的出场做加持。


    当然，最厉害的造势来自诸葛亮自己。他自比管仲、乐毅，干活时还经常来一首《梁甫吟》，并自带音乐效果。最精彩的是，《三国志》中记载诸葛亮曾与颍川徐元直、颖川石广元、汝南孟公威一起读书，其他三人都很认真，读到熟练、透彻才罢手，只有诸葛亮只观其大略，对寻章摘句没有兴趣。当朋友们都
    在那里读书时，他“每晨夜从容，常抱膝长啸”。这个姿势实在是太潇洒了，估计后世陶渊明抱膝而坐学的是他，至于长啸则大概被魏晋贤士们继承了。有人问诸葛亮的志向是什么，他只是笑而不答，但是说到他的朋友石、徐、孟三人，诸葛亮的评价是：“卿三人仕进可至刺史郡守也。”这就是说他们的才能做到州郡一级的高级官僚也就到头了。


    前面一波又一波的造势让刘备成为诸葛亮彻底的铁粉，接下来就是见真人的环节了。前两次拜访，刘备都扑了个空；第三次终于逮着了，诸葛亮又在睡觉，气得张飞恨不得在诸葛亮屁股上放一把火。在雪地里站了半天的刘、关、张三兄弟，终于等来了诸葛亮醒来的一个信号，睁眼吟了一句诗：大梦谁先觉，平生我自知。大凡天纵奇才，必定是诗人。诸葛亮的文艺男形象，瞬间在刘备的心里树立起来。'
