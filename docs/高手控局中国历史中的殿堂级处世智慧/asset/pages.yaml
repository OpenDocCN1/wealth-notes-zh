- pgno: 182
  md: '# 刘皇后：一手烂牌，打成人生赢家


    很多时候，我们会觉得自己抓到的牌实在是太差了，但是再差的牌只要打下去，最后或许会发现：我们居然还赢了！有时候抓到一手好牌，反而却输了！有时候，我们羡慕别人的剧本，其实没有谁的剧本值得羡慕，把自己的剧本演好。如果我们真的遇到了这些挫折，那对不起，这就是我们的剧本。我们可以选择弃演，也可以选择努力把它演好。


    宋太宗淳化年间，蜀地银匠龚美带着妻子刘氏到京城汴梁谋生。他们开了一家小铺子，专门给人打造银器。由于人生地不熟，加上在需要银器的达官贵人中没有人脉，他们很快就折了本。房东多次催促他们交房租，还说再不交就把他们赶出门去。龚美的妻子刘氏15岁，正值青春年华。他打算将妻子卖给别人，以继续撑起门面。这在如今当然是极其可耻和应该唾弃的事，但是在宋朝却发生了。有个名叫张奢的人得知刘氏是蜀地人，十分高兴。他告诉龚美，自己的主人想娶一房小妾，能否先由自己掌眼。一见之下，张奢惊为天人。他告诉龚美，自己需要禀告主人后再做定夺。刘氏见张奢言谈得体，气质非凡，猜测他的主人一定不是平常人，就赶紧将自己绣的一方手帕交给他，让他代自己呈给其主人。张奢没有拒绝，就收下了。


    张奢的主人名叫赵元侃，他听了张奢的描述后，并未太在意。不过，当张奢呈上那件绣帕后，他眼前一亮，迫不及待地想见一见刘氏。数日后，刘氏与赵元侃相见。这位赵公子立即就挪不开眼了，放下500两银子，并将刘氏暂时安置在一处别业，然后以娶妻之礼迎入府邸。刘氏入府后，大吃一惊，原来这位赵公子不是别人，而是当今皇帝的儿子，被封爵为襄王。襄王赵元侃对刘氏十分宠爱，几乎可以说形影不离。一次，宋太宗召集儿子们，见赵元侃形态比以前消瘦，就私下向其娘娘了解情况。娘娘原本就不喜欢刘氏，因而就添油加醋地将其诋毁了一番。宋太宗得知儿子竟然娶再醮之女为妾，便勃然大怒，命令赵元侃将刘氏赶出王府。尽管赵元侃十分舍不得刘氏，但皇命难违，因而哭哭啼啼地去和刘氏告别。


    面对哭泣的襄王，刘氏显得十分冷静。她对赵元侃说：“殿下不必伤心，妾并不在意名分，若殿下有意，可将妾安置在别院，妾必定日日念佛，为殿下祈福。”赵元侃见刘氏对自己如此深情，更不肯与'
  merge: -1
  img_proc: true
- pgno: 183
  md: '她分手，于是命张睿将刘氏接走，暂时安置在张家。到了张家后，刘氏对张睿说：“我虽与王爷仳离，但是名分上，我依旧是主，你是仆，混居一处，只怕年纪不便。”张睿一听吓得冷汗直冒，赶紧安排几个老成的、上了年纪的妇人侍候刘氏，自己则另寻住处。


    按理来说，赵元侃与皇位是无缘的，但太宗长子赵元佐有心疾，曾在王府纵火，丧失了太宗的喜爱。大臣们钟意于次子赵元僖，宰相吕蒙正甚至直接上奏请求立元僖为太子。但淳化三年(992)十一月，赵元僖暴毙。这样一来，皇冠就砸在了赵元侃的头上。淳化五年(994)九月，身体很糟糕的宋太宗征求大臣寇准的意见。寇准认为赵元侃堪当大任，因而任命他为开封府尹，封归寿王。


    宋太宗驾崩后，改名为赵恒的赵元侃即位，是为宋真宗。他立刻将刘氏接入宫中，不过并未给她名分。原来，当初宋太宗将刘氏赶出襄王府后，让儿子娶了开国名将、忠武军节度使潘美的女儿潘氏。可惜潘氏运气实在不佳，只过了六年就病逝了，而且没有留下子女。之后，宋太宗又让儿子娶了宣徽南院使郭守文的女儿郭氏，此时的皇后正是此女。刘氏封后无望，就连封为普通的妃子也难。原来在她离开王府后，这位王爷先后娶了一堆小妾，此时都已升位为妃了。不过，刘氏对此并无怨言。为了避免与其他妃子争风吃醋，除了按宫中礼节要求的参拜之外，她只与淑妃杨氏有往来，平日就在宫中读书。


    对宋真宗来说，不论是第一位王妃潘氏，还是现在的皇后郭氏，都是出身豪门大族的女子。刘氏的出身无疑是最低微的，但她有一个其他妃子都没有的优点，那就是十分谦卑。由于真宗性格宽厚甚至有些优柔，皇后郭氏便略显跋扈，甚至在内廷时还压真宗一头。大约正是因此，真宗才频频来会刘氏。景德元年(1004)，宋真宗终于给了刘氏一个名分，封她为美人，在妃子中的品级为四品。后来，刘氏晋位为修仪，再晋位为德妃。刘氏父母早亡，在汴梁没有什么亲人，唯一算半个家人的就是前夫龚美。对于这个将自己转手他人换钱的男人，她没有报复，而是认作义兄。龚美顺势将自己的姓改为刘，自称刘美。至此，刘美成了外戚，沾了前妻的光，被宋真宗赐了个三班奉直的官。刘美以此起家，最后累官至武胜军节度使（观察留后），成了妥妥的封疆大吏。刘美活到60岁病故。宋真宗追赠他为太尉，还为他辍朝三日。之后，宋真宗又恩荫了刘美的儿子们为官。这一切都是因为刘氏。'
  merge: -1
  img_proc: true
- pgno: 184
  md: '郭皇后在32岁那年病故了。这一次宋真宗决定立刘氏为后，但遭到大臣寇准、李迪等人的强烈反对，理由是“刘氏出身微贱，不可母仪天下”。参知政事赵安仁干脆提出立出身高贵的沈才人人为后，她是前宰相沈伦的孙女。资政殿学士王钦若抨击赵安仁请求立沈才人为后不是为公，而是有私心。宋真宗便罢黜了赵安仁的提议，立后之事暂告一个段落。刘氏虽然未能被立为皇后，但她领教了政治斗争的厉害，明白了寻求政治盟友的意义。


    宋真宗大中祥符三年(1010)，刘氏的侍女李氏受真宗宠幸，诞下一子。这也是宋真宗当时唯一的子嗣。 she将这个孩子要来作为自己的儿子，让淑妃杨氏代为抚养，借由这个优势，两年后再次提出自立刘氏为皇后时，虽然大臣们依旧反对，翰林学士杨亿反应尤为激烈，拒绝草拟诏书，但这次真宗是铁了心。刘氏颇通文墨，宋真宗就偶尔拿奏折给她看，并当着她的面批阅，有时候还会想到她的意见。时间长了，宋真宗干脆把奏折交给皇后的刘氏打理。没想到，她批奏得也十分妥当。就这样，刘皇后逐渐掌握朝政，并与外朝的丁谓、曹利用等重臣相互通气，结为政治盟友。


    当时宋真宗多病，奏章几乎全都由刘皇后过手。这当然瞒不过外朝的大臣，故而宰相寇准等大臣进言，认为女主掌政不利于天下。此时，宋真宗也对刘氏产生怀疑，因而向心腹大臣周怀正透露了让太子监国的想法。寇准获悉后，立刻悄悄进京，与宋真宗商议“太子监国”的细节问题，出宫后便立刻让杨亿草拟好授予太子监国之权的诏书。不过，第二天上朝时，面对众多大臣，宋真宗又反悔了。丁谓等人立刻弹劾寇准，将他罢免。就这样，丁谓取代寇准，成了新的执政官。


    周怀正见“太子监国”的筹划失败，寇准又被罢相，决定发动兵变，废掉皇后刘氏并处死她，拥立太子登基，让无法处理政务的宋真宗当太上皇。可未曾料到，兵变的前一晚，有个官员将消息透露给了丁谓。丁谓大吃一惊，立刻告诉曹利用。曹利用是宋真宗的心腹，有便宜出入宫之权，立刻进宫将消息告诉了刘皇后。刘皇后立即借皇帝之名下诏，接拿了周怀正一党，将他们全部处死。她还下诏撤销寇准的菜国公爵位，先将其贬官到相州（今河南安阳），之后再贬官到安州（今湖北安陆），接着贬官到道州（今湖南道县）。连续三贬，使得寇准心惊胆战，心灰意冷。昏盲的宋真宗对此竟然丝毫不知，还问为何多日不见寇准，左右近臣，无人敢答。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '刘皇后比宋真宗活得长，这也是她能成功的一大原因。宋真宗驾崩后，她是毫无争议的后后，以皇帝之母的身份听政。之前为了打击寇准，她与丁谓结盟，现在形势发生了变化，丁谓稳居相位，希望刘太后能回到后宫，由宰相实际执政。她见中书侍郎王曾与丁谓不合，就传召他单独进宫议事，并向他询问丁谓有无罪状。王曾立刻说：“丁谓窃弄权柄，包藏祸心。”刘太后命他起草弹劾奏章，于第二天朝堂上议事。


    乾兴元年（1022）六月，刘太后与宋仁宗在承明殿议政，王曾上奏指出宰相丁谓瞒上欺下，与内廷宦官雷允恭勾结，并拿出了罪证。刘太后本想处死丁谓，但宋朝自立国以来没有杀执政大臣的例子。大臣们虽然厌恶丁谓，但都不同意定他死罪。最终，丁谓被罢相，流放崖州（今海南岛）。


    丁谓被赶出朝堂后，刘太后彻底掌控了朝堂，每隔五天与宋仁宗在承明殿举行一次议政会议。天圣二年，宋仁宗与大臣们为刘皇后上尊号：应元崇德仁孝慈圣皇太后。她身穿窄衣，也就是帝王的龙袍，接受百官朝贺。


    尽管丁谓、寇准等宋真宗时的大臣多被赶出朝堂，但刘太后并非全无忌惮。真宗时的重臣，也是她曾经的政治盟友曹利用，就让她如芒在背。宋真宗景德元年（1044），辽国大举南侵，曹利用受命谈判，签订了澶渊之盟，维持了此后宋辽之间100多年的和平。因此大功，宋真宗极其看重曹利用，这也使得曹利用居功自傲，权倾朝野。每次上朝，刘太后和仁宗皇帝都尊称他为“侍中”，从不称其名。先前，为了打击寇准、周怀正，她需要丁谓、曹利用，现在寇准已不在，丁谓也被流放，是该处理掉这颗棋子了。


    于是，刘太后命人搜集曹利用的犯罪证据。恰好曹的侄子、赵州兵马监押曹泊酒后穿黄衣，被兵丁们高呼“万岁”。她认为这是个机会，故而定下了“谋反”的罪状，并发手诏给宰相王曾，要他着手办理。尚书张士逊认为曹泊的确有罪，但未必是曹利用授意。刘皇后大怒，将张士逊贬到地方上为官。王曾一向厌恶曹利用的为fèi，但是谋反的罪名太重，牵连过多，一旦定罪，将要杀很多人，因而始终不肯下定论。刘太后见罢黜曹利用的目的达到了，便要求改判流放，立刻得到王曾的支持。曹利用在流放途中，自知已无生望，便自尽了。'
  merge: -1
  img_proc: true
- pgno: 186
  md: 刘氏是中国古代史上与吕后、武则天、北魏冯太后、辽国萧太后齐名的几位临朝称制的女性政治家。她身穿帝王龙袍，向大臣们询问唐朝武则天的故事，距离皇位只剩一步，却没有向前迈进。她出身卑微，却懂得把握机会，以一方绣帕赢得尚在潜邸的宋真宗的喜爱，从而拥有了改命换命的机会。当被赶出王府，处于不利局面时，她懂得洁身自好，与仆从（张睿，此人后来累官昭德军节度使，晋封徐国公）保持距离；被宋真宗接入宫廷时，又能韬光养晦，等待时机。当宋真宗与她商议处理奏章时，她抓住机会，学会了批阅奏章的技巧，并趁机与外朝大臣结盟。从某种程度上说，她是一个政治天才，精通“没有永远的朋友，只有共同的利益”这条法则，一旦昔日盟友与自己背道而驰，便立刻先发制人。无论是寇准，还是丁谓、曹利用这些官场高手，无一不被她打得落花流水。她又十分克制，一些迎合她的臣子请求她效法唐朝的女皇武则天，她都予以拒绝。面对昔日的旧人，这个久经政治波澜的老人还保存着罕见的温情，将前夫刘美一家照顾得很好。当皇帝宋仁宗和刘美的儿子刘从德都喜欢富商王蒙正之女时，她愣是压住皇帝，将这个美貌的女子许配给了刘从德，并让刘家一门俱荣，将王氏女封为遂宁夫人、刘从德封为荣国公。她深通人情，明明抓到的是一手烂牌，但却成了人生赢家。《宋史》中说她不是普通的民间女，父亲是嘉州（今属四川）刺史刘通，祖父刘延庆是五代十国后晋、后汉右骁卫大将军，其实这不过是为抬高她的门第附会而已。一个真正洞悉人情、懂得适时抓住机会的人，不需要靠抬高门第来装点自己，她的成功已说明一切。
