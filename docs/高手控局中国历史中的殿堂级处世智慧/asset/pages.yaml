- pgno: 174
  md: '魏明帝对公孙渊的纵容，导致其野心膨胀，走上了在魏、吴之间骑墙的道路。


    公孙渊认为，辽东要想扛住曹魏的威胁，就必须有外援，而他看好的援军就是东吴。公孙渊的示好，令孙权喜出望外。孙权派遣太常张弥、执金吾许晏携带册封用的文件、大量珍宝礼物，还有将军贺达率领的一万军队，渡海去册封公孙渊为燕王。


    面对吴国使者，公孙渊后悔了。他认为魏国近、吴国远，如果与魏国交恶，吴国未必来得及援救。这时他用了一个昏招，杀了吴国使者，兼并了吴国派来的士兵。为了讨好曹魏，他将张弥等人的首级献给了魏明帝。魏国为了嘉奖他，拜他为大司马，封乐浪公，由他继续统领辽东各郡。不过，当魏国册封他为乐浪公的使者到来时，他再次犹疑，竟然派兵包围了使者的住处。此次册封虽然完成，但公孙渊的不轨和辽东的内情也被使者报告给了魏明帝。


    公孙氏统治辽东三世，自行征收赋赋、任命官吏，形同独立王国，因而始终是曹魏的一块心病。景初元年(237)，魏国命幽州刺史毌丘俭携带印信征召公孙渊入朝。公孙渊立即出兵抗拒，击退了毌丘俭。与魏国公开决裂后，公孙渊自立为燕王，设置百官，并拉拢鲜卑，给他们封官，与他们合击魏国。另一边，他再次通使吴国，希望吴国能成为自己的外援。


    这一次，公孙渊在作死的道路上越走越远。


    魏明帝曹睿命司马懿于景初二年(238)率领四万大军讨伐公孙渊。大军到达辽东时是当年的六月，公孙氏的政权坚持了不到三个月就灭亡了。司马懿诛杀了公孙渊和他分封的百官，释放了被囚禁的公孙恭。至此，公孙氏的统治终结。我们来简单复盘一下公孙氏政权在辽东的统治：自公孙度被任命为辽东太守，至公孙渊覆灭，其统治达48年。


    主观上说，公孙氏的统治建立在他收敛锋芒、表面臣服的基础上，先为汉臣，后为魏臣，作为中央代表的曹魏没有必要消灭他。客观上说，前期曹操要平定北方的混乱，暂时腾不出手来解决辽东问题。文帝时期，面对吴、蜀的双重压力，也没必要出兵臣服的辽东。明帝时期，吴国和蜀国的国力都下降了，对魏国的威胁减弱，更重要的是公孙渊自立，这是明目张胆的叛乱，魏国必须除掉他。公孙渊也'
