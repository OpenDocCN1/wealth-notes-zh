  md: '的志向显然不是做富家婿，靠脸吃软饭，而是以管仲、诸葛亮自比，在《上安州裴长史书》中说“大丈夫必有四方之志”，说明他也要做宰相一类的人物。


    不过，在如何进入仕途的问题上，李白不屑于参加科举，他想通过社交的方式，引起最高统治者的注意。后世对李白不断于谪名流十分诟病，这是不太了解李白所受教育的缘故。李白早年受教育于蜀中名士赵蕤。赵氏以纵横家思想闻名，这是顶级的博弈之术。受到这种教育的李白崇尚的是苏秦、张仪、管仲、乐毅这类人物，是要一杆子插到天地，何曾听过管乐这样的霸要是靠参加科举从小官干起的？


    李白娶了许国师的孙女后，自称“酒隐安陆，蹉跎十年”，事实却是他并未享受家庭生活时光，而是不断地为他的社交添光加彩。开元十八年(730)初夏，他来到长安，拜见了宰相张说。


    这位诗人宰相并没有照顾李白，他的儿子张垍却与李白十分投缘。张垍是当朝驸马，娶了唐玄宗的女儿宁亲公主。于是，他将李白引荐给了玄宗皇帝的妹妹玉真公主。这位公主好道，早年也是文艺女青年，对李白十分友善，天天请他赴宴，使他结交了众多王公大臣。李白这次在长安虽然没有求得一官半职，但是对长安的社交生活却已十分了解。


    蜀中多才俊，不走寻常路。当年司马相如就是因为读了《子虚赋》，在之后又献上了《上林赋》，得到汉武帝的极大赞赏和重用，从而在朝为官。李白大概也想效法司马相如，故而先后向玄宗皇帝献上了《明堂赋》《大猎赋》。这次玄宗皇帝虽然未见他，但是知道了他的存在。


    开元二十三年(735)，李白结识了他一生中另一位最重要的朋友—贺知章。贺知章一见李白，就惊呼他为“谪仙人”。贺知章当时是玄宗皇帝跟前的红人，经他和玉真公主推荐，玄宗皇帝终于敞开了召见李白的大门。玄宗皇帝是艺术家，对艺术有着极高的鉴赏水平。李白满纸纵横、飘逸绝伦的诗文他早已见过，身边的人天天说李白，他的耳朵都快生出茧子了。他见过帝国优秀的艺术家，身边也聚集了一大批才能出众的人。


    然而一见到李白，他还是被李白身上那种玉树临风、岩岩若松、卓尔不群的气质所吸引。他从步辇上下来，亲自相迎，“以七宝床赐'
