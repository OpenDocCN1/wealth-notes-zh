- pgno: 106
  md: '很大程度上在于他抓住了谈话要领，即说到了老板的心坎里。邓禹的话至少有四层意思：其一，更始皇帝虽然被群雄拥戴登上了皇位，但是并不能服众，其势力缺乏凝聚性，是脆弱的；其二，更始皇帝的属下都是庸碌之人，缺乏远大的政治理想，不足以令天下长久安定；其三，你虽然为更始皇帝立下大功，但他不是英主，你恐怕难成大业；其四，我们干草，首先是招揽人才，其次是照顾百姓的利益，这样定能建立一个有新气象的王朝。


    邓禹的分析鞭辟入里，将非常复杂的情况归纳得清晰明白，甚至还给出了发展建议，可谓高屋建瓴。这样的谈话水平和政治敏感性，无疑是刘秀最需要的，无怪乎邓禹当场就得到了最高的礼遇。


    接下来，一切都像邓禹预料的那样发生了。刘玄在绿林军的拥戴下称帝，赤眉军也在形式上表示了对他的归附，但刘玄不信任诸将，先后杀掉多人，还从背后袭击了赤眉军。


    更始皇帝三年(25)，赤眉军的首领樊崇找到一些西汉宗室后裔，打算从中选一个人立为皇帝。樊崇让人找来一个竹盒子，在一封书札上写上皇帝的名号，然后和其他空白书札一起放进去。他将候选人按年龄大小排列，由年长的先摸，每人可依次摸到一张书札。


    刘盆子年龄最小，因而最后一个摸。打开书札后，别人的都是空白的，而刘盆子摸到的是那张“帝札”。就这样，他通过抽签的方式当上了皇帝。这样一来，长安和赤眉军的大营里就各有一个皇帝，二帝并立，势必一战。不久，赤眉军攻入长安，刘玄投降后被杀。这印证了邓禹的判断。


    同年六月，刘秀在文臣武将的拥戴下，于鄗城（今属河北邢台）千秋亭称帝，再次出现二帝并立的局面。邓禹受命向西，荡平关中敌人。诸将皆劝邓禹快速进兵，拿下长安。邓禹却说：“我们现在虽然人多，但是能打仗的精兵少，而且进军之地缺乏粮食，我们身后的粮草补给又不足。赤眉军刚刚拿下长安，物资充足，士气高涨，我们无法与之决战。不过，盗贼们缺乏长远的目光，肯定无法长期坚守。上郡、北地、安定三郡人口稀少，但是粮食和牲口充足，我们不如先去那里修整补给、等待时机，寻找到赤眉军的弱点后再将其消灭。”众将认为邓禹说得有理，因而就食三郡，所到之地，击败赤眉军的营寨。'
