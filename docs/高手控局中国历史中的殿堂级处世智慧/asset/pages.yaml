  md: '# 鲁肃：内悉人情，外具大略


    有这样一些人，他在时你无感，等到失去他时，你才会知道，没有他的世界大不相同——看看鲁肃死后东吴的各种瞎操怍，孙权一定会认同这句话。


    由于“演义”的影响，鲁肃一直被后世人忽视，乃至误解。事实上，他是东汉末期最具战略眼光的狠人之一，甚至可以说在某种程度上决定了三国的历史走向。


    鲁肃出身临淮士族世家，不但喜读书，而且精于骑射。汉末朝政混乱，军阀割据，鲁肃意识到苟全乱世不易，因而经常与游侠来往。一时间追随他的青年有数百人，他就将这些人组织起来，在山中操练军阵，模拟战场厮杀。当时的人都将他视作狂生，族人更是哀叹，恐怕他会导轾鲁氏衰败。


    袁术听闻鲁肃的名声后，便派人来征召他。但鲁肃认为袁术气量狭小，难以成就大事，不值得自己辅佐。当时，周瑜也在袁术帐下。正值军中缺粮，他听说鲁肃家中粮秣充足，便率领几百战士去借粮。既然是借粮，备好礼物登门拜访就行了，干吗要带兵去呢？因为周瑜对鲁肃的大名早有听闻，知道他们门下多健儿，如果自己在山中操练军阵，模拟战场厮杀。当时的人都将他视作狂生，族人更是哀叹，恐怕他会导轾鲁氏衰败。


    其实，鲁肃不但深通韬略，而且更懂人情。当年大旱，江淮颗粒无收，街头常有饿殍，军中粮食同样难以为继。周瑜此次摆出这么大的阵仗来借粮，必定是志在必得，鲁肃不借也得借。他是个狠人，但不是个蠢人，与其和一支披坚执锐的劲旅对抗，不如顺水推舟做个人情。孰能想到，他就此与周瑜这个英杰成了密友。


    鲁肃认为，淮泗一带是兵家必争之地，在群雄并争的时代难以安居，而江东沃野千里，民富兵强，是一片乐土，既能避开危险，又能待时而动。他将这一想法告诉了那些追随自己的健儿，他们一致响应，都愿意举家与他同行。'
