- pgno: 81
  md: '# 张仪：看我怎么玩转话术


    > 好的谈判家和金牌销售有一个共同点——他们的对手（顾客）会觉得：这个人是真的“为我好”！


    张仪是先秦时期的话术高手。他本是魏国安邑人，拜著名隐士鬼谷子为师，成为其高足，后来入秦，成为秦国用来瓦解六国合纵的推手。所谓合纵，是指关东六国为了对付秦国而相互结盟，因六国基本呈南北分布，故而得名。


    秦国作为战国七雄中最强的诸侯，采用各个击破的战略对付六国绝对是游刃有余的，可是一旦六国联合起来，秦国的处境则会非常危险。如何解除秦国的危机呢？当然是分化瓦解。


    张仪先后出使六国，彻底瓦解了这个脆弱的联盟。我们不妨以张仪与魏王的一席话为例，来看看张仪是如何将言辞艺术发挥到极致的。张仪问魏王：“魏国与秦国比，孰强孰弱？”


    魏王回答：“秦国虽强，魏国仍可一战，况且我与韩、赵、楚、齐结盟，有何畏惧？”


    张仪微笑着说：“魏国士兵虽然善战，但魏国地方不足千里，士兵不满30万，与韩、赵、楚、齐接壤，守军不满10万人，而且地势一马平川，没有高山大河为屏障，此乃四战之地也。如何与秦国对抗？魏国固然与列国合纵，可惜一奶同胞尚且为了争夺财物反目成仇，更何况是反复无常的诸侯们呢？合纵是不足依靠的。魏国若不亲近秦国，秦军就会先占领河外，占据巷钧、酸枣这些地方，再袭击魏国，拿下阳晋，这样就割断了赵魏之间的联系。赵国不能南下，魏国不能北进，彼此不能相救，盟约还有什么意义呢？”


    一席话，让魏襄王背弃了合纵的盟约，投入了秦国的怀抱。


    我们回过头来看一看张仪是如何说服魏王的。首先，他列出了魏国自身的不足，先说其内部环境，版图不足千里，缺乏纵深，退无可退，一旦失败就是灭国；再说士兵不满30万，一片平原，缺乏地形优势，又是四战之地，可谓无依无靠、守无可守，能调动的资源非常贫乏。如此劣势，与强大的秦国为敌，显然是自寻死路。其次，他罗列'
  merge: -1
  img_proc: true
- pgno: 82
  md: '了外部危机，列国都是见利忘义的角色，只为争夺利益，一旦有机会就会背盟，背刺先前的兄弟，根本靠不住。最后，他还对魏王实施了恐吓策略，假设秦军夺取了魏国重要的地方，就会将魏、赵二国分隔开，使结盟丧失作用。


    这一番话中，张仪一步步地将魏王引入话术的圈套，让他被牵着鼻子走，在魏国与合纵的盟国间撬开一道裂缝。张仪的话术能够成功，正是建立在他对魏国的深刻了解上。魏王任命他为国相，使得他对魏国的国土形态、人员构成、防御配备等情况了如指掌。实际上，他是秦国的间谍，取得魏国的信任是为了在战略上帮助秦国。


    张仪先后在秦、魏二国为相，又在楚国待了很长时间，得到了楚怀王的信任，并将怀王骗到秦国。他还用同样的套路、同样的话术，先后到韩、赵、齐、燕等国，几乎使全部诸侯都落入他的彀中。


    汉代时学家刘向说：“苏秦为纵，张仪为横，横则秦帝，纵则楚王，所在国重，所去国轻。”他们被哪个诸侯国所用，哪个诸侯国的地位就会上升，否则该国就会人去国衰。这是一个智者频出的时代，也是一个依靠一张嘴巴就能建立功勋的时代。'
