  md: '马，你却弄回来一堆马骨，这有什么用呢？”侍臣从容地说：“从前的国王张贴告示，三年都没有买到宝马，是人们不相信您会千金买马。现在，您连千里马的马骨都肯花五百金购买，得到真的千里马还会难吗？”果然，没过多久，就有好几个人牵着千里马来求售，国王因此得到了多匹骏马。


