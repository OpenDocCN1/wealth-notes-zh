- pgno: 230
  md: '国，非敢有害于天下也。高皇后闻之大怒，削去南粤之籍，使使不通。老夫窃疑长沙王谗臣，故敢发兵以伐其边。且南方单湿，蛮夷中西有西瓯，其众半赢，南面称王；东有闵越，其众数千人，亦称王；西北有长沙，其半蛮夷，亦称王。老夫故敢妄窃帝号，聊以自娱。老夫身定百邑之地，东西南北数千万里，带甲百万有余，然北面而臣事汉，何也？不敢背先人之故。老夫父雒四十9年，于今抱孙焉。然凤兴夜寝，寝不安席，食不甘味，目不视靡曼之色，耳不听钟鼓之声，以不得事汉也。今陛下幸哀怜，复故号，通使汉如故，老夫死骨不腐，改号不敢为帝矣！谨北面因使者献白璧一双，翠鸟千，犀角十，紫贝五百，桂蠹一器，生翠四十双，孔雀二双。昧死再拜，以闻皇帝陛下。


    这封信的内容基本上可分三部分，第一部分总结为“甩锅免罪”，第二部分为“示强显德”，第三部分为“示弱求存”。三部分合起来，构成一封非常高明的自我辩护和保护文件。


    先说第一部分，也就是将与汉王朝交恶这件事甩锅给吕后。他说是自己是外臣，在汉高祖、汉惠帝时期都保持了不错的关系，但吕后被小人所蒙蔽，听信谗言，在经济上对南越进行封锁，不卖给我们生活生产用的金属物件和铁器，卖给我们的马、牛、羊只有公的，没有母的，导致南越没有办法繁殖牲畜，牲畜都被老了。我认为是自己祭祀不够周到，上天降罪于我，所以派官员向汉朝谢罪，汉王朝都将他们扣留了。我还听说父母的坟莹被刨了，族人也被杀掉了。我后来出兵长沙国，是怀疑长沙王挑拨我与汉廷的关系，所以才攻击他。无疑，汉文帝背了这个锅，反正不是甩给自己的。赵佗也通过甩锅，把自己出兵骚扰汉境、进攻长沙国的罪名给撇清了。


    在第二部分，精彩的inner name来了。赵佗暗戳戳地说，我西面的蛮夷部落西瓯国，半数以上的人羸弱不堪，他们的头儿称王；东面的闽越，才有几千人，他们的头儿也称王；西北面的长沙国，一半人是蛮夷，他们的头儿也称王。我之所以在这一群蛮王里面称帝，不过是自娱自乐罢了。我治理的土地上有上百座城市，东西和南北的距离有千万里（这个夸张有些过分），我能指挥的甲士有上百万人，但还是向大汉称了臣。为什么呢？因为不敢背弃先祖。赵佗的意思是，那些只有几万人乃至几千人的家伙都称了王，我称帝只是图个乐而已。他还炫耀了一把自己的实力，并通过夸耀把自己推上了道德制高点。信中这一句非常重要，“然北面而臣事汉，何也？不敢背先人之故。”这里的'
