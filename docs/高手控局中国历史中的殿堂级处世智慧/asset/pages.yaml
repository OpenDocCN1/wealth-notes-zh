- pgno: 199
  md: '# 张宾：正确而果断的决策能力


    一次正确可能是运气，次次正确一定是能力。所以，当你偶尔正

    确时，先别骄傲，把正确延续下去，别人自然会看到你的价值。


    张宾是后赵开国君主石勒的创业伙伴。石勒在十六国时期的群雄

    中能有一席之地，与张宾的辅佐有很大的关系。张宾虽然是石勒的幕

    僚，但他却有创业团队中罕见且必需的魅力，那就是正确而果断的决

    策能力。这种能力堪称石勒集团的灵魂引导。


    石勒最初在汉赵（前赵）皇帝刘渊麾下效力。刘渊死后，他又效

    力于刘聪。永嘉四年(310)，石勒率领大军进据江汉平原，虎视东晋。

    张宾认为机会还不成熟，建议石勒率军北归。但石勒没有采纳这个建

    议，很快便军中缺粮，士兵的战斗意志很低。这个消息被东晋王导探

    知，于是派遣晋军反击。石勒大败，只好听从张宾的建议，返回北

    方。此后，张宾成为石勒集团的核心决策人物。


    汉赵政权在刘聪统治时期内部非常不稳，率军的大将多有异心，

    各自扩充势力。司隶校尉王弥一直想吞并石勒，因而经常给他送礼

    物，并装出很亲善的样子。


    张宾认为，王弥包藏祸心，要找机会除掉他。但王弥善战，令石

    勒十分忌惮。汉赵军攻陷洛阳，王弥得到了很多珍宝和美女，但他

    将它们送给了石勒。当时石勒俘虏了晋军骁勇善战的大将苟晞，任命

    他为左司马。王弥写信来祝贺：“您俘获了苟晞，并重用他，这太有

    胸怀了，让他在我的左、我在您的右，我们就可以天下无敌了。”张

    宾认为王弥势力大，但却频频示好，一定是别有所图，坚定了石勒并

    吞王弥的决心。


    王弥与武装流民组成的刘瑞交战，相持不下，请求石勒支援。张

    宾建议石勒出兵相助，以取得王弥的信任。在石勒的助攻下，刘瑞被

    击败。王弥以为石勒放下了对自己的戒心，因而也对石勒放松了警

    惕。石勒邀请王弥赴宴，身边的人都劝阻他，但他没有当回事儿。这

    是一场典型的“鸿门宴”，只不过石勒不是项羽，张宾也不是范亚

    父，二人果断行事，杀死了王弥，兼并了他的人马。'
  merge: -1
