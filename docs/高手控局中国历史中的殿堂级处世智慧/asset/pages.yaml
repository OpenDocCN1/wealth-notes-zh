- pgno: 196
  md: '# # 刘穆之：最受信赖的经理人


    > 世界上最稳定的关系，就是各取所需。


    东晋王朝的晚期，贵族政治朝着军阀政治转向。桓玄篡权，自立为帝。元兴三年(404)，北府军将领刘裕在京口起兵讨伐桓玄，寻求主簿的人才，刘穆之投入其麾下。主簿是掌管文书的佐吏，类似于秘书，职务不高，但由于与主官亲近，往往会成为主官的心腹人物。也就是从这里开始，刘穆之成为刘裕的合作伙伴，成为刘裕团队的经理人，为刘裕登上帝位提供了助力、奠定了基础。


    刘裕讨伐桓玄，得到了北府军将领刘毅、老将刘牢之的外甥何无忌的支持，于当年十二月底肃清了桓氏家族的势力。晋安帝归位后，下诏褒扬刘裕的功绩，升迁他为侍中、车骑将军、都督中外诸军事，“使持节、徐青二州刺史如故”。之后，刘裕的职权越来越大，共都督十六州诸军事。一同起兵的刘毅、何无忌都加官进爵，成为位高权重的大臣。此战中刘穆之谋划甚多，成为刘裕最为倚重的左右手。几乎所有大事，刘裕都会咨询他的意见。当时东晋的法令松弛，阀阅世家倚仗权势为非作歹，令百姓苦不堪言。刘穆之针对这种情况调整了法令，使刘裕率先以身垂范，从而极大地改变了社会风气。这展现了刘穆之良好的向上管理水平。


    义熙三年(407)，与刘裕关系密切的领扬州刺史、录尚书事王谧亡故。按席位顺序，刘裕接掌其官职。由于对权力的渴望，早先合作过的伙伴之间的关系已经悄悄发生了变化。南平郡公、豫州刺史刘毅不愿让刘裕获得坐镇中枢的权力，而是提出让中领军谢混接任扬州刺史、吏部尚书孟昶接任录尚书事，从而达到分权的目的。他派遣尚书右丞皮沈向刘裕通告自己的提议，皮沈先去见了刘穆之，向他透露了这件事和当时朝廷官员们的看法。刘穆之假装如厕，告诫刘裕不能顺从刘毅。


    对此，刘裕不是很明白。京口起兵时，孟昶也是刘裕的支持者，甚至倾尽家财支持刘裕起兵，所以孟昶算是自己人。刘穆之直言，扬州是朝廷的根基，录尚书事可以执掌中枢，东晋的天命已尽，如今刘裕已是骑虎难下，以他的地位，即便想做一个平民也不可能全身而退，只能尽力向前。刘裕接受了对刘穆之的谏言，入朝议事争取这个位置，接掌了王谧空出来的官职，从此掌控了中枢权力。'
  merge: -1
  img_proc: true
- pgno: 197
  md: '义熙五年(409)，刘裕北伐南燕，刘穆之作为智囊团成员随行。之后，刘裕荡平孙恩、卢循之乱，刘穆之也是重要的筹划者。刘毅一向不喜欢刘穆之，因而在刘裕面前诋毁他，说他权力太重。刘裕不但没有疑虑，反而把更多的权力交给刘穆之。


    刘毅移镇江陵，擅自扩充军事力量。刘裕上书朝廷，请求讨伐他，二刘由此决裂。刘裕出征后，留下刘穆之留守都城建康，充当自己的代理人。


    诸葛长民和刘毅一样，早先也是刘裕的合作伙伴。他也早有异心，刘裕征刘毅就让他非常不安。他向刘穆之试探道：“太尉（指刘裕）与我不睦，你知道原因吗？”刘穆之十分从容地说：“太尉出征在外，把老母和幼弟都交给你照顾，怎么会与你不睦呢？”就这样，刘穆之稳住了诸葛长民，使他一时间下不定决心起兵造反。刘毅被诛后，荆州、江州落入刘裕彀中。返回建康后，刘裕诱杀了准备反叛的诸葛长民，消除了京城建康的不安定因素。


    义熙九年(413)，在刘穆之的辅佐下，刘裕荡平了割据益州的谯蜀政权，使巴蜀重新回归东晋治下。随后，刘裕加授羽葆、鼓吹及班剑等20人。此后不久，刘穆之晋位为前将军，开府治事，成为执掌军事大权的重号将军。


    义熙十一年(415)，刘穆之晋升为尚书右仆射。府台的事，无论大小，都由他拿主意。次年，刘裕有了一统天下的雄心，于是起兵北伐，让世子刘义符监太尉留府。刘穆之镇守建康，不但掌朝中大事，还领监军、中军二府的军司。有了刘穆之在后方支持，无论是对长江以南局势的掌控，还是人员的协调、军械粮草的补给，刘裕都无后顾之忧。


    两年后，刘裕灭掉立国30多年的后秦，收复关中地区。他决定以此为基业，逐步统一北方。但是十一月份，传来刘穆之去世的消息。刘裕震惊不已，他知道自己丧失了最重要的支持。京师建康无可靠、能掌控大局的人，刘裕南北一统的梦想再也无法实现了。


    永初元年(420)，刘裕称帝，追封刘穆之为南郡郡公。在刘裕的事业发展中，刘穆之是他最得力的助手，是他打天下的经理人。在刘穆之的辅佐下，刘裕一步步控制了东晋局势，在内部消灭了篡权的桓玄家族，荡平了巨寇孙恩、卢循多年来的战乱，诛杀了不和自已一条心'
  merge: -1
  img_proc: true
- pgno: 198
  md: '的刘毅、诸葛长民，掌22个州的军事，成了东晋朝堂上最有影响力的人；在外部灭掉了割据的南燕政权、谯蜀政权、后秦政权，迫使仇池小王国把抢夺的汉中吐了出来。


    刘穆之早期担任的是纯粹的参谋职务，后来则走向前台，全盘负责政事、军事、人事。可以说，刘穆之就如同汉高祖的萧何、魏武帝的荀彧，既能为主上提供政治上的建议、做军事上的谋划，还能镇守后方，提供源源不断的人员和物资支持，是真正的全能型人才。当然，最重要的一点是，他能够与老板保持同一立场，为同一目标奋斗。'
