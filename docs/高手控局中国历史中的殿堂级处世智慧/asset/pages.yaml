  md: "# 李白：我曾照亮长安的夜晚\n\n你有两张社交名片:\n\n一张印在纸上, 写着你的信息; \n\n一张刻在人们心里, 记录着你的“价值”。\n\n\
    事实上, 当你有了第二张名片之后, 第一张名片便无足轻重了。\n\n说李白是大唐都城长安的第二社交明星, 无人敢居第一。\n\n李白的出身是个谜, 就连他自己写的\
    \ “简历” 里也讳莫如深。他说自己的远祖是凉武昭王, 也就是十六国时期的开国君主李晞。这么说, 他与大唐皇帝是同一个祖宗。但是说到祖上三代时, 他却语焉不详,\
    \ 除了知道父亲叫李客外, 再往上的亲属就不得而知了。因而后世推测, 这涉及唐王朝的一宗公案, 那就是 “玄武门之变”。后世认为, 太子李建成有一个儿子在这场政变中活了下来,\
    \ 跑到了域外, 李白就是他的后裔。玄宗时, 这场政治斗争已经过去了半个多世纪, 在中宗神龙年间, 李白一家已经悄悄回到蜀中定居下来。\n\n开元十二年(724),\
    \ 李白辞亲远游, 离开蜀地, 拉开了他一生的社交大幕。\n\n后人认为, 李白不但诗歌写得好, 还是一位剑术高手, 以诗剑并称 “双绝”。其实, 李白还有一绝,\
    \ 那就是交友。可以说走到哪里, 哪里就有他的朋友, 超级社牛说的正是他。\n\n友人吴指南病故, 他亲自安葬, 数年后还亲自为他改葬。在扬州时, 他一年散尽30万金,\
    \ 一方面说明他出手阔绰, 另一方面说明他是真的有钱。在陈州时, 他结识了书法家李邕, 之后又与隐居鹿门山的大诗人孟浩然结交。孟浩然比李白年长12岁, 但与李白十分投缘,\
    \ 两人经常在一起吟诗喝酒。从此之后, 他们的友谊伴随了李白的一生。再说了, 谁不愿意与高富帅做朋友呢?\n\n李白谈吐不俗, 又是一枚超级帅哥, 在安陆\
    \ (今属湖北) 引起了当地望族许家的注意, 前宰相许圉师的孙女许氏成了他的良偶。李白"
