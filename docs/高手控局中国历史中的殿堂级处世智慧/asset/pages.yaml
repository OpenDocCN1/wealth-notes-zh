- pgno: 57
  md: '# 韩安国：社交也是种领导力


    有时候，能“平事儿”比能“做事儿”更容易受到器重。这是因为，世上能做事儿的人已经足够多，但真正能平事儿的人却是凤毛麟角。


    西汉名臣韩安国是历史上著名的社交狂人，尤以结交高端人物著称，并以其社交能力一次次化解危机，成为领导的得力臂膀。韩安国是梁国成安县人，后徙居睢阳。他最初的BOSS是梁孝王刘武，被任命为将军。西汉实行的是郡国并行制，除了直属中央的郡县外，皇帝将宗亲分封为王，赏赐大批土地。这些王爷在封国内权力很大，不但可任命官职，而且可铸钱冶铁，拥有军队。汉景帝时，诸王发动叛乱，直接进逼西汉中央政府，这就是“七国之乱”。梁孝王的封地在河南，刚好夹在叛军与长安之间，于是他派遣张羽和韩安国抵挡叛军。二人不辱使命，挡住叛军三个月，从而使得汉廷有时间调动军队和物资，最终平息叛乱。自此，韩安国声名鹊起。


    韩安国的BOSS梁孝王是当朝皇帝汉景帝刘启的胞弟，是与皇帝血缘最近的王，因而受封的土地非常广阔。他的梁国，北以泰山为界，西达高阳，共有40余城，而且多数是大县。加之他在“七国之乱”中立下大功，地位更加宠荣无比。不过，发动“七国之乱”的吴王刘濞、赵王刘遂、济南王刘辟光……哪一个与皇帝没有血缘关系呢？哪一个地位不宠荣呢？种种迹象表明，汉景帝对这个亲弟弟已经有所忌惮。就连太后，也就是刘武的母亲，也拒绝接见梁国派来的使者，而这个使者就是韩安国。


    真正的高手，当一扇门被关上的时候，他会寻找另一扇门。韩安国正是这样的人。被太后与皇帝拒绝召见，韩安国便搭上了汉景帝的姐姐馆陶公主刘嫖的线。刘嫖告诉韩安国，梁王行为不检点，触怒了皇帝，故而皇帝不肯见梁国使者；至于太后，则是因此事迁怒于梁国使者而已。原来，梁王刘武自从立下大功后，自以为是皇帝的一母同腹，便开始有点几飘，出行时竟然使用和天子一样的仪仗与车驾。汉景帝认为胞弟有不轨之心，故而生了嫌隙。知道原因后，韩安国立马在馆陶公主刘嫖面前演了一出戏。他一边哭一边说：“太后对几子的孝心，皇上对弟弟的忠诚，为何不能明察呢？当初七国叛乱，函谷关以东的王国都联合起来向西进军，梁王想到太后和皇帝哥哥在关中，'
  merge: -1
  img_proc: true
- pgno: 58
  md: '便命令我们以死抵抗，经常因为担忧而流泪。他使用的仪仗和车驾也是当今皇上赏赐的啊，为了彰显荣耀，才在荒僻的小地方炫耀一下。平定七国叛乱，梁王是立了大功的，为何因一些小节而不怜惜他呢？”，


    馆陶公主认为韩安国说出了实情，因而对他青眯有加，并把他的话告诉了太后。窦太后很高兴地说：“我要亲自向皇帝转达。”汉景帝得知后，解开了心中的疙瘩，立刻接见了梁国派来的使团，并对每个人都进行了赏赐。窦太后、馆陶公主则单独给予韩安国重赏。由于韩安国此次出使的成功，梁王的地位不但转危为安，而且更加巩固。


    汉景帝是释然了，但梁王刘武的行为却丝毫未加收敛。他招纳策士公孙诡、羊胜为自己谋划，企图得到皇位继承人的身份，还派人刺杀了汉景帝的干臣袁盎，请求汉景帝封自己为皇太弟。汉景帝十分生气，派人调查这是谁的主意。得知谋主后，他便派官吏赴梁国缉拿公孙诡、羊胜二人。刘武竟将二人藏在自己的宫廷里，使得连续来了十批官员都抓不到人。韩安国求见刘武，对他说：“大王，您与当今皇上相比，有当年高皇帝与太上皇的关系亲近吗？”韩安国所说的高皇帝是汉高祖刘邦，太上皇则是刘邦的父亲刘太公。刘武回答道：“我与当今皇上是兄弟，高皇帝是太上皇的儿子，我比不了。”韩安国又问：“那当今皇上与临江王，与你相比呢？”刘武说：“临江王是当今皇上的儿子，我也不能比。”


    韩安国说：“那就对了，太上皇是高皇帝的父亲，尚且不能参与政事；临江王是当今皇上的儿子，犯了错还自杀了……为何您觉得可以超越他们，为所欲为呢？”


    刘武听后大汗淋漓，向韩安国认错，赶紧把公孙诡、羊胜交给了汉朝中央政府派来的官员。后来，公孙诡、羊胜二人自杀。韩安国再次化解了汉廷与梁国之间的嫌隙，其处事能力得到汉景帝和窦太后的注意。


    梁孝王刘武自知登上皇位无望，便郁郁寡欢，后来患热病去世了。其子刘买继承了王位。韩安国因为犯了小错，被罢免闲居在家。汉武帝即位后，他的舅舅武安侯田蚡担任汉朝太尉。韩安国就与田蚡结交，给他送礼物。在田蚡的举荐下，韩安国被召入汉廷，任命为北地都尉，后升迁为大司农。田蚡担任丞相后，韩安国被任命为御史大夫，成为朝廷的高级官员。'
  merge: -1
  img_proc: true
- pgno: 59
  md: '田蚡与魏其侯窦婴不合。窦婴圈子里的官员灌夫就借酒在田家的酒会上骂座，武安侯与魏其侯的争端闹到了汉武帝面前。汉武帝命令二人在长乐宫辩论。二人互相指责对方，抖对方的黑料，闹得恨不成样子。汉武帝十分生气，向韩安国咨询，韩安国回答道：“魏其侯说灌夫的父亲在七国叛乱中为国捐躯，灌夫本人也冲入敌营死战，身负重伤，立下大功，这些都是事实，不能因为借酒骂座就被判死刑；丞相说灌夫结交奸邪，欺压百姓，横行颍川，积累财富以亿计算，丞相的话也有实据。还请英明的主上自己裁决。”汉武帝对韩安国的回答很是满意。


    离开朝堂后，田蚡招呼韩安国上自己的车，很不高兴地说：“我对付一个秃老头，你怎么还言语那么犹豫呢？”田蚡是在埋怨韩安国没有明确地和自己站在同一战线上。韩安国说：“在皇上面前，魏其侯诋毁您，您应该摘下官帽，解下印绶，还给皇上，并向皇上请罪说：‘我因为是皇上的腹心，侥幸得到现在的官位，本就不称职，魏其侯所言太及时了，请求自解官职。’皇上听了您的话，会认为您有退让的美德，这样魏其侯不会因此而羞愧吗？怎么能像市井小人物一样互相攻击呢？”


    田蚡一听，说：“一时冲动，竟然没有想到这一点。”他不再责怪韩安国。后来，魏其侯窦婴、灌夫被杀，并且遭到灭族之祸。田蚡更加认为韩安国的话很有道理。


    从韩安国的一生我们可以发现，他是一个非常有军事才能的将领。但与一般征战于疆场的武将不同，韩安国有着很高的外交手腕，善于与上流人物往来，而且总能化解危机，使事情得到良好的处理。无论是汉景帝时期，还是汉武帝时期，他与内廷、外朝的关系都十分好。在一个组织系统里，他是典型的润滑剂式的人物，能够在各方关系中进行转圜，疏通芥蒂，因此非常重要，不可或缺。可以说，无论是梁孝王还是汉武帝，得到了韩安国这样的臣子，都等于得到了有力的臂膀。'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 顾荣：善待低微，是最有性价比的投资


    越优秀的人，越会保全他人的体面，让人感到舒服。只要他人有一技之长，就不能轻视他。眼界太窄，看不到他人的长处，关键时刻身边难免无人可用，实在是境界太低。


    顾荣出身吴郡四大姓“顾、陆、朱、张”中的顾氏，祖父是东吴丞相顾雍，父亲是宣郡太守顾粲，从小接受了良好的教育。西晋灭吴，顾荣和江南士族一起迁到洛阳，仕于西晋王朝。由于顾家在江南为士族领袖，故而到了洛阳后，他得到了北方士族的青睐，受到推荐，在朝中担任要职。顾荣很有父、祖的名士风，不会因出身显赫就轻视寒门之人，因而很受人们的尊重。


    西晋一统三国后，上层迅速腐化，贵族们终日饮宴。顾荣先后在赵王司马伦、齐王司马冏、长沙王司马乂、成都王司马颖、东海王司马越五位亲王执政时出任朝官，亲眼目睹了年轻王爷们为夺权而相互残杀场面，因而非常失望。他出身政治世家，但在黑暗的政治环境里毫无作为，只能终日饮酒以避祸，免得成为政治炮灰。


    一次，顾荣受邀参加一个高级别的宴会，与会的都是洛阳的达官贵人。主人准备了丰盛的宴席，每个客人都有仆人侍候，有个高大的男仆负责为顾荣烤肉。顾荣看到那人紧紧盯着烤肉，很是眼馋的样子，就将自己
    的那一份赠予他。贵族高官们看到他的举动，都笑了起来，认为他这样做有失身份。但顾荣不以为意，还说：“岂有终日制作烤肉却尝不到肉味的人呢？”然后，又将一壶酒赠予那人。


    当时，世家大族的身份极高，一些非世家出身的官员，连与他们同桌而坐的机会都没有，更不要说仆人了，待遇可谓天壤之别。但顾荣不这样认为，在他看来，即便只是宴席上的侍者，也应当获得尊重。


    八王之乱，导致整个北方社会开始衰败，北方大族渡江到南方寻求生存空间，这就是著名的“衣冠南渡”。当年与顾荣一起饮酒的贵族们，多死于战乱和流亡路上。逃亡的顾荣发现每当自己遇难，都有一个高大的身影帮助自己。顾荣感到奇怪，就拉住那人询问。那人说：“我正是您在宴席上赠予烤肉的人啊！”'
  merge: -1
  img_proc: true
- pgno: 61
  md: '正是因为当年的一个小小善举，顾荣得以保全性命。永嘉元年(307)，琅琊王司马睿移镇建业（今南京），顾荣被任命为军司马。由于顾氏家族百余年来在江南树立的人望，这个初具规模的小政权对顾荣十分尊崇。顾荣也不负所望，推荐江南大批人才为官，这为东晋的建立奠定了重要的人才基础。后来，顾荣去世，晋元帝司马睿追赠他为侍中、骠骑将军、开府仪同三司。


    顾荣虽出身高门大族，但是没有世家子弟的轻薄浮华，不看重浮名，能够折节与比自己身份低的人结交，这很可能是受到其祖父顾雍的影响。


    他举荐人，看重才能，不看重身份，故而能够选拔出一批真正的人才。他很清楚，西晋一统全国后很快腐化堕落，从内部瓦解，导致永嘉之祸，神州陆沉，根本问题在于人心腐坏，士族阶层整体堕落，重出身而轻才能，导致掌管枢机是一群无才无德之人。


    顾荣对仆人的态度，实际上反映了他在社交中秉持的一个理念，那就是不轻视比自己社会地位低的人，即便是仆人，也有可取之处。事实证明，这个仆人身上不但闪烁着忠信的光芒，而且勇敢，有感恩之心，这在任何时代都是非常珍贵的。顾荣对待仆人尚且能够如此，对那些真正的有才德之士，就更加毫无偏颇了。从这个角度来说，顾荣的社交段位之高，以及在团队中发挥的作用之大，绝对是国士无双。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 王猛：在交游中寻找有才能的合作者


    关系是“跑”出来的，门路是“走”出来的，脑筋是“动”出来的。一动不动啥也不干，结果就是没关系、没门路、没脑筋！


    王猛出身寒微，少年时后赵已席卷中原，东晋则偏安于江左。他和众多的北方人一样，遭遇战争与饥荒，颠沛流离，生活十分悲苦。尽管如此，他仍然手不释卷，以天下为己任。


    一次，他参加后赵司隶校尉徐统举办的宴会。徐统很赏识他，想征辟他为功曹。他很感谢徐统的赏识，但是拒绝了这次踏入仕途的机会，认为后赵此时虽然实力强大，但是内部危机重重，对自己来说并非一个好的时机。


    世事果如王猛所料。后赵在一年之中有三个帝王轮番上台，内部爆发了血腥夺权的战争。东晋永和十年（354），东晋将领桓温北伐，进兵关中，关中父老夹道欢迎。王猛想一睹桓温的风度，也去拜访了。


    桓温请王猛谈谈他对天下时局的看法，王猛一边捉身上的虱子，一边纵谈天下大局，旁若无人。桓温对他的气度和格局都暗暗称奇，因此道出了自己心中的一个疑团。他说：“我奉天子之名，统率精兵讨伐凶蛮之徒，为百姓谋取安宁，为何关中豪杰却不来我的大营投效呢？”


    王猛十分清楚，桓温此次北伐，目的在于靠军功谋求声望，并不是真的想为晋朝收复北方。因此，他直言不讳地说：“您率领大军不远千里而来，却不肯渡过灞桥收复长安，关中豪杰看不透您的心思，故而不来。”


    王猛一句话就戳中了桓温的心窝子。他之所以不肯进攻长安，是因为夺取长安会消耗他的实力，但夺取的国土属于晋朝，而不属于他。他虽进军中原，但也有留敌自重的想法。王猛的见识再一次让他折服，他很有感触地说：“江左没有一个人比得上您的才能啊。”桓温离开关中前，赠予王猛豪华的车马，希望他能随自己南归，帮自己成就大业，但是被王猛拒绝了。他虽与桓温结交，但无意辅佐桓温。他很清楚桓温虽身为晋朝臣子，但心怀篡逆之心，这在世家大族盘踞'
  merge: -1
  img_proc: true
- pgno: 63
  md: '的辽左首先就失去了道义上的支持，因而不可能成功。王猛有拯救天下的志向，但桓温并非他最好的选择。


    良禽择木而栖。青年时期的王猛，交游广泛，不乏上层人物，然而在乱世，他不会轻易地加入某个团体。早期参加社交活动，实际上是王猛为了方便他对各方人物做深入调研，以此发掘合适的伙伴。


    王猛与前秦尚书吕婆楼交好，他们经常讨论天下大事。当时前秦君主苻生是个暴君，动辄诛杀臣子，以致大臣们都很害怕他，宗室皇亲也离心离德。东海王苻坚素有拯救天下的大志，但是无人为他出谋划策，吕婆楼便向他推荐王猛。王猛与苻坚彻夜长谈，越谈越投机。苻坚欣喜若狂，将王猛比作诸葛亮。


    在王猛的谋划下，苻坚登上了皇位。苻坚因始平县豪门最多，难以治理，任命王猛为始平令。很显然，这也是苻坚对王猛治理能力的一次考验。王猛上任伊始，就诛杀了当地为非作歹的滑吏，只用了几个月就让始平秩序井然。苻坚很高兴地对他说：“你真的是子产、管仲一类的人物。”


    36岁时，王猛在一年之内连续5次升职，任尚书左仆射、辅国将军、司隶校尉，获得了与年轻时赏识他的徐统一样的官位（司隶校尉）。


    王猛虽然位高权重，但因为打击权贵时采取了铁血政策，因而在朝中树敌很多，被氏族贵族们孤立。名将邓羌战功卓著，但位在王猛之下，王猛却能放低姿态，故而邓羌对他十分尊重。甘露元年（359），王猛与邓羌为整肃朝纲，通力合作诛杀了违法的20多位贵族，由此吏治为之一清。苻坚也因此更加看重王猛，让他监督百官。


    在消灭前燕的战役中，王猛担任统帅，节制十员大将，率领6万大军东进。苻坚将其送行到长安的灞上，表示自己将率领大军为后援。王猛胸有成竹地说：“我扫荡残敌，犹如秋风扫落叶，大王您只要建造好给俘虏的屋舍就行了。”苻坚听了大喜。


    在此次东征中，王猛以6万精兵打破前燕的30万大军，夺取了前燕的重镇晋阳。在向前燕国都邺城外围发起进攻的前一个晚上，他派遣大将徐成查探敌情。徐成因未能按规定期限回营，被王猛下令处死。当邓羌和别的将军求情时，王猛并未答应。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '邓羌不满地回到自己的营帐后，王猛立刻赦免了徐成。邓羌认为，这是王猛给自己面子。当王猛下达军事任务时，他又向王猛要官，希望他能向苻坚进言，把司隶校尉的位置留给自己，王猛都答应了他。这令邓羌十分高兴。作战时，他率领诸将奋力厮杀，以一当十，击溃前燕大军，使对方损失5万人。


    扫平邺城外围的敌军后，前秦大军包围了这座著名的都会，前燕的君臣不得不开门投降。


    由于王猛在政治、军事上的一系列成就，苻坚任命他为丞相。苻坚经常说，自己遇到王猛，就像蜀汉先主刘备遇到诸葛亮，如鱼得水。在王猛的辅佐下，苻坚统一了整个北方，建立了十六国时期势力最强大的王朝。


    王猛的成就，一方面与其卓越的政治、军事才能有关，另一方面又和他善于社交有关。在没有出仕之前，他就与各方势力广泛交往，后赵、东晋、前秦都希望他能出来做官。但是他没有草率地做决定，就像高卧隆中的诸葛亮，对局势有清醒的判断，最终加入了一个能最大化施展自己才能的团队。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# ## 王导：长袖善舞的领头羊


    什么是社交向心力？简而言之，就是把自己的人弄得更多的，把敌人弄得少的。


    西晋短暂地统一了三国后，不久就陷入“八王之乱”的内斗中。匈奴、羯、羌、氐、鲜卑等部族纷纷建立了自己的政权，导致神州陆沉，司马氏丢掉北方的政权。东晋就是在这样的背景下建立起来的。


    东晋的建立，与名臣王导有很大的关系。无王导则无东晋，这也是“王与马共天下”的深层内涵。以建业（今南京）为都城的东晋，内部有多股大大小小的力量。把这些力量拧在一起，撑起一个新政权，王导这个领头羊的社交能力起了极大的作用。


    永嘉元年（307），安东将军司马睿还只是一个亲王时，王导就劝他移镇建业。建业原来是吴国的都城，西晋灭吴时，战争烈度并不大，以吴国末代君主孙皓的投降完成统一，因而未遭毁损，长江以南的经济也未遭到破坏。移镇建业，是王导替司马睿获取基本盘的第一步规划。吴国被灭后，江东士族成了二流，未能跻身晋朝上层，他们在本土的影响力并未下降。司马睿到建业，是带着自己的团队来的，属于客寓入主的政权。他们要扩大统治基础，还必须得到江东土族的支持。只有得到北来的流寓士族和当地土族的共同支持，政权才能稳固。因此，争取江东土族的支持，是王导的第二步规划。


    顾荣是东吴丞相顾雍之孙，贺循是东吴中书令贺邵之子，他们虽是前期贵族之后，但也是本土的士族领袖。因而，王导专门结交二人，与他们建立了良好的关系。吴地的士族阶层最初并不看好司马睿，但随着顾、贺二人向司马睿靠拢，风向立刻就变了。


    汉赵大将刘曜、王弥攻破洛阳后，俘虏了晋怀帝，西晋就此灭亡。王导于太兴元年（318）与江东士族一起拥立司马睿登上皇位，建立起东晋朝廷，重建晋朝的国祚。义兴周氏是江左的强族，周珪是原东吴名将周瑜之孙，很有军事才能，先后平定了石冰、陈敏、钱镠等人发动的三次叛乱，客观上对东晋朝廷的稳定发挥了重要作用。但由于朝中官位有限，北方士族多，因此朝中官位多为北方士族把持。周玘对此非常不满，密谋叛乱，但因事机泄露，未能成功，后来患急病而死。晋元帝司马睿想灭他的族，但王导认为，义兴周氏在江左影响巨'
  merge: -1
  img_proc: true
- pgno: 66
  md: '大，如果妄加屠戮，会引起更大的叛乱，最终不但没有追究周玘的罪名，反而赐予其谥号“忠烈”。周玘之子周勰因父亲留下的“报仇”遗言，也想作乱，但因为王导与周家交好，周勰的叔叔将消息泄露了出去，导致其密谋失败。周勰由此变得消沉，过量饮酒，最后死在临淮太守的任上。王导同样劝晋元帝不要追究其罪责，从而使得叛乱消弭于无形。


    当时，王导在朝内执政，哥哥王敦在外领兵，王氏兄弟权重，导致王敦野心膨胀。王敦多次向王导表示应该废掉司马睿，改立年龄较小的司马氏血脉，以便更好地控制，均遭到反对。盖因当时北方士族南下，与江东士族彼此牵制，司马睿是南北士族都认可的代理人，一旦王敦篡位，必然会打破这种平衡，遭到士族们的共同反对，王氏家族必将有灭顶之灾。江东富豪义兴周氏的叛乱，每次都被泄密，本身就反映出士族阶层寻求稳定的特点。因此，王敦作乱时，王导不但没有参与，反而竭力抵制，使其野心未能得逞，郁郁而终。


    王导先后辅佐了晋元帝司马睿、晋明帝司马绍。明帝驾崩前，诏命他和外戚庾亮一起辅政，但因庾亮是明穆皇后的哥哥，因而实际上是他说 了算。苏峻是北方的流民帅，此前被东晋朝廷此前征召抵抗过王敦，获得了很高的声望和地位。执政的庾亮对他不放心，想召他入朝，名义上是给他升官，实则是为了剥夺他对军队的掌控。王导不同意，认为这会引起苏峻的怀疑，从而逼迫他叛乱，但庾亮不听。王导见庾亮一意孤行，便劝他整顿军备，防守京师，庾亮还是不听。果然，苏峻害怕入朝遇害，就与另一流民帅祖约发动了叛乱，杀入都城。此时庾亮却乘坐小船逃跑了，只有王导和部分大臣守护着晋成帝。谋士劝苏峻杀掉王导等大臣，但因王导早已在各种势力中所做的铺垫，包括在苏峻心目中留下的德高望重的印象，苏峻拒绝杀掉王导。


    正是由于王导的平衡工作做得好，苏峻虽然发动了叛乱，但是并没有威胁到晋成帝的性命。


    后来，苏峻叛乱被平定，晋成帝复位。由于都城遭到严重破坏，有的大臣建议迁都到豫章，还有的大臣则建议迁都到会稽，但都遭到了王导的驳斥。王导认为，豫章和会稽的地理位置都很偏僻，一旦迁都，必定会丧失人心，北方的游牧政权必定会趁机渡江，到那时东晋王朝很快就会覆灭。事实上，这只是王导给出的一个比较冠冕堂皇的说法。真实的原因是，迁都是一次新的权力洗牌，会导致王朝在大乱'
  merge: -1
  img_proc: true
- pgno: 67
  md: '之后陷入新的动荡。平息苏峻叛乱，正是一个安定人心的好机会，宜静不宜动。最终，朝臣们接受了王导的提议。


    庾亮因为为苏峻问题上失策，请求外放，从而成为都督江、荆、豫、益、梁、雍六州军事的封疆大吏，同时兼任江、荆、豫三州刺史。随着时间的推移，蒙在庾亮头上的阴影逐渐消散，庾亮再度膨胀，不满王导继续执政，打算将他赶下台，但是遭到另一掌握实权的大臣郗鉴反对，他只好作罢。在平定苏峻之乱中立下大功的封疆大吏陶侃，也想将王导赶下台，他向郗鉴征求意见，同样遭到反对。就这样，王导辅佐了三代君主。


    王导的长袖善舞，使他能够平衡各方力量，挽大厦于将倾。后来，名臣谢安继承了他的施政方略，以平衡各方力量、拱卫皇室为基本方针，使得东晋政权拥有了100多年的国祚。王导的个人魅力，无论是在友方还是敌方，都具有春风化雨的力量，他堪称古代史上的社交大师。'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 刘渊：广结善缘，没有白铺的道路


    > 事到临头才想起临时抱佛脚，佛没踢你一脚，是因为佛境界高、脾气好。想要结在关键时刻能用得上的“善缘”，就要在平日里多种“善因”。


    刘渊是匈奴左部帅刘豹之子，也是汉赵王朝的开国皇帝。他以匈奴人的身份，建立了十六国时期的北方王朝，这一方面与他一流的军事水平有关，另一方面也与他卓越的政治才能有关。


    刘渊是一个典型的、被汉化的匈奴人，这一切都与曹操管理匈奴人的政策有关。东汉末年，南单于率领部众入塞，帮助东汉政府讨伐黄巾军，自此留在汉地。到曹魏时，曹操将匈奴分为左、右、南、北、中五部，每一部单独设部落帅，互不统属，从而削弱其势力。司马氏篡夺曹魏政权后，基本上延续了这一政策。当时左部驻地在太原的兹氏，右部驻地在祁地，南部驻地在蒲子，北部驻地在新兴，中部驻地在大陵。从大的范围来看，匈奴五部分布在晋阳的汾水和洎水流域，地属并州。为了加强控制，司马氏政权将匈奴各部的年轻贵族们集中到洛阳来学习，刘渊也是其中一员。


    刘渊的远祖据说是西汉时期匈奴冒顿单于。汉高祖刘邦曾将宗室女以公主身份嫁给冒顿，并相约为兄弟之国，故而西晋时匈奴左部贵族自称刘姓，以汉室后裔自居。


    刘渊年少时以孝顺知名，母亲去世时，他悲伤得泪流不止，不能自己。曹魏司空王昶很欣赏他的人品，派人去吊唁，自此刘家开始与北方世家大族结缘。少时的刘渊十分好学，拜上党大儒崔游为师，学习《诗经》《周易》《尚书》。他特别喜欢《春秋左氏传》和《孙子兵法》，到了能背诵的程度。他也喜欢历史，能与当时的学者讨论《史记》和《汉书》。太原人王浑（王昶之子）名望很高，曾公开称赞过刘渊。刘渊不惜以匈奴左部所产的宝马相赠，王浑让儿子王济回拜。刘渊与太原王氏三代为世交，也开始受到并州一些豪族的接纳。刘渊出手阔绰，不断以名马相赠，短短几年就在太原、上党一带有声望的世家中树立了良好的形象。


    刘渊博通经史，也很重视本族的弓马，经常跟随匈奴的骑士和射箭高手学习。他弓马娴熟，能够左右开弓，射连珠箭，在匈奴人中建'
