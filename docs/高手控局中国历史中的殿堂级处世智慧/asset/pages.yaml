- pgno: 90
  md: '其他门客都很厌恶冯谖，纷纷给孟尝君出主意，建议将他撵走。但孟尝君不为所动，派人调查了冯谖的家庭情况，得知他有一位老母亲，就让人送钱给他让他赡养老母亲。此后，冯谖就不再唱歌了。


    享受上等门客的待遇，当然要替老板干些力所能及的事。一次，孟尝君派冯谖到封地薛城去收税。临走前，冯谖问田文：“回来的时候，需要买点什么？”


    孟尝君说：“你看这里缺什么，就买点什么吧。”


    冯谖到了薛城，把向当地人征税的凭证都烧了。为此，百姓们都称颂孟尝君的仁义。冯谖回来后，孟尝君看见他两手空空，便问道：“你买了什么？”


    冯谖：“我为你买了义。”


    孟尝君虽然心中不悦，但也没有说什么。


    不久，齐王不再信任时任国相的田文，罢了他的官，让他回封地去。薛城百姓听说孟尝君田文回来了，都纷纷携老挈幼，出城十里来迎接他。这让田文真正产生了回家的感觉。


    齐王得知这件事后，认为田文在百姓中威望很高，是自己错了，因而重新将他召回，让他继续担任国相。田文这才深刻地意识到，冯谖高瞻远瞩，不是一般的员工，好在自已一直容忍他。从此，冯谖成了他最重要的谋士。


    冯谖深谙领导心思，适时地自己的需求间接地告诉领导，获得了应有的待遇。在合适的机会，他又为领导可能面临的危机提供了前瞻性的解决方案。这样的好员工，哪个老板不想拥有呢？'
