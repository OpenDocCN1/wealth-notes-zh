- pgno: 83
  md: '# 子贡：三寸之舌胜于百万雄师


    世上有两件难事：一是把别人的钱装进自己的口袋；二是把自己的想法装进别人的脑袋。事实上，如果你做成了第二件事，那么第一件事也就不难做了。


    子贡，复姓端木，名赐，是孔子的学生，为孔门十哲之一，可以说是一位话术大师。春秋晚期，田常逐步掌握齐国的政权，为了进一步提高自己的权力和地位，准备进攻邻居鲁国。孔子得知后，派弟子中的外交家子贡去救鲁国。


    子贡先到齐国，拜见了田常。他问田常：“听说大夫您准备讨伐鲁国？”


    田常点头。


    子贡说：“您这是把好处留给别人啊。”


    田常不明所以地问道：“请先生指教。”


    子贡说：“听说大夫您之前三次向齐王请封，都遭到了贵族们的反对和齐王的拒绝。您想想，如果进攻贫穷且离齐国很近的鲁国，您虽然很快就会胜利，但是壮了国君的声威，巩固了他的权力，您什么也得不到呀。”


    田常问：“那我该怎么办呢？”


    子贡说：“应该向南攻打强大的吴国。吴国距离齐国遥远，打输了，士兵们战死在外，减损了齐王在国内的形象；而且，贵族领兵在外，朝廷空虚，您也能更好地控制朝政。”


    田常说：“但是现在士兵已经被派去攻打鲁国，如果调转战车攻打吴国，他们对我产生怀疑，该怎么办呢？”


    子贡说：“这很容易解决。您先下令让齐军停止前进，我去吴国让吴王来救鲁国，您就有攻打吴国的借口了。”'
