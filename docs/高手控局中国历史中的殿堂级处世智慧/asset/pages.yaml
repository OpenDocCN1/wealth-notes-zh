- pgno: 173
  md: '公孙度在辽东的扩张行为，被曹操看在眼里。他派人封公孙度为武威将军，赐爵永宁乡侯。不过，公孙度的野心不止于此。在辽东，他的出行仪仗、使用的冠冕，都和帝王差不多。他虽然言辞放纵，说“我在辽东称王，要永宁侯何用”，实际上却接受了印绶。也就是说，面对曹操的招揽，他妥协了。他很清楚，实际利益最重要。至于名分，则可对内称王，对外仍是汉王朝的官员。曹操也明白，自己需要一个稳定的后方，只要公孙度接受了印绶，固守辽东，不从背后捅自己刀子，那就是自己的阵营。


    公孙度死后，其子公孙康成为新任统治者，继承了其父治理辽东的方略。当时，官渡之战已经结束，曹操命令张辽追击袁绍残余势力，顺便将海滨一带纳入自己的统治范围。张辽击破了柳毅的防线，并驱逐了他的势力。莒州丢失，使得公孙康不得不正视曹操的强大。


    所以，当袁绍的两个儿子袁尚、袁熙逃到辽东后，公孙康便诛杀了二人，并将其首级献于曹操。公孙康的退让，得到了曹操的认可。他向汉献帝上奏，封公孙康为襄平侯，授左将军。需要注意的是，左将军这个职务，也是刘备在汉廷获得的显赫官职。很长一段时间，他打的都是这个旗号。


    由于中原纷乱，移民到辽东的人非常多，这导致辽东地区人口膨胀，原来臣服于公孙氏的一些胡人受到挤压，纷纷奔向高句丽，从侧面壮大了高句丽的势力。公孙康认为高句丽收罗逃人，图谋不轨，因而于建安十四年(209)出兵高句丽，攻破其国都，将势力延伸到了朝鲜半岛，在那里设置了带方郡。这一时期的公孙氏，统治达到了巅峰时期。虽然对内如同帝王，但是在与汉廷（曹操控制的朝廷）的关系上，却始终扮演着臣属的角色。公孙度、公孙康父子深知，以他们的实力，还不足以与曹操正面对抗。


    公孙康死后，他的儿子们都比较年幼，所以由弟弟公孙恭统领辽东的势力。曹丕登上皇位后，封公孙恭为车骑将军、假节，封平郭侯，从明面上给予了他极高的荣宠。在魏、蜀、吴三足鼎立的格局下，辽东的重要性不言而喻，它必然会被各方拉拢。


    后来，公孙康的儿子公孙渊因怒于公孙恭，自立为辽东太守。曹魏大臣刘晔向魏明帝曹睿建议，公公孙渊夺权，立刻讨伐能够顺利解决辽东的割据问题。但曹睿思虑良久，没有接受这个建议，反而封公孙渊为扬烈将军、辽东太守。这等于认可了他的夺权行为。'
