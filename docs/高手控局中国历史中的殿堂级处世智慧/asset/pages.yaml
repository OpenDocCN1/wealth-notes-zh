- pgno: 25
  md: '# 司马懿：弯得下腰，抬得起头


    败而不耻，败而不伤，何败之有？胜而不骄，胜而益强，方为常胜！


    赢家从不把一时胜败挂在嘴边，他们只要最终的果实。


    司马懿在三国群雄中虽是后起之秀，但也是最大的赢家。


    总结司马懿的成功之道，可用八字概括：弯得下腰，抬得起头。


    司马懿出身士族世家，其高祖司马懿在汉安帝时官至征西将军，曾祖父司马量曾任豫章太守，祖父司马傫曾任颍川太守，父亲司马防曾任京兆尹，相当于首都特别市市长。可以说，他是妥妥的官五代。汉末群雄并起，有才能的人纷纷建功立业，但司马懿却躲着走。建安六年(201)，担任司空的曹操听闻他的名声，征召他出来做官。他自称有风痹症，不适合出仕。曹操晚上派人偷偷刺探，来人发现司马懿躺在床上，宛若不能动一样。这是司马懿第一次与高人过招，他拒绝了踏上仕途的机会。他深知，乱世身负奇才，同样是一种祸患，因而低调行事，遮蔽锋芒。


    时间去了整整八年，曹操已经完全掌控朝政，成了大丞相。他再次派人征召司马懿。曹操当然不相信司马懿有风痹症，便告诉给司马懿传书信的使者，如果司马懿再装病，就把他给我捆来。在拥有绝对实力的聪明人面前“装象”，无异于找死，所以这次司马懿乖乖地来了。


    在最初的十年里，司马懿一直充任的是掌奏议或参谋性质的官职，如文学掾、丞相主簿、黄门侍郎、议郎等职。曹操作为一个强人，有独特的人才管理模式：一方面，招纳各种牛人加入自己的团队；另一方面，又将可能挑战自身权威，并可能借助自身资源发展壮大的强人清除出局。


    从人脉共有的角度来说，在一个团队中，中层管理者是团队运行的实际操控者，他既是团队最高管理者的下属，又是下层员工的领导。也就是说，他与最高层的领导共同拥有下层资源和人脉。司马懿出身河内郡望族，祖辈数代为高官，是汉末士大夫中的顶流，因而有'
  merge: -1
  img_proc: true
- pgno: 26
  md: '巨大的影响。曹操将他吸收进自己的团队，既要用其才智，又要防止他成为竞争对手。相比较而言，对于那些在战场上厮杀的将军，无论是能独当一面的于禁，还是能冲锋陷阵的张辽，只要根据贡献不断晋升就可以，管理起来相对容易些。


    在曹操的团队中，司马懿并非唯一的士族顶流。比如陈群，出身颍川陈氏，堪称士族阶层的扛把子。同样，曹操最初给他的任命也是属官，司空西曹掾，其发迹路径与司马懿有着高度的相似性，虽然升迁速度比司马懿快得多，但出掌的多是议事和监察。这就是说，曹操无法避开士族顶流，他需要士族的代言人与自己共同创业，因而不会将注意力只放在司马懿一个人身上。司马懿也意识到曹操对自己是士族顶流的忌惮，因而既在合适的时候为曹操献奇谋，同时又夹着尾巴做人，保持低姿态。当然，姿态低并不代表闲着，他与曹操的儿子曹丕建立了良好的关系，并将之作为自己发展道路上最重要的投资。


    在曹不被立为世子，也就是曹操的继承人这个过程中，司马懿是智囊团成员之一。曹丕称帝后，作为回报，他任命司马懿为尚书，后来转督军、御史中丞，爵封安国乡侯。我们再来拿他和陈群做个比较。曹丕称帝时，晋陈群为尚书仆射，加侍中，徙尚书令，爵封颖乡侯。陈群与司马懿的封爵一样，都是乡侯，职位上都是以朝臣身份辅佐政务为主。


    无论是魏文帝曹丕的时代，还是曹丕之子、魏明帝曹睿的时代，司马懿的做法都是弯低腰，尽好下属应尽的义务。他很清楚，文帝、明帝所掌握的政治资源和人脉优势，对他都是碾压性的，只要他有任何不轨和妄动，一纸诏令就能使他丧失所有，因为二帝的政治权威不可撼动。一旦最高管理者的权威下降，次一层的领导者势必会借机而上。


    从某种程度上说，司马懿的体格天赋也占了优势，那就是活得够长。曹丕生于187年，司马懿生于179年，比曹丕还要大8岁，结果他不但比曹丕活得长，而且比曹丕的儿子活得还长。可能曹操的基因在曹操这里出了问题，曹丕也好，曹睿也罢，都没能活过40岁。文帝、明帝父子二人，只要有一个活到曹操的年龄，基本上就没有司马家什么事了。所以，对创业者而言，身体也非常重要，不然就是在为他人做嫁衣。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '尽管文帝、明帝时代司马懿扮演的仍旧是弯腰打工的角色，但还是有区别的。在曹丕时代，司马懿要么担任朝臣，要么留守后方，从未拥有大兵团的统兵权，可见曹丕和其父曹操一样，对司马懿仍旧是用，但也防范。在明帝时代则不一样，蜀汉方面来犯，明帝会派遣司马懿抵御蜀汉；孙权来犯，明帝会派司马懿抵御孙权；公孙渊自立为王，明帝会派司马懿镇压公孙渊。可以，东南西北哪一边有战事，明帝就派遣他去哪一边。表面上看，司马懿扮演的是救火队长的角色，实际上他不断“借壳上市”，在军中扩大自己的政治影响力，与将士们建立了深厚的感情。当然，大力提拔亲信为军队将领是必不可少的。


    所以，当曹睿驾崩、司马懿被任命为托孤大臣之一后，他的影响力已经无人可敌。但他依旧韬光养晦，因为他在等待一个机会，那就是曹氏政权的权威下降。所以从239年到248年，他依旧做一条蛰伏的巨龙，等待着这个机会。掌握着巨大政治资源的曹氏宗亲，在这些年都做了什么呢？在与蜀国的战争中，他们不听建议，吃了大败仗；在与吴国的战争中，还是不听建议，再次吃了大败仗。在朝堂内部，专权和腐败导致其阵营分化，曹爽竟然采用邓飚的谋划，强行将魏明帝的遗孀郭太后（魏帝曹芳未成年，故而郭太后有巨大的影响力）迁到永宁宫软禁起来，置于自己的对立面。


    嘉平元年(249)正月，魏帝曹芳率领大将军曹爽、中领军曹羲等人离开洛阳去祭拜高平陵（曹睿的陵墓）。接下来的一切堪称神操作，显示了司马懿对人情世故的洞察力。他命令担任中护军的儿子司马师率领屯兵控制京师，之后立刻把被幽禁的郭太后请了出来，并启奏废掉曹爽兄弟辅政大臣的位子。郭太后几乎没有犹豫，立刻就同意了。


    这里必须说说郭太后。郭氏原本是曹睿的嫔妃，明帝临死前才被立为皇后，这实际上是曹睿死前的顶层设计。《三国志》中记载：“值三王幼弱，宰辅统政，与夺大事，皆先咨启于太后而后施行。”郭太后有最高的顾问权限。这是一个由内廷代表郭太后、宗室代表曹真、大臣代表司马懿组成的“三驾马车”，互相制衡，谁也不能独大。但曹真偏偏打破了这个设计，还把郭太后置于自己的对立面。司马懿很清楚，身为外戚的郭太后，一直在等待机会。所以，迎奉郭太后出来后，他立刻就获得了支持。


    当时留守京师并在军队中有影响力的朝廷大佬大有人在，比如大司农桓范、司徒高柔、太仆王观、太尉蒋济等。桓范立刻就洞悉了司'
  merge: -1
  img_proc: true
- pgno: 28
  md: '马懿的意图，因而第一时间逃出洛阳，去向曹爽报告。司马懿则让高柔假节，行大将军事，统领曹爽留下的军队；让王观行中领军事，统领曹毌留下的军队。他还对高柔说：“你现在就是我们的周勃啊！”


    熟悉西汉史的人都知道，汉初以周勃为首的武将与陈平、陆贾等文臣联合，诛杀了专权的吕后（此时吕后已死）家族，其根本原因就在于吕氏集团压缩了功臣集团的利益，实际上是功臣集团另立皇权的政变行为。高柔、王观等人并非太尉蒋济那样的曹氏铁杆，而且司马懿给他们制造了一个假象：他们能改变曹爽专权的局面，重塑秩序，找回原来的利益。所以，高柔与王观一边倒地支持司马懿，愿意与司马懿合作。


    控制住了京师内部的朝堂众臣，司马懿立刻派兵在洛水浮桥边迎接魏帝曹芳。桓范看清了司马懿的意图，劝告曹爽与众臣一起保护曹芳去许昌。那里是当年曹操劫持汉献帝建立政权的根据地，曹家在那里依旧有着较大的影响力。只要皇帝在自己手中，他就可以发布圣旨，征调天下兵马勤王，灭掉司马懿。应该说，这是个很有战略性的建议，奈何曹爽不听，而是派侍中许允、尚书陈泰查探虚实。司马懿趁机陈说曹爽的罪行，并让许、陈二人对曹爽交出权力。


    事实上，许允、陈泰都是曹魏的铁杆支持者，为何会劝曹爽放弃权力呢？这是因为曹爽兄弟的无能与其败迹二人也看得出来，他们忠于的是曹魏，而不是曹爽，实际上间接帮了司马懿。当时的曹爽手中不但有皇帝，而且有朝中一半以上的重臣，因此不但能借助皇帝的权威，还能借助朝臣的运作能力。他派遣许允、陈泰的行为，等于是自行瓦解己方阵营。在司马懿一波又一波的外交攻势下，曹爽回去交权了，还天真地以为能保住富贵。无怪乎桓范哭着大骂他：“曹子丹佳人，生汝兄弟，犊耳。”（曹真是牛人，怎么生了你们这些蠢蛋啊！）


    皇帝和朝臣们回归京师后，司马懿立刻下令抓捕了交权的曹爽，并灭了其亲信何晏、丁谧、邓飏、毕轨、李胜、桓范三族。此时，司马懿依旧扮演着“汉初功臣消灭诸吕”的正义者的角色，毕竟很多大臣还是曹魏政权的拥护者。


    在此次政变中，作为领导者，司马懿获得了更加尊崇的地位，但他再次放低姿态，称病不上朝。为此，皇帝不得不一次又一次去他的府上咨询大事。因为他需要继续麻痹朝臣，等待一个打击曹氏诸王的


    公众号懒人搜索，懒人专属群分享'
  merge: -1
  img_proc: true
- pgno: 29
  md: '机会。机会很快就来了。车骑将军王凌见魏帝曹芳对司马懿言听计从，司马家的府邸俨然朝廷中枢，因而密谋拥立楚王曹彪为皇帝，准备再来一次政变。司马懿立刻行动，上奏皇帝灭了王凌三族，并命令有司讨论曹彪的罪行，逼得曹操留下的这个英武的儿子自杀。司马懿借口曹魏分封到各地的诸王不利于正统，因而将他们全部迁到邺城，并命人监视，不准互相交流。


    打击了曹魏宗室后，朝臣们很快分化为两派：一派是曹魏的铁杆，另一派是司马氏的支持者。司马懿对自己的支持者加官进爵，将曹魏的铁杆边缘化，把他们逐渐踢出朝堂，或者让他们退休。就这样，司马懿架空了魏帝。此时的司马懿俨然当年的曹操，只是他没有接受丞相的任命，也没有接受加九锡（这几乎就是给篡位者准备的）的特殊礼节就去世了。他的影响力留给了两个儿子司马师和司马昭。最终，在司马家的第三代司马炎手中，改朝换代得以实现。


    司马懿的一生中，最重要的一点就是弯得下腰杆。对曹魏的前三个大恺——曹操、曹丕、曹睿自不用说，对能拉拢利用的朝臣们，他仍然如此。保持低姿态，一则麻痹了敌手，二则让盟友接受了自己。但在该抬头的时候，司马懿也毫不畏缩，而是果断出手，展现了其性格中的另一面。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 曾国藩：笨小孩的核心力量


    > 在你还没有足够的实力时，与其热衷于那些无用的社交，不如提升自己。你自己的层次，决定了你所处的社交圈的层次。记住，你永远只能和与你同一个层次的人在一个圈子。


    曾国藩出生于湖南长沙湘乡荷叶塘白杨坪的一个普通农家，小时候并不算聪明，然而他一生中在社交场上纵横捭阖、领袖群伦，被各大佬视为领头羊。那么，他的核心社交力量是什么呢？


    曾国藩一向不觉得自己是个聪明人，有一个故事足以证明这点。小时候，一天晚上，曾国藩进书房读书前来了一个贼，这个贼听到门外来了人，就躲到了房梁上，想等主人睡着后再离去。曾国藩进了书房后，点上灯便开始读书，一篇文章读了几十遍，依旧背不下来。躲在房梁上的贼实在耐不住性子跳了下来，指着他的鼻子骂他笨，并将那篇文章背了下来，然后抢过曾国藩手里的书扔在地上，夺门而去。原来那个贼在房梁上听曾国藩读了一遍又一遍，听都听会了。问题是，这个聪明的贼最后究竟如何了，无人知晓。曾家的这个笨小孩，仍旧是继续读书、考试，为他出将入相的梦想铺路。


    古代考试有所谓的“三大战役”，即秀才、举人、进士。有的人考了一辈子还是秀才，有人不停地考连秀才也捞不到。


    曾国藩的祖父叫曾玉屏，他对儿孙们的期望很高。曾国藩参加秀才考试的那一年，他的父亲曾麟书也一同参加了。父子同堂，也算是一段佳话，然而结局惨不忍睹，父子双双落榜，背着考篮和笔墨，徒步数百里，几乎是哭着回去的。然而，曾氏父子并不气馁，他们继续读，继续考，继续落榜……曾国藩连考了7次，23岁时才考秀才；他的父亲竟然考了17次，43岁时才榜上有名。曾麟书大概也知道自己不是读书的料，加之中了秀才也算是读书人，便不再考了，而是专心供儿子读书。


    对于这段考试时光，曾国藩回忆道：“府君（指其父）既累困于学政之试，厪后圣国藩以就试，父子徒步橐笔以干有司，又久不過。”'
