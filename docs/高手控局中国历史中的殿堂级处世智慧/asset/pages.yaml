- pgno: 87
  md: '待范雎话音一落，蔡泽立刻接着其话题说：“有胸怀的人，谁不想成就大业呢？商鞅成就了秦国的霸业，但遭到五马分尸；吴起为楚国变法图强，但被贵族们乱箭射死；文种成就了越王，但被赐剑自尽。这难道是成就大业的人所期待的吗？”


    蔡泽的话令范雎默然，他的神色变得十分沮丧。这是因为蔡泽戳中了长久以来困扰他的心事。范雎本是魏国人，是中大夫须贾的门客，一次随须贾出使齐国，听到齐襄王指责魏国反复无常，在当年燕国“五国伐齐”的战争中充当帮凶。作为使臣的须贾面对指责，竟然说不出话来。作为使团成员，范雎当即站起来反驳，其雄辩获得了齐襄王的尊重，使得魏国在外交上赢得了颜面。然而，须贾却觉得很丢脸，回国后便诬告范雎接受了齐国的重贿，给他安上了“通敌”的罪名。


    魏国丞相魏齐大怒，命人将范雎捆了起来，鞭打得奄奄一息后扔进了厕所里。下人们以为他命不久矣，就将他扔到了荒野里。有个名叫郑安平的人知道后，救了他，并将他藏了起来。郑安平得知秦国的使臣王稽来到了魏国，就想尽办法安排他和范雎会见。王稽认为范雎是个贤人，就将他带回了秦国。


    到了秦国后，范雎的身体逐渐恢复，他向秦昭王上书自荐，得到重用，成为相邦，制定了“远交近攻”的政策，为秦国开疆拓土，使秦国国力大增。随着范雎地位的上升，他的救命恩人郑安平和王稽也水涨船高。


    范雎向秦昭王极力称赞二人的能力：郑安平被任命为将军，王稽也从谒者（传达和通报事务的官吏）一跃成为封疆大吏河东郡守。


    然而，在秦赵大战中，郑安平和他的两万大军被赵军包围，郑安平随即投降赵国，被封为武阳君。王稽的结局更惨，他被下属告发私通诸侯，被弃市处死。由于春人不当，范雎有了政治污点，这令他惴惴不安。蔡泽用商鞅、吴起、文种三人的结局，来暗示范雎应该懂得功成身退。范雎立刻改容，很恭敬地向蔡泽施礼说：“请先生救救我吧。”


    蔡泽说：“《周易》上说，亢龙有悔。君子应该懂得水满则溢、功成身退的道理。”'
