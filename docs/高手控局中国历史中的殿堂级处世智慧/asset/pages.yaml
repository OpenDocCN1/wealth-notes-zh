  img_proc: true
- pgno: 225
  md: '# 汉文帝：处变不惊才能游刃有余


    决定你成为一个怎样的人的，不是你的能力，而是你的选择。


    汉文帝刘恒即位的第三年，匈奴发兵入侵汉境。文帝命令丞相灌婴为帅，挥挥汉军反击，自己也到太原去视察。济北王刘兴居得知文帝在太原的消息，趁机发动了叛乱。济北王是文帝刘恒上位的推手之一，此时为何造反了呢？对外有强敌、内有叛贼的情况，文帝是如何处理的呢？


    吕后死后，谣言说宫里的孩子，包括少帝都不是汉惠帝的儿子，皇位血统可能被吕氏替换，因此大臣决定除掉吕后家族的吕禄、吕产等人。刘邦的庶长子刘肥被封为齐王，其长子刘襄继承齐王王位，三子朱虚侯刘章、三子东牟侯刘兴居则居住在长安，刘章、刘兴居想拥立哥哥刘襄为皇帝，故而在长安充当内应，让刘襄在齐地起兵，为外援，这样就如朝中大臣的想法不谋而合。


    吕禄、吕产等吕氏族人被杀后，周勃等大臣一商量，认为齐王刘襄的外家驺钧很凶暴，害怕又出来一个翻版吕后，因而立刘襄为帝的议题被否决了，迎立了母族较弱的代王刘恒，也就是汉文帝。


    尽管兄长刘襄没有当上皇帝，但大臣们承诺事成后封二人为地盘极大的赵王和梁王，故而，汉文帝被迎入宫前，刘兴居和汝阴侯夏侯婴一起入宫，将汉惠帝年幼的儿子赶出皇宫，说他不是刘氏血脉，后来这几个孩子很快就被诛杀了。


    文帝即位后，得知刘章、刘兴居曾有拥立刘襄为帝的打算，就压下他们的功劳，把齐国的城阳郡（十余个县）分割给了刘章，封他为城阳王。又将同属齐国的济北郡（约十个县）分割出来，封给刘兴居，是为济北王的地盘。这样的小号王爷，地盘是从大哥的土地上划出来的，当然无法与有几个郡、几十座城的赵、梁相比。碍于文帝宝座已经坐稳，刘襄、刘章、刘兴居三兄弟只好咽下这口恶气。刘襄无缘皇帝宝座，在文帝元年就郁郁而终。英风绝伦的年轻王爷刘章同样没活多久，在被封王的第二年也去世了。老三刘兴居始终不甘心，他像一头躲在草丛里伺机而动的豹子，在等一个机会。很快，这个机会就出现了。'
