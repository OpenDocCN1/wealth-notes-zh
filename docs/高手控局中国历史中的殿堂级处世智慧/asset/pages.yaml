  img_proc: true
- pgno: 239
  md: '# 刘备：苦心孤诣，做大自己的品牌


    你要搞清楚自己人生的目的——不是父母生命的延续，不是子女的“前传”，更不是其他人的点缀。对待自己的生命，不妨大胆一点儿，既然你终究会失去它，不如勇敢做自己。


    刘备自称大汉皇叔，是中山靖王刘胜的后裔。我们来看看他这个皇叔的含金量有多高，刘胜是西汉第六个皇帝汉景帝刘启的儿子，汉献帝是东汉皇帝，两汉之间还夹着王莽的新朝，刘备的皇族先人与汉献帝之间隔了300多年。刘备与汉献帝的血缘之远，说是八竿子打不着也不为过。从另一角度来说，刘胜有100多个子孙，刘备究竟是哪个小妾的后裔，估计他自己也说不清楚。但他深谱“名不正，言不顺”的道理，只要有了名头，剩下的就是奋斗。


    势力与名头相符，血统再稀薄，人们都会认这个皇室宗亲；德不配位，就算是皇帝的父亲，也会遭人轻视。为了获得与“正统之名”相符的势力，刘备苦心孤诣，在做大自己的品牌方面，可以说丝毫不输他那位老祖宗刘邦。


    刘备早期的生涯很像低配版的刘邦，军事人才有关羽、张飞、赵云，幕僚集团有麋竺、简雍、孙乾。关、张、赵可为一军之将，但乏统帅之才；麋竺善于经商，解决了刘备的财务困境；简雍有辩才，孙乾擅长外交。


    凭借这个班底，刘备小有成绩。但三国时代，群雄并起，各有精英班子，这与汉初陈涉起家、草莽英雄遍地的情况又有所不同。要打好“皇叔”这张牌，像袁术那样贸然称帝，是非常危险的。


    事实上，魏、蜀、吴三国的创业者，在称帝这件事上都非常克制，并且十分谨慎。曹操有称帝的资本，但终其一生，也没有走出这一步。孙权积家族三世之功，得父亲孙坚、兄长孙策之绪，江表虎臣之辅佐，江东诸多家族的支持，一直到建安二十四年，也就是吕蒙偷袭荆州，关羽身死，孙刘联盟破裂，仍然领受汉献帝册封的“南康侯”，以汉臣身份管理地盘。甚至在220年曹丕称帝、221年刘备称帝之后，孙权依旧接受了曹丕册封的“吴王”爵位。直到8年后的229年，孙权才最终称帝，撑起皇帝这个招牌。由此可见，在汉末要打出自己的帝王品牌，风险有多高。'
  merge: -1
  img_proc: true
- pgno: 240
  md: '刘备在汉王朝获得的最高身份是“左将军”，这也是他给麾下的文武官员册封时不得不发明一堆杂号将军的原因。曹操虽然擅权，但名义上大汉王朝仍在，他所册封的官员名义上都是汉朝的官员。要与这样的人竞争，有多难自然不必多说了。所以，在没有获得诸葛亮这种战略性人才之前，刘备依附过老同学公孙瓒，也就是赵云的前上司。后来又依附陶谦、曹操，还抱过袁绍的粗腿，受庇于刘表，甚至和吕布结盟。不过，这未必是坏事，这些年他的地盘虽然屡得屡失，但是他积攒了名望；虽然打了不少败仗，但却锻炼了他的业务能。


    其实，当时有资格称“大汉皇叔”的，绝不止刘备一个。益州牧刘璋、荆州牧刘表、兖州刺史刘岱、扬州刺史刘繇、幽州刺史刘虞都称大汉皇叔。刘璋、刘表、刘岱、刘繇是西汉皇室宗亲，只有刘虞是汉光武帝刘秀之子东海恭王刘彊的五世孙，血缘上与汉献帝最近。当然，这个近也是相对而言的。那么，为何这些人都败亡了呢？


    首先，刘备勇于一直扛起“皇叔”这杆旗子，屡仆屡起，不甘为他人门下，吸取失败经验，积累了军事素养和地方施政能力。其次，扩大基本盘，也就是借壳上市，早期依附公孙瓒，后来借荆州，其实是一个思路。从某种程度上说，夺取益州，也是这个思路的升级版。最后，尽可能地吸纳人才，这可以说是刘备最欠缺的。当然，自从得到诸葛亮，他在这一个方面得到了巨大加持。在远期规划上，有了明确的方向和目标，依旧不遗余力地吸纳人才。武将除了关、张、赵之外，黄忠、马超、魏延也加盟了。在综合性人才方面，有法正、李严、黄权等人。可以说，刘备的人才资源达到了巅峰时期。


    建安二十四年(219)，刘备夺取汉中，在群僚拥戴下，称“汉中王”。这个名号，正是汉高祖刘邦获得的封号。


    曹操死后，曹丕继承其父魏王的爵位，并在延康元年(220)逼迫汉献帝禅位，自己登上皇位。


    次年，刘备才登基称帝，以继承大汉统绪。从中平元年(184)24岁的刘备镇压黄巾起义开始，到称帝，他奋斗了整整38年。然而，仅仅登上皇位3年，他就因兵败夷陵，在白帝城驾崩。创业道路之艰辛，可见一斑。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '# 孙权：领导者具有的通达与权变


    人生最大的荒唐，就是在烂人、烂事上纠缠，它能耗光你所有的正能量。遇到烂人，及时抽身，遇到烂事，及时止损。


    建安五年（200），江东六郡的统领者、讨逆将军、吴侯孙策被许贡门客刺伤，伤重不治而亡。19岁的孙权，被东汉朝廷拜为讨虏将军，兼领会稽太守，成为东吴割据政权的实际领导者。孙策生前对弟弟孙权说：“举江东之众，决机于两阵（阵）之间，与天下争衡，卿不如我；举贤任能，各尽其心，以保江东，我不如卿。”


    事实是否真的如此呢？


    我们看看孙策给孙权留下了什么。当时孙氏在江东，统治集团大体分为三大派系。一是与孙氏有血缘关系的宗亲，如担任庐陵太守、平南将军的孙辅，他是孙权伯父孙羌的儿子；担任定武中郎将的孙暠，他是孙权叔父孙静的儿子；担任丹杨太守的孙翽，他是孙权的胞弟；担任庐江太守的孙河，是孙权的族兄。偏将军徐瑥，虽不姓孙，但他是孙权的表哥。此外，还有相当多的孙家宗族子弟担任军政两个系统的要职。二是孙权父亲孙坚的部将，如程普、黄盖、韩当、朱治等。孙权兄长孙策的部将，如周瑜、太史慈、蒋钦、周泰、陈武、董袭等。他们可统称为孙氏旧将。三是江东士族，尤其是以顾、陆、朱、张为首的四大家族，他们在江东数代为官，即便不在朝堂上，也是当地知识界的领袖人物，是真正的本土豪强。


    孙权要真正掌控江东，首先要镇得住这三大派系的人物，团结他们，为自己所用，毕竟一个人是不可能打天下的。除了内部环境外，与江东共用长江天险的荆州刘表，是孙家的死敌。孙权的父亲孙坚，就死于刘表的部将黄祖之手。黄祖与孙坚多次交战，始终窥伺江东，是江东的大敌。


    先说孙氏宗亲。这些人虽与孙权出于一脉，但未必忠诚于他，盖因都是孙氏子孙，所以自我感觉良好，觉得自己也有继承权，从而成为孙权的竞争对手。比如镇守乌程的孙暠，得到孙策的死讯后，立即发兵准备夺权，只因名臣虞翻的警告和威慑，才不得不打消重用。至于孙辅，更令孙权头疼。他虽是孙权的堂兄，在江东也受重用，但却与曹操眉来眼去，经常给曹操写信传递消息，几乎算是曹操的卧'
  merge: -1
  img_proc: true
- pgno: 242
  md: '底。既为孙氏宗室忠臣，为何吃里扒外呢？原来，孙权伯父孙羌生有二子，长子名叫孙贲，次子是孙辅。由于父母早逝，长兄孙贲抚养孙辅长大，故而视兄长如父。孙贲的女儿嫁给曹操之子曹昂，孙贲与曹操就成了姻亲，这样一来，孙辅与曹操也给了裙带关系。孙辅怀疑孙权的能力不足以守住江东，因而为自己做打算，向曹操通风。


    孙权首先从宗室动手，他召来孙辅，问道：“兄弟间有事，可以说个明白，为何想依托外人呢？”孙辅当然不肯承认通敌的罪名，孙权就让张昭拿出截获的书信递给他。孙辅只好认罪。孙权诛杀了孙辅的全部心腹，削减了他的部曲，将他罢职幽禁。过了几年，孙辅就在郁闷中去世了。孙权虽然罢黜了孙辅，但却不杀他，反而重用了孙辅的四个儿子。孙辅临死前醒悟，一再告诫子孙，要孙氏和睦。对于宗亲，孙权既打又拉，以壮大同宗势力。


    东吴旧将是孙权父兄的起家班底，孙权一方面树立自己的权威，另一方面恩威并用，能力强的重用如故，致仕退休的厚加赏赐。对于不听话的，则严厉打击，毫不手软。如庐江太守李术，本是孙策旧将，得知旧主死讯后，便对孙权三心二意起来，还悄悄收降纳叛。为了弄明白李术的真实意图，孙权亲自致信，要李术扣留那些逃亡者，并交给自已处置。不料李术竟然回信说：“有德见归，无德见叛，不应复还。”很显然，李术企图据守庐江，另做打算。孙权当即出兵，进击庐江。李术一方面闭城坚守，另一方面向曹操写信求救。对此，孙权早有对策。他也给曹操写了一封信，信中说：


    > “严刺史昔为公所田，又是州举将，而李术凶恶，轻犯汉制，残害州司，肆其无道，宜速诛灭，以惩丑类。今欲讨之，进为国朝扫除鲸鲵，退为举将报复怨仇，此天下达义，夙夜所甘心。术必惧诛，复诡说求救。明公所居，阿衡之任，海内所瞻，原敕执事，勿复听受。”


    原来，李术攻击扬州，杀了刺史严象，这件事可能是孙策指使的，但是从名义上说，李术也好，严象也好，都是汉臣，李术道义上的确有亏。种种迹象表明，李术野心勃勃，已经成了小军阀。当曹操收到这封信后，他并未对李术施以援手，就这样，李术败亡。李术的死，使得江表旧臣意识到孙权手段之高明。再说这些人大多是外乡人，要想身居高位，与江东本土豪族竞争，只能效忠于孙氏。反过来，孙权又可用这些人制衡江东本土士族。正是孙权的通达权变，江东出现了“江表十二虎臣”拱卫孙氏的局面。'
  merge: -1
  img_proc: true
- pgno: 243
  md: '在对待江东本土豪族的问题上，孙权是花了一番心思的。孙策活着的时候，用武力威服这些掌握舆论和资源的豪门，维持了表面的平静。事实上，这些人始终未能与孙氏一心，这主要是因为孙策没能把他们纳入自己的团队。


    孙策的死，背后就有江东豪族的影子。当年孙策荡平江东六郡，实际上是对当地上层力量的一次洗牌，必然会遭到豪族们的抵抗。以孙策讨庐江郡为例，当时的庐江太守是吴郡人陆康，他是江左四大家族中最具代表性的人物。孙策围攻两年，后来陆康病死，城池才陷落，陆氏族人，一大半罹难。此后，陆氏遗族虽然被孙策委任官职，但职非清贵。


    孙权掌权后，立刻任命陆康的儿子陆绩为秦曹掾，主管文武官员的议事。陆绩的长子陆宏后来担任郡尉，另一儿子陆粲则担任长水校尉。后来，陆氏家族的英杰成为东吴的柱国之臣，先后有三人都成为将相。陆康的族孙陆逊，在夷陵之战中击败了刘备，挽救吴国于危亡，成为吴国的大都督，后来出任丞相。陆逊的儿子陆抗，最后官至大司马，击退西晋大将羊祜进攻，诛灭叛将步阐，最后官至大司马、荆州牧。陆逊的侄儿陆凯，在吴主孙休时出任丞相，是最后的顶天白玉柱。其他陆氏儿郎，也都在孙权团队中任职，可谓人才济济。


    孙权表现出的虚怀以待的态度，使得原本对孙氏持观望或敌对态度的豪族，纷纷投效门下，从而扩大了其统治基础。无论是巅峰时期的刘备，还是国势鼎盛时的曹魏，都未能撼动孙权在江东的统治，其根本原因就在于东吴政权内部是稳固的。


    与孙权形成鲜明对比的是刘璋。刘璋的父亲益州牧刘焉，是汉室宗亲，政治地位比孙坚、孙策高得多，而且是由汉王朝亲自任命的，具有政治合法性。


    刘焉死时，刘璋面对的内部环境和外部环境，和孙权非常相似。内部有刘氏子弟、益州本土豪族、东州派。刘焉留给刘璋的家园，丝毫不输于孙权，益州八郡，汉中、巴郡、广汉、蜀郡、犍为、越巂、牂牁，可以说沃野千里、物阜民康。刘璋初掌权时的作为，的确可圈可点。当时，刘焉在成都的儿子除了刘璋外，还有三子刘瑁。


    刘焉活着时，南阳、三辅一带有几万百姓流亡益州，都被刘焉收为部众，称为东州派，法正、吴懿、费观就是这些人的代表。大量东'
  merge: -1
  img_proc: true
- pgno: 244
  md: '州兵进入蜀地，必然与蜀地本土豪强争夺资源，产生矛盾，故而刘焉将东州派培养成嫡系，血腥镇压那些敢于反对自己的人。刘焉以武力震慑益州豪强，与孙策打压江东豪强，几乎如出一辙。


    不过，东州派更看好刘璋。既然东州派属意刘璋，益州本土豪强就扶持刘璋，以赵骠为首的文武官员将刘璋拥立为主后，驻守在汉中的刘焉旧将张鲁首先表示不服。刘璋立刻杀掉留在成都的张鲁母亲（其父刘焉的情妇）和弟弟，除掉内线。之后，调任庞羲率领东州兵去巴西，与汉中的张鲁厮杀，消耗他们的力量。另外，刘焉旧将沈弥、娄发、甘宁也发动叛乱，刘璋便派赵骠镇压，沈弥等叛乱者败逃到荆州。之后，又令赵骠监视荆州方向的窥伺。等到赵骠回过神来，他发现刘璋已将他踢出统治核心，故而他与荆州方面和好，掉头来进攻成都。这时候，刘璋已经调整了自己和东州兵的关系，长子刘循甚至娶了庞羲的女儿为妻。所以，当赵骠的叛军进攻时，东州兵拼死抵抗，杀得赵骠大败。赵骠逃走后，被自己的部下杀死。


    就这样，刘璋稳住了局势。可以说，早期的刘璋身上有那么一点“英主”的影子。然而，祸患并未彻底消除。首先是汉中的张鲁，由于刘璋杀掉其母，因而结成败仇，他彻底成了独立小军阀。在益州内部，刘璋未能调和东州派与本土豪强之间的关系。当然，这与刘璋本人的素养有关。东州兵多豪杰，渴望建功立业，而外来户刘璋只安于做“土皇帝”，享受奢侈的生活，未能给东州派更大的施展抱负的机会。忠直之士如王累、黄权，都劝谏他不要招纳刘备，奈何刘璋不听意见。这样一群人，志向一旦不得伸展，就会选择新的主人。


    我们来看一看刘璋拥有的人才团队：文官方面，有法正、李严、邓芝、张裕、王累；武将方面，有张任、黄权、吴懿、孟达、吴兰、冷苞、吴班。张任有勇有谋，射杀了刘备的军师庞统；法正则足知名谋臣；李严和黄权都是文武兼备的综合性人才。如此强大的人才队伍，由白被刘璋拱手让给了刘备。


    刘备与刘璋一样，同样以客籍入蜀。我们来看他是如何任用这些人的。李严后来累官至尚书令并成为托孤大臣，黄权累官至镇北将军后来归入曹魏开府仪同三司，法正累官至尚书令、护军将军，邓芝累官至车骑将军，刘备娶了吴懿的妹妹、当时寡居的吴氏，她原本是刘璋哥哥刘瑁的妻子。这里有个故事，当年有人给吴懿之妹算命，说她有大贵之相，能够位至皇后，因而刘焉让其成为儿子刘瑁之妇，不料刘瑁早逝。'
