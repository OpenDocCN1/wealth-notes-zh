  md: '触龙说：“臣现在食欲不好，每天要走三四里路，才能吃下去点东西呢。”


    赵威后答：“你比我好多了。”


    这一番家常唠下来，赵威后彻底放松了警惕，脸色也好多了，不再绷着。


    触龙接着说道：“我有个小儿子叫舒祺，不大成器，我又老了，希望他能到宫里补黑衣卫士的缺，来保护太后您。我冒着死罪来说这个情，还希望太后您宽恕。”


