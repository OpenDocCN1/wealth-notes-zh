- pgno: 138
  md: '吕夷简很清楚，皇帝不会同意废除监军，战败的根本原因也不在于太监担任监军，而是不得人，斩杀了一个监军，表明了朝廷的态度，其他监军就不敢恣意擅权了。况且立即废除这项制度，会动摇整个边防。他向宋仁宗建议，不必废除监军制度，只需选合格的人即可。仁宗皇帝听了很高兴，让吕夷简拿出监军们的人选来。吕夷简解释说，朝廷禁止大臣与宦官交往，自己与宦官往来在士大夫中也犯了下大忌。况且自己从未和宦官们有往来，对于其贤愚也不甚了解，最好的办法是让宦官们互相推荐。下令推荐不得当者，与犯错的人同罪，这样一方面可以选出合适的人，另一方面也可以避免他们抱团舞弊。宋仁宗很是赞同吕夷简的办法，就照准了。之前朝廷对外派的宦官们进行了各种忠烈教育，企图用道德约束他们，但是他们仗着自己是皇帝的近臣，跋扈且擅权。自从采用了吕夷简的办法后，他们知道了利害，再也没有发生过作威作福的事。


    同样，在废除随军营妓上，吕夷简也从利害关系出发，而非空倡道德。宋军打仗时，军队经常带着营妓，也就是官办妓院的妓女，这严重影响了军队的战斗力。宋仁宗一直想改变这项陋习，可是这种漏习自五代以来就形成，已积重难返。刚好军营里发生了杀人事件，两个士兵因争风吃醋，杀死了一个营妓。吕夷简认为，这为处理这个问题打开了缺口。他没有处理那个杀人的士兵，而是问军营里为何会有妓女。此前遇到这类事，都是将杀人者处死。这也使得虽有恶性事件发生，但营妓们为了谋生还是会随军。吕夷简的这种处理方法，使得营妓们意识到自己的生命连最基本的保障也没有，都十分恐惧，纷纷离开了军营。就这样，这项陋习被彻底改变了。


    吕夷简几度被罢相，几度又回归朝堂，他不尚空谈，以务实著称，是仁宗一朝重要的辅弼大臣，得到了宋仁宗的极大信任。'
