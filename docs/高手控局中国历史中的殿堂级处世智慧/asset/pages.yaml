  md: '何等尊贵，就是历史上的伊尹、霍光也不过如此。您不能自轻自贱，让外人看了笑话。”


    郭子仪把这个年轻人扶起来说：“你小子懂什么，我的马厩里，领取官方补贴的马匹就多达500匹，我帐下拿国家俸禄的就有1000人，如果关起门来，守卫森严，让人们看不到王府内的情况，一旦有小人
    在皇帝面前说坏话，只怕会被灭族啊。如今大门洞开，坦坦荡荡，就是有人想诋毁我，皇帝也不会相信的。”


    后辈们听后，深以为然。


    郭子仪一生忠诚守信，低调做人。他的8个儿子，4个被封为国公。孙女郭氏嫁给广陵王李纯为妃，后来李纯登基为帝，郭氏被封为贵人，但因生下李桓（唐穆宗），她成了妥妥的太后。郭子仪的子孙
    中有5人娶了公主，连续几代都是外戚，成了唐王朝最显赫的家族。要 知道，在君主时代，皇帝一方面与外戚是姻亲，另一方面又防着外戚。隋文帝杨坚就是外戚，之后篡了北周皇帝的位。李唐王朝之所以
    如此信任郭家，是因为郭氏一门始终低调，不伸手动皇帝的奶酪。当 然，这与郭子仪的家风是分不开的。'
