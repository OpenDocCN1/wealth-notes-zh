- pgno: 220
  md: '# 田氏代齐：蚂蚁搬山的气概


    所有与众不同的人的背后，一定有那些不为人知的努力，要么是血，要么是汗，要么是大把无人问津的寂寞时光。


    “田氏代齐”和“三家分晋”一样，是战国时期的一件大事。齐国的开创者是辅佐周文王、周武王的姜太公（又称吕尚），然而姜氏齐国传了32任君主，到了齐康公时，他竟然成了最后一任君主。当然，齐国并未灭亡，只是君主不再是姜太公的后代，而是田和与他的后代。田和本人得到了周安王的认可，成为诸侯，他也被后世称为“齐太公”。那么，一个外国的臣子，是如何夺取齐国的君权的呢？


    田和的祖宗名叫陈完，本是陈国贵族，因遭受陈宣公的猜忌，便带领一家人逃到齐国。齐桓公任命他为卿，陈完禀告说：“我作为一个外国臣子，寄居在齐国，有幸不负劳役，就是对
    我的恩惠了，怎能担任高官呢？”桓公因而任命他担任工正，主管工程营建的官。因齐桓公曾赐田给他，他又称田完。从田完往下，田氏经过五代，到了田桓子，齐国也换了九个君主。到了齐庄公时期，田氏已经成了齐国响当当的贵族，齐庄公甚至将女儿孟姜嫁给了田桓子。也就是从田桓子开始，田氏贵族开始和齐国君主一系的贵族争夺权力，开启了夺权的漫长道路。田桓子为这个家族树立了领导典范。


    齐国的大贵族主要有三家，除了君主吕氏外，还有长期担任上卿的国氏和高氏。这两氏同为姜太公的后裔，属于齐国王室的旁系，是齐国的支柱性家族。田氏要取代姜姓的吕氏，必须削弱这两个家族的势力。


    齐景公临终前，让两大家族的当家人国夏、高张辅佐太子茶即位，是为晏孺子。田桓子的儿子田黯子一向与齐景公的另一个儿子阳生交好，想拥戴他做国君。这也是除掉国、高两家的一个机会。他表面上支持国、高二人为相，私下却在大夫中间散播不利于二人的消息。转头，他又对国、高二人说：“最初心腹之臣晏孺子，但你们俩支持他，如今大夫们人人自危，都想作乱。”通过这一番操作，他成功地恶化了国、高二人与其他贵族的关系。田黯子又煽动大夫们说：“高张掌权肯定不会放过你们的，不如趁早动手。”在他的怂恿下，大夫鲍牧和其他贵族手持武器冲入宫廷，目的就是诛杀国、高二。虽然晏孺子也被殃及，但他跑掉了。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '齐国无主，田鼋子将阳生从鲁国接回来，藏在 自己家里。他欺骗大夫们到自家赴宴，然后让阳生出来。大夫们都行了拜见礼，就这样，阳生被立为新国君。大夫鲍牧发觉自己中了圈套，非常生气地对其他大臣说：“你们忘了景公遗留下的命令吗？”这时候大夫们都想反悔，阳生发话说：“你们觉得我可以当国君就支持我，如果不合适，那就作罢。”鲍牧感觉形势对自己不利，赶紧改口说：“都是景公之子，当然可以。”就这样，阳生登上宝座，是为齐悼公。他让田鼋子担任国相，田氏从此登上大臣的巅峰。


    从田鼋子开始，田家世袭相位，极大地削弱了齐国的君权影响力。早在齐景公时期，老百姓向田家借贷粮食，是按照旧度量衡借的，还的时候，田家却允许按新度量衡还。旧度量衡是大斗，新度量衡是小斗，也就是说明放的多，但是还的少却。老百姓都感恩田家的恩德，齐国的民心从吕氏转向田氏。名臣晏婴就预测，将来田氏会代替吕氏，成为齐国的国君。齐景公问该怎么办，晏婴认为应该用“礼”来约束。一方面，加强管理，不许多大夫们损公肥私；另一方面，只准在自己的采邑施恩，手不能伸到国君的地盘上来。齐景公自己就奢侈无度，他尚且不能约束自己，又怎能要求大夫们自律呢？


    大夫鲍牧虽然勉强地认可了齐悼公，但二者的关系终究是磕磕绊绊的，因此，他干脆作乱杀了悼公。贵族们又让悼公的儿子即位，是为齐简公。


    齐简公任命田鼋子的儿子田成子和监止担任左、右相。监止一族的另一个贵族子我不满意田氏掌权，想诛杀田成子，还把这个消息告诉了田成子的远房族人田豹，并说杀了田成子后，准备让田豹填补田家留下的权力空缺。田豹一听，立刻将这个消息透露给了田成子。就这样，田成子发动反击，将子我和监止一起杀掉了。


    在诛杀子我时，齐简公想有所为，但太史子余却说：“田恒（即田成子）不敢作乱，他只是为国除害而已。”这样一来，简公就没有插手。不过，田成子得知这一情况后，为了以防万一，他干脆把齐简公也杀了，改立简公的弟弟为
    Country，是为齐平公。经过这一波操作，齐国有影响力的大夫和贵族被严重削弱，国君也被牢牢地掌控在田氏手中。


    田成子害怕自己的行为引起诸侯们的不满，因而极力取信于诸侯。他归还了齐国夺取的鲁国、卫国的土地，还与晋国的韩、赵、魏'
  merge: -1
  img_proc: true
- pgno: 222
  md: '三家大夫订立盟约。这样一来，他在诸侯中赢得了好名声。田成子还扩大了自己的封邑，使得田家地盘比国君拥有的还大。田成子有70多个儿子，后来全在齐国的城邑为长官（大夫）。


    齐康公吕贷即位后，沉湎于酒色，使其道德影响力进一步下滑。这位国君在位的14年间，彻底纵容田氏掌控齐国。田氏的当家人田和将齐康公迁移到海滨，给了他一座小城当食邑。


    齐康公十八年（前387），田和与魏文侯（周天子新册封的诸侯）会晤，请求他支持自己，代为向周天子申请，也认可自己的诸侯地位。魏文侯就是晋国的大夫上位成为诸侯的，他当然要支持田和。一年后，周安王对田氏进行认证，田氏从而代替了吕氏。田氏代齐，共经历10代，用了286年。


    从一个流亡贵族到一国之君，他们犹如蚂蚁搬山一般，一代又一代朝同一目标前进，毅力之坚韧，手段之诡谲，在古代政治史上也十分罕见。'
