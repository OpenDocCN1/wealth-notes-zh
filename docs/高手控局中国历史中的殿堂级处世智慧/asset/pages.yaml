- pgno: 45
  md: '# 赵仓唐：正确使用社交语言


    婉转的语言，适合说给有智慧的人听。而且，永远要记住——婉转本身不是目的，给双方留有足够的回旋余地才是目的。


    魏击是魏文侯的嫡长子，是魏文侯重点培养的继承人。在魏击年幼时，魏文侯就专门聘请子贡（孔子高足）的弟子、大儒田子方给他当老师。这使得魏击受到了良好的文化教育。魏国与秦国争雄，在西河发生激烈的战争。魏文侯任命魏击为将军，由他亲自领兵作战，夺取了秦国的繁、庞（约在今陕西韩城东南）两座城，受到军事的洗礼。


    魏国的国力不断上升，赵国的国力却持续下降，这是因为在赵国与燕国之间，由鲜虞人建立的中山国逐渐摆脱了赵国的压制，开始反击。早在赵襄子为赵氏当家人之时，他就夺取了中山国的代郡，形成钳形攻势，使得中山国无力扩张。到了赵烈侯时期，他对中山国的控制有所松懈，中山国反过来袭扰赵国，并取得胜利。为了灭掉中山国，赵国请求魏国与自己一起出兵。魏文侯同意了赵国之请，派遣乐羊为大将，太子魏击随军出战。魏文侯四十年（前406年），用了整整三年时间，联军终于灭掉了中山国这根赵国的后背之刺。


    魏国和中山国之间隔着赵国，魏国要控制这块好不容易得来的飞地，就需要派遣重要的人物镇守。因此，魏文侯将中山的灵寿（今河北平山）这片土地封给了立下大功的乐羊，封太子魏击为“中山君”，还派遣重臣李悝担任国相，辅佐魏击。从表面上看，太子魏击得到了魏文侯的重用，但实际上是被剥夺了继承人身份。中山国形式上是魏国的封国，是臣属之国，作为中山君的魏击名为封君，实则是臣。要想继承魏文侯的衣钵，魏击必须回到魏国的都城，这需要-个机会。


    三年后，这个机会出现了，它源于一个人—赵仓唐。


    赵仓唐成为中山君魏击的大臣后，问道：“您多久没有见主上了？”


    魏击说：“自从我被派到中山国来，就再也没有机会回去过，只是逢年过节写信而已。”'
