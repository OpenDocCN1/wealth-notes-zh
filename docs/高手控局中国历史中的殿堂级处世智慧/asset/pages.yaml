- pgno: 47
  md: '按照当时的贵族礼仪，只有身份相当的人之间才能比身高。与比自己身份高的人或社会地位比较低的人比身高，都是非常失礼的行为。所以，赵仓唐瞄了一眼那些侍从，答道：“身份不相等，臣不敢回答。”


    在魏文侯的心里，魏击是自己的儿子，所以说得很随便。而对于赵仓唐来说，魏击是自己的主上，得处处严格遵守礼仪。这也让魏文侯意识到，魏击不再是他的孩子，而是一个有身份地位的人，所以赶紧改口说：“和我比吧，他长到我的哪儿了呢？”


    赵仓唐说：“臣不敢。您赐给我家主上的衣服，都很合身，腰带也合适，不必增减尺寸。”魏文侯听了十分高兴，这个赵仓唐太会说话了。魏文侯与赵仓唐聊天的兴趣十分浓厚，问道：“中山君最近读什么书呢？”


    赵仓唐答道：“学诗。”（此处指学习《诗经》。）


    魏文侯又问：“他最近学习了哪几首诗？”


    赵仓唐答：“《晨风》和《黍离》。”


    魏文侯轻轻地吟诵道：


    > “

    窈彼晨风，郁彼北林。

    未见君子，忧心钦钦。

    如何如何，忘我实多！

    山有苞栎，隰有六驳。

    未见君子，忧心靡乐。

    如何如何，忘我实多！

    山有苞栒，隰有树榛。

    未见君子，忧心如醉。”'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 如何如何，忘我实多！


    这首诗出自《诗经》十五国风中的“秦风”，晨风是鸟的名字，诗中表达的意思是想起见的人却见不到，因而十分思念，忧心如醉，很不快乐，怪对方忘了自己。学习《诗经》是先秦贵族的必修课，也是社交必备。魏文侯当然熟知诗中意思，吟完后笑着说：“看来你家主上是埋怨我呀。”


    赵仓唐的回应很有意思：“我家主上时刻挂念着您，但绝不敢埋怨您。”


    魏文侯又吟诵起另一首诗：


    彼黍离离，彼稷之苗。


    行迈靡靡，中心摇摇。


    知我者，谓我心忧，不知我者，谓我何求。


    悠悠苍天！此何人哉？


    彼黍离离，彼稷之穗。


    行迈靡靡，中心如醉。


    知我者，谓我心忧，不知我者，谓我何求。


    悠悠苍天！此何人哉？


    彼黍离离，彼稷之实。


    行迈靡靡，中心如噎。


    知我者，谓我心忧，不知我者，谓我何求。


    悠悠苍天！此何人哉？


    这首诗的意思就更加明显了，是在埋怨父亲将自己扔到了远离国度的地方。但贵族的社交礼仪就是这样，有话不明着说，中间要隔着'
  merge: -1
  img_proc: true
- pgno: 49
  md: '一层，如果说得太过直白，不但显得粗鄙，而且会丧失回旋的余地。


    赵仓唐用这两首诗，明白无误地传达了魏击的意思。当然，魏文侯也懂了，当即让侍从准备一套衣服，放进衣箱里，嘱托赵仓唐带回去给中山君，临走时一再嘱托，一定要在天亮前送达。


    赵仓唐不敢怠慢，驾着车一路狂奔，在天亮前把衣服送到中山国，交给了魏击。魏击先对着赏赐的东西行了一番大礼，然后打开衣箱。


    只见赏赐的衣服乱糟糟的，吓得赵仓唐大惊失色，以为是自已走过于匆忙弄乱的。谁知魏击不但不怪罪他，反而笑着对他说：“快给我准备车马，君上召见我回去呢！”


    赵仓唐不解地说：“我走的时候，君上没有召见你的指令啊。”


    魏击也不多加解释，吟诵道：“东方未明，颠倒衣裳，颠之倒之，自公召之。”


    这也是《诗经》里的诗，名为《东方未明》。魏文侯命赵仓唐天明之前将衣服送达，而且故意将衣服弄乱，暗指“自公召之”。


    魏击准确地理解了父亲给自己的这个诗歌暗号。


    果然，魏击的出现，令魏文侯大喜。他召集臣僚，举行盛大的宴会欢迎二子的归来，并向大臣们告知，恢复其太子身份，改派另一个儿子去中山国镇守。在宴会上，君臣们弹琴饮酒，吟诗祝贺。魏击趁着酒兴，上前向魏文侯祝酒，并吟诵了一首诗：


    > 凤凰于飞，翙翙其羽，亦集爰止。


    > 蔼蔼王多吉士，维君子使，媚于天子。


    这是《诗经·大雅》里的诗，原本讲的是周天子出游，大臣写诗称颂。这里当然不是说魏文侯可比天子，而是借这首诗称颂君明臣贤，贤臣们聚集在明君的身边，犹如百鸟拱卫凤凰一般。这个彩虹屁，不但让魏文侯受用，也使满朝的大臣们都得到了赞美。不得不说，赵仓唐和魏击都是社交高手，善于使用社交语言。'
