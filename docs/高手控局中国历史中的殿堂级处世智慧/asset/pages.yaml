- pgno: 180
  md: '灭蜀后，宋军将领多劫掠金钱、奴隶和女子，而曹彬的行囊中却只有图书。赵匡胤将王全斌等将领交给有司处理，法官认为应该斩首，赵匡胤却宽赦了他，改任他为崇义军节度观察留后，其他将领如崔彦进、王仁赡等都被贬官。征西的将领们都遭到处罚，只有曹彬因为善于约束部下，且立有军功，得到赏赐，被任命为宣徽南院使、义成军节度使。曹彬辞让说：“将领们多遭到处罚，只有我得到这样的厚爱，这对将士们来说恐怕不够公平。”宋太祖多方劝勉，让他不要拒绝。


    曹彬先后参加了针对北汉的多次战斗，每次都有斩获。到开宝六年(973)，他已加官为检校太傅。在南方的割据势力中，以南唐的力量最强，所以最为宋太祖所重视。他下诏令曹彬领西南路行营马步军，从荆南顺流向东进攻。曹彬不负所望，接连攻克峡口寨、池州、当涂、芜湖，驻兵采石矶。


    在对南唐的围城之战中，曹彬下令士兵缓攻，希望南唐国主李煜能放下武器归降。他派人送去信件，向李煜传达了自己的意思：投降可以让百姓免于战火的涂炭。


    金陵城快要攻克的前夜，曹彬忽然放下军务，对外宣称自己病了。将领们都来探病，希望他能尽早康复。曹彬却说：“我的病不是药物能治好的，只要诸位在我面前立下誓言，攻破城池后，不乱杀一人，我的病就好了。”


    将领们明白了他的心意，便一起设置香案，焚香立下誓言。不久，金陵城被攻破，南唐国主李煜和他的大臣们都得到了保护。相比于后蜀的灭国战争，南唐被灭国没有发生二次叛乱，客观上也减少了对百姓的伤害。


    班师回朝后，曹彬在奏章里写道：“臣奉命到江南办事归来了。”他对自己立下的大功丝毫不骄矜，这让宋太祖十分欣慰。


    曹彬终其一生，历任太祖、太宗、真宗三朝，军功赫赫，但始终非常低调。


    他虽居高位，但是遇到士大夫时态度十分谦和，保持着尊重的姿态。'
