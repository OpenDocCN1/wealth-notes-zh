- pgno: 86
  md: '# 蔡泽：说准领导的心事


    在试图说服别人之前，先记住一个真理：世界上没有任何一个人——无论他是皇帝还是乞丐，是圣徒还是普通人——会轻易地认为自己的思想是错的。如果你不能理解这句话，你将说服不了任何人。


    蔡泽是战国时期燕国人，他和当时的很多知识分子一样，想找一个好的平台，施展自己的才华。他先是到了赵国，结果不受礼遇；之后又去了魏国，不过运气不好遇到了劫匪。好在这些劫匪劫财不杀人，这才使他活了下来。在魏国运气不佳，在秦国必得重用，这算是一个没有道理的道理。商鞅、张仪、公孙衍、范雎都是在魏国混不下去，到了秦国就一步登天的人物。因此，蔡泽来到了秦国。


    当时秦国的相邦是范雎，爵封应侯，秦昭襄王对他言听计从。可以说，他跺跺脚，整个咸阳都会抖三抖。


    蔡泽首先拜访的就是范雎，他将此视为打开自己人生之路的撬杠。为了能够按照预定计划行事，蔡泽先开始造势，让人对外散布消息说，蔡泽是天下无双的辩士，到了秦国必定会取代应侯。范雎听了这个消息很不以为然，不过还是派人召见了蔡泽。


    蔡泽见到范雎，只是作了个揖，并未下拜，这让本就不痛快的范雎十分生气，叱责他说：“你扬言要取代我的位置，这是真的吗？”


    蔡泽说：“的确是这样。”


    范雎忍住愤怒说：“你且说说看，若是说得不对，我再治你的罪。”


    蔡泽暗示说：“商鞅相秦、吴起相楚、文种相越，都未能善终，你知道为何吗？”


    范雎闻言一頓，态度变得缓和很多，绕开蔡泽的提问，辩解道： “商鞅在秦国变法，使秦国成就霸业；吴起侍奉楚悼王，使私室不能损害国家；文种辅佐越王勾践，灭吴国报了仇。这三个人都是成就大业的榜样啊。”'
