- pgno: 11
  md: '何谓自污呢？当然就是败坏自己的名声。自此，萧何开始抢占民田，做一些伤害民众的事。《史记》中记载：“上乃大悦！”刘邦这才放了心。


    凯旋而归的刘邦，在路上遇到的都是告御状的苦主，且矛头都直指萧何。刘邦于是责问萧何：“我封了你那么多的地，你为何还抢占百姓土地？快快去向百姓请罪！”萧何当然知道戏还得演下去，吞下的土地是吐出来了，但他又向刘邦请命，说长安地狭人多，皇帝应该把自己的园林让出来，交给百姓耕种。刘邦认为这是萧何收了商人的好处才这样说的，于是将萧何投入监狱，命令廷尉审判。当然，他很快就回过头来，将萧何放了出来，让其官复原职。


    在这种微妙的关系中，看似是刘邦拿捏有方，实则是萧何应对有

    余。在为刘邦立下汗马功劳的臣子中，萧何成了罕有的获得善终者之

    一。反观燕王卢绾，他与刘邦同年同月同日生，而且是同窗，可谓妥

    妥的发小。即使在刘邦最落魄、到处躲藏的时期，卢绾也没有放弃

    他。比之萧何、曹参那些人，他与刘邦可谓亲如骨肉。从能力上说，

    他并不弱，还立了不少功劳，成了沛丰集团中唯一被封王的。然而，

    就是这么一个备受刘邦信任的人，最后却因谋反的罪名不得不逃避

    到蛮荒之地。


    卢绾的封国与匈奴接壤。在陈豨叛乱事件中，为了拉卢绾下水，

    陈豨集团说服了卢绾的属下张胜。就这样，卢绾一步步走到与刘邦对

    抗的局面。实际上，卢绾未见得真有反心，他在遭到汉军进攻的情况

    下率领人马逃到长城外，还希望能获得当面向刘邦解释的机会。直到

    听说刘邦驾崩，自知吕后不会容他，这才投奔匈奴，并郁郁而终。卢

    绾的错，就在于他未能处理好与刘邦之间的信任问题。身为一方诸

    侯，本就让老大不放心，加之管不好自己的属下，以致其到处给自己

    挖坑，能不败亡吗？'
