- pgno: 187
  md: '# 陆 人和・顶级团队与顶尖人才


    创业团队需要具备五方面的人才：第一，顶层设计者，没有这方面的人才，就意味着一开始的路线可能是错误的；第二，有团队管理能力的人，没有这方面的人才，将无法凝聚起团队发展的力量，事业也无法做大做强；第三，有拓展能力的人，他们是事业的尖兵；第四，有专业技能的人才；第五，有一群信念坚定的追随者。这五方面，缺一不可。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 随何：善执行者，胜！


    组织常常不是缺乏伟大的战略，而是缺乏有效的战略执行。也就是说，执行是最核心的竞争力。


    前205年四月，汉王刘邦率军到洛阳，名士董公对他说：“兵出无名，事故不成。”董公建议他打着为义帝（楚王）报仇的旗号，讨伐项羽。于是，刘邦命令三军穿戴孝服，为义帝发丧。刘邦在檄文中说：“天下英豪共立义帝，一起面朝北侍奉他。如今项羽将义帝放逐到江南又害死了他，实属大逆不道。我亲自发丧，诸侯们一起穿戴孝服，征发关内的全部士兵，讨伐不义之人。”


    当时，项羽正在齐地收拾不安分的田荣。彭城空虚，刘邦便联合塞、翟、魏、赵、殷等诸侯联军50多万人，杀向项羽的地盘。项羽得知刘邦偷袭后，留下部将继续在齐地扫荡，自己则率领3万骑兵一路疾驰。驻守在鲁县的樊哙哪里是他的对手，一触即溃。


    刘邦和诸将拿下彭城后，将西楚的财宝装了几大车，还抢夺了不少美人，彻底被胜利冲昏了头脑，整日饮酒作乐。项羽的骑兵没有直接进攻，而是绕到彭城西，在凌晨时对汉军发起猛烈攻击。驻守下邑的汉军大将吕泽来不及反应，大败而逃。刘邦则紧急逃出彭城，一路向泗水溃散。楚军犹如虎入羊群，一时间汉军死者狼藉，相互践踏，还有为了逃命坠入睢水淹死者，共计10多万人丢了性命。刘邦率领残兵败将到达砀县喘了一口气，行进到砀县西才得以为同样率领残军的吕泽会合。


    到了虞县，刘邦垂头丧气地乱发脾气，对跟随在身边的儒生一通乱喷，说：“你们这群人，就不配合我谋划天下大事。”负责传达和通报工作的谒者随何就是个儒生，走上前对刘邦说：“我没有听明白大王您的意思。”


    刘邦说：“谁能出使淮南，让九江王英布叛变项羽，倒向我？”


    随何说：“使者就是我。”


    刘邦当即安排给随何20个人，让他们充当使团成员。随即，一行人驾着车出发了。'
