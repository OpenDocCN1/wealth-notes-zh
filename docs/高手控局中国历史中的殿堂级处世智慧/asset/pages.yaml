- pgno: 125
  md: '当地人 所杀。没了领头羊，其他六国的诸侯王不是自杀， 就是伏罪。一场差点儿颠覆大汉王朝的叛乱， 被周亚夫就这样给平定了。


    在这场战争中， 周亚夫顶住了三方面的压力： 一是来自梁王的压力。梁王是汉景帝的胞弟， 很受汉景帝尤其是太后窦氏的宠爱， 他希望周亚夫能来救援自己， 减轻自己的压力，
    但让梁王拖住叛军是周亚夫制定的作战策略， 一旦 了梁王的心， 这一作战策略势必要被破坏。二是来自皇帝。汉景帝虽然接受了周亚夫的主张， 但是一旦到了战场， 尤其是汉景帝收到梁王的信后，
    势必会给周亚夫下诏书， 而这正是叛军所希望的。三是来自叛军。叛军不断挑战， 希望尽快与汉军决战， 从而歼灭汉军的有生力量。这三方面的压力， 使得周亚夫的处境非常被动。但他能化被动为主动，
    不接受来自任何方面的压力， 使得叛军尽快决战的计划未能得逞。切断叛军的粮道后， 他终于占了上风， 在叛军撤离时抓住机会出击， 从而 了他们。


    周亚夫是真正的大才， 面对巨大的压力时， 能扛住它， 分清主次， 寻机作战。晚清名臣曾国藩对他的评价极高， 说他 “秉刚气而持正论， 无所瞻， 无所屈挠”。'
