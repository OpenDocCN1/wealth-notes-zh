  md: '在太美了，一转入对相见的期待，盼望着能与这位老朋友有诗有酒地再聚一次。


    有研究者统计，李白的朋友圈达400余人，而且与这些人都是有文字之交的。那些与李白有过交往，但没有被写进诗歌里的人，还不知道有多少。李白固然没有实现他做官“静胡沙”的大志，但是诗酒生涯成就了他的艺术。


