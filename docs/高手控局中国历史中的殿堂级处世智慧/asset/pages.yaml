  md: '拜，曹操奏请朝廷封张鲁为镇南将军、阆中侯（有的文献记载为“襄平侯”），食邑多达一万户。张鲁的五个儿子和功曹阎圃，全被封为列侯。与此同时，曹操还让儿子曹宇娶了张鲁的女儿。从表面上看，张鲁投降曹操，失去地盘，肯定是输了；但从整个历史的维度看，张鲁不仅赢了，而且是大赢。


    张鲁降曹后，曹操为了削弱他的影响力，下令让他和他的教众北迁到长安、洛阳和邺城，这使得五斗米道的影响力渗透到了整个中原地区。魏晋时期，上至公卿贵族，下至黎民百姓，多成为其道徒，五斗米道遂改名为“天师道”，教首被称为“天师”。


    张鲁之后，其子都亭侯张盛在江西龙虎山继续立教。曹魏从曹操奠基，曹丕称帝，魏明帝曹睿继立，实际的皇帝只有两位，即文帝和明帝。后面的曹芳、曹髦、曹奂都是司马氏控制下的傀儡，可以说曹魏政权乃二世而亡。


    张鲁所创的天师道则不同，北迁之后，其影响力从三辅渐变全国。历代统治者为了笼络其势力，不断对其进行赏赐和加封，使“天师”成为千年一系的“教首”。如宋真宗赵恒曾加封第二十四代天师张正随为“真静先生”，宋仁宗赵祯加封第二十六代天师张嗣宗为“虚白先生”，元世祖加封第三十六代天师张宗演为“嗣汉天师”……直至清末，尚有加封。张鲁的天师世系传了63代，仅次于孔子世系，在中国古代思想界有巨大的影响力。这是曹操始料不及的。


    究竟谁才是最后的赢家呢？站在更高的角度，拥有宽广的心胸，这样的人往往被称为伟人。张鲁不肯烧府库里的钱粮物资，其心不在私而在民，这是最大的人情世故。'
