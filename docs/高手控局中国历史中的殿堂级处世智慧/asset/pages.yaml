- pgno: 77
  md: '# 卢纶：我的朋友圈全都是大佬


    > 受人类智力和精力的约束，一个普通人可以拥有的稳定的社交圈子，其人数大约在150人。所以，圈子是有极限的，并不是越大越好，我们要学会珍惜自己的“圈子名额”。


    卢纶出身著名的豪族范阳卢氏，不过到他这一代时，家族已经没落。由于父母早亡，卢纶从小就被寄养在舅舅家，好在舅舅家也是当时的望族—京兆杜氏。当时有一句俗语，“城南韦杜，去天尺五”，可见杜家的显赫。所以，卢纶从小就受到了良好的教育。唐玄宗天宝年间，卢纶考中进士，但是他的运气实在是不好，正好碰上安史之乱，所以没有机会做官。一些文献记载，他其实并未考中。总之，他生活的大唐已经不再是昌明的巅峰期。


    没有机会做官，就去隐居终南山。唐朝的终南山，距离京城长安很近，去那里归隐的名流数量，可以说堪比长安城里居住的达官贵人的数量。成语“终南捷径”说的是初唐有人名叫卢藏用（与卢纶同出范阳卢氏）的人，虽有一身才华，但一直没有获得重用的机会，干脆写了一篇《芳草赋》，去终南山隐居了。武则天时期，他“著名隐士”的身份终于被朝廷知道了，于是被征召出山，给了个左拾遗的小官儿。他以此起家，做到礼部侍郎。后来，人们便把以隐居的方式来沽名钓誉、博取名声称为“终南捷径”。卢藏用在后世成了一个受尽嘲讽的角色，但这改变不了唐代大量有才能的人会隐居终南山的事实。卢纶到了终南山后，结交了一些志同道合的朋友，也释放了多年蹭蹬不第的落寞情怀。他在《落第后归终南别业》中写道：“久为名所误，春尽始归山。”


    卢纶的隐士生涯并不长，因为他的诗名在长安已经广为人知，被不少大佬请去做客。比如王维的弟弟、宰相王缙就很看重他，另一宰相元载也极力向朝廷推荐他。大约是小寄人篱下的缘故，卢纶察言观色的本事非常大，因而在长安的上层社交圈里简直是如鱼得水。可以说，半个长安城的显贵都加了他为好友，都看得见他发朋友圈。他与诗人李端、吉中孚、韩翊、钱起、司空曙、苗发、崔峒、耿涛、夏侯审等相互酬唱，夜夜组局聚会、吃烤肉，每次做的诗都能在长安城刮起一股流行风。时人将他们这个小团体称为“大历十才子”。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '由于受两大宰相的举荐，卢纶被任命为阆乡县尉，类似于县公安局长的职务。莫要小瞧唐朝的县尉职务，很多人包括宰相元载，都是从县尉开始起家的。不过，这个微末小官与卢纶的期待甚远，好在他在长安的朋友圈中仍然发挥着作用，不久就被调入朝中担任集贤学士、监察御史。卢纶大概天生有“社交厉害症”，是宰相杀手，不但王缙、元载对他青睞有加，担任过宰相的常衮、李勉、齐映、陆赞、贾耽、裴均、令狐楚、马嬾，包括眼高于顶的大诗人、大佬韦皋，精于骑射的大将军浑瑊，都对他十分礼遇。不过，朋友圈太广是好事，但有时候也是坏事。立下大功的宰相元载权力太大，遭到唐代宗的猜忌，后来被逮捕下狱处死。王缙、卢纶被视为他的同党，遭受牵连被罢官。


    唐德宗即位后，受元载牵连的人逐渐被召回。当时卢纶的好友浑瑊出镇河中，担任主帅，招其到军营任元帅府判官。军营生涯使得卢纶的诗歌有了盛唐时边塞诗的气象，他的《塞下曲》成了千古绝唱。


    > 月黑雁飞高，单于夜遁逃。


    欲将轻骑逐，大雪满弓刀。


    这首《塞下曲》又名《和张仆射塞下曲》，其实也是其社交产物。唐朝的“仆射”即宰相，诗题中的“张仆射”有两说：一说是张延赏，另一说是张建封。但无论是哪一位，都是执掌权柄的人物，可见其社交之广。由于文献缺失，我们已经无法全面了解卢纶的朋友圈，只能从其仅存的一些诗歌和有限的资料中去窥探。尽管如此，我们仍能看出他在长安社交圈中的影响。


    卢纶的《塞下曲》共有六首，另一首同样知名，为他在大唐群星璀璨的天幕上争得一席之地。


    > 林暗草惊风，将军夜引弓。


    平明寻白羽，没在石棱中。


    以汉比唐，是唐代人的一个传统。这首诗虽然写的是汉代飞将军李广，但也体现了诗人的雄心。他的诗歌很受德宗皇帝重视，德宗皇帝便将他调入朝中任户部郎中，负责朝廷的财务工作。只是此时的卢纶已经到了生命的尽头，未能施展抱负就去世了。'
