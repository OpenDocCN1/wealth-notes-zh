  md: '# 萧俟：拒绝的艺术


    顺从并非美德，拒绝需要智慧。


    萧俟出身南兰陵萧氏，是梁武帝萧衍的后裔，唐穆宗时任宰相（同中书门下平章事）。一次，穆宗皇帝下诏让他给已故的成德军节度使王士真撰写神道碑。萧俟回禀说：“为臣器量偏狭，王承宗（指王士真的儿子）不肯听从朝廷号令，人品没有可称赞的地方。如果让微臣撰写王士真的神道碑，臣不会刻意去美化他。神道碑写好后，按惯例王家会献礼物致谢。臣若不接受，就违背了陛下安抚藩镇的计划；臣若硬着头皮接受，则又违背了自己平生的意愿，因此臣不愿意写这篇文章。”穆宗皇帝认为他肯直言，便嘉奖了他。


    从表面上看，萧俟是为了维护自己士大夫的尊严，才拒绝领导安排的工作，但事情远没有这么简单。在君王时代，对皇帝而言，臣子的忠诚度、办事能力是第一位的，其次才能谈到士大夫的声誉。如果一个人不能为领导办事，仅会沽名钓誉，是得不到领导重用的。那么，唐穆宗为何还嘉奖了萧俟呢？这是因为，萧俟话里有话，戳中了唐穆宗的心坎。这就要将其放到唐穆宗执政时的社会中来看了。


    唐朝自玄宗天宝年间安史之乱后，藩镇坐大，各路的将领要钱有钱、要人有人，逐渐不肯听从朝廷的号令，开始自行任命官职，各自为政。到了唐穆宗的父亲唐宪宗时，在名将裴度的辅佐下，逐渐削平了一些反叛的藩镇。之前处于观望状态的藩镇将领纷纷归附朝廷，但那些有实力的藩镇仍然处于半独立状态。唐穆宗所说的“成德军节度使王士真”就是当时有实权的藩镇节度使之一。王士真原是成德军节度使李惟岳的镇将，他协助父亲王武俊杀了李惟岳。朝廷为了安抚，就顺水推舟地任命王武俊为节度使。王武俊死后，王士真不待朝廷任命，就自封为留后，成了节度使。王士真死后，他的儿子王承宗、王承元相继为留后。王家在成德军中经营了四世，岂止是尾大不掉，实际上已成了一个独立王国。唐穆宗作为大唐王朝的“董事长”，下诏让经理人萧俟给已故的王士真——曾经的分公司大佗写神道碑，就是想用朝廷的荣誉来笼络住藩镇，避免他们公然造反。萧俟没有接受领导委派的工作，反而拿出一套推脱之辞，其中至少有三层含义。


    第一，王家不听朝廷号令，仅用拉拢的手段是行不通的。如果由我这个经理人为他的先人写神道碑，会让那些忠顺的藩镇寒心，让那'
  merge: -1
  img_proc: true
- pgno: 112
  md: '些想图谋不轨的藩镇更加跋扈。王家现在虽然归顺了，但是前几代劣迹斑斑。王承宗的祖父王武俊曾联合幽州节度使朱滔举兵叛乱，公然僭越，自号为赵王，后因与朱滔不合，叛乱形势也对藩镇不利，才又归顺了朝廷。在王士真任成德军节度使时，尤其是任期晚期，不巧是颇有手腕的唐宪宗执政，一方面对王家加官进爵，另一方面对那些敢于公然造反的藩镇进行军事打击，所以成德军十分恭顺，每年向朝廷进贡达数十万的财货。比之于河朔三镇中的卢龙、魏博二镇，他可以说是朝廷的铁杆支持者。比之于其父，王承宗更像一头桀骜不驯的狼，唐穆宗时期叛乱，因实力不够，又重新归顺朝廷。唐宪宗能够稳住成德军，靠的是军事威慑和封官拉拢。唐穆宗如今对待藩镇，如果仅靠拉拢手段，是行不通的。


    第二，从管理层角度对，萧俜不是写神道碑的最佳人选。唐穆宗作为最高领导，要面对三大势力：一是自唐玄宗以来每个领导者都要面对的外部力量一藩镇；二是朝廷大臣，他们代表了贵族士大夫的力量；三是以宦官为首的左右神策军，他们负责皇帝的安全和京城防卫。穆宗皇帝能上位的很大原因，就是朝臣和左右神策军的共同拥戴。唐宪宗能够威慑和削平藩镇，依靠的也是以裴度为代表的贵族士大夫；而南宁陵萧氏在整个唐朝有10人出任宰相，是最大的贵族世家之一。如果他为藩镇势力的代表写神道碑，会产生两个后果：其一，导致朝臣与藩镇勾连；其二，引起以宦官为首的神策军的猜忌。不要忘了，唐穆宗曾派精锐的神策军进攻藩镇，虽然打了败仗，但神策军毕竟是皇帝的家，如果萧俜写了碑文，不仅得罪了自己的人，还打破了三方力量的平衡。


    第三，社会舆论对朝廷不利。唐宪宗能够彻底解决成德军的问题，让王承元献上土地归降朝廷，为朝廷出力，去收拾其他不听话的藩镇，是因为朝廷的荣誉依旧拥有吸引力。如果让萧俜这个职位最高的经理人写神道碑，不只会让朝廷的荣誉贬值，还会遭到朝臣反对，萧俜本人的声望也会受损。皇帝等于在藩镇和朝臣两边都不讨好，这是双输。


    基于以上三点，萧俜拒绝了领导不合理的工作要求。唐穆宗也是聪明人，立刻就 从他的话里听出玄机。萧俜不愧为一代贤相，他在拒绝领导时，也替领导做了全局性的考虑，但并未将利害关系彻底戳破，因为真正的掌舵人是唐穆宗，他才是权力平衡之术的驾驭者，这不应该是臣子考虑的，不然就有越权的嫌疑。唐朝自安史之乱后，虽'
  merge: -1
  img_proc: true
- pgno: 113
  md: '然藩镇处于半独立状态，而且经常发生叛乱，但是朝廷能够屹立不倒，就是在内用藩镇牵制朝臣、在外用朝臣打压藩镇。唐末朱温篡权，就是因为朝臣与藩镇勾结为一体。朱温一举将代表神策军的宦官势力杀光，三方势力的均衡格局被彻底打破，唐朝也就灭亡了。


    总之，一个优秀的经理人，首先，要拥有全局观，对大势洞若观火；其次，当领导提出不合理的工作要求时，要能够让领导意识到其中的利害，从而把决策拉回到正确的方向；最后，要确保自己处于主动位置。如果自己的地位受损，那么就无法再掌控整个企业了，发展与壮大也就成了空话。'
