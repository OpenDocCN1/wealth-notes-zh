  md: '# 刘晏：用“精细化管理”解决难题


    分段管理的核心在于掌握“分解思维”。面对问题，你需要像个屠夫，把它分解成若干块，并让它的“五脏六腑”都暴露在你面前。


    刘晏是唐代名臣，中国古代史上著名的理财专家。唐玄宗天宝年间，他从夏县县令的低级官阶干起，开始关注理财。唐肃宗李亨为了筹钱，将他从长水县调到户部。从此，他开启了持续一生的财务生涯，掌管度支、铸钱、盐铁等事务。


    安史之乱逐渐平息，皇室和贵族们回归长安，再度过起奢侈的生活。但是经济恢复得很慢，长安城的米价涨到一千钱一斗，就连皇宫的御膳房也没有一个季度的储粮，只能靠京畿和附近几个县的农民磨麦子供应。皇帝命令大臣们尽快恢复被战争破坏的漕运，将南方的稻米运到长安，以保证城市居民的生活。但是，几任管理漕运的官员都无法执行到位。唐代宗十分生气，将此事交给刘晏负责。


    刘晏亲自考察漕运河道。他从淮河、泗河乘船，转运汴河，又进入黄河，一直向西，经过砥柱、碻石，下船向当地人询问三门渠道渡口的情况，又向漕运船工了解粮食运输的情况。他发现，将南方的谷米运到长安，要经过几千里的水运，流程长，船主和船工们的农民工长，精神和体力损耗大，而且每一段流域的水文情况不同，并不是每个船主都能掌握，因而经常出现停滞和沉船现象，造成时间的延误和粮食的浪费。


    回到京城后，刘晏整理完考察的资料，将漕运分成几十段，任命官员分段管理，各司其职，疏浚所属河段，避免淤塞。运输粮食的船，不必千里跋涉，也得到了较好的维护，每段只需完成自己流域的运输任务即可。这种分段管理的模式，极大地提高了效率，很快就解决了京城的粮食问题。等到装满货物和粮食的船队出现在东渭桥时，唐代宗派内侍亲自慰劳。代宗皇帝高兴地对刘晏说：“你真的是朕的萧何啊。”经过刘晏对漕运的一番精准管理，每年被运到京城的粮食达到40万斛。从此之后，就算关中地区遇到旱灾和洪灾，粮食价格也没有上涨过。


    安史之乱后，藩镇大将叛乱的事情时有发生。大历十一年(776)五月，汴州大帅李灵耀发动叛乱，占领州城，切断漕运，要求朝廷封他'
