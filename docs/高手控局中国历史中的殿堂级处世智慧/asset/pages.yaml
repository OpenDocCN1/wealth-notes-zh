- pgno: 6
  md: '# 刘邦：千人千面，不拘一格


    所谓不拘一格，其实质是自身拥有大格局，能与不同的人和睦相处，并与他们拧成一股绳。“我不牛，但我能带领一群牛人”，这就是能量。


    汉高祖刘邦起家泗水亭长，出身十分低微。有些学者认为他的职务相当于现在的派出所所长，其实是不正确的，亭长的职级比这还要低。


    秦朝实行郡县制，在县之下设基层单位乡，乡之下设亭，亭之下又设里。乡作为基层单位，设有三老、有秩、啬夫、游徼等职位。其中，三老管风俗教化；有秩管大乡，啬夫管小乡，职责是收税和处理地方政务，类似乡长；游徼负责缉捕盗贼—正牌的乡派出所所长。至于亭，是乡的下一级单位，大约相当于村。刘邦这个级别，大概扮演的是村治保主任的角色。在秦朝，像他这个级别的小吏数不胜数。无论如何，人们都无法想象有朝一日他能当皇帝。秦失其鹿，天下共逐。被灭的六国贵族纷纷崛起，凭借旧有的影响力，不但迅速获得追随者，而且拥有了地盘。那么，刘邦是凭什么逆袭，最终上位的呢？


    刘邦是草根出身，故而从来不看追随者的身份，只看他们是否有能力，能力强者委以重任，能力弱者也能给个小官，使得他们人尽其才。


    我们不妨看看他的起家班底。他最倚重的萧何是主吏掾，相当于县令的秘书，不入流，没有品级；曹参，狱掾，是管理看守所的小官，相当于现在的狱警；周勃在人办丧事时，充当乐队的吹鼓手；夏侯婴，厩司御，是管理车马的小吏；卢绾身份不明，是刘邦的发小，大概也是个平民；樊哙，屠狗夫……


    从起家班底的名单中我们可以发现，他们不但没有一个的是贵族出身，甚至没有一个当过县令。但就是这些人，成为帮助刘邦建立沛丰集团的基础人才团队。


    最初，刘邦的确是打算靠沛丰集团里的这些铁哥们儿打天下的。他们占据了几县，抱上了项梁的粗腿，拥护了义帝。但若与项羽争天下，仅靠他的这个团队是远远不够的。这是因为他的团队有几个先'
