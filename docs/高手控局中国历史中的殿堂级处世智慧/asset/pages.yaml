- pgno: 71
  md: '团的西晋王朝得知后，立刻派司马腾率兵来剿，结果战败。司马腾逃往山东，刘渊趁机夺取了太原、氵氏、屯留、长子等大片土地。


    西晋王朝为了剿灭刘渊，不断派兵进攻，但几乎每次都大败亏输。先前刘渊布下的线，都开始发挥作用，那些听闻他名望、曾与他交好的上层势力纷纷归附。上郡四部鲜卑大人陆逐延、氵氏族部落大人单征、早年的好友王弥、起兵的石勒都率领人马前来，都被刘渊授予官职。


    永嘉二年(308)，刘渊正式称帝，建立了“汉国”政权，迁都平阳。因其力量在河北，故而又称“汉赵”“前赵”。后来，其子刘聪拿下洛阳，俘虏了晋怀帝，西晋彻底灭亡。


    刘渊能够在凶险的“人质”生涯中活下来，并得到多方支持，为其未来建立霸业打下基础，与其善于社交、多方铺路有关。西晋统一全国后，不少胡人上层贵族在洛阳为质。这些人虽是人质，但都有较大的人身自由，与士族阶层广泛交往。胡人的文化一度成为洛阳贵族的流行风尚。他们以高大的胡人为奴仆，以胡姬为妾，甚至穿戴胡人的衣服、演奏胡人的音乐。刘渊精通汉文化，能与清淡的名士谈论经史，更是被奉为上宾。刘渊以客为主，终日与洛阳名流往来，不但学到了政治学知识，还了解了西晋王朝内部的危机。这都彰显了他长于社交的一面。'
