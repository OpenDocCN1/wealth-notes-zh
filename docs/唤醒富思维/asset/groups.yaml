    ## 第9章／


    ## 請順著富思維的梯子往上爬


    我二十出頭歲那段時間，曾和大學友人一起搬到西班牙巴塞隆納住上一陣子，我們在鎮上治安比較差的那區租了一間破破爛爛的公寓，家裡的家具都是從街上撿拾而來，每天就在吃吃喝喝中糜爛度過，夜夜笙歌，日日派對。因為西班牙剛好就在義大利旁，所以某個週末，我決定搭火車回拿坡里拜訪我爸那邊的親戚。我迫不及待想和表妹瓦倫蒂娜在這個古老國度來場派對，看著當地的觀光景點，更多認識她，還有讓她瞧瞧我藏在衛生棉條紙盒裡的那一大疙瘩大麻葉。當我抵達拿坡里後卻驚恐地發現，週六夜晚的出遊活動，竟然只是和她一整掛朋友沿著廣場散步，吃義式冰淇淋，讓旁邊的遊客盯著看。喔，如果感覺對了，回頭再買一隻冰淇淋。期待落空的我，當每次經過一群二十多歲，喝得酩酊，瘋狂喊著：「我的太陽」的美國年輕人時，便無法克制地感到一股痛苦的羞恥。和身為美國人的我不同，瓦倫蒂娜成長的過程中，家裡餐桌上總會擺上一瓶酒，雖然未成年，但就算是她伸手倒酒，她父母連眼都不會眨一下，更不會招來「你到底以為你在幹麼」的表情。可能就是因為這樣，這天結束後，她得到了一個完整、盡興的夜逛體驗，而我卻只能落得在急診室悠悠醒來，喉嚨裡還插著洗胃的管子。直到我回家，盒子裡那坨大麻葉一直維持著原封不動的狀態。


    ## 改變從創造環境開始


    對她來說，酒精根本沒什麼，只是日常生活中的一部份而已。擺在桌上的那瓶酒所能提供的興奮感，就和它旁邊那條麵包沒啥兩樣。但對我來說，酒是禁忌之物，就和抽菸或是連名帶姓直呼別人爸媽一樣既危險又刺激。我已經不只二十一歲了，再也不需要聽誰的話了，我想幹啥就幹啥，所以想當然耳我就做了自己想做的事，就算它們讓我作嘔又怎樣！


    環境會型塑生活中的每件事，上至飲食習慣、財務狀況，下至外貌等，我們愈常讓自己浸潤在某個環境中，這個環境對我們就有影響力。你有沒有注意到，有養寵物的人最後會長得愈來愈像他們的寵物？或是隨著你待在英國的時間愈長，你就愈容易把蕃茄念成「偷媽偷」而不是「偷沒偷」。


    > ① 原文寫為「Oh solo mio」，實際上應該是「O Sole Mio」，是一首世界知名的義大利民謠。


    當談到錢，你身邊環繞的人事物對你影響深遠，他們會影響你對金錢的感受和看待它的方式。你會根據環境定義什麼東西便宜或昂貴，這筆採購是聰明或愚蠢，還有你認為自己有能力賺多少錢。事實上，這是一個訓練自己清醒的練習：找出你最常和你混在一起的五個朋友，計算他們的平均收入，那你會發現自己的收入離這個數字也不太遠。


    人們常未經細考，就輕易接受周圍的環境，並且認為它就是「現實」，是一個正常生活該有的樣子。每個人不是都應該知道怎麼倒立喝啤酒嗎？這就是為什麼當你決定要提高收入和生活水準時，你需要盡可能地置於渴望擁有並且正盡力創造的環境中。這麼做不僅會逼你脫離舊的思維、信念和行為模式，同時也讓新環境有機會開始影響你，為你提供「正常」的新定義，而不是那副「最好是啦」的老樣子。


    每週都去試駕你想買的那部車；逛逛那間你一直很想去買東西的店，試穿看看裡面的衣服；找一天去你打算置產的社區晃晃，別忘了選出一間你最喜歡的房子；去國際機場繞個幾圈；到遊艇碼頭賞船；觀賞別人在大峽谷泛舟急流而下的影片；去參加你一直想加入的那間健身房的免費體驗日｜不管什麼事，只要它能夠讓你情緒奮奮、激昂，盡管沉浸其中吧！


    ② 克雷格列表（Craigslist）是美國最熱門的分類廣告網站，界面簡單，什麼東西都可以賣，同時也兼有聊天、電子佈告欄（BBS）等功能。


    當我還是窮光蛋的那段時間，我住在洛杉磯東邊，離市區非常遠的地方，我不喜歡那，但我也只住得起那。每一個禮拜，我會到那個位在海濱旁的住宅區，希望有一日可以在這置產，但這裡的房價對我來說，實在是太貴了。我喜歡住在海邊的感覺，隨著海浪拍打岸邊的聲音沉沉睡去，在日漸平西消失在海平面那端時，到沙灘上悠閒的散步，在銀行排隊時，身旁站著的一個穿著濕濾濾西裝，腋下夾著衝浪板的帥氣男子。這就是我要的生活。只不過唯一的問題是很多人也想過這樣的生活，但是住在海濱旁的月租金，足足是我當時住處所在也就是令我痛恨的那區域的兩倍之多。我可沒信口胡謅，克雷格列表②的搜尋結果也這麼顯示。總之，我大概每隔一天就會開個三十五分鐘的車到這，在我想置產的街區裡找間咖啡店，假裝我是從旁邊的家裡走過來的。只要有人願意給我時間，我都會告訴他們我正在找房，我還四處張貼尋屋布告，也去翻閱報紙上的訊息；我把找房的訊息四處周知我的朋友們，請他們再把這個訊息轉給他們的朋友。就這樣過了好幾個月，我完全找不到任何接近我預算的物件，然後有一天，克雷格列表上突然出現了這間房子，離海邊只有三個街區遠，比我當時的房租也只貴一百塊而已。這實在好到像詐騙。當我在售屋參觀日③前去時，只見人山人海，顯然其他人所見亦同。廣告沒說謊。但是廣告裡頭沒有提到，到這間房子的前租客是一輛豐田可樂娜，因為這間公寓以前是被當做車庫在使用。但我實在太想住在海邊旁，這個地方對我來說就像是入場券，所以我在交出去的申請書中夾了一張可愛的便籤，還親自去電給房東，告訴他我很有誠意租，是很愛乾淨的租客，而當他隔天在為房子上油漆時，我帶著煙燻牛肉裸麥三明治突襲。最後可能是急於擺脫我的糾纏，他就把房子租給我了。

    我知道搬進這間只能停一部車的車庫房，大概不是什麼很有說服力的成功故事；但它這就像一塊墊腳石。租下這間房子，讓我可以待在我渴望的環境，從這兒，我才真正跨出開始賺錢的第一大步，過沒多久，我就搬出這間車庫，住進一間真正的房子裡。當我還住在車庫房時，我盡我所能地以高於它應得的規格打理它，為窗口上的木條漆上亮眼的白色，用貝殼和小石頭做成裝飾品，垂掛在天花板的排氣管上，至於扭曲變形的車庫門上的裂縫，我就用三十元商店買來的便宜木條修補，然後在門上掛滿親友的照片。我可以聞到海的味道，聽到海浪的聲音，我可以騎著腳踏車四處趴趴走，只要我想想要，


    我隨時都可以跳到海裡游個泳，這些事實大大影響了我的能量和對未來人生的展望。這次的經歷讓我大受鼓舞、非常開心、如魚得水，對身邊每個人，包括自己來說，我成功證明了我能夠化不可能為可能，因為我在威尼斯海灘找到了一間便宜公寓。人是被情緒驅策的能力動物，所以如果周圍的環境令你沮喪，那竭盡你所能地去改善環境是非常重要的事。你不需要花很多錢或時間，就算只是小事都可能造成大不同，這絕對比去瑪莎史都華世界一遊來得刺激多了。你是在投資自己的潛能。如果獲得適當的養分和能量，淤泥中也能出不染。待在破舊的環境裡，人不志窮也難，所以找個一天，就用這一天好好提升你周遭環境的頻率。


    ③ 在美國，要出售的房子通常會在上市前幾週的週末開放參觀，就稱作售屋參觀日（Open House）。售屋參觀日時，每個人都可以進去參觀，不需要預約，賣方的房屋仲介也會在屋子裡為潛在買方解答各種問題。


    友用她那濃厚的巴黎腔說道：「妳的內衣會讓我覺得妳一定過得很不好，而且很痛恨自己的人生。」我朋友低頭看著身上那件她在超市，五件一包，很實用的棉質內褲，心想著：「這又不是那種高腰阿嬤內褲，好歹這上面有蕾絲啊，這樣應該還好吧？」


    你周遭環境中最需留意的，是那些常和你相處的人；當你開始伸展信心的肌肉，費力地從過去的懷疑、恐懼、擔憂中破繭而出，試著讓錢潮流進你的人生，這時你會需要傾盡全身的力量，因為你的同伴、朋友或家人是最糟糕的豬隊友，他們會朝你丟來一堆一點幫助都沒有的警語，諸如：「我剛才看到一篇文章，上面說五間新開的餐廳中，會有四間最後都撐不下去。」你說想開餐廳，這要是有沒有弄好，最後很可能讓你慘賠喔！」


    你要盡力讓自己待在能提振你的精神、支持你的人身邊，而不是否那些只會送你「祝好運」這類屁話，或「早跟你說了，說難聽話是因為擔心你，我只是想幫你」的人。說這些話的人，他們的言外之意其實是「我很微不足道、怕得要命，我要把這些東西也都抹在你身上，但你不可以抗議，因為我在乎你」。這些人愛擔憂、愛懷疑、容易被驚嚇、是可憐蟲、思想狹隘、愛發牢騷、為反對而反對、無病呻吟、愛低咕抱怨、什麼都看不順眼、是膽小鬼，他們絕不是你想一起分享夢想的對象。


    問題是提升周邊環境中「人」這一塊，比處裡掉一張小毛毯或在庭院裡種點向日葵


    來得更有挑戰，尤其那些最會幫倒忙的人剛好又是你的家人時，就更不容易了；這是人們決心致富時最常見又最令人氣餒的難題，所以你絕對不是唯一一個覺得「搞什麼啊」的人。

    當你身邊的人很負面、消極、怕東怕西，又不支持你的改造計畫時，你可以這麼做：

    別去改變他們。試著鼓勵、愛他們，當他們提出疑問時，你可以提供建議，肯定他們，但別認為你的任務是讓他們「開悟」。除非他們自己想改變，不然你也不會讓他們動起來。以身作則。不要去告訴他們該或不該做什麼，專注在自己身上，盡力成為最棒的自己，這麼一來，假如哪天他們問你是怎麼辦到的，你就可以用盡一切方法幫助他們了，如果他們沒有開口問，那就這樣吧！

    如果你已經知道他們不會支持你，或者是會把他們的懷疑、憂慮都丟給你，那麼就別和他們分享夢想或你正在做什麼！有什麼用呢？你還是得愛他們、得和他們相處，但就別讓他們干涉你人生中的這一區塊吧！

    多和成功人士以及那些能理解、支持你的人相處，他們就是你的新「家人」。如果你不認識這樣的人，想辦法去認識，比如說，參加教練研討會、到社群媒體上找、上去一些課，或乾脆自己弄個自我成長的讀書會，只要你找得夠認真，一定找得到人。


    當我們所愛的人不支持我們的選擇時，我們會非常難受、苦惱，拜託，對我們來說，人生中還有人比他們更重要嗎？和家人之間的連結，是人生中最不可或缺的一件事，然而當我們開始成長、改變，他們卻沒有跟上來時，就會為每個牽涉其中的人招來大麻煩，甚至讓「我會被拋棄」，這個全人類最深層的終極恐懼（被
    人拋棄，失去一切熟悉的事物、自我認同和人生活改變，林林總總等原因加起來，結論就是我會死掉）冒出頭來。但事實是如果我們要生活得精彩，活出最美好的自我，我們就得放手，不再緊抓這些人際關係。關於放手的重要須知。你願意放手，不代表他們就一定會離開。話說回來，你不可能一邊緊抓著舊的自己、舊的關係不放，同時卻又想成為一個新版的你。你必須選擇：緊抓不放，繼續留在原地；或是放手，看看他們會不會跟上來。


    ## 豬隊友拋棄


    我朋友曾告訴我一個很有趣的故事。某一


    ## 那些人才是神隊友？


    沒有其他東西像朋友尖銳的言語，一下就刺破我們的信心氣球。

    我們浪費太多時間容許恐懼恣意擺弄我們，而多半時候，我們這些恐懼和懷疑壓根就從沒成真過！保持注意在你渴望的事情，而非恐懼上，相信每件事情都會如它所命定的一一就定位。當你成長、改變後，你會開始脫去舊我的層層外衣，較低的本性自我脫落，挪出空間來讓最真實的自我得以生長。如果想成長，你一定得先脫去舊事，才能為新事物騰出空間。

    以下提供一些為什麼和高頻率人士相伴，可以幫助你致富的關鍵原因：

    1. 他們可以提升你的能量：想看，當你聽完一個特別激勵人心演講者演說，或和一位對經營事業大有熱情且有成的朋友，在他遊艇的甲板上，一邊喝著啤酒，一邊彼此來回交換各種絕妙點子，或就算是和一群很棒的人一起做你喜愛的事，這些事都會


    大大激勵你。再試著想想跟那些成天發牢騷的人相處時的感受，他們老是抱怨老闆多麼混帳、好的保母多難找，或我們好衰，因為當我們年老時，社會福利制度早就已經跨了等。他們的話，就好像一整籃被倒在你腿上的濕襪子。有些人的能量能提振你，和這些人相伴，你就能獲得致富的能力。


    2. 他們可以強化你的信心：和自信、對財富正面態度且你敬重的人相處，會讓你更容易相信你也能享受到宇宙智慧的無限供應。不論環境看起來多不可抗，一個滿懷信心、毫不懷疑的人會擁有大自然之力，也能激發你達到全新的高度。


    我以前會和一些朋友到戶外輕裝旅遊，他們會帶我到猶他州西南邊那些鳥不生蛋的荒野地帶去。我們會穿越峽谷，走到一大切沙地，爬過彷彿無止無盡，一塊又一塊的巨石，徒步順流而上，小心翼翼穿過淺灘；五天後，當我們「蹦」地穿出荒野時，正好就是我們之前停車的地方。


    有一次，我們聘請一位經營一家吉普車接送服務公司的女士，讓她載我們到某個峽谷的入口處。她跟我們說，我們打算去的那個峽谷最近剛好碰上響尾蛇的繁殖季，那裡現在應該到處都是響尾蛇。我在一旁是尷尬不安，好像在看恐怖片裡面那些即將成為受害者的主角們，這女人不是什麼菜鳥，她和這些峽谷一樣久經風霜，簡直快一樣老了，


    但我朋友就這樣聽她說完，一副壓根沒聽到她提到蛇，而是繼續講她家小狗今天早上又做了什麼可愛的事，接著不急不徐地問她峽谷裡有哪裡可以獲取水源，還是我們得自己帶去。我完全信任我的朋友，對他們也有百分百的信心，若如他們不擔心以響尾蛇毒液流竄在血液中，做為人生謝幕的最後一刻，那我也不怕。帶著這股信心，我跟在他們後頭進入峽谷。六天後，我就這樣走出這座峽谷，身上沒有任何咬痕，旅途中也沒看著什麼響尾蛇。有有些人對自己、對你、對這個豐富的宇宙智慧，都有著無堅不摧的信心，和這種人做伴，你就能踏出致富所需的巨大一步。

    3. 他們能讓你表現得更好：和那些很擅長又很開心賺錢的人為伍，不能讓你看見自己的可能性，同時也會大大激勵、驅策你。如果否天和那些只會在沙發上呼碌的人做伴，那你可能會覺得能洗完自己的衣服都好棒棒呢！良性競爭是伴很棒的事，和那些拿出最佳表現的人當朋友，會讓你也想拿出自己的最佳表現。

