    括了巧合、突來的靈光一閃、天上掉下來的機會等。而你只需要維持強壯、開 放的心態，準備好來接收這一切； 還有哪些做這一大堆你從來沒做過的事情， 尤其是那些會把你嚇個半死，將你踢出舒適圈
