    她勤上心靈健身房。她大量閱讀成功企業家寫的書，把其他成功女性（比如說，在戰區經營一間成功餐廳的人）的照片貼在牆上；她會冥想、背誦一些詩句，同時不斷提醒自己，這些不確定都只是過程，為了前往下一個階段，每個人都得投身於未知中。也就是說，她並沒有小題大作、神經兮兮。

