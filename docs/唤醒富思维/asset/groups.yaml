    是否可以換個做法以達成目標，當我們做得到時，就能打開這扇通往全新自由的門。


    拒絕改變，是最讓人裹足不前的一件事。


    如果你想改變財務狀況，那你得願意改變生命中某些事。舉例來說，我認識一個人，他的 工作穩定，薪資也不差，但據他說，工作內容世界無聊。工作閒暇時，他也從事自 己喜愛的媒體訓練，他並沒花很多時間和力氣，但生意卻蒸蒸日上。因為他真的做得很
    好，口耳相傳下，工作量愈來愈大，漸漸難以負荷，他不得不開始拒絕上門來的客戶， 畢竟他無法一邊兼顧正職，一邊又承接新客戶。


    他實在很想賺更多錢，也想繼續做自己喜愛的事，但卻覺得綁手綁腳，他的正職工 作每年加薪幅度從沒超過三％，但能夠花在兼職，收媒體訓練客戶的時間就只有這樣 了。當然，他可以鼓起勇氣，索性把工作辭了、創業，靠媒體訓練賺進幾百萬。但他覺
