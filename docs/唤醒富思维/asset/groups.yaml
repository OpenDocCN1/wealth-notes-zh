    ## 學會與富思維合作


    喜劇演員金凱瑞曾在《歐普拉》分享自己如何運用強大的心靈力量賺到一千萬美金，並且擁有成功的演藝生涯。金凱瑞一直都知道自己想成為藝人，在年紀很小的時候，他就發現自己的臉皮可以跟橡皮人一樣做出很多奇怪表情，十五歲時，他在一間喜劇俱樂部完成人生首場演出。為了貼補家用，他自高中輟學，白天到工廠上班，晚上則在喜劇俱樂部演出，搏取觀眾的笑聲，雖然有時是噓聲，即使經歷了這些高低潮，最後他仍是一貧如洗，只能和家人一起窩在露營車上過活。後來為了追求成為知名演員的夢想，他搬去了洛杉磯。雖然身無分文又沒工作，他還是想像著會有導演對他有興趣，想像他所敬重的人有多少喜歡他的演出，他專注於想像諸如此類的事：我是一個很棒的演員，好萊塢有權有勢的人都要排隊邀請我。每當他這麼想時，就覺得心裡好了許多，

    然而現實是他從來沒在雜貨店或街上被什麼粉絲包圍過。

    某一天，他寫了一張一千萬美金的支票給自己，壓上三年後的日期，還在備註欄上寫下，這是以後電影片酬。他把這張破破爛爛的支票放在皮夾裡，隨身攜帶，就這樣過了好多年，他獲得愈來愈多喜劇演出的機會，和各種電視邀約、電影演出，不過，這些演出機會都不如他所期待，足以讓他的演藝生涯和財務狀況就此一飛沖天。儘管如此，他還是抱持信心，繼續想像成功的快感，還可以拿這一大筆收入來照顧自己的家人。長


    ## 只要你想要的，都會實現


    不管你腦中想到什麼，不消多時它就會出現在你面前。


    話短說，在快到皮夾裡那張支票上頭的日期之前，他獲得電影《阿呆與阿瓜》中的角色，這個角色，讓他得到一千萬美金的片酬。我們可以任意地想像，但我們得為想像出來的財務負責。宇宙智慧有雙大耳，架，緊緊貼著你的腦袋，仔細聆聽你腦中的各種想法——也就是他的工作指令，這樣當他收到指令後，就可著手為你創造出你腦袋中那些想法的實體。


    我很喜歡金凱瑞的故事，因為它描繪出如何正確掌握致富的心態：


    0 要清楚知道自己想要什麼，並且明確描繪它，你的目標為何？你希望可以從中獲


    得多少錢？你需要多久才賺得到這筆錢？你為什麼想要賺這些錢，你會用來做什麼？


    把想像自己達成目標的這個畫面牢牢記在腦袋裡，然後以認真的決心和絕不放棄的使命感達成它。


    深深地、瘋狂地愛上這個你想像出來的現實，這樣的話，不管什麼限制性的潛意識，信念發作、生氣，也都無法阻止你。


    你的信念要和消防員的魁鬣一樣堅實。就算你覺得已經等了快一百萬年還沒等到，你的心裡仍舊要懷抱著萬分感謝，彷彿自己想要的東西已經到手。絕對不要停止相ivity。


    當人們討論心態在致富中扮演了什麼角色時，我最常聽到一種反面聲音：如果是我的財務狀況得看別人的臉色和行動呢？你想法是要怎麼去改變別人的想法？金凱瑞的這個故事故事，正好可以回應這樣的疑問。很多人需要靠別人決定是否聘僱他們，比如：演員、企業雇員、水電工人、外燴廚師、保母、吹葉工人等；多層次傳銷的人也是這樣，他們


    需要靠自己的下線賺錢，從中抽取一定比例的回饋金額。但你可以轉個念頭想想，其實所有人都需要靠別人賺錢，或是購買他們的產品、服務，或是協助別人投資，或付錢找人主持有動，或只是靠別人施捨的一枚銅板買咖啡。我們獲得的金錢，實際上都是來自宇宙智慧，其他人經手後，最後才落到我們手中，所以沒有人可以用「我又不能控制其他人」當做一直處於破產狀態的藉口。我第一次經歷掌握自己心態的驚人效力，容我不要臉地說，就和金凱瑞那個一千萬支票的故事情節一樣神奇。這件事正好發生在我第一次和聘請的私人教練合作時，當時我找到一個教練，請她幫助我開啟我那個幫助其他寫手提案的線上事業。同時她還兼任我的私人教練，幫助我調整人生的狀態。那時候，我已經有幾個零散的個人客戶，而且靠這個網站，年收入其實已經是以前的三倍了。收入翻三倍對我來說，自然已經很令我興奮了，但這樣的收入又還沒多到讓我隨時想坐頭等艙的地板。我想要賺更多錢，是那種多到能覺得自己已經不一樣的金額。我想要那種抬頭挺胸、運籌帷幄、心想事成的感覺，不再只是混口飯過日子。我的教練要我說出一個數字，她請我估算，假設我做牛做馬累得要死，靠這個網站一週能賺多少錢？她要我不要去思考，也不要按計算機，不要考慮其他人收費如何，只


    要讓這個數字像直覺一樣自己湧現。而閃進我腦袋中的數字，是一週要賺五千美金。在這之前，我一週賺到的錢最多大概就是一、二千美金。所以五千美金這個數字真的滿嚇人的，但我非常興奮、不客氣地說，甚至可說頗相信自己的能力扛的不得了，肯定能夠讓這個目標實現。「很好，」我的教練說，「現在把這個數字乘以二。」等我終於從驚嚇中回過神來，我們開始擬定一套行動計畫。我是這麼打算的：找到三個人，和他們進行一對一個人合作，幫助他們完成一整本書的企劃，每人收費三千美金。接著我要把現有的一個團隊教練計畫以一千美金賣出，這樣的話，我一週的收入就可以達到一萬美金。但是要怎麼找到三個人，說服他們花這一大筆錢和我共事，我完全無頭緒。但我只知道，我就是要賺到這一萬美金，因為對我來說，其他的選項都不是選項。

    接著，我們兩個一起做能量練習，而我也對這些事有了愈來愈清楚的想法：

