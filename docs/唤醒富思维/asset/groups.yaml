    3. 在這些新事實中，找出最能激勵你的一件，每天早上、晚上抄寫一次，寫到你覺得它已深刻入骨為止。盡可能不斷在腦中重複它，大聲說出來，這樣你就好像一直把它榨進腦子裡，最後它會成為你的一部分。

