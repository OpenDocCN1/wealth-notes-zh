    富人們最常將他們的成功歸功於一項特質：死纏爛打，永不放棄。 不入虎穴，焉得虎子，成功和失敗的人之間的差別，就是成功的人不論環境再艱辛，總是能夠堅定地維護航向，朝目標前進。總難免遇到似乎一切都亂了套的時候：失去了重要客戶、儲藏室付之一炬、星巴克突然在你剛開張的咖啡店對面開了分店。在這種時刻，你有兩個選擇：你可以說：「管它的，我不幹了！」或者你也可以說：「混蛋！你就只有這麽點本事嗎？」當痛苦大到你好象再也無法承受時，如果你的心智軟弱，那你就會輕易把失敗歸咎於某人或某事；相反地，如果你的心智強大、穩固，你就能堅持下去。


    她運用這個厲害的業務技巧找到了第二個大投資人時，她的事業終於成功起飛。她找到一個導師。在二○○八年當時，她身邊許多規模更大的事務所都紛紛關門。大吉，她覺得自己再也撐不下去時，於是她去找了一個導師，他給了很好的建議：去衝浪。能過一天是一天，如果你放棄了，那大家就都輸了。雖然放棄的當下，你會覺得終於解脫了，但那之後，一切都完了。如果你的投資者要開除你，那就像隨他們吧，但是千萬別開除自己。絕對不要放棄！


    ## 用盡吃奶的力量


    我曾經和一個朋友一起去科羅拉多河泛舟，結束後，我們得從大峽谷最底部一路往上爬才能回到我們停車的地方。那次泛舟結束的時間比當初預期得還晚；也就是說，我們得快馬加鞭沒命似地沿著峽谷邊坡連爬八個小時上去，才有機會在太陽下山前抵達停車處。我們還在泛舟艇上時，我還想像著等dades可以悠閒地健行，在走上山的頭幾個小時，還能時不時停下腳步浸入路過的那條清涼溪水中，拍些自拍照片讓其他朋友對成功征服大峽谷的我刮目相看，當然最重要的是可以休息很久。我的身材跟所謂的健美相差甚遠，於是當我們終於在日正西落時抵達峽谷頂端，我幾乎腿軟到快沒辦法站好，累得半死，完全不確定在不尿濕褲子的狀況下走完這最後四分之一哩的路程。我還記得，我一邊拜託自己身體動起來，一邊喃喃自語一些自
    Escola話：「快到了，快到了！」我朋友朝我嘆嘆著一句話，我知道我聽得懂，卻沒辦法馬上意會過來。我轉過頭看著她，看到了她指向那座通往巴士停靠處的山丘。這輛剛剛靠站的巴士會載我們回到幾哩外的停車場，而它的班距是每四十五分鐘一班。就在那時，我才終於知道我朋友剛剛在對我喊什麼：快跑啊！把時間往回轉，回
    tới我們還在山徑中時，如果那時突然有一個人冒出來，手上拿著寫字板和一份問卷，問我這個時刻還跑得動嗎，我一定會回答：「絕對不可能！」這不是因為我覺得自己做不到，而是因為我的身體根本不聽使喚了。但是如果這個拿著問卷的傢伙跟我保證，如果想辦法跑起來，就可獲得獎賞，獎勵內容包括有地方讓我可以坐下來、一個起士漢堡、一杯啤酒和一個禮拜以來的第一頓澡，那我的答案一定截然不同。當我想要在天黑後坐在候車座椅上枯等四十五分鐘，全身黏答答、髒兮兮、餓昏頭，想要求要一罐保濕乳液想到要死，我就做到這件不可能的事：一路跑上坡，成功搭上巴士。


    為了讓自己感覺舒服，我們常習慣性地在某些地方就停下腳步來，似乎總是有個門檻，跨過去太可怕、太昂貴、太靠近成功了。然而要跨越舒適區、改變人生，我們就一定得跨越這道檻，可以想見對我們來說，這有多少可怕，所以我們的潛意識會招兵買馬，為了確保我們可以跑得離它遠遠的，愈遠愈好！我們對這些停止點常視而不見，而且總能想出拒絕自己成大事的絕妙藉口。如果
    изби想去賺得此生未曾賺過的這一大筆錢，衝破這個恐懼的門檻至為關鍵。眼睛睜大了，注意那些要你撤退的聲音，你必須了


    ## 成功需要冒不被喜歡的風險


    解，你面前是一道通往另一邊的魔法門，把注意力放在這個事實上，而不要一直想著好想趕快上床看雜誌，這樣你才能過到另一邊去。


    成功的人頑強不屈，意思就是說，他們比一般人更能持續保持信心。也因為這樣，一般人常會覺得那些還未獲致成功的成功人士很瘋狂、可笑，咿嘩幫幫忙喔。成功人士必須一直緊抓住目標，因為周圍的人常會不停對他們叫囂，以愛迪生來說，就是「你以為你是誰啊，你會變魔術嗎？你永遠不可能讓那個鬼東西亮起來的啦！去找個正經工作」行不行？」這類的喪氣話。曾經有一次，當我坐在飛機上等待起飛時，看看見這麼一場令我印象極為深刻的纏鬥力演示。當空服員正要關上機門時，一名女士急匆匆的帶著她的兩個兒子衝進機艙，被汗水濕濕的臉龐、披頭散髮、一臉狂亂，這種樣子只會在兩種人身景看到：千鈞一髮之際趕上航班的病人，或是剛殺了人的人。所有已經繫上安全帶，安全分坐著的乘客，被迫成為不情願的觀眾，看她努力地把行李塞進座椅上方hne
    置物箱，安置她的孩子們就位，一邊還得耽誤起飛時間而不斷跟所有乘客道歉。顯然她是在最後一刻才買機票，所以三個人的位置並沒有劃在一起，而是連著三排最中間的位置，這也讓她得費力地讓大家
    就定位。 不過，對她來說，最困難的地方是她那個拒絕坐下的大兒子。他看起來大概九歲上 下，他一邊看著自己的弟弟努力爬進最中間的位置時，一邊靜靜地告訴媽媽，他想要坐
    在靠窗的地方。她當然回他：「你運氣不好，靠窗的位置都賣完了，你得趕快坐下」這 類的話，但他只是冷靜地回答：「不要，我想坐在窗邊。」聽到這種話，這個媽媽氣得
    斥責他：「坐下！」但他又再次拒絕，使這個媽媽只能忙不迭地低著頭又跟大家道歉。 我坐在自己的位子上，靠窗的位置，看著這一 切，盤算著我是否該乾脆把位子讓給 這個小男生，替他媽了結這場折磨；還是我應該請她當我的教練？在面對整架飛機裡
    不耐煩的火大成人的這種急難中，竟然還有人可以有這種毫不動搖、冷靜的決心，我真 是前所未見。這個小男孩，沒有展現出被寵壞的屁孩樣子，也沒有拳腳相向，他只是堅
    持立場，直到坐我前面的那位男士終於受不了起身和他換了位子。 他對目標的渴望和想像壓倒其它一切可能，讓他除了目標之外，對其它一切，被公 開羞辱、被除了他媽媽之外的
    人罵、被罰這一輩子再也不能看電視等視而不見。 他以不


    ## 別理搗蛋鬼


    屈不撓的態度，展現出他對這些邁向成功最大的攔阻，被他人喜愛和融人群體的需求，毫不關心。如果想從貧窮到富有，也需要持續冒這個不被人喜歡的險。你不能在大改變自己的人生同時，又期待身邊一切，特別是你和他人的關係，都如常不變。當你不再是那個舊的你時，有的人會被你激怒，你會失去一些朋友，或許和家人的關係也會出現裂痕。所以你那份自我成長的渴望、你即將創造出的生活的模樣，和與之相關的各種感受，都得時刻牢牢地被擺在你腦袋裡的最優先位置，這樣你才能有勇氣堅持到底。你要相信，你的渴望一定會實現，你也要知道，雖然你還是很愛那些在追逐夢想過程中失去的人，但你也會吸引到和你頻率相同的搖朋友。


    當你下了毫不含糊的決定，立志改變人生和變有錢時，你的潛意識不會開始朝你丟出所有最深的恐懼，同時它還會端出我稱為「搗蛋鬼」的東西。所謂的「搗蛋鬼」，就是一些超有吸引力的誘惑，是心裡的小王子為了讓你脫離預定計畫、重回舒適區，而精心為你量身訂製的。


    我有一個客戶決定辭去公關工作自立門戶。她很奮終於可以當自己的老闆，自己決定上下班時間，同時也決心要賺很多錢。她住在一個小鎮上，意思就是說，沒有很多業務，職缺也不多，鎮上的公關公司，除了她自己開的那間之外，只有另外一間；而在她辭去工作一週後，這間公關公司提供她一個工作機會。對方的條件令她垂涎，某部分她很害怕萬一拒絕了這個機會，選擇自立門戶，恐怕也找不到夠多的客戶，也可能賺不到什麼錢。雖然如此，她還是不是為所動，而就在她拒絕對方邀約的隔天，我不誇張，真的隔天，就有七個客戶打來聘請她擔任他們的公關。宇宙智慧之所以給你欲求，就是要你去追求、實現它們。當你把完成目標所需要的能量、行動和心態都對準了，宇宙智慧自然就開始動作。當你決心要致富時，你必須精準地聚焦在這個決定和你為什麼想致富的情感理由上，因為你總有一天會遇到會讓你偏離目標的誘惑。想要成功，你得讓這些鴨蛋鬼過門不入，這樣你才能抓住跟在它後頭的那
    些機會。


    ## 養成能讓你成功的習慣


    當我們談到習慣時，通常會想到諸如咬指甲、抽菸、罵髒話、玩頭髮、早起遛狗、用吼的方式講手機等行為，事實上，這些習慣構成了我們生活中大部分的行為：懶散是種習慣、感到不知所措也是一種習慣，遲到是，失敗也是，成功、有耐心、愛說八卦、賺錢、破產，林林總總，都是習慣。習慣，就是一種不假思索，反射性和重複性的行為，考量到我們常不經思考就行動，因此我們的行為大部分都可以被歸在習慣這個區塊中。

    人們常處在一個根據潛意識反覆行動的狀態之中，而一旦我們察覺到這個現象，並且決定要改為有意識地回應現實，我們就可以改變習慣；而當習慣一改變，我們所處的現實也就跟著改變了。

    本書花了許多篇幅討論要怎麼藉由改變思考模式、信念、說的話等來改變習慣，但由於習慣的範圍實在非常廣泛，所以我會給你一些小撇步。但首先你要先建立一下這此習慣（如如果目前你還沒有的話）。以下是成功人士常有的一此習慣，他們：

    - 勇於冒險

    - 堅守決定

    - 對周邊發生的事有所覺

    - 不遲到

    - 憂敗厭戰而非就此放棄

    - 談論想法而非他人

    - 與狼角色為伍

    - 訓練耐心

    - 專心致志

    - 保持紀律

    - 不斷學習

    - 充分授權

    - 勤上心靈健身房（閱讀和自我成長主題相關的書籍、運動、冥想和策劃團隊共事）

    - 聰明工作

    - 樂於回饋

    - 設立界線

    '
