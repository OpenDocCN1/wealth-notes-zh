    visualization 算一算這數字吧，但我就直接跟你說了，這占了我年收入相當可怕的比例。這筆錢是我購車金額的兩倍，比我的家具、衣服、冷凍捲餅等全部加起來的錢都還要多，也比我未付清的學貸多。有一些字眼可以用來形容這種行為：不負責任、做春秋季大夢、頭殼壞去。我不但刷爆了手頭上的那張信用卡，同時還刷爆那張我剛申請而且神奇地被核發的信用卡，也因為這樣，我負債又更多了。對我來說，賺錢是為了讓自己有自由和選擇：不再負債、可以環遊世界、搬進一間能讓我同時接待超過兩個人的房子等；這些都是很好的動機，但我那份「想成為一個不一樣的的人」的決心，才是讓我可以每天早上捲起袖子幹活的真正原因。我希望能隨心創


