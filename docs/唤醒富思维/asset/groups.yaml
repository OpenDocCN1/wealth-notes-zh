    ## 延伸你的想像力


    想像力是我們致富路途中最酷的一份禮物。在想像力這座廚房裡，我們可以烹煮出兩道不同的假想模式。


    1. 從環境和經驗中採集到的材料，弄成我們喜歡的樣子：我看見自己住在和隔壁尼爾森一家一樣的房子裡；我看見自己藉著創造出夢想的生活，讓孩子知道凡事皆有可能；我看到自己請酒吧裡的每個人喝飲料等。


    2. 從靈性領域中擷取材料，然後將其實現生活當中：比如說創造出太空旅行、蓋出第一棟摩天大樓、發明出電動開罐器等。


    想像力之所以這麼棒，是因為它不需要倚靠具體的環境、五感或任何父母的話等這些東西，就能創造出新的事物。經由我們的想像，而不依賴現在所擁有的「事實」，我 們反而可以擁有無限的可能。當我們的
    心和想像力作主時，萬事都可能。


    如果想要大幅度地改變生活，就需要延伸想像力，因為現實無法提供夢想中的生 活。「好吧，我已經五十八歲了，我在鞋店上班，靠這份薪水養活老婆和兩個小孩。你跟我說我可以擁有夢想中那間在太浩湖的旅館，然後一整天都在教人怎麼釣魚？這怎麼可能發生？絕對不可能！」我們不敢夢得太大，因為那看起來有點蠢。我的意思是說，我們可以成天談論一年要是可以月入數百萬該有多好，但真的下定決心，抱著「他媽的我一定要達成這個目標，不達目的我死都不會放棄」的態度去執行，可是完全另外一回事。畢竟光是思考這個想法都
    需要勇氣，更遑論帶著必成的決心去執行。當某些目標看起來很大、很嚇人、很困難達成時，你需要在看見任何可能成功的跡象前，先相信自己可以做得到，甚至要忽略那些說你做不到的聲音或現實，因為我們接著就會把夢想的規格降低，追求較為合理的目標，或不需要求這麼多，都會讓目標看起來比較容易而且「實際」。即使所有跡象都指向「死都不能」，但總是有
    人相信凡事皆可能。正是這樣的人才能致富。


