    需要靠自己的下線賺錢，從中抽取一定比例的回饋金額。但你可以轉個念頭想想，其實所有人都需要靠別人賺錢，或是購買他們的產品、服務，或是協助別人投資，或付錢找人主持有動，或只是靠別人施捨的一枚銅板買咖啡。我們獲得的金錢，實際上都是來自宇宙智慧，其他人經手後，最後才落到我們手中，所以沒有人可以用「我又不能控制其他人」當做一直處於破產狀態的藉口。我第一次經歷掌握自己心態的驚人效力，容我不要臉地說，就和金凱瑞那個一千萬支票的故事情節一樣神奇。這件事正好發生在我第一次和聘請的私人教練合作時，當時我找到一個教練，請她幫助我開啟我那個幫助其他寫手提案的線上事業。同時她還兼任我的私人教練，幫助我調整人生的狀態。那時候，我已經有幾個零散的個人客戶，而且靠這個網站，年收入其實已經是以前的三倍了。收入翻三倍對我來說，自然已經很令我興奮了，但這樣的收入又還沒多到讓我隨時想坐頭等艙的地板。我想要賺更多錢，是那種多到能覺得自己已經不一樣的金額。我想要那種抬頭挺胸、運籌帷幄、心想事成的感覺，不再只是混口飯過日子。我的教練要我說出一個數字，她請我估算，假設我做牛做馬累得要死，靠這個網站一週能賺多少錢？她要我不要去思考，也不要按計算機，不要考慮其他人收費如何，只'
