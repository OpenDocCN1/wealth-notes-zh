    ## 暴衝山羊教會我的事


    離開那兩隻山羊旁邊，就算有，也不會離那些羊超過二十呎遠。「你自己在這裡幹嘛呀？」我一邊走下車一邊問著，同時豎起耳朵等著聽到羊蹄敲擊玻璃門的熟悉聲音。我腦中的第一個念頭是，「真奇怪，我不在家的時候，牠們還會想要進屋啊！」（畢竟牠們喜歡來煩我的程度，大概就跟那匹馬黏牠們的程度一樣）；而第二個念頭是，他媽的，這下糟了。


    我發現這兩隻羊根本不是試著想進門，而是拚了命地想出來。以一種感覺像慢動作的快跑，我衝進屋子把羊趕出去，竭盡所有力氣把門關上，並且加固這扇剛被攻破的大門。然後當我有時間能好好看看眼前這幅景象時，事實上，我只能呆呆站著，雙手撐著嘴巴，嘴巴不斷重複念著「我的天啊」！眼前景象彷彿一場放浪形的戲的兄弟會派對後的樣子，史詩級的災情慘重、晴天霹靂、令人咋舌的恐怖，儘管百般不願，但除了死盯著這個災難現場，我也實在沒能做別的事情了。山羊們終於實現了牠們不可能的夢想了！牠們把玻璃拉門踢出軌道，大搖大擺通過內門，而內門在牠們進來後自動關起來，就這樣把牠們困在室內。而既然在室內也沒啥事可幹，於是牠們在這興奮的五小時內，盡情地大肆破壞。牠們的破壞活動包括踢倒每一盆盆栽、打碎花架，把泥土、花架、花架的屍體碎片踢得到處都是，有些被踢得距離之遠，著實令我驚嘆。不只這樣，牠們還把上頭還擺著玻璃杯的擦碗布從流理臺上整個扯下來，玻璃碎片當然也噴濺得滿地都是。接著就是堪稱重頭戲的尿尿派對，在每一件家具和所有你想像得到的角落盛大展演。牠們排泄物在我的床上，白色沙發、咖啡桌、飯廳餐桌、玄關長凳上，還有我的浴室裡。牠們的尿量實在驚人，事實上，我覺得牠們一定還招手要那匹馬一起進來參加這場尿尿派對。最後的高潮是牠們跳上跳下，幾乎把每件裝飾品從牆上打到地上，這到底是誰的主意啊？我的第一個反應是震驚，當然我也得承認震驚過後，我其實頗為讚嘆牠們的鉅作，好一場了不起又徹底的破壞工作。不過從牠們樂此不疲、鉅細靡遺的破壞，和顯而易見對自己行為的自我豪中，我們還是可以學到一兩件事的。這些山羊很完美地示範了成功的祕訣：○用咬、踢、踏等方式，順利通過任何擋在路上的障礙。○視規則如糞土。


