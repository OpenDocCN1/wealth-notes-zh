    ## 請成為最好的自己


    我曾在北加州的一個農場裡待過一陣子，就是在那段時間裡，我完成第一本書。

    和農場主人說好，只要我能好好照顧他們的馬和兩隻公羊，我就可以擁有這座占地整十七公頃，有著美麗房屋和一望無際視野的天堂。我其實有點怕馬（是說，要照顧這種大型動物，難道不需要有什麼特別的執照或文憑之類的東西嗎），至於山羊，除了知道牠們可以咬穿鋁罐之外，其他一切相關的知識近乎於零，但由於我實在很喜歡這個地方，再加上也喜歡動物，待在那裡的時間成了我生命中最快樂的一段時間。

