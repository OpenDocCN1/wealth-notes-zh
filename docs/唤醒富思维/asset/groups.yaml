    # 只要你想要的，都會實現


    不管你腦中想到什麼，不消多時它就會出現在你面前。


    話短說，在快到皮夾裡那張支票上頭的日期之前，他獲得電影《阿呆與阿瓜》中的角色，這個角色，讓他得到一千萬美金的片酬。我們可以任意地想像，但我們得為想像出來的財務負責。宇宙智慧有雙大耳，架，緊緊貼著你的腦袋，仔細聆聽你腦中的各種想法——也就是他的工作指令，這樣當他收到指令後，就可著手為你創造出你腦袋中那些想法的實體。


    我很喜歡金凱瑞的故事，因為它描繪出如何正確掌握致富的心態：


    0 要清楚知道自己想要什麼，並且明確描繪它，你的目標為何？你希望可以從中獲'
  - '[PAGE 142]


    得多少錢？你需要多久才賺得到這筆錢？你為什麼想要賺這些錢，你會用來做什麼？


    把想像自己達成目標的這個畫面牢牢記在腦袋裡，然後以認真的決心和絕不放棄的使命感達成它。


    深深地、瘋狂地愛上這個你想像出來的現實，這樣的話，不管什麼限制性的潛意識，信念發作、生氣，也都無法阻止你。


    你的信念要和消防員的魁鬣一樣堅實。就算你覺得已經等了快一百萬年還沒等到，你的心裡仍舊要懷抱著萬分感謝，彷彿自己想要的東西已經到手。絕對不要停止相ivity。


    當人們討論心態在致富中扮演了什麼角色時，我最常聽到一種反面聲音：如果是我的財務狀況得看別人的臉色和行動呢？你想法是要怎麼去改變別人的想法？金凱瑞的這

    個故事故事，正好可以回應這樣的疑問。很多人需要靠別人決定是否聘僱他們，比如：演員、企業雇員、水電工人、外燴廚師、保母、吹葉工人等；多層次傳銷的人也是這樣，他們'
