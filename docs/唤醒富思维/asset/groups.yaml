    ## 就是要有錢三步驟

    一、念出來就是你的：


    錢在我們的生活無所不在，想像一下，還有什麼其他東西和錢一樣四處充斥在我們的生活呢，如果你想到它時也和想到錢一樣，充滿了厭惡感，那又會是什麼樣子？舉例來說，如果把錢代換成⋯⋯天空呢？天空真是萬惡之源、討論跟天空有關的事是不禮貌的、因為我愛天空，所以我是一個很不好的人、天空可以讓正直的人變成豬等。如果真是這樣，你根本就不踏出家門，更別說還要享受人生樂事了。

    如果有意識或下意識地憎惡金錢，或緊抓你對金錢的有限認識不放，或也不願意去賺錢，這麼做並不能幫助你自己或其他人，肯定也不會讓你變得更高尚；反而只是將自己拒於所有讓你得以生存、成功的事物之外，這和絕食其實沒啥兩樣。擁抱金錢，跟上金流，如此一來，你就可以打開自己，準備好接收那份現在正試著要找到你的豐富生命。


    我愛錢，錢也愛我！


    二、思想大改造

    請回想並認真地回答下列每項問題：

    1. 列出五件你父母曾透露出對錢的看法。

    2. 上面這五件事當中，如果有一些是負面的，試著去破解它們，並重寫關於金錢的新事實可運用我在本章示範的做法。

    3. 在這些新事實中，找出最能激勵你的一件，每天早上、晚上抄寫一次，寫到你覺得它已深刻入骨為止。盡可能不斷在腦中重複它，大聲說出來，這樣你就好像一直把它榨進腦子裡，最後它會成為你的一部分。

    4. 留意你生命中有哪些地方，由於你死抓住安全感不肯放手，因此難以突破？有可能 是明知對方不適合，卻無法和他／她分手；或是不願意花錢在一些好玩的事情上；或因為想討人喜歡／覺得自己「應該要」／不想被人指指點點而去做一些讓自己無聊到想哭的事；或不好意思告訴你那愛八卦的鄰居，不先說一聲就突然造訪很不禮貌等。找出那些對你一點幫助都沒，只因為能帶給你安全感，所以讓你一直不敢輕易放手的事，然後跨出第一步：放手。這點很重要、很關鍵，就算你一時時間沒辦法馬上想到任何事，請繼續想，直到找到為止。這麼做會讓你生活中各個層面都有很大的改變。

    三、請填空以下句子：我很感恩我有錢，因為。

    成功故事分享：她做得到，你也可以！

    以下是珊卓的故事。

    四十四歲的她，決定投注信心在自己渴望的事情上，而不是著眼於從小被教導應該要相信的那些事：我住在中西部，曾有一段時間，我只能住在拖車上過活。

    現在我擁有

    一間位在加州

    的海灘度假屋，是我夢寐以求的房子，不只這樣，我也是一位成功的演員。即使如此，我對錢有種另一類的不安全感，我認為如果我賺很多錢，就會把自己的生活搞得很複雜，我也會不知道該怎麼應付這樣的生活。我不想擁有超過一天、一週、一

    個月所需的金錢，因為我會不知道怎麼管理它們。我可能是覺得自己不夠聰明吧，反正

    我最不缺的就是各式各樣的奇怪理由呵欠。後來我借助了珍在上述三個步驟改善跟錢的關係。


    步驟一：我每天都認真對付內心的思想與信念。我著手了解自己對於金錢的疑慮，然後用新的信念取代這些恐懼，比如說，我愛自己、肯定自己、我雙手擁有宇宙中的美好和豐富、我知道自己在做什麼、我值得成功、我值得被人尊重、也配得獎勵、金錢，我也值得這世界所提供的一切美好事物，每個人都可以獲得這世界的財富和成功，我也例外。


    步驟二：我和個人教練合作，聘請專人處理那些我不擅長和沒有興趣的事。這麼一來，我就可以把專注力放在「做自己」，以及創造、完成對世界有價值的事上頭。我讓別人去處理銷售、營運、法律等問題，而我則時刻留意，不讓自己搞砸自己該做的事情。


    步驟三：我不斷跌倒，又不斷站起來，次數之多是我前所未曾想像過的。成功並不是一件完成就可以停止的事，它是一場永遠沒有終點的遊戲。我也練習去想像和感覺成功的滋味，彷彿我真的已經完成、勝利了。要愛你自己，因為你是獨一無二的；讓獨一無二的你去做些屬害的事吧！就算是別人覺得你瘋了又怎樣？不管你決定要做什麼，都要開開心心、積極、有恆心地去做，這麼一來，它就能成為你賺錢的工具，更能夠讓你快樂。


    ## 第 2A 章/

    簡短的一章：

    關於宇宙智慧


    ## 我們感官以外的存在


    你應該曾對一些事情深信不疑，你或許會稱之為命運、運氣、天意，或可能也曾說過「好哇加在」之類的話。當支持的球隊快輸球時，你會在心裡祈禱；有時候，你突然注意到汽車後照鏡中閃過藍色和紅色的亮光。你也可能曾感謝過那個叫做「老天」的
    人；或是當你看到一支影片，是一名老太太踩在滑板上飛越她的孫子們時，在差點脫口 而出「我的老天鵝啊」前，緊急煞車在「我的」這兩個字上。你一定曾在某些時刻不得不到一些線索：「我也不知道為什麼突然想在家前繞到我媽家看一下。還好我有去，不然她現在應該還跌在地板上爬不起來。—你隱隱約約能感覺到，好像有一個腦袋無法全然理解的力量存在，參與在我們的生活裡。有時候，你會感覺脖子後的寒毛直豎，即使只是這麼點小到不能再更小的感覺，你都是在和宇宙智慧說聲「嗨賀」！我之所以這麼堅持你應該了解這點，是因為一旦你認識到，在肉身之上還存在一股更大的力量，而且它還參與在你的生活中，你就能夠和這股強大且無限的力量合作賺錢了！這麼說好了，我們的五感是很有限的。人們的感官只能提供感官能夠接受到的資訊，舉例來說，我們嗅覺的能力就遠遠不及狗兒，臘肉罐頭的封口才剛撕開，你的狗立刻就聞香來了。別忘了，牠本來正在廚房隔壁的房間裡呼呼大睡呢！至於蝙蝠，可以用頻率高到我們聽不見的聲音，當著我們的面大說特說我們的壞話；貓兒的夜視能力更是好得不得了，牠們可以在晚上舉辦的障礙賽裡面把我們狠狠比下去。大部份的人認知的「現實」都受到五感的限制，但是在五感可以接收到的範圍以外，還有很多無止無盡，和宇宙一樣廣大的事物正在發生。電力與重力，是在每一天中時刻影響我們生活的兩件事，然而我們卻看不見它們，更不用說，只有少部分的人能夠真正理解它們運作的原理，但是我們卻自然而然地相信電力與重力的存在；同樣地，宇宙智慧和思想的能力同樣也非常真實，並且隨時隨地都在影響我們的日常生活中。你相信重力，所以你不會傻到想從屋頂上翻下來；你也相信電的存在，所以你也不會拿叉子去戳插頭讓自己觸電；你不見得明白它們運作的方式，但卻完全遵守這些規則。我想鼓勵你照著這項訊息去練習，既然你已經啟程邁上這條追求財富的道路，不如就試著做看看，讓結果說話。當你經歷到思想和宇宙智慧這股強大的能力，開始賺進大筆白花花的銀子時，即使你可能還是無法弄清楚每處細節，但你就會同意我說的了。我們居住的這個宇宙是由能量所構成，萬物充滿活力、不斷移動、變化、忙碌，不論你看得見或看不見的事物皆然，一本書、微波爐、一輛車、一塊磚頭、一個念頭、金錢、話語、一塊石頭、成堆的醃辣椒等。而人們通常透過五感來解釋這些能量運作的方式：眼睛接收到光源、耳朵能轉譯聲波、觸覺能告訴我們東西是硬的還是軟的等。然而五感只能應用于解釋具體的東西，範圍相當有限；如果要閱讀現實，那麼我們同時還需要經過腦袋中信念系統的過濾，而這套信念系統，又是由我們從小到大所蒐集到的各種資訊所形成。於是乎，我們對這世界的認知，就這樣被夾在這個由五感經驗和信念系統所結構出的一真實藍圖之間，可以說，它是極為受限的。身為一個活在地球上，擁有清楚意識的人類，有件事讓我興奮不已，不論我們的事


    看不見的世界創造出看得見的世界。


    實藍圖、五感，甚至狗、貓、蝙蝠的感官怎麼說，確實有一個超越它們的現實領域存在，而我們也有能力進入這個領域，而且透過我們的思想，我們就可以登堂入室。任何事情要發生以前，一定會先經由思想：令人讚嘆的太陽系、你最喜歡的那首歌、你銀行帳戶裡的餘額等，所有的事皆如此。我們的思想會和看不見的能力連線，而且正是我們的思想，使用了這股能量創造出我們所見的一切。最厲害的還沒結束，基本上，你的思想也擁有和宇宙智慧一樣的力量，就如同流入洋海中那一小滴水，其實是整個海洋的一小部分；你的思想也是宇宙智慧的一部分。換句話說，你根本就是超人嘛！

