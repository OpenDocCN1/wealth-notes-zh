    ## 改變愈大，愈需要這些特質


    當我下了決定，決心要和這個教練合作時，我那股想要改變、不想再成為「現實」受害者的這股渴望，驅使我轉換想法，從我付不出這七千美金到管他的我一定會想到辦法。於是我集中所有能量，專注於這股想和她一起合作的渴望和信念上。這個教練專精於幫助女性致富，她本身就是很成功的企業家，靠著這份事業賺得了數十萬美金，但她也曾窮到付不起電費；某一次，她因為信用卡根本已經刷不得了，而不得不請走披薩外送員。這個人對披薩說不呢！簡直比我還慘。對我來說，比起她的收費、我的債務，或沒幹成這票我很可能得搬回去和我媽一起住，更重要的是我心態的轉變。我已經到了一個真的很厭惡自己如此窮困、如此動彈不得的癌步，我明白自己的一生可以成就更多事，可以更認真下決定，抓住每個賺錢的機會，採取必要的行動。所以當遇見這個教練時，我沒有去檢查價格吊牌和我的銀行戶頭，然後想著，喔好吧，這大概不是天賜良機，或許我應該打些電話看看誰有空一起來喝酒，而是催逼自己去籌出這七千美金。這是每個人都要面對的關鍵時刻｜當宇宙智慧把你恰恰需要的事物就這樣送到你


    面前時，你需要以行動回應。你是要繼續抱持那些低頻率的想法：「我很窮，如同我銀行帳戶所顯示。就是這樣」；還是你願意拉高頻率，想辦法轉念：「我現在的財務狀況只是暫時的，它不能定義我這個人，只能用來說明我目前所在位置，錢就在我的附近，我要想辦法去找到它，然後搞定這件事。」假設我要你在二十四小時內就賺到兩千美金，如果你沒有對的心態，那麼你大概會願意至少試個幾小時，然後就屈服於「因為我毫無頭緒／太懶／太忙，所以辦不到、我試過的所有辦法都沒用、已經沒有辦法可以想了、看來只剩下歪路可以走了」等念頭。但是如果在櫃子裡塞滿硬幣，然後揮舞著這只櫃子一路追打你，逼你生出錢來，我相信會讓你對別的選擇更開放，還可能激發出之前想不到的辦法（去貸款、把車賣了、向那
    些讓你覺得可怕但很有效辦法的人求援等），只因為我打得你非生出錢來不可。有志者事竟成，但我們總喜歡假裝無路可走，好讓自己不用承擔失敗的責任，也不用為了成長去做那些令自己不舒服的事。致富的最大祕訣，並不在於限定一個絕妙計畫或辛勤奮鬥、擁有好的人脈、找到最好的時機，而是於你的思想和情緒。我們的思想和情緒不僅能催出行動，還能供應「一創造雞尾酒」所需的各種原料。


