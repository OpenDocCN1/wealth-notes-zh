    ## 6. 你目前待業中，想要找一份工作。


    列出那些對你來說很重要的，心目中夢幻工作的條件：薪資數字、想和什麼樣的人共事、這份工作可以運用到哪些技能、上班的服裝要求、去上班時的感受、公司是不是每週四都提供免費的貝果等等。愈鉅細靡遺，這份夢寐以求的工作就愈有真實感；最重要的去感受這個感覺。不分日夜，你都要去想像畫面，沉浸在那些感受中，心存感謝知道這份工作一定存在於某處，並且要帶著堅定不移的信心，相信它正朝你前來。最後別忘了，管好你的嘴巴，別一直講那些沒營養的話，諸如：找工作好難喔、我快抓狂了、景氣超爛的、我太老了、找了快一百萬年、我是不是看起來一臉衰樣，是不是這樣子才沒人想錄取我？讓你的思緒、說出口的話、信念和感受都和你渴望的工作相配，然後未達目的前都別停下腳步來。要記住，不管你在尋找什麼，它也在尋找你。用你知道的每種辦法找工作，跟認識的每個人和他們認識的每個人說你在找工作（特別是那些你很少接觸的人），把履歷上傳到求職網站，和在相同產業裡上班的人聊聊，徵詢他們的建議和推薦，或乾脆找個獵人頭顧問。用盡一切辦法，然後再多走一哩路，你的工作就在這裡，如果它不存在，那你也不會有想做這個工作。


    作的念頭。讓你的信心、頻率維持在高檔，常存無盡的感謝之心，開放心態，不停止努力，直到工作出現為止。把握機會。如果你渴望的那份工作還沒找到你，那退而求其次，接受那些能幫助你靠目標近一點的工作。當然它不會是完美的，但如果它能幫你進入你想打進的圈子，那就立刻行動吧！

    不論你現在正走在哪條路上，下面是我給你的建議，這些建議非常關鍵，但也十分基本，如果你想致富，它們都是不可或缺的：

    你想被用什麼樣的態度對待，就用同樣的態度對待金錢。你和金錢是有關係的，為了讓一切順利，你需要用時間、注意力和愛投放在這段關係裡。讓孔方兄有藉口跟你廝混，關心它的一切。

    弄清楚你現在手邊到底有多少錢，你的收入來源有哪些（薪水、投資、版稅、小孩的髒話罰款筒等），每個月你需要多少生活費，還有你每一毛錢花去了哪。你專注在什麼事情上，就會創造出更多它來。為免你迅速進入無法承受／顯示為已經很煩的模式，我先告訴你，這件事大概只會花你十五分鐘的時間。


    對金錢懷抱敬意，留心自己怎麼花錢，並且心存感謝它為你的生命帶來美好。

    多說說錢的好話，不論是給予或接受，都要帶著歡喜、感謝和慵懶的態度。如果看到地上有錢，把它撿起來給它一個好歸宿。

    如果其實是在滿頭問號、毫無頭緒、手足無措，不如就聘請專業人士，諸如理財顧問、會計師、記帳師等幫你管錢吧！別找那些跟你一樣窮得脫褲的朋友提供財務建議，行行好，去找那些知道自己在幹麼的人吧！

