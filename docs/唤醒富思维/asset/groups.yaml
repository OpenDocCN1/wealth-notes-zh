    次當我問她還好嗎，她總是回答我，「還在撐著呢！」大概一年後，我有機會再跟她聊上天，這才欣喜地發現，她終於找回自己的聲音，不只能說出完整的句子，還能用比嚮語大的音量跟我說話。終於在風雨飄搖中過了快一年後，她的事業現在終於生龍活虎了。今天這位以前住我隔壁的孿屍終於可以獲得和過去相比將近二十倍的淨利。二十倍耶，各位！現在的她，只和自己喜愛的人合作，同時還能一邊兼顧家庭，她也絕對不會忘記，要不是因為她一直死撐著，喔！還有想出一個逃避審員義務的絕妙藉口，這一切都不會發生。她把握住這些關鍵的心態，不僅幫助她做出信心的跨越，同時也讓她在辛苦跋涉過創業頭一年的黑暗幽谷時，能夠繼續保持方向，這些關鍵心態是：

