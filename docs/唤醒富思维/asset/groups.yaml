    問題：你是否了解，只要你決定去做，任何事情都有可能發生，包括找到一份既有趣又能賺錢的工作？

    答案：懂了！

    重寫想法：我能讓賺錢這件事變得有趣！


    就算你心裡還沒辦法百分之百相信這個新版本的說法，但這些新的想法是不是比原本的悲慘版看起來令人振奮許多？這樣你是否明白，改變描述事情的方式就好比技師更換壞掉的化油器一樣，它並不是太麻煩或太痛苦，而且能夠真正幫助你改變人生。除了上面提到的，還有一些很常見而且耳熟，堪稱大魔王等級的想法。試著找出那些你常想和常說的話，重新改寫它們。


