    a. 做好準備，應對可能會有的不舒適。你知道的，把鐘點費翻倍可能會讓你覺得有點奇怪、很可怕的，在你真的跟客戶漲價前，先練習感受這個感覺。學習感受、習慣不舒服的感覺，最後你就能夠理解這都是必要的過程，到時就不至於大驚小怪了。把不舒服的感覺，和進步跟大殺四方的快感連接起來，而不是去連結那些會讓你停下腳步的恐佈事物。

