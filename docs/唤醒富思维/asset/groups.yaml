    他一個人在那等死。這趟飽受折磨的旅程似乎持續了九百年之久，如果你讀到這裡，心裡\n想著「等等，她好像在形容我的致富之路」，那你好好聽好了，因為接下來會有許多好\n\
    東西，能幫你成功擺脫冷清得跟冰凍荒原沒兩樣的銀行戶頭。\n這個登山者下的第一個、也是最重要的決定，就是他決定要活下來。這聽起來很像\n廢話，人不是本來就有生存本能嗎？但是你真的有決定要活下來嗎？我的意思是說，以\n\
    你知道自己會喜愛並樂在其中的方式活著？如果你真的想要致富，想要活得不虛此生，\n那你得下定決心用和這個登山者一樣的纏鬥力達成目標，他可是面對了巨大的生命危險\n\
    \n## 真正的決心是不留任何退路\n\n你必須有一個跟十噸大猩猩一樣重、難以撼動的決心，牠會在你脖子後面對你吹氣，要你用盡一切辦法，一路輾過所有恐懼和潛意識裡的「絕對不要」，向前躍進未知。\n\
    做決定，意味著你不會有備案，你已經用一隻腳擠開門，現在兩隻腳都要進門了，你完\n全準備妥當，可以來大展拳腳、讓別人知道你的厲害了。\n\n和幾乎不可能生存的機率，更不用說腦中還擔著一首很糟糕的歌，儘管這樣，他還是堅持不放棄。如果你所謂決心的重量不會是輕如鴻毛，而沒有重如泰山，那麼每當事情出錯、遇上困難，或你得花上更多金錢、時間時，你就會很容易地搬出那些你最愛的老藉口，編寫出相當具說服力的內心獨白，說服自己放棄是完全合理的決定，同時繼續衡量著其他可能選項：噢！如果我乾脆放棄躺在這，我想不出幾個小時後應該就會被凍得硬邦邦，什麼感覺都沒有了，到時我就可以好好來觀星，最後我會慢慢睡著，然後小鳥會開始啄我掉爛的那條腿。\n\
    \n如果你為自己想好了備案，那你根本就還沒做好決定。「決定」（Decide）這個字的拉丁字根字面意思就是「切掉」；也就是說，不考慮任何其他選擇，全然投入唯一的選擇。做決定，常會讓人覺得崩潰或是抗拒，因為一旦決定只做某件事，就表示他們會錯過其他很酷的事，一想到這，就令他們抓狂、害怕了。但如果每件事你都想做，到最後你就會一事無成。\n\
    \n通常成功的道路上，最容易讓你跌了個狗吃屎的香蕉皮就是當你的時間和專注力被切割。什麼都想做的人，或許能把其中幾件做得不錯，但卻無法真的在一件大事上大殺四方。你得做一個認真、難以撼動的決定，不達目的絕不停止下腳步，獎賞之一，就是一旦你獲得財富，就有機會去做為了專注致富而犧牲掉的那些事。\n\
    \n如果 你把這一頁撕下來，整本書只照著這一件事做──下一百萬分的致富決心，然後堅守這份決心，持續努力直 到你達成目標，你還是會成功的。因為當你狠狠下定決心時，你的腦中就會執著於讓它實現的這個想法，你會四處尋找機會，即使看起來很嚇人\
    \ 的；你的信心會強壯如牛，因為如果你不相信自己能致富，一開始壓根就不可能走到現\n\n思想會帶來渴望，然而只有決定採取行動時，才能真的接收到它。\n\n\
    在；你會心存感謝，知道自己渴望的事物早已存在，你想得到它們，而而且它們會日趨真實；你敢冒大險，而且不能容忍別人跟你說「這根本不可能辦到」。想想看，你可以做很小的決定，比如為浴室牆壁換個顏色，而突然間，你就好像有了洪荒之力，開始用一個全新眼光看待牆上那個明明已經看了一百萬次的顏色，興奮地開口閉口都是這個話題，甚至到了朋友一看見你遠遠走來，\
    \ 手上拿著更多油漆色票時，就嚇得趕快翻牆逃走的地步。一個堅定不移的決定能讓一切 — 你的心態和你的行動，按部就班開始動作，同時也會向宇宙智慧發出信號，讓他知道事情會變什麼樣子，好讓他開始為你挪動所需一切，朝你直來。\n\
    \n## 好點子是要拿來實踐，不管有多瘋狂\n\n好點子是宇宙智慧寫給你的情書：\n這是送你的禮物。我覺得你好性感。你無所不能。快去跟整個世界分享這個棒得要命的你吧！\n\
    \n這裡我想指出一點，當我說宇宙智慧會為你挪動所需一切朝你直來，這包括想法、機會、人事物等。當你下了決定，就是在告訴宇宙智慧：放馬過來吧，既然如此，你就得格外注意自己的思想和那些突然冒出來的新點子。你一定得在舊的你、舊的思維冒出來阻止你之前，就先掌握主權。什麼？就這樣跳上飛機，直接去拜訪史提夫叔叔，請他賞我一個工作？門都沒有！這太瘋狂了！一個突然在腦中冒出的好點子有可能就此改變你的人生，但如果你不馬上採取行動，那什麼事都不會發生，畢竟你的潛意識就跟忍者一樣樣厲害，它能在你還不知道發生什麼事情前，就把你殺個措手不及。\n\
    \n我沒辦法告訴你我白白浪費多少時間（好吧，四十年），假裝自己可以用不同方法做事，甚至於雖然我有一 些點子，但只因它們看似天馬行空或需要花錢，最後只能不了了之。簡單說，這些點子其實都在強迫我長大，其實我曾有無數個如神來之筆的好點子，但我連花一天思考都沒有，只是反射性覺得它們都是不可能的，就這樣隨便把它們丟到一旁去，「好，下一個！」然後繼續過著那些抱怨、忙得團團轉、想著自己為什麼無法脫離這個屎坑的日子。宇宙智慧一定覺得，我不是才送了你需要的東西過去了嗎？你他媽是在開我玩笑吧！談到這種改變人一生的好點子，我們再回看一下之前那部電影中，那個遭遇山難的男主角吧！在遇難過程中，他遺失了大部份的隨身物品，只有少數幾樣倖免於難，他的手錶剛好就是其一。當他躺在一片白茫茫暴雪中，望著遙遙前路，想著自己得拖著斷腿和一個空水瓶走完這段路途；於是他決定，選定一個目光可及，離目前所在位置有些距離的地方，可以是一段上坡、一段下坡，或任何比較醒目、容易辨識的目標，然後不管怎樣都要在二十分鐘內抵達那個目標處。他設定好手錶的計時，接著不管多痛，也不\
    \ 管沿途上遇到哪些困難，他全身上下 的思緒、力氣和決心都聚焦於「一定要在倒數計時的鈴聲響起前到達那個設定好的中途點」。他說如果要橫越眼前這片彷彿沒有終點的冰\n\
    \n原，不要去想這看起來多不可能，這是他唯一可以做得到的事。他非常認真看待這項以 二十分鐘為單位的挑戰，並且視在鈴響前抵達定點為不容妥協且迫切的目標，因為他知\
    \ 道，如果搞砸了這個任務，那麼他就得面對比輸給時間還嚴重的後果。 當我們開始做出重大改變時，常會出現這種把你壓得喘不過氣、如泰山壓頂的狀 況。我們還是得繼續過現有的生活，同時還得在待辦事項中再加上更多東西，只為了完\
    \ 成一個新的目標？你是在說笑嗎？事實上，不只是更多東西，是又大又可怕的事情，我 們一直以來不敢動手去做，不就是因為它們又大又可怕嗎？你會突然覺得，我的媽媽咪\
    \ 呀，我動不了了。然而你已經懂得怎麼掌握自己的心態，這個時候，正好派上場。這 種被如泰山壓頂的感受，和冷靜的感覺一樣，都是心裡狀態，你只需要決定好要參 加哪一場派對。\
    \ 下面這兩個方法，能幫你把驚嚇怪獸打回籠子裡： \n1. 別容易抓狂：如果我們為一點小事就抓狂，或自顧自假設生命中那些無窮盡的不 確定會把自己壓垮，那只是在為自己平添許許多不必要的痛苦。不只這樣，我們常對於自\
    \ 己正 in 陳述的事情一點頭緒都沒。舉例來說：我還得回覆一百萬封電子郵件，還要去 接小孩、煮晚餐，然後還要替我剛開始的生意申請貸款，我永遠都不可 能做完這些！但\n\
    \n是如果仔細考察、思考這個說法，它可以變成：回覆這些電子郵件大概需要四十五分鐘，因為實際上只有十二封信而已，哪來的 一百萬封；然後用二十分鐘把食材拼湊一\
    \ 下，準備好晚餐；我還可以拜託我的鄰居去接小孩，這麼一來，我就有很多時間來填寫 申請貸款需要的表單囉！當然我們確實會遇到力有未逮的時候，但我保證，絕大多時\
    \ 候，你都可以靠著明確區分、辨明事項內容來解決那些壓頂的泰山。 \n2. 把待辦事項化整為零：假設你面對的挑戰是寫完一整本書，那你可能會想躺到路 中間一了百了；但是先寫完一章，卻讓你感到興趣難耐。你因為想讓收\
    \ 入翻倍，而一 路 寒窗苦讀考上醫學院、完成學業、實習， 然後開一間診所，但辛苦的過程卻讓你不禁 羞慕起酒吧的酒保；然而發掘醫學教科書第一章的內容，卻讓你精神為之一振。拖著彷\
    \ 佛教剛被輾過的身體，翻山越嶺穿越一哩又一哩並不友善的冰層，會讓你想立刻下臺一鞠 躬，但是用接到來的二十分鐘從A點走到B點，雖然還是同樣一副被輾過的軀體，而且\
    \ 也是什麽令人興奮的事，但你知道它還是讓你覺得稍微好過一些。 當然把時間零碎化還有一 個很重要的好處：它能讓你更專注。我還是要再一次用 那個被困在山裡的仁兄舉例。在那二十分鐘的奮力前行中，他只專注於眼下這件任務，\
    \ 這樣的專注力帶來兩個結果：第一，這強化了他的信心。專注在什麽事情上，就會創造\n\n出更多的它來，而他只專注於不停挪動自己的屁股動起來，直到抵達他渴望的終點。就這麼簡單，沒有其他諸如停下來、失敗或哭哭啼啼之類的想法。他單單專注在成功的可能上，然後一次又一次，他成功完成設定的目標，每成功一次，他的信心就更為強壯。第二，持續不斷的專注力，讓他能運用所擁有的時間到極致。他老兄可沒打混的特權，也沒時間尿在雪堆上寫下自己的名字，或去弄什麼雪天使，他亟需一杯水，因為對他來說，分秒必爭。對我們來說也一樣，總有一天我們會死掉，所以人生每一秒鐘都很重要，只不過我們常忘記這個急迫性，浪擲在地球上的珍貴光陰在拖延、無病呻吟上，我們滿心相信自己裹足不前的這些想法，更把全副注意力都放在上頭，不去把該完成的事情搞定。我們一天花八小時工作，然而加加減減，可能只有三個小時是有生產力的，剩下的時間呢，都被用來在飲水機旁聊聊天啦，瞎著休息室裡的冰箱發呆啦，或是想到性愛，看臉書上鴨子追著狗跑的短片……。如果有多時間可以完成某件事，最後你就會把這多的時間浪費掉；如果你有二十分鐘，那這件事就只會花你二十分鐘。把你的時間化整為零，規定、逼迫自己只專注在這唯一件事上，這樣就能創造出急迫感，讓你的產能最大化，甚至因此釋放出更多時間，讓你可以去做別的事。\n\
    \n時間是拿來花，不是用来找的。讓我們把至今學到，能幫助你致富的行動準則條列出來：\n○ 搞清楚你打算賺多少錢，你想用這些錢做什麼（要具體），賺到錢時你會有許多爽。\n\
    ○ 做好「不論如何一定要賺到這筆錢」的決定，然後以不可撼動的態度投入。\n○ 擬定賺取這筆夢想中財富的計畫，然後化整為零，一次只投注全副注意力在一個\n目標上。\n\
    ○ 腦中畫出一個你想創造的生活，好像許多錢財朝你興奮滾來的樣子，想像時要\n帶著堅定不移的信心和深重的感謝。\n○ 不管做什麼都全力以赴。假設你一邊動手創辦賀卡事業，同時也還在一家保齡球館工作；你的工作內容是把桌子下的口香糖刮起來，那麽別為了這份你不怎麼喜\n\
    歡的工作憤憤不平（別忘了，你專注在什麼事上，就會創造出更多它來），在苦\n中為自己找些樂子吧！讓自己成為那張桌子遇過最棒的口香糖刮刮人吧，然後別忘了要感恩的態度。\n\
    \n## 讓你的恐懼成為動力\n\n還記得之前提到，我為了要付教練課程而需要生出八萬五千美金來嗎？我現在就要\n\n渴望成長和對自己的處境抱持負面態度，是完全不同的兩件事。\n\
    \n當宇宙智慧把機會帶來你面前，讓你可以繼續朝賺更多錢的目標前進時，絕對別縮手不幹，立刻跳進它美妙的臂彎裡吧！尤其如果它看起來很嚇人，你更是非跳不可。每當害怕的意念冒出來時，你只需要問自己（並且回答）這三個問題：這是我想成為的樣子，是我想做的事情，想擁有的東西嗎？這會讓我更靠近我的目標嗎？這會傷害別人嗎？如果這三個問題都有令你滿意的答案，那就放手去做吧！\n\
    \n告訴你我是怎么辦到的；為了籌到這筆錢，我做了一生中最可怕、最不舒服的一件事。當我鐵了心決定要找一個教練幫我後，我沒有像第一次那样躲躲藏藏、畏畏縮縮，而是將當下冒進腦子裡的想法立刻付諸實行。這個點子可不好玩也不令人舒服，我也絕對不願意為它放棄全身除毛療程，但因為我想致富的渴望已經遠遠強過繼續浪費更多時間過著因循苟且的日子，所以我立馬著手進行。那時候我想到的計畫是，或許我可以跟別人借這筆錢，我可以去找對人生教練所知甚少的人，他們對這個概念的認識，大概就是諸如「賣假貨的」、「操控人心混蛋」、「一群奇奇怪怪傢伙」等；去找認識的人中最像小氣財神的人，他們雖然有錢，但除了會趁特價時囤積大量衛生紙之外，其時侯可說一毛不拔；或者是相信我的人。當這個點子闖進我腦海的那一刻，我立即買了一張機票飛到她家（機票比平常貴了一千多美金，沒辦法，起飛前才買票就會這樣），到她家門口按門鈴，真的是個快把她嚇個半死\
    \ 的驚喜。這是個很需要冒險的決定，包括在她面前手足無措、或讓她覺得我瘋了、不負責任、加入了邪教等。我怎樣也忘不了，當我告訴她我需要的金額時，那張面露痛苦的臉龐。但在經過一連串令人不舒服的討論後，她還是把這筆錢借給我。我不但在一年內就把這筆錢還清，也幸好我有直視內心的恐懼，真的開口去問，讓我在那一年\n\
    \n中獲得了最好的教練課程，因為得到幫助，我才能到達珍。幸賽羅未曾涉足之地。我一直持續去冒那 些又大又嚇人的險，而且不再像以往事必躬親，我找了一組人替我製作影片，持續改善線上課程的架構，研發新產品和新服務，提高收費，並且試著去接觸那些我以前認為「高攀不起」的客戶，好像坐下來寫一本後來進入《紐約時報》暢銷書排行榜的書，基本上，我完成\
    \ 的這一切，都曾被我認為太可怕／低俗／懶得去做，但恰恰因為這些事，才讓我獲得這個如今為我賺進七位數字的事業和品牌。如果我從沒透露著自己去做那些正常來說我一點點點點都不想做的事，這一切根本就\
    \ 不可能發生。價值八萬五美金的重要須知：如果你讀到這， 還繼續想著，喔，最 好是啦！最好我可以就這 樣出門 ，去找我身邊那些有八萬五美金閒錢的人借錢給我\
    \ ，那我要把話再說得更清楚些。這 個數字多寡根本不是重點 ，如果你想轉化人生 ，真正重要的是你的渴望和決定；現有的解決辦法到底是不是對的 ，也不是重點。如果\
    \ 你下定決心 ，不論如何一定要籌到某筆金額 ，可能是八十美金或八萬美金 ，好讓自己獲得致富所需的資源 ，那你就要知道這筆錢一定存在 ，問題是你到底有多少想得到它\
    \ ？如果你想說服自己放棄去採取成功所必須的行動 ，最快的方式就是讓自己陷入被傷害情結—其他人擁有的資源和機會都比我多 ，何必嘗試呢 ？或許你的處境真的更為艱\n\
    \n困，但還是會有人比你更艱苦，但他們最後仍舊完成了奇蹟般的事。成功和你現在的位置沒關係，而是和你決定要往哪去，成為什麼樣的人有關。當你決定踏上致富之路時，各種選項就在那裡，或許你還需要一點時間才能看見它們，但當你終於看見時，問題就只剩下你改變的決心到底多強了。\n\
