  - '[PAGE 5]


    # 前言

    唯有改變跟錢的關係，它才會流向你


    只要你準備好多賺點錢，你就辦得到！我不管在這之前你嘗試或失敗過多少次，或你早已窮到脫褲得靠賣體液才行，還是常在結帳櫃臺前演出伴裝震驚和憤怒的遊戲碼：

    「你確定嗎？刷不過？怎麼做能！你可以再試一次嗎？」不論對於現在的你來說，這看起來有許多不可能，你真的可以賺大錢！就是「我要買給每個親朋友一棟房子和一顆金牙」的那種大錢，這樣有勾起你的興趣了嗎？

    錢，是時下最氾濫的一個話題、我們愛錢、恨錢，對錢執迷，或者假裝它不存在，憎恨它、積存它，求之若渴，批評它……，金錢包藏了眾多欲望、羞愧以及荒誕，能夠用比氣音更大聲的聲音說出「錢」這個字就已經夠不可思議了，更甭論還要堂而皇之、

    快快樂樂地賺進大桶金。

    這讓我想到，這和我們從小被教育面對性的方式非常相似，性可以說是「完全會令人驚慌失措的話題」這種競賽中的另一名金牌選手。當我們談論到做愛和賺錢時，人們'
  - '[PAGE 6]


    總覺得你應該知道怎麼做，但從來都沒有人教你該怎麼辦，更不用說，你也不應該去談論它，因為這會讓你顯得很不體面、下流又沒品。錢和性都能為人們帶來難以想像的快感，沒錢沒性，讓我們覺得羞愧，但承認自己想要錢、想要性愛，就更丟臉了。好消息是，如果你和大部分的人一樣，和錢一直有著糾結、衝突的關係，你仍舊有辦法可以恢復、轉變這段關係，成為錢的超級好夥伴，甚至某一天睡醒後，你會發現自己正過著夢寐以求的生活。你現在就可以開始改變！你只需要發現是什麼讓你一直躊躇不前，並且做出強而有力的新選擇，重新決定你要聚焦在什麼事情上，並且為自己裝備關於金錢的新知識，然後用前所未有的態度放手一搏。而本書恰好可以幫你達成目的。


    我自己就是這樣改善了財務狀況，轉變的速度和幅度之大，讓每個熟識我的人到現在都還搞不清發生了什麼事。不論你現在的財務狀況多麼搖搖欲墜，或多讓你絕望，請相信我，既然破產到脫褲者如我都做得到，你一定也可以。當我的年紀都要跨入四字頭以前，我對如何賺錢實在一無所知。四字頭！大部分的人在這個年紀時手頭上都已經擁有這些什麼，房子或已經為孩子存好了大學基金，至少也會對道瓊指數有些概念。反觀我呢，四十歲時擁有的，是一個貧乏的戶頭，和眉間一道道因壓力產生的皺紋，還有一段'
  - '[PAGE 7]


    和討債公司的席拉互以名字相稱，有點熟又不是太熟的關係。我成年後的大半生涯都是在當一名自由作家，永遠為各種工作勞心勞力，而以所付出的時間和工作的挑戰性來說，我的薪資近乎是侮辱我的人格。竟然要有我有好好看按計算，機構，就會知道這份工作真是讓我「自由」到脫褲了，但我選擇忽視這些事實，只是更加努力埋頭於工作，但同時，我卻抱怨得更多，而且一心期待哪天我會突然飛黃騰達，或是被哪個有錢人撞到，就此不愁後半輩子没人照顧。這個想要讓自己從揮扎的財務狀況中脫身，自認為天衣無縫的計畫，有很大一部分其實是建立在對金錢的眾多錯誤認識上（比如說錢很邪惡，有錢人很噁心，我完全不知道怎麼賺錢，或就算知道怎麼賺錢，也不知道賺了錢以後要拿來幹麼等），以及我那相當折磨人、老是舉棋不定的個性。我知道我是作家，我也知道我不想一輩子都穿著睡衣在房間裡打上一整天的字，但我也不知道我想做什麼。我並沒有選擇從現成的事物上著手，看看事情會怎麼發展，反而繼續困在這個「我不知道我到底想要幹麼」的泥沼中；就這樣好多年，至少十來年一晃而過，這真是大痛苦、太悲慘了，最後甚至已經到了讓我毫無行動能力的地步。於是乎，我發現自己已過四十而不惑的年齡，住在巷子裡一間由車庫改建的房間裡，害怕自己付不起牙醫費，但我還是繼續透過以下各種方式，持續「精進」於讓自己維持在破產'
  - '[PAGE 8]


    的財務狀態：

    ○ 不斷吃／喝／囤積各種免錢的東西，壓根不管我到底是否喜歡或需要它們。

    ○ 寧可穿著夾腳拖走上好幾個街區，只為了省下五塊美金的停車費。

    ○ 上至漏水的水管、斷掉的鞋帶，下至骨折，我都絕對不會花錢請專業的人來處理，

    反正大力膠帶能搞定一切！

    ○ 與朋友約在餐廳一起吃晚餐，我會點一杯水！接著，我會開始跟侍者解釋說自己並不餓，肚子滿飽的，當免錢的麵包端上桌時，它們卻不知怎地一下就進了我

    的肚子。

    ○ 不知道該把錢拿來付電話費還是保險費。

    ○ 總是需要花大量時間比價。不論是買電視、床單，甚至湯匙，都很耗時，以求找到最便宜的價錢，甚至有時候我還會忐忑著：「有沒有可能自己動手做這個呢？」

    假如此我能把這些用在恐慌自己沒錢、不斷想辦法省錢、找尋折價機會、殺價、比價、退貨、退費、兌換、繞路、搜索促銷回饋金的時間和注意力，轉而投注在賺錢上，'
  - '[PAGE 9]


    我搞不好能更早就開著一輛雨刷能用的車。 但我從未想過的是賺錢意味著獲取財富， 因為財富能過想過的生活， 是不用因為預算限制而委曲求全。 賺錢這檔事並不意味著從此以後你再也不需要聰明、謹慎地消費，或再也不會因為買到品質好的打折品歡喜，或因為塞了一嘴麵包而開心。
    有錢，代表了你有機會和可能去做和去成就是些事，同時也有能力負擔讓自己開心的物品，而不需要再扮演一個受制於環境的受害者角色的同時，也代表著你不再需要粉飾太平。就像是我喜歡我的室友們，但是他們都不知道該好好使用菜瓜布和掃把，可是我竟然沒有想說去賺錢，然後搬出去自己住，反而是害怕如果搬出去了他們會不會說我的是不是，或是擔心根本賺不到錢，覺得太難了，這樣就不如玩了，我根本不可能辦到。人類具有非
    常瘋狂的能力，總是可以合理化、辯護和欣然接受自己導演的遊戲碼，因'
  - '[PAGE 10]


    為每個人 的內心都被賦予了能力，能選擇並且創造出自己想要的現實。這種例子屢見不鮮，比如此說，我們會看到有人明明處在一段悲慘、被虐待的關係中，卻能說出：「他是背著我偷吃，但他很後悔又很難過啊！我是心碎了沒錯，但大吵後的愛愛真是太爽了！」又或者是我我們也會看到有人執意繼續做他痛恨的工作：「我整個午餐時間都在擦地板，我真悲慘。但這份工作的健康保險實在是太棒了。」在他們抱怨和找理由的同時，這些人一生精力時間就像潰竭般啪地流進下水道了。

    現在你有一個光榮且短暫的機會，在這輩子活出最極致的自我，而且還可以擁有能創造出你渴望的現實；既然這樣，為什麼不成為這樣一個最棒、最快樂、最樂善好施又能完全實現自我的你呢？

    過了四十多年捉襟見肘的日子後，我終於再也受不了聽到這些自我催眠：「我付不起一、我不知道我想做什麼」，也不想再繼續住在那些又小又爛的地方，小到我能一邊坐在馬桶上，一邊應門，順便還能同時再煎個蛋（大概跟住在船上或是一朵大蘑菇裡沒啥兩樣）。我再也無法眼睜睜看著別人從外面生活龍虎，靠做自己喜歡做的事賺大錢、帶自己的朋友享用豪華大餐、捐超過五塊美金給他們喜愛的慈善機構、衣著光鮮四處旅遊、穿著新鞋等，基本上就是過著我所想要的那種生活。我跟他們一樣聰明、一樣有才'
  - '[PAGE 11]


    華、充滿魅力、衣著端正，天殺的究竟我是出了什麼問題？我到底還在等什麼？不論我如何抱怨或抓狂或試著說服自己，心底深處，我知道我值得、也想要更多。當我聽說別人的人的工作內容是很酷的旅遊作家，或當我有幸去別人的海景小屋作客時，我總是非常興奮，舊，心想著：「就是這個！這樣的生活我可以！」然而我並沒有好好利用這股興趣舊感起而行，而是馬上找藉口勸自己打退堂鼓：「呃，我的作品沒有好到可以成為旅遊作家啦，而且我也不敢完全確定我想做這個啊！還我養了一隻貓，怎麼可以四處旅行，把畢金斯先生留在家啊？」比起試著到外頭鬧蕩，待在原地不動看起來好像容易多了，風險也比較少，但感覺卻糟透了。我覺得我讓自己失望了，我太懦弱無能、躊躇不前，將自己拒於許多美好事物之外，用嗅之以鼻的態度過日子。唉！我的確就是這樣。「我可以做得更好，但卻沒有。」這個認知最後終於強大到我再也難以忍受，大到讓我的屁股終於動了起來，
    doing了 一個士可殺不可辱的決定：我決定要打倒內心的恐懼和對金錢的厭惡，開始搞清楚該怎麼賺錢。雖然我可能還沒辦法做到十全十美，但至少開始逐步上正軌，而不是一直因為不確定而舉步維艱。於是沒有什麼驚天動地的頓悟時刻，我也不是從油鍋裡劫後餘生，或因為太過魯蛇而被一生摯愛拋棄，也沒有一秒鐘就頓悟這類的戲劇性轉折。我只是終於清醒了，大多數決定想劇烈改變自己人生的人，也是都'
  - '[PAGE 12]


    同樣的情形。要跨出安全的人生角落，通常相當嚇人而且一定會遭遇阻力。舉例來說，我投下驚人的資金創辦了一個線上事業，我需要去選修一些課程、聘請人生導師、架設網站、找別人，而不是自己隨便拍拍大頭照了事等。我冒了讓自己看起來像傻瓜和騙子的風險，因為這項線上事業賣的商品，正是我給其他作家專業指導，但在這之前，我根本就沒有相關經驗。我也冒著損失所有這一大筆錢的風險，應該說我是賭上全部的家當了。就連告訴別人說我創業了，聽起來也很蠢，感覺超做作，彷彿我只是在辦家家酒，而且要不知道多久，就會有人戳破這個粉紅泡泡：只是開個玩笑而已！真是抱歉，其實我也不知道自己在幹什麼呢！但不論跨出的每一步感覺起來多可怕，都比不上重複出現的挫敗感、想著究竟什麼時候才能還清學貸，或覺得虛度了自己渺小的人生，同時心裡卻相信自己能做得遠遠比現在更好，來得更令人洩氣。我現在不僅是個年收七位數的成功指導者和作家，還寫了一本教人怎麼賺錢的書。我耶！珍·辛賽羅（Jen
    Sincero），這個以前會在店裡偷東西，在沙發墊裡翻找零錢（還是別人家的沙發）的我！這就跟我九十四歲的父親一夕之間成為〈與星共舞〉實境秀的當紅炸子雞一樣難以想像！然後我還寫了關於這些經歷的一'
  - '[PAGE 13]


    本書。這簡直是奇蹟，但我相信奇蹟。最酷的是我還記得當我認真下定決心要脫離財務困境後，新的機會、想法和收入是多麼快就開始湧進我的人生。其實這些事一直都在那，只是我一直忙著蒐集折價券和專注在自己的慾望上，因此無暇注意。但我是希望你知道，你現在就擁有所需的一切，你可以開始扭轉財務狀況，讓你不再半夜時尖叫著驚醒。但前提是你得願意不惜一切去改變。簡單地說，你得願意接受，一次又一次，讓自己非常非常不舒服。從小到大，我們都被教導要努力工作才能賺到錢，這話有時侯是對的，然而真正的祕密是你願意冒大險並接受不舒服的感覺，你得做些之前沒做過的事，讓自己被看見，明白自己真的很棒，但有時侯你得願意讓自己看起來很優。你不只要承認你渴望而
    且致力於創造財富，最重要的是你必須允許自己動手去做。冒險很不舒服，但這個不舒服感，其實也是「呻耶」、「喔耶」這些很爽的感覺的一部分。恐懼和興奮其實是一體兩面，我說的不舒服感就是這樣，你也可以稱它為「振奮感」，你想過好生活，當說了就算的老大概？這種充滿刺激的不舒服感可是要了，你需要它！我希望你把本書來回看個幾遍，然後照著去做，留心聽聽心裡的呼聲，別專注在那些懷疑和恐懼上，同時不斷勇敢地跨出腳步，進入未知。我的許多客戶和朋友以及在派'
  - '[PAGE 14]


    # 99


    用來合理化你這個平庸人生的時間，也可以用来創造不凡！


    對上遇見的人，他們是如此為錢所苦，這就像眼睜睜看人活活餓死，然而轉角處明明就有吃到飽的自助餐一樣。你所渴望的金錢，就在這裡，等你來拿。機會、客戶、老師、絕妙的賺錢點子，現在就在這裡等著你醒過來，接受它們，讓派對開始！'
  - '[PAGE 15]


    # 第1章／

    不是追求有錢，而

