    # 永遠先掌握心態


    當然致富路上總是需要你纏鬥不休，也總是會有需要跳進令人膽戰、激進的未知的時候，但你的腦袋絕對會經歷最大的轉變。我要再次強調，這並不困難！你人生中一定曾為了某些事勞心勞力，但我可以跟你保證，為了獲得財務成功而下的功夫，絕對只會更少。我不是說你完全不需要動一根手指頭，但我想讓你知道，當手上有錢的時候，我過的日子真的比以前窮到脫褲時好得太多太多了。


    不只這樣，光是變有錢還不夠，掌握自己的心態還有另一個更棒的加分之處：當你開始改變心態，跟上金錢的頻率時，你的能力、你生活中的其他各部分也會開始提升。


    當你改變了財務現實，重要的是不只是開啟心心地看著銀行戶頭的數字節節上升，而是你為了成長而讓自己提升了多少。你必須脫去舊的自己，成為一個思想更遠大的人，你會


