    # 勇於面對財務狀況


    這和許多有財務困難的人對待金錢的態度一樣。我們寧可跋腳，裹住和金錢這段破爛不堪又不健康的關係，只因為我們害怕這一層層綑帶下的東西。但是如果我們勇於面對紗布下的東西，不管它是因為想要致富而出現的罪疚感，或是錯誤的投資、無效的致富計畫等，只要我們開始留意、釐清，就能獲得結束這些殘難的力量。我們總想要避免疼痛，但卻事與願違。我們不想面對追求財富過程中可能感受到的羞愧、倔促不安。感，寧可繼續維持破產狀態，然而兩袖清風也是讓我們覺得丟臉、不安。我們不喜歡管理大筆金錢帶來的壓力，所以寧可維持窮困，繼續因為錢而壓力山大；我們不希望錢成為人生焦點，因為其他事情更重要，所以我們仍舊和自己的財務狀況脫節，最後我們還是為錢傷心傷神，不知不覺中，錢幾乎變得比其他事更重要了。


    妥善包紮好便是；但我不是，而是繼續一跛一跛地走路，洗澡時繼續在腳外麵套上塑膠袋，而且能夠穿著開口笑的鞋子有多久就多久，只為了避免拆開那團已經髒到不行的綑帶，和綑帶下的傷口面對面。'
  - '[PAGE 236]


    我自己就花了十多年的时间碎念、抱怨自己很穷、很挫折、无计可施。但如果你要我计算出确切的数字、认真工作和学习新技能或冒点险时，我根本只会放空，好个粉饰太平的女王！我根本不知道自己每个月的支出和收入是多少，反正我就是眼一闭，手一抓，祈祷月底早上醒来时，电话还没被断线。跟很多人一样，身为自由作家我劳心努力工作，因为「这是我的工作」、「我只会靠这赚钱」。我没有风风火火去多找些写作案子，反而把时间都花在退缩、拖延计算，然后得出一个完全让自己陷入死胡同的结论：一天二十四个小时＋只有我一个人写文章＋一小时工资四十美金∥我又累、又暴躁，同时小费也给得很小气。

    我们都被教导，只要认真实工作就赚得到钱。但如果这是事实，那些有钱人应该要累到两眼充满血丝，大口喘气，一副快死的样子，而不是一天到晚都可以开著游艇出游吧？把焦点摆在钱而不是把自己累个半死，并且要非常清楚自己到底需要赚多少钱，

    为了避免承受疼痛而去做某些事，反而因此创造出我们竭力想避免的疼痛。'
