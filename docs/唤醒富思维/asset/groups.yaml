    我的家人現在住的地方，離我們小時候的房子並不遠，是開一小段車就得到了的距離。我上一次去看他們時，我和我弟決定來散步懷舊之旅。我們沿著舊家附近樹林裡的那條泥土路走，接著再轉進以前舊家那條路，我們大半童年時光都耗在這了。我們試著去找寵物的埋葬地點，但怎麼找都找不到，估計已經深埋在路旁的富貴草下面了！我們走過鄰居羅伊先生家。他家裡有游泳池，但是一直築到從來都看不懂我們的暗示，就算我們穿著泳衣，拿著毛巾，在兩家之間的圍籬旁站這麼久，眼巴巴看著他們游泳，他們竟然從沒有想過邀我們加入，真不可思議！接著我們往城裡走去，穿過我就讀的國中，我就是在那被伊凡．史考特打了一拳，還被他笑說是「醜肥女」，只因為我玩箱球（Boxball）①贏了他。然後我們一踏走回樹林裡往隔壁鎮走去，沒入城堡廣袤的腹地裡。所謂的城堡，據說以前曾是有錢的政治人物之類的居所，現在已經變成了某種博物館。小時候，這間城堡感覺好大、好雄偉，我覺得是世界上最巨大的建築物了；但長大後的我和弟弟現在站在這兒，覺得它看起來好…遜。
