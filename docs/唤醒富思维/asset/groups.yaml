    ## 心態成長，恐懼縮小


    沒有？總之，我們繞了又繞，四處檢查，非常確信我們所在之處應該是城堡的警衛室，或是紀念品店？啊！一定是紀念品店啦！但過了一會兒，我們才終於意識會過來，就是這樣了，我們小時候認為輝煌碩大的城堡，根本是用小人國的標準來看。


    當你的心態成長後，你會面臨的情況就和這一模一樣，很多你以前覺得龐大的東西，現在看起來卻再也不巨大了。舉例來說，想想看，有沒有什麼事以前曾讓你嚇得半死，面對它的恐懼如山大，但後來你成功克服了它，現在想起來，不過是不足以掛齒，甚至你根本已經不太記得的一段回憶：你上班的第一天、生了第一個小孩、開口要求離婚、要老闆加薪，那時那些緊張、不舒服的感受是如此強烈，你覺得你好像快爆炸了，但現在當你回想那些恐懼，你只覺得，蛤？


    ① 箱球，或也稱 Four Square，場地為四個方格，每個方格站一人，將球發進別的方格，站在該方格中的人需要接球。彈跳第二下之前，在不把球接住的狀況下立刻回擊到別的方格中，如果揮空，或出界，壓到方格中的線，就算輸。


    當你在進化過程中，要記得那些現在致富路上看起來似乎難以穿越的路障和恐懼，以後都會成為無足輕重的碎屑，隨著你斑駁的記憶慢慢褪去：總有一天，它們都會成為 過去雲煙。別被這些戲劇化的情緒影響，當你正經歷這些想法限制時，你得看穿它們的本質，它們都是假的。想像一下未來那個日進斗金的你，再回頭看看它們，你又會有什麽感覺受？未來的你會很清楚一件事情：這些對你沒有幫助的念頭和信念並非事實，因為未來
    的你擁有「萬事皆可能」的 心態，能擊潰這些負面思想，它們不再對你有影響，而且縮 小燈正等著它們。 還記得以前和金錢維持有 一段搖搖欲墜關係的我，一直很難相信那些關於心態有多久
    要的話術，那些呃啊、叫啊、喊啊的，什麽正向思考和信心、感謝、覺察多厲害又多厲 害，拜託，致富應該要用更嚴肅的步驟才能達成吧？在我 的想像裡，要翻轉財務狀況
    應該是像解開魔術方塊之類的挑戰一樣難、和上研究所一樣暗無天日，或像背著一個巴 住你不放的巨嬰爬山一樣辛苦；然而一旦我知道，我這個窮屁股和那些活得自由、富裕
    又有掌控權的人之間，只差這麽一個無可動搖的決定，其他啥都不用，那我的態度就可 以變成「你以為我是什麽遜咖嗎？我當然做得到！」


    ## 永遠先掌握心態


    當然致富路上總是需要你纏鬥不休，也總是會有需要跳進令人膽戰、激進的未知的時候，但你的腦袋絕對會經歷最大的轉變。我要再次強調，這並不困難！你人生中一定曾為了某些事勞心勞力，但我可以跟你保證，為了獲得財務成功而下的功夫，絕對只會更少。我不是說你完全不需要動一根手指頭，但我想讓你知道，當手上有錢的時候，我過的日子真的比以前窮到脫褲時好得太多太多了。


    不只這樣，光是變有錢還不夠，掌握自己的心態還有另一個更棒的加分之處：當你開始改變心態，跟上金錢的頻率時，你的能力、你生活中的其他各部分也會開始提升。


    當你改變了財務現實，重要的是不只是開啟心心地看著銀行戶頭的數字節節上升，而是你為了成長而讓自己提升了多少。你必須脫去舊的自己，成為一個思想更遠大的人，你會


    跟著自然本性，事情就會很簡單，我們偏偏老是喜歡搞得很難！


    成為一個去尋找可能性而不是藉口的人，而即使口袋空空、履歷薄薄，對這一切毫無頭緒，你還是能把這些挫折視為邁向偉大途中的小插曲。如果你真的致富，那其他事你一定也做得到，因為你不僅已經成為一個厭害角色，更重要的是
    一切都會水到渠成。那些讓你難以向前、致富的限制性信念，跟那些害你減不了一十磅、讓你一直和根本不喜歡你的人約會、以懷疑和猶豫籠罩你的爛藉口都不能再限制你，這和要廢攤軟好一陣子後要再重回曼妙身材一樣，你得開始好好吃東西，走路的姿勢也要抬頭挺胸；你的注意力會更集中，你也會更快樂、更有自信、精神，更敢和人調情，也會把
    Stadt 子刮乾淨。如果你想要改變人生，現在就動手開始！


    狼角色精神正在尋找和它旗鼓相當的人。


    最後我想再次提醒你，現在的你裡面已經擁有致富所需的一切，不僅如此，和自然界的每個生命體一樣，整個宇宙智慧當你靠山，為你加油。這就很像看著一個你的朋友，


    整天坐在那擔心東擔心西、無所適從、懷疑自己不夠好、抱怨自己下巴太尖，而她明顯就很棒，又漂亮又很有天分，你會想瘋狂搖醒她，要她清醒一點，或是做一份簡報，用大字標出她所有的優點。你希望她可以看到你眼中的她。宇宙也是這麼看待你，那個正在財務困境中掙扎的你。宇宙光想到你有多少棒就要心臟病發了，他已經為你預備好你所需的一切，好助你一臂之力，他就在那等你停止一意孤行，不再只注意自己那些限制性的信念，快快跳上金錢列車。只要你下了決定，認真的、毫不符合糊的，決定要致富的決定，那麼你就已經準備好迎接各種實現這個目標的方法。想像一下，當你把財務困境打倒在地時，感覺會有blur。

    當你破除相信了 一 輩子 的「事實」：你沒有能力成功、你沒有價值、金錢很邪惡時，想那如何釋重負的感覺；當你和錢終於成了一 輩子 的好朋友，一起分享生活、彼此扶持，幫對方綁頭髮，那又會帶來多大的成就感？想想看你曾經成了哪些不可能的事：得到那份「資格不符」的工作、追到你的女朋友或男朋友、從東岸搬到西岸、買了
    一 間房、在不打破車窗的情況下弄出被忘在車子裡的鑰匙……。你一定也能變有錢。你無所不能、氣勢非凡、無可限量。你生來就該遵循自己的渴望，你註定要活出最極致的自我，綻放出你那獨特又妙不可言的自我風采。你命中註定要有很多錢。


