    # 孤注一擲的前提是擁有正確的心態


    為了進到下一個階段，有時候我們得冒一些可怕的險｜花那些還沒賺到的錢。意思就是說，你會因此負債，而在我們的社會中，債務就是那隻很壞的大野狼。事實上，債務就和其事一樣，取決於你的心態如何。如果是帶著恐懼、懷疑的心態，並且毫無清償債務的動力或計畫，就魯莽擲你沒有的錢，過著打腫臉充胖子的生活，為自己挖一個大坑，是完全另一回事。我並沒有建議你要怎麼做。然而如果還有別的選擇，我不鼓勵你負債｜這是萬不得已的孤注一擲，前提是你需要擁有正確的心態，它才能是讓你起死回生的方法。冒險，然後遍自己一定要解決問題，不把錢賺回來誓不停止，這才是我所謂正確的心態。這就好比你想去旅行，卻一直找不到對的時間；快他媽的把票買一買，旅館訂一訂，該搞定的事搞定，然後喬好你的行程去配合。如果цик你總是想等到有時間才出發，那你永遠都無法GRESS成行。


    這些事的道理都一樣｜如果你想等有錢再行動，那你就永遠不會行動。在這段突破自我，脫離貧窮生活方式並且致富的過程中，我一直都努力這麼做。我新辦了一張信用卡以支付教練課程，不管教練說什麼，不管聽起來多駭人，我都照著去做，非把錢賺'
  md: "\n## 就是要有錢三步驟\n\n### 一、念出來就是你的：\n我愛錢，它用閃閃發亮的各種美好包圍著我，為此我每天都非常感恩。\n\n## 二、思想大改造\n\
    \n- 1. 找到人生中讓你感到恐懼、挫折、困擾的五件事情，找出可以為它們感謝的理由，然後寫下來（真實去感受這份感謝，別只是打打嘴砲而已）。\n- 2. 每天晚上睡覺前，找出十件值得感謝的事。\n\
    - 3. 寫出五個對自己有信心的理由。\n- 4. 寫出五個對宇宙有信心的理由。\n- 5. 給予是因為你有餘，索求是因為你自覺缺乏。把焦點擺在豐富上，連續二十九天給別人金錢，以此練習強化信心。金額不限，小至銅板，大到任何你願意給出的數字，用任何方式都可以。如果可能，盡量為善不為人知。\n\
    - 6. 信心需要耐心來磨。撒下的種子也需要一段時間消化，要等多久？最終決定權在宇宙智慧，而不是我們手上；緊張兮兮、焦躁不安都不會讓速度加快。有幾件事可以幫助你在保持耐心同時，繼續維持強壯的信心：每次當你覺得自己快要崩潰抓狂時，練習深呼吸，重複確認，例如：「錢就快到了」、「我可以感受到它」這類的口訣，並且讓自己沉浸在金錢很快就會來的感覺中。你要非常明確，並且能夠隨時運用以下工具：你專注在什麼事情上，就會創造出更多它來，專注在不耐上，就等於缺乏，就等於把錢往外推。選擇你要專注於什麼事情，並且強化你的信心和耐心，你會成功的。\n\
    \n三、請填空以下句子：\n我很感恩我有錢，因為\n\n## 第8章\n果断的行动。\n赢家的选择\n\n我非常著迷於一部叫《攀越冰峰》(Touching\
    \ the Void)的電影，是兩個人去攀登一座高峰的故事。這座山以前從來沒人成功登頂過，它彷彿是冰風雪黑煞星，終年凍結，絕世孤立。但這兩人不為所「凍」，最後成功攻頂，接著當然就是一連串擊掌和歡呼：「我們成功了、我可以從這裡看到我家耶！」這類的興奮慶祝場景。然後他們開始下山，當然就碰到了大。風。雪。在極限環境下求生存的電影我看多了，什麼墜機後靠著吃掉其他凍成冰棒的人的遺體活下來，或是在峽谷中被落下的大石頭壓住手臂，最後只好斷臂求生這類的；但這部電影在我觀影清單中絕對高居榜首，因為發生在其中一個人身上的事實在：：我的媽媽咪啊，我是說，就在你覺得事情不能更糟時，它真的就更糟了，而就算你是自己一個人在看這部電影，你還是會忍不住一直尖叫，「我的天啊！我的天啊！」我不會劇透太多，但是我很希望你也去找這部片來看，但我想聊一下結尾的地方；這傢伙一而再、再而三地經歷這些接踵而來的衰事，而他之所以能夠從這麼惡劣的環境中活下來，唯一的原因就是因為他有一個不一樣的心態（影片一開始你就會知道他沒有死，所以不用謝我～）。首先，他得穿越一望無際的冰原，腳下冰層隨時可能破裂，讓他跌落深不見底的冰河縫隙中。不只這樣，穿越冰層後，他還得跌跌撞撞穿越難以行走，\n\
