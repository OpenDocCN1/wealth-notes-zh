    ## 與過去的自己決斷


    和這個教練合作了兩個月後，我終於成立了 writeyourdamnbook.com 網站，開始順利運作；更令我開心的是成立沒多久後就開始獲利。從商業角度來說，我覺得自己的定位挺合理：我雖然財務狀況頗慘淡，但至少還算是個混得不錯的作家，因為幫助了一些女性創業家，讓我有幸進入全國性的女性創業家網絡，而我的電腦知識也還足以讓我處理上網、電腦這類的事，看來我是漸入佳境呢！


    然而某天我突然驚恐地發現，自己竟然成了那種恬不知恥，把個人資訊放上網的庸俗業務員。經過很多有腦袋的線上行銷高手們實驗證明，我使用的行銷手法非常有效，我也確實從中得利，但是……這些可怕的行銷方式中，竟然還有一招是把用我穿著商業界便裝，一副很專業樣子的個人照做成橫幅廣告，然後大張旗鼓地放上網路，讓全世界每個人都可對我品頭論足。我不死心地問教練有沒有其他方法，但她只是耍著我，問道：「那妳想當一個很酷的窮光蛋還是俗氣的有錢人？」宇宙智慧總是會為你送上你需要的事物，它希望你成功、成長、茁壯、散發光芒，這就是他媽的「自然法則」。公帝王企鵝需要帶著一顆蛋，在充滿危機的冰層上走八百萬公里前往繁殖地；高大的紅杉需要一場猛烈的森林大火，或讓某隻可怕的蟲子為包裹著種子的ige開個縫隙。當你想孕育一個新生命時，宇宙智慧得知道你到底多認識真。在線上事業開始的頭幾年，我過著雙重生活。一方面我很怕朋友和樂手圈（我以前玩過幾年的搖滾樂團）的舊識們會在無意中發現這個廣告；另一方面，我也很擔心以前身為「褲襠」龐克樂團成員時，那些看起來醉茫，穿著比基尼自陶醉的舊照片被新客戶看到，他們就會禮貌地要我退費。多年來，我在認同危機中輾轉反側，但想賺錢的決心最後還是勝過了採取必要手段帶來的不適感。如果我得看起來庸俗才賺得到錢，那我就這樣辦吧！如果我得花錢聘請技巧術人員，那就這樣辦吧！如果我得出席無止無盡的網絡集會，不停和人交換名片，那就這樣辦吧！當你決定要致富時，就代表了這件事的重要性在其他任何事之上（當然不包括去做違法、不道德、令人反感的事）。你不能再為自己留餘地，因為你不只是在培養新的心態，同時也是在和許多少以此前未曾面對過，關於錢的潛意識信念戰鬥。就算盎甲上只破了一個小小的裂縫，都會讓過往舊習慣有機會趁、重掌大權，甚至在你意會過來以前，就把你撞出了軌道。你不該做的
    Barb

