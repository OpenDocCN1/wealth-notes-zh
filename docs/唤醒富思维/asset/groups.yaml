    問題：我會用這筆錢做什麼？

    回答：付清我那筆一萬美金的卡債。我痛恨欠卡債，卡債就是一個大王八蛋。

    問題：為了賺到這筆錢，我需要做什麼？

    回答：賣出三份私人書籍提案畫課程，再加上一個團體教練課程。同時在這個過程中，對萬能宇宙時不時丟出來給我的機會保持開放態度。

