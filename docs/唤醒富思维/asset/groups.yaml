    某一個早晨，當我下樓找媽媽時，只見她穿著睡衣站在廚房裡，沉著臉把杯子裡的咖啡倒進水槽，「我們沒有牛奶可以泡咖啡了！」她不帶感情地宣布著。但是她並沒有打算梳洗一番，換件衣服，走上個這麼一小段路進城去買牛奶。她對我說，她要穿著身上的睡衣、球鞋、隨便戴個棒球帽和擦上厚厚一層橘子口味的唇膏去買牛奶，看來，她終於認識真慮成為鎮上那個名副其實的「有趣傢伙」了，「我都已經七十歲了，也是時候了吧！」


    我媽的幽默感令人發噱，大部分時候也的確很好笑，我想我認識的人中沒有更勝她的人了。這也是為什麼當我某天接到她打來的電話，在電話中以震驚的情緒說，她直到剛剛才知道「智障」（twat）這個字的意思時，會令我這麼驚訝。「你是認真的嗎？」我心想妳不是明白一天到晚都用這個字眼罵妳兒子嗎？但她聽起來真的很沮喪，似乎完全挫敗，甚至於完全失去能力為這個真的很有趣的字找到至少一個有趣的點。


    我媽打這通電話來的那年，她正為深具歷史魅力的郊區市鎮擔任董事會成員，在任'
  - '[PAGE 77]


    期中，她為許多她認為至關重要且至為關心的一 些議題請命，包括曾保護了她最愛的那座公園不落入開發商手中、在主街分隔島上種植蒲公英、確保這個水庫旁的觀光小鎮沿途的路標維持在最低限度的數量等。顯然地，應該是為了要全力保持景觀完美在董事會上你來我往的討論，最後才會有這段沮喪的對話。隔著話筒，我都可以聽到她躺在床上，嘴裡不斷喃喃自語著：「天啊，天啊！」根據我所能拼湊出來的事發經過：當天稍早，她當著一整屋受人尊敬、為人正直的董事會會成員提出異議，而異議內容大致上是這樣的：「那只是一個小彎道，我們到底什麼需要在那個彎道前、中、後弄了五個，五個，畫著箭頭的路標，警告人們需要稍微往左轉一些？這些路標真的很刺眼，完全是浪費納稅人的錢，如果你真的『智障』（twat）到需要每隔兩步就看個路標才會開車，那你根本不應該開車吧！」直到這時我才知道，這已經不是她第一次口無遮攔地在整個董事會面前說出「智障」這個字眼了，顯然她在過去這幾年間都一直故意使用這個詞，比如說，用來指稱市長辦公室那些透過她不喜歡的法案的蠢蛋們，或是那些在人行道小吃攤對牆噴漆上「二○○三年畢業班」字樣
    的「智障」高中，還有那個去年萬聖節撞斷艾姆路上電線桿的酒醉愚蠢白痴智障。話筒中傳來她的悶聲。「我以為這個字是不聰明的意思，結果後來是花園俱樂部部'
