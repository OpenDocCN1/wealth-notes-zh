    長吉妮亞當斯，她把我拉到一邊，叫我克制一下，嘴巴放乾淨一點，天哪！」我母親結束了這場鬧劇，經過此事，她不但發現到謹慎用字的重要性，同時也赫然發現自己在無意間成為了社區裡的有趣傢伙。

    當不留意自己的言語、想法和信念時，你就好像是冒險讓自動運轉你的人生。舉例來說，你以為的信念是根據事實建構而成，但你並沒意識到，這些信念很可能來自於你父母或其他身邊的人。你的言語其實忠實地反映出你的信念。所謂的言語，就是你無心地重複敘述那些以前聽過的東西，不然就是證明了你對於字彙的選擇非常糟糕。一旦你覺醒，開始有意識地留意自己的思想、信念和言語，並且謹慎選擇所思、所信、所言，你的人生就不會這麼無趣（或比無趣更糟），也不會一直卡在財務困境中，而對我媽來說，則是不用被一個園藝比她更糟的人當眾指責嘴巴不乾淨。

    掌握你的心思對人生各個層面都有幫助，既然錢在世界上，特別是在金錢這塊扮演了如此重要的角色，有一個正確的心態對我們來說更是極為關鍵；我們甚至可以說，沒有正確的心態，我們根本就無法正常運作。

    話雖如此，我們卻很少，甚至不曾停下來深究我們對金錢的觀感、我們談論它的方式，或金錢實際上到底是一個什麼樣的東西。'
  - '[PAGE 79]


    # 錢只是工具，無法取代你是誰


    所以讓我暫時先停在這。不掌握好自己的心思，便是在脆弱的根基上構築人生。


    古早時候，那時還沒有貨幣的存在，人們以物或勞力易物，好比說，為人砌一面石牆以換取一絛獸皮和一袋鹽，或是用兩個女兒換一座城堡等。但是帶著一絛獸皮或一堆石頭走來走去實在會累死人，為人蓋東西又得耗費掉許多的時間，於是乎，人們想出了「錢」這個概念，賦予硬幣和紙鈔面額，所以今天我們買車或買任何東西時，只需要掏出錢包，而不再需要選出五隻最好的駱駝交換。金錢是一種人們進行交換行為為時衡量的單位。有異於一般的想法，錢本身並無好壞'
  - '[PAGE 80]


    之別，它亦非敵非友，骯髒或乾淨，錢就只是錢，它只管自己的事，並且努力試著不讓自己被卡在自動販賣機裡。錢，只是傳聲筒，你如何運用它，以及你對它的看法、感受和談論它的方式，才賦予了它人格。你賦予它什麼人格特性，則會決定了你想要被它包圍，或是敬而遠之。

    這也是為什麼當你〈完全不經思考地〉認為錢是不好的、骯髒的，同時還一直大聲嚷嚷著這個想法，你就是在不斷加強這個想法，而這剛好是使你窮哈哈的最主要原因。舉例來說，你很有可能有過「金錢真是萬惡之源啊」的這個想法，或曾脫口而出這句話。

    沒錯，我們的世界中充滿許多人們為錢所做的醜陋、不公義的事，但做錯事的是那些人，而不是錢；這就好比是說車子很邪惡，只因為有的人手一握方向盤就成為討人厭的混蛋，或者是只因為你削皮時不小心削到手，就說削皮刀是令人厭惡的東西一樣。錢、車、削皮刀都只是工具，它們能為人帶來極大快樂、興趣的冒險，更不用說，也是完美的結婚禮物。用已故俄裔美籍哲學家、小說家艾茵·蘭德（Ayn
    Rand）的話來說—錢只是工具。它能帶你到任何你想去的地方，但它沒辦法取代身為司機的你。'
  - '[PAGE 81]


    英文裡面有許多詞組彼此間的意思可說是難分辨，它們之間界線似乎很模糊，有時你很難知道過了那條線，就變成了另外一個意思。舉例來說，愛／欲（love/lust）、想當個好人／說謊（being
