    一分錢。她有兩個還在包尿布的小孩，而在她正式創業的一週後，其中一個小孩竟然住院了；彷彿這樣還不夠她受，她還在這時收到通知，需要去法院當陪審員。更雪上加霜的是她投身的金融產業中並沒有太多女性，所以她的挑戰一方面來自於身為女性，另一方面草創之初，人微言輕。她跟我說，她曾試著在事業剛起步時去找第一名投資人，而電話中另一頭的潛在投資人看了看她至今的投資金額（也就是她畢生積蓄）後說：「就只有這樣嗎？」然後就拒絕了她。掛上電話後，她就哭了，覺得自己很被羞辱，而且恐慌了起來，懷疑自己真的能成功嗎，她真的能為供應家人的需要嗎？她有可能在成功創業同時，又不至花光所有積蓄嗎？有一段時間，我常看她失神般地走在街上，臉色白得跟鬆餅麵糊似的，彈著打火機，看起來活脫脫像鬼。每
