    # 對變動和調整保持彈性


    一個興趣感，彷彿目標不只已經達成了，而且你的表現更是好到掉渣。先感受一下這種如釋重負、喜悅、充滿狠勁的感覺，然後再開工！


    很多年以前，我跑去威斯康辛州密爾瓦基（Milwaukee, Wisconsin）拜訪我朋友，我們一起去參觀米勒啤酒廠。我們一邊在廠區參觀，一邊喝著塑膠試飲杯裡的啤酒，就在那時，我突然領悟了某些以前所不明白的事，而這也讓我對這間生產號稱「啤酒中的香檳」的酒廠，油然而生一股新的敬意。米勒啤酒廠成立大約六十年後，美國發布了那條禁風景的禁酒令，影響力及於全國。這條禁令毀了無數場合派對，同時也讓數百間釀酒廠關門大吉，但米勒啤酒廠卻倖免於難。這間公司沒有想著，「好吧，這些年來真是滿好玩的，我們也撐滿久了，現在我們是否該去看一下街角那間咖啡店還沒有徵人。」而是相信絕處必會逢生，一扇門關了，另一扇就開，所以他們想辦法找出一条新的路走。


    他們推出麥芽牛奶、麥芽糖漿、蘇打水和無酒精啤酒等各種新的產品線，同時更名為米勒公司，在這段非常艱困的時間中掙扎求生。多虧這些新的產品線和經營家族一些相當'
