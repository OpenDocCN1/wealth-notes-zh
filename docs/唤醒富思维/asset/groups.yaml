    # 二、思想大改造：


    +   1. 最常和你相處的朋友，他們最常用什麼限制性詞彙或句子來描述金錢？寫出五個。


    就是要「有錢三步騸」。一、念出來就是你的：我愛錢，因為它總是在我身邊挺我！


    很成功地限縮你的信念，讓你畫地自限，同時還不斷將這些限制性的信念當做人生真理。若在獲得線索時稍有遲疑，你就會為這些你再熟悉不過的限制性信念留下死灰復燃的時問和空間。猶豫就好像是一道裂縫，所有藉口都會從這兒衝出來，沖洗掉所有的決心，並且把你掃回那個安全的舒適區裡。試著傾聽自己的直覺，信任宇宙智慧，而非你的恐懼，相信你渴望的事物早已在那，擺出狠角色的樣子（你本來就是），跨出這驚天的一大步吧！你一定做得到！'
