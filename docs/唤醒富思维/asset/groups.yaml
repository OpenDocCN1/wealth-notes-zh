    ## 就是要賺錢三步驟


    一、念出來就是你的：

    我愛錢，因為我是一個無所畏懼、天不怕地不怕的賺錢機器。

    二、思想大改造

    1. 預設可能會遇到的困難。懷疑就像是那個毀掉整件毛衣的小線頭，弄清楚最有可能毀壞你決心的三個懷疑念頭，準備好自己，當真的遇到時，它們就不會影響你

    （例如：我的老伴才不會支持我呢！準備好還擊的口訣心法：只有自己知道我是誰，而且我相信我能致富）。寫下你可能一定會遇到的困難，同時提供應對方法。

    2. 提高你的底線。我們常等到面臨腹背受敵和非賺到錢不可的狀況，比如該繳房租、需要動手術、黑道拿著借據上門討債時，我們負責下決定的肌肉才終於開始動作。決定好一個金額，將之設為你的新底線。我們假設這個數字是五百美金好。

    你的銀行戶頭不論何時何地，最少都一定要達到這個數字，當金額快少到這個數字時，快點讓自己振作起來，拿出更好的表現，賺更多錢回來，存款才不會少於底線。然後每個月或每隔一段時間，都要不斷提高這個底線，很快地你就再也不會掙扎於財務狀況了。

    3. 找出花錢的新方法。去買一些奢侈品，不只能提高你的頻率，也能提醒自己，你正順著金錢流，而金錢是可再生能源。你買的東西應該要貴重感、令你興奮，不一定要素費不貪，但會讓你覺得有點敗家，同時又有很重要的意義，這樣就能激勵你更努力賺錢。

    4. 現在就下一個又大又風險又令你覺得害怕的決定吧！這個決定要能幫助你更靠近財務目標，然後放手去做。我是認真的，現在就決定。可能是某件你想了很久，確信能讓自己的人生翻天覆地的事，但你一直因為害怕而遲遲沒有動作。別因為貪睡而錯失良機，把握當下吧！

