    永不停歇的聲音和意見之中，找出自己到底想要什麼。我來舉個例子，你去某個人豪華的家裡作客，離開時你心想，我家裡也想要像這樣，每個房間都裝設音響設備，到底以...前我是怎麼過生活的，白活這麼久？但是不久後，你又去拜訪另一個朋友，她穿的是二十多年前面念大學時的衣服，開的車也是以前那臺破破爛爛快要解體的車，聽音樂用的破音響更是數十年如一日，她說反正這些東西都還夠用，何必丟掉它們再買新的，製造出更多垃圾呢？突然之間，你覺得自己想在洗衣間也裝上一臺喇叭的念頭實在太醜陋了。


    生活中心，你會做出大大小小的決定，然而也一定有與之衝突的其他意見和想法，對特別具爭議性的事物， Canon？


    好比重點。正因為如此，嫻熟於傾聽自己的直覺和內心，並且隨心之嚮往，便是一件非常關鍵的事。讓我直搗核心：就算你允許自己去賺錢滿足自己的渴望，也不但代表你是或會成為一個貪婪、自私、毀滅地球的混蛋。


    特別具爭議性的事物，好比金錢來說，這種情況更是常見。但是你認為什麼是事實才是重點。正因為如此，...


