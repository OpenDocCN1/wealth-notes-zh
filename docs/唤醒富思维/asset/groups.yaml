    2.「閉上嘴」，「慢下來」，「不要」再用上面這些詞了。

    3.每天至少花五分鐘靜坐冥想。坐下前，問問自己，「有哪些信念讓我無法賺到錢？」如果有獲得什麼啟示，把它寫下來，對它們出疑問，利用前面幾章說過的方式想出一個新的故事，然後不斷對自己重複。

