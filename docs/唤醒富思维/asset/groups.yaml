    的你擁有「萬事皆可能」的 心態，能擊潰這些負面思想，它們不再對你有影響，而且縮 小燈正等著它們。 還記得以前和金錢維持有 一段搖搖欲墜關係的我，一直很難相信那些關於心態有多久
