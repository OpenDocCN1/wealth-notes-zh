    ## 現實是言語和思想建構出來的


    言語同樣會大大影響我們對現實的認知。藉由不斷被重複敘述，話語能讓我們的思想和信念活過來，這些想法和信念最後就會成為我們面對到的「現實」。話語幫助我們確認自己的身分。我們心裡那些沒有說出來的話，和習慣以為常的既定行為模式會抓住我們：我記憶力超差，所以我又忘記帶鑰匙出門了，我真的是弱智！你愈是一直說自己是健忘的弱智。你要是一直跟一個小孩說她很笨，只要說的次數夠多，那就算她明白自學英文有成，最後她還會信以為真。四十年裡幾乎每天，我都不斷跟自己說：「我不知道自己人生的目標是什麼。」因為這樣，我自認就一直處在毫無盼望且困惑的狀況裡，就這樣長達數十年。如果把「我不知道」換成「到處都有線索」，我就可能早點接收到生活中的片段線索，而不是總把機會之門悍然關上，天知道我因此錯過多少良機！人是習慣的動物，所以我們會一直重複講同樣的話，久而久之，這些話就像鑿子，在我們腦袋裡鑿出痕跡，一次又一次地不斷播送相同的故事，型塑思想和信念，最後便定義了現實。我們的話就像流過石頭的水，隨著時間在石塊上刻畫出痕跡，甚至可深如大峽谷。這也是為什麼我這麼喜歡「動彈不得」這個詞，因為真的是如同字面般，你會被困在這些思想、信念和言語裡，而為了得以自由，你需要有意識地去創造新的足跡，為自己找出一些比較好的新詞彙，這絕對是重要的第一步。言語被用來建構一個能使他人了解的架構，我們根據這個架構來定義和塑造對現實的認識。我們沿著時間創造、正增強這個界線，舉例來說，我們會討論昨天做了什麼，或明天怎麼不快點到這類的話，或是「總有一天我會開始健康飲食」，但現在我只想吃看看抹一層厚厚奶油的起士漢堡味道如何」等。根據愛因斯坦的理論，時間只是個幻覺，它可以被彎曲，是非線性的，一天有二十四小時這件事本身就是個大騙局。相對論我們都聽過，但是人們實在太固著於一週七天，一年五十二週，所以在我們的語言中，這是「真實的」。北美印第安人中的霍皮族，他們的語言中就沒有用來表達過去或未來的詞彙，因為他們只會活在當下。不只這樣，其實他們也沒有用來描述「現在」的詞，因為光要花時間想出一個詞來指涉這個概念，就會讓他們錯過現在。所謂的現實其實有著無限個樣貌，而我們說的話，會形成我們認知的現實，將我們緊緊包裏在當中。言語也能說服我們，想看，當人一句話就說中你的感受、想法、恐懼的時候，那種感覺有多麼奇特。一句話如果來得巧又及時，能讓你整個人振作起來，讓整個國家的


    ## 思想能引燃情緒，進而引發行動


    小時候，家裡隔壁的鄰居也有幾個和我年紀相近的小孩。鄰居這對父母是德國人，我剛好在聖誕節兩週前的某一天到他們家去玩，他們的小孩子告訴我一個價值連城的資訊：原來不是十二月二十五日聖誕節那天可以在聖誕樹下找到禮物，德國還有另外一個


    > 嘴巴說出來的話，會在你的生活中成真。


    聰明人都投票給一個蠢蛋，或是讓全鎮上的人一起喝下有毒飲料自殺①。因此你得開始留意自己說了些什麼，你是否常用言語表達出你恨／怕／不相信錢的想法，例如「我真的是金錢白痴、我絕對買不起、我討厭那些有錢的王八蛋」這類的話。如果你常講錢的壞話，或許你應該開始考慮停止這麼做了。


    ① 分別指希特勒掌權和一九七八年瓊斯鎮集體自殺事件，後者造成九百零八名信徒死亡。


    個叫做聖尼可拉斯節的節日，據說如果把鞋子放在門外一整晚，隔天早上就可以收到塞滿整雙鞋的禮物，哇！於是我立刻回家，找出所有鞋子裡面最大的那雙——一對木屐。那天剩下來的時間對我來說，簡直有如九百萬年那麼漫長，當我終於扭到了大家吃完晚餐的時刻，我偷偷溜出門，按照指示，把木屐放在前門旁邊。當晚，我躺在床上，豎起耳朵，聽著我爸媽清理廚房的聲音，突然我聽到前門打開的聲音，也聽到有人在喊我們家狗的名字，我的心緊張地怦怦跳，然後不久，我聽到有人叫我的名字。一，珍妮佛！妳給我滾下來！一我走出房間，只見我媽站在樓梯口，高舉過頭的手上揮舞著那雙木屐，質問我為什麼它們被放在門外。我含糊囔囔著說我脫下來後忘了收進門，邊忙不迭地道歉，接著鞠手鞠腳地拿著那雙快結凍的木屐回到樓上。這下可好了，現在我得再想辦法，冒著讓自己惹上兩倍麻煩的險，趁他們睡著後再溜出去放鞋。這麼做很有可能讓我又惹上一身腥，畢竟這是一雙全新的木屐，如果又被抓包，毫無疑問會導致嚴重的後果；但想到可能獲得的那些禮物，我認為這是絕對值得一冒的險。顯而易見，故事的結局是我啥勞什子禮物都沒拿到，而且還被逮個正著，這都要怪那隻一大早就得出門尿尿的笨狗。結果我被罰打掃倉鼠籠整整一個月，外加負責把洗碗機裡的碗盤歸位，這下可好了，我弟和我妹有好一陣子都不需要做家事了，對照他們的歡天喜地，這下我感覺又更差了。人是受情緒驅動的生物，當我們鬥志滿滿時，什麼都聽不進去，智慧的見解、有邏輯的洞見，甚至恐懼跟懷疑都不能阻止我們。情緒能驅使我們做出最偉大或最愚蠢的事：當支持的隊伍贏得世足賽冠軍時，我們會衝到街上把停在路旁的車翻過來，我們會和那種一看就很有問題的人交往，也會花上萬把元買一雙很漂亮但根本不合腳的鞋，喔，還有冒著被父母責罵的險再把木屐放到門外去。然後我們也會得到一份超過能力所及的新工作、克服怕坐飛機的恐懼去探望一位需要朋友、儘管怯場卻還是在眾目睽睽下站上舞臺、為了完成創業夢想甘願負債。情緒啟動以前，一定會先有一個想法，比如，我們贏了！我愛我的朋友！我想要自己創業。所以當你知道如何掌握心態並且專注在那些能誘發出力量、正面的情緒上時，你就能好好運用這股力量，進而得以無視心中恐懼和那個不斷扯後腿的小王子，孤注一擲地邁出信心的第一大步。這一切都始於你的思想。你approval.


    ## 改寫你對錢的看法和情緒


    為了讓你的思想能夠發揮出最大的潛力，咱們花點時間來看看人們對金錢常有的看法；很多時候，我們下意識地把這些看法奉為圭臬，還不時成為傳播錯誤訊息的幫凶。注意這些說法，看看它們是否讓你想起某些自己常有的說法或看法，畢竟如果要打破你


    > 想法引發情緒，情緒又觸發行動，最後就形成了你周遭的「現實」。


    會有 人包括你自己把你當一回事，或你每天只打了一行銷電話就決定收工喝酒，那你恐怕沒辦法有什麼收穫。你腦袋中的這些團隊成員，一定都得拿出他們的最佳表現，儘管我不想厚此薄彼，但它們之中，最重要的還是思想，它才是最重要的狠角色。


    那不怎麼亮麗的財務「現實」魔咒，覺察絕對是第一步。要如何做覺察練習，有四步驟


    - 1. 留意那些會限制你的想法和信念。

    - 2. 對這些想法和信念提出問題，並且仔細檢視答案。

    - 3. 重寫你的想法和信念。

    - 4. 大聲念出這些更新過後的想法和信念。


    我先示範一次要怎麼做，這樣會讓你比較有概念：


    毫無幫助的想法：錢又買不到快樂。

    問題：什麼事情能讓我快樂？

    答案：花時間和所愛的人在一起、烤起司三明治、被愛和愛人、捧腹大笑、送人很棒的禮物、旅遊、健行、和我的狗一起玩、開到哪玩到哪、聽音樂、喝啤酒、自己創業

    ② 原文為99 Bottles of Beer on the Wall - 是一首通常在喝酒時唱的美國民謠，每喝一瓶酒，就把歌詞中的啤酒數量減一。


    給很多小費、自由、去按摩。

    問題：錢能讓我獲得上面那些讓我快樂的事嗎？

    答案：可以。

    重寫想法：錢能夠支持我的快樂。


    毫無幫助的想法：我寧可把重點擺在有趣的事，而不是賺錢上。

    問題：你覺得賺錢有趣嗎？

    答案：如果賺得到錢，就有趣；可是為了賺錢，我得去做那些我覺得沒有趣的事。

    問題：你的人生僅此一回，它是否值得你花時間去找一份你覺得有趣的工作？

