    會把這坨繃帶拆了，抹上一點藥膏，簡單的用OK繃妥善包紮好便是；但我不是，而是繼續一跛一跛地走路，洗澡時繼續在腳外麵套上塑膠袋，而且能夠穿著開口笑的鞋子有多久就多久，只為了避免拆開那團已經髒到不行的綑帶，和綑帶下的傷口面對面。


    ## 勇於面對財務狀況


    這和許多有財務困難的人對待金錢的態度一樣。我們寧可跋腳，裹住和金錢這段破爛不堪又不健康的關係，只因為我們害怕這一層層綑帶下的東西。但是如果我們勇於面對紗布下的東西，不管它是因為想要致富而出現的罪疚感，或是錯誤的投資、無效的致富計畫等，只要我們開始留意、釐清，就能獲得結束這些殘難的力量。我們總想要避免疼痛，但卻事與願違。我們不想面對追求財富過程中可能感受到的羞愧、焦躁不安。感，寧可繼續維持破產狀態，然而兩袖清風也是讓我們覺得丟臉、不安。我們不喜歡管理大筆金錢帶來的壓力，所以寧可維持窮困，繼續因為錢而壓力山大；我們不希望錢成為人生焦點，因為其他事情更重要，所以我們仍舊和自己的財務狀況脫節，最後我們還是為錢傷心傷神，不知不覺中，錢幾乎變得比其他事更重要了。


    我自己就花了十多年的時間碎念、抱怨自己很窮、很挫折、无计可施。但如果你要我计算出确切的数字、认真工作和学习新技能或冒点险时，我根本只会放空，好个粉饰太平的女王！我根本不知道自己每个月的支出和收入是多少，反正我就是眼一闭，手一抓，祈祷月底早上醒来时，电话还没被断线。跟很多人一样，身为自由作家我劳心努力工作，因为「这是我的工作」、「我只会靠这赚钱」。我没有风风火火去多找些写作案子，反而把时间都花在退缩、拖延计算，然后得出一个完全让自己陷入死胡同的结论：一天二十四个小时＋只有我一个人写文章＋一小时工资四十美金∥我又累、又暴躁，同时小费也给得很小气。

    我们都被教导，只要认真实工作就赚得到钱。但如果这是事实，那些有钱人应该要累到两眼充满血丝，大口喘气，一副快死的样子，而不是一天到晚都可以开著游艇出游吧？把焦点摆在钱而不是把自己累个半死，并且要非常清楚自己到底需要赚多少钱，

    为了避免承受疼痛而去做某些事，反而因此创造出我们竭力想避免的疼痛。


    是否可以換個做法以達成目標，當我們做得到時，就能打開這扇通往全新自由的門。


    拒絕改變，是最讓人裹足不前的一件事。


    如果你想改變財務狀況，那你得願意改變生命中某些事。舉例來說，我認識一個人，他的工作穩定，薪資也不差，但據他說，工作內容世界無聊。工作閒暇時，他也從事自己喜愛的媒體訓練，他並沒花很多時間和力氣，但生意卻蒸蒸日上。因為他真的做得很好，口耳相傳下，工作量愈來愈大，漸漸難以負荷，他不得不開始拒絕上門來的客戶，畢竟他無法一邊兼顧正職，一邊又承接新客戶。


    他實在很想賺更多錢，也想繼續做自己喜愛的事，但卻覺得綁手綁腳，他的正職工作每年加薪幅度從沒超過三％，但能夠花在兼職，收媒體訓練客戶的時間就只有這樣了。當然，他可以鼓起勇氣，索性把工作辭了、創業，靠媒體訓練賺進幾百萬。但他覺得這根本不可能發生，因為那些恐懼的聲音和信念說：白痴才會辭掉一份穩定的工作去


    改變想法，就能改變人生。


    追逐未知的夢想。我還沒準備好，我的經濟狀況隨時都可能被拖垮，如果全職做媒體訓練賺得沒有本來的工作多怎麼辦……。當然如果他跨出這一步，確實沒人能保證他一定會做得有聲有色，但如果不冒這個險，我們幾乎可以肯定他會把活著的歲月，都做這份無聊的工作。

    這和哥倫布發現新大陸時的狀況差不多。土著們雖然就站在岸邊，並且看到了艦隊，但他們並沒辦法馬上把這些船艦「看」進去。在這之前，他們從來沒看過船，對他們來說這些是全新的概念，所以他們的大腦需要一些時間才能把線索拼湊起來，才能明白眼前到底發生了什麼事。

    很多人試著想辦法多賺點錢，但常常就卡死在這，因爲他們試圖從現實的視野角度去想出改變人生的方法。新的機會對他們來說實在太陌生了，要麼根本進不了視野，要麼就是看起來完全不合理。


    ## 五種人生階段卻能增加收入


    我會模擬五個可以幫助你增加收入的不同情況，但我希望你牢牢記住，如果你想揮出全壘打，那麽不管發生什麼事，你都要放寬心胸，讓目光可以超越你現的環境。


    快醒過來，看看自己到底是怎麼詮釋「現實」，做新選擇，向外尋求新鮮的觀點，去相信那些感覺不可能的事。


    多數人繼續在財務困境中掙扎，不是因为他們工作做得很糟或


    是欠缺願景，而是因為他們不願意拓展眼界。


    不管你現在的情況類似以下哪個狀況，也別忽略其他模擬的狀況，因為它們之間或有重疊之處，你永遠不知道會在哪獲得改變人生的靈感。


    1. 決定創業。


    我已經當自己的老闆超過二十年了，我無法想像自己過別種生活；但是不見得每個


    人都適合創業。以下是和智囊們定期會討論創業的一些利弊分析。


    利：


    ○ 你能賺多少或事業規模能發展到多大，基本上都沒有上限。小型、中型、大型事


    業，決定權和獲利都在你手上。你可以選擇自己的生活方式、工作時間和同事。你可以一邊環遊世界一邊經營，或決定要在廚房上班、只僱用你的死黨、穿睡衣工作，基本上你想幹麼就幹麼。你是老闆，所以你說了算。你做決定，獨享成功，你還可以規定每個人都要帶他們的狗來上班。


    弊：

    你 你是老闆，所以你得負全責，承擔一切風險，一旦火燒起來就會是你的屁股。

    你得自己規劃所有架構，也就是說，你要擁有鐵血般的紀律才行。

    通常，特別是在草創時期，你都是孤身一人。待在電腦前。坐很久很久。所以帶狗來上班的這條強制令非常有益身心健康。


    2. 如果你還是決定要創業，那麼有幾點則應該要注意。

    留意什麼事情讓你與奮，什麼事情不請自來，有什麼是你很期待與世人分享的，

    哪些人提供的產品或服務讓你很感興趣，能讓你躍躍欲試相同或類似的事。能找

    出愈多條件明確的事愈好，接著就看看是否有機會從中找到利基。


    另一個獲取靈感的好方法，就是注意聽你自己或其他人常抱怨什麼事：為什麼沒有好用又可愛的電腦包？為什麼沒有健康的速食？我想要來趟公路旅行可是又不想亂吃東西。到底什麼時候才會有人寫一本有笑話和髒話的工具書啊？把你能想到類似商品或服務列成清單。清單列出來以後，看看上頭有沒有什麼是你覺得有趣又有商機的。

    算術時間到！確認你的想法有利可圖，同時有成長空間。我看過許多人興奮地創業後，卻發現自己幾乎賺不到什麼錢，甚至虧本，因為他們花太多時間在自己 的熱情上，卻忘了計算營收。兩者當然都很重要，但如果你只是想怡情養性做，那就算它當嗜好就好。如果你要的是能賺錢的事業，那你一定要清楚預期收入以及獲利方式。「擇你所愛，錢會自來」這句話印在抱枕上挺不錯，但對你

    那就把 它 當 嗜 好 就 好 。 如 果 你 想 要 的 是 一 個 能 賺 錢 的 事 業 ， 那 你 一 定 要 清 楚 預 期 收 入 以 及 獲
    利 方 式 。「 擇 你 所 愛 ， 錢 會 自 來 」 這 句 話 印 在 抱 枕 上 挺 不 錯 ， 但 對 你 自己是不怎麼相信營運計畫這一套，但如果你打算申請貸款，那就是另外一回事了。營運計畫書看起來很浩大、令人望之卻步，可以讓意志堅決的人都不禁覺得：算了，管他的，我還是回學校繼續念藝術史就好了。但是如果坐下來好好搞清楚、寫下你公司所有可能的收入來源、支出、獲利數字和目標市場等，我絕


    對舉雙手讚成。它不用是一張很長的單子，一兩頁的篇幅即可，愈簡單愈好。善用時間。你只有一個人，一天就這麼多時間，如果你是開實體商店或提供面對面的服務，是否可能將它轉成線上模式，這麼一來，你可以觸及到無限的對象。或者是否你可以聘僱員工來做這些你正在做的事情？你是是否可以同時提供多人授課一對一的服務？除了親自服務，你是否也可以製作資訊產品（Information
    Product）①。善用時間讓你能減少工時，增加收入，那些成功的屁孩都是這麽做的。


    一次專注在一件事情上。別同時進行兩個計畫，或任何分散焦點、時間的打算。企業家通常都是很有創造力的人，但是對寫一張專輯的曲子或回三十五封行銷電子郵件來說，創意是件好事；但對創業來說可是個麻煩。我保證，當你冒出一個創業好點子並且開始進行時，你又會冒出更多的別的好點子。如果你分散了注意力的，試圖同時追尋超過一個目標，那你就死了。據說一架飛機起飛時需要用掉四〇％的燃料，你也一樣需要全力以赴、全神貫注讓事業起飛。當然當你的事業上軌道開始運作時，這樣的原則仍然適用，但這時你已經有了推力，自然可以開始著眼其他想法。但是在事業完全上軌道、妥善運轉並且有能力獲利之前，你可


    沒獲准另創新事業或著手進行其他大型計畫。不計代價，奮不顧身。有一個曾和我在唱片公司共事過的朋友，她決定要全力投入身自創一間品牌行銷公司。她白天的正職是唱片公司的創意總監，這份工作占掉她所有時間，於是她決定辭職，一邊實現自己的夢想，一邊在酒吧當酒保。偏偏只有前公司正對街的那間酒吧有職缺。她忍住一口氣，倒野格酒②給曾在她底下工作的實習生喝。就這様，她的事業蒸蒸日上，獲利數百萬元。讓自己成為行銷達人。很抱歉，如果你打算創業，那麼萬事都離不開行銷，因為不行銷，你就根本不會有生意可做。去上課，找到銷售中你所擅長的區塊（行銷比你所想的還深入），多練習，讓自己更擅於使用各種技巧，然後別再一直說「除了業務這塊，其它每一類工作內容都喜歡」這種話了。


    ① 資訊型產品銷售來説就是把知識、資訊、專長等變成產品，藉此用於銷售獲利的一種產品模式。其傳播形式包括CD、DVD、線上教學、電子書、App等。

    ② 野格酒（Jagermeister），或稱野格利口酒、聖鹿酒（因酒標為一頭雄鹿），是源自德國的草本利口酒。其酒精濃度約三五％，可以直接飲用，也可和果汁、可樂、通寧水等混合後飲用。


    夢想或是自尊，你只能一選一。

    3. 如果你是已經有自己的事業，但希望它能有更多成長。

    去找一個教練或是導師。我一直說一直說，你還不贏嗎？教練或導師能夠看到不一樣的機會，我花了一整本書大聲嚷嚷、用叫的跟你一百万次了。他們的視野角

    度和你不同，你是當局者迷，只能見林，他們卻能見樹。教練和導師比你有經驗，他們坐在山頂，吃著橘子，看你在山腳下跌跌撞撞。他們能夠為你在，大概

    二十八秒之內，指出你可能需要花三年才搞得清楚的關鍵點。

    找出你事業中最賺錢的那個區塊。是活動？是產品？是高單價，一對一這類的服

    務嗎？找出答案，然後讓它更臻完善。

    你在哪一些地方還未授權予人，找出來並且開始委派。許多企業家的最大問題就是

    把時間都花在忙碌經營事業，卻未花時間改善事業的品質。每天的各項瑣事就夠

    讓我們焦頭爛額了，再找出時間思考新點子和擴張事業規模，似乎是件奢侈的


    事。 然而事實卻恰恰相反。 擴展是事業經營中最刺激和最具生命力之處，所以別再假裝每件事非親力親為不可，抓起皮夾，跨出大步，去聘一些人幫你吧！

    探尋找合夥人或找人合資、投資的可能。 總之，就是去找找看是否有人能夠幫助你擴展事業。

    找不到看有無可能創造被動收入來源，被動收入的意思，就是你只需工作一次，但之後卻能一輩子不斷獲得收入。 比如說：把自己在研討會上演講的畫面錄下來，然後燒成光碟販售或供人收費下載，或是寫本書、自創其他種類的產品、投資別人的公司等。
    被動收入好到不要不要的，它讓你可以一邊在沙灘上啜飲著瑪格麗特，一邊笑看錢還是不斷流進你的戶頭。

    4. 你擁有一份令你痛恨／無聊得要命的工作。

    你花大數清醒的時間做一件事令你痛恨／無聊得要命的事？這是不合法的！你一定得辭職！但是辭職以前，還是得對這份工作心存感謝，畢竟它也讓你賺了一些錢，也是因為它，你才能更靠近夢想。
    然後記得也要看一下第五點。


    ## 5. 你喜歡你的工作，但它賺不了什麼錢。


    請老闆為你加薪。但是你要知道為什麼自己值得加薪，把你對公司的貢獻、你為什麼是公司不可或缺的資產條列出來。研究一下公司聘請你以後增加多少資產、士氣有何改變、形象和聲譽有何提升。比如說，你主辦過公司有史以來最棒的假日派對等。你是否有些他尚未被看見的技能、想法和優勢，是公司還不知道或尚未運用到的？或許你能和上司一起擬定升職的時間表和方式。想一想，你認為自己值得多少薪資，然後以自信和帶著感激的態度去爭取，同時也做好未獲同意就拂袖而去的準備。事實是當你受僱於人時，雇主通常已經預設好你的能力值了，所以如果他們不退讓，而你也不開心，那麼或許就是另尋其他薪資較好的工作的時候了。絕對不要帶著怨恨留在原地。自己去找升職的機會。公司裡有沒有什麼職位是你有興趣，薪資也比較好？如果有，去和那些做這工作的人聊聊，找出部門主管是誰，需要具備什麼資格，然後設定好任職目標。看看現在你能夠提供什麼幫助，和該部門成員維持聯繫，和那裡的人混熟，烤餅乾送他們，向他們表達你的誠意。如果你的公司沒有內部晉升的習慣，或許這個做法就不能適用；但如果公司會從內部晉用，那就大膽一試


    吧！請相信自己是值得的。

    學習和這個產業相關的所有知識，調查一下是不是有在其他地方做類似工作內容，薪水卻比較多的人。如果有，確實去執行等下第五點裡提到的每一件事，然

    後前進待遇更好的另一間公司吧！

    想辦法為自己創造工作。你公司裡是否有些事應做卻還沒人動手去做，有的話，

    讓它變成一份新工作。擬出一個絕妙文案，推銷這點子，讓公司知道這怎麼做絕

    對大有收益而且能夠大賺一筆，文末再附上你期望的薪資。搞不好就真的讓你成

    功了，畢竟更奇怪的事情都發生過了。

    試試看是否可能改變工作模式，不是領死薪水而是抽佣金。領固定薪水會有所

    限，抽取佣金可沒有。

    找看看有什麼事情是你樂在其中又有利可圖的？用它當做兼職補貼收入。我不是

    要你壓力山大、超時工作，但如果你非常熱愛你的正職工作，只是它的薪資不太

    可能調漲，那你要麼就是忍者點，繼續領這份薪水；要麼就是辭職；不然就是想

    辦法增加額外收入。

