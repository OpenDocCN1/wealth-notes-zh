  md: '# 知行合一2 | 你心之外没有世界


    知行合一2 | 你心之外没有世界。


    这是我们第一模块第四单元的第二节课。


    # 你的世界是你构建出来的


    有同学反馈：认知方法论怎么老是在讲“感觉”，“感觉”和“认知”有什么关系呢？


    假如时光倒流500年，大家不是在“委屈”地和我学习“认知方法论”，而是和一个具有非常高历史地位的高手学，大家也会提出同样的问题。


    这个高手就是王阳明。


    王阳明有“古今第一完人”之称。中国古代强调的“三不朽”（立功、立德、立言），据说真正能做到的人只有两个人半，王阳明就是其中一个。


    王阳明在那个时代取得了非常大的成就：


    +   立功：他“挽狂澜于既倒”，不仅打赢了几次事关国家命运的大仗，而且打得非常漂亮，以至于作为一个文官，却因为武功而被朝廷封侯；

    立德：在没有互联网的时代，他有2万多名极其忠实的弟子，在其后的500年，他的影响力一直延续，不仅影响了中国，而且影响日本，甚至影响世界。

    立言：他是中国哲学史上顶级的哲学家。


    但即便是跟着王阳明学习，你同样也会觉得不耐烦。因为他经常关心的、反复在讲的一个问题是：心外无物，或者说感觉是怎么形成的。


    所谓“心外无物”就是：你的心之外是没有世界的，世界是你构建出来的。


    大家可能听着耳熟，这也就是我之前讲的“感知的结果是你的感知系统、感知生产线的一个产品而已。”


    # 王阳明的“心外无物”


    王阳明讲“心外无物”时，他的一个朋友质问他，用现在的话翻译就是：“你这很荒唐嘛，心外无物”不就是典型的主观唯心主义——你闭上眼睛，世界上就没有悬崖；你心里没有车，车就不存在，那车要是撞你呢？”


    如此听来，“心外无物”的确很违反常识。但听了《认识方法论》这门课，大家现在应该形成了一种习惯：你听着特别荒唐的事情，往往不是因为那句话荒唐、那件事荒唐，可能因为你的认知和那件事没有兼容性，导致你觉得荒唐。


    > “你未看此花时，此花与汝心同归于寂；你来看此花时，则此花颜色一时明白起来。”


    # 你看到的世界的状况只反映了你心的状态


    学习了三周的课，再来看王阳明这句话，大家就很好理解了。


    这就好比，世界上是没有“颜色”的，只有不同波长的电磁波——“颜色”是我们的眼睛特有的构造机制跟电磁波的一个化合物产物。


    王阳明的整个哲学就叫“心学”。他认为：要活在这个世界上，要改造世界，要跟这个世界相处，其方法就是改造你的“心”。


    # “你是一切的根源”


    王阳明的观点，用一句很流行的話解释就是“你是一切的根源”，至少你是一切与你相关的事情的根源。


    划重点


    +   1. 感觉和认知有什么关系？你对这个世界的认知，就是你的感觉制品公司生产出来的产品。

    2. 你看到的世界不过是一个显示器，你的心是什么样子，世界就是什么样子。所以，改变认知的唯一方式是改变内心。


    吴伯凡

    在生活当中，我们常常看到这样的现象：出现问题的时候，有人常常习惯性认为是“我的老板出问题了”“我的同事出问题了”“社会风气出问题了”；如果是婚姻出了问题的时候，那肯定就是“配偶以及配偶自带的家庭老在找我别扭”。所以，很多
    人常常会想出一个特别简单、粗暴，又直接有效的方法——辞职或者离婚。'
