  md: '# 问答07｜“高带宽专线”是否会导致思维固化？


    问答07｜“高带宽专线”是...


    习惯是一种高带宽的专线，也就是说我们需要重复认知相同和类似的事，以后遇到事情才能很快作出决断。但这种直觉思维也会影响我们的认知，使思维固化。在某些方面，这种高带宽是否存在着不足呢？


    我在“得到”订阅了好几个专栏，涉及不同的知识领域。请问一个人能否同时跟几个专业知识建立高带宽的专线呢？当然，我也发现很多的专业有某些逻辑是相通的，例如演化论和人类的底层欲望等等，在学习不同专业知识时进行跨学科的联想，也有助于强化对知识的理解。这是否同时强化了不同的知识带宽呢？


    # “高带宽专线”的不足


    这两个同学的问题其实是一体的。我们先来说说“高带宽”是否存在不足。


    这个问题我们在以前的课程中已经回答了：建立专线式的高带宽连接，可以大大提高我们的认知效率，让我们在某一个领域或某一个点上成为高手。但是，神经元的连接有一个特点——一旦建立了一种连接，就会自动抑制其它神经元的连接。你在某一个地方获得了近似于特异功能的认知能力的同时，也导致了很多你不知道的盲区。


    这种状况常常让你用你熟悉擅长的方法去解决你并不熟悉和擅长的问题，也就是我们通常说的“手里拿着一把钉锤，看什么都是钉子”。


    这种“单环学习”的便利和危险，让我们必须从单突围到“双环”甚至“多环”学习。


    所以，海泥同学在“得到”订了好几个涉及不同知识领域的专栏，在一定程度上是一种突破自己学习的“单环性”，防止自己被单一的、专线的高带宽连接所绑架的一种方法和手段。


    当然，这里强调的是“专线的高带宽连接”，而不是泛泛的连接。如果这个带宽不够高，不是类似于专线的东西，就很难有认知效率和认知效果。


    # 通过“认知自虐”向“双环学习”扩展


    当我们已经形成高带宽连接的时候，我们还要意识到其中包含的危险：被单一的高带宽绑架。


    我们有那么多的神经元，它们之间是可以发生另外的高带宽连接的，就像德鲁克每隔三年四年就必须学一门他完全不熟悉的学科，避免让自己被一个单一的高带宽连接所绑架一样，这就是“刻意练习”与“跨界”之间的关系。


    在今天，要有效解决一个问题，其有效的路径常常都带有跨界性质，因为单个领域往往是无解的：单个领域会让我们划地为牢，把我们锁死在某一个觉得是自己专长，实际上已经悄悄成为我们认知牢笼或监狱的小领域。


    跨界，首先是要敢于接触，并且乐于接受那些“异质化”的知识和认知。


    在某种程度上要像达尔文那样形成某种“认知的自虐”：当达尔文形成一个想法，他觉得这个想法已经很成熟了，可以自圆其说的时候，就会用一种类似于强迫症的方式，去搜集各种不利于这个结论成立的证据，以及可能颠覆已经成形的这个思维的思维方式。


    通过这样一种类似于“认知自虐”的方式，他确保自己能够让已有的认知快速迭代——达尔文不是在固化已有的知识，而是在深化已有的知识，同时通过这种“认知自虐”，在现有的认知中打开一个缺口，让自己经常性地进入某种“晕眩”，而不是无视已经摆在眼前的事实。他在通过这种方式打一场“认知保卫战”。


    比如，达尔文看到孔雀尾巴的时候，他“立即陷入了晕眩”，因为孔雀尾巴那么长，是不利于生存的，这对于它的生存竞争理论是一个挑战。


    达尔文没有回避这个挑战，相反，当他去拥抱这个事实的时候，终于让自己的认知疆域大大扩展了一块：除了进化动力、生存竞争以外，还有一个动力——性选择，这也是推动物种进化一个重要动力。


    达尔文从“单环学习”向“双环学习”扩展的过程，是他能够在同时代，在很多人都对进化论有自己的研究和主张的情况下，从一个看上去并不是那么聪明的人成为领域里真正大师的重要原因。


    # 划重点


    > 从“单环”学习向“多环”学习拓展：敢于接触，并且乐于接受那些异质化的知识和认知，避免让自己被一个单一的高带宽连接所绑架。通过这样一种类似于“认知自虐”的方式，让自己的认知快速迭代。


