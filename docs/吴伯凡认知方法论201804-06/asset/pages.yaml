  md: '里，表现却是完全不同的，我们只有通过跳“双人舞”，才有机会从不同的角度观察和了解自己，也只有在“双人舞”的旋转里，不断练习和提高自己的认知，培养情商和协作的精神，才能使自己胜任各种场合的“舞蹈”，舞出优美的人生。


    来自：认知之树1 | 认知的双人舞


    我们现在常常讲“用户思维”，其实本质上是在训练我们跳出自身的惯性思维与固定圈子，从一个第三视角来重新审视自己的想法与行为，避免陷入自嗨。


    昨天讲的是“认知是双向互动行为”，既包括与他人的互动，也包括与事件、环境之间的互动。再联系今天讲的噪音来源于认知媒介，可以想到，认知中的噪音（干扰项）除了源于认知者本身，还源于认知环境。


    认知者本身的自我证实倾向会带来认知偏差，比如上一单元说的司令官的认知噪音来源于他的“动机性推理”。


    环境，是说除自己之外的一切对立面，包括各种事、各类人，环境的改变可能直接导致认知改变。比如之前讲过的特制版《顺天时报》其实就是在给袁世凯的认知制造噪音。比如各种舆论热点吹捧的普世价值观、佛系、隐形穷人等，也是在给大众认知制造干扰项。


    但我们常常因为身处其中，就忽略了那些干扰项的存在，甚至以为不存在干扰项，以为自己对世界的认知就是真实的。就像《黑客帝国》里活在母体里的那些人，其实是活在噪音里，却天真地以为活在真实世界里。


    来自：认知之树2 | 认知的信道与噪音


    我理解的“洞穴空间”，其实就是培养大脑的降噪机制。只要这个机制的雏形建立，就会在与万变的现象的连接中，不断让这个机制生长，最终长成在大脑中的“洞穴空间”。


    这个机制的生成逻辑：凡事都试图去找现象背后的底层逻辑或运行机理，这个机制就会慢慢生长，最终对噪音的辨别和过滤能力越来越强大。


    就像我的闺女作为大队委的工作是记录好人好事，她苦恼没什么可记录的，于是我将好人好事解读了三个层次：最浅层是一眼就能辨别的，下一层是观察细节才能发现的，最底层是创造机会让好人好事发生。由此好人好事，在闺女的大脑里，就由守株待兔转化为主动出击。


    这是从伯凡老师“化博弈为合作”理念里悟出的“化被动为主动”，最普遍的思路，几乎可以横扫一切苦恼。


    来自：认知之树3 | 找到自己的“洞穴空间”


    跨界不是目的，是结果。


    高深的学问都是相同的，达芬奇的人体建筑图，达尔文的性选择，毕达哥拉斯的勾股定律，都是跨学科的成果。


    第一等的智慧，就是能在头脑中保留两种以上截然相反的观点，还能泰然行事。“洞穴”思考要之，“T字结构”行之。


    借用罗素的名言，须知参差多态，乃是幸福本源！


    来自：认知之树4 | T型认知结构


    我属于横短竖长的T字型认知，需要在"满世界跑"这方面下功夫。现给自己制定一个大致的计划：


    +   1. 不断培养自己的兴趣爱好，拓展自己的知识边界。当前在“得到”报了几门感兴趣的课程，经济学、金融学、心理学、读书俱乐部，认真学习，不断拓展自己的知识边界。


    +   2. 多去实践学到的知识和理论，在现实生活中去检验它的成效，反过来不断修正知识和理论，不断形成自己的认知。


    +   3. 人不能太闲，不能活得太安逸，要不然肯定出问题，走出舒适区，见识更广阔的世界，丰富人生体验。


    +   4. 没学到新的知识和理论，常问自己五个问题：看懂了吗？自己是否能讲明白？这个知识对我来说有用吗？如果有用的话，可以用在哪里？是立马能用，还是以后用得上？


