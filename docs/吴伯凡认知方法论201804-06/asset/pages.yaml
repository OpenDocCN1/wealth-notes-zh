  md: '# 004 | “虚幻”的快乐，还是“真实”的乏味？


    听完前几天的课程，我们起码有了这么一个认知：我们的感觉其实是一个产品，一个成品。换句话说，感觉是一个生产出来的东西，它有赖于一套完整的生产系统。


    当然，这一套生产系统有时候会出错，而它一旦出错，我们在产品的这一端是不知道的，只能是它生产什么，我们就感知到什么。这就是我们通常会产生错觉、感觉误差和幻觉的一个原因。


    更重要的是，我们得到了幻觉、错觉，我们还不知道。在这条生产线的尽头，没有一个产品检测线，没法判断什么是次品、什么是正品。


    不同的人看上去都一样，而实际上，他们接受了不同感觉的产品。我们对这种差异和不同缺乏认知，所以，我们经常会觉得某些人不可思议、某些人这么认为简直是疯了一样的<|message|>人还不知道自己疯了。


    # 袁世凯和《顺天时报》


    对历史感兴趣的同学可能听说过《顺天时报》，它是清末民初的一张报纸。这个《顺天时报》之所以有名，是因为它曾经是只有一个读者的报纸。


    # 以结果为导向的幻觉制造系统


    所谓的感觉，不过就是我们大脑当中发生的各种电子反应，就像是一个神经元的狂欢派对。那么，既然是各种的电子信号反应，是不是我们只要直接制造出各种电子信号，就能让大脑呈现出各种各样的反应了呢？


    我前不久使用了一款新产品，是一个介乎于3D和虚拟技术之间的东西。当我把这个新产品戴在头上的时候，我的眼前就显出一座雪山，我就开始滑雪了。


    +   1. 盲视技术


    现在有一种尚未成熟的“盲视技术”，但是从整个技术的假设以及现有的技术层面，已经证明了这个技术的思路是对的。


    +   2. 缸中大脑


    我曾经看过一个电影，电影里的男主人公是一个性无能者，但是他又乐于扮演一个非常强大的男人形象，于是就用了一些药物和技术，让他的女朋友感受到他是一个强大的男人。


    +   3. 快乐箱'
