  md: '# 010 | “瞬间解码”是一个长期修炼的过程


    010 | “瞬间解码”是一个长...


    这是我们第一模块第三单元的第二节课。


    上节课我们讲到了做品牌、做销售、交朋友等等，都包含着黑客客的“瞬间解码”行为，这里 busn 的本质特征在于：瞬间释放认知优势，让对方的防御性识别系统瞬间化解，同时通过制造某种跟你的隐秘知识契合的东西，让对方突然之间产生一种熟悉感，完全处于不设防甚至是拥抱的状态，瞬间实现认知优势。


    # 日本的品牌名称为什么都像英文?


    做品牌也是一种编码和解码。


    日本企业在全球化过程当中，有一个很重要，但常常被我们忽略的功夫：品牌名称。而中国企业走向世界的时候，往往会吃的一个亏也是：我们的品牌名称都是中国化的。


    外国人，尤其是欧美人，当他觉得特别陌生，品牌名称特别拗口的时候，自然就会产生一种排斥心态。这样的话，一个品牌，哪怕本身的产品质量、体验都很好，但是不自觉地承担了品牌的负资产。


    日本企业在让自己的产品走向世界的时候，做的工作就是：不让欧美人对他们的品牌名称产生自然的排斥。比如“SONY（索尼）”看起来肯定不是英文单词，有某种陌生感，但按照英文发音念起来非常顺畅，又有一种而且易见的熟悉感。我们意识里的“免疫系统”就立刻放松了警惕，让它进来了。


    # 刷卡：快速识别的认知优势


    在生活当中，这些看着很简单的事情背后还是一种认知：


