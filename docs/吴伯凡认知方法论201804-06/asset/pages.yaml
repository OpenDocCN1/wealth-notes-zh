  md: '# 天赐良机从何而来2 | 结果＝一连串的事件


    天赐良机从何而来2 | 结果=… ↓


    这是我们第一模块第七单元的第二节课。这个单元的主题是： 天赐良机从何而来。


    # 一个事件是如何形成的？


    # 1. “因”


    上一节课我们讲到了“归因谬误”，这里的关键字是“因”。


    汉语里“因”这个字的本字是有草字头的，是“绿草如茵”的“茵”，草垫子的意思。“茵”这个字里包含着中国人对于“因”的理解。


    比如我们看见眼前有一张草席，就叫它是“草席”，事实上，世界上没有草席，只有草。之所以能变成草席，是你把一半的草横向排列，一半的草竖向排列，让它们交织在一起形成了一张草席，这个东西就是“茵”。


    “茵”就是不止一个要素交织在一起呈现的样子。可以说，“茵”这个汉字里包含着一种古老的智慧，这种智慧比我们今天所说的“原因”更准确地表达了一个结果：一个事件到底是怎么形成的。


    # 2. “杠杆”


    大家还可以想象一下：在一片空地上，有一块大石头，一块小石头，不远处有一个木头杠子，最后还有一个你。


    上面的这四样东西只是要素，它既可以意味着什么，也可以说它完全不意味着什么，就是一个个对象摆在那里。但是，如果把这四个要素都编织汇聚在一起，就成了一种东西——杠杆。


    +   1. 对因素的变量认知不完备。很多的因素可能会逃出我们的认知范围，形成我们的盲点；

    2. 真正的“果”是由这些因素汇聚到一起以后产生的，我们常常忽略这个“汇聚”的过程。


    # 3. “因”与“果”


    # 结果＝一连串的事件


    康白教授是大连医学院一位德高望重的医学专家，他在国际上被公认为“微生态医学的泰斗”。


    # 总结


    我们在追溯原因的时候，常常只找到了一个因素，就会有两个误区：一个误区，我们称之为“盲点”，就是有“另外的”因素，甚至多个“另外的”因素导致了现在的原困；第二个误区可以称之为“盲链”，就是一个结果是所有这些原因交织而成的，而不是一个简单的叠加。


    吴伯凡'
