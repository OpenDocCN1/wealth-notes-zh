  md: '# 知行合一1|建立神经元之间的高带宽专线


    知行合一1|建立神经元之间的… ↓


    这是我们第一模块第四单元的第一节课，这个单元的主题是：知行合一。


    # 只发生过一次，等于没有发生


    前面的课程里我们讲到过一个观点：所谓的“认知”是神经元之间建立的一个固定连接。


    人有多少神经元呢？860亿个。我们常说“脑海”，实际上用“浩如烟海”都不足以形容这个数量。关于这个数字，还有个有意思的巧合：人类现在用各种最先进的技术手段观测到的星星数量也不过是850-860亿颗。从这个意义上来说，人的大脑真的是一个小宇宙。


    另外，这860亿个神经元中的每一个和另外一个的连接，都是相当随机、极其偶然的。


    这么说大家可能没有概念，举个例子。我们可以想想我们一天里，在公共汽车上、地铁上、地铁口、电梯里，以及去外面跑业务的时候，见过多少张脸？我们这一生又见过多少张脸？


    我想这一定有一个大致的平均数，可是这些脸上对你又有多大的意义呢？绝大多数的脸虽然你也见过，但如同不存在。


    在社交中是这样，在神经元上也是这样——只发生过一次的，等于什么都没有发生。


    再比如我们在网上闲逛的时候，刷手机、刷各种软件看过的信息，基本都是无功。你觉得你在获取信息，但那其实就是一次性的一面之交的信息，实际上跟你在街上随便看到某个人一样没有意义。


    # 密友圈与神经元


    再问一个问题，这一生中你能与多少人形成密友关系，做“死党”级的朋友呢？


    我相信，这个答案的数字与我们一生见过的那些面孔的数量相比，一定是一个小得不能再小的比例。一个正常人的密友通常不会超过5-7个，而密友的外围是朋友，朋友的外围是熟人，然后还有半熟人、陌生人，这呈现为一个同心圆结构。


    有意思的是，越是外围的人，更换频率就越高。比如陌生人，虽然都是陌生人，但你每天碰到的陌生人是不一样的；半熟人也会经常刷新和变换，熟人亦是如此。


    但是，密友圈子的更新频率很慢。在很长的一段时间里，你的那些密友仍是那些密友，偶尔会有改变，比如你接纳了一个新的密友，这就意味着你可能疏远了原来一个密友——它的总数量是非常有限的。


    判定自己是否有这样一个密友圈（死党圈），有一个经验化的检验标准：在你遇到重大变故、决策、选择的时候，你首先想到要求助的那个人就是你的密友。


    比如你突然需要一大笔钱，这个时候你会首先想到跟谁借钱？即使你把对方的电话调出来之后并没有接通，这一瞬间也已经显示了你跟对方的关系。


    人的神经元也是这样。要所有神经元之间都建立固定的连接是完全不可能的，就像我们不可能跟世界上所有的人都做密友一样。


    # “带宽”的规律


    所谓“认知”，就是一个神经元跟另外一个神经元的固定连接。这个连接不一定是物理上的，它是一种比喻——一旦你激活了这个神经元，另外一个神经元马上就活跃起来，好像它们是连在一起的。


    而且这里遵守一个规律——神经元之间的连接次数越多，带宽就越大，稳定性就越大。


    具体来说，神经元之间有一个带宽，如果是偶然的一次连接，这个带宽就很低，几乎不存在，那么你下次遇到同样情况就一点儿印象都没有；但如果它们持续建立连接，就相当于这个神经元和另外一个神经元之间形成了一根细若游丝的电话线。


    这根线虽然随时可能断掉，但只要你持续保持这样一种连接，这根线就会渐渐变粗、变结实。最终就会出现这样的情况：这个神经元一旦接受刺激，那边的神经元就会马上做出反应。


    那些瞬间能够把握本质、给出解决方案、完解解决问题的专家，正是形成了这种神经元与神经元之间的高带宽的专线联系。


    如果你有这种高带宽的专线联系，一说到某个东西，当别人还在茫茫的860亿个神经元当中“对对碰”的时候，你一瞬间就解决了。当别人不知道这个机制时，就会觉得你是个神人，是“福尔摩斯”。然而实际上，福尔摩斯也不过就是在他的大脑里拥有了一个高带宽的专线。


    # 习惯与刻意练习


    +   1. 习惯的力量


    在最近很流行的《原则》这本书里，作者达里奥反复提到了《习惯的力量》这本书。实际上《习惯的力量》讲的就是这样一个道理：习惯是一种高带宽的专线。


    有时候你出门，刚到楼下就想“好像门没锁”，等你再上去的时候，发现门是锁好的。为什么会出现这种 دنی呢？


    是因为在你反复重复的时候，神经元之间已经建立了极其固定的快捷方式，这是一种比“刷卡”还要快的反应方式，它以你的意识察觉不到的速度，把一连串的思维和行动在一瞬间完成了。


    这就是“习惯”。


    +   2. 刻意练习的秘密


    所谓“刻意练习”，就是反复使某些神经元之间建立固定、高带宽、你的大脑皮层没有意识到就已经下放到下丘脑的反应。


    能建立这样一种高带宽的专线是一件很值得庆幸的事情，它能大大提高我们的认知效率、决策效率、行动效率。


    由于它的速度非常快，致使它在本质上是一体的一一认知、决策、行动是一体的。在某种程度上，你就因此成为了高手、专家，成为了别人眼中具有特异功能的人。


    吴伯凡


    听完今天的课，大家可以问自己一个问题：我们一直在学习，但是我们的头脑当中是否建立了这样一种高带宽的专线？是否存在着另外一种情况——我们的学习不过是神经元的偶然连接，彼此之间只有一根细若游丝、低带宽、随起随灭的电话线？


    # 划重点


    +   1. 对于认知来说，只发生过一次的神经元连接，就相当于什么都没有发生。


    2. 那些能够瞬间把握本质、给出解决方案、完全解决问题的专家，就是形成了神经元与神经元之间的高带宽专线的人。'
