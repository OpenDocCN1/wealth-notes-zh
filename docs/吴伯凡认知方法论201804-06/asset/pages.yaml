  md: '# 知行合一4 | “知行合一”的本质


    知行合一4 | “知行合一”的本...


    这是我们第一模块第四单元的第三节课。这个单元的主题是“知行合一”。


    上节课讲到了“同步”，它是中國哲學史上非常重要的概念。懂得 了这个概念，我们就会对“知行合一”有一个比较清晰的了解。


    # “行”与“知”的释义


    # 1.“行”


    “知行合一”是王阳明“心学”的核心概念，从“同步”的角度看“知行合一”：“行”是“知”的一个同步。


    既然心外无物，物是心的产品，行动也就 是心的一种同步状态，你行动的效果、成 败都取决於心的状态。


    用王阳明的话说，“一念发动处即是行”——一个念头一旦发动起来，本身就是“行”。


    # 2.“知”


    这么讲似乎有点儿抽象，我们再说说“知”。


    “知”字，左边一个“矢”，“矢”是射箭的意思，右边一个“口”，“口”是目标。“知”就是射射箭达到了目标。


    在古代汉语中，“知”的意思有很多：


    +   感知。比如“春江水暖鸭先知”，水里游的鸭子最先感知到春江的水暖。这里的“知”是最常见的意义——了解。


    +   深切沟通。比如“知己”，如果两个人之间的关系用“知己”来形容的话，就证明他们是一种深切沟通的状态。


    +   掌控、管理。比如古代有这样的官职：知府、知州。这里的“知”虽然不是“知道”、“感知”的意思，不是朝廷派个人去感知那个地方，而是掌控、管理、运营那个地方。


    “知”的本来意思是“射箭时看到且达到了目标”，强调的是要正中那个目标。


    我们以前讲过“中庸”，“中”是不偏，“庸”是不易，说的也是射箭的事——箭射到最中间，射中了，这叫“中”；这次射中，下次还射中，这种不变的状态叫“庸”。做到“中庸”是非常难的。


    射箭表面上是个行动，但最后射中靶子的结果取决于你的“心”和“知”，这个“知”既是一种认知，更是一种行动。


    换句话说，射中靶子实际上是你内心真正知道了怎么射箭以后的一种同步方式，如果你的心是不知道的，那么是射不中靶子的——射中靶子本身只是一个同步的结果。


    # 知是未发动的行，行是已经实现的知


    我们以前讲的“认知”，本质上是一个行动、一个生产体系。我们的感知结果是我们感知设备的 一个呈现和实现而已。


    举个例子，一台单反相机和一个只有200万像素的早期数码相机拍出来的照片之所以不同，是因为它们的设备不一样，或者说，这两张照片是它们各自设备同步的结果——表面上是“行”的不同，实际上是“知”的不同。


    # 先知而后行，真的对吗？


    我举一个王阳明的例子来进一步解释。


    王阳明除了打仗之外，还有两样绝活：


    第一个是射箭。有一个太监以为他是一个文人不会射箭，为了羞辱他，和他比射箭。比赛的时候，王阳明气定神闲地拿起箭，不声不响三次连中靶心，就让那个太监很服气。


    “知道怎么写好是一种‘知’，这两者是不能分开的。它并不是先想好了怎么写，懂得了怎么写，再去写，而是在写的一瞬间，‘知’和‘行’同时发生了。或者说，纸上的书法就是书法家心里的书法的一个同步而已。


    > “知之真切笃实处，即是行；行之明觉精察处，即是知。知行工夫，本不可离。”


    # 认知+行=学+习


    回到我们本单元课程刚开始的时候，我们说到“所谓的认知就是在神经元与神经元之间建立一个高带宽的专线连接”。


    # “知行合一”的本质


    现在我们就很清楚了，所谓“的行动”就是已经形成的神经元连接在相应场景下的一种发挥而已。你“行”的品质取决于这种连接的带宽是否是专线；而这个“行”是否是高带宽、固定的连接，取决于你反复的“行”。


    “知行合一”应包含两个方面：


    +   1. “行”本身是“知”的一个同步的结果。


    +   2. “知”一旦有了“行”同步的情况，一个同步结果。'
