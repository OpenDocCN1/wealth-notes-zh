  md: '# 认知之树3 | 找到自己的“洞穴空间”


    认知之树3 | 找到自己的“洞... ↓


    这是我们第一模块第六单元的第三节课。这个单元的主题是：认知之树。


    在本单元前两节课里，我们讲到了信号和噪音的关系："信号"是能够形成内在关联的有意义的音符，是最小的声音和信息单元；"噪音"是彼此之间没有关联，陷入到混沌、无序状态的声音。


    信号和噪音并不仅仅指声音，以声音、文字、视觉等为符号表征的信息，都可以叫"信号"。


    # 信号救赎：中国庙宇&西方教堂


    认知的形成，无非是在众多的噪音当中生成信号，屏蔽和排除噪音。可以说，人类的思维史和认知史都是用各种方式排除噪音，从中实现"信号救赎"的过程。


    首先是宗教上，比如中国的佛教有一句话是"天下名山僧占尽"——有名气的寺庙都在山上，远离人声喧杂的地方。从平面上看，山野是远离人声鼎沸的地方的；从立体的意义上看，从山脚到山巅，又增加了一个隔离噪音的维度。


    佛教寺庙的选址背后包含着一种努力：排除噪音（降噪）。


    而西方的教堂不一样，一般是在人流量比较大的地方。这种选择是一个结果而不是原因——在西方，无论村庄还是城镇，都是以教堂作为定位点的，教堂周围形成社区。


    但进到教堂以启，你会发现里面的种种设施，也是一种对外面世俗世界的屏蔽，用各种光和声音让这个空间跟外面的空间形成明显的隔离感，和平常的生活形成明显对比。


    中国古代的文人和知识分子都有一个诉求：如何降噪？是入世还是出世？假如是入世，那么如何要以一种出世的心态去入世？


    陶渊明在《桃花源记》里就设想了一个与世俗世界完全隔离的状态，当然，他也意识到那只是一种幻想，自己只能被迫生活在人世间。这个时候，就不能诉之于物理的方式，而只能诉之于心理的方式了。


    "结庐在人境，而无车马喧。问君何能尔？心远地自偏。"这几句诗就非常典型地体现了陶渊明的这种态度和方法：我被迫在一个人声喧杂的地方盖了房子，住在那儿，但是我听不见车马的喧闹。为什么呢？因为地虽然不偏，但心一远，地也就一个很偏僻的地方了。


    # 笛卡尔和他的“洞穴空间”


    中国的知识分子追求的一直是"如何建立防火墙、隔离带，形成自己独特的降噪防噪空间"，很多的西方知识分子也同样如此。


    比如被称为"现代哲学之父"、"现代数学之父"的笛卡尔（René Descartes）说过，"人类之所以有那么多欲望，那么多邪恶，都是因为很多人不愿意安静地待在自己的家里。大家都愿意出去聚在一起，制造各种喧哗与骚动，导致了各种错误、各种骚乱，甚至邪恶"。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_62_0.png)


    笛卡尔认为，高尚的生活是找一个独属于自己的空间静静待着，在这样的空间里听到真正的信号——在他看来就是上帝的声音，神界的声音——然后穿越纷繁复杂的表象，破译这个世界的密码，直击这个世界的真实图景和真实算法。这也是他哲学的一个基本主张。


    +   1. "解析几何"的发明和"笛卡尔式"视野


    笛卡尔发明了"解析几何"：用代数的方法解决几何的问题。几何图形是你看得见的"表象"，但它之所以形成"点线面"的关系，实际上是一系列的数字和符号的运算。


    笛卡尔发明"解析几何"跟他的个人经历和生存状况密切相关：他有两样东西是与生俱来的——体弱多病和家里有钱（继承了一大笔遗产）。这两个条件决定了他有一种一般人没有的特权——可以长时间躺在床上思考问题不用干活。


    所以，疾病的限制加上金钱的自由，使得笛卡尔可以远离喧器的世界，进入到一个在他看来更真实、更纯粹的世界。


    有一天，笛卡尔躺在床上，突然看见天花板上有一只蜘蛛爬着爬着掉下来了，悬在房间里。然后蜘蛛就沿着它的丝往上爬，又爬到了天花板上，再继续沿着天花板爬的时候又掉了下来。


    看到这个情形，我们可能觉得这不过是一个简单乏味的场面。但是笛卡尔就开始思考：如何找到一个既简单又有概括性的函数式或方程来准确计算、标明这个蜘蛛在房间的位置——简单地说，有哪几关键变量能决定蜘蛛在房间的位置。


    经过思考以后，笛卡尔发现地面和墙三角形成的三条线——地板上两条交叉垂直的线，加上一条沿着两面墙相交点的垂直的线，这三根轴就能准确标明蜘蛛在这个房间的位置，而这三根轴就是X轴、Y轴和Z轴。一个几何问题就这样被笛卡尔转换ኣ一个代数问题。


    我们从这个故事里看到了"笛卡尔式"的视野：我们面对的世界至少是两重的世界，一重是"表征"的世界，也就是我们能够感知的世界；另一重是我们感知不到，但可以用理性去接触的世界，而且那重世界是更根本的世界。


    只有透过千变万化的现象找到不变的算法、方程式，才可能认识这个世界。如果你滞留在一个千变万化的"现象世界"里，接触的材料再多、看到的现象再多，对于增进认知也是没有作用的。


    +   2. 在"过度互联的世界"寻"洞穴空间"


    要获得真切的认知，就需要找到一种屏蔽现象和噪音的独立空间，否则就会被各种各样的噪音所绊架和裹挟，被混淆视听，最后，整个思维都会处于一种混沌或者说是"熵增"的状态。


    想要从混沌到有序，就必须要在这看似纷繁复杂的现象背后，找到一个具有统摄性的，万变不离其宗的"宗"。用今天的话说就是，接触各种各样的现象和没有相关性的信息的过程叫"互联的过程"，甚至可以叫"过度互联的过程"。


    我们需要找到一个能屏蔽噪音和过度互联的信息，给自己提供认知的空间，在这个空间里，我们能通过对世界进行垂直纵深式的思考，发现具有统摄性的规律、方法、原则、算法——这个空间就是"洞穴空间"。在笛卡尔看来，没有这样一个"洞穴空间"，认知是无法实现的。


    在信息超载的时代，最不稀缺的是信息，而最稀缺的，是洞穴空间。


    我们说我们现在也有一个自己的独立空间，也可以躺在床上不出门，但现在的"不出门"和出门是一样的，因为这个"洞穴空间"跟外界充分互联了。


    《道德经》里讲"不窥牖，而知天下"，说的是透窗户都不看就能知道天下的变化，我们今天不看窗户也要看Windows，不出门也是在玩手机，很难拥有笛卡尔所拥有的那个特殊的"洞穴空间"了。而如果没有这样一个"洞穴空间"，达到深度认知或者"深思"是非常难的。


    在今天，我们面对的问题是"互联与深思的矛盾"，过度互联会越来越吞噬甚至完全消灭我们的"洞穴空间"和洞穴时间。


    德鲁克说，"如果再过一百年、二百年来看我们今天的这个时代，真正引人注目的不是各种各样的技术，而是人类处理信息、获得认知的能力——一直没有变化，但人类接触信息和接触世界的机会呈指数级的增长。


    在这样一个反差当中，人类如何作选择，如何作决策，如何避免自己的认知变得浮皮漫草、随波逐流，是我们今天所面对的。'
