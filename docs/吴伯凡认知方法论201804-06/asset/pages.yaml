  md: '# 生态位与选择压3 | 超越卡路里的认知竞争


    生态位与选择压3 | 超越卡路。


    这是我们第一模块第十单元的第三节课。这个单元的主题是：生态位与选择压。


    # 师徒制、工匠精神和全民皆兵


    上节课我们讲到，富士康的模具工人和瑞士的手表工人之所以具有“非凡的能力”，和一种特殊的教育流程有关——师徒制。


    我们经常说“师徒如父子”，这是“师徒制”温情的一面，还有极其严苛的一面——师父具有无上权威，可以随便打骂徒弟。在这种严苛的限制条件下，徒弟们的能力不断精进，这成为了他们不断“进化”的前提。


    我们注意到，那些具有“工匠精神”的国家都有一个共同的特点：简单地说，就是“军事化”，或者“类军国主义化”。“军国主义”很难听，我们不妨换成另外一个词——全民皆兵，即，整个国民的生活都带有军事化的性质。


    德国、日本，甚至瑞士，都有一种悠久的军事传统。


    从普鲁士到“条顿骑士团”，德国文化传统里都包含着军事化的特点。阿尔迪超市（ALDI）之所以在德国吃得开，是因为德国人的生活方式带有“准军事化”的特点，要求的生活品类不多，类似于军队后勤供给予的方式，这就让SKU（Stock
    Keeping Unit）很少的阿尔迪能够在德国蓬勃发展。


    日本有久远的武士传统，人的行为受到各种严格律条的制约。这种制约有两方面：“他律”和“自律”。外在的制度在严格地约束你的同时，又有一种自律的传统，也就是在没有明显外在约束的情况下，还是要根据某些严格的内在标准来行动。


    瑞士也是一个“全民皆兵”的国家，一直有着“禁卫军”的传统。


    军事化、类军国主义、师徒制这些都还只是表面现象，它们的实质仍然是我们说的“选择压”：生活和工作当中始终是面临选择压的，这种选择压让行为和认知方式都遵循一种“非如此不可”的逻辑。这种严苛的约束，是把自然界的严酷性转化到社会和文化当中。


    自然界的严酷性表现为“只有这样你才能活下来”——这是自然选择的逻辑，而人类文明却是往前发展，整个社会的残忍度就越低。


    # 文明的进步降低了人类的选择压


    《人性中的善良天使》这本书讲的就是这个道理：人类文明的进程其实就是残忍度的降低。而这种残忍度的降低，应该说是人类的福音，它意味着各种酷刑的消失，各种严格的等级制度的逐渐瓦解，人与人之间的平等性越来越明显——与此同时，社会分工也越来越发达。


    在史前时代，一个人只要有身体和认知上的缺陷就很难活下来。因为在毒蛇猛兽遍布的环境里，任何一种能力的缺失，都会让你丧失生存的机会。但社会发展导致了分工，比如你会记账，虽然腿脚不便利，但也可以找到一份饭碗。在现代社会就更是如此了：你实在没有什么特殊能力的话，也总能找到一个不会挨饿的饭碗。


    这就意味着“文明的进步给每个个体的选择压降低了”——你可以这样，也可以那样，或者说你的选择基本不是生死攸关的。


    但问题在于：竞争仍然存在。


    人和动物最大的不一样，不仅仅是在获取热量方面——人类的竞争越来越表现为超越卡路里的竞争，而动物只有“饿肚子”和“不饿肚子”两种状态。人类进入到一种新的竞争游戏当中，这种竞争所要求的是更加细分的认知能力。


    文明让我们在很多时候不再遵循“全或无”的游戏规则，人类的生存空间呈现为某种灰度——黑和白之间出现一个广阔的空间，这里的差别只在于不同的灰度。在这样一个灰度空间里，一方面意味着竞争消失，大家都不会饿肚子，另一方面，又意味着竞争更加激烈。


    # 选择有选择压的环境


    在这个广阔的灰度空间里存在着更加细分的生态位，用前面的例子来说，如果你对一个零件或者模具微米级的差异没有感知的话，你就做不了模具工，就不可能成为优秀卓越的手表工人。


    这就是我们文明社会的竞争逻辑：从总体上说，每个人都拥有普遍享有的基本收入；另一方面，“普遍享有的基本收入”不构成竞争的主题，在超越“普遍享有的基本收入”之上，存在着越来越激烈的竞争。这也意味着：在自然选择里起作用的“选择压”仍然在起作用，甚至会变得更加严苛。


    你丧失了生存空间，不意味着你没有饭吃，而是在这种“超越基本收入/卡路里”的竞争中，你变得可有可无。“可有可无”是结果，原因是你没有找到一个有选择压的生态位——你可能处在一个“不是生态位的生态位”上。


    总结一下就是：


    +   1. 人之所以陷入到“不是生态位的生态位”，成为“可有可无”的“不是物种的物种”，也是一种选择的结果——你选择了一个没有选择压的环境。


    +   2. 不管这种严苛的约束来自于内在还是外在，是自律还是他律，其实际都是把我们置入到一个真实的生态位当中。


    +   3. 无论自律还是他律，都是把自然选择当中严苛的约束设定为自己的生存环境，让自己在选择压中进化自己的能力——这个过程就是“学习”。


    文明的进步和社会的发展给了我们提供一个普遍享有的越来越大的公共舒适区。在这个舒适区里，人不需要作选择——从动物的角度来看，人类已经进入了不愁吃、不愁穿的天堂。这个舒适区，或者“人类共有的天堂”最大的特点就是：不需要选择，怎么都能活。


    但就像我们之前课程讲过的，这个“像子宫一样”的舒适区其实是个让我们没有痛感的监狱或者牢笼。你在这个不需要选择的幻象之外还有一个严峻的现实——必须要选择。用法国哲学家萨特的话说，“人不得不选择，你不选择就是选择了不选择”。


    在一个选择压似乎已经消失，不需要我们去作选择的时候，我们之所以仍然要作选择，就是选择让自己不要堕入到这样一个普遍享有的舒适区，进入到一种舒适服被淘汰的状态。


    以前我们提到的很多概念和说法都和这种选择有关，比如“火力侦察”、“认知即痛苦”……所有这些说法也可以说是一种方法：在所有的认知方法中，最重要的方法就是要进入到一个有选择压的地方。


    吴伯凡


    大家可以对自己的认知状态做一个评估：我是是否在一种认知状态下，或者说，我是否是atin一种有严苛约束、清晰选择压的状态下生存？你选择有了选择压的生存状态，你就已经开始了你的认知。


    我们也可以思考一个问题：如何提高我的认知，我是否真的处在一种催生认知的状态里，或者说，是否处在一个真正有选择压的生态位里？


    # 划重点


    > 文明的进步降低了自然界的选择压，但是并没有减少竞争，新的竞争游戏在超越卡路里的层面上展开，要求的是更加细分的认知能力。换句话说，竞争可能更苛苛了。


