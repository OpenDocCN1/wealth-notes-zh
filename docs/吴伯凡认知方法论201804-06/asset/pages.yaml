  md: '# 生态位与选择压4 | 认知的“宝葫芦”存在吗？


    生态位与选择压4 | 认知的...


    这是我们第一模块第十单元的第四节课。这个单元的主题是：生态位与选择压。


    经常有同学问我：


    能不能告诉我一种“不管我现在在做什么，只要拿到这个方法就可以马上用去的”认知方法？


    能不能给我推荐一些书，让我看了马上就能如虎添翼，对我的工作和生活大有改进？


    我们每个人，包括我自己，都期待这种方法：年轻的时候，我也希望某个高人给我指点一下，或者告诉我几本秘笈，让我立即就能出类拔萃、技压群雄。但我一直也没遇到这样的高人，也没找到这样的秘笈。


    后来，我终于发现了这个“秘笈”，但它不是任何人告诉我的，而是我在痛苦思考，百思不得其解的情况下，偶然碰到的某个人、某本书，突然让我觉得“这个人/这本书对我太有用了！”


    之所以觉得这个人/这本书有用，是因为我在之前，经历了大量痛苦的挫败以后，产生了一种内在的，甚至连我自己都还没意识到的渴求：一旦这个东西出现，我就马上知道“这个东西对我有用”。


    对于创业或者经营企业的人来说，找到一种特别灵验的经营模式是每个人都需要的。但到底有没有哪个企业是在无意中碰到一种商业模式，马上发现很有用的呢？我们从几个典型的案例里不对看：认知到底是在先，还是在后。


    # 经典案例1：搬出来的Dell商业模式


    戴尔公司（Dell）在二一二十年前是一家“神一样”的企业，当然，它后来衰落了。但在当时，戴尔的模式，神到“整个PC行业只有1.5%到2%之间的纯利，而它能够达到8.5%，相当于同行企业的5倍”。


    戴尔的规模增长惊人，导致很多企业都想去学它的模式，但没有一家学会的。惠普当时花了200多亿美金，收购“康柏”成为了行业老大。但是这个规模优势持续不到一年，就又被戴尔超过了。


    很多人觉得，戴尔的这个模式“太神奇了”：


    +   1. 没有资金成本——用的钱都是用户的预付款；

    2. 按需定制——没有存货，也就没有仓储压力；

    3. 没有元器件积压——不会出现产品还没有生产就已经贬值的现象。


    如果你了解戴尔的创业史，就不会奇怪它的创始人迈克尔·戴尔（Michael S.Dell）是怎么发现这种商业模式的了。


    戴尔这种神奇的商业模式，跟迈克尔·戴尔本身的生态位密切相关——他是一个在大学宿舍里给同学搬电脑的人。同学需要什么电脑，先把钱给他，让他去市场上采购元器件，然后给同学组装一台电脑。在不需要资金，也不需要仓储的情况下，迈克尔·戴尔就能够获利。而且，他搬出来的电脑更符合使用者的个性化需求，价格还远比品牌厂生产出来的电脑便宜。


    可以说，戴尔成为“财富500强”的商业模式，是诞生于迈克尔·戴尔在大学宿舍搬电脑的时候自然采取的商业模式，这并不是他坐在宿舍里想出来的。


    这也就是我们这个单元特别想跟大家分享的一个观点：生态位决定智商和认知，而不是先有了一种认知，再凭着这种认知选择了一个生态位。


    # 经典案例2：“不懂技术的CEO”拯救了IBM


    我们知道，IBM在上个世纪九十年代初的时候陷入破产边缘，情急之下，公司雇用了一个“根本不懂技术”的CEO——郭士纳（Louis V. Gerstner）。


    他刚上任的时候，开会简直是一场灾难——所有高管说的都是“黑话”，郭士纳完全听不懂。而就是这个“IBM历史上唯一一个不懂技术的人”拯救了IBM，把IBM从死亡线上给拉了回来。


    郭士纳是如何找到让IBM起死回生的商业模式的呢？在上任以后的第一次记者招待会上，他对记者是这样说的：


    > “站在你们面前的这个人是IBM历史上唯一一个不懂技术的人，你们都会怀疑我的能力，确实这是我的弱势——我不懂这个行业。但是，我有一种IBM历史上所有CEO都不具备的东西——我是IBM十一年的客户，我太知道IBM的问题在那里了。


    在我做客户的时候，我甚至设想过IBM应该和不应该怎么做——这是IBM的CEO从来不会思考的问题。所以，今天就凭着我是IBM十一年客户的这个经历，我来做IBM的CEO。”


    后来的事情我们都知道：郭士纳大胆让IBM进行转型，把一家提供电脑软硬件的公司变成了一家从事服务的公司，让IBM获得了前所未有的成功。


    # 经典案例3：“照相术”培养的艺术大师


    再给大家分享一个艺术史上的例子。


    我们知道毕加索是现代艺术当中的“大师中的大师”，他通过自己那些稀奇古怪的画，在有生之年就享受到了自己的艺术创作成果，而不是像梵高那样只有在死后才红起来——如果你不了解他的话，自然会问，“毕加索是怎么别出心裁找到这么一个路徑的呢？”


    毕加索的故事特别值得正在从事转型的企业领导者关注：毕加索的父亲是一个画家，准确地说是一个画匠，他子承父业，很小的时候就跟着父亲学画画，用毕加索的话说，“在我十四五岁的时候就完全精通了十四、十五世纪文艺复兴时期那些古典画家的所有技能”。


    如果不是因为欧洲绘画界遭遇的那场灾难，毕加索可能一直就是一个平庸的画家，或者是一个还不错的画古典画的画家，甚至可能只是一个画匠而已。但是，这个时候发生了特别大的事：“照相术”越来越成熟了，很多画家突然发现自己没饭吃了一——就像今天一样传统企业面对互联网冲击的时候，突然发现自己没生意做了一样——毕加索原来所处的生态位趋于消失，即使没有完全消失，基本上那个圈子也是混不下去，没有什么生存机会了。


    毕加索遭遇到了клон必须做的选择：继续待在这个地方，只有饿死；或者，找到一种新的生态位——为整个艺术界寻找一种突破口，完美再现绘画这种方式。


    这个时候他看到了一一些看上去很狡猾，介乎人鬼之间的古怪非洲面具，那些面具散发出一种神秘的超现实意味，让正在寻找绘画出路的毕加索突然感知到了一种“超越这个扭曲的怪异形象之上的神秘超现实意味”。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_97_0.png)


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_97_1.png)


    特定的处境，特定的场景，特定的生态位，使得毕加索获得了对某种东西的感知和认知，他把自己的这种感知和认知用绘画的形式表现了出来，就成了他后来的立体主义。


    # 总结


    不管是戴尔和IBM的商业模式，还是毕加索的转型，都说明一个事实：


    +   1. 不是先学会了游泳再下水的；

    2. 不是先有认知再去行动的；'
