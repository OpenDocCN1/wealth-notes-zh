  md: '# 知行合一3 | 同步：云的状态决定端的状态


    知行合一3 | 同步：云的状态...


    这是我们第一模块第四单元的第三节课。这个单元的主题是“知行合一”。


    # “无所不在的计算”


    上节课结束的时候我给大家提了一个问题：为什么有些人觉得他可以改变他的处境，但是相同的处境却一直伴随着他？环境好像是变了，但命运、场景一直没有变。


    解释这个现象之前，我给大家分享一个计算机科学里的概念：Ubiquitous Computing——无所不在的计算。


    这是上个世纪九十年代，施乐的首席科学家Mark Weiser提出的一个影响深远的概念。


    所谓“无所不在的计算”就是说，计算可以发生在任何时间、地点，而不是像桌面电脑时代，需要在规定的时间和地点发生。这种技术假设的背后是网络计算，更准确地说，是移动终端和云计算。如今它们已然是我们司空见惯的一种技术现象了。


    举个例子：有一种游戏，在终端种上菜，过了一天以后，菜长出来或者被偷掉了——这段时间你没有进行操作，但计算一直在进行，这就是一种“无所不在的计算”。


    # 同步：端的状态取决于云的状态


    “无所不在的计算”这个概念还和另外一个概念有关——Synchronization，同步。


    十几年前，我曾对“同步”这个词百思不得其解：在我用iPod的时候，我发现一个让我非常烦心的事情——我想把一首音乐给删掉，但是在iPod上是删不掉的；或者我想在iPod里直接加上一个我喜欢的歌或者一张照片也不行，我必须要把这首歌曲、这张照片放到自己的电脑里，用苹果专门的软件iTunes存储和编辑以后，再通过iPod和电脑的连接，才能把这首歌曲和这张照片传输到我的iPod上。


    简单地说：你不可能通过改变终端这种方式，让你的终端有所改变，而必须要改变终端背后的支撑系统，你的内容端才会自动发生改变。


    如今无论是iCloud还是QQ同步助手，都已经替代了当年电脑的功能，因为现在内容已经存储在云端了。买了一部新手机以后，你只要接通iCloud，一个新手机立即就变成了个“旧”手机，连墙纸都是原来的。这就是“同步”。


    讲到这里，大家应该对上节课的问题有所领悟了：端的状态取决于云的状态，而云是一个无所在又无所不在的存储和编辑中心，它始终决定着端的命运。


    当新的端出现，或者说新的环境、事件出现的时候，云的状态会自动同步到新的端和新的世界里。


    # 不同领域的“同步”


    +   1. 佛教的“境由心生”


    “同步”是一种哲学观念，起源于古希腊，但这种哲学观念又不只限于古希腊——在我看来，把这个观念阐释得最具体、最丰富的印度佛教。


    佛教哲学认为：人的外在世界，也就是所谓的“境”，是由“心”产生的。用我们刚才的话说就是，外在世界的状况是由“心”这个存储和编辑机构同步出来的一种状态。你想改变境就必须改变心。


    佛教讲的“相由心生”和“境由心生”说的就是“同步”这个概念。


    事实上，上节课提到王阳明的“心学”，在很大程度上也是受到了佛教里“同步”这个概念影响的。


    +   2. 离婚基因


    我以前曾经讲到过一个概念：离婚基因，它是催产素受体基因变体。


    瑞典一个科学家通过大量研究发现，个体身上的催产素以及催产素的受体状况，决定了这个人跟别人合作的系数大小。如果一个人催产素数量和受体数量都很少，他就很难跟别人进行持续的协同和合作，当冲突出现时，他常常是以终止这种关系的方式来解决问题的。


    而事实上，问题根本没有解决，结果就是跳槽之后持续跳槽，离婚之后持续离婚。


    人在选择配偶、公司在选择员工的时候，都要留意对方身上有没有、有多少“离婚基因”。如果这个基因非常明显，未来所有的东西已经在事先发生了，以后显现的东西不过是这种基因的同步罢了。


    +   3. 《旧约》中的同步


    我们刚才提到在希腊和印度都有这种“同步”的观念，其实在其他文明里，“同步”的观念也很明显。比如犹太人的《旧约》箴言篇第23章第7节有这么一句话：


    > 一个人怎样思想，他为人就是怎样。

    As a man thinketh in his heart, so is he.


    与之相通的是第4章第23节中的一句话：


    > 你要保守你的心，胜过保守一切，因为一生的果效，是由心发出。

    Keep thy heart with all diligence; for out of it are the issues of life.


    听完这一节课，我们知道与王阳明的“心学”相关的一个概念——同步。


    在生活中，“同步”的现象很普遍，比如我们费了很大的劲儿做一件事情，本以为是一件新的事，但在别人看来，还只是在做一件“旧事”。就像爱因斯坦说的“永远在重复同一件事情，却一直盼望不一样的结果，这叫心智错乱”。


    举个例子，我们讲过“消费升级”的概念。有人觉得有钱了，觉得自己的品位也应有所提升，就咬牙踮脚买了一件很能代表他“消费升级”的衣服，但朋友们看到这件衣服的时候，都不约而同地认为，“这不就是你原来的衣服嘛！不就是你从柜里随便拿出来的一件衣服嘛！”


    出现这种情况就是因为，即使你有了钱也付出了成本和代价，但你的认知没有升级，消费也就没有升级。


    # 划重点


    +   1. 如果说认知是一个终端，改变认知的唯一方式就是改变背后的支撑系统，你不可能通过直接改变终端的方式让终端发生改变。


    +   2. 佛教讲“境由心生”，认知这个终端的支持系统就是“心”，改变认知，就要从“心”开始。'
