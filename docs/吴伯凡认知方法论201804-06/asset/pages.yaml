  md: '# 生态位与选择压1 | 生态位决定认知


    这是我们第一模块第十单元的第一节课。这个单元的主题是：生态位与选择压。


    # 月相表：航海者的刚需


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_94_0.png)


    大家可能都知道这种“月相表”：一般比较高端的手表，除了三个指针之外，还有日历和“月相”。简单地说，“月相”相当于“阴历的日历表”，你能在这块表上，看到月亮从上弦月变成下弦月的整个过程。


    为什么手表上会有“月相”呢？我们知道，对手表最先有刚需的一群人是航海者，他们必须要知道潮汐的变化——在某种程度上，潮汐变化对航海者是生死攸关的事情——那么，除了要知道现在的时间是几点，现在的日期是几号以外，航海者也要知道现在是“阴历初几”。正如海明威说的，“永远受月亮影响的，一个是潮汐，一个是女性”。


    我们生活在现代的人，其实对月亮没有太多的感知，除了正月初一、五月初五、八月十五，这些别人告诉你的日期以外，很少有人知道今天是“阴历初几”。但如果你生活在偏远的农村，就自然会使用阴历。


    记得作家韩少功讲过，在他隐居的地方，现代文明虽然已经传到那个地方，村里的青年们已经穿着双排扣西服，骑着摩托车了，但他们一张嘴说今天的日期，往往说的还是阴历几号——农村的时间周期是很容易用月亮来标识的，而我们生活在城市的人，甚至都看不见月亮在天上。


    这就说明了一个问题：我们选择的认知世界的方式，跟你所处的生存的位置有关，或者说，你的生存跟某种东西息息相关的时候，这种东西就自然成为了你的认知对象。反过来，这个东西跟你的生存没什么关系的话，你对它就是缺省和忽略的。


    这也从另外一个侧面说明：我们对世界的认知不过是一种生存手段而已。


    # 物种的本质=生态位的表达


    我们本单元要讲的核心概念和“生态位”有关。


    说到“生态位”，我们往往想到的是一个物理意义上的位置——你生活在这个位置上，他生活在那个位置上……而“生态位”的本质其实是“生存的要素”。


    # 特定的生态位决定了特定的物种和认知


    我们以前讲过蝙蝠，它具有回声定位的能力：蝙蝠发出超声波，然后超声波反射回来，它根据反射的时间和速度，就能准确识别前面目标物跟它之间的距离。


    # 预告：“第六感”是“剩余概念”


    辽沈战役有一个细节：林彪在指挥这场战役的时候，发现国民党军的动向发生了某种变化，他说了一句话，“我可以肯定，蒋介石到了沈阳”。周围的人觉得很奇怪，“你怎么知道蒋介石到了沈阳呢？”当然，后来发现蒋介石果然到了沈阳。


    +   1. 物种的本质是生态位的表达。\n2. 特定的生态位决定了特定的认知。'
