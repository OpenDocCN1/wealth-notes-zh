  md: '# 认知退化与格物致知2 | 聪明人如何避免犯蠢错误？


    这是我们第一模块第五单元的第二节课。这个单元的主题是：认知退化与格物致知。


    上节课我们提到“锤子”这个说法：你手里拿着一把锤子，看什么都像钉子。


    这个说法虽然有点儿粗俗，但它跟认知理论的很多概念相关，比如以前讲过的“单环学习”，就是手里拿一把锤子，什么事情都想用这把锤子来解决，一旦遇到解决不了的问题，只会怀疑自己的锤子分量不够大。


    还有“熟练的无能”这个概念，说的也是“锤子”：你手里拿把锤子，要得非常地好，但实际上，你眼

    前碰到的事情根本没办法用锤子解决，这就是“无能”；而你锤子要得特别好，表现出一种很熟练的状态，就成为了“熟练的无能”。


    # 格物：认知的起点


    # 1. “格物”的概念


    国学里有一个说法叫“格物致知”，是中国传统哲学里一个很重要的认知概念：你要获得知识，就要“格物”——格物致知，正心诚意，修身齐家，治国平天下——“格物”是认知的起点。


    但是你要是认真读过国学的话就会发现，“格物”是一个众说纷纭的概念，不同的人对它有着完全不同的解释。


    西学传到中国的时候，我们自己本来没有这门学问，我们就要用自己的概念来翻译西方学科的名称，于是就出现了很多我们今天看来有点儿滑稽的翻译，比如说“社会学”最早翻译成“群学”，“逻辑学”翻译成“明学”，“物理学”就被翻译成了“格致”或者“格致学”。


    为什么把物理学翻译成“格致”呢？大概是因为我们通过“格物”能达到某种知识——格物致知，所以，物理学就叫“格致学”了。


    而对于“格物致知”比较通行的解释是：所谓“格物”，就是对各种各样纷纷复杂的事务进行分类整理，让它们各归其位，形成一个有条理的整体性知识。就像书架上有好多的格子，把很多书籍整理好放在不同的格子里，这是“格物”。“格物”然后就能“致知”。


    应该说，这种解释是符合现代认知理论的。


    # 2. “格物”的陷阱


    我们前面讲过，认知是一个产品，是我们用我们自己的内在设备去加工外物的材料，形成的一个相对成体系的、完整的、有条理的知识。这可以说是认知的普遍规律，但是，这里也包含着某种认知的陷阱。


    现在，我们一起来看看下面这张图：


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_52_0.png)


    刚看到这张图的时候，你可能不知道图上是什么，会产生各种各样的想象。


    现在，我可以告诉你：这张图是一个岁数比较大的男人的侧脸，他的手托在自己的下巴上。此时，你的脑海里是不是立即就生成了一个图像？当你再次看到这张图的时候，会一下子就看到一个老男人的侧脸，而其它的你就看不到了。


    一旦一个框架、格子在你内心中形成，外在的各种可能性就会固化，你的想象力、判断力都会被局限在这个框架里。


    像这样的例子在生活中比比皆是：你和一群小伙伴去郊外看云。开始的时候，你看见的是没有什么规则、奇形怪状的云，但当一个人说“那朵云像一头狮子”的时候，你的认知就好像被他的话贴上了一道符，再也无法无视眼前的“狮子”云了——这就是我们认知本来的特性，它的好处是避免了无谓的能量消耗，以最快的速度过滤那些不相干的信息，形成一个有价值的认知。


    这个过程有点儿像刚才：将外在的感知材料纳入到我们既有的认知框架，它的优点是提高了认知的效率，缺点是固化了我们的认知，减少了我们面对复杂现象产生的焦虑。


    我们认知的特点是“好逸恶劳”，不喜欢停留在焦虑区，因此，我们的认知总是受到一种像地心引力一样顽固的诱惑——回到一种舒适状态。前面的课程里我早就说过：这种子女般的母体状态，就是一个监狱，也是一个陷阱。


    # 最聪明的人犯的最愚蠢的错误


    举个例子：有 一家著名的银行，准确地说，是有一家已经消失的著名银行——雷曼兄弟，这家公司在2008年的金融危机当中倒闭了，但很有意思的是，在倒闭之前，雷曼兄弟公司聘请了一家咨询公司来给他们下诊断、提出建议。经过一段时间的研究，这家咨询公司给雷曼兄弟公司的所有高管汇报了他们的调查结果以及建议。


    咨询公司得出的结论是：在不久的将来，有几家银行会消失。雷曼兄弟的老板理查德·福尔德表示这个预测不错。


    但是咨询师接着来说，“雷曼兄弟公司如果还执行现在的经营策略，给大量客户放款的话，未来将会出现亏损”。这个咨询师的潜台词可能是“雷曼兄弟公司如果不悬崖勒马的话，很可能也会倒闭”。


    尽管咨询师说得很含蓄，福尔德和他的同事们还是对这个结论大摇其头，认为“这完全不可能，我们这个公司一百多年了，这个预测简直是太离谱了！你们这种咨询公司太不靠谱，多谢你来这里给我们提供建议，但是我们是不会付你钱的”。


    这可能是雷曼兄弟公司犯过的非常大的一個错误，而且很可能是他们犯的最后一个错误，因为很快地，这家公司就倒闭了。


    这件事情之后，“事后诸葛亮们”都觉得福尔德这个人太差劲了，那么宝贵的建议，能够救公司一命，他竟然不听。但大家现在可以想一下，如果是我们处在那个位置的话，真的能比福尔德做得好吗？


    福尔德当然是希望雷曼兄弟能够永远经营，兴利除弊，化险为夷，否则他请咨询公司来干吗？但是，他为什么又坚决拒绝了咨询师的建议呢？因为他已经形成了非常固定、明晰的认知框架——福尔德由衷觉得咨询师的结论不可靠。


    我们不能简单地把福尔德的行为归结于他的情绪化和自命自尊，我相信福尔德心里一定有一个关于雷曼兄弟的、非常明确的未来的看法。而咨询师的结论与他的成形系统的看法之间的反差如此之大，使他由表认
    为这个咨询师不可靠。


    而他形成的那个结论，我相信也是有大量事实来支撑的——福尔德的结论也是“格物致知”的结果。当你心里有这些格子的时候，外在的现象就会不请自来，在你不知道的情况下已经占据了这些格子——你的内心形成了一个非常完整的结论。这种认知的结果是坚硬性的。


    那么，我们如何能够避免这种“最聪明的人犯的最愚蠢的错误”呢？


    有一点是明确的：面对这个复杂的世界，证据从来不缺乏，关键是你的认知框架能容纳吸引什么样的证据。


    观点与观点之间的冲突，并不是证据的冲突，而是认知框架的冲突。


    要避免犯灾难性的认知错误，我们要学会用一种侦察兵，而不是司令官的观察方式来看问题——这就是我们下一节课要讲的内容。


    吴伯凡'
