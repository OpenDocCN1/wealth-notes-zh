  md: '# 生态位与选择压2｜有选择压才有进化


    生态位与选择压2｜有选择压。↓


    这是我们第一模块第十单元的第二节课。这个单元的主题是：生态位与选择压。


    # 富士康不为人知的竞争实力


    我不久前偶然碰到了富士康的副总裁，郭台铭先生最信任的手下——徐牧基先生，他和我说到了富士康不为人知的一种竞争实力。


    这要追溯到富士康在大陆办厂之前，他们在山西晋城——郭台铭的老家做的一件事。


    郭台铭刚来大陆的时候，很多人都让他赶紧办厂赶紧开工，但郭台铭说，“要把一件事情真正做成、做大，必须从根子做起”。他在山西晋城办了两所“特殊”的学校，专门招收老企业里的老工人——这些老工人的共同特点是：对零件的差别有非常敏锐的感知，哪怕是一个小小的螺丝。


    # 生态位决定了“第六感”


    说到“第六感”，它其实不是一个概念，而是一种比较“文学”的说法——虽然科学上是不承认“第六感”的，但这个概念恰恰来自于一个科学实验。


    # 总结


    +   1. 我们通常说的“第六感”，不过是因为这个物种或这个人在特殊的生态位里产生的一种认知能力。


    +   2. 一个人的认知能力平庸，或者这个人本身平庸，是因为他一直处在一种没有明显选择压的环境里，他能够将就混着生存——由于不具备明晰的选择压，导致他没有法进化出一种特别的能力。


    # 预告：卓越和平庸的产生


    进化其实是一种严苛环境下的学习能力。人和动物不一样，除了自然赋予的各种能力以外，人还生活在一种文化环境当中。


    《人类简史》里说过：人类文化的进化方式跟自然进化的方式是很不一样的。书的作者尤瓦尔·赫拉利说，“现代社会会出现很多平庸的人，他们没有特殊的技能也能活下来。而自然界里的任何一个物种，都可以说是具有特异功能的，形成这种现象的原因就在于人类所处的文化环境、社会分工跟自然环境是相当不一样的。越来越细的社会分工就会导致出现某些社会意义上的生态位，这种生态位是不需要特殊能力也能让人类活下来的”。


    吴伯凡


    人类文明的进化往往也意味着给弱者越来越多的空间，而这种生存空间是不需要特殊能力的，你即使只有相当平庸的能力也可以在其中找到自己的社会生态位。而危险始终存在，作为一个没有特殊能力，没有第六感的物种，在严酷的竞争中随时可能被淘汰。我希望大家今天的课后可以思考一个问题：我是真找到自己的生态位，也就是那种与特殊的严苛生存处境相关的认知和行动能力呢？'
