  md: '# 问答｜如何判断自己认知系统的对错？


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_30_0.png)


    问答｜如何判断自己认知系... ↓


    很多人都是跟着感觉走，既然感觉是大脑把各种信息加工出来的产品，既然有这个加工环节，就有可能出现差错，但是出错的几率有多高？如何判断系统错误呢？让自己经常反思，还是通过冥想？


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_30_1.png)


    吴伯凡


    我们的感觉结果是一个产品，是“产品”就有生命周期。比如我们经常换手机，有钱的话还会经常换车、房子。


    既然是“产品”，也就都有一个合不合时宜的问题一所谓认知“留级”而不是“升级”，就是长期使用一个过时的感觉产品，而你自己不自知。


    # “管用不管用”是判断我们系统错误的唯一方法


    我们这一单元的四节课都是在让大家意识到：我们的感知出错几率其实是很高。

    当然，不同的人出错的几率不一样，就像有的工厂次品高，有的工厂次品就低。


    比如丰田，它的生产方式的次品率比较低，原因是：它的“自我学习系统”能快速找到一个次品的错误地址，能很快找到出问题的环节，一旦消除了这个问题，次品就消失了；如果发现还有次品，那一定是还有一个不知道的环节也有问题，那就在去找这个环节。


    丰田的生产方式就是一个自我纠错的系统，它的次品率很低；而像福特的生产方式，次品率就很高：福特采用的是在产品线的尽头进行检测，发现有次品就重新返工。而返工的过程其实是一个概率问题——即便你不断返工，次品率也是不变的。出现福特生产方式这种状况，是因为它的生产线从来不升级，没有一个自我纠错机制。


    那么，如何判断系统的错误呢？我们用“产品思维”的观念一看就清楚了。你认知的对和错，没有一个绝对的标准，唯一标准就是：这个东西管用不管用。


    你的判断、认知在实际操作当中出现问题了，就自然证明它是次品了。就像一辆车，做成什么样子无关紧要，管用就行——“管用”这个限制使得所有的产品最后都难以趋同。


    既然判断“感觉生产系统”出错的唯一的标准是“管用不管用”，那自然产生了一个问题：发现这个错误的效果太低了！


    你会问，“我能不能快点呢？”可以，加快你的迭代周期，别人一辈子纠正一个错误，你十年纠正一个，或者一年纠正一个，一个月甚至一周纠正一个。这跟做生意的原理是一样的：同样多的钱，周转率高，赚到的钱就更多。


    “管用不管用”是判断我们系统错误并且进行纠正的唯一方法，除此之外，没有别的方法。


    # “抽身出来”是发现错误的一个前提条件


    这个同学问的还有一个问题：如何让自己纠正错误，是经常反思呢，还是通过冥想？


    反思和冥想都是对的，它们有一个共同特点：让你自己抽身出来看自己的产品。


    我们的“感觉机制”以及感觉的结果是我们快速制造的产品，但同时，它又是一个跟我们自身合一的产品——因为我们不认为它是产品，所以我们身在其n中是很难知道这个产品的错误的。


    举个例子，你去录了个电视节目，录完以后，你却不敢看电视的播放，因为你抽身出来立即发现你录的节目里有好多你不忍直视的东西，你受不了这种痛苦。但是，播放的节目里那个人不还是你吗？怎么当初你录的时候不觉得不舒服呢？


    “抽身出来”是发现错误的一个前提条件；“忍受痛苦”是改进、优化、升级你认知的一个必要手段。


    +   1. “反思”的本质就是切换场景


    怎么才能抽身出来呢？无论是古老的东方智慧还是现在的西方认知理论，都有一个共识：那就是切换场景。


    什么是“切换场景”呢？就像刚才举的例子，你拍完电视看电视，就是“切换场景”。


    另外还有一种是“复盘”。“复盘”也是切换场景，是一个事情已经做完了，结果都已经出来了，你再去做一遍。“复盘”表面上好像是让你的思维重新回到原来的那个场景去，实际上，复盘的时候，你已经身在另外一个场景当中了，你更容易识别那个场景下你的所作所为。


    德鲁克（Peter F. Drucker）有个痛苦的经历，他一直认为自己是一个非常会管理自己、很能节约时间、工作效率很高的一个人，有一天他跟秘书说，“你记下我每天每个小时干的事情，然后给我看”。结果德鲁克看了秘书的记录以后简直不能相信，他发现自己竟然是效率那么低的一个人，有大量时间是不创造任何价值的。


    大家如果有兴趣，也可以试一试，记录一下一个月或者一周的时间里，从几点到几点，你到底干了哪些事。看了记录结果以后，你可能会发现很恐怖，这就是“反思”。


    《菜根潭》里有一句话的意思是：你吃饱了以后，就会 qanzhi�خة？ 食色性也，人有两大本性喇，你梦想以求在情爱上的某种追求，当它结束的时候，你回头一想就会产生“真无趣”这种感觉。


    这也就是“事后之悔悟”和“临事之痴迷”：事情发生之后，就是另外一种场景了，我们会有所悔悟；或者你遇到一个事情的时候，在那个场景当中一开始往往是很痴迷的。所以，“反思”的本质就是要切换场景。


    +   2. “冥想”是一种古老的场景切换法


    “冥想”也是一样的。“冥想”是一种古老的场景切换法：你平时都是身在事中、局内，但你每天要抽出一段时从事中、局内出来，跟你所处的生活、世界保持一个客观的距离来看自己。


    佛教讲“观”，内观。什么叫“观”？观跟看着不太一样。一行禅师说“观照的奇诡”。“照”是镜子，它映现这个东西，但是它不干预——镜子是不干预任何事情的。事情出现，会在镜子里呈现出图像、景象，但镜子不干预这个事情本身。


    古人说“寒蝉渡鹤影”：有一池很清澈的潭水，一只白鹤飞过，水里就会有白鹤的影子。水是不会干预白鹤的。


    我们的心达到这种状态的时候，才叫“观照”，你就会发现自己很可笑。这个时候，你才能像一个成年人，或者一个冷静的旁观者，比较成熟地看着孩子般的自己，觉得那个自己很可笑。所以，“冥想”是一种快速的场景切换法。


    人一生当中，都会经历这种抽身出来看自己的过程，但是效率很低，花的时间很长，而且常常代价也非常地大——这件事过去多少年以后，才发现是那么痛的懊悔，其实已经没有用了。我们要学会实时地观照自己，这样出错的概率才会很低。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_30_2.png)'
