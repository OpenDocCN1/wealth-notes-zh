  md: '# 认知退化与格物致知1 | 结果的简单，起点的复杂


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_51_0.png)


    认知退化与格物致知1 | 结果。


    这是我们第一模块第五单元的第一节课。

    这个单元的主题是：认知退化与格物致知。


    我们在前面的几个单元里讲到了“认知与刷卡”和“知行合一”，这两者其实是同样一件事：所谓“知行合一”，就是凝聚了大量的知识，在行动的那一瞬间发挥出来，实现一个高品质的行动（认知）结果。


    # 与知合一的行


    我们可以把“行”分成两种：与知合一的行，以及不与知合一的行。


    与知合一的行，就是刷卡式的认知，比如，射箭一下子射中靶心，就是和知合一的行；而不与知合一的行，就比如写字的时候，如果一直想着怎么把字写好，那就不是“书法”——只要是写的时候你想着怎么写的，都不叫书法。如果你没有大量刻意的艰苦练习，那就是一个低品质的“行”。


    知行合一在我们的生活工作当中比比皆是，不是特例。


    # 结果的简单，起点的复杂


    我们今天不谈索罗斯，谈谈另外两个人：巴菲特和查理·芒格。


