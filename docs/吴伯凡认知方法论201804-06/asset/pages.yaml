  md: '你，却没有给你额外的补贴，有些人觉得这个老板就是黑心老板，只懂得剥削员工的空余时间，因为他并没有把它看成一个良机，而是看成一种倒霉事情，故他对机会的认知便是将其看成“对象”，而另外一些人则是认为这是一个良机，因为老板可以从众多员工当中想到自己，自己也可以通过这个机会在老板面前好好展现自己的才干。这类人是将机会看成一个“过程”，没有考虑即时的利益，而是从长远的眼光、全局的视角去认识“机会”。


