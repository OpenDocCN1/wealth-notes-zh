  md: '# 认知与刷卡 | 本单元十大精彩留言


    认知与刷卡 | 本单元十大精彩...


    吴伯凡


    课程学习到现在，我发现每节课大家的留言都非常踊跃，不同学学习态度非常认真，而且留言的质量也非常高，其中有些留言非常值得拿出来让大家一起学习，有的甚至会给我带来很大的启发。


    所以我决定在课程里加设一个“十大精彩留言”的板块，每周六更新，希望同学们能继续认真输出自己的学习收获，获得更好的学习效果。


    这次我精选了‘认知与刷卡’这个单元的十大精彩留言，欢迎同学们互相学习。


    另外，为了奖励特别优秀的学生，我会给每次精彩留言里的前三名同学送一本我签名的书。


    这次要送的书是《原则》，获奖的同学分别是：@朱胡虎、@杨晨、@大毛，请这三位同学在留言区写下你的通讯地址和联系方式，“得到”的工作人员会在6月的第一周把书寄给你。


    希望看到大家更多的精彩留言。


    # —— 本单元十大精彩留言 ——


    # 获奖留言


    美国常春藤名校在录取学生的时候，有一项硬性的要求，就是要求学生必须至少拥有一项特长。


    什么叫特长？这个概念可能在很多人的脑海里还是被想象出来的。所以特长就是做某件事情或者某方面的能力为常人达不到的境界。


    这可能还是比较抽象。我举个例子，如果你扫过上海市区的每一条马路，那么这个事情在美国的常春藤名校看来，就算特长了。因为要把这件事情做好，常人很难做到。这个特长不见得非要是琴棋书画。


    为什么美国名校需要这样的硬性要求呢？本质上，就是要看这个学生有没有克服困难的毅力，解决问题的能力。因为做任何的事情，都不是一帆风顺的，或早或晚都会遇到难题与问题。如果过早地放弃，在成功的这条道上，就没有了你的身影。至少拥有一项特长，在训练自己拥有这项技能的过程中，大脑能切身地体会这个过程，形成永久的记忆。做起其他的事情，也就比一般人没有那么早或者说没有那么容易放弃。只要是做事不放弃，还有什么事情是做不成的呢？


    其实本质上，拥有特长的价值就是在这个地方。


    所谓“一通百通”也是这个道理，至少在一个维度上打造成超强竞争力。比如开始时小米的爆款手机，但现在有258个SKU。亚马逊开始时也只是卖书而已。人就怕什么都会一点、懂一点，但什么都不精通。


    来自：问答05 | 如何增加认知自己的维度？


    今天吴老师的课把前后的知识都串起来了，我对认知升级有了全新的认识。


    回忆自己的认知周期，好像过去的10多年，自己认知的更新其实是很慢的，变化很小，没有现在升级的二十分之一快。而我自己却不知怎么回事，一直靠着老系统行动，靠老系统带着走，并且走得很慢。而现在听着吴老师和其他老师的课，认知系统更新的周期开始加快，自己的进步也加快了。


    换手机是因为我通常觉得自己的系统比较慢，所以换。如果手机能凑合用，反而不是太在意。而这就引出一个问题，对比新出的手机，我的系统已经开始慢了，但我们没有察觉甚至不在乎。就像我们的认知一样，我们意识不到自己的认知系统落后，并且浑然不知。


    那如何促使我们进行认知升级呢？


    我想有以下几个方法：（1）改变周围接触的朋友圈。多与认知系统的高人接触，让你体会到认知的系统差距；（2）刻意练习，基于事实，敢于提违背习惯的假设，最后进行逻辑验证；（3）多用系统2思考，系统1是由老版本系统2带来，系统1让我们懒于思考，某种程度上也像小子官，用原有的认知去框住你；（4）多接触周围新事物，保持好奇心；（5）最后一个最重要，多听多复老师的课，不断让自己警醒。


    今天的《李翔知识内参》提出了如何克服自我证实的一些方法，对于我们很有指导意义。


    一是考虑相反的情况，做自己想法的左右手，进行互搏，通过正反分析得出的结论才会更加准确。


    二是善用缩小与放大，缩小就是升维在更大的层面审视自己想法，从系统中分析这个行动带来的影响。放大则是细化与拆解，用放大镜仔细研究它的来源和结构，就如同战争中的伤亡率一般，有的人可能理解为一个数字，但有的人通过逐步地拆解与分析就能够收集到更多复杂信息。


    三是通过试错来筛选真知灼见，就如同小马过河的故事一样，不人云亦云，尽可能做到亲身体验与体会。


    来自：认知与刷卡1 | 效率高未必是好事


    # 其他精彩留言


    真诚，就是最好的黑客武器。回想我的经历里，快速征服别人，还是被人征服，真诚起到的作用最大。


    算力、算法和数据，这三大要素运用起来无往不胜啊！对个人来说，智商是算力，情商是算法，人生经验是数据，要成功缺一不可。


    而决定算法的是硬件，如此说来，“智商是硬伤”说得挺到位的。


