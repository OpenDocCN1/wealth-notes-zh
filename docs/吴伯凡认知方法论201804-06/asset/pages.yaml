  md: '# 认知的救赎4｜如何驱散恐惧？


    认知的救赎4｜如何驱散恐惧...


    这是我们第一模块第九单元的第四节课。

    这个单元的主题是：认知的救赎。


    # 视觉悬崖实验：恐惧是在基因里的


    上节课讲了认知的天敌——恐惧。


    我们说“恐惧是能够消解一切认知和行为的破坏性力量。”——这么说可能有点儿冤枉，因为“恐惧”也是一种有特定功能的有用情绪，它对人和其他物种都具有非常重要的意义，以至于成了一种本能似的基因层面的认知。


    “视觉悬崖实验”是一个心理学实验：实验者在屋子的地板上 aus 意弄出一个深坑，搭一座玻璃桥，形成一个简易玻璃栈道，然后，让一个小宝宝坐在桥的一边，妈妈站在另一边。实验开始，妈妈拍手让小宝宝过来，正常情况下，只要妈妈叫，小宝宝一定很高兴地挪着小步过去，但在看到用玻璃罩着的“坑”时，小宝宝就怎么都不过来了。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_91_0.png)


    “悬崖实验”证明：恐惧是在基因里的。以前没有谁教过，小宝宝也肯定没见过这样的场景，但他马上识别出“危险”，遇到这个场景就坚决不往前走——这既是一种“探测识别”机制，也是一种执行程序。从这个意义上说，“恐惧”既是有用的，也是基因自带的一种认知能力。


    包括“情绪”在内的很多认知，都是人类在进化过程中，长期的生存场景将某些认知预装在我们的大脑里，存储在我们的基因里的。


    # 查杀感染了“恐惧”的认知病毒


    “恐惧”本来是我们认知中的一种软件，当这个软件遭到篡改或者发生了某种突变以后，就变成了一种不断复制自己、脱离整个认知和情绪的破坏性程序——病毒。


    当“恐惧”越来越成为你生存的主调的时候，你应该意识到：你的认知已经感染了病毒。这个时候，无论怎么提高你的配置，进行软件升级都没用了，因为病毒的力量太大了。


    +   1. 帕斯卡的“另外的程序”


    很多哲学家把这个问题已经说得非常明白了，而且，他们还提出了各种各样查杀病毒的方法。


    比如我们上节课提到的帕斯卡，他承认“人的理智在恐惧面前是多么无力”，但怎么才能够克服这种恐惧呢？他希望给人装上另外一个程序，这个程序有点儿像玩杂技的人系的安全带，目的是为了告诉你——你尽管玩儿，无论怎么样都是摔不死的。


    +   2. 王阳明的“心中贼”


    王阳明其实也注意到了这个东西，他把“恐惧”这种干扰人认知的各种杂质，称作“心中贼”——就是在你内心起破坏作用的那种东西。


    +   3. 绝望疗法


    讲到这里就可以回答一个大家一直间的问题：说“恐惧”是妨碍人认知的最大拦路虎，那么，怎么才能去掉恐惧，达到一种真正优化认知呢？答案是：绝望疗法。


    爱因斯坦说，“问题不可能由导致这个问题思维方式来解决”。我们的恐惧是由我们原来的认知导致的，你原来的认知是不可能驱除这个恐惧的，王阳明告诉我们：要用行动来驱除恐惧。


    不进入一种极度绝望的场景，你可能永远驱除不了这种认知，也就永远驱除不了你的那仿恐惧——这也从另外一个侧面解释了王阳明“知行合一”。


    吴伯凡


    认知升级的问题最终是一个“如何驱散恐惧”的问题，大家可以分享一下：在生活中，当你深陷绝境，产生某种极度绝望的时候，有没有因为接触到某种一直害怕的场景，反而觉得踏实而心生大无畏，让自己的认知变得非常通透呢？当然，出现这种情况是小概率事件，正如杰出的人也是小概率事件一样。


    # 划重点


    > 你所恐惧的东西很可能是一个幻觉，当你真正是坠到那个谷底的时候，这个恐惧就自然消失了。'
