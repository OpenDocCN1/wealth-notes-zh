  md: '今天的问答让我想到了中学物理中学到的定理：“一切物体在没有受到外力作用的时候，总保持静止状态或匀速直线运动状态。”伽利略通过不断调整这个因素总结出一条基本的定理。我觉得这就是吴老师说的在一定生态位中，不断接受反馈，调整，总结，获得不变的规律。


    但是，虽然这是一条不变的规律，但在现实生活中物体是基本不会出现一直匀速直线运动的。因为现实中会出现各种因素影响这条规律，比如：摩擦力、空气阻力、爬坡、撞墙等等。但这并不妨碍这条定理的正确性和对我们生活、设计产品的指导意义。


    我们要在实际生活工作中总结和提炼不变的规律，但也要认识到虽然这条规律可以适用于所有的事件，但不同事件中的其他因素是不同的，所以不同事件最后的发展结果是不同的。《易经》：道生一，一生二，二生三，三生万物。八卦就是阴阳变化组合而来。阴是不变的规律，阳是其他明显
    Capricorn 因素，它们不断交汇，影响，演化，变化出世间万事万物。


