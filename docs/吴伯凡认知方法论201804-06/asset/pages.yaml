  md: '# 问答06 | 如何做到真正的“反思”?


    在“认知与刷卡”这个单元的学习中，大家的问题集中在一个词上：反思。


    谁都知道“反思”是好的，但问题是“我如何才能做做到反思呢？”我们虽然经常在讲“反思”，但是很可能我们并不知道“反思”到底是什么。


    抽身而出，判断对错，支点在哪？标准在哪？如何判断自己真的是在以第三视角反思自己？


    我们该如何找出自己认知中的错误呢？因为我们有时候就算去反思也不一定能找出自己真正的认知错误，如果自己知道错了，相对很容易改正，最怕的就是那些自己错了但是自己也不知道自己错的认知模式。


    # 什么是“反思”?


    回答这两个问题之前，我先分享一段古罗马哲学家西塞罗的话，这段话是巴菲特的搭档查理·芒格非常喜欢的一段话，也有很多喜欢用这一段话来说明终身学习的重要性，我觉得这段话能让我们更好地认识什么是反思：


    > “我应该不会拒绝从头到尾地把生活再过一遍，只是希望能够获得唯有作家才有的特权——在‘再版’的生活8447中修正‘初版’的错误。生活的悲哀之处在于我们总是老得太快而又聪明得太慢。等到你不再修正的时候，你也就不存在了。”


    西塞罗的这段话出自他的《论老年》。他认为老人具有智慧是因为他的生命已经接近尽头了——当一切都开始收尾的时候，才能够看清楚前面所有事情的对错成败。因为在年轻的时候，你还不知道事情的是非，不知道事情的对错。


    # “精益创业”思维


    既要“反思”，又不能等行将就木再获得那些正确但没用的反思，那应该怎么办呢？我们可以⁩用“精益创业”的思维来看着这个问题：你想反思，就要迅速完成一个循环。


    # “OODA循环”


    在《伯凡·日知录》里我们讲过“OODA循环”：飞行教练让自己的学生提前40秒钟占据一个优势位置，然后自己和学生开始做模拟空战。但教练很快就制服了学生。


    “OODA循环”是观察（Observe）、调整（Orient）、决策（Decide）以及行动（Act）。你需要迅速完成从观察到行动这四个环节，完成之后就形成了一个真正的循环，然后你进入下一轮“观察”，这时你已经比那些还停留在上一轮“观察”的状态下的人看到的东西要多得多了。


    # 划重点


    +   1. 反思就是你迅速从一个场景、事态中抽身出来，看自己在前一个事态中的表现。事业和人生的成功在相当大程度上取决于你反思的速度和次数。 2. “OODA循环”带来的启示是：迅速完成观察、调整、决策、行动这四个环节的循环，进行下一轮“观察”，你会比身处上一轮循环的自己体会到更多东西。


