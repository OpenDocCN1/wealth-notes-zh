  md: '# 认知退化与格物致知3 | 侦察兵与司令员的启示


    认知退化与格物致知3 | 侦察...


    这是我们第一模块第五单元的第三节课。这个单元的主题是：认知退化与格物致知。


    # 侦察兵和司令员的差别


    +   1. 价值中立


    一战后，德国人总结自己的失败原因时，有一个很著名的判断：做决策的人当中，听得见炮火声的人太少。


    其实见得见炮火的人有很多，有前线将领、士兵，还有一个重要的角色——侦察兵。侦察兵的作用很简单，就是以各种方式获知敌方阵地的实际情况后回来报告，帮助指挥员做决策。


    应该说，侦察兵所做的工作是决策中的重要一环。


    但侦察兵看到的信息往往会被无形的机制给过度抛。虽然指挥员得到的信息和信息是从侦察兵那里来的，但那些信息是经过大量过滤、整合、整理，甚至是修改了以后的信息——指挥员做决策所依据的信息，很可能和侦察兵最初看到的信息已经隔得很远了。


    虽然从严格意义上说，侦察兵看到的情况也是一个把事实和感知材料变成认知的生产过程，但是侦察兵没有决策功能，他在某种程度上处于一种哲学上所说的“价值中立”状态。


    “价值中立”的英文是value free，value是评价、价值；free是不让评价，不让价值在中间干扰观察。


    俗话说“当局者迷，旁观者清”。旁观者的智力和认知能力不一定比当局者高，但他拥有了一种认知优势。这种认知优势来自于旁观者所处的场景，最重要的是，旁观者在相当大程度上是价值中立的。


    +   2. 动机性推理


    当局者和旁观者看到同样的信息时，他们对信息和感知材料的加工方式是不一样的——相对于侦察兵，司令官也无法做到价值中立，或者说，司令官根据材料进行演绎推理的时候，无形中受到了一种力量制约，这种力量叫“动机性推理”。


    柏拉图说，“感性是马车，理性是马车夫”。“动机性推理”就像是马车夫在驾车，而各种材料就像是马车。马车是整个行走过程的基础，但确定马车走到什么地方的不是马和马车，而是马车夫。


    所谓“动机性推理”就是：你的各种感知材料和信息，形成一个认知基础，而你的动机在悄悄驾驶着这辆马车。同样一辆马车既可以走到这个地方，也可以走到另外一个地方，这中间起决定性影响的是——动机。


    “动机性推理”里有一个特别不容易察觉的东西——维护自身的正确性和一致性：


    +   正确性：人在形成认知的时候有一种近乎本能的、没有意识到的冲动——不遗余力地证明自己的正确性。


    一致性：也是一种冲动。不管这些材料看上去多么杂乱，甚至是矛盾冲突的，无论我们多不能容忍这些感知材料之间彼此抵触的矛盾性，最后的结果是，我们背后的动机扮演着一个“家长”的角色——当孩子有了矛盾以后，家长认准哪一方对，就强行按住另外一方，让他闭嘴。这是我们做出判断和决策的时候身不由己遵循的一个规律，甚至可以说，这种一致性是我们的认知的一种原罪。


    我们的认知自带某种傲慢和偏见，当你处于当局者或决策者位置的时候，你不可避免地会受这种力量的制约——只要在那个场景里，你的思维方式就只能遵循和受制于这种力量。


    相对于当局者或者说司令官，侦察兵的预判很少，他没有明显的动机，也不像司令官那样有明确的动机指向性。侦察兵唯一的动机就是：尽可能多地获取各种信息，即使这些信息之间是矛盾冲突的，是没法解释的。因为他的功能就在收集这些信息。


    侦察兵和司令官形成的状况反差是：侦察兵有一种自然的谦卑，他没有动机性推理，没有认知的傲慢和偏见，他能够获得更丰富的信息和材料。


    # 社会学意义的“蠢人”


    我们曾经讲过一个“蠢人”的概念：蠢人不是心理学意义上的蠢，而是社会学意义上的蠢。


    朋霍费尔所说的“蠢”是由于一个人处于某个位置、场景，某一个他不得不坚持的立场上的时候，他会被这种位置、场景格式化。他的认知会wing有一种既定的格式，而这种格式在某种程度上是一个免疫系统——以一种很有效的方式把外来的信息挡在外面。


    这种特殊的免疫系统只把那些它认为不会对人造成痛苦和伤害的信息和感知材料放进来。


    我们身体的免疫系统能够保证我们的身体是安全的，可以避免各种各样的病菌病毒来袭击，而刚才说到的那种特殊的免疫系统，却只能把人变成一种特殊的“蠢人”。


    朋霍费尔还认为，用通常的方法测试这样的人的智商的话，结果并不低，但由于他建立了一种特殊的免疫系统，就把自己变成了一种社会学意义上的“蠢人”。


    跟这种人打交道，实际上是跟一些既定标准、标语、口号、模式、说辞在打交道——哪怕是面对面跟他说话，也无法进行近距离的接触和推心置腹的交流。这种人每天都在获取新的信息，听取新的意见，但这些新信息和新意见也都是“旧”的，是经过这个免疫系统认证批准以后进来的。


    正如朋霍费尔说的，“与这样的人争论既无用又危险”：


    +   无用：只要你的观点和材料跟他的既定东西不一致，他的感知系统就是自动关闭的；


    +   危险：如果他是一个司令官，而你只是一个侦察兵，那么你就会处于非常危险的位置。


    吴伯凡


    大家可以思考一个问题：我们今天讲的“司令官”和“蠢人”，跟我们说的“中年油腻男”之间相通的地方在哪里？为什么说“要想活得不油腻，就应该像侦察兵那样，虽然地位很低，身份很卑微，但内心是开放的，身体是充满活力的？”


    # 划重点


    1. 相比当局者，旁观者拥有一中认知优势：价值中立。当而局者更倾向于“动机性推理”，维护自身的正确性和一致性，陷入认知谬误。


    2. 当一个人的认知有其既定模式时，他的感知系统只接收和既定认知相符的信息，就会逐渐变成一个“无用又危险的蠢人”。'
