  md: '# 认知的救赎2 | 优化与残化


    认知的救赎2 | 优化与残化


    这是我们第一模块第九单元的第二节课。这个单元的主题是：认知的救赎。


    # 认知能力：物种的生存装备


    # 1. 大写字母E的实验


    我们先来做一个小实验：大家不要过多思考，用手指在自己额头上写一个大写的英文字母E——注意！是写给别人看的正写的E。如果觉得有困难的话，可以对着镜子写。


    有一个公司曾经做过这个有趣的实验，他们发现：越是底层的员工，写对的概率越高；而职位越高，写错的概率也越高——结论就是，在一个公司里，位置越高的人越容易陷入一种不自知的愚蠢当中。


    为什么会出现这种情况呢？用我们上节课的观点很好解释：你的认知能力是具有特定功能的装备，它跟你的处境密切相关——各个兵种带的武器装备不一样，是因为他们面临的战况、场景，以及要完成的任务不一样，侦察兵和扫雷兵、步兵、坦克兵……带的装备肯定是不一样的。


    如果你能够比较快地在你额头上写出E，说明你的同情共理心比较强：字母不是写给自己看的，而是写给别人看的，因此说明，你习惯于从别人的角度来看自己。


    # 2. 响尾蛇和老鹰的“装备”


    我们讲的这个实验也进一步说明：一个人或者一个物种的能力/功能都是在特定场景下的一种装备和设施。


    比如响尾蛇有大量的视杆细胞来感知红外线，它对热量的感知道迅速传递到神经细胞，并且将这种热能信号转化为神经信号。


    而它之所以具有这种能力，是因为响尾蛇习惯于夜间活动：夜间气温比较低，而响尾蛇猎物的体温高于环境温度，所以，响尾蛇通过对热度的感知能够找到它的猎物。但如果在白天的话，响尾蛇一下子就成了一个瞎子，尤其是白天温度很高的時候，它的这个能力就丧失了。


    # 残化：任何获得都是一种丧失


    美国诗人弗罗斯特（Robert Frost）有一首著名的诗——《未选择的路》：


    > 黄色的树林里分出两条路 □可惜我不能同时去涉足

    我在那路口久久伫立

    我向着一条路极目望去

    直到它消失在丛林深处

    但我选择了另外一条路

    它荒草萋萋，十分幽寂

    显得更诱人，更美丽

    虽然在这一条小路上

    很少留住旅人的足迹

    那天清晨落叶满地

    两条路都未经脚印污染

    啊，留下一条路等次日再见

    但我知道路径绵延无尽头

    恐怕我难以再回返

    也许多少年后在某个地方

    我将轻声叹息将往事回顾：

    一片树林里分出两条路——

    而我选择了人迹更少的一条

    从而决定了我一生的道路


    这首诗描述的就是：森林里有两条路，你选择了这条路，就不能够走那条路。事实上，在这个世界上，任何一个人或者物种也都面临着这样一种状况：你选择了这条路，就意味着舍弃了另外一条和多条的路。而你选择的这条路就决定了你的认知和你感知世界的方式，也决定了你的能力。


    任何获得都是一种丧失：我们在对我们的某种能力沾沾自喜的时候，也意味着我们一定丧失了某种能力。从“在额头上写英文字母E”说到“各种动物的能力”，归结一点就是：我们能优化的同时，也意味着我们能力的残化。


    +   第一，不要离开你的赛道；

    第二，你要想一想这个赛道会一直存在吗？假如有一天这个赛道不存在了，你就瞬间残化了——实际上，你早已经残化了。这种残化只是把早已经发生的事情呈现为一个事实而已。


    最后我还要提醒大家一句：世界上两种残化，一种是因为你不断优化而导致的，还有一种是你并没有一个不断优化的能力，在哪个方面好象都可以。


    正如我们在本单元第一节课里讲到的：任何人都是残疾人，任何物种都是残化物种，关键在于你选择哪一种残化，以及你对自己残化的一种深刻意识，并随之保持一种敬畏和谦卑的感觉。


    吴伯凡

    大家可以问自己一个问题：我在哪些方面是一个残化的人？这种残化是怎么导致的？'
