  md: '# 006 | 从“盲人摸象”中获得的启示


    006 | 从“盲人摸象”中获得...


    这节课是我们第一模块第二单元的第二节课。


    # “论到趣味无争论”


    作为一个南方人，我到北京来上学的时候，有一次受到了一个很大的冲击：学校食堂里卖的烧饼，在汤里放了一种菜，我当时吃了以后立刻产生了想吐的感觉。我问，“这是个什么东西？”别人告诉我，“这叫香菜。”——这种东西竟然叫香菜！这也算是一次我的认知地震。


    当我从这种味觉的冲击中缓过神来，我明白了一个道理：人类真应该宽容！


    有些人特别喜欢吃香菜，我的同学当中就有很多 人特别喜欢这个味道，如果吃馄饨的时候没有香菜，他恨不得要拼命，而我自己就是如此排斥。


    香菜这个问题还只是在趣味层面的偏好，“萝卜白菜各有所爱”。就像英国人说的：论到趣味无争论。


    上一节课我们提到褚子的“蓝黑&白金”之争，就不是趣味之争。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_25_0.png)


    据说有一个明星，把自己的那条裙子晒在网上，问大家“你认为这条裙子的颜色是哪两个颜色？”结果引发的转发量差不多达到了2500万，整个网上立即就分成了“白金党”和“蓝黑党”，双方的观点针锋相对，但是情绪一样——“世界上竟然还有人认为这条裙子是这个颜色的！”


    最有意思的是，有些人眼睁睁看见自己最亲密的朋友、亲人和自己的看法如此截然对立，他们觉得非常不可思议、耿耿于怀。如果是在中世纪，在一个没有法制的社会，大家手里又都有武器，那真有可能因此弄出命案来——有人就把“蓝黑&白金”之争形容为“一条裙子引发的血案”。


    当然，从这件事情上，我们也可以引申出很多结论，比如：人类达成共识的难度有多大，从这件事情上就可见一斑。


    # 盲人摸象的启示


    下面，我们要说的是另外一个问题。


    上次课的开始，我们还看到了一张图，大家产生的感觉是“这个人像是幻觉”。但那跟裙子之争还不太一样，因为大家看到的都是同一个风姿绰约的倩影，可看到的裙子颜色却不太一样。


    为了分析这里的差别，我们先要引入另外一个古老的故事：盲人摸象。


    “盲人摸象”是一个印度的故事，讲几个盲人凑在一块儿摸大象，最后得出了针锋相对的结论：有人说大象像一堵墙，有人说像一根柱子，有人说像一个棕榈，有人说像一根绳子……


    这几个 人争得不可开交，而我们觉得很可笑。原因特别简单，对那几个盲人来说，我们具有“上帝之眼”。


    我们的眼睛能告诉我们大象是什么样子，我们能够看到大象的整体，而那几个盲人只是摸到了大象的一个局部。


    佛教经常用这个故事来说明，我们对于完整的世界缺乏认知，导致了各种各样的片面感知，进而争执不下。


    这些盲人之间为什么会产生那么激烈的争论呢？


    任何一个感知，实际上是由两个部分合成的。借用佛教的话就是“因缘和合而成”。


    一个是“输入”，也就是所谓的外界、身外、我们通常叫做“对象”的东西；还有一个因素，是我们自己的感知方式。盲人没有视觉，只能用触觉——“触觉”也是一种感知方式。


    我们把我们的感知理解为一个设备、一条生产线的话，假设这条生产线不变，如果输入的东西不一样，那输出的产品也就是不一样的。


    盲人的手摸到的是大象的不同部分，而不是大象本身（全身），所以，他们得到的认知其实是不一样的。


    但是，盲人对于自己的片面性，也就是自己输入的差异是没有感知的，他们以为每个人摸的都是象，所以，当结果出来的时 候，他们彼此之间觉得不可思议，认为是对方不可理喻——这一点，和看到同一条裙子产生的激烈争论有相同的地方，但不同之处在于，裙子是同一条裙子，大象不是同一个大象：盲人以为的大象其实是象腿、象牙、象尾巴。


    在相同的感觉生产线上，输入的东西是不一样的，得出的结果也是不一样的，但由于他们不知道输入的是不一样的，就会对一个如此大差别的结论感到非常诧异，甚至不能容忍。


    而裙子的神奇之处在于，它就是一条裙子，但也出现了这么大的差别。据说蓝黑党和白金党的比例大约是1:3。“蓝黑党”属于视锥细胞比较发达，而“白金党”则是视感细胞占优，没那么多视锥细胞。


    这就是说，由于设备的不同，即使输入的东西是一样的，得出的结果也是不一样的。但我们不知道我们的设备差别，这一点跟盲人是一样的，因此，我们对不一样的输出结果非常诧异，甚至不能容忍。


    # 我们都是盲人


    我们讲到了两个因素，一个是来自于外界的物质材料，一个是我们 的感知系统，这两者之间很像是在做一个乘法：一个东西 X 另外一个东西 = 一个结果。


    相乘的结果叫乘积，英文是product。Product这个词我们也很熟悉，它还有产品的意思。我们的感知结果就是一个产品、一个乘积。


    如果等式左边的两个因素都是一样的，它的乘积肯定是一样的；但如果有一个因素一样，另外一个因素不一样，那么乘积就不一样，也就是产品不一样。


    我以前经常引用这句话“我们对我们的看不见是看不见的”。哪怕我们是一个明眼人，并没有双目失明。在今天的语境里，我们对这个说法又有了新的认知：


    哪怕我们都是明眼人，但我们的眼睛和别人的眼睛很可能是不一样的，但我们不知道这种不一样，这就导致两个结果：


    +   第一个结果，我们看到的东西和别人看到的东西是不一样的，每个人看到的东西都是他自己的产品。


    第二个结果，由于眼睛这个感知设备的生产线是不一样的，而这一点我们没有意识到，所以，我们会对最后的结果非常诧异。


    在这个意义上来说，我们都是盲人，尤其是当我们没有意识到我们的感知是一个公 司、一个生产线的时 候，我们就可能陷入到另外一种形式的盲人摸象当中。


    划重点


    感知的结果受两个因素影响：输入的内容和感知设备。任何一个因素不同，都会造成感知结果的差异。


    吴伯凡


