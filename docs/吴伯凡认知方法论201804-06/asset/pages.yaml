  md: '# 认知与刷卡3 | 效率高未必是好事


    认知与刷卡3 | 效率高未必是.. ↓


    这是我们第一模块第三单元的第二节课。


    # 性感：高效的“瞬间认知”


    上节课的结尾我们提了一个问题：你看到一个女性非常性感，这是一个瞬间认知，但也是一个非常复杂的过程。这个复杂的过程是人类在长期进化中形成的认知机制，目的就是让人不假思索地做出利于基因传递的决定。


    这个我们生来就被赋予的使命，其实是一种提高决策和执行效率的方式。


    类似的例子还有。


    美国当代著名哲学家丹尼尔·丹尼特（Daniel Dennett）认为：实际上，“你认为一个姑娘性感”和“你吃到糖觉得甜”是一回事，因为它们都是通过诱惑和奖励，让你瞬间认识到它的益处，并且瞬间执行。追逐甜食，实际上是为了让你的身体迅速获得能量——以前热量稀缺的时候，就是需要你不假思索地获取甜食。这个机制背后也是非常复杂的。


    瞬间认知除了复杂之外，实际上还带有非常明显的功利性，这也是瞬间认知给我们带来的好处。我们做品牌，以及大自然塑造出一个性感的身体，其实都是为了提高我们的认知效率。


    # 效率高一定是好事吗？


    选择效率高的认知过程好像是不言而喻的，但哲学家和心理学家长告我们，事实并不是这样的。


    人类在思考和认知的时候有两种方式：一种是快捷方式，一种是非快捷方式。2002年诺贝尔经济学奖得主丹尼尔·卡尼曼（Daniel Kahneman）给这两种认知和思考方式做了一个简单的分类：系统一和系统二。


    系统一的特点是直接、快速、高效率，它的表现形式常常是直觉；而系统二是间接、慢速，它的表现形式常常是理性。


    系统二的毛病显而易见：慢，没有效率；但是在很多时候，它是靠谱的；而系统一的特点是快，但它往往是不靠谱的。


    +   1. 规避风险的选择


    举一个例子，从这个例子里我们能够感受到快捷和非快捷认知方式的差别，以及表面上很有效率的快捷认知方式有多么不靠谱。


    假定美国出现了一种罕见的疾病，医疗部门给出了两种方案，但两种方案有不同的表述。


    第一种表述：


    +   如果采取A方案，可以确定无疑地救活200人；

    如果采取B方案（冒险方案），有1/3的可能性是600人全活，但也有2/3的可能性是600人全死。


    面对这两个选择，我们无一例外地会选择A方案——这是人的普遍的心理，落袋为安，“十鸟在林不如一鸟在手”。


    第二种表述：


    +   如果采取C方案，确定会有400人死亡；

    如果采取D方案，有1/3的可能性是无人死亡，但2/3的可能性是600人全部死亡。


    面对C和D两种方案，绝大多数人会不由自主地选择D方案。


    有意思的是，大家现在仔细看一下上面的表述，其实A和C是一样的，B和D是一样的。那我为什么会在第一种表述中选择A，而在第二种选择中选择D（实际上也就选择了B）？


    这背后的一個机理就是，人们面对希望的时候，总会选择规避风险。当绝望成为一个主色调的时候，我们会主动选择冒险。


    +   2. “朝三暮四”


    上面的例子可能有点儿烧脑，我再举一个通俗的版本。


    这是庄子说的：有一个老人养了很多的猴子，有一天发现家里给猴子吃的栗子越来越少了，就跟猴子们商量，“你们早晨吃三个栗子，晚上吃四个栗子行吗？”猴子们都不愿意，觉得老人在克扣它们的食物。于是老人想了想，又说，“要不这样，你们早晨吃四个栗子，晚上三个栗子吧！”猴子们一听，觉得早晨增加了一个栗子，太好了！


    实际上，我们知道，这是一回事，就是一天吃七个栗子。


    本质上一样的东西，由于我们某种内在的认知机制，或者说某种认知bug，使得我们做出了不同的选择——可笑的选择。


    要避免这种可笑的选择，最好的方法就是用理性，也就是用系统二——很慢的，但是符合逻辑的方式去得出结论、作出选择。


    但我们一般情况下是不愿意的。生活当中的大多数时候，我们愿意直截了当、不假思索地选择我们认为是好的东西，排斥那种直觉上认为是错的东西。


    # “理性永远是感觉的奴隶”


    最近我看到一个材料，说美国常春藤大学在逐渐减少“面试”在选择学生的标准中占的权重，原因是：他们认为，在面试的时候，我们思考的方式常常是快思考，也就是用系统一而不是系统二来思考。如果我们把选择交给电脑，电脑是不会自带偏见的。比如“黑人没有白人聪明”这个人的长相不符合本大学的风格和气质”等等，这些偏见都会不知不觉地影响对学生的评价。


    请注意，系统一和系统二表面上是平等的，实际上，在选择的时候，系统一是处于主导地位的。当系统一迅速得出一个结论的时候，系统二会像一个跟班、随从、大臣一样，对系统一得出的结论提供大量的论证。


    在寓言《人有亡斧者》里我们就能知道，只要你得出了一个结论，理性就会自动地为你寻找支持这个结论的种种证据；你的结论一旦改变，它又会自动寻找支持新结论的种种证据。


    我们滥用系统一的时候，其实也是在滥用系统二——因为系统二，理性是不能作主的。用英国哲学家休谟（David Hume）的 trace 话，“理性永远是感觉的奴隶”。


    我有个朋友曾经天天给我抱怨他的妻子这不好那不好，好像时刻准备要离婚的样子。同时，他又是一个迷信神秘主义的人。有的一天，这个朋友遇到一个高人，这个高人跟他说，“你一定要善待你的太太啊，她是你的财神！你这些年之所以能够挣到钱，就是因为她在你身边”。


    听完这些，我这个朋友突然想到了老婆的许多种好来，尤其想起一旦离婚的话，他就什么都没有的时候，注意力也就不会集中在那些“牙膏从中间挤”爱在淘宝上购物”这些琐碎的事了。


    从这件事情上，我们就能看到，刷卡这事挺好。但同时，刷卡（瞬间认知、瞬间解读）的这种认知方式，很可能是把我们带向某个我们不知道的大陷阱的罪魁祸首。


    # 远离认知中的舒适区


    我们的认知是由我们自身的认知设备决定的，而我们的认知设备、认知能力是不能够反思这种设备缺陷的。我们既要追求福尔摩斯式的瞬间发现真理、照亮真相的能力。同时，我们也要清楚，这种理想的认知能力是建立在长期积累和自我反思、自我修正、自我优化的认知过程当中的。


    要获得类似于黑客的瞬间通关、瞬间解码、直击问题本质的认知能力，没有什么速成的办法。办法只有一个，也就是冯唐所述的麦肯锡的方法：尽可能基于事实，敢于提出违背习俗的假设，再严格遵循逻辑验证你的假设，最后始终保持获得真知灼见的意识。以上概括起来，就是“远离认知中的舒适区”——用事实、假设、逻辑、真知灼见的要求，时刻提醒自己远离认知的舒适区。


    听完这节课，我至少可以意识到，我们的很多瞬间完成的认知，其实是大自然在漫长的进化当中赋予我们的。还有一些是我们长期的习惯，不知不觉造就的。那些表现为快捷方式、瞬间性的认知，实际上是由慢思考、慢认知喂养出来的一种能力。


