  md: '# 认知的救赎3｜恐惧——认知的天敌


    认知的救赎3｜恐惧——认知...


    这是我们第一模块第九单元的第三节课。这个单元的主题是：认知的救赎。


    # "恐惧"无所不在


    +   1. "玻璃栈道"上的人情百态


    大家可能都知道，张家界的天门山有个很现代的玻璃栈道，但你去到那里，看到的不是风景，而是各种丞态：很多人走这个栈道的时候，是趴着的。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_90_0.png)


    这个玻璃栈道虽然直接能看到万丈深渊，但它其实很宽，而且是玻璃钢做的，跟钢板一样硬，用锤子都砸不碎，而很多人还是不敢直接前往走，以为爬过去就没有危险，所以就出现了各种丞态和惊叫。


    我之所以说到这个场景，是因为哲学上经常说到的“理智与情感”之间的关系：启蒙时期的思想家认为启蒙的目的是要用理智战胜情感和迷信——很多的迷信不过就是一种很狭隘的情感而已。


    而苏格兰伟大的哲学家休谟（David Hume）非常睿智，他经过大量观察思考后认为“理智是不能战胜情感的”，因为“理智永远是情感的奴隶”——现代认知科学也越来越证明他的判断是对的。


    +   2. 帕斯卡思想实验


    西方的哲学也有类似“玻璃栈道”的例子——著名的“帕斯卡思想实验”。


    这个实验是把一块足够宽的木板放在地面，你从这头跑到那头去，脚是不会触到地面的，但如果把这块木板放在两个悬崖之间，几乎就没有人敢过去了，甚至连挪过去都不敢，会觉得自己随时有可能掉入万丈深渊。


    帕斯卡用这个例子说明：人的理智在情感面前非常无力——理智已经清楚告诉你“一点儿危险都没有，在上面跑步都不能掉下去”，但为什么我们连慢慢挪过去都不敢呢？


    因为“恐惧的力量”不仅大，而且无所不在。


    +   3. 恐惧是一切负面情感的源头


    我们常说的“七情六欲”里的“七情”：喜怒哀乐忧恐惊——“恐惧”是一切负面情感的总源头。


    +   "忧郁"的背后是恐惧，你没恐惧就不会忧郁；

    "嫉妒"的背后也是恐惧，正如龙说的一切的不宽容都来自于恐惧；


    巴菲特认为干扰我们决策的是两个东西，恐惧和贪婪，其实“贪婪”的背后也还是恐惧——“贪婪”是不断攫取资源以备不时之需，如果你没有恐惧就不会贪婪。


    为什么人类会有“恐惧”这么讨厌的东西呢？


    我们学一点点“进化论”就能知道，人类所有的东西，不管是器官还是认知能力或者情绪，都是一种生存手段，或者生存装备：你的眼睛是一种装备，耳朵是一种装备，同样，“恐惧”这种情绪也是一种装备，只不过是一种软件式的装备，植入到我们内心来保护我们，让我们面对巨大的危险，不至于浑然不知和麻木不仁。


    "恐惧"是一种特殊意义上的执行力，它既是一种探测器，也是一种命令。你现在的行為，或者你处在某种场景中，“恐惧”会以一种你不知道的方式强迫你终止目前的这个行为，或者逃离目前的这个状态——从这个意义上说，“恐惧”是一种非常有用的工具。


    假如没有恐惧的话，人类和其它物种，可能就不存在，比如小鹿要没恐惧，它就随时可能成为狮子的盘中餐。


    但是，任何工具都有一个问题：滥用。我们有很多的情绪，包括嫉妒、忧郁、愤怒……都是一种工具和手段。但是，任何工具都要各就各位在特定的场景使用，不使用的时候，也要放在特定的地方——工具箱里。


    # 恐惧：认知的天敌


    我们现在就谈“认知”：要优化和扩展我们的认知，就要面对认知的天敌——恐惧。


    "玻璃栈道"这个场景就能认识到“认知在和恐惧的较量中是如何软弱不堪的”，但是，道理都明白，一旦恐惧出现的时候，道理就变得一钱不值了。


    这也从侧面回答了我们的老问题：为什么“明白了那么多道理，却仍然过不好一生”？这是实践的问题、练习的问题，当然，最重要的问题是“恐惧”，以及恐惧衍生出来的各种情绪——嫉妒、贪婪、忧郁等等。这些情绪极大地扭曲了我们的认知，有时候甚至是釜底抽薪式地，让整个认知陷入崩塌和瘫痪状态。


    所以，光说“要提高认知”是没用的。


    这也就像好多球员，天天练习投篮，并且在练习的时候投篮投得特别准，然而一到球场却一个都投不进去——能力的克星“恐惧”一旦出现，我们的能力就派不上用场。


    在印度电影《三傻大闹宝莱坞》里，三傻之一，也是最害羞的那一个，他的特點就是“恐惧”：他宿舍里的同学烦都很烦他了，因为他遇到什么事情都要求啊、拜啊，比如考试之前要拜眼镜蛇，他整个生命的体验都是被恐惧所笼罩的，所以任何事情一出现，他就退缩。


    所以，当他父亲病重的时候，他想到的不是用摩托车赶快送他父亲去医院，而是出交通事故怎么办，没有救护车他父亲在中途死了怎么办——“恐惧”成了他人生路上随时出现的拦路虎。


    所以，当这个“害羞傻”在毕业考试当中考了最后一名，害怕没有公司雇用他，而自己家庭又很贫穷，势必遭到所有人白眼的时候，他倒是没有了“恐惧”，直接从楼上跳下去了。


    幸好楼不太高，他只是摔断了腿，很快也就治好了。没想到的是，他自此就变成了一个人，因为他跳楼的那一刻是没有恐惧的，而且跳完以后没死——这时候他说了一个金句，“我只有腿摔断以后才真正站立了起来”。


    也就是说在那一刻，“恐惧之神”被驱散了，再也不会每天都困扰在他身边了。


    今天课程的关键 wrt是“恐惧”。我们之所以说“恐惧”是因为它是认知的天敌，像硫酸一样：任何认知一旦碰到了去处，很快就会化解，消失于无形——“恐惧”具有那种化骨绵掌的力量。


    # "恐惧是万恶之源"


    法国前总统戴高乐说过“恐惧是万恶之源”。我年轻的时候一直不明白他为什么这么说，世界上有很多的邪恶，为什么恐惧是万恶之源呢？明明很多东西比恐惧更邪恶多了——现在我明白了，他的意志是“很多的邪恶源自于恐惧”。


    正如茨威格说的，“历史上那些残暴的刽子手常常都是懦夫，最残暴的人往往又是最懦弱的人，因为他身怀恐惧的时候会做出极其残忍的事情来”。


    我们做事的时候，如果不把“恐惧”这个魔鬼、拦路虎去掉，任何认知和行为一定会扭曲变形，甚至荡然无存。


    吴伯凡


    大家可以回想一下自己过去的经历，有没有遇到过这样的情形：恐惧或者是与恐惧相关的情绪让自己在“该做什么”、“该怎么做”的情况下最后没有做，或者是做得一塌糊涂？


    # 划重点


    恐惧是认知的天敌，任何认知和恐惧交锋都会失败。所以优化认知前，要先学会面对恐惧、消除恐惧。'
