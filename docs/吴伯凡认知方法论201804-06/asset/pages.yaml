  md: '# 001 | 原始舒适区=0认知


    001 | 原始舒适区=0认知


    今天我要跟大家讲的话题，似乎和“认知”正好相反。


    如果给你这样一个地方：没有寒冷、饥饿，没有任何生存挑战，只能感受到温暖和安全，相信大家都会对这个地方非常向往一实际上，这个地方我们每个人都曾经有过，那就是我们  在子宫里的状态。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_2_0.png)


    # 子宫：人类的“原始舒适区”


    大家可以想一想，在子宫里，我们用不着劳动，甚至用不着吃饭、睡觉，一切的能源供给都是自动化的——我们在一个温暖的，由营养液组成的小小游泳池里自动地游泳。


    当然，在子宫里我们也不需要具备任何认知的能力——不需要视觉、嗅觉、味觉，更不需要思考。当所有的东西都是现成的，都是以高度自动化的方式提供给你的时候，“认知”就显得完全多余了。


    # 从“子宫”到“坟墓”


    丹麦哲学家索伦·克尔凯郭尔（Soren Aabye Kierkegaard）说过，所谓人生，就是从出生时的哇哇大哭到临死前的流泪满面。从子宫到坟墓，以眼泪开始，以眼泪结束，这一段漫长而又短暂的旅程，你觉得有多大的快乐可言吗？


    大家可能没有注意到，“子宫”和“坟墓”在英文里非常像，只差一个字母，一个是womb，一个是tomb。


    # 原始舒适区=0认知


    +   1. 伊甸园的故事

    2. 任何福音都是诅咒


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_2_1.png)


    大家还记得“伊甸园”的故事吗？上帝告诉亚当和夏娃“你们什么都可以吃，但有一棵树上的果子是万万不能吃的，吃了以后就会临死，就会  被逐出这个舒适区。”


    但是，在种种机缘巧合下，夏娃受到诱惑，摘了那个果子，不仅仅自己吃了，还给亚当吃了。上帝发现亚当和夏娃竟然有了感知和分辨的能力：当亚当和夏娃吃了这颗果子的时候，他们知道了因为自己没有穿衣服而感到羞耻。


    +   上帝把直接肇事者蛇的脚去掉，让它用肚子走路，而且人类永远与它为敌，看见蛇就会砸烂蛇的头；

    让夏娃必须要忍受分娩的痛苦；

    让亚当必须终年劳作才得以果腹，生命从此变成了一场苦役，再也不会像在子宫般的伊甸园里那样无忧无虑、超级舒适地生活了。


    今天和大家讲这个故事，是想分享一个观点：任何福音都是诅咒，或者说，任何好处都是有代价的。


    在一个超级舒适的地方，一个“超级舒适区”里，这种“超级舒适”是有代价的，这个代价就是——零认知。最舒适的地方就是那种不需要认知，所以你根本就不具备认知能力的地方。


    原始舒适区=零认知，或者是极其低的、接近于零的认知——在舒适区待着的代价就是零认知。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_2_2.png)


    今天我们讲到了“舒适区”，读过《红楼梦》的朋友可能会有印象，曹雪芹把他虚构的一个舒适区一贾府，形容为“花柳繁华地，温柔富贵乡”。这十字可以说是对“舒适区”一个很好的概括。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_2_3.png)


