    # 知识账本


    划重点


    人活在世界上，努力奋斗，希望达到什么样的成就，那就是外在的目的。另一方面，作为一个人，是否是一个完整的、完美的人？这个就牵涉到内在的目的。从这两方面来看，人生的幸福何在？就在于抵达了人之所以为人的形式与实现，等于你实现了一个人之所以为一个人的完全的形式。所以亚里士多德作为哲学家，他就做基本的规定，你的幸福就在于你成为一个人所应该达成的最完美的实现和完美的形式。


