  md: '# 认知退化与格物致知4 | 与物“格斗”，才能获得真认知


    认知退化与格物致知4 | 与物...


    这是我们第一模块第五单元的第四节课。这个单元的主题是：认知退化与格物致知。


    # 亨氏：“偷梁换柱”打破销售的天花板


    上个世纪上半叶，美国亨氏食品公司遇到了一个业务瓶颈：他们不管用什么手段，主打产品之一的番茄酱销量一直就上不去。


    为此，亨氏做了很多消费者调查。大量的统计表明，整个市场需求就是这么大，市场。。。


    后来，亨氏公司的一个高管在一个很偶然的场合里发现了一件事：他有一次去朋友家里，发现朋友的孩子特别喜欢把番茄酱挤在面包上做一个笑脸。这个小孩本来不爱吃饭，但是只要在食物上画出一个笑脸、红心，或是写上一个字母，小孩就变得特别爱吃了。


    这个事情让亨氏找到了灵感。他们专门生产了一种瓶装的番茄酱，能像挤牙膏一样把番茄酱挤出来，还像一支特殊的笔，可以在面包上画出各种图案和字母。


    这个产品一推向市场就非常畅销，亨氏番茄酱的销量大大突破了之前的天花板。


    有人把这种方式称为“偷换概念”：“偷梁换柱”地让一个旧产品获得新市场。在很多商业案例里都能看到这一点。


    比如太阳马戏团。在马戏演出的時候，他们发现观众对偶尔添加进去的人的表演特别感兴趣，于是就制定出了著名的“蓝海战略”：把马戏“偷梁换柱”，变成“以人为主角，动物为配角”的演出。


    虽然还是马戏，但实际上已经变成歌舞表演这种演出类型了。这样一来，过去一辈子只看两次马戏的人，变得每年甚至每个季度都要看“马戏”。


    无论是产品、服务，还是商业模式，都不过是一种对于客户需求的认知表达而已。你的认知限度就是你的产品和商业模式的限度，只有突破你的认知，才可能在产品和商业模式上成功实现基囿突变，推出新的物种。


    # 侦察兵：“火力侦查”捕获关键情报


    上节课我们讲到了侦察兵和司令官的区别：司令官应该是最高明的人，但他们之所以“蠢”，没有侦察兵聪明，原因在于，司令官在认知上形成了一种不健康的免疫系统，这个系统使他的认知不断固化、退化、萎缩，甚至变质，活生生地把司令官从一个聪明人变成一个“蠢人”。要优化和升级自己的认知，必须要将自己的身份从“司令官”切换到“侦察兵”。


    但实事求是地说，侦察兵看到的东西也是有限的。


    尽管侦察兵通过自己火眼金睛地观察，发现了很多重要的情报，但常常也会出现这样的情况：一旦开战，阵地上最重要的一些设施、据点，侦察兵并没有看到。比如突袭进攻的时候，很隐秘的地方出现了一个地堡，或者当部队开进的时候，突然遭到了三面的炮击——最关键的敌情只有在开战以后才能知道。


    这有点儿让人绝望：当你知道这个情报的时候，这个情报对你来说已经没用了。那么，如何在没有开战之前就能够知道最关键的情报，避免自己陷入到一个巨大的陷阱中呢？


    静观式的侦察可能捕捉不到真实的情报，只有“火力侦查”才可能获得关键情报。


    敌方的实力只有在最紧急、最危险的时候才能完全暴露出来，最好的侦察就是制造一个类似于真实开战的场景，这样才能捕获那个情报。


    # 狮子：佯攻策略提高捕杀成功率


    “火力侦察”不仅被应用在战争中，也不仅是人在用，动物也会用。狮子就经常采取这种战略。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_55_0.png)


    狮子对羚羊、斑马进行捕杀的时候，10次进攻中9次都是佯攻。


    据研究，作为“百兽之王”的狮子，进攻成功率只有不到1/7。其中的首要原因是：食物链上一定会形成一个动态平衡——这是动物进化的普遍规律。


    按照“马尔萨斯陷阱”的逻辑就是：狮子捕食太容易→狮子大量繁衍，种群的数量膨胀→羚羊不够吃→狮子饿死；与此同时，那些跑得慢的羚羊、斑马也会被淘汰，活下来的一定是跑得快的，狮子捕杀羚羊的过程也是促使羚羊进化的过程。


    这一系列的循环，就导致狮子的捕杀率一直很低。


    然而导致狮子捕杀不成功的，还有一个原因，是狮子的这次攻击根本就没想成功——狮子想通过攻击来观察这一群猎物里哪些跑得慢、哪些容易出屑、哪些容易落单，甚至在攻击的时候，使猎物在奔跑中受伤。


    狮子具有识别猎物错误的能力。当它在夜间发动一次佯攻时，能通过蹬脚声准确判断出猎物里哪只羚羊或者斑马的腿瘸了，或者发现有没有只猎物的腿是瘸的——这个过程就是一个“火力侦察”过程。


    如果狮子仅仅趴在那儿，然后出其不意地扑上去，成功率就会非常低。


    俗语说“不怕贼偷，就怕贼惦记”，狮子的攻击都是有目标的，它所捕杀的猎物往往都是它在之前进行了仔细识别和认知的，这种方式也是“火力侦察”。


    # “格物”：与物“格斗”


    无论是“番茄酱笔”，还是太阳马戏团，以及狮子的佯攻，其实都是一种“格物致知”。这个单元开始的时候，我们提到了“格物致知”。


    “格物致知”通常的解释是“自己的内心有各种规范和条理，然后将外在的材料纳入到我们已知的规范和条理，放到我们内心的格子里，形成一个认知”。


    但明朝的时候，有人不满于这种静观式的认知方式，重新定义了“格物致知”：把“格物”的“格”定义为“格斗”的“格”。


    格斗就是正面近距离的冲突。通过近距离接触、互动、冲突、博弈，获知对象的真实状况。所以“格物致知”的“格物”就是与物格斗、与物博弈、与物互动。他们认为只有通过这种“格物”才能够达到真正的认知。


    如果“格物致知”是一种认知方式，那么静观式、非互动的感知就不是真正有效的认知。真正有效的认知是接触，是冲突，是博弈。这种意义的“格物致知”在精益创业里体现得特别明显。


    任何一个产品都是我们既有认知的一个表达，这种认知很可能是错的，甚至全盘皆错。那么，如何纠正和优化你的认知呢？


    很简单：快速将这个体现你认知的产品推向市场，用产品在市场上进行火力侦察和佯攻。在佯攻过程中，发现关键的客户需求信息——这是对客户需求的新的升级认知。接下来，把这些升级的认知马上注入到新版本的产品中，再把它推向市场。


    事实上，一个完美或者接近完美的产品只是一个结果，而形成这个产品，需要一次又一次以尽可能小的代价、非致命的失败去不断更新新认知，最终生成一个对客户和市场有深度认知的产品。


    吴伯凡


    以前的课程里我们提到过一个观点：对于我们熟悉、认可的人，我们在下结论的时候常常是场景化的解释；而对于陌生人、不认可的人，我们常常是内心化、性格化的解释。改变对陌生人、陌生组织、陌生机构，甚至是一
    些陌生产品的偏见，最好的方法就是进行非静观式的认知，火力侦察式的认知。'
