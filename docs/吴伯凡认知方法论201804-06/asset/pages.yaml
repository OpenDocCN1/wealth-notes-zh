  md: '# 问答05 | 如何增加认识自己的维度？


    问答05 | 如何增加认识自己...


    # 在陌生的场景里遇见陌生的自己


    物理上的形体容易辨识，无非是观察的角度开阔一点或者换个角度，事物的全貌就可以看清楚。可抽象意义上的事物怎么办？尤其像人生这样的事情，谁能把人世百态都看尽了，谁又能提前预知自己走的路，做的决策是对还是错呢？


    这个问题确实很有典型性。我们在讲认知的时候，常常 UTF-8 物理现象作隐喻，比如“维度”，它本质上是一个物理概念，一维、二维、三维......由于我们对某个维度缺乏意识，以至于在认知我们所处的这个世界时，会出现致命的认知误区，甚至我们都不知道自己的缺失何在。


    但很多时候，认知世界也并不只是物理角度。比如我们在认识自己的时候，就会陷入到这样一种状态：我们并不知道我们是什么样子。


    通常说的“面死而生”，就是指“你只有站在生命的终点，回过来看你现在的生存状况，才能做更清晰地知道应该怎么活”。问题在于时间是单向的、不可逆的，我们没办法快进。


    在没法获得“全知眼”的情况下，我们如何尽可能扩展我们的视野，增加我们观察自我、观察我们生活世界的维度呢？我们会在后面的课程里专门讲到这个问题，现在我先和大家分享一段话，从中或许能够感受到一点儿“如何增加认识自己的维度”。


    +   1. 给自己做“哲学实验”


    山本耀司是日本的著名设计师，他说话有时侯很像一个哲学家。他说过这样一段话：


    > “自己”这个东西是看不见的，要撞上一些别的东西反弹回来，才会了解自己。所以，跟很强的东西、可怕的东西、水准很高的东西相碰撞，你才知道自己是什么。


    这段话听起来有点像蝙蝠：发射一个超声波，反射波回来，蝙蝠就能够知道猎物在呢儿。


    当你不能够增加观察世界的维度的时候，你可以增加、促进多样性和丰富性。我们不置入一个场景的时候，我们是根本不会知道我们是好的、坏的、高尚的、卑贱的......究竟是哪样一个人的。


    所以我们要经常给自己做一种“哲学实验”。事实上很多的电影，都是在做哲学实验：设定一种场景，人在哪种场景里呈现出通常状态下完全不能够显现的某种东西。


    如果我们没有那么多机会让自己置身各场场景，至少可以多看看电影，看看人在各种极限状态、极端场景里的呈现方式。


    +   2."火力侦察"


    > “物种”既是一种性状组合，也是一种生态位的表达。


    我们可以把一个人，包括我们自己都理解为一个物种。但是，这个物种到底是什么样子，你还真不清楚。在波动不惊的情况下，所有人都差不多，而一旦环境发生变化，人生生态就出现了。


    同样的道理，我们好像已经知道自我或自己了，但在一种实真其来的场景面前，我们的表现可能就是我们自己不知道的那个样子。说句很俗气、很鸡汤的话，“你需要在不同的陌生场景里遇见陌生的自己”。


    这不是一个“观察”问题，而是“侦查”，更确切的说是“火力侦查”。


    火力侦察在军事上的使用是很普遍的。它是有意制造出一种态势，看敌方会怎么反应——在静静观察的时候，这种反应是永远看不到的。


    # 同心圆结构&能力溢出


    这节课讲到了“去掉一切不创造价值的环节，能力够用即可”的道理。但是，我们以前也讲到了亚马逊公司那种多维度拓展、默默发展，看似没有回报的业务却获得巨大成功的例子。应该怎样理解这两种看起来有些矛盾的观点呢？我们怎么判断一个当下冗余的能力能否在未来发挥出作用呢？


    这个同学听得很认真。我们曾经在《伯凡·日知录》里提到过一个概念——“同心圆结构”。


    +   1. “同心圆结构”


    所谓“同心圆结构”是指：一个公司或者个人能力往往呈现为一种同心圆的结构，当你做一件事情的时候，这个能力的功用和功效常常是溢出它当下的对象和场景的。


    举个最简单的例子：如果你是举重运动员，你去扛大包的话，就可能比别人扛得多——虽然作为一个举重运动员可能一辈子都不会去扛大包，但是这种能力呈现为一个同心圆结构。


    再比如，一个间谍有独特超凡的读心术，这种能力对于他的本职工作显然是非常重要的，但他的这个能力绝不仅仅限于他干的这件事情，还有超出他本职工作以外的其他应用场景。


    所以我们看到，一个间谍既是一个窃取情报的高手，也是一个“偷心”的高手——事实上，很多间谍片都有两条并行的线索，其中一条就是：间谍能在很短几分钟之内征服异性的心。这就是他的能力。


    +   2. 能力溢出


    我们讲到亚马逊公司的能力呈现为“同心圆结构”的时候，有这样一个事实：亚马逊在服务客户的时候能够做到极致。当你做到极致的时候，你的能力自然会溢出你眼前的应用场景和客户人群。


    亚马逊是如何做的呢？比如当客户来买一本书的时候，你可以给他推荐对他同样适用，甚至比这本书更适合他的书。普通的书店是做不到这一点的，因为这需要庞大的数据存储能力、挖掘能力，以及针对一个具体客户进行的基于人工智能的个性化推荐。


    你在打造一种极致的购买体验的同时，你的能力就已经溢出既有的应用场景和客户人群了。


    当然，营造一个良好的客户体验不仅仅是进行个性化推送，还要以最快的速度将他所买的商品送到他手里，这就需要一个非常强大的供应链和物流管理能力。当供应链和物流管理能力足够强大的时候，你会发现这个能力能够实现的功能和所创造的价值已经溢出你现有的业务范畴了。


    你要尽可能地做一个规模很大、效率很高、品种很多，客户选择的时候能够获得丰富性和精准性的这样一种很好的购物体验。当客户获得了这种体验的时候，你的能力也就达到了某种极致，而这种能力同样又超出了现有的范围。


    亚马逊现有的三大支柱型新业务都是从它既有的核心业务中拓展出来的，这是“能力溢出”的概念。


    +   3. 打造核心价值


    让你的能力达到极致，以至于你的能力出现某种明显的外部性，可以大量溢出到新的应用场景里，呈现出巨大的能量——这跟“去掉一切不创造价值的环节”不仅不矛盾，而且是相通的。


    这么说是因为，你的能力要做到极致就需要心无旁骛，几乎是绝对地以客户的需求为中心。在你对客户的需求进行深刻感知的同时，你又有巨大的动机激情和能力去满足客户的需求，而其他相关的东西，你要把它们去除，要自然忽略。你的能力就像金刚石一样，获得了锐利和硬度。相反，那些对自己的客户缺乏深入洞察，也没有深入洞察的强烈渴望的时候，就会做很多“不创造价值”的事情。


    常常会有这样的情况：什么能够让我暂时获得一点点利益，我就去做什么。这样做的结果就是：表面上你获得了某一小利益，实际上，大量的资源和能力都用在了不创造价值的环节上，以至于你缺乏一种核心能力——缺乏核心能力，就不可能形成“同心圆结构”。


    《伯凡·日知录》：同心圆思维'
