  md: '就表现得特别优异。


    吴伯凡


    我们刚才讲到了一个观点：麻瓜是如何炼成的。俗话说，“冰冻三尺非一日之寒”，麻瓜也不是一天造就的，而是一种麻瓜的感知方式、生活方式造就了麻瓜的认知设备和认知品质。所以，爱因斯坦说“游手好闲的学习并不比学习游手好闲好”。大家可以问自己一个问题：我的学习状态和认知状态在多大程度上是在远离游手好闲的学习？


