  md: '# 问答｜既然认知意味着痛苦，为什么不能选择舒适？


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_24_0.png)


    问答｜既然认知意味着痛苦...


    《吴伯凡·认知方法论》开课以后，有些问题被反复问到，这次问答我们就来回答两个非常有代表性的问题。其实在我看来，这两个问题也可以合成一个问题，答案也可以合成一个答案。


    按照吴老师的公式：原始舒适区=零认知，要想提升认知就是不舒适呀！那这个是不是很反人性呢？人不可以在大部份时候做个追求舒适的人呢？这样不好么？


    认知就一定是痛苦的吗？就像运动后产生的多巴胺能让人产生快感，因此让人爱上运动。认知是否有可以机制能让人产生快感，让人爱上认知呢？


    对这两个问题，我的统一答案可以用一个词来回答：痛快。


    “痛快”我们经常说到，但并没有仔细品味过它的含义。


    # 1. 犬儒主义


    第一个同学的问题可以上升到一种哲学流派：犬儒主义（cynicism）。


    古希腊有一个哲学家叫第欧根尼，他发明了一种学说，认为人在这个世界上不需要太多的东西，没那么多雄心壮志，完全可以像狗一样活着，活着就好。比如人没有要去住那些宫廷般的房子，只要有一个小小的窝就可以了——第欧根尼自己就没有房子，住在一个大缸里。


    他的这种哲学受到当时很多人的认可，很有影响力。


    当时还有一个大有作为的人，跟第欧根尼持有截然不同的人生观、世界观，他就是征服了欧亚非，建立了一座大帝国的亚历山大大帝。


    有一天，亚历山大大帝听说第欧根尼就在附近，就很有兴趣地想去见他。当他发现第欧根尼的时候，第欧根尼正蜷缩在一个坛子里。


    > 亚历山大大帝：请问，有什么我可以为你效劳的地方吗？


    > 第欧根尼：你别挡住我的阳光就好。


    第欧根尼蜷缩在坛子里晒太阳，他觉得这样就很好——这是第欧根尼认为的一种原始舒适状态，这就是“犬儒主义”的哲学。


    # 2. 舒适的逻辑


    现在，我们来分析一下，这种舒适的逻辑是什么呢？


    所谓“舒适”，是不被打扰、无需努力、不与环境冲突、不付出任何努力地活在这个世界上，最好是用一个类似于子宫的坛子把自己装起来，不和这个世界打交道。


    # 3. 追求积极的快乐


    著名的游泳运动员菲尔普斯（Michael Phelps），就是追求积极快乐的典型。


