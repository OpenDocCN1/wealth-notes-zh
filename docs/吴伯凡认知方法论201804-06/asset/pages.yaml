  md: '# 问答 | 为什么说“盲维”是“认知升级”的重要概念？


    问答 | 为什么说“盲维”是“认... ↓


    这一周刚刚开课，就有很多同学提了很多问题，其中某些问题密集度很强，比如有一个问题，大家就特别关心。


    希望吴老师可以谈谈，怎么让身边认知地局限小、盲维多的人不要阻碍具有更高认知的人行事？以及，在明白自己认知有局限的情况下，怎么产生勇气去“正确地犯错误”？


    吴伯凡


    开学直播的时候，罗胖讲他最近一直在各种场合里传播我的“盲维”概念。其实“盲维”这个概念是我自己杜撰的一个词。


    我们以前经常说“盲点”——blind spot，就是看不见的点。由于我们受到各种限制和约束，使得我们对某些点，像信息点、知识点这些，缺乏感知。


    # 1. “你为什么迟到？”


    # 2. 考虑场景，还是直接定性？


    # 3. 什么是“盲维”？


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_9_0.png)


    # 4. 商业领域的“盲维”


    上面我们说的是一些比较感性和生活化的例子，实际上，在商业领域，“盲维”也是一个很有用的概念。'
