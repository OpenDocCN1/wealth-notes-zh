  md: '# 003 | 眼前的世界是真实的，还是虚幻的？


    003 | 眼前的世界是真实的... ↓


    说到认知的时候，我们会想到两对概念：真和假，有和无。


    你看到的东西是有还是无，是真还是假，这显然是哲学的概念，但它却不是哲学家的专利。可以说，古今中外的文学家、艺术家都在像哲学家一样探讨这个问题。


    # 梦：严肃的哲学问题


    我们中国最伟大的文学作品之一《红楼梦》探讨的就是这个问题：假当真时真亦假，无为有时有还无。


    很多我们现代、当代的一些作品里，也一直被这样的问题所纠缠。比如电影《盗梦空间》在探讨的问题就是：我们自以为认识的这个世界，它的真假程度如何呢？它到底是有还是无呢？


    当你身处一个场景，你肯定要奋斗，要做判断，要做改变，但是，你别忘了一个前提：你现在身体，到底是在梦里，还是在现实当中呢？如果，你是在梦里，那是在梦的哪一个层级里呢？


    否则，你的所有行为都是忘记大前提的行为，当你忘记大前提的时候，就无所谓对错了。


    假如你生活在一个完全虚假的世界里，你的所有认知，连同你的行都都是虚妄的。


    庄子是中国思想史和文学史上最早提出这个问题的人。


    说到庄子，我们就想到了梦——“庄周梦蝶”。庄子做了一个梦，梦见了蝴蝶，他的第一反应是：到底是蝴蝶梦见了我，还是我梦见了蝴蝶？到底是我在一个梦里见到了蝴蝶，还是我只是蝴蝶梦境里的一个虚幻的存在？


    印度教有一个观念：这个真实的世界不过就是温婆的一个梦境而已。我们看过《少年派的奇幻漂流》里就接触过这个观念。


    所以，关于梦的探讨是一个非常严肃、非常重大的哲学问题。


    # 《黑客帝国》：选择真实or虚幻的世界


    我们昨天说到的电影《黑客帝国》里的主人公安德森，还有一个名字叫尼奥。把尼奥从虚幻世界，也就是从母体世界里提升到一个真实世界的那个关键人物是莫菲斯先生。当然，还有一个人叫Trinity，她的中文译名是“崔尼蒂”。Trinity是基督教的概念，叫“三位一体”。这里说的是，尼奥、莫菲斯和崔尼蒂，他们三个人是一体的。


    莫菲斯先生又sprache? 就是梦神，主管梦世界的神。


    梦神住在一个跟现实隔离的世界里，这个世界是一个相对安全世界。在梦神的世界里，他的地盘大门口有两只巨兽守着大门，大门前面是一条河，叫“望川”。望川的对岸就是真实的世界。如果你从真实的世界到梦的世界的时候，就要过这条河，而只要你过了这条河，就会把现实的东西给丢掉。


    ![](img/eb05ae7c5cb060b5ae7097cf28776eb4_5_0.png)


    《黑客帝国》这个电影有一个很关键的情节：莫菲斯拿着药丸，一片红色的，一片蓝色的，让尼奥做选择。


    他对尼奥说：“你如果吞下蓝色的药丸，就会把你所有感应到的那些隐隐约约的东西都丢掉，你会进入梦乡，重新回到母体，舒服服地过着快乐的日子；如果你选择红色的药丸，你就会进入到真实的世界里来。”


    莫菲斯给尼奥的选择就是：你是愿意在河的这一边，还是在河的那一边？


    ——这个世界本身就是两面，或者说，在真实世界的背面是一个虚幻的世界，我们常常不知道我们自己到底是在真实的世界，还是在虚幻的世界里。


    《红楼梦》里说“反认他乡为故乡”，中国还有一句诗“梦里不知身是客”。当我们是一个流浪者、一个漂泊者，我们在梦里的时候，是意识不到我们是一个流浪者、漂泊者的。


    《黑客帝国》里有一个细节，尼奥去见Oracle（先知），Oracle看着门上的几个字，拉丁文的“认识你自己”。这句话也是有来头的，它跟苏格拉底有关。


    雅典人看说，苏格拉底是雅典最聪明的说，他什么都知道。


    苏格拉底说，“我唯一知道的就是我不知道，而你们也不知道，但是你们不知道自己不知道。”


    这说的其实是一个说其实是隐喻：虽然我的身体在一个虚幻的世界，但是我知道这是一个虚幻的世界——这就是你的认知比别人高一个维度的标志。而我们普通人都是身在一个虚幻的世界而不自知，反认为这个虚幻的世界是一个真实的世界。


    你生活在一个假世界里，觉得眼前的“花柳繁华地，温柔富贵乡”是一个真实的世界，那你就错了。


    # 认知：认出世界的真实性和虚幻性


    可以说，不管是中国哲学还是欧洲、印度的哲学，首先都要解决一个问题：我们所在的这个世界是真实的还是虚幻的。


    所谓“认知”，首先就是要认出这个世界的真实性和虚幻性，要不然你岂不是瞎耽误工夫！


    +   1. “知道你自己在什么地方，才真正是明白的”


    我们经常说“奋斗首先要搞清楚自己是站在一个什么样的扶手电梯里”：如果扶手电梯是往下走的，你的奋斗会是一件很悲催的事情，你应该选择一个向上走的扶手电梯。如果你不分青红皂白说要奋斗，随便就踏上一个扶手电梯，那可能会是一个非常悲剧的事情。


    +   2. “在泰坦尼克号上争头等舱”


    IBM的前CEO郭士纳在回忆如何把IBM从破产边缘拉回来的时候说过，他做过几件正确的事情，其中有一件事情非常关键，就是大胆结束昨天的战争。他发现IBM当时做的事情是在打一场昨天的战争，或者说是在打一场已经结束的战争。


    吴伯凡'
