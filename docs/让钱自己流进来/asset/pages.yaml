- pgno: 38
  md: '![](img/45ed87579d2623bf73161960ce2430a7_38_0.png)


    全球之冠，每年工作要 2282 小時，但是根據人力銀行的調查，工時最長的台灣，其中 9 成上班族都有加班的經驗，但是有一半數以上的人，加班完全沒有加班費。


    如果不喜歡眼前的工作，那麼長時間、長年的工作，像不像人間煉獄？愛上我們的工作，或找一個我們愛的工作吧！人生，是來享受的，不是為了錢而忍受的。


    一般人只是隨機選擇自己的工作職場，哪個公司通知，就在哪家公司上班，甚至一做就一輩子，不知老之將至。這麼長的工時下，完全失去時間的自由，每天除了上班之外，就是舒壓，或是睡覺，很少時間可以追求自己人生的理想，最後將自己的生命賣在工作上。


    除了沒有時間自由外，有些人長時間的工作，健康也會亮起紅燈，因此連健康的身體都保不住。往往在路上碰到開計程車的朋友，每天工作十五小時以上，這樣賣命的工作，收入卻不見得相對的增加。競爭者變多，顧客消費能力不斷下降，當掙錢的速度趕不上通貨膨脹時，追求品質好一點的生活竟已變成遙不可及的欲望。這時我們的財務，如何可以獲得自由呢？


    以上三個問題，答案如果都是前者，那向貧走的跡象就很明顯了；為了避免向貧走，必須有計畫的規畫我們的時間與目標，在 M型社會裡往富有的那一邊移動。'
