- pgno: 162
  md: '學了那麼多理論，掌握了那麼多的知識，為什麼依然不能成功？為什麼屢屢失敗？一個最重要的問題就出在自己的身上，那就是執行力出了問題。執行力是貫徹實施決策計畫、及時有效解決問題的能力，執行力也是一種紀律，是策略的根木。


    很多優秀的人都擁有聰明的腦袋和過人的智慧，然而能夠成功的只是極少部分懂得執行的人。僅僅擁有偉大的思想戰略和偉大的計畫是不夠的，只有把戰略和計畫貫徹到底才能獲得成功，這就是執行力。沒有執行力，就沒有成功，所有一切都是空談和妄想！


    執行是戰略而不是戰術，執行能力只能從執行中獲得，不可能透過思考獲得。只有把知識力和執行力結合起來，才能擁有知行合一的能力，才能真正變得強大！只有「執行力」，才是一切有效戰略的關鍵要素。沒有執行力不可能做好任何事，執行力必須成為事業的核心成分。操作不能成功，總是在屢戰屢敗中徘徊就是沒有執行力的表現，執行力是一切的關鍵。


    執行，沒有藉口，別一碰到挫折就想著放棄。


    # 永遠別在距離黃金三呎處放棄


    在淘金的年代裡，有一個人名叫達比，一心想發財。所以他表示了一塊地，拿起鋤、鏟便開始埋頭工作。辛苦了幾'
