- pgno: 68
  md: '![](img/45ed87579d2623bf73161960ce2430a7_68_0.png)


    想，當天氣稍微暖和一點，先融化的一定是小雪球，因此窮人的雪球若不大，每當經濟不景氣，窮人一定首當其衝，受到波及。


    其實，簡單的改變消費支出，也可以輕鬆致富。在著名的暢銷書《富爸爸，窮爸爸》一書中，作者羅勃特特喬（Robert T Kiyosaki）一針見血道出一般人最常犯的理財誤\

    誤，他說：「富人和窮人最大的差別，在於對資產負債的觀念不同。」


    所謂資產，就是買了之後，還可以生財，能把钱持續放進口袋裡的東西。而負債，就是用了就沒了，只是把钱從口袋取出。如果想變成長富有，需習慣性的選擇購買資產；而窮人沒有這個觀念，因此不斷買入負債。也是因為一般人分不清清楚資產和負債的差別，而一再買入他們以為是資產的負債，造成世界上絕大多數的人，終其一生都在財務的泥沼中掙扎。


    就像很多人一有錢就想買房子，但是房子到底是負債還是資產呢？


    對絕大多數的人來說，擁有一棟屬於自己的房子就有了安定，也是人生最大的夢想。如果你也這麼認為；房子等於資產，那麼就是修正觀念的時候了。當我們貸款買了房子之後，房子會不斷產生支出，包括每個月的貸款，還需繳交各種稅、修繕費用……等，好端端的資產卻形成負債。'
