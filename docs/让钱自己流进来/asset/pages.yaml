- pgno: 153
  md: '如果我們浪費十分鐘時間，等於浪費一千美元，我們會更小心把十分鐘花在什麼事呢？時間就是財富！財富，是生命價值實現的結果。


    如果我們每天都收到86400美元，而要求我們每天必須把它用完，否則上帝就會把這些錢回收。想想，我們該如何珍惜與運用？


    天下真有如此好事。上帝公平的給每個人每天86400秒進帳，使用的方式不同，得到的財富也天差別。


    用秒計算的人，比用分鐘為單位計算的人，人生密度多出六十倍。


    時間，對於成敗是絕對有影響力的。比起運用財富，運用時間顯得更加重要，若想致富，必需重視時間所創造的價值。管理時間的水平，決定事業的成败。


    每個星期有168個小時，其中56個小時在睡眠中度過，21個小時在吃飯和休息中度過，剩下的91個小時則由我們來決定做什麼——每天13個小時。如何分配在最有產值的事，是一項重要的技巧。它使我們能控制時間，按輕重緩急順序工作，不致在忙亂中虛度生命。


    時間管理其實是效率管理，在有限的時間，做出最多有效的事。生命中最重要的是是在最短時間內，實現更多自己想要實現的目標；可以把心中4到10個目標寫出來，並依次'
  merge: -1
  img_proc: true
- pgno: 154
  md: '![](img/45ed87579d2623bf73161960ce2430a7_154_0.png)


    排列重要性，然後依照先後順序設定詳細的計畫，合理的規畫完成時間。


    記住：用 80% 的時間，來做 20% 最有產值的事情。我們一定要瞭解，哪些事情是最重要的，是最有生機力的，而哪些是雜事。事情，有所謂緊急的事情、有重要的事。


    成功者花最多時間在做最重要的事，可不是最緊急的事情。重要的事，都是所謂高生產力的事情。然而一般人都是做緊急，但不重要的事。必須學會如何把重要的事情在第一時間內完成，學會立刻做高生產力的事情。


    失敗者當然會選擇緊急，但不重要的事情，通常這些都是一些突發困擾，一些災難，一些迫不及待要解決的問題。如果天天處理這些事情，表示失敗者時間管理並不理想，當然失敗。


    每一分鐘每一秒，做最有效率的事情；必須思考一下要做好一份工作，到底哪幾件事情是對我們最有效率的，列下來，分配時間做好它。


    聖誕夜，一間還沒打烊的孩子玩具的店，小男孩的父親終於問店員：「這個模型要多少錢呢？」


    「五十元！」店員毅仞的回答。


    「五十元。」父親又問「你能不能賣便宜一點呢？」


    「實在很抱歉，它的價格就是五十元。」'
