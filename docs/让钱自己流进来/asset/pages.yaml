  md: '想想你目前的工作能幫你自帶來幾次報酬？賣的東西是一生能用幾次？今天找的客戶，是不是明天還會來消費？很多種選擇，事實上是可以帶來多次獲利。例如：詞曲的作者、分股的行銷顧問、房東收租金、發明者註冊專利、架設網站日夜收點選費用、廣告通路費、企業家架構系統收加盟金、傳直銷、保險經紀人建構組織做系統倍增……等許多行業，都有可能讓我們得到更大的報酬。


