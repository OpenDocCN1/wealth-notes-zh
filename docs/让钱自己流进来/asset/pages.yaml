    # 向窮走？或向富走？


    身為蟻奴，

    運自己的命運都是別人給的，

    因為他們所創造的財富，

    只不過是為了活命。


    蓄奴蟻，是產於美洲的一種特殊蟻種。周遭的蟻穴是她們侵略的目標，以殘暴的性格掠奪鄰近巢穴的食物，不願以勞力過生活的蓄奴蟻，以俘虜蟻奴為生、攻擊蟻巢為樂。她們囚禁全部的活口，被抓來的蟻蟻全部成為奴隸，這些奴隸的命運十分淒涼，為了生存，什麼粗活都得承受，隨著時間的流逝，這些被禁錮的蟻奴，竟也漸漸習慣了勤奮的奴役生活。


    令人難以置信的是，蓄奴蟻每一次出擊，總是懂得留下數量驚人的雌雄蟻奴，令她們持續繁衍後代，才能創造出源源不絕的蟻奴。


    身為蟻奴，運自己的命運都是別人給的，因為他們所創造的財富，只不過是為了活命。'
