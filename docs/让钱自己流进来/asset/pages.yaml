  md: '這就是主雇之間的關係。想靠一家公司養老，在現今的社會是幾乎不可能的事。企業主有企業主的壓力，財務問題必須靠自己解決，老闆的工作是發新資給我們，不是讓我們致富。故事中的老狗，當自己對於大環境還有利用價值時，沉浸主人的寵憐中，等到某天發現自己競爭力不再，才驚覺連生存的要義，都完全掌握在主人的控制中。


    我們必須決定自己的命運，不要忘了工作時，青春及最偉大的人生價值正一點一點的消耗。工作，是為了實現人生價值，創造自己的核心能力。如果工作職場裡學不到任何東西，大可一腳踢開老闆。


    工作，是為學習，不要貪圖老闆給了多少錢。錢，是自己會追進來的，必須懂得方法。如果光靠工資就能致富，是不可能的，而且，光靠上班那一點微薄的薪資，根本連養老都不夠。隨著年齡增長，新人會在職場上搶走最好的工作。我們不能不做任何改變，而要求財務狀況有所改進。別讓自己人生的路越走越窄，如果要致富，是不是應該幫自己創造什麼呢？


