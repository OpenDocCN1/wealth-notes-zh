    # ## 學習把負債變資產


    貧窮的人為有錢人工作，


    貧窮的子孫就得替有錢人的子孫工作，


    一代接著一代。


    除非有人發現打破這個貧白的辦法，


    否則貧窮是會遺傳的。


    貧窮是一種習慣，不是口袋金錢的多寡。


    每個人每天的時間是相同的，有人利用它來打工，賺取約八十元的工資。也有人將時間拿來教書，每小時賺取約五百元，也有人拿來上網咖，但是要付三十元場地租借費，時間擺在哪，可以決定我們是不是富有的人。


    錢也是一樣。別小看金錢，區區幾個買香菸的零錢，只要擺對地方，也可以輕易脫離貧窮。**貧窮，其實是一個觀念問題，貧與富只在會不會使用知識與工具**，如果懂得運用零錢，加上複利概念，窮人也可輕易翻身，甚至成為億萬富翁。


    如果每天存四十元，每年約存一萬四千元，找一個年'
