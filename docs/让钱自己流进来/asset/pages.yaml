  md: '願意看著別人有骨頭吃，自己沒得吃。


    過了一段時間，問題又出現了，大兔子非常難捉到，小兔子好捉。但捉到大兔子得到的獎賞和捉到小兔子得到的骨頭差不多，獵狗們儘於觀察發現了這個竅門，專門去捉小兔子。慢慢的，大家都發現了這個竅門。


    獵人對獵狗說：「最近你們捉的兔子越來越小了，為什麼？」


    獵狗們說：「反正沒有什麼大小的區別，為什麼費那麼大的勁，去捉那些大的呢？」


    獵人經過思考後，決定不將分得骨頭的數量與是否捉到兔子來分，而是採用每過一段時間，就統計一次獵狗捉到兔子的總重量，按照重量來評價獵狗，決定一段時間內的待遇。於是獵狗們捉到兔子的數量和重量都增加了，獵人很開心。


    但是過了一段時間，獵人發現，獵狗們捉兔子的數量又少了，而且越有經驗的獵狗，捉兔子的數量下降得就越厲害，於是獵人又去問獵狗。


    獵狗說：「我們把最好的時間都奉獻給了您，主人！但是我們隨著時間的推移會老，當我們捉不到兔子的時候，您還會給我們骨頭吃嗎？我不得不為自己私下儲存一些骨頭啊！」'
