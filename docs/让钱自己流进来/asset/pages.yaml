  md: '![](img/45ed87579d2623bf73161960ce2430a7_24_0.png)


    產性的消費，如果連第一步都走不出來，只好終其一生窮困潦倒了。


    貧富，只有一線的差距。不妨想一想：好學生會吃飯，壞學生也會吃飯；好學生會睡覺，壞學生也會睡覺；好學生看到女生會心跳臉紅，壞學生當然也會，搞不好心跳的次數還會更多。好學生與壞學生的生活，其實有百分之九十九是類似的，只是其中有百分之一的差別，好學生就變壞學生了。富翁與乞丐之間也一樣，只有百分之一的不同，失之毫釐，差之千里。


    所以，為什麼每個家庭面臨不同的命運，有的家庭大富大貴，有的則只能數著米下鍋；有的人家活得非常充實幸福，有的人家卻庸庸碌碌毫無作為……，許多人都會有這樣的疑問，為什麼同樣是人，命運卻有如此大的區別呢？思考的結果是，有人把命運的好壞歸結於家庭出身，也有人驚覺是自身的態度及選擇，決定了命運。


    一個人若無法超越環境的限制，絕對做不出什麼大事。


    觀念決定命運，財富源於方法。財富狀況，根本源於每個家庭對財富的觀念。'
