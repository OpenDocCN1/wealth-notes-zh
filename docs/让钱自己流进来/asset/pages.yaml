  md: '獲利百分之二十的機器，用複利滾存，能想像嗎？四十年後，會擁有多少錢，答案是將擁有超過一億的資產。


    不同的人把金錢放在不同的地方，對金錢做不同的投資。而洞悉致富的方法後，賺錢，只是簡單的把事情重複做。有錢人洞悉這個方法，週而復始重複做相同的事。而窮人也依循自己的方式，任意資產不斷蒸縮。


