    # # 借力


    我

    帶兵建將不如韓信，

    組織人心不如蕭何，

    運籌帷幄遠不及張良。

    我只懂得借力。

    我是大漢天子—劉邦！


    幾十位遊客前來釣魚場遊玩，看到兩位釣魚高手，身手俐落一隻隻釣上，遊客都希望像高手一樣，滿載而歸。


    甲高手不發一語，拚命將魚一隻隻釣起。乙高手卻放下釣具，轉向人群提高分貝說：「我專教釣魚技巧！不過你們掌握要領以後，記得每釣五隻要送我一隻喔！」


    遊客同意了。一個下午，雖然乙高手花時間指導遊客，自己無法釣魚，最後得到的魚，卻比甲高手多數倍，另外，也結交到更多的好友。


    富人比窮人更會運用槓桿。給我一根夠長的棍子，一顆夠堅硬的石頭，我將可以槓起全世界。如果想要有錢，就需要學會使用槓桿，如果想要很多錢，就需要學會運用更多槓桿。'
