  md: '模式，有做才有收入，沒做就沒收入，用生命賺錢，只能追求溫飽與安定。用生命賺錢的家庭，無法承受巨大的意外風險，一旦發生意外，不能再工作了，全家隨即經濟崩盤。


    所以，你是一個人單打獨鬥，沒有創立任何的組織或致富系統，只靠著時間換得收入嗎？如果「是」，一個人單打獨鬥，可以拚出多少財富呢？


    台塑王永慶，只有小學學歷，但是他全球有4萬名員工，每個員工每天工作8小時，每天就有了32萬小時在爲他賺錢，也就是我們工作二輩子賺的錢，王永慶一天就能賺到。


    有人說，全世界的巨富都在做兩件事情：(1)建立系統；(2)尋找頂尖的人才：以建立更大更棒的系統幫他們賺錢。他們都懂得運用別人的時間和金錢致富，但卻沒有一個有錢人是靠單打獨鬥而致富的。


    如果我們已深知這個道理，還會選擇當一個孤軍奮鬥的孤獨者嗎？


    # 三、你已經決定活到老、做到老了，還是有累積持續收入的計畫？


