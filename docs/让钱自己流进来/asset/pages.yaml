    # 【前言】

    當富人的野心


    一位剛過世的億萬富翁，臨死前委託律師在紐約時報刊登了一則廣告：「我從小白手起家，一路打拼，已有花不完的錢。如今就要離開美好的世界，唯一的願望是不想把致富的秘密埋進土裡。因此舉辦了一場有獎徵答，請大家猜猜看，到底窮人最欠缺什麼呢？如果有人答對了，我就把美金
    100 萬元送給他。」


    到庇窮人最欠缺什麼呢？短短一年內，回信如雪片般飛來，有人認為缺乏貴人相助、缺乏資金、機會、生不逢時……等，各種有趣的答案紛紛出籠。最後，卻由一位九歲女孩答對，並獨得億萬富翁的獎金。


    答案是：窮人最缺之當富人的野心。


    記者好奇的詢問九歲的小女孩，怎麼會知道答案呢？女'
  merge: -1
  img_proc: true
- pgno: 19
  md: '孩回答：「因為我有一位十一歲的姊姊，她每次帶男朋友回家都會警告我：『你千萬不可以對我男朋友有野心。萬一你一起了野心，我怕我的男朋友會被你搶走。』所以，我想到不是只要有野心，就可以得到任何東西？於是我判斷，窮人最缺乏的，應該是『當富人的野心』。」


    溫世仁在《成功致富又快樂》一書中提到，**成功是一種觀念，致富是一種責任，快樂是一種權利！**溫世仁剛出社會時，全家住在一個破舊的房子，他立志終結貧窮。成功後，買了一棟全新房子，他流著淚告訴媽媽及太太，這輩子什麼人都可以當，就是不可以再當窮人！


    你有當富人、改變自己家裡世代命運的決心嗎？有成為億萬富翁的野心嗎？只要改變一些觀念，錢，是會自己流進來的。沒有無法改變的窮口袋，只有無法改變的窮腦袋。只要願意改變，透過學習，任何人都能擺脫貧窮，擁有財富。貧富，其實只在一線間。


