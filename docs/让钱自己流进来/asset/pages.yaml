  md: '# 【推薦序】


    # 貧、富間只站在了兩個字「觀念」


    對富人來說，

    金錢是拿來投資並創造財富的「資產」；

    對窮人而言，

    金錢的功能只是取得生存的工具。


    陳光是我求學時代最要好的同學。他在我心目中，是一位樂於助人、並散發陽光氣息的男孩。記得大學時代，我們一起研究財經、投資新趨勢，那一段令人難以忘懷的學生歲月啊！彷彿整個社會經濟部掌握在我們研究生的報告裡。


    某些特定的因素，讓陳光長期且持續關懷貧單。看過陳光的《工蟻》、《學富致富》等書，在在告訴大家：貧窮，只是一個觀念，絕不是口袋裡金錢的多寡問題。由於M型社會的衝擊，這次陳光與景富攜手合作共同推出《讓錢自己流進來》一書，直接點出許多民眾對於財富知識的不足，長期陷入金錢追逐的無辜。書中結合兩人專業的財經背景與長期豐富的實務經驗，道出貧者與富者在觀念上的一些差異。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '對富來人說，金錢是拿來投資並創造財富的「資產」；對窮人而言，金錢的功能只是取得生存的工具。對待金錢的方式不同，決定你與金錢有沒有緣分。窮人更因為沒有轉投資的觀念，造成與富人的距離日漸擴大。觀察陷入貧窮的朋友，才發現他們無法致富不是因為不努力，而是不瞭解現金流的動向。


    發現並掌握財富脈絡，才是致富的關鍵。有句話說：「貧窮的人太忙了，忙得沒有時間瞭解如何賺錢。」如果只靠生命賺錢，最後會在M型社會的衝擊下，一步一步走向貧窮的一端。現今大部分的社會現象是，為了父母的奉養費、子女的教育費、車貸、房貸……等，多數人用盡一生的時間忙碌奔波，不要說致富了，最後連過養老金都找不到。


    誠如陳光學所言：人的一生，只為賺得足夠的金錢，來看清楚整個世界，只可惜很多人努力了一輩子，最後連金錢都看不清楚。如何克服M型社會造成的危機？陳光學豐富的資本合著，以深入淺出的內容，幫助更多人發現脫M型社會的方法。我以為，瞭解並實踐本書的內涵，必能找到脫離貧窮的方法，進而尋得財務真正的自由。


    群益證券／副總裁


