  md: '# 時間管理的能力


    財富的多寡，

    是多效的運用時間的結果。


    相傳在微軟的機構裡，一羣人準備測試世界首富比爾蓋茲。在蓋茲前往會議室準備簡報的過道上，故意放一張百元的鈔鈔。沒想到蓋茲視若無睹，完全沒有考慮撿或不撿就走過去了。


    同事們耳語：「難比爾蓋茲早已不為金錢所動了嗎？」


    蓋茲走進會議桌前，對所有同仁說：「我知道你們在對我做測試。一張百元美金，到底值不值得彎下腰去撿？估算一個人創造財富的速度，一分鐘若能超過一千美元，對他而言，彎腰那幾秒鐘，太不划算了。」


    據說，那張百元美金一直在通往會議室的走道上，沒有人會彎腰，也沒有人會考慮把它撿起來。'
