    # 本世紀致富的關鍵


    歡開大賣場像家樂福、大潤發，很多人想要賺錢，就跟著財團的腳步，投資或加盟財團的賣場，因為財團不只有錢財，還有很多人 才。可是問題是開個大賣場要花2億，開個一般的便利超商，少說也要2百萬，這一般的市井小民可能做不到，即使做到也未必賺錢，就算賺錢也非常忙碌，所以日用品的市場雖然很大，但是大部分的人，卻永遠只能當個消費者。


    未來的趨勢，是商店直接與消費者合作，直接讓消費者參與廣告通路的經營權。很多大賣場提出打折策略，永遠無法抵抗將龐大通路費回饋給消費者的誘因。網絡直購超商以其不用店租成本的優勢，將利潤還給消費者，即將改變消費者的購物習慣，如果再加上環保、生科科技的議題，那將會緊抓下世紀的消費群，這又是一波財富重新分配的契機。


