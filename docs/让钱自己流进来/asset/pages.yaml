  md: '學歷代表過去，只有學習力才能代表將來。學習和呼吸一樣重要，學習力就是成長力，不持續學習，就停止成長，停止成長就是退步，被拋棄在後面，成為落後者。有句話說：「人類生存一天，就需要學習，否則，我們與禽獸何異？」


    如果我們已經窮途末路，記得還有張王牌可以投資：我們的大腦。我們必須學習，投資更多的精力在學習，而不是拿自己僅剩的錢來投資。


    貧窮的人通常都是不學習的。和大陸、印度龐大渴望成功的人相比，如果不加強學習，這些國家的低工資、高效率會讓台灣的競爭力蕩然無存。有句話說：「現在台灣的大學生玩4年，大陸卻是拚4年。」知道嗎？在大陸懂英文的人已超過美國人了，如果沒有自覺，我們的下一代將成新的台僮或台勞。


    億萬富翁具備持續不斷的學習力。高清愿，每天都要看幾小時的書，以增加洞察事件的能力。學習力培養判斷力，是決勝的關鍵。


    許多人認爲，成功者要付出精神在工作，而失去休閒時間。難道，失敗者就可以過著瀟灑、自在的生活嗎？那倒未必，失敗者不肯付出努力，尋求方法，面對不可預期的未來，花更多時間擔心害怕。結果是：終其一生忙碌，永遠抓不到成功的軌跡。


