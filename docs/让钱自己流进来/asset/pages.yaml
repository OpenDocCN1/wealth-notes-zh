  md: '# 賺錢自己流進水來


    同，就已分出资與窮的未來。


    致富的關鍵在創造持續性收入，要點就是建立一個有持續性收入的系統。這一個世紀，誰擁有持續性的通路，誰就是財富上的贏家。成功的模式是可以拷貝與依循的，像網路的成功，是建立在大家可以共同分享的平臺；而連鎖加盟的成功，亦是把所有的通路經營標準化，進一步做系統的承傳複製；本世紀成功的直購系統，就是把握住傳統通路改變的趨勢，設計出開創持續性收入最有利的管道。


    合作，團隊合作，是致富關鍵。書中也提及：「記得創造你的人脈」，這一點我非常認同，善用你的人脈資源，共同經營、建立團隊共同分享。人生存除了金錢、專業知識及身體健康外，人際關係是必修的課程。


    朋友稀、貴人少，怎能成就大事？窮人的想法卻往往是：「我沒有什麼人脈，我又不認識什麼達官顯要！」事實上，朋友與貴人每天不斷出現在你的身邊，只在乎是否用心發覺與經營。記住：這個世紀成功的人士，幾乎都是人脈資源整合者。


    詳閱本書，深覺景富與陳光的用心。本書在在教導大家如何擺脫貧窮、再創財富的心意。作者願意助人成功的具體表現，這種苦蘊入世精神，把致富的道理寫得非常平實。這'
