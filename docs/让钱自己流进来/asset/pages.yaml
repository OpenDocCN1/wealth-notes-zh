  md: '消費模式。


    消費應該是聰明的，下一個世紀，我們也能因為消費而致富。如果產品本身價格一樣，甚至物超所值，又把一定利益回饋消費者，我們大可介紹親友，影響親友的親友們都來消費，這樣就進入了倍增市場。如果因此建構了一個月循環的消費系統，也造就一個零風險的月現金收入系統，我們也可以建立一份因消費型態改變而擁有的持續收入。這時候就是拿回一生需要花費的日常生活用品約250萬的N倍的退休俸。這就是把負債式的消費轉成資產式的消費理財、消費致富的範例。


    現在的超市完全一改過去的經營模式，過去的客戶僅僅享用零售價格買東西，現在，顧客會想成為會員，以批發價或七折的價格買東西。未來，超市將結合消費者，只要願意推廣公司產品，用戶會得到介紹而獲得廣告通路費的比例。我們可尋找這樣的超市，學習如何消費致富。


