    讓我自己活過來


    # # 目標管理的能力


    一個人如果沒有目標，


    終將飄流一生。


    有如在汪洋大海中的浮木，


    永遠不知道要漂到那裡去。


    億萬富翁之所以能成為億萬富翁，是因為他們都曾經訂定目標成為億萬富翁。


    有個億萬富翁，在辦公室裡掛著一個牌子：每天100萬。


    億萬富翁說，他現在開一個連鎖加盟店，希望每天的「營業額」是100萬，這樣一個月就會有3000萬的營業額。


    過了幾年後，還是掛著「每天100萬」的牌子，但他卻說，現在是每天「淨賺」100萬！


    他的夢想是：大概再過幾年，就希望可以變成每天「繳稅」100萬！


    億萬富翁因為有目標，所以朝著他的目標前進。'
