    不是口袋金錢的多寡，它是一種觀念，

    我們證明取得財富，

    有它一定的公式與步驟。


    我認為，人生有四個必修的學分，健康、快樂、愛及財富，而財富只不過是其中的一小部分，但許多人花了一生的努力，卻始終修不過這個學分。


    太多人為了父母的奉養費、子女的教育費、車貸、房貸……等，長期為生活奔波，甚至犧牲了時間與健康，但無論如何縮衣節食，或加長工作時間，卻連基本生計都無法維持。M型社會的到來，讓凝聚社會安定力量的中產階級，像冰山一樣以驚人的速度迅速瓦解中，讓我們驚覺貧富兩極化已無可避免。


    當你讀完這本書，你將會發現戰勝M型社會的方法。

    錢，是自己會流進來的！工作不是為了錢，工作，是為了實現自我的核心價值，是人生學習的重要工具！這一點一定要


