    當我和陳光老師深入探討目前為經濟壓力所苦的社會現象時，我們都發現彼此有強烈的使命，因此決定藉由出書讓更多平凡人知道，只要願意改變，就有機會在零風險的情況下成為一個無貧家庭，徹底擺脫貧窮！


