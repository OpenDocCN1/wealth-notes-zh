  md: '# 執行力


    執行，沒有藉口。


    唐三藏到西方取經回來後，被封為大唐第一國師，他所騎的白龍駒也被封為大唐第一名駒。


    有一天白龍駒回到牠原本的馬房想要探視以前的馬朋友，牠的馬朋友這些年還是做著磨麥的工作，看到白龍駒身價如此高，就用著不屑的口氣跟白龍駒說：「你每天工作八小時，我也工作八小時，憑什麼你可以被封為大唐第一名駒？」


    白龍駒回了一句：「因為我有走出去，而你只還在原地打轉。」


    鴻海集團董事長郭台銘說：「執行力就是紀律，那種一心想把事情做好的決心。」'
