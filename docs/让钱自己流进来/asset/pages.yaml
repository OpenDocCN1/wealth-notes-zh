- pgno: 147
  md: '# 億萬富翁的心理顧問


    美國有個機構進行長期研究，追蹤 100 個年輕人直到 65 歲為止，結果發現，100 位受測者只有 6 個人事業有成，其餘 94 人都是平平淡淡走過一生。這
    94 人與事業有成的 6 個人最大的不同，就在於他們沒有設定明確的目標。所以，唯有目標清楚，才能成為億萬富翁。


    億萬富翁總有特定目標值得奮鬥，對他們而言，人是為成功而生。他們的焦點不是為了生存而憂愁，也不為生活細節忙碌，而是為了追求更遠的理想、目標，因此努力不懈。盡其全力追求財富自由，幸福美滿的人生指日可待。


    在非洲的大沙漠中，有個地方叫皮藍，相傳那裡是個只能進去，卻走不出去的地方，很多人對這個地方的詭異感到恐怖。


    原來，光憑感覺往前走，是無法走出皮藍的。由於沙漠的風向剛好成一個迴旋，日夜風把沙漠的路剛好吹成一個環狀。所以不管怎樣的努力，幾天後又回到原來的起點。


    如果看到旅人的軌跡，只能看到許多不同範圍的圓圈，像一把掃尾的足跡。


    一位經過訓練的軍人來到皮藍，知道沒有任何指示路標，是無法走出去的。於是，他依靠北極星的指引，帶著村民走出這個沙漠。


    選定方向，就能創造新生命。


    151'
