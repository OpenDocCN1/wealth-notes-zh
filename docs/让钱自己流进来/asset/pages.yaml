  md: '![](img/45ed87579d2623bf73161960ce2430a7_160_0.png)


    以下結論的書，欲購從速。」居然又被一搶而空，總統哭笑不得，商人卻借總統之力大發其財。


    中國有一個人說了這麼一段話：「我帶兵護將的能力不如韓信，籠絡人心，不如蕭何，運籌帷幄，遠不如張良。我只懂得借力。我是大漢天子——劉邦。」


    西洋諺語也有一句話：「借力使力不費力，點頭微笑數金幣。」的確，如果學會團隊借力，將取得事半功倍的效果。


    美國田納西州有一個生產玉米的小鎮，因為相互激勵改良玉米品質及提高產量，每年都會舉辦一次玉米產質比賽，一連幾年懷特先生都得到第一名。


    鄰居們紛紛向懷特先生換來最好品種的玉米種子栽種，懷特先生毫不吝嗇的換給他們。


    有人向懷特先生說：「你把最好的玉米品種都分給鄰居種植，難道你不怕影響到每年比賽得第一名的優勢嗎？」


    懷特先生開朗笑著說：「玉米是靠風來傳播花粉來交配的，只要我四周鄰居都有最好品種的花粉傳來，我的玉米品種才會愈來愈好。」'
