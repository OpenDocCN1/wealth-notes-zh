  md: '![](img/45ed87579d2623bf73161960ce2430a7_155_0.png)


    父親看了一會兒，「老闆在嗎？」


    這位店員在男士的堅持下，呼喚老闆從辦公室來到門市。


    父親問：「這玩具你能出的最低價格是多少呢？」


    老闆回答：「現在是七十元！」


    「什麼？剛剛還說是五十元啊！」


    「沒錯，不過現在是我接待，加上我的談話費，總共七十元。因為你讓我離開我的工作。」


    父親心想，一定要贏得這場談判。


    「那你真實的告訴我，這玩具最低可以賣多少給我？」


    老闆說：「現在是八十元！」


    父親趕快把錢放在櫃檯上，拿起玩具歡默走了。


    要知道，時間價值遠大於金錢。把時間擺在最大槓桿操作上。先把時間花在建構自己的致富系統，創造持續收入。我們可以用時間學習別人已經成功的致富經驗，一定要跟成功者學習；所學習的對象，將決定未來的成就。把時間擺在學習複製已經成功的模組，會少繞路，節省很多時間。若與一個成功者在一起，可節省十年的探索時間，我們跟十個這樣的人一起，就濃縮了一百年的經驗與時間。切記，想致富，就得把時間安排在對財富最重要的槓桿上。'
