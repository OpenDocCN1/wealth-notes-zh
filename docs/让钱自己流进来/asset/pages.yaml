  md: '收入分兩種：


    +   1. 暫時收入（如下頁表1-2-1）：95%以上的人賺的是暫時收入。（思考：目前的工作裡，當工作的行為一旦終止，收入是不是會歸零？如果是「是」的話，那就是在賺暫時性收入。）


    +   2. 持續收入：持續收入是一種每個月會讓錢自己流進來的收入，它不會隨著我們是否工作而停止進帳。


    政府擁有持續收入像營業稅、水電基本費等。


    財團也運作持續收入，例如：第四台業者、ADSL收月租費。


    軍公教人員工作25年，年滿50歲可領約月薪8折的月退俸，且領一輩子，這也是持續收入。


    在銀行存100萬元定存，利息每個月約1800元，假設利率不變，也算是持續收入。另外，股票股利、房租收入等都是符合持續收入的定義。


    因此我們是窮人還是富人，取決於我們把心力放在追求暫時收入或是持續收入。


    你有持續收入嗎？持續收入將會於我們的身價，假設每個月擁有1.5 ~ 2萬元的持續收入，就表示於有了1000萬元的身價（相當於存在銀行1000萬元的利息收入）。


