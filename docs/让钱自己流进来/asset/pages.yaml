    # 一、是老闆決定你的命運，還是你決定自己的命運？


    學校畢業的同時，已經訂好人生計畫，朝著自己的目標進入理想的公司？還是狂寄履歷表，哪家公司通知，就到哪家公司上班？


    原本在一間公司擔任主管階級的小李，在全球合併的潮流中遭受波及，當公司被合併後，小李不幸被資遣了。當他在打包辦公室的私人物品時，小李不禁深深嘆了一口氣，過去努力了十幾年，在ㄧ瞬間全部歸零，想著每個月要付的房貸、車貸、小孩的教育經費以及不敢想像的退休金……等，未來到底該如何是好？


