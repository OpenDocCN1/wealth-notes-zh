- pgno: 71
  md: '試想：有什麼是一定必須要花固定支出呢？其中一項應該是日常用品，因為不論景氣如何，我們一定需要刷牙、洗頭、洗澡、洗臉，不可能因為不景氣就不刷牙或不洗澡，所以日常用品是固定的支出，這些東西，用了就不會再回來了，也就是負債。


    我們來計算一下：


    如果一個家庭四口人，平均每個月花在日常用品上約為2500元，一年就必須花掉3萬元，五十年下來就要花掉至少150萬元。70年至少花了250萬元，這筆錢是固定的支出也就是負債性的開支。但如果一生的日用品、保費品等250萬，能夠拿來轉化成資產，那就是致富的關鍵了！


    如果賺的錢不夠投資，我們必須先學會調整消費模式。


    很多媽媽幫，早已知道透過消費型的改變，也能致富。選擇市面上許多消費者聯盟、和消費者合作的超市、健康生沽館，採試用會員制，大量鎖住通路。該產業致力研發對安全、健康、且不污染河川的環保產品，將大大替代來路不明、易致癌的化工產品。


