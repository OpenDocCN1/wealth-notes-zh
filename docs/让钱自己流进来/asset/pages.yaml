  md: '當Vera看到兒子兼職經營一個消費者直購的宅配郵購公司，Vera心想也許她也可以試試看，年紀並沒有阻礙Vera的選擇。現在85歲的Vera年收入超過二百多萬元，不僅把貸款還清，更固定捐款給兒童慈善基金會。


