  md: '桿。運用槓桿原理，只要在財務的施力點上施一點小力，就可以有大量現金流入，以推動夢想、完成人生的目標，但是有一個必要的條件，運用工具並選對位置，先找到施力點，才能放下時間精力推動自己的夢想。


    諸葛亮借東風大敗曹軍，宮本武藏借旭日東昇，太陽光反射到小次郎眼睛的刺眼效果，以木劍打敗小次郎的武士刀。他們在槓桿施力點上運作，卻幾乎完全不費力，這就是：借力。合氣道以及擒拿術也都是強調借力使力，讓弱者擊退強者的有效方法。


    有一出版商，他有一批滞銷書久久不能脫手，他忽然想出了一個非常妙的主意。


    書商給總統送去一本書，並三番五次去做求意見，忙於政務的總統不願與他多糾纏，便回了一句：「這本書不錯。」出版商便大做廣告，「現有總統極愛的書出售。」於是這些書立刻搶購一空。


    不久，這個出版商又有書賣不出去，又送了一本給總統，總統上回一嘗，就說：「這本書糟透了。」出版商聞之，腦子一轉，又做廣告，「現有總統極討厭的書出售。」又有不少人出於好奇爭相購買，書又售盡。


    第三次，出版商將書送給總統，總統接受了前兩次教訓，便不作任何答覆，出版商卻大做廣告，「現有令總統難


