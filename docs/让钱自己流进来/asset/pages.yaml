  md: '因為上班收入不確定，下班之後還要辛勤找第二份工作，別以為這樣可以遠離貧窮。再提醒一次，無論兼幾份工作，靠工時收入絕對無法擺脫貧窮。凡是不持續的收入，再高都不值得羨慕了，更不值得超時用健康追求。


    另外，光靠儲蓄的利率也不足以養老。有一個朋友在三十年前公務員退休下來，拿了三百萬的退休俸，在三十年前的三百萬是相當大的一個數目，因此那個朋友覺得從此不愁吃穿，沒想到通貨膨脹的速度之快，到了現在都八十歲了，身體還很健康，但是退休俸幾乎坐吃山空，不知道還可以再活多久，但錢都快花光了，現在過著相當節儉的生活。所以對一個人來說，需要存多少才能退休呢？才能夠抵擋通貨膨脹呢？


    聰明的人，知道利用閒聊時間，幫自己找到一份持續性收入。為了搶救M型社會的崩壞現象，我們有義務要告訴周遭的朋友，想盡辦法擁有持續收入。這是一份使命感，也是對社會的一份責任。


    從前有兩座山，一座山上住著「一休」和尚；另一座山上住著「二休」和尚。山上沒有水。每天「一休」與「二休」都需要到山下來挑水，兩人很快地成為好朋友。


