    其實，失敗最常見的原因之一，就是在不對的地方找我要的東西。


    選擇，比努力重要。


    比利時一家雜誌，曾對全國60歲以上的老人作了一次問卷調查，調查的題目是：「你最後悔的是什麼？」並列出了十幾項生活中容易後悔的事情，供被調查者選擇。以下是調查的結果。第一名後悔年輕時努力不夠，以致事業無成；第二名後悔年輕時，選錯了職業。


    很多人由於缺乏財務觀念，往往在不對的地方堅持，所得成果往往不如預期。但如果可以在對的地方著力，在未來趨勢上占一席之地，就能輕易獲得大筆財富。什麼樣的選擇，帶來什麼樣的结果。今天的生活，是由五年前我們的選擇決定的，而今天的抉擇，也將決定我們五年後的生活。


    長期以來，我們只習慣追求安定，或選擇在自己的舒適


