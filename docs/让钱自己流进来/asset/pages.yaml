    # 致富關鍵四：倍增


    善用複利倍增的效果，

    能夠使乞丐搖身一變，

    成為富有國王。


    學會槓桿操作是致富的關鍵。觀察「億」這個字怎麼寫？是不是先寫個「倍」字？愛因斯坦說：「複利，比原子彈更可怕。」如果懂得複利的倍增概念，把倍增當成我們的槓桿，我們將可以輕鬆成為億萬富翁。


    約翰是一位中報學者，在餐飲店打工的他，一年所得沒有超過1萬美金，但是他八十歲時，他捐給南密蘇里大學共20萬美金。但如果你認為他只是一位深富愛心的富有慈善家，那就大錯特錯了。


    約翰從小在艱困的生活裡成長，因家境貧困而被迫中斷學業，改善家庭生活，當年即使景氣再好，一年的工資也不過數千美元。'
