- pgno: 115
  md: '# 本世紀致富的關鍵


    這項工作伴隨了一生，八十年來，他依舊是一個沒沒無名的餐飲打工老翁。


    只憑著微薄的收入，如何累積一筆不小的財富呢？他認為：「建立財富的祕訣在於複合利息。」


    約翰中年時代的生活才逐漸好轉，累積了一筆小額的財富，卻什麼也辦不成，因此他選擇了銀行存款，本金加利息不停增長下，他發現自己居然擁有數十萬的資產。


    根據韋氏大辭典對複合利息的解釋為：「利息的計算是基於對本金和累計過往未支付的利息計算。」複利比歷史上所有投資都能創造財富，即使不工作，金錢也能運轉，因此複利被爱因斯坦稱為「世界第八大奇蹟」！


    世界上第八大奇蹟是指「複利」，微薄的存款累積成可觀的財富，答案是倍數增長，它是建立財富的槓桿方式，也是稀釋時間與金錢的有效工具。因此善用複利效果，能夠使乞丐搖身一變，成為富有的國王。


