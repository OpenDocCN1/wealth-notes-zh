  img_proc: true
- pgno: 49
  md: '![](img/45ed87579d2623bf73161960ce2430a7_49_0.png)




    這個金錢遊戲，可是這個巨大的遊戲，如果我們不清楚遊戲規則，根本是贏不了的。富有的人熱絡金錢流向，在流向處早已建好水庫，輕鬆等著大筆金錢流入。窮人（E、S象限）與富人（B、I象限）思考與努力的方式不同，完全依循兩個不同的遊戲規則。


    財富是建立對物質的基本價值觀，教導孩子們如何存錢、花錢並生財的過程。亞洲鄰近國家如日本，所實施的長子繼承制，以「苦其心志，勞其筋骨」的方法，來教育下一代的「財富達人」；德國最資深的投資銀行梅茲拉家族，談到富過三代的秘訣——「不讓小孩關進金鳥籠」，培養後代的方式採用最平民的生活模式：走路或搭公車上學、讀最普通的學校、和同學一起玩耍、一起生活、吃相同的食物……等。猶太人原本就有一套積極正面的財富教育觀念，教導小孩正確的用錢方式。


