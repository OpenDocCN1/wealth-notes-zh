- pgno: 69
  md: '# 維持淨資產收入


    房子自己住，不能產生營收。但是把房子拿出去出租，帶進來的租金除了付房貸還有剩餘，那房子就是資產了。同樣的，車子也是如此。買車後還需付車貸就是負債，但如果把車子當成生財工具，會帶進金錢，那車子就成了資產。


    因此我們必須不斷地想，如何把原本的負債變成資產。


    羅勃特說：「富人買入資產，窮人只有支出，中產階級買入他們以為是資產的負債。」富人不做自己能力範圍不及的事情，富人總是最後才買奢侈品，因為他們都將收入變為可不斷再產生收入的資產，以至於資產像滾雪球一般，最後終於累積成畢生用之不竭的龐大財富；相反的，在窮人的資產負債表上，總是負債大於資產，因此須不斷努力工作，才能追得上那重重的負債。


    我們所要做的是，再也不是花掉手頭上得不來不易的錢，填補購買負債產生的現金缺口，而是學習投資的知識，讓月收入與資產相互投資，習慣透過投資，產生正的現金流。


    全美國企業家大獎得主范博士先生表示：「貧窮的人為有錢人工作，貧窮的子孫就得替有錢人的子孫工作，一代接著一代，除非有人發現打破這個窠臼的方法，否則貧窮是會遺傳的。」而這個方法，就是把負債變資產，把消費性支出轉換成資產性的消費，藉由消費理財、消費致富的新觀念，去建構一個持續收入的系統，一個遠離貧窮的代步工具！


    學習將負債性的固定支出，轉換成資產性的投資。'
