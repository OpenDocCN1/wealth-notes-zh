  md: '![](img/45ed87579d2623bf73161960ce2430a7_12_0.png)


    認知。金錢的到來，有它一定的管道，這本書，就是救你發覺並構築這個管道。


    人的一生，只為賺得足夠的金錢，來看清整個世界，可惜很多人努力了一輩子，卻連金錢都看不清楚。這二、三年來，我們成功幫助了許多平凡人，不花一毛錢而身體上億，這是一個突破性的概念。貧富，不是口袋金錢的多寡，它是一種觀念，我們證明取得財富，有它一定的公式與步驟，可惜這些方法學校從未教過，因此很多人忙碌了一輩子，卻因為不知道這個秘密，苦苦追求金錢，最後出賣了最寶貴的生命與健康。


    為了讓所有人知道財富的秘密，很幸運的找到與我有共同理念的夥伴——景富，我們有相同的目標：相約先改變一萬人的財務思維，進而讓他們得到財務的自由。衷心期待藉由這本書，讓大家都知道如何克服M型社會所造成的危機，進而掌握財富的脈絡，擁有值得珍藏的人生。


