    我出身寒微，深知在M型社會的衝擊下，許多家庭守著微薄的固定收入，隨著大環境載浮載沉，完全經不起任何風險，一旦沒收入或入不敷出，所衍生的問題越來越嚴重；為錢爭執、犯罪、自殺時有所聞，社會慈善機構只能救急，但誰來救窮呢？


