    # 貧富一線間


    窮人最可悲的地方，在於他的錢無法從生活費用轉為資本。窮人不是沒有投資資本，是沒有投資意識。


    一個低收入戶得到政府補助金2000元。她把2000元拿來買了50雙襪子，在夜市場，以每雙100元賣出，扣掉本金，一共賺得3000元。


    另一位低收入戶，只想到他可以靠2000元做生活津貼，全部拿來買各種日用品，包括柴米油鹽，不過，他留了一百元，幫自己買了一張樂透。


    相同的2000元，前者讓2000元透過買賣變成資產，後者卻只是換得生活費用，表面上對生活有改善，但是，錢很快就消耗光了。


    > 窮人最可悲的地方，在於他的錢無法從生活費用轉為資本。窮人不是沒有投資資本，是沒有投資意識。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '![](img/45ed87579d2623bf73161960ce2430a7_23_0.png)


    走進時光隧道看一看，這兩個令人之後的改變。2000元經營襪子生意，一個月以後，將會有5000元的收入，賺得3000元，再拿出其中2000元經營生意，亦可再賺3000元，到了第三個月，他已賺得9000元，幾年以後，他就可以雇用一群人經營襪子王國，就能够夠脫離貧窮。


    事實上，許多窮人與富人的行徑完全不同。一般人給他2000元，會拿去買米或鹽，給他4000元，他會買魚或肉，給他10000元，他會買一些時尚的衣服，最後連僅存的100元，都會去購買彩券。對他來說，他的用錢方式，只想「改善生活現況」。即使是突然有了1000萬元，也只想立刻把錢換成房子、車子，最後昭告天下，他再也不是窮人了。


    消費的方式，將決定我們是窮人或是富人。


    有些物品無法增值，反而耗損錢財，例如：買車以後，必須負擔汽油費、保險費、修理費，即使停車，也必須要負擔停車費；金錢如果只出不進，即使有更多的錢，都會消耗殆盡。


    窮人窮在不是沒有投資資本，是投資意識不清楚。如果我們有投資計畫，銀行多的是資金，就因為窮人沒有經營金錢的本事、經驗和技巧，因此惡性循環，富者越富、貧者越貧，當窮人模仿富有人
    的光鮮亮麗，就像青蛙鼓起肚子、和水牛比大小一樣可笑。


    致富的第一步，是學習將部分生活消費式的消費轉為資'
