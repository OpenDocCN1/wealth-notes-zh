    今年，同樣的問題再問高清愿。


    高清愿回答：「因為今年，有一群比去年更厲害的人幫我工作。」


    比爾蓋茲說過：「成功的竅門只有三種方法：一、為成功的人工作，二、與成功的人合作，三、找成功的人為你工作。」


    億萬富翁都是有影響力的人，所以能成功的將資源整合，他們總是吸引人才與之同行。因此，不僅要當有能力的人，更要做一個有影響力的人。如果仍遲遲無法成功，可能只是想著如何提高自己的競爭力，卻一直忽略去思考增加自己的影響力。


    有影響力的人物總是擁有強大力量，可以向大眾釋放大量的訊息廣告，這點在彙聚上，更占了極大的優勢。'
