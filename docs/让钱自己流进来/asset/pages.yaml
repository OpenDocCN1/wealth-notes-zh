    「賺多少錢不重要，能賺多久才是最重要的。」很多人窮一生之力，幾乎淪為工作的機器，卻一輩子無法致富。那些買樂透、賭博，以為一夜就能致富，他們也達到致富的目的了，不過，注意，是幫助那些投注站或組頭致富。想要致富，其實沒那麼困難。收入是心理狀況的測量數據，周遭的環境只是大腦價值的投影，簡單改變大腦思維狀況，收入就會大幅改善。


