  md: '# 識取自我決策


    ![](img/45ed87579d2623bf73161960ce2430a7_138_0.png)


    其實，失敗者，才是真正的「吃苦耐勞」的人。長期作困獸之鬥，卻不願花心思學習，永遠不願了解成功者的軌跡。他們以過人的「毅力」與「勇氣」，忍受著長期失敗的痛苦，無顧生死存亡的大事，只為了三餐而煩惱，一生辛勞，只為換取基本的生活所需。失敗者，往往比成功者想得更多，他們所付出的代價是十分龐大的，對人生，怎能輕鬆應對？


    理財週刊寫著：人生有三個階段，第一是「勞力財」，第二是「專業財」，第三是「眼光財」。勞力是指工作的前十年，不害怕吃苦，努力工作賺錢，靠的是親力親為的努力。當賺到錢以後，即可提升到第二個階段「專業財」本身工作再進修，專業能讓我們升級為主管。但四、五十歲之後，體力不從从前了，長期學習的經驗卻是一般小伙子沒有的，這時，要賺的錢就是「眼光財」。判斷一個事業是否能快速致富，眼光是相當重要的。


    而且學習能力，取決於學習的效率。由於我們身處知識災難的時代，若無法快速有效學習、掌握資訊的方法，始終學了又忘、忘了又學，再多的努力也終究歸零。唯有採取有效記憶方式，實現知識致富的能力，財富才能伴隨而來。這些年來，我提出的邏輯式記憶及思維方法，就是期期盼大家能擁有高效率的學習與思辨方式，除了擁有過目不忘的能力之外，更能迅速整合思維，達到快速歸納總結的實力。切記：'
