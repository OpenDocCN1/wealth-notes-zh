  md: '# 賺錢自己法 漫畫教學版


    通訊領域應用，許多流通領域的大型企業，他們的成功之道，在於教育顧客新產品與服務的知識，改善他們的生活。


    究竟人的一生能夠賺多少錢呢？我想這是個十分值得深思的問題，如果是體育健將，像老虎伍茲20歲時已經賺1600萬美金，或是麥可喬丹擁有傳奇般的收入，因此有成千上萬的青少年努力練球，夢想自己成為下一個體壇的明日之星！


    看到這些人，會想到什麼呢？要注意的是，並非現在賺多少錢，或願意投入多少努力在工作上，也不需考慮自己有多少才華。要知道的，是錢的軌跡，只要知道錢的軌跡，要賺到錢，其實是一件容易的事！


    許多人像一隻每天在籠裡隨著轉輪快跑的倉鼠，每天為了生活費、車貸、房貸、子女、教育等，忙得團團轉，不論跑得多快，還是在原地打轉，即使累得要死，還是依舊無法停下來，也找不到出口。如果我們得為倉鼠籠裡的生活費、車貸、房貸、子女教育等費用忙得焦頭爛額，記得得幫自己想办法找到出口，學學億萬富翁正在想的事，就可以不用困在倉鼠籠裡發愁。


