  md: '雲的方向是風在決定，而人的方向是誰決定？

    往往不是自己！


    記得以前在某公司上班時，在打卡鐘的牆上就寫著「今天不努力工作，明天就要努力找工作。」這句話真是充分發揮嚇阻的作用。


    但事實就是如此，老闆決定我們的收入、工作時數、業績額……等，甚至決定要不要繼續雇用我們；掌握自己命運的人，永遠不是自己。難怪有人說上班族就像100年前的奴隸，50年前的佃農，現在像奴蟻，當老闆在工作職場否定了我們，就誤認自己一點價值都沒有了。


    一條獵狗將兔子趕出了窩，一直追趕牠，追了很久仍沒有捉到。


    牧羊人看到此種情景，譏笑獵狗說：「你們兩個之間，小的反而跑得快得多。」


    獵狗回答說：「你不知道我們兩個的跑是完全不同的。我僅僅為了一頓飯而跑，牠卻是為了性命而跑呀！」


    這話被獵人聽到了，獵人想：「獵狗說得對啊！那我要想捉到更多的獵物，得想想好法子。」


    於是，獵人又買來幾條獵狗，凡是只要能夠在打獵中捉到兔子，就可以得到幾根骨頭，捉不到的就沒有飯吃。這一招果然奏效，獵狗們紛紛努力去追兔子，因為誰都不'
