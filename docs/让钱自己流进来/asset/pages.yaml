  md: '的工作。「但絕大多數奉行父母教誨的人，好不容易拿到學位，也進入社會成為知識白領，結果是一輩子努力打拼擠身中產階級，忙碌一生，卻仍無法跳脫爲錢工作的枷鎖，無法得到真正的財務自由（讓錢自己流進來）。很重要的一個原因是，父母及學校把財務觀念都弄錯了。所以《富爸爸，窮爸爸》、《億萬富翁的賺錢智慧》等書一上市就成為暢銷書，可見世人對理財觀念的飢瘁。


    有很多在各領域學有專精的人，談到理財不是一竅不通就是避而不談，所有經驗都是延用了上一輩的觀念。前一個世紀成功的理由，往往是下一個世紀失敗的原因。財務知識是一生必修的功課，早點認識並學會駕馭它，便能早日通往財務自由的大道。


    想一想，如果我們現在只是別人的員工，賺的只是工資收入，換句話說，我們就是用努力、時間賺計時的收入：這表示，當下一個鐘頭起無法工作，也就不再有收入了。而我們要有多少保險，才能規避這樣的風險呢？


    我們必須努力成爲一個支配資源、建構系統的人，而不僅僅是公司裡人力資源，或只是系統的一部分。


    上班族，有工作有收入，沒工作就沒收入，賺的錢就只是暫時收入；而過去的努力，卻總在下個月一筆勾銷，歸零重新開始。有沒有那種：曾經努力工作，就能永恆營收，退休不用愁，因爲每個月都會來的收入，錢會不斷的流進荷包'
