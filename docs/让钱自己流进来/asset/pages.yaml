  md: '# 大的企業集團。


    我們現在所處的位置不重要，最重要的，是我們正在往哪一個方向移動。


    這本書的致富秘密，已經成功幫助數十人身價上億，甚至幫助許多負債的朋友，藉著觀念與行為的轉變，而重拾財物的自由。M型社會的來臨，每個人都應檢視手中資源，懂得掌握趨勢，聚衆、將負債變資產，再放在槓桿操作點。最後，學習億萬富翁的特質，懂得借力，或加入一個團隊，與成功者平均財富，最後，我們會驚覺，錢，是自己會流進來的。就像《人生四大秘密》書上說的：「當財富來臨時，它來得如此快，如此多，讓人們不禁驚覺，這些年來，這些財富都躲到哪裡去了。」


    思考並執行本書的所有致富秘密，我們將進億萬富翁行列，輕易得到富足的人生。'
