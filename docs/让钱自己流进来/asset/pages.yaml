- pgno: 73
  md: '# 想盡方法擁有持續性收入


    ![](img/45ed87579d2623bf73161960ce2430a7_73_0.png)


    金山跟銀礦，其實不值得羨慕。

    與其選擇萬貫家財，

    倒不如一個會持續冒出錢的杯子。


    很多人害怕上班的收入不確定，上班族急欲尋找雙薪，下班之後還要辛勤工作，以為這樣可以遠離貧窮。其實，無論兼幾份工作，單靠工時的收入永遠無法擺脫貧窮。想致富，必須記住幾個工作原則：


    # 一、凡是不持續的，就不值得羨慕。


    一場關於財富的課程裡，台上的演講者問台下聽眾：「知不知道什麼義叫做有錢？」聽眾當場愣住，有錢的定義不是錢很多很多嗎？


