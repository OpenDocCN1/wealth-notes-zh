  md: '濟發展中心主任雲鵬指出，台灣社會的M型趨勢愈來愈明顯，從1999年，台灣最窮家庭的平均可支配所得為31萬7千元，到2005年已降至29萬7千多元；物價膨脹，所得卻縮水約減少二萬元。


    但反觀台灣最富裕家庭的最高所得，從1999年的174萬元，2005年卻增加為179萬6千元，所得提升高達五萬多元！顯示貧富差距逐年擴大，台灣M型社會即將產生的風暴不容小覷！


    傳統養兒防老的觀念，如今已經不適用了。現在的年輕人會把錢拿回家孝顺父母的少數，五十幾年前的人，已是奉養父母的最後一代，被兒女奉養的第一代。


    孩子自己生存都成了問題，哪有幾回家孝敬父母呢？當M型社會結構一旦形成，貧窮家庭若不改變思維，青少年問題加上老年問題恶性循環，貧富差距將會更大。


    除了面對社會結構的改變，我們也必須知道產業結構的改變，大大不利於基層工作人員。由於全球化的趨勢已席捲台灣，許多機構——被併購，人員大大的精簡，許多公司行號裁缺不補，更多白領階級將被淘汰。未來的世界，只剩下知識金領與知識藍領，公司核心層厚薪資越來越高，基層工作人員薪資卻越來越低。


