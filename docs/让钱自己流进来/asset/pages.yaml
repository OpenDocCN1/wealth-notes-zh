    計，賺錢回家養家活口的，屬於「照顧者」，另一種沒有工作能力，就屬於「依賴者」。風險總是無所不在，如果很不幸照顧家庭的人出事了，這家人將會陷入貧窮，甚至活不下去！因為照顧者倒下來而全家顧失依歸需要社會救濟，這樣的現象在國內屢見不鮮。


    其實，不需要發生意外，只要有天照顧者被老闆資遣，失去收入來源，全家的經濟重心頓時失衡。注意，大部分的照顧者每天辛勤工作，長期下來身體極可能不堪負荷，因此，往往最早倒下來的是照顧者。


    聰明的家庭知道未雨綏繆，甚至可以讓照顧者不要那麼辛苦。徹底改變收入結構，追求持續收入是唯一的選擇。因此，要遠離貧窮，全家至少要有一個人要創造持續收入。


    四、影響世人脫離貧窮，共同創造持續收入。


    人一定要在順境時，想想危機在哪裡！什麼時候創造出持續性收入，就什麼時候脫離貧窮。趁自己還有體力與業餘時間，趕快為自己或家人至少累積一份持續收入！投資收益、版權收益或系統經營的利潤，都屬於持續收入的一種。全團約150萬名的千萬富翁，除了工作之外，利用業餘時間透過發展自己的持續收入系統，從而徹底擺脫貧窮，達到永不缺錢的夢想。'
