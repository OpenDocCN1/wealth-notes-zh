  md: '在日本基金經理人村上世彰，就是富爸爸教育下的少年得志者。村上世彰從念小學四年級時就學會炒股票，村上的父親在他就讀大學時，丟給他一千萬日幣的零用錢，告訴他說：「從現在起你的財務就自己獨立吧！別再來向我要錢了！」


    於是他把一千萬去投資股市，將資金翻了好幾翻，賺得好幾億的資產，又將這筆資金成立AMC資產管理公司，短短幾年間，他的公司資產又再翻了幾百倍。


    美國股神巴菲特從小就嶄露了極高的財務智商，他十四歲時，利用送報賺來的1400元美金在內布拉斯州買了一塊約四十畝的農地，然後出租給別人賺取租金，小小年紀就做了地主。


    如果在存取人生中的第一桶金的同時，能夠多充實自己的財經知識，從中找到適合自己的理財模式，那就可能是我們未來的致富因子。從小打開財富的祕窗吧！認知財富祕密：財富是自己來的，不是用努力取得的。所以，要知道方法，有了方法，自然會有路帶我們想到要到達的地方。


    我們亦可用更聰明的方法累積財富。學校裡只教我們不要不勞而獲，卻很少教我們如何一勞永逸。致富的關鍵，是學會槓桿操作，做一次，得更多。


