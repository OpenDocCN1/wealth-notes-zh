- pgno: 163
  md: '個禮拜後，他終於發現了金光閃閃的礦石。於是他不動聲色掩蓋好礦區，回到老家且告知親友，他們便籌足錢，買了所需要的機器，並將之裝運好再度回到礦區。


    第一車的礦石開採出來後，即運往提鍊場，結果證實，他們的礦區是此區最豐富的礦區之一，這麼看來，只要再挖出數車礦石便能償清所有債務了。接下來，便是數不盡的財源滾滾而進了。


    地越鑽越深，他的希望也隨之節節升高。然後，事情發生了。礦脈突然不見了。他們的美夢頓時成空，聚資金不存在了。他們繼續鑽探、挖掘，絕望的想再尋回礦脈，但一切努力終歸徒然。最後，他們決定放棄。他們把機器便宜賣給一位買貨商後便心灰意冷的回家了。


    買貨商請來一位採礦工程師來看礦區，並估算一下，工程師認為採礦計畫之所以失敗，在於礦區主人不懂得斷層（偏脈）所致。根據他估計表示，礦脈應該就在距離上一位挖掘者挖掘處不遠的地方，於是買貨商繼續雇用工開採，果然在遠比放棄的地方三呎遠的距離，開採到全美蘊藏量最多的黃金。


    看到這個故事，不禁讓人思考，窮人是否經常在距離黃金三呎之處放棄呢？執行，沒有藉口，別一碰到挫折就想放棄。


