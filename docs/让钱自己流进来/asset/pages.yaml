  md: '# 溝通力


    溝通，等於一切。


    ![](img/45ed87579d2623bf73161960ce2430a7_143_0.png)


    每一個億萬富翁都是良好的溝通者，有邏輯條理的表達自己、表達理念是那麼重要。美國的調查當中指出，百分之八十企業的成功案例，來自百分之十的頂尖銷售員。而這百分之十的銷售員，全部都有良好的口才。這顯示出一個人的說話技巧是多麼重要，即使有最頂尖的工作能力，如果沒有良好的表達技巧，是很難成功的。


    溝通的第一步，在於是否發現事物的不同觀點及態度。思路決定出路，首先，**成功溝通必須是追求人與人之間的雙贏或多贏**，溝通力的實現必須以對方需求為基礎。其次，詞藻與表情決定溝通力的強弱。表達力的智慧，更關係著一個人的工作能否順利，以及往後的職場升遷是否能夠成功。無論從事什麼工作，我們都無法避免同伴間的競爭，以及人事'
  merge: -1
  img_proc: true
- pgno: 144
  md: '上的複雜糾葛，這時，溝通更成為化解危機的不二法門。一個人如果不擅言詞，難以把事情辦好，順利處理事務的關鍵，在於人際間的溝通。


    企業中就有 70%的問題，是由於溝通的不成功，或者是不去溝通造成的。


    有效的溝通效果，可以適當表達自己，更充分展現出自己的優點，從而讓人喜歡與我們做生意。根據研究所得，在人與人的溝通當中，7%是來自說話內容本身，38%來自聲音，55%來自身體語言；而聲音的那部分，就是語言技巧。即使想表達的內容有多豐富或實在，也不過佔了整體的7%而已；如果能夠好好把握說話技巧的話，在現今甚麼都讲求感觸的社會中，更占了最大的優勢。


    如果不太會說話，可從說故事開始訓練起，別小看說故事的力量！一個有寓意的故事，就算說自己的故事，也是有效的吸引人的方式。


    有一個園區的工程師在SARS那一年到了希臘旅行，沿路將所有的景衆拍攝下來，回來之後把旅行的故事和照片放在網絡上，吸引許多人點閱。最後更出版成書，這本書就是《我的心遺留在愛情海》。出書之後也帶動一股風潮，相關周邊商品更讓他賺進不少錢。'
