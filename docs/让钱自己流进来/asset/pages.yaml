  md: '把『負償式』的消費轉成『資產式』的消費理財、消費致富的範例。」


    當看到這段文字，你會想分析，還是一點反應也沒有？當機會來敲門時，千萬別用情緒來判斷一切，應抱持智慧審慎評估。如果對一個機會猶豫時，提供以下四點，判斷這個機會，是否值得全力以赴。


    +   1. 報酬率：這件事值不值得做，成功之後的報酬率如何？最重要的是成功之後的樣子，是不是我想要的？


    +   2. 成功率：我會不會成功呢？要提供的是產品或服務，它的市場需求如何？或是產品是否符合趨勢，及擁有獨特性？在市場競爭下可否脫穎而出？這項產品是不是消耗品，可以被重複消費的？除了產品，公司和制度也是決定是否成功的因素。


    +   3. 是否有成功模式：有成功模式才会有勝算，但如果沒有成功模式，要如何確定我能成功呢？沒有可以仿照的成功對象，無法複製或系統化，成功率將會大大降低。


    +   4. 風險性：一定要評估萬一做得沒有預期的好，我會有損失嗎？我能承受得起嗎？


    每個人都有選擇一家公司的「權利」，但有選擇一家好公司的「能力」嗎？所以當機會來敲門，一定要學會判斷。'
