  md: '挑水，「一休」還是沒出現，「二休」就開始擔心了，決定去探望「一休」；上山後，發現「一休」正在大樹下打太極拳。「二休」很驚訝地問道：「一休，為什麼你沒有挑水還有水喝呢？」


