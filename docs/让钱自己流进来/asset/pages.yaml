  md: '# 擴寬自己的人脈途徑


    你現在幾歲？在你的「人生存摺」中，除了金錢、專業知識，有多少人脈？「人脈競爭力」有多強？未來，又打算讓這個存摺變成怎樣的資源庫？請勿忽視累積「人脈存摺」的重要性，因為它們將抻轉你的命運。


    三十歲以前靠專業賺錢，三十歲以後靠人脈賺錢。許多人以為，只有保險、業務員、記者等行業，才需要重視人脈，如今無論是科技、教育等各個領域，人脈都是一個日漸重要的課題。因為在團隊整合的二十一世紀，單打獨鬥的時代已經過去，擁有人脈資源，將為自己的專業及個人競爭力找到槓桿。


