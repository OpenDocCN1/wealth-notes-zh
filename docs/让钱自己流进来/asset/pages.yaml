    # 富足的人生


    人生四大秘密——  當財富來臨時，  它來得如此快，如此多，  讓人們不禁驚覺：  這些年來，  這些財富都躲到哪裡去了？


    紐約的街頭有許多乞丐，有一位破產的企業家，喪忘許久的他，帶著一箱鉛筆、「每枝一美元」的看板及雙硬幣的盒子，在街角販賣當年放在倉庫已久的鉛筆。  一位年輕人經過企業家的身旁，他拿了一枝鉛筆，忘了給硬幣就離開了，破產的企業家已走到人生谷底，因此也不以為意，直到身邊一位小提琴手的提醒，才漠然的望一望，那個沒有硬幣的盒子。  後來，一位商人走到企業家的身邊，彎下腰來拿起鉛筆，又放了一些銅板，隨口說了一句話：「喔，我們都是生意人啊！」然後從企業家的身邊悄悄走了。  破產的企業家突然被這句話驚醒，「我們都是生意人啊！」他收起沮喪的意志，重新振作起來，結果創辦了更彪...


