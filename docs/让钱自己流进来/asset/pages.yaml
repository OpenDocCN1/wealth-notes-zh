- pgno: 148
  md: '有個想法，沒有計畫，終究只是個想法。別做個只會作夢的人，更重要的是，必須將夢想化為具體的階段性目標，必須要有明確的方向與指標。


    可是許多人設定目標之後，卻無法實現呢？因為，只有設定目標是不夠的，要採取有郊實現目標的具體方法與計畫。


    一個人設定目標時，要先知道「為何」設定這些目標，再去想「如何」實現這個目標。「為何」是找到動機，「如何」是找到方法。許多人只是對目標「有興趣」，但並未決定一定要實現目標，因此當然無法實現。「有興趣」不會讓我們成功，「決定成功」才能讓我們成功。


    幾個基本動作，是所有成功者的基本特質。


    首先列下實現目標的理由。成功者在設定目標的同時，也會找出設定這些目標的理由來說服自己。當一個人十分清楚知道實現目標的快樂，以及不實現目標的痛苦時，將會產生動力驅動自己。


    其次訂定計畫，從實現目標的最終期限倒推至現在。例如：設定好三年之內擁有想要的財富，首先要列出後兩年內要做到的程度，今年內要做到的程度，每個月要做到的程度及每天該做的事。當然，必須設下時限。設下時限來規範，將有效集中資源，檢查出自己在不同時間，完成到什麼階'
  merge: -1
  img_proc: true
- pgno: 149
  md: '段。記住：成功，是由無數個小成功累積而來的。然後自問：假如要實現目標的話，我必須變成什麼樣的人？並在紙上詳細列下來。


    很多人想成功，卻不清楚成功者所具備的條件。從書上找出所有成功者所需具備的條件，讓自已知道該往哪個方向邁進。立即採取行動複製成功者的智慧，具體的目標，將使行動過程十分明確。訂下承諾，馬上採取行動，現在開始直到實現目標為止，否則絕不放棄。


    最後，衡量每天的進度，並每天檢查成果，隨時追蹤檢討。


    密集的檢查修正。每年檢查一次，一年只有一次機會可以改正錯誤，若每月檢查一次，則一年有十二次機會改正錯誤，若每天衡量一次，就有三百六十五次修正機會，若早晚修正並衡量每一次進度，成功機會當然相當增加。


    可以把所有目標寫在紙上，盡量具體化。如果想買一部寶士汽車，可以把汽車照片貼在眼睛右上方看得到的部位，每天早晚利用五至十分鐘的時間，想像已擁有這部車的樣子，並不斷提醒擁有該車的所有情況，這會加速實現願望的時間。


    請仔細並用心寫下我們的行動承諾，請務必確確實行。


    +   1. 請設定一個最想要達成的目標，並列出五項實現目標的理由。'
