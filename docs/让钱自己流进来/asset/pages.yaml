    「大羊生小羊，成群的羊再換成牛，大牛換小牛，賣了牛就可買田、蓋了房子。」老婆聽得兩眼都成了心形。


    「成了大富翁，讓我娶個小老婆好不好？」


    結果，聽得入神的老婆氣得大發雷霆，把蛋拿起來往地上一丟，頻時的美夢立刻破碎！


    窮人花錢的行徑，與富的人的花錢行徑完全不同。當一個人手中只有一個蛋時，哪怕只是輕輕一碰，都可能全部玩完了。因此窮人資本愈小，相對承受風險能力愈小。想'
