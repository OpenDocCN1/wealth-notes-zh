    # 致富關鍵一：選擇比努力重要


    想致富，我們必須做出三個選擇：


    +   1. 選擇行業別。

    2. 選擇賺小錢或是大錢。

    3. 選擇富人的象限。


    審慎選擇、分析機會，順應時代風潮。選擇，是大成功的關鍵。


    有一個故事：


    有一天，小兔跑到藥店裡問老闆：「老闆老闆，你這裡有胡蘿蔔嗎？」老闆說：「沒有。」小兔就走了。


    第二天，小兔跑到藥店裡問老闆：「老闆老闆，你這裡有胡蘿蔔嗎？」老闆說：「我都跟你說過，沒有！」小兔就走了。


    第三天，小兔跑到藥店裡問老闆：「老闆老闆，你這裡有胡蘿蔔嗎？」老闆急了：「我跟你說過多少次了？沒有！你再撳人，我就拿老虎鉗子把你的牙都拔下來！」小'
