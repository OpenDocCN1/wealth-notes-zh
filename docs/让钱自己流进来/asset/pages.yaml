    根據內政部統計，從1997年開始，國內低收入戶逐年增加，每年以平均6.53%的速度增加，表示台灣的低收入戶，每年增加將近5000戶，「低收入戶」正以驚人的速度成長！


    台灣到底有多少窮人？年年增加7.59%的窮人：以現今低收入戶的人數統計，每年有將近15000人淪為低收入戶的一員，受到產業外移、失業率增加、薪資成長跟不上物價成長等影響，貧富差距嚴重惡化的程度，從1980年的4.17倍，如今已擴大到6.03倍！


    「富者越富、貧者越貧」的現象日趨明顯。平均每五個有養小孩的貧窮家庭，至少有一個處於兩代貧窮循環中，繼續窮下去。所謂「貧窮循環」，指出生於貧窮原生家庭的第二代孩子，長大自立後，依然擺脫不了貧窮。


