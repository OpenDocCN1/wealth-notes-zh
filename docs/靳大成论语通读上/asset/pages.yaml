    余海清


    以德服人是做企业领导者的基本标准。【1】企业是社会的细胞，企业领导者的德性直接影响社会风气。【2】员工是企业最宝贵的财富，以德服人能让员工死心塌地。【3】企业生存发展需要良好的社会关系，以德服人能让企业在社会上赢得尊重和支持。


    清风徐来


    德为根基，我选人的标准是德才兼备、以德为先，同时会考察其能力和潜力。我认为，德为先是做人之本，也是做事之基。一个德性不好的人，即使能力再强，也可能会给团队甚至企业带来灾难。所以，在选人的时候，我会首先考察其德性，看其是否正直、诚信、有责任感。'
