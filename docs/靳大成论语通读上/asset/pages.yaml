    李倩 喜欢那首：《诗》可以兴，可以观，可以群，可以怨。··诗之事火，远之事君，多识于鸟兽草木之名。


    虽然这段特别精到，但是很难说出大家最熟悉的句子不过下面这个范围：


    +   1、子曰："学而时习之，不亦说乎？有朋自远方来，不亦乐乎？人不知而不愠，不亦君子乎。"


    +   2、子曰："温故而知新，可以为师矣。"


    +   3、子曰："学而不思则罔，思而不学则殆。"


    +   4、子曰："知者不如好之者，好之者不如乐之者。"


    +   5、子曰："三人行，必有我师焉；择其善者而从之，其不善者而改之。"


    +   6、子曰："吾十有五而志于学，三十而立，四十而不惑，五十而知天命，六十而耳顺，七十而从心所欲，不逾矩。"


    毕业，这是初中语文课本里收录的六则，每一位读者看到都很有印象的，可以说做到了孔子的教学，这就是研读学习孔子之道的。


    老师好！我最喜欢的两句是：


    事君：不贤者以事，事父母，能尽其力； 事父：··益朋友以忠，言有信，言有质。


    先说忠，我是对忠之一句忠的理解：主忠信，·若不好忠，则不忠；学则学主忠信，无友不如己者。过则勿惮改。


    昆仔，让我印象最深的有两句，分别是：


    人之不肖，不可与之久处。'
