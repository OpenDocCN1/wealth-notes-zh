    1. 选人标准是什么？


    我个人的选人标准是看这个人是否符合公司的价值观，是否符合岗位的任职要求。对于基层员工，我看重的是执行力和责任心；对于中层管理者，我看重的是领导力和团队协作能力；对于高层管理者，我看重的是战略眼光和创新能力。

