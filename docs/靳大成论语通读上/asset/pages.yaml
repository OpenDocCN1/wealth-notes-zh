    **佛印门徒**


    新老规矩：我选人的标准主要有三条：

    第一、守规矩。这是首要要求，遵守国家法律并遵守公司规章制度。对于违反公司规定的行为，会给予相应的惩处。第二、学习力。我认为人最核心的是学习力、思考力。人一般都不差，只要有学习、思考习惯，就有培养价值。

    第三、执行力。现代企业里强调协作、协作能力就非常重要，要能做好自己分内的事，还能与同事沟通协作，不推诿、不抱怨，把事情落实到位。

    6.47


