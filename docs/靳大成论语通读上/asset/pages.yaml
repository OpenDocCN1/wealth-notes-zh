    对于大部分中国人来说，只要受过初等教育，《论语》总都能背几句，不管是“学而时习之，不亦说乎”，或者“知之者不如好之者，不知为不如，好之不如”、三句十五四，不亦说乎。五十知天命，再有将近三十五过去，听听是听过的。不过，完全读懂整部《论语》的现代人，真不多。


    这节课，我会带着你把《论语》从《学而》篇开始到《尧曰》篇结束，总共20篇通读下来。咱们一字读，一边讲，一字不落。


