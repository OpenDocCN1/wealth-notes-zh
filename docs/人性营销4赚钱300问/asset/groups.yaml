    # 人性营销系列


    学人社群营销，


    就进《陈老师方法之社群营销2·如何打造赚钱的生活》读书社群！


    ![](img/a56bf6102c5b1d530d690ed096021005_339_0.png)


    赚钱的核心就是不断的分享价值。商业社会，一个人能富有，本质上是因他做了很多贡献。不管是互联网经济出来没出来，最赚钱的方式就是做出贡献。


    挣钱，本质上讲一句话就能解释：就是天下没有免费的午餐，你想赚得钱，你就得向社会提供价值。你只要明白了这个理论，那么你就能明白网络上的钱是如何挣来的。


    # 人性营销系列


    ——陈老师


