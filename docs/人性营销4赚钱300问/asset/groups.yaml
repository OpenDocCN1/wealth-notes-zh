    我们用哲学思想，我们用合同、法律、税务、章法、哲学，形成社群、公司的发展框架。打造管理层，做一个强大的组织。打造社群讲师团，做一个强大的组织。


    唯物主义，唯物史学、哲学，是我们做社群的根基。能动摇的哲学，都不是我们要的，不能证实的哲学我们不要。所以，我们要弄的，就是情感项目，这个项目赚铁。我们要弄的，是教老板做抖音，这个项目，我们做起来水到渠成。


    管理企业、管理社群、管理粉丝、管理公司、线上线下的品牌管理、内容管理，乃至于国家管理，都是大小不同而性质一样的，就是产品、流量、变现、服务、售后、营销、锁定、扩张、人才使用的运营。


    做社群的本质是做力量的联合，联合抖音、联合粉丝、联合所有喜欢我们的人，也联合陈老师方法、书籍，联合哲学、价值观，不断的传播给粉丝。


    联合这两个字，就是哲学与胜利，就是道，是战争，是商业的道。联合，就是团队，就是产品，就是矩阵，就是天兵天将。


    提高收人的本质是合作，思想的合作、物质的合作、资源的合作、优秀老师势能的合作，直播间、视频、书籍内容，以及陈老师这个品牌的合作。合作，联合的品牌营销势能强强大，收单的能力就强。


    我们的对象是教老板做抖音，我们要联合的是内部讲师老板，外部老板粉丝。我们要不断的确认，让更多的老板来跟着我们做抖音、做直播、做视频，传播。唯有联合，才能赚更多的钱。联合老板，他们可以学习做抖音视频、直播、变现，也可以去做情感项目。


    全抖音的老板联合起来，我们的学员联合起来。所有人联合起来，干啥？干抖音，教老板做抖音，做情感项目，做我们书籍内容。联合战线，我们一定会获得道的胜利。在道中的人，才会成为神。做项目、生活，我都找原则，找道。


    群众基础的核心，就是为群众争取利益，所以，我要做的，就是为所有人争取思想利益，争取经济利益。用情感项目、教老板做抖音品牌营销项目，去为广大粉丝争取变更的利益。大家有了利益，我们才能建立管理层，我们才能建立讲师团队，才能建立公司、社群。


    要想大家跟着我们混，我们是一定要大量分钱给大家的。没有思想利益 + 经济利益，就没有一切。还有非常深刨的思想，让其他人的思想都跟不上我们的思想。思想先进 +
    有钱赚，有价值观，有信仰，在这个模式下，团结更多的人，我们就能占山为王。


    组织能力，我们吸引管理层，就是要打造组织能力强悍的人。经营的本质，是先进的思想 + 大家都有钱赚的经济、组织动员能力。这几个武器，用来经营社群，用来做教老板做抖音、情感项目的落地对接，我们就能获利。


