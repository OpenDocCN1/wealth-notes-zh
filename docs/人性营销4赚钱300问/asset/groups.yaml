    ⑤投资人的钱，拿着，其实会给您带来无形的压力。投资人的钱拿着，会左右您的决策。开始创业，一个人做生意最好，自己想了自己干。


    ## 197、什么样的人是赚钱高手？


    ①很简单，赚钱高手，就是一直在赚钱的人。古龙写小说，说这天下第二把天下第一给灭了。灭了的意思就是弄死了。为什么？因为天下第一没有时时刻刻的练习，而天下第二天天都在练习武功。


    ②赚钱也是如此。真正的赚钱高手，就是不断的搞流量、不断的搞话术、不断的搞成交。真正的流量高手，电脑一打开，就是锁定一个流量平台，然后一直在这个流量平台上做流量。永远在战胜同行，永远在发现新的同行。


    ③我从来不相信谁是天才，可以不努力就赚大钱。但我实话告诉您，这个世界上是有天才的，但不是您。我们都想当富二代，但王某一只有一。您如果不是富二代，没关系，您可以选择把自己锤炼成一个赚钱高手、锤炼成一个企业家。您也可以选择做啥。


    ④真正的强者，就是偏执的，就是极端的。柔和的态度，我也想有，我也知道柔和好，但我真的没时间陪着大家柔和。这样说吧，我的生命除了工作，还是工作，除了做了跟赚钱有关的事情，还是做跟赚钱有关的事情。我能怎么办？先把身价弄到100个亿，再去淡谈其他的事情。那个时候，我们就柔和了，或许，依然不会柔和，因为我们把我们的一切都献给了商业战斗。我在其他地方不发言，那是因为我不想浪费精力在其他地方。


    ⑤什么样的人是赚钱高手？就是您这个人的小宇宙与“赚钱”这两个字完全重合。您如果能够领悟这句话，您日收入绝对破万。我是说一个人的情况。


    ⑥当然，您也可以在我的课程里、我的文字里，找到赚钱的项目、具体的思维与方法，直接干起来就行了。您要领悟不了我想说了什么，放弃吧。这个社会，不是谁都能成为人上人的，您也可以让人上人赡负您。


    ⑦您如果有技术，其实也能用这些人上人的钱。比如，我们这些人，不断的赚钱，其实，也就是分给了亲人、爱人、核心伙伴，分给了我们的合作者。但我们这样的人只愿意自己成为一个赚钱高手，我们不习惯吃软饭，因为我们没有选择练习吃软饭的技能。


    ## 198、为什么创业者要只认钱？


    ①创业者，什么都要自己管，除非您的公司做大了，才要别人管。一般情况下，您招聘过来的、跟着您混的人，都比您差很多。他们没什么大事，不要相信他们能赚钱。您把自己的资产让他们管，后果就是亏本。


