    - ⑦想要自己创业成功，在互联网上，就四件事。a、流量的建立；b、内部文字系统的打造；c、尾巴系统的完善；d、跟高手合作，高手做售后或者产品。如此，您也就赚钱了。


    ## 291、我们的变现模式是什么？


    - ①读书社群变现、社群营销变现、公开课变现、广告尾巴变现、咨询变现。

    - ②变现的核心是外面的 36 环系统执行的好，有内容，有粉丝，才能变现。

    - ③我们日日夜夜想的都是如何最牛 B 的释放最有价值的信息，然后，这些流量到了微信上就变现。

    - ④我们日日夜夜想的是，如何提供月收入几万、几十万的策略。我们要如何达到这个目标？让所有群友日出百单，这个目标如何实现？

    - ⑤我们做项目，就是一辈子锁定一个关键词。

    - ⑥我们是没什么办法的，穷玩车，富玩表，无产阶级玩电脑。我们太穷了，只能靠互联网、靠电脑赚钱。

    - ⑦我们不想吹牛、说废话，就是踏踏实实的干活。


    ## 292、我讲课的目的是什么？


    - ①我讲课的目的，是让我社群里的所有人，都发挥出来自自己应该发挥出来的力量，把本就有的本事发挥出来。

    - ②把本来就有的时间用来执行 36 循环系统，而不是浪费时间，没有什么收获。

    - ③我记得国外有个企业家讲过一句话：每一步骤都必须赚钱。我改一改：每一秒钟，都必须释放价值，吸引粉丝，然后才有机会做变现。


    ## 293、我们社群追求什么？


    - ①我们整个社群追求什么？追求时时刻刻都在释放价值，都在搞营销，都在帮助粉丝。

    - ②当您永远都在帮助人的时候，您的粉丝自然就多了，这个时候，您推出米巴系统，自然有人买单。

    - ③我们通过喜马拉雅、社媒体 + 抖音，不断的释放有价值的信息，情感信息、恋爱信息，日日夜夜重复这个动作。


    ## 294、我们的核心是什么？


