    ![](img/a56bf6102c5b1d530d690ed096021005_338_1.png)


    这套书籍，是干年不变的人性营销、赚钱的法则！


    突破自己的财务边界，首先要突破自己的思想边界。变富唯靠就在你要不断的否定自己的想法，如果你继续以你现在的思想看待这个世界，那么一切都不会改变。


