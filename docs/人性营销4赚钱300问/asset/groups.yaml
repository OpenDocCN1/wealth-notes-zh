  - '[PAGE 26]


    # 1、人 ocurrir什么最重要（1）？


    ①交友。人是会被朋友影响的。

    您交往的人，喜欢欺骗、不诚信，慢慢的，您也会变成那样。

    您交往的人，好逸恶劳、贪慕虚荣，慢慢的，您也会变成那样。

    一个智慧的人，应该一开始，就交往一个有素质、有道德的人。

    远离那些具有腐败品质的人。


    ②读书。人一定要日日读几本好书。

    我的策略，就是日日读书，情绪越来越好，事业也越来越好。


    ③努力赚钱。钱可以说是非常非常重要，过分点说，是一切的根基。但是大家不喜欢这样讲，觉得这样丢脸、无耻，心里只有钱。

    很多人高尚的说："钱不是一切，钱不重要。" 但是等他们想要钱的时候，却没钱。

    对于故视钱的人，我们要远离。我们就是竭尽全力的工作，拼命奋斗，为的就是多赚些钱，让自己以及跟自己具有核心关系的人，生活过得好些。


    ④照顾好自己。人首先要照顾自己的健康，照顾自己的金钱，照顾自己的情绪、自己的父母。人不是先去照顾别人的，比如，照顾您的女朋友、您的员工、您的同事。不要讲我伟大的话题。'
  - '[PAGE 27]


    您连您自己都照顾不好，您的人生将是没有意义的。


    ⑤别人跟您合作，如果不能帮助到您，这个人就应该及时的清理掉。否则到最后，大家都不开心。这个社会上，确实有人逻辑混乱，不懂感恩，不知对错。不要去跟这样的人纠缠，交往。


    ⑥能照顾好自己的人，才是高手。我照顾自己的模式，不外乎努力工作，打造团队，多赚钱，打造被动收入，健身。


    # 2、人生什么最重要（2）？


    ①身体好。身体好，您就可以集中精力工作；身体不好，您写文章，都懒惰。当然没什么前途了。我们平时认为读书啦、恋爱啦、各种其他事情重要。但当我们身体有问题的时候，我们才明白，其他的，都是没什么意义的，就是身体好重要。


    ②血缘关系重要，特别是直系血缘关系。您会发现，这个世界上，能关心您，始终只有这点人。离开了这个，您将真正的一无所有。老无所依，是恐怖的。所以，您年轻的时候，多制造点血缘关系。别跟那些傻瓜讲什么西方观念，批评什么“养儿防老”是错误的。一群傻瓜，成天攻击中国文化，以为颠覆老祖宗几千年的经验就是高明。


    我看老祖宗的话，没多少可以颠覆的，谁颠覆老祖宗的话，就证明他们丢丑了。'
  - '[PAGE 28]


    # 3、幸福如何来得最直接？


    ①远离蠢货，努力工作。愚蠢的人只知道索取，不懂得付出，还不喜欢努力工作，如此，就会痛苦。


    ②一个努力工作、不断赚钱、不断的搞 36 循环系统的人，一个月能赚几十万的小老板，如果与一群不知道感恩的人待在一起，他也会痛苦万分。比如，他女朋友只知道花钱、不知道感恩，不知道心疼人，他就会痛苦万分。他的员工只知道发工资，不知道执行
    36 循环系统，他也会非常痛苦。


    ③幸福是什么？幸福就是远离灾难。大多数的灾难都不是天灾，而是人祸。人祸是什么？人祸不过就是您交友了一些负能量的人。


    ④您能专注于自己的项目，并且跟人交往的时候，看这个人是诚信的，您就交往；这个人不诚信，您就别交往。您跟一个人交往，一开始，您就要看看，这个家伙是帮您的，还是害您的。


    ⑤稻盛和夫的基本理念，就是工作能让人愉快。工作为什么能让人愉快？因为工作的回报太大了。每天都有收入，而且，您真的带着团队执行 36 循环系统，您会发现，所有人的收入都在提高。人类幸福，大概就是付出了，有收获，这种感觉吧。工作能给您尊严，人有钱了，有物质了，就会有尊严。'
  - '[PAGE 29]


    # 4、幸福的秘密是什么？


    +   ① 离开人渣，整个个人都会非常轻松。

    ② 努力工作，日日执行 36 循环系统。

    ③ 与老师合作，踏踏实实合作出单。不贪，就是赚。分工合作，变成一个优秀的人。


    # 5、如何让自己幸福？


    +   ① 早起早睡，勤奋工作。

    ② 快速让自己的年收入破百万，然后再通过努力，让自己的年收入破千万。

    ③ 谦虚低调，搞好免责声明。

    ④ 遵守守法，找好律师。防御系统建立好。如果推找我们麻烦，可以反击必杀。但不一定杀，挂在那里让别人看也行。

    ⑤ 多生孩子。

    ⑥ 找听话、贤惠的女人。'
  - '[PAGE 30]


    # 6、生活的关键是什么？


    +   ① 早起早睡，非常重要。早上5点就要起床，洗漱完毕，工作。

    ② 倒两杯开水，工作吧。边喝边工作，读书或者写作。

    ③ 人应该工作。幸福来自于勤奋工作，多生孩子。

    ④ 不要交往低级的人，不要交往负债的人。就是连自己都养不活、没本事赚钱的人，不要交往。

    ⑤ 不要交往心情不好的人。当您交往多了低级的人，您的面相会变得非常差。

    ⑥ 只交往积极向上、努力工作的人。对自己朋友圈没有筛选、对自己交往的人没有筛选的人，会倒霉。


    # 7、为什么您听过大师的道理，还是过不好这一生？


    +   ① 首先，您听过大师的道理，您依然穷，对不对？您觉得是大師错了？其实大师没错，是您自己没有落实而已。

    ② 听道理，是不能赚钱的，只有身体力行才能赚钱。'
  - '[PAGE 31]


    ③很多人以为在家里睡觉，听听录音，看看视频，就能发财，这是天大的误会。


    ④我以前只顾读书，依然赚不到钱，后来，学了营销，天天卖东西，才开始赚钱。


    ⑤听大师的道理，一定要去干。只有干，才能改变命运。否则，就是搞笑，就是智力低。


    # 8、什么是心灵美？


    ①心灵美很复杂，不是多少人想的心肠好就可以。


    ②实际上富人欣赏的心灵美，是素质。综合素质，需要文化知识做底蕴。


    ③缺乏科学文化知识和社会经验的心灵美，没啥价值。


    ④一般人自认为的好心、良心，也没什么用。您的素质不够，不懂道理，做不好事情，对很多事情一窍不通，您也干不出来什么好事。您的良心，也就没有Speed什么价值。


    ⑤一个好心人、有良心的人，必须是一个有综合素质的人。


    ⑥我讲这些，有点刺激人。不过我是给聪明人讲的，普通人刺激到您了，您别关注我就行了。'
  - '[PAGE 32]


    # 9、如何改变命运（1）？


    ①极度努力的工作。无论您做什么工作，首先极度努力的去工作。


    ②长时间的工作，心里只有工作，您会对您的工作了如指掌。然后，很快，您就会成为这份工作中的佼佼者。


    ③做到了前两点，我们才来谈趋势，也就是互联网、人工智能。您必须选择一个有趋势的行业。


    ④学习先进的同行，这是核心。只要您不断的寻找优秀同行的工作方法，您的工作就会做得越来越好，您自然有前途。


    ⑤不努力工作的人，没有任何前途。


    # 10、如何改变命运（2）？


    ①改变命运的方式很简单，找到一个项目、一个业务，持续奋斗，奋斗，奋斗，还是奋斗。


    ②聚焦，聚焦，还是聚焦，彻底聚焦在这个项目上。'
  - '[PAGE 33]


    ③做到出类拔萃，同行都没您优秀，您就有利润。您就可以笑傲江湖，纵横天下了。


    ④主人主要是精力，要投入到自己的业务上。您奋斗的唯一目的，就是业绩，业绩，还是业绩。


    ⑤您一天到晚要找的人，永远是客户，客户，还是客户。


    ⑥您要干的事，就是搞流量，搞流量，还是搞流量。


    ⑦然后，就是谈成交，谈成交，还是谈成交。


    ⑧生活是枯燥的，越枯燥，越有利润。生活是丰富的，越丰富，人生越藩凉，慢慢的寸草不生。


    # 11、如何改变命运（3）？


    ①跟高手学习，高手如何做，我们就如何做。


    ②直接对数十位顶尖高手，进行改编。谁能理解改编，谁就天下无敌。


    ③直接卖。所有高手，都是卖，永远都在卖。外面吸引流量，到朋友圈卖。


    ④只关注自己那个流量＋变现的环节，其他一切外包。不会外包的，都是傻子，把自己累死，也没什么收入。'
  - '[PAGE 34]


    # 12、如何改变命运（4）？


    +   ①改变命运，就是聚焦，聚焦，再聚焦，聚焦到极致。

