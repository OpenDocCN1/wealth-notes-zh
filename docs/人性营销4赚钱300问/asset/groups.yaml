    ## 104、做营销有面子吗？

    ①我从来不在乎面子问题。我在乎的是自己的家庭生活能不能过好。

    ②想要赚钱，您必须做营销，做销售。

    ③我发现，只要是做营销、做销售的人，收入水平，一般都比普通人高。所以，我从技术人员转成了营销人员。

