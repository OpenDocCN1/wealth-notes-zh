    ## 97、行业无贵贱吗？

    - ①不管你是卖特产的，还是卖知识社群的，都没有什么贵贱。能赚钱，能养家糊口，是关键。②只要不违法乱纪，您干啥都是对的，主要是赚钱的效率有区别而已。③年轻人、年纪大的人、其实要的都是做生意、赚钱，赚到现金。无论您是送快递的，还是坐办公室的，本质都是赚钱。


    ## 98、选择行当为什么很重要？

    - ①赚钱，是因为我们在对的行当。②行当不对，就算是您能力很强，也只能解决温饱。③踏踏实实赚钱，踏踏实实做自己的业务，不要啥众取宠。


    ①有些行业注定发财，有些行业注定不赚钱。


    ## 99、赚钱选择什么生意？

    ①做没利润的生意，是不道德的。

    ②我不喜欢那种以免费为套路的营销，这其实是诱惑客户付出更大的代价。

    ③我希望大家都踏踏实实的赚钱，靠自己的真才实学去赚钱。

    ④有些东西，好，我们喜欢，但赚不到钱，没市场。有些东西，我们恶心，我们不喜欢，但市场大。什么东西市场大？情感类的、小说类的，这些市场极大。

    ⑤什么东西人多，喜欢的人多，我们就做怎样的文案、内容、音频、视频。这样就能赚钱。


    ## 100、生意的结构如何简单？

    ①生意的结构非常简单，流量、变现、服务。

    ②凡是不做这几个点的，都是在耍流氓。

    ③我们每一步骤，只是应该踏踏实实搞流量，然后搞变现，然后做好服务、产品，就完事了。


    ## 101、为什么有些人就是不行？

    ①只要您不断的锁定音频、视频这种平台，不断的以一个关键词做内容输出，您的月收入都会破10万。但是，我讲了这么久，又有几个人真正去做呢？我也说，是没有的，大家都很懒惰。然后不赚钱了，就骂别人，怪别人。这就是为什么我只愿意做企业家生意的原因。

    ②有些人，不是社会放弃他们，而是，他们的人性决定了，他们早早就放弃了自己。基因确实会被淘汰的。

    ③我试图给很多人讲这个道理，让他们进入这种赚钱的状态。可惜，他们连养活自己都难，别说赚钱了。多么简单的事啊，重复做就行了。不过，他们就是做不到。这真是让人怀疑人生。

    ④做音频、视频，是最简单的模式。那么还没有进入状态的人，努力吧。


    ## 102、什么叫做事能力？

    - ①优秀的人，就是拥有高尚的品格、有做事能力的人。

    - ②很多人对做事能力不理解，做事能力，就是赚钱能力。

    - ③什么是赚钱能力？就是银行卡里的数值、您的现金、您的资产，就是赚钱能力的体现。

    - ④优秀是可以衡量的。不能衡量的优秀，都是骗人的。


    ## 103、一个人最丢脸的事是什么？

    - ①一个人最丢脸的，莫过于知道了赚钱的方法，而做不到。其实，我最讨厌的就是写这种文字。

    - ②我要写的是给企业家看的文章。企业家，就是做到聚焦，日日重复一件事，把一件事打磨透彻。然后通过音频、视频分享，吸粉，找到一个变现文案，日日变现就运行了。

    - ③人，起码应该对社会有所贡献，起码应该给别人一点财富、钱财，起码应该过好自己的生活。这是企业家要完成的。

