    真正的战争，就是团队战争，也是品牌战争，是智慧战争，也是天兵天将战争。商业世界、互联网世界，要赚大钱，它是全方位、多方位的战争结果。科技 + 思想武器 +
    团队，这就是战争。


    我用战争来经营社群，我们指挥的就是经济战争。


    ## 12、人类的历史，就是争取利益的历史


    人是为自己的利益而奋斗的，也代表自己的利益发声。扩大利益的方法，就是联合。联合更多的人，就能扩大自己的利益。为少数人奋斗，是脱离群众；为多数人奋斗，是群众路线，是群众基础。


    互联网经济的本质是少了很多压迫的环节，故而生生不息，故而有利可图。环节少了，赚钱就多，大家就开心，所以做生意，就是要环节少，然后还有群众基础。


    群众基础越大，力量越大，但是，必须要带着这里面部分人发财，也就是中小企业老板。这些人要发财才行，这就属于做精准流量的范畴，还要不能得罪大量群众基础流量。这样做，力量是最大的，也能吃饱。


    人是动摇不了自己的利益阶层的，所以，我们要为广大群众


    谋福利。所以我们要干啥？我们要为所有人、为大部分人普及抖音知识赚钱，变现。但是我们只收老板，有钱的老板。这样，我们既有群众基础，也有利润。


    公益 + 收费的模式，服务大部分人。公益大部分人，靠一部分人付费，这就是粉丝经济，也是互联网经济的内核，也是我们社群运作的原理。


    人类的历史，就是争取利益的历史。我为中小企业老板争取变现的利益，争取流量的利益，当然，也为粉丝提供精神粮食。但是我们只赚老板的钱财，通过《恋爱与情感的智慧》+教老板做抖音营销，赚钱。


    想在抖音变现的中小企业老板，是我们的营销对象。人们意见不合，不能联合共同赚钱，本质是大家的利益、立场不一样。立场、利益不一样，代表自己的利益，这种人、您就不能说服，也没必要说服。所以，我们要干的，首先是寻找中小企业有钱的老板，想学抖音变现的、想卖陈老师读书社群变现的人，或者做情感项目变现的人。


    这些人来，首先，他们自己学会了，可以自己干。其次，如果他们想跟我们玩，我们考核合格后，也可以跟着我们玩。这样，来的就是阶级属性纯粹的人。


    跟我们的思想、利益不一致的人越多，我们的战争就越难打，


    所以，我们要纯粹。也就是说我们要收的人，就是喜欢玩抖音赚钱的，喜欢玩抖音变现的。不是这样的人，我们不要。


    人员要纯净，我们就只收中小企业老板，只联合、营销中小企业老板。这样，就很纯净。纯净了过后，我们的管理、讲话、语言体系就很好，很简单。


    中小企业老板，这个群体，就能带来巨大的利益。联合谁，就代表谁的利益、谁的思想。联合中小企业老板，就有钱赚。有人数，我们也帮他们说话。他们在我们这里分享得到的，也是中小企业家老板要学会的东西，就是抖音营销、短视频营销、直播营销，做抖音上的一些项目。中小企业老板需要这个，我们就提供这个知识分享，提供这个项目。他们能在我们这里生存，我们就有更好的发展。


    纯粹的中小企业老板，短视频、直播，全明白了，我们的书籍内容背诵了，直播内容就明白了。要让大家拥护我们，我们必须分享具体的视频、直播、营销方法，做项目、做流量的方式，并且有读书社群承受变现。众人做账号，不做视频、直播，则抖音矩阵起不来。所以我们唯一的任务，就是带着大家做情感项目
    + 教您做抖音项目，教老板做抖音营销项目。


    在社群里占支配地位的，必须是喜欢卖陈老师读书社群变现的人。


    拥护中小企业老板玩抖音的利益，拥护卖陈老师读书社群的人的利益，拥护玩抖音赚钱的人的利益。社群做不起来、做不好，主要是人杂，阶级属性不对。我们唯一的阶级属性，应该就是要在抖音里直播、视频变现的人，利用书籍内容变现的人。这样的人纯粹、单纯，只有一个目的，利用陈老师读书社群变现。


    中小企业老板，您想学习变现，您就来；不想利用抖音学习变现的，不来。 就这一点，人员纯粹了，我们就好工作了。当然，过渡系要做好，应打愿接，避免不必要的麻烦。有的人，根本不是来抖音玩变现的，这些人再多，意义也不大。


    每天的工作，就是争取流量，争取变现。抖音是中小企业老板，有点能力、有点耐心的老板，对那些没有耐心、没有毅力、没有脑子的人的品牌广告的营销，是中小企业老板的赚钱工具、变现工具，也是那些愚蠢、不听话、没耐心、不想干活的人浪费生命的玩具。


