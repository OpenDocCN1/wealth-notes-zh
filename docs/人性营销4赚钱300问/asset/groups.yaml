    ## 人性营销系列


    学营销，就进《陈老师方法 72 大营销系统》读书社群！


    ![](img/a56bf6102c5b1d530d690ed096021005_336_0.png)


    陈老师读书社群和老板社群，研究的是三大管理哲学思想、陈老师方法，也就是价值 + 营销。三大管理哲学思想统领《陈老师方法 72 大营销系统》，以及营销系列、赚钱系列、讲师系列、老板系列、恋爱系列。三大管理哲学思想本头就是王道思想，而营销是术，这道术一体结合，就自成一体，成为最强大的营销学。


    陈老师方法 72 大营销系统，是教老板做营销的，做自媒体、互联网营销，做品牌营销的。每一个系统都是教老板们如何做自动成交的。也就是教您安身立命、赚钱的本事、营销的本事、把事业做大做强的本事。


    > ——陈老师


    实践陈老师方法精华，

    就进《陈老师方法1000问：师生问答集》读书社群！


    ![](img/a56bf6102c5b1d530d690ed096021005_337_0.png)


    # 人性营销系列


    这套书籍是陈老师关于为人处世、心理、立志、家庭伦理、互联网营销、自媒体、粉丝经济、社群营销等方面的、师生之间的“新营销论语集”。你读了《陈老师解读〈论语〉》（1-2）、《陈老师方法72大营销系统》（上、下），要进一步升华你的思想、实践到实事上，并获得事半功倍的成绩，就一定要进《陈老师方法1000问：师生问答集》（1-2）读书社群！


    > ——陈老师书籍编辑


    学做社群，


    # 就进《陈老师方法之一个社群人的自白》读书社群！


