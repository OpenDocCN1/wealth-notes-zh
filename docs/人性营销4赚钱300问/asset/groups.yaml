    ## 65、精明的老板都干啥？


    - ①能一句话说清楚您是干什么的，一句话说动顾客购买。

    - ②竞争的本质是盯着顾客，不是情敌。死死盯住盈利点。

    - ③以强胜弱，干自己能力范围内的事。能胜利才出手；能接受失败，才能胜利。

    - ④管理团队，建立自然生态系统，优胜劣汰。亲力亲为，是自己给自己打工，赚自己的血汗钱。懂得支配人，支配资源。

    - ⑤懂得建立个人品牌、文化品牌、产品品牌，用品牌赚钱。


    ## 66、什么样的人适合发财？


    - ①永远有方法，不达目的誓不罢休。

    - ②您有什么资源可以被别人利用，同时利用别人的资源。

    - ③在互联网上不断的释放价值，做信息的传递。

    - ④选择互联网教育、知识付费项目，成本低，传播广。


    ## 67、为什么一定要做好公司？


    公司做好就是对起所有人，一定要做好公司。


    - ①互联网完全可以干零成本的生意，或者低成本的生意，成本不用投入太大。最低成本运营自己的生意，才是聪明人。

    - ②流量，与内部文案系统，做到极致，自然赚钱，没有悬念就直接能赚钱。

    - ③创业不容易，带着小伙伴们努力工作，不容易。我们出来混社会，很多人不给我们脸，但我们自己要给自己长脸。有的人问我要尊重，我想，没什么尊重的。尊重就是自己踏踏实实努力，不断的做好自己媒体创业，如此而已。

    - ④有能力搞团队化运营的，就搞团队化运营。有能力搞公司化运营的，就搞公司化运营。起步创业，自己一个人就行了。


    ## 68、创业者如何养员工？


    - ①我从来不建议一个创业者上来就养员工，慢慢来，比较快。


    自己先做，先赚钱，实在是感觉自己高负荷运作，已经干不了更多的事情了，就招聘一个助理。让助理机械性的跟着自己做些执行的工作，打下手。


    - ②陷阱在什么地方？陷阱在于您想培养一个助理做一些脑力工作，做一些更进一步的工作，做一些替代您的工作。很多人并没有什么本事，说话、做事，都做不好，也没什么专研精神，他们注定贫穷。您如果去教育他们、培养他们，最终，几年过后，您会发现，您自己浪费了不少时间。而他们，也没赚到什么钱。

    - ③一个聪明的人，是靠自己赚钱的。您是一个能赚钱的创业者，您就是聪明的。而您的手下，不能赚钱，那也是他自己的事情。您要做的，就是找到优秀的人合作。

    - ④通过合作模式赚钱，是最厉害的。也就是您的项目，要分成几块。比如，我经常在网络上帮人做售后服务、搞培训，有些人喜欢做流量，流量＋售后服务，就是一块业务了，就是一个自动的赚钱机器。而您想培养一个强大的人，这是千难万难的。我们在网络上接雏几万万，才有那么几个牛
    B 的人。可 见，牛 B 的人真的太少了。


    ## 69、很多兄弟请教我如何管理员工？


    - ①我的答案就是让每个员工执行 36 循环系统。认认真真搞定了 36 循环系统，就是合格员工；搞不定，就不合格，就开除了事。

    - ②这些员工都把流量引导到您的营销微信、QQ 上，您自然就赚钱了。

    - ③无论管理多少员工，都是 36 循环系统而已。理解了 36 循环系统，就没有什么管理难度了。理解不了，天天教育员工，累死您。


    ## 70、移动互联网时代，谁是您的员工？


    - ①现在赚钱模式，就是云养员工模式、云养推广模式，云养视频、音频模式。

    - ②现在社会不需要员工了。需要的是云员工、互联网员工。

    - ③谁是您的员工？聚焦 36 循环系统，干出来的视频、音频，在网络上流传，就是您的员工。

    - ④老师生产出来的内容，他拿去变现了，就是您的员工。

    - ⑤互联网上，只要您给钱，就有人没日没夜的干活。搞流量，搞粉丝，搞转化，也是如此。只要撬动了网络上的人没日没夜的干活，大家就会发大财。这就是影响力打造的模式。


    ## 71、如何进行整体式推销？


    - ① 高手做生意，搞传播，一定不是自己一个人搞的。

