    做社群，是做政治，做经济。政治上正确，经济上强有力的流量、变现，也就是搞视频、直播，搞陈老师读书社群、老板社群，进行变现。唯有变现，经济力量强大，我们才能生存。


    教人做抖音，不过是找到各种各样的方法、商业模式、变现途径。陈老师读书社群，就是一个非常好的变现途径。书籍内容，也是一个非常好的变现途径。


    出个别政策是解决不了问题的，要从根本上解决问题，不是一两个政策能行的。


    谁有话语权，谁的权利就更大。谁有经济权利，谁的权利就更大。本来，社会对比的就是经济权利，所以我们要找最赚钱的项目，做流量、变现。


    ![](img/a56bf6102c5b1d530d690ed096021005_254_0.png)'
  - '[PAGE 255]


    必须要有经济权利，没有经济权利是不可能的，所以我们必须用最厉害的项目，获得最大的收益。这样，我们就有了更大的权利，这是我们奋斗的结果。


    我们的努力，也是我们要生存得好。所以，我们必须有经济，我们必须有情感项目+教授板做抖音项目。流量+变现都做到极致，这样，我们的经济权利大了，我们的社会权利、地位就高了。


    # 2、能赚钱的本质，是环境的必然


    能赚钱的本质，是环境的必然。也就是抖音环境来了，抖音项目对了，选对了势能。


    赚钱是历史事实推进，才可能赚钱，并非我们主观想象的。我们主观上以为能赚钱，但是赚不到钱的时候多了。但是在环境好、在历史机遇到来的时候，就能赚钱。


    赚钱，主要项目问题，项目对了，就能赚到钱。百分百是这个道理。抖音问题，是中国互联网的问题，也是我们的生存问题。教授板做抖音，就是解决中国人做互联网的问题，解决的是老板'
  - '[PAGE 256]


    转型的问题，是电商转型，也是微商转型，是所有老板的第二次生命。


