    ### 24、穷二代唯一的出路是什么？


    ①想要混好，是要付出代价的。如果您不愿意下定决心，付出代价，提升自己的收入；如果您没有豁出去的勇气，一鼓作气；如果您有聚焦的魄力，没有断舍离的智慧，您就很难。


