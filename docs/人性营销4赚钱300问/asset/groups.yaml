    ⑤有钱的，搞付费流量，在别人流量池捞流量。没钱的，下苦力就行了。


    ## 296、为什么我们社群能生存？


    ①只要有人做生意、开公司，我们建立社群，搞咨询、分享，就有前途，我们卖营销知识就有前途。


    ②创业是文化母体。母体存在，生意就存在。


    ③创业的核心是营销，是提升释放的营销水平，是成交，是广告系统。所以，我们的咨询里，重点要讲的是营销＋广告系统＋成交系统。


    只要我们做好这几点，推销，势必有人买单。我们的社群势必能生存下去。


    ## 297、我创业以来的经验有哪些？


    我刚创业的时候，没有经验，凭着胆气就开始了。我妈妈支持了我一千块。我压根就不知道如何创业。我就忽悠了十几个人的团队，我们连干啥都不知道，也不知道如何做营销，也不知道如何做成交，也不知道客户在哪里，我们就买了办公桌、住房用品，我们就开始干了。结果，还没干到三个月，大家就开始争吵，大家就开始官心计。大家都是素质怎么高的打工仔，被您忽悠来创业了，没有人有耐心坚持3个月的。一周见不到钱，就开始打游戏了。现在看来那段时光，我学到了什么？


    - ①创业最好一个人上路，因为，可能就您自己行。

    - ②创业开始，并不是有团队就好。因为您团队里的人，基本都是打工心态，是等着发工资的，还不能理解创业是要投资的。他们头脑理解不了这件事。

    - ③最好不要与学历低的人一起创业。学历从某种程度上，是智力门槛。优秀的人，还是高学历的多些。

    - ④创业，要做自己能搞定的小业务。

    - ⑤创业在于坚持，一定要坚持下去。只要您坚持，您成功的几率会大于95%。

    - ⑥创业成本要低，不要一开始就花很多钱租办公室，搞装修。

    - ⑦如果您有一个创过业的、自己也能赚钱的创业导师，这个导师能掏心掏肺的教您，您也愿意听话，您就算有最大的福分。所以，我一直都喜欢掏钱拜老师，一般都划得来。


    ## 298、我相信什么？


    - ①我们就是要踏踏实实一步一个脚印，锁定一个关键词，比如情感、恋爱，一干就是一辈子。

    - ②创业，主要踏实肯干，而不是成天幻想。只要天天干活的人，都能赚钱。

    - ③不得不承认，这个世界上，确实有人很聪明。他们能在短时间里事业成功，就是所谓的赚到大钱。但我们不是那么聪明的人，我们只能靠实在的干。

    - ④我认为，普通人创业，赚钱的核心在于，踏实+坚持锁定一个项目干活+团队+有人指导+融入一个社群。

    - ⑤融入一个社群，靠群体式的力量+智慧，去做一个项目。这样，对于普通人来讲，成功率会高很多。

    - ⑥我还是如同既往的干36循环系统，也带着大家干36循环系统。

    - ⑦我相信复利，相信量变引起质变，相信踏踏实实干活，而不是空想。


    ## 299、如何分配利润？


    公司的成本、利润，都核算到个人，杜绝大锅饭。每个人成本、利润都要一清二楚。


    - ① 每个人吃了多少钱、住了多少钱、花了多少钱的成本，支出了多少钱，都明确记录，平摊到个人，是可以每天都看清楚个人账目的。

    - ② 每个人产生了多少收益，都明确记录。也就是这个人为公司赚了多少钱，明确记录。

    - ③ 这个人的收入 - 成本 = 毛利润。

    - ④ 毛利润的一半，用来发展公司，扩大生产。毛利润剩下的 一半分为红。

    - ⑤ 分红的 70%，分为干活的人。30% 分红为资本分红。

    - ⑥ 我干活了，最多只分这个人的 10%，为体力、智力收入。

    - ⑦ 欢迎所有人进行资本投资，来分剩下的 30%。资本投资，也就是按比例分这 30%。比如，我投资 20 万，您投资也是 20 万，那么，这 30% 就分
    15%。人多了，以此类推，给所有人资本投资的机会，投资过后，不能撤资。

    - ⑧ 记账方法，是完全到个人的，也就是我们要每日记账，而且要让每个人看到自己的支出与收入。


    ⑨我们记账的一切目的，是为了避免有人在团队、公司，吃大锅饭。记住，想过好日子，一切只有靠自己。我是靠自己赚钱的，我自己会记录我自己的账。


    ## 300、我为什么信奉种田派？


    ①互联网的本质，就是人海战术。做互联网生意，就是增加人数的游戏。增加粉丝，裂变团队，谁能玩好这个，谁就天下无敌。


    ②有粉丝，您不精挑细选人才吗？一般人没有眼光看到谁是人才。大老板，都会走眼。


    ③最优秀的策略，是人多，然后在实战中赛跑。这就是宰相必起于州郡，猛将必发于卒伍。


    ④魔兽世界这个游戏，奥特兰克山谷里面就是资源消耗战、人数消耗战。这个设定合理、现实、残酷。


    ⑤人是一种资源，所以叫做人力资源。大型公司里，叫做人力资源部。把人当成了资源，无论您愿不愿意，人，本质就是资源。


    ⑥团队人多，里面就有人才，东边不亮西边亮。只要有人才，则您干啥都行。团队人少，里面歪瓜裂枣多了，成本大，没利洞，您就 game over。


    ⑦互联网的厉害之处，就在于可以山呼海啸的增加人数。一个人，非常凶猛，一个月搞几万、几十万，了不起呀，累不死您！但是，一群人、几百人，其实，收入都不比一个人厉害。


    ⑧生意与战争的本质，就是增加人数，增加人数的质量。我信奉人海战术、种田派。我认为人多力量大，人越多越好，大家一起搞，就能天下无敌。


    ⑨要想着服务更多的人，要想着直播、视频，让粉丝越来越多。这是我们死磕的方向。我们的死磕是让粉丝、直播人数上升。价值+传播，这是我们深入的方向。人数，人数，还是人数。数量解决一切。


