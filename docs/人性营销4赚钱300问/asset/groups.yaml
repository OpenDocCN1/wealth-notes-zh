    ## 玄

    陈老师


    > ○ 听大师的道理，一定要去干。

    只有干，才能改变命运。

    — 陈老师


    ### 1、人做什么最重要（1）？


    ①交友。人是会被朋友影响的。

    您交往的人，喜欢欺骗、不诚信，慢慢的，您也会变成那样。

    您交往的人，好逸恶劳、贪慕虚荣，慢慢的，您也会变成那样。

    一个智慧的人，应该一开始，就交往一个有素质、有道德的人。

    远离那些具有腐败品质的人。


    ②读书。人一定要日日读几本好书。

    我的策略，就是日日读书，情绪越来越好，事业也越来越好。


    ③努力赚钱。钱可以说是非常非常重要，过分点说，是一切的根基。但是大家不喜欢这样讲，觉得这样丢脸、无耻，心里只有钱。

    很多人高尚的说："钱不是一切，钱不重要。" 但是等他们想要钱的时候，却没钱。

    对于故视钱的人，我们要远离。我们就是竭尽全力的工作，拼命奋斗，为的就是多赚些钱，让自己以及跟自己具有核心关系的人，生活过得好些。


    ④照顾好自己。人首先要照顾自己的健康，照顾自己的金钱，照顾自己的情绪、自己的父母。人不是先去照顾别人的，比如，照顾您的女朋友、您的员工、您的同事。不要讲我伟大的话题。


    您连您自己都照顾不好，您的人生将是没有意义的。


    ⑤别人跟您合作，如果不能帮助到您，这个人就应该及时的清理掉。否则到最后，大家都不开心。这个社会上，确实有人逻辑混乱，不懂感恩，不知对错。不要去跟这样的人纠缠，交往。


    ⑥能照顾好自己的人，才是高手。我照顾自己的模式，不外乎努力工作，打造团队，多赚钱，打造被动收入，健身。


    ### 2、人生什么最重要（2）？


    ①身体好。身体好，您就可以集中精力工作；身体不好，您写文章，都懒惰。当然没什么前途了。我们平时认为读书啦、恋爱啦、各种其他事情重要。但当我们身体有问题的时候，我们才明白，其他的，都是没什么意义的，就是身体好重要。


    ②血缘关系重要，特别是直系血缘关系。您会发现，这个世界上，能关心您，始终只有这点人。离开了这个，您将真正的一无所有。老无所依，是恐怖的。所以，您年轻的时候，多制造点血缘关系。别跟那些傻瓜讲什么西方观念，批评什么“养儿防老”是错误的。一群傻瓜，成天攻击中国文化，以为颠覆老祖宗几千年的经验就是高明。


    我看老祖宗的话，没多少可以颠覆的，谁颠覆老祖宗的话，就证明他们丢丑了。


    ### 3、幸福如何来得最直接？


    ①远离蠢货，努力工作。愚蠢的人只知道索取，不懂得付出，还不喜欢努力工作，如此，就会痛苦。


    ②一个努力工作、不断赚钱、不断的搞 36 循环系统的人，一个月能赚几十万的小老板，如果与一群不知道感恩的人待在一起，他也会痛苦万分。比如，他女朋友只知道花钱、不知道感恩，不知道心疼人，他就会痛苦万分。他的员工只知道发工资，不知道执行
    36 循环系统，他也会非常痛苦。


