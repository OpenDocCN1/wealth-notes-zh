    - ②极度低调。

    - ③免责声明 + 律师咨询。

    - ④见谁都尊重，哪怕对方是个傻子、白痴，我们依然要态度好。

    - ⑤一切问题，都是我们自己的问题，而不是别人的问题。

    - ⑥日日夜夜带着大家搞 36 循环系统 + 聚焦体系。


    ## 287、我们社群赚钱的模式是哪十条？


    - ①品牌战略、品牌营销，利用品牌赚钱。

    - ②三大管理哲学生思想，是社群的真正根基。

    - ③早起早睡，锻炼身体，尊师重道，孝敬父母。

    - ④六脉神剑。

    - ⑤只做读书社群和老板社群这个项目，聚焦一个点，搞 5 大锁定系统，从一而终。

    - ⑥全员矩阵营销。

    - ⑦提升德行，找到德行更高的人，跟著我们干活。呕心沥血的对大家好，近悦远来。

    - ⑧只影响富人，只营销富人。

    - ⑨日日循环，不断的做讲书人视频、直播。


    ## 288、我们社群赚钱的法则是什么？


    - ①只营销有钱人。

    - ②只营销老板、企业家。

    - ③只跟有钱人说话。

    - ④只跟有钱人做生意。

    - ⑤一切为了有钱人。有钱人有钱，就给您钱，于是，您就赚钱了，您就富了。这是唯一的秘密。

    - ⑥尊重规则，大家都赚得多；不尊重规则，大家就赚得少。


    ## 289、陈老师方法的核心是什么？


    - ①做好小事，做好每一个音频、每一个视频、每一篇文章。

    - ②踏踏实实的执行 36 循环系统。

    - ③日复一日的干，持续的干，绝对不偷懒。

    - ④尊重客户，尊重自己，尊重粉丝。

    - ⑤管理好自己，不浪费自己的时间。

    - ⑥尾巴系统 + 图片系统 + 合作系统 + 聚焦系统，都做到位。

    - ⑦熟练使用各大营销系统和轻饵。

    - ⑧用三大管理哲学思想指导我们的人生。


    ## 290、我为什么只做读书社群和老板社群？


    - ①人一定只能做一件事，一个概念。

    - ②我做读书社群和老板社群，其目的，只是为了给我社群里的人一个项目，让大家跟着我有项目可以做。

    - ③我会完全教会大家在互联网上做流量、变现的招式。因为我本人是真正的实战派，凡是我社群的人，都应该明白。我是干出来成绩的人。

    - ④老板们跟着我学，也就是学做读书社群，学做情感项目，教您做抖音项目，做社群项目。

