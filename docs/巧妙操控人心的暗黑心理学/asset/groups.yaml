    # 前言


    正確運用讀心術，提高存在感，拒當路人甲！


    感謝您閱讀本書。


    或許您是一時興起，隨意翻閱；或許，您最近正好對於這些狀況感到煩惱：


    +   • 痛苦的職場人際關係

    • 對方不聽自己的意見

    • 無法讓對方回答「YES」

    • 想法被否決，無法如預期進行

    • 毫無自信，戀愛也不順利


    活在世上，各種人際問題帶來了各種煩惱。如果能夠瞭解人們的深層心理，'
  - '[PAGE 4]


    猜測、操控對方的心思，讓一切盡如己意，豈非美妙至極？


    若是您內心有這樣的願望，本書介紹的眾多心理技巧將對您大有助益。


    然而，看到「猜測人心」、「操縱人心」這幾個字，一定有人會覺得非常可疑、古怪。那麼就先來嘗試一個心理技巧，瞭解它的作用吧！


    讓我們做個實驗：在五秒內操縱眼前的人。


    準備好了嗎？


    您在哪裡閱讀本書呢？


    在書店？還是在電車上？


    請站在原地，抬頭盯著天花板看。


    好了嗎？


    請繼續盯著天花板。


    過了一會兒，您一定會發現：


    有人好奇你在看什麼，也看了看天花板。接著，有更多人氣到好奇，紛紛抬頭看向天花板。


    從這個實驗可以看出「從眾行為」（conforming behavior），證明人類的行'
  - '[PAGE 5]


    動會在不知不覺間被影響。許多相關研究都顯示，我們所做的「決策」（decision making）比想像中更容易受到他人誘導。

    以此為例，只要適當地應用「從眾」這個心理技巧，必能使您的事業獲利。

    尤其是銷售方面，若能藉此技巧控制對方的購買欲，業績就能有所提升。

    就算不懂這些心理技巧，又如何呢？您或許這麼想，打算去買幾本「真正的」商管書回家——管它有沒有用——繼續無謂的努力。

    事實上，瞭解人心才是第一要務。多數成功的政治家、企業家都很擅長運用心理技巧，看穿對手的心思並自由操控，以達成自己的目的；頂尖的銷售人員、優秀的廣告文案當然也具備了這種技能，牢牢地掌握人心。

    我將這些心理技巧稱為「讀心術」。

    所謂讀心術，並非毫無根據的古怪心理測驗，也不是犯罪伎倆。

    它是以實驗與理論為基礎，發展而成的「最強學問」。


    +   如果您想學習：

    * 催眠、誆騙別人的洗腦手法

    * 可用於犯罪的思想控制'
  - '[PAGE 6]


    請立刻將本書放回架上！


    因為這本書是為了協助您，在工作、戀愛、生活等層面建立良好的人際關係。藉由瞭解對方的想法，預期對方的反應，進行有效的溝通與互動。


    不好意思，尚未自我介紹。


    我是一名「讀心師」。


    早在「讀心術」一詞廣為知曉的十年前，我便以「日本唯一讀心師」的身分展開活動，曾經多次受邀在電視節目上表演。


    二〇〇九年，我移居香港，鮮少再出現於熒光幕前。不過，這段期間我結識了許多香港富商與重要人士，並在世界大學排名前五十的香港大學開設讀心術課程，將讀心術推廣至全球。


    這門讀心術課程班班爆滿，因為我上課時皆以自身的體驗為基礎。


    多數讀心師僅以脫離現實的理論為基礎，對讀心術紙上談兵。我則是曾經面對黑道，從生死交關的心理戰之中，反饋到讀心術這門學問。


    日本的讀心師不敢和我正面對決，因為他們非常清楚我的實力與潛力。'
  - '[PAGE 7]


    只要看完這本書，您肯定也能瞭解其中差異。


    相較於市面上其他乍看實用、外行人卻無法立即應用的書籍，我以「速效性」為標準，為工作繁忙、時間不多的讀者，嚴選各種容易理解、運用廣泛的技巧。


    換言之，這本書介紹的是任何人都能使用的高效技巧。


    準備好操控人心了嗎？


    請仔細閱讀到最後。


    並且，請勿濫用讀心術。


    小羅密歐·羅德里格斯'
