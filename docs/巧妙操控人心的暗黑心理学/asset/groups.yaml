    一九七四年，加拿大心理學家唐納德．達頓（Donald Dutton）及亞瑟．艾倫（Arthur Aron）在卡皮蘭諾吊橋（Capilano Canyon Suspension
    Bridge）


    進行了一項關於生理與認知學說的實驗。


    實驗召集了十八至三十五歲的單身男性，分別通過架在溪谷上的搖晃吊橋與穩固橋樑。走至橋中央時，年輕女性上向前向他們攀談，要求做問卷。


