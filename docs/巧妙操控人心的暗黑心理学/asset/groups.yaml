  - '[PAGE 86]


    # 想安撫怒氣，  就讓對方取回控制權


    利用「得寸進尺」策略假裝退讓


    「你們的商品是怎麼回事！我不會再跟你們往來了！」


    「跟一開始說的完全不一樣啊！把錢還來！」


    任何時代、任何行業，從來沒有不抱怨的客戶。重要的是，必須理解對方為何生氣。


    我們內心都有所謂的「操控感」（sense of control）。它指的是能根據行動，打造預期中的情境。


    在心理學上，比較傾向「控制事物的是自己」這種想法的人，稱為「內在操控型」；反之，傾向「控制事物的是運氣等自身以外的因素」這種想法的人，則稱為「外在操控型」。


    內在操控型的人，平時就有強烈的操控感，即使稍微失去這種感覺，也不會'
  - '[PAGE 87]


    因為想要取回而憤怒。


    外在操控型的人，由於日常生活中無法得到足夠的操控感，所以當自己僅剩的一點操控感被奪走時，就會出現憤怒的反應。


    遇到這種狀況，建議你選用適合的談判策略，一個是「以退為進」（*詳見第52頁），另一個是「得寸進尺」（foot-in-the-door）。這兩項策略在銷售心理學中經常被提起，想必你也相當耳熟能詳。


    面對外在操控型的人，很適合運用「得寸進尺」──先從簡單的請求開始，再逐步提升請求的難度。


    此時要注意的是，對方急欲取回自己的操控感，所以千萬不可頻頻插話，一且對方覺得無法取回操控感，就會更加憤怒。因此，請靜靜地聽取對方的要求。


    如此一來，對方會在無意識中感受到你的「協助」，不滿的情緒將慢慢平息下來。


    # POINT

    對方越憤怒，你要越冷靜，達成真正的目的。'
  - '[PAGE 88]


    # 喝一口水，看看對方有沒有跟著做

    以「動作鏡射」確認客戶對你的信任度


    「明明建立了信任關係啊！到底是哪裡出了差錯呢？明明覺得和潛在客戶相處融洽，也請對方打高爾夫球了，也請對方喝酒了，也邀請對方參加派對了，以為好不容易建立了信任關係，到了緊要關頭，對方卻說：『不好意思，這筆生意我們要交給其他公司。』連週末都加班應酬，努力爭取認同卻落得如此錯愕的下場，實在太蠢了！然而再怎麼悔恨也來不及了。


    美夢成空的原因很清楚：你自以為建立了信任關係，對方卻不這麼認為。


    可是，總不能頻頻向顧客確認：「你相信我嗎？」只能獨自煩惱，不知該如何是好。


    想知道自己是否贏得了信賴，「動作鏡射」是一個簡單有效的方法。'
  - '[PAGE 89]


    比方說和情人約會時，你們一邊在咖啡廳或酒吧裡聊天，你隨手拿起飲料喝了一口，情人也很有默契地同時拿起杯子。回想看看，是否有過這種經驗呢？


    在彼此高度互信的基礎上，這種狀況很常發生。


    但它不限於情人之間，只要人與人互相信任，就會常常不知不覺做出鏡射動作。理解了這一點，便能加以運用——


    藉著與潛在客戶一起出席的飯局，仔細觀察。當你拿起杯子或將食物送到嘴邊時，看看對方是否在無意識中配合你的動作，便能得知他對你的信任度。


    時間點則是三秒以內。


    如果你拿起杯子喝了一口，對方在三秒內也拿起杯子往嘴邊送，這樣重複三次以上，便可以斷定對方極可能非常信任你。


    # 頂尖業務的基本功是一觀察』，別放過每個細節！'
  - '[PAGE 90]


    # 說話時，注意對方的腳有沒有正對著你

    從雙腳「看」出對方的真心話


    客戶是否對你的商品有興趣，只要觀察「身體的動作」就能瞭解。


    這個原則，每位櫃檯接待人員應該都很熟悉吧？讓我來說明一下其中的道理。


    遠古人類靠著狩獵維生，雖然和現代社會的生活模式完全不同，但是我們仍繼承了祖先的基因。這一點，從「身體的動作」就看得出來。


    請試著回想：當你緊張時，手會不會變冷？


    這是因為此時全身的血液都流向雙腳了。


    為什麼有這種現象？


    原因在於，感到恐懼或受到威脅時，人在本能上會覺得必須趕快逃離現場，這正是基因的影響。遠古狩獵生活危機四伏，必須時時警戒，一發現狀況不對，'
  - '[PAGE 91]


    ![](img/43b499f5de61347f22210d54bfb2afd6_91_0.png)


    好想離開


    ![](img/43b499f5de61347f22210d54bfb2afd6_91_1.png)


    腎上腺素激增，血流向雙腳，才能隨時拔腿就跑。利用這種天性，就能辨別客戶的真心。談生意時，請注意對方的雙腳。如果腳的方向直直地對著你，就表示生意有望談成；腳的方向若是向外，也就是並非對著你時，你再怎麼費盡唇舌，通常也會無疾而終。腳的方向朝外，顯示對方下意識想趕快逃離，也是對你的商品沒有興趣的信號。


    人類本能不可小覷，許多有用的心理技巧都是由此而來。'
  - '[PAGE 92]


    # 同時說出正反兩面的話，抓住對方的心

    用「冷讀術」讓對方覺得你瞭解他


    假算命師或占卜師不必事先調查，便可以當場說出上門委託者的過去、現在與未來，經常令人感到驚訝不已。


    這是因為他們精通「冷讀術」（Cold reading）這項技巧。


    在商场上，不論談生意或開發客戶，事前調查非常重要。但是如果時間不夠，實在無法收集對方完整的資訊。


    這時，冷讀術能發揮驚人的效果。


    「冷讀術」也不過就是說些模稜兩可，能套用在任何人身上的話罷了！


    許多人有這樣的誤解，但是這項技巧並非那麼淺薄。


    首先來看冷讀術之中比較簡單的類型：雙面手法。


    日本有句俗話：「人九成看外表。」幾乎每個人都是從外表判斷別人。'
  - '[PAGE 93]


    如果眼前有個相貌可怕的男性，你絕不會對著他說：「你的臉好可怕喔……是天生的嗎？」


    所謂雙面手法，就是同時說出對外表的印象，以及相反的另一面：


    「可能經常有人說你的相貌很可怕，但你其實是非常溫柔的人。」


    先說出外觀上的印象，然後再表達相反的形象。必須注意的是，之後說出的話必須是好的那一面。


    大多數人的心理都有與外表相反的一面。若是心理的那一面被說中，對方就會覺得：「哇，這個人很瞭解我。」於是就會對你產生好感。


    這樣看來，應該就不難理解為什麼許多人會不斷地去找只有一面之緣的算命師了吧。


    「找這個人絕對沒錯」、「他說的語都是真的」，只要讓人如此深信不疑，假算命師的目的便達成了。


    # 多加練習雙面手法，一舉掌握對方的心！'
  - '[PAGE 94]


    # 衣著華麗的人，有強烈的自我主張


    用「熱讀術」看出對方的個性


    一百位顧客，有一百種性格。


    因此，應對不同的客人，相同模式的銷售手法通常不管用。


    前一節提到的「冷讀術」是假算命師常使用的手法，不須任何準備或事先調查，就能說中對方的事情。


    與之相反的是「熱讀術」（Hot reading）：以事先調查所得到的資訊為基礎，「假裝」說中對方的事情。當然對方並不知道自己被調查過，所以會覺得：「他對我知道得一清二楚。」而心生信任。


    利用「熱讀術」，即使沒有詳盡分析對方的心理層面，他也會信賴你。


