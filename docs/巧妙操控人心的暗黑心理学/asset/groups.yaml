    # 不靠藥物，輕鬆戒除多年菸癮 大聲念出「宣言」戒除惡習


    這個方法對於想要戒除某種惡習的人非常重要，以下用戒菸為例來說明。近年來越來越多人尋求戒菸門診協助，也開始倚賴藥物戒菸。


    要你立刻不再抽菸，是不可能做到的。越是忍耐，尼古丁戒斷症狀會越嚴重，絕對無法抑制焦躁感。


    該怎麼做，才能不靠藥物成功戒菸呢？最有效的方法是「宣言」（affirmation）。


    宣言就是對自己宣誓。只需每天早晚宣讀誓言，除此之外，隨時想抽菸都可以，不需要忍耐。


    宣言內容由自己來寫，例如：「我是笨蛋。誤以為香菸可以讓我釋放緊張情緒的笨蛋。找各種藉口讓成癮'
  - '[PAGE 193]


    ![](img/43b499f5de61347f22210d54bfb2afd6_193_0.png)


    沒有戒不掉的癮，只有戒不掉的藉口。


    性比毒品還高的香於佔據日常生活的笨蛋。每天特地花錢把毒素吸進體內，明明很清楚這一點，卻假裝不知道的笨蛋。依賴這種東西的笨蛋真是可悲。別人心裡都在想：『他無法擺脫菸癮，真是可憐。』我自己也明白，卻還是假裝不在乎，真是笨蛋。這樣下去永遠無法成為成功人士，因為成功人士不抽菸。我實在是個笨蛋。


    每天早晚都念出這段內容，抽菸時也大聲念。過了不久，你就會覺得自己很愚蠢，自然而然不再抽菸了。


    這是催眠療法的技巧，等於是由想戒菸的人對自己進行催眠。越容易受暗示的人，成功率越高。'
  - '[PAGE 194]


    # 想要變得有自信，就假戲真作


    靠「肢體語言」提振信心


    如果可以更有自信就好了……


    經常有人垂頭喪氣地這麼說，卻不知該怎麼做。如果每個人都擁有自信，這個世界一定會變得很不一樣吧。


    擁有自信的人，是什麼樣的人呢？以運動為例，或許比較容易理解：在拳擊場上，世界冠軍與練了三個月的初學者，誰比較有自信呢？


    不用想也知道是前者，因為自信與經驗值成正比。對於某項技能越有經驗，就越有自信。


    「照你這樣說，想要變得有自信，不就得花很久的時間……？」


    其實，只要瞭解一個原則，就能充滿自信'
  - '[PAGE 195]


    # POINT


    人體語言會受到情緒影響，情緒也會受到身體的控制。


    人在沮喪或雀躍時，肢體語言有很明顯的差異。沮喪的人垂肩低頭、彎腰駝背、萎靡不振，雀躍的人手臂大幅擺動、抬頭挺胸、聲音宏亮。當你沮喪時會蹦蹦跳跳的嗎？不會吧？那麼，蹦蹦跳跳地走路是什麼心情？應該是開心吧？隨著情緒不同，肢體的表現也會改變。


    反過來說，先讓身體呈現出自己想要的情緒，就能自由控制情緒。


    同理，想擁有自信，只要讓身體表現得有自信就可以了。抬頭挺胸，肩膀放鬆，站姿端正，目光直视前方，動作優雅，聲音宏亮。


    習慣了這種姿勢，身邊的人就會認為你看起來很有自信。不知不覺中，你會真的越來越有信心。訣竅無他，就是持續下去，效果肯定令你大吃一驚。'
  - '[PAGE 196]


    # 拒看電視新聞，改善焦慮症狀


    讓自己跳脫「不安螺旋」


    > 「疫情蔓延得好快，世界要毀滅了……」


    > 「最近地震好多。不知何時會發生大地震，晚上都睡不好……」


    避開危險、追求安全是人類的本能，但是有些人卻過度反應。這個現象稱為「不安螺旋」（anxiety spiral）。


    極度焦慮，一想到最近經常發生飛機墜毀事故，便異常地抗拒搭飛機；看了隨機殺人事件的報導，就時時刻刻以懷疑的眼神看待路上每一個陌生人……


    假如你發現自己是個心情會隨新聞劇烈起伏的人，務必趁來得及之前矯正。


    因為若是對這種狀態之不理，最終想法會變得非常消極，甚至會嚴重影響日常生活。


    應該怎麼改善呢？'
  - '[PAGE 197]


    第一步就是不要看太多新聞。比起正面的消息，人們更愛打聽不幸的消息。雖然一方面覺得可憐，卻也潛藏了「幸災樂禍」的心理。這是人性的黑暗面，看到他人落入不幸之中，對於自己的現狀就能感到安心。這是天性，基本上很難改變。


    新聞台需要收視率，沒有觀眾就沒有廣告收入。為了迎合觀眾口味，只好製播大量的犯罪、事故、災難等負面新聞。


    換言之，「最近發生了好多糟糕的事」只是一種幻覺。世界各地每天都會發生各種事件，就看新聞台是否願意播報而已。拒看新聞，生活裡就不會充斥不幸的消息，不會因此惶惶不可終日。


    我實際試過，即使不看新聞，生命也不會有什麼改變。只要不發生戰爭，日子還是照舊。


    如果你時時感到不安，別再接收多餘的消息，立刻停止這種惡性循環。


    ![](img/43b499f5de61347f22210d54bfb2afd6_197_0.png)


    焦慮狀態會導致大腦過度注意某些事情，影響其他正常功能。'
  - '[PAGE 198]


    # 手指緊握、緩緩吐氣，比鎮定劑更有效


    以「安慰劑效應」消除緊張感


    向客人推銷商品或是在會議上做簡報，這類場面難免令人感到緊張。有些人甚至由於過度緊張，導致失敗。


    電視上的主播在播報即時新聞時，對著鏡頭仔細而流暢地讀稿，明明是緊張萬分的情況，卻絲毫看不出來。是不是有什麼祕訣呢？


    歸根究底，人為何會緊張？


    感到緊張，正是我們超越當下自我的時刻。


    稍微想一下就能明白，在家人好友面前說話並不緊張，在客戶廠商面前卻會緊張吧？就算說話內容相同，心情上卻一定有差別。


    沒有人天生不會緊張。


    新聞主播們內心也是緊張不已，只是沒有顯露出來而已。這正是專家與外行'
  - '[PAGE 199]


    人的差異。


    我們不是專家，就無法消除緊張感嗎？其實有一個心理技巧很好用，執行起來也很簡單：


    覺得緊張時就深呼吸，用四根手指用力握住拇指，再平靜地吐氣，如此重復幾次就不會緊張了。


    為什麼這個動作能舒緩緊張？事實上，握緊手指吐氣的動作與緊張感完全無關，而是它能產生消除緊張的「安慰劑效應」（Placebo effect）。


    重復多次的目的，是為了讓安慰劑效應更確實，將身體變成意識的開關。據說鈴木一朗獨特的打擊姿勢，也能使他冷靜下來。


    雖然安慰劑效應是心理作用，只要相信，自然能發揮效果。


    你的信念，是穩定情緒最有效的藥方。'
  - '[PAGE 200]


    ![](img/43b499f5de61347f22210d54bfb2afd6_200_0.png)


    瞭解色彩，無往不利


    # 繫上紅色領帶，看起來更有說服力

    配合各種目的改變「顏色」


    即使你沒有讀心術，只要稍微改變外表，就能依照你想要的控制對方。毋須任何技術，就能輕鬆展開行動，方法很簡單：運用身上衣物的顏色。必須注意的是，並非以全身衣著作為目標色，而是凸顯配戴的「重點」。重點最能在無意識中給予暗示。建議男性用領帶，女性用圍巾。應該配什麼顏色呢？首先在職場上，例如做簡報時，應該配上對方容易被你說服的紅色。美國總統演說或選舉造勢等場面，幾乎都繫上紅色領帶就是最有力的證據。想要留下良好的第一印象，就配上能令人感到穩定與協調的綠色。


    200'
  - '[PAGE 201]


    ![](img/43b499f5de61347f22210d54bfb2afd6_201_0.png)


    想要說服別人，配上藍色的話容易導致失敗。因為藍色令人想到沉靜與抑制，欠缺打動對方內心的力量。


    雖然前面以職場為例，但戀愛也完全相同。


    想求婚時就用紅色。


