    「該如何爭取考績獎金呢？」


    一、到了人事考核的時期，許多人都不禁思考這個問題。

    「完全不認同公司的人事考核結果！」「明明這麼賣力工作，為什麼沒有正面評價？」有些人心存疑問，甚至憤憤不平。

