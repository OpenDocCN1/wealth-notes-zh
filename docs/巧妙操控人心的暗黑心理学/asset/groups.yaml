    ## 讓憤怒的同事瞬間冷靜下來

    表現得比他更生氣


    沒有什麼情況比面對暴怒的人更棘手了。但是，其實有個方法能輕易地讓對方息怒。


    美國情報機構 CIA 進行過一項研究：刻意激怒實驗對象，再透過各種方法，測試平息怒氣要花多少時間。


    實驗對象有三位。第一位由研究人員拚命以言語安撫，第二位是用鏡子讓他看見自己生氣的模樣，第三位則是研究人員表現得比實驗對象更憤怒。


    結果，以言語安撫的第一位實驗對象花了一段時間平息怒氣；看了鏡子的第二位實驗對象在幾分鐘內平靜下來；研究者假裝發怒的第三位實驗對象則是瞬間變得冷靜。


    從這個實驗可以得知：比生氣的人展現出更憤怒的情感，對方就會瞬間平靜。


    ![](img/43b499f5de61347f22210d54bfb2afd6_37_0.png)


    > POINT

    以銅為鏡，可以正衣冠；以人為鏡，可以明得失。


    醒，忘了剛才的怒氣。


    這是被稱作「自我同一性」（self-identity）或「自我認同」的心理狀態，會讓人將對方的實力與成果錯誤為自己的實力與成果。舉例來說，就像我們看完電影《洛基》之後，會有自己彷彿變強了的錯覺。


    前述實驗則是反過來利用了「自我同一性」——見到比自己更憤怒的人時，會立刻瞭解：「我在他眼中是這種感覺啊。」理性便瞬間恢復。讓第二位實驗對象在鏡中看到自己，也有相同效果。


    一旦遇到發怒的對象，只要表現得比他情緒化即可。不過，演得不好反而會火上加油，必須小心注意。


