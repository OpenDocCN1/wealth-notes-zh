    ## 態度一致，三明治主管也能受人歡迎


    採取「一致性原則」發揮影響力


    在一個組織裡，較容易罹患憂鬱症的是中階主管。


    這也難怪，畢竟不僅得看主管的臉色，也得監督下屬的工作，總是左右為難。


    此時，請以「一致性原則」（Principle of consistency）克服困難。


    人們無法信任想法不定、意見反覆的人。反之，面對一個意見毫不動搖的人，對方極有可能認為：「他都這麼說了，應該無法說服吧……」


    《十二個溫柔的日本人》這部電影，是由三谷幸喜先生改編自一九五七年上映的《十二怒漢》（12 Angry Men），故事內容是一名陪審員與其他陪審員意見不同，從頭到尾主張犯人「無罪」，之前認為「有罪」的其他陪審員，最後不再堅持己見，轉而認同犯人「無罪」。


    雖然這是電影情節，但是日常生活中持少數意見的人若持續採取一致的態度，也能改變抱持反對意見的多數派。這個現象稱為「少數影響力」（minority influence），經心理學實驗研究已獲得證實。


    以前電視上曾進行過一項心理實驗，邀請五個人參加，其中一人是節目製作單位安排的臨演。讓這些人看兩根長度不同的棒子，請他們回答哪一根比較長。參加者當然都指著較長的棒子，唯獨臨演自信滿滿地指著短棒子。反覆多次後，隨著實驗的進行，參加者都被臨演影響，「也許是我錯了」，紛紛開始和臨演一樣指著短棒子。實驗結束時，所有人都回答短棒子比較長。


    利用「少數影響力」，讓主管與下屬覺得你的想法始終如一，這樣一來，你的意見就會得到大家尊重。


    少數改變多數！成為關鍵少數，讓多數人甘心服從。


