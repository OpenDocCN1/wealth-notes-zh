    ## 向第三者說好話，公司女同事都挺你


    利用「溫莎效應」博得好人緣


    在組織內工作，若不好好建立人際關係，一旦出了什麼事，無人聲援，就等著大難臨頭。


    其中尤為重要的，是讓資深女同事站在自己這一邊。這一點，凡是在職場待得夠久的人都懂——千萬別被資深女同事討厭。


    一旦成了女同事之間談論八卦、流言攻擊的對象，這些話傳到主管耳裡，聽多了可能也會覺得「最好注意那個人」而藉故找碴。


    話雖如此，若是主動接近資深女同事，旁人難免在背後議論紛紛：「哇，他跑去討好同事耶。」


