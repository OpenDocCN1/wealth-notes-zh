    ## 馴服個性倔強的年長下屬

    把稍微困難的工作交給他


    組織裡有各種成員，有些下屬比你還年長。遇到個性倔強的年長下屬，應該如何應對呢？通常都是心懷敬意，小心翼翼吧？


    其實，拜託他們做有點麻煩的工作，他們反而會更服從。


    美國曾經進行過一項實驗，要求參與者回答一些簡單的益智問題，猜對就能獲得高達五十美元的獎金。


    接著，猜謎主辦者對其中三分之一的參與者說明，由於研究資金不足，希望他們能夠歸還獎金。另外三分之一的人，由別的工作人員代替主辦者要求歸還獎金。其餘三分之一的人則讓他們把獎金帶回家。


    事後調查這些參與者對於猜謎遊戲主辦者的好感度，得到一項有趣的結果。


    你或許會認為，將獎金帶走的組別對於主辦者的好感度最高。然而，好感度最高的卻是「主辦者親自說明，請求歸還獎金」的組別。蒙受了損失，滿意度卻比較高，這個結果並不符合經濟學理論。


    事實上，這是因為他們有比較高的「自我涉入」（self-involvement）。自我涉入讓他們覺得有意義，提升自我價值感。


    換言之，身為主管的你與其獨力完成工作，不如將工作多多交給下屬，更能獲得好感。


    如果下屬比你年長，這項原則更能發揮作用。被年輕的主管拜託時，年長的下屬覺得受到倚重，便會全力配合。


    ### POINT

    好主管守則第一條：讓下屬們覺得自己「被需要」！


