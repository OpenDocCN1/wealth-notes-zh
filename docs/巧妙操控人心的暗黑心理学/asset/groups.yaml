    Chapter 3


    觀察細節，從表情、手勢解讀隱藏的訊息


    ## 手插口袋時，大拇指要露出來

    從「微手勢」看出他是什麼樣的人


    看過知名的美劇《謊言終結者》（Lie to Me）嗎？劇中的主角以保羅．艾克曼（Paul Ekman）博士為原型，他是研究微表情心理學的權威。


    這部戲劇以「0.1秒內出現的細微表情與動作」為題材，揭露這些表情與動作下的隱藏心理，非常值得「邊觀看一邊學習」。


    不過，這部戲劇其實還欠缺一個部分，就是所謂的「微手勢」（micro gesture）。


    相對於臉上瞬間呈現的「微表情」、身體瞬間出現的「微動作」，特別聚焦在手部的「微手勢」更容易觀察。舉個例子：


    - 有一對情侶面對面坐著，享用餐點。

    - 他們邊吃東西邊聊天，突然間，兩人談到了關於劈腿的話題。


    原本身體一直傾向桌面的男方，此時卻迅速地把手放在桌子底下，身體也向後挺直。


    遇到對己不利的事，為了避開話題，身體會不由自主逃開，這種動作稱為「逃避行為」（avoidance behavior）。


    手部的動作也提供了非常重要的訊息。


    雖然有時候是對方的無意識動作，不過下列重點可以稍加觀察。


    當手插進褲子口袋裡的時候：


    一、只露出拇指，是自信的表情。


    二、拇指伸進口袋，其他四指全部露出來時，就表示自認地位較低，缺乏自信。建議大家最好別做出這個動作，以免影響別人對你的評價。


    ![](img/43b499f5de61347f22210d54bfb2afd6_79_0.png)


    想要隱藏祕密，就控制你的雙手。


    ## 當他摸喉嚨，就表示有壓力

    藉由「微動作」推測對方的情緒


    在感受到壓力時會想讓自己冷靜下來，這是人類的天性。事實上不僅是人類，所有動物都一樣。


    舉例來說，當獅子、老虎被關進動物園獸籠這種狹窄的地方，勢必會累積許多壓力，於是牠們會在籠子裡不停來回走動。回想一下，你是否曾在動物園裡看過這種景象？


    藉由這種「緩和行為」（appeasement behavior），動物得以發洩壓力。人類也有「緩和行為」，以下說明最容易瞭解的幾種動作。


    首先，承受了外部的壓力、尤其是感到逼迫感時，經常會出現「摸喉嚨」的行為。


    「手貼在額頭上」則是感到羞怯，或是表示心裡有煩惱。你一定也經歷過，


    ![](img/43b499f5de61347f22210d54bfb2afd6_81_0.png)


    當遇到困難的狀況或覺得難為情時，會不自覺地將手放在額頭上。

    覺得緊張時，會無意識地做出「按摩脖子」的動作。

    這樣做具有降低心跳頻率的效果，所以經常可見。

    為了紓緩緊張感，另一種行為是「鼓起臉頰吐氣」。

    當工作告一段落、終於能喘口氣時，你是否也這麼做過呢？

    觀察對方的動作，邊談話邊推測他的心思，就能找出你想要的答案。


    ◆

    當個敏銳的觀察者，就能瞭解別人的心情。


    ## 觀察聽眾的臉，調整簡報的長度與難度

    根據「微表情」判斷對方是否感興趣


    A：「今天的簡報很棒。這個點子可以發展下去。」


    B：「這場簡報很冗長，我聽不太懂……」


    這是不同的兩個人，聽了同樣內容的簡報後的感想。明明是一場簡報，究竟為何會產生這種差異？


    A 是我說的，B 則出自某位學生。


    或許你會認為：「因為你習慣聽簡報，當然會有這樣的意見。」事實上並非如此，原因在於講者是否看清了聽眾的「微表情」（micro expression）。所謂的微表情，就是臉部在0.1秒之內閃現的真實表情。為了隱藏想法，我們在某種情況下會戴上面具。明明覺得很無趣卻擠出假笑；實際上已經怒火中燒了，卻裝得滿不在乎。可


    是，刻意做出表情得花一秒鐘，真正的表情則在最初的0.2秒便顯現出來。保羅·艾克曼博士是知名的微表情研究專家。眾所周知，他研究了數千組臉部表情，經常為許多政府機關與企業提供諮詢。那麼，為何簡報時的微表情很重要呢？因為它們可以讓你看誰對簡報最有興趣，誰則興趣缺缺。當你做簡報時，如果知道底下的人有興趣，就可以專注地對他發表；反之，如果看出聽眾興趣缺缺，不妨改以更淺顯易懂的方式來進行。其實，善於察覺伴侶有無劈腿的女生，幾乎都善於發現表情的細微變化。因為母親必須藉由觀察孩子的情緒，推測他們的需求。這是「母性遺傳基因」的影響，是女性與生俱來的能力，所以男性多半比較不擅長。如果你是男性，只要多多訓練也能收到效果。


    想知道對方在想什麼，就把握珍貴的0.2秒。


    ![](img/43b499f5de61347f22210d54bfb2afd6_83_0.png)


    ## 客戶一露出這個表情就要趕快結束談話

    看見「苦笑」就表示對方覺得勉強


    「今天他的心情似乎不錯，一鼓作氣簽下合約吧……」

    「他顯然生氣了……今天就到此結束吧……」

    「怎麼辦……？該繼續嗎……？還是先告辭……？」


    從事業務與談判工作的人，必須時時察言觀色。


    可是每個人的臉色千差萬別，就算當事人沒有生氣，如果業務的心靈比較脆弱，可能就會以為：「對方一定是生氣了……」

    因此，該如何解讀對方的臉色，就是非常重要、必須學習的技巧。


    在此要特別提醒大家，當你看到某種表情就絕對要罷手。

    對方露出什麼表情，你就應該暫時撤退呢？

    或許你以為是「憤怒」的表情，並非如此。


    ![](img/43b499f5de61347f22210d54bfb2afd6_85_0.png)


    ![](img/43b499f5de61347f22210d54bfb2afd6_85_1.png)


    想要分辨是不是苦笑，就看眼睛有沒有在笑。


    最應該留意的表情是「苦笑」。


    「苦笑」與「笑」的表情非常相似，但是有一點不同，那就是「眼睛」。人在苦笑時眼睛不會笑，這是虛偽的笑容。


    苦笑是對方感到勉強時，「不想要繼續交談」這種心情的掩飾。


    和顧客說話時一旦發現了這個表情，建議你趕快結束對話，暫時罷手。


    85 · 第三章｜看穿人心！


    ## 想安撫怒氣， 就讓對方取回控制權

    利用「得寸進尺」策略假裝退讓


    「你們的商品是怎麼回事！我不會再跟你們往來了！」


    「跟一開始說的完全不一樣啊！把錢還來！」


    任何時代、任何行業，從來沒有不抱怨的客戶。重要的是，必須理解對方為何生氣。


    我們內心都有所謂的「操控感」（sense of control）。它指的是能根據行動，打造預期中的情境。


    在心理學上，比較傾向「控制事物的是自己」這種想法的人，稱為「內在操控型」；反之，傾向「控制事物的是運氣等自身以外的因素」這種想法的人，則稱為「外在操控型」。


    內在操控型的人，平時就有強烈的操控感，即使稍微失去這種感覺，也不會


    因為想要取回而憤怒。


    外在操控型的人，由於日常生活中無法得到足夠的操控感，所以當自己僅剩的一點操控感被奪走時，就會出現憤怒的反應。


    遇到這種狀況，建議你選用適合的談判策略，一個是「以退為進」（詳見第52頁），另一個是「得寸進尺」（foot-in-the-door）。這兩項策略在銷售心理學中經常被提起，想必你也相當耳熟能詳。


    面對外在操控型的人，很適合運用「得寸進尺」──先從簡單的請求開始，再逐步提升請求的難度。


    此時要注意的是，對方急欲取回自己的操控感，所以千萬不可頻頻插話，一旦對方覺得無法取回操控感，就會更加憤怒。因此，請靜靜地聽取對方的要求。


    如此一來，對方會在無意識中感受到你的「協助」，不滿的情緒將慢慢平息下來。


    ### POINT

    對方越憤怒，你要越冷靜，達成真正的目的。


    ## 喝一口水，看看對方有沒有跟著做

    以「動作鏡射」確認客戶對你的信任度


    「明明建立了信任關係啊！到底是哪裡出了差錯呢？明明覺得和潛在客戶相處融洽，也請對方打高爾夫球了，也請對方喝酒了，也邀請對方參加派對了，以為好不容易建立了信任關係，到了緊要關頭，對方卻說：『不好意思，這筆生意我們要交給其他公司。』連週末都加班應酬，努力爭取認同卻落得如此錯愕的下場，實在太蠢了！然而再怎麼悔恨也來不及了。


    美夢成空的原因很清楚：你自以為建立了信任關係，對方卻不這麼認為。


    可是，總不能頻頻向顧客確認：「你相信我嗎？」只能獨自煩惱，不知該如何是好。


    想知道自己是否贏得了信賴，「動作鏡射」是一個簡單有效的方法。


    比方說和情人約會時，你們一邊在咖啡廳或酒吧裡聊天，你隨手拿起飲料喝了一口，情人也很有默契地同時拿起杯子。回想看看，是否有過這種經驗呢？


    在彼此高度互信的基礎上，這種狀況很常發生。


    但它不限於情人之間，只要人與人互相信任，就會常常不知不覺做出鏡射動作。理解了這一點，便能加以運用——


    藉著與潛在客戶一起出席的飯局，仔細觀察。當你拿起杯子或將食物送到嘴邊時，看看對方是否在無意識中配合你的動作，便能得知他對你的信任度。


    時間點則是三秒以內。


    如果你拿起杯子喝了一口，對方在三秒內也拿起杯子往嘴邊送，這樣重複三次以上，便可以斷定對方極可能非常信任你。


