    # 以「互惠原則」技巧引發罪惡感


    業務員最高興的事，莫過於廠商、客戶答應成交的那一瞬間。可是，並非每一次對方都會點頭答應。此時就要運用「互惠原則」（reciprocity），積極地誘導對方做出肯定的答覆。


    首先，向對方提出相當離譜的要求。


    對方當然不會同意。此時，改成略為合理的要求，基本上70 %的人也不會答應。


