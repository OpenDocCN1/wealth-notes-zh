    # — 看某人就討厭？或許是你的心錨在作案！—


    勾起我們的回憶，進一步引發諸如害怕、厭惡等情緒。


    那麼，在公司裡有不對盤的主管時，應該怎麼做呢？


    很簡單！去除心錨——試著打聽主管的個人背景，也就是家庭、個性等相關資訊。盡量多與主管接觸，不要抗拒、不要逃避。


    清除心中的偏見，才有可能改善與主管的關係，讓工作順利進行。


    由於心錨所設定的心理狀態，往往會讓我們僅憑外表或說話方式來判斷對方。當你越瞭解對方，原本穩固的心錨記憶就會漸漸淡化，直至失去作用。


    這是NLP（神經語言程式學，是以心理學與語言學為基礎的溝通技巧）經常使用的訓練方式，請務必一試。


    ## 再難搞的主管也能輕鬆攻克

    把話說進他的心坎裡


    有些人善於奉承，深受主管喜愛。然而，他們是否真能獲得全面信任？顯然未必如此。說些阿諛諂媚的話，雖能大大滿足主管的虛榮心，但是日子一久，主管便會開始懷疑：「這樣說的話不可信……」


    想要取悅主管又不失信用，有一個巧妙的方法——


    在西方文化中，受到讚美時會大方接受，自然地說一聲「謝謝」。東方人則一向以謙虛為美德，聽到奉承或恭維之詞，多數人都會回答：「沒有啦？沒這回事，我完全不行。」


    不過，即使表面上連聲否認，內心其實十分喜悅。


    只要回想一下自己的經驗，便不難理解：當你嘴上說「沒有啦」，真的打從心底覺得「沒這回事」嗎？


    同理可證，每個主管被下屬讚美都會很開心，只是他們習慣以否認來展現謙虛的態度。此時，記得使用「再否定」的說話技巧，讓他加倍高興。所謂「再否定」，就是再次否定對方的回應。


    當同事讚美主管：「部長真是太厲害了！一下子就達成兩倍的業績！」


    雖然主管會謙遜地說：「不、不，不是我厲害，這是大家通力合作的成果。」


    不過他的內心一定認為：「這是在我的指導下所獲得的成果。」此時你只要立刻補上一句：


    「唉呀，部長別這麼謙虛！不過，這也是您深受大家信任愛戴的原因呢！」


    主管心裡肯定加倍開心。


    趁著這個喜悅加倍的時間點提出企劃案，肯定會無條件通過。


    想要討主管歡心，就使用「再否定」的奉承技巧，「誇」進他的心坎裡！但千萬別過度頻繁使用，以免適得其反。


    ![](img/43b499f5de61347f22210d54bfb2afd6_31_0.png)


    浮濫的奉承，比不上精心設計的恭維。


    ## 就算做錯事也能留下好印象

    誠懇道歉後，暫時遠離主管視線


    美國俄亥俄州立大學有一項研究，針對「第一次見面時，對彼此留下良好印象」的男女，分別調查「盡量少見面」和「立刻多次約會」這兩種情況下，這些男女對於彼此「理想化」（idealization）的程度。

    結果顯示，「盡量少見面」的男女，對彼此理想化的程度比一般情況提高了 20%。另一方面，「立刻多次約會」的男女，分手的機率比一般情況高出了 30%。根據這個研究得知，讓我們留下深刻的第一印象的人，即使之後沒有接觸，對方也會逐漸在我們心中理想化。

    實際上，與其頻繁見面，不見面更能增加理想化的程度。

    當主管責備你時，不妨利用這一點

    人在職場難免會犯錯，不論是工作進度延誤或案子執行失敗，如果因此被主管...


    ![](img/43b499f5de61347f22210d54bfb2afd6_33_0.png)


    # 避免與主管接觸。


    管責罵，請務必誠心誠意道歉，讓對方留下正面印象。即使主管罵得再兇，只要你展現了真誠的歉意，一定能在他心裡留下深刻印象。之後，要盡量避不見面，避不見面的時間一久，說不定最後主管反而會主動來找你示好：「最近你很認真呢！不錯！」甚至有可能邀你吃個飯，喝杯酒。


    不過，有些場合實在無法刻意避開。遇到這種情況，適當保持距離吧，只要別讓主管誤以為你無視他就可以了。


    ![](img/43b499f5de61347f22210d54bfb2afd6_33_1.png)


    遠距離戀愛也可能因為彼此「理想化」而更穩定！


    33 · 第一章｜小人退散！


    ## 讓被動的下屬變得主動積極

    只要你認為他做得到，他就能做得好


    美國有一項耐人尋味的教育心理實驗——研究人員在某間小學進行了智力測驗，不過測驗其實是假的，甚至沒有計分。「智力測驗」結束後，他們隨機抽取一批學生，告知各班導師：「這份名單上的學生智力優異，未來成績會很好。」

    各班導師對於名單上的學生有很高的期待，比以往更熱心地指導。結果，這些備受期待的學生，成績真的進步了。

    這個現象稱為「比馬龍效應」（Pygmalion effect），又稱為「自我應驗預言」（self-fulfilling prophecy）。除了廣泛運用在教育理論中，在職業運動領域也很常見。


    職場上總是會有「凡事等待指示」的下屬，他們並非天性消極，而是缺乏自信，覺得自己不受期待，不敢擅自行動，所以寧可等到主管下指令後再行動。

    假如你手下有這種事事等待指示的員工，不妨試著「對他們說出期待」。


    但是，不著邊際的期待會適得其反，必須找到對方的優點，針對優點說出充滿期待的話。舉例來說：


    > 會讓此機會參與這次的企畫案，是因為我很清楚你的分析能力十分優秀，希望你能藉此機會能再加強企畫能力。”


    當事人聽了，會心想：「原來我的分析能力受到肯定啊……！在獲得自信的同時，也會開始思考：「只要磨練企畫能力，就能做更高階的工作！」然後積極地投入企畫案，加強自己的能力。


    如此經常運用「比馬龍效應」，原本被動的下屬，就會漸漸地表現得更好，更符合你的期待。


    # 你對下屬越有信心，他們就越有自信！


    ## 讓憤怒的同事瞬間冷靜下來

    表現得比他更生氣


    沒有什麼情況比面對暴怒的人更棘手了。但是，其實有個方法能輕易地讓對方息怒。


    美國情報機構 CIA 進行過一項研究：刻意激怒實驗對象，再透過各種方法，測試平息怒氣要花多少時間。


    實驗對象有三位。第一位由研究人員拚命以言語安撫，第二位是用鏡子讓他看見自己生氣的模樣，第三位則是研究人員表現得比實驗對象更憤怒。


    結果，以言語安撫的第一位實驗對象花了一段時間平息怒氣；看了鏡子的第二位實驗對象在幾分鐘內平靜下來；研究者假裝發怒的第三位實驗對象則是瞬間變得冷靜。


    從這個實驗可以得知：比生氣的人展現出更憤怒的情感，對方就會瞬間平靜。


    ![](img/43b499f5de61347f22210d54bfb2afd6_37_0.png)


    > POINT

    以銅為鏡，可以正衣冠；以人為鏡，可以明得失。


    醒，忘了剛才的怒氣。


    這是被稱作「自我同一性」（self-identity）或「自我認同」的心理狀態，會讓人將對方的實力與成果錯誤為自己的實力與成果。舉例來說，就像我們看完電影《洛基》之後，會有自己彷彿變強了的錯覺。


    前述實驗則是反過來利用了「自我同一性」——見到比自己更憤怒的人時，會立刻瞭解：「我在他眼中是這種感覺啊。」理性便瞬間恢復。讓第二位實驗對象在鏡中看到自己，也有相同效果。


    一旦遇到發怒的對象，只要表現得比他情緒化即可。不過，演得不好反而會火上加油，必須小心注意。


    ## 讓客戶不再隨意提出無理要求

    穿上合身、平整的黑色西裝


    「這次交易，給我5%的折扣吧！」


    「如果週末前不交貨，我方就不支付全額。」


    有時候客戶會提出諸如此類的無理要求。


    如果對方這樣向你開口，就表示他把你看扁了。


    他顯然不把你放在眼裡，認為只要對你強硬一點，你就會乖乖照辦。


    你可能會覺得：「不，沒這回事，客戶本來就是那樣。」


    可是，如果交涉對象不是你，而是黑道大哥的話，客戶還會說出同樣的話嗎？會向你提出無理的要求，就表示對方輕視你。


    那麼，該如何是好？


    有個非常簡單的方法：利用「服裝與顏色的威嚴」。


    38


    ![](img/43b499f5de61347f22210d54bfb2afd6_39_0.png)


    > 只要穿對顏色，談判就贏了一半！


    請想像一下，有兩名業務員來到你面前。其中一位穿著茶色西裝，衣服皺巴巴的，鈕扣掉了一顆，鞋子也髒兮兮。另一位身穿黑色西裝，衣服平整毫無皺痕，鞋子也光亮如新。

    你會比較信任誰呢？

    答案一目瞭然。

    身穿平整黑色西裝的人，任誰看了都會覺得他擁有實力、散發著威嚴感與自我風格。實際上，首相、社長、法官等社會地位高、精明能幹的人，幾乎都愛穿黑色。

    如果你在對方眼中是具有威嚴與風格的人，他就不會提出無理的要求。因為談判交涉要是弄巧成拙，比起失去一筆生意，失去一位權威人士的損失更大。

    你越有能力，對方就會越看重你，而不想放手。

    黑色西裝能讓你展現出幹練的形象，請務必牢記這個概念。


    39 · 第一章│小人報復！


    ## 對付喜歡嘲弄挖苦的人

    以強勢的態度大聲說話


    不論在哪個地方工作，免不了會有一、兩個愛挖苦別人的討厭鬼。若是以以前，打個一架或許就能讓對方閉嘴。如今這個時代，用暴力解決麻煩顯得很不理性，更何況在公司內這麼做可能會被開除。


    話雖如此，放任對方大放厥詞，自己肯定會累積不少壓力。那麼，該以何種方式處理、讓惱人的對象老實一點呢？


    美國史丹佛大學進行了一項實驗，將四名男性分成兩組，各組由其中一人扮演公司雇主，另一位扮演理想進公司的人，在這個設定下商議勞動條件。


    有趣的是，雇主採取溫和態度的組別，薪資條件通常會按照應聘者的希望；而雇主表情嚴厲，傲慢地靠在椅背上採取高壓態度的組別，幾乎是按照雇主開出的條件。


    承受高壓態度的應聘者，由於「想要趕快逃離這裡」的心理作用，會無條件地唯命是從。


    任何人不 想接近展現高壓態度的人。


    因此，如果受不了老是挖苦、嘲諷的人，就在他面前採取高壓的態度吧。


    若有機會交談，說話音量比對方大也十分有效。


    提高嗓門，就能獲得控制權。


    因為這會在無意識中喚醒幼年時被雙親大聲叱責時的記憶。若是對方想起被父母責罵的記憶，自然會心頭一震。


    ![](img/43b499f5de61347f22210d54bfb2afd6_41_0.png)


    遇到喜歡碎念的傢伙，就以強硬的氣勢讓他不敢開口！


    ## 「直接說不」是最體貼的回應

    徹底斷絕煩人的推銷或請託


    你是否曾經為了拒絕煩人的推銷勸誘，多說了一句無謂的話，反而導致更加難以推辭？


    「我現在沒錢。」「家裡現在還夠用，說不定日後會有需要，到時候再看。」「我考慮看看。」


    原本是希望拒絕時不會傷到對方的心，卻因為多說了這些話，反而讓對方有所期待。


    「我現在沒錢。」會變成「現在沒錢無妨，可以考慮分期付款。」


    「說不定日後會有需要……」會變成「那我找一天再來拜訪。」


    「我考慮看看。」則會變成「那我提供更詳細的資料給你！」


    雙方的互動持續下去，只要你不購買商品，就不會有結束的一天。


    ![](img/43b499f5de61347f22210d54bfb2afd6_42_0.png)


    藉口越多，麻煩越大


    美國直銷協會進行過一項有趣的問卷調查。從這份針對直銷從業人員的問卷結果可以看出，比起找藉口婉拒，「斷然拒絕」對他們的精神傷害比較小。


    乍看之下似乎很不可思議，但是仔細想想，就能明白其中道理。


    推銷與勸誘被拒絕是理所當然的，找藉口卻會讓對方有所期待。


    在失望後又懷抱希望，然後再次失望，會讓人承受重大的精神打擊。


    因此，斷然拒絕才是最不會讓對方感到不愉快的方法。


    在職場上也是同樣的道理。


    拒絕工作時別亂找藉口，應該斷然拒絕。


    只要你直接說：「不好意思，實在沒辦法。」如此對方也會思考下一步，彼此都樂得輕鬆。


    與其花心思想藉口，不如直接拒絕。


    ![](img/43b499f5de61347f22210d54bfb2afd6_43_0.png)


    > 「不好意思」會造成你的困擾，並且帶給別人傷害。


    ## 不再被主管和同事們看輕

    保持規律的運動習慣


    在一間公司裡，總有幾個人特別容易被看輕。這些人通常有共同的特徵：心靈脆弱。他們一旦因故被主管與同事疏遠，就會不知所措，無法提振精神，於是一再陷入負面循環之中。


    如果不想在職場上被看輕，就必須培養強大的心靈力量。


    首先，你必須牢記一點：想要鍛鍊心靈，最重要的是鍛鍊身體。


    所謂「健全的精神寓於健全的身體」，生理與心理的狀態會互相影響，身體越健康，心靈越強壯。


    有些人藉由冥想或打坐來強化心靈，這當然不失為一種好方法，但是保持身體健康才能雙管齊下。


    ## 圖四

    覺得諸事不順？除了求神，你有更好的選擇：運動。


    「血清素」是人類體內很重要的神經傳導物質，它的濃度高低和情緒好壞極度相關。


    若血清素不足，精神狀態將會失衡，使人呈現暴力傾向，或罹患憂鬱症。除了氣色變差，想法也會趨於消極，最終成為一個心靈脆弱的人。


    為了增加血清素含量，務必維持規律的運動習慣。


    血清素穩定地分泌時，會感覺開朗舒暢、輕鬆愉快、熱情正向，專注力也會大幅提升。


    最大的好處是讓人變得有自信。只要信心充足，工作上的表現也會改善，使你判若兩人。


    「運動真的能強化心靈嗎？」


    如果你心存疑問，不妨思考一下這個研究報告：日本運動不足的人口比例，與憂鬱症患者的人口比例高度一致。


