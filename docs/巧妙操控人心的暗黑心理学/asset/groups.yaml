    # 仿照對方的書寫風格，以電子郵件取得信任


    運用〔催眠書寫〕製造錯覺


    現代職場的溝通非常仰賴電子郵件。


    寫郵件時必須考慮用字遣詞，你可能經常呆坐在電腦前苦思：「這樣寫可以嗎？」


    如果有這樣的煩惱，請運用〔催眠書寫〕（Trance writing）技巧，以電子郵件取得對方信任。


    訣竅只有一個，就是模仿對方郵件的內容。如果對方的郵件內容較為嚴肅，你回應的內容也必須嚴肅。


    若是收到這種信件：「先前出差時承蒙關照，真是十分感謝。在此致上深深的謝意。」


    絕不能回覆：「沒有啦，我也很開心啊。有機會再見面吧～」'
  - '[PAGE 123]


    # 「鏡像」技巧非常實用，反覆練習，便能有效建立互信關係。


    適當的回答應該是：「先前您出差時，或有禮數不周之處……」也許這個技巧看似理所當然，不值一提，事實上卻有許多人做不到，總是不自覺地以自己的風格書寫。


    即使是冷冰冰的電子郵件，也能從字面上感受對方是什麼樣的人。看到與己相似的書寫風格時，對方會在無意識中產生「這個人值得信任」的錯覺。


    「如果要寫信給主管呢？用太輕鬆的話氣來寫，主管會不會生氣？」完全不必擔心。正因為他是主管，更要徹底配合，對方不僅不會生氣，還會覺得：「這小子很有前途喔！」


    最後，必須注意一個重點：別使用驚嘆號（！）。


    在信件裡使用驚嘆號，是為了引起注意。即使對方經常使用，也絕不可模仿。


    研究指出，收件者看到信裡有驚嘆號，會覺得對方的地位比自己還高。'
