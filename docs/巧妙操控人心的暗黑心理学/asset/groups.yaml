    ## 不正面回覆，讓競爭對手無法摸清你

    以「無視的肯定」偽裝自己掌控一切


    無論隸屬任何組織，必定會有與自己工作能力相當的人。


    看著能力差不多的人立下功勞、獲得晉升或是被嘉獎時，總是覺得介意。與對手一比較，自己顯得很窩囊，「我輸給他了……」心中盡是這類負面想法。


    一想到競爭對手平步青雲，內心深處終究不是滋味。


    此時，請運用「無視的肯定」。


    人們對於地位比自己低的對象，有時會隨口問些問題，其實根本不打算得到答案，只是想藉此推測對方的實力有多少。


    因此，如果有人問你：


    「方便說嗎？我聽說這次的企劃案感覺不錯，是嗎？」


    一旦你老實回答，就會被對方牽著走。


    所以，應該如此回應：

    「抱歉，現在不能回答你。」

    這種回覆帶有「雖然知道內情，卻不能告知」的暗示，即使實際上並沒有什麼必須隱瞞的內幕。既能偽裝成自己掌控一切，也能表現出自己口風很緊的一面，在對方的意識裡植入「這個人不會輕易洩漏祕密」的印象。


    人唯有透過溝通，才能深入理解對方；若無法順利溝通，就會開始擅自在心中自行解讀。


    看似思考對方的行動，其實是在想：「如果是我，會怎麼做？」如果對方是蛇，就會擅自把你當成蛇；若是獵貓，便會把你看成獵貓。


    對方搞不清楚你的實力，就會對你產生畏懼。


    ![](img/43b499f5de61347f22210d54bfb2afd6_111_0.png)


    兵不厭詐，這是戰爭！職場如戰場，虛虛實實，別被對手看透。


    ## 數量就是力量，藉此塑造強者的印象


    努力增加「數量」，盡力提升「速度」


    以色列希伯來大學（The Hebrew University of Jerusalem）一位心理學家，針對五十二名學生進行模擬面試的實驗。內容是請其他學生擔任面試官，並給予評價。


    有一封推薦信的應試者，與有兩封推薦信的應試者，得到了不同的結果：有兩封推薦信的應試者在「公正」、「誠實」、「團隊合作」等各方面，都比只有一封推薦信的人得到更高的評價。


    從這個實驗可以看出：數量就是力量。


    單獨的個體再怎麼弱小，只要聚集了一定的數量，螞蟻也能扳倒大象。


    這個法則運用在職場上，將發揮很好的效果——想讓主管覺得你很值得期待，無論做什麼事，記得都要「以數量取勝」。


    ![](img/43b499f5de61347f22210d54bfb2afd6_113_0.png)


    即使條件不如人，只要數量越多，就越占優勢。


    譬如主管要求：「一星期後有一場會議，在那之前寫好一份企畫書。」你就寫兩份以上的企畫書。


    若是主管要求你：「做好十張簡報資料。」你就做二十張。


    當然，有時可能會限定張數或數量，那麼你就改成「以速度取勝」。期限若是一星期，你就三天內提交。


    倘若要求整理成十張以內，就努力濃縮成五張。


    如此提升數量或速度，對方就會認定你是能幹的人，將更重要的工作託付給你。


    ![](img/43b499f5de61347f22210d54bfb2afd6_114_0.png)


    ## 刺激自尊心，減少被拒絕的可能性 善用「自我存在感動」讓人覺得被需要


    職場心理研究專家神岡真司先生曾說：


    > 「人們受到期待時會激發自尊心，難以拒絕別人的要求。只要再追加一句：「因為是你，我才……」，對方就會更容易接受請求。」


    由於「自我存在感動（sense of being）的作用，當我們覺得自己被別人需要，就會湧現力量。反之，如果認為「世上沒有人需要我」，可能會失去生存意義，最終甚至選擇死亡。


    若能理解這一點，就知道該如何拜託別人接下麻煩的工作了。


    > 「我對你很期待！」

    > 「我只能靠你了。」

    > 「如果是你來做，我絕對放心。」


    ![](img/43b499f5de61347f22210d54bfb2afd6_115_0.png)


    針對對方擅長的領域，則可以反向操作，對他說：「連你也沒辦法啊……！對方的自尊心一旦受到刺激，就會挺身而出。


    當然，不能忘了說些體恤對方的話。若是缺少了「百忙之中打擾了，不好意思」或「真是抱歉，下次我會補償你」等客套話，日後只要你一接近，對方就會認為「又要把工作推給我了」，想方設法躲你，因此一定要留意。


    另外，最好避免說出「這份工作能讓你成長」這種像是為對方著想的話。不僅毫無用處，甚至可能激怒人，畢竟能否成長應該由對方自行判斷。


    > 每個人都「需要別人」，但是更渴望「被別人需要」。


    ## 適時展現強勢態度，推動無能的下屬


    藉由「恐懼」建立不怒自威的形象


    雖然這句話不中聽，但是每個公司都有差勁的下屬。有些人毫無幹勁與上進心，只求每個月領得到薪水就好。上班時間不認真工作，導致進度延誤，卻堂而皇之地要求加班費。


    這種下屬真是難搞，完全拿他們沒轍，最後連他們分內的工作都得協助善後。該如何管理呢？


    美國史丹佛大學進行過一項實驗：


    將四名二十幾歲的男性分成兩組，其中一人扮演老闆，另一人則扮演應徵者，在此設定下商議工資。


    一位老闆採取溫和、穩重的態度，另一位老闆在商議時採取強勢的態度。


    結果，扮演溫和老闆的這組，最後答應了面試者要求的工資條件；而表現出


    強勢態度的這一組，面試者幾乎對老闆唯命是從。這是因為我們面對強勢態度時，會產生「想要趕快逃離這裡」的心理作用，即使條件不合理也會順從。採取強勢的態度時，說話的聲調會變低，語速也會變慢。所以，對下屬說話時，請降低聲調、放慢速度。若是眉頭緊蹙、挺起胸膛，視覺上也呈現強勢態度會更有效果。


    這就是藉由「恐懼」支配對方。放眼全世界，獨裁者皆是利用恐懼支配人民。有些人會聯想到北韓，若從高壓統治的手段來看，中國也是一例。不過，獨裁者的下場往往不得善終。因此，當你使用這項技巧，記得適可而止。


    此外，太常使用這招對方也會習慣，請在必要時刻才使用。


    高聲說話會令人感到抗拒，降低音量反而「聲」入人心。


    ## 不拍馬屁，也能得到主管的青睞


    以「自我狀態問卷」分析真實個性


    不出人頭地就無法獲得加薪，也無法帶領下屬。被主管提拔是最快的捷徑，但是為了討好主管猛拍馬屁，反而會失去信用。


    這種時候，要學會「讀重點」（focus reading），瞭解主管的真實性格，投其所好。


    想分析主管的內心，可以運用「自我狀態問卷」（ego gram）這個方法。


    這是企業也經常用來瞭解員工人心理狀態的測驗。


    內容是分析五種面向，是每個人都具備、但是有所差異的特徵。簡單來說就是：「父親的角色」嚴厲」、「母親的態度」溫柔」、「大人的態度」理性」、「自由的心」自由奔放」、「好孩子的」協調性」。


    仔細觀察平時的舉止言行，就能分析主管表面上的個性與內在的個性。例如


    ![](img/43b499f5de61347f22210d54bfb2afd6_119_0.png)


    平常在公司很嚴厲，飲酒聚會時卻愛講冷笑話的主管，就是「表面上的個性」「父親的角色」，「內在自由的心」。在公司裡很照顧人、很和善，在餐廳裡卻對店員態度傲慢的主管，就是「表面上的個性」「母親的態度」，「內在『父親的角色』」。

    對於和自己相似的人，我們往往會不由自主認為：「他很值得期待。」

    分析主管的真實性格之後，在他面前扮演出相同的個性，使他產生一種看到自己的錯覺，就會漸漸地在無意識中對你的印象越來越好，而對你青眼有加。


    想要走進主管的心，就讓他「在你身上看見自己」。


    ## 去除稱謂，改變和主管的互動關係


    在公司裡不斷地往上爬，是多數上班族的目標。


    要做到這一點，必須先受到主管肯定。接近主管、奉承阿諛，並非上策，意圖太過明顯反而可能遭到同事排擠。


    該如何是好呢？


    不熟的人要稱呼彼此時，會在姓氏後面加上「先生」、「小姐」，一般人面對主管則會稱呼職銜以示尊敬。至於關係較親近的人，通常會用暱稱或名字互稱對方。


    不同的稱呼方式，能顯示出親疏遠近。以「姓氏」相稱，讓人感覺有距離；互叫「名字」或暱稱，感覺比較親暱。


    這在心理學上稱為「高度自我涉入」。


    一開始可能會有點彆扭，但是一旦習慣了就會變得很自然。


    也許你會擔心：「可是，突然要改變對主管的稱呼，直接叫他的名字，感覺不太禮貌，我還是做不到。」


    很簡單，事先向主管誠懇說明即可：


    「我覺得用姓或用職銜來稱呼您會有距離感，我可以改用名字稱呼您嗎？」


    只要不是關係緊張的情況，被對方叫名字並不會感到厭惡。習慣了用主管的名字稱呼他，不知不覺中就會增加親密感。


    反之，對於你討厭的對象，就用姓氏稱呼他。如此一來，對方會一直覺得和你有距離感，不會跨進你的私人領域。


    此處雖以職場為例，事實上這個方法適合用來釐清所有人間關係。


    ### POINT


    不希望討厭的人太靠近你，就以「〇先生／小姐」稱呼他。


