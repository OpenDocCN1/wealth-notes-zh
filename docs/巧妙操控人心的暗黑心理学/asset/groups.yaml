    ## 要改變想法，就多多跟自己說好話


    藉由語言的力量「自我催眠」


    日本有「言語」這個詞，古時候的人相信言語文字中有靈魂寄宿，具有不可小看的神奇力量。


    現代人越來越輕視語言的力量，談到這個話題，必定會有人說：「這種超自然的事太奇怪了。」


    事實上，它屬於心理學的範疇。


    我們每天都藉由語言溝通，面對家人、朋友、同事、客戶，無一不需要交談。


    但是，別忘了：最常聽你說話的人，其實是你自己。會在無意識中聽進每一句話的，除了你別無他人。


    請注意，此處使用了「無意識」這個詞——對方是有意識地聆聽，你卻是無意識地聽見。


    無意識聽著你自己所說的話，效果和「催眠」相同。催眠治療師布萊爾先生（Forbes Robbins Blair）說過，他曾為想戒菸的患者進行催眠，自己卻在不知不覺中也戒菸了。研究後發現，原來是因為在治療過程中，他也無意識地聽進了用來催眠對方的話。這個契機使他後來創造出「自我催眠」（self-hypnosis）的方法，建立了一套可以隨時催眠自己的體系。


    想一下身邊的例子，就不難明白其中道理：父母講髒話，孩子就會講髒話；如果父母說話得體，孩子說話也不會失禮。因此，我們必須注意自己說出口的話。多說些正面積極、激勵人心、令人振奮的話。反之，髒話、帶有負面情緒的話，絕對不要掛在嘴邊。


    > 「美言一句三冬暖，惡語傷人六月寒。」心直，不必口快。


    ## 忘掉前任女（男）友，走出痛苦深淵


    ### 「改寫情緒」就能改變回憶


    活在世上，隨時都有可能發生不愉快的事，失戀、背叛、生離死別……即使再怎麼有權有勢的人，也無法完全避免。


    時間能解決一切，偏偏有些痛苦即使過得再久仍然感覺深刻。理論上，除非喪失記憶，否則是無法消除記憶的。


    當然，我們可以「改寫記憶」（rewriting memory）。


    話雖如此，改寫記憶伴隨著相當大的風險。因此，在此要傳授各位的是「改寫回憶」的心理技巧。


    想要改寫回憶，必須先區分記憶與回憶的不同。


    「記憶」是直接以影像保存實際發生過的事，不帶任何情緒，就像用來保存電影的底片。


    另一方面，「回憶」加入了情緒，無論是正面或負面，只要回想時，情緒必定伴隨著影像一起湧現。


    換句話說，想要改寫討厭的回憶，只要「改寫情緒」即可。


    腦中的影像雖然無法輕易改變，改變情緒卻很簡單。


    首先，請想著討厭的回憶——是否感受到負面情緒了呢？


    現在立刻想著開心的事，讓情緒變得正面。


    像這樣重複十次，依附於討厭回憶的負面情緒就會消失。只要情緒發生轉變，日後再想起那段回憶時，也不會再有負面的感覺，最後甚至不會再想起那段回憶。


    有些痛苦太深，重複十次也不見任何效果。但是這個方法仍然值得一試，多做幾次吧。


    ## POINT


    讓你走不出來的並非腦內的記憶，而是心裡的情緒。


    ## 不靠藥物，輕鬆戒除多年菸癮 大聲念出「宣言」戒除惡習


    這個方法對於想要戒除某種惡習的人非常重要，以下用戒菸為例來說明。近年來越來越多人尋求戒菸門診協助，也開始倚賴藥物戒菸。


    要你立刻不再抽菸，是不可能做到的。越是忍耐，尼古丁戒斷症狀會越嚴重，絕對無法抑制焦躁感。


    該怎麼做，才能不靠藥物成功戒菸呢？最有效的方法是「宣言」（affirmation）。


    宣言就是對自己宣誓。只需每天早晚宣讀誓言，除此之外，隨時想抽菸都可以，不需要忍耐。


    宣言內容由自己來寫，例如：「我是笨蛋。誤以為香菸可以讓我釋放緊張情緒的笨蛋。找各種藉口讓成癮


    ![](img/43b499f5de61347f22210d54bfb2afd6_193_0.png)


    沒有戒不掉的癮，只有戒不掉的藉口。


    性比毒品還高的香菸佔據日常生活的笨蛋。每天特地花錢把毒素吸進體內，明明很清楚這一點，卻假裝不知道的笨蛋。依賴這種東西的笨蛋真是可悲。別人心裡都在想：『他無法擺脫菸癮，真是可憐。』我自己也明白，卻還是假裝不在乎，真是笨蛋。這樣下去永遠無法成為成功人士，因為成功人士不抽菸。我實在是個笨蛋。


    每天早晚都念出這段內容，抽菸時也大聲念。過了不久，你就會覺得自己很愚蠢，自然而然不再抽菸了。


    這是催眠療法的技巧，等於是由想戒菸的人對自己進行催眠。越容易受暗示的人，成功率越高。


    ## 想要變得有自信，就假戲真作


    靠「肢體語言」提振信心


    如果可以更有自信就好了……


    經常有人垂頭喪氣地這麼說，卻不知該怎麼做。如果每個人都擁有自信，這個世界一定會變得很不一樣吧。


    擁有自信的人，是什麼樣的人呢？以運動為例，或許比較容易理解：在拳擊場上，世界冠軍與練了三個月的初學者，誰比較有自信呢？


    不用想也知道是前者，因為自信與經驗值成正比。對於某項技能越有經驗，就越有自信。


    「照你這樣說，想要變得有自信，不就得花很久的時間……？」


    其實，只要瞭解一個原則，就能充滿自信


    ## POINT


    人體語言會受到情緒影響，情緒也會受到身體的控制。


    人在沮喪或雀躍時，肢體語言有很明顯的差異。沮喪的人垂肩低頭、彎腰駝背、萎靡不振，雀躍的人手臂大幅擺動、抬頭挺胸、聲音宏亮。當你沮喪時會蹦蹦跳跳的嗎？不會吧？那麼，蹦蹦跳跳地走路是什麼心情？應該是開心吧？隨著情緒不同，肢體的表現也會改變。


    反過來說，先讓身體呈現出自己想要的情緒，就能自由控制情緒。


    同理，想擁有自信，只要讓身體表現得有自信就可以了。抬頭挺胸，肩膀放鬆，站姿端正，目光直視前方，動作優雅，聲音宏亮。


    習慣了這種姿勢，身邊的人就會認為你看起來很有自信。不知不覺中，你會真的越來越有信心。訣竅無他，就是持續下去，效果肯定令你大吃一驚。


    ## 拒看電視新聞，改善焦慮症狀


    讓自己跳脫「不安螺旋」


    > 「疫情蔓延得好快，世界要毀滅了……」

    > 「最近地震好多。不知何時會發生大地震，晚上都睡不好……」


    避開危險、追求安全是人類的本能，但是有些人卻過度反應。這個現象稱為「不安螺旋」（anxiety spiral）。


    極度焦慮，一想到最近經常發生飛機墜毀事故，便異常地抗拒搭飛機；看了隨機殺人事件的報導，就時時刻刻以懷疑的眼神看待路上每一個陌生人……


    假如你發現自己是個心情會隨新聞劇烈起伏的人，務必趁來得及之前矯正。


    因為若是對這種狀態置之不理，最終想法會變得非常消極，甚至會嚴重影響日常生活。


    應該怎麼改善呢？


    第一步就是不要看太多新聞。比起正面的消息，人們更愛打聽不幸的消息。雖然一方面覺得可憐，卻也潛藏了「幸災樂禍」的心理。這是人性的黑暗面，看到他人落入不幸之中，對於自己的現狀就能感到安心。這是天性，基本上很難改變。


    新聞台需要收視率，沒有觀眾就沒有廣告收入。為了迎合觀眾口味，只好製播大量的犯罪、事故、災難等負面新聞。


    換言之，「最近發生了好多糟糕的事」只是一種幻覺。世界各地每天都會發生各種事件，就看新聞台是否願意播報而已。拒看新聞，生活裡就不會充斥不幸的消息，不會因此惶惶不可終日。


    我實際試過，即使不看新聞，生命也不會有什麼改變。只要不發生戰爭，日子還是照舊。


    如果你時時感到不安，別再接收多餘的消息，立刻停止這種惡性循環。


    ![](img/43b499f5de61347f22210d54bfb2afd6_197_0.png)


    焦慮狀態會導致大腦過度注意某些事情，影響其他正常功能。


    ## 手指緊握、緩緩吐氣，比鎮定劑更有效


    以「安慰劑效應」消除緊張感


    向客人推銷商品或是在會議上做簡報，這類場面難免令人感到緊張。有些人甚至由於過度緊張，導致失敗。


    電視上的主播在播報即時新聞時，對著鏡頭仔細而流暢地讀稿，明明是緊張萬分的情況，卻絲毫看不出來。是不是有什麼祕訣呢？


    歸根究底，人為何會緊張？


    感到緊張，正是我們超越當下自我的時刻。


    稍微想一下就能明白，在家人好友面前說話並不緊張，在客戶廠商面前卻會緊張吧？就算說話內容相同，心情上卻一定有差別。


    沒有人天生不會緊張。


    新聞主播們內心也是緊張不已，只是沒有顯露出來而已。這正是專家與外行人的差異。


    我們不是專家，就無法消除緊張感嗎？其實有一個心理技巧很好用，執行起來也很簡單：


    覺得緊張時就深呼吸，用四根手指用力握住拇指，再平靜地吐氣，如此重復幾次就不會緊張了。


    為什麼這個動作能舒緩緊張？事實上，握緊手指吐氣的動作與緊張感完全無關，而是它能產生消除緊張的「安慰劑效應」（Placebo effect）。


    重復多次的目的，是為了讓安慰劑效應更確實，將身體變成意識的開關。據說鈴木一朗獨特的打擊姿勢，也能使他冷靜下來。


    雖然安慰劑效應是心理作用，只要相信，自然能發揮效果。


    你的信念，是穩定情緒最有效的藥方。


    ![](img/43b499f5de61347f22210d54bfb2afd6_200_0.png)


    瞭解色彩，無往不利


    ## 繫上紅色領帶，看起來更有說服力


    配合各種目的改變「顏色」


    即使你沒有讀心術，只要稍微改變外表，就能依照你想要的控制對方。毋須任何技術，就能輕鬆展開行動，方法很簡單：運用身上衣物的顏色。必須注意的是，並非以全身衣著作為目標色，而是凸顯配戴的「重點」。重點最能在無意識中給予暗示。建議男性用領帶，女性用圍巾。應該配什麼顏色呢？首先在職場上，例如做簡報時，應該配上對方容易被你說服的紅色。美國總統演說或選舉造勢等場面，幾乎都繫上紅色領帶就是最有力的證據。想要留下良好的第一印象，就配上能令人感到穩定與協調的綠色。


    ![](img/43b499f5de61347f22210d54bfb2afd6_201_0.png)


    想要說服別人，配上藍色的話容易導致失敗。因為藍色令人想到沉靜與抑制，欠缺打動對方內心的力量。


    雖然前面以職場為例，但戀愛也完全相同。


    想求婚時就用紅色。


    和對方吵架後想求和就用藍色。


    想快樂出遊時配上綠色。


    練習配合當下的情境，改變身上的色彩吧。


    選對顏色，可以讓你魅力四射！


    ## 打破思考侷限，讓想像力無限延伸


    以「整全觀點」拓展可能性


    所謂「整全觀點」（holistic perspective），意指全方位的整體觀點。具備這種觀點，能讓我們經常發現新事物。


    客觀觀點是有侷限的，整全觀點則能擴及至無限，帶領我們前往新世界。


    這是舉世聞名的發明家幾乎都具備的能力，如果你想讓自己的思考無限延伸，就必須朝這個方向訓練。


    怎麼做呢？


    假設有個對你而言很重要的人在眼前跌倒了。你立刻衝上前去，查看對方的手，掌心正滲出血來。看了之後，你感受到相同的痛楚（當然不是肉體的疼痛，而是心痛），換言之，對方與你之間的界線消失了，當你們彼此共同感受疼痛，正是以整全觀點看待事情。


    不限於人對人。比方說你很珍惜的盤子，即將從某人手中滑落、摔破的那一瞬間，儘管它是物體，你也會拋下一切，阻止盤子掉落。這時，你與盤子之間便沒有界線。


    具備這種觀點，將能掌控我們的思考。


    例如當我們訂下目標，正朝著目的地邁進，事情總是可能盡如人意，一定會碰上麻煩。如果你具備整合觀點，就能看見麻煩背後的美好成果，可以想像解決之後的圓滿。


    如此一來，你便能以穩定的心態處理一切。在旁人看來，你就是既沉穩又能幹的人。


    改變觀點，就能消除界線。


    意識到這一點，你將擁有全然不同的人生。


    ## 突破固有的思考習慣，學會變通，一切事物都有無限的可能。


    ## 後記


    如果對方看起來像蛇，表示你就是一條蛇。


    感謝您讀完本書。


    許多人光是聽到心理技巧，尤其是讀心術（解讀、操控人心的方法），就會提高警覺，有所防備。原因很簡單：不瞭解心理技巧的真面目。明明是強大的溝通方式，卻被視為「洗腦」、「思想控制」。


    對於不瞭解的事物，我們總是心懷畏懼。這是古今中外始終不變的人類心理。但是，只要明白心理技巧的原理，探究何謂操控人心時，就會發覺它並不可怕，而是串連人心、達到真正「和平」的工具。


    具備強大的溝通能力，能使對方敞開心房，願意並肩同行。


    不過，它確實是一把雙面刃，根據不同目的，能引導人往好的一面，也能欺騙人。確實有很多騙子為了利益而操弄人心，濫用這些技巧。


    我很喜歡《賭博默示錄》這部漫畫作品。其中有一幕，主角開口說一句「如果我看起來像蛇，這表示你就是條蛇」駁倒宿敵。


    本書傳授的內容，如果你往不好的方面想：「這可以用來騙他！」「可以用來勾引女人！」表示你很有可能濫用這些技巧。


    反之，若你思考正面的用途：「可以引導對方。」「這麼做或許他會很高興。」「你一定能靠這些技巧讓許多人開心。」


    結果如何，終究得看使用者的「器量」。請引導眾人，一起往好的方向前進。


