    Chapter 3


    觀察細節，從表情、手勢解讀隱藏的訊息


    ## 手插口袋時，大拇指要露出來

    從「微手勢」看出他是什麼樣的人


    看過知名的美劇《謊言終結者》（Lie to Me）嗎？劇中的主角以保羅．艾克曼（Paul Ekman）博士為原型，他是研究微表情心理學的權威。


    這部戲劇以「0.1秒內出現的細微表情與動作」為題材，揭露這些表情與動作下的隱藏心理，非常值得「邊觀看一邊學習」。


    不過，這部戲劇其實還欠缺一個部分，就是所謂的「微手勢」（micro gesture）。


    相對於臉上瞬間呈現的「微表情」、身體瞬間出現的「微動作」，特別聚焦在手部的「微手勢」更容易觀察。舉個例子：


    - 有一對情侶面對面坐著，享用餐點。

    - 他們邊吃東西邊聊天，突然間，兩人談到了關於劈腿的話題。


    原本身體一直傾向桌面的男方，此時卻迅速地把手放在桌子底下，身體也向後挺直。


    遇到對己不利的事，為了避開話題，身體會不由自主逃開，這種動作稱為「逃避行為」（avoidance behavior）。


    手部的動作也提供了非常重要的訊息。


    雖然有時候是對方的無意識動作，不過下列重點可以稍加觀察。


    當手插進褲子口袋裡的時候：


    一、只露出拇指，是自信的表情。


    二、拇指伸進口袋，其他四指全部露出來時，就表示自認地位較低，缺乏自信。建議大家最好別做出這個動作，以免影響別人對你的評價。


    ![](img/43b499f5de61347f22210d54bfb2afd6_79_0.png)


    想要隱藏祕密，就控制你的雙手。


    ## 當他摸喉嚨，就表示有壓力

    藉由「微動作」推測對方的情緒


    在感受到壓力時會想讓自己冷靜下來，這是人類的天性。事實上不僅是人類，所有動物都一樣。


    舉例來說，當獅子、老虎被關進動物園獸籠這種狹窄的地方，勢必會累積許多壓力，於是牠們會在籠子裡不停來回走動。回想一下，你是否曾在動物園裡看過這種景象？


    藉由這種「緩和行為」（appeasement behavior），動物得以發洩壓力。人類也有「緩和行為」，以下說明最容易瞭解的幾種動作。


    首先，承受了外部的壓力、尤其是感到逼迫感時，經常會出現「摸喉嚨」的行為。


    「手貼在額頭上」則是感到羞怯，或是表示心裡有煩惱。你一定也經歷過，


    ![](img/43b499f5de61347f22210d54bfb2afd6_81_0.png)


    當遇到困難的狀況或覺得難為情時，會不自覺地將手放在額頭上。

    覺得緊張時，會無意識地做出「按摩脖子」的動作。

    這樣做具有降低心跳頻率的效果，所以經常可見。

    為了紓緩緊張感，另一種行為是「鼓起臉頰吐氣」。

    當工作告一段落、終於能喘口氣時，你是否也這麼做過呢？

    觀察對方的動作，邊談話邊推測他的心思，就能找出你想要的答案。


    ◆

    當個敏銳的觀察者，就能瞭解別人的心情。


    ## 觀察聽眾的臉，調整簡報的長度與難度

    根據「微表情」判斷對方是否感興趣


    A：「今天的簡報很棒。這個點子可以發展下去。」


    B：「這場簡報很冗長，我聽不太懂……」


    這是不同的兩個人，聽了同樣內容的簡報後的感想。明明是一場簡報，究竟為何會產生這種差異？


    A 是我說的，B 則出自某位學生。


    或許你會認為：「因為你習慣聽簡報，當然會有這樣的意見。」事實上並非如此，原因在於講者是否看清了聽眾的「微表情」（micro expression）。所謂的微表情，就是臉部在0.1秒之內閃現的真實表情。為了隱藏想法，我們在某種情況下會戴上面具。明明覺得很無趣卻擠出假笑；實際上已經怒火中燒了，卻裝得滿不在乎。可


    是，刻意做出表情得花一秒鐘，真正的表情則在最初的0.2秒便顯現出來。保羅·艾克曼博士是知名的微表情研究專家。眾所周知，他研究了數千組臉部表情，經常為許多政府機關與企業提供諮詢。那麼，為何簡報時的微表情很重要呢？因為它們可以讓你看誰對簡報最有興趣，誰則興趣缺缺。當你做簡報時，如果知道底下的人有興趣，就可以專注地對他發表；反之，如果看出聽眾興趣缺缺，不妨改以更淺顯易懂的方式來進行。其實，善於察覺伴侶有無劈腿的女生，幾乎都善於發現表情的細微變化。因為母親必須藉由觀察孩子的情緒，推測他們的需求。這是「母性遺傳基因」的影響，是女性與生俱來的能力，所以男性多半比較不擅長。如果你是男性，只要多多訓練也能收到效果。


    想知道對方在想什麼，就把握珍貴的0.2秒。


    ![](img/43b499f5de61347f22210d54bfb2afd6_83_0.png)


    ## 客戶一露出這個表情就要趕快結束談話

    看見「苦笑」就表示對方覺得勉強


    「今天他的心情似乎不錯，一鼓作氣簽下合約吧……」

    「他顯然生氣了……今天就到此結束吧……」

    「怎麼辦……？該繼續嗎……？還是先告辭……？」


    從事業務與談判工作的人，必須時時察言觀色。


    可是每個人的臉色千差萬別，就算當事人沒有生氣，如果業務的心靈比較脆弱，可能就會以為：「對方一定是生氣了……」

    因此，該如何解讀對方的臉色，就是非常重要、必須學習的技巧。


    在此要特別提醒大家，當你看到某種表情就絕對要罷手。

    對方露出什麼表情，你就應該暫時撤退呢？

    或許你以為是「憤怒」的表情，並非如此。


    ![](img/43b499f5de61347f22210d54bfb2afd6_85_0.png)


    ![](img/43b499f5de61347f22210d54bfb2afd6_85_1.png)


    想要分辨是不是苦笑，就看眼睛有沒有在笑。


    最應該留意的表情是「苦笑」。


    「苦笑」與「笑」的表情非常相似，但是有一點不同，那就是「眼睛」。人在苦笑時眼睛不會笑，這是虛偽的笑容。


    苦笑是對方感到勉強時，「不想要繼續交談」這種心情的掩飾。


    和顧客說話時一旦發現了這個表情，建議你趕快結束對話，暫時罷手。


    85 · 第三章｜看穿人心！


    ## 想安撫怒氣， 就讓對方取回控制權

    利用「得寸進尺」策略假裝退讓


    「你們的商品是怎麼回事！我不會再跟你們往來了！」


    「跟一開始說的完全不一樣啊！把錢還來！」


    任何時代、任何行業，從來沒有不抱怨的客戶。重要的是，必須理解對方為何生氣。


    我們內心都有所謂的「操控感」（sense of control）。它指的是能根據行動，打造預期中的情境。


    在心理學上，比較傾向「控制事物的是自己」這種想法的人，稱為「內在操控型」；反之，傾向「控制事物的是運氣等自身以外的因素」這種想法的人，則稱為「外在操控型」。


    內在操控型的人，平時就有強烈的操控感，即使稍微失去這種感覺，也不會


    因為想要取回而憤怒。


    外在操控型的人，由於日常生活中無法得到足夠的操控感，所以當自己僅剩的一點操控感被奪走時，就會出現憤怒的反應。


    遇到這種狀況，建議你選用適合的談判策略，一個是「以退為進」（詳見第52頁），另一個是「得寸進尺」（foot-in-the-door）。這兩項策略在銷售心理學中經常被提起，想必你也相當耳熟能詳。


    面對外在操控型的人，很適合運用「得寸進尺」──先從簡單的請求開始，再逐步提升請求的難度。


    此時要注意的是，對方急欲取回自己的操控感，所以千萬不可頻頻插話，一旦對方覺得無法取回操控感，就會更加憤怒。因此，請靜靜地聽取對方的要求。


    如此一來，對方會在無意識中感受到你的「協助」，不滿的情緒將慢慢平息下來。


    ### POINT

    對方越憤怒，你要越冷靜，達成真正的目的。


    ## 喝一口水，看看對方有沒有跟著做

    以「動作鏡射」確認客戶對你的信任度


    「明明建立了信任關係啊！到底是哪裡出了差錯呢？明明覺得和潛在客戶相處融洽，也請對方打高爾夫球了，也請對方喝酒了，也邀請對方參加派對了，以為好不容易建立了信任關係，到了緊要關頭，對方卻說：『不好意思，這筆生意我們要交給其他公司。』連週末都加班應酬，努力爭取認同卻落得如此錯愕的下場，實在太蠢了！然而再怎麼悔恨也來不及了。


    美夢成空的原因很清楚：你自以為建立了信任關係，對方卻不這麼認為。


    可是，總不能頻頻向顧客確認：「你相信我嗎？」只能獨自煩惱，不知該如何是好。


    想知道自己是否贏得了信賴，「動作鏡射」是一個簡單有效的方法。


    比方說和情人約會時，你們一邊在咖啡廳或酒吧裡聊天，你隨手拿起飲料喝了一口，情人也很有默契地同時拿起杯子。回想看看，是否有過這種經驗呢？


    在彼此高度互信的基礎上，這種狀況很常發生。


    但它不限於情人之間，只要人與人互相信任，就會常常不知不覺做出鏡射動作。理解了這一點，便能加以運用——


    藉著與潛在客戶一起出席的飯局，仔細觀察。當你拿起杯子或將食物送到嘴邊時，看看對方是否在無意識中配合你的動作，便能得知他對你的信任度。


    時間點則是三秒以內。


    如果你拿起杯子喝了一口，對方在三秒內也拿起杯子往嘴邊送，這樣重複三次以上，便可以斷定對方極可能非常信任你。


    ### 頂尖業務的基本功是一觀察』，別放過每個細節！


    ## 說話時，注意對方的腳有沒有正對著你

    從雙腳「看」出對方的真心話


    客戶是否對你的商品有興趣，只要觀察「身體的動作」就能瞭解。


    這個原則，每位櫃檯接待人員應該都很熟悉吧？讓我來說明一下其中的道理。


    遠古人類靠著狩獵維生，雖然和現代社會的生活模式完全不同，但是我們仍繼承了祖先的基因。這一點，從「身體的動作」就看得出來。


    請試著回想：當你緊張時，手會不會變冷？


    這是因為此時全身的血液都流向雙腳了。


    為什麼有這種現象？


    原因在於，感到恐懼或受到威脅時，人在本能上會覺得必須趕快逃離現場，這正是基因的影響。遠古狩獵生活危機四伏，必須時時警戒，一發現狀況不對，


    ![](img/43b499f5de61347f22210d54bfb2afd6_91_0.png)


    好想離開


    ![](img/43b499f5de61347f22210d54bfb2afd6_91_1.png)


    腎上腺素激增，血流向雙腳，才能隨時拔腿就跑。利用這種天性，就能辨別客戶的真心。談生意時，請注意對方的雙腳。如果腳的方向直直地對著你，就表示生意有望談成；腳的方向若是向外，也就是並非對著你時，你再怎麼費盡唇舌，通常也會無疾而終。腳的方向朝外，顯示對方下意識想趕快逃離，也是對你的商品沒有興趣的信號。


    人類本能不可小覷，許多有用的心理技巧都是由此而來。


    ## 同時說出正反兩面的話，抓住對方的心

    用「冷讀術」讓對方覺得你瞭解他


    假算命師或占卜師不必事先調查，便可以當場說出上門委託者的過去、現在與未來，經常令人感到驚訝不已。


    這是因為他們精通「冷讀術」（Cold reading）這項技巧。


    在商場上，不論談生意或開發客戶，事前調查非常重要。但是如果時間不夠，實在無法收集對方完整的資訊。


    這時，冷讀術能發揮驚人的效果。


    「冷讀術」也不過就是說些模稜兩可，能套用在任何人身上的話罷了！


    許多人有這樣的誤解，但是這項技巧並非那麼淺薄。


    首先來看冷讀術之中比較簡單的類型：雙面手法。


    日本有句俗話：「人九成看外表。」幾乎每個人都是從外表判斷別人。


    如果眼前有個相貌可怕的男性，你絕不會對著他說：「你的臉好可怕喔……是天生的嗎？」


    所謂雙面手法，就是同時說出對外表的印象，以及相反的另一面：


    「可能經常有人說你的相貌很可怕，但你其實是非常溫柔的人。」


    先說出外觀上的印象，然後再表達相反的形象。必須注意的是，之後說出的話必須是好的那一面。


    大多數人的心理都有與外表相反的一面。若是心理的那一面被說中，對方就會覺得：「哇，這個人很瞭解我。」於是就會對你產生好感。


    這樣看來，應該就不難理解為什麼許多人會不斷地去找只有一面之緣的算命師了吧。


    「找這個人絕對沒錯」、「他說的語都是真的」，只要讓人如此深信不疑，假算命師的目的便達成了。


    ### 多加練習雙面手法，一舉掌握對方的心！


    ## 衣著華麗的人，有強烈的自我主張

    用「熱讀術」看出對方的個性


    一百位顧客，有一百種性格。


    因此，應對不同的客人，相同模式的銷售手法通常不管用。


    前一節提到的「冷讀術」是假算命師常使用的手法，不須任何準備或事先調查，就能說中對方的的事情。


    與之相反的是「熱讀術」（Hot reading）：以事先調查所得到的資訊為基礎，「假裝」說中對方的的事情。當然對方並不知道自己被調查過，所以會覺得：「他對我知道得一清二楚。」而心生信任。


    利用「熱讀術」，即使沒有詳盡分析對方的心理層面，他也會信賴你。


    在相關的技巧之中，在此介紹最簡單的一種


    當你與顧客交談時，請仔細觀察對方身上的配件，包括服裝、髮型、手錶、


    ![](img/43b499f5de61347f22210d54bfb2afd6_95_0.png)


    想要彰顯某種印象，就穿那個類型的衣服。


    首飾、鞋子、包包……


    從這些物品中可以獲得許多訊息，推測出對方的生活風格與個性。


    衣著樸素的人，通常過著簡單節儉的生活；服飾華麗的人，喜歡引人注目，通常是自我主張強烈、揮霍無度的人；服裝樸素，卻堅持拿名牌包的人，可能是很講究或漫不經心的人。


    藉由服裝與配件，能在某種程度上瞭解對方的個性，此時再配合對方的個性換一套話術，便能一舉獲得信任。


    95·第三章 │


    ## 即使初次見面也能立刻變得親密

    攀談時要站在對方身體的「右側」


    不擅長交際的人，出席派對時總是悶悶地站在角落，不與人交談，只是拿著玻璃杯，環視四周。縱使心裡明白必須和人攀談，卻找不到機會，最後派對就結束了….


    你也是如此嗎？


    派對是建立人脈的重要場合之一。可是，如果無法和別人展開對話，就不能有任何進展。


    以下介紹一個能夠輕鬆與人接近、熟絡交談的方法。


    ### 首先必須瞭解，之所以無法和對方攀談，通常是因為「擔心對方是否對我有防備心」這個心理障礙，因而陷入無法展開行動的迴圈。


    換言之，只須解除對方的防備心即可。


    ![](img/43b499f5de61347f22210d54bfb2afd6_96_0.png)


    ![](img/43b499f5de61347f22210d54bfb2afd6_97_0.png)


    人的心理與身體密不可分。我們會在無意識中保護心臟部位，如果有個警戒的對象站在左手邊，容易覺得有壓迫感。也就是說，想讓和你不熟的對象敞開心房，就從右側接近他。而且一般人的慣用手是右手，對於自己的右側比較有熟悉感。

    在派對上找到想對話的人，就從他的右側接近，試著開始交談吧，對方多半會在放鬆的狀態下回應你。

    不過，這項技巧對左撇子行不通，必須特別注意。

    該如何分辨慣用手呢？很簡單，觀察一下對方是用哪隻手吃東西就知道了。


    既來之則安之，試著跨出第一步，別總是躲在角落裡當個派對壁花。


    ## 接近人氣王，快速融入新職場

    希望人緣變好，就「模仿」受歡迎的人


    不論是轉換新工作或是人事異動調任，都必須重新適應完全陌生的環境。


    如果你是個很怕生的人，肯定會充滿壓力。不但要費心摸索新的體制、工作模式，想要說個話也不知道該找誰。


    此時，應該立刻做一件事：


    趕緊觀察這個新環境，從中找出最善於交際的人。這類人的身邊，自然會聚集很多人。


    只要主動向他打招呼：


    「你好，請多多指教！」


    他一定會很樂意協助你。而且，只要和他一起行動，很快地就會認識更多人。


    除此之外，如果你很怕生，無法和人好好溝通，那就觀察善於交際的人，研究他的說話方式和行為舉止，努力仿效。如此一來，你也會在不知不覺中變成善於交際的人。這個技巧被稱為「模仿」（modus），是渴求成功的人經常使用的方法。藉由模仿，能消除你心中的負面思考，並且自然而然地學會成功人士的思考方式。

    想和人很快地打成一片，就徹底模仿這種人，這是最快的捷徑。


    ![](img/43b499f5de61347f22210d54bfb2afd6_99_0.png)


    假裝你是某個人，直到你成為那個人，最後超越那個人！


    ## 暴露自己的弱點，掌握下屬的心

    想要瞭解對方在想什麼就「自我揭露」


    努力工作，想爬上更高的位置。然而真的晉升了管理職，卻免不了陷入人際關係的煩惱。


    夾在主管與下屬之間，讓你經常備感壓力吧？面對自己的下屬，必須善加調遣，督促他們認真工作。然而，麻煩在於無法理解下屬的心。如果自己不必主動問問，下屬就願意坦誠相對，那就太好了。


    不過，天底下沒有這麼簡單的事。


    此時，建議你使用「自我揭露」（self-disclosure）的技巧。


    如同字面所示，就是在別人面前展露自己。人類在本能上非常不喜歡暴露自己，所以只要有一方先坦誠以對，另一方便會願意交心。這項技巧利用的就是這種心理。


    想要「自我揭露」，必須特別注意地點。


    公事公辦的職場並不合適，比較好的選擇是餐廳、咖啡廳等等，並且建議你


    ### 多聊一些自己過去的失敗經驗


    美國曾經進行過一項實驗，內容是邀請五十位坐在機場大廳的乘客寫一段自我介紹。紙上事先印了例句，例如：


    > 「我從事心理學的研究。」


    或是，


    > 「其實我有兩性關係的煩惱。」


    結果，紙上印有「有兩性關係煩惱」這個句子的自我介紹，比其他例句得到的回答更私密。


    只要一方先提起私人的話題，另一方就會受到影響，以私人的話題回應。運用這項技巧探求對方的內心，你與下屬的溝通將更加深入。


