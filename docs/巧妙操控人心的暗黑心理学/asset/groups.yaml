    「好，我要從今天開始減肥，目標十公斤！」


    儘管發下豪語，也努力了一、兩天，第三天卻忍不住替嘴饞找藉口：「吃一點而已，應該沒關係吧？」「反正生理期吃巧克力不會胖。」一再破戒，最終宣告減肥失敗。


    每次都下定了決心要把某件事做好，卻老是因為意志力太薄弱，無法持續下去嗎？認為持之以往難如登天的人，不妨嘗試「思考停止法」(thought stopping)。


    世上沒有意志力薄弱的人。事實上，意志力是我們親手擊潰的。比方說決心要減重十公斤，才過了一星期，站上體重計時卻開始自我懷疑：「什麼嘛，才瘦了一公斤而已，這樣怎麼可能減十公斤啊⋯⋯」'
