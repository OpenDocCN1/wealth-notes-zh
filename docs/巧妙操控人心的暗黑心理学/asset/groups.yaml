    ## 減肥不成功，是因為急著量體重


    以「思考停止法」排除負面想法


    「好，我要從今天開始減肥，目標十公斤！」


    儘管發下豪語，也努力了一、兩天，第三天卻忍不住替嘴饞找藉口：「吃一點而已，應該沒關係吧？」「反正生理期吃巧克力不會胖。」一再破戒，最終宣告減肥失敗。


    每次都下定了決心要把某件事做好，卻老是因為意志力太薄弱，無法持續下去嗎？認為持之以恆難如登天的人，不妨嘗試「思考停止法」(thought stopping)。


    世上沒有意志力薄弱的人。事實上，意志力是我們親手擊潰的。比方說決心要減重十公斤，才過了一星期，站上體重計時卻開始自我懷疑：「什麼嘛，才瘦了一公斤而已，這樣怎麼可能減十公斤啊⋯⋯」


    ![](img/43b499f5de61347f22210d54bfb2afd6_185_0.png)


    > 人生路上最大的絆腳石，往往是你自己。


    這種負面思考非常奇妙，一旦這麼想，便會開始對於自己的減肥計畫產生懷疑的念頭。想要拋開否定的念頭時，大腦會下達指令，告訴你不用再找藉口，導致減肥計畫中斷。


    未達目標前就因現實狀況而產生了負面思考，是問題的根源。想要成功，中途最好不要出現否定的想法。


    以減肥為例，所謂「思考停止法」就是訂出一個日期，在這段時間內不要衡量體重。如果期限是三個月，那麼這九十天內就好比運動、飲食，保持平常心，別動不動就站上體重計。總之，專心一致，以平常心貫徹到底。


    很多人以為，不時量體重、觀察體重變化，是很好的動力。這就錯了！一旦衡量了體重，不僅會失去動機，反而會成為阻礙。


    換個話題：想要早起該怎麼做呢？

    ——早點上床睡覺。

    答案很簡單吧？重點在於，別去思考「無法早起」這件事，而是設法早點睡。


