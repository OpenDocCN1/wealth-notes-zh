    只要你這麼一說，對方肯定會相當在意。對方會開始思考，到底是什麼商品？如果賣得很好，我們是否也該批一些進來？用「心智控制」（Mental control）的技巧，說出帶有懸念的話，將看不見的胡蘿蔔垂在對方眼前，引發他的想像。日後一旦有需求，客戶必定會先想到你。


    訣竅是道別時不要把話說完，一定要結束在對方開始感興趣的瞬間。如果沒有掌握好道別的時機，客戶緊接著說：「等等，再多聊聊這個話題。」想要


    在對方腦中留下深刻印象的計畫就失敗了。


