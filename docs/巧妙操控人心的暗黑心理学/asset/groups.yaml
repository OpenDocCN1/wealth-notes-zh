    既然沒有什麼要否定的，那就暫且肯定吧。


    這種說話方式稱為「同意心理」，是頂尖業務員經常使用的技巧。聽者會產生一種「不想被當成笨蛋」的感覺，在你的誘導下說出肯定的答案。舉例來說，你走向化妝品專櫃，試用某個牌子的化妝水免費樣品。「這款化妝水用起來很舒爽吧？」


    如果你心裡沒有特別的想法，十之八九會回答：「嗯，是啊。 」換句話說，談判時想要堅持自己的主張，就要瞄準對於這種說話方式會給予肯定回覆的人物。


    人一旦回答得如此肯定，通常很難再說出否定的答案。


