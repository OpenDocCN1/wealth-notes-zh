    # 在客戶心中留下強烈的印象


    以「心智控制」技巧吊對方胃


    「唉呀，這不是A君嗎？今天出來跑業務嗎？真是辛苦了。」

    「承蒙您的關照。是的，我正在跑業務。B君準備去哪兒……？」

    在外遇到平日常往來的客戶時，雙方對話大致都是如此嗎？由此可見，顧客對你的印象不深。留下深刻印象，遠比你想象的還要重要


    美國德門學院（Darren College）的心理學家曾經做過一項實驗：在道別時出謎題。

    其中一百人在分開時只是簡短道別；另外一百人則在道別時出謎題，但不說出答案。一星期後分別詢問實驗對象，接受出題的組別，對於一星期之前的道別場景記憶鮮明。反之，只是簡短道別的組別，其中有好幾個人甚至不記得曾經見過面。


    那麼，當你外出時偶然遇見客戶，應該怎麼做呢？


    既然是平日往來的客戶，肯定與你的公司互相做了些生意。如此一來，一定能找出與對方利益相關的話題。


