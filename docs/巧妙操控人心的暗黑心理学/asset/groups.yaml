    ## 即使初次見面也能立刻變得親密

    攀談時要站在對方身體的「右側」


    不擅長交際的人，出席派對時總是悶悶地站在角落，不與人交談，只是拿著玻璃杯，環視四周。縱使心裡明白必須和人攀談，卻找不到機會，最後派對就結束了….


    你也是如此嗎？


    派對是建立人脈的重要場合之一。可是，如果無法和別人展開對話，就不能有任何進展。


    以下介紹一個能夠輕鬆與人接近、熟絡交談的方法。


    ### 首先必須瞭解，之所以無法和對方攀談，通常是因為「擔心對方是否對我有防備心」這個心理障礙，因而陷入無法展開行動的迴圈。


    換言之，只須解除對方的防備心即可。


    ![](img/43b499f5de61347f22210d54bfb2afd6_96_0.png)


    ![](img/43b499f5de61347f22210d54bfb2afd6_97_0.png)


    人的心理與身體密不可分。我們會在無意識中保護心臟部位，如果有個警戒的對象站在左手邊，容易覺得有壓迫感。也就是說，想讓和你不熟的對象敞開心房，就從右側接近他。而且一般人的慣用手是右手，對於自己的右側比較有熟悉感。

    在派對上找到想對話的人，就從他的右側接近，試著開始交談吧，對方多半會在放鬆的狀態下回應你。

    不過，這項技巧對左撇子行不通，必須特別注意。

    該如何分辨慣用手呢？很簡單，觀察一下對方是用哪隻手吃東西就知道了。


    既來之則安之，試著跨出第一步，別總是躲在角落裡當個派對壁花。


    ## 接近人氣王，快速融入新職場

    希望人緣變好，就「模仿」受歡迎的人


    不論是轉換新工作或是人事異動調任，都必須重新適應完全陌生的環境。


    如果你是個很怕生的人，肯定會充滿壓力。不但要費心摸索新的體制、工作模式，想要說個話也不知道該找誰。


    此時，應該立刻做一件事：


    趕緊觀察這個新環境，從中找出最善於交際的人。這類人的身邊，自然會聚集很多人。


    只要主動向他打招呼：


    「你好，請多多指教！」


    他一定會很樂意協助你。而且，只要和他一起行動，很快地就會認識更多人。


    除此之外，如果你很怕生，無法和人好好溝通，那就觀察善於交際的人，研究他的說話方式和行為舉止，努力仿效。如此一來，你也會在不知不覺中變成善於交際的人。這個技巧被稱為「模仿」（modus），是渴求成功的人經常使用的方法。藉由模仿，能消除你心中的負面思考，並且自然而然地學會成功人士的思考方式。

    想和人很快地打成一片，就徹底模仿這種人，這是最快的捷徑。


    ![](img/43b499f5de61347f22210d54bfb2afd6_99_0.png)


    假裝你是某個人，直到你成為那個人，最後超越那個人！


    ## 暴露自己的弱點，掌握下屬的心

    想要瞭解對方在想什麼就「自我揭露」


    努力工作，想爬上更高的位置。然而真的晉升了管理職，卻免不了陷入人際關係的煩惱。


    夾在主管與下屬之間，讓你經常備感壓力吧？面對自己的下屬，必須善加調遣，督促他們認真工作。然而，麻煩在於無法理解下屬的心。如果自己不必主動問問，下屬就願意坦誠相對，那就太好了。


    不過，天底下沒有這麼簡單的事。


    此時，建議你使用「自我揭露」（self-disclosure）的技巧。


    如同字面所示，就是在別人面前展露自己。人類在本能上非常不喜歡暴露自己，所以只要有一方先坦誠以對，另一方便會願意交心。這項技巧利用的就是這種心理。


