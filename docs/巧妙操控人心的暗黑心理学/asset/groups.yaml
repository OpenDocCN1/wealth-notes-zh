    ## 用自然的笑容贏得顧客的心

    以「正向心理學」技巧自我練習


    談到在顧客面前應該保持什麼表情，大多數人都會回答「笑容」。


    不過，除了在機上服務人員這類接待專家，我們再怎麼練習堆出笑容，仍舊會顯得很不自然。


    因為這不是「笑容」，而是「假笑」。


    人在露出笑容時，眼角一定會出現皺紋，若是假笑就不是這樣。即使不仔細觀察，大多數人仍能在無意識中看出對方的笑是否發自內心。


    為什麼假笑會露出馬腳呢？


    根據美國賓夕法尼亞州立大學（Pennsylvania State University）的產業心理學家，艾莉西亞·格蘭德（Alicia Grandy）所做的調查，與機上服務人員或秘書等「笑容的專家」相比，銷售人員或其他必須「努力微笑」的從業者更容易


    ![](img/43b499f5de61347f22210d54bfb2afd6_75_0.png)


    皮笑肉不笑，假裝親切友好，會導致壓力倍增、情緒沮喪。


    罹患心臟病、癌症、高血壓，風險高出兩倍以上。


    由此可見，假笑會帶來極大的壓力。想要維持這種表情，會使身體格外難以放鬆，而對方也會察覺到這一點。


    因此，接待顧客前，請先回想一些快樂的經驗，訓練自己打從心底展露真心的笑容。


    在日常生活中，多做些有趣的事、看看搞笑節目，每天都開心地笑，就能擁有自然的笑容。


