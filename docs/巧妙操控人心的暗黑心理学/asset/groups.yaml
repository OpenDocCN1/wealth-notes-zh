    # 數量就是力量，藉此塑造強者的印象


    努力增加「數量」，盡力提升「速度」


    以色列希伯來大學（The Hebrew University of Jerusalem）一位心理學家，針對五十二名學生進行模擬面試的實驗。內容是請其他學生擔任面試官，並給予評價。


    有一封推薦信的應試者，與有兩封推薦信的應試者，得到了不同的結果：有兩封推薦信的應試者在「公正」、「誠實」、「團隊合作」等各方面，都比只有一封推薦信的人得到更高的評價。


    從這個實驗可以看出：數量就是力量。


    單獨的個體再怎麼弱小，只要聚集了一定的數量，螞蟻也能扳倒大象。


    這個法則運用在職場上，將發揮很好的效果——想讓主管覺得你很值得期待，無論做什麼事，記得都要「以數量取勝」。'
  - '[PAGE 113]


    ![](img/43b499f5de61347f22210d54bfb2afd6_113_0.png)


    即使條件不如人，只要數量越多，就越占優勢。


    譬如主管要求：「一星期後有一場會議，在那之前寫好一份企畫書。」你就寫兩份以上的企畫書。


    若是主管要求你：「做好十張簡報資料。」你就做二十張。


    當然，有時可能會限定張數或數量，那麼你就改成「以速度取勝」。期限若是一星期，你就三天內提交。


    倘若要求整理成十張以內，就努力濃縮成五張。


    如此提升數量或速度，對方就會認定你是能幹的人，將更重要的工作託付給你。'
