    比起項鍊或戒指，手鐲戴起來最「有感」。


    戴著手鐲，不論打字、吃飯、洗碗……隨時都會注意到它，當它與你的形象重疊，便成了能自動想起你的開關。


    相當有效，請務必一試。


    過度貴重的禮物，會使愛情顯得像是一場交易。


