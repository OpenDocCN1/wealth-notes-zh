    ## 禮不在貴，送禮送到心坎裡


    適合對方的才是最好的


    心理學家涉谷昌三先生曾在書裡提出一個實驗：


    將遊戲籌碼交給實驗對象，結束之後可用這些籌碼兌換現金。遊戲途中，交給實驗對象追加的籌碼與一只裝了紙條的信封。


    紙條內容有以下三種：


    - 一、希望加上利息歸還（高義務條件）。

    - 二、希望歸還相同數量的籌碼（同一條件）。

    - 三、不用歸還（低義務條件）。


    結果顯示，拿到第二種紙條的實驗對象，感受到最多善意。


    拿到第三種紙條的實驗對象，等於收到一份免費禮物，然而比起覺得自己幸運，更多的是抱持警戒：「對方肯定別有用心。」


