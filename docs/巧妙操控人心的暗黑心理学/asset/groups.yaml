    擇 出 善 意 ， 創 造 回 饋


    # 讓顧客不好意思一再拒絕


    # 以「互惠原則」技巧引發罪惡感


    業務員最高興的事，莫過於廠商、客戶答應成交的那一瞬間。可是，並非每一次對方都會點頭答應。此時就要運用「互惠原則」（reciprocity），積極地誘導對方做出肯定的答覆。


    首先，向對方提出相當離譜的要求。


    對方當然不會同意。此時，改成略為合理的要求，基本上70 %的人也不會答應。


    最後，提出你真正的要求。


    由於對方已多次拒絕，如果再拒絕的話，內心會有罪惡感，因此通常會點頭答應。


    舉個例子，假設你原本想賣的東西是一千元。


    你可以先介紹一萬元的商品。因為太貴了，對方不可能掏腰包。接著再向他推薦：「那麼，這款五千元的商品如何？」對方或許會想一下，儘管覺得抱歉，還是拒絕了。此時立刻拿出原本想賣的一千元商品，拜託對方：「這是一千元的，買這個吧！」如果你是客户，會不會覺得買下它也無妨呢？所謂互惠原則，就是「請對方幫忙，一定要回饋」的原則。以這個例子來說，顧客覺得你已經讓步兩次了，無意識中會產生「讓步∥必須回報」的想法，即使並不想買，仍然會認為一千元可以接受。這個策略也稱為「以退為進」（door-in-the
    face），越能活用這個方法的業務員，業績就越好。要留意的是，必須在最初的要求被拒絕後，立即繼續提出請求。與一開始的要求時間隔得越久，效果就會變得更弱。


    > 在談判中獲勝的人，往往看似退了一步，實則前進了兩步！


    ![](img/43b499f5de61347f22210d54bfb2afd6_53_0.png)


    # 提高特定商品的成交率


    以「從眾效應」技巧主導購物決定


    還記得本書前言所介紹的心理技巧嗎？


    當你一直盯著天花板，周遭的人會被你的視線吸引，同樣也會抬頭看著天花板。


    我們在「自主意識」下做出的行為，比想像中更容易受到他人誘導。


    經過許多研究證實，人類的行動會受到環境影響，這個現象稱作「從眾行為（conforming behavior）。


    運用從眾效應，不論在職場上，或是想要向客人推銷商品時，都能掌握有利的局面。


    要做的事很簡單。


    就是一邊和顧客交談，一邊有意識地看著想讓顧客選購的商品。只要這麼


    做，對方便會注意到那件商品。


    此時必須注意一點，就是要有所比較的對象。


    以相機為例，左手若是拿著你想兜售的相機，右手就要拿著普通相機。


    對方若是右撇子，你就用左手拿著想兜售的東西。如果對方是左撇子，就把東西拿在右手上。


    人的注意力通常會落在慣用手那一側，所以視線容易看向那一邊。


    不過，當下若是沒有可供比較的選項，就無法使用這個技巧。


    ![](img/43b499f5de61347f22210d54bfb2afd6_55_0.png)


    引導視覺焦點，讓人不知不覺被你牽著鼻子走。


    # 讓對方想要和你繼續聊天


    以「語言鏡射」技巧營造信任氛圍


    所謂「鏡射」（Mirrow），就是「照鏡子」的意思。鏡中的影像，一定會和你做出相同的動作。宛如照鏡子般配合對方的行

    為

    便是鏡射這個名稱的由來。


    談到鏡射，通常有兩種情形。一種是行動，另一種是語言。


    關於語言的鏡射技巧，很多人都誤解了，舉個例子


    當對方說：

    「我妹妹要結婚了，真開心啊！」

    誤解鏡射含義的人，經常會這樣回應：

    「你妹妹要結婚啦？真令人開心呢。」

    這麼做純粹是鹦鹉學舌，對方聽了只會感到被愚弄，不僅不會敞開心胸，甚


    至不願意再信任你。


    語言鏡射的訣竅在於「盡量別重複對方的話」。


    以剛才的例子來說，正確的鏡射應該是這樣：


    「恭喜！可愛的妹妹要組新家庭了，你又多了一位親密的家人呢！」


    切忌有樣學樣，而是抓住重點來描述同一件事。


    如此一來，聽在對方耳中，就能感受到你有認真聆聽他所說的話。


    這個技巧需要多多練習，必須動腦筋謹慎挑選用詞，一旦熟練之後，就能運用得適時而自然。


    使用鏡射技巧時，還有一點必須注意：你說出來的話，要能讓對方說出「嗯，是啊」的回答。你應該發現了，想要引導出肯定的回覆，你說的話也必須積極正面。請不要加入負面的用語。


    # 想讓對方無話不談？當一面稱職的鏡子吧！


    ![](img/43b499f5de61347f22210d54bfb2afd6_57_0.png)


    # 大幅提升顧客對服務的滿意度


    以「動作鏡射」技巧深入潛意識


    有些從事服務業務的人很苦惱，不知道如何與顧客順利溝通。面對素未謀面的客人，就得立刻細膩招呼，深怕一個不留意就惹得對方不興，經常緊張得不知如何是好，有時反而讓顧客更加不愉快。


    如果你有這類煩惱，採取肢體動作的「鏡射」通常很有用。然而，如同前一節所述，動作的鏡射如果不恰當也會收到反效果。那麼，應該如何「自然地」進行呢？


    建議**等待三秒再與對方的行動同步**。


    常見的錯誤是，誤以為必須與對方在同一個時間點做動作。事實上，三秒後再採取行動同步技巧，才能讓對方在無意識中接受。一至兩秒內就做相同的動作，會進入對方的顯意識，造成不自然的感受。


    ![](img/43b499f5de61347f22210d54bfb2afd6_59_0.png)


    過了三秒後就會跳脫顯意識，對方絕不會發現你在模仿他。


    三秒鐘要如何計算呢？事實上我們從小就受了各種三秒的訓練——以前幼稚園老師說：「預備、跑！」其實這三個字正好就是三秒。「一、二、三！」也是如此。


    如果對方拿起筆，三秒後你也拿起筆，如此對方便會在潛意識中開始覺得：「這個人可以信任。」習慣之後，就能隨時在無意識中做到同步了。


    # POINT


    模仿對方的姿勢，往往能立刻獲取認同與信賴。


    # 用一通電話讓對方接受要求


    以「控制呼吸」技巧建立信賴感


    俗話說：「見面三分情。」「多數人都認為，比起打電話，直接見面比較好。


    事實上，想與對方建立信賴關係，電話是非常有效的工具。


    比起精美的詐騙DM，電話詐欺手法的被害金額較高，就是最好的證明。


    這是為什麼呢？


    簡單來說，就是因為「看不見對方」。


    當你能看見對方的臉，就會解讀對方的表情，有時難免做出錯誤的猜測。


    若是透過電話溝通，單純仰賴語言，便不會妄下判斷。而且，在電話中很容易與對方達成呼吸的一致性。


    所謂呼吸一致，就是配合對方的心情與行動，讓彼此步調一致。


    你看過管弦樂團的指揮嗎？


    指揮以大動作揮舞指揮棒，向管弦樂團團員下达指示。這麼做不僅是控制演出的節奏，其實也是在指揮團員的呼吸——指揮棒舉起，做出預備姿勢，此時樂團會一起屏住呼吸，準備演奏。當指揮棒落下時，團員會同時吐氣，各種樂音便流瀉而出。


    演奏悠閒的曲調時，指揮的動作會示意演奏者可以深呼吸；若是速度快的曲子，則以激烈的動作指揮，演奏者幾乎連喘息的時間都沒有。


    指揮是否稱職，在於他能否配合曲子的進行，讓全體團員的呼吸一致，這是演奏成功的重點。


    至於講電話，要訣是在對方講話時吐氣，在對方停頓的時候吸氣。只要雙方的呼吸節奏一樣，就能讓對方對你產生信賴感。此時提出你的要求，對方通常都會接受。


    配合說話速度調整呼吸，讓對話像一曲美妙樂章。


    # 這樣做簡報不怕被打槍


    以「具體化」技巧增加可信度


    「這款減肥產品非常有效喔！」

    「這款減肥產品在兩年前開始販售，據自家公司調查，有83％的人獲得不錯的成果。有位住在新宿的三十四歲女性，從三月開始飲用這款產品，五月二十三曰測量體重時，大約減了二十七公斤！」

    你覺得以上哪個說法比較可信？當然是第二段吧。

    即使簡報做得再出色，如果缺少具體例子，也無法打动人。反之，即使說法連篇，只要能舉出具體例子，對方就會相信。

    美國華盛頓大學做過一項心理實驗：在陳述的內容裡加入具體例子，會不會提升可靠程度。研究結果顯示，可靠性增加了33％。

    換言之，一旦欠缺具體的細節，你的簡報就難以讓人信服。


    ![](img/43b499f5de61347f22210d54bfb2afd6_62_0.png)


    提出例證，加入數據


    這是「具體化」（Speciation）的力量。

    最理解這一點，並且加以活用的就是廣告文案人員。

    提到廣告文案，一般人常會誤以為只要文章好就能勝任。但是廣告的重點並非文字優美，如何簡單明瞭地寫出具體例子才是勝負關鍵。

    將這個概念應用在職場上，對於寫書面報告或開會做簡報都很有幫助。

    即使是捏造的內容，只要改編一下，加入具體的細節，將它當成事實來陳述，就能說服大多數人。無論內容多麼誇張，若能清楚描述，對方就會信以為真：

    「哇，真的有這種事啊……」

    厲害的騙子很擅長這一招，他們能將謊言編得更深入、更詳盡。雖然濫用並非一件好事，但可見「具體化」的力量之大。


    + 「描述」何人、何時、何地、發生什麼、如何發生」，做出一份完美的簡報！


    # 讓客人覺得不買下來不安心


    以「下意識」技巧植入恐懼感


    所謂「下意識 (sublimina) 作用」，指的是讓人在不知不覺中受到影響。播放電影時，以觀眾無法察覺的手法，在畫面中定時穿插可口可樂或爆米花「的影像，觀眾就會很想吃，使得電影院販賣部的銷售額提高，這是非常有名的故事。事後證明這是誇大下意識作用的虛構行銷手法，在科學方面並未證實。不過，這個做法對於潛意識完全沒有用處嗎？或許未必。縱使科學上未經證實，仍有可能多少發揮效果。


    日本的電視廣告，全面禁止加入下意識作用。由此可知，若是真的一點效果也沒有，就不可能禁止。


    只要在交談時加入下意識作用，就能引導對方在不知不覺中往你想要的方向走。


    最有效的下意識作用是什麼呢？就是「恐懼」。許多人以為推銷商品時，只要在言談間加入「買吧」的暗示就行了，不過要這麼做，在暗示進入對方的潛意識之前，顯意識就會拒絕了。恐懼則是人類本能上最容易接收的訊息。

    「這種噴霧的味道很好聞喔。」「這種噴霧有好聞的香味，是以特殊的香料配方製成的，能讓蚊子不敢靠近你。如果沒有噴這個，被蚊子叮的機率會高69%喔！」你會因為哪句話而購買呢？通常是第二句吧，因為第二句的描述包含了恐懼的元素。英國的心理實驗也證明，在推銷話術裡加入恐懼的要素可提高購買率。要注意的是，不須加入過多恐懼的言詞，只要反覆陳述同一論點即可。如此一來，對方就會不知不覺感到恐懼而不得不買。


    # POINT


    想要抓住客人的心，就要製造一點恐懼。


    # 即使對商品沒興趣也絕對會買


    以「重複誘導性提問」技巧強化印象


    有些業務員為了成交，會變得過於急切。雖然明知不該如此，然而老是等待對方答覆，正是無法達成業績的最大主因。


    此時，可以運用「重複誘導性提問」（suggestive question）這個技巧。


    美國肯特州立大學（Kent State University）做過一項實驗：先讓實驗對象觀看某段影像，之後再給予「錯誤的訊息」——其實影像中的人物光著手，卻以錯誤的訊息如「戴著手套的人．．．」為了隱藏指紋而戴著手套．．．」給予不


    同於事實（影像）的印象。


    比起只接收一次錯誤訊息的實驗對象，重複接收三次的，有超過六倍的人被影像中的人物戴著手套」這種錯誤的訊息影響記憶。


    只要在推銷話術中活用重複誘導性提問，對方購買的機率將會非常高。譬如


    ![](img/43b499f5de61347f22210d54bfb2afd6_67_0.png)


    成功的業務不會操之過急，而是有耐心地巧妙施壓。


    如果你說：


    「這項化妝品一定會讓你變漂亮。」


    對方並不會當真。可是，要是你說：


    「妳看，稍微擦一點，肌膚狀態跟剛才就完全不同了。」


    縱使對方心裡半信半疑，仍會覺得：「是真的嗎？」


    此時你再加上一句：


    「妳看，這次擦在手上會比較清楚……對吧，看得出來完全不一樣吧！」


    對方將信以為真。最後再加把勁：


    「要不要買回去試試看，讓你變得更漂亮？」


    不斷地重複，對方就會逐漸跟著你的步調。不僅在職場，在戀愛方面也極有效果，請務必一試。


    # 迅速解決令人頭痛的青訴


    以「明白與同意」技巧平息怒氣


    不論從事哪一行，青訴都是無法避免的。


    近來不只「怪獸家長」，也出現了「怪獸青人」，真是令人頭疼。


    想讓青人停止抱怨，或許你會覺得「要用氣勢壓倒對方」。不過，採取高壓態度讓青人閉嘴，後續想要息事寧人反而更花時間，因此我不建議這麼做。


    為了避免惹惱青人，你可能會連聲道歉：「非常抱歉！」「您說的是！」然而，這麼做等於承認了己有錯，反而會讓對方洋洋得意、氣焰高漲。


    那麼應該怎麼做才好呢？


    此時，要引導對方說出「明白與同意」的話。


    要平息對方怒氣，聆聽青訴當然非常重要，此外，必須斟酌時機說出能讓對方表示「明白」與「同意」的話。


    ![](img/43b499f5de61347f22210d54bfb2afd6_69_0.png)


    「關於您所說的這個部分，我想您是這樣認為的，是嗎？」


    「關於這個部分，我是這樣理解的，是嗎？」


    如此就能引導對方說出「是啊」、「嗯，沒錯」等明白與同意的回覆。


    這些小小的明白與同意成立後，對方就會從憤怒狀態逐漸平靜下來。這也是


    美國的人質談判專家一定會使用的方法，在談判技巧裡可謂基本中的基本。


    縱使在尚未掌握事情全貌的情況下，這個方法也很有效，請一定要活用。


    客人無理取鬧？別生氣，想像你正面臨人質危機，運用談判技巧來處理！


    以「自我重要感」技巧獲得認同


    # 拓展新業務不必大費周章


    想和新客戶建立關係，一般商業書籍給予業務人員的建議通常是：「先找出這間公司裡擁有決定權的人。」


    這當然沒有錯，但也並非完全正確。


    在找出擁有決定權的人之前，應該先找出擁有一結算權一，也就是掌管財務的人。


    如各位所知，掌管公司財務的人總是隱身幕後，幾乎不會出現在檯面上。


    不過，只要能說服這位幕後的老闆，你的意見就會比較容易通過，這在研究中也已獲得證實。


    根據一項英國倫敦金融街的調查，與財務主管是否認識，對於擁有決定權的人在做決策時會造成影響。


    ![](img/43b499f5de61347f22210d54bfb2afd6_71_0.png)


    因此，歐美企業會僱用偵探，先行調查「誰是擁有財務決定權的人」，然後假裝在公司外與他偶然結識，進行接觸。


    為什麼財務主管如此重要呢？


    因為有財務決定權的人，極可能是公司創業時的元老，發言的分量等同於社長；也很可能持有公司股份，對於突如其來的提案或投資會有所警戒。


    不過，如果你們彼此認識，他就會基於「這個人我認識，沒問題」的判斷而給予支持。這種「因為是我認識的人，一定不會有問題」的心理，稱為「自我重要感」（self-importance）。


    試想，如果你收到兩份提案，一份來自認識的人，另一份是不認識的對象，你會採用何者呢？


    若是內容、條件差不多，對於那份認識的人的提案，你可能會說：「如果他就沒問題。」


    這就是「自我重要感」所造成的效果。


    掌控公司財務的人，往往是影響決策的幕後推手。


    # 再普通的商品也能賣到翻


    以「損失趨避」技巧製造急迫感


    善於推銷的人，業績總是亮眼，對公司的營業額貢獻良多。


    雖然你逛遍書店，買了许多諸如「這樣做就能改善業績」的書，但是即使努力照著做，也幾乎沒有任何效果嗎？


    其實，推銷並不難。


    只要遵循推銷的原則進行，必定會有成果。許多顶尖業務員不過是遵循原則，以平常心跑業務罷了。差別只在於能增加多少業績。


    那麼，客人會在哪種情況下願意掏錢出來呢？


    很簡單，就是認為價值大於金額，並且認定對自己有好處的時候。


    當一千元的东西只賣一百元時，即使並不是很想要，你是否會覺得：「或許以後會用得到，還是買下來吧。」


    這就是「損失趨避」（loss aversion）的心理作用。


    不論做行銷或跑業務，只要向對方灌輸「商品的價值遠高於標示的價格，現在不買就是損失」的想法，就一定會大賣。


    德魯‧埃里克‧惠特曼（Drew Eric Whitman）這位精通心理學的廣告文案專家曾說過：


    > 煽動恐懼感，商品就會賣到翻。恐懼會產生刺激及急迫感，促使人們採取行動，掏錢購買。


    事實上，針對這種效果，社會心理學家與消費者行為研究學者進行了長達五十年以上的研究，並且已經加以證實。想讓銷售成績飛躍性提升，就在談話、文案中植入恐懼元素，在感受到刺激時讓對方立即購買。人在當下會想除去恐懼感，便會立即購買你的商品。


