    美國有一項耐人尋味的教育心理實驗——研究人員在某間小學進行了智力測驗，不過測驗其實是假的，甚至沒有計分。「智力測驗」結束後，他們隨機抽取一批學生，告知各班導師：「這份名單上的學生智力優異，未來成績會很好。」

    各班導師對於名單上的學生有很高的期待，比以往更熱心地指導。結果，這些備受期待的學生，成績真的進步了。

    這個現象稱為「比馬龍效應」（Pygmalion effect），又稱為「自我應驗預言」（self-fulfilling prophecy）。除了廣泛運用在教育理論中，在職業運動領域也很常見。


    職場上總是會有「凡事等待指示」的下屬，他們並非天性消極，而是缺乏自信，覺得自己不受期待，不敢擅自行動，所以寧可等到主管下指令後再行動。

    假如你手下有這種事事等待指示的員工，不妨試著「對他們說出期待」。


    但是，不著邊際的期待會適得其反，必須找到對方的優點，針對優點說出充滿期待的話。舉例來說：


    > 會讓此機會參與這次的企畫案，是因為我很清楚你的分析能力十分優秀，希望你能藉此機會能再加強企畫能力。”


    當事人聽了，會心想：「原來我的分析能力受到肯定啊……！在獲得自信的同時，也會開始思考：「只要磨練企畫能力，就能做更高階的工作！」然後積極地投入企畫案，加強自己的能力。


    如此經常運用「比馬龍效應」，原本被動的下屬，就會漸漸地表現得更好，更符合你的期待。


