    ## 每句話都提到他，讓他再也離不開你


    以「催眠話術」提高自我意識


    日常生活中经常出现催眠狀態，也就是注意力集中的時候。

    例如專心看電影時，你對電影就呈現催眠狀態（入迷）；專心看書時，對書也呈現催眠狀態。


    舉世聞名、有「現代催眠之父」之稱的米爾頓·艾瑞克森（Milton Hyland Erickson），創造了「催眠話術」這個方法。現在 NLP（神經語言程式學）也經常活用，聽過的人相信不在少數。

