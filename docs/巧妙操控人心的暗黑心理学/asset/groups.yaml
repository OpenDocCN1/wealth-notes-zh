    难得约了对方吃饭，如果饱餐一顿就各自回家，未免太可惜了。

    美国心理学家詹尼斯 (Irving Janis) 进行过一项知名的「感觉很好」(feeling good) 实验，也称为「花生与百事可乐研究」(peanuts
    and pepsi study) ... 他将大学生分成两组，阅读四个主题的论文，分别关于「癌症治疗」、「美国军队规模」、「月球旅行」、「3D 电影」。内容相当艰涩，即使平时习惯阅读的人也会大吃不消。

    其中一组让他们在阅读时边吃花生边喝可乐，另一组阅读时则没有得到任何食物。


    ![](img/43b499f5de61347f22210d54bfb2afd6_157_0.png)


    藉食欲創造情欲，讓彼此由內而外感到滿足。


    結果顯示，一邊閱讀一邊進食這組，對於文章的解讀較有善意。因為人在吃東西時會得到快感。也就是說，和喜歡的人一起用餐，能促使戀愛的嫩芽迅速成長。接下來，才是技巧所在——


