    ## 讓扯後腿的同事知難而退

    盡量讓自己看起來很高


    不論隸屬於哪個組織，難免有幾個小心眼的人會嫉妒其他同事的實力，處心積慮扯後腿。這種情況特別容易發生在同期員工之間——看到某位同事開始崭露頭角，自己仍在原地踏步，為了掩蓋自己的無能，就會頻頻耍小動作。

    當你覺得老是被扯後腿，不妨利用「讓自己更高大」的心理技巧，讓這些礙事的傢伙知難而退。


    一般人遇到身材高大的對象，往往會心懷敬畏，無意識中認為體格壯碩與身材高大的人「能力很強」。

    這個技巧很簡單，而且非常有效。

    有一項著名的心理學實驗：將參與者分成三組，觀察同一個人，猜測他的身高。實驗開始，此觀察對象以「學生」的身分被介紹給第一組，以「醫生」的身分被介紹給第二組，以「教授」的身分被介紹給第三組。


    結果，和第一組相比，第二組與第三組對此人身高的推估，都超過了他的實際身高。


    這個實驗說明，職務對於人們有很大的影響力，某人的社會地位越高，人們就會感覺他的身高更高。反之亦然，這種潛在的心理會讓身材高大的人看起來能力也很高。


    有趣的是，高大的人與矮小的人站在一起時，多數人會認為高大的人收入較高。不僅如此，澳洲曾有研究指出「每高於平均身高五公分，年收入就多十萬日圓」。


    換言之，想讓同事覺得鬥不過你時，只要使自己看起來「高人一等」就行了。


    端正姿勢、挺直背脊、穿上增高鞋，盡可能讓身高變高，同事自覺矮你一截，便不會再扯你後腿。


