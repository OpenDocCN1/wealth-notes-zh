    ## 對付愛搶功勞的主管

    主動握手、輕輕觸碰肩膀


    如果你曾經被主管搶走功勞，原因很可能是你沒有獲得主管信任，或是被他討厭。


    把你的功勞攬過來，變成自己的績效，這個行為代表的是對你毫無尊重。如果你遇到了這種情況，請反省一下自己是不是也有問題。無論如何，這可不是什麼好事。讓我來教你一個簡單的解決方法。


    有個實驗是利用街頭訪談進行問卷調查，分成「輕輕觸碰受訪者的肩膀請對方回答」以及「完全沒有身體接觸」兩種。假調查結束後，採訪者故意將問卷掉到地上。


    比起身體未接觸的組別，被輕碰肩膀的受訪者撿起問卷的比例較高。被觸碰身體會覺得安心，並解除警戒心。肌膚之親會喚起嬰兒時期躺在母親懷抱裡的感覺。


    換句話說，身體接觸是拉近彼此距離的妙方。


    若是被同事搶走功勞，或是被冷淡地對待，你可以試著創造「肌膚之親」，例如主動握手或輕輕觸碰肩膀。


    或許你會覺得不好意思，但是光靠這個簡單的小動作，就能讓對方認為你其實是個人，有極高的機率不再對你抱持敵意。


    「這樣做真的有效嗎？」


    如果你仍心存懷疑，不妨回想一下：小時候是否曾和某個同學大打一架，事後卻變成無話不談的朋友？打架或許是終極的身體接觸呢！


