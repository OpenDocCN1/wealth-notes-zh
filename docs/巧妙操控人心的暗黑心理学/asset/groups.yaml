    ## 說話時，注意對方的腳有沒有正對著你

    從雙腳「看」出對方的真心話


    客戶是否對你的商品有興趣，只要觀察「身體的動作」就能瞭解。


    這個原則，每位櫃檯接待人員應該都很熟悉吧？讓我來說明一下其中的道理。


    遠古人類靠著狩獵維生，雖然和現代社會的生活模式完全不同，但是我們仍繼承了祖先的基因。這一點，從「身體的動作」就看得出來。


    請試著回想：當你緊張時，手會不會變冷？


    這是因為此時全身的血液都流向雙腳了。


    為什麼有這種現象？


    原因在於，感到恐懼或受到威脅時，人在本能上會覺得必須趕快逃離現場，這正是基因的影響。遠古狩獵生活危機四伏，必須時時警戒，一發現狀況不對，


    ![](img/43b499f5de61347f22210d54bfb2afd6_91_0.png)


    好想離開


    ![](img/43b499f5de61347f22210d54bfb2afd6_91_1.png)


    腎上腺素激增，血流向雙腳，才能隨時拔腿就跑。利用這種天性，就能辨別客戶的真心。談生意時，請注意對方的雙腳。如果腳的方向直直地對著你，就表示生意有望談成；腳的方向若是向外，也就是並非對著你時，你再怎麼費盡唇舌，通常也會無疾而終。腳的方向朝外，顯示對方下意識想趕快逃離，也是對你的商品沒有興趣的信號。


    人類本能不可小覷，許多有用的心理技巧都是由此而來。


    ## 同時說出正反兩面的話，抓住對方的心

    用「冷讀術」讓對方覺得你瞭解他


    假算命師或占卜師不必事先調查，便可以當場說出上門委託者的過去、現在與未來，經常令人感到驚訝不已。


    這是因為他們精通「冷讀術」（Cold reading）這項技巧。


    在商場上，不論談生意或開發客戶，事前調查非常重要。但是如果時間不夠，實在無法收集對方完整的資訊。


    這時，冷讀術能發揮驚人的效果。


    「冷讀術」也不過就是說些模稜兩可，能套用在任何人身上的話罷了！


    許多人有這樣的誤解，但是這項技巧並非那麼淺薄。


    首先來看冷讀術之中比較簡單的類型：雙面手法。


    日本有句俗話：「人九成看外表。」幾乎每個人都是從外表判斷別人。


    如果眼前有個相貌可怕的男性，你絕不會對著他說：「你的臉好可怕喔……是天生的嗎？」


    所謂雙面手法，就是同時說出對外表的印象，以及相反的另一面：


    「可能經常有人說你的相貌很可怕，但你其實是非常溫柔的人。」


    先說出外觀上的印象，然後再表達相反的形象。必須注意的是，之後說出的話必須是好的那一面。


    大多數人的心理都有與外表相反的一面。若是心理的那一面被說中，對方就會覺得：「哇，這個人很瞭解我。」於是就會對你產生好感。


    這樣看來，應該就不難理解為什麼許多人會不斷地去找只有一面之緣的算命師了吧。


    「找這個人絕對沒錯」、「他說的語都是真的」，只要讓人如此深信不疑，假算命師的目的便達成了。


    ### 多加練習雙面手法，一舉掌握對方的心！


    ## 衣著華麗的人，有強烈的自我主張

    用「熱讀術」看出對方的個性


    一百位顧客，有一百種性格。


    因此，應對不同的客人，相同模式的銷售手法通常不管用。


    前一節提到的「冷讀術」是假算命師常使用的手法，不須任何準備或事先調查，就能說中對方的的事情。


    與之相反的是「熱讀術」（Hot reading）：以事先調查所得到的資訊為基礎，「假裝」說中對方的的事情。當然對方並不知道自己被調查過，所以會覺得：「他對我知道得一清二楚。」而心生信任。


    利用「熱讀術」，即使沒有詳盡分析對方的心理層面，他也會信賴你。


    在相關的技巧之中，在此介紹最簡單的一種


    當你與顧客交談時，請仔細觀察對方身上的配件，包括服裝、髮型、手錶、


    ![](img/43b499f5de61347f22210d54bfb2afd6_95_0.png)


    想要彰顯某種印象，就穿那個類型的衣服。


    首飾、鞋子、包包……


    從這些物品中可以獲得許多訊息，推測出對方的生活風格與個性。


    衣著樸素的人，通常過著簡單節儉的生活；服飾華麗的人，喜歡引人注目，通常是自我主張強烈、揮霍無度的人；服裝樸素，卻堅持拿名牌包的人，可能是很講究或漫不經心的人。


    藉由服裝與配件，能在某種程度上瞭解對方的個性，此時再配合對方的個性換一套話術，便能一舉獲得信任。


