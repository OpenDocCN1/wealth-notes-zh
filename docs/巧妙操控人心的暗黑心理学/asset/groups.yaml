    ## 不用拜拜，貴人運也能不求自來


    藉由「深層自我說服」散發正面能量


    有些人總是一帆風順。不論遭遇什麼困難，總會有人適時伸出援手。在財務陷入困境時，會有金主給予援助；當工作遇到瓶頸時，也會有貴人為他解決。對於這些幸運兒，大多數人不禁都會脫口而出：「他真是走運！」「運氣好到令人羨慕！」


    同樣生而為人，為什麼命運卻有如此大的差距？其實，運氣好的人，只是「覺得自己運氣很好」而已。只要覺得自己運氣很好，運氣就真的會變好。聽起來很神奇吧？說穿了，這是心理作用。


    自認運氣很好，是一種「深層自我說服」（deep self-persuasion）。


    與一般常見的「正向思考」（positive thinking）不同，「深層自我說服」指的是遇到任何狀況都反覆說服自己：「沒問題。總會有辦法的。我一定能解決這個麻煩。」


    經常進行深層自我說服的人，臉部表情、說話內容會自然而然變得開朗，旁人聽了之後也會受到影響。


    身邊的人對於散發正面能量的你有好印象，基於不想改變現狀的恆溫器效應，為了維持正面的狀態，在你遇到困難時便會積極出手相助。


    相反地，如果經常說出負面消極的言論，旁人會漸漸遠離你，不想和你扯上關係，以免自己也變得負面消極。


    對於負面的人，不會有人想要主動幫忙。願意陪伴的，大概只有心理師或身邊的親屬吧。


    > 運氣不在廟裡，而是藏在你的想法裡。


