  md: '◎ 组织材料。其中一个方法就是先定下演讲题目，然后围绕题目去组织素材。比如，你的演讲题目是《安全处理压缩气缸中气体的10个小技巧》，然后你就可以根据这个题目去组织你的内容。另一方面，《安全处理压缩气缸中气体的10个小技巧》这个题目已经表明，内容大概是根据10个指导或建议展开的。“10个小技巧”让受众对演讲有了期待……他们开始好奇，想知道这10个小技巧究竟是什么。


