- pgno: 43
  md: '# 第十三部分


    # 为什么必须有演讲材料赠品


    演讲后留下的演讲材料赠品形式有多种：幻灯片拷贝件，手册，宣传册、文章复印件，或演讲内容复印件（有可能的话，上面最好附上一些图片）。


    内容可以是你的所有演讲内容，也可以是演讲大纲，图片或报告，或关于演讲话题的某篇文章，可以是和演讲话题本身相关，也可以是你在演讲中提到的，关于该话题的一个延伸拓展。如果你使用了
    PPT，你完全可以 把 PPT 打印出来，作为演讲材料赠品发给大家。


    所有的演讲材料赠品应该和你做的其他所有营销材料一样，上面应该含有你的公司名称，地址，电话，传真，如果能，还可以在 上面简单地介绍一下你是谁，你是做什么的。


    如果你的演讲材料赠品上有你演讲的所有内容，或者里面包含 了非常全面的信息要点，你就可以提前告诉听众：“你们不用笔记 记。我们已经把演讲内容复印好，等演讲结束后你们可以带一份回
    去。”这能够减轻听众记笔记的压力，从而集中精力听你演讲。


    演讲材料赠品，如演讲记录、文章、报告、或其他材料等，都 应该在演讲结束后发放，而不要在演讲开始前就发下去。如果你在 上台前把演讲材料赠品发给他们，他们就会忙于阅读这些印刷材料，
    而忽略你。你可以提前发放一些印有演讲要点的纸片等，这样参会 者可以直接在上面做笔记。


    为什么你需要发放演讲材料赠品？因为它能加强学习。但是最'
  merge: -1
  img_proc: true
- pgno: 44
  md: '主要的原因在于，发放演讲材料赠品，能够保证每位参会者（其中大多数都是潜在客户，否则你也不会给这群人做演讲）离开的时候，手里都有你的产品信息以及联系方式。


    这样，当参会者第二天去上班时，会想：“昨天的演讲真有趣；我是不是应该联系一下他们，看他们是不是能帮到我们呢。”他或她正好手头有你的联系方式。否则，你的演讲回应率可能就是零，或接近零；大多数人都很忙，很懒，或者根本不在乎，如果没有办法立刻找到你的联系方式，他们就不会联系你了。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '# 第十四部分


    # 如何确保人们拿到你的演讲材料赠品


    做一场有用，有趣，富含信息量的演讲，让潜在客户相信你，了解你讲的内容，让他们想要向你购买固然非常重要。但是，如果他们想联系你的时候，无法立即找到你的联系方式，他们的兴趣和好奇心很快就会消失。


    因为你无法提前预料听众中的哪些人想要联系你，哪些人不想联系你，所以你要确保所有参会者，或让尽可能多的参会者在离开时手拿你的演讲材料赠品。


    在演讲中，有好几种发放演讲材料赠品的方式。最常见的一种就是，把材料放在桌子上，或者房间后面，或签到处，当人们签到参加你的演讲，或会议的时候就可以领到。


    但是，这些效果都不是很好。因为大多数人都会直接离开，而不会拿走你的演讲材料。很多人甚至都注意不到那些材料。即使你告诉人们，他们可以拿走桌上的印刷材料，很多人也不会拿。在你说完人们可以自取那些材料，却没有人取的时候，那种安静会让你感到尴尬；这会让你看起来更像个做广告的人，而非权威人士。


    还有一个方法就是在演讲开始前沿约半小时，在每个桌子旁边的椅子上都放一份你的演讲材料赠品。大多数人都会拿起来阅读的；大概会有 25%-50%的人会在离开的时候拿走它，大概会有一半或一半多的人会把它留在椅子上。缺点？人们可能会阅读你的演讲材料，而不注意你的演讲。还有一些人很反感这种做法，觉得这样做是强行发给自己宣传材料，太过商业化。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 第十五部分


    # 使用“绿表”法让你的赠品发放最大化


    发放演讲材料赠品最有效的方式就是“绿表”法。它能把拿走你的材料的与会人数最大化，增加他们拿走材料的欲望，更重要的是，消除了做广告或销售的嫌疑。


    具体做法是：准备一张宣传材料，上面就你演讲中的一个要点进行详细介绍，尽可能比你在简短的演讲中更详细地介绍这个要点。或者，发放一些补充材料，对你演讲中提到，但没有详细深入探讨的要点进行补充。


    另一个方法就是制作一张资源列表：比如，有关你的演讲主题的参考书目，数据列表，关键术语表，或一系列的方程或计算方法，等等。这个列表中重要一点就是，内容要和你的演讲主题有关，但不能只是重复你的演讲内容；而要对其进行扩展。


    当你在演讲中讲到宣传材料中的某个要点时，你可以在讲到一半或四分之三时，说（当然具体怎么说，要根据你的演讲话题还有宣传材料上选中的那个要点而定）：“在这么短的演讲时间内，我真的无法谈到有关这个要点的所有具体操作方法，所以我准备了一个列表，里面有关于这个要点的25个操作点，我把它印在了这张绿表上。”然后暂停，把绿表举起来，让大家都看到。然后继续：“我这里印了很多，所以只要你想要，你上来我会给你一份。”


    在演讲结束后，你将会被一群人围住，索要那张免费绿表。试试吧，它一定很有效的。为什么要选择“绿表”，而不是白纸呢？因为在绿表上印刷，并称之为“绿表”，让人感觉很特别；而且，与其要记住那张列表中的内容，（人都很懒的，所以他们一定不想动脑筋去记），所以他们只要上台举手说：“可以给我张绿表吗？”'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# 第十六部分


    # 利用演讲赠品获取潜在客户的联系方式


    假设会议主办方无法提供给你出席会议或参加你演讲的人员的名单，但是你想获取尽可能多的人员名单，去进行营销跟进。在这种情况下，你就可以把你的演讲材料当作诱饵，而不是在会场上直接发放。


    在演讲即将结束时，你可以介绍一下你的演讲材料，然后说：“如果你喜欢我们的通信安全检查免费列表，你只要在你的名片后面写上“TSC”，然后把它给我，等我回到办公室后，我就会把免费列表寄给你。”你的诱饵越迷人，越重要，你收集的名片就越多。真正强大的诱饵可以让你获取
    25% - 75% 的参会者的联系方式，甚至更多。'
  merge: -1
  img_proc: true
- pgno: 48
  md: '# 第十七部分


    # 没有人邀请你演讲？那自己办个讲座吧


    研讨会曾经一直被认为是培训，教育或影响受众的方法。如今，已经成了企业以及营销人一个有效的营销工具。在高科技领域，主机软件供应商举办了半天时间的产品展示，以及教育信息，对IT（信息技术）人员，以及系统分析师进行教育式营销，向他们展示软件是如何和企业数据中心完美结合的。


    在普通消费领域，婴儿玩具和生活用品生产商，最近邀请我和我的妻子（她已经是一位准妈妈）参加他们举办的如何照顾孩子的免费研讨会。在研讨会上，我们还得到了一个免费婴儿玩具，价值35美元。


    “研讨会是有效的营销推广手段，”赫尔曼·霍尔兹在他的著作《用研讨会推广你的顾问服务》（约翰成立国际出版公司出版）中写道，“伊芙琳·伍德（美国著名教育家，企业家）多年来，每周都会举办快速阅读研究免费研讨会，在研讨会上她不仅授课，而且还会融入销售推广信息。阿尔伯特·洛瑞，曾经是个屠夫，后来成了房地产大亨。他举办了很多次免费研讨会，来推广他的售价500美元的‘如何通过房地产赚钱’周末研讨会。”


    研讨会为什么这么有效？因为，它完美地迎合了商家和顾客在过去二十年中关系的转变。


    二十年前，顾客对传统广告的接受程度比较高。


    销售员被视为小贩，他的工作就是给顾客推销商品，不管顾客是否需要它。“硬行推销”是他们的主要销售手段。对销售员，我'
  merge: -1
  img_proc: true
- pgno: 49
  md: '们往往会持有一种敌对态度，但是会相信电视广告以及杂志广告上的信息。


    今天的顾客受教育程度比以前高了，比以前更精明了，他们更加多疑，怀疑一切形式的广告。顾客知道他们想要什么，敢于质疑权威。这就是为什么许多公司把更多的精力放在了营销公关上。正如我们之前提到的，当你的信息被媒体以教育信息发布时，受众对它就不会像对待付费广告一样那么多疑，谨慎。


    随着消费者权益保护运动的发展，顾客从被动购买变成了主动消费。要想主动消费，他们就需要信息：产品信息，发展趋势，该产品能够解决的问题以及应用等。这正是研讨会的作用所在。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 第十八部分


    # 用研讨会进行营销公关的优势


    通过举办研讨会来推广，营销你的产品或公司，有以下几大优势：


    +   - 研讨会本身的性质就是教育，它迎合了顾客获取信息的需求及欲望。


    +   - 举办或赞助研讨会，让你以及你的公司成为行业领域的权威信息来源。通过研讨会你可以既“融入广告”，又不会被别人看成做广告的销售员。


    +   - 研讨会可以为你汇集一群高质量的潜在客户，让你“锁定”这些目标顾客，在研讨会举办前后，以及中场休息时针对他们进行销售或推广。


    +   - 在研讨会上，你可以演示自己的产品，演示是行之有效的高效销售手段。


    +   - 研讨会让你有机会接触到那些没有收看你的广告、屏蔽你的邮件、没有参加你的商展的潜在客户。


    +   - 研讨会办得好，能给听众提供有用的信息。你给潜在客户提供了服务，他们感激你，转而对你以后不管是电话，邮件，还是人员的跟进销售都会报会以更慷慨的回应。


    +   - 研讨能吸引潜在客户的注意力，受众一般集中注意力倾听研讨会的时间，都比听单纯的广告宣传时间要长。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '+   现场研讨会并不像一般的营销公关手段，和传统广告，手册，邮件等，研讨会能让你从人群中脱颖而出，给受众留下更深的印象。


    +   因为研讨会是当地举行的一些活动，容易受到当地媒体的关注，以及报道。


    +   因为大多数研讨会都会选择一些有趣的话题，或者至少某些群体感兴趣的题，所以很多报纸、杂志编辑等都会在自己的文章中提及话题相关的一些研讨会。'
  merge: -1
