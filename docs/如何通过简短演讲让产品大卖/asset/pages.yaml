  md: '# 第二十三部分


    # 通过教育宣传你的企业


    我们生活在一个成人教育的时代，随着它的出现，老师们也开始给学生提供一些各个领域成功人士从“实践”中总结出来的“相关”课程。


    随着成人教育的流行，我们常常可以发现一些微型大学（非正式成人教育中心），提供有关面试、压力管理、网络、约会、公开演讲以及广告试镜等方面的课程。一般来说，这些课程的老师报酬都很低，但他们这样做的目的是什么呢？你猜对了，宣传。


    对很多老师来说，这些课程给他们提供了源源不断的高质量潜在客户。能在这么一群想要获取信息，接受教育的潜在客户面前演讲，告诉他们自己是做什么的，销售什么产品，确实是企业主们的理想选择。


    成人教育课堂上，还可以散发大量目录册，传单，手册等，这就给人们提供了以较低的成本进行宣传推广的方式。它能够提高你在那个团体中的认可度，引导人们向你购买。对于很多创业者来说，成人教育是他们所有宣传推广活动中成本最低，效果最好的一个方式。'
