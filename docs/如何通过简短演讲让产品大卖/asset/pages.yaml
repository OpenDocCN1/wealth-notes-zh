- pgno: 52
  md: '# 第十九部分


    # 短时“迷你”研讨会


    免费“迷你研讨会”或“辅导课程”指的是那些在早上，下午或晚上召开的研讨会，为听众提供某个特定话题的一些建议，意见，或技巧。这些话题一定是研讨会主办方的潜在客户感兴趣的，研讨会内容也一定和主办方提供的服务相关。研讨会时长一般是1-2小时。


    例如，某当地的财务规划公司要提供一个有关退休以及遗产规划的免费研讨会。这样的研讨会吸引的一般人群一般都在30岁，以及30岁以上，想要给自己规划一个舒适的退休生活，想在自己过世后给子孙留下一笔房产。讨论的话题一般都是，退休投资、人寿保险、养老金计划和遗嘱等。


    为什么这样的研讨会一般都免费，而不收费呢？因为主办方的目的不是要通过研讨会本身，而是为了吸引尽可能多的潜在客户。一般来看，参加基本的退休计划以及遗产规划的人，都是对该话题感兴趣的人，想做类似的计划，但可能因为自己不是很专业，所以需要别人的帮助；这种帮助正是财务规划公司，研讨会主办方，可以提供的。


    这样的研讨会，重点一般都在于给听众提供有用、可观的信息，或者至少在听众看来，觉得自己有帮助，并且可观的信息。事实上，研讨会内容可能会做的很“巧妙”，在不知不觉间引导听众更青睐于某种服务，即恰好是主办方提供的服务。


    免费迷你研讨会最常用于服务公司，但它对其他类型的企业也同样有效。例如，2006年的时候，喝蔬菜和果汁成了一种新的健'
  merge: -1
  img_proc: true
- pgno: 53
  md: '康时尚。大百货商店或小保健食品店就可以举办免费研讨会，探讨有益健康的果汁，果汁饮料，果汁配方。,如何使果汁榨汁机等等。你认为觉得商店可以通过举办这样免费研讨会，能够向参会者销售出去很多榨汁机吗？当然可以。


    想要吸引更多受众参加你的研讨会，同时让研讨会的影响范围更广？你可以邀请当地名人作为演讲嘉宾之一。比如，在我们地区，就有一些财务规划公司，邀请了当地脱口秀著名主持人演讲理财问题，结果吸引了很多人前来，偌大的礼堂座无空席，走廊上也都占满了人。


    广播节目主持人、电视明星、作家、运动员和其他名人出席免费研讨会都能吸引很多人，可以让你的研讨会参加人数增加2倍，3倍，甚至更多。如果你邀请的名人是广播节目主持人，或电视明星，如果他们在自己的节目中提及即将参加你的研讨会，你还可以因此获得免费宣传。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# 第二十部分


    # 产品研讨会


    产品研讨会或产品推广会，是指为了销售产品或服务而举办的研讨会。它不是直接在研讨会上售卖自己的产品或服务，而是推动顾客做购买决定。它通过为顾客提供知识，促使顾客感觉自己需要做
    个明智的购买决定。


    和辅导型研讨会不同，辅导型研讨会更注重“单纯地”提供信息，只会在研讨会开始，结束以及中间休息的时候，提及服务“广告”，产品研讨会通常会把建议（比如，如何保持健康，苗条）和具体的产品展示结合起来（比如，如何用
    X 品牌的划船机达到健美目的）。


    产品研讨会的时长一般是 2-3 个小时。上午的研讨会一般都会给潜在客户提 供早餐；下午的研讨会一般会提供午餐。晚上研讨会结束后一般会有酒会或小点心提供。


    研讨会在推广产品以及服务方面的作用大致有三点：为演讲者树立权威性；展 示产品；促进产品销售。'
