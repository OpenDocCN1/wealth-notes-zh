  md: '# 第十二部分


    # PPT 以及其他一些视听辅助元素


    我曾在西屋电气公司营销实习，当时幻灯片备受各个公司欢迎。几乎所有的演示都是通过视听设备完成的。没有幻灯片，负责人都不会进行非正式会议。


    今天，幻灯片依旧非常受欢迎，但是在我看来，很多演讲或展示都用不着幻灯片。大多数公司展示都过于依赖幻灯片，让演讲变得很无聊。


    很多一场简短演讲收费就高达几千美元的专业演讲者都不使用视听辅助元素。我觉得商人，特别是在企业，都过于依赖视听元素，而失去了自主性，没有了“谈话”轻松，只是呆板地“做演示。”


    这些企业使用视听元素的问题在于，他们觉得视听元素要贯穿在整个演讲过程中。因此，尽管他们的演讲中只有 10%的部分需要视听元素，但是，他们的视听设备却全程一直开着，演讲者在有的幻灯片上只写了一个字。真是浪费，愚蠢。


    比如，有的演讲者要用 3-4 分钟的时间讲质量，她就在幻灯片上打了“质量”两个字，黑字白底。这样的视觉元素给她演讲带不来任何帮助，相反让人觉得可笑。


    使用视听元素的更好方式就是，在需要的时候使用它，不需要的时候，关掉，然后完成剩下的演讲。我演讲时，我会使用活动挂图板，以及记号笔，我不提前准备。相反，我会在演讲的过程中，边讲边写，这能够活跃演讲氛围。而且还能制造悬念：受众会感到好奇，这个人会写些什么呢？'
