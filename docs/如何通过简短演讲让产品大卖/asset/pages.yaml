  md: '幻灯片投影机、液晶投影仪、甚至笔记本电脑，都可能会出现故障。演讲中出现的一些错误，比如，幻灯片切换不了，或幻灯片上下颠倒，顺序混乱，或电脑上的图片太淡，无法显示在幻灯片上，等，都会让演讲者感到困惑，尴尬；这也会引起观众窃笑或失去兴趣。


    我曾经见过一个演讲者，就因为幻灯片顺序混乱，无法找回自己的思路，整个演讲过程都非常混乱。视听设备出现错误以及小意外都会让人感到窘迫，尤其是演讲者特别希望给别人留下一个好的印象，或演讲者不是特别擅长公众演讲时。


    有时，可能需要用高质量的视觉元素来展示产品的使用方法，解释某个流程，显示某个系统的组成元件或组成部分，或以图形的方式描述某产品的性能。比如，为了宣传自己的景观水平，你要做一场名为“如何设计一个美丽的庭院”的演讲，你就需要展示你之前设计的一些庭院图片。如果你的演讲题目为“用超级计算机生成图像的高级科学”，你就需要给人们展示一些彩色的幻灯片图像。


    在这样的情况下，我建议你使用 PPT，录像，活动挂图板之类的视觉元素做为辅助，但是使用时间不要过长，用几分钟，然后放在一边就可以了。如果你使用投影仪，那么，在幻灯片播放完后，请关掉投影仪，打开灯。


    根据 3M 公司的一项研究显示，我们对自己听到的东西，只能保留 10%，但是通过视觉辅助，保留度就会上升到 50%。短阵的计算机图形学的一个报道指出，我们大脑保留的信息中，有
    85% 都是视觉信息。


    事实上，我并不相信他们的说法。我能回忆起很多让人难忘的演讲；演讲者，演讲内容，以及很多重要的信息点，但是我却记不起来这些演讲中的任何一张幻灯片。'
  merge: -1
  img_proc: true
- pgno: 42
  md: 如果你要使用幻灯片，一定要采用粗体，颜色要亮，要深，要容易阅读，内容编排不要过于紧凑。幻灯片是用来展示，演示，活跃气氛的。但是却不是传递复杂信息的好媒介。因为如果一张幻灯片中的内容过多，就会显得不清晰。要测试观众是否能看清你的幻灯片，可以把未经投放的幻灯片放在离自己一臂距离的地方。如果你看不清，那说明观众也看不清。
