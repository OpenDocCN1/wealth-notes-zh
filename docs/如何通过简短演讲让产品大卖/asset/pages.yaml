  md: "# 第六部分\n\n# 准备演讲\n\n当然，你演讲的目的是销售你的产品或服务。但是一定要小心。人们参加午宴或晚宴演讲会讲，不是为了听你做广告。他们想要的是娱乐，信息，学习。想要开心一笑。销售产品或服务，或宣传公司，可能是你的目的，但是在公众演讲上，最重要的是做一场优秀的演讲，然后，你的“软性销售”才能发挥最好的效果。\n\
    \n特里 C.史密斯，《成功演讲》（约翰威立国际出版公司出版）的作者，列举了企业做演讲的一些可能的目的：\n\n+   提供信息或指导  \n说服或销售 \
    \ \n提议并获取认可  \n激发兴趣  \n激励或暗示受众  \n评估、说明、澄清  \n为下一步活动做铺垫  \n汇集想法并进行探讨  \n娱乐\n\n\
    我要在这个列表中再加一条，那就是“建立信任”；一次成功的演讲，能够为演讲者以及他或她的公司塑造权威形象。\n\n21"
  merge: -1
  img_proc: true
- pgno: 22
  md: '“可能你想同时达到以上多个目的，”史密斯说，“比如，提供信息和娱乐并不冲突；二者并不排斥。事实上，这两者可以相互补充。”


    比如，你的演讲主要是提供信息。你可以根据以下步骤进行组织：首先，开场介绍，说明演讲主题；其次，演讲正文，详细说明事实；最后，总结，对整个演讲内容进行总结。


    最后的总结重复非常有必要，因为在演讲中，和读文章不一样，听众无法翻回去重新阅读某页或某段来加强理解和记忆。因此，在一次演讲中，你要对自己的主要观点重复至少三次，确保你的观点被人理解和记忆。


    如果你的演讲目主要是说服或销售，那么该如何组织你的语言呢？哈罗德以及马约莉合著的《适合任何场合的演讲》（双日出版社出版）列出了以下有说服力的演讲大纲：


    +   1. 把受众的注意力吸引到演讲主题上


    +   2. 暗示受众面临的问题，需求或状况


    +   3. 分析问题的来源，历史，原因，以及表现。


    +   4. 暗示可能解决的方法，或简单提一下。


    +   5. 把受众引导到最佳解决方法或途径


    +   6. 提供证据以及解决方案的价值


    +   7. 证明这个解决方法比其他解决方法好。证明它够从问题根源着手，解决受众的问题，说明它的效果及价值。


    +   8. 引导受众做出你想要的反应


    +   9. 说明受众该如何采取行动'
