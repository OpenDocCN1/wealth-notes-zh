    作为一个有20多年演讲经验的人，我还总结出了其他一些演讲秘诀：


    ◎ **清楚你在说什么**。在罗伯特·b·帕克最新的斯宾塞小说《冷服务》中，斯宾塞和苏珊这样评价他的老朋友：“他几乎总是对的。不是因为他什么都知道。而是因为他从不谈论他不知道的事。”


    这对公众演讲者，博客写手，作家，以及其他任何人，都是一个非常好的提示：在和别人交流时，坚持一个原则：只说你知道的，你的谈话就会更有效，更有说服力，别人就会更信任你。


    我说你“知道”的事情，并不是说你研究或读到过的一些事，而是指你从真实的经历中得到的。作为演讲者，想要赢得别人的完全信任，就不要谈论你自己没有真正实践过的话题。如果你还没有实践过，万一有哪个受众向你提出挑战，你很容易被问的哑口无言，因为你根本不知道你在说什么。


    ◎ **缩小话题范围**。演讲者容易犯的最大错误之一就是：试图在太短的时间内，涵盖过多的信息。结果就是，因为内容过多，过于仓促，没有时间就其中任何一个要点进行有意义的深入探讨。此外，还有可能因为“信息密度”太高，让听众觉得无聊，他们接受了太多信息，根本来不及吸收消化。


    解决方法就是缩小话题范围。比如，“安全”这个话题，在1个小时的演讲中，就显得太过宽泛。你可以把它缩小到“安全处理压缩气缸中气体的10个小技巧”。这样，你就能在1小时内比较充分地探讨这个话题了。


