- pgno: 23
  md: '# 10.适当地总结、呼吁行动


    珍妮特·斯通以及简·博纳在他们的书中《大声演讲吧》（麦格劳-希尔出版社出版），也针对有说服力的演讲给出了一个类似的大纲：


    +   1. 抓住受众注意力


    +   2. 陈述问题


    +   3. 证明该问题确实存在


    +   4. 描述该问题可能带来的不良后果


    +   5. 陈述你的解决方案


    +   6. 展示你的解决方案能带给受众的好处


    +   7. 预测并回复受众可能产生的一些疑问


    +   8. 邀请行动


    还有很多比较好的演讲稿设计方案。比如，如果你要描述一个流程，你的演讲稿可以根据该流程的自然顺序，或者操作顺序进行组织。这种方案结构最适合《如何创立你自己的债务代收公司》或《如何调酒》这类演讲。


    如果你的演讲是关于在世界范围内扩张通信网络，那么你可以从美国开始，然后转向亚洲，欧洲。如果你的演讲是关于维他命 的，你可以根据字母表顺序从维他命 A 依次展开。


    每当我要进行新的简短演讲（20-30 分钟）时，我都会留出至少整整一天的时间去排练。泰瑞·史密斯说，对于任何一次新的演讲，每一分钟他都会用一个小时去排练“这样我才觉得安心，才觉得我已经尽力了。”史密斯说。


