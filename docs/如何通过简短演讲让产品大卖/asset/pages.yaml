- pgno: 63
  md: '# 第二十五部分


    # 对幻灯片的一点看法


    当今有个不好的趋势：会议主办方以及策划者一般都会坚持要求演讲者使用一款特别的软件来准备自己的演讲，那就是幻灯片。


    为什么要求使用幻灯片可能会对你的演讲者有害无益呢？原因有以下几点：


    第一，要求演讲者使用 PPT，可能会把他的注意力从他本应该关注的东西——内容，信息以及听众——转移到 PPT 形式上。这就相当于告诉一个作家：“我不管你的文章内容好不好，只要是
    word07 版本就行。”


    第二，它可能会限制演讲者的自主发挥能力。你一定也看到过很多 PPT 都差不多，没有什么特色。


    第三，PPT 让人感到乏味。很多演讲让人感到糟糕的演讲都是用 PPT 形式做的。我觉得，PPT 就好像一个信号，暗示人们：“这个演讲很乏味。”


    第四，它影响了很多演讲者的演讲效果。


    如果演讲者一直想着鼠标，键盘或电脑屏幕，他的注意力就无法集中听众身上，或无法集中精力和听众互动，而互动才是演讲成功的关键。


    第五，它把演讲者局限在了形式上，降低了演讲者的自主性，使得演讲者无法根据现场听众的反应和兴趣临时做适当地调整，而这是演讲成功的有一个关键所在。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '第六，它让听众昏昏欲睡。给听众播放 PPT 之前的第一件事是什么？调暗灯光——这么做无意间给听众制造了一个好的睡觉氛围。


    那会议策划人该怎么做呢？作为会议策划人，你应该尽你所能给演讲者提供一个好的演讲环境，让演讲者发挥出他的最高水平。


    下面是我的几个建议，帮助你在这个电脑时代给演讲者创造一个良好的演讲环境：


    +   不要要求演讲者使用 PPT。如果演讲者想用 PPT，可以。如果他不想用 PPT，也可以。都行。永远不要强迫演讲者使用他不喜欢或者用不习惯的演讲形式或媒介。因为会让他的演讲效果大打折扣。


    +   不要要求演讲中必须有视觉元素。这是不是让你很惊讶？事实是，很多演讲话题，比如电话沟通技巧，都不需要图表，表格，图片或者其他 PPT 类型的视觉元素。如果你强迫所有演讲者，甚至对那些用不到视觉元素的话题，都使用视觉元素，那你就犯了个大错误：这个
    PPT 本来用不着，但是因为你要求，所以演讲者不得不使用。你知道：全是文字的 PPT，以及子弹头列表会让人看得眼花缭乱。


    +   提前考察你的演讲者。现场听他们的演讲，或观看他们的视频。向雇佣他们演讲的客户了解他们。告诉自己，他们就是演讲专家。然后，让他们独自完成自己的工作。不要干涉演讲者的工作，就好比，不要告诉手术专家用什么仪器给人治病一样。


    +   不要千篇一律。PPT 大多会出现这种情况，让人无聊至极。听众渴望新鲜的，不同的东西。


    +   避免讲义陷阱。PPT 的一个重要优势就在于能够轻松拷贝，发送。问题是，这些 PPT 里面的很多东西，离开演讲后，不能说是完全失去了意义，至少意思已经不完整了。如果人们用几张图，一'
  merge: -1
  img_proc: true
- pgno: 65
  md: '些子弹头就能有效沟通的话，就不会有句子的出现了。


    好。假设你的演讲必须使用 PPT，那怎么才能让它更有效呢？对此，我有四点建议。


    第一，不要让投影仪一直开着。有选择地使用 PPT，不要在整个演讲过程中都用 PPT。


    如果你要展示一张有价值的照片，那就去展示。展示完后，关掉投影仪，打开灯。灯光能把听众从昏昏沉沉的状态中唤醒。在昏暗的房间里，人们很容易打盹。


    第二，当视觉元素比语言更能有效地传递信息时，再使用它。如果你在谈论质量，那么此时在屏幕上写上“质量”二字，对你的演讲起不到任何帮助。另一方面，如果你想说明土豚长什么样子，那用一张土豚的照片，表达效果要比用语言描述好得多。


    第三，可以用其他媒介补充，甚至代替 PPT。当教授电话营销时，电话铃声，以及一个电话道具都会吸引到听众，这是 PPT 无法做到的。


    第四，设计你的演讲时，要做两手准备，这样在电脑设备出问题，无法继续播放 PPT 时，你依旧可以继续演讲。没有什么比无法找到自己想要的那张 PPT，更让演讲者感到尴尬的了。把
    PPT 当作辅助工具，而不是主要工具。


    反对使用 PPT，我是不是落伍了？也许吧。但是，在 20 多年的演讲教学和实践中，我学到一点：最好的演讲者是在和听众谈话。如果你觉得自己需要用 PPT 等，才能和受众有效地沟通，我觉得你需要三思。'
  merge: -1
  img_proc: true
