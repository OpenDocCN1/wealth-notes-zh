  md: '演员兼主持人乔治·约瑟说：“总体来说，成功的演讲者都是真诚地想为他的受众提供一些他们想知道的信息。”


    当受众是技术人员时，可以根据受众的专业性调整演讲内容。演讲内容太复杂，会让很多人感到无聊。但是，演讲内容过于简单或基础，又会让知识渊博的专家级受众倍感厌烦。'
