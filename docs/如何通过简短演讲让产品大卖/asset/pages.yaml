  md: '# 引言


    # 为你的企业演讲！


    有调查表明，人们认为公开演讲比蹦极，甚至比死亡更可怕。我们可能都有这样的记忆：儿时在学校做演讲，战战兢兢，怯怯诺诺，甚至膝盖都不停地发抖。


    在众人面前演讲，需要一定的技巧以及很大的勇气。但是，如果人们要求我们讲一些我们非常确定的东西，比如我们的产品或服务，我们通常会滔滔不绝。


    我们可能也会见到一个平常口齿非常不清晰的人，突然口若悬河地讲着他5个月大的孙子新学会的一些能力。为什么？因为这个话题让他着迷。当演讲者兴奋，投入，充满激情的时候，听众也会很快受到感染，从而被演讲内容所吸引。


    通过在当地或全国进行演讲，能够提升你的企业或你个人的形象。演讲的机会有很多。但是，你首先要想想自己演讲的目的。


    如果一个作家想通过在当地的门萨社团（一个以智商作为入会标准的俱乐部）的一个会议上演讲，从而兜售有关如何提高智商的书籍，他的目标可能无法实现。他的演讲可能会鼓动几个人在会后买他的书，但是在会议上，他可能一本书都卖不掉。


    为什么？因为他的演讲可能只是另外一个活动或会议的开场表演，而不是该活动或会议的焦点。换句话说，他的演讲可能只是一场音乐会或其他社交活动的前奏。因此，他是在错的时间去吸引目标顾客。如果他的目的只是扩大自己的知名度，练习演讲能力，散发推广材料，这次演讲可能能够让他达到自己的目的。


    一位著名的心理学家曾拒绝了在“今夜秀”栏目上演讲的机会。因为他发现自己的节目前面是一个马戏表演。那个心理学家'
  merge: -1
  img_proc: true
- pgno: 8
  md: '觉得被马戏表演引起的狂欢气氛，对他讲解自己的理论非常不利。


    在任何免费展示或演讲中，你都必须清楚自己的最终目的。如果你是政客，你的目的是拉拢选票，那你去文法学校（为成绩优异的 11 至 18 岁学生设立）做演讲，就没有什么意义。同样，你的目的是寻找潜在客户，或者至少能接触到那些能向潜在客户介绍你以及你的企业的人。以准确、严谨的信息来吸引目标顾客很重要，准确、严谨地选择你的广告媒介也尤为重要。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# 第一部分


    # 公共演讲——一个公关工具


    公众演讲，以及在公共活动中，行业会议上，讲座以及其他会议上致辞，做讲座，做报告，以及进行展示等，都是一种公关策略。它被广泛用于企业产品或服务的推广。


    为什么公共演讲有这么好的推广效果呢？因为，当你演讲的时候，人们会把你当成专家。一场出色的演讲，能立即赢得听众的信任，为你建立信誉。如此一来，潜在客户就会愿意和你以及你的公司合作，来解决他们的问题。


    和略显缺乏人情味的文章相比，演讲或讲话能够让你和受众近距离接触。由于今天的快节奏生活，越来越多的活动都是通过电子邮件，电话会议以及网络会议的形式进行的。和潜在客户面对面交流，能够强化你在他们心中的形象。恰当的演讲环境，专业的演讲内容，能让你给受众留下更加深刻，有力的印象。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# 第二部分


    # 何时演讲


    演讲并不适合所有的产品或营销活动。如果你想在全国范围内的电脑用户，大规模推广一款最新的软件，电视广告以及印刷广告的效果可能就要比演讲好。因为，演讲接触到的人数有限。


    再比如，某个婚礼顾问的市场仅限于曼哈顿，那么他在当地教堂针对已经订婚的夫妇，做一次婚礼演讲展示，他可能就会立即吸引到大量潜在客户。乔治•瓦德曼在他的书籍《高效沟通》（纽约
    范•Nostrand 出版公司出版）中说，只有满足下列条件时，才适合通过演讲去推广：


    +   1. 要有一些比较机密的内容供大家学习，讨论。


    +   2. 演讲者要热情，还要有一定的个人品质。


    +   3. 需要有开放的讨论氛围。


    +   4. 能够激励受众的情感、态度和信念。


    +   5. 不需要绝对精准。


    +   6. 需要受众迅速或在某个截止日期内做出决定。


    +   7. 让受众最大限度地理 解演讲者的演说，周围环境非常关键。


    +   8. 为了抓住受众的注意力以及兴趣，或者让他们集中精神于某个话题，或某件事情，适当增加有影响力的元素很有必要。


    +   9. 对某种观点或建议最好是能有个人证言。


    +   10.必须满足社交需求。


    演讲也针对非常具体、狭小的垂直市场进行推广、公关的一个工具。因为在那样的市场中，你最好的潜在客户大多数都集中在一 个，或几个主要的协会或社团中。例如，在装饰品行业，如果你想'
  merge: -1
  img_proc: true
- pgno: 11
  md: '把广告推送给顾客，你可能就要选择投放广告或在发行量大的杂志或相关网络平台上发表文章，从而让自己的广告到达所有装饰品顾客手中。


    但是，如果你的公司从事专业的装饰品抛光，那么你最好选择多种多样的推广方式。比如，在装饰品抛光协会或装饰品清洗及抛光全国协会上演讲或做报告。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# 第三部分


    # 寻找演讲机会；选择演讲话题


    除非你自己举办研讨会，否则，你需要想办法让合适的论坛主动邀请你或你的公司代表去做演讲。在这方面，你做的怎么样？


    首先，查看你的邮件，以及你阅读的一些商业刊物，上面可能会公布一些行业会议或活动。例如，如果你要销售熔炉给钢铁厂，想推广一个新的工艺流程，你就可以在年度钢铁工业博览会上，就你的新技艺发表一场演讲。


    行业期刊一般都会对提前几个月公布一些主要的展会，世博会，以及会议。许多商业刊物也有专栏，专门对地方性或全国性的行业活动进行公布。一定要仔细浏览你的目标市场行业刊物上的这些专栏。


    你也要提前查看电子邮件中的一些公告。如果你是一个广告经理，或者小企业老板，一些专业的社团或商业协会，可能会发邮件邀请你们公司去他们的展会上做展览。这很好，不过你还有另外一个目的：了解一些展会上是否会有人做演讲，报告，或是否有研讨会。如果有，就想办法让你们公司的人签约去做演讲或参加研讨会。如果展会的邮件中没有提及演讲，或研讨会，你可以给他们打电话进行咨询。


    主动向会议负责人提议，表示你们愿意去会议上作有关某个话题的演讲。大多数会议负责人都非常欢迎这样的提议，因为他们需要演讲者。会议负责人或“技术研讨会”（科研成果展示或演讲的一般称谓）的负责人通常会要求你写一个演讲摘要，或100—200字的演讲大纲。如果是你们公司的其他人去做演讲，你需要和他们一起讨论撰写一个具有诱惑力的大纲，从而在最大限度上吸引人们参'
  merge: -1
  img_proc: true
- pgno: 13
  md: '加你们的演讲。不过，大纲也要准确地反映出演讲者的演讲内容。


    因为有很多做推广的商家都会向会议负责人推荐自己的演讲者，所以，你行动的越早，越好。通常来说，一些主要团体的年度会议都会提前8个月-12个月筹划；当地团体或当地国际性的组织或社团都会提前3-4个月预约演讲者。你越早联系他们，你的提议就越可能被他们接受。


    你可以在同一年份或不同年份，在不同的团体内“循环”利用你的演讲。你只要根据当时的市场情况，或团体的兴趣爱好，对你的演讲稿稍作修改。当你设计一场演讲的摘要，大纲或提议时，把它保存在你的电脑中。然后，遇到其他演讲机会时，你就可以迅速编辑并打印出一份适合当时情况的提议或摘要。这样，你就可以在第一时间把它们以电子邮件的形式发送给会议负责人。


    因为你的目的是销售产品或服务，而不是教育读者，或成为一个专业的演讲者，你就需要选择一个与你的产品或服务相关的，能够对其推广起到帮助作用的，同时还能够引起受众极大兴趣的话题。


    重要的是，演讲本身不能直接帮你销售东西，但是，演讲能让你或你的公司成为你的产品或服务所处领域的专家，人们会觉得你提供的信息是专业的，权威的，觉得你能够帮助他们解决问题，这对你的产品或服务的销售会有很大帮助。


    所以，你的演讲应该客观，能为人们提供一些策略，或有用的信息；而不应成为你的销售或产品演示。


    比如，你销售的是电脑自动拨号营销系统，你的演讲不应该成为你的系统的销售广告。相反，你的演讲内容可以是“如何选择正确的电脑自动拨号营销软件”或“电脑自动拨号营销系统
    vs.传统电话营销系统，哪种更适合你的企业？”尽管你需要人们选择你的系统，但是你的演讲一定要（在很大程度上）可观，不要明显偏向于'
  merge: -1
  img_proc: true
- pgno: 14
  md: '你的产品；否则，你会冒犯受众，引起他们的反感，不再听你讲话。


    我曾经在一个营销会议上做演讲，当时会上还有其他演讲者，其中就有一个电脑自动拨号营销系统制作商。本来在会上他应该谈论一些关于如何利用软件提高电话营销效果的内容，结果他一直在讲自己的系统，并且还给别人做演示。结果可想而知，参会者非常反感，对他的评价非常差。我肯定他没有获得任何订单，而且这次演讲也没有为他带来任何信誉。


    最后一点：如果你没有在你所处行业的会议及活动主办方的邮寄列表中，无法提前收到它们的会议及活动公告，那么你可以在他们网站上订阅他们的电子时事通讯。或者也可以打电话或写信给他们。盖尔调研出版社出版的《协会百科全书》里有很多协会的名字及地址，你在当地图书馆就能找到。


    那么，你可以在哪里做演讲呢？几乎任何地方。协会，俱乐部，宗教组织，学术团体，慈善组织，商会，社区活动中心等，任何愿意接受个人演讲，为他们的会员提供相关的娱乐以及信息的组织都可以。


    你不必有多么出色的演讲口才，也不必像温斯顿·丘吉尔，埃尔玛·邦贝克，或奥尔森那样成为一个出色的演讲家。花店可以展示插花的艺术；空手道教练可以展示自卫的艺术；艺术画廊老板可以提供购买雕塑时的注意事项；牙医可以告诉人们如何在牙齿护理方面节省费用。


    把你所属的协会以及相似的一些社团列出来，另外再加上一些可能会对你的演讲内容感兴趣的当地俱乐部。然后，联系相关的负责人，向他推荐你的演讲。


    不要指望主办方会付给你演讲费用。主办方一般情况下很少给演讲者付费。当然，如果他们付费给你，可能会提一些要求，比如'
  merge: -1
  img_proc: true
- pgno: 15
  md: '你不能在演讲中提到你的产品或服务，因为没有人愿意为商业演讲付费。作为免费演讲者，你应该问自己几个问题：


    *有多少人参加这次会议？人越多，潜在客户就越多。如果你的演讲中会用到一些照片或影片之类的，一定要确保每个人都能看到。


    *该俱乐部除了你的演讲，还会安排其他哪些节目？在上面我们提到过，有的会议或活动可能并不适合你的产品或服务。你的演讲对象一定要是想听你演讲的目标受众，而不是那些只是为了结交朋友，随便逛逛而出席会议的人。


    *你希望在演讲结束后就有人订购你的产品或服务吗？有些聚会是允许演讲者在演讲结束后散发宣传材料的。但是很多组织觉得这太过商业化，会禁止你散发宣传材料，甚至不允许你直接提及自己的产品或服务。如果你想某个活动上演讲，你就要想办法了解该活动负责人对演讲中是否能听融合销售信息的看法。


    *保持客观。永远不要抨击竞争对手，或者暗示别人只有你的产品或服务才能满足他们的需求。一个好的演讲者会尽量保持客观，即使有人要求他把自己的产品或服务和竞争者的产品或服务进行对比。努力成为你所在领域的代言人，这样你就不必和别人争辩谁的产品更好，人们会觉得你的信息很权威，觉得你是你们行业的专家，而不是另一个想要卖掉自己的产品或服务的人。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 第四部分


    # 筛选演讲机会


    有时，会议策划人或负责人会主动打电话给你，请你（或者你们的公司代表）在他们的会议上做演讲。


    为了请你在会上演讲，他们还可能会讲一些奉承你的话。但是，你一定要小心。并不是每个演讲机会都值得去的。会议策划人或负责人主要关心的是找个人上台演讲，而不关心演讲者或者演讲者的公司能否从演讲中获益。因此，在你答应他们去演讲时，要问策划者以下几个问题：


    +   那个团体的性质是什么？


    +   团体中的成员都是哪类人？他们的工作是什么，职位是什么？他们在哪家公司工作？


    +   这样的活动参加一般有多少人参加？据策划者预计，听你演讲的人大概有多少？


    +   主办方付酬金或者基本的差旅费给你吗？


    +   他们最近还请过哪些人演讲？这些人代表的是哪些公司？


    +   他们付钱给那些演讲者了吗？如果付了，那为什么不付钱给你？


    如果这些问题的答案表明，那个会议不适合或不值得你（或你的公司代表）去演讲，或者会议策划人似乎无法或不愿意回答这些问题，那么你就要婉言拒绝他或她的邀请。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 第五部分


    # “推广”谈判


    因为你的目的不是通过演讲本身赚钱，而是推广你的产品或服务，你可以把该团体不付酬金作为砝码进行谈判，要求他们给你提供一些其他东西，让你的演讲带给你最大的产品或服务推广价值。


    下面是你可以要求的一些东西。除了演讲机会，你应该要求主办方答应你以下全部，或至少部分条件：


    +   ① 告诉会议负责人，你愿意免费在他们的会议上做演讲，但条件是要求他们提供给你会员名单列表。你可以利用这张列表，通过直接邮寄的方式，在演讲前后推广你的产品或服务。


    +   ② 在演讲前发送邮件给与会人员，能够让人们知道你即将做演讲，也可以作为你的个人邀请，邀请他们参会。演讲后发送邮件给与会人员，可以给错过你的演讲的人，提供你的演讲复印件，或演讲视频给他们。


    +   ③ 在比较大型的会议以及研讨会上，主办方通常会提供一些会议用品给来宾，包括一系列的材料，如研讨会时间表，午餐及晚宴餐券，会议区域地图，以及会议周围旅游景点，以便感兴趣的外地游客去游玩,等等。这些用品是提前邮寄给与会人员，或在会议现场分发的。


    +   ④ 你可以告诉会议负责人：“我可以免费做演讲，但作为回报，我希望你们能够把我们公司的宣传材料放在会议用品中，一同邮寄给参会者。可以吗？当然，公司宣传材料，你们需要多少，我们会提供给你们多少。”如果他或她同意了，你不用付邮费，就可以把自'
  merge: -1
  img_proc: true
- pgno: 18
  md: '己的宣传材料邮寄给几百，甚至上千位潜在客户。


    4 演讲是让特定人群认识自己的一个有效方法（你演讲的那个组织里的成员，更具特点，就是那些参加你的演讲的人）。但是，我们都知道，要想在受众心里留下持久的印象，仅凭一次演讲还远远不够，我们需要连续多次和他们接触。


    你可以通过很多方法，轻松地把一次性演讲变成针对这个特殊群体的持续的公关宣传。我们前面已经谈到过，其中一个方法就是和会议负责人索取邮寄名单，你自己邮寄，此外，还可以要求主办方把你的宣传材料放在他们的会议用品中一同邮寄出去。


    另一个方法就是在该组织的时事通讯或杂志中，争取一个或多个公关宣传的版面。比如，告诉会议策划人，在演讲前，你愿意给他们的时事通讯提供一系列的文章（你目前已经发表的以及很有特色的文章，都可以再次提供给这些特殊受众）；这个方法可以让受众认识你，是一个不错的公司公关宣传机会，同时还可以增加人们参加你的演讲的兴趣。


    演讲结束后，你可以把你的演讲笔记或文本，提供给该组织的时事通讯编辑，并促使他或她把你演讲的全部或部分内容（或演讲概要）作为演讲内容回顾进行刊登，以便那些无法参加这次演讲的人也能从这些信息中获的好处。


    在演讲结束后，你也可以提供其他一些文章，对受众进行跟进，从而强化你的演讲信息给受众留下的印象，同时还可以给受众提供更多信息，方便他们进一步学习，或者回答受众提出的一些问题，或探讨你在演讲中没有时间去探讨的一些问题。


    5 如果编辑负责人不愿意在他们的资源列表中刊登你的文章链接，你可以和会议策划人去谈判，为你的产品或服务争取更多免费广告。对于国际性组织来说，他们的杂志广告一般都会收费，如'
  merge: -1
  img_proc: true
- pgno: 19
  md: '果你能争取到他们的免费广告位，这个价值将相当于你的演讲费的两倍。


    +   活动主办方通常会邮寄或散发（或二者兼有）一些材料来宣传你以及你的演讲。他们印制的宣传材料通常都用不完，用后剩下的他们都会扔掉。你可以和他们说，你想要那些剩下的宣传材料。你可以把这些材料放在其他印刷材料或满意度调查问卷中一同邮寄给参会者，这是跟进参会者的一个非常棒的方法。


    +   专业的演讲录音或视频是非常好的宣传工具，也可以作为印刷手册，直接邮寄，以及其他销售材料的一个补充。不过，在工作室里录制这样的讲演，价格也非常高。


    有个方法可以让你以较低的成本获取你的演讲录音或视频，那就是让别人替你付费。如果某个组织想邀请你去做演讲，但是无法支付费用给你，特别是他们的观众还不是你的产品或服务的主要潜在客户，你就可以说：“通常对于这样的演讲，我的收费是X美元。但是，如果你能够把我的演讲录制成专业的视频（或音频，或二者兼有），并把母带给我，我愿意免费去给你们做演讲。”


    如果该组织拒绝了你的条件，你可以说：“作为回报，你可以把我的演讲视频或音频复制，并发送给你们的成员，你们甚至可以把它销售给参会者或你们的组织成员，我不会收取一分钱的提成。我只要你们录制好后，把母带给我。”


    在很多重要的会议上，主办方一般都会录制所有的演讲视频，并在会议上出售，并在接下来一年用这些音频或视频进行推广。如果你的演讲也被录制了，你可以告诉主办方，通常你是不允许别人录制你的演讲的，但是如果他们给你母带，你愿意让他们录制。（同时你要澄清一点，虽然你允许主办方销售你的演讲视频，并且你不会收取任何利润提成，但是版权应该归你所有。）


