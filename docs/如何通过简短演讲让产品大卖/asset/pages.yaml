- pgno: 25
  md: '# 第七部分


    # 演讲中最重要的部分


    演讲由三部分组成：开头，正文，结尾。这三个部分都非常重要。但是，开头和结尾比正文部分更重要。对一个话题谈论大约 15分钟时间，这点很多人都能做到。只要列举事实，或朗读预先准备好的演讲稿即可。演讲的正文部分大都是这样。


    但是，演讲的开头和结尾就难多了。因为在演讲开始部分，你必须能够立即吸引受众的注意力，并获得他们的支持。不仅要让受众觉得你的话题很有趣，还要深深地吸引住他们，或者至少不要让他们发现你本身有什么不妥的地方。


    为了测试这个理论，一个著名的演讲家故意把他演讲中的开头部分，换成了5分钟的自我介绍；说他如何如何成功，赚了多少钱，他的演讲有多么受欢迎，为什么主办方请他上台演讲等。在他的演讲结束后，他随便问了一个在场观众：“你觉得我在演讲开始时那么说，可以吗？”那个人礼貌地回答：“我当时在想，你真爱吹牛啊。”


    如何开始自己的演讲呢？一个简单且行之有效的有效的方法就是：通过提问的方式让受众参与进来。例如，如果你的演讲主题是通信系统问题，你就可以问受众：“你们当中有多少人使用的是UNIX操作系统？有多少人使用微软系统？太阳计算机系统呢？”


    如果你的演讲话题是健康，你可以问：“请问你们今天有多少人是经常运动的？有多少人准备在这次会议结束后，晚上去运动？有多少人一周运动三次或三次以上？”'
  merge: -1
  img_proc: true
- pgno: 26
  md: '问这样的问题，有两大好处。首先，这能引起受众的注意，兴趣，以及参与度，可以让你根据现场受众的需求调整自己的演讲内容。其次，它可以立即让受众参与进来。


    因为，当你自己作为受众的时候，如果演讲者问问题，你要么会举手，要么不举手，不是吗？不管你举不举手，不管你内心怎么想，你已经参与了进来。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# # 第八部分

    ## 演讲尾声


    开头固然非常重要，但是也不要忽视一个有力的结尾的重要性，特别是你去会议上做演讲为的不是演讲本身，而是为了宣传你的公司或产品。多罗茜·利兹在她的作品《威力演讲》（普伦蒂斯霍尔出版社出版）中指出：


    > “演讲者同时也在销售，因此，演讲结尾就是呼吁人们下订单的时刻。如果你不呼吁他们采取行动，你就拿不到订单。你可以告诉受众，你希望他们做什么，以及如何做。有效的演讲者能够在演讲结尾时，引出一个中心思想，告诉受众他们做什么，就能得到自己想要的结果。比如……如果你一直在说服受众献血，那么请在演讲结尾告诉他们去哪里献血。听起来一定要非常简单易行。”


    你呼吁的行动不一定非得是要受众真正动起来，去做什么。如果你的演讲目的只是想让受众仔细想想你的建议，那么你可以告诉他们这就是你想要他们做的。


    有了精彩的开头，赢得受众的支持，吸引人们倾听你的演讲，以及一个有力的结尾，帮助你“达成交易”，你还需要注意演讲的正文或中间部分。它是演讲的“肉”；它是受众想要听的地方。如果你的演讲主要是提供信息，那么请确保提供最新趋势，最新科技以及产品发展的内部信息。如果你的演讲主要是为了鼓励人们，那么请充满热情，让听众相信，他们能够成功减肥，能够通过投资房地产而赚钱，或能够成功戒烟。


    如果你的演讲主要是提供方法策略，那么确保你已经提前把它写了下来，从而让受众在离开时，能够得到很多有用的建议和意见。


    # 27'
