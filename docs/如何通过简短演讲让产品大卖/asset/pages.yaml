    # 掌握演讲的内容长度及时间


    演讲的时间长度从 10 分钟（比如，简短的工作总结发言）到 2 天（比如，集中学习研讨会）不等。那么，你的演讲时长多久合适呢？主办方的活动或会议策划人通常会告诉你演讲时长。当地团体，或某专业社团当地分会，以及商会俱乐部的午宴或晚宴后演讲时长通常是
    20-30 分钟，外加 5-10 分钟的问答时间。


    一些重要会议以及国家博览会上的技术讲座时长通常是 45-75 分钟。如果主办方给出的演讲时间是 1 小时，那么你应该准备 45 分钟的演讲，因为你需要留出
    5 分钟左右的时间给晚到的听众，演讲结束后，还要留出 10 分钟的时间作为非正式的问答环节。


    最幸运的演讲者就是那些受邀参加小组座谈的人了。小组座谈一般会有 3-4 个专家，外加一个主持人。在小组座谈上，你只要回答主持人或观众的问题就可以了，而不用准备演讲。


    企业演讲稿自由撰稿人理查德·阿姆斯特朗，说他撰写的大部分演讲稿都是 20 分钟的时长。《演讲写作指南》（约翰威立国际出版公司出版）一书的作者詹姆斯·韦尔奇说，一页两倍行距的演讲稿，大概需要演讲者讲
    2.5 分钟。这也就是说八页双倍行距的演讲稿，约 2000 字，大概够演讲者讲 20 分钟了。


    也就是说语速大概是每分钟 100 字。有些人的语速更快，每分钟达到 120 到 150 字，甚至更快。所以 20 分钟的演讲稿大概就是 8-10 页的演讲稿。


