- pgno: 59
  md: '# 第二十二部分


    # 特殊活动


    特殊活动，如盛大开业，给孩子们举办的骑马游戏，烧烤，舞 会，野餐郊游，万圣节派对，以及其他一些特殊活动都可以作为有 效的宣传手段，它们的宣传效果主要体现在两方面。


    首先，它们能对你的公司，产品或服务进行营销推广。当人们 来你的店里参加活动，免费领取热狗或冰激凌时，他们就会可能逛 逛你的商店，并购买一些东西。


    其次，它们能给你带来很多媒体报道，从而起到推广作用。记 者们喜欢采访一些特别活动，并进行报道。


    如果你的活动上提供免费食物，礼物，免费车接送，或者其 他一些赠品，记者们至少会在自己的报纸上进行报道，尤其会在本 周大史记，或本周活动计划专栏上进行报道。


    如果你的活动有更好的立足点，记者们则不仅会把计入本周 活动计划中，还会在活动前后，对它进行更广泛的宣传。这取决于 你在活动上投入的时间和精力。因为通过这次活动，你不仅向参加
    活动的人宣传了你自己，而且通过记者的宣传，能让很多没有参加 活动的人也了解你。


    在特殊活动中，想办法让自己的销售机会最大化至关重要。比 如，当地有家商店发广告说，在商店开业时，蜘蛛侠会过来和孩子们合影，并赠送他的亲笔签名漫画。那天我们到那里的时候，已经有很多父母带着孩子排着很长的队来看蜘蛛侠了，大概得排队
    50 分钟。'
