- pgno: 29
  md: '# 第九部分


    # 掌握公众演讲技巧


    我们一直在说，推广你的产品或服务最廉价、最有效的方法之一就是公众演讲。例如，你经常会看到一些金融研讨会在你们当地报纸做广告。广告内容是邀请你去参加研讨会。通常只有一个两个小时，主题基本上都是遗产规划、退休规划、公共基金或其他方面的个人理财或投资。


    这些由当地经纪商、金融规划师、或其他金融服务公司举办的研讨会，通常都是免费的。那么他们怎么赚钱呢？通过把一些参加免费研讨会的参会者转化成为他们的付费客户，购买他们的资金管理、房地产投资计划、或其他金融服务。


    “免费演讲”策略在许多领域，许多场合都非常实用。比如，一个小企业管理以及营销的专业顾问，可能会在某个商会午宴上宣传自己的服务，从而把一些当地企业主变成自己的客户。


    当地协会举办的联欢午宴或晚宴、基督教青年会或青年联谊会、高中和大学的成人教育计划、当地的图书馆、贸易展览和其他会议…公开研讨会等等，这些地方你都可以去做演讲。那么，为什么使用“免费演讲”策略的企业主并不多呢？


    其中一个原因就是，在公众面前演讲，让他们觉得很紧张。我们之前也听说过，很多调查显示，人们对在公众面前演讲的恐惧程度，比对蹦极（我特别害怕），蛇，甚至死亡的恐惧程度还要高。


