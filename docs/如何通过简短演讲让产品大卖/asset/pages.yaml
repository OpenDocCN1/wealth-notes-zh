  md: '# 作者简介


    德鲁·埃里克·惠特曼是美国广告界尤其是直接营销界著名的“直邮博士”，合赢岛长期的战略合作伙伴。他毕业于美国坦普尔大学广告学专业，一手打造了美国广告培训业巨头
    CASHVERTISING。他从十几岁开始就热衷于广告制作，尤其擅长广告文案的撰写。


    毕业后的二十多年，一直致力于消费心理学和广告学的研究与教学。他的培训班学员包括许多商界精英，知名企业的市场部、企划部和广告部等主管以及美国商会各州的主要负责人。


    同时，德鲁曾经在费城最大的广告公司做广告文案撰稿人，也曾经为许多企业负责广告策划工作。包括宝马、ACCO 在内的多家世界 500 强企业，美国汽车协会（AAA）以及全美最大的媒体和广告服务业的营销机构——广告专业学院（ASI）都曾聘请他担任广告文案撰稿人并最终采用了他的策划案。


    他所著的 CASHVERTISING 一书在美国引起了广告界的强烈反响，该书中文版《吸金广告》于 2014 年 7 月在中国正式出版上市。他强大的“广告力诊所”告诉人们如何利用消费者心理，去提高他们广告、手册、销售信、网站、微信等的效果。'
