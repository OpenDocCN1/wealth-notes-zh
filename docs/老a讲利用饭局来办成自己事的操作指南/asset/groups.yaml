    ## 第二章：筹办饭局前，你最好考虑到这些细节，越


    2019-06-11 23:07:33


    有一些人求人办事请吃饭，终于把重量级的人请出来了，既然请出来了，那就开整吧！反正咱准备的都是好东西，可劲造吧！


    可惜，你只成功了一步，第二步就失败了。


    虽然一些小细节，可能影响不了大局，但也不一定，有的领导就非常在意这些小细节。毕竟，被人抬习惯了，稍微有一点不如意，他就会觉得自己没得到尊重。


    - 比如你请的这位领导是回族，你问都没问一句，整了一头小乳猪，还一个劲得为领导多吃点多吃点，非常滑稽！

    - 比如你请的重要来宾是北方人，主食喜欢吃面食，你问都没问，就安排了米饭。

    - 比如你请得人，非常注重养生，吃得非常精细，你却点了一堆又一堆大盘菜，他看了就倒胃口。

    - 等等的。


    所以，这些小细节，你不得不考虑，不然，别人看到传菜生上的那些菜，立即就没食欲了。


    这些小细节，一招就可以化解大部分：那就是在领导应允赴宴时，你多问一句，领导你看菜品上有什么忌讳没有？他说没有。你再追问那咱们是特色菜还是农家乐，想吃特色菜系的，基本上都是没什么忌讳的，想吃农家乐的，大多是图个安静，希望你不要安排在什么高档场所，最好是私密性好的地方，并且，吃农家乐，一般是喜好清淡口味的。


    知道这些信息，基本上就差不错了。


    但是如果你追求完美，想在菜品上安排的天衣无缝，如果有资源，可以问下领导身边人，比如他的秘书或者司机，看看领导平日里有什么特别喜欢吃的，到时候围绕这道菜，多整几个口味。


    我原来有个领导，是山东沂蒙山区的，那边的人非常喜欢吃煎饼。有一次一个老板请他吃饭，菜上到一半，突然传来桌面端出一盘热乎乎的煎饼，领导非常高-兴，一直夸赞：你太有心了，你太有心了。其实，这个老板是知道领导喜欢吃煎饼后，专门让办公室主任在公司逐个问：谁会弄煎饼，有一个在食堂打工的老阿姨会去弄，老板就把老阿姨叫到酒店，提前在酒店里准备弄煎饼的家伙事，准备了大半天，就为了让领导吃上一口刚弄出来的煎饼。


    天下的难事，就怕遇到有心人，难事遇到有心人，大多都会迎刃而解。


    还有一个女领导，人多半百，依然风韵绰约。她有独特的养生经验，就是多吃豆制品，有人请她吃饭，专门在某市场请了一个做豆腐生意的，把他请到农家乐，又弄豆浆、又弄豆腐，豆渣也用来炒菜，晚上的菜品，基本上全部都能找到豆制品的影子。女领导一看，会心一笑。


    各位读者，既然是做局，就请你做全套的、做细致的、做深入人心的、做出心裁的。


    人求人，不容易啊！尤其是先前没有半点交往，没有任何交往基础、感情基础，冒然去求人，是要更多花心思，不然，别人凭什么啊？你一张嘴，人家就来赴宴了，人家吃你几口平时都懒得吃的破菜，就要答应你的狮子大张口，没那么简单，如果通过饭局求人办事，这么容易的话，饭局也不配叫饭局了，就叫吃饭，叫填饱肚子。


    很多读者觉得这TM也太累心了，这才到哪啊！你这不是想走捷径、想赶近道吗？虽然条条大路通罗马，但这些大路又不是你家的，不能你说走哪条就走哪条啊！不付出点代价，能行？


    这你都觉得累心了？其实实实更残酷，大概率事件是即便你付出代价，最终你也得不到你想要的结果，别人还是帮不了你。那你岂不是觉得冤死了？你觉得冤，有人却乐此不疲的去做！尤其是那些会做生意的商人，他们想得开，办不成就办不成，但咱们还是有收获，起码认识了！认识了，还可以继续跟踪，认识了，就还有下文。


    想成大事的，是不会计较这些心力、财力上的投入的，想求人办事的，也不会在乎这些。因为他们都很清楚，如果这个事情行得通，自己能够得到的可不是一点半点，甚至买一百个这样的馆子都绰绰有余。


    第一讲和第二讲，好像讲的都不太多，例子也不多，但好在主旨非常明确，我要的就是效果，我怕自己一展开讲，就让大家找不到重点和主旨了。


    我相信聪明如你们，一定能找到这两章我着重想表达的东西。


    ## 第三章：饭局中要送的东西，提前备好，你知道我说的什么


    饭局，饭局，可不仅仅是吃饭，必须得有酒水。


    尤其是求人办事的饭局，我觉得宁可没有饭，也必须有酒，因为酒能助兴，因为酒是这个世界上最能快速将陌生人的面具摘除，将两个并不怎么熟知的人的距离拉近。


    你看那些人，在进馆子之前，都是一副公事公办，不可侵犯的凛然样子，等饭局结束后，又成了勾肩搭背，欲说还休的架势，是饭菜的功劳？是酒精的功劳！


    所以，很多求人办事，忽略了酒的作用，只在菜品上下功夫，顶多也只是让对方吃了一顿好饭菜。你不用酒把他的防备、戒心、庄重、架子都放下，你怎么好提出自己的诉求呢？所以，我写这个饭局的专栏，着重点，也是在酒上，而不讲什么狗屁礼仪、点菜、着装等等，这些大路边上的东西，既不是重点、也并不是难点，你们随便在网上搜一下，都能够知道。


    这一小章，我是想说：领导答应赴宴后，你必须把东西准备好。尤其是酒。


    如果你能打听到他喜欢喝哪种酒，那你备好就是了。


    如果不知道，那你应该多少都备点。白酒，酱香型、清香型的都备点，备点啤酒，备点红酒。你可能觉得饭店里有啤酒啊，但，如果领导执意不喝酒时，你说喝点啤酒，他还是不喝，毕竟饭店里啤酒都是路边货，不是燕京就是纯生、青岛，你备的啤酒可不能是这样路边货，哪怕是价格不高的国外啤酒，你也可说是一个朋友在德国带回来的，这是德国最好的啤酒，只有一条流水线，是限量的，领导你尝一尝，不多喝。


    不这样，你劝不下去酒的。甚至，连开始都开始了。


    备点红酒，是以防他连啤酒都不喝，那只能说喝红酒了，毕竟红酒在大多数眼中，是具有养生功效的，起码能软化血管。（虽然我不觉得，都是酒，都伤肝，软化血管，只不过是噱头）。


    备红酒的另外一个意思，是饭局中难免有女性，在较高档的饭局上，让女性饮白酒，是很不绅士的，除非她自己主动喝，你不能力劝。很多基层的领导却反其道而行之，有点小权力，逼着女性喝白酒，一直喝到人家丑态毕出，他才心满意足。这是一种恶习和陋习，也是闲的没事干吃饱了撑的。毕竟女性在这个社会上处于弱势群体，因为他压根就不会想到女性喝多了，回家是否安全？如果觉得无所谓，为什么不回家灌自己老婆喝呢？


    扯远了，以上我说的是酒要备好。


    并且，备足。只有备足了，遇到领导执意不喝时，或少喝时，你才能拿酒来开路，每种酒，都有让他品尝的一番说辞，你花这么大心思准备了，他不喝，会有却之不恭的感觉。


    除了备酒，还要准备哪些东西呢？


    求人办事，有些心意，是要提前表达的。所以，你懂得是什么。


    这些东西，你也得提前准备好，即便饭局时，他态度比较强硬的表示无能无力，你也得提前准备好。


    很多大事的办成，是一波三折的、是需要多次协商的、是需要反复攻坚的，所以那些心意，即便没办法让你一次就把事办成，也能成为你办成事的一块小基石。


    既然话说到这了，我不得不给各位泼一盆冷水了，我估计你们看完我这个专栏，一定有机会让你们实践我讲的饭局里的这些，但，你们千万不能指望一次饭局就能帮你解决问题，即便你这个饭局安排的再完美。


    为什么这么说呢？


    因为有好事，有利益，大家都会去争取。你之所以安排饭局，是因为你们还不算熟，熟的关系根本不用饭局，一句话就搞定了。你安排饭局想促成好事，是想在半路截胡，你可能截胡成功，但大概率是不成功，因为，他对这个好事，可能另有安排，或者已经有确定的人选和目标。


    但你也不灰心，因为他还会有其他好事，即便这次不成，下次不成，下次下次不成，总有成的那一次，毕竟，这么多年，你一直不断这条线，一直让你这么投入，而让你见不到收成，他自己都会于心不忍的。


    不是有老话是吗？常与领导吃饭，提拔是迟早的事；常跟大款吃饭，发财是迟早的事。


    是的，是迟早的事。


    ## 第四章：饭局上必须得让对方端起酒杯，只要他端起来，就一切都好说了，怎么让他端起来？


    酒真是一个数一个好东西，你看东西方文明，虽然有很多不同，但是每种文明都是在进化的过程中发明了酒，并传承下来的。


    它是人世间情感的催化剂，合理地利用它，能起到你意想不到的效果。


    一般求人办事的饭局，事，能不能成，很多时候要取决于你能不能让上司端起酒杯、并且喝好。如果不能，那他吃饭前是正襟危坐的，吃饭后依然正襟危坐，犹如没有防护破绽的堡垒，你根本找不到一个入口走到他柔软的心里。


    怎么才能让上司端起酒杯呢？


    我建议这个功夫最好也是提前准备，准备什么呢？准备一些托词。准备什么托词呢？我在稍后，会提到。


    我来帮大家模拟下你请上司的饭局。


    佳肴都端上来了，你请示上司说喝点养生酒？无酒不成席的嘛。


    上司如果说好那，少喝点，顶多二两。


    那就好了。直接开整就是了。


    如果上司说我身体有问题，喝不了白酒，那你别那么听话的就顺着上司的意思，你应该立即接话比如：那领导，要不您喝点啤酒？总量给您控制住，能一杯，啤酒应该是没问题的，那玩意是液体面包，补充能量的。


    他一般不会拒绝你，如果他还是拒绝，你再劝：确实，啤酒也是酒啊，要不整点红酒吧，红酒是保护身体的，里面有抗氧化的因子，每天喝一点，确实对身体有好处。


    如果他还是不喝，那你就别劝了，毕竟你是求人家办事，你不能像江湖兄弟那样，傻不拉几的说一些什么不喝不给面子、少多喝点等等之类的劝词。


    能来就给你是面子了，来了还以上社会上那套俗不可耐的烂规矩来套住上司，我看纯粹是没事找事了。


    他不会喝，一会还是有机会让他喝的，不急在这一会。


    大多数上司，都会接招，喝点红酒。


    很多人认为红酒不是酒，那玩意，喝起来能起什么作用。其实我觉得红酒比啤酒还要厉害一些，喝十瓶啤酒的人大有人在，但能喝十瓶红酒的人，找不出来几个。顶多六七瓶，就已经不行了。


    所以，红酒，喝个两三瓶，一般人都已经进入醉熏的状态了。


    如果你把陪酒的人找好，把提前准备的托词想好，喂他喝两三瓶红酒，简直是轻而易举的事。


    比如：

    - 是校友敬一个

    - 老老乡敬一个

    - 聚会认识得敬一个

    - 您刚才说的话有启发得敬一个

    - 在您的带领下局面一片大好得敬一个

    - 都有高蛋白是朋友得敬一个

    - 以后需要您栽培得敬一个

    - 您女儿刚考上中国人得敬一个

    - 您也在黄埔区啊我也，是邻居啊，得敬……


    这种散敬的托词，找一百个都能找到，总而言之一句话，敬就对了，喝就是了。


    我们再回到上面说的，如果他执意不喝，你在一开始不要劝。在饭局气氛稍微活跃点的时候，可以再去敬，敬之前，先倒少量红酒给上司端过去，说：领导，我酒量其实不行，所以今天有点醉，您不喝酒，我也不能劝您。但这杯洒，我还是得敬您，您女儿刚考上中国人，这对于咱们这些做家长的，是天大的好事，我提议咱们一起敬领导一杯，就当拜个师傅，让领导教教咱们到底该怎么培养才能把孩子送进中国最好的大学里啊！


    他能不喝？


    喝完这一杯，鼓鼓掌，让他讲，都有好为人师的德行，也不例外。


    等他们完，你能没启发？有启发了能不感激？大家都有启发，一起再敬一杯。


    ## 第五章：饭桌上别提你的任何诉求，可以点一点，但是别说全，说了也白说，那什么时候说？


    2019-06-11 23:12:31


    写这个标题的时候，我觉得写的有些武断了。其实你要求上司办的事，是可以在饭局上提的，我只是想说，提的时候不要大声说出来，悄悄附在他耳边悄情还是可以的。


    上司，大多都很多疑且机警，如果你当着饭局上很多人的面，提出你的诉求，即他他喝调了，他也很有可能没有放松警惕心，如果涉及到原则性的诉求，他一般不会把内心真实的想法表露出来。我举例说明：


    比如你想提正科，在饭局上，喝着喝着，你觉得气氛差不多了，直接就说出来了：领导，我在办公室也干了好多年了，您看看能不能提携一下，我想在进步一下，到更高一个平台上继续给领导服务。


    你说这些话的时候，饭桌上的人都听到了。


    你指望领导怎么说，或许，有些不拘小节的领导会拍着胸脯说好好好，小伙子早就该调窝了。这种爱拍胸脯打票领的导的话，我是不太相信的。但是更多的领导，是不会在这种情下给你表什么态的，他大概率会说：这种事情，人部门会统一协调，你安心工作，单位是不会亏待老实人的。我觉得在这种情况下说这种话的领才是成熟的领导，不然就是不成熟的。为什么呢？


    当着这么多人面，你问这种提拔的问题，他如果打了包票，给人的感觉岂不是单位成了他的一言堂，民主呢？党组会呢？这些都不用考虑了吗？万一下子青，饭桌有一些别有用心的人把一些不合时宜的话录下来，弄成一个小风波事件，岂不是要死。


    比如你请上司吃饭，想要上司把那小工程拿给你做，你童言无忌的说出来：领导，那个工程，您看交给我做可以吗？我做过很多这样的工程，有资质，有经验，您放心，绝对做得妥妥当当的。


    上司心里肯定想：真是个二傻子。


    这种事情能在这种场合下公开说吗？如果上司大嘴巴一长：好好好，就交给你做吧。


    那其他人会怎么想这位上司呢？


    有句古话说得非常好，君不密则失臣，臣不密则失身。大概的意思就是说要让自己嘴巴严一点。说什么话要分什么场合，秘密的事，就秘密的说，不要公开说。


    求人办事也是一样的，很多事，都是违背原则的，怎么能当着一帮人说出来呢？尤其是当着一帮喝调的人，万一这些人酒后多言，回家就给老婆或者朋友吐出来，上司岂不是自己给自己找麻烦？如果你欠考虑的当着很多人面请求上司、上司也欠考虑的答应，那这种手泄露出去，日后传到上司耳朵里，你觉得他会反悔吗？当然会！一定会！


    所以说这种事的时候，一定要悄情说。


    但我更建议，饭局结束说。


    比如，饭局结束后，你总不能上司自己回去吧、你要把他送回去吧。


    在回去的路上，你可以向提出你的请求，或者你不说，聪明的上司也会主动问你：今天让你破费了，你一直没说话，但是我知道你有事，你说吧，能办的我就帮你办，不能帮你的，你也多理解。


    这个时候你就可以说出你的诉求。


    诉求说完了，可以听下他的回复。


    你千万不要指望他立即就回复：好，这事我帮你办了。


    这样回复的上司，多半也是过于耿直的生手。


    他多半会说：这个事，我回去研究研究，后面再给你答复吧。或者说：这种事，我说了不算，我帮你留心一下吧。总之，他不会把话说得太死。


    其实无论他是否把话说得太死，都无所谓。你只要确定他能帮你办这个事，就够了。


    因为，这个饭局只能起到这种作用，牵线搭桥的作用。


    剩下的，要继续跟踪，才能落实。


    很多人不知道该怎么做跟踪。我在这里也没办法展开讲，毕竟，这个专栏，我只是讲饭局的。所以我只围绕饭局来展开讲。如何跟踪后者panfu，大家可以参照我曾经写的三个专栏，那三个专栏，可能会教会你其他的一些技巧。


    ## 第六章：攒一个饭局，要请哪些人来促成好事的办成？千万别乱请！


    2019-06-11 23:13:46


    我这个专讲人的饭局的学问，主要讲的是求人办事的饭局。至于其他无关紧要的饭局，大家可以在我讲的这个求人办事的饭局的基础上自由发挥即可。


    很多人求人办事，在攒饭局的时候，想到了要围绕核心领导，请一些相关人士。


    但是对相关人士上考虑不周全，请了认为该请的，其实是不该请的人，这对于事情的办成，是起反作用的。


    我在前面说过，要围绕领导的喜好、需求请他出来，如果他出来了，你只需要把那个他喜好的、需求的人请出来就可以了，多余的人就不需要了。


    很多笨人，自作聪明或者妄自菲薄，觉得自己的分量不够，得找个平级的或者上级的领导陪着。你仔细回想下，是不是你身边经常有这样的笨人会做这种事。


    为什么说蠢呢？


    因为你是求人办事，这种事多半是没办法正规操作的事，这种事本来知道的人越少越好，你却叫来他的同级官僚或者上级领导，他当着同级官僚的面，不能答应你，因为这个同级官僚，日后可能是他的竞争对手，他不能露出破绽；当着他的上级领导，他更不能答应，除非领导力压，或请求。如果领导只是笑眯眯的坐个台，那他在也不会答应，不然领导会觉得自己没有原则，再说了，上级领导来都来了，本来吃个饭该答应的事，现在也不答应了，何不趁机让直接领导亲自讲出这个话，然后自己再卖他一个人情呢？


    所以，在围绕领导请人的时候，不要乱请，无关紧要的人，一个都不请。确保的任何一个人，都能在促进事情办成上起到积极作用。


    我请人吃饭办事，当然是指办大事，一般都会喊一个美女作陪，我觉得每个职场中人，也最好认识一位这样的女人，她聪明伶俐但游离在体制外，这种人喜欢蹭这样的饭局，结交所谓的领导阶层，但是只要你事前嘱咐好，她也不会主次不分，她会好好的把握分寸，既结交了领导，又促进了饭局的活跃、增加了领导的喜悦。


    这就是为什么大家总能在一些饭局上看到这种角色存在的原因。


    你们可别小瞧了这种女人的促进作用，我见过有一些老板请上司吃饭，老板半开口舌粗笨，说句利索的话都费劲，但他能找到会说利索话的可人，他不会敬酒，可人会，可人敬酒，领导端起来喝，他也陪着喝，既活跃了气氛，又让领导觉得他很实在，人家一杯杯的陪着喝，多实在！


    小地方，有很多这样的女人，甚至有一些还在小地方很有名气，我觉得如果你有长远打算，可以和这种女人交朋友，是真交朋友，因为你早晚都会用得着她们。当然，或许你一般会觉得和人家交朋友，人家还不一定卖账，因为平时就穿梭于那些大上司之间，她们的眼界也很高了。


    扯远了，但我觉得扯得很有必要。


    一些年轻人，不善于把这运用好，结果即便是请人吃饭，也只是尴尬的吃请，自己没能力很好的主导饭局，领导不喝满自己也没能力让他端起来，结果呢，草草了事，只是尴尬的请吃了一顿饭。


    老同志，就非常善于也非常喜欢用这一手，为什么呢？


    因为他们屡屡从中得到好处，这个棋子用起来简直太顺手了。


    所以，年轻人也不要顾及什么，人和人之间有时候就是隔层纱，虽然你在单位表现的老老实厚，但上司永远只觉得你是一个老老实厚的下属，进而，他也只会在你面前表现得像一个有风度的领导，其实呢？你未必忠厚，上司也未必是君子。


    老话不是说过吗，什么关系最近？一起同窗、一起扛枪、一起……


    很多情况下，你只有表现的稍微出格一点，领导才觉得自己也没必要端着了，大家都是人，都有同样的欲求，很多人在上司面前自污，你可能心里会想，真蠢，其实我觉得这种人不是蠢，是真聪明。


    有时候，只有你稍微没下限了，没禁忌了，领导才好放下面具。


    比如在ktv里，大家都在酒精的刺激下，搂搂抱抱，跳舞闹闹，只有你，只有你觉得那样做不好，只有你静得碍端坐在座位上，众人都瞅你独醒的那么坐着，那上司也不好放肆，虽然他很想知道。聪明的人这个时候会摸清楚上司在想什么，然后当活跃气氛的催化剂。


    这样，你和上司，就能拉近一些关系了。


    又扯远了，但同样，我觉得扯得很有必要。


    扯回到饭局上也是一样的，不要规规矩矩的像个君子，你既然是君子，为什么还想走这种捷径请上司为自己开绿灯呢？


    姿态放低一点，自尊去有一边去，你觉得在饭局上你该充当小丑的角色了，就去扮演小丑，你觉得气氛很浓烈了，可以适当的再往下限上探一探，那就勇敢的站出去探，我觉得，在人性正常的欲求下，你在饭局上下探的底线越深，对事情的促进越好。

