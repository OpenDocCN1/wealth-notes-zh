    # 第二章：筹办饭局前，你最好考虑到这些细节，越


    2019-06-11 23:07:33


    有一些人求人办事请吃饭，终于把重量级的人请出来了，既然请出来了，那就开整吧！反正咱准备的都是好东西，可劲造吧！


    可惜，你只成功了一步，第二步就失败了。


    虽然一些小细节，可能影响不了大局，但也不一定，有的领导就非常在意这些小细节。毕竟，被人抬习惯了，稍微有一点不如意，他就会觉得自己没得到尊重。


    比如你请的这位领导是回族，你问都没问一句，整了一头小乳猪，还一个劲得为领导多吃点多吃点，非常滑稽！


    比如你请的重要来宾是北方人，主食喜欢吃面食，你问都没问，就安排了米饭。


    比如你请得人，非常注重养生，吃得非常精细，你却点了一堆又一堆大盘菜，他看了就倒胃口。


    等等的。


    所以，这些小细节，你不得不考虑，不然，别人看到传菜生上的那些菜，立即就没食欲了。


    这些小细节，一招就可以化解大部分：那就是在领导应允赴宴时，你多问一句，领导你看菜品上有什么忌讳没有？他说没有。你再追问那咱们是特色菜还是农家乐，想吃特色菜系的，基本上都是没什么忌讳的，想吃农家乐的，大多是图个安静，希望你不要安排在什么高档场所，最好是私密性好的地方，并且，吃农家乐，一般是喜好清淡口味的。


    知道这些信息，基本上就差不错了。


    但是如果你追求完美，想在菜品上安排的天衣无缝，如果有资源，可以问下领导身边人，比如他的秘书或者司机，看看领导平日里有什么特别喜欢吃的，到时候围绕这道菜，多整几个口味。


    我原来有个领导，是山东沂蒙山区的，那边的人非常喜欢吃煎饼。有一次一个老板请他吃饭，菜上到一半，突然传来桌面端出一盘热乎乎的煎饼，领导非常高-兴，一直夸赞：你太有心了，你太有心了。其实，这个老板是知道领导喜欢吃煎饼后，专门让办公室主任在公司逐个问：谁会弄煎饼，有一个在食堂打工的老阿姨会去弄，老板就把老阿姨叫到酒店，提前在酒店里准备弄煎饼的家伙事，准备了大半天，就为了让领导吃上一口刚弄出来的煎饼。


    天下的难事，就怕遇到有心人，难事遇到有心人，大多都会迎刃而解。


    还有一个女领导，人多半百，依然风韵绰约。她有独特的养生经验，就是多吃豆制品，有人请她吃饭，专门在某市场请了一个做豆腐生意的，把他请到农家乐，又弄豆浆、又弄豆腐，豆渣也用来炒菜，晚上的菜品，基本上全部都能找到豆制品的影子。女领导一看，会心一笑。


    各位读者，既然是做局，就请你做全套的、做细致的、做深入人心的、做出心裁的。


    人求人，不容易啊！尤其是先前没有半点交往，没有任何交往基础、感情基础，冒然去求人，是要更多花心思，不然，别人凭什么啊？你一张嘴，人家就来赴宴了，人家吃你几口平时都懒得吃的破菜，就要答应你的狮子大张口，没那么简单，如果通过饭局求人办事，这么容易的话，饭局也不配叫饭局了，就叫吃饭，叫填饱肚子。


    很多读者觉得这TM也太累心了，这才到哪啊！你这不是想走捷径、想赶近道吗？虽然条条大路通罗马，但这些大路又不是你家的，不能你说走哪条就走哪条啊！不付出点代价，能行？


    这你都觉得累心了？其实实实更残酷，大概率事件是即便你付出代价，最终你也得不到你想要的结果，别人还是帮不了你。那你岂不是觉得冤死了？你觉得冤，有人却乐此不疲的去做！尤其是那些会做生意的商人，他们想得开，办不成就办不成，但咱们还是有收获，起码认识了！认识了，还可以继续跟踪，认识了，就还有下文。


    想成大事的，是不会计较这些心力、财力上的投入的，想求人办事的，也不会在乎这些。因为他们都很清楚，如果这个事情行得通，自己能够得到的可不是一点半点，甚至买一百个这样的馆子都绰绰有余。


    第一讲和第二讲，好像讲的都不太多，例子也不多，但好在主旨非常明确，我要的就是效果，我怕自己一展开讲，就让大家找不到重点和主旨了。


    我相信聪明如你们，一定能找到这两章我着重想表达的东西。'
