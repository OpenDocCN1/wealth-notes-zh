  md: '師與投資者者仍無視這些發現，我們不可重蹈覆轍。


    第四部分「市場過度反應：新投資典範」介紹的逆向策略，對這些心理上的癥結與預測失誤有所交代，這些策略禁得起時間考驗，在「失落的千年」表現更佳，在21世紀前十年，續效超越市場和受愛戴的「追捧」股。（報酬因期間二次大崩盤落在低正數，但未血本無歸或嚴重虧本。）逆向投資人在熊市的深淵，仍有相當大的信心堅持下去，我們尤其關注在1996至2000年的網路泡沫，以及2007至2008年的金融危機的情況。鑑於2007至2008年的崩盤，本書做了相應的調整，加入若干投資方針與安全裝置。


    接者會提出投資人過度反應假說（investor overreaction hypothesis, IOH）這個投資人行為的有力假說，來解釋投資人經常錯估投資價值的情況與原因。投資人過度反應假說是說，投資人幾乎總是對中意的股票支付過高的價格，對不青睞的股票，則總是支付過低的價格。投資人過度反應假說目前有12個可檢驗之處，數字可望隨著後續研究而增加。


    第五部分「未來的挑戰與機會」要求看接下來幾年，我們應該對市場有何預期，也會提到投資人為因應所說的高機率情境，需要具備的工具。


    本書對金融界的嶄新全覽，眼光將觸及可能來臨的部分。雖說我們正在脫離「大衰退」，從通膨中脫身的時日遠早。前瞻眼光的投資人，最好對將來隨時會席捲而來的金融議題有備以待，高瞻遠矚。


    最重要的情境是2至5年內，不光是美國，全球各地都很有可能出現嚴重通膨。我們會思考在通膨環境中，可望保本甚至換發興盛的最佳投資。我們也會檢視其他面對相似通膨挑戰的國家的投資人用以安度及成功的方法。


