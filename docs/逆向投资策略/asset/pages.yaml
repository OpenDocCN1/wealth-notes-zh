  md: '之，它們會在意外季度之後，持續表現得比市場還要優異。


    我們已經看到，用三大價值評估指標劃分的高、低、中三組股票，在發生盈餘意外時，各自反應不同。但就像天氣一樣，並不是所有日子都會放晴，也不會每天都只有好消息。負面意外再怎麼令投資人脊背發涼，免不得也要翻過來檢視一番。


    # 負面意外之效應


