  md: '效應。


    這項研究發現對於理解正面或負面盈餘預估意外外，以及其他正面或負面市場事件帶來的過度反應很有用。舉例來說，2010年春季英國石油公司（BP）鑽油平台爆炸造成重大漏油事故後，石油探勘開發業者的股價一落千丈，因為大家當時覺得墨西哥灣甚至其他美國內陸水域，很長一段時間都不會再開放深鑽了，另外，當時還覺得清理成本會壓垮英國石油公司與其商業夥伴。結果不到一年，美國沿岸就重新開放深海鑽井，這起事故的代價雖然高昂，各家公司仍負擔得起，有些大家覺得受創最深的股票，一年內股價漲了不只一倍。


    這項發現有助於解釋接下來第三和第四部分要介紹的「最糟」相對「最佳」股票的優越績效，以及這兩種股票對意外事件一致卻相反的反應。


    # 4. 時間性構念


    情感讓我們做出時間性的誤判。較近期發生的事件，會以更具體明確的細節來呈現，短期事件包括銷售和盈餘結果，高於或低於預估値等各種分析師報告的數字。¹⁶ 同時，事件發生在越遠的未來，傾向以若干抽象或一般特徵的方式表現，像是對標的股概念的感想，這現象稱為「時間性構念」。不管是不是被追捧的股票，這個情感特徵都會造成投資人把股票有希望的看法，延伸到遙遠的未來。若未來沒希望，結果則顛倒過來。


    情感有修勻長期希望的效果，比起盯著多起短期事件，其中多數正面，有些負面，比起根據短期事件，專注在長期前景的概念，更容易得出中意的預測。


    一檔股票、一個產業甚至大盤的價位，可能因強烈的正面或負面情感之故而過高或過低。特羅普（Trope）和李柏曼（Liberman）教授指出，這個情感特徵或許能解釋為什麼人對長期報酬抱持很樂觀的態度。'
