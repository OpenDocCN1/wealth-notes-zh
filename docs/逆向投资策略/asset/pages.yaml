    評等機構靠這些服務就能錢滾錢。穆迪光是住宅房貸擔保證券和抵押債務債券評等，2002 年就進帳 6,100 萬美元，2006 年則成長到 2.08 億美元以上。從
    1998 至 2007 年，穆迪靠著複雜金融工具評等，收益成長 523%。 29標準普爾在評核服務的收入則從 2002 年的 5.17 億美元，翻倍成長到
    2007 年的 11.6 億美元。在 2002 至 2007 年間，標準普爾的結構融資收入成長達 3 倍之多，從 2002 年的 1.84 億美元成長到 2007
    年 5.61 億美元，其中有很大一部分來自抵押債務債券。


    耐人尋味的是，這場自大蕭條以來最嚴重的金融海嘯，是幾千支擁有 AAA 評等的次貸商品所形成的骨牌效應，在市場崩潰之後，標準普爾在 2011 年 8 月 30
    日竟然還發出 AAA 評等給另家次貸業者。而幾個月前，它才剛調降美國國券評等。


    信用評等機構在 2000 至 2007 年間的股價平均上漲了 3 倍或 4 倍，其中穆迪股價爆漲 6 倍多。但這一切是有代價的，就像浮士德（Faustus）一樣，評級機構也把自己的靈魂賣給了魔鬼。


    銀行和投資銀行家坐擁了住宅房貸擔保證券這個欣欣向榮的龐大市場，他知道如果能好好分割成不同的商品，便能從客戶那獲取巨額的承銷利潤，這裡頭有著無抵押債券或其他證券產品上所沒有
    的高收益、高評等，任客戶也求之不得。所以，銀行家們在前幾年找到解決方法：壓低 AAA、AA 和 A 評等產品的品質，但維持高投資評等。這對買方來說很重要，因為當中有很多人按照法規只能購買投資等級證券。


    這套解決方法和問題酒吧所用伎倆沒什麼兩樣，酒吧把格蘭菲迪


