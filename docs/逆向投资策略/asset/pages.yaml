  md: '實情是你所看到的，還有更多不為人知的低落投資績效是基於縝密的研究。1970年代初有個基金經理人大徹大悟道：「你找市場上最棒的那家〔研究機構〕，又找了第二棒的那家，這些業者都大名鼎鼎，功力高深，可是客戶下場慘兮兮。」<sup>19</sup>至今也沒有多少改變。


    以下是一則適用所有領域的投資心法：


    操作心理導航7：對處理大量資訊的難度感到敬畏，能成功運用自如的人很少。坐擁資訊不等於坐擁獲利。


    希望大家對組態關係的高深心知肚明。股市投資人應付的不只是24或48組，而是數目異常龐大的交互作用，但實情是，不用多少就能讓專家的組態判斷乘載不下。大多數的投資專家，不知道這些心理學研究，才以為只要能拿到多一點資料，就能順利搞定，結果資訊超載，思考也沒得到好處，只是變得更自信滿滿，更容易鑄下大錯而已，遺憾的是投資人和效率市場假說追隨者對於組態推理的困難之處沒什麼底。


    # 當過度自信來敲門


    過度自信的現象似乎既是情感也是認知偏誤，也就是說，人類心智可能本來就會從任何可用之處盡可能多擷取資訊，正如我們在第3章看到的那樣，過濾的動作尤其量是被動的過程，為真實世界提供一個良好的代表罷了。另一方面，我們還會主動剔除「注意力以外」的資訊，<sup>20</sup>可以說，在不確定的情況下，我們僅仰賴一小部分需要的內容，就想建立準確的預測。


    評估股票就是這樣。焦慮和不確定性，加上局部資訊的龐雜交互作用，讓投資人像是置身於一個巨大的羅夏克（Rorschach）測驗中，投資人會看到自己想看到的任何模式；尤有甚者，近來組態處理的研究顯示，投資人會看到不存在的模式，稱為「錯覺相關」。'
