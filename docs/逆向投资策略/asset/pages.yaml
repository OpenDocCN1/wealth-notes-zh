  md: '能的任務，這也是第 2 章說基金經理人和分析師的長期績效多半不怎麼樣，真的能長期打敗大盤者可說鳳毛麟角的重要原因。儘管學經歷豐富、坐擁豐富的企業資源，要在這種情況下做決策，情感和捷思顯然能派上用場。（如果仔細研讀投資建議報告，可看出字裡行間透露的情感與認知捷思。）


    市場資訊過量是必然的，對於這情況我們只能接受，但第四部分會介紹克服負面效果的方法。現在，讓我們來看看大腦在處理其他捷思偏誤時出錯的其他幾種方式。


    # 認知算數


    代表性還會引起一個嚴重的認知失誤，就是人會直覺以為接受的資訊跟產生的結果之間應該緊密相關，舉例來說，認為銷售成長強勁的公司（接受的資訊），獲利跟毛利率所當然要上漲（產生的結果），或者認為接受的資訊變動少，預測能力就會比較好；研究顯示，人們認為拿過兩個
    B 的學生，比拿一個 A 一個 C 的學生，最終成績更可能是 B，但統計上這並不成立。 ${}^{39}$ 在股市的情況，每年規律成長 $10\%$ 的公司，比同期間年成長
    $15\%$，但各年成長率起伏較大，比如第一年 $18\%$，接著 $3\%$、$15\%$……的公司，更讓投資人感到安心。 ${}^{40}$


    這個現象的直接應用是投資人將好股票與價格上漲、爛股票與價格下跌畫上等號。令分析師、基金經理人和股票經紀人常常百思不解的問題像是：「這檔股票這麼好，怎麼還不漲上去？」或「逆勢操作這麼神，現在怎麼很難用？」答案是價值（接受的資訊）往往在一段時間內未能反映於價格（產生的結果），而逆勢操作幾十年來績效勝過大盤，不等於一年或幾年間不會輸給大盤。回想均數迴歸的現象，即使不正確，投資人經常想要立刻看到結果，結果反而犯錯。


