    市場上另一大門派，技術分析派當然不買單這樣的說法，他們明明就是靠預料股價走勢討生活的不是嗎。技術分析的範圍很廣，包括許多技巧，但都是基於行家高手可從過去的價格資訊與交易量看出市場後續走勢的前提。比起偏重公司盈餘、財務面和營運前景的基本面分析，技術分析試圖只憑鑽研市場數據預測股價。


    這群市場老手只能聽著振振有辭的學界人士說：你們的方法其實没用，若學界是對的，意謂不該沿用技術分析。


    兩派衝突一觸即發。技術分析派不是省油的燈，舉凡圖表形式到壓力支撐，多半都身懷多種價量絕技，並視情況判斷如何派上用場，大展身手，而且隨著電腦的發展，在線圖、統計、回溯分析等方面都進化了。


