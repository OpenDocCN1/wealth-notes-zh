  md: '逆向操作法吃驚，有時甚至更長，就像 1996 至 2000 年初那樣。但是把時間拉長的話，沒人是它的對手。低本益比策略在 2000 和 2001 年急起直追，強勢壓過過去
    10 年的表現。人性本如此，我們的期望大多數時候總是太高。


    每個人都可以操作逆向策略嗎？我相信我們曾探討的潛在心理現象一直存在，而我也認為大多數人都贊同人類行為不太會改變。但態度會變，尤其那些挑動人心的股票所帶來的市場變化，再再改變人們的想法。對於很多人來說，就算知道得再多，別人都在享受按摩浴缸時，沖個冷水澡反倒變得不容易了。


    要低估情感、神經心理學和其他心理因素對我們決策的影響力，幾乎不太可能。我就算身為精通新心理學又訓練有素的專業投資人也無法不受影響，更遑論其他人。像大多數人一樣，我的熱切、沮喪和恐懼如影隨形，但是更多的時候是享受來自知識的幫助。這點沒什麼好掩飾。


    甚至於在看到逆向策略數十年來不論牛熊市都表現得如此優異時，我們仍然對於它沒有年致勝而感到失望。任何投資策略要永遠坐在成功寶座的可能性極低，就像你在 21 點中連贏
