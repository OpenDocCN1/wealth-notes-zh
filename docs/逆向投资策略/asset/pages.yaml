  md: '從研究可知，突顯性及新近效應的下意識影響力，絕對不是空穴來風。無論世人是否已經淡忘 1996 至 2000 年網絡泡沫的毀滅，市場上都已經正在醞釀新一波的首次公開發股泡沫，發展可想而知。以下是另一則投資心法：


