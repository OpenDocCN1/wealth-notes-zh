  md: '烈的金融海嘯之所以會爆發的前因後果。¹


    社會大眾仍然十分擔憂金融紆困以及金融海嘯帶來的高失業率。由於數百萬人被趕出自己的家，不滿的情緒持續發酵。讓很多美國人忿忿不平的是，這場金融海嘯的作惡之徒沒人被判處監獄服刑，最高被罰1億美元就輕鬆脫身了。最後也可能最為嚴峻的打擊是，那些使美國經濟幾乎崩潰的金融高官還有7位數和8位數的獎勵。茶黨（Tea
    Party）崛起（譯註：茶黨是2009年由小型地方團體組成的組織，以1773年波士頓反抗英國課徵茶葉稅的理念凝聚而成的草根性政治運動），以及美國共和黨在2010年11月期中選舉横扫了眾議院，顯見選民對於建設性改革和創造就業機會之拖沓有多么不滿。然而，大眾輿論的意見是否接近事實真相，還是背離了事實？


    三個兩黨國會委員會（說來怪哉，都是跨黨派的）從數十萬封電子郵件取證並獲得大量證詞。聯準會和美國財政部則在聽證會之前，對於接受紆困的銀行和投資銀行家並未多作解釋。我們今天是因為國會委員會全面徹底調查，才得以窺知一二。


    我們知道的實情有時真的讓人瞠目結舌。銀行家們把投資大眾騙得團團轉，他們的貪婪可謂空前絕後、無人能敵。是的，國會已采取措施防止某些蠢事再發生，但病灶未除問題仍在。為了防微杜漸糾出成因，讓我們快速了解一下實情。


    首先來看看聯準會在現任與前任主席任職期間的角色，以及前兩任和現任政府高官的角色，然後再檢視銀行、投資銀行和其他主要參與者。沒有哪一方可以在這場金融海嘯或大衰退中單獨卸責。如我們大多數人所知，這場風暴是許多因素匯聚而成，幾近無懈可擊。許多人並不知道無能失職、錯誤的意識型態、鮮為人知的特殊利益集團間周扮演的角色，以及集體貪婪的力量有多巨大，而這些無一不是這場風暴的關鍵因素。


    這些沉痾該怎麼解決當然不在本書的討論範圍之內，但了解其所造成的隱患，將有助於投資人了解這些無可迴避的問題。'
