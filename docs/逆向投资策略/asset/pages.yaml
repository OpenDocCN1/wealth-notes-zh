    # ### 小結


    上列研究的一致性真的不容小覷。那些前景看好的股票，在相同衡量條件之下，幾乎在所有評估時期都表現得比逆向投資股要差得多。這引出了另一則投資心法：


    操作心理導航 22：買進目前不被市場看俏的穩健公司，以他們的低本益比、低本股價現金流量比、低股價淨值比，或高殖利率為評估指標。


    你可能心想：倘若這些策略效果很好，為什麼沒見到大家都在用呢？這就要好好聊聊投資心理學領域（或是經濟學家現在所稱的行為財務學）。


    儘管統計數據使我們向價值型陣營靠攏，但情緒肯定會把我们拉向另一邊。人們容易被刺激又新奇的概念吸引。正如第 2 章提過的，究極一時的新點子誘惑我們要轟出全壘打，蓋過了謹慎為上的心理。首次公開募股的光鮮亮麗總讓人眼睛一亮，例如專業人士版的臉書（Facebook）：領英（LinkedIn），2011
    年 5 月以 45 美元發行，發行當天就暴衝到 122.7 美元，本益比倍數高達 548，而股價淨值倍倍數達 134；又如美國 3D 設備公司 RealD
    的交易價，在 2011 年 5 月底時本益比倍數來到了 170，實在是太過分。$ ^{17} $


    即便這些是投資人評估失控的極端例子，但它們說明價值型策略為什麼多年來始終奏效。人們願為酷炫概念付出代價，無論是領英或 RealD 這類荒'
