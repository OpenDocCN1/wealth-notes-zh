    # 胡亂預測之九：心理影響決定


    上一章介紹，除了股市之外，不少領域的專家預測也準不到哪去。市場上，分析師可以靠著一台筆電，分析報表、查股價、收訊息、搜尋資料庫，資料統整功能突飛猛進，一個摩根士丹利分析師表示，從公司訂閱的49個資料庫找出有用的資料，就像在大海撈針，「手上資料越多，到手的資訊越少」。²⁹他這種念頭是合乎心理學的。資訊增加不會提高準確性，很多認知心理學的研究指出，人為判斷出錯往往是可預見的結果。過度自信在分析師身上也不少見；人在不確定的情況下，普遍會對手上可用的資訊表現出過度自信，而且常與事實不相符，以為自己是對的。


    這些研究發現適用不少領域。一項經典的認知心理研究發現，無法預測哪個心理學家會做出良好的診斷，此外也沒有可以持續用來改進判斷的固定預測模式，研究結論是，只能靠檢視長期的紀錄來分辨診斷能力。


    研究者也發現，人即使明知「中獎率」不高，還是會對自己的答案抱持高度信心，稱之為「效度的錯覺」（illusion of validity），³⁰在前面也有稍微提到，這有助於解釋分析師獨排眾議，鐵口直斷的現象。人們會憑著不完整、不可靠的資料，做出自信滿滿的預測，以下是給股市預報員的啟示。'
