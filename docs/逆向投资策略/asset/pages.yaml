    # 萬全的策略


    這些教授和交易員不是很關注槓桿或流動性，畢竟唯一的風險來源波動性，已經完全受到掌控，著實沒必要那麼在乎槓桿或流動性。對波動性念茲在茲，加上深信波動性就是風險，槓桿或流動性不過是孤掌難鳴、無關大局的風險因素，連在長期資本管理公司用的效率市場假說派流式當標貼符號的資格都沒有。


    長期資本管理公司的學者和經理人最常掛在嘴邊的問題是：多少波動率能讓報酬極大？答覆通常是可以再高，加不了多少風險。將槓桿從20比1提高到30比1，同時認為波動率還有加碼的空間。


    幸運之神持續眷顧著長期資本管理公司。1994年長期資本管理公司賺了20%，1995年淨報酬率高達43%，1996年春季，長期資本管理公司管理的資產來到1,400億美元，資本膨脹3倍來到36億美元，開張不過2年，資產竟超越了雷曼兄弟和摩根士丹利，直追業界龍頭所羅門兄弟（Salomon
    Brothers）。1996年，長期資本管理公司費用後報酬率高達41%，賺進21億美元，將迪士尼（ Walt Disney）、麥當勞（McDonald’s）、美國運通（American
    Express）等優質成長股拋在腦後。


    但有些方面可能讓人捏一把冷汗。1996年初，長期資本管理公司的槓桿已高達30比1，市場漲的時候，槓桿是好事，例如1929和1987年崩盤之前，不過等到市場走跌，槓桿變成毒藥。槓桿高達30比1，意謂市值虧損3.3%，就會虧光資本，而且，長期資本管理公司的總資產報酬率其實不到2.5%，若把數千億的龐大衍生工具部位算進來，甚至可能不到1%，<sup>10</sup>當時90天國庫券殖利率就有4.5%了，是長期資本管理公司總資產報酬率的4.5倍，何況長期資本管理公司的報酬還是槓桿的功勞。


    1997年中亞洲經濟開始出問題，柬埔寨開了第一槍，接著是菲律賓、'
