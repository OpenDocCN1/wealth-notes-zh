  md: '# 你該怎麼辦？


    如果我沒說錯，高頻交易有很多手段可以傷到你。最慘烈的當然是其所造成的市場大崩潰。但這不該是你退出市場的理由。首先，監管機關對於這個問題不會坐以待斃，正緩慢推進相關措施。最壞的情況，是他們耗太久而市場解體了。在這種情況下，如果這些事件的緣由廣為人知，我認為市場會像1987年股市崩盤後一樣反彈，並迅速回升。


    但是，你仍然可以在過渡期間採取一些避免「流血」的措施。高頻交易商可以從他們製造的市場恐慌中大賺一筆，儘管他們發起毒誓否認。既然如此，為了避免這種情況，切勿下止損單，或是以市價執行賣單。反之，全下限价單，限制券商可以賣出的價格。如此一來，你的股票、衍生性商品或期貨合約將不會在市場狂跌時被賣出。直到問題解決前，都不要使用止損單，否則你可能就虧大了。止損單在過去是可行的，但在這些情況下，高頻交易會讓它們變得像賭俄羅斯輪盤一樣毫無勝算。


    # 波動性的旋風


    高頻交易掀起巨幅波動，而它有時還只是在我們所處的異世界裡的威脅之一。除了這個，有另一種威脅可能會掀起更劇烈的波動。在6月份，波動率曾創下3年以來的低點，但隨著價格急劇變化、重大金融或經濟事件，波動率有可能急轉彎，並持續劇烈震盪。在2008年秋天，恐懼像森林野火一樣越演越烈、四處蔓燒。一些投資人為了保護手中的績優股而買入賣權，這使他們有權在市場下跌股價壓低時以履約價賣出股票。在波動性處於高點時，這樣操作的成本可能會非常高，權利金有時會在90至100天內上漲到本金的20%至25%。1年內，如果賣權的權利金保持相對不變，每年成本會增加到80%至85%。以一些規模較小的發行商來說，選擇權價格的年化成長率'
