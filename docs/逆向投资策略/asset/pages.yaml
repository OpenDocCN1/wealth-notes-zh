  md: '我發現立即放下羈絆、向前邁步，方為減損上策。


    總結就是：不固執、不貪婪，也不害怕承擔小損失。最重要的是，當你買入股票時，對於你未來的賣出價，心裡要先有定見，而且要堅守這個決定。你可能會在高點失掉幾分，但從長遠來看，獲得遠大於損失。


    賣出策略若採用折衷法可能會引發另一個問題。假設你的投資組合中有30至40支股票，而你也找到另一支更優秀的新股，也就是說以我們的反向式指標來看，其逆向投資比率比我們現有的股票還低。那麼，換股是可行的，但要記住投資組合中的股票要保持固定數量的原則：每買入一支，就要賣出一支。由於你在換股時會納入更多主觀判斷，出錯的機會也會更高，因此要盡量減少這類調整，以免過度交易。抑或者，就像賭馬人士喜歡說的那樣：「離開鬥遠一點。」


    我多年來一直遵循的補充原則是，股票若一直保持高本益比倍數，絕不因為盈餘一時下降就賣出，因為這種下降可能是因為一次性費用支出，或者商業環境臨時有變所致。自2007至2008年市場崩盤以來，我一直在推敲這項原則，也修正了我的想法。除非你確定這是一次性支出，也不會再發生，否則立即賣出是較明智的做法。這場崩盤給我們的警惕是，一次性支出往往變本加厲，帶出一連串的支出。「一次性支出」壓垮金融業，並傷害許多價值型基金管理人的客戶，這也包括了我的客戶。如果你真的很愛這支股票，請在公司恢復其盈利能力時再買回。這些反思讓我想起，在選擇低本益比投資組合時，我們的電腦模擬結果總是會拋下那些在某個季度無盈餘的股票。一如我們現在正說的重新評估。


    在檢視完新一系列的重大風險和機會點之後，我們現在要轉而討論一個迫切需要關注的主題：以一種更好的風險理論，代替當今被廣泛使用卻已經破產的理論。'
