  md: '之前誤信分析師推薦而慘賠的退休族。


    事過境遷，到了2000年代中旬，世人又完全恢復了對分析師預測盈餘的信心。用不著說，《機構投資人》從全國逾1.5萬名分析師中選拔出來的「菁英」，無一不是選股高手。


    不是嗎？


    《金融世界》(Financial World) 幾年前追查分析師的表現，${ }^{3}$ 為文指出：「這是件大工程，多數券商不太願意釋出旗下明星選手的打擊率。」${
    }^{4}$ 很多時候要從外部來源才能拿到，像是「心不甘情不願」的客戶。數個月的深入調查後，這本雜誌刊載了20位明星分析師的建議，結論說：「真金罕見。市場在調查的期間上漲14.1%，如果你有遵照建議買賣132檔股票，您的報酬是9.3%。」不過落後擲硬幣選股34%。雜誌補充說：「在明星分析師推薦的132檔股票中，只有42檔，也就是三分之一打敗了標普500。」一位大型機構買方總結說：「行情大好時，分析師……在錯的時候大膽，也在錯的時候小心，這些人說一套做一套並不稀奇。」${
    }^{5}$


    仰賴I/B/E/S、Zacks、Investment Research、First Call等盈餘預測服務機構的，除了明星分析師，還有專業投資人。有線上功能的First
    Call提供即時預測更動，讓基金業者和分析師，立即取得所有分析師發布的數據，報告有很多是追蹤預測更動，涵蓋的企業逾千家。


    近年來，精準盈餘預測的需求有增無減，跟分析師的預測差一點，就可能讓一檔股票大跌，反之，財報數字優於預期，股價就會跟著大漲一段。這些預測值好不好？從《機構投資人》選拔脫穎而出的全明星們的表現來看，我們知道乏善可陳。但這畢竟只看1年的期間，風水總會輪流轉，會不會只是一時失足或僥倖？還是其實這表示有某種黑天鵝？答案對後面要介紹的投資策略很重要。'
