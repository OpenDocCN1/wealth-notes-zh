  md: '在人人追捧、媒體吹捧時跟風買入。就像國內那些熱門的首次公開發行股和概念股一樣，我們都知道，價格過度狂飆之後的後遺症，無可避免就像徹夜狂歡的宿醉一樣折騰。


    最後，我們要用逆向策略來解決一個最棘手的問題，這問題對於其他策略來說同樣棘手：你何時該出場持股？


    # 何時該賣？


    無論你使用哪種策略，最困難的決定之一就是何時賣出。投資人面對這個問題，各有各的答案，但即使在專業人士中，也很少有人奉行自己的賣出規則。大多數的賣出決策會受到心理力量的誤導，其結果往往是奇慘無比。我見過許多基金經理人設定極為嚴格的目標價格，而我自己在早年也是這樣。但是當股票迅速向這個預設價格移動時，利多消息通常就會紛至沓來，把價格拉高。


    假設股票最初是在20美元的價格買入，賣出目標價為40美元，當它一路衝到40美元，經理人常常會依此調高賣出價位。40美元會變成50美元；50美元再變成60美元。如此一來，經理人常會陷入周而復始的迴圈：搭上名為股價的雲霄飛車，一路向上爬，再一路向下衝。


    正因為我們知道會這樣，最安全的方法似乎還是機械式的指導原則，這些原則能大量濾除決策過程中的情緒成分。我通常會使用的規則就是以下這道投資心法。


    操作心理導航27：在本益比（或其他逆向投資指標）接近整體市場的水準時賣出股票，不管它多有前景，都要換成另一支反向式股票。


    舉例來說，假定我們使用低本益比策略，而市場平均本益比是16倍。我們手上有支股票〔比方是雪佛龍（Chevron）〕買入時的本益比是10倍，'
