  md: '種指數為準的基金，例如標普 500 或羅素 2000（Russell 2000）。*學界甚至開始擔心，要是經理人和分析師因為績效沒辦法比較好的事實而找不到工作，說不定會讓市場失去效率，畢竟效率市場假說也說，基金經理人和分析師對維持市場效率有用，要一下子少掉太多這類人士，反而有礙市場效率。投資圈大概覺得聽起來很嚇人，好在從結果來說，真的聽聽就好。本章和下一章會解釋效率市場假說其實就像地基不穩固的房子，並破解理論上看似牢固的統計證明，這些研究工具要嘛言過其實，要嘛就是流於研究人員對正反數據的偏廢取捨。


