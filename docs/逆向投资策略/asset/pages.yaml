  md: '# 胡亂預測之四：產業預測


    「也許其中有什麼隱情」，有些人可能辯解說：「分析師也許整體而言估計不準，但這是因為很多產業波動性太高，本來就不可能估得準的關係，要預估就要挑穩定、持續成長、必然會增值的產業。」


    聽起來好像有道理，但用電腦跑跑看資料很快就分曉。我們將前面提到的預測共識資料分成24個產業群組，*結果如表8-1所示，雖說產業的誤差的確小於預測個別企業的情況，但仍是放寬標準5%的6倍，平均誤差是28%，中位數誤差則是26%。我們也發現在整個樣本期間，幾乎有40%的產業，分析師預測誤差1年大於30%，約10%的產業甚至高於40%。


    如表所示，分析師在各產業都出現預測誤差。電腦或製藥這種前景清楚、或未來「能見度」高的產業，跟汽車或原料這類前景不明朗的產業，誤差的情況半斤八兩，以下是我們據此做出的投資心法：


    > 操作心理導航12：沒有哪個產業的可預測性，高到足以讓你採信分析師的預測，依賴這樣的預測會出事情。


    高成長、能見度高的產業，並沒有比較小的誤差。分析師在能見度高的產業老是估不準，而且給較高的評價這件事，表示這種產業經常被高估。


    最後要來看，分析師的預測在行情大好或衰退時期會比較不準嗎？畢竟照理說，估算這種時期的盈餘難度比較高。這會是拖累分析師預測表現的原因嗎？'
