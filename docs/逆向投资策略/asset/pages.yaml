  md: '這情況不僅發生在效率市場假說研究，許多數理經濟學的領域都是如此。研究者對統計分析吹毛求疵，對更大的問題則輕輕帶過。我們在證明市場效率的研究中確實看到如此情況，論文檢視淺而易見的市场衝擊事件，做出來的結果充其量是「擦邊球」，卻被研究者視為「紅中直球」，並得出廣泛的結論。如果市場有料到相對簡單的合併或增資發行消息，以此類推，想必有能力彙整並正確理解複雜的企業、產業、經濟、貨幣、金融和市場大環境的資料。56


    不得不佩服這些學者憑著站不住腳的證據，要建立通盤理論的膽量。從這些簡單的發現，到做出市場正確無誤而且幾乎立即理解所有資訊的結論，中間何止需要三級跳，更別說像在泡沫或恐慌期間，資訊可能極為複雜。這情況像是說，我女兒在6歲時，若能從1數到100的話，應該也能讀懂相對論，雖說要是當時真的問她，她可能真的會去讀，但在讀什麼就是另一回事了。


    可惜一旦加以檢驗，效率市場假說的學說可說節節敗退，沒有哪個學界信誓旦旦，要放諸理性投資人均準的風險測量值，經得起時間的考驗。我們像在為財務學發明本輪，風險報酬的典範必須存在，否則效率市場假說不就走上托勒密地心說的後塵，風行一時，但到頭來還是遭到眾人拋棄。


    我們也探討了三個效率市場假說的關鍵假設，*結果發現這些假設所謂的「證明」薄弱且有誤，在強有力的效率假說反證據面前，皆不足採信。


    最後之前已說過，效率市場假說假設投資人能理解龐大數據這件事有重大的問題。認知心理學和其他心理學科的研究發現，這個假設並不正確。用西洋棋來比喻的話，成千上萬個下棋民眾當中，只會出現一撮大師級棋士，跟唯一一位棋王；解讀棋局時都不能一視同仁了，換到更複雜、更情緒


    * 投資人打敗市場只是一時、市場能快速準確回應新資訊，以及投資人會讓價格落在理當如此的水準。'
