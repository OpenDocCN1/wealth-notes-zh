  md: '所有流入「最佳」股票推動資本擴張的錢，並沒有反映出卓絕群倫的績效，反倒是那些時運不濟沒人要理的股票躍居一線。低本益比股票有左右來攻的優勢：殖利率較高和增值幅度較大，這在傳統思路下是不應該發生的事。


