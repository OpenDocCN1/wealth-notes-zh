  md: '事人這個不幸的消息時，研究主管匆匆忙忙趕來阻止說：「等一下，他剛入選明星隊二軍了。」


    這批人的「薪情」可想而知非常好。有經驗的分析師年薪落在70萬至80萬美元之間，闖出名號的當然不只，上面還有若干華爾街神人組成的年薪百萬美元俱樂部，從收入來看，這批人跟職業球員、大明星是同一個等級。


    有些分析師年薪上看千萬美元，比《財星》500大企業的執行長還高。1990年代中期，資通分析師傑克．格魯布曼（Jack Grubman）從PaineWebber跳槽到所羅門兄弟的代價是年薪250萬美元，同行眼紅之餘，便以250萬美元為一個「格魯布曼」單位，來戲稱這家券商的案子規模。不用說，就像青少年夢想當搖滾樂手或冒險英雄，這樣的頂級分析師受到業界新進人士崇拜。


    2002年網路泡沫破滅後，美國證券交易委員會和州當局著手對大咖分析師進行調查，讓這股英雄崇拜的氛圍消退了一陣子。2003年4月底美國證券交易委員會和紐約州主管機關發布上千份文件，指出投資界的既有規則已遭打破，照理說要區隔銀行插手證券分析師工作的「中國牆」倒塌了。儘管調查的重點放在二個大人物，也就是所羅門美邦（Salomon
    Smith Barney）*的格魯布曼和美林證券（Merrill Lynch）的亨利．布羅吉特（Henry Blodget）身上，很快有數十位分析師牽連進來。電子郵件等文件顯示，許多分析師遭施壓，為體質糟糕的企業做出有利評等，其中好些是連營運計畫、營收，或堪用平台都付之闕如的網路企業。1990年代末期的網路泡沫期間，承銷首次公開募股案件是一門暴利生意，服務大法人客戶的壓力遠高於散戶，加上為了賺進投資銀行的大把首次公開募股案件手續續，分析師於是自欺欺人，表面上恭維虛胖的企業，給它們買進或強力買進的評等，私底下在電子郵件


    * 現在隸屬花旗集團。'
