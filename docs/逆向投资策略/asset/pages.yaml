  md: '狂的例子，像是煉金術和將女巫與巫師綁在火刑柱上燒死。他說：「我們發現，整個社群突然專注在一個對象，瘋狂地追求；上百萬人同時懷有一個妄想，緊追不捨……清醒的國人突然淪為爛賭之人，為了一張開牌幾乎豁出一切……有道是，眾人皆醉……眾人皆瘋，要回過神卻是遲緩、一個接一個地。」⁴麥凱反覆觀察到，當投機狂潮到了末路，泡破戳破時，群眾的恐慌之情，一如當初的陶醉，一股腦拋售，顧不得什麼投資告誡或理性；市場崩盤時，投資客驚慌失措，如同買時不管基本面價值。⁵麥凱與後來的作家掌握到了投機熱潮與恐慌箇中三味。


    麥凱之後，法國社會心理學家、社會學家和業餘物理學家古斯塔夫·勒龐（Gustave Le Bon）寫下《烏合之眾》（*The Crowd: A Study of
    the Popular Mind*）一書，在1896年以英文出版，這本書出色地掌握到麥凱描述的群眾行動與情緒。勒龐寫道：「集會中所有人的情緒與想法都指向同一個方向……一個集體心智形成了……表現出非常分明的特徵。集會於是化為……一個群眾心理。」⁶


    群眾無法區分虛實是勒龐注意到的一個非常突出的特徵：「群眾心中有個印象，這印象就會立即聯想到一連串的其他印象，但看不出與一開始的合理關聯性……被印象打動就當真，但明明大多與事實的觀察關係遙遠……只憑印象的群眾，也只容得下印象。」⁷


    群眾的印象之中，沒有哪個比一夕致富更有魅力；運氣好的話，幾天或幾個月內就能到手照理說要打拚一輩子累積的財富的念頭，誰能抗拒？想想2000年代初期買房的投資客身上根本還不起的大筆房貸，麥凱與勒龐所做的觀察，無疑遠超乎時代，不過他們那時無法取得深入解釋群眾為何遭非理性浪潮席捲的研究。'
