  md: '唐的情形，還是眼下價格喊得過高的時髦產業都是如此。投資人肯定不想和那些前景看似暗淡的公司沾上邊。


    另一方面，熱門股展現的是錢可以買得到的宣傳。想當然怎麼會有人想推薦低調不砸錢的逆向操作呢？這種錯誤心理可說是一面倒。當然，也有好股票的本益比倍數很小是合理的。但是，事實證明，真正的「最佳」股票數量稀少，不太可能被大家一眼識出。


    逆向投資策略之所以成功，是因為投資人不知道自己在預測時的侷限性。只要投資人自認為能鐵口直斷熱門股和冷門股的前景，你就應該能以逆向投資策略獲得很好的回報。人性使然，這種優勢還會持續好幾年，除非我們這種大反骨一下子吸進幾百萬的新讀者。（我敢肯定我和出版社都樂見其成。）


    我們已經看到了多年來逆向投資策略的表現如何。好消息是，這一波關於全新心理學和逆向投資策略的發現還算協調一致。這與效率市場假說和現代投資組合理論那一波發現形成了強烈對比，當時是心理學揭露了它們的基本假設。多年來股票績效的研究數據提供了有力證據，證實要跑贏市場的確是有穩操勝算的方法。接下來，我們將進一步解釋，要怎麼運用這些策略在日益艱困的市場環境中生存下來，並提高我們的投資報酬率。'
