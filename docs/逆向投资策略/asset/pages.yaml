  md: '我們也會探討效率市場的好搭檔：風險分析，即想要賺取高報酬，就要承擔高風險（波動率）的說法。較低的波動率帶來較低的報酬率，但這項多年來聽說會讓你的儲蓄高枕無憂的投資組合基本保障沒用也從未有效。我們會看到今日所用的風險評估方法敗下陣來，投資人數十年來所仰賴以保障投資組合的風險理論，是建構在似是而非的推論之上。我們今天並沒有一個護身的管用風險理論，將近40年來也沒有過，難怪落入熊市後續效表現會那麼不堪。我們會詳述這套風險理論是1987年以來三次大崩盤的禍首，解釋背後的原因，來看更好又管用，立論完善，納入許多今日面臨到的重要風險因子的新風險理論，以及若干投資教育尚未引進但可能有害的新理論。


    我們會直視若干的無情教訓。例如，2008年那時，系統的流動性完全枯竭，只有部分回流；美國60%的新工作出自100人以下的雇主之手，但坐收上兆元由納稅人（直接或間接）支付的紓困款項的銀行，卻拒絕借錢給這類創造工作的企業，縱使爛頭寸過剩到要拿去投資非流動性的次級貸款也不肯。猜猜看，哪個學說鼓吹只需保有這麼少的流動準備金？答對了，是市場效率派再度上場打擊。


    第二部分結尾會將效率市場假說與古代的托勒密行星運動理論兩者，做個幽默但不離譜的相提並論。效率市場派人士，不就是靠著大量方程式與高超的數學，堅稱太陽沿著軌道繞著地球轉的一言堂古代天文學家。


