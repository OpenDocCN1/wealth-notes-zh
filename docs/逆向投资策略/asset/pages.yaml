  md: '效率市場假說風險分析的骨幹中。


    所以研究者可勢必得要找到新的風險報酬變數，好從中得出高風險高報酬的相關性；事實上，他們必須建立有辦法圓滿達成舊款未竟之功的新款資本資產訂價模型（當然也要改名），這樣的念頭反而使他們陷入更深的理論泥沼。


    你能上哪找到管用，做出來的結果又勝過舊款資本資產訂價模型結果的新變數？顯然你才能在《紐約時報》或《華爾街日報》分類廣告版上，打廣告說要「誠徵新風險因子」。


    可惜這正是效率市場派落到的處境。這些人後來有過了波動性這關嗎？並沒有。首先是他們一開始就站在風險報酬之問存在簡單相關性這邊，讓自己陷入科學上的困境。彌爾頓．傅利曼（Milton
    Fried-man）曾告誡：「如果有一個……〔相關性〕……與已有的證據相符，那麼肯定還有不计其數這樣的因子。”即使學者發現一個波動性與報酬的相關性（尚有疑點），可能有上百個更好的其他風險報酬解釋因子。


    研究者第一個問題是無法證明三因子、四因子或其他模型的結論是真有其事，或只是碰巧呈現關聯。傅利曼也提過，科學方法的一條基本規則是，相關性跟因果關係差多了。事象間的相關性多不勝數，但缺乏證明其為真的合理證據的話，不過是純屬巧合，下一刻可能就消失不見了。例如，技術分析用了幾十年的裙擺指標（Hemline
    Indicator）就是一個有趣的碰巧相關案例，這指標的概念是說，1920、1960、1980 和 1990 這些流行短裙、裙擺較高的年代，股價都飆高，反之在1930、1940和1970
    這些流行長裙、裙擺較低的年代，大盤都走低。照這半開玩笑的說法，裙擺的高低與股市高低連動，顯然大家是聽聽而已。


    不過，許多效率市場假說研究者似乎把碰巧相關當成得證，無視無法證明可能有許多其他變數也有同樣甚至更好的相關性。雖然尚未有人提出顯示波動性與報酬之間存在一致相關性的新理論，效率市場假說研究者仍未放棄'
