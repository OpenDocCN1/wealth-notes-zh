  md: '數百萬投資人已經厭倦來自不良投資建議的摧殘，和許多機構投資者一樣轉向了指數型基金。包括指數股票型基金（exchange-traded funds, ETF）在內的指數型基金，現在已有超過1
    億美元的投資規模。


    有新的研究指出，在主要產業群中買入最便宜的股票，能創造很出色的長期報酬率，讓你有縱橫股市的機會，同時任何投資人都可以運用這套竅門。我們的研究顯示，這種策略的報酬率遠遠高於指數型基金，儘管這不是人人都適合的策略，但它對於有能力做到分散式多元投資組合的投資者來說很有效：即從68
    個產業的各個產業，逐一挑出2 支股票。


    這種投資組合和指數型基金不同，因為它沒有海納數百支股票，但是卻有跨68 種主要產業的冷門股。正如我們所見，長期下來的報酬率遠遠超過標普 500 指數。它可以用來代替優雅指數型基金，這兩者投資組合看起來有點像，而後者也力圖超越標普
    500 指數的表現。不同的地方在於，產業相關的投資組合具有跑贏市場的長期紀錄。


    我們的研究還顯示，一旦投資組合配置好了，如表12-2的逆向操作股那樣，就需要做一些微調。買入某個產業裡最廉價的股票，在不管採用何種逆向操作策略的情況下，長抱這項投資組合，不做任何變動（這種做法和長抱最廉價股的絕對逆向操作策略不同），它會產生統計學上說的「衰變」，但還是能遙遙領先於市場。最好每一兩年就對這個投資組合執行再平衡。


    儘管我們仍在研究產業策略運作的成果，但我們相信，正如前面所述，這一切是由情感和其他心理因素所引起的。


    也正如葛拉漢和陶德在《證券分析》書中所言，企業命運會隨時間變化，這在產業逆向投資策略裡也會發生，就像從整體市場切入的絕對逆向策略一樣。5產業內落後企業不會坐以待斃，它們往往會上緊發條、改善管理續效，想辦法增加市占率或開發新產品，這會讓它們往後長時間跑贏市場。


    然而，這些改變當然與情感有關。企業分析師和投資人對於這些吊車尾的企業會逐漸改變觀感。現在，當公司的業績好到驚豔時，市場會用高股'
