  md: '出現誤差，哪能讓市場保持效率？其次，從逾30年的研究期間可知，分析師沒有從錯誤中學習。理性投資人照理說要立即調整讓市場保持效率，為何沒這麼做？一隻又一隻黑天鵝從眼前經過，唯有預測錯誤是「市場異常」才能保住效率市場假說。以下是我們給投資人的投資心法：


    > 操作心理導航13：目前通行的證券分析多半需要分析師做出不可能 的準確預測，避免使用要求高難度準確性的方法。


    # 胡亂預測之七：我的情況特殊


    我們能怎麼看這些結果？若證據是如此充分，為什麼沒有變成投資大眾的常識，尤其是專業人士，為什麼沒有把這些結果運用在他們的方法中，反而一腳踩中地雷？為什麼市場專家只覺得這些是有趣的發現，別人才會受影響，自己不會？許多專家認為自己的分析是獨門絕活，對自己的準頭有把握，相信自己會屢戰屢勝，萬一不準了，不過是一時失手，或是上了公司的當，研究地更透徹就能避免重蹈覆轍。


    我們來看這樣的心態為何能無視打臉的證據，照樣普遍存在。這個劇場 的出色卡司來自各領域的專家，情節引人入勝，而且會帶給觀眾滿滿（或許荷包也能）的收穫。


    # 胡亂預測之八：若干預測誤差原因


    前面看到，即使歷時數十年，災情嚴重，投資人對於預測在統計上的失敗，要瞶視而不見，要瞓不做多想。投資人為何仰賴到頭來可能讓自己陷入窘境的預測，有幾個經濟上和心理上的原因。約翰・柯瑞格（John
    Cragg）和墨基爾很早就在《財務學期刊》發表過一篇長期預測的研究，¹⁴他們分析'
