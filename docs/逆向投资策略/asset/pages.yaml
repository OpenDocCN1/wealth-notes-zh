  md: '舉例來說，如果華爾街估計某公司的盈餘在一段時間內可能會下滑，哪怕指標看起來有多好，我都不會急於買入。正如我們常看到的，分析師常常過於樂觀，而太常發生的情況是，預估盈餘呈溫和下降，結果變成跳崖式崩跌。2007至2008年花旗集團、美聯銀行（Wachovia）以及美國國際集團（American
    International Group, AIG）等金融類股就是這樣，當時分析師們預估的盈餘降幅相對較小，但實際上這些公司的收入一落千丈。


    預測盈餘整體方向與精確估算盈餘這兩者間的關鍵差異是，前者簡單多了，而且成功機率也高出很多。


    指標4：收益預測應該趨於保守。這與葛拉漢和陶德的安全邊際原則有關，在我們走遍分析師過度樂觀而造成的驚悚之旅後，這原則顯得尤其重要了。有時你不用為了調低預估値而拿出鉛筆來慢慢重算；你需要的是一台大型怪手，把那些預估値直接丟進屬於它們的地方。也請記住，預測整體走向且盡可能保守估計，可以進一步減少失誤。如果這樣做之後，這家公司的盈餘成長高出標準普500指數的情況仍能維持1年左右，那麼你的投資也許會有不錯的回報。


    指標5：公司的股利殖利率高於市場平均值，並且還有上升空間。這項指標的先決條件，是要同時滿足前四項指標。我們已經知道，有關股利的傳統思維和實際情況相差得可遠了。高殖利率策略也能跑贏市場。在操作實務上，我發現指標5若結合逆向投資型買股規則，可以提高績效表現。


    無論使用哪一種逆向操作策略，以上五大指標皆有助於選股。接下來岔一下題。我經常被問到一個問題：「什麼才是最好的逆向投資法？是不是該選定一種方法，例如本益比或是股價淨值比，然後一路用到底？」就我而言，答案是否定的。儘管你當然可以選擇單一策略來好好操作，但我還是贊成採用折衷的方法。我們的資金管理公司使用低本益比法作為核心策略，但也大量運用其他三種逆向投資策略。投資機會百百種，而你往往會發現這些方法在判定股票的價值時各有所長。'
