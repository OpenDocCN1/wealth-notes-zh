  md: '# 2. 險益負相關的判斷


    情感受到讓我們看不見證券或整個部位的風險嗎？投資學說不會，風險理論經過50年的時間淬鍊，投資組合有的是抵擋風險的法子。投資人、投資顧問與基金業者使用的效率市場假說與主流的現代風險理論，認為風險就是波動率而已，可是，近來在情感的研究工作則提出有力證據，指出多數人用來「化險為夷」的法子是不管用的。


    效率市場假說顯示，做投資承擔越大的風險，是想獲得更高的報酬，但情感理論說不是這麼回事。巴魯克．費許霍夫（Baruch Fischhoff）等$^{10}$學者發現，人對風險與報酬的判斷是負相關的，實際風險越大讓人覺得獲利會越小，反之，風險越小時覺得獲利會越高；一言以蔽之，跟現代風險理論剛好顛倒，之所以會這樣，原因還是出在情感身上。


    這方面的發現，獲得許多後續研究支持。研究人員詢問受訪者各種活動的風險程度，受訪者針對多個危險或有害的情況作答，結果是獲利或報酬越大，覺得風險越低。基本上風險存在於每個狀況，但感受會隨利益而改變。相反地，報酬獲利越低，覺得風險越大。舉例來說，研究人員發現大家覺得酒精飲料與食品添加劑的利益低，風險高，疫苗、抗生素和X光的利益高，風險低。在投資領域，高風險咸認與高報酬高度相關，依目前的投資學說，這樣的心理行為根本站不住腳。


    史洛維奇等人$^{11}$調查英國毒物學會（British Toxicological Society）的會員，發現這群專家也懷有相同的險益負相關心理面。$^{*
    12}$研究行為的人員表


    > \* 不意外地，這群專家的情感反應強度，強烈影響危險項目的負相關判斷。後續研究中，同一群毒物學家被要求用情感量表（從好到壞），對30個化學物質做「快速直覺評分」（如苯、阿斯匹靈、二手菸、食物殘留的戴奧辛），接著這群專家要判斷暴露在極小量這些化學物質下的相關危險程度，暴露的濃度不到安全法規的1%。照理說，暴露在這麼低的濃度之下，判斷的風險應該一律、一致很低，與情感量表評分的相關性不顯著或沒有。結果，對化學物質的情感，與極小量暴露風險的判斷之間，兩者卻呈現出顯著相關性。情感評分很負面，但判斷有很高的極小量暴露風險，反之，情感評分正面，判斷的風險則低。幾乎每位受測者（97人中
    有95人）的回答都是這個模式。'
