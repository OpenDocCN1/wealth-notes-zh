  md: '# 第$12$章

    # 產業內的逆向策略


    我們已經看到上一章提及的四種逆向策略，其在網路泡沫破滅以及 2007 至 2008 年間市場崩潰的情況下，都比市場表現得更好。


    接下來將討論一種新策略，該策略賴以運作的行為原理與反向式股票完全一樣，但是表現方式截然不同。這種方法將讓你透過類似於指數型基金的方式——涉足主要產業。但是，它應該要能創造超越市場報酬率的績效，這點與指數型基金不同。正如我們的研究發現，投資人過度相信自己預測股票軌漲軌跌的能力，市場潮流也發揮關鍵作用，磁吸著人們購買熱門股。如果用上一章的絕對反向指標來衡量的話，這種方法是否超出了絕對的「最佳」和「最遜」股票的範圍呢？答案是肯定的。


    # ## 新的逆向策略


    從心理學的角度來看，如果整個市場中都瀰漫著某種趨勢和潮流，你便有理由預期它們也會存在於特定產業中。$^{1}$分析師的研究、專家意見、當前前景以及其他變數對於投資人的預期所產生的影響作用，在產業內或是整個市場幾乎是相同的。結果依然是，對於一個產業內的熱門股期望過高，而對於冷門股期望過低。所以，才會有蘋果公司可能是電腦周邊設備產業的熱門股，而戴爾（Dell）被認為是落後者的市場風向。同樣，安達（Chubb）可'
  merge: -1
  img_proc: true
- pgno: 293
  md: '能是保險產業的最愛，而哈特佛（Hartford）沒那麼受人愛戴。因此，高估或低估價值型或成長型產業裡的熱門股和冷門股，似乎自然成為逆向策略的另一種延伸。理論上說得通，不過，我們不像學術界的朋友們般謙遜，這裡要提出一個不太禮貌的問題：這行得通嗎？


    首先，我們應該要問，在近期來日趨艱困的環境中，逆向投資策略的表現如何。大環境越是嚴峻，就越需要精準的判斷。如我們在上一章介紹過的絕對逆向操作策略一樣，產業或相關的逆向投資策略應該不允許我們過度估值，而且要能避免使用未經認可的貝他係數以及其他波動性評估指標，同時還能提供其他安全偵測，從而大幅降低誤判頻率。


    為了找到答案，我先是在1970至1996年間和拉夫金合力進行一項研究，$^{2}$接著在1995年1月1日至2010年12月31日與伊列娃著手一項追蹤研究。我們檢查了Compustat資料庫1,500家大型公司的市場規模。在隨後的研究中，按照標準普爾全球行業分類標準將1,500支股票劃分為68個產業。$^{3}$將每個產業內本益比、股價現金流量比、股價淨值比排名前20%的公司，以及股利殖利率比排名末20%的公司歸為熱門股。最冷門股則是產業內前三項指標排名末20%、第四項指標排名前20%的公司。對於中五分位數的其餘60%的股票，以相同的方式計算總報酬。


    以低成本比的產業逆向操作策略為例，每個產業的最低倍數各有不同，例如商業銀行最低可能是10倍；生物科技則是40倍。若我們是正確的，這兩種產業中本益比最低的股票應該能帶來高出市場的報酬。請記住，在討論這種策略時，我們所說的是相對本益比或同產業本益比最低的20%（或是以股價現金流量比、股價淨值比或最高殖利率來評估），而不是指整個市場中的最低本益比，這和其他四種逆向操作策略的做法一樣。


