  md: '# 泡沫與恐慌有什麼好在意？


    1997 年将定稿交給西蒙蒙与舒斯特（Simon & Schuster）的编辑佛瑞德·希爾恩（Fred Hills）時，他問了我這問題，他接著說：「我 20
    歲的女兒都知道泡沫與恐慌。」希爾恩一語道破，哪個讀者不知道投機熱潮與崩盤，你可能知道 1630 年代荷蘭的投資人瘋買鬱金香，鬱金香狂熱（Tulip Mania）那時，稀有的
    Semper Augustus 球莖，一顆飆漲至相當於 75,000 美元。你可能也知道 1720 年英國南海泡沫（South Sea Bubble）的印刷工人故事。有個印刷工人因為羨慕別人靠著「用地熱供暖」或「用蘿蔔榨油」之類的假公司撈錢，於是策劃自己的騙局：「一家事業利潤豐厚，但默默無聞的公司。」¹隔天上上午
    9 點開門營業時，門外大排長龍，等著申請股票。這名工人把錢收下，當晚就跑路到歐陸，從此人間蒸發。*


    你可能知道 1720 年法國的密西西比泡沫（Mississippi Buble）。密西西比公司（Mississippi Company）創辦人約翰·羅（John
    Law）是畫大餅的高手，他炒股的豐功偉業之一，是找了數十名穿金戴鑽、配戴紅藍寶石的印第安人在巴黎遊行，這些黃金與寶石據說是從路易斯安那蘊藏量極豐富的礦山挖到的。1720
    年跳水之前，股價漲了 4,000 倍。


    我們祖先啟程前往新世界，希望逃離暴政與迫害，追尋更好的生活時，也將泡沫帶來，並發揚光大。美國開國以來，便與泡沫和市場崩盤如影隨形：1785、1792、1819、1837、1857、1873、1893
    和 1907 年的恐慌，1929、1967、1987、2000 和 2008 年的崩盤。看怎麼定義事件，數字可能更高。


    這些事件情節確實都很像，但我們不是要用經濟史家的角度重新審視，或是重講一遍投資人多愚蠢、多會自我欺騙；這不是本書的旨意，我們討論


    * 神奇的是，1996 至 2000 年網路泡沫時，有人成功完成了一場幾乎一模一樣，但規模大很多的騙局。'
