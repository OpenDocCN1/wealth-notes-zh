    # 均值迴歸


    前面介紹了源自代表性的認知偏誤，會持續導致投資人犯錯。投資人充當直覺統計學家的一個盲點，是不會好好將均值迴歸的原則放在心上，這個由早期優生學專家法蘭西斯・高爾頓（Francis
    Galton）在一個多世紀前發現的統計現象，對於避免在市場上犯錯非常重要。高爾頓研究父親的身高，發現身材最高的父親，兒子身材反而較矮。許多身材高的父親，出身於平均身高的家庭，兒子的身高很可能比自己矮；反之，矮個子的父親，兒子的身高很可能比自己高。也就是說，小孩的身高比父親較不趨向極端，子女的身高會歸於人口的平均情況。'
