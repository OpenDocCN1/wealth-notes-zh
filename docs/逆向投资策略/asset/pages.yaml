  md: '# 致謝


    本書緣起於交戰已逾一世紀的兩大陣營。每個陣營都各自有大批傑出學者、其他專家支持，並倍受諾貝爾獎肯定，以至於其自然堅信我方理論定義明確且具科學證據，同時也是唯一能正確解釋經濟和金融行為的理論。我指的第一個陣營是由經濟學家和金融專家組成，他們堅信人們的投資決策是完全理性的。其次則是行為主義者陣營，其主張儘管人們的行為多半是合理的，但也很常偏離理性行為。而我，有幸從早年就開始涉足這兩大陣營。


    我父親是一位大宗商品交易員，也是投資人，從我3歲起就拎著我逛交易所。儘管他是金融背景出身，但也認為心理學對於制定決策舉足輕重，所以總是會向我說明箇中原因。耳濡目染之下，這種思維一直影響著我以至於從大學時代直至今日都受益良多。


    幾十年來，我很榮幸能與許多優秀的金融思想家思想交流，包括《富比士》已故編輯吉姆·麥克斯（Jim Michaels）、《霸樂週刊》專欄作家艾博森，以及美國投資界的佼佼者。我也十分榮幸能常與平賠投資（Martingale
    Investments）董事長阿尼·伍德（Arnie Wood），以及希爾克雷斯特資產管理（Hillcrest Asset Management）董事長布萊恩·布魯斯（Brian
    Bruce），長時間探討金融和行為財務學。這兩位先進都是很熱血的行为學者，同時也是造詣高深的投資思想家，其中後者還身兼《行為財務學期刊》（Journal of
    Behavioral Finance）編輯。


    在行為學陣營這邊，我萬分榮幸認識了許多鑽研市場心理學的標竿人物。我從史洛維奇身上吸收大量行為心理學知識，30多年來多所交流。我'
