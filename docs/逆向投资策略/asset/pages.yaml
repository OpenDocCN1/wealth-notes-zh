  md: '因此，我們看到自二戰以來，短期國庫券、債券、儲蓄帳戶和企業債務為了通膨和賦稅付出了大筆代價。但即使在承平時期，也少有投資者將股票優於債券證券此一重要表現納入風險計算中。即便股票的報酬率在過去65年表現如何出奇優異，但在我撰寫本文時（2011年9月），大量資本仍從股票和共同基金中流出，轉向了短期收益僅有0.05%的美國國債，以及報酬率分別為1.9%、2.9%的10年期國債、30年期國債。在最後一章中，我們將探討為什麼這些資金流入債券和短期國庫券可能會變成大災難。


