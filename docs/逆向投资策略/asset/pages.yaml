    # 要害


    但現在就向效率市場舉白旗言之過早，當我們更仔細考究重大市場事件，或考察較晚近的時期，這個優雅的說法其實問題不少。除了學者們假定投資人跟做研究用的電腦一樣不帶情緒，一樣有效率，完全無視包括我們前幾章所介紹，種種引發重大投資偏誤在內的心理偏誤來執行運算，對效率市場假說構成挑戰之外，下兩章還會介紹更嚴重的缺陷。


