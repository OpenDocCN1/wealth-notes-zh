    Bank of Scotland, RBS）、雷曼兄弟和貝爾斯登。在他 們軟硬兼施、威脅要把生意轉走的情況下，信用評級機構乖乖就範。從那時 候開始，這一切就變成獵火雞的遊戲，或更準確地說，是在獵殺客戶。


    銀行家仗著錢所能買到的最佳信用等級，將有毒的黑心房貸賣給了毫無 戒心的客戶。這種產品給了銀行家世上最美好的東西：高收益加上高評等的 垃圾商品。銷售金額飆上了數千億美元，而銀行家用這種勾當拿到的利潤也
    同步飛漲。


    這場好戲才剛上場。銀行家一拿到高評等，各式各樣複雜的證券就賣得 動了，例如抵押債務債券和結構性投資工具（structured investment vehicle,
    SIV）。從 2003 至 2006 年甚至是供不應求。還有哪裡能讓保險公司、銀行、 避險基金或抵押債務債券，拿到如此高的收益和評等呢？正如我們在 第 5
    章 所見，抵押債務債券、結構性投資工具和避險基金等商品，透過銷售債券和 其他信用工具，所獲得的槓桿倍數是原始資本的 30 至 35 倍之多，而客戶每 年可獲得
    15% 以上的穩定報酬。


    然而，這些銀行家賺進數十億美元還不足，想憑著小聰明和內幕消息 讓這些有毒資產賣得更好。他們設計了更多更複雜、美其名為「異型」和 「合成」的衍生性金融商品。這還要感謝魯賓、桑默斯和葛林斯潘主席努力
    推動《2000 年商品期貨現代法》。


    異型衍生性金融商品極其複雜，通常是由想賣空某種有毒資產的銀行家 所創，他們知道，這些商品只會曇花一現，自己勝算大得很。合成衍生性 金融商品則是單純複製這些可怕的房貸產品組合，讓銀行家可以賣空他眼中'
