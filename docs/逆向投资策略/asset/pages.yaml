  md: '所以，以逆向策略的形式體現的價值型策略，才最能在牛市和熊市之間闖蕩自如。下面將提供一些應用指南，有助於你實踐各種逆向投資策略。


    # 第 3 節：行為逆向策略


    # 1. 逆向式選股：A-B-C 法則


    所有投資人面臨的首要問題，是如何選擇個股，以及決定投資組合的股票數量。以下是近年來一些簡單又切實有用的指導原則：


    +   A. 只買入具備異績效的逆向操作股票。


    +   B. 平均投資跨 15 種以上的產業的 30 至 40 支股票（如果你的資產規模夠大）。


    分散投資至關重要。個股間的報酬率差異很大，因此僅仰賴少數幾個公司或產業是很危險的。分散風險的話，你有更大的機會能做到前途冷門股那樣的表現，而不是忽高忽低。11


    +   C. 買在紐約證券交易所上市的中大型股票，或在那斯達克或美國證券交易所上市的較大公司股票。


    這類公司作為前面研究的基礎，通常比小公司還少耍弄會計伎倆，這就像多了一層保護措施。正如我們所看到的，會計是十分棘手 的問題，無論投資老手還是新手，都曾付出慘痛的代價。


    中大型公司提供投資人另一個優勢：對大衆來說，它們更加吸睛。福特汽車公司奇蹟式轉虧為盈（發生在 2009 年），總比那些埋葬在死亡谷（Death Valley）風沙裡的上市連鎖牛排餐廳的命運還要引人注目。最後，大型公司具有更大的「持久力」；他們的失敗率大大低於小公司和新創公司。12'
