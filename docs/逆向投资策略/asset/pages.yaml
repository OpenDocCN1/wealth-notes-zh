  md: '# 再來一記好球，三振！


    # 房利美


    房利美（Fannie Mae）這檔世代相傳的績優股，看起來和廉價股無異，我2007年底推薦時，股價為37美元。該公司幾十年來的盈餘成長一直高於市場平均值。沒錯，次級房貸和其他高風險房貸市場正迅速下滑，而它已經連續幾個季度處於虧損狀態，步履維艱。房地美自1938年羅斯福（Roosevelt）政府創立以來，經歷了多次房市低谷。它和另一家其規模較小的房屋抵押貸款機構房地美（Freddie
    Mac）的信用評分標準比銀行、儲貸協會（S&L）和投資銀行要嚴格得多。有一項關於房貸違約率的檢核證實，其對買方的信用評分標準越來越高，而違約率越來越低。人們買入這兩檔股票是因為它具備強大職權、商業模式受到保護、盈餘成長過去一直很不錯，以及低本益比。


    從當時或是隨後對資深管理層（含董事長在內）的採訪中都看不出來，高層嘴上說的漂亮話和事實本身根本勾不上邊。事實上，房利美和房地美在民主黨眾議員巴尼．法蘭克（Barney
    Frank）和美國聯邦住房管理局（Federal Housing Finance Agency, FHFA）局長詹姆斯．洛克哈特三世（James B. Lockhart
    III）帶頭施壓之下，遭到莫大的政治壓力。如果他們不逐漸放寬低收入戶的房貸金額，將可能會被迫失去低成本融資這項關鍵業務。


    在2008年春天，美國當時的財政部長鮑爾森和紐約聯邦儲備銀行主席提姆．蓋特納（Tim Geithner）均表示，二房的超額資本均超過法定資本要求。蓋特納宣布，由於房利美和房地美的業務營運已有所改善，他將降低二房的資本要求，以使其能向急降的房貸市場增加放款。2008年整個8月他都在發表類似聲明，看起來至少是得到了財政部長鮑爾森的默許。


    緊接著在2008年9月6日，二房卻被美國財政部接管了；它們現在成了雞蛋水餃股。我們在後續的聲明中清楚看到，房利美和房地美在巨大的壓力下大量發放忍者貸款（no
