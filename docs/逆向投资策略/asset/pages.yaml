    # 滿是懷疑的歲月


    過去，若有人徹底分析低本益比就會招致批評。一則成長派在投資圈裡勢利龐大。許多機構投資商無法說服自己這些新發現對他們是有利的。畢竟，就像那些懷疑盈餘預測的研究一樣，可能會否定掉多年的實踐成果（或是被洗腦）。當我在
    1976 年初發表一篇論文綜論前期研究時，許多專業人士告訴我，這些資訊已如昨日黃花：「1970 年代的市場怎可相提並論。」


