  md: '不堪，但不發布賣出報告、盡量發布買進報告的誘因仍然很大。許多投資人的積習直接或間接操之在研究分析師手上，這批人靠預測跟推薦闖出名號，雖說預測根本不是重點，甚至無法反映在自身的報酬，但這就是市場上大家在玩的把戲，投資人的問題是他們想從「新情」取決於推銷量的分析師口中，聽見最有利自己的建議。顯然，這是緣木求魚。以下是我們的投資心法：


    操作心理導航15：如果覺得某個分析師的建議有意思，至少要拿到他過去3至5年所出的全部報告來參考，如果內容不怎麼樣或無法提供，請打消你的念頭。


    業界眾所皆知，分析師面臨的另一個壓力，是做賣出的建議。從數量來看，賣出建議比建議買進少非常多。分析師若建議賣出一家企業，日後大概就不可能到那家公司登門拜訪；若建議賣出一個產業，可能成為那行業的烏鴉嘴，無緣會晤業界的頭臉人物。如果分析師是行業的專家，在行業中傾注自己的心血，做出賣出建議恐怕是陷自己於不義。


    即使分析師鐵了心，建議賣出可能仍會招致高昂的代價。1980年代末期，Janney Montgomery Scott有個分析師建議賣出大西洋城一家唐納·川普（Donald
