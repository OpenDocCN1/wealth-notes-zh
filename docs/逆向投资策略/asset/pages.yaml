  md: '經版，讓自己設身處地事發當時的情況。起初覺得，跟這種非法夜總會狼獪、會坐在槓桿上、短裙男孩身材的「爵士女郎」(jazz baby) 時代的笨蛋投資人對做，輕輕鬆鬆就能海削一筆。他們不知道市場不會漲個不停？占這種人便宜是小事一件。


    並不是。我進華爾街工作不到一年，就幹起一樣的蠢事，一腳踏進1966至1969年的暴發泡沫，這個個人體悟，讓我覺悟到，唯有徹底理解投機狂熱的成因，加上屢次高估熱門股票估值，才能讓你保住老本，甚至壯大資本。


    # # 投機狂熱的共同特徵


    前面提到，投機熱潮最明顯的特徵之一是在不同時期的相似性，即使時移世數百年仍是如此。多數泡沫有諸多破壞性特徵，第一個是過度運用信用。


    快速回顧1929年和2007至2008年的大崩盤，這兩個時期運用槓桿的情況都很誇張，歷史上許多泡沫期間都是如此。1929年時，投資人買股票融資成數是10%，當時投資客愛買的投資信託，本身也有大量信用交易，融資的水準其實還要更高。1929年初，聯準會顧慮投機，將融資利率調高到20%，不過只對信用操作造成片刻的衝擊，畢竟，年利率20%，一個月不過1.67%，鑑於股票最近的績效，投資客預期用不了幾個月就能賺到10%、20%或更高的獲利。市場肯定會迅速地反攻。


    引發2007至2008年崩盤的房市泡沫，銀行的槓桿來到25至30倍之譜；貝爾斯登 (Bear Stearns)、雷曼兄弟 (Lehman Brothers)、高盛
    (Goldman Sachs)、摩根士丹利 (Morgan Stanley) 之類的投資銀行，槓桿開更大，高達30至40倍，很多是流動性很不好的抵押貸款工具，這些人相信，不動產市場不會跌。槓桿這麼高，次級房貸只要稍微跌下來，就會把泡沫戳破。'
