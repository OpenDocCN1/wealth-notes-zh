    下面還有一種有趣的投資策略，它可說是新逆向策略的變型。


    # 買入—清理策略


    我們探討過長抱策略的成功之處，它的變化型是買入反向型股票投資組合，不論是上漲、跑贏市場，或者在一段時間後跑輸市場，都要定期做清理，以新的反向型股票替補被清出的股票。打個比方，如果在你的低本益比投資組合中有40支股票，每支持有約2.5%，當你賣出了10%的時候，就要回補4支新進低本益比股票，讓投資組合中的股票權重维持在2.5%。綜觀大部分的研究都顯示，長抱（5至6年或更久）的話報酬會遞減。這類方法應能拉高整體報酬，勝過單純長抱的策略。


    清理過程可讓反向型股票投資組合的收益維持在平均水準之上。不管怎樣，無論你選用哪種策略，都能在風險水準低於市場平均的情況下，以最少的時間成本、最大的機會致勝。


    # 逆向操作策略的其他選擇


    # 外國基金和國家型基金


    近來美國國內經濟疲軟，國外市場反倒是一片榮景。數十億美元流入中國、環太平洋地區、拉丁美洲、巴西和阿根廷，保守型投資人則押寶歐洲和日本市場。你應該也參一腳嗎？應該，但謹慎為上策。


    首先，國外市場已經發生巨變。再者，雖然悲觀主義在2008至2009年'
