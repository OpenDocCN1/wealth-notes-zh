  md: '至 1988 年崩盤、2000 至 2002 年出事背後的重要因素，分別出現標普期貨和指數波動性、網路科技股的波動性飆高的情況。


    波動性的打擊面遠超出市場本身。長期以來企業經理人運用資本資產訂價模型來判斷投入新事業的吸引力。一般承認波動性較高的企業必定伴隨較高的報酬，因此除非有把握從投資案賺取額外的報酬，否則企業的執行長很可能不太願意投資較高風險的新事業。


    更廣泛來看，波動性理論似乎長期有礙美國企業界做出良好的決策。由於「好公司」威信到市場就可取得資金，無形中傾向降低流動資產。1980 年代，以效率市場假說理論的旗手詹森為首的一眾經濟學家，認為既然效率市場假說會常保市場上的價格不出錯，企業執行長對企業本身還有經濟最大的功勞，就是讓自家股價極大化。⁹話說得直白：盡一切努力讓自家公司的股價上揚，即使損及公司的長期生存和獲利能力也在所不惜。這理論跟
    2007 至 2008 年金融危機時，企業顯著減持流動部位，以致經濟衰退加劇的情況脫不了關係，再度說明了有問題的理論會捅出什麼樣子的婁子。


    # 貝他


    貝他是最多人在量的風險，但從一開始研究者就苦於找不到一個能準確預測未來波動性的貝他。夏普、約翰·林納（John Lintner）和簡·莫辛（Jan Mossin）等人最早發展出來的貝他，證明沒有預測能力，也就是這期的波動性跟下期沒有或只有很低的關聯，股價可能一時洶湧，下一刻就一灘死水。


    由於現代投資組合理論假定正效率市場假說隱含投資人會趨避風險，沒有可供舉證的貝他，從一開始就是研究人員的棘手問題。假若投資人風險趨避，貝他或其他風險波動性指標必須有預測能力卻落空，前後期的貝他不存在相關性，形同理論出現了大洞；風險理論站不住腳，效率市場假說惡骨亡齒寒。'
