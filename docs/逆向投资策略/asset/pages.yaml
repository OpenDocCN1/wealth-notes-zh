    # 一葉不能知秋


    康納曼與沃特基斯提出的第二個重要認知偏誤是代表性，他們用嚴謹的實驗證明，人天生就有在不成立之時類推、等而視之的傾向。


    代表性偏誤可能導致投資人將其實不一樣的二家公司、二種市況，當成相同的情況。¹⁸ 人們掌握部分資訊，心裡浮現熟悉的景象，實際上可能跟實情相差很遠。代表性偏誤有二條使人錯估情勢的途徑，一是它使我們太著重於事件的相似性，對事件發生的真實機率不以為意，二是它降低了對於影響事件機率的重要變數的重要性。


    例如，1987 年市場崩盤後，道瓊指數 4 天跌掉 769 點，在 1987 年 10 月 19 日的黑色星期一大跌 508 點，近 1 兆美元市值蒸發，媒體的頭條是「1929
    年重演？」，許多投資人看見黑影就開槍，將兩者混為一談，紛紛拋售變現。


    當下情況異常相似，距上次股市崩盤已 58 年，大家相信股市崩盤接著就是經濟蕭條，華爾街、媒體與投資大眾多是這麼想的人，但兩次崩盤天差地別，1929 年其實是特殊案例，美國在
