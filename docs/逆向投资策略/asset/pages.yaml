  md: '# # 第1章


    # 泡沫星球


    還記得投資讓你感到興味盎然的日子嗎？對我而言是1960年代後期的紐約市，25歲左右，年紀正好，開始上班當分析師，距暴發（Go-Go）泡沫吹起還有一年，買什麼漲什麼，20%或30%只是小意思，不，這稱不上有漲，不配我們出手。電腦服務業、保健醫療、半導體，多得是漲10倍、20倍，甚至上百倍的股票。我們變得超有錢，我跟年輕的同事在接下來的18個月滿腦子這麼想。


    人是新的世代，市場是空前的盛況，我們嘲笑買藍籌股，還有比出警告手勢要我們賣出股票以免出問題的老派。他們看不出來才正要開始？越來越多分析師推薦這些當紅炸子雞，所有熱門的基金一邊搶進，基金淨值一邊飆高。就像1920年代那樣，大家都在買股票。股票持續上漲，我們沒法從陶醉中醒過來。


    我有個朋友（姑且叫他提姆）那時候去做團體治療，說是要讓自己振作，但從談話中，比較像是想要找有新鮮感的女性，總之，最後那個團體也淪陷了。聰明、口才又好的提姆，不吝於表達看法，很快成為注目的焦點；帶領課程的心理分析師本身也熱衷此道，於是團體治療逐漸變為股票經同好會。有個成員是個缺乏自信，聽父親吩咐的中年生意人，自認為在金錢上沒出息，聽提姆推薦去買Recognition
    Equipment，結果漲翻天，獲利數百萬。他自信上的轉變令人驚奇，甚至威脅到提姆在那個團體的權威地位。'
