  md: '有特徵，而一切會發生得更迅雷不及掩耳。2010年5月6日，道瓊工業平均指數急挫9.2%。這是自1987年股災以來單日內最大跌幅：美股市值在不到10分鐘內瞬間蒸發了8,620億美元。雖然波動過大的個股交易被取消，收盤下跌幅度縮減至3.2%，但投資者當天仍蒙受重大損失。更糟的是，投資人信心本就因為2007至2008年間的經濟危機受過重創，才沒多久又被這個「閃電式崩盤」打亂陣腳。美國證券交易委員會和商品期貨交易委員會會在2010年9月30日發布了閃崩事件的報告，不過似乎搖不到饞處。美國證券交易委員會到目前為止仍慢條斯理地想理出個頭緒。許多了解閃崩事件的專家擔心，美國證券交易委員會的反應會像1987年那樣龜速，而有可能會導致另一場更嚴重的崩盤。


    股票市場上有一股至今未解的巨大新力量，是高頻交易（high-frequency trading, HFT）所帶來的影響。用這些方法來操盤的菁英們已經建立起更新速度幾近毫秒（千分之一秒）的交易系統，利用高速電腦瞬間執行有利於他們的交易模式。在大多數情況下，每股獲利小到只有0.01美元，但其能操作的交易量極為龐大。雖然尚未有確切數據，但根據一些股市訊息估計，高頻交易截至2009年中期約占美國所有市場交易量的75%，高出2006年的33%，其在1990年代早期只占了10%。目前美國市場有近20,000家券商，即使高頻交易的交易量相當龐大，但這類型的券商僅占2%而已。¹


    高頻交易券商主要由科學家、計量學家和資訊科技開發人員所組成，他們的任務就是從每筆交易擠出每股零點零幾美元的獲利。德州奧斯汀一家主要的高頻交易券商RGM Advisors，在大廳的大石盆裡放滿了美分硬幣，就是要提醒大家，他們的賺錢方式就是每天交易數億股股票，縱使每股賺不到一分錢。像RGM這樣的高頻交易券商是美國證券市場新崛起的驅動力。速度就是力量；甚至百萬分之一秒也可以造找出大大不同的成果。


    高頻交易券商所建立的總部，已經遍及芝加哥、奧斯丁和紐澤西州紅岸（Red Bank）。他們透過演算法、電腦高速運算以及直連電纜，幾乎可以用'
