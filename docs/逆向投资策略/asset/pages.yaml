    在〈逆向投資、外插法和風險〉（Contrarian Investment, Extrapolation, and Risk）一文中，約瑟夫·拉科尼斯托克（Josef
    Lakonishok）、安德烈·史來佛（Andrei Shleifer）和羅伯特·維什尼（Robert Vishny），評估了我們前面討論過三種重要價值型策略的績效，並且得出類似結果。$^{16}$這些逆向投資策略堪稱股市小白，實證說明它們比效率市場假說更加無隙可乘。實際'
