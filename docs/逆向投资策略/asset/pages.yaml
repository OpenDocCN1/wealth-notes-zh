    # # 資訊過量


    氾濫的資訊是我們做投資抉擇時，動輒會把長期真相拋在腦後的另一個原因。資訊過量（too much information, TMI）在2000年代早期變成流行語，雖然多半是在輕鬆的場合，用來打斷不想繼續或不相干的話題，一個資訊過量實質影響的層面是：因為有海量的資訊、強大的電腦處理能力，及無處不在的通訊工具，投資人腦袋塞滿了太多資訊。


    資訊過量不是什麼新問題。有占卜師在幾個月前，根據重大占星觀測，對倫敦人預言泰晤士河將在1524年2月1日暴漲數百英尺，城中逗留的人將難逃滅頂之災，許多人選擇在預言之日前逃離城市，後來當然發現這預言不準，泰晤士河仍舊太平。


