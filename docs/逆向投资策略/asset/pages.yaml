- pgno: 390
  md: '國企業使用成本較低的海外服務。在印度，英語是第二語言，而且也常是第一語言，自然能成為這類服務的供應商。從聯合航空（United Airlines）預訂、起飛和落地訊息，到美國運通的信用卡資訊，再到其他數百家公司的客戶專線，印度為大量美國公司提供客戶服務，從而迫使這些美國職位的薪資水準降低了。不只客服，其所影響的服務範圍其實更廣泛、更複雜：美國有企業用10,000美元年薪就可以把軟體工程師的工作外包出去，而美國工程師1年的聘僱成本為80,000至90,000美元。券商可以在收盤後將某些部門的日常處理工作送出去，第二天早上就能收到結果。例行性會計工作也有很多是以電子郵件傳給印度，不僅勞動成本低很多，還能迅速交件。


    儘管美國有些州對從墨西哥邊境過來的偷渡客搶走低薪工作很是惱火，但聯邦政府似乎不太擔心我們將高薪的技術工作轉給亞洲和其他低收入國家。


    顯見，不受限制的自由貿易對消費者和企業都有好處，因為它可以降低成本，還可以減輕許多工業成品的通膨壓力。但這對國家有好處嗎？不必然，如果最終因為嚴重薪資差距以致我們失去數百萬個工作崗位，這就不好說了。如果工作流失過多，國家購買力下降，我們的生活水準也會降低。無論物價多低，我們能買到的商品還是很少。


    美國2011年9月的失業率為9.1%。非官方數據則顯示，如果包括那些非自願自僱者、兼職員工，以及因找不到工作受挫退出勞動力市場的人，估計失業率為16.5%，並不比大蕭條時期低多少。


    對於美國來說，這可能會造成極大危害。高薪工作外移，我們正深陷前所未有的困境當中。我們為高失業率所付出的成本，連帶社會動盪、工業基礎持續被侵蝕，遠遠抵消了低成本進口商品帶來的好處。與此同時，較低的進口成本一邊威脅我國生活水準，一邊會提高中國、印度、亞洲四小龍（台灣、香港、新加坡和韓國），以及其他低收入國的生活水準。


    我們可以自由選擇刻意降低生活水準，而我們也正在考慮（見獨立委員'
  merge: -1
  img_proc: true
- pgno: 391
  md: '會在2010年末向總統提交的建議書），減少社會安全保障及其他福利，並逐步提高退休年齡，以及因財困困難解聘全國各地的教師和警察。其實，我們或許可以採取平權行動來維持我們的生活水準。


    關於自由貿易最後也最重要的事實是，用李嘉圖的定義來看，幾乎沒有一個國家，甚至是美國，是真正的自由貿易者。自由貿易實際上是則經濟神話。大多數國家或多或少都是公平交易者。公平交易是一種貿易夥伴或聯盟關係，通常立基於透明的對話或談判，目的在於讓國際貿易更加平等，向合作國家提供更好的交易條款和條件，保障被邊緣化的生產者和勞工的權益。公平交易者在一定程度上開放市場，但要確保其勞工不會受到嚴重的影響。許多國家，包括我們在亞洲的主要貿易夥伴，如中國、印度和亞洲四小龍，連是不是公平貿易者都是個問號。


    就像25年前的日本一樣，今日的中國就是不公平貿易行為（unfair trade practices）的經典例子。中國正像1980年代的日本一樣，奉行以出口為導向的成長策略，限制國內消費、鼓勵儲蓄，並把投資導向策略性產業。它建起許多貿易壁壘和實行貨幣貶值政策，並且還透過精心構建的貿易壁壘，保護一些在成本競爭上劣於美國的主要市場。最典型的例子是金融業，美國在這方面具有明顯的成本優勢。但囿於外資擁有金融企業所有權的限制，以及其他無數的貿易壁壘，美國根本無力施展。許多其他國家地區也使用相同的保護措施來限制美國進入其金融產業。


    美國或其他高度開發國家有很多具有競爭優勢的產業都面臨這種限制，特別是在服務型產業和科技業。當這種情況一再發生時，我們有了一個名為「自由貿易」的新式桌遊，為的就是機械地複誦「自由貿易」一詞，以便獲得最大的貿易優勢。從贏者全拿的意義來看，這就像大富翁遊戲，但在這個版本裡，賺到了最多外匯的最大貿易順差國家成為大贏家。


    亞當·斯密將當前的貿易狀況稱為新重商主義（neomercantilism），從他的著作和他寫給漢密爾頓的信中，我們知道他一定會堅決反對現行的自由'
