  md: '知具主宰地位的效率市場假說（efficient-market hypothesis, EMH），指出精明投資人的存在會使價格不致錯估的投資典範，不能準確解釋現行投資理論為什麼失效，往往失之毫釐，差之千里。我們會分析效率市場假說的基本假設，分析時即可清楚地反駁這些假設。效率市場假說根本上的失誤，是沒有體認到心理層面在投資決定中發揮的作用。效率市場派及多數的經濟學家，不認為在做投資決定或經濟決策時，應該讓「軟化」人類理性的心理面插上一腳。這派像是用複雜的數學為抽象的學理塗脂抹粉方便叫賣理論。這不是故意欺騙社會，縱使假說前提遭受諸多駁斥，這派的支持者是真的相信這一套。科學總是有為數不少的錯得很忠實的研究者，怎麼樣都放不下寶貴的理論。本書是新一派的投資方法，新的典範總是在舊的再也說不通原本可以完全解釋的事件時，才會為人所接受。我們現在就來到了這樣的關卡。


    本於效率市場假說的投資策略有根本上的破綻，讓我們關注投資偏差的一個主要來源：那個每天早上盥洗時在鏡中看到的人。我想大家將會承認，心理學讓我們對一個人獨自或從眾的投資行為的理解，即是啟發開竅，對制定最佳的投資策略也出奇地管用。提出一套解釋投資人為何常做出錯誤決定，以及市場怎麼老是超漲超跌的有力心理洞察，能幫助我們抵制許多明明失敗卻仍位居當代主流的投資做法；讓你成為一位深諳投資心理學的投資者。你會換上一副配戴新的逆向心理鏡片（申請專利中）的眼鏡來看曲折的投資世界。


    # 本書的編排


    我想讀者現在就會想知道，本書不會著墨在枯燥乏味的學理辯論或學說，大家可以放心，我會用易懂的方式鋪陳研究發現，不會有複雜的數學公式。


