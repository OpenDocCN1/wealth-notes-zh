    11% 和 15.3%；宣布加發股利後則勝過大盤 7.5% 和 24.8%。這項研究指出市場並沒有快速反應新資訊。


    若干其他研究顯示，市場消化新資訊的速度很慢。幾位研究者的發現，企業財報盈餘與預測不符時（財報數字高或低於分析師的預測行情），後來三季的股價會視利多或利空而上漲或下跌。49第9章會提到，傑佛瑞．阿巴巴內爾（Jeffery
