  md: '券就全軍覆沒了。在我們最樂見的情況下，投資人賺取的報酬在 15 年後幾乎是債券的 11 倍，20 年後更高達 15 倍。


    無獨有偶的，股票即使在惡劣的情況下，長期下來的報酬仍比債券或短期國庫券來得高，而在較好的情況下更是表現優異。顯見該把錢投資在哪並非難以決擇。


