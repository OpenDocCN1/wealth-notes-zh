    # 心之所向：是效率市場還是投資人過度反應假說？


    效率市場風險理論和很多經濟理論一樣，是建立在投資者是全知、理性的前提之上，這個未經證實的觀點可追溯到18世紀。眾所周知，此一假設忽視近來主要心理學發現，以及至少一個世紀的其他行為研究成果。正因如此，效率市場假說起不了作用，也不適用。相比之下，心理學發現投資人會經常過度反應，這項可靠研究成果支持了投資人過度反應假說。


    由於投資人過度反應假說是建立在心理學原理之上，它也可能應用於有風險和不確定性存在的其他領域。重要的是，投資人過度反應假說目前已獲得實證支持。預計未來此類證據還會大幅增加。效率市場信徒把建立投資人過度反應假說的部分證據當作暫時性反常，甚或是嗤之為異常現象。'
