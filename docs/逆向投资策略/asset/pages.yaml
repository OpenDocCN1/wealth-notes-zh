  md: '# 金融賭場全新開發的遊戲


    眼下房貸只提供給收入和財務資源最有限的買家，房價飛漲，而購屋者排隊等著入列。抵押貸款公司、不動產投資信託（real estate investment trust,
    REIT）連同承作次貸的機構，也就是銀行和投資銀行家們，都意識到這是他們一輩子可能僅有一次的機會，一定得好好抓住。


    次貸業務員因為大筆的獎勵廣發貸款。許多抵押貸款銀行家（這其實是無良房貸業務員的漂亮頭銜，比起他們的道德水準，大多數二手車業務員要顯得有原則多了）每年能賺到百萬美元以上，還外加豐厚的福利津貼。他們賣的商品比桌上擺了幾天的腐魚還臭。


    房貸放款機構的目的，是讓那些收入極低甚至沒有收入或工作的民眾，藉著次級房貸和次次級房貸戶（Alt-A）的承銷標準放寬*更容易獲得房貸，這樣一來人人都買得起房子。很少人質疑貸款的品質，以至於所有購入商品會和其他類似抵押貸款商品綁在一起，推銷給這些急著買房的客戶。


    噢，是的，花旗銀行、美國銀行、美聯銀行、高盛、摩根士丹利、雷曼兄弟和貝爾斯登的銀行家，都參與了這場賭局。他們不僅從抵押貸款銀行家那裡認購抵押貸款債權，而且還大肆收購這些銀行。這種垂直整合代表這裡頭有更大的利潤。†


    然後，這些抵押債券由穆迪、標準普爾或惠譽等信用評等公司來評核。正如我們所見，房貸組合（mortgage pool）評級結果往往高過真正的品質。銀行從評等機構獲得的評級越高，抵押貸款商品就越好賣。沒人想查看底下真正的抵押品究竟為何。這種商品需要快進快出，而事實證明，它的確衝出數千億美元的交易量。


    * Alt-A是次優級房產戶，包括無法提供足夠的所得證明以及融資比率較高的借款人。


    † 大多數房貸經給貸款人後，銀行將債款轉賣給房產抵押證券發行機構，由發行機構進行擔保，包裝成債券賣給機構型客戶、避險基金和其他買家。這過程即是房產抵押證券化。'
