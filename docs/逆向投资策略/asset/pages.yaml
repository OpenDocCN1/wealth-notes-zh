  md: '# 胡亂預測之十：作局內和局外觀


    數十年來與特維斯基共同發表許多重要研究的康納曼，曾與丹・洛瓦羅（Dan Lovallo）就這主題撰文。$ ^ { 31} $


    預測者有將一個問題獨立看待，無視過往歷史紀錄的「明顯傾向」。認知心理學家指出有二種不同的預測方式：「局內觀點」（inside view）和「局外觀點」（outside
    view）。前者是預測盈餘和股價的普遍做法，分析師或股票預測者緊盯股票和成長率、市占率、產品開發、大環境、經濟展望等相關變數不放。


    另一方面，局外觀點則忽視做出個別預測牽連的眾多因素，專注在最相似的案例情況。以盈餘預測來說，就是專注在整體盈餘預測的準確性，或某類股或企業本身的預測準確性，來決定分析師所做預測的準度和可靠程度。


    若股市預測者想要成功運用局內觀點，必須要掌握未來的重點部分，相反地，局外觀點基本上就是統計跟比較，不用參透未來。


    康納曼用一個故事來說明差別。1970年代中期他與一群人為以色列的高中，擬定一份在不確定條件下做判斷與決策的課綱。大家工作了1年，做出了不錯的進展後，變成在討論要花多久時間結束這專案。小組中每個人，包括康納曼自己，都給了一個預估數字，預測範圍介於18到30個月。康納曼請一個課綱規劃專家的同仁，思考同樣來至當前時間點和發展階段的類似計畫，問他：「接下來花多長時間，計畫才完成？」


    那專家良久不語，回答說，首先大概有40%的計畫胎死腹中，剩下的，他說：「我想不到有在7年內結案的計畫，超過10年的也沒有。」康納曼接著問，有沒有什麼因素讓當前團隊會表現得更好，專家說沒有。「從資源和潛力來看，我們的水準其實略遜於平均。」這專家雖然局外觀點的功力深厚，但還是被局內觀點牽著鼻子走了。$
    ^ { * } $


    $ ^ { * } $ 康納曼也提到，後來又花了8年才完成計畫。'
