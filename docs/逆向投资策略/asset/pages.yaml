  md: '資時間範圍跨30年、20年、10年，甚至5年的投資人而言，過於關注短期波動將適得其反。短期波動率測量指標提供了一種安全假象，它會阻撓我透過長抱股票或股票等價產品（不動產、房屋、高評級私募股權投資等）獲得較高報酬率。由此我們得出了另一道重要投資心法。


    操作心理導航30(a)：長期投資要成功，應採用股票、債券、短期國庫券和其他投資的長期報酬率作為風險測量指標。投資績效判定基準則要考量預期持有期間的長短。


    操作心理導航30(b)：採用短期風險測量指標作為長期投資績效的判定基準，很可能會讓投資報酬產生巨大差額。這是今日投資人所面對最嚴重的風險之一。


    # 危機四伏的短期國庫券


    時間一久高下立判，股票可能贏過短期國庫券和債券，但正如我們所見，大多數投資人、受托人和法院仍然把重點放在短期金融風險上，而通膨和稅所帶來的更大更普遍的潛在風險，最多只是次要的考量。學術風險理論也接受了短期國庫券是無風險投資的慣性智慧。但就像大多數市場參與者一樣，金融學者還未將當前最大風險因素是通膨導致投資購買力下降的事實納入其理論架構中。


    當我們根據通膨調整投資回報時，股票這類市場公認的風險資產顯得更加安全了。長抱股票的資本在通膨調整後有可能每10年翻1倍、每20年翻4倍，再加上他們在20年後超越短期國庫券和債券的機率分別達100%、98%，根本稱不上是「有風險」。*反觀所謂的「無風險」資產，長期下來則顯見越來越「有風險」了。因此，我們必須將近幾年來高通膨對於投資人以


    > 在第二次世界大戰之後的時期。'
