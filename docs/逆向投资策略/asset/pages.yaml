  md: '府和聯準會的原始數據發布數週、數月後，常常會因為新資訊而大幅修正，本來上升的失業率、消費採購，或工廠訂單數據，後來可能改為下跌或大減。鑑於事後修正乃家常便飯，一般人可能以為投資人，尤其是專業人士，會理所當然投以懷疑的眼光，其實以為官方片面之詞真的明察重要趨勢發展的投資人多的是。


