  md: '低成本益比可能是四種逆向策略中最容易採用的一種，因為你每天都可在各大報財經版看到本益比的資訊列於股價旁邊。股價現金流量比、股價淨值比也一樣，這類資訊每季都會更新。儘管股價股利率的資訊幾乎是即時的，但因為其他三種逆向投資法能帶來相當優異的報酬率，相比之下它算是次要策略。不過，它也有出頭的時候，我們稍後會看到。


    # 4. 逆向操作策略


    # 上前線


    現在該談談實戰狀況了，看看在火線之下我們是如何做出逆向投資決策的。我將提及過去在《富比士》專欄曾提出的建議，以及我的投資顧問公司給客戶的建議，還有我所管理的卓曼高益機會基金（Dreman
