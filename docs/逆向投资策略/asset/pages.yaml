  md: '時間性概念有助解譯逆向操作策略後來績效總是會勝出，以及科技股在泡沫期間大幅高估的現象。前者（第四部分會詳述）是投資人對冷門的逆勢股票有最壞的期待，連帶將長久的前景通通打了折扣；而在後者，投資人則將快速擴張的概念股的正面期待，延伸到太遙遠的未來。我們看到很多例子，投資人高估熱門股正面情感持續的時間，如網路泡沫中的網路概念股，以致這類概念股漲到離譜的價位。特羅普教授與同儕做了許多實驗，證明長期和短期估計值在建構方式上的差異。


    一個很好的例子是Yahoo! 在網路泡沫破滅前大家對它的預期。在1996年4月上市的Yahoo!是當時首次公開募股盛況中最受矚目的一檔。


