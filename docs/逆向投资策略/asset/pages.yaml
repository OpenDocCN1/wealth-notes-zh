  md: '泡沫是為接下來要講解的投資方法。


    蔓延和崩盤事實上是了解市場心理行為的起點。這麼說好了，要是大家都知道金融泡沫，那麼它怎麼會不斷發生？經濟學家不該早就破解，像在看引擎警示燈那樣注意它？


    我們知道精準確定過熱的金融市場何時會在金融體系爆發的難度非常高，雖然明白股票可能漲過頭，但多數人還是會不見好就收，落袋為安，我們似乎就是沒辦法抓準時機。經濟學家宣揚的學問對這情況也沒幫上什麼忙。


    效率市場假說派的經濟學家說，預測泡沫是不可能的，說市場泡沫就像隱形轟炸機，雷達上找不到，等投資遭殃你就知道了。號稱繁榮「先知」的權威人士，前聯準會主席艾倫・葛林斯潘（Alan
    Greenspan），同感於這套經濟思想，表示：「泡沫很難在有事實之前確認，也就是說，只有泡沫破了才能證實有過泡沫。」$ ^2 $經濟學界普遍同意他的說法。更糟的是，通說泡沫是理性的，簡言之，價格固然離譜，但全體而言，因為理性、非情緒性的投資人的行動總是會使價格落在應當的價位，不能說它沒道理。之後會知道，這說法真省事，有保全聯準會和學界名聲的功用。接受這說法，表示我們從來沒能準確評價任何標的，不管買房子、買股票、建新廠，要那些評價的理論幹嘛，什麼價格都在好與不好之間。稍後我們會進一步檢視這個頗曲折的邏輯，但顯然投資人往往並沒有讓價格落在應當的水準。


    本書旨在揭示這樣的傻念頭，藉以改變這種想法，或至少幫助讀者換個想法，連帶還有你的投資決定。本章漫談歷史上的泡沫為數不少的其主要成因，讓大家有所覺悟，要對看出泡沫這件事有更好的理解，以免死傷慘重。多數人回顧以前的投機狂熱，會覺得自己怎麼可能幹這種蠢事，1960年代後期我刚進華爾街時也這麼覺得。準備第一本書時，我泡在紐約市圖，翻閱找到的每本泡沫與恐慌主題的書籍，接著讀了1929年崩盤前幾年的《紐約時報》（*The
    New York Times*）和《華爾街日報》（*The Wall Street Journal*）財'
