  md: '標普小型 600 (S&P Small-Cap 600) 指數勝過66.6%的小型股基金。


    現在研究總共涵蓋逾75年，結果清楚顯示，基金經理人與分析師不是大盤的對手，從隔年的市場來看，也顯示專業投資人在絕大多數時候，受當時熱門股票擺布，通常選在高點附近進場，跟多數投資人差不多，對冷門、低價股不屑一顧。另一個有意思的地方是，可以選的產業那麼多，科技業卻一直受到青睞，下場又不怎麼樣好。至少這些調查中，專家的建議明顯偏向高價股，捨棄價值面績優股。


    我們怎麼看這些結果？樣本這麼多，似乎不能說結果只是巧合而已，證據顯示逾65年來，專家在選股和選投資組合時，出錯的情況高得出奇。


    金融專家的失敗率有時直逼90%，表示除了犯錯之外，基於某些條件，必定還有系統性、可預測的力量，暗中在跟投資人做對。


    雖然這情況顯然又違背了效率市場假說的中心假設，31但更重要的是讓我們知道，基本分析在實務上不管用並不足為奇，投資理論對於組態與資訊處理的要求太超過，當市場內外資訊過量的情況下，我們的心智儀表超載，便無法確實地處理資訊，雖說自信會隨著掌握的資訊量升高，但決定卻不會同步改善。以下是另一則投資心法：


    > 操作心理導航10：對現代投資方法不可掉以輕心，礙於處理複雜資訊的侷限，多數的人其實難以運用自如。


    雖說各行各業的專家在複雜條件下，表現也許都會乏善可陳，但因為市場公開透明，因此金融專業人士比任何其他領域都容易被看清。


    我們在審視基金經理人和其他市場專業人士的選股績效時，重點是想知道：分析師做盈餘預估的準確性如何？這是了解當前選股與投資實務的關鍵，也是下一章的重點，若干廣泛研究頂尖證券分析師準確性的成果會讓你嚇一跳。'
