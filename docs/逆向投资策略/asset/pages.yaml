  md: '低迷市場中表現如何？」如圖12-5a所示，好的很。正如圖10-5a裡的絕對逆向策略一樣，我們測量了熊市期間所有下跌時期的市場報酬率。結果是，相對價值型逆向投資策略與其他四個絕對逆向投資策略一樣，在本研究期間的20個下跌季度裡均跑贏了市場。高殖利率法和市場平均下降8.1%的表現相比，再次大放異彩，平均每季度僅下降5.1%（可說是撿到了），同樣地，圖12-5b顯示，在我們研究的44個季度裡，股市上漲時所有同產業投資策略都跑贏了市場。


