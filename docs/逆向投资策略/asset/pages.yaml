    # ### 2. 1998年期權資本管理公司破產


    你以為1987年崩盤後，業界人士即使不離不棄，也會好好修正效率市場假說，或者讓效率市場假說的追隨者好好檢討，那就想得太美了。1998年又有一場新的危機瀕臨爆發，這次禍首是一家大型避險基金的招牌策略。早在「大倒不能倒」這個詞流行之前，這家公司就得瞭這張護身符。效率市場假說學說、投資圈的造神，加上資金浮濫，共同釀成一場速度和災情都驚'
