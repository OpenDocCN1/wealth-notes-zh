  md: '# 理性市場沒有泡沫跟崩盤


    雖說我們在本章跟前面章節對泡沫做了頗多介紹，大多數效率市場假說追隨者其實否認有泡沫這回事，更別說泡沫破灭的崩盤了。「我不知道泡沫是指什麼，我不覺得這個大家掛在嘴邊的詞有何意義。」$^{13}$法瑪教授如是說，試圖捍衛價格始終沒錯這項效率市場假說奉為圭臬的要義。不過，泡沫和首次公開募股似乎有違理性的行為，因而對效率市場假說來說是個麻煩，法瑪跟其他效率市場假說追隨者的處境不太妙，效率市場假說得要否定投機狂熱跟恐慌，否則就會被擊中死穴，出路只有一條，法瑪教授有找到。


    他證實證上泡沫不存在。為什麼？因為理性投資人會讓價格落在應該要有的水準。他在《紐約客》(New Yorker) 裡的文章中，閃躲、迴避，不敢直搗金融記者約翰·卡西迪(John
    Cassidy)其鋒，但如此一來，他便落入一個更難以防守的處境。


    照效率市場假說的邏輯，假使如法瑪所說，不存在泡沫或恐慌，那麼我們就要好好看看理性投資人是如何做到的，這問題在第 2 章*和本章有所著墨，但我們也看到，沒有哪個分析師、基金經理人或理性投資人在用的基本分析方法，能說得通高達
    10 倍、100 倍本益比的泡沫行情。第 2 章清楚指出，分析師和基金經理人會集體將分析放在一旁，在離譜的價位買進，背後並不是出於效率市場假說假定的理性，要是他們照著基本功行事，根本不會出現泡沫行情。


    效率市場假說追隨者似乎站不住腳，他們說有專業人士和精明投資人，價格不會出錯，但我們明知情況不是這樣。效率市場假說是不是又做了一個大膽但未經驗證的投資人行為假設？明智的投資人讓價格不會出錯，其實反而威脅到效率市場假說理論的前提，也許，與其說明智投資人應有什麼樣的行為，不如好好真的研究投資人到底有什麼行為。


