  md: '情緒，有時會與理性非常脫節。


    分析在許多決策場合固然重要，但在複雜、不確定，有時還危機重重的世界，靠情感和情緒附日是個更迅速、更容易，更有效率的法子。在焦慮和不確定的時期，讓常被情感左右的經驗系統來接手是人之常情。


    一個主因是，情感經常強大到大淹沒人們的理性分析記憶庫，以獨立的相關事件記憶庫和情緒附件取而代之。動情固然容易，但有時是極度危險的舉動。上一章介紹的每個泡沫，都有情感的支撐。


    不難猜想，當湧入資訊尚不完全或分歧，卻必須下決定時，情感是一股足以支配投資人判斷的強大下意識力量。市場正好的時候，投資人滿腦子都是已經入袋的大筆獲利跟接下來賺更多的想象，經驗系統輕鬆壓倒理性分析系統較為謹慎的意象；情感在泡沫戳破接踵而來的恐慌中天翻地覆，沒人再想從飆股獲利，掉入負面情感的漩渦中。情感系統閃現這下要大賠了的意象，股價跌越多，負面情感越強烈，多數投資人心中只想到要在跌更多之前「快跑、快跑」，不用多久，這意象就會演變成末日即將到來。


    情感之為用，不以商場為止境。從賣車到時尚界，數十年來各行各業的行銷人，都知道要善用情感來操弄買家對自家商品的偏好；研究人員開始著手研究它在其他行為領域，對刺激團體採取某些愚蠢或致命行動的作用，如球迷暴動到謀殺及至於種族滅絕。雖有
    1945 至 1946 年紐倫堡審判，和 1945 年海牙國際法庭的嚴懲，自納粹大屠殺以來，世間發生了不下數十起令人髮指的事件。仇恨以情感為媒介，發展到極致的情況，令加害人不把受害者當人看，而視為洪水猛獸，必欲除之否則無法自保。情感可能致使行為與人之常情之間的差距不可以道理計。


    情感的作用也可能非常隱微。例如，你看好默克（Merck）集團，製藥類股欲振乏力，你想要好好做些功課，但股價開始上漲，沒時間了，於是你訴諸情感（通常沒有自覺），而這做法正投你意，強化你出手買進的意願。


    情感可能讓人上當，有時下場會很慘。要是感覺一來聽從自己直覺，發'
