  md: '有沒有哪類投資人有賺到超額報酬，由於容易到手決策和績效的資訊，基金經理人最常被當成實驗的小白鼠。研究顯示無論調整風險前後，基金績效皆未超越大盤平均，但風險調整後、支持效率市場假設的結果，如今不無疑義。


    # 問題統計與袋鼠法庭


    1960年代和1970年代早期的基金統計研究，並未呈上投資人高於平均的績效，就做出對效率市場假說有利的呈堂證供。


    仔細查證後，效率市場的勝利就被沒收了。研究顯示，當時研究者所用的風險調整工具太過不準確，連重大的基金經理人超額績效都可能遭忽略；所用的統計檢定將難度訂得太高，以致非常難看出存在的超額績效。例如有人指出，套用詹森的辦法後，在一般最起碼的95%信心水準下，115個經理人當中，只有一位繳出超額績效。²⁹


    尤有甚者，這經理人是在14年間，每年多賺5.83%。厲害的經理人在這麼長的期間，1年能多賺1.5%或2%就不得了，詹森對經理人打敗大盤的要求，可說高到不像話，巴菲特和約翰．坦伯頓（John
    Templeton）這等級或許有這樣的功力。有個經理人20年間每年多賺2.2%，但照詹森的算法，這成績仍未達統計顯著。³⁰詹森當時這麼寫：「沒什麼證據顯示任何個別基金能夠顯著超越隨機的期望值。」³¹


    另一份應用標準風險調整技巧的研究指出，在95%信心水準下，無法斷言一個10年間上漲逾九成的投資組合，結果優於另一個下跌3%的投資組合，還提到：「給定合理的年超額績效與變異（波動性）水準，約需70年的季資料才能達到95%信心水準的統計顯著性。」*


    美國總統經濟顧問委員會前主席勞倫斯．桑默斯（Lawrence Summers），


    * 超額經理人績效的統計標準，著實讓人不敢恭維。'
