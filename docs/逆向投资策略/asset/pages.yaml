  md: '輕描淡寫地指出統計工具說服力低的問題，他綜合研究結果後，估計要用到5萬年份的資料，才能做出讓理論死忠陣營滿意的否定結果。效率市場假說續效與風險衡量工具說服力之低，無法如實劃劃卓越的續效，偏偏這又是推翻這假說的要角。³²
