  md: '地方掙錢，從上千筆交易賺點小錢。”⁷就像是一台巨大的吃角子老虎機，擺在賭場大廳靠源源不絕的賭客銅板聚沙成塔。


    眾人對這個策略的信心要歸功於墨頓，這位風險大師為效率市場假說做出了重大突破，後來榮獲諾貝爾獎的桂冠。如同眾多效率市場假說追隨者，墨頓相信波動性是唯二要衡量的風險，這也變成了長期資本管理公司方法的基礎，而且他還確信波動性大致保持穩定，有一定波動性的股票或債券，雖然波動率一時高一時低，但總會回到設算的水準，如此一來，波動性就能為長期資本管理公司所用，若配對交易中買進的債券，波動率一時偏高，放空的債券波動率一時偏低，照理說都會回到正常的水準。買進債券的波動性越高，賣出債券的波動性越低，當風險趨於正常，對這筆交易的報酬越有利。這門有好無壞的生意便是基於這項未經證明的假設。


    這策略另一個前提是波動性的估算要具有可預測性。對波動性還有可能出問題的情況進行大量的測試後，長期資本管理公司根據墨頓的原理，也就是波動性不會改變，認定自己有辦法算出最好、普通和最壞情境出現，以及投資組合大虧或倒閉的機會，結果顯示，即使在惡劣情境遇到最嚴重的金融風暴，這家公司都能撐過去。


    不只有長期資本管理公司認為波動性的算法在數學上可以得到可預測性，整個圈子內都這麼想：布雷克—休斯選擇權評價模型假定波動性可以預測，世界上各大金融中心的交易室，緊盯波動性不放，彷彿它能傳達神諭。各大交易所紛紛聘用法瑪、墨頓、休斯或其他效率市場假說宗師的徒子徒孫，也不會質疑這些年輕博士所學，諸如昨天價格是今天價格的可靠預測指標之類的前提假設。在探討長期資本管理公司失敗案例的《跌落神壇：長期資本管理公司的盛衰》(When
    Genius Failed)一書中，作者羅傑．羅溫斯坦（Roger Lowenstein）引述該公司媒體發言人彼得．羅森塔爾（Peter Rosenthal）的說法：「風險是一條波動率的函數，是可以量化的。」⁸「梅利章勒、墨頓、休斯和公司當局對此沒有半點謊言。」⁹長期資本管理公司投'
