    已熟悉心理與股市交互作用的讀者，會在本書中發現若干熟悉的主題與告誡，但有些大幅推進人們理解投資策略的最新研究發現，會令每個讀者都感到新鮮。情感理論與神經經濟學這二個特別令研究人員有興趣的主題，尚未被華爾街收進概念工具箱。


