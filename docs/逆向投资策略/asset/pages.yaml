  md: '頓請願，只因爲他們認爲美國已放棄了他們，未來只有貧困潦倒的份。小約瑟夫・甘迺迪（Joseph Kennedy）擔心當時的危險情緒失控，以及國家體制會發生重大變化，據說曾表示要放棄自己的一半財產，以換取家人可以平安享有剩餘的財富。¹我們今日也正處於風雨之中，但歷史上還有過更糟的時期。


    我們在本書中討論的工具幾乎都基於現代心理學，這些工具一直是有效的，並且除非人性大變，否則在未來仍將有效。也請記住，這是一套全新工具，嘗試過的人並不多，有些是因為不知道它們存在，有些則是因爲現行學術理論對它們頗有微詞，但主要還是因爲它們是基於心理學。要堅持特立獨行實屬不易，更難的是要避免來自情感、神經心理學、過度自信以及許多其他類似力量的拉扯，而使我們倒向了另一邊。這些力量會一次又一次襲來。儘管我研究了這麼多，這些力量影響我的程度，仍超乎我的想像。


    但是，如果我們能徹底了解這些力量的本質，我們不僅可以避免其可能帶來的重大損害，還能操縱自如。這就是本書所介紹的策略之真正目標。同時，這也是我們基于一切證據、研究、分析、投資經驗，日復一日在市場上辛苦細膩操作這種新方法從而獲致之結果。合理地選擇並善加管理穩固的反向型投資計畫，將使我們在市場上脫穎而出、一馬當先。


    預祝願意嘗試這套新投資心法的讀者好運連連。'
