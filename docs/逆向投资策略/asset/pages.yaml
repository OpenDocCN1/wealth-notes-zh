  md: '1997年，可疑的會計問題、欠款和違約率都高出預期，再再說明金融業明顯低估貸款風險而開始自亂陣腳。1996年作這項新貸款的前十大創始機構中，到2000年只剩下一家。信用評等機構、聯合會、監管機構和銀行是否還記取這個慘痛的教訓？眾所周知的是，他們並沒有。才過了1年，次貸需求再次激增，房價急飆飛漲。房地產泡沫化於焉開展。


    # 次貸雪球


    在1996至2000年高科技泡沫崩潰之後，葛林斯潘主席領導的聯合會大幅調降利率，制定了非常寬鬆的貨幣政策，緩解估計超過7兆美元的巨大市場損失。在2000至2002年市場崩潰後，聯合會擔心這些損失可能會造成消費市場嚴重緊縮，影響企業減少支出，從而使美國經濟陷入衰退。所以，為了防止這種情況發生，隨著高科技泡沫的破裂，聯邦資金利率連降13次，從2000年中的6.5%降至2003年中的1%。長期國庫券利率則從7%降至4.5%。¹⁶


    高科技泡沫在2000至2002年破滅後，人們意識到，儘管許多人在市場上損失慘重，反觀住宅，雖然在資產淨值中占了最大比重，不但完好無損，而且還在穩步上升。從2002年開始，房地產市場掀起一陣熱潮，正如我們所見，供給過剩成為禍首，幾乎摧毀了全球金融體系，也讓整體經濟氣候陷入1930年代以來最糟糕的處境。


    2002至2007年間，新購置住宅的房貸放款創始金額（originations）達12.5兆美元。高風險的次貸放款創始金額，遠遠超過一般抵押貸款，從2002年僅占整體房貸比重的6.6%，到2006年已高達21.7%。¹⁷次貸市場拿下了大滿貫！


    但就像金融產業常會有的事，真相不存在於漂亮年報或季報誇誇其談的字裡行間，而是隱祕在厚厚的後頁注腳中，暗禱永不被發現。'
