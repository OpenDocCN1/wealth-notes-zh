  md: '# 2. 我們應該完全放棄證券分析嗎？


    正如我們看到的，根據逆向投資特點選股且不依賴於證券分析，長時間下來所得到的報酬率優於市場平均值。那麼，我們應該考慮丟掉證券分析嗎？我們的證據明確指出，幫助不大。但是，我不會做這麼絕（這不僅是因為我已經摸透了這些老教條）。我還相信在逆向框架內，它有些地方仍然是有價值的。


    逆向投資法把傳統分析裡很容易出錯的面向排除或降級了，例如預測。我相信，在體認到證券分析有侷限性的前提之下，你可以在逆向投資法中借助它來達到更好的投資結果。然而，對於許多人來說，符合本書原則的分散式逆向指數型基金是種可靠的投資方式。不幸的是，這類投資標的選擇並不多。我們公司管理著從大型股、中型股到小型股一系列逆向指數型基金。*因此，對我來說這不是大問題。在過去的30年裡，逆向操作的表現反超市場以及從小到大各種規模的指數型基金。逆向操作的觀念已勢不可擋，不過還是要詳讀這類基金的募股公開說明，以及徹底審查它們的投資組合，以確保基金經理人實際上是否按他們所說管理你的資金。


    我會在之後的章節盡量說明，如何使用五個基本指標來補強我們剛剛探討的A-B-C逆向選股法則。我們將討論其他幾種不仰賴證券分析評估的逆向投資方法。這些也會帶來超過市場平均值的投資結果。在看過這些方法之後，你便可從中選出最適合你的方法。


    # 3. 五大選股指標


    我自己在應用低本益比法時，是以本益比最低的那20%為選股標的。這一組股票為隨後的輔助指標提供了很大的應用空間。


    正如我之前所說的，如果你勇於嘗試證券分析，那麼以下是我認為最有


    > * 曼魯市場過度反應基金（The Dreman Market Overreaction Fund）。'
