  md: '差會誘發多巴胺神經元急轉彎。如果實際獎勵未如預期，則在獎勵結果揭曉的當下，多巴胺神經元會變得很消沉。這儼然是種錯誤編碼，與預測誤差會直接控制預測學習進程的看法不謀而合。²⁰事實是，沒有正面獎勵這回事，只有負面結果會產生，投資組合中若有最佳股遭遇負面意外的情形，每一支都極有可能面對股價掉得多又快還止不了的跌勢。正如我們所見，正、負面的效應至少會持續四個季度。


