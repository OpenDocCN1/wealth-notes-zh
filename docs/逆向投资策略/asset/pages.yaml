  md: '隨後，在 2011 年中，美國參議院常設調查小組委員會（Senate’s Permanent Subcommittee on Investigations）展開調查時，貝蘭克梵和其他官員聘請了刑事律師。小組委員會的報告指責高盛誤導客戶進行與抵押型的複雜投資。小組委員會主席暨參議員李文也指控貝蘭克梵誤導了國會。30
    至於高盛在此期間為了出清庫存，是惡意賣空還是賣出大量高評等債券給客戶，目前也還有其他訴訟在進行中。高盛成功賣空給自己客戶的機率，似乎比本章開頭所設想的賭場還來得高。


    眾議院小組委員會在 2010 年舉辦的聽證會中點名的投資銀行，不只高盛一家。在撰寫本文時，摩根士丹利和花旗集團也還在調查中。高盛與美國證券交易委員會則達成了一項大型和解協議，除了繳交
    3 億美元的罰款外，高盛將向相關機構投資人賠償 2.5 億美元。


    不只高盛，還可能有許多銀行都沒跟客戶分享這些投資訊息，這本來就是他們的信託責任，但是正如我們所見，他們實際上把這些證券賣給了客戶。儘管這樣做未必違法，但顯然違反金融倫理，這是大多數人都無法原諒的。一樣爛的是，該公司和許多其他公司在眼見次貸市場瀕臨崩潰邊緣之際，還以新的承銷方式向客戶銷出價值數百億美元的劣質不動產抵押證券。承銷商负有信託義務要提供客戶其對市場狀況的看法，同時只將他信賴的證券賣給客戶。高盛和其他許多公司都不及格。


    諷刺的是，2008 年 9 月金融恐慌發作時，投資人紛紛從高盛和摩根士丹利撤出資產。而這些機構因為聯準會出手將它們轉變為銀行，並提供了大筆金援才生存下來，就像迫於無奈拯救花旗那樣。紓困計畫也為許多處于水深火熱之中的美國主要銀行提供了更多資本。其中大多數銀行在這場金融海嘯中雖然難辭其咎卻也安然度過了，反倒是數不清的美國投資大眾損失慘重。


    你作為投資人，有從這裡得到什麼教訓嗎？我想有以卜幾個。首先，儘管這些金融之狼對市場造成傷害擱在眼前，還有紓困計畫的前車之鑑，但銀行還是處處阻撓金融改革。金融改革會有所幫助，不過如上所述，還不夠完'
  merge: -1
  img_proc: true
- pgno: 384
  md: '美。美國證券交易委員會也沒有在利益衝突問題上採取更積極的做法，專挑小型投資公司的技術性違規大做文章，這點似乎挺出人意料的。


    你應該遠離投資公司和銀行提供的複雜產品。如果好妤堅持遵循逆向型策略，長期下來你會看到績效蒸蒸日上。至於那些不受證券交易委員會監管的產品，無論你買的是什麼，對於承銷商的道德一定要秉持懷疑的態度，尤其在面对銀行和投資銀行的承銷商時更是如此。'
