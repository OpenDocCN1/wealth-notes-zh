  md: '益比、股價現金流量比、股價淨值比，以及殖利率的數據。標普500指數在2011年9月的本益比約為12倍，股價現金流量比為7倍，股價淨值比是1.9倍，殖利率2.3%。


    要想挑出穩健的公司，經驗法則是前三項評估指標可以是標普500指數對應比率的80%，即降低20%或更大折數，而殖利率至少高出市場平均值1%。與標普500指數相比，這些指標的折數越高，你就越能深入逆向投資的領域。


    從前三個評估指標擇一來挑出比率排行最低20%的股票，並沒有什麼神奇的地方，這只是為了給電腦一個適當的範圍。正如我們在所有逆向操作研究所發現的那樣，這個區間總能跑贏市場。


    如果你沒有按照這些策略來均分成五組，那麼也有一種簡易有效的方 法。看看你是怎麼找到這些比率的？你的經紀人應該能夠幫你弄到手。《價值線投資調查》和其他一些刊物正常來說每週都會羅列這些指標以及高收益股票。殖利率每天都會刊登在任何大型報紙的財經版上。你可以再將它們與標普500指數的平均殖利率做比較，後者可以從很多管道拿到。至於股價現金流量比和股價淨值比，不用花大錢就就可以從晨星或價值線等網站或其他各種管道取得。


    縱使我認為逆向投資不必然是所有投資大眾選股的終極方法，但無論市 場好或壞，它始終表現出色。這也是我所知道唯一可以有效、有系統地檢查投資者過度反應的策略，而這種反應到目前為止還是投資人會犯錯的重大根源。


    # 逆向操作策略無法為你做的事


    無論你是選擇折衷的逆向操作策略，還是在沒有任何證券分析的情況下咬緊牙關與市場作對，請牢記策略是相對而非絕對的。這代表它們不會幫助你決定進退場的時機。實際上就我所知沒有哪種策略能夠成功地做到這一'
