  md: '深。券商以各種複雜的技術減少執行客戶的賣單，另一手則繼續執行客戶的買單。如此一來，券商和造市商可以將自己的存貨賣給客戶，並且可以減少手中的持股。


    流動性迅速蒸發是主要的問題。第二天，監管機構和交易所反轉部分交易，但交易價格僅有閃崩前的60%或更低的水準。


    結果是，投資人損失慘重。共計有550萬股、20,000筆交易以閃崩前價格的60%或更低的價格水準被取消。其中至少有一半是散單，而且這還不包未取消的大量交易單，它們的折價幅度比閃崩前要來得更大。³是什麼讓監管機關做起來這麼畏首畏尾？


    對於投資人來說，手上的股票市價幾分鐘內就蒸發了60%，應是聞所未聞的事。事發之後，美股開始針對大盤的股價指數設置熔斷機制。*如果市場漲跌幅超出規定幅度，熔斷機制就會被觸發，以那斯達克100指數中的股票來說，依股價而定，其所允許波動幅度為3%至15%；大多數大型上市股票的價格波動為10%，至於道瓊工業平均指數和其他指數則有額外限制。目前熔斷機制對於漲跌幅的限制相當複雜，而且按股票和市場之別有很大的差異。


    為什麼監管機關在幾個月前還允許散戶承受高達近60%的損失，那可是新規定的20倍？這個問題至今未解。出乎意料（或許沒什麼好意外的），唯一能從這場閃崩事件中撈到好處的就是高頻交易商和大批券商。


    不幸的是，我們又看到交易所和監管機關弄得焦頭爛額。誰是崩盤事件的受益人：小型投資人、共同基金，或以它們為生的高頻交易商和避險基金？這個問題問了也是白問。很明顯地，當監管機構網開一面時，這些機構和小型投資人讓一群卑鄙之徒有機可乘。這是否讓你想起不久前的一波市


