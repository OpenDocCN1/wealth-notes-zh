  md: '# 第 8 章


    # 你敢下多大的賭註？


    1970 年代早期我在當分析師時，還不能上網，線上空空如也，哪像現在大型券商的分析師，立即就能取得對手的報表、盈餘預估變動，和其他價量資訊，資訊的數量比以前暴增太多了，恍如隔世。雖發生資訊革命，但我有信心說，盈餘預測錯誤仍舊非同小可，對判定多數股票的真實價值一無是處，這也不是同行留一手的問題，而是預測本來就不是精確的科學，聽證券分析師的話，更像是看了氣象預報，以為會出大太陽，結果下午變天，淋成落湯雞，兩者的相似度其實超乎你的想像。


    像我這樣的人，偶爾會想贏走底池中所有的錢，不過一般來說，正常人一把投多大？第 2 章曾介紹，分析師若相中一個標的，可能不惜任何代價；若玩家認定自己會中獎，會甘心用相同價錢買賠率是萬分之一或千萬分之一的彩券。我們也知道，贏錢的機率會凌駕投注本身，讓人只看見有利的一面，無視不利於己的一面機率可能高出千倍。


    這樣的人是瘋子嗎？也許有一點，但我們看到許多投資人，勇於在勝算相同的泡沫和投機熱潮中下場玩一把，或在平緩許多但波動仍高，且沒有勝算的市場也敢出手，為什麼人們執意如此？


    當你轉到晨間 的 CNBC 或彭博財經頻道，或翻閱《華爾街日報》時，肯定會注意到主持人或記者，無不豎耳聽取或謹慎引述某些西裝、套裝筆挺的男士或女士的論點，似乎懂市場的就是這些人，在本章會看到這些剛好在當'
