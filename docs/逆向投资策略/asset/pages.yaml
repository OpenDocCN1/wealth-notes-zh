    2000年春季網路泡沫爆掉時，本來承認高風險低報酬的價值股，如同網路和其他被吹捧的股票，經歷了驚人的修正，只不過是評價上調，又一個情感在投資領域壓倒理性分析的例子，這也是無法靠做實驗觀察到的現象。沒多久，人們就開始重新用比較正常的方法來評價網路股和價值股，大幅逆轉了1996至2000年泡沫期間的情況。


    遺憾的是，在逆轉發生之前，情感對包含準退休族在內的眾多投資人的影響，已造成天大的損失，媒體報導數以百萬人得要將退休延後很久。我們介紹的情感領域研究，對這害慘人的現象，提供了言之有合理的解釋。


    正面情感與低風險，還有負面情感與高風險在投資人心目中的關聯性，在泡沫環境中更為明顯，但這現象似乎也也存在於其他市場環境中，後面會討論。風險和情感的相关性，對當代風險管理與財務理論意義深長。


    # 3. 持續性偏誤


    情感讓人對市場判斷走偏的另一個表現，是人傾向高估正面、負面事件或盈餘預估失準影響股票、產業或市場大盤的時間長度。吉爾伯特（G. T. Gilbert）教授等人觀察到，市場人士在經歷開心或討厭的事件後，會一致性地高估正面或負面情感持續時間長度的情況，
