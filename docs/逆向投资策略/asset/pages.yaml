  md: '# 防饒措施 3：產業資金


    產業基金與指數股票型基金的差別在於，前者由基金經理人選股。因此，不管怎樣費用都會更高，而且費率是由基金經理人的績效來決定。不過，其中還是有些投資良機。我建議你先查看經理人至少10年的績效，要是能跑贏所屬產業，便值得一看。另外，也要看看基金的費用。長期表現不佳是高收費的主要原因之一。


    # 防饒措施 4：打敗市場的共同基金


    正如我們所見，自從採用績效衡量法，只有10%的基金經理人在10年期內能擊敗市場。成功的機率看似不大。然而，若你不想親自操作，共同基金確實可以幫你分散投資，只是我們都會希望它能有傑出的績效。所幸，有兩個不錯的方法。第一是在考慮收費和成本的前提下，買入長期績效優於市場的共同基金；我建議至少要看看10年的交易紀錄，而且要確保該檔基金仍由當時締造這些績效的基金經理人來管理。因為，很多時候不是這樣。


    資本有限，最好的方法是買入具有廣泛投資組合的共同基金。這裡有很多資源能幫助你做選擇，包括理柏、晨星、價值線共同基金服務、《富比士》和《霸榮週刊》。*它們能提供基金的季度績效以及發行以來的紀錄。你所選的基金最好是採用與你合拍的策略，並且能在長時間跑贏大盤。光是這樣，你就能把基金的選擇範圍縮小很多。表13-1是一些有價值的大型共同基金在過去10年，歷經牛熊市的考驗所得到的報酬率。裡頭的數據來自理柏。


    > *《富比士》的熊市基金排名是根據至少兩次熊市的績效得出。最佳基金就是所有股票基金中排名前5%的基金；最選則是末5%的基金。'
