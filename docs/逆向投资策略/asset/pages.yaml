  md: '莫（Jim Cramer）就這麼叫過我。網路泡沫破滅的幾個月前，他說我不了解網路股的巨大潛力。好在那時候不是我，而是瑞德莫對泡沫的看法才變成了化石。


    每次泡沫時，等到世人開始明瞭自己追高的股票被高估地多誇張，就會出現跳船潮，當形象從蒸蒸日上，變成要完蛋了，接著就是恐慌；不管是一開始的發財夢或好消息，或是後來的完蛋預言，傳言始終發揮重要的作用；最後，價格跌回起漲點或更低的價位，好戲落幕。


    最有意思的共同點也許是自高點起算的跳水幅度，大抵落在 80% 至 90% 或更高，見表 1-1 和 1-2。


    # ## 泡沫有改變嗎？


    我會嘗試論證泡沫沒改變，真有什麼變化，那就是 1960 年代後，頻率變高；價格的起落更激烈，對金融體系和經濟造成更大的傷害，這種顯著性在美國和其他各國皆然。


