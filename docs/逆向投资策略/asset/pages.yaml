  md: '# 革命性的財務假說


    新的數學分析征服者真的以科學讓衰敗的金融文化氣象一新嗎？什麼問題都沒有？還是其實另外起了一個新的黑暗時代的頭？我們知道歷史上的黑暗時代，是指一段文化和經濟每況愈下的時期，西歐在羅馬淪陷後陷入分裂和衰退，並持續到中世紀初，相較希臘羅馬和文藝復興時代的文化與文明發展，這段期間可說沒什麼突破。18世紀歷史學家愛德華·吉朋（Edward
    Gibbon）就在《羅馬帝國衰亡史》（The History of the Decline and Fall of the Roman Empire）中表露出對於「糟糕的黑暗時代」²的輕蔑。


    我很好奇吉朋會怎麼看待我們這時代。在這個科技、醫療、科學、文化突飛猛進的時代，他會不會質疑為什麼人們的思考能力反而退步了？這種後退並非普世的文化或科技發展，正好相反，它侷限在一個社會科學領域：經濟學。


    過去65年來，經濟學的勢力範圍跳脫象牙塔，影響力大增。經濟學和財務學家秉持的理論，力量大到足以影響全球數以億計人口的福祉，而且助長了人們從20世紀前半所學退步。


    # 簡史


    征服者的新聖經：效率市場假說，是影響數個世代的財務學說。幾十年來效率市場假說已跳脫學術的框架，變成全球金融界最孚眾望的理論。效率市場假說的假設招來批評者異議，相關的研究也多尚未證實，有人進一步指出其前提，連同眾多數技巧高超的研究論文，遭到許多社會科學的發現和市場本身駁斥，但效率市場假說仍當者披靡，贏得不計其數投資人信奉，或透過基金或投顧間接追隨。


