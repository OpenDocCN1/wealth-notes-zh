  md: '1960年代的指數，《霸榮週刊》每期都會刊。


    當然，這種方法還有調整的空間，可以讓你在這個迥異於過去的戰後投資世界裡，更精確地評估風險暴露的程度。


    我們可以清楚從上列圖表中看到，自1945年以來，我們進入了一個投資新世界。通膨和更高的稅負對於固定收入證券*持有者造成直接而持續的影響。這種情況在戰後未減損股票報酬率，實際上更由於股價和股利飛漲而大增。從1949年中至1961年底，道瓊工業指數就漲了355%。


    總而言之，關於風險，你可以從這些事件中學到的教訓，彙整於下列投資心法：


    +   操作心理導航31：由於高通膨和稅負對於股票投資、不動產、住宅以及能從中受益的其他投資有大利多，風險結構已發生永久性的變化，恐不利債券和其他固定收入證券的長期發展。


    如前所述，這種變化已經持續了60多年，但從心理上來說，我們關注的時期遠比60年短得多，所以很難對此風險動態有什麼反應。


    其次，由於股票表現會上下波動，即使我們當中許多人都知道通膨長期下來肯定會對股價產生影響，也無法從心理上全面了解風險的變化程度。結果是，很多人看不清結論，讓我們以此為鑒：


    +   操作心理導航32：已改變的經濟環境清楚地說明，我們越能長抱跑贏通膨的股票或其他投資，長期來說我們的財務狀況會越好。


    本章圖表幾乎直接道出這些研究結果。


    下面還有一則投資心法：


    * 固定收入證券是指所有附息證券，包括公債、公司債券、無擔保債券和儲蓄帳戶。'
