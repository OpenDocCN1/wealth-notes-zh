  md: '激勵一些行為。多巴胺是一種神經傳導物質，可傳遞由獎勵型體驗產生的神經脈衝以及相關的神經刺激，而這些多半是食物、性和某些藥物所引起的反應。在大腦中大約1,000億個神經元當中，只有約莫10萬分之一會產生多巴胺。但這一點化學物質對於你的大腦的選擇機制（包括投資決策）影響甚巨，同時它在酒精和藥物濫用方面更是舉足輕重。備受推崇的專欄作家傑森．茲威格（Jason
    Zweig）曾在《投資進化論：揭開投腦不理性的真相》（*Your Money and Your Brain*）中寫道，酒精、大麻、古柯鹼、嗎啡和安非他命似乎都和釋放多巴胺有關。「這些物質用各種方式影響著大腦的多巴胺觸發帶，從而吸引使用者染上癮頭。」¹⁰
    比吸古柯鹼會讓大腦以15倍速度釋放多巴胺，這代表它在某種程度上可以幫忙傳遞藥物產生的亢奮。南加州大學（University of Southern California）的神經學家安托萬．貝查拉（Antoine
    Bechara）則說：「多巴胺染指了大腦的每個部分。」¹¹ 當多巴胺神經元活躍起來時，它們會在大腦各個區域釋放巨大能量，讓人做出決策並且付諸實行。諷刺的是，吸入古柯鹼之後會立刻刺激多巴胺分泌，這和投資人做完投資決策後亢奮不已的大腦模式幾乎相同。¹²


    多巴胺的作用不僅僅在於求快。投資人更要知道的是，做某些事情可以帶來可觀的獎勵，而為了拿到這些獎勵，就必須這麼做。


    接下來，讓我們看看多巴胺在上述各種盈餘意外中的作用。多巴胺神經元會在獎勵超出預期的事件中釋放，在符合預期的事件中不受影響，在低於預期的事件則會受到抑制。這看來就是前述四類盈餘意外的效應之所以能貫徹到底的關鍵。請記住：觸發型事件和強化型事件非隨機發生的可能性約為千分之一。如果神經經濟學和盈餘意外之間有所關聯，那麼必然會有證據支持，這將為可預測並會重複發生的經濟事件、神經經濟學以及情感效應的研究結果之間建立緊密的聯繫。假使觸發型事件和強化型事件不是純粹的偶然，這種關聯就具有相當大的可能性。在這種情況下，神經經濟學的實驗結果和盈餘意外的研究結果驚人地相似，就會是一個相當吸引人的研究主題。'
