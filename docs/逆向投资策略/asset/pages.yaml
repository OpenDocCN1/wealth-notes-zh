  md: '# 第3章


    # 決策中的危險捷徑


    一個人比較可能碰到以下哪種死因：鯊魚攻擊致死？或被天上掉下來的飛機零件砸死？¹這兩種情況多數人終其一生都不會碰到，但被問到時多半會選擇前者，可惜，他們選錯了。實際上在美國，被天上掉落的飛機零件砸死的機率是鯊魚攻擊致死的30倍。²


    怎麼回事？鯊魚攻擊致死事件雖然超級罕見，但媒體愛報，而且慘烈的場面容易引發遐想，想想經典電影《大白鯊》(Jaws)，³反倒是誰記得自己什麼時候讀過被天上掉落的飛機零件砸死的新聞報導？飛航中的飛機邊飛邊掉零件，砸死地上的路人，好像是電影或卡通才有的畫面，在日常生活中匪夷所思。我們對飛機出問題的想像，不外乎是失事墜機，乘客無一生還的悲劇事件。缺乏第一手的目睹經驗，也沒有讀過相關的報導，我們於是選擇形象較廣為知識的鯊魚攻擊，作為發生機率較高的事件。


    上面的例子說明易得性捷思，這是一種讓人下意識強調心中容易浮現的意象，而不取較為模糊的回憶的認知捷思（cognitive heuristic），⁴以下我們會進一步介紹各種認知捷思。


    # 心理捷徑


    1970年代以來，研究人員發現人們在日常決定的過程採用許多心理捷'
