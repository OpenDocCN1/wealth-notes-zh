  md: '幫助的指標：


    指標1：雄厚的財務實力。在流動性奇缺的市場上，這點很重要，很容易就能從公司的財務報表記載的資訊判讀出來。（相應的比率如流動資產與流動負債比率、總負債占資本結構的比率、利息保障倍數等，你可以在任何金融教科書中，或是一些大型券商免費提供的材料找到定義。）*


    雄厚的財務實力將保證公司安然度過經營困難的時期，反典型公司時不時會遇到這種事。財務實力也有助於判斷公司的股利是否能發放正常或是有所增加。當然，在變現不及的危機之中，比如我們才剛經歷且陰魂未散的金融海嘯，這對於企業能否存活，還是會瀕臨破產，有決定性的影響。所幸這種嚴重危機一個世紀左右才發生一次，或是更久。不管怎樣，財務實力佳的公司在這時期，不僅能存活下來，而且通常也會負債圖強。你不用再找比菲特的波克夏海瑟威（Berkshire
    Hathaway）以外的公司了。


    指標2：良好營業比率和財務比率越多越好，以確保公司沒有結構性缺陷。這類比率的定義一樣可在一些標準的金融教科書裡找到。


    指標3：近期盈餘成長率高過標準500指數，並且在不久的將來不太可能會暴跌。這不是要估出精準的盈餘數值，而是找到整體走向。請記住，我們面對的是處於最底層五分之一的股票，大家對它的期望本來就不高。不同於那些使用傳統預測法的投資人，我們不用精確預估盈餘，只需要注意其短期走向，一般是1年左右。


    在我實際操作逆向投資初期，我算是純粹主義者。當時的想法是：既然逆向操作策略之所以有效，部分是因為分析師的預測失誤，那麼又何必多此一舉去預測了？後來經歷一些相當慘痛的教訓後，我不得不修正這種想法。


    > * 馬丁·佛德森（Martin S. Fridson）的《財務報表分析》（*Financial Statement Analysis*, New York:
    Wiley, 2002），簡要介紹了公司會計，並概述一般投資人要用到的重要財務比率。'
