  md: '經濟大蕭條期間，通貨緊縮環境保全了債券價格上升之勢，一直到二戰為止。但今日不同於以往。隨著通膨再次起飛，國庫券的利率低到近乎零，如第14章所示，國庫券和其他固定收入證券急遽虧損的可能性很高；至於會有多高，我們很快就會看到。


    我認為，我們很可能會進入一個通膨高峰檔，甚至可能和1978至1982年的情況一樣糟，這是由於2008年以來的貨幣供應量爆增。印鈔票不太可能刺激經濟，因為利率在短期內已趨近於零。聯準會的決策看來又出了問題，而我們在近幾十年早已司空見慣。聯準會回購國庫債又再借更多的錢，引起大多數主要貿易夥伴強烈批評，不僅是中國和俄羅斯反對，歐盟特別是德國和英國也在其列。巴西和其他新興經濟體也擔心，聯準會授信原則鬆動之後，會引發另一波資產泡沫現象。18


    國際上擔心的是，這是聯準會在公然削弱美元，意圖增加出口、減少進口。這會讓美國通膨更加嚴重，而且如果其他國家也跟著印鈔，會產生全球性通膨的連環效應。19在這種情況下，如果我們只有中國這個貿易夥伴，這可能會是降低貿易逆差的工具，但實際上我們有100多個貿易夥伴，這種策略不僅是玩火，也不太可能成功，只會帶來更致命的通膨。


    1978至1982年間，價格上漲速度每年達9%，可說是史無前例。從壞的方面來說，美國長、短期國庫券收益分別高達15%、17%。讓我設想最糟的情況，假設通膨率和1978至1982年一樣，而債券收益率是當時的2倍。投資人今天如果持有30年期美國國庫券，將看到利率從2.9%（2011年9月的水準）升至15%，國庫券就算計入利息，暴跌幅度也有63%。但通膨將吞噬另外53%，因此投資人的債券5年期滿，將僅剩下原來購買力的17%左右，這還只是稅前。你會看到，長期債券在這種情況下，只是另一場災難。請記住，到期日越短的債券在通膨加劇時，虧損會越少。


    如果你同意我的分析，請遵循第14章的建議。研究表明，股票在惡性通膨（hyperinflation）之下也能一如既往地表現優異。《散戶投資正典》（Stocks'
