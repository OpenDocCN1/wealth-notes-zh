  md: '# 胡亂預測之三：與預測共識有落差


    不少讀者應該對億創理財（E*Trade）這檔網路股觸股在2009年4月底，因為財報數字比預測低了4%多，導致股價重挫42%一事記憶猶新。2009年7月阿卡邁科技（Akamai
    Technologies）的財報數字比預測低了2%，股價大跌19%；2009年7月賽門鐵克（Symantec）財報數字比預估低了4%，股價跌了14%，反之，2009年10月亞馬遜財報數字比預測高了36%，股價大漲33%。當年大盤則上漲逾20%。


    長期來說，盈餘不符預期影響股價甚鉅。網路泡沫期間的1997年，3Com股價因財報數字比預測低了1%而重挫45%；昇陽電腦（Sun Microsystems）盈餘差6%則是跌了30%。1997年5月30日，英特爾（Intel）宣布6月季度盈餘會比去年同期大增，但仍比分析師預測低3%，結果開盤股價跳空26檔，跌幅達16%，影響所及，科技股和大盤都遭殃，幾分鐘內標普500市值便蒸發870億美元。盈餘預估讓仰賴它的投資人荷包大失血。


    我們還是必須找找看有沒有例外。這些勤快的專門人士有多行？我們知道，一丁點的盈餘不符預測，都可能讓價格大幅波動，目前的投資實務要求預估值要非常接近財報數字，正常來說，股價越高要求越高，市場一般預期財報數字跟預測共識的誤差在3%以內，大部分要求更高。


    這種要求做得到嗎？圖8-2同前，用了216,576筆預測共識的大樣本，分析的股票至少有4位分析師追蹤，共收錄至少86.6萬筆個別分析師預測。很多股票有相當多筆預測值，例如蘋果公司就有40筆，我估計截至2010年底的38年期間，樣本收錄了超過100萬名分析師。


    圖8-2總結我們的結果。預測失準的邊際我們是用5%而非3%，給分析師更大的出錯餘地，即使如此，結果仍不支持有準確預測這回事，預測值的分布狠狠打了自己的臉，僅不到30%與財報數字差距，落在市場人士認為堪用的5%以內；以許多人認為太鬆的正負10%區間為準，僅47%預測共'
