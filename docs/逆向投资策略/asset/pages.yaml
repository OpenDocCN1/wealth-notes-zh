    1973至2010年Compustat財金分析資料庫1,500家大型公司


    ![](img/d19aed57660dca01ca5809b0637666cc_207_0.png)


    0%＝市場平均報酬率（3.5%＝季報酬率，14.8%＝年報酬率）

    所有數字皆經市場調整。

    資料來源：大衛・卓曼，2011年。數據來源：Compustat North American data, Abel/Noser Corp., I/B/E/S,
