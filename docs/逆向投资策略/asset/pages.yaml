    & Gamble）的一半大，市值高達900億美元。相較於美國消費品公司，該公司有著較低本益比和較高殖利率，而且根據分析師預測，其未來幾年內的成長性與美國公司相去不遠。還有一些國外公司也比美國同業更有投資價值，你可以借助價值線投資調查和晨星的網站找到它們，專業人士的話可以使用彭博、FactSet或其他系統。


    你也許能像我一樣，在特定產業中找到比美國企業更有投資價值的公司，或者按國家和產業來建立分散性投資組合。你可以藉由美國存託憑證構建分散性國外投資組合。碰巧許多穩健的大型美國存託憑證，都能輕易通過逆向操作指標的篩選。但請記住，匯率風險仍然存在。如果美元兌股票發行的外國貨幣走升，價格將會下跌；反之若美元走貶，價格則會上漲。


    想要進軍海外市場還有許多的保守策略。一則買入指數型基金或近似 的替代商品，它能代表美國以外的股票的加權價值。如果我要購買外國基金，我會優先選擇在國外市場具有良好紀錄的指數型或反向型基金。17


    第二種選擇是投資前景佳且政治穩定的主要國家，買入封閉式基金。這個方式有時很有賺頭，最好是在它們還很冷門的時候入手。


