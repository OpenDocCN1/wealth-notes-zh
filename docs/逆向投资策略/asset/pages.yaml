  md: '# 防護措施


    # 防護措施1：買權與賣權


    你應該買入買權或賣權來保護投資組合嗎？我們剛剛才說過，買權並非應對恐慌的好投資。選擇權可以在波動的市場中保護投資人。如果投資人認為價格會上漲，可以退出市場買入買權。如果以今天的市價買入股票，將支付較高權利金，因而能用這個履約價行使買權。同樣地，在較正常的市場中，如果認為市場會下跌，則可以賣出賣權，以便能在未來某段期間以市價或接近市價的價格賣出股票；期間越長，權利金越高。


    這聽起來很簡單，但是在動盪市場中，誠非易事。首先，權利金會很高，市場波動性越大，它就越高。如前所述，在2008年12月、2009年1、2月，某些股票的季度權利金上漲了20%，而且要注意的是，年化價格還會更高。這代表，如果買入買權以便日後能買入股票，你得先花一筆本金持有它一段期間，例如9個月。如果股價漲了50%，你也只能損益兩平。這是個好主意，但成本往往太高了。


    同一支股票會有一系列的選擇權，使得這類操作變得更難以計算，而且周圍還有鯊魚四伏。選擇權交易商希望你能把你吃乾抹淨。嘿嘿嘿，這可是場賭局。也就是說，你要向賣方支付正常的權利金（以布雷克－休斯模型計算），*而且如果股票流動性不足，可能要另外支付更多給賣方。


    這種的底線是，除非你經驗老道，否則別買入買權或賣權，這種勝率不是站在大多數人這邊。另一方面，除非你機關算盡它們會帶來的所有風險，否則永遠不要賣出這些選擇權。


    那麼，我們前面詳加探討過的波動率指數又如何呢？它有助於投資者在這類市場中自保嗎？波動率指數產品的賣方，在波動率急劇上升時會獲利，


    > ＊風險溢酬（權利金）既不正確，也幫不了你。'
