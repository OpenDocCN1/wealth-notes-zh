  md: '型投資銀行的首腦，望重當世。多位市場大咖跟隨在旁替部長還有總統做面子。


    部長與若干國內大型銀行與頂尖投資銀行的領導層，共同出面阻止似乎快爆發的金融災難，大型紓困方案由銀行業者擬好立即執行。新聞讓股市雀躍。苦悶的投資人希望這項行動能挽救市場和金融業，但反攻一個禮拜就結束，股價開始跳水。銀行跟大型機構出手都沒救，能指望誰？許多專家這時看到潛在的金融全面崩潰，真的可能發生。


    這些確實是在說 2008 年崩盤前夕，對吧？神奇的是，這些描述同樣適用 1929 年 10 月崩盤前夕風雨飄搖的情況，總統與部長的搭檔，可以是小布希配亨利・鮑爾森（Henry
    “Hank” Paulson），也可能是赫伯特・胡佛（Herbert Hoover）配安德魯・梅隆［Andrew Mellon，曾任三個美國總統的部長，原為梅隆銀行（Mellon
    Bank）首腦，一代銀行家與實業家巨擘，收入僅次約翰・洛克斐勒（John D. Rockefeller）和亨利・福特（Henry Ford）］。


    這些市場崩盤事件影響多深遠？1929 年大崩盤與隨後的大蕭條，波及美國與全球經濟，令美國人對華爾街的寬容態度不變，接著幾年通過重大立法，諸多太超過的行徑紛紛喊停。改革是改革，可是金融體系的信心，經過數十年仍無法恢復；二戰前夕，1940
    年重新實施選徵服役時，證券經紀人被列在 100 項豁免徵召重要類別的倒數第 99 項。1930 年代大多時候，失業率都接近 20% 甚至超過，道瓊工業平均指數成分股的企業價值，1929
    年是 1,500 億美元，1932 年剩下 170 億美元，縮水 89%。


