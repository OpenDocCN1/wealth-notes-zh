    從 1990 年開始，聯準會連續 4 年大幅降息。信貸更好過，而金融科技快速發展也引發店頭衍生性金融商品市場爆炸性成長，衍生性金融商品的名目金額在 1995
    年達到 25 兆美元，到了 2005 年又成長了 10 倍。


    葛林斯潘在鬆綁衍生性金融商品管制方面厥功甚偉，也從未看出什麼警訊，因為這完全合乎他的信念，即衍生性金融商品市場無需監管也能運作良好。甚至在 1990 年代中期衍生性金融商品醞釀衝擊市場，使得投資人損失了數十億美元時，葛林斯潘的政策也未有動搖。他在
    2003 年向參議院銀行委員會作證時說：「我們認為更嚴管管制這些合約是不對的。」$^{13}$ 葛林斯潘在 2008 年市場崩潰期間曾於喬治城大學（Georgetown
    University）發表演講時說，問題不出在衍生性金融商品市場身上，而在於那些起了貪婪之心者。美國聖地牙哥大學（University of San Diego）法學院教授暨衍生性金融商品與金融管制專家法蘭克．帕特諾伊（Frank
    Partnoy）直言不諱地反駁：「衍生性金融商品才是這場危機的真正禍源。」$^{14}$


    葛林斯潘在其政策陸續失敗後，很明顯仍繼續頑固地推上去管制化。因此，當我們快速回顧一連串促成這場大規模金融海嘯的重大決策時，應該提出的關鍵問題是，聯準會對經濟造成嚴重破壞之後，是否應被削權。


    一如葛林斯潘主席對衍生性金融商品固執己見，他在不採取任何行動抑制不動產泡沫化所造成的供給過剩上，更是有過之而無不及。


    次貸問題並非從 2004 至 2005 年才開始，而應該再往前追潮約莫 10 年到 1986 年的《稅制改革法案》（Tax Reform Act），該法案允許主要住宅和第二住宅的房貸利息可以扣除。$^{15}$
    由於消費性貸款無法扣除利息，這使得次貸成本比消費性貸款還要低。該法案如同為那些因信用評等低而無法獲得普通抵押貸款的人打開了新市場。現在要拿到信用貸款不再是問題了，只是利率高了些，因此這個看似有利可圖的新業務，吸引大批金融公司（也就是放高利貸的人）蜂擁而至。'
