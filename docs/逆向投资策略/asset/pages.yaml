  md: '能繼續陷入長期失業的問題。我們當然不樂見這種景況，但是若不正视這個問題，情況就會變得越來越嚴重。


    目前看來，這些做法不太可能會實現，但是時代在變，如果失業率仍然高居不下，而這個問題在未來也解決不了，那麼其所帶來的負面影響會讓越來越多選民擔心害怕。我們從華爾街附近和許多歐美城市裡越來越多群眾示威和露宿中可見一斑。要求實現充分就業的內部政治壓力來勢洶洶，改變貿易政策的呼聲勢不可擋。任何一個政策都不可能躲得了。無論是
    2 年還是 5 年，美國政府終須推動更加積極的公平貿易政策。


    亞當·斯密和李嘉圖都曾著墨於自由貿易的優點。他們會認為，這個國家目前面臨的問題僅僅是貿易國之間的分歧嗎？我相當懷疑，尤其是當國家財富、勞動力正在有系統地流失，或是薪資被迫降低時。我們正在用高生活水準去換取更沒價值的東西，對於我們的後代來說尤為如此。


    # 未來的通貨膨脹


    投資人在大蕭條下劫後餘生驚慌受挫，就算沒一蹶不振也信心潰散了。要不然呢？我們經歷的不只是衰退，而是美國史上第二嚴重的衰退。不管經濟下滑有多嚴重，經濟學家目前都沒有使用「蕭條」(depression)
    一詞，而且不管跌了多少，自 1945 年以來就沒再用過。這個以 D 開頭的字自從 1930 年代以來就沒出現過，這對經濟學家來說，恰是能套用情感理論的好例子，但要是知道這個以
    D 開頭的字如果再度啟用，會對他們造成什麼打擊的話，你就不難理解不用這個字是有怎麼情非得已了。


    不過，不管投資人的痛苦經歷被套上什麼官方說法，我們希望有了這些心理學新工具，你能比一般投資者更知道如何應對未來的處境。我們知道預測本身就存在風險，沒什麼人做得到精準預測。我們也要銘記第
    14 章提到的，股票、不動產以及其他類似的投資績效會與日俱進。'
