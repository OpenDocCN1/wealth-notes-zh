  img_proc: true
- pgno: 156
  md: '在一項把人類當小白鼠的研究，找來臨床心理師，並給予大量案例的背景資訊，問他們覺得自己看法正確的機率。增加資訊的數量，讓這些診斷專家信心大增，但準確度始終在低檔盤旋。資訊少的时候，這些人自估正確的機率是33%，實際上是26%，資訊變成4倍之後，這些人認為正確機率來到53%，事實上是28%，才高了2%。


    有趣的是，這項新資訊數量增加，準確性僅微幅改進的結果，似乎是比比皆是的现象，像是在賽馬場上，一份研究找來8名老經驗的讓磅員，遞次給予5至40項對選馬有用的資訊，結果資訊越多讓這些人自信水漲船高，但說中的次數則否。⁸


    這類研究指出，在不確定的情况下，手中握有的資訊會讓人過度自信，誤以為自己十拿九穩，最早是從面谈的預測能力發現有這情況。很多人以為憑著短短的面談足以對受訪者的行為做出合理預測，舉例來說，分析師拜訪公司高層，雙方談話的時間可能不到一個鐘頭，研究指出這種場合做出的判斷往往有錯。以哈佛商學院為例，校方以為有先面談申請者，收進來後成績會比較好，事實上，這方式不如光看在校的成績就好，可惜照過面留下的印象就是這麼好用，往往會主宰行為。


    照認知心理學家的看法，過度自信有不少的隱憂。有些研究指出，對於相對容易診斷的問題，專家對自己的解決能力看法會比較現實，不過，問題越複雜，而且辦法取決於多個難以量化的因素時，專家會過度相信自已解決的能力（準確度61%），當問題難度破表，例如分辨歐洲人和美國人的字跡，專家變得對自己的能力「超級有信心」（準確度51%）。⁹


    很多研究顯示，人在用有限的知識構築強烈的印象時，會表現出過度自信的傾向。以律師來說，律師習慣高估自已打贏官司的機率，若問法庭的兩造律師這場官司會如何判，雙方都會說判自己贏的機率高於五成；¹⁰臨床心理師、¹¹醫師、¹²工程師、¹³談判人員、¹⁴證券分析師¹⁵都有對自己的預測太過自信的情況。例如臨床心理師覺得自己的診斷九成都是正確的，但事實上'
