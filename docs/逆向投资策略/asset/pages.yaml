  md: '塔布的研究總監亞當·蘇斯曼（Adam Sussman）在文章中所說：「散戶氣瘋了，而高頻交易商以量取勝了。」⁹


    維德布什證券（Wedbush Securities）是高頻交易最大的執行和清算公司之一，該公司執行副總裁蓋瑞·維德布什（Gary Wedbush）在接受彭博社採訪時進一步解釋這個問題。他說：「他們的某些算法和自動系統的交易量，會達到一般波動環境下股票成交量的2、3倍甚至5倍。」維德布什補充說：「我們看到了大量的高頻交易。他們就是做交易，而波動性會震盪出更多的機會。」他提出一個不錯的見解：「你可以看一下波動率指數的圖表〔最廣泛使用的波動率評估指標〕，它與高頻交易量幾近完全相關（括體字是我加的）。」¹⁰把維德布什的話換成非華爾街式的說法，即高頻交易是引起恐慌的元凶，是它掀起股票和指數期貨價格的滔天巨浪，推高了流動性。請記住，股市在閃崩時重挫逾60%，正是幾分鐘內出現類似的波動所致。


    飆升的波動性雖讓高頻交易商獲利豐厚，但由於上下震盪又猛又快，幾乎嚇壞了所有機構投資者和散戶。在極短暫的時間內發生這種波動幾乎是前所未有的，事實也證明它會造成市場恐慌。


    我和其他人一樣，很難認同高頻交易商集團是合法造市商。對我們許多人而言，他們簡直是財富的魔鬼終結者。


    一些交易員認為，這段期間的市場波動起於市場操縱。有不少交易員對於高頻交易水有多深，更是知之甚詳，他們在CNBC受訪時也都強烈支持這種看法。喬恩·納哈里安（Jon
    Najarian）說：我們應該好好討論8月3日以來發生的一切。他特別引用了2011年7月5日當天的整合報價系統（Consolidated Quote System）數據，其中交易申報量激增33%，高達每秒100萬筆。「在劇烈波動的市場中，」他繼續說道：「〔投資人〕甚至未能看到事情的經過。」其他交易員也贊同這個看法。提姆·希摩爾（Tim
    Seymour）則說：「這裡頭瀰漫著人為操縱的氛圍。」交易員喬·特拉諾瓦（Joe Terranova）則說，不論你做什麼都會惹上麻煩。「由於機器的緣故，事'
  merge: -1
  img_proc: true
- pgno: 315
  md: '情突發得更快、更嚴重。」納哈里安則再補一刀：「我們需要美國證券交易委員會和商品期貨交易委員會介入喊卡。」¹¹


    一些高頻交易策略實際上已引起監管機關的關注。他們正在調查大批像電射光般在毫秒之內極速掛出、撤銷的交易單是否扭曲了證券價格，特別是十幾家或更多的公司幾乎同時使用類似的演算法，是否會觸發價格扭曲。如果市場陡降，而潛在的賣單潮突然湧現，那麼投資人很自然會傾向加快出局持股。


    美國證券交易委員會為了釐清高頻交易在重大價格波動事件中的角色，在這幾週調閱了這類公司的相關紀錄，裡頭除了閃崩事件還包括其他無關的活動。美國證券交易委員會主席瑪麗·夏皮羅（Mary
    Schapiro）在今年初的演講中說：「我們需要就高頻交易公司及其演算法來評估整體監管結構。」¹²她提出的關鍵問題是，這些演算法在市場重挫時能否正常運作。商品期貨交易委員會委員史考特·歐馬里亞（Scott
    O''Malia）表示，自 2010 年 5 月閃崩事件以來，有三起類似崩盤與演算法交易有關。¹³司法部和證券交易委員會現在正在調查高頻交易的操作是否有操縱市場之實。¹⁴


    對高頻交易的調查行動在幾個月前蔓延到了歐洲。這些市場產生類似的反應，以致於歐洲最大的證券監管機構，歐洲證券及市場管理局（European Securities
    and Markets Authority, ESMA）著手從嚴制定一系列的新規範以壓制高頻交易。這些規範將速速通過並納入兩條現行證券法規，表定 2011
    年實行生效。紐約泛歐交易所（NYSE Euronext）年初有 6 個交易日因波動性過大觸發三次交易暫停，事發之後便導入這些規範；另類交易平台 CHl-X
    則是在 5 月和 6 月遭遇了三次交易暫停。英格蘭銀行（Bank of England）的金融穩定執行長安德魯·霍爾丹（Andrew Haldane）於 7
    月初表示，高頻交易飛速成長導致價格「異常」，而這個問題恐將繼續擴散。¹⁵似乎每天都有新證據在質疑高頻交易的做法。


    高頻交易環境即使再陰暗再複雜，我仍可清楚看出，高頻交易也許能'
  merge: -1
  img_proc: true
- pgno: 316
  md: '運用在許多交易策略上。然而，從這一切看來，我認為有種策略在最近的這兩次市場危機時期脫穎而出。高頻交易的交易員以千分之一秒的光速放大了市場的漲跌幅。如果市場如閃崩般下挫了幾百點，而賣盤變強，那麼高頻交易公司將大量賣空標準期貨或其他股票工具。這需要高速執行，因此全由電腦驅動。高頻交易公司也可以在開收盤的時間積極進出場，此時市場的漲跌劇烈得很，從而加重了漲跌勢。


    看來大多數高頻交易公司的演算法都是以這種情境來設計的，因此，若一家閃電型交易商開始賣空，其他許多公司的電腦演算法幾乎會同時發出賣空指令。我們已經看到這種戰術如何在閃崩事件讓道瓊指數在
    8 到 10 分鐘內狂減 600 點，接著造成擴大市場的恐慌。這種恐慌情緒從標準股票期貨擴散開來，蔓延到了股市，引發個股拋售潮。一如我們在閃崩事件中所見，市場成了一片焦土、死傷慘重，許多股票暴跌幅度高達
    40% 至 60%。


    我們也知道，高頻交易公司會在幾毫秒內掛出大量的期貨股票買賣單，緊接著在幾毫秒之後又刪單。他們給出的理由看似合理，例如試圖平衡買方的倉位。但是，這和掛出他們不打算執行的大量買賣單有很大不同。後面這種做法出現在陡降的市場中相當可疑，在市場陷入恐慌情緒時這麼做，也許是想把價格壓得更低。如果一群高頻交易公司正試圖壓低價格，先大量掛單讓大盤出現一大波拋售，接著又在幾毫秒內刪單，那麼其他投資人很容易落入這個陷阱，誤以為潛在的大量賣單將在幾秒之後立即湧現，從而導致投資人和交易員趕緊出脫持股，逃命要緊。


    相同的策略可能用在市場漲勢走高之際，唯有在這種情況下，這種策略才會用來支撐漲勢，還可能加快拉升的速度。因此，高頻交易公司在市場走高或走低時都能獲利。無論漲跌，他們所需要的是市場大幅度地波動，這一點從他們所作所為即可證實。最終的結果會是，波動的程度大到反常，有太多人因為這種賭徒行為不得不離開市場。


    市場在低波動性和穩定環境中能茁壯成長，這些有利於投資決策的形'
  merge: -1
  img_proc: true
- pgno: 317
  md: '成。閃電式交易商則是在急速漲跌的不穩定市場中蓬勃發展。正如我們所見，他們巴望用極度不穩定性創造巨額獲利的做法，導致成千上萬的投資人退出市場。了解閃電式交易商如何以提高市場波動性來製造恐慌的細緻手法極為有趣。他們在
    2011 年 8 月的閃崩中大賺一筆，而包括大批專業人士在內的大多數投資人都虧慘了。對於高頻交易公司而言，從這些活動瞬間獲利，無疑與絕大多數市場參與者的利益相背離。


    把高頻交易公司的行為喻之為雪球，再貼切不過了：雪球從山上滾落，一路越滾越大，最後變成了雪崩。記得我們從高頻交易參與者那裡多次聽到過，波動性越大越好。高頻交易公司之所以喜歡它，是因為這種巨大的波動出自他們之手，他們沒說出口的是，這還帶來了大恐慌。


    我們尚不知道主要的高頻交易公司是否操縱過市場。但是，如果我的描述是正確的，從維持市場正常運作的層面來看，這不僅對美國證券交易委員會構成挑戰，對於專業投資者和散戶也是一場嚴峻的抗戰。眾所周知，這幫交易商沒興趣持有股票或指數，也不想付出多幾毫秒的時間參與市場，這對市場構成了真正的威脅。儘管高頻交易正在破壞我們的市場，但絕非故意為之。又不是被逼上梁山，何必殺雞取卵。但是，他們急功好利的所作所為，的確一步步威脅著市場。


    我們如何才能阻止他們對市場的重大威脅？這談何容易。正如我們所見，1987 年市場崩盤時也有過類似情況，當時是由指數套利和投資組合保險交互影響而引發的大股災。但是，1987
    年是偶發事件，而這次似乎是有意的。要不是它們這次速戰速決，高頻交易看起來比較像是能有效維持高波動性的一大利器。


    也許有個辦法能解決，即要求這些公司將他們交易的股票期貨保證金提高 25% 或 50%。另一方法是限制他們快速買賣標普 500 和其他期貨的倉位規模，因為這確實會擾亂市場。第三種方法是美國證券交易委員會在
    9 月下旬提出的建議，即把熔斷機制的漲跌幅度限制得更嚴格，從 10% 降到 7%，並'
  merge: -1
  img_proc: true
- pgno: 318
  md: '使用範圍更廣的標普 500 指數而不是道瓊工業平均指數。^16 第四則是增加每股的交易成本。由於大多數高頻交易公司瞄準每股獲利不到一分錢的搶快交易，因此略微提高交易成本就能大幅減少他們的交易頻率。我敢說，對這個主題有更深刻理解的人，還能提出更多的辦法，也希望他們動作快點，因為我們的市場確實正四面楚歌、岌岌可危。


    # 通往災難的快車道


    美國證券交易委員會和商品期貨交易委員會的使命是要保護大眾，而不是保護一群穿著 T 恤和牛仔褲的電腦能手，而他們存在的唯一理由是在交易上占盡優勢，行掠奪之實。如果交易商提供的是一致合法的服務，並且不對一般投資人或共同基金加重危害，其實很難從他們的交易活動中抓出什麼錯。但是，在我們概括了解閃崩事件，以及
    2011 年 7 月下旬到 9 月更具毀滅性的下跌之後，會覺得另有隱情。美國證券交易委員會便注意到，在閃崩過程中，波動性上升伴隨而來的是股市崩潰。還有高頻交易員可以每秒向數千股股票掛單、刪單的「塞單」做法，以及我們見過的其他手法，也都有其潛在危險性。


    投資界裡頂尖聰明的人已將這些策略整合起來，他們在高速交易系統和專業操作人員身上砸了數千萬美元。這一切顯然不是為了做公益。就我們所知，我們發現閃電式交易可能會危害投資大眾和主要金融機構。儘管著者和許多人都認為，高頻交易引起廣泛的操縱活動，但美國證券交易委員會仍在調查這項指控。我們許多人很好奇，看起來何獨高頻交易公司能在這幾波崩盤中牟取暴利，以致投資人損失大筆資本，對市場失去信心。當然還有很多疑問需要徹底調查。若要保護絕大多數的投資人，直到這些問題有解之前，都應該嚴格限制高頻交易的操作，才是明智之舉。'
