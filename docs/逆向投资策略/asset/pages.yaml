  md: '最厲害的市場資訊科技時，一定也這麼想過：明明買了最頂尖的研究報告和投資建議，投資績效怎麼還會如此之差呢？


    這對他們來說，肯定是難解之謎。


    話又說回來，受專家青睜的股票，真的就是值得買進的股票嗎？答案昭然若揭，絕不值得。分析師和基金經理人鍾愛的股票因為異常盈餘吃盡苦頭，而那些受到冷落股票卻總能從異常盈餘中得益。實則是，投資人的熱情經常把熱門股的股價推得過高，而少了這股推動力的股票就成了廉價股。盈餘和其他意外事件會導致這兩者的市價重新被市場評估，從而反應出更真實的價值。


    這必然是解開謎題的關鍵所在，但我們要如何運籌帷幄，把它放進投資策略的操作實務呢？畢竟我們不只是要分析市場動態，而是想找到從中獲利的投資模式。於此，我不會建立案例式的推演架構，而會直接亮出答案供大家檢視，請你跟我一同確認這種有效投資方法的核心要義，從而掌握下一則投資心法。


    操作心理導航 21：受市場追捧的股票跑輸大盤，而被看衰者卻狂勝大盤。雖然如此，價值重估往往還是慢如牛步，甚至移動得比冰川還慢。


    這個重估的過程深受情感和神經經濟學的影響，這兩類機制都是心理學的新發現，也是在市場上穩定獲大利的致勝關鍵。打從有交易市場之初，人們對於「最佳」和「最遜」的投資向來反應一致且可預期。在此，我們給務實派讀者的答案就是：投資人的行為在這方面有跡可循，不難猜出，所以普羅大眾也能從中獲利。有一些證實有效但簡單易行的逆向操作策略，可以讓你承擔相對較小的風險，輕鬆輕鬆跑贏市場。


