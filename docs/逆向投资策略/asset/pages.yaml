    # 其他風險因素


    當效率市場的風險理論只著重在波動性時，等於是排除了數百年來風險分析所遵循的重要準則。大部分關於風險的證券分析理論，都是由葛拉漢、陶德和其他金融理論先驅編纂而成，不是被擱在一旁就是沒人研究，因為按效率市場假說信奉的說法，這些沒那麼重要，又何必多此一舉呢？不管怎樣，一切全由波動性決定了。


    現在，我們必須讓這些既定風險評估法則大復活，它們可以用來確定風險類型，而當中有不少類型完全不涉及波動性，包括有：


    +   1. 缺乏流動性。

    2. 過度使用槓桿。

