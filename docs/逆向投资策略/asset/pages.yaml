  md: '展總是很理想，那麼人類就不必演化出理性分析系統，並據以處理事務。$^{5}$該好好端詳情感帶給市場的致命缺失了。配備情感這個強大動力來源的經驗系統，會強化獲利的強烈意象。屬情緒性而非認知式的情感，是藥也是毒。


    接下來我們要來看四個令投資人部位失血的重要情感形式：(1)對機率不敏感；(2)險益負相關的判斷；(3)持續性偏誤；(4)時間性構念。


    # ## 1. 對機率不敏感


    情感有好幾個人讓上當，導致判斷失誤的途徑，其中最重要的莫過於讓人對投資漲價或跌價的真實機率不敏感，而未將這個「萬一」的情況納入考量。當可能的結果，像是買股的巨額獲利，夾帶了濃烈的情感成分，則結果的實際機率，或是情況生變導致的機率變化，相形之下便微不足道。$^{6}$


    對機率不敏感的現象有紮實的研究支持。$^{7}$學者喬治．魯文斯坦（George Loewenstein）、艾爾克．韋伯（Elke Weber）、奚愷元（Christopher
    Hsee）和內德．韋爾奇（Ned Welch）$^{8}$曾做過研究，結果顯示，買彩券的人若認為自己會中獎，則無論在萬分之一或千萬分之一機率的中獎條件下，下注金額和中獎的期望會差不多。買彩券的人若覺得自己會中獎，在相同的開獎機率下，願意掏出高達1,000倍的金額！有意思的是，這數字與投機客在投機熱潮時願意為飆股掏出的錢一致。魯文斯坦等人注意到在這種情況，結果大好的可能性，並非機率，更能打動賭徒；結果表明，非常小的機率卻有很高的權重。


    另一份有趣的研究發現，泡沫膨脹時，投資人顯然不在意自己為一檔熱烈首次公開募股（initial public offering, IPO）付的價錢。知名經濟學家勞勃．席勒（Robert
