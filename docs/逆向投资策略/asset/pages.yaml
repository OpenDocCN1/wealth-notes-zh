  md: '我們大多數人其實知道（但並不想記住）的是，我們政府正創下有史以來最高的赤字紀錄。這不僅是赤字金額本身，而且從百分比來看也是如此：2009年（截至9月30日的財政年度）赤字為1.4兆美元，2010及2011年1.3兆美元，另外還有聯準會和財政部超過2兆美元的紓困及貨幣刺激資金。財政部持續大量加印美元，以上列赤字為標準換算，整個問題資產紓困計畫救助銀行體系的總金額達7,000億美元，約占美國財政部用在應付財政赤字、紓困、貨幣刺激的印鈔量的12%。


    如果國會繼續分裂，不削減開支或是提高課稅補足每年7,000億美元以上的缺口，赤字還會繼續上升。隨著大衰退帶來的首波恐慌逐漸退散，投資人不單單只願生存，也開始展望未來。


    即使就業率繼續緩步上升，但通膨還是可能會出現，就算頭幾年溫和上升，之後還是會加速攀升。不僅美國要救經濟，世界大部分地區也得救。中國為刺激經濟投入資金總計2.1兆美元，歐盟5,000億美元，韓國1,170億美元，俄羅斯1,110億美元，巴西800億美元，加拿大580億美元。$^{17}$世界各國都在印鈔救市。


    值得注意的是，實際通膨的先行指標是黃金價格走勢。從2008年10月下旬到2011年8月底，黃金價格上漲了1,117美元，漲幅達156%。石油和大宗商品同期價格也突然上升，漲幅分別是：石油42%，銅149%，小麥54%。全世界都充斥熱錢，印鈔機全天候地持續運轉，而這種情況可能少說也要持續幾個月。


    精明如你，該何去何從呢？首先，不要像那些被嚇壞的投資人一樣：把股票脫手或把賺的錢存進國庫券或銀行帳戶。實際上，那是有點見識的投資人現在最該做的事。我們已經看到，債券和國庫券在1945年之後是如何落敗的。現在的利率是自大蕭條以來的最低點，而這種情況無疑會再出現，並且傷害大批投資人。正像從熱鍋跳進火坑般，在2007至2008年之後，會有大量資金轉投國庫券或其他債券，而這將加劇投資組合虧損的程度。'
