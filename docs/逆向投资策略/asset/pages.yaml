  md: '價以示獎勵。對於熱門的產業類股來說，過程恰好相反：原本的期望過度樂觀，樂觀到連再出色的管理團隊也難達使命。莫非定律：會出錯的事，早晚一定出錯。


    讓我們從剖析「為什麼」回到「怎麼造成的」，看看這種方法能幫到你的另一個原因。買入每個主要產業的低位階股，將為你打開比「絕對」逆向操作策略還要寬闊的世界。無論你採用先前提到的哪種方法：後者能提供給你的選擇範圍，都只有市場中最便宜那20%的股票。而前者可以讓你嘗試整個市場的每個產業。⁶


    逆向投資策略的優勢在於，它的分散性要比原本的逆向操作策略還要高得多。當市場上最冷門的股票和產業被視為是大忌，這種分散化選擇可以防止你的績效被波及到。打個比方，如果通訊設備或生物技術等產業正是當紅炸子雞，你不會有被排擠的感覺，你也不會總被流放到最不受歡迎的組別裡，這有可能會讓你數月甚至數年表現低迷。


    儘管與行業相關逆向投資策略的報酬率低於絕對逆向投資策略，但它們仍然明顯優於市場。據我們了解，散戶乃至於專業人士都很難長期擔任處在不受歡迎的位置，哪怕最終證明他們才是對的。


    有太多的投顧和客戶過於關注季度投資績效，因此，基金經理人的投資績效若是長時間都落於人後，很容易就被妙計魚。的確，他們也許想力證自己才是對的，但很多時候這都是「出師未捷身先死」。對一個人來說，要抗拒這種在心理上想要逃離一切的壓力相當之難，或根本是不可能的。說到底，就是這種心理壓力阻撓著投資大眾接受逆向操作策略。


