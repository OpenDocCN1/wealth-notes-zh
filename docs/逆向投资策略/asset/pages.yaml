  md: '以訓練有素的心理師來說，給他們精神疾病的背景資訊，還有據稱是患者所畫，其實是研究人员所繪的圖後，奇妙的事情發生了，這些心理師會看到自己預期要有的線索：懷疑自己不夠男子漢的男性畫了肌肉線條或外界質疑的眼睛。但圖上的主角其實不只這些，許多情況其實是配角。²¹心理師專注在胸有定見的精神障礙，漏掉了其實同樣存在的重要關聯。²²


    投資人會想把想不透的複雜之處簡化及合理化，動輒將注意到的巧合之處，想成某種關聯性，若買下有關聯性的股票事後上漲，就會腦補諸多漏洞，繼續投資下去，因此市場可說是上演「錯覺相關」的絕佳舞台；看看頭肩頂型態、購買成長股多省事，分析不完的事實，或投資選項的取捨，一了百了，這樣的方法在投資圈子層出不窮，效率市場假說寧管想找出的波動性和報酬理論上要存在的關聯，是另一個例子。問題是有些關聯是錯覺，有些則是巧合，信了就等著倒大楣。有個股票分析師說得好：「要是那時沒賺錢，我會早點在市場上長些智慧。」


    於是我們得出下面這條乍看簡單，卻很難遵照的重要投資心法：


    > 操作心理導航8：做投資決定切忌根據關聯性，市場上一切真真假假的關聯性都會改變，一下子就消失無蹤。


    投資人切記：如果分析師看法普遍樂觀，那麼許多的落空是因為一開始就戴著有色眼鏡看事情，而不是市場事件所造成。


    已故的認知心理學大師特沃斯基，研究股市專家的過度樂觀和過度自信後指出：「有項研究讓分析師作答某支股票在某日前有多少機率上漲逾X美元，平均而言，分析師有八成的把握，但準確率只有60%。」²³這類研究屢試不爽。


