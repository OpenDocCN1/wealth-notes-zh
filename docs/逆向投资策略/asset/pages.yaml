  md: '資主義者仍在少數，而且未來很可能還是如此。


    這種情勢發展有其歷史緣由。你應該還記得效率市場假說如何橫掃股市，肅清華爾街的異教徒。效率市場假說派以新的正統投資觀念，長期主宰繁榮的市場，無可撼動，更別提如果相競觀點流入華爾街，能帶來多大的影響。當然，這與我們將要檢視的其他群眾反應一樣，都是關於人性的心理學。


    在1970年代末期和幾乎整個1980年代裡，我們的工作成果，在效率市場的提倡下顯得抬不起頭，尤其是在那些市場基本教義派所構築的崇高聖堂裡（我指的是芝加哥大學）。我身為異端分子的頭頭，不時會引來那些虔誠信奉者的怒吼。我的工作更是處於猛烈抨擊的高壓之下，而我的《富比士》專欄還很榮幸地成為發給各班學生批判的箭靶。不幸的是那些可憐的編輯們，屢屢收到十幾封信撻伐我的作品，基於善意的回應，有幾封還被刊了出來。


    隨著我的書和其他文章問世，炮火更形猛烈。這些來信會逐漸擊破我的研究結果，用一些不太好聽的話攔截筆者的原意。沒有人抓出裡頭有任何統計上的錯謬，但他們卻質疑我的信念蠻不講理（Neanderthals）（譯注：尼安德塔是1856年首度為人知悉的古代人種，後引申為獨斷專行、蠻橫跋扈的野蠻人），只因為我不能理解效率市場的思維何以能力壓群雄，又為何美妙了。


    當我在1977年向《金融分析師期刊》投稿相關研究結果的論文時，論文既沒被接受，也沒遭拒絕，而因為裡頭的觀點不合乎主流投資典範，被打入持保留態度的煉獄中。


    不過，低本益比的反常現象還是存在，而且大到能不斷吸引學界和華爾街的關注，尤其學界還是用過時又萬年不敗的風險評估方法摒棄不用。理由是低本益比股票也許能帶來更高的報酬率，但它們的風險要大得多了。他們是這麼批評的：理性投資人想要高報酬，必然承擔高風險。不幸的是，結果證明這種說法似乎也ㄍ大正確。'
