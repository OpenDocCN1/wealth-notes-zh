    像是規模630億美元，股東逾百萬，由三名經理人分別管理的麥哲倫基金（Magellan Fund），怎麼有辦法續效贏過市場十幾年，而坦伯頓和管理溫莎基金上百億資產的約翰·奈夫（John
    Nef）怎麼有辦法續效贏過市場20幾年？這些閃亮的成绩只靠公開資訊？真如效率市場假說陣營宣稱的，純屬巧合？還是只是讓這張「異常」清單多了一項？那麼我們得好好看看其他投資機構如何繳出異常報酬，而且不能再像詹森那樣，要換一套真的看得出卓越續效的統計方法。


    # 為何不重算有問題的效率市場假說續效？


    那麼，照理論要保持中立的學界，再出現更好的統計方法時，有改正原先的結果嗎？看樣子是沒有。雖然證據存疑，詹森有問題的基金研究結論，仍被拿來支持效率市場。


    雖然法瑪和弗倫奇等人表明資本資產定價模型在衡量風險方面沒有用處，故事並未就此結束，除詹森的例子外，礙於所用統計工具的問題，調整風險和未調整風險的基金續效也有誤導的情況，但效率市場假說陣營也是一直不去重算，好看清基金與市場的相對表現。前面提到，優越的續效因為衡量方式不當而泯沒，偏偏這又成為效率市場假說用來顯示市場效率的「確證」。續效超越市場的經理人多半埋沒在冠冕堂皇的統計術語底下了。


    貝他與其他學界風險測量值仍陰魂不散，替效率市場假說託夢，除掉任何理論不容的超常續效，這不過是死忠陣營用的一個手段。'
