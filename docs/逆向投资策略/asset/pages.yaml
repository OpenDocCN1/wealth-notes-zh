  md: '# 第 4 章


    # 外表斯文的征服者


    16 世紀的西班牙征服者對黃金念念不忘，這群匪類探險者聽說祕魯有一個由全身塗滿金粉的國王統治的黃金城，但四處尋找仍未發現它的下落。


    時隔近五個世紀後，信念再度湧向更大的機遇，征服者不用再打仗，改築起了學術的壁壘，穿著得體，但別被這群人謙謙君子的外表騙了，他們持有投資圈當中最強大的武裝：高等數學和統計學搭載先進的電腦與程式，而且做出了驚天的發現。一批任職於全美（很快就在全世界開枝散葉）各大學的理論家，想出一個聲威天下的新理論，令華爾街與整個投資界的思維為之一變。這些人心如鐵石，心中學術信念之強烈，不下於數世紀前探險者的宗教熱情，而且本事強足以嚇阻任何膽敢挑戰的愚者。


    我認識好多追隨這批理論家尋訪新黃金城的信徒，他們有寫滿數學的地圖，以及解說投資人決策和市場運作的高妙理論，而且仍想更上一層樓，掌握解開市場奧祕的大門鑰匙。


    這些人的論證讓人想起溫斯頓．邱吉爾（Winston Churchill）對俄羅斯的形容：「一團迷霧中的謎中之謎。」 ¹為了理解論證的問題所在，我們先來檢視他們的論證如何在科學上取信於人。'
