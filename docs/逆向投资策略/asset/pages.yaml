  md: '這一切若以效率市場來解釋，看似簡單。風險先生，也就是波動性先生，真是個正人君子。他會表明他是誰、做了什麼，所以我們幾十年來一直仰望著他，根據他所指示的風險程度調整投資組合，一切就好像小提琴演奏家上台調弦那般可調可控。這讓我們以為人類有歷史以來就四處橫行的風險魔鬼已被關進了籠子裡。


    但後來情況不同了。我們在這個日趨艱困的新投資世界中漸漸發現，波動性先生並非像他聲稱的那麼正直又善良。實際上，他開始看起來更像一名對投資人指手畫腳的聰明胖子，在投資建議陷入績效落後的窘境時，又開啟了一言堂，對質疑者施予威脅。


    讓我們用點專業術語來解釋。正如我們提過的，貝他係數和其他波動率指標被視為是客觀的風險評估法，揚言要排除混亂而不準確的人為臆測，其中貝他係數更成為效率市場理論中計算風險的試金石。一切看起來天衣無縫，不過從股市的長期績效數據來看，有個小問題再也藏不住：更大（或更小）的波動性與實際報酬率並無相關性。波動先生的數字失靈了。唉呀，他耍燦蓮花提出了一套優雅而易懂的理論，讓大多數投資人樂於按這套理論來建立投資組合策略。但是，他所面對的爭議，就像是湯瑪士．赫胥黎（Thomas
    Huxley）在 150 多年前，擁護查理斯．達爾文（Charles Darwin）的進化論而槓上狂熱的創造論者那般熾熱。當時，赫胥黎曾以創造論者的思維反將一軍：「用醜陋的事實扼殺美麗的假設，〔是〕科學的大悲劇。’


    這些數據如果還不夠看，我們在第 2 章還看到，未經檢驗的風險經濟學理論和風險行為的情感研究發生了火車對撞。有許多關於情感研究的實驗發現，風險和利益呈負相關。承擔較高風險所帶來的知覺利益較低（而非較高）；反之，承擔較低風險的知覺報酬較高。這些發現與效率市場假說最核心的風險觀背道而馳。


    最後，投資人在一波波的狂熱裡一頭栽進積極型股票，這些股票被歸為低風險但實際上卻有大幅波動，至少有部分證明了近期情感研究的真實性。'
