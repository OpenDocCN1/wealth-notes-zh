  md: '說遭受嚴厲挑戰，這個假設都不會被棄守；即使核心信条事實證上被推翻，它還是會活下去。所以，資產資產訂價模型被推翻時，效率市場的套斗說，我們有新的風險測量方法，而且有更多人尚待發現；逆勢操作價值策略繳出勝過市場的績效時，效率市場陣營說這方法風險較高。效率市場假說走上的科學發現途徑，正如孔恩預測。


    第四部分會根據我們學到的可預測的投資心理學，加上實證強力支持的假設，提出新的市場行為典範，好消息是如此得出績效超越市場，而且經得起時間考驗的方法；不好的消息是，如果孔恩的預測是對的，那麼這方法可能要花很多年才會通過學術的難關。


    孔恩也提到，新研究不僅會被拒絕，有時還會讓追隨者受罪，比如，文藝復興時代的诗人和哲学家焦爾達諾·布鲁諾（Giordano Bruno）被處以火刑，伽利略遭到軟禁。以科學發現史為鑒，早知效率市場假說研究者容不下反對陣營，而且不意外地，也不會有容許異議的言論場所，畢竟學術期刊一般不會刊登離經叛道的著作，即使出自有學識的投資人或心理學家之手也一樣。


    還有，效率市場假說追隨者不會不屑攻擊與自己信念不合的研究，例如《霸業週刊》和《富比士》1980年代早期曾刊登質疑效率市場假說效力的報導，結果引來學界數個月猛烈炮火抨擊，口氣不外乎像是：區區雜誌膽敢挑戰學術大家的研究？


    另一個典範轉移會讓眾人怨難接受的特徵，同樣也出現在效率市場假說，是研究者會用不少方法讓黑天鵝消失。對效率市場假說研究的批評要嘛被消音，例如上不了重要財務或經濟期刊，要嘛是方法上被雞蛋裡挑骨頭，如逆向操作策略在證據無可挑剔之前的情況，後來效率市場假說改說這套策略風險肯定較高，但一直說不出理由。


    若黑天鵝無法當作沒看到，那就興師問罪。資深學者在辯護時，愛用資料挖竄這招，說你只挖掘自己想要的資料。這項指控當然不會拿來對付效率'
