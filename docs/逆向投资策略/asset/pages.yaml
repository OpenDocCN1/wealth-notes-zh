- pgno: 403
  md: '真的很榮幸能與特沃斯基共同撰寫多篇學術論文。特沃斯基英年早逝，他可說是行為經濟學領域的先驅。


    在寫這本書時，我很高興能與2位精通投資和行為財務學的顶尖研究人員共事。首先，我要對傑森·奧特曼（Jason Altman）說聲謝謝，他是傑出特許金融分析師、資深基金經理人以及分析師，這本著作有很多關鍵內容要歸功於他優秀的研究工作。我還要感謝行為財務學博士伊列娃，因為有她嚴謹的統計研究，以及在行為財務學領域的豐富學識，讓本書的研究成果更形豐富。最後，米哈爾·史匹哲（Mihal
    Spitzer）和莎拉·喬伊斯（Sarah Joyce）在圖表呈現上也表現得可圈可點。我在此向這4位表達由衷的感謝。


    我和西蒙與舒斯特合作融洽，同時還要感謝我的編輯艾米莉·露斯（Emily Loose）為本書貢獻的心力與時間。


    當然，本書若有任何錯誤，或者被讀者認為是錯誤的思想，請將責任全歸咎於作者。


    大衛·卓曼


    2011年9月30日'
