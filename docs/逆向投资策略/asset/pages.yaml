  md: '等你壯足了膽子，我們立刻掀開看看這裡頭的內幕。裡頭有各式各樣保證會讓買家虧成大魯蛇的商品。再速速瞄一下抵押貸款中介或承作貸款機構的辦公室，那裡有各種好东西，等著想接手的債權人（譯注：又稱抵押權人）上門。


    他可能會這麼說：「我們這裡有忍者，產品跑起來超快。」「什麼是忍者？」有人這麼問。「嗯，實際上，這是業務們用來稱呼此類抵押貸款的縮寫代號。它代表購屋者沒收入、沒工作、也沒資產的抵押貸款。但請不必擔心，房市炒得可熱的，房價還會漲，一切都穩穩當當。」貸款中介可能會這樣告訴你。


    另一位推銷員會接著說：「看看那邊，我們正有專人負責負攤提房貸（negative amortization mortgages）。忍者買家真的很喜歡這種產品。」請問這又是什麼？其實很簡單！買方在2、3年內無須支付房貸利息，就可以立即搬進去住。3年後，由於未償還利息滾入本金，他欠下的債務變成原本的140%，但沒有銀行或抵押銀行家會在乎。他們將這些抵押貸款的債權，像燙手山芋般丟給了機構型買家。這一切對他們來說都會變成利潤，有些是馬上落袋為安的巨額佣金以至數百萬美元的年終獎金。


    有誰會貸20萬美元給口袋空空的家，還巴望他3年後還得了28萬美元？回想起來，答案再簡單不過了，那就是我們納稅人，是我們紓困了銀行。


    接下來，我們進入次貸拍賣場裡最大的區塊：指數型房貸（adjustable-rate mortgage, ARM），它通常會以很低的誘騙式優惠利率來吸引顧客。有兩種非常受歡迎指數型房貸分別為
    2-28 和 3-27。2-28 指數型房貸指的是，房屋貸款固定利率為 2 年，其後的 28 年浮動利率為 11% 或 12%。3-27 指數型房貸則是房屋貸款固定利率為
    3 年，接下來的 27 年浮動利率為 10% 至 12%。指數型房貸非常搶手，占 2005 年所有次貸放款初始金額的 80%，即超過 170 萬筆交易，在整個
    2000 至 2007 年房地產輝煌時期則占了 70%。 ${}^{18}$'
