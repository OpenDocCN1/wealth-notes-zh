  md: '示，即使獲利或利益性質上不同於風險，風險與回報之間仍存在負相關性。投資人難以理解的是，從心理面來看，風險報酬兩者往往負相關，但來到市場，我們卻要理性地認為兩者正相關。


    一篇阿里·阿爾哈卡米（Ali Alhakami）和史洛維奇¹³的論文指出，對一項活動（如噴殺蟲劑）的風險與利益意識，與在這項活動的正面或負面情感有關係，結果顯示，人越是喜歡一項活動，像是參與試驗中的癌症療法或買網路股，越會做出風險低，利益高的判斷。相反地，越不喜歡一項活動，如燒煤加熱、飲酒或買牛皮股，則會對其賦予較高的風險。


    阿爾哈卡米和史洛維奇的研究結果意思是說，人除了根據思考，還會憑感覺來判斷一項活動或計數的風險與利益。人若是很喜歡一個點子或概念，會憑感覺判斷它的風險不高；情感再度出動，這次是讓感覺插手並更動理性的決策與風險選擇，這在金融領域獲得約夫·甘扎赫（Yoaav
    Ganzach）¹⁴的研究支持。甘扎赫發現，對於觀感好的股票，人們會判斷它報酬高風險低，對於觀感差的股票，會判斷它報酬低風險高，不過，對於很熟悉的股票，則不會用這樣的態度，而是覺得風險報酬兩者正相關。


    這項重要研究解釋了圖2-1和表2-1背後情感扮演的角色。由於投資夾帶非常正面的情感，股票的價位比真實價值高很多倍，投資這些股票的風險可能淹沒在強烈的情感之中，不願眾所遵循的投資原理。分析或邏輯的比較，雖顯示1999年末那斯達克觀股的估值灌水嚴重（表2-1），卻未改變投資人認為持有風險不高的看法。


    情感影響所及，分析師也許真的不認為風險因子相對預期報酬來說太高，這現象對估計當情感之類的情緒面被牽扯進來，現代證券分析或廣義的理性分析過程的效果很重要。網路泡沫最盛那陣子，我讀了很多分析師的報告，很少對重大風險進行分析的內容。風險往往顯而易見，如在eToys.com的例子，或數百家財務狀況乏善可陳、管理堪憂、事業營運計畫不怎麼樣，股價卻飆漲的企業。只要是稱職的研究員，都能快速抓住這些因素，但要嘛'
