  md: '信心。1990年代後期網路泡沫時，大家認為網路股前景非常好（接受的資訊），看到股價水漲船高（產生的結果），更是深信不疑。像1990年代中期的HMO股票，和1968及1973年的電腦軟體和醫療科技股，公司的強勁基本面在泡沫期間會與節節攀升的股價互相呼應，網路公司的高速成長與一飛衝天的股價不正是絕配，大家心甘情願覺得這可以信賴，但歷史教訓指出，這種關係難以維持。


    市場崩盤與恐慌期間，分析師和基金經理人在股價（產生的結果）下跌時，下修盈餘估計和展望（接受的資訊），也是相同的道理。葛拉漢和陶德敏銳地看出這樣的關係，寫道：「市場上，普通股估值怎麼產生，跟價格變動頗有關係。」$^{41}$


    想要立即有所斬獲必定會挑熱門或目前表現強勢的下手，而不是根據穩固的基本面。醞釀好的投資流程，要有發酵的時間，但想立即收獲，殺進殺出的投資人，會阻礙這樣的目標，而且研究指出，企業人士和投資人厭惡不確定性，$^{42}$對多數的市場人士來說，接受資訊並得到相應的結果是預期投資會成功的條件，而利用這個投資人經常犯的捷思偏誤，是第四部分要介紹的策略的重要內容。根據這個行為我們提出另一則投資心法：


    操作心理導航6：不要預期所用的策略很快就會在市場上有所斬獲，容許合理的時間再來著結果。


