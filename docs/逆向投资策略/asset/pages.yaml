    實情是，包含數十位諾貝爾獎得主在內，學界創作出來支持效率市場假說和現代投資組合理論的研究成果，在過去 25 年來諸多泡沫中重創了市場。


    這套發源自象牙塔的創新觀念，沒有讓你在市場上占上風，甚至連想打平都很難，而如今駁斥許多效率市場假說基本學說的，正是同樣一套高深的統計分析。但當代投資實務仍是建立在效率市場的觀念之上，為數眾多的投資人雖然認為理論棄之無妨，卻苦於不知道下一步。


    效率市場假說是經濟學理論二個世紀來的自然發展，經濟學家們將實驗選在股市等金融市場進行，終於完成人類理性的世紀大作，經濟學家如同找到了聖杯一樣，揭示這些市場上人如何展現理性。


    只能說，法瑪、布魯姆、詹森、休斯等人原創的市場效率「證明」，廣受經濟學家們愛戴一點都不奇怪，特別是在自由放任的殿堂芝加哥大學，很快就成為這股研究新思潮的大本營。


    市場派經濟學家擺好擂台，一個學者提到：「你看［股市投資人完全掌握資訊］這概念多有意思，這麼理想的地方經濟學家打著燈籠沒處找，就是這裡了。」^{32} 但這個擂台越來越像是最後一搏。


    統計讓經濟學家如此確信這套理論會帶來市場（即使不是經濟學）的盛世，其實不然。


    為了避免誤入效率市場假說的圈套，首先要了解這套學說的教誨，政府不會規定投資股票前要閱讀「效率市場假說—資本資產訂價模型—現代投資組合理論」的警告標籤，缺乏知識很容易一腳踩到地雷。有問題的投資理論不是讓投資人有賺有賠，而是讓高手和散戶一樣賠掉大錢，除了望著市場興嘆，好好與這套理論保持距離，才有望穩操勝算。


