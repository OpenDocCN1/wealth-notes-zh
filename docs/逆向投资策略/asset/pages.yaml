    # 唱出紓困的藍調


    「地表最強國家美國怎會陷入如此可怕的境地？」在國會2008年底通過了7,000億美元的問題資產紓困計畫後，我在《富比士》上這樣寫道。「這筆7,000億美元的救助專款讓我不由得皺起了眉頭，這是必要之惡，但我身為投資人，感覺一點也不好。」這篇文章接下來的內容，就是這場史上最慘'
