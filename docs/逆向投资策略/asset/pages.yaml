  md: '# 事情就這麼簡單嗎？


    葛林斯潘同時也是「解除衍生性金融商品管制的主要支持者」。$ ^{7} $在柯林頓政府最後1年任期裡，很多有見識的人擔心，去管制化會讓使用安全性嚴重下降。時任美國商品期貨交易委員會主席布魯克絲莉·伯恩（Brook-sley
    Born）便是反對者之一。她試圖納管包括信用違約交換在內的衍生性金融商品，這些極其複雜致命的商品正是日後摧毀美國國際集團的凶手，而一大型金融機構和避險基金也差點栽在它手上。伯恩當時會见了時任財務部長的魯賓、桑默斯，噢，還有葛林斯潘，他們幾位抵制勢力在1998年4月21日輪流說服她辭職。$
    ^{8} $據報導，桑默斯的立場（說得厚道）是非常堅定。伯恩因為反對去管制化被迫退出柯林頓政府。$ ^{9} $


    魯賓和桑默斯在葛林斯潘的鼎力支持下，推動《2000年商品期貨現代化法》（Commodity Futures Modernization Act of 2000），該法案在柯林頓任期最後1個月簽署，正式成為法律。這些有毒衍生性金融商品去管制化對於市場的影響十分巨大。柯林頓總統在2009年4月告訴ABC
    News，他接受魯賓部長及其親自挑選的繼任者桑默斯的建議：「關於衍生性金融產品，我認為他們確實是錯了，而我接受了錯誤的建議。」$ ^{10} $


