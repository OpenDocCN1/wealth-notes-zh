  md: '至當代市場的影響，以及這些投資隱含的其他風險類型，都納入風險的新定義中。


    # 更好的風險測量方式


    那麼，有什麼更棒的風險測量方式呢？儘管商界和投資界有很多種定義，建議你從保存和提升你的實際購買力著手。投資的目的在于，基於通膨調整、扣除稅收（如適用）讓你的投資組合保本又增值。


    至於現實版的風險定義，應認識資本會因通膨和稅負產生損失，所以至少要包括以下兩項因素：


    +   1. 你選擇的投資在你打算投資的期間內保本的可能性。

    2. 你選擇的投資在此期間勝過其他投資的可能性。


    這些風險測量指標與學術型波動性指標不同，它們放眼的是未來會對這些基金有需求的一段時間（5、10、15、20或30年）。市場風險可能在幾個月甚至幾年內都十分巨大，但正如我們所看到的，時間一拉長就會迅速縮小。


