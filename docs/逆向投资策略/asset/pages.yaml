  md: '的著作，這些個人的經驗談，稍稍提醒我們都只是凡人。


    我固然做了不少要重新來過的投資選擇，也不是每次選股最後都獲利了結，有幾次我發覺自己如同不知不覺的人一樣被心理左右。但如華倫·巴菲特（Warren Buffett）所說，一個經理人若有六成的打擊率（十次揮棒有六支安打），到頭來肯定是大贏家。我很幸運在漫長的期間後，躋身為數不多績效贏過市場的人士之列。


    最終，你從全書獲得的最大心得是：意識到心理面的投資人握有絕佳的優勢，不光是理論知識，還有貨真價實的投資操作優勢。我希望這點是讀下去的誘因。


    當然不是每個市場分析師都會同意我的分析。新的觀念即使獲得投資實證與心理研究大力支持，因為牴觸及威脅到當道理論的地位，仍不會為多數人接受，無關新來者實際上多好，或當道者實際上多失敗；信者恆信，且會敝帚自珍，直到一窮二白，典範轉變就是這樣，也許從古到今情況都是如此。好在，這場交鋒跟讀者無關，作者才是會被點名的那人。


    三十幾年來，我應付過來自學界與業界的批評，有些夾帶尖銳的人身攻擊；招致千夫所指雖會讓我有點不安寧，有時還害我血壓飆高，卻從未損及成果。


    我認為大家萬萬不可低估心理在市場扮演的角色。遵循證據確鑿的逆向策略，以免踩到心理陷阱，市場的心理面能載舟，反之，像是心存「市場泡沫要破了是沒錯，我再一下下就安全下車」，或是，「搞什麼鬼，竟然10疊打了，等11疊打再賣好了」，大概難逃翻船的下場。不管鑽研有多深或只是想當然爾，投資心理都可能讓你的自我意識和財富淨值快速縮水。


    大衛·卓曼（David Dreman）

