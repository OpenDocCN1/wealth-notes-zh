  md: '經濟現象不用訴諸數學方程式，並提醒要小心別過度著墨在最容易量化的經濟原理部分。


    薩繆森改轍易幟，強調仿效自然科學的複雜量化，並在戰後主宰了經濟學。薩繆森之前，數學雖然有用，但只是現實假設的配菜，現在變成了主菜。好的想法往往出於無法以高深統計或繁複方程式表達，而被經濟學家打入冷宮。學術期刊上發表的論文，很多是經濟思想含量很低，但用華麗數學模型包裝而成的研究；差勁想法若裝飾了高深數學，即使假設有意問題，結論矛盾，還是足堪刊登。諾貝爾獎得主保羅·克魯曼（Paul
    Krugman）說：「在我看來，經濟專業走上歪路，是因為把吸睛的華麗數學誤認爲是真理。」⁵⁸


    一度是讀者讀物的經濟思想與原理，變成除了訓練有素的數學研究者才懂的天書，若經濟學因此達到自然科學般的預測能力也就算了，但這門少了現實假設的憂鬱科學，其實是被數學耽誤，並沒有活化。約瑟夫·史迪格里茲（Joseph
    Stiglitz）在2001年獲諾貝爾獎致詞時，討論到基準經濟模型的不足，提到：「［一個模型］我只變更一個假設，關於完全資訊的假設，而且是用言之成理的方式……因此，我們成功表明標準理論除了不穩健……僅僅改變一個假設……［對理論］就有了莫大的後果，但也表示有可能建構具有絕佳解釋力的穩健典範來取代。」⁵⁹


    金融危機與繼之而來的大衰退之後，經濟學和效率市場假說的問題成了新的當務之急，許多人都想知道，經濟爲什麼落到這步田地，經濟學家、大批失業者、《華爾街日報》，還有自由放任陣營，⁶⁰紛紛有所省思。


    包含舉足輕重的央行人士在內，大多數經濟學家多年來認爲，人的理性還有市場的穩定性，足以將經濟體約爲「少量的方程式」，這些方程式構成的數學模型，試圖仿照華盛頓、柏林到北京的層層經濟行爲。但我們知道這行不通，反而讓人們經歷近代史上最嚴重的金融危機。問題顯然不光出在效率市場理論。


    這項質疑已經持續存在數十年。卡西迪在《紐約客》的一篇文章指出，'
