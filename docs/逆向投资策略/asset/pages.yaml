  md: '包海。如果你仔細檢查這些商品的投資組合，指數股票型基金可以讓你分散投資於波動性較大但具發展潛力的產業，從而達成投資目標。分散投資在目前這種動盪不安的市場中格外重要，因為任何產業都會有超出預期的風險，而擁有某個產業內的單一股票風險太大。你不僅要承擔相當程度的產業風險，而且若將所有雞蛋都放在同一個籃子裡，風險又更高了。


    這裡有兩個例子：其一，若你在2008年直接買入金融股，會有重大虧損；若是買了錯誤的股票，那就玩完了。然而，假使你買入像金融類股指數股票型基金（交易代碼XLF）這樣的指數股票型基金，它追蹤標普500指數所有金融股的加權平均值，那麼儘管你會遭受到毀滅性的損失（從2007年高峰到2009年初低谷一共下跌83%），這是1929至1932年大蕭條時期以來最嚴重的跌幅，但之後你的投資會反彈。從2009年3月低點到2011年6月回漲幅度超過158%看來，我相信金融產業將會強勁復甦。


    另一個例子是SPDR標普油氣開採與生產指數股票型基金（SPDR S&P Oil & Gas Exploration & Production ETF，交易代碼XOP），該基金擁有廣泛投資組合，主要包含油氣勘探與開採公司。在2008年6月下旬創下71.38美元的歷史新高後，開始直線下降，11月20日還跌到23.01美元的低點，等於不到5個月就下跌了近70%。之後隨著油價上漲迅速恢復元氣，到了2011年6月，上漲達161%。這兩檔指數股票型基金是好例子，說明你可以針對喜好的產業分散投資。請注意，在我們剛剛經歷過，也可能再次陷入的動盪不定市場中，這些指數股票型基金還會有更大的波動，只能祈求它不會像2008至2009年初，或是2011年8、9月那麼猛烈罷了。


    另外還有一項警告：許多指數股票型基金規模小、成交量低，最好別碰。請確保每天它都有足夠交易量，你的訂單會顯得相對較小，容易出手。你還應該每天檢查它的資產價值，留意市價是否能及時反映資產價值。'
