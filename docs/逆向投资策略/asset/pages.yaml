  md: '# 偉大的發現


    在整個1980年代，華爾街開始對逆向投資操作策略漸感興趣。隨著資料庫不斷改進提升，有越來越能實證顯示這些策略行之有效。


    這波浪潮越推越高。諸如丹尼斯·施達文（Dennis Statman）、羅森堡、肯尼斯·雷德（Kenneth Reid）和雷諾·蘭斯坦（Ronald Lanstein）都發現，低股價淨值比的表現，比高股價淨值比和整體市場還要傑出。¹¹同時，證據會說話，貝他係數在預測股價方面其實毫無用處。儘管經濟基本教義派有長達30年都在努力合理化它的存在，但是卻趕不走那些黑天鵝。低成本比策略有效，而波動性預測無效，這儼然為效率市場敲響了喪鐘。


    對於這個新教派，可憐的使徒們要怎麼接招？既然無法抹去這些研究發現，答案當然是成為最先發掘它們的人。這正是效率市場提倡者法瑪的行徑。到了1990年代，學界已在逆向投資策略的新大陸上紛紛插旗固樁。


    法瑪教授在一篇革命性論文中，把他對過去30年的市場洞悉一下子全倒了出來，正巧還發現尼可森、1960年代的其他研究者、巴蘇、施達文、羅森堡和他的同事們，以及我本人在1970、1980年代的研究結果：逆向策略的確行得通。還不只這樣，他也發現了貝他係數根本沒用，就像我們在第6章提到的那樣。而我們也親眼目睹，市場派這30年來一直言之鑿鑿的說法，即逆向策略能帶來更高的報酬率只因為它們風險更高，被這個貝他係數不重要的觀點打得落花流水，而貝他係數正是這位提倡者和他的追隨者所使用的風險評估方法。


    持平而論，法瑪和弗倫奇¹²確實順帶引用了巴蘇、施達文、羅森堡和他的同事們，以及鮑爾的研究。¹³鮑爾曾主張，低成本比本身能涵蓋所有無法明確區分或是未能發現的風險。然而，鮑爾的解釋多年來仍為效率市場派廣泛接受。


    鮑爾論文中的推理過程和燃素理論沒多大不同，燃素理論是18世紀盛'
