  md: '光速來傳輸數據，從而能以微秒之差爭取到交易的優勢。他們透過極高速演算搜尋公開市場和私募市場上交易的股票，迅速找到它們之間歷史價格關係的價差並從中獲利，而不是自己下場玩股票。他們也會透過買賣選擇權或期貨交易來賺錢。


    高頻交易迅速竄升，孕育了不少穿著牛仔褲的技術專家，他們備好了機器要以智取勝，由程式工程師創造交易程式，提前掃描市場上共同基金交易的意圖，並透過「對付」這種操作方式領先一步。高頻交易券商還會採用諸如冰山訂單的策略，將大單分拆為小單，猶如只讓冰山一角浮出。這些玩家（也稱做鯫魚）會發送小額交易指令，利用小單掩護大單，然後利用超高速的交易系統來搶跑（front-run）大單（譯注：意即搶先交易）。


    高頻交易在5月6日發生的美股10分鐘閃崩事件中扮演極為重要的角色。根據美國證券交易委員會和商品期貨交易委員會的共同報告，芝加哥商業交易所因電腦程式化自動交易了一筆大約41億美元的期貨賣單，才引發期貨價格、股票市場相繼暴跌效應。這份報告補充說明道，這張期貨合約賣單一出，導致高頻交易券商之間連自動地重複頻繁買賣進出。2


    該份報告指出，薩斯州一家主要的共同基金管理公司沃德爾公司（Waddell & Reed）的電腦自動執行「符合常規的對沖交易」，當它發出75,000份標準500電子迷你期貨合約*（譯注：mini
    E contracts簡稱E-Mini，是芝加哥商業交易所與標準500指數連結的各種股票指數期貨合約）賣單時，市場下跌3%。儘管沃德爾公司大加辯駁，該筆交易怎麼看都不符合常規，它是針對波動最大的積極型共同基金而執行的交易，而這種基金的規模超出沃德爾資產的15%。儘管賣出指令在操作上極為小心，但高頻交易商和一些券商的確是交易價格暴跌的主要推手。市場閃崩的關鍵在於，標準迷你期貨一跌，他們便停止買入，並開始拋售期貨，讓持續下滑的價格跌得更


    > * 合約規模僅為標準500指數期貨合約的五分之一。'
