  md: '本管理公司的部位，料準等到強迫清算，就可以用跌得更兇的價格回補。把1987年投資組合保險業者和長期資本管理公司對照來看很有意思，兩者都是在空頭市場時因為流動性栽了大跟頭。


    1998年9月，以威廉．麥多諾（William McDonough）為首的紐約聯邦儲備銀行（Federal Reserve Bank of New York）當局，關注長期資本管理公司的處境，雖說非其權責，長期資本管理公司仍允許紐約聯邦儲備銀行當局調閱公司帳務，而內容令人大驚，麥多諾發現，除了即將倒閉之外，長期資本管理公司若不計代價脫手手上的龐大部位，可能進一步擾亂原即風雨飄搖的金融體系，令全天下大亂。他顯得力助手召集國內的大型銀行和投資銀行，還有持有長期資本管理公司交換合約等部位的重大外國交易對手的銀行首長共商辦法。


    幾乎所有大銀行和投資銀行都要支持，才有辦法達成全數接管長期資本管理公司部位的協議；經過一番討價還價，長期資本管理公司的部位被賣給由各攤付2.6億美元的16家銀行所組成的銀行團，長期資本管理公司股東的投資在5個月內縮水了92%。相較之下，標普500在長期資本管理公司存續的4年間漲了一倍。


    經歷這次天翻地覆，兩位帶領長期資本管理公司策略的諾貝爾獎得主，仍對效率市場假說不離不棄。雖然承認長期資本管理公司衡量的風險行不通，墨頓指出，並不是原理有問題，而是需要更精緻的模型。他回到哈佛教書，不無諷刺的是，摩根大通（JPMorgan
    Chase）還聘他擔任風險顧問。


    休斯幾年後在一場演講提到，波動性改變了，一定是肇因於投資人永久改變對於長期資本管理公司風險的溢酬，言下之意是所有有關波動性的理論，遇到長期資本管理公司倒閉那樣的大事件後，一定都出現了永久的變化，其實這就跟說突發的物理定律變化，改變了素來知道的長度和寬度意義差不多。他本人不曾動搖對於效率市場假說佐證波動性理論的看法，不過，他口中的永久變化幾年後又變回來了，可見這套說法也是不無問題。'
