  md: '4家知名投資機構的證券分析師盈餘預測，包括2家紐約市的銀行，1家基金業者，跟1家投顧公司，這些機構對185家企業做1至5年的預測。研究發現，多數分析師的預測只是對當前趨勢的線性外插，實際和預測盈餘的相關性很低。


    雖然現在分析師可取得更多資訊，柯瑞格和墨基爾表示，預估值仍是過去趨勢的延續。「本研究的重要結論是證券分析師的精心預測……表現沒比過去的公司成長率高多少。」


    研究者發現，只要假設盈餘會按每年近4%的長期增長率持續成長，分析師的5年期預測的結果就能提升。15


    另一份重要研究則指出依賴盈餘預測是個錯誤。牛津大學（University of Oxford）伊恩·利托（Ian Little）教授1962年的論文〈成長毫無章法可循〉（Higgledy
    Piggledy Growth）指出，近期的盈餘趨勢無法預測多數英國企業將來的發展。16利托的研究讓效率市場假說理論和實務人士不快，研究的方法隨即遭受批評，他對批評從善如流，重做研究，但結果一樣：盈餘呈隨機漫步，前後期的變化幾乎沒有相關性，近期的趨勢（證券分析預測盈餘的重要項目）對於指示未來發展派不上用場。17


    若干研究得到相同的結論：18美國企業的盈餘變化長期呈隨機分布。


    舉例來說，理查·布萊利（Richard Brealey）調查1945至1964年間711家美國工業廠商盈餘的變化百分比，結果也發現，趨勢無法持續，反而略有反轉的傾向，雖說盈餘成長率最平穩的企業例外，但也僅呈現微幅正相關。19


    把第二組研究與第一組放在一起來看，多少解釋為什麼分析師的預測誤差會這麼大。如果像柯瑞格和墨基爾所說，分析師的預測是對過去盈餘趨勢做外插，而且盈餘如利托和布萊利所言呈隨機漫步，那麼誤差不可可想而知。而且預測誤差很大符合我們觀察到的一貫結果。


    因此，我們從另一個角度，看到在盈餘預測放了太多心思令人不安之'
