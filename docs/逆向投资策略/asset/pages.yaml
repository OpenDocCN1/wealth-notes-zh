  md: '# 引言


    2011年8月下旬我在寫這篇引言時，有些事似乎明朗了起來。我們雖然才從大蕭條（Great Depression）以來最糟糕的經濟與市場時期撐了過來，目前的情況絕對稱不上是穩當。很多市場專家把2000至2009年這期間稱為「虧損的十年」，2000至2002年的網路泡沫，還有2007至2008年的次貸泡沫，讓許多人賠掉積蓄，也把住家的房價打趴。我們都有現代投資學方法跟瞬時傳遞的消息資訊了，怎麼還會這樣。


    股價從2009年3月谷底起漲，到了2011年6月已翻倍，然後難以為繼。市場自2009年3月低點上漲111%後，經歷數十年難得一見的跌勢，標普500（S&P
    500）指數在7月來到高點，但到了9月底，已跌掉將近20%，市值縮水逾3兆美元。這次驚跌伴隨商業活動顯著放緩，被許多老經驗的投資業者視為新一輪熊市的開端。原本幾乎所有投資人都同意全球經濟與市場正在改善，轉為對經濟不景氣的擔心並快速滋長。大多數的投資人手足無措，不少人嚇壞了，這不能怪他們，畢竟如此跌勢令人想到2008年9月至12月的情況；低沉18個月的波動率，在2011年8月的四個交易日狂飆，道瓊工業平均指數（Dow
