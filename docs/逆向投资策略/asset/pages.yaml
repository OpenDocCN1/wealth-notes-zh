    # # 與金融體系對賭


    在本章開始時，我們簡短瀏覽了信用評等機構（credit-rating agency, CRA）、標準普爾、穆迪和惠譽，並指出它們對不動產抵押證券（mortgage-backed
    security）的信用評等過高。信用評等機構安然度過了1929年大崩盤和經濟大蕭條，而他們的評核在經歷過那段艱難時期後更是堅若磐石，長期下來越來越受到尊崇。投資人仰賴他們的評等，從而準確評估公司證券的信貸風險程度，其評等結果可說是普世認可。


    那麼，為什麼他們要毀掉100多年的聲譽呢？答案正如惡名昭著的銀行搶匪威利·薩頓（Willy Sutton）在1930年代所說的：「因為錢就放在那裡啊，笨蛋。」這是當時記者問他為何搶銀行時所得到的回答。²⁶


    三家頂尖的信用評等機構風光賺大錢，和本章前面討論的信貸業者如出一轍。他們的收入從2002至2007年爆增1倍以上，由不到30億美元大幅成長到超過60億美元，而主要都來自對複雜的金融工具所提供的評核服務。


    銀行和投資銀行家銷售的所有證券都需要高評等才賣得動。穆迪和標準普爾在次貸泡沫高峰期，曾分別將數千支次貸產品評為AAA最高評等。正如參議員安吉利代斯，同時也是專責調查信用評等機構的金融海嘯調查委員會（Financial
    Crisis Inquiry Commission）主席所言：「穆迪做得很好，但仰賴穆迪評等的投資人就不太妙了。從2000至2007年，穆迪將大家垂涎的AAA評等，發給了42,625筆不動產抵押證券。穆迪簡直成了AAA評等工廠，光是2006年就有9,029筆不動產抵押貸款拿到了穆迪發出的AAA評等。」²⁷


    標準普爾也不遑多讓。相比之下，實力最強的美國公司或外國政府能拿到AAA評等者並不多，但他們的債信程度和次貸商品根本有如雲泥之別。


    對於信用評等機構來說，評核服務是很賺錢的業務，服務費用及範圍小'
