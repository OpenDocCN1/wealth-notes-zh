    # 低本益比策略成功的早期證據


    從 1960 年代開始，研究人員開始懷疑能见度，也就是現代證券分析的一大支柱，是否真如大家普遍相信的那麼站得住腳。最初他們是拿本益比來研究，因為這在早期資料庫拿得到。當時就有一位研究員提出疑問：「用本益比衡量後續市場表現到底有多準確？」


    法蘭西斯・尼克森（Francis Nicholson）當時在公積金國家銀行（Provident National Bank）擔任顧問（interrogator）。他在
    1968 年對高本益比之於低本益比股票的相對績效做了全面性的研究，分析了 1937 至 1962 年間 18 種產業裡共 189 家信託公司的體質，這份長達
    26 年的研究結果如圖 10-1 所示。


    尼克森將這些股票根據本益比高低排序，均分成五等分，每一等分再依 1 至 7 年期各別本益比高低重新排列。當這五組以新的本益比資訊按持有年分重新計算時，最被看衰的股票，在持有期股價年平均上漲率達
    16%。反之，本益比最高的龍頭股，在相同的計算之下，僅增加 3%。儘管各股績效差異會隨持有期間拉長而縮減，但是，原本投資組合在持有 7 年之後，本益比最低的那
    20%，績效幾乎是最高那組的 2 倍。


    投資者出奇一致地誤判了後續績效，投資結果都落得一個樣。最熱門股（前五分之一）的表現明顯落後於其他組，而最冷門股（末五分之一）成了第一優等生。次熱門股績效倒數第二，而次冷門股股則名列前茅第二。


