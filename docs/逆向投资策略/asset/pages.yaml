    # 左耳進右耳出


    有地方不對勁。起先以為是碰巧，但結果指數套利、投資組合保險、指數和股票選擇權大行其道，並沒有實現效率市場陣營對主管機關和投資大眾的說詞：降低市場波動性。反而達成反效果：1986年7月7日和8日股市先下接近
    100 點，同年 9 月 11 日和 12 日出現小型股票崩盤，接著在 1987 年 3 月下旬發生平均跌幅近 100 點的近乎崩盤景象。若干投資界資深人士開始發覺苗頭不對，像紐約證券交易所總裁約翰．費蘭（John
    Phelan）。我在《富比士》寫的專欄，標題是「末日機器」，小標題是「金融指數期貨 + 程式交易 * + 低保證金 = 在劫難逃」，並在 1987 年 3
    月 23 日發表文章說明，指數套利和投資組合保險搭配運用會造成崩盤。可惜，6 個月真的應驗了。


    因為《富比士》的文章，我獲邀成為一個小組的成員，好幾個成員是知名學者，多數大力支持投資組合保險和指數套利交易，證券交易委員會有三位委員加入，全都相信效率市場的說法。1987
    年 6 月在效率市場假說重鎮紐約羅徹斯特大學（University of Rochester）舉行的研討會上，在陳述為何覺得會發生市場崩盤時，高高在上的學者們對我嗤之以鼻。有些大咖暗中譏笑，客氣的就打呵欠。像他們這種程度的教授，跟區區一個基金經理人是有什麼好辯的。


