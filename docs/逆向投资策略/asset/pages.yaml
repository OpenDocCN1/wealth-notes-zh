  md: '生芮氏規模 9.0 的大地震或尾隨的海嘯所帶來的破壞，以及成千上萬的人命損失？沒幾天後，附近的東京電力四座核電廠瀕臨熔毀，威脅更多人民的生命安全；由於擔心這場災難會拖累全球經濟成長很長一段時間，世界各地的市場紛紛重挫。


