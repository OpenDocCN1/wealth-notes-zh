  md: '後來研究揭曉，局內和局外觀點動用到的資訊來源大不相同，處理過程也涇渭分明。局外觀點無視手上計畫的諸多繁複細節（這是局內觀點分析的基礎），也不去預測未來的計畫成果，而是專注於過去在相似計畫上統計的數據，據以決定成敗的機會；與局內觀點的基本差異是，局外觀點不另眼看待問題，而是視為若干類似問題中的一起案例。局外觀點可以應用在很多問題上面，像是課綱規劃、醫學和精神或法醫診斷，還有預測盈餘或未來的股價。


    康納曼表示：「可知，憑著智慧和技能運用這兩種方法時，用局外觀點得到一個現實預估的機會要高出許多。一般來說，複雜、長期的工作，未來細節怎麼可能預料得到。」數十甚至上百個市場因素交互作用之下，數不清會有多少可能結果，即使有人能料到每種可能性，任一種情境的機率，也是低到不足為慮，偏偏分析師卻想做到出具單一、準確預測這樣的事。


