  md: '對債券評等，並據此反應價格。」²是的，就這麼簡單和天真，而且還很成功。實際上，正因為如此成功，以至於鬆繃銀行管制在10多年後成為銀行和經濟風暴的關鍵因素。這位領導聯準會20年的人從未考慮到現代銀行的複雜性、規模和相互依賴的程度。


    葛林斯潘似乎倡導的是更早期的自由企業形式，即1830至1840年代的自由放任主義。在他眼中，過去那些基本理念在現今世界依然能運行無礙。他心中幾近狂熱的理想主義似乎忽略了，那並非完美的時代。大多數人的生活極度貧困，50%至60%的英國人口營養不良；童工現象甚為普遍；大多數人每週工作7天。「別在星期天來，也別在星期一過來」是英國工業家常在工廠大門上張貼的字條。英國各地監獄人滿為患，關的都是債務人。在一些工業城市和倫敦都發生了大暴動，抗議各種惡劣的情況，而贏得滑鐵盧戰役（Battle
    of Waterloo）、人稱「鐵公爵」（the Iron Duke）的威靈頓（Wellington）則擔任首相。很諷刺的是，如果葛林斯潘生活在那個美好的時代，他成功的機會應該幾近於零，因為上層階級霸占了主要職位。從本質上來說，他還活在19世紀初期。


    葛林斯潘很幸運的是，出生得晚，所以能這麼成功。葛林斯潘在其職涯顛峰時期被公認為是有史以來最能幹的央行行长。他是金融界的救世主，暱稱「先知」或「神諭」，對於不斷演進的金融和經濟問題，大多數人都以為，他好像全知全能，會為世界帶來和平與繁榮。


    他發布的聲明或演講每每是新聞事件，會立即傳遍全球金融市場。沒他講話或到場的經濟論壇，只能靠邊站。他的畫像以15.04萬美元的高價出售，³想與他共進晚餐則要花上25萬美元。⁴自其就任聯準會主席以來，美國歷任總統從雷根到小布希、參眾兩院大多數議員，無論是民主黨還是共和黨人，大多對他言聽計從。


    葛林斯潘每次在國會露面之前，華爾街都會先行猜測他的談話內容。他的演講經常是電視現場直播，而演講內容會提前發給媒體。儘管他說的每句'
