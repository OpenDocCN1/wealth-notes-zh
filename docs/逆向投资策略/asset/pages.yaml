  md: '# 此處有雷：成長型股票不怕價格高


    有時候，對於積極成長型股票或首次公開募股來說，似乎不存在價格過高的問題，所以投資人一再被當成凱子剁。儘管如此，一如我們所見，強大的心理力量助推人們去買當紅炸子雞，卻阻擋他們去分析自己出了什麼錯。


    這種模式在較大型的 company 身上屢見不鮮，但這沒什麼好意外的。投資人相信自己能預測公司前景，也認為不論是特別刺激還是乏味，的股票，他們都能看得準。他們對「最佳股票」寄予厚望，並且對於期望將會實現滿懷信心。同樣地，他們對於看似死氣沉沉或前景黯淡的股票期望很低，還相信自己對於這些股票的預測將分毫不差。我們在前一章已看到這種預測實際上有多麼的「準」了。


    那些前途似錦、乘飛猛進，以及概念極新穎的company，股票交易價格通常符合高本益比、高股價現金流量比（P/CF）和高股價淨值比（P/BV），並且股利殖利率（dividend
    yield）老是很低，不然就是掛零。反之，前景不被看好的股票，則會在本益比、低股價現金流量比、低股價淨值比，以及股利殖利率通常較高的情況下買賣。*


    正如第1、2章所示，投資人願為熱門股和冷門股所付出的價格相去甚遠。例如，投資人在線上玩具零售商eToys.com步入網路公司泡沫化的天堂之前，願以100倍以上的本益比買入其股票，但對於又老又無趣的摩根大通興趣缺缺。投資人所支付的股價差距如此之大，正因為他們對自己直測未來的能力信心滿滿。讓我們看看，當「意外來了」，也就是他們的預測沒成功時，會發生什麼事？


