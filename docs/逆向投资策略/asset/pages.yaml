    # 效率市場假說抓漏抓不完


    如果你想知道研究者在變什麼把戲，好好把原始資料拿來看，通常都非常有意思，前提是看得夠仔細。我們這就來看看其他宣稱市場快速反應新資訊的研究。首先是鮑爾和布朗（1968），​​42兩人檢視1946至1966年間261家廠商的正常報酬率，他們將股票分成二組，一組某年度盈餘相對市場增長，一組衰退，並在年底衡量績效，結果發現盈餘相對增長的股票，績效勝過市場，盈餘相對衰退的股票，績效落後市場，結論則是股價有料到大多數的盈餘宣布消息。


    理論家漏掉一個簡單但投資人大多知道的事實：企業通常是每季發布財報，不是每年。美國證券交易委員會多年來都是規定上市企業要在90天內揭露這項財務資訊；此外，那時候分析師提出的公司營運研究报告，絕大多數有整年度的盈餘預估數字，而且通常用發言人的新聞稿補充，但作者說投資人有正確判斷公司的展望，然後在自己拿到資料時看股價行情走勢。問題出在，研究者到底懂不懂實務，包括在市場資訊和投資研究上，靠這種相當淺白天真的發現，就說市場有效率未免太言過其實。


