    怎麼說？因為標普期貨的流動性沒有止境是效率市場派的信念，也是投資組合保險的理念。當市場走跌，精明的買家會以較低價位買進期貨，若市場續跌，會冒出更多逢低買進的買家，說穿了，效率市場假說基本上認定既然市場理性，買家只會多不會少，就是這樣。


    「流動性會有如滔滔江水連綿不絕。」學者這麼景仰，可奇怪的是，事情還真的不是這樣。


    投資組合保險真的保護了投資組合嗎？沒有。一來，若運用得當，機構的損失會減輕沒錯，但不會因而免於損失；二來，市場若起伏頗烈，成本會大增，頻繁操作會讓虧的小錢和手續費雙雙擴大。


