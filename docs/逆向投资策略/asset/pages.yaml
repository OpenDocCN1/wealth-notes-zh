  md: '期間走向自經濟大蕭條以降的最高點之後稍有緩解，但現在又四處擴散。毫無疑問的是，投資大眾非常恐懼，縱使美國經濟應該能在幾年之內走出困境。若果真如此，那麼我們國內將迎接一波強勁的牛市，特別是如果通貨膨脹率在未來幾年迅速上升的話，很顯然會有這種可能。


    國外市場成長潛力之所以如此旺盛，是因為經濟成長、財務實力以及更能擔貴的投資法規。請記住，國外的投資指導原則在國內一樣適用。首先，不要僅僅因為概念很炫就一頭熱地投入。才不久前，在中國、香港、俄羅斯和墨西哥等地都出現了讓投資人損失了數十億美元的投機活動。因此，這裡要教你的第一課，就是國外投資不是萬靈丹。你必須採用與美國市場相同的逆向操作原則。1997年環太平洋市場的金融風暴，便是投資人違反這項原則的前車之鑑。請小心防範這些地區裡的投機旋風，它們可經常居於主導地位。


    另一個考量要件是，當你買入外國公司股票時所涉及的匯差風險，可能大幅影響你的總報酬。在海外市場超越美國市場的那些年裡，收益往往是美元轉弱的結果，而不是海外市場有多強勁。因此，近年來美元走貶時，外國投資組合看似美好的投資報酬當中（像很多基金廣告高唱的那樣），其實有很大一部分不是來自市場本身，而是因為美元貶值導致這些股票價值變高，類似狀況今天又再次重演。換作是美元走強的話，情勢可能會大為反轉。


    表13-2是美國國內外股票的股票報酬率比較，這些股票分別來自標普500指數和摩根士丹利國際資本公司歐澳遠東指數（MSCI EAFE）。MSCI是歐洲、澳洲和遠東的縮寫，這項指數用來衡量美國、加拿大以外的已開發國家之股票市場表現。


    請看代表績效的那六欄，其中外國股票績效是以摩根士丹利國際資本公司歐澳遠東指數來衡量，國內股票則是以標普500指數作為對照，兩者長短互見。這兩大指數在六段衡量期間裡，有四段是互相贏來贏去的情況。顯見這兩項指數就像在賽馬一樣，勝利的一方可能只能算險勝。


    但是，還有更難選的。正如我們所知，股票生性喜怒無常，它們在不同'
