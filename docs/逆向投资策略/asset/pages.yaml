  md: '估、資金來源、換股持有，甚至強力持有等用語，言下之意都是賣出。瑞銀證券前分析師彼得·賽瑞斯（Peter Siris）幾十年前就說了：「場子裡多數人不會因為聽分析師說就上當……因為大家知道很多時候這些人是在引人上鉤。但那些可憐的（散戶）投資人，誰去跟他們講一下。」²⁸人家早就警告過了。


