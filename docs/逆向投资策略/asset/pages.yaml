    # 進擊的學界


    對大部分基金經理人還有分析師來說，壞消息是學界並沒有沾沾自滿，1960年代中期後，研究人員開始將矛頭指向絕大多數業界人士信奉的基本分析，想知道這一套方法是不是能夠獲得高於平均的報酬。


    基本分析派相信透過嚴謹分析公司的銷售、盈餘、股利前景、財務狀況、競爭力及其他攸關的面向，可以得知一家公司的價值。大學和研究所會鉅細靡遺地傳授基本分析的知識和應用，*並透過實務進一步擴大其內涵，基金經理人、銀行業者、退休基金、投顧和券商無不將這套分析奉為圭臬。


    雖然深得眾人擁戴，基金經理人的歷史績效卻不太捧場。美國證券交易委員會（Securities and Exchange Commission, SEC）早期研究過1920年代後期到1930年代中期這段期間的基金經理人，指出：「從結果來說，我們相當確信投資管理業界（封閉型基金）的整體表現沒有勝過主要的普通股指數，在1927至1935年期間表現可能不如指數。」¹⁶創辦考爾斯經濟研究委員會並出版會刊《計量經濟學》（*Econometrica*）的美國經濟學家和企業家阿爾弗雷德・考爾斯（Alfred
