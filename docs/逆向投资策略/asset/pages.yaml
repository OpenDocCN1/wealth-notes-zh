  md: '化的市場上，又怎麼可能等量齊觀？


    說穿了，第5和第6這兩章似乎是在向有效率市場假說、資本資產定價模型和現代投資組合理論的陣營宣告：「很遺憾，到頭來太陽沒有繞著地球轉，你們只能接受了。」


    # 第二部分結語：現代經濟學的危機


    有效率市場假說如今的接受度如何？乍想可能覺得很高，畢竟學者還是前仆後繼地在知名期刊大量刊登這方面的文章，並廣獲投資圈採用。但我們知道，這套革命性學說的地基似乎很不牢靠，講難聽一點是紙糊的，像是這假說一個重要的支柱，合乎理性的風險測量值，不過是金融學者所做的有問題假設，目的是讓投資學搭上經濟學；而有效率市場假說若是對的，投資人就得這樣子測量風險。學界寧可信其有，至今不改其志，下場就是某些最優秀的經濟學家作繭自縛，固守這個邏輯的破口。


    有效率市場假說和多數投資學門經濟學家做研究的方式，是研究者在風險測量方面一敗塗地最重要的理由。二戰後，社會科學企圖成為像物理學那樣的嚴格科學，其中又以經濟學家最認真。早在60幾年前，經濟學家就開始指望藉由數學理論，讓這門「憂鬱科學」搖身一變，具備阿爾伯特·愛因斯坦（Albert
    Einstein）相對論或約翰尼斯·克卜勒（Johannes Kepler）行星運動定律那般的預測能力，後來的諾貝爾獎得主薩繆森，那時候還是麻省理工學院的青年經濟學教授，率先將在物理學大放異彩的微分方程方法，用在研究幾乎所有的經濟問題。


    假設理性是重點，對於要讓利潤極大化的廠商、要滿足極大經濟慾望的個人，都是如此；理性行為是薩繆森著述的根基。這個不無質疑的平台，讓經濟學家能放手建立最複雜的數學模型，經濟學於是可以化為準的物理學。'
