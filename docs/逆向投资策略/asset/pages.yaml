  md: '前面的分析師預測研究，結果顯示即使將標準放寬為$5%$，實際上達標的機率还是很低。從表可看出，光是只準備1季的預測，少到只有$30%$。


    這張表是估算一個分析師預測能準個1季、4季、10季、20季的機率；第一欄是所有實際與預測不符的情況，第二欄是實際數字低於預期，第三欄則是超出預期的情況。結果真不讓人放心，可說極度不利於把精心估算的盈餘預測當靠山的投資人。分析師的預測共識連4季都沒超過$5%$容錯區間的機率只有132分之一，期間拉得越長，機率越難看，任取10季來看，預測值落在區間內的機率剩下199,000分之一，取20季的話，機率剩400億分之一，我們只取到20季，再拉長的話分母數字就破兆了。這些預測正是多數投資人指望，也是效率市場假說陣營言之鑿鑿，說會讓市場保持效率的技巧。實務和理論陣營都要反省，前者是對預測勝算極低這件事不借筋，後者是沒有著墨這項重要證券分析工具乏善可陳，兩方都難辭其咎。


    換個角度來看更清楚：你去買紐約州彩券中大獎的機率，是花5年每一季都把盈餘數字估準機率的777倍。若彩券行開出這種機率，沒什麼民眾會來買，但市場上甘於下重本下場玩一把的投資人何止百萬。


    有人會說：「誰會在意財報數字比預估高的情況？我會給分析師鼓鼓掌。」說得也沒錯，那我們來看：你連續10到20季躲過財報數字低於預期$5%$利空的機會有多高？回答是：非常低。投資人只有五分之一機會，一連4季都不會遇到這種實際數字比預估共識低的情況，拉長到10季來看，機會剩下62分之一，20季的話則是3,800分之一。


    之前講過，許多成長股的價位之高，背後需要有10年以上的預測數字支持。如果要準個5年，機率都微乎其微，看到10年或15年有什麼意義？偏偏許多天價的成長股，是靠做出10、15年期間的預測在支撐價位。


    考慮一下：覺得這樣子不行的人會想從中漁利嗎？我們很清楚，多數投資人會仰賴精準的預測下場玩一把。如果有法子，知道事有蹊蹺的投資人，顯然會想與這種人玩一把，這正是我們下一節要介紹的內容。'
