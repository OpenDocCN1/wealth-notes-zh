    商業銀行和投資銀行也會融資給許多持有大量這種債券和複雜衍生工具的投资公司。明知道這類證券多數次級貸款，而且投資銀行大量運用槓桿，但銀行的風控部門並沒有放在心上，畢竟在房市泡沫的高點，住宅房貸擔保證券投資組合的波動性依然很低，而且照墨頓、休斯、法瑪等教授的說法，波動性的改變不會是長久的，風險固若金湯，大家甭擔心，儘管發大財。


    雖說聯準會主席葛林斯潘和繼任的柏南奇說大家可以放心，專家們也說情況很好，但美國的房市泡沫仍難以為繼，房價在 2006 年夏季尾聲開始走跌，跌勢一直延續到隔年。2007
    年初，房貸市場開始出問題，2008 至 2009 年 4 月的房價一路下跌，而且大量屋主付不出貸款，房子遭銀行查封的情形日益嚴重。想當然耳，房貸債券市場跟著崩盤了，流動性從
    2007 年以後開始出問題，到了 2008 年幾已山窮水盡。2006 年 8 月住宅房貸擔保證券開始反轉，接著的 2 年間一瀉千里。災情比美國史上任何股市釀成的崩盤都更為嚴重。有意思的是，這段期間授予一堆垃圾次貸證券
