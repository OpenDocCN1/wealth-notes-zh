    # 流動性和槓桿：致命的組合


    我們不太可能很快就把2007至2008年的金融恐慌拋諸腦後，流動性和槓桿作用在這個近代史上最嚴重的信貸危機中幾乎毀掉了金融市場。高槓桿和流動性嚴重不足同步發威，幾乎消滅了金融體系。從1929至1987年各波市場崩跌中，槓桿作用和流動性不足強勢聯手形成一股關鍵的力量。


    # 面對流動性問題，你要如何自保？


    不幸的是，流動性不足的形式不一而足，沒有解答可一藥治萬病。在市場崩跌期間，你除了撐過去別無他法。通常，當市場意識到崩跌是由流動性驅動時，股價很快就會恢復。1987年的崩盤便是如此，當時股票幾乎在一年多一點的時間裡就彌補了所有由流動性所造成的損失，而去年的閃崩事件則是在當天就收復大部分的失地，其餘則在幾個月內就補足了。在流動性造成的市場崩跌中，切勿急著把股票脫手。


    # 你該如何應對流動性和槓桿？


    在市場上升時，流動性和槓桿都極具誘惑，令人難以抗拒，尤其是信貸好過的情況下。我們越是喜歡流動性不足的股票、債券或這兩者的組合，投資回報就越高，連帶著加碼買進的誘惑就越大，也越想使用更多槓桿來推動價格上漲。過度使用槓桿和流動性太差似乎是因為正向的強烈情感而萌生的副產品。這對成千上萬的投資人（包括避險基金、銀行和投資銀行）來說，幾乎就像是成癮的心理現象。


    要抗衡流動性和槓桿問題的唯一方法，是嚴格限制你的槓桿率，以及控制流動性不佳的證券持有量，尤其是這些證券落在相同的市場類別。對於'
