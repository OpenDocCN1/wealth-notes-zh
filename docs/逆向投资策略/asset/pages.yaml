    這情形透露出，投資專家其實無法準確衡量基本面理論價值加減25%至35%左右的區間，即財務理論指出可以放心進場買低賣高獲利的價位。從1960年代以來的科技股或網路泡沫中可知，分析師對網路或高科技股的評價，往往可能跟市場相差50至100倍，結果是（至少暫時）出現了相較於任何公認的證券分析理論的超高估值。*


    於是在泡沫之類的極端市況中，遵從當代證券分析理論的分析師力有未逮，正面情感取而代之，將價格推高到遠超出長期評價方法支持的水準；恐慌時，負面情感以相反的作用力，讓投資人願以任何價位拋售。遺憾的是，苗頭不對時，我們仰賴的對象，會先中箭落馬。


