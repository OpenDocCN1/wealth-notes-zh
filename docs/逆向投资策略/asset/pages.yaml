  md: '和1990年代初期，當時銀行家未能從經濟面充分審查主要大型計畫。由於銀行在發放貸款時競爭激烈，建商拿到的貸款是該計畫成本的105%。自1960年代以來，這類房地產泡沫幾乎每10年就來一次。


