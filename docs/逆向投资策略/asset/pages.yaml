  md: '像芝加哥大學的諾貝爾獎得主勞勃·盧卡斯（Robert Lucas, Jr.）等人所提出的複雜新數學理論，造成一代的新進經濟學家，紛紛建立更複雜的模型，結果卻不足採信，也沒共識應該換上什麼。


    盧卡斯的研究結論是聯準會應該不要主動指引經濟體，只要按固定增長率增加貨幣供給就好。⁶ 這研究遭受猛烈攻訐，原因還是盧卡斯的複雜數學公式，骨子還是站不住腳的簡單假設，像所有市場上的供給恆等於需求云云（若此為真，那就沒有失業了，勞動供給絕不會超過需求），一旦拿掉供需假設，盧卡斯的結論也就所剩無幾。評論盧卡斯的研究不切實際時，時任總統經濟顧問委員會主席的史迪格里茲說：「你才能在為失業問題操心的總統面前，劈頭就用完全就業當假設，不管對哪一國的總統都不行。’⁶²


    向來是社會科學要角的經濟學家，身陷自己造成的預勢，並不是都沒人察覺到這件事。1996年諾貝爾獎頒給以1961年論文貢獻獲獎的哥倫比亞大學（Columbia
    University）榮譽教授威廉·魏克禮（William Vickrey），和劍橋大學（University of Cambridge）的詹姆斯·莫里斯（James
    Mirrlees）。媒體盛讚魏克禮在租稅政策乃至公債拍賣等廣泛領域做出獨創一格的貢獻，他拒絕這份過譽，並說道：「這是我在抽象經濟學別生的校務……從人類福祉的角度，頂多屬次序重要性。’⁶⁵
    接受訪問時，他反而盡談些自認為重要性高的其他研究。經濟學分支的投資學對複雜的統計分析也該如此。高深的統計方法通常勢必要搭配簡單假設，越複雜的假設雖然更能描述真實世界，卻不易施展研究者想要或學術期刊會刊登的數學分析。


    做了理性這項簡單假設後，置身窿襟蔘典範中的研究者，就能盡情鑽研完全理性的投資人如何與市場打交道，用上最複雜的微分方程或其他數學方法，找到新的發現，用的假設一點都不現實又如何。


    湯瑪斯·孔恩（Thomas Kuhn）在經典著作《科學革命的結構》（The Structure of Scientific Revolutions）⁶⁴中，寬宏看待典範轉移問題，他寫道，科學家勢必要有個能做事的平台，典範是領域中的科學社群所接受並運用'
