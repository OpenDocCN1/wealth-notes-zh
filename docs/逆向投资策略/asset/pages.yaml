  md: '傷輕鬆脫身。元氣大傷或一蹶不振的是，他們管理的公司。


    納西姆·塔雷伯（Nassim Taleb）是康納曼的密友，同時也是財經暢銷書《黑天鵝效應》（*The Black Swan*）的作者，他這樣說道：「人們根本不願意接受他們實際上承擔著巨大風險的事實……聯準會前主席艾伦·葛林斯潘……在他上班時閉著眼睛駕駛一輛載滿孩童的校車。」²⁵


    不只是聯準會舉措完全無從應對危機，把經濟脈動交給聯準會掌控，再加上嚴重的流動性危機，已經深深切斷這個國家的金融動脈近 18 個月，事發至此，聯準會看來還未意識到
    2008 年 9 月即將降臨的大崩潰。


    聯準會是否權力過大是一個爭議性的話題。但顯然地，它在流動性危機和大蕭條期間並未妥善運用它的權力。根據這些學識淵博的央行銀行家，包括主席柏南奇在內的說法，聯準會在大蕭條期間並未行使職權，但在
    2007 至 2008 年金融海嘯爆發前幾年，聯準會在傑克森．霍爾（Jackson Hole）央行年會中暗示，聯準會採用的方法太過複雜，經不起毀滅性的金融海嘯再次發生。


    諷刺的是，國會和歐巴馬政府在 2010 年《金融改革法案》（Finacial Reform Act）中賦予聯準會更大的監管權。


    此情此景還會再現嗎？有可能。柏南奇過去一直延續葛林斯潘的政策，直到大勢已去。儘管他在 2010 年底說過我們需要更多監管，但他在 2007 年初的確不是這樣說。我認為柏南奇不是另一個葛林斯潘的另一任，否則他會繼續奉行葛林斯潘的政策。但是，當見風轉舵者成了聯準會主席之後，能有什麼作為呢？無論他是極端了點的自由放任主義者，還是社會主義的信徒，我們還是無法阻止他對貨幣政策的影響。


    我們接下來要簡短地探討，聯準會以及前兩任政府支持破壞性的非交易所內交易之衍性金融商品（non-exchange-traded derivatives）所帶來的後果，以及在後格拉斯—斯蒂格爾法案環境之下，銀行監管政策若過分寬鬆，將如何讓銀行和投資銀行家占盡金融體系的便宜，直到他們把自己和金融體'
