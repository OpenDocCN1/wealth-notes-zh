    # ## 假說的開端


    這場革命一開始寧靜的不得了。20世紀初法國數學系博士生路易斯·巴舍利耶（Louis Bachelier）在畢業論文研究商品的價格起伏，3發現商品價格變動是隨機的，沒有任何可預測的模式，也就是後來的「隨機漫步」假說。


    但巴舍利耶的發現直到1960年才獲得重視。1960年代，研究人員開始研究股價變動，一項早期研究發現隨機挑選數字畫出來的圖，看起來跟股價變化很接近，4另一項研究發現股價變動很像是物理學稱為「布朗運動」的微粒隨機動向，這個現象早在1827年就由蘇格蘭植物學家羅伯特·布朗（Robert
    Brown）提出。5


    有關股價隨機變動的證據在1960年代初期湧現，統計上幾乎全都支持後來的股價變動跟前面獨立的假說。‡


