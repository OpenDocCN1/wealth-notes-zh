  md: '在投資人信心高漲的穩固經濟條件下發育，是投機熱潮另一個相似之處。每次投機熱潮一開始都很合理，出自簡單卻有趣的念頭，後來則會把長年奉行的謹慎原則通通拋在腦後。


    世人相信每次泡沫都是空前的機會。在南海公司（South Sea）和密西西比公司的前例，吸引力是新世界有讓投機客做夢都難以想像的無盡寶藏。1960、1970和1980年代的科技泡沫，則是販售半導體、電腦和其他尖端科技產品帶來的無窮利潤。投機客著迷於巨額獲利的前景，很快就把所有估值的標準拋在腦後。


    1929年崩盤前的股價水漲船高稱為「新時代」，這次真的很不一樣，盈餘成長據說會讓投資人想把過時的價值標準通通扔掉。在咆哮的二十年代，發生許多重要而且可以化為無窮商品和服務的突破，像是無線電、商業航空的前景，和新興且非常有賺頭的汽車與工業製造技術，在國內外市場供不应求，將企業股票的獲利推高到超凡的水準。1996至2000年網路泡沫那時候，投資者斷定網路公司已開創「新經濟」，合理化超高的價格。合理的股價不用再看待世代遵循的估值標準，新一波提升的科技獲利能力，理當要有更高的估值。


    每次泡沫都有專家上鉤，漲不停不僅沒事，還會預測將來價位更高。歸根究底，每次人們都認為這次是空前的大好良機。


    投機熱潮另一個共同的念頭是「有人更傻」。遇到泡沫，有些獨立有想法的人，不會跟著一頭熱，他們認為價格怎麼會高成這樣，不知道是在瘋什麼，但認為情況還會更瘋狂，如果價格漲了10倍，熱潮繼續漲，難道不會漲到15倍、20倍？1720年有個在南海泡沫中破產的英國國會議員寫道：「我的確曾說過，倒場必將到來，但我要坦言，時間比我預期早了二個月。」3


    投機熱潮會讓高風險的行動看起來審慎有理，沒有趕上潮流會被當成老骨頭，貼上「恐龍」的標籤，每天在CNBC主持節目的市場名嘴吉姆·克瑞'
