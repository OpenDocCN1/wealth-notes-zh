  md: '操作心理導航 25: 我們討論過的投資人心理既是最親愛的夥伴,也是頭號勁敵。你若要求勝, 就必須在這場賭局堅持下來, 但對許多人來說, 這是很難甚至不可能的。


    儘管這些策略簡單又容易上手, 但一些意外事件的影響力真的很大。我們在第一部分探討了為什麼大多數的人無法擺脫這些影響, 並且帶你了解一些有助於你自外於這些影響的原理。我們接下來要探討的是,
