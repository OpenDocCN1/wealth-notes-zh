    不管效率市場假說、資本資產定價模型或現代投資組合理論是一家之言 或是一派胡言，都已經讓學界和市場人士的眼睛為之一亮。這些理論問世 前，投資經理人和基金的績效都是跟標普500或道瓊指數比，並不會另外再
