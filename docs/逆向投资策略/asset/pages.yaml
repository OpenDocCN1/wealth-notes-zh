    最後，我們還討論了其他二個分析師預測的問題。一個是誤差不能怪到景氣循環的頭上，因為分析師的預測誤差在所有循環週期都很高；另一個是分析師的預測失之樂觀，除了誤差大，還傾向高估盈餘，若是不計代價買進股票的情況，高誤差水準加上分析師的樂觀偏誤，有很高的機率受到重創。前面提到，即使能見度很好的股票，只要預測與實際差之毫釐，都會引發大舉拋售，造成
