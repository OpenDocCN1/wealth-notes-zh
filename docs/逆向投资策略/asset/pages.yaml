  md: '尋找，並試過上千個可能有望的財務變數，但沒一個真正管用。


    這不是好的科學，而且相關性欠缺關鍵科學基礎，到頭來可能一場糊涂。重點是法瑪在 1998 年概括效率市場的論文中說，至今檢定過的波動性模型「都是平均報酬的一面之詞」。²⁶總之，沒有一致性。研究者用這些方法像是作繭自縛。


    好吧，還有一關要過。若市場是效率的，精明的投資人照理說會讓價格符合價值，那麼即使學界找不到，投資人不是老早也要知道有什麼未發現的相關性了嗎？如果連投資人都不知道，市場這幾十年來還算是效率的？既然尚未也沒有跡象指出即將提出新的波動性證明，我們只好斷定，效率市場假說在衡量風險這件事數十年來一直還沒做對，而且可能犯了明顯的錯誤。這個邏輯的泥沼似乎隨著每次新的發現而越來越難以脫身。


    但少了波動性相關性的效率市場假說，就走上了托勒密地心說的老路，試圖靠著本輪和均輪之類來補救的做法也很類似，看著人才從科學發現，落到闢途思想的田地，令人不勝唏噓，有些時候幾乎像是信眾。


    # 效率市場假說的致命傷


    第 4 章提到，證據一面倒地支持無法打敗市場的結論。現在我們進一步來看研究者當初「證明」投資人無法打敗市場的研究，結果包准出乎某些人意外。


    沒有什麼說法比法瑪對效率市場的描述還要一目了然：²⁷若市場效率的必要條件齊全了，也就是資訊充分為投資人所用，交易成本合理，並無一致性的證據顯示市場參與者會有比較好或比較差的報酬。


    這個論點假定成千上萬的分析師、基金經理人和精明投資人，會尋找並分析可用的資訊，讓價格與價值常保一致。²⁸但學者說很難評估投資人如何分析資訊，據以決定股票的價值被低估，於是檢定這項假設前提，變成了探討'
