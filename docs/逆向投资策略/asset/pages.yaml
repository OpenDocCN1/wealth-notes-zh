  md: '這項研究誕生了「迴歸」這個術語。迴歸的效應顯見不鮮，例如，高成就家長的下一代表現不如雙親，一開始低落的表现會漸入佳境，好運總有用完的一天等。$^{30}$


    以棒球來說，一個球員整季的打擊率可能有三成，但不是每天都是這個數字，也不會固定每十次打擊就打出三支安打，可能一陣子高達五成，一陣子剩下一成，但在162場季賽中，不管表現一時火爆或低潮，到頭來會歸於打者的平均水準。不過，球迷或主播不見得會放過打者當週或當月的狀況起伏，他們傾向於強調最近的紀錄，形容打者棒子火熱或陷入低潮，若選手自己也被影響，對短期的表現得失心太重，就會忘了成績長期會回到自己該有的平均水準。


    迴歸的例子屢見不鮮，即使是你想不到的地方也一樣。以色列空軍的飛行教官發現，最好別誇獎成功完成高難度演習的學員，否則下一次的表现會不好，反之，若批評一次演習做得不好，下一次通常會改善。其實，學員平日訓練的表现，就跟棒球選手的打擊率一樣，每天狀況都會有起伏，但飛行表現會歸於平均水準。這次降落地漂亮，下次跌跌撞撞，這次中靶，下次脫靶，這次隊形完美，下次歪掉。飛行教官誤以為褒貶跟演習品質有關，以為批評比誇獎好，正好違反了教學專家的普遍共識。$^{31}$


