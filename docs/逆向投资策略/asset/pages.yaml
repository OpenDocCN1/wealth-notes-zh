  md: '成宣稱星象沒錯，而是他們算錯日子，洪水正確降臨的時間是1624年2月1日，不是1524年2月1日，天佑倫敦，大家可以回家了，至少這100年可以安心了。


    資訊過量或者說訊息過量這問題，到底對我們有什麼影響？


    # 資訊過量造成的偏誤


    1959年博學的諾貝爾經濟學獎得主司馬賀（Herbert Simon）很早就認真探討了資訊過量問題，並且證實，因為人類無法有效處理大量的資訊，更多的資訊不見得會得到較好的決定，有可能反而比較差。司馬賀的說法是：「人類這種生物所在的环境，每秒會產生數百萬位元的新資訊，但感知器官有其瓶頸，每秒頂多容納1,000位元，甚至更少，我們只能對一丁點的資訊做出有意識的反應。」$^{35}$


    另外，司馬賀指出，過濾的動作不是被動的過程，而是「將注意力用在整體極小部分，並從一開始排除注意力範圍之外的部分的主動過程」，$^{36}$也就是說，這個過程本身也是有偏見的，據他的觀察，當人接獲大量資訊，眼中只會有自己感興趣的部分，其餘則排除在外。後來的研究支持這項發現，像是1999年巴巴·希夫（Baba
    Shiv）與亞歷山大·費多里金（Alexander Fedorikhin）$^{37}$以及2000年尼爾森·考恩（Nelson Cowan）$^{38}$的研究。


    在股市（和其他交易市場），很難說資訊過量對專業投資人或散戶哪個危害更大。資訊真的太多了，想想證券分析師的數量，有時一股股票有好幾十篇研究報告、即時訊息，還不包括企業、產業、市場、經濟、財務資料等研究報告資訊來源。資訊多到讓人難以招架，投資人要分析眾多因素，從競爭力、毛利、產品線，到市場發展對產業和公司獲利的影響，考慮的層面可說千頭萬緒。


    面對如此巨量、複雜而且互相矛盾的市場資訊，要全面掌握可說是不可'
