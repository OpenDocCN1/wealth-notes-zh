  md: '我們在上一章也看到，分析師整體上對於他們的預測過度樂觀。分析師的過度樂觀和顯著預測誤差（在一項具有里程碑意義的研究中，每年的誤差為9%）若產生綜效，對於熱門股的買家而言是相當致命的。


    最後，圖9-5和9-6得出的結果亦如我們所料：負面意外在意外季度與全年，對於中段組（中間60%的股票）的影響均大過低股價現現金流量比組，但遠不及高股價現現金流量比組。不過，正面意外所帶來的優異表現，抵消大部分的影響，而圖9-1、9-2和9-3也呈現出類似的結果。本章所有圖表得出的結果，均具備統計顯著性。


    # 觸發型事件之效應


    不管使用哪種估值法，當冷門股的盈餘超出分析師的預期時，就會有人大驚小怪。這種反差就好像分析師預測過度樂觀時，勝利組（本益比或股價現現金流量比最高的那20%）只要一旦閃失，表現會立刻下挫。


    這份研究也顯示，高估「最佳股」和低估「最遜股」往往會把股價推向極端。這自然而然帶出下一則投資心法。


    操作心理導航19：正負面的意外會以截然相反的方式影響「最佳股」和「最遜股」。


    人們對自己瞻前顧後預測未來的能力過度自信。從醫學、法律到新建廠房設施等領域，無一不在反映這項事實。成千上萬個瞬息萬變的公司、產業、經濟和政治事件在股海裡翻騰，以致股票市場可說是最難預測的領域之一。


    市場上好消息都有，導致「最佳股」和「最遜股」轉向截然相反的走勢。這讓我們想起「明星級」基金經理人的條件是，持續5年跑贏大盤2%、3%，反觀股價現現金流量比這項指標標的「最遜股」，在歷經所有意外'
