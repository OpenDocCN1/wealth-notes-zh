  md: '波動率遞降時會賠錢。這是一場新式終極市場賭局。波動率指數的數值，由芝加哥選擇權交易所根據即時標普 500 指數選擇權買進賣出的報價來推算。這項統計數據數值即使已被廣泛傳布，仍無法購得。


    但你毋須害怕，芝加哥市場的荷官針對波動率指數瞬息萬變的特性，為你設計了許多對賭的方法。畢竟，交易所想賺錢還是要花點腦筋。許多波動率指數衍生性商品允許交易商在手上沒有這個指數的期貨、選擇權部位的情況下，建立頭寸，包括波動率指數選擇權、標準波動率指數期貨合約，還有最近新增的迷你波動率指數期貨以及其他更新奇的種類。


    如果波動率上升，買家就賺錢；下降的話則賣家獲利。這是種有趣的投機工具，但是一樣是給交易所裡的鯊魚用的。我認為下列例子足以說明原因。2009 年 1 月 30
    日，有一檔新的指數股票型基金，標普 500 波動率指數短期期貨（VXX ETN）上市，用以投資波動率指數選擇權。從上市以來截至今日（2011 年 6 月），這檔基金已下跌了
    94.9%。波動率指數校準後數值下跌了 63.2%。校準（calibration）會消失是由於有合約過期的成本、佣金以及買入新合約的高額加成。結果算下來，這檔基金又損失了
    31.7%。波動率指數選擇權不會被放進保守型投資組合中，想也知道，理智清醒的人應該不會把它放進投資帳戶裡。


    # 防護措施 2：指數股票型基金


    指數股票型基金的手續費一向比絕大多數共同基金來得低。它通常是固定的投資組合，因此交易成本通常也較低。指數股票型基金與共同基金的差別在於，它不用贖回，且可在公開市場上交易。實際上，指數股票型基金有數百種商品，從賣空
    30 年期美國國債、*買賣黃金，到投資特定產業，包山


