  md: '有個有趣的實驗，²⁸有人找來一羣心理系研究生，為他們簡單介紹一名研究生的性格，內容其實不是倣關的資訊，但要他們據以回答：這名研究生讀什麼科。這份描寫據說是某位心理學家幾年前為一名受試者寫的內容，不僅過時，而且也不含受試者的學術偏好。（注意：心理系學生接受的訓練是這種側寫可能高度失準。）


