  md: '在65年間將增加至160萬美元，是投資債券的57倍。


    對於債券或國庫券，這是在大奏哀樂。越是長抱，樂聲越是哀淒。10年後通膨和稅負會吞噬掉你大約20%的資本；20年後則是35%；以此類推。最後兩欄再次說明，1至30年期股票表現優於債券和短期國庫券的機率，4年後會高出80%，而且時間越長機率越高。15年期滿股票有近乎100%的機率跑贏政府公債，98%的機率超越短期國庫券。因此，大多數人認為幾乎是「無風險」的政府證券，其實是輸家的遊戲。


    如表14-1和14-3所示，普通股雖然在短期間波動較大，但是把時間拉長的話，其所提供的報酬遠高於短期國庫券和債券。


    # 大家來找碴，這張圖有問題嗎？


    如我們所見，現代投資組合理論的出發點，是投資人從「無風險」資產（通常是短期國庫券）獲得的報酬。所以，投資人會按波動性開心選出由無風險和高風險資產組成的最佳投資組合。問題在於，學術理論中的「無風險資產」，即短期國庫券，長期來說是一種風險最大的資產。


    顯見，這種學術上的投資理論之假設與現實相去甚遠。理性投資人應關切的是儲蓄保值、增值的可能性，讓這筆儲蓄按照通膨和稅制來調整，並可因應退休或其他未來的需求。這才是其所面臨的最大風險之一。大多數投資人要著眼的時間範圍不是幾個月、幾季或一兩年而已，而是許許多多年，因為未來會需要資金來滿足諸如退休、大學學費之類的費用需求。說到底，這就是為什麼政府要設立延後課稅的退休金計畫、個人退休帳戶和類似計畫，並且讓成千上萬的投資人參與其中。大多數人的投資目標是，在盡量保本的情況下把钱放到未來要用到的時候，並藉此增值財富。


    你已看到這項風險測量指標似是而非的一面，主要風險不在於短期股價的波動性，而在於你無法透過基金的實際成長來達到長期投資目標。對於投'
