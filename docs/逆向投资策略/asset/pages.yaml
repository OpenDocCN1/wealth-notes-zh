  md: '我們也看出強化型事件的影響。「最遜股」遭遇負面意外之後（圖中顯示為低本益比有負面意外組），在意外季度接下來的19個季度裡一直跑贏大盤，而「最佳股」則在正面意外（圖中顯示為高本益比有正面意外組）出現之後總是跑輸大盤。儘管這兩者的表現，在觸發型事件發生的意外季度裡差距更大，但這裡還是看得出箇中差異。「最佳股」在這5年裡跑輸市場21.3%，而「最遜股」跑贏大盤20.4%。（依股價現金流量比和股價淨值比評估比較，也有類似的結果。）


    此處未顯示中段組的研究結果，不過，長期研究下來與1年內的情況差不多。意外事件只有波及新聞發布的那個季度，而之後的表現就與市場一致。大致看來，正面和負面意外所產生的影響幾乎相互抵消了，這正在我們的意料之中，因為中段組的股票並未過度高估或低估。


    # # 不期而遇的機會


    操作心理導航18教我們好好運用分析師的預測失誤和其他意外事件，拉抬冷門股的績效。那麼，現在我們要進一步描繪意外事件所產生的效應，而這些效應將會成為逆向策略的必要工具。至於逆向策略，我們稍後就會介紹到。操作心理導航20總結了我們對意外事件的研究結果。


    +   操作心理導航20(a)：整體說來，意外事件促進冷門股的績效，同時又削弱熱門股的表現。


    +   操作心理導航20(b)：正面意外會讓冷門股明顯增值，但對熱門股影響不大。


    +   操作心理導航20(c)：負面意外會讓熱門股價格大跌，但實際上對冷門股沒有影響。


    +   操作心理導航20(d)：盈餘意外所產生的效應會持續很長一段時間。'
