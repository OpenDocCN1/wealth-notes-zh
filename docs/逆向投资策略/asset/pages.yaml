  md: '天動地的危機。


    長期資本管理公司（Long-Term Capital Management, LTCM）是世上最大的避險基金，1994年3月開張，1998年初，已持有超過1,000億美元資產，及逾1兆美元的衍生工具，即使條件嚴苛，國內外逾50家大型商業銀行和投資銀行搶破頭想跟它有生生意來，為它降貴封尊。1998年時長期資本管理公司已是市場的當紅炸子雞，資產不到4年翻了4倍以上。


    長期資本管理公司在董事長約翰·梅利韋勒（John Meriwether）帶領下，人才濟濟，並網羅了以羅伯特·墨頓（Robert Merton）和提出布雷克—休斯選擇權評價模型的休斯為首的一幫效率市場派高手，共享1997年諾貝爾獎的兩人，麾下的優秀博士團隊之中不乏交易高手，陣容可說舉世無雙，一時績效應證實點。


    長期資本管理公司主打本國和全球債市的「相對價值」交易。例如有一檔優質債券，到期日相仿，一檔收益率比另一檔高25個基本點（1碼），那麼長期資本管理公司就會買進較高收益者，同時放空較低收益者，或同樣到期日，評等較高的西班牙債券收益也比英國的債券高，就買進西班牙、放空英國的債券，這種操作稱為「配對交易」。


    長期資本管理公司的部位分散程度極高，持有和放空的證券高達上千檔，長期資本管理公司的策略另一個特點是，買進的債券風險和流動性，都不如放空的債券，由於風險稍高且流動性較差的債券收益率較高，此舉可擴大價差，提高每筆配對交易的報酬。因為利率通常齊漲齊跌，配對交易價差的變動幅度，僅是債券本身價格變動的一小部分，長期資本管理公司認為這樣的操作風險很低；不管債券漲或跌，甚至市場崩跌，長期資本管理公司照理說都不會出問題，根據一位學者的算法，價差交易的風險，僅有買斷債券的4%。


    配對交易策略好的一面，對長期資本管理公司的事業來說只是蚍蜉小利，其實是公司活招牌的學界大咖休斯說：「公司像專挑地上大家看不到的'
