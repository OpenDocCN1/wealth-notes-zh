  md: '或沉迷於大規模盜版的國家設置臨時貿易壁壘。若他們剽竊我們的智慧財產或其他產品，也應該嚴格祭出罰款或其他損害賠償。這些國家若不支持罰款，美國也許可以實施報復性關稅制裁，直到他們付清為止。當然，這是撇開政治考量的做法。


    同樣地，對於中國和其他低薪國家，如果我們要求其在諸如環境、勞工保障、員工醫療和福利等方面符合最低標準，就會提高其勞動力成本，將有助於大幅減少對我們的出口順差。這是危險的敏感地帶，所以聯邦政府最好不要採取環境標準以外的其他措施。我們過去涉險過，在1980年代黑人獲得投票權之前，就曾經過禁運措施強而有效地限制南非企業、工會及個人僱用童工。


    我們還可以依各公司國內、國外就業機會增加的狀況分別給予減免稅額、降低租稅優惠，或者對其匯回美國的海外盈餘提高課稅，除非這些資金用在創造國內就業機會。迄今為止，前兩任政府或任何經濟學家都未真正面對或承認問題的嚴重性。


    歷任政府的許多政策成為摧毀美國汽車工業的幫兇。近30年來，美國每輛汽車的生產成本比國外競爭對手高出1,500至2,000美元。外國公司因沒有工會制衡而使用廉價勞工，但美國本國公司卻不被允許這樣做。各州還向這些外國公司提供租稅優惠，期能吸引他們過來投資。直到通用汽車（General
    Motors，GM）和克萊斯勒（Chrysler）破產後，才終於有了公平競爭的環境。至少目前是這樣的。諷刺的是，就我所知沒有哪個大型工業製造國，會在國內重要市場上替國外公司創造競爭優勢。我們對國內生產者實行了數十年的工會政策，同時又允許國外製造業者不設立工會，這使我們的國內汽車公司飽受威脅。


    如果我們沒有正視這些嚴重後果，就不會知道美國是唯一敢吹極端自由放任的公平貿易政策的國家。如果美國繼續目前的公平交易路線，將會看到大筆財富從老百姓的口袋轉移到中國和其他第三世界國家，在此其間也很可'
