  md: '高升，股價若不漲翻天，對股東和潛在買家很不公平。對此只能冷笑以對，因為瞬息萬變的科技，加上犀利的盈餘成長，反而表示預測的難度高出尋常。


    # 胡亂預測之十二：分析師的過度自信


    預測這件事越來越像漫手山芋。我們先提出若干近年發現，以免大家以為來到21世紀後，我們對問題的掌握有變好。


    企業資本支出似乎與生俱來可觀的樂觀偏誤，涉及新科技或業者不熟悉的計畫時尤其如此。幾年前一項蘭德公司（Rand Corporation）的研究，調查能源領域新型工廠的成本，32一般來說，實際建造成本是一開始估計的2倍，八成的專案未能取得原先預估的市占率。


    一項心理學研究調查這類型失敗的成因，結論是多數的企業雖以最壞情況作為資本支出計畫的情境，「但最壞情況的預測幾乎總是太樂觀，經理人看壞的一面時，一般僅稍微悲觀看待未來，而不是描述最糟的可能發展。」33


    過度樂觀往往是出於用了局內而非局外觀點來預估的關係。例如在金融危機期間，大型銀行、投資銀行、聯準會和財政部的舉動，就是很好的例子。2006年底到2007年初金融體系開始出問題時，這些大型機構一再出面安撫市場，並獲得聯準會主席柏南奇、財政部長鮑爾森等高層官員的背書。


    但早在泡沫破滅的2年前，房市泡沫謠言就在媒體上甚囂塵上，諾貝爾獎得主克魯曼、普立茲獎得主的《紐約時報》作家格蕾琴·摩根森（Gretchen Morgenson）等有識之士，紛紛披露各種誇張的現象，但聯準會和政府的高層卻置之不理。


    2007和2008年情況每況愈下，銀行和投資銀行持續陶醉於有毒的房貸組合，步入2008年春季時，雖說幾個月前次貸發起業者和不少避險基金已'
