    ^{15} $


    在眾多研究的擁戴之下，隨機漫步假說可說是穩如泰山，儘管如此，技術分析派還是很鐵齒，舉出煞有介事的成功例子，雖說大家都清楚這不過是機運，依照平均數定律本來就會這樣。當然，技術分析派的方法事後來看會特別準，他們也是人，會忘掉做錯的回憶，強調有做對的時候，做錯了，問題不是出在方法本身，而是用錯手法，或漏看某些資訊。技術分析派的說法還有宣稱某個方法在特定期間用電腦跑的結果是成立的，他們說得沒錯，問題是換一個樣本期間，或擴充數據再跑一次，本來的相關性可能就消失不見了，不過就是證明這方法真的很講運氣。


    退一萬步言，其實沒有人窮舉所有隨機漫步假說不成立的情況，否則豈不是要真的把現有的上百種技術分析方法拿來排列組合跑一次並判讀結果，於是技術分析派大可以說，一來沒人全都檢查過一遍，二來最好要多種方法並用，而且怎麼解讀其實很看人的功力火候。總之那麼多證據出爐，技術分析的方法還是沒能讓隨機漫步蒙塵。


    雖說學術上一敗塗地，股市線仙之類的技術分析派還是大行其道，畢竟學界的研究就當不知道就好，希望會員或學生也不要去知道，而且自己的方法也有些不同之處。偶有遇到拆台的情況，通常也提不出事實的根據。


    學術派要投資人提防技術分析時，似乎是把它當成某種落後巫醫或算命術士（姑且先不提占星）。這個金融預言的宗派多年來遭受來自學界和基本分析派的貶責，比較不客氣的基本分析派，會向學界進言把技術分析派抓來'
