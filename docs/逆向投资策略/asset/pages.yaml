  md: '**操作心理導航33(a)**：試著忽略近期的市場波動；如果你打算投資5年或者更久，真正的風險在於，手上沒有升值速度快過通膨的股票或類似投資。


    **操作心理導航33(b)**：除非收益很高，否則勿長期投資債券、儲蓄帳戶或其他低息固定收入證券。它們是高風險金融工具，成功的機率很低。長抱越久，風險就越大。把它們當作滿足短期或中期需求的現金庫即可。


    儘管這些圖表一清二楚，但是傳統思維扭轉得太慢。


    於此，奈特教授如何區隔風險與不確定性對我們來說是極為重要的一課。股票和債券市場的表現在短期內都是不確定的，但不確定性會隨著時間轉化成風險。如果風險伴隨的勝率與股票一樣高，那麼風險就是我們的朋友。我們必須銘記，以股票和類似投資來說，風險轉化成勝率的可能性會隨時間增加。*


    不放眼在預計持有投資的時間而只著眼於短期，會讓報酬低於標準或預期。投資人最好是關注股票投資組合在持有期間的變化，別太在意短期的波動。


    下列投資心法總結了這些發現：


    **操作心理導航34(a)**：通貨膨脹和稅負會大為降低長時間持有股票的風險。


    **操作心理導航34(b)**：通貨膨脹和稅負會大幅提高長期持有國庫券、其他債券和儲蓄帳戶的風險。


    * 在過去的65年裡，股價僅在1969至1982年這15年間沒有上漲。儘管是在那個令人失望的時期，由於股利的關係，每年總報酬率還是有5%。到2000年，股價上漲逾12倍之多。相比之下，債券的表現實在慘淡。'
