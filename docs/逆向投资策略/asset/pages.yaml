    Fama, 1965）,9例如法瑪的博士論文分析道瓊指數30檔成分股逾5年的單日到雙週股價後，結果支持隨機漫步假說。


    若股價是隨機的，那麼不管手上握有什麼價量資訊，或線型看起來有多明顯，都不能用做預測工具，畢竟股價下一步跟上一步獨立。如果股價連漲七天，也不會影響第八天的走勢結果，隔天可能漲、跌或持平，意思就跟連續擲出銅板正面，下次正反的概率各是五十五十一樣。


