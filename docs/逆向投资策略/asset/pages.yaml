    # 情感：作用強大的心理面


    好在現在可以解答了。發端於 1980 年代早期的研究，20 年來逐漸吸引研究者投入，終於出現了深入人心的新興研究發現，除了回答泡沫頻頻發生、投機熱潮和恐慌期間極端價格走勢的原因，還能解答不少其他市場謎題，有的謎題攸關我們的投資決定，有的則對當代的風險分析一針見血。


    最重要的發現是最近才被認定是人們判斷和決策成分的「情感」[有時稱為情感捷思 (affect heuristic)]。\*情感學說指出，人們的強烈喜好、厭惡和意見，形於快樂、難過、興奮、恐懼之類的體驗，會有意識或無意識地左右我們的決策過程。


    情感可以單獨或與理性決策過程相輔相成，在市場上或市場之外發揮作用。情感是情緒，而非認知，所以是自動、迅速地反應。情緒性的反應不用出於理性，通常也不是出於理性。


    認知心理學大師保羅·史洛維奇 (Paul Slovic) 教授，與經濟學家康納曼的研究成果，是我們探討情感與捷思時的二大核心。史洛維奇寫道：「夾藏正面和負面感情的意象，令判斷與決策變成感情用事。
    」¹意思是，人們心懷的客體及事件表徵，帶有程度不一的正面或負面情感標籤。舉例來說，一個熱血的球迷對支持的球隊心懷正面的表徵，但若是對手的球隊，則會心懷負面的表徵。史洛維奇在論文上繼續寫道：「人們利用情感捷思下判斷……
    人們徵詢或參照『情感庫』(包含所有有意識或無意識與表徵有關聯


    \* 認知捷思會在第 3 章介紹。'
