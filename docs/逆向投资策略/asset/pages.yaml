    1998年上半年長期資本管理公司虧損18%，資本縮水讓槓桿大增，漸漸拿不出追繳的保證金。1998年8月，俄羅斯倒債，市場一片驚恐。1997年底時，長期資本管理公司資本水準還逾50億美元，不到4個月內剩沒幾億。流動性和槓桿這兩個效率市場假說理論，還有墨頓、休斯等人看來連當公式標誌符號都不配的風險，一展身手，如同1987年崩盤那時。


    市場大跌，長期資本管理公司因手上龐大的空頭部位損失慘重；資金逃難潮繼續撐低長期資本管理公司手上較不安全的多頭債券，而長期資本管理公司交換的空頭債券因投資等級較高，跌幅顯著較小。墨頓團隊因應流動性超漲而大舉放空的波動率交換合約漲得更兇，追繳的保證金越來越多，公司的資本大失血。


    追繳保證金，加上部位流動性差賣不掉，長期資本管理公司的槓桿站上100比1，也就是資產只要虧損1%，公司就會倒掉，問題是，為了自救得賣掉的龐大部位，流動性就是比放空的部位差，就是賣不掉。行情對的時候，槓桿讓資本實現巨大獲利，行情不對時，即使賣掉一小部分持有的部位，就會撐低價格（於是流動性更差了）。長期資本管理公司氣數已盡。


    8月非常難熬，這個月長期資本管理公司虧損19億美元，占資本的45%，對照1,550億美元資產，槓桿達55倍。數學上，長期資本管理公司出現8月這種虧損的頻率，宇宙要輪迴好幾次才會遇到一次。¹* 長期資本管理公司的資本是風中殘燭，因為交易規模太大，流動性太差，無法去槓桿化，想賣掉一點都怕壓垮整個市場，十年年後的次貸風暴情況也是這樣。


    市場近乎恐慌。長期資本管理公司這時遭遭一批乘人之危的銀行、券商環伺，這些人知道流動性和槓桿問題正在煎熬這家公司，開始放空長期資


