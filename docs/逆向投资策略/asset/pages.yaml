  md: '# 第 **16** 章


    # 不是那麼看不見的手


    自由市場經濟學之父亞當·斯密（Adam Smith）在他的名著中〔1776年出版的名著《國富論》(*The Wealth of Nations*)〕提出「看不見的手」理論。這隻無形的手將資源和資本導向了最有生產力的地方，這是經濟學文獻中最廣為人知的比喻之一。用亞當·斯密的話來說，人「既不打算促進公共利益，也不知道自己能貢獻多少……他只是為了已之利……在一隻看不見的手驅策之下追求自己的利益，這將帶來超越個人意圖的社會發展。」¹


    當然，亞當·斯密是自由放任經濟學，即最純粹的自由企業形式發展的主要代表人物。他強烈反壟斷、反卡特爾（譯注：多家公司為控制價格和限制競爭聯合組成的同業聯盟），並一再警告針對大眾的「共謀」，抑制「拉高價格將買方擠出市場」的問題。²
    亞當·斯密還警告說，真正的自由放任經濟將很快變成工商業勾結對抗消費者以至影響政治和法律的情況。而現在的情況似乎已如亞當·斯密所預見的那樣。


    20 世紀末到 21 世紀初期這幾十年間是美國經濟實驗的時期，不是大政府指揮或大衆大聲疾呼要求變革的結果，而是美國相信自由市場的力量。許多頂尖經濟學家和金融專家都在強化這個信念，並且至少是從雷根時代起，共和黨和民主黨政府都大力支持。


    這種對於市場的信念，在本質上是信任「看不見的手」可以指引買賣雙方達成最佳結果。無論是住宅、汽車、建築設備、沃爾瑪（Wal-Mart）的商'
  merge: -1
  img_proc: true
- pgno: 387
  md: '品，還是網路零售產品，市場機制都會調整供需關係達到公平的價格、公正的分配，以及對社會有利的結果。至少這是基本理論。


    只是，這隻看不見的手現在還是看不見的嗎？


    簡而言之，一些市場參與者很想「幫助」看不見的手達到對個人利益和錢包有利的結果。幾代人以來，這種反競爭行為和市場壟斷一直被拒拋在外，在美國經濟中少見成功者。


    亞當・斯密明瞭壟斷的危險性，以及管制壟斷的必要性，與我們在一章見到的葛林斯潘不同的是，儘管葛林斯潘景仰這位大師，但他似乎更受蘭德提倡之絕對經濟自由學派的影響。諷刺的是，這位自由放任理論的開山始祖在解決這些問題方面，更可能傾向於支持老羅斯福的解散托拉斯政策。我們也看到葛林斯潘的立場為何了。


    儘管自由放任式去管制化時代似乎已經過去，但只要用點心就會發現，看不見的手和想幫忙的手之間，仍存在激辯論戰。那就是「自由貿易」的問題。這個由來以久的議題，現在已擴大為全球經濟界關切的焦點，它在未來幾年如何發展，將左右著海内外每一位投資人的資產走向擴張或是亂局。談及投資，現在無疑是全球化的時代，主要經濟體之間連結的程度可說是空前緊密。


    考慮到我們必須面對的世界，所有投資人若要保全跨國性質的投資，應特別關注兩個主題，即我們對於自由貿易（和公平交易的相关難題）的展望，以及未來可能發生的不正常通脹，對於投資會產生什麼影響。貨幣這隻巨龍可是永遠都殺不死的。


    # 自由貿易


    亞當・斯密當然信奉自由貿易。他堅決反對我們第一任財政部長亞歷山大・漢密爾頓（Alexander Hamilton）1790年代初期為保護美國幼稚產業'
  merge: -1
  img_proc: true
- pgno: 388
  md: '（infant industries）力圖設置障礙，因為他堅信，美國農產品具備競爭優勢，開放廉價農產品出口將對美國有利。³


    在近 200 年來，比較利益法則（comparative advantage）一直是自由貿易的核心理論，是由英國經濟學家大衛·李嘉圖（David Ricardo）1817
    年率先提出的。⁴ 李嘉圖以英國和葡萄牙為例來說明他的論點：葡萄牙生產的葡萄酒和布料比英國更便宜。但是在英國，葡萄酒的生產成本很高，而布料價格也貴了一點。儘管在葡萄牙生產布料比英國來得便宜，但對葡萄牙來說，生產更多葡萄酒來換取英國的布料，葡萄牙就能兩者兼得，而英國也能從這種貿易中受益，因為其生產布料的成本仍保持不變，但現在可以用較低的價格拿到葡萄酒，算是筆更好的交易。因此，每個國家都可以透過專事生產有競爭優勢的產品並賣給其他國家而獲益。⁵


    在過去的 200 年中，基於經濟、道德和社會政治種種理由，自由貿易一直是經濟學中最具爭議的話題之一。美國最近有項調查顯示，多達 65% 的受訪者反對自由貿易。令人驚訝的是，高收入族群反對的比例更高。⁶


    在近幾十年裡出現了許多支持或反對自由貿易的新理論，比較利益法則也開始受到挑戰，其中甚至有不足是來自支持自由貿易的新假設。克魯曼就寫道：「自由貿易並不過時，但它早已失去初衷，再也回不去了……在現實的政治世界中，自由貿易仍然被當作良好政策和有效目標，但再也不能妄稱經濟理論告訴我們的政策永遠是對的。」「⁷


    # 我們正處於自由貿易的新時代嗎？


    在美國仍然有個領域對於這隻看不見的手越來越放鬆，即便這隻手時不時會失靈。這個領域就是自由貿易。李嘉圖的思想在當時是對的，遠東地區和其他未發展偏遠地區的人民永遠不會成為國際勞動力的份子。即使有可能，將原材料運送過去，再把成品運回歐洲的成本最後也會導致價格過高。'
  merge: -1
  img_proc: true
- pgno: 389
  md: '然而，在過去的60年裡，這些國家的科技和技術勞工已讓19世紀初期那種情況大大翻轉了。運輸便利，工人的技術臻於熟練且受了良好訓練，機具也能輕易運往任何國家地區，再再降低了亞洲及其他地區的生產成本。


    結果是，美國這類高薪國家相對於低薪國家，處於極大的劣勢。2008年，美國平均時薪為18.00美元，若計入6.2%的社會安全稅（Social Security
    tax），即每小時3.60美元的福利，雇主主要支付的平均時薪約為22.90美元。相比之下，2008年中國平均時薪2.00美元，印尼0.65美元，印度0.41美元，泰國則是1.67美元。⁸


    中國員工1小時的勞動成本不到美國員工的9%。實際上，光是美國平均每小時徵收的社會安全稅，就幾乎是中國工人平均薪資的三分之二，印度工人平均薪資的3倍多。進一步言之，在一個完全競爭的世界中，如果在美國有1.5億工人，而中國、印度、印尼和其他低薪亞洲國家有20億工人，美國工人製造相同產品的平均薪資，勢必從22.90美元大砍才能有競爭力。


    這是最壞的情況，因為許多工作顯然無法外移。但不幸的是，這裡的水很深。這就是為什麼我們把幾百萬名最好的工作外包給外國，而且未來還會繼續這樣做。李嘉圖無法預見未來，而且大多數當代經濟學家也還未重視這個牽連甚廣的棘手問題。


    首先，美國消費者和幾乎所有國家的消費者一樣，都希望價廉物美的商品。這種需求推動了沃爾瑪從45年前的新創企業，發展至今成為美國最大的連鎖零售業者，而沃爾瑪的革命現在已經大幅擴散到其他產業中，帶動數千家企業生產或銷售低成本產品。


    其次，低成本的外國勞動力能讓許多企業保持本國競爭優勢。美國汽車零件製造商多年來一直處於劣勢，因為國外競爭對手供應的產品價格較低。美國汽車業三大巨頭不得不迫使大量供應商要在亞洲設廠，若不這麼做，就會被排除在供應鏈之外。在國外設廠已成為工業界上百家公司的生存之道。


    以其他產業來說，成本壓力日益加大，又想兼顧利潤成長空間，致使美'
  merge: -1
