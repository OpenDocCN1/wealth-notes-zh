  md: '# 第 13 章


    # 新世界的投資法則


    當今的投資世界對於許多人來說，就好像裹著太空衣在太空漫步般陌生。在太空衣裡，你可以聽到宇宙發出的嘶嚶聲，以及從更遠的地方傳來隕石撞岩石的爆炸聲。深不可測的火山口在微暗天色之下近在咫尺。來自地球的唯一一道光，看似光亮卻遙不可及。若你一下子移動得太劇烈，可能會因為失重被拋向火山口或嶙峋山巔。總之，歡迎你的到來：這就是許多人今日身處的投資世界。


    這個投資世界既雜亂又艱困，迥異於我們十幾年前熱切擁抱的那個世界。我們在此將探討，在一系列重大的新威脅襲來之際，你該如何因應，又該如何運用其伴生的新機會。


    大多數我們了解並掌握的投資法則似乎已經改變，令我們感到陌生。我們正面臨劇烈的動盪、閃電式崩盤；大衰退之後，經濟正緩慢復原；衍生商品如此複雜，以致於像是美國國際集團之類的大型機構也因此搞得身敗名裂；股票和債券市場看起來也不時失常。要適應眼前這個迥異而陌生的投資環境，我們必須擁抱改變、竭力調整。


    # 股市閃崩事件和 2011 年 8 月的市場恐慌


    電子技術成就了過去無法實現的市場策略，但也可能具備大崩盤的所'
