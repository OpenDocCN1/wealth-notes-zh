  md: '現在已經漲到了 16 倍，我們會賣掉，而且換成另一支低本益比股票。*


    第一個規則很簡單：在買入股票時就選好賣出的時機。在時機到來時，請咬緊牙關、集中精神以及果斷切割。你可能會捶胸頓足，因為股價通常會升得更高。但是，人心不足蛇吞象。你已經賺了不少，而這就是這場賭局的目的。（唯一的例外是，你有十拿九穩的把握。）


    然而，所謂賣出的時機點並不一定代表股價上漲就要賣出。如果你玩的是低股價淨值比策略，你可能會發現，即使在股價猛漲後，它仍然會以低於市場的股價淨值比賣出，這是因為股票淨值也在持續增加。一支股票的股價淨值比經常是多年保持在低點，就算股價翻了
    2 到 3 倍，股價淨值比仍處於低位。這種情形在低本益比、低股價現金流量比以及高殖利等逆向策略上亦然。


    另一道問題是，沒用的股票應該放多久。投資人常常愛上他們手中的持股。我還見過有些投資組合的幾十家公司從報紙上看上去都好棒，但早在市場上被打下了落水狗，報酬率低得很。


    同樣地，這個問題的答案眾說紛紜，但我認為 2 年半到 3 年合適的等待期。（如果是收益下降的週期性股票，可延長到 3 年半。）如果這支股票過了等待期仍然令人失望，就必須當機立斷賣出。已故的價值型投資大師坦伯頓爵士採用的等待期是
    6 年。你是判官，但請堅守自己設定的時限，不要固執己見地拖泥帶水。


    另一項重要規則是，如果股票長期基本面明顯惡化，則立即賣出。研究報告再怎麼鑽之潿深，總會有壞事發生，從而讓公司或產業的前景蒙塵翻黑。我指的不是糟糕的季度表現或暫時性突發事件，而是那些會削弱公司前景的重大變化，就像金融海嘯對許多金融類股影響那樣。在這種情況下，


    > * 價格隨時間變動，投資組合中的股票權重自然會有所不同。當股票賣出時，應著手回補新股，讓投資組合的持股權重回復平衡。'
