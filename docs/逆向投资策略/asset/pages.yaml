  md: '最冷門股在左數第一。如圖所示，在研究期間和所有樣本中，股價淨值比（20.5%）最低股的年報酬率超出最高股的2倍多。低股價淨值比股票的績效每年平均比市場平均值高出4.6%，而高股股價淨值比股票則少了5.7%。


    法瑪在一回採訪中淡化了低本益比效應，他把低本益比股票表現不錯的原因歸之於它們當中有許多也屬於低股價淨值比股票。我們可以說，事實正好相反。就如《財星》雜誌的結論：「有人可能稱之為學術上的吹毛求疵。」$^{15}$既然法瑪抵制低本益比效應已有近30年之久，把它解釋為是學界保全面子的一種表徵，倒也不無道理。


    讓我們暫且回到巴蘇的表10-3。他在最後一欄針對貝係數調整了這張表，發現低本益比股票的波動性實際上是低於高本益比股票。效率市場假說理論明確指出，低本益比股票的貝係數（或是風險），會高於高本益比股票。而它之所以會如此，是因為這些冷門股的報酬率要比高本益比股票來得高。還記得我們在第6章討論到的資產訂價模式、法瑪和他同事的三因子模型，以及所有其他效率市場風險報酬率模型，它們的關鍵前提就是教授們大力提倡的說法，即高報酬必然伴隨高風險（波動性），而我們當時還試著找出證據。


