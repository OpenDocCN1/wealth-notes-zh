    操作心理導航 2(b)：不要被個股或大盤最近大幅偏離水準的行情誘騙，若報酬率特別高或低，很可能事有蹊蹺。


    # # 誰的影響？


    上一章我介紹了情感對投機狂熱和市場崩盤的影響力，本章目前為止介紹了突顯性及新近效應這兩個易得性捷徑讓人落入的圈套，有人可能好奇，這三者可能出現在同一個泡沫或投資人的失誤中嗎？關於這問題，我們要好好來看看最前沿的認知心理學家在做的研究。


    雖然比認知捷思更晚提出，許多研究人員認為情感是驅動價格起伏的力量，不過，此時試圖精準回答新近效應、突顯性，還有情感三者在背後做何推波助瀾，會有點像在搬弄「魔王讓公主叫破喉嚨」的文字遊戲橋段（而且是沒完沒了的超級加長版）。但跟相對推波助瀾究竟為何無關的是，我們仍很容易從這三者領會到其中潛藏著蓄势待發的危險。


    雖說這些心理捷思彼此之間的帳最後要怎麼算，可能還要許多年才會拍板，但現在先個別上有所認識，可讓我們建立防線，好看清泡沫並及時脫身，當然，同理也可以在股票跌跌不休，變得離奇地便宜時，想想可以怎麼做。


