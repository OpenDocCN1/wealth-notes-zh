    # 逆向投資的近期績效


    你當然有權好奇，這些逆向操作策略或其他任何策略，是否仍在這個新的或是怪異的投資世界裡發揮作用，畢竟有很多投資法則似乎已被淘汰了。答案如圖 11-1和11-2所示，是肯定的。它們涵蓋的時間雖然很短，但卻是充滿各種大爆炸的時期，包括2000至2002年網絡泡沫爆裂，隨即緊接著是房地產泡沫化，再來是金融海嘯以及2009年的市場反彈。


    在這段時間裡，整個市場什麼都經歷了，就是沒輕鬆過。但是，冷門股票看來卻能比熱門股票更能禁得起打擊。這張表說明，從2000至2010年，以這四種逆向策略中投資10,000美元，其在這段期間的表現會超過市場。低本益比股票帶來的年報酬率最高，有11.7%，而在所謂的「失落的十年」裡，市場報酬率為5.6%。至於其他三種評估指標，即低股價現金流量比、低股價淨值比、低殖利率，也都優於市場平均值，這裡仍用Compustat資料庫登錄1,500家公司股票計算。用這四種指標來看，熱門股全跑輸大盤，而且除了低殖利率以外，其他都帶來負投資報酬率。低殖利率股票的年投資報酬率達2.4%。最糟糕的是高股價現金流量比股票（每年負2.9%）和高股價'
