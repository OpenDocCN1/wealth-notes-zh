  md: '# 第6章


    # 效率市場和托勒密的本輪


    寫了30幾年讓效率市場假說的黨羽們看不順眼的〈富比士〉專欄，我稍微對17世紀初的科學作者伽利略（Galileo）的遭遇有了一點點體會。這名偉大的義大利科學家提倡的太陽系日心說，不見容於當時仍恪守地心說的哲學界和天文學界當道，悖逆了地球是宇宙中心的看法，因而被迫宣布放棄自己的理論。1632年他出版著作，遭宗教法庭審訊，被判「異端嫌疑重大」，¹再度被公開認錯，餘生遭終身軟禁。


    名門正派的地心說出自2世紀的大學者托勒密（Ptolemy），住在相當於今天芝加哥大學的亞歷山卓，這座埃及城市是當世學術中心，因為托勒密的貢獻，後世遂將這套天文學稱為托勒密地心體系。


    他的學說利用數百年的天體觀察資料，解釋太陽和行星的運動，並編制方便計算行星過去和未來方位的星表。這學說的基本前提是地球是宇宙的中心，太陽和群星都繞著地球轉。托勒密地心體系在往後近1,600年間，成為文明世界的通說，對陸上和海上導航至為重要。


    偏偏伽利略在1609年拿起望遠鏡研究天文學，率先觀測月球火山口、太陽黑子、木星四大衛星，還有土星環。托勒密地心體系的地位還固若金湯，但為了包容新的觀測資料，模型變得越來越龐雜，行星和恆星互繞，地球落在一組由小圈圈「本輪」和大圈圈「均輪」（本輪再繞著均輪轉）構成的圓周組合中，結果就是不可思議的一球毛線團。'
