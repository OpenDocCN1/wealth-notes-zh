  md: '讓我們從在賭場贏錢的機率來看看長期贏過市場的可能性。基於為期41年的研究， ${ ^{18} }$ 我們知道每次賭博的賠率是64。但如果連續賭幾把，結果會如何呢？用市場的說法是連續幾年採取逆向操作策略。


    我們用統計方法計算出答案，而非用蒙地卡羅模擬分析法（Monte Carlo simulation）所產生的巧合來證明。我們將每個季度都視為是一張牌卡，而研究期間長達41年的話，我們就有164個季度。將低本益比選股的績效當作牌卡，從164個季度隨機選擇一個季度，計算相對於市場的報酬率，看是正是負。然後將牌卡放回去，接著用相同的方式隨機選卡、計算報酬率、放回原位。這樣一來，任何一個季度都可能被重複抽到，而有些季度完全不會被抽到。


    實際上，這等同於我們在164個研究季度中，選取任何可能的市場報酬率組合，算出贏過市場的機率。每一局抽100次的話，加起來相當於25年。 ${ ^{19} }$
    這給了我們幾乎超乎想像的大量組合，讓我們可以準備算出某種策略長期下來的成功率。蒙地卡羅模擬法則是讓我們可以得到數十億種可能的組合（實際上應該是 $ 164^{100}
    $ 種，或者說是比從這裡到仙女座星系的距離還遠，相距約200萬光年的那個數值）。


    但是絕大多數投資人不會一次就完成投資；他們每年大概會撥幾千美元以上投資。我們為了減輕電腦的負荷，先假設每年投入1,000至20,000美元，再就這些策略分別運算10,000次，得出它得打敗市場的機率。這四種價值型策略的電腦運算結果千篇一律，只有一點小例外。


    表11-3顯示用低本益比策略，在上述研究期間、投資金額範圍內，使用低本益比策略，相對於市場的投資結果。如你所見，使用逆向操作策略所累積的財富令人咋舌。如免稅帳戶每年投資1,000美元，25年後會變成262,709美元。用同樣的方法，每年投資20,000美元，則會變成5,254,173美元。


    如果採用低本益比策略，每季度重新配置投資組合中的最低本益比股票，那麼25年後打敗市場的機率是多少呢？相信這個數字連最奢華的賭場'
