    12 家聯邦儲備銀行總裁和高層的發言，即使可能是不假思索，甚至互打嘴巴的說法，也無視這些人過去預測的表現可能不怎麼樣。


    就像古代祭司以獸骨裂度預言未來，不少專家會仔細檢視官方高層的言行，即使往往摸不著頭緒。有人問世界西洋棋冠軍要怎麼避免下出差勁的棋步，棋手回答：「不要有動作。」


    但太多投資人按捺不住，聽到一丁點消息，就隨之起舞，好像掌握了什麼確鑿的趨勢。按照平均數定律，本來就會有不少行家會繳出不錯的續效，通常是跟到大行情，但過了幾個月或幾年就會吐回來，投資人從歷史可以學到這樣的教訓，而且還會繼續從未來的市場行情中學到。


