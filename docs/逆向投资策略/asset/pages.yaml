  md: '資組合，會帶來遠超出市場的報酬率。但是，你可以不那麼頻繁地做再平衡。這是一種在操作上低強度、報酬上高强度的策略。你不必花太多時間為你挑選的股票，或是為了從掌握關鍵資訊追蹤了解每間公司、產業或經濟情勢而痛苦。你只要選定你的投資組合（稍後就會揭曉做法），然後讓它進入自動駕駛模式。如此一來，你會省去煩惱，更不用說稅金、佣金和交易成本了。同時，可以保障超出市場平均值的獲利空間，而且，如你所知，很少有基金經理人能做到這一點。這張表的目的不是要讓你把一項投資組合放到天荒地老，而是要告訴你，我們一直用忙碌來換取成功這種常態性工作倫理是徒勞無功的，這在投資上反倒會適得其反。


