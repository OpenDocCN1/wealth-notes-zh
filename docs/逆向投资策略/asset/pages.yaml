  md: '+   2. 這種做法有道理嗎？


    接下來看看這些問題。


    上一章在波動性著墨很多。波動性越大，投資人的報酬就越高，反之越低嗎？結果顯然不是。實際上，學術研究 30 幾年前就有找到答案，我們現在來看看。


    頂尖的效率市場假說學者怎麼知道投資人是算股票的波動率來衡量風險？其實學者不知道，也沒研究過這件事，就是做出波動性和報酬率相關性的研究，而且做出來的結果也沒定於一尊。學界只說事實就是這樣。還有，這個風險定義容易拿來建立複雜的電腦財務模型，這點正中教授們下懷，於是便拿它來建立簡單優雅的理論。


    這種看待風險的方式，讓經濟學家難以抗拒，幾乎到了走火入魔的地步，因為，這正是理性的人理論上應該有的行為；如果經濟學家進一步證實投資人會趨避風險，得證說：人是理性決策者；要是投資人只為了賺取更高報酬而承擔更高的風險，這遮得了，投資市場和個體經濟學理論兩大領域，不就融會貫通了。投資市場讓經濟理論功行圓滿，苦尋兩個多世紀，終於找到用以證明理性行為的市場，對錯先不管，這麼好的事經濟學家不可能放過。


    教授們也開發出根據投資組合的風險，相應調整基金和經理人績效的方法，問題是當波動性不是唯一要丈量的風險，這樣的方法就有問題，不過 40 多年來，這一套就是衡量風險和報酬的高招。兩個人
    1 年分別賺 15% 和 30%，但後者的投資組合波動率若高出許多，風險調整後報酬可能反不如賺 15% 的那人。


    結果可能還是看誰會化腐朽為神奇。波動性看起來是條有難度的數學式，但用的卻是昨是今非的材料；算波動率要代入過去有關聯的數據，且宣稱未來仍可派上用場。這不是良好的科學，我看這眼光用歷史股價就要洞穿未來股線的分析師差不多了，但前面介紹過，學界明明對後者的基礎難以'
