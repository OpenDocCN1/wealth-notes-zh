    # 投資人過度反應假說之定義


    投資人過度反應假說指的是，投資人對某些事件以一貫而可預測的方式反應過度。


    這是基於心理力量而產生的行為，我們曾在第一部分的研究結果中仔細探討過，而已被生物學證明的神經經濟學新發現，則在第 9 章討論過。


    投資人過度反應假說的三大核心預測是：


    +   1. 投資人會一直高估熱門股，而低估冷門股。


    +   2. 投資人會發現自己對「最佳」股票的預測過於樂觀，對「最遜」股票則過於悲觀。結果是異常盈餘往往可是可預測且一致地偏向「最遜」股票。


    +   3. 長期來看，冷門股和熱門股受異常盈餘意外和其他基本面因素的影'
