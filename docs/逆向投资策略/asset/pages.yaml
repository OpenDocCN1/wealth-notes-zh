    # 包準虧錢的方法


    有人可能想，本書是不是誇大了股市中做決策和預測的問題？這方面我認為大家不妨看看歷來專業人士在不同時期熱衷的投資。


    設想1968年2月紐約希爾頓酒店一場給機構投資人的國際大型研討會上，上百位與會代表被問及今年最看好增值的股票，當天的飃股University Computing雀屏中選，但不到12個月後，這檔從443美元一路下跌88%。1972年冬季《機構投資人》辦的研討會上，大家認為年底前航空股表現會最好，結果後來只繼續漲不到1%，到年底已跌了50%，隔年的研討會改口說這類股不要去碰。1999年有場法說會，一大票專業投資人選了安隆（Enron），說它是未來12個月的領頭羊，後來怎麼樣大家都知道。


