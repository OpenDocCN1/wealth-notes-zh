  md: '貿易。《國富論》約四分之一些幅是在反駁重商主義，即保護主義政策在刺激出口的同時也限制進口。只有在所有貿易夥伴都贊同的情況下，才存在自由貿易，而這在當今世界幾乎是不可能的。亞當·斯密會希望任何一個國家在一個非自由貿易的世界裡採取自由貿易政策嗎？我相當懷疑，因為他的理論涉及跨國關係，而不是只針對單一國家。


    美國並非不知道這種遊戲或戰術，但我們的主要玩家會隨政權輪替而改變，而我們最狡猾的競爭對手數十年來派出的是明星級貿易談判高手來為國效力。我們必須密切關注美國怎麼玩這場遊戲。美國在近期與韓國的貿易談判中，歐巴馬總統提供了大好機會，由美國幫助韓國，在韓國工廠裡建造韓國自己的噴射引擎。如果這是真的，我們將讓出一個仍具強大競爭優勢以及最新技術的產業。此舉可能使韓國成為低成本出口國，有可能進一步增加我們的貿易逆差，讓我們失去更多的技術工作。


    2011年1月下旬，航太工業最大的飛機技術和噴射引擎供應商奇異（General Electric），與中國一家國營企業達成一項商用飛機聯營協議（joint
    venture），2家公司將共享奇異最先進的飛機電子設備，波音公司最先進的787夢想客機（787 Dreamliner）所採用的技術也在其中。中國正在世界最先進產業尋求技術支援，以期和波音與空中巴士（Airbus）一較長短。已開發國家的尖端技術產業正在拿自己的技術專長，換取他們在中國的市占率。
    9 越多技術先進公司加入這個遊戲，中國就越能在超精密技術產品開發上飛躍領先，這可能會增加其出口量，同時拉低先進國家的出口量。更有甚者，亞洲四小龍以及其他新重商主義國家也擅長於這種新型「自由貿易」，進而讓這個問題更形惡化。


    中國經常不履行保護智慧財產權的承諾。更糟糕的是，中國人完全剽竊和複製美國知識產權，從電腦軟體到音樂娛樂公司的影音光碟，再到電玩遊戲和頂級時尚，每年海削數百億美元。根據彭博社2010年報導指出，從2005至2009年，盜版軟體市值翻了1倍，估計達到75.8億美元。微軟執行'
