    # 關於投資組合的其他注意事項


    # 我從哪得到統計資料？


    你可能會問，該如何平均分組。經紀公司、諮詢服務和財經出版物經常刊登一大串逆向投資股名單〔以《價值線投資調查》(Value Line Investment Survey)為例，它每週會根據追蹤結果，列出全球1,700家公司中，本益比、股價現金流量比、股價淨值比排行最低以及殖利率最高的100家公司〕。其他2家統計資料庫則分別是美國散戶投資人協會（American
    Association of Individual Investors）（電話：800-428-2244），以及投資者聯盟（Investors Alliance）（電話：866-627-9090），兩者均有提供費用低廉的公司資訊光碟。


    要自己選擇逆向投資股票，只需要一些簡單的規則就夠了。首先，採用大型的市場指數，例如標普500指數，這樣你就能從很多管道找到目前本'
