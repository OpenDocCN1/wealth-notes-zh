  md: '我知道這些可能是理性投資人中的異類，效率市場假說的篇幅還沒結束，我只會順便帶到一點第一部分介紹的市場心理面，否則無法理諭這樣的行為。


    # 效率市場假說的黑天鵝


    科學的歷史告訴我們，才智正常的人提出的假說通常問題不大，會出大紮漏都是假說背後用的假設前提。強大的統計方法，少了現實的假設，結果會一發不可收拾。我們知道劣幣驅逐良幣，財務學和經濟學的不良構造，經過這
    50 幾年的發展，讓好的科學沒有容身之處，苦勞雖多，功勞很少。


    老實說，效率市場連財務學界自己人都在攻計。愛德華·桑德斯（Edward Saunders, Jr.）用偉大的 20 世紀哲學家卡爾·波普（Karl Popper）的科學方法論來批評效率市場假說的方法。“波普有個著名類推，他說，要證明所有天鵝都是白色的研究者，就不該在白天鵝身上浪費功夫，而是要專心找黑天鵝，因為找到一隻黑天鵝就足以否認。”效率市場假說研究者沒聽進波普的話，效率市場假說的黑天鵝是層出不窮、理論說不清的重大市場異常；效率市場假說除了悶頭繼續找它的白天鵝，還傾力摸擬黑天鵝，好證明效率市場假說的清白。


    # 三級跳


    即使宣稱市場有效務的研究無可爭議，第 4 章仍指出它有個更嚴重的問題。科學發現還不足以得證研究者那種一言之蔽之的開創性結論。什麼研究證明市場立即正確無誤地反應新的資訊？沒有。只是把市場回應簡化的資訊，當作價格有而且是正確反應市場事件的確證。研究者從未試著去檢驗投資人理解更為複雜的金融與經濟數據的能力，像是本書提到的諸多資料。'
