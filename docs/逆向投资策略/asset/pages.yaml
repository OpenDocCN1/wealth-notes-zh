  md: '這種做法可免掉為海外券商付出的較高成本、保管費，以及換匯的價差。美國存託憑證（American Depository Receipts, ADR）代表在美國交易一定數量的外國股票，其中有不少是大型企業股票，例如荷蘭皇家殼牌（Royal
    Dutch/Shell）、Sony和荷蘭皇家飛利浦公司（Koninklijke Philips Electronics）已在紐約證券交易所掛牌上市，並且大多數都有提供詳盡的英文版財務資訊。


