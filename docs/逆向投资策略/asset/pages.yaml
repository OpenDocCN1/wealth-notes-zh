    這樣的判斷捷徑是從漫長的人類經驗中演化而來，如同情感的情緒決策，大多數的時候運作得很好，幫人們省下大量的時間。


    例如，想像在高速公路開車，你運用各種心理捷徑，邊開車邊注意車流量、路標、前方路況，還有鄰車的動靜，車上還開著音樂，你順利駕馭上千項令人分心的雜訊，而之所以能夠「幾乎不用想也做得到」，要歸功於心理捷思的效率。


    我們利用這些捷思來處理各種決定和判斷，過程中有點像在扮演一個「直覺統計學家」。例如，我們以為在時速55英里開車時，出車生還的機率高於時速90英里，但很少人真的去查真正的數字，以為業餘選手水準不夠，肯定比不上職業選手，或搭飛機一定比陸上運輸更快抵達目的。$^{\dagger}$


