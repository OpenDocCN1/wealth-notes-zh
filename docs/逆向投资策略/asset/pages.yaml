  md: '備受推崇的研究者巴爾·羅森堡（Barr Rosenberg）發展出一個眾所採用的多因子貝他，除波動性外，又納入不少其他資訊，據以衡量某個證券的風險，又稱為「神通貝他」，可惜沒有好下場，其他的貝他結局相同。個股和投資組合過去的波動性，都無法預測未來的貝他。


    這些證據多半被束之高閣，直到法瑪 1992 年的論文才又重見天日。法瑪和詹姆斯·馬克貝（James MacBeth）1973 年的論文指出，較高的貝他會得到較高的報酬，10
    為資本資產訂價模型打了一劑強心針，後來法瑪與芝加哥大學同事肯尼斯·弗倫奇（Kenneth French）合作，研究 1963 至 1990 年期間的 9,500
    支股票，11 結果是看貝他的話，股票的風險不是績效的可靠預測因子。


    法瑪和弗倫奇發現貝他低的股票，與貝他高的股票績效差不多。法瑪說：「拿貝他當作是解釋股票報酬的唯一變數是行不通的。」12「我們的意思是說，過去 50 年來，知道一檔股票的波動性，對於洞悉那檔股票的報酬沒什麼幫助。」13
    最好造一座大陵墓來刻上這段墓誌銘。


    1992 年 6 月 1 日《財星》有篇文章說：「芝加哥大學那批人說貝他是假的。」14《芝加哥論壇報》（Chicago Tribune）說得好：「有些名氣響噹噹的追隨者如今嫌得最兇。」15


    不是貝他，然後呢？若不是量波動性，那怎麼測定風險。弗倫奇教授的說法是：「抱落水狗讓投資人如願以償。」16 他倆的研究指出，股價淨值比和本益比最低的股票，後來報酬最高，較小型的股票也是如此。股票報酬與這些測量指標的正相關程度，高於貝他之類的風險指標。17


    法瑪補充說：「一個風險因子成不了事。」投資人必須從多因子的角度衡量風險，將價值面和其他風險基納進進來。18


    法瑪和弗倫奇在 1996 年一篇論文中，駁斥另一篇企圖捍衛貝他的學術論文，說：「它〔貝他〕救不了資本資產訂價模型，證據是光貝他不足以解釋預期報酬。」19


    一起陪葬的還有現代投資組合理論跟效率市場假說的一大塊陣地。連同'
