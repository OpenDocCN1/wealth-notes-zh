  md: '# 第7章


    # 投資圈預測成癮


    如果你本就喜歡，或者偶然聽到因此愛上民謠這種音樂，很可能知道做出〈這是你的土地〉（This Land Is Your Land）這首歌的民謠歌手伍迪·蓋瑟瑞（Woody
    Guthrie）。蓋瑟瑞出身於大蕭條時代的奧克拉荷馬州，歌曲標誌當時舉國上下的窮困潦倒，他在1939年的〈漂亮的男孩佛洛德的民謠〉（The Ballad of
    Prettly Boy Floyd）有句歌詞：「有人拿左輪手槍搶你，有人拿鋼筆。」是當時眾多田地住宅遭銀行查封的人民的寫照，時至今日，只需把鋼筆換成電腦試算表，多交代一兩句時代背景，像是抵押債務債券（collateralized
    debt obligation, CDO）、信用違約交換（credit default swap, CDS）、有毒資產、新奇選擇權，同樣能唱出這時代的寫照。


    國人爭論著應該削減或收緊管制，或者是否要增加政府支出，意見莫衷一是，其實這也是經濟學家們這些年的寫照（見第6章第143頁）。大家都想問：這些專家怎麼把事情弄得那麼複雜？


    目前我們已探討了重要的投資心理還有效率市場的矛盾，你可能覺得像剛完成新兵訓練，或跑完馬拉松，完成若干上市場打勝仗的準備工作。


    我們講述種種觀念上的障礙，但你無疑有辦法成功克服：憑著投資心理學，你知道怎麼保住積蓄，也知道效率市場理論失靈的假設，恐會招致反噬的後果。希望前二個部分最起碼讓你了解接下來要介紹的投資心理面的重要性。'
