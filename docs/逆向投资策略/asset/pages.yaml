  md: 'Destiny I fund）近20 年。


    我手上超過40億美元的反向型基金，在股東轉投資當紅網路類股以及急速成長的網路公司基金之際，資產下跌了近50%。我從未見過反向型股票表現得這麼差。我想知道要追趕上飛速發展的那斯達克市場要花多少年，因為大多數熱門股都在那上市。


    結果，這種慘況維持了幾個月，不是幾年。到3月中旬，網路泡沫開始瓦解，網路和高科技股大暴跌。同時，卓曼價值管理公司（Dreman Value Management）的反向型投資組合和共同基金一飛沖天。我們的投資組合到2000年底成長了40%，而標普500指數則下降9%。我們不僅在不到10個月就彌補了我們在1997至2000年之間內損失的績效，而且還創造更多回報。至於範德海頓，《華爾街日報》幾年後發表文章算出，如果他過去成功管理的基金原始投資保持原樣，績效會比後來的管理團隊要高出40%。


    同樣地，這也只是機率法則。反向型股票過去在熊市裡表現得更出色，但這並不代表時時都能表現得嚇嚇叫（就算要達到圖10-5a在熊市中跑贏大盤，也不須如此）。即便如此，當它們的表現沒有盡如人意時，顧問、專業人士以及散戶就覺得這些策略已經失勢，不再管用了。當時，大型機構以至散戶有大批投資人都拋棄了這些策略，而那時也正好是他們績效週期觸底的時候。自此之後，這些策略多年來就一直跑贏市場。


    # 經驗是良師


    我的個人經驗和許多反向型基金經理人沒有多大不同。在過去的35年裡，每當反向型股票跑輸大盤時，不論時間長短，我都看到同樣的後遺症。如果能撐過幾次壞時期以及謊謊騙人的時期，必有後福。但是，知易行難。最後是極為重要的投資心法：'
