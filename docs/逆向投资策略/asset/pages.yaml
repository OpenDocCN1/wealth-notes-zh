  md: '正面意外加持的冷門股的話，長期下來可以獲得的報酬，幾乎是市場的2倍。我們稍後將會探討冷門股何以會有如此驚人的報酬。


    至於正面意外對於中本益比組（本益比居中的那60%）的影響，看得出來要溫和許多。中段組在意外季度的報酬高出市場1.4%，但之後的9個月裡，兩者間的差距並沒有太大的變化。這些股票並未持續增值，可見正面意外事件對價格的影響尚屬溫和，其原因可能是它們很少被低估或高估。


    最後，正面意外對於熱門股的影響則要小得多了。歷經正面意外的股票在意外季度中的表現比市場高出1.1%。但是這些「最佳股」並未如低本益比組那樣持續成長，其與市場績效的微幅差距，反而在接下來的9個月中又縮小了幾乎一半。


    儘管圖中未予顯示，但以股價現金流量比或股價淨值比評估之冷門股（比率最低的那20%）也有極為類似的情況。這兩者在意外季度和全年的表現都大勝市場，並且把熱門股打得落花流水。而中間60%的股票在這兩個時期的表現，相當接近前面幾張圖中的中段組。


    為什麼正面意外在意外季度只能溫和助長「最佳股」？由於分析師和投資人都認為，他們可以精準判斷未來幾年內哪些股票將會勝出，因此正面意外只不過是實現他們的期望，不會帶來多大的衝擊，這些勝利組的營收、市占率和收益本來就被預期會飛速成長，因此到了年底，意外事件影響有限。我們待會就會看到，近來一些神經經濟學研究成果，似乎已解釋了熱門股、冷門股和不冷不熱股這三類股票何以會有不同的反應。


    不管我們採用哪種價值指標來衡量，投資人對於冷門股的正面意外，有截然不同的反應。這些股票之所以被放進低段班，正因為人們預計它們是扶不起的阿斗。他們是投資人眼中的遜咖，看似沒什麼價值可言。所以，一旦這支股票有了正面盈餘意外，就會引起軒然大波，讓投資人正襟危坐、刮目相看。他們認為，這些公司也許沒有像分析師和投資人說的那麼糟。因此，這些冷門股的價格不會像熱門股一樣只在意外季度竄升，接著修正下跌。反而'
