  md: '# 第 15 章


    # 他們用你的錢在賭


    歡迎來到享譽國際的金融巨擎高盛大廈。我們很榮幸能在这座城市中最壯觀的賭場接待你。我們有衣冠楚楚、謙恭有禮的員工，他們可是當今商界裡最有才華又頂尖聰明的佼佼者，幾乎每一位都具備高學歷以至博士學位。他們訓練有素，可以在投資這場賭局裡，從各方面協助你。這座精緻投資賭場還有數以百計的傲人遊戲、專業服務任君差遣。從令人血脈賁張的「合成式」（
    synthetics）到全新的「異型」（exotics）投資組合等極為特殊的玩家機會，只有我們獨家提供。這些優秀的人才已準備就緒，迫不及待要讓你知道，你所選的遊戲勝率有多高，已是勝券在握。


    我看到你走進這座華麗的賭場，一到大廳，眼前是琳瑯滿目的誘人遊戲，有些甚至是你從未見過的。玩家們興奮不已，桌上堆滿籌碼。你明智地選了一個你知道的遊戲，接著走向一張漂亮的紅木輪盤桌，下了一些籌碼，一身帥氣華麗的荷官拋下小銀球，接著轉動了輪盤，最後滾球落定綠槽裡。你知道綠色通常代表
    37 分之一的機會，因此你選了紅色，應該能有一半的機會把錢翻倍。荷官又拋了一下球、轉動輪盤，球再次落入綠槽。你知道落在這區的機率相當小，所以還是選了紅色。然而，大出意料的是，這顆球前
    10 次竟然有 8 次都落在綠槽。


    你簡直不敢相信眼前的一切，決定賭上所有運氣，把籌碼全押在綠色。荷官推開你的籌碼，重新切到你面前。你抬頭問為什麼這樣做，他客气地'
