- pgno: 153
  md: '本章要說明當代投資學理論為何讓人不敢恭維，問題是我們不是效率市場假說理論假定的理性機器，我們是活生生、等著犯錯的人，而正統投資理論並未對此有所著墨。


    # 心理學與投資大忌


    這 50 年間，認知心理學走上了與經濟學理論化背道而馳的道路。經濟學家醉心於理性人的概念化約，心理學家則試圖為人類處理資訊建立漸趨複雜的心理圖像。1980
    年代以來，得益於認知心理學、社會學與相關領域的進展，心理學家越來越明瞭何以人類心智有別於機械式的電腦邏輯。


    即使電腦似乎漸漸有能力片面模仿人類認知，但整體來看，電腦無疑遠遠比不上人類的心智。雖說如此，我們的心智歷程並不像電腦邏輯那樣不會出錯，所以心理學家研究專家知識和資訊處理的侷限，結果發現專家犯錯的下意識原因，而且這些原因多數人也難以倖免。


    許多研究釐清了不只做投資的專家會失手，而是人的處理資訊能力本來就有問題。目前的研究指出，人的大腦是序列處理數據，只有線性模式下，處理資訊才會可靠；我們沿著邏輯序列，從一點前往下一點，就像我們做船或太空梭的模型時，會照著組合順序來完成模型。


    不過，令專家也感到棘手的是組態（或交互）推理，而非線性推理。碰到組態推理的問題，決策者如何詮釋資訊的變化，取決於本人如何評估其他訊息輸入。拿證券分析來說，即使二家公司擁有同樣的盈餘趨勢，但對成長率的重視程度，會因為雙方對於產業、營收成長、毛利率、資本報酬率的看法，還有原先用什麼分析指標有所差異。分析師也會視經濟狀況、利率水準、公司競爭環境變化拿捏評估。因此，成功的分析師一定是適應了組態處理，整合並掌握各項因素的輕重，若某項因素改變，勢必要重新通盤拿捏評估。'
  merge: -1
  img_proc: true
- pgno: 154
  md: '跟丟球的雜技一樣，每個因素就像多擲一顆球，增加經手處理的難度。無論是不是做投資的專業人士，有能力把本職的分析做好嗎？我們知道這比看起來困難很多，很多人不知不覺就會用上經驗推理，將理性分析撇在腦後。


    有人用變異數分析（analysis of variance, ANOVA）這個統計方法來評估專家的組態能力。一項研究找來 9 個放射師，讓他們做高難度的組態問題：判定惡性胃潰瘍。$^2$放射師必須用到
    7 個 X 光片不見得照得出來的線索，才有辦法正確診斷，並得到 57 種可能的結果組合。有經驗的胃腸科醫師指出，正確無誤的診斷只能從檢查這 7 個原始線索的組合看出來。$^3$


    雖說診斷需要高明的組態處理，研究人員卻發現，實務上，這方面只占所有決定的一小部分，也就是 3% 左右，90% 以上的決定屬於個別症狀序列相加。


    類似的問題還有是否要讓精神科住院病患短期出院。院方得考量 6 個不見得看得出來的重要線索（如病患是否酗酒？），以及 64 個可能的交互影響。另一項研究中，雖然對處置能力很重要，卻看不出護理師、社工、心理醫師有什麼組態思考。$^4$第三項研究中，13
    名臨床心理師和 16 名高年級研究生，嘗試高難度的組態處理，判斷 861 名患者的症狀是否為神經官能症或精神疾病，結果與前二項研究一致。$^5$


    換到股票市場，史洛維奇教授測試了組態推理對市場專業人士的重要性，在一項研究中，他給 13 名股票經紀人和 5 個財務學研究生 8 項研究公司股票的重要金融資訊：每股盈餘趨勢、毛利率、近期獲利展望等，發現平均而言，組態推理只占全部決定的
    4%，結果跟放射師和心理師差不多。


    另外在如何分析資訊上，經紀人說的跟做的差很多。$^6$例如，有個說最重要的資訊是每股盈餘趨勢的經紀人，其實可能更看重近期展望。最後，越有經驗的經紀人，對自己如何拿捏權重的評估越不準。總之，證據指出不管在投資圈內圈外，多數的人在做組態處理方面都不行，顯示人類心智就是一板一眼的電腦不一樣，雖然我覺得大家對這件事早就有個底了。'
