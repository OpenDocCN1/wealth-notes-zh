  md: '假說，我尊重眾多研究者在這領域所做的努力，最終為投資圈注入遲來的**新氣象**，對市場運作感興趣的投資人，一定得向這些大學研究者致敬，多數研究必然枯燥、單調、曠日經年，但要建立新的投資架構基礎，這些功夫勢不能免。


    如果無法精密量測技術和基本方法的續效，投資界會繼續沿用導致慘痛教訓的無效舊方法，沒有改變的動力。我固然相信效率市場假說只是過渡之計，但它確實開啟了改變的趨向。


    掌握左右投資決策的強大心理學知識，並體悟到普及的現代投資理論幫不了我們，反而可能有害後，我們現在能開始好好看看過去的市場困境中有用，在目前的市場難關中也會繼續管用的策略。'
