  md: '的劣質資產，其複製規模是劣質組合的數倍，不是 1 倍而已。複製方法很簡單，因為無規則可循，其所需要的只是財務細節、房貸投資組合的組成，及其每月的報酬。這些人為了做空有毒垃圾資產而疊起來的籌碼，不下於我們之前虛構的賭場。更驚人的是，他們這場豪賭，動輒數十億美元，不是一般賭場玩家口袋裡的幾千美元。


    根據參眾議院的金融海嘯調查委員會所揭露之調查結果和電子郵件，參加這場豪賭的人為數不少，而高盛是超級大玩家。高盛對於市場上最劣質次貸或次優級房貸，研究十分透徹。他們在價格看跌時賣空給客戶或其他買家，從中大撈一筆，同時為了撐大獲利空間，不僅找出最差的垃圾房貸承保機構（這可是有一大把），而且還撈出了最劣質的次貸商品。


    高盛分析師為了達到這個目的，細查了每個不良承作機構的高評等房貸產品。總體而言，他們詳實的研究涵蓋數千種不同系列的產品，舉例來說，每個不良承作機構的房貸產品中最差的忍者系列、利率較高的負擔提房貸，或其他較差的選擇權等。他們先不管這些商品的評等有多高，只想找到有高違約可能性的商品。高盛這套高度複雜且耗資數百萬美元的研究團隊，還大量使用別種工具。所有這些都為了套住老客戶或任何高頻簽下衍生性金融商品的潛在受害者。不只是高盛，上面提到的許多銀行都在玩相同的遊戲，但高盛無疑是玩得最凶的。


    其中最大的贏家是美國國際集團。高盛和一個銀行聯盟買入信用違約交換產品，實際上這導致他們賣空了大部分 AAA 評級的劣質次貸產品，而苦主就是美國國際集團。這個保險業巨人損失慘重，以致瀕臨破產。時任紐約聯邦準備銀行（New
