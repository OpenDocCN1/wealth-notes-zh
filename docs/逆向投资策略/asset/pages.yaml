  md: '的理論主體。


    孔恩說：「典範取得自己的地位，因為它們在解決某些實踐團體共同認為嚴峻的問題上，比競爭陣營更為成功。」$^{65}$效率市場假說正是早期提出了一套價格隨機波動，以及技術分析派為何無法持續贏過市場的解釋。


    孔恩也提到：「事實或理論的新意，並非常態科學的重點，常態科學功成行滿之日，意謂找不到新鮮事。」$^{66}$典範為大眾廣泛接受時，本身的工具和方法會在問題的解法中落地生根。貝他與現代投資組合理論便是擴大效率市場典範公認的方法。


    常態科學的目標不是質疑當道的典範，而是解釋透過自己所見的世界。抵觸典範基本宗旨的異常現象，構成了棘手的挑戰，典範必須能夠解釋異常，否則最後就會被能夠做到的後進者取代。


    所以科學家捍衛所奉的典範乃人之常情；他們寧可相信天鵝都是白的，也不去找黑天鵝，若發現了黑天鵝（對效率市場假說來說就是市場異常），科學家會嘗試代入符合理論的解釋。典範的轉移是一段針鋒相對、勞心焦思的艱困時期。*


    追隨者是擁戴舊典範的既得利益者，一身的知識、經驗與報償，都與舊典範休戚與共，若身處的典範遭拒絕，往往等同於信奉的宗教遭抵制。孔恩寫道，許多舊日的科學家死都不會放棄當前的典範，別人只好看情況接受一部分，試著綜合新舊兩者，通常要花上一代，新的典範才會徹底被接受。薩繆森曾說：「科學進展是行經一座又一座墓地。」


    這裡有個效率市場假說仍不乏眾多追隨者的關鍵，孔恩也提到一個重點：無論批評炮火多猛烈，科學家絕不會放棄一個典範，除非有一個更為人所採信，而且解決得了老問題的典範可供取代。可想而知，即使效率市場假


    * 典範轉移侵害他們的基本方法。效率市場假說之類的經濟學說讓他們大展身手，畢竟比起行為財務學，他們更拿手統計方法。'
