  md: '# 第14章：邁向更好的風險理論


    +   1. Frank H. Knight, *Risk, Uncertainty, and Profit*, Hart, Schaffner, and
    Marx Prize Essays, No. 31 (Boston and New York: Houghton Mifflin, 1921)：


    不確定性必須從某種意義上與眾所周知的風險概念區隔開來。在日常談話和經濟討論中隨口提到的「風險」一詞，實際上涵蓋了兩件事，至少在功能上，它們與經濟組織的現象所涉及之因果關係全然不同……關鍵事實是，「風險」在某些情況下是易受評估指標影響的量，而在某些時候則顯然不具備此特徵；而且該現象影響所及的關鍵差異，取決於這兩種情況中哪一種確實存在並且正在運作……我們口中可測的不確定性或「風險」一詞，看來與不可測的不確定性相差甚遠，以致它實際上根本就不是不確定性。我們……應該據此將「不確定性」一詞侷限在非量化的情況之下。


