  md: '產生系統性、大幅度的扭曲，以致最精明的投資人，都會犯下離譜的失誤。而且，團體壓力會鞏固這類認知偏誤，⁵專家和同儕團體會強化人懷有的誤解，加劇不得不追隨的壓力。


    研究也指出，即使一個人接獲這類偏誤的告誡，似乎也無法做出因應調整，因此要花非常大的心力才能避開陷阱，熟悉各種捷思是第一步，當掌握捷思的性質，就能為擬定規則來輔助決策，防範鑄成大錯，或許還能得到好處，當然，說比做容易，知不知道都一樣。


    # 危險的易得性


    首先來看易得性捷思。特沃斯基與康納曼指出，這種心理捷思會造成「憑著心中容易浮現的例子或發生的情況來評估類別的頻率或事件的機率」，⁶這解釋為何我們以為鯊魚攻擊致死事件，比被天上掉落的飛機零件砸死常見。


    因為心智通常浮現最常發生的事件，我們憑易得性捷思獲得的解答，大多數時候會是正確的，但偶爾會錯得很離譜。我們以為某件事比較有可能，是因為心裡對具有特殊意義的事件有所期盼，也就是說，它深深影響了我們的想法，而且又發生不久，⁷這牽涉到兩種心理謬誤：突顯性，以及新近效應。突顯性會不知不覺讓人不成比例地偏離真實頻率想到「好」或「不好」的事件，⁸例如在野外，國家公園裡棕熊傷害遊客的機率是百萬分之一或二，致死的機率更低，在岸邊被鯊魚攻擊傷亡的泳客占罹患泳客的百分比更低，但因為攻擊場面詭目驚心，讓人誤以為發生頻率較真實數字高，記憶誤導我們快速想起恐怖的畫面。


