  md: '這種關於風險的假說起初看起來就不合乎現實，時間一久，問題自然會越滾越大。這再次說明，現代風險理論從源頭就駁人質疑。


    然而，正如先前討論的，當沒人可以證明波動性是最佳風險評估指標時，它的提倡者不是放棄這個概念，而是改變波動性的算法，以期重新在風險和利益之間找到相關性。他們不斷提出新的風險模型，但如我們所見，它們無一是可靠的，而這套科學方法最後還是有問題。同時，它留給當今投資界最明顯的問題是：大多數投資人所依賴的風險分析是似是而非的。


    # 推倒史達林的雕像


    大多數人還記得 1989 年蘇聯解體後數十個約瑟夫·史達林（Joseph Stalin）雕像在東歐各地被推倒的情景。體型小一點的雕像被工人用鎖鏈拉倒，大的則是用拖拉機或其他重型建築機具撞倒。俄羅斯前途未卜，但也沒有回頭路可退。就像共產主義垮台一樣，我們必須要問：如果波動性被推翻，誰將取而代之？本章要旨便在於，提出適用於各種不同情況的風險指標。


    讓我們從舊式風險典範忽略的一些關鍵要素開始談起，逐一了解其長達數百年（甚至更久）以來所造成的損害。更重要的是，我們將了解到，對投資人和經濟而言，有許多損害是躲得住的。


    是的，除了貝他係數還有別條路可走，而我們也開始整理出一些更加適用於今日投資人的投資守則。首先來看看風險因素，正如我們所見，它在最近十年對投資組合策略造成重大損害，但整體看來投資人到目前為止仍未正視。'
