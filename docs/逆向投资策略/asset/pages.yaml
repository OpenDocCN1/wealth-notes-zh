  md: '# 資本資產訂價模型與波動性理論速敗


    波動性理論雖然一直有問題，40 幾年來也讓許多誤上賊船的人付出巨大代價，雖說如此，研究者反而讋出問題更大，我看了膽驚心顫的風險（波動性）假說，以我之見是一律敬謝不敏，接下來會跟你解釋為什麼。


    前面提到了，法瑪教授在內的眾多人士都已放棄資本資產訂價模型，即波動性理論的濫觴，表示它不靈光，倒是夏普等諾貝爾獎得主對此仍有意見。“如同採用望遠鏡所得到的大量新天體觀測，摧毀了托勒密的學說，同理，更有力的統計新知接踵來到，揭穿當代波動性學說不管用，同樣對資本資產訂價模型和效率市場假說形成莫大威脅。


    # 效率市場假說——資本資產訂價模型波動性假設的問題


    效率市場假說陣營不是不知道己方理論所面臨的危機。投資人若全然理性，那麼報酬和風險之間必有系統相關性，否則效率市場假說恐怕要步上恐龍的後塵。若有的投資人承擔一樣或較低的波動性，報酬卻比其他承擔相同或較高風險的人更高，表示投資人並非全然理性，這對效率市場假說和資本資產訂價模型猶如芒刺在背。


    放棄資本資產訂價模型的法瑪替效率市場辯護時，在 1992 年論文中用了三因子模型，其他人順勢便提出了四、五因子等風險模型，指證歷歷說風險報酬之間仍存有相關性。


    不過，構想這些新模型出了一些嚴重的紕漏。這些模型都是要取代資本資產訂價模型，但它們都是基於同一套思路，也就是要顯示較高的波動性會帶來較高的報酬，較低的波動性則伴隨較低的報酬，而資本資產訂價模型做不到的事，難道這些換湯不換藥的新模型就能？資本資產訂價模型雖因不靈驗遭到棄置，但它的核心教條，也就是風險報酬兩者直接相關，卻被保留在'
