  md: '上，它們一年比一年更強大了。


    這裡有個好消息，這波探索潮帶來了更多證據顯示，確實有逆向投資法可以保持一貫的高勝率。我稍後會解釋到，這些方法還可以在熊市中介全你的資本。這聽起來有點像魚與熊掌可以兼得，但是我們有充分的理由能說明，為什麼這些策略對於有紀律的投資人來說始終是有效的。（這就是為什麼我在書中放進操作心理導航特別提醒你注意，這些指導原則全是以投資人心理弱點為出發點。）


    # 最後的一擊


    正如我們所見，除了低本益比之外，還有許多逆向策略效果也不錯。低股價現金流量比和低股價淨值比皆是助你跑贏大盤的利器。我近來的一些研究說明，買進高股利利率的股票，也能達到優於市場的績效，就像買進任何產業裡的本益比最低股（產業投資策略）一樣。能跑贏大盤並不容易。按照我們之前提到先鋒集團的柏格的說法，只有大約10%的基金經理人，能在10年期的投資上做到這點。或許有人會在此嗆問：「是的，你可以說，低本益比股票的報酬率數字從1930年代一路漂亮到1990年，但是畢竟事過境遷，逝者已矣。逆向投資策略在近年來表現如何？」


    答案是，「相當棒」。在下一章「投資策略」部分中會說明得更詳細。我們研究的所有五種逆向操作策略在1970至2010年間均跑贏市場，而這期間還經歷了兩次史上最大的市場重挫（如果排除1929至1932年經濟大蕭條的話）。


    圖10-3說明了逆向價值投資策略截至2010年12月31日共41年裡的表现。該研究評估Compustat資料庫收錄的1,500家公司，使用了四種單獨價值評估指標：低本益比、低股價淨值比、低股價現金流量比，以及高殖利率。所有股票根據這四種指標均分五組，研究期間每年計算一次結果。圖表'
