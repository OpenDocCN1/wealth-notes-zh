  md: '市場假說的研究，而這群人現在正想方設法，想找到一個真正管用的風險報酬公式，雖然這可能需要規模大上許多的挖礦工程才辦得到。另一個他們愛用的招式是批評方法有瑕疵，檢查你的符號有沒寫錯，效率市場假說倒是很少在這方面被苛求。


    黑天鵝還是趕不走怎麼辦？它們現身的理由，從效率市場假說自己的風險理論有問題、投資人過度反應的證據廣為流傳，到泡沫與崩盤期間錯價嚴重，不一而足。但效率市場假說陣營立即想把二個相異且對立的異常打發掉：投資人過度反應和投資人反應不足，妙想天開地說，因為雙方都顯著，剛好互相抵消。\*這是哪門子科學，研究者說不清兩個獨立異常現象，就說既然結果相反，不然就一筆勾銷好了，乾脆說$1+1=0$。


    這是不信的人必須跨過的門檻。我們有的人不曉得被為難多少次了。早在1977年我就投過低本益比策略績效較好的論文，結果石沉大海，編輯顯然認為這是篇異端邪說，過了15年或更久以後，有幾個效率市場假說的泰斗也做出很類似的結果，這才浮上檯面，功勞當然記在那些一開始也愛理不理的大宗師頭上。更糟的是，這類學術期刊其實是效率市場假說研究主力的後花園。要在這些重要期刊發表文章，作者必須是圈子裡的人，或至少做了合理的妥協。期刊無疑有能耐護多數學者的生涯更上一層樓，或中途夭折。


    回想波普說的，一隻黑天鵝便足以葬送一個理論，偏偏效率市場假說這個池塘周圍，有太多以徹效尤的動作，讓這理論不致變成瀕危物種。


    這是效率市場假說的黑暗面，但真要說的話，其實任何地位穩固的知識體系遭受不明威脅，都會招致差不多的不滿與敵意，不過至少就我所知，還沒有哪個不聽話的人被處以火刑。


    如果我看起來對效率市場假說不太客氣，那是因為我無法接受它說理的方式，還有它的核心觀念對市場，進而對大眾造成的傷害。儘管不相信這個


    法瑪1998年所做的回顧，見第130頁。'
