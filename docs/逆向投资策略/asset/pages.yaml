  md: '價應該與那時視為「理性」的價位有關，$^{52}$他根據後來發放的股利來看股價是否合理，研究涵蓋 1871 至 1979 年。


    席勒建立的理性指數呈現平滑、穩定的軌跡，反觀實際的市場指數則長時間偏離此水準，波動性相當大。席勒的結論是：「過去一個世紀的股價波動性看來太高……歸因於未來真實股利的資訊。」$^{53}$簡言之，市場長期未準確反應資訊，而且漲跌失據。


    # 效率市場假說理論的黑洞


    記得我們說過，效率市場假說追隨者認為，明智的投資人會讓價格落在理所當然的水準，可惜實情並非如此，這意味著這個假說最重要的公理保不住了。


    效率市場追隨者沒有驗證的一個關鍵問題是，專業投資人是怎麼讓價格與價值相符，他們是用什麼方法？這問題在效率市場假說陣營到底有沒有解釋過，還是它只是一個理論上少不了的假設，本身仍妾身未明，也許原因出在，學界不太懂明智投资人所用的工具和模型。第
    2 章重點介紹了若干基本分析方法，包括幾個股票評價技巧和比率，只要照本宣科，不至於會買到大幅高估的股票。


    但如果真的買到泡沫股或其他超漲太多的股票，畢竟這是很常遇到的情況，形同將多年的經驗和訓練，以及工作上的基本功拋在腦後，這種行徑不會被視為合乎理性，而且本不該發生。不過，在泡沫或飆漲時期，同樣常發生這種情況，在恐慌時跟著拋售跳樓的優質股也是。


    重點是，這些錯是出自效率市場假說聲稱讓市場有效率，的專業學識俱佳的投資人之手。這些人沒讓價格落到對的行情，市場怎麼保持效率？答案顯然是，市場效率沒保障，這是泡沫頻頻發生，價格一時高不可攀隨後又萬劫不復的真正原因。'
