  md: '說：「對不起，先生，我們的輪盤賭限線（譯注：此處是賭場用語，直譯則為綠色是禁止與賭場對賭的顏色。）」


    一位老前輩站在你身後旁觀這一切，說道：「孩子，這真是該死的輪盤。賭場為了改造它可花了好幾年。」他還說，要有多厲害的金融工程師才能做到今天這樣。最初每回拋球只有幾次會落進綠槽，但在鬼才工程師的努力之下，球落入綠槽的次數不斷增加。現在，每拋10次有8次會落在綠槽，這正中賭場的下懷。


    「因為你只有35分之一的機率會贏，賭場很賺，而且他們還有其他搖錢樹。如果你沿著賭城大道走，會發現摩根士丹利、瑞士信貸（Credit Suisse）、花旗集團和其他十幾家場子也不賴。雷曼兄弟和貝爾斯登都曾風光過，只可惜他們垮了。」


    他這麼說完後，你心有定見走為上策，但仍想知道賭場優勢從何而來。在拉斯維加斯，這種賭場不到一個小時就會被迫停業。在舊西部（Old West），賭場老闆硬是要出老千的話會被絞死，但在華爾街卻佳評如潮。不僅如此，你還投訴無門，因為心知肚明監管機構和這些賭場是同一掛的。


    這個故事當然是純屬虛構。我們都知道投資銀行和銀行旗下沒有賭場，至少不是直接經營賭場。故事裡的細節也非真實。所以再往下讀，如有雷同的話，純屬巧合。


