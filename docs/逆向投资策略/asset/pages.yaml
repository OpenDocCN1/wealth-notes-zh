- pgno: 334
  md: '# 第 14 章


    # 邁向更好的風險理論


    風險既可以是狐媚，也可以化作野蠻之神，召喚我們進場去賭博，為我們的冒險拼搏帶來驚人的回報。我們在贏錢的時候，往往不會就此離場，反倒會繼續奮戰，結果總是把贏的全輸了回去，以至輸得更多。


    歷史上不乏偉大的將軍，他們屢屢能險中求勝、立下戰功：想想拿破崙（Napoleon）、羅伯特·李（Robert E. Lee）和艾爾溫·隆美爾（Erwin Rommel）等將領。但若集軍隊力量、戰士意志以及一國之工業硬體實力孤注一擲的話，這算盤似乎打得不精，光是一次戰敗，其後座力之大也可能成為致命的一擊。我們把場景拉回民間，財經媒體會採訪那些在3個月、1年甚至3年裡都表現續優的基金經理人、分析師和投資經理人。他們的一字一句無論何其荒謬，都會被捧成新的投資福音，直到機率的規律出現，打敗他們為止，一如雜耍表演中，長長的鉤子從黑幕伸了出來，將他們拉下舞台。當觀眾們叫好連連之際，投資新星們隨即以短期投機成效取而代之之躍上了舞台，而這場換湯不換藥的抗風險大秀仍繼續上演。


    我們大多數人對於風險多少有些矛盾，愛看屈居下風者在我們的加油打氣下反敗為勝、一舉扳倒奪冠熱門，假使我們喜愛或押注的隊伍正好是反轉局勢的英雄，奪勝之後的慷慨激昂更不在話下。但若是在市場上就另當別論了。我們想站在可能會贏的這邊，越有把握的越好，而唯一的目標就是要贏。然而，今日問題真正棘手的地方在於，局勢詭譎，勝率難辨。'
