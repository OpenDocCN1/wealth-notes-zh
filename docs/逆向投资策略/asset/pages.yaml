  md: '# 推薦序


    # 為什麼您的投資策略常常不靈光？


    安納金／《散戶的50道難題》、《高手的養成》系列暢銷書作者


    20年前我曾選修台大財務金融研究所「投資管理」課程，當時研讀了大量有關投資組合管理以及選股技巧的經典論文，有關「逆向投資策略」（contrarian strategy）在1960至1990年代之間已有大量的實證研究探討，也有不少學者因此獲得諾貝爾經濟學獎殊榮。儘管在不同市場週期之下，「逆向投資策略」與「動能投資策略」（momentum
    strategy）互有領先，然而就長期而言，「逆向投資策略」勝過「動能投資策略」受到較多學術界的實證研究支持。


    我好奇的是，為何當今台灣市場上支持「逆向投資策略」的聲量較小，而「動能投資策略」（後來被較多人稱為「順勢交易策略」）聲量較大呢？我在此書當中找到了一些答案，「逆向投資策略」並非一般人直覺認為「跌深買進，漲多賣出」這麼簡單，而是有其選股邏輯以及既定標準的，此書提供了五種被實證為績效卓著的逆向投資相關策略，作者論述的邏輯清晰、數據佐證完整，讓此書相當具有說服力。


    執行「逆向投資策略」需要相對透明的財報以及公開數據資料相輔助，因此，在成熟的市場（例如美國股市）效果更佳；若是財報相對不透明的新興市場（例如中國A股）則有待商確；至於台灣，隨著近幾年有越來越多的系統業者以及資訊平台建置了相當完整、即時的上市櫃公司資料庫系統，'
  merge: -1
  img_proc: true
- pgno: 9
  md: '使得一般民眾也能夠輕鬆取得所需資料進行選股分析，這使得「逆向投資策略」的方法在台股的實用性將大為提高。


    至於究竟該採取「逆向投資策略」還是「動能投資策略」呢？其實除了市場週期位置的差異之外，我認為更重要的是必須適合自己的投資哲學和信念，因為不會有任何一套策略適合於所有人。金融市場夠大，永遠容得下各種投資者，每個人都能夠透過一定的紀律和原則來獲取利潤，因此，沒有最好，只有適不適合罷了。


    每一位投資人都應該先深切了解自己的風險偏好，尋求能完全認同的投資哲學和交易邏輯、交易頻率、交易工具，鑿劃出整套相輔相成的投資交易系統，這就是我常引述的武學三境界「見自己、見天地、見眾生」當中的「見自己」，也是一切投資入門的基礎。市場永遠會以不同的走勢，來考驗你是哪一種投資者？有沒有屬於自己的完整系統？還是人云亦云、隨波逐流？


    此書不僅提供了五種具實證支持的逆向投資策略，更將相關的心理學以及行為財務學立論基礎有相當完整的論述。倘若您過去在股市殺進殺出並沒有獲得滿意的績效，或許該是好好研究「逆向投資策略」的時候了！祝福您透過此書，開啟投資領域的新篇章，同時提升績效。


    願善良、紀律、智慧與你我同在！'
