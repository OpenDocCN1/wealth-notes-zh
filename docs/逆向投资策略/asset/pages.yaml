  md: '的正面與負面標籤」。⁹


    大家對於自己動不動就會因強烈好惡而擾亂判斷一事心知肚明。我敢說你也知道，想要改變某個人懷堅定政治或宗教觀點的人的心意很難，即使你說詞中的論點再怎麼有力，都沒什麼機會；其實，有證據顯示，你的這番論點反而鞏固了對話對象的已見，例如，對方可能把你的論點看作某一類陳腔濫調。同理，你越中意一個投資決定，你對它會懷有越強的正面情感；反之，你越是不中意一檔股票或某個產業，會對它產生越強的負面情感，如同在政治觀點的情況，獲悉正面消息會加強對中意者的正面情感，反之，負面消息會強化對不中意者的負面情感。


    人們處理資訊的心理歷程，有個雙重歷程模式，情感在其中發揮核心作用。³心理學家西摩·艾波斯坦（Seymour Epstein）說，人透過二個交互作用的平行歷程系統來理解現實：審慎分析的理性分析系統，按確立的規則與證據運作（如數學和工程）；另一個心理學家所謂的經驗系統，則屬直覺且非語言性的。經驗系統從經驗和情緒回溯汲取資訊，將現實編排成夾帶情感的意象、隱喻和故事。⁴


    非認知式而屬情緒性的經驗系統，運作速度比理性分析系統快，後者可能費時數日或數週的時間來拼湊全貌。想想，把念頭轉向賺大錢的投資點子（正面情感），或慘賠的中意股票（負面情感）時，或僅僅是聽到「綁票案」或「飛車槍擊掃射」這些字眼，心中多麼快就有所反應。情感可能排山倒海湧現，令我們在市場上經歷的訓練和經驗毫無用武之地，後面很快會提到，情感可以很成功地解釋極端的股價錯估。


    出於過去、當前和希望如此經驗中的意象和聯想，在人們清醒的腦袋中登堂入室，當正面或負面的感覺越強烈，不管是針對概念或人群、股票、產業或市場，相關決定受到情感左右的力量越強。


    事件或犯罪的目擊者，也會受到情感的影響，由於專注在某一情緒性的枝節，因此目擊者的說詞常會有問題，而且不能夠重建事件。情感系統仰賴'
