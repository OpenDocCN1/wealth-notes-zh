  md: '*for the Long Run*）這本好書的作者傑諾米·席格爾（Jeremy Siegel），應我要求在幾年前寄給我一些圖表，讓我用來說明股票在惡性通膨期間的表現。這份資料涵蓋
    1920 年代德國威瑪共和時期（Weimar Republic）以及巴西、阿根廷二戰後的通膨期。這些國家的貨幣購買力貶值到之前的 10 分之一。這三個案例不可思議的地方在於，這些指數一開始降了幾個月，但是經過通膨調整之後，明顯表現得更好，跟上了道瓊工業平均指數和其他主要工業指數。


    在低迷的市場中，就像今天這種市況，我們不必每次都打出全壘打。投資市場指數型基金，就能得到很好的投資報酬。如果你相信逆向策略長期下來會有效，那麼大量買入反向型基金所組成的分散投資組合可得到更高的報酬，如第
    11、12 章所述，它們幾十年來的報酬率都跑贏市場。我也認為，在即將到來的時期，不動產和藝術品會是不錯的避險工具，但你必須知道自己在做什麼。黃金將讓你免於通膨的影響，但不會帶來像股票那麼高的報酬。


    我們花了不少時間進入第 16 章。的確，這是個非比尋常的投資世界，而且在未來幾年內，環境仍然會很艱難，但是，這個世界並不缺少大好的機遇。葛拉漢在 1934
    年出版的《證券分析》一書曾引用下面一段話来形容大蕭條的谷底：『許多應該復原的現在倒下了，而應該倒下的竟然屹立不搖。』〔古羅馬詩人賀拉斯（Horace），《詩藝》（*Ars
    Poetica*），西元前 18 年。〕 ${ }^{20}$ 過去如此，未來也必定如此。


    我們經歷了一段恐怖時期，我們的系統雖然緊急關閉，但依舊完好無缺，同時它也將恢復正常。金融損失巨大，但我們的機構和民主制度仍然井然有序。


    回顧距今已近 80 年的 1930 年代大蕭條時期，那是個社會結構嚴重撕裂的時期。美國的體制遭到無政府主義者、共產主義者和大批老百姓的嚴厲批評，其中包括成千上萬的一戰老兵，他們全齡了出去，在
    1932 年前往華盛'
