  md: '# 魔鬼交易


    說經濟學家和效率市場追隨者不知道所做假設的天真與漏洞有失公允。源於18世紀至19世紀初理性主義盛世，經濟理性的假設前提因惑經濟理論人士已久。


    哲學和社會科學幾乎放棄了絕對理性。通說是人行事往往合合理性，但例外的時候也很多。市場和經濟史強力支持行為專家的發現。


    那麼，為什麼多數經濟學家要沿用一個不合時宜的人類行為概念，作為自家理論的基石？多數人同意效率市場假說核心的理性概念有問題，但依然為其用處提出辯解；像很久前有本書寫道：「引進較為現實的假設會讓經濟理論變超難。」^{57}


    經濟理論與後來的財務理論，數十年就是卡在這個進退兩難的地方。要改用現實點的假設嗎？如果要，又會是什麼？還是明知假設脫離現實，但可以上天下地做分析，實不實際是末節？用繁複的行為或其他假設建構經濟理論的難度高低，實際又怎樣？理性讓經濟學家有了一個簡單又堅固的假設，可是搭在上面的構造經常出問題。


    薩繆森是應用高深數學來解決經濟問題的先驅。新的經濟時代已揭幕，目標是讓經濟學的預測能力不下物理或其他自然科學，經濟理論的發現會跟測量金屬熱脹冷縮一樣精準，但高等數學只有理性這座靠山；結合社會學或心理學的理論，也許能指向一些可能的門路，可能漸入佳境，但要將複雜的數學公式代入飄忽不定的行為，可說緣木求魚；行不通，對多數經濟學家來說，最實際的辦法是用理性這假設，經常不正確是其缺。


    因此，絕大多數經濟學研究，取向所見略同，聽不進歷史上若干重要經濟學思想家的告誡。例如，凱因斯是數學背景出身，就拒絕在不現實的假設上，建立自己的經典理論。他跟老師阿爾弗雷德·馬歇爾（Alfred
    Marshall）一樣，認為經濟學是一門邏輯學，不用冒充成自然科學。馬歇爾寫道，多數'
