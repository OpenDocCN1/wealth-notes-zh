  md: '# 小數法則


    「小數法則」是特沃斯基與康納曼指出的一項代表性偏誤。 ${ }^{20}$ 兩人檢視心理學和教育領域的期刊後，發現研究人員系統性地高估以小樣本所得結果的重要性。原本「大數法則」是說大樣本能代表母體，例如從廣大且具代表性的群體所做的民調通常相當準確，反之，樣本越小（或期間越短），結果的可信度越有可能是碰運氣。


    特沃斯基與康納曼的研究顯示，心理學或教育領域在檢定理論時，實驗的樣本一般都很小，以致結果很可能只是運氣使然。 ${ }^{21}$ 心理學家和教育學者雖然訓練有素，卻依據太少的觀測，或過短的期間，對結果的顯著性抱過高的信心。「小數法則」是重要的認知偏誤，很多市場情境中都可發現。


