    2.5% 的績效超過標普 500 指數 2 個百分點以上，高達 87% 的基金表現落後市場或下市了。 $ ^{2} $


    我們還能怎麼辦？柏拉圖（Plato）在 2,400 多年前說了，需要是發明之母。天空沒有塌下來，對於某些不執著於過去的人，眼前仍有絕佳的機會。我确信我們國家強大到足以超越上個十年的多災多難。政策當局的錯誤與無能，以及釀成次貸大禍的貪婪，當然不能一筆勾銷，置之腦後，但本書主要重點是如何讓大家手上重新握有積蓄，如何建構將來禁得起類似情況的投資組合，以及以後如何採取會讓投資組合蒸萋日上的行動。


    這是困難的任務，得大家要反覆檢討並且對世代相傳且多數人習以為常的投資理論做出深刻的質問，而且我們要根據紮實的實證績效資料，而非傳聞的內容去無存書。這絕非易事。


    我在本書頭幾章要論證，從最近幾次市場崩盤還有許多傑出的研究，可'
