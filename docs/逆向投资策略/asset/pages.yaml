    更多證據指出，幅度極微小的盈餘預估失準，都可能對股價產生重大影響。重點在於，研究發現充分顯示，預估失準後來有利逆向操作股票，不利廣受愛戴的股票，為運用逆向策略提供了堅實的新證據，證據雖紮實，分析'
