  md: '我們所看到的是典型用了局內而非局外觀點的情況。前面的證據強烈支持康納曼所說的，用局外觀點得出實際結果的機率high很多。但康納曼也說：「預測這件事一面倒偏好用局內觀點。」


    市場上，局外觀點無法帶給股票投資人同等的把握，讓人生出能憑著一身專業，賺到高於平均報酬的信心；不夠刺激，也無法對客戶說出精彩的股票經，派上用場的機會遠低於局內觀點，但我們也知道，如完全根據局外觀點打造的指數基金，長期績效屢屢勝過一般基金。逆向操作策略的優異報酬，其實也是源自局外觀點，我們稍後就會介紹。


    以下是我們的投資心法：


    操作心理導航16：局外觀點長期而言通常能獲得較佳的報酬，要提高報酬，就要購買運用這方法的投資標的。


    有人可能想知道，為什麼會這樣，答案還是從心理面著手。正常來說，決策者處理問題的方式，是將全部的知識運用在任務，尤其集中於特徵。康納曼則指出人普遍過度自信，因此即使預測者知道前述的研究，依然會憑局內觀點行事，將局外觀點拋在腦後，無視統計數據。


    局外觀點的重要性經常遭到否定。我跟分析師和基金經理人提到誤差後，對方多半不當一回事。總之，這些人無視預測的紀錄，因為他們訓練有素，對投資學理論不疑有他，只要運用得當，一定會得到想要的準確結果。分析師和基金經理人似乎就是無法認清預測固有的問題。


    這種情形並非投資圈特有。局外觀點固有的統計計算，普遍遭到否定。醫師和律師經常抗拒用統計來看個例，這份對局內觀點的偏好消息，有時會形於道德訴求，所以可能會聽到他們說：「我的客戶〔或病人〕不是統計數字，不能將個案混為一談。」許多學科會暗示從業的學徒，這樣的局內觀點才是將來經手問題時的唯一專業手法，並以膚淺的類比來抵制局外觀點。


    許多分析師會說，像Google這樣的尖端科技網路企業，盈餘預估節節'
