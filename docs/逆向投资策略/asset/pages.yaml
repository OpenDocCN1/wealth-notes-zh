  md: '# 第 9 章


    # 有驚無喜的意外與神經經濟學


    歷史上不乏無人理會的警鐘和冷不防的打擊。約莫 100 年前（1915年），駐美德國大使館在《紐約時報》上刊登廣告，示警美國民眾若乘坐協約國的客船，可能會遭到魚雷襲擊。美國當時尚未參與第一次世界大戰。〔實際上，時任總統伍德羅·威爾遜（Woodrow
    Wilson）後來在「他讓我們置身於戰爭之外」的口號下贏得連任。〕然而，當英國海上郵輪露西塔尼亞號（Lusitania）從紐約出發前往英國利物浦（Liverpool）時，船上除了有美國乘客，還裝載
    173 噸要運送給英軍的槍枝彈藥及砲彈。這艘船最後在愛爾蘭（Ireland）南方海域被德國潛艇擊沉，造成 1,198 名乘客和船員不幸喪生，其中包括了 114
    名美國籍乘客。儘管按國際法，這艘船屬於合法的攻擊目標，但這起「意外事件」仍激起美國民眾的憤慨，繼而助長反德情緒，讓美國在 2 年後倒向英國、投入一戰。


    轉眼過了 26 年，美國又被意外砸中了，這次是珍珠港事件（Pearl Harbor）。日本人偷襲夏威夷海軍基地，促使美國迅速投入二戰。然而，在幾十年之後有證據浮出檯面，日本海軍其實在
    1941 年就發出了大量明確警訊。（耐人尋味的是，許多美軍高層似乎認定日本人作戰能力「低美國一等」，不敢出艦攻擊。）這個突發事件也激發美國人團結起來，當時這個國家仍未擺脫大蕭條，而且普遍憂懼內戰、混亂和共產主義的思潮湧入。


