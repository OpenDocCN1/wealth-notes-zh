  md: '事件後，全年報酬率仍超出市場3.4%（如圖 9-2 所示，且其結果與圖 9-1 和 9-3 也相類似），再看看「最佳股」輸給市場3.6%、低本益比大贏高本益比組7.0%，最遜股根本是天王天后級了。當然，這種差異根植於投資人太相信自己能直斷未來事件。我們因而得出，盈餘意外對股價產生了巨大而可預測的系統性影響。


    我們細看這些圖表還發現，盈餘意外導致「最佳股」和「最遜股」出現兩種不同的價格反應類型。我將第一類稱為「觸發型事件」（event trigger），而第二類稱為「強化型事件」（reinforcing
    event）。


    我將觸發型事件定義為，前景看好的股票遭受負面意外的衝擊，或是平庸的股票受到正面意外的加持。由於有觸發型事件，人們對於兩種股票的看法也截然不同。他們開始摘下有色眼鏡，更務实地評估這些公司，而重新評估的結果大大推動了價格調整，從而修正市場先前的過度反應。


    # 第一種觸發型事件


    觸發型事件又分成兩種，一是受青睞的公司遭受負面意外以致其股價下跌；則是冷門股迎來正面意外，股價大幅推升。觸發型事件會引發投資人的知覺改變歷程，而這歷程會持續很久，一如我們在前面看過的，其影響會從意外季度開始持續一整个年。我們也將在下節看到，實際上這歷程會拉得更長。


    除了盈餘意外，觸發型事件也可以來自其他意外事件。一個非盈餘意外可能是美國食品藥物管理局（Food & Drug Administration, FDA）批准一種新藥或拒絕進一步測試，也可能是一宗具指標性意義的於草案的輸贏結果，還可能是新技術問世讓某些半導體產品過時了。非盈餘意外有成千上萬種可能，任何一種都可能強烈而持久地衝擊股價。儘管這個道理還未經驗證，但我們從觀察中發現，這種意外事件對於股價的影響，類似於盈餘意外事件對於最佳股、最遜股和中段股所造成的影響。'
  merge: -1
  img_proc: true
- pgno: 211
  md: '不過，觸發型事件大多還是來自盈餘意外。第一種是備受讚譽的公司遭遇負面意外。世界最大的獨立生技醫療公司安進（Amgen）的價格暴跌即是一例。安進在癌症治療和其他重大疾病方面有很強的產品線，其主要產品是阿法達貝泊汀（Aranesp）和依泊汀（Epogen），主要用途是治療癌症患者的貧血。2006年，該公司推出了一種很有希望的抗癌藥物維必施（Vectibix），讓安進公司的盈餘從2002至2005年飛速成長，再加上強大產品線以及新藥進展順利，其股價從2005年初的57美元，到年底已漲到86美元，而分析師則加碼調高該股的盈餘預測。


    接著就出了大事。該公司在2006年底著手擴大阿法達貝泊汀的市場時，發現這種藥物最受關切的風險指標，即死亡率，在新的研究中略微高出了前期數據，故引起了一些頂尖腫瘤學家的強烈關注，建議降低該藥品的許可劑量，或者不排除完全禁止使用該藥品。消息一出立即震驚分析師和投資人，一連好幾個季度下調盈餘預測，同時有很多華爾街分析師調降推薦評等。截至2008年3月，安進股價暴跌了54%。


    分析師預測的末日狀況，其實並沒有發生。美國食品藥物管理局只要求阿法達貝泊汀的標籤要加注警語，並稍微下調了使用劑量，但這個藥品仍是安進的主要利潤中心。該公司盈餘在2008年開始加速成長，2009年再度回升。然而，到了2010年秋天，安進卻不再是熱門股了，交易價格跌到了10倍本益比，被貶入「最遜股」的冷宮。


    觸發型事件讓投資人重新評估該公司。如我們所見，投資人有系統地高估熱門股的前景。當負面盈餘意外隨著重磅負面消息擴散開來時，人們會驚覺原來「最佳股」也有今天。他們當下的反應是（快速）出脫持股，而這往往會導致股價跳水。就算後來被證實情況未如原本預期那般嚴重，甚至該公司也快要達成最初的盈餘目標，但投資人仍忘不了先前的不快。即便許多「最佳股」最後反彈回升了，但還是會有一段時間一直跑輸大盤。'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# 第二種觸發型事件


    投資人並不期望前景看壞的公司有正面意外。當這種意外發生時，人們會進入知覺變化的歷程，重新認真地評估股票，從而使得這些股票大幅領先市場，但有此結果主要還是因為最初被低估了。


    第二種觸發型事件，是指冷門股受到一個或一連串正面意外的加持。以雷諾美國公司（Reynolds American）為例。該公司是美國第二大菸草製造生產商，同時也在冷門股之列。


    雷諾美國公司透過一系列併購行動，包括把伍德無菸菸草公司（Conwood Smokeless Tobacco）納入麾下，在消費量逐年下降的菸草產業中突破重圍，營收顯著成長。雷諾曾公開表示，為了大幅提高獲利，要將營運業務整合到北卡羅萊納州，減少逾10億美元的支出和多餘的廠房，而它也做到了。從2004年3月那個季度開始，一系列大型盈餘意外翩然降臨，推升股價急漲154%，不僅如此，2007年中還配了高達6%的股利（這種投資回報在今日已不復見）。有買這支股票的投資人當然不多，但這項投資多半有成。


    # 盈餘意外的漣漪效應


    投資人對於公司、產業或市場本身的看法，通常不會因為單一的正面意外而改變。舉例來說，密西根大學（University of Michigan）的阿巴巴內爾和伯納曾研究分析師的預測行為，結果發現他們在盈餘意外發生很久後才會調整預測值。無論是高估還是低估，分析人員都不會立即修正，而是要等到3季以後才會調整。⁸所以如果預測值過高的話，在接下來的9個月裡依然會很高；而預測值過低的話，在之後3季一樣會徘徊在低點。


    正如阿巴巴內爾和伯納的結論，分析師「對最新的盈餘報告反應不足」。這種反應不足會引發新的意外事件，加速動搖投資人對公司的看法。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '例如，當熱門股遭遇負面盈餘意外時會讓投資人震驚，在隨後幾個季度裡又出現更多的盈餘意外（由於分析師沒有完全下調盈餘預測），繼而加劇投資人對於公司的負面看法，導致股價繼續往下跌。就像前面的圖表所示，觸發型事件的效應會持續好幾季。冷門股在面對一連串正面意外事件時，也會出現類似情況。


    # ## 強化型事件之效應


    我將第二類盈餘意外引發的價格反應，稱為「強化型事件」。這些意外事件並未改變投資人對股票本身的認知，反倒還加深他們目前對公司的看法。既然如此，它們對股價的衝擊理應小多了。所以強化型事件指的是，正面意外加諸於熱門股或是負面意外加諸於冷門股所產生的作用。前者強化了投資人原先對於公司的肯定。好公司就該表現好；而如果有正面意外發生，也在意料之中。


    微軟是世界上最大的軟體開發及製造商，並且在電腦設備市場涉入甚深。該公司是熱門股受到強化型事件加持的經典例子。2003年底，有時被謔稱為軟蛋先生（Mr. Sofity）的微軟公司，在消費端和中小企業市場上都有不錯的成長，並且在2003年底、2004年初輕鬆衝破原本的成長預測。不過，它的股票在短短幾個月內下跌14%，過了2年，也就是2006年中又跌了約13%，遠遠落後於市場。這再次說明，再一流的高本益比公司，即便有非常正面的盈餘意外，也只會帶來一般般的報酬。


    幾年前的波音公司（Boeing）則是冷門股受到強化型事件衝擊的例子。該公司曾因機械師罷工、747和787型飛機計畫的支出，還有全球經濟下滑拖累商用航空運輸這塊重要市場，陷入極為艱難的處境，連續4個季度表現欠佳，而盈餘也達不到預測值。該公司從2008年6月開始淪落為冷門股，2009年3月股價跌至每股29美元，但到了2010年4月強勢反彈，漲幅'
