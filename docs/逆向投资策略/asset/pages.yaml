  md: '點。我們在第4章看到聲稱能做到的技術分析也徹底失敗了。無論市場在高峰還是低谷，你都不會收到先買入或後賣出的警報才對。


    逆向操作策略應該做的，是為你的資本提供相對最佳的機會，尤其是在現今這麼艱難的環境下。這代表你的股票在市場迎來大跌時，跌幅理應會小於市場平均值，而在市場處於高檔時，則表現得更好。但請記住，平均值是會騙人的。即使逆向投資股票在大多數的熊市期都能有較好的報酬率，但這並不代表在所有熊市期都能做到。同樣地，儘管逆向投資策略長期下來的報酬率會遠高於市場平均水準，但並非每次都如此。想想自己是賭場大老闆，勝券在握，但是金融賭場和一般賭場不同的是，你會有幾年都輸得很慘，就像1997至2000年之間，或是2007至2008年那樣，而最後會強勢回歸，風光個幾年。你最大的敵人是本書在第一部分重點論述的心理現象。如果你能夠控制住短暫求勝的強烈衝動，就旨在全然陌生的異世界裡，成功指日可待。


    如我們所見，不論是牛市還熊市，長抱逆向投資股的長期報酬率是驚人的。時間越久，成果越豐碩。我們很快會提出一些令人印象深刻的證據，證實持有股票不僅是過去10年兩種最佳生財之道之一，而在過去200年裡也一直是如此。'
