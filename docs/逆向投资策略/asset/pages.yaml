  md: '恐慌在投資人之間蔓延擴大。許多人不計代價認賠殺出，他們認為，市場在經歷 2007 至 2008 年股市崩盤後長達 27 個月的回升期之後，股票正跌向新低點。一直到我寫這本書的
    10 月初，價格還未探底，市場仍在盪盪。


    湧入銀行的資金流也如水漫金山，以至於包括紐約銀行（Bank of New York）在內的許多銀行宣布，將針對高額的新增存款收取帳管費，這種事還是史上頭一遭。這一切要從何說起呢？


    戰場上硝煙未散，而且很可能再過幾個月一樣戰雲密布，監管機關和專家們群起關注高頻交易，視其為罪魁禍首。事出有因，高頻交易在此期間交易量成長了 3 倍，成為美國市場上的主力。根據《華爾街日報》的一份報告指出，市場研究機構塔布集團（Tabb
    Group）估計，8 月份高頻交易量的成長，把它在美國股票交易總量中的占比，從前幾個月的 53% 拉抬至 65%。


    包括高頻交易的數量激增 80%，代表這些公司在這段期間獲利衝高，而其他大多數投資人卻損失慘重。8 月 4 日至 8 月 10 日之間的單日股票交易總量平均為
    160 億股，這是有史以來最繁忙的五個交易日。報告也指出，8 月 8 日的交易量特別高，而道瓊指數下跌 635 點，這一天成了史上第四忙的交易日。塔布估計，高頻交易商當日買賣了近
    6,000 萬美元的美股和期貨，同一週內其他幾天的獲利也高達 4,000 萬美元到 5,600 萬美元不等。


    文章引述許多獲利豐厚的公司指稱，8 月 8 日、9 日對於紐約澤西紅岸的交易喔克斯（Tradeworx Inc.）以及芝加哥的蓋特有限責任公司（Getco
    LLC）來說，是雙雙大贏的日子。而紐約東塞托奇（East Setauket）的避險基金，文藝復興科技公司（Renaissance Technologies
    LLC）旗下管理的兩檔基金則據說在 8 月頭兩週賺進了 2 億美元。


    文章還指出，塔布估計 2009 年全年高頻交易股票獲利有 72 億美元之多，你不妨對照比較一下。高頻交易商在股票期貨，諸如石油和黃金等大宗商品，以及其他市場上也都很活躍。當股市中的其他買方，包括一些大型避險基金、共同基金和散戶損失慘重的時候，就是高頻交易獲利豐厚的時機。'
