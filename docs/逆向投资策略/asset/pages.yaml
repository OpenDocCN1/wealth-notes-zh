    意外是否會永久改變投資人的看法？這些問題目前無法從統計學上回答。但我們確實知道，投資人對於「最佳股」和「最遜股」的預測都過於自信，大大高估了「最佳股」，也低估「最遜股」。拿掉有色眼鏡之後，或許這種情況就會對調了。正如前面提到的，不會只有單一一個意外發生，在之後的季度裡還可能有接二連三的意外事件，這些意外不只是來自分析師的預測誤差，再再繼續強化價格重估的效應。


    不過我們可以說的是，低本益比和其他低位階價值型股票群組表現優異 *，而高位階價值型股票群組表現欠佳，這背後必然有一個或一系列事件改變了投資人對「最佳股」和「最遜股」的看法。


    * 低股價現金流量比組和低股價淨值比組也有類似優異表現，此處省略。'
