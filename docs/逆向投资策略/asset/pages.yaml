    資料來源：大衛・韋曼，2011年。數據來源：Compustat North American data and Thomson First Call.


    好，少說會讓你的本金爆增242倍。投資股票就算只是和市場平均表現看齊，也會有巨額報酬，如果你是採用逆向操作策略，結果更是驚人。


    你也許對此存疑。首先，40年是實際的時間嗎？有多少人會在某項投資上守這麼久？如果你是20多歲或30多歲，那麼25年或30年並不是太遙遠，特別是如果你是為個人退休帳戶（individual
    retirement account，IRA）或其他退休計畫做準備。


    但是，如表11-2所示，你的收益在較短的時間內也會讓人眼紅。下表是使用我們研究的四種逆向操作策略投資10,000美元，在5至25年內對照市場表現，會產生什麼變化。17
    如果你所見，所有策略在每段時期都贏過市場。而且，時間拉得越長，數字越漂亮。其中，低本益比策略的報酬率整體表現最佳。使用低本益比策略，5年可以遙遙領先市場18%；到了15年和20年，則分別超出市場69%和101%。再看看複利所帶來之差異。5年期末，低本益比策略的報酬率比市場高出3,203美元；10年後增加到12,419美元；25年後甚至達到209,687美元。請記住，初始本金都只10,000美元的一次性投資。


    有些讀者會說：「毫無疑問，逆向操作策略在這些研究中看似出色，但是，在實務操作上完勝市場的機率有多少？」而且還有其他問題來攪亂，例如2007至2008年的金融海嘯，這讓大多數人的退休和儲蓄計畫被砍了大半。'
