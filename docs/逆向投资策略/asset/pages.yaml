- pgno: 248
  md: '# 第11章


    # 從投資人的過度反應中獲利


    在上一章，我們研究了四種重要的逆向投資策略，這些策略不僅可以讓我們在今時今日生存下來，還能獲致成功。而我們也看到如果運用得當的話，它們長期下來累積的輝煌戰果。我們將於本章介紹一種新投資假說，似乎比效率市場假說更能解釋市場和投資人的行為以及風險。現在來看看我們如何把這個發現付諸實行？


    對於新假說的提倡者來說，要推陳出新總是困難重重。雖然提倡者在餘生不會被施予火刑或軟禁，但你想也知道，會有大批研究生用放大鏡檢視他們的研究成果，不僅費心挑毛病，就連標點符號也不會放過。舊理論是傑出學者聲譽和成就的護身符，他們終其一生致力於鑽研和擴展這些普遍認同的假說思想。更別提學過舊理論的人為數眾多；在投資領域更有成千上萬相信那是他們每天賴以為生的生財工具；還有數以百萬計的人仰賴舊理論的研究發現來改善投資組合的績效。


    於此，新挑戰者是否真的有用，對於信奉主流理論的人來說無關痛癢，至少在最初的50年是的。但對於本書讀者來說，則另當別論。你不必登高一呼說自己是逆向投資的信徒。你所要做的就是按照眼前的逆向策略重新布局你的投資，並在適當時機獲利了結。


    你從前面的章節得知我們的新假說建立於大量實證之上，並且做了大量的研究調查。但是，它仍然是所謂的假說。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '這就是為何研究還在繼續，以及為何我們不能認為逆向投資策略或投資組合方法已經大功告成。即便一路研究下來的結果很振奮人心，但要另闢新路徑和新策略，並讓逆向投資的研究發現與其背後的強大心理學緊密地相連結，前方的路還很長，有待我們披荊斬棘。


    我們一直很努力地想找出當今市場上投資失誤的主因。很少有投資者在不了解如何處理這些陷阱的情況下，能夠在目前這種環境中勝出。既然對這些已有了解，就等於是準備就緒向投資目標邁進了。如果能遵循我們新的心理指導方針，收割回報是遲早的事。


    對許多人而言，今天面對的投資世界令人覺得遺憾。但正如我們所知，往往時機越是動盪，越需要從新的視角去看待事情並接納新思想。我相信，未來不僅不會黯淡無光，還會有大好的機會等著我們。但是，要抓住機會，先要知道我們為何而戰，以及那些能為我們帶來最高勝算的戰術。


    # 第1節：投資人過度反應假說


    我在本書一直提到投資人面對重大事件會反應過度，因而引起價格反轉來糾正他們最初的反應。在第1、2章裡，幾次巨大的震盪輪番上陣，當市場情緒從泡沫期和經濟過熱時的超級過度樂觀，用向必然的恐慌時，股價重挫的幅度可達80%至90%。情感有時會伴隨其他認知捷思法，其正是最有可能促成這種投資者行為的心理力量。但是，這些可預測的過度反應不僅僅出現在市場狂熱、情緒擴散和恐慌當中。


    我們在再正常不過的市場環境中，也一直發現這些反應。以第9章所描述的異常盈餘引發的行為為例，「最佳」股票，從高本益比到高股價淨值比，再到高股價現金流量比等各種評估指標來看，前景最被看好，但是當他們有異常盈餘時，往往是成了遠遠落後大盤的一群。同樣地，「最遜」股票在相同的評估標準下，幾乎總能跑贏大盤。跑輸和跑贏的績效總額都很大，'
