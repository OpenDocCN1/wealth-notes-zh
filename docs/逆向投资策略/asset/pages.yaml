    時期的行為難以預測。你在投資時還應考慮其他因素。持有國內股票可讓你免於擔心匯率波動、走避交易清淡的投機市場，以及不受地緣政治因素的影響。


    兩者相比之下的結果是無人勝出。毫無疑問的是，國外市場除了歐盟以外，目前都還算健康，但我們該就此依靠它們嗎？如圖所示，這些外國股票的本益比不低，但市場資本卻比較小。


    還請牢記，並非所有國家都一樣安全。我覺得投資西歐、加拿大，或者在本益比降低的情況下投資日本，我會感到比較放心。而對於中國、環太平洋地區、南美或俄羅斯等國，我的態度會更謹慎。銀行和外國投資人因為當地銀行壞帳和重組，在巴西、阿根廷和俄羅斯吃了不少苦頭，投資有一半都打水漂。外國證券的承銷商一再向我們保證，現在的情況已大為改觀。也許是這樣，但是誰能保證一個曾經發生債務違約的政府，不會重蹈覆轍呢？


    在談完海外投資可能涉及的危險之後，平心而論，投資海外股票大有機會。散戶的最佳策略之一，是買入在美國市場交易且符合逆向操作策略的外國證券。我经常在自己管理的投資組合上這麼做，所以總是成功在望。*


