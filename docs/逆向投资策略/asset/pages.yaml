    9-7 中看到的四大類意外事件。


    這門新學科已對這四類意外事件的作用機制提出有力的解釋，但我們不需為了懂這些而成為生物學、化學和神經心理學專家。很幸運的，理解這些事件之間的交互作用要容易多了。


    就讓我們從多巴胺說起吧。多巴胺是人體自然釋放的一種化學物質，通常和大腦的愉悅系統有關。這種物質可以讓人產生快樂充實的感覺，進而'
