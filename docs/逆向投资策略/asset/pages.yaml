  md: '話都會有成千上萬的人拿去分析研究，但是其演講和聲明總是拐彎抹角、令人費解。


    對我而言，他的聲明不僅難以解讀，而且似乎常與他先前的論述相矛盾。我向其他基金管理人提過這點，或在《富比士》專欄也提過他的發言不夠清楚，然而，我得到的回應是，那是聯準會主席特有的表達方式，還有人說這就是先知說話的方式。葛林斯潘告訴著名的記者暨政治作家鮑伯．伍德沃德（Bob
    Woodward），他想藉此讓金融界不知所措，讓他們永遠無法完全理解他的做法，他稱之為「建設性的語意模糊」（constructive ambiguity）。⁵


    如果他說的話模棱兩可，對照之下，其擔任聯準會主席近20年的種種做法就不是這樣了。他的一舉一動在這場史上最嚴重的金融海嘯中有極其重要之作用。驚人的是，儘管他在關鍵問題上的決策是一致、可預測的，而且一再重複，但在那些密切關注聯準會的人當中，少有人掌握得了他的決策模式。


    葛林斯潘不希望任何層級的政府機關實施外部監管，他也不希望聯準會對銀行和其他金融機構執行監督者角色，或依職權保護消費者。他堅信，無論公司規模、產業或客觀環境如何，它們會根據自己的利益自我規範。在葛林斯潘擔任主席的近20年裡，其大多數重大行動有著濃厚的自律監管色彩。


    葛林斯潘與財政部長羅伯特．魯賓（Robert Rubin）和哈佛經濟學家桑默斯一起推動撤銷前總統柯林頓政府制定的《格拉斯—斯蒂格爾法案》，桑默斯的政治色彩濃厚，後來也成為財政部長。該法案限制商業銀行與投資銀行競爭的權力，從而大幅降低其可能承擔的風險，在當時大體上也運作良好，是葛林斯潘帶領的聯準會發起撤銷，他從1980年代後期便陸續開始重新解釋《格拉斯—斯蒂格爾法案》，並逐漸提高銀行擴展其他業務的能力。⁶


    聯準會和財政部的決策基於個人意識型態所做重大決策，左右著大多數美國人的福利和生計，而這些意識型態往往與選民的想法相左。'
