    # 胡亂預測之六：這有什麼意義？


    我們看到分析師的預測誤差，長期都呈現難以接受的水準；沒有基金經理人或投資客能在誤差幅度40%的情況下選對股票，別忘了，選股人士威認預估與實際數字落差不過3%，研究卻顯示，平均誤差水準是這個數字的
