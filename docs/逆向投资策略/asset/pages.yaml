  md: '但托勒密地心體系有滿足兩個有用的科學假設：「可預測」許多天體未來的方位，以及「說得通」行星運動的規律。


    同時它也完全錯了。


    不禁讓人聯想到效率市場假說，前面提到，效率市場假說和現代投資組合理論、資本資產計價模型等分靈體奠基於數學分析，這方面我還有其他批評者沒什麼意見，而是眼見太多證據顯示這個理論不準確，前面章節也有介紹，爭議的問題已變成，為什麼效率市場假說的根本假設毛病那麼多？為什麼沒有好好檢驗，還是根本就錯了？但許多超高深的數學卻是應用在這樣問題重重的假設上，基礎並不穩固。太空梭需要架在精良的發射台上才能順利發射，同理，高深的數學也需要紮實的基礎才能正確預測市場。


    第二個我們要探討的地方則是數學檢定本身，你可能有點意外，但許多效率市場假說檢定其實是有問題的，像是上一章提到的波動性，既不是唯一，甚至可能不能稱作重要的風險因子。檢視過這些假設和其問題，你就會明白我為何把繼續信服效率市場假說，比作跟伽利略揚棄太陽不繞地球轉之後，對托勒密體系不離不棄一樣。


    # 波動性的最後一搏


    上一章指出，效率市場假說的假設遭 1987 年崩盤、長期資本管理公司倒閉（1998 年），以及 2007 至 2008 年崩盤與大衰退連番打臉。禍首之一是風險理論不夠料，關注波動性，幾乎是把槓桿、流動性等重要因子晾在一旁。比起托勒密體系，效率市場假說甚至沒有可靠的預測能力，對市場走勢的解釋，也沒比托勒密對行星運動的準確多少。


    現在有兩個問題：


    +   1. 為什麼學界那麼關注波動性，獨獨用它來衡量風險？'
