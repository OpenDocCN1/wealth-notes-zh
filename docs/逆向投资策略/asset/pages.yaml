  md: '苟同，而為了保住波動性，兩者的手法也是半斤八兩，也就是保住資本資產訂價模型和效率市場假說圍魏救趙。


    但問題還是在那：為什麼風險是量波動性，而不是分析企業財務狀況、獲利能力、槓桿、流動性、未償債務之類，各種企管人士緊盯的指標？波動性固然對經濟學家很有吸引力，但你為何跟著買單？也許你沒想過，大部分人都這樣，但它確實有問題。


    首先，學界所定義的風險與報酬之間並無相關性，較高的波動性不會得到較佳的績效，較低的波動性也不會讓績效變差，這是數十年來早就知道的事情。


    麥克·墨菲（J. Michael Murphy）在一篇 1977 年秋發表於《投資組合管理期刊》（The Journal of Portfolio Management）上的文章，回顧了風險領域的研究，²得到若干令人吃驚的結論，至少是對相信效率市場假說和資本資產訂價模型的人。墨菲引用四項研究，指出：「低風險證券的已實現報酬往往高於預期，高風險證券則低於預期……也就是風險報酬的關係比預期薄弱許多。」³他又說：「其他重要研究的結論是，風險與報酬之間未必有任何穩定的長期關聯；⁴繳出的報酬和承擔的風險之間幾乎沒有關聯；⁵高波動性的單位信託並沒有獲得較高報酬的補償」⁶（楷體字是原文）。⁷


    羅伯特·豪根（Robert Haugen）和詹姆斯·亨氏（James Heins）在 1975 年分析風險的論文中，總結道：「本文的實驗工作結果不支持風險（波動性）會帶來系統性或非系統性額外報酬的常見假設。」⁸注意這篇論文是在
    1970 年代中期至後期寫成，那時資本資產訂價模型和風險調整後報酬的概念正要開始引領風騷，早於諾貝爾獎獎落髮展理論的首功人士十幾年。


    風險報酬之間缺乏關聯不是學界人士唯一的麻煩，更大的破綻是資本資產訂價模型和現代投資組合理論假設恆常的波動性會因時而異。長期資本管理公司的諾貝爾獎得主墨頓，幾乎認為這種看法萬無一失，直到長期資本管理公司被它害慘為止。不穩定的波動性也是
    2007 至 2008 年次貸債券、1987'
