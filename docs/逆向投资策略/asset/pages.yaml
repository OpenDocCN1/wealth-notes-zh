  md: '管的情況下，允許高頻交易在調查期間繼續進場。波動率走低之後，股價回漲了。證券交易委員會和其他監管機關的調查進度依舊拖沓。


    然後事情起了變化。2011年7月27日，標普500指數下跌27點，即2%。不過，相對於市場在2009至2011年的大幅回升，標普指數整個月中小跌2.1%，波動率仍然處于低點，且修正幅度較小。但一進入8月，天好像要塌了。繼8月1日溫和下降之後，標普指數在8月2日下跌了33點，即2.6%；8月4日大跌60點，即4.8%；8月8日再跌80點，即6.7%。同一天，道瓊指數狂瀉635點。從7月8日到8月8日，標普指數一共跌了17.3%，13.4%的跌幅都集中在8月的前六個交易日，這形同站在下一波熊市的入口了，因為一般認為的跌幅門檻是20%以上。


    波動性急劇上升。芝加哥選擇權交易所波動率指數（VIX）又稱為「恐慌指數」（fear index），用於反應標普500指數選擇權隱含的波動程度。恐慌指數越低，人們越有信心，市場越不會大起大伏。截至7月的前18個月裡，恐慌指數一直在20點徘徊，這被認為是低波動水準。然後，一波恐慌浪潮突然席捲了整個市場。


    隨著恐慌指數的飆升，標普500指數大跌。恐慌指數在短短幾天內翻了倍，從7月初的16點開始攀升，到8月初整個大起飛。自8月4日的32點上升到8月8日的48點，這波波動率上升之快，即使在股價像自由落體般墜下的市場中也幾乎未出現過。巨幅的波動導致恐慌四溢。全球市場受到美國的影響而大跌，很多地方甚至跌得比美國還要深。


    投資人和投資機構不到3週損失逾3兆美元。股市大出逃就像在電影院發生火警時，出口處蒸騰的恐慌。截至9月中旬的4個月裡，投資人從美國股票基金中撤出750億美元，這比雷曼兄弟倒閉後5個月的情形還慘。*與此同時，黃金和幾乎零收益的國債飆升。截至8月底的3個月裡，全球投資人從股票基金中撤出金額達920億美元，這比2009年春天市場反彈開始回補股票基金的資金還要多。'
