  md: '的整體走向，使用起來簡單上手，因此比起證券分析師提出的精準預測，投資成功的機率更高。顯然，這是我最偏好的方法之一。


    投資人可以選擇我已制定好的策略，或是看看下一章會談到的其他策略，它們應該也能讓你的績效勝過市場。但是，在此之前，先要走一趟反向式賭場。你應該會很愛，因為在這家賭場贏錢的機率很高。問題是，到底誰才是這間賭場真正的大老闆呢？


    # 第4節：使用投資人過度反應假說成功的機率為何？


    # 研究發現


    講到這個，我想一定會有一些耳語，而事實正是如此。市面上充斥各式各樣的投資寶典，大家吹捧的投資法也各自不同。有任何逆向策略能長期戰勝市場的真實證據嗎？確實有的。


    基於我們41年來對Compustat資料庫裡1,500家大型公司股票的報酬率研究，我們發現逆向策略勝過市場的機率，在任何一個季度大約都是六成。而拉斯維加斯和大西洋城的賭場以對他們有利的規則大撈特撈，贏錢機率也才5%至10%。使用逆向策略贏過大盤的機率甚至比賭場還高。待我們仔細研究這些機率，我猜結果會讓你大吃一驚。


    首先，與拉斯維加斯不同的是，你的投資績效就算和市場一樣，離場時荷包仍會鼓鼓的，不只能拿回你的錢，還可能有翻好幾倍的回報。如圖10-3所示，投資10,000美元，在41年後投資組合的價值變成91.3萬美元。在市場這間賭場裡，光是和市場打成平手，初始本金在41年後會變成90倍。


    但是，圖10-3也顯示，逆向策略長期下來的表現有多好。使用低股價現金流量比，你的績效會高過市場平均值2倍以上，將10,000美元的初始本金翻上216倍。採用低股價淨值比的話，則會比低股價現金流量比策略更'
