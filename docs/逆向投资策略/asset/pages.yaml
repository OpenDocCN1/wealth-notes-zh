- pgno: 157
  md: '只對了五成。有人這麼形容專家的預測：「常錯但大家很少起疑。」


    有經驗的作家或學者在預估自己完成書稿或論文的時間時，也難免於太過自信的情況。書籍或論文完稿的時間比預定的晚了數月甚至數年，有時天荒地老也寫不完。


    認知心理學的研究也指出，人太有自信自己的預測正確無誤。通常來說，作答者自覺九成九有把握的情況，對的機會只有八成，¹⁶這結果對於重要性很高的檢測顯然不太妙。


    當專家被拿來跟外行人比較時，問題就更有意思了。有些研究顯示，若是可預測性本來就不錯的問題，專家的準度普遍比外行人好。舉例來說，專業橋牌玩家頗能說中自己以某副牌勝過牌技普通者的機率。¹⁷不過，若可預測性很低，專家比新手更易於過度自信。要專家預測超級複雜的問題，如葡萄牙、希臘等歐豬國家的前景，基本教義派對中東外交政策的影響，或股市的走勢，通常是看他們展現過度自信的場合。因為手上的資訊很多，他們自認為在專業領域更勝一籌，反之，外行人因為所知有限，判斷上通常較為保守。¹⁸


    過度自信的專家是投資場上的雄師。投資界仰仗專家的深入分析，研究機構大量生產動輒上百頁、充斥圖表的報告，找人緊盯政府和國際政策與景氣的黑吹草動，最近出現且正遭受美國證券交易委員會調查的發展則是，聘請本來研究對象的大企業前高層搶先提供獨家內幕，動不動就會舉辦讓基金經理人透析業界的研討會，但有人說只是「錯得很高深」。


    專家知識越縝密，大家就認為他越有一手。雖然2005至2007年一直有風聲，花旗集團、雷曼兄弟、高盛等大銀行和投資銀行，莫不斷言房市並無泡沫跡象，繼續大賣特賣有害的次貸，包括自己手上的存貨給客戶，賺進大把鈔票，直到2007年中市場玩完了，許多業者跑去向前高盛高層鮑爾森當家的財政部要求紓困才免於倒閉，就跟臨床心理師和讓務員的例子一樣，拿到什麼資訊對預測結果的準確度幫助甚微。'
