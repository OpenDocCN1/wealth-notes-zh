    逆向操作派一直是小眾，統計數據再漂亮，也就是這樣。


    # 遠離績優股


    請務必認清採用逆向投資策略是種長期性賭博。賭客只擲一次骰子或只玩一手 21 點對賭場老闆來說沒什麼意義。他也知道賭客手氣旺的時候，會贏走他一夜、一週或甚至是一個月的收入。輸了當然會抱怨，但不至於會關門大吉。因為他知道遲早還是會贏回來的。


    而投資人應遵循相同的原則，沒有天天在過年的。報酬有高峰，當然也會有萎靡的低谷，委婉地說是這樣的。但千萬記住，逆向操作就如莊家的優勢一樣，對你是有利的。專業投資人和散戶一樣，經常會忘記這個重要原則，想要每一手都贏得飽飽的。


    即使一項策略在大多數情況下都能奏效，創造傑出的報酬率，但沒有一項策略能夠始終立於不敗。強勢成長型股票有時會有幾年讓低本益比或其他'
