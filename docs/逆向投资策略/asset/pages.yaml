  md: '大批的投資人買進黃金，金價在6個月內從1,400美元大漲至1,900美元。買美國國債是怕經濟走入大衰退，買黃金則是怕經濟過熱令通膨高漲，同一個市況，卻出現兩個大相逕庭的投資人反應。打個比方，這就像同時押注一匹賽馬勝出又墊底，加上賭場會抽成，如此投注的投資人，不管結果為何，幾乎只有虧錢的份。


