  md: '局艱難時，絕不相信資深內閣官員針對某公司或某產業粉飾太平的說法。在大多數情況下，該是時候脫股股票或是放下這產業了（見圖11-9）。


    # 使用低股票淨值比策略之實證


    # 摩根大通


    在一家公司步履維艱、盈餘縮水時，股票淨值比是比股價現金流量更具適用的反向指標。這從2007至2008年間金融海嘯中的銀行股中可見一斑。正如我們所見，由於次貸危機加劇，金融類股暴跌。摩根大通在精明能幹的執行長傑米．戴蒙（Jamie
    Dimon）領導下，是大銀行當中最先了解到次貸問題的嚴重性者。它在2007至2008年開始減少這類市場的業務，並減碼持有由這一類和其他評分較低的抵押貸款組成之大量投資組合。摩根大通與大多數金融類股一樣，股票淨值比遠低於市場平均值。


    但是，這兩者的主要區別在於：總體而言，摩根大通的股票淨值比是真實的。由於它贖回缺乏流動性的抵押貸款部位而導致流動性增加，聯準會和財政局介入，特別通融讓摩根大通在2008年3月16日星期日以每股2美元的贖價收購華爾街最大的投資銀行之一貝爾斯登，*每股收購價比貝爾斯登上週五的收盤價還低了93%。儘管還有其他投資者出價，但摩根大通是唯一可靠的競標者，最後聯準會促成了這筆「甜心交易」，讓摩根大通僅以15億美元收購貝爾斯登，该公司的資產包括價值約12億美元的總部大樓。聯準會還同意最多緊急馳援300億美元處理貝爾斯登的不良資產，以及為這筆交易提供特殊融資。摩根大通原本遠落後於其他競爭對手，此次收購案使其在投資銀行業務中站穩了腳步。


    摩根大通把每股收購價提高至10美元，想火速敲定這筆收購案，以避免貝爾斯登股東提起訴訟。'
