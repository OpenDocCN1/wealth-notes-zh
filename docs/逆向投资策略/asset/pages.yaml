    # 使用高殖利率策略之實證


    # 南方電力公司


    正如我們所見，高殖利率策略也帶來高出市場的報酬率，其與其他逆向選股法併用，能有效找出被市場低估的股票，而這類股票往往能獲取高於市場平均的收益和合理增值。如前所述，即使盈餘暫時性挫敗，高殖利率也代表管理階層對未來充滿信心。至於管理階層和董事會如何應對棘手的問題，則值得大書特書一番。


    公用事業類股通常同時具有高殖利率和低成本益比的股票，能帶給投資人良好績效。而高殖利率與低股價淨值比策略串聯於一更有效力。


    這正是我們要談談南方電力公司（Southern Company）的原因。南方電力公司是一家公用事業公司，在喬治亞州、阿拉巴馬州、佛羅里達州和密西西比都有經營公用事業，其擁有的客戶數量達
    440 萬。這間公司一直以來都只有緩慢但合理的成長。它與大多數公用事業公司一樣，股價會時不時因為一些小關注而跌一下，雖然沒多久就恢復正常了。有一次是發生在
    2002 年中，當時南方電力的股價跌至 24 美元，本益比 13 倍，殖利率為 5.6%。在接下來的 5 年半裡，盈餘和股利一路成長，直到 2007 年，總報酬率達到
    109%，以最初買入的價格來看，收益率 7%。這個例子顯示，投資人的過度反應不只發生在高波動性股票上，公用事業和非耐久性消費品股票也很有可能有此表現（見圖
    11-11）。'
