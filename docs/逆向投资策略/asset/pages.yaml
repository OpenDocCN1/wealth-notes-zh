    鬆勝出。先看看股價現金流量比（見圖9-5）。分析師預測失誤而產生的負面意外，對於低股價現金流量比組（比率最低的那20%）影響最小，這一組在意外季度中只略輸市場0.3%，甚至到年底就擺脫了意外事件的影響，贏過市場1.3%。（股價淨值比的結果與此相似，但圖中未予顯示。）


    負面意外對於冷門股而言，根本毫無影響。投資人原本就對他們眼中的遜咖不抱期望，所以當這些股票表現得更差時，他們也覺得稀鬆平常。最重要的是，負面意外並不是意外季度裡的大事，而且在之後的9個月中也受矚目。


    然而，對於「最佳股」而言，投資人只往好的一面想。畢竟，他們很有信心，以至過分自信可以精準預測「優」股的未來。正因為一廂情願認為這'
  merge: -1
  img_proc: true
- pgno: 208
  md: '些股票不會讓人失望，所以就算所費不貲也在所不惜。故當負面意外迎面襲來，災難便隨之降臨。


    圖9-5是按股價現金流量比評估的「最佳股」遭遇負面盈餘意外時的表現。在投資人收到壞消息的當季，其表現平均落後於市場3.6%，差到令人跌破眼鏡。也就是說，熱門股在遭遇同樣「差強人意」的意外時，其落後市場的程度的比冷門股（低股價現金流量比組）還差12倍。更慘的是，冷門股在之後9個月中還是略勝市場，但熱門股卻是直直落。直到年底，年報酬率大輸市場9.4%。背負負面意外的熱門股，在38年的長期研究裡，年報酬遠不及市場（14.8%），兩者差距相當於市場報酬的64%。如圖9-5所示，在歷經負面意外的年度裡，冷門股（低股價現金流量比組）比熱門股（高股價現金流量比組）的表現要高出10.7%。


    圖9-6是從本益比看負面意外的影響，其亦呈現類似結果。負面意外在意外季度，讓本益比最高的那20%表現陡降，而在之後的9個月中跌幅更大。


    我們該如何看待這些數字？很顯然，當寄予厚望的公司令人失望時，投資人的信心大挫，哪怕不是多大的負面消息也一樣。你也許還記得，我們特意採用很小的預測誤差（小至0.01美元），來看預估值到底應該有多準確。從一些能见度高的股票可以看出，即使是微不足道的預測誤差，也可能造成股價大跌，因此盈餘預測的精確度很明顯對於衡量股票用處不大。但正如我們所見，這卻是當今證券分析領域的核心。飛行員不會在飛機上使用全球定位系統，因為那樣就算再準確也只能飛到離目的地幾百英里而已，但證券分析用起金融界的全球定位系統，卻沒覺得哪裡不對勁。


    我們在上一章（表8-3）看過，要把負面意外控制在5%以內的機率，在每10個季度中是62分之一，在20個季度中則僅有3,800分之一。目前的研究顯示，投資人對於熱門股發生負面意外的容忍度遠低於此。一想到負面意外帶給熱門股的毀滅性打擊，只要是理智的人，肯定都會避之唯恐不及。'
