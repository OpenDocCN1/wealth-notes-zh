  md: '# ## 主席先生


    容我向你介紹一位美國歷史上左右經濟大權的大人物。他不是富蘭克林·羅斯福（Franklin Delano Roosevelt）或隆納·雷根（Ronald Reagan）等政治人物，但由於成千上萬的人認為了不起的經濟舉措全出自他的手，因此尊稱他為「德菲爾神諭」（the
    Oracle）（譯注：希臘神話中阿波羅神的神諭，被認為能夠預見未來）。世人認為他做的事不僅挽救了美國經濟，還拯救了全球企業。我說的當然是葛林斯潘博士。他擁有經濟學博士學位，且於1987至2006年間擔任聯準會主席。對華爾街而言，他的發言是投資人眼中的德菲爾神諭。


    在葛林斯潘擔任聯準會主席期間，似乎有股強大的意識型態驅使著他。眾所周知，葛林斯潘師事艾茵·蘭德（Ayn Rand），即《阿特拉斯聳聳肩》（Atlas Shrugged）的作者，很多自由主義者思想的啟蒙者。葛林斯潘曾在20多歲時參加了由蘭德主導的客觀主義（Objectivist
    movement）運動，因此熱衷自由市場，反對美國大政府的控制，同時也為蘭德名著《資本主義：未知的理想》（Capitalism: The Unknown Ideal）撰文數篇。他早年還是金本位（gold
    standard）的堅決擁護者，極力反對聯準會被賦予增減貨幣供應量的權力。他多年來一直與蘭德保持密切聯繫，強烈信奉解除管制。美國前總統雷根在1987年夏季任命葛林斯潘就職聯準會主席時，蘭德和他的母親還一起參加了他的就職儀式。


    葛林斯潘在從政之前信仰的哲學相對簡單：管制是不好的，自由企業才是正道。他甚至在NBC節目《會晤新聞界》（Meet the Press）上宣稱應該廢除反托拉斯法。他不僅想全面取消新政（New
    Deal），還想撤消共和黨總統老羅斯福（Theodore Roosevelt）在20世紀初期解散托拉斯的工作。他曾於1996年對美國銀行家協會（American
    Bankers Association）演講闡述他的觀點：「如果不管制銀行，它們將承受自己願意承擔的風險，市場也將自行'
