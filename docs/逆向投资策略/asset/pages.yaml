    越沒風險；某些眾所皆知的情境，我們會一再於重大不利於己的機率下犯 錯。我們也會看到，某些心理層面如何令人上當（在股票漲翻即將暴跌時買 進），以及為什麼那麼多人屢屢在機會不好時賭一把。


