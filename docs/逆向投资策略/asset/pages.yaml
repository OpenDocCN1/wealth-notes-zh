  md: '比或股價現金流量比可能從10漲到100，甚至1,000以上，4倍的股價淨值比可能變成40甚至400倍，基本面分析在這種價位無用武之地。


    在泡沫或極端超漲的期間，大家眼中只有分析師或基金經理人對公司或產業當前成長跟獲利潛力無限的誇大前景預測，重點是在這種情況下，典型的基本面分析工具，如獲利折現模型會對未來數十年做出高度樂觀的獲利預估，仍顯示泡沫股票的現價太高，如表2-1所示。


    分析師與多數人不知道，情感還有其他心理面，常使人將理性分析投資方法置之後備。經驗系統全速運作之下，分析師和基金經理人很難憑理性分析系統行事。多數專業人士會嘗試回到正軌，但強大的正面或負面情感，任誰都很難搞定。三十幾年來，我在多場特許金融分析師協會全國大會，也在各大證券分析師協會和頂尖商學院講述投資心理學，我知道專業人士是真的努力照所學的基本面方法行事。


    可惜，縱使廣為各大團體所知，心理學和當前的投資理論仍無法水乳交融，因為後者有根深柢固的理性分析方法，但苗頭不對時，分析師和基金經理人動輒將方法拋在腦後，投向經驗系統的懷抱，這時我們知道在極端的情況，情感會讓理性分析過程全軍覆沒。


    沒有分析師，也沒有基金經理人，能用理性分析方法來推薦或買進一檔泡沫股，分析師和基金經理人不必用到全球定位系統（GPS），只要用六分儀，就能推敲出這時股價偏離的程度。


