  md: '1秒內有數千張掛單，然後馬上刪單的怪情況，這使得交易系統不堪重負。「塞單」這個新詞就是由此而誕生的。康坦戈投資顧問（Contango Capital
    Advisors）是一家位於舊金山的財富管理公司，管理20億美元資產的執行長喬治·費格（George Feiger）曾說：「高頻交易商對公司的基本面根本沒興趣，他們只想打帶跑。」


    監管機關正苦思要如何控管高頻交易和這些超級電腦。根據一些圈內消息指出，美國證券交易委員會正考慮設定最短時段的規範，例如維持50毫秒的股票掛單買賣才生效。美國證券交易委員會也在考慮是否在股市表現很糟時，要求高頻交易公司留在市場上以維持流動性，因為這畢竟是證券交易委員會的主要功能。


    時任德拉瓦州的參議員泰德·考夫曼（Ted Kaufman），提出了多種防護措施，以期讓標普期貨暴跌時得以停損。他希望美國證券交易委員會限制刪單的數量。監管機關已提出辦法要監控日交易超過200萬股的公司。


    但是，這類變革不太接人氣，因為它們假定了執法者與高頻交易公司一樣反應靈敏。羅開全（Andrew Lo）是麻省理工學院財務工程實驗室主任，也是定量分析避險基金阿爾法辛普萊斯（AlphaSimplex
    Group）的科學長。他是這麼說的：「技術進步已經凌駕在我們的監管能力之上。就像美國西部那樣充滿野性、危險和機會。」


    # 高頻交易出續集：8月烽火


    正如我們所見，美國證券交易委員會和交易所從2010年底到2011年，都忙著設置熔斷機制，並規定在某段時間內期貨指數和股票漲跌幅的最大幅度。美國證券交易委員會也還在繼續調查閃崩事件，傳喚高頻交易公司出庭訊問。


    儘管人們似乎普遍對於控制高頻交易有所質疑，但監管機關仍在實施控'
