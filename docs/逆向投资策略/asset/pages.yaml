  md: '半強式效率市場假說聲稱，無論功力多高的基金、經理人或散戶，都無法靠著公開資訊，賺到超過大盤的報酬，這是市場上當道的主流說法。


    強式效率市場假說則是將弱式效率市場假說，也就是隨機漫步假說的鐵齒程度加倍。強式效率市場假說聲稱，連同企業的內部人士或操盤手在內，沒有任何資訊能幫投資人繳出超越大盤的績效。雖說少數研究指出，內部人士$^{25}$和操盤手$^{26}$能打敗大盤，但強式效率市場假說通常被認為過於嚴格，缺乏廣泛的共識。


    # 效率市場假說的進一步學界奧援


    效率市場假說的旗手法瑪教授*〔財星〕（*Fortune*）曾將他譽為股票的神羅門王〕檢視文獻，並在1991年12月$^{27}$和1998年$^{28}$二度提出效率市場假說。法瑪的論文非常詳盡，檢視了自己上次回顧以來20年間的上百篇發表論文，結果非常支持半強式效率市場假說的論點。


    儘管45年來有成千上萬篇的效率市場假說論文出爐，除了二個領域外，可說看不出有什麼新的研究。首先，有些新研究顯示日和週的價格變動具有預測性，但考慮到交易成本，並無實際的用處。


    法瑪指出的第二個新領域是事件研究，也就是研究特定事件與後續的股價或市場效應，這方面近20年來出爐上百份研究，法瑪發現：「平均而言，股價迅速對投資決定、股利調整、資本結構改變、公司控制權交易的資訊有所反映。」$^{29}$他也提及另一項大型的事件研究論文調查，做出相反的結論：價格對新資訊的調整既慢又沒效率，並未快速調整。但他最後在回顧論文說：「事件研究是市場效率的最佳明證，尤其是事件對日報酬的研究。」$^{30}$


    法瑪1998年的論文補充說，市場效率不死，他花了極大心力探討動搖


