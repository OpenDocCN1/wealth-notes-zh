  md: '分析師的光鮮亮麗人士言談的可靠程度。財經媒體的新聞快報很多是在報導個股或類股的財測遭分析師調降或調升，即使觀眾根本不懂報導的產業或企業，還是難免收看這類新聞。分析師變動對龍頭大企業財測的預測，會讓觀眾放下手邊的事，多少關注一下，要是變動的幅度不小，股票和類股可能跟著被牽連。


    媒體版面上的人士，誰不自認為務實，不打高空。這些人可是每天埋首於市場動向，而不是靠著導數學公式或跑電腦在猜行情，而且給投資人的專家分析建議，絕對是有憑有據。那好吧，我們就好好檢視這些人的實際績效如何。他們所做的預測和建議，廣為投資大眾看重重，並據以決定要買進、持有或賣出哪支股票。我們來好好分析一下CNBC、彭博之類的媒體，究竟有沒有為觀眾提供準確的資訊，還是其實跟氣象預報差不多。


    # 胡亂預測之一：預測企業盈餘


    雖說理論跟實務常常出入不小，但市場人士跟財務學界對於企業盈餘是股價的重要決定因素這點，倒是取得了共識。現代證券分析非常仰仗準確的盈餘預測來預測股價走勢，因此，大型券商會撥出大筆研究預算，聘請頂尖分析師來提供預測數字，大型的銀行、基金公司、避險基金為了賺取優渥的佣金和手續費，在這方面砸錢絕不手軟。


    《機構投資人》雜誌在數十年前訂出一套評比「最佳」分析師的制度。這家媒體每年遴選一份「全明星」名單，從上百家金融機構，挑選出生技、電腦、資通、製藥、化學等重要產業的頂尖分析師，每個產業底下還分一軍、二軍、三軍等。這本雜誌每年用一期頭版來報導這場盛事，選拔過程有如美式足球賽，非常刺激、激烈。


    若有家券商出了好幾個明星分析師，意味著接下來將會財源廣進。幾年前，一家大型券商的合夥人和董事決定解僱一名分析師，人資正要去通知當'
