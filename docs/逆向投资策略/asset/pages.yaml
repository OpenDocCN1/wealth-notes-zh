  md: '成真），正是他們言之鑿鑿卻不太會實現的預測，給股票製造了大部分的盈餘意外。


    本章第一節將介紹各種類型的意外事件，以及其有系統的模式，而最後一節則是關於相對較新的科學領域，即「神經經濟學」（neuroeconomics），它打破了一些傳統學科界限，結合神經科學、心理學和經濟學來分析人們的決策方式。它使用先進的監測技術記錄大腦活動，從而偵測分析人們在評估決策、把風險和獎勵分類，以及與他人互動時實際發生的變化。簡而言之，它的目的之一是透過生物學確認並闡述認知心理學的一些重大發現，而其結果再再令人意想不到！


    # 意外與市場


    對於買股一事，該考慮再三嗎？也許該吧，但更重要的，是該重新思量意外事件的整個反應機制了，不再只是道聽途說，而是從紮實的統計基礎切入。負面意外事件的的確確影響很大，無論你是公民還是投資人都一樣。然而，這只是其中的一面，反過來還有樂觀的另一面：正面意外事件，它讓我們的投資步伐變得輕快、投資組合更有分量。我們在本章將探討盈餘意外。儘管如我們所見，這類情況經常發生，但其實不一定会引發焦慮。恰好相反的是，如果你知道自己想追求什麼，盈餘意外反而會讓你的日子快活起來。我們將會看到，盈餘意外以一致且可預測的方式影響股價，而你可以善加利用並且發揮所長。


    具體來說，盈餘意外對於熱門股和冷门股的影響截然不同。重要的是，神經經濟學中飛速成長的新領域採用腦部掃描技術，研究人類對於意外事件的主要情緒反應，從而踏實地解釋我們看到的一切，故理解意外事件的本質，不失為一種極有可能打敗市場的方法。'
