  md: '買股風險的合理報酬，這是效率市場假說的分靈體之一：資本資產訂價模型的論點。根據資本資產訂價模型的定義，風險是指價格波動率；相對於市場來說，證券或投資組合的波動率越大的話，風險就越高。


    貝他（beta）*是最常見的波動率數值，可以應用在基金和投資組合的淨值，或上市公司的股價上，算法是挑一個參考指標，例如股市大盤指數，當作基準指標，股票投資組合或大型股基金通常會挑標普500指數，將後者的貝他訂為1。學理上，若基金的貝他大於1，則風險高於大盤，反之，貝他越小風險較低。理論上，長期而言，風險和報酬一定是相稱的。風險較高的證券或投資組合，理當賺取較高的報酬，反之亦然，若基金經理人的年報酬比大盤高3%，表示這檔基金的貝他應該比大盤高。由於學界斷言風險（波動率）與報酬兩者直接相關，所以將風險納入考量後，也就是改看「風險調整後報酬」時，原本高出的3%報酬可能沒表面上那麼好。


    效率市場假說非常簡潔優雅，並且回答了一個老生常談：為什麼股票市場上那么多聰明又勤快的高手，部位到頭來老是翻船，望市場興嘆？


    要翻出效率市場假說的手掌心比隨機漫步假說†更難，後者不過是說，技術分析對投資人沒用，但效率市場假說更上一層樓，乾脆說基本分析做得再多、找誰來做，明星分析師也一樣，投資人都不會因此在市場上占得上風。當消化吸收新資訊的買賣雙方人多到一個程度，哪還找得到價格被低估和高估的股票呢。^{23}


    打擊面非常廣。這理論說，在市場上，買來放著就是了，別白費心思殺進殺出，報酬沒有比較好，不過是讓券商多賺手續費罷了；這理論還說，若有人自誇過去績效比大盤好，理所當然要歸諸於運氣，別以為日後有辦法重現。^{24}


    * 貝他是用迴歸分析算得，直觀上可將貝他想成是某支股票對於大盤的相對波動率。


    † 後來稱為弱式效率市場假說。'
