  md: '# 胡亂預測之二：長期資料


    在增補《逆向操作價值型選股法則》還有在《富比士》等專欄的文章內容時，6我和詹姆斯麥迪遜大學（James Madison University）的邁克·貝瑞（Michael
    Berry）教授，對盈餘不符分析師預測一事做了研究，了解預測跟實際數字差了夠少，結果發表在1995年5至6月號的《金融分析師期刊》（Financial Analysts
    Journal）。7論文調查1973至1991年期間，券商分析師每季盈餘預測，並與實際財報數字比較，我後來將研究期間擴大到2010年。當季預測值幾乎都是在之前的3個月內做出，分析師最晚可以在當季結束前2個星期更改。總共收錄了216,576筆預測共識，8但一檔股票要納入樣本，至少要有4名不同分析師追蹤。9大企業如微軟（Microsoft）或蘋果公司（Apple），可能有30、40名分析師在追蹤。逾1,500家紐約證券交易所、那斯達克、美國證券交易所的企業被納入分析，平均樣本數約1,000家。據我所知這是迄今最全面的分析師預測研究。10


    在這出點小差錯，動輒興風作浪的場上，分析師表現如何呢？看一下圖8-1便知，結果是：分析師預測和實際數字相差頗多是常態，即使這些預測發布的時間，離當季財報發布不到3個月仍是如此。樣本的平均誤差是每年40%，要強調的是，這可不是小樣本，共收錄了逾80萬筆個別分析師預測數字。


    有趣的是，這麼大的誤差竟是發生在資訊革命的时代，即使資訊發達，估計誤差還是大到足以在大多數時候，無法用於判斷股價，這種誤差邊緣無疑容不下任何準確決定盈餘的餘地。


    許多市場專業人士的看法是，正負3%的預測誤差便足以引發重大的市場行情波動，這數字突顯1991年平均54%，還有歷年平均40%的誤差幅度有多誇張。熱門股票動輒因為財報數字比分析師預測低了幾百分點應聲重挫，可見少許的估計誤差，便可能影響投資部位的安危，這是分析師、投資'
