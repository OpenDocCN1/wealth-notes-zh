    # 投資組合保險：崩盤的最後一塊拼圖


    投資組合保險是一種讓機構投資人在市場走跌時可以保本，但在市場走漲時照常獲利的商品，簡單說，就是魚與熊掌兼得，雖說打著保險的名號，但究其實，這商品根本不是保險，它打的算盤是賣空標普500期貨，就能在市場走跌時得到保障，市場跌幅越大，賣空的期貨數是累進的，以降低機構持股的風險。*舉例來說，投資組合跌3%，Leland
    O''Brien Rubinstein Associates（LOR）或其他家用LOR模型的投資組合保險公司，算出相當於組合10%的期貨空頭部位，再跌3%的話，再賣10%的期貨空頭部位，若標普反彈3%，就將10%的空頭部位平掉，並損失一筆小錢。


    若標普500價位走跌，基金等法人是賣空期貨，不是賣持股。照效率市場假說的看法，期貨的流動性很好，市場也非常有效率，出清不過是指揮之間。效率市場假說的信奉認為，這方法除了一筆小費用外，漲時全賺，跌時


    * 賣空標普500期貨的效果等同投資組合直接賣掉持股，但更容易操作。若基金經理人決定降低股票部位10%，可以放空10%等值的標普500期貨，結果一樣。'
