    # 情感對證券分析的意義


    上一章介紹的泡沫和投機熱潮，我們在本書介紹情感如何在過程中火上澆油，還有當泡沫吹破時，如何助長驚嚇與恐慌。情感捷思既奇妙又嚇人：兼具令人吃驚的速度、微妙和複雜性，還有令眾人一失足成千古恨的莫大威力。史洛維奇說：「意義之難以捉摸，在於擺脫不了情感。」¹⁸


    我們應該先思考一下，我們理所當然認為值得投入大量時間和費用蒐集資訊的意義。使用像是深入的證券或市場分析等「有意義的資訊」，在很多情況下，往往由於攪雜情感，是不是反而知道了假象？


    顯然，要免於陷入這種危險的難度很高，所以本書會介紹讓大家遵守的紀律，好在情感又來壞事時，讓大家知道按下電擊的控制開關，說起來簡單，真正的問題是這種時候你能不能按下開關。總之，知道有情感在作怪這麼一回事，是前進投資策略的好的開始。


    # 基本面與價格分離


    情感誘發的泡沫有一個顯著特徵是讓分析師、基金經理人還有其他訓練有素的金融專業人士心中的基本面與價格變得各不相干。理性分析系統是評估一家公司前景典型方法的起源。


    特許金融分析師（CFA）協會和各大金融分析師培訓機構，都會教學員在判斷價格时要保持理性，不要漏掉一家公司的重要基本面。班傑明·葛拉漢（Benjamin Graham）和大衛·陶德（David
    Dodd）所著的《證券分析》（Security Analysis）是這方面的聖經，¹⁹市面上信奉類似方法的著作汗牛充'
