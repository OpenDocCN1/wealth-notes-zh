  md: '長史蒂夫·巴默（Steve Ballmer）就表示：「對我們來說，中國市場的吸引力還不及印尼。」¹⁰ 一位消息人士估計，中國有成千上萬微軟 Windows
    作業系統用戶，只有約 20% 是購買正版，其餘都是非法盜版的。¹¹


    隨著數以百萬計的中國人晉升中產階級，山寨版普拉達（Prada）、路易威登（Louis Vuitton）、巴寶莉（Burberry）和勞力士（Rolex）隨處可見。時代華納等傳媒巨頭出品的電影和其他智慧財產，以及音樂、電腦遊戲，也不斷出現盜版。¹²
    中國更扯的是，用嚴格的電影審查制度，禁止幾十部美國電影在中國電影院放映，而美國則特許他們以明顯較低的電影版權費在美國放映。


    不幸的是，問題還不止這些。我們不只是把工作機會外移到中國和其他低薪國家。美國有成千上萬的其他類工作機會因為盜版猖獗而讓給了中國。中國公然忽視我們的專利，而中國工人在中國輕易地製造美國和其他工業國家的產品，完全無視於專利和版權的存在。盜版產業的規模巨大。據估計，中國每年盜版的商品價值約達
    4,800 億美元，其中大部分來自美國。這個金額比美國對中國的貿易逆差總額（2010 年為 2,730 億美元）還高出 75%。¹³ 雖然金額龐大，但媒體很少曝光。參議員李文在國會及行政部門中國問題委員會（Congressional
    Executive China Commission）聽證會上說：「中國政府本身估計，仿冒品占中國生產的所有產品約 15% 至 20%，約占中國每年國內生產毛額的
    8%。」¹⁴ 美國國會研究處（Congressional Research Service）亞洲貿易和金融專家韋恩·莫瑞森（Wayne Morrison）在
    2011 年 1 月提交的報告中一再重申這點。¹⁵


    因此，中國以非法手段從美國和其他工業化國家中奪走了許多高階工作機會，在無視專利和許可的情況下，以極低成本提供給自己的工人製造仿冒品。結果，仿冒品占中國經濟的比重再也不可小覷，事實也證明，美國勞工和工業為此付出的代價有多高。


    儘管柯林頓、小布希和歐巴馬政府都曾試圖制止這些和其他不公平貿易'
  merge: -1
  img_proc: true
- pgno: 394
  md: '行為，甚至還鬧到了國際法院（International Court of Justice），但幾乎沒有任何進展。這裡頭還摻雜伊朗、北韓和全球暖化等政治考慮因素，使得美國的態度不再那麼強硬。


    我們和中國還有其他重大爭端。例如，我們要求人民幣適當升值，中國完全當作耳邊風，因為這將有助於我們增加出口、減少進口。美國與數十個對美大量貿易順差的國家正在進行類似的談判。


    我們應該如何處理這些問題？或者，處理得了嗎？最嚴重的是，我們的高失業率，以及這個問題是否會長期存在。在過去的10年中，美國國內沒有創造任何新的淨就業（net
    jobs）機會，光是中美貿易就減少或取代280萬筆就業機會，還有一些流向亞洲四小龍和其他低薪國家，而這些國家都不是自由貿易者。如前所述，歐巴馬政府公布的數據顯示，在2007至2008年經濟衰退期間流失掉的工作，有25%是回不來了。此外，將美國工作外包到國外的趨勢還在加快，絲毫沒有減弱的跡象，這可能代表，我們的失業率還會高居不下。


    美國就業短缺問題數十年以來積重甚深。從經濟衰退開始的前4年中，美國勞動人口成長了約3%。在健康的經濟體中，工作機會應該同步增加。但今天，美國的就業機會比衰退開始前要少了5%。¹⁶


    我們當然還有機會扭轉形勢。美國仍然是一個自然資源充足且切合需求的國家，除了石油，*本身具備的製造工業和技術基礎也很強大。我們可以向歐盟國家在內大多數國家看齊，好好認真地玩貿易的遊戲，擴大並改善我們的談判能力，迫使對美大量貿易順差國家逐步開放一些重要市場。中國或亞洲四小龍能製造的東西，沒什麼是我們製造不出來的。


    美國要採取更強有力的公平貿易政策，還可以對那些拒絕開放重要市場


    * 我們的天然氣儲量龐大，並且透過壓裂（fracking）工法開採的數量近年來已迅速增加。如果我們把貨車運輸使用的能源轉換為天然氣，就能大幅減少石油進口量，同時還可創造數千個新就業機會。'
