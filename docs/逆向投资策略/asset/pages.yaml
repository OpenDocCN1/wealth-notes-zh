  md: '牌（Royal Dutch/Shell）或英國石油等。2005年7月25日我在《富比士》曾建議以65美元買入阿帕契公司（Apache Corporation），當時它的本益比為11倍，比市場上許多股票來得低。


    當時，阿帕契公司的現金充裕，而且石油儲備充足，其探勘新油田的支出也直線上升，近年來主要的油田探勘計畫，也都位於相對安全的地區，可謂相當成功。


    該公司明智地投入勘探資金，而石油儲量也大幅提高。到2007年底，它的價格已比《富比士》建議時上漲了70%，而當時市場正要開始急劇下跌。按照前面三項評估指標來看，阿帕契公司表現得很穩，在市場表現平平的情況下，它都有達標。


    2008年發生了自1929至1932年以來史上最嚴重的股市崩盤，阿帕契遭受重挫，油價暴跌，而股價在2009年初跌到51美元的低點，但在2009年春天就開始大反彈。2011年冬天，油價再度攀升到每桶110美元，阿帕契股價則飆回到130美元。除此之外，它還從一個重大事件中抽到「油水」。在2010年夏天，英國石油發生漏油事故，阿帕契得以從英國石油手中以70億美元收購其在加拿大、埃及和美國二疊紀盆地油田的額外儲量，交易價格可謂相當便宜。


    阿帕契是先買入穩健的價值型股票，在股災期間繼續持有的好例子，這種做法的基本理由不變，也就是說，除非你相信另一次經濟大蕭條馬上就要來了（見圖 11-7）。


