  md: '跑贏市場，而且你的報酬率實際上會隨持有時間加長而增加。*如圖11-6所示，這項研究的平均年收益率6.5%。值得一提是，隨著經濟衰退的情況放緩，股利殖利率會隨著時間增加，並可能為我們帶來意外的收益。


    對於追求收入的投資者而言，時間拉長的話，這策略似乎比債券要好得多。如果利率上揚，債券價格會急劇下跌。以30年期債券來說，利率每升高1%，債券價格就會下跌12%。近幾十年來，隨著利率大幅波動，債券市場實際上幾乎與股票市場一樣動盪。買進高殖利率股票對於注重殖利率的投資者來說很有意義。股利會隨時間增加，而債券配息並非如此。沒錯，我們正處於一個高度異常的時期，短期國債券幾乎沒有收益可言。但是，正如第14章將要談到的，這對於投資者而言可能是另一個可怕的陷阱。


    如圖 10-5a 所示，高殖利率股票還能讓你在熊市時期不被波及。這些股票在市場下跌時，不僅保本，也照樣為看重股利的投資者帶來股息收入和資本增殖，後者在長期債券是很少見的。†但是，這種策略並非是萬靈丹，正如我們所熟知從
    2007 至 2008 年，再從 2009 至 2010 年之間的可怕熊市，當時有很多高殖利率股票被砍到見骨，哪來股利。所以，人們就用安全可靠的國庫券，換取相對穩當的股息收入，雖然這只是暫時性的。幸好，這種恐布程度的熊市隔幾個世代才會來一次。


    這個策略適合所有人嗎？我可不這麼認為。它最適合需要固定收入來源的人。當然，除非你的股票是在免稅帳戶之下，否則所有所得都要納稅。如果是在免稅帳戶之下，投資者最好使用其他三種逆向操作策略之一，這當然取決於個人對於直接收入的要求，正如我們在圖
    11-3、11-4 和 11-5 中所見，這三種策略與高殖利率策略相比的話，長期下來能帶來更高的回報。


    > *股利再投資。

    †關於股票如何與債券競爭的探討，請見第 14 章。'
