  md: '裕，不太可能會對奧駱亞造成什麼嚴重損害。*


    這就是葛拉漢夢想中的股票。首先，奧駱亞 2003 年的本益比和股價現金流量比都相當低，分別為 10 倍和 9 倍。再者，當時收益率為 6%，而且自 1930
    年代以來股利幾乎年年增加。指標 1、2 和 5 幾乎高到破表。不過，還不只這樣。


    儘管奧駱亞集團受到法律和媒體砲轟，但所有訴訟均針對美國那間菸草子公司（美國菲利普莫里斯）。當我們將奧駱亞集團的合併業務加起來時，按照保守的會計處理原則，每股價值為
    105 美元，菲利普莫里斯的國內價值則大約 45 美元，即只有公司全部業務估計值的 43%。由於市場對於其將面臨的法律和解規模杞人憂天，它的股票交易價格，掉到比真實價格的
    60% 還低。而且，美國最高法院（U.S. Supreme Court）越來越傾向於在原告所受到的實際損失之外提出懲罰性損害賠償金，這有可能會達到原告實際求賠金額的
    10 倍甚至 100 倍。法院考慮的是全面裁定損害賠償的規模。


    我們分析得非常透徹，還特別檢視破產的潛在可能性，但發現可能性微乎其微。最高法院大幅度降低實際損失之外的賠償金額，而且還嚴格收緊了關於集體訴訟的規則，這對於菲利普莫里斯來說很有利。到
    2008 年 3 月，股價（包括股利）翻漲了 2 倍以上。


