    實情是效率比理論上認為的罕見許多。市場並非快速因應新資訊調整的證據越來越多。羅尼．麥可利（Roni Michaely）、理查．塞勒（Richard Thaler，行為財務學先驅）和肯特．沃馬克（Kent
