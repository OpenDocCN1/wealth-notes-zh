  md: '場崩盤？


    這次崩盤也許只是冰山一角。大家現在更經常提起的問題是，雖然這些高頻交易者強烈宣稱，其在最關鍵時刻提供了流動性，但實際上監管機關是否在放任他們吸收支動性。 2010
    年 5 月 18 日，美國證券交易委員會和商品期貨交易委員會在閃崩事件後所撰寫的報告中，反駁了高頻交易者的說法。報告指出：「初步分析顯示，下午 2 點 30
    分至 3 點之間，交易量激增，買賣差價拉大，深度變小。而流動性明顯減少大致是發生在下午 2 點 42 分至 2 點 45 分，顯示後兩項觀測結果與流動性表現一致。」「報告進一步指出：「從下午
    2 點 30 分開始到下午 3 點的 30 分鐘內，交易量約達到過去 30 天同一時段平均單日交易量的 10 倍。」「這份報告說明了，交易集中發生在流動性枯竭的關鍵時段，即下午
    2 點 42 分至 2 點 45 分之間。


    標準 500 期貨並未如高頻交易商所聲稱般提供了額外流動性。實際上，他們與 1987 年股市崩盤時一樣少了流動性。明明就是大賣空重挫了股價。當市場瀰漫恐慌時，大賣空者的標準操作程序就是，在價格猛跌時暫停做空，等買者開始回籠時再繼續做空。這種做法讓高頻交易商大撈了一筆，而且從頭到尾在美國境內完成。


    熟知高頻交易內幕的圈內人認為，這類事件與 1987 年股市崩盤之前價格暴漲有許多相似之處。單就這點來衡量，高頻交易非但對流動性沒任何助益，反倒還會嚴重威脅市場的穩定，並且很可能再度引發類似
    1987 年的崩盤風暴。


    # 高頻交易的其他潛在問題


    不幸的是，危險還在後頭。根據彭博社（Bloomberg News）報導，位於伊利諾州溫內特卡市（Winnetka）的金融數據公司納內克斯（Nanex）聲稱，有些事件肯定是被做了手腳。該公司的研究人員發現，某一檔股票出現'
