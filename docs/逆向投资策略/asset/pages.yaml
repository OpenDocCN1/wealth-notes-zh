  md: '# 金融末世錄之騎士一號：流動性


    首先來看當代投資人首當其衝的大風險：誤解流動性，並且應對失據。我們曾於第 5 章檢視過，流動性對於過去三次大崩跌來說扮演重要角色，其在市場幾乎完全缺乏流動性的情況下，導致流動性不佳的股票、期貨急遽下跌，並引發市場恐慌。


    流動性不足並非是新風險，可能早自市場誕生以來就已經存在了。單單是 19 世紀，英格蘭和其他國家只要有一丁點流動性不足的耳語，便促使存戶爭先恐後擠兌銀行，從而讓銀行破產。當然，我們都讀過
    1933 年銀行休業整頓，大批存戶大排長龍等著把錢領出來。


    流動性不足當然不只對銀行造成損害。最近的例子是近幾年對住宅和不動產公司提供的貸款。由於銀行或其他商業貸款機構提供給建商和其他房地產公司的大部分是信用貸款，若大幅削減貸款額度或不續貸，往往會讓借方陷入困境，要麼拋售價格處置存貨，當價格跌得太低時甚至會落到破產（進入美國破產法第
    11 章破產保護），或是讓給銀行。有一些商用不動產貸款去年也發生了這種情況。


    從 2007 至 2009 年間，這個問題一直糾纏著美國公司，特別是那些員工不到 100 人的中小企業。它們支撐大半的就業市場，但因為銀行不支持而無法加聘人員擴展業務，在借不到錢的情況下，營運規模也被迫縮減。儘管次貸危機影響的層面極為廣大，但流動性不足遠比次貸問題還嚴重；即使是體質比較健全的公司也有這個問題。


    本節主要考慮的是，發生在貨幣供應充足的時期的損害。銀行和其他金融機構在這種時期會大幅放寬貸款標準。如我們所知，次級房貸的借貸標準低得可以。避險基金和其他貸款機構拿到大量槓桿貸款都是垃圾等級，原始貸款機構充其量只粗略審核抵押貸款的有毒資產。


    我們在商用不動產房價飛漲時期也看到這種亂象，例如 1980 年代末期'
