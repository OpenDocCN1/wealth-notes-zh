    特別有意思的是，法瑪發現後續者的研究結果屬「穩健」，等於直接打臉了效率市場理論上，新資訊會立即正確反映於股價的假設；由於基本假設未充分通過驗證，動搖了效率市場假說另一根支柱。接受檢定的是股票有反應新的資訊，而非股票正確反應了資訊。股票聽到消息有數十種可能的價位，怎麼知道哪個價位是對的？照這個邏輯，一個人能跑步，就有能力在奧運奪金。


