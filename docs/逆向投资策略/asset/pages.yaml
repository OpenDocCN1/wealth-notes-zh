    就市場而言，投資人對於意外事件的反應，我們也能猜個八九不離十。光是2000年代就有2000至2001年間倒閉的安隆、2002年接著倒閉的世界通訊，然後是2008年的馬多大詐欺案，讓數以百萬的投資人心涼了半截。2010年5月6日的閃崩事件更加劇了這種不信任，當時道瓊工業指數在幾分鐘之內暴跌逾600點，當日盤中震盪超過1,000點，創下美股市場史上第二大震幅。在我撰寫本書時，美國證券交易委員會和美國商品期貨交易委員會尚未祭出對策來防範這類閃崩事件再次發生。監管機關無所作為，讓投資人失望透頂，紛紛從股市撤走大量資金，轉身投入收益趨近於零的國庫債券。


