  md: '本書不會一一介紹股票和債券風險控制方法，這超出了本書的討論範疇。很多方法可以從葛拉漢和陶德所著《證券分析》（2008年第6版）以及其他幾本關於這個主題的好書中查到，它們將助你建立基礎知識。這些風險評估法則十分重要，並且在最近幾十年中沒有太大的變化。


    接下來，我們要探討未來幾年應特別注意的新風險因素。


    # 金融末世錄之騎士三號：通貨膨脹


    首先，讓我們快速回顧一下其中一些風險的歷史以及它們如何摧毀毫無戒心者。法蘭克·奈特（Frank H. Knight）是芝加哥大學經濟學派的共同創始人之一，他曾在其最具影響力的著作《風險、不確定性和利潤》（Risk,
    Uncertainty, and Profit, 1921）中指出，''風險與不確定性之间存在重大差異。根據他的說法，風險是「易受評估指標影響的量」，而不確定性是不可測的。


    按照他的定義，風險適用於許多類型的賭博遊戲，賽馬、棒球和足球投注以及其他許多可以計算風險的活動。不確定性適用於獲利或虧損都無法確定漲跌的情況，例如革命動亂時期的股票價值、賣空期貨或衍生商品頭寸，以及借助槓桿投資不動產等許多類似情況。


    過去60年來最危險的新風險是通貨膨脹，它可以從許多方面侵吞我們的儲蓄。我們過去一直不關注通貨膨脹，因為幾個世紀以來，物價上漲幾乎沒怎麼發生，只有在美國獨立戰爭和南北戰期間，以及別的國家的內戰期間才少量爆發。從1802至1870年，通貨膨脹值為0.1%，而從1871至1925年也只有0.6%。


    當所有主要國家都採用金本位制度，大多數政府和許多公司債券可由持有人選擇以本國貨幣或到期日黃金贖回。鑑於通貨膨脹幾近於零，時任麻薩諸塞州最高法院法官山繆·普特南（Samuel
    Putnam）在1830年提出的「謹'
  merge: -1
  img_proc: true
- pgno: 344
  md: '慎投資人」規則，150年來一直是投資管理界奉行的重要綱領。普特南說，一個謹慎投資人不投機，他指導信託人觀察「審慎、有判斷力和聰明的人如何管理自己的事務」，並且照章行事。因此，投資債券最明智的選擇，是持有大量優先股和績優股。


    但風險是猛禽狡獸，而通貨膨脹是對我們的資本發動戰爭的主力武器，一次次偷偷潛入我們的防線。在第二次世界大戰後，通貨膨脹讓那些遵循普特南法官的謹慎投資人陷入了束手無策的境地。任何人在戰爭結束時投入10萬美元於債券中，換算為今天的購買力，相當於
    1946年的28萬美元。但這是稅前收入，所得稅率在1946至2010年平均是60%。在通膨和所得稅這兩號金融末世紀的騎士踐踏之後，那些被課了最高稅率的債券、投資人或不動產，到2010年只剩1946年當初購買力的27%。


    法律往往落後於經濟和金融變革數十年之久，許多投資人及其管理人仍繼續依循普特南那個年代適用的規則，而它們早就嚴重過時了。事情的真相是，遵循長期以來運作良好的謹慎投資人規則，在二戰之後毀了數百萬美國人的積蓄。當時，風險以價格飛漲的形式，從普特南法官精心擘畫的資本保護法核心一躍而出，直至今日已成為投資人在21世紀要持續對抗的大型猛獸之一。


    接下來看看，我們如何妥善處置股票和債券市場中的風險。


    # 凌駕謹慎投資人規則


    二戰之後，通貨膨脹首次長駐在投資環境裡。病毒面前人人平等，沒有什麼能躲得過，但是那些市場公認最安全投資卻是最大的犧牲者，即儲蓄帳戶、短期國庫券（T-bills，譯注：此為期限
    1年內的國庫券，故簡稱短期國庫券）、國庫券、公司債券和其他類固定收益證券。即使相對於我們來回'
  merge: -1
  img_proc: true
- pgno: 345
  md: '討論的金融海嘯期間，在正常時期陷入財務困境的公司數量較少，\*但事實證明，大多數投資人長期下來因通膨風險所遭遇的損失，要比信用風險來得大。二戰後的漲價潮從根本上徹底改變了股票、債券和短期國庫券的報酬分配方式。


    # 股票的風險更高嗎？


    從普特南法官的謹慎投資人規則可以看出，古老的智慧一直認為，債券長期下來面臨的風險要低於股票。比起股東，公司債券持有人的財務風險畢竟小得多。如果一家公司遇到財務問題，它可以向股東削減股利，但它仍須支付利息，並在債券到期時償還本金。否則，公司一陷入違約，債權人會從公司拿走一切，而股東一分錢也分不到。在二戰前期，投資人不得不面對的主要風險，是債券或公司可能破產的財務風險。通膨風險在當時還無關緊要。


    戰後通膨加速，使所有風險計算被搞得七葷八素。儘管股票長期報酬率始終高於短期國庫券或債券，但這類金融投資之間的差距在1945年之後逐漸拉大。如果投資者在1946年投入10萬美元在短期國庫券上，那麼到了2010年扣除通膨之後只增值到13.3萬美元，每年報酬率只有0.4%。以此龜速大約要耗160年才能讓資本翻倍。債券也沒好到哪裡：1946年投入10萬美元，在2010年底變成28萬美元，年報酬率為1.6%。\dagger相比之下，1946年投入10萬美元在股票上，就像中了大獎，它會變成602.5萬美元，是短期國庫券的45倍和債券的21倍（稅前數字）。由於債券和短期國庫券這兩類的收益會隨時間明顯下降，相對之下股票的稅後報酬較高，而且差距會大幅拉大。


    > * 當前的金融海嘯或大蕭條等災難性事件不在此列。


    > \dagger 如前面所說的，這邊指的是此兩類投資的稅前報酬。'
