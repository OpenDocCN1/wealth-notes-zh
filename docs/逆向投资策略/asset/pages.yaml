  md: '比、股價淨值比、高殖利率及同產業低股價這五項標準來衡量，一直以來表現得差強人意，而那些前景看壞的公司卻總是表現出眾。這種策略從本質上就滲入了黑色幽默的元素。實際上，對於那些信奉效率市場或其他現代投資方法的虔誠信徒來說，信了逆向投資法就猶如中了撒旦的魔咒：「最佳」投資賠得慘兮兮，「最遜」投資賺到飽飽飽。


    不過，這些發現即便再怎麼不可思議，也不是邪魔歪道。實則大多數投資人沒有認清到，預測盈餘、經濟事件有多難。所以，一旦預測失準就會引發一連串可預期的反應。很諷刺的地方在於：對於這個具體可行的投資操作策略來說，有個最明顯又最具一致性的變數是，人們對於自以為前景看好或看衰的公司總是反應過度。箇中原理對過去市場有用，對今日的投資人也一樣適用。


    # 概念股之墓群


    能神準地預測未來的成長，是評估「最佳」股票的必要條件。正如第8章提過的，這些預測的可靠度出奇地低。我們還發現，當一家前景看好的公司盈餘不如預期時，哪怕是再小的異常盈餘，也會重擊股價。這並不足為奇，退一步言之，建立在精確估計值之上的投資策略，績效並不穩。經過1996至2000年的網路泡沫打擊，有個公墓堆滿了網際網路公司以及那些葬身在更早期的投機泡沫裡的股票；而那些不計價位都要入手的「必買」概念股，也有著相同的命運。


    許多專業人士和散戶口中的「最佳」，篩去了這類狀況的固有风险（inherent risk）（譯註：無法以其他相關內部控制預防或偵測錯誤發生的風險）。反之，股票在投資市場的能見度欠佳，股價會明顯被低估，而一旦出现異常盈餘的利多消息時，勢必會招來另眼相待而讓股價陡然翻身。又如我們在2章所見，被寄予厚望的股票，固有风险會被低估；而期望值很低的'
