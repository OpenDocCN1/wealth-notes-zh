    實際上，買入賣權所得到的保障，幾乎在1年多一點的時間內就會把所有續債投資組合的收益全部抵消掉。相比之下，買入賣權的保險費率，遠比18至19世紀初倫敦勞合社（Lloyd’s
    of London）針對從新世界和遠東地區返航的商船及其貨物所出售的船險還要高。


    我希望用這個案例告訴你，在危機時期，採用選擇權顯然起不了什麼作用。你的對手往往是經驗老道的交易商，深諳如何在完全自我保護的情況下，免被你試圖擺脫的風險波及，並可能向你收取高出現有行情的權利金，因為甘冒風險做這種交易的交易商少之又少。


    你還有其他交易成本較低的選擇，例如放空持倉，如果你選擇這麼做，同樣的問題會是，當我們在恐慌時賣出股票，價格通常處於谷底，即便是為了止損。但若市場反彈，放空持倉將讓你在市場反彈時陷入空無倉位的境地。舉例來說，假設我把逆向操作訓練都拋到腦後，並在2009年3月股市逼近低點時慌了陣腳，那麼這種做法將導致我完全錯過2011年6月標普500指數上漲超過100%的獲利。但問題是，這種情況隨時都在發生。


    大約10年前，我們公司的客戶服務主管擔憂市場會再跌5%，便從股市撤出所有資金，當時我建議他別這麼做，因為要看準市場的時機是件很難的事。他最後還是堅持己見，但事實證明他錯了。在他買回出脫的股票前，市場又漲了10%。幸虧我們公司不擇時，也不會為了客戶這麼做。


    不幸的是，我們必須與波動性共存，是的，長達80至100年左右。我們就算是錯的，堅持下去的話，我們或我們的家人最終將擁有很多投資組合。還記得，逆向投資組合一般來說在市場下跌時也能跑贏。'
