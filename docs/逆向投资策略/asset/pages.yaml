  md: '馬來西亞、南韓，然後是新加坡和印尼，伴隨股票拋售、幣值跳水、市場崩盤。亞洲四小龍變成落湯雞，形勢蔓延到南美洲、東歐和俄羅斯。


    這時長期資本管理公司決定拿出招牌絕活。眼見波動率飛漲，長期資本管理公司決定放空波動率選擇權，標的包括標普500跟歐洲等各大市場的指數。*墨頓和公司都有把握波動性會回到平均，跟著波動率期貨就會大跌，這次誤判風險成為了公司的致命傷。


    墨頓其實在走鋼索。效率市場假說理論、布雷克—休斯模型，和墨頓自己的模型說的是，股票的波動率長時間會保持一致，可沒說什麼時候會如願回歸平均。打個比方，你背著重裝備，渡過一條已知平均4英尺深的河：途中有時是3英尺深，有時深達15英尺。你一看就覺得不太妙，但墨頓跟他那一票數學高手選擇「撩落去」。


    如果是市場崩盤或走入熊市，波動率要花上多長的時間，才能應驗墨頓之類的效率市場假說人士的預言？六個月？一年？好幾年？效率市場理論也說不準，想也知道，畢竟這種想法似是效率市場假說的一家之言，而非基於嚴謹的檢定。但長期資本管理公司的槓桿來到30比1了，波動性非得要短時間內恢復正常水準不可，否則槓桿這個效率市場假說沒放在眼裡的風險因子，會隨著行情每況愈下，飛快地將資本侵蝕殆盡，可惜，長期資本管理公司可能落到這一步。


    也許幸運之神終究不怎慶買單效率市場假說。長期資本管理公司配對交易的價差並未縮小，反而擴大。1998年幾乎每處的資金都在逃亡，尋找安全港，偏偏這家公司總是揀風險較高的債券來投資，手上沒什麼安全的債券。屋漏偏逢連夜雨，市場動盪，長期資本管理公司放空的波動率指數飛漲；5月時，亞洲四小龍風聲再起，6月初，俄羅斯金融體系斷瀕潰潰，全球市場急轉直下，波動性升高，趨吉避凶的資金逃難潮，擴大了長期資本管


    > * 當時市面上並沒有這種選擇權，長期資本管理公司賣的是自己做的客製化衍生工具。'
