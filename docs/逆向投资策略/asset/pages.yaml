    # 不過是皮肉傷


    當我思考支持效率市場假說的陣營時，腦中會浮現英國惡搞電影《聖杯傳奇》（Monty Python and the Holy Grail）的一個場景，戲中亞瑟王和侍衛假裝騎在馬上，一蹬一蹬地穿越樹林，突然遇到黑武士，要求死鬥獲勝才能過路，雙方於是拔劍對決，亞瑟王接連將對手雙臂砍斷，但對手堅不投降，亞瑟王好心說：「你都沒手了。」


    「沒手又怎樣，不過是皮肉傷！」黑武士回嘴，改用腳踢，決鬥繼續，接著雙腿又被砍斷，黑武士變成人傻了還是不投降，大喊：「黑武士戰無不勝！」「回來，我要給你好好看，看我咬斷你的腿！」


    其實效率市場假說的情況跟這有點像，不管怎樣不認輸就對了。


    巧合的是，亞瑟王的故事其實不是正史，但在宏大的小說、詩歌、戲劇，或是童話甚至是惡搞電影中，亞瑟王的傳說真有其事。效率市場假說有成堆的數據，照理說真偽應該不難確立才是，但效率市場假說的歷史就是不斷在修改，每次更新結果都是換上更不牢靠的統計根基。


    上一章提到效率市場假說在 1960 年代勢如破竹，在投資圈摧枯拉朽，有如 1945 年喬治·巴頓將軍（George Patton）長驅直入德國，效率市場假說以言之成理的統計分析和高深數學，掃蕩了華爾街上的技術和基本分析陣營。學界言之鑿鑿基金經理人績效沒有比大盤好，於是上兆的資金轉向以各'
