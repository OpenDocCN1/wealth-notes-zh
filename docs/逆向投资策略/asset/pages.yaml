  md: '儘管陰魂不散，死忠派終究無法抹去作為效率市場假說喪鐘的超常績效，接著我們來看一些除魅討怪的例子。


    # 礙眼的市場異常


    效率市場假說另一個難關是它宣稱某種投資人，比如說具備專業知識、技能或方法的圈子，會一直讓價格保持該有的水準。³³我們知道情況不是這樣；不過，效率市場假說做出更強硬的說法：經過時間考驗，沒有哪種投資人或投資策略贏過市場。這下問題來了。


    經理人績效贏不過市場基準指標的信條有一個必然推論：沒有哪個方法或方式能一直繳出漂亮的成績單，但還真的有很多證據指出有些投資策略一直勝過市場，有些一直落後市場，根據呈堂證供，裁決無疑一面倒，對效率市場假說不利。


    第四部分將會介紹，很多文獻都指出，逆向操作策略數十年來都能產生顯著優於市場的報酬，這行徑公然抵觸效率市場假說的核心教條，也就是人的市場行為近乎全理性。


    另外，說在效率市場中，沒有哪種投資人或策略會一直落後市場，是效率市場假說搬來砸自己腳的另一塊石頭。幾十年來追捧熱門股的投資人，一直都繳出低落的績效。另一個重要的落後績效表現，是研究發現40年來市場上最好不要碰首次公開募股。³⁴超額和低落的長期績效都有了，剛好相反的兩種市場異常，效率市場假說都說不可能，但還是出現了。


    這些市場異常經過40年的考驗，不僅打死不退，近年來反而聲勢扶搖直上，冒出幾十篇研究逆勢操作的文章。重要的市場異常，即逆勢操作長久以來超越平均報酬的異象，也載於法瑪和弗雷奇1992年的論文，³⁵他們的資料也與效率市場的主張相抵觸，而且從來沒文獻說這樣的策略風險比較高。信奉面對大量抵觸的研究發現，要嘛縮回去，要嘛得好好想怎麼自圓其說。'
