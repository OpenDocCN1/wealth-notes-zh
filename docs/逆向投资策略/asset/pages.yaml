- pgno: 21
  md: '但那個生意人新建立的金融帝國，注定國祚短暫。市場突然急轉直下，加上運用太多信用交易，Recognition Equipment股價跳水後，他很快破產了，要提姆把之前致謝所送的伯爵錶還他。提姆改為光顧第一大道酒吧，希望換個氣象。我們還是有信心，市場重挫只是急促修正，我們很肯定，不像其他投資客的持股，我們手上的股票很實在，必定會上漲……


    我們之中沒人逃跑。


    我的朋友大多賠掉全部獲利與大部分的本金。當市場一路向下，我慢慢想起自己是價值投資分析師，於是將股票脫手後保住少許獲利，以為得了瀉瘡，結果是重度的神經質。不過我學到一課。上車一路狂飆感覺很好，但結局很討厭。我學過並具備泡沫的知識，還是被它打敗。


    泡沫在吹漲階段，股海歡騰，戳破時則像落入但丁的第八層地獄。而且泡沫不只是市場反常，偶爾發作，相反，泡沫更像是市場整體的一部分，之後你就會知道。泡沫急速放大市場出現的過度修正，不斷地與投資人的最大利益作對。泡沫與泡沫戳破後市場反應的動態發展，歷來表現出相當明顯的一致性，可惜我們並沒有好好從錯誤中學習。


    設想以下情境。


    市場上2個月來成交量持續放大，廣大投資人原本以為只要修正，之後會繼續創新高，但逐漸變得沒那麼確信，反攻一而再，再而衰，不肯定變得焦躁，這次是哪裡不對勁？


    接著被追繳保證金，促成舉國欣炊向榮的金融工具，原本好端端的卻重挫，跌幅還不是2%或3%，常一天跌逾10%，這是怎麼回事？


    紛紛傳出消息說，原本只有一家大型機構，現在又有另一家大型機構快不行了。勢必有人做點什麼，避免情勢兵敗如山倒。最高顧問請求無意出手干預市場的總統發表聲明，表示經濟前景佳，請國人放心，這次不過是短暫不確定的非再現問題，大繁榮完好無損。


    在旁協助總統安撫市場不安情緒的財政部長大有來頭，原本是華爾街大'
