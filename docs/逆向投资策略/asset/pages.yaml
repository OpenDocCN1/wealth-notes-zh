  md: '# 資訊處理漏洞


    第 3 章介紹資訊處理時提到，司馬賀在 50 幾年前就提出了資訊過量的問題，在某些條件下，專家會犯錯這件事可以事先料想，而且稀鬆平常，在心理學、工程、出版甚至土壤採樣，都可觀察到相同的錯誤，這樣的條件在股市同樣少不了。


    我稍微介紹過，當前企業、產業和經濟汗牛充棟的投資數據，其實沒有格外讓專業投資人討得便宜。處理資訊需要花費大量功夫進行分析整合，往往在專家不知不覺之間，經驗系統就騎到理性分析系統的頭上去，推論處理巧妙地超前理性資料庫，因為情感和代表性和易得性等認知捷思出面接管之下，消化大量投資資訊不見得能得到多好的決定。


    下一章要來看證券分析的重點：預測，所謂選股方法其實令人半信半疑，結果不準可說司空見慣，受大批專業投資人追捧的股票和類股，長期表現不如平均，也是明擺著的事，這是第二部分提到效率市場的研究發現專家長期績效反而落後的重要理由，效率市場假說宣稱的理性常保市場效率終究是迷思。


    我們必須先好好了解讓專家也跌跤的力量，建立防線，找到繞過陷階的路線，才有機會笑傲市場。


    # 多少才太多？


    面對複雜和不確定性，專家會希望仰賴更多的資料來做出決定，這做法似乎很合乎邏輯，於是市場上便存在大量這方面的需求，好滿足相信這麼做能幫自己發大財的投資人。可惜就像前面提到的，這項資訊「優勢」可能幫不了你。很多研究相當確定地指出，給專家更多的資訊對改進判斷並沒多大幫助。⁷'
