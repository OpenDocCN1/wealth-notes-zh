    # 流動性不會產生流動性


    如前所述，流動性在1987年股災中舉足輕重。有個很嚴重但很少被意識到的問題是，流動性會隨著市場條件改變而產生極大變化。效率市場假設假設「流動性會產生流動性」，指的是價格下跌，買方會大量湧現。但是，並無證據顯示這個假設是正確的，反而有大量證據顯示，在市場嚴重緊縮時期，價格若急遽下跌，流動性會枯竭。回想一下，在1987年股災期間標普500指數期貨市場也曾有過類似情景。儘管如此，效率市場假說裡未經檢驗的假設在歷經幾次市場大崩跌之後，仍被視為是市場的基本原則。而2010年的閃崩、2011年8、9月的股市恐慌以及其他崩跌事件也清楚地說明，流動性產生了流動性。恰恰相反的是：股票或指數期貨快速下跌，會讓流動'
