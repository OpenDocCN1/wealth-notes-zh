  md: '# 效率市場軍容更盛


    我們之前已簡單介紹過學界研究者提出的效率市場假說，這假說認為，精明內行的投資人互相爭利，會讓股價落在理當有的價位。為數眾多的明智投資人會分析決定股價的所有事實，市場會迅速吸收消化諸如企業更動盈餘展望或削減股利之類的新資訊，並立即反映到股票的價格。大量市場人士競相逐利，令市場超乎個人的好惡，股價會反映出最佳的真實價值估計值，縱使訂價有誤，仍無偏誤，而且價格過猶不及的機會一樣大。


    有用的資訊問世的事件難以預料，價格會隨機反應，以致技術分析派無用武之地。沒有人知道會出現什麼新數據，效果是正面或負面，會影響大盤或僅限個股。


    效率市場假說的重要前提是市場幾乎是即時且無誤地反應資訊，讓投資人沒辦法從中得利。研究人員做了不少論文並宣稱這個說法是站得住腳的。


    有一項研究探討市場對股票分割的反應。股票分割後，原股東仍維持相同的持股比例，不多也不少，但學者說，若有人莫名其妙炒高股價，精明的投資人會賣高，直到股價回到正常水準，證明市場有效率。研究結果指出確實如此，股價在分割後，長期的報酬分布仍與分割前相差無幾。^{21}


    另一項研究衡量1946至1966年之間261家大公司的盈餘，指出報表當月有預測中的盈餘數據僅占10%至15%，顯示市場對這項資訊不知情。^{22}其他研究結論差不多，情況確實如學界所稱，市場飛快地將資訊消化反映完畢。


    這些研究真的證明了市場即時反映新資訊的說法嗎？我們姑且先知道有此一说就好，後續會揭曉這些研究會不會被打臉。


