    # 總結逆向操作策略之表現


    上述五個成功案例：奧馳亞集團、必和必拓、阿帕契公司、摩根大通和南方電力公司，都說明了這些策略有利的一面。反向型股票的價格有可能大幅上漲，而且值得持有下去。理由是：盈餘成長夠快，而本益比、低股價淨值比和股價現金流量比一直很低。


    我提出的逆向操作法一直以來對我的客戶和我自己都行之有效。即便我覺得這麼精確的交易記錄實在沒什麼好爭辯的，但我還是要說，這些策略在牛熊市都做到了。$^{16}$縱使成功到什麼地步肯定會因人而異，話說同一個人在不同時期操作也不會相同，而這些方法是特別有效的投資策略，能大刀闊斧剔除掉不少複雜的判斷。


