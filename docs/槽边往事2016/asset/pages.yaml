  md: '那么，这些年王菲做了什么特立独行的事情了呢？除了打麻将、闹婚变之外，她早已经没有什么是个人新闻，也不再是这个 societal 里的前卫和先锋人物。屡次因为前夫窦唯的潦倒落拓而被媒体提及，这是王菲的不祥之兆。因为从维护个人形象的角度来看，王菲在媒体上牢固绑定窦唯并不任务是好事，有多少多少人会喜欢这种社会缘人，更没有什么人认同这种人的价值观。对于粉丝来说，她也早就不是自己的精神寄托，只是代表着一段过往的回忆。也就是说，作为偶像王菲已然褪色。褪色的偶像
    无法激发粉丝心中的激情和狂热，她的行为不能让人产生奋不顾身的冲动——她的活法不让人期盼，那么，她凭什么能卖10000一张的门票呢？


    如果从纯粹生意的角度出发，王菲真要想卖10000元一张的门票，那么，这个价格  只是最终结果。为了达成这个结果，在过去六年的每一天里，王菲都需要非常精確的自我包装和自我营销。如果要维持一个和粉丝互动的窗口，并且，通过这个窗口，她能够把自己的消息有内地地推送给自己的粉丝。如果过去的六年里，王菲认真
    经营的社交媒体和微信账号，拥有数千万粉丝，维持极高的活跃度，那么对数千万人发演唱会的通知，从中筛选20000个人报名，又会是多难的事情呢？


    在过去的六年里，王菲可以不开演唱会，可以不上综艺活动，可以继续保持自己的高冷神秘形象。那她就需要在过去六年里持续不断地做高价的事情，能够吸引 传媒和粉丝的眼球。打麻将，闹婚变一点都不高冷，那是任何一个中年妇女都可以做的事情。做不到雪山闭关一年，徒步走到非洲，单人参加划艇横越沙漠，最低限度也应该参加一下黑石沙漠的火车节，在威尼斯双年展上跨界和当代艺术家合作一次，想办法把自己的歌声进一年一次的Apple新品发布会现场演奏环节。前卫得像要代替粉丝活动，即他们想做但是做不到的事情。于是，即便在
    不开演唱会，但是个人作为却依然能够和粉丝形成呼应，始终吸引着他们的关注和恭敬。于是，越是高开公众视野，也就越能吸引关注。演唱会最终就成了这种渴望兑现的机会，那么就没有贵贱的问题，10000块钱只会让人花得觉值得。


    在这个世代里，人们都喜欢谈“粉丝经济学”。王菲演唱会的案例，就可以当做是一个粉丝经济反面教材。粉丝不是脑残，更不是韭菜，偶像无需任何投入，就可以过几年收割一次。无需两亿花的演唱会门票，那么，就要做出价值两亿元的事情。什么都不做等着收割粉丝，那么，粉丝也会什么都不做，等待收割你的笑话。


