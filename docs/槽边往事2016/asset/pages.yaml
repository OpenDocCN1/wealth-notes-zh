  md: '# 豆瓣评分的问题在哪里？


    和菜头

    18小时前


    豆瓣网创立于2005年3月6日，由于

    在2014年10月14日加入，算是豆瓣的早期

    用户之一。直至今日，豆瓣的许多影视

    和图书条目下，写着的影评和书评都

    还在热门评论区。自从小组兴起

    后，变成了文艺青年的网络大本营，

    我就很少再去了。最近，因为豆瓣电

    影评分引发媒体风暴的缘故，我叉重

    返豆瓣看了一下，有些人看法说想一

    下。


    电影评分并不是豆瓣一家推出的功能，

    也不是豆瓣一家独有的功能。为

    什么是2016年底成为争议的核心，

    而不是2015年，又或者是之前的

    任何一年？我们看一下数据就明白了。


    豆瓣成立于2005年，那年全国电影

    院一共有2668块银幕，全年票房仅2

    亿多亿元人民币，观影人次7300万。到了

    2016年12月，中国影城的银幕数超

    过美国，成为全球第一，拥有超过

    40000块银幕，全年票房收入预计460

    亿人民币，观影人次11.2亿。


    与此同时，2015年中国电影的年票房

    是440亿人民币，和2014年相比增长

    了48.7%。相比之下，2016年中国

    电影的增长就像高速公路突然拉下了

    紧急制动闸，距年初600亿的乐观

    估计有很大的差距。


    这就是为什么豆瓣评分会在今

    年成为争议焦点的原因：在2005年

    的时候，豆瓣评分还是在一个2亿人民

    币收入的小市场，每部影视作品文

    艺青年都打1分都没有关系，反正拍电影的

    人少，看电影的人也少。到了2016

    年，豆瓣面对的是一个460亿人民

    币收入的大市场，吸引了无数热钱的

    投资者，都揣着高增长率的期望

    在股市里分一羹。然而，中国电影

    市场在2016年突然出现了增长瓶颈，

    每部影片票房平均下跌20%。这时候

    文艺青年评论者的高成本、高投入的大

    制作打低分，资本的反应肯定和11

    年前完全不同。对于想战心惊的资本

    来说，消除一切票房的不利因素是他们

    最重要的任务，所以豆瓣会成顶上

    风口浪尖。


    豆瓣从2005年开始给电影打分，一

    直打了一千零一。在这十一年来，豆瓣的

    电影评分成为了中国网上最权威的电

    影评分。为什么最权威？因为它代表

    了为网络上有话语权的这部分文艺

    青年的审美趣味，文艺片评分总是

    比商业片高，国产电影总要比进口

    片高，新人导演作品总要比老导演

    高。然而，这个评分毕竟符合的是小

    众人群的口味，和大众趣味相差远。

    因此，豆瓣上有一个常见现象：

    票房和评分呈现背离的趋势。高票房

    意味着大众喜爱，但是大众喜爱并不

    意味着豆瓣上的高分，这是豆瓣电影

    评分分众的一个分。


    观察网上用户的行为习惯，我们会

    发现极端态度得到了更多的表达。也就是

    说，无论是极端满意，还是极端讨

    厌，这两部分人群有着更高的表达欲。

    他们会通过写、评论、刷表情来表达

    自己的好恶。而位于中间区域的用户

    们，他们并没有很强的表达欲。觉得

    一部电影还过得去，那么看完也就过

    去了，并不会专门去打分。因此，在

    网上针对电影的评分天然就存在这样

    的缺陷。再加上豆瓣的文艺青年数量

    众多，持批评态度的用户自然很多，

    也让评分偏向负面更多，这是豆瓣

    电影评分面临的第二个挑战。


    再加上来自资本的两个挑战，豆瓣电

    影评分的权威性和公信力面临着重

    重的压力。以一个小组体的审美水

    准，承担全民的审片标准，本身

    就是危险的。


    早在2006年的时候，豆瓣就面临过一

    次选择。当时，豆瓣详细在做电影、

    音乐、书籍站点和做互联网社交社区之上。当时我在丽江，

    和豆瓣CEO杨勃通过一通电话。而杨勃

    则认为是做一个专门网站，他看到

    认为做社交更有前途。如今看来

    我们各自都有对的地方，也都有

    考虑上的欠缺。如果当时豆瓣坚持做

    专业社区，而非网络社交网站，很

    可能因为无法吸引更多用户，而无法

    得到后续投资，很早就已经死张了

    事。但幸运的是豆瓣能坚持下来了。

    单单是在电影市场一个领域，就会

    从20亿票房到460亿票房的23倍增

    长，豆瓣仅仅是从这个上升的巨型里分

    了很小的一部分，可比今天的状况

    更强。


    豆瓣在2006年就已经做出了选择，在

    网络社交这条道路上一去不回，不断

    强化虚拟人际关系，不断鼓励建设兴趣小组，那一个针对众民的推荐算法

    看起来是一个很讨巧的存在。如果说，

    文艺青年的喜好对于大众来说并没

    有多少参考意义的话，那么，我们

    总能推出另一个更强的结论：大部分

    人对电影的评价对于我本人来说，

    毫无任何意义。对于一个豆瓣用户

    而言，决定看哪部电影，媒体推介也

    好，豆瓣评分也好，大都不会过朋友

    圈里的朋友推荐和观后感。


    没有，在我看来，豆瓣评分完全没

    有必要继续提供一个针对全民的电

    影评分系统。全民都可以打分，全民

    也可以查看，但是其实少数部分文艺

    青年感兴趣的，或者是部分极意愤怒

    的网易愿意打。在经过

    了11年的经营之后，在豆瓣上已经营造

    了极为复杂的关系系统。大家对于

    任何一个人的用户，都很难去给他看

    全部打分的分数，而是为他们所关注

    的人，或者说好友的评价更足够了。

    也就是，不再向用户呈现陌生人的

    评分结果。我觉得，这对于一个社交

    产品来说，是最为合理的去形式化。

    这样的评分系统，是严格去中心化的。

    每个人因为社会关系不同，看到

    同一部电影的评分会完全不同。

    而对于这个一千个的评分，而要求统一

    的某个得更能满足所有用户。

    最重要的是，它彻底杜绝了水军的压力，

    也断灭了资本操纵的可能。没有统一的

    得分显示，水军刷分就没什么意义。

    资本希望豆瓣调整分数，问题是

    同一个电影有成千上万的分，怎么

    去调哪一部呢？


    豆瓣电影评分系统在我看来，是它

    在转型为社交站点之后，早期做专业点评站点的去中心化。而这点在今天的新环境下，已经越来越不适应社会的发展。了。所以起纷争，是因为

    还有一个中心化的数据各方都想怪罪给

    制权。那么，直接去掉这个数据，

    换另一种形式，大概也是根治中国

    人评影狂热的药方。


    和菜头

    请相信我

    我所说的每一句话

    都是错的。


    禅定时刻

    如果微信做了一个电影好打分功能

    会怎样呢？'
