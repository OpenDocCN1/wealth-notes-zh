    \n死亡的阴影一直缠绕着科恩，他那一代人对世界的理解和我们今天完全不同。科恩跳过世界的墙，战火连天，经历过亡的死亡，和母亲相依为命的童年。对于科恩来说，世界是一个异常残酷的地方。10岁的时候，当他看到当地的信件聚集到他的手中，整整九犹太教的信件都因而在墙前。他转向自组们，以认为女性是光明之神，希望女性会管理世界，并且表示他更想出生在一个母权社会。\n\
