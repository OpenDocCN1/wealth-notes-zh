  md: "# 再见，科恩\n\n有些书，有些音乐，有些电影，以及它们相关的有些人，我们可能不愚蠢和任任何人分手，只想自己默默忍受。仿佛任何人是知道了，有什么东西就变得不完整了，就像黑暗和光明突然其来的黑瞎碰上了那种怪怪的黑暗。仲纳维·科恩是这样一个人，但他的音乐独自演奏一套音响都是值得的，只要能够一个人待在房间里安静地听就好。\n\
    \n今天，死亡打破了这种缄默。歌手、诗人、小说家、词曲作者、禅宗修行者伦纳德·科恩去世了，享年82岁。几年前，当鲍勃·迪伦获得诺贝尔文学奖的时候，科恩还致祝贺词。如今，我们却要开始缅怀他的一生，让人哀恸地感受到无常的道理，也越发珍视曾经留在这个世界的时间与展现。\n\
    \n对于从未接触过敏恩的人，不要因为他的逝世才开始听他的音乐而感到羞愧。这没什么大不了，因为他的作品作为一名佛教徒，想必他也会赞同自己的死亡会成为人们和他的音乐结缘的机会。不过，我不建议你立刻去听他的情歌创作。相反，你可以另外去播放他别的，容易入耳的一张专辑，去接近这位音乐家——Jennifer\
    \ Warnes那张著名的蓝色封面唱片《Famous Blue Raincoat》。在上个世纪90年代，这张专辑的CD在中国都是发烧友的天堂，里面所有的词曲作者都是布伦纳·科恩。有意思的是，它变得比科恩的任何一张专辑都好，所以不如你从这里开始吧。\n\
    \n![](img/86bf7d26156954fc1596fd15fb33ddf6_91_0.png)\n\n对于喜欢科恩的人来说，每个人都有自己的理由。别人什么心情我不知道，我认识感念别人着迷的地方也没有太多。列宁恩拥有极为漫长的一生，从生到死一直都有着纯粹艺术家的生活，在这漫长的一生中，他一直在做自己的音乐，因此也有一张漫长的曲目单。这正因为我们，而不是推荐人们直接去听他的音乐，而是从Jennifer\
    \ 的专辑开始。因为单独听科恩的专辑多少有些枯燥，这张专辑的歌词像一条河，科恩唱着自己的歌，而Jennifer在一旁和声。\n\n不过，我觉得所有艺术家的命运都是被误解的。因为创造者想法很难被人所理解，人们得到的是从创意到结果，从结果到读者的一切皆有逻辑。最广泛的比赛，也许就是在最大程度的误解之下。比如让科恩最著名的《Dance\
    \ Me To The End Of Love》，一向被说成是一首超甜的情歌，许多人听科恩的语调也依赖于此，认为他是风月人的头衔，但是其实只了解一系列越发去的情歌创作。如果进一步了解科恩的生平，你也想方法完全不同了。\n\
    \n科恩出生于1934年，自一个犹太人家庭。9岁那年，父亲因病而亡，他看到一张家中苦的照片，受到了极为深重的刺激。在写作他的遗训时，科恩想象聚集在父亲的殓户前，人们演奏奏弦乐四重奏。处在巨大的恐怖之中，因此美着了一种别样的激情，别样的甜蜜，达到了完美的程度。\n\
