    \  即低到这种里，也不会就此心又去冷，还能继续努力向前进。拥有这样特性的人，无论是做朋友还是合作者，乃至是教条，都是极好的，个人在听对方是时，是对方之后，自己亲自上手，发现情况完全不是那么一回事。这时候便依然会选择相信，相信人，相信美好的存在，愿意努力去适应，而不是迅速放弃，开始大声哭诉，这样的人值得信赖。不会因为他还有相信的能力，愿意相信的人自然也不会轻易辜负。\n\
    \n对于我自己来说，每次买苹果手机都是一次重温。在我买第一台苹果手机之前，我不会去为任何一个超过 5000 块钱的 iPhone，而认为这种购买是无意义的疯狂。那时候我认同所谓“性价比”，认为所谓“手机发垃圾信打电话就足够了”的说法，甚至是我的朋友们送了我一台初代\
    \ iPhone 和一部 iTouch 之后，我怀疑它们锁在抽屉里不想去碰。  甚至我变成了某种植物，它们我不想打开的抽屉，  像里面锁着一段冰封了的关系。直到那么一天，我终于打开了，最后终于一下下了那么多话。在越了某个点位之后，我终感到苹果手机的好，而且从此再也不想不起来先前的干选，仿佛根本没有发生过一样。然后，我就学会了自行购买\
    \ iPhone。\n\n通过购买第一台 iPhone， 我开始正确认识到了钱的价值。  我接受到的教育告诉我：  只买对的，不买贵的。  又说得地方为，\
    \  那么多年里我没有发现有什么更值得的地方，也没有发现什么对的西西。  更糟糕的是，  为了出为那么多年，也没发现能买下来多少钱。  08 年我开始北漂的时候，银行账户上就只有\
    \ 5 万人民币。\n\n等到第一部 iPhone 拿上手的时候，我终于明白了同一个道理——在收入水平承受范围内，价格上的昂贵和便宜只是个相对概念，根本不重要。关键得看花了这些钱，能给自己带来些什么人生中总共有多一些东西，拥有它们能让你感觉到一点点小小的美好，甚至可能可以因此后悔很久为此流下的每一滴汗水也会义无反顾。\
    \  如果单纯是为了结束而置之，  那它就不是它，是人的物，心小翼翼地花它，有问时候需要遭受着人生。  但如果我是为了人生中的美好，那么钱反而会成为体贴细致的仆人，而且这样的一个人值得自己为其持续奋斗。\
    \  太多人不能理解，心存对美好的这一点点欲念，能够让人熬过多人生的，产生多大的力量。\n\n每次买苹果手机的时候，我都会这样重温一遍自己的心路历程，重新感受一遍从心向枷锁里逃离出来的感觉，这这就是为什么我会买苹果手机的缘由。\n\
