  md: '# 满月


    大家好！


    从6月8日发布第一篇《代罗摆字：致女儿书》到今天，我在《得到》App的付费专栏《擅边讲事》刚好写满一个月。不算各种音频，刚好 20 篇文章。根据此前的约定，每周更新
    3+N 篇文章，我们可以得出6月份的 N 值是 2。请大家赞美，请大家撒花。


    通过一个月的接触，相信我们彼此之间都有了一定的了解。那么现在我们可以坐下来，随意闲聊几句了。


    说实话，在罗辑思维的《得到》APP开专栏并不容易。感觉就像是一个艺人，跑到了一座军营里搭台要戏。我没错，罗辑思维的用户都是战士，清一色的胜负师。追求更高更快更强的人生，目的就是为一个字：赢。所以，在内容上要求"干货"，要求"实用"，要求"信息量"。而所有这一切我刚好都做不到，简直是太神奇了！我写了一个月完全没有干货，根本不实用，也毫无信息量的文章，居然到现在还活着，我的天呐，这就是传说中的不知道"死"字怎么写吗？


    但是我提供了另外一些东西，比如说告诉你如何把钱花掉。


    在这一个月时间里，我告诉你要去看一下《厉害》的电影，现在它的票房接近1.5亿人民市了；我告诉你要去买一本《江城》读一下，这样你要远离那些一次性"重新发现中国"的文章；我告诉你夏天到了，应该去尝试一下比利时啤酒，它和你从小喝到的大工业流水线产品完全不同。如果你真的去喝了，应该在上周看一个调研报告，它说中国的啤酒和方便面销量正在下滑；我还告诉你要去买设计师做的窄腿裤，说是哪怕是祖规穿上以后也能让人感觉到身材挺拔。我没有说的是：一个人只有看到自己的形体还有提醒的可能，才会对自己的身体升起珍视之心，愿意去为它做出一些改变。昨天，我甚至讨论了应该吃什么，介绍了一本书和其中的健康饮食理念，引发了留言里的一系列讨论。当然了，这份高脂肪高蛋白低碳水的新饮食意味着更多花销。


    我觉得我所做的一切极有价值。干货、实用性、信息量大，无非是为了更快更高更强；更快更高更强，无非是为了胜出成为赢家。那么，你历经千万辛苦，终于成为赢家之后为的是什么呢？为了自己家蒸离窝头的时候，眼儿能够小一点点？那你历经千万辛苦之后，就是为了继续吃窝头么？民工都开始拒绝喝瓶装吃方便面的时代里，你的选择又是什么？千万千万一句话：和钱多钱少没有关系，一个人怎么样花钱，就有怎么样质量的人生。


    我还提供了另外一些东西，一些完全无法被归类，无法合并，也很难贴上价格标签的东西。比如说我买了歌手小河的《无觉》放在文章里让大家听，现在我正在联系方青，希望能买下他们的另一首歌来播放。这一举动甚至引起了豆瓣文艺青年的狂怒，在网络上抨击我竟敢如此僭越，一个写字的怎么敢推荐歌手。我当然敢，花钱买了版权的是我，那我就可以把我喜欢的歌手在每一篇文章里置顶。我说过
    N 次了：你不曾为之付出任何代价的喜欢，不称其为一种喜欢。


    还有如何在夏季飞行时避免航班延误的文字。看完之后你还是会遇见航班延误，看慢了文章里每一个字，也不会让你的航班提前起飞。它只是告诉你：任何情况下，面对服务人员都不要丢失了你的礼貌。它能带来直接的好处么？我并不确信。但我确信它能给你带来某种愤怒和暴力所无法带来的安全感，或者说内心的安宁。而一个内心安宁的人，总能寻找到困境中的出路。


    在过去的一个月里，我同时在更新我的微信公众号。一共写了 10 篇文章，平均每篇的点击量是 131886 人次。这个数字除以 10，刚好是《得到》App里我的专栏的订阅人数。


    所以，谢谢你看阅到现在。尤其是要感谢那些愿意在留言里认真讨论，甚至只是简单表达善意的读者。因为每一次新的探索都是如此艰难，如果不是你们的肯定和支持，我大概做不到一个月更新
    30 篇文章的程度。


    再次感谢！


    和菜头


