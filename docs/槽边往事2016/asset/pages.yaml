  md: "个相对简单的环境，无需不断提升自己的操作系统，以应对迅速变化的外部世界。\n\n1993年，我的大学同学以学习经济类专业为荣；1997年，他们毕业时进入宝洁这样的世界500强企业工作；2000年，他们以做市场做零售争取职业荣誉；而到了现在，他们早经已经离了零售业。而且不再打算和它有任何关系了。正在努力找投资、创业、新媒体营销等等新行业。在不到二十年的时间里，他们从上海去到广州、从广州去北京、从北京去部分人要飞往纽约。你很想象，这些人如果只是安装一套简单的操作系统，认同依靠努力谋求一个本地方公务员职位，这里大方原未结局，努力卖一辆车，从此过上炒房、炒股、出租铺面的生活模式，那么他们大概不能在不断的变化中支撑到今天。\n\
    \n但即便是拥有这样一套操作系统，依然可成未来的明日之星。总归有一天，当老中医、老专家、央视、中科院院士、人民日报报换成为BBC、CNN、MIT科学家、微博大V，当信息流中的我们在未来的世界里，变得和自己的长辈在今天的角色完全一样。因为我们的所见所闻，所行信过的，在未来和今天一样开始新旧的行规。而且，今天一开始的两个例子已经说明，不需要等到那个年轻时候就已经在颠覆着。前人的幸运在于他们的时代里，世界变化速度慢，需要很久之后操作系统才落伍。而我们的不幸在于我们身处一个高速变化的世界，操作系统随时都需要升级换代。\n\
    \n对于上一代人来说，人生是一个由不同阶段构成的静态过程。以毕业为标志，从此学习生涯结束；以结婚为标志，从此自我提升和自我完善之路终结。对于我这一代人以之后的新世纪，人生是一个连续变化的动态过程。学习新的是一个终身习惯，自我提升和自我完善是一个终身的修行。我不会再存在某种人生关隘，只要你到达这里就可以宣布你已经完成人生，从此一劳永逸解除了学习或者自我提升的使命。因为变化总是会在明天到来，变化总是对人的操作系统提出新的要求，所以不断升级是我们每个人的命运——这是我的第三个推论。\n\
