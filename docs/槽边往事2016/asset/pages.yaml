  md: '# 十一个月前在《得到》写了一篇鼓励大家多写公众号的文章。许多人因此产生了微信写公众号的兴趣，在写过程中也提出了许多有关微信公众号的问题。作为一名公众号三年写作者，我按照自己的理解回答一下各位的问题。


    答案：现在有大量微信排版编辑器，可以为文章增加各种标签、小标题和分隔符。但我还是坚持认为，不要在表现形式上浪费太多时间，而应该专注于写文章本身。


    毕竟，大家多是写作的业余爱好者，能把文章完成已经非常不容易了。


    要知道，大多数业余写作者在编辑器多试多试，偶尔能够完成整篇，甚至更宝贵的晚上，却连一个字都还没写。


    答案：我猜后面可能有一套算法，根据账号发布的作品的原创程度，更新次数，判定一个账号的内容是否有价值。


    如果我的猜测是正确的话，那么想到这些规则除了保持原创之外，在早期要尽可能地多去发到群组和朋友圈，尽可能让更多人关注，并帮助点赞助。机器大概永远不可能识别文字本身的质量，但是，机器可以从读者的行为上判定一篇文章的价值。


    答案：你在做公众号，要永远记得一件事：微信是基于人际网间的通讯产品。对于新手而言，最初的读者就是你的亲朋好友。如果他们愿意分享公众号或者向朋友推荐的话，你的文章就会进入到新的社交圈子，并逐渐向外扩展。


    需要强调的是：永远不要忘记在文章的最后写上一句话，“如果喜欢我的文章，请关注我的公众号”，附上你的公众号二维码，鼓励读者长久订阅。


    答案：首先，你要接受着一个微信公众号写作的基本事实：只要你发内容，就有一类读者。你更需要关注的仅仅是每天发文章，看有多少人感兴趣，是否有人分享，是否有人对你的忠实的读者，当你有精彩内容的时候，就会发出强烈的共鸣传播。


    人也会生。也有人也认为，人多是长期。所以，无需为短期反馈的未来太去太在意，他们关注不会，你写得多长距离，甚至我会说和你之所以来，完全是个误会。


    答案：你究竟想干什么呢？是想去点喜欢，还是想要在微信公众号里扬名立万，甚至打算在这里创业？


    如果是前者，写下来就是写到了，你没有一毛钱关系。因为你选择写作这件事本身，是怀着一份业余爱好，为了放松自己紧绷的神经，为了理顺你的思路，甚至为了证明你的存在。


    如果是后者，我明确回答这件事：


    1、写作是长期行业，只有投入大约百分之八十的时间精力，为绝大多数人谋利，在写作上赚取关注甚至是一大收入，那这是完全有理想的想法。


    2、成为，微信公众号更需依然缺乏足够多优秀的内容。在长期稳定的前提下，哪怕你投入了一部分多的关注，也能在短期内获取更多的关注。优秀的内客从来不会稀缺，而且违背了你看到的任何创作规律。


    答案：万分感谢！终于遇到一个和你写作的兴趣了！在你的个人生活里，我也能感受到你每天分享的事。你也能把你想和大家讨论的话题，你的信息是疯狂，愤怒，或全，伤，福，和怒，性，饥，饿……总之，你活在这个世界上，就不会被这些世界感触，你仍然能够所有感受。这些感触总要表达出来，除聊天，发发，吵架，哭，笑，你现在多了一个渠道，那就是：写下来。


    答案：网上有大量的图库，只要把问题一下，提交给搜索引擎，很快就能找到相关。国外免费图库，这里我额外提供一些细节：


    1、互联网上，一些盗版横行，但希望你喜欢尊重版权。可以参考我的公众号，去每篇文字的结尾就看到为提公众号，而在标注获取结构处，别人就管不了了，但是既然许多人都说你是看了我的文章，受到鼓舞才开始写作。那么，也请遵循《构建往事》同样的版权态度。


    2、如果可以，去查询一个“创作共同协定”，了解下一个CCO协议的定义。请记住一点，更多图片使用是CCO协议的摄影师，他们等于是放弃了自己作品的一切商业利益，免费把资源贡献给互联网。所以，你引用了他们的图片，为他们留下一些是理所应当的事情。


    3、使用国内摄影师、画师的作品，最好获得摄影师、画师的同意，尤其是在微博这样的社交媒体上看到的图片，不要直接拿到去就用。如果你有一张图要长期作为免费图库，或者用上了网图上正规的免费图库，或者有收入之后像他一样在www.shutterstock.com直接购买。


    最后，提供几个图库（最好自带梯子）：


