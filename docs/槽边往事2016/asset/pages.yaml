    \ 3GS 之外里面有每一代的 iPhone 产品，带 S 的没带 S 的都有。\n\n为什么是这个？因为我怕麻烦。\n\n在我的一个微信群里，有位老奶奶。知道我对网络比较熟之后，隔三差五就要扔一条链接进来，内容无一例外都是关于手机病毒的新闻，问我是不是真的。会不会对你的手机有危害。每一次我都要认真地解释半天，然后她也将信将疑地表示明白，但是没两天又来一次。这样重复了二十多次之后，我终于全面崩溃，彻底丧失了耐心。\n\
    \n于是我问了她的两个问题：\n\n+   1. 手机上有没有绑定银行卡、支付宝？\n2. 是安卓手机还是苹果手机？\n\n第一个问题的答案是否定的，第二个问题的答案是苹果手机。我告诉她：既然如此，请您以后不要再去看这种新闻了，因为您那是苹果手机，坏人是不忍进来的。万一真进来了，反正也不可能损失金钱，最多是在相册里的自拍照片，那也是提升了她中国社会福利总量。看到如此恶劣的回答，她从此再也没有问过任何关于手机病毒的问题了。\n\
    \n我的话并不能算是全对，因为以封闭性著称的苹果也存在安全风险，不久前的 iOS 9.3.5 版本更新，就是为了解除手机被远程控制的隐患。但相对而言这已经很好了，去年我给老妈买了一台大屏幕安卓手机，回家才插上电，各种弹窗、通知和诱导下载就已经在屏幕上自动滚动，简直闹得不行。开放的安卓系统就是各种国产流氓软件的免费版大。\
