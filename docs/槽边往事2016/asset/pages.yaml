    情， 不 需 为 此 焦 虑 和 惊慌。


    总 之， 这 一 路 上 就 是 个 闹 心 的 心 说 教 育 工 作。 我 的 心 在 说： 太 危 险， 要 向 事， 我 的 好 手 在 说： 别
    听 它 的， 它 已 经 疯 了； 你 继 续 发 向 事， 好 好 开 车。 我 反 复 告 诉 自 己： 那 些 都 是 虚 幻 的， 那 些 事 不
    会 发 生， 要 相 信 自 己 的 理 性 力 量。 然 而， 和 自 己 的 心 的 心 吵 得 噼 里 啪 啦 一 路 开 了 下 去。 等 到 了
    大 理 境 内， 天 色 放 晴， 这 处 湖 面 闪 闪 发 亮， 我 也 终 于 终 于 正 常。


    ![](img/86bf7d26156954fc1596fd15fb33ddf6_20_2.png)


    此刻 我 正 在 大 理， 面 对 苍 山 洱 海。 经 历 了 所 有 这 一 切 之 后， 我 有 些 感 想。


