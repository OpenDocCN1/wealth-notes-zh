    地 维 缠 住 了 一 件 事。 当 自 认 为 经 历 这 些 车 祸 后 的 心 理 创 伤 之 后， 我 就 决 定 存 在。 但 是， 我 宁 可
    用 20 发 / 小 时 的 电 视 速 度 到 大 理， 也 绝 对 不 要 停车 找个 司 机 来 代 驾。 一 旦 那 么 做 了， 我 这 套 子
    全 局 都 别 再 开 车 了。 而 且， 通 过 和 徐Q 的 对 话， 我 让 我 知 道 一 个 事 实： 路 还 是 那 条 路， 年 那 是 那
    年 那， 人 还 是 那 个 人， 只 是 心 不再 是那 颗 心， 或 者 是 重 压， 我 所 有 的 不 良 感 受 都 是 虚 幻 的。 车 子 并没
