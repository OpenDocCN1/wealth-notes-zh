  md: "为什么自我革命那么重要？这是因为游戏**本身是异常残酷。如果站在互联网的角度来看，大多数商家试图都是一个流量游戏。所有的商人都在试图争取流量——在现实世界里，流量**是人脉，而获得流量需要成本。当一个领域的内部获取流量的成本太高时，那么只有巨头玩家才能存活，小玩家就要退场。退到哪里呢？你还没没有分类型的流量山腰的争夺，在那里新玩家还在想要做业务，从零开始吸引流量，并且在想把流量做大之后，自己成为大玩家。\n\
    \n为什么说是残酷呢？因为在流量平原上从零耕作非常辛苦，需要经年累月地努力，才能吸引一点点人进来。等到真的开始爆发，流量快速增长，别处的大玩家一定全会发现，转移过来收割胜利果实。一玩家转移过来的时候，带来的不仅仅是资金，还有新的模式和技术，用最有效的方式在新市场上收割利润。起点中文做了多少年？最后真正的收获者是腾讯，腾讯有能力把起点的作者、读者挖掘出更多利润来。大众点评做了多少年？最后真正收割的是美团，美团有的是办法从大众点评里爆出油来。看看现在的搜索结果就知道了，第一展开回去的结果全是跟广告。之所以敢于这么做广告，原因是大众点评做得足够好，用户足够多，渗透率足够高，市场上没有一家愿意花一样多的时间和精力去做它的竞争对手。\n\
    \n为什么起点中文做不过腾讯？因为腾讯是一家全方位的娱乐公司，自带惊人的流量。起点中文要做一个网站，需要自己买流量，需要自己造一个游戏，而所有这一切，在腾讯这里根本不是问题。腾讯有自己的媒体、有自己的游戏开发团队、有自己的流量大海QQ，有每年创造数百亿利润的后盾，所以，腾讯自行开办创世中文之后不久，干脆就买掉了整个起点中文，连打一仗的兴趣都没有了。为什么大众点评做不过美团？因为美团打生下来第一天就对做点评没有兴趣，它的兴趣在于团购和电商。美团在历经千大战成为幸存者之后，大众点评是餐饮领域内唯一的大型网站。在美团的眼里，大众点评就是**最好的外卖和团购导流入口。而两家之间的竞争在投资人那里看来，纯属没有必要的浪费。所以，最终大众点评成为了美团的导流入口，因为美团赚钱更有效率。\n\
    \n事情就是这样：因为勇于终结无人问津的领域去开拓，死中求活，终于赢得尺寸之地。但是，往往市场培育成熟之日，也就是自身终结之时——这就是社会这所商学院，通过漫画圈的纷争告诉我们的道理。它都没有教科，只有几条新闻，几条微博，但是却比所有商学院的课程都要生动真实。\n\
    \n和菜头\n请你相信我，不管我的每一句话，\n\n本阅读与同步了**三篇点评**，引起了一些读者的不满。每周点评会更新三篇文章，这就是第三篇。加上三篇点评，一共是六篇。那些不满的人，拿起你的计算器，继续算算是亏了还是赚了吧。\n\
