    \n换一个环境，选择苹果手机就是选择远离麻烦。试想一下，如果是苹果手机的话，需要浪费多少篇幅解释哪些操作是安全的，哪些网页是安全的？又需要浪费多少时间去定位和清除造成手机里奇奇怪怪弹窗的\
    \ APP？要是使用安卓手机在家中的父母呢？准备手机相机课件可以用电流远程指导解决吗？  苹果手机机就很简单，按 Home 键不灵，那就按电源键重启，还不行就强行手动冷重启，99%\
    \ 的问题会随之消失。\n\n从我开始做微信公众号开始，几乎每周都会接到投诉，说访问我的文章时弹出垃圾广告。每去一次问是什么机型，无一例外都是安卓手机。解释了几十次之后依然解释不清，这种事情的智力和热情又岂能放得开？而要么怎么说，对方会理解我这是在广告商那里靠卖垃圾\
