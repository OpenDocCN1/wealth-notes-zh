    \n科恩还给江山。这时却发现自己的人已经靠我，而自己重过得一无所有。最终，科恩65岁第二次上路，在世界各地巡回演出。对于新的世代而言，接触科恩就是他的这些现场演出，因为看到一个老头用的是嗓子嗓子嗓音唱歌或感到新奇，从而走进了科恩的世界。\n\
