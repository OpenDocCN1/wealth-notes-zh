- pgno: 25
  md: '# 1-1 選股法則1 近5年營收正成長


    營收簡稱營收，是一家企業能否維持穩定獲利最主要的源頭，也是投資人觀察一檔股票的重要指標。對於聚焦在成長股的投資人而言，沒有什麼比「獲利持續攀升」來得更重要，而營收穩定的成長，正是推升獲利不斷創高的首要關鍵。


    投資人想找出有大漲潛力的成長股，首先要有解讀財報的能力，而「綜合損益表」、「資產負債表」與「現金流量表」等3大財務報表中，綜合損益表最能看出一家企業的獲利成長性。我們以台積電（2330）2017年的財報為例，來檢視其綜合損益表的主要內容（詳见表1）。


    從綜合損益表可以清楚看出一家企業，從營收到最後產出每股盈餘（EPS）的整個過程。首先，台積電2017'
