  md: '# **1-5** 《選股法則5》

    **毛利率15%以上**


    如果只能從一項指標檢視公司產品是否具有競爭力，我會選擇看「營業毛利率」（以下簡稱毛利率）。毛利率是衡量獲利能力與控制成本能力的重要指標，通常一家企業的毛利率愈高，代表獲利能力與控制成本能力愈強，其公式為：


    營業毛利率 = (營業收入 − 營業成本) / 營業收入 × 100%


    從綜合損益表的角度來看，營業收入減掉營業成本等於毛利，毛利再扣除營業費用後，便是營業利益，而營業利益代表這家企業靠本業營運所賺取的利潤。當營業收入與營業毛利愈來愈多時，自然也就會促使營業利益向上攀爬，進而提高稅後淨利和每股盈餘。'
  merge: -1
  img_proc: true
