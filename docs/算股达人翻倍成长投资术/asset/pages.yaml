  md: '來的新高達 1 萬 1,270 點（還原權值後為 1 萬 9,281 點），而且元大台灣 50（0050）的年化報酬率約莫 6%，代表買進中鋼的長期投資績效，遠遠落後大盤與市場其他大部分的股票。


    因此，並不是長期持有就保證一定獲利，當你在不對的時間買進錯誤的股票，幾乎在開始就注定會以失敗收場。尤其像是營運前景難以預估的景氣循環股，我會盡可能在選股時就將它們排除在外，同時把目標鎖定在公司業務盡可能容易理解，又具備長期成長潛力的個股身上。


    # 投資法則摘要


    +   1. 盡可能避開難以評估未來前景的企業，以及產業受景氣循環影響的景氣循環股。

    2. 在不對的時間買進錯誤的股票，即便是長期持有，最後的結果也有可能是負報酬。

    3. 選股是投資能否成功最重要的關鍵，排除營運前景難以預估的企業，只把目標鎖定在公司業務簡單且容易理解，且具備長期成長潛力的個股身上。'
