  md: '估正確會大賺，預估錯誤會小賠」的標的。真正的贏家是當情勢對自身有利時下大注；當情勢不明朗或無法預估時，選擇離場觀望。


    「翻倍成長投資術」的原則並不是追求百分之百的投資勝率，能夠大賺小賠才是關鍵。如果以棒球來比喻，不要想著每一球都能擊出安打，而是應該等待一顆投手失投球，逮到機會大棒一揮，一次把球打出全壘打牆外。


    對於預估，你需要計算的不單單只是勝率，還要進一步思考贏的時候能贏多少？輸的時候又會輸多少？因此，你必須從機率的角度來思考。


    # 第 1 種投資機會 勝率 99%，但期望值為負數


    假設有個投資機會，投資 100 元，有 99% 可以獲利，只有 1% 可能賠錢，你會不會考慮投資呢？我想大部分人應該都不想錯過這樣的機會吧！但是，如果我進一步告訴你，獲利的金額是
    1 元，不幸賠錢的話，將損失 1,000 元，這樣的條件，你還會想要參加這場賭局嗎？答案可未未必。這個時候就可以透過期望值來計算（詳见表 1）。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '簡單來說，期望值是每次下注時，將獲勝機率乘以贏得金額，加上失敗機率乘以損失金額的加總金額。上述的投資機會在 100 次裡面有 99 次能賺取 1 元，
    但是其中有 1 次會讓你賠上 1,000 元。


    如果單純從機率的角度來看，你有 99% 的機會可以賺錢，可是，如果計算這次投資機會的期望值後發現是負值，代表每次賭局下注其實是賠了 9.01 元（99%×1
    元 + 1%×-1,000 元）。


    換句話說，假設下注 100 次，總共會賠 901 元。如果你參加這樣的賭局，長期下來，血本無歸幾乎是可以預料的事。


    # 第 2 種投資機會》勝率僅 70%，但期望值為正數


    假設有另外一個投資機會，你投資 100 元，有 70% 的機率可以獲利 1 倍，另外有 30% 的機率會損失 20 元，如果有這樣的賭局你會不會考慮進場呢？


    此案例的期望值為 64 元（70%×100 元 + 30%×-20'
