  md: '法則完整跟大家分享。


    雖然投資策略有很多種，也有各自的優缺點，但是，如果你問我最適合一般散戶的投資策略是什麼？我會毫不猶豫的告訴你，就是聚焦成長股。根據我的研究，股票能夠長期上漲最重要的原因，是受惠於企業獲利不斷的成長，因此，投資人只要能鎖定市場最具成長性的公司，就能無往不利。


    而「翻倍成長投資術」正是以發掘具備未來成長潛力標的為主的投资策略，它的優點是能夠在短時間內創造高報酬，而且追求高獲利的同時，風險卻比標榜高報酬的期貨、選擇權、權證等衍生性金融商品還要小得多！


    我在 2014 年準備開始寫第一本書的時候，我的大女兒才剛誕生不久，2018 年，我正在著手第二本著作之際，我已經是兩個孩子的爸了！從原本甜蜜的兩人世界，短短不到幾年的時間，變成一家四口的溫馨家庭。因此，本來的居住空間便顯得有點狹小，為了給家人更好的生活品質，我
    也在 2018 年買了新房子。'
