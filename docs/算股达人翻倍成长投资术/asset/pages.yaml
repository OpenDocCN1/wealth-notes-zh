  md: '# # 選股法則7

    ## 1-7

    ### 本益成長比低於0.75倍


    我剛開始投資股票的前幾年，績效並不突出，雖然花了很多時間研究，也看了不少投資人公認的經典著作，但是，即使我選對了股票，卻總是抓錯買賣時機，導致報酬率不如預期。後來我很認真思考，問題的癥結點到底在什麼地方，我發現最主要的一點，就是我不懂得該如何去評估一檔股票的真正價值。


    當你沒辦法了解一檔股票的真正價值時，所有的進出都會變成憑感覺。你會很自然用買進價作為一個衡量的標準，當股價高於你的進場價格時，你會很高興自己做了一個正確的投資決策；當股價低於你的進場價格時，你會很懊悔自己做了一個錯誤的投資決策。其實，你進場的價格只能夠代表你的持有成本，與其他投資人以及股價的未來走勢，並沒有什麼直接的關聯。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '很多投資人很喜歡設停利點，他們習慣以買進的價格作為基準，當股價漲幅達到一定的百分比，例如：20%、30%時，就選擇獲利出場。這樣的投資策略其實有瑕疵，我看過很多賠錢的投資人（包括剛進股市前幾年的我），之所以失敗的最主要原因是「設停利而不設停損」，結果就是獲利有限，但是一次看錯，就會把過去累積的獲利全數繳回。


    真正的市場贏家恰好相反，他們盡可能設停損而不設停利，採取這種方式的好處在於，持續放大獲利部位，並且把虧損控制在最小的範圍，自然能夠大賺小賠，虧損有限，獲利無限。


    # 從「祖魯法則」取經，用本益成長比改善績效


    我不否認股神巴菲特（Warren Buffett）、查理·蒙格（Charlie Munger）、德國股神科斯托蘭尼（André Kostolany）等世界級的投資大師們，他們精湛投資智慧與邏輯觀念深刻影響了我，套一句巴菲特說過的名言：「他（指蒙格）用思想的力量，讓我從猩猩進化成為人類。」'
  merge: -1
  img_proc: true
- pgno: 91
  md: '雖然正確的投資觀念與原則非常重要，但是，諸多大師的書籍中，對於該如何計算一檔股票的合理價格卻甚少著墨，甚至市面上所有標榜股神投資心法的著作，找不到任何一本是由巴菲特本人親自撰寫。直到我看到了《散戶兵法祖魯法則》書中所提及的「本益成長比（Price/Earnings
    to Growth Ratio, PEG）」公式，並且將此公式融入到我的選股策略、成為核心操作法則後，我的投資績效才開始明顯攀升，終於擺脫投資初期無法順利獲利的窘境。


    《散戶兵法祖魯法則》一書，出自有「英國巴菲特」之稱的成長股投資大師吉姆·史萊特（Jim Slater）之手，他的投資風格是聚焦小型成長股，強調集中持股。《散戶兵法祖魯法則》的原文書籍在
    1992 年初次出版，史萊特在序言中提到：「50 年來，小型股的漲幅遠遠超過大盤指數（指英國股市）高達 8 倍以上。」而本益成長比正是發掘小型成長股的絕佳公式。其公式如下：


    本益成長比＝本益比 ÷ 預估未來稅後淨利成長率


    本益成長比的公式本身並不困難，投資人只要計算出本'
  merge: -1
  img_proc: true
- pgno: 92
  md: '益比與未來淨利成長率，就能算出來，因此，我們應該要進一步理解「本益比」（Price-to-Earning Ratio，PE）的意義。


    本益比是許多投資人用來評估股價的基本依據，我剛進股市的前幾年也是如此，記得當時常常聽到電視上一些分析師似是而非的說法，比方說，「因為是科技股，所以享有 30
    倍的本益比」；又或者，「因為是熱門生技股，所以 40 倍的本益比也不算貴」；不然就是，「因為屬於傳統產業，所以本益比不超過 10 倍」。我剛開始聽到這些說法時，覺得似乎滿合理，後來認真思考，發現這樣的邏輯有盲點。


    # 高本益比與產業別無關，獲利具成長性才是關鍵


    本益比是股價除以每股盈餘（EPS），意思就是指，本金與收益的比值。本益比愈高，預期回收資金的速度愈慢。有些公司之所以能夠享有 30 倍的本益比，有些公司只有
    8 倍，主要原因是市場預期 30 倍本益比的公司，未來獲利有望大幅成長，看重的是它們未來的成長性。'
