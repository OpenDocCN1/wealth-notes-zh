    | 總計 | 100% |

    資料來源：《下重注的本事：當道投資人的高勝算法則》


    我的建議如下，如果你的資金在 100 萬元以內，持股不要超過 5 檔股票；如果你的資金在 500 萬元以內，持股不要超過 8 檔；如果你的資金超過 1,000
    萬元，持股 10 檔即可。因為持有的股票檔數不多，所以每檔都應該更精挑細選，試著找出市場中最具成長潛力的個股。對於想追求優異報酬的投資人，我建議選擇集中持股。對於資金不多又想加快獲利速度的投資人來說，採取集中持股策略是不二法門。'
