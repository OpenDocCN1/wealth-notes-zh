  md: '# Chapter 5 匯集 10 年經驗 解析經典案例


    接著，在中國昆山經過正新的工廠，看到 NBA 前籃球明星姚明的巨幅廣告，下方印著大大的「MAXXIS」（瑪吉斯）商標，讓我印象非常深刻。


    回到台灣後，我開始著手研究這家公司。正新輪胎成立於 1969 年，是相當老牌的傳統產業，在 1991 年即到中國設廠，算是首批進到對岸的台商之一。公司的銷售品牌主要以正新輪胎與
    MAXXIS 品牌為主，MAXXIS 品牌連續數屆蟬聯台灣十大國際品牌，並成為中國汽車輪胎市場市占率最高的輪胎公司（當時市占率大約 12%～13%）。隨著中國車市的蓬勃發展，正新也跟著雨竦均霑，躋身全球前十大輪胎公司之林。


