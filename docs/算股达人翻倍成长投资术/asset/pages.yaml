  md: '元，當股價來到 100 元時，你可以使用分批賣出的方法，100 元時先賣出一部分，往上漲後再賣出一部分，再往上漲則脫全套部的持股。分批出場的次數可以視資金部位的大小而定，建議分成
    3 份至 5 份的方式分批出場。換句話說，資金較少者，可分為 3 份出場；資金較多者，可分為 4 ~ 5 份出場。


    不過，值得注意的是，很多時候股價的強勢大漲，都是伴隨企業的獲利大幅成長，或對未來的展望正向樂觀，因此，投資人應該每隔一段時間，就重新檢視企業的營運狀況。如果上漲是來自於超高的盈餘成長率，或許有需要進一步上調目標價；如果上漲只是單純因為市場買盤而推升股價，我會選擇落袋為安，先把資金抽離，等股價拉回再伺機進場，或把目光放在下一檔有成長潛力的標的。


    # 時機 2》預期公司未來的獲利衰退


    當你做好萬全準備後買進一檔股票，但是公司的獲利卻不如預期，甚至出現衰退的情況，就必須立即重新檢測手上的持股，必要時甚至要盡快脫股，以降低損失。'
  merge: -1
  img_proc: true
- pgno: 202
  md: '會出現這樣的狀況，大致可以分為兩種情形。第一種是買進決策在一開始就錯誤，你可能漏掉了某個重要環節，導致你對企業的前景過度樂觀，也可能是因為股價的大漲讓你對於公司未來展望過分充滿信心，而做出錯誤的判斷。這時候應該要選擇出脫持股。股神巴菲特（Warren
    Buffett）說過：「如果你不打算持有一檔股票10年，那麼你一刻也不要擁有。」因此，即便是虧損，也必須毫不遲疑的忍痛停損。


    第二種是持有股票有一段時間，過程中，公司的獲利狀況在預期之中，股價也反映利多而持續上揚。直到某一天，公司的獲利不再成長，這時候投資人就應該將握在手中的獲利出脫，不要戀棧。


    但是，要特別注意的是，投資人必須謹慎評估獲利的下滑只是影響單一季度，還是未來的營運都會受到衝擊？比方像是匯兌損失、保留盈餘稅、季節性的營收衰退、產品開發投入生產機台，導致折舊攤提影響毛利率等等，都是屬於短期因素，對企業長期的營運展望不至於產生太大的影響。'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# Chapter 4

    擬定投資策略 奠定致勝基礎


    如果是因為市場需求明顯下滑、出現強而有力的競爭者、公司業務與未來環保法令背道而馳、產業出現削價競爭、公司產品被更新穎的服務取代等，同様に利空消息，影響層面就大不相同，對應方式也不相同。


    上述這些都是屬於重大的利空事件，評估過後，如果投資人認定會對公司的營運帶來長期深遠的影響，建議一定要盡快出場。


    # 時機 3》找到更有潛在獲利的標的


    有人說買股票就像是選美比賽，環肥燕瘦統統有，而每個人的目標都一致，就是要選出裡面最美的佳麗。意思是說，買股票要買最具未來成長潛力的個股，只有最強的股票，未來的潛在獲利才會最高。


    因此，每隔一段時間，我會搜尋市場上，是否還有其他尚未被發掘且更具潛力的股票，並且與手中的持股做比較，如果計算後發現，其他股票有更高的盈餘成長率，就會考慮換股操作。'
  merge: -1
  img_proc: true
- pgno: 204
  md: '換股的目的，是要讓資金有更靈活的運用。畢竟散戶的資金不多，要想辦法讓資金效應極大化，盡量在最短的時間內，追求投資報酬率的增加。


    而換股操作是賣出股票的 3 個條件中最難的一個，因為從歷史經驗來看，完美的換股操作是有難度的。有句台灣俗語是「捉龜走鱉」，意思是顧此失彼，手中已經抓住了鱉，卻又想要抓烏龜，結果為了抓龜，不小心讓鱉給跑了，到最後落得兩頭空。


    換股操作有時候就會碰到這樣的問題，當你發掘到一檔新的潛力股，打算換掉手上表現相對平庸的股票時，往往會發生賣出的股票沒多久後開始拚命漲，而換來的股票反而長時間處於股價文風不動的窘境。


    遇過幾次市場的教訓後，我逐漸減少換股，除非有相當的把握，否則盡可能維持原來的持股。有時候看著別人的股票一直上漲，自己手上的股票卻一動也不動，就會興起想換股的念頭。但是，投資有時候是一場耐力賽，獲利需要等待，不要單純因為股價沒漲而換股操作，只要獲利持'
  merge: -1
  img_proc: true
