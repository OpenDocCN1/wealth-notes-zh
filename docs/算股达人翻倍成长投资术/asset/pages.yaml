  md: '# 升級版的成長股高手


    從一位美術設計，變成一位投資高手，陳喬泓如何彌補其間的差距？不是靠學院裡的專業知識，而是靠勤於閱讀與貼近市場脈動。


    相隔兩年，陳喬泓出版第二本書，同樣奠基於以上兩項基礎，並且精益求精。新書中，他受到知名基金經理人約翰·聶夫（John Neff）的啟發，加入對現金股利的重視，將其列為重要選股條件，因為現金最難造假，企業帳面上的獲利容易灌水，但是要能年年發現金股利給股東，甚至年年提高現金股利，這必須要是卓越企業才能辦到。


    本書中提出的8大核心選股法則，有5項都跟公司經營基本面有關，而且是根據實際可得的數據，例如：股東權益報酬率高過15%、毛利率高過15%。前者可以看出公司'
  merge: -1
  img_proc: true
- pgno: 6
  md: '運用資本的效率；後者可以看出產品的競爭力。有些公司的產品很有競爭力，但是經營風格偏保守，經常保留較多的現金在手，導致明明是家好公司，又有好產品，不過，股東權益報酬率卻稍低，雖然這有助於降低風險，特別是在景氣大衰退或金融風暴時期，另一方面，這類公司的股價通常比較溫吞，不容易達成作者期望的高倍數漲幅。


    有些公司的股東權益報酬率還不錯，但是產品毛利率不高，這樣的公司並非一定不好，不過，可能有兩種潛在問題：其一是較高的股東權益報酬率可能是靠積極的財務槓桿得來，雖然我們不希望公司經營得太過保守，導致資本運用的效率太差，但是，我們更害怕公司經營得太過積極，運用過大的財務槓桿，一旦景氣發生逆轉或金融風暴，有可能意外引發公司的財務危機。其二是如果產品的毛利率偏低，容易被大環境的因素所拖累，譬如市場爆發激烈的價格競爭，或匯率大波動造成的匯兌損失等，有可能瞬間吃掉公司大部分獲利。


    因此，在檢視好公司時，如果把條件設得嚴格一點，選到好股票會變得困難，可是相對會讓投資風險降低。身為'
  merge: -1
  img_proc: true
- pgno: 7
  md: '股東，對公司管理層「苛薄」，就是善待自己的錢包；如果對公司管理層太體貼，則是跟自己的財富找麻煩。


    作者也循循勸誘，想成為投資贏家的讀者，要學會「忍」！不符設定條件的股票，絕不輕易出手，一旦買進後，更要學會忍，因為好股票的高報酬是靠「抱」出來的。作者在本書中，不僅教你投資技巧，更教你心理建設，尤其他一再提醒：任何投資都沒有百分之百的勝算，只要能做到大賺小賠，你就能成為下一個投資贏家。


    《Smart 智富》月刊社長'
