  md: '# Chapter 2

    掌握公司錢脈 確保獲利前景


    # 投資法則摘要


    +   1. 公司大致可以分為 3 種：太過複雜、難以預測、簡單易懂。台股有 1,600 多檔股票，你不需要全部都懂，只要找出自身擅長的領域，投資自己有能力看懂，並且能深入研究的股票即可。至於太過複雜、難以預測的產業／個股，一概不碰。


    +   2. 傳產類股相較於科技類股的產業變化較小，因此，在預估產業前景時顯得比較容易。


    +   3. 科技產業雖然波動較大，但是也並非毫無優勢，只要公司的商品在產業中具備競爭力，或者營運規模遠勝於競爭者，就有機會享受高額利潤。'
