- pgno: 209
  md: '# Chapter 4

    擬定投資策略 奠定致勝基礎


    在闡述我對停損的看法之前，我們先來看一張圖表，圖2 是每位投資人在思考是否要停損時，都應該要先釐清的觀念。


    假設有一檔股票，小明因為看好公司未來的發展，在股價 20 元的時候買進，之後股價上漲至 30 元，算一算小明已經獲利 5 成。此時，小英也看上了同一檔股票，並且在
    30 元的價位進場，只是買進後，股價沒有如預期之中持續上漲，反而是迅速回跌，股價一路從 30 元跌落至 24 元，換算跌幅也已經高達 20%！


    如果你是小英，請問你會不會選擇停損呢？如果答案是肯定，小英需要停損出場，我就想再請問，小明是否也應該在還保有獲利的情况下停利出場呢？如果你的答案是否定，原因是小明目前還有獲利，不需要急著賣出，一旦你這麼想，就代表你在停損的邏輯上是有盲點。


    小明與小英持有同一檔股票，差別只是在於進場的價位不同。但是，企業的本質是一樣，不會因為她是小英，所以股利減半，也不會因為你叫小明，所以股利加倍。一樣'
