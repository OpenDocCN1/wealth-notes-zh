  md: '# ## Chapter 3




    也一度很困擾應該採取哪種投資策略？後來我決定選擇以基本面分析為主的成長股策略。


    我會選擇基本面分析，最主要的原因是因為「邏輯」。我覺得一檔股票最終能不能上漲，還是取決於企業的獲利能不能持續成長，這是最重要的關鍵。但是，這不代表我認為為技術面分析就一無可取。紀律良好的技術派投資人，我相信一樣能在市場中創造豐厚的利潤，差別只是在於，並不是每位投資人都適合用技術面分析。不過，不要因為覺得自己不適用，就完全否認它存在的價值。


    如果一個策略經過市場不斷的測試後，證明成功的機會大於失敗的機會，就是一個有效的策略，哪怕是屬於技術面分析，同樣也是一個好的策略。雖然台股有超過 1,600
    檔的股票，但是，如果你仔細觀察股票的走勢就會發現，絕大部分的個股都有某些共同性，而這些相同之處往往傳達出一些訊息，告訴你股價未來的走勢。


    根據我的經驗，有 3 種主要型態的走勢，顯示未來股價很有機會上漲。當你從「翻倍成長投資術」中發掘到符合'
