    只要你嚴守「翻倍成長投資術」，謹記其中8大核心選股法則，在不符合條件的情況下絕不輕易出手，但是，只要發現符合條件的投資標的，買進之後絕不要輕易出場，我相信你就有機會選到股價伴隨獲利飄漲，且價值遭受低估的個股，享受獲利翻倍上漲的喜悅！'
