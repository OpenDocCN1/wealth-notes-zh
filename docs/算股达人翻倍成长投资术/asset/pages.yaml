  md: '# 投資成長股是創造高報酬的捷徑


    每位投資人都想在股市中獲利，而投資方法百百種，有的喜歡長期持有、有的擅長波段操作、有的只看技術面分析、有的著重基本面選股，甚至有人只玩指數期貨或沉迷於短線當沖。雖然大家可以選擇的投資項目與操作策略眾多，但是，在我看來，能長期創造獲利的方法其實有限。


    如果你問我，哪種投資策略能夠創造高報酬，同時適合大多數的投資人呢？我會毫不猶豫地告訴你，買進成長股！不過，為了可以完整地回答這個問題，我先說一下我的投資故事：


    2005 年服完兵役後，我懷抱著滿腔熱忱，準備一展長才，面臨的卻是台灣經濟開始走下坡。我寄了數十封履歷，全都無疾而終，花了好幾個月的時間，最後好不容易在一'
  merge: -1
  img_proc: true
- pgno: 14
  md: '家電子公司，找到了一份美工設計的職缺。雖然不是領 22K，但是也只有32K，扣掉日常開銷與補貼家用後，能存下來的薪水非常有限，再加上工作性質一成不變，我幾乎可以預見，如果我持續在那裡工作，經過10年、20年後，熱情消磨殆盡的模樣。


    經過審慎思考後，我決定改變。有一天，我逛書店時隨意翻閱一本投資書，其中一段話說：「一個人要致富有兩個方法：一是投資自己、一是投資理財。」而投資理財致富的祕訣就是投資股票，只要把握低點買、買好股票、波段操作的原則，每年獲利超過20%不是難事。我站在書店，心想或許有機會一搏！


    因此，我毅然決然辭掉工作，那年我才28歲。離職後，我一方面投入當時正熱門的創意市集行列；一方面則打算開始投資。但是，因為我的口袋只有3萬元，買一張股票可能就超過預算，所以我說服家人，共同集資20萬元，開始我的投資生涯。


    我是在2006年進入股市，剛開始沒有什麼技巧可言，只'
