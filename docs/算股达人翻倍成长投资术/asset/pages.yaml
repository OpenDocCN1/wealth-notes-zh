    富邦證券開戶，你就可以免費取得富邦證券的研究報告；如果你在凱基證券開戶，你就可以免費取得凱基證券的研究報告，建議投資人可以同時在 3～4 家不同的券商開戶，這樣就能盡可能獲取更多不同券商的研究報告。


    除此之外，你也可以成立投資群組，透過現在很方便的即時通訊軟體，找幾位志同道合的朋友，大家彼此相互交流，互相分享對個股的研究心得或不同券商的研究報告。除了法人的研究報告之外，其他像是企業年報、個股新聞、網絡上達人的研究分享等，都是提供我們能進一步收集線索的重點資訊。


    關於預測，我很喜歡一句投資諺語，它是這樣說的：「你必須盡可能大致的對，而不是精確的錯。」當你的功課做得愈足，未來出錯的機率就愈少。我承認，預估是一件不容易的事，但是，透過正確的邏輯加上經驗的累積，可以愈做愈好。


    我不太相信天下有白吃的午餐，也不覺得有不用付出就有保證獲利的投資祕笈，我相信的是「有耕耘才有收穫」，'
