  md: '# Chapter 4

    導言


    當你學會如何挑選好股票，並且懂得等待合理股價買進時，恭喜你，代表你已經對了一半。如果使用「翻倍成長投資術」是滿分100分的習題，你已經獲得50分的基本分數了；剩下的50分，主要是投資策略的活用。


    關於投資策略的活用，投資人最想知道的莫過於「應該何時賣出股票」？投資界有句諺言：「會買股票是徒弟，會賣股票才是師傅。」意思是說，買股票人人會，但是，能夠在高點脫持股並保有獲利，才是真正的高手。


    確有其道理。當你買進一檔上漲的股票，其實只是對了一半，在正確的時機獲利了結，才是完美的結果。記得我在2009年買進自行車龍頭巨大（9921），當時尚未掌握到評估合理股價的技巧，僅僅持股不到3個月，波段賺了20%就獲利了結。


    在我悟出成長股的買賣訣竅後，2011年買進的美利達（9914），持股約3年，成功在翻倍上漲後陸續獲利了結。雖然美利達之後又漲了約20%，但是我已經獲得總報酬率逾350%的成績。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '由此可見，適當的掌握賣出時機，產生的獲利結果是難以想象的。本篇章我將根據自己投資的實戰經驗，歸納出最佳的停利時機。我們不追求每檔股票都能賣在最高點，那是不切實際的想法，只要能夠盡可能在一個大波段的漲勢中，賣在相對高點就可以了，其實這就是一次趨近完美的表現。


    當然，即使做了再多的研究，也有可能遇到判斷失準，或企業突然發生無法預測的危機，此時，我們也要懂得當機立斷，做出停損的決策，將可能的損失降到最低。


    另外，我也將在篇章分享「翻倍成長投資術」應該如何進行資金配置，才能獲得最佳效益。還有，本書第一篇曾經介紹以「本益成長比」評估成長股的合理股價，我再告訴你，對於那些獲利並未高速成長，但是長期營運穩健且獲利溫和成長的績優股，該如何用「總報酬本益比」來評估適合買進價位。'
