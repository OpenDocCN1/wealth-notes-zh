    表會、公司年報中的董事長「致股東報告書」，以及打電話或寫信請教公司發言人等，透過多方管道，以掌握公司最新的營運狀態。


    # 法人研究報告》了解外資機構看好或看壞理由


    我很喜歡看小說，尤其是推理小說，我常覺得挖掘一檔潛力股的過程，跟推理小說中找出兇手是誰有異曲同工之處。當你手上握有的線索愈多，你的判斷力愈精準。因此，在推理劇裡的私家偵探或刑警，總是不厭其煩、不眠不休地找寻破案線索，深怕在某處遺漏掉某個關鍵細節，就永遠解不開最後的謎底。


    投資股票也是一樣，當你對一家企業研究愈仔細，對於公司未來的營運發展自然愈有把握。因此，在你準備進場之前，一定要做足功課，盡可能多方收集公司的情報，唯有如此，才能提升預估未來獲利的精準度。


    身為一位散戶，其實我們沒有太多的機會能拜訪公司，也不太可能有機會與企業高層面對面詳談，這時候，法人'
  merge: -1
  img_proc: true
- pgno: 138
  md: '的研究報告就可以派上用場。台股中有不少國內外法人機構，會定期推出個股的研究報告，這些資料通常是透過研究員第一線拜訪公司所完成的研究心得。當你閱讀研究報告時，不但可以得到該公司更深入的解析，也能看到研究員對於該公司未來發展的主觀評價。


    因此，當我在研究一檔股票時，首先我會確定該公司的產業或商品是否具備長期趨勢，接者再傾聽經營者對未來營運的說法，最後盡可能多方收集公司的研究報告。不過，值得注意的一點是，別太在意報告裡的目標價數字，不同的券商對同一檔股票的看法也常常大相逕庭，重點應該放在研究員看好（或看壞）這檔股票的理由？至於目標價，參考就好。


    閱讀研究報告主要的目的是獲取未知的資訊，例如：預計全年的展店家數、擴廠計畫的時間表、新產能預期能增加多少營收等，只要是對於公司未來獲利成長有實質貢獻，都是我們必須關注的重點。


    至於要如何取得法人的研究報告，一般來說，如果你'
