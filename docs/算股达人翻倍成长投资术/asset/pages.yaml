    註：本圖作者為丹麥心理學家Edgar Rubin 於 1915年的論文〈Synsoplevede Figurer〉所提出


    圖1為經典之作「魯賓之杯」（Rubin’s  Vase），請問你第一眼看到了什麼？是白色的杯子，還是兩張黑色的側臉？停損也是相同的道理，端看你最在乎的是風險，還是未來的報酬率。每位投資人的選擇不盡相同，重點還在於你從什麼角度切入。


    如果你問我會不會停損？先說結論，我覺得要停損。不過有個但書，就是不為單純股價下跌而停損。'
