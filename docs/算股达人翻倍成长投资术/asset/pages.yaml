    有了再生-KY 的失敗經驗，之後我就很少投資「KY 股」，直到 2017 年 4 月進場買了綠悅-KY（1262），平均成本約在 168 元左右。我注意到綠悅-KY
    已經有一段時間了，公司從 2014 年 1 月掛牌上市後，營運狀況一直很穩定，每股盈餘（EPS）已經連續好幾年都維持在賺一個股本之上，毛利率、ROE 的表現也在水準之上。


    根據我的研究，綠悅-KY 為中國最大的 BOPA（雙向延伸尼龍薄膜生產商），中國市占率將近 5 成；產品廣泛應用在食品包裝、醫藥包裝、電子材料包裝，主要客戶包含統一（1216）、康師傅等。'
