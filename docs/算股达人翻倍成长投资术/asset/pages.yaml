- pgno: 115
  md: '# Chapter 2

    導言


    懂得如何預估公司的未來淨利成長性，是「翻倍成長投資術」8 大核心選股法則中最關鍵的項目。當企業擁有強勁的獲利成長力，自然會吸引買盤湧入，股價就能一路上升。


    挑對股票，只能說是好的開始，更重要的是，在公司獲利持續成長期間，能堅定信念、持股續抱，才有機會享受股價大波段的上漲，讓資產水漲船高。因此，不管在買進前或持有期間，投資人都應該對公司的經營績效保持關注，才能知道何時該買進、何時該賣出。


    在思考公司的未來淨利成長性時，投資人一定要知道「這家公司主要靠什麼賺錢」？屬於何種產業？產業有沒有持續性與成長性？在同產業中是否具備強大的競爭力？消費者是否會長期依賴公司的產品或所提供的服務？


    而我們評估的標準有：未來幾年，企業的產品是否能創造更多的營收與淨利？市場是否持續供不應求？是否可能陷入殺價競爭的危機？一旦遭遇經濟衰退是否有能力安然度過等，唯有找出這些問題的答案，我們才有可能進一步去預估公司的淨利能否逐年成長，以及成長的幅度有多大，'
  merge: -1
  img_proc: true
- pgno: 116
  md: '也才能計算出未來可能的每股盈餘（EPS），以估算合理的買賣價位。


    本篇章主要是延續 1-8 的內容，提供我對於如何提高預估未來淨利的做法，並且用一整個章節做最完整的解析。我會分享我是如何留意到獲利可能高度成長的股票、所偏好的產業類型，以及為什麼會盡量避開某些產業。


    此外，投資人雖然比較難以取得公司與產業的詳細資料，也不容易有機會與企業高層深入訪談，但是，投資要成功，並非一定要鉅細靡遺了解每一個細節，而是透過一些免費的公開資訊，過濾出對投資決策有用的數據，真正的重點是掌握關鍵的思考方向。我建議，散戶可以從長期趨勢、公司高層說法、法人研究報告等
    3 大方向著手，進一步提高預估未來淨利成長性的成功率。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# ## 2-1 專挑簡單易懂公司

    提高投資勝率


    想要預估未來公司的淨利能否持續成長，「選股」可以說是決定預估成敗的關鍵。根據股神巴菲特（Warren Buffett）的說法，我認為，公司大致可以分為三種：第一種是「太過複雜」、第二種是「難以預測」、第三種是「簡單易懂」。公司業務太過於複雜的股票不碰、公司前景難以預料的股票不買，因此，我只投資自己看得懂，並且能深入研究的標的。


    台股上市櫃股票共超過 1,600 檔，我長期關注的名單大約只有十分之一，大多數的企業對我來說，不是公司業務太過複雜，就是營運前景無法預估。


    對於超過我能力範圍的股票，即便它的營收、獲利或股價屢創新高、企業的未來前景看似大好，我也不會貿然進'
  merge: -1
  img_proc: true
- pgno: 118
  md: '場，取而代之的是，我會選擇我能理解的經營模式，通常是公司業務相對單純，組織架構與轉投資不複雜，同時專注於本業發展的企業。符合這樣條件的公司，才是我主要的投資標的。


    # 傳統產業變化較小，相對易於預估產業前景


    在選股方面，我個人偏好傳統產業。據我自己的統計，在過去逾10年的投資經歷中，有超過7成的獲利是來自於傳產類股，主要的原因是，相較於電子股，傳產類股的產業變化相對較小，因此，在預估產業前景時會顯得比較容易。


    電子類股的缺點在於產業前景變化快速，而且競爭者眾多。我之前曾經聽過，一位上市企業的高層在分析電子產業的競爭態勢，他指出，一個電子產品的生命週期只有18個月，如果在新品發售後的18個月內，公司無法再創造出比之前更新穎、更吸引人的產品，公司的業績就會開始走下坡，智慧型手機大廠宏達電（2498）就是一個血淋淋的案例。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# Chapter 2

    掌握公司錢脈 確保獲利前景


    雖然電子類股的產業波動大，但是，並非沒有優點，只要你 的產品能成為產業中最具競爭力，或者營運規模已經把競爭者遠遠拋在腦後，就可以享有高額的利潤，例如：股王大立光（3008）與台股市值最大的台積電（2330），都是產業中的佼佼者，坐擁豐厚的盈利。


    # **投資自身擅長產業，將比他人更接近成功**


    虽然我个人的选股方向以傳產類股为主，但是，並不代表你必須跟我一樣，畢竟每個人的能力範圍不同，我之所以少碰電子股，是因為有些產業已經超出我的能力圈之外，我自認為沒有足夠的把握能夠完整分析。


    舉例來說，當我在研究電子檢測驗證服務廠宜特（3289）時，翻閱年報時發現它有一個專業技術稱為「二次離子質譜（SIMS）分析技術」：在樣品通過使用一次離子進行濺射／蝕刻，在濺射過程中形成的二次離子，利用質譜儀來進行分析。主要是利用離子高靈敏度的特性，針對樣品的微汙染，摻雜與離子植入的定量分析，以及介面擴散行為的研究，均具有高解析的偵測能力。'
  merge: -1
  img_proc: true
- pgno: 120
  md: '說實在，因為我對電子業幾乎一竅不通，所以我沒有能力分辨二次離子質譜分析技術與其他的技術有什麼不同，也無法分析宜特的技術和其他公司的技術到底有何差異？但是，如果你是電子科系畢業，或者你剛好任職於相關產業，分析
    SIMS 對你來說，可能只是輕而易舉的事。另外，如果你剛好是從事生技醫療產業，你對於產業的了解程度，肯定優於其他投資人，而這就是你的能力範圍，也是你有別於其他投資人的獨特優勢。


    每個人的專長與所學不盡相同，那些對我來說複雜又難懂的產業，對你來說或許只是小菜一碟罷了，因此，股票是否太過複雜或簡單好懂，絕大部分是因人而異，重點是在清楚認知自己的能力範圍。畢竟台股有超過千檔的股票，你不是股市分析師，不需要每一檔都懂，反而應該要把眼光集中在少數幾檔你深信具有信心的股票上，深入研究並且伺機買進，就已經足夠了。'
