- pgno: 223
  md: '曾經有一段時間，我手中最主要的核心持股只有 3 檔，分別是儒鴻（1476）、美利達（9914）與寶雅（5904）。當時它們都具備一些共同點，例如：本益比不高、絕佳的盈餘成長率等，那幾年它們的漲幅都以倍數計算，加上我的投資組合是採取集中持股的方式，因此資產報酬率累積超過
    300%，讓有限的資本能在短時間內快速的增加，這就是集中持股的好處。在你看對股票且下大注時，累積獲利的速度就會很驚人。在配置成長股時，可以參考以下 2 個原則：


    # 配置原則 1》依看好程度分配不同資金比重


    理財暢銷書《下重注的本事：當道投資人的高勝算法則》的作者莫尼斯．帕波萊（Mohnish Pabrai）是帕波萊投資基金的創辦人，該基金的年化報酬率高達 28%，勝過
    99% 以上的基金與大盤指數。


    他在著作裡提到的「凱利公式」，是一種透過公式的計算，告訴我們如何在風險與獲利中，把握下注最大化的資金比率，也就是交易金額應該占你的投資組合多少比重，才能讓我們在最短的時間內，完成預設的獲利目標。'
