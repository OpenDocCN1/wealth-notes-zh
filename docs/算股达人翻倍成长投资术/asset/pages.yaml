    至於如何提升預估企業未來淨利的精準度，我會在第 2 章做完整的解析，包括選股的正確思維與從 3 大方向提高預測準確性等，就讓我們繼續看下去。


    # ## 投資法規摘要


    +   1. 即便企業過去連續好幾年的淨利都能大幅成長，也無法保證未來一定還能繼續保持成長。

    2. 想成為長期股市贏家，並非追求每一次都能夠精確的預測，即便是史上最偉大的投資大師也會有看走眼的時候。

    3. 重點在於找到定價錯誤的商品，看對方向大賺，看錯方向小輸，才是成為市場贏家的關鍵。'
