- pgno: 128
  md: '# ## 2-3 從 3 方向著手 提高預估公司獲利準確度


    預估未來淨利是「翻倍成長投資術」最重要的選股法則。當我們從台股 1,600 多檔標的中，篩選出少數幾檔符合我們選股標準的股票後，如何進一步預估公司未來淨利能否持續成長呢？雖然前文有提到，預估無法做到百分百的正確，但是，透過一些方法，確實能有效提高預估的準確度。根據我的經驗法則，我會從以下
    3 個方向著手：長期趨勢、公司高層說法、法人研究報告。


    # ### 長期趨勢》從日常生活中找出有用資訊


    通常一個趨勢的確立，短則數年，長則數十年，而投資股票最重要的地方，就是盡可能從一個長期趨勢做觀察，並且從中找出趨勢向上的產業，再從產業中挖掘具備成長潛力的個股。'
