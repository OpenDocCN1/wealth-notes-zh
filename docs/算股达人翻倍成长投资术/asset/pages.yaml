  md: '# ## Chapter 5

    匯集10年經驗 解析經典案例


    對於投資人而言，當我們想買進一檔股票，一定是透過公司的財報與發布的訊息來進行研究；如果這些可供評估的資料都是經過美化或刻意修飾，所有漂亮的財務數字與未來前景都只是精心營造的表象，最後可能只是成為引誘你上鉤的圈套。


    一家公司最重要的就是誠信，具備誠信的公司才是一切分析的基礎，沒有這個基礎，所有美好的營運前景都如夢幻泡影般，瞬間消失。


    為了避免之後重蹈覆轍，我的因應之道是，除非對公司高層的誠信釋疑，否則我會盡可能避開「KY股」，而且也不買剛上市櫃的股票。因為剛掛牌的企業，大多只會公開揭露最近1年的財報數據，能夠分析的資訊有限，加上還沒有經歷市場的考驗，所以我會選擇上市櫃時間至少超過5年以上的股票進行投資。


    即便如此，投資人能做到的只是降低錯誤的機率，不可能永遠一帆風順，有時難免會判斷錯誤。此時，你可以善用本書所提到的停損策略，在對公司存有疑慮時，果斷停'
  merge: -1
  img_proc: true
- pgno: 322
  md: '損，設法保住大部分資金，就能保有尋找下一次逆轉勝的機會。


    # 如何從錯誤中學到教訓，才是股市致勝的關鍵


    有人不投資是因為怕犯錯，其實，不投資才是最大的錯誤。人只要進入市場，無可避免一定會有犯錯，重點在於你怎麼從錯誤中學習到教訓，並且透過累積經驗，修正自身的錯誤，讓自己能持續成長。如何透過每一次的失敗，讓自己變得更強大，才是在股市常勝最重要的關鍵。'
