- pgno: 210
  md: '# 圖2 同一個價位，成本不同會影響停損決策

    停損的思考邏輯


    ![](img/50b1995559bd46ec98838747be73f36f_210_0.png)


    的企業，如果小英需要停損，為何小明不需要停利呢？因此，不要單純因為股票下跌就賣出股票，我認為真正需要停損的理由，是你一開始買進股票的理由已經消失，這才是你需要把股票賣出的唯一理由。


    沒有人喜歡停損，當你在考慮要不要停損時，代表你已經在思考如何把虧損控制在最小的範圍內。除了金錢上的'
  merge: -1
  img_proc: true
- pgno: 211
  md: '損失之外，也代表你承認這是一次失敗的投資決策。偶爾看錯是正常的事，但是，如果你經常停損，可能是選股策略有瑕疵，久而久之，也會對自身的投資信心產生動搖。


    我個人很討厭停損，因此，我會盡可能做好完善的買進決策，避免持股遇到停損的難題。一旦遇到需要停損的時候，我還是會二話不說盡快處理，事後再回頭來看，絕大部分在當下所做的停損決策都是對的。既然沒有人能避免停損，就應該盡可能讓停損所產生的殺傷力降到最低，因此，我覺得可以從以下
    4 個原則著手：


    # **原則 1》當初買進股票的理由消失**


    當你準備要買進一檔股票時，一定是看好公司的某些優勢，可能是預期獲利能持續成長，或許是產業穩定的龍頭地位，又或者是現金股利逐年提高等，總是有幾個你看好的理由，而這些條件就是促使你買進股票的主要原因。


    假設在你持有股票的某一天，發現以下狀況：公司營收開始大幅衰退、遇到強而有力的競爭對手、股利配發大不'
  merge: -1
  img_proc: true
- pgno: 212
  md: '如前等，只要當初買進的理由消失了，不管帳面是否有獲利，即便是虧損，也應該停損出場。


    股票下跌的理由有很多，但是，賣出的理由只有一個，就是企業的營運狀況開始走下坡，除此之外，都不是停損的理由。不要因為市場悲觀氛圍所造成的股票下跌而輕易出脫持股，只有原始買進理由消失，才會是你需要停損的惟一理由。


    # 原則 2》謹慎選擇進場點，不在高本益比時進場


    想要減少停損的次數，最重要的就是在買進前就先做好萬全的評估，並且審慎選擇進場點；唯有控制決策品質，才能有效減少停損的次數。


    以上述小明和小英買股的例子來看，同樣一檔股票，在兩個不同的時間點，分別以 20 元和 30 元進場，結果大不相同；當股價跌到 24 元時，一個仍然保有 20%
    的獲利，另一個則是虧損 20%。當然，如果公司長期競爭力無虞，下跌只是暫時的回檔修正，隨時有機會反轉向上。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '# Chapter 4

    擬定投資策略 奠定致勝基礎


    但是，不可否認，在 20 元就先行進場的人，在心態與策略上，會比在 30 元才追價買進的人更遊刃有餘。首先，50% 的價差就擺在眼前，即使之後面對股價下跌，何時出場也只是賺多賺少的差別；再者，相較於追價者必須思考停損或攤平的心理壓力，底部進場者反而可以從容不迫的選擇停利或逢低加碼，心態上大不相同。


    最好的方法是盡可能不以過高的價格去追逐股票，即使企業近期的財報數據驚人，也不建議用太高的本益比買進。尤其是短線急漲速度驚人的強勢股，更是隨時有回檔的風險，寧可多花一點時間等待，也不要貿然追價。


    # 原則 3) 適度分散持股，切勿重壓一檔標的


    投資想要成功，EQ（Emotional Quotient）會比 IQ（Intelligence Quotient）更加重要。所謂的 EQ 是指情緒商數，是一種控制自我情緒能力的指數。優秀的投資人通常具備較高的
    EQ，不會隨著市場的上下波動而讓自身的情緒起伏不定。當股票大漲，不會因為過於興奮而衝動進場；當股票大跌，也不會因為悲觀心情而恐慌殺出。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '不過，並不是每位投資人都有高 EQ，雖說可以透過後天的學習，精準察覺自身的情緒，並且適當的控制和管理，但是，要知道自己能承受多大的壓力，不做超出自身能力範圍的舉動，才是在股市裡持續累積財富的重點。


    比方說，融資買股票，很多人只想到透過槓桿來加快自己累積財富的速度，卻忘了過度槓桿操作，需要承擔極大的風險；因為當情勢不利於你的時候，所產生的壓力，會讓你無法做出正確的判斷。看對固然好，萬一看錯，可能會造成難以挽回的下場。


    同樣地，我也不贊成只單壓一檔股票的操作方式，除非你的心臟夠大顆，否則比較恰當的做法，還是應該適度分散持股。單獨投資一檔股票，除了沒有做到投資組合的平衡之外，也容易因為情緒壓力而做出錯誤的決策。


    當你孤注一擲時，一旦股價下跌 30%，你帳面上的損失就是 3 成。可是，如果你持有 5 檔不同的標的，其中一檔下跌 30%，其他 4 檔則穩定持平，此時你的帳面損失只有
    6%，壓力也相對少了許多。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '# Chapter 4

    擬定投資策略 奠定致勝基礎


    每位投資人的情緒管理與對抗壓力的能力都不同，有的可以忍受股價下跌 5 成；有的卻連跌 5% 都難以忍受。我有一位朋友，完全不能接受自己的本錢有一分一毫的損失，因此，他把所有的錢都存在銀行，只領取微薄的利息。當然，這麼做沒有對與錯，只要找到適合自己的方法，就是好方法。


    持股分散的程度該怎麼拿捏呢？重點在於了解自己情緒管理的能力，對於絕大多數投資人來說，不建議只重壓一檔股票，因為大幅虧損的壓力，會使人無法做出理性的判斷，而在本來不該停損之處停損。我建議，適度將資金依不同比率分配至
    3～10 檔股票，會是適合一般投資人的持股配置。


    # **原則 4》擬定適合自己的停損策略**


    停損一直是重要的投資策略之一，沒有停損紀律的人，長期來看，很難在市場上生存。很多買股票慘賠的人，最大的問題就是沒有設立停損，放任手上的股票不斷下跌，卻不知道該如何處理。'
  merge: -1
  img_proc: true
