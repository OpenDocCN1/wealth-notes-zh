  md: '# # Chapter 5


    ## 匯集 10 年經驗 解析經典案例


    小型成長股沒有的優勢，加上股利的配發呈現逐年成長，這樣類型的企業似乎更適合用「總報酬本益比」評估合理股價。


    總報酬本益比與本益成長比唯一不同的地方是，在於加計收益率（殖利率）。以台積電 2017 年年初 180 元的股價來說，2017 年每股盈餘預估值約 13.5
    元，本益比為 13 倍左右，預估未來盈餘成長率達 12%。如果以本益成長比來計算，頂多處在合理價（或高於合理價一些）。


    但是，假設採取增加收益率的總報酬本益比，結果就會大不相同。以 2016 年台積電每股盈餘來計算，如果配息率為 55%，2017 年所發放的現金股利有 7 元的水準，換算收益率（現金殖利率）為
    4%，加上 12% 的預估盈餘成長率，等於總報酬率為 16%，將 16（%）除以本益比 13（倍），等於總報酬本益比為 1.23 倍，符合總報酬本益比公式的買進標準。


    一直到 2017 年 11 月，台積電站上 240 元後（詳見圖 3），我才進行獲利了結。然而，會賣出台積電並非是因為'
