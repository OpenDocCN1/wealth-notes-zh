  md: '# 1-4 選股法則 4

    股東權益報酬率 15% 以上


    一家企業最重要的是獲利能力，而獲利能力不能只單看賺進多少的淨利，還要看投入多少的資金。在財務比率分析當中，最常使用的兩項觀察指標就是「資產報酬率」（Return
    On Assets，簡稱 ROA）與「股東權益報酬率」（Return On Equity，簡稱 ROE）。


    ROE 愈高，代表愈能有效運用股東資金賺利潤


    其中，股東權益報酬率是股神巴菲特（Warren Buffett）很重視的一項指標，重要程度幾乎與每股盈餘不相上下，它能看到一家企業運用股東資金創造獲利的效率，股東權益報酬率愈高，代表企業為股東賺取利潤的能力愈強。


    在進一步了解股東權益報酬率之前，我們先來簡單了解'
  merge: -1
  img_proc: true
- pgno: 58
  md: '資產與股東權益的關聯。一家公司的總資產，一定會等於「負債＋股東權益」。負債主要來自於借款，股東權益（又稱為淨值）則是來自於全體股東的資金，這兩種資金讓公司得以取得營運所需的所有資產。


    如果公司愈能有效運用資產來賺錢，代表資產報酬率愈高。假設 A 公司的總資產為 10 億元，每年能夠創造 2 億元的稅後淨利，換算下來，資產報酬率高達 20%（2
    億元÷10 億元×100%），代表只要 5 年的時間，A 公司的資產就能翻 1 倍。另外，B 公司同樣也可以每年淨賺 2 億元，然而，它的總資產卻高達 100
    億元，換算下來，資產報酬率只有 2%，代表要 50 年的時間，B 公司的資產才能翻 1 倍。顯而易見，B 公司在資產的運用上有很大的問題，可能是閒置資產太多或產能利用率過低。


    **資產報酬率＝稅後淨利 ÷ 總資產×100%**


    而資產報酬率與股東權益報酬率不同之處在於，前者是用企業所投入的總資產來計算；後者只用股東所投入的資金來計算（總資產扣除負債）。例如：Z 公司的總資產為'
  merge: -1
  img_proc: true
- pgno: 59
  md: '10 億元，當中有 4 億元來自於負債，扣除負債後所剩下的股東權益為 6 億元。如果它今年的稅後淨利為 2 億元，換算下來，股東權益報酬率為 33.3%（2
    億元 ÷ 6 億元 × 100%）。


    **股東權益報酬率＝ 稅後淨利 ÷ 股東權益 ×100%**


    我們再用一個容易理解的說法，來解釋資產報酬率與股東權益報酬率的基本概念。假設你去年拿出 100 萬元的資本來投資股票，經過一整年的時間，帳戶的股票市值加上股利所得，讓原先投入的
    100 萬元增值為 120 萬元，而增加的 20 萬元就是你的投資獲利。20 萬元除以 100 萬元乘以 100%，換算下來，你的投資報酬率為 20%，也代表你的
    ROA 為 20%。


    但是，如果原先的 100 萬元裡面，只有 50 萬元是自有资金，另外 50 萬元是來自於借貸，20 萬元除以 50 萬元乘以 100%，換算下來，ROE 高達
    40%。


    因此，如果一家企業每年的股東權益報酬率都能維持優'
  merge: -1
  img_proc: true
- pgno: 60
  md: '異的表現，就代表該企業的股東權益（淨值）不斷攀升，當然也就成為股價上漲的最主要動能。


    # ROE 連 5 年達 20%，台股僅 3% 公司做到


