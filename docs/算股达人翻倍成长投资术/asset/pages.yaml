  md: '其他包括 AI（人工智慧）、物聯網、智能車、機器人所，這些未來趨勢向上的產業，無一不需要高端晶片。而絕大部分晶片的設計公司，都與全球晶圓代工龍頭台積電（2330），採取互惠合作的模式，也都需要仰賴它的先進製程技術。因此，我們可以得到一個結論——當未來的生活朝科技化邁進，台積電的營運展望，長期而言就不容易看淡，這就是一種長期趨勢（除非有一天台積電的龍頭地位被取代）。


    另外，近幾年受惠於廉價航空的盛行，出國旅遊變得更便利，再加上日圓貶值，鄰近的日本成為大部分國人海外旅行的首選；我也不例外，算一算近幾年去日本的次數，可能不下
    10 次，但是，澎湖卻一次也沒去過。當沖繩與台灣離島所需花費的交通時間與旅費差別都不大的情況下，選擇前往更具國際化的觀光地點，幾乎是無法抵擋的潮流。


    日本除了好玩、好看、好吃之外，還有一個重點，就是好買，尤其逛藥妝店更是不可或缺的行程。即便自己沒有買，你也會幫親朋好友買，因為大家普遍有一種認知，就是日本藥妝的品質比較好。日本的藥妝除了台灣人愛買之'
