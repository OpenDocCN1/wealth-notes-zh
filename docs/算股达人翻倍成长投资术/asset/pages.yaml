    | :---: | :---: | :---: | :---: |

    | A | 99/100 | 1元 | 0.99元 |

    | B | 1/100 | -1,000元 | -10元 |

    | | 合計（期望值） | | -9.01元 |


    二

    | 事件 | 機率 | 結果 | 期望值 |

