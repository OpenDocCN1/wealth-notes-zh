    我的方法是從日常生活的變化找出有用的資訊，舉例來說，我們小時候有什麼智慧型手機，印象中，我高中時期，最紅的非 BB.Call（呼叫器）莫屬，當有人 call
    你時，你還得找電話回撥。後來手機問世，BB.Call 逐漸被淘汰。我還記得那時候，最夯的手機除了 Nokia 之外，就屬 Motorola 的海豚機，我也忍不住打工存錢買了一支。在當時，檯面上那幾家手機大廠，都曾經極極一時。


    我退伍後不久，蘋果公司（Apple）已故創辦人賈伯斯（Steve Jobs），在當時推出了新一代的智慧型手機 iPhone，完全改變了手機原本的思維，讓智慧型手機成為一部功能強大且尺寸超小的個人電腦，也造就了
    Apple 成為全世界市值最大的公司。另一方面，一直沉溺於傳統手機美夢，而忽略了智慧型手機研發的 Nokia 等手機大廠，只能眼睜睜看著自己的市占率節節敗退，最後都黯然地消失在時代的洪流中。


    試著想像一個未來 10 年甚至 20 年的世界，科技只會一直往前，從家用電話、BB.Call、傳統手機，到現在的 Smart Phone，除了智慧型手機的功能愈來愈強大之外，'
