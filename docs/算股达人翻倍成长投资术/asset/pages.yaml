  md: '2017年第1季，受惠於上游原料尼龍（PA6）價格大漲，因此綠悦-KY產品報價跟著水漲船高。當時生產線已經全部滿載，預計10月將安裝新生產線，將能增加貢獻2018年營收13億元。


    根據我的評估，2017年綠悦-KY的淨利有望成長20%以上，每股盈餘有望達12.5元，創歷史新高，本益比不到14倍，對一檔有成長性的股票來說不算貴。而且如果營運展望如同公司所預期，2018年的獲利有望更上層樓。


    雖然我看好綠悦-KY未來的表現，也盡可能在能力範圍內做足功課，但是，因為有過去投資「F股」的慘痛教訓，讓我對綠悦-KY更加謹慎。最後我選擇先保守以對，只動用了總資金的5%左右布局。


