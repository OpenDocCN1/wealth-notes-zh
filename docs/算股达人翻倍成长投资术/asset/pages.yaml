  md: '# Chapter 5


    匯集 10 年經驗 解析經典案例


    2018 年增加現金股利至 7.5 元，以股價 240 元計算，殖利率為 3.1%，預估盈餘成長率採取較為樂觀的 10% 計算，總報酬率為 13.1%。將
    13.1 (%) 除以本益比 18 (倍)，可以得到總報酬本益比僅 0.73 倍左右。根據總報酬本益比的評價原則，低於 0.8 倍以下，即為適當的賣出時機。


    因此，在 2017 年 11 月，即使我認為股價有可能持續向上，不過，在評價總報酬本益比後，我選擇出脫台積電持股，把資金轉入其他更具成長潛力的標的，讓資金做更有效率的運用。


    總計兩次持有台積電，合計時間約 2 年半，加計股利收益，累積報酬率約 65%。現在回頭來看，如果當初在 160 元沒有出脫持股，而是選擇持股續抱，我想投報率應該會比現在來得優異。但是，從另外的角度思考，我也是因為發掘了總報酬本益比，才敢在相對高點進場。


    看一本書只要能從中學到一個新知識，其實就算值回票價。《約翰．蓋夫談投資》整本書超過 300 頁，其中闡述到總報酬本益比的真數不過只有 3 頁，而為了理解公式的'
