  md: '# Chapter 2


    # 掌握公司錢脈 確保獲利前景


    24 歲就跨入紡織業，並且從工作環境公認最差的染整廠開始做起，26 歲自立門戶創辦儒鴻，算起來創業也超過 40 年了。我們一般投資人研究一檔股票的時間，只有幾天或幾星期，頂多是幾個月，能夠比他們更透徹企業的未來嗎？幾乎是不可能。


    因此，當張忠謀在 2014 年的法說會，樂觀預估台積電未來 5 年（2015 年～ 2019 年）的營收年複合成長率有 5% ～ 10% 的水準時，對於我們在推估未來淨利成長率時，心裡就會有個依據。


    如果張董所言不虛，代表台積電 5 年合計的營收成長率約 27% 至 61% 之間。在營收成長的同時，如果毛利率也能夠逐年提高，加上營業費用控制得宜的話，預估未來
    5 年，台積電的淨利成長率，或許有機會達到年平均成長率 8% ～ 12%。


    或者，洪鎮海董事長在證交所舉辦的 2013 年業績發表會上，指出儒鴻的訂單已經排到隔年，現有的產能供不應求，必須持續擴建新廠，同時看好公司當年的營收可望有'
