    匯集 10 年經驗 解析經典案例


    企業，前提是在公司的未來具備高度成長的條件下，例如：鴻海、台積電（2330）、華碩（2357）、廣達（2382）等，在 1990 年代台灣電子產業起飛的階段，都曾經連續數年大幅配發股票股利。但是，隨著台灣近年來經濟動能趨緩，GDP
    從原先每年雙位數的成長，到現在保一保二（1%～2%），企業已經不具備大幅配發股票股利的基礎。


    # 若不具備獲利成長條件，過多的配股將降低 EPS


    當你的股本增加 10%，就算稅後淨利也增加 10%，計算下來 EPS 等於沒有成長。在 EPS 無法成長的情況下，股價就不容易上漲。因此，當一家企業每年配發
    1 元股票股利的狀況下，我們最少要期待公司每年的獲利成長要超過 10% 以上；如果公司不具備以上的條件，過多的股票配發，只會造成每股盈餘的嚴重稀釋，還不如穩定的現金股利。


    近幾年正新的獲利持續衰退，主因是輪胎市況不佳，加上中國新增輪胎產能，市場競爭劇烈，而且匯兌損失與原物料成本上升，導致營收與毛利率下滑。2018 年正新的股價創近
    8 年新低，與大盤持續創高的走勢完全背道而馳。'
