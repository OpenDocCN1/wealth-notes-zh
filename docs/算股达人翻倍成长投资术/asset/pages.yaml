  md: '# ## Chapter 3

    檢視公司體質 增加持股信心


    # ### 3-1 從經營者持股＋融資比率

    了解籌碼在誰手上


    我喜歡買經營階層與大股東持股多的個股，因為從公司經營階層持有自家股票比重的多寡，可以看出一些端倪：如果董監事和大股東持股相對較高，通常代表他們對公司未來的營運深具信心。


    如果經營階層持有自家公司股票的比重很低，在正常的情况下，我不會考慮買進，因為最了解公司營運狀況的人，通常就是企業的管理高層，連他們都不想持有自家公司的股票，或有大量出脫持股的行為，可能就表示經營團隊對公司的未來缺乏信心。連經營階層都對自家的股票興致缺乏，一般的投資人又有什麼理由看好公司的未來呢？


    買股票最重要的就是追求獲利，因此，當你所買進的公司營運表現愈來愈好時，股票的價值自然也就跟著水漲船'
  merge: -1
  img_proc: true
- pgno: 148
  md: '高，不管是股價的上漲或股利的提升，都會讓投資人的獲利增加。公司高層當然也明白箇中道理，除非他們不看好自家公司，否則在肥水不落外人田的情況下，一定會盡可能買進股票，增加未來的利潤。


    # 經營階層＋大股東持股，比重至少要達 25%


    身為一個小股東，一定希望公司經營階層的利益與我們一致。經營階層持股比重高的企業，代表他們在為公司做決策時，思考的重點除了股東的利益之外，也包含了自身的利益。因此，我會選擇買進的個股，其經營階層加大股東的持股，必須符合
    2 個條件：


    +   1. 持股比重至少 25%：經營階層（例如：董監事）加上大股東的持股，至少要 25% 以上，如果能達到 30% 以上更好。


    +   2. 近 1 季無明顯出脫：這部分我會觀察持有 400 張以上大股東的持股，在最近 1 季是否維持平穩？如果大股東有明顯的買進訊號，通常代表公司未來的行情可期；反之，'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Chapter 3

    檢視公司體質 增加持股信心


    如果大股東持股顯著的減少，投資人就需要進一步了解背後的 factor，必要時要先採取觀望的態度。


    此外，當投資人買進後，在持股期間也要密切注意大股東有無交易，一旦發現大股東有大量出脫持股的行為，通常就是一個警訊，如果又加上股票大漲一波，可能就要特別小心了，因為根據過往經驗，此時股價可能已經到頂，極有可能隨時會反轉向下。


    # 融資比率不超過 5%，低於 3% 更好


    除了注意經營階層與大股東的持股比重之外，融資也是觀察籌碼變化的另一個關鍵。所謂的融資，指的是借錢買股票，當投資人看好一檔股票未來有上漲空間，受限於資金不多，因此向授信機構用借款的方式買進股票，等高價出脫持股。


    借錢買股的優點是賺錢的時候，可以透過槓桿的操作加大獲利部位；缺點是有時間壓力，一旦看錯方向，股價大幅下跌，往往會被迫「斷頭」（當融資股票的市值低於融'
  merge: -1
  img_proc: true
- pgno: 150
  md: '資金額的 1.3 倍以下，就會收到追繳通知，如果未在期限內繳款則會遭券商強迫賣出持股），造成血本無歸的下場。


    因為法人不能使用融資，所以融資被視為「散戶指標」。從台股的歷史經驗來看，每波行情的高點，融資通常也會來到相對高檔；每波行情能否破底重生，也是要靠融資「斷頭」離場，才會開始觸底反轉，因此，融資是觀察行情是否過熱很重要的一個指標。


    散戶指標不光適用於大盤，從個股的角度來看亦是如此，很多股票從高檔下墜時，融資非旦不減，反而持續增加。例如：宏達電（2498）在 1,300 元時，融資餘額只有
    1 萬張，但是，當股價開始下跌時，散戶卻一路向下攤平，融資餘額向上。直到跌破 200 元關卡，股價跌幅超過 8 成，融資餘額卻高達 8 萬張，等於增加了 7
    倍，代表外資都把股票倒給了散戶，股價如何能上漲呢？


    因此，在進場前，我會特別注意融資餘額。根據經驗，有大漲潛力的股票，上漲前籌碼都是相對「乾淨」（意指融資餘額低），因此，融資占股本比率（簡稱融資比率）'
  merge: -1
