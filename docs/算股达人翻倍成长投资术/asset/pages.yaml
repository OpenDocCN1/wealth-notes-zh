  md: '# **Chapter 4**

    擬定投資策略 奠定致勝基礎


    續成長就應該牢牢續抱。


    如果你真的想換股，除非有顯而易見的原因，或者在計算兩檔股票的價值後，有超過 3 成的溢價空間（換股買進新股票的潛在上漲空間，比舊股票多出 3 成獲利），才考慮換股。最好的做法是，盡可能在買進前就選擇最好的股票，才能減少換股的次數。'
