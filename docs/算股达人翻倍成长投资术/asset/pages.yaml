  md: '# 4-2 3大最佳賣股時機

    讓帳面獲利落袋為安


    根據統計，很少有股票能10年、20年永無止境的上漲，大部分個股的走勢都是漲跌互見，而我們的目標是盡可能在相對高點出場，維持絕大部分的獲利。


    以捷安特品牌聞名全球的自行車大廠巨大（9921），股價從2001年的最低點26.2元起漲，至2015年達到歷史高點323.5元，股價累積漲幅高達11.35倍。除非你是原始股東，否則我想應該很少有人能持有巨大14年。巨大在2015年2月漲到323.5元的歷史新高後，股價隨即反轉，開啟長空走勢，至2018年10月，股價最低來到111元，從高檔計算波段跌幅超過65%（詳見圖1）。


    毫無疑問的，巨大是全球最大的自行車製造商，也是台股的隱形冠軍，過去的獲利一直處於非常優秀的水準。但'
