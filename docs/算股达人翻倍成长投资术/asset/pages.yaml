  md: '# 投資法則摘要


    +   1. 想要創造翻倍的報酬率，一定要學會如何評估一檔股票的真正價值，其中本益比成長比正是發掘中小型成長股的絕佳公式。

    2. 本益比高低不應該取決於所屬產業，而是個別企業的獲利成長性，當企業未來的獲利成長性愈高，市場所給予的本益比也愈高。

    3. 如果一家公司的平均淨利成長率為 15%，合理的本益比應該在 15 倍；如果平均淨利成長率為 20%，合理的本益比應該在 20 倍；如果平均淨利成長率達
    30%，即使本益比 30 倍也不算貴。

    4. 本益比長比 1 倍時為合理股價，低於 0.75 倍（低於 0.66 倍更好）時可考慮買進，超過 1.2 倍時可考慮賣出。'
