  md: '# 1-8 選股法則8

    預估未來淨利可望持續成長


    不同於其他法則，例如：營收、每股盈餘、毛利率、股東權益報酬率等，我們可以透過財報或券商所提供的程式來獲得資料，對於未來淨利成長率的預估，相對來說沒那麼容易。原因在於預估未來淨利成長是屬於未發生的事，因此，並沒有明確的資料可以查詢，即便企業過去連續好幾年的淨利都能大幅成長，也無法保證未來一定能繼續保持成長。


    再者，前面談到本益成長比的計算公式，是以本益比除以預估未來淨利成長率，如果你無法預估一家企業的未來淨利成長率是多少，就無法算出一檔股票目前的本益成長比的數字，自然也沒有辦法確切知道，這家公司現的股票價到底是昂貴或便宜，也就難以掌握最佳的買進與賣出時機了。'
