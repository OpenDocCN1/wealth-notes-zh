  md: '# 不斷學習才是獲利不二法門


    2016 年出版第一本書後，台股持續攀高，並且站上萬點大關，在撰寫本書期間，萬點已經站穩長達一年以上。這段期間常遇到投資人問我，「現在指數這麼高，還能買股票嗎？」


    的確，如果根據台股過去近 30 年歷史經驗（1988 年～2018 年），指數長期在 3,000 點左右至 1 萬點左右來回震盪，從指數歷史區間的角度來看，在台股攻上萬點的
    17 個月時，確實應該要居居思危（2018 年 10 月已經跌破萬點）。畢竟指數從 2008 年金融風暴後開始上漲，從最低 3,955 點漲到 2018 年最高點
    1 萬 1,270 點，多頭已經整整走了 10 年行情，指數也大涨超過 1.8 倍，創下 27 年新高。


    不過，對成長股的投資人來說，重點還是放在找尋具備'
