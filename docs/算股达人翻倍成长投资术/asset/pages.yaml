    點開始起漲，短短 10 個月反彈超過 80%。而我也趁這一波 V 型反彈，把手上的弱勢股停損出場，例如：奇美電（2010 年併入群創）、東和鋼鐵（2006）、允強（2034）、四維航（5608）等。


