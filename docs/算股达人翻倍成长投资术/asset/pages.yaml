- pgno: 219
  md: '# Chapter 4

    擬定投資策略 奠定致勝基礎


    # 4-4 透過持股配置

    集中火力讓資金迅速翻倍


    關於持股配置應該選擇集中持股，或分散持有一籃子的股票呢？一直以來這也是投資界中爭論不休的議題。因為除了選擇正確的標的之外，如果沒有配合適當的持股組合，往往無法放大獲利效果。其實，這兩種方法有其各自的優缺點，我先說結論，對於一般的投資大眾，尤其是以成長股為主的投資人而言，選擇集中持股的方式，才能加快獲利增長的速度。


    有些投資人偏好持有數十檔各種不同類型的股票，不可否認，這麼做的好處是能分散投資風險，因為持有的標的眾多，即使其中一、兩家公司的營運出現危機，由於個別持股占投資組合的比重有限，因此不容易對資本造成嚴重的傷害。但是，也因爲分散持股，長期來看很難創造優於大盤的投資績效。'
  merge: -1
  img_proc: true
- pgno: 220
  md: '發掘一檔能夠上漲1倍的股票容易，還是發掘20檔都能上漲1倍的股票容易呢？我想應該是前者吧。假設你把資金平均分配至30檔股票，其中有一檔股票漲1倍，投資組合的市值只會增加3.2%，以報酬率來看，效果并不大。但是，如果你是平均分配在5檔股票的情況下，其中有1檔股票漲了1倍，即便其他的股票都沒有漲，投資組合的市值還是能大幅成長2成，相對有感許多。


    # 分散持股不代表安全，若無研究依然有投資風險


    再者，當你買進一檔股票，應該是要經過一段時間的充分研究，並且再三確認每個細節都沒有遺漏，直到有足夠的把握，加上等待合理股價的出現，才會買進。每次的投資都是花費相當多的時間、需要全心全意的投入，對於大多數的投資人來說，即便你是專職投資人，當你需要研究50檔股票與你只需要專注在5檔股票，研究的質與量都會大不相同。


    當你選擇買進一籃子不同類型的股票時，可能念茲在茲的是投資風險。你或許沒想到，雖然表面上看起來分散持'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Chapter 4


    擬定投資策略 奠定致勝基礎


    股能降低風險，但是，如果你對所持有的每一檔股票都一知半解，我敢肯定，名義上是分散投資，實質上你的風險絕對會高於別人精挑細選的 5 檔股票。


    買股票並不是收藏藝術品，只需要一個空間存放即可。股票更像是有生命的植物，因為企業的營運是動態的，每一家公司對未來的展望是一直不斷在更新、在變化，尤其是 21
    世紀的今天，企業的變動速度與產業的起起落落，是過去無法比擬的。


    身為股票投資人，必須要時時刻刻關注企業的發展，才能夠掌握公司第一手的動態。如果你持有的股票多達數十檔，光是每月公布月營收、每季公布財報，可能就會令你手忙腳亂、疲於奔命。


    我接觸過不少投資人，常常有朋友會跟我聊起他們的故事，我發現能成為市場贏家的方法有很多種，但是，常見的市場輸家往往具備一個特點——把買股票當成上菜市場買菜一樣隨意。聽朋友說某檔股票不錯就買了、聽電視上的投顧老師說某檔股票前景看好，可能聽一聽又買了。每'
  merge: -1
  img_proc: true
- pgno: 222
  md: '檔股票都買 1、2 張，不知不覺手上已經持有一堆的股票，種類之多，簡直可以開一家雜貨店了。然而，這些股票大部分都不會漲，有些抱到股票都下市，也沒有進行處置，這是台股最典型的菜籃族模式。


    # 將資金集中於優質標的，才能快速累積獲利


    過於分散持股的投資人，長期績效很少能勝過大盤，大部分的檔數（超過 90% 以上），報酬率都會落後大盤。因此，對於喜歡分散持股的投資人，我會建議直接購買元大台灣
    50（0050），透過持有台灣市值最大的前 50 家企業，以追求貼近大盤的投資報酬率。雖然這麼做短期內無法擁有超額的報酬，但是長線來看，平均創造穩定 6%
    至 8% 的年化報酬率是可以期待的，加上也不需要花費時間找標的，算是相當省時又省力的投資方式。


    所有投資策略的目標，就是希望能創造超越大盤的報酬率。投資人想打敗大盤，就必須集中持股。當你好不容易挑出一檔具備長期成長潛力的個股，卻沒有極積運用手上的資金，最後的結果就是白白錯失讓資產翻倍的大好機會。'
