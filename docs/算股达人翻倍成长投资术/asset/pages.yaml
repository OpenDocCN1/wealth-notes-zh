- pgno: 225
  md: '# Chapter 4

    擬定投資策略 奠定致勝基礎


    另外，投資人也可以採用平均分配法，也就是每檔股票的資金比重一致。如果以持股 8 檔計算，每檔股票的資金占比為總資金的 12.5%；如果以持股 5 檔計算，每股檔票的資金占比為總資金的
    20%。這樣的方式，雖然不能創造最高的報酬率，但是，這個方法可以解決「配置原則 1」可能會發生的「低持有比重個股，表現卻優於高持有比重個股」的問題。


    至於集中持股是否代表風險相對較高，答案是未必。根據研究資料顯示，當你持有 8 檔以上的股票，並且把投資組合分散至 4 到 5 個不同的產業，由於每個部位彼此間的相關度很低，因此波動就會顯著下降，風險就能得到一定程度的控制。


    # 本金小於 100 萬的投資人，持股檔數勿逾 5 檔


    從長期角度來觀察，巴菲特所管理的標的，幾乎很少發生虧損，喬爾·葛林布萊特（Joel Greenblatt）與柏波萊所管理的基金，同樣也幾乎不曾發生虧損，而他們最大的共同點就是都採取集中火力的持股策略。'
