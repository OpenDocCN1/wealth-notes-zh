  md: '# 我的投資故事從 3 萬元開始


    我的第一本著作《算股高手的驚人財富翻倍術！》在 2016 年出版，承蒙各位讀者的支持與愛戴，市場反應超乎我的預期，再版已經超過 10 刷了，並且連續在 2016
    年與 2017 年，入圍博客來商業理財類年度百大暢銷書榜單。對於首次寫書的我而言，這份榮耀帶給我極大的肯定，也成為我持續寫作與催生第二本著作《算股達人的翻倍成長投資術》的主要動能。


    一開始想寫書，起心動念是想要跟大家分享我 10 年來所累積的投資心得，以及投資股票正確的邏輯與觀念。至於能賣多少本，內心並沒有太大的期望，幸好書出版之後，市場反應相當熱絡，更有不少讀者寫信或至我的臉書（Facebook）粉絲專頁留言，給我很多的鼓勵與肯定，在此致上我最誠摯的謝意！'
  merge: -1
  img_proc: true
- pgno: 10
  md: '有些讀者看了書之後，會上我個人的粉絲專頁與我討論書中的內容，大部分的問題透過我的補充說明，都能得到適當的解答。但是，也有一些問題是無法透過簡單幾行字就能詳細解釋，比方說，如何預估公司未來的淨利成長率，這種問題無法單純只靠幾段文字，就能完整闡述，因此，讓我產生了想寫第二本書的念頭。


    初試啼聲的第一本著作，最主要是跟大家分享，像我這樣一位口袋只剩下3萬元、月薪只有32K的小美工，如何從一個完全不具備財經知識的投資門外漢，在歷經金融海嘯慘賠百萬後，還能夠透過看書自學，只花6年的時間，就在股市累積高達千萬元獲利的成功翻身經歷。


    相較之下，我的第二本著作《算股達人的翻倍成長投資術》，則以成長股的投資策略為主，可以說是《算股高手的驚人財富翻倍術！》的進階完整版。此書的重點為成長股的投資策略與運用，內容包括：進階版的「翻倍成長投資術」、本益成長比公式的運用、如何計算公司的淨利成長率、成長股的持股配置、停損策略的運用、台股實戰案例解析等等，都將毫無保留的把我在股市累積多年的投資'
