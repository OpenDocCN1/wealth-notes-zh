  md: '台掛牌。以前這類股票需要在股票簡稱前面加上「F-」，因此市場上普遍稱它們為「F股」。


    2006 年改制後，變成要在股票簡稱後加上公司註冊地，而這類回台上市的股票，幾乎都是在英國領地——開曼群島註冊，因此，股票簡稱後面需加上「-KY」。本文除了檢討失敗案例之外，順便兼論我對海外來台第一上市企業的—些想法。


    # 再生 -KY》 2011 年上市，因財報完美而買進


    我是在 2012 年 11 月買進再生 -KY，平均成本約在 84 元。當時台灣剛開放海外企業回來掛牌不久，大家對「F股」的認知也處於一知半解的情形。雖然投資人對「F股」都不太了解，但是，它們普遍有一個共同點，就是在剛上市時，財報數字都極為優異。


    以 2011 年掛牌的再生 -KY 為例，2008 年～ 2011 年的稅後淨利年復成長率達 29%、股東權益報酬率 (ROE) 高達 30%、毛利率接近
    40%、2011 年的每股盈餘 (EPS)'
