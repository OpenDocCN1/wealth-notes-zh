  md: '# 1-3 選股法則 3》

    本益比低於 15 倍


    本益比（PE）在所有評估投資價值的公式中，算是相對簡單又容易使用的一種。本益比是指投資本金與收益之間的比值，在正常的情況下，本益比愈低時買進股票，對投資人愈有利。


    # 低本益比具保護效果，無懼市場修正帶來的損失


    本益比可以視為股東回收投資本金的年數，本益比愈低，代表回收的速度愈快。假設有一檔股票的每股盈餘為 10 元，股東以每股 100 元的資金投入，換算下來，本益比為
    10 倍。如果公司未來每年都能穩定賺 10 元，代表只需要 10 年的時間，股東就能回收 100 元的本金。但是，如果這檔股票的股價是 200 元，本益比為
    20 倍，而且每股盈餘維持每年 10 元，代表需要 20 年的時間，才能賺回本金。'
  merge: -1
  img_proc: true
