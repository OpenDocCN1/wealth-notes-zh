    在過去幾年，如果有朋友問我有什麼股票可以買，我都說可以考慮台積電（2330），當時（2014年、2015年）我也曾經多次在個人的臉書（Facebook）粉絲專頁推薦過台積電。雖然它是科技股，但是，我覺得相較於其他小型電子股，台積電本身具備一些特殊的優勢。


