  md: '會。如果投資人看好一檔股票未來的成長性，最多能接受過去 5 年中，有一個年度比前一個年度衰退，但是年複合成長率最至少要 5% 以上。


    最後，或許有人會問，為何不單看每股盈餘就好，最主要的原因是每股盈餘容易失真，例如：公司辦理現金增資、減資、配發股票股利、發行可轉換公司債等措施，都會使得公司的股本增加或減少，連帶影響每股盈餘的變化。因此，只看每股盈餘很容易模糊焦點，我們必須以「稅後淨利為主，每股盈餘為輔」的觀察方式，才能夠洞悉全貌。


