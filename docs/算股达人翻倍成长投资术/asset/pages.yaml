  md: '# 導言


    而成。而本書的「翻倍成長投資術」更新了一部分的選股法則，並且把原本 10 個核心選股法則去蕪存菁，濃縮為以下 8 大核心選股法則：


    +   ①近 5 年營業收入正成長


    +   ②近 5 年稅後淨利正成長


    +   ③本益比低於 15 倍


    +   ④股東權益報酬率（ROE）15% 以上


    +   ⑤毛利率 15% 以上


    +   ⑥近 5 年現金股利正成長


    +   ⑦本益成長比低於 0.75 倍


    +   ⑧預估未來淨利可望持續成長


    「翻倍成長投資術」運用 8 大核心選股法則，找出現階段最具成長潛力的個股，並且透過「本益成長比」算出股價是否被低估，同時配合成長股的持股配置、停損技巧，成為一套把風險控制在合理範圍內，而且預期獲利盡可能極大化的投資策略。


    相較於定存股，這套投資術的預期報酬率更高，但是風'
