- pgno: 16
  md: 'Lynch）、德國股神科斯托蘭尼（André Kostolany）等人的經典著作。我廣泛蒐集所有ㄧ切跟投資相關的書籍，盡ㄧ切可能吸收所有跟投資有關的知識。


    我這才發現，外國的投資大師鮮少有人熱中於技術操作，幾乎清ㄧ色都是以基本面為主要的投資工具。而在基本面分析中，又屬成長股投資法最有機會創造高報酬，像是吉姆·史萊特（Jim
    Slater）、威廉·歐尼爾（William O''Neil）、菲利蒲·費雪（Philip Fisher）、彼得·林區等人，都是以成長股為主要投資標的的大師。


    擅長長期持股的巴菲特是史上公認最強的價值型投資大師，但是，你可能不知道，只單純靠存股，是沒有辦法讓他長期名列全球前三大富豪，因為巴菲特不單純只是存股，他存的是成長股！


    威廉·歐尼爾在《笑傲股市》中，列舉了美國史上前100檔的績股，這些大漲的股票都有ㄧ個共同點，就是企業獲利的成長性極為優異，而且絕大部分能夠持續上漲的股票，最主要的原因是獲利不斷成長！'
