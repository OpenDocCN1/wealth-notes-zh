    元），如果以單次來看，結果不是賺 100 元就是賠 20 元（詳見表 2），的確有可能虧損，但是，如果以這樣的期望值投資 100 次，虧損的機會幾乎微乎其微，最後所賺取的獲利將接近原始投資
    100 元的 64 倍，也就是6,400元。


    毫無疑問，這是一個勝算極高的賭局，雖然並不是完全無風險，但是，看對大賺，看錯小賠，是一個報酬率極高'
