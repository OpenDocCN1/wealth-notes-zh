- pgno: 193
  md: '# 4-1 計算總報酬本益比 找出攻守兼備好標的


    在第一篇我有提到，在 8 大核心選股法則中，我特別新增了「近 5 年現金股利正成長」這個選股法則，主要是受到美國著名傳奇基金經理人約翰·聶夫（John Neff）所提出「總報酬本益比」的啟發。


    總報酬本益比（total return ratio）的概念出自於《約翰·聶夫談投資》一書，亦是作者約翰·聶夫最常用來評估股價是否值得進場的重要依據。《約翰·聶夫談投資》的中文版於
    2000 年由寰宇出版，而我一直到 2016 年才發掘到此書。


    總報酬是指「盈餘成長率」加上「收益率（殖利率）」的「總報酬率」，再把總報酬率除以本益比，即可得到「總報酬本益比」數字，其公式為：'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# ## 表1 總報酬本益比逾1.2倍代表股價被低估

    總報酬本益比買進與賣出標準


    | 數值 | 意義 | 策略 |

    | :--- | :--- | :--- |

    | 高於 1.2 倍<br>（高於 1.6 倍更佳） | 股價被低估 | 買進 |

    | 0.8 倍～1.2 倍 | 股價在合理範圍 | 空手者不買，持有者不賣 |

    | 低於 0.8 倍 | 股價被高估 | 賣出 |


    總報酬率＝盈餘成長率+收益率（殖利率）

    總報酬本益比＝總報酬率 ÷ 本益比


    假設一家公司的盈餘成長率為 10%，收益率為 5%，兩者相加即為總報酬率 15%，如果目前的本益比為 12 倍，總報酬本益比則為 1.25 倍（15 ÷ 12）。


    如果總報酬本益比高於 1.2 倍，代表目前股價遭到低估，可以考慮進場；如果總報酬本益比在 0.8 倍至 1.2 倍之間，代表目前股價在合理範圍內，空手的投資人可以先觀望；如果總報酬本益比低於
    0.8 倍，代表目前股價被高估，建議快快賣出（詳见表 1）。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '總報酬本益比與本益成長比唯一不同處在於，總報酬本益比加計收益率，如果數值高於 1.2 倍，代表具備投資價值。有些投資人或許會覺得，計算盈餘成長率有些難度，因為影響未來獲利增長的不確定因素有很多，但是，收益率的預估相對容易，只要企業的獲利維持穩健，並且參考公司過去的配息率，就可以掌握。未來淨利的表現有其不確定性，投資人對於盈餘成長率的預估，允許有一定程度的落差。


    # 個股總報酬本益比大於台股平均值 2 倍時可買進


    為什麼股票市場長期來看總是持續上漲呢？我曾經認真思考過這個問題，也聽過各種不同的解釋，但是，我覺得最好的解答是，「因為企業的獲利持續不斷成長」。當上市企業的盈餘不斷增長，在預期未來比現階段更好的情況下，就會湧入買盤，使整體市場的市值向上推升。


    長期來說，台股（發行量加權股價指數）的平均年化報酬率約 6% ～ 8%。而根據「發行量加權股價報酬指數」的統計，2006 年至 2017 年，台股的年化報酬率為
    8.07%。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '同時期，整體上市公司的盈餘年增率為 4.87%（編按：根據台灣證交所的資料，2005 年台灣上市公司的平均每股盈餘約 1.61 元，至 2017 年平均每股盈餘約
    2.3 元，計算 12 年之年化報酬率約為 4.87%），加上平均殖利率約 4%，合計的總報酬約為 8%～9%，與台股的年化報酬率相當接近。可以說，台股的年化報酬率與上市公司的獲利表現、股利政策，長期是有絕對的相關性。


    近幾年台股的平均本益比約落在 14 倍～16 倍，如果維持 8%～9% 的總報酬率，計算出總報酬本益比為 0.5 倍至 0.6 倍。而以總報酬本益比估算個股的股價時，建議的買進標準，最好是在台股平均總報酬本益比的
    2 倍以上。意思是說，我們理想的買進條件是總報酬率高於台股平均值，而本益比低於台股平均值的個股。


    舉個例子，假設有一檔股票的盈餘成長率為 12%，加上 6% 的收益率，合計總報酬率為 18%。如果這檔股票的本益比只有 10 倍，則這檔個股的總報酬本益比為
    1.8 倍，高於台股平均 0.6 倍，也超過買進條件 1.2 倍，代表這檔個股符合總報酬本益比的買進條件。每種策略都有各自的'
  merge: -1
  img_proc: true
- pgno: 197
  md: '優缺點，沒有一種公式能適合所有的股票，重點在於你如何運用，讓公式在你手上能得心應手。


    # 總報酬本益比適合評估營運穩健企業


    以本益成長比來說，著重在企業的獲利成長性，適合用來評估業績持續大幅增長的公司，尤其是具成長爆發力且股本較小的中小型個股，如果用來評估金融類股、原物料類股等就不合適。


    而總報酬本益比的好處是加計收益率，在評估方面會比較容易些。有些企業因為股本較大或產業屬性的關係，或許沒有高速成長的條件，但是，公司的營運表現一直很穩健，產業前景也很明朗，或許盈餘成長率平均有
    8%～12% 的水準，再加上穩定的配息政策，在這樣的情況下，使用總報酬本益比的公式進行評估，更能適時補足本益成長比不足之處。如果說本益成長比是完全以進攻為主的投資策略，加計收益率的總報酬本益比便是攻守兼備的絕佳投資策略！'
  merge: -1
  img_proc: true
