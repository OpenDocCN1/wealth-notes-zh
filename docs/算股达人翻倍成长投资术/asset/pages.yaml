  md: '# 3-5 看懂3種股價線圖 輕鬆辨識飆股「漲相」


    從我進入股票市場到現在，基本面分析與技術面分析兩大派別一直爭論不休。從基本面分析派的角度來看，投資應該回歸企業經營的本質。股票本身的價格，長期來看，應該會等同於企業的價值。至於技術面分析，不過就是看圖說故事，屬於旁門左道的投資技巧。


    從技術面分析派的角度來看，企業的營運與未來展望已經反映在線型上，技術線圖如同企業的心電圖，早就透露出股票現況和未來可能的走勢，並且覺得基本面分析常常是落後指標，加上預期的報酬率與獲利速度太慢，資金運用不夠有效率。


    如果你問我哪一個派別好，我覺得各有各的優缺點，重點在於找出最適合自己的方法。因此，當我剛開始投資時，'
