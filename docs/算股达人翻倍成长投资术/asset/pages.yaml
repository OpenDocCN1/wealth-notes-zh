  md: '# 3-2

    # 首選股本小於30億標的

    # 股價漲幅更驚人


    「大象不會疾奔，雷射光束強過散彈槍。」這句話是《散戶兵法祖魯法則》裡的名言，其中，大象不會疾奔，意指市值太大的公司，會因為成長動能不足加上股本太大，股價難以一飛沖天。


    # ### 過去 80 年，美國小型股報酬大勝大型股


    從過去的資料顯示，小型股的長期報酬率會優於大型股。根據傑里米·辛格爾（Jeremy J. Siegel）的著作《長線獲利之道：散戶投資正典》中，他將 1926
    年至 2006 年美國股市 4,252 檔股票，依照市值大小區分為 10 個等級後發現，規模等級最大的股票，以複利計算的年化投資報酬率為 9.60%；規模等級最小的股票，以複利計算的年化投資報酬率卻高達
    14.03%，遠勝大型股 4.43 個百分點。'
