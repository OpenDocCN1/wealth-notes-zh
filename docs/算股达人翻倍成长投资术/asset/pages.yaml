  md: '一直等到 2013 年 9 月，美利達股價來到超過 200 元的新高，我從上半年公布的每股盈餘達 5.01 元推估，全年的 EPS 應該有 10 元左右的水準。


    # **股利＋價差，持有美利達 2 年多報酬率逾 350%**


    如果淨利成長率一樣維持 20%，本益成長比差不多在 1 倍左右；如果淨利成長率下修至 15%，本益成長比會高於 1.33 倍，股價已經明顯不便宜，因此我選擇獲利出場，從
    200 元、210 元、220 元一路逢高出脫持股。從我 2011 年 5 月買進以來，總計持有美利達 2 年 4 個月，加上配股配息，合計總報酬率超過 350%！


    在我出清持股後，美利達的股價多在 190 元～230 元的區間震盪，直到 2015 年 3 月漲到歷史新高價 263.5 元（詳見圖 3）。而後隨著營運受阻於中國市場銷售的衰退與歐美需求的減弱，美利達的營收、獲利與毛利率均呈現衰退，股價也反轉向下跌，從
    263.5 元一路下跌至 2018 年 10 月最低點 104 元，跌幅高達 60%（此波段最大跌幅亦高達 65%）。'
