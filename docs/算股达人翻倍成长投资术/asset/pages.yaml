    我有一位好朋友是香港人，他的父親非常熱中於賭博。如果你有去過香港或看過港劇，就會知道香港有個地方叫做跑馬地，是一個專門經營賭馬賽事的地方。因為他的父親嗜賭如命又逢賭必輸，所以他小時候過得非常悲慘。


    有一次，不曉得什麼原因，有一場賽事只有一匹馬參加，不就代表說，只要押那匹馬獲勝，就能百分之百賺取彩金了？於是，他的父親趕緊把握這個千載難逢的好機會，把房契、地契拿到當鋪抵押，借了一大筆錢，心想，這一次應該發了！


    到了比賽當天，「碰」的一聲，鳴槍起跑，從場邊的看台，遠遠只看到一匹馬在奔馳，雖然場面有點空虚，但是無所謂，能夠賺到彩金才是重點。就這樣，這匹馬獨自跑了一半，當牠打算開始朝終點加速前進時，突然暴斃身亡。'
