    \   3. 預估不是一件容易的事，然而「預估未來淨利可望持續成長」是「翻倍成長投資術」重點中的重點，對於部分投資人來說，可能需要重複看過幾次，但是，只要能融會貫通並且明白我想表達的意涵，透過正確的學習方法與策略的運用，相信在未來，你一定能顯著提升投資績效！"
