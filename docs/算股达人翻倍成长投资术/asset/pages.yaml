  md: '# # Chapter 5

    ## 導言


    回顧我的投資生涯，其實並非一帆風順。從 2006 年進入股票市場，直到 2009 年，累積前 4 年的投資績效是損益兩平，代表我花了 4 年的時間，結果是白忙一場，連一毛錢也沒有賺到。


    現在回想起來，2008 年因為美國金融海嘯造成股市重跌，對我來說，是一個關鍵的轉換點；它讓我認清自身投資能力的不足，也讓我明白，想在市場上生存沒有想像中那麼簡單。如果我繼續用之前不成熟的投資方式，從市場中畢業只是早晚的事，那麼想靠股票致富的夢想，真的就只是一場美夢而已。


    於是我開始透過閱讀來增加投資的視野與知識，算一算花了不到 4 年，我就已經累積閱讀超過 100 本投資相關書籍，我從中篩選過濾投資大師們的投資心法，把適合的策略留下來，加上我自己的經驗累積，才逐漸演變成為一套專門以成長潛力股為主的「翻倍成長投資術」。


    在這個篇章，主要想跟大家分享我這些年的台股實戰案例，包括正新（2105）、統一超（2912）、佳格（1227）、'
