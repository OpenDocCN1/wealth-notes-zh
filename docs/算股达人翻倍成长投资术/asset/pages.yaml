  md: '# 4-3 堅守 4 原則

    讓停損變成華麗轉身


    2008 年，美國爆發金融海嘯讓全球的投資人損失慘重（當然也包括我在內），當時有一家財經雜誌對券商營業員做問卷調查，其中一個題目是「為什麼投資人買股票總是賠錢收場」？根據統計結果指出，有高達
    7 成的營業員認為，主因是大部分的投資人沒有停損的觀念。


    停損是投資策略中極為重要的一門學問，只要你在股市裡長期打滾，就一定會面臨到的問題。沒有人可以一輩子買股票都只賺不賠，或多或少一定都會遇到帳面虧損的時候；此時能夠做出正確處置的投資人，才能成為市場真正的贏家。


    正因為如此，關於停損的議題在市場上一直爭辯不休。有一派主張一定要停損，有另一派認為停損沒道理。主'
  merge: -1
  img_proc: true
- pgno: 207
  md: '張要停損的人認為，當股票跌至預設的停損點（或許是10%、20%不等），就應該立即出場，如此一來，才能夠把損失控制在一定的範圍內，設法保住大部分的資金，不至於損失慘重。


    而主張不該停損的人認為，當你買進一檔股票後，雖然股價持續下跌，但是，只要你看好公司未來的前景，下跌代表能用更便宜的價格進場，買都來不及了，為什麼要停損呢？


    # 停損有其必要性，但勿僅以股價當判斷依據


    雙方聽起來都有各自的道理，主張停損是從風險管控的角度來考量，而主張不停損是從投報率的立場來思考。這讓我想起之前在学校讀視覺傳達設計時所提及的圖地反轉（figure-ground
    illusion），一個畫面在視覺上有兩種不同的看法，意思是指，我們對事物的認知，常常取決於我們看它的角度，以及用什麼方式看它。當圖形與背景都有不同解讀方式時，我們看到什麼，就取決於我們視何者為主體、何者為背景。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 圖1 從不同角度解讀，常會產生不同的答案


