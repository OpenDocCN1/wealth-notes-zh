    美利達創立於 1972 年，為全球第二大自行車廠，僅次於以捷安特品牌聞名的巨大（9921）。美利達的營運規模不如巨大，產品種類也不及巨大廣泛，但是，這家公司把營運重心放在高階自行車上，專注於高單價車型。


    美利達的平均出口單價為全台最高，反而更有利於市場區隔，並且有機會提升產品毛利率。加上美利達深耕中國市場超過 10 年，隨著中國經濟快速增長，搭配一般民眾所得提高與休閒意識抬頭，13
    億人口所創造的消費力不容小覷！


