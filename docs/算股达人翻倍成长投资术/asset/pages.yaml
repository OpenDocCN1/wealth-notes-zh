    因此，一檔股票能夠享有高本益比，關鍵不在於它處於什麼產業，而是該企業擁有過人的成長性。例如：光學元件族群中的大立光（3008），近幾年獲利表現極為優異，2009
    年稅後淨利為 24 億 8,600 萬元，當年收盤價為 421 元。2010 年之後大立光的獲利持續成長，2014 年稅後淨利已飆升至 194 億元，股價也站上了
    2,000 元。


    雖然與 2015 年相比，2016 年大立光的稅後淨利呈現微幅衰退，但是，股價仍然持續上漲，到了 2017 年，公司稅後淨利更高達 259 億元，每股盈餘創下
    193.65 元的歷史新高，而當年度的股價一度大漲至 6,075 元，創下台股前無古人的空前紀錄，換算下來，市場給予的本益比超過 30 倍（詳見圖 1）。


    反觀今國光（6209），雖然同樣屬於光學鏡片廠，但是公司過去长期的營運明顯落後於大立光，在每股盈餘長期虧損的情況下，股價始終在 10 元左右徘徊。如果這樣的個股突然大漲，投資人就要特別注意，一旦股價上漲是因為市場炒作，而不是企業獲利的提升，結果很有可能如同潮水般，來得快去得也快。'
