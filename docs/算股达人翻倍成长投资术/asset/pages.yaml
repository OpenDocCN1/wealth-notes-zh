    元。


    # 獲利如同水庫，營收豐沛方能充實盈餘


    從綜合損益表的結構我們可以是發現，營收與淨利息息息相关，而且淨利多半會隨著營收成長。舉例來說，營業收入就像是雨水，而淨利就如同水庫，雨下得愈大，代表最後會流入水庫的水愈多。雖然未必每次都會下在集水區，但是，只要大雨持續不停，下在集水區並且流入水庫的機會勢必增加；相反地，如果雨下得很小，或長時間沒有下雨，水庫缺水或發生乾旱的機會自然大增。


    因此，投資人在選擇投資標的時，應該要特別鎖定在營'
  merge: -1
  img_proc: true
- pgno: 28
  md: '收穩定成長，並在未來有機會持續創新高的個股。營業收入是我看企業財報必定會先觀察的指標，這也是我把「近 5 年營業收入正成長」放在選股法則首要條件的主要原因。


    而最理想的條件是，一家企業的營收在過去 5 年間，每一年都比前一年好；次佳的條件是，過去 5 年裡，有一年是比前一年衰退，但是，年複合成長率（Compound
    Annual Growth Rate，簡稱 CAGR）至少要有 5% 以上的水準。至於設定 5 年的意義是，要避開產業容易大起大落的景氣循環股，以及受惠於題材性而使短期業績爆發的個股，我們要把目光放在過去
    5 年～ 8 年營運持續成長的績優股身上。


    我們以台積電 2013 年～ 2017 年的營業收入為例，2013 年為 5,970 億元，經過連續的成長，到了 2017 年，營收來到 9,774 億元（詳见表
    2），總成長率為 63.7%，換算年複合成長率達 13.1%。


