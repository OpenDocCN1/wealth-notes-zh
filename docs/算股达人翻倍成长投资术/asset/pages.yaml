  md: '雙位數的成長，加上公司已經公布的上半年營收表現，較前一年同期成長超過 39%，你幾乎能夠確定，儒鴻 2013 年全年的營收，有機會能成長 30% ~
    40%。加上過去幾年公司毛利率每年增加 1 至 2 個百分點的情況下，儒鴻 2013 年全年的稅後淨利比前一年度成長 4 成以上，是合理的期待。


    觀察公司高層對自家企業未來營運態度樂觀與否，是判斷公司未來營運的重要依據。如果經營者對未來的營運表示正向，通常公司之後的表現可以期待，尤其是從風格保守的老闆口中說出的話，可信度就更高。


    不過，值得注意的一點是，你要非常確定公司高層過去有良好的誠信，最好是長期在事業上默默耕耘，而且專注於本業的老闆。如果是誠信有問題的經營者，毫無疑問一定要馬上剔除，同時也要避開行事風格過於奢華、經常出現在花邊新聞，以及不務正業的經營者。


    至於如何能夠取得公司高層的說法，我的建議是，可以從一年一度的股東會、證交所固定舉辦的法說會、業績發'
