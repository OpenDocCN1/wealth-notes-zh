- pgno: 143
  md: '# Chapter 3

    導言


    「翻倍成長投資術」的主要8大核心選股法則，是我從多年的實戰經驗中抽絲剥繭得來，因此，並不是先有法則才開始投資；相反地，這些法則是我觀察那些漲幅高達倍數的飆股，所歸納出的共同點。也就是說，未來會翻倍大漲的股票，大部分都符合「翻倍成長投資術」的選股法則。


    當投資人打算開始尋找未來的潛力飆股時，就不用毫無頭緒一檔一檔股票慢慢找，只要牢記8大核心選股法則，就能一步步找出合適的投資標的。


    首先，你要先從過去的財報找出營收、稅後淨利、毛利率、股東權益報酬率、現金股利都符合條件的個股。在正常情況下，符合8大核心選股法則的股票不會超過所有股票的1成。


    其次，再從篩選出來的股票中，做二次過濾，把太過複雜與難以預測的公司排除在外，只留下自己看得懂並且有能力分析的標的。


    再來，盡量從一個長期趨勢中，找出未來還能持續成長'
  merge: -1
  img_proc: true
- pgno: 144
  md: '的標的。你要盡可能多方收集資訊，來佐證自己的看法是正確，而不是只存在於想像中。而收集資料的方式可以透過年報、公司高層的說法、業績發表會、股東會、法人研究報告、個股新聞、請教發言人等。


    最後，透過自己所研究的資訊，適當評估公司未來的淨利成長率，再用本益成長比的公式，判斷目前公司的股價是被高估或低估。如果本益成長比小於1倍，代表淨利成長率的數值大於本益比，也意味著目前股價被低估；如果本益成長比小於0.75倍，甚至只有不到0.66倍，此時就是進場的最佳時機。


    當你的功課做得愈足，未來出錯的機率就愈少，而當股價因為短暫的利空而下跌時，相較其他散戶的落荒而逃，你更能從容不迫地進場加碼。


    我不否認，預估企業未來的成長性不是一件容易的事，但是，與丟擲銅板猜正反面這種單純靠運氣的遊戲相比，本質上還是有很大的差異，因為透過推理計算與策略運用，確實能夠大大提升預估的準確度。最重要的一點，我們追'
  merge: -1
  img_proc: true
- pgno: 145
  md: '求的不是百分百的勝率，而是能長期大賺小賠，把風險控制在最小的贏家策略。


    要注意的是，個股如果能符合8大核心選股法則所有條件，當然最為理想。如果只有一、兩項不完全符合（但是很接近標準），而且綜合考量之後，判斷這檔股票的確具備成長性，同時股價明顯遭到低估，我仍然會將它列入買進名單。


    在投資人買進股票前，除了遵守「翻倍成長投資術」的8大核心選股法則之外，接下來，我會告訴大家，在實際投入資金前，還有哪些需要特別注意的篩選條件，例如：籌碼在誰手上、首選小型股、負債比率與利息保障倍數、現金流量是否良好，以及成長股的技術分析。


    我認為，在進場前，如果能再次確認這些條件，就能加深持股的信心，讓你更有耐心等待股價上漲，不輕易出脫手中的持股。


