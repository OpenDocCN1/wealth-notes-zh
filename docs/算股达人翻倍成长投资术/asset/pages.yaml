  md: '# Chapter 3 檢視公司體質 增加持股信心


    高報酬率的機會。


    小型股之所以對一般投資人有 lợi，還有一個重要的原因，就是股本小，成交量低，比較不受法人青睞，因此可以成為冷門飆股的機會比較高。大型權值股因為與大盤連動密切，所以時間都有好幾家券商的研究機構追蹤公司動態，並且發表最新的研究報告，使得一般投資人撿到便宜價位的機率相對較低。


    # 一旦遇到行情修正，小型股跌幅將比大型股劇烈


    另外，值得留意的是，雖然小型股上漲的潛力無窮，但是，一旦遇到修正行情，跌幅往往也會比大型股來得劇烈。加上許多小型股每天的成交量不到百張，容易出現賣不掉的問题，如果想投資這類股票，投資人要謹慎。


    以我個人而言，我會首選股本 30 億元以下的小型成長股。根據過往經驗，符合此條件的股票，一旦開始上漲，由於股本小，籌碼容易掌握，因此股價往往有機會呈現大幅飆漲。'
