    2. 除了營收成長之外，如果能搭配毛利率的不斷提高，就能夠發揮相乘的作用，讓稅後淨利有機會大幅成長。

    3. 不同產業的毛利率差異極大，因此跨產業的比較沒有太大的意義，找出該產業毛利表現相對優異的企業才是重點。

    4. 景氣循環股的營運績效容易隨著景氣大起大落，加上未來獲利難以預料，不符合成長股的買進條件；而透過長期毛利率的篩選，可以避開這些難以預估後市的產業。'
