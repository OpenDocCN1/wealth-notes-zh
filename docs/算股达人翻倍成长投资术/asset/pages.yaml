  md: '以不擴張信用的投資組合來說，投資人只有 100% 的資金可以運用，理想的持股配置如表 1。意思是指，假設有 8 個投資機會，最看好的標的是機會 1，要投入總資金的
    20%；其次看好的標的是機會 2，要投入總資金的 17%，依此類推。


    股神巴菲特（Warren Buffett）與他的搭檔查理・蒙格（Charlie Munger）所管理的共同基金，也是採取類似的資本配置策略，長期以來創造極其優異的投資報酬率。而我的投資組合配置也接近以上方法，我會把超過
    50% 的資金，集中在最看好的 3 個投資標的上，前 5 個看好的投資標的會占整個投資組合的 7 成資金（詳見表 1）。


    當你判斷得夠精準時，集中持股的資本配置就可以創造優異的投資報酬。但是，值得注意的是預估的精準度，因為預測是取決於企業未來的營運展望，所以預估並不能代表百分之百準確，有時候也可能出現機會
    7 的表現，大幅優於機會 2 的情況。


    # 配置原則 2》每檔個股投入相同資金比重'
