  md: '# 1-2 選股法則 2》

    近 5 年稅後淨利正成長


    從投資人的角度來看，首要关心的是一家公司到底能賺多少錢，不管它的營收規模有多大、毛利率有多高、費用控制是否得宜，到最後有多少錢能夠留下來成為真正的利潤，才是至關重要。而從財報的角度來看，一家公司真正的獲利數字就是「稅後淨利」。


    稅後淨利之所以重要，原因在於這個數字代表一家企業的實質獲利情況，也是投資人在計算一檔股票的本益比時，不可缺的數字，只要把稅後淨利除以普通股加權平均股數，所得到的數字就是「每股盈餘（EPS）」。


    通常我們在檢視公司過去的獲利時，可以從財報的「（基本）每股盈餘」欄位查到這個數字，然而，如果想預估公司未來的每股盈餘時，投資人自己就得知道該怎麼計算。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '假設有一家公司去年的稅後淨利為 5 億元，公司流通在外的普通股加權平均股數為 1 億股，換算下來，每股盈餘為 5 元，也就是代表每 1 股的獲利為 5
    元。


    # 每股盈餘＝稅後淨利 ÷ 流通在外普通股加權平均股數


    假設這家公司目前的股價為 50 元，我們把 50 元除以 5 元（每股盈餘），所得到的數字為 10，代表這一檔股票現在的本益比為 10 倍。意思是指，如果股東以每股
    50 元投資這家公司，而公司未來每年的每股盈餘都能保持在 5 元的水準，代表只需要花 10 年的時間，就能為股東賺回投資成本，因為 5 元乘以 10 年等於
    50 元（股價）。投資人只要計算出本益比，就能初步評價一檔股票目前是否處在合理的範圍內。


    # 本益比＝股價 ÷ 每股盈餘 (EPS)


    稅後淨利除了是計算每股盈餘與本益比不可或缺的重要數字之外，更是攸關現金股利發放多寡的關鍵。基本上，大部分的公司只要現金流量的狀況良好，通常股利的配發'
  merge: -1
  img_proc: true
- pgno: 40
  md: '與每股盈餘是息息相關。假設一家企業過去每年的配息率維持相同的水平，當稅後淨利增加並且進一步推升每股盈餘成長時，可以預期股利增加的幅度，應該會接近每股盈餘成長的幅度。


    # 著重稅後淨利的「成長性」而非「爆發性」


    稅後淨利是成長股投資人最重要的觀察指標之一，這個數字能讓我們對公司的賺錢能力一目了然。但是，需要注意的是，在觀察稅後淨利時，投資人應該要著重在企業能否維持長期的獲利能力，而不是短暫一個年度或一個季度的暴增，因此重點應該擺在長期趨勢上。


    投資人觀察稅後淨利的趨勢，至少要以 5 年作為評斷的標準，因為 5 年差不多是一個景氣循環的週期。如果一家企業過去 5 年的淨利都可以穩定增長，代表該公司的經營能力比其他公司來得穩健，而非只是湊巧搭上景氣成長的順風車，才使得淨利突然在短時間內暴增。


    在這樣的條件下，無論是景氣循環股、轉機股、短線熱'
