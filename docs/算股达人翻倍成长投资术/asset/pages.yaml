    造成中鋼稅後淨利不穩定的主因，來自於它所屬的原物料產業，深受景氣榮枯的影響。嚴格來說，中鋼在原物料類股中獲利相對穩定，有些規模較小的二線公司，甚至在原物料走勢不佳時呈現虧損。正因為原物料類股受景氣波動影響甚鉅，所以長期以來，法人給它們的本益比，常常低於市場平均值，自然也不會受到成長股投資人的青睞。


