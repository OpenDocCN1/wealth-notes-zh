    # 現金股利持續增加，顯示公司為產業中佼佼者


    能夠持續每年增加現金股利的公司，通常具備一些條件，其中，獲利不斷成長是基本配備，不過，公司的自由現金流量也必須維持良好，加上企業不需要大量資本支出，才能讓現金股利逐年提高。因此，投資人也可以倒過來看，如果一檔股票過去的現金股利持續增加，同時維持高於市場平均的配息率，代表這家企業過去幾年，不管在淨利的成長、自由現金流的運用等，應該都在一定的水準之上。


