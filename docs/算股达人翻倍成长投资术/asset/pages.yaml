  md: '# ### 5-3

    精品單車領導廠》美利達

    高油價+樂活風的受惠族群


    美利達（9914）是我用選股程式篩選出來的股票之一。當時是 2011 年下半年，國際油價居高不下，自行車突然間成為一種熱門的交通工具。如果只是一般的代步工具，或許我不會特別去注意到它，但是，我發現身邊有不少朋友開始熱中於自行車活動，他們會利用休閒時間，呼朋引伴到郊區騎車，甚至搭配整套的車隊專屬服裝，在過去這很少見，一股自行車風潮儼然成形。


    # ### 美利達規模僅次於巨大，專注生產高階自行車


    因此我開始研究美利達，發現看似簡單的自行車，其實大有學問。光是車型，就分得好幾種不同款式，有代步專用的城市通勤車、競技專用的越野車、比賽專用的公路車、爬坡專用的登山車等，不同的用途，配件幾乎完全不同。'
