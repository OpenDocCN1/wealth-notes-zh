  md: '5.98 元，雖然當初的停損讓我虧了 7.2%，但是，如果沒有停損，現今的股價剩不到我當初買進價的 1 成。紅木 -KY 亦是如此，在我賣出後，波段最低跌到
    2015 年 8 月的 18.8 元，創歷史新低，跟我當初買進價相比，跌幅達 7 成。


    因此，關於停損這個主題，需要討論的並非要不要停損，應該把重點放在「如何停損」才對。只是，即使是投資界的大師，對於停損的看法也是南轍北轍，更何況是一般散戶，比方像股神巴菲特（Warren
    Buffett）就不會單純因為股價下跌而出脫持股（反而逆勢加碼）。


    對巴菲特來說，股價愈便宜，代表購人的成本愈低，未來的隱含報酬率則愈高；而成長股大師威廉・歐尼爾（William O''Neil）則嚴格要求投資人在股價下跌超過
    8% 時就務必斷然出場。由此可見，不同的投資策略有完全不同的停損方法。


    而我對於停損的看法是偏向巴菲特，也就是說，除非公司的未來展望變差，否則不會單純因為股價下跌而選擇賣出股票。因為每個人對停損的看法不同，加上承受壓力的'
  merge: -1
  img_proc: true
- pgno: 218
  md: '能力也不一樣，所以並不存在一套完美的停損策略，只要是找到適合自己的停損策略，就是最好的策略。


    # 擬定策略後須嚴格執行，礙拗只會擴大虧損


    你可以跟我一樣，當你對公司未來的前景有疑慮時，選擇出脫持股；也可以單純透過價格擬定停損策略，把單一股票的損失控制在8%至20%不等。重點是，當你擬定屬於自身的停損策略後，請務必嚴格遵守。假如你設定跌幅達15%停損出場，當股票跌幅真的達到15%時，就必須二話不說執行，不可說服自己這次不同，而不停損。投資最重要的是紀律，嚴格執行停損就是紀律的展現。'
  merge: -1
