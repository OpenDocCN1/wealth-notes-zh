  md: '# 3-4 分析現金流量表

    掌握企業資金實際流向


    在檢視企業財務的穩定度時，除了觀察企業的負債比是否過高之外，關注企業的現金流量是否維持正向、自有現金是否充裕也是至關重要。過去投資人在研讀公司財報時，都把重心放在「綜合損益表」與「資產負債表」，而忽略了「現金流量表」，但是，隨著企業營運的擴張化與複雜化，現金流量的重要性絕不亞於綜合損益表和資產負債表。


    現金流量之所以重要，是因為「現金」是一家公司最不可或缺的要素，不管是支付員工薪水、廠商貨款、銀行利息、政府稅金、水電費等，都需要現金。如果公司需要進一步擴廠、添購設備等，更是少不了它。


    通常一家營運陷入虧損的企業，並不會立即倒閉，因為只要手上現金充足，就不會有太大的問題。可是，一旦公'
  merge: -1
  img_proc: true
- pgno: 171
  md: '司現金用完，周轉出現問題，就有立即倒閉的風險。因此，對投資人來說，現金流量表絕對不能忽略。


    投資人從綜合損益表能看出公司的營運績效、從資產負債表能看出企業的總資本結構，而從現金流量表則能清楚看出金錢的實際流向。


    # 充沛現金流量是經營基石，投資人須留意 4 重點


    許多價值型投資人在觀察公司財報時，因為考慮到持股的安全性，所以會把現金流量表擺在第一個位置，目的就是要確認企業能否永續經營，不會因為自有現金的不足，而產生倒閉的風險。


    現金流量表主要分為營業活動、投資活動與融資活動等 3 大項，最後還會顯示本期產生了多少淨現金流量，它們觀察的重點如下：


    +   1. 營業活動現金流最好大於或接近稅後淨利

    營業活動現金流指的是企業透過營運所賺取的現金，也'
  merge: -1
  img_proc: true
- pgno: 172
  md: '就是本業真正賺到的現金。有時候，公司的淨利不一定代表真實的獲利，看營業活動現金流可以確定實際流入的現金。通常我會觀察近 5 年營業活動現金流的表現，如果平均營業活動現金流大於或接近稅後淨利（近
    5 年平均營業活動現金流＞近 5 年平均稅後淨利），代表公司確實有收到來自本業的現金。但是，如果綜合損益表長期有獲利，營業活動現金流卻呈現負值或實際流入的現金很少，就代表財務結構有問題，投資人需要特別小心。


    # 2. 投資活動現金流最好維持在營業現金流的 6 成以下


    投資活動現金流是指，企業固定投資與長期投資的支出，或出售投資資產所產生的現金流，例如：購置設備、土地或蓋廠房等，會造成投資活動現金流出，而公司出售長期投資事業的股票或賣掉土地，則會產生投資活動現金流入。


    一般來說，從企業投資金額的多寡，可以看出公司對未來營運所展現的企圖，原則上，最好是以淨流出為主。但需要留意的是，長期來看，投資活動現金流出的金額，不宜高於營業活動現金流入金額，否則就代表企業的獲利不足以應付投資支出；即使賺的錢統統拿去再投資，也還是'
  merge: -1
  img_proc: true
- pgno: 173
  md: '不夠，也就是俗稱的「錢坑」公司。如果近 5 年投資活動現金流維持在近 5 年營業活動現金流的 6 成以下，是相對比較理想的狀態。


    # 3. 成長型公司容許適度融資增加現金流入


    融資活動現金流反映公司融資所產生的現金流狀況，例如：發行公司債、新增借款、向投資人募資等，都能透過融資讓現金流入；相反地，如果是支付現金股利或對銀行還款，就會造成融資的現金流出。


    當企業在追求成長的情況下，適度透過融資行為籌措資金，我認為有其必要。但是，如果本業沒有獲利，反而長期靠銀行借款、發行債券籌資，才能保有一線生機，這樣的公司就應該敬而遠之。


    # 4. 本期產生現金流須維持正數且逐年淨成長


    檢查完 3 大項目後，最後必須查看本期產生現金流是否為正數？如果出現負數就需要進一步檢視，找出真正的原因。投資人也別忘記，要留意最近幾年的期初與期末「現金及約當現金」的變化，通常具備投資價值的企業，長期'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 表1 台積電營業活動之現金流量逐年成長

    台積電（2330）歷年稅後淨利和現金流量簡表


