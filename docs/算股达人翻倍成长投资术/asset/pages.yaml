  md: '條件的個股後，如果標的的走勢符合「創新高」、「盤整向上」、「創高拉回」這 3 種型態其中之一，代表股票在短時間內上漲的機率大增，就有機會加速上漲的時間。


    # 創新高》高點修正後量縮，蓄積動能突破前高


    所有市場上最強勢的股票，都是一直持續創新高，因此，對於成長股的投資人來說，找出未來最具大漲潛力的股票，可以說是最重要的事。只要你的投資組合裡有 1、2 檔這種類型的股票，就能夠繳出優異的投報率。


    具備強勢上漲條件的個股，除了企業獲利成長的能力佳之外，從技術線型的角度來看，往往都具備相同的型態——股價拉回後又再創歷史或近年來的高點，並且配合成交量的溫和遞增，這樣型態的股票，通常都會有大行情的表現。


