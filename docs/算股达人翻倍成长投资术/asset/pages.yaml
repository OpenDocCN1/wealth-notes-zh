    5% 等。


    被我剔除的法則不代表不重要，而是跟其他條件相比，屬於相對次要，而我把它們列入「進場前的篩選條件」。在你已經確定想要買進的標的，並且符合「翻倍成長投資術」的條件時，就可以進一步利用「進場前的篩選條件」來幫你所選的股票做最後的檢視，如果符合絕大部分的篩選條件，就可以考慮買進。


