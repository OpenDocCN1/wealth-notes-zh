  md: '要公司基本面看起來不差，線型看起來 OK，當下剛好有題材性，我就進場。秉持波段操作的精神，一但有 20% 的價差，我就獲利出場。在當時的多頭行情下，要獲利並沒有太困難。


    雖然 2006 年、2007 年受惠於多頭行情，我累積了不少的獲利，但是，在 2008 年碰上美國次貸風暴所引發的金融海嘯，台股從 2007 年最高點 9,859
    點，一路下跌至 2008 年最低點 3,955 點後，我的股票總市值最慘蒸發了近百萬元！


    在這個過程中，我一直在思考，是不是有哪個地方錯了呢？股市真的能夠致富嗎？是我運氣不好遇到百年難得一見的金融海嘯，還是因為我的投資方法錯誤？而我所具備的專業知識似乎不足以提供我一個滿意的答案，可是不甘心就這樣離開市場。


    於是，我决定再給自己一次機會，我開始看書找答案。在工作之餘，我開始大量閱讀投資大師，例如：股神巴菲特（Warren Buffett）、傳奇基金經理人彼得・林區（Peter'
  merge: -1
