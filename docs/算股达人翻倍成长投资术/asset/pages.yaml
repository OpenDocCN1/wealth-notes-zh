- pgno: 324
  md: '未來成長潛力的個股。台股有 1,600 多檔的個股，你找不到有任何一檔股票跟加權指數的走勢完全一樣。


    我在 2011 年 5 月以 58 元開始買進美利達（9914），當時大盤指數在 9,000 點左右，後來美利達的股價從 50 多元，一路漲到 2013 年
    10 月的波段高點 238.5 元，同時期大盤卻呈現下跌走勢，甚至一度跌到 6,609 點，後來才緩緩回到 8,100 點～ 8,500 點之間。另外，2008
    年以前的熱門主流股，例如：宏達電（2498）、益通（3452）、中鋼（2002）等，則是一路向下破底，走勢也與大盤背道而馳。


    台灣加權股價指數是根據所有上市公司股票市值的總和所編製，但是，每一檔股票的走勢卻不相同。股票是否會上漲的最主要原因，還是取決於企業未來的獲利是否能成長，因此，回歸到本質來思考，除非你投資的是指數期貨、選擇權、ETF（指數股票型基金，以元大台灣
    50（0050）為代表），否則大盤指數位置對你來說影響相對有限。


    當然，我不否認，當市場遭遇系統性風險，容易導致恐慌性殺盤，絕大部分股票都難以倖免，股價在極短時間'
  merge: -1
  img_proc: true
- pgno: 325
  md: '內會發生連續重挫的可能；但是，這是股市的特性，因此控制風險顯得相當重要。想要避開系統性風險，盡可能不要使用融資，也不建議借錢買股票，最好是以短期不會使用到的資金為主，才不會在市场大跌時，因為急需資金而被迫把股票砍在低點。


    大多數的投資人把時間浪費在預測指數上，而忽略了其實企業營運前景的好壞，才是你考慮是否買進一檔股票最重要的因素；再者，影響大盤走勢的變數眾多，沒有人能每次都準確預測指數的漲跌（包括我在內），我也不覺得靠投資獲利，需要具備精準預估大盤的能力。


    從短期來看，股票的表現會受到很多層面的影響，包括市場氛圍、新聞事件、法人與主力的操作等；但是，從長期來看，股價的表現取決在企業的獲利績效，因此，與其花費心思猜測明天股市是漲是跌，不如把精力用在研究公司上。當你發掘了一檔成長潛力股，卻因為大盤指數太高而觀望，極有可能錯失了一次大波段行情！


    追根究柢，當你想要買進一檔股票，最重要的兩個問題'
  merge: -1
  img_proc: true
- pgno: 326
  md: '是，這一家公司未來的獲利成長性如何？現在的價格是否被低估？只要兩個問題的答案都是肯定，大盤指數是否在高點，就顯得沒那麼重要。


    文章終於來到尾聲了，很感謝各位讀者認真看到最後，《算股達人的翻倍成長投資術》這本著作，是一本完全以「成長股」為主的投資策略，從一開始的8大核心選股法則、進場前的最後篩選、停利與停損的運用、持股配置原則，到最後的台股實戰案例分享等，我把自己10年來閱讀、操作的完整心得，毫無保留地與大家分享；這些內容都是我從閱讀許多投資大師的精華，加上我個人的投資經驗累積而成。


    不論你是否像我過去一樣，不滿意現況，想靠投資讓自己有自由人生；或者是在市場上打滾多年、想要精益求精的投資人，都希望這本書的內容，可以帶給你一些投資上的啟發，讓你在未來的投資旅程上，能让自己的資產不斷翻倍再翻倍。


    最後我想說，投資是一條極為漫長的道路，如果想長期'
