  md: '這些是過去身為小美工的我所無法想像的，而這一改變，追根究柢只有一個原因，就是投資。因為持續不間斷的投資，所以讓我的大學能夠更加自由，更重要的是，讓我能夠有更多的時間，陪伴孩子的成長。


