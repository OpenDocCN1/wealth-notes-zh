    而言，會選擇持股續抱，但是，對於成長股的投資人來說，選擇在適當的時機獲利出場，更能保持資金的靈活度。畢竟資金有限，運用有限的時間換取極佳的報酬率，就是完成一次成功的任務。


    至於目標價的設定，投資人可以用本益成長比來計算。假設一檔股票以 50 元買進，並且設定預估目標價為 100'
