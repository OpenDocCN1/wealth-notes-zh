- pgno: 199
  md: '# Chapter 4

    擬定投資策略 奠定致勝基礎


    是，近幾年遭遇產業逆風，即使像巨大這樣體質優秀的企業，也逃不過獲利衰退的衝擊，而最現實的反映，就是股價的重挫。


    因此，當你買進一檔股票，千萬不能有跟它長相廝守的想法。當公司獲利持續成長時，你的確要持續抱股；當公司獲利已經撐不起高股價時，你應該要設法離場，盡可能維持該有的獲利，並且把目光放到下一個投資機會，才是上上策，否則，不只是獲利的減少，也是時間成本的消耗。


    投資人買進股票後，都是希望將來有一天能以更好的價格賣出，這是不變的真諦。但是，什麼時候出手脫持股才是最恰當的時機呢？我覺得有 3 個最佳的賣股時機，投資人可以選在此時脫持股：


    **時機 1》當股價到達設定的目標價**


    買股票最令人興奮的事，無非是股價大漲。當你所持有的股票，經過一段時間的等待，終於上漲至預先設定的目標價，就可以考慮獲利了結。也許對存股派的長線投資人'
  merge: -1
  img_proc: true
