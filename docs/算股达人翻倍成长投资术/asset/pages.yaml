  md: '# Chapter 3

    檢視公司體質 增加持股信心


    # 3-3

    透過負債比與利息保障倍數

    衡量企業還債能力


    在正常的情況下，我們會希望公司的負債愈低愈好，最好負債比不要超過 50%，我們想投資的是企業的獲利能力與資產而非負債。負債比過高，通常代表高額利息的支出，也代表公司在營運上承受較高的財務風險。而負債比是指企業總資產裡負債的占比，計算公式為：


    ```

    ```text

    負債比＝負債總額 ÷ 總資產 ×100%

    ```

    ```


    簡單來說，如果一家公司的負債比是 40%，代表負債金額占總資產的 4 成，也就是企業用來營運的資金，有 40% 是來自借貸。我會考慮負債比，主要是衡量企業永續經營的能力，因為企業獲利如果是來自於大量舉債與過度的槓桿操作，只要一時間誤判情勢或遭遇市場景氣迅速反轉，企業的營運就可能會曝露在危機下。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '雖然我們希望企業的負債愈少愈好，但是，並不代表我們要求公司零負債。如果企業看到未來的潛在商機，不過手上的資金不足以應付擴廠或添購設備的需求，此時適度的舉債，對於公司的成長性與股東權益都會有正面的幫助。


    # 依據產業屬性不同，負債比的標準也不相同


    此外，每個產業的屬性不同，合理的負債比也不相同。例如：台灣兩大租賃商中租-KY（5871）與裕融（9941），在 2017 年的負債比分別高達 82.8%
    與 89.6%。如果我們只看數字會覺得高得嚇人，但是，深入研究後會發現，租賃業的營運模式就是跟銀行借款，再放款或將設備租賃給所需的企業，因此，負債比自然會高於其他產業。另外，像是金融業都是拿客戶的存款保單來賺錢，因此負債比幾乎都高達
    9 成以上。投資人在考量負債比時，必須依據不同產業進行評斷。


    企業的負債種類大致可以分為流動負債與非流動負債：


    流動負債是指 1 年內到期的債務，包括應付帳款與票據、其他應付款、短期借款、遞延所得稅負債等，這些都是營'
  merge: -1
  img_proc: true
- pgno: 163
  md: '# Chapter 3

    檢視公司體質  增加持股信心


    運上無可避免的負債。非流動負債則是指到期時間在 1 年以上的債務，包括向銀行的長期借款，以及發行公司債等。


    比較值得投資人注意的是，非流動負債裡的「長期借款」與「應付公司債」，因為它們是需要支付利息的債務，我們通常希望兩者的占比不要過高。一般而言，我們會希望有息的長期負債占總資產的比重，至少維持在
    20% 以下，一旦占比太高，所需支付的利息就會大增。這個部分我們可以從利息保障倍數進一步觀察。


    利息保障倍數 = EBIT（稅前息前淨利）÷ 利息費用


    利息保障倍數就是用來評估，公司賺來的盈餘是否能償還負債的利息，是用來衡量企業支付利息費用的能力。倍數愈高，表示債權人受保障的程度愈高，也代表債務人支付利息的能力愈高。


    因此，利息保障倍數應該愈高愈好，例如：台積電（2330）2017 年底的負債總額雖然高達 4,691 億元，但是，公司總資產高達 1 兆 9,918 億元，換算下來，負債'
  merge: -1
  img_proc: true
- pgno: 164
  md: '比只有 23.6%。再從資產負債表觀察，我們可以發現，台積電沒有長期借款，只有 918 億元的應付公司債。以台積電 2017 年的 EBIT（稅前息前淨利）3,994
    億元，除以利息費用約 33 億元，利息保障倍數高達 121 倍左右，顯示台積電的資產結構優異。


    反觀航運業從 2008 年金融風暴後，產業歷經了長達 10 年的衰退期，使得大型貨櫃船業者陽明（2609）的資產品質逐年惡化，負債比也因此持續攀升。2017
    年總負債金額約 1,063 億元，雖然負債金額還不到台積電的 1/4，但是，負債比卻高達 80%。


    # 利息保障倍數逾 20 倍，代表財務狀況穩健


    如果仔細研究陽明的負債內容就會發現，非流動負債高達 620 億元，占負債總額將近 6 成，2017 年所支付的利息約 18 億 1,000 萬元。以陽明 2017
    年稅前息前淨利 24 億 4,000 萬元來計算，利息保障倍數只剩下 1.35 倍，等於辛苦一整年所賺到的淨利，扣除利息後，所剩無幾。在這樣的情況下，公司除了等待整體產業的景氣好轉'
  merge: -1
  img_proc: true
- pgno: 165
  md: '# Chapter 3

    檢視公司體質 增加持股信心


    之外，只能不斷地舉債度日；因此，投資人可以看到，陽明 2008 年的負債比只有 46%，到了 2018 年第 1 季已經來到 81%，顯示公司資產品質逐年惡化。


    根據統計，截至 2017 年底為止，台股上市櫃超過 1,600 檔股票裡，有超過 1 成個股的利息保障倍數在 2 倍以下，甚至有近百檔股票是負值，代表企業的獲利不足以支付負債的利息，如果長期下去，營運狀況將岌岌可危。


    我覺得企業經營與個人生涯在本質上是相通的，當你一整年辛勤工作所賺取的利潤，連支付銀行的利息都有問題的話，還有什麼未來性可言。相同地，如果企業的淨利光是用在支付利息上，就已經去掉一大半，還有什麼餘力能提高資本支出或增加投資，況且還沒有計算到所得稅，以及償還銀行借款本金等支出。長期來看，企業的競爭力就會逐漸流失，營運前景堪憂。


    因此，相較於比較負債比的高低，利息保障倍數更值得關注。雖然市場上大部分的說法是 5 倍以上算合格，但是，我個人認為，理想的利息保障倍數應該要 20 倍以上，而'
  merge: -1
  img_proc: true
- pgno: 166
  md: '且數值愈高愈好。換句話說，利息應該控制在稅前息前淨利的 5% 以內。較高的利息保障倍數，代表企業長期的財務相對穩健，而且產生稅後淨利的能力較佳。


    # 從流動比和速動比，輔助觀察企業償還短債能力


    除了負債比與利息保障倍數之外，如果投資人想進一步了解企業的營運體質，可以從「流動比」和「速動比」來衡量。其公式如下：


    ```

    **流動比** = 流動資產 ÷ 流動負債 × 100%

    **速動比** = (流動資產 − 存貨 − 其他資產) / 流動負債 × 100%

    ```


    流動資產指的是可以在 1 年內變現的資產，例如：現金與約當現金、應收款項、存貨等，而流動負債指的是應付票據、帳款、利息、股利、1 年內到期的短期負債等。流動比是用來衡量，公司利用流動資產償付全部流動負債的能力，雖然不同產業的經營情況不同，但是，一般認為，流動比應該高於
    150% 比較理想。'
  merge: -1
  img_proc: true
- pgno: 167
  md: '而速動比又比流動比更嚴格，是將流動資產減去變現能力較差的存貨與其他資產，剩餘金額（速動資產）就是可以立即變現的現金、約當現金、應收款項，以用來檢驗企業突然遭遇短暫危機時的償債能力。


    # 負債比最好低於 50%、流動比大於 150% 尤佳


    一般來説，速動比應該高於 100%，表示公司所擁有的現金等具有及時變現能力的速動資產與流動負債相等，代表能夠隨時償還全部的流動負債。


    雖然股價能不能上漲，跟公司的財務結構沒有直接的關係，負債比低不表示股價一定能上漲，負債比高也不代表股價會即刻下跌，但是，不代表投資人可以忽視。


    對企業而言，擁有強大的獲利能力就像一把鋒利的寶劍，而穩健的財務結構就像一面堅固的盾牌。如果防守出現漏洞，不管進攻的表現多麼突出，還是可能因為一時的疏忽，而造成失敗的結局。而負債比、流動比、速動比與利息保障倍數，展現的就是企業財務的穩定度，雖然與股價能否'
  merge: -1
  img_proc: true
- pgno: 168
  md: '大漲沒有直接的關係，但是，我還是希望買進的股票是能讓我安心睡覺的好標的。


    原則上，選擇負債比低於 50%、流動比在 150% 以上、速動比在 100% 以上、利息保障倍數在 20 倍以上的個股，會加深我的持股信心。'
  merge: -1
  img_proc: true
