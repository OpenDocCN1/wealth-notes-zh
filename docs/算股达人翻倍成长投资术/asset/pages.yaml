  md: '# Chapter 1

    導言


    距離我的第一本書《算股高手的驚人財富翻倍術！》出版到現在（截至 2018 年 10 月 1 日），已經有 2 年了。這段時間美股呈現強漲的格局，台股也搭上這波國際股市大多頭的列車，加權指數最高來到
    1 萬 1,270 點，創下 28 年新高。


    經過這幾年的實戰經驗，我把原本的「翻倍成長投資術」做了部分調整，其中最重要的地方，就是在選股法則裡加入現金股利的條件。在原本的投資策略裡，沒有現金股利這個項目，之所以會納入，是因為《約翰·聶夫談投資》這本書給我的啟發。


    約翰·聶夫（John Neff）是何許人也？他是美國先鋒溫莎基金（Vanguard Windsor Fund）的操盤人，所管理的這檔基金，累積 30 年的總投資報酬率，大勝
    S&P 500 指數（標準普爾 500 指數）達 1.4 倍。


    聶夫慣用「總報酬本益比」來評估股價的合理性，公式中的「總報酬」是指「盈餘成長率」加上「收益率（殖利率）」，對於一般投資人而言，能夠精準預測盈餘成長率'
