    # ## 用技術線型判斷進場良機，縮短時間成本


    台股屬於淺碟型市場，任何國際市場的風吹草動，我們的反應往往比其他市場來得更劇烈；因此，不管是基本面再怎麼優秀的股票，每年通常會出現一到兩次的回檔，對於有耐心的投資人，反而是提供進場的好時機。


    在正常的情形下，每次股價的下修幅度，約在 15% 左右（特殊情況也有可能回檔達 20%～25%）。當然，想要預測下跌的幅度幾乎是不可能，最好的方式是在下跌的過程中，順勢分批進場，不要奢望買在最低點，而是盡可能'
