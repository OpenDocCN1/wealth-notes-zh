  md: '# 电商的原理(传统老板必须明白)


    很多老板初涉电商，总犯同一个错误，就是不论做店铺还是做产品，都是站在自己的角度来考虑问题，我的产品那么好，为什么没有展现，为什么没有转化？


    这就是因为他们不懂电商的原理。


    电商其实和传统商业本质很像，产品为王。又很不像。传统商业由于地域的限制，会让你获得区域性的优势。而电商不同同时面对全国消费者，更要面对全国的顶级竞争者，完全消除了地域的壁垒。你要想赚钱，就必须做出真正的好产品。


    我们做电商经常说七分产品，三分运营。这里的七分产品，包含三分产品本身，两分视觉，两分背后的供应体系。（传统老板的强项就是这两分）三分运营里，也包含了团队的实力。


