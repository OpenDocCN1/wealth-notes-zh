    # 不刷单，如何让新店和新品快速有销量及搜索流量？


    这种做法是我们自己摸索出来的。初期会费一点钱。下图四款产品来自于同一家天猫，新店，从8月9日从零开始操作。我们卖的是儿童产品。


    具体做法有点像微商。安排运营，在自己朋友圈分享淘口令，以1-2折的价格卖给朋友圈的好友，注意，这个朋友圈不是鱼塘老客户，是真正的朋友圈，而鱼塘老客户很可能存在若干净的刷手号，容易被当作刷单。


    而淘口令却是淘宝支持的。我们这次操作，连淘客都没开，优惠券也没有。就是纯低价吸引朋友买，好朋友甚至白送，微信退款。直通车不开。


    我们具体做法是这样的，第一天每个链接必须完成10单，第二天20单，第三天30单左右，好评买家...


