    前几天谈到1688选品，我接着深入聊聊下1688到底是什么类型的卖家


    1688是国内整个商品信息流非常非常重要的一环，我们找货找工厂第一动作就是上1688搜索，或者百度搜索（但是百度搜索的可信度连百度自己都怀疑，这里就不谈了）。所以，我们跟他们隔着屏幕糊嘞天的到底是工厂，还是贸易商呢？其实1688商家大体分这几种：


    ①工厂


    他的心里没捞到的目标客户就是贸易商做批发。比如：通过外贸公司接外贸订单。思维没有转转过来的工厂，他肯定是不做库存的，按单生产的，所以有个鲜明的特征就是有起订量的要求。少数工厂有少量库存，但大多可能是尾货等等，批给一些电商微商销售。当然，我也不能说的太绝对，有越来越多的...


