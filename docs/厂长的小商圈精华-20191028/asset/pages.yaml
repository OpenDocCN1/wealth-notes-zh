    # 关于如何找货源


    早上圈友希望我说说这个，我微博上写过几次，有点泛，今天我就把自己最深刻的体会写在小红圈吧。


    会讲得有点细，部分内容有点基础，希望大家不要嫌我烦。


    首先我们普通人能接触到的货，主要是出现在三个环节：生产，批发，零售。我们从低到高来说。


    1.零售端，其实也是不可忽视的货源，适合搬运型卖家，比如淘宝，拼多多的东西搬到速卖通，把籍人成的东西搬到fiverr(国外的外包服务平台，服务以设计类居多，有人在上面给老外起中文名，算命生意的也不错)，这样做的好处是好找，不囤货，不容易缺货，坏处是做不大，做不久。最多满足你不上班也能养活自己的愿望，发财是不现实的。确实有被个别聪明人找到量大利润好的产品翻身的，这种个案，不适合普通人，这里就不研究了。


    2.批发端，分为线上和线下，线上以1688为主，特别是1688开通一件代发的那些厂商，可以作为小白练级的水池，因为不用囤货，轻资产起步。1688上不靠谱的工厂也很多，因此需要对工厂要有所考察，具体可以看看这条微博


