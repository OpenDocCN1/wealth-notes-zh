    一般来说，每个图有500以上展现，或拿到50以上点就就可以 了，四组为一轮，每次测完留下最好的，再跟新图片一起测。最终选点击率最高那张。


    测出最好的那张图，再去做抢位计划。


    抢位计划开始后只用这一张图，切记。因为质量最高。


