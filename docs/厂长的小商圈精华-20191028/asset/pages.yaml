    # 电商女朋友


    2019-10-23


    今天下午给公司运营人员做了新天猫运营核心的培训，鉴于平台自身卖货能力下降，搜索增量难度要求变高、直播短视频卖货成为日常，花了几天时间整理了一份脑图做再培训。

    我的店铺运营思路分三大块：单品运营、权重运营（全店）、客群运营。

    群内大部分淘系商家应该还是中小卖家，单品运营对中小卖家是最基础上手最快的运营方式。希望能够帮助大家强化一些运营基础思路。有些玩极致爆款的大卖家，说到底也是只在运营单品。

    单品运营的核心是销售件数和层级排名。

    下面6张图分别是针对单品运营模块的一个拆分：点击率提升、转化率提升、销售提升3大块的细述。销量提升再拆分成了：如何做基数量、如何做增量、如何做淘宝客、如何核算盈亏等。

