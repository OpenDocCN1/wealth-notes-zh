    # 「六個罐子」理財法


    這是由《有錢人想的和你不一樣》的作者哈福·艾克設計出的金錢管理系統，共分爲六個部分，把你的收入依不同比例放進六個帳戶中。這六個帳戶分別是「財務自由帳戶（一〇％」、「教育帳戶（一〇％」、「生活必須帳戶（五五％」、「玩樂帳戶（一〇％」、「支出用長期儲蓄帳戶（一〇％）和「贈與帳戶（五％」。


    這樣的方式較過去「理想式」的儲蓄法更適合一般人，因爲它也最容易造成儲蓄「破功」的休閒娛樂面也考慮了進去。舉例來說，一個大學畢業的新鮮人收入是22K，那他有二二〇〇元要存進「財務自由帳戶」，替未來的被動收入做準備；接著將另一筆二二〇〇元撥到「教育帳戶」中，用於課程、買賣、觀賞表演等充實自己的行動；至於最大的一筆，一一二〇〇元存在「生活必需帳戶」，用於支付日常開支；再來是二二〇〇元娛


    一生能夠積累多少財富，不取決於你能夠賺多少錢，而取決於你如何投資理財。


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_73_0.png)'
  - '[PAGE 74]


    樂費、放進「每個月都必須花光」的「玩樂帳戶」；另外二、三〇〇元存進「支用長期儲蓄帳戶」，以買車、出國之類的作為階段性目標；最後一一〇〇元則是投注購買禮物和捐款專用的「贈與帳戶」。


    這樣一來，儘管薪水只有22K，但是不管發生任何事，出現任何需求都可以兼顧到。'
