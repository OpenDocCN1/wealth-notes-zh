    投資的機會成本則是因台灣人才大量外流，導致人才尋覓不易。


    機會成本沒有正確或錯誤的概念，端看你认为值不值得以及願意負擔什麼成本而已，雖然是說成本，但實際上並不會造成帳面上的損失或收入，只是做決策時的一個參考。


    Google 全球副總裁李開復曾經說：「在成功的道路上，每個人都有選擇的權利，不要把一切歸於宿命。」「窮人一直活在無法替自己決定人生的幻想中，彷彿自己是電影裡的悲情主角，一切都是人在江湖身不由己。當你腦中只有窮人的思維，不管你選什麼，結論不是『繼續當窮人』，要不然就是『變成比現在更窮的人』。只要你真正下定決心跳出窮人的觀念，徹底擺脫宿命論的糾纏，保證你的機會成本一定可以升級到「非常有錢」或是「超級有錢」。'
