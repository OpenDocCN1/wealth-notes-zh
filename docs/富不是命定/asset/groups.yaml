  mdcn: "\n## 10 電影「當幸福來敲門」裡的法拉利\n\n電影《當幸福來敲門》，是由真實故事改編，內容描述美國買納理財公司執行長——克里斯．賈納白手起家的故事。\n\
    \n想要白手起家，需要怎樣的條件？片中的克里斯．賈納，憑藉的是堅定的目標、鍥而不捨的拚勁、務實的執行力，還有一輛法拉利。\n\n影片的一開始，他只是一個因為交不出的房租、稅金、小孩學費的父親，他每天為了賺錢絞盡腦汁，卻始終無能為力，而一切轉折都從他在路上看到的一輛法拉利開始。\n\
    \n在一天為了賺錢而奔波的早晨，他看見眼前迎面而來一輛紅色法拉利，他走向前，向法拉利的主人說：「先生，很抱歉，但我只想問你兩個問題，就是你是做什麼的？還有，你是怎麼做的？」\n\
    \n![](img/78ad5f64390102052ae3fb2c0940e6bc_246_0.png)\n\n法拉利的主人是一位股票經紀人，他向主角說：「做這行不必得要上大學，只要你精通數字，懂得待人處事。」\n\
    事後主角看著街上的人群，說了一句話：「我還記得那一刻，他們臉上看起來都超級幸福的樣子。」\n當主角看著法拉利主人臉上的微笑；看著街上每一個幸福的笑容，讓他起了一個從不曾有過的念頭，就是也許他也有能力，讓這樣的笑容也在他的兒子臉上出現。\n\
    看見這輛法拉利之後的克里斯·賈納，徹底地改變了過去的窮人思維，他知道自己有成爲富人的機會，只要他找對方法，並且不斷努力。\n這輛法拉利，成為他致富的最大關鍵。\n\
    \n## 每天沉浸在貧窮的氛圍裡，你只會逐漸習慣貧窮\n\n片中克里斯·賈納的老婆，和他也形成了強烈的對比，顯現出一個人之所以會成功，以及為什麼會持續流浪在貧窮中，無法脫身的關鍵原因。\n\
    \n遇見法拉利後的克里斯·賈納，想起他從小就精於數字，於是動了想到證券公司上班的念頭，但是他也知道，他老婆絕對第一個舉手反對。\n\n果不其然，當他表明自己想要去證券行看看有沒有機會當股票經紀人的時候，他老婆以輕蔑的語氣說：「只是想當股票經紀人而已嗎？我還以為你更想當機長呢！」\n\
    \n在這句調侃話的背後，她想表達的是一個務實的想法：「沒錢，就是好好勤奮工作就對了，不要做一些好高騖遠的夢想，先把手邊一餐的飯錢籌出來再說。」\n\n在這樣的想法下，她已經連續四個月都做雙份工作，忙到沒有時間接小孩放學，所以她痛恨老公這種不切實際的做法。也認為她老公不應該另闢蹊徑，去妄想一份難以獲得的工作，而應該要把時間全花在推銷醫療儀器上。\n\
    \n「只求把積欠的房租跟稅金繳完」，就是她最大的夢想。但是所有人都發現，在她這樣夜以繼日勤奮加班的努力之下，家中情況並沒有因此得到好轉，而一直都在逃避現實的人，其實是她自己。\n\
    \n她很務實，可是，當你還清了上個月積欠的房租，你還有這個月的，這種思考模式，只是讓你無止盡地被負債跟貧窮追著跑，並且陷入無限輪迴。\n\n在他老婆希望他不要不切實際地浪費時間到證券行，並且希望他做些可以改善家裡經濟的事情時，男主角回了一句話：「That\
    \ was What I am trying to do」\n\n其實，他們兩個人的最終目標都是改變現在貧窮的生活，但是他老婆不斷沉溺在自己只是個窮人的情境之下，對未來不敢有所期待，所以只能永遠做個洗衣工，或是像結局那樣，藉著離開來逃避現實；而主角則是對未來有盼望，並且相信自己有能力完成，接著付諸行動。\n\
    \n那台法拉利從出現在他面前那一刻，便一直留在他心中，成為他不斷向前的最大動力，也喚醒了他原本務實的窮人思維。\n\n### 找到你心中那台法拉利\n\n\
    影片的開始，我們可以看到男主角搬著一台沉重的儀器，穿梭每一家醫院，不斷地想說服醫院買下他的儀器，但是他自己也知道，這台機器的功能沒有傳統的好上多少，價格卻足足貴上一倍，根本沒有人會想買，但是為了積欠的房租、小孩的學費，他也只好繼續硬著頭皮繼續扛著機器，尋找微乎其微的成交機會。\n\
    \n他很努力，但也只像是把雙眼矇起來胡亂衝刺一樣，沒有方向，也沒有目標，把自己搞得再累，欠人家的錢還是一樣籌不出來，只能看著負債數字愈積愈多。\n\n但在見到那台法拉利後，他決定改變現在的賺錢模式，他一邊賣儀器，一邊找尋到證券行上班的機會。\n\
    \n雖然他發現成為股票經紀人是一個渺小的可能，因為證券行每半年只會招募二十個人，而在這二十人當中，也只會有個幸運兒可以雀屏中選，但他為了心裡的目標，還是決定放膽一試，因為他相信自己，而且渴望成功。\n\
    \n雖然過程中他被逐出公寓，連老婆也跑了，後來因為欠稅，連汽車旅館都待不下去。幸運一點時可以搶到教堂的住宿名額，要不然就只能露宿街頭，洗澡也只能在車站的洗手台解決。\n\
    \n而這樣悲慘的生活，非但沒有擊垮他，反而讓他更堅定想讓兒子幸福的決心，讓他賺錢的渴望更加強烈。\n\n法拉利在克里斯·賈納的心中燃起的希望，不但增強了他想要成功的欲望，還顛覆了他原本被現實所打壓的富人腦袋。最後他終於成功當上股票經紀人，後來還自己創業，成立賈納理奇證券經紀公司。\n\
    \n人人都想要成為富豪，但是你可曾想過，到底是為了什麼而使你有這樣的渴望，想要買一個名牌包？可以整天吃喝玩樂不必整天工作？\n\n其實，那台法拉利也不過只是將克里斯·賈納原本隱藏在心中對財富的渴望喚醒，然後讓他轉變思維，用富人積極、有規畫的態度去行事而已。\n\
    \n或許你自己從未曾想過你在追求的到底是什麼，這樣的盲目，讓你即使知道自已渴望財富，卻仍然用窮人的腦袋做事，沒辦法和致富扯上一點邊。\n\n找到你心中那台法拉利，貧窮或是富有，其實往往就只在一線之間。\n\
    \n![](img/78ad5f64390102052ae3fb2c0940e6bc_252_0.png)\n\n## Part 3 擁有「富人習性」，就等於擁有「富人基因」\n\
    \n### 窮人每天記帳，富人每小時查帳\n\n有句話說：「記帳是理財的第一步。」\n\n於是窮人盲目地聽話照做，乖乖地在帳本上記下每一條收入與支出，以為這樣就等於拿到富人俱樂部的入場券，結果過了好幾年，還是只能過著縮衣節食的生活，除了身上數十如一日窮酸味，身後還有一堆債主追著跑。\n\
    \n為什麼記帳會讓窮人愈來愈窮？\n\n因為記帳會讓窮人成為事後諸葛，查帳則會讓富人洞燭機先。\n\n窮人總是在數字上下文章，只是加一塊減一塊就像發生什麼大新聞似的，這樣的觀念，只能計算眼前擁有的收入與支出，而無法衡量未來的資產與負債，因此就只好在加加減減的小錢中庸碌一生。\n\
    \n富人不會把時間花在沒有效益的事情上，他們不記帳，但必定按時查帳。只有加減的數字遊戲對他們而言一點用處也沒有，衡量金錢的關鍵，應該要從「比例」開始。\n\n\
    窮人的金錢觀念是等差級數，不是賺一元就是虧一元，但富人的觀念是等比級數，轉眼之間就賺了好幾座金山銀山。\n\n#### 想打開財富之門，先了解「毛利率」這塊敲門磚\n\
    \n舉例來說，同樣類別的商品促銷，A電池從原價一百元降為五十元，B電池由兩百元降為一五〇元，窮人只會注意到不管買哪個都可以省五十元，但富人在意的是A電池的降幅是五〇%，B電池的降幅為二五%。\n\
    \n降價比例愈高，有可能是企業想用削價策略殺出重圍，也有可能是為了減少庫存壓力，當然也不排除因為毛利率變高，能忍受的降價空間變大，對富人而言，說不定有機會成為股票界的印鈔機。\n\
    \n對於富人來說，毛利率（Gross Profit Margin）是很重要的評估指標，它代表著一塊錢的收入能夠產生多少的效益，當毛利率愈高，代表營業成本下降，或是生產效能提高，也可以說是企業獲利能力的品管。\n\
    \n只是現在很多產業的毛利率都已經攤在陽光下，當上游供應商與下游零售商都知道毛利率是多少，要想獲得較高的毛利率也愈來愈困難。\n\n有位大老闆跟我分享過一個案例，因為平常工作太忙，好不容易有閒暇時間，他就帶著老婆參加一個尊榮歐洲十日遊的旅行團，因為是專門接待金字塔頂端的客人，吃住都很頂級，行程也是精挑細選，所以團費也不是普通人能負擔得起的數目。\n\
    \n出團第一天大家禮貌性地交換名片，職稱不是總經理就是董事長，唯獨一位穿運動衫的先生獨自站在一旁。那位大老闆好奇地問他在哪裡高就，對方笑著回答：「我是賣豬肉的，目前還沒有名片。」\n\
    \n此話一出，大家都驚訝不已地圍過來，從來沒有人想過賣豬肉竟然可以賣到跟企業家一起花大錢旅遊。那位先生又接著說，你們的毛利率大致上廠商心裡都有底，但我的上下游廠商不知道我的毛利率有多少，這就是賺錢的祕訣。\n\
    \n一般來說，像生技、工業電腦、電信等產業，毛利率通常比較高，而代工業相對較低，總是常常被開玩笑是「毛三到四」，但有原則就一定有例外，像晶圓雙雄之一的台積電，在今年第二季就繳出了毛利率為四九％的好成績。\n\
    \n#### 口袋多深怎知道，就看多少「每股盈餘」來報到\n\n毛利率是評估企業營運能力的指標，而每股盈餘是口袋能裝多滿的風向球。\n\n每股盈餘（Earnings\
    \ Per Share）是藉由稅後利潤與發行股數，反映出企業的獲利能力，比例愈高，表示創造之淨利愈高，分發的股利也有可能跟著變高。\n\n股神巴菲特認為穩定長期收益是賺錢的要件之一，短期的殺進殺出，一味從差價中賺取蝸頭小利，並沒有辦法有效地累積財富，因此他的獲利來源通常是每年的分紅配股或是股利分配。\n\
    \n窮人總是只會計算逢低買進、高價出售之間的落差，而富人則是掌握持續不斷的財富源頭。\n\n雖然每股盈餘大致上可以作為股利的參考，還是必須要做長期的觀察，建議投資前先可觀察過去十年的波動，若是起伏不定，很可能就是「景氣循環股」，獲利會隨著景氣與淡旺季變動；如果變化較小，表示企業獲利穩定，不容易受影響，可作為長期投資標的一。\n\
    \n除了觀察歷史走勢以外，還可搭配現金流量表相互參考。現金流量表（Cash Flow Statement）顧名思義就是現金在一段特定時間內的變動情形，有些時候會發生每股盈餘很高，但錢卻沒有回到企業本身的情況，這種帳面與實際的出入，就有可能会踩到比雞蛋水餃股更慘的地雷股。\n\
    \n窮人對於投資的態度比較消極，總認為辛苦錢很容易花為烏有，寧願每個星期都去吃美食，至少是花在自己身上，相對於窮人的想法，富人則是會將錢投進食品股，不但每年都有錢拿，還可以讓自己維持苗條的身材。\n\
    \n想變成有錢人，你得先知道有錢人都在做什麼。富人想的跟你不一樣，做的也不一樣，如果你不觀察不學習，以為用窮人習性就可以為自己的身價翻本，根本就是癡人說夢。\n\
    \n不過，想成為富人其實並不難，只要你願意把身上的窮人習性升級為富人慣性，雖然剛開始一定會發生程式不相容的成本，但最終的毛利率一定會讓你大呼值回票價。\n\n\
    ### EPS 每股盈餘\n\n每股盈餘（Earnings Per Share）是衡量每一股能夠帶來多少淨利潤的指標，通常以元來表示。EPS愈高，代表淨利潤愈多，也意味著能分給股東較多的股利。公式為\n\
    \nEPS 又可分為過去每股盈餘（Trailing EPS）以及預估每股盈餘（Forwarding EPS），若要將EPS當作股票是否適合買進的指標，你必須留意用的是過去的EPS還是預估的EPS。\n\
    \n因為股價大多反應未來，過去的數值只可作為參考，若是盲目地將歷史數據作為依據，極有可能會誤判情勢，傷及自己的荷包。\n\n另外，最常與EPS一起用來評估股票價值的工具還有本益比（Price-Earnings\
    \ Ratio），以倍數表示，也是非常實用的財務工具。\n\n## 12 同樣是錢，窮人的「銅板」特別重\n\n前陣子有本書提出了一個有趣的觀察——有錢人都用名貴的長皮夾，只要把長皮夾的價值乘上兩百倍，大約就是一個人的年收入。後來作者抱著姑且一試的心情換用了長皮夾，當他開始把皮夾裡多餘不必要的東西清理出來，竟然神奇地為自己賺進更多財富。\n\
    \n這個說法乍聽之下很荒謬，好像每個人只要先花一點錢買LV長皮夾，人生所有的問題都能迎刃而解，彷彿坐在家裡，錢就會自己從天上掉下來。\n\n然而我觀察過身邊同樣使用長皮夾的人，有些人並沒有因此踏上致富之路，依舊在過苦日子，原因是什麼？\n\
    \n不管是現在還是未來，逃避應變是唯一取勝方式。\n\n### 把錢花在刀口上，不會讓你翻身致富\n\n有個趨勢大師說過：「這個世界是平的。」\n\n目前臺灣的經濟環境正處於停滯發展階段，很多產業把生產線外移至人力低廉的國家，以致愈來愈多的正職工作轉換成派遣、外包、約聘或是時薪制，就算是身處在科技業的電子新貴，也可能因為景氣的衝擊而被迫放無薪假，甚至是裁員。\n\
    \n前陣子媒體二十四小時輪番報導高科技業裁員的後果，就是大家不敢花錢，曾經有個夜市老闆娘跟我說：「新聞現在每天都在報景氣有多差，大家都不敢消費，我們生意也一年不如一年，現在的業績只能做到二十年前的『一半！』\n\
    \n因為收入減少不花錢，所以儲蓄率愈來愈高，也許你會問，大環境不好，未來的飯碗不知在哪裡，把錢存起來未雨綢繆有錯嗎？\n\n![](img/78ad5f64390102052ae3fb2c0940e6bc_262_0.png)\n\
    \n事實上，你的消費方式，將會決定你未來會變成窮人還是富人。\n\n我曾經聽過很多上班族談論他的理財之道，最普遍的说法就是：「我的錢都花在刀口上。」所以每天花大把時間在貨比三家「省小錢」，一看到清倉大拍賣就見獵心喜，其實，锱銖計較可以省下多少銅板，才是壓垮窮人的最後一塊「磚頭」。\n\
    \n窮人之所以窮，不是因為沒有投資的資金，而是沒有讓自己變有錢的腦袋。窮人的錢幾乎拿來當作生活費用，用負債消費的方式過日子，無法轉換為創造更多收入的資本；相反地，富人之所以愈來愈有錢，是因為他們的消費都是資產性的流動。\n\
    \n富人的手邊不會留有太多現金，因為他知道鈔票每分每秒都在變薄，他們在意的是資產淨值，富人手上的鈔票跟著他們的注意力流動，在分秒間不斷轉換成不同形式的資產。\n\
    \n窮人的眼中只看得到工作收入，他們手上的鈔票無法簡化，財產只會在不知不覺中逐漸歸零，最後甚至會變成沉重的負債。\n\n大多數人還在依循著上一代對金錢的態度：先找到一個穩定工作努力向前，再把薪水拿來儲蓄買房子，這樣看似務實的理財觀念，會讓你未來遭遇到非常大的風險。\n\
    \n我的一個親戚抱持著必須先擁有自己的房子才能成家立業的觀念，所以他結婚生小孩之後買了一戶不到三十坪的市區大樓，房貸一揹就是三十年，每個月要繳三萬多元的房貸。\n\
    \n不久前他經營的小型加工廠受到金融海嘯的影響，景氣緊縮導致大客戶抽單，最後只能無奈關門大吉，一夕之間，我的親戚從小老闆變成了中年失業者，每個月三萬多元的房貸沒有為他帶來更多利益，反而成了壓垮他財務的最後一根稻草。\n\
    \n![](img/78ad5f64390102052ae3fb2c0940e6bc_264_0.png)\n\n富人會「借貸購屋」，用好債買進資產產生正的現金流，他們絕對不會「負債價購屋」，在通貨緊縮的時候，實際的利率卻是上揚的；而窮人身上的貧窮基因，讓他們總是不斷靠「借貸」買東西，持續產生負的現金流，以致財務黑洞愈來愈大洞。\n\
    \n這就是為什麼富人愈花錢愈有錢，窮人同樣花錢如流水卻欠了一屁股債，不是因為富人的八字比較重或是祖墳風水比較旺，這其中的貧富差距只是來自對金錢的態度截然不同。\n\
    \n有錢人的想法是讓錢住在「高級旅館」裡，他會開始為手邊的錢安排「最好的出路」，對於富人來說，金錢的存在價值不是把錢供起來，而是把錢花掉。\n\n很多人都是沒有目的地存著錢，當一個「守財奴」或是「屋奴」，終其生也很難變成真正的富人。\n\
    \n### 窮人無論任何情況都習慣「Show Hand」\n\n富人和窮人最大的差別在於，他們會把錢放在不同地方。\n\n「雞蛋不要放在同一個籃子裡」這個簡單的道理人人都懂，儘管如此，我還是經常聽到很多人會說：「我手上的錢全都拿來投資某支股票」或是「我的收入都用在哪裡了」，直到有一天莫名其妙被「套牢」或「斷頭」，才嚷著要去跳樓。\n\
    \n事實證明，貧窮是一種習慣，不是你的口袋有多少錢。\n\n很多人最不想要的就是債務，但是腦子裡卻沒有任何風險概念，經常用「Show Hand（梭哈）模式」拿自己畢生的積蓄到市場上豪賭一把，這就是窮人不可逆的慣性。\n\
    \n所以，想要脫貧的第一堂課，就是不要再感情用事把手上的錢「All In」，學習分配金錢用在甚麼地方非常重要。\n\n![](img/78ad5f64390102052ae3fb2c0940e6bc_266_0.png)\n\
    \n富人的致富模式基本上都遵循同一個法則，他們聚焦在「如何運用自己的金錢」，而不是如何存錢，他們不斷地把錢投資在可以創造更多現金、提供被動收入、對抗通貨膨脹，以及不斷增值的資產之上。\n\
    \n> 英國作家狄更斯的《雙城記》開頭寫著：「那是最美好的時代，也是最糟糕的時代。」\n\n現在我們也面臨了同樣的時代；美好的是，任何人都有機會在全世界經濟重新洗牌的時候，乘勢而起一躍變成富人；糟糕的是，你抱著窮人的信念兜兜轉轉了大半輩子，最後還是過著原來的窮酸日子。\n\
    \n大部分的人都逐漸淪為窮忙族與低收入戶，你每天拚命賣力工作也快要賺不到三餐溫飽的收入，想要置換你骨子裡的貧窮基因，首先，趕快丟掉窮人的信仰，克勤克儉不是你的致富聖經，鐵飯碗更不會變成你的救贖。我們總是為了一手邊沒錢而感到羞愧苦澀，只有讓自己學會用富人的想法思考，痛下決心將貧窮的內在「重新裝潢」，這才是真正讓你翻身的「富貴風水」。\n\
    \n### 國家圖書館出版品預行編目(CIP)資料\n\n富有不是命中，而是習性使然：你的窮人習性像惡犬，\n總是在家門口趕走財神／狄驤作. - 初版.\n\
