    # 錢的未來價值，取決於「現在」


    金錢的價值，會隨著時間變化而有所變動。我們第一直覺會想到的是，鈔票會因為通貨膨脹，導致其價值會隨著時間流逝。


    但矛盾的是，每個人都曉得這項理論，但是窮人卻還是會緊緊握著手中的鈔票，只敢保守地把錢全部存在銀行裡，然後眼看著這些鈔票價值愈來愈低廉。


    如果你用同樣的想法、同樣的做法，卻妄想得到完全不一樣的结果，那是不可能的。'
  - '[PAGE 134]


    世上沒有保守的富人，因為隨著未來物價的持續高漲，你的保守，只是讓你一次又一次錯過投資的最佳時機。


    二十年前，你拿著手中的積蓄，你買不起房子，你安分地每天勒緊腰帶存著錢，想著未來總有一天不必再當無殼蝸牛；但是現在你發現情況變得更糟，因為你拿著和二十年前相同的薪資，想要買翻漲了五倍的房子，你才發現，二十年前不敢買房的保守決定，讓你依舊還是買不起房子，遠離置產的目標愈來愈愈遠。


    這個時候你才不得不認命，你賺錢的速度，永遠追不上物價上漲的速度。和富人不同的是，窮人沒有注意到的是雖然鈔票會因為通膨而變得愈來愈沒有價值，但是貨幣也會因為時間的流逝而導致其一未來終值會大於現在價值」。不過這樣的理論是在金融的基礎概念之下，前提是必須經過實際的投資才能夠實現，也就是說，如果你懂得投資，金錢隨著時間在走，反而會變得愈來愈值錢。'
  - '[PAGE 135]


    其實不論什麼投資，都一定會有風險，股神巴菲特就曾經表示投資的首要原則：「一是不賠，二還是不賠。』每個人都不願賠錢，但是富人為了不賠，是採取積極態度，在投資前費盡苦心，然後把握現在每一個機會；而窮人則是消極地選擇當一個安分的守財奴，只敢做著有朝一日可能會發財的白日夢。


    如果你不從現在開始，想辦法以錢滾錢，總有一天你會發現，當下你苦苦守住的大把鈔票，到了未來，它的價值將會廉價得可憐，如果你不想看見口袋裡的鈔票一天一天地變薄，就要先學會把口袋裡的錢拿出來，要記住，現的行動，才是在未來可以增加你手中鈔票價值的最大關鍵。


    如果你用同樣的想法、同樣的做法，卻要想得到完全不一樣的結果，那是不可能的。'
