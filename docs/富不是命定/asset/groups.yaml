    根據行政院主計處最新調查，以目前法定工時來說，每周平均為四十二小時，但有四五、八%的比例，相當於三八九萬勞工，處於工作超時的情形。


    不只如此，還有一三%的人工作時數遠超於兩週八十四小時的規定，而且不只超過十二小時，換算下來每年大約超出三一二小時，等於免費幫老闆工作三十九天，此外，相較於工作時數的成長，薪資反而退後到十四年前的水準，根本就是做愈多領愈少。


    窮人總是陷入愚勤的迷思，殊不知工作時數與薪資根本是兩碼子事，就算你二四四小時都在工作，也無法成為夢想中穿金戴銀的有錢人。


    不同的是，富人通常比窮人懶惰，他們懶得浪費時間、懶得長時間工作，因此他們更懂得如何將事情做得又快又好，和愚勤相比之下，智懶反而更能成一翻事業。


    ## 智懶看似不可取，卻能成就非凡


    已故作家王大空在《笨鳥慢飛》裡，將人分為四種，除了前面提到的愚勤之外，還有形成強烈對比的智惰。


    他認為愚笨又勤快的人最不可取，因為本身腦袋就不機靈，以為自己會做事，但看在别人的眼裡都是沒事找事，而聰明又懶惰的人往往可以明辨是非黑白，能夠讓社會變得更好。


    懶惰一直是為人詬病的壞習慣，雖然列入人性的七大罪惡之一，但「富懶」卻是能造就時代創新的原動力。


    剛推出觸控式螢幕的手機時，大家都津津樂道於省力的打字模式，但 Smart International, Inc. 認為聲控是未來的趨勢，本身既帶有絕對價值，也符合消費者的行為與需求，於是
    Siri 公司因應而生。


    而已故蘋果創辦人賈伯斯在當時也沒錯過這個商機，只是富人的「智懶」讓他不會浪費時間與金錢跟著研發，而是直接收購技術逐漸成熟的 Siri 公司，迅速將其應用在手機上。


    這種做法果然再次引爆話題，Siri 的銷售量顯著提升，蘋果公司營業額開出紅盤，身為執行長的賈伯斯，不只開創手機的新境界，戶頭的數字當然也多出好幾個零。


    沒有效益的工作方式對富人來說是避之惟恐不及，因為他們懶得在同一件事上花太多時間，所以他們會用最快的方式達成目標。


    日本生物學家在一項針對螞蟻行為的研究中，發現大多數的螞蟻都很勤奮地找食物，少數螞蟻則是看起來無所事事，一旦遇到食物斷絕的危機，這些「懶螞蟻」就會帶領眾螞蟻轉移到新的糧食供應地。


    因此，「懶螞蟻效應」歸納出一個結論：懶於雜務，才能勤於動腦。這個原理同樣也能套用在富人的智懶。


    其實富人並非懶得做事，而是懶得做「雜事」，與其花大量的時間做那些無關緊要的雞毛蒜皮事，還不如思考要怎麼花最少的力氣達到最大的利益。


    窮人一直深信自身的貧窮是由於上天的捉弄以及命運的安排，卻沒想過命運其實是操縱在自己手中，不要再找藉口將寒酸的生活合理化，如果命運都是天注定，為何窮人有機會白手起家變富人，而富人也會流落街頭當窮人？


    沒有什麼事情是必然的，從現在開始，你必須屏棄窮人的執念，不要再把愚勤當作人生的燈塔，而是要將智懶奉為富貴人生的準則。


    如果你用同樣的想法、同樣的做法，卻妄想得到完全不一樣的结果，那是不可能的。


    # 5 現在，是上帝給我們最好的恩典


    世界銀行副行長林毅夫曾經說過一句話：「窮人把錢存入銀行，實際是在補貼富人。」而這樣的現象，正是導致富人愈來愈富；窮人愈來愈窮的關鍵原因。


    很多人的理財觀念，都是源自於從小父母教我們要懂得儲蓄。儲蓄，乍聽之下是美德，但是父母沒教我們的是，很多富人其實是樂於貸款買房或是做投資的，他們寧願負債一時，把握現階段的時機，而不是守著大筆財富，或是望著空空的存款，然後在未來不斷地悔恨當初沒有勇敢做出決策，然後不斷地活在懊悔裡；或是只會把眼光放在對未來的盲目期盼上。而始終搞不清楚，其實「現在」，才是決定你貧窮或富有的關鍵時間點。


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_130_0.png)


    # 執著現在的擁有，讓你未來一無所有


    成為富人的漫漫長路，必須從現在就開始，如果你始終不敢跨出第一步，和致富目標的距離就永遠不會縮短。


    窮人可以想出一百個原因，作為不願將夢想付諸行動的理由。當他們有本錢時，他們畏懼於用這筆小財富投資，因為他們害怕萬一失敗了，大半輩子的心血就會付之一炬；更別說當他們沒有本錢時，就更不願以借貸來放手一搏了，因為窮人始終認為「借貸」是一條無法回頭的不歸路。


    但其實借貸的好與壞是一種結果論，其中的區別，則是要看你如何使用這筆借來的錢，如果你獲取的利益高於成本，現在的借貸，將是成就你未來成功的關鍵。


    每個人都有成為富人的本領，只是窮人不斷地遙想著在未來的某一天，他可能會因為某些契機而致富，可是其實這些機會每天都在發生，只是被你窮人的思維掩蓋住了。


    富人創造機會，但是窮人卻不斷地扼殺機會。


    不論現在有沒有本錢，富人抓準時機，就會替自己製造致富機會，像是最近紅遍大街小巷的清玉茶飲，起初也是靠著創辦人王炳弦向銀行借貸起家的。


    王炳弦在換過二十多個工作之後，發現到如果他不從現在開始改變賺錢模式，他只能被動地追著微薄的薪水跑，也永遠無法逃脫貧窮，於是他向銀行借貸一百萬，加上自己所有老本，開始他的創業之路。


    而在一年多前，王炳弦讓清玉從中部一舉進攻北部，在臺灣的據點從原本不到五十家暴增到一百三十多家，如今在單一個據點的月營業額至少就破百萬。


    但如果是當時王炳弦沒有拿出勇氣向銀行借錢的話，今天在台北街頭不會出現大排長龍的景象，也不會有靠借貸而成功的「清玉傳奇」。


    如果你是要以借貸的錢來賺取更多的財富，你就不必害怕借貸，或者換句話說，只要你做的是投資，其獲利高於成本，你就有資格借錢，而在深思熟慮過後，「現在」就是最好的時機。


    在你們羨慕這些成功創業者的同時，你們沒有想到的是成功的背後總有個起點，窮人只會幻想未來，但又因為過度的未雨綢繆，不敢把眼光放在當下，沒有開始，雖然不會讓你失敗，但也代表你永遠跟成功絕緣。


    # 錢的未來價值，取決於「現在」


    金錢的價值，會隨著時間變化而有所變動。我們第一直覺會想到的是，鈔票會因為通貨膨脹，導致其價值會隨著時間流逝。


    但矛盾的是，每個人都曉得這項理論，但是窮人卻還是會緊緊握著手中的鈔票，只敢保守地把錢全部存在銀行裡，然後眼看著這些鈔票價值愈来愈低廉。


    如果你用同樣的想法、同樣的做法，卻妄想得到完全不一樣的结果，那是不可能的。


    世上沒有保守的富人，因為隨著未來物價的持續高漲，你的保守，只是讓你一次又一次錯過投資的最佳時機。


    二十年前，你拿著手中的積蓄，你買不起房子，你安分地每天勒緊腰帶存著錢，想著未來總有一天不必再當無殼蝸牛；但是現在你發現情況變得更糟，因為你拿著和二十年前相同的薪資，想要買翻漲了五倍的房子，你才發現，二十年前不敢買房的保守決定，讓你依舊還是買不起房子，遠離置產的目標愈來愈遠。


    這個時候你才不得不認命，你賺錢的速度，永遠追不上物價上漲的速度。和富人不同的是，窮人沒有注意到的是雖然鈔票會因為通膨而變得愈來愈沒有價值，但是貨幣也會因為時間的流逝而導致其未來終值會大於現在價值。不過這樣的理論是在金融的基礎概念之下，前提是必須經過實際的投資才能夠實現，也就是說，如果你懂得投資，金錢隨著時間在走，反而會變得愈來愈值錢。


    其實不論什麼投資，都一定會有風險，股神巴菲特就曾經表示投資的首要原則：「一是不賠，二還是不賠。」每個人都不願賠錢，但是富人為了不賠，是採取積極態度，在投資前費盡苦心，然後把握現在每一個機會；而窮人則是消極地選擇當一個安分的守財奴，只敢做著有朝一日可能會發財的白日夢。


    如果你不從現在開始，想辦法以錢滾錢，總有一天你會發現，當下你苦苦守住的大把鈔票，到了未來，它的價值將會廉價得可憐，如果你不想看見口袋裡的鈔票一天一天地變薄，就要先學會把口袋裡的錢拿出來，要記住，現在的行動，才是在未來可以增加你手中鈔票價值的最大關鍵。


    如果你用同樣的想法、同樣的做法，卻要想得到完全不一樣的結果，那是不可能的。


    # 6 街頭舉牌員的機會成本


    我曾經在十字路口等紅綠燈的時候，看到一位房地產的舉牌員，會特別讓我注意到的原因，是因爲他穿得西裝筆挺，而且年紀很輕，目測大概才接近三十歲，一般從事這類工作的人，多半是中年以上，甚至是接近銀髮族的族羣，於是我決定上前跟他交談。


    這一問，讓我大吃一驚，原來他是剛從國內知名大學畢業的博士生，念完博士原本想要擠進大學教職的宅門，但因爲職缺早已飽和，轉向業界投了幾十封履歷也同樣石沉大海，最後因爲學貸壓力與生活開銷，於是就來當舉牌員。


    這讓我想到之前的「博士雞排事件」，其實不管是誰賣雞排，反正不偷不搶，普通人根本不在乎，只是因為郭董一句：「浪費國家資源」，整件事情才鬧得沸沸揚揚。


    或許郭董只是覺得既然都念到博士，為什麼不做一些更符合你該做的事，繳了學費，學校教授也花時間栽培，卻去做門檻很低的雞排生意，完全不符合機會成本的概念。


    # 選出最適合的機會成本，就能獲得變成富人的機會


    機會成本（Opportunity Cost）也稱為「替代性成本」，是指在面對許多選項要做決策的時候，被放棄同時又擁有最高價值的方案。


    只要是兩個以上的選項以及擁有選擇權，不管你選了什麼，不管吃虧或是佔便宜，都會產生機會成本，也就是「有得必有失」的概念。


    以一開始舉牌員的例子來說，一天的工資為八百元，若是在業界工作，以博士學歷來說，平均一個月薪資約五萬元，日薪約為一六〇〇元，選擇舉牌員的機會成本是一六〇〇元，若是選擇進入業界，機會成本則是八百元。


    有些人可能會說，這種簡單的數字比大小誰都會，要是能選擇的話，誰都不會選高機會成本的選項，但事實就是你最終還是屈服於現實，選擇了讓你愈來愈窮的方案。


    窮人總是將選擇權交給命運，富人則是將它緊握在自己手中。


    如果已故的蘋果創辦人賈伯斯，當初是跟著父親的腳步去銷售車輛，而不是賣電子商品，現在就不會有一蘋果帝國了，而且以現在的發展來說，每個人一定都覺得賈伯斯去賣車子的機會成本太高了。


    機會成本愈低，表示損失愈少，選擇也愈明智，不過機會成本的高低有時候不一定能正確的衡量，像是假日要去爬山還是去海邊，不管選哪一個都無法將機會成本量化，只能由內心的滿足度來評估。


    # 無論機會成本如何變動，最重要的是你選擇了什麼


    我曾經聽過一則案例，有位從事行政工作的上班族，相對於同事在下班後去兼差賺第二份薪水，他則是選擇在下班後參加一些管理與創業的講座及課程。


    很多有兼職的同事跟他說，現在每個月薪水三萬就還不錯，要是你下班再去兼另一份工作，說不定一個月就有四萬元，不只可以存到一些錢，又可以出去玩玩吃美食，何必花那些錢去上課，讓自己的生活過得這麼刻苦。


    但他了解，每個月一萬的兼職薪水乍看之下還不錯，但誰知道以後的整個大環境會變成什麼樣子？如果去參加課程的機會成本是一萬元，那下班兼職的機會成本就可能是以後創業的十萬元收入。


    每一次的選擇，都會造就不同的人生，窮人因為短視近利，只會貪圖眼前的安逸假象，通常是用「我立刻能得到什麼」這個方向去思考，而不像富人一樣將時間軸拉長，把重點放在「如果我選了這個，會對未來有怎樣的影響」，因此，同樣是在機會成本中做選擇，但結果完全是天壤地別。


    投資人必須提防很多東西，尤其是自己。


    每個人機會成本不一樣，富人是魚與熊掌不能兼得，但窮人無論再怎麼挑，不是剩菜就是剩飯。


    另外，「不可逆」是機會成本的特性，經由每一次選擇造就的不同結果，都無法再回到尚未選擇的時候，因此，在企業內部做重要決策時，機會成本也是絕對會被列入考量的條件之一。


    因大陸的工資逐漸攀升，甚至有企業家指出大陸工資水平可能會在短時間內就超過台灣的最低薪資，台灣日月光表從今年開始，五年內會在台灣投資超過五百億以上的資金，並響應政府在二〇一一年推動「製造業回流投資扶植政策」。


    以上述例子來看，日月光到大陸投資的機會成本是無法享受最高四〇%的外籍勞工雇用比率以及一百億新台幣的銀行融資，還有相關的優惠政策。回台投資的機會成本則是因台灣人才大量外流，導致人才尋覓不易。


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_140_0.png)


    # Part 2 其實，八字不好才能成為億萬富翁


    機會成本沒有正確或錯誤的概念，端看你认为值不值得以及願意負擔什麼成本而已，雖然是說成本，但實際上並不會造成帳面上的損失或收入，只是做決策時的一個參考。


    Google 全球副總裁李開復曾經說：「在成功的道路上，每個人都有選擇的權利，不要把一切歸於宿命。」「窮人一直活在無法替自己決定人生的幻想中，彷彿自己是電影裡的悲情主角，一切都是人在江湖身不由己。當你腦中只有窮人的思維，不管你選什麼，結論不是『繼續當窮人』，要不然就是『變成比現在更窮的人』。只要你真正下定決心跳出窮人的觀念，徹底擺脫宿命論的糾纏，保證你的機會成本一定可以升級到「非常有錢」或是「超級有錢」。


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_142_0.png)


    # 機會成本


    機會成本（Opportunity Cost）是做決策時，沒有被選上並且價值最高的選項。


    機會成本又包含兩個部分：一个是顯性成本、另一個是隱性成本。顯性成本也稱為會計成本，代表自身要付出的貨幣代價，而隱性成本是捨棄選項中能得到最大回報的代價。


    舉例：李教授想參加歐洲七天六夜的旅行團，但出國的一星期就無法授課，也沒辦法舉辦講座，假設出國旅行的費用為二十萬元，授課收入為五萬元，舉辦講座收入是兩萬元。如果李教授決定出國，那他的機會成本就是二十萬＋五萬＋二＝二十七萬元。若他留下來授課、金錢上就沒有損失，只是得不到出國旅行的滿足感而已。


    ### 7 年輕時就進入大企業的窮人魔咒


    有一隻剛離群的年輕雄獅，在有機會獨自闖蕩前，就被人類抓進籠子、送到馬戲團裡。獅子從此不再狩獵，不必再為飲食的來源擔憂，改學習跳火圈之類的雜耍本事。


    過了幾年，馬戲班解散了，獅子被放回了原本的草原。獅子正當壯年，卻完全不懂得如何在草原生活；他發現在馬戲團裡學的技能完全無法用於野外，而且那些和自己同時離群的雄獅，早已各自組成了獅群，當起草原之王了。


    ### 為何年輕人該太早進入大企業？


    “到了一個程度，人要挑戰的不再是外面的世界，而是自己的舒適圈”

    （Comfort Zone）。] ——褚士瑩《給自己10樣人生禮物》。


    如果你還年輕，在經歷社會經驗前就進入穩定的大企業工作，那你就是上面的故事中的獅子。你似努力賺取每一分回報，然而你所擁有的一切，其實都是別人給予的；只要有一天這個「給予者」抽身離開，或是你被剝奪了「受僱者」的身分，你就等於失去了一切。


    或許在馬戲團營收好、顧客多的時候，獅子曾有過風光的日子，而更大的誘惑是，獅子得到了那些草原上同伴沒有的條件：飲食無缺也不必餐風露宿，這樣的環境下，原本再尖銳的爪和牙都會漸漸變鈍，並且忘記狩獵的本能；只有跳火圈的技巧愈來愈洗練，但就算身懷這樣的技能，只要離開馬戲團，就變得一點用也沒有。


    馬戲團就是獅子的「舒適圈」。對於身處大公司的你來說，或許認為現在的情況稱不上舒適，畢竟公司常逼著你加班或「跳火圈」；然而真相是，你已處在比出外謀生的人更高的穩定中，免卻生存本應面對的風險。


    穩定的環境帶給我們「此生完滿」的錯覺，錯以為世界以公司為中心運轉，凡事以公司的利益為優先，期待有朝一日能被提拔到僅次於老闆的高位。


    然而當你安於當一名受雇者，就等於接受自己只是顆小齒輪，完全得照定義好的軌跡運轉。你看不清機房的全貌，只能固守自己運行的方寸之地，撇開成就感不談，你已經失去了客觀競爭的能力。


    對於長久待在舒適圈裡的人而言，面對不熟悉的事物或挑戰很容易感到不適，就算後來有心離開，這樣的不適感還是會再度驅使你回到舒適圈中，就像被圈禁久了的獅子不想再離開囚籠。


    最近，一名友人脫離高壓的科技業，進入一家貿易公司擔任 IT（資訊科技人員）的工作。


    起初，由於新工作較原本工程師的職務輕鬆，朝九晚五的日子讓朋友如魚得水；但這種日子過久了之後，朋友認為生活缺乏挑戰和前景，於是再度來求職網站搜尋職缺，可是不同於上一次的順利，這一次他驚呼：「怎麼每個工作都這麼困難！」


    我建議他趕緊換個工作，這是典型在舒適圈裡待久了，競爭力下降的警訊。這樣的環境若繼續待下去，不僅無法發展個人的長才，更讓工作變得枯燥乏味；沒有風險，卻也再不會進步了。


    # 甘於只做「手藝人」，就要有隨時被取代的準備


    所以說富人學管理，窮人才學手藝。


    技術再好，始終只是為人作嫁的「手藝人」，一旦出現更年輕、更厲害的技術者，就只能面臨被替換的命運。


    不是說專業不重要，而是在追求技術的精進時，必須轉換想法，引用褚士瑩在《給自己10樣人生禮物》中的看法就是：「只要讓自己成爲一個有專業的人，『生存』就覺得很簡單了，錢不夠的話總是再賺就有，工作沒了的話總是再找就有。」


    要能像離群的雄獅在遼闊草原上行走，具有帶著你的『手藝』遠行的勇氣，才能在瞬息萬變的環境中生存。


    一般獅子群在離群後，會隻身在草原闖蕩，也許一開始四處漂泊流浪、過著有一餐沒一餐的日子，但是在這樣的過程中，打獵的技巧會日漸成熟，並結識同樣流浪的母獅、繁衍幼獅，開始以家族為單位的狩獵行動，久而久之，會形成一支強大的群體。


    經過此番磨練的獅子，會成為名符其實的「王者」。這樣的獅子擁有實戰淬煉出的尖齒與利牙，甚至在統領群獅後，不至因為安逸而失去鬥志，懂得為可能發生的危機儲備體力。


    年輕人需要向中小企業學習的，就是這樣的能力和見識。比起在大企業待到退休才能看盡職場百態，小型企業就像一台微縮廠房，能從較全觀的角度看待事情的運作，更容易發現問題的癥結。


    對於不甘只當一顆小螺絲釘，積極想致富的人來說，小公司的高機會、高風險相當適合你。


    中小企業容易受大環境的影響，而景氣就好比草原上的氣候，氣候不佳時，待在馬戲團的獅子能不受影響；而面對惡劣氣候的衝擊，草原上的獅子勢必面臨食物減少的生存壓力。但是當氣候再度好轉時，渡過飢餓危機的草原獅子，將有機會成為主宰獅群的新一代王者。


    # 舒適圈


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_149_0.png)


    心理學上的一種精神狀態，指人對所處環境和習慣產生依賴，並且久處在這種安適的狀態，因而喪失危機意識。舒適圈（Comfort Zone）會帶來非理性的安全感，並產生惰性，造成他將傾向於待在目前的舒適圈內，不想再離開。


    舉凡因轉學而適應不良的孩童、不願改變工作模式的老職員，或者出國還堅持要吃台菜的遊客，都可能是因为脫離舒適圈而產生排斥，急於尋求安全感的案例。


    而像尼特族（NEET，指非受教、非受僱者）就是舒適圈極小的例子，有甚者會把生活範圍框架在一個房間之內，形成以自我為中心的舒適圈。


    如果一個人走出自己的舒適圈，就表示他必須在新的環境中發展出不同以往的行動方式，也面臨新的挑戰。

    '
  mdcn: '

    根據行政院主計處最新調查，以目前法定工時來說，每周平均為四十二小時，但有四五、八%的比例，相當於三八九萬勞工，處於工作超時的情形。


    不只如此，還有一三%的人工作時數遠超於兩週八十四小時的規定，而且不只超過十二小時，換算下來每年大約超出三一二小時，等於免費幫老闆工作三十九天，此外，相較於工作時數的成長，薪資反而退後到十四年前的水準，根本就是做愈多領愈少。


    窮人總是陷入愚勤的迷思，殊不知工作時數與薪資根本是兩碼子事，就算你二四四小時都在工作，也無法成為夢想中穿金戴銀的有錢人。


    不同的是，富人通常比窮人懶惰，他們懶得浪費時間、懶得長時間工作，因此他們更懂得如何將事情做得又快又好，和愚勤相比之下，智懶反而更能成一翻事業。


    ## 智懶看似不可取，卻能成就非凡


    已故作家王大空在《笨鳥慢飛》裡，將人分為四種，除了前面提到的愚勤之外，還有形成強烈對比的智惰。


    他認為愚笨又勤快的人最不可取，因為本身腦袋就不機靈，以為自己會做事，但看在别人的眼裡都是沒事找事，而聰明又懶惰的人往往可以明辨是非黑白，能夠讓社會變得更好。


    懶惰一直是為人詬病的壞習慣，雖然列入人性的七大罪惡之一，但「富懶」卻是能造就時代創新的原動力。


    剛推出觸控式螢幕的手機時，大家都津津樂道於省力的打字模式，但 Smart International, Inc. 認為聲控是未來的趨勢，本身既帶有絕對價值，也符合消費者的行為與需求，於是
    Siri 公司因應而生。


    而已故蘋果創辦人賈伯斯在當時也沒錯過這個商機，只是富人的「智懶」讓他不會浪費時間與金錢跟著研發，而是直接收購技術逐漸成熟的 Siri 公司，迅速將其應用在手機上。


    這種做法果然再次引爆話題，Siri 的銷售量顯著提升，蘋果公司營業額開出紅盤，身為執行長的賈伯斯，不只開創手機的新境界，戶頭的數字當然也多出好幾個零。


    沒有效益的工作方式對富人來說是避之惟恐不及，因為他們懶得在同一件事上花太多時間，所以他們會用最快的方式達成目標。


    日本生物學家在一項針對螞蟻行為的研究中，發現大多數的螞蟻都很勤奮地找食物，少數螞蟻則是看起來無所事事，一旦遇到食物斷絕的危機，這些「懶螞蟻」就會帶領眾螞蟻轉移到新的糧食供應地。


    因此，「懶螞蟻效應」歸納出一個結論：懶於雜務，才能勤於動腦。這個原理同樣也能套用在富人的智懶。


    其實富人並非懶得做事，而是懶得做「雜事」，與其花大量的時間做那些無關緊要的雞毛蒜皮事，還不如思考要怎麼花最少的力氣達到最大的利益。


    窮人一直深信自身的貧窮是由於上天的捉弄以及命運的安排，卻沒想過命運其實是操縱在自己手中，不要再找藉口將寒酸的生活合理化，如果命運都是天注定，為何窮人有機會白手起家變富人，而富人也會流落街頭當窮人？


    沒有什麼事情是必然的，從現在開始，你必須屏棄窮人的執念，不要再把愚勤當作人生的燈塔，而是要將智懶奉為富貴人生的準則。


    如果你用同樣的想法、同樣的做法，卻妄想得到完全不一樣的结果，那是不可能的。


    # 5 現在，是上帝給我們最好的恩典


    世界銀行副行長林毅夫曾經說過一句話：「窮人把錢存入銀行，實際是在補貼富人。」而這樣的現象，正是導致富人愈來愈富；窮人愈來愈窮的關鍵原因。


    很多人的理財觀念，都是源自於從小父母教我們要懂得儲蓄。儲蓄，乍聽之下是美德，但是父母沒教我們的是，很多富人其實是樂於貸款買房或是做投資的，他們寧願負債一時，把握現階段的時機，而不是守著大筆財富，或是望著空空的存款，然後在未來不斷地悔恨當初沒有勇敢做出決策，然後不斷地活在懊悔裡；或是只會把眼光放在對未來的盲目期盼上。而始終搞不清楚，其實「現在」，才是決定你貧窮或富有的關鍵時間點。


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_130_0.png)


    # 執著現在的擁有，讓你未來一無所有


    成為富人的漫漫長路，必須從現在就開始，如果你始終不敢跨出第一步，和致富目標的距離就永遠不會縮短。


    窮人可以想出一百個原因，作為不願將夢想付諸行動的理由。當他們有本錢時，他們畏懼於用這筆小財富投資，因為他們害怕萬一失敗了，大半輩子的心血就會付之一炬；更別說當他們沒有本錢時，就更不願以借貸來放手一搏了，因為窮人始終認為「借貸」是一條無法回頭的不歸路。


    但其實借貸的好與壞是一種結果論，其中的區別，則是要看你如何使用這筆借來的錢，如果你獲取的利益高於成本，現在的借貸，將是成就你未來成功的關鍵。


    每個人都有成為富人的本領，只是窮人不斷地遙想著在未來的某一天，他可能會因為某些契機而致富，可是其實這些機會每天都在發生，只是被你窮人的思維掩蓋住了。


    富人創造機會，但是窮人卻不斷地扼殺機會。


    不論現在有沒有本錢，富人抓準時機，就會替自己製造致富機會，像是最近紅遍大街小巷的清玉茶飲，起初也是靠著創辦人王炳弦向銀行借貸起家的。


    王炳弦在換過二十多個工作之後，發現到如果他不從現在開始改變賺錢模式，他只能被動地追著微薄的薪水跑，也永遠無法逃脫貧窮，於是他向銀行借貸一百萬，加上自己所有老本，開始他的創業之路。


    而在一年多前，王炳弦讓清玉從中部一舉進攻北部，在臺灣的據點從原本不到五十家暴增到一百三十多家，如今在單一個據點的月營業額至少就破百萬。


    但如果是當時王炳弦沒有拿出勇氣向銀行借錢的話，今天在台北街頭不會出現大排長龍的景象，也不會有靠借貸而成功的「清玉傳奇」。


    如果你是要以借貸的錢來賺取更多的財富，你就不必害怕借貸，或者換句話說，只要你做的是投資，其獲利高於成本，你就有資格借錢，而在深思熟慮過後，「現在」就是最好的時機。


    在你們羨慕這些成功創業者的同時，你們沒有想到的是成功的背後總有個起點，窮人只會幻想未來，但又因為過度的未雨綢繆，不敢把眼光放在當下，沒有開始，雖然不會讓你失敗，但也代表你永遠跟成功絕緣。


    # 錢的未來價值，取決於「現在」


    金錢的價值，會隨著時間變化而有所變動。我們第一直覺會想到的是，鈔票會因為通貨膨脹，導致其價值會隨著時間流逝。


    但矛盾的是，每個人都曉得這項理論，但是窮人卻還是會緊緊握著手中的鈔票，只敢保守地把錢全部存在銀行裡，然後眼看著這些鈔票價值愈来愈低廉。


    如果你用同樣的想法、同樣的做法，卻妄想得到完全不一樣的结果，那是不可能的。


    世上沒有保守的富人，因為隨著未來物價的持續高漲，你的保守，只是讓你一次又一次錯過投資的最佳時機。


    二十年前，你拿著手中的積蓄，你買不起房子，你安分地每天勒緊腰帶存著錢，想著未來總有一天不必再當無殼蝸牛；但是現在你發現情況變得更糟，因為你拿著和二十年前相同的薪資，想要買翻漲了五倍的房子，你才發現，二十年前不敢買房的保守決定，讓你依舊還是買不起房子，遠離置產的目標愈來愈遠。


    這個時候你才不得不認命，你賺錢的速度，永遠追不上物價上漲的速度。和富人不同的是，窮人沒有注意到的是雖然鈔票會因為通膨而變得愈來愈沒有價值，但是貨幣也會因為時間的流逝而導致其未來終值會大於現在價值。不過這樣的理論是在金融的基礎概念之下，前提是必須經過實際的投資才能夠實現，也就是說，如果你懂得投資，金錢隨著時間在走，反而會變得愈來愈值錢。


    其實不論什麼投資，都一定會有風險，股神巴菲特就曾經表示投資的首要原則：「一是不賠，二還是不賠。」每個人都不願賠錢，但是富人為了不賠，是採取積極態度，在投資前費盡苦心，然後把握現在每一個機會；而窮人則是消極地選擇當一個安分的守財奴，只敢做著有朝一日可能會發財的白日夢。


    如果你不從現在開始，想辦法以錢滾錢，總有一天你會發現，當下你苦苦守住的大把鈔票，到了未來，它的價值將會廉價得可憐，如果你不想看見口袋裡的鈔票一天一天地變薄，就要先學會把口袋裡的錢拿出來，要記住，現在的行動，才是在未來可以增加你手中鈔票價值的最大關鍵。


    如果你用同樣的想法、同樣的做法，卻要想得到完全不一樣的結果，那是不可能的。


    # 6 街頭舉牌員的機會成本


    我曾經在十字路口等紅綠燈的時候，看到一位房地產的舉牌員，會特別讓我注意到的原因，是因爲他穿得西裝筆挺，而且年紀很輕，目測大概才接近三十歲，一般從事這類工作的人，多半是中年以上，甚至是接近銀髮族的族羣，於是我決定上前跟他交談。


    這一問，讓我大吃一驚，原來他是剛從國內知名大學畢業的博士生，念完博士原本想要擠進大學教職的宅門，但因爲職缺早已飽和，轉向業界投了幾十封履歷也同樣石沉大海，最後因爲學貸壓力與生活開銷，於是就來當舉牌員。


    這讓我想到之前的「博士雞排事件」，其實不管是誰賣雞排，反正不偷不搶，普通人根本不在乎，只是因為郭董一句：「浪費國家資源」，整件事情才鬧得沸沸揚揚。


    或許郭董只是覺得既然都念到博士，為什麼不做一些更符合你該做的事，繳了學費，學校教授也花時間栽培，卻去做門檻很低的雞排生意，完全不符合機會成本的概念。


    # 選出最適合的機會成本，就能獲得變成富人的機會


    機會成本（Opportunity Cost）也稱為「替代性成本」，是指在面對許多選項要做決策的時候，被放棄同時又擁有最高價值的方案。


    只要是兩個以上的選項以及擁有選擇權，不管你選了什麼，不管吃虧或是佔便宜，都會產生機會成本，也就是「有得必有失」的概念。


    以一開始舉牌員的例子來說，一天的工資為八百元，若是在業界工作，以博士學歷來說，平均一個月薪資約五萬元，日薪約為一六〇〇元，選擇舉牌員的機會成本是一六〇〇元，若是選擇進入業界，機會成本則是八百元。


    有些人可能會說，這種簡單的數字比大小誰都會，要是能選擇的話，誰都不會選高機會成本的選項，但事實就是你最終還是屈服於現實，選擇了讓你愈來愈窮的方案。


    窮人總是將選擇權交給命運，富人則是將它緊握在自己手中。


    如果已故的蘋果創辦人賈伯斯，當初是跟著父親的腳步去銷售車輛，而不是賣電子商品，現在就不會有一蘋果帝國了，而且以現在的發展來說，每個人一定都覺得賈伯斯去賣車子的機會成本太高了。


    機會成本愈低，表示損失愈少，選擇也愈明智，不過機會成本的高低有時候不一定能正確的衡量，像是假日要去爬山還是去海邊，不管選哪一個都無法將機會成本量化，只能由內心的滿足度來評估。


    # 無論機會成本如何變動，最重要的是你選擇了什麼


    我曾經聽過一則案例，有位從事行政工作的上班族，相對於同事在下班後去兼差賺第二份薪水，他則是選擇在下班後參加一些管理與創業的講座及課程。


    很多有兼職的同事跟他說，現在每個月薪水三萬就還不錯，要是你下班再去兼另一份工作，說不定一個月就有四萬元，不只可以存到一些錢，又可以出去玩玩吃美食，何必花那些錢去上課，讓自己的生活過得這麼刻苦。


    但他了解，每個月一萬的兼職薪水乍看之下還不錯，但誰知道以後的整個大環境會變成什麼樣子？如果去參加課程的機會成本是一萬元，那下班兼職的機會成本就可能是以後創業的十萬元收入。


    每一次的選擇，都會造就不同的人生，窮人因為短視近利，只會貪圖眼前的安逸假象，通常是用「我立刻能得到什麼」這個方向去思考，而不像富人一樣將時間軸拉長，把重點放在「如果我選了這個，會對未來有怎樣的影響」，因此，同樣是在機會成本中做選擇，但結果完全是天壤地別。


    投資人必須提防很多東西，尤其是自己。


    每個人機會成本不一樣，富人是魚與熊掌不能兼得，但窮人無論再怎麼挑，不是剩菜就是剩飯。


    另外，「不可逆」是機會成本的特性，經由每一次選擇造就的不同結果，都無法再回到尚未選擇的時候，因此，在企業內部做重要決策時，機會成本也是絕對會被列入考量的條件之一。


    因大陸的工資逐漸攀升，甚至有企業家指出大陸工資水平可能會在短時間內就超過台灣的最低薪資，台灣日月光表從今年開始，五年內會在台灣投資超過五百億以上的資金，並響應政府在二〇一一年推動「製造業回流投資扶植政策」。


    以上述例子來看，日月光到大陸投資的機會成本是無法享受最高四〇%的外籍勞工雇用比率以及一百億新台幣的銀行融資，還有相關的優惠政策。回台投資的機會成本則是因台灣人才大量外流，導致人才尋覓不易。


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_140_0.png)


    # Part 2 其實，八字不好才能成為億萬富翁


    機會成本沒有正確或錯誤的概念，端看你认为值不值得以及願意負擔什麼成本而已，雖然是說成本，但實際上並不會造成帳面上的損失或收入，只是做決策時的一個參考。


    Google 全球副總裁李開復曾經說：「在成功的道路上，每個人都有選擇的權利，不要把一切歸於宿命。」「窮人一直活在無法替自己決定人生的幻想中，彷彿自己是電影裡的悲情主角，一切都是人在江湖身不由己。當你腦中只有窮人的思維，不管你選什麼，結論不是『繼續當窮人』，要不然就是『變成比現在更窮的人』。只要你真正下定決心跳出窮人的觀念，徹底擺脫宿命論的糾纏，保證你的機會成本一定可以升級到「非常有錢」或是「超級有錢」。


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_142_0.png)


    # 機會成本


    機會成本（Opportunity Cost）是做決策時，沒有被選上並且價值最高的選項。


    機會成本又包含兩個部分：一个是顯性成本、另一個是隱性成本。顯性成本也稱為會計成本，代表自身要付出的貨幣代價，而隱性成本是捨棄選項中能得到最大回報的代價。


    舉例：李教授想參加歐洲七天六夜的旅行團，但出國的一星期就無法授課，也沒辦法舉辦講座，假設出國旅行的費用為二十萬元，授課收入為五萬元，舉辦講座收入是兩萬元。如果李教授決定出國，那他的機會成本就是二十萬＋五萬＋二＝二十七萬元。若他留下來授課、金錢上就沒有損失，只是得不到出國旅行的滿足感而已。


    ### 7 年輕時就進入大企業的窮人魔咒


    有一隻剛離群的年輕雄獅，在有機會獨自闖蕩前，就被人類抓進籠子、送到馬戲團裡。獅子從此不再狩獵，不必再為飲食的來源擔憂，改學習跳火圈之類的雜耍本事。


    過了幾年，馬戲班解散了，獅子被放回了原本的草原。獅子正當壯年，卻完全不懂得如何在草原生活；他發現在馬戲團裡學的技能完全無法用於野外，而且那些和自己同時離群的雄獅，早已各自組成了獅群，當起草原之王了。


    ### 為何年輕人該太早進入大企業？


    “到了一個程度，人要挑戰的不再是外面的世界，而是自己的舒適圈”

    （Comfort Zone）。] ——褚士瑩《給自己10樣人生禮物》。


    如果你還年輕，在經歷社會經驗前就進入穩定的大企業工作，那你就是上面的故事中的獅子。你似努力賺取每一分回報，然而你所擁有的一切，其實都是別人給予的；只要有一天這個「給予者」抽身離開，或是你被剝奪了「受僱者」的身分，你就等於失去了一切。


    或許在馬戲團營收好、顧客多的時候，獅子曾有過風光的日子，而更大的誘惑是，獅子得到了那些草原上同伴沒有的條件：飲食無缺也不必餐風露宿，這樣的環境下，原本再尖銳的爪和牙都會漸漸變鈍，並且忘記狩獵的本能；只有跳火圈的技巧愈來愈洗練，但就算身懷這樣的技能，只要離開馬戲團，就變得一點用也沒有。


    馬戲團就是獅子的「舒適圈」。對於身處大公司的你來說，或許認為現在的情況稱不上舒適，畢竟公司常逼著你加班或「跳火圈」；然而真相是，你已處在比出外謀生的人更高的穩定中，免卻生存本應面對的風險。


    穩定的環境帶給我們「此生完滿」的錯覺，錯以為世界以公司為中心運轉，凡事以公司的利益為優先，期待有朝一日能被提拔到僅次於老闆的高位。


    然而當你安於當一名受雇者，就等於接受自己只是顆小齒輪，完全得照定義好的軌跡運轉。你看不清機房的全貌，只能固守自己運行的方寸之地，撇開成就感不談，你已經失去了客觀競爭的能力。


    對於長久待在舒適圈裡的人而言，面對不熟悉的事物或挑戰很容易感到不適，就算後來有心離開，這樣的不適感還是會再度驅使你回到舒適圈中，就像被圈禁久了的獅子不想再離開囚籠。


    最近，一名友人脫離高壓的科技業，進入一家貿易公司擔任 IT（資訊科技人員）的工作。


    起初，由於新工作較原本工程師的職務輕鬆，朝九晚五的日子讓朋友如魚得水；但這種日子過久了之後，朋友認為生活缺乏挑戰和前景，於是再度來求職網站搜尋職缺，可是不同於上一次的順利，這一次他驚呼：「怎麼每個工作都這麼困難！」


    我建議他趕緊換個工作，這是典型在舒適圈裡待久了，競爭力下降的警訊。這樣的環境若繼續待下去，不僅無法發展個人的長才，更讓工作變得枯燥乏味；沒有風險，卻也再不會進步了。


    # 甘於只做「手藝人」，就要有隨時被取代的準備


    所以說富人學管理，窮人才學手藝。


    技術再好，始終只是為人作嫁的「手藝人」，一旦出現更年輕、更厲害的技術者，就只能面臨被替換的命運。


    不是說專業不重要，而是在追求技術的精進時，必須轉換想法，引用褚士瑩在《給自己10樣人生禮物》中的看法就是：「只要讓自己成爲一個有專業的人，『生存』就覺得很簡單了，錢不夠的話總是再賺就有，工作沒了的話總是再找就有。」


    要能像離群的雄獅在遼闊草原上行走，具有帶著你的『手藝』遠行的勇氣，才能在瞬息萬變的環境中生存。


    一般獅子群在離群後，會隻身在草原闖蕩，也許一開始四處漂泊流浪、過著有一餐沒一餐的日子，但是在這樣的過程中，打獵的技巧會日漸成熟，並結識同樣流浪的母獅、繁衍幼獅，開始以家族為單位的狩獵行動，久而久之，會形成一支強大的群體。


    經過此番磨練的獅子，會成為名符其實的「王者」。這樣的獅子擁有實戰淬煉出的尖齒與利牙，甚至在統領群獅後，不至因為安逸而失去鬥志，懂得為可能發生的危機儲備體力。


    年輕人需要向中小企業學習的，就是這樣的能力和見識。比起在大企業待到退休才能看盡職場百態，小型企業就像一台微縮廠房，能從較全觀的角度看待事情的運作，更容易發現問題的癥結。


    對於不甘只當一顆小螺絲釘，積極想致富的人來說，小公司的高機會、高風險相當適合你。


    中小企業容易受大環境的影響，而景氣就好比草原上的氣候，氣候不佳時，待在馬戲團的獅子能不受影響；而面對惡劣氣候的衝擊，草原上的獅子勢必面臨食物減少的生存壓力。但是當氣候再度好轉時，渡過飢餓危機的草原獅子，將有機會成為主宰獅群的新一代王者。


    # 舒適圈


    ![](img/78ad5f64390102052ae3fb2c0940e6bc_149_0.png)


    心理學上的一種精神狀態，指人對所處環境和習慣產生依賴，並且久處在這種安適的狀態，因而喪失危機意識。舒適圈（Comfort Zone）會帶來非理性的安全感，並產生惰性，造成他將傾向於待在目前的舒適圈內，不想再離開。


    舉凡因轉學而適應不良的孩童、不願改變工作模式的老職員，或者出國還堅持要吃台菜的遊客，都可能是因为脫離舒適圈而產生排斥，急於尋求安全感的案例。


    而像尼特族（NEET，指非受教、非受僱者）就是舒適圈極小的例子，有甚者會把生活範圍框架在一個房間之內，形成以自我為中心的舒適圈。


    如果一個人走出自己的舒適圈，就表示他必須在新的環境中發展出不同以往的行動方式，也面臨新的挑戰。

    '
