    # 序言


    2018 年 8 月 8 号，就像 2008 年 8 月 8 号一样是一个比较神奇的日子，我就想在这么吉利的日子要做点什么，想了想就做我现在最喜欢做的事情“分享+赚钱”那就是：就聊挣钱。


    挣钱真的是一件非常有意思的事情，我相信每个人都有强烈的赚钱欲望，当然也包括我。一方面挣钱可以改善我们的生活，另外通过了解挣钱方式可以打开一个新世界，经常会给我一种：哇！原来可以是这样的感觉。


    赚钱可以激发每个人的潜力，有人就抓住了一个点深挖了进去，做专做深做强做大，从而获得巨大的成功。当然了，任何伟大的思想如果不实施就是零，开始很难很难，开始了之后也难，但一旦突破了那个瓶颈之后，就会爆发式的增长，后期我会给大家分享这块的内容。


    在我的博客公众号访问量越来越大的时候，帮助我连接了越来越多的人，有各大技术社区的运营人员、各技术社区的知名博主、IT 行业大佬、各公司 CTO、还有很多创业者。

    通过这些人又让我了解到更多的可能性，到了后来你会发现站在外面的人很难进来；一旦进来了，有了第一个可能性，并持续坚持下去，就会发现后面的机会就越来越多。就印证了那句话，越小越弱，越大越强，因此希望通过这个圈子可以共同激励前进。


    所以我创建这个圈子有几个目的：


    +   1. 分享我的挣钱思路以及我对此的实践经历；

    2. 连接更多和我一样具有强烈欲望又肯坚持实践的朋友，一起探讨赚钱、创业思维和套路。

    3. 帮助大家连接一些我的资源，也可以帮助我认识跟多的朋友。

    4. 如果这一年你通过此圈子，收获了一个创意想法，实践了一个赚钱的方式，我认为就值了。

    5. 如果加入圈子什么也不做就想赚到钱，估计这个圈子不太适合你。

    6. 交流碰撞是产生好创意的最佳方式，通过交流也促进了更加深入的理解，推荐积极参与交流。


    以上就是我创建《就聊挣钱》知识星球的初衷，后来我又增加了一些延伸，例如在知识星球中寻找一些合作伙伴。


    2019 年《就聊挣钱》知识星球第二期，我们会增加更多好玩的东西在星球内，并且会组织多次的线下交流碰撞，2019 年一起见证更多精彩。'
