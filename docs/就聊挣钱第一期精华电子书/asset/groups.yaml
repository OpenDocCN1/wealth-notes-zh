    根据 alexa 中国查询的数据可以看出网站的日均 UV 在 16 万左右，也就意味着每天大概有近 10 万左右的用户来访问网站，流量非常可观。


    目前这个网址的盈利方式：


    ## 一、域名出售


    作者自己手上屯了大概十几个域名，正在出售。因为我自己也有近百个域名，所以据我所知，这方面的收入非常难，估计很难卖出去几个。


