    # 技术人做公众号能不能挣钱


    在没有做公众号之前，我写了一年多的博客，在博客的同时认识了一些朋友，发现很多和我同样写技术博客的博主都开通了技术公众号，那个时间我也比较奇怪为什么大家都喜欢开通技术公众号呢？这个疑问直到我开通自己的公众号半年之'
  - '[PAGE 28]


    后我知晓。


    我写博客一年多的时间，除过为 51CTO 技术博客投稿以外，没有过任何其它收入。在这里我多说两句，其实很多技术公众号都是接受技术文章投稿的，会有稿费，比如
    51CTO 技术公众号，如果投稿被采用每篇文章会有 500 元的收入。51CTO 官方等技术公众号也都接受投稿，有的高达一篇 1000 元左右。


    开通技术公众号最大的感受是和读者的距离更近了，方便用户点赞、阅读、转发，对个人品牌也是一个很不错的宣传途径，比如我近期转载的沉默王二的文章《为了完成月入三万的目标，我都做了哪些准备？》https://mp.weixin.qq.com/s/WcN5bkvFrCNZiJv-KEx4qw，对个人是一个非常好的宣传途径。


    但写公众号最大最持久的动力是收入，前面说过写博客一年多的时间没有一点收入，虽然当初写博客也不是为了有收入，但是能有收入谁又会嫌弃呢！而开通微信公众号半年之后，就迎来了人生第一个商业广告。那时候甚至都不知道该要多少钱，最后定了一个月推
    8 篇文章，每篇文章后面贴一个广告贴片给 1000 元。


    在微信公众号上写文章会有三方面的收入：流量主广告、赞赏收入、接外部广告。当你的微信公众号读者大于 5000 后，就可以开通自己的流量主，也就是微信文章最下面的那一张卡片广告，这部分收入其实很少，像我现在这个级别每天流量主的收入在
    20-40 左右，就是一顿午餐钱。


    赞赏收入是这三块收入中最少的，几乎可以忽略不计，但赞赏却是鼓舞作者持续写作的最大动力，用钱给予的投票绝对是最真实的认可，不论金额大小；接外部广告才是公众号最主要的收入，这个主要看公众号的定位和读者质量，有的公众号几百块就可以发，有的公众号甚至要上万。


    技术号的收费标准公认的价格是一个阅读量一元钱，也就是说如果你的公众号一周发了五篇文章，每篇文章的阅读量大概是 5000 左右，那么当广告商找你的时候，你就可以报价
    5000 元，基本就可以成交。


    在这个报价的基础上，不同的公众号会根据情况又上浮或者下调，财经类的公众号，一个阅读可以高达 2-3 元，情感类的公众号报价和技术号差不多。另外又一些网红公众号报价很高，比如我公众号转发文章的
    听脑湿 或者 今夜 90 后等公众号，每条广告的头条价格是 20-40 万，一条广告就超过我们一年的收入。


    另外个人原创公众号的收费会比转载类的公众号文章收费贵；个人技术公众号会比机构技术公众号收费贵，因为个人技术公众号一般会带有个人品牌属性。


    这里有一份名单（附件），里面有几位做技术公众号的技术人年收入超过了百万，我现在每个月技术公众号广告费用大概是 2 万左右，有的时候多一点，有的时候少一点，算是我业余收入中最多的一块收入了。'
