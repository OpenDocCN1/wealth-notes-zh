    \n当然朋友圈创业也同样是一个不太容易走的路，当然了挣钱的每一条路都是有门槛的，不然人人都是富翁了吧。有专门教人如何在朋友圈写文案，以什么样的话术什么样的频率去更新朋友圈，以达到产生信任的前提，这里面也涉及了一些分销话术等，是一个很大的产业。\n\
    \n还有的人专门加入各种微信群来抢红包，手机安装了抢红包插件，如果规模足够大，每天抢红包的金额也是非常大的一笔收入。。。\n\n反正只要有人的地方，就会有挣钱的模式，这就是之前有一些朋友问，为什么需要养号呢？（https://t.zsxq.com/aAuBmQv），也许今天的分享或许就可以找到一些答案。\n\
    \n有的人说，我自己又没有什么流量，有没有读者群怎么在微信积累很多微信好友呢？\n\n其实有非常多的方法，比如在网上看到很多人留下了他的联系方式邀请人如各种类型的群，你可以通过这些联系方式进入他的群，然后使用\
    \ webtools 这种类似的工具，帮你批量添加好友；当这些好友通过之后，你引导他，让他把你加入到其它的群中；\n\n再重复上面的操作，很容易批量搞出几个\
    \ 5000 好友的微信号，并且这个方法绝对比在地铁里面找人添加你微信号的效率高多了。\n\n今天就分享这些，希望大家合理看待，如果以上某些操作太过，会非常引起他人不适！\n\
    \n## 知识星球到底能不能挣钱\n\n首先我想说：知识星球真的是一个很牛逼的产品，可能我们大多数人在一开始的时候都没有看清楚这个产品的价值。\n\n知识星球的创世人吴鲁加是一个连续创业者，最初在安全领域创业，和联合创始人黄鑫最初的创业产品是「铁卷」，给电脑加密防止员工偷盗公司敏感资料，这款产品后来卖了不少钱，不过他们总感觉和自己的理念相差较远。\n\
    \n2014 年，他们对移动互联网产生了兴趣，想在这个领域去做一些事情，于是就把之前的创业公司给卖了，转型到互联网领域去创业。刚开始也并不顺利，做过\n\n\
    一个加密的阅后即焚的 app，没有成功，后来又转型了协同软件的产品也没有成功。\n\n期间他们创业的公司也拿到了腾讯的投资，其实这点很关键，这为后来知识星球和微信生态的强绑定打下了基础。\n\
    \n转机出现在了 2016 年，吴鲁加看到小道消息吐槽他的「小道通讯」服务收费太麻烦，这个时候吴鲁加就想何不做一个这样的 app 来满足大 V 的这种需求。\n\
    \n于是我们看到了冯大辉成为了这个产品的最初用户，并且因为大 V 效应影响了一大批意见领袖参与到其中，完成了知识星球产品最初的种子用户和产品基调。\n\n\
    现在想想这个产品太牛逼了，不用做太多的推广，因为各种意见领袖为了宣传自己的知识星球，会给这个产品免费做了 N 多的广告，自带推广效应。\n\n每个人加入到知识星球中，平台会收取\
    \ 5% 的手续费，但其实平台的成本并不大，如果知识星球的用户足够大的话，这个收入也是非常可观的。\n\n当然了，这只是一个低层次的认识，平台聚集了这么多的用户之后，那么平台可以做的事情简直不要太多，联合星主出课程、平台出一些付费营销工具等等，几乎什么都可以搞。\n\
    \n但是到目前为止，我们可以看到知识星球还是一个非常克制的产品，每次升级改动都做得非常谨慎，如果某个功能反馈好会立刻回退，比如 18 年开通的评价星球功能，因为反馈不好立刻给能掉了。\n\
    \n不过有一点很明显，看平台不断迭代的功能来看，知识星球慢慢从一个服务型工具，转型为知识付费服务平台，虽然只是差了几个字但其中差别非常大。我们也很期待知识星球后期会进化成什么样。\n\
    \n以上介绍了知识星球这个产品的一些背景，让大家可以更好的认识这个产品。\n\n我知道大家更关心的事情是：作为星主创建一个知识星球挣不挣钱？\n\n- 先来看一下知识星球的三个不同产品类型：\n\
    \  1. 永久的知识星球（付费），现在已经取消这种产品；\n  2. 定期的知识星球（比如：2018.1.1—2019.1.1）；\n  3. 加入后自动延后一年内的知识星球（按照加入的日期往后自动延后一年，你加入的日期是\
    \ 2019 年 6 月 1 号，那么失效的日期就是 2020 年 6 月 1 号）；\n  4. 免费的知识星球（长期）\n\n第一个产品形式已经被检毙掉，因为很难保证一次付费永久服务的形式，目前存留的还是按照这个来走，第四个产品形式主要是为了扩大平台的用户量，增加付费和非付费用户的存留度。\n\
    \n所以我们大部分星主应该选择的产品类型是 2 和 3。那么我们先来对比一下 2 和 3 都有哪些区别，对于营销来讲哪种更合适？\n\n2 和 3 的主要区别就是用户加入后，到期的日期不一致，其实站在用户的角度来讲，比较公平的是采用\
    \ 3 的形式；站在营销的角度来讲产品 2 更合适，会有一个准确的时间来做营销，当然对星球的内容要求也更高。\n\n知识星球其实只是给星主提供了通用功能，星球如何运营就要看每个星主的特质了。但根据不同的形式来看，大体可以分为三种类型：\n\
    \n- 1、社群性质的知识星球，社群运营高手，对社群运营有一定深度的认识，通过线上线下活动来促进整个群体的参与感。比较有代表性星球有：生财有术、老关的营销圈。\n\
    - 2、个人 IP 性质的知识星球，主要是利用个人强大的 IP 来背书，读者基于都是星主的信任，选择加入星主的知识星球。有代表性的：水库、小道消息和他的朋友们。\n\
    - 3、个人 ip+社群运营的知识星球，第三种的方式其实就是上面两种的混合形式，一方面有社群运营，一方面也有星主的 IP，大多数星球都是这种形式。有代表性的：caoz\
    \ 的小密圈、粥左罗和他的朋友们\n\n接下来选择两个有代表性的知识星球，来分析一下数据：\n\n## 亦仁的：生财有术\n\n生财有术是知识星球中运营做得很好的一个星球，星球质量也很高。亦仁刚开始的时候并没有很大的名气，只是阿里离职的一位创业者。他在公众号发了一篇高质量的淘金文章，引发了曹大的关注转发，这才被很多人认识。\n\
    \n没多久亦仁就创建了生财有术知识星球，开启了一段开挂的经历，看着亦仁运营了三期，真的感慨他的运营手段非常厉害，从中学习很多。\n\n先来看看他知识星球的一些数据：\n\
    \n## 生财有术第一期：\n\n2017 年 3 月 22 日，「生财有术」小密圈建立。圈子定价 365 元一年，每满 100 人，入圈费涨 100 元。\n\
    3 月 26 日，5 天，成员突破 500 人，预估毛收入 28w。\n7 月 7 日，110 天，成员达到 1218 人，预估毛收入 110w。\n截止\
    \ 2018 年 3 月 1 日，成员共 1572 人，星球价格 1865 人，预估毛收入 173w。\n\n## 生财有术第二期：\n\n2018 年 4\
    \ 月 18 日 - 2019 年 4 月 17 日：\n星球初始价格 665，价格最高 1865，总人数 2500+。（按照人均 1000）预估毛收入 250w+。\n\
    \n生财有术第三期：\n2019 年 4 月 18 日 - 2020 年 4 月 17 日：\n星球初始价格 765，目前价格 1665，总人数 5500+。第三期的时候前三分钟的收入就超过了\
    \ 100w，（按照人均 1000）目前预估毛收入 550w+。\n\n可以看出生财有术采用的是阶梯价格，最初加入的用户越优惠，这样会给用户一种抢购的感觉，越早加入的用户越有利，也比较合理，因为最早加入的用户最先信任星主。我的知识星球也是类似的运营策略。\n\
    \n后期可以找时间给大家总结一下，生财有术的运营策略。\n\n第二个有代表性的知识星球是：帅张和他的朋友们\n\nstormzhang 的个人 IP 极强，公众号的读者粘性非常高，打开率到了惊人的\
    \ 20% 左右，但同时他也是一个稍微有争议的人物，认同他的人特别的认同，不认同的人也有一大批。\n\n从客观的角度来讲 stormzhang 还是有很多值得学习的地方，据我观察他的读者群体以大学生和刚毕业几年内的从业者为主，这部分读者是他的忠实用户，工作很久的用户对他的内容接受度就会较低。\n\
    \nstormzhang 也是最早开始运营知识星球的技术公众号博主之一，刚开始的时候和 P2P 的合作厂商做过一段时间合作，如果购买广告商一定金额的理财产品，就可以免费加入他的知识星球，从而吸引了一批用户。\n\
    \n帅张的知识星球运营到了第三期，知识星球的用户高达 19.1 K，成为知识星球中的顶级玩家。他的三期定价一直变化不大，从最初的 199 到现在的 299\
    \ 元。知识星球一直强调圈子文化，通过圈子交流可以提升思维与认知。\n\nstormzhang 第一期的用户数据不详，第二期的用户应该在 1w 左右，按照\
    \ 199 元计算大概有 200w 的收入；第三期的日期是 2019 年 2 月 23 日到 2020 年 2 月 23 日，目前价格 299 元有 1.91w\
    \ 的用户加入，估算有近 500w+的收入。\n\n大家看了以上的案例有什么感觉，这两个知识星球的收入都可以超过很多公司的年利润了。但知识星球的钱真的有那么好挣吗？\n\
    \n我上面挑选的两个知识星球都是做的最好的两位，大家可能没有看到很多苦苦挣扎的知识星球星主。有的星主苦苦运营了一年才收获了几十个用户，有的知识星球好长时间没有新内容被用户催更，有的星球没有管理广告泛滥。\n\
    \n任何没有门槛的商业模式都是竞争最为激烈的，就像公众号一样，有2000万的公众号，但可以挣钱的公号其实不到1%，知识星球也是类似，我看到很多有名的技术人，创建的知识星球却只有很少的用户加入。\n\
    \n所以知识星球是典型金字塔模式，头部的星球收益很高，年收入可以达到100w+，但可以达到这层次的用户非常少；中部的知识星球用户会比顶部的稍微多一些，大概收入在10w~100w之间，99%的知识星球年收入在10w以下。\n\
    \n《就聊挣钱》知识星球目前运行到现在，一共积累了1500+用户，目前星球定价在168元每年，年收入刚好在10w这个门槛上，这还是我拥有着很多读者资源的情况下。\n\
    \n所以再来看这个问题知识星球到底能不能挣钱？答案是可以挣钱，如果你是运营高手或者知识输出型高手都可以有机会挣到钱。但对于普通用户来讲，想通过创建知识星球的方式来挣钱会有一定的难度。\n\
    \n如果是抱着试试的态度来做，还是很值得去尝试的，但是一定要对得起加入知识星球的朋友们，能加入到星球中的用户基本上都是很信任星主的。知识星球是一个社群产品，用户规模越大对加入的用户越有利，分享的内容越多越可以促成一个正循环。\n\
    \n知识星球也是一个筛选器，可以聚齐一批有同样爱好的朋友，后期如果想做些事情可以在知识星球中的朋友中选择。这也是我创建知识星球的一个目的，寻找未来的合作伙伴。\n\
    \n知识星球是一个社群产品，如果大家不参与到其中，其实很难深度感受到它的价值，我希望大家可以在这里多分享、多交流、多链接，那怕是多评论、多点赞也是一种交流，对分享者的一种鼓励，多实践，我相信大家会在这里找到属于你的机会。\n\
    \n## 行业深度分析\n\n## 深度解析灰色产业链：微信刷单的行业秘密\n\n凡是有人的地方就有江湖。\n"
