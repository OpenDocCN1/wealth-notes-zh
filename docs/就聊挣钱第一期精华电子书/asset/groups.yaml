    # 在网站的**关于&合作**菜单下了解网站诞生的过程：


    # 网站起源


    +   - 最开始是经常会用到 png 转 ico 的工具，有网络的时候还好，网上有很多可以处理的工具。但是没有网络的时候，就没有办法处理了，于是自己用 PHP
    做了一个本地 Web 转 ico 的小程序 ph​​ico。

    - 自己用着自己写的程序，感觉还不错，于是试用二级域名 tools.50vip.com 挂到网上，想着说不定别人也需要用。

    - 后来关注域名的时候，发现 aTool.org 居然还没有被注册，于是并买了下来，于是本站算正式上线！名字就叫 aTool 了。

    - 既然都买了域名，于是便开始不断的加一些功能，首先加的都是自己需要用到的，这些功能其实其他网站都有，并且也不比我自己做的差，但是毕竟自己做的，用着感觉不一样吧！

    - 后续会逐步加入更多实用的功能，以及一些有意思的东西，如果大家有什么需要，也可以留言或者加 QQ 群说！

    - 如果觉得我做的工具可能对你有用，我不需要什么捐赠，只希望你能够留个言支持一下，好让我有动力继续加功能！当然如果能够分享到微博、发博推荐、点点小广告，我就更加开心了！


    这是网站现在的样子：


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_7_0.png)


    可以看出网站的 UI 进行了大改版，功能进行了一些扩充，增加了很多好玩的功能，比如：在线生成高考准考证、在线计算男女交往几天可以啪啪啪、在线制作 gif 等功能。添加了用户体系，支持
    QQ 登录，但是当我点击 QQ 登录时却报 404 错误，网站现在还存在很多的 Bug。


    通过 http://www.alexa.cn/ 来查看一下网站的流量情况。页面地址：

    http://www.alexa.cn/rank/atool.org'
