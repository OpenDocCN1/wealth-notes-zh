    # 知识星球到底能不能挣钱


    首先我想说：知识星球真的是一个很牛逼的产品，可能我们大多数人在一开始的时候都没有看清楚这个产品的价值。


    知识星球的创世人吴鲁加是一个连续创业者，最初在安全领域创业，和联合创始人黄鑫最初的创业产品是「铁卷」，给电脑加密防止员工偷盗公司敏感资料，这款产品后来卖了不少钱，不过他们总感觉和自己的理念相差较远。


    2014 年，他们对移动互联网产生了兴趣，想在这个领域去做一些事情，于是就把之前的创业公司给卖了，转型到互联网领域去创业。刚开始也并不顺利，做过'
  - '[PAGE 37]


    一个加密的阅后即焚的 app，没有成功，后来又转型了协同软件的产品也没有成功。


    期间他们创业的公司也拿到了腾讯的投资，其实这点很关键，这为后来知识星球和微信生态的强绑定打下了基础。


    转机出现在了 2016 年，吴鲁加看到小道消息吐槽他的「小道通讯」服务收费太麻烦，这个时候吴鲁加就想何不做一个这样的 app 来满足大 V 的这种需求。


    于是我们看到了冯大辉成为了这个产品的最初用户，并且因为大 V 效应影响了一大批意见领袖参与到其中，完成了知识星球产品最初的种子用户和产品基调。


    现在想想这个产品太牛逼了，不用做太多的推广，因为各种意见领袖为了宣传自己的知识星球，会给这个产品免费做了 N 多的广告，自带推广效应。


    每个人加入到知识星球中，平台会收取 5% 的手续费，但其实平台的成本并不大，如果知识星球的用户足够大的话，这个收入也是非常可观的。


    当然了，这只是一个低层次的认识，平台聚集了这么多的用户之后，那么平台可以做的事情简直不要太多，联合星主出课程、平台出一些付费营销工具等等，几乎什么都可以搞。


    但是到目前为止，我们可以看到知识星球还是一个非常克制的产品，每次升级改动都做得非常谨慎，如果某个功能反馈好会立刻回退，比如 18 年开通的评价星球功能，因为反馈不好立刻给能掉了。


    不过有一点很明显，看平台不断迭代的功能来看，知识星球慢慢从一个服务型工具，转型为知识付费服务平台，虽然只是差了几个字但其中差别非常大。我们也很期待知识星球后期会进化成什么样。


    以上介绍了知识星球这个产品的一些背景，让大家可以更好的认识这个产品。


    我知道大家更关心的事情是：作为星主创建一个知识星球挣不挣钱？


    +   先来看一下知识星球的三个不同产品类型：


    1. 永久的知识星球（付费），现在已经取消这种产品；

    2. 定期的知识星球（比如：2018.1.1—2019.1.1）；

    3. 加入后自动延后一年内的知识星球（按照加入的日期往后自动延后一年，你加入的日期是 2019 年 6 月 1 号，那么失效的日期就是 2020 年 6 月
    1 号）；

    4. 免费的知识星球（长期）


    第一个产品形式已经被检毙掉，因为很难保证一次付费永久服务的形式，目前存留的还是按照这个来走，第四个产品形式主要是为了扩大平台的用户量，增加付费和非付费用户的存留度。'
  - '[PAGE 38]


    所以我们大部分星主应该选择的产品类型是 2 和 3。那么我们先来对比一下 2 和 3 都有哪些区别，对于营销来讲哪种更合适？


    2 和 3 的主要区别就是用户加入后，到期的日期不一致，其实站在用户的角度来讲，比较公平的是采用 3 的形式；站在营销的角度来讲产品 2 更合适，会有一个准确的时间来做营销，当然对星球的内容要求也更高。


    知识星球其实只是给星主提供了通用功能，星球如何运营就要看每个星主的特质了。但根据不同的形式来看，大体可以分为三种类型：


    +   1、社群性质的知识星球，社群运营高手，对社群运营有一定深度的认识，通过线上线下活动来促进整个群体的参与感。比较有代表性星球有：生财有术、老关的营销圈。


    2、个人 IP 性质的知识星球，主要是利用个人强大的 IP 来背书，读者基于都是星主的信任，选择加入星主的知识星球。有代表性的：水库、小道消息和他的朋友们。


    3、个人 ip+社群运营的知识星球，第三种的方式其实就是上面两种的混合形式，一方面有社群运营，一方面也有星主的 IP，大多数星球都是这种形式。有代表性的：caoz
    的小密圈、粥左罗和他的朋友们


    接下来选择两个有代表性的知识星球，来分析一下数据：


    # 亦仁的：生财有术


