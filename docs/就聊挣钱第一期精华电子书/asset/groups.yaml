    Q：技术公众号适合做哪些内容，内容太长有没有人看，内容过于鸡汤有没有长效，内容之间需不需要做联系，内容究竟给读者带来什么？


    A：技术公众号现在主要分为四种类型


    第一种，要分享的是关于用技术的角度去看待一些事物，或者是用技术的这个思维去看一些现象、是事件，对它做一个剖析，只要是泛 IT 的都可以聊，其实这个才是用户量最大的公众号，其实比较典型的在圈内有两个号，一个是
    TT，一个是 XX，他们两个号都写的很犀利很大，其实就是用技术的角度去看待这个世界，这个受众的范围是最广的。


    第二种，就是实打实的讲技术干货，这个也比较典型，像 58 沈剑「架构师之路」，这种类型就是死抗技术，全篇都是技术，而且聊得很干，但这个方向的话，说实话，其实很辛苦，而且技术文章单纯讲技术的话，文章的打开率很难很难超过
    1 万，其实他的瓶颈是比较多的，你其实可以看一下业内比较大的号。其实做到像沈剑「架构师之路」，还有「码农翻身」这个级别的基本上很少很少，但这个是最值得技术人尊重的一种方式吧。


    第三种，就是讲个人成长，然后同时会分享一些技术，这种类型其实也比较好，这是一个很小的点以非常幽默的方式去讲出来，比如说像「程序员小灰」这种类型，其实每次不需要讲特别干，只需要把一个点讲清楚，而且讲的特别有意思，这样的号，其实发展前景也非常大。


    第四种，就是转载号，可能他自己对技术有一定的认识，他能找到一些好的文章，然后他把这些文章综合到一起，然后在自己的公众号去发。这种类型呢，说实话，用户与用户之间的粘性不是特别高，用户可能只是来你这看个文章，然后在你后期的运营或者是变现上，其实还是稍微差一点，另外的话，如果一个公众号不写原创文章是没有灵魂的，哪怕你没有时间写，但至少保证一周有一次。


    最后一个建议，就是一定要做自己擅长的东西，比如说你是一个小白，那其实小白是技术圈里面受众最大的，因为，就像一个金字塔越往上其实需求越少，那么你是小白的话，你就把你的工作中，遇到的一个小点，用浅显易懂的方式给大家讲清楚。


    如果你擅长运营的话，其实你在运营这个角度，把你工作中特别擅长的东西给大家输出出来。另外的话，其实写作是一门技能，它不是靠天赋，你只有多写，多思考，多回顾，多学习，你才能越写越好。'
  md: '

    在这个时间段有一个事情必须要提一下，我接了人生第一个商业广告，1000fer的广告，在文章末尾贴一个他们公司的二维码，一个月发八次文章给1000元，这次合作才让我知道了做公众号还可以接广告挣钱，这是我之前完全没有想到的，这个事情极大的刺激了我继续将公众号运营的更好。


    试过了那么多的方法，增粉最好的方式其实还是互推，技术行业的朋友相互之间最具有合作精神，不像其他行业合作精神可能没有那么好。但到了现在互推却在技术行业变得泛滥起来，其实给读者带来了非常不好的体验，但目前确实也没有找到其它更好的解决方案。


    在这段时间，突然有一个朋友把我拉到了一个作者群里面，里面都是做技术公众号的作者，群主定期一个月组织大家参加一次互推，我跟着他们参加了几次，效果还不错。找到组织之后，定期组织的互推明显会加快公众号读者的增长速度。


    于是到了 2017.11.18 公众号用户关注数突破一万，日常阅读也能稳定在 1 千到 2 千之间，这时候日增长用户到了净 60 左右。


    ## 第六个阶段：用户量突破 50000


    其实只要公众号的用户关注量突破了 10000 之后，就会走入一个正循环的过程，这时候你的文章阅读量就可以稳定在一千以上，在这样的情况下，就会有各种各样的广告商来找你，在金钱的刺激下，会持续激励你想办法把公众号做的更好一些。


    我的公众号在开通的一段时间内，都是一边同步博客以前的文章，一边写新的文章推送到微信公众号，读者在小于三万的时候，大部分文章都是我自己的原创，持续坚持原创的情况下，读者的质量比较高，不论是评论和点赞量都会比一般的号要好一点。


    所以其实我特别建议大家，在公众号初期，尽量先坚持原创文章，这样会很好的培养用户的忠诚度，相当于要打好基础，为后期快速增长做好准备。


    另外互推是一个双刃剑，有的朋友通过互推快速做大，成为行业内大佬，有的人朋友通过互推粉丝量也增长起来了，但是阅读量却没有跟着起来，行业内这两个例子都挺明显的，所以要保持互推的节奏，既能快速增长，也能转化成自己的用户。


    在 18 年春节前的一段时间，我给自己提了一个要求，尽量少做互推坚持做原创，也就是在用户还没有突破 3 万之前，但是很尴尬的是，放弃互推和坚持原创用户增长的速度还是降了下来，于是到了
    18 年的三月后又开始加入了互推大军中。


    同时因为公众号的广告也比较稳定了，为了显得广告不是那么多，从开始的一周两三篇文章，到了一日更的一个频度。坚持日更没多久就发现自己的写作跟不上节奏，于是就开启了转载之路。平时在地铁里面看到好的文章，或者在各大技术社区看到好的内容后，都会联系作者授权转载。


    于是就开启了，一月两三次互推，一月两三次广告的频度。到了 2018.06.20 号微信公众号用户关注量突破 50000，这个时候用户的自增长就到 90 左右。


    ## 第七个阶段用户量突破 10 万


    当微信公众号关注量突破 5 万之后，我上门来投放广告的广告商就越来越多，所以我当时给自己定了一约定，一个星期最多只接一个广告，到了现在稍微宽泛了一些，一个月内外部广告不能超过
    6 个。如果广告太多，就说明广告价格要的有点少，提高价格后投放的自然就少了。


    在用户量突破 5 万左右的时候，我还做了一些事情，在一些技术社区开了付费课程，在某种程度上也增加了自己的曝光率，从而最终也会转换一部分用户到公众号里面，同时因为有合作关系，我的读者也会转换到付费课程中，所以是一个双赢的过程。


    从 5 万到 10 万的过程比较平稳，期间没有太多波动。我在 2018 年初的时候定了一个小目标，希望年底的时候用户可以突破 10 万，结果到了 12 月，按照当初的增长速度刚好差一点，于是就做了一个活动，让读者帮忙宣传公众号，我来给用户发红包。


    借着这个活动，2018.12.28 号微信公众号用户量突破了 100000+。


    这就是我公众号从零增长到 10 万+用户的故事，从误打误撞来到这个领域，快两年的时间经历了很多的事情，参与到其中感觉到很神奇，也很兴奋。真的是打开了人生的另外一扇窗，我相信这个圈子里面的朋友大多数都比我小，也比我当初的起点要好一些，所以未来星球内，肯定会有朋友的成绩远远超过我。


    ## 公众号如何快速涨粉？


    今天我给大家分享的内容是，公众号如何快速涨粉。主要介绍我总结的六种获客方式，其中有些方式很暴力很直接，有的方式比较柔和，有的方式绝对有效，可以根据自己公众号的定位来选择。


    微信是一个封闭的生态，因此各种搜索引擎对微信内部推广无效，获取目标用户的渠道相对较窄，如何低成本获客是公众号运营者要考虑的重要问题之一。


    ### 一、通过社区获取用户：


    要想低成本的找到公众号的目标用户，就自然要想到目标用户在哪里？


    - 1. 如果你做的是一个技术号，那么你的目标用户肯定就在各大技术社区，那么你就应该想办法在各大技术社区发文，来吸引你的用户关注，文末和左侧菜单栏是一个不错的推荐位置。


    之前写过一篇文章可以作为技术社区的参考：

    http://www.ityouknow.com/other/2018/07/02/china-ten-technical-community.html


    - 2. 如果你做的是一个科技号，那么就应该去找科技社区，比如：36 氪、果壳等，这些都是可以注册为作者在上面发文的。


    - 3. 其它行业也是类似，比如产品社区、设计社区、安全社区等等。


    - 4. 如果你有个人博客，个人博客必须要放一些自己公众号信息。


    - 5. 无意中发现 V2EX 是一个活跃度很高的社区，可以适当在这里发发声音，引导关注。


    - 6. 知乎是一个综合性质的社区，回答细分领域的专业问题、发布专栏文章，也可以吸引自己的目标用户。


    另外在文章末尾不要只是仅仅贴一个二维码，一两句话的介绍，突出自己公众号特点、特色，或者是引导关注后送一个比较好的资源。


    这些途径一方面最接近你的目标用户，另一方面这些社区的搜索引擎指数比较高，你的文章比较容易得到搜索引擎的支持。大家可能不了解，我在博客园有一篇文章的阅读量就高达
    90 万，这篇文章三年前发的一周内阅读量也才 2000+，这就是搜索引擎的力量。


    ## 二、通过资源获取用户：


    我做公众号期间，还发现了一些野路子，真的很猛，对自己合不合适大家自己衡量；我看有的技术网站，在用户第一次访问自己的个人网站时，直接弹出一个对话框必须关注公众号，关注后才可看完整的文章之类，很暴力很直接。本质上文章内容也是资源的一种。


    还有一些资源站的套路，前两天@pyhton 在星球内也分享过，

    https://t.zsxq.com/yzvB6QR。


    这里就只简单提一下：有一些电子书或者咨询下载网站，在用户下载文件的时候都会有一个验证码，这个验证码就需要关注公众号后，回复一个关键字来获取。真的需要资源的用户，肯定就会关注对应公众号，因此收获了一大批的粉丝，而且量很大。


    有的网站做的很隐蔽，但流量很大，比如这个网站：https://sobooks.cc/，可以下载各种各样的电子书，我用 Alexa 查了网站的流量情况，中国区排名竟然高达
    2522 名，意味着每天几万的用户在网站上晃悠，想想这么大的流量，怎么都能变现，都不局限于公众号了。


    ## 三、通过功能获取用户：


    我在通过 Alexa 中国分析 https://sobooks.cc/ 网站信息的时候，发现了一个有趣的事情，如果你需要使用 Alexa 中国一些高级一点的功能，你需要关注他们对应公众号才可继续使用。这就是通过功能使用来吸引用户关注的典型案例。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_82_0.png)


    其实早期像苹果序列号查询，技术网站导航网站都是这样的示例，包括前两天 Terry 分享的视频下载网站 https://onlinedownloader.io/，如果这个网站后面的流量非常大，也特别建议做成类似的功能。通过特定功能吸引的粉丝质量比较高，并且垂直在某一个领域内，后期也方便运营。


    感觉这招对技术人最好，技术人如果动手能力强，可以做一些功能，比如：我记得星球内有一个朋友提出来一个创意，专业检测你的手机号都在哪些网站注册过，如果这个功能实现了，我觉得真的可以吸引到一批目标用户。这只是一个小案例，类似的功能、产品大家都可以去尝试。


    市面上线下推广也是类似的思路，上次我去饭店吃饭的时候，发现饭店门口放了一个智能体重器，可以分析体重、身高等基本的身体指标，这个产品是免费使用的，但使用的前提是你关注了他们的公众号。


    现在的新榜、西瓜数据这种类似的网站做的更狠，直接把网站的登录功能都给干掉了，完全依赖微信公众号。你登录的时候直接扫描就自动登录了，第一次登录会自动关注他们官方的服务号，关注后你还不能取消，因为你下次登录的时候又会自动关注，手段很流氓很直接。


    ## 四、通过互推获取用户：


    除了依赖外部的这些获客方式之外，还有几种方式是获客的主要途径：


    - 1、公众号互推，可以找一些体量比较接近的公众号相互做互推，不要太频繁，根据自己的情况控制好节奏，建议一月互推两到四次。当然最好是你的用户突破了5000以后，另外1万用户之前尽量坚持公众号发原创文章。


    公众号互推也分为很多种形式：

    1）两个人之间互推，比如找一个和你差不多的公众号，你们相互转载文章推荐，或者更直接在文中的开头相互推荐，或者相互推荐一个非常好的资料，必须到对方公众号内获取。

    2）多人之间的互推，这种场景比较常见，一般8~10左右组一个队伍，大家根据新邦的排名来排序，直接硬推这种效果最好。

    3）现在还有一种新的玩法，就是公众号互推赠书，同样也是组织几波人，但粉丝必须去公众号内回复关键字才可以抽奖中书。


    - 2、朋友圈微信群转发，其实看公众号的后台数据，凡是阅读量很高的文章，转发量必然非常的高，其实有时候可以稍稍在文末引导一下用户，让用户帮忙给予转发支持等。


    - 3、朋友圈互推，很多做公众号的朋友，微信好友都高达四五千人，找一个比较相近的朋友，一起在朋友圈内互推。


    另外互推的时候要心态开放，有的朋友总是挑三拣四的，害怕流失了自己的忠实粉丝。不开放的人不会做大的，格局小的人也不会做大，大家自己把握这个度。


    ## 五、通过视频获取用户


    现在短视频、Vblog 非常的流行，抖音的一个视频可以播放量高达几百万，在 B 站某些博主达人的视频播放量也高达几十万，有的视频网站不允许博主放视频二维码，但是很多博主会通过背景
    Logo，或者是在说话的过程中植入，当播放量爆发时，这个转化量也是惊人的。


    从目前的新媒体来看，短视频绝对是未来的一个大方向，并且制作视频还有很多优势，比如内容传播，多平台。倒流方式是在视频的结尾制作公众号的二维码引导关注，制作一个短视频可以在全平台去发，比如抖音、B站、腾讯视频、优酷视频、嵌入到微信文章中等等，只要这些视频有传播量就会带来持续的关注。


    下图是“一席”视频末尾的二维码引导，把换成公众号二维码就是很好的一种倒流方式。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_84_0.png)


    ## 六、其它方式获取用户


    - 1. 在公众号早期的时候，如果文章质量不错可以通过投稿到大号来涨粉。根据一些技术朋友在我这里投稿反馈的数据来看，一次次条转载可以给他公众号带来50人左右的涨粉，头条转载可以给他带来100人左右的涨粉；具体每个人不太一样，需要看文章的质量和内容。


    - 2. 换群涨粉，很多技术公众号主都有很多的技术群，或者对应的粉丝群，如果两个公众号性质比较类似，也可以相互转让群主，转让之后想办法运营将群内用户转化为自己的用户。


    - 3. 私加人涨粉，这种方式不太推荐，但我确实发现有些朋友再做，就是不断的加入各种各样的群，然后通过工具批量加群内好友，通过后使用工具自动推送一段话和公众号名片，通过这种方式来涨粉不是特别地道，不推荐使用。


    - 4. 通过朋友涨粉，初期可以让自己的朋友在朋友圈、同事群推荐一下自己的公众号。


    - 5. 公众号内分享资料，普通资源免费给，比较精华的资源需要分享到群或者朋友圈来圈后去，这也是裂变涨粉的典型案例，谨慎使用，有封号风险。


    以上我给大家分享了六种涨粉的方式：


    - 1、通过社区获取用户

    - 2、通过资源获取用户

    - 3、通过功能获取用户

    - 4、通过互推获取用户

    - 5、通过视频获取用户

    - 6、其它方式获取用户


    其实这里面的六种大的方式，只要做透其中的某一种，稳定涨粉其实都不是什么难事。后面就需要每个人寻找自己最适合的一种方式去实践，如果能力比较强，可以做透其中的某几个，那就更厉害了。


    以上只是我个人看到的一些涨粉的技巧，可能还不够全面，希望大家可以给我留言，反馈是否还有其它花式涨粉的方法：）


    ## 像产品一样运营你的公众号


    如果你想创业，你想经营一个产品，其实公众号就是一个很好的实验呀，我一直鼓励大家像产品一样运营你的公众号。


    运营一个公众号其实就是运营一个你自己的产品。我们来看看两者之间有多少的相似性：运营一个产品你首先需要一个品牌，也就相当于公众号的名字；运营一个产品需要考虑如何持续的增持用户，公众号也是需要不断的吸引用户关注、增长；运营产品的时候经常需要搞一些活动来刺激用户增长，恰好公众号也是，我们也做过好几次活动，搞过互推。。。就不在举例子了，有太多的相似性。


    如果你想创业，或者以后想在这条路上发展，我建议你开通公众号，它的体验和创造一个公司也有相同点。


    在公众号的前期，可能一个用户都没有，你需要想办法招募到最初的 100 或者 1000 个种子用户。现在公众号千千万，如何找到自己精准的用户是不容易的，可能你需要熬上一段时间，发文没有人读，没有评论，甚至
    0 分享。


    但是你要坚持，漫漫长路，突然有了第一个评论、第一次打赏、第二次被人转载，用户渐渐多了起来。我们人坦言如果简单凭借兴趣是不能永久的坚持下来，是很多不同新鲜的事情一直刺激着你往下走，不用谈什么坚持，你就是想做就这种感觉，我想创业也大概是这种感觉吧。


    如果你要想产品一样运营你的公众号，那么需要注意哪些点呢？


    1、取一个好的名字，通熟易懂最好，建议不要高中英文混合（Java\Python\Golang这种高频除外），不要用繁体字，最好用拼音输入的时候第一行就是。


    比如你起了一个程序员 XXX 的公众号，读者在公众号内搜索的时候就可以带出来长尾效应，如果公众号名字可以体现出公众号特点最好，比如之前的股社区、关哥说险等。


    全网统一 ID，比如你有博客、知乎、公众号、微信个人号、技术社区等等，最好都统一用一个名字，不断强化大家对此 ID 的认识，可能第一次看到的时候他没有关注，第二次也没有，但不断的看到这个
    ID，相信他关注的概率会非常的高。


    2、做好口碑，做好一个产品的时候我们关注的是它的体验和使用价值，那么公众号的价值和体验是什么呢？主要体现在两方面：排版和内容。


    排版，技术人做公众号都有一个特点，大多数人的排版都不咋的，也包含我。因为大家关注的重点都不在这里，但至少让用户看起来比较舒服，如果嫌麻烦，建议大家使用 Markdown
    语法来写博客，方便同步到各大社区和公众号。


    目前比较流行的几个 Markdown 渲染工具：


    - http://md.aclickall.com/

    - https://lab.lyric.im/wxformat/

    - http://md.ityouknow.com/

    - http://relatos.top/md/


    内容是公众号的灵魂，因为大家关注你就是喜欢看你的文章，但是我们抽象出来看这个事情，大家关注你有几个目的：第一，学习；第二，猎奇，第三，娱乐；但其实隐藏在文字背后最重要的是价值观。


    你会不断通过文章来传播自己的价值观，哪怕是转载内容也应该符合公众号的气质，长此以往聚集到公众号的读者，大部分应该都是具有相同价值观的群体。我们很多都是个人号，所以读者关注公众号，很大一部分原因就是关注你，信任你，所以我一直强调一个同理心，大家那么信任你，那是不是更应该输出有价值的读物。


    比如，如果你觉得这篇文章不太适合给你的朋友看，给你的亲戚看，或者你自己都不想看，那么就不建议你发表出来。写出来的内容，至少自己是满意的。


    3、做好运营，一个擅长运营搞气氛的公众号，和一个天天冷淡处理的公众号，风格完全不一样。其实很多时候是需要适当的进行引导，比如引导读者在公众号中赞赏、投票、点赞，引导在公众号的文末留言，讨论某一件事情，积极在留言区和大家互动等等。


    另外我特别建议大家，平时在运营公众号的时候，多和读者介绍下自己，这样很容

    易拉近读者和你的距离，让读者知道公众号背后是一个热乎乎的人，不是什么冰冷的机构，有事没事多聊聊自己的想法、故事、感悟是很有必要的。


    4、商业部分，公众号目前有四种盈利方式：流量主、公众号打赏、外部广告、知识星球，下面一一介绍：


    流量主，公众号关注用户大于 5000 时可开通，随着公众号的阅读量越大每天的流量主也越多，像我这个级别（每天阅读量 1 万左右），大概会在 40-60 区间，有的公众号作者会稍微引导读者点击广告，收入会到
    100 左右。


    流量主现在也分了三种，第一种是文章中的广告、个人感觉对用户体验不太好，就一直没有开通；第二种文末广告，就是在文章的末尾添加的广告，对用户干扰较少，推荐开通；第三种，可以在公众号内推荐商品，按照商品的价值百分比来提成，比较推荐是电影或者书籍。


    公众号打赏，打赏是所有收入中最少的一部分，但是对作者鼓励最大，用户用钱来赞赏，这是真的认可。


    外部广告，目前几乎是所有做公众号博主最主要的收入来源，一般会根据日常发文的平均阅读量来报价，比如平均阅读量 1 千，就可以报价 1 千。公众号大了起来之后，会稍微有点折扣，比如
    1 万的阅读可能报价 8 千等，纯做原创的公众号，报价会高一点。


    知识星球，很多做公众号的朋友，也同步的开通了知识星球，通过知识星球解答问题、提供特殊资源等来收费，这也是做公众号的朋友的收入来源之一，目前分化比较大，有的通过知识星球年入几十万，大部分还是很少。


    5、关于口碑，如果你用心去运营，想去做好它，你的读者是可以感受到的。


    6、内容和运营都非常的重要，它是产品发展的两条腿，但内容的重要性明显大于运营的重要性，虽然有时候群内的互推比较多，但需要明白你的核心竞争力是什么，不然终究有一天会把自己做死。


    ## 公众号运营快闪交流活动文字版


    Q 为问题

    A 为「纯洁的微笑」回答


    在开始之前我先给大家泼个凉水，因为「就聊挣钱」这个星球大概有 1000 多个用户，然后今天有将近 120 个圈友来这里边交流，其实，我想说的是，其实并不是每个人都适合运营公众号的，你一定要想清楚你自己最擅长什么，你是不是真的有内容要输出，我刚开始做公众号的时候。并没有想普通通过它来挣钱的，或

    者是怎么样。它只是我当时的一个爱好，只是后来呢，做着做着，才发现他有这个商业机会在里面，所以才投入了非常大的精力去做这些事情。


    Q：技术公众号适合做哪些内容，内容太长有没有人看，内容过于鸡汤有没有长效，内容之间需不需要做联系，内容究竟给读者带来什么？


    A：技术公众号现在主要分为四种类型


    第一种，要分享的是关于用技术的角度去看待一些事物，或者是用技术的这个思维去看一些现象、是事件，对它做一个剖析，只要是泛 IT 的都可以聊，其实这个才是用户量最大的公众号，其实比较典型的在圈内有两个号，一个是
    TT，一个是 XX，他们两个号都写的很犀利很大，其实就是用技术的角度去看待这个世界，这个受众的范围是最广的。


    第二种，就是实打实的讲技术干货，这个也比较典型，像 58 沈剑「架构师之路」，这种类型就是死抗技术，全篇都是技术，而且聊得很干，但这个方向的话，说实话，其实很辛苦，而且技术文章单纯讲技术的话，文章的打开率很难很难超过
    1 万，其实他的瓶颈是比较多的，你其实可以看一下业内比较大的号。其实做到像沈剑「架构师之路」，还有「码农翻身」这个级别的基本上很少很少，但这个是最值得技术人尊重的一种方式吧。


    第三种，就是讲个人成长，然后同时会分享一些技术，这种类型其实也比较好，这是一个很小的点以非常幽默的方式去讲出来，比如说像「程序员小灰」这种类型，其实每次不需要讲特别干，只需要把一个点讲清楚，而且讲的特别有意思，这样的号，其实发展前景也非常大。


    第四种，就是转载号，可能他自己对技术有一定的认识，他能找到一些好的文章，然后他把这些文章综合到一起，然后在自己的公众号去发。这种类型呢，说实话，用户与用户之间的粘性不是特别高，用户可能只是来你这看个文章，然后在你后期的运营或者是变现上，其实还是稍微差一点，另外的话，如果一个公众号不写原创文章是没有灵魂的，哪怕你没有时间写，但至少保证一周有一次。


    最后一个建议，就是一定要做自己擅长的东西，比如说你是一个小白，那其实小白是技术圈里面受众最大的，因为，就像一个金字塔越往上其实需求越少，那么你是小白的话，你就把你的工作中，遇到的一个小点，用浅显易懂的方式给大家讲清楚。


    如果你擅长运营的话，其实你在运营这个角度，把你工作中特别擅长的东西给大家输出出来。另外的话，其实写作是一门技能，它不是靠天赋，你只有多写，多思考，多回顾，多学习，你才能越写越好。

    '
  mdcn: '

    在这个时间段有一个事情必须要提一下，我接了人生第一个商业广告，1000fer的广告，在文章末尾贴一个他们公司的二维码，一个月发八次文章给1000元，这次合作才让我知道了做公众号还可以接广告挣钱，这是我之前完全没有想到的，这个事情极大的刺激了我继续将公众号运营的更好。


    试过了那么多的方法，增粉最好的方式其实还是互推，技术行业的朋友相互之间最具有合作精神，不像其他行业合作精神可能没有那么好。但到了现在互推却在技术行业变得泛滥起来，其实给读者带来了非常不好的体验，但目前确实也没有找到其它更好的解决方案。


    在这段时间，突然有一个朋友把我拉到了一个作者群里面，里面都是做技术公众号的作者，群主定期一个月组织大家参加一次互推，我跟着他们参加了几次，效果还不错。找到组织之后，定期组织的互推明显会加快公众号读者的增长速度。


    于是到了 2017.11.18 公众号用户关注数突破一万，日常阅读也能稳定在 1 千到 2 千之间，这时候日增长用户到了净 60 左右。


    ## 第六个阶段：用户量突破 50000


    其实只要公众号的用户关注量突破了 10000 之后，就会走入一个正循环的过程，这时候你的文章阅读量就可以稳定在一千以上，在这样的情况下，就会有各种各样的广告商来找你，在金钱的刺激下，会持续激励你想办法把公众号做的更好一些。


    我的公众号在开通的一段时间内，都是一边同步博客以前的文章，一边写新的文章推送到微信公众号，读者在小于三万的时候，大部分文章都是我自己的原创，持续坚持原创的情况下，读者的质量比较高，不论是评论和点赞量都会比一般的号要好一点。


    所以其实我特别建议大家，在公众号初期，尽量先坚持原创文章，这样会很好的培养用户的忠诚度，相当于要打好基础，为后期快速增长做好准备。


    另外互推是一个双刃剑，有的朋友通过互推快速做大，成为行业内大佬，有的人朋友通过互推粉丝量也增长起来了，但是阅读量却没有跟着起来，行业内这两个例子都挺明显的，所以要保持互推的节奏，既能快速增长，也能转化成自己的用户。


    在 18 年春节前的一段时间，我给自己提了一个要求，尽量少做互推坚持做原创，也就是在用户还没有突破 3 万之前，但是很尴尬的是，放弃互推和坚持原创用户增长的速度还是降了下来，于是到了
    18 年的三月后又开始加入了互推大军中。


    同时因为公众号的广告也比较稳定了，为了显得广告不是那么多，从开始的一周两三篇文章，到了一日更的一个频度。坚持日更没多久就发现自己的写作跟不上节奏，于是就开启了转载之路。平时在地铁里面看到好的文章，或者在各大技术社区看到好的内容后，都会联系作者授权转载。


    于是就开启了，一月两三次互推，一月两三次广告的频度。到了 2018.06.20 号微信公众号用户关注量突破 50000，这个时候用户的自增长就到 90 左右。


    ## 第七个阶段用户量突破 10 万


    当微信公众号关注量突破 5 万之后，我上门来投放广告的广告商就越来越多，所以我当时给自己定了一约定，一个星期最多只接一个广告，到了现在稍微宽泛了一些，一个月内外部广告不能超过
    6 个。如果广告太多，就说明广告价格要的有点少，提高价格后投放的自然就少了。


    在用户量突破 5 万左右的时候，我还做了一些事情，在一些技术社区开了付费课程，在某种程度上也增加了自己的曝光率，从而最终也会转换一部分用户到公众号里面，同时因为有合作关系，我的读者也会转换到付费课程中，所以是一个双赢的过程。


    从 5 万到 10 万的过程比较平稳，期间没有太多波动。我在 2018 年初的时候定了一个小目标，希望年底的时候用户可以突破 10 万，结果到了 12 月，按照当初的增长速度刚好差一点，于是就做了一个活动，让读者帮忙宣传公众号，我来给用户发红包。


    借着这个活动，2018.12.28 号微信公众号用户量突破了 100000+。


    这就是我公众号从零增长到 10 万+用户的故事，从误打误撞来到这个领域，快两年的时间经历了很多的事情，参与到其中感觉到很神奇，也很兴奋。真的是打开了人生的另外一扇窗，我相信这个圈子里面的朋友大多数都比我小，也比我当初的起点要好一些，所以未来星球内，肯定会有朋友的成绩远远超过我。


    ## 公众号如何快速涨粉？


    今天我给大家分享的内容是，公众号如何快速涨粉。主要介绍我总结的六种获客方式，其中有些方式很暴力很直接，有的方式比较柔和，有的方式绝对有效，可以根据自己公众号的定位来选择。


    微信是一个封闭的生态，因此各种搜索引擎对微信内部推广无效，获取目标用户的渠道相对较窄，如何低成本获客是公众号运营者要考虑的重要问题之一。


    ### 一、通过社区获取用户：


    要想低成本的找到公众号的目标用户，就自然要想到目标用户在哪里？


    - 1. 如果你做的是一个技术号，那么你的目标用户肯定就在各大技术社区，那么你就应该想办法在各大技术社区发文，来吸引你的用户关注，文末和左侧菜单栏是一个不错的推荐位置。


    之前写过一篇文章可以作为技术社区的参考：

    http://www.ityouknow.com/other/2018/07/02/china-ten-technical-community.html


    - 2. 如果你做的是一个科技号，那么就应该去找科技社区，比如：36 氪、果壳等，这些都是可以注册为作者在上面发文的。


    - 3. 其它行业也是类似，比如产品社区、设计社区、安全社区等等。


    - 4. 如果你有个人博客，个人博客必须要放一些自己公众号信息。


    - 5. 无意中发现 V2EX 是一个活跃度很高的社区，可以适当在这里发发声音，引导关注。


    - 6. 知乎是一个综合性质的社区，回答细分领域的专业问题、发布专栏文章，也可以吸引自己的目标用户。


    另外在文章末尾不要只是仅仅贴一个二维码，一两句话的介绍，突出自己公众号特点、特色，或者是引导关注后送一个比较好的资源。


    这些途径一方面最接近你的目标用户，另一方面这些社区的搜索引擎指数比较高，你的文章比较容易得到搜索引擎的支持。大家可能不了解，我在博客园有一篇文章的阅读量就高达
    90 万，这篇文章三年前发的一周内阅读量也才 2000+，这就是搜索引擎的力量。


    ## 二、通过资源获取用户：


    我做公众号期间，还发现了一些野路子，真的很猛，对自己合不合适大家自己衡量；我看有的技术网站，在用户第一次访问自己的个人网站时，直接弹出一个对话框必须关注公众号，关注后才可看完整的文章之类，很暴力很直接。本质上文章内容也是资源的一种。


    还有一些资源站的套路，前两天@pyhton 在星球内也分享过，

    https://t.zsxq.com/yzvB6QR。


    这里就只简单提一下：有一些电子书或者咨询下载网站，在用户下载文件的时候都会有一个验证码，这个验证码就需要关注公众号后，回复一个关键字来获取。真的需要资源的用户，肯定就会关注对应公众号，因此收获了一大批的粉丝，而且量很大。


    有的网站做的很隐蔽，但流量很大，比如这个网站：https://sobooks.cc/，可以下载各种各样的电子书，我用 Alexa 查了网站的流量情况，中国区排名竟然高达
    2522 名，意味着每天几万的用户在网站上晃悠，想想这么大的流量，怎么都能变现，都不局限于公众号了。


    ## 三、通过功能获取用户：


    我在通过 Alexa 中国分析 https://sobooks.cc/ 网站信息的时候，发现了一个有趣的事情，如果你需要使用 Alexa 中国一些高级一点的功能，你需要关注他们对应公众号才可继续使用。这就是通过功能使用来吸引用户关注的典型案例。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_82_0.png)


    其实早期像苹果序列号查询，技术网站导航网站都是这样的示例，包括前两天 Terry 分享的视频下载网站 https://onlinedownloader.io/，如果这个网站后面的流量非常大，也特别建议做成类似的功能。通过特定功能吸引的粉丝质量比较高，并且垂直在某一个领域内，后期也方便运营。


    感觉这招对技术人最好，技术人如果动手能力强，可以做一些功能，比如：我记得星球内有一个朋友提出来一个创意，专业检测你的手机号都在哪些网站注册过，如果这个功能实现了，我觉得真的可以吸引到一批目标用户。这只是一个小案例，类似的功能、产品大家都可以去尝试。


    市面上线下推广也是类似的思路，上次我去饭店吃饭的时候，发现饭店门口放了一个智能体重器，可以分析体重、身高等基本的身体指标，这个产品是免费使用的，但使用的前提是你关注了他们的公众号。


    现在的新榜、西瓜数据这种类似的网站做的更狠，直接把网站的登录功能都给干掉了，完全依赖微信公众号。你登录的时候直接扫描就自动登录了，第一次登录会自动关注他们官方的服务号，关注后你还不能取消，因为你下次登录的时候又会自动关注，手段很流氓很直接。


    ## 四、通过互推获取用户：


    除了依赖外部的这些获客方式之外，还有几种方式是获客的主要途径：


    - 1、公众号互推，可以找一些体量比较接近的公众号相互做互推，不要太频繁，根据自己的情况控制好节奏，建议一月互推两到四次。当然最好是你的用户突破了5000以后，另外1万用户之前尽量坚持公众号发原创文章。


    公众号互推也分为很多种形式：

    1）两个人之间互推，比如找一个和你差不多的公众号，你们相互转载文章推荐，或者更直接在文中的开头相互推荐，或者相互推荐一个非常好的资料，必须到对方公众号内获取。

    2）多人之间的互推，这种场景比较常见，一般8~10左右组一个队伍，大家根据新邦的排名来排序，直接硬推这种效果最好。

    3）现在还有一种新的玩法，就是公众号互推赠书，同样也是组织几波人，但粉丝必须去公众号内回复关键字才可以抽奖中书。


    - 2、朋友圈微信群转发，其实看公众号的后台数据，凡是阅读量很高的文章，转发量必然非常的高，其实有时候可以稍稍在文末引导一下用户，让用户帮忙给予转发支持等。


    - 3、朋友圈互推，很多做公众号的朋友，微信好友都高达四五千人，找一个比较相近的朋友，一起在朋友圈内互推。


    另外互推的时候要心态开放，有的朋友总是挑三拣四的，害怕流失了自己的忠实粉丝。不开放的人不会做大的，格局小的人也不会做大，大家自己把握这个度。


    ## 五、通过视频获取用户


    现在短视频、Vblog 非常的流行，抖音的一个视频可以播放量高达几百万，在 B 站某些博主达人的视频播放量也高达几十万，有的视频网站不允许博主放视频二维码，但是很多博主会通过背景
    Logo，或者是在说话的过程中植入，当播放量爆发时，这个转化量也是惊人的。


    从目前的新媒体来看，短视频绝对是未来的一个大方向，并且制作视频还有很多优势，比如内容传播，多平台。倒流方式是在视频的结尾制作公众号的二维码引导关注，制作一个短视频可以在全平台去发，比如抖音、B站、腾讯视频、优酷视频、嵌入到微信文章中等等，只要这些视频有传播量就会带来持续的关注。


    下图是“一席”视频末尾的二维码引导，把换成公众号二维码就是很好的一种倒流方式。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_84_0.png)


    ## 六、其它方式获取用户


    - 1. 在公众号早期的时候，如果文章质量不错可以通过投稿到大号来涨粉。根据一些技术朋友在我这里投稿反馈的数据来看，一次次条转载可以给他公众号带来50人左右的涨粉，头条转载可以给他带来100人左右的涨粉；具体每个人不太一样，需要看文章的质量和内容。


    - 2. 换群涨粉，很多技术公众号主都有很多的技术群，或者对应的粉丝群，如果两个公众号性质比较类似，也可以相互转让群主，转让之后想办法运营将群内用户转化为自己的用户。


    - 3. 私加人涨粉，这种方式不太推荐，但我确实发现有些朋友再做，就是不断的加入各种各样的群，然后通过工具批量加群内好友，通过后使用工具自动推送一段话和公众号名片，通过这种方式来涨粉不是特别地道，不推荐使用。


    - 4. 通过朋友涨粉，初期可以让自己的朋友在朋友圈、同事群推荐一下自己的公众号。


    - 5. 公众号内分享资料，普通资源免费给，比较精华的资源需要分享到群或者朋友圈来圈后去，这也是裂变涨粉的典型案例，谨慎使用，有封号风险。


    以上我给大家分享了六种涨粉的方式：


    - 1、通过社区获取用户

    - 2、通过资源获取用户

    - 3、通过功能获取用户

    - 4、通过互推获取用户

    - 5、通过视频获取用户

    - 6、其它方式获取用户


    其实这里面的六种大的方式，只要做透其中的某一种，稳定涨粉其实都不是什么难事。后面就需要每个人寻找自己最适合的一种方式去实践，如果能力比较强，可以做透其中的某几个，那就更厉害了。


    以上只是我个人看到的一些涨粉的技巧，可能还不够全面，希望大家可以给我留言，反馈是否还有其它花式涨粉的方法：）


    ## 像产品一样运营你的公众号


    如果你想创业，你想经营一个产品，其实公众号就是一个很好的实验呀，我一直鼓励大家像产品一样运营你的公众号。


    运营一个公众号其实就是运营一个你自己的产品。我们来看看两者之间有多少的相似性：运营一个产品你首先需要一个品牌，也就相当于公众号的名字；运营一个产品需要考虑如何持续的增持用户，公众号也是需要不断的吸引用户关注、增长；运营产品的时候经常需要搞一些活动来刺激用户增长，恰好公众号也是，我们也做过好几次活动，搞过互推。。。就不在举例子了，有太多的相似性。


    如果你想创业，或者以后想在这条路上发展，我建议你开通公众号，它的体验和创造一个公司也有相同点。


    在公众号的前期，可能一个用户都没有，你需要想办法招募到最初的 100 或者 1000 个种子用户。现在公众号千千万，如何找到自己精准的用户是不容易的，可能你需要熬上一段时间，发文没有人读，没有评论，甚至
    0 分享。


    但是你要坚持，漫漫长路，突然有了第一个评论、第一次打赏、第二次被人转载，用户渐渐多了起来。我们人坦言如果简单凭借兴趣是不能永久的坚持下来，是很多不同新鲜的事情一直刺激着你往下走，不用谈什么坚持，你就是想做就这种感觉，我想创业也大概是这种感觉吧。


    如果你要想产品一样运营你的公众号，那么需要注意哪些点呢？


    1、取一个好的名字，通熟易懂最好，建议不要高中英文混合（Java\Python\Golang这种高频除外），不要用繁体字，最好用拼音输入的时候第一行就是。


    比如你起了一个程序员 XXX 的公众号，读者在公众号内搜索的时候就可以带出来长尾效应，如果公众号名字可以体现出公众号特点最好，比如之前的股社区、关哥说险等。


    全网统一 ID，比如你有博客、知乎、公众号、微信个人号、技术社区等等，最好都统一用一个名字，不断强化大家对此 ID 的认识，可能第一次看到的时候他没有关注，第二次也没有，但不断的看到这个
    ID，相信他关注的概率会非常的高。


    2、做好口碑，做好一个产品的时候我们关注的是它的体验和使用价值，那么公众号的价值和体验是什么呢？主要体现在两方面：排版和内容。


    排版，技术人做公众号都有一个特点，大多数人的排版都不咋的，也包含我。因为大家关注的重点都不在这里，但至少让用户看起来比较舒服，如果嫌麻烦，建议大家使用 Markdown
    语法来写博客，方便同步到各大社区和公众号。


    目前比较流行的几个 Markdown 渲染工具：


    - http://md.aclickall.com/

    - https://lab.lyric.im/wxformat/

    - http://md.ityouknow.com/

    - http://relatos.top/md/


    内容是公众号的灵魂，因为大家关注你就是喜欢看你的文章，但是我们抽象出来看这个事情，大家关注你有几个目的：第一，学习；第二，猎奇，第三，娱乐；但其实隐藏在文字背后最重要的是价值观。


    你会不断通过文章来传播自己的价值观，哪怕是转载内容也应该符合公众号的气质，长此以往聚集到公众号的读者，大部分应该都是具有相同价值观的群体。我们很多都是个人号，所以读者关注公众号，很大一部分原因就是关注你，信任你，所以我一直强调一个同理心，大家那么信任你，那是不是更应该输出有价值的读物。


    比如，如果你觉得这篇文章不太适合给你的朋友看，给你的亲戚看，或者你自己都不想看，那么就不建议你发表出来。写出来的内容，至少自己是满意的。


    3、做好运营，一个擅长运营搞气氛的公众号，和一个天天冷淡处理的公众号，风格完全不一样。其实很多时候是需要适当的进行引导，比如引导读者在公众号中赞赏、投票、点赞，引导在公众号的文末留言，讨论某一件事情，积极在留言区和大家互动等等。


    另外我特别建议大家，平时在运营公众号的时候，多和读者介绍下自己，这样很容

    易拉近读者和你的距离，让读者知道公众号背后是一个热乎乎的人，不是什么冰冷的机构，有事没事多聊聊自己的想法、故事、感悟是很有必要的。


    4、商业部分，公众号目前有四种盈利方式：流量主、公众号打赏、外部广告、知识星球，下面一一介绍：


    流量主，公众号关注用户大于 5000 时可开通，随着公众号的阅读量越大每天的流量主也越多，像我这个级别（每天阅读量 1 万左右），大概会在 40-60 区间，有的公众号作者会稍微引导读者点击广告，收入会到
    100 左右。


    流量主现在也分了三种，第一种是文章中的广告、个人感觉对用户体验不太好，就一直没有开通；第二种文末广告，就是在文章的末尾添加的广告，对用户干扰较少，推荐开通；第三种，可以在公众号内推荐商品，按照商品的价值百分比来提成，比较推荐是电影或者书籍。


    公众号打赏，打赏是所有收入中最少的一部分，但是对作者鼓励最大，用户用钱来赞赏，这是真的认可。


    外部广告，目前几乎是所有做公众号博主最主要的收入来源，一般会根据日常发文的平均阅读量来报价，比如平均阅读量 1 千，就可以报价 1 千。公众号大了起来之后，会稍微有点折扣，比如
    1 万的阅读可能报价 8 千等，纯做原创的公众号，报价会高一点。


    知识星球，很多做公众号的朋友，也同步的开通了知识星球，通过知识星球解答问题、提供特殊资源等来收费，这也是做公众号的朋友的收入来源之一，目前分化比较大，有的通过知识星球年入几十万，大部分还是很少。


    5、关于口碑，如果你用心去运营，想去做好它，你的读者是可以感受到的。


    6、内容和运营都非常的重要，它是产品发展的两条腿，但内容的重要性明显大于运营的重要性，虽然有时候群内的互推比较多，但需要明白你的核心竞争力是什么，不然终究有一天会把自己做死。


