    # 大姨妈的创业经历


    创业者通过一款工具打入市场，并且迅速成为这个市场内的老大，在收获大量用户之后，开始由一个方向向周边扩展，这样的例子有很多，成功的也不少，这也是我们程序员离得最近的创业的一种方式。有名的有：美图秀秀、墨迹天气，还有我们今天要聊的大姨妈。


    大姨妈是什么？


    大姨妈，是女性进入青春期后，子宫内膜受卵巢激素的影响，出现周期性的子宫出血，称为月经，人们隐晦的一种叫法。当然我们今天不是谈论这个，我们是谈论一个叫做大姨妈的公司。


    官网是：www.dayima.com。大概长这个样子。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_62_0.png)'
