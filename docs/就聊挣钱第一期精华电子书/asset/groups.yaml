    # 写于 2008 年 11 月，关于理财


    2018 年是投资人最黑暗的一年，股市暴跌（A 股、港股、美股都是）、期货大幅下挫、原油历史最低、比特币狂跌 60%以上。


    可以说今年你投资什么几乎都亏本了，大家可能想还有一个理财品种，房产，昨天看了一个图片，中国北上广的房产总值都超过美国了，可见冒泡有多大。


    我们刚好处在这样一个历史变革的潮流中，这个时间点，最好不要乱投资，捂好你的钱袋子等待时机，同时抓起提高自己的能力，这是任何时候都不过时的。


    这段时间，任何高风险的投资都可以回避一下比如：p2p。要出事它肯定是第一个被打爆的，大家可能不了解，企业肯定都是在银行已经借不到钱了，才会到 p2p 公司高息贷款，往往借款利息高达
    24%以上。在经济下行的环境下，有哪些企业效益好到可以覆盖这么高的利息成本。如果企业破产，银行肯定是第一清算人，其它都靠边站。


    现在无风险的理财基本都是银行的半定期产品（一月开放一次）大概收益在 5 个点左右，再下来就是余额宝和理财通了 3 个点左右。这些风险个人觉得还是非常可靠的，利息虽低一些，但起码安全！


    最后，还是理财界经常说的这句话：投资有风险，理财需谨慎！


    # 写给初入职场的朋友


    这个圈子是谈论如何挣钱的相关内容，但是说这些会让初入职场的朋友有压力或者浮躁，在此简单说两句。


    +   1、如果你是刚毕业的大学生，最好的增值手段是提升你的技能，跳槽涨薪最直接。在群里可以保持你对商业或者机遇敏捷性，当机遇来临时抓住他。


    2、想进圈子赚快钱的朋友，首先要问自己是否做好了前期积累，很多人在关键'
  - '[PAGE 100]


    时刻抓住机会，不在那一刻，往于他之前所以的沉淀还有执行力。


    我相信很多人都看到了—些机会，但真正可以有强执行能力的人太少。


    3、很多挣钱的方法都是顺其自然而来的，这样说可能太佛系，但有的时候急功尽气反而适得其反，该修炼的时候修炼，该出手时出手。


    不要瞧不起挣小钱，很多挣大钱的机会就是在挣小钱的过程中获取的。刚开始不要在意多少、不要在意得失，最重要的是把模式跑通，把人脉关系搭建好，后期才会顺利。


    4、首先要摆正一个观念，人人都想挣钱，大多数人都是穷人，那么挣钱必定不是一个容易的事情。那么就需要找到自己的优势点，在这个点上去打破它。


    现在看公众号挣钱，大家都去做公众号，我是鼓励大家开通公众号的，但那就需要明白你为什么要做公众号，如果你是抱着挣钱的目的去运营，未必做的起来，我当初做公众号也不知道这个可以挣钱。


    如果你确定你要通过这个来挣钱，那么你就需要好好想想你的优势在哪里？凭什么你就能成功。


    5、成功不能复制，但可以借鉴，多分析分析市面上的一些成功案例，基本上可以发现一些道道，也可以叫做案例分析。


    6、写文章是锻炼思维的最好方式。


    # 最难的才最有价值


    一、


    现在做公众号的朋友非常多，大家可以看看自己关注的技术公众号有多少，我两个微信关注的技术公众号就有近1千多人，但是现在有一个现象，专注写原创文章的公众号越来越少，当然也包括我。


    我自己也一直对自己说，如果真的想做好它，就必须的坚持持续输出原创内容，这也是我后面要加大力度要做的事情。大家可能会发现，坚持做原创内容的技术公众号真的非常少，因为每天都写技术文章真的太累了。


    所以就出现这样一个现状，有的朋友完全转载文章，有的朋友一部分自己写，一部分转载，还有一部分坚持再写，但是存粹写技术内容，更少的一部分完全坚持原创。'
  - '[PAGE 101]


    我特别做原创一直坚持写原创文章的作者，这种自律就是很少人能够做到的，另外做原创内容的公别人很难复制、更有壁垒，读者的粘性、活跃度各项指标都会很不错，后期如果想继续做一些事情，也是顺理成章。


    其实不只是公众号，工作也一样，我想把这种人放到工作中，仍然是一个好手，我们也可以看的出来，很多原创文章写的好的作者，同样在职场上混的也不错。


    坚持做最傻的事情，坚持做最难的事情，坚持做喜欢做的事情，不断的积累是一把复利，量变引起质变，就是一次飞跃。


    # 二、


    圈子里面有很多做自媒体的朋友，我强烈建议大家如果想真正做好公众号，那就必须要做坚持输出高质量的原创内容。


    当然了坚持原创内容也不一定可以做起来，但不坚持原创99.9%应该都会做不起了。


    公众号读者数量和阅读数有关系，但关系并不成正比，如过维护好核心的少量用户，比拥有更多粉丝更有价值。


    我看到了有60多万粉丝的公众号，平均阅读量不到一万；也看到粉丝不到一万的公众号，文章阅读量还经常上万，并且变现超过50万。


    除过自媒体，其实其它行业也是一样，越是没有门槛的竞争，越是残酷，从中崛起一方面需要靠运气，更多要靠实力。


    你能做的别人做不了，别人能做的你可以做的更好，别人做的更好但你可以坚持的更长，以上三种能长期坚持受益很大。


    干什么事情都不要心急，一定要坚信复利的力量，去做复利的事情，尽量减少一次买卖生意。


    # 关于保险


    参加了一个保险行业的论坛，发现一些有趣的事情，分享给大家：


    +   1、技术圈的人都想办法隐藏自己的收入，害怕让其它同事打听到；保险行业是天天晒自己的收入，生怕别人不知道。


    我觉得有可能是为了刺激下面的员工有更大的动力去挣钱。保险行业基本没有什么底薪，全部都是按照提成来挣钱，这就会出现一些现象，能挣钱的挣得非常多，不能挣钱的朋友很难活下去。'
  - '[PAGE 102]


    2、保险的提成比例还是挺不错的，不同的公司提成比例不同，但都是根据总签单金额来提成，比如你找了一家公司签了一个一百万的保单，按照 10% 提成的话，就会有
    10 万的收入，所以人脉资源非常重要。


    3、保险公司的文化挺有意思，注重仪式感，比如团队的活动非常多、出国旅游等；我个人觉得可能时平时受到的打击比较多，因此公司文化主要以不断打气鼓励为主，比如经常会给你发各种头衔、奖状等。


    保险公司也特别非常注重团队建设，因为如果你想发展更大，一定是需要团队来帮你做起来，只是依赖自己签单的提成，走的不是很远。


    另外保险是一个朝阳行业，按照中国目前的发展节奏，未来大家对保险的认知进一步的提高，购买保险的比率也会不断的上升，不要还停留在保险是骗人的这种老观念中，保险是国家的三大金融业务之一，必然有它的社会价值。


    保险分为寿险、重疾险、理财的保险吧，还有很多其它的作用，比如隔离财产风险，资金转移等等，等我在了解的更多，再给大家详细介绍一次。


    我一个老同事曾经是一名女程序员，在技术领域工作大概有七八年工作吧，也在京东一线大厂工作过，后来转型做了保险，我当时听了之后大吃一惊，后来跟她聊了很多次，让我在观念上有了很多不同的理解。


    # 一些假象


    经常会看到生活中，人们对固有印象的常识性认识错误。有的可能是因为影视剧的引导，有的是完全没脑子。


    +   1、富二代都是傻逼，天天荒淫无度。


    电影看多了吧，我了解的大多数富二代都是受过良好的教育，在见识、学识各方面都碾压普通人外，还 TM 特别节制，生活超级规律，比普通人还更努力。


    +   2、西方国家月亮都是圆的


    国外没有污染、没有腐败、人人素质极高。之所以这么无能都是因为生在了中国，所以各方面都不如意，天天骂政府、天天骂行业、天天都愤青。


    这两天刚爆出来，上市公司老总行贿 650 万美金送女儿上斯坦福被曝光。当然一同报道出来的还有美国很多富豪、明星也参与了行贿，这都是名人名校。'
  - '[PAGE 103]


    可能各个国家体制有所差别，在某些方面制度建设、yan论zi由等方面确实决定在了前面，但它毕竟也是一个由人都成的社会，很多时候人性是共通的。


    如果你在中国混不好，大概率你在国外也混不好，有时候不是环境的问题，更多时候是自己的问题。


    # 3、叫的最凶的是最受委屈的


    有时候叫的最凶的，往往是最不要脸的而已，狗叫是因为想引发人的注意，人叫往往是带有有目的。


    这些年被各种反转的新闻刷新三观，在网络上可以把一个好人黑出翔来；一个事情，经过渲染正面来讲义愤填膺，反面来讲好像也有道。同一件事不同的视角完全不同的结果。


    吃瓜群众看着热闹，无脑参与其中，天天恨这个抗那个，XXX就是你的公敌，关键是当事人都不知道你是谁，谁 care 这个无名小卒呢。


    有的人入戏太深，终究不知道自己在干什么。凡事多在自己身上找原因，世界会太平很多。


    这是世界是平等的，这个世界是不公的。


    # 知识星球的产品观


    # 一、


    最新版的知识星球新开了一个功能叫做，知识号。那么星球开通这个知识号的产品目的是什么呢？和几个朋友讨论后，猜测可能有以下的目的：


    +   1、知识星球是一个封闭的社区，信息很难直接流通，并且知识号是一个靠大 V 带起来的一个产品，那么进一步的扩展大 V 的曝光量，有助于增加知识星球的总用户量。


    有了知识号之后，星主把二维码分享到朋友圈或者群聊中方便大家关注，关注不一定要加入你的知识星球，但可以看到你的一部分动态，吸引那些态度摇摆的用户。


    +   2、有了第一步之后，有很多喜欢发言的用户，它可能在 A 星球分享了一些东西，B 星球分享了一些东西，但这些内容没有一条时间线来关联，有了知识号之后，就有一个时间线来串联起用户的分享内容。'
  - '[PAGE 104]


    这样就打通了星球与星球之间的边界，比如你看到你关注的星主在 A 知识星球中做了一个分享，如果你感兴趣也许你也会加入到这个知识星球。一般情况下你关注了知识星球，系统会帮你自动关注星主，不论星球是否免费。


    所以现在就有这样一个玩法，开一个免费的知识星球吸引读者的关注，当读者关注了免费的知识星球，也就关注了星主的知识号。


    这样免费星球内用户就可以收到星主在收费星球内容的推送，当然点击的时候会提示你没有加入，从而起到相互倒流效果。


    当然还有一个玩法，就是发一个 3 天的免费体验卡，当用户免费体验时就关注了星主的知识号，从而过期后也会收到星主的通知，提示加入知识星球。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_104_0.png)


