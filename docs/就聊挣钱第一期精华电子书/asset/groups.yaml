    极客时间玩法最具互联网化，专栏采用技术大 V+暴力营销的模式来疯狂发展。极客时间刚上线就玩起了大 V 站台的模式，最早在极客时间开课程的大 V 有：左耳朵耗子、西雅图巅、美女程序员朱茵等。这些技术圈内最知名的大
