    100 左右。


    流量主现在也分了三种，第一种是文章中的广告、个人感觉对用户体验不太好，就一直没有开通；第二种文末广告，就是在文章的末尾添加的广告，对用户干扰较少，推荐开通；第三种，可以在公众号内推荐商品，按照商品的价值百分比来提成，比较推荐是电影或者书籍。


    公众号打赏，打赏是所有收入中最少的一部分，但是对作者鼓励最大，用户用钱来赞赏，这是真的认可。


    外部广告，目前几乎是所有做公众号博主最主要的收入来源，一般会根据日常发文的平均阅读量来报价，比如平均阅读量 1 千，就可以报价 1 千。公众号大了起来之后，会稍微有点折扣，比如
