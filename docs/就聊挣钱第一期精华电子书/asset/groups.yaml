    但不是说宣传不重要，只是不要本末倒置。有了好的文章（产品）之后，就需要多花一点时间，看看行业内顶级的同行都在做哪些宣传，不要照搬，在他的基础上理解之后，能不能形成你自己的东西，做出更好的宣传手段或者活动，我相信只要你花点时间肯定是可以的。


    稍微总结一下：


    第一步，一定要解决走出去的问题，不然你再牛逼大家都不知道有个屁用。走出去有很多种形式，写文章、出书、做演讲、公司内分享、多发言等都可以，找适合自己的方式。博客园有一个朋友专门做
    github 上精品开源项目分享就收了一大批关注。


    第二步，要做出超出大家期望的产品（文章），任何你使用的不爽的东西，可能都是一个非常好的机会，比如知识星球解决读者和公众号主深度交流的问题，比如壹瓣解决公众号编辑的问题。不要怕领域很小，在一个很小的领域其实更容易出众，比如你专门研究某一个领域内的技术，在这个领域内做到前三。


    很多东西都是一通百通，千万不要贪多，我早期写了一年的博客，没有开通公众号可能那时候如果开了也做不起了，所以有时候晚点未必是坏事，适合你的时机才是对你最重要的，对于个人来讲没有什么红利期，只有你准备好了没有。


    第三，宣传一定要温和，前两者做完之后才有第三，但不是说宣传不重要，正因为宣传太重要了，说以反过来推前两步更重要。不然宣传做好了大家过来一看这'
  md: '

    另外呢，其实你看有的人的文采特别好的，写的文章传播量不是太高，怎么来讲，一定要有输入才能有输出，如果你是一个没有太多沉淀在行业或者是在自己的这个领域，都没有太多的感想的话，你也很难写出高质量的文章。


    Q：如果可以，想了解如何从用户浏览数据中提取一些关键信息，这涉及到数据分析，不知道公众号运营会不会涉及？


    A：其实做公众号，数据很重要，我每天都会看一下，每篇文章的打开率了，还有用户增长的幅度，我会根据这些来判断内容，是否符合公众号的特点，然后你其实发的文章多了，看的文章多的话也会了解到，这篇文章质量到底是不是很好，你在发的时候，你心中可能就会有预估，这个文章的阅读量会有多少，基本上不太会偏离太大。


    Q：公众号运营多平台发送工具有哪些推荐？


    A：其实现在有两个工具特别好，非常建议大家使用。


    第一个就是「新媒体管家」这个工具呢，它可以一键把文章发送到头条、知乎、搜狐号、百家号等等。


    还有一个工具叫「壹伴」，也有很多多平台的功能，但是它主要在编辑采集文章或者是采集图片的时候特别好，这两个工具基本上在自媒体行业使用最多的两款。


    Q：大家写的文章都在哪些渠道去分发？


    A：其实做公众号的话，主要是因为咱是做技术的，所以主要是在博客园，CSDN，掘金，简书，另外的话，其实我特别特别推荐大家要有自己的个人博客，还有知乎，因为，这些都是搜索引擎可以检索到的，因为我们知道微信公众号是一个比较封闭的系统，我们写的文章其实很难在外部主动被检索出来，所以说呢，有这些途径可以帮助我们去扩大文章的传播量，还有一个叫
    V2EX，这是一个非常活跃的社区，也可以在上面去多发一些感想之类的。


    另外呢，我特别建议在技术领域的这些技术号，不要天天只发技术干货什么的，偶尔去在公众号里面去介绍一下自己，介绍一下自己的故事，或者聊聊自己的职业生涯的成长，这些东西会让用户和读者觉得你和他的距离很近，这样的话慢慢才会去提高你的影响力，然后也会让用户觉得你和他的距离没那么远。


    Q：现在新申请的公众号都没有留言功能，是否有必要去申请一个企业号，再去买一个有留言功能的号，做一个迁移？


    A：相对来说，没有留言功能的号是没有灵魂的。但是我觉得如果你的粉丝还没有大于 1 万，或者是你的单篇阅读量还没有大于 1 千，完全不用考虑这个问题，


    可以通过其他的方式去引导，现在有些小程序就带有留言功能比如「公众号留言助手」。如果你确实想把它做好或者做大，并且一定规模的话，再去考虑这个，也是不错的。


    另外我看其实没有留言功能，有的人会通过做一个「知识星球」来引导，比如说引导大家去「知识星球」里面去讨论固定的话题，这个「知识星球」的可以是免费，也可以是收费，可以根据每个人的自身的情况来考虑。


    Q：公众号运营有几个方向想了解，一个是定位判断，二是粉丝增长，三是客户粘度。


    A：运营有几个方向，其实这个在开头的时候介绍了技术好的几个方向，就是每个人根据自己最擅长的方向去写。


    第二个粉丝增长，粉丝增长的话，其实主要的内容我已经在上周的公众号文章里面，有六种办法，大家根据自己的情况去选择就可以。


    读者粘性的话，这个真的是需要多做一些互动，或者是交流啊，比如说偶尔送次书了，或者是引导大家在留言区讨论某一件事情，或者是多讨论自己的的一些故事，让大家对你有足够的了解，然后这样的话也会提升一些粘性。


    Q：想知道公众号的原始粉丝量该如何快速积累？（达到1000）。想知道如何增加文章的曝光量，写文也写了不少了，基本上每篇文章都无法传播出去。20 篇文章，只有两篇文章在掘金达到了
    1w 阅读量，然后转换了 40 个的订阅量，而且这 2 篇文章在别的平台阅读量并不理想。


    A：这个其实我感觉的话，其实做技术，主要是通过自己的博客文章来积累第一批用户是最好的。但是说，如果你比较喜欢那种快速到达 1000 粉的话，其实还是很容易的。


    我可以这样讲吧，你如果在互联网上可以找到很多高质量的资源，比如说视频教学，或者是计算机的电子书，然后你把这些内容放到 V2EX，或者是放到知乎等一些平台，然后再引导大家关注你的公众号，回复某些关键字来获取，只要你做两三次，其实我觉得
    1000 粉丝应该是很容易达到的。


    还有很多朋友会让自己的朋友去介绍，来关注你的公众号，比如说你可以在文章里边去引导一下大家，比如说推荐大家把文章分享到朋友圈，或者是某些群中也是可以的。


    Q：最大的问题是，如何判断自己这个公众号是不是该继续做下去？


    A：其实我在刚开始说了一下就是，其实并不是每个人都适合做公众号。所以其实你要真心的去问一下自己，你是不是真的爱输出、爱写文章，然后通过这种方


    式去学习，或者是通过这种方式去打开对外交 流的窗口，还是说为了挣钱，如果写公众号是为了挣钱的话，其实我觉得 99% 的人都很难达到这个程度。


    也不是说因为我做到这个程度，其实很多时候公众号做好，它也是需要一个机缘的。其实现在写技术文章写的好的人特别多，但其实把公众号做好的，其实并不是说你技术多牛，然后你的公众号就可以做的越好。


    如果你做公众号，仅仅是为了兴趣爱好、学习、分享，那其实都不存在这个问题，你今天更一篇，明天更一篇。反正就是看心情，看天吃饭没有任何影响。


    但如果你就是想通过它来运营增长挣钱，把它当一个产品去规划的时候，你要考虑的问题就多了。


    +   第一，你是不是要稳定固定的时间去有频率的推送，让大家对你有好的印象。

    第二，公众号定位是什么。

    第三，你的品牌叫什么，是不是要取一个很容易传播的名字。其实一个公众号，像运营一个小产品一样，要考虑的增长、曝光、拉新、留存，这些数据其实都是一样的。只是说在这个过程中，手段有所不同而已。


    > **Q：** 如何找到几个知心的组织，几个有共同语言的公众号一起成长，不孤单，思维碰撞，技术碰撞，生活碰撞，有一种情怀。很多时候，互推的人都不了解，也不说话。技术人之间很隔离，公众号就不能互补。大号带动小号，小号为大号发光发热。几个公众号主之间互相探讨。


    > **A：** 关于用户的粉丝增长的来讲的话，互推确实是最直接最快的一种方式，现在其实有很多的微信公众号交流群，咱这个群里面应该有一部分人已经在里面了，大家都会经常会约一些和自己等量的公众号互推去滚雪球，我是非常建议大家就是这样做的。所以说其实你不要舍不得自己的粉丝，或者是不够大气，应该相互帮助，你推我，我推你，然后大家通过这种相互推广的方式去滚雪球。然后从
    1000 到 2000，从 2000 到 4000，相互帮助，相互成长。


    > **Q：** 如何积累原始 1000 粉丝，原创内容更新频率保持在什么速度比较好？


    > **A：** 这个问题前面已经回答好多次了，还有更新频率的话，主要每周做技术的话，最最底线，应该每周至少一篇吧，其实我推荐的是每周两到三篇比较好一些。


    > **Q：** 微笑哥，怎么实时得知当今的热点资讯，热点技术等？


    > **A：** 这个其实有两个途径比较好。

    第一个，是在「知乎」首页有一个知乎热榜菜单，你如果点进去的话，就可以看到，正热议的话题。


    第二个，「微博」有一个搜索的排行榜，这两个途径是很好获得最新的资讯信息的。


    如果您使用了「新媒体管家」或者「壹伴」，这个插件就有一个功能，它会每天把热点的信息给你在首页会展示出来，他们会帮助你来做一些这样的事情。


    热点技术的话，其实主要是好像看各大网站，比如说技术的博客园、CSDN，这些它会频繁推出哪些类型的文章，如果这段时间这个类型的文章多一些，就说明它是一个技术热点。


    另外并不是所有热点都是你所应该写的，如果这个热点你有不同的角度，不同的想法，或者有自己的认识再去写，如果天天跟热点的话，也会有点得不偿失。


    Q：以微笑哥的看法，公众号的红利还能维持几年？


    A：其实公众号现在已经没有红利了，现在已经是一片蓝海了。技术公众号我就关注了几十个，你想这个竞争有多激烈，但是在如此激烈的环境下，仍然是有一些新号能爆出来的，比如说「GQ实验室」，还有「今夜九零后」这个号是去年才成立的，但是现在的粉丝应该都几十万，上百万了吧，一条广告的几十万。所以说其实红利期已经过了，因为微信的增长已经到达一个上限了。但是，机会还是一直存在的，只要你的能提供差异化的内容，或者是你能用不同的方式去表达出来，让人有眼前一亮的感觉也是可以的。


    Q：公众号、csdn 博客、简书这些平台的编辑工具，有没有比较好的推荐，另外技术博客如果只做转载或者翻译是不是会有一定的局限，初期必须坚持原创吗？


    A：现在像大部分的平台，应该慢慢都支持 markdown 的语法，作为技术人的话，我特别推荐使用 markdown 语法来写文章，因为它会把排版的工作简化到最小，现在有很多这种
    markdown 的渲染工具，你可以把它在写好之后，渲染之后复制到公众号就可以了，另外你的 markdown 文章可以直接发到 CSDN，简书各大技术的平台。


    初期的话，我建议还是坚持原创比较好，后面的话，如果号做大了之后内容跟不上，可以适当的去转载一些和你工作定位比较相似的一些文章。


    Q：问下公众号的名字怎么取比较好？


    A：公众号起名的话，其实和品牌起名是一样的，简单顺口，有自己的个性，比如说「程序员小灰」，这名字起得特别好，有一个形象感，如果看他文章的话，就立马可以想到一个小仓鼠的感觉。另外的话不太建议使用中英文混合的，也不太推荐使用纯英文的一些字，最好呢就是用纯中文的形式来写，但是像
    JAVA、


    Python、Go 这种关键字还是无所谓的，因为这是大家比较容易理解，经常看到的关键字。


    ## 技术博客变现揭秘


    今天突然翻出来了自己在 2017 年写的一篇文章，分享给大家。记录了当时对博客变现的一些思考，现在看来有些内容到现在让然还是适用的。


    首先 我是一个俗人，很俗很俗的一个人，写文章能赚点外快这样也是让我持续坚持下去的一个动力，大家用钱给我的文章进行投票的时候我很满足，因为用自己金钱进行的投票，绝对是真的认可。


    在前一段时间，我甚至还画了一个变现的示意图，见附件。写文章到底有哪些变现的方式呢？其实我也不太清楚，虽然写文章一年多，开号公众号五个月，但也一直很羞涩，好像技术人员写文章要赞赏就像文人放下身段去乞讨一样，放不下面子，或者赞赏这点钱都不然涨薪来的实在。我以前就是这样想的，直到我开了公众号，发了原创文章，有了打赏，突然感觉美滋滋的，感受到深切被认可的感觉。


    随着公众号粉丝的增多，经常联系我请求转载我文章的养马场小编，突然有一天，微信给我说，强哥我准备找一群技术人员做互推，你有兴趣吗？我说有兴趣呀，我们一起试试，真是一个不错的体验，一起商议如何推广，如何达到最大效果，同事还组建了技术联盟社区。最后这次活动增粉
    1 千多，还认识了很多同样写技术博客的同行，我觉得挺有意思。


    过了两天突然 100offer 的运营人员联系我，看是否可以做个广告，我问他如何知道的我，他说是因为上次互推在安晓辉那里发现我的公众号，你看有时候这就是一件事关联一件事，一番商议之后，我现在也进行了尝试，大家可以看到这两天我的公众号下面
    100offer 的广告。


    所以我现在的写文章的收入就分为以下三个部分：


    +   1、文章的赞赏，公众号和博客

    2、大家加入小密圈的收入

    3、广告，现在只有公众号有，以后也有可能放到博客。


    说了这么多，写文章到底赚了多少钱？


    +   1、赞赏，公众号和博客共计 160 元左右。

    +   2、小密圈，一个人 66 元，大家可以自己算。

    3、广告，目前接的 100offer 每篇文章 120 左右，这是运营给的价格，直接公还价。因为我只是想试试这种合作方式。


    其实，每一种方式都是一种尝试，一种新的体验，很好奇、很兴奋它最后的结果，我也会持续给大家分享。


    其实还是有三种赚钱的方式，公众号开通流量主，也就是公众号文章下面腾讯的广告，会根据点击率给钱，一直怕影响大家阅读体验没有开，准备十一过后也开通试试；录制视频课程在网上卖，有很多平台联系过我，真的没时间，有机会可以试试；出版书籍，到是有不少出版社找我，但实在是怕误人子弟，出书的水平还不到。


    可能大家看了很失望，这写了一年多了一共才收入 2000 多元，刚开始写一篇文章需要花费我两三天的时间，刚这两三天的工资都远远超过这 2000 元钱了。那我图个啥，哈哈，有时候我也在想，但很快我又会明白过来，在钱之外我收获了远远超过我期望的很多东西，如果大家有兴趣，后期给大家分享，在钱之外我写文章都收获了什么？


    收获了什么呢？就是连接了更多的可能性，也就是今天大家看到的这些。


