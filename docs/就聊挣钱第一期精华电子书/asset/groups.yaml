    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_139_0.png)


    当时为啥加你了，然后你就可以，哈哈哈哈。


    2、你需要新造一个新词，这个词在搜索引擎搜不到结果，怎么判断呢？加上英文双引号，在谷歌搜索一下：比如图 7。


    3、你需要找一个平台，然后写几篇文章，标题要包含你刚才造的新词，这样搜索引擎才能搜到这篇文章。


    文章内容，和你的目标用户有关，这个需要自己写一下，然后放上你的微信号，放上钩子。

    尽量长一点，搜索引擎收录的可能性更大。


    去哪个平台呢？根据我不成熟的经验：新浪博客就很好，简书也行。


    当然，你最好多写几篇，这样，搜索引擎的结果，全部都是你的文章，那就更好了。


    提示：搜索引擎可能多一周才会收录，你可以随时百度你造的关键词，看看结果是不是你的文章。


    4、你需要打磨好一个文案，用来去目标文章下面留言。文案里要包含你造的新词。


    这个文案，决定了你的转化率，所以花多少时间都不为过。


    大概形式，可以参考我开始的留言：


    > 星球的精华帖内容真是太高了，各种类型的赚钱案例都有，小程序、新媒体、淘宝客、微商、电商，真的让我学到了很多。（先夸一下作者和文章，显得自己认真看了文章，留言是和文章有共鸣的）


    > 我前几天在网上看到一篇文章”钱不亦真”啥的，里面讲了很多创业思维和方法。（不要直接说，百度哈哈哈，间接一点）


    > 我室友用这个方法，短短两年就买了房，我现在也在学习里面的知识，真的是颠覆我的认知，想看的朋友可以百度索下。（描述这个方法的优点，最后轻描淡写的来一句“想看的朋友百度下”）


    > 感谢**建立的平台，感谢大家的分享。（再夸一下作者，结尾）


    这个留言是核心，所以要多多打磨，花多少时间都不为过。


    可能会被删，那就说明这个不适合，改进，再测试，删了再改，在测试，不要想着随便写一句话，流量就哗哗的来，没有这么轻松的活。


    5、去目标用户的平台，用站内搜索，通过关键词找相关文章，然后在下面留言。


    比如，去简书搜索「赚钱」，有 3w 多个结果。图 8


    当然，其他平台，还有很多，新浪博客、知乎、豆瓣等等。


    要找那些可以直接留言的平台，公众号就不行，因为需要作者精选才能看到。


    要手工留言吗？可以。


    有工具吗？百度搜一下，一大堆。我没用过，这个需要自己实践一下。


    一些细节：


    - （1）案例里作者有个自己的网站，从新浪博客是跳转到网站，如果你没有网站，直接在博客里面放微信号，也是可以的。风险，就是如果被举报，可能会封号。但一般人不会被举报


    （2）文章下面留言的话，你也需要申请一个平台的账号，可能会被举报封掉，没事，解码平台了解一下，1 毛钱一个短信，另注册一个。


    这个方法，几乎没有门槛，如果说有门槛的话，就是执行力了。


    其实再延伸一下，你会发现这种方式，在淘宝、微信都有相关案例。


    当我们碰到一个很厉害的理论/模式/产品，一定要想一下，

    这个理论/模式/产品，能不能用到其他领域/场景/用户。

    理解这点，你会发现，互联网到处都是赚钱机会。


    ## Brian 分享，TX 某内容开放平台短视频补贴项目


    项目背景：

    TX 某内容开放平台重点扶持 WS、Y 视频，拨大笔预算采买内容，以对抗 DY。

    A 公司，网红直播行业头部。B 公司（本人曾就职），娱乐营销行业中上部。


    前言：这是另一类“露露”的故事，关于短视频的羊毛之战。


    对以下因素的领悟，是我最大的收获。它们亦贯穿于全文始终，是表象后最重要的原因。希望对大家有帮助。


    - 1. 市场时机

    2. 人际关系

    3. 信息不对称

    4. 预期控制

    5. 最大化价值利用


    正文：


    某年二月，某内容开放平台开始进行小视频内容采买，在 WS 平台发布 15S 小视频，根据视频数据，最高每条补贴 3000 元。所有人都知道，这将会是一大笔羊毛，越早的人才吃到最肥的肉。所以，谁能在
    TX 内部有过硬的关系，第一时间得知此消息，将会赚的盆满钵满。


    三月，第一批供应商试运营接入。此时，试运营资格是核心竞争力。中小公司即没门路入驻，甚至方才听说这个项目。于是，获得资格的公司，开始疯狂做两件事，1．招募小视频拍摄者（以下简称为达人）；2.
    招募挂靠机构。


    以 A 公司为代表，自身拥有大量网红的直播公司，让所有主播拍小视频。B 公司等非网红为主营业务的公司，迅速组建运营团队，网上招募达人，吸纳挂靠机构。（当然这些
    A 类公司也做，但因其本身招募能力较强，所以接收挂靠较少，毕竟，挂靠利润不高，风险也大）。


    此时，TX 方面整体的系统还很烂。从递交达人审核（通过人工给对接人员发 Excel），到审核（WS 临时组成的审核人员，量多时甚至直接全部入库，不审核），到审核通过入库（经常会出现入库不成功，耗时一周以上的情况），都非常原始粗糙，漏洞百出。

    谁能提供越多的人，谁就能赚到越多的钱。


    为此，A 公司调整对外结算策略，将最高补贴提高至万元，同时降低其他档次的补贴。也就是说，它并非按照 TX 对供应商的结算标准，简单抽成后复用，而是建立了一套新的结算规则。B
    公司发展事业能力，直播、舞蹈室、夜店、影视行业、学校，所有人会用手机的人，都可以是招募的“达人”。


    - 这其中，运营的工作便是，

    1. 招募：各个平台发私信，加微信，聊天（忽悠提交资料）；

    2. 维护：不停催更已入驻的达人。此外，还有一些小的技巧，激发所有人的贪欲，例如排名最高的达人，能够获得额外的奖金或者保底（其实都是假的，因为你怎么知道这个获奖的达人，不是公司本身的运营呢）。


    四月，某内容开放平台为了冲全盘日产过万的指标，开放入住，疯狂接入了一千余家机构。WS 平台上充斥着大量垃圾视频，因为绝大多数都是为了蹭补贴的账号，而这些账号，就是为了用最小的代价，获得补贴。十八线城市的宝妈、农村大妈、无业游民，什么人都有。而挂靠机构的层级，少则一两层，多则五六层。


    300 块一条 TX 的补贴，经过层层抽成后，可能到达人手中只有 20 块。

    但这依然是钱，所有人都在看着 WS 前端数据，焦急的等待着结算补贴。


    五月，某内容开放平台第一次对供应商结算，爆出欠薪新闻。


    原因是结算并非以“前端数据”为准，而是 WS 后台“真实有效浏览数据”。而这两个数据，相差 20 倍左右。而供应商及其挂靠机构，是按照前端数据与达人沟通。


    权游中小指头说，“混乱即是阶梯”，没错，此外，混乱也会带来财富。


    其实整体结算涉及三种数据，“前端数据”（APP 中显示），“真实数据”（除去平台自身机器人），“有效数据”（真实数据的进一步筛选）。这三种类型，对于大部分从事这个行业，只有大专文化左右的网红运营来说，自己都搞不清，跟别提那些一心只想着赚钱的低文化网红了。


    而这其中，除了“前端”每个人都能看到，“真实”及“有效”只有 TX 后台才能导出，且并不对外公开（涉及到核心机密数据了）。


    也就是说，标准是 TX 定，是否达到标准，也是 TX 说了算。是不是很绝。


    没错，从这个角度说，TX 想结算给你多少，就给多少，与你实际表现关系不大，且，这种做法合理合法。


    那么，作为供应商，是否就处于绝对的劣势呢。


    是的，相对于甲方来说，是不占优势，因为你的手里根本没有牌。


    但是，相对于达人来说，你就占据绝对的信息优势了。因为“有效数据”，TX 作为结算依据只会给到你，不会有第三方可以查询到（内部有人除外）。那么，你是否要按照
    TX 的结算数据，简单抽成后，给到达人呢？


    99.99%的公司不会这么做。因为这样利润率最高也就 20–30%。


    我们要做的是，打造另一份“真实数据”，用来对达人结算。制造更多的信息不对称。


    举个栗子，TX 给某达人结算 10000 元，如果按照 TX 的 a 数据版本，我需要结算出 7000 元，但仅仅 3000 元的利润怎么够呢。于是，我另造了一份结算数据版本
    b，在此版本中，某达人的数据下调 60%，这时，按照同样规则，我只要结算出 3000 元就够了。


    同理，只要挂靠机构可以保证自己所拿到的数据不被第三方获取，就可以这么操作。


    甚者，因为 TX 账期跨度将近三个月，当你不拍/不合作时，其实还有两个月的补贴 TX 未结算，所以作为上级机构来说，最明智的做法就是，一分钱都不给你结算。


    事实上，我们就是这么做的。


    - 一个被招募的达人机构使用期限大约为 3–4 个月（预期控制好的能有 5–6 个月），会经历如下几个阶段：

    1. 忽悠入住/合作：这点应该很好理解，不仅是画大饼，甚者就是欺骗，一切就是为了让你先提交资料拍视频；

    2. 维护：催更，用他人案例吸引你，用不会被兑现的特殊奖金/保底诱惑，鼓励你发展下线赚钱；

    3. 回流：第一笔补贴拿到手后，所有人都会不满意，会暂停拍摄。这时运营会不停安抚、鼓励，直到尝试让你继续拍摄，或者确认你不再合作。回流成功运营会继续维护，而失败则进行下一步；

    4. 甩锅，废弃：运营将会把锅甩到 TX/上家机构头上，并表示自己如何亏损，已仁至义尽，最后与你同仇敌忾，安稳结束合作，以便下一次收割；


    没错，肯定会有越来越多的人停止拍摄，所以机构需要做的便是，持续不停大量招募，以便补充机构达人总数。这期间，如果有任何达人投诉，公司在 TX 内部的人将会处理。


    当然，后续因为能够被忽悠的人越来越少，TX 后台版权检测也越来越健全（之前靠盗版搬运视频的机构赚了一大笔），该项目的流水也就不断在萎缩了。


    另，Y 视频项目也是同理，忽悠一些达人/机构拍了一些 PGC 视频，利润率 50%。


    结尾：

    我在 B 公司期间负责总操盘，总计流水百余万，利润率 90%左右（不计人员及固定办公成本）。而 A 公司营收应该过亿，利润千万级别。


    离职后，我又自行入住，但失去了市场时机，同样的玩法，亏了 10 万。（有机会详细分享给大家）


    ## 光光分享：《揭秘“全网影视 VIP 卡”的背后产业链》


    听王二讲述什么是「影视站」、「资源站」、「解析接口」、「影视 APP」，看着为什么王二说“做人要善良”。


    王二是一家手机店的维修员，黑瘦黑瘦的，大学毕业没几年，但长的像个 30 来岁的人。由于经常去这家手机店，一来二去就和王二熟络起来，记得当时影视


    VIP 卡卖的火热，我问王二为什么不去卖卡，王二一本正经的和我说：“做人要善良”。王二有深吸了一口烟，许久后，开始和我讲述起来这里面的事。


    ### 1. 影视站


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_145_0.png)


    当时王二还是个大学生，喜欢上网，喜欢看电影。由于很多热门电影需要电影院才能看，还是个学生的他总不能每个电影都买票去看，只能找一些免费的抢先版来凑合。无意中找到了一个网站，里面每日更新资源，电影电视剧也是全网里最清晰的，王二一下子就爱上了。那个网站叫”yy6080
    新视觉影院“。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_145_1.png)


    这个网站算得上是当前影视站的鼻祖了，影视站是近两三年才火起来的。去百度搜索”VIP 影视 导航“会有约 23,200,000 个结果。随便点击一个进去会发现里面充斥个各种广告、体验不人性化、播放视频顶部还有滚动广告……


    王二说，这类网站当你看了十个，一个个的时候就会发现，他们长的都差不多。因为都是模板生成的。而开发一个这种网站，现在的成本极低！弄个域名，买个虚拟主机，在随便找一个免费模板，稍微懂点前端技术的一会就能搞出来一个网站，实在不懂技术，或者懒的，可以去某宝话几十块帮忙搭建。整体下来成本不到
    200 块


    而且网站所有资源都是会自动更新！不懂技术也没事，傻瓜式操作，管理后台设置好采集规则，直接不用理了，模板内部的逻辑会把一切都处理妥当的。


    这类网站主要是靠广告来盈利，广告肯定选择收益最高的黑五类，网站主(站长)才不管什么体验不体验“铁打的广告，流水的用户”。

    站长一般都是靠搜索引擎和社交渠道传播带来用户，有的站长会稍微懂点 SEO 知识，去做关键词、权重、互换友链，还有的直接就收购小的站点进行合并了，简单粗暴。站长们一般都会在社交渠道里下钩子，让用户来自自己的网站”占便宜“，仔细想想群里、朋友圈有没有出现过”高清
    免费 视频观看“这些字眼呢。


    到这里有个疑问，模板智能我可以理解，但是模板总不能凭空变出来视频资源吧？王二嘿嘿一笑，叫我别急。吸口烟继续讲了下去...


    ### 2. 资源站


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_146_0.png)


    在百度里搜”影视 资源 采集“会有约 9,450,000 个结果。随便点进去一个会发现，嗯 所有的资源站长的也差不多，都是以最简单的列表形式展示出来，有个搜索的功能，有个采集教程，有的还有官方
    QQ 群。

    资源站是提供给影视站采集用的，所有的资源都会有专人进行维护，每天都会更新资源。

    做资源的人为了给不懂技术的新站长使用，一般都会制作一个简易的采集教程。有的资源站还会把伦理资源放出来，供站长筛选。资源站里的资源能涵盖市面上绝大多数的观影需求(如果缺片还可以联系管理添加，是不是很人性化？哈哈)。


    资源站的站长有一个小圈子，最新上映的电影一般都会在小圈子里传开。站长们会把视频(电影、电视剧等)做处理后在给影视站的人使用，常规操作就是把视频加上水印。

    水印的内容一般都是这种：新葡京娱乐场、威尼斯真人、澳门金沙、美女荷官在线发牌、一千万三分钟出款...后面跟上链接地址。影视站采集的越多，资源站越开心。


    资源站通常只有加水印这一种方式变现，在水印的背后是魔鬼。王二说他见过一个刚步入社会的朋友，搭建维护这种平台，魔鬼一个月会支付他六位数酬款。


    王二说：”这还不算什么，你继续往下听...“


    ### 3. 解析接口


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_147_0.png)


    影视圈里，总有人追求体验，追求体验的人里总有技术宅。他们不满足于影视站的满屏广告，给这场侵略战打响了真正的第一枪。


    众所周知，当前常用的视频平台有：爱奇艺、腾讯视频、优酷、芒果 TV、华数、新浪视频、PPTV、乐视等，由于版权问题经常出现 A 平台能播的剧 B 平台不能播，总要一下买很多平台的账号才能满足自己的观剧需求。


    技术宅们通过一些技术手段，来绕过平台会员的限制，直接就能观看影片，并把其封装成一个网站。你输入一个视频地址，任意平台都行！等待片刻就能看见高清、甚至蓝光的视频了。


    解析接口基本攻克了你所能看见的所有平台，


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_148_0.png)


    解析接口分为两类，收费和免费。


