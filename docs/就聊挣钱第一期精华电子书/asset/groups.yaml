    ## 圈友精华分享


    ### Quincy. 分享：赚钱的看法


    这里我不准备说什么赚钱的案例，我说说我的个人看法。

    我觉得赚钱，尤其是以财富自由为目的的赚钱，最好满足以下几个条件：


    - 1. 从你熟悉的领域干起，从能改善你所在行业的需求干起。

    - 2. 第一桶金很重要。

    - 3. 一定是要钱生钱的模式。


    首先说明，我个人还未成功，所以上的条件，均是我根据长期的观察和各种案例阅读得来。


    先说说第一个：从熟悉的领域干起。


    我觉得其实日常生活中的机会多不胜数，各行各业的，就像很多朋友分享的案例。

    你只要有眼光，抓住机会，勇于实践，持之以恒肯定能成。

    眼光我觉得大家都有，机会你也可以去抓住，但是在实践环节，就是体现个人能力的时候。

    这里就会有个问题，如果我跨行业创业，我凭什么比那些处在那个行业的人还优秀，还有能力？

    举个例子，我搞网络的，如果我现在发现搞外贸能赚钱，但是和专职搞外贸的比起来，人家有人脉，有经验。

    凭什么我就会比他们厉害？凭什么这个机会就我发现了，人家没发现？大家都是聪明人，没有谁比谁笨。


    反过来，如果我从自己熟悉的行业干起，第一我知道这个行业存在的机会，我也知道大家需要什么。

    最主要的，我有足够的经验和人脉支撑我去做这件事情。


    我记得有一个案例说过，从你开始准备创业，到后面成就大事业。你会发现刚开始创业所从事的事情，可能和后面最后做的风马牛不相及。这里就牵扯一个过程：你从 A 创业，结果干的时候发现有
    B 机会，最后做到 B 的时候发展成 C，然后 C 又演变成 D。而 D 就能让你财富自由。

    打个比方，如果创业初期就想到我要做一个环保公司，拯救世界，我觉得这个公司大概率事件会死。（你要是有一个有钱的爸爸，那是另外一回事儿）

    所以，我觉得刚开始做，就做一个自己熟悉的行业，但是又能解决一些大家的需求问题。

    例如这周六分享的这个网盘，就是一个程序员通过发现一个行业需求，然后通过自己的技能去创新实践，最后赚钱的故事。他并不是做跨行业的事情。


    第二个：第一桶金很重要

    这个我觉得很好理解，就拿最近很扯淡的那个电影：《西虹市首富》，就是一个最典型的例子，当你有钱以后，想不赚钱都难，只要你不干傻事，例如投钱给 A 股。

    所以，如何让自己有第一桶金的钱，非常重要。

    我因为在国外，就比较关注国外的华人创业，有很多华人就是从开始从倒卖装电影的硬盘起家（国外版权比较严，没法非法下载电影）。赚了第一桶金以后，就开始把赚的钱来做外贸，买卖房屋，几年就不愁吃穿了。


    第三个：钱生钱很重要。

    我觉得，要做到财富自由，首要一点就是，你得有一个持续不断的 cash cow 现金牛生意。

    所谓持续不断，就是指假设你离开了这一门生意，它还能持续运营。

    而不是自己白天给老板打工，晚上再给自己创造的另外一个工作打工。

    例如这周六的这个例子，你只需要短期的投入，或者间歇性的更新。大部分时候人们就过来注册也好，访问也好，持续不断的为网站主贡献收入。

    我觉得这一点很重要。


    说说我自己的计划，我 18 年才刚开始搞副业，咱国家目前的机会比较多，毕竟人口摆在那里。

    所以在国内做基于流量的生意就很容易起来，但是你得有一些点子。目前在某个博客平台做贡献，也搞了两专栏卖了点钱。

    但是最主要的，我收获了很多反馈，关于他们都需要什么，我觉得这是才是最有价值的。

    然后基于他们的反馈，我目前在琢磨某个网站，此网站的目的就是解决他们的需求。

    网站盈利方式估计将会是会员制以及内容付费的方式。


    你生产一次内容，收入将是以买家数量为倍数，这同时满足了我上面所说的三个条件：自己熟悉的行业，赚取第一桶金，不需要持续不断的为其工作。


    希望上面的内容能够对大家的财富自由能有所帮助。


    ## 林先生的独白分享：程序员如何优雅的挣零花钱？


    一是私单

    最理想的单子还是直接接海外的项目，比如 freelance.com 等网站。


    一方面是因为挣的是美刀比较划算，之前看到像给 WordPress 写支付+发送注册码这种大家一个周末就能做完的项目，也可以到 200~300 美刀；另一方面是在国外接单子比较隐蔽。


    国内 shixian.com 的价格也很不错，但是我强烈建议大家不要在介绍中透露实名和真实的公司部门信息，因为这实在太高调了。


    有人说，这是我的周末时间啊，我爱怎么用就怎么用，公司还能告我怎么的？


    虽然很多公司的劳动合同里边并不禁止做兼职，但在网上如此高调的干私活，简直就是在挑衅 HR：「我工作不饱和」、「公司加班不够多」…


    再想象下你一边和产品经理说这个需求做不完，一边自己却有时间做私单的样子。你自己要是老板也不愿提这样的人的吧。


    当然，猪八戒这种站我就不多说了，不太适合专业程序员去自贬身价。


    二是 Side Project


    比起做私单，做一个 Side Project 会更划算。


    Side Project 的好处是你只需要对特定领域进行持续投入，就可以在很长时间获得收入。


    这可以让你的知识都在一棵树上分支生长，从而形成良好的知识结构，而不是变成一瓶外包万金油。


    思路有两种：


    一种是做小而美的，针对一个细分领域开发一个功能型应用，然后放到市场上去卖；


    另一种是做大而全的基础应用（想想 WordPress），方便别人在上边直接添加代码，定制成自己想要的应用。


    有人会说，我写的 Side Project 卖不掉啊。


    项目方向的选取的确是比较有技巧的，但简单粗暴的解决方案就是找一个现在卖得非常好、但是产品和技术却不怎么样的项目，做一个只要一半价格的竞品。


    三是做咨询


    如果你在技术圈子里边小有名气，或者在某一个业务上特别精通，那么通过做咨询来挣钱是一种更轻松的方式。


    和人在咖啡厅聊几个小时，几百上千块钱就到手了。


    国内这方面的产品，我知道的有三个：


    - 在行在行 - 领先的知识技能共享平台：这个是果壳旗下的，做得比较早，内容是全行业的，所以上边技术向的反而不多。

    - 绿创派 http://q.ycpai.com/h5/lightPartner/expertList：绿创派的轻合伙栏目，主要面向创业者，适合喜欢感受创业氛围的技术专家们。

    - 极牛 400 The plain HTTP request was sent to HTTPS port：你可以认为这是一个程序员版本的「在行」，我浏览了下，虽然被约次数比在行要低不少，但专业性比较强，期望他们能尽快的推广开来吧。


    做咨询虽然也是实名的，但和私活是完全不同的。


    咨询的时间短，不会影响到正常的休息，更不会影响上班；而且大部分公司是鼓励技术交流的，所以大家的接受度都很高。


    除了网站、APP 外，我觉得收费群也是可以做的。


    现在交流的地方看似很多，但遇到问题后真正能快速帮你解决的地方却很少。


    比如可以搞一个技术创业群，找一些创过业的同学、正在创业的同学、做投资的同学、做法务的同学，面向想创业的同学开放，每人收个几百块的年费。


    然后你在创业过程中遇到的问题，都可以有人解答，不会觉得是孤零零的一个人。


    你问题是没遇到问题怎么办？没遇到问题不是开心死了么。


    四是写文章


    很多人喜欢写技术博客，其实把文章投给一些网站是有稿费的。


    比如 InfoQ，他们家喜欢收 3000~4000 字的深度技术文章；稿费是千字 150 元。


    虽然不算太多，但一篇长文的稿费也够买个入门级的 Cherry 键盘了。


    我喜欢 InfoQ 的地方是他们的版权要求上比较宽松。


    文章在他们网站发布后，你可以再发布到自己博客的；而且文章可以用于出书，只要标明原发于 InfoQ 即可。


    顺便说一句，比起写文章，其实通过传统发行渠道出书并不怎么挣钱，我之前到手的版税是 8%，如果通过网络等渠道销售，数字会更低。


    出电子书收益会好一些。


    身为程序员的我们，虽然工资一般会高于其他行业，但是想要有个好的生活还是很有难度的，多发现赚钱的点子，一点点积累，你一定会比大多数人过得好！


    ## 沉默王二分享：如何拓展自己的可控区域？


    首先，我们来给可控区域下一个定义：一些你可以直接控制和影响的事物；比如说你的挣钱能力，公众号的粉丝关注数。


    那，如何拓宽自己的可控区域呢？最直接的方法就是走出自己的舒适区。


    拿我自己来说。


    三周前，我每个月领八千多的工资，在洛阳已经算是无忧无虑了。房子是学区房，房贷又不愁；车子是北京现代的领动，虽然不是自己想要的 MINI，但遮风挡雨；老婆呢，比我还能挣钱；女儿呢，聪明伶俐；自己呢，还算是积极向上。照理论，这样的人生应该知足的——也就是我自己所谓的舒适区。


    但，其实内心是恐慌的，因为挣钱比老婆少，家里的话语权是受到质疑的，这一点，长期的折磨着我。


    终于，在三周前的某一个晚上，被老婆的冷言冷语激怒了——人家觉得我太没有上进心，换句话说，就是不思进取，总之一个道理。我怎么能算没有上进心呢？


    我一不抽烟，二不喝酒，三不赌博，四不近女色（微微一笑，很纯洁）。然后每天坚持读 10 页书，每周写一篇文章，生活挺自律的。但有一点，这些都没有提升我的挣钱能力!!!


    一夜没睡，翻来覆去，思来想去，决定要改变自己。


    首先能想到的，提升经济能力最直接的方法就是跳槽啊，但查了查洛阳的技术岗位，工资水平也就我现在这样了，再高点的，是要加班加点辛苦工作的，可不像我现在这么自由——也去了一家公司面试，拿钱和我现在一样多，但要加班，还是单双休——跳槽的打算不得不放下。


    既然换工作不靠谱，那只能接私活了。但，接过私活的人都知道，接私活就是熬身体的，况且结款还是个未知数，保障系数很低啊。可不接私活，暂时也没有其他的办法，总不能只身一人跑去北上广吧？


    但在接私活方面，我突破了自己——咱不能再单打独斗了呀，要找几个小伙伴一起干啊——安卓咱不会，找；IOS 咱不会，找；技术深度咱不够，找；总之，要把自己的短板通过团队弥补起来——于是，我就组建了青苗科技工作室。


    并且，决定立即行动。周末我就买了去郑州的高铁票（回来的时候没找到业余票说的老头，差点坐不了地铁，错过高铁），邀请大学的同学聚会，商谈未来合作的可能性。


    这一次，可不要紧。


    知道了很多秘密，比如说我有一个同学是干淘宝客的，年入百万以上了，今天刚买的车，刚买的房；厉害啊，我的哥。我这老铁劝我打开思路，拓展自己——于是我立即就掏了
    60 块钱加入了微笑哥（纯洁的微笑）的知识星球——在这之前，不知道为什么被微笑哥加了好友，然后在朋友圈就看到了微笑哥的星球（是不是被套路了？哈哈哈）。


    回来后，我就趁热打铁的写下了《为了月入三万的目标，我都做了哪些准备》。我自己觉得写得非常不错，但在 CSDN 上发表后，发现没有浏览量（我可是 CSDN 的博客专家啊，可真的是没人看，浏览量只有几十个）；气愤的我决定在博客园也发表一下（博客园第一篇，之前一直爱着
    CSDN），没想到，这一篇文章火了，一天的时间，浏览量突破 7000，评论超过 80 个，我的天，好多人加我微信啊！于是，我决定组建一个青苗科技孵化谷的群，把这些关注我的人都拉进去。


    更没想到的是这篇文章被微笑哥认可，要在公众号转载；高兴啊，激动啊，被大佬赏识的感觉真的很妙啊！不出意外，微笑哥转载的那天，我看浏览量超过 7000，然后又有很多小伙伴加我微信，关注“沉默王二”的公众号。


    同时，我被微笑哥推荐到一个公众号的原创群里。里面好多个大佬，但都一声不吭。我发了一个红包，好像第二天微信又返给了我不少。但，重要的是，这里面有人把我拉入了另外一个公众号的互推群！


    看大佬们聊天，“1000 的小车有谁上啊？”（我心中疑惑啊，小车是啥？1000 又是啥？经过长期的暗中观察才知道，原来是浏览量，我以为是粉丝数量呢）——之后，又被各种人伙加群，好吧，终于等到机会了，有人要推
    100 的小车，刚好《为了月入三万的目标，我都做了哪些准备》这篇的浏览量超过了 300（之前的文章只有不到 50 的浏览量），我喊要上车，竟然被同意了，好开心，好激动（原来公众号可以互推啊，并且效果真的不错，一天有百十号人关注呢，最近每篇文章的浏览量维持在
    200 左右，差别很明显啊）


    于是，我想，既然《为了月入三万的目标，我都做了哪些准备》这篇文章这么火，不妨介绍给安晓辉老师的公众号吧，起初，我以为他不会同意呢，结果我亮出微笑哥的转载记录后，他欣然接受了。


    果然，大佬的转发是有效果的，其中有一个洛阳本地的程序员加我微信，说是从安老师公众号（程序视界）看到我的，邀请我参加洛阳的一个读书线下交流会——我犹豫再三，推辞再三，最终决定参与，去之后真的打开眼界啊——我才意识到，原来参加线下交流真的很重要，不仅锻炼你表达自己的能力，还能够拓展眼界（玩区块链啊，读政府工作报告啊），我于是决定也参加樊登读书会在洛阳的线下交流会（这周二参加了一次，受益匪浅，大家一起读书的仪式感让我读书更加的专注）。


    事情到这还没完。


    我组织成立的青苗科技工作室中有一位组员帮助一名大学生解决了一个问题，免费的（大学生包了 20 元红包，我那伙计没要，一来二去就产生了信任）。然后大家建立了信任，这名大学生就找我们做毕业设计的项目，注意是付费的哦！挣钱的时刻到了！


    毕业设计的项目好处多多啊！价格虽然不多，但周期短，任务简单，回报率真的很高了。这一周我就接了两单，一单做安卓，一单做小程序，可惜我都不会。这不要紧啊，青苗科技孵化谷里有的是人才啊，于是我就把项目转交给我信任的两个伙伴，请他们协助一起做——大家一起赚钱，都开心啊！


    写得有些乱，总结一下。


    三周时间，我有了很大的改观：


    - 1、 人特别积极，打鸡血也没这么积极；挣钱就是最强的动力，金钱虽然不能直接带来幸福，但可以提升生活品质啊。积极的人就容易带来质变，比如说我主动找 CSDN
    的涛哥把《我是如何从写不出来，到完成二十万字书稿的？》这篇文章推荐到首页，3 个小时不到，点赞数就突破了 50 个。

    - 2、公众号的粉丝关注人数直接翻了两翻。

    - 3、因缘际会，各种人际关系就找上了门（毕业设计就是，还有两家出版社），这就知识变现了啊；切记，要维护好每一层关系，这样才能打造一条生态链。

    - 4、做！别停留在想法（要成立组织就赶紧，成立后别光想创意，赶紧实操啊；反例，星球有人加一起做培训，但就兴奋了一天，第二天就不了了之了；但我们不同，域名买了，服务器买了，并且每天都在把想法脚踏实地的执行下去）。

    - 5、敢于做出改变；CSDN 发表的文章没人看，转战博客园啊。

    - 6、哪里不会补哪里。虽然我已经写完了 20 万字的书稿，但仍然写不出来好故事，于是就报名参加了一个写作训练营，督促自己做出改变。

    - 7、读书啊，别每天沉浸在社交不能自拔，别看不到微信中红点就发慌；手机该飞行模式就飞行模式，电脑该扣 QQ、微信退出就全退出；静下心来去读书；读书，可不只是看文字，重要的是反思总结实践书上提供的想法。（我今天为什么发表这个感慨，就是因为我看了《财务自由之路》这本书，这会感觉自己是沸腾的，写作有一种行云流水的感觉）


    ## 小河叔分享：一个人单枪匹马，筹备线下培训班


    组织一场线下的培训班。在学员招募的过程中，我也是采取了优先发展种子学员的思路。最终，我单枪匹马一个人通过这个培训班，收到了 33 万的现金。那么，我是怎么组织起这个培训班的呢？


    在培训班宣传文案当中，我提出了这样一个合作主张：前 10 名种子学员，将能够享受一些与众不同的待遇。


    - （1）他们先付费给我，之后我会把他们拉到微信群里面。他们不但可以全程参与我的社群实战，亲眼看我如何在只有一个人的情况下组织起一个线下培训班，而且在这个过程当中，我还可以带领他们一起参与实操。

    - （2）这次线下培训，如果报名的人数达到 30，我将会退还他们一半费用。如果线下活动报名人数达到 60，我会退还他们全部费用。此时此刻，他们 10 位就相当于参与这个活动的首批众筹股东。

    - （3）在做活动之前，我提前给了他们了一个承诺。当时这个线下活动什么时候举行并没有确定，只有人数达到 30 才会开课。但如果说，一个半月之内还不能组织起来，我会把费用一分不少地退还给他们。也就是说，我给到了他们一个零风险的承诺。


    通过这些合作主张，在 2015 年 10 月 22 号下午，在我发出第一篇公众号文章半个小时之内，就收到了两笔报名款项。等种子学员人数超过 30 的时候，我收到的款项已经远远超过我筹备这次线下活动所有成本开支。直到此时我才开始去讨论会场，然后跟大家确定上课的时间。整个过程，我感觉非常轻松。


    在开设传统培训班时，正常的流程是先预订酒店，提前担负几万、十几万的会务开支。之后再在开课之前，招募到足够多的学员，以此保证收支平衡。而我筹备的这次培训完全不一样，因为我不必提前承担不可预知的会务成本。我通过发展种子学员的方式，用最轻松、最简单的方法达到了我预期的效果。


    ## 满念分享理财心得


    这篇文章是分享一下理财心得，是我根据自己所读到的书籍来进行总结的一些知识，只是一些入门的书籍，包括并不限于《小狗钱钱》、《穷爸爸富爸爸系列丛书》《小岛经济学》，我只是一个刚毕业的大学生，看到的有限，所以仅供参考，并不构成任何的投资建议，投资需谨慎。


    量入为出是经常听到的概念，我也是以入和出两个方面来说明一些理财的心得，也就是说一方面是赚钱，一方面是留住钱。


    ### 赚钱


    这里说的赚钱其实是和穷爸爸富爸爸里面的资产是类似的，是一种把钱放入自己口袋的东西，可以是一种能力，也可以是人际关系，或者资源，在这举三个方面的例子，分别是学习，工资和股票。以这三种为代表，以便更好的说明。


    第一点是学习，这一点是最重要的，一个人赚钱的多少很大程度上是取决于自己的能力的，而提高自己的能力最好的方式就是学习。对于年轻人来说，这方面需要有很大优势，但是需要明白自己想要学习的方向，在
    30 岁之前学深一门技术，到后面不会陷入劣势，持续领跑。对于稍大的人来说，在学习方面都应该有自己的方法了，如果没有，那么请好好学习吧！对于每个人来说，学习是一件终生的事情，但是并不是每一个学习的人都能挣到钱，方向很重要，特别是在这充满潮流的世界，找到适合自己的挣钱方法！


    第二点是工资，这是大部分人获得钱的方式，同时也是大部分人挣不到钱的原因，过度依赖工资，以致于失去了工资自己就基本丧失了风险承受能力。工资只是自己出卖自己的自由和时间换到的，而且还不是全额，不然你的老板是活不了的。当然这并不是让每个人都不去找工作的意思，毕竟不是谁家里都有矿的。有句话说的好，在
    30 岁之前学会为别人做事，在 30 岁之后学会为自己做事。这个世界很大，你一个人能见到的很有限，但是你可以跟着一群人见识更好的世界，我觉得这才是真正找工作的原因，这样不止能学到不少东西，你获得的工资也可以成为你投资自己学习，或者其他资产的资本。另外，有一点是不可否认的，当你的能力足够的时候，你也是可以靠工资获得不用愁的资金，但是条件限制决定了这只是符合少数人的赚钱之路。


    第三点是股票，当然不会只说股票的，只不过他是最具有代表性的，代表着一种钱生钱的投资方式，但是这方面需要有一定的资金和时间，有可能花费的时间比你工作的时间还少，但是比你的工资还高。股市就是很好的例子，有的人全职做操盘手反而没有业余时间做挣得钱多。不过既然是钱生钱，那么我认为重要肯定是怎样花自己的钱，当然最好的而且最没有危险的方式是投资自己，让自己变的值钱，成为一个斜杠青年才是最舒服的方式挣钱的，不过人力有时尽，所以

