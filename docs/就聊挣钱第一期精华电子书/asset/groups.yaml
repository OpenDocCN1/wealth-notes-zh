    # 满念分享理财心得


    这篇文章是分享一下理财心得，是我根据自己所读到的书籍来进行总结的一些知识，只是一些入门的书籍，包括并不限于《小狗钱钱》、《穷爸爸富爸爸系列丛书》《小岛经济学》，我只是一个刚毕业的大学生，看到的有限，所以仅供参考，并不构成任何的投资建议，投资需谨慎。


    量入为出是经常听到的概念，我也是以入和出两个方面来说明一些理财的心得，也就是说一方面是赚钱，一方面是留住钱。


    # 赚钱


    这里说的赚钱其实是和穷爸爸富爸爸里面的资产是类似的，是一种把钱放入自己口袋的东西，可以是一种能力，也可以是人际关系，或者资源，在这举三个方面的例子，分别是学习，工资和股票。以这三种为代表，以便更好的说明。


    第一点是学习，这一点是最重要的，一个人赚钱的多少很大程度上是取决于自己的能力的，而提高自己的能力最好的方式就是学习。对于年轻人来说，这方面需要有很大优势，但是需要明白自己想要学习的方向，在
    30 岁之前学深一门技术，到后面不会陷入劣势，持续领跑。对于稍大的人来说，在学习方面都应该有自己的方法了，如果没有，那么请好好学习吧！对于每个人来说，学习是一件终生的事情，但是并不是每一个学习的人都能挣到钱，方向很重要，特别是在这充满潮流的世界，找到适合自己的挣钱方法！


    第二点是工资，这是大部分人获得钱的方式，同时也是大部分人挣不到钱的原因，过度依赖工资，以致于失去了工资自己就基本丧失了风险承受能力。工资只是自己出卖自己的自由和时间换到的，而且还不是全额，不然你的老板是活不了的。当然这并不是让每个人都不去找工作的意思，毕竟不是谁家里都有矿的。有句话说的好，在
    30 岁之前学会为别人做事，在 30 岁之后学会为自己做事。这个世界很大，你一个人能见到的很有限，但是你可以跟着一群人见识更好的世界，我觉得这才是真正找工作的原因，这样不止能学到不少东西，你获得的工资也可以成为你投资自己学习，或者其他资产的资本。另外，有一点是不可否认的，当你的能力足够的时候，你也是可以靠工资获得不用愁的资金，但是条件限制决定了这只是符合少数人的赚钱之路。


    第三点是股票，当然不会只说股票的，只不过他是最具有代表性的，代表着一种钱生钱的投资方式，但是这方面需要有一定的资金和时间，有可能花费的时间比你工作的时间还少，但是比你的工资还高。股市就是很好的例子，有的人全职做操盘手反而没有业余时间做挣得钱多。不过既然是钱生钱，那么我认为重要肯定是怎样花自己的钱，当然最好的而且最没有危险的方式是投资自己，让自己变的值钱，成为一个斜杠青年才是最舒服的方式挣钱的，不过人力有时尽，所以'
