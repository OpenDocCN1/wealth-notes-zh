    其实做公众号就像开公司一样，需要有品牌、传销、推销等，非常考验一个人的综合实力，现在做技术公众号的人越来越多，刚我自己就关注了大大小小上百个技术公众号，如何在其中脱颖而出确实是很难。


    很多人说现在早已经过了创建公众号的红利期，这个确实是现实情况，但对于真正有能力的人，根本就不需要有什么红利期，比如几年前突然就冒出来的：吓脑湿、今夜九零后这些公众号，都是在短短的时间内吸引几十万粉丝，阅读量篇篇过
    10 万。


    最后用一句话来总结一下，种一棵树的最好时机是十年前，其次是现在。如果你有非常强的挣钱欲望，就必须要有非常强的行动力来匹配，不然真的会很难过，自己的行动跟不上自己的思想。


    但同时很多事情也确实都是需要过程的，回想自己一路过来的经历，很多时候都是随其自然，在特定时期就去做这个阶段的事情，过分的期望有时候会适得其反。


