    从一款管理女性生理期的工具型应用，到如今经过四年多的发展，大姨妈已经变成了工具+社区+电商的平台型应用。在这一路成长过程中，大姨妈共完成 7 轮融资，最后一轮要追溯到去年
    10 月，大姨妈获得海通开元投资有限公司、汤臣倍健及创始人柴可追投的 E 轮投资，总额大于 1.3 亿人民币。如此高频率的融资，说明在大姨妈过度依赖资本力量的同时，也是被资本市场看好。


    ## 资本寒冬下的转型升级


    15 年 D 轮融资，大姨妈估值为 2.1 亿美金。而根据最新资料显示，哪怕已经过了 E 轮，但大姨妈目前的估值依旧还在 2 亿美金左右。创业的残酷就在于这一点：即使资本力量再强，却依旧难以控制市场的变化。当年此时，谁能想到大姨妈的估值会停滞不前？


    > “大姨妈为了进一步探索自身的盈利模式，同时去讨得更多资本的欢心，柴可看到现在的医疗健康市场。他认为‘目前医患需求严重不平衡，网络医疗数据库不全面、医疗产品需求不均等问题，这也许恰好是产业大跨度发展的机会。但过去五年中，互联网类健康和医疗企业依然多为引流层面的运营，一直未能摆脱纸上谈兵，至今没有企业可以真正征服市场获得可观的利润。’”


    医药和医疗器械的研发需要很长时间，大姨妈通过两年半的时间密集研发，最后拿到认证，推出的生理生殖医疗器械设备，将互联网与传统医疗相结合，实现从流量到实现之间的沉淀环节。这也意味着曾经专注于女性经期健康管理的大姨妈开始正式转型成一家医疗企业。


    不得不说，在经过多年的商业化探索后，大姨妈从专注女性生理健康转型升级到医疗健康领域，从线上走向线下，希望通过用户大数据+智能设备+医疗资源，最终实现大健康的产业链布局。在资本寒冬和盈利困境的背景下，这貌似也是一个不错的无奈之举。


    ## 成败难定的医疗转型


    大姨妈想做的事，是基于用户数据，通过专业的消费级智能医疗设备实现大数据的管理与分析，可视化呈现用户最真实的健康状况。同时，这些权威的数据又可以通过设备远程给医院的医生，医生实现远程的诊疗和反馈。说白了，就是做问诊和医疗设备的研发销售。


    虽然面临盈利困局，在资本寒冬下需要资本肯定的大姨妈，此次进军医疗健康领域，符合商业逻辑。但是对于这次转型本身的成败却依旧难料。医疗健康领域本身人所周知的惨烈竞争不用谈，因为任何一个行业，对一些公司来说都有机会，也都有杀机。但除此之外，在作者看来，依然还有一些值得探讨的地方。


    ## “成也姨妈败也姨妈”的品牌定位


    大姨妈在工具阶段，因为“大姨妈”这个较为特殊的名字让其在搜索上占有明显优势。但从工具转到社区再到电商之后，这个优势则开始转变为了劣势。而大姨妈如今进军医疗健康领域，这个劣势将更加明显，总给人的感觉是还不如直接进入姨妈巾领域更加贴切。


    对于大姨妈为何将定位转向健康服务，向医疗垂直领域拓展和延伸，柴可曾在一次采访中讲到：“互联网企业只是大姨妈的显性特征之一，医疗和健康，才是大姨妈在过去四年里一直专注发展的领域。”但这还需要解释，恰恰说明，大姨妈的互联网医疗属性还不明显。如果做医疗，唯一的优势就是可能妇科会有一定的机会。


    曾经有朋友跟我洋洋得意的说，追女友的时候，女友因为月经疼痛求安慰时，其他几个追求者都纷纷让她多喝水，都难逃被拉黑的命运，而这位朋友则向女友推荐了大姨妈应用，最终赢得欢心。不过，在大姨妈转型医疗健康之后，打开的内容都是满屏的医疗器械和老军医广告，再有人向女神推荐大姨妈，很难想象会是什么结果。


    所以，大姨妈可以说是“成也姨妈败也姨妈”，此次转型医疗领域，首先面对的第一个问题就是破后难立的品牌定位。因此，最为稳妥的办法，是放弃大姨妈品牌，但这等于是从零开始重新做品牌。这个后果，大姨妈估计很难接受。


    ## 大姨妈进军医疗领域将面临什么挑战？


    大姨妈进军医疗行业，虽然势在必行，但是问诊方面，将面临专家资源更为雄厚的春雨、好大夫这些知名老牌问诊平台的挤压。而在做专业内容生产方面，又难逃早已在这领域耕耘许久的丁香园这座大山。与这些医疗健康领域的原生公司相比，并无相关积累的大姨妈似乎没有什么优势。


    同时，做互联网医疗设备，必须需要大量的用户数据。虽然大姨妈用户体量已经数字千万，但是，数据积累上看，大姨妈只有单一的经期数据，这些群体要转化成医疗健康的用户，转化率即使是高达
    30%，数据样本也将极其有限。


    想要解决这一问题，只能对外与相关公司寻求数据合作。但是，这类数据往往都是一家公司的核心中的核心，数据大的看不上大姨妈，数据小的对大姨妈又没有太多用处。所以，大姨妈一时半伙想要找到合适的合作方并不容易。更关键的是，如果大姨妈连基础的人体数据都要依赖合作，医疗设备的生命线就等于掌握在了别人手里。所以合作估计很难完成。


    而在研发方面，大姨妈团队也将面临前所未有的挑战。真正互联网医疗，并不是在传统的医疗器械上，加一个传感器与 APP 数据同步这么简单，是需要真枪实弹的进行科技研发的，否则在技术上很难形成壁垒。但大姨妈团队在这方面也几乎没有积累，团队也不懂医疗器械，很难说会不会走偏。


    值得一提的是，在之前，大姨妈曾经跟有品合作过门槛更低的智能体重秤，但是最终无疾而终。这次大姨妈全面进军医疗领域，不知道有没有从中吸取失败的经验？


    在互联网长河中，很多公司也曾尝试跨界甚至转型，而当唐突的进入了一个陌生领域，除了极少数转型成功之外，更多的则是最终无人问津的倒掉。所以更为稳妥的方式应该是，在跨界之前，收购这一领域的某个有前景的创业公司，然后以此为基点，一步步的慢慢渗入整个行业。


    而现在也有大量的互联网医疗公司因为种种原因正在谋求出路，要进军医疗健康的大姨妈如果此时收购一家业内的公司，应该也算是抄底。但是问题又回到了大姨妈此次转型升级的原因上，想收购的话，钱从哪里来？


    ## 前景难判，抓住现在


    据柴可介绍，从 2017 年上半年开始，大姨妈已经实现全面盈利，全年营收规模将达到 2.15 亿元，毛利润将超过 30%。目前，大姨妈的营收包含广告和电商两块业务。此外，公司又进行了一轮的
    F 轮融资，预计于 2019 年至 2020 年在创业板上市。


    大姨妈所卖的广告是按照标签售卖的。举例来说，对于 35 岁想要冻卵的女性和 22 岁想要自然怀孕的女性，大姨妈给二者提供的服务是不一样的。这样，也导致收入增长和毛利很高——大姨妈的广告复购率是
    89%。“我们不做纯粹的点击和曝光，更多是帮助客户找到目标用户到底是谁、到底是谁在买你的产品、是因为你的哪一句宣传用语才作出购买决策等等。这里面，有一个裂变式的体系”。柴可说。


    当然，大姨妈为了这个体系做了很多支撑性的工作。比如金融消费系统的白条、分期、保险和理财，不光帮助用户决定买什么，还让她们有能力支付和省钱。


    大姨妈今年到现在为止的电商整体收入是去年的 3 倍，但大姨妈总 SKU 数比去年少了 2／3——以前有的洗发水、面膜现在都不卖了。这主要是因为大姨妈看到女性生理的私护健康品类的增长，并将精力集中在这个事情上。


    此外，大姨妈的精细化运营还体现在面向用户群体的定制化产品和服务上。像针对青春期女生，大姨妈在 2017 年 7 月推出了单独的生理健康管理和教育 APP“蜜橙”。


    同时，以大姨妈的行业资源为依托，成立了贵州医日数康科技有限公司，该公司作为一家集数据采集、数据分析、数据分发等能力于一体的整合型大健康数据服务平台，从医疗器械切入，打通医疗器械间的信息孤岛，让不同企业的设备之间能够数据互通，相互协作。目前，医日数康已经和华为、美的、中国可穿戴联盟成员达成合作。


    同时通过自身研发的二类医疗设备，汇集各类智能设备数据，并通过综合数据提供丰富的健康服务。今后，包括术后康复及复诊等健康护理工作，都可以通过相关设备在家完成。


    大姨妈以女性健康为原点，深入专业领域，引入医疗器械和专业服务，建立医疗知识团队，打破轻问诊的方式，以深度的女性医疗级健康数据为女性提供专业健康服务，也为行业提供医疗级数据采集分析的案例范本。结合医日数康大数据平台，从线上到线下，从
    C 端和 B 端，其产品能覆盖健康医疗全领域数据，在打造了完整产业链的同时，也形成自身独有的产业生态格局。


    大姨妈公司的创业经历可以给我们有很大的启发，从最开始经期管理软件、扩充到女性健康管理、女性社区，后面涉及女性电商，到现在进入医疗健康领域，从一个工具变成一个大的平台，所以有时候我们不要嫌一个工具做得简单，只要把它做到最好，再慢慢横向扩展就会不断发现更多的可能性。


    就像之前知识星球的一位朋友分享的一个痛点，https://t.zsxq.com/VnuZbIM，做一个工具检测自己的手机号都在哪个网站中注册使用过这个需求，真的很不错，如果能不断围绕着这个需求做深入做透，然后再横向的扩展相信会有很多的可能性。


