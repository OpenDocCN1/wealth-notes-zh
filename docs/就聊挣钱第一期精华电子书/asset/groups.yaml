    # Iyhjiang 分享：**我是如何历时 8 个月通过劳动仲裁拿回拖欠工资的**


    在上一篇帖子中 https://t.zsxq.com/FU7YrFi 说道了我曾经经历过拖欠工资，然后通过劳动仲裁，拿回拖欠工资的经验，下面有球友评论说，想知道具体的过程，以及如何取证的，那我就整理一下当时的过程吧。


    升职加薪的经验我不多，但是劳动仲裁的经验倒是有一条。这一条希望球友们都好好看一下，万一用到的时候，能帮你剩下很多麻烦。但是希望，最好别用到。


    以下称该公司为 A 公司，

    该公司老板为小 B，


    我是 2013 年 2 月份入职 A 公司，入职时候谈的工资是 9k，但是签订的合同上是 3.5k（这个可以理解，一般小公司为了避税都是这么做），2014
    年 1 月，过年之前，A 公司因为经营不善，资金困难，工资只发了 3.5k，年后回来，2 月 15 号，工资没发，然后 3 月初，工资还没发。


    这时候就有点慌了，房租都快交不起了，开始投简历，找下家。然后一周的时间，找到了工作，开始办理离职手续。'
  - '[PAGE 134]


    办理离职手续的时候，跟 A 公司的老板谈，剩余的工资怎么办？他说「你放心，这个不会少你的，等公司度过了这个困难阶段，工资就会发的」，听到了这番话，当时年少无知的我便相信了，也没想起来要个工资单和欠条之类的。


    6 月份，入职新公司的三个月后的某一天，忽然收到了一条短信，「您尾号 xxxx 的卡，入账工资 4 xxx 元」，当时跟 A 公司的财务 QQ 上问了一下，这个工资好像发的不够啊，得到的答复是「这就是剩余的所有工资」。


    当时我就纳闷，按照月薪 9k，总共拖欠了大概有 40 多天的工资，应该是一万两千左右，怎么四千多块就是说是发完了。


    于是跟 小 B 联系，发 QQ 不回。第一次打电话，有人接，说自己在开会，有点忙，让我待一会再打过去。


    晚上 7 点多，琢磨着应该有时间了，打过去，没人接。

    第二天继续打，又没人接。

    然后换了个手机号打过去，接了，说清楚情况后，小 B 说，我这会儿在外面呢，你待会再跟我联系吧。 过了两个小时，又打过去，还是没人接。


    心想着，想和解，看来是没希望了。


    于是开始百度搜索如何要回拖欠的工资。


    通过网友们提供的方法，打通了 A 公司所在区的「劳动监察大队」的电话，说明了情况后，让我过去把相关的资料提供一下，主要包括「劳动合同、工资流水、离职证明等」。


    提供完之后，劳动监察大队的人，去了 A 公司，试图调解一下，看能否达成和解。但 A 公司的 人，一口咬定，「工资已经发放完毕，不存在拖欠工资的问题」。


    后来，我问劳动监察大队的人，这种情况下应该怎么办。他们说，你这种情况不太好办，按照签订的劳动合同，确实不存在拖欠工资的情况，要不，你申请劳动仲裁吧。


    于是，我又拨通了该区（拱墅区）的仲裁委员会的电话，不过那边说，A 公司注册的地址不在我们区，你应该打注册地所在区的电话。然后网上搜到了，A 公司注册地址在西湖区，打通了电话后，说明情况，那边工作人员让我带上相关的资料，约了个时间过去。


    到了那边，让我填了个「劳动人事争议仲裁申请书」，把基本情况填上，请求事项、事实和理由以书面的形式写上。然后把相关的证据「劳动合同、工资流水、离职证明，QQ
    聊天记录（以图片的形式打印出来）」提供出来，（如果有录音的话，也是可以提供的，需要录音文件拷到 U 盘中，然后录音的对话内容，文字打印出来）。'
  - '[PAGE 135]


    当时是 8 月 19 号，提供完了之后，给了我一份「仲裁告知书、受理案件通知书、举证通知书、开庭通知书」，让我回去等待开庭，开庭时间为 10 月 9 号（因为需要劳动仲裁的人比较多，所以排期只能排到
    10 月份）。


    到了开庭日，仲裁庭里，A 公司的财务就在我对面坐着，仲裁员跟书记员在台上坐着，然后开始陈述证据。


    中间的过程已经记得不太清楚，依稀的记得，A 公司财务提供的证据是，我 13 年 12 月份到 14 年 3 月份离职期间，总共请假了 3 天，违反了公司的规章制度。


    工资组成是 3500 的基本工资，加上 5500 的绩效工资。因为违反公司规章制度，扣除绩效工资，所以，工资已经结清了，不存在拖欠情况。


    我 TM....


    最后的结果，当然是我胜诉了。然后宣判 A 公司 15 个工作日之内，结清我的工资。如果超过规定时间，由法院强制执行。


    过了 20 个工作日，我依然没有收到拖欠的工资。


    于是，我带着「仲裁判决书」以及相关资料，来到了西湖区人民法院，填写相关资料，申请「强制执行」。


    资料提交上去，过了大概一周多，一位西湖区人民法院的法官给我打电话，说查了 A 公司的相关银行账户，发现都没有钱，也没有发现固定资产。


    这时候我从前同事那里得知，A 公司已经换了个名字，但是办公地址还在老地方。我把这些信息告诉了法官，法官说，那我再帮你联系吧。


    11 月份的一天，我正上着班，突然接到法官的电话说，A 公司的法人，小 B 现在已经在我办公室了，你过来一下吧，给你们把事情解决一下。


    我坐了 1 个小时的公交，到达了法院，在办公室里见到了素未谋面的小 B 以及财务，小 B 在法官面前表现的很可怜，说，公司确实遇到了经济困难，不是真心的想拖欠工资。


    然后法官说，行，那你看着解决一下吧，小 B 笑呵呵走过来，对我虚寒问暖，问我现在工作怎么样，经济上有什么困难吗？然后从一个牛皮纸包里，拿出了一沓钱，让我点一点。


    我查了查，一分不少。'
  - '[PAGE 136]


    心想，早知如此，何必当初呢，本应该早点处理好这个事情的，非要弄到法院来。


    自此，历时 8 个月，我终于拿回了我应得的工资。


    分享几个要点给球友们：


    +   1. 要使用合法的手段，来保护我们的合法权益。不要去原公司闹事，不但解决不了问题，很有可能你从受害方变成了施害方。


    2. 自己应得的权益，一定不要怂。搜集好相关的证据，不要相信口头上的承诺，要相信白纸黑字的证据。


    3. 保持一个冷静的头脑，遇到事情，利用好搜索引擎来解决。


    # 明白分享：如何找流量


    以前做程序员的时候，做过一个项目，但是当时只有技术思维，完全不知道做好后，该如何找到用户，于是项目最后就跨了。


    这就涉及到一个问题，如何找流量。


    如果你有好内容，就一定有流量。如果没有好内容，可以换个思路，借助好内容的势能来给自己引流。


    今天要分享的一个就属于这种，题目：

