    ## 我对他这份工作不是很上心，但是对他这个行业特别感兴趣，回复了一下邮件表达了我的想法：


    后来我们相互添加了微信，在西直门约着吃了一次饭，深入的探讨了智能眼镜垂直行业的发展近况。


    他最先和我们一样是一名程序员，做安卓开发工程师，后来转岗为产品经理，因为和老板的理念不合，因此选择出来创业，之前一直在智能眼镜这个行业中，积累了一些客户资源，在离职创业后很快就锁定了一些垂直行业，并且和一些国企老板达成了合作意向。


    我们现在看到的智能眼镜，也就是套在头上的大眼镜都是一个独立的操作系统，一般是阉割版的安卓系统，所以很容易在此系统上定制一些功能，比如说视频对话、视频录制，简单的
    App 操作等。


    他们计划利用智能眼镜的视频特性来解决行业内的一些痛点，比如在电力行业，电力设备常常部署到非常偏远的地区，或者非常高的大山上面，在电力行业顶级电力专家是稀奇资源，当电力系统出现问题的时候，不可能每个专家都可以去现场查看问题，因此往往会限制当地解决问题的能力，这个行业痛点就是智能眼镜的典型应用场景。


    如果电力行业使用了智能眼镜，就可以不用让专家到处飞来飞去解决问题，节省时间，只需当地一个电力人员佩戴智能眼镜到达事故现场，在后端会给专家提供一个后台管理系统，可以实时的看到前端电力人员智能眼镜返回的视频画面，那么电力专家就可以通过远程遥控的方式来帮忙解决相关问题。


    当然去做个行业的时候，是做它的一整套解决方案，来真正的切合他们的使用习惯，最好可以集成到他们已有的系统中去，到达无缝连接使用。他的创业方案是先从一个行业去入手做深做透，当把这个领域完全做好之后，在根据这个领域的经验去扩充到另外一个领域，比如从电力行业到机器维修行业。


    未来希望把产品做成一个 SaaS 系统，每集成一个公司给他们在 Sass 系统中开通一个账户来服务，智能钱镜可以是免费或者很少的费用给客戶使用，产品可以按照年来收服务费用，比如一个智能眼镜一年的服务费用是
    1999 元，如果后面连接的客户越来越多，确实是一个非常看好的产业。


    当然后来我没有加入到他这个创业公司中，不过我们仍然保持了联系，从朋友圈的动态来看，他们现在发展还不错，大家如果对这个创业项目比较感兴趣，我也可以帮忙给予引荐。


    ## 大姨妈的创业经历


    创业者通过一款工具打入市场，并且迅速成为这个市场内的老大，在收获大量用户之后，开始由一个方向向周边扩展，这样的例子有很多，成功的也不少，这也是我们程序员离得最近的创业的一种方式。有名的有：美图秀秀、墨迹天气，还有我们今天要聊的大姨妈。


    大姨妈是什么？


    大姨妈，是女性进入青春期后，子宫内膜受卵巢激素的影响，出现周期性的子宫出血，称为月经，人们隐晦的一种叫法。当然我们今天不是谈论这个，我们是谈论一个叫做大姨妈的公司。


    官网是：www.dayima.com。大概长这个样子。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_62_0.png)


    ## 官网简介：


    大姨妈于 2012 年正式上线，是国内最受欢迎的经期管理软件，除了记录经期预测经期的基本功能，还有为用户量身定制的每日健康、美容、美体、养生贴士，女性不同时期容易遭遇的问题和解决方案也都一一指点，另有
    8 种水健康提醒、魔瘦食谱推送等可自定义开启的巧妙功能。北京康智乐思网络科技有限公司，专注于健康领域的移动互联网产品开发，主打产品是“大姨妈—月经期助手”。公司
    90%以上的员工为 85 后，是一家年轻、富于活力的创业公司。


    从上面的简介可以看出来，现在公司已经定位为**专注于健康领域的移动互联网产品**，公司除了大姨妈—月经期助手还有大姨妈情侣版。把经期管理软件扩充到男性市场。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_63_0.png)


    还孵化出来了另外一个产品：好孕妈，主打孕育健康管理。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_64_0.png)


    这其实就是他们公司的几款主打产品，因为它们是移动端产品使用，我们来看一下他们的 APP。


