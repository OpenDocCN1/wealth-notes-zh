    # 星主日常分享


    # 生活就是尝试更多的可能性


    我其实在创建这个知识星球的时候有过很多挣扎？原因有三：


    +   1. 作为一名技术人，大家都是低调含蓄的搞技术，我这么高调的创建一个知识星球是否合适？

    2. 作为一名上班的人，同事领导都关注了我的公众号，业余时间做这个是否合适，同事领导又怎么看我。

    3. 担心做不好怎么办，虽然自己赚了一些小钱，但毕竟才刚刚开始，大家喜欢这种形式和氛围吗？


    以上三个观点困扰过我一段时间，时间一下子就来到了 8 月 8 号晚上凌晨 2 点，我说不管咋的先干起了，如果不去尝试怎么知道结果。


    我觉得圈子里面很多同学在干一件事的时候，可能都会多多少少有这样那样的顾虑，这个世界上应该没有人不爱挣钱吧！但是真正有多少人挣到了钱？这说明了一个道理，挣钱都会，只是多少的问题？但是挣大钱的本领，估计圈子里面没几个人了吧！'
  - '[PAGE 97]


    因为挣钱很难，大家如果加入知识星球之后，从来都不参与讨论，从来也不分享，只是默默的潜水，看了各种朋友的分享就能挣到钱，开阔思维了吗？答案是肯定的。所以我想说的是，加入知识星球其实只是第一步，挣钱思维认知改变是第二步，强大的落地执行能力才是关键。


    上次有人在我的公众号发了一个评论，我记得蛮清楚的：他说这个世界上谁有挣钱的想法，他自己都去执行了干嘛要告诉你。这句话听着好像挺有道理的，我也看到了很多创业者也有类似的想法，我靠！我想了一个这么好的主意，一定不要告诉别人，赶紧把它做出来，等到他做出来的时候，发现这个东西根本就没有市场，有比他思维更好的产品以及在市场上了。


    所以我想说的是，第一，请一定首先要打开你的思维，你把你的创意思路、点子分享出来，大家一起讨论帮你想办法，也许会触发你，帮助完善你的想法；第二，有可能你看到了别人的创意分享，触发到了你，完善了你现在的某个想法，只有不断的碰撞才会有火花。第三，不要害怕自己分享的观点经不起推敲或者薄弱，不要紧你至少走出了自己的第一步，其实绝大部分人都死在了第一步上。


    > > open your mind please！


