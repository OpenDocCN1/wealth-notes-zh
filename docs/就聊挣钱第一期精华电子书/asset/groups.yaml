    # # 技术社区的盈利之道


    我们经常会看到一些人创建了各种技术社区，我身边认识的一些人就有很多在搞这些，比如：中生代社区，Spring Cloud 社区，Python 中文社区，linux
    中国、运维帮等等太多了。当然了技术社区当然是越多越好，对我们程序员来讲可以通过不同的维度，了解到对应技术。


    作为一个旁观者，我一直好奇这些技术社区都是如何来盈利的？这些年我在北京大大小小参加了不少十次以上的各种技术大会，发现一个有趣的事情，几乎所有的技术大会都有赞助商，那么赞助费肯定是社区举办技术大会的盈利方式之一。


    另外上台演讲的嘉宾大部分都要吹嘘一下自己公司的产品和技术方案，就连 GMIC 这种级别的技术峰会也是广告味道满满，搞的我后来几乎没有太多的兴趣去参加类似的峰会，我在想这些被请来的演讲嘉宾，他们是付费演讲呢？还是组织者付费邀请呢？


    总结一下大部分技术社区的盈利方式大概如下：


    +   1. 社区网站有一定流量，通过在线广告获取一定的收入。

    2. 组织各类技术峰会，有的峰会需要付费参与，免费的技术峰会由赞助商来买单。

    3. 广告商去峰会演讲宣传自己家里的产品（付费）


    上面这些盈利方式都是社区的一般手段，另外有一些社区玩出了新玩意。


    Docker 技术在 2013 推出，2014 年以后在国内发展越来越好，我们可以通过百度指数可以发现 Docker 的搜索热度一直慢慢走高，说明它的普及程度越来越好。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_51_0.png)


    从 2014 年 Docker 在中国慢慢推广之后，有一个人持续看好未来 Docker 的发展，于是创建了一个容器化方向的技术社区，命名为 Docker one。从
    Docker 开'
