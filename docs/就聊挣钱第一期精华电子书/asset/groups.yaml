    ## 技术博客变现揭秘


    今天突然翻出来了自己在 2017 年写的一篇文章，分享给大家。记录了当时对博客变现的一些思考，现在看来有些内容到现在让然还是适用的。


    首先 我是一个俗人，很俗很俗的一个人，写文章能赚点外快这样也是让我持续坚持下去的一个动力，大家用钱给我的文章进行投票的时候我很满足，因为用自己金钱进行的投票，绝对是真的认可。


    在前一段时间，我甚至还画了一个变现的示意图，见附件。写文章到底有哪些变现的方式呢？其实我也不太清楚，虽然写文章一年多，开号公众号五个月，但也一直很羞涩，好像技术人员写文章要赞赏就像文人放下身段去乞讨一样，放不下面子，或者赞赏这点钱都不然涨薪来的实在。我以前就是这样想的，直到我开了公众号，发了原创文章，有了打赏，突然感觉美滋滋的，感受到深切被认可的感觉。


    随着公众号粉丝的增多，经常联系我请求转载我文章的养马场小编，突然有一天，微信给我说，强哥我准备找一群技术人员做互推，你有兴趣吗？我说有兴趣呀，我们一起试试，真是一个不错的体验，一起商议如何推广，如何达到最大效果，同事还组建了技术联盟社区。最后这次活动增粉
    1 千多，还认识了很多同样写技术博客的同行，我觉得挺有意思。


    过了两天突然 100offer 的运营人员联系我，看是否可以做个广告，我问他如何知道的我，他说是因为上次互推在安晓辉那里发现我的公众号，你看有时候这就是一件事关联一件事，一番商议之后，我现在也进行了尝试，大家可以看到这两天我的公众号下面
    100offer 的广告。


    所以我现在的写文章的收入就分为以下三个部分：


    +   1、文章的赞赏，公众号和博客

    2、大家加入小密圈的收入

    3、广告，现在只有公众号有，以后也有可能放到博客。


    说了这么多，写文章到底赚了多少钱？


    +   1、赞赏，公众号和博客共计 160 元左右。

    +   2、小密圈，一个人 66 元，大家可以自己算。

    3、广告，目前接的 100offer 每篇文章 120 左右，这是运营给的价格，直接公还价。因为我只是想试试这种合作方式。


    其实，每一种方式都是一种尝试，一种新的体验，很好奇、很兴奋它最后的结果，我也会持续给大家分享。


    其实还是有三种赚钱的方式，公众号开通流量主，也就是公众号文章下面腾讯的广告，会根据点击率给钱，一直怕影响大家阅读体验没有开，准备十一过后也开通试试；录制视频课程在网上卖，有很多平台联系过我，真的没时间，有机会可以试试；出版书籍，到是有不少出版社找我，但实在是怕误人子弟，出书的水平还不到。


    可能大家看了很失望，这写了一年多了一共才收入 2000 多元，刚开始写一篇文章需要花费我两三天的时间，刚这两三天的工资都远远超过这 2000 元钱了。那我图个啥，哈哈，有时候我也在想，但很快我又会明白过来，在钱之外我收获了远远超过我期望的很多东西，如果大家有兴趣，后期给大家分享，在钱之外我写文章都收获了什么？


    收获了什么呢？就是连接了更多的可能性，也就是今天大家看到的这些。


