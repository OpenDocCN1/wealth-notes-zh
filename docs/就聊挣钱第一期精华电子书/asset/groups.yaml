    # 微信好友 5000 人就可以挣钱？'
  - '[PAGE 35]


    在很早很早之前，那时候我应该还没有做公众号，就在地铁经除遇到一些漂亮的小姑娘或者帅气的小伙子，拿着手机在地铁里面一个一个的问每一个陌生人：不好意思，我正在个人创业，可以帮忙加一下这个微信吗？


    看着他们一个一个的问过来，真的会同意让他们加微信的人很少，因为看着他们就像搞传销的人，很强烈的不信任感。再后来在今年我在坐地铁的时候也还会经常遇到这些人，只是手里面多了一个小礼物，只要你添加了她/他的微信就可以送给你一个小礼物。


    我一直在想这是一个什么样的生意模式，难道是准备在朋友圈做微商？最终还是没有确切的答案。


    后来我开始试着运营了一个公众号，我就发现很多的公众号博主都同时开通了自己的读者群，我不以为然，因为开通了读者群之后，自己很难有精力在其中去维护。但是我发现同行却可以开十几个读者群/同行交流群，不知道这样做背后的动力是什么？


    直到有一天由于某些原因我被人邀请进入了一个运营的圈子，里面有很多专门做流量生意的朋友，不时的在里面寻找微信好友大于2000的人，让帮忙在朋友圈发一条课程推广，给2000元，突然有点开窍，原来还可以这样挣钱。


    后来我自己也开始有意识的去运营自己的读者群，也积累了几千的微信好友，后来果然有对应的需求找上门来，一条朋友圈分享可以按照不同需求给与定价，虽然次数不是很多，但确实是一条挣钱的道路。


    再后来我发现还有另外一种操作卖群，有很多公众号主直接可以把自己的群卖掉给广告主，如果你就是群主可以按照多少钱把这个群转让给另外一个人，一个群的价格大概也是在2000元左右，这个具体的价格可以和广告主来协商。


    今年的时候，我发现有的公众号博主发展到直接卖微信号了，比如你的微信积累了5000多个好友，那么如果这些人都来自某一个行业或者渠道，这样这个微信群就非常具有价值，一个5000人的微信号可以卖到好几万元。


    就像昨天我在知识星球分享的那个案例（https://t.zsxq.com/yFYVjA）一样，如果你的QQ好友有非常多的好友也是同样的道理，可以通过卖QQ号来挣钱。


    但是我个人从来都不会卖微信群或者微信号这样的操作，因为这样都是一次性的买卖，同时也辜负了读者对你的信任。同时我也建议群内的朋友不要这样做，虽然可以快速变现但这并不是一个长久之路，同时对你个人来讲也绝对不是利益的最大化。'
