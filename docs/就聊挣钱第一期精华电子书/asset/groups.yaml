    身为程序员的我们，虽然工资一般会高于其他行业，但是想要有个好的生活还是很有难度的，多发现赚钱的点子，一点点积累，你一定会比大多数人过得好！


    # 沉默王二分享：如何拓展自己的可控区域？


    首先，我们来给可控区域下一个定义：一些你可以直接控制和影响的事物；比如说你的挣钱能力，公众号的粉丝关注数。


    那，如何拓宽自己的可控区域呢？最直接的方法就是走出自己的舒适区。


    拿我自己来说。


    三周前，我每个月领八千多的工资，在洛阳已经算是无忧无虑了。房子是学区房，房贷又不愁；车子是北京现代的领动，虽然不是自己想要的 MINI，但遮风挡雨；老婆呢，比我还能挣钱；女儿呢，聪明伶俐；自己呢，还算是积极向上。照理论，这样的人生应该知足的——也就是我自己所谓的舒适区。


    但，其实内心是恐慌的，因为挣钱比老婆少，家里的话语权是受到质疑的，这一点，长期的折磨着我。


    终于，在三周前的某一个晚上，被老婆的冷言冷语激怒了——人家觉得我太没有上进心，换句话说，就是不思进取，总之一个道理。我怎么能算没有上进心呢？


    我一不抽烟，二不喝酒，三不赌博，四不近女色（微微一笑，很纯洁）。然后每天坚持读 10 页书，每周写一篇文章，生活挺自律的。但有一点，这些都没有提升我的挣钱能力!!!'
  - '[PAGE 116]


    一夜没睡，翻来覆去，思来想去，决定要改变自己。


    首先能想到的，提升经济能力最直接的方法就是跳槽啊，但查了查洛阳的技术岗位，工资水平也就我现在这样了，再高点的，是要加班加点辛苦工作的，可不像我现在这么自由——也去了一家公司面试，拿钱和我现在一样多，但要加班，还是单双休——跳槽的打算不得不放下。


    既然换工作不靠谱，那只能接私活了。但，接过私活的人都知道，接私活就是熬身体的，况且结款还是个未知数，保障系数很低啊。可不接私活，暂时也没有其他的办法，总不能只身一人跑去北上广吧？


    但在接私活方面，我突破了自己——咱不能再单打独斗了呀，要找几个小伙伴一起干啊——安卓咱不会，找；IOS 咱不会，找；技术深度咱不够，找；总之，要把自己的短板通过团队弥补起来——于是，我就组建了青苗科技工作室。


