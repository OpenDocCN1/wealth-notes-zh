    # 视频课程能不能挣钱


    视频教作为最直观的一种教学题材，在线学习领域中占据着最大的一份蛋糕，相对于在线图文课程，出版书籍来讲，在线视频课程用户的接受度和传播量都是最为广泛的。本人一直在技术这个领域，因此本文还是以技术领域的视频课程为例讲解。


    说起技术领域的视频课程，最有名的有这四家：慕课网、CSDN 学院、51CTO 学院、网易云课堂。其它还有很多大大小小的在线课程网站，但规模和知名度和这四家怎么办法比。


    先说慕课网，慕课网目前应该是 IT 领域内最好的在线视频学习网站，慕课网成立于 2013 年，是一家从高校走出来的创业公司，慕课网创始人陈志锋。现有用户超过
    1500 万，合作讲师规模已超过 1500+，且均来自国内外一线互联网公司。


    我算是慕课网的第一批用户，2014 年我想在地铁上学习 PHP，网上搜索了一下没找到几个，好像当时就发现了网易云课堂和慕课网。慕课网当时的视频课程很少，而且绝大部分视频课程都是入门级的课程，但课程免费、讲师内容幽默易懂、质量很高，这为以后慕课网的发展做了积淀。'
