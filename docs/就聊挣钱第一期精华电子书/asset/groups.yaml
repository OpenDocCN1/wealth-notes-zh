    # 不负此生分享：一个自己第一次的赚钱案例！


    记得大三时候出去实习，我们数学系是在武汉的一个培训机构学习一个月，主要是学 Python 及大数据基础。说是实习，其实是没有工资的，毕竟是别人给我们上课，怎么还会给我们发工资！


    我爱学习，晚上回来便会看腾讯课堂的 Python 课程直播，重要免费！顺便说一下，腾讯课堂直播的套路就是：直播免费课程质量非常高，然后后面付费课程质量一般！有一个直播老师说去年也就是
    2016 年，有一个学生，自己做课程，月入上万，当时我就心动了！


    当然，这只是当时的一个想法！'
  - '[PAGE 129]


    # 1、着手开始做


    回到学校后，我就开始着手自己的这个事情，选的是我自己自学了 2 年的一门语言（并不是 Python）。做课程资料，写代码，因为作为一门课程，需要保证他的完整性，我把书籍翻了出来，准备了一个比较完善的课程大纲。


    一边录制，一边往网易云课堂上传，大概每天花 4 个小时的样子，花了半个月，应该是 60 个小时，68 节课程，完毕！


    # 2、推广


    我以为课程只要上传到互联网就好了，就会有人购买。然而，并不是这样的。网易云课堂等等，这些在线课程会按照销量、评分对课程进行展示、曝光。新课程曝光度很少，怎么办？


    互联网真是一天一个样，2017 年还算传统，qq 群还比较受欢迎，像现在 qq 群就用的少了，主要转移到微信群。我主要进入各种 QQ 群，给别人解答问题，在群里搞好关系，跟群友打成一片，这样打广告别人才不至于踢你出去，发链接，通过
    Python 脚本发群邮件等等。很是狼狈！


    价钱，开始是 1 元，然后随着人气增加涨到 68 元，2 个月后，购买人数，达到 300 多，我将课程定价为 110 元，不再修改了！


    当时，我也开通了我的微信公众号，通过微信公众号写文章，推广课程，效果也明显上升！


    失败的推广：　当时注册了知乎，和天涯，上去就一个二维码，链接，结果被知乎永久封闭，天涯封闭 20 年！其实，像知乎这种，可以通过回答问题或者写文章，暴露链接也是好的，直接暴力推广是不行的，我反思！后来，我又办了个小米电信号，注册了知乎和简书。


    # 3、营销策略


    我发现，网易云课堂对课程会有一个按照评分排名，并且优惠券是可以全额的。于是，我用手机号，注册了 10 个 QQ 号，QQ 号又能注册其它号，这些号都是能登陆网易云课堂的。登陆后，领取全额优惠券，等于全免费，然后评价：★★★★☆，经过这一波操作，我的课程在评分这个维度上顺利排到了第一。


    随着排名的提升，购买量也会上升，销量这个维度经常在第一、第二名徘徊，评分维度排名第一。有时候，一天也能成效个 3 单，3*110 元，评价下来，一个月大概有
    3000 元的收入吧！


    两年前的事情了，具体中间的过程，也就能记得这么多了！'
  - '[PAGE 130]


    # 4、我明白的道理


    通过这个小案例，现在想想，感悟有一些


    +   1）、营销手段（方法）很重要；2）、远大越强，越小越弱；强者只会越来越强，弱者只会越来越显得弱小；


    现在，我已经工作了（其实，我是个程序员！），当然还是以工作为重，这门课程依然好评如潮、销量不错。可以说，躺着赚钱；当然了，就是每个月生活费、房租钱，都是小钱，不多！


    这是我的一个真实例子，应该算是我人生中第一次自我提升，喜欢或者说习惯发现、思考各种工作之余、下班回家可以挣钱的一些方法，主要包括对钱的渴望，对事物的变与不变的一个态度。


    这个经历、习惯，这也为我日后，喜欢折腾、做事，做了一个铺垫！


    我会，加入大佬的圈子，学习、交流赚钱方法！别人的 idea，可以借鉴，不可复制！重要的是自己的对于现在、未来，有意识或者无意识的思考和准备吧！


