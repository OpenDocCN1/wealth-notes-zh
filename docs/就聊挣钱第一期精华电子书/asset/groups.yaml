    ## 挣钱的正确路径


    自己擅长的领域，寻找合适的机会，找到可以挣一元钱（小金额）的途径，验证模式是否能走通。

    寻找一个合适的价格区间（有利润）

    分析此模式是否能够批量操作（可复制、可扩展）

    快速大量、批量执行上述操作


    在执行上述操作的过程中，发现新的机会，重复以上动作。


    尽量寻找一次投入可多次出售的生意，比如写书、卖课程、卖产品等。


    ## 和大家聊聊这段时间特别火的私域流量


    在了解私域流量之前，先了解下什么是公域流量？


    公域流量，是指商家通过淘宝、京东、拼多多、携程、大众点评、美团、饿了么、猪八戒这些平台获取流量进行销售的模式。


    这一类平台的特点是，流量是属于各个平台的，商家入驻后通过搜索优化、参加活动、花费推广费以及使用促销活动等方式来获得客户和成交。公域流量运营的核心是要熟练掌握平台规则，根据平台的发展规律顺势运营。


    再来说私域流量。


    所谓私域流量，就是你可以自由反复利用，无需付费，又能随时触达，被沉淀在公众号，微信群，个人微信号，头条号，抖音等自媒体渠道的用户。相对淘宝，京东，百度这些公域流量平台，它属于商家“私有资产”。


    可以看出来私域流量并不是个新东西，是一直存在的流量，只是现在被抽象出来，突然变得很火，这是为什么呢？


    2019 年百度广告收入断崖式下降，导致股票暴跌。这只是行业整体不景气出现的一个缩影，腾讯、分众传媒依赖广告收入的公司都不好过。


    那为什么广告商的日子不好过呢？那就要放到更大的视野来看，18–19 年大家都知道的毛衣站，jingji 形式不好大家都没有钱投广告了。


    另外中国互联网用户达 8.2 亿，流量红利慢慢已经见顶，后面企业对用户的争夺变得更加激烈。


    私域流量的兴起，它不是一个简单的现象，而是意味着移动互联网时代企业经营理念要发生改变了：企业开始从流量思维转向用户思维，这一转变将会影响企业生死。


    所以说这个时候增长黑客、私域流量就变得越来越重要了，需要博弈存量用户的留存、变现。长远来看私域流量对企业会更有价值，真正属于企业的无形资产。


    总结一下：


    公域流量是一次性的，而且公域流量越来越贵，所以企业必须学会自造流量，经营自己的流量。


    所以私域流量早已有之，经营用户是私域流量、品牌社群是私域流量、建立自有营销阵地是私域流量，只不过它又换了一个新的马甲而已。


    私域流量虽然以微信为主，但远远不止于微信，微信、知乎、公众号都是私域流量的一种载体，只要可以方便的去触达到用户即可。


    不过到了目前这个阶段，私域流量对企业来讲变得更为重要，因为这个阶段都极度关注低流量的使用。


    了解这个可以帮我们看明白很多现象：


