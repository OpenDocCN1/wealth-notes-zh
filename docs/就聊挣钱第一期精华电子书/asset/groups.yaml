    ## Jerry 分享：财务自由之路


    本书是理财入门书籍，在德国出版后，曾一度成为德国图书年度畅销榜的 NO.1，连续 110 周占据在德国图书排行榜榜首的位置。被翻译成了 33 种语言，在全球畅销，销量超过一千万册。


    所谓财务自由，就是指你不需要仅仅为了应付生活支出而为钱工作，也就是说，你不再是一台赚钱机器，而是拥有一台为你赚钱的机器。当这台机器为你赢得的利息收入等于或者是远远大于你的日常支出的时候，你就达到了财务自由。

    导致我们没能致富、没能实现财务自由的原因到底是什么？

    作者指出，穷人和富人的差距，主要体现在对待财富的信念和原则上。具体来说，有这么几个方面：对于财富的定义不同、对待财富和财富目标的态度不同、赚钱的动力不同。最重要的是，穷人和富人的金钱观不同。


    作者提到，要定义财富，需要满足三个条件：一是必须知道明确的数字；二是一定要用笔把它写下来，因为只在脑海中想和用笔写到纸上感觉完全不一样；三是要把它转化为相应的画面。比如说，你对财富的定义是：在
    7 年内，挣它 1000


    万。那就把它写下来，并转化为一个画面。因为在我们的潜意识里所体现出来的，不是一个词语或者数字，而是一个具体的画面。


    你可以在脑海中想象这么一幅场景：七年后的自己，事业蒸蒸日上，入住豪宅，出入有豪车，名下有房产，手头有存款。关于豪宅的面积和豪宅内的布置，豪车的颜色、品牌、型号甚至是你驾驶着豪车的感觉，你都可以想象，越具体越好。这些场景就相当于一幅地图，可以引导你走向目的地。


    到底如何用短短 7 年的时间实现财务自由呢？

    作者指出，要想在 7 年内实现财务自由，需要三步计划和四个策略。


    这三步计划是逐步递增的，分别是实现财务保障、财务安全和财务自由，这个阶段性目标分别对应着不同的金额数额。财务保障，就是指能保证你 6～12 个月内基本生活的储备金。也就是说，假设你生病了、失业了或是遇到了种种难以预料的麻烦，导致你目前无法工作，这笔钱能够支撑你度过这段时间或是顺利找到下一份工作。比如说你每个月至少需要支出
    3000 块，你想在 6 个月后工作，那你至少要有 3000×6，也就是 18000 块的储备金。这笔钱是用于应对不时之需，也就是突发情况的，所以一定不能随意动用，也不能用于任何有风险的投资，你可以将一部分存入银行，另一部分存在余额宝等能快速提现的理财方式中。


    在实现财务保障的基础上，我们可以追求财务安全。财务安全，是指你需要积累足够的资金，以保证你可以靠利息满足基本的生活需要。比如说，年利率为 8%，假设你每个月至少需要支出
    3000 块，用 3000 乘以 150，也就是 45 万，就是你达到财务安全所需要的资金总额。为了保证资产安全，对于这部分资金的投资依然要以稳健为主。


    当然，要达到财务自由，你可能会觉得每月 3000 完全不够花，那你可以详细列出要达到你梦想的生活所需要的金钱数额，再平均到每个月中，然后用这个数目乘以 150，就是你要达到财务自由所需要的资金总额。比如说，年利率仍然为
    8%，假设你每个月至少需要支出 10000 块，用 10000 乘以 150，也就是 150 万。当然，其中最重要的一条原则是，无论出于任何原因，都绝对不要动用你的本金，也就是能给你下蛋的“金鹅”。


    - 那要在 7 年内实现财务自由，具体要如何才能做到呢？这就需要运用四大策略，分别是：


    1. 第一，按一定的比例储蓄金钱。收入的 50%

    2. 第二，用这些储蓄资金进行投资。

    3. 第三，想办法提高收入。

    4. 第四，从每次增加的那部分收入中，提取一定的比例进行储蓄、投资。


    我们先来看第一种策略，储蓄一定比例的金钱。现在好像很流行一种观念，就是“钱是赚出来的，不是攒出来的”。特别是很多媒体、平台到处都是广告，都在宣传如何进行消费。很多人提起攒钱、存钱，都觉得好像那是我们上一代、不会享受的人干的事儿。对此，作者指出，使人变富有的，不是收入而是储蓄。如果


    是月光族或者是卡奴，每个月的收入都用于吃喝玩乐、旅游享受，周而复始，即使挣到足够多的钱，也无法实现财务自由。因为随着收入的增加，水涨船高，生活水平就会提高，支出也会增加。久而久之，自己依旧是一台赚钱机器，而无法拥有一台赚钱机器。


    这就涉及到了我们要说的第二个策略，投资。因为只靠存钱是无法让我们在短时间内变得富有的，而且我们的最终目的是为了实现财务自由，能够更自由、灵活地运用金钱。有了一定的资产后，用投资所得去消费，而不是一味地压制自己的消费，把自己变成一个守财奴。


    要进行投资，我们就要先搞清楚什么是投资？什么是债务？区分它们的关键在于，金钱是流向你还是远离你？如果金钱流向你，那就是投资；反之，如果金钱溜走了，远远地离开了你，那就是债务。


    第三个策略是增加收入。在当今这个多元化的世界，只要肯动脑思考，你就会发现，能使收入增加的方式还是很多的，就靠大家八仙过海，各显其能了。作者的建议是，找出你的天赋和热情所在，然后给自己订一个目标——3
    年后成为你所在领域的专家，并朝着这一目标努力。要做到这一点，有一个绝佳的技巧，那就是：假设现在就是 3 年后，你已经成了所在领域的专家，你可以给自己写一个广告，对自己进行宣传，向大家介绍你的产品或者是所能提供的服务。这样一来，你就能从客户的角度出发，考虑到自己的优势所在，同时也能意识到如何最大化地满足客户的需求。在写广告的过程中，你或许就能确定自己到底喜不喜欢这一领域，如果真的不喜欢，就可以尽早转行，选择别的领域。与此同时，你也可以寻找其他的收入来源，逐步将你主要的精力都集中在收入丰厚的工作上，逐渐减少收入又低又耗时的工作上。


    一旦你发挥所长，增加了收入，那就执行第四种策略，把增加的那部分收入按照一定的比例进行储蓄、投资。如果你的欲望不高，依旧保持原有的支出水平，除了拿出一些钱作为对自己的奖励，那你就可以把增加的所有收入都存起来，就当你从来没有得到过这笔钱，然后拿这笔钱再进行投资。在具备了相应的投资知识之后，投资得越早越好，因为复利的魔力大到惊人。而影响复利的两大因素就是时间和利通率。比如说，假设年利率为
    12%，如果你从 30 岁开始每月存 200 块并投资，那等你 65 岁时，也就是 35 年后，你就会拥有 100 万；如果你从 55 岁才开始存款、投资，要想在
    65 岁时，也就是 10 年后拥有 100 万的话，那每个月至少要存 5000 块才行。


    而且，要实现财务自由，最好遵循“一半一半”的投资原则，也就是一半用于中风险投资，一半用于高风险投资。多学习、多实践，或者拜成功者为师，进行投资。你所拥有的金钱越多，它们下的金蛋就越多。也就是说，你所能用于投资的资金总额越大，你越能尽快地实现财务自由。这样的话，或许根本用不了
    7 年的时间，就能实现财务自由了。


    ## 方糖先生分享：记一次灰产创业史


    警告：篇幅过长！篇幅过长！篇幅过长！


    事情要从 17 年下半年讲起，那时面临各种经济困难，买房、买车、结婚，所以赚钱的欲望相当之强烈，然后媳妇在我的鼓励下跟着别人开始学做微商，具体电商名称就不公开透露了，销售模式就是每个人都是店主，自己买省钱，卖给别人赚个佣金，最主要的赚钱手段是发展下线，让自己成为主管，可以每个月拿工资，收入就很可观了，当然目前我媳妇也没有成为主管（捂脸）。


    以上都是开场的废话，有一天，我媳妇问我能不能帮她解决买号难的问题（PS：此处解释下买号难这个词，她所做的微商有个漏洞就是每个新用户会有 10 元全场抵用券，所以她每次下单的时候都会找个新手机号注册再买，周围人借完了，发现微信上有人再卖，一次性给你手机号+验证码，你只需要输入上去直接点登陆即可，但是有个问题，交易模式是发红包，等对方接收后再给号，所以经常这边着急下单，那边卖号的不在线之类的，从而错失了个买卖出去东西的机会），起初我是不同于做这种事情的，但是身为一名爱折腾的程序猿，面对媳妇提出的这种需求，必须满足啊，于是乎我开始研究什么渠道可以弄到有效的手机号。


    于是乎，我就开始了寻号之旅，什么淘宝、咸鱼、论坛啊，愣是没找到，真是印证了一个道理【隔行如隔山】【信息的重要性】，断断续续找了大约三四个月，时间都来到 18
    年的 2 月份了，终于让我在谷歌搜到了一条有用的信息，某某验证码接收平台，下载下来用了用才知道原来之前寻找放心都是错的，其实百度搜验证码接收平台就能出一大堆信息，但是那时候只知道搜“手机号”之类的信息，又印证了一个道理【方向的重要性，跑得越快，方向的重要性越大】。


    接下来就是我媳妇每天不断地找我要号···要码···要号···要码···要号···要码···，身为一名合格程序员面临这种情况必须要有一个意识，重复劳动太多，需要抽象，所以接下来就是意料之中了，写段代码，从接码平台取号，抓包得到调某电商的获取验证码接口，然后得到验证码，最后给媳妇，大功告成，顶多封装一下，比如搞个
    app 或者小程序之类的，当时也的确是这样，做了个微信小程序给媳妇，顿时得到媳妇的大赞，也惹来了媳妇同行的各种羡慕，时不时的还会找我媳妇买号，但是，如果你认为故事到此接收了，那就错了，这么快结束了，怎么值得我拿出来分享呢。


    因为大家经常找我媳妇买号，我又萌生了一个想法，如果我把这个工具产品化了，让每个人手里一个，充值-下单-取号取码一条龙服务，大家都能自助了，岂不是更好，想到就做，我开始我媳妇了解她们这种需求的市场有多大，得到的信息是，全国有三四百万的同行，其中有百分之三十左右有这种需求，剩下的百分之七十要么嫌弃流程复杂容易丢失客户的立即购买欲，要么压根不知道有这种好事。得到这个消息我就估摸了下技术实现和利润之间的比例，算下来是大赚的，一个手机号+验证码
    1-2 毛，市场价是 1-2 元，完全是百分之一千的利润，足矣牵动任何资本家的神经了，更何况我这种穷屌丝。


    下面就是做一个产品的流程了，之前没有独立负责过一个产品从无到有的过程，只是负责整个服务端的开发架构之类的设计，所以这个过程还是蛮波折的，最初设想的是做一个大而全的产品，不仅限于某电商的业务，几乎只要是接码平台能做的，我这里设好对应的配置，都能让真正的需求用户自助取号码，
    到后期的客户资源单一以及运营复杂，进而转为某电商的专用产品，最后到某些事先预想的设计接口，在项目黄掉后都没有使用过，亲身体会了几条心得【切莫过度需求（主要就是浪费工作量）】【没有一次设计就完美的系统，给重构留点余地】【有客户了才有需求，有需求了才有设计】


    从系统的架构、模块、编码到小程序的页面设计与实现历时大约一个月，每天晚上都是工作到 3 点左右，就这样把一个产品做了出来，为什么选小程序是因为 APP 开发周期长，WEB
    页面体验差，同时做微商的都是用微信，平台好，我给这款产品命名为“糖果码”（产品图在文末张贴）。


    哈哈，因为当时跟媳妇讨论未来的娃叫什么好听，一致觉得叫糖果好听，同时那段时间决定要娃了，目前小糖果已经 20 天，看着她一天天长大更加坚定了实现财务自由的理想。有跑题了，在这期间发现好多技术工作中都没有涉及，都是一边学一边做，理念思想也是再不断的蜕变，目前回头看，自己的大多数技术好像都不是在工作中学会的，都是私下折腾学会后，在工作中加强，所以同为搞技术的同学们，一定要私下多折腾，学到手才是自己的。回归主题，东西做出来后，我先找了几个我媳妇关系比较好的同行进行测试，达到的一直反馈就是
    NB，颠覆了他们对程序员的认知，单身的表示都想找一个程序员老公，哈哈。


    因为微信支付必须有营业执照等东西，为此也研究过好久的微信、支付宝等第三方支付平台，基本原理都是通过设备物理监听支付宝、微信 APP 的到账通知等手段，而且手续费颇高，最终支付只能是通过一个管理端的小程序来手动充值，然后开设了一个客服微信，转账后客服充值，在一段时间的试运行后，就开始宣传+运营投入正式使用了，主要宣传手段是在通过主管级别的微商向下推广，现在想想当时推广的手段也不够高明，没有给予推广人太多好处，只是给他们冲了点值应该是诱惑力不足，前期用户量一百多人，每天的售卖量在三四百个号，利润也就几百块，所以我当时每天晚上为了增加用户量，就群发消息搞活动，智力抢答，随机抽奖等，在微信群客户中选取十个人赠送
    10 元充值金额，效果反响还是比较大的，我觉得这个推广方案当时做的不错，为后期的几个爆炸式增长埋下了伏笔


    因为是小程序可以被分享，一旦分享某个群就会增长一波用户，因为服务态度好，价格比手工卖号的便宜几毛钱，而且自助取很方便，大家都很乐意积极分享，最高的时候一天增长近百人，停服的时候用户数在
    2585，因为存活时间太短，也足有大脱，有很多也是做卖号的已经做了一年多了，而我最终只做了不到 2 个月，最多时候一天 2000 多，总共盈利在四万左右，有时候还会跟我媳妇调侃说，如果我早开始做一年，估计能全款买套房了，为什么停服是因为那段期间某电商直接取消了新用户赠送
    10 元的活动，所以被迫停了，不过后期又变成了两个 5 元的，大家的热情明显下降了，再加之太占用时间和精力了，收入和付出比例降低了，就没有再开服糖果码。


    说到占用时间和精力，某电商早已意识到有人薅羊毛，所以他们的技术部门一直不断的升级防御手段，同时又要保持新用户的 10 元优惠政策，那段时间基本就是三天一大改，两天一小改，接口变动、设备绑定、IP
    限制、店铺号绑定等一系列问题，那叫一个兵来将挡水来土掩，见招拆招，心力憔悴，估摸某电商负责注册业务的部门也是这种感觉吧，其实后来一直没想明白的是，他们为什么不加入人机识别类的验证，从始至终他们都没有添加过人机校验的手段，可能是产品对于一个产品的坚持吧。


    同时这期间也插播了几个人人物故事，觉得篇幅太长的可以直接忽略了。


    人物故事 1：小康，江西的一个在校商学院的大学生，卖号期间认识的，同样是卖号的，认识我之前手工卖号的，认识我之后，跟我合作，他找号源（我码平台也需要卡商提供号码，不同码商提供的号码质量不一致，需要甄别，后期我们是直接找的大卡商，直接对接他们的
    API，撤开了我码平台这层中间商），我负责技术维护和提供服务器，客户是各自的，每个号码我抽他一毛钱，期间有偷快，有不偷快，不得不感慨现在的年轻人思想更活跃，还是需要跟年轻人多接触，最后停服的时候，好像还欠我
    380 块钱，哈哈，鉴于是学生，而且他客户的钱也都退干净了，小脑筋子活，但是人不坏，也就不追究了。


    人物故事 2：安逸、邂逅，两个人是骨灰级别的灰产链贩子，认识期间主要贩卖某电商的号码，基本靠此维生，他们曾经也捣鼓过各种软件来提高生产力，手工发号的话一天全职撑死了发
    3000 个就不错了，直到遇到了我的软件表示这基本就是他们想象中的东西，但是比他们想象中更可怕，拥有可怕的传播速度，他们担心他们的客户被我的软件挖走，他们就没有经济了，所以他们选择不跟我合作，而是对抗，后来邂逅根据我的软件花钱找人做了一款
    PC 端的软件，用于快速出号，然后招募代理（微信手工发号的人）帮他卖号抽提成，而且运营期间，有人通过糖果码的微信快捷登陆入口攻击过糖果码，我猜测可能是邂逅找人干的。


    人物故事 3：石头，一个电脑城的店主，贩卖电脑的，偶然期间（比我早了一年半）接触了某电商的这个新用户漏洞，开始做这块灰产，头脑灵活，市井气十足，刁钻圆滑，认识我之前，自己找人做过
    Android App，功能单一，只是转发我码平台的接口，后来通过他的一个客户发现了我的软件，联系到了我，表示想合作，最初拒绝了他，因为觉得这种人跟自己不是一类人，不适合合作，但是后来出于有钱不赚白不赚的想法就合作了，停服的最后还坑了我
    4000 多块钱，同时，他下面客户的钱他也全坑了没有退款，导致一部分人还我到我这里找我要钱（垫脸）。事实证明【选择臭味相投的人一起合作更明智】。


    人物故事 4：大卫，遇到第一个大卡商，可以直接提供 API 对接的，绕开我码平台，深圳灰产创业者，成立了公司专门做注册业务的号码售卖，合作期间聊过不少行业的动态等，也对他们的系统提出了几点意见，算是彼此合作愉快，但是由于他们的系统能力，导致很多卡收不到验证码，遂放弃了合作，之后还联系过几次。


    人物故事 5：人人，另一个大卡商，准确的说，他是某个超大卡商的服务人员吧，触及到他这一层基本就触及到了顶层了，很多小卡商都是从他这里分包卡出去

    '
