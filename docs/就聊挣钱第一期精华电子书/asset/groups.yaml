    # 最美证件照的挣钱生意经'
  - '[PAGE 30]


    前段时间，公司人力突然在晚上 9 点通知所有的管理层提交一个 2 寸蓝色背景的证件照，要上报到上层管理单位。然后可见几个就赶紧我历史上存档的照片，但都没有合适的，如果用手机拍的话很难找到蓝色背景的照片，于是想到用手机拍个白色背景
    P 成蓝色的。


    搞了半天反正是没有搞定，如果去照相馆的话已经太晚了，突然看到有几个哥们已经提交了照片，照片看了质量还不错，就了解下他们都是使用了一个叫做：证件照随拍的 APP，说是只要下载了这个
    APP，按照它的提示就可以拍出质量不错的证件照。


