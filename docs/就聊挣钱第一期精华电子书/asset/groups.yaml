    ## 出版书籍能不能挣钱


    刚好上周末参加了 博文视点 出版社的作者研讨会（https://mp.weixin.qq.com/s/-jza09p3kL82oCdc195wWA），出席的都是行业内技术图书的热销作者，挺有感触。因此这周就和大家聊聊出版书籍能不能挣钱？


    作为一个 IT 老鸟，经常会发现身边的朋友出书了，我就特别好奇：如果我想出书如何操作？出版社和作者都是怎么分成的？写书对技术人有什么好处？


    先来聊如果想出书怎么操作？


    如果你是一个喜欢写博客的人，那估计你已经收到很多邀约写书的信息，现在的出版社搞得传销组织一样，他们的日常工作就是在网上到处勾搭各种技术人，或


    者出席各种技术会议、论坛，可以说凡是技术人出没的场所都会有出版社的编辑存在。


    和这些编辑建立起来关系便是出版书籍的第一步，当然如果你不是特别喜欢写博客，仍然想出版书籍，其实也很简单，朋友推荐或者介绍即可，我认识太多的出版社编辑，如果大家对这方面比较感兴趣，我可以给大家推荐一些比较知名的编辑。


    给大家放一张国内作者编写图书出版过程：


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_22_0.png)


    ## 写作套路


    - 1. 每隔 700 左右，插入一个数据、图表、截图、公式或者一个资源链接。

    2. 结论需要配备基础公式或者推导依据。有了推导依据后，读者容易遵循作者的推导逻辑，并且对于理论产生信服。

    3. 保留英文名、术语还有专有名词。写一本书，英文名词你可以把它翻译成中文，但原词一定要保留，这是方便读者最大程度的进行检索。

    4. 便于扫描的小标题和列表结构。便于读者快速翻阅，直接给到快速的结论。

    5. 箴言式的智慧短句。本身传播性就很强，容易理解又具有形式感。

    6. 截图手稿。这也是读者本身基于八卦性或者说基于这本书的它的真实性所需要的，能增强临场感。

    7. 保留参考链接、引用资料。


    ## 出版社和作者是怎么分成的


    写一本书作者到底能拿到多少稿酬？主要分为以下三种


    - (1) 基本稿酬加印数稿酬。基本稿酬加印数稿酬，指出版者按作品的字数，以千字为单位向作者支付一定报酬（即基本稿酬），再根据图书的印数，以千册为单位按基本稿酬的一定比例向著作权人支付报酬（即印数稿酬）。作品重印时只付印数稿酬，不再付基本稿酬。


    《出版文字作品报酬规定》中还给出了基本稿酬标准：

    原创作品：每千字 30～100 元


    - 演绎作品：

    (1) 改编：每千字 10～50 元

    (2) 汇编：每千字 3～10 元

    (3) 翻译：每千字 20～80 元

    (4) 注释：注释部分参照原创作品的标准执行。出版者出版演绎作品，除合同另有约定或原作品已进入公有领域之外，出版者还应取得原作品著作权人的授权，并按原创作品基本稿酬标准向原作品的著作权人支付报酬。


    - (2) 版税。指出版者以图书定价×发行数×版税率的方式向作者付酬。这具体又分统一版税率和阶梯版税率两种。所谓阶梯版税就是按约定销售数量调整版税率，如 1
    万册以内约定版税率 7%，1 万册至 3 万册版税率 8%，3 万册以上版税率 10% 之类的。

    《出版文字作品报酬规定》中还给出了版税标准和计算方法：原创作品版税率 3%～10%，演绎作品版税率 1%～7%。


    略有声名或出版社对书均有较高期待的，也许会达成按出版码洋（印量×定价）比例分成的方式，通常要在达到一定销量以后才能开始计算。比例各地不一，多数是 7-8%。


    名气大的作者会从一开始就按比例提成，通常会在 10%以上。同时，大牌作者会要求预先支付一定比例的稿酬。


    （3）一次性稿酬。指出版社按作品的质量、篇幅、经济价值等情况计算出报酬，并一次向作者付清。


    ## 2. 稿酬如何计税？


    《中华人民共和国个人所得税法》中与稿酬相关的部分是：稿酬所得，适用比例税率，税率为 20%，并按应纳税额减征 30%。

    劳务报酬所得，每次收入不超过 4000 元的，减除费用 800 元；4000 元以上的，减除 20%的费用，其余额为应纳税所得额。翻译费属于这一情况。

    就目前的实际情况，图书稿酬的计税方式基本是：稿酬<=800，不扣税；800<稿酬<=4000，800 以上的部分按 14%上税；稿酬>4000，按总额的 11.2%上税。

    翻译报酬：报酬<=800，不扣税；800<报酬<=4000，800 以上的部分按 20%上税；报酬>4000，按总额的 16%上税。


    ## 3. 一个例子，说明写一本书到底能拿多少稿酬？


    估计大家现在也常听说，写书越来越“公益”了，因为拿不到多少稿酬。其实如果书的销量好，按版税方式计酬的话，稿酬收入还是可以很可观的！

    下面举一个简单的例子：假设作者写一本书，大概定价 50 元，版权按 8%，销售 3 万册。

    作者版税是：50×30 000×8%=120 000 元。

    缴税是：120 000×11.2%=13 440 元。

    实际税后所得是：120 000−13 440=106 560 元。


    从版税方式计酬“图书定价×发行数×版税率”看，如果版税率一定，那收入就和图书定价及销售量有最直接的关系。定价高了和销量高了都可以增加作者收益，但定价和销量是相互制约的，因为定价高了可能会影响销量。合理定价，保障书的品质是增加作者收益最根本的！


    对于技术人来讲，第一次写书的版税都是 8%，也就是销售 3 万册的话，收入是 10 万元左右。说实话当我知道了这个价格之后，我就没有太多写书的意愿了。因为技术书籍垂直度比较高，因此出版的书籍都往往只是辐射某一部分，销量上万册就是比较好的了，销量上两万那就是畅销书了。


    但是对于非技术的书籍来讲，如果销售个十万册、百万册那真是赚大了。技术书籍也有销量超过是十万册的书籍，不过那都是大神级别玩的，和普通技术人来讲就差远了。


    如果仅仅是从钱这方面来看，写书确实挣不了大钱，但是从影响力来看的话，价值无限。下面我们就谈谈写书对技术人有什么好处？


    不知道大家有没有看上面的这篇文章（https://mp.weixin.qq.com/s/-jza09p3kL82oCdc195wUA），上周参加读者研讨会，杜江老师做了分享，其中提到的一个是，因为自己写书而认识了一些人，这些人帮他介绍了一个活，做完这个私活他就在北京买了一套房子。


    很多写书的作者现在混得都不错，其中有很大一部分作者开了咨询公司，专业给各个公司做技术咨询，这个真的很赚钱。往小了说如果你在某个领域出了一本书，基本上在这个领域上找工作的话不用愁了，应该会有很多的工作机会来主动找到你。


    稍微总结一下写书的好处：


    - 1. 这可能是你唯一一次比较出名的机会，提升自己的知名度。

    2. 出书可以扩大自己的影响力，帮忙扩展更多可能性。

    3. 出书是一种高质量的社交，你会因为写书而结交很多和你一样出书的人。

    4. 凡事开头难，我发现大多数作者出版第一本书是最难的，后面会越来越好。

    5. 出书可以让自己变的更自信，是事业发展的助推器。

    6. 每个人都有一个出书的梦。


    最后套用一句古语吧，书中自有黄金屋，书中自有颜如玉！


    ## 视频课程能不能挣钱


    视频教学作为最直观的一种教学题材，在线学习领域中占据着最大的一份蛋糕，相对于在线图文课程，出版书籍来讲，在线视频课程用户的接受度和传播量都是最为广泛的。本人一直在技术这个领域，因此本文还是以技术领域的视频课程为例讲解。


    说起技术领域的视频课程，最有名的有这四家：慕课网、CSDN 学院、51CTO 学院、网易云课堂。其它还有很多大大小小的在线课程网站，但规模和知名度和这四家怎么办法比。


    先说慕课网，慕课网目前应该是 IT 领域内最好的在线视频学习网站，慕课网成立于 2013 年，是一家从高校走出来的创业公司，慕课网创始人陈志锋。现有用户超过
    1500 万，合作讲师规模已超过 1500+，且均来自国内外一线互联网公司。


    我算是慕课网的第一批用户，2014 年我想在地铁上学习 PHP，网上搜索了一下没找到几个，好像当时就发现了网易云课堂和慕课网。慕课网当时的视频课程很少，而且绝大部分视频课程都是入门级的课程，但课程免费、讲师内容幽默易懂、质量很高，这为以后慕课网的发展做了积淀。


    ## [就聊挣钱] 第一期精华电子书


    慕课网早期凭借着优质内容、免费观看、移动端使用体验很好等特点，迅速占领了一大批 IT 小白用户。从 2013 年到 2016 年，整整近 3 年时间，慕课网都在提供免费、优质的视频课程，通过这些占领了
    IT 领域视频教育第一把手。


    慕课网从 2017 年开始，开始商业模式的灰度测试，推出了两种不同形式的课程，第一种是就业班的形式，主要讲知识的使用，按照语言或者框架分不同的类型来学习，占比较少；第二种就是实战课程，也是它们网站主推的一种模式，以实战项目为内容，讲解各个技术的使用，特别受到欢迎。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_26_0.png)


    去年 1 月时候我参加了慕课网的慕课之夜，慕课网邀请了慕课网大部分知名讲师一起开了晚会，在一个酒吧搞得很互联网很疯狂（有钢管舞）。在那天了解到已经有几位慕课网的老师，在慕课网一年的分成已经达到了百万级别。


    我们在慕课网找两个比较有名的讲师来看一下数据，一个是廖师兄，因为他主讲 Spring Boot，所以相互认识，还有一个是七月老师，主要讲小程序。


    廖师兄的《Spring Boot 企业微信点餐系统》售价 348 元，目前迈出了 3023 份，就单单这一个课程，卖出了一百万元，慕课网和讲师的分成是 4：6，也就意味着这个课程可以分成
    60 万。


    7 月老师的《微信小程序入门与实战》课程是慕课网最受欢迎的课程之一，售价 149 元，销售量高达 15000 多份，从售价 223 万，按照 4：6 的分成，单这一个课程提成高达一百多万。


    当然上面这两个老师在慕课网都是很有名气的，一般的老师课程销量在 1000 份左右，按照课程均价 300 元计算的话，平均每位讲师大概收入是十几万左右。


    慕课网的套路是，在网上找一些知名的作者在他们平台开一个免费的课程吸引人气，再后面规划整套课程来销售。我个人还是非常看好慕课网未来的发展，如果大家想去慕课网录制课程，我可以帮忙介绍。


    我给慕课网录制过一个免费的视频，感觉很辛苦，第一次录制视频需要消耗太多的精力和时间，最后坚持把免费视频录制完毕后，就暂时放一边了。


    CSDN 和 51CTO 都是比较有名的 IT 社区，都是在网站上分出一个板块做在线课程，人气也不错。


    CSDN 平台和作者的分成是：讲师：平台 = 6：4，按照售价 100 销量 1000 份来算的话，一个课程的收入大概是 4 万左右，CSDN 平台视频课程很多，因此有的老师收入应该很高，有的又很低，看情况吧。


    51CTO 和讲师的分成是按照比例走的，普通讲师 5:5；签约讲师 6:4；金牌讲师 7:3，级别越高拿到的分成越多。51CTO 学院的课程销售数据不知道是真是假，看起来很吓人，有的课程销量
    5 万多，有的课程销量 17 万，均价在一百多元，一门课程在四五百万的收入，分成可以拿到二三百万。


    网易云课堂是一个综合的在线学习网站，IT 领域只占到其中的一个板块，如果只是自己推广课程的话，平台不收取费用，如果平台给推广的话，平台收 10% 的手续费。看了一下付费的课程不是很多，而且比较杂乱，IT
    学习人气是相比前面三个网站最弱的。


    做个对比：


    - 1、慕课网是专业做 IT 领域的视频课程，产品体验最好、用户量最大、课质量好、销量比较可观，他们公司的玩法也最具互联网化，我比较喜欢。缺点是课程都需要后期制作、排期，往往录制一个课程到发布需要大半年的时间。

    2、CSDN 是国内第一大技术社区，有一定的流量，做法比较传统，讲师收入有保障。

    3、51CTO 是偏向网络和运维领域的社区网站，这方面的课程销量应该会好一点，相对 CSDN 弱一些。

    4、网易云课堂，IT 在线课程只是其中的一个小版块，整体感觉免费的视频多一些，付费课程较少不成规模。


    ## 技术人做公众号能不能挣钱


    在没有做公众号之前，我写了一年多的博客，在博客的同时认识了一些朋友，发现很多和我同样写技术博客的博主都开通了技术公众号，那个时间我也比较奇怪为什么大家都喜欢开通技术公众号呢？这个疑问直到我开通自己的公众号半年之后我知晓。


    我写博客一年多的时间，除过为 51CTO 技术博客投稿以外，没有过任何其它收入。在这里我多说两句，其实很多技术公众号都是接受技术文章投稿的，会有稿费，比如
    51CTO 技术公众号，如果投稿被采用每篇文章会有 500 元的收入。51CTO 官方等技术公众号也都接受投稿，有的高达一篇 1000 元左右。


    开通技术公众号最大的感受是和读者的距离更近了，方便用户点赞、阅读、转发，对个人品牌也是一个很不错的宣传途径，比如我近期转载的沉默王二的文章《为了完成月入三万的目标，我都做了哪些准备？》https://mp.weixin.qq.com/s/WcN5bkvFrCNZiJv-KEx4qw，对个人是一个非常好的宣传途径。


    但写公众号最大最持久的动力是收入，前面说过写博客一年多的时间没有一点收入，虽然当初写博客也不是为了有收入，但是能有收入谁又会嫌弃呢！而开通微信公众号半年之后，就迎来了人生第一个商业广告。那时候甚至都不知道该要多少钱，最后定了一个月推
    8 篇文章，每篇文章后面贴一个广告贴片给 1000 元。


    在微信公众号上写文章会有三方面的收入：流量主广告、赞赏收入、接外部广告。当你的微信公众号读者大于 5000 后，就可以开通自己的流量主，也就是微信文章最下面的那一张卡片广告，这部分收入其实很少，像我现在这个级别每天流量主的收入在
    20-40 左右，就是一顿午餐钱。


    赞赏收入是这三块收入中最少的，几乎可以忽略不计，但赞赏却是鼓舞作者持续写作的最大动力，用钱给予的投票绝对是最真实的认可，不论金额大小；接外部广告才是公众号最主要的收入，这个主要看公众号的定位和读者质量，有的公众号几百块就可以发，有的公众号甚至要上万。


    技术号的收费标准公认的价格是一个阅读量一元钱，也就是说如果你的公众号一周发了五篇文章，每篇文章的阅读量大概是 5000 左右，那么当广告商找你的时候，你就可以报价
    5000 元，基本就可以成交。


    在这个报价的基础上，不同的公众号会根据情况又上浮或者下调，财经类的公众号，一个阅读可以高达 2-3 元，情感类的公众号报价和技术号差不多。另外又一些网红公众号报价很高，比如我公众号转发文章的
    听脑湿 或者 今夜 90 后等公众号，每条广告的头条价格是 20-40 万，一条广告就超过我们一年的收入。


    另外个人原创公众号的收费会比转载类的公众号文章收费贵；个人技术公众号会比机构技术公众号收费贵，因为个人技术公众号一般会带有个人品牌属性。


    这里有一份名单（附件），里面有几位做技术公众号的技术人年收入超过了百万，我现在每个月技术公众号广告费用大概是 2 万左右，有的时候多一点，有的时候少一点，算是我业余收入中最多的一块收入了。

    '
  mdcn: '

    诞生于 2018 年，掘金小册：目前是 7：3

    诞生于 2018 年，51CTO-专栏：现在分成比例 9：1，后期可能会调整


    强调一下这里的 7 和 9 是作者的分成比例，作者占大头。技术领域的知识付费还在发展初期，大多数平台对作者都有补助，比如说免费帮作者去推广课程等，GitChat
    还推出了《码字计划》鼓励各领域的技术人在平台发布专栏，在作者享有分成的基础上还会奖励几千元现金，可谓诚意十足。


    各个平台产品的特点：


    GitChat：GitChat 平台的付费产品最为丰富，包含 Chat、达人课、精品课、极客书等领域，并且其中的课程都比较接地气，偏向于实践这个领域。

    极客时间：极客时间的专栏走高大上领域，因此课程更多偏向于理论或者基础，所以专栏读者的覆盖面比较广，因此对原理、基础、思维等方面比较突出。

    掘金小册：掘金小册目前上线产品较少，主要以前端和编程语言本身为主，专栏内容还在不断的完善中，内容质量也不错。

    51CTO：作为最后一个上线的技术付费产品，51CTO 的产品还在不断打磨中，专栏以网络、运维领域的课程为主，课程也在不断的丰富中。


    从作者的收益方面来讲：


    我在 GitChat 开过两个付费的 Chat，每个 Chat 大概的收入是 400-600 之间，去年开过一个《快速学习 Spring Boot 技术栈》去年的销量在其平台可以达到前三，收入大概
    2 万元左右；近期还开了一个新的课程《精通 Spring Boot 42 讲》，目前收入未知，对比同类的精品课收入应该在 10 万左右。


    极客时间的课程普遍定价在 69 和 99 这两个价位，大多数课程销量在 1 万份上下，取个中间值一个专栏大概销售额会到 84 万，作者和平台 5：5 分成，那么一个作者平均可以赚取到
    42 万的收入，这里面也有很多销量高达 2 万 3 万的作者，课程分成直逼百万，还是很有诱惑力的。


    掘金小册的课程平均定价大概在 19.9，每个课程平均销量在两三千份，平台和作者 3：7 分成，每个专栏作者收入应该在 3-4 万左右。其中有一个课程竟然卖到了
    1.5 万份，除过特价课程、平台分成，作者课程收入也高达十几万。


    今年年初我在 51CTO 开了一个专栏《微服务技术架构以及大数据治理实战》目前销量在 500 多份，收入大概是 1 万多元。其中有就聊挣钱圈子里面的朋友姜汁啤酒作者，他的课程在网站销量最好，应该可以到
    3 万左右。


    需要说明的是去平台写专栏是一个非常耗费时间的事情，几乎需要花费你所有的业余时间，并且一旦决定开一个专栏，必须要做大量的学习、调研、总结，结合自己掌握的知识重新把这些知识理解，用通俗的语言来讲述出来。真的很费时间和精力！


    但开通一个专栏对作者也是一个非常好的学习、锻炼机会，如果清晰的讲解整个技术，至少需要再次深度理解一遍这些内容。我们常说学习有六个等级，最高效的学习方式是：交给别人。


    - 第一个学习的等级是：默读

    第二个学习的等级是：听

    第三个学习的等级是：朗读

    第四个学习的等级是：做笔记

    第五个学习的等级是：讨论

    第六个学习的等级是：教给别人


    总结一下如果想在在线课程中挣到钱需要关注以下三点：


    - 第一，课程内容是否和平台大部分目标用户需求相贴切。

    第二，课程质量是否过关，课程本身的质量取决于作者本身的技术沉淀

    第三，平台是否有合适的营销方案帮忙推广，平台的营销能力和平台的创始人背景、文化关系很大。


    在线课程能不能挣钱，挣多少钱是各个因素综合的表现，有的作者挣了几千元，有的作者收入上百万，需要根据每个人的情况来定。所以在开始一门课程的时候，先想好自己的投入产出比是否合适和权衡。作为新人，可以从
    Chat 或者小的专栏开始，不要一下子期望收入百万，凡事先得有个开始。


    如果你有能力，我建议你还是动手吧！又可以挣点零花钱，又可以促进自己的理解，还教会了大家，扩大了自己的影响力，真的是一件多赢的事情。大家如果感兴趣，四家平台我都有他们的对接方式，可以帮忙给予连接。


    ## 出版书籍能不能挣钱


    刚好上周末参加了 博文视点 出版社的作者研讨会（https://mp.weixin.qq.com/s/-jza09p3kL82oCdc195wWA），出席的都是行业内技术图书的热销作者，挺有感触。因此这周就和大家聊聊出版书籍能不能挣钱？


    作为一个 IT 老鸟，经常会发现身边的朋友出书了，我就特别好奇：如果我想出书如何操作？出版社和作者都是怎么分成的？写书对技术人有什么好处？


    先来聊如果想出书怎么操作？


    如果你是一个喜欢写博客的人，那估计你已经收到很多邀约写书的信息，现在的出版社搞得传销组织一样，他们的日常工作就是在网上到处勾搭各种技术人，或


    者出席各种技术会议、论坛，可以说凡是技术人出没的场所都会有出版社的编辑存在。


    和这些编辑建立起来关系便是出版书籍的第一步，当然如果你不是特别喜欢写博客，仍然想出版书籍，其实也很简单，朋友推荐或者介绍即可，我认识太多的出版社编辑，如果大家对这方面比较感兴趣，我可以给大家推荐一些比较知名的编辑。


    给大家放一张国内作者编写图书出版过程：


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_22_0.png)


    ## 写作套路


    - 1. 每隔 700 左右，插入一个数据、图表、截图、公式或者一个资源链接。

    2. 结论需要配备基础公式或者推导依据。有了推导依据后，读者容易遵循作者的推导逻辑，并且对于理论产生信服。

    3. 保留英文名、术语还有专有名词。写一本书，英文名词你可以把它翻译成中文，但原词一定要保留，这是方便读者最大程度的进行检索。

    4. 便于扫描的小标题和列表结构。便于读者快速翻阅，直接给到快速的结论。

    5. 箴言式的智慧短句。本身传播性就很强，容易理解又具有形式感。

    6. 截图手稿。这也是读者本身基于八卦性或者说基于这本书的它的真实性所需要的，能增强临场感。

    7. 保留参考链接、引用资料。


    ## 出版社和作者是怎么分成的


    写一本书作者到底能拿到多少稿酬？主要分为以下三种


    - (1) 基本稿酬加印数稿酬。基本稿酬加印数稿酬，指出版者按作品的字数，以千字为单位向作者支付一定报酬（即基本稿酬），再根据图书的印数，以千册为单位按基本稿酬的一定比例向著作权人支付报酬（即印数稿酬）。作品重印时只付印数稿酬，不再付基本稿酬。


    《出版文字作品报酬规定》中还给出了基本稿酬标准：

    原创作品：每千字 30～100 元


    - 演绎作品：

    (1) 改编：每千字 10～50 元

    (2) 汇编：每千字 3～10 元

    (3) 翻译：每千字 20～80 元

    (4) 注释：注释部分参照原创作品的标准执行。出版者出版演绎作品，除合同另有约定或原作品已进入公有领域之外，出版者还应取得原作品著作权人的授权，并按原创作品基本稿酬标准向原作品的著作权人支付报酬。


    - (2) 版税。指出版者以图书定价×发行数×版税率的方式向作者付酬。这具体又分统一版税率和阶梯版税率两种。所谓阶梯版税就是按约定销售数量调整版税率，如 1
    万册以内约定版税率 7%，1 万册至 3 万册版税率 8%，3 万册以上版税率 10% 之类的。

    《出版文字作品报酬规定》中还给出了版税标准和计算方法：原创作品版税率 3%～10%，演绎作品版税率 1%～7%。


    略有声名或出版社对书均有较高期待的，也许会达成按出版码洋（印量×定价）比例分成的方式，通常要在达到一定销量以后才能开始计算。比例各地不一，多数是 7-8%。


    名气大的作者会从一开始就按比例提成，通常会在 10%以上。同时，大牌作者会要求预先支付一定比例的稿酬。


    （3）一次性稿酬。指出版社按作品的质量、篇幅、经济价值等情况计算出报酬，并一次向作者付清。


    ## 2. 稿酬如何计税？


    《中华人民共和国个人所得税法》中与稿酬相关的部分是：稿酬所得，适用比例税率，税率为 20%，并按应纳税额减征 30%。

    劳务报酬所得，每次收入不超过 4000 元的，减除费用 800 元；4000 元以上的，减除 20%的费用，其余额为应纳税所得额。翻译费属于这一情况。

    就目前的实际情况，图书稿酬的计税方式基本是：稿酬<=800，不扣税；800<稿酬<=4000，800 以上的部分按 14%上税；稿酬>4000，按总额的 11.2%上税。

    翻译报酬：报酬<=800，不扣税；800<报酬<=4000，800 以上的部分按 20%上税；报酬>4000，按总额的 16%上税。


    ## 3. 一个例子，说明写一本书到底能拿多少稿酬？


    估计大家现在也常听说，写书越来越“公益”了，因为拿不到多少稿酬。其实如果书的销量好，按版税方式计酬的话，稿酬收入还是可以很可观的！

    下面举一个简单的例子：假设作者写一本书，大概定价 50 元，版权按 8%，销售 3 万册。

    作者版税是：50×30 000×8%=120 000 元。

    缴税是：120 000×11.2%=13 440 元。

    实际税后所得是：120 000−13 440=106 560 元。


    从版税方式计酬“图书定价×发行数×版税率”看，如果版税率一定，那收入就和图书定价及销售量有最直接的关系。定价高了和销量高了都可以增加作者收益，但定价和销量是相互制约的，因为定价高了可能会影响销量。合理定价，保障书的品质是增加作者收益最根本的！


    对于技术人来讲，第一次写书的版税都是 8%，也就是销售 3 万册的话，收入是 10 万元左右。说实话当我知道了这个价格之后，我就没有太多写书的意愿了。因为技术书籍垂直度比较高，因此出版的书籍都往往只是辐射某一部分，销量上万册就是比较好的了，销量上两万那就是畅销书了。


    但是对于非技术的书籍来讲，如果销售个十万册、百万册那真是赚大了。技术书籍也有销量超过是十万册的书籍，不过那都是大神级别玩的，和普通技术人来讲就差远了。


    如果仅仅是从钱这方面来看，写书确实挣不了大钱，但是从影响力来看的话，价值无限。下面我们就谈谈写书对技术人有什么好处？


    不知道大家有没有看上面的这篇文章（https://mp.weixin.qq.com/s/-jza09p3kL82oCdc195wUA），上周参加读者研讨会，杜江老师做了分享，其中提到的一个是，因为自己写书而认识了一些人，这些人帮他介绍了一个活，做完这个私活他就在北京买了一套房子。


    很多写书的作者现在混得都不错，其中有很大一部分作者开了咨询公司，专业给各个公司做技术咨询，这个真的很赚钱。往小了说如果你在某个领域出了一本书，基本上在这个领域上找工作的话不用愁了，应该会有很多的工作机会来主动找到你。


    稍微总结一下写书的好处：


    - 1. 这可能是你唯一一次比较出名的机会，提升自己的知名度。

    2. 出书可以扩大自己的影响力，帮忙扩展更多可能性。

    3. 出书是一种高质量的社交，你会因为写书而结交很多和你一样出书的人。

    4. 凡事开头难，我发现大多数作者出版第一本书是最难的，后面会越来越好。

    5. 出书可以让自己变的更自信，是事业发展的助推器。

    6. 每个人都有一个出书的梦。


    最后套用一句古语吧，书中自有黄金屋，书中自有颜如玉！


    ## 视频课程能不能挣钱


    视频教学作为最直观的一种教学题材，在线学习领域中占据着最大的一份蛋糕，相对于在线图文课程，出版书籍来讲，在线视频课程用户的接受度和传播量都是最为广泛的。本人一直在技术这个领域，因此本文还是以技术领域的视频课程为例讲解。


    说起技术领域的视频课程，最有名的有这四家：慕课网、CSDN 学院、51CTO 学院、网易云课堂。其它还有很多大大小小的在线课程网站，但规模和知名度和这四家怎么办法比。


    先说慕课网，慕课网目前应该是 IT 领域内最好的在线视频学习网站，慕课网成立于 2013 年，是一家从高校走出来的创业公司，慕课网创始人陈志锋。现有用户超过
    1500 万，合作讲师规模已超过 1500+，且均来自国内外一线互联网公司。


    我算是慕课网的第一批用户，2014 年我想在地铁上学习 PHP，网上搜索了一下没找到几个，好像当时就发现了网易云课堂和慕课网。慕课网当时的视频课程很少，而且绝大部分视频课程都是入门级的课程，但课程免费、讲师内容幽默易懂、质量很高，这为以后慕课网的发展做了积淀。


    ## [就聊挣钱] 第一期精华电子书


    慕课网早期凭借着优质内容、免费观看、移动端使用体验很好等特点，迅速占领了一大批 IT 小白用户。从 2013 年到 2016 年，整整近 3 年时间，慕课网都在提供免费、优质的视频课程，通过这些占领了
    IT 领域视频教育第一把手。


    慕课网从 2017 年开始，开始商业模式的灰度测试，推出了两种不同形式的课程，第一种是就业班的形式，主要讲知识的使用，按照语言或者框架分不同的类型来学习，占比较少；第二种就是实战课程，也是它们网站主推的一种模式，以实战项目为内容，讲解各个技术的使用，特别受到欢迎。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_26_0.png)


    去年 1 月时候我参加了慕课网的慕课之夜，慕课网邀请了慕课网大部分知名讲师一起开了晚会，在一个酒吧搞得很互联网很疯狂（有钢管舞）。在那天了解到已经有几位慕课网的老师，在慕课网一年的分成已经达到了百万级别。


    我们在慕课网找两个比较有名的讲师来看一下数据，一个是廖师兄，因为他主讲 Spring Boot，所以相互认识，还有一个是七月老师，主要讲小程序。


    廖师兄的《Spring Boot 企业微信点餐系统》售价 348 元，目前迈出了 3023 份，就单单这一个课程，卖出了一百万元，慕课网和讲师的分成是 4：6，也就意味着这个课程可以分成
    60 万。


    7 月老师的《微信小程序入门与实战》课程是慕课网最受欢迎的课程之一，售价 149 元，销售量高达 15000 多份，从售价 223 万，按照 4：6 的分成，单这一个课程提成高达一百多万。


    当然上面这两个老师在慕课网都是很有名气的，一般的老师课程销量在 1000 份左右，按照课程均价 300 元计算的话，平均每位讲师大概收入是十几万左右。


    慕课网的套路是，在网上找一些知名的作者在他们平台开一个免费的课程吸引人气，再后面规划整套课程来销售。我个人还是非常看好慕课网未来的发展，如果大家想去慕课网录制课程，我可以帮忙介绍。


    我给慕课网录制过一个免费的视频，感觉很辛苦，第一次录制视频需要消耗太多的精力和时间，最后坚持把免费视频录制完毕后，就暂时放一边了。


    CSDN 和 51CTO 都是比较有名的 IT 社区，都是在网站上分出一个板块做在线课程，人气也不错。


    CSDN 平台和作者的分成是：讲师：平台 = 6：4，按照售价 100 销量 1000 份来算的话，一个课程的收入大概是 4 万左右，CSDN 平台视频课程很多，因此有的老师收入应该很高，有的又很低，看情况吧。


    51CTO 和讲师的分成是按照比例走的，普通讲师 5:5；签约讲师 6:4；金牌讲师 7:3，级别越高拿到的分成越多。51CTO 学院的课程销售数据不知道是真是假，看起来很吓人，有的课程销量
    5 万多，有的课程销量 17 万，均价在一百多元，一门课程在四五百万的收入，分成可以拿到二三百万。


    网易云课堂是一个综合的在线学习网站，IT 领域只占到其中的一个板块，如果只是自己推广课程的话，平台不收取费用，如果平台给推广的话，平台收 10% 的手续费。看了一下付费的课程不是很多，而且比较杂乱，IT
    学习人气是相比前面三个网站最弱的。


    做个对比：


    - 1、慕课网是专业做 IT 领域的视频课程，产品体验最好、用户量最大、课质量好、销量比较可观，他们公司的玩法也最具互联网化，我比较喜欢。缺点是课程都需要后期制作、排期，往往录制一个课程到发布需要大半年的时间。

    2、CSDN 是国内第一大技术社区，有一定的流量，做法比较传统，讲师收入有保障。

    3、51CTO 是偏向网络和运维领域的社区网站，这方面的课程销量应该会好一点，相对 CSDN 弱一些。

    4、网易云课堂，IT 在线课程只是其中的一个小版块，整体感觉免费的视频多一些，付费课程较少不成规模。


    ## 技术人做公众号能不能挣钱


    在没有做公众号之前，我写了一年多的博客，在博客的同时认识了一些朋友，发现很多和我同样写技术博客的博主都开通了技术公众号，那个时间我也比较奇怪为什么大家都喜欢开通技术公众号呢？这个疑问直到我开通自己的公众号半年之后我知晓。


    我写博客一年多的时间，除过为 51CTO 技术博客投稿以外，没有过任何其它收入。在这里我多说两句，其实很多技术公众号都是接受技术文章投稿的，会有稿费，比如
    51CTO 技术公众号，如果投稿被采用每篇文章会有 500 元的收入。51CTO 官方等技术公众号也都接受投稿，有的高达一篇 1000 元左右。


    开通技术公众号最大的感受是和读者的距离更近了，方便用户点赞、阅读、转发，对个人品牌也是一个很不错的宣传途径，比如我近期转载的沉默王二的文章《为了完成月入三万的目标，我都做了哪些准备？》https://mp.weixin.qq.com/s/WcN5bkvFrCNZiJv-KEx4qw，对个人是一个非常好的宣传途径。


    但写公众号最大最持久的动力是收入，前面说过写博客一年多的时间没有一点收入，虽然当初写博客也不是为了有收入，但是能有收入谁又会嫌弃呢！而开通微信公众号半年之后，就迎来了人生第一个商业广告。那时候甚至都不知道该要多少钱，最后定了一个月推
    8 篇文章，每篇文章后面贴一个广告贴片给 1000 元。


    在微信公众号上写文章会有三方面的收入：流量主广告、赞赏收入、接外部广告。当你的微信公众号读者大于 5000 后，就可以开通自己的流量主，也就是微信文章最下面的那一张卡片广告，这部分收入其实很少，像我现在这个级别每天流量主的收入在
    20-40 左右，就是一顿午餐钱。


    赞赏收入是这三块收入中最少的，几乎可以忽略不计，但赞赏却是鼓舞作者持续写作的最大动力，用钱给予的投票绝对是最真实的认可，不论金额大小；接外部广告才是公众号最主要的收入，这个主要看公众号的定位和读者质量，有的公众号几百块就可以发，有的公众号甚至要上万。


    技术号的收费标准公认的价格是一个阅读量一元钱，也就是说如果你的公众号一周发了五篇文章，每篇文章的阅读量大概是 5000 左右，那么当广告商找你的时候，你就可以报价
    5000 元，基本就可以成交。


    在这个报价的基础上，不同的公众号会根据情况又上浮或者下调，财经类的公众号，一个阅读可以高达 2-3 元，情感类的公众号报价和技术号差不多。另外又一些网红公众号报价很高，比如我公众号转发文章的
    听脑湿 或者 今夜 90 后等公众号，每条广告的头条价格是 20-40 万，一条广告就超过我们一年的收入。


    另外个人原创公众号的收费会比转载类的公众号文章收费贵；个人技术公众号会比机构技术公众号收费贵，因为个人技术公众号一般会带有个人品牌属性。


    这里有一份名单（附件），里面有几位做技术公众号的技术人年收入超过了百万，我现在每个月技术公众号广告费用大概是 2 万左右，有的时候多一点，有的时候少一点，算是我业余收入中最多的一块收入了。

