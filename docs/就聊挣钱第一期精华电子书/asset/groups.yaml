    # 利用抽奖程序，低成本公众号疯狂倒流


    看到朋友圈利用抽奖小程序来给公众号导流，具体的操作是：


    +   1、搞一个很大的噱头，这次就假冒天猫做 618 活动抽奖“玛莎拉蒂”。


    这对普通人有足够大吸引力，大家都会抱着万一中了的侥幸心理。


    2、识别小程序员之后，会弹出一个抽奖小程序员，可以点击抽奖，在参与方式中提示用户将小程序分享到朋友圈，并引导关注公众号（提示中奖后方便联系）。


    3、抽奖程序的最下方还有一个概率点，邀请越多的好友参与抽奖，你的概率值越大。来吸引更多的网友传播。


    4、关注公众号有两个入口，一个是点击公众号按钮进入客服界面，进入发信息给你回复公号二维码，另外一个入口在最下面可直接复制公众号 id 关注。


    5、我看了一下公号信息，应该是刚刚注册的，认证信息是西安的一个百货公司，可以确认是假冒无误。关注之后有个公号后，公号菜单有个每日福袋，点击之后需要加个人微信。


    6、完整的引流流程，从高噱头吸引大量用户抽奖，从抽奖程序引导关注公众号，再到个人号，在产品机制上引导用户大量转发。


    从抽奖程序到公号到个人号的一个完整流程，成本可以说是零，99.99999999%的用户都不会中奖，只要搞定中奖的那一个即可。并且还不知道有没有这个人或者小程序可以直接指定。


    大部分用户只是觉得自己没有中奖而已，除过道德因素绝对是一个低成本大量引流的案例。


    不知道小程序参与人数这个数字准不准，我刚才写的时候才 28 万人参与，这会再看就到 31 万用户参与抽奖。就算转换到公号只有十分之一也是不少的用户量了，并且数字还在增加。'
