    500 万日活。


    这场侵略战中，乐尚视界首当其中，麻豆影视紧随其后。乐尚不到 5 人的团队在去年倒在了腾讯的枪下，涉金额过亿，开发者中最低的是小学学历。麻豆影视在今年倒在了院线的炮火中，国内的开发者都已经被带走喝茶了，麻花至今奄奄一息。


    # 结束语


    王二家的店没有卖卦，因为他们店长是一个善良的人，不会去赚这种钱，看着隔壁店又是做公众号小程序，又是招代理，一个月销售出去几十万张卡也丝毫没有心动。直到有一天，隔壁店长被请去喝茶，王二和店长喝了个烂醉说道：做人要善良


    # 嘟嘟 MD 分享《刘大猫的财富之旅》读后感


    这本《刘大猫的财富之旅》很有意思，这是一位互联网草根站长成长和创业的经历，从一无所有到现在的身价 3000 万，建站卖、域名投资、做淘宝客、做微信公众号、再到做社群，最后作者的愿景是做一家大揭下来都能赚钱的公司，很佩服作者的眼光，能在风口上抓住红利的机会，快速的完成原始积累。


    本篇中，嘟嘟将作为第三者来为大家诉说大猫这一路来的经历，期间带有自己的感受。以此想从大猫从小到大的投资里面寻找他是如何做出决定的，以及投资的时候心里路程，再跟自己对比，如果是自己，是否也可以做出这种判断，以及执行力。


    这里跳过了大猫小学辍学的传奇私服这段经历，直接从高中弄网站开始介绍。


    # 初高中阶段


    大猫最开始做了一个美考网，然后各种 seo，最后发现最多 100 多流量就没了，还被一个骗子骗了 2000 元，这是成长必备的试错成本。只有具备了独立思考的能力，我们人生的学费才能少交！而没有独立思考能力的人，他其实一生都在给别人交学费，永远出不了师。


    最后大猫在站长论坛上面看到别人卖自己的网站，那人说道：“我不把自己想的那么牛逼，在我手上暂时没用的东西，我就换成子弹，以后可以用子弹做更大的事情。” 大猫想想觉得很有道理，最后以
    5000 元卖掉了这个网站，获得第一笔资金。'
  - '[PAGE 151]


    虽然卖掉了网站，但是技术和经验还在，可以快速的再做成一个网站，这才是最重要的。


    接着，大猫想弄一个 face book 网站类似百度百科，但只是针对人物的，于是在淘宝上花了 500 块请人二次开发了一套基于 wordpress 的互联网人物档案库，大猫给这个网站起名叫：众众网。最多的时候每天一万个人访问，但是盈利模式不多，只能通过广告联盟赚点佣金。后面网站也卖掉了。


    # 大学阶段


    这时候，大猫上了大学，渐渐地大猫开始冷静下来，重新复盘他的互联网计划。想来想去，觉得互联网创业这件事情，不应该好高骛远，整再多所谓的蓝图和规划都是没有用的。


    大猫发现过去把很多的精力用错了地方，总是在追求产品层面的精湛，以及做一些不成熟的商业布局的规划。


    目标必须要明确明确再明确，就是要落地赚钱，先养活自己，财务自由！其他的东西用不着操心，如果不能赚钱，不能财务自由，谈其他大规划和愿景都是空洞的，不实在的。


    落地、赚钱，原始积累成了大猫在日后的数年时间里的指导思想。第一个盈利模式的建立，

    大猫开始想明白了一件事情，既然做的两个网站都是一挂牌就卖出去了，这说明有很多人就是有购买现成网站的需求啊！那为何不专门来做这个生意呢？完全可以批量做网站，然后批量卖啊！这样所有经验和知识不就能最大化的利用了嘛，而且这就是一个明明白白的现金生意，具有非常好的现金流啊！


    于是大猫为自己制定了一个商业模式，就流水线式地做出美观的网站，然后将成品网站做一些推广获得一些流量，然后直接挂牌交易，不追求每个网站本身能盈利，而将每个网站当成商品来生产和售卖，跟范曾画画儿一样。


    其实创业，做生意，真的是要遵守商业本质，你必须要有东西可以买，不管你做任何事情，你至少都得有一个你自己的商品，以前大猫只有网站，但没东西卖，没有商业模式可以接得住。而现在目标明确的把网站作为了自己的商品，盈利模式就成立了。


    这时大猫着重思考的是，这里哪些环节可以自动化，标准化，模块化，然后让别人去做，或者自己可以更轻松地去做。


    那时候大猫也开始有比较可观的收入了，一个月开始有上万元的收入，后来到数万元的收入。这时候大猫一个人忙不过来，开始组建团队了。


    其实从 0 到这几万元每个月的收入，中间大猫付出了巨大的学习成本，但是真正来临的时候也无非就是做了一个别人懒得理会的生意，站长们都雄心壮志的要做'
  - '[PAGE 152]


    大网站谁愿意干这个？


    大猫除了卖网站以外，每个网站底部的友情链接也出售，大猫的网站的友情链接一般十块钱一个月，一个网站可以卖十几个友情链接，而他手上平时都有上百个网站，一个月光靠卖友情链接，也能多赚几万了（(?，友情链接也可以卖钱，厉害了）


    大猫总结的短期网站运营过程中常见的盈利模式：

    相关个人站长可根据自身不同的情况做出变更，本人在网站运营过程中靠链接交易和软文交易盈利的比例较多。个人也比较推荐这两个盈利点，原因是出售链接，或出售软文，可以不考虑网站的流量，也就是说哪怕你的网站流量是0，那照样可以盈利。这对快速短线操作的站长来说是一个不错的选择。


    为什么好123能卖5000万，而大猫的只能4000，分 析原因后发现核心原因就是因为他有巨大的用户量以及知名度，这时候大猫就开始考虑他目前的商业模式了，复盘了下，客户为何原因买他的网站。


    一种是自己想当站长，但是没有技术，所以买一个现成的。


    另外一种是比较高端的客户群体，想买贵的，差别就是用户量的不同，也就是流量。


    所以，关键点就想通了，如果想赚100万，必须要提高客户画像，找到有钱的客户，把利润更丰厚的高端商品卖给他们。到这里，商业模式就需要改变了，以前是做快销品，现在要走精品路线；不能说以前的商业模式是错的，不同的时间段都正确，只是在不同时间段需要快速迭代。


    于是大猫开始降低网站出手的速度，开始策划运作几个精品的新网站，准备经营好了再高价出售。


    大猫经过考察最后策划了两个星座类网站、一个小学生作文网、一个美文网、一个笑话网。在决定做这五个网站之前，大猫是通过百度指数、关键词采集等等方式调研了相关用户群体是比较大的。可以借鉴一下，想做什么之前，先投入时间调研一下用户需求，然后再决定去做！！！


    很好奇他是怎么搜集这些网站的内容来源的。


    因为有了一些资金，所以做这些网站的时候大猫舍得投入，比如花钱找人做logo，做网站的时候也先考虑专注做一个网站，然后带动其他网站，于是选择了做作文网。


    为了推广作文网做了以下这些操作：

    购买大量高权重网站的友情链接

    带着团队在贴吧、知道、天涯社区等渠道大范围全力推广'
  - '[PAGE 153]


    间接 seo 去高权重的网站自己发帖提问（标题里面一定要包含你想优化的目标关键词），然后小号自己回答，发完帖子之后，记得要给这个帖子做 seo，在各个地方发这个帖子链接，推这个帖子，往往这个帖子被曝光得越多，搜索引擎给帖子的权重也就会越高。


    这个我也有过自己的经验，为了推广我自己的博客，我在百度搜关键词 spring boot 的时候，在第一页界面点开里面的网页，留言评论推广我自己博客的连接，效果一度也很棒。
    还在其他高权重的博客论坛比如简书、CSDN、开源中国、开发者头条、掘金等这些网站推荐我的博客。


    用这样方式，大猫的作文网很快就打到谷歌 pr5 的级别，国内流量前三的作文网，然后其他四个网站也跟进，网站之间交叉链接，流量互通。 最后遇见贵人，五个网站里面的三个网站打包卖了
    140 万。


    收到人生的第一个 100 万后，大猫有点飘了但是最后还是抵制了诱惑，没有乱花掉，而是做了思考后最终决定投资房子，于是花 40 万首付买了苏州的房子，剩下的贷款，家里帮忙还。


    个人感觉这是大猫做出的最正确的投资了哈哈。


    大猫说希望所有的朋友做任何的投资，都能够独立思考，独立判断，尊重自己内心的选择，而不要轻信任何网红公知。


    除了房子这个稳健投资外，大猫又做了很多高风险的投资，其中包括：域名投资。


    为何做出这个投资判断：

    因为觉得域名对于互联网公司来说是非常重要的流量入口，大猫的眼光还是很超前的。大猫当时花了 20 万全买了四声母 com 域名，最后又在泡沫之前及时退出，在四声母
    2000 多元的时候开始出货，到最后这轮投资翻了近 10 倍。


    大猫有钱了后开始投资自己，买很多书籍阅读、买了辆车。 接着大学期间抓住了最大的机会，那时候观察到当时大部分有流量的站长中，一般会有两种主流的赚钱的模式

    广告联盟

    淘宝客


    大猫发现完全不只有百度控制流量，而电信运营商、公安部门、wifi、浏览器、搜索引擎等等。每个环节都是流量要经过的地方，大猫通过对淘宝客的仔细研究，发现这确实是当时非常好的一个互联网变现通道，决定抓住这个机会。


    普通人通过加法赚钱，大神们是通过乘法赚钱的。他们能通过商务能力与技术思维让某个流量分发渠道上原本就有淘宝购物需求的流量走他的链接购物，这对客户没有任何影响，甚至还可以得到返利。'
  - '[PAGE 154]


    大猫在人人网和开心网的策略主要就是通过这些平台做很多的大号出来，人人公共主页、人人个人账号他都做，积累了不少流量。而对于腾讯开放平台，就是在里面做 qq 空间大号，做
    qq 空间应用，也获得了很多的用户。


    大猫认为的三种互联网红利与风口：


    渠道型风口

