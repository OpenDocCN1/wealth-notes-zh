    大姨妈创始人简介：

    柴可大姨妈创始人兼 CEO，作为 80 后创业先锋，柴可经历过每位创业者必走过的拐折之路，也正是这些个丽的跌倒让他分外爱创业，不屈不挠不放弃的劲儿得到了红杉、贝塔斯曼等金牌投资方的赏识，并为之给予了行动上的投资。


    柴可是一个连续创业者，我们发现很多成功的产品背后，创始人都是连续创业者。这也从一个侧面反应到成功不是一蹴而就的，需要不断的去试错。


    柴可的第一个创业项目叫“友乐活网”，是一个基于健康话题的社交平台，但是，由于定位模糊，在整个 2010 年到 2011 年上半年，友乐活网都毫无起色。


    从 2009 年至 2011 年间，柴可与团队的创业项目主要围绕 PC 展开，他搭建了一个以健康话题为主的社交平台，但是在 2 年的发展时间中，用户总量都没有快速增长，自己卖房卖车搭进去的创业资金也折损大半，这时候他开始寻找新的创业项目。


    2011 年 7 月，柴可带着“按哪儿”参加了一个创业比赛。“按哪儿”像一个虚拟的按摩老中医，告诉用户哪儿不舒服的时候可以“按哪儿”。结果这个项目被评委一致狠批，说产品没有触到用户的刚需。


    有一段时间，柴可的女朋友常向他抱怨经期后头疼。后来听人介绍尝试了在月经前一周减少巧克力、咖啡和茶的摄入，效果非常好。柴可突然意识到，月经对女孩的困扰是长期的，而提醒女孩不要在错误的时间做错误的事，帮助减轻痛苦——这就是柴可在寻找的“刚需”。


    2012 年 1 月，“大姨妈“这款女性生理周期推算应用正式推出。这一次，柴可确信他的第三个创业项目终于找到了刚需。


    2012 年 3 月至 6 月间，柴可的 10 人创业团队在三个月内走掉了 6 个人。离职理由各有不同，有的说要去国企上班，有的说要离开北京，唯一相同的是他们的态度都非常坚决。


    2012 年 5 月底，“大姨妈”苹果版应用上线。当柴可还在想办法推广产品的时候，却惊异地发现“大姨妈”在 AppStore 的榜单上昂首阔步，最好的时候在榜单第
    7 的位置上待了三天，每天都能带来 4 万人左右的新增用户。


