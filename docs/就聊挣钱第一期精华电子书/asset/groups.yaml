    ## 在线图文课程能不能挣钱？


    这里的在线课程是指技术图文课程。


    做技术的人，如果你对某一项技术理解比较深刻，或者因为工作的原因擅长某一门技术，那么你就可以利用此技术真正的去挣钱了，并且这是可行和推荐的，既帮忙了别人又重新完善了自己的知识体系，同时又能挣一些零花钱，何乐而不为。


    我觉得我还是有资格来谈论这个事情的，因为我就参与了其中，今天就给大家深度揭秘知识付费之在线课程的内幕。


    腾讯研究院的报告指出，2011 年至 2015 年，是知识分享的小范围付费时期。2011 年，豆丁网推出付费阅读产品；2013 年，罗辑思维开始招募付费会员；2014
    年微博开通打赏功能、豆瓣阅读开启付费专栏；2015 年微信推出赞赏功能……免费的知识分享进入到知识分享经济的萌芽阶段。这一阶段，打赏、赞赏尚属于小规模的、随机的个体行为。


    2016 年被很多人称为“知识变现元年”。2016 年，几乎每个月都有知识付费的产品出现。当年 4 月，问咖、值乎上线；5 月分答、知乎 live 上线，王思聪在分答上
    32 个问题赚 20 多万的新闻刷遍了整个互联网；6 月，得到 app“李翔商业内参”、果壳“职场沙龙”推出；8 月，知乎专栏赞赏功能、雪球问答、vipabcV
    来秀直播、联想“知了问答”上线；9 月，虎嗅推出付费会员，提供深度报告等内容……12 月，李开复在一次采访中说：知识和经验变现的时代到来了。


    纯技术领域的知识付费最早诞生于一个小的创业公司叫：Gitchat，网站上线于 2016 年的 6 月，这个公司是由前百度文库阅读和图灵公司的出版负责人谢工创立，创立之初就有
    CSDN 创始人蒋涛和小道消息的冯大辉给予天使投资。最早的形式是 Chat，由一个技术人发起一个技术讨论的话题，同时设定一个参与的价格，传播开来吸引感兴趣的朋友加入。


    早期 GitChat 选择和很多技术大 V 来合作，一方面技术大 V 自带流量，第二他们可以依此作为宣传点来宣传他们的平台。所以早期就会看到他们在各个渠道，寻找有技术影响力的技术人，和很多技术公号、博客建立联系，帮他们变现，帮自己宣传。我就是因为他们工作人员在我的公号留言而了解的这个平台。


    每次 Chat 举办者可以分成几百到几千元，后来这个网站创建了另外一个频道叫


    做达人课，以专题系列的形式来分享某一门课程，相比较 Chat，达人课的形式周期更长，学习起来更系统一些。Gitchat 算是技术知识付费最早的先行者，但真正掀起技术领域知识付费高潮的却是极客时间。


    极客时间创建于 2017 年 10 月，极客时间由极客邦科技公司创建，公司的总裁是技术大 V 池建强。极客邦旗下拥有比较有名的就是 InfoQ 网站，常年在国内举办各种技术峰会，因此公司积累了一批活跃的技术资源，这些资源被充分的利用到了极客时间。


    极客时间玩法最具互联网化，专栏采用技术大 V+暴力营销的模式来疯狂发展。极客时间刚上线就玩起了大 V 站台的模式，最早在极客时间开课程的大 V 有：左耳朵耗子、西雅图巅、美女程序员朱茵等。这些技术圈内最知名的大
    V 给极客时间带来了第一批用户。


    但真正的高潮还是来自营销，转折点在《从 0 开始学架构》以阿里 P9 架构师为宣传背景，同时强调推荐购买课程可以返利 24 元。在课程上线初期，在技术公众号领域全面轰炸了一遍，导致当天朋友圈持续刷屏，几天内课程销量过万，真正算是打响了产品。后面又增加了很多拼团、限时购等营销策略，应该是所有技术在线课程中最会玩营销的一家平台。


    掘金也是一个比较新的技术社区网站，创建于 2015 年 8 月，掘金最初来自于稀土，是稀土的一个子版块，没想到稀土没有火起来，反而做为技术分享网站的掘金火爆了起来，于是创始人阴明随即调整了方向，大力发展掘金。


    2018 年初的时候掘金也开通了自己的专栏、掘金小册，刚开始以前端领域的专栏为主，后期也慢慢覆盖了整个领域，掘金小册最大的特点是为作者提供了专业的文章管理平台，对专栏作者来讲体验较好，同时掘金小册新课上线时会在技术公众号内做营销，一般是通过固定链接购买可以享受半价，这个营销策略很有效和实惠。


    最后一个上线的技术付费专栏是 51CTO，51CTO 是一个老牌的技术社区，成立于 2005 年，目前已成为专注于 IT 人职业成长平台；拥有 1500 万注册用户，覆盖了中国主流城市大多数
    IT 从业人群，是国内排名第一的服务 IT 技术人员的专业性服务平台。


    51CTO 网站的用户群体以网络、运维为主，因此在所有的付费专栏中，这两方面的课程最为受到欢迎，课程定价也比较有特点都是 51 元，51CTO 付费专栏算是中规中矩，也会做一些营销，但更多是在网站的体系内来做，很少在外打广告做宣传。


