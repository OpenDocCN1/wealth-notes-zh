    # 圈友精华分享


    # Quincy. 分享：赚钱的看法


    这里我不准备说什么赚钱的案例，我说说我的个人看法。

    我觉得赚钱，尤其是以财富自由为目的的赚钱，最好满足以下几个条件：


    +   1. 从你熟悉的领域干起，从能改善你所在行业的需求干起。

    2. 第一桶金很重要。

    3. 一定是要钱生钱的模式。


    首先说明，我个人还未成功，所以上的条件，均是我根据长期的观察和各种案例阅读得来。


    先说说第一个：从熟悉的领域干起。


    我觉得其实日常生活中的机会多不胜数，各行各业的，就像很多朋友分享的案例。

    你只要有眼光，抓住机会，勇于实践，持之以恒肯定能成。

    眼光我觉得大家都有，机会你也可以去抓住，但是在实践环节，就是体现个人能力的时候。

    这里就会有个问题，如果我跨行业创业，我凭什么比那些处在那个行业的人还优秀，还有能力？

    举个例子，我搞网络的，如果我现在发现搞外贸能赚钱，但是和专职搞外贸的比起来，人家有人脉，有经验。

    凭什么我就会比他们厉害？凭什么这个机会就我发现了，人家没发现？大家都是'
  - '[PAGE 112]


    聪明人，没有谁比谁笨。


    反过来，如果我从自己熟悉的行业干起，第一我知道这个行业存在的机会，我也知道大家需要什么。

    最主要的，我有足够的经验和人脉支撑我去做这件事情。


    我记得有一个案例说过，从你开始准备创业，到后面成就大事业。你会发现刚开始创业所从事的事情，可能和后面最后做的风马牛不相及。这里就牵扯一个过程：你从 A 创业，结果干的时候发现有
    B 机会，最后做到 B 的时候发展成 C，然后 C 又演变成 D。而 D 就能让你财富自由。

    打个比方，如果创业初期就想到我要做一个环保公司，拯救世界，我觉得这个公司大概率事件会死。（你要是有一个有钱的爸爸，那是另外一回事儿）

    所以，我觉得刚开始做，就做一个自己熟悉的行业，但是又能解决一些大家的需求问题。

    例如这周六分享的这个网盘，就是一个程序员通过发现一个行业需求，然后通过自己的技能去创新实践，最后赚钱的故事。他并不是做跨行业的事情。


    第二个：第一桶金很重要

    这个我觉得很好理解，就拿最近很扯淡的那个电影：《西虹市首富》，就是一个最典型的例子，当你有钱以后，想不赚钱都难，只要你不干傻事，例如投钱给 A 股。

    所以，如何让自己有第一桶金的钱，非常重要。

    我因为在国外，就比较关注国外的华人创业，有很多华人就是从开始从倒卖装电影的硬盘起家（国外版权比较严，没法非法下载电影）。赚了第一桶金以后，就开始把赚的钱来做外贸，买卖房屋，几年就不愁吃穿了。


    第三个：钱生钱很重要。

    我觉得，要做到财富自由，首要一点就是，你得有一个持续不断的 cash cow 现金牛生意。

    所谓持续不断，就是指假设你离开了这一门生意，它还能持续运营。

    而不是自己白天给老板打工，晚上再给自己创造的另外一个工作打工。

    例如这周六的这个例子，你只需要短期的投入，或者间歇性的更新。大部分时候人们就过来注册也好，访问也好，持续不断的为网站主贡献收入。

    我觉得这一点很重要。


    说说我自己的计划，我 18 年才刚开始搞副业，咱国家目前的机会比较多，毕竟人口摆在那里。

    所以在国内做基于流量的生意就很容易起来，但是你得有一些点子。目前在某个博客平台做贡献，也搞了两专栏卖了点钱。

    但是最主要的，我收获了很多反馈，关于他们都需要什么，我觉得这是才是最有价值的。

    然后基于他们的反馈，我目前在琢磨某个网站，此网站的目的就是解决他们的需求。

    网站盈利方式估计将会是会员制以及内容付费的方式。'
