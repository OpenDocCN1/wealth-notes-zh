    左右的费用，具体数字支付宝支付记录有，懒得去翻了，哈哈，不知道是出于道德层面还是良心层面，被别人坑了好几千的情况下，我仍然如数的支付给他了，当时的想法就是【不能为了钱出卖自己的价值观，这些东西一旦你自己不珍惜了，后期用多少钱也是买不来的】，希望这也是对大家的忠告。


    所有的 API 对接都是预付款+当天结束后清账多退少补的结算方式，所以当时的状态基本都是每晚 12 点，查看糖果码的系统统计，我人人清算，然后拿着统计分别我跟我合作的对象清算，除了小康、石头、还有几个小合作伙伴，再次不列举了。


    整个创业过程虽然只经历了 2 个月，但是期间发生了太多的故事，无法通过一篇分享说清楚说明白，后续也期待跟大家一起讨论，碰撞。每次我跟我媳妇逛狗（大金毛，名字叫大毛，超傻超憨）聊天的时候，我们都会讨论一些比较有深度的话题，【人生一定要改变】当你觉得你的人生已经平静了，想办法折腾起点浪花，只要变就会带来可能性，正如我媳妇做微商，她没成功，我倒是因此赚了一笔。


    除了做糖果码之外，还会接点私活（目前还有一万多的私活钱没要到），帮朋友运营个公众号（自行车类的），因为我平时的一个户外爱好就是骑行，所以，虽然是免费帮他做，他也给了我不少好处（自行车、装备啥的）。回顾
    14 年毕业到现在，在一个二线城市目前好像已经达到了走技术路线的瓶颈，正在朝着技术 leader 转型，打算等糖果长大一点，去一线城市继续打拼一番，期待结识更多志同道合、相互欣赏的朋友，未来的路还好长，能结伴同行最好。


    以下是糖果码截图，只能 9 张，挑着截了几个龇牙，logo 我自己设计的，霸不霸气，哈哈。

    附个人微信，请见知识星球。


    ## 不负此生分享：一个自己第一次的赚钱案例！


    记得大三时候出去实习，我们数学系是在武汉的一个培训机构学习一个月，主要是学 Python 及大数据基础。说是实习，其实是没有工资的，毕竟是别人给我们上课，怎么还会给我们发工资！


    我爱学习，晚上回来便会看腾讯课堂的 Python 课程直播，重要免费！顺便说一下，腾讯课堂直播的套路就是：直播免费课程质量非常高，然后后面付费课程质量一般！有一个直播老师说去年也就是
    2016 年，有一个学生，自己做课程，月入上万，当时我就心动了！


    当然，这只是当时的一个想法！


    ### 1、着手开始做


    回到学校后，我就开始着手自己的这个事情，选的是我自己自学了 2 年的一门语言（并不是 Python）。做课程资料，写代码，因为作为一门课程，需要保证他的完整性，我把书籍翻了出来，准备了一个比较完善的课程大纲。


    一边录制，一边往网易云课堂上传，大概每天花 4 个小时的样子，花了半个月，应该是 60 个小时，68 节课程，完毕！


    ### 2、推广


    我以为课程只要上传到互联网就好了，就会有人购买。然而，并不是这样的。网易云课堂等等，这些在线课程会按照销量、评分对课程进行展示、曝光。新课程曝光度很少，怎么办？


    互联网真是一天一个样，2017 年还算传统，qq 群还比较受欢迎，像现在 qq 群就用的少了，主要转移到微信群。我主要进入各种 QQ 群，给别人解答问题，在群里搞好关系，跟群友打成一片，这样打广告别人才不至于踢你出去，发链接，通过
    Python 脚本发群邮件等等。很是狼狈！


    价钱，开始是 1 元，然后随着人气增加涨到 68 元，2 个月后，购买人数，达到 300 多，我将课程定价为 110 元，不再修改了！


    当时，我也开通了我的微信公众号，通过微信公众号写文章，推广课程，效果也明显上升！


    失败的推广：　当时注册了知乎，和天涯，上去就一个二维码，链接，结果被知乎永久封闭，天涯封闭 20 年！其实，像知乎这种，可以通过回答问题或者写文章，暴露链接也是好的，直接暴力推广是不行的，我反思！后来，我又办了个小米电信号，注册了知乎和简书。


    ### 3、营销策略


    我发现，网易云课堂对课程会有一个按照评分排名，并且优惠券是可以全额的。于是，我用手机号，注册了 10 个 QQ 号，QQ 号又能注册其它号，这些号都是能登陆网易云课堂的。登陆后，领取全额优惠券，等于全免费，然后评价：★★★★☆，经过这一波操作，我的课程在评分这个维度上顺利排到了第一。


    随着排名的提升，购买量也会上升，销量这个维度经常在第一、第二名徘徊，评分维度排名第一。有时候，一天也能成效个 3 单，3*110 元，评价下来，一个月大概有
    3000 元的收入吧！


    两年前的事情了，具体中间的过程，也就能记得这么多了！


    ### 4、我明白的道理


    通过这个小案例，现在想想，感悟有一些


    - 1）、营销手段（方法）很重要；2）、远大越强，越小越弱；强者只会越来越强，弱者只会越来越显得弱小；


    现在，我已经工作了（其实，我是个程序员！），当然还是以工作为重，这门课程依然好评如潮、销量不错。可以说，躺着赚钱；当然了，就是每个月生活费、房租钱，都是小钱，不多！


    这是我的一个真实例子，应该算是我人生中第一次自我提升，喜欢或者说习惯发现、思考各种工作之余、下班回家可以挣钱的一些方法，主要包括对钱的渴望，对事物的变与不变的一个态度。


    这个经历、习惯，这也为我日后，喜欢折腾、做事，做了一个铺垫！


    我会，加入大佬的圈子，学习、交流赚钱方法！别人的 idea，可以借鉴，不可复制！重要的是自己的对于现在、未来，有意识或者无意识的思考和准备吧！


    机智


    打了这么多字，我顺便，推广一下自己的公众号不过分吧，不过分的话，那我说了，公众号名字：数据分析挖掘与算法


    其实，大三开始做公众号，一口气申请了3个，当时做的很慢，现在想想，做事还是要讲究方法。后来工作转行大数据了，也没有时间做了！就这个公众号一直维护着，长大的很慢，不过我一直在坚持！


    - 2019 年最大的两个感悟：1）、坚持做一件事情，1个月，3个月，很简单；但要想坚持半年、一年。。。真的很难。2）、谁都想努力，但是，方法很重要！


    人活一世，草木一秋，没什么敢不敢做的，也没什么敢不敢想的，加油！机智


    ## 《程序员的成长课》作者安晓辉的副业故事


    微笑邀请我做“就聊挣钱”的嘉宾后，一直没敢说过话。最近在写新书，梳理了我做副业的过程，趁此机会，分享给大家。


    从 2014 年中到 2017 年中，这三年多的时间里，我本职工作表现优秀的同时，还做过下列 8 类副业：


    - 1. 写书


    - 2. 视频课程

    3. 顺风车

    4. 公众号

    5. 语音问答

    6. 知乎 Live

    7. 视频直播课程

    8. 职业规划咨询


    一个一个给大家简单介绍下。


    ### 1）写书


    2013 年下半年，我恢复了技术博客的写作，没多久，有一篇写 Qt on Android 的文章引起关注，电子工业出版社的一位编辑联系我出版相关图书。


    当时我还在上班，但我是爱技术、爱写作的人，就干脆应承下来，然后开启了写书之旅。


    在 2013 年 12 月到 2014 年 9 月份这段时间，白天上班，晚上写代码写书，早起写代码写书，周末写代码写书。每天睡觉时间不到 5 个小时，坚持了
    10 个月，体重从 140 来斤瘦到了 126！最终一个人靠着死磕到底的“二货”精神，用业余时间写出了两本技术图书：《Qt on Android 核心编程》和《Qt
    Quick 核心编程》！


    这两本书的版税有 5 万左右，算是我第一次相对有规模的副业收入。


    ### 2）视频课程


    我写完书之后，琢磨着有人可能更喜欢边看视频边跟着练习这种学习方式，就在 2014 年底到 2015 年上半年集中精力录制了 5 个与我的书有关的视频课程，3
    个收费的，2 个免费的。录制完成后，放在 CSDN 学院和 51CTO 学院这两个技术类的平台上销售。


    我没有做任何营销，全是由有需求的用户直接搜索到我的课程，然后购买。到现在，四五年没更新过课程了，每个月还有一些销售。


    2015 年，我因为工作关系，学习了 Node.js 等新技术，又录了一些视频课程，放在平台上销售。


    ### 3）顺风车


    2016 年，我上班地点是在西安的神州数码科技园，丈八四路和锦业路十字西北角。我的地方，在科技路和高新四路十字西北角，离上班地方 7 公里左右。


    我每天开车上班，带上我媳妇，后排空两个座位。我就琢磨着试试顺风车，上班拉一单，下班拉一单，合计 20 块左右，一天的油钱绝对包住了。


    于是我就注册了滴滴顺风车，上下班时拉人。拉了 3 个多月，每个月赚 4、5 百块，可以包住油钱，不过后来因为时间成本以及老带着媳妇兜圈圈引起不满，放弃不做。


    ### 4）公众号


    2015 年 5 月 9 号，我开通了自己的公众号“程序视界”。一周更新 3 篇文章，慢慢做，到现在，将近 4 万关注。


    公众号会有 4 类收入：软文广告、赞赏、流量主、销售返佣。


    我的公众号比较佛性，软文广告较少。^_^


    ### 5）语音问答


    2016 年 5 月，分答横空出世，我迅速注册了账号，开始了疯狂答题之旅，到 2017 年 7 月初，回答了 4800 多个问题，收入有一万出头，排名冲到了职场类
    TOP 10。


    后来我转移到值乎上来回答问题，因为它可以一次提问，6 次追问，更像微咨询，能更好的解决问题。


    ### 6）知乎 Live


    2017 年初，我开始做知乎 Live，主题大多围绕着软件开发者的职业规划进行，到 2017 年 8 月份，开发了将近 20 个 Live。其中有一个 Live
    叫“业余时间赚钱的 6 和策略”，成为爆款，到现在为止，卖了四万两千份，单课程销售额超过 40 万元！


    我摸索出了一套开发知乎 Live 的方法，感兴趣的小伙伴，可以向我提问，或者单独约我聊。


    ### 7）视频直播课程


    前面提到我从 2017 年初开始讲知乎 Live，那时讲的第一个系列，是“程序员的精选”，分三次讲完。


    后来觉得“程序员的精进”这个系列 Live 很多东西还可以再挖掘，讲得更细一些，我就打算重构一遍。于是我撰写了 PPT 讲义，分成三次内容，在斯达克学院和
    CSDN 学院直播，每次一个半小时左右。


    再后来还做过一些别的视频直播课。


    ### 8）职业规划咨询


    我在 2015 年时系统学习了职业规划技术，拿到了中国职业规划师的资格证。2015 年 3 月份，“在行”平台上线，我以“图书作者+职业规划师”的身份，申请成为了在行的行家，开始通过在行
    App 为开发者提供与生涯规划相关的咨询服务，比如职业规划、选择 Offer 等。


    到今天，使用在行 APP 完成了 87 次咨询生涯相关的咨询。如果你有生涯方面的问题，可以到在行 APP 内搜索“安晓辉”，付费约我。


    这就是我一路走来的副业故事。非常幸运的是，副业虽然在时间上给我带来了较大的压力，但却给我带来了更多的收入，重构了我的收入结构，帮助我走出了“晋升无望，收入见顶，而开支直线上升”这种困境，让我有了更强的自我效能感和财务自信。


    ## Iyhjiang 分享：**我是如何历时 8 个月通过劳动仲裁拿回拖欠工资的**


    在上一篇帖子中 https://t.zsxq.com/FU7YrFi 说道了我曾经经历过拖欠工资，然后通过劳动仲裁，拿回拖欠工资的经验，下面有球友评论说，想知道具体的过程，以及如何取证的，那我就整理一下当时的过程吧。


    升职加薪的经验我不多，但是劳动仲裁的经验倒是有一条。这一条希望球友们都好好看一下，万一用到的时候，能帮你剩下很多麻烦。但是希望，最好别用到。


    以下称该公司为 A 公司，

    该公司老板为小 B，


    我是 2013 年 2 月份入职 A 公司，入职时候谈的工资是 9k，但是签订的合同上是 3.5k（这个可以理解，一般小公司为了避税都是这么做），2014
    年 1 月，过年之前，A 公司因为经营不善，资金困难，工资只发了 3.5k，年后回来，2 月 15 号，工资没发，然后 3 月初，工资还没发。


    这时候就有点慌了，房租都快交不起了，开始投简历，找下家。然后一周的时间，找到了工作，开始办理离职手续。


    办理离职手续的时候，跟 A 公司的老板谈，剩余的工资怎么办？他说「你放心，这个不会少你的，等公司度过了这个困难阶段，工资就会发的」，听到了这番话，当时年少无知的我便相信了，也没想起来要个工资单和欠条之类的。


    6 月份，入职新公司的三个月后的某一天，忽然收到了一条短信，「您尾号 xxxx 的卡，入账工资 4 xxx 元」，当时跟 A 公司的财务 QQ 上问了一下，这个工资好像发的不够啊，得到的答复是「这就是剩余的所有工资」。


    当时我就纳闷，按照月薪 9k，总共拖欠了大概有 40 多天的工资，应该是一万两千左右，怎么四千多块就是说是发完了。


    于是跟 小 B 联系，发 QQ 不回。第一次打电话，有人接，说自己在开会，有点忙，让我待一会再打过去。


    晚上 7 点多，琢磨着应该有时间了，打过去，没人接。

    第二天继续打，又没人接。

    然后换了个手机号打过去，接了，说清楚情况后，小 B 说，我这会儿在外面呢，你待会再跟我联系吧。 过了两个小时，又打过去，还是没人接。


    心想着，想和解，看来是没希望了。


    于是开始百度搜索如何要回拖欠的工资。


    通过网友们提供的方法，打通了 A 公司所在区的「劳动监察大队」的电话，说明了情况后，让我过去把相关的资料提供一下，主要包括「劳动合同、工资流水、离职证明等」。


    提供完之后，劳动监察大队的人，去了 A 公司，试图调解一下，看能否达成和解。但 A 公司的 人，一口咬定，「工资已经发放完毕，不存在拖欠工资的问题」。


    后来，我问劳动监察大队的人，这种情况下应该怎么办。他们说，你这种情况不太好办，按照签订的劳动合同，确实不存在拖欠工资的情况，要不，你申请劳动仲裁吧。


    于是，我又拨通了该区（拱墅区）的仲裁委员会的电话，不过那边说，A 公司注册的地址不在我们区，你应该打注册地所在区的电话。然后网上搜到了，A 公司注册地址在西湖区，打通了电话后，说明情况，那边工作人员让我带上相关的资料，约了个时间过去。


    到了那边，让我填了个「劳动人事争议仲裁申请书」，把基本情况填上，请求事项、事实和理由以书面的形式写上。然后把相关的证据「劳动合同、工资流水、离职证明，QQ
    聊天记录（以图片的形式打印出来）」提供出来，（如果有录音的话，也是可以提供的，需要录音文件拷到 U 盘中，然后录音的对话内容，文字打印出来）。


    当时是 8 月 19 号，提供完了之后，给了我一份「仲裁告知书、受理案件通知书、举证通知书、开庭通知书」，让我回去等待开庭，开庭时间为 10 月 9 号（因为需要劳动仲裁的人比较多，所以排期只能排到
    10 月份）。


    到了开庭日，仲裁庭里，A 公司的财务就在我对面坐着，仲裁员跟书记员在台上坐着，然后开始陈述证据。


    中间的过程已经记得不太清楚，依稀的记得，A 公司财务提供的证据是，我 13 年 12 月份到 14 年 3 月份离职期间，总共请假了 3 天，违反了公司的规章制度。


    工资组成是 3500 的基本工资，加上 5500 的绩效工资。因为违反公司规章制度，扣除绩效工资，所以，工资已经结清了，不存在拖欠情况。


    我 TM....


    最后的结果，当然是我胜诉了。然后宣判 A 公司 15 个工作日之内，结清我的工资。如果超过规定时间，由法院强制执行。


    过了 20 个工作日，我依然没有收到拖欠的工资。


    于是，我带着「仲裁判决书」以及相关资料，来到了西湖区人民法院，填写相关资料，申请「强制执行」。


    资料提交上去，过了大概一周多，一位西湖区人民法院的法官给我打电话，说查了 A 公司的相关银行账户，发现都没有钱，也没有发现固定资产。


    这时候我从前同事那里得知，A 公司已经换了个名字，但是办公地址还在老地方。我把这些信息告诉了法官，法官说，那我再帮你联系吧。


    11 月份的一天，我正上着班，突然接到法官的电话说，A 公司的法人，小 B 现在已经在我办公室了，你过来一下吧，给你们把事情解决一下。


    我坐了 1 个小时的公交，到达了法院，在办公室里见到了素未谋面的小 B 以及财务，小 B 在法官面前表现的很可怜，说，公司确实遇到了经济困难，不是真心的想拖欠工资。


    然后法官说，行，那你看着解决一下吧，小 B 笑呵呵走过来，对我虚寒问暖，问我现在工作怎么样，经济上有什么困难吗？然后从一个牛皮纸包里，拿出了一沓钱，让我点一点。


    我查了查，一分不少。


    心想，早知如此，何必当初呢，本应该早点处理好这个事情的，非要弄到法院来。


    自此，历时 8 个月，我终于拿回了我应得的工资。


    分享几个要点给球友们：


    - 1. 要使用合法的手段，来保护我们的合法权益。不要去原公司闹事，不但解决不了问题，很有可能你从受害方变成了施害方。


    2. 自己应得的权益，一定不要怂。搜集好相关的证据，不要相信口头上的承诺，要相信白纸黑字的证据。


    3. 保持一个冷静的头脑，遇到事情，利用好搜索引擎来解决。


    ## 明白分享：如何找流量


    以前做程序员的时候，做过一个项目，但是当时只有技术思维，完全不知道做好后，该如何找到用户，于是项目最后就跨了。


    这就涉及到一个问题，如何找流量。


    如果你有好内容，就一定有流量。如果没有好内容，可以换个思路，借助好内容的势能来给自己引流。


    今天要分享的一个就属于这种，题目：

    《可复制，零门槛——如何借别人的流量，打造一个稳定的被动收入系统》


    星球的精华帖内容真是太高了，各种类型的赚钱案例都有，小程序、新媒体、淘宝客、微商、电商，真的让我学到了很多。我前几天在网上看到一篇文章”钱不亦真”啥的，里面讲了很多创业思维和方法，我室友用这个方法，短短两年就买了房，我现在也在学习里面的知识，真的是颠覆我的认知，想看的朋友可以百度案下，感谢微笑老师建立的平台，感谢大家的分享。


    ———分割线———


    上面的那段话，是我瞎编的。

    大家不要真的去百度搜索。


    这个帖子不是标题党，开头的那段话是编的，但是和帖子内容有关。


    这个帖子分 3 部分：


    - 1、分享一个引流案例

    2、拆解案例流程

    3、如何复制这个模式，让自己获利


    下面开始正文：我在简书有篇文章：如何只花 30 分钟，复制时间，轻松赚取被动收入？- 简书，这篇文章阅读量不错。


    我一个习惯，每天会点开简书看一下数据，这篇文章几乎每天都有几人来点赞，也有很多评论。


    除了正常的评论，经常还会有一些来引流的，

    比如「关注**公众号送**」

    或者「加微信**送**」

    或者「点击**送**」

    碰到这些评论，我肯定就删了。


    但是前几天，我碰到一个评论，第一次我看到后，觉得就是正常评论，然后就没管。


    后来，又有一些引流评论，我删这些引流评论时，又看了一眼之前那个评论，谁知道让我发现一个特别牛逼的引流套路。


    那个评论见图片 1，大家先看下，能发现什么？


    是不是很熟悉？


    对，我最开始那段话，就是参照这个评论写的。


    后来，我也走了一下这个流程，下面给大家复盘一下：


    - 1 百度搜索「诸葛飞冬网络笔记」，然后出现图 2


    2 可以看到，百度结果首页，都是关于「诸葛飞冬网络笔记」的新浪博客。标题也很诱人，让有人点击的欲望。


    3 我们点第一个进去，会到他的新浪博客目录页，见图 3，里面还是一些文章。和图 2 差不多。

    也就是无论我们点击哪个，最后都会达到他的博客文章。其中有个标题「按照我说的做项目，你一定能赚到钱」，这个最吸引人，大部分人都会点进这篇文章里。


    4 我们点进文章，最开始看到这么几句话：

    '
  mdcn: '

    卖，我们当时的量可以做到每天卖五六千个号，所以直接对接上了他的 API，后期全都是对接他的资源，在停服的时候，还担心我会不会跑路，当时应该支付给他 10000
    左右的费用，具体数字支付宝支付记录有，懒得去翻了，哈哈，不知道是出于道德层面还是良心层面，被别人坑了好几千的情况下，我仍然如数的支付给他了，当时的想法就是【不能为了钱出卖自己的价值观，这些东西一旦你自己不珍惜了，后期用多少钱也是买不来的】，希望这也是对大家的忠告。


    所有的 API 对接都是预付款+当天结束后清账多退少补的结算方式，所以当时的状态基本都是每晚 12 点，查看糖果码的系统统计，我人人清算，然后拿着统计分别我跟我合作的对象清算，除了小康、石头、还有几个小合作伙伴，再次不列举了。


    整个创业过程虽然只经历了 2 个月，但是期间发生了太多的故事，无法通过一篇分享说清楚说明白，后续也期待跟大家一起讨论，碰撞。每次我跟我媳妇逛狗（大金毛，名字叫大毛，超傻超憨）聊天的时候，我们都会讨论一些比较有深度的话题，【人生一定要改变】当你觉得你的人生已经平静了，想办法折腾起点浪花，只要变就会带来可能性，正如我媳妇做微商，她没成功，我倒是因此赚了一笔。


