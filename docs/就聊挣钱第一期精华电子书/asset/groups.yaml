    抖音已经将三岁小孩到七八十岁的老大爷用户群全覆盖，所以说抖音可能是一个国民级的产品。并且抖音在国际上同样火爆，在东南亚、欧美等国家常常在 app 下载的前几名，所以说抖音可能是这些年来中国产品国际化做的最成功的
