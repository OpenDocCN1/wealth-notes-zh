    ## 思考点：


    在线工具网站因其必备功能而产生大量访问流量，仅仅是将流量卖给第三方来使用，这对网站的流量来讲是极大的浪费。如果能对流量做进一步的挖掘和处理，可以获得比在线广告大
    N 倍的受益，我先抛砖引玉谈自己的设想：


    第一，网站的大部分功能免费使用，个别优质功能需要关注订阅公众号之后才可以使用，或者是每个 IP（用户）前 N 次免费使用，大于 N 次之后需要关注公众号才可使用。这种方式主要是将网站用户倒流为公众号用户，方便后续做营销，探索更多盈利方式。


    第二，同样是上面的思路，也是优质功能限制使用次数，只有成为网站的会员后才可以享用这些无限制特权。假设每天有一百万个用户访问这个网站，转化率为千分之一，也就是每月有
    1000 个付费用户，每个付费用户收费 9.9 元人民币，那么每月的收入就是 1 万元，如果转化率再提升一点可以达到千分之五，每月收入就是 5 万。


    第二个思路已经有一个网站这样做了，而且做的还很不错，它就是 https://smallpdf.com/。这个网站主要集中在 PDF 这个领域，全球排名就可以到达惊人的
    678 位，日均访问用户达 500 万。依此推断 www.atool.org/ 网站还有很大的提升空间。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_11_0.png)


    如果圈友想实践，我的建议是不用一下子就做那么多的功能，先把最高频的功能做好做到极致就马上上线运营，后期跟进反馈建议分期添加其它功能，直到最终成为一个完善的平台。当访问量足够大的时候在考虑营销的事情。


    这就是给大家分享的第一个挣线案例，这个网站使用的技术含量来说并不是很高，网站百分之 80%以上的功能都可以在 github 上面找到对应的开源代码，只需要做好功能和产品以及后续的
    SEO 等等，仅仅依赖这个网站月入上万轻而易举。


    ## 抓住痛点，一个网站就会让你实现财富自由


    在如今巨头瓜分海量互联网流量的时代，作为个人可以依托在巨头之下寻找机遇。当一个巨头每发布一个战略性产品时，就会释放出大量的红利出来，如果可以早期加入就可以跟着巨头产品的发展而发展，从而获取到巨大的红利。


    2013 年微信刚推出开始做微信公众号的时候，只要你稍微用点心，现在至少可以收获百万+粉丝，百万+粉丝变现起来年入百万问题不大，初期做公众号的人极少，人们因为好奇会关注很多早期的公众号，只要质量稍微有保障就会获得巨大的成功。


    2017 年头条为了发展自媒体，邀请入驻作者并每月补贴 1 万，文章的广告费仍然属于作者，在整个公司扶持之下，被邀请作者粉丝增长飞速，补贴的 1 万反而成了零头。如果在
    2017 年抖音准备爆发时加入，到今年也可以斩获大量粉丝，现在粉丝百万的大 V 一个 15s 广告报价几十万。


    大家可能会说写作和录制短视频都不是我擅长的，圈子内都是做程序员的朋友，如果有敏锐的观察力和执行力，在巨头产品初期功能不完善或者大公司某些原因不能做的功能的背景下，能在短期内针对产品某个痛点给出解决方案，即可获取到大量流量，从而实现流量变现。


    今天给大家分享就是，抓住产品痛点并随着巨头产品发展壮大的一个案例。这个程序员抓住网盘发展初期的痛点做了一个网站，仅仅依赖这个网站每年收入至少近百万。


    2013 年 8 月 12 日，金山快盘宣传永久免费 100G 云空间。以此为导火线，网盘大战正式拉开了序幕。8 月 14 日，360 云盘开始送 360G，8
    月 22 日，百度网盘携带 1T 的永久空间前来挑战，并且活动页面摆明了 100G+360G+564G+1 块钱等于 1T，意在打压金山的免费 100G 与
    360 的 360G；面对百度攻势，360 再次披甲上阵，匆忙应战，再送 666G，并在微博公开发表：“那就再送 666G，无需 1 块钱，无需繁琐的支付过程，1T
    空间你直接拿走。”


    在那个网盘大战的年代中，网民突然觉得很幸福，可以在各大互联网公司免费领取几百 G 甚至上 T 的网盘空间。于是网上的内容是越来越丰富，到了 2014 年–2015
    年，中国网民几乎可以将自己历史上所有的数据都存储到网盘中，随着宽度的进一步发展、流量越来越便宜，网盘存储的内容从丰富度和量级来讲都呈现出指数级别的暴涨。


    各大网盘互联网公司为了鼓励分享（分享多份但网盘公司只存储一份，可以极大的消耗用户网盘空间），做出了很多的功能，比如可以通过密码、或者公开链接分享用户自己的网盘资源。很多网站都依赖各大网盘这些功能来做资源分享，依赖网盘的公开、私密分享养活了不少小公司，比如资源分享类的网站、工具网站、电影分享网站等。


    +   为了更大的鼓励用户传播分享资源，各大网盘公司开放了两大功能：

    1. 开放用户的公开分享链接，通过网盘的公开 API 可以检索网盘内的相关资源；

    2. 允许用户直接创建讨论组，在讨论组内可以共享资源，讨论组可以生成一个唯一链接，方便邀请好友加入。


    就是这两大功能激活了网盘的生态圈，成就了一大批依赖两个接口成立的网站，但大多数网站都是昙花一现，没过多久就倒闭没有人气了。绝大部分的网站都是仅仅依赖上面的第一个功能做了网盘的搜索，真正利用第二个功能做相关开发的极少，但有一个程序员看到了第二个产品功能蕴含的巨大机会。


    这个网站就是：网盘 007 https://wangpan007.com/。


    我们先通过 alexa 中国来看一下这个网站的排名。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_13_0.png)


    全球排名 10519，中国排名 1039 名，排名非常靠前，网站的服务器和域名都在美国，可能是为了规避风险，在国内这类网站其实是游走在灰色地带。


    再来看看这个网站的流量情况。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_14_0.png)


    日均大概有 16 万的用户访问此网站，百分之 99 的访问量都来自国内。虽然这个网站现在的流量非常可观，但它其实也是从一个很小的网站发展起来，网站是用 Java
    语言开发，在过去访问量大的时候经常会看到页面报 c3p0 错误，或者是连接池耗尽的错误。就这么一个经常报错、产品粗糙的网站，因为解决了具体产品的痛点，从而吸引了大量的流量，赚取了大量的会员费用。


    我们可以用网站 http://web.archive.org/ 来查看这个网站的发展历史。


    时间回到 2015 年一月，我们发现整个网站就一个搜索功能，也就是和绝大部分网盘搜索功能一样，利用了上面提供的第一个功能。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_14_1.png)


    如果做这个网站的程序员和其它网站一样发展，估计也没什么太多的故事。


    时间又过了一年多，来到了 2016 年的 3 月，我们可以看到网站添加了很多新的功能。网站的首页添加了菜单栏，左边有分享群和分享达人，说明网站已经添加了上面说的第二个功能；右边菜单有注册、登陆说明网站已经建立起来了自己的用户系统。首页的中间位置将分享的资源进行了分类，方便用户快速找到热门资源。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_15_0.png)


    在这些新增的功能中有三个功能非常重要，几乎是奠基了网站后期的发展。第一，创建了用户体系，没有用户体系，后期用户分享、付费就无从谈起，这是商业化的基础功能；第二，增加了用户分享，通过菜单的分享达人可以猜测，网站可以让用户自己去添加网盘的分享内容，可能会有积分类似的激励措施；第三，分享群，这就是我们上面说的第二个功能，就是这个功能彻底将引爆这个网站。


    为什么说分享群是引爆这个网站的功能点呢，那个时候网盘大战正酣畅淋漓，几乎所有爱玩网盘的用户都屯了超大量的空间。作为一名资深网友总喜欢去收集各种资料将自己的网盘填满，一个个去分享的话效率真的很低，如果将相同爱好的朋友拉到一个讨论组里面，批量去分享资料批量去保存资料效率将变得非常高。但是有些资源是不方便去和朋友分享的，比如小视频、各种电影等，这是当时大家普遍存在的一个痛点。


    于是这个网站就添加了一个群功能，分享群。那时候百度网盘可以生产群的邀请链接，用户只要点击特定的链接就可以加入到对应的群中，功能推出来之后就大受欢迎，我的网盘空间有大半都是因为这个填满的。在大家热火朝天的使用这个功能时，网站也及时的推出了会员功能，会员创建的群链接优先展示，创建数量不限制等，普通用户只能分享几个。于是会员数量急剧上升，网站频频因为访问量太大而宕机，因为没有数据无法评估网站的盈利情况，但从当时的访问量来看应该是非常可观。


    时间又来到了 2016 年的 10 月，我们发现这个网站多了一个功能，微信关注，引导用户关注网站的公众号。我分析了一下这个公众号，公众号头条阅读量在 1 万左右，现在仅仅这个公众号一个月保守估计收入可达
    5 万元左右。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_16_0.png)


    于是到了 2017 年的 6 月，网站微信关注变成了三个微信公众号，后来为了集中管理又合并了一个。同时发现菜单将最高频使用的电视剧和动漫拉了出来。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_16_1.png)


    还有一个重点，我们发现网站的分享群功能去掉了，这是为什么呢？我觉得可能是因为政策的原因，毕竟这个功能太火爆了，以后可以随意观看各种片，甚至可以说是一个小黄网都不为过，当然里面也有分享各种资料、电影资源等，但小视频引发的付费冲动应该是最高的。


    我们来看看网盘 007 网站现在的样子。


    这是首页：


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_17_0.png)


    这是详情页：


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_17_1.png)


    我们发现网站的每个页面几乎都添加了广告，并且是赌博、直播、游戏类的广告，大家可能不知道这类广告在所有的在线广告中收费是最贵的，在配合网站现在这么大的流量，收入应该非常可观。


    总结一下网盘007的盈利方式：


    +   1. 网站会员制（现在已经取消）

    2. 微信公众号

    3. 在线广告


    除过会员收费只在特定时期运行了一年多关闭外，其它两个，月收入预估可以到达 10 万左右。


    这是一个依靠巨头产品发展的痛点，开发相关解决方案的典型案例。所以说如果有敏锐的洞察力和超强的动手能力，在特定时期仅仅依赖一个痛点即可实现财富自由。


