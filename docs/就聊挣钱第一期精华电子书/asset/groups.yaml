    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_42_0.png)\n\n刷单行业发展到现在已经成为了一条产业链，有专业的销售、有专业提供中间交易的网站、还有专业提供技术支持的黑客们，每个环节分工不一样，利润也不一样，整体来讲，黑客技术方和营销人员收入最高，中间环节单价较低，但中间环节会通过大量订单来支持利润。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_42_1.png)\n\n刷单行业也是一个斗志斗勇的行业，一个不断和官方博弈的产物，如今刷单已经发展的非常智能化和自动化，可以模拟用户去聊天、浏览商品、然后再去购买，避免被官方风控系统所监测到。\n\
    \n各行业的灰色交易都有各行业的套路，因为做公众号的原因时常可以接触到各种各样的人，其中就有很多的刷单营销人员会在后台留言介绍他们的业务，跟着他们的足迹慢慢的了解了刷公众号文章阅读量的这条产业链。\n\
    \n今天就给大家解密一下微信公众号阅读量刷单的秘密。\n\n2014 年，对于微信公众号而言，是有里程碑意义的一年。\n变化最初出现在一个名叫“骑行西藏”的公众号上。可能很多人不知道这个号，它并不是什么大号，而是前微信开放平台技术总监\
    \ tao 的个人号。\ntao 是微信公众号的开发元老及部门高管之一，当时的很多新功能都是在这个号上测试的。包括阅读数、评论、子菜单、原创标、赞赏等等。\n\
    7 月 23 日深夜，打开“骑行西藏”推送的文章，公众号名字旁边赫然出现了阅读数的显示，文末出现了点赞按钮。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_43_0.png)\n\
    \n从此，微信公众号结束了“犹抱琵琶半遮面”的混沌状态，阅读数、点赞数成为衡量文章传播效果的指标，一批大号雄起连气昂昂地冲了出来。作为第三方的新榜，也在那一年开始发布公众号排行榜单，建立起行业认可的评价体系。\n\
    \n野蛮生长的公众号江湖中，各方豪杰，秩序初现。\n\n与之配套的，是公众号变现模式的登场。7月6日，微信公众平台开始公测流量主和广告主服务，为公众号运营者提供了最直接的盈利途径。时至今日，流量主仍然是许多公众号的重要收入来源。\n\
    \n公众号的商业化进程开始加速，**写字的人最赚钱的时代，来了。**\n\n> > （以上横线内段落摘录于：六年，公众号改变命运）\n\n2016年9月27日晚，微信对获取公众号图文信息的部分接口进行升级。在这次调整之后，一些公众号的阅读量很快出现了断崖式的下滑，有的公众号文章阅读量下滑幅度甚至从“10万+”跌落到了只有数千。\n\
    \n事后，内容创业服务平台“新榜”统计发现，60%的微信大号阅读量在第二天的阅读量出现了明显的下降，而其中有124个大号的阅读量暴跌80%以上。这些公众号也在当时被盖上了“刷量”的标签，一些公众号甚至是迅速删掉了阅读量明显出现下滑的推送文章。\n\
    \n事实上，微信公众号刷点击量已经是业内公开的秘密，俨然形成了微信生态里的一个“江湖”。在淘宝上搜索“微信公众号阅读”，会发现有很多商家都在从事这类生意。有的店家交易量已经达到了数万笔。之前网上有人卧底和刷单人员沟通：\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_45_0.png)\n\n## 微信如何统计阅读量？\n\n## 微信“阅读数”是怎么算的？\n\
    \n- 一、每个微信 ID 每天可以贡献 5 个阅读数，但只有 1 个赞。连续 5 次打开文章，也没问题，阅读数会增加，再多就不算了。过晚上 12 点后，打开文章又可以增加\
    \ 5 个阅读数。\n- 二、只要 TA 在微信中打开即算数。\n- 三、Web 版或 Mac 版微信打开的文章会跳转到 PC 浏览器，也不算数。微信文章在\
    \ PC 浏览器中是不显示阅读数的，也不显示“赞”数，手机浏览器同理。\n- 四、贡献“阅读数”不需要关注公众号，聊天或朋友圈打开的文章均算数。只要在微信手机客户端里即可。\n\
    - 五、“阅读数”是实时的，不是（截止到）前一天的累计数据。在公开数据之前，公众号运营者可以在后台看到前一天的累计“阅读数”。\n\n## 微信阅读量是如何刷出来的？\n\
    \n## 人工刷阅读量\n\n微信群互刷是成本最低，但相对而言见效慢的一种刷公众号阅读的方式，通过在微信群内发布文章的二维码以及链接，让群友给你扫码阅读提高阅读量。有的微信公众号的博主，甚至几百个微信群，利用\
    \ Webtools 等工具可以实现一键群发，来提升文章的阅读量。\n\n也有的人通过在 QQ 群内发布文章的二维码以及链接，让群友给你扫码阅读提高阅读量。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_46_0.png)\n\n## 软件刷阅读量\n\n软件刷是大家都希望的一种方式，在操作上省力，另外价格相对平台而言更加便宜，而且刷的速度也是比较快的，大多数平台刷微信阅读都是用软件刷出来的。\n\
    \n市面上这种刷单的软件都是收费的，大家不用心存侥幸去网上寻找，基本上你能找到的免费的刷单工具不是木马就是广告。\n\n淘宝上搜索“微信阅读”基本上都是可以提供刷单的商家，并且每天刷单的价格不一，有的一千阅读二十几元、有的高达四十几元不等；刷单的速度也有快又慢，刷快的订单价格贵一些。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_47_0.png)\n\n当你点击钉钉和这些人沟通好价格之后，通过淘宝或者微信转账的形式购买成功，然后给出你需要刷阅读量的文章链接，过一会文章阅读量就会飞速的上涨到达你的预期。\n\
    \n和我们沟通的这些销售只是刷单行业的最前端，后面还有刷单的平台在对接。曾经有一个粉丝在我后台留言可以通过他们系统进行刷单，我跟着地址进入系统发现完全已经形成了自动化的流程，只需要在系统中注册、充值后即可点击对应的功能完成刷阅读量、点赞量、增加粉丝等功能。\n\
    \n## [就聊挣钱] 第一期精华电子书\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_48_0.png)\n\n\
    真正的平台方可能就是通过技术手段模拟出成千上万个用户，当需要刷阅读量的时候，就在模拟器上模拟用户去点击对应的文章达到刷阅读量的目的。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_48_1.png)\n\
    \n这样至少存在这样一个刷单链条：\n\n- 1、提供模拟器技术的厂商\n- 2、过技术手段去批量注册用户、模拟用户的正常操作、阅读文章\n- 3、开发系统的平台，撮合刷单营销人员和技术提供方对接\n\
    - 4、在淘宝或者微信后台留言的营销人员，寻找潜在客户\n- 5、公众号博主通过营销人员去刷单、交钱。\n\n这就是微信刷单的秘密，从刷 1000 阅读量\
    \ 30 元来计算的话，刷一个 10 万+阅读量可以赚取 3000 元，如果每天可以对接 100 个客户，就可以日赚 30 万（需要和上下游去分配），绝对是暴利。\n\
    \n如果现在掌握刷微信公众号刷单的技术，只要运用得当月入百万轻而易举，当然高利润也就意味着高风险，在中国这个环境下刷单是一个灰色的产业带，如果被平台举报可能面临着行政处罚甚至诉讼。\n\
    \n微信公众号刷单仅仅是灰产中的冰山一角，整个地下产业有多庞大可想而知。\n\n当然如果你觉得刷单是灰产有一定的风险，作为一个特别正直的程序员你只想通过技术来赚钱，但不想冒一点风险。其实还有一条阳关大道可以走，就是走在灰产的对立面，通过技术手段帮助人们来识别刷单，分析公众号粉丝质量、活跃度等信息。\n\
    \n其中已经有几家做的很不错，西瓜数据。大家可以看看西瓜数据的简介：\n\n> “西瓜数据”主要提供全网优质公众号查询、监控及诊断等数据服务，以及提供多维度的公众号榜单排名、公众号对比等实用功能，是一款公众号运营及广告投放效果监控的专业工具，此外，”西瓜数据“拥有成熟的，公众号数据已经覆盖全国\
    \ 333 个地级市，因此也是公众号大数据服务商。\n\n”西瓜数据”产品是由福州西瓜文化传播有限公司开发，公司团队由来自腾讯、百度等国内一流公司的高级人才组成，公司在数据挖掘、自然语言处理技术领域领域具有丰富的经验沉淀。\n\
    \n重点内容：公司团队由来自腾讯、百度等国内一流公司，我就呵呵了。。。\n\n西瓜数据主要功能可以分析公众号质量，阅读量监控、一键获悉公众号数据等功能。大家也可以根据登录后，左侧菜单看到所有的功能点。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_49_0.png)\n\n大家看看西瓜数据的收费情况，产品的主要受众是\
    \ 2000 多万的公众号运营者和众多的广告主。网站在中国排名 3312 位，太能挣钱啦。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_50_0.png)\n\
    \n最近又兴起一个新的监控阅读量的平台，打假啦（http://www.dajiala.com/）。专业分析各个公众号的阅读数据来判断公众号是否刷单、造假。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_50_1.png)\n\n网站不完善，有的页面还会报错，目前盈利情况不明。但如果把这个领域持续做到最强，后续的盈利情况是很明朗的。\n\
    \n今天的分享就到这里，其实只要掌握了核心技术，不管是灰道还是阳关大道挣钱都是没有问题的，要相信：技术可以挣钱！\n\n## 技术社区的盈利之道\n\n我们经常会看到一些人创建了各种技术社区，我身边认识的一些人就有很多在搞这些，比如：中生代社区，Spring\
    \ Cloud 社区，Python 中文社区，linux 中国、运维帮等等太多了。当然了技术社区当然是越多越好，对我们程序员来讲可以通过不同的维度，了解到对应技术。\n\
    \n作为一个旁观者，我一直好奇这些技术社区都是如何来盈利的？这些年我在北京大大小小参加了不少十次以上的各种技术大会，发现一个有趣的事情，几乎所有的技术大会都有赞助商，那么赞助费肯定是社区举办技术大会的盈利方式之一。\n\
    \n另外上台演讲的嘉宾大部分都要吹嘘一下自己公司的产品和技术方案，就连 GMIC 这种级别的技术峰会也是广告味道满满，搞的我后来几乎没有太多的兴趣去参加类似的峰会，我在想这些被请来的演讲嘉宾，他们是付费演讲呢？还是组织者付费邀请呢？\n\
    \n总结一下大部分技术社区的盈利方式大概如下：\n\n- 1. 社区网站有一定流量，通过在线广告获取一定的收入。\n- 2. 组织各类技术峰会，有的峰会需要付费参与，免费的技术峰会由赞助商来买单。\n\
    - 3. 广告商去峰会演讲宣传自己家里的产品（付费）\n\n上面这些盈利方式都是社区的一般手段，另外有一些社区玩出了新玩意。\n\nDocker 技术在 2013\
    \ 推出，2014 年以后在国内发展越来越好，我们可以通过百度指数可以发现 Docker 的搜索热度一直慢慢走高，说明它的普及程度越来越好。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_51_0.png)\n\
    \n从 2014 年 Docker 在中国慢慢推广之后，有一个人持续看好未来 Docker 的发展，于是创建了一个容器化方向的技术社区，命名为 Docker\
    \ one。从 Docker \n开始发展最好延伸到容器化技术生态领域，网站内容主要关注：docker、kubernetes、coreos、etcd、微服务、devops\
    \ 等。\n\n下面为网站的首页：\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_52_0.png)\n\n从首页的条幅广告就可以看出一些端倪出来，Kubernetes\
    \ 应用实战培训，培训这两个关键字其实才是这个技术社区的盈利之道。\n\n具体是怎么操作呢？创建容器技术社区 Docker One，同时创建技术社区对应的公众号：Docker。\n\
    \n- 1. 技术社区和网站吸引大量领域内的开发者关注\n- 2. 定期邀请各领域的技术大拿做技术分享，在网站和公众号内对分享做出预告\n- 3. 想听相关技术分享的同学，需要关注公众号并且添加个人微信，邀请人会在群内分享，由助手同步到其它群。\n\
    - 4. 通过以上三步不断的积累领域内的用户。\n- 5. 定期组织线下的技术培训，培训费用的价格在 6000-15000 多。\n- 6. 培训的讲师来自于社区内的技术大拿，社区通过培训来盈利。\n\
    \n网站和需要分享的讲师确定好分享的主题和内容之后，就会在公众号内和各大技术社区内分享类似如下的预告内容：\n\n——————————————\n分享时间：8\
    \ 月 21 日 20:30\n分享主题：有货在 Kubernetes 容器环境的 CD 实践\n分享人介绍：xxx，有 x 质量保障工程师。2016 年加入有货主导质量体系平台的构建以及线下线上容器环境的部署与监控，目前专注于微服务与容器技术的\
    \ DevOps 在项目组的落地。\n\n**分享摘要：**业内容大云服务商以及公司逐渐选择 Kubernetes 与 Docker 作为微服务支撑的首选平台。为了更好满足\
    \ DevOps，我们采用了开源框架 Spinnaker 作为持续交付平台，完成服务的快速部署，回滚，A/B 测试，以及金丝雀等等的部署方式，同时我们在生产做了多区的容灾，更好的保障线上服务。\n\
    \n主要内容：\n\n- - Spinnaker 介绍与安装踩过的坑\n- - Spinnaker 在 Kubernetes 的持续部署\n- - 线上容器服务的选择与多区容灾\n\
    \n**分享群：**DockOne 技术交流微信群\n\nDockOne 每周都会组织定向的技术分享，欢迎感兴趣的同学加微信：`lixxxesd`，或者扫描下方二维码加群主微信，进群参与分享，进群暗号「加群」。如果已经在\
    \ DockOne 技术交流群那等待晚上的分享即可。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_53_0.png)\n\
    \n这些分享都是免费的，不管是讲师还是参与收听的业内朋友。讲师为什么愿意来分享呢，就拿我来讲吧，当时去这里做分享的原因是想和大家交流一下微服务的使用经验，以及随便宣传一下我自己（个人影响力）；对于业务的朋友，这是场免费的分享，并且质量都还不错，只是需要关注一下社区工会，在添加一个个微信号即可，如果你真的对某个分享内容比较感兴趣，我想你也不会在乎这些步骤。\n\
    \n社区有几十个微信群（现在可能更多），覆盖几万领域内的技术人，每次分享之前需要群内成员签到，增加群友的参与感。主持人在开始之前会在群里做预告，大家开始签到，最后嘉宾分享。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_54_0.png)\n\n我和这个社区合作过几次，在它们技术社区做个一次在线的技术分享，也就是在微信群中，帮它们推广过一次培训广告（付费），曾经邀请过我作为它们的培训讲师，因为时间关系当时没有参加。\n\
    \n这个社区讲师分享的内容质量有保证，创始人会进行把关，慢慢的随着容器化技术的发展，社区慢慢变得壮大，后期利润可观。曾经听一个朋友讲，此社区通过线下培训每月至少盈利\
    \ 10 万+，不过这个金额没有经过证实。\n\n## 智能眼镜的中国之路\n\n首先给大家科普一下什么是智能眼镜？\n\n智能眼镜是指如同智能手机一样拥有独立的操作系统，可以通过软件安装来实现各种功能的可穿戴的眼镜设备统称。它是最近几年被提出而且是最被看好的可穿戴智能设备之一。其具有使用简便，体积较小等，特点公众普遍认为智能眼镜的出现将会方便人们的生活，因此它得到了谷歌，微软等重点研发，被视为未来智能科技产品的重要增长点。\n\
    \n智能眼镜大家可能最为熟悉的产品就是 谷歌眼镜：\n\n谷歌眼镜（Google Project Glass）是由谷歌公司于 2012 年 4 月发布的一款“拓展现实”眼镜，它具有和智能手机一样的功能，可以通过声言控制拍照、视频通话和辨明方向，以及上网冲浪、处理文字信息和电子邮件等。Google\
    \ Project Glass 主要结构包括，在眼镜前方悬置的一台摄像头和一个位于镜框右侧的宽条状的电脑处理器装置，配备的摄像头像素为 500 万，可拍摄\
    \ 720p 视频。2015 年 1 月 19 日，谷歌停止了谷歌眼镜的“探索者”项目。\n\n类似下图的一个产品：\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_55_0.png)\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_55_1.png)\n\n因为各种原因谷歌的这款产品失败了，失败的网上归类为以下原因：\n\
    \n- 1、耗电量大及发热严重。开机一个多小时，电量耗完百分之八十以上，戴上一段时间之后能够感受到发烫严重，这是工业界要解决的问题，也是短板。\n- 2、没有让人惊艳的功能。大部分功能手机都能够做到，题主想骑行时拍摄这个应用场景，我觉得，手机都能够满足的为什么还要用眼镜来呢\n\
    - 3、智能眼镜的生态链还没搭建起来。\n\n还有斜眼的问题，像下面这个图片：\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_56_0.png)\n\
    \n哈哈哈，是不是很毁三观。\n\n谷歌眼镜虽然失败了，但是整个智能眼镜的领域却有了大的发展，智能眼镜针朝着细分垂直行业的创新正在快速的发展着。另外垂直领域的智能眼镜发展前景也被看好，智能眼镜可能性在于，工业界解决了耗电和发热的问题，以及与\
    \ AR，VR 等技术结合产生的创新点。\n\n如果未来智能眼镜通过技术创新，能够实现智能眼镜和 AR，VR 等技术相结合，这样会对游戏、影视、其它影像行业带来惊人的变革，引领下一个科技亮点。\n\
    \n其实现在行业中也有很多智能眼镜的使用案例：\n\n暴风魔镜，是暴风影音正式发布的一款硬件产品，是一款 VR 头显（虚拟现实头戴式显示设备），在使用时需要配合暴风影音开发的专属魔镜应用，在手机上实现\
    \ IMAX 效果，普通的电影即可实现影院观影效果。主要功能是可以在家里看 3D 或者 VR 电影、相关游戏等。售价：159 元，如下图：\n"
  mdcn: "\n灰产赚钱吗？结论是：真的很赚钱，可以说灰产就是通过技术变现的深切实践，灰产技术含量很高。\n\n现在媒介投放广告都会以阅读量为基准，来预测广告投放的效果，因为阅读（交易）量就成为了广告投放定价的最关键因素。凡是因阅读（交易）量投放广告的地方，必定就会有刷单的存在，很典型的刷单场景有：YouTube\
    \ 观看量、淘宝交易量、直播、抖音观看量、点赞量、微信阅读量等等。\n\n曾经有朋友开淘宝店，为了营造销量，过一段时间让我去买几件性感内衣，然后他那边不发货，过两天让我在上面给个好评，最关键的是当时我还没有女朋友。。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_41_0.png)\n\n这就是传说中人工刷单，其实还有人工打码（验证码）、人工答题（验证码算法）等等，凡事系统给出的校验方式，都有对应的解决方案。\n\
    \n可以说刷单行业是个巨大的市场，每年因为刷单产生的交易额惊人。甚至有的广告商也喜欢和刷单的公司合作，因为广告投放之后数据很漂亮，这类情况更多常见于品牌曝光的这类广告。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_42_0.png)\n\n刷单行业发展到现在已经成为了一条产业链，有专业的销售、有专业提供中间交易的网站、还有专业提供技术支持的黑客们，每个环节分工不一样，利润也不一样，整体来讲，黑客技术方和营销人员收入最高，中间环节单价较低，但中间环节会通过大量订单来支持利润。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_42_1.png)\n\n刷单行业也是一个斗志斗勇的行业，一个不断和官方博弈的产物，如今刷单已经发展的非常智能化和自动化，可以模拟用户去聊天、浏览商品、然后再去购买，避免被官方风控系统所监测到。\n\
    \n各行业的灰色交易都有各行业的套路，因为做公众号的原因时常可以接触到各种各样的人，其中就有很多的刷单营销人员会在后台留言介绍他们的业务，跟着他们的足迹慢慢的了解了刷公众号文章阅读量的这条产业链。\n\
    \n今天就给大家解密一下微信公众号阅读量刷单的秘密。\n\n2014 年，对于微信公众号而言，是有里程碑意义的一年。\n变化最初出现在一个名叫“骑行西藏”的公众号上。可能很多人不知道这个号，它并不是什么大号，而是前微信开放平台技术总监\
    \ tao 的个人号。\ntao 是微信公众号的开发元老及部门高管之一，当时的很多新功能都是在这个号上测试的。包括阅读数、评论、子菜单、原创标、赞赏等等。\n\
    7 月 23 日深夜，打开“骑行西藏”推送的文章，公众号名字旁边赫然出现了阅读数的显示，文末出现了点赞按钮。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_43_0.png)\n\
    \n从此，微信公众号结束了“犹抱琵琶半遮面”的混沌状态，阅读数、点赞数成为衡量文章传播效果的指标，一批大号雄起连气昂昂地冲了出来。作为第三方的新榜，也在那一年开始发布公众号排行榜单，建立起行业认可的评价体系。\n\
    \n野蛮生长的公众号江湖中，各方豪杰，秩序初现。\n\n与之配套的，是公众号变现模式的登场。7月6日，微信公众平台开始公测流量主和广告主服务，为公众号运营者提供了最直接的盈利途径。时至今日，流量主仍然是许多公众号的重要收入来源。\n\
    \n公众号的商业化进程开始加速，**写字的人最赚钱的时代，来了。**\n\n> > （以上横线内段落摘录于：六年，公众号改变命运）\n\n2016年9月27日晚，微信对获取公众号图文信息的部分接口进行升级。在这次调整之后，一些公众号的阅读量很快出现了断崖式的下滑，有的公众号文章阅读量下滑幅度甚至从“10万+”跌落到了只有数千。\n\
    \n事后，内容创业服务平台“新榜”统计发现，60%的微信大号阅读量在第二天的阅读量出现了明显的下降，而其中有124个大号的阅读量暴跌80%以上。这些公众号也在当时被盖上了“刷量”的标签，一些公众号甚至是迅速删掉了阅读量明显出现下滑的推送文章。\n\
    \n事实上，微信公众号刷点击量已经是业内公开的秘密，俨然形成了微信生态里的一个“江湖”。在淘宝上搜索“微信公众号阅读”，会发现有很多商家都在从事这类生意。有的店家交易量已经达到了数万笔。之前网上有人卧底和刷单人员沟通：\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_45_0.png)\n\n## 微信如何统计阅读量？\n\n## 微信“阅读数”是怎么算的？\n\
    \n- 一、每个微信 ID 每天可以贡献 5 个阅读数，但只有 1 个赞。连续 5 次打开文章，也没问题，阅读数会增加，再多就不算了。过晚上 12 点后，打开文章又可以增加\
    \ 5 个阅读数。\n- 二、只要 TA 在微信中打开即算数。\n- 三、Web 版或 Mac 版微信打开的文章会跳转到 PC 浏览器，也不算数。微信文章在\
    \ PC 浏览器中是不显示阅读数的，也不显示“赞”数，手机浏览器同理。\n- 四、贡献“阅读数”不需要关注公众号，聊天或朋友圈打开的文章均算数。只要在微信手机客户端里即可。\n\
    - 五、“阅读数”是实时的，不是（截止到）前一天的累计数据。在公开数据之前，公众号运营者可以在后台看到前一天的累计“阅读数”。\n\n## 微信阅读量是如何刷出来的？\n\
    \n## 人工刷阅读量\n\n微信群互刷是成本最低，但相对而言见效慢的一种刷公众号阅读的方式，通过在微信群内发布文章的二维码以及链接，让群友给你扫码阅读提高阅读量。有的微信公众号的博主，甚至几百个微信群，利用\
    \ Webtools 等工具可以实现一键群发，来提升文章的阅读量。\n\n也有的人通过在 QQ 群内发布文章的二维码以及链接，让群友给你扫码阅读提高阅读量。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_46_0.png)\n\n## 软件刷阅读量\n\n软件刷是大家都希望的一种方式，在操作上省力，另外价格相对平台而言更加便宜，而且刷的速度也是比较快的，大多数平台刷微信阅读都是用软件刷出来的。\n\
    \n市面上这种刷单的软件都是收费的，大家不用心存侥幸去网上寻找，基本上你能找到的免费的刷单工具不是木马就是广告。\n\n淘宝上搜索“微信阅读”基本上都是可以提供刷单的商家，并且每天刷单的价格不一，有的一千阅读二十几元、有的高达四十几元不等；刷单的速度也有快又慢，刷快的订单价格贵一些。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_47_0.png)\n\n当你点击钉钉和这些人沟通好价格之后，通过淘宝或者微信转账的形式购买成功，然后给出你需要刷阅读量的文章链接，过一会文章阅读量就会飞速的上涨到达你的预期。\n\
    \n和我们沟通的这些销售只是刷单行业的最前端，后面还有刷单的平台在对接。曾经有一个粉丝在我后台留言可以通过他们系统进行刷单，我跟着地址进入系统发现完全已经形成了自动化的流程，只需要在系统中注册、充值后即可点击对应的功能完成刷阅读量、点赞量、增加粉丝等功能。\n\
    \n## [就聊挣钱] 第一期精华电子书\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_48_0.png)\n\n\
    真正的平台方可能就是通过技术手段模拟出成千上万个用户，当需要刷阅读量的时候，就在模拟器上模拟用户去点击对应的文章达到刷阅读量的目的。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_48_1.png)\n\
    \n这样至少存在这样一个刷单链条：\n\n- 1、提供模拟器技术的厂商\n- 2、过技术手段去批量注册用户、模拟用户的正常操作、阅读文章\n- 3、开发系统的平台，撮合刷单营销人员和技术提供方对接\n\
    - 4、在淘宝或者微信后台留言的营销人员，寻找潜在客户\n- 5、公众号博主通过营销人员去刷单、交钱。\n\n这就是微信刷单的秘密，从刷 1000 阅读量\
    \ 30 元来计算的话，刷一个 10 万+阅读量可以赚取 3000 元，如果每天可以对接 100 个客户，就可以日赚 30 万（需要和上下游去分配），绝对是暴利。\n\
    \n如果现在掌握刷微信公众号刷单的技术，只要运用得当月入百万轻而易举，当然高利润也就意味着高风险，在中国这个环境下刷单是一个灰色的产业带，如果被平台举报可能面临着行政处罚甚至诉讼。\n\
    \n微信公众号刷单仅仅是灰产中的冰山一角，整个地下产业有多庞大可想而知。\n\n当然如果你觉得刷单是灰产有一定的风险，作为一个特别正直的程序员你只想通过技术来赚钱，但不想冒一点风险。其实还有一条阳关大道可以走，就是走在灰产的对立面，通过技术手段帮助人们来识别刷单，分析公众号粉丝质量、活跃度等信息。\n\
    \n其中已经有几家做的很不错，西瓜数据。大家可以看看西瓜数据的简介：\n\n> “西瓜数据”主要提供全网优质公众号查询、监控及诊断等数据服务，以及提供多维度的公众号榜单排名、公众号对比等实用功能，是一款公众号运营及广告投放效果监控的专业工具，此外，”西瓜数据“拥有成熟的，公众号数据已经覆盖全国\
    \ 333 个地级市，因此也是公众号大数据服务商。\n\n”西瓜数据”产品是由福州西瓜文化传播有限公司开发，公司团队由来自腾讯、百度等国内一流公司的高级人才组成，公司在数据挖掘、自然语言处理技术领域领域具有丰富的经验沉淀。\n\
    \n重点内容：公司团队由来自腾讯、百度等国内一流公司，我就呵呵了。。。\n\n西瓜数据主要功能可以分析公众号质量，阅读量监控、一键获悉公众号数据等功能。大家也可以根据登录后，左侧菜单看到所有的功能点。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_49_0.png)\n\n大家看看西瓜数据的收费情况，产品的主要受众是\
    \ 2000 多万的公众号运营者和众多的广告主。网站在中国排名 3312 位，太能挣钱啦。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_50_0.png)\n\
    \n最近又兴起一个新的监控阅读量的平台，打假啦（http://www.dajiala.com/）。专业分析各个公众号的阅读数据来判断公众号是否刷单、造假。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_50_1.png)\n\n网站不完善，有的页面还会报错，目前盈利情况不明。但如果把这个领域持续做到最强，后续的盈利情况是很明朗的。\n\
    \n今天的分享就到这里，其实只要掌握了核心技术，不管是灰道还是阳关大道挣钱都是没有问题的，要相信：技术可以挣钱！\n\n## 技术社区的盈利之道\n\n我们经常会看到一些人创建了各种技术社区，我身边认识的一些人就有很多在搞这些，比如：中生代社区，Spring\
    \ Cloud 社区，Python 中文社区，linux 中国、运维帮等等太多了。当然了技术社区当然是越多越好，对我们程序员来讲可以通过不同的维度，了解到对应技术。\n\
    \n作为一个旁观者，我一直好奇这些技术社区都是如何来盈利的？这些年我在北京大大小小参加了不少十次以上的各种技术大会，发现一个有趣的事情，几乎所有的技术大会都有赞助商，那么赞助费肯定是社区举办技术大会的盈利方式之一。\n\
    \n另外上台演讲的嘉宾大部分都要吹嘘一下自己公司的产品和技术方案，就连 GMIC 这种级别的技术峰会也是广告味道满满，搞的我后来几乎没有太多的兴趣去参加类似的峰会，我在想这些被请来的演讲嘉宾，他们是付费演讲呢？还是组织者付费邀请呢？\n\
    \n总结一下大部分技术社区的盈利方式大概如下：\n\n- 1. 社区网站有一定流量，通过在线广告获取一定的收入。\n- 2. 组织各类技术峰会，有的峰会需要付费参与，免费的技术峰会由赞助商来买单。\n\
    - 3. 广告商去峰会演讲宣传自己家里的产品（付费）\n\n上面这些盈利方式都是社区的一般手段，另外有一些社区玩出了新玩意。\n\nDocker 技术在 2013\
    \ 推出，2014 年以后在国内发展越来越好，我们可以通过百度指数可以发现 Docker 的搜索热度一直慢慢走高，说明它的普及程度越来越好。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_51_0.png)\n\
    \n从 2014 年 Docker 在中国慢慢推广之后，有一个人持续看好未来 Docker 的发展，于是创建了一个容器化方向的技术社区，命名为 Docker\
    \ one。从 Docker \n开始发展最好延伸到容器化技术生态领域，网站内容主要关注：docker、kubernetes、coreos、etcd、微服务、devops\
    \ 等。\n\n下面为网站的首页：\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_52_0.png)\n\n从首页的条幅广告就可以看出一些端倪出来，Kubernetes\
    \ 应用实战培训，培训这两个关键字其实才是这个技术社区的盈利之道。\n\n具体是怎么操作呢？创建容器技术社区 Docker One，同时创建技术社区对应的公众号：Docker。\n\
    \n- 1. 技术社区和网站吸引大量领域内的开发者关注\n- 2. 定期邀请各领域的技术大拿做技术分享，在网站和公众号内对分享做出预告\n- 3. 想听相关技术分享的同学，需要关注公众号并且添加个人微信，邀请人会在群内分享，由助手同步到其它群。\n\
    - 4. 通过以上三步不断的积累领域内的用户。\n- 5. 定期组织线下的技术培训，培训费用的价格在 6000-15000 多。\n- 6. 培训的讲师来自于社区内的技术大拿，社区通过培训来盈利。\n\
    \n网站和需要分享的讲师确定好分享的主题和内容之后，就会在公众号内和各大技术社区内分享类似如下的预告内容：\n\n——————————————\n分享时间：8\
    \ 月 21 日 20:30\n分享主题：有货在 Kubernetes 容器环境的 CD 实践\n分享人介绍：xxx，有 x 质量保障工程师。2016 年加入有货主导质量体系平台的构建以及线下线上容器环境的部署与监控，目前专注于微服务与容器技术的\
    \ DevOps 在项目组的落地。\n\n**分享摘要：**业内容大云服务商以及公司逐渐选择 Kubernetes 与 Docker 作为微服务支撑的首选平台。为了更好满足\
    \ DevOps，我们采用了开源框架 Spinnaker 作为持续交付平台，完成服务的快速部署，回滚，A/B 测试，以及金丝雀等等的部署方式，同时我们在生产做了多区的容灾，更好的保障线上服务。\n\
    \n主要内容：\n\n- - Spinnaker 介绍与安装踩过的坑\n- - Spinnaker 在 Kubernetes 的持续部署\n- - 线上容器服务的选择与多区容灾\n\
    \n**分享群：**DockOne 技术交流微信群\n\nDockOne 每周都会组织定向的技术分享，欢迎感兴趣的同学加微信：`lixxxesd`，或者扫描下方二维码加群主微信，进群参与分享，进群暗号「加群」。如果已经在\
    \ DockOne 技术交流群那等待晚上的分享即可。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_53_0.png)\n\
    \n这些分享都是免费的，不管是讲师还是参与收听的业内朋友。讲师为什么愿意来分享呢，就拿我来讲吧，当时去这里做分享的原因是想和大家交流一下微服务的使用经验，以及随便宣传一下我自己（个人影响力）；对于业务的朋友，这是场免费的分享，并且质量都还不错，只是需要关注一下社区工会，在添加一个个微信号即可，如果你真的对某个分享内容比较感兴趣，我想你也不会在乎这些步骤。\n\
    \n社区有几十个微信群（现在可能更多），覆盖几万领域内的技术人，每次分享之前需要群内成员签到，增加群友的参与感。主持人在开始之前会在群里做预告，大家开始签到，最后嘉宾分享。\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_54_0.png)\n\n我和这个社区合作过几次，在它们技术社区做个一次在线的技术分享，也就是在微信群中，帮它们推广过一次培训广告（付费），曾经邀请过我作为它们的培训讲师，因为时间关系当时没有参加。\n\
    \n这个社区讲师分享的内容质量有保证，创始人会进行把关，慢慢的随着容器化技术的发展，社区慢慢变得壮大，后期利润可观。曾经听一个朋友讲，此社区通过线下培训每月至少盈利\
    \ 10 万+，不过这个金额没有经过证实。\n\n## 智能眼镜的中国之路\n\n首先给大家科普一下什么是智能眼镜？\n\n智能眼镜是指如同智能手机一样拥有独立的操作系统，可以通过软件安装来实现各种功能的可穿戴的眼镜设备统称。它是最近几年被提出而且是最被看好的可穿戴智能设备之一。其具有使用简便，体积较小等，特点公众普遍认为智能眼镜的出现将会方便人们的生活，因此它得到了谷歌，微软等重点研发，被视为未来智能科技产品的重要增长点。\n\
    \n智能眼镜大家可能最为熟悉的产品就是 谷歌眼镜：\n\n谷歌眼镜（Google Project Glass）是由谷歌公司于 2012 年 4 月发布的一款“拓展现实”眼镜，它具有和智能手机一样的功能，可以通过声言控制拍照、视频通话和辨明方向，以及上网冲浪、处理文字信息和电子邮件等。Google\
    \ Project Glass 主要结构包括，在眼镜前方悬置的一台摄像头和一个位于镜框右侧的宽条状的电脑处理器装置，配备的摄像头像素为 500 万，可拍摄\
    \ 720p 视频。2015 年 1 月 19 日，谷歌停止了谷歌眼镜的“探索者”项目。\n\n类似下图的一个产品：\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_55_0.png)\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_55_1.png)\n\n因为各种原因谷歌的这款产品失败了，失败的网上归类为以下原因：\n\
    \n- 1、耗电量大及发热严重。开机一个多小时，电量耗完百分之八十以上，戴上一段时间之后能够感受到发烫严重，这是工业界要解决的问题，也是短板。\n- 2、没有让人惊艳的功能。大部分功能手机都能够做到，题主想骑行时拍摄这个应用场景，我觉得，手机都能够满足的为什么还要用眼镜来呢\n\
    - 3、智能眼镜的生态链还没搭建起来。\n\n还有斜眼的问题，像下面这个图片：\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_56_0.png)\n\
    \n哈哈哈，是不是很毁三观。\n\n谷歌眼镜虽然失败了，但是整个智能眼镜的领域却有了大的发展，智能眼镜针朝着细分垂直行业的创新正在快速的发展着。另外垂直领域的智能眼镜发展前景也被看好，智能眼镜可能性在于，工业界解决了耗电和发热的问题，以及与\
    \ AR，VR 等技术结合产生的创新点。\n\n如果未来智能眼镜通过技术创新，能够实现智能眼镜和 AR，VR 等技术相结合，这样会对游戏、影视、其它影像行业带来惊人的变革，引领下一个科技亮点。\n\
    \n其实现在行业中也有很多智能眼镜的使用案例：\n\n暴风魔镜，是暴风影音正式发布的一款硬件产品，是一款 VR 头显（虚拟现实头戴式显示设备），在使用时需要配合暴风影音开发的专属魔镜应用，在手机上实现\
    \ IMAX 效果，普通的电影即可实现影院观影效果。主要功能是可以在家里看 3D 或者 VR 电影、相关游戏等。售价：159 元，如下图：\n"
