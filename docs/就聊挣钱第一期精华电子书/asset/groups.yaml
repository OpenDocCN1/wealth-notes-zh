  - '[PAGE 41]


    灰产赚钱吗？结论是：真的很赚钱，可以说灰产就是通过技术变现的深切实践，灰产技术含量很高。


    现在媒介投放广告都会以阅读量为基准，来预测广告投放的效果，因为阅读（交易）量就成为了广告投放定价的最关键因素。凡是因阅读（交易）量投放广告的地方，必定就会有刷单的存在，很典型的刷单场景有：YouTube
    观看量、淘宝交易量、直播、抖音观看量、点赞量、微信阅读量等等。


    曾经有朋友开淘宝店，为了营造销量，过一段时间让我去买几件性感内衣，然后他那边不发货，过两天让我在上面给个好评，最关键的是当时我还没有女朋友。。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_41_0.png)


    这就是传说中人工刷单，其实还有人工打码（验证码）、人工答题（验证码算法）等等，凡事系统给出的校验方式，都有对应的解决方案。


    可以说刷单行业是个巨大的市场，每年因为刷单产生的交易额惊人。甚至有的广告商也喜欢和刷单的公司合作，因为广告投放之后数据很漂亮，这类情况更多常见于品牌曝光的这类广告。'
  - '[PAGE 42]


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_42_0.png)


    刷单行业发展到现在已经成为了一条产业链，有专业的销售、有专业提供中间交易的网站、还有专业提供技术支持的黑客们，每个环节分工不一样，利润也不一样，整体来讲，黑客技术方和营销人员收入最高，中间环节单价较低，但中间环节会通过大量订单来支持利润。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_42_1.png)'
  - '[PAGE 43]


    刷单行业也是一个斗志斗勇的行业，一个不断和官方博弈的产物，如今刷单已经发展的非常智能化和自动化，可以模拟用户去聊天、浏览商品、然后再去购买，避免被官方风控系统所监测到。


    各行业的灰色交易都有各行业的套路，因为做公众号的原因时常可以接触到各种各样的人，其中就有很多的刷单营销人员会在后台留言介绍他们的业务，跟着他们的足迹慢慢的了解了刷公众号文章阅读量的这条产业链。


    今天就给大家解密一下微信公众号阅读量刷单的秘密。


    2014 年，对于微信公众号而言，是有里程碑意义的一年。\n变化最初出现在一个名叫“骑行西藏”的公众号上。可能很多人不知道这个号，它并不是什么大号，而是前微信开放平台技术总监
    tao 的个人号。\ntao 是微信公众号的开发元老及部门高管之一，当时的很多新功能都是在这个号上测试的。包括阅读数、评论、子菜单、原创标、赞赏等等。\n7
    月 23 日深夜，打开“骑行西藏”推送的文章，公众号名字旁边赫然出现了阅读数的显示，文末出现了点赞按钮。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_43_0.png)


    从此，微信公众号结束了“犹抱琵琶半遮面”的混沌状态，阅读数、点赞数成为衡量文章传播效果的指标，一批大号雄起连气昂昂地冲了出来。作为第三方的新榜，也在那一年开始发布公众号排行榜单，建立起行业认可的评价体系。'
  - '[PAGE 44]


    野蛮生长的公众号江湖中，各方豪杰，秩序初现。


    与之配套的，是公众号变现模式的登场。7月6日，微信公众平台开始公测流量主和广告主服务，为公众号运营者提供了最直接的盈利途径。时至今日，流量主仍然是许多公众号的重要收入来源。


    公众号的商业化进程开始加速，**写字的人最赚钱的时代，来了。**


    > > （以上横线内段落摘录于：六年，公众号改变命运）


    2016年9月27日晚，微信对获取公众号图文信息的部分接口进行升级。在这次调整之后，一些公众号的阅读量很快出现了断崖式的下滑，有的公众号文章阅读量下滑幅度甚至从“10万+”跌落到了只有数千。


    事后，内容创业服务平台“新榜”统计发现，60%的微信大号阅读量在第二天的阅读量出现了明显的下降，而其中有124个大号的阅读量暴跌80%以上。这些公众号也在当时被盖上了“刷量”的标签，一些公众号甚至是迅速删掉了阅读量明显出现下滑的推送文章。


    事实上，微信公众号刷点击量已经是业内公开的秘密，俨然形成了微信生态里的一个“江湖”。在淘宝上搜索“微信公众号阅读”，会发现有很多商家都在从事这类生意。有的店家交易量已经达到了数万笔。之前网上有人卧底和刷单人员沟通：'
