    ## 星主日常分享


    ## 生活就是尝试更多的可能性


    我其实在创建这个知识星球的时候有过很多挣扎？原因有三：


    +   1. 作为一名技术人，大家都是低调含蓄的搞技术，我这么高调的创建一个知识星球是否合适？

    2. 作为一名上班的人，同事领导都关注了我的公众号，业余时间做这个是否合适，同事领导又怎么看我。

    3. 担心做不好怎么办，虽然自己赚了一些小钱，但毕竟才刚刚开始，大家喜欢这种形式和氛围吗？


    以上三个观点困扰过我一段时间，时间一下子就来到了 8 月 8 号晚上凌晨 2 点，我说不管咋的先干起了，如果不去尝试怎么知道结果。


    我觉得圈子里面很多同学在干一件事的时候，可能都会多多少少有这样那样的顾虑，这个世界上应该没有人不爱挣钱吧！但是真正有多少人挣到了钱？这说明了一个道理，挣钱都会，只是多少的问题？但是挣大钱的本领，估计圈子里面没几个人了吧！


    因为挣钱很难，大家如果加入知识星球之后，从来都不参与讨论，从来也不分享，只是默默的潜水，看了各种朋友的分享就能挣到钱，开阔思维了吗？答案是肯定的。所以我想说的是，加入知识星球其实只是第一步，挣钱思维认知改变是第二步，强大的落地执行能力才是关键。


    上次有人在我的公众号发了一个评论，我记得蛮清楚的：他说这个世界上谁有挣钱的想法，他自己都去执行了干嘛要告诉你。这句话听着好像挺有道理的，我也看到了很多创业者也有类似的想法，我靠！我想了一个这么好的主意，一定不要告诉别人，赶紧把它做出来，等到他做出来的时候，发现这个东西根本就没有市场，有比他思维更好的产品以及在市场上了。


    所以我想说的是，第一，请一定首先要打开你的思维，你把你的创意思路、点子分享出来，大家一起讨论帮你想办法，也许会触发你，帮助完善你的想法；第二，有可能你看到了别人的创意分享，触发到了你，完善了你现在的某个想法，只有不断的碰撞才会有火花。第三，不要害怕自己分享的观点经不起推敲或者薄弱，不要紧你至少走出了自己的第一步，其实绝大部分人都死在了第一步上。


    > > open your mind please！


    《就聊挣钱》知识星球已经开通两个月了，至少已经分享了大大五六十个创意案例或者想法，其中有几个还真的很不错，比如有一个朋友分享的检查手机号是否注册的案例，有多少朋友真正的去实践过其中的一个呢？强大的执行力是挣钱最最重要的一步，比起开阔思路更重要。


    我们可以发现很多成功的创业者都不是一次就成功的，比如王兴、任正非、还是上期分享的大姨妈柴可，可能在不断试错的过程中找到了另外一个机会呢？很多创业者本来是做这个事情的，结果在做的过程中突然发现另外一个事情火了起来，于是赶紧掉了头活了下来。掘金就是一个非常典型的例子，刚开始做专业编辑，无意中发现其中一个分享的小板块活跃的很，才有了我们现在看到的这个掘金。能一次就方向正确、成功的创业者太少了！


    > > just do it 。


    打开你的思维，尝试着去做一个小的案例，并把这个过程总结分享出来，相信你会有更多的收获！


    ## 一点小感想，共勉。


    经过我这两年多的折腾，发现不管是挣钱还是个人发展其实是有很多很多的机会，最重要和核心的一点，一定要有一个途径把自己作为产品宣传出去。


    比如在网络上写博客，发表一些自己对技术或者行业的理解，只有把自己作为品牌去曝光，才能让更多的人认识你，就比如在这个圈子里面你可以记住谁？我敢肯定必定是主动出来做分享的朋友，做出分享其实就是走出来的第一步，那怕自己不会分享，那么参与讨论，也是一种提升。不说话永远没有人认识你，哪怕是不一样的声音。


    把自己作为品牌曝光出去仅仅是第开始，就说写文章吧，现在写技术博客的人太多了，那么为什么大家要关注你和记住你呢？文章写得好？内容够搞笑？观点够独特？我觉得这些都是表象，最最重要的是要给别人一种超出预期的感觉，这样才用动力让别人继续
    follow 你。


    我们可能在工作中搜索问题，搜索出来了太多的文章，说实话 99%的可能都是垃圾，或者太水了，看了之后你会觉得，我靠这都行。在你反感的同时，有没有觉得这是一个机会呢？其实现在技术圈只要你真的认认真真去把你的每一篇文章都当作是毕业设计，领导汇报文案去写，坚持
    100 篇，绝对会让行业很多人认识到你。


    到了最后才是宣传的问题，现在做公众号的朋友多如牛毛，大家有没有仔细分析过这些公众号，凡是大点的公众号基本上都是很能写或者文章观点牛逼的人，所以宣传永远是锦上添花，文章（产品）质量才是根本。


    但不是说宣传不重要，只是不要本末倒置。有了好的文章（产品）之后，就需要多花一点时间，看看行业内顶级的同行都在做哪些宣传，不要照搬，在他的基础上理解之后，能不能形成你自己的东西，做出更好的宣传手段或者活动，我相信只要你花点时间肯定是可以的。


    稍微总结一下：


    第一步，一定要解决走出去的问题，不然你再牛逼大家都不知道有个屁用。走出去有很多种形式，写文章、出书、做演讲、公司内分享、多发言等都可以，找适合自己的方式。博客园有一个朋友专门做
    github 上精品开源项目分享就收了一大批关注。


    第二步，要做出超出大家期望的产品（文章），任何你使用的不爽的东西，可能都是一个非常好的机会，比如知识星球解决读者和公众号主深度交流的问题，比如壹瓣解决公众号编辑的问题。不要怕领域很小，在一个很小的领域其实更容易出众，比如你专门研究某一个领域内的技术，在这个领域内做到前三。


    很多东西都是一通百通，千万不要贪多，我早期写了一年的博客，没有开通公众号可能那时候如果开了也做不起了，所以有时候晚点未必是坏事，适合你的时机才是对你最重要的，对于个人来讲没有什么红利期，只有你准备好了没有。


    第三，宣传一定要温和，前两者做完之后才有第三，但不是说宣传不重要，正因为宣传太重要了，说以反过来推前两步更重要。不然宣传做好了大家过来一看这

    '
