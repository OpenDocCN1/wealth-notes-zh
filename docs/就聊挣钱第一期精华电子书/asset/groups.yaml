    ## 第三方生意大有可为


    之前发布过一个帖子，互联网的生意本质上都是流量的生意（https://t.zsxq.com/nYBMNVN），如果能及时抓住这些流量的趋势，做一些第三方的工具、服务或者产品来解决相关痛点，将是非常不错的机会。


    举几个例子，中国从 2007 年开始发展 p2p，一直到 2013 年才迎来了风口，2013 年被称为互联网金融的元年，13 年之前这个市场还没有完全爆发的时候，就有一些人看到了机会，不过大部分人都是选择创建一家互联网金融公司，只有很少的人选择以第三方的方式来入局。


    当时 p2p 是一个新鲜事物，很多人不知道该如何选择哪家互金公司，于是有人看到了痛点，选择做一个 p2p 的评级网站，将所有的互金公司按照他们的评级系统打分，进行排名，同时网站陆续上线了论坛、资讯发布、数据分析等功能。


    这其中最有名的是网贷之家和网贷天眼这两家公司，13 年的时候还见过网贷天眼的老板，刚开始是一个个人做的网站，后来互联网金融的风口来了，有投资人找上门来要求投资，才转向公司化运作，这两个网站在后来互联网金融爆发的时候挣了很多钱。


    根据这个思路，我们想一想现在哪个行业可能也会存在类似的机会？


    其实有很多，比如现在短视频行业非常火爆，如何得知哪些短视频博主更受到大家的欢迎（粉丝最多或总播放量最高），有没有整合了所有短视频播放量的排行榜，打通抖音、快手、微视的数据壁垒，创建一个短视频的交流窗口。


    短视频领域可以做的事情很多，可以针对短视频教学、视频制作工具、短视频数据分析、短视频排行榜、短视频交流论坛等，每一个领域做透都有无限商机。类似的产业都有，未来人工智能、自动驾驶&电动汽车、教育、医疗行业每一个领域都存在类似的机会，总体来说离钱最近的领域越容易变现。


    上面说的是一个整体的趋势潮流的第三方生意，其实还有另外一种，当某一个现象级产品诞生的时候也会产生无数多的机会，比如依赖微信生态的公司有拼多多、有赞、小鹅通等公司。或者只专注现象级产品的某一个点，比如微信公众号，专门针对微信公众号文章编辑就诞生了很多创业公司，比如草料、135
    编辑器、壹伴等，还有做微信公众号评级的新榜、西瓜数据等。


    上次提利用百度网盘的例子（https://t.zsxq.com/7qFLiUB），其实就是根据百度网盘产品延展出来的挣钱案例。那么现在有哪些重量级的产品可能也会有这样的机会呢？这里面还得拿抖音来举例，因为抖音确实已经成为国民、国际型大玩家的
    App 了，同时发现抖音的周边产品还没有完全的发展突出出来。


    这次过年回家的时候，带了我的 Ipad 回家，我姐家的小女孩发现了这个好玩的玩意，没几下就学会了。Ipad 里面装了抖音，小女孩玩了几天之后，我就发现她玩的抖音我就无法继续看了，全部推送的都是小动物、小玩具的视频，这说明抖音的机器学习是非常牛逼的，只用了两三天就完全将小孩的喜好搞清楚了。


    虽然现在很多人都安装了抖音，但相互看的内容却越来越不一样，我的抖音中大部分都是户外旅行和街舞的内容，我老婆的抖音里面大部分都是搞笑和电影的内容，我老爸的抖音中大部分都是农村乡俗的相关视频。


    抖音已经将三岁小孩到七八十岁的老大爷用户群全覆盖，所以说抖音可能是一个国民级的产品。并且抖音在国际上同样火爆，在东南亚、欧美等国家常常在 app 下载的前几名，所以说抖音可能是这些年来中国产品国际化做的最成功的
    App 之一。并且抖音不同于其它工具型、游戏类的 App，随着抖音出海的伴随着中国文化软实力的输出。


    那么面对这样一个现象级的产品我们有哪些点可以进行尝试呢？


    + 1、大家肯定对抖音中的歌曲印象非常深刻，那么针对这些歌曲能不能做一些有趣的东西呢？比如最热门的歌曲排行榜，提供歌曲的完整版。提供教学：如何在抖音中更好的选择歌曲，抖音选歌交流？

    + 2、中国的抖音 APP 和国外的抖音 App 是相互割裂的，很多的抖音博主寻找灵感的时候需要借鉴其它国家抖音 App 的流行内容，能不能做一个网站将不同国家的热门视频都提取出来供大家欣赏参考，当然这里面可能有政策风险。

    + 3、是否可以做一个抖音的交流社区、覆盖热门主播、热门视频、相关资讯报道等。

    + 4、...


    以上的这些机会，其实已经有人在慢慢尝试了。


    《就聊挣钱》知识星球里就有一个朋友：明白，针对知识星球做了一个第三方的网站：http://www.zsxq100.com/。


    大家都知道知识星球都是一些独立的小圈子，如果用户想知道圈子中有哪些优秀的星球是比较困难的，虽然知识星球的 app 也做了一些小推荐但远远不够，针对这个痛点他做了一个专门分享优秀知识星球的网站，介绍各个领域的知识星球。


    这样解决用户寻找星球的痛点，同时他在介绍每个知识星球的同时提供了自己的邀请码，如果有用户扫码加入就会有提成，盈利模式非常简单直接粗暴。当然现在这个网站还很简单，功能也不是很完善，但绝对是一个好的点子。


    + 抖音的周边产品，我在网上搜索了一下，目前发现了两个网站：

    1、ToobigData-https://kolranking.com/，也是个类似榜单的网站，有抖音中粉丝最多的博主排行榜，以及对应主播的详细信息。还有热门视频的榜单、经验分享、抖音资讯等，网站还比较简单，但主要的功能都有了。

    2、西飞数据-https://dsp.xiguaji.com/home/GuideAdv/，其实就是西瓜数据的一个子网站，专门针对抖音提供的数据采集、分析的服务。


    之前看过报道，有人将抖音中的热门短视频搬运到 Youtube，在 Youtube 上面播放量巨大，从而赚取了大量的广告费，也算是挣钱的方式之一吧。


    以上都是个人浅薄的见解，欢迎大家拍砖。


    ## 公众号运营盘点


    ## 我是如何将公众号从零做到十万加的


    在分享我是如何将微信公众号做到 100000+ 用户之前，先给大家分享一组数据：


    2017. 04. 25 号在朋友的鼓励下，我开通了“纯洁的微笑”公众号。

    2017. 11. 18 号用户破一万

    第一个一万用户用了 207 天。

    2018. 01. 17 号用户 20000

    第二个一万用户用了 50 天。

    2018. 06. 20 号用户 50000

    第一个 5 万用户用了 421 天。


    2018.12.28 号用户 100000

    第一个 5 万用户用了 194 天。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_76_0.png)


    从这个曲线可以明显的看出来，当公众号的用户越来越多时，它的增长速度也会越来越快，这就是所谓的越大越大，越小越难增长的一个道理。迄今为止，公众号出现过 3 次的用户负增长，全部都是因为很硬的软件广告导致，因此后面接广告变得很谨慎，现在日常净增长（去掉互推）用户
    150 左右。


    下面给大家聊聊我是如何从将公众号用户从 0 做到 100000+


    ### 第一个阶段：写博客积累第一批种子用户


    在说这个事情之前，必须要讲一讲我写博客这件事情，2016 年的时候我在一家互联网金融公司做技术负责人，那时候公司增长速度慢了下来，我慢慢有了一些时间。2014
    到 2016 年是互联网金融爆发的时候，我在的互联网金融公司发生了很多故事，用户暴增、各种活动、黑客攻击、黑客敲诈、并发抢标等等，我觉得应该讲这些精彩的故事写下来。


    大家想看这些文章，目录在这里：http://www.ityouknow.com/arch.html，主要关注 17 年以前的文章即可。


    2016-06-21 日，我在博客园发布了第一篇上首页的文章，文章意外的获得了读者的欢迎，进一步激励了我继续写下去，一系列文章相继发表而出，到了 16 年底被博客园评为推荐博客。在这个中间搭建了自己的独立博客：www.ityouknow.com，刚开始托管在
    Github Pages 上面，成本只是一个域名。


    刚开始只是在博客园写文章，同步到自己的独立博客，成为博客园的推荐博主之后，就开始有很多技术社区的运营找到我，邀请我去他们的技术社区写文章，这其中就包括 CSDN、51CTO、掘金等。就这样慢慢的在技术社区积累了一点小小的


    名气，这些都会在后期开通公众号的时候贡献力量。


    到目前为止，我的博客排在博客园推荐博客第 14，每天有 5000 左右的 pv，2000-3000 左右的用户访问；我的个人博客(www.ityouknow.com)
    每天有 2 万左右的 pv，大概 3000-5000 个不同的用户访问，成为了我日常涨粉的最大来源之一，其它社区的博客流量很小，可以暂时忽略不计。


    ### 第二个阶段：开通公众号，完成零启动。


    2017.04.25 号开通了“纯洁的微笑”公众号，其实在这之前，我已经玩了很多次公众号，最早的一个公众号 Flyer 注册于 12 年，那时候只可以推送一个消息，还没有图文，当时根本就没有意识到公众号的价值，到了后面我几乎每年都会开通一个玩，有做电影的、有做机器人的最后都死了。


    所以说，有时候早并不意味着是机遇，因为当时自己的积累没有到达那个程度，当机会来了也会轻飘飘的走过。


    开通了公众号之后，第一时间我就将公众号二维码定制到个人博客中，博客园和个人博客以及其它技术社区都是。并且在各个社区都发了一篇文章叫：我开通了微信公众号，当天只吸引了几十个读者关注，后期的每篇文章下面我都会放置公众号二维码，文章阅读量越高，公众号关注的读者就越多。


    就这样慢慢将博客中的文章同步到公众号，每周只发两篇文章，同时新写的文章首先会发布到微信公众号，让公众号读者有一个优先阅读权，当时每天的用户增长量大概就在个位数和十位数之间徘徊。


    那时候每天上班的第一件事就是登陆后台查询关注的读者个数，每天都很兴奋。


    我一直认为，做任何事情最难的其实就是开始，做公众号也是一样，在前期运营公众号的时候有几个点特别关键，用户量突破 1000、5000、10000 这几个阶段是最难渡过的。


    ### 第三个阶段：用户量突破 1000


    第一个 1000 用户最难熬，很多技术人脸皮比较薄，刚开始做公众号也不好意思找身边的朋友帮忙推荐，那么从零开始做到 1000 个用户确实比较困难，所以就出现了各种各样的套路。


    有的朋友会潜入到各种各样的微信群/QQ群中，等到群主不注意的时候分享自己的公众号二维码，或者在群里面加所有人为好友，通过之后就给你发他公众号的二维码，这样做其实是不太道德的，但也是方法之一。


    其实更佳友好的方式是分享你的文章到各个群中，引导大家去读你的文章，在文章的末尾稍微加一点引导语吸引用户关注你的公众号，比如：关注 XX 号回复 YY 送 30
    本经典计算机图书等。这样的方式会比上面的这种方式更让各方能接受一点，前提是你的文章质量还不错。


    分享文章到群，前提是群主也同意在群里分享文章，有的群是不允许的，比如我的群。很多时候不要总顾着自己增粉，可以和群主合作互换群之类的，合作共赢才是长久之计。


    我的最初 1000 个读者几乎都是来自我的博客，就这样也花费了差不多两个月的时间，这还是我写了一年博客积累了一些种子用户的前提下。所以说完全不写博客，从零开始做公众号真的很难，有时候是不得不想一些办法做一些营销手段，等公众号用户大于一万之后，这些小手段就尽量不要再用了。


    一直到了 2017-06-21 才突破了 1000 个用户，当时的日增长量到了 20 左右。


    ### 第四个阶段：用户量突破 5000


    当我的公众号用户增长超过 1000 之后，我就觉得用户增长的速度太慢了，于是我就想了一个办法，在网络上收集了很多视频和电子书资源，根据不同类型做成三个海报，普通的资源用户关注后即可领取，几个特别珍贵的资源，必须用户分享到朋友圈或者微信群才可以获取。


    有一段时间会看到带着公众号二维码资料的图片到处飞，这个营销策略用了一段时间就废弃了，因为风险太大，微信到后来对这种引导分享处罚很严重，动不动就封号了，但也借这个策略吸引了大概
    2000-3000 左右的读者。


    在 16 年做公众号的时候，还认识了一个叫做养马场的公司，他们总是需要转载我的一些文章，因此有了联系。突然有一天他们联系我说，他们准备组织一批技术公众号做互推，问我参加吗？这是我第一次参加互推，也不知道如何操作，抱着试试看的态度玩了一次，那次大概涨了几百个用户吧，从此打开了另外一扇窗。​


    在这两种策略的帮助下，2017-09-27 公众号用户突破了 5000，于是我迅速开通了公众号流量主，每天会有几块钱的收入。5000 这个点非常重要，至少你写一篇文章会有那么一点的收入，虽然不是很多，但对作者继续坚持写下去的精神激励很重要。


    当公众号用户突破 5000 后，公众号日净增长用户到了 40 左右。


    ### 第五个阶段：用户量突破 10000


    当公众号用户突破 5000 之前，我只做过一次互推，因为当时也找不到互推的渠道，认识同样做公众号的作者非常少，养马场组织了一次之后，后续也没有继续组织了，因此当时虽然还挺想继续和其它人做互推，但苦于没有渠道，不像大家今天这么便利，有很多的公众号群。

    '
