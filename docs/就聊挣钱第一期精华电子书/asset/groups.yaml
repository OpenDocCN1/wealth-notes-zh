  - '[PAGE 79]


    在这个时间段有一个事情必须要提一下，我接了人生第一个商业广告，1000fer的广告，在文章末尾贴一个他们公司的二维码，一个月发八次文章给1000元，这次合作才让我知道了做公众号还可以接广告挣钱，这是我之前完全没有想到的，这个事情极大的刺激了我继续将公众号运营的更好。


    试过了那么多的方法，增粉最好的方式其实还是互推，技术行业的朋友相互之间最具有合作精神，不像其他行业合作精神可能没有那么好。但到了现在互推却在技术行业变得泛滥起来，其实给读者带来了非常不好的体验，但目前确实也没有找到其它更好的解决方案。


    在这段时间，突然有一个朋友把我拉到了一个作者群里面，里面都是做技术公众号的作者，群主定期一个月组织大家参加一次互推，我跟着他们参加了几次，效果还不错。找到组织之后，定期组织的互推明显会加快公众号读者的增长速度。


    于是到了 2017.11.18 公众号用户关注数突破一万，日常阅读也能稳定在 1 千到 2 千之间，这时候日增长用户到了净 60 左右。


    # 第六个阶段：用户量突破 50000


    其实只要公众号的用户关注量突破了 10000 之后，就会走入一个正循环的过程，这时候你的文章阅读量就可以稳定在一千以上，在这样的情况下，就会有各种各样的广告商来找你，在金钱的刺激下，会持续激励你想办法把公众号做的更好一些。


    我的公众号在开通的一段时间内，都是一边同步博客以前的文章，一边写新的文章推送到微信公众号，读者在小于三万的时候，大部分文章都是我自己的原创，持续坚持原创的情况下，读者的质量比较高，不论是评论和点赞量都会比一般的号要好一点。


    所以其实我特别建议大家，在公众号初期，尽量先坚持原创文章，这样会很好的培养用户的忠诚度，相当于要打好基础，为后期快速增长做好准备。


    另外互推是一个双刃剑，有的朋友通过互推快速做大，成为行业内大佬，有的人朋友通过互推粉丝量也增长起来了，但是阅读量却没有跟着起来，行业内这两个例子都挺明显的，所以要保持互推的节奏，既能快速增长，也能转化成自己的用户。


    在 18 年春节前的一段时间，我给自己提了一个要求，尽量少做互推坚持做原创，也就是在用户还没有突破 3 万之前，但是很尴尬的是，放弃互推和坚持原创用户增长的速度还是降了下来，于是到了
    18 年的三月后又开始加入了互推大军中。


    同时因为公众号的广告也比较稳定了，为了显得广告不是那么多，从开始的一周两三篇文章，到了一日更的一个频度。坚持日更没多久就发现自己的写作跟不上节奏，于是就开启了转载之路。平时在地铁里面看到好的文章，或者在各大技术社'
  - '[PAGE 80]


    区看到好的内容后，都会联系作者授权转载。


    于是就开启了，一月两三次互推，一月两三次广告的频度。到了 2018.06.20 号微信公众号用户关注量突破 50000，这个时候用户的自增长就到 90 左右。


    # 第七个阶段用户量突破 10 万


    当微信公众号关注量突破 5 万之后，我上门来投放广告的广告商就越来越多，所以我当时给自己定了一约定，一个星期最多只接一个广告，到了现在稍微宽泛了一些，一个月内外部广告不能超过
    6 个。如果广告太多，就说明广告价格要的有点少，提高价格后投放的自然就少了。


    在用户量突破 5 万左右的时候，我还做了一些事情，在一些技术社区开了付费课程，在某种程度上也增加了自己的曝光率，从而最终也会转换一部分用户到公众号里面，同时因为有合作关系，我的读者也会转换到付费课程中，所以是一个双赢的过程。


    从 5 万到 10 万的过程比较平稳，期间没有太多波动。我在 2018 年初的时候定了一个小目标，希望年底的时候用户可以突破 10 万，结果到了 12 月，按照当初的增长速度刚好差一点，于是就做了一个活动，让读者帮忙宣传公众号，我来给用户发红包。


    借着这个活动，2018.12.28 号微信公众号用户量突破了 100000+。


    这就是我公众号从零增长到 10 万+用户的故事，从误打误撞来到这个领域，快两年的时间经历了很多的事情，参与到其中感觉到很神奇，也很兴奋。真的是打开了人生的另外一扇窗，我相信这个圈子里面的朋友大多数都比我小，也比我当初的起点要好一些，所以未来星球内，肯定会有朋友的成绩远远超过我。


    # 公众号如何快速涨粉？


    今天我给大家分享的内容是，公众号如何快速涨粉。主要介绍我总结的六种获客方式，其中有些方式很暴力很直接，有的方式比较柔和，有的方式绝对有效，可以根据自己公众号的定位来选择。


    微信是一个封闭的生态，因此各种搜索引擎对微信内部推广无效，获取目标用户的渠道相对较窄，如何低成本获客是公众号运营者要考虑的重要问题之一。


    # 一、通过社区获取用户：


    要想低成本的找到公众号的目标用户，就自然要想到目标用户在哪里？'
  - '[PAGE 81]


    +   1. 如果你做的是一个技术号，那么你的目标用户肯定就在各大技术社区，那么你就应该想办法在各大技术社区发文，来吸引你的用户关注，文末和左侧菜单栏是一个不错的推荐位置。


    之前写过一篇文章可以作为技术社区的参考：

    http://www.ityouknow.com/other/2018/07/02/china-ten-technical-community.html


    2. 如果你做的是一个科技号，那么就应该去找科技社区，比如：36 氪、果壳等，这些都是可以注册为作者在上面发文的。


    3. 其它行业也是类似，比如产品社区、设计社区、安全社区等等。


    4. 如果你有个人博客，个人博客必须要放一些自己公众号信息。


    5. 无意中发现 V2EX 是一个活跃度很高的社区，可以适当在这里发发声音，引导关注。


    6. 知乎是一个综合性质的社区，回答细分领域的专业问题、发布专栏文章，也可以吸引自己的目标用户。


    另外在文章末尾不要只是仅仅贴一个二维码，一两句话的介绍，突出自己公众号特点、特色，或者是引导关注后送一个比较好的资源。


    这些途径一方面最接近你的目标用户，另一方面这些社区的搜索引擎指数比较高，你的文章比较容易得到搜索引擎的支持。大家可能不了解，我在博客园有一篇文章的阅读量就高达
    90 万，这篇文章三年前发的一周内阅读量也才 2000+，这就是搜索引擎的力量。


    # 二、通过资源获取用户：


    我做公众号期间，还发现了一些野路子，真的很猛，对自己合不合适大家自己衡量；我看有的技术网站，在用户第一次访问自己的个人网站时，直接弹出一个对话框必须关注公众号，关注后才可看完整的文章之类，很暴力很直接。本质上文章内容也是资源的一种。


    还有一些资源站的套路，前两天@pyhton 在星球内也分享过，

    https://t.zsxq.com/yzvB6QR。


    这里就只简单提一下：有一些电子书或者咨询下载网站，在用户下载文件的时候都会有一个验证码，这个验证码就需要关注公众号后，回复一个关键字来获取。真的需要资源的用户，肯定就会关注对应公众号，因此收获了一大批的粉丝，而且量很大。


    有的网站做的很隐蔽，但流量很大，比如这个网站：https://sobooks.cc/，可以下载各种各样的电子书，我用 Alexa 查了网站的流量情况，中国区排名竟然高达
    2522 名，意味着每天几万的用户在网站上晃悠，想想这么大的流量，怎么都能变现，都不局限于公众号了。'
  - '[PAGE 82]


    # 三、通过功能获取用户：


    我在通过 Alexa 中国分析 https://sobooks.cc/ 网站信息的时候，发现了一个有趣的事情，如果你需要使用 Alexa 中国一些高级一点的功能，你需要关注他们对应公众号才可继续使用。这就是通过功能使用来吸引用户关注的典型案例。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_82_0.png)


    其实早期像苹果序列号查询，技术网站导航网站都是这样的示例，包括前两天 Terry 分享的视频下载网站 https://onlinedownloader.io/，如果这个网站后面的流量非常大，也特别建议做成类似的功能。通过特定功能吸引的粉丝质量比较高，并且垂直在某一个领域内，后期也方便运营。


    感觉这招对技术人最好，技术人如果动手能力强，可以做一些功能，比如：我记得星球内有一个朋友提出来一个创意，专业检测你的手机号都在哪些网站注册过，如果这个功能实现了，我觉得真的可以吸引到一批目标用户。这只是一个小案例，类似的功能、产品大家都可以去尝试。'
  - '[PAGE 83]


    市面上线下推广也是类似的思路，上次我去饭店吃饭的时候，发现饭店门口放了一个智能体重器，可以分析体重、身高等基本的身体指标，这个产品是免费使用的，但使用的前提是你关注了他们的公众号。


    现在的新榜、西瓜数据这种类似的网站做的更狠，直接把网站的登录功能都给干掉了，完全依赖微信公众号。你登录的时候直接扫描就自动登录了，第一次登录会自动关注他们官方的服务号，关注后你还不能取消，因为你下次登录的时候又会自动关注，手段很流氓很直接。


    # 四、通过互推获取用户：


    除了依赖外部的这些获客方式之外，还有几种方式是获客的主要途径：


    +   1、公众号互推，可以找一些体量比较接近的公众号相互做互推，不要太频繁，根据自己的情况控制好节奏，建议一月互推两到四次。当然最好是你的用户突破了5000以后，另外1万用户之前尽量坚持公众号发原创文章。


    公众号互推也分为很多种形式：

    1）两个人之间互推，比如找一个和你差不多的公众号，你们相互转载文章推荐，或者更直接在文中的开头相互推荐，或者相互推荐一个非常好的资料，必须到对方公众号内获取。

    2）多人之间的互推，这种场景比较常见，一般8~10左右组一个队伍，大家根据新邦的排名来排序，直接硬推这种效果最好。

    3）现在还有一种新的玩法，就是公众号互推赠书，同样也是组织几波人，但粉丝必须去公众号内回复关键字才可以抽奖中书。


    2、朋友圈微信群转发，其实看公众号的后台数据，凡是阅读量很高的文章，转发量必然非常的高，其实有时候可以稍稍在文末引导一下用户，让用户帮忙给予转发支持等。


    3、朋友圈互推，很多做公众号的朋友，微信好友都高达四五千人，找一个比较相近的朋友，一起在朋友圈内互推。


    另外互推的时候要心态开放，有的朋友总是挑三拣四的，害怕流失了自己的忠实粉丝。不开放的人不会做大的，格局小的人也不会做大，大家自己把握这个度。


    # 五、通过视频获取用户


    现在短视频、Vblog 非常的流行，抖音的一个视频可以播放量高达几百万，在 B 站某些博主达人的视频播放量也高达几十万，有的视频网站不允许博主放视频二维码，但是很多博主会通过背景
    Logo，或者是在说话的过程中植入，当播放量爆发时，这个转化量也是惊人的。'
  - '[PAGE 84]


    从目前的新媒体来看，短视频绝对是未来的一个大方向，并且制作视频还有很多优势，比如内容传播，多平台。倒流方式是在视频的结尾制作公众号的二维码引导关注，制作一个短视频可以在全平台去发，比如抖音、B站、腾讯视频、优酷视频、嵌入到微信文章中等等，只要这些视频有传播量就会带来持续的关注。


    下图是“一席”视频末尾的二维码引导，把换成公众号二维码就是很好的一种倒流方式。


    ![](img/52c388fa412d85e5cfb3502a3e1c6b94_84_0.png)


    # 六、其它方式获取用户


    +   1. 在公众号早期的时候，如果文章质量不错可以通过投稿到大号来涨粉。根据一些技术朋友在我这里投稿反馈的数据来看，一次次条转载可以给他公众号带来50人左右的涨粉，头条转载可以给他带来100人左右的涨粉；具体每个人不太一样，需要看文章的质量和内容。


    2. 换群涨粉，很多技术公众号主都有很多的技术群，或者对应的粉丝群，如果两个公众号性质比较类似，也可以相互转让群主，转让之后想办法运营将群内用户转化为自己的用户。


