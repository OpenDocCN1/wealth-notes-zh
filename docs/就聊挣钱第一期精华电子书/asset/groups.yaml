    ## 留住钱


    既然是留住钱，就不得不讲一个概念，负债，一个从我们口袋里拿走钱的概念，这种负债分两种，一种是良性负债，一种是非良性负债，为了更好的说明，我举例子说明，假如你贷款买一栋房子，采用的分期付款的方式，除了首付外，每个月交4000元贷款，不过你选择不住，将房子租出去，得到8000元租金，给你带来4000块的现金流，那么这就是良性负债，而非良性负债就是未给你带来现金流，你还不得不掏钱的负债，这种负债分为两种；


    理性消费，这类消费一般都是必须的，包括日常花销，吃饭等必须的花费。非理性消费，如果你赚的很多，但是没有多少存款，那么你的消费大部分都是在这类消费上面，这类消费也是商人最喜欢的，包括双11的购物狂欢节，这都是


    利用你的非理性行为，购买者的非理性行为这方面很复杂，如果想了解，可以去看看理查德·泰勒的《错误的行为》。我看到一个京东大数据里面的一个图片就很有意思就是说明这种消费的阶级的，图就几个字：少妇
    ＞ 儿童 ＞ 少妇 ＞ 老人 ＞ 狗 ＞ 男人。


    留住钱最主要的是一种习惯，一种你习惯的生活方式，如果你是想像爆发户那样胡乱挥霍，那么这篇文章并不适合你，现在对于我来说钱是最重要的，但是我知道以后对我而言钱是最不重要的，毕竟有钱可以做到很多事情，我喜欢自己一步一步的积累自己的资产，并且建立起自己的良好的生活方式，这样总有一天会富起来的。


    ## 行分享：程序员的理财感悟


    赚钱确实不是一件容易的事，也不是一件俗事，我很认同星主的观点；


    我对理财有所感悟，也是进入程序员行列后，因为之前的工资只可以解决温饱的问题。


    我是一个比较懒的人，可能很多人都有我一样的毛病，之前的工资几乎都是存在支付宝，最近各大银行和支付宝的活期存储利率越来越低，感觉连通货膨胀都跑不赢，如果这么一直懒下去，随着时间的推移，我们储蓄的钱贬值的速度几乎可以抵得上我们赚钱（单说工资）的速度。试想一下十年前一万元定期存到现在，它的贬值程度，那么我们现在的储蓄十年后可能贬值的更严重。不经意间，我们的存款其实一直在缩水。


    先介绍下我的理财经历，工作后，除了支付宝存钱外，也尝试过股票，初入股市，不用想，2015 年高位接盘，没有任何经验，一路亏到底，之后一直在认真观察，反思，总结。现在不敢说比之前有多强，但最起码懂得了逃命，不会之前亏的更多。


    - 基于先前存储贬值的思考和我这几年对股市的认识和当下环境的思考，分享下我现在的理财思路：


