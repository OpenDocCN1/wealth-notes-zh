    # 林先生的独白分享：程序员如何优雅的挣零花钱？


    一是私单

    最理想的单子还是直接接海外的项目，比如 freelance.com 等网站。


    一方面是因为挣的是美刀比较划算，之前看到像给 WordPress 写支付+发送注册码这种大家一个周末就能做完的项目，也可以到 200~300 美刀；另一方面是在国外接单子比较隐蔽。


    国内 shixian.com 的价格也很不错，但是我强烈建议大家不要在介绍中透露实名和真实的公司部门信息，因为这实在太高调了。


    有人说，这是我的周末时间啊，我爱怎么用就怎么用，公司还能告我怎么的？


    虽然很多公司的劳动合同里边并不禁止做兼职，但在网上如此高调的干私活，简直就是在挑衅 HR：「我工作不饱和」、「公司加班不够多」…


    再想象下你一边和产品经理说这个需求做不完，一边自己却有时间做私单的样子。你自己要是老板也不愿提这样的人的吧。


    当然，猪八戒这种站我就不多说了，不太适合专业程序员去自贬身价。


    二是 Side Project


    比起做私单，做一个 Side Project 会更划算。


    Side Project 的好处是你只需要对特定领域进行持续投入，就可以在很长时间获得收入。


    这可以让你的知识都在一棵树上分支生长，从而形成良好的知识结构，而不是变成一瓶外包万金油。


    思路有两种：


    一种是做小而美的，针对一个细分领域开发一个功能型应用，然后放到市场上去卖；'
  - '[PAGE 114]


    另一种是做大而全的基础应用（想想 WordPress），方便别人在上边直接添加代码，定制成自己想要的应用。


    有人会说，我写的 Side Project 卖不掉啊。


    项目方向的选取的确是比较有技巧的，但简单粗暴的解决方案就是找一个现在卖得非常好、但是产品和技术却不怎么样的项目，做一个只要一半价格的竞品。


    三是做咨询


    如果你在技术圈子里边小有名气，或者在某一个业务上特别精通，那么通过做咨询来挣钱是一种更轻松的方式。


    和人在咖啡厅聊几个小时，几百上千块钱就到手了。


    国内这方面的产品，我知道的有三个：


    +   - 在行在行 - 领先的知识技能共享平台：这个是果壳旗下的，做得比较早，内容是全行业的，所以上边技术向的反而不多。


    +   - 绿创派 http://q.ycpai.com/h5/lightPartner/expertList：绿创派的轻合伙栏目，主要面向创业者，适合喜欢感受创业氛围的技术专家们。


    +   - 极牛 400 The plain HTTP request was sent to HTTPS port：你可以认为这是一个程序员版本的「在行」，我浏览了下，虽然被约次数比在行要低不少，但专业性比较强，期望他们能尽快的推广开来吧。


    做咨询虽然也是实名的，但和私活是完全不同的。


    咨询的时间短，不会影响到正常的休息，更不会影响上班；而且大部分公司是鼓励技术交流的，所以大家的接受度都很高。


    除了网站、APP 外，我觉得收费群也是可以做的。


    现在交流的地方看似很多，但遇到问题后真正能快速帮你解决的地方却很少。


    比如可以搞一个技术创业群，找一些创过业的同学、正在创业的同学、做投资的同学、做法务的同学，面向想创业的同学开放，每人收个几百块的年费。


    然后你在创业过程中遇到的问题，都可以有人解答，不会觉得是孤零零的一个人。


    你问题是没遇到问题怎么办？没遇到问题不是开心死了么。


    四是写文章'
