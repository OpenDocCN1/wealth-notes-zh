    ## 工作两三年之后如何突破瓶颈


    其实工作两三年之后很容易到这个阶段，如果不努力突破的话就一直在这个阶段晃悠，我个人深有体会。


    想要突破这个阶段有两种比较主流的方式：


    - 第一，靠自己去学习。


    问题中没有提到你的开发语言，我姑且认为是 Java 程序员吧，如果以及熟练掌握了各种语法、框架的使用，到这个阶段最好多常使去学习一下底层原理，比如 Jvm、多线程开发、响应式编程等。


    通过底层原理反向在复习曾经用过的技术，慢慢的就会有一种融汇贯通的感觉，推荐多读几本书：比如深入理解 Jvm 原理，Java 并发编程，或者去看一些网上的课程，但一定要动手，刚看很难记住，比如做一些小项目，或者写成文章总结下来。


    - 第二，靠环境来逼迫自己


    有时候自己的自律达不到，最好的办法是让环境去逼迫你学习，我当初因为做了互联网金融，遇到了很多问题，自己是技术负责人，不可能靠别人，解决一个问题后就去了解它本后的原因，不断解决问题，不断学习、不断复盘，不断总结，慢慢的技术自然就提高了。


    找一些对技术要求高一点的互联网公司，特别是用户量或者并发量比较高的公司，由于公司的发展必须要使用很多比较先进的技术、开源软件、或者遇到各种各样的问题，其实就连普通的一个
    sql 查询，在海量并发的情况下要求都是不一样的。


    当然如果本地互联网公司不太好，如果可能建议去一线试试，此时不悔何时搏。


    想做好架构必须要了解底层，另外需要早一个行业沉淀下来，有了行业积累以后的职场生涯才更好走。


    ## 写在南下的火车上…


    最近看了很多成功人士，或者不成功人士的挣钱经历，我发现了一个真理，就是几乎都和我没太大关系。


    我相信大家也是这样，每次看到某某分享的挣钱经历，都很焦虑，焦虑之后好像又没有什么用，就又放下了。


    这里有两个点我想和大家一起探讨一下：


    - 1. 所有的挣钱方法都是和分享人的主业有非常大的关联性。都是在行业中积累多年后，找到一个机会然后挣了大钱。


    给我的启发是什么，其实各个行业都有金矿，你肯定不可能把所有的挣钱机会都干了，也没这个实力，大部分你能抓住的挣钱机会都和你擅长的主业有很大的关系。


    比如我刚看到有一个程序员分享给 ios 做签名的生意，就依靠淘宝店铺一年搞个几百万；一个做 seo 的大佬，在职场中发现流量的生意，低买高卖挣了人生第一个一千万。


    看了之后我确实很焦虑呀，但这些我肯定都干不了，同时他们的经历对我启发很大。都是在职场主业本来就有积累，发现机会之后就迅速 all in 挣钱，把自己的优势发挥到最大。


    - 2. 各种牛逼的想法都抵不过一个强大的执行力，我一直都很喜欢这句话，真的是真理呀。


    好多人都说喜欢挣钱，但从来都没有真正实践过，只是脑子里面想了无数遍，真的有个毛线用吗？


    上面说的那个 ios 程序员是在做外包的时候发现了机会，我们都知道很难靠外包挣大钱，但在行动中可以发现更多的机会呀。


    请记住，机会不是在那里等着你去发现，而是在不断前行的路上才会碰上，你都不出门机会怎么去垂你。


    所有能挣钱的朋友，无一例外都有一个强大的执行力，不要说没有时间时间什么的，那是你还没有那么的爱他，在哪方面付出就肯定在那方面会有回报。


    最后收回来总结一下：

    第一，要想挣钱最好找自己擅长做的事情和主业相关的事情。

    第二，没有强大的执行力你不配挣钱。


    这个世界上没有让你感觉到很容易又很能挣钱的方法！

