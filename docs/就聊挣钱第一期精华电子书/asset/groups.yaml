    # 小河叔分享：一个人单枪匹马，筹备线下培训班


    组织一场线下的培训班。在学员招募的过程中，我也是采取了优先发展种子学员的思路。最终，我单枪匹马一个人通过这个培训班，收到了 33 万的现金。那么，我是怎么组织起这个培训班的呢？


    在培训班宣传文案当中，我提出了这样一个合作主张：前 10 名种子学员，将能够享受一些与众不同的待遇。


    +   （1）他们先付费给我，之后我会把他们拉到微信群里面。他们不但可以全程参与我的社群实战，亲眼看我如何在只有一个人的情况下组织起一个线下培训班，而且在这个过程当中，我还可以带领他们一起参与实操。


    （2）这次线下培训，如果报名的人数达到 30，我将会退还他们一半费用。如果线下活动报名人数达到 60，我会退还他们全部费用。此时此刻，他们 10 位就相当于参与这个活动的首批众筹股东。


    （3）在做活动之前，我提前给了他们了一个承诺。当时这个线下活动什么时候举行并没有确定，只有人数达到 30 才会开课。但如果说，一个半月之内还不能组织起来，我会把费用一分不少地退还给他们。也就是说，我给到了他们一个零风险的承诺。


    通过这些合作主张，在 2015 年 10 月 22 号下午，在我发出第一篇公众号文章半个小时之内，就收到了两笔报名款项。等种子学员人数超过 30 的时候，我收到的款项已经远远超过我筹备这次线下活动所有成本开支。直到此时我才开始去讨论会场，然后跟大家确定上课的时间。整个过程，我感觉非常轻松。


    在开设传统培训班时，正常的流程是先预订酒店，提前担负几万、十几万的会务开支。之后再在开课之前，招募到足够多的学员，以此保证收支平衡。而我筹备的这次培训完全不一样，因为我不必提前承担不可预知的会务成本。我通过发展种子学员的方式，用最轻松、最简单的方法达到了我预期的效果。'
