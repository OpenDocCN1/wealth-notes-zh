    \n## 【就聊挣钱】第一期精华电子书\n\n**版权声明：** 此份电子书整理自知识星球「就聊挣钱」，版权所有“纯洁的微笑”和分享的圈友所有，禁止任何形式的转载，禁止传播、商用，违者必究！\n\
    \n《就聊挣钱》知识星球是一个不至于谈钱的星球，圈内主要探讨主题：不限于商业模式、创业想法、增长黑客、营销策略、赚钱思路，撮合相关资源方对接等。\n\n现在第二期正式开启，星球初始定价\
    \ 188 元，每增加 100 人增加 10 元，越早加入越优惠，感兴趣的朋友不要错过。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_2_0.png)\n\
    \n星主一段自我吹嘘的介绍，方便快速认识他。\n\n- 【昵称】纯洁的微笑\n【坐标】北京，老家陕西\n【职业】自由职业，关键字：程序员、讲师、自媒体\n\
    【兴趣和爱好】写作、户外、旅游、分享\n【我的成就事件】\n- 互联网金融公司技术负责人\n- 第三方支付公司研发副总，最多管理超百人\n- “纯洁的微笑”公众号创建者，2年关注用户超\
    \ 120000 +（技术领域）\n- 《就聊挣钱》星球创建者超 1500+人加入\n- 博客园、CSDN、51CTO 推荐博客，文章累计传播量超千万。\n\
    - GitChat 畅销课作者\n\n## 序言\n\n2018 年 8 月 8 号，就像 2008 年 8 月 8 号一样是一个比较神奇的日子，我就想在这么吉利的日子要做点什么，想了想就做我现在最喜欢做的事情“分享+赚钱”那就是：就聊挣钱。\n\
    \n挣钱真的是一件非常有意思的事情，我相信每个人都有强烈的赚钱欲望，当然也包括我。一方面挣钱可以改善我们的生活，另外通过了解挣钱方式可以打开一个新世界，经常会给我一种：哇！原来可以是这样的感觉。\n\
    \n赚钱可以激发每个人的潜力，有人就抓住了一个点深挖了进去，做专做深做强做大，从而获得巨大的成功。当然了，任何伟大的思想如果不实施就是零，开始很难很难，开始了之后也难，但一旦突破了那个瓶颈之后，就会爆发式的增长，后期我会给大家分享这块的内容。\n\
    \n在我的博客公众号访问量越来越大的时候，帮助我连接了越来越多的人，有各大技术社区的运营人员、各技术社区的知名博主、IT 行业大佬、各公司 CTO、还有很多创业者。\n\
    通过这些人又让我了解到更多的可能性，到了后来你会发现站在外面的人很难进来；一旦进来了，有了第一个可能性，并持续坚持下去，就会发现后面的机会就越来越多。就印证了那句话，越小越弱，越大越强，因此希望通过这个圈子可以共同激励前进。\n\
    \n所以我创建这个圈子有几个目的：\n\n- 1. 分享我的挣钱思路以及我对此的实践经历；\n- 2. 连接更多和我一样具有强烈欲望又肯坚持实践的朋友，一起探讨赚钱、创业思维和套路。\n\
    - 3. 帮助大家连接一些我的资源，也可以帮助我认识跟多的朋友。\n- 4. 如果这一年你通过此圈子，收获了一个创意想法，实践了一个赚钱的方式，我认为就值了。\n\
    - 5. 如果加入圈子什么也不做就想赚到钱，估计这个圈子不太适合你。\n- 6. 交流碰撞是产生好创意的最佳方式，通过交流也促进了更加深入的理解，推荐积极参与交流。\n\
    \n以上就是我创建《就聊挣钱》知识星球的初衷，后来我又增加了一些延伸，例如在知识星球中寻找一些合作伙伴。\n\n2019 年《就聊挣钱》知识星球第二期，我们会增加更多好玩的东西在星球内，并且会组织多次的线下交流碰撞，2019\
    \ 年一起见证更多精彩。\n\n注意：\n\n本星球不推荐股票或购买某些理财产品，也没有什么一夜暴富的方法，仅仅是一群热爱创意分享的人在一起探讨更多的可能性。\n\
    \n根据自己情况，合适再选择加入。\n\n也次欢迎大家关注我的公众号：纯洁的微笑，一个有故事的程序员。\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_4_0.png)\n\
    \n## 星主分享精华\n\n### 流量生意永不过时\n\n在中国互联网上的历史上，所有的商业模式基本上都可以归结为流量的生意。最开始的四大门户霸占了第一批上网用户，第一代网民几乎都是通过四大门户来阅读新闻资讯，四大门户网站成为中国最早的线上流量聚集地，但当时也是最简单的商业模式，通过新闻咨询吸引流量，然后卖给广告商赚取价值。\n\
    \n随着互联网的发展人们有了多元化的需求，通过互联网聊天、购物和搜索庞大的信息，这就产生了我们熟知的 BAT，开始接管中国新一代网民。腾讯在社交的霸主地位，几乎垄断了在线通讯的流量；阿里由于最早开拓电子商务市场，所以在线购物这个领域牢牢的把控流量，当时阿里封杀百度、微信也都是为了守护自己的流量，流量才是淘宝、天猫的根基。这些年京东、拼多多的崛起抢占了很多电商市场，阿里的霸主地位慢慢受到挑战；百度更是一个完全依靠流量而生存的公司，通过搜索引擎吸引大量的用户使用，再将用户的流量卖给各地的广告主，这也是百度凤巢系统最主要功能。\n\
    \n到了移动互联网时代，线上流量产生了大的变革，大量新用户最开始接触的就是移动互联网，又因为移动互联网的便利性，大量的 PC 流量被转移到移动端。在此潮流下，产生了美团、小米、滴滴、今日头条、抖音等新贵流量大王，腾讯因为有微信大杀器在移动互联网时期抢尽了风头，相比另外两家巨头阿里和百度在引动领域就略显尴尬。\n\
    \n美团从团购开始现在已经成为了 020 之王，外卖、电影票、酒店、旅游多个领域稳稳排名第一；小米主营业务是手机，却一直宣称自己是互联网公司，因为小米手机只是个载体，大量小米手机之后的用户是源源不断的优质流量，利用这些流量能做的事情太多了，小米生态、小米金融、小米游戏等等；\n\
    \n今日头条和抖音是仅次于微信之后在移动互联网时代的流量之王，通过智能推荐让用户的脑根本停不下来，抖音更是变态的在 app 上隐藏了时间，大多数用户使用了头条和抖音都会被忘记时间，抖音在国际上的发展势态非常好，有可能成为中国第一个在国际上成为现象级的产品。\n\
    \n纵观中国互联网的历史，本质上就是一场赤裸裸的流量争夺史。谁抢占的流量多谁就会成为下一个巨头新贵。中国互联网巨头如此，互联网生态中的小的创业公司、个人都基于此，在巨头的生态下挖掘剩余流量价值，依赖于这些巨头，在巨头的流量下建立起新的商业模式。\n\
    \n在所有的流量生意中，大体可以分为三大流派，第一种，获取流量，依赖于工具、活动等手段获取大量的流量，把获取流量作为主业，然后将获取到的流量贩卖给第三方来获取价值；第二种，流量变现，通过购买第三方的流量，获取大量的用户，根据获取到的用户进行营销变现；当然还有第三种，就是即获取流量又进行流量变现。我后续分享的案例中，基本上都可以归结到以上二类中。\n\
    \n中国互联网的生意基本上都是围绕流量来运作的商业模式，只是依托这流量之上的商业模式有太多可以研究，“只有你想不到没有做不到”。作为个人只要能看准其中一二，依靠一个点做深做透即可获得巨大价值。\n\
    \n## 挣钱案例分析\n\n### 做在线工具网站可以赚钱吗？\n\n今天就给大家分享一个案例，一个在线工具型网站：http://www.atool.org/。\n\
    \n这个网站是由华中科技大学计算机学院在校的女研究生开发的，当然现在已经毕业了。最初只有一些常见的在线工具，比如转化图片，在线转加密解密、JS/CSS压缩等。有一个可以在线看网站历史快照工具，历史页面地址：http://web.archive.org/web/20130626001606/http://atool.org/。我们可以看出在2013年这个网站是这个样子：\n\
    \n![](img/52c388fa412d85e5cfb3502a3e1c6b94_6_0.png)\n\n网站有五个一级菜单：在线多媒体处理、站长工具、在线代码转换、其它工具和关于我。\n\
    在线多媒体处理：处理各种图片转化，生成一些特定模板的微博热图等功能。\n站长工具：查网站排名、pv/uv、网站外链、域名的相关检测等。\n其它工具：ip地址查询、快递查询、繁简字转化、金额大小写转化等\n\
    关于我：网站的一些介绍\n\n### 在网站的**关于&合作**菜单下了解网站诞生的过程：\n\n### 网站起源\n\n- 最开始是经常会用到 png 转\
    \ ico 的工具，有网络的时候还好，网上有很多可以处理的工具。但是没有网络的时候，就没有办法处理了，于是自己用 PHP 做了一个本地 Web 转 ico\
    \ 的小程序 phico。\n- 自己用着自己写的程序，感觉还不错，于是试用二级域名 tools.50vip.com 挂到网上，想着说不定别人也需要用。\n\
    - 后来关注域名的时候，发现 aTool.org 居然还没有被注册，于是并买了下来，于是本站算正式上线！名字就叫 aTool 了。\n- 既然都买了域名，于是便开始不断的加一些功能，首先加的都是自己需要用到的，这些功能其实其他网站都有，并且也不比我自己做的差，但是毕竟自己做的，用着感觉不一样吧！\n\
    - 后续会逐步加入更多实用的功能，以及一些有意思的东西，如果大家有什么需要，也可以留言或者加 QQ 群说！\n- 如果觉得我做的工具可能对你有用，我不需要什么捐赠，只希望你能够留个言支持一下，好让我有动力继续加功能！当然如果能够分享到微博、发博推荐、点点小广告，我就更加开心了！\n\
    \n这是网站现在的样子：\n\n![](img/52c388fa412d85e5cfb3502a3e1c6b94_7_0.png)\n\n可以看出网站的 UI\
    \ 进行了大改版，功能进行了一些扩充，增加了很多好玩的功能，比如：在线生成高考准考证、在线计算男女交往几天可以啪啪啪、在线制作 gif 等功能。添加了用户体系，支持\
    \ QQ 登录，但是当我点击 QQ 登录时却报 404 错误，网站现在还存在很多的 Bug。\n\n通过 http://www.alexa.cn/ 来查看一下网站的流量情况。页面地址：\n\
    http://www.alexa.cn/rank/atool.org\n"
