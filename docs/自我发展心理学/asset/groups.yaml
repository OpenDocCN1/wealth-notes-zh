    # Part 22：关系中的自我，从个体视角到关系视角


    从这一讲开始，我们进入了这门课的第三单元：关系的发展。在这一单元，我将用一个跟你想象中不太一样的视角，让你更深刻地理解什么是自我、什么是自我发展。


    讲这段话的时候，我正在录音棚里录课。我对着麦克风，周围很安静。看起来，录课这件事，是我一个人在做的。可是我会想象有你在另一边听。我可以说，我讲课是在你听课之前，但是我也可以说，从你听课开始，我才真正开始了“讲课”。


    因为，如果没有听众，就没有讲者。如果没有你在听，那我的讲，就变成了毫无意义的喃喃自语。这就是关系。


    没有人是完全独立的个体。关系里的人，总是一起出现，相互定义，相互成就。


    就像我们说，是父母生了孩子，但是从父母的角度，你也可以说是孩子生出了父母：因为如果没有孩子，你怎么能自称父母呢？


    这样的说法，并不是文字游戏。这关系到我们怎么理解人这种独特的存在。你是把人看作一个个独立的、偶尔产生联系的自我，还是把人看作完完全全的关系中的存在？


    我们这门课叫《自我发展心理学》，现在，我想请你重新来思考一下，什么是自我？


    # 1. 自我存在于关系中


    通常，我们会从个体的角度来思考自我。


    我们会假设，存在着一个稳定的、独立于他人的自我，这个自我决定着我的想法和行为；


    相应的，我的想法和行为背后，隐藏的是我的个性，个性决定了我在大多数情况下会怎么想、怎么做；


    如果我表现出自己不想要的行为，那一定是这个“自我”有问题，比如意志不坚定、情绪不稳定，甚至严重点，有心理问题。


    从现在开始，我想请你抛开刚才那个视角，从一个新的角度来思考自我，那就是关系的视角。


    这时候你会看到：其实并没有一个单独的自我，每一个关系里，都有一个不同的自我；不是你的个性，而是你所处的关系，决定了你的想法和行为；如果你表现出自己不想要的行为，那也不是你一个人的问题，而是你所处的关系出现了问题。


    这样的视角是不是跟你想的不太一样？你肯定想问，我们为什么要从关系的视角来看待自我，发展自我呢？


    关于这个问题，我想用四个递进的层次解释给你听。


    第一，人无时无刻不在关系当中。


    家庭有家庭关系，工作有工作关系，就算在地铁上，旁边都是陌生人，那也是一种关系。


    也许你会想，我一个人独处的时候，总不在关系里了吧？当然不是。你独处的时候，你独处的空间，是由关系来界定的。


    比如你一个人在家，家里有一个门，你知道就算有陌生人走过，也不会随意从这个门闯进来。这是你们在关系中达成的共识。'
  - '[PAGE 76]


    你一个人在家可以光着膀子，穿着短裤，爱干什么干什么，看起来你很自由。可是你知道你不能这样走出这道门，走到大街上去。这也是一种关系的共识。是关系界定了你独处的空间在哪里。再想一下，虽然你在独处，但你仍然在关系里。你知道，这里虽然只有你一个人，但不意味着地球上或者宇宙中只有你一个人。你虽然在独处，可是你仍然会想：家人在哪里，约谁去吃饭，明天要交给老板的报告怎么完成，老板又会怎么评价你……你想的这些，都是关系。所以，关系是无时无刻不在的。


    # 第二，在不一样的关系中，你的自我是很不同的。


    也许跟陌生人说话时，你可能会脸红害羞，可是在很熟悉的朋友面前，你也会玩得很嗨。


    在办公室，你会努力工作，可是到了家里，你就会往沙发上一躺，反正会有人收拾。


    内向的你、外向的你；勤快的你、懒惰的你，这些都是你，只是不同关系中的你。


    美国有个很传奇的教师，叫马尔瓦·柯林斯（Marva Collins）。她在犯罪和毒品横行的芝加哥贫民区附近，创立了名为“西侧预备学校”的教育机构。来这个学校就读的，都是公立学校里退学的，被认为有问题的学生。可是，在她的教育下，这些原来的街头混混，被认为有学习障碍的学生，都好像变得聪明了。很多都考进了大学，成了律师、医生、法官、教师。她是这么做到的呢？


    和以前学校里的批评教育不同，她就是很真诚地相信这些孩子是聪明的、独一无二的，不断鼓励他们说：“我相信你，你可以做得更好。”这种教育的本质，其实就是塑造了一种新关系。关系变了，学生的表现，自然也就变了。现在我们知道了，人无时无刻不在关系当中，而且在不同的关系中，人的自我是很不同的。


    # 第三，决定你行为的是你所处的关系，不是你的个性。


    设想这样一个场景：一个妈妈正大声责备儿子：“你怎么又没做家庭作业？你这孩子怎么这么不听话！”


    她的责骂也许会让你觉得，这是一个暴躁易怒的妈妈。暴躁易怒好像是妈妈个性的一部分。可是忽然电话铃响了，妈妈接起电话，立刻满脸笑容地说：“是老师啊。您说要来家访，好啊，欢迎欢迎。哪里……孩子在学校里让您多费心了……”


    你又会觉得，这是一个热情有礼的妈妈。妈妈的表现为什么这么不一样？不是她的个性，而是她所处的关系不同嘛。


    也许你会说，妈妈对老师的反应是不是伪装的？对儿子的反应会不会更接近真实的她？不是，我们在亲近的人面前，才更容易表现出真实的自己呀？可从关系的视角，它反映的是妈妈在“亲近”和“疏远”这两种不同关系中的差异，而不是所谓“真实自我”和“虚假自我”的差异。在这两种关系中，妈妈的表现，都是真实的，都是这个妈妈的自我。也许你还会说，这只是一时的反应，如果我们能看她长久的表现，我还是能够了解她的个性的。


    可是，所谓长久的表现又是什么呢？很多时候，那也不过是在另一段长期关系中的表现而已。


    所以，是所处的关系，而不是个性，决定了人的行为。


    # 第四，是关系的视角会让思考问题的视角发生重大的转化，一些看起来几乎无'
