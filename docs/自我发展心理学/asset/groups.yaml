    这样，不用维护一个不会犯错的投资人形象，他一下子觉得自己轻松了很多。


    他觉得自己的判断更坚决，也更敢做决策了。


    刚刚我讲了突破固型思维的两种方法，一个是把错误当做学习的机会，另一个是突破自己不会犯错的形象。


    现在想来讲第三个方法，那就是制定犯错计划。


    曾有一个来访者问我：“我总认为说错话、做错事懊恼不已，影响工作和生活，该怎么办？”


    对他说，错误意味着失败和对自已的否定。他很少从反馈的角度理解错误。所以当他听到，我建议他制定一个“犯错计划”时，他吃了一惊。


    我说：“如果要克服对错误的恐惧，你就必须犯错误。你要争取每周犯5个错误，记录下这些错误，反思这些错误的后果是否如你所想的那么严重，并思考你从这些错误中学习到什么。多做多错，如果你没能在一周之内犯足5个错误，就证明你做得不够多。”


    我希望他通过这个作业了解错误作为反馈的另一面。我也希望这样的作业能降低他对犯错的焦虑。假如他真的犯错了，他至少可以跟自已说：“我这是在完成陈老师的作业嘛。”


    我觉得这个思路特别好。为自已制定犯错计划，会消解错误的消极价值。如果你也为犯错烦恼，为了克服对错误的偏见，你也可以尝试一下这个犯错计划。


    听到这里，也许你会想：你说的听起来有些道理，可是在现实的生活中，错误的代价是非常重大的，我们怎么可能不害怕犯错呢？


    对于这个问题，我有两个思路分享给你。


    第一，如果你的错误会导致你一无所有、家破人亡，那你就要小心了。


    这已经不是在犯错，而是赌博了。可是，如果你的试错成本是你可承受的，那你就需要在生活中，给试错留下空间。


    那什么是可承受的试错成本呢？这跟你的人生观有关了。


    如果你需要的少，你能容忍的试错成本就高，你也会有更大的空间通过试错来学习。而年轻的时候，是我们试错成本最低的时候。


    第二，错误是人生的一部分，有时人会因为错误而变得更丰富。


    我的这个想法是受了一本书的启发，这本书叫做《有限与无限的游戏》。这本书讲到，有两种游戏：


    一种叫有限游戏。这种游戏有明确的规则，也有明确的开始和结束。而我们的任务，就是尽快结束这个游戏，并且赢得这个游戏。在这样的游戏中，错误就意味着游戏的终止和失败。


    而另一种游戏，叫无限游戏。这种游戏没有明确的胜负，游戏最重要的目标，就是让游戏继续下去。


    如果我们的人生是一个无限游戏，那错误就不是游戏的终止，它是游戏的一部分。


    你甚至会有意识地犯一些错误，来让游戏变得更有趣一些。'
