    来标定不要轻易靠近的危险区域。


    我们曾感受到的痛苦越大，我们用警示牌标识的危险区域就越大。久而久之，我们自己的活动空间变得越来越小，逐渐无路可走了。


    举个例子来说，我们假设有个叫小罗的年轻人，他刚毕业不久，到一家创业公司工作。


    这家创业公司由于刚起步，每天都要加班到很晚，而且老板因为自己压力也很大，对他非常挑剔。结果做了半年，他挨了老板很多骂，还被开除了。


    这对他说是一个创伤事件，给他留下了心理阴影。那他会怎么想呢？


    如果他受的毒害比较小，他可能想：**我不适合这家公司的**工作。他**对重回这家公司会有恐惧，这是正常的反应**。


    如果把防御的范围再扩大一点，小罗就可想想：**我不适合去创业公司**工作。**这样，他就把所有的创业公司都排除了**。


    如果他防御的范围再扩大一点，他就可能会想：**我不适合去公司工作，也许我应该考个事业单位或者公务员**。


    如果再扩大呢？他就可想想：**我不适合去工作，职场中的人际关系、工作压力，我根本没办法应付。**那他的防御范围就扩大到了**所有的工作，他可能就说选择在家不工作，当一个啃老族了**。


    从“我在这家公司很可怕”，到“创业公司很可怕”，到“公司很可怕”，到“工作本身很可怕”。


    被开除这件事对他的伤害越大，他心中的信念就越抽象，他的思考方式就越绝对化，他防御的范围也会越大。


    反过来也一样，他对这种挫折的思考越绝对，他的情绪反应也会越大，他会越悲观和沮丧。


    ## 3. 悲观思维的三种抽象方式


    这种对挫折的绝对化，也是悲观思维的本质。塞利格曼提出，悲观思维会从三个方向对挫折做绝对化加工：永久化、普遍化和个人化。


    先说说第一种绝对化的方式——永久化。所谓永久化，就是在时间维度上，觉得这件事会一直发生。


    举个例子，假如最近公司业务繁忙，经常需要加班，你当然很不爽。你会怎么理解这件事呢？你可以跟自己说：最近工作很忙，也可以跟自己说：**这个工作总是**没完没了。


    注意这两种说法的差别，前一种说法是把工作忙限定在一定的时间范围内，是最近这样，这也意味着，过一段时间可能会不一样，这就给变化留下了空间。


    而后一种说法呢？这工作没完没了，它给这种状态的时间判断是永久的。**一旦把一件事情永久化了，你就看不到变化的希望，自然就会悲观沮丧**。


    时间上的永久化，也体现在我们形容自己或者别人身上。


    假如因为经常加班，导致你这段时间很疲惫，那么你既可以跟自己说，“我状态不好，我累了”，也可以说，“**我很没用，我完了**”。


    “累了”是一种暂时的状态，它其实是隐含解决方案的。你累了，那你休息一下也许就好了。可是如果“你完了”，这是一个永久性的判断，那就没有变化的可能性了。


    这种永久化也会体现在对他人的判断上。


    在我的咨询室里，吵架的夫妻经常爱说的口语是，“你总是这样，你总是那样”。


    比如，妻子会指责丈夫，“你总是只想着自己，你总是每天不回家”。丈夫就会回应，“我哪有每天不回家，我只是偶尔一两天有应酬而已，而你呢，你总是这样大惊小怪、无理取闹”。


    **“总是”就是一种时间上永久化的说法**。这时候，我就会问他们，有例外吗？有没有丈夫早回家的时候，或者妻子也是体贴你的时候？如果有，就不能说“总是”了。


    用“有时候”代替“总是”，你来体会一下，“你总是不回家”和“你有时候不回家”，后一句指责的味道是不是少了很多？


    **悲观思维的第二种绝对化的方式——普遍化。所谓普遍化，就是从一只乌鸦黑，推广到天下乌鸦一般黑。从一个男人不可靠，推广到天下男人都不可靠。**


    **如果有人对我这不公平，那就是这个世界对我都不公平。**我们在前面举例的小罗，从这家创业公司的工作不好，推广到所有的工作都不好，这就是一个普遍化的例子。


    **悲观思维的第三种绝对化方式——人格化。所谓的人格化，就是觉得所有不好的事情都是针对我的，都是我的错，才会让这些坏事发生。**


    我来举个例子，以前有个朋友因为工作的事情来咨询我，他在金融行业做销售，每天都要打电话给很多客户推销他们的理财产品。


    这些客户对电话销售当然不是很热情，有些会客气地说不需要，有些干脆听到是销售就直接挂了。他有些抑郁，认定是自己很讨人厌才会遭人拒绝，自己很没用。


    这就是一种人格化。


    我问他：“那些接到电话的人，知道你是谁吗？”他说不知道，有些刚听了两个字“你好”就挂了。


    我问：“那其他同事呢？”他说也差不多吧。


    我说：“既然他们都不知道你是谁，既然其他同事的遭遇也差不多，那为什么是针对你的呢？那些人有自己的需要，他们不想被打扰，这是能够理解的，可是你如果说都是针对你的，都是你的错，那你也想太多了。”


    他想了想说，好像也是。后来，为了提醒自己，他做了一张卡片，卡片上写着：**不是我的错**。以后每次打电话，再遭到拒绝，就不会那么郁闷了。


    出现问题的时候，觉得“都是针对我的，都是我的错”，这是一种常有的心理反应。也许你看过这样的电影片段，主角遇到了倒霉的事，他就会对着天空喊：“老天爷，为什么要针对我，我究竟犯了什么错！”


    这就是一种人格化。**我们经常对坏事会有一种奇怪的内疚，有时候明明我们自己是受害者，却仍然觉得是我们的错。**这扩大了我们的防御范围，却让我们陷入了不必要的内疚和自责。


    回过头来看，绝对化思维最大的问题，是为了防御可能的危险，把生活封闭在真空里，让我们不敢接触现实，从而失去了从现实、从生活中疗愈的机会。


    就像那只得抑郁症的狗，明明轻轻一咬就能跳出笼子，它却再也不敢尝试了。**如果生活是一条河，绝对化思维让生活变成了无源之水。**这是绝对化思维最大的问题。


    这几节课，我们讲了三种防御型思维：僵固思维、应该思维和绝对化思维。这三种思维方式看似不同，其实有很紧密的内在联系。


    比如说，父母夸一个孩子聪明，这是一种抽象的评价，会让孩子陷入自我证明的陷阱中，孩子会努力维护自己的形象，从而回避挑战。这就是僵固型思维。


    然后孩子会发展出这样的思维方式：我应该表现得聪明，否则就没有人再喜欢我了。“应该……否则……”。这就是应该思维。


    然后，如果孩子在某件事上没有做好，比如一次考试失败，那他就会想：我连考试都通不过，这就证明了我不够聪明，再做什么都没有用了。这就是绝对化思维。


    所以，**僵固型思维、应该思维和绝对化思维，通常都是同时出现的。它们的核心特点，就是用抽象的思维方式，阻止了我们跟现实发生联系。**


    也许你会好奇，如果我有防御型思维，该怎么办呢？


    别着急，我们下节课就来讲这个问题。


    下节课再见。


    ## Part 16：与自我辩驳，如何突破防御型思维的操控？


    在前面的课程里，我们介绍了三种典型的防御型思维：僵固型思维、应该思维和绝对化思维。也许你会想一个问题：如果我也有三种防御型思维，该怎么改变呢？


    这节课，我们就来介绍一种突破防御型思维的方法，我叫它“与自我辩驳”。


    我们来假想一个主人公，叫小王。他是个典型的理工男。除了工作写代码，平时就宅在家里打游戏。


    他没有女朋友，觉得自己没什么魅力，不会有人喜欢他。


    可是最近，公司来了一个让他动心的女生。这个女生很活泼开朗，他们有工作交集。工作之余，女生也会经常开他的玩笑，让他觉得，对方似乎也对他有好感。


    慢慢地他想：“也许我应该试一下。”


    那天正好是七夕节，他就鼓起勇气约那个女生：“晚上有没有空，一起吃个饭啊？”那个女生很吃惊，犹豫了一下，就说：“不了，我已经有约了。下次吧。”


    女生刚说完，一下子，小王各种情绪涌上心头。失落、生气、屈辱、沮丧，他甚至都没跟那个女生打招呼就直接走了。


    是什么让小王这么愤怒和沮丧呢？


    学了前面的课程，你就应该知道了，不是他约这个女生吃饭，女生没答应这件事本身，**而是小王解读它的方式让他有这么多的负面情绪**。在这里，我们可以回想一下前面所学防御型思维。


    小王也许觉得，跟女生交往的能力是固定的，或者一个人的魅力是固定的，这次挫折证明了自己就是没什么魅力。这是僵固型思维。


    他可能觉得：“既然我好不容易鼓起勇气约了你，你就该答应我。我不该被拒绝，否则我就没有被尊重。”这就是应该思维。


    他也可能想：“我真是太糟糕了，没有女人会喜欢我。我这辈子都不会再谈恋爱了。”这就是绝对化思维。


    这些防御型的思维以自动化的方式**在他的大脑后台运转，让他觉得愤怒和沮丧，也让他再也不愿搭理这个女生**了。


    这样的思维方式并不理性。可有时候，我们就是会有很多不合理的思维，尤其当我们自尊心受伤的时候。


    ### 1. 与自我辩驳的三种方式


    怎么办呢？


    如果你相信理性的力量，相信你能控制自己的想法，那你就要试着来劝服自己，试着发展出一种更理性、更健康的眼光和看法。这就是我们今天所要介绍的改变思维的方式——与自我辩驳。


    这套技术来自理性情绪疗法的创始人，心理学家艾利斯（Albert Ellis）。他说，对于不合理的思维，我们可以从三个方面加以辩驳：


    **第一种辩驳方式，是实证式的辩驳，就是找与不合理的结论相反的证据。**


    小王在七夕节约那个女生吃饭，那个女生说：“不了，下次吧。”这能不能作为证据，来证明小王的想法：“根本不会有人喜欢我呢？”


    这种证明是分层很多层次的。最基础的层次是：这算不算证据，证明这个女生就是拒绝了小王呢？


    并没有。她只是拒绝了小王七夕节的邀请，她甚至还留了点余地，说“下次吧。”也许她真的已经跟朋友有约了，也许她觉得七夕节这是一个比较敏感的时机，不适合作为交往的开始，也许她还没有准备好开始一段关系，这都是有可能的。那它是不是证明了小王的想法：“根本没有人喜欢我呢？”那就更没有了。如果是小王自己在做这个练习，他可以找出很多反例来证明可不是这样。比如，平时这个姑娘也会主动跟他聊天，被拒绝的第二天，这个姑娘还跑来跟他说笑话。如果小王能诚实而理性地面对这些证据，他就会发现，要下“根本没有人喜欢我”这个结论还为时尚早。


    实证式辩驳的重点，是要找一些证据让你看到，事实并没有你想的那么糟。可是，万一事情真的这么糟呢？或者，如果这个姑娘真的是拒绝了小王呢？毕竟这也是有可能的。那也许我们要用第二种辩驳方式。


    第二种辩驳方式，是逻辑式的辩驳。辩驳的重点，是推理的合理性。几乎所有的不理性思维，都有过度推理的问题。


    对小王而言，从被一个姑娘拒绝，他就推理到了“我没有魅力”、“不会有人喜欢我”、“我就是不适合谈恋爱”，可是这种推理合适吗？


    前面讲绝对化思维的时候，我们曾经说过，人有时候会通过抽象化的方式来扩大防御范围。可是从逻辑推理的角度，这是不合理的。


    请你想像，为什么被一个姑娘拒绝，就代表了“我没有魅力”、“没有人喜欢我”呢？这次被拒绝只能证明我这次被拒绝了，不表示我就是一个没有人喜欢的失败者啊。


    如果事实很糟糕，它也只是在此时此地很糟糕。但并不能因此推演出“我会一直被拒绝”、“我就是没人喜欢”，这并不符合逻辑。


    他还可以这样跟自己辩驳：“就算我被拒绝了，我就不能被拒绝吗？”交往的尝试就是包含很多试探和拒绝的。它就是恋爱最普通的一部分。


    如果这样就代表没人喜欢，几乎所有人，都有被拒绝的经历，那是不是代表所有的人都是不被喜欢的呢？这同样是不符合逻辑的。


    可是，只有第二种辩驳方式还是不够。原因在于，一种推理方式，是没有办法否定一种可能性的。


    “我就是觉得自己没什么魅力，没有人喜欢我。”这也许不合理，可是不也不i可能啊？这时候，就要用第三种辩驳方式。


    第三种方式，是实用式的辩驳。简单地说，就要问：“我这么想有什么用。”我不断想着我没有魅力，没人喜欢我，除了让我继续宅着，还有什么用呢？如果我这么想是没用的，那更有用的想法是什么呢？对于我自己来说，我更喜欢这种实用式的辩驳，简单直接，并且不会让自己在复杂的逻辑中绕圈子。


    ### 2. 三种错误的思维倾向


    可是大部分人并不习惯用“有用”、“没用”来思考，他们的思考方式背后，有一些错误的倾向。


    我总结一下，觉得可以把这种错误倾向归结为三类。


    第一种倾向，是认为这个世界上存在着一个所谓的事实真相，一个正确的认识。其实，以前我也这么想，但现在我不再这么想了。对于“我有没有魅力”、“有没有人喜欢我”这样的事情，其实根本没有所谓的真相。探究这样的真相也就毫无意义。


    第二种倾向，是认为自己所想的，就是事实真相，而很少去容纳其他可能性。


    “我自己的事我自己知道。”如果你这样想，你就很难有改变的空间了。


    第三种倾向，是我们也知道自己的想法是非理性的，但是很爽、很带劲，所以就是要这么想。


    比如，“我就是要把她想得狠坏，否则不解我心头之恨。”，“我就是要把自己想得很糟糕，就是想丧一下。”


    关于这一点，我是这么想的：


    有时候，我们确实需要合理地表达自己的情绪，表达自己的失望、沮丧和愤怒。


    可是如果任由情绪把我们的想法带走，那我们就放弃了控制自己想法的责任，也就放弃了做一个理性的人。


    我刚刚提到的实用式的辩驳，跟这三种错误倾向都不一样。它关注的不是真相，而是思维的功能。


    还记得我们在最开始讲心智模式和个人成长的时候所说的话吗？


    我们说，心智模式最重要的功能，是看它是否产生积极的情绪，以及能否产生有效的行动。


    如果我们能控制自己的想法，那也就能控制自己的情绪和行动了。所以对于一个想法，我们要问自己：


    这样的想法会引发我什么样的情绪呢？


    这种情绪是我想要的吗？


    它会触发我什么样的行动呢？


    这种行动是我想要的吗？


    我这么想，会让自己更好呢，还是更糟糕呢？


    这就是一种实用式的想法。


    在健身房里，如果你要练胸肌或者腹肌，教练会告诉你“一二三四”要这样做。


    与自我辩驳，其实也是类似的健脑训练。


    要做这个健脑训练，我们不能怪自己有这些防御型思维。在练习做这种自我辩驳时，有时候来访者会说：“你看我多笨啊，连这点道理都想不明白。”


    如果是这样，那本身就变成了需要辩驳的防御型思维了。你有这些防御型思维很正常，重点是，你也不能放任它破坏你的情绪和行动。


    我的一个来访者在学与自我辩驳以后，跟我说：“我的头脑中好像有两个我，一个是情绪化的我，像个需要人照顾的孩子，在不停地说‘认命吧，你就是没人喜欢。’另一个是理性的我，像是个大人，在不停地说：‘这有什么，根本不是大事，不能因为这点小事停止尝试。’


    那个情绪化的我说得很大声，那个理性的我呢？只有小小的声音，需要很仔细听才能听见。”


    我就跟他说，这个情绪化的你和这个理性的你都是你，但又都不是你。你是另一个人，你是作为裁判的那个体。


    现在，是该由你做决定了，站在谁这一边。那么，如果你是这个裁判，你要站在谁这一边呢？


    总结一下，这一讲我们讲到了跟自己辩驳的三个技巧：实证式的辩驳、逻辑式的辩驳和实用式的辩驳。希望你能好好地利用这些健脑工具来锻炼，不断地突破内心的防御型思维。


    从下节课开始，我们会用三节课的时间，来跟你分享更多思维工具，帮助你发展出更具成长性的思维。


    我们下一讲见。


    ## Part 17：创造性思维，行动的张力从哪里来？


    如果把思维比喻成一条河流，一条河要流动起来，需要有3个条件：

    - 河流落差产生的张力；

    - 控制河流走向的河道；

    - 不断补充的源头活水。


    如果没有落差，河水就会停止流动；如果没有河道，河水就会失去方向；如果没有源头活水，河水很快就会枯竭。


    其实，人的思维发展也是如此。**张力就是目标，河道就是行动的方法，源头活水就是与现实的接触。**


    **如果没有目标，人就不会有行动的张力；如果没有方法，目标就只会制造焦虑，而不会引发有效的行动；如果没有跟现实的接触，思维就会变成头脑中僵固的规则，而不会有什么发展。**


    所以，我们的课程也会从目标、方法和与现实的接触三个方面来讲怎么发展自己的思维。今天我们先来讲解目标和张力。


    什么样的思维，能够产生持续行动的张力呢？**对改变而言，经常会遇到一个问题，就是改变很难持久。**


    曾有一个读者写信跟我讨论改变的事。她已经颓废了一段时间，为了让自己不那么颓废，有一天，她发誓要改变自己。


    她说：“当天，我就制定了满满地计划，一项项高效率地完成了。第一天，我很开心。第二天下午，我觉得有点累，没有完成当天的任务，我很沮丧。第三天，我又开始拖延，当天一项任务都没有完成。第四天，我开始思考这么做有什么意义——我的生活就是不断完成任务的过程吗？这些无趣的任务又有什么意义。哦，意义。看来我缺少一点价值感，一点奋斗的理由，一点梦想。于是，我花了很长的时间思考诸如‘我的梦想是什么？’、‘我活着是为了什么？’这样的问题，我开始关心起人生的意义来。”


    **我觉得这个读者对人生意义的寻求也不会帮她走出怪圈，而会变成又一轮颓废、拖延、沮丧和操作的开始。**


    **也许你也经历过这样的循环：打满鸡血、一鼓作气、再而衰、三而竭，最后又回到了颓废的状态，等着下一次再打满鸡血。这样的循环多了，就算有了动力，我们也会怀疑，改变是否可能。**


    那么，这个读者的问题在哪里呢？


    也许你想到了，她需要有一个目标。但其实这个读者也是有目标的，她的目标就是“我不想让自己这么颓废”。所以她去思考梦想和意义的话题，就只是为了让自己不那么颓废。


    可是，这个目标为什么没能给她带来持续的动力呢？


    ### 1. 创造才能制造持续的张力


    我很喜欢的一本书叫**《最小阻力之路》**，作者罗伯特·弗里茨（Robert Fritz），他原来是个作曲家，后来根据自己的创作经验，开始开发创造力课程。


    在这本书里，作者区分了两种产生张力的结构：**创造的结构**和**解决问题的结构**。他说：**只有创造的结构，才能产生持续的张力，而解决问题的结构，是没有持续张力的。**


    ### 2. 创造的结构是怎么样的呢？


    就像画家想画一幅画，作曲家想作一首曲子。他有一个确切的东西想要把它做出来，这就是创造的结构。


    反之，如果你用的不是创造的结构，而是解决问题的结构，那么你就会陷入像刚刚我们所说的读者所面对的那种困境。


    她的目标是“别这么颓废了”。可是，她的动力不是来自于她的目标——她前面并没有类似完成一幅画这样确切的东西。她的动力来自问题本身带来的焦虑。只要她的努力一有成效，焦虑就会缓解，焦虑带来的张力就会消失，张力一消失，她努力的动力就会减少，直到问题重新让她变得焦虑，这种张力才会重新积聚起来。所以才出现了从打鸡血到颓废的不断循环。（重点！！！）


    ### 3. 怎样才能打破这种循环呢？


    一些人想到的策略，是拼命夸大问题的严重性，通过谴责自己，制造焦虑，以获得动力——只要问题在，那动力也总会在。


    所以稍有懈怠，他们就会恶狠狠得对自已说类似“问题已经很严重了，如果你再不改变，就完蛋了。”之类的话。


    可是，当他们这么做，在强化动力的同时，也强化了问题本身。为了保留这种动力，他们不敢让问题好转，只能让自己变得越来越悲观。


    所以，也许有些人也取得了外人看来挺成功的学业或事业，但从内心里，他们并不敢认同和享受这些成功。他们需要“问题”和“挫折”作为动力，持续鞭策他们往前走。这样的结构显然不能持久。


    而创造型思维制造张力的方式，却非常不同。


    以我自己为例。有一段时间，我一直有拖延的毛病，我很不喜欢这种拖拖拉拉的感觉。


    为了治好自己的拖延症，我还专门写了一本小书叫《拖延症再见》。前段时间，我打算写《拖延症再见2》，因为我发现自己的拖延症还没好。


    可正当我要动笔的时候，我的拖延症忽然不治而愈了。


    是我找到了治疗拖延症的秘方吗？不是。是因为我开始准备这门《自我发展心理学》的课了，就是你现在听到的这门课。


    从我构思这门课开始，它就变成了我心里一个很重要的未完成事件。我读书、收集资料，我的脑子里都在想它。我变得紧张又有效率。


    这跟我凭空想怎么克服拖延症的办法，是非常不同的。如果让我凭空努力，哪怕我想出再多克服拖延症的方法，也不会有效。


    为什么创造型的思维会产生足够的张力？《最小阻力之路》的作者，给出了一个意料之外，又是情理之中的答案。他说，是因为爱。


    我觉得是有道理的。因为当这门课还只是我脑子里的一个构思、一个念头的时候，我就很爱它。因为这门课里有我关心的问题，有我想讲给你听的东西，我有足够的张力把它从一个理念变成现实。


    想要把它完成的冲动，变成了一种持续的张力。这种张力不会让我三天打鱼两天晒网，只要我没法完成它，这种张力就会持续存在。


    你越是爱它，越是希望它问世。这种张力就越大，它就越会推动你持续行动，直到最终把它完成。这就是创造的思维结构带来的张力。


    从大的方面来说，我们也可以把人生看作是一个创造的过程，是把我们心里钟

    '
  mdcn: '

    来标定不要轻易靠近的危险区域。


    我们曾感受到的痛苦越大，我们用警示牌标识的危险区域就越大。久而久之，我们自己的活动空间变得越来越小，逐渐无路可走了。


    举个例子来说，我们假设有个叫小罗的年轻人，他刚毕业不久，到一家创业公司工作。


    这家创业公司由于刚起步，每天都要加班到很晚，而且老板因为自己压力也很大，对他非常挑剔。结果做了半年，他挨了老板很多骂，还被开除了。


    这对他说是一个创伤事件，给他留下了心理阴影。那他会怎么想呢？


    如果他受的毒害比较小，他可能想：**我不适合这家公司的**工作。他**对重回这家公司会有恐惧，这是正常的反应**。


    如果把防御的范围再扩大一点，小罗就可想想：**我不适合去创业公司**工作。**这样，他就把所有的创业公司都排除了**。


    如果他防御的范围再扩大一点，他就可能会想：**我不适合去公司工作，也许我应该考个事业单位或者公务员**。


    如果再扩大呢？他就可想想：**我不适合去工作，职场中的人际关系、工作压力，我根本没办法应付。**那他的防御范围就扩大到了**所有的工作，他可能就说选择在家不工作，当一个啃老族了**。


    从“我在这家公司很可怕”，到“创业公司很可怕”，到“公司很可怕”，到“工作本身很可怕”。


    被开除这件事对他的伤害越大，他心中的信念就越抽象，他的思考方式就越绝对化，他防御的范围也会越大。


    反过来也一样，他对这种挫折的思考越绝对，他的情绪反应也会越大，他会越悲观和沮丧。


    ## 3. 悲观思维的三种抽象方式


    这种对挫折的绝对化，也是悲观思维的本质。塞利格曼提出，悲观思维会从三个方向对挫折做绝对化加工：永久化、普遍化和个人化。


    先说说第一种绝对化的方式——永久化。所谓永久化，就是在时间维度上，觉得这件事会一直发生。


    举个例子，假如最近公司业务繁忙，经常需要加班，你当然很不爽。你会怎么理解这件事呢？你可以跟自己说：最近工作很忙，也可以跟自己说：**这个工作总是**没完没了。


    注意这两种说法的差别，前一种说法是把工作忙限定在一定的时间范围内，是最近这样，这也意味着，过一段时间可能会不一样，这就给变化留下了空间。


    而后一种说法呢？这工作没完没了，它给这种状态的时间判断是永久的。**一旦把一件事情永久化了，你就看不到变化的希望，自然就会悲观沮丧**。


    时间上的永久化，也体现在我们形容自己或者别人身上。


    假如因为经常加班，导致你这段时间很疲惫，那么你既可以跟自己说，“我状态不好，我累了”，也可以说，“**我很没用，我完了**”。


    “累了”是一种暂时的状态，它其实是隐含解决方案的。你累了，那你休息一下也许就好了。可是如果“你完了”，这是一个永久性的判断，那就没有变化的可能性了。


    这种永久化也会体现在对他人的判断上。


    在我的咨询室里，吵架的夫妻经常爱说的口语是，“你总是这样，你总是那样”。


    比如，妻子会指责丈夫，“你总是只想着自己，你总是每天不回家”。丈夫就会回应，“我哪有每天不回家，我只是偶尔一两天有应酬而已，而你呢，你总是这样大惊小怪、无理取闹”。


    **“总是”就是一种时间上永久化的说法**。这时候，我就会问他们，有例外吗？有没有丈夫早回家的时候，或者妻子也是体贴你的时候？如果有，就不能说“总是”了。


    用“有时候”代替“总是”，你来体会一下，“你总是不回家”和“你有时候不回家”，后一句指责的味道是不是少了很多？


    **悲观思维的第二种绝对化的方式——普遍化。所谓普遍化，就是从一只乌鸦黑，推广到天下乌鸦一般黑。从一个男人不可靠，推广到天下男人都不可靠。**


    **如果有人对我这不公平，那就是这个世界对我都不公平。**我们在前面举例的小罗，从这家创业公司的工作不好，推广到所有的工作都不好，这就是一个普遍化的例子。


    **悲观思维的第三种绝对化方式——人格化。所谓的人格化，就是觉得所有不好的事情都是针对我的，都是我的错，才会让这些坏事发生。**


    我来举个例子，以前有个朋友因为工作的事情来咨询我，他在金融行业做销售，每天都要打电话给很多客户推销他们的理财产品。


    这些客户对电话销售当然不是很热情，有些会客气地说不需要，有些干脆听到是销售就直接挂了。他有些抑郁，认定是自己很讨人厌才会遭人拒绝，自己很没用。


    这就是一种人格化。


    我问他：“那些接到电话的人，知道你是谁吗？”他说不知道，有些刚听了两个字“你好”就挂了。


    我问：“那其他同事呢？”他说也差不多吧。


    我说：“既然他们都不知道你是谁，既然其他同事的遭遇也差不多，那为什么是针对你的呢？那些人有自己的需要，他们不想被打扰，这是能够理解的，可是你如果说都是针对你的，都是你的错，那你也想太多了。”


    他想了想说，好像也是。后来，为了提醒自己，他做了一张卡片，卡片上写着：**不是我的错**。以后每次打电话，再遭到拒绝，就不会那么郁闷了。


    出现问题的时候，觉得“都是针对我的，都是我的错”，这是一种常有的心理反应。也许你看过这样的电影片段，主角遇到了倒霉的事，他就会对着天空喊：“老天爷，为什么要针对我，我究竟犯了什么错！”


    这就是一种人格化。**我们经常对坏事会有一种奇怪的内疚，有时候明明我们自己是受害者，却仍然觉得是我们的错。**这扩大了我们的防御范围，却让我们陷入了不必要的内疚和自责。


    回过头来看，绝对化思维最大的问题，是为了防御可能的危险，把生活封闭在真空里，让我们不敢接触现实，从而失去了从现实、从生活中疗愈的机会。


    就像那只得抑郁症的狗，明明轻轻一咬就能跳出笼子，它却再也不敢尝试了。**如果生活是一条河，绝对化思维让生活变成了无源之水。**这是绝对化思维最大的问题。


    这几节课，我们讲了三种防御型思维：僵固思维、应该思维和绝对化思维。这三种思维方式看似不同，其实有很紧密的内在联系。


    比如说，父母夸一个孩子聪明，这是一种抽象的评价，会让孩子陷入自我证明的陷阱中，孩子会努力维护自己的形象，从而回避挑战。这就是僵固型思维。


    然后孩子会发展出这样的思维方式：我应该表现得聪明，否则就没有人再喜欢我了。“应该……否则……”。这就是应该思维。


    然后，如果孩子在某件事上没有做好，比如一次考试失败，那他就会想：我连考试都通不过，这就证明了我不够聪明，再做什么都没有用了。这就是绝对化思维。


    所以，**僵固型思维、应该思维和绝对化思维，通常都是同时出现的。它们的核心特点，就是用抽象的思维方式，阻止了我们跟现实发生联系。**


    也许你会好奇，如果我有防御型思维，该怎么办呢？


    别着急，我们下节课就来讲这个问题。


    下节课再见。


    ## Part 16：与自我辩驳，如何突破防御型思维的操控？


    在前面的课程里，我们介绍了三种典型的防御型思维：僵固型思维、应该思维和绝对化思维。也许你会想一个问题：如果我也有三种防御型思维，该怎么改变呢？


    这节课，我们就来介绍一种突破防御型思维的方法，我叫它“与自我辩驳”。


    我们来假想一个主人公，叫小王。他是个典型的理工男。除了工作写代码，平时就宅在家里打游戏。


    他没有女朋友，觉得自己没什么魅力，不会有人喜欢他。


    可是最近，公司来了一个让他动心的女生。这个女生很活泼开朗，他们有工作交集。工作之余，女生也会经常开他的玩笑，让他觉得，对方似乎也对他有好感。


    慢慢地他想：“也许我应该试一下。”


    那天正好是七夕节，他就鼓起勇气约那个女生：“晚上有没有空，一起吃个饭啊？”那个女生很吃惊，犹豫了一下，就说：“不了，我已经有约了。下次吧。”


    女生刚说完，一下子，小王各种情绪涌上心头。失落、生气、屈辱、沮丧，他甚至都没跟那个女生打招呼就直接走了。


    是什么让小王这么愤怒和沮丧呢？


    学了前面的课程，你就应该知道了，不是他约这个女生吃饭，女生没答应这件事本身，**而是小王解读它的方式让他有这么多的负面情绪**。在这里，我们可以回想一下前面所学防御型思维。


    小王也许觉得，跟女生交往的能力是固定的，或者一个人的魅力是固定的，这次挫折证明了自己就是没什么魅力。这是僵固型思维。


    他可能觉得：“既然我好不容易鼓起勇气约了你，你就该答应我。我不该被拒绝，否则我就没有被尊重。”这就是应该思维。


    他也可能想：“我真是太糟糕了，没有女人会喜欢我。我这辈子都不会再谈恋爱了。”这就是绝对化思维。


    这些防御型的思维以自动化的方式**在他的大脑后台运转，让他觉得愤怒和沮丧，也让他再也不愿搭理这个女生**了。


    这样的思维方式并不理性。可有时候，我们就是会有很多不合理的思维，尤其当我们自尊心受伤的时候。


    ### 1. 与自我辩驳的三种方式


    怎么办呢？


    如果你相信理性的力量，相信你能控制自己的想法，那你就要试着来劝服自己，试着发展出一种更理性、更健康的眼光和看法。这就是我们今天所要介绍的改变思维的方式——与自我辩驳。


    这套技术来自理性情绪疗法的创始人，心理学家艾利斯（Albert Ellis）。他说，对于不合理的思维，我们可以从三个方面加以辩驳：


    **第一种辩驳方式，是实证式的辩驳，就是找与不合理的结论相反的证据。**


    小王在七夕节约那个女生吃饭，那个女生说：“不了，下次吧。”这能不能作为证据，来证明小王的想法：“根本不会有人喜欢我呢？”


    这种证明是分层很多层次的。最基础的层次是：这算不算证据，证明这个女生就是拒绝了小王呢？


    并没有。她只是拒绝了小王七夕节的邀请，她甚至还留了点余地，说“下次吧。”也许她真的已经跟朋友有约了，也许她觉得七夕节这是一个比较敏感的时机，不适合作为交往的开始，也许她还没有准备好开始一段关系，这都是有可能的。那它是不是证明了小王的想法：“根本没有人喜欢我呢？”那就更没有了。如果是小王自己在做这个练习，他可以找出很多反例来证明可不是这样。比如，平时这个姑娘也会主动跟他聊天，被拒绝的第二天，这个姑娘还跑来跟他说笑话。如果小王能诚实而理性地面对这些证据，他就会发现，要下“根本没有人喜欢我”这个结论还为时尚早。


    实证式辩驳的重点，是要找一些证据让你看到，事实并没有你想的那么糟。可是，万一事情真的这么糟呢？或者，如果这个姑娘真的是拒绝了小王呢？毕竟这也是有可能的。那也许我们要用第二种辩驳方式。


    第二种辩驳方式，是逻辑式的辩驳。辩驳的重点，是推理的合理性。几乎所有的不理性思维，都有过度推理的问题。


    对小王而言，从被一个姑娘拒绝，他就推理到了“我没有魅力”、“不会有人喜欢我”、“我就是不适合谈恋爱”，可是这种推理合适吗？


    前面讲绝对化思维的时候，我们曾经说过，人有时候会通过抽象化的方式来扩大防御范围。可是从逻辑推理的角度，这是不合理的。


    请你想像，为什么被一个姑娘拒绝，就代表了“我没有魅力”、“没有人喜欢我”呢？这次被拒绝只能证明我这次被拒绝了，不表示我就是一个没有人喜欢的失败者啊。


    如果事实很糟糕，它也只是在此时此地很糟糕。但并不能因此推演出“我会一直被拒绝”、“我就是没人喜欢”，这并不符合逻辑。


    他还可以这样跟自己辩驳：“就算我被拒绝了，我就不能被拒绝吗？”交往的尝试就是包含很多试探和拒绝的。它就是恋爱最普通的一部分。


    如果这样就代表没人喜欢，几乎所有人，都有被拒绝的经历，那是不是代表所有的人都是不被喜欢的呢？这同样是不符合逻辑的。


    可是，只有第二种辩驳方式还是不够。原因在于，一种推理方式，是没有办法否定一种可能性的。


    “我就是觉得自己没什么魅力，没有人喜欢我。”这也许不合理，可是不也不i可能啊？这时候，就要用第三种辩驳方式。


    第三种方式，是实用式的辩驳。简单地说，就要问：“我这么想有什么用。”我不断想着我没有魅力，没人喜欢我，除了让我继续宅着，还有什么用呢？如果我这么想是没用的，那更有用的想法是什么呢？对于我自己来说，我更喜欢这种实用式的辩驳，简单直接，并且不会让自己在复杂的逻辑中绕圈子。


    ### 2. 三种错误的思维倾向


    可是大部分人并不习惯用“有用”、“没用”来思考，他们的思考方式背后，有一些错误的倾向。


    我总结一下，觉得可以把这种错误倾向归结为三类。


    第一种倾向，是认为这个世界上存在着一个所谓的事实真相，一个正确的认识。其实，以前我也这么想，但现在我不再这么想了。对于“我有没有魅力”、“有没有人喜欢我”这样的事情，其实根本没有所谓的真相。探究这样的真相也就毫无意义。


    第二种倾向，是认为自己所想的，就是事实真相，而很少去容纳其他可能性。


    “我自己的事我自己知道。”如果你这样想，你就很难有改变的空间了。


    第三种倾向，是我们也知道自己的想法是非理性的，但是很爽、很带劲，所以就是要这么想。


    比如，“我就是要把她想得狠坏，否则不解我心头之恨。”，“我就是要把自己想得很糟糕，就是想丧一下。”


    关于这一点，我是这么想的：


    有时候，我们确实需要合理地表达自己的情绪，表达自己的失望、沮丧和愤怒。


    可是如果任由情绪把我们的想法带走，那我们就放弃了控制自己想法的责任，也就放弃了做一个理性的人。


    我刚刚提到的实用式的辩驳，跟这三种错误倾向都不一样。它关注的不是真相，而是思维的功能。


    还记得我们在最开始讲心智模式和个人成长的时候所说的话吗？


    我们说，心智模式最重要的功能，是看它是否产生积极的情绪，以及能否产生有效的行动。


    如果我们能控制自己的想法，那也就能控制自己的情绪和行动了。所以对于一个想法，我们要问自己：


    这样的想法会引发我什么样的情绪呢？


    这种情绪是我想要的吗？


    它会触发我什么样的行动呢？


    这种行动是我想要的吗？


    我这么想，会让自己更好呢，还是更糟糕呢？


    这就是一种实用式的想法。


    在健身房里，如果你要练胸肌或者腹肌，教练会告诉你“一二三四”要这样做。


    与自我辩驳，其实也是类似的健脑训练。


    要做这个健脑训练，我们不能怪自己有这些防御型思维。在练习做这种自我辩驳时，有时候来访者会说：“你看我多笨啊，连这点道理都想不明白。”


    如果是这样，那本身就变成了需要辩驳的防御型思维了。你有这些防御型思维很正常，重点是，你也不能放任它破坏你的情绪和行动。


    我的一个来访者在学与自我辩驳以后，跟我说：“我的头脑中好像有两个我，一个是情绪化的我，像个需要人照顾的孩子，在不停地说‘认命吧，你就是没人喜欢。’另一个是理性的我，像是个大人，在不停地说：‘这有什么，根本不是大事，不能因为这点小事停止尝试。’


    那个情绪化的我说得很大声，那个理性的我呢？只有小小的声音，需要很仔细听才能听见。”


    我就跟他说，这个情绪化的你和这个理性的你都是你，但又都不是你。你是另一个人，你是作为裁判的那个体。


    现在，是该由你做决定了，站在谁这一边。那么，如果你是这个裁判，你要站在谁这一边呢？


    总结一下，这一讲我们讲到了跟自己辩驳的三个技巧：实证式的辩驳、逻辑式的辩驳和实用式的辩驳。希望你能好好地利用这些健脑工具来锻炼，不断地突破内心的防御型思维。


    从下节课开始，我们会用三节课的时间，来跟你分享更多思维工具，帮助你发展出更具成长性的思维。


    我们下一讲见。


    ## Part 17：创造性思维，行动的张力从哪里来？


    如果把思维比喻成一条河流，一条河要流动起来，需要有3个条件：

    - 河流落差产生的张力；

    - 控制河流走向的河道；

    - 不断补充的源头活水。


    如果没有落差，河水就会停止流动；如果没有河道，河水就会失去方向；如果没有源头活水，河水很快就会枯竭。


    其实，人的思维发展也是如此。**张力就是目标，河道就是行动的方法，源头活水就是与现实的接触。**


    **如果没有目标，人就不会有行动的张力；如果没有方法，目标就只会制造焦虑，而不会引发有效的行动；如果没有跟现实的接触，思维就会变成头脑中僵固的规则，而不会有什么发展。**


    所以，我们的课程也会从目标、方法和与现实的接触三个方面来讲怎么发展自己的思维。今天我们先来讲解目标和张力。


    什么样的思维，能够产生持续行动的张力呢？**对改变而言，经常会遇到一个问题，就是改变很难持久。**


    曾有一个读者写信跟我讨论改变的事。她已经颓废了一段时间，为了让自己不那么颓废，有一天，她发誓要改变自己。


    她说：“当天，我就制定了满满地计划，一项项高效率地完成了。第一天，我很开心。第二天下午，我觉得有点累，没有完成当天的任务，我很沮丧。第三天，我又开始拖延，当天一项任务都没有完成。第四天，我开始思考这么做有什么意义——我的生活就是不断完成任务的过程吗？这些无趣的任务又有什么意义。哦，意义。看来我缺少一点价值感，一点奋斗的理由，一点梦想。于是，我花了很长的时间思考诸如‘我的梦想是什么？’、‘我活着是为了什么？’这样的问题，我开始关心起人生的意义来。”


    **我觉得这个读者对人生意义的寻求也不会帮她走出怪圈，而会变成又一轮颓废、拖延、沮丧和操作的开始。**


    **也许你也经历过这样的循环：打满鸡血、一鼓作气、再而衰、三而竭，最后又回到了颓废的状态，等着下一次再打满鸡血。这样的循环多了，就算有了动力，我们也会怀疑，改变是否可能。**


    那么，这个读者的问题在哪里呢？


    也许你想到了，她需要有一个目标。但其实这个读者也是有目标的，她的目标就是“我不想让自己这么颓废”。所以她去思考梦想和意义的话题，就只是为了让自己不那么颓废。


    可是，这个目标为什么没能给她带来持续的动力呢？


    ### 1. 创造才能制造持续的张力


    我很喜欢的一本书叫**《最小阻力之路》**，作者罗伯特·弗里茨（Robert Fritz），他原来是个作曲家，后来根据自己的创作经验，开始开发创造力课程。


    在这本书里，作者区分了两种产生张力的结构：**创造的结构**和**解决问题的结构**。他说：**只有创造的结构，才能产生持续的张力，而解决问题的结构，是没有持续张力的。**


    ### 2. 创造的结构是怎么样的呢？


    就像画家想画一幅画，作曲家想作一首曲子。他有一个确切的东西想要把它做出来，这就是创造的结构。


    反之，如果你用的不是创造的结构，而是解决问题的结构，那么你就会陷入像刚刚我们所说的读者所面对的那种困境。


    她的目标是“别这么颓废了”。可是，她的动力不是来自于她的目标——她前面并没有类似完成一幅画这样确切的东西。她的动力来自问题本身带来的焦虑。只要她的努力一有成效，焦虑就会缓解，焦虑带来的张力就会消失，张力一消失，她努力的动力就会减少，直到问题重新让她变得焦虑，这种张力才会重新积聚起来。所以才出现了从打鸡血到颓废的不断循环。（重点！！！）


    ### 3. 怎样才能打破这种循环呢？


    一些人想到的策略，是拼命夸大问题的严重性，通过谴责自己，制造焦虑，以获得动力——只要问题在，那动力也总会在。


    所以稍有懈怠，他们就会恶狠狠得对自已说类似“问题已经很严重了，如果你再不改变，就完蛋了。”之类的话。


    可是，当他们这么做，在强化动力的同时，也强化了问题本身。为了保留这种动力，他们不敢让问题好转，只能让自己变得越来越悲观。


    所以，也许有些人也取得了外人看来挺成功的学业或事业，但从内心里，他们并不敢认同和享受这些成功。他们需要“问题”和“挫折”作为动力，持续鞭策他们往前走。这样的结构显然不能持久。


    而创造型思维制造张力的方式，却非常不同。


    以我自己为例。有一段时间，我一直有拖延的毛病，我很不喜欢这种拖拖拉拉的感觉。


    为了治好自己的拖延症，我还专门写了一本小书叫《拖延症再见》。前段时间，我打算写《拖延症再见2》，因为我发现自己的拖延症还没好。


    可正当我要动笔的时候，我的拖延症忽然不治而愈了。


    是我找到了治疗拖延症的秘方吗？不是。是因为我开始准备这门《自我发展心理学》的课了，就是你现在听到的这门课。


    从我构思这门课开始，它就变成了我心里一个很重要的未完成事件。我读书、收集资料，我的脑子里都在想它。我变得紧张又有效率。


    这跟我凭空想怎么克服拖延症的办法，是非常不同的。如果让我凭空努力，哪怕我想出再多克服拖延症的方法，也不会有效。


    为什么创造型的思维会产生足够的张力？《最小阻力之路》的作者，给出了一个意料之外，又是情理之中的答案。他说，是因为爱。


    我觉得是有道理的。因为当这门课还只是我脑子里的一个构思、一个念头的时候，我就很爱它。因为这门课里有我关心的问题，有我想讲给你听的东西，我有足够的张力把它从一个理念变成现实。


    想要把它完成的冲动，变成了一种持续的张力。这种张力不会让我三天打鱼两天晒网，只要我没法完成它，这种张力就会持续存在。


    你越是爱它，越是希望它问世。这种张力就越大，它就越会推动你持续行动，直到最终把它完成。这就是创造的思维结构带来的张力。


    从大的方面来说，我们也可以把人生看作是一个创造的过程，是把我们心里钟

    '
