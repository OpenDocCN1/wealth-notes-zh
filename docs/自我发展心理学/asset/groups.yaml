    \ 100 多万读者。\n\n无论是和来访者的深度沟通，还是和读者各种形式的互动，我都深深地感觉到：其实每个人都在关心自我发展。\n\n如果一个人的发展受限了，他就会遇到很多的纠结和痛苦。\n\
    \n所以，我非常渴望有机会，有这样一个平台，能在这里把我所了解的知识和经验都讲给你听。\n\n今天，这门课终于上线了。\n\n### 2. 这是一门关于改变的课\n\
    \n说到改变，我们都很熟悉。比如：想减肥、想锻炼、想早睡早起、想读书、想换工作、想表白、想结束一段关系……\n\n我曾经开玩笑说：一年 365 天，我们可能有\
    \ 364 天都是在想着怎么改变的。但真实改变却很难发生，即使发生了，也往往是三分钟热度，半途而废。\n\n为什么改变就这么难呢？\n\n我们经常想到的理由是：自己意志力不够坚定，或者行动力太弱；有时我们也会把不能改变的责任推卸给外在环境，觉得新工作太难找、同事太坏、家人不支持等等。\n\
    \n可是，我想告诉你的是：改变非常难，其实难在你心里。\n\n你的心理系统就像一个鱼缸，而你就像鱼缸里的那条鱼，你在里面游看起来很自由，其实，你是被限制住了。\n\
    \n人生突破的本质是心理系统的更新。在这门课中，我最重要的任务是带领你检查你的心理系统，启动自我发展的进程。\n\n这门课分为五章：\n\n- **第一章**，我将从行为出发，告诉你如何养成一个好习惯。怎样走出心理舒适区，迈出改变的第一步。\n\
    - **第二章**，我将带你了解你的思维系统，告诉你如何让心智变得更成熟。我要带你看一看你的大脑是不是有很多的防御性思维，并把成长型思维的工具介绍给你。\n\
    - **第三章**，我会带你一起来拆解身边复杂的人际关系，告诉你如何突破爱恨情仇的迷局。不健康的关系是如何限制你的？而拥有高质量的关系，你又需要成为一个什么样的人？\n\
    - **第四章**，我们将穿越人生的重大转折期，告诉你如何走过人生的艰难时刻。职业转换、亲人离去、情感变故、遭受创伤……这些我们人生经常会遇到的坎，如何塑造了你的心理结构？你又该如何去对付它们？\n\
    - **第五章**，我将从整个人生的角度来告诉你，如何绘制自己的人生地图。人生的不同阶段都有它自己的使命，而理解这一个使命，这一不同阶段的课题，能够提示我们，该从哪里突破。\n\
    \n### 3. 那么，听完这门课，你将收获什么呢？\n\n首先，你会得到一套改变与发展的实用工具。\n\n在这门课程中，我会把咨询中反复使用过的、最有效的工具告诉你。教你如何辨析心理系统中的\
    \ bug，如何重建一个从容的自我。\n\n其次，我会为你提供这些工具的使用说明书。\n\n12 年的咨询生涯，让我见识了很多的故事，我会把其中最有启发性的故事讲给你听，也包括我自己的故事。\n\
    \n心理学的概念和工具往往容易比较抽象，我们也很容易把它们变成和我们无关的、很远的知识。\n\n而我能够帮助你把这些工具和你真实的生活结合起来，让它真正变成你的东西。我要讲的，就是你的事。\n\
    \n最后，也是我希望能带给你的，是内省的习惯和思索线索。\n\n这门课并不是一个包治百病的医疗工具箱，而是你深刻透视自己内心的窗口。\n\n改变的前提是理解自己，而理解自己就需要你有内省的能力。自我很复杂，没有系统的心理学方法，你很难真正读懂自己。\n\
    \n所以这门课，我希望你能理解自己的思考方法，并形成内省的习惯。请记住，**内省，才是我们自我发展真正的动力**。\n\n俄罗斯著名文学家陀思妥耶夫斯基曾经说过一句话：\n\
    \n> 有些话你只能讲给朋友听，有些话连朋友都不能讲，还有一些话你甚至都不敢讲给自己听。\n\n**在我看来，正是那些不敢讲给自己听的话，才真正塑造了你自己。**\
    \ 而我们这门课，就是要让你听到那些你不能讲给自己听的话。\n\n我希望，这门课能成为你自我发展路上的伴侣。同时我也希望，有一天你不再需要我，因为那时候，你已经独自开拓到了很远的地方。\n\
    \n欢迎加入《自我发展心理学》，也希望你能把这门课分享给你最亲密的爱人和朋友。\n\n让我们一起来实现人生的突破。\n\n## Part 1 导论：关于改变，你一直都有选择\n\
    \n现在，你和我一起站在了这 50 讲课程的起点，在最开始的这一刻，我想先请你思考一个问题：\n\n你加入《自我发展心理学》这门课，希望从这门课中得到什么呢？\n\
    \n当你在思考这个问题的时候，你其实是在思考自己和这门课的关系。\n\n我们不妨来做一下选择题。在下面三个选项中，你会选择哪种心态来参与这门课程呢？\n\n\
    - A. 来参观的\n- B. 来抱怨的\n- C. 真正想要改变的\n\n来参观的学习者，只想浮光掠影地了解关于改变的知识；\n\n来抱怨的学习者，只想证明改变有多难，自己有多少理由没法改变；\n\
    \n而真正想要改变的学习者，会把这些课程里提到的理念和方法，用到自己的生活中，你会把这门课当做工具，去反思自己的生活。\n\n我希望你是第三类学习者，因为这不仅意味着你会更投入，你愿意信任我，而且，这门课也会成为连接我们彼此的桥梁。\n\
    \n所以，你准备好了吗？\n\n现在，我们就正式进入《自我发展心理学》这个课程。\n\n### 1. 改变，你一直都有选择\n\n我已经做了 12 年的心理咨询师，一直在致力于帮助我的来访者改变。在工作中，我发现一个很有规律的现象，很多来访者会这么开始跟我的谈话：\n\
    \n> “老师，我很痛苦，我渴望改变，但我没有选择。”\n\n为什么没有选择呢？他们把问题归为难以控制的环境，归为充满敌意的社会，世界的不公平，或者自己无法改变的家庭和过去。\n\
    \n这些外在因素在不停地影响他们，让他们觉得自己没有选择。所以，他们停住了发展的脚步，在原地停止不前。\n\n这些来访者让我意识到，人生有没有选择这个问题，是开启改变的前提问题。你相信你的人生真的会陷入没有选择的绝境吗？如果你相信它是真的，那你就失去了改变的可能。\n\
    \n而我在咨询中要告诉来访者的第一件事，也是我在这里想告诉你的第一件事是：\n\n> “关于改变，你其实一直都有选择。”\n\n- 当你告诉自己你不行的时候，你已经做了选择；\n\
    - 当你待在一个只能满足温饱，没什么前途的公司时，你已经做了选择；\n- 当你用拖延躲避工作压力时，你同样做了选择。\n\n改变是一种选择，不改变也是一种选择。\n\
    \n你为自己不改变所找的所有借口，像是没钱、没时间、太麻烦、没必要……它们统统都是你的选择。甚至连告诉你自己“我没有选择”，那也是你的选择。\n\n意识到你有选择，这是我们开始改变的前提。可为什么我们总觉得自己没有选择呢？\n\
    \n我认为，这主要有两个原因：\n\n第一个原因是，你误认为只有你的选项足够理想，这才算有选择。如果你的选项不够好，那就是没有选择。\n\n其实，并非如此。\n\
    \n选择是基于当前的现实，而不是我们头脑中的理想。我们选择的，也不是未来的结果，而是此时此地的行动。（重点！！！）\n\n比如说，我现在在做一份不那么喜欢的工作，我没有办法去做一份我希望的理想的工作。因为我需要养活自己，所以我觉得自己没有选择。\n\
    \n其实，这句话正确的表述是：你还不愿意为自己喜欢的工作去冒险，所以选择忍受一份不那么喜欢的工作，来养活自己。\n\n这是一种可以理解的选择，但我并非没有选择。不说的，至少养活自己的办法，绝对不止一种。\n\
    \n我们觉得自己没有选择的第二个原因是，逃避对自己的责任。\n\n表面上，我们都希望自己有更多选择，而实际上，我们却经常在逃避选择。因为有时候，强调我们有选择，并不是一件让人舒服的事情。\n\
    \n因为这会很容易让你想到另一个问题：既然我有选择，那我现在过得不好，是不是我自己错了？\n\n我希望你不要这么想。讨论对错的思维方式，它通常会假想一个施害者和一个受害者。\n\
    \n当我们说自己没有选择时，我们是把自己放到了一个受害者的位置，我们可以借此把责任推卸给想象中的施害者，无论这个施害者是环境还是他人。这样，我们就不会有心理负担了。\n\
    \n在这里，我希望你换一种思维方式，不是思考“谁对谁错”，而是思考“有用没用”。\n\n如果你强调自己受过去、环境和他人所限，自己没有选择，这对你的改变有什么用吗？你没改变，也许不是你的错，可是，最终要为结果负责的人是谁呢？还是你自己。\n\
    \n### 2. 改变需要勇气\n\n在心理咨询里，我始终在帮助来访者承担起自己对改变的责任，帮助他们看清自己做出的选择。但是我必须说，对任何一个人来说，这都不是一件轻松的事，它需要巨大的勇气。\n\
    \n斯科特·派克（Scott Peck）是美国著名心理医生，他有一本经典的《少有人走的路》。\n\n在书里，他讲了一个自己的故事：\n\n年轻的时候，因为责任心太强，他总是把工作日程表排得满满的，别的同事每天下午\
    \ 4 点半就下班了，他却要接诊到晚上八九点。这样，他老婆抱怨他不回家，他也很疲惫，有很多怨言。\n\n有一天，他就去找他的主任医生商量，能否安排他几周不接来访者。\n\
    \n主任医生听完他的抱怨，同情地说：“哦，我看到你遇到麻烦了。”\n\n他很感激地说：“谢谢您，那您认为我该怎么办呢？”\n\n那个主任医生又重复了一遍，说：“我不是告诉你了吗？你现在有麻烦了。”\n\
    \n派克很生气：“是啊，我是有麻烦了，所以才来找您啊，您认为我该怎么办呢？”\n\n主任却说：“好好听我说，我只对你再讲一遍，你要认真听好：我同意你的话。你现在确实有麻烦了，你的麻烦跟时间有关。是你自己的时间，不是我的时间，所以不是我的事。”\n\
    \n如果你听到一个领导跟你讲这种莫名其妙话，估计你也会生气。当时派克医生就气得要命，觉得这个主任简直不可理喻。\n\n可是三个月后，他忽然就认识到了：主任说得没有错。\n\
    \n我的时间是我的责任，如何安排时间应该由我自己来负责。花更多的时间接待来访者，这也是我自己选择的结果。\n\n那当初他为什么要去找主任说呢？他其实是在说：“为我负责吧，你可是我的上司，我没有选择，只有你能帮我选择。”\n\
    \n你看，一个训练有素的心理医生，都会不自觉地把选择的责任推给别人，更何况我们这些没有受过训练的普通人？\n\n所以，选择改变不是一件容易的事，它很难，需要勇气。可是，没有什么比走一条艰难的路更能促进人的自我发展了。\n\
    \n### 3. 改变需要自省\n\n改变需要勇气，但只有勇气是不够的，我们还需要有反省自己的能力。只有不断地审视自我，才能触发改变。\n\n我有一个来访者，她的妈妈是一个非常焦虑的人，经常指责和打骂她，这给她带来了很大的不安全感。可是，当她自己当了妈妈，有了女儿之后，她也经常指责自己女儿的种种不是。\n\
    \n有一天她来跟我说：“你知道吗，有时候我羡慕我妈妈。我妈妈有很多问题，可她的人格是完整的。她从来不觉得自己有什么问题，都是别人有问题。可是这么多年，我读了很多书，受了很好的教育，我反而分裂成了两个人。一方面，我很像我妈妈，另一方面，我又很厌恶自己像她；一方面我不停地指责女儿，另一方面，我又在不停地指责，那个指责我女儿的自己。”\n\
    \n我跟她说：\n\n你跟你妈妈不同的地方，是有价值的。因为你有内省。反省并不轻松，它有时候还让人痛苦，可这正是改变的契机。\n\n最后，我想给你讲一个故事。\n\
    \n据说，著名心理学家阿德勒（Alfred Adler）的咨询室里放着一根三面柱。柱子的一面刻着“我很可怜”，另一面刻着“别人很可恶”，最后一面刻着“怎么办？”。\n\
    \n每次有来访者到他的咨询室里，他都会拿出他的三面柱，问来访者：“你选择谈什么呢？”\n\n现在，如果你面前也有一根三面柱，我问你同样的问题，你会怎么选择呢？\n\
    \n我相信你一定有很想改变的事情，小到早睡早起，提高工作效率，这样的生活习惯；大到怎么让自己心智变成熟，怎么建立高质量的关系，怎么走过人生的艰难时刻。\n\n\
    为了要让我学习更有效，你不妨现在就找一个最想改变的目标。这样，你就能把每节课学到的内容应用到自己身上。随着课程的深入，你一定能更深刻地看清自己，看清问题，这能帮助你改变。\n\
    \n下节课，我们就正式进入课程的第一章——如何启动行为的改变。\n\n为什么我们常常立志要做出改变，却总是三天热度，最后无疾而终？ 推动改变的是我们的决心，我们的意志力，还是另有其它的力量？\n\
    \n从下节课开始，我们将开启我们的改变之旅。\n\n## Part 2：改变的本质，如何创造新经验\n\n我们对改变的成功经验可能并不多，但对改变的失败，一定经验丰富。\n\
    \n比如，我们经常会做新年计划，每年跨年的时候，都会又憧憬又悔恨地跟自己说：新的一年一定要不一样，要变成更好的自己。第二年、第三年……同样的计划塞满了抽屉，可最后，它们都仍然只是计划。\n\
    \n行为的改变为什么这么难？我们到底要怎么做，才能启动行为的改变呢？\n\n要弄清楚这个问题，我们首先得搞明白改变的本质到底是什么。\n\n### 1. 两个自我：大象和骑象人\n\
    \n有一项医学调查说，心脏科医生告诉患者，如果他们不改变自己的生活习惯，比如不健康的饮食、不运动、抽烟等，他们将必死无疑。\n\n可即使在这种情况下，也只有七分之一的人会真正改变。其余七分之六的人是不想活了吗？当然不是。他们也知道该怎么做，可就是没法改变。\n\
    \n这是我们在改变中经常遇到的问题。\n\n我们心里有一个行为标准，希望自己做到，却经常被现实打脸。好像心里有一个自己，而现实却是另一个自己。\n\n有时候，我们明明讨厌自己的某个行为，比如拖延症，却怎么也改不了。这个时候，我们就会有很多内疚和自责，就会怪自己意志力薄弱，不够努力。\n\
    \n可是，内疚和自责并不能带来改变。你该认真思考的是，我为什么控制不住自己呢？\n\n也许你没有意识到，你的躯体里其实有两个自我。一个是感性的自我，一个是理性的自我。\n\
    \n区分这两个自我，理解他们之间的关系，对于理解改变，非常重要。\n\n积极心理学家乔纳森·海特曾用一个有趣的比喻，来描述两个自我之间的关系。\n\n> 他说：人的情感面就像一头大象，而理智面就像一个骑象人。\n\
    \n骑象人骑在大象背上，手里握着缰绳，好像是他在指挥大象，但事实上，他的力量微不足道。一旦和大象发生冲突，他想往左，而大象想往右，那他通常是拗不过大象的。\n\
    \n对于改变而言，理智提供方向，而情感提供动力。\n\n如果你的理性想要改变，就需要了解感性大象的脾气和秉性，利用大象的特点，这样才能事半功倍。否则，改变将非常困难。\n\
    \n这个比喻能帮助我们形象地记住两个自我的关系。\n\n那么，大象的脾气是怎么样的呢？它有三个特点。\n\n第一个特点：力量大。\n\n一旦它被激发了，理智就很难控制它。\n\
    \n第二个特点：它是受情感激发的。\n\n它既容易被焦虑恐惧等消极情绪驱动，也容易被爱、怜悯、同情、忠诚等积极情绪所驱动。所以它既可能成为改变的阻力，也能成为推动改变的强大动力。\n\
    \n第三个特点：它是受经验支配的。\n\n也就是说，它只认我们切实体会过的“经验的好处”，而不认我们理智所构想的“期待的好处”。\n\n大象的前两个特点，比较好理解。我们的重点应该放在它的第三个特点上，因为这个特点与行为改变是直接相关的。\n\
    \n### 2. 大象转向“经验的好处”\n\n什么是经验的好处呢？想要理解它，你得先理解期待的好处。\n\n期待的好处是我们想象中的好处。比如：\n\n\
    - 我们都能想到，每天早起跑步，会更有精神；\n- 不拖延，会更高效、更有成就感；\n- 坚持健康饮食会让我们的身体变得更好。\n\n但是这些是我们想象出来的，我们并没有深刻地体验过这种好处。\n\
    \n相反，我们体验过睡懒觉时温暖的被窝，打游戏的快乐，胡吃海喝的感官刺激，这些都变成了我们亲身经历过的坏处。\n\n期待的好处是抽象的，而经验的好处是具体的；\n\
    \n期待的好处发生在未来，而经验的好处发生在过去或者现在；\n\n期待的好处是被教导出来的，而经验的好处是我们通过亲身体会，真实地感受到的。\n\n当这两个好处发生冲突时，虽然骑象人想要寻求那个“期待的好处”，而大象却不由自主地转向了那个“经验的好处”，哪怕有时候这个“期待的好处”要比“经验的好处”大得多。\n\
    \n要理解大象的选择，我们需要回忆一下学生物知识：巴甫洛夫和他的狗。你还记得条件反射吗？\n\n最开始，巴甫洛夫的狗看到肉会流口水，听到铃声没反应。但是，巴甫洛夫每次在给狗喂肉之前，都会先打铃。\n\
    \n久而久之，狗只要一听到铃声，哪怕没有肉，也会流口水。这就叫条件反射。\n\n一个条件反射包括三个因素：刺激、反应和强化。在这个实验里，刺激是铃声，反应是狗流口水，强化是肉。\n\
    \n这里的强化，其实就是经验的好处。\n\n一旦我们的某个行为获得了这种好处，它就会被保留到我们的生命里，哪怕我们没有意识到，它仍会影响我们的行为。\n\n\
    强化不仅有正强化，还有负强化。什么意思呢？\n\n正强化是当你表现出某种行为时，通过增加你想要的结果，让你的行为更巩固。\n\n比如：获得高额奖金会让你努力工作。\n\
    \n而负强化是当你表现出某种行为时，通过减少你不想要的结果，来让你的行为更巩固。\n\n比如：为了防止被扣奖金，你也会努力工作。\n\n现在，你应该理解大象为什么总是不由自主地转向“经验的好处”，因为它会通过强化，塑造我们的行为，所以行为的改变才会那么难。\n\
    \n**案例分析：**\n\n前不久，我接待了一个来访者，大学刚毕业不久，在一个陌生的大城市工作。\n\n每天晚上下班，她都会搜寻当地有名的小吃店，大特特吃，直到吃撑了还不能停手。她很苦恼，想要改变，却控制不住自己。\n\
    \n为什么她会这么依赖食物呢？\n\n她跟我说，她所在的公司是一个世界 500 强的大公司，压力很大，经常要加班到八九点。她一个人租着房子，回家空荡荡的没什么意思。所以寻找美食成了她唯一的娱乐。\n\
    \n每天下班以后，她都会坐上地铁，到某个人来人往的闹市区，找个甜品店坐下。她喜欢一边吃，一边看那些熙熙攘攘的人群，感受闹市的烟火气。\n\n每次吃完，一想到要回到那个空荡荡的家，她就跟自己说：那不如再待一会，反正回去也没意思。结果就吃撑了。\n\
    \n我想请你跟我一起思考：\n\n1. 在这个例子中，引起行为的刺激是什么？\n\n   不是美食，而是孤独。这个刺激是从她下班想到“自己回家后一个人空荡荡”开始的。\n\
    \n2. 与刺激相对应的应答行为是什么？\n\n   也不是吃，而是包括吃在内的挤地铁、到闹市区，看着人群并感觉到烟火气，这一系列的行为。\n\n食物当然是一种强化，但它带来的最重要的好处，不是美味，而是用寻找食物的过程，用吃所带来的感官刺激，避免了自己在异乡感受到的压力和孤独感。\n\
    \n这么说来，她的大吃大吃，不仅是一种获得食物的正强化，更是一种通过吃来逃避孤独的负强化。而这种强化，让她很难控制自己，做出改变。\n\n说到孤独的时候，我看到她眼里有泪花，我知道我说的是对的。\n\
    \n于是，我就跟她说：“人生已经很难了，你也不需要完全否定吃美食，这毕竟也是一个减压方法。最重要的是，我们要找一个更健康的替代方式，比如跑步健身、参加读书俱乐部、跟朋友看电影等等。”\n\
    \n我建议她每周一三五去试验新方法，二四六用“吃”这个老方法，看看哪个会感觉更好一些。\n\n最后，她找到了一家羽毛球俱乐部。在那边认识了几个朋友，慢慢的，她也能够控制自己的饮食了。\n\
    \n所以，**当我们改变失败的时候，责怪自己是没有用的，因为我们的行为并不是独立于环境而存在的**。\n\n所谓的“好处”或者“坏处”，其实就是我们与环境交换信息，获得反馈的过程。\n\
    \n刺激和强化，就是**我们与环境建立联系**的方式。\n\n### 3. 改变的本质：创造新经验\n\n改变的本质是什么呢？其实就是创造新经验，**用新经验来代替旧经验的过程**。\n\
    \n创造新经验需要通过新的行为，获得新的反馈，新的强化，并**亲身感受**到它。**亲身感受到的经验，这跟你听来的道理很不一样**。\n\n如果你只有想象中的期待，而没有新行为所带来的新经验，改变就很难发生。\n\
    \n总结一下。到目前为止我们了解了改变的本质，那就是创造新经验。\n\n我们也知道了，**“经验的好处”会通过强化塑造我们的行为，让我们的新经验变成新习惯**。\n\
    \n这么看，改变似乎也不难啊，我们去创造新经验，并不断强化它就好了吗？事情没有那么简单。\n\n下节课，我们就来讲讲，为什么我们总是抱住旧经验不放，它背后的心理机制是什么。\n\
    \n我们下一讲再见。\n"
