    爱的理念变成现实的过程，而不是解决问题的过程。


    当然，这并不是说我们不需要解决问题了，为了完成梦想，你需要解决很多的问题，但是解决问题不应该成为行动的动力。你真正热爱的目标才是这个动力的来源。


    # 4. 创造型思维和解决问题思维的根本区别


    创造型思维把事情分成了简单的两部分：

    第一个部分，是我想要完成的作品。

    第二个部分，是我所面临的现实。


    前面我们谈了第一个部分，下面我们来谈谈我们与现实的关系。

    也许你会想，我也想有自己的目标，我也想去实现自己的梦想，可是我所在的现实不允许该怎么办呢？


    很多人都有过这样的疑问。曾有个朋友来咨询我，说他想去从事研究工作，可是他经济有困难，没法继续去读书深造，只能做一个他那么想做的工作。

    **暂时没钱去追求梦想，这就是一个事实。**


    **创造的思维并不是让我们忽视现实，相反，只有正视现实，才能实现自己想要创造的东西。相反，创造型思维会让我们用一种不同的目光去看清现实。**

    创造型的思维，会把这个事实看作是创造的条件限制。如果我遇到了这样的限制，我就要想办法去解决它。而解决问题思维会把这个限制看作是目标是否成立的前提。如果我遇到这种限制，那也许我就该放弃目标。这是两者的区别。

    一个创造型思维的人可能会想：“我想要继续去读书深造，可是我现在确实没钱，怎么才能解决我读书深造的目标呢？如果钱真是我深造的前提条件，那我要先去挣钱。”

    当他在挣钱的时候，他是知道自己为什么这么做的。

    可是，一个解决问题思维的人就会想：“**现在连钱都没有，还谈什么读书深造，这压根就不现实。于是就放弃了自己的目标。**”


    这就是创造型思维和解决问题思维的根本区别。


    创造型思维是以目标去思考现实，先想我要什么，再想现实是怎么样的，环境能够提供什么，再去想办法弥合目标和现实之间的鸿沟。

    而解决问题思维是以现实思考目标。先去想环境能够提供什么，再来想自己的目标是不是实际的去树立怎么样的目标。

    大部分人都是从现实出发去思考问题，而不是从想要的东西来思考现实。当他们这么想的时候，自然无法突破现实的限制，也就没有持续的张力了。


    说到这里，我们要回过头来总结今天的课了。

    今天我们讲了，只有创造型思维才能产生持续行动的张力。创造型目标制造了张力，而张力能够产生持续行动的动力，帮助我们去有效地应对和组织现实。

    打个比方，创造一个东西就像生一个孩子。生孩子的过程，并不需要强迫自己努力，你只需要爱这个孩子就可以了。

    另一方面，创造也需要我们去认清现实、加工现实，而不是逃避现实。

    创造型思维为我们制造了张力，但是怎么把这种张力变成我们持久的行动力呢？

    下节课我们来讲述这个问题。

