    # 2.管理错误的三种方法


    现在我们知道了克服僵固型思维的核心，是改变对错误的认识，但是这件事说起来容易做起来难。我们要怎样转变对错误的看法呢？


    我总结了三种方法。


    **第一种方法，就是把错误看作是学习的机会。**


    「得到」里很多老师都提过**《原则》**这本书。这本书里，讲到了桥水公司对错误的态度，**就是公司不会惩罚员工犯的错误，而是鼓励员工讨论所犯的错误**。为此，公司甚至还专门成立了一个错误档案，把所有人所犯的错误记录下来，供公司其他员工来学习。


    在提到为什么要对错误保持这种开放的态度时，这本书的作者说：


    **错误是一定会犯的。如果我们惩罚错误，其实就是鼓励大家把错误都藏起来。这样，我们就失去了从错误中学习的机会，这对公司的损失会更大。**


    我在很多我钦佩的人身上，看到了这种对错误的开放态度。


    有一次在一个浙江大学心理学校友会的活动中，阿里云的总裁王坚老师给我们做了一个演讲。


    他毫不讳言地讲起自己最初在阿里云时，所犯的各种错误。谈到这些错误时，他说：


    **学费是一定要交的，我很高兴，这些学费一开始就交了。如果是交在后面，那也许阿里云的发展就不一定能够承受得起。**


    正是这种对错误的开放态度，支持着他从一个大学老师不断转型，最终把阿里云这件事做成了。


    **转变对错误看法的第二个方法，是突破自己不会犯错的形象。**


    **僵固型思维的特点是担心犯错。担心犯错，其实就是在维护自己不会犯错的形象。**


    所以如果我的来访者因为僵固型思维来咨询，我一开始就会劝他们放弃不会犯错的形象。


    我有一个来访者，刚到一个公司上班，每天加班到很晚，觉得压力很大。


    我问他：“是你们所有人都这样，还是你自己这样呢？”


    他说：“好像也不是所有的人都这样，就是我自己这样。因为我有很多东西不知道，需要自己去摸索，就会浪费很多时间。”


    我说：“那你为什么不去跟别人请教呢？”


    他沉默了一会说：“**如果我一开始犯了很多错误，我就担心别人知道我这连这么简单东西也不会，怕他们笑话我。**”


    **他就是为了维护什么都会的聪明形象，而把自己封闭起来，结果给了自己很大的压力。**


    **按理说，一个刚到公司的新人的不需要这种“我什么都会”的自我形象的。可是有时候很奇怪，人越是焦虑，越就不愿意跟别人请教，结果就变得越来越封闭。**


    这种错误不仅刚进公司的员工会犯，公司的高层也会犯。


    我有一个来访者，是投资人，自己带一个团队，业绩做得非常好，团队的人也都很信任他。


    可是前段时间，他因为自己的判断，错过了一个投资机会。如果抓住这个投资机'
