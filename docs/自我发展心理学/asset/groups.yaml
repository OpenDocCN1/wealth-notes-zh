    ## Part 8：情感触发原理，如何让改变自然发生？


    这节课，我们来讲引发行为改变的第四个原则——情感激发。


    经常有人说：知道很多道理，却依然过不好这一生。原因是，作为理智的骑象人和作为情感的大象，都有各自的主张。可大象的力量要大多得多，这也是我们前面所讲的，大象的特点之一。


    我们常说：让改变发生需要“动之以情，晓之以理”，这两个词的顺序是很有讲究的。你得先让大象有所触动，它才能听得进去道理。


    在咨询室里，如果来访者跟我说：“道理我都懂。”那我就会想，坏了，这个咨询没起作用。因为，当他说“道理我都懂”的时候，他其实是在说：“你说道理我不想听。”他已经把道理放到了很远的，跟他无关的位置上了。为什么？肯定是没有触动他的大象。


    改变需要情感的触动。如果没有情感认同，就不会有改变的发生。大象既容易被焦虑、恐惧这样的消极情感触动，也容易被爱、怜悯、同情、忠诚这样的积极情感触动。可是，到底怎么才能激发我们内心深处的情感，并带来改变呢？


    ### 1. 越自责，越放纵


    人们习惯的方式，是用焦虑恐惧，也就是用恐吓的方式来促成改变。原因是，焦虑和恐惧的力量最强大，最容易被激发和控制。比如：


    - 在学校里，老师用批评来让学生听话；

    - 在工作里，公司用末位淘汰制来让员工努力干活。


    我们也总是习惯用自责的方式来给自己压力，觉得这样能促成进步和改变。每次面临改变的时候，我们都会分裂成两个自我：一个上进、正义的自我，一个堕落、邪恶的自我。


    上进的自我总是责备那个堕落的自我，而堕落的自我，经常会无地自容，觉得自己一无是处。焦虑和内疚就这么产生了。我们本能地相信，内疚和自责能够帮助我们实现改变。就像小时候，我们淘气、偷懒，严厉的老师或者父母就会监督我们做作业。成功学也是这么喊口号的：想成功吗？就要对自己狠一点。你可能也会经常说：最好能把自己骂醒，如果不能改变，那一定是你骂得不够狠。


    可是，内疚和自责能推动大象改变吗？当然不能。要不然我们也不会一边内疚自责，一边拖延着不愿意改变了。


    原因在哪里呢？


    原因在于：很多你想改变的应对方式，比如：吸烟、乱吃东西、拖延，就是为了应对焦虑和压力而产生的。现在，内疚和自责增加了你的焦虑和压力，那你会用什么办法处理它们呢？当然还是吸烟、乱吃东西、拖延这些老方法了。


    所以，越是自责，你就越容易放纵自己。这就陷入了“放纵——自责——更严重地放纵”的恶性循环。（重点！！！）


    有人说，为什么我越自责就越拖延了呢？就是这个道理。


    曾有一个禁烟广告的实验。广告上画的是两片黑黑的肺叶被香烟烧成了一个窟窿。这个广告非常恶心，大象一看就会被吓到。可是，广告的效果却不如想象得那么好。为什么大象明明被触动了，却不起效呢？


    原因很简单，很多时候，你吸烟是为了什么？就是为了减压。可是看到这种广告，你的压力会减轻吗？不会，相反，你变得更焦虑了。一焦虑，就来根烟压压惊吧。用焦虑、恐惧、内疚的情绪来激励大象，大象只会焦虑烦躁地在原地打转。（重点！！！）更何况，内疚和自责还会降低你的自尊，让你觉得自己懒惰、一事无成，进而破罐子破摔。


    你要知道，那个你责备的自己，也正是那个要承担改变责任的自己。如果你都已经把自己骂得士气低落，那你还哪里有勇气和力量去改变呢？


    也许你要问：真的是这样吗？我看过周围有一些人对自己要求很高，有很高效率，也取得了不错的成绩。他们难道不是把内疚和自责当推动力吗？如果内疚和自责没有用，那他们又是怎么维持对自己的高要求呢？


    ### 2. 大象能听谴责


    我的心理咨询老师是一个非常严厉的老太太。无论从哪点来说，她都跟温柔善良扯不上关系。


    第一年学咨询，她就一直在批评我：你这里说得不对，那里说得不对；你又没有思路；你只在看自己想看到的东西等等。


    那段时间，我的士气很低落。这里既有对自己总也做不好的愧疚，也有对老太太不近人情不满。可是，这种愧疚并没有让我更努力地学习。相反，看到心理咨询的一堆学习材料，我还有些犯怵。虽然我一再责怪自己不够努力，大象却总也迈不开步伐。


    一年的学习快要结束了。在课程的最后一天，老师给我们讲了她的老师——家庭治疗大师米纽庆的一些事。


    她说：她年轻的时候，有一天拿着个案去找米纽庆督导。她做的是希腊家庭的来访者，人很多，过程也很乱，她好不容易控制住了场面，但也没有很出彩。听她报告完个案，米纽庆就让其他学生提意见。


    这些欧美的学生，纷纷说做得好。其实他们是觉得，一个亚洲的小女孩，又有语言和文化差异，能做出这样已经不错了。


    米纽庆没说话，静静地听完大家的意见，他开口了。他说：


    “她是我最好的学生之一。你们说她做得不错，其实是在说，她只能做到这样的程度了。”


    听米纽庆这么一说，大家开始认真地思考，提了很多批评和建议。


    老师说：“现在米纽庆已经去世了，我也老了。我要把他教我的东西告诉你们。你们来这里不是为了爽的。如果我只是表扬你们，那我其实也是在说，‘你们只能做到这种程度了。’我不停地批评你们，挑战你们，是相信你们完全能做得更好。”


    那一瞬间，我心里的那只大象就被触动了，我理解了老师的用意。


    从那天开始，我对自己的要求就提高了。这种自我要求并没有变成内疚和自责，更没有变成一种负担。相反，它的背后有一种“我能做得更好”的自豪感。这种自豪感里，有老师对我的期待，也有我对老师的认同。在这种关系中，批评变成了一种信任和期待。


    第二年，老太太还是那么严格，对我还是有很多的批评，但是我对批评的感觉却变了。严格的要求还是带来很大的压力，但它也变成了动力。


    所以，问题不在于要不要对自己提高要求，而在这种高要求背后，你对自己究竟是厌恶，还是爱和期待。只有后一种感情，才是触动大象改变的力量。


    我曾遇到过一位谴责自己的高手，我们叫她欧阳吧。欧阳的公司有很多优秀的同事，他们大都是从国内外名牌大学毕业的。


    欧阳总是在跟同期进来的同事做比较，总是觉得同事很聪明，而自己很差。她经常会跟自己说：“不能再这么下去了！你要混到什么时候？别再堕落了！”


    在我们咨询的很长一段时间里，她都处于“道理我都懂”的阶段。


    我跟她说，人有很多面，不能这么简单比较，甚至问她这种比较和自责对她有什么好处。这些都没有用。


    欧阳的改变，同样来自情感触动。


    那一天，我问起她是从哪里学来的这种对竞争的焦虑，她就回忆起了她的童年。她是在机关大院里长大的。同龄的还有另外两个小女孩，都很漂亮乖巧，而她自己觉得自己长得一般。


    这三个孩子的妈妈，经常会聚在一起讨论孩子。妈妈们是在暗暗较劲，而她的妈妈，又是一个好胜心很重的人。


    每周六，她们三个人都会去一个地方，跟着一个老师学弹钢琴，三个妈妈则在旁边对她们品头论足。


    有一天，她的琴没弹好，错了好几个音，妈妈非常生气。


    以前，都是妈妈骑自行车接送她，那天天很冷，妈妈把她从自行车后座放下来，自己骑着自行车往前进，她就在后面一边哭，一边追。


    说起这一段，她委屈地哭了。


    她说：“从那以后，我就特别害怕去学钢琴。每次去那边，我都觉得，这三个妈妈就像三个将军在那边指挥坐镇。我们像是三个小兵，在前面战战兢兢地奋力杀敌。”


    我问她：“现在你已经长大了。如果你是自己的妈妈，你会让自己参与这样的战争吗？”


    她说：“我绝对不会。”


    我说：“可是你现在就在让自己参加啊，只不过战场不一样了而已。”


    她沉默了。


    从那以后，每次遇到想跟同事比较的时候，她都会跟自己说：不要再参加这个愚蠢的战争了。


    也许，她以前也这样劝过自己。但现在，说这句话的时候，她心里的大象被触动了。


    现在，她心里多了一样东西：对自己的爱和怜悯。她知道了自己为什么会有这么多自我谴责，也知道这并不是她想要的自我谴责。这是她妈妈的需要，不是她的需要。


    而这种理解，是驱动大象改变最重要的部分。


    所以，你对自己还好吗？想起自己的时候，你是带着厌恶和憎恨，还是带着爱、同情和期待呢？


    如果你还在内疚和自责中自我折磨，也许，你就应该放弃和自己之间的战争了。


    就像一个士兵终究要解甲归田一样。


    大象也许听不懂你说的道理，但它能听懂爱。


    它会很清楚地知道，你爱不爱它。只有爱，才会让它心甘情愿，为你上路。


    我们下节课见。


    ## Part 9：第二序列改变，如何区别有效与无效的改变？


    今天这节课，是我们讨论行为改变的最后一节课。


    在前面的 8 节课中，我们已经讲到了改变应有的态度，阻碍改变的心理机制，以及引发改变的原则和方法。


    最后这一讲，我想讲点跟前面不一样的内容，我想跟你一起来反思一下改变本身。


    也许你会有些奇怪，我们为什么要反思改变呢？改变有什么不对吗？我们来学习一门自我发展的课程，不就是来学习改变的吗？


    **一方面，我们总是期待改变，对改变总是心存向往，这是对的。**


    但是另一方面，如果我们不知道改变的方向，盲目地想要有所不同，“追求改变”本身就会变成我们的心理舒适区，变成我们逃避真正改变的借口。


    **事实上，想要改变本身就是把双刃剑。**


    我们追求改变的背后，隐藏的心理状态就是对现在的自己的不满。这种不满，当然可以转化成发展的动力；但它也可能让你走上另外一条路，让你焦虑、迷茫、自卑、手足无措，甚至陷入重复无效的改变之中。


    今天这一讲的内容，就是希望能够帮助你思考，你在进行的改变是有效的吗？


    ### 1. 改变的两个层次


    曾有一个来访者问我：“怎样才能过上理想的生活？”


    我问他，什么是他眼中的理想生活？


    他说：“我并不想要赚很多钱，我只想要做有兴趣的工作，充分实现自我价值。”


    我就问他：“那你现在的工作是怎么样的呢？”


    他说：“我刚辞职，正在找工作。我毕业三年，这是我的第 5 份工作。换工作的原因林林总总，相同的是，每次工作到半年，我就会非常焦虑，我就会想：这不是我想要的工作。我不想庸庸碌碌地过一生。老师，我怎么能实现自我价值呢？”


    我想了想说，你还是先别想实现自我价值的事了，还是先想怎么挣钱比较实在。我这么说，并不是想打击他。看起来，他一直在努力改变，但有些东西却从来没有变过。而我只是想让他停止这种无效的循环。


    我下面说的可能有点绕，但是很重要。


    事实上，改变有两个层次：


    - 一个，是作为内容的改变。在这个例子里，就是工作。

    - 另一个，是作为应对方式的改变。在这个例子里，就是他不停换工作这个行为。他一直在改变的，是工作这个“内容”。而他真正需要改变，却没有改变的是，用不停换工作来应对焦虑的应对方式。盲目寻求变化，没办法安顿下来踏踏实实积累，这才是他真正的问题。


    有时候，“改变”作为应对方式本身，也需要改变。这在心理学上，有一个专有名词，叫作“**第二序列改变**”。


    它来自一本书《改变：问题形成与解决的规则》的书，作者是美国心理学家瓦兹拉威克（Paul Watzlawick）。


    瓦兹拉威克在这本书里，讲了很多例子来说明：为什么改变没有解决问题，反而改变本身变成了一个**问题**。如果你有兴趣，可以读读。


    我的一个朋友曾给我讲过一个他自己的故事，是对第二序列改变最好的说明。


    我的这位朋友在大学有一段时间陷入了一种刨根问底的思想状态。别人觉得天经地义的事情，他都会想很多。


    比如他会想：为什么要学英语？为什么要读书？为什么要出国？为什么要工作赚钱……


    过度思考带来的问题是：他做任何选择都很犹豫，因为他总是想在源头上能把事情想清楚。


    这浪费了他很多的时间和精力。他很痛苦，想要改变。做了很多尝试，却总也不成功。


    他去跟父母讨论解决的办法。


    妈妈对他说：“你啊，就是犹豫。下回你要做选择的时候，要根据自己的价值观给不同的选项排序。这样不就容易了吗？”


    他觉得妈妈说得很有道理，就照着做了一段，可还是没改变。因为他会继续思考，“我的价值观是什么？这个价值观合不合理呢？”


    后来，他去问他爸爸，他爸爸跟他说：“你这是一种特别的才能。很多人其实只是根据常识来生活，但你会用理性去思考。我现在手下有很多员工，我要让他们建立起理性思维都很难。可是你呢，天生就会了。不要被常识蒙蔽，凡事问为什么，这是审视世界的好习惯。虽然费点时间和精力，却是很值得的。”


    他爸爸还说：“你不仅不用改，而且还要保持这个好习惯，将来会派上用场的。”


    他觉得爸爸说得也很有道理。回去以后，他虽然还会思考和纠结这些问题，却不再尝试改变了，结果，他的心情反而好了起来，想得也没那么多了。


    为什么鼓励他改变的妈妈没能让他改变，反而是鼓励他不改变的爸爸，促成了他的改变呢？这是不是很有趣的化学反应？


    我们用第二序列改变来做一下分析。


    遇事多想、做选择时犹豫，这是我那个朋友想要改变的内容。而他总觉得自己有问题，想要努力改变自己的状态，这是他把改变作为一种应对方式。


    他妈妈给他的建议，是去改变内容，而他爸爸改变的，是“他想要改变”这个应对方式本身。


    为什么爸爸的建议更有效呢？这就和心理学里另外一个非常重要的概念有关——自我接纳。


    ### 2. 自我接纳的本质：舍弃


    “自我接纳”这个词，我相信你已经听得太多了，但其实我们对自我接纳有两个重大的误解。


    第一个误解是，以为自我接纳是不改变。


    从第二序列改变这个概念，你就能了解，接纳自我本身就是一种改变，而且是很难的改变。


    难在哪里呢？难在忍受。


    人只要有焦虑，总是想要改变的。可是，顺境逆境都是人生的常态，有时候我们需要去忍受不好的境遇，哪怕暂时看不到希望。


    第二个误解是，很多人说自我接纳的时候，其实是把它当做获取另一种好处的途径。


    经常有来访者跟我说：“老师，我觉得自己很多地方都不好。很想接纳自己，可是怎么才能做到呢？”


    当他这么说的时候，他其实是把自我接纳当做获得幸福、平静、快乐的手段。他心里想的是：如果自我接纳了，那我就会变得更好了。


    你看，这在本质上还是想要改变。追求自我接纳这个追求本身，就是他无法接纳自我的原因。


    自我接纳不是追求，而是舍弃。


    舍弃的是什么呢？就是那种对生活的过度控制，对“完美自我”和“完美世界”的幻想和执念。（重点！！！）


    心理治疗领域里，有一种很著名的疗法，叫做“森田疗法”（之前看抑郁症治疗的书籍时看到过），它的核心理念是：带着问题生存；为所当为。


    意思是，不要纠结于你自己的问题，把它当做你生存的正常状态，而去专注你想做的事。这才是自我接纳的真谛。（热血沸腾啊！）


    回到刚刚我朋友的故事。为什么爸爸的方法更有效呢？他爸爸把他想要改变的问题，变成了一种不需要改变的资源。


    这个理由说服了他，让他能够放下自己的焦虑，不再盲目地追求改变。而正是这个放下，让他从无效的改变中解脱出来了，实现了真正的改变。


    ### 3. 有效改变的判断标准


    我相信，这个时候你会有点糊涂了。前面我用了 8 节课讲改变，这里突然又说自己接纳很重要。


    那么，什么时候该追求改变，什么时候该自我接纳呢？或者说，什么时候改变是有用的，什么时候改变会变成一个问题呢？


    我可以给你一个简单的标准：看你改变的动作，究竟是改善了你的状况，还是维持了你的状况，甚至让你变得更糟了。


    通常，无效的改变会维持症状，形成一种恶性循环。如果你的改变包含在这种恶性循环里，那你就要小心了。


    举个例子：我们偶尔都会失眠，失眠是很让人痛苦的。但是，如果失眠的人很想改变失眠这件事，那他会变得非常警惕。


    本来疲惫中迷迷糊糊要睡着了，他一个念头“我快要睡着了”，马上又清醒过来了。想改变念头加剧了失眠，这就变成了一种恶性循环。


    前面这个不断换工作的朋友也是如此。


    他的目标是实现自我价值，实现自我价值是需要积累的，可是这个乌托邦式的目标让他不断寻求改变，从而失去了自我积累的过程。


    越是焦虑，他就越焦虑，越焦虑，越想改变，形成了另一种恶性循环。


    所以，当我们想要改变的时候，要问自己两个问题：


    **第一，我所遇到的，是世界的不如意，还是需要改变的问题？**


    我们这个世界，本身会有很多不完美，它不是按我们的想法设计的。


    比如：我们偶尔会焦虑、会失眠，会心情不好、会遇到各种挫折。但这都不是问题，它是世界运行的常态。如果我们错把世界的不如意，当做我们要解决的问题，改变不仅没有效果，有时候还会变成问题。


    **第二，我们想要改变的努力，有没有打断自然发展的进程？**


    一棵树从种子发芽，到开花结果，有其自我发展的过程；工作需要积累经验，感情需要互相磨合，这也是自然发展的过程；身心或者心理健康需要慢慢恢复，这也是一个自然发展的过程。


    所以，当你想要改变的时候，要思考一下：如果我不做改变，世界自然发展的一般规律是什么样的？


    不能因为想要摆脱焦虑就着急改变，如果我们改变的全图打断了这种自然发展的历程，那它不仅没有效果，而且还会变成问题。


    到这里，我们关于行为改变的课程就完成了，让我们来回顾一下课程第一部分的内容。


    我们讲到了行为是如何被维持的，改变的困难在哪里。改变很难发生，是因为：


    - 固有的行为有它的好处；

    - 心理舒适区让我们用熟悉的应对方式去处理问题；

    - 我们每个人都有阻碍改变的心理免疫系统。


    我们也讲了引发改变的一些方法，包括：


    - 检验行为背后的规则；

    - 积累一些小成功；

    - 为自己制造改变的场；

    - 激发情绪。


    最后，我们辨析了无效和有效的改变。无效的改变本身就是一种心理舒适区。


    也许你已经注意到，当我们讲对改变的改变，也就是自我接纳的时候，我们其实已经进入了思维的领域。


    改变不仅包括行为的改变，还包括思维的改变，人的想法和行为是相互促进的。


    在课程的下一个部分，我们会讲：


    - 人的心智是如何运作的；

    - 你身上可能存在着哪些思维陷阱；

    - 这些思维陷阱会怎么限制自我的发展；

    - 怎么才能发展出更积极、更有弹性的思维方式，促进自我的成长。


    第一部分的课程就到这里，我们第二部分的课程再见。


    ## Part 10: 认识心智模式，辨识防御思维与成长型思维


    从这讲起，我们进入这门课的第二部分——心智的发展。


    如果把人比做是一部复杂的机器，行为是这个机器输出的结果，而心智模式就是驱动机器的底层程序。所以，人要获得持续的发展，不仅需要行为的改变，而且离不开心智模式的有效运转。


    那么，什么是心智模式呢？


    古希腊哲学家爱比克泰德（Epictetus）有句名言：


    > 人不是被事物本身困扰，而是被关于它们的意见所困扰。


    意思是说，一件事怎么影响我们，不取决于这件事是怎么样的，而取决于我们怎么想它。


    每遇到一件事，你就会有一个想法。这些想法看起来散乱无章，但如果把这些想法汇集起来，你就会看到，它们是有规律的。


    - 有些人想得乐观些，有些人想得悲观些

    - 有些人习惯从外部找原因，另一些人习惯从自身找原因

    - 有些人习惯想问题是什么，另一些人习惯想办法是什么


    这些习惯化的想法，我们就把它叫做心智模式。心智模式就是我们组织和加工世界的方式。


    心智模式对我们很重要，是因为它决定了我们会如何面对不可避免的挫折和失败，我们如何去追求一心想追求的成功和幸福，以及在这个过程中，我们会如何评价我们自己。


    自我的发展过程，就是心智模式不断发展和进化的过程。


    ### 1. 心智模式的两个作用


    心智模式到底怎么影响着我们呢？它至少在两方面起着非常重要的作用：


    首先，它塑造了我们的经验，影响了我们的情绪。


    相信你也许听说过这样的段子：同样的半杯水，有些人看到的是只有半杯水了，所以很焦虑。另外一些人看到的是还剩半杯水，所以很开心。


    心智模式让我们对同样的事情有不同的解读，并产生不同的情绪。


    既然心智模式的作用是塑造我们的情绪，那么，是不是让人感觉良好的心智模式，就是好的心智模式呢？


    如果是这样，那一个人的心智模式一定很积极，就是鲁迅笔下的阿Q。阿Q最会通过自我安慰让自己感觉良好一些。可是我们显然不能认同，阿Q有良好的心智模式。


    因为心智模式还有第二个作用：引发行动。


    我们的情绪、思维和行动是一体的。积极的思维经常会通过激发有效的行动，来验证它本身的正确性。


    如果你觉得一件事你能应付，你就会想办法，全力以赴去做，最后，这件事果然大成了，这加深了你“我能应付”的信念。这是一种积极的循环。


    反之，如果你觉得自己做不到，你可能就会拖延、想退路、找自己做不到的理由，最后这件事没有完成，这也会加深你“我做不到”的信念。这是一种消极的循环。


    对人也是如此。如果你觉得一个人很好，你会去接近他、了解他，最后发现他

