    更好的发展。


    总结一下，今天的课我们讲了关系中的角色。讲到了角色如何影响我们的行为，以及我们如何调整自己的角色。


    其实，所有关系的沟通，都是一个隐性的角色分配过程。你有没有想过，我们要怎么识别不同的角色呢？


    下一讲，我们就来思考这个问题。


