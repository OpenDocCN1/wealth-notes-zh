    爱的理念变成现实的过程，而不是解决问题的过程。


    当然，这并不是说我们不需要解决问题了，为了完成梦想，你需要解决很多的问题，但是解决问题不应该成为行动的动力。你真正热爱的目标才是这个动力的来源。


    ## 4. 创造型思维和解决问题思维的根本区别


    创造型思维把事情分成了简单的两部分：

    - 第一个部分，是我想要完成的作品。

    - 第二个部分，是我所面临的现实。


    前面我们谈了第一个部分，下面我们来谈谈我们与现实的关系。也许你会想，我也想有自己的目标，我也想去实现自己的梦想，可是我所在的现实不允许该怎么办呢？


    很多人都有过这样的疑问。曾有个朋友来咨询我，说他想去从事研究工作，可是他经济有困难，没法继续去读书深造，只能做一个他那么想做的工作。


    **暂时没钱去追求梦想，这就是一个事实。**


    **创造的思维并不是让我们忽视现实，相反，只有正视现实，才能实现自己想要创造的东西。相反，创造型思维会让我们用一种不同的目光去看清现实。**


    创造型的思维，会把这个事实看作是创造的条件限制。如果我遇到了这样的限制，我就要想办法去解决它。而解决问题思维会把这个限制看作是目标是否成立的前提。如果我遇到这种限制，那也许我就该放弃目标。这是两者的区别。


    一个创造型思维的人可能会想：“我想要继续去读书深造，可是我现在确实没钱，怎么才能解决我读书深造的目标呢？如果钱真是我深造的前提条件，那我要先去挣钱。”当他在挣钱的时候，他是知道自己为什么这么做的。


    可是，一个解决问题思维的人就会想：“**现在连钱都没有，还谈什么读书深造，这压根就不现实。于是就放弃了自己的目标。**”


    这就是创造型思维和解决问题思维的根本区别。


    创造型思维是以目标去思考现实，先想我要什么，再想现实是怎么样的，环境能够提供什么，再去想办法弥合目标和现实之间的鸿沟。


    而解决问题思维是以现实思考目标。先去想环境能够提供什么，再来想自己的目标是不是实际的去树立怎么样的目标。


    大部分人都是从现实出发去思考问题，而不是从想要的东西来思考现实。当他们这么想的时候，自然无法突破现实的限制，也就没有持续的张力了。


    说到这里，我们要回过头来总结今天的课了。今天我们讲了，只有创造型思维才能产生持续行动的张力。创造型目标制造了张力，而张力能够产生持续行动的动力，帮助我们去有效地应对和组织现实。


    打个比方，创造一个东西就像生一个孩子。生孩子的过程，并不需要强迫自己努力，你只需要爱这个孩子就可以了。


    另一方面，创造也需要我们去认清现实、加工现实，而不是逃避现实。


    创造型思维为我们制造了张力，但是怎么把这种张力变成我们持久的行动力呢？下节课我们来讲述这个问题。我们下一讲再见。


    ## Part 18：WOOP 思维，张力如何变成行动力？


    还记得上节课我们把思维的发展比作河流吗？一条河要流动，需要三个条件。


    第一个条件是河流落差产生的张力，也就是我们上节课讲的创造性的目标。可是只有这个还不够，张力并不是那么让人舒服的，因为它会让我们一直处于一种紧张的状态。


    这一讲和下一讲，我们就来看看河流动流的第二个条件——河道。我们来思考如何把张力变成自己的行动力。


    今天，我来介绍一种特别的，增加行动力的思维方式——WOOP 思维。


    不知道你你有没有这样的经验：**当你为自己的碌碌无为内疚的时候，你自然就会下决心或者做计划。下了决心以后，你的自我感觉好了一些，感觉一好，张力自然就释放了。于是，行动的动力反而减少了。**


    有些时候，我们会买很多书，却从来 unread；


    买了健身卡，却从来不去；


    买了很多课，却不好好听。


    以前你会以为是自己的意志力不够，没法坚持。现在你知道了，买书、办卡、买课，本身就目的，**就是为了减轻目标带来的张力来缓解我们自己的焦虑。**


    大脑分不清什么是计划和决心，什么是真正的行动。有时候就因为我们下了决心，做了计划，大脑就会误以为我们已经做过了，行动的张力就被消减了。


    有一种说法是，**人需要积极乐观的幻想，来为我们的行动提供希望。** 所以当一件事事遇到困难时，我们总是会幻想克服困难和达成结果之后的场景。


    可是从张力的角度，积极乐观的幻想可能也没那么好了。因为它可能会减少你行动的动力。


    比如，有一个研究就发现，幻想自己成功减肥的女生，她们的减成功成效要远远低于那些幻想自己会遇到困难的女生。


    乐观幻想还会带来的另一个问题，**就是当我们感觉到幻想受威胁时，会通过想方设法不去跟现实接触，来努力保护我们自己的幻想。**


    最典型的例子就是，如果在幻想中你是一个很厉害的人，你会害怕去接受挑战，因为如果接受了挑战而你失败了，那幻想就没法持续了。


    也许你要问，可是乐观的幻想也不是一无是处。如果没有对未来来的美好预期，我们哪来的动力去行动呢？毕竟有很多研究表明，乐观确实能够帮助人们开创更多的可能性。


    ### 1. 心理对照法：先想好处，再想障碍


    正因为乐观的幻想既能带来希望，也能带来问题，心理学上就有一种把乐观与悲观结合起的方法，叫心理对照法。


    什么叫心理对照法呢？


    **就是为了防止过于乐观的幻想降低我们的张力，我们就需要在想象乐观前景的同时，想象一下实现愿望的障碍在哪里？让我们先想象愿望达成的时刻，再泼一盆冷水下来，让我们面对现实。**


    让我来举个例子。


    我有个朋友是学计算机的，毕业以后到了一家 IT 公司做技术支持。可是他觉得技术支持没什么创造性，不是他想做的，他想做产品经理。


    这是一个未实现的目标，有很大的张力。


    也许你听过的建议，是要做一些积极的想象，想象你当上了产品经理以后如何如何。但如果只是这样，是不够的。


    按照心理对照法，一方面，你要想象你的愿望实现以后的场景。比如，你设计出了一个很牛的产品，有很多人用，你自己工作很开心。


    可是另一方面，你也要想象转型到产品经理所遇到的障碍。比如，你需要学很多新的东西，你的思维方式需要做改变，你还需要接近做产品的同事，看看是否有这样的职业机会。


    这就是心理对照的方法，先幻想积极乐观的结果，再幻想在路途中可能遇到的障碍。


    已经有大量的研究表明，心理对照所产生的行动力，要远远比只是做积极幻想，或者只是想消极的障碍要大得多。


    需要说明的是，心理对照的顺序是很重要的。我们需要先想做成以后的好处，再想可能遇到的障碍。


    如果先想困难再想可能的好处，很有可能让你把目光集中到了障碍上，这时候目标的张力还没有建立起来，你就觉得困难重重，同样会妨碍你的行动。


    心理对照最大的好处，是既通过乐观的幻想，保留了目标带来的张力，同时，又把幻想拉进了现实，让目标切实地跟现实发生联系。


    就像那个想转型做产品经理的朋友，当他设想做产品经理会遇到的种种障碍时，其实这些障碍暗示了转型做产品经理的真实路径：学习新技能、改变思维方式、寻找新的职业机会。


    如果他的目标所建立的张力是有效的，那这些张力就正好能用于克服这些现实的困难，而不是在空想中让张力消耗掉。


    但是，心理对照还有一个问题。它要求我们同时设想乐观的结果和可能遇到的障碍，可是并没有告诉我们该怎么克服障碍。很多时候，我们无法行动，就是因为设想的障碍给了我们太大压力，让我们想要回避，所以才有了拖延的问题。


    别着急，我们继续往下讲。


    ### 2. 执行意图：治疗拖延症的有效工具


    发明心理对照法的心理学家，是纽约大学的心理学教授，叫厄廷根（Gabriele Göttingen），她是一个女心理学家。她的丈夫呢，同样是一个非常出名的思维专家，叫彼得·M·戈尔维策（Peter
    M. Gollwitzer）。


    她的丈夫发明了另一种思维工具，对治疗拖延症特别有效。这种思维工具叫执行意图。


    执行意图是怎么做的呢？就是让你设想未来要做什 么的时候，用一个条件语句——“如果……就……”。


    执行意图戏称为“大脑黑客”。为什么我们大部分计划没有效果？是因为大部分计划都只是一个笼统的概念，大脑并不知道什么时候，什么地点，要做什么。还记得在第一章讲的那一节吗？为了触发有效的行动，我们需要布置一个有很多行为线索的环境，这就是场。


    可是，如果你想要做的事情在未来呢？毕竟，我们无法提前到未来布置一个有很多行为线索的环境。这时候，我们就需要在大脑里预埋行动线索。而“如果……就……”就是大脑能够读懂的未来的行为线索。


    一旦你在大脑中植入了“如果……就……”的语句，当“如果”这个条件出现时，大脑就会自动反应出你应该做的事情。


    你可以试着把“如果”设置为那些非常简明明了又醒目的时间地点信息。比如，“如果我吃 完晚饭，我就会翻开书看几页”，“如果我觉得到睡着了，我就会把 kindle
    放到床边而不是手机”。


    一般来说，你预理的行为线索越具体，到这个时间地点以后，行为线索越能触发 行动。一旦你真的做了这样一个计划，你执行概率要远远比普通的计划要大得多。


    ### 3. WOOP 思维：克服障碍的计划


    发明心理对照法和执行意图的两大妻，决定把这两种思维工具结合起来，变成一 种。这就是 WOOP 思维。


    WOOP 思维是什么意思呢？


    - W——Wish，就是愿望的意思。你可以先想想你在这周、本月或本年需要完成的 愿望。

    - 0——Outcome，最好的结果是什么，这两项是增加目标的张力。

    - 0——Obstacle，设想可能遇到的障碍。

    - P——Plan，计划。


    注意，这个计划就是用“如果遇到了什么障碍，我就怎么做”，这样“如果…就…”的句式写的。


    让我举个例子。


    我有个朋友在一个事业单位，工作了两年，觉得自己的工作没有什么价值，每天 觉得累，想回学校重读个心理学的研究生。


    可是，虽然他工作清闲，每天回家，还是不太想看书。他来问我，有什么办法提 高行动力。


    我就问他：“如果你考上了理想院校的研究生，会有什么好处呢？”


    他两眼发光，说：“那时候我就有一个更好的平台，有更多志同道合的朋友。我会 遇到更好的老师，跟着他学习心理咨询，最后还能找一个自己更喜欢的工 作。”


    然后，我接着问：“那你考研的过程中会遇到什么障碍呢？”


    他的目光就暗淡下来了一些，说：“我是跨专业考研，难度很大。想上的学校 竞争又很激烈。所以，有时候会情绪不好、没有信心，觉得好多内容都没法掌握，甚至会跟自己说，反正我也考不上，干脆就别准备了。”


    于是，我就问他：“那如果情绪不好，你会怎么克服呢？”


    他想了想说：“如果我感到情绪不好，可以去找朋友聊聊，可以写写日记。”


    我又问他：“那万一你觉得自己反正考不上，不用好好学了呢？”


    他说，“如果我这么想，那我就跟自己说，无论考不考得上，我都应该为自己的 梦想去奋斗一次。”


    我说：“好，那你就把它写下来，做成计划。”


    他真的照着 WOOP 的格式写了。过了一段时间，他来向我道谢，说确实效率提高 了不少，情绪也好了很多。


    今天的课，我们讲了 WOOP 思维，我希望你能够借着这个 WOOP 思维的工具，更 理解张力的本质。


    我们经常说，人要仰望星空，才会觉得生活有奔头，也要脚踏实地，才不至于让 自己迷失在幻想中。WOOP 思维就是一个让我们既能仰望天空，又能脚踏实地的工具。


    最后，我希望你能亲身实践一下这种新的思维方式。


    如果你不知道的自己是否有这个决心，你可以想“如果我学会了这种思维方式以后，我会得到什么？”也许你会变得更高效，更加不拖延。


    然后你要想“练习这种思维方式最大的障碍是什么呢？”也许是你到了家，就只想休息，不想再打开这个课了。


    那你就可以提醒自己“如果我到了家，吃完晚饭，我就会坐到书桌旁，拿一张纸，把这个课程重新打开，按照课程的做法，来想想我没有达成的愿望和可能的障碍。”如果你这么做了，那你就已经在练习
    WOOP 思维了。


    今天的课就到这里。


    下节课，我们会讲另一种增加行动力的思维方式——控制的两分法。


    我们下节课见。


    ## Part 19：控制两分法，如何找到烦恼的根源？


    有一次我去学校做讲座，有个同学跟我说：


    “我有一个远大目标，希望能像我的老师那样成为科学家。可是，当科学家需要先考 GRE，要去国外读博士。读博士还要读很多文献，发很难的 paper。回来还要能组建自己的实验室。这其中任何一个环节稍有点差错，我的目标就功亏一篑了。”


    一想到这些，我就很焦虑。就觉得眼前的事很没意义，于是什么也不想做了。”


    看起来他有远大的目标，这个目标似乎也提供了足够的张力，可是这个目标的容错率非常低。就像是一架仪器，看起来设计精密，其实却很容易坏。更大的问题是，这个目标并没有和他当前的计划相联系。这让这个同学变得非常心浮气躁。


    那么，我们如何能把目标转化为行动的动力呢？


    上节课，我们讲到了一种能把张力变成动力的思维工具——WOOP 思维。这节课，我们来讲另一种增加动力的思维方式，我把它叫做控制的两分法。


    ### 1. 控制的两分法：两个步骤


    不知道你听有没有听过一句祈祷词，叫做“上帝啊，请赐予我勇气，让我改变能够改变的事情；请赐予我胸怀，让我接纳不能改变的事情；请赐予我智慧，让我分辨这两者。”


    我们把这句祈祷词精简一下，就是我们今天讲的控制的两分法：努力控制你能控制的事情，而不要妄图控制你无法控制的事情。


    这两句话，前者讲的就是专注精进，后者讲的就是顺其自然。只有把这两句话同时结合起来，才能既保持积极上进，又能让自己内心平静。


    为什么这么说呢？


    作为一个心理咨询师，我发现大部分人的烦恼，都在于妄图控制我们不能控制的事情，却不对我们能够控制的事情行使控制权。


    想想我们的烦恼有多少来源于我们控制不了的东西。


    - 我们控制不了我们的过去、我们的环境，控制不了我们的原生家庭。如果你的父母不符合你的期待，你再怎么样愤怒，他们还是不符合你的期待。

    - 我们控制不了别人对我们的评价，控制不了别人是怎么想、怎么做的，更控制不了别人是否会喜欢我们。

    - 我们还控制不了一个基本的事实：所有的人都会死，而我们还不知道我们什么时候会死。


    只要我们不承认某些东西是我们控制不了的，我们脑子里就是一直会有一个“它应该这样”的图景，某种意义上，应该思维就是对我们控制不了的事情的执着。


    什么是我们能控制的部分？


    如果你想锻炼身体，你可以控制自己早上是否早起、晚上是否去散步，你可以控制自己的饮食。如果不能控制每天都这么做，你至少可以控制一天。


    还有一个最重要的东西你是能控制的：你控制不了发生在你身上的事情，但是你能控制自己怎么想。


    可我们并不愿意控制这些，因为在我们眼里，这些事情好像太小了，它又不能马上改变结局，所以我们宁可由着性子去想那些不能控制的事情。


    控制两分法的第一步，是思考你所担心的事情里，哪些是你不能控制的，哪些是你控制不了的，并把注意力专注到你能控制的部分。


    认识到很多事情是你控制不了的，这是一种心智上的成熟。


    精神分析里有一个词叫“全能自恋”，说的是婴儿觉得自己是无所不能的“我只要一动念，母亲就会来喂奶，我只要一哭，就有人来安抚。”


    随着心智的发展，我们逐渐认识到，这个世界不是围绕我们的想法运作的。只有认识到我们没法控制很多事情，我们才能把注意力集中到我们能控制的事情上去。也许你要问：有些事既有我能控制的部分，又有我不能控制的部分，那该怎么办呢？


    比如我给同事留个好印象，同事怎么想我，当然是我不能控制的，可是我也可以勤快一些，多帮一些忙，给他们留下好印象的机会似乎也会大一些。这样想是有道理的。


    实际上，很少有事情是绝对不能控制的，或者是绝对能够控制的，很多事情是混杂在一起的，既有我们能控制的部分，又有我们不能控制的部分。


    那该怎么办呢？


    > 控制两分法的第二步，对于不能够完全控制的事情，把你能控制的部分找出来，并做成计划。


    我曾遇到过一个博士生。博士毕业是有要求的，需要发一篇 SCI 文章才能毕业。他很焦虑，来向我咨询。我们就谈到怎么制定目标和计划。


    他说：“老师，你说的看起来有道理，但发表文章不是我能为决定的。我既不知道实验数据是否理想，也不知道老板是否有空帮我改，更不知道编辑会持何种态度，我做计划有什么用呢？”


    他说是实情。这种不确定、不可控的感觉是一种很糟糕的感觉。很多人就是因为想到“我什么也控制不了”，才会变得很拖延。


    可是你仔细思考就会发现，这个不可控的事情背后，都有它可控的成分在。比如：


    - 你不知道这次实验的数据是否理想，但你知道多做几次实验，更可能获得理想数据；

    - 你不知道什么时候会有灵感，但你知道多读几篇文献，会有更大的机会获得研究灵感；

    - 你也不知道老板是否有时间帮你修改文章，但你知道多催他几次，他更可能给你反馈。


    后面的这个部分，就是你能做的工作。


    > 所以，如果我们能够把这些事情背后可控的部分找出来，并把它们做成计划，那我们就不会陷入到焦虑当中，因为我们一直都是有事可做的。


    听我说到这里，这个博士生点了点头，看起来他认同了，但他紧接着问：“可是老师，按时毕业对我来说真的很重要啊，我连工作都找好了，万一毕不了业，可怎么办啊！”


    他焦急地看着我，似乎就等着我给他一个保证，保证他这么做，就一定能够毕业了。


    这是一个很有趣的现象。在我的实践中，大部分人都能够用这种控制的两分法来控制焦虑。可是也有一些人做不到，因为他们的思维被另一个问题带走了：这件事重要不重要？


    这是人自然分配注意力的原则，大部分人只会注意到这件事重要不重要，而不会去想在这件事里，我能控制的是什么。


    可是如果我们用理想想一想：这件事是很重要，那又怎么样呢？是因为这件事很重要，所以你就应该能够控制它，还是因为这件事很重要，所以你就应该担 心呢？


    如果是因为这件事很重要，所以你就期待自己应该能够控制它，这就是一种应该思维了，这里面有我们天真的幻想在。


    如果是因为这件事很重要，我就应该担心，这有一定的道理，可是如果你任由自己担心，那你就放弃了控制自己能够控制的事情。


    你明明能够透过控制的两分法来让自己变得专注一些，却一定要任由自己焦虑，让你的焦虑破坏了你的行动力，这也是不合理的。


    好在这个博士最后还是想明白了这个问题，回去努力工作 了。不知道你 是否想明白了呢？


    总结一下，今天我们讲了控制的两分法。


    - 第一步，遇到一件事的时候，先想想这件事是不是你能够控制的。

    - 第二步，如果不是完全能够控制的，就想想自己能够控制的部分在哪里，把这部分找出来，并做成计划。


    这会让我们意识到，哪怕我们没法决定很多事，但我们仍然有很多事可做。


    这样做有什么好处呢？


    它能够让你把注意力集中到现在能做的事情上，让你静下心来，踏踏实实地工作。


    至于结果是“天道酬勤”还是“事与愿违”，那不是你能够控制的了。


    好在那时候，无论结果如何，你都可以跟自己说“我已经尽力了，所以问心无愧。”


    如果仔细思考，你会发现，我们前面所讲的僵固型思维、应该思维和绝对化思维，它们的问题也在于没有好好区分哪些地方是我们能够控制的。


    - 比如，僵固型思维，就把注意力放到了我们不能控制的，别人评价我们“聪明不聪明”上，而没有放到我们能够控制的“努力不努力”上。

    - 应该思维，则是试图用头脑中已有的规则去控制世界、自己和他人，发现控制不了，就会变得很焦虑、沮丧甚至怨恨。

    - 绝对化思维，则先用绝对化的要求，把自己的控制范围无限扩大，又因为受到挫折而放弃了自己能够控制的事情。


    请注意，控制我们 能够控制的事情，是专注和精进，而不妄想控制我们控制不了的事情，是为变化留下空间。这也是有弹性的思维的特征。


    我们下一讲见。

