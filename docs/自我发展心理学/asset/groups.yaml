    你看，这在本质上还是想要改变。追求自我接纳这个追求本身，就是他无法接纳自我的原因。

    自我接纳不是追求，而是舍弃。

    舍弃的是什么呢？就是那种对生活的过度控制，对“完美自我”和“完美世界”的幻想和执念。（重点！！！）

    心理治疗领域里，有一种很著名的疗法，叫做“森田疗法”（之前看抑郁症治疗的书籍时看到过），它的核心理念是：带着问题生存；为所当为。

    意思是，不要纠结于你自己的问题，把它当做你生存的正常状态，而去专注你想做的事。这才是自我接纳的真谛。（热血沸腾啊！）


    回到刚刚我朋友的故事。为什么爸爸的方法更有效呢？他爸爸把他想要改变的问题，变成了一种不需要改变的资源。

    这个理由说服了他，让他能够放下自己的焦虑，不再盲目地追求改变。而正是这个放下，让他从无效的改变中解脱出来了，实现了真正的改变。


    # 3. 有效改变的判断标准


