    # Part 20: 正念思维，如何活得不焦虑？


    # Part 21：思维弹性，思维是如何进化的？


    # Part 22：关系中的自我，从个体视角到关系视角


    从这一讲开始，我们进入了这门课的第三单元：关系的发展。在这一单元，我将用一个跟你想象中不太一样的视角，让你更深刻地理解什么是自我、什么是自我发展。


    讲这段话的时候，我正在录音棚里录课。我对着麦克风，周围很安静。看起来，录课这件事，是我一个人在做的。可是我会想象有你在另一边听。我可以说，我讲课是在你听课之前，但是我也可以说，从你听课开始，我才真正开始了“讲课”。


    因为，如果没有听众，就没有讲者。如果没有你在听，那我的讲，就变成了毫无意义的喃喃自语。这就是关系。


    没有人是完全独立的个体。关系里的人，总是一起出现，相互定义，相互成就。


    就像我们说，是父母生了孩子，但是从父母的角度，你也可以说是孩子生出了父母：因为如果没有孩子，你怎么能自称父母呢？


    这样的说法，并不是文字游戏。这关系到我们怎么理解人这种独特的存在。你是把人看作一个个独立的、偶尔产生联系的自我，还是把人看作完完全全的关系中的存在？


    我们这门课叫《自我发展心理学》，现在，我想请你重新来思考一下，什么是自我？


    ## 1. 自我存在于关系中


    通常，我们会从个体的角度来思考自我。


    - 我们会假设，存在着一个稳定的、独立于他人的自我，这个自我决定着我的想法和行为；

    - 相应的，我的想法和行为背后，隐藏的是我的个性，个性决定了我在大多数情况下会怎么想、怎么做；

    - 如果我表现出自己不想要的行为，那一定是这个“自我”有问题，比如意志不坚定、情绪不稳定，甚至严重点，有心理问题。


    从现在开始，我想请你抛开刚才那个视角，从一个新的角度来思考自我，那就是关系的视角。


    这时候你会看到：其实并没有一个单独的自我，每一个关系里，都有一个不同的自我；不是你的个性，而是你所处的关系，决定了你的想法和行为；如果你表现出自己不想要的行为，那也不是你一个人的问题，而是你所处的关系出现了问题。


    这样的视角是不是跟你想的不太一样？你肯定想问，我们为什么要从关系的视角来看待自我，发展自我呢？


    关于这个问题，我想用四个递进的层次解释给你听。


    **第一，人无时无刻不在关系当中。**


    家庭有家庭关系，工作有工作关系，就算在地铁上，旁边都是陌生人，那也是一种关系。


    也许你会想，我一个人独处的时候，总不在关系里了吧？当然不是。你独处的时候，你独处的空间，是由关系来界定的。


    比如你一个人在家，家里有一个门，你知道就算有陌生人走过，也不会随意从这个门闯进来。这是你们在关系中达成的共识。


    你一个人在家可以光着膀子，穿着短裤，爱干什么干什么，看起来你很自由。可是你知道你不能这样走出这道门，走到大街上去。这也是一种关系的共识。是关系界定了你独处的空间在哪里。再想一下，虽然你在独处，但你仍然在关系里。你知道，这里虽然只有你一个人，但不意味着地球上或者宇宙中只有你一个人。你虽然在独处，可是你仍然会想：家人在哪里，约谁去吃饭，明天要交给老板的报告怎么完成，老板又会怎么评价你……你想的这些，都是关系。所以，关系是无时无刻不在的。


    **第二，在不一样的关系中，你的自我是很不同的。**


    也许跟陌生人说话时，你可能会脸红害羞，可是在很熟悉的朋友面前，你也会玩得很嗨。


    在办公室，你会努力工作，可是到了家里，你就会往沙发上一躺，反正会有人收拾。


    内向的你、外向的你；勤快的你、懒惰的你，这些都是你，只是不同关系中的你。


    美国有个很传奇的教师，叫马尔瓦·柯林斯（Marva Collins）。她在犯罪和毒品横行的芝加哥贫民区附近，创立了名为“西侧预备学校”的教育机构。来这个学校就读的，都是公立学校里退学的，被认为有问题的学生。可是，在她的教育下，这些原来的街头混混，被认为有学习障碍的学生，都好像变得聪明了。很多都考进了大学，成了律师、医生、法官、教师。她是这么做到的呢？


    和以前学校里的批评教育不同，她就是很真诚地相信这些孩子是聪明的、独一无二的，不断鼓励他们说：“我相信你，你可以做得更好。”这种教育的本质，其实就是塑造了一种新关系。关系变了，学生的表现，自然也就变了。现在我们知道了，人无时无刻不在关系当中，而且在不同的关系中，人的自我是很不同的。


    **第三，决定你行为的是你所处的关系，不是你的个性。**


    设想这样一个场景：一个妈妈正大声责备儿子：“你怎么又没做家庭作业？你这孩子怎么这么不听话！”


    她的责骂也许会让你觉得，这是一个暴躁易怒的妈妈。暴躁易怒好像是妈妈个性的一部分。可是忽然电话铃响了，妈妈接起电话，立刻满脸笑容地说：“是老师啊。您说要来家访，好啊，欢迎欢迎。哪里……孩子在学校里让您多费心了……”


    你又会觉得，这是一个热情有礼的妈妈。妈妈的表现为什么这么不一样？不是她的个性，而是她所处的关系不同嘛。


    也许你会说，妈妈对老师的反应是不是伪装的？对儿子的反应会不会更接近真实的她？不是，我们在亲近的人面前，才更容易表现出真实的自己呀？可从关系的视角，它反映的是妈妈在“亲近”和“疏远”这两种不同关系中的差异，而不是所谓“真实自我”和“虚假自我”的差异。在这两种关系中，妈妈的表现，都是真实的，都是这个妈妈的自我。也许你还会说，这只是一时的反应，如果我们能看她长久的表现，我还是能够了解她的个性的。


    可是，所谓长久的表现又是什么呢？很多时候，那也不过是在另一段长期关系中的表现而已。


    所以，是所处的关系，而不是个性，决定了人的行为。


    **第四，是关系的视角会让思考问题的视角发生重大的转化，一些看起来几乎无**


    解的问题，突然有了合理的答案。


    有段时间，有个编辑朋友跟我聊天，他觉得自己有拖延症，问我怎么办？我就问他为什么这么想，他说他在编一组稿子，觉得这组稿子很难，经常不想去动。


    我就问他，难在哪里呢？如果做得不好，谁会评价你呢？


    他想了想说，是这个稿子的作者。


    原来，这个稿子的作者，是一个很有名的学者，他很担心这个作者会反驳他的修改意见。可是他为什么这么担心这个作者反驳他呢？


    原来，这个作者也并不是那么容易说话的人。他一提意见，这个作者就会很生气。


    > 所以你看，从关系的视角，拖延症就不是他一个人的问题，而是他和作者关系的产物了。


    不知道你有没有这样的经验：如果是一个你很认同，并且也很认同你的老板交给你的工作，你的工作效率会很高。


    可是，如果是一个你不认同的老板交给你的工作，你就会非常拖拉，不想去做。


    这也说明，不是你自己，而是关系，在决定你会不会拖延嘛。


    ## 2. 关系的视角拓展改变的空间


    那么，从关系的视角看自我，到底有什么好处呢？


    《自我发展心理学》是一门讲究的课。可是，如果你从个体的角度来看自我，觉得你有一个稳定的个性。稳定，就意味着你很难改变。


    > 有时候，妨碍我们改变的，正是我们头脑里那个顽固的“自我概念”。


    可是，如果从关系的视角来理解，你在不同关系中的自我是不一样的，你就可以去不同的关系中，发现不一样的自己。


    你不再需要给自己贴类似“敏感内向”、“自卑”、“自信”这样的个性标签。


    你会去审视具体是什么样的关系，导致了你现在的行为。你也可能会去寻求另一种能让自己表现更好的关系。


    同样，你也不会去指责别人为什么有这么古怪的个性，而会去理解什么样的关系，让他表现出这样的行为。这增加了自我发展的潜力，也拓展了改变的空间。


    还记得我们以前讲的抽象化思维和正念思维吗？


    我们头脑里根深蒂固的自我，其实就是一种抽象化思维的产物。你有很多的关系，每一种关系里，都有一个自我。你把这些“自我”的个性抽象出来，就变成了你头脑中那个固有的自我。


    这种思考会增加控制感，可是也让自我变得很稳定，很难改变。


    而从关系看自我，就是一种正念思维，也就是近的思维，是把每个自我，放到具体的关系中，从每一段关系，去看自我的表现。这当然会增加改变的空间。


    说到这里，我要揭开上节课的谜底了。


    上节课我留了一个问题：为什么研究表明，夸孩子聪明会培养僵固型思维，但是我自信我夸女儿聪明，却不会助长孩子的僵固型思维？


    其实思维也是关系的产物。


    > 僵固型思维，说的就是这样一种关系：我不能暴露我的脆弱，给那个夸奖我的人，以免让他失望。


    而从关系的角度，我夸女儿的时候，并没有这层意思。


    只是想说我很爱她。关系是有它自己的语言的，女儿读得懂这种关系的语言，自然就不会担心我失望。


    在这一章的课程里，我将跟你探讨关系在自我发展中的作用。


    这章的课程分为两个部分：


    - 第一部分，我们会从关系的视角，重新来理解自我。这个视角和你以前理解的，用个性来理解人截然不同。

    - 第二部分，我们会从关系的视角，重新来理解自我发展。既然自我是关系的产物，那么自我发展的核心问题，就从如何塑造新经验变成了如何塑造有利于自我发展的新关系。在这一部分，我们会讲混沌的关系如何限制自我的发展，以及如何塑造一种独立的、为自己负责的新关系。


    最后，我用一句著名的诗来总结这一讲：


    没有哪一座孤岛，可以自全。每个人都是大陆的一片，整体的一面。


    我们下节课见。


    # Part 23：关系中的角色，关系如何塑造自我？


    这一章，我们换了一个看待自我的视角。我们不再从个体的角度上看，而是从关系的角度上看自我和自我发展。也许，你会有点疑惑，在关系的视角下，要怎么 看自我呢？


    这一讲，我想说一个非常关键的概念——角色。


    ## 1. 角色影响我们的行为


    角色这个词，最初来自戏剧，说的是演员扮演某种具有典型性格的剧中人物。


    但是，**我们这里所说的角色**，不只是正派反派这样的角色，也不是警察囚徒或者 经理主管这样的社会角色，而是**一种行为期待，是关系里的人共同达成的隐性契约**。
    这种契约是很隐秘的，如果不留心，经常会看不到。


    **在一段关系里，你随时随地都在面临着一些行为的期待，因此你随时随地都在扮 演着某个角色**。


    这个角色决定了你会怎么想、怎么感受、怎么说话、怎么行动。


    > 人生如戏，只不过有时候我们扮演一个角色的时间太长，入戏太深，就把这个角色 当做了唯一的自我。


    举个例子。


    前段时间，一个刚毕业的学弟请教我，他要不要加入一家心理类的公司。这家公 司在国内发展得不错，但是他们是做身心灵运动的，无论是宣传策划，还是课程 内容，都有些神神叨叨。


    我想了想就跟他说：“如果从挣钱的角度，也许可以去，但如果从专业发展的角 度，还是不要了。他们挣钱的方式是通过**兜售别处世界的幻想，来让我们逃离生 活中真实的困难**。”


    真是很巧，又过了一段时间，有个记者问我，说现在社会上有很多类似身心灵的 培训班，用很夸张的宣传来敛财，也有很多人受骗上当，你怎么看呢？


    我想了想说：“我不知道。”


    同样都是关于身心灵的，为什么我的说法会那么不一样呢？


    **这是因为在这两段关系中，我的角色和位置是不同的**。


    在第一段关系中，是学弟在问我职业规划，他期待我作为心理咨询的资深从业人 员，给他一些个人发展的建议。


    **我接受了这样的期待，自然就会强调心理咨询的专业性**。对于他，我很难说出“我 不知道”，这不符合他对我期待。


    当那个记者问我这个问题的时刻，其实对我也是有一个角色期待的，**她期待我 扮演一个正统的、科学心理学代言人的角色**。


    如果我接受了这个角色，那我要说的自然也是关于身心灵运动如何靠谱。可是我 想了想，我要扮演这样一个角色吗？好像并不是那么想。


    很神奇的是，**当我知道自己不想扮演这个角色的时候，原来那些几乎冲口而出的 话，忽然就没有了说的欲望**。


    我会想：我真的了解身心灵运动吗？也许并没有那么了解。


    所以你看，**角色就是这样，它以一种不知不觉的方式规定了你的言行思想**。为什 么会这样呢？**当别人跟你说一件事时，他对你是有角色期待的**。


    这种角色期待提供了你行为的线索，让你不自觉地想去顺应这种期待。而这，


    常常就是影响我们的行为关键因素。


    ## 2. 语言要求和角色期待的矛盾


    我有一个来访者，她来见我，是觉得自己太没主见了，希望能够更多发表自己的看法。


    怎么没主见呢？


    她到公司已经一年了，公司开讨论会的时候，她经常不知道要说什么，有时候好不容易鼓起勇气要说了，结果领导就散会了。


    本来这事也就这样过去了。可是前段时间，她在公司里遇到一个大姐，大姐非常热心，跟她说了一大通职场规则人生道理以后，跟她说：“你啊，我觉得你什么都好，人也很聪明，就是太不愿表现自己了。人前还是要学会说话的。”


    她听了自然就说：“是是是，感谢大姐点拨。”


    过了几天这个大姐又来了，又是一通指点江山激扬文字，走之前又说：“你啊什么都好，就是太不愿意表现自己了。”


    她又说：“对对。”


    慢慢的，她也觉得不太会表现自己是一个问题，就来咨询我。


    我说：“我觉得你挺成功的啊。”


    她奇怪地看我，问我哪里成功了。


    我说：“你成功地扮演了一个**需要指导的职场新人的角色**。如果你改好了，那大姐上哪里指点江山去呢？”


    她想了想说：“对对，那个大姐虽然这么说，可还是很喜欢我，每次都来跟我说话。我旁边有一个同事，人很能干，很会表现自己，大姐就非常不喜欢她，从来不跟她说话。”


    这是一个很有趣的现象。


    在语言上，大姐是希望她能够变得更成熟，更加善于表现自己。但是在关系中，在角色的期待上，大姐却把她固定在了一个“不会表现，需要指导”的**职场新人的角色**上。


    显然，她也接受了大姐对她的这个角色期待，甚至还享受大姐对她的照顾。她没有意识到，正是这个角色，让她很难做出改变。


    这种语言要求和角色期待上的矛盾，在日常生活中经常会发生。


    我经常碰到一些很焦虑的妈妈，一边说：“老师，我的孩子太没有自主性了，我就希望他能主动做事。”另一边呢，又帮孩子把所有的事情都做好了。


    她没有意识到，在角色的期待里，她已经把孩子放到了一个“没有主动性”的位置，当然孩子也把她放到了一个“什么事都有我妈呢”这样的位置。


    这样，无论她在语言上怎么要求，孩子都很难发展出自主性。


    ## 3. 调整角色的三个方法


    讲到这里的时候，也许你要问，那我怎么才能调整我的角色呢？


    我想说三点。


    第一，在回应对方之前，你要先想想，他把你放到了一个什么样的位置和角色上，而你真的想接受这个位置和角色吗？


    有时候我会遇到这样的来访者，他会跟我说：“老师遇到你真是太好了，我总算是有救了。”


    他热切期盼的眼神是很受用的。这时候我就要想，我能做他的拯救者吗？如果我


    承担了这个角色，那他会不会觉得改变他是我的责任，所以自己就变得无能了呢？


    所以我就会这样回应：“我可当不了拯救者，但我很愿意跟你一道来看看，我们能做些什么。”


    当我这么说的时候，我就把解决问题的责任又给了他。


    第二，如果你和别人相处时，已经有一些不舒服了，那你就要思考，是不是我的位置或者角色有问题了。


    通常这种位置角色的错位，是我们没有在自己的位置上，而是试图去替别人负责。


    有一个朋友，我们叫她小A。前段时间小A来找我，说她跟大学的好朋友闹翻了，问我该怎么办。


    这是怎么回事呢？


    小A毕业已经工作好几年了，有一个好朋友，研究生刚毕业，正在找工作，问她应该留在北京还是回家乡的城市找。


    小A想了想说，当然应该留在北京了。还很热情地说，你可以先住我租的地方，慢慢找工作，等工作找好了再来找房子。


    结果那个朋友找工作并不顺利，两人就开始有摩擦。看起来都是一些小事，但更深层的原因，是那个朋友对小A有怨气。


    朋友想：“当时是你建议我留在北京的，现在工作不好找，都是你的错。”


    小A当然没法承担这个角色。可是她的回应却是，抱怨朋友不能干，抱怨她不好找工作，不能吃苦。


    当小A这么抱怨的时候，她已经把决定朋友命运的角色放到了自己身上。言下之意：责任还是我的，只是你自己没做好，才会这样。


    这就是一种角色错位，让两个人的矛盾，越陷越深。


    第三，如果你对一个人有期待，不要在语言上要求他，而要像你期待他的样子那样对他。当然前提是，你要真诚地相信他有你所期待的那一面。


    期待的力量是很大的。（重点！！！）


    上节课，我们讲到的美国传奇教师——马尔瓦·科林斯（ Marva Collins），通过相信孩子们能行，就把一些街头混混变成了好学生。


    前段时间我跟女儿去电影院看了一个动画片，叫《大坏狐狸的故事》。


    这个故事讲狐狸从鸡舍里偷了三个鸡蛋，本意是要等小鸡孵出来以后吃了它们，结果那三个小鸡一出生，就跑到狐狸跟前喊“妈妈”。


    “妈妈”这种巨大的角色期待让狐狸根本没法治它们。后来，狐狸就真的承担起来保护它们的角色，变成了它们的妈妈。这就是角色期待的神奇力量。


    最后，我想谈谈角色和自我发展的关系。


    我们经常说，人有很多面，要发现未知的自己。这是什么意思呢？


    从关系的角度，你就能理解。因为你能在关系中扮演很多角色，所以你的自我就有了很多的 可能性。


    什么是个性呢？其实就是我们在关系中习惯扮演的角色。角色既是限制，也是改变的方法。


    如果我们总是把自己固定在某个角色中，那么这个角色规定的言行举止就会变成你的个性。久而久之，我们就忘了自己还有的其他可能性。而我们的自我，也很难有进一步的改变和发展。


    而反过来，如果我们能尝试很多不同的角色，发现自我的更多面，自我就能得到


    更好的发展。


    总结一下，今天的课我们讲了关系中的角色。讲到了角色如何影响我们的行为，以及我们如何调整自己的角色。


    其实，所有关系的沟通，都是一个隐性的角色分配过程。你有没有想过，我们要怎么识别不同的角色呢？


    下一讲，我们就来思考这个问题。


    我们下一讲见。


    # Part 24:关系的语言，如何听懂别人的“话外音”？


    上节课，你知道了角色的本质，是一种人与人之间的行为期待。决定你言行举止的，不是个性，而是你在关系中的角色。


    从这个角度来看，所有关系的沟通，都是一个隐性的角色分配过程。

    可是，既然这个分配过程是隐性的，我们怎么知道别人对我们的角色期待呢？

    怎么从别人的言行中看到他们在扮演的角色呢？

    如果别人的角色期待和我自己的角色期待发生了冲突，我们会怎么解决这个冲突呢？


    对这些问题，最直接的答案，也许就是听和说。

    语言是人与人之间沟通的工具，理想的状况下，我们可以通过听和说，来理解这种角色期待。


    可实际上呢？人们在沟通里，很少直接说关系。他们一般只会说他们遇到的各种事情。

    如果你不会听，那你就只能听到他们在讨论这些表面的事情。如果你会听，你就会知道，他们所说的每句话背后，都是在说关系。

    这就是我今天要讲的——关系的语言。


    ## 1. 关系的语言：人际关系的密码


    前段时间有个朋友跟我诉苦。

    事情是这样，他有个朋友老周最近买房，需要一笔钱周转一下，20万，就10天。他们家跟老周家交往多年，知道老周很可靠，就借给他了。10天以后，老周就如约把钱还给了他。

    还给他以后，他就跟妻子说：“老周买房，借了我20万周转一下，现在已经还给我了。”


    谁知道她妻子听了以后很生气，说：“你怎么老把我家的钱借给别人？”

    丈夫说：“你气什么，老周你也是知道的，再说不是已经还给我们了吗？”

    妻子问：“那你为什么不告诉我？”

    丈夫说：“我这不是告诉你了吗？”

    妻子就不说话了，在那边生闷气。丈夫也很郁闷，就来跟我吐槽，说早知这样不告诉老婆了，觉得老婆太小气了。


    听到这里，也许你已经听出来了。表面上，妻子在生气他不该把钱借给别人，可实际上，妻子在生气丈夫把钱借给朋友之前没跟她商量。

    借钱之前跟不跟她商量，这在关系上的含义是不一样的。

    一个是说：我们家的重要决定需要经过你同意；一个是说：不需要经过你同意。

    换句话说，妻子是在生他们关系的气。

    可是，丈夫为什么不在借钱之前跟妻子商量呢？

    也许，他在跟老婆说之前，微妙地一闪念：万一我老婆不同意，我该怎么跟朋友交待？

    那他为什么要在事后告诉老婆呢，不说不就没事了吗？

    也许，也是在想隐瞒老婆之前微妙地一闪念：这样瞒着老婆是不是不太好？

    所以，当他的诚实收获了老婆的生气，他心里其实也是有委屈的。这些很微妙的心态，同样是在关系层面的，只不过很难用语言的沟通来表达。

    人和人之间的互动，都可以从两个层面来理解：

