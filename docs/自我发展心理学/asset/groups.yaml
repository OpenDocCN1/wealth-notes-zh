    “不错。”


    我又问女儿：“你怎么看妈妈的话呢？”


    女儿说：“不是这样的！你明明不开心，你只是在骗自己。”


    女儿在说什么？她其实在说：我比我妈更懂她的感觉。


    这么多年，妈妈的痛苦，已经深深地植入了她的感觉里。以至于有些感觉妈妈都忘记了，她还帮妈妈记着；有些事妈妈都希望过去了，她却不肯忘。


    当妈妈的情感占据了她的头脑，她就分不清什么是她自己的情感，什么是妈妈的情感了。她沉浸在妈妈的情感里，就没有办法去发展自我了。


    这就是过于紧密的依恋所带来的不安全。


    ## 3. 不安全影响自我发展


    那么，这种不安全感会影响自我的发展吗？


    我想主要有三点。


    - **第一**，如果父母的问题，尤其是母亲的烦恼占据了我们太多的注意力，那我们就很难有好奇心去探索世界，也就很难发展出我们的技能。

    在第二章讲成长型思维的时候，我曾讲过，孩子只有获得了安全感，才会对世界好奇，才会去探索世界。

    听完“依恋”这一课，也许你对这一点会有更深的理解。


    因为如果妈妈觉得不安，孩子就会面对一个更大的问题，而他们所有的注意力，都被这个更大的问题占据了。

    我的一个来访者跟我说，有一段时间他在准备一个重要的考试，一边复习一边还想着父母吵架了不知道好了没。这样，他就很难集中注意力来复习。

    有一些研究表明，不安全的依恋也会导致拖延症的问题。

    这可能是因为拖延症患者需要花太多心思在不安全感的关系上，以至于没法专注在自己的工作中。


    - **第二**，因为习惯了观察别人的情绪，这种不安全感很容易让他们对别人的情绪敏感，无论是家人还是同事、朋友。

    我发现，很多在人际关系上敏感的来访者，小时候都经历过不安全的依恋关系。这样，他们就很容易把自己放到这样一个位置：我要为别人的情绪负责，如果别人不高兴了，那就是我的错。

    这会给他们带来很大的负担，也让他们的关系变得更复杂。


    - **第三**，不安全的依恋，让我们和母亲的关系变得更加紧密。

    越是不安全，人越是会相互靠近。可是，孩子和母亲的关系越紧密，他就越难去跟别人建立友情和爱情。

    还记得吗？自我是在关系中发展出来的。如果没有更丰富的关系，他就很难发展出丰富的自我。


    同时，如果我们心里装着太多母亲的感受，我们就很容易忽略自己的感受、情绪、感觉、需要、欲望，我们会把它们当做是不重要的东西。我们的自我，就很难发展出来。


    也许你会问，如果我已经在依恋关系中有了很多不安全感，那怎么办？

    虽然修复不安全感的过程并不容易，但是我对这个问题，我倒是有一个简单的答案：既然旧的体验来自以往的关系，那我也需要新的体验来塑造我们的新经验。对于这种不安全感，我们只能带着依恋的焦虑，一点点接近和信任别人，在安全的关系中，慢慢地塑造我们的新经验。


    我们也要尝试把自己的感觉和母亲的感觉分开，去发展自己的关系和情感。这一点，我们后面的课程中还会讲到。


    总结一下。


    这一讲，我们说了导致感觉混淆的最重要的原因之一：不安全依恋。


    我们讲了什么是不安全依恋，以及它对自我发展的三点影响。我们讨论更多的是两个人的亲密关系。


    但在生活中，关系往往不仅仅是两个人之间的事情。下一讲，我们就来讲另一种导致感觉混淆的关系模式——三角关系。


    我们下节课见。


