    \n### 1. 这门课是怎么来的呢？\n\n你可能会觉得“自我发展心理学”这个说法很新鲜。没错，因为这是我们从真实生活中提炼出的新课题。\n\n半年多前，在得到公司的会议室，罗振宇和脱不花问了我一个问题。他们说：得到聚集了这么多中国最有上进心、最有自我发展动力的用户，他们有强烈的发展愿望。\n\
    \n可是，为什么突破自己那么难？难道我们注定要活在焦虑、纠结和痛苦中吗？我们如何管理好自己的人生发展？\n\n罗振宇问我：你能不能根据这些问题，为得到用户创造一门叫《自我发展心理学》的课？给我们一个实现改变，不断自我突破的系统方法？\n\
