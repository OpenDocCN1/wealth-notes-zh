    # **Part 16：与自我辩驳，如何突破防御型思维的操控？**


    在前面的课程里，我们介绍了三种典型的防御型思维：僵固型思维、应该思维和绝对化思维。也许你会想一个问题：如果我也有三种防御型思维，该怎么改变呢？


    这节课，我们就来介绍一种突破防御型思维的方法，我叫它“与自我辩驳”。


    我们来假想一个主人公，叫小王。他是个典型的理工男。除了工作写代码，平时就宅在家里打游戏。


    他没有女朋友，觉得自己没什么魅力，不会有人喜欢他。


    可是最近，公司来了一个让他动心的女生。这个女生很活泼开朗，他们有工作交集。工作之余，女生也会经常开他的玩笑，让他觉得，对方似乎也对他有好感。


    慢慢地他想：“也许我应该试一下。”


    那天正好是七夕节，他就鼓起勇气约那个女生：“晚上有没有空，一起吃个饭啊？”那个女生很吃惊，犹豫了一下，就说：“不了，我已经有约了。下次吧。”


    女生刚说完，一下子，小王各种情绪涌上心头。失落、生气、屈辱、沮丧，他甚至都没跟那个女生打招呼就直接走了。


    是什么让小王这么愤怒和沮丧呢？


    学了前面的课程，你就应该知道了，不是他约这个女生吃饭，女生没答应这件事本身，**而是小王解读它的方式让他有这么多的负面情绪**。在这里，我们可以回想一下前面所学防御型思维。


    小王也许觉得，跟女生交往的能力是固定的，或者一个人的魅力是固定的，这次挫折证明了自己就是没什么魅力。这是僵固型思维。


    他可能觉得：“既然我好不容易鼓起勇气约了你，你就该答应我。我不该被拒绝，否则我就没有被尊重。”这就是应该思维。


    他也可能想：“我真是太糟糕了，没有女人会喜欢我。我这辈子都不会再谈恋爱了。”这就是绝对化思维。


    这些防御型的思维以自动化的方式在**他的大脑后台运转，让他觉得愤怒和沮丧，也让他再也不愿搭理这个女生**了。


    这样的思维方式并不理性。可有时候，我们就是会有很多不合理的思维，尤其当我们自尊心受伤的时候。


    # **1. 与自我辩驳的三种方式**


    怎么办呢？


    如果你相信理性的力量，相信你能控制自己的想法，那你就要试着来劝服自己，试着发展出一种更理性、更健康的眼光和看法。这就是我们今天所要介绍的改变思维的方式——与自我辩驳。


    这套技术来自理性情绪疗法的创始人，心理学家艾利斯（Albert Ellis）。他说，对于不合理的思维，我们可以从三个方面加以辩驳：


    **第一种辩驳方式，是实证式的辩驳，就是找与不合理的结论相反的证据。**


    小王在七夕节约那个女生吃饭，那个女生说：“不了，下次吧。”这能不能作为证据，来证明小王的想法：“根本不会有人喜欢我呢？”


    这种证明是分层很多层次的。最基础的层次是：这算不算证据，证明这个女生就是'
  - '[PAGE 60]


    拒绝了小王呢？


    并没有。她只是拒绝了小王七夕节的邀请，她甚至还留了点余地，说“下次吧。”也许她真的已经跟朋友有约了，也许她觉得七夕节这是一个比较敏感的时机，不适合作为交往的开始，也许她还没有准备好开始一段关系，这都是有可能的。那它是不是证明了小王的想法：“根本没有人喜欢我呢？”那就更没有了。如果是小王自己在做这个练习，他可以找出很多反例来证明可不是这样。比如，平时这个姑娘也会主动跟他聊天，被拒绝的第二天，这个姑娘还跑来跟他说笑话。如果小王能诚实而理性地面对这些证据，他就会发现，要下“根本没有人喜欢我”这个结论还为时尚早。


    实证式辩驳的重点，是要找一些证据让你看到，事实并没有你想的那么糟。可是，万一事情真的这么糟呢？或者，如果这个姑娘真的是拒绝了小王呢？毕竟这也是有可能的。那也许我们要用第二种辩驳方式。


    第二种辩驳方式，是逻辑式的辩驳。辩驳的重点，是推理的合理性。几乎所有的不理性思维，都有过度推理的问题。


    对小王而言，从被一个姑娘拒绝，他就推理到了“我没有魅力”、“不会有人喜欢我”、“我就是不适合谈恋爱”，可是这种推理合适吗？


    前面讲绝对化思维的时候，我们曾经说过，人有时候会通过抽象化的方式来扩大防御范围。可是从逻辑推理的角度，这是不合理的。


    请你想像，为什么被一个姑娘拒绝，就代表了“我没有魅力”、“没有人喜欢我”呢？这次被拒绝只能证明我这次被拒绝了，不表示我就是一个没有人喜欢的失败者啊。


    如果事实很糟糕，它也只是在此时此地很糟糕。但并不能因此推演出“我会一直被拒绝”、“我就是没人喜欢”，这并不符合逻辑。


    他还可以这样跟自己辩驳：“就算我被拒绝了，我就不能被拒绝吗？”交往的尝试就是包含很多试探和拒绝的。它就是恋爱最普通的一部分。


    如果这样就代表没人喜欢，几乎所有人，都有被拒绝的经历，那是不是代表所有的人都是不被喜欢的呢？这同样是不符合逻辑的。


    可是，只有第二种辩驳方式还是不够。原因在于，一种推理方式，是没有办法否定一种可能性的。


    “我就是觉得自己没什么魅力，没有人喜欢我。”这也许不合理，可是不也不i可能啊？这时候，就要用第三种辩驳方式。


    第三种方式，是实用式的辩驳。简单地说，就要问：“我这么想有什么用。”我不断想着我没有魅力，没人喜欢我，除了让我继续宅着，还有什么用呢？如果我这么想是没用的，那更有用的想法是什么呢？对于我自己来说，我更喜欢这种实用式的辩驳，简单直接，并且不会让自己在复杂的逻辑中绕圈子。


    # 2. 三种错误的思维倾向


    可是大部分人并不习惯用“有用”、“没用”来思考，他们的思考方式背后，有一些错误的倾向。


    我总结一下，觉得可以把这种错误倾向归结为三类。


    第一种倾向，是认为这个世界上存在着一个所谓的事实真相，一个正确的认识。其实，以前我也这么想，但现在我不再这么想了。对于“我有没有魅力”、“有没有人喜欢我”这样的事情，其实根本没有所谓的真相。探究这样的真相也就毫'
