    所以现在，每当想要抱怨的时候，我都会先想想：我有什么需要没有直接表达，我是不是坚持了自己的意见。


    同时我也看到了，当我直接表达我的意愿以后，别人并没有对我表示不满，也没有产生冲突，相反，他们更重视了。


    渐渐的，我内心的错误假设也随之改变。


    总结一下，这节课我们讲了怎么设计行为，来验证内心的假设。


