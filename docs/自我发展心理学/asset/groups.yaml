    女儿说：“不是这样的！你明明不开心，你只是在骗自己。”


    女儿在说什么？她其实在说：我比我妈更懂她的感觉。


    这么多年，妈妈的痛苦，已经深深地植入了她的感觉里。以至于有些感觉妈妈都忘记了，她还帮妈妈记着；有些事妈妈都希望过去了，她却不肯忘。


    当妈妈的情感占据了她的头脑，她就分不清什么是她自己的情感，什么是妈妈的情感了。她沉浸在妈妈的情感里，就没有办法去发展自我了。


    这就是过于紧密的依恋所带来的不安全。


    ## 3. 不安全影响自我发展


    那么，这种不安全感会影响自我的发展吗？


    我想主要有三点。


    - **第一**，如果父母的问题，尤其是母亲的烦恼占据了我们太多的注意力，那我们就很难有好奇心去探索世界，也就很难发展出我们的技能。

    在第二章讲成长型思维的时候，我曾讲过，孩子只有获得了安全感，才会对世界好奇，才会去探索世界。

    听完“依恋”这一课，也许你对这一点会有更深的理解。


    因为如果妈妈觉得不安，孩子就会面对一个更大的问题，而他们所有的注意力，都被这个更大的问题占据了。

    我的一个来访者跟我说，有一段时间他在准备一个重要的考试，一边复习一边还想着父母吵架了不知道好了没。这样，他就很难集中注意力来复习。

    有一些研究表明，不安全的依恋也会导致拖延症的问题。

    这可能是因为拖延症患者需要花太多心思在不安全感的关系上，以至于没法专注在自己的工作中。


    - **第二**，因为习惯了观察别人的情绪，这种不安全感很容易让他们对别人的情绪敏感，无论是家人还是同事、朋友。

    我发现，很多在人际关系上敏感的来访者，小时候都经历过不安全的依恋关系。这样，他们就很容易把自己放到这样一个位置：我要为别人的情绪负责，如果别人不高兴了，那就是我的错。

    这会给他们带来很大的负担，也让他们的关系变得更复杂。


    - **第三**，不安全的依恋，让我们和母亲的关系变得更加紧密。

    越是不安全，人越是会相互靠近。可是，孩子和母亲的关系越紧密，他就越难去跟别人建立友情和爱情。

    还记得吗？自我是在关系中发展出来的。如果没有更丰富的关系，他就很难发展出丰富的自我。


    同时，如果我们心里装着太多母亲的感受，我们就很容易忽略自己的感受、情绪、感觉、需要、欲望，我们会把它们当做是不重要的东西。我们的自我，就很难发展出来。


    也许你会问，如果我已经在依恋关系中有了很多不安全感，那怎么办？

    虽然修复不安全感的过程并不容易，但是我对这个问题，我倒是有一个简单的答案：既然旧的体验来自以往的关系，那我也需要新的体验来塑造我们的新经验。对于这种不安全感，我们只能带着依恋的焦虑，一点点接近和信任别人，在安全的关系中，慢慢地塑造我们的新经验。


    我们也要尝试把自己的感觉和母亲的感觉分开，去发展自己的关系和情感。这一点，我们后面的课程中还会讲到。


    总结一下。


    这一讲，我们说了导致感觉混淆的最重要的原因之一：不安全依恋。


    我们讲了什么是不安全依恋，以及它对自我发展的三点影响。我们讨论更多的是两个人的亲密关系。


    但在生活中，关系往往不仅仅是两个人之间的事情。下一讲，我们就来讲另一种导致感觉混淆的关系模式——三角关系。


    我们下节课见。


    ## Part 27：关系的三角化，当心成为痛苦的“夹心人”


    上节课我们讲到了不安全依恋如何造成感觉的混淆，影响自我的发展。这一讲，我们再来讲另一种造成我们感觉混淆的不健康的关系模式。


    这种关系也会让我们觉得很沉重，可是，又很难看清它的根源在哪里，常常会陷在其中却又很难改变。


    这种关系模式就是关系的三角化。


    ### 1. 普遍存在的“三角化”


    不知道你**有没有注意到**，**我们自己或者我们身边，比较稳定的关系，常常都是三个人的。**


    我们学生时代的死党密友经常是三个人，连《哈利·波特》里都是三个人组成的好朋友。伍迪·艾伦的电影《午夜巴塞罗那》里讲一对艺术家夫妻，两人经常吵架，在女主角加入组成了一个三人关系以后，两个人就不再吵架了。


    这并不是偶然，而是一种常见的人际现象。


    为什么呢？因为两个人发生矛盾和分歧的时候，很容易起冲突。这时候如果有第三个人，两人之间的情感张力就会减弱一些，三个人的关系就会重新得到平衡。这就是我们今天来讲的三角关系。


    作为一个家庭治疗师，我经常在咨询室里看到，夫妻之间在讲他们的问题，讲着讲着，要讲到他们的矛盾了，他们就会各自避开，去跟孩子说话。


    “儿子你**说说该怎么办？”**、“**儿子你说说是不是这样？**”


    他们这么做，既避免了彼此之间直接的冲突，同时还通过跟孩子说话，来向对方传递一些信息。


    所谓的**三角关系，就是当两个人之间的关系出现问题时，其中一个人或者两个人同时引入第三者，来减轻他们之间的情感张力，淡化他们的矛盾，从而让关系变得更稳定。**


    三角关系本身不是问题，它是一种正常的人际现象。


    但是请注意，如果三角关系中的某个人，一直成了两个人解决矛盾的工具，那我们就说，这个人**被三角化了**。


    被三角化的人，会产生很多的矛盾和困惑，别人的矛盾和情绪，就会变成他的问题。而他也会被卡在这段关系中，很难出来。


    家庭治疗大师，发明三角化概念的鲍文（Murray Bowen）甚至说：所有的精神疾病，究其本质，就是三角化的问题。


    其实，三角化是很普遍的。**以家庭关系为例**，**有些夫妻产生矛盾了，他们就会通过贬低孩子，来贬低对方。**


    比如，妻子跟丈夫说：“看看你家孩子，今天又惹什么祸了。”


    丈夫会跟妻子说：“看看你教的儿子，成绩这么差！”


    当夫妻这么说的时侯，看起来他们是在指责儿子，其实是在指责对方对孩子的教育不上心，对家庭不够投入。


    但是孩子不会知道，他会以为自己犯了错，才会让父母这么生气。


    在关系的互补中，我们讲过一个例子：在咨询室里，爸爸指责妈妈，儿子就去保护妈妈。


    这时候，孩子就会吸收妈妈的忧伤和对爸爸的愤怒，哪怕爸爸想靠近这个孩子都没有办法。这就是关系的三角化。


    还有一种情况，父母都很爱孩子，这时候父母的一方经常会以孩子的名义向对方提要求：女儿说了要怎么怎么样，这样对女儿才是好的。对方还没法反驳。这时候，孩子就会被提到一个很高的位置，成了父母权力的来源。女儿也会非常小心，担心自己的话会变成父母冲突的来源。这也是一种三角化。


    职场中也有这样的三角化。很多办公室政治，就是这种三角化的产物。


    我有一个来访者，本来在公司好好做自己的事，跟部门领导关系也不错，可是公司空降来一个大领导。


    这个大领导对他倒没什么意见，可是跟那个部门领导特别不对付。


    有一次他去做报告，出现了一个纰漏，部门领导也在，大领导就冷笑着说：“你们XX部门就是这种水平吗？”


    看起来大领导是在说他，其实是借着他在说那个部门领导。部门领导当时脸色铁青，就把他训了一顿。


    这个来访者说：“自从大领导和部门领导发生矛盾以后，我每天上班就跟坐牢一样。明明是他们俩有矛盾，我却觉得自己比他们还累。”


    真是神仙打架，小鬼遭殃。这也是一种三角化。


    被三角化的人，很容易产生很大的情感压力。


    有个被卷入三角化的孩子说：“我就像是父母的拳击手套，他们看起来是打对方，其实都打在了我身上。”


    这是被卷入三角化的人经常会有的感觉。


