    ## Part 13：对世界的应该思维，为什么我总是看不清楚现实？


    欢迎来到《自我发展心理学》。


    你好，我是陈海贤。


    我先来讲个故事。《荷马史诗》里讲到，英雄奥德修斯回家途中曾遇到一个妖怪，这个妖怪有一张床，每个过路的，它都会抓到这张床上躺一躺。


    如果这个过路人的身体比床短，它就把过路人拉到跟床一样长；如果比床长，它就把它长的部分锯下来。


    以前读这个故事的时候，我一直以为这个妖怪想杀人，现在我想，也许它只是想找个人结婚。只不过，它头脑中所设想的理想伴侣应该跟床一样长。


    我们当然不会像那个妖怪一样蠢，可是你知道吗？我们的头脑里也经常会有类似的想法。比如：


    - 小时候，我们觉得自己应该有**更懂我们、更爱我们**的父母；

    - 读书的时候，我觉得自己该去更好的学校，有更好的成绩；

    - 工作了，我们该进更好的公司，赚更多的钱；

    - 为人父母了，我们就觉得子女该更听话。


    ……


    > 如果现实不按我们头脑中这些假设来运行，我们也恨不得弄一张这样的床，把不符合我们想法的现实改造一番。


    这就是我们今天想讲的第二种防御型思维——应该思维。


    > 应该思维的本质，就是不去认识真实的世界，而是试图让真实的世界屈服于我们头脑中已有的规则，并在世界不符合我们头脑中的规则时，表现出怨恨、愤怒、焦虑或者沮丧。


    我们可以把应该思维分为两种：


    **一种，是对世界和他人的应该思维；**


    **另一种，是对我们自己的应该思维。**


    今天这节课，我们先讲对世界和他人的应该思维。


    ### 1. 消极情绪背后的应该思维


    不知道你有没有发现，几乎所有的消极情绪背后，都有应该思维的影子。


    我前段时间见了一个妈妈，她总是嫌儿子拖拉不懂事，过来问我有什么办法能够让儿子听话。事实上，她的孩子并没有什么大问题，就是早上会赖床，晚上做作业有些拖拉之类的。


    我问她：“你想要一个什么样的儿子呢？”


    她说：“我觉得我的儿子就应该是那种聪明、听话、懂事、乖巧的。所以当我发现他现实中不是这样的，我就很生气，就像要把他矫正过来。可是我越这样，儿子越不听话，两人的关系越闹越僵，这让我很苦恼。”


    这个妈妈的苦恼背后，就有孩子应该怎么样的应该思维。她越是放不下这种“**应该**”，就越难处理好现实。


    我的另一个来访者，最近因为职场焦虑来咨询我。他刚换了工作。新人嘛，公司的人对他都挺友善的。只有一个同事，对他爱理不理。他有问题去请教那个同事，那个同事经常流露出一种“**这你都不懂**”的傲慢。


    偏偏那个同事的工作做得不错，其他人都挺喜欢那个同事的。


    我的来访者就对那个同事非常生气，下定决心要在业务上超过他。每次那个同事有什么表现，他都很在意。如果那个同事做得比他好，他就会非常焦虑和沮丧，甚至到了见到那个同事就紧张的地步。


    这个故事里的来访者背后，有很多的应该思维。


    第一个“应该”，是他觉得所有的同事都应该对他好，或者抽象点说，他觉得所有人都应该喜欢他。所以当那个同事表现出傲慢时，他就非常生气。


    第二个“应该”，是他觉得既然同事不尊重我，我就应该超过他。只有超过他，我才能获得内心的平静。


    就像很多励志故事的范本一样，好人凭借自己的不懈努力超过了坏人，得到了大家的一致认可。当现实不符合这个故事范本时，他就非常焦虑。而且这两个“应该”是相互加强的。“他应该喜欢我，结果没有，所以我很受伤。因为我受了伤，所以我就要超过他。”


    他把所有的自我价值都放到了和这个同事的比较上，一旦发现自已不如这个同事的地方，他就会觉得自己很没用，并因此焦虑沮丧。


    后来，当我跟他讨论这些时，他也意识到了情绪背后的这种思维。可是他说：“老师，你说的应该思维我理解了，可是我就不能想超过他吗？”


    ### 2. 愿望和应该思维的区别


    他提的这个问题非常重要，我也想在这里解释一下。


    无论是想要儿子乖乖，还是工作中想要超过同事，这些愿望本身并没有什么不合理。毕竟就像周星驰说的，“人如果没有梦想，和咸鱼又有什么区别。”


    可是，应该思维和愿望有一个最根本的区别，就是能不能容忍现实跟我们的愿望不一致。


    我们希望孩子乖巧听话懂事，这是我们的愿望，可孩子就有他这个年龄的孩子常有的拖拉，这就是事实。我们都希望自己被人喜欢和尊重，这是我们的愿望。可是你也知道，有时候就是会有人不喜欢你，这就是事实。即使它让你不舒服，你也只能接受了。


    事实是不会跟你讨价还价的，你也战胜不了事实。就算你想要改变事实，那也只能在承认事实的基础上想办法。


    可是，有应该思维的人看不到这一点。他们好像是在跟事实赌气，觉得事实就不应该这样。


    比如，那个妈妈对不听话的孩子这么生气的时候，她好像是在说：我必须要让孩子符合我的愿望。


    当我问她：“如果这个阶段的孩子就是会拖拉怎么办呢？”


    她低着头倔强地说：“肯定有办法让他改。”


    这时候，她的愿望已经超越了现实。那个希望能够超过自己同事的来访者也是如此。


    如果超过同事只是他的愿望，那这个愿望落空的时候，他就可以有其他选择了。也许他就会想：算了，反正平时接触也不多，眼不见为净。或者大不了干脆再换一个工作。


    可是当他陷入一种应该思维的时候，他其实也在说：我必须要超过这个同事。这时候，他就看不到其他的可能性了。


    “必须”和应该思维经常是相伴相生的。而“必须”意味着只能是这个结果。当结果不符合这个预期时，他就会陷入到严重的焦虑当中。


    愿望和应该思维还有一个重要的区别，当我们想做一件事的时候，我们是愿望的主人，我们支配着我们的愿望。


    可是当我们陷入应该思维的时候，应该思维好像变成了支配我们的主人，我们只能服从于应该思维背后的规则，这样我们就失去了我们的自主性。


    我的一个心理咨询师朋友，在回答别人问题时，经常说：“没什么大不了，反正又不会死。”


    有一天，一个人问他：“那万一真死了怎么办？”


    他说：“没什么大不了，反正正人都死。”


    其实他想说的就是，不要轻易陷入这种应该思维当中。


    所以后来，我就跟我的来访者讲了愿望和应该的区别。


    我问他：“让同事喜欢你，或者超过你的同事，究竟是 你的愿望，还是你必须做的事情？”


    他想了想说：“这应该还是愿望吧。”


    我说好，那你就去想，为什么它们不是必须的，把你所能想到的所有理由都列出来。


    他回去想了很多理由，比如他的价值不需要用这个同事来肯定，就算没超过同事，他也有自己的进步等等。


    当他想这不是必须的时候，他就从应该思维中解脱出来了，他的焦虑也逐渐缓解了。


    看到这里，也许你还是会有一些疑惑。你会问：无论在现实中，还是在电影里，很多人下决心的时候，都会说：“我一定要做到！”而事后确实也有很多人做到了，我们也会把他们当做励志的榜样。


    如果说愿望是一个可以完成，也可以不完全完成的东西，而不是必须要做到的东西，那我们会不会太容忍自己偷懒了？


    对于这个问题，我是这么想的。


    首先，当一个人说“我一定要做到！”的时候，他其实并不是说一定能做到这件事，而是说他有投入和奉献的决心。这个决心不是关于外在世界的，而是关于他自己的。


    他自己愿意投入和奉献多少，这当然是他自己能决定的，但是他决定不了这件事是否能做成。就算他有很大的愿望去做成这件事，也不能奢望现实来迁就他的愿望，否则就变成了应该思维。


    第二，如果一个人把决心看成是一种愿望，而不是必须完成的事，会让他变得更灵活。


    有时候，越是认识到有些路走不通，你越会去找别的路。越是接受现实，你越能利用现实，去实现自己的愿望，而不是在焦虑、抑郁和愤怒中，跟现实死气。


    最后我想说，区分愿望和现实，是一个人成熟的标志，也是走出应该思维的关键。


    作为一个成年人，你得接受，这个世界不是围绕着你来设计的，宇宙根本不理会你的喜怒哀乐，世界有时候就是有很多不公平，人生就是有很多苦难和不如意。


    如果你一直放不下头脑中关于世界的设想，就像一个孩子不能放下对童话世界的执念，你的脑子里就一直会有很多“这个世界应该如此”的图景，而当现实不符合这个图景时，你的心里就会生出忧郁、愤恨和沮丧这些负面情绪。


    而这些负面情绪最初来源于你对这个世界过于乐观的想象，现在又变成了你对世界悲观的理由。


    你盯着现实与“应该”的裂痕，沉浸在对这个世界的失望当中，就没有办法多看一看这个世界中美好的东西。这就是应该思维对自我发展的妨碍。


    今天，我们讲了对世界和他人的应该思维，讲了怎么区分“应该”和“愿望”。


    下节课我会继续讲，对自我的应该思维。


    下一讲见。


    ## Part 14：对自己的应该思维，为什么我无法接纳自己的情绪？


    上节课我们提到，应该思维分为两种：一种是对世界和他人的应该思维，另一种是对自我的应该思维。


    今天我们就来讲第二种——对自我的应该思维。


    简单来说，应该思维是对自我的“暴政”，让我们在压迫中找不到自我。听完这一讲，你就会知道我为什么这么说了。


    ### 1. 自我烦恼的背后是应该思维


    有时候我会去参加一些活动，现场回答一些问题。经常有提问者说，我回答问题的思路比较奇特。


    比如一个男生跟我说：“我有一个很重要的目标，不得不为此做一些自己也不那么愿意的事情，比如准备一个很重要的考试。可是我的身体好像不听使唤，经常拖延，我怎么才能让自已持续的动力去做这件事呢？”


    我赶紧摇头说：“我可不能帮你出这个主意。你现在这样问我，好像你身体里有两个自我，一个是压迫的自我，一个是无奈的自我，前面的一个在逼着后面的一个做他不喜欢的
    事情。”


    无奈的自我呢，除了偶尔通过拖延表达一下不满和反抗，没别的发言权。现在你想让我帮压迫的自我，来让无奈的自我彻底闭嘴。我可不能这么做，通常我都是站在弱者这边的。”


    我这么回答他，倒也不是为了耍嘴皮子。我发现，几乎所有关于自我的烦恼背后，都有一个“应该自我”存在。


    这个男生问题背后的“应该自我”是什么呢？就是“我应该全力以赴心无旁骛，哪怕这不是我愿意做的事情。”


    当他发现，现实的自我和这个应该的自我有差距时，他就会想“这是不是我有问题”。


    如果我以正统的方式回答他的问题，跟他说说自己管理的办法，那我就认同了他这个问题背后，那个“应该自我”的假设。我其实也就认同了“对，你就是有问题，这个问题就是你想的那样。”


    可是真是这样吗？为什么那个“应该自我”就是合理的呢？


    我就是想通过一些奇怪的回答，来动摇他头脑中“应该如此”的信念。我想告诉他：


    没有什么是应该的，我们关于自己应该怎么样的假设，也许本身就是偏见。


    我和我的来访者也会讨论他们心里的自我应该，有时候他们会问我：“老师，难道我不该对自己的人生提出更高的要求吗？”


    我这时候会告诉他们：我们当然需要追求一个更好的自己，但我们要搞清的是，这个更好的标准来自哪里。它来自你的内心，还是来自外在的设定？


    曾有一个朋友写信跟我说，他现在28岁，忽然醒悟了，觉得自己应该要努力了。所以他现在每天睡6个小时，没有周六周日，努力学习一些东西。每次学习的时候都很开心，可是每当效率变低的时候，他就会觉得沮丧，觉得自己不如这样奋斗着猝死了。


    可是又有时候，他觉得自己这种放弃的心态真是太弱了，觉得人家创业的比他辛苦太多，自己奋斗的日子还长着呢。


    该怎么理解这种心态呢？你可以看到，这种心态里，有一种自我强迫的存在，就来自“我应该要努力”的应该思维。


    我们来看想，自然的努力是怎么样的。


    也许你也会看到身边那些真正努力的人，他们心里有一个想实现的目标，但其实他们并不那么关心自己努力不努力这件事。（看一看这里，重点！！！）


    他们会把所有的注意力都放到事情上，他们只想把事情做成。这时候，努力是一种自主自发的状态，是创造活动所产生的副产品。


    可是，当一个人觉得自己“应该要努力”的时候会怎么样呢？


    他会想，“虽然我也不知道自己要做什么，可是既然那些成功的人都很努力，头悬梁锥刺股这件事我也会啊。”于是他开始遵照内心应该的规刚行事。


    他读书、听讲座、学习。可是他心里并没有特别想做成的事情。只想要努力这种状态本身，因为“努力总是对的”。


    ### 2. 应该思维的本质是模仿


    想一想，生活中有多少人在跟你灌输“应该如此”的信条呢？


    电视上的偶像剧在告诉你，该怎么谈恋爱；


    精明的商家在告诉你，该怎么给情侣送什么礼物；


    结婚的时候要拍什么样的婚纱照；


    有个水果贩子在一个平安夜发明了平安夜要吃苹果，于是，平安夜送苹果就变成了-一种标配。


    我们的心里有太多的“应该”在告诉我们怎么做，这些应该思维变成了我们对自己情感的限制，并最终取代了我们真实的情感表达。这就是自我应该思维的最大问题。


    听到这儿，也许你已经明白了。“我应该如此”的应该思维，它的本质，是用社会规则、他人的期待或者文化习俗，代替了我们自发的行动。


    应该思维完整的语句也许是：既然别人觉得那样做是对的，那我就应该那样做。既然别人期待我这样，那我就应该像别人期待的这样做。


    也许你还会有点困惑：刚刚所有故事里的主人公：他们想努力、想改变，看起来也是自主自愿的，没有人强迫他们，这难道不是自发的行动吗？


    其实，这不是自发的行动，而是对自发的一种模仿。


    我们还接着上面那个要努力的年轻人来说。


    他告诉我，到后来，他感到自己开始懈怠了，为了鼓励自己继续努力，就买了很多书，但很少去翻；还办了健身卡，但从来不去锻炼；做过很多计划，但从来没有认真执行。


    你有没有觉得，有时他更像在表演一场叫做“努力”的行为艺术呢？


    是的，他并不真的想要继续努力，而是希望通过摆出努力的Pose，来满足他心里我“应该要努力”的想法。


    从真正的努力，到追求努力的状态，到追求努力的感觉，努力逐渐变成了对努力的模仿。这就是应该思维胁迫下的自我和自然状态下的自我的区别。


    应该思维导致非黑即白


    你现在或许能理解为什么我说应该思维是对自我的“暴政”了。因为，应该思维会妨碍我们真实的情感表达，让我们的行为偏离事情本身，变成一种模仿。


    其实，应该思维的影响远不止于此。应该思维不仅会影响我们的情感和行为，更会影响我们的思维，造成思维上的非黑即白。


    我曾有一个来访者，她自觉自己是一个善良的人，这是她的理想的“应该自我”。有一天，她经过学校门口，看到学校门口有一个乞丐。这个乞丐伸手向她要钱，她犹豫了一下，没有给。


    本来这是一件小事，可是她就非常内疚，一直在想，“我是不是不够善良了”。她的内疚背后，就有“我应该善良”的应该思维，而且这个应该思维紧相连的，是“如果我不给乞丐钱，我就不善良了”这样的非黑即白的思维。


    - 如果我失恋了，我就没爱；

    - 如果老板批评了我，我就没有能力；

    - 如果他没帮我，他就是一个坏人。


    很多我们的烦恼背后，都是应该思维所导致的非黑即白。


    为什么应该思维会导致非黑即白呢？如果我们遵循的是我们的感觉，它常常是非常复杂的，也是自然流动的，有很多的灰色地带。


    有时候我们会对路边的乞丐有善心，有时候我们会熟视无睹甚至有些厌弃，这都是我们真实的感受。


    但是，如果我们依据“应该规则”来做判断，那就会不一样了。“应该的规则”只有符合不符合，遵守不遵守。


    我要么是一个善良的人，要么不是一个善良的人。我要么努力，要么不努力。因为规则天生就是非黑即白的。


    一旦我们用理想化的规则来限定我们自己，判定我们自己，我们的思维变得僵固了，我们就很难容忍自己感受中和规则不同的部分。我们会扭曲自己的情感，以让它符合“应该”的要求。


    所以，应该思维不仅妨碍了我们真实的情感表达，还固化了我们的思维。


    现在，我们知道了应该思维的本质，以及应该思维带给我们的危害，那么你有没有思考过，我们为什么会陷入应该思维呢？为什么会越陷越深，甚至让这种“应该”变成我们理所当然的思维方式呢？


    在这里，我想给你介绍心理学家霍尼（Karen Horney）的理论。她说：


    人之所以会陷入应该思维，是因为我们不断在外在世界中寻找被别人喜爱的“自我”标准，来妄图根据这个标准创造一个理想的自我。


    这个理想的自我通常都是完美的，聪明、美丽、优秀、毫无瑕疵。当我们用幻想的自我来对照现实的自我时，会觉得自己像个冒牌货。所以，我们会努力维持幻想中的形象，害怕别人看到幻想背后真实的自己。


    这些理想的自我，并不是来自于我们真实的自我经验，而是由很多“我应该很努力”、“我应该谈恋爱”这类的规则堆起来的。


    为了保护这个幻想中的理想自我，他们会变得非常死板，会排斥自己内心跟这个“应该自我”不同的情绪和感受。


    这样一来，他们就被这些“应该的规则”支配了，成为了“应该规则”下的提线木偶。


    那么，我们该如何跳出应该思维，逃脱这个暴政呢？


    这个说起并不复杂，就是找回我们的感觉。毕竟，感觉虽然模糊，但是它才是我们真实的东西。


    当然，在真实的世界中做到这一点也不容易，需要我们掌握新的思维工具。别着急，在这一章课程的后半部分，我会把这些思维工具教给你。


    总结一下，我们今天讲了对自我的应该思维。我们首先思考了应该思维的本质。<span style="color: red;">应该思维其实就是用别人的标准来代替自发行动的思维方式。</span>之后，我们思考了为什么应该思维是一种“暴政”。<span
    style="color: red;">因为它既会阻碍我们真实情感的表达，让我们的行为变成一种模仿，又会固化我们的思维，造成我们思维上的非黑即白。</span>当我们按照外在世界的标准设定人生目标时，很容易就变成应该思维牢笼中的囚徒，不再能看见世界的灰度，也不再拥有思维的弹性。


    到此为止，我们讲了两种防御思维：僵固思维和应该思维。


    下节课我们来讲第三种，也是最后一种防御思维——绝对化思维。


    我们下节课见。


    ## Part 15：绝对化思维，人为什么会陷入悲观主义？


    我们之前讲了两种防御型思维：僵固思维和应该思维。这节课，我们来讲第三种防御型思维——绝对化思维。


    我想先讲一个狗得抑郁症的故事。这是二十世纪六十年代，心理学家塞利格曼（Martin E.P. Seligman）所做的一个实验。


    塞利格曼是美国前心理学会主席，他被称为积极心理学之父，国内出版了很多他关于幸福的书。可是他在学术界成名，是从研究狗是怎么得抑郁症开始的。


    怎么研究呢？


    他把两群狗赶到A和B两个笼子里，并给笼子通电。A笼子和B笼子用一根铁杆接通，所以两个笼子的狗都经受了一样的电击。区别仅在于，A笼子里有切断电源的杠杆，而B笼子没有。


    被电击很痛苦，所以狗就在笼子里跑来跑去寻找办法。A笼子里的狗很快学会了通过按杠杆切断电源，而B笼子里的狗却什么也做不了，只能等着A笼子里的狗切断电源。


    然后，他把这两群狗分别放到C笼子里。C笼子并没有杠杆，但是很矮，狗只要奋力一跃，就能跳出笼子。当给C笼子通电时，原来A笼子里的狗很快就学会了从C笼子里跳出来，而原来B笼子里的狗却趴在笼子里，呜呜地经受着电击，一动不动。


    ### 1. 习得性无助是对伤害的抽象


    为什么B笼子里的狗经受了电击，就不动了呢？它是因为之前的电击吗？可是，A笼子里的狗和B笼子里的狗，之前受的电击是一样的，为什么A笼子里的狗就会不断尝试跳出笼子呢？


    答案是，B笼子里的狗不仅受了电击，而且形成了这样一种信念：“我再做什么也没有用了”。


    不是电击，而是电击下形成的这种信念，让B笼子里的狗放弃了挣扎。塞利格曼创造了一个著名的心理学概念，来总结B笼子里狗的表现，叫做“习得性无助”。


    其实人也经常陷入这种习得性无助中。比如：


    工作压力会让我们习得性无助，觉得自己再努力也赶不上工作进度的，所以破罐子破摔，干脆宕机了。


    失恋也会让人产生习得性无助，再也不相信自己能找到好的爱情了。


    任何回避行为和抑郁情绪背后，都有这种习得性无助的影子在。在这种习得性无助背后，我们也经常想“再做什么也没有用了”，这就是我们今天要讲的绝对化思维。


    ### 2. 那么这种绝对化思维的本质是什么呢？


    这跟人类的抽象思维能力有关。这种抽象化思维能力擅长总结规律，提高生存率，但是也容易把所受的伤害抽象化，扩大防御范围。而绝对化思维，就是对伤害的抽象化。


    这有点像，每次遇到让我们痛苦的事情，我们就在心里埋下了一颗地雷。这颗地雷很危险，一接触，就会触发我们应激性的情绪反应。


    所以为了避免接触这些创伤性事件，我们把危险抽象化，在内心里树起警示牌，

    '
  mdcn: '

    总结一下，这节课我们讲了如何克服僵固型思维。我们知道克服僵固型思维的核心，是要改变对错误的认知。而改变对错误的认知，我有三个方法：


    - 第一，把错误看作是学习的机会；

    - 第二，突破自己不会犯错的形象；

    - 第三，制定犯错计划。


    下节课，我们讲另一种防御型思维——应该思维。我们下节课见。


    ## Part 13：对世界的应该思维，为什么我总是看不清楚现实？


    欢迎来到《自我发展心理学》。


    你好，我是陈海贤。


    我先来讲个故事。《荷马史诗》里讲到，英雄奥德修斯回家途中曾遇到一个妖怪，这个妖怪有一张床，每个过路的，它都会抓到这张床上躺一躺。


    如果这个过路人的身体比床短，它就把过路人拉到跟床一样长；如果比床长，它就把它长的部分锯下来。


    以前读这个故事的时候，我一直以为这个妖怪想杀人，现在我想，也许它只是想找个人结婚。只不过，它头脑中所设想的理想伴侣应该跟床一样长。


    我们当然不会像那个妖怪一样蠢，可是你知道吗？我们的头脑里也经常会有类似的想法。比如：


    - 小时候，我们觉得自己应该有**更懂我们、更爱我们**的父母；

    - 读书的时候，我觉得自己该去更好的学校，有更好的成绩；

    - 工作了，我们该进更好的公司，赚更多的钱；

    - 为人父母了，我们就觉得子女该更听话。


    ……


    > 如果现实不按我们头脑中这些假设来运行，我们也恨不得弄一张这样的床，把不符合我们想法的现实改造一番。


    这就是我们今天想讲的第二种防御型思维——应该思维。


    > 应该思维的本质，就是不去认识真实的世界，而是试图让真实的世界屈服于我们头脑中已有的规则，并在世界不符合我们头脑中的规则时，表现出怨恨、愤怒、焦虑或者沮丧。


    我们可以把应该思维分为两种：


    **一种，是对世界和他人的应该思维；**


    **另一种，是对我们自己的应该思维。**


    今天这节课，我们先讲对世界和他人的应该思维。


    ### 1. 消极情绪背后的应该思维


    不知道你有没有发现，几乎所有的消极情绪背后，都有应该思维的影子。


    我前段时间见了一个妈妈，她总是嫌儿子拖拉不懂事，过来问我有什么办法能够让儿子听话。事实上，她的孩子并没有什么大问题，就是早上会赖床，晚上做作业有些拖拉之类的。


    我问她：“你想要一个什么样的儿子呢？”


    她说：“我觉得我的儿子就应该是那种聪明、听话、懂事、乖巧的。所以当我发现他现实中不是这样的，我就很生气，就像要把他矫正过来。可是我越这样，儿子越不听话，两人的关系越闹越僵，这让我很苦恼。”


    这个妈妈的苦恼背后，就有孩子应该怎么样的应该思维。她越是放不下这种“**应该**”，就越难处理好现实。


    我的另一个来访者，最近因为职场焦虑来咨询我。他刚换了工作。新人嘛，公司的人对他都挺友善的。只有一个同事，对他爱理不理。他有问题去请教那个同事，那个同事经常流露出一种“**这你都不懂**”的傲慢。


    偏偏那个同事的工作做得不错，其他人都挺喜欢那个同事的。


    我的来访者就对那个同事非常生气，下定决心要在业务上超过他。每次那个同事有什么表现，他都很在意。如果那个同事做得比他好，他就会非常焦虑和沮丧，甚至到了见到那个同事就紧张的地步。


    这个故事里的来访者背后，有很多的应该思维。


    第一个“应该”，是他觉得所有的同事都应该对他好，或者抽象点说，他觉得所有人都应该喜欢他。所以当那个同事表现出傲慢时，他就非常生气。


    第二个“应该”，是他觉得既然同事不尊重我，我就应该超过他。只有超过他，我才能获得内心的平静。


    就像很多励志故事的范本一样，好人凭借自己的不懈努力超过了坏人，得到了大家的一致认可。当现实不符合这个故事范本时，他就非常焦虑。而且这两个“应该”是相互加强的。“他应该喜欢我，结果没有，所以我很受伤。因为我受了伤，所以我就要超过他。”


    他把所有的自我价值都放到了和这个同事的比较上，一旦发现自已不如这个同事的地方，他就会觉得自己很没用，并因此焦虑沮丧。


    后来，当我跟他讨论这些时，他也意识到了情绪背后的这种思维。可是他说：“老师，你说的应该思维我理解了，可是我就不能想超过他吗？”


    ### 2. 愿望和应该思维的区别


    他提的这个问题非常重要，我也想在这里解释一下。


    无论是想要儿子乖乖，还是工作中想要超过同事，这些愿望本身并没有什么不合理。毕竟就像周星驰说的，“人如果没有梦想，和咸鱼又有什么区别。”


    可是，应该思维和愿望有一个最根本的区别，就是能不能容忍现实跟我们的愿望不一致。


    我们希望孩子乖巧听话懂事，这是我们的愿望，可孩子就有他这个年龄的孩子常有的拖拉，这就是事实。我们都希望自己被人喜欢和尊重，这是我们的愿望。可是你也知道，有时候就是会有人不喜欢你，这就是事实。即使它让你不舒服，你也只能接受了。


    事实是不会跟你讨价还价的，你也战胜不了事实。就算你想要改变事实，那也只能在承认事实的基础上想办法。


    可是，有应该思维的人看不到这一点。他们好像是在跟事实赌气，觉得事实就不应该这样。


    比如，那个妈妈对不听话的孩子这么生气的时候，她好像是在说：我必须要让孩子符合我的愿望。


    当我问她：“如果这个阶段的孩子就是会拖拉怎么办呢？”


    她低着头倔强地说：“肯定有办法让他改。”


    这时候，她的愿望已经超越了现实。那个希望能够超过自己同事的来访者也是如此。


    如果超过同事只是他的愿望，那这个愿望落空的时候，他就可以有其他选择了。也许他就会想：算了，反正平时接触也不多，眼不见为净。或者大不了干脆再换一个工作。


    可是当他陷入一种应该思维的时候，他其实也在说：我必须要超过这个同事。这时候，他就看不到其他的可能性了。


    “必须”和应该思维经常是相伴相生的。而“必须”意味着只能是这个结果。当结果不符合这个预期时，他就会陷入到严重的焦虑当中。


    愿望和应该思维还有一个重要的区别，当我们想做一件事的时候，我们是愿望的主人，我们支配着我们的愿望。


    可是当我们陷入应该思维的时候，应该思维好像变成了支配我们的主人，我们只能服从于应该思维背后的规则，这样我们就失去了我们的自主性。


    我的一个心理咨询师朋友，在回答别人问题时，经常说：“没什么大不了，反正又不会死。”


    有一天，一个人问他：“那万一真死了怎么办？”


    他说：“没什么大不了，反正正人都死。”


    其实他想说的就是，不要轻易陷入这种应该思维当中。


    所以后来，我就跟我的来访者讲了愿望和应该的区别。


    我问他：“让同事喜欢你，或者超过你的同事，究竟是 你的愿望，还是你必须做的事情？”


    他想了想说：“这应该还是愿望吧。”


    我说好，那你就去想，为什么它们不是必须的，把你所能想到的所有理由都列出来。


    他回去想了很多理由，比如他的价值不需要用这个同事来肯定，就算没超过同事，他也有自己的进步等等。


    当他想这不是必须的时候，他就从应该思维中解脱出来了，他的焦虑也逐渐缓解了。


    看到这里，也许你还是会有一些疑惑。你会问：无论在现实中，还是在电影里，很多人下决心的时候，都会说：“我一定要做到！”而事后确实也有很多人做到了，我们也会把他们当做励志的榜样。


    如果说愿望是一个可以完成，也可以不完全完成的东西，而不是必须要做到的东西，那我们会不会太容忍自己偷懒了？


    对于这个问题，我是这么想的。


    首先，当一个人说“我一定要做到！”的时候，他其实并不是说一定能做到这件事，而是说他有投入和奉献的决心。这个决心不是关于外在世界的，而是关于他自己的。


    他自己愿意投入和奉献多少，这当然是他自己能决定的，但是他决定不了这件事是否能做成。就算他有很大的愿望去做成这件事，也不能奢望现实来迁就他的愿望，否则就变成了应该思维。


    第二，如果一个人把决心看成是一种愿望，而不是必须完成的事，会让他变得更灵活。


    有时候，越是认识到有些路走不通，你越会去找别的路。越是接受现实，你越能利用现实，去实现自己的愿望，而不是在焦虑、抑郁和愤怒中，跟现实死气。


    最后我想说，区分愿望和现实，是一个人成熟的标志，也是走出应该思维的关键。


    作为一个成年人，你得接受，这个世界不是围绕着你来设计的，宇宙根本不理会你的喜怒哀乐，世界有时候就是有很多不公平，人生就是有很多苦难和不如意。


    如果你一直放不下头脑中关于世界的设想，就像一个孩子不能放下对童话世界的执念，你的脑子里就一直会有很多“这个世界应该如此”的图景，而当现实不符合这个图景时，你的心里就会生出忧郁、愤恨和沮丧这些负面情绪。


    而这些负面情绪最初来源于你对这个世界过于乐观的想象，现在又变成了你对世界悲观的理由。


    你盯着现实与“应该”的裂痕，沉浸在对这个世界的失望当中，就没有办法多看一看这个世界中美好的东西。这就是应该思维对自我发展的妨碍。


    今天，我们讲了对世界和他人的应该思维，讲了怎么区分“应该”和“愿望”。


    下节课我会继续讲，对自我的应该思维。


    下一讲见。


    ## Part 14：对自己的应该思维，为什么我无法接纳自己的情绪？


    上节课我们提到，应该思维分为两种：一种是对世界和他人的应该思维，另一种是对自我的应该思维。


    今天我们就来讲第二种——对自我的应该思维。


    简单来说，应该思维是对自我的“暴政”，让我们在压迫中找不到自我。听完这一讲，你就会知道我为什么这么说了。


    ### 1. 自我烦恼的背后是应该思维


    有时候我会去参加一些活动，现场回答一些问题。经常有提问者说，我回答问题的思路比较奇特。


    比如一个男生跟我说：“我有一个很重要的目标，不得不为此做一些自己也不那么愿意的事情，比如准备一个很重要的考试。可是我的身体好像不听使唤，经常拖延，我怎么才能让自已持续的动力去做这件事呢？”


    我赶紧摇头说：“我可不能帮你出这个主意。你现在这样问我，好像你身体里有两个自我，一个是压迫的自我，一个是无奈的自我，前面的一个在逼着后面的一个做他不喜欢的
    事情。”


    无奈的自我呢，除了偶尔通过拖延表达一下不满和反抗，没别的发言权。现在你想让我帮压迫的自我，来让无奈的自我彻底闭嘴。我可不能这么做，通常我都是站在弱者这边的。”


    我这么回答他，倒也不是为了耍嘴皮子。我发现，几乎所有关于自我的烦恼背后，都有一个“应该自我”存在。


    这个男生问题背后的“应该自我”是什么呢？就是“我应该全力以赴心无旁骛，哪怕这不是我愿意做的事情。”


    当他发现，现实的自我和这个应该的自我有差距时，他就会想“这是不是我有问题”。


    如果我以正统的方式回答他的问题，跟他说说自己管理的办法，那我就认同了他这个问题背后，那个“应该自我”的假设。我其实也就认同了“对，你就是有问题，这个问题就是你想的那样。”


    可是真是这样吗？为什么那个“应该自我”就是合理的呢？


    我就是想通过一些奇怪的回答，来动摇他头脑中“应该如此”的信念。我想告诉他：


    没有什么是应该的，我们关于自己应该怎么样的假设，也许本身就是偏见。


    我和我的来访者也会讨论他们心里的自我应该，有时候他们会问我：“老师，难道我不该对自己的人生提出更高的要求吗？”


    我这时候会告诉他们：我们当然需要追求一个更好的自己，但我们要搞清的是，这个更好的标准来自哪里。它来自你的内心，还是来自外在的设定？


    曾有一个朋友写信跟我说，他现在28岁，忽然醒悟了，觉得自己应该要努力了。所以他现在每天睡6个小时，没有周六周日，努力学习一些东西。每次学习的时候都很开心，可是每当效率变低的时候，他就会觉得沮丧，觉得自己不如这样奋斗着猝死了。


    可是又有时候，他觉得自己这种放弃的心态真是太弱了，觉得人家创业的比他辛苦太多，自己奋斗的日子还长着呢。


    该怎么理解这种心态呢？你可以看到，这种心态里，有一种自我强迫的存在，就来自“我应该要努力”的应该思维。


    我们来看想，自然的努力是怎么样的。


    也许你也会看到身边那些真正努力的人，他们心里有一个想实现的目标，但其实他们并不那么关心自己努力不努力这件事。（看一看这里，重点！！！）


    他们会把所有的注意力都放到事情上，他们只想把事情做成。这时候，努力是一种自主自发的状态，是创造活动所产生的副产品。


    可是，当一个人觉得自己“应该要努力”的时候会怎么样呢？


    他会想，“虽然我也不知道自己要做什么，可是既然那些成功的人都很努力，头悬梁锥刺股这件事我也会啊。”于是他开始遵照内心应该的规刚行事。


    他读书、听讲座、学习。可是他心里并没有特别想做成的事情。只想要努力这种状态本身，因为“努力总是对的”。


    ### 2. 应该思维的本质是模仿


    想一想，生活中有多少人在跟你灌输“应该如此”的信条呢？


    电视上的偶像剧在告诉你，该怎么谈恋爱；


    精明的商家在告诉你，该怎么给情侣送什么礼物；


    结婚的时候要拍什么样的婚纱照；


    有个水果贩子在一个平安夜发明了平安夜要吃苹果，于是，平安夜送苹果就变成了-一种标配。


    我们的心里有太多的“应该”在告诉我们怎么做，这些应该思维变成了我们对自己情感的限制，并最终取代了我们真实的情感表达。这就是自我应该思维的最大问题。


    听到这儿，也许你已经明白了。“我应该如此”的应该思维，它的本质，是用社会规则、他人的期待或者文化习俗，代替了我们自发的行动。


    应该思维完整的语句也许是：既然别人觉得那样做是对的，那我就应该那样做。既然别人期待我这样，那我就应该像别人期待的这样做。


    也许你还会有点困惑：刚刚所有故事里的主人公：他们想努力、想改变，看起来也是自主自愿的，没有人强迫他们，这难道不是自发的行动吗？


    其实，这不是自发的行动，而是对自发的一种模仿。


    我们还接着上面那个要努力的年轻人来说。


    他告诉我，到后来，他感到自己开始懈怠了，为了鼓励自己继续努力，就买了很多书，但很少去翻；还办了健身卡，但从来不去锻炼；做过很多计划，但从来没有认真执行。


    你有没有觉得，有时他更像在表演一场叫做“努力”的行为艺术呢？


    是的，他并不真的想要继续努力，而是希望通过摆出努力的Pose，来满足他心里我“应该要努力”的想法。


    从真正的努力，到追求努力的状态，到追求努力的感觉，努力逐渐变成了对努力的模仿。这就是应该思维胁迫下的自我和自然状态下的自我的区别。


    应该思维导致非黑即白


    你现在或许能理解为什么我说应该思维是对自我的“暴政”了。因为，应该思维会妨碍我们真实的情感表达，让我们的行为偏离事情本身，变成一种模仿。


    其实，应该思维的影响远不止于此。应该思维不仅会影响我们的情感和行为，更会影响我们的思维，造成思维上的非黑即白。


    我曾有一个来访者，她自觉自己是一个善良的人，这是她的理想的“应该自我”。有一天，她经过学校门口，看到学校门口有一个乞丐。这个乞丐伸手向她要钱，她犹豫了一下，没有给。


    本来这是一件小事，可是她就非常内疚，一直在想，“我是不是不够善良了”。她的内疚背后，就有“我应该善良”的应该思维，而且这个应该思维紧相连的，是“如果我不给乞丐钱，我就不善良了”这样的非黑即白的思维。


    - 如果我失恋了，我就没爱；

    - 如果老板批评了我，我就没有能力；

    - 如果他没帮我，他就是一个坏人。


    很多我们的烦恼背后，都是应该思维所导致的非黑即白。


    为什么应该思维会导致非黑即白呢？如果我们遵循的是我们的感觉，它常常是非常复杂的，也是自然流动的，有很多的灰色地带。


    有时候我们会对路边的乞丐有善心，有时候我们会熟视无睹甚至有些厌弃，这都是我们真实的感受。


    但是，如果我们依据“应该规则”来做判断，那就会不一样了。“应该的规则”只有符合不符合，遵守不遵守。


    我要么是一个善良的人，要么不是一个善良的人。我要么努力，要么不努力。因为规则天生就是非黑即白的。


    一旦我们用理想化的规则来限定我们自己，判定我们自己，我们的思维变得僵固了，我们就很难容忍自己感受中和规则不同的部分。我们会扭曲自己的情感，以让它符合“应该”的要求。


    所以，应该思维不仅妨碍了我们真实的情感表达，还固化了我们的思维。


    现在，我们知道了应该思维的本质，以及应该思维带给我们的危害，那么你有没有思考过，我们为什么会陷入应该思维呢？为什么会越陷越深，甚至让这种“应该”变成我们理所当然的思维方式呢？


    在这里，我想给你介绍心理学家霍尼（Karen Horney）的理论。她说：


    人之所以会陷入应该思维，是因为我们不断在外在世界中寻找被别人喜爱的“自我”标准，来妄图根据这个标准创造一个理想的自我。


    这个理想的自我通常都是完美的，聪明、美丽、优秀、毫无瑕疵。当我们用幻想的自我来对照现实的自我时，会觉得自己像个冒牌货。所以，我们会努力维持幻想中的形象，害怕别人看到幻想背后真实的自己。


    这些理想的自我，并不是来自于我们真实的自我经验，而是由很多“我应该很努力”、“我应该谈恋爱”这类的规则堆起来的。


    为了保护这个幻想中的理想自我，他们会变得非常死板，会排斥自己内心跟这个“应该自我”不同的情绪和感受。


    这样一来，他们就被这些“应该的规则”支配了，成为了“应该规则”下的提线木偶。


    那么，我们该如何跳出应该思维，逃脱这个暴政呢？


    这个说起并不复杂，就是找回我们的感觉。毕竟，感觉虽然模糊，但是它才是我们真实的东西。


    当然，在真实的世界中做到这一点也不容易，需要我们掌握新的思维工具。别着急，在这一章课程的后半部分，我会把这些思维工具教给你。


    总结一下，我们今天讲了对自我的应该思维。我们首先思考了应该思维的本质。<span style="color: red;">应该思维其实就是用别人的标准来代替自发行动的思维方式。</span>之后，我们思考了为什么应该思维是一种“暴政”。<span
    style="color: red;">因为它既会阻碍我们真实情感的表达，让我们的行为变成一种模仿，又会固化我们的思维，造成我们思维上的非黑即白。</span>当我们按照外在世界的标准设定人生目标时，很容易就变成应该思维牢笼中的囚徒，不再能看见世界的灰度，也不再拥有思维的弹性。


    到此为止，我们讲了两种防御思维：僵固思维和应该思维。


    下节课我们来讲第三种，也是最后一种防御思维——绝对化思维。


    我们下节课见。


    ## Part 15：绝对化思维，人为什么会陷入悲观主义？


    我们之前讲了两种防御型思维：僵固思维和应该思维。这节课，我们来讲第三种防御型思维——绝对化思维。


    我想先讲一个狗得抑郁症的故事。这是二十世纪六十年代，心理学家塞利格曼（Martin E.P. Seligman）所做的一个实验。


    塞利格曼是美国前心理学会主席，他被称为积极心理学之父，国内出版了很多他关于幸福的书。可是他在学术界成名，是从研究狗是怎么得抑郁症开始的。


    怎么研究呢？


    他把两群狗赶到A和B两个笼子里，并给笼子通电。A笼子和B笼子用一根铁杆接通，所以两个笼子的狗都经受了一样的电击。区别仅在于，A笼子里有切断电源的杠杆，而B笼子没有。


    被电击很痛苦，所以狗就在笼子里跑来跑去寻找办法。A笼子里的狗很快学会了通过按杠杆切断电源，而B笼子里的狗却什么也做不了，只能等着A笼子里的狗切断电源。


    然后，他把这两群狗分别放到C笼子里。C笼子并没有杠杆，但是很矮，狗只要奋力一跃，就能跳出笼子。当给C笼子通电时，原来A笼子里的狗很快就学会了从C笼子里跳出来，而原来B笼子里的狗却趴在笼子里，呜呜地经受着电击，一动不动。


    ### 1. 习得性无助是对伤害的抽象


    为什么B笼子里的狗经受了电击，就不动了呢？它是因为之前的电击吗？可是，A笼子里的狗和B笼子里的狗，之前受的电击是一样的，为什么A笼子里的狗就会不断尝试跳出笼子呢？


    答案是，B笼子里的狗不仅受了电击，而且形成了这样一种信念：“我再做什么也没有用了”。


    不是电击，而是电击下形成的这种信念，让B笼子里的狗放弃了挣扎。塞利格曼创造了一个著名的心理学概念，来总结B笼子里狗的表现，叫做“习得性无助”。


    其实人也经常陷入这种习得性无助中。比如：


    工作压力会让我们习得性无助，觉得自己再努力也赶不上工作进度的，所以破罐子破摔，干脆宕机了。


    失恋也会让人产生习得性无助，再也不相信自己能找到好的爱情了。


    任何回避行为和抑郁情绪背后，都有这种习得性无助的影子在。在这种习得性无助背后，我们也经常想“再做什么也没有用了”，这就是我们今天要讲的绝对化思维。


    ### 2. 那么这种绝对化思维的本质是什么呢？


    这跟人类的抽象思维能力有关。这种抽象化思维能力擅长总结规律，提高生存率，但是也容易把所受的伤害抽象化，扩大防御范围。而绝对化思维，就是对伤害的抽象化。


    这有点像，每次遇到让我们痛苦的事情，我们就在心里埋下了一颗地雷。这颗地雷很危险，一接触，就会触发我们应激性的情绪反应。


    所以为了避免接触这些创伤性事件，我们把危险抽象化，在内心里树起警示牌，

    '
