    反馈 feedback calculation

    2 BLIND AREA 盲目区 他人了解但自己不了解的区域

    表达 SELF-DISCLOSURE

    他人观察 OTHERS OBSERVATION

    3 HIDDEN AREA 隐藏区 我知道但他人不知道的信息

    4 UNKNOWN AREA 未知区 我们都不知的信息


    所谓他人对自己的反馈，扩大了解的可能性，持续与他们了解自己


