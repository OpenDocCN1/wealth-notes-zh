    2 行对应面前的 1 个数字 1 就代表了 B 的概率，面 2 就代表 A 1 的概率，A 赢的概率，版本的代表 A 赢 2。最后得到 A 的概率为 1/2+1/4=3/4，B
    的概率为 1/4，刚才的计算结果和费马的1/3、1/3、即 3/4。这个计算结果和费马的1/3一致。


