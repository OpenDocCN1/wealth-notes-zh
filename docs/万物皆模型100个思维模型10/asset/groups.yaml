    # 68.排列组合思维模型


    我们应该以不同的方式去思考问题，以此来应对这个复杂多变的世界。因此我特意前人智慧通过“视觉笔记”拿出来给大家，作为大家提供解决问题的可视化思维公式。


    # 排列组合 Permutation and Combination 是组合学最基本的概念。排列是指给定义个数的元素中取出指定个数的元素进行排序，例如从一到六的数字有
    720 种排列，对应由于这些数字组成的所有不重复亦不阙满的序列，例如“4,5,6,1,2,3”与1,3,5,2,4,6。组合则是指给定个数的元素中仅仅取出指定个数的元素，不考虑排序。例如
    S 的一个 k-组合是 S 的一个有 k 个元素的子集。若两个子集的元素完全相同并顺序相异，它仍视为同一个组合。排列组合的中心问题是研究给定要求的排列和组合可能出现的情况总数。


    ## MODEL STRUCTURE

    ## PERMUTATION AND COMBINATION''S FORMULA 排列组合公式


    排列数公式：从 n 个元素中取 k 个元素，k 个元素的排列数量为

    Pₙᵏ = n! / (n-k)!

    例如从 8 个人中选出 3 人安排在某次会议上担任三个不同的职位等，A、B、C 3 位可被排列为 3×2×1 种；排法总量为：

    P₈³ = 8! / (8-3)! = 8×7×6 = 336

    说出 336 种方法，因此产生一次事件中从全体事件的概率为：

    P = 1 / 336 = 0.00298

    和排列不同的是，组合不考虑取出来元素的顺序


    组合数公式：从 n 个元素中取出 k 个，k 个元素的组合数量为

    Cₙᵏ = (n choose k) = Pₙᵏ / k! = n! / [k!(n-k)!]

    例如从集合 {1,2,3,4,5,6,7,8,9} 中取 6 个元素的组合数为

    C₉⁶ = 9! / (6!3!) = 84


    内部元素参考排序

    分步乘法 A → 7 种 → C 2 种 → B

    即从 A 地到 B 地的方法：7×2×14 种选择

    内部元素不考虑排序

    分类加法 A 火箭 5 种 B

    从 A 到 B 的方法：2×5+7=14 种

    分类加法完成一项不同方法的需求，要求：有序、不重复、不遗漏。


