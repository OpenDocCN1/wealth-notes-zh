    ## 57. 复利效应思维模型


    我们整个应设法以不同的方式思考问题，以此应对这个瞬息万变的世界。因此我们将前一智慧透过“视觉语言”输出出来，为大家提供解决问题的可视化思维公式。


    复利是一种计算利息的方法，即复合成息，利滚利，把上一个期的本利和作为下一期的本金来计算。最简单的复利公式：收益 = 本金 × (1+ 利率)^ 周期。按照这种方法，利息除了会根据本金计算外，新得到的利息同样可以生息，因此俗称“利滚利”、“驴打滚”或“利叠利”。只要计算利息的周期越快，财富增长越快，而随着年期越长，复利效应亦会越来越明显。复利是现代理财一个重要概念，由此产生的财富增长，称作“复利效应”，对财富可以带来深远的影响。


    ## MODEL STRUCTURE

    ## 复利思维模型公式


    FV(Future Value)是指财富在未来的价值，即收益

    FV=PV(1+i)^n  — n 则是累计的周期，即期数

    i(interest)是指周期内的固定利率或固定回报率

    PV(Present Value)是指现值，亦即指本金


    THE VISUAL THINKING PATH OF COMPOUND INTEREST

    利滚利的可视化思维路径

    做事情 A 得结果 B

    循环往复

    而结果 B 反加强 A


    > 查理·芒格说：复利思维对应的假设有很多，在生活中我们还真会把公式进行演绎；如

    行动结果 = 认知 *(1+i)^n


    ## TAKE AN EXAMPLE

    ## 每天进步 0.01


    1^365=1 如果你不想进步，那么一年后，你如原地踏步

    1.01^365=37.8 如果你每天进步一点点，一年后你会远大于“1”

    0.99^365=0.03 如果你每天退步一点点，一年后你会远小于“1”


    ## 巴菲特的复利收益


    NET WORTH → $6K $7M $67M $376M

    AGE → 15 35 50 85


    巴菲特将总结自己的成功秘诀：“人生就像滚雪球，更重要的是发现很远的雪坡是很长的。”从 1965 年巴菲特接管伯克希尔公司，到 2010 年，过去 46 年巴菲特平均年回报率
    20.2%。而与此同时标普收益率为 10.8%。巴菲特的平均年复合收益率为 9.4%，巴菲特每年并不比市场多赚了 10.8% 而已。但是，46 年间巴菲特累计赚了
    90409%，而指数累计增长了 6262%。或许你会说，也只有一个巴菲特能够达到年复利 20%，那么，你就从现在开始培养财比，比特等待的时间更长，你也能达到他的财富。


    ## 国王要赏给还相多少粒粮食？


    古埃及有一个国王，一天忽然想到这个国王下棋，丞相让国王赏给他一些粮食，在“国际象棋棋盘上，第一个格放 1 粒米，第二个格放 2 粒米，第三个格放 4 粒米，第四个格放
    8 粒米，第五个格放 16 粒米，第六个格放 32 粒米，第七个格放 64 粒米，第八个格放 128 粒米…… ”问国王要赏给总共多少粒米？


    1 2 4 8 16 18446744073709500000


    ## INSPIRATION AND APPLICATION


    复利三要素之本金积累

    如果说复利的原动力是本金，那么你就要有足够的本金，创业、做生意、理财等方式，增加自己的本金积累，复利才会产生。


    复利三要素之提高利率

    在一定的本金下，你要想办法提高回报率，提高利率，提升收益率，让复利速度加快，比如投资、学习、技能提升 十年才会有效果，教学相长也是一种复利。此外投资从各渠道获取较深投资理财知识，学习投资学，懂得投资规律，从而提高收益率，积累更多本金。


    复利三要素之时间

    复利的核心逻辑是时间，你要让财富持续复利，越长的时间，复利效应越明显。时间的价值在于持续、坚持和积累。你要持之以恒地投入，长期持有，复利才会产生。对于每个人而言，时间是公平的，时间越早开始，复利效应越强。


    > 总结：查理·芒格说：“理解复利的魔力和获得它的困难是理解许多事情的核心和灵魂。”


    ## 58. 二八定律思维模型


    我们希望能以不同的方式去思考问题，以此来应对这个瞬息万变的世界，因此我们前几期都想要通过“视觉笔记”解读出来，为大家提供解决问题的可视化公式。


    帕累托法则（或称 80/20 法则、关键少数法则、二八法则、巴莱多定律）指出，约仅有 20% 的因素影响 80% 的结果。也就是说：所有变因中，最重要的仅有
    20%，虽然剩余的 80% 占了多数，影响的幅度却远低于“关键的少数”。管理学家约瑟夫·朱兰首先提出该原则，该法则以经济学家维尔弗雷多·帕累托的名字命名，并于他的文章《政治经济学》中说明了该现象，例如：意大利约有
    80% 的土地由 20% 的人口所有、80% 的豌豆产量来自 20% 的植株等等。该原则在现今企业管理中广泛运用。例如，“80% 的销售额来自 20% 的客户”。


    ## MODEL STRUCTURE 模型结构


    二八法则即原因和结果、投入和产出、努力和报酬之间本來存在着无法解释的不平衡。一般来说，投入和努力可以分成两种不同的类型：多数，它只能造成少许的影响；少数，它们造成主要的、重大的影响。


    ## TAKE AN EXAMPLE 举个例子


    假如 20% 碳酸饮料的人喝掉 80% 的碳酸饮料，那么这部分人应该是碳酸饮料制造商注意的对象,尽量争取取这 20% 的人来买,最好能进一步增加他对碳酸饮料消费量,减轻对制造商出于实际理由,可能令其忽视余下
    80% 啤酒饮料消费者的责任。因为他们的消费量只占 20%,同时当有一家公司发现自己 80% 的利润来自 20% 的顾客时,该制造商就会把 20% 的顾客盈利扩展到其它方面。也就是说,把注意力平均分散给所有的顾客更容易,也更合理。再者如果公司发现
    80% 的利润来源于 20% 的产品,那么该家公司应该全力来销售那些高利润的产品。


    复利模型测算，努力就机会收获,好的一个比例如下：1.03^365=1 如果你不进步,那么你会原地踏步 1.01^365=37.8 如果你每天进步一点点,一年后你会达到“1”
    0.99^365=0.03 如果你每天退步一点点,一年后你会趋小“1” 但是如果这个努力是 80% 的努力,那么换来的则是 20% 的结果。


    二八法则对我们的自身发展有着重要的现实意义：学会取舍将时间和精力花在最要事上，学会合理安排一个人的时间和精力都是非常有限的，要想做到“事事都好”几乎是不可能的，要学会合理地分配时间和精力，要想面面俱到还不如重点突破,把
    80% 的资源花在能出结果极强的 20% 的方面,这 20% 的方面又能带动其余 80% 的发展。


