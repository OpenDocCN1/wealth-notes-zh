    \n## 提升长远维度的能力\n\n提升长远维度的能力是将竞争的视角从短期转移到长期，通过建立系统的知识、方法和体系，提高在竞争环境中可持续发展的能力，从而在长远竞争中保持优势。\n\
    \n## 专注多维度的视角\n\n多维度的视角和系统的思维模式，需要同时关注不同维度的发展和变化，通过构建多维度的竞争战略，实现在不同维度的领先和协同，从而在复杂竞争环境中获得持续优势。\n\
    \n总结:主动将自身所处的空间维度拉高（自身能力的培养）目的是让对方无法在同维度空间中生存从而被市场淘汰。\n\n# 38. 凸透放大思维模型\n\n我们应该以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们对前人智慧通过“微软译”翻译出来，为大家提供解决问题的可视化思维公式。\n\
    \n放大镜思维将具体的事物放大，从而看清事物的局部或细节，如看似简单而易被忽视的问题，放大后可能会发现导致其发生的原因并不简单，“千里之堤溃于蚁穴”或“千里之行始于足下”。相反复杂而棘手的问题放大后可能会发现导致其发生的原因很简单。通常情况下指“放大”、“汇集”和“聚焦”的思维。当我们遇到一件事情时，可以先采用“放大思维”剖析问题，洞察问题之后，再通过汇聚自身能力或外部能力帮助自己聚焦在关键处去解决问题。\n\
