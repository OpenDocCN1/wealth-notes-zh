  - "[PAGE 20]\n\n# 19. 三脑理论思维模型\n\n我们应该能以不同的方式去思考问题，以此来应对这个变化万变的世界。否则我们将前人工智能通过“就是这样”甩出答案，为大众提供解决问题的可能性思维公式。\n\
    \n三脑理论 (Triune Brain Theory)，也称“脑的三位一体理论”、“三合一脑”，是美国国家精神卫生研究院神经学专家保罗·麦克里恩在 1970\
    \ 年提出的理论。该原理认识到大脑结构是进化的产物。人脑有三种物理脑系统，分别为爬行脑系统、情感脑系统、大脑皮层系统。三脑作为人类进化不同阶段的产物，就像三台互联的生物电脑，各自拥有独立的智能、主体、时空感与记忆。\n\
    \n# 基本结构\n\nNEOCORTEX(THE NEW BRAIN) RATIONAL THINKING\n新哺乳动物类动物脑(大脑皮层)-理性脑\n\n\
    LIMBIC BRAIN EMOTIONS\n古哺乳动物脑-情绪脑\n\nREPTILIAN(THE OLD BRAIN) DECISION MAKING\n\
    爬行动物脑-本能脑\n\n# 结构详细\n\nNEOCORTEX(THE NEW BRAIN) RATIONAL THINKING\n新哺乳动物类动物脑(大脑皮层)-理性脑\n\
    组成结构：左脑+右脑+皮层+神经元\n三脑位置:最外层(包裹重要脑)\n控制内容:思考、分析、预测、创造\n当年年龄:250万年 完全成熟:22岁后成熟\n\
    脑内占比:不足2成 意识层面是积极\n运行状态:极少使用, 响应速度慢且效率高,排斥很强, 旨在求新,关注专业事物, 立足长远超我智慧目标情势, 控制器能弱\n\
    反应特点:01.用量维度模型 02.有关心边界\n\n管理情绪\n管理逻辑\n管理本能\n\nLIMBIC BRAIN EMOTIONS\n古哺乳动物脑-情绪脑\n\
    组成结构:下丘脑+海马体+杏仁体\n三脑位置:中间层(包围重要脑)\n控制内容:情感、记忆、社交关系\n当年年龄:约2亿年 完全成熟:12岁后成熟\n脑内占比:约能建脑半成\
    \ 意识层面:微弱\n运行状态:始终都在, 响应速度较快,力耗轻低, 旨在求稳,关注社交关系,立足眼前\n自我保护行动, 控制器能较强\n反应特点:01.默认连续性\
    \ 02.非黑即白\n\nREPTILIAN(THE OLD BRAIN) DECISION MAKING\n爬行动物脑-本能脑\n组成结构:基底核+小脑+脑干\n\
    三脑位置:最底层\n控制内容:脉搏、呼吸、睡眠等应激反应\n当年年龄:约3.6亿年 完全状态:2岁后成熟\n脑内占比:与情绪脑同1成 意识层面:潜意识\n\
    运行状态:24小时不停止,响应速度极快,力耗\n低耗, 旨在求存,关注环境威胁,立足当前 2 超我决策直视, 控制器能最强\n反应特点:直觉反应(战斗、逃跑或承担)\n\
    \n# 应用方法\n\n+   一、主动提升智脑,让理智脑觉醒成长\n01 立足长远,主动走出舒适区\n02 为潜在的风险制自己,可能的收益还时满足\n03\
    \ 保持耐心,坚持做有长期意义的事\n04 抑制诱惑,结合机会成熟本能思维型,做出有利选择\n\n+   二、主动学习思维模型,拓展多元思维\n01 不依赖靠自制力,而是依靠多元知识的输入\n\
    02 不对抗本能与情绪,与之和解,转为己用万为上策\n03 不排斥本能脑与情绪脑,各有优势,取而用之\n04 上天赋予理智脑智慧,是让我们驱动本能与情绪非取代\n\
    \n> 在一会议上,有一位女士要查理亚茨用一个词说出他的成功之道,茨格回答:理性! 艾格还说:\"如果你想成为一个理性的思想者,必须培养出跨越常规学科领域的头脑,必须跨学科学习,学习重学科的重要思维模型\"\
    。 \n\n总结:人类大脑运行疗愈的准则是“能不用脑,就不要脑, 须用脑时也不要脑”; 这是进化的结果! 尽管如此, 也不非如此。"
