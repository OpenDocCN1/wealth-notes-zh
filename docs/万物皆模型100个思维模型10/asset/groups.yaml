    \n# 33.心流理论思维模型\n\n我们应该尝试以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们将前人智慧提炼“微观情景”翻拍出来，为大家提供解决问题的可能性思维公式。\n\
    \n心流又称福流、满流、心流通道，是一种将个人精神力完全投注在某种活动上的感觉；心流产生同时时会有高度的兴奋及充实感。我们在做某些事情时，那种全神贯注、投入忘我的状态；这种状态下，你甚至感觉不到时间的存在，在这件事情完成之后我们会有一种充满能量并且非常满足的感受。比如绘画、爬山、游泳、打球、玩游戏、阅读、演奏乐器还有工作的时候。人们在此状态中时，通常是不愿意打扰的，即不想中断。\n\
    \n## 模型结构\n\n### 前期心流\n\n### 后期心流\n\nHIGH\n\n挑战水平\n\nANXIETY\n焦虑\n\nLOW\n\n技巧水平\n\
    \nHIGH\n\n厌烦\n\nBOREDOM\n\n## 构成条件\n\n## 构成心流的七个要素\n\n- 我们倾向去从事的活动 ＞ 挑战活动\n- 我们会专注一致的活动\
    \ ＞ 全神贯注\n- 有清晰目标的活动 ＞ 目标明确\n- 有立即回馈的活动 ＞ 即时回馈\n- 我们对该项活动有主控感 ＞ 掌控自如\n- 在从事活动时我们的忧虑感消失\
    \ ＞ 忘我状态\n- 主观的时间感改变 ＞ 时间消失\n\n## 举个栗子——心流的游戏化模型\n\n## 用户进阶的核心的驱动力挖掘情况\n\n## 如何应用\n\
    \n- 明确目标\n- 即时回馈\n- 匹配难度\n- 全神贯注\n- 持续挑战\n\n总结心流是一种幸福，一种极致专注力非常强的体验，能帮助我们找到人生意义，获得成长，变得与众不同。\n\
    \n# 34. 长线思考思维模型\n\n我们相信通过以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们前人类曾经通过“假设推理”阐述出来，为大家提供解决问题的可视化思维公式。\n\
    \n长线思维指立于实现长期目标，再反推出当下的行为策略的思维方式。自控能力强的人，能够在没有外界监督的情况下，适当控制、调节自己的意志力和行为，比较坚决地抵制诱惑，比较耐心地延缓满足，坚持且不懈地确保长期目标的实现。为什么一定要坚持长线思维呢？贝索斯认为如果你做的每一件事把眼光放到未来三年，和你同台竞技的人很多；但是如果你的目光能放到未来七年，那么可以和你竞争的就很少了，因为很少有公司愿意做那么长远的打算。\n\
