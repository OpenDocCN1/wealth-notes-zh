    ## MINIMUM VIABLE PRODUCT — 最简化可实行产品


    MVP（商简化可实行产品）产品理论，你可把它想像成一部电影的剧照大纲，其重点是产品的成本低，但是能够展示最终端产品的主义特性，功能是产品早期用来接轨客户，并且检验顾客的反响来改变产品。在出来避免闭门造车后，MVP
    不是一个每个迭代做出产品功能的一部分，而是每次迭代都要交付一个可用的最小功能集，这样每个功能可以满足用户的最基本需求，虽不完美但也能满足。然后逐步迭代做出满足客户预期的产品，直到最后完全满足客户需求。


    ## 层次应用


