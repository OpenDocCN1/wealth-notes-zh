    紧急程度\nURGENT NOT URGENT\n\n+ 隐藏的\n+ 01 紧急重要因难事项\n紧急重要容等事项\n+ 02 重要不紧急但难事项\n重要不紧急容等事项\n\
    + 03 紧急不重要但难事项\n紧急不重要容等事项\n+ 04 不紧急不重要因难事项\n不紧急不重要容等事项\n\n## 举个例子\n\n### 水烧开了，孩子哭了，电话响了…\n\
    \n+ 01 家里的开水壶烧开了，不及时处理就会溢出来\n+ 02 自己的孩子嘻醒了，哭着要让你抱，很可能需要换尿布\n+ 03 家里的电话响了，不知道是谁打来的，很可能有急事\n\
    \n### 石头、沙子、水…\n\n讲着手拿空杯子，先往杯子里放石头，放满后大家这个杯子满了？人们会认识回应了。讲者再往里面放沙子，放满沙子讲者向大家满意了？之后讲者再杯子里加水…\n\
    \n引申思考：大趋势变化瞬间极快，不及时的事情，就风险，对学习条件较差的事件，...临时优先级...但做好的事，既可...\n\n引申思考：假设思维…以认真设计流程完全验证，并牢系按流程遵守…\n\
    \n这个例子是大家日常生活中常见的困境/会经常遇到的事情。事实上在讲卡同学双亲急需反应的时候，我认为大姐姐可能可以先去不紧急的事物，或是是先整理得到反映的方式安抚...\
    \ 期间...\n\n### 巴菲特曾给其私人飞机员弗林特介绍过其确定优先次序的三步走策略\n\n巴菲特让弗林特先列出他的前 25 个目标\n他让弗林特选出\
    \ 5 个\n不管怎样，这些事情都不应该引起你的注意，除非你已经成功地完成了前 5 个目标\n\n## 应用参考\n\n+ 01 写出你当前想要实现的多目标\n\
    + 02 运用优先排序识别你的“5”个目标\n+ 03 完成目标前，不考虑其他任何选项\n\n总结:优先排序思维模型,即依照紧急、不紧急、重要、不重要、困难、不困难等六个维度来审视问题,以此帮助我们更好的做决策！\n"
  mdcn: "\n# 25. 多维视角思维模型\n\n我们应该尝试以不同的方式思考问题，以此来面对这个瞬息万变的世界。因此我们前期就有通过“视觉笔记”翻译出来，为大家提供解决问题的可视化思维公式。\n\
