    我们日常使用的键盘 QWERTY | 柯尔曼键盘 是美国使用的，基于拉字母的排列打字机和计算机键盘的。按此排列打字机在1874年由克里斯托夫大卫生，从此成为美国通用广泛的机械接口，其键盘的设计最初是为了减少打字机在打字时打字机在打字时卡住的问题，以防止字母发生打字频繁阻塞，因而要把常见字母隔开。虽然
    QWERTY键盘是被有意设计成打乱对手的速度，但在普遍度上相对它较晚出现的键盘一直具有很低的优势。


