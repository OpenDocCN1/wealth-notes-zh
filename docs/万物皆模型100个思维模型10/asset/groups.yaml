    ## 85. 峰终定律 思维模型


    我们媒体应以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们前期智囊通过“觉悟者请”请出来了，为大众提供解决问题的可能性思维公式。


    心理学家丹尼尔·卡内曼（Daniel Kahneman）发现我们对体验的记忆由两个因素决定：**高峰（无论是正向的还是负向的）时与结束时的感受**，这就是峰终定律（Peak-End
    Rule）。此定律基于我们潜意识总结体验的特点：我们对一项事物的体验之后，所能记住的就只是就在峰与终时的体验，而在过程中好与不好体验的比重，好与不好体验的时间长短，对记忆差并没有什么影响。高峰之后，终点出现得越迅速，这件事留给我们的印象越深刻；而这里的“峰”与“终”其实就所谓的“关键时刻
    MOT”，MOT(Moment of Truth) 是服务业界最具感染力与影响力的管理概念与行为模式。


    ## 模型结构


    ### THE PEAK-END RULE


    我们评价一段经历的好坏主要由两个关键点决定——PEAK(峰值)和 END(终值)，而不是整个体验的平均值


    ### 举个例子


    宜家作为主营家庭用品行业的知名品牌，在世界各地都分布着许多多的分店，而让很多人们记忆深刻的，除了其中各式各样根据满足的产品与用心装潢，还有出乎意料的“一元冰淇淋”。在宜家购物有很多不愉快体验，比如只买一件家具也要走很长距离、整个商场，比如店员很少，比如要自己在货架上找货物并搬下来等等。但是，顾客的“峰”体验是好的，顾客的峰就是物有所值等产品，实用高效率的展区，随意的试用体验，美味便宜的食物。宜家的终结是出口处只需
    1 元的冰淇淋！


    P80 系列位置效应是思维模型中我们接触到了首因效应和近因效应。与我们今天接触到的峰终定律似乎如出一辙。两者都些模糊的相似点，由峰值对比发挥高峰对首因效应，终点对应近因效应。因而是第一印象，与高峰比较平常一点相对，应终点是报表真的不同的原因是成为正向峰，负的首因因素聚成为负向峰，近因同样不同于终点，从峰终定律的角度看，近因更趋近于对于一个事物短暂进程的尾端峰值，同时也能从反面考虑，负向的两个角度来着，得出正负终点的推论，以上推导仅作参考。


    ## 启发应用


    ### 反思节点的设计


    在情绪体验激烈中我们会记得一个印象深刻的事件，而在我们对这个事件的情感以及体验的峰值和终点的记忆会更多，而忽视中间过程；因此在设计流程时，要注意关键节点的影响力，设置合理的峰值和终点，以提升整体体验。


    ### 反人性中置入峰终定律


    商学院案例中，大多数人对自己记忆的事件有强烈的感情，由于媒介传播的介入，机制设计中，要让服务在峰值和终点时更加突出，同时对消费者在体验过程中的情绪峰值进行控制，形成好的终点记忆，提升整体满意度。


    ### 合适的时间做合适的事


    在服务设计中，要把握峰值和终点的时机，峰值出现在体验的高潮，终点在体验的收尾，要在合适的时机提供满意的服务，避免在不合适的时机出现负面影响。


    总结峰终定律又为我们指出了人性中的普遍规律，我们在运用这两个时刻为自己，为他人创造美好体验时，请勿忽略他人也在为你设计美好体验。


    ## 86.5W1H分析法思维模型


    我们应该从不同的方式去思考问题，以此来应对这个瞬息万变的世界。面对我们前人智慧通过“微笑传播”翻讲出来，为大家提供解决问题的可能性思维公式。


    5W 是在 1932 年由美国政治学家拉斯维尔最早提出的一套传播模型，后经人们的不断运用和总结，逐步形成了一套成熟的“5W+1H”模式。5W1H 分析法（Five
    Ws and one H）也称六何分析法，即何人（Who）、何时（When）、何事（What）、何地（Where）、何因（Why）及何法（How）。由这六个疑问词所组成的问句，都不是是非题，而是需要一或多个事实证据的应用题。《左传·哀公二十七年》文子曰：“君子之谋也，始、衷、终皆举之，而后人焉。今我三不知而入之，不亦难乎！”即所谓起源、过程以及事物发展变化的结果，是一个过程的终了，同时也是另一个新过程的开始。


    ## 模型结构


    ### 5W1H

    Five Ws and one H


    - 要做什么？

    - 是怎么做的？

    - 应该怎么做？

    - 这种方法可被破坏？

    - 还有其他方法吗？


    How 何法


    What 何事


    - 这怎么去做？

    - 正做在什么？

    - 应该做啥？

    - 还做做啥？

    - 还能做些啥？


    Why 何因


    - 为什么要这么做？

    - 为什么它能够成功？

