    每天只要 100 个，分5组做20 个。每天重复后进行复习的程序，基本只要 5 个 30 分钟，每全天重复第三次，熟悉后，从第一组做起。每天再做若干个，然后再复习在同个周期里的第二、4、7、15
    天再复习，记忆过程可达到 300 ~ 400 个单词记忆。


    我们可以记忆分为 8 个周期，每个周期间隔时间依次数拉长，当然，这样记忆周期并不一定是一成不变的，可以根据自身情况定义记忆周期，之后确定一个周期所要记忆的单词量，最好是制定出一个列表，列出每个周期记忆的数量，包括所需同前一周期间隔的数量，然后计划进行，接下来按记忆周期执行，以上的
    8 个周期属于普适法，作为背诵循环的 8 个重复法。


    ## INSPIRATION AND APPLICATION

    启发应用


    ## 保持定期定时的练习


    艾宾浩斯根据遗忘曲线绘制了记忆规律图，它意味着每隔一段时间后，需要对之前所学的东西进行复习以达到巩固记忆的效果，这样可以达到记忆和遗忘之间的平衡。并通过这种方式，推导出一个记忆和复习的模式，学习后的第一天，复习后的第二天，复习后的第三天，复习后的第七天，复习后的第十四天，复习后的第三十天，循环往复，依次类推。亦即是，每次复习的时间间隔会递增，间隔越长，记忆的保留效果越好。


    ## 保持对外部的态度


    很多人在学习的过程中会产生惰性，沉浸于自己的世界中，忽略了对他人的尊重和关怀。他们可能会因为自己的压力和情绪而对他人产生负面情绪，进而导致人际关系紧张。为了避免这种情况的发生，我们需要保持对外部的态度，与他人保持良好的沟通和交流，尊重他人的意见和感受，积极地与他人互动，增强自信心和自我认知，从而建立良好的人际关系。


    ## 关联成为你的认知网络


    学习过程中，我们经常会遇到一些新的知识和概念，如何能够将这些知识有效地存储在记忆中呢？我们可以借助联想的方式，将新知识与已有知识联系起来，形成一个完整的认知网络。通过这种方式，我们可以更好地理解和记忆新知识，同时也可以提高我们的思维能力和创造力。


    总结：艾宾浩斯遗忘曲线指出了人类遗忘的核心规律——其先快后慢。既如此便可以通过遗学习来帮助我们提升记忆。


    # 71. 断裂点理论思维模型


    我们应该或尝试以不同的方式去思考问题，以此来应对这个变化万千的世界。因此我们特聘智囊通过“视觉笔记”观点出来，为大家提供解决问题的可视化思维公式。


    之前我们介绍过一个源于工程学的思维即 P65 冗余备份思维模型，今天介绍第二个源于工程学的思维模型——断裂点理论思维模型。熟知的如电路系统中的保险丝，即在整个电路系统中，若电路发生故障或异常时，伴随着电流不断升高，促使绝缘自身会熔断切断电流，继而保护整个电路系统的安全。断裂点理论指的是在系统内设置一种保护机制，当系统内的某个值，如压力、温度、电流等超标到将破坏整个系统时，系统内的断裂装置开始熔断断裂，以此用小装置的损失来防止整个系统大的损失，如“弃车保帅”等。


    ## MODEL STRUCTURE

    ## 模型结构


    设置断裂点


    ## BREAKPOINT


    到达断裂点 -  процеду与反思


    用可承受的很小的损失来防止规避不可承受的大的损失，即：以小损、防大损


    反思 = 事实总结 + 旁观视角 + 反馈信息


    ## TAKE AN EXAMPLE

    ## 举个例子


    股市中的熔断机制，即自动熔断机制，广义指控制股票、期货或其他金融衍生品的交易风险，为单一日的波动幅度规定区间限制，一旦该限制触及及上限，交易则触发，股票交易将暂停、股市大幅度的波动将被控制，市场出现暴跌的可能性降低，大幅提高市场的透明度，交易恢复下线。交易所为防止股市的剧烈波动，减少市场的系统性风险，交易则暂停，交易恢复下线。交易所为防止股市的剧烈波动，减少市场的系统性风险，交易恢复下线。交易所为防止股市的剧烈波动，减少市场的系统性风险。


    《三毛志·颂志·先主传赞松之注》：“勿以恶小而为之，勿以善小而不为”。即不要以为坏事很小就去做，不要以为好事很小就不去做，因为小善可以成大善，小恶会形成大恶，这是个人成长方向的“断裂点理论”。又比如成功人士的名言警句也体现了他们自己的成长向“断裂点”，公司内的有竞争力的员工管理制度——管理红线、球场上的黄牌、红牌的违规判罚等。有的断裂点理论的支持，一个系统的整体备份、运转取决于就会不偏离，也就不会产生大的损失。


    ## INSPIRATION AND APPLICATION

    ## 启发应用


    ## 设置止损点——设好弃车断点


    ## 止损的思考——反思之后再成长


    ## 重视反馈——反思过程的旁观视角


    总结:断裂点思维让我们能够更理性的面对人生起伏，并将每一次境遇成为你攀登的基脚石。


    # 72.杠杆原理思维模型


    我们应该以不同的方法去思考问题，以此来对付这个瞬息万变的世界。因此我在此前就人生智慧透过“微观管理”请出来汤，为大家提供解决问题的可能性思维公式。


    四两拨千斤——阿基米德说：“给我一个支点，我就能撬起整个地球”。杠杆又分为费力杠杆、省力杠杆和等臂杠杆，杠杆原理(LEVER PRINCIPLE)也称为“杠杆平衡条件”。要使杠杆平衡，作用在杠杆上的两个力矩(力与力臂的乘积)大小必须相等。杠杆思维的核心即用尽可能少的成本去撬动更多的资源，从而达到收益最大化。“撬动杠杆”的目的在于找出推动事情发展的决定性因素，而决定性因素即是这个杠杆的支点。杠杆思维除了可以撬动地球外，还可以撬动信息、物质、情感和能量。


