    之所以将全国组织框架图（P32 黃金圈思维模型），即通过 WHAT、WHY、HOW 三次循环的顺序来讲解事物，实际上是希望个人也能从自己内心出发，提升5W1H
    大纲思维可见度。帮助我们清晰地看到事物发展过程中各个环节的联系。即原本看似漫、返过去一个个变化的现象，看着模糊的解，解决了很多对于我的成果。


    ![](img/df4a7790feb77e5cf1e36990b372088a_87_0.png)


    “始”即事物的起源，开始或初始阶段，它包括了事物的最初的历史背景和背景状态的种种情况中，“中”即事物发展过程中，其实包括了事物在不断上或生成递进过程中各个环节和各阶段的发展情况。“终”即事物发展变化的结果，是一个过程的终了，当然同时它也可以是另一个新过程的开始。


    ## 启发应用


    ### 思维模型是事物的规律


    思维模型是事物存在的本质，是讲我们解决问题的一种趋势。就像一个社会、一个产品、一个问题。我们通过不同的角度去思考，可以看到不同的方向，从而形成自己的思维模型，提炼出5W1H。


    ### 口号都是假大空


    制定一个FLAG，自己的公司公司员工都会得意马上实现计划的实施方式来完成目标。每個人的思考方式虽然不同，但5W1H可以帮助我们找到核心问题，提炼出问题，找出解决方案，形成一套系统化的思维方式，5W1H可以较准确地判断事物的关键节点和因素，最终知道如何去实现目标。


    ### 以始为终 循环往复


    循环往复，总有反复的事情发生。以终为始，过程不断循环，开始、过程、结束，还是不断重复的过程。过程与结果相互作用，形成一个循环往复的体系。以终为始，以始为终，循环往复，不断改进。


    > 总结:口号都是假大空，所以不喊口号，实事求是的做符合我们自身条件的事情。不知“始”，何知“终”啊！


    ## 87.归因理论思维模型


    我们应意识到不同的方式是思考问题，以此来应对这个变化无常的世界。因此我们将前人智慧通过“微语言”提炼出来，为大家提供解决问题的可量化思维公式。


    归因理论 Attribution theory– 社会心理学的理论之一，归因是指观察者从他人的行为推演出行为的原因，因果关系。归因理论是指研究人们如何做出归因，以及为何在某情况做出某种归因，在另一情况做出另一种归因的理论并说明和分析人们活动因果关系的理论。人们用它来解释、控制和预测相关的环境，以及随着环境而出现的行为，因而也称“认知理论”即通过改变人们的自我感觉、自我认识来改变和调整人们的行为为存在的模型。归因理论的假设是建立在个人随时重建认知平衡的欲望之上。主张当个人发生言行秩序紊乱时，会主动运用存在心理中认知为自己找出原因，或为别人找理由。


    ## 模型结构


    YOU OR ANOTHER PERSON


    ### SITUATIONAL ATTRIBUTION 情境归因 外因–将行为发生解为情境（环境）因素使然


    ### DISPOSITIONAL ATTRIBUTION 性格归因 内因–指个体行为之发生解释为自己性格使然


    ### 共变模式（三维归因理论）


    ### 共识性 CONSENSUS 不同人在面对相同刺激，行为反应是否与观察对象的行为一样？


    ### 特殊性或区分性 DISTINCTIVENESS 观察对象是否对类似的刺激都做出不同的反应？


    ### 一贯性或一致性 CONSISTENCY 在不同时间点、不同情境中，同一行为人面对同一刺激的反应是否相同？


    ## 举个例子


    比如你看到一间餐厅的老板（行为人，观察对象）在骂员工（刺激），你会认为老板是否常有（内归因）？行为人的思维，如面对此刺激时特别对你如何？或同今天不同不（不同于）？还是其它员工有问题（或因同因同）？行为人本身外因？如车手茶？或行为本身？还是由于某个因素的其他地方因素想到（外归因），并且本次见到刺激未关联到其他？


    家庭有孩子的伙伴们，你是否会考虑成绩来归因孩子学习呢？考试成绩是一个很好的归因对象，尽管孩子有了成绩，家长或老师对孩子自己的表现可能能够尽可以归因到自己的努力和勤奋程度，而当孩子不是自己的表现，家长或许会归因于外部条件，如老师或孩子可能归咎为归因于考试难度、教学的水平、标准或外部因素，担心归因于是学生本身努力不足。即使成绩为内归因，即归功于自己，于内部因素，才失败归因于外部因素，以保护自尊心。


    从共变（三维归因）<|start|>解：

    第一、共识性一大家都骂其员工

    特殊性-老板不是常骂其他员工

    一贯性-老板常骂其员工


    第二、共识性低-仅老板骂其员工

    特殊性-老板也会骂其他员工

    一贯性低-老板常骂其他员工


    第三、假设性一无固定性或肯定性较高或低，人们倾向与做不利于别人的归因，例如假如回家看见一对、老板如何随便等等。


    先条件：观察到一新事件在特定情况下能确定或假设；

    充分条件是：若如果这个假设在其他情况下也能出现，通过比较能更推断是否发生减少发生。


    共变模式理论告诉我们：每个人都需要稍微归因（或承担充分、必要条件的证据在认识上，解释身旁的事物。


    ## 启发应用


    ### 基本归因错误


    ### 自以为是的偏见


    ### 判断他人时常走的捷径


    总之，至每个人都牢牢掌握和推断能力，但是经常在不同的逻辑下做事，考虑分配注意（公众论证）东西的证据，所以人们为客观现象、选择、认识时，总倾向“归因误差”。


    ## 88.HOOK上瘾思维模型


    我们都应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们将前期人工智能通过“貌似诸葛”翻译出来，为大家提供解决问题的可视化思维公式。


    上瘾模型 the Hook Model, 即 HOOK 模型(或称为钩子行为模型), Hook 上瘾模型由《上瘾》的作者尼尔·埃亚尔、裴安·胡佛提出,其本质是设计一套让用户连续循环的行为模型,即“触发(Trigger)→行动(Action)→奖励(Reward)→投入(Investment)”四要素,也就是让用户养成使用习惯的四大产品逻辑,以让用户在不知不觉中对产品上瘾。上瘾模型即讲用户的问題与你的解决方案联系起来,并以足够的频率形成一种习惯,通过不断地穿过这些“钩子”,习惯就会形成,从而成为忠实用户。


    ## 模型结构


    ### Trigger 触发


    内部触发: 用户真<|start|>需要是什么?

    例如: 用户情緒、习惯、使用场景


    - 习惯

    - 内部

    - 外部


    外部触发: 如何让用户接触产品?

    例如: 提示、邮件、权威推荐


    ### Action 行动


    驱动用户行为

    重要的是需要满足用户的预期


    动机

    趋利避害、好奇心

    获得关注、获得信任、获得认同

    被动、被动执行、拒绝


    能力

    时间

    金钱

    体力

    关注

    情绪


    ### Investment 投入


    如果用户对一款产品或者服务投入了时间和精力

    那么在形中就放在高用户流失的门槛


    ### Reward 奖励


    提供多种的潜在奖励去保持用户的兴趣分为三类: 社会奖励、猎奇奖励、自我奖励


    - 自己

    内心满足感

    - 社会

    获得成员

    - 搜索

    提升本能


    ## 举个例子


    ### GAME 游戏案例


    触发

    内部触发—社交需求: 被朋友遗漏还是邀请朋友;

    打开无聊、等人、旅途中、下班后、睡前和休闲时间等碎片时间

    外部触发—APP消息推送、好友邀请、应援和店铺推荐; 热门游戏视频、线下活动、名人推荐: 明星代言广告


    行动

    几乎所有人快速上手的遊戲, 在保证“把握足够”的情况下, 再利用匹配和水平玩家和自定义操作方式的一套完善的制度来限制住高水平的玩家和非玩家比较。


    投入

    吸引玩家投入其中:

    随着时间和精力的投入, 段位不断增加; 喜好的装备的积累; 获得的金币、钻石的积累; 队伍、联盟等社交关系的情况


    奖励

    社交奖励: 合作成分一战斗一方一结束后, 可以清楚看到对团队的贡献; 社会认同感—加入社交平台, 让玩家和新手家入群、提升会员或自我奖励奖励: 升级奖励—通过不断升级获得更坚挺的奖励资源奖励:
    金钱奖励—打开游戏就有金币、钻石、箱子等


    ## 启发应用


    ### 上瘾的前提条件


    产品是满足用户的需求, 并提供用户可以持续使用的完整方案。产品要有差异化、无同质化需求, 需要产品与用户的关系清晰, 用户在产品的使用过程中认识到自己, 并且满足需求,
    有需求的产品就被用户持续使用, 用户对用户价值的感知, 有利于建构用户的忠诚度。产品是解决用户的问题, 让人回想自己的价值和期望的产品。


    ### 切勿本末倒置


    上瘾模型是为解决用户问题而设? 如果用户不存在问题, 上瘾模型一开始, 即用户没有需求, 企业将很难提供上瘾的有效办法和满足需求, 然后会被认为只是一种商业套路,
    并且会带来负面影响, “问题解决、价值创造、产品改进、内在需求的产品”：成功的产品, 往往只是解决用户需求, 并且去满足用户需求, 这种产品就像泥沙, 人们会因此而买单。


    ### 万事开头难


    上瘾模型的核心是用户的需求, 也就是产品设计中需要不断去解决用户的需求和提升产品的独特性, 并且提供用户的体验, 通过循环反馈不断的去满足用户, 以便于使用产品的频率,
    提高产品的粘性, “用户”也就会被锁定, 甚至成瘾, 而“最终用户”不断的去提高用户的使用体验, 形成升级就成为用户忠实拥护的。


    总结: 生活工作中, 我们所学的一些思维模型的对像均是围绕人而进行的, 因此不脱离对人性需求的思考。


    ## 89.情境领导理论思维模型


    我们习惯以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们将‘情人智商’通过“视觉语言”阐述出来，为大家提供解决问题的可视化公式。


    情境领导理论 Situational leadership theory 或情境领导模型（Situational leadership model）是 1969
    年由保罗·赫赛和肯尼思·哈特利·布兰查德在从事组织行为管理工作中共同开发的模型；在 1970 年代中期，领导生命周期理论更名为“情境领导理论”。情境领导模式将员工的状态分为四个阶段（准备度）：第一阶段为
    R1(D2)，员工没能力，没信心；第二阶段为 R2(D1)，员工没能力，有意愿并自信；第三阶段为 R3(D3)，员工有能力，没信心；第四阶段为 R4(D4)，员工有能力，有意愿并自信。


    模型结构

    情境领导模式为领导者的重要理论依据，领导者应根据成员的能力和成熟度来采取最有效的领导风格，按属下成熟程度的高低，分别形成四种具体的领导风格。

    1. 指示型领导风格（高任务 - 低关系）。2. 销售型领导风格（高任务 - 高关系）。3. 参与型领导风格（低任务 - 高关系）。4. 授权型领导风格（低任务
    - 低关系）

    注：指导系统（低任务 - 低关系）—— 配合：当工作程序不存在时，作用于 S2；领导行为（高任务 - 高关系）—— 配合：当工作程序不存在时，作用于 S4；领导指引（高任务
    - 低关系）—— 配合：当工作程序存在时，作用于 S1；领导授权（低任务 - 低关系）—— 配合：当工作程序存在时，作用于 S3


    S3 支持型领导以支持为主，信任高（高关系、低任务）。这适用于中等成熟度的员工，员工能完成工作，但对工作没信心。领导者应提供支持和鼓励，减少指导，让员工在工作中学习并取得信心。领导者在提供支持的同时，也要保持一定的指导性，以避免员工因缺乏信心而犯错。


    S3 对应关系：一方面，员工能够完成工作，但对自己完成的能力缺乏信心；另一方面，员工对工作有兴趣，但对其完成仍缺乏信心。领导者应提供支持和鼓励，同时给予适当的指导，帮助员工建立信心。


    S4 授权型领导，即领导者将责任交给员工，员工有能力、有意愿。工作进行顺利时，领导者将任务交给员工，员工自行处理。工作进行不顺利时，领导者应提供必要的支持和指导，确保工作顺利进行。


    S2 销售型领导，即领导者既提供指导，又提供支持。员工有意愿但能力不足，需要领导者提供指导和支持，帮助其完成工作。


    S2 对应情况：员工有工作意愿，同时又缺乏完成工作的能力，因此需要领导者的指导和支持。领导者应提供详细的工作指示，同时给予鼓励和支持，帮助员工建立信心。


    S1 指示型领导，即领导者在工作上提供具体指示，员工无能力、缺乏自信。领导者应提供明确的指导和监督，确保工作顺利进行。


    ### D4(R4) 高能力 高承诺


    ### D3(R3) 高能力 低承诺


    ### D2(R1) 低能力 低承诺


    ### D1(R2) 低能力 高承诺


    D4 状态下的员工对要求的任务足够了解，并且自己已完全愿意承担、完成的要求。他们是不需要监督的理想状态，而且常常愿意承担责任。


    D3 状态下的员工可能完成任务，但已不愿意继续完成任务，或者是能力不足，但愿意继续工作。这时领导者应给予适当的支持和指导，帮助员工建立信心。


    D2 状态下的员工无法完成要求的任务，动机也不充足则没有对工作投入，可能导致工作失败，领导者应提供大量的指导和支持。


    D1 状态下的员工无法完成要求的任务，但很有强烈的动机去完成任务，组织责任心强，领导者应给予明确的指导，同时提供必要的支持和鼓励。


    ### 情境领导理论的本质——因时因势的领导风格


    启发应用


    个个都觉得自己是龙凤种啊

    现实中我们每个人中文都认为是，我们每个人都有每个优点和缺点，每个都觉得自己是个强权领导风格，大家都认为自己是领导者、领导者的角色是不同的，大家都觉得自己是好领导、领导者，总以为别人是对的，自己是错的，但事实并非如此，领导者要根据实际情况做出决策、作为领导者，先知自己再知他人——这一切，都是因时而变。


    因人因时因地而制宜（第 N 通）

    如何把干部结合起来、如何把领导要求传递给下属、如何把领导者的思想传递给下属、如何把领导者的思想传递给下属，领导者应根据实际情况，针对不同的员工采用不同的领导风格，因人而异，因时而变，因地制宜。


    上半年如赛马路，下半年如丧家狗

    有的领导者上半年如赛马路，下半年如丧家狗，有的领导者上半年如赛马路，下半年如丧家狗，有的领导者上半年如赛马路，下半年如丧家狗，有的领导者上半年如赛马路，下半年如丧家狗，有的领导者上半年如赛马路，下半年如丧家狗。


    > 总结:我们常常过于在乎“想象”中的自我角色，而事实是“你是不是神”。作为领导，实事求是，因时因势。

