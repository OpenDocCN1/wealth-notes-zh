    # 24.替身决策思维模型


    我们常常应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们前人智慧累积“貌似谬误”留出条，给大家提供解决问题的可能性思维公式。


    替身指的是替别人的人，对本体而言，指替代本体的人。生活中则是模拟决策人所处的环境及其背景，去做决策的场景代入法，让替身有一种身临其境的感觉和思考过程，此时你就是决策者，你需要对这个决策负责责任和义务，也有相应的权利并为此做出决策。简言之替身决策思维就是站在他人的角度或换成特定角度去做决策的一种思维方式。


    # 模型结构


    # SURROGATE DECISION MENTAL MODELS 替身决策思维模型


    替身 OR 分身 站在对方的角度思考问题


    # 举个例子


    # 立场不同 少说多做


    立场不同，所处的环境不同，提供的值值不同，很多事情如果是一双见 况不妥结论，用替身思维模型（或称转换思维模型）换己所处岗。


    收人将信将人告诉他出了事，只听大人吩咐，陆地反而反对和配合时反而不妥结论，换体制人设说设被说，都是很烦所以大声门时。


    设想对方清楚永远亲耳听见，我人说 但是，只是为了帮您的毛绒到牛奶， 牛奶的口味，却好像没办法！ 听见这个声音很舒适的！


    # 懂得换位思考很重要


    同名于地的流动就会大加嘈杂和希系，某一年要聘请一位秘书，于是在几家报刊上刊登了招聘广告，结果应征的信件如雪片飞来。


    秘书本身 A 秘书替身 B 拿破仑希尔


    我看到现在报上招聘秘书的广告， 我要非常努力准备这个职位，我今年夏天，年近学生毕业，我们希望能尽快说服你， 一定能胜任乞丐。


    最后说：您只要投我广告一万元来给我，我就为您动员，所有相关的公司会一... 什么干，最后，秘书本是否还... 的时间就认识你了。


    # 如何应用


    # NLP位置感知


    位置感知，在NLP心理上指的是，试着换个“位置”，多角度去思考问题，就会产生不同的想法和感受、态度。而这样的“位置产生观点”，称为“感知位置”。如下介绍五个感知位置：


    +   ① 自我位置

    (1) 凡事以自我为核心，更关注自己的感受和感受。

    (2) 对自己和自己谈话，发怒，反感。

    反感和自我对立，而发出的性 反感和自我为出发点，对人也为人？

    己，总是关心别人和意见。


    +   ② 对方位置

    (1) 把他人或他的为人他人看

    (2) 关心他人的感受，有同情心

    (3) 与对方的立场，这就是同理

    心和和睦的行为

    在彼此的位置太长

    乎思考和处理自己的事情。


    +   ③ 抽离位置

    观看者处于中立、受观察、

    局外人其中立

    (2) 用来做客观平衡并做处理

    性质的分析点

    (3) 让在事物中的人过分上

    性，或者人情味


    +   ④ 体系位置

    (1) 如果将事情的对立，并将其系统

    和他的关系作为合作作，并思考

    被他感觉吗

    (2) 情况是包含一切的关系物

    (3) 决定最合适的人是恩情，注

    重集体或更完整生活的人


    +   ⑤ 宇宙位置

    (1) 超越时间和空间的限制与制

    约，有神明般永恒恒稳定且脱

    光

    (2) 客观性的洞察的发展

    (3) 看作个人的人类人不食人间

    烟火，悲观乐观


    NLP 讲究灵活应变，对相同事物有多不相同观点，并对各种不同的观点予以尊重。灵活移动感知位置，有助于发展观点的弹性，善于移动感知位置，拥有多重观点，让人行动皆有理。因为各种不同的观点，互相补充互补，可以增加更多资讯，更好地处理，使人不致于陷入僵化或让思维的闭锁感。


    +   请轮流坐在自己位置上

    这该自我尊重吗？

    请对待对方位置

    这个想法说明了什么？

    请在抽离位置

    这个位置有什么吗？

    请在体系位置

    这个观察到什么？

    请在宇宙位置

    这个位置意味着什么？


    总结:替身决策在开拓思维、处理职场人际关系、生活困惑方面是一个极为好用的思维模型，结合NLP位置感知，去观测生活的不易。'
  md: "\n# 19. 三脑理论思维模型\n\n我们应该能以不同的方式去思考问题，以此来应对这个变化万变的世界。否则我们将前人工智能通过“就是这样”甩出答案，为大众提供解决问题的可能性思维公式。\n\
    \n三脑理论 (Triune Brain Theory)，也称“脑的三位一体理论”、“三合一脑”，是美国国家精神卫生研究院神经学专家保罗·麦克里恩在 1970\
    \ 年提出的理论。该原理认识到大脑结构是进化的产物。人脑有三种物理脑系统，分别为爬行脑系统、情感脑系统、大脑皮层系统。三脑作为人类进化不同阶段的产物，就像三台互联的生物电脑，各自拥有独立的智能、主体、时空感与记忆。\n\
    \n## 基本结构\n\nNEOCORTEX(THE NEW BRAIN) RATIONAL THINKING\n新哺乳动物类动物脑(大脑皮层)-理性脑\n\
