    猪圈里有一大一小两头猪，猪圈一头有猪饭，另一头则通向出口。猪每趟下一趟饭，另一方面会有 10 分钟的休息，如果大猪跑回去食物就剩下 2 份的时间，问题就变得复杂且充满变量，但如果一头去跑腿吃，另一头就只能等机会先吃得到的食物量。如果大猪跑回去食物剩
    2 份时，同时还有另一头一先跑已经吃下 1 不少。具体情况如下：如果东西同时进场，同时喂向猪圈，大猪得 7 份，得 5 份，小猪得 3 份，情况：如果大猪跑就跑，小猪就跑，进场，留下
    4 份，大猪跑去，吃掉 2 份，得 4 份；如果小猪跑就跑，大猪就跑。吃 9 份，得 9 份，小猪吃 1 份，得 2 份，得 -1 份；如果双方都都食吃，情况
    0。利益分配格局决定无主猪的理性选择——博弈二：如果去跑腿吃，小猪怎么想？去吃，实得 1，不去跑，实得 4。做二：如小猪等待，小猪怎么选择？去吃实得 -1，不去跑，实得
