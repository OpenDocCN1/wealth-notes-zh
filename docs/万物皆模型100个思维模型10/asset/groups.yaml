    - 98 正确与否类似\n- 99 波斯力量分析\n- 100 场景匹配理论\n\n# 01. 机会成本思维模型\n\n我们应该以不同的方式去思考问题，以此应对这个变化万变的世界。鉴于我们暂时无法穿越“就餐请客”，提供给大家解决问题的可视化思维公式。\n\
    \n机会成本 Opportunity Cost 是指决策过程中面临多项选择，放弃而价值最高的选择（Highest-valued Option Forgone），又称为替代性成本\
    \ Alternative Cost，就是俗语的世界上海没有白吃的午餐、鱼与熊掌不可兼得。简单来说，机会成本就是所牺牲的代价。机会成本所指的“机会”必须是决策者可选择的项目，若不是决策者可选择的项目便不属于决策者的机会。机会成本\
    \ = 外显成本 + 隐含成本（外显成本即实际的支出；隐含成本则为时间、效益等）。\n\n# 模型结构\n\n# 鱼与熊掌不可兼得\n\nCHOOSE A\n\
    本次决策的机会成本是 B 可能取得的收益是 实行本收益的代价\n\nCHOOSE B\n本次决策的机会成本是 A 可能取得的收益是 实行本收益的代价\n\n\
    OPPORTUNITY COST IS THE PRICE OF SACRIFICE\n机会成本就是所牺牲的代价\n\n# 举个例子\n\n读书\n本次决策的机会成本是\
    \ 放弃追剧可能取得的收益（学习、成长等）是实行“读书”的代价\n\n追剧\n本次决策的机会成本是 放弃读书可能取得的收益（学习、成长等）是实行“追剧”的代价\n\
    \n# 局部应用\n\n（所放弃的最佳选择的价值）-（实际选择价值）=（机会成本）\n\n机会成本越高，选择越困难。因为在我们的抉择面前常常是不愿意放弃任何可能得到的乐趣。谁都知道要做“价值最大化”选择，选择价值最大的，那自然，机会成本就低。然而似乎对外如此，对内却又时常为正。这取决于你如何对待自己的本性。\n\
    \n> 总结：《鱼我所欲也》中孟子曰：“鱼，我所欲也；熊掌亦我所欲也；二者不可得兼，舍鱼而取熊掌者也。”\n\n# 02.沉没成本思维模型\n\n我们应该以不同的方式去思考问题，以此来应对这个变化万变的世界。因此我们将前人智慧提炼为“微专辑”系列推出，为大家提供解决问题的可视化思维公式。\n\
    \n沉没成本 Sunk Cost 指已发生或承诺、无法回收的成本支出（如时间、金钱、精力），如因失误造成的不可回收的投资。从决策的角度看，以往发生的费用只是造成当前状态的某个因素，当前决策所要考虑的是未来可能发生的费用及其所带来的收益，而不考虑以往发生的费用。人们在决定是否去做一件事的时候，不仅仅是看这件事对自己有没有好处，而且也看过去是不是已经在该事件上有过投入。在经济学和商业决策制定过程中会用到“沉没成本”的概念，代指已经付出且不可收回的成本。\n\
    \n# 模型结构\n\nDON'T CRY OVER SPILT MILK 别为打翻牛奶哭泣\n\n理性的决策者在做决策时应排除沉没成本的干扰\n\n![](img/df4a7790feb77e5cf1e36990b372088a_3_0.png)\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_3_1.png)\n\n# 启发应用\n\n![](img/df4a7790feb77e5cf1e36990b372088a_3_2.png)\n\
    \n总结:人生需要坚持，但是人生也需要放下，不懂得放下，无谓坚持，等待自己的将是无尽的失望和痛苦。\n\n# 03.直觉思维模型\n\n我们应该以不同的方式去思考问题,\
    \ 以此应付这个瞬息万变的世界。所以我们将前面人类通过“微感觉”翻译出来, 为大家提供解决问题的可能性公式。\n\n直觉思维 Intuitive Thinking\
    \ 是指不受某种固定的逻辑规则约束而直接领悟事物本质的一种思维形式。直觉思维是未经逐步分析(具有迅速性、直接性、本能意识, 仅依据内因的感觉迅速地对问题答案作出判断、猜想、设想,\
    \ 或著在对疑难百思不得其解之中, 突然对问题有“灵感”和“顿悟”, 甚至对未来事物的结果有“预感”“预兆”等都是直觉思维。直觉作为一种心理现象贯穿于日常生活以及科学研究之中而且是完全可以有意识加以训练和培养的。简言之,\
    \ 直觉就是直接的觉察。\n\n# 模型结构\n\n系统1遇到问题会自动寻求系统2介入, 系统2的行为经过大量练习后, 会自动转化为系统1, 形成直觉。\n\
    \n# 举个例子\n\nINTUITION\n直觉\n\nLOGOS\n理性\n\n老公出轨\n\n女性第6感\n心理分析师\n\n确定出轨\n\n行为\n\
    \n语言\n\n表情\n\n关于老公出轨的直接感觉或模糊的感觉\n\n用专业逻辑谨慎思考常识和素养来判断\n\n上图可以得出：普通女性与心理师都能够得出相同结论,\
    \ 知识的积累是可以转化为直觉思维的, 因此：\n\n- 细致思考→转化为直觉思维\n- 累积知识→转化为直觉思维\n- 自律练习→转化为直觉思维\n\n\
    总结:两者并不孤立, 相互转换使用不仅可以帮助我们迅速的做出选择, 而且是正确的最优选择。\n\n# 04.决策树思维模型\n\n我们应尽可能以不同的方式思考问题，以此来应对这个瞬息万变的世界。因为我们期盼人类最终通过“视觉语言”表达出来，为大家提供解决问题的可视化思维公式。\n\
    \n决策树 Decision Tree，由一个决策图和可能的结果（包括资源成本和风险）组成，即一种通过图示罗列解决的有关步骤以及各步骤发生的条件与结果的一种方法，以此用来创建到达目标的规划。决策树建立并用来辅助决策，不仅可以帮助人们理解问题，还可以帮助人们解决问题。决策树是一个利用像树一样图形或决策模型\
    \ 的决策支持工 具，包括随机事件结果，资源代价和实用性。 它是一个计算显示的方法。决策树经常在运筹学中使用，特别是在决策分析中，它帮助确定一个能最优达目标的策略。\n\
    \nSCHEME BRANCH | 方案分支\nPROBABILITY BRANCH | 概率分支\nROOT NODE | 根节点   INTERNAL\
    \ NODE | 内部节点   LEAF NODE | 叶节点\nPRUNING | 剪枝\n\n每个决策或事件（即自然状态）都可能引出两个或多事件，导致不同的结果，把这种决策分支画成图形像一棵树的枝干\n\
    \n# 举个例子\n\n有房无房\n有 → 批准放款\n无 → 有无工作 → 有 → 批准放款\n无 → 拒绝放款\n\n职业选择\n创业：5% 100W+\
    \ NO；20% 50W+ YES；10% -10W NO\n打工：0% 100W+ NO；10% 50W+ YES；30% 10W+ NO\n\n投资\n\
    不投 → 0\n投 → 1000 → 成功概率为P → 10000；不成功概率为1-P → -1000\n10000P-1000(1-P)>0，P>9%\n\
    P>9%，能接受可投，不能接受不投。\n\n订票回家过年\n不订 → 0\n订 → 回家价值为A\n回家概率1/3 → A；不回家概率2/3 → -700\n\
    1/3*A > 2/3*700，A > 1400\nA > 1400，即回家价值大于1400元。\n\n生活工作中我们面对复杂，不妨拿出一张决策辅助图，可以通过最后点击自我去处理事项的路径，通过方案分支、内部节点和概率分支两种结合完成从模型思考去辅助自己做决策，最后得出客观、理性、符合自身的节点，即目标\
    \ – 也会渐渐清晰明确。当然这个过程存在你无法确定的变量、概率，所以及时调整你的决策树是必要的\n\n> 总结:决策树思维即是将会你的决策思维路径以可视化的形式展示出来，以此帮助自己做出客观理性的决策。\n\
    \n# 05. 非SR思维模型\n\n我们需要应付以不同的方式去思考问题，以此来应付这个瞬息万变的世界。因此我们将前期人工智能通过“视觉语言”翻译出来，为大家提供解决问题的可视化思维公式。\n\
    \n20 世纪初在巴普洛夫条件反射实验影响下，美国行为主义心理学奠基人华生提出了“刺激-反应学习理论”，又称为“行为学习理论”。刺激-反应理论认为人类的复杂行为可以被分解为两部分：刺激和反应。而人的行为是受到刺激的反应。学习的实质是形成习惯，而习惯是通过学习将对刺激做出散乱、无组织、无条件反应，变成有组织、确定的条件反应过程。SR\
    \ 是刺激 (Stimulus) - 反应 (Response) 的缩写, 非 SR 思维模型, 指的是在刺激-反应中间加上思考的过程, 即刺激-思考-反应,\
    \ 而由被动的必须反应转向主动有选择反应。\n\n# 模型结构\n\nSR (STIMULUS RESPONSE)\nS 刺激 —— 本能 —— R 反应\n\
    条件反射\n\n非SR (NON STIMULUS-RESPONSE)\nS 刺激 —— 主动切断 —— R 反应\n\nSR 基本公式: S → R (刺激→反应)\
    \    非 SR 基本公式: S → T → R (刺激→思考→反应)\n\n刺激事件 → thinking → 言 → 做出反应\n         \
    \         ↘ 行 ↗\n三思后行\n\n三思后行：思危、思退、思变，思前因、思后果之后，再做出反应。\n\n# 举个例子\n\n接收到对手屡屡比自己好的信息\
    \ → 惯性刺激 STOP→WHY → 焦虑\n\n思考：别人都在发展，而你没有别人发展的快，于是产生焦虑、自卑等等情绪。\n生活工作中，当我们遇到类似以上的问题时，可以通过思考(为什么会焦虑？自卑？)\
    \ 来反求诸己，找到自己的问题，来调节自己的情绪，改变自己的自动化思维！\n\n总结:非SR模型核心目的是打破“惯性刺激”下的反应，提醒我们要主动思考，要有意识的去做决策。\n\
    \n# 06. 确认性偏差思维模型\n\n我们应该尝试以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们将前人智慧通过“视觉语言”翻译出来，为大家提供解决问题的可视化思维公式。\n\
    \n确认偏误或称确认偏差 Confirmation bias 是一个人选择性地回亿、搜集有利细节，忽略不利或矛盾的资讯，来支持自己已有的想法或假设的趋势，属于其中一类认知偏误和归纳推理中的一个系统性错误。当人们选择性收集或回忆信息时，又或带有偏见地解读信息时，他们便展现了确认偏差。这种偏见尤其显见于带有强烈情绪的问题和传统观念上。例如，人面对冲突，大多难以割舍，会在反复的情绪中来回谩骂抨击，过程中不断回馈并对自己给予合理的解释与交代，直到身心得到平衡安稳为止。\n\
    \n# 模型结构\n\n事实情况 WHAT THE FACTS SAY\n\n你认定的 WHAT CONFIRMS YOUR BELIEFS\n\n认知捷径\n\
    \n你的观点\n\n会被低估 UNDERVALUED\n\n你注意的 会被高估 OVERVALUED\n\n主观以为\n\n当认定了一个观点后，大脑就会持续、有选择地去寻找证据来证实自己的观点。这其实是心理上的一种认知捷径，我们的大脑喜欢走捷径，这样既能够节省精力时间，又能让自己感到轻松舒服。\n\
    \n# 正确方式\n\n事实情况 WHAT THE FACT'S SAY\n\n你认定的 WHAT CONFIRMS YOUR BELIEFS\n\n你的观点\n\
    \n以事实情况为依据，主动切断自己的以往的认知，逆推检测反复思考你的观点(客观)。\n\n主动切断认知捷径\n\n总结:既然改变那些已有成见的人的观念如此困难，也许双方阵营真正值得做的只有争取中间值。\n\
    \n# 07.易得性偏差思维模型\n\n我们应该尝试以不同的方式去思考问题，以此来应对这个瞬息万变的世界。借此我们将前人工智能通过“视觉语言”翻译出来，为大家提供解决问题的可视化思维公式。\n\
    \n可得性偏差（Availability Bias / Heuristic）也被称为易得性偏差或易得性偏见，人们在不确定性的情形下，会抓住问题的某个特征直接推断结果，而不考虑这种特征出现的真实概率以及与特征有关的其他原因。在很多情况下，代表性法则是一种非常有效的方法，能够帮助人们迅速地抓住问题的本质推断出结果，但有时也会造成严重的偏差，特别是会忽视事件的基本要素（base\
    \ rate neglect），即无条件概率和样本大小。简而言之，人们往往根据认知上的易得性来判断事件的可能性，比举容易出现偏差。\n\n# 举个例子\n\n\
    RMS TITANIC → RMS TITANIC\n• 泰坦尼克号 - 永·不·沉没号客轮\n因永·不·沉没而主观认为 → 从而忽视危险 → 和平时期最畸重的海难\n\
    \n# 模型结构\n\n所有信息\n你做决定的信息\n易记忆 易关联 易提取\n\n- RECENT - 最近的、最新的信息\n- FREQUENT 频繁出现的\n\
    - EXTREME - 极端的\n- VIVID - 生动的、鲜艳的\n- NEGATIVE - 否定的\n\nRECENT FREQUENT EXTREME\
    \ VIVID NEGATIVE\n三个“易”提醒你对信息要保持客观\n\n# 对应方法\n\n认知局限\n认知局限的结果即是盲人摸象、疑见一斑、以偏概全。\n\
    \n易记忆\n主动采取批判式思维来考虑问题，从而发现自己的小圈圈。\n察觉局限\n\n盲目自信\n容易忽略客观事实情况，从而自以为是认为自己是对的。\n\n\
    易关联\n主动实事求是的考虑问题，面对问题，多了解事实，避免盲从。\n察觉盲目\n\n经验判断\n经验是惯性思维，是大脑根本走捷径的偷懒方式。\n\n易提取\n\
    主动切换惯性思考，通过反思或复盘等方式来验证。\n察觉经验\n\n> 总结:主动运用批判性思维仔细评估，主动问出why，进而规避认知偏差做出正确的判断或者行动。\n\
    \n# 08.逆向思维模型\n\n我们应该应以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们将把人工智能“逆思维”翻译出来，为大家提供解决问题的可视化思维公式。\n\
    \n逆向思维法是指从事物的反面去思考问题的思维方法。这种方法常常使问题获得创造性的解决。具体来说，是指根据一种观念（概念、原理、思想）、方法及研究对象的特点从它的相反或否定方面去进行思考，实践证明，逆向思维是一种重要的思考能力。敢于“反其道而思之”，让思维向对立面的方向发展，从问题的相反面深入地进行探索，一般具有普遍性、批判性、新颖性等特点。个人的逆向思维能力，对于全面人才的创造能力及解决问\
    \ 题能力具有非常大的意义。\n\n# 模型结构\n\nA 的对立面\nA 的反方向\n\n-A\nREVERSE THINKING\n\n目标\nTARGET\n\
    \nA\nA 的统一面\nA 的正方向\n\nPOSITIVE THINKING\n\n逆向思维是对一些司空见惯的、已成定论的事务或现象反过来思考的一种思维方式。\n\
    \n# 举个例子\n\n逆向手段\n\n目标\n\n正向手段\n\n逆向思维\n解决问题\n\n正向思维\n解决问题\n\n司马光砸缸\n\n落水救人\n\n\
    水离开人\n\n人离开水\n\n逆向思维\n解决问题\n\n正向思维\n解决问题\n\n# 应对方法\n\n认知 A\nA\n认知 A\n\n认知 A 的对立面\n\
    -A\n认知 A 的反方向\n逆向思维\n\n- 品牌\n- 产品\n- 能力\n- 人才\n- 市场\n\n品牌条件\n\n目标用户\n\n正向思维\n\
    认知 A 的正方向\n认知 A 的反方向\n逆向推导\n\n总结:生活工作中，无论处于怎样的劣势或困境，想要摆脱自己常规思维羁绊，不如反过来想想。\n\n\
    # 09.六顶思考帽思维模型\n\n我们应该以不同的方式去思考问题，以此来应对这个变化万变的世界。由此爱德华前人智慧通过“视觉语言”翻译出来，为大家提供解决问题的可能性思维公式。\n\
    \n六顶思考帽 SIX THINKING HATS 是法国学者爱德华·德博诺 (EDWARD DE BONO) 博士开发的一种思维训练模式，或者说是一个全面思考问题的模型。它提供了“平行思维”的工具，避免将时间浪费在互相争执上。强调的是“能够成为什么”,而非“本身是什么”,是寻求一条向前发展的路,而不是争论谁对谁错。运用德博诺博士的六顶思考帽,将会使混乱的思考变得更清晰,使团体中无意义的争论变成集思广益的创造,使每个人变得富有创造性。六顶思考帽是管理思维的工具,简洁的操作框架,提高团队\
    \ IQ 的有效方法。\n\n# 使用六顶思考帽的方法：\n\n- (1) 聚集并思考想法和过程\n- (2) 鼓励创意,平行和水平思考并重\n- (3)\
    \ 改进功能\n- (4) 加快决策\n- (5) 避免争论\n\n# 模型结构\n\n单独使用→ or or or or or\n系统使用→ BLUE HAT\
    \ 1 2 3 4 5\n\n# 举个例子\n\n基础层次 适用可使用皇冠注意区分事实的真实性和相关\n客观中立 根据经验、感觉、印象和见证形成、直觉和判断,此处均需白籍排除\n\
    \n习惯白帽 习惯收集信息数据\n\n防止过度 危险：一不断要求信息悬息替代思考，从而拒绝思考；二浪费时间而且配合，或影响决策\n\n# SIX THINKING\
    \ HATS\n\n创造能力 不做评论 集中精神 创意 | 创新 中立 客观 信息帽 谨慎帽 负向 | 谨慎 管理 | 控制 乐观帽 情绪帽 直觉 | 情感\
    \ 指指挥帽\n\n正面评估仪式立在经验、可靠信息、逻辑推断、趋势的基础之上,关键乐观后的行动。\n\n1 时间限定 3-30s；2 允许表达感觉、预感、直觉；3\
    \ 无所论证说明理由；4 可作为决策思考部分；5 可作出决定后使用\n\n# 关于思考的安排,控制\n\n- 1. 我们时的控制点是？ 现处什么阶段？\n\
    - 2. 这个过程的步骤是？\n- 3. 下一步的方向是？\n\n# 客观思考,事实,数据和信息\n\n- 1. 我们有什么信息？\n- 2. 我们还需要什么信息？\n\
    - 3. 我们如何获得需要的信息？\n\n# 直觉思考,感觉,预感与直觉\n\n- 1. 我现在什么感觉？\n- 2. 我的感觉是什么？\n- 3. 我的常反应是什么？\n\
    \n# 正面思考,优势,价值和利益\n\n# 负面思考,考虑,风险和质疑\n\n# 创造性思考,探索,建议与改进\n"
