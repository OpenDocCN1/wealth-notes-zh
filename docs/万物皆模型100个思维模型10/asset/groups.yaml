    # 69.人类误判心理思维模型


    我们应该从不同的方向去思考问题,以此来适应这个变化莫测的世界。因此我们时而用人类透过“视觉语言”翻译出来,为大家提供解决问题时可量化思维公式。


    查理·芒格认为 81 岁的他能比 10 年前做得更好,他决定对早期的三次演讲精进行修改,于是就有了这个人类误判心理思维模型——25 条人类误判心理学。人类误判心理思维模型是一个告诉我们人类大概会失败,在此之前你必须了解这个世界是客观存在的。并进行在一定规律之上,而每个人的大脑中都有一个对客观世界的meyen看法。这些“存在偏差的主观看法”来自两个途径:感知与认知。人类的感知和认知系统中那些总体上很有用的倾向往往会出错,如果不对此加以小心提防,就会很容易受到他人故意的操控。


    # MODEL STRUCTURE


