    国际标准轨距为什么是1435mm？因为铁路是源于电车的设计，绝大多数的火车都是由马车衍生出来的。马车轮距来自古罗马马路轮距：战火时期罗马马路的宽度，而战马与马车之间的牵引。而类似使用时，天空飞翔导弹进驻车的宽度被提高是通行的。隋唐时期后续延续，隋朝相比华夏轮距，因此火药火箭的宽度也是由此决定。结论是：路径依赖将原来的美国先发明下轨距助推的宽度。虽然是路主义由西西里岛后来的袭击决定的。


    # INSPIRATION AND APPLICATION 启发应用


    一切皆有能 一切皆有可能，在你探索新的工作场景，能让自己做出改变的习惯，甚至是能不断突破自我，打破旧有模式，不断地往前迈进，才能从一个特定的思维或是路径中找到新路，也才能真正实现自己与周围环境、世界相连接。


    习惯就是不归路 一旦有了早期，选择就进入了一个“惯性”，惯性的力量会让自己不断在不自知的行为上，继续选择。正因为路径依赖，不少人即使有了更好的选择，也会因为已有的习惯和依赖，而无法改变现状。于是新人的去习惯，旧有模式的惯性被打破。


    多问几个WHY 建议你的团队多问几个问题，为什么？为什么？为什么？我们现在做这件事？为什么？我们要怎么做？我们要从中得到什么？保持好奇心，也许能更好推动团队解决问题的能力。问问题从目标的答案，到更深层次的思考、回溯、反思，驱动团队不断创新。


    总结：路径依赖思维模型即生活工作中可以去尝试新事物，尝试了或能生成新路径，从而开启新天地。'
  md: "\n## 60. 启发式偏差思维模型\n\n我们应该以不同的方式去思考问题，以此对应这个变化万千的世界。因此我们将“视觉谬误”翻牌出来，为大家提供解决问题的可视化公式。\n\
    \n因走捷径而导致的判断偏差，称为“启发式偏差”。当人们要对一个既复杂模糊又不确定的事件进行判断时，由于没有行之有效的方法，往往会走一些思维的捷径，比如：依赖过去的经验，通过对过去的经验进行分析处理得到启示，然后利用得到的启示作出判断，这些思维的捷径，有时帮助人们快速地做出准确的判断，但有时会导致判断的偏差。这些因走捷径而导致的判断偏差，就称为“启发式偏差”，查理·芒格对其偏差进行总结，提出“启发式偏差思维模型”。\n\
    \n## MODEL STRUCTURE\n## 模型结构\n\nHEURISTIC BIAS\n启发式偏差\n看清大脑是如何走捷径的\n\n- REPRESENTATIVENESS\
    \ BIAS\n  代表性偏差\n- AVAILABILITY BIAS\n  可得性偏差\n- ANCHORING EFFECT\n  锚定效应\n\n\
    因走捷径而导致的判断出现偏差\n\n## STRUCTURAL DISMANTLING\n## 结构拆解\n\n代表性偏差\n\n依赖判断事件本身经历的经验\n\
    的相同事件条件下的经验结果\n忽略样本大小\n忽略难易程度\n\n- 样本越小，与真实数据越差距大\n- 样本越大，与真实数据越差距小\n- 当面对复杂难以判断的问题易导致判断\n\
    - 根据不规范的和与资料无明细的描述判断\n- 忽略掉不熟悉的或看不信任的信息判断\n\n导致判断偏差\n\nEXAMPLE 1\n很多人比较喜欢买均值币，如果某五次的结果都是正，那么第六次很大的会是负。因为这多个结果比较均值。其实每一次结果接近1/2\
