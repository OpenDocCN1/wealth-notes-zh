    # 38. 凸透放大思维模型


    我们应该以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们对前人智慧通过“微软译”翻译出来，为大家提供解决问题的可视化思维公式。


    放大镜思维将具体的事物放大，从而看清事物的局部或细节，如看似简单而易被忽视的问题，放大后可能会发现导致其发生的原因并不简单，“千里之堤溃于蚁穴”或“千里之行始于足下”。相反复杂而棘手的问题放大后可能会发现导致其发生的原因很简单。通常情况下指“放大”、“汇集”和“聚焦”的思维。当我们遇到一件事情时，可以先采用“放大思维”剖析问题，洞察问题之后，再通过汇聚自身能力或外部能力帮助自己聚焦在关键处去解决问题。


    # MAGNIFYING GLASS MENTAL MODELS


    模型结构


    拆步骤

    主动 主动积极解决问题

    被动 本能等大问题影响

    抓细节


    汇集聚焦 ← 寻 accumulator? 找寻关键 ← 放大细节 → 洞察问题


    # 举个例子


    # 不知所作的《万物皆模型》，为什么叫万物皆模型？


    # 主动放大与被动放大


    为什么叫万物皆模型？因为万物都不分大小，如头角刚则留出的新芽，手里握着的秤子，一阵风我们都可以采用模型思维去思考存在，提起来因由还原成原点，这种思考可以帮助我们去看懂这个世界，帮助我们从工作中及复杂的冲突，以及常规复杂的从
    ... 万物皆模型的核心，在处，然而整个过程始终都离不开放大思维模型——帮助我们关注、分析身旁事物的模型。


    主动放大 —— 是指我们自己主动的、有意识的，积极地去运用放大思维来我们的生活工作中，如此放大思维可以帮助我们及时发现问题，解决形形色色的，被动放大 ——
    我被动放大，或许只能被动地去... 事件的影响到我们的情绪，我们的想法和行为的大... 这种放大我们的本能反应，所以我们要对被动放大有所警惕，以免被其它因素促使我们做出一些理性的决策。


    # 主动放大是前提


    # 拆解汇集合作的力量


    # 关注“默默的原主人”


    总结:主动运用放大思维，它会帮助我们找到问题的细节缺陷，继而找到关键汇聚合适的力量聚焦问题，解决问题。'
  - "[PAGE 40]\n\n# 39. 凹透缩小思维模型\n\n我们应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我将前人智慧整理“微咨询”翻拍出来，为大家提供解决问题的可视化思维公式。\n\
    \n凹透缩小思维模型是将具体的事物缩小，从而看清事物的位置以及事物与事物之间的关系，从而着眼于全局、整体、上帝的视角去解决问题，如看似复杂而棘手的问题，缩小后可能会发现导致其发生的原因并不困难，比如当我们遇到困惑时，空间层面我们可以将自己、对方、周围的世界缩小，时间层面我们可以将视野拉伸，如此去细节你会发现这个困惑不见得困惑。通常情况下指空间层面的“缩小问题”、“全局视角”和时间层面的“时间拉伸”的思维方法。\n\
    \n# CONCAVE LENS MENTAL MODELS\n\n# 内外通达\n\n# 主动\n\n# 被动\n\n# 主动积极解决问题\n\n# 被动自轻视自己\n\
