    系列位置效应 serial-position effect 是一种心理学现象，指人们倾向于对首先见到事物和最后见到事物有更好的印象，分为首因效应 primacy
    effect 和近因效应 recency effect。首因效应是对“第一印象”或“先入为主”所产生的心理学现象，指在行为过程中，最先接触的事物会给人留下深刻的感知或认知，影响人对事物的感受和判断，近因效应指在行为过程中，对事物的最近一次接触给人留下深刻的感知或认知，能对首因效应所形成的心理作用起到巩固、维持、否定、修改或增进等作用。


