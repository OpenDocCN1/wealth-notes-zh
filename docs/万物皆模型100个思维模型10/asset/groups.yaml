    \n我们常常习惯以不同的方式去思考问题，以此来对应这个瞬息万变的世界。因此我将前人智慧通过“视觉笔记”翻译出来，为大家提供解决问题的可视化思维公式。\n\n\
    LOCAL OPTIMAL SOLUTION 局部最优解 和 GLOBAL OPTIMAL SOLUTION 全局最优解 是数学中的两个概念。局部最优是对于一个问题的解在一定范围或区域内最优，或者说解决问题的手段在一定范围或限制内最优。全局最优是针对一定条件或环境下的一问题或者目标而言，若一项决策和所有解决该问题的决策相比是最优的。\n\
    \n## 模型结构\n\nLOCAL OPTIMAL SOLUTION AND GLOBAL OPTIMAL SOLUTION MENTAL MODELS\n\
    \n### 模型公式：\n\n+ 01 B 不一定是 A  A 一定是 B\n+ 02 C 不确定时，若无法找到 A 可依循当前 C 的条件寻求 B\n+\
    \ 03 B 够稳定后通过叠加升级 B → A\n\n### A GLOBAL OPTIMUM 全局最优\n\n### B LOCAL OPTIMUM 局部最优\n\
    \nC 外部环境\n\nC 外部环境\n\n局部最优不一定是全局最优 全局最优一定是局部最优\n\n## 举个例子\n\n柏拉图和苏格拉底之间有一段关于爱情和婚姻的对话。这段对话可以对应局部最优与全局最优。\n\
    \n人的命运是不断变化的外部环境 C。A 通常情况下并不全是自己能掌控，甚或在条件 A 不完全存在或者存在于他处，现在特殊情况下，我们无法不必去寻找解决方案。不如后退一步，在\
    \ C 确定的条件和范围内部去寻找。\n\n### WHAT IS LOVE? 什么是爱情？\n\n柏拉图问向老而聪慧的苏格拉底？苏格拉底回答说他去百里挑一。01.\
    \ 不是同一次 02. 只可一次\n柏拉图再问手里出来了，他的理由是，着他为什么，到他不是最美的？一次又一次。直到最后，才发现如此问题。对于这个问题，苏格拉底告诉他：'这就是爱情。'\n\
