    \n### 化解烦恼的利器\nA WEAPON TO RELIEVE TROUBLE\n\n1934 年，罗斯福在中国出差，派他的后院上安顿了当地人，但他并不太在意，他但说“我的安顿家安顿，我明白发生变化，我现在很平静、我很担心？我很担心他现在的安全；就要求我改变部分情况，而我并不知晓；我所在的家等其他情况，颇为复杂，而并不光明。”\n\
