    邓宁-克鲁格效应 (Dunning-Kruger effect)，简称邓克效应或达克效应 (DK effect)，亦称井蛙现象，是一种认知偏差，能力欠缺的人有一种虚幻的自我优越感，错误地认为自己比实际情况更加优秀。大卫·邓宁和贾斯汀·克鲁格将其归结为元认知上的缺陷，能力欠缺的人无法认识到自身的无能，不能准确评估自身的selected...
