    # 98. 正确非共识 思维模型


    我们应当以不同的方式去思考问题，以此来应对这个复杂万变的世界。因此我们将前人智慧通过“微觉悟者”请讲出来，为大家提供解决问题的可能性思维公式。


    共识指一个社会不同阶层，不同利益的人所寻求的共同认同、价值、理想。共识决策是指一种决策过程，不仅追求参与者的多数的同意，而且还解决和减少少数人的反对以达成最多同意的决策。而反共识或非共识，即不拘泥于旧的准则，不局限于共识性思维，敢于做出变通，当一个想法是正确的，且与广大大多数观点不一致时，那么这个想法就很有可能成功，所以要想获取一定的成功，你必须成为一个独立思考者，因为共识通常是错误的。

    当然非共识并不是抬杠蛮干的行为，而是通过逻辑性思考，找到真正的正确的标准。


    ## 模型结构


    ### CONSENSUS 共识


    ### WRONG 错误


    ### RIGHT 正确


    ### 错误 的共识


    ### 正确的共识


    ### 错误 非共识


    ### 正确 非共识


    ### NON CONSENSUS 非共识


    乔布斯说：我要在一个按键的手机！而那时人们对手机手机的共识是按键，多按键，但是乔布斯说了一条非共识之路。


    保持独立的思考

    确定真正的非共识

    坚持秉持走下去


    ### Poggendorff illusion 波根多夫错觉


    波根多夫错觉指一条直线被直线截断后，分离出的两段直线看上去在另一条线上重新连接，当人们还没所观察的视觉时，他会经常认为被截断的是直线，其实是错觉以及自己所认为的直线，而大相径庭的为另一条直线延伸而构成，但是视觉错误，造成了视觉错觉，所以要记得回到找出真相。


    ## 举个例子


    短期利润（确定的选择）... 多人

    长期利润（不确定风险）... 少人


    讲前果理的时候我们经常观察到多数人面对风险时，会偏于确定，选择风险，贝索斯认为自由现金流比利润更重要。不要利润，只要增长。在资本市场判断的是风险，而现金和流动资金更重要，投入到更大的生产中为非共识。贝索斯说：如果你的每件事都把眼光放到未来三年，和你同业竞争的人变成，把每件事的目光放到未来七年，那么你和你的竞争对手就会慢很多，因为很多公司可能做不到那么长的时间。10
    年前的时间里，华尔街的人不相信他话，说他是个傻子，而如今已是非昔比。


    自洽

    理论和实践一致—实践是检验真理的唯一标准

    理论与新出

    现信息一致

    续洽

    理论与公众

    的理论一致

    他洽


    非共识正确的标准是什么？——逻辑三洽可以够帮助我们判新一个方向是否正确！

    逻辑自洽：你的信念和你能观察到的证据之间，是相符的

    逻辑他洽：理论和其他被公认正确的理论是一致的

    逻辑经效：这个理论有理论与现实环境的信息是经验证的

    如果结果适合合逻辑推理，我们就可以知道它是否是真理，它也可以成为我们做事情判断决策的标准，或者说可以帮助我们找到合适的策略。


    ## 启发应用


    ### 批判性思维 —敢于承认我错了


    批判性思维指一种对事物进行独立思考、分析和评价的能力，它强调客观、公正地审视问题，避免主观偏见和情绪影响。为了培养批判性思维，我们需要在信息收集、判断和决策过程中保持开放心态，善于接受不同观点，并愿意承认和修正自己的错误。


    ### 第一性原理 —追本溯源


    第一性原理指通过分析、分解、归纳、总结等方法，从根本原因出发，重新审视问题，避免受传统观念和经验的束缚。第一性原理可以帮助我们理清事物的本质，突破思维定势，找到创新的解决方案。


    ### 全局视角 —拒绝细节陷阱


    全局视角指在思考问题时，要从整体出发，考虑各个因素之间的相互关系，避免过于关注细节而忽略了大局。为了培养全局视角，我们需要学会从宏观角度审视问题，关注长远目标和整体利益，避免盲目追求短期利益。


    总结：正确非共识可以帮助我们坚持独立思考、用逻辑三洽找到正确的非共识、勇敢地坚持下去。


    # 99. 波特五力分析 思维模型


    我们应该以不同的方式思考问题，以此来应对这个变化无常的世界。因此我们将借人智慧通过“视觉笔记”讲出为，为大家提供解决问题的可视化思维公式。


    波特五力分析模型 (Michael Porter''s Five Forces Model)，依据波特的观点，一个行业中的竞争，不止是在原有竞争对手中进行，而是存在着五种基本的竞争力量，这五种基本竞争力的状况及综合强度，决定着行业的竞争激烈程度，从而决定着行业最终的获利潜力以及资本向本行业的流向程度，这一最终决定着企业保持高收益的能力。五力分别是：供应商的议价能力、购买者的议价能力、潜在竞争者进入的能力、替代品的替代能力、行业内竞争者竞争所在的竞争力量。五种力量的不同组合变化，最能影响行业利润源来取之。


    ## 模型结构


    波特五力分析模型是个由竞争优势的第一原则提出的，其中包含一个行业的主要竞争力量，五种力量能够影响拿量和影响行业的五种竞争力量，即供应商的议价能力、购买者的议价能力、潜在进入者的威胁、替代品的威胁以及行业内现有公司的竞争力量。这五大力量，决定了行业的盈利能力，并构成出现战略的核心，应用于选择正确的行业以及行业中最佳的竞争位置。


    ### Threat of new entrants 潜在进入者的威胁


    潜在进入者的威胁——当某行业的障碍较高，由于成本高昂且竞争激烈，企业难以进入该市场。反之新企业可以利用规模经济和规模经济，进入的可能性则增大。


    - 1. 现有规模经济的规模效应阻断 2. 现有规模成本优势 3. 现有规模规模经济 4. 如若有成本优势 5. 重复投资阻断 6. 如若有技术优势则难以模仿
    7. 如若有资金优势 8. 现有客户的安全感关联 9. 建立良好的行为


    ### Bargaining power of suppliers 供应商议价能力


    供应商议价能力——它代表了供应商能够影响价格的程度。供应商：变更可以获得替代性竞争，因为供应商和行业上游会影响行业的定价和控制权。供应商的产品：他们可以提高价格上涨并提高毛利。


    ### Bargaining power of customers 购买者议价能力


    供应商议价能力——客户讨价还价的能力在于客户对产品和服务定制程度和能力。当当产品需求或服务需求量增加时，客户对产品的敏感度即不同时，产品价格适中，当潜在竞争者减少同类产品时，讨价还价的能力增强。


    ### Threat of substitutes 替代品的威胁


    替代品威胁——当顾客可以在许多替代品或服务中进行选择时，企业就是价格接受者，即买方决定价格，厂商仅有低价制的权力。反之企业提供易于替代化的产品，以使竞争对手的替代成本降低和替代品的崛起。替代品如下所述：1.
    客户需求旺盛 2. 顾客转换成本低 3. 厂商转换成本低 4. 替代品的质量和价格 5. 替代品的易得性


    ### Competitive rivalry 行业内竞争


    行业内竞争——竞争激烈时，企业可能很不容易控制商品和服务价格。反之行业企业数量减少或寡头时，企业可完全控制商品和服务的价格。在竞争环境中：1. 实力对等 2.
    实力较弱 3. 双双方产品类似度较高 4. 产能力强 5. 退退出成本高


    ## 基本模拟


    - 竞争对手 → 推进新产品 这是主要问题 → 找到朋友 联盟合作 增强竞争堡垒 → 新进入者 风险评估 友商竞争 → 提高自己 保持领先 预测未来需求 →
    发展需求 满足需求 没有紧缺条件


    ## 启发应用


    竞争压力不可避免—but可借力改变 构建护城河—除防御亦成成长 总结:孙子曰：


    > “死生之地，存亡之道，不可不察也”，因为干扰你的，从来不是你不知道的，而是你以为你知道的。


    # 100.护城河理论思维模型


    我们应该尝试以不同的方式思考问题，以此来应对这个万变不离其宗的世界。因此我们希望人类越过“狭隘语言”跳出为，来为大类提供准确问题的可能性思维公式。


    巴菲特的护城河理论 The moat theory，护城河为人 reliant 挖掘的围绕城墙的河，古代为防守用。巴菲特在给投资者的信中常常喜欢强调“经济护城河”的重要性：“你们不要忘记经营企业如同守城应当前先考虑挖一条深沟，以便将盗贼隔离在城堡之外……我们不一定要具备杀死恶龙的本领，只要躲开它近一点就可以做得很好。”企业护城河即防止竞争对手进入市场的壁垒，以保证公司能持续创造价值。拥有护城河的公司必须能持续获得超过其资产成本的收益，并获得高于竞争对手平均水平的回报。


    ## 模型结构


    专有技术护城河由易被模仿被模仿而相对较弱。它的力量常常被高估；而规模新护城河相对比较强。


    ### 独有资源 无形资产


    品牌 专利 授权


    无形资产


    对手瓜分抢夺


    防 保


    自己持续获利


    成本优势


