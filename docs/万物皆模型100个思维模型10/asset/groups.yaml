    熵值在不断增加

    熵值在不断减少

    熵减

    entropy reduce

    反熵增


    # 有序态


    # 无序态


    # 由熵增定律可推导出


    没有外部能量输入的封闭系统总是趋向于越混乱


    让一个系统变得更有序前提是必须有外部能量的输入


    当一个系统（或部分）变得更加有序，必然另一系统（或部分）变得更加无序，而且无序的增加程度将超过有序的增加程度


