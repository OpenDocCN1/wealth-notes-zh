    \n## 主动放大是前提\n\n## 拆解汇集合作的力量\n\n## 关注“默默的原主人”\n\n总结:主动运用放大思维，它会帮助我们找到问题的细节缺陷，继而找到关键汇聚合适的力量聚焦问题，解决问题。\n\
    \n# 39. 凹透缩小思维模型\n\n我们应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我将前人智慧整理“微咨询”翻拍出来，为大家提供解决问题的可视化思维公式。\n\
    \n凹透缩小思维模型是将具体的事物缩小，从而看清事物的位置以及事物与事物之间的关系，从而着眼于全局、整体、上帝的视角去解决问题，如看似复杂而棘手的问题，缩小后可能会发现导致其发生的原因并不困难，比如当我们遇到困惑时，空间层面我们可以将自己、对方、周围的世界缩小，时间层面我们可以将视野拉伸，如此去细节你会发现这个困惑不见得困惑。通常情况下指空间层面的“缩小问题”、“全局视角”和时间层面的“时间拉伸”的思维方法。\n\
    \n## CONCAVE LENS MENTAL MODELS\n\n## 内外通达\n\n## 主动\n\n## 被动\n\n## 主动积极解决问题\n\n\
    ## 被动自轻视自己\n\n## 洞察问题\n\n内外通达 → 全局视角 → 缩小问题 → 洞察问题\n\n## 举个例子\n\n## 凸透放大与凹透缩小两者非孤立——而是对立统一\n\
    \n## 切换\n\n## 主动缩小\n\n## 被动缩小\n\n主动缩小可以帮助你被动被放大带来的问题，如当你为某事焦虑很紧张时，主动缩小可...\n\n\
    ## 主动放大\n\n## 被动放大\n\n## 切换\n\n## 主动放大\n\n## 被动放大\n\n## 放大加缩小的两个使用路径\n\n## 使用路径\
    \ A\n\n## 使用路径 B\n\n当你遇到挫折时，首先是先被动被缩小自己是被放大导致，比如你的焦虑已在被动缩小（被动放大），这时发现有了自己产生了被动放大（被动放大）...此对应是在放大自己（被动放大对...）可以自己去缩小...\
    \ \n\n## 应用心态\n\n## 第一步，遇到问题不被动\n\n## 第二步，主动放大或缩小\n\n## 第三步，还是主动放大或缩小\n\n总结:生活中我们可以单独使用放大或缩小视角来解决问题，或者将两者叠加、交错灵活使用，黑白之间不见得是纯灰。\n\
    \n# 40.九宫格思维模型\n\n我们擅长以不同的方式去思考问题，以此来适应这个瞬息万变的世界。因此我们将借人智超群的“视觉语言”阐述出来，为大家提供解决问题的可视化思维公式。\n\
    \n九宫格思维是系统思维的一种方法，其包含纵向空间轴上的子系统、现系统和超系统；横向时间轴上的过去、现在和未来。其核心在于当我们遇到问题时，可以对问题进行系统(时间、空间叠加)思考，即不仅考虑当前，还考虑过去和未来；不仅考虑现系统，还考虑高维和低维的其他系统，从而进行系统地、动态地、联系(各要素之间的关系)地看待问题。九宫格思维是把问题当一个系统来研究，以此帮助我们看清位置的同时，找到现系统的の問題链，从而解决当下问题。\n\
    \n## 模型结构\n\n## THE NINE-GRID MENTAL MODEL\n\n空间轴 NAMESPACE AXIS\n高位 过去超系统 超系统\
    \ 未来超系统\n过去现系统 现系统 未来现系统 TIMER SHAFT 时间轴\n低位 过去子系统 子系统 未来子系统\n\n## 举个例子\n\n##\
    \ 九宫格系统看我们自己\n\n## 上世纪的太空笔难题\n\n过去的 生态圈 未来的\n过去的自己 现在的自己 未来的自己\n过去的 消化系统 … 未来的\n\
    \n九宫格思维是由三横三纵组成，纵向是空间系统，或维度系统，自下而上呈现低维度向高维度的延伸，这与时间的延伸。这与过去也是为了提高思维模型的变换速度（参考\
    \ 38 放大思维、39 缩小思维）。\n九宫格思维的基本点在于让我们跳出线性思维，看出自己当下的事，并在这个基础上找到自己的位置以及，将问题与自己的整个问题链条找出来。\n\
    \n失重环境、纸等 失重环境、纸等 失重环境、纸等\n铅笔 钢笔、圆珠笔 太空笔\n石墨笔芯 笔身、笔芯等 笔身、笔芯等\n太空笔问题在于超系统(失重环境)的改变，超系统的失重影响到系统笔水流出笔尖会因为油墨不能顺利达到笔尖而导致不写。也是因为油墨是“固态”或不会改变液体，所以太空笔的设计难题变成了如何设计一种固态水的笔，即铅笔是固态石墨笔芯，后起笔解决了太空书写难题！\n\
    \n## 启发应用\n\n## 惯性思维的主观意识\n\n## 九宫格思维的灵活运用\n\n## 打破时间、空间二脉\n\n总结:生活中我们可以单独使用放大或缩小视角来解决问题，或者将两者叠加、交错灵活使用，黑白之间不见得是纯灰。\n"
