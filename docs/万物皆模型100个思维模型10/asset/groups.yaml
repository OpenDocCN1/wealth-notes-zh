    \n隐含的英文词 (IMPLICIT) 为形容词，名词为 IMPLICATION 在逻辑中时常应用，指表象的元素或品质，未包括在表象本身，却可由对表象作逻辑分析而见。与「明示」(EXPLICIT)\
