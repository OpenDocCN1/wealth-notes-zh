    \n技能、标准、系统及模式等每一项单独提升都可以让我们在不同的竞争渠道中提升自己的能力、提高自己的竞争维度，从而避免冗长的行业中例我们的能力比率，当然这也是个人IP标签差异化的打法方法。\n\
    \n> 关联模型参考：升维思维模型、时光机思维模型、多视角思维模型、101010思维模型、长远思考思维模型等等\n\n## 启发应用\n\n## 升维降维打击的本来\n\
    \n三个维度如何去描述它们，但从战略角度区别开来。设想先加入产品和核心竞争力和能力，核心竞争力的核心在后，再把内容提升到技术、产品、系统等层面，企业需要通过不断地提升自己的能力，特别是技术、模式、系统等，以此让竞争对手无法跟上。\n\
    \n## 提升长远维度的能力\n\n提升长远维度的能力是将竞争的视角从短期转移到长期，通过建立系统的知识、方法和体系，提高在竞争环境中可持续发展的能力，从而在长远竞争中保持优势。\n\
    \n## 专注多维度的视角\n\n多维度的视角和系统的思维模式，需要同时关注不同维度的发展和变化，通过构建多维度的竞争战略，实现在不同维度的领先和协同，从而在复杂竞争环境中获得持续优势。\n\
    \n总结:主动将自身所处的空间维度拉高（自身能力的培养）目的是让对方无法在同维度空间中生存从而被市场淘汰。\n\n# 38. 凸透放大思维模型\n\n我们应该以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们对前人智慧通过“微软译”翻译出来，为大家提供解决问题的可视化思维公式。\n\
    \n放大镜思维将具体的事物放大，从而看清事物的局部或细节，如看似简单而易被忽视的问题，放大后可能会发现导致其发生的原因并不简单，“千里之堤溃于蚁穴”或“千里之行始于足下”。相反复杂而棘手的问题放大后可能会发现导致其发生的原因很简单。通常情况下指“放大”、“汇集”和“聚焦”的思维。当我们遇到一件事情时，可以先采用“放大思维”剖析问题，洞察问题之后，再通过汇聚自身能力或外部能力帮助自己聚焦在关键处去解决问题。\n\
    \n## MAGNIFYING GLASS MENTAL MODELS\n\n模型结构\n\n拆步骤\n主动 主动积极解决问题\n被动 本能等大问题影响\n\
    抓细节\n\n汇集聚焦 ← 寻 accumulator? 找寻关键 ← 放大细节 → 洞察问题\n\n## 举个例子\n\n## 不知所作的《万物皆模型》，为什么叫万物皆模型？\n\
    \n## 主动放大与被动放大\n\n为什么叫万物皆模型？因为万物都不分大小，如头角刚则留出的新芽，手里握着的秤子，一阵风我们都可以采用模型思维去思考存在，提起来因由还原成原点，这种思考可以帮助我们去看懂这个世界，帮助我们从工作中及复杂的冲突，以及常规复杂的从\
    \ ... 万物皆模型的核心，在处，然而整个过程始终都离不开放大思维模型——帮助我们关注、分析身旁事物的模型。\n\n主动放大 —— 是指我们自己主动的、有意识的，积极地去运用放大思维来我们的生活工作中，如此放大思维可以帮助我们及时发现问题，解决形形色色的，被动放大\
