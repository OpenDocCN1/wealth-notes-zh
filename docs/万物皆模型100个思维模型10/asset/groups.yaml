    感受 感受的感受

    观点

    期待

    渴望

    自我：我是谁


    喜怒、兴奋、羞耻、恐惧、伤心、悲伤、忧虑、比比，自己或别人的行为和需求的感受为什么有这种感受？比如：自己受到的方式而受到伤害后，又生了经验性的反应，愤怒。这样，我们就能够在身份相关、组合这些经验又同时看到我们的失败

