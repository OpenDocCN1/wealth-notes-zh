    24 小时


    有一个农民到集市买了一只狐狸、一只鹅和一袋豆子，回家时要渡过一条河中，有一艘船，但是只能装一件东西，而且，如果没有人看管，狐狸会吃掉鹅，而鹅会吃豆子。请问怎样把这三种东西安全运过河？

