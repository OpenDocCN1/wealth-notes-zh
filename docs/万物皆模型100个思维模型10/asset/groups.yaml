    # 58. 二八定律思维模型


    我们希望能以不同的方式去思考问题，以此来应对这个瞬息万变的世界，因此我们前几期都想要通过“视觉笔记”解读出来，为大家提供解决问题的可视化公式。


    帕累托法则（或称 80/20 法则、关键少数法则、二八法则、巴莱多定律）指出，约仅有 20% 的因素影响 80% 的结果。也就是说：所有变因中，最重要的仅有
    20%，虽然剩余的 80% 占了多数，影响的幅度却远低于“关键的少数”。管理学家约瑟夫·朱兰首先提出该原则，该法则以经济学家维尔弗雷多·帕累托的名字命名，并于他的文章《政治经济学》中说明了该现象，例如：意大利约有
    80% 的土地由 20% 的人口所有、80% 的豌豆产量来自 20% 的植株等等。该原则在现今企业管理中广泛运用。例如，“80% 的销售额来自 20% 的客户”。


    # MODEL STRUCTURE 模型结构


    二八法则即原因和结果、投入和产出、努力和报酬之间本來存在着无法解释的不平衡。一般来说，投入和努力可以分成两种不同的类型：多数，它只能造成少许的影响；少数，它们造成主要的、重大的影响。


    # TAKE AN EXAMPLE 举个例子


    假如 20% 碳酸饮料的人喝掉 80% 的碳酸饮料，那么这部分人应该是碳酸饮料制造商注意的对象,尽量争取取这 20% 的人来买,最好能进一步增加他对碳酸饮料消费量,减轻对制造商出于实际理由,可能令其忽视余下
    80% 啤酒饮料消费者的责任。因为他们的消费量只占 20%,同时当有一家公司发现自己 80% 的利润来自 20% 的顾客时,该制造商就会把 20% 的顾客盈利扩展到其它方面。也就是说,把注意力平均分散给所有的顾客更容易,也更合理。再者如果公司发现
