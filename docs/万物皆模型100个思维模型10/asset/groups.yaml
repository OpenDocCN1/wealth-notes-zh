    # 40.九宫格思维模型


    我们擅长以不同的方式去思考问题，以此来适应这个瞬息万变的世界。因此我们将借人智超群的“视觉语言”阐述出来，为大家提供解决问题的可视化思维公式。


    九宫格思维是系统思维的一种方法，其包含纵向空间轴上的子系统、现系统和超系统；横向时间轴上的过去、现在和未来。其核心在于当我们遇到问题时，可以对问题进行系统(时间、空间叠加)思考，即不仅考虑当前，还考虑过去和未来；不仅考虑现系统，还考虑高维和低维的其他系统，从而进行系统地、动态地、联系(各要素之间的关系)地看待问题。九宫格思维是把问题当一个系统来研究，以此帮助我们看清位置的同时，找到现系统的の問題链，从而解决当下问题。


    # 模型结构


    # THE NINE-GRID MENTAL MODEL


    空间轴 NAMESPACE AXIS

    高位 过去超系统 超系统 未来超系统

    过去现系统 现系统 未来现系统 TIMER SHAFT 时间轴

    低位 过去子系统 子系统 未来子系统


    # 举个例子


    # 九宫格系统看我们自己


    # 上世纪的太空笔难题


    过去的 生态圈 未来的

    过去的自己 现在的自己 未来的自己

    过去的 消化系统 … 未来的


    九宫格思维是由三横三纵组成，纵向是空间系统，或维度系统，自下而上呈现低维度向高维度的延伸，这与时间的延伸。这与过去也是为了提高思维模型的变换速度（参考 38
    放大思维、39 缩小思维）。

    九宫格思维的基本点在于让我们跳出线性思维，看出自己当下的事，并在这个基础上找到自己的位置以及，将问题与自己的整个问题链条找出来。


    失重环境、纸等 失重环境、纸等 失重环境、纸等

    铅笔 钢笔、圆珠笔 太空笔

    石墨笔芯 笔身、笔芯等 笔身、笔芯等

    太空笔问题在于超系统(失重环境)的改变，超系统的失重影响到系统笔水流出笔尖会因为油墨不能顺利达到笔尖而导致不写。也是因为油墨是“固态”或不会改变液体，所以太空笔的设计难题变成了如何设计一种固态水的笔，即铅笔是固态石墨笔芯，后起笔解决了太空书写难题！


    # 启发应用


    # 惯性思维的主观意识


    # 九宫格思维的灵活运用


    # 打破时间、空间二脉


    总结:生活中我们可以单独使用放大或缩小视角来解决问题，或者将两者叠加、交错灵活使用，黑白之间不见得是纯灰。'
  md: "\n# 32.黄金圈思维模型\n\n我们应该尝试以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们将前人智慧通过“微说话”翻讲出来，为大家提供解决问题的可视化思维公式。\n\
    \n西蒙·斯涅克说：“世界上所有伟大的领导和组织，无论是苹果公司，马丁·路德·金，还是莱特兄弟，他们的思维、行动和沟通方式都与其如出一辙，而与其它所有人都不完全不同。我所做的只是将其编辑拆解，它可能是世界上最简单的观念——黄金圈思维模型。”“黄金圈法则”、“黄金圆环(GOLDEN\
    \ CIRCLE)、黄金圈规则、黄金圈理论，即 WHY—HOW—WHAT 法则，在我们解决问题、做决策、与人沟通时请先说明原因，之后再说怎么做到和做什么。\n\
    \n## 模型结构\n\nGOLDEN CIRCLE MENTAL MODELS\n黄金圈思维\n\n由外向内\n常规思维\n易受干扰\n首位低效\n\n\
    为什么 WHY\n怎么做\n做什么\nHOW\nWHAT\n\n理性\n惯性\n目的\n感性|行为\n非凡思维\n由内向外\n内驱力强\n精准高效\n\n\
    边缘系统\n前额叶\n\n## 举个例子\n\n## 苹果与客户的沟通方式\n\n我们做的每一件事，都是为了突破和创新，我们坚信应该以不同的方式思考；\n\n\
    ### why\n\n我们桥梁现状的方式，是不断把我们的产品设计得精美、简单、界面友好。\n\n### how\n\n在这个过程中，我们做出了最棒的产品，想买一台吗？\n\
    \n### what\n\n我们做最棒的产品，设计精美、使用简单、界面友好，你想买一台吗？\n其他公司\n\n## 经典绕标广告文案\n\nLemon.次品\n\
    \n我们不允许有次品，即使仅仅露在上面的钣\n籍物处的钣锈有些损伤是一定要更换的\n\n### why\n\n在生产过程中的每一阶段都去检查甲壳虫（每天生产3千辆甲壳虫；而检查员比生产的人年还多）。\n\
    \n### how\n\n我们剔除了柠檬（注：残次品）；而你们得到了李子（注：合格品）——甲壳虫\n\n### what\n\n## 启示参考\n\n##\
    \ 启示一：以终为始\n\n思考问题从“为什么”开始，通过“挑战现状，挑战自我，挑战自我”，从而实现创新与发展。\n\n## 启示二：由内向外\n\n从“为什么”找到新目标；再研究“怎么做”；然后通过“是什么”明确结果，落地实施。\n\
    \n## 启示三：循环提高\n\n从“为什么”、“怎么做”到“是什么”，不断设定新目标，完善新思路、发展新成果，循环优化、循环提高。\n\n总论:黄金圈思维模型是一个帮助我们清事物本质，并能激发自己或他人达成且称的思维模型，凡事以终为始、由内向外、循环学习。\n\
    \n# 33.心流理论思维模型\n\n我们应该尝试以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们将前人智慧提炼“微观情景”翻拍出来，为大家提供解决问题的可能性思维公式。\n\
    \n心流又称福流、满流、心流通道，是一种将个人精神力完全投注在某种活动上的感觉；心流产生同时时会有高度的兴奋及充实感。我们在做某些事情时，那种全神贯注、投入忘我的状态；这种状态下，你甚至感觉不到时间的存在，在这件事情完成之后我们会有一种充满能量并且非常满足的感受。比如绘画、爬山、游泳、打球、玩游戏、阅读、演奏乐器还有工作的时候。人们在此状态中时，通常是不愿意打扰的，即不想中断。\n\
    \n## 模型结构\n\n### 前期心流\n\n### 后期心流\n\nHIGH\n\n挑战水平\n\nANXIETY\n焦虑\n\nLOW\n\n技巧水平\n\
    \nHIGH\n\n厌烦\n\nBOREDOM\n\n## 构成条件\n\n## 构成心流的七个要素\n\n- 我们倾向去从事的活动 ＞ 挑战活动\n- 我们会专注一致的活动\
    \ ＞ 全神贯注\n- 有清晰目标的活动 ＞ 目标明确\n- 有立即回馈的活动 ＞ 即时回馈\n- 我们对该项活动有主控感 ＞ 掌控自如\n- 在从事活动时我们的忧虑感消失\
    \ ＞ 忘我状态\n- 主观的时间感改变 ＞ 时间消失\n\n## 举个栗子——心流的游戏化模型\n\n## 用户进阶的核心的驱动力挖掘情况\n\n## 如何应用\n\
    \n- 明确目标\n- 即时回馈\n- 匹配难度\n- 全神贯注\n- 持续挑战\n\n总结心流是一种幸福，一种极致专注力非常强的体验，能帮助我们找到人生意义，获得成长，变得与众不同。\n\
    \n# 34. 长线思考思维模型\n\n我们相信通过以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们前人类曾经通过“假设推理”阐述出来，为大家提供解决问题的可视化思维公式。\n\
    \n长线思维指立于实现长期目标，再反推出当下的行为策略的思维方式。自控能力强的人，能够在没有外界监督的情况下，适当控制、调节自己的意志力和行为，比较坚决地抵制诱惑，比较耐心地延缓满足，坚持且不懈地确保长期目标的实现。为什么一定要坚持长线思维呢？贝索斯认为如果你做的每一件事把眼光放到未来三年，和你同台竞技的人很多；但是如果你的目光能放到未来七年，那么可以和你竞争的就很少了，因为很少有公司愿意做那么长远的打算。\n\
    \n## 模型结构\n\n## 反向逆推\n\nNOW 当下 1YEAR 2YEAR 3YEAR 4YEAR 5YEAR 6YEAR 7YEAR 未来 FUTURE\n\
    \n## 长线思考的三个因素\n\n- 01 找不变并将你的战略建立在不变的事物上\n- 02 要经常保持在极期的波动及其带来的诱惑\n- 03 坚持非共识但正确的观点及接近长久的模糊解\n\
    \n## 举个例子\n\n## 杰夫·贝索斯的能力圈 —— 长线思维\n\n## 任正非的长线思维\n\n如果你做的每一件事把眼光放到未来三年，和你同台竞技的人很多；但是如果你的目光能放到未来七年，那么可以和你竞争的就很少了，因为很少有公司愿意做那么长远的打算。\n\
    \n即零售业中的哪些事物是不变的呢？\n\n- 未来十年什么是不变的\n- 01 无限选择\n- 02 最低价格\n- 03 快速配送\n这三件事的核心是用用户体验\n\
    \n长线思维即是围绕不变，并将你的战略建立在不变的事物上，围绕着不变，经得住波动带来的诱惑，坚持坚持正确的非共识。\n\n海思半导体 - 成立于 2004\n\
    一个一直在默默发展的备选品牌\n一个极限条件下的预备案\n15 YEARS LATER\n\n15 年付出只是长远思维中的一个最坏打算，核心是不变的有，华为先生也确实体现自己的战略建立在不变的核心上，才有了如今的实力。\n\
    \n## 启发应用\n\n## 反向逆推 - 找到变化中的不变\n\n## 反向逆推 - 预留原油甜饼\n\n## 反向逆推 - 明确目标持续挑战\n\n\
    总结: 长线思考思维模型是一个提醒运用长远眼光, 树立宏大目标, 关注长期利益, 实现可持续发展的思维模型。\n\n# 35.隐含前提思维模型\n\n我们应该尽可能以相同的方式思考问题，以此来对这个瞬息万变世界。因此我们拥有一套思维模型通过“假设语言”稍稍说出来，为大众提供解决问题的可视化思维公式。\n\
    \n隐含的英文词 (IMPLICIT) 为形容词，名词为 IMPLICATION 在逻辑中时常应用，指表象的元素或品质，未包括在表象本身，却可由对表象作逻辑分析而见。与「明示」(EXPLICIT)\
    \ 相反。简 pan 呢，在见到一个整体时，只「说明」这个整体，不指明整体的内容，而内涵自在整体之中，不言而喻。隐含前提即当我们论证一个结论时，我们通常不会明确说明所有推导结论的前提条件，而是\
    \ apel 而 隐含。\n\n## 模型结构\n\n## SUPPRESSED PREMISE 隐含前提\n\n尽管隐含前提是必要前提 可用来证明论证为真\
    \ 但当隐瞒后人们也会接受\n\nA 前提\n\nC 结论\n\n## 隐含前提的类型\n\n- 主观以为 即以自我三观为标准的判断，是主观非客观须要事实\n\
    - 客观须要 即基于客观事实存在或发生的真实事件为标准的判断\n\n隐含前提思维模型即促使我们能够有意识的、主动思考我们思维背后的逻辑，从而帮助我们透过现象知其本质。\n\
    \n## 举个例子\n\n## 生活中的隐含前提\n\n## BIC(BEHAVIOR\\IMPACT\\CONSEQUENCE)有效沟通法\n\nA 吸烟有害健康\n\
    \nB 你不该做对健康有害的事情\n\nC 所以你不该吸烟\n\n隐含前提\n\n01 事实 那已经发生的真实的行为\n\n02 影响 那发生的事情，对周围的人和事物产生的作用\n\
    \n03 后果 在影响的基础上，强调长期持续会引发的负面效果\n\nBIC 即行为事实、影响和后果，强调的就是人与人沟通要基于客观事实进行判断而非主观自我判断\n\
    \nA 闯红灯会被扣分\n\nB 闯红灯是违规驾驶，违规则要被扣分处罚\n\nC 所以你不该闯红灯\n\n隐含前提\n\nA 不知每天都在做思维模型\n\n\
    B 思维模型就是人们思考和解决问题的公式\n\nC 所以不知一定爱思考\n\n选择题：某îne经常遇到，找对方说话，你应该说\nA 你又遇到了\nB 公司9点上班，你今天9点半到的公司\n\
    公式：\nA 你又遇到了有隐含前提 说的是一个事实，没有任何的评价\nB 9点上班你9点半到的 说的是一个事实，没有任何的评价\n\n## 启发应用\n\n\
