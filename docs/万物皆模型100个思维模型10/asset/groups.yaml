    # 65. 冗余备份思维模型


    我们应该尝试以不同的方式思考问题，以此来对应这个复杂多变的世界。因此我将需要“智囊团”翻译出来，为大家提供解决问题的可视化公式。


    冗余 (REDUNDANCY) 是指系统为了提升其可靠度，_%s_ 刻意配置重复的零件或是机能。冗余一般是为了备用，或是失效安全的考量，也有可能是为了提升系统性能，像是卫星导航系统接收器，或是多线程电脑处理。冗余备份概念来自于工程学的冗余备份模型，指的是通过复制关键部件或系统的主要功能，来提高系统的稳定性。而冗余备份的初衷也是为了未雨绸缪，提前为将来可能发生的不好的结果做好预防准备，其本质在于使用更多的成本来防范未来可能获得巨大的风险。


    # MODEL STRUCTURE


    预备冗余是利用额外的零件，在没有人类介入的情况下，系统能处于所需的状态以外。


    即使用多的数量或能力来减少零件损坏的影响，如人的耳朵、眼睛，汽车备胎，篮球队员等


    # 被动冗余 主动冗余


    用监控个别备份的方式检测性能降低，如健康监测与纠正修正正常及安全稳定系统 (GPS)


    其中的子系统 "B" 是冗余的 (三重模块冗余)


    # 冗余备份的三个基本特征


    可以参与平常运作，但不一定每次启动

    不一定和主要工作，一定在相应工作

    一定增加额外成本，但不确定多少成本


    # 冗余备份的应用条件


    即以成本为前提的应用条件

    假如对系统损失很大，那么就需要冗余备份

    冗余备份的成本不高，那就不需要冗余备份


    # 冗余备份的底层逻辑


    冗余备份的本质在于

    使用更多的成本

    来防范未来可能的大风险


    # TAKE AN EXAMPLE


    相对于一个家庭而言，家庭的财务总收入都是由 A、B、C 三个个体产生。副业、妻子的「主业」三个部分汇集而成，A、B、C 三个都是这个家庭收入的冗余备份。无论
    A、B、C 三个个体出现问题，都不会影响正常运作，甚至是冗余备份的基本特征，即可参与并平常运作，但不一定在同一时间运作。虽然冗余备份会增加额外成本，但夫妻子手上有一个不同相，但很很关系到家庭正常运作这个目的。


    上图讲述为组织架构，其厚积研发理论是将多余的人员或者依靠战略发展所主动规划的不分费用用來保持业绩的稳定，又如当公司的 20% 时间制作。即如果每天可以以 20%
    的时间用来做与工作无关的事情，那么这就是员工的个人时间冗余。个人能力没发挥出来，从而造成了整个公司企业的创新力、人才培养和市场竞争力的发展。


    # INSPIRATION AND APPLICATION


    # 被动冗余


    被动冗余用多余零件来备份系统，一个零件完全失效时被动切换，另外一个零件继续工作，直到系统被真正发现问题为止。被动冗余通常用于关键系统，如飞机引擎、汽车备胎等，能在发生故障时迅速替换，提供持续的保障。


    # 主动冗余


    主动冗余的典型案例，2004 年美国航展报道，微软要求飞机在多重备份的情况下仍能正常飞行。主动冗余系统会实时监控各个组件的状态，一旦发现问题就会自动切换至备份系统，确保系统的连续运行。主动冗余的成本较高，但能提供更高的可靠性。


    # 冗余备份注意


    备份冗余备份的成本，不一定都是冗余备份的成本。冗余备份的成本取决于系统的复杂性、关键性的程度，而不是单纯的硬件成本。冗余备份的实施需要综合考虑成本与风险，避免过度冗余导致资源浪费。


    > 总结：冗余备份思维即帮助我们防范未知的、可能的Heavy风险，以此来提高自身系统反脆弱性的思维模型。'
