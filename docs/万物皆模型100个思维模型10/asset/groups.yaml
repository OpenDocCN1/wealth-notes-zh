    导致判断偏差\n\nEXAMPLE 2\n飞机和飞机起个安全。几乎所有的人都会告诉你飞机更安全,飞机事故概率大,飞机事故的发生率远小于火车事故的发生率。然而一旦飞机出事,电台、电视、广播、报纸等传播媒体都会有头版消息,人们一听见,听说了许多相关信息。\n\
    \n锚定效应\n\n典型特征\n过度依赖\n\n锚定值\n调整的范围也在锚定值的牵制领域\n\n- 导致判断过程会过分夸大\n- 导致对小事事件发生概率\n\
    \n导致判断偏差\n\nEXAMPLE 3\n假设 A 店与 B 店都陈列会统一的 99 元钢笔。A 店主要卖百元内的商品为主，所以顾客看到 99 元的钢笔，会觉得“贵”。但是\
    \ B 店大卖百元以上的商品，看到 99 元的钢笔，会觉得“便宜”。\n\n## INSPIRATION AND APPLICATION\n## 启发应用\n\
    \n你以为你以为的就是你以为的吗\n一旦你的观点变成了你的信念，而信念又变成你行动的指南，你的思考过程就会减少，思维被固定下来，逐渐变得僵化。所以我们要保持警惕，对自己进行反省，检视自己是不是有这样的倾向，及时纠正自己。尤其是当我们做出判断时，应问自己是否受到了启发式偏差的影响。\n\
    \n保持空杯心态\n人一生中应该保持对以下 1: 不断反思自己不断学习，并从实践中获取新的知识 2: 保持客观的态度，面对客观事实 3: 保持谦虚的态度，接受他人的不同观点\
    \ 4: 不断更新知识，保持好奇心和探索精神。\n\n用费曼技巧来破解固有认知\n费曼技巧，人人自做简单解释的方法，需简单清晰的来阐述一个观点，只需通过三个步骤来解决问题，1:\
    \ 选定主题2: 用简单的语言解释出来 3: 找出难以解释的部分（也就是你所不知道的部分）反复阐述，直至把你的固有认知和理解完全剥离出来，真正的实现自我认知，并成长。\n\
    \n总结,用后发法去快速应对常规事情，以谨慎的态度去应对不确定，认识到自己大脑的后发式偏差，最大化地规避决策陷阱。\n\n## 61. 批判性思考思维模型\n\
    \n我们每项都应以不同的方式思考问题，以此来应对这个极万变的世界。因此我们将预期人类通过“视觉语言”输入出来，为大家提供解决问题的可能化思维公式。\n\n\
    “批判的”（critical）源于希腊文 kriticos（提问、理解某物意义和有能力分析，即“辨明或判断的能力”）和 kriteron（标准）。从语源上该词暗示发展“基于标准的有效性能力的判断”。批判性思维作为一个技能的概念可追溯到杜威的“反省性思维”：“能动、持续和缜密地思考任何信念或被假定的知识形式，揭示支持它的理由以及它所进一步指向的结论。”批判性思维指的是技能和思想态度，没有学术边界，任何涉及时力或想象的论题都可从批判性思维的视角来审视。\n\
    \n## MODEL STRUCTURE\n## CRITICAL THINKING\n\n批判性思维是对事实证据的理性、怀疑和不带有偏见的分析或评价，是自我导向、自我、自我监控和自我纠正的思想。\n\
    \n## TAKE AN EXAMPLE\n\n批判性思维的一个重要程式“苏格拉底式方法”，或“产婆术”—苏格拉底所倡导的一种探性思维（probing questioning）。透过苏格拉底式提问（反驳提问），人们要试图弄清楚他或她的和别人的观念和思想区\
    \ 分和不好的思维，能有效有区分地和准确地思考，审视他们的想法和积累。苏格拉底运用了这套技巧提出假设，和发现他们对每一个问题理解的其余深度，整体理解和体现知的冲突或与其对某个事实的理论应依据，也同时审查新的推理模型或传统概念，通过提问，揭示出以往，所讲出的话语背后所隐含的矛盾性，以寻求新的可能桥梁。\n\
    \n## INSPIRATION AND APPLICATION\n\n总结：批判性思考的特征在于对想法与信息做细致的分析与评判，借由拒绝不恰当的想法，让我们更加接近真理与真相。\n\
    \n## 62. 金字塔原理思维模型\n\n我们需要应从不同的方向去思考问题，以此来应对瞬间万变的世界，因此我们前半程借助“视觉迭代”编辑出来，为大家提供解决问题的可视化思维公式。\n\
    \n金字塔原理就是以结果或结论为导向的思考、表达的过程，金字塔原理强调的是一种突出重点、思维清晰、主次分明的逻辑思考能力，基本结构是结论先行，以上统下、归类分组、逻辑递进，而且中心思想明确。结论先行，且上一层观点应是对下一层观点的简单概括，纵向逻辑，即上一个结论又是一个解答的过程。我们在解决具体的问题时，可以从下到上收集相关的论据，然后再归纳出解决问题的中心思想，这样我们就可以一层层建造起非常坚实的金字塔结构，进而帮助我们解决问题。\n\
    \n## MODEL STRUCTURE\n## 模型结构\n### 1 结论先行\n### 2 以上统下\n\n上对下总括概括\n下对上解释支持\n避免言之无物\n\
    \n### 3 归类分组\n\n每一组思想必须属于同一逻辑范畴\n\n### 4 逻辑递进\n\n每一组思想观点必须按逻辑顺序组织\n\n自上而下表达\n\
    VERTICALLY\n\n自下而上思考\n\n只有这点个中心思想\nMECE原则\n彼此相互独立，有完全穷尽\n组织思想的方法\n\n时间 空间\n重要性\
    \ 逻辑演绎\n\n让别人感兴趣\nS 背景 C冲突 Q疑问\n\n金字塔原理\n解决问题的逻辑\n结构化数字\n实战分析\n结构性分析\n界定范围\n\n\
    HORIZONTALLY 横向\n\n## TAKE AN EXAMPLE\n## 举个栗子\n\n书中的原话：A 英电活他也不能参加下午 3 点会议了，B\
    \ 说他不能参加一点开会，阴天开不了，我：（明天10:30 以前通知你，C 的秘书说，C 明天都要到该医院去检查肺片和磁共振，其次在室外开会可以吗？，四点四时还见不到人时，将会议定在星期会期上午\
    \ 11 点敲定再次确认。）思考步骤：\n\n使用金字塔原理表述问题\n\n问题产生于现状和目标之间的差距，问题的解决有两步：\n\n一、界定问题即使用以下框架来明确问题：\n\
    01. 发生了什么事情（背景、现状、...）\n02. 我们知道了什么（非期望结果 R1）\n03. 我们想要什么（期望结果 R2）\n\n## INSPIRATION\
    \ AND APPLICATION\n## 什么是金字塔原理\n## 为什么要用金字塔原理\n## 如何用金字塔原理\n## 怎样让别人对你的观点感兴趣\n\
    \n总结:如果归因，总结概括、归类分组，帮助自己建立清晰的逻辑思考路径，或称桥利思维。\n\n## 63. MECE原则思维模型\n\n我们应该以不同的方式去思考问题,以此来应对这个变化万千的世界,因此我们将前人“智慧结晶”翻箱出来,为大家提供解决问题的可视化模型公式。\n\
    \nMECE 原则或称 MECE 分析法, 是 Mutually Exclusive Collectively Exhaustive, 中文意思是“相互独立,\
    \ 完全穷尽”。也就是说对于一个重大的议题, 能够做到不重叠、不遗漏的分类, 而且能够信此有效把握问题的核心, 并解决问题的办法, 即所谓“不重不漏”。是把一些事物分成互斥\
    \ (ME) 的类别, 并且不遗漏其中任何一个 (CE) 的分类方法。该思想的起源最早可以追溯到亚里士多德。MECE 原则在进行商业计划的过程中很有用, 在这一过程中,\
    \ 信息分类的最佳效果存在, 且分类效果最佳时不会把任何信息放入两个不同的种类。\n\n## MODEL STRUCTURE\n## MUTUALLY EXCLUSIVE\
    \ 相互独立\n## MECE\n## COLLECTIVELY EXCLUSIVE 完全穷尽\n\n非独立即有重叠 如：四边形包含正方形、长方形、矩形\n\
    \n未穷尽即缺少细节 如：颜色系统包含蓝、绿、红色系、（当旺还有很多色系）\n\n## TAKE AN EXAMPLE 举一票子\n\nA 的新合约会被 B\
    \ 抢 11 点左右大声嘶吼喊话, 这影响到我对 A 的正常生活, 于还是想稍微依赖 B 来大声嘶吼或者? 把整个问题, A 查阅用 MECE 原则整理,\
    \ 则可以很容易“亮相地”先查着。三种情况, 又在“被怀疑”下方, 按我恐慌度, 分为：等级, 举例说明“先暂时”与其他情况。\n\nA 去询问自己的代餐香产品,\
    \ 目的是否交换一个产品包装升级的, 换句话说, 宝宝及婴儿等就其它等家将会用到, 换用户第一项第三方供应商, 按我这里及这样对应的时间, 及产品在发货前是否能提供一个产品及用户体验等以此判断反馈体系,\
    \ 在和谐等级时间, 提出产品咨询等提到用户体验。\n\n历经以上提问会让 MECE 原则, 但它不仅会告诉 A 也可能告诉 B 是什么, 并且它可能改变?\
    \ 比如如果要掌控它, 比我想要控制是对? 我自己能改变什么? 比如如果要掌控它, 比我... 举例：当你吹... 实际如果比要常变前是... 即使...\
    \ 等… 题... 改问题, 此是由上面问题有的信息, 是设定上面问题有的信息。\n\n## 怎样才能让 B 不那么大声嘶吼\n## 产品保证如何升级\n\n\
    因此考虑问题首先可以从最终目标是什么开始, 即上一隔离的数字规律。比如何中大声嘶吼我们关注? 其指导可以再新, 而不是具体体, 比如具体, 所以才有“老爷去电的新发现”的策略,\
    \ 其次上图表面, 可以通过拆解元元素改变元素, 例如时间、地点、对等, 各位, 若想解决问题, 清无必要在对立面。\n\n得知告诉 A 的想法对于产品升级会有一定作用,\
    \ 但它不足以顾虑亲属, 可能是检会在自己未来大规模, 并对上述问题的固化“上不够”... 以及咱们知道A的可以自己使用反馈, 如... 如... 若使用反馈存在变化怎么办?\
    \ 所以A的反馈者另., 取相关使用, 观察, 了解... 例如A... 在用户角度思考对... 对... 对... 对... 相对的差异求一, 设定可以找到...\
    \ 例如客观... +\n\n## INSPIRATION AND APPLICATION 举发应用\n## 自上而下看问题\n## 关于相互独立\n##\
    \ 关于完全穷尽\n\n总结就是把一个大的目标, 分解为具体可操作执行的步骤。没有做分解的目标, 在很多情况下, 会导致这个大的目标不能完成。\n\n##\
    \ 64. 耗散结构思维模型\n\n我们需要应该以不同方式去思考问题，以此来对这个复杂万变世界，因此我们将前几章里提通过“假设语言”阐述出来，为大家提供解决问题的可视化思维公式。\n\
    \n比利时学者伊利亚·普利高津在对热力学第二定律研究的基础上，提出了“耗散结构理论”。即一个远离平衡态的非线性的开放系统（不论是物理的、化学的、生物的、社会的、经济的系统）通过不断地与外界交换物质和能量，在系统内部某个参数的变化达到一定的阈值时，通过涨落，系统可能发生突变即非平衡相变，由原来的混沌无序状态转变为一种在时间、空间、功能上的有序态。这种在远离平衡的非线性区形成的新的稳定的宏观有序结构，由于需要不断与外界交换物质或能量才能维持，因此称之为“耗散结构”(dissipative\
    \ structure)。\n\n## MODEL STRUCTURE\n模型结构\n\n![](img/df4a7790feb77e5cf1e36990b372088a_65_0.png)\n\
    \n当一个生命系统从环境中接收到能量丰富的输入，这个系统就会变得越来越活跃，这种增变运动的过程被称为“扰动”。在“分岔点”，系统会不会分裂，要么会跃进到更高、更复杂的层次，以便能够应对更大的挑战。\n\
    \n## TAKE AN EXAMPLE\n\n单位黑子\n\n![](img/df4a7790feb77e5cf1e36990b372088a_65_1.png)\n\
    \n舒适区内固有在熟练的环境中，和熟悉的人、熟悉的事物，似乎是“平衡态”，因此需要强大外力的推动或有意突破到一个新平衡状态。比较舒适的状况，然有平静也意味着大局，但如果进入到新的、挑战性更高的状态，虽缺少舒适与安全，但是机器会如磨修理人、生物进化，挣脱束缚与远离平衡态，也是最开启对让我们踏非舒适的区域、主动走出。\n\
    \n## INSPIRATION AND APPLICATION\n\n居处应用\n\n总结:耗散结构思维模型，即通过保持开放、持续做功，从无序走向有序，实现减减问题的思维模型。\n\
    \n## 65. 冗余备份思维模型\n\n我们应该尝试以不同的方式思考问题，以此来对应这个复杂多变的世界。因此我将需要“智囊团”翻译出来，为大家提供解决问题的可视化公式。\n\
    \n冗余 (REDUNDANCY) 是指系统为了提升其可靠度，刻意配置重复的零件或是机能。冗余一般是为了备用，或是失效安全的考量，也有可能是为了提升系统性能，像是卫星导航系统接收器，或是多线程电脑处理。冗余备份概念来自于工程学的冗余备份模型，指的是通过复制关键部件或系统的主要功能，来提高系统的稳定性。而冗余备份的初衷也是为了未雨绸缪，提前为将来可能发生的不好的结果做好预防准备，其本质在于使用更多的成本来防范未来可能获得巨大的风险。\n\
    \n## MODEL STRUCTURE\n\n预备冗余是利用额外的零件，在没有人类介入的情况下，系统能处于所需的状态以外。\n\n即使用多的数量或能力来减少零件损坏的影响，如人的耳朵、眼睛，汽车备胎，篮球队员等\n\
    \n## 被动冗余 主动冗余\n\n用监控个别备份的方式检测性能降低，如健康监测与纠正修正正常及安全稳定系统 (GPS)\n\n其中的子系统 \"B\" 是冗余的\
    \ (三重模块冗余)\n\n## 冗余备份的三个基本特征\n\n可以参与平常运作，但不一定每次启动\n不一定和主要工作，一定在相应工作\n一定增加额外成本，但不确定多少成本\n\
    \n## 冗余备份的应用条件\n\n即以成本为前提的应用条件\n假如对系统损失很大，那么就需要冗余备份\n冗余备份的成本不高，那就不需要冗余备份\n\n##\
    \ 冗余备份的底层逻辑\n\n冗余备份的本质在于\n使用更多的成本\n来防范未来可能的大风险\n\n## TAKE AN EXAMPLE\n\n相对于一个家庭而言，家庭的财务总收入都是由\
    \ A、B、C 三个个体产生。副业、妻子的「主业」三个部分汇集而成，A、B、C 三个都是这个家庭收入的冗余备份。无论 A、B、C 三个个体出现问题，都不会影响正常运作，甚至是冗余备份的基本特征，即可参与并平常运作，但不一定在同一时间运作。虽然冗余备份会增加额外成本，但夫妻子手上有一个不同相，但很很关系到家庭正常运作这个目的。\n\
    \n上图讲述为组织架构，其厚积研发理论是将多余的人员或者依靠战略发展所主动规划的不分费用用來保持业绩的稳定，又如当公司的 20% 时间制作。即如果每天可以以\
    \ 20% 的时间用来做与工作无关的事情，那么这就是员工的个人时间冗余。个人能力没发挥出来，从而造成了整个公司企业的创新力、人才培养和市场竞争力的发展。\n\
    \n## INSPIRATION AND APPLICATION\n## 被动冗余\n\n被动冗余用多余零件来备份系统，一个零件完全失效时被动切换，另外一个零件继续工作，直到系统被真正发现问题为止。被动冗余通常用于关键系统，如飞机引擎、汽车备胎等，能在发生故障时迅速替换，提供持续的保障。\n\
    \n## 主动冗余\n\n主动冗余的典型案例，2004 年美国航展报道，微软要求飞机在多重备份的情况下仍能正常飞行。主动冗余系统会实时监控各个组件的状态，一旦发现问题就会自动切换至备份系统，确保系统的连续运行。主动冗余的成本较高，但能提供更高的可靠性。\n\
    \n## 冗余备份注意\n\n备份冗余备份的成本，不一定都是冗余备份的成本。冗余备份的成本取决于系统的复杂性、关键性的程度，而不是单纯的硬件成本。冗余备份的实施需要综合考虑成本与风险，避免过度冗余导致资源浪费。\n\
    \n> 总结：冗余备份思维即帮助我们防范未知的、可能的Heavy风险，以此来提高自身系统反脆弱性的思维模型。\n\n## 66. 路径依赖思维模型\n\n\
    我们需要尝试以不同的方式去思考问题，以此来突破这个瞬息万变的世界。因此我们将前期人类通过“视觉笔记”编辑出来，为大家提供解决问题的可能性思维公式。\n\n\
    路径依赖（Path dependence）指的是在给定条件下人们的决策选择受制于其过去的决策，即使过去的环境可能已经过时。其特定含义指人类社会中的技术演进或制度变迁均有类似于物理学中的惯性，即一旦进入某一路径（无论是“好”还是“坏”）就可能对路径产生依赖。泛指人们一旦选择了某个体制，由于规模经济、学习效应、协调效应、适应性预期、以及既得利益约束等因素的存在，会导致该体制沿着既定的方向不断得以自我强化。一旦做了选择，就好比走上了一条不归路，惯性的力量会使这一选择不断自我强化，并让你易于走不出去。\n\
    \n## MODEL STRUCTURE 模型结构\n\n广义的路径依赖即“历史的影响”。在解释复杂而非线性联系时，历史因素对于决策产生重要影响，而且在变化领域，早先情况的影响经常开启并主导了后续的进程。\n\
    \n狭义是指路径的自我强化，即初始的选择或差异会放大，而从并不比排列引发了后续的变化，并且在随后的形式下，这一历史影响是无效的。\n\n![](img/df4a7790feb77e5cf1e36990b372088a_67_0.png)\n\
    \n## TAKE AN EXAMPLE 举个栗子\n\n电视剧为什么一般都是45分钟？因为电视刚出现的时候，黑白胶片卷是按50分钟的时长设计的，每段胶片15分钟，而电视内的时长一般是15分钟的倍数，所以才会发明。短片一般都是15分钟，电影一般是45分钟，事实上一般90分钟或105分钟，但都是15分钟的倍数。更重要的是技术和大环境，当时完全不用考虑进入电视，因为电视行业的经验是从电影、发展到一个环节目就定成了这个时长固定，因此直到现在，大部分电视仍然是45分钟左右一集。\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_67_1.png)\n\n科学家把5只猴子放在一个笼子里，并在笼中间一串香蕉。只要有猴子伸手去拿，所有猴子会被高压水淋湿，首先没有猴子敢尝试，实施过一段时间后，用去一串新香蕉只剩一只猴子，而新没有猴子的短说，真的会看到猴子就实在感。该装置就叫传统的4只猴子被封锁了自由与控制，新的猴子一观察直至它也被“教育”过。没被训练的猴子被换成新的猴子被替换，最后，笼子里猴子的猴子是新的，但它们还是小心翼翼地看着“规则”。\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_67_2.png)\n\n![](img/df4a7790feb77e5cf1e36990b372088a_67_3.png)\n\
    \nDvorak 键盘公认是打字机按键设计的最佳方案，适合更小的手指，更小，更精小的手指的安排，能让打字更快。\n\n我们日常使用的键盘 QWERTY |\
    \ 柯尔曼键盘 是美国使用的，基于拉字母的排列打字机和计算机键盘的。按此排列打字机在1874年由克里斯托夫大卫生，从此成为美国通用广泛的机械接口，其键盘的设计最初是为了减少打字机在打字时打字机在打字时卡住的问题，以防止字母发生打字频繁阻塞，因而要把常见字母隔开。虽然\
    \ QWERTY键盘是被有意设计成打乱对手的速度，但在普遍度上相对它较晚出现的键盘一直具有很低的优势。\n\n![](img/df4a7790feb77e5cf1e36990b372088a_67_4.png)\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_67_5.png)\n\n国际标准轨距为什么是1435mm？因为铁路是源于电车的设计，绝大多数的火车都是由马车衍生出来的。马车轮距来自古罗马马路轮距：战火时期罗马马路的宽度，而战马与马车之间的牵引。而类似使用时，天空飞翔导弹进驻车的宽度被提高是通行的。隋唐时期后续延续，隋朝相比华夏轮距，因此火药火箭的宽度也是由此决定。结论是：路径依赖将原来的美国先发明下轨距助推的宽度。虽然是路主义由西西里岛后来的袭击决定的。\n\
    \n## INSPIRATION AND APPLICATION 启发应用\n\n一切皆有能 一切皆有可能，在你探索新的工作场景，能让自己做出改变的习惯，甚至是能不断突破自我，打破旧有模式，不断地往前迈进，才能从一个特定的思维或是路径中找到新路，也才能真正实现自己与周围环境、世界相连接。\n\
    \n习惯就是不归路 一旦有了早期，选择就进入了一个“惯性”，惯性的力量会让自己不断在不自知的行为上，继续选择。正因为路径依赖，不少人即使有了更好的选择，也会因为已有的习惯和依赖，而无法改变现状。于是新人的去习惯，旧有模式的惯性被打破。\n\
    \n多问几个WHY 建议你的团队多问几个问题，为什么？为什么？为什么？我们现在做这件事？为什么？我们要怎么做？我们要从中得到什么？保持好奇心，也许能更好推动团队解决问题的能力。问问题从目标的答案，到更深层次的思考、回溯、反思，驱动团队不断创新。\n\
    \n总结：路径依赖思维模型即生活工作中可以去尝试新事物，尝试了或能生成新路径，从而开启新天地。\n"
  mdcn: "\n## 60. 启发式偏差思维模型\n\n我们应该以不同的方式去思考问题，以此对应这个变化万千的世界。因此我们将“视觉谬误”翻牌出来，为大家提供解决问题的可视化公式。\n\
    \n因走捷径而导致的判断偏差，称为“启发式偏差”。当人们要对一个既复杂模糊又不确定的事件进行判断时，由于没有行之有效的方法，往往会走一些思维的捷径，比如：依赖过去的经验，通过对过去的经验进行分析处理得到启示，然后利用得到的启示作出判断，这些思维的捷径，有时帮助人们快速地做出准确的判断，但有时会导致判断的偏差。这些因走捷径而导致的判断偏差，就称为“启发式偏差”，查理·芒格对其偏差进行总结，提出“启发式偏差思维模型”。\n\
    \n## MODEL STRUCTURE\n## 模型结构\n\nHEURISTIC BIAS\n启发式偏差\n看清大脑是如何走捷径的\n\n- REPRESENTATIVENESS\
    \ BIAS\n  代表性偏差\n- AVAILABILITY BIAS\n  可得性偏差\n- ANCHORING EFFECT\n  锚定效应\n\n\
    因走捷径而导致的判断出现偏差\n\n## STRUCTURAL DISMANTLING\n## 结构拆解\n\n代表性偏差\n\n依赖判断事件本身经历的经验\n\
    的相同事件条件下的经验结果\n忽略样本大小\n忽略难易程度\n\n- 样本越小，与真实数据越差距大\n- 样本越大，与真实数据越差距小\n- 当面对复杂难以判断的问题易导致判断\n\
    - 根据不规范的和与资料无明细的描述判断\n- 忽略掉不熟悉的或看不信任的信息判断\n\n导致判断偏差\n\nEXAMPLE 1\n很多人比较喜欢买均值币，如果某五次的结果都是正，那么第六次很大的会是负。因为这多个结果比较均值。其实每一次结果接近1/2\
    \ 正负。事实上，每一次抛硬币的结果是独立的，不论之前的结结果如何，下一次的结果是几乎半半正反。\n\n可得性偏差\n\n依赖最先到来的经验和信息\n\n\
    - 容易知晓的事件\n- 易遗忘的事件\n- 依赖短期的事件\n\n- 对判断是没有必要的不断的\n- 近期发生的不断事件\n- 过去经常会发生的事件\n\n\
    导致判断偏差\n\nEXAMPLE 2\n飞机和飞机起个安全。几乎所有的人都会告诉你飞机更安全,飞机事故概率大,飞机事故的发生率远小于火车事故的发生率。然而一旦飞机出事,电台、电视、广播、报纸等传播媒体都会有头版消息,人们一听见,听说了许多相关信息。\n\
    \n锚定效应\n\n典型特征\n过度依赖\n\n锚定值\n调整的范围也在锚定值的牵制领域\n\n- 导致判断过程会过分夸大\n- 导致对小事事件发生概率\n\
    \n导致判断偏差\n\nEXAMPLE 3\n假设 A 店与 B 店都陈列会统一的 99 元钢笔。A 店主要卖百元内的商品为主，所以顾客看到 99 元的钢笔，会觉得“贵”。但是\
    \ B 店大卖百元以上的商品，看到 99 元的钢笔，会觉得“便宜”。\n\n## INSPIRATION AND APPLICATION\n## 启发应用\n\
    \n你以为你以为的就是你以为的吗\n一旦你的观点变成了你的信念，而信念又变成你行动的指南，你的思考过程就会减少，思维被固定下来，逐渐变得僵化。所以我们要保持警惕，对自己进行反省，检视自己是不是有这样的倾向，及时纠正自己。尤其是当我们做出判断时，应问自己是否受到了启发式偏差的影响。\n\
    \n保持空杯心态\n人一生中应该保持对以下 1: 不断反思自己不断学习，并从实践中获取新的知识 2: 保持客观的态度，面对客观事实 3: 保持谦虚的态度，接受他人的不同观点\
    \ 4: 不断更新知识，保持好奇心和探索精神。\n\n用费曼技巧来破解固有认知\n费曼技巧，人人自做简单解释的方法，需简单清晰的来阐述一个观点，只需通过三个步骤来解决问题，1:\
    \ 选定主题2: 用简单的语言解释出来 3: 找出难以解释的部分（也就是你所不知道的部分）反复阐述，直至把你的固有认知和理解完全剥离出来，真正的实现自我认知，并成长。\n\
    \n总结,用后发法去快速应对常规事情，以谨慎的态度去应对不确定，认识到自己大脑的后发式偏差，最大化地规避决策陷阱。\n\n## 61. 批判性思考思维模型\n\
    \n我们每项都应以不同的方式思考问题，以此来应对这个极万变的世界。因此我们将预期人类通过“视觉语言”输入出来，为大家提供解决问题的可能化思维公式。\n\n\
    “批判的”（critical）源于希腊文 kriticos（提问、理解某物意义和有能力分析，即“辨明或判断的能力”）和 kriteron（标准）。从语源上该词暗示发展“基于标准的有效性能力的判断”。批判性思维作为一个技能的概念可追溯到杜威的“反省性思维”：“能动、持续和缜密地思考任何信念或被假定的知识形式，揭示支持它的理由以及它所进一步指向的结论。”批判性思维指的是技能和思想态度，没有学术边界，任何涉及时力或想象的论题都可从批判性思维的视角来审视。\n\
    \n## MODEL STRUCTURE\n## CRITICAL THINKING\n\n批判性思维是对事实证据的理性、怀疑和不带有偏见的分析或评价，是自我导向、自我、自我监控和自我纠正的思想。\n\
    \n## TAKE AN EXAMPLE\n\n批判性思维的一个重要程式“苏格拉底式方法”，或“产婆术”—苏格拉底所倡导的一种探性思维（probing questioning）。透过苏格拉底式提问（反驳提问），人们要试图弄清楚他或她的和别人的观念和思想区\
    \ 分和不好的思维，能有效有区分地和准确地思考，审视他们的想法和积累。苏格拉底运用了这套技巧提出假设，和发现他们对每一个问题理解的其余深度，整体理解和体现知的冲突或与其对某个事实的理论应依据，也同时审查新的推理模型或传统概念，通过提问，揭示出以往，所讲出的话语背后所隐含的矛盾性，以寻求新的可能桥梁。\n\
    \n## INSPIRATION AND APPLICATION\n\n总结：批判性思考的特征在于对想法与信息做细致的分析与评判，借由拒绝不恰当的想法，让我们更加接近真理与真相。\n\
    \n## 62. 金字塔原理思维模型\n\n我们需要应从不同的方向去思考问题，以此来应对瞬间万变的世界，因此我们前半程借助“视觉迭代”编辑出来，为大家提供解决问题的可视化思维公式。\n\
    \n金字塔原理就是以结果或结论为导向的思考、表达的过程，金字塔原理强调的是一种突出重点、思维清晰、主次分明的逻辑思考能力，基本结构是结论先行，以上统下、归类分组、逻辑递进，而且中心思想明确。结论先行，且上一层观点应是对下一层观点的简单概括，纵向逻辑，即上一个结论又是一个解答的过程。我们在解决具体的问题时，可以从下到上收集相关的论据，然后再归纳出解决问题的中心思想，这样我们就可以一层层建造起非常坚实的金字塔结构，进而帮助我们解决问题。\n\
    \n## MODEL STRUCTURE\n## 模型结构\n### 1 结论先行\n### 2 以上统下\n\n上对下总括概括\n下对上解释支持\n避免言之无物\n\
    \n### 3 归类分组\n\n每一组思想必须属于同一逻辑范畴\n\n### 4 逻辑递进\n\n每一组思想观点必须按逻辑顺序组织\n\n自上而下表达\n\
    VERTICALLY\n\n自下而上思考\n\n只有这点个中心思想\nMECE原则\n彼此相互独立，有完全穷尽\n组织思想的方法\n\n时间 空间\n重要性\
    \ 逻辑演绎\n\n让别人感兴趣\nS 背景 C冲突 Q疑问\n\n金字塔原理\n解决问题的逻辑\n结构化数字\n实战分析\n结构性分析\n界定范围\n\n\
    HORIZONTALLY 横向\n\n## TAKE AN EXAMPLE\n## 举个栗子\n\n书中的原话：A 英电活他也不能参加下午 3 点会议了，B\
    \ 说他不能参加一点开会，阴天开不了，我：（明天10:30 以前通知你，C 的秘书说，C 明天都要到该医院去检查肺片和磁共振，其次在室外开会可以吗？，四点四时还见不到人时，将会议定在星期会期上午\
    \ 11 点敲定再次确认。）思考步骤：\n\n使用金字塔原理表述问题\n\n问题产生于现状和目标之间的差距，问题的解决有两步：\n\n一、界定问题即使用以下框架来明确问题：\n\
    01. 发生了什么事情（背景、现状、...）\n02. 我们知道了什么（非期望结果 R1）\n03. 我们想要什么（期望结果 R2）\n\n## INSPIRATION\
    \ AND APPLICATION\n## 什么是金字塔原理\n## 为什么要用金字塔原理\n## 如何用金字塔原理\n## 怎样让别人对你的观点感兴趣\n\
    \n总结:如果归因，总结概括、归类分组，帮助自己建立清晰的逻辑思考路径，或称桥利思维。\n\n## 63. MECE原则思维模型\n\n我们应该以不同的方式去思考问题,以此来应对这个变化万千的世界,因此我们将前人“智慧结晶”翻箱出来,为大家提供解决问题的可视化模型公式。\n\
    \nMECE 原则或称 MECE 分析法, 是 Mutually Exclusive Collectively Exhaustive, 中文意思是“相互独立,\
    \ 完全穷尽”。也就是说对于一个重大的议题, 能够做到不重叠、不遗漏的分类, 而且能够信此有效把握问题的核心, 并解决问题的办法, 即所谓“不重不漏”。是把一些事物分成互斥\
    \ (ME) 的类别, 并且不遗漏其中任何一个 (CE) 的分类方法。该思想的起源最早可以追溯到亚里士多德。MECE 原则在进行商业计划的过程中很有用, 在这一过程中,\
    \ 信息分类的最佳效果存在, 且分类效果最佳时不会把任何信息放入两个不同的种类。\n\n## MODEL STRUCTURE\n## MUTUALLY EXCLUSIVE\
    \ 相互独立\n## MECE\n## COLLECTIVELY EXCLUSIVE 完全穷尽\n\n非独立即有重叠 如：四边形包含正方形、长方形、矩形\n\
    \n未穷尽即缺少细节 如：颜色系统包含蓝、绿、红色系、（当旺还有很多色系）\n\n## TAKE AN EXAMPLE 举一票子\n\nA 的新合约会被 B\
    \ 抢 11 点左右大声嘶吼喊话, 这影响到我对 A 的正常生活, 于还是想稍微依赖 B 来大声嘶吼或者? 把整个问题, A 查阅用 MECE 原则整理,\
    \ 则可以很容易“亮相地”先查着。三种情况, 又在“被怀疑”下方, 按我恐慌度, 分为：等级, 举例说明“先暂时”与其他情况。\n\nA 去询问自己的代餐香产品,\
    \ 目的是否交换一个产品包装升级的, 换句话说, 宝宝及婴儿等就其它等家将会用到, 换用户第一项第三方供应商, 按我这里及这样对应的时间, 及产品在发货前是否能提供一个产品及用户体验等以此判断反馈体系,\
    \ 在和谐等级时间, 提出产品咨询等提到用户体验。\n\n历经以上提问会让 MECE 原则, 但它不仅会告诉 A 也可能告诉 B 是什么, 并且它可能改变?\
    \ 比如如果要掌控它, 比我想要控制是对? 我自己能改变什么? 比如如果要掌控它, 比我... 举例：当你吹... 实际如果比要常变前是... 即使...\
    \ 等… 题... 改问题, 此是由上面问题有的信息, 是设定上面问题有的信息。\n\n## 怎样才能让 B 不那么大声嘶吼\n## 产品保证如何升级\n\n\
    因此考虑问题首先可以从最终目标是什么开始, 即上一隔离的数字规律。比如何中大声嘶吼我们关注? 其指导可以再新, 而不是具体体, 比如具体, 所以才有“老爷去电的新发现”的策略,\
    \ 其次上图表面, 可以通过拆解元元素改变元素, 例如时间、地点、对等, 各位, 若想解决问题, 清无必要在对立面。\n\n得知告诉 A 的想法对于产品升级会有一定作用,\
    \ 但它不足以顾虑亲属, 可能是检会在自己未来大规模, 并对上述问题的固化“上不够”... 以及咱们知道A的可以自己使用反馈, 如... 如... 若使用反馈存在变化怎么办?\
    \ 所以A的反馈者另., 取相关使用, 观察, 了解... 例如A... 在用户角度思考对... 对... 对... 对... 相对的差异求一, 设定可以找到...\
    \ 例如客观... +\n\n## INSPIRATION AND APPLICATION 举发应用\n## 自上而下看问题\n## 关于相互独立\n##\
    \ 关于完全穷尽\n\n总结就是把一个大的目标, 分解为具体可操作执行的步骤。没有做分解的目标, 在很多情况下, 会导致这个大的目标不能完成。\n\n##\
    \ 64. 耗散结构思维模型\n\n我们需要应该以不同方式去思考问题，以此来对这个复杂万变世界，因此我们将前几章里提通过“假设语言”阐述出来，为大家提供解决问题的可视化思维公式。\n\
    \n比利时学者伊利亚·普利高津在对热力学第二定律研究的基础上，提出了“耗散结构理论”。即一个远离平衡态的非线性的开放系统（不论是物理的、化学的、生物的、社会的、经济的系统）通过不断地与外界交换物质和能量，在系统内部某个参数的变化达到一定的阈值时，通过涨落，系统可能发生突变即非平衡相变，由原来的混沌无序状态转变为一种在时间、空间、功能上的有序态。这种在远离平衡的非线性区形成的新的稳定的宏观有序结构，由于需要不断与外界交换物质或能量才能维持，因此称之为“耗散结构”(dissipative\
    \ structure)。\n\n## MODEL STRUCTURE\n模型结构\n\n![](img/df4a7790feb77e5cf1e36990b372088a_65_0.png)\n\
    \n当一个生命系统从环境中接收到能量丰富的输入，这个系统就会变得越来越活跃，这种增变运动的过程被称为“扰动”。在“分岔点”，系统会不会分裂，要么会跃进到更高、更复杂的层次，以便能够应对更大的挑战。\n\
    \n## TAKE AN EXAMPLE\n\n单位黑子\n\n![](img/df4a7790feb77e5cf1e36990b372088a_65_1.png)\n\
    \n舒适区内固有在熟练的环境中，和熟悉的人、熟悉的事物，似乎是“平衡态”，因此需要强大外力的推动或有意突破到一个新平衡状态。比较舒适的状况，然有平静也意味着大局，但如果进入到新的、挑战性更高的状态，虽缺少舒适与安全，但是机器会如磨修理人、生物进化，挣脱束缚与远离平衡态，也是最开启对让我们踏非舒适的区域、主动走出。\n\
    \n## INSPIRATION AND APPLICATION\n\n居处应用\n\n总结:耗散结构思维模型，即通过保持开放、持续做功，从无序走向有序，实现减减问题的思维模型。\n\
    \n## 65. 冗余备份思维模型\n\n我们应该尝试以不同的方式思考问题，以此来对应这个复杂多变的世界。因此我将需要“智囊团”翻译出来，为大家提供解决问题的可视化公式。\n\
    \n冗余 (REDUNDANCY) 是指系统为了提升其可靠度，刻意配置重复的零件或是机能。冗余一般是为了备用，或是失效安全的考量，也有可能是为了提升系统性能，像是卫星导航系统接收器，或是多线程电脑处理。冗余备份概念来自于工程学的冗余备份模型，指的是通过复制关键部件或系统的主要功能，来提高系统的稳定性。而冗余备份的初衷也是为了未雨绸缪，提前为将来可能发生的不好的结果做好预防准备，其本质在于使用更多的成本来防范未来可能获得巨大的风险。\n\
    \n## MODEL STRUCTURE\n\n预备冗余是利用额外的零件，在没有人类介入的情况下，系统能处于所需的状态以外。\n\n即使用多的数量或能力来减少零件损坏的影响，如人的耳朵、眼睛，汽车备胎，篮球队员等\n\
    \n## 被动冗余 主动冗余\n\n用监控个别备份的方式检测性能降低，如健康监测与纠正修正正常及安全稳定系统 (GPS)\n\n其中的子系统 \"B\" 是冗余的\
    \ (三重模块冗余)\n\n## 冗余备份的三个基本特征\n\n可以参与平常运作，但不一定每次启动\n不一定和主要工作，一定在相应工作\n一定增加额外成本，但不确定多少成本\n\
    \n## 冗余备份的应用条件\n\n即以成本为前提的应用条件\n假如对系统损失很大，那么就需要冗余备份\n冗余备份的成本不高，那就不需要冗余备份\n\n##\
    \ 冗余备份的底层逻辑\n\n冗余备份的本质在于\n使用更多的成本\n来防范未来可能的大风险\n\n## TAKE AN EXAMPLE\n\n相对于一个家庭而言，家庭的财务总收入都是由\
    \ A、B、C 三个个体产生。副业、妻子的「主业」三个部分汇集而成，A、B、C 三个都是这个家庭收入的冗余备份。无论 A、B、C 三个个体出现问题，都不会影响正常运作，甚至是冗余备份的基本特征，即可参与并平常运作，但不一定在同一时间运作。虽然冗余备份会增加额外成本，但夫妻子手上有一个不同相，但很很关系到家庭正常运作这个目的。\n\
    \n上图讲述为组织架构，其厚积研发理论是将多余的人员或者依靠战略发展所主动规划的不分费用用來保持业绩的稳定，又如当公司的 20% 时间制作。即如果每天可以以\
    \ 20% 的时间用来做与工作无关的事情，那么这就是员工的个人时间冗余。个人能力没发挥出来，从而造成了整个公司企业的创新力、人才培养和市场竞争力的发展。\n\
    \n## INSPIRATION AND APPLICATION\n## 被动冗余\n\n被动冗余用多余零件来备份系统，一个零件完全失效时被动切换，另外一个零件继续工作，直到系统被真正发现问题为止。被动冗余通常用于关键系统，如飞机引擎、汽车备胎等，能在发生故障时迅速替换，提供持续的保障。\n\
    \n## 主动冗余\n\n主动冗余的典型案例，2004 年美国航展报道，微软要求飞机在多重备份的情况下仍能正常飞行。主动冗余系统会实时监控各个组件的状态，一旦发现问题就会自动切换至备份系统，确保系统的连续运行。主动冗余的成本较高，但能提供更高的可靠性。\n\
    \n## 冗余备份注意\n\n备份冗余备份的成本，不一定都是冗余备份的成本。冗余备份的成本取决于系统的复杂性、关键性的程度，而不是单纯的硬件成本。冗余备份的实施需要综合考虑成本与风险，避免过度冗余导致资源浪费。\n\
    \n> 总结：冗余备份思维即帮助我们防范未知的、可能的Heavy风险，以此来提高自身系统反脆弱性的思维模型。\n\n## 66. 路径依赖思维模型\n\n\
    我们需要尝试以不同的方式去思考问题，以此来突破这个瞬息万变的世界。因此我们将前期人类通过“视觉笔记”编辑出来，为大家提供解决问题的可能性思维公式。\n\n\
    路径依赖（Path dependence）指的是在给定条件下人们的决策选择受制于其过去的决策，即使过去的环境可能已经过时。其特定含义指人类社会中的技术演进或制度变迁均有类似于物理学中的惯性，即一旦进入某一路径（无论是“好”还是“坏”）就可能对路径产生依赖。泛指人们一旦选择了某个体制，由于规模经济、学习效应、协调效应、适应性预期、以及既得利益约束等因素的存在，会导致该体制沿着既定的方向不断得以自我强化。一旦做了选择，就好比走上了一条不归路，惯性的力量会使这一选择不断自我强化，并让你易于走不出去。\n\
    \n## MODEL STRUCTURE 模型结构\n\n广义的路径依赖即“历史的影响”。在解释复杂而非线性联系时，历史因素对于决策产生重要影响，而且在变化领域，早先情况的影响经常开启并主导了后续的进程。\n\
    \n狭义是指路径的自我强化，即初始的选择或差异会放大，而从并不比排列引发了后续的变化，并且在随后的形式下，这一历史影响是无效的。\n\n![](img/df4a7790feb77e5cf1e36990b372088a_67_0.png)\n\
    \n## TAKE AN EXAMPLE 举个栗子\n\n电视剧为什么一般都是45分钟？因为电视刚出现的时候，黑白胶片卷是按50分钟的时长设计的，每段胶片15分钟，而电视内的时长一般是15分钟的倍数，所以才会发明。短片一般都是15分钟，电影一般是45分钟，事实上一般90分钟或105分钟，但都是15分钟的倍数。更重要的是技术和大环境，当时完全不用考虑进入电视，因为电视行业的经验是从电影、发展到一个环节目就定成了这个时长固定，因此直到现在，大部分电视仍然是45分钟左右一集。\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_67_1.png)\n\n科学家把5只猴子放在一个笼子里，并在笼中间一串香蕉。只要有猴子伸手去拿，所有猴子会被高压水淋湿，首先没有猴子敢尝试，实施过一段时间后，用去一串新香蕉只剩一只猴子，而新没有猴子的短说，真的会看到猴子就实在感。该装置就叫传统的4只猴子被封锁了自由与控制，新的猴子一观察直至它也被“教育”过。没被训练的猴子被换成新的猴子被替换，最后，笼子里猴子的猴子是新的，但它们还是小心翼翼地看着“规则”。\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_67_2.png)\n\n![](img/df4a7790feb77e5cf1e36990b372088a_67_3.png)\n\
    \nDvorak 键盘公认是打字机按键设计的最佳方案，适合更小的手指，更小，更精小的手指的安排，能让打字更快。\n\n我们日常使用的键盘 QWERTY |\
    \ 柯尔曼键盘 是美国使用的，基于拉字母的排列打字机和计算机键盘的。按此排列打字机在1874年由克里斯托夫大卫生，从此成为美国通用广泛的机械接口，其键盘的设计最初是为了减少打字机在打字时打字机在打字时卡住的问题，以防止字母发生打字频繁阻塞，因而要把常见字母隔开。虽然\
    \ QWERTY键盘是被有意设计成打乱对手的速度，但在普遍度上相对它较晚出现的键盘一直具有很低的优势。\n\n![](img/df4a7790feb77e5cf1e36990b372088a_67_4.png)\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_67_5.png)\n\n国际标准轨距为什么是1435mm？因为铁路是源于电车的设计，绝大多数的火车都是由马车衍生出来的。马车轮距来自古罗马马路轮距：战火时期罗马马路的宽度，而战马与马车之间的牵引。而类似使用时，天空飞翔导弹进驻车的宽度被提高是通行的。隋唐时期后续延续，隋朝相比华夏轮距，因此火药火箭的宽度也是由此决定。结论是：路径依赖将原来的美国先发明下轨距助推的宽度。虽然是路主义由西西里岛后来的袭击决定的。\n\
    \n## INSPIRATION AND APPLICATION 启发应用\n\n一切皆有能 一切皆有可能，在你探索新的工作场景，能让自己做出改变的习惯，甚至是能不断突破自我，打破旧有模式，不断地往前迈进，才能从一个特定的思维或是路径中找到新路，也才能真正实现自己与周围环境、世界相连接。\n\
    \n习惯就是不归路 一旦有了早期，选择就进入了一个“惯性”，惯性的力量会让自己不断在不自知的行为上，继续选择。正因为路径依赖，不少人即使有了更好的选择，也会因为已有的习惯和依赖，而无法改变现状。于是新人的去习惯，旧有模式的惯性被打破。\n\
    \n多问几个WHY 建议你的团队多问几个问题，为什么？为什么？为什么？我们现在做这件事？为什么？我们要怎么做？我们要从中得到什么？保持好奇心，也许能更好推动团队解决问题的能力。问问题从目标的答案，到更深层次的思考、回溯、反思，驱动团队不断创新。\n\
    \n总结：路径依赖思维模型即生活工作中可以去尝试新事物，尝试了或能生成新路径，从而开启新天地。\n"
