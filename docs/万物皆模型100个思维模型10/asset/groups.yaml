    # 97. 梅特卡夫法则 思维模型


    我们应该以不同的方式思考问题，以此来应对这个瞬息万变的世界。因此我们将前期智慧通过“微软诗歌”翻译出来，为大家提供解决问题的可视化思维公式。


    梅特卡夫定律 Metcalfe''s law 是一个关于网络的价值和网络技术的发展的定律，由齐浩·李尔德于1993年提出，但以计算机网络先驱罗伯特·梅特卡夫的姓氏命名，以表彰他在以太网上的贡献。其内容是：一个网络的价值等于该网络内的节点数的平方，而且该网络的价值与联网的用户数的平方成正比。例如一个网络对网络中每个人价值是1元，那么规模为10倍的网络的总价值等于100元；规模为100倍的网络的总价值就等于10000元。网络规模增长10倍，其价值就增长100倍。


    ## 模型结构


