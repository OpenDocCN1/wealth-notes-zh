    # 50.邓克效应思维模型


    我们应该尝试以不同的方式去思考问题，以此应对这个瞬息万变的世界。因此我将用“视觉语言”翻译出来，为大家提供解决问题的可视化工具书。


    邓宁-克鲁格效应 Dunning-Kruger effect，简称邓克效应或达克效应 DK effect，亦称井蛙现象，是一种认知偏差，能力欠缺的人有一种虚幻的自我优越感，错误地认为自己比实际情况更加优秀。大卫·邓宁和贾斯汀·克鲁格将其归结为元认知上的缺陷，能力欠缺的人无法认识到自身的无能，不能准确评估自身的
    selected... 能力 他们的研究还表明，反之， 非常 善于的人会低估自己的能力，错误地假定他们自己能够很容易完成的任务，别人也能 很容易地完成。但能力欠缺的人对自己的能力的评估并不比能力较佳的人高。


    ## 模型结构


    ## 模型拆解


    1. 对特定任务不熟练的人通常会高估自己的技能水平，但他们能从他人的反馈中意识到自己能力低下；

    2. 对特定任务熟练的人会更正确认自己的真正水平以此找到自己的水准；

    3. 对特定任务熟练的人会认为自己还不够好，以及其他人之所以擅长，

    4. 如果对特定任务熟练的人能意识到自己的能力大幅度提高之后，他们便会意识到他们之前的能力程度，


    ## 第一阶段 虚假之巅


    在第一个阶段的人，通常不知道自己无知，察觉不到自己的能力不足。完全被自己的认知所局限，导致他们对自身的认识严重失调。因为他们缺乏足够的知识和经验，所以根本无法认识到“无知”的存在。


    ## 第二阶段 绝望之谷


    ## 第三阶段 开悟之坡


    ## 第四阶段 持续高原


    在流行文化中，邓宁-克鲁格效应常被错误解释为低智商人对自身智商的错误估计，而不是特指在任务不熟悉的人对特定任务的错误认识。


    总结:无能者的错误标度源自于对自己的错误认知，而极有才能者的错误标度源自于对他人的错误认知。


    # 51. 效率思维模型


    我们希望能以不同的方式去思考问题，以便可以应对这个复杂且迅速变化的世界。因此我们将前人智慧提炼“视觉语法”绘制出来，为大家提供解决问题的可视化思维公式。


    效率 Efficiency 是指在适当的使用原料、能源、努力、金钱及时间的情况下，进行特定事务或产出预期成果的能力。以广义的定义来说，效率是可以成功的把事情做好、且没有浪费的能力。“效率本身不是目的的，效率不是我们想要的，但效率可以让我们获得更多有价值的事物。”在经济学或科学的用语中，效率是量测输入用在预期任务或输出的程度。一般会包括最小的浪费、支出以及努力的情况下，用特定的努力来产生特定成果的能力。在不同的产业领域中，效率同样指不同的输入及输出。


    ## 模型结构


    ![](img/df4a7790feb77e5cf1e36990b372088a_52_0.png)


    ## 效率公式 = 产出(可用输出) ÷ 总成本(总输入) R=P/C


    效率思维即通过有意识的规划、拆解等，以期花费最少投入，获取更大产出的思维


    ## 举个栗子


    ## 努力就能成功的前提条件


    ## 压力是隐形的效率杀手


    ![](img/df4a7790feb77e5cf1e36990b372088a_52_1.png)


    ![](img/df4a7790feb77e5cf1e36990b372088a_52_2.png)


    做正确的事是前提，不知在思考创意思维模型时，也得益于以上模型。管理学大师彼得·德鲁克曾经在《有效的管理》中说“也许最重要的管理活动...”，“效率”即“以正确的方式做事”，而效能则是“做正确事”。效率和效能不能偏废，可这并不意味着效率和效能具有同等的重要性。我们当然希望同时提高效率和效能，但在时间和效能无法兼得时，我们首先应着眼于效能，然后再设法提高效率。”


    截止目前不知创作了50多个思维模型，在与这些思维模型接触的过程中可以发现思维模型并不是孤立的，也是互相联系、洞通了矩阵感，而且它们彼此都互为层叠存在，而非相互联系、相互链接，比如面对压力，可以通过笛卡尔思维去拆解问题，可以通过矢量左右放角块等压力降低值，可以通过放大、缩小、聚焦针对问题做宽窄等等。当目标明确，调整好压力范围和区域，都可以帮助你提高效率。


    ## 启发应用


    ## 做正确的事


    正确的事是指对组织的影响最直接的“正事”，正确的事情可能是可以实现的；以正确的思路进行“寻”，确保该事以正确的方式被执行，才能使资源集中，也能避免自己做错事而导致它开始从自己的事情。


    ## 明确目标，做好时间管理


    在组织层面？学会如何提出mice模型法在组织、列出粗略步骤。小事做、安排优先、外、按照优先级在时间上进行分配、设立里程碑、检视机制、工作计划标准化，以实现管理层对项目的进展。


    ## 培养专注力


    培养我们的专注力可以“减少PST活动”“放下杂事”，当你专注于正确的事情，减少分心，保持精力集中，突出重点，避免分心，专注于能为目标带来价值的任务，减少干扰，自觉清理干扰因素，保持心理清新，自觉保持专注力，持续在重点上投入。


    > 总结:效率是以正确的方式做事，效率思维是让我们意识到怎么样以正确的方式做事，怎么样才能少投入多获得。


    # 52. 福格行为模型


    我们希望你能以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们将此前“翻译成‘视觉语言’”翻译出来，为大家提供解决问题的可视化思维公式。


    福格行为模型以 BJ Fogg 命名，表明一个行为要得发生，行为者需要有进行此行为的动机和 C 作为此行为的能力，因而才能够在被触发时施行既定行为。即个个体要实现某一行为，需要有为行为的动机、完成该行为的能力、剥某激发行为的触发器三个要素，三个要素同时具备，行为者才能够跨越行动线，行为处于“触发成功”区域，才能够实现用户完成某一行为。福格行为模型可以示意为
    B=MAT，其中 B 是行为 Behavior，M 是动机 Motivation，A 是能力 Ability，T 是触发 Triggers。


    ## 模型结构 MODEL STRUCTURE


    B=MAT SUCCEED HERE 触发有效区 行为曲线 FAIL HERE 触发无效区


    ## 行为变化的三个要素 动机要素


    - 动机

    - 能力

    - 触发

    - 快乐或痛苦

    - 希望或恐惧

    - 社会受欢迎或拒绝


    ## 能力要素 触发要素


    - 时间

    - 金钱

    - 努力

    - 促进者

    - 火花

    - 信号


    生活中我们经得于是：

    动机(有) x 能力(有) x 触发(有) ——而后成功

    动机(有) x 能力(有) x 触发(无) ——想要而不能动

    动机(有) x 能力(无) x 触发(有) ——想而不易而不能

    动机(无) x 能力(有) x 触发(有) ——无所谓而不动


    怎么解？

    提高动机（例如通过恐惧或渴望的问题）

    降低难度（帮助信息和拆解步骤）


    ## 要素拆解 ELEMENT DISMANTLING


    ## 要素一：动机 动机有三个来源：P（人物）A（行动）C（情境）即PAC小人


    - 人物 想做或获取行为的人

    - 行动 采取行动获取或损失

    - 情境 因环境引发的动机


    动机不只是为改变或原动行为，在福格行为模型中，3要素缺失，则行为是不可能预视或不可靠的，动机最强，行动才更有成效到目标。


    ## 微习惯三步步骤：

    错误点 Anchor

    行为Behavior

    庆祝Celebration


    1. 找到一个你习惯的日常行为，锚定它，例如刷个牙

    2. 日常习惯后，添加一个新行为，比如运动一个短小的动作

    3. 新建立行动后，马上给出奖励以强化行为习惯，设置奖励的微调

    4. 即时反馈，常规化的行为需被确认反馈，任何结果来都可以获得正向的反馈，以此形成 "我做到了" 之类的感受


    ## 要素二：能力


    - 人物 提升技能

    - 行动 针对行动具体而微小

    - 情境 获取工具和资源


    此段涉及拆解的方法，教导用户要测试，也能减少行为阻力。设计行动时：选择一个非常小（微小），明确简单，承担低成本，NECI，引导和简化进程，


    ## 要素三：触发


    - 人物 通知自己

    - 行动 避免重复

    - 情境 提供时机

    提供线索


    福格行为模型中，动机和能力是持续存在的，而触发是此即触发。

    人们会看到别人的行为，比如：司机自动反应，获得操作提示或提醒周期执行的事件；比如利用手机提醒，触发事件。行为信号。把行为作为日常的习惯，当提示，以此来提供或触发期望的行为，比如走到后，很多人在左办。


    ## 常见举例


    原本计划要做的事情，但却没有为什么？

    也许是你的行为可能因情况而改变，也已完全不重视。有些人有很强的动机却无行为，这叫损失行为，下行。

    有时行为发生是因时间因素减少，也许你的行为是因时间原因而减少；

    也有可能是因你正做其他事情而完全忘记了要做过去，例如她朋友出去散步，喝酒等。在这种情况下你的执行行为是没任何因只是少个触发点。


    ## 启发应用 INSPIRATION AND APPLICATION


    ## 想而可能也不动


    当动机时，既可推动行为产生，行动将为；如果动机不足或能力不足，则行为不会发生。即缺乏能力，缺少动机，无法行动。


    ## 能而想也不动


    无论是动机的缺失，或者能力不足，都会导致行为的缺失。即行为的触发时，正视动机不足的信号，防止产生。

    当行为被触发前，行动者处于 wait 等待，忙碌，行为图被控制。这时，提升动机和能力。


    ## 想和能力俱备，但没有触发也不动


    福格行为模型在设计产品时，用户通过日常体验，一次行为的成功会产生随后行为。

    设计中，需要有动机和能力触发，触发行为。

    建立行为后，信号可被强化。后续行为通过信号被触发，触发信号，行为行为的产生。

    每次行动产生之后，之后的反馈。


    总结：当我们理解和掌握了福格行为模型，就可以在产品设计中做出现友并具有有效性的行为设计，也可以用改变自己的行为和习惯，逆转自己的人生。


    # 53. 反熵增思维模型


    我们希望能以不同的方式去思考问题，以此来应对这个瞬息万变的世界，因此我们将前“视觉语言”翻译出来，为大家提供解决问题的可视化思维公式。


    熵是一种测量在动力学方面不能做功的能量总数，熵亦被用于计算一个系统中的失序现象，即一个系统的混乱无序程度，一个系统越混乱、越无序，那么熵值就越大，越有序，熵值就越小。由牛顿第二定律可以推导出，一个封闭系统的内部，事物总是从有序趋向于无序，熵值在这个过程中是不断增加的，这也就是物理学上所说的“熵增定律”。反熵增就是通过一定的方案措施让体系从无序的状态转变成为有序的状态，通过构建耗散结构（持续做功）和避免路径依赖（保持开放系统）来实现从无序到有序的过程。


    ## 模型结构 MODEL STRUCTURE


    entropy increase

    熵增

    熵值在不断增加

    熵值在不断减少

    熵减

    entropy reduce

    反熵增


    ## 有序态


    ## 无序态


    ## 由熵增定律可推导出


    没有外部能量输入的封闭系统总是趋向于越混乱


    让一个系统变得更有序前提是必须有外部能量的输入


    当一个系统（或部分）变得更加有序，必然另一系统（或部分）变得更加无序，而且无序的增加程度将超过有序的增加程度


