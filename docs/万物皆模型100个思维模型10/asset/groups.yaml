    谨慎帽\n+ 创意 | 创新\n创新帽\n\n## 如何应用\n\n### 多维思考模型\n\n替身是把我们操作问题的角度划分为五部分，多维思考实际上包含这五大部分，并且将视角移到了时间和空间、物理与系统等方面纳入的探索，目的在于帮助我们看清这个世界同时帮助我们做出最好的决策。\n\
