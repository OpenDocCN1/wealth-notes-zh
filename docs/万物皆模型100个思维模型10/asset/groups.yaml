    # 83. 长短板理论思维模型


    我们应该应以不同的方式思考问题，以此来应对这个纷繁万变的世界。因此我们请人工智能通过“做戏言语”描述出来，为大家提供解决问题的可能性思维公式。


    木桶理论也称木桶原理或短板理论，短板理论即一个水桶无论有多高，其盛水的高度取决于其中最低的那块木板。长板理论即木桶最长的木板决定了其特质与优势，在一个小池围内成为制高点；对组织而言，凭藉其鲜明的特色，就能跳出大家集的游戏规则。按照德鲁克的话说，就是“Build
    your performance on strength, not weakness”(把你的表现建立在优势上，而不是劣势上) 不知认为：短板向内，即反思发现；长板向外，即主动成长。两者对立统一、缺一不可。其次不可忽视系统本身的存在，两者均属于系统中的两个关键因子。孙子曰：“先为不可胜，以待敌之可胜”。


