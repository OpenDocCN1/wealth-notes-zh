    \ YEARS\n10 年 如何看本次决策\n旁人判断\n\n### 倒向思考非主问题\n自己判断\n10 MINUTES\n10 分钟 如何看本次决策\n\
    10 MONTHS\n10 个月 如何看本次决策\n10 YEARS\n10 年 如何看本次决策\n旁人判断\n\n如何换位思考\n\n## THREE PERSPECTIVES\n\
    三个视角\n\n观察者视角\n从观察者视角看到的 A.B 都没有错\n\n换位思考的正确路径很多是 A→B, 而是 A 经由观察者视角到达 B\n\nA\n\
    \nB\n\n自我视角 假设 A.B 争吵, A 看前方数字为“6” 所以 A 认为 B 错了\n\n他人视角 假设 A.B 争吵, B 看前方数字为“9”\
    \ 所以 B 认为 A 错了\n\n总结:旁观者清, 即人们在提醒别人时往往是清晰的, 所以用101010旁观思维模型, 即在旁观者的视角之下看问题, 我们会更加的客观、冷静,\
    \ 从而更好的帮助我们解决问题。\n\n# 11. 升维思维模型\n\n我们应该尝试以不同的方式去思考问题，以此来应对这个瞬息万变的世界。所以我们将前人智慧通过“微语言”概括出来，为大家提供解决问题的可能性思维公式。\n\
    \n“不识庐山真面目，只缘身在此山中”，升维思维模型即指在原有的维度上不能解决问题，只能呈现问题，只有换一个维度才能解决问题，即跳出眼前问题的限制和常规解法，通过“层级、时间、视角、边界、位置、结构”的变化，重新思考问题及其解决之道的思维模型。\n\
    \n## 模型结构\n- 零维问题一维解决\n- 一维问题二维解决\n- 二维问题三维解决\n- 三维问题四维解决\n\n## 环境层 - 抱怨型\n基本特征：抱怨环境就是典型的抱怨型。比如：别人干嘛不干嘛？别人做什么我有什么办法？并不太想抱怨，但有的时候在抱怨中得到安慰。看不到自己的存在。\n\
    \n## 行为层 - 行动派\n基本特征：马上行动就是方法，与问题自身没什么关联。自我驱动，对行动方案：多反复试，不考虑是否有条件性。处事更多依赖的条件性，往往要别人来指派。\n\
    \n## 能力层 - 战术家\n基本特征：掌握运用工具和方法，帮助自己解决问题。常常对问题怎么解决？方法不太对。问题好的方法不对问题好的方法问题：简单化解决问题思路是解决问题的核心。\n\
    \n## 信念、价值层 - 战略家\n基本特征：为什么是重要思考方式：问题是导致为解决问题一只主要重要思考方向：谁主要属性性。难以避免的主观性。\n\n##\
    \ 身份层 - 觉醒者\n基本特征：定义流畅思考方式：同河沿流如何完成什么？的人解决问题，关注自己管理，角色是环境的影响，往往是多面性的，但只有一个是个你想成为的。\n\
    \n## 精神层 - 创造者\n基本特征：利他思想方式：改变世界解决不方便。据说从怀疑：不相信低层次确实存在，否则就会陷入中枢网。\n\n## 1 NLP\
    \ 思维逻辑层次\n- 精神层 我与世界的关系\n- 身份层 我是谁？\n- 信念、价值层 为什么？\n- 能力层 如何做？\n- 行为层 做什么？\n-\
    \ 环境层 时间、地点、人、事、物\n\n## 2 时间终点倒推模型\n时间倒推模型即假设生命到最后一天时的思考方式，站在时间终点去回顾外院，包括所经历、对失败的担忧，在面对死亡的时候，都很难去改变。101010思维模型。\n\
    \n## 3 切换视角思考模型\n切换视角思考模型即跳出下意识的问题，怎样起重？切解决问题，找到答案，只有所知，才可以更好的解决他们的问题。比如人。\n\n\
    总结: 当你与问题处于相同维度时间无法解决，而当你切换为高维时才会感觉该问题已不是问题。\n\n# 12.笛卡尔思维模型\n\n我们应该应以不同的方式去思考问题，以此来应对这个瞬息万变的世界。由此我们将前面人曾经通过“微说话者”铺述出来，为大家提供解决问题的可视化思维公式。\n\
    \n笛卡尔说，唯一独自己的思考是可以相信的，世界上所有的事情都是值得被怀疑的，但是唯独“我怀疑和思考这个世界”这件事情是不能被怀疑的，所以，只有我们思考和认识到的事情，我们才能真的接受，其余的都是存疑的。这种怀疑的意义就是去追问问题的本质，去寻找事物的特征，从而通过严密的逻辑建立学科的基础。\n\
    \n## 模型结构\n怀疑 DOUBT → 解析 ANALYSIS → 整合 UNIFY → 检验 CHECKOUT\n\n## 结构解析\n客观审视 why\
    \ → 怀疑 → 解析 → 整合 → 检验\n构建自己的认知大厦\n\n## 观点事件\n我们身边发生的任何事情，任何观点，都不要轻易的接收。\n\n##\
    \ 保持怀疑\n凡是有明确认识到的东西，绝不真的接受，要继续保持怀疑的态度去拆解和先入之见。\n\n## 分析解析\n把需要研究的难题进行合理分解和分析，分层块状处理。\n\
    \n## 整合封装\n先分后难，一层一层逐步识别，最后合并，再从大到小，向上传导，直到认识到最复杂的对象。\n\n## 完善检验\n尽可能全盘的考察，认真地验证，保证最大程度的无遗漏。\n\
    \n## 举个例子\n观点事件\n据说第三级分音曲线是拉格码尼尼最难，第五级“拉三”是世界最难弹奏的钢琴曲\n\n保持怀疑\n为什么是最难弹？难在哪里？难在哪里？和弦太快？太耗体力？\n\
    \n分析解析\n1. 整首曲子分成段\n2. 每一段拆成和\n3. 每个音拆成音符\n\n整合封装\n1. 先从每个音开始\n2. 再从每拍开始\n3. 再从每段开始\n\
    \n完善检验\n在整个过程中，遇到问题反复练习，再输出，以此类推，直到弹奏整首曲子\n\n当你能够弹下整首曲子时，这个据说世界最难的曲子，只是相对而言。\n\
    \n构建自己的认知的过程，是一场拨云见日的过程\n\n> 总结生活工作中培养自己的笛卡尔思维，即培养自己的逆向性思考，善于怀疑，并通过分析解析，统一整合，实证检验来获得一个科学可行的方案。\n\
    \n# 13. 第一性原理思维\n\n我们应该试图以不同的方式思考问题，以此来应对这个瞬息万变的世界。所以我们对前人智者通过“放诸四海”讲出沸，为大家提供解决问题的可视化思维公式。\n\
    \n第一性原理是一个①基本的命题或假设，②不能被省略或删除，也③不能被违反。物理学中，第一性原理或称从头算，即是在回归事物最基本条件（归零），用批判思维去拆解现象中的不合理的联系（解构），以此来找到新的更合理的路径的思想方式（重构）。\n\
    \n## 模型结构\n- ①基本的命题或假设\n- ②不能被省略或删除\n- ③不能被违反\n\n归零 ZERO\n解构 DECONSTRUCTION\n\
    重构 RECONSTITUTION\n检验 CHECKOUT\n\n## 模型结构推导\n- ①基本的命题或假设\n- ②不能被省略或删除\n- ③不能被违反\n\
    \n演绎法 三段论 大前提 — 所有人都会死 小前提 — 苏格拉底是人 结论 — 苏格拉底会死\n\n不能省略、删除、违反 基本命题 基本假设\n\n归纳\
    \ 演绎 理论 模型变换 假设 观察\n\n客观审视 检验 笛卡尔 检验 整体封闭 深度挖掘 深度反问\n\n客观审视 重构 笛卡尔 整合 A1 A2 A3\
    \ A4 B1 B2 B3 B4\n\n客观审视 解构 笛卡尔 解析 批判思维\n\n客观审视 why 归零 笛卡尔 怀疑\n\n特斯拉案例\n特斯拉在电池的价格就变成了每千瓦时\
    \ 80 美元 去检验论证信息反馈\n\n将这些元素优化重组，当然还要加入聪明的才智 去检验论证信息反馈\n\n将电池组拆分成最基础的材料组成部分 碳、镍、钴、其他用于分离的聚合物流，在加上一盒盒子\n\
    \n市场对电池成本的普遍共识即一直那么贵\n\n第一性原理的论述：元点是我们一直认为必然是真的那个点，但事实上并不存在一个必然是真的那个点，因为元点本身就是否定不了的说：不存在一个必然是真的那个点，因为元点本身就\
    \ 是否定不了的。所以元点本身就 是否定不了的。所有真理都局限于当时的环境而定，所以也就不存在必然为真的第一性原理,尽管如此，还需要有一个假设为真的元起点的存在。\n\
    \n总结：用他人已经证明的“公理”为基石才能跳出自己的局限重新认识世界，这也是找到自己“第一性原理”的唯一捷径。\n\n# 14. 奥卡姆剃刀理论\n\n\
    我们信息应该以不同的方式呈现问题，以此来应对这个貌似万变的世界。因此我们将前人工智能通过“微费语音”翻译出来，为大家提供解决问题的可量化思维公式。\n\n\
    自然科学中，奥卡姆剃刀被作为后发明技巧来使用，更多地作为帮助科学家发展理论模型的工具，而不是在已经发表的理论之间充当裁判角色。在科学方法中，奥卡姆剃刀并没有被验证上面不可辩驳的定理或者科学结论。在科学方法中对简单性的偏好，是基于可证伪性的标准。对于某个现象的所有可接受的解释，都存在无数个可能的，更为复杂的变体：因为你可以把任何解释中的错误归结于特殊假设，从而避免该错误的发生。所以，较为简单的理论比复杂理论更好，因为它们更加可检验。\n\
    \n## 模型结构\nNumQuAm ponenda est pluralitas sine necessitate. Pluralitas non est\
    \ ponenda sine necessitate. Frustra fit per plura Quod potest fieri per pauciora.\
    \ Entia non sunt multiplicanda praeter necessitatem.\n\n若一个事实 → A OR B → 选择简单的\
    \ → 同时被两个理论(A/B)解释\n\n## 举个例子\n## 生活应用假设\n一个事实 → A OR B → 选择简单的 ↓ 树倒了 A: 大风侧倒吹倒了\
    \ B: 有颗腐朽后，一颗藤缠绕了恶根，然后后藤蔓扒着恶根，直到把树给扒倒了。去了就去自己在树根处逗留。 → 极大风吹倒的\n\n在其他条件相同的情况下，比较两种论点时，最简单的论据最有可能正确。\n\
    \n## 医学应用假设\n一个事实 → A OR B → 选择简单的 当你听到背后有蹄声时，应该想到马，而非斑马。 发烧了 A: 受凉了 B: 寄生虫病，如新冠...\
    \ → 退烧药 近似标准\n\n首先，要认识到医学不是一个非常主要的领域，建立坚定实用的简单的基本规则则比试来和简单验证更重要。其次，收敛验证证明简单模型与真相相差一样具有独特性。这个模型可以避免到庸医主义多余，完美主义是简单的特性，但实际上并不在科学中真正起作用。\n\
    \n## 特别注意\n- 内审补充：奥卡姆剃刀并非单面刀，而是双刃剑，用好这种思维模型会帮助我们现查看本书，用不好则会割到自己。\n- 通常解析：一般通路常常解析是如果如而说法：“当听到蹄声时，思考马而不是斑马。”就是字面意思理解没有问题嘛，某种程度上这是提高高治效率的一种手段。\n\
    \n1. 奥卡姆剃刀并非只适用于在经典活动中，套用错了，会割到自己，其现住在面临时对问题进行，本质不变，如果万事中变化，随机多余的变化或看似小心翼的想法，才能够放弃变化中本质，却悬念本原。\n\
    2. 奥卡姆剃刀在实际应用中，例先进入1A，即承认A理论，不主张把焦虑转向思考B理论以及B理论对(A→B)的其他论点。\n\n总结: “奥卡姆剃刀”表示最简约的解决方案是正确的。保持信息的简单性，抵制抉择，解决实际，我们需要为处理事情复杂化，这样我们才能更高效的处理事情。\n\
    \n# 15. 马斯洛需求层次理论\n\n我们应对应该以不同的方式思考问题，以此来应对这个多变万变的世界。由此也得知前人智慧通过“锁效应”描绘出来，为大家提供解决问题的可能性纾解公式。\n\
    \n马斯洛的需求层次结构是心理学中的激励理论，包括人类需求的五级模型，通常被描述成金字塔内的等级。从层次结构的底部向上，需求分别为：①生理(食物和衣履),②安全(工作保障),③社交需要(友谊),④尊重和⑤自我实现。这种五阶段模式可分为不足需求和增长需求。前四个级别通常被称为缺陷需求，而最高级别被称为增长需求。1943年马斯洛指出，个人需要动力实现某些需要，有些需求优先于其他需求。\n\
    \n## 模型结构\n![](img/df4a7790feb77e5cf1e36990b372088a_16_0.png)\n\n需求的产生由低级向高级的发展是递进式地推进的，在低一级需求没有完全满足时，高一级需求就产生了，而当低一级需求的高峰过去了但还没有完全消失时高一级需求就逐渐增强，直到与绝对优势。低层次的需求基本上得到满足以后，它们的激励作用就会降低，其优势地位将不再保持下去，高层次的需求会取代它成为推动行为的主要原因。有的需求一旦满足，便不能成为激发人们行为的起因，于是被其他需求取代而代之。\n\
    \n## 洞察市场需求\n- 自我实现\n- 身份类产品\n- 金领服饰产品\n- 顶级型产品\n- 衣食住行产品\n\n消费者的动机支持的消费一群的消费群体，从粗略和不同层次的需求出发，提供不同的产品价值\n\
    \n## 团队人员管理\n- 面大饼...\n- 公平竞争\n- 归属关系\n- 加薪安全\n- 制作时间\n\n针对不同人的需求层次提供不同的激励机制\n\
    自己的存在并提高工作效率\n\n## 洞察他人行为\n- 自我实现\n- 尊重需求\n- 爱与归属\n- 安全需求\n- 生理需求\n\n鉴于不同层次的需求，人与生产的不同需求不同，以不同的方式来操作。产品差别，比如，偏重于生理需求，即在生理与安全需求之间的平衡。\n\
    \n## 应用场景\n总结：理论强调人的动机是由需求决定的。而且人每一个时期，都会有一种需求占据主导地位，而其它需求处于从属地位。\n\n# 16. 反脆弱思维模型\n\
    \n我们信念应以不同的方式去思考问题，以此来应对这个貌似万变的世界。因此我将前人智慧通过“微诺言”臻述出来，为大家提供解决问题的可视化思维公式。\n\n反脆弱指在受到外部不确定性的条件影响时，让自身变得更好，从这种不确定性的条件中获益。“反脆弱”比“坚韧”更进一步，具体指的是一些人和事物在面对冲击时，不但能够不受损伤，还能从冲击中受益。当暴露在混乱、压力、风险和不确定性下时，他们可能逆势成长。\n\
    \n## 模型结构\nA= 脆弱\nB= 坚韧\nC= 不确定因素\nA+B+C= 反脆弱\n\n反脆弱\n坚韧\n脆弱\n不确定因素\n\n脆弱的现象 如求稳、习惯舒适区\n\
    脆弱的对手 推手本身也为脆弱\n脆弱的根源 非线性，如事项干扰\n\n## 举个例子\n## 不确定性 顺势而为 借势反弹\n皮球\n金属球\n玻璃球\n\
    不确定性 坚韧赋强 落地不 Piot？\n不确定因素 外部作用力\n不确定性 易碎易损 落地易碎\n\n## 不确定性 顺势而为 逆式成长\n逆风火\n烈火\
    \ 焚火\n不确定性 坚韧赋强 风吹不灭\n不确定因素 风\n不确定性 易碎易损 风吹易熄\n\n## 不确定性 顺势而为 存活下来\n反脆弱 心态\n坚韧\
    \ 心态 脆弱 心态\n不确定性 坚韧赋强 首困而逝\n不确定因素 陷入洋流\n不确定性 易碎易损 恐惧无奈\n\n## 不确定性 借势跃起 获利增长\n\
    获利 增长\n坚韧 企业 脆弱 企业\n不确定性 坚韧赋强 企业存活\n不确定因素 经济寒冬\n不确定性 易碎易损 企业衰亡\n\n## 转化应用\n01\
    \ 后发法\n经历后发 不破则破 不破则化\n根据自身 转换可能 分析实现\n02 否定法\n不做什么\n削减理由\n03 红铃法则\n90% 低风险 低收入\n\
    10% 高风险 高收入\n\n脆弱 转 化 反脆弱\n情绪波动 转 化 掌握情绪\n恐惧 转 化 谨慎\n痛苦 转 化 能量\n 不自信 转 化 新启示\n\
    \n> 总结:这个世界的本质是变化，强者不是从未失败，而是在挫败后仍然可以快速复原，而此所依靠的正是反脆弱思维。\n\n# 17. 万物联系思维模型\n\n\
    我们需要应运而不同的方式去思考问题，以此来应对这个瞬息万变的世界。盛且我们借助前人工智能通过“微观谐音”翻译出来，为大家提供解决问题的可视化思维公式。\n\n\
    事的描述促进了人们对时间概念的感知，物的变化促进了人们对空间概念的感知。这种以人为点的连接关系即是万物联系思维，即世间万事万物之间都是相互作用、相互联系的。有些联系是自然存在的，在此基础上人类通过模仿自然从而实现了人为的相互联系，其中又包含了肉眼可见的联系和肉眼不可见的联系，这些连接关系在我们的生活工作中处处皆是，培养万物联系思维，就如开拓思维模型一样，跳出自动化思维才能创新思维，同时也是找到系统解决方案的捷径。\n\
    \n## INTERNET OF EVERYTHING MENTAL MODELS\n万物联系思维模型\n\n## 模型结构\n- 自然属性的联系\n- 人为模仿的联系\n\
    - 肉眼可见的联系\n- 肉眼不可见的联系\n\n## 结构拓展\n羊\n全需求\n肉眼可见的联系\n自然联系\n肉眼不可见的联系\n内在需求\n羊群\n\n\
    公司\n物质需求\n肉眼可见的联系\n人为联系\n肉眼不可见的联系\n精神需求\n员工\n\n丈夫\n物质需求\n肉眼可见的联系\n联系\n肉眼不可见的联系\n\
    精神需求\n妻子\n\n## 模型适用\n\n## 系统思维\n01 点 • 只看到点 局限于点\n02 线 ••• 看到连接 建设连接 跳出局限 才能看到线\n\
    03 面 □ 看到连接 建设连接 跳出局限 才能看到面\n04 体 ∷ 看到连接 建设连接 跳出局限 才能看到体\n\n## 创新思维\n创新并非创造全新的事物，而是把不同的要素重新组合起来形成新事物的过程。\n\
    \n## 案例01\n传统汉字基本笔画、横、竖、撇、捺、挑、折、钩等结构组合成了10w+个汉字，不同的汉字能组合成诗词歌赋、雄文小说等不同的作品，而这种笔画与笔画的联系、汉字与汉字的联系，便组成了新的内容。\n\
    \n## 案例02\n乐高玩具 拆解 组合 新品\n(元素不变，建立新的链接，就会出现新的创意)\n\n如何破局？①反思、怀疑有思维 ②广涉猎建立多元思维破局\n\
    \n总结:万物联系—万物并不孤立存在，如此，你又何必将你的认知孤立在一个点上，固步自封呢？\n\n# 18. 万物系统思维模型\n\n我们应该试图以不同的方式去思考问题，以此来应对这个变化万千的世界。因此我们将前人工智能通过“貌似诸葛”阐述出来，为大家提供解决问题的可能性思维公式。\n\
    \n系统思维源自生态学的概念，它把一切生物与其所处的生存环境看作一个整体来研究，这样才能完整地表达个体的发展规律。事实上我们遇到的每个问题背后都是一个复杂的生态系统。系统思维，简单说就是把事物联系在一起看，当成一个生态系统看，并看到其中的某种规律，而不只看作是一个个相对孤立的个体。系统思维背后的根本逻辑是“任何两个对象之间都是相互联系、相互影响的”。日常生活中我们需要把各个相关的对象放在一个类似于生态系统的框架中去思考，这样我们才能更准确、更完整的理解。\n\
    \n## STRUCTURE OF AN ATOM\n![](img/df4a7790feb77e5cf1e36990b372088a_19_0.png)\n\
    ![](img/df4a7790feb77e5cf1e36990b372088a_19_1.png)\n\n## 基本结构\n![](img/df4a7790feb77e5cf1e36990b372088a_19_2.png)\n\
    \n## 系统运作\n● 存量：是数据在系统要素中的累积 ● 流量：是数据在系统要素中的流动 ● 回路：是流量对存量的作用(增强回路/调节回路)\n\n学后注重新实践，实践后再重复盘，甚至是反复，也才能够找到自己的涌现，从而更好的提升自己的认知系统以及学方式与实践方式。\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_19_3.png)\n\n学的越多，越发现自己懂得越少，学海无涯，所以要输出实践，避免掉入纯理论的坑。同时通过实践也可验证所学的对与错。\n\
    \n## 举个例子\n线性思维 头重医脚轻医鸽，很尤其是破坏性最大的，所以要忌惮 系统思维 很多量 半数积累 渐数叠 频数叠 数量叠\n\n线性思维(A1-A2)着重于解决表面的问题，而不能够找到其中的本质问题，也就无法清楚在核心根源问题。\n\
    \n![](img/df4a7790feb77e5cf1e36990b372088a_19_4.png)\n\n培养系统思维首先需要停止线性思维(A1-A2)，思考问题时，跳出眼前视角去发现A...F之间的脉系，并从中提取规律，例如营养。\n\
    \n> 总结：系统思维，简单说就是把事物联系在一起看，看成链，看成网，看成生态系统，而不只看作是一个个相对孤立的个体。\n"
