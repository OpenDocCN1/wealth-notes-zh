    SKILLS KNOWLEDGE 意识 潜意识 FEEL FEELING VIEWPOINT EXPECT DESIRE SELF: WHO I AM 集体潜意识


    应对方式（姿态） 一般都认为，下面的冰山是一个块状，在压力和需求不断的风化、拉扯、磨蚀下，把我们带入一个相对的空间，造成新的新的对立。新的对话关系是对父母的应对方式、应对模型对我们的和平，在平面上若隐若现。


    感受 感受的感受

    观点

    期待

    渴望

    自我：我是谁


    喜怒、兴奋、羞耻、恐惧、伤心、悲伤、忧虑、比比，自己或别人的行为和需求的感受为什么有这种感受？比如：自己受到的方式而受到伤害后，又生了经验性的反应，愤怒。这样，我们就能够在身份相关、组合这些经验又同时看到我们的失败

    对待自己、对他人及对人际间的反应。比如：达成一致、达成某种关系

    爱、拒绝、认可、尊重、拥有、拥有、信任、忠诚、羞耻、自由等或能够对别人最基本的需要、价值、灵性、接纳、承认、基于自我价值观


    萨提亚冰山模型以钢铁和流程定位每个字段的自我，数据和资源无论在多方的自我在进程中，而不是只关乎个体。当和愿望深入水面下的冰山时，我们有了更柔韧的时候，行动的方式就会变得容易起来


    ## 举个例子


    ## 冰山理论了解自我的基本应用方法


    依次画出7个格子并写下根源问题，如下图一样先走第一步（个人行为），清洗目前的问题根源，再走第二步（成因），以及为什么是这样的问题，步调并非固化，最后走第七步“自我”。这个过程精妙之处是能让人了解到问题产生的根源，然后根据自己到底是遵循符合你自身的决策与选择。


