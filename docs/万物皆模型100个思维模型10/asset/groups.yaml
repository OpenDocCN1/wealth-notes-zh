    \n## 特别注意\n- 内审补充：奥卡姆剃刀并非单面刀，而是双刃剑，用好这种思维模型会帮助我们现查看本书，用不好则会割到自己。\n- 通常解析：一般通路常常解析是如果如而说法：“当听到蹄声时，思考马而不是斑马。”就是字面意思理解没有问题嘛，某种程度上这是提高高治效率的一种手段。\n\
