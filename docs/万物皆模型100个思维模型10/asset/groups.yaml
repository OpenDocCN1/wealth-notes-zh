    80% 啤酒饮料消费者的责任。因为他们的消费量只占 20%,同时当有一家公司发现自己 80% 的利润来自 20% 的顾客时,该制造商就会把 20% 的顾客盈利扩展到其它方面。也就是说,把注意力平均分散给所有的顾客更容易,也更合理。再者如果公司发现
    80% 的利润来源于 20% 的产品,那么该家公司应该全力来销售那些高利润的产品。


    复利模型测算，努力就机会收获,好的一个比例如下：1.03^365=1 如果你不进步,那么你会原地踏步 1.01^365=37.8 如果你每天进步一点点,一年后你会达到“1”
    0.99^365=0.03 如果你每天退步一点点,一年后你会趋小“1” 但是如果这个努力是 80% 的努力,那么换来的则是 20% 的结果。


    二八法则对我们的自身发展有着重要的现实意义：学会取舍将时间和精力花在最要事上，学会合理安排一个人的时间和精力都是非常有限的，要想做到“事事都好”几乎是不可能的，要学会合理地分配时间和精力，要想面面俱到还不如重点突破,把
    80% 的资源花在能出结果极强的 20% 的方面,这 20% 的方面又能带动其余 80% 的发展。


