    混沌指混乱而无秩序的状态，哲学中混沌指虚空，或者没有结构的均匀状态。其三个关键要素：一、对初始条件的敏感依赖性；二、临界水平，这里是非线性事件的发生点；三、分形维。它表明有序和无序的统一。秩序指有条理、不混乱的状态，在自然进程和社会进程中都存在着看似程度的一致性、连续性和确定性。如自然秩序中的日出日落，月亏月盈等；社会秩序中的社会进步、社会分裂到统一等。混沌与秩序思维即暗示我们对两者关系的思考与启示。


