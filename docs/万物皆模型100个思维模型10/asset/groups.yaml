    \n## 启发应用\n\n## 不同空间、同一时间思考\n\n不同空间同一时间(同时)可以根据行业的发展现状来判断，衡量未来。比如美国的行业已经成熟，中国的行业刚刚起步等。或者不发展的行业...所以可以正确地生产，可以用时光机的思维导向，产品的开发与产品定义。\n\
