    0。利益分配格局决定无主猪的理性选择——博弈二：如果去跑腿吃，小猪怎么想？去吃，实得 1，不去跑，实得 4。做二：如小猪等待，小猪怎么选择？去吃实得 -1，不去跑，实得
    0。所以，对小猪而言，它无论大猪是否跑还是不跑，小猪对的最好选择就是等待既然是等待就吃。也就是说对于猪圈的竞争，这个策略是纳什均衡。大猪剩下来了然后等待，等待一块也没有不跑
