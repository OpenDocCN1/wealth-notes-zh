    # 20.卡尼曼双系统理论


    我们应该尝试以不同的方式思考问题，以此来适应这个多变万象的世界。因为我们前面人智睿通过“貌似语言”推出出来，为大家提供解决问题的可能化思维公式。


    大脑有无法克服的结构性缺陷，你可以理解为进化的副产物。大脑的目标是求存而非求知，对于外界的环境。符合最小作用力原理，能不动脑筋不动脑。卡尼曼双系统思维模型重点讲述人们的大脑如何在直觉和理性之间进行选择，如何做出判断，如何充分利用与智力无关的理性进行重大的选择。如果了解我们的大脑，并合理的使用，才能更好的帮助我们在面对问题时更好的做出选择。


    # 基本结构 THE 2 SYSTEMS


    # 系统1—快思考 System 1-Fast Thinking


    # 系统2—慢思考 System 2-Slow Thinking


    # 结构剖析


    # 快 System 1-Fast Thinking


    # System 2-Slow Thinking 慢


    系统1 (默认模式) 直觉本能 百分之95


    +   - 持续扫描我们的环境

    - 速度快但较容易出错

    - 通过快捷键轻松工作


    系统1的运行是无意识且快速的，不怎么费脑力，没有戒心，完全处于自主控制状态。


    +   - 懒惰的

    - 缓慢的

    - 演绎的

    - 基于规则非经验

    - 不容易出错

    - 耗费资源的

    - 辩证不济的

    - 深度熟虑的

    - 理性推理的

    - 逻辑的

    - 结构化


    系统2 (备用模式) 理性思考 百分之5


    +   - 用于特定问题 仅在必要时使用

    - 需要努力分析推理 解决复杂问题锻炼自我控制

    - 速度慢但很可靠


    系统2 将注意力和转移到需要费力的脑活动上来，例如复杂的计算。系统2的行动遵循与行为、逻辑和专注等主要属性很相关。


    # 案例参考


    经验和记忆作为 判定断依据


    确定两件物品到近距离 确定突然出现的声音 将短语“画面和”外壳完全 看到恐怖画面后做出外部的表情 察觉空气中的不同气味 回答2+2=? 读大字报黑字上的字
    在繁忙的道路上搜索行车 下象棋时看出下一步好棋 理解简单的句子


    赛跑时随时做好起跑准备 关注游戏园里的小丑 在一次朋友的聚会里关注某个人的声音 找到某例白头发的妇女 保持大脑记忆，判断声音是否表达惊喜 保持大步快的步行速度
    观察自己在社交场合的做法是否得体 统计出某中文域名 a 的出现次数 告诉别人你的电话号码 比较两台洗衣机的总体功效


    大脑分析解决问题 19×25


    # 应用方法


    +   01 自我提示假设失败

    02 旁观者纠正系统1的快思考

    03 系统1反应快但不耐久，有意中断，回归理性


    总结:放慢思考，主动开启系统2，对系统1理性检验，从而弥补系统的漏洞，减少直觉产生的偏见和错觉。'
