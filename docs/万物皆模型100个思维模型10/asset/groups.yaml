    # 30. 自催化思维模型


    我们尝试以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们将前人智慧通过“貌似谬言”翻讲出来，为大家提供解决问题的可视化思维公式。


    自催化是指不添加催化剂，而由反应产物起催化作用的反应。该类反应的特点是起初阶段反应速率较慢，随后反应速率逐渐加快，最后速率再次变慢。自催化反应是指反应物本身具有催化作用，能够加速或减慢反应的进行的一种反应，如火药热分解产物
    NO2 即可对该反应起到自催化作用；我们常接触到的白酒、醋糖的发酵也是典型的自催化反应。


    # 模型结构


    # 起始速率较慢，随后加快又变慢


