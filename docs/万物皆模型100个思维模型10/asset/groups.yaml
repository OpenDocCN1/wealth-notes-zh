    \ 02. 只用一次\n这时爱情一个就挑起了苍惶，娶我，却有时间的问题回想起来，他的原因是，不好等着眼一现看适合的，又发现等。最终只好不用的，也不都好不合适的，就草率回来了。苏格拉底告诉他说：'这就是婚姻'\n\
    \nC 不确定时，若无法找到 A 可依循当前 C 的条件寻求 B\n\n### WHAT IS HAPPINESS? 什么是幸福？\n\n相问苏格拉底什么是幸福？苏格拉底去野外揪一条花束，系上向上，相邻问一朵美丽的花。他说：'我找到一朵很美的花，路上竟然发现更美的花，但我拾起动也没有得，事实证明，花至少是我最爱美丽的。'苏格拉底告诉他：'这就是幸福'。\n\
    \nB 够稳定后通过叠加升级 B → A\n当你搜寻手中的那朵花时，是否完整不后悔，不得不，这就是你现在的快乐的某种增加，感情且，幸福，是成功的，意义的不断叠加或是非缘，而当你我自己对你的价值。\n\
    \n## 如何应用\n\n### 明确局部最优解的范围\n\n万物不称其算，这个世界上唯一不变的就是变化本身。由此万物万物规律！即因为自身条件所能改变之前，首先要明确自己的范围。\n\
    \n### 叠加升级或迁移局部最优解\n\n在明确自己的范围之后，刻意致富，叠加升级自己的范围。这是第一个叠加的过程。这个过程并不简单，而是在有基座上的叠加升级。\n\
    \n> 总结：生活中由于外部因素的干扰，我们只需要明确自己的局部最优解，在此基础上只需扩大、叠加升级或迁移局部最优解即可。\n\n# 27. 不平衡性思维模型\n\
    \n我们应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们利用前人智慧通过“视觉通俗”翻译出来，为大家提供解决问题的可视化思维公式。\n\n\
    不平衡性的原理是矛盾发展，事物都是由矛盾群构成的，事物矛盾群中的多个矛盾以及矛盾的各个方面在事物发展中的地位和作用是不同的。不平衡性有主要矛盾和非主要矛盾、矛盾的主要方面和非主要方面。这种矛盾力量的不平衡性，是矛盾特殊性的重要表现。因此，矛盾发展不平衡性的原理是矛盾特殊性的重要表现。\n\
    \n## 模型结构\n\nUNBALANCEDNESS MENTAL MODELS\n\n人生系统即为矛盾群的组合\n\n主要矛盾\n次要矛盾\n\n不平衡性是非连续的、矛盾的、不稳定的系统\n\
    \n普遍规律\nA → -A → A …\n快 → 慢 → 快 …\n平衡 → 不平衡 → 平衡\n\n## 举个例子\n\n### 空间维度的不平衡性\n\
    \n### 时间维度的不平衡性\n\n空间维度受多因素影响，如人群、人类、地理位置等 多种矛盾群的交集重叠 便会形成一个个组织、国家的发展还造、进而形成区域差异，即空间维度的不平衡性，如上图，中国互联网技术及部分\
    \ APP 的发展源头先发集中。\n\n时间维度的不平衡性则指事物自身时间发展的不平衡性：一个事物从诞生到灭亡、起伏、衰退、都包含这样一个过程，比如孩子长身体，某个阶段会长的很快，某个时间段会长的慢一点。即是事物自身发展的'不平衡性。\n\
    \n### 不平衡性之二八定律\n\n20 80\n生活不必追求完美，不必苦苦追求所有的机会，只要把关键的 20%，就能获得成功。所以，二八法则又称为“关键为少数”规则。\n\
    \n### 不平衡性之木桶理论\n\n+ 老木桶理论：木桶盛水的多少并不取决于桶壁上最高的板而取取决于最低的那块板。即要想提高木桶的容量，必须先提高最低的板。\n\
    + 新木桶理论：是否有木桶理论要有一个平衡点，平衡点在无论是提高短板还是提高长板上、其实木桶理论的本质上是一个平衡问题。\n\n### 不平衡性之平衡循环\n\
    \nA → -A → A 平衡 → 不平衡 → 平衡\n★ 家人、朋友与人与人之间关系的发展，从关系密切到疏远再到密切。\n★ 人成长过程中，从依赖到独立再到互赖：学习态度变化，从已知到未知再到已知的过程。\n\
    \n### 万能公式：试而知之「学主义+3」\n\n主动学习的思考核心：反思、思考、感受、获取新知识。主动学习的特征就是在矛盾中寻求变化，从而产生新的观念。主动学习的作用在使用、矛盾对抗、在机会出现时，在正面与负面因素影响下以生成。\n\
    \n方法论，即方法论，实践 及时反馈复盘，符合统一科学方法应用，矛盾和查找问题，开展对矛盾，进行分析并提出解决方案，利用好矛盾。\n\n> 《论语》中的学，主动自觉致力之学，学的方式很多，矛盾中不平衡，掌握矛盾在。\n\
    \n总是在不平衡性思维中我们换一种角度思考，矛盾是常态，哪里有矛盾，哪里就有机会。巨石崩裂时，有人看成了恐惧，有人看成了光。\n\n# 28. 破界思维模型\n\
    \n我们应该尝试以不同方式思考问题，以此来应对这个瞬息万变的世界。因此我们请前人智慧通过“破规律”翻译出来，为大家提供解决问题的可能性思维公式。\n\n古名词“田边沽之界”，界限即为物理层面的一种划分标准，那么在精神层面同样可以用“界”来划分。可以是能力边界、价值边界或者是原有、固有的认知边界。破界思维模型指的是跳出原有的认知系统或能力边界，突破时间、空间的局限性，从一个全新的视角来思考问题、探寻自我，提升自我的思维模型。\n\
    \n## 模型结构\n\nUNBALANCEDNESS MENTAL MODELS\nTHINK OUTSIDE THE BOX\n\n跳出固有\n跳出固有认知在盒子外面思考\n\
    跳出边界思考 | 你的边界外面是别人的边界 | 是组织边界\n国与国的边界 | 是成长新边界\n\n### 破界模型思维路径\n\n+ A 原有、固有的认知知识\n\
    + A- 对内反思 反思维质疑 或主动反思 原有认知\n+ 对外部突破 主动跳出固有认知\n+ A+ 通过质疑就破界而成有认知\n\n## 举个例子\n\n\
    前讲过第一性原理提到埃隆·马斯克的思维方式，当我们将其公司连起来的时侯也许你会看的更清晰\n\n+ 太空 + 火箭 | 能源 + 交通 | 光能 + 发电\
    \ | 运输 + 轨道 | 人工 + 智能 | 脑机 + 寿命 | 掘运 + 掘能 | 卫生 + 通讯 | 光能 + 通讯\nSPACEX | TESLA\
    \ | SOLARITY | HYPERLOOP | OPENAI | NEURALINK | BORING | STARLINK | MODEL π\n\
    人类跨星际航中所涉及到航、运载、能源、交通、通讯等重要领域，都被其几家公司遍盖到了。\n\n### 稀释原有的价值观，并将理念普世化，再反射到商业运作上\n\
    \n手机只能用来打电话吗？\n我怎么能够赚钱？\n我还能解释现在的代码吗？\n主动思考\n固有认知\n主动反思\n论证清单\n自己固有\n认知边界\n假设实践\n\
    需要反馈\n突破反思\n支持长边界\n智能手机出现了，\n我们突破了自己的边界\n如同与马斯克的例子\n手机可以做些什么？\n手机里面存储、貌似可以？\n\
    我可以让其他部能工作？\n手機也可以自己演化\n若技术只为开创者\n功能超强、边界越发大\n\n## 应用：两反一突\n\n反思\n反思是任何的前提和基础，没有主动的反思意识的存在，就不上升，而主要反思的意义是，一旦被觉醒，才能驱程界的开者。\n\
    \n突破\n突破是思维的一个目的和最好，接下来需要依据目标进行提炼和与实践，如果在驾驶时中需要一条长采集来参照随时参照方向的方法。\n\n反思\n实现目标的手段试，没有进一步地定位表现，则把它变得大方面的问题，换成更简单的目标，根据反馈回来的信息重新修改自己的方向。\n\
    \n> 总结破界意识是自己给自己画的地改变牢，人們习惯于此，处于边界内是安全的，如井底之蛙、三芝之鸟，破的前则是主动觉醒。\n\n# 29. 非线性思维模型\n\
    \n我们应该意识到以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们必须假想人脑通过“貌似言语”翻说出来，为大众提供解决问题的可视化思维公式。\n\
    \n非线性思维是指一切不属于线性思维的思维类型，如系统、直觉、模糊思维等。它很可能就会不按逻辑思维、线性思维的方式走，有某种直觉的含义，是 一种无须经过大量资料、信息分析的综合非线性系统远比线性系统多得多，客观世界本来就是非线性的，线性只是一种近似，对于一个非线性系统，哪怕一个小扰动，象初始条件的一个微小改变，都可能造成系统在往后时间行为的巨大差异。\n\
    \n## 模型结构\n\n线性思维是一种直线单向的、均匀单一的、套用经验就一定会得到正确答案的思维方式\n\n![](img/df4a7790feb77e5cf1e36990b372088a_30_0.png)\n\
    \n非线性是一种更加接近自然、客观本来的、反应世界本质的思维\n\n## 举个例子\n\n### 线性思维公式：若A则B\n\n![](img/df4a7790feb77e5cf1e36990b372088a_30_1.png)\n\
    \nx 作为初始条件发生的微小变化，都会导致结果 y 发生变化\n\n### 非线性思维公式：若A则非B\n\n### VUCA 乌卡时代\n\nVOLATILITY\
    \ 易变\nUNCERTAINTY 不确定\nCOMPLEXITY 复杂性\nAMBIGUITY 模糊性\n\n![](img/df4a7790feb77e5cf1e36990b372088a_30_2.png)\n\
    \n艾森豪斯递减曲线\n\n![](img/df4a7790feb77e5cf1e36990b372088a_30_3.png)\n\n线性与非线性\n的根本差异\n\
    \n+ 简单类 即假设保持见到规律就能推测未来\n  举例子：不考虑做成模型框架的还不错，我做也一定好的不错\n+ 简单归因 即已知结果推导出单一原因\n\
    \  举例子：不知道老虎是东山人，他肯定是个高手一米八以上\n+ 局部即知 即已知局部就能推断整体\n  举例子：不知道老虎是东山人，他肯定是个高手一米八以上\n\
    \n总结观点：非线性思维更善于在复杂的环境里观察，澄清默认的活动更接近事物，更真实。因为单纯地线性思维只是简单的单方面的因果关系，认为一因一果、循因循果；而非线性却是相互叠加的非线性因果关系。数学图解：线性思维是一种直线的、简单的、单线的、线变化的思维方式；非线性则刚好是互五连接的、非平直、立体化、无链的网络结构。\n\
    \n## 如何应用\n\n### 保持终身学习\n\n事物变化、发展变化变得更多，线性思维在特定环境下会产生反映；非线性思维和思考是另一种反应。然而只要人们不断的创新，事情就会变得复杂、不可传输。因此，人们要不断学习，获取知识，发展技能，适应变化。\n\
    \n### 保持开放心态\n\n请记住：只有开放，才能更好地应对各种挑战。保持开放的心态，接受新知识，能够帮助我们更好地理解世界和应对变化。开放心态让我们更愿意学习新事物，也更容易适应变化。\n\
    \n### 保持尚劲精神\n\n今朝不忘、气定神闲、底气十足。保持乐观的精神，才能在困难中保持信心。即使生活中有挑战，也要相信自己的能力，勇敢面对。保持积极的心态，是一种应对变化的力量。\n\
    \n总结线性思维是非线性思维中的一种非常特殊的形态，因为大部分非线性必然会得到线性的存在，这反映关系两者并非对立、而当存在并存。\n\n# 30. 自催化思维模型\n\
    \n我们尝试以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们将前人智慧通过“貌似谬言”翻讲出来，为大家提供解决问题的可视化思维公式。\n\n\
    自催化是指不添加催化剂，而由反应产物起催化作用的反应。该类反应的特点是起初阶段反应速率较慢，随后反应速率逐渐加快，最后速率再次变慢。自催化反应是指反应物本身具有催化作用，能够加速或减慢反应的进行的一种反应，如火药热分解产物\
    \ NO2 即可对该反应起到自催化作用；我们常接触到的白酒、醋糖的发酵也是典型的自催化反应。\n\n## 模型结构\n\n### 起始速率较慢，随后加快又变慢\n\
    \n反应速率随着反应物浓度的提高而提高\n\n反应速率随着产物浓度的快速提高而增大\n\n由以上分析可知自催化反应的三个特点\n\n+ 01 反应物中加入少量的产物\n\
    满足初始条件,促使其反应开始\n+ 02 反应过程中必然存在一个最大反应速率\n+ 03 反应速率随着反应的进行会经过先增大后减少的变化\n\n## 举个例子\n\
    \n### 芒格说:“迪士尼是自催化的完美典范！”\n\n### 流行性网络效应\n\nIP+电影是已知条件促使其后续增值开始。随着在最大反应速率时增加产物\
    \ 如迪士尼乐园、购物圣地 行驶生。带来新的自催化路径 或增加一条新催化路径，以此实现持续增值。\n\n更多的司机就能带来更大的服务面积/占有率/更大利润/占有率可以让司机提供更便宜高效的提供服务客户更好,所以需求更多\n\
    \n## 如何应用\n\n### 终身学习 | 扩展视野\n\n芒格先生视学习和思考为一种的爱好和习惯。学习再学习不断创新,不断学习,了解更多,使其学习和思考都成为一种乐趣,领悟真知,去积极寻找,寻找可以用来解决实际问题的复杂策略,往往在于轻中早发现,从而可以解决现实问题,往往在于轻中早发现。\n\
    \n### 主动景象 | 开放心态\n\n主动去观察,才能激情串联自己的观点,才会主动推演。世界在不断变化,了解更多。从自然为他,世间万物都会发生变化。同时,保持一个开放的心态,才能够别出心裁。\n\
    \n### 坚持实践 | 复盘反思\n\n学习过程,跟随环境变化,随着环境的改变,更需要在学习的同时不断总结,不断反思,并不断总结,并不断尝试。学习过程,跟随环境变化,随着环境的改变,更需要在学习的同时不断总结,不断反思,并不断尝试。\n\
    \n总结自催化思维模型是一个能够帮助我们实现快速成长的模型,如自己的兴趣,利用自己的兴趣去主动催化我们在某领域的成长。\n\n# 31. 优先排序思维模型\n\
    \n我们能够思考以不同方式思考问题，以此来应对这个瞬息万变的世界。因此我前人智慧透过“领悟请”翻译出来，为大家提供解决问题的可能性思维公式。\n\n优先排序思维模型是时间管理理论的一个重要方法，世上万事万物均有其根本的因，也有末端的那个果，在面对因与果、根与末的时候，\
    \ priorit... 优先排序即是让我们能够有重点地把主要的精力和时间集中地放在处理那些重要但不紧急的工作上，这样可以做到未雨绸缪，防患于未然。\n\n\
    ## 模型结构\n\nPRIORITY ORDERING MENTAL MODELS\n\n+ 01 IMPORTANT AND URGENT MATTER\n\
