    \n> 在一会议上,有一位女士要查理亚茨用一个词说出他的成功之道,茨格回答:理性! 艾格还说:\"如果你想成为一个理性的思想者,必须培养出跨越常规学科领域的头脑,必须跨学科学习,学习重学科的重要思维模型\"\
    。 \n\n总结:人类大脑运行疗愈的准则是“能不用脑,就不要脑, 须用脑时也不要脑”; 这是进化的结果! 尽管如此, 也不非如此。\n\n# 20.卡尼曼双系统理论\n\
    \n我们应该尝试以不同的方式思考问题，以此来适应这个多变万象的世界。因为我们前面人智睿通过“貌似语言”推出出来，为大家提供解决问题的可能化思维公式。\n\n\
    大脑有无法克服的结构性缺陷，你可以理解为进化的副产物。大脑的目标是求存而非求知，对于外界的环境。符合最小作用力原理，能不动脑筋不动脑。卡尼曼双系统思维模型重点讲述人们的大脑如何在直觉和理性之间进行选择，如何做出判断，如何充分利用与智力无关的理性进行重大的选择。如果了解我们的大脑，并合理的使用，才能更好的帮助我们在面对问题时更好的做出选择。\n\
    \n## 基本结构 THE 2 SYSTEMS\n\n## 系统1—快思考 System 1-Fast Thinking\n\n## 系统2—慢思考 System\
    \ 2-Slow Thinking\n\n## 结构剖析\n\n## 快 System 1-Fast Thinking\n\n## System 2-Slow\
    \ Thinking 慢\n\n系统1 (默认模式) 直觉本能 百分之95\n\n+   - 持续扫描我们的环境\n- 速度快但较容易出错\n- 通过快捷键轻松工作\n\
    \n系统1的运行是无意识且快速的，不怎么费脑力，没有戒心，完全处于自主控制状态。\n\n+   - 懒惰的\n- 缓慢的\n- 演绎的\n- 基于规则非经验\n\
    - 不容易出错\n- 耗费资源的\n- 辩证不济的\n- 深度熟虑的\n- 理性推理的\n- 逻辑的\n- 结构化\n\n系统2 (备用模式) 理性思考 百分之5\n\
    \n+   - 用于特定问题 仅在必要时使用\n- 需要努力分析推理 解决复杂问题锻炼自我控制\n- 速度慢但很可靠\n\n系统2 将注意力和转移到需要费力的脑活动上来，例如复杂的计算。系统2的行动遵循与行为、逻辑和专注等主要属性很相关。\n\
    \n## 案例参考\n\n经验和记忆作为 判定断依据\n\n确定两件物品到近距离 确定突然出现的声音 将短语“画面和”外壳完全 看到恐怖画面后做出外部的表情\
    \ 察觉空气中的不同气味 回答2+2=? 读大字报黑字上的字 在繁忙的道路上搜索行车 下象棋时看出下一步好棋 理解简单的句子\n\n赛跑时随时做好起跑准备\
    \ 关注游戏园里的小丑 在一次朋友的聚会里关注某个人的声音 找到某例白头发的妇女 保持大脑记忆，判断声音是否表达惊喜 保持大步快的步行速度 观察自己在社交场合的做法是否得体\
    \ 统计出某中文域名 a 的出现次数 告诉别人你的电话号码 比较两台洗衣机的总体功效\n\n大脑分析解决问题 19×25\n\n## 应用方法\n\n+ \
    \  01 自我提示假设失败\n02 旁观者纠正系统1的快思考\n03 系统1反应快但不耐久，有意中断，回归理性\n\n总结:放慢思考，主动开启系统2，对系统1理性检验，从而弥补系统的漏洞，减少直觉产生的偏见和错觉。\n\
    \n# 21. 冯诺依曼思维模型\n\n我们经常应该以不同的方式去思考问题，以此来对待这个系统万变的世界。因此我们将前面人类普遍通过“貌似奇据”翻出来，为大家提供解决问题的可视化公式。\n\
    \n冯诺依曼思维是将一个复杂问题拆解成一个可执行的简单单元，然后将简单的单元重新组合成具有某种意义指定属性的大问题。由以上定义可知，该模型具体包括两个部分，一是把复杂大问题拆解成一个个小细节；二是把一个个小细节组合成具有某种意义的大问题。\n\
    \n## 基本结构\n\n+   - 输入设备 将程序和数据送入计算机\n- 存储器 程序 | 数据\n- 处理单元 执行指令\n- 控制单元 指令执行的顺序\n\
    - 输出设备 将执行结果送出计算机外\n- 数据信号 → 控制信号\n\n键盘 | 鼠标 | 扫描仪\n\n存储器\n\n输出设备\n\n显示器 | 打印机\
    \ | 磁盘\n\n处理单元 ALU REG\n\n控制单元 PC\n\nCPU\n\n拆解\n\n重组\n\n## 拆分≠拆解\n\n## 拆分是将一个整体的不同部分单独拆分开\n\
    \n拆分公式 | 整体 = A + B + C + …\n\n## 拆解是将整体拆解成一个可执行的简单事情\n\n拆解公式 | 整体 = A × B × C\
    \ × …\n\n## 拆分≠拆解\n\n## 举例子\n\n![](img/df4a7790feb77e5cf1e36990b372088a_22_0.png)\n\
    \n游戏 = 主线关卡 + 竞技场 + 技能设计 + …\n\n物理层面的拆分，主要用于解决技术上复杂的事物\n\n## 举例子\n\n健康值 = 消化系统\
    \ × 呼吸系统 × 神经系统 × …\n\n销售额 = 顾客数量 × 转化率 × 客单价\n\n游戏 = 构架 × 体验 × 核心玩法 × 目标规划 ×\
    \ …\n\n拆解解决了分类的范围、方式、问题本质，根 本原因是动态而系统的，同时还要符合使用者的价值。\n\n系统层面的拆解，主要用于解决原理上复杂的事物\n\
    \n## 重新组合\n\n创新并不是创造全新的事物，而是把不同的系统要素重新组合起来形成新事物，新系统的过程。\n\n互联网 + = 互联网 + 传统行业\n\
    \n“互联网+”简要的说就是“互联网+传统行业”，固定制造业等的发展，利用互联网和传统行业相连，提高、改善互联网与传统行业结合，即两个不同系统的重新组合创新。\n\
    \n婴儿摇篮 = 玻璃盒子 + 恒温系统\n\n19世纪80年代初，波兰军官学L.S.蓝氏 非常流行地与4次在德国儿童一个在学 会会会的当先进，他们大多来自于物理生物于\
    \ 另一个系统结合的新型教具这一切。\n\n思维模型 = 模型概念 + 认知图形\n\n大多数所看到的思维模型图是介于如图基础 上用图形+文字的组合来形成概念认知\
    \ 这给读者。两者的数学的构建成事，就要从原 而表达的准备必须严格正比。\n\n总结:该模型的本质是“拆与组”，“拆”要拆解（找到问题本质），而非拆分。用错了“拆”，也就用错了“组”。\n\
    \n# 22.三层解释思维模型\n\n我们都应以不同的方式去思考问题，以此来对应这个瞬息万变的世界。因此我们将前人整理透过“感觉语言”筛出出来，为大家提供解决问题的可视化思维公式。\n\
    \n批判性思维的过程可以分为三个层次或水平：体验、解释和解析。但要记住，这种分类是人为的，只是为了重点突出批判性思维的过程。尽管分析处在思维过程的最高点，但三层模型是循环往复、不断变化的，有时人们为了进一步确认会从分析水平返回到经验水平，也会根据对新信息的分析重新修正原来的解释。人们决不会只有单纯的经验或分析。\n\
    \n## 模型结构\n\n经验层 Experience\n\n解释层 Interpretation\n\n分析层 Analysis\n\n循环往复 不断变化\n\
    \n经验层\n事物表面\n看山是山\n\n解释层\n事物左右\n看山不是山\n\n分析层\n目的 本质\n看山还是山\n\n## 结构拆解\n\n## 经验层\
    \ EXPERIENCE\n\n+   - 直接经验\n经验层是一个思维过程，我们只描述自己观察到的事物，而不是它可能是什么。\n- 间接经验\n\n##\
    \ 举例子\n\n+   01 在工作面谈中，我被拒绝了。\n02 当我表演开始时，马虎为我开门。\n03 在美国，克美人是合法进行。\n04 尽管黑人仅占美国人口的12.9%，但却占据因数量的45%。\n\
    05 在2004年的总统选举中，只有58.4%有资格的美国选民进行了投票，比例在18-25岁的年纪人中甚至更低，仅为41.9%。\n\n## 解释层 INTERPRETATION\n\
    \n+   - 依据事实\n解释层是第三个思维阶段，解释需要依据我们对事实的了解和它们是什么。\n- 偏离事实\n\n## 举例子\n\n+   01 我没有获得这份工作是因为我没有熟人。\n\
    02 马克是一个大男子主义者，他认为女性太弱小，自己开门合适。\n03 如果克美人认为这是违法的话，那也许是确定的不是道德。\n04 人们在印度中古继承地方的比例是因为黑人男性天生比白人男性更暴力。\n\
    05 美国年轻人在选举中不投票是因為他们對政治不感興趣\n\n## 分析层 ANALYSIS\n\n分析层\n\n+   - 审视自己\n分析层是第三个思维阶段，主要功能是审视自己与他人之间的解释。\n\
    - 审视他人\n\n## 举例子\n\n+   01 我没有得到这份工作，是因为我没有熟人，面试技能不足，还是没有达到这份工作所需要的条件？\n02 马克为我开门？目的是否在帮助？\n\
    03 为什么克美人看起来违法？是否存在某些情况，克美人也许可以被宽容？\n04 有没有证据表明黑人男性被拘留向更强？有没有可能是因为黑人男性比白人男性受到的歧视更多？有没有其他因素能够解释…男人因在印度中古继承地方？\n\
    05 为什么越来越多的美国人，尤其是年轻的美国人，不参加投票选举。联邦政府的选举票是不是应该该有的国家那样实施强制措施？会不会是感染的原因？\n\n## 抗拒\n\
    \n由于我们大多数人都需要证明自己是正确的，因此我们都要遵从一种模式来接收自己的“客观事实”和接受它，并把它推销给别人，它的实质为“适用的 becomes\
    \ 防御机制，这种机制过激化、冲动，避免不明确和加深分歧”。\n\n## 总结:该模型一个非常重要的点在于三层模型的循环往复和不断变化，任何模型都是如此，并非固定不变，切记。\n\
    \n# 23.损失规避思维模型\n\n我们懂得应该以不同方式思考问题，以此来应对这个瞬息万变的世界。因此我将前面套用“微视觉语言”翻译出来，为大家提供解决问题的可视化思维公式。\n\
    \n损失规避是人们在面对同样数量的收益和损失时，认为损失更加令他们难以忍受，又称损失厌恶。损失规避反映了人们的风险偏好是不一致的，当涉及的是收益时，人们表现为风险厌恶；当涉及的损失时，人们则表现为风险寻求。\n\
    \n## 模型结构\n\n## LOSS AVERSION MENTAL MODELS\n损失规避思维模型\n\n100S = 100S\n获得收益时产生的快乐\
    \ > 失去收益时带来的快乐\n人们获得损失时产生的痛苦，远大于获得收益时带来的快乐。\n\n## PLEASURE 快乐\nSMALL PLEASURE\
    \ 小乐趣\n\n## LOSS 损失\nGAIN 获得\n\n2~2.5\n损失带来的负效用是收益带来的正效用的2 ~ 2.5倍。\n\n## BIG PAIN\
    \ 大痛苦\nPAIN 痛苦\n\n损失规避思维模型提示我们在如何理问题，建议在自我身会出现损失规避心理的情形下，要很当心的避免过度避免大损失的进行，从而让决策更客观、准确。\n\
    \n## 应用例子\n\n## 01 1979年，心理学 Kahneman 和 Tversky，用实验验证了亚当·史密斯的观点，并将其现象命名为损失规避。具体的实验过程是：\n\
    \n+   - 第一组实验\n被实验体先行持有 1000 单位的现金。在基础上做出选择\nA.50%的概率将持有的现金增加为 2000\nB.100%的概率持有现有的现金金额为\
    \ 1500\n此实验中，被实验体的 16% 选择了 A, 64% 选择了 B\n\n+   - 第二组实验\n同被实验体先行持有 2000 单位的现金。在基础上做出选择\n\
    C.50%的概率将 1000 单位现金\nD.100%的概率损失 500 单位现金\n此实验中，同实验体的 69% 选择了 C, 31% 选择了 D\n\n\
    实验中，A选项和 C选项等同手中有现金1000若再获得1000单位现金，50% 的概率，并与 A选项同值，D能在手上获得现金1500, 100% 的概率，即B选项。结果显示：“虽然两项在经济上等价，但人们对损失的敏感度远高于对收益的敏感度，所以人们更倾向于避免损失而不是追求收益。”\n\
    不要过度选择亏损或不确定的情况，人们只想规避最大的自己感受到的痛苦。\n\n## 02\n\n损失规避 转换损失\n旧手机 旧手机\n打手机 打手机\n可惜\
    \ 可惜\n新手机 新手机\n保留旧手机 保留旧手机\n新手机 新手机\n低以旧换新\n回收旧机\n转为折扣\n分一半新\n新费用\n\n## 03\n\n\
    在医学与悲剧的对谈场景中，在做手术时对患者说明，对同一个患癌症进行下面的一个选项\n会计先生\n○手术的成功几率是 90%\n○手术失败的几率是 10%\n\
    本质上是一样的，但后者说法让人产生更强的抗拒或恐惧，会比\n前者让人更\n等待。\n\n## 如何规避\n\n+   01 决策时做数据分析，告诉更易获取确定的情况；\n\
    对自己和他人决策时，应可能通过理性分析来评估风险和收益，避免因损失规避而做出过度的保守决策。对个人而言，可能有一个问题，通过这种把“损失”变为“获得”来引导人做决策。\n\
    \n+   02 不看一时，看长远。\n股市当中短期视角很很重要，但长远来看，也可将风险分散。但在时间上需要谨慎，在时间上，风险会有所分散，在于股市波动过程中，上涨或下跌得失，随着时间推移，下跌时才，不会呈现短期最终亏损。\n\
    \n+   03 调整决策依据，做好最好的打算，降低期望值；\n从最终的决策考虑时，最好的打算，这时人们心理就会从“损失”变为“获得”。调整自己的期望值，同时降低期望值，也会让人实际的收益增加，从而知道“损失”变为“获得”。\n\
    \n> 总结我们处理问题，做决策时，要明白自身有损失规避心理的存在，然后有意识的克服免除大损失或避免的行为，从而让决策更客观、准确。\n\n# 24.替身决策思维模型\n\
    \n我们常常应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们前人智慧累积“貌似谬误”留出条，给大家提供解决问题的可能性思维公式。\n\n\
    替身指的是替别人的人，对本体而言，指替代本体的人。生活中则是模拟决策人所处的环境及其背景，去做决策的场景代入法，让替身有一种身临其境的感觉和思考过程，此时你就是决策者，你需要对这个决策负责责任和义务，也有相应的权利并为此做出决策。简言之替身决策思维就是站在他人的角度或换成特定角度去做决策的一种思维方式。\n\
    \n## 模型结构\n\n## SURROGATE DECISION MENTAL MODELS 替身决策思维模型\n\n替身 OR 分身 站在对方的角度思考问题\n\
    \n## 举个例子\n\n## 立场不同 少说多做\n\n立场不同，所处的环境不同，提供的值值不同，很多事情如果是一双见 况不妥结论，用替身思维模型（或称转换思维模型）换己所处岗。\n\
    \n收人将信将人告诉他出了事，只听大人吩咐，陆地反而反对和配合时反而不妥结论，换体制人设说设被说，都是很烦所以大声门时。\n\n设想对方清楚永远亲耳听见，我人说\
    \ 但是，只是为了帮您的毛绒到牛奶， 牛奶的口味，却好像没办法！ 听见这个声音很舒适的！\n\n## 懂得换位思考很重要\n\n同名于地的流动就会大加嘈杂和希系，某一年要聘请一位秘书，于是在几家报刊上刊登了招聘广告，结果应征的信件如雪片飞来。\n\
    \n秘书本身 A 秘书替身 B 拿破仑希尔\n\n我看到现在报上招聘秘书的广告， 我要非常努力准备这个职位，我今年夏天，年近学生毕业，我们希望能尽快说服你，\
    \ 一定能胜任乞丐。\n\n最后说：您只要投我广告一万元来给我，我就为您动员，所有相关的公司会一... 什么干，最后，秘书本是否还... 的时间就认识你了。\n\
    \n## 如何应用\n\n## NLP位置感知\n\n位置感知，在NLP心理上指的是，试着换个“位置”，多角度去思考问题，就会产生不同的想法和感受、态度。而这样的“位置产生观点”，称为“感知位置”。如下介绍五个感知位置：\n\
    \n+   ① 自我位置\n(1) 凡事以自我为核心，更关注自己的感受和感受。\n(2) 对自己和自己谈话，发怒，反感。\n反感和自我对立，而发出的性 反感和自我为出发点，对人也为人？\n\
    己，总是关心别人和意见。\n\n+   ② 对方位置\n(1) 把他人或他的为人他人看\n(2) 关心他人的感受，有同情心\n(3) 与对方的立场，这就是同理\n\
    心和和睦的行为\n在彼此的位置太长\n乎思考和处理自己的事情。\n\n+   ③ 抽离位置\n观看者处于中立、受观察、\n局外人其中立\n(2) 用来做客观平衡并做处理\n\
    性质的分析点\n(3) 让在事物中的人过分上\n性，或者人情味\n\n+   ④ 体系位置\n(1) 如果将事情的对立，并将其系统\n和他的关系作为合作作，并思考\n\
    被他感觉吗\n(2) 情况是包含一切的关系物\n(3) 决定最合适的人是恩情，注\n重集体或更完整生活的人\n\n+   ⑤ 宇宙位置\n(1) 超越时间和空间的限制与制\n\
    约，有神明般永恒恒稳定且脱\n光\n(2) 客观性的洞察的发展\n(3) 看作个人的人类人不食人间\n烟火，悲观乐观\n\nNLP 讲究灵活应变，对相同事物有多不相同观点，并对各种不同的观点予以尊重。灵活移动感知位置，有助于发展观点的弹性，善于移动感知位置，拥有多重观点，让人行动皆有理。因为各种不同的观点，互相补充互补，可以增加更多资讯，更好地处理，使人不致于陷入僵化或让思维的闭锁感。\n\
    \n+   请轮流坐在自己位置上\n这该自我尊重吗？\n请对待对方位置\n这个想法说明了什么？\n请在抽离位置\n这个位置有什么吗？\n请在体系位置\n这个观察到什么？\n\
    请在宇宙位置\n这个位置意味着什么？\n\n总结:替身决策在开拓思维、处理职场人际关系、生活困惑方面是一个极为好用的思维模型，结合NLP位置感知，去观测生活的不易。\n"
  mdcn: "\n# 19. 三脑理论思维模型\n\n我们应该能以不同的方式去思考问题，以此来应对这个变化万变的世界。否则我们将前人工智能通过“就是这样”甩出答案，为大众提供解决问题的可能性思维公式。\n\
    \n三脑理论 (Triune Brain Theory)，也称“脑的三位一体理论”、“三合一脑”，是美国国家精神卫生研究院神经学专家保罗·麦克里恩在 1970\
    \ 年提出的理论。该原理认识到大脑结构是进化的产物。人脑有三种物理脑系统，分别为爬行脑系统、情感脑系统、大脑皮层系统。三脑作为人类进化不同阶段的产物，就像三台互联的生物电脑，各自拥有独立的智能、主体、时空感与记忆。\n\
    \n## 基本结构\n\nNEOCORTEX(THE NEW BRAIN) RATIONAL THINKING\n新哺乳动物类动物脑(大脑皮层)-理性脑\n\
    \nLIMBIC BRAIN EMOTIONS\n古哺乳动物脑-情绪脑\n\nREPTILIAN(THE OLD BRAIN) DECISION MAKING\n\
    爬行动物脑-本能脑\n\n## 结构详细\n\nNEOCORTEX(THE NEW BRAIN) RATIONAL THINKING\n新哺乳动物类动物脑(大脑皮层)-理性脑\n\
    组成结构：左脑+右脑+皮层+神经元\n三脑位置:最外层(包裹重要脑)\n控制内容:思考、分析、预测、创造\n当年年龄:250万年 完全成熟:22岁后成熟\n\
    脑内占比:不足2成 意识层面是积极\n运行状态:极少使用, 响应速度慢且效率高,排斥很强, 旨在求新,关注专业事物, 立足长远超我智慧目标情势, 控制器能弱\n\
    反应特点:01.用量维度模型 02.有关心边界\n\n管理情绪\n管理逻辑\n管理本能\n\nLIMBIC BRAIN EMOTIONS\n古哺乳动物脑-情绪脑\n\
    组成结构:下丘脑+海马体+杏仁体\n三脑位置:中间层(包围重要脑)\n控制内容:情感、记忆、社交关系\n当年年龄:约2亿年 完全成熟:12岁后成熟\n脑内占比:约能建脑半成\
    \ 意识层面:微弱\n运行状态:始终都在, 响应速度较快,力耗轻低, 旨在求稳,关注社交关系,立足眼前\n自我保护行动, 控制器能较强\n反应特点:01.默认连续性\
    \ 02.非黑即白\n\nREPTILIAN(THE OLD BRAIN) DECISION MAKING\n爬行动物脑-本能脑\n组成结构:基底核+小脑+脑干\n\
    三脑位置:最底层\n控制内容:脉搏、呼吸、睡眠等应激反应\n当年年龄:约3.6亿年 完全状态:2岁后成熟\n脑内占比:与情绪脑同1成 意识层面:潜意识\n\
    运行状态:24小时不停止,响应速度极快,力耗\n低耗, 旨在求存,关注环境威胁,立足当前 2 超我决策直视, 控制器能最强\n反应特点:直觉反应(战斗、逃跑或承担)\n\
    \n## 应用方法\n\n+   一、主动提升智脑,让理智脑觉醒成长\n01 立足长远,主动走出舒适区\n02 为潜在的风险制自己,可能的收益还时满足\n\
    03 保持耐心,坚持做有长期意义的事\n04 抑制诱惑,结合机会成熟本能思维型,做出有利选择\n\n+   二、主动学习思维模型,拓展多元思维\n01 不依赖靠自制力,而是依靠多元知识的输入\n\
    02 不对抗本能与情绪,与之和解,转为己用万为上策\n03 不排斥本能脑与情绪脑,各有优势,取而用之\n04 上天赋予理智脑智慧,是让我们驱动本能与情绪非取代\n\
    \n> 在一会议上,有一位女士要查理亚茨用一个词说出他的成功之道,茨格回答:理性! 艾格还说:\"如果你想成为一个理性的思想者,必须培养出跨越常规学科领域的头脑,必须跨学科学习,学习重学科的重要思维模型\"\
    。 \n\n总结:人类大脑运行疗愈的准则是“能不用脑,就不要脑, 须用脑时也不要脑”; 这是进化的结果! 尽管如此, 也不非如此。\n\n# 20.卡尼曼双系统理论\n\
    \n我们应该尝试以不同的方式思考问题，以此来适应这个多变万象的世界。因为我们前面人智睿通过“貌似语言”推出出来，为大家提供解决问题的可能化思维公式。\n\n\
    大脑有无法克服的结构性缺陷，你可以理解为进化的副产物。大脑的目标是求存而非求知，对于外界的环境。符合最小作用力原理，能不动脑筋不动脑。卡尼曼双系统思维模型重点讲述人们的大脑如何在直觉和理性之间进行选择，如何做出判断，如何充分利用与智力无关的理性进行重大的选择。如果了解我们的大脑，并合理的使用，才能更好的帮助我们在面对问题时更好的做出选择。\n\
    \n## 基本结构 THE 2 SYSTEMS\n\n## 系统1—快思考 System 1-Fast Thinking\n\n## 系统2—慢思考 System\
    \ 2-Slow Thinking\n\n## 结构剖析\n\n## 快 System 1-Fast Thinking\n\n## System 2-Slow\
    \ Thinking 慢\n\n系统1 (默认模式) 直觉本能 百分之95\n\n+   - 持续扫描我们的环境\n- 速度快但较容易出错\n- 通过快捷键轻松工作\n\
    \n系统1的运行是无意识且快速的，不怎么费脑力，没有戒心，完全处于自主控制状态。\n\n+   - 懒惰的\n- 缓慢的\n- 演绎的\n- 基于规则非经验\n\
    - 不容易出错\n- 耗费资源的\n- 辩证不济的\n- 深度熟虑的\n- 理性推理的\n- 逻辑的\n- 结构化\n\n系统2 (备用模式) 理性思考 百分之5\n\
    \n+   - 用于特定问题 仅在必要时使用\n- 需要努力分析推理 解决复杂问题锻炼自我控制\n- 速度慢但很可靠\n\n系统2 将注意力和转移到需要费力的脑活动上来，例如复杂的计算。系统2的行动遵循与行为、逻辑和专注等主要属性很相关。\n\
    \n## 案例参考\n\n经验和记忆作为 判定断依据\n\n确定两件物品到近距离 确定突然出现的声音 将短语“画面和”外壳完全 看到恐怖画面后做出外部的表情\
    \ 察觉空气中的不同气味 回答2+2=? 读大字报黑字上的字 在繁忙的道路上搜索行车 下象棋时看出下一步好棋 理解简单的句子\n\n赛跑时随时做好起跑准备\
    \ 关注游戏园里的小丑 在一次朋友的聚会里关注某个人的声音 找到某例白头发的妇女 保持大脑记忆，判断声音是否表达惊喜 保持大步快的步行速度 观察自己在社交场合的做法是否得体\
    \ 统计出某中文域名 a 的出现次数 告诉别人你的电话号码 比较两台洗衣机的总体功效\n\n大脑分析解决问题 19×25\n\n## 应用方法\n\n+ \
    \  01 自我提示假设失败\n02 旁观者纠正系统1的快思考\n03 系统1反应快但不耐久，有意中断，回归理性\n\n总结:放慢思考，主动开启系统2，对系统1理性检验，从而弥补系统的漏洞，减少直觉产生的偏见和错觉。\n\
    \n# 21. 冯诺依曼思维模型\n\n我们经常应该以不同的方式去思考问题，以此来对待这个系统万变的世界。因此我们将前面人类普遍通过“貌似奇据”翻出来，为大家提供解决问题的可视化公式。\n\
    \n冯诺依曼思维是将一个复杂问题拆解成一个可执行的简单单元，然后将简单的单元重新组合成具有某种意义指定属性的大问题。由以上定义可知，该模型具体包括两个部分，一是把复杂大问题拆解成一个个小细节；二是把一个个小细节组合成具有某种意义的大问题。\n\
    \n## 基本结构\n\n+   - 输入设备 将程序和数据送入计算机\n- 存储器 程序 | 数据\n- 处理单元 执行指令\n- 控制单元 指令执行的顺序\n\
    - 输出设备 将执行结果送出计算机外\n- 数据信号 → 控制信号\n\n键盘 | 鼠标 | 扫描仪\n\n存储器\n\n输出设备\n\n显示器 | 打印机\
    \ | 磁盘\n\n处理单元 ALU REG\n\n控制单元 PC\n\nCPU\n\n拆解\n\n重组\n\n## 拆分≠拆解\n\n## 拆分是将一个整体的不同部分单独拆分开\n\
    \n拆分公式 | 整体 = A + B + C + …\n\n## 拆解是将整体拆解成一个可执行的简单事情\n\n拆解公式 | 整体 = A × B × C\
    \ × …\n\n## 拆分≠拆解\n\n## 举例子\n\n![](img/df4a7790feb77e5cf1e36990b372088a_22_0.png)\n\
    \n游戏 = 主线关卡 + 竞技场 + 技能设计 + …\n\n物理层面的拆分，主要用于解决技术上复杂的事物\n\n## 举例子\n\n健康值 = 消化系统\
    \ × 呼吸系统 × 神经系统 × …\n\n销售额 = 顾客数量 × 转化率 × 客单价\n\n游戏 = 构架 × 体验 × 核心玩法 × 目标规划 ×\
    \ …\n\n拆解解决了分类的范围、方式、问题本质，根 本原因是动态而系统的，同时还要符合使用者的价值。\n\n系统层面的拆解，主要用于解决原理上复杂的事物\n\
    \n## 重新组合\n\n创新并不是创造全新的事物，而是把不同的系统要素重新组合起来形成新事物，新系统的过程。\n\n互联网 + = 互联网 + 传统行业\n\
    \n“互联网+”简要的说就是“互联网+传统行业”，固定制造业等的发展，利用互联网和传统行业相连，提高、改善互联网与传统行业结合，即两个不同系统的重新组合创新。\n\
    \n婴儿摇篮 = 玻璃盒子 + 恒温系统\n\n19世纪80年代初，波兰军官学L.S.蓝氏 非常流行地与4次在德国儿童一个在学 会会会的当先进，他们大多来自于物理生物于\
    \ 另一个系统结合的新型教具这一切。\n\n思维模型 = 模型概念 + 认知图形\n\n大多数所看到的思维模型图是介于如图基础 上用图形+文字的组合来形成概念认知\
    \ 这给读者。两者的数学的构建成事，就要从原 而表达的准备必须严格正比。\n\n总结:该模型的本质是“拆与组”，“拆”要拆解（找到问题本质），而非拆分。用错了“拆”，也就用错了“组”。\n\
    \n# 22.三层解释思维模型\n\n我们都应以不同的方式去思考问题，以此来对应这个瞬息万变的世界。因此我们将前人整理透过“感觉语言”筛出出来，为大家提供解决问题的可视化思维公式。\n\
    \n批判性思维的过程可以分为三个层次或水平：体验、解释和解析。但要记住，这种分类是人为的，只是为了重点突出批判性思维的过程。尽管分析处在思维过程的最高点，但三层模型是循环往复、不断变化的，有时人们为了进一步确认会从分析水平返回到经验水平，也会根据对新信息的分析重新修正原来的解释。人们决不会只有单纯的经验或分析。\n\
    \n## 模型结构\n\n经验层 Experience\n\n解释层 Interpretation\n\n分析层 Analysis\n\n循环往复 不断变化\n\
    \n经验层\n事物表面\n看山是山\n\n解释层\n事物左右\n看山不是山\n\n分析层\n目的 本质\n看山还是山\n\n## 结构拆解\n\n## 经验层\
    \ EXPERIENCE\n\n+   - 直接经验\n经验层是一个思维过程，我们只描述自己观察到的事物，而不是它可能是什么。\n- 间接经验\n\n##\
    \ 举例子\n\n+   01 在工作面谈中，我被拒绝了。\n02 当我表演开始时，马虎为我开门。\n03 在美国，克美人是合法进行。\n04 尽管黑人仅占美国人口的12.9%，但却占据因数量的45%。\n\
    05 在2004年的总统选举中，只有58.4%有资格的美国选民进行了投票，比例在18-25岁的年纪人中甚至更低，仅为41.9%。\n\n## 解释层 INTERPRETATION\n\
    \n+   - 依据事实\n解释层是第三个思维阶段，解释需要依据我们对事实的了解和它们是什么。\n- 偏离事实\n\n## 举例子\n\n+   01 我没有获得这份工作是因为我没有熟人。\n\
    02 马克是一个大男子主义者，他认为女性太弱小，自己开门合适。\n03 如果克美人认为这是违法的话，那也许是确定的不是道德。\n04 人们在印度中古继承地方的比例是因为黑人男性天生比白人男性更暴力。\n\
    05 美国年轻人在选举中不投票是因為他们對政治不感興趣\n\n## 分析层 ANALYSIS\n\n分析层\n\n+   - 审视自己\n分析层是第三个思维阶段，主要功能是审视自己与他人之间的解释。\n\
    - 审视他人\n\n## 举例子\n\n+   01 我没有得到这份工作，是因为我没有熟人，面试技能不足，还是没有达到这份工作所需要的条件？\n02 马克为我开门？目的是否在帮助？\n\
    03 为什么克美人看起来违法？是否存在某些情况，克美人也许可以被宽容？\n04 有没有证据表明黑人男性被拘留向更强？有没有可能是因为黑人男性比白人男性受到的歧视更多？有没有其他因素能够解释…男人因在印度中古继承地方？\n\
    05 为什么越来越多的美国人，尤其是年轻的美国人，不参加投票选举。联邦政府的选举票是不是应该该有的国家那样实施强制措施？会不会是感染的原因？\n\n## 抗拒\n\
    \n由于我们大多数人都需要证明自己是正确的，因此我们都要遵从一种模式来接收自己的“客观事实”和接受它，并把它推销给别人，它的实质为“适用的 becomes\
    \ 防御机制，这种机制过激化、冲动，避免不明确和加深分歧”。\n\n## 总结:该模型一个非常重要的点在于三层模型的循环往复和不断变化，任何模型都是如此，并非固定不变，切记。\n\
    \n# 23.损失规避思维模型\n\n我们懂得应该以不同方式思考问题，以此来应对这个瞬息万变的世界。因此我将前面套用“微视觉语言”翻译出来，为大家提供解决问题的可视化思维公式。\n\
    \n损失规避是人们在面对同样数量的收益和损失时，认为损失更加令他们难以忍受，又称损失厌恶。损失规避反映了人们的风险偏好是不一致的，当涉及的是收益时，人们表现为风险厌恶；当涉及的损失时，人们则表现为风险寻求。\n\
    \n## 模型结构\n\n## LOSS AVERSION MENTAL MODELS\n损失规避思维模型\n\n100S = 100S\n获得收益时产生的快乐\
    \ > 失去收益时带来的快乐\n人们获得损失时产生的痛苦，远大于获得收益时带来的快乐。\n\n## PLEASURE 快乐\nSMALL PLEASURE\
    \ 小乐趣\n\n## LOSS 损失\nGAIN 获得\n\n2~2.5\n损失带来的负效用是收益带来的正效用的2 ~ 2.5倍。\n\n## BIG PAIN\
    \ 大痛苦\nPAIN 痛苦\n\n损失规避思维模型提示我们在如何理问题，建议在自我身会出现损失规避心理的情形下，要很当心的避免过度避免大损失的进行，从而让决策更客观、准确。\n\
    \n## 应用例子\n\n## 01 1979年，心理学 Kahneman 和 Tversky，用实验验证了亚当·史密斯的观点，并将其现象命名为损失规避。具体的实验过程是：\n\
    \n+   - 第一组实验\n被实验体先行持有 1000 单位的现金。在基础上做出选择\nA.50%的概率将持有的现金增加为 2000\nB.100%的概率持有现有的现金金额为\
    \ 1500\n此实验中，被实验体的 16% 选择了 A, 64% 选择了 B\n\n+   - 第二组实验\n同被实验体先行持有 2000 单位的现金。在基础上做出选择\n\
    C.50%的概率将 1000 单位现金\nD.100%的概率损失 500 单位现金\n此实验中，同实验体的 69% 选择了 C, 31% 选择了 D\n\n\
    实验中，A选项和 C选项等同手中有现金1000若再获得1000单位现金，50% 的概率，并与 A选项同值，D能在手上获得现金1500, 100% 的概率，即B选项。结果显示：“虽然两项在经济上等价，但人们对损失的敏感度远高于对收益的敏感度，所以人们更倾向于避免损失而不是追求收益。”\n\
    不要过度选择亏损或不确定的情况，人们只想规避最大的自己感受到的痛苦。\n\n## 02\n\n损失规避 转换损失\n旧手机 旧手机\n打手机 打手机\n可惜\
    \ 可惜\n新手机 新手机\n保留旧手机 保留旧手机\n新手机 新手机\n低以旧换新\n回收旧机\n转为折扣\n分一半新\n新费用\n\n## 03\n\n\
    在医学与悲剧的对谈场景中，在做手术时对患者说明，对同一个患癌症进行下面的一个选项\n会计先生\n○手术的成功几率是 90%\n○手术失败的几率是 10%\n\
    本质上是一样的，但后者说法让人产生更强的抗拒或恐惧，会比\n前者让人更\n等待。\n\n## 如何规避\n\n+   01 决策时做数据分析，告诉更易获取确定的情况；\n\
    对自己和他人决策时，应可能通过理性分析来评估风险和收益，避免因损失规避而做出过度的保守决策。对个人而言，可能有一个问题，通过这种把“损失”变为“获得”来引导人做决策。\n\
    \n+   02 不看一时，看长远。\n股市当中短期视角很很重要，但长远来看，也可将风险分散。但在时间上需要谨慎，在时间上，风险会有所分散，在于股市波动过程中，上涨或下跌得失，随着时间推移，下跌时才，不会呈现短期最终亏损。\n\
    \n+   03 调整决策依据，做好最好的打算，降低期望值；\n从最终的决策考虑时，最好的打算，这时人们心理就会从“损失”变为“获得”。调整自己的期望值，同时降低期望值，也会让人实际的收益增加，从而知道“损失”变为“获得”。\n\
    \n> 总结我们处理问题，做决策时，要明白自身有损失规避心理的存在，然后有意识的克服免除大损失或避免的行为，从而让决策更客观、准确。\n\n# 24.替身决策思维模型\n\
    \n我们常常应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们前人智慧累积“貌似谬误”留出条，给大家提供解决问题的可能性思维公式。\n\n\
    替身指的是替别人的人，对本体而言，指替代本体的人。生活中则是模拟决策人所处的环境及其背景，去做决策的场景代入法，让替身有一种身临其境的感觉和思考过程，此时你就是决策者，你需要对这个决策负责责任和义务，也有相应的权利并为此做出决策。简言之替身决策思维就是站在他人的角度或换成特定角度去做决策的一种思维方式。\n\
    \n## 模型结构\n\n## SURROGATE DECISION MENTAL MODELS 替身决策思维模型\n\n替身 OR 分身 站在对方的角度思考问题\n\
    \n## 举个例子\n\n## 立场不同 少说多做\n\n立场不同，所处的环境不同，提供的值值不同，很多事情如果是一双见 况不妥结论，用替身思维模型（或称转换思维模型）换己所处岗。\n\
    \n收人将信将人告诉他出了事，只听大人吩咐，陆地反而反对和配合时反而不妥结论，换体制人设说设被说，都是很烦所以大声门时。\n\n设想对方清楚永远亲耳听见，我人说\
    \ 但是，只是为了帮您的毛绒到牛奶， 牛奶的口味，却好像没办法！ 听见这个声音很舒适的！\n\n## 懂得换位思考很重要\n\n同名于地的流动就会大加嘈杂和希系，某一年要聘请一位秘书，于是在几家报刊上刊登了招聘广告，结果应征的信件如雪片飞来。\n\
    \n秘书本身 A 秘书替身 B 拿破仑希尔\n\n我看到现在报上招聘秘书的广告， 我要非常努力准备这个职位，我今年夏天，年近学生毕业，我们希望能尽快说服你，\
    \ 一定能胜任乞丐。\n\n最后说：您只要投我广告一万元来给我，我就为您动员，所有相关的公司会一... 什么干，最后，秘书本是否还... 的时间就认识你了。\n\
    \n## 如何应用\n\n## NLP位置感知\n\n位置感知，在NLP心理上指的是，试着换个“位置”，多角度去思考问题，就会产生不同的想法和感受、态度。而这样的“位置产生观点”，称为“感知位置”。如下介绍五个感知位置：\n\
    \n+   ① 自我位置\n(1) 凡事以自我为核心，更关注自己的感受和感受。\n(2) 对自己和自己谈话，发怒，反感。\n反感和自我对立，而发出的性 反感和自我为出发点，对人也为人？\n\
    己，总是关心别人和意见。\n\n+   ② 对方位置\n(1) 把他人或他的为人他人看\n(2) 关心他人的感受，有同情心\n(3) 与对方的立场，这就是同理\n\
    心和和睦的行为\n在彼此的位置太长\n乎思考和处理自己的事情。\n\n+   ③ 抽离位置\n观看者处于中立、受观察、\n局外人其中立\n(2) 用来做客观平衡并做处理\n\
    性质的分析点\n(3) 让在事物中的人过分上\n性，或者人情味\n\n+   ④ 体系位置\n(1) 如果将事情的对立，并将其系统\n和他的关系作为合作作，并思考\n\
    被他感觉吗\n(2) 情况是包含一切的关系物\n(3) 决定最合适的人是恩情，注\n重集体或更完整生活的人\n\n+   ⑤ 宇宙位置\n(1) 超越时间和空间的限制与制\n\
    约，有神明般永恒恒稳定且脱\n光\n(2) 客观性的洞察的发展\n(3) 看作个人的人类人不食人间\n烟火，悲观乐观\n\nNLP 讲究灵活应变，对相同事物有多不相同观点，并对各种不同的观点予以尊重。灵活移动感知位置，有助于发展观点的弹性，善于移动感知位置，拥有多重观点，让人行动皆有理。因为各种不同的观点，互相补充互补，可以增加更多资讯，更好地处理，使人不致于陷入僵化或让思维的闭锁感。\n\
    \n+   请轮流坐在自己位置上\n这该自我尊重吗？\n请对待对方位置\n这个想法说明了什么？\n请在抽离位置\n这个位置有什么吗？\n请在体系位置\n这个观察到什么？\n\
    请在宇宙位置\n这个位置意味着什么？\n\n总结:替身决策在开拓思维、处理职场人际关系、生活困惑方面是一个极为好用的思维模型，结合NLP位置感知，去观测生活的不易。\n"
