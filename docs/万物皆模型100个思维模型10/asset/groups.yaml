    \n# 39. 凹透缩小思维模型\n\n我们应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我将前人智慧整理“微咨询”翻拍出来，为大家提供解决问题的可视化思维公式。\n\
    \n凹透缩小思维模型是将具体的事物缩小，从而看清事物的位置以及事物与事物之间的关系，从而着眼于全局、整体、上帝的视角去解决问题，如看似复杂而棘手的问题，缩小后可能会发现导致其发生的原因并不困难，比如当我们遇到困惑时，空间层面我们可以将自己、对方、周围的世界缩小，时间层面我们可以将视野拉伸，如此去细节你会发现这个困惑不见得困惑。通常情况下指空间层面的“缩小问题”、“全局视角”和时间层面的“时间拉伸”的思维方法。\n\
