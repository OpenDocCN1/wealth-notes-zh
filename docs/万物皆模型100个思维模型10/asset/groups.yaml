    # 03.直觉思维模型


    我们应该应该以不同的方式去思考问题, 以此应付这个瞬息万变的世界。所以我们将前面人类通过“微感觉”翻说出来, 为大家提供解决问题的可能性公式。


    直觉思维 Intuitive Thinking 是指不受某种固定的逻辑规则约束而直接领悟事物本质的一种思维形式。直觉思维是未经逐步分析(具有迅速性、直接性、本能意识,
    仅依据内因的感觉迅速地对问题答案作出判断、猜想、设想, 或著在对疑难百思不得其解之中, 突然对问题有“灵感”和“顿悟”, 甚至对未来事物的结果有“预感”“预兆”等都是直觉思维。直觉作为一种心理现象贯穿于日常生活以及科学研究之中而且是完全可以有意识加以训练和培养的。简言之,
    直觉就是直接的觉察。


    # 模型结构


    系统1遇到问题会自动寻求系统2介入, 系统2的行为经过大量练习后, 会自动转化为系统1, 形成直觉。


    # 举个例子


    INTUITION

    直觉


    LOGOS

    理性


    老公出轨


    女性第6感

    心理分析师


    确定出轨


    行为


    语言


    表情


    关于老公出轨的直接感觉或模糊的感觉


    用专业逻辑谨慎思考常识和素养来判断


    上图可以得出：普通女性与心理师都能够得出相同结论, 知识的积累是可以转化为直觉思维的, 因此：


    +   - 细致思考→转化为直觉思维

    - 累积知识→转化为直觉思维

    - 自律练习→转化为直觉思维


    总结:两著并不孤立, 相互转换使用不仅可以帮助我们迅速的做出选择, 而且是正确的最优选择。'
