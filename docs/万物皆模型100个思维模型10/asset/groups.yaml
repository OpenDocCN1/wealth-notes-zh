    # 80. 系列位置效应思维模型


    我们对信息以不同的方式是思考问题，以此来应对这个瞬息万变的世界。因此我们将人工智能通过“微语提醒”解读出来，为大家提供解决问题的可视化思维公式。


    系列位置效应 serial-position effect 是一种心理学现象，指人们倾向于对首先见到事物和最后见到事物有更好的印象，分为首因效应 primacy
    effect 和近因效应 recency effect。首因效应是对“第一印象”或“先入为主”所产生的心理学现象，指在行为过程中，最先接触的事物会给人留下深刻的感知或认知，影响人对事物的感受和判断，近因效应指在行为过程中，对事物的最近一次接触给人留下深刻的感知或认知，能对首因效应所形成的心理作用起到巩固、维持、否定、修改或增进等作用。


    # 模型结构


    我们倾向于更好地记住首先出现的事实、印象或任务，而不是随后出现的顺序。


    我们对于當前的体验情况，而对长期的历史模式置之不理。


    # 首因效应

    primacy effect


    # 近因效应

    recency effect


    # 对首因效应的作用


    +   - 巩固维持

    - 否定修改


    # serial-position effect


    # 举个例子


    人际交往中首因效应总是给人留下第一印象至关重要，对印象的形成影响很大。汤姆森在1957年做的实验向四个大学生介绍四个组生人：向A组介绍他是外向的性格；向B组介绍他是内向的；向C组介绍是先外后内；向D组介绍是先内后外。向D组介绍时他的顺序是相反的。先说他是外向后来是内向，向B组介绍时的顺序是先说他是内向后来是外向。结果发现向四个组介绍这个陌生人，B组对他的描述好，但C、D组对陌生人的印象完全与提供信息的顺序相对应——先提供的信息占优势。


    我们常常有这样的判断：比如一个“坏人”总是做坏事，但当他突然做了好事，我们对他的看法可能会马上改变，会原谅他过去的种种。并且对他做的好事大惊小怪，以至于会认为他没有那么坏的那种样相反，一个“好人”做一件坏事，我们往往会看到他做件坏事，而对于往的事情而不管，认为他原来是个坏人，甚至会认为他原来做的好事都是有假装出来的。


    # 启发应用


    # 凡事不可只看表面


    # 系统思维是否有越


    # 合适的时机做合适的事


    总之首因、近因总是为什么会很容易影响人们，因为其符合人性中的“贪懒惰懒”，所以学之目的为观察，至于用不用，凡事好坏由各位。'
