    赋予意义(Assign Meaning)


    # 选择数据 Selected data

    过滤讯息(Filter Info)


    # 观察 Observations

    原始资料(Raw Data)


    使用推论阶梯以确保公正准确判断，而不仅仅是去做结论，这是一种帮助用自己的信念和假设的方法。首先假设自己判断时，A. 意图自己的观点和假设。B. 他人认为自己的判断和解释进行。C.
