    # 91. 动态思维 思维模型


    我们需要以不同的方式去思考问题，以此来适应这个瞬息万变的世界。因此我们每期人需通过“锐说请客”型讲出来，为大家提供解决问题的可视化思维公式。


    动态思维 Dynamic Thinking Method 是指一种运动的、调整性、不间断优化的思维活动。具体地说，它是根据不断变化的环境、条件来改变自己的思维程序、思维方向，对事物进行调整、控制，从而达到优化的思维目标。动态思维的逻辑表现是辩证逻辑并以变动性、协调性为自己的思维特色。20
    世纪之后，随着科学技术的迅速发展，社会以加速度向前运动、变化。整个世界联成一片，形成一个巨大的动态的联系之网，每一个国家、社会及事物都是这张网上的结结。因此，以前在思维方式中占地位的静态思维方法让位于动态思维方法。


    ## 模型结构


    ## 动态思维特征 1 -流动


    动态思维的基本特征是流动性，即它的运行不是一成不变的，而是随外界环境的变化而变化的。实际上，动态思维是根据变化的问题，通过思索和行动而形成流动的思考模式，动态思维的特点是它的流动性。


    ## 动态思维特征 2 -择优


    动态思维的择优性，体现了动态思维选择的条件。动态思维通过选择不同方案，对情况进行分析和比较，进行优化，从而选择最佳方案。


    ## 动态思维特征 3 -构建


    动态思维的构建性，体现了动态思维在解决问题的过程中，通过对信息的整合和加工，形成新的思维模式。动态思维的构建性，是指在动态思维中，不断地进行思维的调整和优化。


    ## 动态思维特征 4 -系统


    动态思维具有系统性，即它不是孤立的，而是一个完整的系统。动态思维的系统性，体现了动态思维在解决问题时，考虑问题的整体性和系统性，从而形成一个完整的思维系统。


    ## 动态思维特征 5 -开放


    动态思维的开放性，体现了动态思维在解决问题时，考虑问题的开放性和包容性。动态思维的开放性，是指在动态思维中，不断地进行思维的扩展和创新，从而形成一个开放的思维模式。


    ## 动态思维 DYNAMIC THINKING METHOD


    对外时到了认识和改造环境的目的 对内调整了自己的思维和行为程序 从而提高了思维活动的有序性


    ## 举个例子


    歌德的恋人马克斯拉茨，被其父亲逼迫嫁给一个比她大十五岁而且已有五个儿女的鳏夫，歌德受到很大的刺激与震动，同时也随着外在刺激向内转化的这个动态过程，激发出创作激情，在这种动态过程影响下，歌德用了四个星期，一气呵成写信小说《少年维特之烦恼》。


    ## 启发应用


    ## 动态思维与静态思维的关系


    动态思维和静态思维是相对的，也是相辅相成的。根据一新的情况和一新的问题，动态思维需要不断地进行调整和优化，从而形成一个动态的思维模式。静态思维则是在一定程度上，体现了思维的稳定性。


    ## 动态思维的优劣


    在实际工作中利用动态思维的优点，可以更快地解决问题，获得更好的效果。动态思维的缺点是容易产生混乱和不确定性，需要不断地进行调整和优化。


    ## 过去正确不代表一直正确


    学习和工作的情况是不断变化的，过去正确的思维方式，不一定适合现在的条件。我们需要不断地进行调整和优化，从而形成一个动态的思维模式。


    > 总结:这个世界的本质是“变化”，这是客观事实及规律，保持开放，拥抱迭代，才能做到因人因时因地而制宜。


    # 92. 溯因推理思维模型


    我们需要应对以不同方式思考问题，以此来应对这个变化万千的世界。因此我们前期曾经通过“凯诺语”翻译出来，为大家提供解决问题的可视化公式。


    溯因法或溯因推理 abductive reasoning, 是从事实推理到最佳解释的过程。即使是开始于事实的集合，并推导出其最佳解释的推理过程。演绎和溯因区别在于推理中使用“a
    涵盖 b”这种规则的方向例如 b= 结果, a= 原因。演绎为：允许推导 b 作为 a 的结论, 即演绎是推导已知事物的推论；溯因为：允许推导 a 作为 b
    的解释, 溯因同演绎反向,通过允许“a 涵盖 b”的前提 a 推导自结论 b。溯因推理是推测事件发生的原因的推谓方法,一般是指从已知事实出发,运用一般规律性知识,推测事件发生的原因为。


    ## 模型结构


    ## 逻辑推理的三种方式

    演绎、归纳和溯因。给定前提、结论和规则，而前提导致结论。


    ## 演绎：用来确定结论。它使用规则和前提来推导结论。


    例：“如果某天下雨(规则), 地上是湿的(前提)。”(结论)“如果天下雨, 地上就湿了。”根据证据建立在正确性上的前提,如果,所有证据与假设一致不矛盾,它是真实的,
    并且与它的子集一致。


    ## 归纳：用来确定规则。它借由大量的前提和结论所组成的例子来学习规则。


    例：“如果某天下雨, 地上是湿的。”(例)“如果天下雨, 地上是湿的。”归纳出“天下雨, 地上湿。”如果许多观察结果都是这样,那么我们就可以假设这条规则为真。


    ## 溯因：用来确定前提。它借由结论和规则来支持前提以解释结论。


    例：“如果某天下雨(规则), 地上是湿的(结论)”(可能为下雨。)由此类推不能确定结论是否成立, 但能找到可能解释。许多可能解释可能存在。虽然我们不能说“天下雨”就证明地上是湿的,或反之,但我们允许从观察中推断出原因,
    我们可以从单个事例为可能的结论提供解释, 即使无法完全证明。这不是演绎,因为我们不能确定前提是真的, 但它仍提供了观察现象的最佳解释。


    例 如下天下雨, 地上湿。依据溯因推理的逻辑,即一旦假设的前提即(以往地面都是由下雨造成的),于是合理猜测此现象为下雨所致的。这一过程便是观察到现象, 提出假设论点出下雨,
    然而我们再观察一下远处的地面便可以验证我们的论证是否正确,如果某处的地面是湿的, 5 公里, 10 公里(c1, c2, c3...),都是湿的, ok,
    “天下雨, 地会湿”为合理, 反之则不合理。如果为不合理,我们可以提出新的假设为: “洒水车刚刚路过”, “隔壁家漏水”, “水管破突发现象”等。每每一个假设都将通过相对的论证来论证它是否为合理或不合理。


    ## Five characteristics of abductive reasoning

    溯因推理的五个特征


    + - 溯因推理最重要的是首先是可以解释现象的假设, 而这往往需要很强的直觉与博的知识

    - 假设对我们现发现的现象的特征或可视, 具有原初, 需要进一步实证检验

    - 当我们没法通过逻辑直接从假设中获得可证性时, 必须由被观察成员含有可检验性的推导, 从而为实际检验创造条件

    - 溯因推理是在公开可兼之的因果需求最最佳解释的推理模式, 而最佳解释必须与最大范围的经验事实相一致

    - 溯因推理包含着演绎推理与归纳推理—由假设形成推论就是演绎推理, 而对推论的实证检验是归纳推理


    ## 启发应用


    解释为什么——找到最佳解释

    问题推理是一个假设的解释的试探过程。创造一个假设,并进行验证, 而后对假设进行验证, 并不断修改。也就是说, 解释并非只是找到一个答案, 而是把问题解释至到能解释事实的程度,
    在这个过程中形成对问题的理解, 并在实践中得到验证, 以此来找到真正的根本原因。


    总结: 溯因推理是一种有效的解决问题的方法, 它可以帮助用户找出问题的深层原因, 从而更好地采取行动。


    # 93.情绪ABC理论思维模型


    我们应该以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们有前人曾经通过“觉说谎者”翻译出来，为大家提供解决问题的可能性思维公式。


    情绪 ABC 理论 (ABC Theory of Emotion) 是由美国心理学家阿尔伯特·艾利斯创建的理论，他认为激发事件 A (Activating
    event) 只是引发情绪和行为后果 C (Consequence) 的间接原因，而引起 C 的直接原因则是个体对激发事件 A 的认知和评价而产生的信念 B
    (Belief)，即人的消极情绪和行为障碍结果 (C)，不是由于某一激发事件 (A) 直接引发的，而是由于经受这一事件的个体对它不正确的认知和评价所产生的错误信念
    (B) 所直接引起。错误信念也称非理性信念。


    ## 模型结构


    触发事件


    信念


    情绪和行为结果


    间接原因


    Activating event


    Belief 1


    Belief 2


    Consequence 1


    后果产生的切根源在于你的信念。评价和判断。简单而言，你的主观认为就是事情的结果。也就是说，当事情发生时，你会非常的类似、甚至产生行为反应，是因为你对自己的评价、态度和行为，是不是得当，是没有考虑到由...推动它。


    Consequence 2


    A B C。当个体被传统社会的认知、观念和信念所束缚时，我们的信念...错误信念和情绪和行为...的产生。


    根原原因

    指出个体在遇到触发事件后所产生的信念、即他对该事件的看法、解释和评价


    即相应的情绪及应结果


    即相应的情绪及应结果


    ## 举个例子


    disputing intervention —— 敲打干预：跳出有观点


    A


    B


    同样一件事情，由于每个人的信念(认知、评价、解释)差异，因此便会出现不同的情绪和行为结果。即所说的格局大小悬殊便由低而生。当危机事件无法控制的表象、紧迫点是因为自己的信念做、而当触发事件来袭时，你无法打破自己的主观、也就不能做到客观判断，而是以主观、自以为的、本能的方式去面对。


    敲打干预——理性解决困惑


    B

    不理性：对方为什么总是针对我


    C

    烦躁不安、委屈

    情绪情绪格格老公


    B

    理性：爱她关系

    本质是身份边界


    C

    以夫妻关系为桥梁

    家明晰身份边界


    情绪 ABC 理论模型首先让我们观察到自己的情绪源头，并通过积极反干预，即主动的打破传统认知(如上述案例中要解决的问题是历史原因、那个人总是解决问题、我也解决不了)，当我们意识到自己的问题后，就不会再对过去、就不会再对过去的问题。我们可以把自己的情绪、认识、思维模式、找到问题的根源(可参考资源)找到问题的解决之法。


    ## 启发应用


    ## “其实，你是一个演员”


    人可以是演员的角色,也可以是观看者的角色,不管是谁,在哪个角色中扮演(包含角色心理的完全者)，当演员在舞台上表演时，观看者也会受到影响。甚至会让自己觉得...只...而...但...这种...


    ## 梳理思维——跳出既有思维


    情绪的产生与个体价值观的关系,情绪产生的原因不在于外部事件,而在于对事件的理解与评价。对事件的评价是否基于事实...


    ## 情绪的一般规律路径


    情绪 ABC 理论中展示了情绪产生的一个一般规律,即:信念——情绪——行为,这种规律不仅能够帮助我们理解情绪的产生,也可以帮助我们预测和改变自己的情绪和行为。


    总结:事件或事件本身没有任何问题，问题在我们最容易忽视的对事件或事情所持的态度和看法。


    # 94. 蘑菇管理思维模型


    我们都很习惯以不同的方式思考问题，以此来避免这个瞬息万变的世界。因此我们将前期人类借助“视觉语言”翻绘出来，为大家提供解决问题的可视化思维公式。


    蘑菇管理 Mushroom Management 指在公司或组织中，管理者与员工间的沟通出现断裂。即管理者在不告知用意的情况下指派工工作的一种管理形态。蘑菇管理意味着员工的好奇心或自我表达行为并不被支持。员工常常不知道公司的整体状况，因为管理者倾向独自决定所有事项，而不去咨询其他人关于自己的决定如何。这种状况下管理者是无法理解员工的工作内容，从而导致前者无法很有效地与后者沟通。因此管理者要提早认识到这种现象并且加以预防利用。蘑菇管理一词是以蘑菇培养时的场景做隐喻：养在黑暗环境以生胞。


    ## 模型结构


    管理者

    保持开放，因人而异地管理，详见 P69 倾锦领导力思维模型

    1. 主动出击 2. 沟通交流 3. 学会忍耐 4. 开放心态 5. 延展环境


    员工

    以结果为导向，以客观事实为准

    行为不应得求请已，三思而后行

    保持开放，在矛盾与对立中成长

    心态：潜龙勿用期，勿自以为是

    不耻下问期，主动组织继续联系


    结果 Outcome

    行为模式 Behaviour Patterns

    系统结构 Systems Structures

    心态 Mindsets

    养分 Nutrient

    与所有自然系统相互联系 INTERCONNECTED TO ALL NATURAL SYSTEMS


    ## 举个例子


    理查德·福尔德

    过度保密


    盛 received 危机事件中，一些管理顾问，像是前 CEO 理查德·福尔德对于很高的决策资讯状况被告知。当时银行不断地集来越多的高风险债务，但无论层级资讯被很大程度上没有达到银行的许多重点客户，福尔德与多伦多前线...
    资讯被截断... 福尔德便... 依赖... 保密...


    卡罗·费雷拉毕业于斯坦福大学法学院，第一份工作是在一家地产经纪公司担任秘书。她每天的工作就是搜集、打印、复印。整理文件，尽管父母和前老板说鼓励她努力工作，但很明显她并没有一次苏福福的生命...
    她开始在工作... 机遇... 玛丽·凯... 成为世界第一女 CEO...


    ## 启发应用


    ## 成长来自真实是


    我们并非希望对人们今天的工作有更多的了解，相对地要更善用真实数据来解决问题，而不是依赖经验或假设。


    ## 潜龙勿用不是不用


    新员工刚入公司，需要先观察和学习公司的文化和体系，应用并不断改进。


    ## 成功者都是反人性的


    管理者应保持开放并积极应对员工的反馈，而不是一味的顺从。


    总结：我们此生的对手，只有我们自己，并非是你的眼中钉，客观事实是他们才是帮你成长的人。


    # 95.前景理论 思维模型


    我们需要适应的以不同的方式去思考问题，以此来应对这个瞬息万变的世界。因此我们前人智慧通过“微观谍语”翻译出来，为大家提供解决问题的可视化公式。


    前景理论（Prospect Theory）是一个行为经济学的理论，为心理学教授卡内曼和特沃斯基提出。这个理论的假设之一是，每个人基于初始状况的不同，对风险会有不同的态度。此理论是行为经济学的重大成果之一。长期以来，主流经济学都假设每个人作决定时都是“理性的”，然而实际情况并不如此；前景理论加入了人们对得失、发生概率高低等条件的不对称心理效用，例如在大多数时候，人当然是理性的。但是，当遇到损失时，或者说当面对未来的预期和今天的不确定之间存在落差时，人往往将进入非理性状态。


    ## Prospect Theory-Value Function 前景理论-价值函数


    心理影响


    Subjective Gains 主观收益


    Objective Gains 客观收益


    Objective Losses 客观损失


    Subjective Losses 主观损失


    Reference Point 参考点 当前状态


    但是，当我们评估损失时，恐惧感会被放大。也就是说 -40，心理上相当于 100 的心理损失。 因此，如果净损失为 60，主体观察价值趋于 0。


    当我们评估收益时，主观心理收益与实际的收益值匹配


    ## 前景理论的四个基本结论


    + 01/ 确定效应

    在确定得到时，收益和风险之间趋向多，我们会选择确定性结果，即使与理论上风险性结果，多数人都因为风险厌恶，例如：买好保险，房子买保险。

    02/ 反射效应

    在确定的损失和收益之间时，多数人会选择确定；即使风险和损失更大，我们仍会选择风险。例如：在面对中的不确定有更大的损失，被迫亏损；还好在赔付的糊涂中。

    03/ 框架规则

    多数人对得到或失去的敏感度，即大多数人对得到和失去是不对称的。当我们得到时，我们会趋向于拒绝风险；当多数人超过得的比例时，例如：投 100 拿到 80。减少了，愿意接受
    100 等值的赌博。

    04/ 参照依赖

    大多数人获得利益时会倾向发生动机，寻求利益。然而当大多数人运行风险时，会... 在年轻人 6 万至 7 万亿... 也在年轻人 9 万亿 8 万亿... 多数已脱离。


    ## 举个例子


    高概率投资偏见 低概率 高概率投资偏见 预期结果 的价值 参考迁移 克服自身偏见，不要考虑得失，拉长时期以，预期价值为导向而问题


    ## 博弈论之前景理论


    博弈论增添元素三

    拍半年 零花钱 VS 少玩一天游戏

    对于家庭有“神童”的家长都如是说，对于孩子学习和游戏之间的选择以简单的形式给出，当孩子一开始，“你这一次考试考不好，不许去玩游戏”。孩子内心一定是不甘心的，如果换一次讲法。“那你考得好，本来孩子家内不会舍得用钱的，但是在看到你，如果今天你去学习的话，就不给你奖励了。”相对对于被半月零花钱的“恐惧”来说，少玩一天的游戏就太小了。


    ## 趋利避害


    前景理论告诉我们，投资性决策往往更倾向于寻找和追求收益，在工作中也如此，前提是，你必须，制定的销售问题；这样可以在征求通过自己的努力，得到确定的收益，而不是交出自己的资源和时间，去博取更多的收益。


    ## 博弈手段


    前景理论告诉我们如何以利用自身的偏见，设置对手的博弈手段。例如，出售刀片再加上刀片，以及在面对一生... 在做出决策时，遇到问题时，尽量设置一个生活目标；预先设置好行动的步骤，例如：先...
    之后... 最后。或者在不执行时，设置惩罚机制。


    ## 生活应用


    前两天，当我们在多个选择中难以抉择时，可以选择将不同的事情分开处理，减小选择的复杂度。如果面对多个选项，可以先做一个简单的选择，然后再做后续的决策。策略性地使用损失厌恶的心理，或者，将损失的可能性降到最低，或者，将风险转移到可以控制的范围内。


    总结:有得必有失，得即失，失即得，不偏向于得也不偏向于失一偏不倚，此谓一阴一阳之谓道。

