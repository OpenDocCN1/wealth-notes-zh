    ![](img/f533c80fa21f80c0129b3b53112b7390_93_0.png)


    尽管我们的这堂课叫做内向者沟通表达课，但我坚持认为要改变的地方，精心照料着自己的一片果园，生活过得非常满足。


    但有一天，他不经意间发现，果园里其实有很多蜜蜂进进出出，于是他跟着蜜蜂飞行的足迹，找到了一个养蜂人的场所。一打听才知道，这个养蜂人在当地非常有名，靠着出售上等的蜂蜜赚了好多钱。于是果农愤愤不平，找到养蜂人，愤怒的说道，朋友，蜜蜂在我的果园采蜜，你拿这些蜂蜜到市场出售，获了利，相当于我是你的上游供应商。


    你该给我分成，不然我去法官那儿告你。养蜂人却面带微笑的说，如果我的蜜蜂不在你的果园采蜜，你果园的花没办法授粉，结不了果子。我的蜜蜂帮你做了大量的工作，恐怕我应该向你索要提成吧。怎么样？你觉得是果农有道理呢？还是养蜂人更有道理呢？实际上这是经济学中的一个经典争论。养蜂人和果农谁该给谁钱？他们之所以产生争执，是因为大家站在各自的角度看问题，而没有意识到，这其实是大自然的一种浑然一体的设计。


    物种间的互助协作系统而已。人与人之间也同样如此。如果我们把彼此看作是一个利益个体，就会存在帮助、竞争、利益争夺这些概念。但如果拔高格局，就会发现，所有的关系其实都是在一种利益网络中帮身边的人。本质意识其实是更大改善你和身边人的供给关系，从而让自己受益。


    是去看见他们对于自己身上事物的不同视角。当然这个观点我们已经说过，我们提到一个叫营造对方心理空间的概念，也是同一个意思。


    但不断帮助别人营造空间的好处究竟是什么？其实，这正是帮助我们自己走向更大人生的必然之路。此前很多年里，我一向觉得亲密关系那不就是互相诉说情感，相互吐槽抱怨的吗？比如高中的同学，现在办公室的闺蜜都是这样，但最近却越来越觉得关系就是一切。我们所营造的所有空间，其实将来也是为自己走的路所准备的。


    我们还说到了一个案例。假如你有一个侄子从小喜欢看百科全书，知识面很丰富，但是身边的人却和他玩不到一块去。因为当别的小孩在一起谈论月亮上是不是有神仙的时候，侄子会准确告诉他们月亮上的土质成分，天气信息，这样的条件肯定不适合任何生物居住，这就显得很无趣了。


    但是有一次你到他家作为叔叔，你也很喜欢百科。于是呢整个下午你们都很愉快的交流，这就相当于你帮侄子营造了一个空间，可以让他愉快的把知识存放在这个空间里。他的生命被你看到了，但同时呢也意味着他帮你也营造了一个空间，让你发现原来你的脑子还可以记住这么多知识。同时你也发现自己对知识还是有这么高的兴趣，你的人生就多了另一种可能性。这个故事的主角呢其实就是我自己。于是后来我开始了写作。


    很多时候啊我们往往以为自己的特质是我自己决定的。但其实，关系才决定了你的生存空间。和自己的关系，和其他人的关系，和其他物种的关系。这就是我在最后一讲里想要表达的。


    咱们回到开头提到的果园里，你知道为什么水果总是好看又好吃吗？因为它需要被动物吃，然后通过粪便传播自己的种子，所以不断进化果肉的那部分，然后把果核包裹在里面。


    这个规律永恒不变，给别人生存空间，就是给自己生存空间。内向者心里有浩瀚的星辰，只是世界的多数人都只埋头俯视前方。你需要让自己内向的光芒重新穿透黑暗，也需要照亮在别人身上。

