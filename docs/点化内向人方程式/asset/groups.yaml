    第七次拜访您公司了。这段时间我和您公司十多个部门同事都有深入 沟通，逐渐发现你们并不适合买我们上次推荐的那套软件。您看有 时间我给您汇报一下我的研究情况吗？就这样，利用电梯三十秒时间，
