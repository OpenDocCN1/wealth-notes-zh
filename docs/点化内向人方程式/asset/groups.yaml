    小莎，一个普普通通的很内向的女生，因为反正都得到了社会的重视，他却成了前者，做自己希望自己成为的自己。而我们当中的多数人，因为一直和社会联系更紧密，却反而成为了后者，成为了一种角色。也就是我们通常所说的体系化。我再说明一个案例，你就明白了，有一部电影叫守法公民。大概情节是，男主人公克莱德在家中遭到两名匪徒袭击，重伤之后眼睁睁看着挚爱的妻子和女儿被杀害。检察官尼克负责这个案子有很好的声誉，被他起诉的嫌疑犯几乎都会被定罪。


