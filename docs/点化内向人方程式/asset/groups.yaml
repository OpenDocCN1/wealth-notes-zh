    # 尴尬冷场就用追踪式


    我们先以英特尔公司的案例来开场。上世纪八十年代，英特尔还是一家电脑存储器公司，面对日本厂家的低价策略，英特尔连续六个季度出现亏损，外界开始怀疑英特尔是否能生存下去。一个阴雨的下午，英特尔总裁安迪格鲁夫在办公室召开董事会。全场所有人意气消沉。安迪格鲁夫一个问句打破了沉默，估计我们都要下台了。


    如果另选一名新总裁，你们估计是谁？ceo 摩尔说说不准谁会收拾这个烂摊子，可能是马丁，也可能你我都想不到。格鲁夫继续问，如果他当选，你认为他会采取什么行动？摩尔犹豫了一下，达到他可能会放弃存储器的生意，做芯片处理器。格鲁夫目不转睛的望着摩尔说，为什么你我不自己动手。从一九八六年，英特尔提出新的口号，英特尔芯片处理器公司伴随着经典的广告声。'
  - '[PAGE 36]


    噔噔噔噔噔，英特尔处理器变得家喻户晓，其中总裁安迪格鲁夫只用了三个问题就解决了困境。第一个是如果另选一名新总裁，你估计是谁？第二个是另选一名新总裁，你认为他会采取什么行动？第三个是为什你我不动手，其中他用到英语式对话时最入门的三个疑问词，**who**号外，这就是追踪式对话的可怕之处。就算你不会遇到像英特尔公司困境的这件大事儿，但每次和人聊天儿遭遇尴尬或冷场，却完全足够了。


    那如何进行追踪式对话呢？其实这就好比掉进了一片可怕的大海中，恐惧和焦虑的心情随之袭来。这时你需要做两件事儿。第一件事儿，抓住一块救生木板。第二件事儿，不断定位你的方向，最终走到陆地，脱离困境。我们先来看。第一件事儿，抓住一块救生木板，什么意思呢？这意味着着要在有限的语句中找到打破尴尬的突破口。我们来看一个案例，一个男生和一个女生在朋友介绍下相亲，朋友借口溜走，两个人面对面，男生开口说，最近的天气太糟糕了，一直下雨。女生说是啊，还好，对植物比较好。男生回了一句啊，确实这样的气氛就显得尴尬至极。但如果男生这样回应，你在家有种哪些植物呢？那就是木板，就算是抓住了，请注意，就是木板，就是指对方语句中的名词。


    一旦对话出现了某个名词，一定要坚定不移地追踪下去。再比如'
  - '[PAGE 37]


    我们在开头说的英特尔的案例里，新总裁就是一个名词，安迪格鲁夫追踪这个名词，提出了三个问题，困境就解决了。找到救生木板，也就是对方话语中的名词。你还需要做第二件事儿，不断定位方向。如何定位呢？主要包括三个方面，第一是主体定位，你需要用到疑问词，who
    和 what 在生活中，往往我们看到的可能并不是真相。比如史玉柱当年策划脑白金的时候，逐渐发核心消费人群和当初设想的完全不一样。


    于是，在会议中，他不断向大家追问，比如他问到谁是真正的使用者，谁是购买者，谁会在周围的人群中进行传播营销，这些就是户的问题。同时，他又问道，脑白金的使用体验是什么？收到礼物的感受是什么？看到广告的想法是什么？这些用到了
    what 这个疑问词通过不断提问，他们很快就突破了销售困境。第二是时空定位需要用到问什么时间以及 where 什么地点。这两个疑问词对于具体的时间和空间的定位非常好理解。比如你询问别人几点在什么地方吃火锅，只是我们在沟通中有很多抽象的时空概念。


    比如在女朋友心中到底是一个什么位置，公司在竞争中处于什么位置，产品离下一次产品迭代还有多久等，这些问题都可以不断用提问的形式进行时空定位。第三是层级定位。你可以用到
    why 为什么以及 how 怎么做这两个疑问词。那为什么我们需要进行层级定位'
  - '[PAGE 38]


    呢？这是因为问题往往都是多层的。我们经常会因为沟通彼此，站在不同层级上，造成大量沟通效率低下的问题。比如你突然有一天牙疼，而且疼得厉害，你自己就想买点止疼药，吃点就行了。大姨妈说这是发炎上火，要吃消炎药才行。


    而你爸却说，发炎是因为被虫蛀了，需要到牙医那里做根管治疗。结果你们还为此争吵。牙疼是感知角度，你妈说你上火发炎是常识角度，而你爸则是站在病理角度，这就是站在了不同的层级。为什么这个疑问词通常可以帮助你定位到问题的更深层次，而怎么做则是解决办法。这两者最好搭配使用效果最佳，主体定位、时空定位、层级定位，这三个定位刚好用到了六个英文中的疑问词。who
    和 what when 和 where 以及 why 和 how 这六个疑问词中有五个 w 和一个 h 这就是对话中的经典技巧。


    五 w e h 找到对方话语中的名词，用这六个武器去不断追踪任何冷场或尴尬的场景，随即就能破解掉。讲了这么多，我们来简单做一个总结。今天主要介绍了追踪式对话这个技巧分别有两个步骤，第一是找出对方语句的关键名词。第二是运用五
    w eh， 也就是谁是 什么 什么时间，什么位置，为什么以及怎么。做这六个疑问词，去对对方的关键词不断追踪。请记住追踪式对话这个技巧对任何尬聊都无所不迫。'
  - '[PAGE 39]


    # 对方也内向如何沟通


    如果你面对一个很内向的人，你越说话他就说的越少。如何让他更多开口说话呢？我们先来看一个十六世纪的实验，普鲁士皇帝腓特烈二世做过一个残酷实验，他将很多刚出生的婴儿从父母身边带走，然后分开关在一起。他让负责养育的护工只给予生存或一些物质满足，但不能有任何情感互动，比如抚摸，甚至接触等。结果这些婴儿无一例外都死掉了，这说明什么呢？如果缺乏情感回应，人就等于处于绝境，生命力就会选择死亡之地。


    西班牙有句诗歌是这样说的，死亡及无回应之地。世界上有一种很奇怪的疾病叫婴儿猝死症，它常常发生在婴儿睡眠的过程中。心理学家推测，这很可能是婴儿在缺乏回应的养育环境下选择了死亡。我们再来看到一个案例，在美国的路易斯安那州监狱中关押着全世界最臭名昭著的罪犯酷刑，都会让他们开心兴奋。但当他们不听话时，狱警会绑住他们手脚，扔到一个小黑暗的小黑屋里几天，但关押的犯人从小黑屋里被拉出来时，无一例外都会瘫软如泥。


    而且很多人性格从此大变，在完全黑暗不能动弹的房间里，人的内心没法和任何外在事物产生互动，再不可一世的罪犯，内心得不到外在回应，也会瞬间崩溃。所以，许多内向者为什么看上去总不愿和人说话呢？其背后最深层次的原因就是因为他们的生命经常得不到'
  - '[PAGE 40]


    应有的回应，他们的生命力更倾向于保守，总是蜷缩在一个地方。你越刺激他，他就缩得越紧。当然这是有两个原因造成的，一是天生导致的原因。之前我们说过，内向者因为身体更习惯郊游，副交感神经所支配，他们更喜欢安静的思考。


    通常内向者结构化思维更强，和周围的人常常无法保持同频。比如像埃隆马斯克那样的怪咖，八岁时就把它百科全书看完成。在邻居大家讨论月亮上是否有外星人的时候，马斯克就会给他们介绍，月亮只是一颗死寂的地球卫星，表面上只有无尽的尘土和宽心山，这种无趣的表达经常让马斯克得不到回应。二是父母所造成的压力。这种情况在我们这一代人身上非常明显。


    比如我们小时候某一次成绩考好了，然后很高兴的告诉父母，结果父母回应一句，你小子别嘚瑟。这次考好了，还有下次，这就让我们压力很大。原本兴奋的感受没有得到父母的回应。弗洛伊德在他的性学三论中讲过一个故事，一个三岁的男孩在一间黑屋子里大叫妈妈和我说，我害怕这里太黑了。妈妈回应说，那样做有什么用呢？你又看不到我。男孩回答，没关系，有人说话就带来了光。所谓的内向者，更多是在早期生命中陷入黑暗的人。


    回应就是光。所以和一名内向者说话，核心就是你要学会如何回应，学会如何回应对方。听上去不很简单的一件事吗？但其实大


    39'
  - '[PAGE 41]


    多数人根本就不会这个技能，他们只会站在自己的角度去沟通，如何学会回应呢？它至少包括这三个方面，第一，连接对方感受。我说一个自己的经历，我有一个弟弟是一个十一岁就已经长成一百三十斤的小胖子，给人感觉平时就不爱说话。后来我稍微留意了一下，原因是因为大家逢年过节才见面，而每次亲戚看到他脱口而出的就是怎么又长胖了，脸上的肉越来越多。


    这种话我感觉出来他会因为这些话感到非常自卑。所以我们每次看到他话就很少。于是有一次我问他，为什么那些人每一次见面都会说你胖呢？他摇了摇头，说，不知道，我就说，是不是因为他们每次找不到话，说他们根本就不懂表达呢。弟弟眼睛突然放大了，虽然他没有说话，但是我能感觉出来他很讨厌那些人的。这股情绪终于被另一个人感知到了。第二，接纳成自己人，让对方成为自己人。这是沟通中如此重要的细节，但多数人就是学不会。比如很多领导经常把这句话挂在嘴边儿，再不努力，下个月你就收拾铺盖走人。


    这就是把下属往外推。潜台词就是，你不是我们的人，只是雇佣者随时可以被我解雇。但如果说你是我们创业路上不可或缺的组成部分，这个感受就完全不同。第三，让对方觉得被选中了。圣经中有一个词叫做子万，意味着天选之人回应一个人从某种意义上说，就是强调你很重要，我选中你，并且愿意把我剩下的时间交付给你。比如有'
