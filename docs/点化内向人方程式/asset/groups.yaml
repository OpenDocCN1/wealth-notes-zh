    我们印象中外向开朗、具有亲和力才是成功者的象征。但其实世界已经变了，诸如埃隆·马斯克、扎克伯格、马化腾这样的内向者，早已悄悄地占领了世界。这个世界到底发生了什么呢？如果你看
    2008 年和 2018 年全球前十大企业对比，你会发现十年后还在名单上的公司，现在只剩微软和巴菲特的伯克希尔·哈撒韦，取而代之的是苹果、谷歌、Facebook、亚马逊、腾讯、阿里巴巴等科技巨头。这说明什么呢？说明我们已经全面进入一个高感性体验时代。2008
    年掌控世界的还是银行、石油、地产等行业，他们的竞争优势是资源。


    而十年过去，全球前十的有七家都是科技巨头，他们的核心优势是用产品去不断满足用户体验。


    想想看，我们在使用这些伟大产品时的感受。每天早晨在床上醒来，你都会忍不住刷一刷朋友圈儿。你在办公室，哪怕什么东西都不买，都想打开淘宝逛一逛。有些 iPhone
    发布，你就被勾了魂似的想立即冲到苹果店把它买回去。为什么你对这些产品毫无抵抗力呢？因为这些产品有一种超级能力，他们可以轻松打破你的防御。


    什么意思呢？在传统时代，打破防御主要是靠销售人员对你说服。所以诺基亚一年要发布几十款手机，他要给终端销售人员说服客户的工具。这款好，这款适合你，不喜欢我们还有其他的。但互联网时代的产品根本就不能让用户有选择和思考的时间。因为用户在屏幕前一旦开始思考，防御机制就会启动。我到底买不买呢？这产品放心吗？一旦这样你就没戏了。


    iPhone、微信等等这些好的产品就可以做到。在你没有想到时，他们就提前做了你想要的功能，你只会用着很爽，根本就不让你有思考机会。只有像乔布斯、扎克伯格、马斯克、马化腾性格内向甚至怪异的人才能做出这些产品，他们可以退到网络背后。根据数据，看到了人们在独处时的状态，他们可以像一只猫一样，蹲在一个地方去冷静观察，从而真正揣摩到别人内心这种从小到大养成的特质。普通人是学不来的，听上去很难，对吧？但如果你做到一点，你也可以，这就是真正去理解一个人，怎么才算了解一个人。


    一般我们都是看这个人的表面特征，比如性别、颜值、喜好、人脉、财富、地位等。但这些东西根本不算了解一个人。真正的了解是要看他的心理边界。一个人处在边界之内，他就会找到存在感。而如果他在边界之外就会感到恐惧。


    比如你的母亲平时在小镇生活和邻里之间的接触，就显得存在感十足。但如果去大城市，他就会感觉焦虑和恐惧，人通常会不惜代价去消除自己的恐惧。比如，你要去医院消除你对死亡的恐惧，通过读书来消除对未来的恐惧。这就是人类每天参与最频繁的活动形态之一，消除恐惧。


    而另一种活动形态就是不断满足边界之内找到存在感。比如你还记得微信的第一款小游戏《飞机大战》吗？他用最简单的操作，微信好友相互排名的方式，让你不断去刷存在感，消除恐惧，找存在感。这就是人类每天乐此不疲去做的事情，多数时候和动物没有太多差别。


