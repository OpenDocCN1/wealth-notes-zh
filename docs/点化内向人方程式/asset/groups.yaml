    我朋友的海鲜自助餐厅马上开业，您呢周末就可以去。在我发了朋友圈以后，当下就有七八个人在评论区表示要带孩子去。第二天，朋友把我的小故事写成文案，结果让餐厅爆满，都定不到位置。多数人展示一件东西，仅仅是简单的陈述，别人根本就不关心。而我呢描写了这段故事，不是刻意写出的文案，却达到了比文案好几倍的效果。因为恰好符合一个魔鬼公式，而全球几乎最有说服力的文案都被套了。这个公式今天就介绍给你，这个公式包含四个要素，分别是绕开防御核心目标、填充论据以及呼吁行动。我们先来看要素，一绕开防御。通常你给别人介绍自己或事物时，对方会开启心理防御机制。


    他的潜意识会说，你是不是又要让我花钱，你是不是把自己讲得很厉害，让我觉得自己很弱。我们对于别人的介绍天生会有排斥。那'
  - '[PAGE 21]


    你如何绕过防御呢？有三个方法。第一个方法是讲一个故事。比如我发朋友圈儿，第一句话就是五年前我出差佳喜来登饭店，大家知道我在讲故事，就会有兴趣往下看。百年孤独的第一句话就是，很多年以后，奥雷里亚诺上校站在行刑队面前，准会想起父亲，带他去参观冰块的那个遥远的下午一看就是好故事，让你卸下防御，忍不住想看。第二个方法，问一个关于对方的问题。每个人真正关心的只有自己。


    问一个别人真正关心的问题，尤其是他的痛点，他们是乐意听的。比如为什么读书的内容你很难记住，但你还要读书，你在家庭中究竟扮演什么角色等等等等。直接发问，让对方视角转移到自己身上。第三，提出一个震惊的事实，比如老人与海的开头是这么写的，老渔夫独自乘小船打鱼。他接连打了八十四天，但一条鱼也没有捕到哦，连续八十四天都没打到鱼，这就很吸引人呢。


    再比如一次ted演讲上一个医生是这么说的，就在我现在说话的十秒内，美国人因吸烟而死亡的人就有四个很震惊的效果，同样也立即引起关注。绕开防御。通常有一个七秒原则，七秒就需要通过一句话搞定对方，记住就用这三个方法。我们再来看要素。二，核心观点尽管大家都是在发自助餐的广告，但其他人的潜台词是，这是我朋友的餐厅，周六打折，这就是毫无目标，自然无法打动别人。而我的潜台词是，你应该带小朋友去吃自助餐，这就激起了很多人太忙对该'
  - '[PAGE 22]


    子愧疚的情绪。于是呢他们就去了，你经常会对身边人抱怨，说了这么多，你到底在说什么么呀？那些人说话没有思考自己的核心观点。你看一辆车那么复杂，但汽车厂商在给你介绍时都会有一个核心观点。


    比如沃尔沃永远在强调安全，宝马呢一直强调操控。核心观点，需要表达之前就想好三分钟之内的每一句话，都需要围绕这个观点来展开。核心观点通常是一丝不挂的，所有人都很害怕，不敢直视，所以应该给他披上衣服，让所有人都喜欢他，这就是核心观点，这就是要素。三，填充论据。比如一家面包房老板如果这样说，我们的馅儿饼最美味，这就不会有人搭理他。但他在面包房外的黑板上写了这样的一句话，巧克力爱好者请注意，让你的牙齿陷入这个二点五公斤重，满是软糖的火山馅儿饼吧，这就充满了诱惑。


