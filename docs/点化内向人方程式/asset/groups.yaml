    如果转发让几十万人看到，说不定就和现在很多人这种追求自在生活的态度连接起来，这就是外接数量。很可惜，我这位朋友从不注重这些，再比如我在网络上写作，这就是我一个人可以让很多人连接到我的思考。现在是一个关键行动领袖的时代。即便在家做家务收纳，也可以产生像斯舍离的作者。山下英子这样的人物。从前我们只会连接身边的几个人。


    比如你读书时写一篇作文，只需要让老师觉得满意就行了。表达沟通只需要身边的人能听懂就行了。但是在新的时代中，很可能你一下就连接到几千甚至上万人，这需要你必须具备和此前完全不同的视角，那就是产品思维。所以我从内向者沟通表达课第一节课开始，就反复强调内向者的六个重要的特质，分别是构成产品思维的。高感性特质、结构整理力和共情力构成领导力的专注力、倾听能力以及意义'
