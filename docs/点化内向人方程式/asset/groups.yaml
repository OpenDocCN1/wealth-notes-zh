    # 专治发言紧张脑子空白


    发言时紧张的脑子一片空白，这种感受你肯定有过，但这不是你一个人的问题。演讲家罗宾内特曾说，世界上通常只有两种演讲者，一种是特别紧张的，另一种是假装自己不紧张的。也就是说呢所有人在公众讲话时都紧张，这是为什么呢？原因要追溯到人类原始时期，想象你出现在一片空地上，一转过头，突然发现几十双陌生的眼睛齐刷刷的盯着你，会不会感觉鸡皮疙瘩猛起，心底一阵阵发毛呢？无论你看到的是一群狼或是其他部落的原始人，这都会让你极其恐惧。


    而恐惧的情绪会让你全身的血液急速流向四肢，这样可以帮助你逃跑或者战斗。这时你的大脑就会一片空白了，这是一个有关生存的'
