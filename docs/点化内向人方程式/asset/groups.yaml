    样的表达就会让别人感觉非常清晰。举个例子，我有个朋友，michael 是一家软件公司的销售经理。有一段时间他频繁和一家行业内最大的 公司接触，因为这家公司机构庞杂，决策缓慢，跟进了几个月都没
