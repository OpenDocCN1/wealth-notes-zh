    ## 被拒和否定的应对方法


    如果遭遇否定和拒绝，你该怎么办呢？在这里，我立即想到了美国诙谐大师马克吐温的应对方式，实在是一大过瘾。有一次，马克吐温应邀赴朋友晚宴，席间，他对一位贵妇人说，夫人，你太美丽了。不料那妇人却说，先生，我可是遗憾得很，我不能用同样的话回答你啊。头脑灵敏，言辞犀利的马克吐温笑着回答说，哎，那没关系，你也可以像我一样说假话呀。


    还有一次，法国名人泊歇取笑美国人历史太短，对马克吐温说道，美国人没事的时候，往往喜欢怀念祖宗，可是一想到祖父一代，就不能不打住了。马克吐温回敬说，法国人没事的时候，总是想弄清他们的父亲是谁，可是很难弄清楚。这个回答，让泊歇自己都不由自主的笑起来了。


    用幽默的方式去应对，无疑是最高级的。一时半会儿可能很难学会，但是如果理解其中应答的原理，还是能让我们更善于处理别人的否定、批评或拒绝。具体是哪些原理呢？主要有这三个，第一个原理叫全然接受，也就是对否定或批评观点做到不含敌意的接受。举个例子，二零一三年，奥巴马访问以色列，在当地一所大学发表演讲，突然，有名学生大声抗议闹场，安全人员随即将其架离会场。这让正在激情演讲的奥巴马略显尴尬，说，事实上，有这样的情况发生，才让我感觉像在美国一样。在哄堂大笑当中，他又补充了一句，如果没有人闹场，我会觉得怪怪的。


    在公共场合被抗议，这是很尴尬的。演讲的节奏也被打断，但是奥巴马却对此表达了接受，却获得了很好的效果。为什么全然接受反而会让效果更好呢？西方有一个谚语叫房间里的大家，就是这屋子里有一头大象，但是所有这屋子里的人都假装没有看见。也就是说一个问题明显的问题大家都避而不谈。这其实会让双方都很紧张。实际上你把屋子里的大象一指出来，大家反而就如释重负了。其实在许多高级的表达中都会强调全然接受这个概念，比如脱口秀，非暴力沟通。


    还有我们刚刚说到的马克吐温这种大师级的幽默中。当然幽默这种表达方式会略有不同，要多一个逻辑接洽的过程。比如，贵妇人对马克吐温说，遗憾得很，我不能用同样的话回答你这句话时，这是非常犀利的指责。马克吐温长得不秀，而马克吐温呢却直接接受。那没关系，然后逻辑接洽到你，也可以像我一样说假话，这就显得非常传神，这是第一个原理。


    - 全然接受。


    我们接着来看第二个原理，表达感受，很多人遭遇否定或拒绝后，第一反应是解释，想让对方再重新进行肯定。但这几乎没有好处。比如你经过大量沟通，客户依然拒绝购买你的产品，而这时你再进行解释，就会引起对方更大的抵触。那些在电话里用最烂的技巧对你进行推销的人，是不是会让你很反感呢？但我之前看到一个案例却非常巧妙，这是销售洗脑这本书的作者哈里弗里德曼年轻时候的一个故事。弗里德曼以前是一名家居推销员，有一次遇到了两位老人，想购买一款昂贵的头层牛皮沙发，但整整聊了三个钟头后，两位老人还是决定放弃购买。


    于是，弗里德曼拿出一本内部使用的销售手册，然后真切的对两位老人说，先生，太太，自从你们走进店里，我使用了这本书里一共十二个技巧，我完全尽力了，所以感觉非常沮丧。能不能麻烦告诉我，我还有哪些地方没有做好呢？这样我会努力改进，因为我真的非常热爱这份工作。这样表达自然打动了两位老人。沙发最终成交了。表达感受，这一步当然是要建立在全然接受这个基础上。这对于多数人来说确实有点难。


    比如领导见到我们迟到，一般人就会说，今天实在太堵了，或者找各种原因，这其实还是不愿承担责任，这还不如直接表达感受。我真应该每天早点起来，迟到，让自己觉得太难堪了。


    最后我们来看第三个原因，提出赞扬，对批评或否定者要提出赞扬。确实你没有听错，这可是解决问题的大杀招。先给你讲一个故事，陶行知是民国时期东南大学的校长。有一次看到学生王友用泥块砸同学，当即制止，让他放学到校务室。


    校长是谁？王友已经在门口等着，准备挨训了，没想到陶行知却给了他一块糖，并说，这是奖给你的，因为你很准时，我却迟到了。王友惊疑地瞪大了眼睛。陶行知又掏出第二块糖，对王友说，这第二块糖也是奖给你的，因为我不让你再打人时，你立即就停止了。接着，陶行知又掏出第三块糖，我调查过了，你砸的那些男生，是因为他们不遵守游戏规则，欺负女生，你砸他们，说明你有跟坏人作斗争的勇气，应该奖励你啊。


    王友感动极了，哭着说，陶校长，你打我两下吧，我错了，我砸的不是坏人，是自己的同学。陶行知这时笑了，马上掏出第四颗糖。因为正确的认识了错误，我再奖励你一颗糖，我的糖没了。我看我们的谈话也该结束了。感受到赞扬的巨大力量了吧。


    从表面来看，经常对他人进行否定、批评或拒绝的人，似乎拥有一种权利感，可以随意对别人进行评判。但其实，他们的心理边界往往比较狭窄，一旦对方触碰到，他们就会进行攻击。他们其实是可怜的，是更弱小的群体。而如果你使用赞扬这种方式，这相当于宣告你的心理边界很宽广，你可以对他人进行完全的接纳。比如，当两位老人拒绝购买沙发时，弗里德曼反而让他们告诉他还有哪些做的不好。这既从心理上完胜对方，又更好的化解了尴尬，这都是种最好的方式。


    我们来做个简单的总结，今天主要分享了应对否定和拒绝这些负能量沟通中的三个原理。


    - 第一是要做到全然接受。

    - 第二是主动表达感受。

    - 第三是提出赞扬。


    坦白来说，要做到这三点，需要一个更强大的内心。但如果你每次站在一个设计者的角度，把整个沟通当成一种游戏，对方呢只是你打怪升级路上的一个个小怪物，也许一切就很容易了。


    ## 话多不等于会表达


    今天的话题是如何成为说话有分量的人呢？几乎每个人都希望自己说出去的话很有分量，这也是说话想要达到的最高境界。那么究竟什么叫说话有分量呢？今天先来看四个不同的故事。


    故事一，丘吉尔在一九四八年时去往牛津大学做一个主题为如何成功的演讲。面对充满期待的牛津学子和全世界各大新闻媒体，丘吉尔却做出一个惊人举动，只用了十秒时间完成了整场演讲。我的成功秘诀有三个，第一是决不放弃，第二是绝不绝不放弃，第三是决不决不决不能放弃。我的演讲结束了。


    故事二，一个正在读硕士的美国女生夜晚在纽约小巷中遭遇抢劫，歹徒用枪指着她，她却这样表达，我现在真的很紧张。我知道你也很害怕，我知道你最近可能遇上了一些麻烦，而我只希望不要受到伤害，我们完全可以一起来解决问题，好吗？


    故事三，一位中年女性职员对着一位男同事说，捐点款吧。因为这是我五岁女儿发起的一个保护流浪狗项目。


    故事四，电影《三傻大闹宝莱坞》男女主角有过一次这样的对话，男主角兰彻见女主角皮亚手上带了一块旧手表，于是说，你这块表是你妈妈留下的吧。


    皮娅非常吃惊和激动的问道，你怎么知道啊？兰彻回答，在你姐姐的婚礼上，你打扮的光鲜亮丽，但是唯独带一块旧表。今天是你们家所有人聚在一起，唯独你妈妈不在。所以这块表会是谁的呢？皮娅听到这个回答就招架不住了，你一定能听出来以上四个故事的主角丘吉尔、遭遇抢劫的女研究生、女性职员，以及《三傻》中的兰彻，他们的说话都很有分量。为什么会这样呢？因为这四个主角都能让听众做到欣然接受。


    丘吉尔是让牛津学子接受了一种强烈的、永不放弃的精神。美国女研究生让歹徒接受了谈判协商，中年女性让男同事心甘情愿接受捐款。《三傻》中的兰彻，让本来反感他的皮亚，最终接受了他。记住这一点，说话有分量，就是说出去的话让别人真正接受。所以你会发现，尽管身边多数人都喜欢长篇大论，但他们的说话根本没人听，这就是没有分量。


    那么如何把你说的话打磨的有分量呢？我们就借助以上四个故事，分别来查看四种实用的方式。


    - 方式一、不断重复。


    丘吉尔的第一绝不放弃，第二绝不不放弃。第三，绝不绝不绝不能放弃。这段演讲已被奉为经典，引后世无数人效仿。因丘吉尔在二战中的卓越表现，这种重复的力量已经感染了所有人，所以引起当时的轰动。请一定要记住一定要记住，一定要记住，宁可把你的观点重复一百次，也不要表达一百个观点。因为当你表达时，别人的爬行脑会自动把重复的信息视为最重要的信息。所以你看那些最成功的广告，很多都是靠重复占据了你的大脑。


    我们再来看方式。二，实现共情。在纽约街区遭遇抢劫的女研究生，用了一段非常精彩的话术，最终歹徒只是拿走了她的钱。这是一个真实案例，是这位女生在学习马歇尔教授的非暴力沟通课程之后，一次十分精彩的运用。其中最关键的就是这两句。我知道你也很害怕，你最近可能遇上了一些麻烦。


    因为纽约街区的这些黑人罪犯从小就不被人理解，但是女生却能实现其共情，这是非常了不起的两句话。共情并不是简单的说，我理解你这样的话，而是需要准确感受到对方的情绪。还有一个案例是这样的，一个常年忙于生意的父亲，知道女儿吸毒以后约他谈话。


    女儿一见到父亲就歇斯底里的咆哮，我知道你失望极了吧，你又要拿出那些人生道理，对吧？但父亲异常平静，只说了一句，这么多年，你一定过得很不容易吧。这句话一下戳中女儿内心，立即哭着向父亲道歉。


    我们接着来看方式。三，提供理由相信任何一个男士遇到对方说，这是我五岁女儿发起的一个保护流浪狗项目，都会慷慨解囊的。提供一个理由，哪怕是那么靠谱的理由，都能让你的表达增加分量。


    比如你去学校打印室排队打印东西，忽然有一个人插队到了你前面，你能答应吗？肯定不行。哈佛大学心理学系曾经做过一个实验，他们分别测试插队的三种情况，第一是直接插队，这会引起所有人不满，百分之九十的人会拒绝。第二是直接对别人说，我要打印五页文件，可以用下打印机吗？直接表达意图，不给理由，也会有百分之四十的人拒绝。


    第三是对别人说，我可以下打印机吗？因为我赶时间。给个理由，被拒绝的几率只有百分之六。稍微冷静想想。因为我赶时间这种理由说了，等于没说呀，但是就是会被人接受。因为大脑的资源是有限的，许多无关紧要的小事儿别人不会过脑子，随便给个理由就行。


    方式四，黑客级表达。《三傻》中男主角其实采用的是黑客的表达方式。这可是一个大杀招。


    所谓黑客的表达，就是指绕开别人的防御直击内心深处，让别人瞬间接纳。再比如福尔摩斯看到华生的第一眼，就说，你是从阿富汗回来的，这让华生非常惊讶。福尔摩斯是这样解释，别人介绍你是个医生，我看你很有军人气势，那么你就是个军医，你的脸色很黑，但手腕很白，那证明你的皮肤本来是很白的。那你是刚刚从一个阳光很充足的地方回来，你的左臂受了伤，动作看上去有些僵硬。那么一个英国的军医在热带的地方历经艰辛，左臂负过伤。最近英国在什么地方打仗呢？是阿富汗。


    所以我认定你是从阿富汗回来的，这让花生直接瘫软在沙发上。黑客级表达并没有想象的那么难，因为多数人在对话时并不敢直击对方心灵，但如果你能恰当的直击一下，会有意想不到的收获。讲了这么多，我们简单总结今天主要分享了四种让你说话变得有分量的方式。


    分别是：


    - 第一，不断重复。想想看丘吉尔的方式。

    - 第二，实现共情。回顾一下纽约街区遭遇抢劫的女研究生。

    - 第三，提供理由，想想图书馆打印的实验。

    - 第四，黑客级表达，看看福尔摩斯或者《三傻》这部电影吧。


    放下才能接受，接受才有新的力量。记住最好的表达，就是让人接受。


    ## 面对强势如何处理


    你在与人合作时，遇到非常强势的同事，让你很不服，该如何应对呢？首先你得搞清楚什么叫做强势。这个话题非常有意思。我们先把视角放到原始人类社会中。一万年前的新石器时代，各地人类开始对动物进行驯化，但逐渐演化出了两种不同的驯化方式。第一种叫：


    听上去有点难，但做到以下两个步骤就可以搞定。我们先来看第一个步骤，建立对方的虚拟控制感。什么意思呢？举个例子，为了训练儿子数学，你买了本习题集，每天给他布置任务，规定哪页他就得做哪页，他完全被动。但有一天，儿子说，能不能让他自己选哪页就做哪页。


    你想了想也没问题，从此儿子做题都是他自己选择做哪页。之前是你布置任务，之后是儿子自己选择，其实效果都一样，反正最后他会全部完成。但虚拟控制感却让儿子做题的愉悦感和积极性都提高了，每个人无时无刻不在追求控制感，即便不能做到真正控制，来点虚幻的都行。你的同事就是这样，外表强势，内心却突然失去控制。如果这时身边的人越抵触，他，就更多会感觉失去控制，就会看起来更强势。


    所以你得给他注射两针控制感，让他虚拟满足一下，这需要你用到一个重要的表达技巧叫 yes. and 比如对方说我们一定要这样做，因为这是最好的方案。如果这时你直接说
    no，你的方案不行，这就没法聊了。断别人后路，同时也断了自己的后路。所以你可以说的是，这个方案看上去非常棒，特别是其中一个思路，你能再给大家解释一下吗？ yes,
    and 在中文中其实就是是的，而且在表达认同的同时，还要帮助对方多挖掘一个信息。即便最后没用到他的方案，但他的控制感被满足了，就会放下强势的态度。


    但你可能有疑问，这不就是奉承吗？如果他强势的观点根本就是错的呢，也要这么肯定他吗？这就需要我们用到第二个步骤，建立协同开头。我们讲到了人类与狗的关系，更多就是一种协同。这是一种什么概念呢？在原始部落中，狗和人类关系比现代社会要紧密很多，因为从某种意义来讲，狗与人类已经形成一种生命共同体的关系了。


    狗的嗅觉、听觉更快的速度和杀伤力，以及人类的思考力、统筹规划、使用工具的能力等结合起来，形成了一个一加一大于二的更大的生命体。无论是狗还是人，扮演的都是这个更大生命体中器官的角色。很强势的人，其实也想参与协同。只不过他的言下之意是，哥几个合作，我出头脑，你出胳膊，你跑腿儿，这让其他人肯定不爽了呀。但请注意，一旦你坚持认为他的强势方案是错的，其实也意味着你也处于强势之中。想用自己的框架去驯化别人，想用自己的头脑取代别人的头脑，这样就根本没法解决问题。


    世界哪里有对错，只有看问题不同的视角而已。所以你还得用 yes and 这个句式。因为通过不断挖掘一个信息，其实也可以让他看清楚彼此协同的真正关系。再举个例子，比如同事说我们在四十八小时内一定要把这个方案弄完。而你说的是，我们确实需要更多行动。而且这个方案的方向应该是用户接受的。同事就会说对于用户的接受程度，我们之前确实有过考虑。你接着说，那挺好的，而且相信...


    第三种方式。这是因为我们的文化，更强调我们的文化，更强调以和为贵、妥协和回避的心智模式，已经在我们的潜意识中根深蒂固了。


    你看地图就会知道，中国的西部是高山和沙漠，北部是草原，东部、南部是海洋，在地理上处于全封闭状态。所以，长期以来，社会资源总量不变，相互间更多是零和博弈，也就是我增加，你就减少这样的局面，要么妥协，要么回避，实在受不了就竞争，这就是我们长期面对分歧的处理方式。


    但长期以来，西方和我们的文化截然相反，无论是阿拉伯地区还是古希腊和罗马地区，都盛行交流和商贸。所以他们更习惯合作的方式。比如除了以上三种，下面还有两种方式。先来看第四种方式，分工协作。这最早由亚当斯密在《国富论》中提出，他讲到一名工人凭他自己一天连二十根大头针都制作不出来。但如果有二十名工人参与分工协作，那么一天却可以生产四万根大头针，


    这就是分工协作的力量。面对这个苹果，你和同事同样也可以采用分工协作。比如一个人负责咬苹果，一个人负责把剩下的苹果籽儿种成一棵树，等苹果树长成，就能获得至少一百个苹果。而第五种方式是创造更多，这是最厉害的方式，也是二十一世纪以后很多新型公司的参与社会的方式。比如双方还是看到一个苹果，而我们分别手持苹果给来一场即兴演讲pk，然后让同事下注。最后，无论谁赢得赌注，


    至少可以买二百个苹果。


    面对和同事的分歧，当然需要你转化成第四种，最好是第五种方式。但这会让参与者略微损失一些短期的利益，所以需要使用一些技巧。具体有三个，我们分别来看看。


    第一个技巧，确定分歧。假定你是一家做智能手环的公司。在一次会议上，同事坚持未来三个月，公司应该削减成本。他给出的理由是，一，由于其他公司的低成本竞争，公司产品利润严重下滑。二、客户对于穿戴设备的注意力正在下降，不值得更多投入。尽管这两点理由很有说服力，但你却坚持认为，在市场低迷的时候，更应该投入费用到客户分析及营销上。


    你也给出两点理由，一，未来职场压力会越来越大，会有更多人选择跑步来缓解压力。二、客户对于自己身体数据的掌控感，这个需求会越来越明显。你给出的理由也很有说服力。一个想削减开支，一个想增加投入完全是相反的观点，怎么办呢？实际上你们的分歧并不是增加或减少开支这个表象，你完全可以向对方确认。我想确定一下，你是想削减开支来增加公司的财务利润，还是有其他方案的。对方可能说出真话，其实我更想把资金节约起来，看看市场的其他可能性。


    这时，他的真实想法有机会被人聆听，就很乐意分享。我们再来看第二个技巧，界定标准。当你知道了别人真实需求，就需要做出第二步，界定双方的尺度标准。实际上很多时候我们和他人的矛盾就来源于此。比如一个妻子总觉得丈夫陪家人和孩子的时间不够，而丈夫却觉得自己已经花了很多时间来陪伴家人了。


    双方标准不清晰，就会有很多麻烦，所以丈夫应该对着妻子说，亲爱的，我知道陪伴家庭有多么重要，不然会错过孩子的成长以及家庭的美好时光。每周花六个小时是我们的共同目标，尽管有些难，但我希望可以做到。你觉得呢？再比如在公司，你可以说我所指的投入主要会用在开辟新产品，调研新用户这些项目上。市场竞争激烈的好处在于用户尝试成本和供应链成本都很低。所以我们可以抓住这个转型的机会。


    所以你看标准确定后，你其实也提出了节约成本这个概念和对方的观点也不谋而合。最后我们来看第三个技巧，想象和创造。我们一般会觉的想象和创造很难，但其实所谓想象就是把不相干的事物进行连接。而所谓创造，就是把连接后的事物生产出来。赫尔曼黑塞的小说《荒原狼》中提到了一个有着无数可能性的世界，这是没有约束，能允许任何思想存在的第三空间。迪士尼公司也曾经借此概念提出了魔幻剧场方案。相比保守的头脑风暴，魔幻剧场的设定号称只对疯子开放，想法越离奇，最后收到的效果越好。比如，针对客户对于自己身体数据的掌控感，这个需求思路完全可以说的天马行空。实际上我们一直说到的智能手...'
  merge: 1
- raw:
  - '[PAGE 76]


    环的案例是一个真实故事。在二零。一二年时，公司内部经历了一系列讨论和创造性思维拓展，最终他们决定转型。原本他们是国内最早做手环的公司之一，但成功转型为运动加软件的开发道路。


    这家公司就是咕咚运动。当年我亲眼见证了他们生死攸关的转型，非常精彩。好，我们来做一个总结。今天我们主要说到了通常面对分歧的五种方式，分别是竞争、妥协、回避。这三种是零和博弈的游戏，而另外两种分工协作和创造则是正和博弈，凭空就能增加收益的。同时我们介绍了三种实现正和博弈的技巧，分别是确定分歧、界定标准以及想象和创造。


    # # 被领导误解的化解之法


    解决的问题是被领导误解，你究竟该如何处理关系呢？刚好最近我有个朋友遇到了一个棘手的问题，朋友叫小新，是一名今年开始读博士的女生，在一所国内知名大学的科研室里搞我们听不懂的复杂科研。最近，小新和科研所的大boss，也就是他的博士生导师，关系渐行渐远。小新给我发微信，说他都一个多月没和大boss
    说说话了。


    事情的原因是，一个月前所有博士生开始选择科研的课题方向，几乎绝大多数人选择了和大boss 正在研究的课题。而小新和另外几名同学却选择了另外一个课题。这种现象呢在学术圈很常见，每个人'
  - '[PAGE 77]


    选择自己感兴趣的领域，但小新却和同学们私下讨论过不同课题经费的问题。这事儿似乎传到了大boss耳中。有一次，大boss在会上直接说，让大家有什么就当面商量。


    小新感觉在看着他说的似 的，从此开始，只要和大boss说话，小心，就感觉心里堵的慌，这导致他们的关系开始疏远。我们经常因为一句话，甚至一个眼神就被领导误解了。而一旦出现隔阂呢，牛几乎不可能冲到他的办公室。开诚布公说清楚，通常只能任由尴尬和误解扩大。


    很多人几年下来，和领导关系也就这样了，这怎么办呢？其实每当出现这个情况，我更想问一句，为什么会觉得领导误解你呢？比如和小新聊天时，我专门问了问大boss的情况，他说这是一位校内德高望重的大教授，学识渊博，为人谦和。但就是和他处不好关系，所以我个人推测是往往认为自己被领导误解的，很可能是误解了领导。因为在巨大的权力差别下，别人可能并不在乎。这就像一只蚂蚁去咬人一样，人是不会对着一只蚂蚁发多大脾气的。我更确定的是，这是我们自己有了过激的情绪反应而已。


    因为人原本就是群居动物，我们非常习惯在一个封闭的环境中存在空间。比如远古时期，在部落中，一个现代人在家庭中，再比如小新，在科研室里，他们通通都需要存在空间。而一旦这个封闭环境'
  - '[PAGE 78]


    里有一个掌控资源的绝对权威，毫无疑问，他的每一个反应都可能影响着你的存在感。但一味讨好大 boss 却不是好办法，身边人会反感你直接剥夺存在感。所以你应该进行三个步骤，第一步，在更大的存在空间中寻找存在感。


    很多人在一个群体里找不到存在空间，就把自己隐藏起来，成为隐形人，这是不正确的。因为存在感是我们的生存基本动力。你会发现很多有抑郁症的人，就是在家庭、朋友或职场中，几乎和周围人断开了联系，就像剪刀把一根一根线剪断一样。他最终找不到存在空间，很可能选择自杀。然而，一味在一个地方要存在感，又会显得很自恋，从而也得不到存在空间。


    这个问题呢有点两难。正确的做法是放大存在空间的尺度，从而找回存在感。比如我们反复说到的埃隆马斯克，从小父母离异，在家遭遇父亲的家暴，一度非常绝望，但他却通过大英百科全书中找到了存在感，从小就希望把自己放在拯救人类这个更大尺度的存在空间中，于是走出了家庭的阴霾。而小新也告诉我，他会坚持钻研自己选择的课题，因为他认为这会很大程度上改变国内的技术排名。这个思考尺度一定也能把它找回存在空间。再比如你偶尔在地铁上会看到一些因相互拥挤而造成的摩擦。


    试想，如果你今天马上要去谈一个五千万项目的生意，你还会去'
  - '[PAGE 79]


    跟别人计较吗？你宁愿主动说对不起，甚至赔点钱，然后溜之大吉。


    存在空间的尺度不一样，问题一下就解决了。至于为什么一定要找存在感，你可以理解为这就是每个人的精神食粮。如果你不去找，就会更加饥渴，到时候你的神经系统会逼迫你找更大的存在感，这就会给自己和身边人带来更大的困扰。


    而第二步是把所谓的误解彻底遗忘掉。什么是所谓的误解？其实也就是你认为别人误解了你的动机稍微有点绕。我们再来看看小新的案例，小新私下和同学讨论课题经费这件事儿。他的动机只是简单吐槽一下，为了让你听得更清楚，我们称为动机
    a 简单吐槽。而小新会认为大 boss 会误解他，潜台词是。大 boss 认为小新的动机是质疑大 boss 偏袒自己。


    课题小组经费分工不匀，这是动机臂大 boss 偏袒自己课题小组。但实际上呢，动机 b 只是小新的假设，根本就没有办法去验证，更没有必要去解释。所以你唯一能做的就是忘记误解这件事儿，应该重新去建立关系。怎么去建立关系呢？我们再来看第三个步骤。第三步，用请教的方式去重建关系。请注意，这可能是你面对和领导的误解时，唯一能够。使用的方式，甚至这就是你和领导相处时最好的方式，那就是主动让他给你几条建议。


    比如小新完全可以向大 boss 询问如何开展课题，包括一些行业'
  - '[PAGE 80]


    大环境，甚至是请教如何处理情绪这种问题，任何人都不会拒绝别人的请教，因为人都喜欢向别人给建议。比如你过年回家就会发现，长辈们特别喜欢给你提点建议，因为这是彰显他们权力的表现，这是他们的心理需求。有一个美国大学的研究，找了一百二十四个商学院研究生，先对他们进行心理测试，看看每个人的权力欲都有多大。然后两两一组对话记录，他们在对话中给对方提了多少建议，结果是权力欲越大的人，越愿意给别人提建议。


    我一直认为，任何人都有自己擅长的地方，向别人询问一些你不知道的东西，又可以学到东西，又可以让对方感觉很舒服，这个习惯实在是太划算了。


    我们来做一个简单总结。今天我们讲到，如果遭遇被领导误解，你应该采取三个步骤。第一步，在更大的存在空间中找存在感。第二步，把所谓的误解彻底遗忘掉。第三步，用请教的方式去重建关系。其中我认为最核心的其实是第一步，因为绝对权威的回应，我们才会感觉自己存在。更多时候其实什么都没发生，就是我们的存在感让我们产生了焦虑而已。最后分享卢米的一首诗歌给你。无论如何，别忘记张开你的双臂，展开后，有可能会再次失望，但也有了希望。而如果你一直封闭着的话，那就什么都不会有。'
  - '[PAGE 81]


    # 沟通有代沟如何让别人认同


    也许是你平时没怎么去关注的问题。所以我们当中大多数人并不知道如何用正确的方式和父母沟通。今天我们我们就来聊聊这个话题。首先问你一个中国家庭中的普遍性问题，为什么你不听话，父母就受不了呢？心理学家武志红曾经在公众号上分享过一个案例，一个广东女孩找武志红咨询，说，她爱上了一个不错的男人，但父母死活就是不同意，母亲还因此得了心脏病。


    于是，武志红约见了这一家三口，他发现那位母亲的态度非常坚定。为了不让女儿和那个男人结婚，他可以付出一切代价。通过开导，这位母亲，说出了他反对这桩婚事的真实理由。他说，女儿原来什么都听他的，而且向他承诺过，恋爱前一定会带那个男人给他看，只有母亲答应了，他才会继续发展。可是女儿背叛了他，竟然在恋爱半年之后才告诉他，他说这些话的时候非常痛苦，也特别愤怒。


    所以核心问题是，之前女儿什么都听他的，对母亲而言，这是无比甜蜜的事情。而现在女儿竟然瞒着她谈恋爱这件事儿，彻底摧毁了这种甜蜜，这导致了他的痛苦和愤怒。我们从小到大的环境就是孩子听不听话，基本决定了这个孩子的好坏。中国家长夸孩子的时候，也经常用听话和乖这两个词听话。哲学可以说在中国无处不在，你身边会有很多人时刻都要担心，怎么才能表现出来更听话，尽量不让父母'
  - '[PAGE 82]


    担心。所以，在处理父母关系时，我们不禁要想一想，究竟谁才是孩子，谁又是父母呢？很多时候，我们认为不同年代的想法引起了代沟，但其实是共生关系，引起了代沟。


    请原谅我今天把问题剖析的稍微深入一些，因为你必须弄明白什么是共生关系。你可以理解为，这是彼此帮助对方建立一个小小的房间。比如你从小喜欢看百科全书，你的知识面很丰富，但是身边的人就和你玩不到一块儿去。同时，父母两个人对知识也没有太大兴趣，所以你感觉很压抑。但是突然一天你的叔父来到你家，不知道怎么就和你聊到了百科。


    于你非常开心的给他介绍你脑子里的各种知识。整个下午，你感觉充满了阳光，从此你非常喜欢和叔父在一起聊天，这其实就相当于叔父帮你修建一个房间，让你把学习的乐趣可以尽情放在里面。叔父对于你来说就是一种共生关系，因为有他的倾听和回应，才让你找到了这部分的生命之光。


    事实上，我们身上的很多部分都是因为亲密关系的容纳才建立起来。你当然得感谢父母，从你婴儿开始，父母就帮你建立起了一个个心里的小房间。比如你在摔了一跤之后，父母会营造情绪空间来接纳你的情绪。当你在某次考试后不知所措时，父母又会营造一个成长空间。但与此同时，你无形中也帮助父母建立起了控制空间，因为每个'
  - '[PAGE 83]


    人都需要追求控制感。而面对一个小孩儿，是最容易建立起控制感的。


    在心理学中，流行一句话叫你存在，所以我存在，你和父母是相互依存的共生关系。


    对共生关系的过度依赖，正是许多中国式家庭不幸福的根本原因。举个例子，有一种孩子叫别人家的孩子，这句话相信给你造成了不小的心理阴影。父母经常让我们去看看别人家的孩子时，好像是为了让你知道上进，但是在他们的潜意识里并非如此。从精神分析心理学的角度来说，其实有两个原因，第一是父母要通过否定孩子来证明自己的权威，在孩子面前表现出自己的价值。这样孩子对父母的依赖性才会更强。第二是社会竞争太激烈了，家长很焦虑，为了缓解焦虑，就把自己的不安全感投射在了孩子的身上。


    再比如，你想过得更加自由，做自己想做的事，完成想实现的梦想，但父母却坚持让你去国有企业找一份稳定工作。原本是你自己找工作，但父母却需要你身上坚持他们的价值观，这也明显是共生关系。让父母误以为你的所有选择也是他们的选择，他们更多的把你的人生当成了他们的人生。面对这个难题，你最需要做的是两个方面，第一是捍卫自己的心理边界。


    比如像找工作这种事儿，那其实就是你自己的事情。父母如果认为你找一些不稳定的工作，让他们没有面子，那其实是他们自己的问'
  - '[PAGE 84]


    题，你坚决不能让他们侵犯你的边界。即便有很多能力不足，需要他们的帮助，也应该说清楚，这是寻求帮助，而不是让他们来主导你的生活。第二是建立彼此的控制感。如果你一直听完了前面的课程，你应该对这个概念非常熟悉了，依旧是控制感导致的问题，依旧需要你去帮助父母建立虚拟控制感。


    只要他们的控制感一满足，你自己的愿望是很容易实现的。表面上他们都是父母，其实更像是又哭又闹的。孩子，而同时你自己也需要建立对自己选择的信心和控制的感，这才让你守得住自己的边界。想想看你刚出生时什么都不懂，整天哭闹，父母对你无比包容。现在他们已经逐渐老了，控制感在这个世界越来越弱，满足一下他们也未尝不可呀。


    做一个简单的总结，今天我们深刻剖析了造成沟通困难的根本原因，这和我们的常识有点不一样。是由于家庭过度的共生关系而导致的。要消除这种误解，最好要做到两步，第一是捍卫自己的心理边界，第二是建立彼此的控制感。有一句话是这样说的，父母总是以为我们不会长大，他们错了，我们总是以为父母不会变老，我们也错了。希望你对待父母多一点包容和理解。'
  - '[PAGE 85]


    # 内向必须改善沟通


    我们还没有说到一个核心问题，内向者为什么要改善沟通呢？因为仔细一想，其实有很多工作是不太需要沟通的。比如我长期就是在做数据分析，更多是和冷冰冰的数据打交道。那么作为一个标准的内向者，我为什么想去改善自己的表达呢？这个为什么我稍后来说，今天先得给你聊一个脑洞更大的话题。首先你想想看，为什么人类会有语言，人类会有这么丰富的沟通呢？动物都是有语言的，比如鸟类或者大猩猩，最多可以掌握一百多个语言符号。


    意思有个试验是这样的，一九七三年，一只在美国刚出生的黑猩猩叫做尼姆，被送到一个人类家庭。研究者就想看看，一直从小跟着人类的黑猩猩究竟能不能掌握人类语言。尼姆跟着人类父母过着自己的生活，人类父母给他穿衣服，每天和家人一起吃饭玩耍，随后开始教他学习人类的手语。实际上，黑猩猩是人类的近亲，两个物种遗传物质的相似性高达百分之九十八点八。尼姆确实也做到了很多复杂的东西，比如利用复杂工具，权衡利弊，自我意识等等。


    他也学会了，但他能不能彻底掌握人类的语言呢？答案让所有人失望，不能而不能的原因恰恰就是语法。经过学习，黑猩猩尼姆总共掌握了一百二十五个手语手势，也确实能够表达杯子酸奶吃喝这样的词汇。但是把词汇像搭积木一样组装成句子的能力，这条边界线，尼'
  - '[PAGE 86]


    姆却终其一生也没能跨越。


    比如我喝酸奶这么一个简单的意思，尼姆却对其中的排列组合无法分别，他会比划出我喝酸奶。酸奶喝我我酸奶喝这样奇怪的句式，尼姆根本就无法理解其中的差别。核心就是，尽管动物可以掌握词汇，但是他们没有办法理解语法。那么语法究竟意味着什么呢？你可能觉得语法不就是那个从前在英语课上让我被折磨的东西吗？其实我们在课本中学的语法只是叫语法基本规则，广义语法的意义要大得多得多。


    中国古代的甲骨文就是没有语法的，每一个字都有一个单独的意思。这其实和黑猩猩尼姆的语言能力是一个概念，只能用有限的单个符号来交流信息，比如表达安全危险，想吃睡觉，这些意思问题都不大，但要表达复杂意思，那就不行了。比如三角形的内角和等于一百八十度，人类一思考，上帝就发笑。这些复杂的趣事是无论如何不可能用一个词来表达的。


    当然，语法结构也造就了思维模式的不同。所以中国自古是偏符号的形象化思维，而西方更多演化出偏逻辑的哲科思维。所以，西方文化引领着现在的世界稍微深想一想，你就会发现，现在普遍生活在社会中下层生活被动的人群也更多喜欢符号，比如刷抖音、发微信时使用各种表情。而偏向逻辑的结构化思维的人，则更喜欢丰富的知识，'
  - '[PAGE 87]


    更爱用复杂的语言在公共场合表达或是写作语言决定思维，思维决定层次。这里我们又提到一个词叫结构化思维，这就是我们内向者沟通表达课反复提到的一个概念。


    同时我也强调这是很多内向者的天赋，他们天生就喜欢安静思考，在信息间建立丰富的结构。曾经在对这门课程的事先设计讨论上，我曾遭到质疑，为什么要给那些不善言语的内向者讲如此深入的概念，或许多丰富的表达技巧呢？他们不都是表达中的小白吗？但我坚持认为，内向者有丰富的思考，这意味着我们的语法结构比常人更复杂。只是可能我们没有经过训练，很难把这些复杂的大脑结构用语言表达出去。所以内向者才看上去不善言辞。前二十一讲，几乎每一篇都提供了一个单独的表达结构，就像一个万能工具箱一样。如果你穿上，一定可以让你头脑中的复杂概念源源不断的输送到其他大脑里。这是我做数据分析这几年发现的秘密，我亲自处理过许多复杂的信息结构，感觉真是妙不可言。


    比如我会去挖掘人类普通心理控制感和一个互联网产品之间的关系。你会发现如果从神经网络的角度说，人类个体许多行为其实比一个动物高级不了哪里去。同时我也知道了理解这个世界复杂的结构对于一个人的一生也有着无比重大的影响。所以这是为什么作为一个标准的内向者，我一定要改善沟通的核心原因，让脑中复杂的结构得'
  - '[PAGE 88]


    以展现，同时也让自己的思维更加复杂。我发现了这个秘密，而现在就把这个秘密告诉给你听，希望你能把脑中复杂的结构化思维真正展现出来，从而实现更大的人生价值。具体如何实现，请允许我在接下来两节课中继续探讨。


    尽管今天我们没有分享具体的表达技巧，但却探讨了一个非常核心的问题。为什么内向者一定要改善沟通？这是因为内向者通常更具备结构化思考能力。你需要很多表达工具，把这些复杂的概念展现出来。从此一鼓脑超越身边所有人。我坚持认为，内向者大脑中有巨大的能量，如果不挖掘，可能永远深埋地底。但一旦开采，力量释放，将无穷无尽。


    # 那个内向的男孩去年赚了100万


    如何赚钱，你可能会觉得很惊诧，赚钱这个话题怎么会出现在内向者沟通表达课中呢？其实我更想表达在如今的信息时代，内向者有着前所未有的机会。即便你觉得谈钱庸俗，但我希望能够变得更好。我先讲一个我身边的故事。我有一个同学，零六年从北京毕业，他读的是中央美院，学的是环境设计，一心想过世外桃源般的庭院生活。


    毕业后，他回到成都，在本地一家颇有名气的设计院工作，积累了很多经验和资金。终于在五年后，他开始打造自己的庭院。为此，'
