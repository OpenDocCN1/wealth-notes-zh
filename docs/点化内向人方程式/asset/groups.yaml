    ## 从错误中学习：桥水基金的原则


    瑞达里欧（Ray Dalio）是雷达里奥吗？不，是瑞达里欧，被投资者称为“乔布斯”般的存在。他写了《原则》这本书，前段时间在国内大火，你一定不陌生。


    这本书里提到了一个惊人的事实，就是他的桥水基金公司不会惩罚员工犯的错误，而是鼓励员工讨论所犯的错误。为此，公司甚至还专门成立了一个错误档案，把公司内部所犯的错误记录下来，供全体员工来学习。瑞达里欧曾在书里分享到，错误是一定会犯的。如果我们惩罚错误，其实就是鼓励大家把错误都藏起来，这样我们就失去了从错误中学习的机会。这对公司的损失会更大，能把错误记录成档案并不断改进，这是极其有用的方法。


