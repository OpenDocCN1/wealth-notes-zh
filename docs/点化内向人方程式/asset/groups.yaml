    ## 如何改掉说话累轻松应付

    你在什么时候会感觉说话很累呢？其实只有一种情况，就是你很使劲说了一堆话，别人根本就不知道你在说什么。结果你越说不清楚，就越想解释，结果越说不清楚，这就会很累。那问题怎么去解决呢？举个例子，如果你今天参加一个从小到大好友的婚礼，途中被婚礼主持人叫上舞台，分享几句作为朋友的感言，你应该怎样组织语言呢？参加过婚礼的人都知道，嘉宾分享并不是一件容易的事儿，因为全场氛围一直都在主持人的把控之下，你突然上去发言会很难驾驭这个氛围。但我见过一个案例，却令人印象深刻。


    一对新人的婚礼上，好友是这样分享的：我今天出门时，我儿子问我爸爸什么是结婚啊？我告诉他结婚就是两个人决定幸福的生活在一起。他又问我，结婚就能幸福吗？我得承认，这个问题难住了我。然后我做了一下功课，看了看怎样才能幸福呢。于是发现了三个关键：

    - 第一是夫妻之间能够互相体谅。

    - 第二是彼此能够做到互相欣赏。

    - 第三是双方总是能很好的控制情绪。

    刚好这就是在大家眼中，你们俩的样子。现在我儿子就坐在台下，这是他第一次参加的婚礼，我相信也将是他眼中最幸福的婚礼之一。祝愿你们成为孩子们幸福的楷模。


    我们真诚的祝福，你们感受到了吗？这样去表达效果会非常好。原因是什么呢？因为他在表述一件事儿的时候，用到了叙事结构。这是什么概念呢？如果你现在手边有一张 A4
    纸，你随意在纸上画三个点，然后画条线把它们连接起来，就可以形成叙事结构，发挥一下你的想象力。请问你一共可以连接成多少种结构呢？今天我就一口气儿给你分享五种叙事结构，请一定要在白纸上把它们画出来。即使你只记住其中两到三种，也足以应对生活中绝大多数的表达场景了。


    仔细听啊，刚刚说的婚礼如此精彩的结构也是其中之一。这五种结构分别是：


    **第一种：从左到右的横线结构，也就是俗称搬砖块结构。**

    给别人讲一件事情，从左到右列举出来：第一是什么，第二是什么？第三是什么？比如还记得这个段子吗？要把大象放冰箱，拢共分三步：第一步把冰箱门打开，第二步，把大象塞进去。第三步把冰箱门关上。这个就是标准的搬砖块结构。再比如二零零七年
    iPhone 首次发布时，乔布斯并没有用一个非常复杂的概念去解释新产品，而是这样说：

    > 今天我们要发布三款革命性的产品。第一款是一个触控式的宽屏幕的 iPod；第二款是一个革命性的手机；第三款是一个突破性的上网设备。一个 iPod，一个手机和一个上网设备。你们懂了吗？这不是三个独立的产品，而是一款产品，我们叫它
    iPhone。

    这时候全场观众都疯狂了。


    **第二种：从上到下的竖线结构，及时间线结构。**

    这个结构也非常好理解。比如马云有一句很出名的话：“今天很残酷，明天更残酷，后天很美好。但是绝大多数人死在明天晚上，看不到后天的太阳。”用的就是今天、明天、后天这个时间线结构。


    **第三种：U 型的微笑曲线结构。**

    也就是我们通常所见的讲故事的结构。先陈述一段经历，然后经历低谷，最后翻转这个过程。举个例子，你可以这样描述自己的经历：

    > 我觉得自己的人生啊就像一个挎包，出生的时候，拉链没开，什么也装不下。后来打开拉链儿就不断的装东西，越装越多，比如物欲、金钱、感情或者工作压力等等。后来几乎都要撑裂了，这是低谷。于是我开始丢东西，刚开始丢的时候觉得很不舍，但后来能够真正做到放下，就只留了三样最重要的东西，它们是身体、家庭和幸福。所以我觉得现在的自我非常舒适，这就是翻转。


    **第四种：三角形结构。**

    在一张纸上你先画一个点，这代表你先说自己；然后在一条水平线上画上另一个点，这代表对方；最后在你们两个点的上方画上第三个点，这就是你们能够合作的方案。三个点连成一起，这就是三角形结构。比如你如何对一名完全不懂软件的做蔬菜批发的公司，说清楚你们的项目呢？你可以这样说：

    > 我们是一家商务软件服务商，能够提供软件设计、软件开发、软件测试和上架的一整套服务。你们有着丰富的线下供应链网络，但缺少一个线上的软件把大家整合在一起，而咱们一起合作就可以打造一款软件，能够搭建一个蔬菜批发的市场平台。


    **第五种：抛物线结构。**

    大概意思是指一开始上坡，然后中途有一个神奇的发现，最后到达终点。我们开头分享的婚礼发言的案例就是用的这个结构。发言人一开始是这么说的：“今天出门时，我儿子问我爸爸什么是结婚？”这就是在构建和听众的坡道，利用小孩子的视角很容易让观众一起上坡。然后他说发现了三个关键：第一是什么？第二是什么，第三是什么？这就是发现。然后又重复：“我儿子就坐在台下，这是他第一次参加的婚礼。”这就是帮儿子找到了答案。发言来到了终点，让大家感觉很舒适。这个结构呢也是美国前总统奥巴马最喜欢的方式。比如他经常说今天早上出门的时候，我的女儿对我说如何如何，然后就像篇大论对美国现状的发现，最后结果又通常是“现在呢我终于可以回到家回答我女儿的问题了”。这种抛物线结构通常运用在公众讲话中，让普通人觉得听着非常舒服。


    我们来做一个总结。今天我们分享了五种叙事结构：

    - 第一种是从左到右的横线结构，也就是俗称搬砖块结构。

    - 第二种是从上到下的竖线结构，及时间线结构。

    - 第三种是 U 型的微笑曲线结构，也就是陈述、低谷、翻转这三个过程。

    - 第四种是三角形结构，也就是我是什么样子，你是什么样子，我们在一起又是什么样子。

    - 最后是抛物线结构，也就是坡道、发现和终点这个过程。


    ## 情商（EQ）的误解与本质

    [美国] 心理学家，也就是后来被称为情商之父的戈尔曼，才把情绪智力这个难懂的概念转换成“人话”，很快被国内引用，翻译成“情商”。但是公众理解的 EQ 情商却和心理学家梅耶和萨洛韦的原论文概念有着很大的差别，主要集中在三个原因上。


    第一是戈尔曼在书写这个概念时，加入了很多自己的理解。比如他在《情绪智力》这本书里解释，情绪智力又是自我意识、自我管理、社会意识、人际关系管理这四部分。就如梅耶和萨洛维对于情绪智力的核心概念——检查自己和他人的感受和情绪、区分情绪之间差别的能力——多出了很多范畴。而戈尔曼的理论很多只是来自自己的推测，并没有科学论据。比如“成功的百分之八十来自于情商，百分之二十来自智商”，这个说法就来自他。可是，教育心理学家林沃特豪斯在二零零六年的评论性综述中发现，百分之八十这个数字不是基于数据，而是戈尔曼自己主观认定的。当时戈尔曼看到了一个没有发表的私人研究成果，研究认为，职场表现优秀的人一共有二十一种关键职业能力。戈尔曼觉得，这其中只有三种能力，不属于情绪智力。于是他就用十八除以二十一，得出百分之八十五点七这个数字来。


    第二是因为市场需求，有很多人不断往情商这个概念中赋予更多的意义。比如，所谓“情商高，就是会说话”。这本书的作者佐佐木圭玮，原本是一名沟通专家，他又给情商赋予了“会说话”这个形象。所以到现在还是大量的人认为会说话的人就是情商高。但其实很多概念都是作家自己发明的，并没有经过心理学严谨的数据做支撑。


    第三是“情商”这两个字本身就很容易造成误解。相信现在还有很多人对于情商中“情”这个字的理解是“人情世故”的情。但其实情商的英文名是 Emotional Intelligence，准确来说呢只有“情绪”这一个含义。情商仅仅只是指情绪的控制和感知能力。


    听到这里呢，你可能会感觉失望，情商仅仅指情绪的控制和感知能力，它并不能帮我们做什么呀？但其实呢，能够控制和感知别人的情绪是一个非常了不起的技能。一直以来，我都在刻意练习这种技能，我非常希望你也能够学会它。怎么做呢？看上去很难，但其实只需要你做好一件事儿，那就是改变认知立场。


    为什么这么说？我们来看一个案例，比如你女朋友今天找你分手。如果你的认知立场是“我对她那么好，她居然会这么对我”，那么肯定会引起自己巨大的情绪。但如果你这样想：“她和我分手，是不是因为我不够努力上进，没有怎么理解她的想法？”如果你能够做到这样想，就肯定不会有什么情绪了。这两者的区别在于，前者是站在被动立场上，你会认为所有的决定权都在对方手上，她和我分手，我就陷入黑暗；而后者呢是站在主动立场上，你会认为你们的关系是你自己可以决定的。


    对方提分手是因为自己没做好。在与人沟通这件事上，认知立场实际也决定了你表现出来的情商高低。比如我上周末我去附近咖啡馆参加了一个读书会，在相互的讨论环节，我发表了很多观点，几乎不给别人说话的机会。很快，我意识到这会显得情商很低。因为我这时的立场是：“我现在有很多比你们更好的见解，我讲出来你们就可以获得更多认知了。”其实是一种视野停留在自己身上的封闭的自恋状态。后来我越说情绪越激动，大家看完了都像是看表演，都可能心里会不舒服。所以我及时调整了认知。其实每个人都对生活有不同层面的解读，了解别人的视角也是非常有趣的一件事。下半场讨论我基本就没怎么说话了，而是不断提问，让别人更多把自己的想法说出来。我把视角放在其他人身上，彼此感觉就非常好。


    我们的课程呢在之前反复介绍，内向者通常更喜欢安静，他们更喜欢结构化思考，也更喜欢倾听别人，所以这很容易转化成优势。如果在与人沟通中能够做到开放的吸收别人的信息，就会显得情商很高。但如果始终把注意力放在自我身上，情商就显得很低了，经常因为在乎别人对我们自己的评价而更紧张。


    我们来做一个简单总结，今天的建议只有两点：

    - 第一是情商，这个概念非常混乱。我们最好不要用这个概念去轻易评判自己和别人。

    - 第二是学会转换认知立场，才能做到更好控制情绪以及感知别人的情绪。

    斯多葛派哲学有一个这样的观点，我们总是试图干涉不能控制的区域，然后控制失败时却产生愤怒、无助等情绪，多数的情绪都是荒唐的。


    ## 说话没人听，如何赢得尊重

    你有说话没人听，或者说话根本没人理你的经历吗？遇到这个问题怎么办呢？我们先假设一个场景，你现在还在学校上学，室友在这个周末拉上你去市区最繁华的地方做兼职。你们找到一份发传单的工作，刚开始给别人递传单的时候，你会不会很紧张呢？尤其当多数人咬牙拒绝的时候，你肯定恨不得街上一个人
    都没有。但是如果你手里拿的不是传单，而是一本大家都很想要但是很难买到的书，你自己还会有这样的心态吗？相信你这时会自信很多，因为你提供的是有用的东西，而且还是别人想要却得不到的东西。


    所以找到问题的关键了吗？说话没人听，这个问题核心就是我们说出去的话没用，至少对于别人来说是没用的。比如你一直和父亲唠叨，年纪越来越大了，和朋友聚会要少喝点酒，太伤身体了。但你会发现这些话对他来说基本没用。再比如你在公司一直给大家强调要多用头脑风暴，但多数人还是喜欢按部就班的做事儿，所以你的建议也没用。又或者你在办公室中，你会发现每次说出去的话，别人都爱搭不理，不是因为你很讨厌，多半也是因为你说的话没什么用。那什么是有用的表达呢？你总不可能鼓励你爸喝酒，或者任由部门同事做事，不思考吧。今天就一起来解决这个问题，让你每次说出去的话都有十足的份量，甚至让别人乖乖听你的话。具体呢需要用到两个技巧。


    **第一个技巧：明确对方的驱动力。**

