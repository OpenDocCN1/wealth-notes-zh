    ## 成功者 70%都是内向的


    当今世界中最具有影响力的内向者是谁呢？应该是硅谷钢铁侠埃隆·马斯克。马斯克三岁时还像一个聋哑人一样不会说话，而且反应迟钝。童年时，父母离婚，他经常把自己锁在房间里，八岁就看完了大英百科全书，在学校一直被霸凌，被同学一脚踹下了楼梯。十一岁时，用三天时间就学会了六个月的
