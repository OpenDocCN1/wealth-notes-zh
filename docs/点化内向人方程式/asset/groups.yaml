    # ## 改变羞涩不敢说话用这招


    我们来彻底解决一个内向者的普遍问题。羞涩内向者被困扰的其实不是内向，而是羞涩。想要彻底解决它需要理解羞涩产生的原因究竟是什么？这个原因呢，比你想象的稍微复杂一些，需要分享一个形象的故事。


    荷马史诗里有一个英雄叫奥德修斯，也就是在特洛伊战争中设计'
  - '[PAGE 24]


    木马计的那个人。有一次他回家途中呢遇到了一个妖怪，这个妖怪有一张床，每个过路的人他都会抓到这张床上躺一躺。如果这个过路人的身体比床短，他就把过路人拉到跟床一样长。如果比床长呢，他就把长的部分锯下来。妖怪其实是想和人做伴儿，但他头脑中所设想的理想伴侣应该跟床一样长。结果呢他把所有人弄死了，你当然认为自己不会像这个妖怪一样蠢。


    但实际上呢我们的头脑里却有大量类似的想法。比如你一上台讲话，别人都应该有很好的回应。你一提请求呢，别人就应该会答应你。恋爱时，你觉得别人就应该对你好。为人父母觉得子女就应该活成你期待的样子。一旦对方没有达到你期待的样子，各种情绪就会涌上心头，集中在那些你感觉到能够控制的人面前，情绪会变成愤怒。而在那些你没法控制的人面前，比如在陌生场合，情绪就会转化成恐惧。从此，你再也不敢说话了，重复一遍，羞涩的核心是恐惧，对方不会达成你期待的回应。


    斯坦福大学的德韦克教授把这种情况归结为防御性思维开启的表现。这就像原始部落打仗更强大的部落，通常会把重心放在外部世界的征服中。而弱小的部落呢则更喜欢守着自己的部落，经常关注自己部落的防御情况。想想你是不是这样呢？比如会不会经常产生疑问，我是什么样的人，别人会怎么看，我，我这么做是对，是错误，'
  - '[PAGE 25]


    这样就会导致你更不敢向外表达，不敢犯错，始终守在自己的心理部落中。


