    去年我去拜访他，坐在庭院里喝茶，感觉颇为享受。原以为他过上了所有人向往的生活，但他呢却透露出了许多无奈。比如每天的卫生打扫周边，很难请到合适的人过来，而且他当年只考虑自己住的清静，把地方选在了离市区很远的地方，附近，也没有什么风景。所以营销了很久也不见什么起色。


    几个月前，他有了把院子盘出去的打算，但接连接到几个报价，别人最多也就给他五六十万，远远低于他的预期。他舍不得把自己的心血贱卖，又不愿回到那种朝九晚十的设计师工作，所以对未来感觉迷茫。上个月有个北京的老同学来找他，感觉更郁闷了。


    因为留在北京的同学刚好遇到了经济快速发展的这十年，每个人都混得有模有样。而且很多人当年在北京买了房，现在房子至少六七百万，有的多达千万。相对而言，他严重怀疑自己当年选择错了道路。那么，为什么会出现这种情况呢？一个极其精致的院子，花了无数心血，才值五，六十万。而小区几乎没有绿化的北京的房子却可以卖上千万。而一个对自己人生很有规划，同时有超强行动力的人，最终每年的收入不到十万。


    而那些在北京看上去没什么规划，依赖一家企业打工的同学，却'
  - '[PAGE 90]


    有着完全不同的人生。其实四个字就可以解释很多人的人生状况，那就是连接程度。一个精致的院子，但远离城市，我们那些习以为常的连接，在这里是不存在的。比如你住在里面，今天想吃个外卖，那就不行。再比如这位同学以后定居于此，医院、孩子的教育等等，这些问题都很难解决。


    而且他也透露，当初修建院子时光宽带这件事儿的解决就让他非常麻烦。而北京的房子表面上看没有那么好，但住在这里可以连接国内最好的资源。同样，学区房为什么这么贵？核心是因为可以连接更好的资源。同样的，为什么我这位朋友从毕业开始就对自己人生有清晰规划，而且也非常努力，但如今看上去却不如他那些一直浑浑噩噩的朋友呢？核心也是因为连接程度，做一个院子是一个很了不起的举动，但却是一件和社会连接程度很低的事情。


    而在北京，一家公司上班，看上去很平凡，但却可能把自己连接到一个高速发展的价值网络上，这无疑等于坐上了高速电梯，直接到达某个高度，所以增加自己的连接程度。这几乎是我们这一代人要去思考的最重要的事情，没有之一。具体有两个做法，第一是找到更大的价值网络。假如零六年时你进入了阿里巴巴或者腾讯，并且一直留了下来，那么年薪至少都上百万了吧。核心不是你变得多么厉害，而是互联网的价值。'
