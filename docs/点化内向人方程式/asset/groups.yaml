    你要知道别人听你说话往往都不是百分之百集中注意力，或者别人对你讲的东西可能并没有那么感兴趣。所以你必须把你要讲的内容整理出一个最简单的逻辑排序，让别人一下就能听明白。比如在王子杀死女巫这个故事中，采用的是时间排序，王子先提高剑术水平，然后同女巫决斗并杀死他，最终迎娶了公主。先做什么，然后做什么，最后做什么。整个故事讲完，听众就会非常清楚，除了时间排序，使用空间排序也同样让你的表达清晰易懂。比如我之前面试过一个大学生，他是这样介绍自己。


