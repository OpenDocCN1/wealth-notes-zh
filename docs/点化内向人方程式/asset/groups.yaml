    如果表达完别人毫无改变，那你的表达就没有意义。需要注意的是，因为之前都已经用感性的语句烘托了对方的情绪，所以呼吁行动的时候就不用拐弯抹角了，直接说服反而让人理解怎么样
    get 到魔鬼公式了吗？我们简单总结要素，一绕开防御，讲一个故事，问一个对方的问题，提出一个震惊的事实是最好的三个办法。要素二，核心观点。每次说话带一个明确的目标要素。三、填充证据核心是要有视觉化和引发情绪。四、呼吁行动这个环节直接一点就行。


