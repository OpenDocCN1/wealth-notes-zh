    ## 从错误中学习：桥水基金的原则


    瑞达里欧（Ray Dalio）是雷达里奥吗？不，是瑞达里欧，被投资者称为“乔布斯”般的存在。他写了《原则》这本书，前段时间在国内大火，你一定不陌生。


    这本书里提到了一个惊人的事实，就是他的桥水基金公司不会惩罚员工犯的错误，而是鼓励员工讨论所犯的错误。为此，公司甚至还专门成立了一个错误档案，把公司内部所犯的错误记录下来，供全体员工来学习。瑞达里欧曾在书里分享到，错误是一定会犯的。如果我们惩罚错误，其实就是鼓励大家把错误都藏起来，这样我们就失去了从错误中学习的机会。这对公司的损失会更大，能把错误记录成档案并不断改进，这是极其有用的方法。


    事实上，这也是我自己的方法。二零一二年时，我开始刻意练习自己的说话能力。我曾经把每一次自己表达感觉不舒服的场景都记录在 Excel 中。比如有一次我给别人分享客户分析技巧，本来准备很充分，但突然一个很厉害的分析师也来听我的分享，我突然就变得非常紧张。原本准备好的内容很多都没有表达出来。在我的
    Excel 中记录着一条一条这样的情况。


    当然我也会用数据分析去看我的原因在什么地方，同时也会去看心理学或其他知识进行分析。遗憾的是，我这个习惯只持续了十个月。如果一直坚持，相信我的表达能力会有更恐怖的成长。非常建议你也试一试。


    ## 羞涩的原因与解决


    好了，我们对今天的内容来做个简单总结。


    首先我们讲到了羞涩形成的原因，本质是恐惧，担心对方不会达成你期待的回应。


    其次，我们分享了两个实用的解决方法：

    - 第一个方法是放下自己不会犯错的形象。

    - 第二个方法是把犯错看作是成长的机会。


    这两个方法需要一定的坚持，但很容易上手。电影《疯狂动物城》中主角兔子警官朱迪曾说过这样一段话：“生活总会有点不顺利，我们都会犯错。天性如何并不重要，重要的是你开始改变，相信你一定可以大大改变自己。”


    ## 专治发言紧张脑子空白


    发言时紧张、脑子一片空白，这种感受你肯定有过，但这不是你一个人的问题。


    演讲家罗宾·内特（Robin Nagaraj，注：原文可能是Roan或类似发音，此处根据语境推断为演讲专家）曾说：“世界上通常只有两种演讲者，一种是特别紧张的，另一种是假装自己不紧张的。”也就是说，所有人在公众讲话时都紧张。这是为什么呢？


    原因要追溯到人类原始时期。想象你出现在一片空地上，一转头，突然发现几十双陌生的眼睛齐刷刷地盯着你，会不会感觉鸡皮疙瘩猛起，心底一阵阵发毛呢？无论你看到的是一群狼或是其他部落的原始人，这都会让你极其恐惧。


    而恐惧的情绪会让你全身的血液急速流向四肢，这样可以帮助你逃跑或者战斗。这时你的大脑就会一片空白，这是一个有关生存的保护机制，你的大脑完整保留了下来。所以你面对一个人时，通常不会紧张，而遇到一堆人讲话就会紧张得不行。


    所以我们之前提到过，即便是埃隆·马斯克如此成功的一个人，演讲过无数次，但去大学演讲时依旧紧张得两腿发抖。


    这个问题看似很难解决，怎么办呢？传统的观点让我们要深呼吸，或者做一些心理暗示，但这些方法没有太多作用。你想想看，为什么当你面对很多人讲话时，大脑总会告诉你“这太危险了，赶紧逃”呢？


    讲话又没有什么生命危险，那是什么让你感觉危险呢？危险其实来自不确定性。


    西方有个著名的帕斯卡思想实验：测试者把一块足够宽的木板放在地面，让人从木板上跑过去，所有人都很轻松完成；但如果把这块木板放在两个悬崖之间，几乎就没有人敢过去了，甚至连挪过去都不敢。每个人都会觉得自己随时可能掉入万丈深渊。尽管木板足够宽，从理性角度说，这非常安全，但所有人都会感觉悬崖上充满了不确定性，所以没人敢走过去。


    而你在公开讲话时，却有两种因素是不确定的，这会让你非常紧张：一个是你的讲话内容，另一个是听众。


    首先，为什么你讲话的内容是不确定的呢？比如我记得第一次演讲时，我完全把每一个字都记得滚瓜烂熟，但上台后依然很紧张。这是因为我并不清楚听众会有什么样的反应。开场时我给别人讲了一段自己的故事，有些人很感兴趣，但有些人却表现出不屑一顾的样子，而更多人会低头玩手机。我站在台上，看着台下的反馈和期待，完全失控，内心就是崩溃的。


    所以，最顶级的表达高手通常可以做到：一句话，说出去就很确定台下听众会有什么反馈。


    比如罗永浩在一次手机发布会上说过这样一句话：“因为担心被投资人当成精神病，我融资的时候一直没敢跟他们说实话。我做锤子科技就是要改变世界的。”说完后全场爆笑，但又无一不真正相信老罗的执着。这种幽默却展示坚定的效果，老罗后来说，这专门设计了两周。


    所以总结出来：你不仅要熟悉你的内容本身，还要预先熟悉讲出去以后别人会有什么反应。看上去很难，但如果你可以事先把内容录下来，或直接用手机拍下你的表达，用听众的视角去看自己，就能解决百分之五十的明显问题。


    那另外百分之五十怎么办呢？你还得去分析听众。但听众可是一个个活生生的、不一样的人，你如何让自己同一句表达，让不同的人产生积极的反馈呢？


    实际上，一群再不一样的人，也会有相同的部分，一是角色，二是人性。


    什么是角色呢？比如宝妈、山东人、产品经理、晚睡族等等。这些对于一群人统一的称呼就是角色。一个人参与社会，他就需要去扮演各种角色。所以你的听众集体来参加你的分享，他们一定也有一个共同的角色。只有这样，他们才能给你一个期待的反馈，紧张感才会自然消除。


    罗永浩曾经分享过他的演讲感受。他说，每次上台前十分钟，他的双手都是麻木的，当把听众逗得哈哈大笑时，紧张情绪才会立即消失。


    今天的观点可能有的违反你的常识，因为每个人都以为自己的理性可以控制一切，但实际呢，我们都是感性的奴隶，明白了吗？


    ## 说服力法则让你条理清晰


    先给大家讲一个古老的故事。从前王子说服了父皇，迎娶了邻国的公主，他们生活美满。几个月前，王子跟女巫进行了决斗，最终杀死了女巫。在这之前，王子每天辛苦练习剑法，用剑的能力不断提升。因为之前这个女巫不允许王子和公主的恋爱，这让王子想要除掉这个女巫。


    对了，这个故事发生在一个古老的王国。故事讲完了，是不是觉得乱七八糟呢？因为这是一个很糟糕的表达方式。


    那我们尝试换第二种表达方式：从前有一个古老的王国，王子爱上了公主，但是邪恶的女巫不允许王子和公主在一起，那怎么办呢？王子做了三件事，最终和公主走到了一起。

    - 第一件事，提高自己的剑术，获得和女巫决斗的能力。

    - 第二件事，同女巫决斗，并杀死了女巫。

    - 第三件事，说服了父皇，最终迎娶了邻国公主。


    怎么样？用第二种表达方式，是不是完全就不一样了呢？这是《金字塔原理》这本书中的案例。两个故事内容完全一样，但呈现出的效果却天差地别。是什么造成了这种差异呢？


    这就是我今天想给你介绍的说话三原则，它们分别是：

    1. 引出疑问

    2. 逻辑排序

    3. 去掉无关信息


    我们先来看第一个原则：**引出疑问**。


    我们第二遍讲故事的时候，开头是这样的：“王子爱上了公主，但是邪恶的女巫不允许王子和公主在一起，那怎么办？”这就是一个疑问。提出疑问，然后解答疑问，这样的表达就会让别人感觉非常清晰。


    举个例子，我有个朋友 Michael 是一家软件公司的销售经理。有一段时间他频繁和一家行业内最大的公司接触，因为这家公司机构庞杂，决策缓慢，跟进了几个月都没有和他达成合作。


    但终于有一天，Michael 又去他们公司时，恰好在电梯里碰到对方老总，他抓住这难得的机会，一举把事情搞定。他是如何说的呢？


    “张总，我是某某软件公司的 Michael，你看这个月还没到一半，我都第七次拜访您公司了。这段时间我和您公司十多个部门同事都有深入沟通，逐渐发现你们并不适合买我们上次推荐的那套软件。您有时间我给您汇报一下我的研究情况吗？”


    就这样，利用电梯三十秒时间，Michael 引起了张总的强烈兴趣，随后，他们在会议室聊了整整两个小时。Michael 的团队也愿意为张总的公司开发定制软件，他们达成了合作。


    人与人之间的交流呢，大家更关心问题，而非简单陈述。比如看到一篇文章的标题，“这家三平米的小店凭啥一年赚三千万”就比“这家三平米的小店一年赚三千万”要好很多。


    所以，说话的第一个原则——引出疑问，这可以让对方迅速把注意力聚焦在你的内容上。


    我们再来看第二个原则：**逻辑排序**。


    开头我们所讲的第二个故事，为什么让人感觉清晰有力呢？因为说了这一句话：“王子做了三件事，最终和公主走到了一起。”然后第一件事是什么？第二件事是什么？听上去就非常清楚了。


    你要知道，别人听你说话往往都不是百分之百集中注意力，或者别人对你讲的东西可能并没有那么感兴趣。所以你必须把你要讲的内容整理出一个最简单的逻辑排序，让别人一下就能听明白。


    比如在王子杀死女巫这个故事中，采用的是时间排序：

    - 先做什么：王子先提高剑术水平。

    - 然后做什么：同女巫决斗并杀死他。

    - 最后做什么：最终迎娶了公主。


    整个故事讲完，听众就会非常清楚。


    除了时间排序，使用空间排序也同样让你的表达清晰易懂。比如我之前面试过一个大学生，他是这样介绍自己的：“我之前的大学生活主要是在三个地方度过，教室、图书馆、学校的演讲练习厅。”这个介绍就非常精彩。教室、图书馆、演讲练习厅这三个空间就立即展示出了这位大学生积极的生活状态。


    排序的原则其实就是一条线。比如我们刚刚说到了时间线和空间线，但在一条线上最好只说三个点。如果一口气说太多，反而会让你的表达不清晰。


    最后我们来看第三个原则：**去掉无关信息**。


    《道德经》里有一句话是这样说的：“少则得，多则惑。”大概是指人生拥有的东西越多，反而让人困惑；拥有的东西很少，却让人感觉充盈。在表达中，这句话也同样适用。把话说少、说简单，这是一个你需要刻意练习的过程。


    举个例子，上周有一个读者向我留言，他是这样说的：

    “因为认知是没有上限的，每次我和他人交流、公开场合表达、集体探讨等，总会担心自己的思考结果实际上只是他人的常识，越用力表达，越像个小丑，所以就会产生深深的焦虑感。但这种感觉又像是在无边的大海里四处找不到抓手，内心很焦虑。按这种情形发展下去，担心自己会抑郁，这要怎么样破？你怎么知道你知道的就是问题的真实答案？我分不清这个问题是认知水平问题还是心理问题。目前主要是用学习来抵御内心的焦虑。”


    这短短一百字的提问，让人感觉晦涩难懂。但其实他是想表达这三个意思：

    1. 一直找不到自己认知的边界，所以很焦虑。

    2. 如何确定自己的认知是否就是真实答案？

    3. 一直处于焦虑中，担心自己会抑郁。


    去掉无关信息，是不是马上就清晰多了呢？


    我们来做一个简单的总结。今天我主要给你分享了一个说话的三原则，它们分别是：

    - 第一个原则：引出疑问。

    - 第二个原则：逻辑排序，一般惯用时间排序和空间排序。

    - 第三个原则：去掉无关信息。


    想起林语堂先生说过这样一句话：“好的讲话应该像女士的裙子越短越好。”你领悟到其中的精髓了吗？


    ## 尴尬冷场就用追踪式


    我们先以英特尔公司的案例来开场。


    上世纪八十年代，英特尔还是一家电脑存储器公司，面对日本厂家的低价策略，英特尔连续六个季度出现亏损，外界开始怀疑英特尔是否能生存下去。


    一个阴雨的下午，英特尔总裁安迪·格鲁夫在办公室召开董事会。全场所有人意气消沉。安迪·格鲁夫一个问句打破了沉默：“估计我们都要下台了。如果另选一名新总裁，你们估计是谁？”


    CEO 摩尔说：“说不准谁会收拾这个烂摊子，可能是马丁，也可能你我都想不到。”


    格鲁夫继续问：“如果他当选，你认为他会采取什么行动？”


    摩尔犹豫了一下：“如果他当选，他可能会放弃存储器的生意，做芯片处理器。”


    格鲁夫目不转睛地望着摩尔说：“为什么你我不自己动手？”


    从一九八六年，英特尔提出新的口号：“英特尔芯片处理器公司”，伴随着经典的广告声“噔噔噔噔噔”，英特尔处理器变得家喻户晓。


    其中，总裁安迪·格鲁夫只用了三个问题就解决了困境：

    1. 如果另选一名新总裁，你估计是谁？

    2. 另选一名新总裁，你认为他会采取什么行动？

    3. 为什么你我不自己动手？


    其中他用到英语式对话时最入门的三个疑问词，Who、What、Why。这就是追踪式对话的可怕之处。就算你不会遇到像英特尔公司困境这样的件大事儿，但每次和人聊天儿遭遇尴尬或冷场，却完全足够了。


    那如何进行追踪式对话呢？其实这就好比掉进了一片可怕的大海中，恐惧和焦虑的心情随之袭来。这时你需要做两件事儿：

    1. 抓住一块救生木板。

    2. 不断定位你的方向，最终走到陆地，脱离困境。


    我们先来看第一件事儿：**抓住一块救生木板**。


    什么意思呢？这意味着要在有限的语句中找到打破尴尬的突破口。


    我们来看一个案例，一个男生和一个女生在朋友介绍下相亲，朋友借口溜走，两个人面对面。

    男生开口说：“最近的天气太糟糕了，一直下雨。”

    女生说：“是啊，还好，对植物比较好。”

    男生回了一句：“啊，确实。”这样的气氛就显得尴尬至极。


    但如果男生这样回应：“你在家有种哪些植物呢？”那就是木板，算是抓住了。请注意，就是木板，就是指对方语句中的名词。一旦对话出现了某个名词，一定要坚定不移地追踪下去。


    再比如我们在开头说的英特尔的案例里，“新总裁”就是一个名词，安迪·格鲁夫追踪这个名词，提出了三个问题，困境就解决了。


    找到救生木板，也就是对方话语中的名词。你还需要做第二件事儿：**不断定位方向**。


    如何定位呢？主要包括三个方面：


    **第一是主体定位**，你需要用到疑问词 Who 和 What。


    在生活中，往往我们看到的可能并不是真相。比如史玉柱当年策划脑白金的时候，逐渐发现核心消费人群和当初设想的完全不一样。于是，在会议中，他不断向大家追问。比如他问到：“谁是真正的使用者？谁是购买者？谁会在周围的人群中进行传播营销？”这些就是
    Who 的问题。


    同时，他又问道：“脑白金的使用体验是什么？收到礼物的感受是什么？看到广告的想法是什么？”这些用到了 What 这个疑问词。通过不断提问，他们很快就突破了销售困境。


    **第二是时空定位**，需要用到 When（什么时间）以及 Where（什么地点）这两个疑问词。


    这两个疑问词对于具体的时间和空间的定位非常好理解。比如你询问别人几点在什么地方吃火锅。


    只是我们在沟通中有很多抽象的时空概念。比如在女朋友心中到底是一个什么位置，公司在竞争中处于什么位置，产品离下一次产品迭代还有多久等，这些问题都可以不断用提问的形式进行时空定位。


    **第三是层级定位**，你可以用到 Why（为什么）以及 How（怎么做）这两个疑问词。


    那为什么我们需要进行层级定位呢？这是因为问题往往都是多层的。我们经常会因为沟通彼此站在不同层级上，造成大量沟通效率低下的问题。


    比如你突然有一天牙疼，而且疼得厉害，你自己就想买点止疼药，吃点就行了。你妈说：“这是发炎上火，要吃消炎药才行。”而你爸却说：“发炎是因为被虫蛀了，需要到牙医那里做根管治疗。”结果你们还为此争吵。


    牙疼是感知角度，你妈说你上火发炎是常识角度，而你爸则是站在病理角度，这就是站在了不同的层级。


    为什么（Why）这个疑问词通常可以帮助你定位到问题的更深层次，而怎么做（How）则是解决办法。这两者最好搭配使用，效果最佳。


    主体定位、时空定位、层级定位，这三个定位刚好用到了六个英语中的疑问词：Who 和 What，When 和 Where，以及 Why 和 How。这六个疑问词中有五个
    W 和一个 H，这就是对话中的经典技巧：5W1H。


    找到对方话语中的名词，用这六个武器去不断追踪，任何冷场或尴尬的场景，随即就能破解掉。


    讲了这么多，我们来简单做一个总结。今天主要介绍了追踪式对话这个技巧，分别有两个步骤：

    1. 找出对方语句的关键名词。

    2. 运用 5W1H，也就是 Who（谁）、What（什么）、When（什么时间）、Where（什么位置）、Why（为什么）以及 How（怎么），做这六个疑问词，去对对方的关键词不断追踪。


    请记住，追踪式对话这个技巧对任何尬聊都无所不迫（注：应为“无往不利”或类似意，保留原音“无所不迫”可能为OCR或口语误记，此处按语义修正为“无所不能”或保留原意，根据上下文“破解”之意，修正为“无所不克”或直接保留原词但语境通顺，此处修正为“无所不能”）。*注：原文“无所不迫”应为“无往不利”或“攻无不克”之意，OCR识别可能有误，但根据指令保留信息，若明显错误可纠正，此处纠正为“无往不利”以符合语义，或保留“无所不迫”作为原音。鉴于这是OCR后处理，应纠正明显错误，故修正为“无往不利”。*


    ## 对方也内向如何沟通


    如果你面对一个很内向的人，你越说话他就说的越少。如何让他更多开口说话呢？


    我们先来看一个十六世纪的实验，普鲁士皇帝腓特烈二世做过一个残酷实验，他将很多刚出生的婴儿从父母身边带走，然后分开关在一起。他让负责养育的护工只给予生存或一些物质满足，但不能有任何情感互动，比如抚摸，甚至接触等。结果这些婴儿无一例外都死掉了。这说明什么呢？如果缺乏情感回应，人就等于处于绝境，生命力就会选择死亡之地。


    西班牙有句诗歌是这样说的：“死亡及无回应之地。”（注：原文可能引用有误，通常为“无回应之地即为死亡”之意）。


    世界上有一种很奇怪的疾病叫婴儿猝死症，它常常发生在婴儿睡眠的过程中。心理学家推测，这很可能是婴儿在缺乏回应的养育环境下选择了死亡。


    我们再来看到一个案例，在美国的路易斯安那州监狱中关押着全世界最臭名昭著的罪犯。酷刑都会让他们开心兴奋，但当他们不听话时，狱警会绑住他们手脚，扔到一个小黑暗的小黑屋里几天。但关押的犯人从小黑屋里被拉出来时，无一例外都会瘫软如泥，而且很多人性格从此大变。


    在完全黑暗不能动弹的房间里，人的内心没法和任何外在事物产生互动，再不可一世的罪犯，内心得不到外在回应，也会瞬间崩溃。


    所以，许多内向者为什么看上去总不愿和人说话呢？其背后最深层次的原因就是因为他们的生命经常得不到应有的回应，他们的生命力更倾向于保守，总是蜷缩在一个地方。你越刺激他，他就缩得越紧。


    当然这是有两个原因造成的：


    1.  **天生导致的原因**。之前我们说过，内向者因为身体更习惯由副交感神经所支配，他们更喜欢安静的思考。通常内向者结构化思维更强，和周围的人常常无法保持同频。比如像埃隆·马斯克那样的怪咖，八岁时就把百科全书看完了。在邻居大家讨论月亮上是否有外星人的时候，马斯克就会给他们介绍：“月亮只是一颗死寂的地球卫星，表面上只有无尽的尘土和环形山。”这种无趣的表达经常让马斯克得不到回应。


    2.  **父母所造成的压力**。这种情况在我们这一代人身上非常明显。比如我们小时候某一次成绩考好了，然后很高兴的告诉父母，结果父母回应一句：“你小子别嘚瑟，这次考好了，还有下次。”这就让我们压力很大，原本兴奋的感受没有得到父母的回应。


    弗洛伊德在他的《性学三论》中讲过一个故事：一个三岁的男孩在一间黑屋子里大叫：“妈妈和我说，我害怕这里太黑了。”妈妈回应说：“那样做有什么用呢？你又看不到我。”男孩回答：“没关系，有人说话就带来了光。”


    所谓的内向者，更多是在早期生命中陷入黑暗的人。回应就是光。所以和一名内向者说话，核心就是你要学会如何回应，学会如何回应对方。


    听上去不很简单的一件事吗？但其实大多数人根本就不会这个技能，他们只会站在自己的角度去沟通。如何学会回应呢？它至少包括这三个方面：


    **第一，连接对方感受。**


    我说一个自己的经历。我有一个弟弟，十一岁就已经长成一百三十斤的小胖子，给人感觉平时就不爱说话。后来我稍微留意了一下，原因是因为大家逢年过节才见面，而每次亲戚看到他脱口而出的就是“怎么又长胖了，脸上的肉越来越多。”这种话我感觉出来他会因为这些话感到非常自卑，所以我们每次看到他话就很少。


