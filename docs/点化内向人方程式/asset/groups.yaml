    ## 被领导误解的化解之法


    解决的问题是被领导误解，你究竟该如何处理关系呢？刚好最近我有个朋友遇到了一个棘手的问题，朋友叫小新，是一名今年开始读博士的女生，在一所国内知名大学的科研室里搞我们听不懂的复杂科研。最近，小新和科研所的大boss，也就是他的博士生导师，关系渐行渐远。小新给我发微信，说他都一个多月没和大boss说说话了。


    事情的原因是，一个月前所有博士生开始选择科研的课题方向，几乎绝大多数人选择了和大boss正在研究的课题。而小新和另外几名同学却选择了另外一个课题。这种现象在学术圈很常见，每个人选择自己感兴趣的领域，但小新却和同学们私下讨论过不同课题经费的问题。这事儿似乎传到了大boss耳中。有一次，大boss在会上直接说，让大家有什么就当面商量。


    小新感觉在看着他说的似的，从此开始，只要和大boss说话，小新就感觉心里堵得慌，这导致他们的关系开始疏远。我们经常因为一句话，甚至一个眼神就被领导误解了。而一旦出现隔阂，你几乎不可能冲进他的办公室开诚布公说清楚，通常只能任由尴尬和误解扩大。


    很多人几年下来，和领导关系也就这样了，这怎么办呢？其实每当出现这个情况，我更想问一句，为什么会觉得领导误解你呢？比如和小新聊天时，我专门问了问大boss的情况，她说这是一位校内德高望重的大教授，学识渊博，为人谦和。但就是和他处不好关系，所以我个人推测是往往认为自己被领导误解的，很可能是误解了领导。因为在巨大的权力差别下，别人可能并不在乎。这就像一只蚂蚁去咬人一样，人是不会对着一只蚂蚁发多大脾气的。我更确定的是，这是我们自己有了过激的情绪反应而已。


    因为人原本就是群居动物，我们非常习惯在一个封闭的环境中寻找存在感。比如远古时期，在部落中；一个现代人在家庭中；再比如小新，在科研室里，他们通通都需要存在空间。而一旦这个封闭环境里有一个掌控资源的绝对权威，毫无疑问，他的每一个反应都可能影响着你的存在感。但一味讨好大boss却不是好办法，身边人会反感，你也直接剥夺了存在感。所以你应该进行三个步骤，第一步，在更大的存在空间中寻找存在感。


    很多人在一个群体里找不到存在空间，就把自己隐藏起来，成为隐形人，这是不正确的。因为存在感是我们的生存基本动力。你会发现很多有抑郁症的人，就是在家庭、朋友或职场中，几乎和周围人断开了联系，就像剪刀把一根一根线剪断一样。他最终找不到存在空间，很可能选择自杀。然而，一味在一个地方要存在感，又会显得很自恋，从而也得不到存在空间。


    这个问题有点两难。正确的做法是放大存在空间的尺度，从而找回存在感。比如我们反复说到的埃隆马斯克，从小父母离异，在家遭遇父亲的家暴，一度非常绝望，但他却通过大英百科全书中找到了存在感，从小就希望把自己放在拯救人类这个更大尺度的存在空间中，于是走出了家庭的阴霾。而小新也告诉我，她会坚持钻研自己选择的课题，因为她认为这会很大程度上改变国内的技术排名。这个思考尺度一定也能帮她找回存在空间。再比如你偶尔在地铁上会看到一些因相互拥挤而造成的摩擦，试想，如果你今天马上要去谈一个五千万项目的生意，你还会去跟别人计较吗？你宁愿主动说对不起，甚至赔点钱，然后溜之大吉。


    存在空间的尺度不一样，问题一下就解决了。至于为什么一定要找存在感，你可以理解为这就是每个人的精神食粮。如果你不去找，就会更加饥渴，到时候你的神经系统会逼迫你找更大的存在感，这就会给自己和身边人带来更大的困扰。


    而第二步是把所谓的误解彻底遗忘掉。什么是所谓的误解？其实也就是你认为别人误解了你的动机。稍微有点绕，我们再来看看小新的案例，小新私下和同学讨论课题经费这件事儿，她的动机只是简单吐槽一下，为了让你听得更清楚，我们称为动机A：简单吐槽。而小新会认为大boss会误解她，潜台词是大boss认为小新的动机是质疑大boss偏袒自己课题小组经费分工不匀，这是动机B：大boss偏袒自己课题小组。但实际上，动机B只是小新的假设，根本就没有办法去验证，更没有必要去解释。所以你唯一能做的就是忘记误解这件事儿，应该重新去建立关系。


    怎么去建立关系呢？我们再来看第三个步骤。第三步，用请教的方式去重建关系。请注意，这可能是你面对和领导的误解时，唯一能够使用的方式，甚至这就是你和领导相处时最好的方式，那就是主动让他给你几条建议。


    比如小新完全可以向大boss询问如何开展课题，包括一些行业大环境，甚至是请教如何处理情绪这种问题。任何人都不会拒绝别人的请教，因为人都喜欢向别人给建议。比如你过年回家就会发现，长辈们特别喜欢给你提点建议，因为这是彰显他们权力的表现，这是他们的心理需求。有一个美国大学的研究，找了一百二十四个商学院研究生，先对他们进行心理测试，看看每个人的权力欲都有多大，然后两两一组对话记录，他们在对话中给对方提了多少建议。结果是权力欲越大的人，越愿意给别人提建议。


    我一直认为，任何人都有自己擅长的地方，向别人询问一些你不知道的东西，又可以学到东西，又可以让对方感觉很舒服，这个习惯实在是太划算了。


    我们来做一个简单总结。今天我们讲到，如果遭遇被领导误解，你应该采取三个步骤。第一步，在更大的存在空间中找存在感。第二步，把所谓的误解彻底遗忘掉。第三步，用请教的方式去重建关系。其中我认为最核心的其实是第一步，因为面对绝对权威的回应，我们才会感觉自己存在。更多时候其实什么都没发生，就是我们的存在感让我们产生了焦虑而已。最后分享卢米的一首诗歌给你：“无论如何，别忘记张开你的双臂，展开后，有可能会再次失望，但也有了希望。而如果你一直封闭着的话，那就什么都不会有。”


    ## 沟通有代沟如何让别人认同


    也许是你平时没怎么去关注的问题，所以我们当中大多数人并不知道如何用正确的方式和父母沟通。今天我们来说说这个话题。首先问你一个中国家庭中的普遍性问题，为什么你不听话，父母就受不了呢？心理学家武志红曾经在公众号上分享过一个案例，一个广东女孩找武志红咨询，说她爱上了一个不错的男人，但父母死活就是不同意，母亲还因此得了心脏病。


    于是，武志红约见了这一家三口，他发现那位母亲的态度非常坚定，为了不让女儿和那个男人结婚，他可以付出一切代价。通过开导，这位母亲说出了她反对这桩婚事的真实理由。她说，女儿原来什么都听她的，而且向她承诺过，恋爱前一定会带那个男人给她看，只有母亲答应了，她才会继续发展。可是女儿背叛了她，竟然在恋爱半年之后才告诉她。她说这些话的时候非常痛苦，也特别愤怒。


    所以核心问题是，之前女儿什么都听她的，对母亲而言，这是无比甜蜜的事情。而现在女儿竟然瞒着她谈恋爱这件事儿，彻底摧毁了这种甜蜜，这导致了她痛苦和愤怒。我们从小到大的环境就是孩子听不听话基本决定了这个孩子的好坏。中国家长夸孩子的时候，也经常用听话和乖这两个词。听话这个哲学可以说在中国无处不在，你身边会有很多人时刻都要担心，怎么才能表现出来更听话，尽量不让父母担心。


    所以，在处理父母关系时，我们不禁要想一想，究竟谁才是孩子，谁又是父母呢？很多时候，我们认为不同年代的想法引起了代沟，但其实是共生关系引起了代沟。


    请原谅我今天把问题剖析得稍微深入一些，因为你必须弄明白什么是共生关系。你可以理解为，这是彼此帮助对方建立一个小小的房间。比如你从小喜欢看百科全书，你的知识面很丰富，但是身边的人就和你玩不到一块儿去。同时，父母两个人对知识也没有太大兴趣，所以你感觉很压抑。但是突然一天你的叔父来到你家，不知道怎么就和你聊到了百科，你非常开心给他介绍你脑子里的各种知识。整个下午，你感觉充满了阳光，从此你非常喜欢和叔父在一起聊天。这其实就相当于叔父帮你修建一个房间，让你把学习的乐趣可以尽情放在里面。叔父对于你来说就是一种共生关系，因为有他的倾听和回应，才让你找到了这部分的生命之光。


    事实上，我们身上的很多部分都是因为亲密关系的容纳才建立起来。你当然得感谢父母，从你婴儿开始，父母就帮你建立起了一个个心里的小房间。比如你在摔了一跤之后，父母会营造情绪空间来接纳你的情绪；当你在某次考试后不知所措时，父母又会营造一个成长空间。但与此同时，你无形中也帮助父母建立起了控制空间，因为每个人都需要追求控制感，而面对一个小孩儿是最容易建立起控制感的。


    在心理学中，流行一句话叫“你存在，所以我存在”，你和父母是相互依存的共生关系。


    对共生关系的过度依赖，正是许多中国式家庭不幸福的根本原因。举个例子，有一种孩子叫“别人家的孩子”，这句话相信给你造成了不小的心理阴影。父母经常让我们去看看别人家的孩子时，好像是为了让你知道上进，但是在他们的潜意识里并非如此。从精神分析心理学的角度来说，其实有两个原因：第一是父母要通过否定孩子来证明自己的权威，在孩子面前表现出自己的价值，这样孩子对父母的依赖性才会更强；第二是社会竞争太激烈了，家长很焦虑，为了缓解焦虑，就把自己的不安全感投射在了孩子的身上。


    再比如，你想过得更加自由，做自己想做的事，完成想实现的梦想，但父母却坚持让你去国有企业找一份稳定工作。原本是你自己找工作，但父母却需要你身上坚持他们的价值观，这也明显是共生关系，让父母误以为你的所有选择也是他们的选择，他们更多地把你的人生当成了他们的人生。面对这个难题，你最需要做的是两个方面：第一是捍卫自己的心理边界。


    比如像找工作这种事儿，那其实就是你自己的事情。父母如果认为你找一些不稳定的工作让他们没有面子，那其实是他们自己的问题，你坚决不能让他们侵犯你的边界。即便有很多能力不足需要他们的帮助，也应该说清楚，这是寻求帮助，而不是让他们来主导你的生活。第二是建立彼此的控制感。如果你一直听完了前面的课程，你应该对这个概念非常熟悉了，依旧是控制感导致的问题，依旧需要你去帮助父母建立虚拟控制感。


    只要他们的控制感一满足，你自己的愿望是很容易实现的。表面上他们都是父母，其实更像是又哭又闹的孩子。而同时你自己也需要建立对自己选择的信心和掌控感，这才让你守得住自己的边界。想想看你刚出生时什么都不懂，整天哭闹，父母对你无比包容。现在他们已经逐渐老了，控制感在这个世界越来越弱，满足一下他们也未尝不可呀。


    做一个简单的总结，今天我们深刻剖析了造成沟通困难的根本原因，这和我们的常识有点不一样，是由于家庭过度的共生关系而导致的。要消除这种误解，最好要做到两步：第一是捍卫自己的心理边界，第二是建立彼此的控制感。有一句话是这样说的，父母总是以为我们不会长大，他们错了，我们总是以为父母不会变老，我们也错了。希望你对待父母多一点包容和理解。


    ## 内向必须改善沟通


    我们还没有说到一个核心问题，内向者为什么要改善沟通呢？因为仔细一想，其实有很多工作是不太需要沟通的。比如我长期就是在做数据分析，更多是和冷冰冰的数据打交道。那么作为一个标准的内向者，我为什么想去改善自己的表达呢？这个为什么我稍后来说，今天先得给你聊一个脑洞更大的话题。


    首先你想想看，为什么人类会有语言，人类会有这么丰富的沟通呢？动物也是有语言的，比如鸟类或者大猩猩，最多可以掌握一百多个语言符号。


    有个试验是这样的：一九七三年，一只在美国刚出生的黑猩猩叫做尼姆，被送到一个人类家庭。研究者就想看看，一直从小跟着人类的黑猩猩究竟能不能掌握人类语言。尼姆跟着人类父母过着自己的生活，人类父母给他穿衣服，每天和家人一起吃饭玩耍，随后开始教他学习人类的手语。实际上，黑猩猩是人类的近亲，两个物种遗传物质的相似性高达百分之九十八点八。尼姆确实也做到了很多复杂的东西，比如利用复杂工具，权衡利弊，自我意识等等，他也学会了，但他能不能彻底掌握人类的语言呢？答案让所有人失望：不能。


    而不能的原因恰恰就是语法。经过学习，黑猩猩尼姆总共掌握了一百二十五个手语手势，也确实能够表达杯子、酸奶、吃、喝这样的词汇。但是把词汇像搭积木一样组装成句子的能力，这条边界线，尼姆却终其一生也没能跨越。比如“我喝酸奶”这么一个简单的意思，尼姆却对其中的排列组合无法分别，他会比划出“我喝酸奶”、“酸奶喝我”、“我酸奶喝”这样奇怪的句式，尼姆根本就无法理解其中的差别。核心就是，尽管动物可以掌握词汇，但是他们没有办法理解语法。


    那么语法究竟意味着什么呢？你可能觉得语法不就是那个从前在英语课上让我被折磨的东西吗？其实我们在课本中学的语法只是叫语法基本规则，广义语法的意义要大得多得多。


    中国古代的甲骨文就是没有语法的，每一个字都有一个单独的意思。这其实和黑猩猩尼姆的语言能力是一个概念，只能用有限的单个符号来交流信息，比如表达安全、危险、想吃、睡觉，这些意思问题都不大，但要表达复杂意思，那就不行了。比如“三角形的内角和等于一百八十度”，人类一思考，上帝就发笑，这些复杂的意思无论如何不可能用一个词来表达。


    当然，语法结构也造就了思维模式的不同。所以中国自古是偏符号的形象化思维，而西方更多演化出偏逻辑的哲科思维。所以，西方文化引领着现在的世界。稍微深想一想，你就会发现，现在普遍生活在社会中下层、生活被动的人群也更多喜欢符号，比如刷抖音、发微信时使用各种表情。而偏向逻辑的结构化思维的人，则更喜欢丰富的知识，更爱用复杂的语言在公共场合表达或是写作。语言决定思维，思维决定层次。


    这里我们又提到一个词叫结构化思维，这就是我们内向者沟通表达课反复提到的一个概念。


    同时我也强调，这是很多内向者的天赋，他们天生就喜欢安静思考，在信息间建立丰富的结构。曾经在对这门课程的事先设计讨论上，我曾遭到质疑：为什么要给那些不善言语的内向者讲如此深入的概念，或许多丰富的表达技巧呢？他们不都是表达中的小白吗？但我坚持认为，内向者有丰富的思考，这意味着我们的语法结构比常人更复杂。只是可能我们没有经过训练，很难把这些复杂的大脑结构用语言表达出去，所以内向者才看上去不善言辞。前二十一讲，几乎每一篇都提供了一个单独的表达结构，就像一个万能工具箱一样。如果你穿上，一定可以让你头脑中的复杂概念源源不断地输送到其他大脑里。


    这是我做数据分析这几年发现的秘密。我亲自处理过许多复杂的信息结构，感觉真是妙不可言。比如我会去挖掘人类普通心理控制感和一个互联网产品之间的关系。你会发现如果从神经网络的角度说，人类个体许多行为其实比一个动物高级不了哪里去。同时我也知道了理解这个世界复杂的结构对于一个人的一生也有着无比重大的影响。


    所以，这是为什么作为一个标准的内向者，我一定要改善沟通的核心原因：让脑中复杂的结构得以展现，同时也让自己的思维更加复杂。我发现了这个秘密，而现在就把这个秘密告诉给你听，希望你能把脑中复杂的结构化思维真正展现出来，从而实现更大的人生价值。具体如何实现，请允许我在接下来两节课中继续探讨。


    尽管今天我们没有分享具体的表达技巧，但却探讨了一个非常核心的问题：为什么内向者一定要改善沟通？这是因为内向者通常更具备结构化思考能力，你需要很多表达工具，把这些复杂的概念展现出来，从此一鼓作气超越身边所有人。我坚持认为，内向者大脑中有巨大的能量，如果不挖掘，可能永远深埋地底；但一旦开采，力量释放，将无穷无尽。


    ## 那个内向的男孩去年赚了100万


    如何赚钱？你可能会觉得很惊诧，赚钱这个话题怎么会出现在内向者沟通表达课中呢？其实我更想表达在如今的信息时代，内向者有着前所未有的机会。即便你觉得谈钱庸俗，但我希望你能够变得更好。我先讲一个我身边的故事。


    我有一个同学，零六年从北京毕业，他读的是中央美院，学的是环境设计，一心想过世外桃源般的庭院生活。毕业后，他回到成都，在本地一家颇有名气的设计院工作，积累了很多经验和资金。终于在五年后，他开始打造自己的庭院。为此，他还去学习木工，花了大量心血后，院子终于落成。但这么大的院子，不可能一个人住啊，于是他又改造成一家很精致的民宿。


    去年我去拜访他，坐在庭院里喝茶，感觉颇为享受。原以为他过上了所有人向往的生活，但他呢却透露出了许多无奈。比如每天的卫生打扫，很难请到合适的人过来；而且他当年只考虑自己住的清静，把地方选在了离市区很远的地方，附近也没有什么风景，所以营销了很久也不见什么起色。


    几个月前，他有了把院子盘出去的打算，但接连接到几个报价，别人最多也就给他五六十万，远远低于他的预期。他舍不得把自己的心血贱卖，又不愿回到那种朝九晚五的设计师工作，所以对未来感觉迷茫。上个月有个北京的老同学来找他，感觉更郁闷了。


    因为留在北京的同学刚好遇到了经济快速发展的这十年，每个人都混得有模有样，而且很多人当年在北京买了房，现在房子至少六七百万，有的多达千万。相对而言，他严重怀疑自己当年选择错了道路。


    那么，为什么会出现这种情况呢？一个极其精致的院子，花了无数心血，才值五六十万；而小区几乎没有绿化的北京的房子却可以卖上千万。而一个对自己人生很有规划，同时有超强行动力的人，最终每年的收入不到十万。而那些在北京看上去没什么规划，依赖一家企业打工的同学，却有着完全不同的人生。


    其实四个字就可以解释很多人的人生状况，那就是“连接程度”。


    一个精致的院子，但远离城市，我们那些习以为常的连接，在这里是不存在的。比如你住在里面，今天想吃个外卖，那就不行；再比如这位同学以后定居于此，医院、孩子的教育等等，这些问题都很难解决。而且他也透露，当初修建院子时，宽带这件事儿的解决就让他非常麻烦。


    而北京的房子表面上看没有那么好，但住在这里可以连接国内最好的资源。同样，学区房为什么这么贵？核心是因为可以连接更好的资源。


    同样的，为什么我这位朋友从毕业开始就对自己人生有清晰规划，而且也非常努力，但如今看上去却不如他那些一直浑浑噩噩的朋友呢？核心也是因为连接程度。做一个院子是一个很了不起的举动，但却是一件和社会连接程度很低的事情。而在北京一家公司上班，看上去很平凡，但却可能把自己连接到一个高速发展的价值网络上，这无疑等于坐上了高速电梯，直接到达某个高度。


    所以增加自己的连接程度，这几乎是我们这一代人要去思考的最重要的事情，没有之一。具体有两个做法：


    - **第一是找到更大的价值网络。** 假如零六年时你进入了阿里巴巴或者腾讯，并且一直留了下来，那么年薪至少都上百万了吧。核心不是你变得多么厉害，而是互联网的价值网络在不断扩展。同样，现在诞生了无数年薪百万的自媒体作者，从作品层级来看，也许显得不堪，但他们却赶上了移动互联网，人们开始消费内容的好时代。但看到更大的价值网络，这是许多专业投资经理需要掌握的手艺，对于普通人来说，很难，更多的还是看运气。


    - **第二是增加自己的外接数量。** 什么意思呢？比如还是我的这位朋友，如果他把做院子的整个过程写在微博上，比如展示生活态度的大微信号，如果转发让几十万人看到，说不定就和现在很多人这种追求自在生活的态度连接起来，这就是外接数量。很可惜，我这位朋友从不注重这些。再比如我在网络上写作，这就是我一个人可以让很多人连接到我的思考。


    现在是一个关键行动领袖的时代。即便在家做家务收纳，也可以产生像斯舍离的作者山下英子这样的人物。从前我们只会连接身边的几个人，比如你读书时写一篇作文，只需要让老师觉得满意就行了；表达沟通只需要身边的人能听懂就行了。但是在新的时代中，很可能你一下就连接到几千甚至上万人，这需要你必须具备和此前完全不同的视角，那就是产品思维。所以我从内向者沟通表达课第一节课开始，就反复强调内向者的六个重要特质，分别是构成产品思维的高感性特质、结构整理力和共情力，构成领导力的专注力、倾听能力以及意义。

    '
