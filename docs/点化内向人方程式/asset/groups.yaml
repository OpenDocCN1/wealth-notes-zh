    什么是第三选择呢？比如在劝说父亲少喝酒这件事上，我在无数次唠叨发现没用后，开始思考如何帮助父亲建立控制感和存在感。比如，我在他手机上安装了“攀登读书会”，让他从知识中获取控制感。父亲喜欢写字，我积极帮他拓展书法圈的朋友，让他逐渐开始和志同道合的人交流，从而重新建立人脉关系，获得存在感。现在父亲的退休生活很充实，很多之前的社交场合都不去了，更别说喝酒。明确对方的驱动力，然后通过另一种方式去满足，这就是第三选择。


    “第三选择”这个词是由史蒂夫·柯维提出来的。他有一本书叫《高效能人士的七个习惯》。这本书是全球最畅销的书籍之一。在晚年时，柯维把这七个习惯合成了一个习惯，于是写出了《第三选择》这本书。由此你可以看出第三选择的重要性。为什么叫做第三选择呢？这是因为人类一直以来生活资源的总量很有限。比如在采集狩猎时期或农业文明中，几乎每次人类交流都只会存在两种选择：不是我增加，就是你减少。我们习惯了这样的零和博弈。


