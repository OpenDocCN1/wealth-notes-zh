    弟弟眼睛突然放大了，虽然他没有说话，但是我能感觉出来他很讨厌那些人的。这股情绪终于被另一个人感知到了。


    **第二，接纳成自己人，让对方成为自己人。**


    这是沟通中如此重要的细节，但多数人就是学不会。比如很多领导经常把这句话挂在嘴边：“再不努力，下个月你就收拾铺盖走人。”这就是把下属往外推，潜台词就是：你不是我们的人，只是雇佣者随时可以被我解雇。


