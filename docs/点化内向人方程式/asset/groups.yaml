    ## 你是内向的人吗？


    两年前我参加一个互联网企业 CEO 的封闭训练营，当时大家都被安排到成都郊外的度假村。一开始一些外向的 CEO 在去的大巴士上就开始和别人套近乎。而我和其他几个人却显得相对安静。三天时间，我们接受了一系列的训练、讨论和思考，最终会在第三天把成果演讲出来。


    但出乎意料的是，最终我的演讲被所有 CEO 评选为最好的，所有人都主动加我微信。那些一开始和别人套近乎的 CEO，反而没有受大家太多关注。当时我演讲完以后，有一个
    CEO 说道：“你太厉害了，但为什么看上去这么安静呢？”当时我能想到的答案是，安静地做自己，可能是我唯一能控制的事儿。内向和外向最大的差别呢其实是控制区域的差别。


    内向者更喜欢对内部世界做到控制，比如情感、创意和思维。我在训练营中能做到安静分析演讲，就是因为我更习惯于对于自身的控制，而外向者更追逐对外部世界的控制。比如一些外向的
    CEO，他们能够在社交这件事上找到十足的 control 感。但你可能会说，凭什么你一定要去刻意去划分内向者和外向者？内向者难道不能通过努力转化成外向者吗？这个吧可能真不行，因为他们的特质其实是由生理结构所导致的，一旦形成了就很难改变。如果你去东非大草原，你会发现狮子多数时候都是躺在草原休息的，我们可以称之为狮子的放松模式。


    偶尔他会充满力量地去捕获斑马，这是战斗模式。我们人类的身体机制里也会有这两种模式。在战斗模式状态下，身体中主要由交感神经所控制，它会让大脑大量释放多巴胺，让我们的身体变得兴奋。而在放松模式下，副交感神经在发挥作用，身体会大量释放乙酰胆碱，它让身体的循环慢下来，我们会感到安静平和。这个世界有四分之一的人是副交感神经更发达的人，所以他们更喜欢待在放松模式，他们是更喜欢独处、读书或者冥想的内向者。


    那你究竟是不是其中之一呢？心理学家苏珊凯恩曾经提出了几个问题，如果你的答案基本都是 Yes，那么就毫无疑问了。第一，相比于小组讨论，你是不是更喜欢一对一的交流。第二，你是不是聚会之后会感觉到筋疲力尽，想赶紧找一个没人的地方待会儿。第三，你是不是讨厌闲聊，喜欢就一个问题进行深入的探讨。第四，你是不是喜欢那种可以一头扎进去就不会被打断的工作。怎么样，有结果了吗？从以上的问题就不难看出，内向者通常更喜欢慢思考，他们喜欢深入交流，在这个处处都需要深入和专注的时代，那无疑是充满优势的。比如，内向者具备结构化思考或者深度思考能力，并对事物保持感性，这让你在写作上充满优势。内向者共情能力更强，这会让你在与人沟通上出奇制胜。内向者更擅长提炼事情的意义，这让你更擅长去领导。


    所以最终你会发现，尽管外向者在一些场合占据主动，但全世界最擅长表达的人里，却至少有百分之七十是内向者。比如乔布斯、埃隆马斯克、TED 的 CEO 克里斯安德森、周星驰等等的。这正是因为他们不断的锤炼自己对于内部世界的掌控，不断挖掘自己内心安静的力量，反而能够实现对于所有场合的全面掌控。内向者的优势还远远不止这些。接下来我会在模块一里把它们全部挖掘出来。你看到后会非常惊讶。嗯，你可能有疑问，既然这么多优势，为什么我们却在各种社交场合显得非常被动呢？原因呢主要有两个，第一是因为几乎每个人从小就被要求变得开朗外向，这让我们丢掉了原有的优势。


    第二是因为我们长期生活在做自己不擅长事情的压抑中。但还好我在这件事儿钻研了很多年。在接下来的课程中，我会教你如何低调的展示自己，如何说话更受尊重，如何让你的魅力超过别人，如何找到自己终身受用的表达方式，从而实现弯道超车，过上让别人羡慕的生活。我们做一个简单的总结。


    - 第一，你知道了内向和外向的最大差别其实是控制区域的差别。

    - 第二，你知道了内向者特质是天生的，我们不用刻意模仿外向者，而应该发挥自己的优势。

    - 第三，要想过得很舒服，你需要找到真正属于你自己的表达方式。第三点也是接下来要教给你的最重要的内容。


    有一句话是这样说的，世间所有的内向，都是因为无法忍受别人的无趣。内向者是深度思考的、充满创意的一拨人，希望我们能够一起找到属于自己的成功路。


    ## 内向令人垂涎的 6 大特质


    想想二零一四年时，你还在做什么？我正上大一，对我来说就是一片空白。而在大洋彼岸的哈佛校园里，一个叫做马克扎克伯格的大三学生，就开始建立一个叫 Facebook
    的校友联系网站。刚开始他黑入了学校的数据库，把同学照片放到网站上供彼此评估吸引力。这个创意立即横扫了整个哈佛。Facebook 现在是全球用户排第一的社交平台，但他们的创始人却是一个不爱社交的内向宅男。凑巧的是，全球最顶级的社交平台创始人无一例外都是内向宅男。


    比如 QQ 的马化腾，微信的张小龙，Instagram 的斯特罗姆，当然还有领英、Twitter、WhatsApp 的创始人。感到震惊吧。社交巨头都是不善社交的宅男，这是为什么呢？你更加震惊的是，那些我们认为最需要外向性格的领导职务，也逐渐被内向者所占领。比如比尔盖茨、马云、乔布斯、巴菲特、亚马逊的杰夫贝索斯、埃隆马斯克，还有刚刚提到的马化腾等全球最顶尖的掌门人，他们都是内向者。


    二零一七年，美国商业周刊有一期调查发现，全球一百强企业的掌门人中，有七十三个人都是内向者，这又是为什么呢？因为内向者有六种超级特质，这是成为伟大产品经理和领导的必要特质。而且你的身体里也潜藏着六大特质，想不想知道他们是什么呢？


    **特质一、高感性**


    特质内向者的神经系统天生对外界刺激更敏感。比如测试者把柠檬汁同时滴在内向者和外向者的舌头上。检测结果显示，内向性格分泌的唾液会多出一点五倍。再比如乔布斯，他能从禅宗、美学、计算机中感受到别人没有办法感受的东西，所以创造了苹果。


    **特质二、结构整理力**


    在美剧越狱中，男主角米帅把所有的线索贴满整整一堵墙，他每天盯着墙面，突然一天啊的一声解开了所有谜题。然后他把所有信息整合起来，伪装成一个图画纹，在自己身上带进了监狱，成功帮助哥哥实现越狱。内向者总有一种从复杂事物中理清思路并重新整合信息的能力，这就是结构整理力。


    **特质三、共情力**


    简单来说就是站在别人角度思考甚至思考的比别人更深入的能力。比如你打开朋友圈一篇文章，觉得讲出偶尔一些你特别想讲，但是又表达不出来的东西，这就是作者共情能力在发挥作用。伟大的产品经理必须要具备共情能力。比如说微信的张小龙总是能做出一些我们特别想用，但是没有想到的功能。以上三种特质就是一名伟大产品经理的必要特质。


    当然你会说，我又不不在互联网行业，干嘛要做产品经理呢？但其实产品能力是指我们整合资源，把自己的价值打包给别人交付的能力。比如你写一本小说，做一个女朋友生日的策划方案，这些都会体现你的产品能力。我们再来看剩下三种特质。


    **特质四、专注力**


    内向者总是可以很专注做一件事儿，这个你肯定深有体会。原因是因为内向者有丰富的感知和深度思维，他们能够看到一些长期的利益所带来的巨大反馈。比如埃隆马斯克在二零零六年就发布了特斯拉秘密宏图，在其官网上，十多年过去，你会发现特斯拉真的是一步一步按计划走过来的。一家企业的掌舵人必须要强大的专注力，然而，外向者更可能被短期刺激的事情吸引，这不是他们的专长特质。


    **特质五、倾听能力**


    在心理学家眼中，倾听是一种需要大量练习才会具备的技能。内向者在这件事儿有更大优势。什么叫倾听？比如下属说这几天没睡好，上级回答，这几天天热，人就是容易早醒，这就不是倾听。因为下属很可能会说自己出了某些问题，而上级却强调一切正常。倾听的要诀是不断尝试去了解很多你不知道的事实。许多销售大师往往都是内向者，就是因为他们更擅长提问，而不是表达。


    **特质六、意义感**


    也就是能够赋予事物意义的能力，这是一个人自我领导和领导他人的最重要能力。比如在远古时期，你想号召一群人去森林里打猎，你说“走我们去捉兔子”，这样动员不了几个人。但如果你说“森林里有女仙，我们打猎胜利才能看见”，这就能号召很多人。我们的祖先智人正是凭借这个本事，最终成为了全球霸主。内向者天生就擅长寻找意义，所以你会发现，内向者通常更自律，也更擅长带领团队一直走向未来。


    专注力、倾听以及意义感，这三种特质正是构成领导力的最重要特质。你也许不是领导，但是领导力你一定需要。比如如何让设计部的同事更好的协作，你如何让小孩更听话，这些都是领导力。说了这么多，我们做一个简短的总结。今天我们分享了内向者的六大特质，他们分别是构成产品力的高感性特质、结构整理力和共情力，构成领导力的专注力、倾听能力以及意义感。产品力是一种解决问题、创造价值的能力。领导力是让你学会与人沟通协作的能力。


    在未来的工作一书中，作者约翰布德罗提出一个观点，在 AI 来临的信息时代，未来人类只需要会三种能力、产品力、领导力以及传播力。所以恭喜你，内向者就占据其中三分之二的席位。而产品力和领导力本质上都是解决问题的能力，表达其实是帮这个世界解决问题的外在途径。所以你知道为什么全世界最擅长表达的人里，大多数都是内向者了吧。


    ## 如何利用自己特质在人群中脱颖而出


    一九一四年冬天，一个叫范旭东的年轻人到了天津塘沽的海边儿，海滩上放眼望去白茫茫一片，但这不是冬天的冰雪，而是盐。


    范旭东看到这一幕，激动地流下泪来，感叹到，几千年来，咱们的祖先一直都没盐吃，但是这些盐却这样白花花的躺在沙滩上，从来没有人来开发。一方面严重短缺，一方面却有丰富的资源未被开发，这是何其悲哀呢。


    一九一五年，身为化学家的范旭东，开办了九大经研公司，这才让海边白花花的盐得以开发，彻底解决了几千年来中国人食盐短缺的问题。内向者呢拥有的六大特质就像盐，躺在沙滩上，你需要一定的方法才能开发出来。今天这节课我就教给你两个方法，让你把特质发挥出来。


    第一个方法，升维打击。降维打击你一定听说过，但升维打击是什么意思呢？举个列子，在一场会议中，大家在讨论产品该怎么营销。A 说应该线上和推广。B 说应该做个优质的视频，而
    C 说根本不用视频，用软文介绍功能才靠谱。D 说，我们应该模仿苹果现在流行这种营销方式，他们说的头头是道，让你插不上话怎么办呢？细心观察，你会发现，同事基本都是围绕营销渠道和广告方式这两个维度展开。


    你再增加消费者这个维度，直接就大杀四方。你可以这么说，其实我们更应该关注消费者是如何接受我们营销的。通常他们消费一件产品，两件事情最重要，一是价格，二是体验。所以我们可以画出四个象限：


    - 第一，低价格且低体验，这是生活必需品，比如牙膏、螺丝刀、卫生纸，买这些东西不疼不痒，消费时，没有感受。

