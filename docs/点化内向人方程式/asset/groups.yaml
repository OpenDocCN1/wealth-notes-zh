    ## 羞涩的原因与解决


    好了，我们对今天的内容来做个简单总结。


    首先我们讲到了羞涩形成的原因，本质是恐惧，担心对方不会达成你期待的回应。


    其次，我们分享了两个实用的解决方法：

    - 第一个方法是放下自己不会犯错的形象。

    - 第二个方法是把犯错看作是成长的机会。


    这两个方法需要一定的坚持，但很容易上手。电影《疯狂动物城》中主角兔子警官朱迪曾说过这样一段话：“生活总会有点不顺利，我们都会犯错。天性如何并不重要，重要的是你开始改变，相信你一定可以大大改变自己。”


    ## 专治发言紧张脑子空白


    发言时紧张、脑子一片空白，这种感受你肯定有过，但这不是你一个人的问题。


    演讲家罗宾·内特（Robin Nagaraj，注：原文可能是Roan或类似发音，此处根据语境推断为演讲专家）曾说：“世界上通常只有两种演讲者，一种是特别紧张的，另一种是假装自己不紧张的。”也就是说，所有人在公众讲话时都紧张。这是为什么呢？


    原因要追溯到人类原始时期。想象你出现在一片空地上，一转头，突然发现几十双陌生的眼睛齐刷刷地盯着你，会不会感觉鸡皮疙瘩猛起，心底一阵阵发毛呢？无论你看到的是一群狼或是其他部落的原始人，这都会让你极其恐惧。


    而恐惧的情绪会让你全身的血液急速流向四肢，这样可以帮助你逃跑或者战斗。这时你的大脑就会一片空白，这是一个有关生存的保护机制，你的大脑完整保留了下来。所以你面对一个人时，通常不会紧张，而遇到一堆人讲话就会紧张得不行。


    所以我们之前提到过，即便是埃隆·马斯克如此成功的一个人，演讲过无数次，但去大学演讲时依旧紧张得两腿发抖。


    这个问题看似很难解决，怎么办呢？传统的观点让我们要深呼吸，或者做一些心理暗示，但这些方法没有太多作用。你想想看，为什么当你面对很多人讲话时，大脑总会告诉你“这太危险了，赶紧逃”呢？


    讲话又没有什么生命危险，那是什么让你感觉危险呢？危险其实来自不确定性。


    西方有个著名的帕斯卡思想实验：测试者把一块足够宽的木板放在地面，让人从木板上跑过去，所有人都很轻松完成；但如果把这块木板放在两个悬崖之间，几乎就没有人敢过去了，甚至连挪过去都不敢。每个人都会觉得自己随时可能掉入万丈深渊。尽管木板足够宽，从理性角度说，这非常安全，但所有人都会感觉悬崖上充满了不确定性，所以没人敢走过去。


    而你在公开讲话时，却有两种因素是不确定的，这会让你非常紧张：一个是你的讲话内容，另一个是听众。


    首先，为什么你讲话的内容是不确定的呢？比如我记得第一次演讲时，我完全把每一个字都记得滚瓜烂熟，但上台后依然很紧张。这是因为我并不清楚听众会有什么样的反应。开场时我给别人讲了一段自己的故事，有些人很感兴趣，但有些人却表现出不屑一顾的样子，而更多人会低头玩手机。我站在台上，看着台下的反馈和期待，完全失控，内心就是崩溃的。


    所以，最顶级的表达高手通常可以做到：一句话，说出去就很确定台下听众会有什么反馈。


    比如罗永浩在一次手机发布会上说过这样一句话：“因为担心被投资人当成精神病，我融资的时候一直没敢跟他们说实话。我做锤子科技就是要改变世界的。”说完后全场爆笑，但又无一不真正相信老罗的执着。这种幽默却展示坚定的效果，老罗后来说，这专门设计了两周。


    所以总结出来：你不仅要熟悉你的内容本身，还要预先熟悉讲出去以后别人会有什么反应。看上去很难，但如果你可以事先把内容录下来，或直接用手机拍下你的表达，用听众的视角去看自己，就能解决百分之五十的明显问题。


    那另外百分之五十怎么办呢？你还得去分析听众。但听众可是一个个活生生的、不一样的人，你如何让自己同一句表达，让不同的人产生积极的反馈呢？


    实际上，一群再不一样的人，也会有相同的部分，一是角色，二是人性。


    什么是角色呢？比如宝妈、山东人、产品经理、晚睡族等等。这些对于一群人统一的称呼就是角色。一个人参与社会，他就需要去扮演各种角色。所以你的听众集体来参加你的分享，他们一定也有一个共同的角色。只有这样，他们才能给你一个期待的反馈，紧张感才会自然消除。


    罗永浩曾经分享过他的演讲感受。他说，每次上台前十分钟，他的双手都是麻木的，当把听众逗得哈哈大笑时，紧张情绪才会立即消失。


