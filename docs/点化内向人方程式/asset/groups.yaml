    ### 巧妙设计你在别人眼中第一印象


    先问一个问题，你识别另一个人最快需要多久呢？一分钟、一个小时还是一整天呢？心理学家的实验结果是一秒。这是什么概念呢？你马上眨两次眼睛，这就是一秒的速度。


    普林斯顿大学的心理学家托托罗夫（Toto罗夫，原文误译，实为 Ghalan et al. 或 Nott et al. 的研究，此处依原文保留音译）曾经联合各国几十位心理学家做过一场实验，他们只给一群小学生一秒的时间去浏览照片，就快速判断一个政客能否在选举中当选。心理学家让不同国家的人进行交叉测试。比如，让瑞士的小学生判断法国议会的候选人，让美国的受试者判断芬兰的选举。这样尽量避免受试者认识候选人，结果显示准确率普遍高达百分之七十五以上。受试者第一印象觉得哪个政客看上去更有能力，这个政客往往就真的能当选。铺天盖地的竞选广告、煞费苦心的演讲和辩论结果，都不如这一秒的第一印象作用大。托托罗夫把整个心理学实验及其原理写成一篇论文，发表在
    2017 年 5 月的《科学》杂志上，题目就叫《第一印象很重要》。


    有没有觉得很可怕呢？我们经常做了大量准备，但别人眨眼之间就会对你进行判断。


    那么第一印象到底指的是什么呢？在托托罗夫的观点中，核心是你自己要让自己看起来更厉害。


    我们想象一个场景，假设你穿越到了两百万年前，你掉到了一群原始人中间，刚好从林中窜出了一只老虎，所有人开始逃跑，你会跟着谁一起跑呢？自然是那些看上去更厉害的人，这时你的大脑会瞬间对其他原始人进行扫描。比如这个人会不会跑得更快啊，那个人是不是更能找逃跑路线呢？跟着他会不会有更大危险呢？大脑会瞬间处理这些复杂问题，在不到一秒的时间里给你一个答案。在认知心理学中，这个概念叫做自动化认知。就像你的
    iPhone 能够实现瞬间指纹解锁一样，你也有对一个人或事物瞬间解锁的能力。这是大脑经过两亿年进化所得到的本事。


    即便后来进化出了分析和思考，但人们还是习惯用自动化认知的方式。这想起来呢有点悲哀，不管你怎么看重自己，在别人眼中，你和一条街边的小广告没有什么区别。我一个五百强
    HR 的朋友，他说忙的时候看简历，通常只要五到十秒，甚至就两三秒。面试一个人通常看一眼，最多问一两个问题就要做出判断。所有产品都要设计简洁有力的广告，这是为了迎合人类的大脑。而你也需要为自己设计第一印象，因为对方很可能不会多花时间去关注你。


    你该如何去设计自己的第一印象呢？再重复一下原则，你要让自己看起来更厉害，但不能直接说。你可以把第一印象拆分为三种东西：角色、经历和价值观。


    比如你去应聘一份工作，面试官让你做自我介绍，多数人的回答都是这样：“你好，我是张小明，来自某某大学，之前有过半年实习经验，很希望加入贵公司。”如果你使用的是这种标准版的介绍，那多半就没戏了。因为你是介绍自己的身份，身份是查户口时候才会用的。而
    HR 一天可能面对上百人，他根本不关心你的身份，所以你要去建立你的角色、经历和价值观。


    你可以这样说：“我是张晓明，是名刚毕业的大学生，但我更认为自己是一名超级服务者。我是学生会主席，这就是一个超级服务者角色，为全体同学服务。”你看，超级服务者就是一个角色，这个角色让你确定你对工作的姿态令人印象深刻。


    接下来呢，再加一些经历，你可以这样说：“有一次我们在学校田径场的观众席上开会，学生会一个部长问我，我们是管理者，为什么不让大家直接听我们的，而是每次费时费力去了解大家的想法呢？我当时就说最好的管理者本质上就是最好的服务者。”我们的大脑总是喜欢听故事，有时间一定需要给别人讲一段经历。如果你的时间更多一些，那就把自己的价值观吐露出来。


    因为我曾经看过一本书，《权力的本质》就是让别人接受我发号施令。给大家，大家不接受或者心里并不乐意，这都没有用。我不断去思考大家的需求，他们才能真正接受我。所以我逐渐养成了挖掘别人需求这个习惯，每次都能得到很好的反馈结果。做服务这事越做就越上瘾了。你看，这就不用四十秒的自我介绍，面试官能不要你吗？


    喜欢挖掘别人需求，这可是做服务和产品公司最重要的品质。


    我们来做个简单总结。首先我们讲到了心理学家托托罗夫的试验，第一印象比我们想象要重要很多，因为通常别人都不愿花更多时间去了解你。其次，我们分享了第一印象究竟是什么，心理学家的答案是，每个人都有自动化认知这个机制，每天需要快速对其他人事物进行评判，都能选到更厉害的人。最后，我分享了三个建立第一印象的关键因素，分别是角色、经历和价值观。


    角色可以快速取得对方信任，经历可以直接连接对方感性部分，而凸显价值观是告诉对方潜意识：我就是你想找到的人。台湾著名编剧许荣哲曾说，我每天出门会检查自己是否带了三样东西，钱包、钥匙和自我介绍，钱包和钥匙还可以忘记，自我介绍却不能不带。第一印象就是这么重要。


    ### 3 分钟展示自己的魔鬼公式


    一个从小玩到的朋友，去年在成都开了一家高档的海鲜自助餐厅。开业前呢拜托大家帮忙转发朋友圈儿，我朋友圈几乎不发广告，尤其看到别人写到我朋友餐厅周六开业、打折优惠这些词句时，就更不情愿了。但是无意中呢我想到了一次吃自助餐的经历，于是转发时这样写：


    五年前，我出差住喜来登饭店，晚上吃自助餐时，遇到了高中必看的《二十一世纪英文报》的主编黄老师。他带着小朋友一起吃饭，给我说，我平时没时间陪儿子，但有时间就会带他吃自助餐。这样他一次可以吃到很多东西，就当是去了很多次餐厅了。我们大人呢什么都吃过，不觉得自助餐有什么，但对于小朋友来说，那就是天堂了，大家真可以多带小朋友多吃自助餐。


    我朋友的海鲜自助餐厅马上开业，您呢周末就可以去。


    在我发了朋友圈以后，当下就有七八个人在评论区表示要带孩子去。第二天，朋友把我的小故事写成文案，结果让餐厅爆满，都定不到位置。


    多数人展示一件东西，仅仅是简单的陈述，别人根本就不关心。而我呢描写了这段故事，不是刻意写出的文案，却达到了比文案好几倍的效果。因为恰好符合一个魔鬼公式，而全球几乎最有说服力的文案都被套了这个公式。今天就介绍给你，这个公式包含四个要素，分别是绕开防御、核心目标、填充论据以及呼吁行动。


    我们先来看要素一，绕开防御。通常你给别人介绍自己或事物时，对方会开启心理防御机制。他的潜意识会说：“你是不是又要让我花钱？你是不是把自己讲得很厉害，让我觉得自己很弱？”我们对于别人的介绍天生会有排斥。那你如何绕过防御呢？有三个方法。


    第一个方法是讲一个故事。比如我发朋友圈儿，第一句话就是“五年前我出差佳喜来登饭店”，大家知道我在讲故事，就会有兴趣往下看。《百年孤独》的第一句话就是“很多年以后，奥雷里亚诺上校站在行刑队面前，准会想起父亲带他去参观冰块的那个遥远的下午”，一看就是好故事，让你卸下防御，忍不住想看。


    第二个方法，问一个关于对方的问题。每个人真正关心的只有自己。问一个别人真正关心的问题，尤其是他的痛点，他们是乐意听的。比如“为什么读书的内容你很难记住，但你还要读书？”“你在家庭中究竟扮演什么角色？”等等。直接发问，让对方视角转移到自己身上。


    第三，提出一个震惊的事实。比如《老人与海》的开头是这么写的：“老渔夫独自乘小船打鱼。他接连打了八十四天，但一条鱼也没有捕到。”哦，连续八十四天都没打到鱼，这就很吸引人呢。


    再比如一次 TED 演讲上一个医生是这么说的：“就在我现在说话的十秒内，美国人因吸烟而死亡的人就有四个。”很震惊的效果，同样也立即引起关注。绕开防御通常有一个七秒原则，七秒就需要通过一句话搞定对方，记住就用这三个方法。


    我们再来看要素二，核心观点。尽管大家都是在发自助餐的广告，但其他人的潜台词是：“这是我朋友的餐厅，周六打折”，这就是毫无目标，自然无法打动别人。而我的潜台词是：“你应该带小朋友去吃自助餐”，这就激起了很多人对子女愧疚的情绪。于是呢他们就去了。你经常会对身边人抱怨，“说了这么多，你到底在说什么呀？”那些人说话没有思考自己的核心观点。你看一辆车那么复杂，但汽车厂商在给你介绍时都会有一个核心观点。比如沃尔沃永远在强调安全，宝马呢一直强调操控。核心观点需要表达之前就想好，三分钟之内的每一句话，都需要围绕这个观点来展开。核心观点通常是一丝不挂的，所有人都很害怕，不敢直视，所以应该给他披上衣服，让所有人都喜欢他，这就是核心观点。


    这就是要素三，填充论据。比如一家面包房老板如果这样说：“我们的馅儿饼最美味”，这就不会有人搭理他。但他在面包房外的黑板上写了这样的一句话：“巧克力爱好者请注意，让你的牙齿陷入这个二点五公斤重，满是软糖的火山馅儿饼吧”，这就充满了诱惑。很多人愿意尝试。在魔鬼公式中，论据这个部分占了百分之六十的篇幅，但核心就两点：一是有视觉化，二是引发情绪。巧克力软糖、火山馅饼，这些都是引发视觉化的描述，“让你的牙齿陷入”这句话就让人充满了渴望的情绪，这就是完美的描述。


    所有话说完，你还需要最后一步，也就是要素四，呼吁行动。这通常需要你在直接给他强调利益点，让别人行动。比如我再怎么讲故事，也需要在最后说一句：“朋友的海鲜自助餐厅马上开业，你周末就可以去。”很多人介绍自己或一件事情都是直勾勾的说就行了。但其实表达的目的一定是需要对方做出改变。比如你在面试中展示自己，那是为了让面试官从不准备录用到录用你。即便是闺蜜间的简单吐槽，那也需要别人对你认同啊。如果表达完别人毫无改变，那你的表达就没有意义。需要注意的是，因为之前都已经用感性的语句烘托了对方的情绪，所以呼吁行动的时候就不用拐弯抹角了，直接说服反而让人理解。


    怎么样 get 到魔鬼公式了吗？我们简单总结：

    - 要素一绕开防御：讲一个故事，问一个对方的问题，提出一个震惊的事实，是最好的三个办法。

    - 要素二核心观点：每次说话带一个明确的目标。

    - 要素三填充证据：核心是要有视觉化和引发情绪。

    - 要素四呼吁行动：这个环节直接一点就行。


    这个公式我已经反复用了七八年，大到演讲，小到在会议室给别人介绍自己的想法，他可以胜任任何场合。想不想尝试一下呢？那就马上对着身边人用魔鬼公式介绍一下你喜爱的一件事情吧。


    ### 改变羞涩不敢说话用这招


    我们来彻底解决一个内向者的普遍问题。羞涩。内向者被困扰的其实不是内向，而是羞涩。想要彻底解决它需要理解羞涩产生的原因究竟是什么？这个原因呢，比你想象的稍微复杂一些，需要分享一个形象的故事。


    荷马史诗里有一个英雄叫奥德修斯，也就是在特洛伊战争中设计木马计的那个人。有一次他回家途中呢遇到了一个妖怪，这个妖怪有一张床，每个过路的人他都会抓到这张床上躺一躺。如果这个过路人的身体比床短，他就把过路人拉到跟床一样长。如果比床长呢，他就把长的部分锯下来。妖怪其实是想和人做伴儿，但他头脑中所设想的理想伴侣应该跟床一样长。结果呢他把所有人弄死了。你当然认为自己不会像这个妖怪一样蠢。


    但实际上呢我们的头脑里却有大量类似的想法。比如你一上台讲话，别人都应该有很好的回应。你一提请求呢，别人就应该会答应你。恋爱时，你觉得别人就应该对你好。为人父母觉得子女就应该活成你期待的样子。一旦对方没有达到你期待的样子，各种情绪就会涌上心头，集中在那些你感觉到能够控制的人面前，情绪会变成愤怒。而在那些你没法控制的人面前，比如在陌生场合，情绪就会转化成恐惧。从此，你再也不敢说话了。


    重复一遍，羞涩的核心是恐惧，对方不会达成你期待的回应。


    斯坦福大学的德韦克教授把这种情况归结为防御性思维开启的表现。这就像原始部落打仗，更强大的部落，通常会把重心放在外部世界的征服中。而弱小的部落呢则更喜欢守着自己的部落，经常关注自己部落的防御情况。想想你是不是这样呢？比如会不会经常产生疑问：“我是什么样的人，别人会怎么看我，我这么做是对是错误？”这样就会导致你更不敢向外表达，不敢犯错，始终守在自己的心理部落中。


    所以，让自己变得敢于说话，不再羞涩，根本需要你放下那些可笑的期待，走出心理防御。如何做呢？我给你介绍两个方法，看上去都不难，但如果你真正实践，就一定彻底改善自己羞涩不敢说话的这个问题。


    第一个方法是放下自己不会犯错的形象。羞涩的人总是为了力求自己不犯错的形象，而不去做自己不擅长的事儿。比如你一些朋友去 KTV，让他们喝酒可以，但就是不唱歌。因为他们会担心自己唱歌的声音被别人说难听。


    请注意，如果你经常发生这种情况，就要意识到这是一个很严重的问题。因为这不仅仅是你不去做擅长的事儿，而是很可能你会无意识屏蔽掉自己犯错的所有部分。比如有个男生在纪念日预定了一个精致的晚宴，结果女朋友迟到了一个小时，男生好不容易等到女生却很不高兴了。他说：“平时就算了，今天你居然迟到了一个小时。”而女生呢也不高兴，她说：“你也没有和我确定一定就是六点呢。而且今天这么堵。”男生的火蹭的一下就起来了：“你自己磨蹭还怪我没有说清楚时间。”好好的纪念日就被几句话给破坏了。就是因为他们都不愿放下自己不会犯错的形象。


    第二个方法是把犯错看作是成长的机会。我见过最好的案

