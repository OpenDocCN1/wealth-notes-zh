    ## 你曾轻视的内向女孩儿被宠成公主


    内向人会因为全部读完本书而发生实质意义上的改变吗？答案是很难。所以今天我想来聊一聊改变很难的原因，以及如何改变这个话题。其实你身边都有一个这样的女生。比如我有一个朋友叫小莎，她是我的高中同学，就是一个内向的女孩。高考时成绩也一般，去了一所普通的大学。


    小莎的朋友一直不多，甚至我一直也不认为她是我朋友。在我们从高中毕业了十多年之后，却反而联系的多一些。她自已有了一个读书会，虽然总共只有三十来个人，但每个月都有活动，感觉很充实。同时，她前两年从公司辞职，开了一家网上送花的花店。


    有一次去她家发现阳台上密密麻麻全是各式的花和植物，感觉实在太好了。而且她现在是想做什么就做什么。比如有一次她问我佛学的问题，后来她就真的去找了大量书籍来看，而且还走访了当地很多寺庙。向每一个师傅请教关于她优秀的地方，可以说的故事实在太多了。


    当然我并不是想说一个烂大街的逆袭的故事，而是想和你聊聊为什么她变了。从一个内向没什么自信，什么都普普通通的人，突然变得什么都不怕了，想做什么就做什么。问题的核心是不再害怕这四个字。在这里可以给你分享一个故事。有一天，一个女人背着一块大石头在湖里游泳，快游到湖中心的时候，因为石头很重，她就游不动了，一直往下沉。


    岸边的人看到以后就大声呼喊，快把石头扔掉啊，太危险了。但是这个女人一直固执地要把石头带着，结果她越沉越厉害。站在岸上的人都知道，只要这个女人把那个石头扔了，问题基本可以解决。可是那个女人却扔不掉那块石头，直到所有人看到她慢慢沉入水中。


    想想我们是不是都很像这个女人呢？总是害怕手里抱着的这块石头，但其实这块石头可能并没有什么意义。在真实世界中，这块石头其实就是你自己的角色。在每个人的成长中都会面临一对矛盾，做你自己希望的自己，还是成为社会希望的人。社会希望的人其实就是角色。


    小莎，一个普普通通的很内向的女生，因为反正都得到了社会的重视，她却成了前者，做自己希望自己成为的自己。而我们当中的多数人，因为一直和社会联系更紧密，却反而成为了后者，成为了一种角色。也就是我们通常所说的体系化。我再说明一个案例，你就明白了。有一部电影叫《守法公民》。大概情节是，男主人公克莱德在家中遭到两名匪徒袭击，重伤之后眼睁睁看着挚爱的妻子和女儿被杀害。检察官尼克负责这个案子有很好的声誉，被他起诉的嫌疑犯几乎都会被定罪。


    然而，在主人公妻子被杀的案件中，因为缺乏关键的证据，检察官尼克只能和主犯达成了认罪协议，结果从犯被判死刑，而主犯获得了轻判。从电影中的镜头来看，检察官尼克对这位主犯毫无好感，和他握手都嫌脏，甚至恨不得亲手宰了他。但因为迫于检察官这种角色限制，只能选择一个相对最好的结局，将两名罪犯都成功定罪。尽管主犯未被判处死刑，很多时候，角色和自我是相互矛盾的。一个人太过自我，就可能会和社会脱节，很可能患上严重的心理疾病；但太过角色，又会失去自己。


    当太多人对你交口称赞时，反而失去了生命力。多数时候，我们都希望躲在一个体系之下，成为体系的一份子，在体系中求得生存空间，避免了心理上的害怕和感到危险。这就是我们刚刚讲到的那块石头，多数人都难以扔掉，所以会感觉生活越来越沉重，但毫无办法。所以勇敢做自已，先扔掉石头。当然我不是指你一定要辞职，而是放下此前角色关系对你的束缚，然后做自已想做的事的同时，再重新建立社会关系，这才有改变的可能。


    但为什么要重新建立社会关系呢？因为某种意义上来说，所有的改变其实也都是关系。比如你想成为作家，如果只有你自己一个人承认，那其实是根本没有改变。只有当你有几百个编辑，几万读者认同你作家这个身份，其实你才做出了转变。当然这看上去是一种循环，从自我又到了角色，但人生何尝不是如此呢？生生死死，循环往复。


