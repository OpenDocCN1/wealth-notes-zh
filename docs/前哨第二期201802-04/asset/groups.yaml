    # 划重点


    +   1.《拜杜法案》让美国的科技可以从高校转让出来，由公司来完成对这些科技的产品化工作，把它们推向市场，从而极大地加快了美国科技创新的速度。\n2.通过前瞻性的指标观测，是能预判到未来的发展趋势的，而不是根据现状作分析，因为根据现状作分析，你得到的其实是过去对现在的影响和现在的结果而已。


