    \ Howard Schultz\n\n1953年，Howard 出生在美国一个普通家庭，身为蓝领工人的父亲遭遇车祸之后，整个家庭就陷入了贫困。不过，在他妈妈的鼓励和努力下，Howard\
    \ 还是顺利地进入了大学。\n\n大学毕业以后，Howard 先是在施乐公司做过销售，可他觉得这份工作太过单调，所以后来去了瑞典居家用品公司 Hammarplast\
    \ 担任美国地区的副总裁和总经理。\n\n![](img/812dfc825c17043226940aa4afb22b20_139_1.png)\n\n1981年，在成为总经理两年后，他注意到了\
    \ supervising 叫星巴克的西雅图小公司，因为这家小公司竟然订购了一大批咖啡研磨机，这订购量比当时规模已经很大的梅西百货还要多。\n\n为了一探究竟，他果断去了西雅图，和星巴克的创始人进行了深入交流。这三位创始人分别是英语老师\
    \ Jerry Baldwin，历史老师 Zev Siegel，和作家 Gordon Bowker。\n\n当时，星巴克其实已经成立10年了。通过这次拜访，Howard\
    \ 发现了星巴克在经营方式上的独特之处。\n\n首先，他们专注于提供深度烘焙咖啡豆，而且品质上乘，是欧式风味的代表，这在当时的美国市场上相当少见，所以这种咖啡豆成了星巴克的独特点。\n\
    \n其次，星巴克会耐心地教顾客选择咖啡豆，并让顾客体验亲自动手研磨、过滤和冲煮，并制成咖啡的全过程。这种仪式感，给顾客带来了一种高品质的全新感受。\n\n\
    要知道，当时大部分的美国人还认为所谓的咖啡就是罐装的粉末而已。于是，这种体验和品牌联系在一起，就造就了品牌忠诚度。\n\n顺便说一下，1971年星巴克第一家店刚刚开张的时候，西雅图正处于经济大衰退时期，有多严重呢？\n\
