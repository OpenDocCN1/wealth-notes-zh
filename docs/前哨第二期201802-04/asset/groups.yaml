    # 预告 | 春节特别内容安排


    下周五就是春节了，在这里，我提前祝你新年快乐。


    原计划，下周咱们应该讲“共享经济”，但是恰逢春节，所以我为你准备了特别内容，帮你放松一下大脑，提供一些谈资，当然，我相信你一定能从中有所收获。


    ## —— ◆ 春节期间内容安排 ◆ ——


    - 周一：前哨美国东岸创新投资考察团

    - 周二：为什么我们要去美国东岸？

    - 周三：真实的科技创新是什么样的？

    - 周四（大年三十）：科技创新发展的五大环节

    - 周五（大年初一）：科技创新离不开专业人士

    - 周六：中国人要拿世界当市场


    这就是下面一整周的内容，讲的是2017年10月份我们组织的《前哨创新投资考察团》美国之行的收获。


    当时我带着国内40多个企业家和投资人去美国东岸进行科技创新考察，历时12天，走访了美国东岸四座最具有创新动能的城市，分别是新泽西、费城、匹兹堡和波士顿，走访了八所名校，分别是罗格斯大学、普林斯顿大学、宾夕法尼亚大学、卡耐基梅隆大学、匹兹堡大学、哈佛大学、麻省理工学院、波士顿学院。


    现在国内一说到科技创新，马上就会想到“硅谷”，好像美国的科技，甚至全世界最好的科技都在这里，但其实并非如此，敬请期待下周的内容哦。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，咱们明天见。


    # 143 | 春节特别内容：为什么我们要去美国东岸？


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 美国东岸相对西岸的创新优势在何处？

    2. 华人技术经理人协会是什么组织？

    3. 美国科技创新的潮流是什么？


    我们昨天讲了《前哨创新投资考察团》的背景，这里还有很重要的话题，就是我们没有去硅谷，而是去了美国东岸。那我们为什么设计这样的路线呢？


    大家都知道，要说去考察美国科技，所有人的脑子里都会冒出一个念头，那就是肯定要去硅谷，但是我们偏偏没有，而是去了另外一些地方，比如说波士顿。


    当然，其实现在已经有越来越多的人去波士顿了，哈佛、MIT都在那里。不过我们还去了匹兹堡，去匹兹堡的人就少一点了。以至于当我们去匹兹堡大学和卡耐基梅隆大学的时候，他们也说，很少见到有中国的团来。更别说我们还去了新泽西的罗格斯大学了，去那儿拜访的中国人就更少了。


    所以大家肯定能够理解，我们这一次的拜访是有特殊安排的，目的什么呢？


    我们不是去怀旧，不是去瞻仰那些成名英雄，而是去探索谁有可能是未来的英雄。很多熟悉我的人都知道，我有一个愿望，或者说一个小小的野心，就是：


    希望能够集合全世界的华人，甚至全世界的优秀人才，描绘出全球的创新地图，而且是实时、有预测性的。


    ### 一、在全球获得了很好的反响


    我也很荣幸，因为我和得到合作的《前哨·王煜全》和现在的《全球创新260讲》，确实在全球得到了很好的反响。


    ### 二、华人技术经理人协会


    ### 三、新兴领域专家数量东岸多于西岸


    这是一个很有趣的转换，也就是说，我们可以用数据来预测未来的创业数据，或者是创新数据。


    所以我们作了一个分析，美国顶尖的人工智能和机器人的教授，尤其是人工智能，实际上已经进入了收获期，各个行业都能得到广泛的运用。


    其中一个最大的行业结合，就是人工智能和机器人的结合，因为人工智能可以使机器人更加智能，能完成更多的事情。而既然叫机器人，就要求它能够解决现实当中与人互动的问题，或者是在现实当中能为我们提供服务和帮助，这是未来一个巨大的潮流。


    因此我们专门分析了人工智能和机器人领域的顶尖的教授到底坐在哪里，最后我们有了一个惊人的发现，其实在美国东岸，这两方面教授的数量都远远高于西岸。就拿我们熟知的硅谷为例，其实硅谷一带的
    人工智能和机器人专家的数量，甚至还不如美国的中西部，包含像芝加哥，像匹兹堡、维斯康辛麦迪逊一带，更别说美国的东岸了。


    如果你认同我们这种前瞻性信号的说法，你就会相信，人工智能和机器人的公司会越来越多地在美国东岸崛起。


    举一个典型的例子，现在的 Uber，也就是美国的滴滴，是在自动驾驶领域取得了领先地位的。匹兹堡已经投放了6000辆完全自动驾驶的Uber汽车，说是自动驾驶，其实是有人在里面，而且还要两个人，不止一个司机。但是这两个人都不驾驶，也就是坐在前面防止乘客坐到前排去。但实际上车是完全自动驾驶的，而6000辆是一个很大的数目了。


    为什么 Uber 选择在匹兹堡投放6000辆自动驾驶汽车呢？


    一方面，是因为匹兹堡政府的支持，给它各种权利，使它可以开展这样的业务；

    另一方面，很重要的原因是，卡耐基梅隆大学在机器人领域是排名前三的高校。甚至有人说，Uber 把卡耐基梅隆大学里面机器人系的专家，挖走了至少一半。


    这就是为什么我们这么偏重美国东岸，尤其是匹兹堡和波士顿这两座城市。


    ### 四、科技创新潮流：城市+高校


    当然，我们也希望大家能够理解，从教授数量能看出的是未来创新的数量，但是这些创新真的转化成产品，是需要有优秀 CEO 的。


    所以，美国创新还有一个特色，就是基本上都发生在相对比较大的城市里，这一轮的科技创新潮流是城市和高校的结合。


    其实匹兹堡还有个特点：


    一方面，这个城市不怎么堵车，而波士顿和纽约堵车都太严重了，西岸就更不用说了；

    另一方面，这些年随着匹兹堡大量的科技公司兴起，据说它的房产价格已经上涨了20%，但是和硅谷那种动辄翻倍的房价比起来，还实在是太便宜了。所以我们甚至可以推荐大家，如果你想在美国购置房产的话，也许匹兹堡是个不错的选择，因为也许再过10年，它的房地产价格真的就翻倍了，我们看到很多的科技成果从这个地方诞生，太多的好公司正在孕育当中，你可以想象它的未来是非常有潜力的。


    所以，我们希望给大家看到的不是过去，甚至不是今天，而是5年之后，有哪些公司能在今天我们拜访的这些地方，在我们今天拜访的公司当中变成了新的世界五百强。


    以上就是我对行程安排的介绍，顺便也向在這個过程中，帮助我们的前哨团的诸位成员和各位老师们，以及华人技术经理人协会的成员们，表示感谢。


    好了，今天的内容就到这里。


    ## 划重点


    - 1.《拜杜法案》让美国的科技可以从高校转让出来，由公司来完成对这些科技的产品化工作，把它们推向市场，从而极大地加快了美国科技创新的速度。

    - 2.通过前瞻性的指标观测，是能预判到未来的发展趋势的，而不是根据现状作分析，因为根据现状作分析，你得到的其实是过去对现在的影响和现在的结果而已。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵。


    # 144 | 春节特别内容：真实的科技创新是什么样的？


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 什么才是真的科技创新？

    - 2. 美国创新的模式是怎样的？

    - 3. 为什么要关注美国的小公司？


    我们昨天讲了为什么要去美国东岸考察的原因，其实我们设计这个路线，除了让大家看到创新的前沿之外，还希望让大家看到实实在在的创新的机制和过程。


    ### 一、科技创新才是创新的主流


    我们大多数人对创新其实有一点点错误的理解，以为那些独出心裁的东西才叫创新，比如说国内的共享单车，实际上它只是源于一个共享的念头，这种创新叫做模式创新，但这并不是创新领域里的主流，大多数创新其实是科技领域的创新，但科技创新很可能没有模式创新那么令人兴奋。


    想想看，媒体最爱报道的是：


    一个19岁的哈佛学生，大一的时候在宿舍里有了一个念头，然后做了一个网站，经过8年的时间，变为一个两千亿市值的公司，当然今天的市值已经更高了，4、5千亿市值了，那就是
    Facebook。


    这样的例子，大家听了都容易兴奋：


    - 一方面是因为反差太大了，从一个穷学生突然变成了世界顶级富豪；

    - 另一方面是表面上似乎不需要太强的科技实力支持。


    连一个大一的本科生都能做到，别的人都会想，我好像也能做到，我的脑子里哪天蹦出一个念头来，我可能就会创造出下一个 Facebook。


    ### 二、教授负责科研，企业家负责产品转化


    我一直强调，真正好的技术都在高校。但是我还要强调，其实这些高校里面的教授们，当他们去搞科研的时候，是没有想到，科研成果要如何被用到商业实践当中的。


    ### 三、美国创新由小公司主导


    ### 四、连续创业者


    我们除了看到这些教授，其实也看到了很多刚刚拿到先进科技成果的、刚刚开始创业的企业家，这些团队甚至只有几个人。


    这些还没有拿到足够多资金的企业家，往往在中国会被误解，大家会以为他们是大学刚毕业，甚至没毕业的，因为我们鼓励创业创新的时候，喜欢说的是90后。但美国很多上台演讲的企业家，其实岁数都很大了，这也是另一个我们一直在反复强调的话题，就是美国很多的企业家是特别擅长做科技转化的，所以他们就会反复地创业。


    我们讲“积木式创新”，每个人要有自己的长板，这些企业家的长板，就是科技转化这一件事，所以往往他做一个公司，对一个技术完成转化，等到产品出来以后，他就会退出这个公司，当然他的股份未必会全卖掉，但这个公司就会找一个更加会做市场、更会做生产经营的
    CEO 来接盘，而这个旧的 CEO 退出以后，就会开始计划下一次的创业。


    所以美国的优秀创业者里面有很多连续创业者，创业过4、5回的都挺常见，甚至有更多的，而且每个公司都很成功，有的上市，有的被高价卖掉。这是美国创业的一个特点，所以我们一直在反复给考察团的团员们强调，看到对方是一个小公司，千万不要怠慢人家的
    CEO，因为他很可能刚刚从一个大公司里成功退出。


    当然，也不是说所有的人都是岁数很大的，美国也鼓励学生出来创业。但是我对此是有 一点不同看法的：


    一般来说，学生创业是可以的，但不能做 CEO，因为要做 CEO 的话，就要对行业有充分的理解，才能理解行业的痛点、应用需求的痛点，尤其是很多对企业和对产业界的应用，更是一般人难以理解的。


    资源就更不用说了，年轻人不可能有很多业内资源，而要做成一个企业，大量的协作是必不可少的，我们说现在是一个协作型的社会，要构建起自己的协作生态来，这都不是年轻人能够做的。


    年轻学生的优势是有热情，有先进技术，他们当然可以一毕业就去创业，但是他适合的是加入创业公司，做联合创始人，他去负责技术方面的工作，或者是在创业当中向 CEO
    学习，逐渐使自己的创业经验成熟起来。


    比如我们就拜访了 MC10 公司，这是全球现在最有名的柔性传感器公司之一，接待我们的是老朋友 Ben，他就是从 MIT 博士一毕业就创业，但他是联合创始人，一直都有非常优秀的有经验的
    CEO 带着他走，这是我们看到的美国创新机制当中的另一个特点。


    最后再说一点，当我们中国人去看更大的公司的时候，我们就更容易重视和尊重人家，但我强调的是，因为美国的科技创业是一个完整的系统，一个公司从零做到产业里举足轻重，甚至数一数二，往往需要
    15年到20年的时间。


    所以千万不要轻视那些今天还非常小的小公司，也许它10年后、15年后就是下一个世界500强。当我们看一个公司的时候，也不能用一个恒定的眼光去看，而要用一个流动的眼光、
    用一个有时间轴的眼光去看这个公司的演变，要知道它在整个的演变规律里处在什么阶段，这是非常重要 的。


    好了，今天的内容就是这样。


    ## 划重点


    - 1. 在美国，科技创新是创新领域的主流，创业者往往是名校生，四五十岁，经验丰富，甚至是连续创业者，他们有一定影响力、资源和人脉，然后从高校里拿到好的教授的科研成果，用8到10年转化成产品。

    - 2. 美国的创新由小企业主导，主要是“双长制”，也就是一个非常棒的、有充分业界经验的 CEO，和一个有科技突破的教授相结合。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我们明天见。


    # 145 | 春节特别内容：科技创新发展的五大环节


    王煜全


    今天是大年三十，辞旧迎新，首先祝大家节日快乐，其次我要“狠狠地”表扬你，因为今天还能打开专栏学习的你，一定是非常非常热爱学习的，持续地学习，你的人生一定不一样。


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 为什么说创业孵化器是一所幼儿园？

    - 2. 投资背后的原则是什么？

    - 3. 如何才能与美国创新公司达成合作？


    昨天我们介绍了科技创新企业的技术来源往往是高校，这就需要独具慧眼的CEO能把它选出来。我们反复提醒和强调，不要小瞧美国小公司的CEO，他可能只是刚刚接过一个新的技术做孵化，团队刚刚建成，但他很可能是业内的老兵，已经有过多次创业，甚至是身价不菲了。


    ### 一、创业孵化器是一所幼儿园


    我们之前介绍过，在高校里刚刚孵化出来的企业，是依托高校和教授发展的，直到它找到一个好的CEO，搞定融资为止。


    ### 二、著名投资人伊萨·布莱克的分享


    总的来说，现在美国科技创新企业的成长：


    - 第一个环节是高校，或者是高校孵化器；

    - 第二个环节是社会化的孵化器；

    - 第三个环节就是拿到投资人的钱，开始自己成长。


    来说，即使拿到了更多的钱，也不会去铺张浪费去瞎花。


    所以，其实投资背后的原则，就是钱要给能够掌握这笔钱的人来花。


    ### 三、爆发性增长的前夜


    科技创新企业成长的第四个环节，就是完成科技的产品化，而这也正是一个技术和一个公司爆发的前夜。


    在波士顿的最后两天，我们拜访了我们海银资本几年前投的两家公司，无线充电的领军企业 WiTricity，柔性电子的领军企业 MC10，它们现在已经慢慢成长为大公司了。


    这两个公司总的来说，都已经走到了爆发的前夜，2018年的夏天，宝马就会推出无线充电的电动车，用的就会是 WiTricity 的技术，可以说在未来5年里，全世界的各大车厂都会推出自己的电动车系列。但是据我们了解，基本上用的都是
    WiTricity 无线充电技术，所以大家可以想象，当全世界的汽车都逐渐电动化的时候，它们的市场潜力有多大。


    另外 MC10 也是一样，它们做的著名的“生物印章”医疗诊断贴纸已经很完善了，它可以贴到每个人的皮肤上，没有不适的感觉，能够做到医疗级别的实时长期监护。


    我们都知道这对大量的慢性病，尤其是运动相关的疾病，老年人相关的心血管疾病等等，都会有特别重要的价值和意义。


    尤其是 MC10 还把它和人工智能、云计算相结合，使智能化程度大大加强，变成了一种非常贴身的智能可穿戴设备。现在这个技术已经完全成熟产品化了，正在和美国的各个大医院合作推广。这样公司的收入利润，包括市值的增长，自然是指日可待的。


    所以总的来说，我们这一趟行程让大家看到了一个科技公司是如何一步一步成长起来的，而且在每一个阶段，都有这个阶段的专业的人来辅助他们完成这个阶段的任务，使得他们能够迅速地成长到下一个阶段。


    ### 四、打造中国长板


    科技创新企业成长的第五个环节，是我们非常自豪的，因为当美国的科技创新企业的产品化基本完成，就到了我们中国人最专业的部分，那就是高科技的量产能力，这个能力我们中国人独步天下。


    所以我们说，中国的制造业千万不要妄自菲薄，因为中国制造业是世界一流的，甚至我们说，加上三个定语，大规模的、开放式的、复杂产品的制造，中国的制造业就是全球唯一的。


    所以美国的先进科技很需要我们，这也是为什么我们要把中国的企业家带出去，因为到了美国你就发现，太多的先进科技你是可以支持的，甚至是它急需你的支持。


    这也是我们要强调的，当你对整个创新系统有了了解的同时，也要找到自己的价值，因为这个世界，积木式创新的核心是强强联手，是长板和长板叠加的合作，也就是说，如果我们没有长板，是没有办法去和别人合作的。


    所以很多人问我，美国这个公司特别特别好，我能不能去寻求合作？


    我说，你要先问自己，你对它能不能有价值，你对它的价值是不是不可替代的，如果是，你肯定是能达成合作的，如果不是，你说我只有钱，那很多先进科技公司还是会把你挡在门外。


    以上就是今天的内容。


    ## 划重点


    - 1. 科技创新不是一蹴而就的，它需要深厚的科技领域的学术积累和一个很长的发展周期。

    - 2. 科技企业是指数级的发展，存在爆发的拐点，这个拐点就是完成了先进科技到产品的研发，进一步推向了市场。

    - 3. 作为创业者，如果一个项目选择错了，就要懂得停掉它，持续地消耗自己的精力，实际上是对自己信用的极大伤害。

    - 4. 投资背后的原则，就是钱要给能够掌握这笔钱的人来花。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，我们明天见。


    # 146 | 春节特别内容：科技创新离不开专业人士


    王煜全


    今天是大年初一，我在这里给你拜年了，祝你新年快乐！


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 为什么要找好的律师和律所？

    - 2. 为什么说不能在技术经理人方面省钱？

    - 3. 美国东岸的创投不如西岸优秀吗？


    昨天，我们讲到美国科技创新企业的发展规律，今天我们讲在创新过程中必不可少的“专业人士”。


    在美国的科技创新领域，有一个重点，就是专业的你做专业的事，因为在每一个阶段，创业者需要的支持不同，都要找专业的人士来帮忙。


    所以我们的考察团这回把一个科技成长企业发展过程中所需要的专业人士都请到了，给大家做交流。


    ### 一、律师


    首先，在美国做什么事都需要律师，尤其如果是中国企业要去美国发展，更需要同时熟悉中国和美国的律师，所以我们专门请到了纽约的李岳律师，他们律所也一直为海银资本提供法律服务，关于中国企业如何在美国做事情，他们提供了很专业的意见。


    在费城我们还参观了另一家很大的律师事务所 Morgan Lewis，里面的柴德平律师是华人技术经理人协会的首届律师，柴律师在费城也帮我们做了很多联络和接待的工作。


    我们为什么要介绍 Morgan Lewis 呢？


    因为，做企业的时候，你用什么档次的人作支撑，其实也反映出你自己的档次。


    讲一个小故事：


    ### 二、技术经理人


    除了律师以外，因为涉及到技术转让，技术经理人在这里面也是非常重要的。


    文立民老师是华人技术经理人协会的会长，也是波士顿学院负责技术转让的总监，也就是这个学校里面技术转让的一把手。他是华人中第一个做到这种职位的，可以说在技术转让这个圈子里面是非常有名望的。还有，我们去拜访的罗格斯大学的张勇老师，也是非常专业的技术经理人。


    中国企业出去常犯的一个错误就是，我们虽然出去了，但碰到一个企业就想跟人家合作，没有对国外的整个技术前沿作一个系统性的梳理，这其实是非常危险的。


    因为，科技企业最大的风险往往不是自己经营的风险，而是虽然自己的技术在已知的范围内是领先的，但是你不知道在另外的领域，可能就有那么一个技术，甚至是完全遵循不同科技路线的技术，能对你的技术形成完美的碾压，很多科技企业最后就是这么消失的。


    比如在太阳能领域，其实一直有两个路线在争斗，我们投资的1366，走的是发展多晶硅的路线，很幸运，这条路线暂时看起来胜出了。但另一条薄膜的路线，到现在应该说还没有完全失败，未来还有反扑的机会，不过至少在这一轮的太阳能产业化大潮当中，主力是多晶硅的路线。所以，如果你是一个做薄膜太阳能电池研发的公司，不管你再优秀，只要你的技术水平达不到多晶硅的水准，就是会被完美碾压。


    我们一定要注意：


    很多的时候，科技创新千万不要只看自己这个小山头，别做井底之蛙，而是要有全局观，这也是为什么我们给自己的公司命名为“创新地图”，所谓地图就是要对全世界的科技前沿、科技高地了如指掌，这样才能去找最先进的公司合作。


    中国的企业走出去，在技术经理人这方面千万不要省钱，因为他可以避免你后期的业务和投资上的巨大损失。


    ### 三、风险投资人


    除了技术经理人以外，还有一个很重要的专业人士不得不说，就是投资人。


    我们这一回也专门请到了美国一个刚刚建立的风险投资基金，叫 Material Impact。这个基金的创始人 Carmichael Roberts 来给我们做演讲。


    你不要以为这个基金刚成立，创始人就没有经验，因为 Carmichael Roberts 在美国的投资界是鼎鼎大名的人物，他原来的基金叫 North Bridge，他在里面已经做了很多年。


    甚至在这之前，他就已经很有名了，我们都知道美国有个杂志叫《 MIT 技术评论》，专门评论世界的科技前沿，尤其在技术创业领域是非常非常权威的。《 MIT 技术评论》每年都有一个评选，叫做“35岁以下35个创新者”，基本上被评选到这里面，就会被认为未来之星，这个评比在20多年以前就开始了，Carmichael
    Roberts 就是第一届中的35人之一。那时候他正在创业，是一颗冉冉升起的创业新星，后来创业成功，他加入了投资圈，现在又成立了自己的新基金，专注于投资硬科技。


    我和 Carmichael Roberts 是非常好的朋友，我们的团员也对他呈现的项目另眼相看，为什么呢？


    因为他的成熟度和科技先进性比我们之前在孵化器里面看到的要好一个数量级。


    所以这里面又会讲到另一个我们一直强调的观点，至少从我们海银资本来看，我去海外投资是不参加路演的，为什么呢？


    因为如果你足够好，你有足够好的技术，CEO 有足够的实力，投资人是不可能事先不知道的，也就是说好的项目，无一例外，都是还没有出来就被投资了，没有机会在路演上去找钱。


    在这个创业生态里面，Carmichael 是一个非常耀眼的明星。你回想一下，你知道的风险投资人，是不是全是西岸的，或者是甚至都是硅谷的。


    比如说你知道彼得·蒂尔、马尔·汉德森、杨致远，红杉的 Michael Moritz，为什么没有西岸的呢？


    其实不是东岸的创投不优秀，2016年麻省...

