    ## 196 | 新零售的发展趋势和机会


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 苹果是如何营造线下购物体验的？

    2. 盒马鲜生是如何进行物流创新的？

    3. 新零售行业的发展趋势是什么？


    周一我们说过，在未来可能出现的生和购物新场景中，无论是线上还是线下，如果你能采用各种手段为客户带来全新的体验，那你就抓住了新零售的机会，比如说改善购物方式、购物速度，甚至是提供独特的过程体验等等。


    今天我要从苹果和盒马鲜生的线下体验店说起，看他们是如何设计这种独特体验的，并以此为出发点，跟你分析一下未来新零售行业里各种生态的发展趋势。


    ## 一、苹果借鉴奢侈品销售模式


    我们有很多人都使用苹果手机，也一定逛过苹果的线下零售店。你在逛的时候，有没有感觉和其他电子产品店完全不同呢？或者说你有没有觉得更像是在逛奢侈品店？当然，苹果店里的人总是很多。


    其实这种感受正是苹果公司精心设计的，在乔布斯时代的苹果，就开始借用奢侈品惯用的营销策略和线下店面布置风格了。


    从营销策略来说，苹果主要会先采用限量发售。每次出新品，它会在全世界分批发售，各国区域还要限制出售的数量，这就人为增加了产品稀缺性。同时，也让抢先用上新品的用户拥有了区别于其他人的优越感。


    为了给用户带来奢侈品级的极致体验，2014年，苹果更是找来了曾在奢侈品公司Burberry担任CEO的Angela Ahrendts，让她出任苹果零售和在线商店的主管。Angela把布置奢侈品陈列和营造气氛的经验，都移植到了苹果的线下零售店。


    比如说，把苹果的店内布局重新划分成5大区域，包括销售区、天才林、论坛区、会议室和空闲广场，让消费者可以更快找到自己需要的服务。同时，也为那些对自己需求还不明确的潜在用户提供交流的区域。


    另外，为了消除电子产品给客户带来的冷峻感，零售店内错落有致地摆放着各种绿色植物。比如说，天津恒隆广场开业的苹果零售店，大厅中央摆放着两排高大的榕树，树根栽在一个硕大的白色容器中。


    为了营造全新的线下购物体验，像苹果这样，把其他行业的营销和销售模式应用到本行业合适的场景中，确实是创新方法之一。


    ![](img/812dfc825c17043226940aa4afb22b20_144_0.png)


    ## 二、盒马鲜生的高效物流创新


    但如果销售的不是苹果那样高科技产品，而是普通的食材，又该怎么做呢？


    我想，可能你们很多人对盒马鲜生已经比较熟悉了，也通过它的App购买过生鲜食材。走进店里，一眼望去，表面看起来很难发现和传统超市的不同之处。但如果你仔细观察一些细节，就会发现区别了。


    接下来，我以几个具体场景为例，跟你展开说说。


    假设你下午6点下班，预计6点半就能到家。从办公室出门前，你在盒马App里下单了新鲜食材，差不多等你到家，就能收到食材开始做饭了。


    你肯定会好奇它怎么这么快？


    其实就在4月，盒马鲜生宣布，北京和上海的25家门店做到24小时配送，保证门店3公里范围内30分钟送达。


    这种高效物流它是如何做到的呢？


    这就要说下盒马鲜生打造的“仓店一体”和“自动物流”模式了。


    首先，盒马门店不仅是一个“线下零售+体验店”，同时也是一个“前置仓库”。


    什么叫前置仓库呢？


    其实很简单，它的每个线下门店都是一个中小型的仓储配送中心。总部中央大仓只负责对各大线下门店供货。当你下单后，商品不是从远在郊区的某个仓库发货，而是从附近的门店里发货。这个做法是实现30分钟送达的重要前提。


    其次，盒马采用“自动物流模式”，大幅提高了装箱配送的效率。


    简单来说，就是前面拣货打包10分钟，后面3公里运送20分钟，总计大概30分钟送到你家。


    整个物流过程通过无线专业设备RFID，英文全称是 Radio Frequency Identification，又叫作“无线射频识别”，这个技术我们昨天说无人商店时就讲过，它不用接触或者扫描目标，只通过无线电讯号就能识别特定目标并读取相关信息，通过RFID和追溯体系，盒马就实现了系统化、数字化。


    给你举个例子：


    上海金桥国际广场的首家盒马鲜生门店，它的后台设置了300多平的合流区。你可以自己提着筐篮选购，再把商品拿到自助结账机前扫码结账。


    当然，还有另一种方式是，你不用提着篮子在店里逛，只需要边逛边扫描食品的电子二维码，就可以直接在App下单。你选购的东西会被店员迅速分拣，通过传送带送到收银台。在App结账后，你直接去收银台拿东西就行了。


    ![](img/812dfc825c17043226940aa4afb22b20_144_1.png)


    门店上空到处可以看到金属网格链条，你在店里抬头，甚至能看到各色包裹在头上的“空中挑道”飞来飞去。


    接到盒马App订单后，线下工作人员在店内货架上分拣。


    这些分拣人员的任务是按区域划分的，一个订单可能由几个工作人员同时操作。而每位操作人员都持有RFID设备对产品和订单进行追踪识别。人工分拣完成后，这些货物会由链条传送带送到后台打包。盒马要求拣选打包时间控制在10分钟以内。打包好的包裹将交由前台由客户取走，或者快递人员送货上门。


    对于那些平时不做饭，却需要去超市帮家人买食材的顾客，可能他自己也不知道怎么判断食材的新鲜程度。


    那我们怎么确保买到的果蔬生鲜都是新鲜安全的呢？


    首先，盒马从采购源头上整合供应链。


    传统的菜市场和超市全依赖主或采购部门的经验进货，产品质量波动大。而盒马利用消费数据和大数据分析能力，优化供应链。每天下午，根据当天的销售数据，综合考虑其他因素，动态制订第二天的销售计划。


    比如它的自营品牌“日日鲜”，就是采购团队和中粮集团当地的蔬菜生产基地合作，通过即时分析数据提供需求的方式，保证获取最新鲜、供应量最充足的食材。


    其次，和传统生鲜超市不同，盒马从一开始就布局产品标准化和可追溯性，这样便于管理和提高供应链效率。


    除了少数产品，比如生蚝和以条来销售的活鱼外，其他几乎所有商品在到店时，就已经是独立包装，并且把重量和价格标识清楚了。通过盒马App扫描包装上的二维码，就能追溯到它的产地、供货商信息，确保买卖双方消息对等。

