    # ——▶ 今日内容看点 ◀——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 传统经纪公司有哪些弊端？如何转型？

    2. 保险科技是什么？有何价值？

    3. 科技初创公司是如何把握机会的？


    在开始今天的话题前，我想先来考考你：


    +   你知道制作一份普通大小的寿司卷要用多少米饭吗？

    你知道哪种颜色的胡萝卜里面胡萝卜素含量最高吗？

    �().


    我想，绝对多数人是很难把这些问题回答清楚的，当然这并不是有奖问答，而是一家互联网保险公司 App 上的题目。怎么样，是不是有点儿意外呢？


    一说起保险，相信你自己或者你周围肯定不少人都有购买的经历，比如说人寿保险，在购买之前，你得先提供体检报告，保险公司要用这个来确定保险价格。但是，这种做法是有缺陷的，就是数据不够全面，因为人的身体状况是一直在变化的，是动态的。


    那么，在移动互联网时代，保险公司会有哪些创新呢？


    这周我们就来聊聊互联网保险的新模式。


    # 一、保险的商业模式


    其实，它的基本质就是从广大的投保人手里募集资金，形成大规模的资金池，再通过金融手段进行投资获利，这就是保险机构的主要获利方式。


    类似的就是银行通过吸纳存款，然后通过放贷来获利。可以说是非常像，举个例子，寿险产品除了传统的保障功能外，其实也有和银行存款类似的储蓄功能，也就是“储蓄寿险”。


    当然，不论是哪种保险，除了巨大的现金池以外，保险业的核心业务就是采取各种手段进行风险管控，可以说哪家保险公司的风控能力强，就拥有了竞争优势。


    # 二、传统保险存在的问题


    但是，很长时间以来，咱们中国人对保险的印象大多是负面的。


    因为保险主要就是依靠人海战术，一般是线下的销售人员和电话销售。相信不少人都遇到过，比如街坊邻居或者亲戚朋友哪个好去干保险了，第一件事情就是先推销给你，本来大家都觉得卖保险的都是骗子，现在得着情面确实让人挺难受的，买还是不买呢？所以大家对卖保险的都是避之不及。


    而且，更关键的是，大家为何会觉得卖保险的是骗子呢？


    其实就是因为让你买的时候说得好着呢，但真出事儿了总给你感觉他们在推三阻四不想赔似的。这种事情发生的多了，一传开也就没人信了。


    其实这个问题根源在于，传统大保险公司一直存在准入门槛高、赔付周期长、保单复杂、信息严重不对称等等诸多弊端。


    而造成这种弊端的原因是，传统保险公司基本都是金字塔式的组织结构，总部需要根据人口的相关数据进行保险精算、设计产品，然后一层层下发到最前端的保险代理人和终端去销售。发生事故以后，需要取证，保险公司需要层层审核、确认、然后再赔付，周期很长。


    随着互联网时代的到来，传统保险公司越发显得脱离时代了，臃肿的组织架构和人员，让运营成本和销售成本激增，也让产品的迭代周期更加漫长。


    光培训终端如何卖产品就非常繁琐，在同样的时间段里，新兴的互联网保险公司可能都出了几十款产品了，而传统保险公司可能才刚走完内部审批流程。


    尤其近几年，以大数据、移动互联网为核心的保险公司开始兴起。从产品设计的角度来看，互联网保险呈现出了场景化、定制化、规模化、线上迅速等特点。


    此外，它们都是深度绑定应用场景的，大大地丰富了保险的销售渠道和方式，大家想要买保险也不再需要通过销售人员和电话销售平台了，更多的是在碎片化场景中，比如说在购物、旅行、甚至是在娱乐的过程中，就完成了购买。


    这些特点都是传统保险公司很难拥有的。


    # 三、保险科技


    随着加快和科技的融合，大数据、区块链、人脸识别、云计算平台、物联网等等正在逐渐渗透到保险的各个环节里。


    这儿先跟大家解释一下什么是“保险科技”，其实就是借助科技手段实现保险产品的研发、落地和发展。保险科技的全面应用，会降低普通人享受保险服务的门槛，并且还能基于大数据开发出更多个性化的保险品类。


    那么，在“保险科技”的推动下，传统大保险公司和科技初创公司分别是怎么做的呢？


    # 1. 传统保险公司中国平安


    我先给你介绍传统公司的做法，举个例子，作为国内传统的大型保险公司，相信很多人都购买过中国平安的产品。他们积极利用AI+大数据，建立了技术平台“一账通”。


    平安一账通，就是创新式综合金融理财平台。通过一账通，仅需要一个账户，就可管理所有平安账户和50多个其他机构的网上账户，满足保险、银行、投资等多种理财需求。


    具体来说：


    在投保方面，一账通会通过人脸识别和声纹认证技术为客户建立独一无二的生物档案，不仅建档的速度远比以前快，而且也更安全，很好地把投保时间从过去的平均15小时缩短到30分钟就能完成。


    在理赔方面，通过智能闪赔的高精度图像识别、海量赔案数据积累，再结合深度学习技术，一账通能让车辆理赔识别精度达到90%以上，包括---渗出定损、自动精确定损、智能险限制，单万元以下的赔付案件效率提升了42%。


    良好的使用体验，让中国平安的这款产品的退保率仅为1%，远远低于行业4%的退保率。


    同时，平安集团也是最早布局区块链技术的企业之一，他们把区块链技术和安全体系相结合，用到了保险业务里面。今年2月，一账通正式推出区块链解决方案，叫一账链，截至2017年底，平安区块链已覆盖的交易额超12万亿元。


    通过这些技术的应用，可以说，平安保险越来越像个互联网科技公司。


