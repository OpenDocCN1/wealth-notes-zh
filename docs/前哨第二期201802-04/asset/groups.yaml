    # —— 全周总结 ——


    第一，目前中国已经进入了老龄化社会，银发经济在未来会是一个非常庞大的市场，其核心在于对老年人生理和心理双重需求的深刻理解，要让老年人健康有所保障，同时保持健康的心态，而满足这两大需求，就都离不开科技的支撑。


    科技养老可以让我们跳出旧有的“养儿防老”的思考模式，从根本上改善老年人的生活，在科技的帮助下，我们能用更少的人力、更低的成本提供更高效率的服务。


    第二，老年人群体虽然有着相似的需求和痛点，但与此同时，银发经济又是一个典型的细分场景众多的领域，这就意味着有非常多的应用场景等待着创业者去挖掘，科技可以发挥的空间非常广阔。


    创业者要有一双善于发现问题的眼睛，从老人的真实需求出发，找到解决方案，这样才有机会会握住商机。


    # —— 用户答疑 ——


    陪护机器人应该和专业的服务人员或者家人们共同完成陪护责任，但是有个悖论：人工智能替代了大量专业化的工作，是否会使人们有时间陪家人，从而对陪护机器人造成冲击呢？


    我的回答是：


    陪护机器人细分是两种，一种是护理老人的，另一种是情感安慰的。


    欢迎。


    因此我们需要去研究的是，老人在哪些方面有更大的贡献，比如在人际方面，社会和谐方面，老人的经验和贡献肯定会更大。


    我们也说过，未来有三种人不可替代，领导者，创新者和连接者，其中连接者的数量会大大超过创新者和领导者，老人就适合做连接者。因为他们阅历丰富，可以纠正创新者的过激的举动，过于创新也不好。而且他们的资源丰富，可以帮助创新者拼搭合适的积木，使得事情能够做成。


    但是一定要强调的是老年人辅佐年轻创新者的价值，而不是老人直接来领导的价值。因为老人在创新里往往会比较弱，在过度尊老的社会里，一味由老人掌舵，在快速创新的社会当中，他们的竞争力反而会弱化。日本就是这样一个值得我们警惕的例子。


    我们中国有敬老的传统，这非常好，但我觉得这是一个理性的时代，帮助老年人发挥真正的价值，而不一味认为老人说... 是更可取的做法。


    以上就是本周的问答。


    # —— 下周预告 ——


    我们下一周的主题是普惠金融。


    2016年有一本很轰动的书叫《21世纪资本论》，之所以轰动，就在于它用数字说明了一个很残酷的事实：


    > 在任何相对平稳的社会阶段，资本回报的收益都大于整个社会的价值增加。


    当然，新科技的不断涌现在一程度上打破了这种不均衡，因为科技的回报会更大。但是科技回报的范围很窄，也就是说科技创业者能够得到回报。


    但是一旦讨论的是科技对社会的整体推动，那就不还是比资本回报率要低了。这样作为不从事科技产业的老百姓，似乎注定要吃亏，不如资本增长的快嘛。


    不过，现在有个好消息，就是普惠金融。也就是说，造成资产阶级的资本回报提升的各种工具，现在也都可以向普通老百姓开放了。


    到底有哪些工具？开放的效果如何？你能不能用上？


    相信你一定会关注的。


    # 划重点


    - 1. 未来，虽然人工智能会替代大量专业化的工作，解放人力，但陪护机器人依然会被大量使用。因为人为了实现自身价值，会更为专注于那些机器人做不了的事儿，很可能会更忙。
    2. 未来有三种人不可替代，领导者、创新者和连接者，其中连接者的数量会大大超过创新者和领导者，而老年人非常适合做连接者，因为他们阅历丰富、资源丰富，可以帮助创新者拼搭合适的积木，使得事情能够做成。


    王煜全


