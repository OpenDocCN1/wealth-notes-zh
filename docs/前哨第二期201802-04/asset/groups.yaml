    恰逢今年是改革开放40周年，作为经济特区的深圳，如今已经是全球制造业创新高地，是群体加速创新最好的代表，这里聚集着我们颇有行动力之前哨用户。


    所以，今年我选择来到深圳。如果你也想来到现场与我一起探讨，现在就可以在得到商城购买前哨大会的门票了，4月22日，我在深圳等你。


