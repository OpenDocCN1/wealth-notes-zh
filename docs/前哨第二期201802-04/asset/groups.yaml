    划重点


    - 1. 外骨骼有着大量的应用场景，不仅能解决老年人行动不便的问题，还能帮助工人省力气和避免受伤，也可以应用到医疗和军事领域，市场广阔。 2. 外骨骼产品目前依然存在笨重、价格昂贵的问题，销售收入难以弥补研发投入，对投资者来说风险极大。
    3. 使用人工智能技术开发外骨骼，降低了开发成本，效率也更高，已经成为趋势。


