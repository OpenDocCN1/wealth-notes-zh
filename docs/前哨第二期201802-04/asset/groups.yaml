    第四，要有大量资本支持，这样才能尽 快用资本的力量跑马圈地。


    一旦用户规模超过了雪崩点，雪崩点指的是市场上新增用户多数都会选择你这个应用，这个应用就会有马太效应，那么企业就会胜出了。当然，最后如果市场当中只剩下两家寡头的竞争，因为都是用资本的力量推动的，资本的意志就会超过创业者的意志，两家不会一直打，因为一直打的话都没有利。'
