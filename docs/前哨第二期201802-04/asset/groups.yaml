    # 182 | 中国经济如何才能立于不败之地？


    # —— 全周总结 ——


    本周的话题是健康管理，我们介绍了三个重点：


    第一，世界卫生组织的数据证明，引发疾病的所有因素当中自身的行為占60%，我们想象中对健康因素有决定性作用的遗传因素实际上只占15%。


    也就是说：


    如果我们把自己的健康当作财产一样悉心管理，及时纠正自己的不良生活习惯，就能大大减少患病风险。


    因此健康管理对于个人和国家来说都有重要意义，做好健康管理不仅可以减少患者的病痛，还有效降低医疗支出。


    第二，获取健康数据主要依靠医院或者其他医疗健康机构的定期体检，因此传统的健康管理企业更偏向于重资源型，甚至拥有自己的保险部门、医院和医生。


    但是近年来随着互联网、可穿戴设备、大数据、人工智能等技术的发展，获取数据的门槛降低，提供健康管理服务的成本降低，创新企业有机会利用技术切入健康管理，特别是在细分领域的健康服务。


    第三，健康管理是一件反人性的事，大多数人本能地会选择愉悦的事情，所以抽烟、喝酒是人性使然；但是健康管理在很多情况下并不会让人感到愉悦，甚至是相反让人遭受罪。


    因此，健康管理企业要考虑的非常重要的一点，就是如何帮助用户战胜人性当中的弱点。


    创业者可以借鉴两种手段来帮助用户提高健康管理的参与感：


    +   一是运用实时及及时的行为数据，让用户获得及时反馈；

    +   二是将健康管理活动游戏化、社群化，利用人性的弱点极力推动它养成健康生活习惯的目的。


    # —— 用户问答 ——


    如果中国出现凯撒模式，我会有几个疑虑：第一，就算中国能把凯撒模式的结构建设起来，会有两个结果，要么形成类似传统保险行业的金字塔结构，船大难掉头，要么就是美国模仿凯撒模式的负面效果呈现。第二，医生团体的质量如何保证？所谓的名医都在大医院体制里，私人企业找来的医生值得信任吗？


    我的回答是：


    我们在那一期内容里也强调了，凯撒模式不好学，因为管理一个既庞大又复杂的系统是需要高超的管理水平的，不过我们强调的不是照搬凯撒模式，而是吸收消化其中的优点。


    我认为有三条：


    第一，凯撒模式强调对医疗保险的简化。


    预付一定的费用给医院经营的，医院就放手看病就是了，不纠结于每一单的报销费用，这样成本自然有降低的空间。


    第二，凯撒模式强调用户管理。


    让用户少生病，因为医生不靠每个病人赚钱，自然就愿意帮助病人省钱以建立自己的好口碑，这样健康管理就推动了。


    第三，病人少花钱。


    凯撒还能有降低保费的空间，然后还能把这个利益再让一部分给医生，形成自己的竞争优势，结果皆大欢喜。


    所以凯撒模式的核心：


    不是形成一个保险公司、医院、医生集团都从属于自己的巨大的公司结构，而是要形成医生愿意帮病人省钱、病人愿意配合、保险公司愿意把利益拿出来共享的一个多赢机制，核心就是以事前干预降低保险赔付。


    美国对中国开展301调查，其实质不是为了贸易失衡，而是针对“中国制造2025”规划以及高科技制造业进行，其中有一条就是严格限制中国企业对美国企业，特别是高科技企业的投资和并购，这个局该怎么破？难道中国企业到美国去帮助美国产业复兴，我们中国的产业就不要了么？


    王老师多次提出中国企业要走出去设厂，我有几个不明白的地方：一，如果是走出去设厂，当不是要某个行业的产业链都过去吗？要不然几家有意识的公司过去岂不是亏吗？如果全搬过去，那中国制造还有前途吗？二，美国的机器人行业比较发达，会不会根本不需要中国企业过去设厂？


    我的回答是：


    这两位用户关心的主要是两个问题：


    +   一是这场贸易战的实质，中国能否打赢这场贸易战；

    二是我们原来也说过，未来的我们一定会感谢川普让中国人出海，因为这样我们才能真正国际化。但现在看其实有很多人有这种困惑，肥水不流外人田，我们出去了不是成了帮他们挣钱了吗？我们中国的产业怎么办呢？


    先说贸易战。


    我们上周的周末加餐里介绍了，川普不是个合格的政客，而是个特别知道投资观众最好看的电视明星，同时他也超级在乎公众对他自己的评价。


    他现在之所以打贸易战，是因为老百姓对过去20年收入没有增加积累了很多怨气，再一看中国增长这么快，变得这么富，很容易错误归因于中国抢了美国人的饭碗。这时候川普出来制裁中国就显得很顺应民意，很容易得到大家的好评，但是这个不长久。


    第一，中国的反制裁是针对美国有大量从业者的产业的，尤其是大量相对不太高端的从业者，他们本身就是最有怨气的那批人，也是最支持川普的人。川普制裁中国他们却一喊好，结果中国的反制裁就让他们利益受损，他们就很难再支持川普了。


    第二，川普的制裁和中国的反制裁使得股市大跌，因为股市的核心其实是公众的信心，公众对市场有信心，股市就会涨，但公众没信心了，股市跌了，股民损失的可是真金白银，他们也会给川普压力。


    这就是为什么美国打中国的高科技，而中国打美国的农业和汽车产业的原因。


    再说第二个问题，成片的贸易战打不起来，但是单点突破，川普一个一个给中国企业小鞋穿还是做得到的。


    他在美国国内也是向一个一个美国企业喊话，从而成功逼迫他们放弃海外建厂，改到美国建厂的。而在宣传上这种单点突破更有传播力，因为面对具体对象，更容易成功塑造“坏人”被好人主持了公道的戏剧效果。华为在美国最大的困境就是被塑造成了坏人，从而遭受了许多针对性的不公正待遇。


    我们做海外游学，团员中有很多成功的企业家和投资人，我们都在培训他们学会讲美国人听得懂的故事，学会让美国人理解，现在全球是两大主导潮流的叠加：

    一个是科技的效果凸显，但尚未惠及大众；

    另一个是传统跨国企业把国际化的利润装到了自己腰包里，大众也没得到利益。

    而中国是使科技能够更快更广地惠及大众的力量，也是和新科技企业合作，打破传统跨国企业垄断的力量。


    所以，中国不是美国贫富分化的原因，而是美国贫富分化的解，甚至可能是唯一解。施展老师说中国是枢纽，我相信也是因为这一点。


    但是如何更好地发挥枢纽的作用，光窝在家里肯定是不行的。


    我从咱们前哨用户的问题里听出了忧国忧民，但是也听出了视野有一定问题。我们老觉得中国企业走出去就被人家赚走了，其实现在各个产业都有产业控制力的问题，控制力强的企业才会获得最多的收益。


    就像手机，苹果依然是产业控制力最强的企业，很多新科技和科技带来的新应用都是他们带动的，所以他们利润最高。


    原来听过一个观点，说苹果应该像微软的Windows一样，把苹果操作系统的iOS开放，那真是不懂移动产业的纸上谈兵。其实，苹果就是严格控制不开放，才能给应用开发商打造一个最好的开发环境，使得最好的应用永远最先在苹果手机上实现。


    我们知道了控制力的理论，就能明白为什么全球会有“隐形冠军”的说法，其实就是指那些虽然名气不大，但对本行业有真正控制力的企业。而要实现控制力，把自己局限在某个地域以内无疑是不明智的。


    我们说过，中国的开放的、大规模的复杂产品的制造能力全球唯一，但这个能力只能构建在中国，那就会成为这个能力最大的障碍。如果我们把这个能力在全球构建起来，使得全球创新者都能方便地使用这个能力，中国经济才真的是立于不败之地了。


    因为时间关系，今天就先简单说到这里。有关于科技和国际两大趋势的讨论，我们会在4月22日的前哨大会上详细给大家阐述，敬请期待。


