    # 194 | 星巴克的零售探索


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    +   1. 星巴克成功的商业模式是什么？

    2. 星巴克的哪些创新方法值得借鉴？


    今天我们要聊的话题你一定很感兴趣，我们要来说说星巴克。


    “我不是在星巴克，就是在去星巴克的路上”，这句话你肯定不陌生。


    10几年前，星巴克还是中国大城市里的新鲜事物，而现在星巴克的身影已经在很多3、4线城市出没了。


    不只是买咖啡喝，很多⼈还喜欢把聚会、甚至⼯作会议都安排在星巴克。可以说，星巴克品牌已经代表了一种⽣活和社交⽅式，以及特有的⾝份标签。


    今年元旦，我正好去了位于美国西雅图派克市场1912号的全球第一家星巴克总店，还顺便拍了几张照片留作纪念。


    ![](img/812dfc825c17043226940aa4afb22b20_139_0.png)


    我们今天要介绍的人物就是星巴克的CEO，也是灵魂人物 Howard Schultz，其实他并不是星巴克的创始人，但却是他抱着“用咖啡改变人与人之间的社交关系”这样的初心，打造了星巴克的品牌。


    # 一、灵魂人物 Howard Schultz


    1953年，Howard 出生在美国一个普通家庭，身为蓝领工人的父亲遭遇车祸之后，整个家庭就陷入了贫困。不过，在他妈妈的鼓励和努力下，Howard 还是顺利地进入了大学。


    大学毕业以后，Howard 先是在施乐公司做过销售，可他觉得这份工作太过单调，所以后来去了瑞典居家用品公司 Hammarplast 担任美国地区的副总裁和总经理。


    ![](img/812dfc825c17043226940aa4afb22b20_139_1.png)


    1981年，在成为总经理两年后，他注意到了 supervising 叫星巴克的西雅图小公司，因为这家小公司竟然订购了一大批咖啡研磨机，这订购量比当时规模已经很大的梅西百货还要多。


    为了一探究竟，他果断去了西雅图，和星巴克的创始人进行了深入交流。这三位创始人分别是英语老师 Jerry Baldwin，历史老师 Zev Siegel，和作家
    Gordon Bowker。


    当时，星巴克其实已经成立10年了。通过这次拜访，Howard 发现了星巴克在经营方式上的独特之处。


    首先，他们专注于提供深度烘焙咖啡豆，而且品质上乘，是欧式风味的代表，这在当时的美国市场上相当少见，所以这种咖啡豆成了星巴克的独特点。


    其次，星巴克会耐心地教顾客选择咖啡豆，并让顾客体验亲自动手研磨、过滤和冲煮，并制成咖啡的全过程。这种仪式感，给顾客带来了一种高品质的全新感受。


    要知道，当时大部分的美国人还认为所谓的咖啡就是罐装的粉末而已。于是，这种体验和品牌联系在一起，就造就了品牌忠诚度。


    顺便说一下，1971年星巴克第一家店刚刚开张的时候，西雅图正处于经济大衰退时期，有多严重呢？


    当时西雅图最大的波音公司，3年内从10万人裁到只剩不到3.8万人，整个城市人口搬走了一大半。可奇怪的是，星巴克从开张第一天开始，生意就一直很好。


    这是为什么呢？


    原因就在于，当时西雅图的不少高收入人群，开始注重生活品质，比如摒弃包装食品，转而追求买来新鲜食材自己烹饪，当然，比起直接购买咖啡粉，他们也更喜欢买来咖啡豆自己现磨成咖啡粉。于是，星巴克的出现，正好迎合了这些人的需求。


    星巴克的经营方式也给 Howard 带来了全新感受，于是 Howard 说服了星巴克创始人 Baldwin 先生，并在一年后加入了星巴克，开始担任零售运营和市场总监的职务。


    # 二、成功收购星巴克


    Howard 加入星巴克一年多后，就冒出了新的灵感。


    当时他偶尔要到意大利米兰去出差，他发现米兰几乎每一个街道拐角处，都有一家咖啡吧。但他们不是卖咖啡豆，而是卖现做的最新鲜咖啡饮品。而且店里一般会播放意大利歌剧，气氛很轻松，大多数顾客可以在这儿待上大半天。


    Howard 心想，原来咖啡店还可以是一个供朋友聚会交流的地方，这种场合正是当时美国缺少的。如果星巴克能够引进这种意大利式的咖啡社交文化，一定非常受欢迎。


    不过，Howard 的新理念并没有得到三位创始人的支持，于是1985年他离开了星巴克，第二年，他就创建了自己的公司。Howard 的第一家咖啡店翻译成中文的话，就叫做“每日”。这家咖啡店的卖点就是再现意大利咖啡店的轻松气氛，不只有咖啡，还有自在舒适的社交空间。这给美国客户带来了全新的体验。


    没想到一年后，星巴克的三位创始人决定要卖掉星巴克的门店和商标。


    为什么要卖呢？


    因为在经营星巴克期间，他们收购了几家 Peet’s Coffee 连锁店，他们觉得 Peet’s Coffee 专注于小众咖啡品类，比星巴克经营大众化咖啡豆更有发展潜力。


    于是，Howard 嗅准了这个好机会，Howard 觉得，星巴克和每日，一个出售优质咖啡豆，一个打造意大利咖啡社交文化，两个正好优势互补。于是Txn...
    在朋友资助下，他成功收购了星巴克。


    # 三、打造咖啡商业帝国


    在之后的20几年中，Howard 把星巴克从几个小小的咖啡店变成全球的咖啡商业帝国。根据2018年1月星巴克官网公布，星巴克已经在77个地区，拥有超过28000多家门店。


    听到这，你一定很好奇，究竟他是如何让星巴克成为一种生活方式，一种社交文化和身份标签的呢？


    我总结出了以下四个要点：


    第一，是选定高端地点。


    比如说，刚开始那几年，Howard 都要亲自为新店选址。他瞄准的，不是市中心的写字楼，就是人口密集的住宅区。因为写字楼聚集了大部分高端人群，而在住宅区周边，则是为了方便大家出门左转，就能找到舒适的“第三空间”，这是一个介于社交和私人空间之间、以及家庭与工作环境之间的场合。


    除了具体的门店选址，在选择城市的时候，他也会优先考虑城市的地位。


    比如，1991年，Howard 进军洛杉矶市场，不久之后，《洛杉矶时报》就给了星巴克很高的评价，几乎一夜之间，星巴克就成了当地的时尚标志，也奠定了他在美国其它地方开店的基础。


    第二，Howard 只选择顶级、声誉好的合作伙伴。


    星巴克的合作伙伴，都是享有顶级声誉的公司，并且他们都尊重和认同星巴克的文化。


    比如，当时 Howard 之所以会和美联航合作，就是因为看到了美联航的决心，美联航愿意让所有乘务员都接受星巴克的培训。'
  md: "\n那手表为什么是身份的象征呢？\n\n这其实跟它的品质分不开，万表网的创始人肖晓，在他担任银行高管时，就非常喜欢研究手表，在这个过程中，他就发现，手表市场有一些显而易见的痛点都没有得到很好的解决，就比如说，该怎么挑选手表呢？这就是最简单但又最麻烦的问题。\n\
    \n我们都知道劳力士、欧米茄这些品牌，但是，其实很多人是想找一些品质不错、价格又没那么贵的牌子，适合自己的身份，足够彰显自己的品位就可以了。\n\n就像肖晓自己观察到的，经济水平提升之后，很多人都想给自己买一块名牌表，但因为毕竟不是专业玩家，经济能力也还有限，所以一线大名牌的入门级手表往往最畅销。\n\
    \n就像红酒不一定非要喝拉菲一样，对品酒的人来说，一等酒庄的副牌和澳大利亚、南美的名牌都是性价比更好的选择。\n\n而且，手表市场还存在修表难、价格乱、好表修坏等等问题。肖晓就看到了这些痛点带来的商机，于是创立了万表网，建立了国内第一个统一的手表平台。\n\
    \n下面我们就来看看万表网是怎么一步步解决问题的。\n\n首先，他们严格把握品质，直接向品牌制造商跨境采购，并配备专业的检验团队，做到了 一表一码全程可追溯。\n\
    \n其次，和全国各地专业的钟表维修商建立了联盟，完善了售后服务网点，而且还把收费标准透明化。\n\n就这样，万表网就解决了前面提到的两个痛点。\n\n不过，万表网更大的价值是打造了爱表人士的社群。\n\
    \n## 肖晓发现：\n\n做卖名表的网站和开顶级奢侈品的线下店一样，卖方都不需要太殷勤，有人进来就围上去兜售，反倒把客人吓跑了。肯花钱买名牌的人，即使原来不懂也会自己弄懂了再买，而且有很多是反复购买，往往很专业。卖家只要体现出自己是卖正品和专业就好了，顾客要买自然会询问。\n\
    \n同样，既然手表是身份的认同，那么你可能也希望通过手表，来识别和自己品位相投的人。所以，万表网的网站不强调互动，也没有太多花哨的促销，但给老用户开辟了论坛。这样，万表网就完成了从解决质量问题，到建立高品位社群的过程。\n\
    \n肖晓的例子，其实是在提醒创业者，也可以从另一个角度出发，不一定要用科技去改变产品本身，也可以让科技对销售和服务作提升，把高品质的产品覆盖给更广泛的爱好者，帮他们建立交流的场所也是机会。\n\
    \n## ——◆ 今日内容小结 ◆——\n\n今天我们讲解了把握品位升级机会的三种方式，希望你能掌握以下三点：\n\n第一，品位升级的核心在于精神消费，而创业者可以通过做高科技、做个性化小众化、做高品质社群这三个手段，来实现产品的精神价值。\n\
    \n第二，未来，标准化的产品会越来越难以满足人们对于标榜个性、表达自我的需求，因此个性化的产品会逐渐兴起，可以说，品位升级的过程，也是由标准化升级为个性化的过程。\n\
    \n第三，产品具备了精神价值以后，不仅仅为客户带来了体验价值，还为客户提供了身份认同感，客户通过产品，找到了和自己地位、品位相近的人，形成了社群。在这个过程中，也带来了用户黏性。\n\
    \n## ——◆ 今日思考题 ◆——\n\n你有没有什么喜欢的个性化品牌？你知道它背后寄托了什么样的精神价值吗？你参与过它的社群互动吗？\n\n欢迎在留言区分享你的观点。\n\
    \n## 划重点\n\n+   1. 作为创业者，如果想把握这次品位升级中的机会，就需要把握住产品背后的精神价值，给产品赋予一个能够代表用户身份认同的精神内涵。\n\
    2. 品位升级的过程，也是由标准化升级为个性化的过程。\n3. 降低价格，但又把高品质、象征高端身份的产品，覆盖到更广泛的、有提升品位需求的用户群体，是创业者的机会。\n\
