    现阶段我国仍然有超过5000万人是贫困人 口，在国家“精准扶贫”思想的指导下，格 莱珉银行对我国消除贫困有什么启示与借 鉴意义呢？你可以想出其它的商业方式来
    帮助消除贫困吗？


    # 划重点


    - 1. 格莱珉银行通过金融创新，不仅证 明了穷人也是有信用的，而且他们的 模式被证实，比起慈善捐赠，商业方 法才是最有效且可持续地消除贫穷的 方式。 2.
    帮助贫困人口掌握先进科技和信 息，让他们掌握知识和技能，才不会 重返贫穷。


