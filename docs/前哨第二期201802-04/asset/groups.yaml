    ## 第三， Howard 注重店内细节布置。


    当你在星巴克时，你所有的舒适体验，可以说都是来自于星巴克对每一个细节的精心安排。为了让顾客只闻到咖啡的醇香，星巴克不会出售带气味的食品，也禁止员工使用香水。


    而对于不同地点的店面，椅子的设计款式和距离也会根据具体场合进行精心设计。另外，店内的背景音乐要细心筛选，同时音量也要调得刚好合适，既不会影响顾客交谈，也不会影响顾客听着自己那杯咖啡磨研的声音。


