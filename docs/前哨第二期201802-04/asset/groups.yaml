    # 165 | 蚂蚁金服与芝麻信用


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 蚂蚁金服提供了什么服务？

    - 2. 芝麻信用最重要的价值是什么？

    - 3. 蚂蚁金服解决了传统贷款的什么问题？


    今天我们要介绍的是中国普惠金融领域的代表——蚂蚁金服。


    如果你对这家公司还有些陌生，那我相信你肯定对它提供的服务非常非常熟悉，比如支付宝、余额宝、芝麻信用等等，没错，蚂蚁金服的前身，就是阿里旗下的支付宝业务。


    在过去，只有大的机构和高净值人群才能获得优质的金融服务，利用资本持续创富。而蚂蚁金服的出现，可以说是让普通人也能享受到大机构的金融服务了，相当于是为普通人提供了“微缩版”的企业金融服务，而且蚂蚁金服逐步建立和积累起了可量化的个人信用指标。


    之所以起名叫蚂蚁，正是因为它的服务对象是每一位普通人和小微企业，这不就是跟蚂蚁一样嘛。


    # 一、蚂蚁金服提供的服务


    支付宝是2004年成立的，在支付宝之后，从2010年起，阿里陆续为支付、基金、保险、民营银行等业务申请到了牌照，然后水到渠成在2014年成立了蚂蚁金服。


    | 牌照类型 | 牌照名称 | 牌照主体 | 占股方式 | 占股 | 牌照取得时间 |

