    涵。


    新生代消费者身处中国互联网蓬勃发展期，对外界新鲜事物接触更多，他们本身也是中国日益增长的中产阶级群体中的主要组成部分，往往拥有比较高的薪资水平，也受过良好的教育，所以比起价格，他们反而对产品的品质有更高的要求，愿意为真正好的产品买单。


    但他们也不会盲目地追求奢侈品，而是在价格和品质中进行折中，最终选择一款能够代表自己身份认同的产品。


    举个例子，在2016年7月小罐茶正式推出，仅仅用了一年的时间，小罐茶就实现了3亿的销售额，可以说是“飞一般”的速度。


    小罐茶的成功原因，就在于它不是简单地卖茶叶了，而是従在卖“品质”。


    # 吴伯凡老师曾经说过：


    > 用户不会再给柴米油盐醋茶的“茶”付钱，却会为琴棋书画诗酒茶的“茶”买单。


    茶的故事和意义，已经超越喝茶的本质需求。而小罐茶，就是把这“品质”二字体现得淋漓尽致，他们主要做了四件事。


    第一，小罐茶保证精选原茶，坚持原产地手工采摘，保证茶叶的高品质。


    第二，小罐茶在切入点上，采用了“大师作”，他们邀请了八位大师进行站台。其中就包括“国家非物质文化遗产传承人”，强调文化和传承。


    第三，小罐茶的包装也很有特色。小罐茶用的是金属纯色小罐包装，在小罐内填充氦气，能防止茶叶氧化。和市场上传统的袋装或者铁盒、纸罐装茶相比，它不仅摆脱了传统茶叶包装的影子，而且让人感觉很时尚。


    第四，小罐茶的线下零售店是仿照线下苹果店的，对装修进行了严格设计和品控，给消费者提供一种“高品质”的购物体验环境。走进小罐茶店内，你就会有一种印象：现代、高端、奢华、科技、时尚。


    虽然现在也能听到一些对小罐茶的非议，比如说他们捧的大师只是形象代言，而非真正操刀制作，但总的来说，小罐茶的品牌塑造和营销是相当成功的。


    小罐茶的成功告诉我们，未来的用户要的不仅仅是一个“好产品”，更重要的是要有一个“好故事”，一种高品质的体验。


    # 第三个角度，对高品质服务的追求逐渐超过了对实物的追求。


    新生代消费者对于生活必需品的需求已经得到了很好甚至过量的满足，所以他们开始将注意力转向精神层面的消费。


    就说“旅行”这个事儿，以前我们常说的是“旅游”，也就到一个自己不熟悉的地方吃喝玩乐。但现在更多年轻人会用“旅行”这个词，因为大家希望通过旅行拓宽自己的视野、体验不同的文化。


    所以，体验经济将成为未来的消费增长点。我们在之前的内容里就提到过定制旅行、特色民宿、小众运动，这些都会逐渐兴起。


    我相信大家也都记得，中国有“两口子”放弃了自己在国内做得不错的事业，到全世界去旅行，他们发回的各种感受和视频都非常畅销。


    而说到体验经济，极限运动应该是体验感最强的项目了。但是很多人由于身体素质或其他因素，是没办法身体力行地参与的。这时候，如果采用VR技术就能让用户以专业运动员的视角来感受极限运动的魅力。


    举个例子，最近GoPro推出了最新款的运动相机Fusion，这是一款户外拍摄专用的专业级VR全景相机，它的拍摄效果相当于一次使用6个GoPro进行拍摄，而且它的拍摄质量是目前全景拍摄中数一数二的。也就可以说，普通人通过佩戴VR眼镜真的就可以感受极限运动了。


    ![](img/812dfc825c17043226940aa4afb22b20_128_0.png)


    不过，在GoPro Fusion中，最激动人心的要数它的 Over-capture——过捕获技术。这个技术可以让用户在拍摄之后，随意选择摄像头的的位置和角度，进行不同视角的编辑输出。也就相当于说你在空中有了更多的主动视角。


    # —— 今日内容小结 ——


    今天我们介绍了“品位升级”的产生原因、分析了新生代消费群体的特征和变化，希望你能够掌握以下三点：


    第一，这一轮“消费升级”的本质是“品位升级”，尽管中国已经经历过两次消费升级，但这是第一次，消费者从注重产品的使用价值转变到注重产品的精神价值。


    第二，这一轮品位升级的原因是，中国主流消费群体发生了改变。“新生代消费者”将在未来10年成为消费主体，这批人是互联网时代的第一批用户，他们的购物习惯和喜好受到互联网的极大影响，所以跟上—代消费者存在很大区别。


    第三，新生代消费者们主要显出三个消费特征：


    +   第一，他们不再盲目追求大牌，而是选择内心认同的、独特的品牌来表达自我；

    第二，他们更注重产品的品质和产品背后的故事与精神内涵；

    第三，相比于“买买买”，他们更追求高品质的服务和体验，更渴望“诗和远方”。


