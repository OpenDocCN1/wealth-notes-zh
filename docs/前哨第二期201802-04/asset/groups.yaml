    # 191 | 三种方式把握品位升级的市场机会


    # —— ◆ 今日内容看点 ◆ ——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    +   1. 品位升级的趋势是什么？

    2. 如何利用科技帮助消费者品位升级？


    周一我们提到，中国正在迎来“品位升级”时代，大家不再只关注东西的实用功能，而是开始愿意为自己内心认同的、有吸引力的东西消费了。


    可以说，我们的需求已经从物质层面开始向更高层次的需求过渡了，而品位升级的核心就在精神层面的提升。


    那么，作为创业者，如果想把握这次品位升级中的机会，你就需要把握住产品背后的精神价值，给产品赋予一个能够代表用户身份认同的精神内涵。


    那么我们能利用什么手段，来实现这些精神价值呢？


    我为你总结了以下三种方式：


    +   一是，利用高科技来体现时尚感；

    二是，做个性化小众化的产品和服务；

    三是，做高品质的产品社群。


    # 一、利用高科技体现时尚感


    这几天有个八卦新闻，万人迷布拉德·皮特又有了新的绯闻女友，这位新女友的来历可不简单，她叫 Neri Oxman，是以色列人，颜值相当高，不过，媒体津津乐道的并不是她的高颜值，而是她的高智商。


    Neri 是 MIT 媒体艺术与科学系的副教授，是一个跨界天才。她是一名艺术家和建筑师，但是她的设计是结合生物技术、计算机技术和材料科学来完成的，为此，她还给自己的研究领域创了一个新词，叫“Material
    Ecology”，意思是材料生态学。


    Neri 在设计和艺术领域拿奖无数，还被《 Fast Company》评选为“100位最具创意商业女性”之一。那她的作品到底有什么吸引力呢？


    我拿她的两个设计来跟你讲一下。


    比如说，Neri 在 TED 的演讲中提到了 Silk Pavilion，中文叫“丝绸亭子”，这个小亭子的设计理念很有意思，它认为很多产品都是人为做出来的，加入了很多非天然的因素，但是一个产品并不一定要做出来，它也能够以自然生长的方式形成。


    什么意思呢？


    好比苹果就是由种子长成苹果树，然后结出苹果来。所以，Neri 的丝绸亭子，就是靠6千多只蚕吐丝形成的。


    蚕吐丝是自然而然的，让一只蚕吐丝并不是什么难事，难的是要以自然的方式达到设计效果，这就要用上生物学了，研究者们要进行试验，观察蚕在不同的表面会有何反应，怎样才能引导它们在需要的地方吐丝。


    ![](img/812dfc825c17043226940aa4afb22b20_133_0.png)


    还有一款由 Neri 设计的作品，叫“双子座”，是一款兼具美感和舒适的休息椅，这张椅子的特点在于 3D 打印表面，它表面的纹理可以给人创造一个舒缓的声学环境。


    为了打造这么一个纹理，Neri 用了最新的 G3DP 技术，G3DP 技术是由 MIT 和哈佛大学合作研发的，它解决了之前玻璃打印材料容易碎的难题，使得 3D
    打印出来的玻璃强度适合用来做艺术品和商业产品，而而且可以精准地控制玻璃的颜色、透明度和结构纹理。


    ![](img/812dfc825c17043226940aa4afb22b20_133_1.png)


    Neri 在 TED 演讲中提到了这两款作品，当时就全场掌声不断，而这个视频的点击量已经超过了180万。


    当然，Neri 的作品这么受欢迎，高科技这个亮点功不可没。


    就好比，很多汽车的造型都很流畅，你并不觉得有什么特别，但一提起特斯拉，大家就觉得很酷。这不仅仅是特斯拉汽车外形的功劳，也不仅仅是特斯拉的营销造成的，而是因为特斯拉的理念本身就非常酷。


    它是最早能够大范围被接受的电动车，本身就是环保、先锋和科技感的代表，而且它不仅自己做电动车，还全面开放专利，倒逼着大公司做电动车，以小搏大。


    其实就是我们一直说的，科技本身就很时尚，对于科技产品本身的喜爱就是一种品位。


    # 二、做个性化小众化的产品和服务


    在周一的内容里，我们提到新生代消费者非常注重产品是否能够表达自我。


    以前，我们会说所有的奋斗，都是为了和成功者一样。而现在的很多人想法都变了，他们想的是“我就要和你不一样”，无论别人有没有钱、怎么牛，我依然有我的生活方式，和别人一样才显得没品位。


    所以这个时候，标准化产品已经开始不能满足不少人了，尤其是年轻人对于标新立异、表达自我的需求了，只有个性化产品才是他们的最爱。


    可以说，品位升级的过程，其实也是由标准化升级为个性化的过程。比如，小众品牌、潮牌越来越流行，就很好地证明了这一点。


    就在上周，Supreme 在美国的一家店铺被砸了，原因是它和 Rimowa 联名发售的行李箱价格高达1600美元。那些人拿着凿子来到 Supreme 门前边砸边喊，为什么这么贵？这款行李箱在英国和日本发售的时候，也引起了骚乱。


    但这并不影响全世界的年轻人趋之若鹜，在中国，这个品牌经常被综艺节目里的 Hip hop 歌手穿在身上，在年轻人当中掀起了一股广泛的 Supreme 潮流。


    不过你可能想不到，其实原来 Supreme 就是一个小众品牌，上世纪90年代中期，美国少年喜欢在街头上玩滑板，Supreme 结合了滑板、Hip hop 等街头文化，在纽约街头开了第一家店，不过
    Supreme 不单是卖滑板，还是滑板青年提供聚会的场所。


    在当时的青少年眼里，玩滑板本身就是件很酷的事情，有名的滑板好手和街头艺术家经常到 Supreme 的店面聚会，慢慢地，Supreme 也变成了酷的代名词。


    当然，Supreme 之所以得到街头领袖、潮流明星的青睐，还有另外一个很重要的原因，就是它限量，很不容易买到。Supreme 十几年如一日地不打折、不送东西，每次上新款必定限量。在国外，Supreme
    是极少数不靠明星带红，而是让明星倒过来追着买的潮流品牌。


    # 三、做高品质的产品社群


    这也是最后我们要讲的，就是创业者可以研究如何降低价格，但又把高品质、能够象征高端身份的产品，覆盖到更广泛的、有提升品位需求的用户，然后用社群把他们联系起来。


    这里我要介绍一个行业标杆“万表网”。


    有句广告语叫做“每个男人都应该有一块好表”，这个我们已经很熟悉了，的确在职场中，手表是作为品位的象征的，而且是用來彰显身份的。


    那手表为什么是身份的象征呢？'
