    ## 160 | 外骨骼让老年人重获行动力


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 外骨骼的前景有多大？

    - 2. 为何外骨骼一直饱受质疑？

    - 3. 外骨骼开发的新趋势是什么？


    咱俩小时侯写作文，经常会写到一个题目，就是“红领巾扶老奶奶过马路”，听到这个你可能都笑了。


    不过，这个题目却折射出一个非常现实的问题，那就是：


    老年人的行动能力大不如前了。


    几乎所有老年人都会因为年老或疾病，导致行动能力下降甚至丧失。在全球，跌倒是老年人受到伤害的头号杀手，2014年的時候，咱们中国65岁以上的老人中，每年因为跌倒造成的伤害就达到了4000万人，而且多年来，跌倒一直是老年人死亡的前十大原因之一。


    你肯定也会想到，现在科技这么发达，那我们能不能弄个设备来解决老年人行动不便的问题呢？


    相信你已经知道答案了，这就是我们今天要讲的“外骨骼”设备，而且，这种设备其实早就有 了。


    ### 一、外骨骼设备


    你肯定知道漫威系列电影里的《钢铁侠》吧。电影里，主人公斯塔克身上穿的机甲装备就是非常正宗的外骨骼设备，英文是Exoskeleton，这个词是来自于节肢动物，你看，像螃蟹和虾这类甲壳类动物的外壳，其实都可以被称为外骨骼，它们的
    作用就是支撑和保护动物柔软脆弱的器官和身体。


    虽然目前我们距离钢铁侠的水平还要差很远，但实际上，人类早就开发了不少外骨骼产品了。比如，古代士兵穿的盔甲，现代的潜水服和航天服等等。


    ![](img/812dfc825c17043226940aa4afb22b20_60_0.png)


    在工业领域，比如福特已经给生产线工人配了名叫 Ekso 的外骨骼背心，这个技术是加州大学伯克利分校的 Ekso Bionics 公司和他们合作研发的，售价6500美元，有8斤重，里面一个电子元件都没有，主要就是弹簧类的机械连杆，能对胯臂和腰部起到很好的支撑作用，帮助工人省力气和避免受伤。


    其他还有更高级的军用外骨骼和医疗用外骨骼。


    ### 二、Cyberdyne 与 HAL


    而今天我们要讲的就是一家生产外骨骼设备的公司，日本的 Cyberdyne，说来也巧，Cyberdyne 和电影《终结者》里，那个导致了机器人革命的公司恰好同名。


    Cyberdyne 是世界上最早的外骨骼公司之一，它最大的亮点，就是在外骨骼设备上加入了智能感应功能，让外骨骼能像机器人一样，帮助行动不便的人重新获得行动能力。


    而这款外骨骼，就是2008年正式发布的 HAL，是 Hybrid Assistive Limb 的缩写，翻译过来就是“混合辅助肢体”，它是全球第一款获得安全认证的外骨骼机器人，也是这个领域最早进入消费级市场的产品。


    ![](img/812dfc825c17043226940aa4afb22b20_60_1.png)


    其实，在 HAL 刚推出的时候，外骨骼还是一个很新的概念，用创始人山海嘉之的话说，就是五个完全“没有”的全新领域：


    - 没有市场、没有用户、没有专业人士、

    没有产业、没有社会规则。


    所以 Cyberdyne 的意义非常重大，它不只是生产了一款产品，而是从无到有地创造了这五个要素，它是利用科技撬动“银发经济”的先驱者。


    ### 三、创始人：山海嘉之


    既然要介绍 Cyberdyne 公司，最关键的创始人山海嘉之肯定不能落下。


    山海嘉之在小学三年级的时候就读过美国科幻作家阿西莫夫的作品——《我，机器人》。从那以后，他就立志要当一名研究机器人的科学家。后来他在筑波大学攻读人造器官专业，顺利拿到工程学博士学位。


    毕业后，山海开始了对 HAL 的研发。从1990年开始，他先是花三年时间摸清了控制腿部运动的神经系统，然后跟团队花了四年时间做出了第一个硬件原型。不过，虽然后来又对产品原型做了三代更迭，但
    HAL 依然有不少问题，光电池部分就重达22公斤，更别提穿上这套设备还得两个人辅助才行了。


    在过去的几十年里，“少子老龄化”一直是日本的死结，所以这里就成了发展机器人和外骨骼的沃土。


    2004年，在日本政府的资助下，山海嘉之创立了 Cyberdyne 公司，开始将 HAL 产品化。经过不断的实验和改善，HAL 外骨骼机器人重量越来越轻，还内嵌了计算控制系统，也就是说，HAL
    真正变得可行了。


    2008年，经历了漫长的研究和完善过程后，HAL 终于正式发布。


    值得一提的是，筑波大学是 HAL 的专利持有者，而 Cyberdyne 公司则拥有独家使用权，这堪称是校企合作的成功典范。Cyberdyne 是一家以技术为核心竞争力的公司，它先在高校探索技术方案，制造出用于科研的产品，然后再逐步产业化，打造消费级产品。而这个过程，恰恰就是科技产业化的过程。


    顺便说一句：


    我们的科技考察团去美国，一个很重要的目的，就是去各大高校了解现在具有产业化前景的技术，帮助一个未来的 Cyberdyne 对接中国的合作者。2018年5月，我们的考察团又要启程了，如果有兴趣，欢迎到我们的公众号“全球风口”当中，了解更多的
    情况。


    ### 四、HAL 的工作机制


    跟其他外骨骼的设计不同，HAL 特别强调跟人体的整合度，具体来说就是：


    - HAL 外骨骼可以探测人体肌肉的发力时

    间点，从而介入工作，目的是增强人体

    的肌肉所欠缺的力量。


    所以，HAL 系统更像是人体的自然延伸，而只是一种助力工具。


    不过，要说 HAL 最吸引人的地方，那就不一样 “意念控制”莫属了。听起来有点玄乎，其实现原理不难理解。我们的身体在运动的时候，皮肤表面会溢出微弱的生物电信号，HAL
    就是去监测这个信号，然后通过安在关节部位的动力装置提供力量，就好像是受到了意念控制一样。


    有了 HAL，使用者在日常生活中的一切活动几乎都可以借助 HAL 来完成，比如，站立、步行、攀爬、抓握、举重物等等。


    我们举个具体的例子：


    - 在2011年，49岁的日本残疾人内田靖史，就让他的朋友佩戴 HAL 背着自己登上了法国圣米歇尔山。


    内田靖史是残疾人，无法自己发力，所以只能让他朋友有足够的力气背着他。但我们可以想象，那些只是行动能力差的老年人，是可以借助 HAL 外骨骼轻松行走，甚至参与长途旅行、登山、徒步等活动的。从这个角度看，HAL
    的市场是非常广阔的。


    不过我们都知道，像 HAL 这样的科技产品，监管机构的批准是它们走向市场的主要门槛。


    ![](img/812dfc825c17043226940aa4afb22b20_61_0.png)


    而就在2015年10月，HAL 正式被日本许可进入医疗领域，医院的护士们经过短暂培训，就能顺利使用 HAL 来帮助病人了。而且就在2018年的1月份，美国
    FDA 批准了 HAL for Medical Use 这个版本的外骨骼作为医疗用品上市，可以帮助下肢受损的患者更好地行走。


    ### 五、备受欢迎的技术


    那么，究竟 Cyberdyne 公司的技术有多受欢迎呢？


    听听数字你就知道了：


    2014年3月，Cyberdyne 在日本创业板上市，成为日本第一家生产医用及社会福利事业机器人的上市公司，山海嘉之也被福布斯网站誉为机器人领域的首位亿万富翁。


    2015年，上市仅一年的 Cyberdyne 还没开始盈利，股价就已经翻了两倍。这足以证明投资者有多看好它的技术所带来的发展前景。


    不仅如此，正因为 HAL 能够大幅提升人的肢体能力，所以它也有很大的军用空间，甚至有传言说，Cyberdyne 公司曾经受到美国军方的资金支持。


    不过，Cyberdyne 公司一直坚持服务社会，对待技术是很慎重的。创始人山海教授在接受媒体采访时，就曾说“不论技术有多么强大，关键还是使用技术的人”，他也身体力行地避免
    Cyberdyne 向军事化的方向前进。


    ### 六、发展瓶颈与趋势


    不过，虽然 Cyberdyne 的技术很先进，但它也有显著的发展瓶颈需要去突破。


    首先，HAL 还是比较笨重，而且价格昂贵。在日本国内，HAL 的价格大概在15万美金左右。 为了解决昂贵的使用成本问题，Cyberdyne 采用了租赁的方式。但是，只靠租金和少量的销售收入，是很难弥补大额的研发投入的，因此
    Cyberdyne 一度处于亏损状态，这对投资者来说无疑是个巨大的打击。


    ## —— 今日内容小结 ——


    总结一下，今天我们介绍了外骨骼机器人公司 Cyberdyne 和它的产品 HAL，希望你能够掌握以下三点：


    ## —— 今日思考题 ——


    你认为 Cyberdyne 应该如何突破目前遇到的瓶颈呢？


    划重点


    - 1. 外骨骼有着大量的应用场景，不仅能解决老年人行动不便的问题，还能帮助工人省力气和避免受伤，也可以应用到医疗和军事领域，市场广阔。 2. 外骨骼产品目前依然存在笨重、价格昂贵的问题，销售收入难以弥补研发投入，对投资者来说风险极大。
    3. 使用人工智能技术开发外骨骼，降低了开发成本，效率也更高，已经成为趋势。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，我们明天见。


    ## 161 | 掘金“银发经济”


    ## ——◄ 今日内容看点 ►——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 老年人是否有足够的消费能力？

    - 2. 如何把握银发经济中的机会？

    - 3. 如何利用科技解决养老问题？


    今天我们来讨论银发经济时代的机会和新思考。


    ### 一、老年人消费市场广阔


    在很多人的印象中，老人往往很保守，不愿意尝试新鲜事物，消费力也不像年轻人那么高。


    但实际上真的是这样吗？比如说我问你一个问题，你认为网购的人里，老人花钱多还是年轻人花钱多？


    我相信很多人会觉得肯定是年轻人啊。


    但根据全球知名会计事务所毕马威2016年的网购调研，网购中花钱最多的，恰恰是二战后“婴儿潮”时期出生的老人，也就是现在55-70岁左右的老人。


    毕马威在2016年调查的数据显示：


    从全球来看，65岁以上的老年人网购花的钱要比65岁以下的人多20%。其中美国老人最能花钱，网购消费比年轻人多37%。即使是购物比较保守的中国老人，网购消费也几乎和年轻人持平。


    在市场上，老年消费者的身份首先是消费者，其次才是老年人，有些人认为老年人不注重提高生活质量，其实恰巧相反，由于老人的身体相比年轻人来说更虚弱，他们其实非常乐意掏钱购买那些让生活更健康、轻松的产品。


    你看，人们的刻板印象其实跟真实的市场趋势有很大的差别，所以不能光凭印象就下主观结论，随意给老年人消费群体定性。


    结合我们周一介绍的，你是不是一样会得出结论：


    中国的老年人给人容易上当，不了解先进科技的错觉，这不是他们的错，而是没有真正的科技公司在里面认真经营，让骗子公司容易钻空子。


    现在看起来，这其实是一个巨大的市场机会，在这么一个数量庞大，又有着相似需求和痛点的人群里，一定会诞生一个体量巨大的市场，很值得创业者提前布局。


    ### 二、政府政策支持


    更加幸运的是，创业者们不光面临着广阔的市场需求，而且还有政府政策的“加持”，可谓具备了天时、地利、人和。


    我们都知道，现在很多国家都面临老龄化问题，所以大多数政府都非常鼓励老年人产业的发展。很多政府不仅出台了支持老年人产业创业的良好政策，甚至会直接出面采购企业提供的服务和产品，有的还主动资助企业和产业的发展。


    之前我们提到的 Cyberdyne 公司，不仅在早期就受到日本政府大力资助，而且后来还在巨额亏损的情况下被日本政府选入“Innovation Japan”（创新日本）项目进行大力宣传，后来这家公司还在日本经济产业省举办的第三届日本创业企业奖中获得最高奖，而且是日本首相安倍晋三亲自颁奖。


    再比如说瑞典政府，为了减少意外摔倒导致老年人自己和社会付出的巨大成本，政府直接向企业采购助行器，给老人免费发放。


    根据世界卫生组织估计：


    全世界每年大约有64.6万人因摔跤而死亡，其中60岁以上老年人占一半以上。


    瑞典政府计算过，只要避免一次摔跤摔断腿，就可以大大减少老年人个体过早死亡的概率和致死率，也避免了受伤后卧床、护理等方面的花费。


    这种政府买单的行为，不仅可以减少个体医疗负担、减少社会成本，还给科技创新企业开发更多的优秀产品提供了动力。


    我们国家也出台了大量鼓励养老产业科技创新的计划和政策，比如2017年，工信部、民政部、国家卫计委发布了《智慧健康养老产业发展行动计划（2017-2020年）》，在人工智能+养老、机器人+养老、互联网+养老方面，国家都在极力促进养老产品和服务的推广应用。


    去年年底，阿里巴巴的 AI 实验室已经响应政策，在北京试点“智能网养老”了。在阿里巴巴的“智能网养老样板间”里，使用了智能音箱作为控制中枢，老人只需说出指令，就能自由控制空调、电视、窗帘、灯具等等。屋里还安装了能够感应人体、空气温度湿度的自动传感器，不仅可以保持环境舒适，老人晚上起床的时候，还能自动开灯，这就能帮助降低摔倒的风险。


    可以说，政府、社会和市场的良性互动，能够合力解决老年人遇到的困难，实际上为养老产业的发展创造了非常好的环境，给了创业公司很大的发挥空间。


    ### 三、创业者的机遇


    那么，创业公司应该如何把握银发经济的机会呢？


    这就要立足于老年群体的两大需求：


    生理需求和心理需求。


    我们刚刚说过，老年群体其实非常乐意掏钱购买那些让生活更健康、轻松的产品和服务，这看上去是非常单一的需求，但同时我们也要明白，这也是一个典型的细分场景千差万别的市场。


    作为创业者，或是你已经是深耕多年的企业了，都必须仔细去遵循老年人的需求，开发出真的适合老年人的东西。


    举个例子，我们都知道，帕金森是老年人非常常见的一种疾病，平均发病年龄在60岁左右，症状主要就是会不自主地抖动，这就导致连勺子都拿不稳，自己吃饭都会困难。


    针对这个细分领域，谷歌旗下的公司 Liftware 就专门推出了一款防抖勺子 Liftware Steady。这个勺子里面有传感器，能识别手的位置和运动频率，当老人手抖动的时候，勺子就会反向抖动，抵消手抖造成的位移，确保勺子是稳定的，这就很好地解决了老年人自己吃饭的问题。而且，这个勺子价格不算贵，只要不到200美元，普及起来不困难。


    ![](img/812dfc825c17043226940aa4afb22b20_62_0.png)


    就是这样一个小小的勺子，技术含量其实并不高，但很好地抓住了应用场景，而且大大地提升了老年人的生活品质，这种创新是非常值得赞扬的。


    在中国，我们也看到了类似的防抖勺产品，凭借我们中国强大的制造能力，这类产品的制造成本还会大幅降低，开辟更广阔的市场，这对企业来说是巨大的机会，对老年人来说是莫大的福气。


    再比如，很多老人年纪大了会有健忘的症状，有时候忘了吃药，家人也不见得每次都能按时提醒老人吃。


    针对这个痛点，Tinyl logics 公司开发了一个智能药盒，它有智能服药提醒、家人远程服药提醒、忘带药盒提醒、重复用药报警、自动生成服药记录、用手机呼叫药盒等功能。而且药盒里有多个分隔开的药格，可以对药品进行分类。


    ![](img/812dfc825c17043226940aa4afb22b20_62_1.png)


    药盒还会按照设定的服药时间发出有节奏的灯光和声音，提醒用户服药时间到了，直到你拿起药盒打开后，声音和灯光才会停止。这款小药盒已经通过了 FDA 的认证，并且获得了2016年德国红点产品设计奖。在中国
    PPTV 的创始人姚鑫老师组织的 AI 创业营里，我也看到了类似的产品。


    类似的小创意虽然都有一定的技术含量，但都是可以攻克的，而且都切切实实地解决了老年人生活中的痛点，都具有很大的市场前景。


    另一个巨大的市场就是预防健康风险，包括事故预防和医疗可穿戴设备。


    我们都知道，老年人在遇到事故或大病后，比如说心脏病突发或者摔倒，即使得到治疗，生活质量也会大不如前，对于老年人来说，事后补救的成本往往比事前预防要高出很多很多。所以，如果创业者能开发提前帮助老年人预防健康风险的产品，将来一定很受市场的欢迎。


    在预防健康风险方面，市场上表现比较好的有两类公司：


    - 一类是医疗数据监测的可穿戴设备；

    - 另一类是提供事故预防解决方案。


    我们先说医疗数据监测的可穿戴设备，比如今年在 CES 参展的智能设备公司 Cardiomo，就展示了一款监测老年人心脏问题的设备，是通过高分辨率生物传感器来进行监测，数据会传到手机并储存在云端，同时使用由心脏病专家开发的
    AI 软件平台进行分析，然后在云端进行更深入的分析，最后把结果反馈给用户。


    ![](img/812dfc825c17043226940aa4afb22b20_63_0.png)


    这套系统可以识别和警报40种疾病，比如中风和心脏病。一旦发现了问题，就会马上发出警报提醒用户去就医。如果用户不回应，它就会向亲属、看护人员和医生发送警报消息。


    接下来我们说说提供事故预防的解决方案，这类产品主要从预防的角度出发，减少了意外发生后老年人受到的伤害。


    这里面比较著名的是美国 Active Protective 生产的安全气囊腰带，其实我们以前就介绍过，它能够通过 3D 运动传感器监测老年人的动作，在用户即将摔倒之前迅速给气囊充气，保护老年人的腰和臀部不受到致命损伤。最近，著名影星韩雪也在很多公共场合推荐了这款产品，所以这款产品现在在国内的知名度也很高了。


    ![](img/812dfc825c17043226940aa4afb22b20_63_1.png)


    所以你会看到，老年人的需求，在应用场景上形形色色，这就需要创业者有一双发现问题的眼睛，从老人的真实需求出发，利用科技的力量，找到解决方案。


    下面我们说说心理需求的问题。


    关于怎么解决养老这个大问题，我们也听到了很多的观点。其中一种观点就认为：


    - 为了解决养老问题，我们要鼓励生育下一代，这样年轻人多了，养老问题就会得到妥善解决。


    ## —— 今日内容小结 ——


    今天我们分析了银发经济的机会和新思考，希望你掌握以下三点：


    第一，对老年人群体的误解和刻板印象，可能造成对市场或战略机遇的误判。有些人认为老年人不注重提高生活质量，其实恰恰相反。老年群体非常乐意掏钱购买那些让生活能够更健康、轻松的产品，这为创业公司掘金“银发经济”提供了用户基础。


    ## —— 今日思考题 ——


    在日常生活中，还有哪些老年人的需求可以用最新的科技来满足呢？欢迎在留言区分享你的观察和思考。


    划重点


    1.实际上，老年人的消费能力并不差，中国的老年人给人容易上当的感觉，是因为没有真正的科技公司在里面认真经营，让骗子公司钻了空子。2.老年群体非常乐意购买那些让生活更健康、更轻松的产品和服务，这看着是非常统一的需求，但同时这也是一个典型的细分场景千差万别的市场。3.创业者要有一双发现问题的眼睛，从老人的真实需求出发，利用科技的力量，提供解决问题的方案。


