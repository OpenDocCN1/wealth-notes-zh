    # 193 | 新零售的崛起


    193 | 新零售的崛起


    # ——◈ 今日内容看点 ◈——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 新零售的本质是什么？

    2. 为什么说7-11是新零售探索者？

    3. 未来零售业的发展趋势是什么？


    这周要跟你聊聊新零售，你先回忆一下身边的熟悉的零售场景，比如说我们购物的各种便利店、连锁超市、大卖场、淘宝、京东等等。


    实际上，这些零售场景的演变，都是人口居住地变化和科技进步造成的。


    # 一、新零售的本质


    我们先来说说什么叫新零售。


    其实所谓新零售，就是以互联网为依托，通过运用大数据、人工智能等先进的技术手段，对商品的生产、流通和销售过程进行升级改造，把线上服务、线下体验和现代化的物流进行深度的融合。


    最后呈现出来的样子，就是新零售，这相当于是对以前的零售业结结构进行了重塑。


    这么说起来还比较绕口，但其实，它的本质还是零售，不同之处只是它利用了各种新的科技手段，可以更加精準、更加高效地给消费者提供服务。


    # 二、零售业的演进历程


    那接下来，我们再简单回顾一下零售行业的发展历程，典型的例子要数美国。


    在美国工业发展起来之前，零售业主要就是一些零散的私人小店。到了19世纪中期，美国开始了城市化，人口聚集，百货商场就出现了。再后来，因为汽车和冰箱的普及，也因为“城市+郊区”这种生活方式的出现，类似沃尔玛这样的大型超市slice
    起来了，人们一周只去一次，一次就把下一周要用的东西都买齐了。随着生活节奏的加快，尤其是互联网和网银支付技术的普及，亚马逊这类电商势力越来越大。


    早些年，甚至很多人都认为电商早晚会挤垮线下零售，但现在大家都明白了，电商和线下零售各有各的优势和劣势，其实是互补的关系。


    具体来说：


    +   电商是给大家省成本、省时间、省体力，但买衣服你不能试穿、买家电你不能试用；

    线下的零售店，展示的产品都会受场地的限制，渠道成本高，电商的优势基本都是它的劣势。


    所以现在这个时候，新零售的概念就被提出来了。


    不得不说的是，我们还是很喜欢到小区附近的便利店或者连锁超市买东西的，因为确实是“便利”。而且现在，便利店的趋势是逐渐实现“无人化”，不仅运营效率会大大提升，人工成本也能省下来，消费者买东西也会更便利。


    我们简单回顾了零售业态的发展，可以得出结论，随着未来生活场景的变化，尤其是受到科技进步的影响，零售业还会持续地变化下去。


    # 三、新零售探索者7-11


    虽然“新零售”这个概念是马云在2016年提出来的，但其实7-11一直就是新的零售模式的探索者。


    7-11很早就开始使用互联网来管理供应链了，而且还利用大数据来优化物流体系，这也是7-11的毛利率一直高于竞争对手的原因，就在今年，7-11还开了无人店。


    可以说，它的发展过程就是传统零售到新零售的升级换代过程，下面我们来详细说一下。


    我们都知道7-11是日本公司，但它诞生的时候其实是一家美国公司，在1927年的时候，它的名字叫“南大西SF冰公司”，只是在美国开了一些卖冰块的店铺，后来他们发现顾客也希望在店里买到鸡蛋、牛奶这些食品，这样就省得跑更远去买了，然后他们就真的这么做了，这就是“便利店”的雏形。


    那么，你知道7-11这个名字是什么意思吗？


    其实很简单，因为他们的营业时间是早上7点到晚上11点，所以后来公司就把店名改成7-11了，后来为了满足消费者随时的购物需求，就改成了“24小时全天候营业”的模式。


    之后的故事就令人啼笑皆非了，7-11先是和日本的伊藤洋华堂公司合作，授权他们在日本开店，但后来自己反而在美国经营不善，最后伊藤洋华堂公司收购了7-11的大部分股份，7-11就此成为了一家日本公司。


    历史故事我就不多说了，感兴趣的可以去搜搜看。


    # 四、7-11成功的秘诀


    现在7-11是世界上最大的连锁便利店品牌之一，在全球22个国家拥有6400家门店。


    那么它是如何做到的呢？


    主要有三个方面：


    第一个方面，是“高密度选址”。


    这是因为，当同一个品牌在同一个地区大量开店后，会增加消费者的认知度，提高消费者进行消费的概率。在日本东京港区，经过测算，大约半径2.5公里范围内会有30家左右的7-11。


    ![](img/812dfc825c17043226940aa4afb22b20_137_0.png)


    我们通过逆向思维来考虑一下这个问题，如果店铺比较稀疏，你想想会有什么结果呢？


    +   第一，消费者看到7-11品牌的机会大幅下降；

    第二，消费者购买日常用品要走很远的路和花更长的时间；

    第三，公司 Do 的单位配送成本上升，同样一段路，送3家和送1家是不一样的。


    7-11在长期经营中总结了它的选址哲学，我们可以称之为“商圈最密堆积原则”。


    根据2006年玉田康城研究会的研究结果，当7-11相邻商店的距离大于500米的时候，这两个商圈之间是不会有冲突的。其实我们每个人都会有体验，如果服务差不了，咋怕只多了几十米的路，我们大多数也会选择离我们近的那家。


    第二个方面，是高效的物流体系。


    经过密集地选址以后，7-11公司下一个要解决的问题是打造一个高效率、低失误的物流体系。


    7-11在日本经营的初期，出售的日常用品有3000多种，涉及100多个进货厂家。刚开始7-11需要给这100多个厂家挨家挨户打电话，同时要填写100多张收货单，但几乎每天都有大概30%的货物不能及时送到店里，手续复杂，还不能保障供货。


    于是，7-11就开始试图建立自己的供应链系统，解决从生产地到销售地的整条环节，提高物流效率。而7-11采用的方式是“供应商配送统一化”。


    那么什么是“配送统一化”呢？


    以前，每一家7-11店都单独和不同的供货商对接，这种方式肯定很琐碎，效率也低。所以，7-11就在不同地区设立了综合的配送中心，供应商将商品送到配送中心，再由配送中心统一配送到各家店铺。


    统一配送以后，7-11就可以采取“温度区分商品”的模式了，像沙拉、牛奶、火腿肠这些，在运输过程中是需要控制在5摄氏度左右的，和其他商品不一样，集中管理以后，既降低了成本，又提高了效率。


    第三个方面，是对顾客信息的收集。


