    # 137 | 社群经济：新一代消费入口


    # ——今日内容看点——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 社群经济的本质是什么？

    2. 社群经济爆发的原因是什么？

    3. 社群经济发展的核心是什么？


    我们本周要讲的是社群经济。在我们的生活中，社群经济已经十分常见了，举几个大家很熟悉的例子，比如说淘宝有电商社群、得到是知识分享社群、斗鱼直播则是游戏主播社群。各种直播平台上的主播借助强大的社群消费力，一个月甚至能做到几十万的收入。


    其实社群并不是什么新东西，从最原始的氏族社会到现在的互联网社群，已经有几千年的历史了，但是直到近些年，社群经济才作为一种新兴的商业形态发展了起来。


    今天，我就和大家说说社群经济的发展现状和兴起原因，再用成功的商业化案例来看看如何进行社群运营，找到其中的机会。


    # 一、什么是社群经济？


    我们先来看看社群经济的发展现状。这里不得不提到瑞格尔德（ Howard Rheingold ），他是著名的社会学家，1993年他发表了《虚拟社群：定居在电子前沿》这本书，第一次提出了“虚拟社群”的概念，它的定义是：


    > 人们可以通过互联网相互连接，突破地域限制，使彼此沟通交流、分享信息和知识，形成相近的兴趣爱好和情感共鸣，这种特殊关系网络就是“虚拟社群”。


    其实，人们的内心原本就希望找到适合自己的精神共同体，待在里面会有存有感和归属感，这就是社群形成的驱动力。当一批人聚在一起之后，交易也就产生了。他们交易物品、知识、财富，并且越来越频繁，慢慢就形成了一个市场，一种经济。所以，这种依托于社群所产生的经济，我们就叫它社群经济。


    据统计，到2016年底，中国网络社群的数量超过300万，网络社群用户数量超过2.7亿，相当于四分之一的中国人都已经居住在网络社群中了。随着网民规模的扩张，社群经济的规模也会得到相应的增长。


    # 二、社群经济爆发的原因


    那么，社群经济为什么会在这个时点上爆发呢？其实它离不开三大推动力，那就是：人性的需求、技术支撑和消费能力的增长。


    首先，从人性角度来说，网络社群经济满足了人类的天性需求，人类天生就有社交需求、被尊重的需求和自我实现需求，依托于社交网络形成的网络社群就能很好地满足这三条需求：


    +   1. 依靠共同的兴趣爱好，人们可以在互联网上聚合起来，这样就满足了社交需求；

    2. 目前社交网络中流行的点赞、正面评论，满足了用户被尊重的需求；

    3. 如果用户能成为一个小社群的带头人或者“连接者”，并且带领社群不断发展壮大，这就满足了用户自我实现的需求。


    其次，从技术的角度来说，以用户全面参与互联网内容提供为典型特征的 Web2.0 的出现，让志趣相投的人可以更便捷地交流思想了。


    现在的社群经济，其实就是跟着社交网络兴起的新的经济模式。比如说早期的 BBS、论坛、聊天室、博客，后来的百度贴吧、QQ群、豆瓣小组等等。尤其是移动互联网的出现和普及，更是让人们在找到有相同爱好的群体这件事情上的成本又大幅度地降低了，现在估计谁都得有几个兴趣爱好的微信群，直播和短视频这几年的火爆，也让社群经济进入了蓬勃发展期。可以非常肯定地说，正是高效的连接手段的出现，为社群经济的发展提供了技术上的可能性。


    最后，从消费能力的角度来说，在过去十几年来，中国人的消费模式已经发生了巨大的变化。最为显著的一点是基本生活必需品的支出份额下降，而在精神娱乐消费层面的支出份额上升了，就像现在咱俩得到
    App 的用户，是甘心情愿为知识服务买单，这成为标榜自己品位、身份认同的新潮流。


    # 三、社群运营


    现在，网络社群正在逐步成为新一代的消费入口。但社群经济发展的核心是社群运营，可以说“只有出色的运营，才能带来出色的商业化”。


    目前常见的社群运营方式有两种，分别是“分布式”运营和“中心化”运营。下面我们就用两个例子，来看看这两种不同的社群运营模式。


    +   1. “分布式”运营——Bilibili 网站


    首先是“分布式”运营，这里我们就以 Bilibili 网站为例，简称“B站”。对于喜欢二次元的年轻人类来说，B站绝对是一个必看的网站，在这里，不仅能找到一大批“志同道合”的人，还能找到很多其他地方没有的动漫和视频。


    B站的社群文化可以用两个词进行概括——“二次元”+“弹幕”。B站的视频中有很多只有二次元原住民才能看着听懂的词，比如说“伪娘”“鬼畜”“空耳”“嘻见”“入宅”等等。“弹幕”是悬浮于视频上方的实时评论功能，你在看视频的时候，就能看到弹幕上飘过一串串弹幕，这就好像你在自己看视频的时候，还能看到别人的“评论”。


    但是弹幕也不是谁都 cat 发的。从2013年5月开始，在B站，只有注册会员才能使用弹幕功能。而在注册会员之后，还有正式会员这一头衔。要想成为正式会员，只有两条路，要么被正式会员邀请，要么参加答题考试，考试通过后才能成为正式会员，拥有观看权限、弹幕权限以及投稿权限。通过这种考核，在很大程度上增加了用户的群体归属感。


    也正是因为正式会员的身份来之不易，不仅让用户有一种优越感，更让B站挑演出它“超级用户”，这些用户具有较高的积极性和认同感，这让B站保持了它二次元社区文化的纯粹性。


    当有了用户基数、形成了社群之后，B站的社群运营就采用了线上+线下的综合运营方式。线上通过内容连接形成稳定的社群生态圈，线下通过 B站的大型同好线下聚会 bilibili
    Macro Link 开展社群活动。上传视频的用户被其他用户称为“UP主”，这提高了他们的自我满足感。其他用户可以通过投币、承包、分享等方式来给予UP主物质和精神上的双重激励，促进他们创造出更多的原创内容。


    但是目前 B站也在为盈利模式发愁。尽管 B站依靠用户具有二次元原住民这个统一的身份，已经成长为全国最大的二次元动漫游戏发行平台，可以通过动漫代理、游戏联运以及售卖周边衍生品来盈利。但是
    B站同时还想创造其他的盈利渠道，比如正在尝试的付费会员制，但是目前看来，效果并不是很理想。


    从 B站的经验中我们可以看到，一个“分布式”社群运营需要从社群文化、社群等级、社群互动这三个方面进行综合考虑。


    +   2. “中心化”运营——“好好嗨饭”


    接下来我们再来看看“中心化”运营，这里就以田雪创办的 好好嗨饭 社群为例。


    田雪是我们科技特训营二期的学员，也是 咱俩前嗨的用户。在去年的科技特训营的课上，她分享了她创办的“好好嗨饭”社群背后的故事以及她的社群运营经验。从田雪和我们的分享中，我总结出田雪与“好好嗨饭”社群成功的三把钥匙，那就是“专业性”“信任感”和“生活化”。


    第一把钥匙——“专业性”


    田雪在大学的时候学的就是营养学，现在已经是国家高级营养师了。大学毕业后，她做了长达7年的线下健康培训课。在期间，田雪积累了大量的营养学、烹饪以及食材方面的知识。于此同时，田雪从2013年就开始写公众号，分享健康饮食的信息，这帮助她在写作方面打下了坚实的基础，让她可以把复杂深奥的营养学专业名词，用非专业人士一听就懂的语言表述'
