    # 第二条心法，深耕社交媒体，坚持多平台运营，发挥不同平台优势。


    现在大的社交媒体有很多，很多网红经营自身品牌和用户社群的方法是一文多发，比如同样的文章在微信公众号和新浪长微博都发一遍，但其实这样做通常来说效果一般。因为不同的社交媒体平台特点不同，所以面向的用户也不同。


