    ## 179 | 健康管理鼻祖-凯撒永久集团


    179 | 健康管理鼻祖-凯撒永久...


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 什么是 HMO 健康维护组织模式？

    - 2. 凯撒是如何做好会员的健康管理的？

    - 3. HMO 模式为何存在的争议？


    今天，我给你详细介绍一下美国的 Kaiser 公司，中文名叫凯撒永久集团。


    ## 一、传统医疗的不足


    在介绍凯撒集团前，我们先来说说医保。


    我们平时去医院都是怎么用医保的呢？


    拿北京的职工医保来说，我们每个月都要缴纳医保费，生了病就要去定点医保的医院看病抓药。而且绝大多数医院都是按项目收费，比如说你做一个胸透检查，就收一次胸透的钱，验个血，再收你验血的钱。当然，你要自己先垫付医药费，再拿着治疗单据去报销。


    ## 二、健康维护组织 HMO


    而我们今天要讲的凯撒集团，就尝试了这样一种模式：


    - 它在每月付费或者付年费的基础上，向会员提供一定的健康医疗服务，其中就包括预防性护理服务。


    也就是你交一份保费就可以享受到预防、治疗和保险赔付的一条龙服务。这种模式在1973年就被美国在法律上确定下来，称为 HMO，也就是 Health Maintenance
    Organization，翻译过来就是健康维护组织。


    ## 三、凯撒医疗集团的历史


    凯撒模式的出现，跟凯撒集团创始人个人经历密不可分。


    凯撒的创始人有两位，一位是实业家 Henry J. Kaiser，凯撒集团就是拿他的名字命名的，另一位则是 Sidney Garfield 医生。


    ![](img/812dfc825c17043226940aa4afb22b20_106_0.png)


    ## 四、美国第一家整合型医疗机构


    从凯撒永久保险公司成立之初，凯撒集团就非常支持预防性的保健服务，希望能够通过对会员的健康教育，让会员保持健康。


    - 一是凯撒基金会医院，拥有社区医院、门诊设施，可以提供医院服务；

    - 二是凯撒健计划基金会，提供全面的卫生保健服务；

    - 三是凯撒医生集团，由医生们合伙或专业医生组成结构，给会员提供医疗服务。


    ## 五、凯撒的健康管理模式


    现在我们知道了，作为 HMO，凯撒的核心业务就是对保险会员进行健康管理和疾病管理。


    那它是如何做好会员的健康管理的呢？


    息互联互通也让诊断结果更加精确。此外，统一的信息平台也可以减少重复不必要的检查，节省开支。


    你可能会觉得一个集团用统一的数据平台，好像没什么稀奇的。


    这真没那么简单，要知道，医疗流程极度复杂，需要协同患者诊断、治疗、实验室检测、药房等等的数据。而且凯撒集团旗下的很多医疗机构都是收购而来，所以数据整合就更难了。凯撒在电子健康信息系统上的投入已累计超过300亿美元，而且还在持续投入当中。


    第三个方面，凯撒专门为会员建立了名为“我的健康经理”的健康管理门户和App。


    这是凯撒推出个人健康档案，现在已经有超过600万会员注册使用。会员可以通过平台对自己进行健康管理。


    比如：预约门诊和体检；查看病历资料和检查结果；及时跟自己的家庭医生和护士进行沟通；跟医生进行远程电话和视频诊疗；在APP上进行处方补充；当然，也可以查看诊疗的账单和保险权益。


    ![](img/812dfc825c17043226940aa4afb22b20_107_0.png)


    第四个方面，凯撒集团针对超过25种慢性病，推出了“Complete Care”完整医疗模式。


    这种模式要求每一位医疗服务人员，从医生、护士，到医疗助理和接待员，都要确保不出现任何疏忽遗漏，保障每一位病人每一次的安全就诊。


    要做到这一点，患者的医护团队需要采取“主动服务门诊”方式，打个比方：


    - 现在你要预约门诊，在你完成预约之前，工作人员就会先确定你之前有没有及时去做检查，了解你的情况。

    接着，在看病过程中，护士或其他工作人员会让你做好准备接受必要检查，跟跟踪完成所有漏掉的检查，并标记所有你必须要做的筛查或慢性病。

    离开诊所后，你会收到诊后概要、护理说明、复诊、健康教育资料以及下次就诊时间表。


    此外，医护团队还要长期跟踪会员健康的个性化需求，比如根据会员的患病风险提供患者进行相应的肺癌筛查等等。


    可以说，整个过程都考虑得相当细致周到了。总之，通过这些方式，凯撒促进了会员的健康管理水平，提高了预防、诊断和治疗的有效性，也节约了医疗费用。


    ## 六、HMO模式存在的争议


    不过，虽然凯撒是HMO的成功典范，但HMO模式在美国却引起了许多争议。而且，除了凯撒之外，其他医疗机构的尝试也并不成功。


    关于这个问题，我们前哨团有一位叫田沐的专家，她是美国国家医疗质量协会的注册医疗质量管理师，她以前工作过的医疗集团Catholic Health Initiatives旗下也有医院是HMO模式，她给我们分析了凯撒模式的问题。


    首先，凯撒模式的主要争议在于，由于整个集团都希望节省医疗费用，所以对患者的医疗选择就无形中施加了很多限制，比如：在看所有的专科医生之前，凯撒要求会员都必须通过初级保健医生筛查，然后进行转诊，这就人为延长了看病的时间。


    其次，我们假设现在有个病人突然发现肾衰竭，要做肾移植手术，但是凯撒的医院做不了，所以实际上凯撒就应该马上把病人转到其他专科医院或者医生那里去治疗，但凯撒却不愿意这么做，因为他们要多承担很多费用，所以有时候就会发生转院延误的情况。


    最后，医院的管理难度是很大的，而整合型医疗集团的管理难度就更大了，凯撒的行政管理支出会占总支出的25%-35%，这也是美国很多HMO不成功的原因之一。相比之下，凯撒之所以会成功，有很大一部分原因在于医疗管理层面，多年的摸索让凯撒积累了丰富的管理经验，建立了完善的流程。


    总之，中国想要复制凯撒的模式难度很大。所以，中国的健康管理从业者们，必须得立足中国市场开发适合本土用户的产品。


    ## —— 今日内容小结 ——


    今天我们介绍了美国最大的HMO凯撒永久医疗集团，我们了解了它的模式和对会员进行健康管理的措施，以及HMO存在的问题，希望你能掌握以下三点：


    第一，凯撒集团的突破性在于率先尝试HMO模式。在HMO诞生之前，医院都是按项目收费，医生和医院不但没有动力去关注患者是否做好健康管理，反而变相激励他们使用最贵的诊断和治疗手段。医生/医院、保险公司和病人站在了对立的立场上。


    第二，HMO健康维护组织是集医疗服务管理和保险经费管理为一体的整合型组织。在HMO内部，医疗机构、医生、保险、患者利益一致并进行利益分享，它促进了医疗机构和医生对患者进行主动健康管理和疾病预防，从而帮助患者保持健康。


    第三，HMO模式同样也受到了很多争议，包括出于控费目的对患者施加过多的就诊限制，以及过高比例的行政管理费用等。对于这样重资产、垂直整合管理难度很大的凯撒模式，要想复制照搬到中国并不容易。


    ## —— 今日思考题 ——


    如果中国也出现了凯撒模式的公司，你会去参吗？为什么？

    欢迎在留言区分享你的观点。


    ## 划重点


    - 1.医保覆盖了基础的诊断和治疗，但也只是涵盖治病这个范围，并没有涉及到疾病预防。

    - 2.健康维护组织（HMO）模式，就是交一份保费就可以享受到预防、治疗和保险赔付的一条龙服务。在HMO内部，医疗机构、医生、保险、患者利益一致并进行利益分享。

    - 3.HMO模式，存在出于控费目的的对患者施加过多就诊限制的问题，而且管理难度大，行政支出高昂。


    王煜全

