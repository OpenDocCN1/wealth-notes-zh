  - '[PAGE 53]


    区块链的应用有哪些。


    我认为有两个应用值得大家关注：


    +   1. 加密猫游戏


    它是一个虚拟的宠物养成社区游戏。玩家在区块链上用以太坊购买虚拟的猫，让它们相互或者和别的家的猫进行繁殖，猫的基因基于一定的算法可以遗传到下一代，基因的组合和传递是不透明的，是不是稀有的品种，也都区块链控制的，这吸引着玩家花以太坊买猫和生小猫。


    这个游戏之所以精彩，就在于你要培养出名贵的猫来，其实际背后的算法既是标准的，没人能够篡改、没人能左右，同时又是很难预期的，也就是说你要看你自己的运气好不好的。


    +   2. 线上赌博


    由于它去中心化的特点，没有庄家能够操纵，结果完全不能造假，而且加密数字货币在交易的时候非常方便和隐蔽，与现有传统方法相比快速而又简单。从监管方面而言，用比特币进行在线赌博处于法律监管的灰色地带。


    我们给大家提供这两个例子的点在哪呢？


    第一个，就是它充分利用了区块链的去中心化的特点，使得你在区块链上面应用的结果让大家能够心服口服，不管我得到了什么样的结果，我都相信它是完全公平，没有人能够操纵的。


    第二个，尤其是加密猫游戏，它其实在一定程度上回避了区块链计算缓慢的问题，也就是说生小猫本来就有个周期，两只猫交配了以后，小猫什么时候能生出来。当然了，游戏设计背后其实是你计算的时间能够给到足够就行。


    从这些应用我们就看到，其实未来的应用一定要充分利用到区块链的特色，取长补短才能够找到新的应用的发展机会。


    # 第二层，技术平台级的机会。


    我们前面已经讲过了，今天的技术可用性还是相当的差，不管是后端还是前端都有大量可改进之处。但是如果技术优化到可用之后，很有可能会出现一两个大型的技术平台。


    其实当年比特币出现之后还有人在搞以太坊，就是希望做成这样的技术平台，只不过我们现在看起来，以太坊离能够通用化，尤其是离能够做到免编程的技术平台还有很大的差距，也就意味着后面做技术平台的人还有很大的机会。


    # 第三层，应用平台机会。


    因为区块链能够使得交易是完全公平的，所以，大家会更倾向于在这个平台上进行交易。当然了，这个交易做什么，就是你要认真去设计的了。


    至于大家为什么非要追求公平？


    建议大家读本书叫做《正义之心》，就像当年我给做游戏的人推荐《千面英雄》一样，其实一个业务表面看是技术，最后做好了其实都是人性，其实都是哲学。


    对于应用平台而言，基于区块链技术的属性，它的核心是公平性，就是没有上帝存在，即使是创造者也不能更改规则。这对社群而言是非常有意义的，未来的社群治理很可能就基于区块链，而原型可能出自游戏社群的治理。


    所以说，尤其和加密猫游戏类似的区块链宠物游戏背后有大机会，因为很有可能能够升级为未来的社区，也许未来的 Facebook 就是基于区块链的。


    总结来说：


    其实被规则控制没关系，只要平等就好，人类也是被自然规则所控制的。有些规则很无聊，但是没有人能违反，比如说我们每天必须要吃饭，必须要睡觉，只要大家都是这样，我就可以遵守。


    我认为未来将区块链技术与虚拟世界相结合，甚至应用到真实的世界治理当中，打造一个更加公平、平等、去中心化的真实世界，这才是最值得讨论和思考的地方。


    # 四、其他关键技术的趋势洞察


    最后，除了区块链技术，我们也想给大家看看最近几年大热的其它关键技术的趋势洞察，希望大家能够从数据的角度看到未来发展趋势。


    这方面需要提到 CSDN，就是国内著名的程序员社区的创始人蒋涛，他最近在朋友圈发了下面这张图。


    ![](img/812dfc825c17043226940aa4afb22b20_53_0.png)


    这个图是说 CSDN 社区里面出现了一个“技术浪潮3倍速定律”，也就是说新技术方向的博客文章数量每年增长3倍以上的时候，这个技术方向就被开发者社区所接纳了。


    比如说深度学习3倍以上增长的时间是2015年，以太坊是2017年，而物联网是2018年。


    也意味着什么呢？


    意味着过去一年里区块链确实有了长足的进步，未来的Set one year later maybe 物联网是一个新的风口。


    在蒋涛的图里面，他左侧的表格是根据关键词统计的博客文章数量，用这个指标来预测技术发展趋势。这个图我认为非常有价值，尤其值得关注机器学习、深度学习和 TensorFlow，也就是谷歌的深度学习系统，这三者的数量增长。


    从博客文章数量来看：


    +   机器学习从2014年的1870篇增加到2017年的接近12000篇，是原来的6倍多；


    +   深度学习从2015年的不到1000篇增长到2017年的6000多篇，3年内同样保持6倍多的增长；


    +   而 TensorFlow 其实更有爆发性的增长趋势，从2016年的1000多篇增到2017年的近10000篇，增幅达到8倍以上。


    右侧的趋势图是从社区的开发者数量来看的，从2015年到2017年，3年内从事人工智能和 TensorFlow 相关的开发者增幅都接近了4倍，这个是从数量上我们能看到未来人工智能的发展还是很迅猛的。


    不过尤其是你看深度学习和 TensorFlow 的对比，你会得到一个很有趣的结论，就是：


    人工智能的发展将会迅速地普及化，未来会有越来越多的能能够掌握人工智能的技能，也就是说它的门槛在迅速降低，这就是我们为什么在《全球创新260讲》第一个月开篇就介绍说人工智能其实已经过了创业风口期了，因为现在是向各个行业普及的时期。


    当然了，普及也有机会，如果你在行业里有一定垄断性的资源，正好可以建立壁垒的话，和人工智能结合就正合适。而且普及期也是收入利润得以体现的时期，所以未来和人工智能相关的业务，其收入利润都会体现出来。


    另外，我们能看到区块链的博客数量增长也接近去年的3倍，而以太坊则是去年的6倍多，这个说明区块链技术还是有空间的。就像我们原来介绍的，我们认为现在是新浪、搜狐出现之前的互联网的早期，一旦新浪、搜狐出现的话，互联网可能就会有迅猛的发展，区块链就在这样的一个阶段。


    当然，我们要感谢蒋涛，他提供了这么好的数据，蒋涛说后面还会作更加系统的整理，我也希望及时地把他整理出来的数据公布给大家，因为基于这些实际的数据看未来，才是更扎扎实实的，而不是一些相对空泛的讨论。


    我们认为，我们就需要有更多的前瞻性的数据，使得我们每个人对未来的发展都有更加洞察式的了解。


    顺便说一句：


    我们2018年7月将会组织科技特训营的第三期培训。


    熟悉我们的人都知道，我们科技特训营前面已经连续做了两年，今年做第三期，我们的特色是每年对全球的科技前沿作一个扫描，就像通过蒋涛的数据看出来的，其实现在全球的科技前沿远不止是一个区块链。有很多，有人工智能，有自动驾驶，有很多很多的东西。


    我们希望中国企业家能够对全球的科技前沿有更多的了解，我们到时候也会邀请像蒋涛这样的牛人来跟大家分析技术趋势，欢迎大家关注。'
