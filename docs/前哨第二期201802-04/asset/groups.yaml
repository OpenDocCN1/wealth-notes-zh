    # ——◆ 全周总结 ◆——


    本周的话题是互联网保险，我们介绍了三个重点：


    第一，传统大保险公司一直存在准入门槛高、赔付周期长、保单复杂、信息严重不对称等等诸多的弊端。造成这种局面的原因是，传统保险公司基本都是金字塔式的组织结构，总部需要根据人口的相关数据进行保险精算、设计产品，然后一层层下发到最前段的保险代理人不开行进行销售。发生事故以后，保险公司又需要层层审核，然后再赔付。随着互联网时代的到来，传统保险公司越发显得脱离时代。


    第二，互联网保险具有产品海量、碎片化、低单价的特点，这些特点是传统公司架构下很难满足的。科技初创公司正在通过积累细分领域数据，将原来的耗劳动劣势转化为优势。随着保险加快和科技的融合，大数据、区块链、人脸识别、云计算平台、物联网等等正在逐渐渗透到保险的各个环节里。保险科技的全面应用，使得普通人享受保险服务的门槛大幅降低，并且推动更多的基于大数据的个性化保险品类出现。


    第三，互联网保险行业的未来一定将从“事后保险”走向“事前防护”。通过数据和科技手段，在事故发生之前就进行有效防护，这样可以极大地降低保险公司的理赔率，总体上降低整个社会的保险费用。


