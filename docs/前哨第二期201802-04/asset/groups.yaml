    所以，风投的核心，我说过是80%的运气和20%的眼光。当它们投大的时候，其实进过的坑都不是风投该关心的事。


    说了那么多，你可能会说，你不就是做风投的吗？原来是靠运气啊，那还给我讲这么多道理干嘛？


