    ## 1. 特朗普难以预测


    首先，我们说的是特朗普的性格决定了美国政策的反复无常。


    以前不管是民主党还是共和党，虽然互相都会有一些不认同，但是总的来说都要保证美国政策的连续性。但是，特朗普这个人以前就没有搞过政治，他最大的特点就是为所欲为，所以他的政策调整是无法预测的。


    今天他告诉你说，跟中国关系很好，明天就要制裁中国。包括对其他国家其实也是一样，一边说着跟欧洲是盟友，另一边加关税，主要的目标反而变成了欧洲。所以你很难借助于过去的行为对特朗普的政策进行经验推理。


    另外一方面，别忘了特朗普是电视明星出身，他的那个节目收视率非常高，这其实说明了他对美国老百姓的喜好特别敏感，特别懂得如何调动老百姓的情绪。


    在全球化这件事情上，他深知大部分的普通美国人认为，是中国人抢了美国人的工作，损坏了美国人的利益，大家反对全球化。所以他敢于不考虑外界的影响，突然增加关税，讨好民众。


    但是实际上过去几十年的全球化，美国是最大的受益者，只不过受益者是美国的那些跨国企业，而那些跨国企业受了益之后，经常因为避税把大量的资产留在海外，所以美国的普通民众既看不到也享用不到，所以增加了怨气。


    但是美国的跨国企业有自己的一套说辞，而且毕竟在美国懂得做各种公关，结果把所有的问题都推到了像中国这样的其实是帮跨国企业赚钱的这些国家身上。


    别忘了，中国的出口主要是美国跨国企业的代工，人家赚的是大头，我们赚的是辛苦钱。


    但是在特朗普的嘴里，好像一切都是中国的错误。


    当然，虽然特朗普的性格造成他当了总统以后无所顾忌，但是也不是能够让他真正为所欲为的。


    ## 2. 中美关系的变化


    所以说完特朗普的性格，我们就要说中美关系的核心问题。


    中美关系要放在全球化的格局下看待，尤其是要放在中、美、俄三方的关系上思考。


    从全球的角度看，美国的两大对手是中国和俄罗斯，一般的原则，美国肯定是要联合一方去打击另一方，但是怎么联合怎么打，这其中是很有学问的。


    我们都知道中国一直有个说法，叫做“中国人民的老朋友基辛格”，因为从毛主席那个年代，基辛格就好像对中国很友好。


    其实基辛格骨子里是非常现实的，他当年对中国友好就是为了借助中国打苏联，但是现在他发现中国的经济变得强大了，所以他认为经济的崛起会对美国造成威胁，而俄罗斯只是政治体系和美国不同，但是经济搞不好对美国的威胁有限。


    所以，是我们的老朋友基辛格一直在背后建议美国政府，尤其是建议特朗普政府联合俄罗斯打击中国，这就是为什么特朗普上台以后一直对普京频频示好的原因。


    但是这个建议被美国的两党议员都给否掉了。


    为什么呢？


    因为即使基辛格想改变和俄罗斯的关系，特朗普想改变和俄罗斯的关系，但是美国这么多年和俄罗斯一直在斗争，互相之间的怨恨是非常深的。你突然说因为眼前的利益需求想要和他结交，那大多数的美国人是不能认可的。


    所以，现在看起来，虽然基辛格想在背后使坏，但是美国政府这个巨大的机器还是会一直沿着自己的路线进行下去。


    特朗普因为整个的政坛都反对，所以现在也挺明了立场，要跟俄罗斯对立。


    因为我们都知道，政府会把政治放在更优先的位置上，所以对中国来说是一个好事情，也就是说美俄矛盾在美国政治当中依然是第一位的，中美的矛盾虽然看似好像因为经济的问题有点加剧，但是，在美国人眼里，中国人只是突然暴富，美国人看不惯而已。


    所以，中美关系的本质是全球化以后多方利益的博弈，在美国人眼里中国人赚钱多了，那既然是博弈，就有机会找到动态均衡，就有双赢的可能性，不像美俄关系几乎不可调和。


    ## 3. 中国形象越发负面的原因


    过去这些年里，美国一直有一个制裁中国的“301法案”，但是这个法案每年都有人提，但每年都会被否决。


    因为美国的很多跨国企业，尤其是那些世界500强企业，他们会不断地找人去做公关说活动，希望美国政府不要制裁中国，因为他们在中国取得利润是越来越大的，这些跨国企业在中国以前是赚了很多钱的。


    但是这几年中国在快速发展，跨国企业在中国赚钱越来越难，甚至有一些跨国企业退出了中国，于是过去替中国说话的跨国企业集团，他们的声音就越来越小了，他们就不再为中国说话了，结果质疑中国的声音就变成了主流。


    当然，这些新兴科技企业在中国还是有很多合作的，比如说像苹果手机就是在中国造的，但是总的来说，这种合作和以前的合作比起来要弱很多，所以虽然新兴科技企业在美国依然受重视，但是新兴科技企业也没有太大的意愿替中国说话。


    - 一方面跨国企业不再替中国说话了；

    - 另一方 面 和 中 国 有 合 作 的 新 兴 科 技 企 业 也 不 会 为 我 们 代 言。


    这个就是中国现在在美国整体形象正在越来越负面的一个原因。


    ## 4. 中国企业需要全球化


    当然，我们也有一些利好的地方，就是中国有一些出色的企业做的国际化程度越来越高了，能够让美国也看到中国是市场经济的国家，中国的企业可以和美国企业做得一样好。


    但是，总的来说，中国企业依然还没有掌握在美国如何去介绍自己，如何让美国不管是公仆还是政坛都能够接受中国，这个还有很长的路要走。


    那当然结合这个趋势，我希望大家能够重新理解中国的全球化机会。因为虽然前面说了，整体局势中美的关系是在慢慢地恶化，但是并不是没有机会的。


    而我认为，其实我们是可以化被动为主动的，因为过去中国的全球化是被动的，我 们说的说法是：


    - 中国之所以受益，是别人全球化，而中国自己不全球化的结果。


    什么意思呢？


    就是中国加入了 WTO，所以中国 的产品可以卖到全世界，但是我们自己依然 收相对来说比较高昂的关税，而且我们还有一些非贸易壁垒，造成这种不公平竞争，这种不对等开放的情况造成中国的受益机会。


    所以，我原来一直也在讲，中国之所以形成这样强大的产业集群能力，这样强大的制造能力，就是因为我们其实并不完全遵守 WTO 的规则，我们要求跨国企业进中国的时候不能直接进口，而必须要在中国本地生产，这个是违背
    WTO 精神的，那么结果这也是中国受益最大的一条政策。


    ## 5. 中国让美国老百姓受益


    缺乏有系统的商业模式的产品和服务的。


