    ## 159 | 陪护机器人先驱-柴田崇德


    159 | 陪护机器人先驱柴田...


    ### —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 养儿真的可以防老吗？

    2. 陪护机器人真正的价值是什么？

    3. 为什么说不要一味追求人工智能？


    不知道你有没有发现，在过去的一年里，身旁有些已婚女性的肚子突然间又挺起来了。没错，这就是2016年全面放开“二胎”政策的结果。


    不过，数据显示，虽然放开二胎，却并没有出现新的生育高峰，好像大家已经习惯了只生一胎了。这也标志着中国人口红利消失、人口老龄化时代的不可逆转。


    咱们中国有句老话，叫“养儿防老”，问题是，养儿真的可以防老吗？


    众所周知，在中国，“空巢老人”不在少数，子女因为学习、工作等原因离家后，家里就只剩下孤零零的老人，很多老人一年也见不上孩子几次。可以肯定地说，随着城市化的进展，还会有更多年轻人前往大城市寻找机会，“空巢”现象是无法避免的。


    所以说，二胎也许能让“未来的老年人在物质上的需求得到保障，但却无法满足精神上的需求。


    其实，和咱们一衣带水的日本早在20年前就面临我们今天的压力了。1998年，日本65岁以上的老年人口比例就已经相当于我们今天60岁以上的人口比例了，平均6个人里就有一个65岁以上的老人。所以这么多年来，日本一直在通过各种手段鼓励适龄夫妇多生育，但“少子老龄化”的趋势却无法逆转。


    所以在日本，同是在1998年，一位名叫柴田崇德的研究员，发明了陪护机器人Paro，这是全球最早得到广泛认可的陪护机器人，这也是我们今天要讲的，通过走技术路线，用机器来养老。


    ## 一、柴田崇德与Paro


    可以说，柴田崇德是有一个梦想的天才，1992年，25岁的他就在名古屋大学拿到了电子机械工程博士学位。在2003年，他甚至获得了内阁总理大臣奖，这是日本国家级的最高奖励，由首相亲自签发奖状或者直接颁发。


    跟日本很多机器人科学家不一样，柴田在学生时代，就立志要发明一台有“情感”的机器人。要知道，在上世纪八九十年代，当时全球的目光主要都集中在工业机器人的制造上，但他并没有随大流走上这条更能发财致富的研究道路，而是遵从自己的梦想要研究陪护机器人。


    博士毕业后，柴田崇德进入了日本产业技术综合研究所，这个机构主要是利用集成科学和工程知识来解决日本社会和经济发展的需要。也正是在这里，Paro诞生了。


    Paro是一个可爱的白色仿真小海豹，它的外形设计灵感，来自格陵兰的海豹宝宝。第一次看到这个雪白又毛茸茸的小家伙依偎在妈妈身边吃奶的时候，柴田立刻就心生怜爱。而Paro的名字取自英文词组
    Personal Robot 的组合。不 过不是Pero，而是Paro，估计和日本人的发音习惯有关，所以他们说英文总那么难听。


    这个机器小海豹身长60厘米，大概5斤重，跟一个初生的婴儿差不多。在它身上，覆盖着一层柔软、耐用但又不会引起过敏的白色皮毛。


    那接下来，我详细说说小海豹Paro。


    在功能上，Paro安装了12个功能各异的传感器，它们分布在头、背、下巴、四肢甚至胡子上，这让Paro像动物一样拥有了比较丰富的触觉。另外，Paro拥有一定的活动能力，比如它的眼睑可以开闭。在听觉方面，Paro还安装了声音识别系统，它知道声音发出的方向，听得出什么是赞美和呵呵，也知道什么是发怒生气，它还可以学习自己的名字。另外，它的感光装置能分辨白天和黑夜，它的位置感受装置可以判断自己是处于被抱着，还是处于跟主人相对的状态。


    可以说，这一序列装置把Paro打造成为一只温顺听话的小海豹。虽然它不能行走，但它在听到主人说话时会乖巧地转头看着主人，并发出“啾啾”的声音作为回应。


    听到这儿，你可能会觉得，Paro的功能是挺精细的，但这技术也算不上多大的创新啊。可是别忘了，Paro的第一次亮相已经是20年前的事了。柴田一直用一种日本人特有的“匠人”精神，不断地对Paro进行迭代升级，直到2009年，Paro已经有了第八代。2002年，Paro还拿到了吉尼斯世界纪录中“最好的疗愈机器人类号。


    这个荣誉让柴田收到的意外比惊喜还大，因为现在最流行的针对老年病的理论叫做“动物疗法”理论，而柴田并不知道：Paro其实正好完美地结合了理论中的两种方式，分别是动物辅助活动AAA，以及动物辅助治疗AAT。


    我们稍微花点时间来理解决一下这几个名 词：


    首先是“动物疗法”，喜欢养宠物的人都知道，当我们发现有动物陪在身边的时侯，心智就很容易进入一种平和、放松和愉悦的状态，而“动物疗法”就是在这个基础上发展出的一种医学辅助疗法。


    AAA 比较常见，是 Animal Assisted Activity 的缩写，翻译过来叫“动物辅助活动”，也就是说让老人通过养宠物，每天和宠物进行互动，提高生活欲望和质量；


    AAT 是 Animal Assisted Therapy 的缩写，叫“动物辅助治疗”，是让动物直接参与到临床一线的治疗。


    当然，在这两种方法中，动物的筛 选和介入都需要专业的医务人员全程跟踪。


    而跟真的动物相比，小海豹Paro不仅可控，而且更安全、更容易护理，所以当年它很快就发挥出了巨大的作用，在帮助老人安定精神、甚至提高老人的语言能力方面做了很大的贡献。


    也正因为如此，在Paro之后，又出现了AIBO、Robear等陪护机器人。它们都被广泛用于老年痴呆、老年失语症，以及记忆力衰退等各种老年病的辅助治疗中。可以说，Paro在机缘巧合下开启了陪护机器人的时代。


    自从问世后，Paro就一直好评不断。


    我举一个例子，在美国有一位健康独居的名叫Andy的76岁老人，他以前是保险经纪人，退休后生活虽然殷实，但他觉得非常寂寞。虽然他以前社交能力极强，但退休后却没有什么朋友可以交流。他又离了婚，子女又因为住得远而很少回来探望。慢慢地，他变得越来越沉默，还有一点点忧郁。而这一切，都在研究人员带来Paro后，发生了改变。


    一开始，Andy只是对研究人员非常冷淡地表示感谢；


    仅仅过了一周，研究人员回访时就发现，Paro已经成了Andy的新宠了，Andy会给它戴上自己最爱的明星棒球帽，并向客人炫耀；


    几周后，研究人员发现Andy会温柔地对Paro说话；


    三个月之后，当研究人员再次回访时，Andy已经像躲孩子一样亲密地抱着Paro了，他甚至用前妻的名字来称呼Paro。在他眼里Paro不仅有了生命，还开始扮演了更重要角色。


    就是这样一个技术不算复杂的陪护机器人，竟然就解决了老年人的孤独感问题。


    ## 二、Paro销售链条背后的问题


    讲到这里，你可能想，作为银发经济的先驱，Paro肯定能大卖吧？


    然而实际上并没有，截至2015年，Paro全球总共才卖出了4000台。


    为什么这么少呢？


    我们仔细观察陪护机器人的销售链条，就能发现一个问题，就是：


    机器 人是给老人设计的，但是掏钱的通常是老人的儿女和老年医疗服务机构，这是一个三角形的消费关系，所以赚起钱来并不容易，因为Paro不仅要取悦老人，还得取悦老人的照护人才行、

