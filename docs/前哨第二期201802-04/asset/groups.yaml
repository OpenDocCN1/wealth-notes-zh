    # 158 | 银发经济：10万亿级别的庞大市场


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 银发经济的规模有多大？

    2. 为什么老年人总被骗？

    3. 如何利用科技把握老年人市场？


    这周我们来聊聊“银发经济”，银发，说的是老年人，银发经济，说白了就是围绕老年人群体开展的经济活动。


    大概率说，因为科技的发展，生活水平和医疗条件会持续改善，我们这代人会赶上“百岁人生”，也就是比现在的人均寿命多了20年左右。


    那这多 contemplated的20年要怎么过呢？


    罗振宇老师已经开始打造得到这所“终身大学”了，可以说，银发经济在未来肯定会是一个非常庞大的市场，甚至会成为未来经济发展 Heshi核心。


    # 一、老龄化与银发经济


    下面，我们先来看两个例子。


    前一阵子，淘宝在网上公开发布了一条招聘信息，岗位叫做“资产产品体验师”，没有学历要求，工作背景不限。只要年龄在60岁以上、至少有一年网购经验即可，如果你碰巧还是广场舞界一枝花，那就更好了。为了找到老年人群中的“意见领袖”，淘宝甚至开出了40万的高额年薪。一大批网友感叹“我妈挣的比我都多”。


    除了淘宝以外，其实很多行业也都即上了“银发经济”这块大蛋糕，就拿日本最大的化妆品集团资生堂来说，他们在2015年推出了全新品牌 PRIOR，专门面向50岁以上的女性群体，加强了在中老年化妆品市场的布局，有一款粉底的广告用了两位女演员，一位是57岁的妈妈辈儿的，一位是71岁的奶奶辈儿的，都是风采依旧，这就是要突出这个系列的护肤品和彩妆都是针对中老年女性的。


    说到这儿，你应该已经明白了，这是在未来有着极大发展空间的领域。除了刚才说到的电商和化妆品，还有医疗、旅游、家居等一系列产业也越来越重视老年人群体，原因就是老龄化时代正在到来。


    联合国有个老龄化社会的判断标准：


    当一个国家或地区65岁以上老人占总人口超过7%，就说明这儿已经进入老龄化社会了。


    我数个数据，咱们国家统计局2017年的数据显示：


    中国65岁以上老年人已经超过了总人口的10%了。


    也就是说，我们其实已经进入老龄化社会了。而且，随着科技的发展，人类的平均寿命还会继续增长，老人占总人口的比例还会越来越大。


    那老龄化意味着什么呢？


    最直接的就是劳动力减少，社会支出增多。但同时，老年人群体基数增加，也意味着“银发经济”的规模会越来越大。


    # 二、老有所养与老有所乐


