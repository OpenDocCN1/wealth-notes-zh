    ## 156 | 如何把握创意经济的新机遇？


    156 | 把握创意经济的新机遇 ↓


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    + 1. 为什么说人人都有机会实现自己的创意？

    2. 为什么说光有创意是不够的？

    3. 创意公司如何把握创意经济的机会？


    不知道你是否还记得，Intel 在今年的 CES 主题演讲过程中，在舞台上放飞了110架 Mini Shooting Star 无人机。作为灯光秀闭幕表演，它打破了室内无人机飞行的吉尼斯纪录。


    其实不仅是无人机，数字皮肤，交互视频，互动式全息投影等技术手段，也已经被越来越多地被应用到各种演出现场和 MV 制作中了。而这些都还只是科技应用于创意经济中的一部分。


    今天，我们将重点来聊聊在科技的推动下，创意经济的新特点、新机遇，以及可能存在的陷阱。


    我们先来聊聊机会。


    ## 一、创意经济的基础


    第一， 开源技术和平台撬动了大众创新，让更多人参与到创意产业中来，为创意经济的爆发提供了支持。


    技术的开源使得每一个人都可以已有框架上进行个性化开发，每个人都能成为创意的源头，利用现有技术构建细分领域的应⽤。在⼈工智能时代，很多科技公司都开源了⾃⼰的代码。


    比如，特斯拉开源了电动车的全部专利，BAT 也开源了人工智能开放平台，还有科大讯飞的智能语音开放平台等等，它们都通过开源方式，让人工智能更好地在具体行业中落地。


    第二，众筹模式的成熟，以及线下创客空间和创客教育的普及，大大降低了把创意转化为产品的门槛。


    我们都知道，创意的实现离不开资金和各种资源的支持。而众筹和创客文化正好为创意的落地提供了条件。


    ## 二、创意众筹平台


    我来举个非常有代表性的例子，它是创意众筹平台 Kickstarter。


    他们已经帮助无数优秀创意项目进行快速传播，并集结了资金支持创意落地，而 Kickstarter 则会在一个项目达成筹款目标后抽取5%的佣金。


    ## 三、光有创意是不够的


    我们当然也要强调一下：


    + 光有一个创意还不足以成功，你必须要找到真实的需求点，而且要在内容和技术手段上不断迭代才有可能成功。


    50个以上的产品，并把它们送到零售商货架上。


    停不下来的 Quirky 还推出了名为 Wink 的智能家居平台，试图打造智能家居的物联网生态。


    然而，事情当然没有那么顺利，当大量创意产品被快速生产出来以后，Quirky 并不重视对产品本身市场需求的检验，也省掉了前期产品的测试环节，大部分产品被摆上货架的那一刻，也许就是一个
    Quirky 创意产品生命周期的结束，这些产品几乎没有后续的升级和迭代。


    渐渐地，用户对新产品的满意度越来越低，售后口碑也开始恶化。


