    # 197 | 看清新零售的本质


    197 | 看清新零售的本质


    # —— ◆ 特别通知 ◆ ——


    得到 App 想带给你更好的学习体验，即将发布让你能够自定义学习计划的新版本，帮助你提升学习效率。


    过几天开始，专栏最新文章的更新时间会统一改在每一天的 0:00，到时候全站都会有相应的通知，为你详细讲解新版本的Ý用，谢谢你的理解。


    # —— ◆ 全周总结 ◆ ——


    本周的话题是新零售，我们介绍了三个重点：


    第一，所谓新零售，它的本质还是零售，它利用大数据、人工智能等先进技术手段，对商品的生产、流通和销售过程进行升级改造，更加精准、更加高效地服务消费者。零售行业的发展是两股力量的综合作用，分别是时代的变迁和人类居住环境的变化。


    第二，探讨新零售发展趋势的最重要的问题是，伴随着科技发展，未来人们的生活将会出现何种新场景，不管是星巴克当年为顾客营造“第三空间”，还是现在 Amazon
    开设“拿了就走”的无人商店，都是对零售新场景的探索。


    第三，无人驾驶、语音交互平台等技术的发展将带动零售新场景的产生，而云计算、大数据、人工智能、物联网等技术将助推新零售行业的发展。


    # —— ◆ 用户问答 ◆ ——


    我一直在想，把科技融入服务行业，虽然一开始会带来新鲜感，但是这种新鲜感是不会一直持续下去的。最终消费者会对这种新鲜感厌倦或者习以为常，那么这种因引入科技而带来的报酬将会趋近于零了。面对这种情况，将科技融入服务业是不是也像科技创新公司一样，只有不断地奔跑才能待在原地呢？


    我的回答是：


    做服务和做产品不一样，如果把科技做成服务本身提供的内容的一部分，那么既然新鲜感过了还要引入新的科技，这时候你说的就对了。把科技融入服务业，就像科技创新一样，所以这样才能保持科技的新鲜感或者保证服务水平的持续提升。


    但是，如果是用科技来塑造服务的品质，则科技可以过时，而品质可以延续。


    一种品质，是产品的品牌特质，比如我们原来介绍过 Burberry，最开始的时候是因为用最先进的面料科技而给大家带来了时尚感，慢慢地，Burberry 变成了时尚的品牌，那现在承载时尚的就未必是科技了。


    另一种品质，是产品的用户特征，比如苹果 iPhone 手机的 App Store，因为科技带来了大批的高素质开发者，而高素质的开发者也定义了苹果开发者社区追求卓越的特色。那这种时候，其实苹果的用户群就重新定义了苹果，也不需要有持续的科技进步来作出了解释了。


    我想象中的无人超市就是在门口结账的时候有用，所以他们收集购物过程中的数据有什么用呢？用这样复杂的装置值不值得吗？希望王老师解答一下。


    我的回答是：


    那确实是你的想象，无人超市的核心并不只是出门付一下款那么简单，我们千万不能以最简单的应用场景来构建应用流程。


    也就是说，你想象一个最简单的做法，用户进门，拿了东西，规则矩到门口付款，然后走出去。


    因为很多现实的场景比我们想象的复杂得多，所以，我们要以最复杂的场景来构建我们的应用流程，不然用户如果不是按你设计的方式来操作，你就失控了。


    一方面，我们要考虑到有人会有意无意地拿了东西忘了交钱，所以如果只是出门才要求用户自己刷商品的条码付费，其实这一点现在很多美国超市已经这么做了，就是叫自助结账。但是这样的话，就没有办法避免用户不交钱，或者少交钱，我刻意地少刷一个商品的条码，怎么办呢？因为是无人店，没有人能管。


    另一方面，也不能说如果用户拿了东西没放回去就算付款了，因为我们逛超市的时候经常看了一个东西想买就放进购物车，或者放进购物篮，一会儿不想要了，就取出来随手放在旁边的货架上，没有归到原位。这个行为很普遍，这时候你不能因为他没有把货物归回原位，就扣客户的钱。


    所以我们认为，现在的无人超市就是处在一个两难境地，如果出门再结账，也不行，因为不知道用户哪个买了，哪个没买。如果一拿起来就结账也不行，因为用户可能不想买。


    那我们介绍的盒马鲜生就比较有创意，它是在店里逛的时候可以不拿走商品，而是在手机 App 上下单，到付款结账的时候再一再取货。


    我觉得以后无人超市真的可能是封闭货架，最多每个品类放个样品，你要买的话就在 App 里下单，等出了无人超市再有个取货窗口取货，这样买了什么没买什么就一清二楚，避免纠纷了。


    当然我说的办法也未必完美，但这就是我们在前哨大会上强调的：


    无人超市的未来业态还没确定，因为购物场景还不够清晰。


    至于收集购物数据，其实不是首要目标，而是为了做到上述目标必须把行为数字化的副产品。


    既然你都已经能够把用户行为数字化了，顺便收集购物数据，当然对自己有利了。


    未来的零售好像还是那些拥有更多资源的大公司才能做，是这样吗？对一个新进入零售行业的公司还有机会吗？


    我的回答是：


    其实不光零售业，是任何一个产业都是一样，有没有机会，其实要问自己有没有别人做不到、又很有价值的特色，叫独特的竞争优势。如果有，小公司就可以做，如果没有就不能做。


    不是每个领域都适合小公司创业的，如果行业没有变化，而大公司已经深耕多年了，这时候小公司往往很难立足。而在那些颠覆性变革的行业里，小公司往往比较有机会，因为这种颠覆性变革会使得大公司难以适应。


    我们讲科技重要，就是因为科技往往能给一个行业带来变革，现在科技爆炸性增长，影响的行业越来越多，但是在很多行业里科技依然没有带来革命性的、颠覆性的变革，这种时候小公司的机会还是不大。


    比如国外的汽车产业，虽然有很多先进技术，但是仍然是由大公司把持，迄今为止，自动驾驶也好，电动车也好，这些技术都还是基于造价卖车的模式，并没有颠覆大公司的模式出现。所以即使是有先进科技，也是为大公司所用，小公司创业撼动大公司的地
    位就很难。


    您可以用您睿智的眼光，解读一下我们中国的茶文化以及茶文化的运作吗？


    我的回答是：


    其实我谈不上睿智，因为每个人都有自己的偏见，只能说从我自己的角度来说而已。


    茶和红酒很像，都是更偏向精神层面的消费需求，就是我们说的品位升级的产品。


    从产品上看，就都需要提升保存价值，可以收藏的话，市场就会大很多。


    这方面红酒做得很当好，茶叶里面也就是普洱做得比较好一点。但是绿茶因为当年的新茶最好，所以普洱茶不适合保存，做得就不够好。


    从产品体系上看，都是强调产地、强调源头，但是没有一家企业有兴趣从整体上规范整个产品体系。


    所以这方面需要国家来组织协调。其实法国红酒、意大利红酒、西班牙红酒历史一样悠久，但是从产区到酒庄的整体的系统性介绍，法国要比其他国家做得很多。那是'
  - '[PAGE 147]


    性介绍，法国要比其他国家强得多，那是法国国家来组织的，因为任何一个酒庄来做事都很难盈利。


    中国国家协调产业原来靠的是协会，现在的市场经济情况下，传统的协会不太适应，能否有更适应市场机制，又能够统一协调全国的机构，给茶叶建立起像国外的红酒一样的体系，是非常重要的。


    从消费上看，红酒和茶叶都需要神圣感。


    所以你看好红酒都限量，甚至有的红酒把每瓶都有一个唯一编号印在瓶子上，这样喝一瓶少一瓶。


    从体验上看，消费的时候都要有仪式感。


    所以你看红酒要去学品酒，品酒是要有固定的操作的。那喝茶也有茶道，也有一整套手续。


    当然，我们要与时俱进，现在大多数人没有时间把自己变成专家，相关的知识了解得也很不充分，所以需要帮他们建立起快速的品位感，也就是让他们快速地达到品位升级的目的。


    # 品位感的快速建立：


    第一是牛人背书，这样可以解决自己不懂的问题，比如我们介绍过的 Robert Parker 来给红酒作评分；


    第二是高端专业设备，来解决仪式感的问题；


    第三是产品和品牌的符号化，解决高端品质的可感知问题。如果你用的是高端的商品，但是别人不知道怎么办呢？所以才会有这么多的品牌，才会有我们前面介绍的 Burberry，把高科技转化成了那个著名的格子式的外衣的图案，所以现在大家不再用科技来识别
    Burberry，而是用它的格子图案来识别了，这都是可感知的问题。


    我们原来介绍过小罐茶，它在第一和第三方面都做得不错，但是它的第二方面还需要加强。


    那现在的家用咖啡机的市场增长得特别快，尤其是使用胶囊的那种，就是因为它的高端设备本身带给了大家了一种很高档的仪式感。我相信未来专业的泡茶机的市场很有可能比家用的咖啡机还要大。


    以上是对本周问题的回答。


