    ## ——今日思考题——


    你更愿意使用传统医疗保险，还是像 Oscar Health 这样的新型医疗保险呢？为什么？


    ## 划重点


    1.传统医疗保险都在面临用户体验下降、费用高、行业门槛高的挑战，想办法解决就能把握机会。 2.传统保险利用精算模型来控制风险，而 Oscar Health
    通过经济手段驱使客户重视健康管理，从而降低长期医疗费用，值得相关从业者学习。 3.解决传统保险的痛点，平价保费、便捷体验、全程参与，是未来保险和健康管理的发展方向。


