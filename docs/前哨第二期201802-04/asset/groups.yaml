    第二，产生一个好的创意并不难，难的是从形成创意到实际推出产品这段路，需要具备一个完整的创意生态链来支撑，所以光有创意远远不够，还要找到能够把创意实现的技术、平台和资源，才拥有落地的可能。当下的创意产业，已经和各行各业进行了深度结合，迸发出了巨大的潜力。


    第三，在这个时代，技术降低了兑现创意价值的门槛，每个人都能利用各种科技工具和现有的平台抓住社会发展的的⼤趋势，无限放大自己的⾈⼈价值。互联网的出现使得 J.K.罗琳这样的一个平凡的单亲妈妈火遍大江南北，随着技术的进步，会有更多的
    J.K.罗琳借助技术的力量获得成功。


    顺便说一句：


    就是原来有一个观点，当人工智能发展得足够发达了以后，大多数人都没有用了，因为你干什么事都干不过人工智能，所以人可能就会被养起来，变成了宠物人。


    现在看起来，创意产业的出现使得宠物人的这个噩梦不会实现，因为那些看似干不了什么事的人里面，某一天可能出一个创意，就改变了世界，就像 J.K.罗琳在当初没有写出《哈利·波特》之前，其实也是拿着政府的救济那样。


    所以，永远不要低估任何一个目前还没有成功的人。


