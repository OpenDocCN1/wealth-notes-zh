    # 164 | 穆罕默德·尤努斯与格莱珉银行


    164 | 穆罕默德·尤努斯与格莱珉银行


    # ——今日内容看点——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 谁获得了诺贝尔和平奖？

    2. 什么是格莱珉模式，它是如何运行的？

    3. 如何有效帮助穷人摆脱贫困？


    我们现在都在倡导建立“信用社会”，无论是机构信用平台，还是个人信用平台，都需要尽可能全面地收集客户信息，包括年龄、学历、工作、收入、资产情况等等，通过一整套严格审查，还有科学计算模型，获得一个信用评分或者等级，然后再发放贷款或者提供各种金融服务。


    而且，大家通常都认为，那些高净值人群，以及有资产、有抵押物的中产阶级的信用会比较好，所以也就容易享受到各种金融服务。


    那我们就不得不问一句，中低收入群体或者穷人们，能享受到类似的服务吗？


    那今天，我要介绍的就是专门给穷人提供贷款服务的金融机构，它不仅不需要抵押物，甚至不需要签合同，而且它居然还能运行得很好，它就是孟加拉国的格莱珉银行，英文是
    Grameen Bank，它的创立和运行的故事告诉我们，其实穷人也是有信用的，而且他们的模式被证实是一种消除贫困的有效方式。


    多说一句，在习近平和温家宝的支持下，2014年“格莱珉银行”启动了中国计划。


    那么下面我们就具体看看他们是怎么做 的。


    # 一、穆罕默德·尤努斯


    那么首先，我先给你介绍一下格莱珉银行的创始人穆罕默德·尤努斯。他是一位经济学家、银行家，也是一位公益创业家。他创立的格莱珉银行（Grameen Bank），在金融史上首次开创和发展了“微额贷款”的服务模式，专门给那些无法获得传统商业银行贷款的穷人贷款，成功地让金融服务也能惠及到贫困人群，所以尤努斯也被称为“穷人的银行家”。


    这里顺便说一句，“格莱珉”在孟加拉语中是“乡村”的意思，所以格莱珉银行也被称为“孟加拉乡村银行”。


    2006年，“为表彰他们从社会底层推动经济和社会发展的努力”，尤努斯和孟加拉乡村银行共同获得了诺贝尔和平奖。


    ![](img/812dfc825c17043226940aa4afb22b20_69_0.png)


    尤努斯1940年出生于孟加拉吉大港一个富裕的家庭，父亲是做珠宝生意的，他的母亲一共生了14个孩子，其中5个都夭折了，在所有孩子里尤努斯是最大的，在大家庭和众多兄弟姐妹生活经历也让尤努斯学会了同理心。


    尤努斯青年时期学习成绩优异，在孟加拉吉大港大学完成了经济学士和硕士学位。1965年，他获得了一份全额奖学金，进入美国田纳西州的范德比大学学习，并最终获得了经济学博士学位。1971年孟加拉国独立后，尤努斯回到母校吉大港大学担任经济学系主任。


    # 二、微额贷款


    1976年，尤努斯带着学生在大学附近的一个村庄进行调研，看到一个农妇在制作竹篓，这个农妇告诉他，制作竹篓的本金是高利贷贷来的，除去高利息利息，做一个竹篓只能赚0.5塔卡，相当于当时的2美分，收入是极其微薄的。如果不是因为高利贷的资金成本高，制作一个竹篓实际是能赚3-5塔卡的，这等于原来收入的6-10倍。


    在后面的调研中，尤努斯发现这种情况很普遍，村里还有42个人都是通过高利借款的。


    这件事对尤努斯触动很大，他非常想自己给他们这些钱，但是理性阻止了他这么做，因为眼前的施舍不能解决这些家庭长期的贫困问题。


    尤努斯认为，造成贫困的根源并非是懒惰或者是缺乏智慧，而是这种状态造成穷人们追逐一些小生意、创造自我雇佣机会的启动资金都没有。


    一些放贷者提供的借贷利率高达每月10%，甚至每周10%。所以不管这些人再怎么努力工作，高利贷的成本也让穷人们无法通过努力改善穷困现状。


    于是，尤努斯拿出27美元，让学生借给这些穷人，等产品出售后再还钱。结果，农妇们很守信用，实现了承诺。


    于是，向穷人提供“微额贷款”的想法就此诞生，这也是格莱珉银行起源的故事。


    # 三、格莱珉银行


    尤努斯认为，消除贫困需要采取可持续的方式。


    在银行成立初期，银行资金的来源主要靠捐赠，从2005年起，格莱珉银行宣布不再接受任何捐赠，只依靠银行自身运营盈利。


    而且和传统方式有很大不同。他们只贷款给穷人，没有抵押，也没有专职的风险控制人员，它到底是如何实现持续运营的呢？


    主要有三个要点：


    第一点，他们为穷人量身定制灵活多样的信贷产品和灵活的偿付机制。


    比如他们的<|message|>


    ![](img/812dfc825c17043226940aa4afb22b20_69_1.png)'
  - '[PAGE 70]


    这个过程可能要花几天时间，也可能要花几个月时间。但也正是通过这个过程，筛 选出了那些能够认真对待，而且珍惜来之 不易的脱贫机会的人，这在很大程度上也 增加了她们能正常偿还贷款的可能性。


    通过了贷款审批还没完，格莱珉针对团体 贷款采用“2-2-1”顺序放贷。这个2-2-1是 指最初只有2名成员可以拿到贷款。根据 她们的偿还情况，另2名成员再申请贷
    款，而小组的组长最后才能拿到贷款。


    你看，通过顺序放贷这样一个机制，轻而 易举就将后面申请的人和小组长变成了免费的“风险控制官”，因为前面的人没有按 时还贷，后面的人就拿不到贷款了，这就 让格莱珉银行不需要再安排专职的风控人
    员了。


    最后，格莱珉模式还会提供财务培训，组 织还款周会。也就是说，每个“团体贷 款”小组成立的初期，在拿到贷款之前， 小组都会集体接受借贷和财务知识的密集 培训。


    # —— 今日内容小结 ——


    今天我们介绍了“微额贷款”概念的创始人 尤努斯和格莱珉银行的运营模式，希望你 能掌握以下三点：


