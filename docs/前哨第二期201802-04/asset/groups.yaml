    这是为什么呢？\n\n原因就在于，当时西雅图的不少高收入人群，开始注重生活品质，比如摒弃包装食品，转而追求买来新鲜食材自己烹饪，当然，比起直接购买咖啡粉，他们也更喜欢买来咖啡豆自己现磨成咖啡粉。于是，星巴克的出现，正好迎合了这些人的需求。\n\
    \n星巴克的经营方式也给 Howard 带来了全新感受，于是 Howard 说服了星巴克创始人 Baldwin 先生，并在一年后加入了星巴克，开始担任零售运营和市场总监的职务。\n\
    \n## 二、成功收购星巴克\n\nHoward 加入星巴克一年多后，就冒出了新的灵感。\n\n当时他偶尔要到意大利米兰去出差，他发现米兰几乎每一个街道拐角处，都有一家咖啡吧。但他们不是卖咖啡豆，而是卖现做的最新鲜咖啡饮品。而且店里一般会播放意大利歌剧，气氛很轻松，大多数顾客可以在这儿待上大半天。\n\
    \nHoward 心想，原来咖啡店还可以是一个供朋友聚会交流的地方，这种场合正是当时美国缺少的。如果星巴克能够引进这种意大利式的咖啡社交文化，一定非常受欢迎。\n\
    \n不过，Howard 的新理念并没有得到三位创始人的支持，于是1985年他离开了星巴克，第二年，他就创建了自己的公司。Howard 的第一家咖啡店翻译成中文的话，就叫做“每日”。这家咖啡店的卖点就是再现意大利咖啡店的轻松气氛，不只有咖啡，还有自在舒适的社交空间。这给美国客户带来了全新的体验。\n\
    \n没想到一年后，星巴克的三位创始人决定要卖掉星巴克的门店和商标。\n\n为什么要卖呢？\n\n因为在经营星巴克期间，他们收购了几家 Peet’s Coffee\
    \ 连锁店，他们觉得 Peet’s Coffee 专注于小众咖啡品类，比星巴克经营大众化咖啡豆更有发展潜力。\n\n于是，Howard 嗅准了这个好机会，Howard\
    \ 觉得，星巴克和每日，一个出售优质咖啡豆，一个打造意大利咖啡社交文化，两个正好优势互补。于是Txn... 在朋友资助下，他成功收购了星巴克。\n\n##\
    \ 三、打造咖啡商业帝国\n\n在之后的20几年中，Howard 把星巴克从几个小小的咖啡店变成全球的咖啡商业帝国。根据2018年1月星巴克官网公布，星巴克已经在77个地区，拥有超过28000多家门店。\n\
    \n听到这，你一定很好奇，究竟他是如何让星巴克成为一种生活方式，一种社交文化和身份标签的呢？\n\n我总结出了以下四个要点：\n\n第一，是选定高端地点。\n\
    \n比如说，刚开始那几年，Howard 都要亲自为新店选址。他瞄准的，不是市中心的写字楼，就是人口密集的住宅区。因为写字楼聚集了大部分高端人群，而在住宅区周边，则是为了方便大家出门左转，就能找到舒适的“第三空间”，这是一个介于社交和私人空间之间、以及家庭与工作环境之间的场合。\n\
    \n除了具体的门店选址，在选择城市的时候，他也会优先考虑城市的地位。\n\n比如，1991年，Howard 进军洛杉矶市场，不久之后，《洛杉矶时报》就给了星巴克很高的评价，几乎一夜之间，星巴克就成了当地的时尚标志，也奠定了他在美国其它地方开店的基础。\n\
    \n第二，Howard 只选择顶级、声誉好的合作伙伴。\n\n星巴克的合作伙伴，都是享有顶级声誉的公司，并且他们都尊重和认同星巴克的文化。\n\n比如，当时\
    \ Howard 之所以会和美联航合作，就是因为看到了美联航的决心，美联航愿意让所有乘务员都接受星巴克的培训。\n"
