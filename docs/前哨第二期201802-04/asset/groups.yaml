    # 166 | 如何把握普惠金融发展的机会？


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 互联网金融机构的机会在哪？

    - 2. 普惠金融如何利用区块链技术？

    - 3. 小企业如何把握普惠金融的机会？


    昨天我们讲了蚂蚁金服，它让我们每个人都可以用极低的成本享受到以往大机构才能提供的金融服务，给了大家用资本作为杠杆，从而创造和增值财富的机会。


    那么，对于我们每个人来说，构建和积累终身的个人征信是必然的发展趋势。自然地，信用水平越高，能享受到的金融服务和产品就会越多。


    # 一、打造“个人信用体系”的趋势


    我先跟你分享一个新闻，就是今年2月底，国内首张个人信用征信牌照下发，这就意味着打造个人信用体系已经成了趋势。获得牌照的“百行征信有限公司”俗称“信联”，它是由中国互联网金融协会牵头，和芝麻信用、腾讯征信、深圳前海征信等8家市场机构共同出资成立的一家市场化的个人征信机构。


    大家都知道，除了传统的商业银行，市场上还有很多互联网和民间的借贷机构。但是，咱们的央行征信中心只有每个在商业银行的信用记录，这其中可能有两个原因：


    - 央行认为只有商业银行的信用记录是可靠的；

    - 很多民间借贷机构并没有拿到国家发布的小贷牌照，因此不会上报到央行征信记录中。


    这就会造成央行征信的“信息孤岛”现象，给那些用心不良的借贷者留了空当，比如说常见的“一 人多贷”、“以贷养贷”等行为。但是现在信联成立了，这就能在很大程度上弥补央行征信中心在个人信用信息方面的欠缺。


    和央行个人征信系统相比，信联在数据源和数据结构上会有比较明显的不同，尤其是在人群覆盖上可以更加多元化。这带来的最大的好处是，把央行征信中心没能覆盖到的个人也覆盖进来，纳入到他们的金融信用数据库体系里，构建一个国家级的信息全面的基础数据库。


    那这意味着什么呢？


    也就是说未来，一个人不管是向传统的银行贷款，还是向民间借贷公司、P2P平台进行贷款，不管你是做生意，还是交朋友谈恋爱，只要涉及到金融，你都别想再隐藏任何不良的记录了。这将成为普惠金融良好发展的一个非常非常重要的基础。


    # 二、构建个人信用平台


    那么下面重点来了，我们来说说科技在推动普惠金融发展的过程中，还会涌现出哪些机会。


    首先，对于互联网金融机构来说，构建一个能终身积累的个人信用平台，然后随着个人客户信用的增长，把金融服务的水平也逐渐提高起来，就能获得更大的发展机会。


    昨天的內容里我们就聊过，在蚂蚁金服的信用平台上，积累了大量的个人消费和收入数据。通过分析数据和个人信息，建立风险控制模型，就能让每个人都拥有一个“量身定制”的信用指标，这就是“芝麻信用”，相信很多人已经享受到它带来的便利了。


    那么，金融市场早已成熟的美国现在又是什么情况呢？


    可以说，美国的个人征信体系是很完善的，现在主要有三家机构，分别是：


    - 全联公司（ Trans Union ）、艾奎发公司（ Equifax ）和益百利公司（ Experian ）。


    这三家征信公司一起覆盖了全美超过2亿成年人 的信用资料，市场份额达到了95%。而这三家公司都使用个人消费信用评估公司费尔艾萨克公司推出的信用评分模型——FICO。


    那么我们来比较一下FICO信用评分模型和芝麻信用有什么区别。


    FICO在计算个人信用分数时采用了5大指标，这和芝麻信用是一样多的，但具体指标的内容是不同的。


    - FICO是：付款历史、欠款数额、信贷历史长度、新信贷账户情况以及在用的信贷类型；

    - 芝麻信用是：信用历史、行为偏好、履约能力、身份特质以及人脉关系。


    根据这些个人的征信数据，FICO也通过分数对消费者的信用进行评分，分数在300~850分之间，分数越高代表消费者信用程度越高。按照分数可以分成5个等级，分别是：


    - 1. 有风险的借款者；

    - 2. 消费者在信用评分的均值以下，但银行仍然可以考虑给他贷款；

    - 3. 信用良好的消费者；

    - 4. 非常可信的消费者；

    - 5. 信用绝佳的消费者。


    # 三、利用区块链技术


    接下来，我们也讲一下火热的区块链技术，因为一套信用评价体系要得到认可并持续维持下去，最重要的是解决公平和安全的问题，而这正好是区块链技术的优势，谁能利用好这个技术，谁就能在普惠金融市场获得更大的可能性。


    很多人可能并不了解，其实普惠金融和公益援助有共通之处，比如说：它们的服务对象都是社会中相对的“弱势群体”，特点是基数都很大。如果想进行切实的服务，就需要严格的监管和审查，避免腐败和赃污的发生。


    分布式记账系统，则保证了身份数据的唯一真实性，以及交易数据的去中心化、不可篡改性和可追踪性。


    另外，救援机构通过区块链技术，直接向销售商付款，不需要再经过第三方的机构，保证了交易的透明，避免了腐败现象，为整个援助项目节约了98%的管理成本。


    这还带来另外一个好处，就是获得了更高的可信度和权威性，减少了质疑。


    通过这个例子，我们就能看出，科技公司可以积极地运用区块链技术，然后结合生物验证手段，比如说虹膜、指纹验证等等，再加上个人征信信息，就能建立起一套完整、安全、可追溯的记账系统，这一定能让普惠金融的各种项目更安全、成本也更低廉，真正地惠及到普罗大众。


    对于中国来说，现在很多年轻人的“超前消费”欲望强烈，对于小额现金贷的需求非常大，P2P现金贷就是应用场景之一，创业者以及相关的从业者一定要重视区块链技术的应用。


    比如芬兰赫尔辛基大学法学院毕业的 Stanislav Kulechov，他就运用了基于以太坊的区块链技术，成立了一家 P2P借贷的互联网金融公司 ETH Lend，发行了
    Lend 币。


    他们让借贷不再需要一家中心化机构，也就是银行或第三方机构，而是把贷款者和借贷者通过平台直接连接了起来。


    首先，借贷者在平台上发布借款请求，这个请求相当于智能合约，里面要写上借贷的金额、时长和利率。同时把其他一些虚拟货币作为抵押物加入到合约当中，通常就是用以太坊。这样一个合格的借款合约就产生了。之后贷款人只要觉得合约合适，就可以把资金以虚拟货币的方式转账给借款人，一笔借贷交易在几秒钟之内就能完成了。


    由于整个系统都是去中心化的，所以合约并不保存在某一个具体的中心化服务器中，就算是 ETH Lend 平台也无法将智能合约中的抵押物取出。因此也就保证了借贷双方资金的安全。同时，ETH
    Lend 平台还会根据借贷双方的信用评级进行双重保险。这样就可以实现全球范围内小额度的 P2P 借贷业务了。


    总结一下：


    普惠金融的机会存在于建立一套强大、可靠的个人信用数据平台，挖掘细分的

    应用场景，以及积极利用科技手段提高

    过程的安全和效率。


    # 四、小公司的机会


    刚才我们说到，把征信体系和商业应用结合，是最大的机会。然而，事实上这也会带来垄断的趋势。


    在商业上，那些已经非常成功的企业，它们对于整个供应链的掌控能力都是非常强的，它们可以把积累的大量数据用来构建自己的信用体系，然后到金融领域中进行拓展，在这个过程中，大量最新的商业数据还能不断优化信用体系。


    可以说，在建立个人征信系统方面已经成功的企业，它们的优势非常明显，在参与到某个具体领域的业务时，也就更有竞争力。尤其是在量化指标以后，它们的客户画像精确，转化率也较高。也就是说，无论在信用体系还是商业领域，只要在一个方面占有了垄断优势，就极有可能赢者通吃。


    对于互联网金融来说，它的市场可以分成个人征信业务和小微金融业务这两块。


    对于创业者来说，由于初创企业往往拿不到大量、全面、系统且精确的支付细节及信用数据，因此做个人征信业务将会成为初创企业的陷阱。


    而借助国家发布的征信平台，结合自身对于细分产业的了解，创业公司可以将目光放到细分领域中进行“精耕细作”，同时也可以将落脚点放在如何辅助这些在某一方 面有垄断优势的公司上，做它们的“智囊团”和“服务商”，这也还是有一定发展空间的。


    # —— 今日内容小结 ——


    总结一下，今天我们介绍了普惠金融的机会，希望你掌握以下3点：


