    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下4个问题的答案：


    - 1. 为什么说健康管理是反人性的？

    - 2. 中国的健康管理市场有什么问题？

    - 3. 美国的健康管理模式是怎样的？

    - 4. 健康管理的场景势态是怎样的？


    这周我们要讲一个和我们每个人都息息相关的话题，那就是健康管理。


    首先我们回忆一下，你还记不记得乔布斯是怎么去世的？


    可能你会说胰腺癌，但其实，他得的并不是严格意义上的胰腺癌，而是胰岛细胞瘤，这并不是什么恶性肿瘤，一般情况下，普通患者在肿瘤切除后，都还是能恢复得比较好的。


    但为什么乔布斯却最终没能活下来呢？他可是不差钱对吧？


    其实根本原因，是他在确诊之后的长达9个月的时间里，一直都拒绝去做手术，最终因为延误治疗导致了扩散，在2011年，乔布斯死于胰腺肿瘤转移后导致的呼吸骤停。


    通过乔布斯的案例我们就能明白：


    - 即使是那些能够治愈的疾病，如果得不到正确的管理、及时的治疗，就有可能发展成难以回的恶性疾病。


    而且我们还都知道，有些疾病，特别是像高血压、糖尿病这些慢性病，只要患者能够严格遵照医嘱治疗、服药、管控好自己的行为，就可延缓疾病发展，避免出现其他的并发症，让生活质量甚至可以和普通人一样。


    我们刚才说的都是得了病的，其实现在大家已经越来越明确了：


    - 只要我们能够保持健康的生活方式，就能有效地降低得病的概率，做好预防远比得了病再去治疗成本更低，而且更重要的是少遭罪、少浪费时间。


    那今天，我就先和你聊聊健康管理的现状和发展趋势。


    ## 一、“历史悠久”的健康管理理念


    其实，健康管理不是什么新概念或者说新需求，我们祖先早在先秦时期的《黄帝内经》里就讲到“上工治未病”，意思就是要重在预防，保持健康，而不是等到生病了才去治。


    根据世界卫生组织的统计：


    - 影响人们健康和生存质量的因素当中，生活方式占60%，很多疾病，比如说内分泌、关节和骨骼问题、心血管疾病、高血压等等都和生活方式相关。我们大多数人以为最关键的医疗条件和医疗水平其实只占8%。也就是说，六成的疾病都可以通过预防来避免。


    此外，健康管理还能带来巨大的经济效益，根据世界卫生组织的调查显示：


    - 你每在健康管理上多花1块钱，就可以节省8块5的治疗费，还能节省100块抢救费。


    健康管理的问题，其实已经上升到了国家层面了。


    2016年召开的全国卫生与健康大会，国家主席习近平甚至亲自在大会上倡导健康文明的生活方式，呼吁大家树立大卫生、大健康的观念，把以治疗为中心的观念转变为以人民健康为中心，建立健全的健康教育体系，提升全民健康素养，推动全民健身和全民健康的深度融合。


    这里习主席的一系列呼吁，都和健康管理的内涵不谋而合。


    ## 二、健康管理是反人性的


    不论是学术界、政府、社会，甚至个人都知道健康管理的重要性，但是健康管理作为一个产业，尤其是比起以治疗为主的专科医疗、急症医疗，在国内发展得并不快，产业规模也并不大。


    那这是为什么呢？


    其实这是因为，洞察和顺应人性的商业一般都会成为刚需，市场巨大，但是健康管理其实是有点儿反人性的，是要和人性作斗争的产业。


    比如：


    首先人总是会图享乐的，热爱美食，有 ？实现?


    ## 三、国内健康管理产业的问题


    我们中国的健康管理大概是从2000年左右才开始兴起的。


    拿北京来说，现在已经有差不多500多家健康管理体检中心了，提供 ？服务？？


    ## 预告 | 健康管理


    虽然我们每个人都希望保持健康，但实际上健康管理是反人性的，比如，热爱美食，你需要控制，喜欢喝酒，你也需要控制，吸烟有害健康众所周知，但吸烟的人口依然众多。


    健康管理说起来简单，但现实生活中能做好的人少之又少，因为它需要持续保持健康的饮食、规律的运动、良好的作息习惯，这些都需要自律。


    不过，随着现代生活水平的提高，大家相比以前是更关注健康了，而且，得益于互联网、可穿戴设备、大数据、云平台、人工智能的发展和普及，我们掌握了在一定程度上能战胜人性的武器。


    下周，我们就来聊聊健康管理，从这个产业的发展现状到未来趋势，欢迎你的关注。我相信，你也一定对如何更好的管理自己的健康感兴趣。


    王煜全


