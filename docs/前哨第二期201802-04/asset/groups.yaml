    # 加餐 | 再议“比特币、区块链、ICO”


    加餐 | 再议“比特币、区块链... ↓


    王煜全


    今天是周六，按理说需要休息了，但是我是想接着昨天的主题给大家做个周末加餐。


    我们昨天介绍了，比尔·盖茨也成了比特币的怀疑者，但是与此相反，虽然国内政策是严格限制的，但是区块链还是火得一塌糊涂。


    2018的新年，大佬们托维的“三点钟无眠区块链群”以霸屏的形式在链圈和币圈引起了热议，微信群的名称都透露出连睡觉都浪费时间的焦虑。


    我想在今天跟大家再重温一下我们对于比特币和区块链的基本看法。


    # 一、重温“传统观点”


    第一，比特币是有价值的。


    因为它是第一个虚拟货币，第一个就会让公众形成一种公认的价值信用，它能够做到防伪，它能够严格稀缺，它可以无限可分，这些东西加总起来以后，使得它成为了一个真真正正的货币。


    其实很多人说，黄金、白银为什么有价值？是因为它们值钱，其实不是。如果说大家不承认它有价值，它就不值钱了。


    所以，我们一直强调比特币没有问题。


    第二，区块链也是有价值的。


    首先说它是分布式的、去中心化的，这样避免了一个中心化的系统的诸多问题，另外，因为它的记账系统能够验证防伪，而且能够溯源，所以也会有诸多用途。


    第三，ICO 是没有价值的。


    很多人说 ICO 不是能够帮助这些创新企业、创业企业融资吗？


    其实我认为，整个资本市场走到今天，传统的融资途径基本通畅，不管是风险投资、天使投资还是众筹，都是有那个途径的。


    连那个途径都融不到钱的项目的成功率会极低，而且现在看起来，ICO 项目大多数都会回避传统融资途径当中必然会问到的问题。


    比如说，你的产品到底是怎么样的？


    比如说，你的业务市场如何能够做起来？


    现在的 ICO 都声称做一个白皮书，但是这白皮书里基本上都是讲我的技术怎么怎么样，而且这个技术无外乎就是现有区块链平台，比如说以太坊这样的平台的一个简单延伸而已，而没有太多革命性的突破。


    第四，后起的新发的货币都没啥价值。


    当然有人说不对，你看今天依然有很多人货币在很短时间之内会翻很多倍，10倍、20倍、100倍。


    当然了，在我们都知道的那个著名的泡沫事件“铂金香花事件”当中，如果你早早入场、早早撤离，也会赚到钱。


    在现实当中，我也听说过有人炒那些比特币以外的货币赚到了钱的，但是现实当中，很少见到赚了钱就离场的，也就是说，今天靠炒虚拟货币赚到钱的人都还在场内，他们的钱还在场内循环着呢。


    那么就有问题了，如果有一天这个市场崩塌掉，他们赚到的钱还能不能兑现呢？


    这就是个很大的问题，所以，我认为今天不是判断这些虚拟货币是否能给大家带来足够盈利的足够好的时间点，因为潮水退去之后才能看到谁在裸泳。


    # 二、分享“新观点”


    第一，区块链的革命性确实很大。


    但是，因为有很多 openly 把区块链比喻互联网时代，我认为现在即使是互联网时代，也是互联网的前期，就是当年那个 BBS 的时期。在这个时期进场的未必是未来赢家。我们都知道，那时候名气最大的公司叫瀛海威，但是后来胜出的是新浪、搜狐。


    第二，区块链的普及性其实很小。


    因为它要分布式记账，所以造成一个系统一旦做大了以后，交易都很难做到实时。另外，它的前端使用体验也很糟糕，你要装过一个完整的区块链钱包，你再等着区块链钱包完整地复制区块链，你就知道那个体验有多糟糕了。


    所以，其实我认为现在所谓的布局也都是起哄，因为连技术都不全面，就像当年 BBS 的时代你投资投不出新浪一样。


    区块链的效率和它本身的记账系统有直接关系，因为区块链公平性的保障是要记录到一半以上的账簿里才能保证不被篡改。


    同样在这样的系统里运行起一个应用来，工作量就会巨大，当然效率就很低了，所以区块链应用很难做到实时。


    当然，可以有一个办法，就是加上中心化的中间层，但是你加上了中心化的中间层以后，又会存在被篡改的可能性，因为又不是分布式的了。


    所以，今天虽然有人拿区块链比喻互联网时代，但是这些技术问题没解决，所以现在的区块链业务都相当于互联网时代的 BBS 和瀛海威。一旦这个问题解决了，互联网时代才真的来临，如果要拿区块链的出现比喻互联网，那么现在就是互联网门户出来之前的浮躁期。


    第三，区块链项目的创业机会其实很小。


    现有落地的区块链应用基本都是大机构发起的，小创业公司充其量也就是发个币。


    而未来最大的机会确定未必是在现有的大公司当中，因为未来的我们都知道区块链项目是去中心的自组织的这种平台，这种平台的要求是要把权力交出去的，而现在已经上规模的大公司、大平台就很难做到。


    比如说一个赌场已经习惯了能够自己控制赌客，如果赌客赢的太多，就把他驱逐离开场。现在你让他把这个权利交出去，说我要用区块链做一个公平的赌博系统，他就一定不愿意做。


    另外，我们发现现有的创业公司，大多数的模式根本就不成立，因为大多数的区块链创业企业基本上都属于是说自己有防伪能力就可以做茅台，说自己有信用的跟踪系统，就可以做招聘网站。


    其实茅台成功的曲则是能做好酒，招聘网站成功的原因是能积累到足够多的求职者，你有防伪能力，你有信用跟踪能力，是锦上添花，而不是雪中送炭。但是现在的 ICO 基本上都是我说的这个类型。


    另外，我们前哨的用户都很熟悉，我们一直坚持认为，创新不代表就是创业。


    那就像互联网的超链接一样。超链接是一个了不起的发明，甚至说是它缔造了互联网今天的辉煌都不为过，但是这个发明背后并没有塑造任何的亿万富翁，而只是让大家都使用了。


    所以，我们现在看起来区块链今天的小创业者的狂欢，无外乎是去海外发个币罢了，而没有看到他们能够实在地在地把什么业务做大起来。而国内在2017年9月4日已经被中国人民银行全面叫停了，所以它甚至只能去海外发币。


