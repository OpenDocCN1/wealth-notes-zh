    ## 三、共享经济的三种组织形式


    这个问题，蔡斯可以说是万有发言权的创业者了。


    2015年，蔡斯出版了一本书，名叫《共享经济：重构未来商业新模式（Peers Inc: How People and Platforms Are Inventing）》，她在书中谈到了自己对共享经济的理解，以及这些年来创业心得。


    昨天我们已经提到了她总结的共享经济三要素，今天说说她总结的共享经济的三种组织形式：


    第一种叫切割(Slice)，像 Zipcar 或共享单车，把拥有单车变成切割它的使用权，从而优化利用效率；


    第二种叫聚集（Aggregate），指的是在平台上聚集闲置资源，然后进行重新分配和利用。最典型的就是 Airbnb。Airbnb 大家也比较熟悉了，它的模式就是把闲置的房间再利用；


    第三种形式叫开源，也就是所有资源由大众贡献，并且免费使用。这种模式通常会创造新的价值。比如，从全球最大的代码托管平台 Github 这里，诞生了很多基于开源代码生产软件，其中就包括我们每天都在使用的
    Windows 系统、iOS 系统，明天我们将会详细讲解 Github。


    总之，目前绝大多数共享经济企业，基本上都逃不开切割、聚集和开源这三种组织形式。


