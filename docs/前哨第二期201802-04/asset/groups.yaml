    # 163 | 科技助力下的普惠金融发展趋势


    163 | 科技助力下的普惠金融...


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 什么是普惠金融？

    - 2. 普惠金融背后的基础是什么？

    - 3. 互联网对普惠金融的影响是什么？


    上周五我们在节目预告中提到，2016年出了一本很轰动的书，叫《21世纪资本论》。它用数字说明了一个很残酷的事实，那就是：


    在任何相对平稳的社会阶段，资本回报的增长率都大于整个社会价值的增长率。


    尽管科技收益的增长率也许会更高，但科技回报的范围很窄。这样一来，大多数不从事科技产业的老百姓看起来好像注定是吃亏的。


    但是从今天开始，我们要讲的是普惠金融，也就是给普通人提供资本这个杠杆，让人人都可能利用资本工具获得收益。


    当然，如果你能比其他人更早更好地利用金融工具，获得收益的概率就会大大增加。


    # 一、普惠金融


    我们先解释一下到底什么是普惠金融。


    这个是联合国为了推动2005国际小额信贷年提出来的概念，在宣传上说的是小到100美元的贷款就能帮助一个企业发展，其中的关键就在于“普惠”这两个字，就是说让普通人也能享受到金融服务，得到经济上的实惠。


    虽然从起源上来说，普惠金融是英文 Inclusive Finance 翻译过来的，但是普惠拓展了英文 Inclusive 的原意，不仅仅是包含、包括的意思了，一个“惠”字把金融服务的最终目的也清楚地表达了出来。可​见，金融服务的主要服务对象是低收入人口和微小企业，尤其是生活在贫困地区和国家的人。


    对富裕人群所提供的那些金融服务从就不是在普惠金融的概念范畴里，至少现在还不是。因为对底层大众来讲，最基本的金融需求还没有完全得到满足。


    其实不管是个人还是企业，金融的基本需求由低到高，大致可以归纳为交易、支付、储蓄、借贷、投资和保险。


    可交易的账户是一切金融活动的前提，它不仅让支付和储蓄成为可能，在有了比较长时间的信用记录后，也就为日后的借贷提供了有力依据。


    但是根据世界银行全球金融包容性指数2014年发布的数据来看，世界范围内至少还有20亿成年人没有任何形式的交易账户。在咱们中国，现在79%的成年人都有自己的储蓄账户，基本和发达国家的水平相当了。要知道20亿是整个中国人口的1.5倍，实在是触目惊心的。而世界银行对普惠金融的具体目标，就是要在2020年以前把这个数字减少到一半。


    这个目标看起来很美好，但背后需要两个重要的基础：


    - 一是要有良好的个人信用记录，并且能终身不断积累和维护；

    - 二是要有和个人实际情况相匹配的风险承担能力。


    # 二、互联网+普惠金融的发展现状


    互联网以及在它基础上衍生出的各种新技术，可以说是重新定义和改变了普惠金融，以前金融服务依赖于金融机构的物理存在，城市里的人能享用金融服务是因为城市里有储蓄所、有银行。相比来说，农村就缺少很多了，存个款、取个钱，走10几里路是很常见的。


    全和快捷就无从谈起。


    在欧美，以盈利为目的的银行和信用卡组织是不会愿意独立于这样的苦力活还让第三方瓜分自己的利益的。


    第二，在欧美，使用借记卡、信用卡甚至支票等非现金结算已经有超过半个世纪的历史了。


    在行为习惯上根深蒂固，还有监管法律法规的成熟度都是中国所不具备的。但也恰恰是这种欠缺，给移动支付在中国提供了巨大的可能和政策允许空间。


    未来对于我们每个人来说，享受普惠金融的门槛会随着科技发展变得越来越低，同时产品种类更丰富，应用领域更细分，但前提是信用会变得前所未有的重要，也就是信用及财富。而且积累终身的个人征信是发展的必然趋势，自然的信用水平越高，能享受的金融服务就会越多。在周四的节目中，我们会基于这个发展趋势，聊聊不同规模的公司的机遇和陷阱。


    # —— 今日内容小结 ——


    今天我们介绍了普惠金融，就是能让普通人利用的资本工具，希望你掌握以下三点。


    第一，在任何相对平稳的社会阶段，尽管科技产业在某个具体领域的收益会高于资产收益，但总的来说，资本回报增长率都大于整个社会价值的增长率，所以说大家要积极利用金融工具，充分发挥资本的杠杆作用，不要跑输了市场。


    第二，普惠金融背后有两个重要基础，一是良好的个人信用并且终身不断积累和维护，二是与个人实际情况匹配的风险承担能力。普通人也会拥有良好的信用，不仅仅是有产阶级，但不能承担超过自身抗风险能力的金融服务，因为杠杆越大风险也随之增加。


    第三，在移动互联网时代，科技重新定义和改变了普惠金融的发展路径。现在只要是互联网所能够触及到的地方，人人都有平等的的使用权，当然，除了科技助力以外，中国政府在政策上对普惠金融的支持也是非常关键的。


    # —— 今日思考题 ——


    政府和个人在防范金融风险的责任上应该有什么样的分担和安排呢？科学技术的发展有朝一日能够帮助人们控制与生俱来的贪婪和恐惧从而理性投资吗？关于这两个问题，你有什么样的思考呢？


    欢迎在留言区分享你的观点。


    # 划重点


    - 1. 普惠金融，就是让普通人也能享受到金融服务，得到经济上的实惠。对富裕人群提供的那些金融服务，从来就不在普惠金融的概念范畴里。 2. 让资本为你服务的前提是，选择适合自己风险承受能力的金融服务。
    3. 只要是互联网能触及到的地方，人人都有平等的的使用权，未来对于我们每个人来说，享受普惠金融的门槛会随着科技发展变得越来越低。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我们明天见。


    # 预告｜移动互联网时代的“普惠金融”


    在移动互联时代，只要是互联网能触及的地方，人人就都有平等的相。可以使用。


    得益于大数据和云计算技术的应用，为普通人也搭建出了可量化的“个人信用”，过去那些只有大的机构和高净值人群才能获得的优质金融服务，现在也能惠及到普通人。


    而对于互联网金融机构来说，构建能终身积累的个人信用平台，让金融服务水平随着个人信用越来越高，就会有更大的发展机会。当然，这对于传统银行会造成巨大冲击。


    下周，我们讲解“普惠金融”，分析普通人如何利用“资本”工具，获得更多的收益。


