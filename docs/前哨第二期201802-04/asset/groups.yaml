    # 188 | 注重产品精神价值的品位升级


    188 | 注重产品精神价值的...


    和大家播报一下我们在全球创新领域的一些动态：


    我们的美国东南部分投资考察团从5月12日就开始了。


    此次我们将走访美国东南部aní特兰大、北卡罗来纳州，还有华盛顿。这些地方中国人去访问的都比较少，但实际上都是美国科技创新的重镇。


    亚特兰大是全美第8、全球第17大城市，有乔治亚理工、Emory 大学等高校，北卡罗来纳州有著名的 Research Triangle 研究三角区，华盛顿周边更是有很大堆名校。


    我们介绍过，美国的创新是围绕高校展开的，越是那些全美很厉害，但在中国不太出名的高校，越是能找到真正的好项目。


    我们的投资考察理念就是带大家深入美国最前沿的创新地区，去挖掘未来产业的真正的颠覆性的机会。


    我们之前也介绍过这次的考察团，现在基本报满了，不过因为最近美国签证的拒签率突然增高，我们有几位团员被拒签，所以还可以有几个名额，欢迎有兴趣的朋友参加。


    详细信息请大家关注我的微信公众号“全球风口”，点击“考察团”了解报名方法。


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 品位升级与消费升级有什么区别？

    2. 品位升级的消费理念是什么？

    3. 新生代消费者有哪些特征？


    这周我们来讲解“品位升级”。


    我相信“消费升级”这4个字你肯定都听腻了，而“品位升级”的字面意思你肯定也有一些概念，也许你会认为它们的差异好像不大。


    但实际上，我们中国目前正在经历的所谓的“消费升级”的本质，就是“品位升级”，这和以前的消费升级是不一样的。


    具体怎么不一样呢？下面我们详细说。


    # 一、从消费升级到品位升级


    其实所谓消费升级，说白了就是有钱了，人人们要买更好的东西来吃、穿、用、住。虽然我们感觉“消费升级”是这些年才火起来的，但其实，从改革开放到现在，我们已经经历了两次“消费升级”了。


    # 二、消费力群体的改变


    那么这一轮中国的“品位升级”都有那些表现呢？中国未来的“品位升级”又主要发生在哪些领域呢？


    ![](img/812dfc825c17043226940aa4afb22b20_127_0.png)


    根据相关数据，中国有两次人口高峰，第一次是在1960-1975年，第二次是在1980-1995年。这两次人口高峰对目前的消费升级、品位升级有着重要的影响。


    # 三、品位升级的三个角度


    新生代消费者是伴随着互联网的崛起长大的，是社交网络上的主流用户和意见领袖。他们的偏好构成了大部分消费品类的主流趋势。


    第一个角度，品牌成为一种自我表达工具。


    ![](img/812dfc825c17043226940aa4afb22b20_127_1.png)


    这里顺便多说一句：


    > 其实科技本身就很时尚，高科技就是“品位升级”，已经有越来越多的人愿意为“高科技”带来的体验和精神满足买单。


    第二个角度，注重产品的品质和精神内涵。'
