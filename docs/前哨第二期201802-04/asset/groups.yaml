    139 | 社群运营的两种模式


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 为什么运动社群会在中国兴起？

    2. 轻、重两种运营形式各有什么缺点？

    3. 前瞻的社群运营有什么经验？


    这周一我们聊了社群经济是新一代消费入口，大家留言非常积极热烈，各自参与的社群也是五花八门，有英语、读书、写作、健身、理财、游戏、购物、饮食、创业等等等等。当然，在看到大量社群涌现的同时，你也会看到不少社群因为运营困难和人气不旺消失了。现在的趋势是，整个循环周期的时间也会越来越短。


    最近几年，随着微信用户的逐渐增加，我观察到，在这些五花八门的社群当中，有两类社群是比较受欢迎的，一个是读书或者学习类的，再一个就是运动健身类的。这背后的原因，跟大家认同终身学习的观念，以及追求健康的生活方式是分不开的。


    # 一、运动社群


    身在得到，学习社群相信大家已经很了解了，那咱们今天就重点说说运动社群。


    现在很多人都养成了每天跑步的习惯，跑步不仅是锻炼身体的方式，还成了一种时尚。我的朋友圈里几乎每天都能看到有人晒跑步路线，还有不少人晒自己去世界各地跑马拉松的照片。


    首先，我们需要解答的一个问题是，跑步为什么会在中国流行起来呢？


    目前有各种各样的分析，总结来说主要有这么三点原因：


    +   1. 从整体经济层面来讲，当人均GDP超过5000美元，也就是人民币三万块钱时，人们对生活品质、文化娱乐和休闲健身的关注就会增加。这也正好呼应了当下“品位升级”的趋势。

    2. 快节奏的城市生活和巨大的工作压力也促使人们通过运动来放纵身心。同时，人们也越来越关心自己的健康状况。

    3. 在移动互联网时代下，可穿戴设备和跑步软件开始大量涌现，跑步的社交属性被释放出来，朋友圈里晒跑量的人越来越多，一起约跑的人也越来越多。过去看起来枯燥的跑步活动，突然变得非常有趣。


    在这样的基础上，越来越多的运动社群应运而生。


    # 二、咕咚运动


    今天我们就来介绍一下在国内比较早地介入社群运营的咕咚运动。相信有不少人用过咕咚运动的App。它不仅可以用来记录跑步、骑行等运动里程，还会组织各种社群活动，来激发大家的运动积极性。


    # 三、社群运营的两种形式


    除了推出这些产品以外，咕咚是怎么进行社群运营的更值得关注。


    # 四、前瞻的运营经验


    既然说到社群运营话题，我也想来跟你分享一下我们的经验。我们前瞻也尝试运营自己的社群。尽管对科技趋势和创新新兴题的人没有跑步的人那么多，但由于现在正处于科技创新的风口，所以我们社群的用户黏性很强。'
