    其实不是东岸的创投不优秀，2016年麻省的风险投资数额就已经超过了加州，但是东岸的投资人更像 Carmichael 一样，都是投业内的。也就是说，他更多的是在创业者决定创业、还没有到处去声张的时候，就已经把钱递到了创业者的手里，所以他在业内非常知名，但是在公众当中默默无闻，Carmichael
    就是这样一个典型代表。


    他给我们展示的项目，比如说非常神奇的像太阳能板一样的硅片，却不是用来吸收太阳能的，而是用来从空气当中吸取水分的，我们都知道空气的湿度不可能为0%，也就是说，即使再干燥的沙漠里，空气当中也都依然含水。这个板子最神奇的地方就是，它连干燥沙漠空气里的水都能提取出来，一套装置能够达到24小时就产生五升水这样的效率。


    Carmichael 投的这家公司有一个宏大的野心，就是一旦这个设备普及到每家每户，我们以后用水都应该是不再需要付费的了。因为他们说，我们用空气也不付费。这当然是个了不起的愿望，尤其是在缺水的地区。


    类似这样的项目还有很多，包括我们和 Carmichael 合投了 Soft Robotics，就是根据章鱼的原理，做出可以抓取任何东西的柔性机器手。


    他们的 CEO Carl Vause 也来做了展示，他们的理想就是把最后一个工人都驱离工厂，因为工厂里面现在很多精密的制造、焊接、搬运的工作，都是由机器手来完成的。但是足够灵活的工作，机器手还不能胜任，这时候，柔性机器手就可以解决这些问题。


    比如说，中国像京东、淘宝都建立了仓储物流系统，也就是那些包裹的分发都是由小机器人完成的，但是要把包裹放到这个小机器人的身上，这一步现在还是要靠人，因为包裹的形状、大小不同，甚至重量也不一样，还没有一个万能的抓取工具能够完成把包裹放出去的动作。这一个动作就造成大量的人工损耗，Soft
    Robitics 就解决了这个问题。


    所以我们就看到，其实在美国整个创新生态链里面，风险投资人依然占据着非常重要的地位，但是他们的价值已经从给钱变成了给资源，也就是我们讲的积木式创新。一堆长板的结合，背后能把这些长板拮合起来，把这个拼图拼成的这个人，往往是风险投资人。这也是
    Carmichael 的优秀之处，他投的很多项目都是由他来完成这个拼图工作的，也正是这种模式，让美国的创新效率如此之高。


    最后，要用专业的人做专业的事，一个核心点就是，我们自己要明白一个创新生态的整体布局，要能够找到各方面专业的人来跟我们协作，当然同时要保证自己在自己的专业领域是最强的，自己是一块长板，和别的长板合作，能够巧妙地拼成一个桶，这个企业就能够实现快速增长。


    而整个生态要想更加高效，就需要更多的可以被拼接的独立长板，也需要更多的能够把这些长板拼接成木桶的人，而这些专业的支持者就充当了这个角色。


    好了，今天的内容就到这里。


    # 划重点


    +   1. 科技企业最大的风险往往不是自己经营的风险，甚至不是同行竞争，而是那些来自其他领域的技术形成的完美碾压。 2. 美国东岸的风投往往能够事先找到好的创业项目，在公开募集资金之前完成投资，因此看起来默默无闻，但实际投资额已经超过西岸。
    3. 用专业的人做专业的事，核心是要明白一个创新生态的整体布局，要能够找到各方面专业的人进行协作，才能够实现快速增长。


