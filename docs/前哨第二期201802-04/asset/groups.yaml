    第三步，咖啡师会把这些刚烘焙出来的豆子现场研磨、冲煮成咖啡。


    不过，巨型铜罐里发生的情况肉眼是看不出来的。这时 AR 技术就登场了，你只要掏出手机，扫描现实中的场景，手机就会用动画形式实时呈现出咖啡豆的烘焙、磨研，以及咖啡被制作出来的全过程。


    # —— 今日内容小结 ——


