    # ——全周总结——


    本周，我们的话题是资产管理，介绍了三个重点：


    第一，随着经济的蓬勃发展，新兴中产阶级的兴起带来了资产管理需求的新浪潮，然而传统的资产管理机构却无法满足这个群体的需求，因为传统资产管理机构 adquirido...高净值人群作为用户群体，高昂的投资进入门槛以及投资管理费用将新兴中产阶级拒之门外。


    智能投顾恰恰就是看到了这一痛点，充分利用技术的手段，降低资产管理的门槛，将普通人的财富汇聚起来，实现财富升值，从而打开了华尔街的大门。


