    比如有一关叫 Donut Detective，就是负责培养小朋友给出指令的能力，帮助他们理解序列思维；


    Tool Trouble 这关要求小朋友反复循环指令，理解循环思维；


    Puppy Problems 这关则展示了事件触发思维，也就是说，发生某个动作后触发一个新的指令；


    Lunch Crunch 是关于条件语句的，让小朋友学习根据特定条件来执行特定命令。


    这让我想起来在编程界流行着的一个笑话：


    就是某个人跟她的老公说（她的老公正好是一个 IT 宅男），请你到外边帮我买一斤葡萄，如果看到了西瓜就买一个，结果她老公只带回来一个葡萄，因为按标准的程序语言来说，这就是一个“事件触发+条件语句”，因为看到了西瓜，所以买葡萄只买一个。


    各式各样的命名方式对我们来说并不重要，重要的是理解游戏背后的设计逻辑。


    如果小朋友想完成任务，就会自然地学会怎样分解问题、制订计划、选择并执行命令，然后加以验证。如果没能通关，就继续调整计划，修改命令，直到最后成功。


    其实，这个流程跟编写程序的逻辑是一样的。总之，这个任务是通过图形和游戏的方式把编程思维融合到“解谜”的过程中，帮助小朋友更好地应对学习编程时遇到的困难。


    那么，这个创意是怎样诞生的呢？


    据说，Code Spark 的创始人格兰特是受到女儿的启发才创立这家公司的。有一天，格兰特年仅6岁的女儿提出想要学习计算机，格兰特先是感到吃惊，但作为父亲和计算机行业的工作者，他决定尽一切力量帮女儿完成心愿。


    在这个过程中，格兰特很快意识到，不单是自己的女儿，每个小朋友都有必要学习计算机知识。因此，格兰特成立了这家做儿童计算机编程教学的公司。正好 Bill 和格兰特对这个项目观点一致，所以，Idealab
    在种子轮就参与投资了 Code Spark。


