    今天我要介绍的主角是《哈利·波特》的作者J.K.罗琳，相信即使你没有读过这部小说或者电影，也会比较熟悉，因为这是世界顶级的大 IP，可能不少用户还是“哈迷”呢。


    # 一、最赚钱的作家-J.K.罗琳


    在《哈利·波特》里，J.K.罗琳创造了一个风靡全球的魔法世界。她从小就喜欢创作一些奇幻故事，创作完后就会念给自己的妹妹听。《哈利·波特》系列的雏形，就是某一天她在火车上产生的一个构思。简单说，这是一个小男孩到魔法学校去学习的故事，构思产生以后，罗琳就开始写作了。


    但是，罗琳的写作之路并不是一帆风顺。


    写作初期，她不幸遭遇母亲去世，随后自己又成为单亲妈妈，还曾经患上抑郁症，靠领国家救助金度日。不过，1997年出版的《哈利·波特与魔法石》彻底改变了她的命运。从此她实现了从人生低谷到人生赢家的华丽转身。


    # 二、莎士比亚和J.K.罗琳


    罗琳是多产的英国作家，我在前哨第一季的时候就介绍过，MIT 斯隆商学院的副院长黄亚生老帅拿她对比过400多年前的莎士比亚。这两位处在不同社会背景中的英国作家，存在着极大的差别。而这种差别，正是不同时代的不同的推广营销渠道，最终造成了在商业价值上的巨大差异。'
  - '[PAGE 45]


    时，而莎士比亚却是万古流芳的。这话确实有一定道理。但是从另一个角度来说，未来出现第二个罗琳的可能性，要比出现第二个莎士比亚的可能性大很多。


    所以我们说，在这个时代，每个人都能利用各种科技工具和现有的平台，抓住社会发展的大趋势，无限放大自己的人生价值。


    # 二、亚马逊工作室


    那么，如果普通人也有写作的习惯，是否自己的作品有朝一日也能大卖，甚至拍成电影，像罗琳一样成为人生赢家呢？


    其实早在2010年，我们熟悉的亚马逊就已经开设了亚马逊工作室（ Amazon Studios），希望探索影视原创内容制作的新模式。


    2015年11月，亚马逊工作室又配套推出了免费脚本创作软件 Amazon Storywriter，任何人都可以在线上传脚本。有了 Storywriter，大家不用担心格式编排的问题，可以完全专注于内容创作。


    这对于业余创作者，或者尚未出名的剧作家来说，可是个大利好。因为，把用 Storywriter 写好的剧本或者视频上传以后，就会有网友投票、行业专家和工作室审阅，来定期评选出最佳剧本。


    一旦作品被选中为电影剧本，华纳兄弟将享有优先合作权。而如果华纳兄弟放弃了，要是作者继续选择跟亚马逊工作室合作，后者就可以把剧本卖给其他公司。


    而被亚马逊工作室选中作品的作者，当影片制作完成上映后，将会得到几十万美元的分红。电影首先会在影院上映，然后还会在亚马逊 Prime 视频流服务上播出。感兴趣的用户，都可以利用已经搭建好的推广平台，来放大商业价值。


