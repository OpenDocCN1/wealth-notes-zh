    # 182 | 中国经济如何才能才立于不败之地？


    # —— 全周总结 ——


    本周的话题是健康管理，我们介绍了三个重点：


    第一，世界卫生组织的数据证明，引发疾病的所有因素当中自身的行為占60%，我们想象中对健康因素有决定性作用的遗传因素实际上只占15%。


    也就是说：


    如果我们把自己的健康当作财产一样悉心管理，及时纠正自己的不良生活习惯，就能大大减少患病风险。


    因此健康管理对于个人和国家来说都有重要意义，做好健康管理不仅可以减少患者的病痛，还有效降低医疗支出。


    第二，获取健康数据主要依靠医院或者其他医疗健康机构的定期体检，因此传统的健康管理企业更偏向于重资源型，甚至拥有自己的保险部门、医院和医生。


    但是近年来随着互联网、可穿戴设备、大数据、人工智能等技术的发展，获取数据的门槛降低，提供健康管理服务的成本降低，创新企业有机会利用技术切入健康管理，特别是在细分领域的健康服务。


    第三，健康管理是一件反人性的事，大多数人本能地会选择愉悦的事情，所以抽烟、喝酒是人性使然；但是健康管理在很多情况下并不会让人感到愉悦，甚至是相反让人遭受罪。


    因此，健康管理企业要考虑的非常重要的一点，就是如何帮助用户战胜人性当中的弱点。


    创业者可以借鉴两种手段来帮助用户提高健康管理的参与感：


    +   一是运用实时及及时的行为数据，让用户获得及时反馈；


    +   二是将健康管理活动游戏化、社群化，利用人性的弱点极力推动它养成健康生活习惯的目的。


    # —— 用户问答 ——


    如果中国出现凯撒模式，我会有几个疑虑：第一，就算中国能把凯撒模式的结构建设起来，会有两个结果，要么形成类似传统保险行业的金字塔结构，船大难掉头，要么就是美国模仿凯撒模式的负面效果呈现。第二，医生团体的质量如何保证？所谓的名医都在大医院体制里，私人企业找来的医生值得信任吗？


    我的回答是：


    我们在那一期内容里也强调了，凯撒模式不好学，因为管理一个既庞大又复杂的系统是需要高超的管理水平的，不过我们强调的不是照搬凯撒模式，而是吸收消化其中的优点。


    我认为有三条：


    第一，凯撒模式强调对医疗保险的简化。


    预付一定的费用给医院经营的，医院就放手看病就是了，不纠结于每一单的报销费用，这样成本自然有降低的空间。


    第二，凯撒模式强调用户管理。


    让用户少生病，因为医生不靠每个病人赚钱，自然就愿意帮助病人省钱以建立自己的好口碑，这样健康管理就推动了。


    第三，病人少花钱。


    凯撒还能有降低保费的空间，然后还能把这个利益再让一部分给医生，形成自己的竞争优势，结果皆大欢喜。


    所以凯撒模式的核心：


    不是形成一个保险公司、医院、医生集团都从属于自己的巨大的公司结构，而是要形成医生愿意帮病人省钱、病人愿意配合、保险公司愿意把利益拿出来共享的一个多赢机制，核心就是以事前干预降低保险赔付。'
