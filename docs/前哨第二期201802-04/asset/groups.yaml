    - 2. 创业者要进入共享经济，就一定要建立自己的壁垒，最好是有足够高的技术壁垒，否则就要找到用户痛点，利用资本迅速形成规模壁垒。

    - 3. 共享经济会产生随机协作的可能性，每个人都是一家独立运转的企业，个人觉得没什么大不了的能力，可能对别人来说非常重要。


