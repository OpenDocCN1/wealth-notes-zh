    区块链的应用有哪些。


    我认为有两个应用值得大家关注：


    +   1. 加密猫游戏


    它是一个虚拟的宠物养成社区游戏。玩家在区块链上用以太坊购买虚拟的猫，让它们相互或者和别的家的猫进行繁殖，猫的基因基于一定的算法可以遗传到下一代，基因的组合和传递是不透明的，是不是稀有的品种，也都区块链控制的，这吸引着玩家花以太坊买猫和生小猫。


    这个游戏之所以精彩，就在于你要培养出名贵的猫来，其实际背后的算法既是标准的，没人能够篡改、没人能左右，同时又是很难预期的，也就是说你要看你自己的运气好不好的。


    +   2. 线上赌博


    由于它去中心化的特点，没有庄家能够操纵，结果完全不能造假，而且加密数字货币在交易的时候非常方便和隐蔽，与现有传统方法相比快速而又简单。从监管方面而言，用比特币进行在线赌博处于法律监管的灰色地带。


