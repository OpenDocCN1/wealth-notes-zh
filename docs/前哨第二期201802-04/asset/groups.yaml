    而 Oscar Health 恰恰戳中了美国医疗和传统医疗保险的这些痛点，主要有四个方面，我们可以一一来看。


    第一个方面，Oscar Health 开发了简单好用的 App，交互体验非常好。


    传统保险公司买保险通常有很厚的保险计划书，你要填家族史、疾病史，还要签保险合同。除了这些以外，赔付也很麻烦，你要填好表格，寄到保险公司，要是信息不足还可能导致拒付，总之整个过程是既复杂又低效。


