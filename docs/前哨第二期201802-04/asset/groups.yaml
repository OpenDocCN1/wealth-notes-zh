    \n当患者正在经历恐惧体验时，医生就可以在旁边提醒患者“恐惧”只是大脑中的一个想法，它并不是真实存在的，只要认清、理解并接受恐惧只是一个想法，就 可以“释之即去”，那么经历几次这种治疗之后，患者的恐惧感就会逐步减轻，以至于不复存在。\n\
    \n这里就不得不说说利用 VR 技术治疗的好处了。\n\n- 1. 这种疗法让患者本身不会过于焦虑，因为这并不是直接面对真实的恐怖事物，比现实生活环境安全得多，但又能更为接近现实；\n\
    - 2. 不需要花时间和金钱去实际的地点或者搭建场景；\n- 3. 治疗的过程可控，如果患者真的不高兴，医生就会马上停止；\n- 4. 当然，最重要的是，患者可以逐步接近自己恐惧的东西，慢慢消除恐惧感。\n\
    \n其实这项技术的生理基础，也是我们刚才提到的“认知行为疗法”。\n\n可见，针对某种特定的精神状态，或者精神障碍，尝试利用 VR/AR 等手段进行辅助治疗，也是科技公司值得关注和探索的机会。\n\
    \n当然，对于脑科学和心理学研究的进展也是需要密切关注的。\n\n## 三、线下社交互动的游戏 Pokemon Go\n\n然而，科技在给我们带来便利的同时，也让我们对技术的依赖日增增加。\n\
    \nMIT 社会学教授雪莉·特克尔在《群体性孤独》这本书中就认为，信息技术在给我们带来沟通便利的同时，也使人和人之间的关系弱化了。从形式上看，人们之间的联系似乎更轻松、更密切，但实际上却更焦虑、更孤单。\n\
    \nTED演讲视频链接：\nhttps://www.ted.com/talks/sherry_turkle_alone_toget her\n\n所以，从精神层面说，面对面交流是任何社交网络都无法替代的。那么，如何在互联网时代增进线下交流呢？\n\
    \n我们之前介绍过的2016年大热的 AR 游戏 Pokemon Go 就是很好的例子。\n\n- 首先，Pokemon Go 是一款基于 GPS 定位的\
    \ AR 游戏。也就是说，玩家不能窝在家 \n里，必须走到户外才能进行游戏，这样就增加了不同玩家之间碰面的概率。这种 设计满足了第一条“面对面交流”。\n\
    - 其次，Pokemon Go 是一款任务导向型的游戏。玩家需要走到指定地点去获得游戏 道具“精灵球”，并不断搜寻周围环境去寻找“精灵”。同时，被玩家捕捉的精灵，\
    \ 以及玩家的等级，都可以作为交谈的“社交货币”。\n- 最后，由于所有 Pokemon Go 玩家都有相同的目标，那就是去捕捉越来越多的 小精灵。玩家会不由自主地产生社群身份认同，提高归属感。积极走到外面去探索世\
    \ 界，和其他玩家进行有效沟通。\n\n## —— 今日内容小结 ——\n\n今天我们展望了精神健康领域的机会，希望你掌握以下三点：\n\n第一，积极利用科技手段帮助人类提前感知和干预负面的精神状态。比如，基于人\
