    # ——今日内容看点——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    - 1. 为什么说事前防护是保险行业的未来？

    - 2. 如何打造“随想随得”的新型保险？


    周一，我给你介绍了“保险科技”的概念，它的核心就是运用科技手段更好地获取、整理、分析数据，以此来降低保费，提高保险服务效率。


    互联网保险行业的发展趋势，是数据和科技驱动的，结合新的场景需求，提供能提前干预，而非被动的个性化的保险服务。


    那么今天我们就来分析一下，在当下“碎片化”的生活场景中，新兴互联网保险公司都有哪些机会？


    ## 一、“随想随得”的新型保险


    今天我先给你介绍一家公司，名字叫 Lemonade，中文意思是“柠檬汁”，这是美国的一家新型互联网保险机构，他们的产品很有特点，提供的是“随想随得”的新型保险，英义是
    On Demand。


    这个公司的名字非常接地气，因为在美国，柠檬汁随处可见，随要随有。取名为 Lemonade，就说明这家公司希望提供的保险服务就像购买柠檬汁一样，廉价、方便、还不用担心质量问题。


    在 Lemonade 的 App 上，你可以为家里任何你在意的东西投保，比如冰箱、洗衣机、电视、电脑、家具等，通常只需90秒就能完成投保流程，3分钟完成赔付，而且价格低廉。


    假如你是一名房东，你担心房子里的东西可能丢失，那么你就能买一份保险，一般是一个月25美元起，而如果你是租客，保险还会更便宜，每月是5美元起。


    举个例子：


    > 比如你刚买了台新电脑，然后就能上 Lemonade App 快速购买一份电脑保险，保费是一个月5美元。第二天你和朋友去逛街，晚上回家后发现你家进了小偷，新电脑被偷了。这时候你只需要打开
    Lemonade App 说明情况，3分钟之内赔付金就能到账了，这就体现了“随想随得”，On Demand 的特点。


    ## 二、Lemonade 的商业模式


    Lemonade 是 2015年4月成立的，到目前融资总额已经达到了1.2亿美元，其中就有软银和红杉资本的投资。


    根据英国 Insurancetimes 网站报道：


    > 截至2017年6月1日，Lemonade 已经售出了14000多份保险，销售额大概是290万美元。


    可以说，发展的势头还是很不错的。


    下面我们就从 Lemonade 的创始人团队、产品、资金运作和公司架构四个方面来分析一下 Lemonade。


    - 1. “双长制”创始人组合


    首先介绍一下 Lemonade 的两位创始人，他们分别是 Daniel Schreiber 和 Shai Wininger，这两个人都是连续创业者。


    - Daniel 在职业生涯早期是一名律师，擅长高科技企业的并购；

    Shai 在创立 Lemonade 之前是 Fiverr 的联合创始人。


    顺便说一下：


    Fiverr 是目前全世界最大的创意与项目的交易市场，是自由职业者的聚集地之一。网站上所提出的项目往往都是5美元的简单事情，因此取名为 Fiverr。


    除了这两位创始人之外，Lemonade 还把杜克大学的行为科学家 Dan Ariely 教授聘了过来，这位 Dan Ariely 就是《怪诞行为学》的作者丹·艾瑞里，是现在全球行为经济学专家里年轻一代的代表。


    《怪诞行为学》我们也介绍过，是行为经济学的顶级畅销书，直译过来应该叫《可预测的非理性》，书名这句话其实就是对人类行为特点的精辟总结。


    Dan Ariely 被聘为 Lemonade 的首席行为官，英文是 Chief Behavioral Officer，专门负责 Lemonade 的产品设计。


    你可能会好奇，为什么保险公司要设立这么个职位呢？


    通过前几天的内容...


    - 2. 简单、易用、高效的产品


    下面我们来看看 Lemonade 是如何利用科技提高效率并提升用户体验的。


    Lemonade 的产品最突出的特点就是“及时性”和“快速理赔”。他们运用自主设计的 App 和聊天机器人，让用户无论何时何地，都能通过简单的选择和信息输入生成保单，让客户能方便、自由地购买保险产品。


    - 3. Lemonade 的资金运作方式


    周一的时候我们就讲过，传统的保险公司用客户保费作为资金池来投资运作，进行“钱生钱”，这是他们主要的利润来源。


    而 Lemonade 的保险资金运作方式又有什么差别呢？


    首先，Lemonade 会把客户的保费分成三个部分，分别是20%、40%、40%。


    具体来说，就是每一笔保费的20%由 Lemonade 提取，作为运营开支，用来覆盖公司的日常运营和人员开销。


    余下的80%分为两个40%，其中一个40%用来购买再保险。


    所谓“再保险”也叫做“分保”，就是：


    > 保险公司会在原保险合同的基础上，通过和其他的大型保险机构签订分保合同，把自己自保的部分风险和责任进行打包，向这些大型机构购买保险，说白了就是把自己承担的风险转移给大型的保险机构，目的就是降低大额理赔的损失。


    目前，Lemonade 已经和三家大型机构完成了合作协议，它们分别是：Lloyd’s of London，也就是伦敦劳合社；XL Catlin，信利保险；以及伯克希尔·哈撒韦旗下的
    National Indemnity。


    National Indemnity。


    那最后的40%，则会放入正常的理赔资金池，当客户的保险到期时，理赔资金池中剩余的这些钱就会按照客户的意愿捐赠给慈善和福利机构。


    因为 Lemonade 已经从客户的保费中抽取出20%作为运营开支，所以只要他们的运作成本能降低，那么降低的部分就是纯利润了。


    ## 4. Lemonade 的公司架构


    上面我们说完了 Lemonade 的创始人、产品和资金运作模式，那最后我们稍微讲一下 Lemonade 的公司架构。


    其实 Lemonade 还成立了两家子公司：


    - 一家子公司收取投保人20%的保费作为收入，并提供所有的技术服务；

    另一家子公司则处理再保险、普通理赔和慈善捐款。


    这种架构可以把运营资本锁定在第一个子公司，而把风险锁定在另一个子公司。这样两个子公司业务模式很清晰，更有利于获得融资。


    总结一下：


    Lemonade 提供的保险产品突出了即时可得性。通过和大型保险公司合作，并把科技运用到整个产品周期中，从而让客户对保险产品拥有了“随想、随买、随得”的快捷体验。


    与此同时，由创业经验丰富的创始人，以及知名行业专家组成的团队，这种人员结构非常符合我们所说的“双长制”模式，利用各自的长板合作，成功几率更大。


    ## 三、从“事后理赔”到“事前防护”


    最后，我再跟大家分享一个我的亲身经历。


    我曾经在高速公路上因为疲劳驾驶，跟一辆大卡车追尾，当时撞得非常严重，幸运的是，我本人并无大碍。当我的车被拉到修车厂的时候，师傅说：如果只看到车，没看到你人的话，我一定认为你已经遭遇不幸了。


    所以，当时我就想，车险能否有提前干预的服务环节，降低过程中的风险呢，能不能把出事的概率尽可能地降低呢？


    目前不论是互联网保险产品还是传统保险产品，基本上都是“事后理赔”。也就是说，只有当事情发生了，保险公司才会想着怎么为客户提供服务。


    但是，在周二的内容里，我们介绍了医疗保险公司 Oscar Health，它把更多关注放在了会员的健康管理上，针对每个人的具体表现来降低保费。这样就通过经济手段驱使客户重视日常健康管理，从而降低了长期费用。


    我们在“银发经济”的内容里提到的 Clover Health，也是在保险周期内对投保人进行定时检查，提前采取防护措施，从而降低了理赔率。


    新兴的互联网保险公司，一定要看准这一点，因为未来，这种的模式一定会推广到其他保险产品中，如果你率先进行了思考、采取了行动，就会获得更大的成功率。


    而且，我认为，未来的车险，也一定要从“事后理赔”向“事前干预”进行转变。


    比如说，根据司机的驾驶数据，提前进行预警操作，从而降低风险等等。我们之前也介绍过考驾照没考过紧急事故处理，这样很多人其实是潜在的隐形的马路杀手，但是也许将来能从人们的驾驶行为规律中，找到谁的紧急事故处理可能有问题，从而可以提前纠正，降低事故率。


    而且，这种转变至少能带来以下两个好处：


    - 第一，保险公司的全程参与，与客户互动频率增加，一定能提升客户对保险公司的信任感；

    第二，通过及时的数据收集，也可以更加完善精算模型，节约运营和理赔金额，提升服务质量。


    # —— 今日内容小结 ——


    今天我们介绍了互联网保险公司 Lemonade 提供的创新的保险产品，以及我对“事前防护”的理解，希望你能掌握以下三点：


    - 第一，总的来说，互联网保险行业的发展趋势是数据和科技驱动，结合新的“碎片化”生活场景需求，提供能全程主动参与，而非被动服务的个性化服务。

    第二，Lemonade 公司通过运用保险科技，提供了“随想、随买、随得”的保险产品。并在商业运营模式上进行了探索创新，其中，将丰富商业经验的创始人团队和行为领域的行业专家结合，符合我们强调过的“双长制”模型。

    第三，互联网保险行业的未来一定将从“事后保险”走向“事前防护”。通过数据和科技手段，在事故发生之前就进行有效防护，这样可以极大地降低保险公司的理赔率，总体上降低整个社会的保险费用。其实，对于每个人来说，因为事故被避免了，我们也会生活得更幸福。


    # —— 今日思考题 ——


    结合实际情况，你认为互联网保险还将有哪些创新的机会呢？


    欢迎在留言区分享你的想法，我们共同交流。


    # 划重点


    1.互联网保险行业的发展趋势，是利用数据与科技，结合新的场景需求，为客户提供主动的个性化服务。

    2.未来的保险，大多会从“事后理赔”向“事前干预”进行转变，新兴的互联网保险公司如果能率先进行了思考、采取了行动，就会获得更大的成功率。

    3.在事故发生之前就进行有效防护，可以极大地降低保险公司的理赔率，总体上降低整个社会的保险费用。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我明天见。


    # 177 | 无人驾驶出事故，保险怎么算？


    # ——◆ 全周总结 ◆——


    本周的话题是互联网保险，我们介绍了三个重点：


    第一，传统大保险公司一直存在准入门槛高、赔付周期长、保单复杂、信息严重不对称等等诸多的弊端。造成这种局面的原因是，传统保险公司基本都是金字塔式的组织结构，总部需要根据人口的相关数据进行保险精算、设计产品，然后一层层下发到最前段的保险代理人来进行销售。发生事故以后，保险公司又需要层层审核，然后再赔付。随着互联网时代的到来，传统保险公司越发显得脱离时代。


    第二，互联网保险具有产品海量、碎片化、低单价的特点，这些特点是传统公司架构下很难满足的。科技初创公司正在通过积累细分领域数据，将原来的劣势转化为优势。随着保险加快和科技的融合，大数据、区块链、人脸识别、云计算平台、物联网等等正在逐渐渗透到保险的各个环节里。保险科技的全面应用，使得普通人享受保险服务的门槛大幅降低，并且推动更多的基于大数据的个性化保险品类出现。


    第三，互联网保险行业的未来一定将从“事后保险”走向“事前防护”。通过数据和科技手段，在事故发生之前就进行有效防护，这样可以极大地降低保险公司的理赔率，总体上降低整个社会的保险费用。


    # ——◆ 用户问答 ◆——


    针对目前 Uber 无人驾驶撞死行人的安全事故，您对未来无人驾驶保险怎么看？由 Uber 承担还是由车辆制造者，或许设备提供者，或者保险公司一起承担呢？现在英伟达已经暂停了全球无人驾驶的测试，是技术设备出现问题还是法律以及相关配套设施要及时跟上才能重新启动，这是否会大
    Hedging 无人驾驶的应用时间？


    我的回答是：


    这是个好问题，随着技术的进步和技术带来的应用的变化，相关的保险和监管都会变化。


    驶汽车的销售，而主要是用在3级或以下，所以更多是用在辅助驾驶的车上。


    但是，自动驾驶已经成了大趋势，我们原来就说过，今年稍微高端点的车一定有辅助驾驶。什么低速跟车、高速路上的自动驾驶、停车入位，这些功能一定要有。


    所以，车里必然有 GPU，而且这一些的需求是早就定下来的，所以今年 Nvidia 的销量肯定没影响。如果要影响 Nvidia 的未来销量，除非这次自动驾驶实验停1年以上，而且即使要停了，那也是未来的事，其实股市根本看不了那么远，所以股市今天的大跌，我认为是没有道理的。


    那么，我的观点就很明显了，继续挺 Nvidia，它们还是很被看好。


    王老师对于上周五湾区特斯拉 Model X 在事故中起火，并且用了很长时间清理现场有什么看法？据说电动车一旦起火就很难扑灭，而且这次还有特斯拉的工程师参与灭火。这次事件对于后电车的发展会有影响吗？


    我的回答是：


    最近事情实在是多，不过确实，电池一旦起火就很难扑灭，这是现在电动车的一大问题。


    但是我对攻破这个问题还是比较乐观的，因为不一定需要从电池的机理上去解决，就是不一定需要把现有锂电池的结构都给换掉，可能加强每一颗18650电池外包装的阻燃性就行。


    我们以前也都介绍过，看起来整个特斯拉的车的底盘是一块电池，但实际上里面是由7000颗18650电池，也就是我们俗称的5号电池差不多大的那种电池，一个一个圆柱体垒在一起堆出来的。


    那么如果每一颗电池外包装加强了阻燃性，是不是就能解决了呢？


    我不是这方面的技术专家，不一定我说的就算数。但我认为，这个是个工程问题，并不是从原理上无解的问题，所以一般来说，随着市场的进步，都很容易解决掉的。


    顺便说：


    虽然 Nvidia 是无辜受连累，很快会反弹，但是我认为特斯拉则未必。


    特斯拉一贯喜欢冒险，这次如果因为 Uber 的事故造成了政策的收紧，对特斯拉是个真正的利空，因为它以前宣传的自动驾驶的优势就不存在了。


    当然，特斯拉现在最大的问题是 Model 3 的量产，我从可靠的渠道知道，现在特斯拉内部所有人的精力都放在保证实现量产上去了，但是难度依然很大，因为特斯拉的市值虽然超过了通用和福特，但是销量差得很远。


    之所以有那么高的市值，就是因为大家预期他们的增长潜力很大，也就是说他们的销量要迅速增长上来，如果做不到，股价是有大跌的危险的。


    个性化的保险服务都需要个性化的个人信息，这些信息在不同的维度上刻画了客户的风险，但是直接给出详细信息让保险公司来评估其风险面临着隐私曝光的问题。有没有解决隐私问题和精准服务之间的矛盾的好做法？


    我的回答是：


    其实专业机构一直都知道你的隐私，你去医院看病，医生不就知道你相关的隐私了吗？


    如果你要去找保险公司，当然要把相关的隐私告诉保险公司。


    所以，核心不是不给任何人你的信息，而是你给出的信息只能用于特定用途，而且不允许二次扩散，不允许用到别的用途上。


    要做到这一点，需要对泄露隐私的机构实行重罚。据说这次 Facebook 可能面临重罚，这个对整个社会的发展是好事。


    以上就是本周的问答。


    # —— 下周预告 ——


    我们下周的话题是健康管理。


    中医里有句老话，叫做“上医治未病”，通俗点来说，就是帮助人们保持良好的生活习惯，减少患病的风险。可是到了今天，我们反而丢了这个优良传统，平时不注意调理，等到身体不灵的时候才去医院，往往已经是大病了。


    道理大家都懂，但是我们总是管不住自己，明知道这是慢性自杀，却老是想吃垃圾食品，想抽烟、喝酒、熬夜。


    有没有什么办法能够帮助我们对抗天性，有效地管理自己的健康呢？


    欢迎大家关注。


    # 划重点


    - 1. 新科技的监管是需要超前的，因为一旦出了事故，不仅造成损失，更重要的是，会影响新技术的信用，导致科技造福大众的整体时间被大大延迟。

    - 2. 美国的教程科技公司基本上都离不开中国，特朗普的贸易战导致股票大跌，这对中国是个好消息，因为特普不会故意被指责把经济搞砸了。

    - 3. 保护隐私的核心，不是不给任何人信息，而是给出的信息只能用于特定用途，不允许二次扩散，不允许用到别的用途上。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，咱们下周见。


    # 5. 中国让美国老百姓受益


    所以，我们认为特朗普其实是借助大众情绪混淆了事实。


    因为特朗普现在主要说的是美国似乎在全世界都吃了亏了，他不光说中国，他也说了日本、也说了韩国、也说了欧洲，甚至说了他的邻居墨西哥和加拿大，因为他认为这些国家很多的关税收的都比美国的关税高，美国的关税反倒是最低的。


    他举个例子：


    - 中国的车如果要出口到美国，美国人收2%的关税，但是美国的车出口到中国，中国人收25%的关税。


    当然了，其实中国的车出口到美国也不太容易，还有很多其他的限制，比如说我们都知道美国人是如何限制华为的，按理说那也不是关税的问题，但是我们就说明一点，其实美国的非贸易壁垒也是存在的。


    其实在过去的中美贸易当中，美国的跨国企业是获益的。因为其实是他们把制造部分放到了其他国家，那这些国家制造完了以后再利用美国的低关税，再把产品返销回美国，其实整个布局里面都是美国跨国企业在赚钱，而不是那些帮助美国加工的企业赚了大头。


    # 6. 重新理解中国的全球化机会


    当然，在相对中国能够给美国带来福利的低端产品上，不制裁不意味着都不制裁，所以特朗普的政策是制裁中国的科技产业。


    这种时候我们就会发现，其实今天的中国已经有足够的实力去推动全球科技创新的发展了，为什么呢？


    # 7. 欢迎你来“2018前哨大会”


    所以，这也是我决定每年4月都办我的个人年度演讲大会的原因，我会对这一年的全球的科技创新趋势，以及对社会的影响做系统和完整的梳理，告诉大家在全球科技视野当中，中国企业该如何转型升级，中国企业该如何更好地全球化。


    4月22日，欢迎你来深圳参加2018年前哨大会。


