    上有本质的不同。


    Zipcar 像是所谓的工业产品，车都是一样的，提供的是统一标准的服务和体验；


    Buzzcar 则代表了群体生产，它的特点是多样化和个性化，每辆车都不同。


    但是，这也意味着很有可能会出现特别糟糕的体验，比如车被弄坏等等。其中一种解决方案就是引入用户评分机制，好像现在大众点评上的顾客和商家互评。


    突破了这两个挑战以后，Buzzcar 交出了一张漂亮的成绩单。2015年，在被欧洲最大的 P2P 汽车共享公司收购之前，Buzzcar 已经成为拥有超过10万注册用户和7000多个汽车分享者的平台。


    # 三、共享经济的三种组织形式


    这个问题，蔡斯可以说是万有发言权的创业者了。


    2015年，蔡斯出版了一本书，名叫《共享经济：重构未来商业新模式（Peers Inc: How People and Platforms Are Inventing）》，她在书中谈到了自己对共享经济的理解，以及这些年来创业心得。


    昨天我们已经提到了她总结的共享经济三要素，今天说说她总结的共享经济的三种组织形式：


    第一种叫切割(Slice)，像 Zipcar 或共享单车，把拥有单车变成切割它的使用权，从而优化利用效率；


    第二种叫聚集（Aggregate），指的是在平台上聚集闲置资源，然后进行重新分配和利用。最典型的就是 Airbnb。Airbnb 大家也比较熟悉了，它的模式就是把闲置的房间再利用；


    第三种形式叫开源，也就是所有资源由大众贡献，并且免费使用。这种模式通常会创造新的价值。比如，从全球最大的代码托管平台 Github 这里，诞生了很多基于开源代码生产软件，其中就包括我们每天都在使用的
    Windows 系统、iOS 系统，明天我们将会详细讲解 Github。


    总之，目前绝大多数共享经济企业，基本上都逃不开切割、聚集和开源这三种组织形式。


    # —— 今日内容小结 ——


    今天我们主要介绍了共享经济先驱 Robin Chase（罗宾·蔡斯）和她创建的共享经济公司。我们了解了它们的发展经历和特点，也介绍了蔡斯眼中的共享经济的理论体系。


    希望通过今天的学习，你能得到以下三点：


    第一，共享经济的价值已经得到了认可，随着它的深入发展，对闲置资源的利用会深入到各个领域，并且越来越高效。但同时，也会有越来越多的问题暴露出来，等待创业者去解决。就像蔡斯创立
    Zipcar 的时候，只是满足了客户分时租赁的需求，而创立 Buzzcar 时考虑的问题就多得多 了，包括信用问题、法律法规问题等等。


    第二，很多新的商业模式，或多或少都对现有既得利益者和陈旧的规则体系形成冲击。比如，蔡斯创立的 Buzzcar 不能在美国合法运营，Uber 也遭遇过不少法律层面的监管。但是共享经济是大势所趋，随着越来越多的人对它持开放态度，旧的规则体系必然要作出妥协和改变。


    第三，共享经济得以实现，离不开技术的支持。射频识别收发器、移动技术、无线网络等当时非常先进的技术，让 Zipcar 的共享概念走向现实。未来共享经济企业依然离不开技术的支持，甚至随着细分市场的出现，技术的门槛会越来越高。


    # —— 今日思考题 ——


    你都体验过哪些有意思的共享经济服务呢？它属于共享经济三种组织形式中的哪一种呢？有什么特点呢？


    欢迎在留言区分享你的观点。


    # 划重点


    共享经济的三种组织形式：

    （1）切割，把拥有权切割为使用权，从而优化利用效率；

    （2）聚集，在平台上聚集闲置资源，然后进行重新分配和利用。

    （3）开源：所有资源由大众贡献，并且免费使用。


    王煜全


