    # 135 | 特别放送：把握社会变革中的机会


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    +   1. 为什么说用了科技不一定赢，但不用科技一定会输？

    2. 科技带来的社会变革有哪些？如何抓住其中的机会？


    我们昨天介绍了几个重要的科技趋势，今天给大家介绍科技带来的社会变革。


    其实对传统领域的企业来说，科技不是直接的机会，科技带来的社会变革，才是你能把握的最大机会。


    就像我们老拿军事打比方：科技是企业家的武器，武器不是你的机会，利用武器打赢战争才是你的机会。


    下面我们就来看看这几个科技带来的社会变革有哪些。


    # 一、科技军备竞赛


    第一个最明显的社会变革是，我们正在进入科技军备竞赛的时代。


    这个时代的特点是：用了科技不一定赢，但不用科技一定会输。


    首先，科技推动社会变革在加速。


    1973年到1983年间，财富1000强企业换了350家，而2003年到2013年这10年间，财富1000强企业换了712家。所以你看到，现在这些领先的企业往往并不能在领先的位置上呆多久，很快就会被新兴的企业顶替掉，虽然说这些企业未必会破产消失，但是它的规模已经不能排到前面了，而那些新兴的企业，往往优势更加巨大。


    其次，就是各个企业接受先进科技的速度都在加快。


    我在今年CES展的观感当中就专门提到过，即使是一些老牌的企业，它们引入先进科技的速度都越来越快。一个概念刚开始流行，各家企业都已经纷纷开始运用了。


    最后，同样运用先进科技，能否把科技的优势发挥出来，才会决定你的成败。


    因为仅仅是运用，并不能保证你能成功。这方面最经典的例子其实还是诺基亚，虽然它在手机领域曾非常领先，而且从硬件的角度看，并不输于同时代的其他的手机，但是就是由于开放性不够，不能把手机这个科技的优势真正发挥出来，结果就导致了后来的败局。


    从第一个社会变革，我们引申出你的机会是：


    你可以成为你的领域里第一个引入先进科技的人，这样你就有机会成为你们行业的革命者，甚至利用科技的优势成为你的行业的新的霸主。


    同样，你需要变革的经营理念是：


    很多企业认为我来自传统产业，科技和我无关，这种观念必须要抛弃。


    # 二、紧密的远程社会协作


    第二个社会变革，就是越来越多地出现紧密的远程社会协作的组织。


    首先，互联网带来了远程办公，这个我们以前也讲过，叫做telecommuting。就是说因为有了互联网，我们不需要经常去办公室了，在家里上网就可以解决办公室需要的所有问题。那久而久之，一方面企业往往工位数大大地少于员工的数目，因为从来没有一个时间所有的员工会一起上班，所以没有必要设置那么多工位。而从员工的角度讲，习惯了远程办公以后，就未必会再甘愿当企业的一个部门了，尤其是优秀的人才，就会选择从大企业当中独立出来，本来是大企业当中的一个功能部门，现在干脆独立成了一个独立的公司，它可以作为外部顾问继续为大企业服务，但它同时可以服务更多的客户，那当然这些优秀人才就会更加兴了。


    那有了这样大量的独立的作为第三方提供服务的机构，那我们之前也介绍过，现在的全球创新的格局是由小企业主导的，这些主导创新的小企业正好需要和这些其他的作为第三方能够提供服务的长板结合，强强联手形成新的木桶，形成新的协作体，这样就进一步推动了全球创新的加速。


    这个社会变革背后，你的机会就是：


    你应该把自己变成业内人士，就是在任何一个领域，你都混到这个领域里面牛人聚集的社区里和那些牛人打成一片，找到最好的合作，你也可能锻造你自己的强大的新的木桶，找到新的市场机会。


    那你需要变革的经营理念是：


    单打独斗和把所有都放在企业内部的超大型企业的时代都结束了。要学会生态型的合作，尤其是中国有很多第一代的企业家，他们习惯了碰到新的科技也欢迎，但是什么都是自筹部门来完成。


    比如说我就和几个企业家聊过这个问题，我问他们，你们是不是认同人工智能的时代来了，企业应该迅速地引入人工智能这项技术。他们都认同，但是他们的做法是在企业内部建立人工智能部门。


    我们都知道，人工智能的牛人很难为非人工智能的企业服务，因为他们不容易被理解，所以他们宁可在人工智能的创业企业里面或者在人工智能的专门的研究机构里面服务，因为互相之间都是牛人，可以切磋。


    那么这样就造成了一个问题，如果一个大企业想要自建人工智能部门，基本上可以说，它不能招到业内的顶尖高手，这就不符合我们说的强强联手的原则，甚至会带来更严重的结果，就是一个大企业招收了一个人，他并不是人工智能领域的顶尖高手，那么他甚至会想设法避免你和业内的顶尖高手接触，因为要不然不就显出他的水平不够了嘛。


    这样就变成了武大郎开店的局面，明明你是想引入这个领域的最先进专家，结果造成的局面是，你引入的人会让你看不到最先进专家，当然得不到最好的合作。


    所以，我认为国内的企业一定要抛弃掉什么都是自己做的这样的心态，就是任何的合作都想把别人变成自己的雇员是不可取的，最好是和业内的最牛的高手来合作，只有长的板和最长的板合作，你的木桶才足够大。


    # 三、娱乐创意产业


    第三个变革，是娱乐创意产业的崛起。


    这个也很容理解，首先人工智能、机器人等技术接管了人类的可重复的工作，这样就使得人类的创造力更加充分地释放出来。而同时技术的平台化，包括互联网的平台化和社会的大分工合作，使得创意产业能够迅速上规模。


    我们说，过去莎士比亚演一个剧，可能只有几百人能够看到，他要一个一个剧地去演，他能影响的人的数量是非常有限的，但是现在创意产业有了新的全球化的大平台，所以造成它的市场规模迅速地扩大了。


    同样，创意产业的延伸价值也巨大，所以我们会看到一部《哈利·波特》就能成就一个英国首富，而一个《星球大战》甚至能造出一个产业帝国来，也就是说，星球大战不光有电影，还有主题公园，还有各种各样的玩具，实际上它已经成了一个生态系统了。


    从这个角度看，你的机会是：


    第一，学会利用科技为创意产业服务。就像我们一直倡导的，人工智能的一个主攻方向应该是文娱产业，我们把它叫做智能文娱，因为文娱产业往往最喜欢引入先进科技。第二，这也是我们看到的一个全球性的现象，就是连锁的休闲娱乐业在迅速地兴起，不管是像攀岩、蹦床还是像iFly那样的，就是让人在一个封闭环境当中像在空中跳伞一样，漂浮在空中的这样的设施，都出现了大量地连锁化迅速扩张的这样的态势。


    那你需要变革的经营理念则是：


    传统的思路认为创意不是产业、不是工业，而是一个艺术，但是实际上创意就是'
  - '[PAGE 1]


    业，而是一个艺术，但是实际上创意就是一个产业，甚至是一个产业生态，它需要各部分的紧密合作，它需要更加系统化的经营管理。


    # 四、更加独立的个体


    第四个变革，叫做更加独立的个体。


    首先就是创意的价值凸显出来了，而创意是有大量的偶然性的，尤其一个创意甚至会塑造一个产业，而创意的偶然性就会塑造随机的超级个体，我们不能否定任何一个人的价值。就像在写出《哈利·波特》之前，J.K.罗琳其实是一个领救济的单亲妈妈，但是《哈利·波特》体现了她的价值，我们不能否认任何一个领救济的人，因为也许他就是下一个J.K.罗琳。


    同样，因为有了超级城市化：


    +   一方面，超级城市化使得人口大量聚集，是对创意的满足，因为我们提到过群体加速的创新，当你在一个创意满满的社群当中，你的创意也更容易涌现出来；

    另一方而，超级城市也是对独立个体更好的支持，也就是说，可能在农村，一个像J.K.罗琳这样的领救济的人很难生存，但是在城市里，她生存的可能性就大大增加了。


    那么这样带来的结果是什么呢？

    就是整个社会对每一个个体会越来越宽容，所以我们看到，在全球的角度上来讲话，对每一个个体来讲，不光是对女性越来越尊重，同时甚至会出现对变性也是尊重的，对同性恋也越来越尊重。


    那么你的机会是什么呢？

    就是，你可以为亚文化个体提供个性化的服务。


    比如说有很多人是不愿长大的年轻人，比如说有很多人年轻醉心于二次元文化，就是沉迷在漫画之中，其实也是一种不愿长大的象征，有很多人喜欢玩Cosplay，其实类似这样的亚文化非常多，它都需要专门的服务来为它提供。


    你需要变革的经营理念：

    就是不要再有所谓的正统观念了，认为消费者应该怎么怎么样，男人就该如何如何，女人就该如何，而要了解消费者的实际情况。


    国外有一本专门写美国的青少年的书，经过了很系统研究之后，发现基本没法整理出来一句话对青少年作概括，不像以前一说50后什么特点，60后什么特点，70后什么特点，现在到了90后、00后发现总也出不这样的特点，所以最后那本书的题目只好叫做《It''s
    Complicated》，就是“这很复杂”，其实复杂正是现在年轻一代的特点。


    # 五、品味升级


    第五个变革，是从消费升级到品味升级。


    我们都知道消费升级现在是一个热词，因为科技，因为企业经营，因为社会发展带来了社会的富裕程度增加，社会富裕了，消费必然会升级。但是物质的满足，其实必然会带来对精神的追求，而且精神追求后面是对身份的认同。


    英伦才子艾伦德波顿有本书叫做《身份的焦虑》，写得很精彩，就是人一直会不断地去追求身份认同，这种时候消费行为就会成为新的身份标识，你消费为什么，往往代表了你的价值ugo和你的价值取向。那么这种时候，商品背后的价值认同变成了用户选择一个商品的真正原因，而不是这个商品的使用性能。


    这方面你会看到，一个最典型的例子，就是世界各国当它的经济发达、经济的增速提升的时候，都会出现一个进口红酒销量飙升的阶段，这里的进口红酒主要指的是进口的法国红酒，因为我们都知道，法国红酒代表着品位，所以世界各国当它的物质水平达到一定地步的时候，对法国红酒的需求都有一个增长的阶段。


    中国其实也是如此，所以我曾经投资过中国最大的红酒教育机构，也是得益于中国的红酒销量的增长，尤其是进口红酒销量增长，当然需要对进口红酒的了解，所以它的教育也发展得很好。


    当然，另外一个就是各种小众运动的兴起，我们知道很多大众运动是属于相对比较贫困的人群的，比如说像篮球，在美国基本上还是穷人运动，但是小众运动因为需要特殊装备，而且相对更贵一些，所以往往属于富裕程度比较高的人，这一点在中国也会得到很大的发展。


    你的机会，就是：

    要从精神出发，去思考如何增加你的产品的内在价值，你的产品就有更大的发展机会。


    你需要变革的经营理念是：

    要抛弃掉以前的薄利多销，关注产品本身的性价比，也就是说关注本身这样的观念，而要更多地去关注产品的象征意义，关注产品背后的精神价值。


    # 六、更加平等的全球化


    第六个变革，就是更加平等的全球化。


    我们都知道，现在美国总统川普反对全球化，但是其实他反对全球化并不是全球化的问题，他反对的其实是过去欧美的大企业的主导。这种跨国企业的垄断是全球化的问题，因为这些大企业的全球化，是把全球化的利润全部留到了自己内部，而其他参与全球化的各方并没有享受到全球化的好处。


    但是现在大企业受到了小企业创新的严重挑战，而小企业创新不再是那种跨国的垄断式的内生的大企业，它构建的更是一种生态合作的模式，这种模式是更加平等的，利益是更加共享的。


    那么中国也有机会成为更加共享更加平等的全球化的一部分，所以你的机会就是参与到小企业科技创新的浪潮之中，顺势建立你自己的全球化布局，这样全球都成为你的市场，你的发展机会就会会大很多。


    你需要变革的经营理念是，不能有过去的进口替代的老观念了，因为现在全球的科技的扩散也随着全球的一体化而变得越来越迅速，你要掌握的是全球的科技资源，因为如果没有掌握全球资源，好不容易进口替代了，新的科技又进到中国来了。


    那么掌握全球资源的一个最经典的例子，我们以前也介绍过，就是加州大学伯克利分校的张翔教授搞出来的超薄透镜的技术，13层的超薄透镜叠加到一起，它的厚度才相当于现在的iPhone手机的厚度，但是它的效果是长焦相机的效果。


    但是这样的先进专利，最后被三星拿到了，我们都知道其中中国的手机企业也具备同样的实力了，不管是小米还是华为，其实如果它们知道这个专利都可能和三星产生竞争，鹿死谁手还未可知，但是很可惜，三星的全球化的科技资源的掌握明显要优于小米和华为，所以最后它拿到了，那这样就要求未来的企业更加从全球化的角度去思考，也从全球化的角度去行动，对全球的科技资源都要有掌握，也要建立自己的全球的市场能力。


    # —— 今日内容小结 ——


    总结一下，今天我们主要讲了三点：

    第一，对传统领域的企业来说，科技不是直接的机会，科技带来的社会变革才是你能把握的最大机会。

    第二，科技推动的社会变革有六个相对明显的变革，科技军备竞赛、紧密的远程社会协作、娱乐创意产业、更加独立的个体、品位升级和更加平等的全球化。

    第三，这六个变革既可以成为企业的新机会，也可以是企业改变经营理念的基础。


    # —— 今日思考题 ——


    你还看到了哪些科技带来的社会变革？它们意味着怎么样的机会？意味着未来我们需要作出什么样的改变？

    欢迎在留言区分享你的观点。


    划重点

    1.对传统领域的企业来说，科技不是直接的机会，科技带来的社会变革，才是你能把握的最大机会。

    2.把自己变成业内人士，就是在任何一个领域，都混到和这个领域的牛人打成一片。找最好的人合作，才可能塑造出更为强大的新的木桶，找到新的市场机会。'
