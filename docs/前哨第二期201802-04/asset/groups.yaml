    3. 同一个领域的公司如何实现差异化运营？


    # ——◆ 全周总结 ◆——


    本周的话题是共享经济，我们一共介绍了三个重点：


    第一，共享经济目前不论从技术层面还是从宏观环境的层面来看，都具备了爆发的可能。未来，人们会越来越习惯于拥有 Biotechnology的使用权，而不是拥有一个物品。而共享经济得以实施离不开三大条件：产能过剩、共享平台、人人参与。


    第二，共享经济得以实现，离不开技术的支持。就像 Uber 和滴滴出行成功的背后是手机地图与移动支付的普及，在未来，共享经济企业依然离不开技术的支持，甚至随着细分市场的出现，技术的门槛会越来越高。


    第三，创业者要杀入共享经济，一定638要建立自己的壁垒。要么建立足够高的技术壁垒，要么充分借助资本的力量迅速积累用户形成规模优势。


    # ——◆ 用户答疑 ◆——


    现在的共享经济似乎没有带来自发的去中心化的交流，也没有什么自发参与的感觉，比如共享单车并不是人们自发地去分享给别人，更像是传统的租赁。共享经济将来如何发展呢？会对方交流、协作带来什么认知层面的改变呢？


    我的回答是：这是一个好问题，现在很多共享经济业务模式本身就不是由社会中的提供者来提供的，而是由平台统一提供的，比如共享单车，包括自汽车也都是自己的汽车。


    很多专家认为，共享经济业务模式应当分为两大类：一类是 P2P，这类提供者，也是社会当中的大众；另一类是分时租赁，其实提供者往往可以是集中的，统一的。


    在 P2P 这样的共享模式里，如何使提供者找到自发参与的感觉则是相当关键的。比如 Airbnb 就会鼓励房屋提供者给自己的房子拍照，晒出自己房子的特色，以吸引租客。但是在具体操作当中，他们就发现，房主拍照不专业，不能把房子的吸引力更好地表达出来，所以他们还得自己雇佣专业的摄影师去给房子拍照。可.xxx


    第一是看领域：随着城市化的进程，这会造成没有地方放置闲置物品了，大家环保意识的加强，因为这样只使用不拥有肯定是更加环保的，大家都会接受这一点，那么相对大件，共享更环保的东西就更容易共享。


    第二是从模式角度看：共享平台的设计将会更加人性，既保障使用，又能促进参与的积极性，还能顺便社交，一举三得。


    有些人认为共享经济正在摧毁工业阶层，比如《经济奇点：共享经济、创造性破坏与未来社会》这本书就认为，Uber、TaskPabbit 等公司声称它们能够将“自由的劳动力”变成“独立承包商”，或者“自己的老板”，但实际上，这些工人都被迫去做了一些特别琐碎的工作，被迫成为“兼职工”“永久临时工”，然后从这些公司丰厚的利润当中赚取一点儿微薄的薪水。经济地位每况日下，社会保障日渐薄弱。王老师怎么看待这个问题？


    我的回答是：其实这是社会发展的大趋势，美国新增就业的50%都属于自我雇佣，也就是未来有越来越多的人会选择成为自己的老板。在这个趋势下，一些竞争力量比较缺乏的人就只好干琐碎的工作了，经济地位下降，但这不代表全部。就像只要有市场经济就会有企业倒闭，但是你不能指责市场经济造成了大量企业倒闭，因为那是以偏概全的，你忽略了还有大量企业盈利呢。而在共享经济当中，我们也不能忽略大量个人通过自雇，生活得到了极大的改善。


    当然，越来越多的 人自我雇佣，社会就要给他们提供更好的支持，包括福利保障方面、职业培训和就业方面。我们在《前哨》第一季中介绍过，Betterment 就和
    Uber 合作，为他们的司机提供资产管理服务。另外，一般自雇者可能不太有长远眼光，所以未来对自雇者的持续学习培养也需要加强，甚至需要出台相关的法规。


    现在的共享经济，同一个领域的公司特别多，大家往往是一窝蜂冲进去，有没有什么办法能够让自己的公司实现差异化运营呢？我的回答是：我们介绍过，这是模式创新的特点。


    +   其实模式创新：

    第一，需要创业者出名，所以国外 Y Combinator 这样的孵化器特别热，因为创业者去那里混个金，名气就会大很多，估值也会涨很多；

    第二，需要尽量找到著名的风险投资人背书，著名 VC 都看中了我，说明我胜出的几率更大；

