    划重点

    1."空巢"现象是无法避免的，二胎也许能让"未来的老年人"在物质上得到保障，但却无法满足精神上的需求。2.陪护机器人的目标，就是解决老年人的"孤独感"问题，令他们开心。随着老龄化时代到来，不同的应用场景会成长出更多的功能。3.一个好的产品并不一定要炫耀技术，而是找到"痛点"，能够解决问题的产品就是好产品。


