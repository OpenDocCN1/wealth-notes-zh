    第二，互联网时代的社群运营可以分为重度运营和轻度运营两种，简单来说就是线下和线上方式。这两种方式各有特点，线下成本高、推广慢，但是效果好；线上成本低、推广快，但是黏性低；两种方式并没有绝对的优劣之分，还是要结合你的具体需求来选择合适的形式。


