    # 第三， Howard 注重店内细节布置。


    当你在星巴克时，你所有的舒适体验，可以说都是来自于星巴克对每一个细节的精心安排。为了让顾客只闻到咖啡的醇香，星巴克不会出售带气味的食品，也禁止员工使用香水。


    而对于不同地点的店面，椅子的设计款式和距离也会根据具体场合进行精心设计。另外，店内的背景音乐要细心筛选，同时音量也要调得刚好合适，既不会影响顾客交谈，也不会影响顾客听着自己那杯咖啡磨研的声音。


    # 第四， Howard 还积极利用高科技打造全新体验。


    2001年，无线网络的发展才刚起步，星巴克就开始在美国的门店里提供免费 Wi-Fi 了。后来为了满足客户快速支付的需求，星巴克在2009年9月就为会员推出了移动
    App 支付的功能。


    再举个离现在更近的例子，2017年12月，星巴克在上海太古里开了“臻选烘焙工坊”，这个工坊在 AR 技术的支持下成为了一个大型的咖啡体验场、或者说咖啡游乐场。


