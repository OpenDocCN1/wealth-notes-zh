    \n## —— 全周总结 ——\n\n本周的话题是品位升级，我们介绍了三个重点：\n\n第一，我们中国目前的这次消费升级其实是品位升级。品位升级的原因是，中国主流消费群体发生了改变，消费者从注重产品的用价值转变到注重产品的精神价值。\n\
    \n对此，我们可以从三个角度进行理解：\n\n+   - 第一，品牌成为一种自我表达工具；\n- 第二，注重产品的品质和精神内涵；\n- 第三，对高品质服务追求，逐渐超过了对实物的追求。\n\
    \n第二点，经济蓬勃发展之后，人们自然而然会想要提高自己生活的品质。但是从入门到懂行是需要一个过程的，他们需要一个简单的指标来帮助学习。就像红酒界有Robert\
    \ Parker独创的百分制，让人利于理解，对外行来说，具有很高的参考价值。对有些还没有树立评判指标的领域，具有借鉴意义。\n\n第三点，作为创业者，如果想要把握这次品位升级中的机会，就需要把握住产品背后的精神价值，给产品赋予一个能够代表用户身份认同的精神内涵。\n\
    \n可以考虑通过以下三种手段来实现：\n\n+   一，利用高科技来体现时尚感；\n一，做个性化、小众化的产品和服务；\n三，做高品质的产品和用户社群。\n\
