    # 189 | 全球通行​​的高品位象征-红酒


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. Robert Parker 是如何成为“红酒皇帝”的？

    2. Parker 首创的“百分制”好在哪？

    3. 普通人消费红酒的本质是什么？


    今天我们要聊的话题是“红酒”，可以说，它是全球通行​​的高品位象征。


    那为什么说红酒是品位的象征呢？


    相信如果你还记得咱们之前讲过的内容，就一定记得我跟你分享过，我很早就观察到一个现象，就是：


    当各个国家的经济水平高涨时，进口葡萄酒就会普遍激增，而且特别​​是进口法国红酒。


    中国当然也不例外，从2008年到今天，中国进口的红酒增长了接近10倍，这和中国经济的高速发展、大家普遍的品位升级关联密切。


    顶级红酒从葡萄种植、采摘、酿制到存储的每个环节都是精益求精的，这就导致了​​它的稀缺性；而红酒的饮用文化又被赋予了仪式感。就是这种稀缺性和仪式感的结合，自然而然就演变​​成了高品位的象征。


    那我们怎么判断红酒的好坏呢？


    市面上有一些红酒评级系统，评分越高，红酒的质量就越高，越有收藏价值。我们到一些专业红酒商店的时候，会看到RP90、WS91之类的评分，"RP"和"WS"分别代表不同的评分人或者评分机构。


    相信大部分朋友都看过《赌神》这部经典电影，不管是饰演赌神的周润发，还是电影里​​的其他土豪，比如说马来西亚拿督、上市公司高管等等，每个人一开口，必定​​82年的拉菲。


    这款酒可以说是深入人心，那今天我们要说的​​主人公 Robert Parker，就是这款酒最早的伯乐。前面说的 RP90 评分，RP 就是 Robert Parker
    的简称。


    # 一、红酒评论家 Robert Parker


    1947年，Robert Parker 出生在美国马里兰州，今天已经71岁了。他大学时主修历史，辅修艺术史，后来还拿了法学博士。


    而说到 Parker 对红酒产生兴趣，还得感谢​​他的妻子 Patricia。20岁那年，Patricia 在法国学习，Parker 就去法国看女朋友，一起​​到餐厅吃饭时，从来只喝可乐的他点了​​人生中的第一支红酒。他发现，这种低度酒不像啤酒那么胀肚，也不像烈酒一下就醉了，这种微微发酵的感觉刚刚好，让人心情愉悦。更关键的是，这酒在法国比可乐还便宜。


    回到美国后，Parker 就开始了解红酒，他阅读了​​很多红酒作家的评论，还成立了自己的品酒小组，并且变得​​越来越痴迷，他还把自己对每款酒的体验都记了下来。


    ![](img/812dfc825c17043226940aa4afb22b20_129_0.png)


    1978年，Parker 创办了自己的杂志，也就是后来的《红酒倡导家》，英文名叫 The Wine Advocate，首先免费发行了6000本，其中有500名读者直接转变成了付费用户，后来订阅者虽然增长缓慢，但却很稳定。


    为了进一步提升知名度，在1981年，他还开始为华盛顿邮报红酒专栏写文章。


    不过，真正让 Parker 火起来的事情发生在1983年，当时，Parker 受邀参加1982年法国波尔多红酒的品鉴会，Parker 品尝之后，对这个年份的酒非常看好，他马上断言，1982年是波尔多的顶级年份，还把好几款酒都评了满分，其中就包括著名的1982年的拉菲，Parker
    坚信，这些酒中单宁含量较低并且果香厚重，非常适合收藏。


    后来，相信 Parker 的人开始买1982年波尔多红酒，最终，时间给出了答案，1982年确实是顶级的年份。从此，Parker 就奠定了他“红酒皇帝”的声望。


    那么，Parker 对行业的影响力如何呢？讲个小故事你就知道了。


    Parker 的影响，可不仅仅是针对个人，而是整个红酒市场。波尔多新酒出来之后，Parker 每年都去品酒并公布分数，然后各个酒庄才根据自己得到的分数来公布本年度自己酒庄酒的价格。


    有一年 Parker 有急事没能及时去波尔多品酒，结果各个酒庄都拒绝公布自己的酒的价格，说要等 Parker 来了品完酒之后再定价。所以我在几周前的内容里提到过，买波尔多二级酒庄的
    Parker 满分酒，投资回报往往是最大的，甚至会超过一级酒庄。


    当然，随着 Parker 的行业影响力越来越大，一些酿酒厂和庄园为了获取更高的评分，不惜通过改变酿酒风格，去刻意迎合 Parker 的口感，其中就有西班牙的里奥哈、法国波尔多等地的著名酒庄，日子一长，市场上供应的红酒，大部分都偏向了
    Parker 的喜好。


    针对这种现象，甚至还出现了新词语"Parkerization"。


    # 二、Parker 成功的​​原因


    那么，Parker 是如何获得这些影响力的呢？


    首先，是天赋+勤奋。


    可以说，Parker 工作相当勤奋，有时候，他一天要品尝超过120款不同的红酒，你要知道他品完还要把感受记下来，然后还评分，一款酒最快也要花7、8分钟吧，这么算下来，120款就至少是14个小时。而他一年的品酒量，更是高达1500多种。


    Parker 自己也说，比他好的品酒师肯定有，但他能做得出色，主要还是依靠勤奋。


    当然，不光是勤奮，天赋也很重要。你可能有过这样的体验，普通人喝红酒，味蕾都会发麻，所以，很多品酒师是不能做到这个劳力强度的，因为这会影响味觉，从而影响判断力。但是
    Parker 的味蕾却从不发麻，所以他能连续品尝几十款酒，并从中筛选出最好的几款。


    其次，Parker 把红酒从高高在上的神坛上拉了下来。


    早年的红酒评论家几乎都和酒庄、经销商或多或少存在着利益关系。而 Parker 却一直如实记录品鉴结果，根据标准给出客观评分。


    要知道，名酒庄也可能会产出低分值的酒，而普通酒庄也有可能酿造出精品。


    最后，Parker 首创了“百分制”的评分制度。


    百分制是 Parker 最核心的贡献，我打个比方，我们都知道哈佛大学、普林斯顿大学、麻省理工学院。


    但是你知道美国的圣路易斯华盛顿大学吗？你知道这是所好大学还是野鸡大学吗？


    如果你不知道，那我就告诉你，2017年，它在美国最权威的大学排名榜单 US News 上排名第19位，也是名副其实的著名高等院校。


    红酒也一样，你想象一下，一个外行想选购一款红酒点在餐厅，提升一下自己的品位，却不知道该选哪一款。想参考大师们的意见吧，一翻开杂志，发现通篇都是华丽的评论，几乎每款酒都被描述为“有层次”“优雅”，这可怎么选择呢？


    这个时候，如果有个直观的分值能帮助你，那就好多了。


    不过，在上世纪80年代，给红酒打分并不常见，而且一般只评最高五颗星的星级，只有少数评酒师会用20分制，这是来自于只有少数评论师会用20分制，这是来源于法国学校的评分习惯，而且因为级别不够多，所以有大量的酒在同一级别上，没法差异化。


    而 Parker 自己首创了百分制，遵循的是美国学校的习惯，最主要的是分得更细了。可以说，这个百分制对 Parker 的成功至关重要。


    因为美国的80年代和今天的中国非常相似，那就是经济蓬勃发展，人们想要提高自己生活的品质。那时候，美国人逐渐开始关注法国红酒文化，但大多数美国人对红酒一无所知，根本不知道怎么判断酒的品质，也不知道该选哪个牌子。


    Parker 使用了美国人熟悉的评分系统，这非常有助于他们快速选择红酒。对于大多数外行来说，需要有个权威指针来帮助自己判断酒的好坏，比如看见两瓶酒，一瓶94分，一瓶93分，你就会觉得94分的肯定更好一点。所以
    Parker 的评分系统正好就填补了这方面的空白。


    你肯定会觉得，Parker 也太幸运了，这个点子也太简单了，唉，那就对了，这就是人们经常感叹的那种“我怎么没想到的是而易见的点子”。


    # 三、对 Parker 的质疑和追随


    前面我们聊了这么多，可以说 Parker 在红酒评论界是神一样的人物了，但是他真的那么神吗？红酒评论师又真的那么靠谱吗？


    # —— 今日内容小结 ——


    今天主要讲了世界上最具影响力的红酒评论家 Robert Parker，希望你能够掌握以下三点：


    第一，1980年代初，美国经济蓬勃发展，美国人富裕起来以后，开始追求高品位的生活，包括品尝红酒，但从开始学习，到真正懂红酒是有 一个过程的，他们需要一个简单的指标来帮助学习。Parker
    的出现正好迎合了他们的需求，他独创的百分制，和美国高校的评分制相似，易于理解，加上他所评价的红酒，涉及面非常广，这对外行来说，具有很高的参考价值。


    # —— 今日思考题 ——


