    50个以上的产品，并把它们送到零售商货架上。


    停不下来的 Quirky 还推出了名为 Wink 的智能家居平台，试图打造智能家居的物联网生态。


    然而，事情当然没有那么顺利，当大量创意产品被快速生产出来以后，Quirky 并不重视对产品本身市场需求的检验，也省掉了前期产品的测试环节，大部分产品被摆上货架的那一刻，也许就是一个
    Quirky 创意产品生命周期的结束，这些产品几乎没有后续的升级和迭代。


    渐渐地，用户对新产品的满意度越来越低，售后口碑也开始恶化。


    此外，对一个初创公司来说，产品类别过多，产品线太过分散冗长，都不是什么好事。业务大包大揽，导致 Quirky 在产品分类和管理上应接不暇，后期他们甚至算不清仓储的库存量，产品积压问题愈演愈烈。同时，Quirky
    重金投入的一个又一个高科技新产品连连遭受市场冷遇。


    当 Quirky 烧光了投资人的钱以后，没有投资人愿意继续注资。于是，2015年9月 Quirky 宣布破产，他们最得意的 Wink 智能家居平台以区区1500万美元卖出，剩下的部分以470万美元卖给了一个私人投资公司
    Q Holdings。


    Quirky 的破产停业让很多人震惊，100多万注册会员和粉丝都十分痛心，甚至在他 们破产之后，网站上还是每天新增注册100多位发明家。


    不过，就在2017年9月，Quirky 新总裁 Gina Waldhorn 带领着 Quirky 开始了新的征程。Gina 是一个专门对接品牌企业和初创科技公司并促成他们合作的机构
    Evol8tion 的联合创始人，看来也是位积木式创新的高手。


    他会如何调整 Quirky 的商业策略呢？


    他的做法是：


    +   大家可以在 Quirky 社区继续提交创意，公司负责把最好的点子挑选出来，只是 Quirky 不再承担创意产品的设计和生产，用于设计、研发、制造和营销的营运资本，都由其他合作商提供，Quirky
    也不再出资。


    等到产品出售以后，Quirky 收取一笔专利税，其中的一部分再返还给社区。


    如今专注做创意挖掘的 Quirky，在2018年 CES 上展示了将近20种优秀创意产品，而且 Quirky 已经开始在继续给以前的发明家们付费了，虽然换了股东之后，从法律上讲他们不必这么做。看来他们是真心希望能够重振雄风，我们也希望崭新模式下的
    Quirky 能找到一条适合自己的道路。


    从 Quirky 的故事中，我们能够得出三点教训：


    +   第一，创业公司一定要认清自己的优势和劣势，而不是把所有事情统揽在自己身上，要学会使用“新木桶理论”，发挥自己的长板。


    +   第二，作为初创企业，如何花钱也是一门技巧。投资并不是越多越好，只有找准赛道，在自己的优势领域小步快跑，专注深耕，才是长久生存之道。


    +   第三，站在整个创意产业的角度，就算有一个绝妙的创意，也不一定就能赚钱。创意一旦落地，从产品诞生开始就要坚持不断地进行迭代更新，要以用户体验为目标导向，而不是沉醉在自己的创意世界中。


    顺便说一句：


    产品和技术的更新迭代确实不易，然而内容的创新迭代也非易事。在创意井喷式爆发的时代，真正优质的内容反而越来越难找。只有把技术和优质的内容相结合，才有机会获得巨大商业利益。


    # ——今日内容小结——


    我们主要介绍了创意产业的机遇和教训，希望你通过今天的学习能够了解以下三点：


    +   第一，创意产业早已不再只属于少数专业人士，开源技术和平台撬动了大众创新，让更多人参与到创意产业中来，为创意经济的大爆发提供了技术支持。众筹模式以及线下创客空间和教育的普及，都大大降低了将创意转化为产品的门槛。


    +   第二，美国创意平台 Quirky 经历破产后，通过调整商业策略而再次回归。这个案例说明，一个绝妙的创意，只是获得商业成功的必要条件之一，用户真正的需求才是根本，千万不能沉醉在自己的创意世界中。


    +   第三，我们要做的，就是把握创意经济的广阔前景，利用现有创意平台和最新技术，找到市场的真实需求点，并将产品快速、持续迭代升级，才能在创意产业中占有一席之地。


