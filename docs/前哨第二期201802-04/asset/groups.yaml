    王煜全\n我是王煜全，你的全球科技前哨侦察兵，我们明天见。\n\n## 194 | 星巴克的零售探索\n\n## —— 今日内容看点 ——\n\n通过阅读今天的内容，你将会掌握以下2个问题的答案：\n\
    \n+   1. 星巴克成功的商业模式是什么？\n2. 星巴克的哪些创新方法值得借鉴？\n\n今天我们要聊的话题你一定很感兴趣，我们要来说说星巴克。\n\n\
    “我不是在星巴克，就是在去星巴克的路上”，这句话你肯定不陌生。\n\n10几年前，星巴克还是中国大城市里的新鲜事物，而现在星巴克的身影已经在很多3、4线城市出没了。\n\
    \n不只是买咖啡喝，很多⼈还喜欢把聚会、甚至⼯作会议都安排在星巴克。可以说，星巴克品牌已经代表了一种⽣活和社交⽅式，以及特有的⾝份标签。\n\n今年元旦，我正好去了位于美国西雅图派克市场1912号的全球第一家星巴克总店，还顺便拍了几张照片留作纪念。\n\
    \n![](img/812dfc825c17043226940aa4afb22b20_139_0.png)\n\n我们今天要介绍的人物就是星巴克的CEO，也是灵魂人物\
