    ## 198 | 前哨大会复盘：十大科技趋势


    198 | 前哨大会复盘：十大...


    ## ——今日内容看点——


    通过阅读今天的内容，你将会掌握以下2个重点：


    + 1. 十大科技趋势背后的逻辑。

    2. 识别未来趋势的方法论。


    在2018年4月22日，我在深圳完成了我的年度个人演讲“前哨大会2018”。


    接下来的五讲，我会对大会内容进行更为深度的解读，希望没有来到现场的同学，也能听到完整的内容，来到现场的同学，也能在复习中进行更加深入的思考。


    在前哨第一季，以及这一季的大半年时间里，我为你介绍了不少前沿科技，以及这些科技在行业中的应用。


    ## 趋势一：机器人终于来了


    在前哨大会上，我问机器人 Sophia，觉得自己和别的机械人有什么不同，Sophia 回答说，自己的优势是能和人类进行情感互动，也就是人类智商比较高。


    ## 趋势二：生物技术的革命


    ## 趋势三：大航天时代


    ## 趋势四：大公司的人工智能布局


    我接下来要告诉你的两个趋势都是关于人工智能的。


    首先，是个坏消息，人工智能的平台机会属于大公司。


    现在，各家 IT 巨头都在全 Solana开发人工智能的平台，平台的核心是，未来可以做到免编程，用户只需简单调用平台的能力就行了，到时候，连深度开发业务都不再需要小公司了。


    全面的平台像阿里和腾讯做的人工智能平台，专业的平台像百度的自动驾驶平台和搜狗的智能翻译平台。我们这次大会就是搜狗提供的全程翻译支持。


    所以，人工智能未来几年会很繁荣，但不代表直接做人工智能基础服务的小公司有很好的创业机会。


    前面说的这四个趋势是科技突破带来的，而科技突破一旦成熟，就会出现降低门槛，使得大量非专业人员可以运用。这时科技的发展往往就变成需求拉动的了，也就是说，不 Bess科技专家找到了新应用，而是市场专家找到了用科技满足需求的方法。


    当然，我们一方面介绍“科技是企业家手里的武器”，另一方面说现在是“科技军备竞赛时代”，“没有传统产业、只有传统企业”，说白了，就是不管你从事的是什么职业，一定要积极思考和探索如何尽快引入先进科技。


    ## 趋势五：人工智能的行业机会


    虽说人工智能被大公司垄断，平台型的机会已经消失，但是，属于行业的 机会才刚刚开始。


    我们科技特训营的学员杨斌，做过多年外科手术室的建设，现在他们凭借着多年的经验和大量的临床手术的相关数据，搭建了人工智能临床辅助诊疗平台，成为了精准外科的引领者。


    同样是 nostru科技特训营的学员于海洪，因为这之前在农业大数据领域的积累，现在也利用人工智能升级了自己为农业能够提供的服务，而且成功地和联通形成了战略合作。


    而做大数据分析的明略数据，插上了人工智能的翅膀之后，甚至到公安部门深入合作，把公安干警的知识融入了人工智能算法，建立了犯罪人员和团伙的识别、挖掘和预测模型，实现了人工智能辅助破案。


    你看，如果你善于发现机会，迅速在本身行业里成为第一个引入人工智能的人，很可能在你的行业里你就成了整合者，成了下一个霸主。


    ## 趋势六：5G的发展


    这个领域和人工智能相似，也都是大公司在抢着搭建 5G 网络的平台，美国高通和中国移动都宣布，在未来一两年内，5G 技术将会准备齐全。


    5G 网络的平台机会是不会留给小公司了。但是 5G 未来最大的机会是应用而不是技术平台，所以技术问题解决了，应用的机会也快到了。


    例如自动驾驶，它使用的人工智能需要大量的运算能力，但现在很多运算能力需要部署在云端，如果云端的分析几秒钟之后才能传回来，肯定早就出车祸了，所以响应速度是非常重要的。5G
    的成熟会促进自动驾驶的成熟。


    5G 网络是人工智能、自动驾驶、VR/AR、物联网等海量技术应用的基础，平台建好了，未来这些领域里都有可能诞生出巨大的企业。


    ## 趋势七：自动驾驶和电动车


    这个趋势很多人都能看见，因为有个著名的人物叫贾跃亭，当然很多人认为这是一个泡沫，但是我告诉你，虽然现在 FF91 的声音不行了，但是中国整个电动车领域的声音起来了，小鹏、威马、蔚来等一大批公司正在崛起，而国外的谷歌、Uber，中国的百度和阿里也在加大投入。


    蔚来汽车去年底发布了第一款电动车，各项指标都不错，零到百公里加速4秒几秒，据说一推出就预订一空，最近要交付了。


    我们科技特训营的学员钱晓鸣参投的威马汽车，他们的目标是做客户买得起，用得爽的智能电动车，他们的第一款量产车，也已经开始预订了。


    最有代表性的例子是拜腾，他是两个德国人创建的，但是以中国为核心的创业公司，目前进展也很顺利。


    你看，在其他的科技前沿领域，我们看到中国在追国际的热点。而在自动驾驶和电动车领域则相反，中国反倒比国外更热。


    国外新的造车公司现在基本上也就是特斯拉一家，而且特斯拉现在面临量产的严峻挑战，但中国反而一片繁荣。原因很简单，欧美来自传统大车厂的阻力太大了，反过来中国没有这种
    历史包袱，反倒是一片繁荣。


    中国已经成了支持科技创新最好的土壤，尤其是支持汽车产业的创新。


    ## 趋势八：中国科技新势力


    因为除了汽车以外，中国在科技前沿的新势力都 陡起。


    在2018年的 CES 展上，无人机领域的领军企业大疆，变成了一个大热点，大疆展台位于整个无人机展区的正中间，很多国外的无人机企业都把大疆的标志放在自己墻上，宣称自己和大疆有非常紧密的合作。


    所以我们就很感慨，过去，各个电脑企业都在电脑的外面打上"Intel Inside"的标志，让用户知道他们是和 Intel 合作的。


    而现在，变成了"DJI Inside"，似乎有了大疆的支持，你就是无人机领域里面更高级的无人机了，这是一个了不起的转变。


    除了大疆，小米和 Facebook 也达成了战略合作，开始向 Facebook 输出研发能力，未来 Facebook 的虚拟现实设备也许都是小米造的。


    TCL 也抓住了量子点技术，确保在未来的高端电视领域与三星一起站在第一阵营。而且 TCL 还成功地和美国的主流内容提供商合作，杀进了美国电视机的第一阵营。


    越来越多的先进的中国企业，学习、掌握和适应了全球的生态合作式的打法，在国际上脱颖而出。


    而随着中国制造和市场能力的提升，我们也在慢慢掌握从需求侧掌握先进科技的方法。


    但在此过程中，我们过去对知识产权不够重视、市场换技术时有强迫性、进入国外市场缺乏深入交流和融合等问题逐渐积累，加上西方发达国家跨国企业的国际化红利没有带给本国人民，造成了当地人民的反弹，在反国际化的潮流下给中外经济合作带来了一些问题。


    但我们坚信，历史潮流是不可阻挡的，中国企业应该在这个潮流中识大趋势，更加坚定地走国际化道路。


    ## 趋势九：中美经济分歧的加大


    那尤其是和科技相关的部分，其实这些分歧加大的潜台词，是中国新的国际化的崛起，中国对新科技支持能力的加强。我们在前面的内容里也说过，在美国人眼里，中国人突然变富了，美国人看不惯。


    出现这种情况，是因为中国企业走出去以后，还没有掌握如何介绍自己，让别人接受自己的方法。我们要勇敢地走出去，主动地去交流，化被动为主动，在国际上树立自己的良好形象。


    同时，凡事都有两面性。全面利用我们的优势，主动加入全球化布局，坦诚面对问题和认真解决问题的，才是中国企业最好的应对之道。换言之，这次贸易摩擦，反而是中国企业国际化的好机会。


    ## 趋势十：中国人的新国际化


    实现中国人的新国际化时代，是需要大家一起行动的。这也是我这一讲要告诉你的最后 一个趋势。


    我们一定要认识清，中国最强大的优势是制造能力。如果说精密制造，中国确实有差距，但如果从支持创新的角度看，中国绝对是一流的。再加上"大规模""复杂产品""开放式制造"这三个定语，中国制造不仅是全球第一，而且唯一。


    把一项先进科技快速实现量产，就是中国最大的优势。利用这项优势，到国外投资设厂，直接到贴近消费者的地方就近生产，会是中国企业走出国门的重要一步。


    现在的中国有机会去承担更多的全球责任，我们要转变只是去国外赚钱，然后带钱回家的思路，而是真的为外国本土提供服务，与对方共同繁荣、共同获利。

