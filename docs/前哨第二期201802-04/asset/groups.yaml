    # 185 | 瑜伽与精神健康


    # ——今日内容看点——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    + 1. 瑜伽的行业标准是什么？

    2. 瑜伽真的能改善精神状况吗？

    3. 瑜伽产业在美国的发展现状如何？


    今天我们要聊的话题是瑜伽。瑜伽是目前无论在年轻人，还是在老年人群体中都很流行的一种运动减压方式，可能我们的不少用户也是瑜伽爱好者。


    前阵子，朋友圈里有个帖子，题目是“瑜伽究竟坑害多少人”，里面提到一个新名词叫“瑜伽瘫”，说的是一些人练习了瑜伽之后，关节、韧带，或者腰椎都出现了受损的情况。


    更夸张的是，2001年著名的医学杂志《新英格兰医学杂志》发表一篇 文章，说瑜伽练习可能会引发一种不常见的中风，里面特别提到，瑜伽里的一些姿势会让颈部受到过多压力，所以导致了这种风险。


    这里我们要做个小提醒：瑜伽这项运动是适合所有人的，但并不是每个姿势都适合所有人。


    对于瑜伽，可能很多人还有一些困惑，那就是瑜伽行业从业者水平参差不齐，那到底有没有一套成体系、统一的行业标准呢？另外，瑜伽对减压和调节精神真的有帮助吗？


    # 一、瑜伽的行业标准


    我们先来解释第一个疑问，就是关于瑜伽的行业标准。


    实际上，目前全球只有两家机构能够颁发国际认可的瑜伽教师的资格证书：


    + 一家是澳大利亚的国际瑜伽教练协会；

    另一家就是我们今天要讲的美国瑜伽联盟，英文名叫 Yoga Alliance。


    瑜伽是在18世纪末从印度传入美国的，但是直到上世纪80年代才真正流行起来。1997年，美国的瑜伽练习者创立了瑜伽联盟，并制定了全美瑜伽教师的统一行业标准，给达到标准的瑜伽教师和瑜伽学校提供注册。


    行业标准的主要创立者是 Maty Ezraty 和 Chuck Miller，他们也是后来在纳斯达克上市的瑜伽公司 Yoga Works 的创始人，这个我们后面再聊。


    目前，在瑜伽联盟上注册的瑜伽教师一共有9700人，瑜伽教师培训学校有380所。如果 你也想要成为注册的瑜伽教师，那么你就得在认证的培训学校接受200小时或300小时的瑜伽培训。学习内容不仅包括瑜伽的体位姿势，还有人体解剖和生理、瑜伽的艺术和哲学，以及教学技能。最后，瑜伽联盟会根据学习时间和表现发出不同标准级别的证书。


    说来有趣，瑜伽明明起源于印度，但是印度并没有建立自己的标准培训系统，他们现在也在使用美国的培训注册体系。


    这是为什么呢？


    主要原因在于，美国的瑜伽跟印度相比，分枝比较单一，更容易形成统一的标准和完整的体系。


    反映印度，因为瑜伽文化有几千年历史，这些古典瑜伽的基础理论差别很大，在几千年的发展中相互影响杂合，又衍生出更多的派别，所以很难形成统一的标准，建立完善体系。


    # 二、瑜伽改善精神状况


    下面我们来解释第二个疑问，就是练习瑜伽真能改善精神状况吗？有没有足够的研 究证据呢？


    我的回答是：


    > 主流的研究结果表明，瑜伽确实能缓解焦虑和减轻抑郁程度，有助于保持精神健康。而所谓主流，就是不同的研究机构用不同的研究方法，得出了—致的结论。


    比如，2017年，加州大学旧金山分校的研究人员通过严谨的随机对照试验，评估了 瑜伽对抑郁症的效用。


    研究人员把38个抑郁症患者随机分成2组，20个人参加了为期8周的瑜伽练习，有专业瑜伽老师的指导，每周2次，每次90分钟。剩下18人作为对照组，他们参加的是瑜伽历史和哲学的专业课程。8周以后，研究人员发现，跟对照组相比，瑜伽练习组的抑郁程度明显下降。


    那么，这有没有可能是安慰剂效果呢？


    我们再看另外一个研究，犹他大学的研究人员通过脑功能成像技术来观察不同人群的大脑中跟精神压力相关联的脑区活跃状况，跟其他人群相比，瑜伽练习者这个大脑区域的活跃程度最低，对疼痛的敏感度也最低。这个研究说明，长时间的瑜伽练习能影响我们的大脑活动，进而改善精神状况。


    其他的各类研究还有很多，当然，难免有 反映的研究结果出现，这其实很正常，因为从科学的角度来说，我们参考主流结论就可以了。


    # 三、瑜伽改善精神状态的生物学基础


    那到底瑜伽练习是怎么做到改善精神状况的呢？


    我们都知道，人 在精神紧张和有压力的时候，就会心跳加快、呼吸急促、血压上升，这些都是人类在自然演化的过程中保存下来的恐惧生理反应。


    我们的原始祖先在野外生存时，要时时面对周围环境中的危险，比如偶遇凶猛的野兽，恐惧的生理反应就能让身体准备好逃跑或者战斗，而那些没有反应的或者反应弱的个体，就在演化的过程中被淘汰了。


    这也就是说，我们现代人的生理反应主要是由自主神经系统控制的，跟我们的意识关系不大。


    具体来说，当人处于焦虑和压力状态时，自主神经系统中的交感神经激活，会促使肾上腺释放压力荷尔蒙，让人有紧张感。这时候，跟交感神经相抗衡的副交感神经就会衰弱。


    而副交感神经一般会在人安静地吃饭、睡觉和休息时增强。瑜伽中的呼吸调节练习、冥想和某些体位练习，恰恰就能激发活化副交感神经，让人产生休息时的放松感，长期练习自然就能更好地缓解压力和焦虑。


    其实很多人对瑜伽都是有误解的，以为练习瑜伽就是做做各种高难度的动作。但实际上，现代瑜伽早就演变成了一种修身养心的锻炼方法。练习的精髓是通过体位练习来控制身体，通过呼吸练习来调理精神，通过冥想让心灵宁静，最后达到身心合一的状态，也就实在精神上获得完全的放松。


    # 四、瑜伽产业在美国的现状


    瑜伽跟我们昨天讲的正念训练一样，也是美国眼下很发展潜力的产业。


    现在在美国，练习瑜伽的人数大概在3700万，预计到2020年可能会达到5500万。这也是瑜伽产业的营业收入水涨船高的原因，单单2016年一年就达到160亿美元。而这些收入主要来源是购买瑜伽课程、瑜伽服装、瑜伽垫，和其他的辅助设备。


    那么，既然说到美国的瑜伽产业，就一定要提 Yoga Works。这是美国目前唯一一家上市的瑜伽公司，上 市的代码就是YOGA。公司创始人之一就是刚才我们说到的
    Maty Ezraty。她本来是一位舞者，在20多岁接触到瑜伽后，就跟着好几位印度瑜伽大师学习瑜伽。


    1987年，Maty Ezraty 在美国洛杉矶的圣莫妮卡创办了全美第一所瑜伽学校 Yoga Works。现在这个瑜伽学校的名气非常大，甚至成为了全美最大、最成功的瑜伽馆，也成为了圣莫妮卡的一张名片。


    顺便提一下：


    我们前哨的一位用户朋友，也是成功的企业家范卫平，在2013年跟 Yoga Works 全球总部建立了独家合作，在国内引入了瑜伽国际认证培训体系。另外，范卫平的公司基于生物反馈技术、人工智能和物联


    司基于生物反馈技术、人工智能和物联网，开发了生物反馈教练工具三件套，这套工具在运动健身时穿着，能帮助用户实现精准有效的训练。


    刚才我们提到了一个陌生的词，叫生物反馈技术，这个技术简单来说，就是把人体感觉不到的生理信号通过传感器检测出来，然后让用户看到，比如像心跳、血压、脑电波、消化道声音等等，这就能让用户在心理上产生各种反射作用，然后有意识地调整生理上的反应。


    好，我们说回 Yoga Works 的创始人 Maty Ezraty。


    2004年，就在学校办得有声有色的时候，她以4500万美元出售了 Yoga Works 的29家瑜伽馆。


    她为什么这么做呢？


    其实 Maty Ezraty 认为，如今的瑜伽训练，有点偏离瑜伽“梵我合一”的本意。发展太快就会出现瑜伽教师水平下降的问题，而且，现在流行的很多瑜伽派系都只注重体位姿势，忽略了修心的重要性。


    所以，她觉得应该把瑜伽一分为二：


    + 一部分回到传统的瑜伽理论学习；

    另外一部分是健身瑜伽。


    现在她经常会去全世界各地进行演讲，希望瑜伽作为一门身心治愈艺术，最终能给人带来幸福和从容。


    后续经营者接手 Yoga Works 后就开始了规模扩张，现在在全美已经有66家门店了，主要分布在纽约、波士顿、华盛顿等9大城市。除了提供瑜伽教师的培训课程外，他们也给普通学员提供瑜伽学习课程，还会在瑜伽馆和商店出售瑜伽服装和附属用品。


    那么，一提到瑜伽服装，又不得不说说 Lululemon Athletica 了，这家不仅出售时尚潮流的瑜伽服和瑜伽垫，还会提供免费的瑜伽课程，可以说是给传统的瑜伽馆业务造成了一定的冲击。不过，更值得注意的是，他们的瑜伽服是出了名的价格不菲。


    Lululemon 的创始人叫 丹尼斯·威尔森，是加拿大排名第15位的富豪，拥有26亿美 元的个人资产。


    上世纪90年代，丹尼斯参加瑜伽课程后，就想要成立一家专门生产瑜伽服装的公司，1998年他卖掉自己的一家生产滑雪设备的公司后，马上成立了 Lululemon。2000年他在温哥华建立了第一个实体店，主要出售高质量、高价格的瑜伽服和练习设备，比如一条女士瑜伽裤将近1000块人民币，一件运动T恤基本都要500元人民币以上。


    为什么会这么贵呢？


    原因在于，丹尼斯一直坚持用高科技的纺织面料和时尚的设计来生产瑜伽服，产品穿起来既舒服又好看。可以说，丹尼斯把 Lululemon 打造成了前沿的运动休闲品牌，还把时尚带入了健身界。


    以前瑜伽服只在瑜伽馆里穿，练完瑜伽后，练习者就得换掉瑜伽服，但是现在美国大街上，穿 Lululemon 瑜伽服的女士随处可见，Lululemon 已然成为了圈子里的一种身份认同和社交文化。


    ## —— 今日内容小结 ——


    今天我们主要介绍了瑜伽国际认证的标准培训系统，瑜伽有助于精神健康的生理基础，以及瑜伽学校 Yoga Works 和 Lululemon 瑜伽服。希望你掌握以下三点：


    第一，瑜伽起源于印度，在几千年的发展中衍生出数目繁多的派别，很难形成统一的标准，所以培训注册体系难以在印度建立。而美国因为分支单一，反而建立了国际认可的统一的行业标准和瑜伽教师认证体系。


    第二，很多都有一个误解，以为练习瑜伽就是做各种高难度的动作，但更重要的是修心。现代瑜伽作为一种修身养心的锻炼方法，长期练习后，与精神压力相关的脑区区域的活跃程度会逐渐降低，从而可以缓解压力和抑郁。


    第三，无论在美国还是中国，瑜伽已成为流行的运动，这不仅带动了瑜伽学校的扩展，还促进了瑜伽服装的发展，而科技则成为重要推手助力瑜伽产业蓬勃发展。


