    # 划重点


    +   1. 在美国，禅文化褪去了神秘的宗教外衣，禅修也已经演变成了一种促进生产力的工作方式和一种有品位的生活方式。2. 禅修能够帮助人训练注意力，有效地提高专注力，同时能够缓解压力，让人内心平和，因此在硅谷的科技极客圈流行。3.
    在中国，禅修刚刚进入大众的视野，目前市场处于鱼龙混杂的阶段。


