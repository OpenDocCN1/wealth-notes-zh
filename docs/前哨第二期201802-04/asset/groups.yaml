    ## 149 | 共享经济的先驱-罗宾·蔡斯


    149 | 共享经济的先驱罗宾...


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 为何罗宾·蔡斯被认为是共享经济的鼻祖？

    2. 共享经济的理论体系是怎样的？

    3. 罗宾·蔡斯给我们带来哪些启示？


    昨天我们简单提到了共享经济的先驱，Zipcar 公司和它的创始人 Robin Chase（罗宾蔡斯），今天我们就来详细介绍一下这位共享经济最早的探路者。


    ![](img/812dfc825c17043226940aa4afb22b20_34_0.png)


    ## 一、交通创业家-罗宾·蔡斯


    蔡斯是一位连续创业者，她还自称是“交通创业家”，因为她的每次创业基本上都跟出行有关。比如，共享汽车公司 Zipcar、P2P 汽车租借公司 Buzzcar
    以及拼车网站 GoLoco，另外还有基于交通工具的无线网络连接公司 Veniarn。


    这几家公司都有什么特点呢？


    你一定猜到了，它们都属于眼下方兴未艾的共享经济模式。


    蔡斯被称为共享经济的鼻祖，因为2000年她创立 Zipcar 的时候，共享经济才刚刚开始商业化进程。而她所有的创业项目又都具有共享经济的基因。


    蔡斯在共享经济上的探索实践给商业和社会都带来了巨大影响，因此她被《时代周刊》评为“全球最具影响力的100人”之一。在政界，蔡斯也颇具声望，她在美国多个政府相关机构任职。除此以外，蔡斯还是知名的科技慈善家，活跃在全球知名的非政府组织和非营利组织当中。比如，她在全球最具声望的环保
    NGO 组织——世界资源研究所（World Resources Institute）担任董事。


    蔡斯对社会的关注，可能跟她小时候的经历有关。


    蔡斯的父亲是美国的外交官，小时候她跟着父亲在很多中东和非洲国家居住过，这些国家经常面临严重的水资源或者能源匮乏问题。从那时起，蔡斯就开始关注地球环境和资源问题。大学毕业以后，蔡斯曾经在公共卫生机构任职，后来她又进入麻省理工学院著名的斯隆商学院，并获得
    MBA 学位。


    不过，对于解决资源问题，蔡斯认为靠商业和模式创新的方法，会比博士和教授们做各种研究更有效。这也是她后来创立以 Zipcar 为代表的共享经济公司埋下了种子。


    ## 二、创立共享经济公司


    那么，蔡斯具体是如何做的呢？


    这就要说到她创立的几家非常有代表性的共享经济公司了。


    - 1. 创建共享汽车公司 Zipcar


    Zipcar 这个想法，最早还是蔡斯在跟好朋友安切·丹尼尔森聊天的时候想到的。当时蔡斯抱怨，说家里买的那辆车都是她丈夫在开，可她自己偶尔也有要用车的时候，但她又不想花钱再买一辆车。


    安切是德国人，她跟蔡斯说，在柏林见过有人共用汽车。这个回答启发了蔡斯，对啊，这个问题可以靠汽车分时租赁来解决啊。于是，第二年也就是2000年，蔡斯和安切共同创立了
    Zipcar。


    我自己以前听说过 Zipcar 用户的反馈，他们说 Zipcar 用起来特别方便。每个人都可以在官网或者手机端注册成为用户，交十美元的年费，几天后就会收到一张会员卡。然后用
    PC 端或者手机 App 就能轻松定位到附近可以租用的汽车。你还可以随时预定想要的车型，设定租用时间。油费和保险费都已经包含在租金里了，你只要刷个卡就能把车开走。


    我们都知道，美国大多数城市的公共交通系统远远比不上中国，打出租车又非常贵。所以，相比之下，Zipcar 是既经济又方便。


    ![](img/812dfc825c17043226940aa4afb22b20_34_1.png)


    不过，共享经济的起步期还是很艰难的，在 Zipcar 成立早期的几个月里，蔡斯老是睡不着，还做噩梦，梦见一个汽车租赁行业的恶棍破门而入，拿枪指着她和她的丈夫，指责她创建的这个业务模式正在摧毁已经有着百年历史的汽车租赁行业。


    但其实，Zipcar 的模式并不是颠覆了传统汽车租赁，而是看到了用户另外的需求和使用场景，并利用科技来巧妙实现。


    为什么这么说呢？


    我来解释一下：


    在你用 Zipcar 租车的时候，可以根据自己的喜好和不同场景的需求来选择租车的类 型，比如周末租辆 SUV 去海边兜风，平 时去超市就租辆小型轿车。再看看传统汽车租赁，租车必须租一整天，还得
    到指定地点办手续。这么一比，Zipcar 自然要更方便灵活，也更便宜了。


    不过现在分时租货汽车已经不是什么新鲜事了，所以你可能觉得这也没什么大不了。但是，蔡斯创业的时候可是差不多20年以前，当时很多美国家庭连网络都没有，更别说智能手机了。这才是蔡斯真正了不起的地方。那时候，她就已经在不断探寻最前沿、最昂贵的技术了。


    比如，Zipcar 给汽车安装了射频识别收发器(RFID transponder)，可以读取会员资料，开启车门，并向控制中心更新汽车的使用时间和里程数。另外，她还引入移动技术，让用户通过移动设备查询和预订汽车。


    不光这些，ZipCar 的中央 IT 系统还租用了 Cingular 的网线网络。顺带一说：Cingular 是北美境内最大的移动运营商之一。有了无线网络，就能在
    ZipCar 的每辆汽车进行即时的信息同步。


    我们说，正是这些科技，才让这样的模式变为可能。


    Zipcar 在全球化的过程中发展很快，2011年在纳斯达克上市，2013年被汽车租赁行业巨头 AvisBudget 收购。截至2016年，Zipcar 的业务已经拓展到多个国家。


    在 Zipcar 之后，出现了一些比较有影响力的共享汽车公司，比如 Car-2-Go、国内的途歌等等，基本上都模仿和借鉴了它的模式。


    - 2. 创建汽车共享租借公司 Buzzcar


    离开 Zipcar 以后，蔡斯又相继创立了拼车网站 GoLoco，和 P2P 汽车租借公司 Buzzcar。GoLoco 跟我们现在熟悉的滴滴拼车、滴滴顺风车、Uber
    差不多，这个我们就不少说了，我来聊聊 Buzzcar。


    Buzzcar 实际上也是汽车共享租借，只不过不像 Zipcar 共享的是公司的汽车，这回共享的是私家车。就是说，如果你家有一辆车，但是这几天你出差不在家，那你就可以通过
    Buzzcar 平台，把车租给别人，从里面赚一些租金。


    这个尝试把共享经济的精髓又提升了一步，因为这次用的完全是社会的闲置资源。当然，它也同时带来了更大的挑战。


    第一个挑战来自监管和法律层面的。


    按照当时美国汽车保险和运营方面的立法，Buzzcar 是不能合法运营的。所以，蔡斯就把公司搬到了巴黎。说起来，Uber 也遭遇过不少法律层面的监管，甚至还被某些地区吊销了营业牌照。


    第二个挑战是，Buzzcar 和 Zipcar 在模式上有本质的不同。

    '
  mdcn: '

    其实不是东岸的创投不优秀，2016年麻省的风险投资数额就已经超过了加州，但是东岸的投资人更像 Carmichael 一样，都是投业内的。也就是说，他更多的是在创业者决定创业、还没有到处去声张的时候，就已经把钱递到了创业者的手里，所以他在业内非常知名，但是在公众当中默默无闻，Carmichael
    就是这样一个典型代表。


    他给我们展示的项目，比如说非常神奇的像太阳能板一样的硅片，却不是用来吸收太阳能的，而是用来从空气当中吸取水分的，我们都知道空气的湿度不可能为0%，也就是说，即使再干燥的沙漠里，空气当中也都依然含水。这个板子最神奇的地方就是，它连干燥沙漠空气里的水都能提取出来，一套装置能够达到24小时就产生五升水这样的效率。


    Carmichael 投的这家公司有一个宏大的野心，就是一旦这个设备普及到每家每户，我们以后用水都应该是不再需要付费的了。因为他们说，我们用空气也不付费。这当然是个了不起的愿望，尤其是在缺水的地区。


    类似这样的项目还有很多，包括我们和 Carmichael 合投了 Soft Robotics，就是根据章鱼的原理，做出可以抓取任何东西的柔性机器手。


    他们的 CEO Carl Vause 也来做了展示，他们的理想就是把最后一个工人都驱离工厂，因为工厂里面现在很多精密的制造、焊接、搬运的工作，都是由机器手来完成的。但是足够灵活的工作，机器手还不能胜任，这时候，柔性机器手就可以解决这些问题。


    比如说，中国像京东、淘宝都建立了仓储物流系统，也就是那些包裹的分发都是由小机器人完成的，但是要把包裹放到这个小机器人的身上，这一步现在还是要靠人，因为包裹的形状、大小不同，甚至重量也不一样，还没有一个万能的抓取工具能够完成把包裹放出去的动作。这一个动作就造成大量的人工损耗，Soft
    Robotics 就解决了这个问题。


    所以我们就看到，其实在美国整个创新生态链里面，风险投资人依然占据着非常重要的地位，但是他们的价值已经从给钱变成了给资源，也就是我们讲的积木式创新。一堆长板的结合，背后能把这些长板拮合起来，把这个拼图拼成的这个人，往往是风险投资人。这也是
    Carmichael 的优秀之处，他投的很多项目都是由他来完成这个拼图工作的，也正是这种模式，让美国的创新效率如此之高。


    最后，要用专业的人做专业的事，一个核心点就是，我们自己要明白一个创新生态的整体布局，要能够找到各方面专业的人来跟我们协作，当然同时要保证自己在自己的专业领域是最强的，自己是一块长板，和别的长板合作，能够巧妙地拼成一个桶，这个企业就能够实现快速增长。


    而整个生态要想更加高效，就需要更多的可以被拼接的独立长板，也需要更多的能够把这些长板拼接成木桶的人，而这些专业的支持者就充当了这个角色。


    好了，今天的内容就到这里。


    ## 划重点


    - 1. 科技企业最大的风险往往不是自己经营的风险，甚至不是同行竞争，而是那些来自其他领域的技术形成的完美碾压。 2. 美国东岸的风投往往能够事先找到好的创业项目，在公开募集资金之前完成投资，因此看起来默默无闻，但实际投资额已经超过西岸。
    3. 用专业的人做专业的事，核心是要明白一个创新生态的整体布局，要能够找到各方面专业的人进行协作，才能够实现快速增长。


