    \n而我们今天要讲的 GitHub，可以说是开源精神的极致体现。\n\n### 二、布道者：理查德·斯托尔曼\n\n在众多程序员心目中，理查德·斯托尔曼是神一般的存在。他始终坚信软件不应该只是被用户使用，软件的源代码还应该被用户所学习、共享和修改。\n\
    \n那为什么理查德·斯托尔曼会怀抱着这样的信念呢？\n\n这还得从他的生平经历说起：\n\n- 1953年6月，他出生在美国曼哈顿，16岁时，他第一次接触了计算机。后来...\n\
    \n### 三、奠基者：林纳斯·托瓦兹\n\n而这个内核部分的开发者，正是我们要讲的第二位奠基人物，名叫林纳斯·托瓦兹，他就是后来的“Linux 和 Git\
    \ 之父”，和理查德·斯托尔曼一样，林纳斯·托瓦兹也是一个技术狂热者。\n\n当 Linux 内核完成后，他立刻分享了内核的所有源代码。按他的说法，如果全球各地的黑客都来动手修改源代码，肯定能够带来一场开放的协作，从而创造出真正出色的软件。\n\
    \n- 1. 不管出于什么目的，所有人都有运行这个程序的自由。\n- 2. 所有人都有任意复制这些代码的自由。\n- 3. 在得到源代码的前提下，所有人都有改进程序，并公开发布改进的自由。\n\
    \n文件夹会越来越多，管理和存储成本也会跟着增加。\n\n为了解决这个问题，林纳斯·托瓦兹开发出了一套版本控制系统，并把它命名为 Git。\n\n每当代码改动出现新的版本后，系统就可以对新版本拍一个快照，然后根据时间等信息生成一段唯一的序列。这样一来，程序员们就可以使用\
    \ Git 的日志文件来观察和追溯每一次版本的变动了。\n\n更方便的是，如果想跳转到某一个特定的版本，你只需要在日志里面找到对应的序列，向 Git 发出请求就可以实现。至于存储成本的问题，因为快照只包含了变动的信息，没有改变的信息是不会放进去的，自然也就大大缩减了储存成本。\n\
    \n这套系统简单易上手，所以内核的开发者在做其他项目时，也渐渐地开始使用它。于是，GitHub 就这样一传十、十传百地应运而生了。\n\n程序员们开始把自己的项目上传到\
    \ GitHub 上面进行托管，并希望社区里的其他人也一起来参与项目的开发。后来有非常多软件都是依靠这种共享方式才取得了成功。\n\n### 四、程序员的Facebook\n\
    \n其实早在 GitHub 之前，就已经有不少代码托管的网站，但是大多数网站更像是一个代码下载网站，往往代码出问题了以后只能自己修修补补，想要优化代码，还得加入特定的组群才行。\n\
    \n另外，从技术上来说，也是 GitHub 更胜一筹，大多数代码托管平台都采用中心化版本控制，所有的更改都要立刻同步到服务器上，一旦断网或者发生错误更改，就要花大量的时间恢复到之前的版本。而\
    \ Git 采取的是分布式管理系统，你可以在本地完成修改后，再同步到远程主机。\n\n除了刚才提到的这些优势，GitHub 还被称为是程序员的 Facebook。\n\
    \n在这里，所有开发者都可以关注某个仓库，并接收到它的实时信息。同时，每个仓库又都有一个提问区，用户可以把自己遇到的问题发布到上面，然后等待作者或者其他用户来解答。这样就等于建立了用户和作者，以及用户和用户之间的互动。\n\
    \n这种管理方式吸引了许多著名的极客，他们纷纷把自己的项目放到 GitHub 上，而他们的粉丝也跟着转战到了这里。就像网络经济一样，一旦越来越多的节点加了进来，GitHub\
    \ 的影响力就会呈现指数增长，还会进一步迫使其他项目加入。\n\n现在，包括谷歌、Facebook、Twitter、微软在内的业界巨头都将自己的开源项目托管给了\
    \ GitHub。GitHub 的价值得到了广泛认可，2015年，它的估值就已经达到了20亿美元。\n\n而在 GitHub 提供的支持下，也经过接近10年的发展，数以万计的优秀项目在一群具有极客精神的程序员手中大放光彩。比如最近非常火爆的\
    \ AI 框架 TensorFlow、Keras等等。所以，开放的力量真的不容小觑。\n\n## ——◆ 今日内容小结 ◆——\n\n今天我们介绍了共享经济的先驱\
    \ GitHub，希望你能掌握：\n\n第一，GitHub 的成功核心就在于超越金钱回报的精神鼓励。就像林纳斯说的那样：“金钱并不是最强大的动力。人们在激情的驱动下，在享受快乐时所做的工作是最出色的。”\n\
    \n第二，共享经济的本质是一个更为宽泛的理念，它的核心离不开四个方面，包括协作、社交、开放和消费者意识。就像 GitHub 的成功离不开开发者的线上协作、互动、代码开源以及对开源软件坚定的支持态度。\n\
    \n第三，对于很多人来说，开放意味着手中来之不易的资源面临着控制权和价值的流失，但实际上，开放平台吸引人才创造的价值要远远超过它所带来的问题，我们说，这就是开放的力量。\n\
    \n## ——◆ 今日思考题 ◆——\n\n在广义的共享经济概念下，有哪些让你印象深刻的案例呢？\n\n欢迎在留言区分享你的观点。\n\n划重点\n\n-\
    \ 1. 共享经济的本质是一个更为宽泛的理念，它的核心理离不开四个方面，包括协作、社交、开放和消费者意识。\n- 2. 自由软件，是说软件可以不受限制地被所有人自由使用、复制、研究、修改和分发，甚至买卖。\n\
    \n王煜全\n\n我是王煜全，你的全球科技前哨侦察兵，我们明天见。\n\n## 142 | 春节特别内容：前哨美国东岸创新投资考察团\n\n## ——◇ 今日内容看点\
    \ ◇——\n\n通过阅读今天的内容，你将会掌握以下2个问题的答案\n\n- 1. 我们去美国考察的目的什么？\n- 2. 我们的考察团有哪些不一样？\n\n\
    马上就要过春节了，在这里先祝大家新年快乐。\n\n现在我们的第三季度刚刚过去一周，计划中这一周要讲的是共享经济，但毕竟要过春节了，所以我为你准备了特别节目。\n\
    \n我现在这个时代，正处在科技创新的巨大浪潮之中，人类的现在和未来持续地深刻地被改变着，社会变革在加速，很多人是既满怀希望又满心焦虑，希望是生活正在越来越好，焦虑是担心自己被淘汰。但我不得不说的是，我们能活在这个时代，真的是非常非常幸运，因为只要你稍微看懂了一点点儿未来，就很有可能把握住所有机会。\n\
    \n这一周，我会给你分享前哨在2017年10月份组织的《前哨创新投资考察团》美国之行的收获。\n\n当时我带着国内40多位企业家和投资人去美国东部做了科技创新考察，历时12天，走访了美国东岸4座最有创新动能的城市，分别是新泽西、费城、匹兹堡和波士顿，走访了八所名校，分别是罗格斯大学、普林斯顿大学、宾夕法尼亚大学、卡耐基梅隆大学、匹兹堡大学、哈佛大学、麻省理工学院和波士顿学院。考察了很多创新的科技项目。\n\
    \n我们的目标非常明确，就是带着大家了解真实的美国创新生态，感受真实的美国创新项目，走进真实的美国产业变革。\n\n因为只有这样，我们中国的企业家和投资人，才能真实感受到美国创新的原动力，知道我们中国所处的位置和在全球创新生态中该怎样发力。\n\
    \n我们做《前哨创新投资考察团》一直以来有三个信条：\n\n第一个信条是：就是要给大家看到不一样的东西。\n\n我们都知道，中国现在去海外的游学越来越多了，尤其是很多美国的大公司都快变成景点，硅谷这样的地方，开玩笑说都像北京的王府井了，去\
    \ Facebook 的食堂吃个饭，去谷歌的操场上转一圈，都成了一个必备的旅游项目了。\n\n但实际上我认为：这对我们来说没什么收获，因为这只是旅游观光。\n\
    \n而且最重要的是，这种方式并没有真正看到美国背后正在发生的东西，所以我们要请大家去看的，就是那些对美国的经济，甚至对世界经济都至关重要的，正在发生的变革。\n\
    \n比如，这次我们带大家看的项目，几乎没有互联网公司，更多的是硬的科技创新，我们一般叫做硬科技，比如基因工程、生物技术都有不少。\n\n我们都知道媒体喜欢报道硅谷，似乎全世界的创新就是硅谷了，撑死了再加一个色列。但实际上，美国的创新发源于高校周围，而且在各地蔓延。实际上，美国东部的变革也正在迅速地赶上西部，甚至已经逐渐超越了西部。因为这一轮的科技创新很多都是和实体产业相结合的，这就需要科技和更传统的产业结合，而这方面，美国东部有着很大的优势。\n\
    \n比如像 MIT 的机械工程系，听上去很不时髦，但是现在马上要进入机器人的时代了，尤其是人工智能和机器人的结合，就是智能机器人，这是未来推动社会变革非常非常重要的一部分。所以，我们就看到了\
    \ MIT 的机械工程系有了层出不穷的发明，一个一个优秀的公司被孵化出来。\n\n所以我们说，这个时代的脉搏和主旋律跟过去不太一样，已经不是纯软件的东西，不是纯互联网的东西了，而是软硬件相结合，是真正把软件融合到硬件里面。\n\
    \n第二个信条是：一定要学到东西。\n\n我们不是去马观花地看，不是到各个旅游景点拍照，不是到各个公司签到，而是我们真正理解美国科技创新背后的规律是什么，能够从中有所收获。\n\
    \n所以我们特意给大家安排的是让大家看到一个产业链条当中的各个核心部分，这样我们的团员就能够对整个产业发展的规律，尤其是背后蕴含的东西有更深入的了解。\n\n\
    首先我们去拜访了很多教授、专家和学者，因为我们原来说过，现在的科技创新基本上不可能从山沟里出来了，而是师出名门，也就是说，从高校，尤其是从名校出来的居多。\n\
    \n其次，我们也去了很多孵化器、技术转移机构和很多创新的小企业，因为很多高校的科研成果之所以能够落实到产品转化，最核心的是有很多的小企业在做转换的工作，而其它的支持机构给予辅助。\n\
    \n在拜访的过程中，我们带大家参观了知识产权转让办公室，孵化器、创新中心，甚至律师所和行业咨询公司，这些都是创业成功的必要支持部分。通过全面的了解，我相信很多人会对美国的创新系统有了更深的理解和认知。\n\
    \n为什么必须有一个深层次的认知呢？\n\n原因其实也很简单，当你去跟人家合作的时候，你必须要知道，在他的系统里面，哪个是他缺少的，哪个是我们具备的，或者哪方面我们能够帮到他，这样才能够形成一种双赢的合作。\n\
    \n所以这也是我们一直强调的，中国人出去不能只是去马观花，而是要真正地理解人家背后的规律，因为只有当你理解了他们的规律以后，你才能够真正地去跟他们合作。我们一直强调，在产业中实际操作的人必须要有成败论英雄。\n\
    \n第三个信条是：我们特别强调实践。\n\n我带着大家看项目，非常鼓励团员一起下来分享，一起来讨论，看的项目到底好不好，甚至我们一起来系统地对项目作分析和平价，同时也锻炼大家和对方沟通交流甚至谈判的技能。\n\
    \n其实中国人现在出去的越来越多，看到的东西也越来越多，但是到了最后，真正能够合作成功的，可不仅仅靠看项目，还要真正能够有实践的能力，能建立互信，懂得怎么去进行商业谈判，懂得运用所有的知识工具，使自己获得成功。\n\
    \n所以除了看和学以外，实践是必不可少的一环，我们要学会如何系统地了解国外各个前沿企业的现状，学会如何去作系统的分析，学会如何去和对方沟通交流，包括谈判技巧、合作技能，这些都是要在实践当中掌握的。\n\
    \n顺便说一句：\n\n今年5月份，我还会再组织一次这样的考察活动，我们安排去美国东南部，感兴趣的同学可以直接加我的公众号“全球风口”了解报名。\n\n好了，今天的内容暂且告一段落，我们明天继续。现在正是春节假期，这一周的课我就空给你思考题了，希望你能轻轻松松，开开心心过大年。\n\
    \n## 划重点\n\n- 1. 了解真实的美国创新生态，感受真实的美国创新项目，走进真实的美国产业变革。才能真实感受到美国创新的原动力，知道中国所处的位置和在全球创新生态中该怎样发力。\n\
    - 2. 美国的创新发源于高校周围，而这一轮的科技创新是软硬结合，美国最优秀的理工科大学大多集中在美国东岸，因此，这里的变革正在迅速地赶上西部，甚至已经逐渐超越了西部。\n\
    - 3. 真正地理解美国创新背后的规律，中国才能真正地去跟他们合作。\n\n王煜全\n\n我是王煜全，你的全球科技前哨侦察兵，我们明天见。\n\n当你设定了目标，你就要规划时间，保证这些要事能够得到落实。这是第三个词的意思。节日的时间规划，其实也是个大学问。究竟该如何在不同的目标上分配时间，节假日其实比平时上班的时候还难。\n\
    \n## —— ◆ 课后思考 ◆ ——\n\n学了管理课，过节好像也不那么随意了，也不知道这是不是好事。你有没有需要在节前做的计划呢，和大家分享一下。\n\n\
    ## 划重点\n\n- 1. 蔡格尼克效应：人会把一件没有完成的事情，一直放在心里记着，直到有一天他把这件事做了，他才会忘掉。\n- 2. 蔡格尼克效应的存在，提醒我们要去制订一个完成任务的计划，给自己一个内心看得见的目标。\n\
    - 3. 如果你处理的事情很多都是紧迫的事情，在某种意义上，这意味着你一直是在一种危机的边缘上工作和生活。\n\n## 你正在学习的知识模块\n\n- 管理与破局\n\
    \  1. 人与行为\n  2. 领导力\n  3. 团队\n  4. 指导下属\n  5. 组织发展\n  6. 文化与沟通\n  7. 客户\n  8.\
    \ 战略\n  9. 计划与变化\n  11. 业绩\n  12. 激励\n  13. 控制\n  14. 转型变革\n\n![](img/812dfc825c17043226940aa4afb22b20_20_0.png)\n\
    \n![](img/812dfc825c17043226940aa4afb22b20_20_1.png)\n\n如果你每天做的事都是重要且很紧迫的，或着这样的事在时间表里占有比较多，那就说明你的主动权是很差的。\n\
    \n## 宁向东的清华管理学课 —— 大师就在你背后 ——\n\n## 留言精选\n\n提交留言可与专栏作者互动\n"
