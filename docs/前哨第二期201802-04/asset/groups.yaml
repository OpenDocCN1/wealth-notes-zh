    现在看起来，创意产业的出现使得宠物人的这个噩梦不会实现，因为那些看似干不了什么事的人里面，某一天可能出一个创意，就改变了世界，就像 J.K.罗琳在当初没有写出《哈利·波特》之前，其实也是拿着政府的救济那样。


    所以，永远不要低估任何一个目前还没有成功的人。


    ## ——◆ 用户答疑 ◆——


    很多吸收创意的平台，请问他们能给创意者提供什么呢？如果最后把创意者当作义务劳动，那创意者也不会积极地把他们的创意想法贡献出来，要怎么样能实现双赢呢？


    我的回答是：


    我本周的介绍就是在强调，之所以创意越来越重要，就是因为平台提供了让创意去迅速实现，迅速商业化，和迅速完成全球市场覆盖的能力。


    就像我们在介绍 Quirky 的时候举的例子，一个想法就能让这个出点子的几年人后赚到每年200万美元，这就是为什么 Quirky 因为经营不善倒闭了还有人接手，想让它东山再起。因为对创意实现平台的需求是实实在在的。


    两个数量级而已，如果做目标的分解，在几年内是有可能攻克的。


    当然，对任何人都不能迷信，要辩证地看，他做的脑机接口公司，我就认为是有问题的。


    一是不止两个数量级，现在我们能够监测的也就是百级的脑神经的活动。我们原来也介绍过，DARPA 希望能够监测到百万级的脑神经活动，从百到百万，可是差着1万倍呢，不止两级。这个我们说过，10年内依然可能实现，因为
    DARPA 选目标的时候，都是选10年内经过奋斗可能实现的目标。


    但是，从第一辆无人驾驶汽车拿到 DARPA 挑战赛冠军，到能够商业化，已经又过了10年。而一个企业如果20年之后才可以商业化，从资本的角度不成立，进入得太早了。


    另外更严重的是，我们的大脑是有血脑屏障包裹和保护的，如果要直接做脑机接口，打开血脑屏障，大脑被污染的可能性将大大增加，而大脑就是一块最适合细菌生长的天然培养基，细菌的侵入可能是致命的。


    所以，我认为，未来真正要开发的不应该是和大脑直接连通的脑机接口，而应该是非植入式的脑机接口。


    我们投资的盲人眼镜公司 Wicab，今年年初在大家的帮助之下，也顺利完成了融资，他们的技术就特别适合用于开发非植入式脑机接口。我们也正在中国积极筹建相关的脑科学研究院，利用
    Wicab 的技术给研究人员提供更多的支持，希望国内有兴趣的研究人员和我们合作。


    另一个例子是，最近比尔·盖茨也评价了马斯克，他说：


    > 对电动车和无人驾驶充满期待，却看不懂他的超级高铁 Hyperloop，因为安全问题难以解决。


    我的评价是，比尔·盖茨很专业，超级高铁要商用，必须要通过严格测试，在美国，恐怕20年也拿不下来。但不排除新兴国家为了宣传创新，而给特批。


    我们原来介绍过，我们投资的航天飞机公司，他们做航天飞机只能从 A 点起飞，A 点降落，因为这样可以算试商用，就可以获批。一旦 A 点起飞，B 点降落，就被视为商业飞行，相关机构的监管强度将大大增加。因为公共交通有任何危险的隐患都是不能接受的，就是这样严格的监管，才使得美国的航空业很多年都没有过死亡事故了。


    所以，我们认为 Hyperloop 要通过这样的监管，没有几十年是不可能的。不过现在好像包括海湾国家在内的好几个国家都在抢超级高铁，国家为了宣传，在自己国民的安全方面做点妥协，在很多国家还是有可能出现的。


