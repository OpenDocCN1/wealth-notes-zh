    # 183 | 市场潜力巨大的精神健康市场


    183 | 市场潜力巨大的精神...


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 什么是精神健康？

    2. 中国的精神健康市场现状如何？

    3. 中国市场的潜在机会在哪？


    这周我们要讲的是精神健康，这个领域听起来好像和科技挨得有点儿远，但是实际上，每个人的精神状态，包括你的认知、情绪、动机等等，都是和脑科学息息相关的，而且还非常复杂。


    脑科学包括脑神经科学、神经行为学、认知心理学等等，可以说，我们对精神疾病的了解、研究和诊疗历程，其实就是脑科学领域不断发展和探索的过程。现在，全世界都在流行的禅修、正念冥想、瑜伽等等，其实也都和脑科学研究的成果相关。


    不知道你有没有注意到这个新闻，在今年1月，温州康宁医院向A股发起了IPO冲刺，结果被否，导致他们的港股股价下跌10%以上。


    实际上，康宁是国内最大的民营精神病医院，根据数据来看，截至2016年底，中国在册的严重精神障碍患者已经达到了540万例，而康宁医院的住院率一直保持在95%以上。


    所以，从投资者的角度来说，我们看到了中国精神健康领域的商业机会，而另一方面，其实精神疾病一直都存在，只是以前大家不重视。


    但现在，大家越来越重视自己的精神健康了。那么，到底什么是精神健康呢？


    # 一、精神健康的定义


    精神健康其实是一种大众的说法，比较官方的说法是精神卫生，英文叫作“Mental Hygiene”，是“相对于个人生理卫生”Personal Hygiene”而言的。


    顺便说一下：


    +   Hygiene 这个词在古希腊是健康女神的意思，所以后来用 Health 代替 Hygiene 表示心理健康。而精神卫生就是指心理健康的状态，它要求不仅自我情况良好，而且还要和社会相处和谐。


    1843年，美国精神病学家威廉·斯威特第一次提出了“精神卫生”这个词，在之后的10几年里，很多的美国学者和社会改革家都在积极推动精神卫生运动，所以这个概念在美国社会也就渐渐地被接受了。


    并且在社会改革家多萝西娅·迪克斯的积极倡导下，1847年在伊利诺伊州第一个心理医院“Mental Hospital”建立起来，从此美国第一批精神疗养院在15个州陆续地建立了起来。


    现在，全世界大概有2/3的心理学家在美国，所以在美国去看心理医生是一件非常普通的事儿，稍微夸张一点来说，其实就和吃块麦当劳一样的自然。


    根据统计：


    +   有30%的美国人都会定期做心理咨询，有80%的人会不定期的去心理诊所，而且美国还在白宫设立了“总统心理健康委员会”，专门为总统服务。


    大多数美国人都把咨询心理医生和保持精神卫生看得很平常，就像感冒以后去看门诊一样。


    # 二、中国的精神健康市场


    那对比一下中国，我们现在正在大步迈向发达国家的过程当中，物质生活条件即使跟10年前比，那也是改善了非常多的，而在精神方面，其实绝大部分时候都是被忽略了。但实际上，我觉得精神层面其实更值得关注。


    特别是过去，中国人对保持精神健康几乎处于漠视的状态，一个人一旦有了精神障碍或疾病，往往就会被社会忽视，甚至抛弃，不少人就这样沦为无家可归的流浪汉，有些甚至选择放弃生命。


    而且，精神出了问题的人，大多还碍于面子不会主动就医，而且就拿看心理医生这件事儿来说，都会被看作是一件不太光彩、难以启齿的事情。


    关于这一点，我认为主要有两个原因：


    # 第一个，是大多数人根本不知道自己病了。


    这里跟你说个我同学的故事：


    现在美国的超市里，经常可以看见食物上写着“Celiacs Disease”的字样，它的意思是“乳糜泻”，是一种对小麦食物中麸质的免疫失调，它是由基因引起的，通俗地说，就是吃了含有小麦的面制品以后会拉肚子，而且全身乏力。


    我同学从小吃面条都会过敏，但他并不知道是怎么回事，也不会去医院检查，一直就那么吃着那么忍着。结果到了美国，有天做体检才发现原来是麸质过敏，从此只要不吃含麸质的食物，就啥问题也没有了。


    # 三、中国市场的潜在机会


    当然，从另一个角度上说，这说明潜在的市场也非常大，那么下面我们从三个方面说说中国精神健康市场的现状。


    首先，从数量上说，尽管中国的心理咨询师正在增多，但目前真正的心理咨询师只有40万人，按照14亿人口来算，平均每3000多人才拥有一名专业的心理医生。


    3000多人才拥有一名专业的心理医生。而美国平均每1000人就拥有1名心理医生。


    可以说，中国心理医生的缺口还很大。


    其次，从行业生存压力来说，心理咨询1小时至少要200块钱以上，而且往往还需要多次就诊，但现在这块费用还没有纳入医保。本来主动去做心理咨询的人就少，价格还不便宜，那去的人就更少了。这样导致的结果是，除了极少数顶级心理咨询师可以通过全职做心理咨询来养活自己外，大部分的心理咨询师还只能是在线上做兼职的状态。


    而在美国，1小时的平均咨询费用在100美元左右，这个价格不算低，但是心理咨询费用部分可以纳入医保，只是根据购买的保险不同纳入的比例有所不同而已。


    最后，尽管我们说中国的精神健康是一个大市场，但目前总体来看，精神疾病的量化鉴定还属于灰色地带，因为它本身的特性，精神疾病很难像普通发烧一样有精确的量化界定。


    此外，精神疾病在时间上表现出连续性，这其实有些像慢性病，因为有时候我们不知道自己是否得病，也不知道病到什么程度了，所以就很难下决心去医院。


    # 四、保持精神健康的方法


    那么，在高强度的现代生活中，我们应该如何保持自己的精神健康呢？如果出现了一些精神问题，是否可以借助科技手段提前感知并进行干预呢？


    我认为主要有两个方法：


    第一个方法，你可以通过定期的精神运动修炼内功。


    比如说冥想、禅修，周二我们会提到正念疗法，而周三我们会聊聊瑜伽。


    关于禅修，有一本书叫《大脑的情绪生活》，英文名叫《The Emotional Life of Your Brain》，这本书的作者之一是理查德·戴维森（ Richard
    J. Davidson），他是威斯康星大学麦迪逊分校心理学与精神病学教授，哈佛大学心理学博士。曾被《时代》周刊选入2006年度“世界百大影响力人物”。


    戴维森在书里提到了一九七几年他在哈佛读研究生阶段，认识了哈佛的一群禅修者，之后他就对禅修产生了兴趣，还去印度和斯里兰卡呆了3个月，专门探索理解禅修。


    之后，他开始把积极情绪研究和禅修结合在一起，而且经过脑科学研究表明，禅修确实可以改善大脑的结构，从而帮助我们认识自身的情绪风格，获得益处。如果有时间，欢迎你去读他这本书。


    第二个方法，是借助科技的手段。


    比如抑郁症的鉴定，现在的做法是去医院作评测，结合不同场景回答大量问题。然后由计算机或者是医生来判定。


    可这种做法的问题是，都是病人依靠主观判断自己来填写的。，这也就引入了主观影响的因素，病人在去医院前，往往已经在网上看了些抑郁症的描述，在作评测时就会存在一种“启动效应”，英文叫“Priming
    Effect”，就是看到对应的描述就会往自己身上套，这就会导致医生无法客观地判断病情。


    现在，已经出现了很多针对焦虑和抑郁开发的 AI 产品，比如 Woebots 的聊天机器人，它是一个可以24小时和用户聊天手机 App，通过人工智能领域的自然语言技术，它可以在和用户聊天的过程中分析用户的心理障碍倾向，并提供基于认知行为的疗法建议，这方面我们会在周四详细介绍。


    # —— 今日内容小结 ——


    今天我们介绍了精神健康产业的发展现状，中美之间的差距，以及如何维护和感知自身的精神状态。希望你掌握以下三点：


    第一，人们对于精神疾病的了解、研究和诊疗历程就是脑科学领域不断发展和探索的过程。精神疾病一直都有，只是以前大家的重视程度不够，随着社会的发展，大家会越来越重视。但整体上中国与美国差距还很远，从另一个角度上说，中国的潜在市场很大。


    第二，有心理障碍的患者占据了精神疾病的大部分，所以对于这部分患者的援助，主要依靠心理咨询。从目前咨询医生的数量和生存状态来说，中国未来的发展空间巨大。


    第三，尽管精神健康是一个大市场，可精神疾病的量化鉴定总体上还属于灰色地带，目前可以尝试利用人工智能提前感知心理障碍倾向，并提供基于认知行为的疗法建议。


    # —— 今日思考题 ——


    在日常生活中，你是通过什么方式保持自己精神健康的呢？你有使用过科技方法来感知自己的心理状态吗？


    欢迎在留言区分享你的经历，我们共同交流。


    # 划重点


    +   1.精神卫生就是指心理健康的状态，它要求不仅自我情况良好，而且还要和社会相处和谐。

    2.精神疾病一直都有，只是以前大家的重视程度不够，随着社会的发展，大家会越来越重视。

    3.中国的精神健康领域是一个大市场，但目前总体来看，精神疾病的量化鉴定还属于灰色地带，通过人工智能领域的自然语言技术，在和用户聊天的过程中分析用户的心理障碍倾向，是未来的发展方向。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我们明天见。


    # 184 | 卡巴金博士与正念减压疗法


    184 | 卡巴金博士与正念减压...


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 什么是正念减压疗法？

    2. 正念减压疗法具体如何操作？

    3. 为什么这种疗法会在美国流行？


    今天我们要介绍的人物是“正念冥想”医疗手段的发明人卡巴金博士。


    你可能看过这样一张照片，就是乔布斯坐在地上，跟麦金塔（Macintosh）电脑合影。不过，就算是你看过这张照片，你也不一定能注意到，乔布斯的盘坐姿势叫做莲花坐，或者双盘坐。


    ![](img/812dfc825c17043226940aa4afb22b20_118_0.png)


    说起来，乔布斯18岁时就独自前往印度学习冥想，后来他终身保持了冥想的习惯。当然，他对冥想的热情并不是凭空而来的，而是受到上世纪六七十年代西方社会新时代运动“New
    Age”的影响。当时，人们普遍追求精神世界的强大，都希望从物质的束缚中解脱出来。


    而今天我们要介绍的卡巴金博士，就是在那个时期基于正念技巧创立了“正念减压疗法”，简称 MBSR。MBSR 现在在美国居然流行，因为它对人注意力的集中和精神健康有着积极的意义。


    究竟卡巴金博士是一个怎样的人？他发明的“正念减压疗法”又是怎么样一回事呢？

    接下来，我将为你一一解答。


    # 一、卡巴金博士和减压诊所


    我们先来看看卡巴金博士的个人履历。


    卡巴金原名叫 Jonathan Kabat，和夫人 Myla Zinn 结婚后，两人把姓氏联合起来，改为 Kabat-Zinn，中文就叫做卡巴金。


    1944年，卡巴金出生在纽约一个犹太人家庭，是家里9个孩子中最小的一个。父亲 Elvin Kabat 是世界知名的免疫化学家，母亲则是画家。


    1964年，卡巴金从哈弗福德文理学院毕业，进入 MIT 攻读分子生物学博士，并师从诺贝尔生理学或医学奖得主萨尔瓦多·卢里亚博士。


    ![](img/812dfc825c17043226940aa4afb22b20_118_1.png)


    正是在 MIT 求学期间，21岁的卡巴金参加了一场关于禅修的讲座，主讲人是美国禅师菲利普·卡普尔，讲座对卡巴金产生了巨大的影响。


    他第一次接触了禅修的概念，便认定禅修就是他一生要追求的东西。


    从那以后，卡巴金开始利用业余时间如饥似渴地学习禅修。他先后跟随一行禅师、崇山行愿禅师学习禅修和冥想，同时还在内观禅修社研习，并最终成为了那里的一名禅修导师。


    1979年，35岁的卡巴金已经是麻省大学医学中心的年轻教授了，但他不愿意继续研究分子生物学，而是一心想着要把禅修的方法推广下去，帮更多人减轻身心疾病的痛苦。


    卡巴金发现，大多数人并没有想过主动到禅修中心学习，因为在大众看来，冥想、禅修往往跟佛教或信仰相关，是比较唯心的。而且当时也没有科学证据说明，禅修或冥想跟人的健康状况之间有什么关系。


    所以，摆在卡巴金面前的问题是，怎样让大众接受冥想呢？


    于是，卡巴金开始了在外人看来相当“离经叛道”的试验。那就是，在得到麻省大学医院的同意后，他在医院地下室建了个小诊所，教医院里的病人进行正念练习。


    上世纪七十年代的美国，禅修对很多人来说，还带有东方神秘主义的色彩，卡巴金无疑是非常大胆的。不过尽管质疑的声音很多，但考虑到他是 MIT 分子生物学的博士，医院最终同意让卡巴金放手一试。


    卡巴金给诊所取名叫减压诊所，然后请医院的医生们，介绍那些患有严重身心疾病，比如慢性病、心脏病、皮肤病、抑郁症的患者来这里练习。


    刚开始，患者们只是抱着试一试的心态来到减压诊所。可没想到，接受训练后，很多患者竟然真的缓解了自己的疼痛。有了良好的反馈以后，医生们也愿意继续给卡巴金推荐更多患者。


    于是，卡巴金积累了更多的实验样本和数据，这给后续研究奠定了很好的基础。


    # 二、“正念减压疗法”（MBSR）的创立


    那“正念减压疗法”究竟是一种怎样的疗法呢？下面我们来详细地介绍。


    卡巴金在前期实验结果的基础上，在麻省大学医院提交了一份申请，他希望把佛教中的“正念冥想法”和现代临床以及心理学治疗结合起来，形成一套标准的治疗手段。这就是
    MBSR“正念减压疗法”的雏形。


    不过，想要知道“正念减压疗法”是什么，我们有必要先知道“正念”是什么，以及“正念冥想法”又是什么。


    按卡巴金的说法：


    正念，英文是 Mindfulness，指的是有意识地专注当下这一刻，并且不附加任何主观的评判。


    而目前国际上普遍把冥想分为两大类：


    +   一类是正念式；

    一类是聚焦式。


    这两者区别在于：


    正念式冥想，强调在冥想时，要有意识地将注意力维持在当前，不对任何升起的念头和感受作任何评判；


    聚焦式冥想，强调把注意力集中在单一的特定活动上，摒弃其她想法和感受。


    那我们现在就知道了，“正念冥想”的核心就是：


    不加评判地专心于当时当地的事情，撇开过去和即将发生的事情。


    那么，正念疗法到底有什么好处呢？


    主要有以下三点：


    第一，可以帮助有慢性疼痛的患者减轻痛苦，哪怕不能缓解症状，正念练习也能帮助病人转移注意力，从而减轻痛苦；


    第二，是提供一种系统的冥想训练，用不评价的方式来看待自己所有的想法，这样能更理性、更全面地看着任何想法，自然就能提高专注力。而且科学研究表明，冥想和积极的正念练习能够降低皮质醇水平和血压；


    第三，神经科学家还发现，哪怕冥想的时间就短几分钟，冥想者也能在工作中具有更好的记忆力和更敏捷的思维。


    # 三、正念减压疗法的具体操作


    说了这么多正念减压疗法的好处，那究竟具体该怎么操作呢？


    MBSR 的练习方法可以分为两种，“正式冥想”和“非正式冥想”。


    先说说“正式冥想”，正式冥想主要包括四种具体方法，分别是：身体扫描、静坐式冥想、行禅和温和瑜伽气功。


    我们来简单介绍一下这四种方法。


    第一个，是身体扫描。

