    ## —— 全周总结 ——


    我们本周是对第二季度讲的内容的复盘，主要讲了三个方面：


    第一，传统领域的企业也需要重视科技，因为现在进入了科技军备竞赛时代，用科技的未必赢，不用科技的基本确定一定会输。


    第二，传统领域的企业使用科技有三个角度：


    +   1. 企业的角度，包括产品、零配件、生产、库存、营销，甚至研发、合作、管理，都可以利用科技来提升自己的竞争力；

    2. 从用户的角度出发，包括用户的生活、工作、学习、娱乐，从各个角度看用户是如何被科技改变的；

    3. 从科技本身和科技对市场改变的角度出发，看都有那些科技对市场造成了什么样的改变。


    第三，科技是先进武器，我们不要要求传统领域的企业会制造先进武器，但要会运用户武器，而且要通过自己的实践找到最利于发挥武器优势的新的战略战术，这个机会将成为传统企业的竞争优势所在。


    ## —— 用户答疑 ——


    现在的人工智能越来越发达，就像 Echo 智能音箱，不久就可以实现对话教育功能了，那么像 VIPKIDS 这样的语言类培训机构还有什么存在的价值呢？


    我的回答是：


    确实现在很多科技都会对现有的业务形成替代，这就要求现有的企业不断迭代。


    英语对话训练可以被人工智能替代，但如何激发孩子学英语的兴趣则人才能够做到，因为人工智能是纯理性的，而人是可预测的、非理性的，所以在激励人上，机器不能替代人。


    当然和学生互动的老师就有了新的角色定义，因为教课就未必是他所擅长的了。


    +   一是人工智能也可以教；

    二是有了 MOOC，我们可以用世界上最好的老师来教课和世界上最好的老师来学习。


    所以你身边那个可以和你一对一互动的老师，他未必是要靠他教课的水平来体现价值，他的价值应该是集中体现在互动答疑、启发和激励上面。


    而作为语言培训机构，甚至泛言之，作为学校，如果能够及时调整，把新技术整合进来，让学生能够学到最好的课程，同时让老师适应新角色，让老师能够更好地互动答疑，启发学生和激励学生，这样的教育机构反而有更大的发展空间。


    所以我们说，科技也是双刃剑，不用科技容易被科技淘汰，用了科技，用好科技，反倒会如虎添翼。


