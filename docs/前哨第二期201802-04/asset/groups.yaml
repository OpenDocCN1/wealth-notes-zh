    其实，美国这些企业，他们的竞争对手不是中国人，他们真正关心的是如何用最先进的技术去挑战现有的那些巨头，去替代现有的世界500强，而且美国的创新公司从来没说过非要在美国生产制造不可。


    我以前就多次说过，中国企业家到了美国，要学会用美国人喜欢的方式来介绍自己。你上来说自己是中国来的，我们有广阔的市场，我们有很多钱。这其实没切中重点，因为，只有你介绍的是你能给人家什么帮助，你能给人家什么支持，人家才会对你有兴趣。


    经常会有人问，为什么我们不断地把中国的企业家、投资人带到美国考察呢？


    原因其实很简单，因为中国的经济要持续繁荣、持续发展，中国的企业家就必须要走出去，要实现彻底的国际化。


    我们看现在的马云和马化腾，他们已经做了千亿美元级的企业，未来中国的企业家如何才能超越这些前辈们？


    我认为只有一条路，就是把全世界当成自己的市场。


    马云、马化腾能把中国当市场做到千亿级，如果未来的企业家们拿全世界当市场，就有可能做到万亿级，就能超越他们的前辈们，就能带动中国经济，甚至全世界经济的持续发展，这是我们的终极目标。


    最后，我希望你能从这一周的内容里有所收获。


    当然，只是听和看，不可能完整感受到现场的精彩，所以在此我诚挚地邀请你参与我们的下一次活动，我们一起去切身地感受科技前沿，感受科技的浪潮。


    我邀请你去我们的科技特训营，我邀请你去参加我们前哨的海外游学活动，如果你的专业能力很强，我也邀请你到我们的前哨团。


    总之，当我们大家都一起参与推动科技进步的时候，我们的未来就一定是光明的，谢谢。


    ## 划重点


    - 1. 全球科技创新正处在井喷式、爆发式的增长阶段，如果我们能够对全球前沿科技，尤其是和中国互补的科技前沿实现系统性布局，中国经济和世界经济将获得持续繁荣。
    2. 掌握了先进科技的企业家是中国最先进的生产力，优秀的学者为他们服务，不仅贡献了一份力量，也能从中获得第一线最真实的反馈。 3. 中国企业走出去，想要达成合作，只有介绍的是我们能给人家什么帮助，能给人家什么支持，人家才会对我们有兴趣。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我们下周见。


    ## 148 | 共享经济正在渗透到各行各业


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    - 1. 共享经济的底层逻辑是什么？

    2. 为什么共享经济是大势所趋？


    在我们2017年科技特训营二期的课堂上，我邀请了我的前老板，也就是全球最大的行业咨询公司 Frost&Sullivan 的全球总裁 Aroop Zutshi，来为同学们分享了他对于社会趋势的判断。


    Aroop 是一位判断社会趋势的专家，他在课堂上提到：


    > 共享经济就是一条重要的社会趋势，未来人们会越来越习惯拥有一项物品的使用权，而不是非得拥有这个物品。


    比如，你自己没有车不要紧，因为你可以用 Uber，我们需要的不是一辆车，而是一套出行的移动解决方案。在未来，像 Uber 这样的服务将会渗透到各行各业。


    ## 一、共享经济的底层逻辑


    那么，究竟什么是共享经济呢？


    其实我们大多数人对共享经济都不陌生，因为这几年在中国，几乎你所有能想到的东西都被创业者拿来做共享尝试了，有的成功了，但大多数是失败的，比如：


    - 成功的有共享出行领域的滴滴出行、ofo 和摩拜；

    势头趋缓的有共享充电宝、共享办公和共享床铺；

    而失败的代表，应该非共享雨伞莫属了。


    总之，“共享+”的名字已经不新鲜了，但是它还在逐步深入到各个产业的细分领域当中。


    其实“共享经济”是一个挺老的概念了，早在1978年，美国的两位社会学教授费尔逊和斯潘思，就在他们的研究论文中第一次提出了“共享经济”。


    > 共享经济的本质，就是整合闲散的物品或者服务，然后用较低的价格提供给需要用户。而共享经济的双方，就是在特定的时间内对物品的使用权进行流转。


    尽管“共享经济”这个概念由来已久，但是真正的商业化却来得很晚。


    直到2000年，因为互联网的蓬勃发展，以 Zipcar 汽车分时租赁平台为代表的共享经济公司才开始涌现，各种平台爆发性地就都出来了。但是，现在也只有 Uber、滴滴以及
    Airbnb 这少数几家企业相对是比较成功的。


    那么问题来了，虽然共享经济是个大趋势，为什么成功的企业却不多呢？


    这就要聊聊共享经济的底层逻辑了。


    作为共享经济的早期实践者，Zipcar 的创始人罗宾·蔡司（Robin Chase）曾经写过一本畅销书叫《共享经济（Peers Inc）》，她在书中提到，共享经济需要满足三个条件：产能过剩、共享平台以及人人参与。


    我来稍微解释一下：


    首先，产能过剩，很多情况下就意味着价值的浪费。


    拿汽车为例，在美国，汽车一天的平均闲置时间是95%；在加拿大，这个数字大概是90%，而在咱们中国，平均每辆汽车每天闲置时间是22个小时。这就意味着，你花了100%的钱把一辆车买回家，却只利用了它1/10左右的价值。


    所以我们说，像汽车这样空着就不能产生价值的物品，能不能用某种方法有效利用起来呢？


    于是，为了把汽车的价值最大化，Uber和滴滴这样的共享平台就诞生了。这就满足了共享经济的第二个条件，共享平台。但是，真正让共享平台成为可能的是互联网技术，尤其是移动互联网的出现。仔细观察你就会发现，几乎所有共享经济的企业都出现在2000年以后。


    比如，像 Wikipedia 这样的信息分享平台、像 Zipcar 这样的汽车共享平台，或是像 Github 这样的代码开源平台。紧接着，在移动互联网技术成熟后，又出现了
    Uber、滴滴这样的即时叫车平台。反观2000年以前，你就能明白共享经济的出现和繁荣是离不开背后的技术支撑的。


    共享平台相当于于是连接了每个人，产生了两种身份，一是分享者，二是使用者。对于平台来说，分享的人越多，就能拉来更多的使用者，反过来也一样。


    打个比方，对于打车的人来说，他们只有觉得用 Uber 叫车很方便，才会使用 Uber。而对司机来说，只有觉得用 Uber 叫车的用户很多，他才乐意用 Uber。这是一个相辅相成的结果，平台能够连接的人越多，获利的可能性就越大。


    总之，产能过剩、共享平台以及人人参与这三个条件缺一不可。所以，共享经济的底层逻辑可以用一句话总结出来，那就是利用技术来解决闲置资源的有效利用问题。


    ## 二、共享经济向细分行业发展


    尽管我们非常熟悉摩拜、滴滴这样的共享经济企业，甚至我们的生活已经离不开共享经济，但是，你可以为这就是共享经济的全部。


    这几年，共享经济开始呈现出一个比较明显的特点，就是共享内容不断趋于向细分产业发展，而且专业化程度也在逐渐提高。


    举个例子，2014年6月，Elon Musk 在特斯拉公司博客上发表了一篇博文，名叫《所有专利都属于你（All our patent are belong
    to you）》。在文章里，他宣布特斯拉所有的专利将免费分享给所有人。Elon Musk 认为，在应用了开源策略后，特斯拉将会因此更强大，而不是削弱自己在电动车领域的地位。


    为什么 Elon Musk 这么自信呢？


    因为特斯拉把专利技术全部开放，不光是希望公司能够引领电动车市场的发展，也是希望在这种开放环境下，会有更多的电动车制造商借助特斯拉的力量加入到电动车产业中来。加入者越多，整个电动车的产业生态就会完善得更快。


    这实际是运用开放的心态，把别人的成功转化为自己的优势。看上去特斯拉好像免费送出了自己的拿手绝活，实际上是利用那些电动车厂商来帮自己进行生态布局。不同厂商之间进行技术的相互分享、越超和竞争，整个电动汽车产业的发展就会越来越快，这样电动车代替传统汽车的时间也就会越来越早。不要忘了，电动车产业真正的敌人是传统汽车产业。


    再来介绍一家名叫 InfoStellar 的共享经济公司。


    这家公司是日本的太空科技初创公司，目前已经获得了730万美金的 A 轮融资。你肯定想象不到这家公司共享的是什么，它共享的是环绕在地球周围的卫星。


    共享卫星也满足了刚才我们提到的那三个条件：


    首先是产能过剩，现在，太空中的卫星数量越来越多，很多卫星在执行完某个任务后就被闲置了，这是一种资源浪费。绝大多数卫星都跟地面上的某个信号塔进行信号传递，而且每次传递时间只有10分钟。打个比方，如果卫星每天绕地球转4圈，那么一天之内卫星跟信号塔的信息传输时间只有40分钟，其余的时间卫星都在无所事事。


    为了有效利用这个庞大的闲置资源，InfoStellar 建立了一个卫星共享平台 StellarStation，这也是共享经济的第二个条件，共享平台。


    我们来形象地说一下 StellarStation 的工作原理：


    假设中国和美国各有一颗卫星，在没有 StellarStation 之前，它们各自平均每天只工作40分钟。而有了这个平台以后，当美国卫星到达中国上空时，它就可以跟中国的信号塔进行信号传输。同理，中国的卫星的信号塔进行信号传输。同理，中国的卫星到达美国上空，也可以跟美国的信号塔进行信息传输。


    这样一来，两颗卫星各自的有效使用时间都扩大了一倍。而如果平台上有越来越多的卫星和信号塔加入，每一颗卫星的使用效率就都能得到极大的提升。


    InfoStellar 公司在 StellarStation 的宣传片中，也说明了自己的梦想。他们希望“创造实时的卫星传输系统”。当然，卫星共享的商业模式需要强大的专业技术背景才能实现，这也是
    InfoStellar 拥有的技术优势。


    参与卫星共享平台经济的双方正是各个国家的卫星运营商和天线运营商。InfoStellar 的云端天线共享平台，能够把它们全都结合起来。如此一来，那些天线在空闲时就能被别的卫星运营商使用，有效的通讯时间也会跟着增加。由于卫星运营商和天线拥有者采用了不同的协议和调制形式，InfoStellar
    的出现，还能让使用不同协议的卫星运营商和天线运营商彼此相互合作。


    当然，在中国，情况有点特殊，其他国家未必能用到中国的天线。但是熟悉我们前哨的用户知道，我们已经讲到了，未来是一个大航天时代，卫星的共享在中国也一定会出现。


    所以，我们可以看到：共享经济的理念正从日常物品和服务的分享，向更多专业的领域扩展。这些变化的背后推手，就是科技的进步以及细分场景的不断挖掘。


    过去，GPS 可以帮助 Uber 落地；微信跟支付宝的移动支付技术为滴滴在共享出行领域的发展奠定了基础；而大数据跟人工智能，则可以帮助共享单车更好地进行区域规划，从而增加它们在消费者面前的曝光度和使用率。


    今后，还会有各种各样的产品和服务借用最新的科技来高效利用那些闲置的资源。


    ## —— 今日内容小结 ——


    今天我们通过 ZipCar、特斯拉以及 InfoStellar 三家公司，了解了共享经济的发展过程、现状以及未来的趋势，希望你能掌握以下三点：


    第一，从社会层面上来说，共享经济是一个大趋势。未来，人们会越来越习惯于拥有一个物品的使用权，而不是拥有这个物品。而共享经济得以实施离不开三大条件：产能过剩、共享平台和人人参与。


    第二，科技在共享经济发展过程中起着决定性的作用。正如 Uber 和滴滴出行的成功离不开手机地图跟移动支付的普及，而共享单车背后则有人工智能和大数据前来助力。因此，好的想法只是万里长征的第一步，选择合适的科技才是决定成败的关键。


    第三，未来，共享经济将会从大众生活逐渐拓展到专业化的细分市场，但核心都是通过技术手段，让资源实现有效利用，并降低成本。这是所有共享经济模式的底层商业逻辑。


    ## —— 今日思考题 ——


    你的生活中使用的哪些产品背后贯彻了共享经济的理念呢？


    欢迎在留言区分享你的观点。


    ## 划重点


    - 1. 共享经济是重要的社会趋势，未来人们会越来越习惯拥有一项物品的使用权，而不是拥有这个物品。

    2. 共享经济需要满足三个条件：产能过剩、共享平台以及人人参与。

    3. 共享经济的底层逻辑，就是利用技术来解决闲置资源的有效利用问题。

    4. 共享经济开始呈现出一个比较明显的特点，就是共享内容不断趋于向细分产业发展，而且专业化程度也在逐渐提高。


