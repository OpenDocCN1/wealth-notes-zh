    ## 151 | 天时、地利、人和的共享经济


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 如何才能够把握住共享经济带来的机会？

    - 2. 为什么那么多共享单车公司都惨遭失败？

    - 3. 为什么“信任感”对共享经济非常重要？


    今天我们来讨论一下共享经济产业中的机会和陷阱。中国可以说是共享经济的成功实践者。以摩拜为代表的共享单车甚至已经跟手机支付、高铁和网购一起被评为中国的新“四大发明”。


    ## 一、天时、地利、人和


    随着城市化的进展，共享经济毫无疑问是未来社会一个大的发展趋势，可以说是具备了“天时、地利、人和”。


    我们可以从几个数字中看出：


    第一，截至2017年2月，中国移动互联网用户总数达到11.2亿，这意味着除去14岁以下的儿童，几乎所有人通过网络连接在一起。这个庞大的网络群体具有超强的在线消费习惯。2017年，中国移动支付的规模预计已经达到15.4万亿美元，相当于美国同期的70倍。


    这为共享经济打下了规模基础，这是“天时”。


    第二，根据国家统计局的数据显示，截至2016年，中国的城镇常住人口已经超过8亿，差不多有2/3的中国人都住在城镇里，而人口超过1000万的超级大城市有13个。


    人口的大规模聚集，使得闲置资源被充分利用成为可能，这就给共享经济的生产和发展提供了地理基础，这是“地利”。


    第三，随着时间的推移，90后、00后正在成为主流消费群体。他们相比于“90前”的消费者有着全新的消费理念，喜欢追求创新、爱分享、爱社交。同时，他们也是互联网时代的原住民，对科技的接纳速度快、意愿强。


    这就给共享经济的发展提供了用户基础，这是“人和”。


    当共享经济同时拥有“天时、地利、人和”时，它的规模将会越来越大，并逐步深入到产业经济的各个角落，整合与调和个人、企业、地区、国家乃至世界的资源，有助于形成一个高效、信任和充实的世界。


    ## 二、创业者的机会


    尽管共享经济的前景一片大好，但那只是宏观环境，创业者的机会不见得就肯定会多。


    2017年年底，一份所谓的“共享单车死亡名单”刷爆了朋友圈，这是一份已经倒闭和停止运营的共享单车企业名单，那可以说是“尸横遍野”。当初风光一时的悟空单车、町町单车、小蓝单车、小鸣单车等公司接连倒下，它们大多数运营时间只在1年左右，结果却留下拖欠用户数亿元押金未退。


    为什么那么多共享单车公司都惨遭失败？


    其实，失败的原因就在于，跑得不够快。


    我们经常提到，共享单车是一个典型的技术壁垒低、只是模式创新的行业。而模式创新是最容易被抄袭的，很容易出现大家一拥而上的情况。最后剩下来的，基本上是早早进入、具备先发优势的企业。而这些企业往往借助资本的力量，快速扩张形成规模效应，后来者很难再跟它们竞争市场。


    在实际操作时，如果企业既没有先发优势，又缺乏雄厚的资本支持，还没有出色的管理运营能力，那么出现“大面积死亡”的情况也就难理解了，这也是很难再有后来者超越摩拜和ofo的原因。


    所以你会看到，共享经济虽然形势一片大好，但是大家都看低了这块蛋糕，这就意味着创业风险极大，成功率极低。


    那么对于创业者来说，如何存活下来呢？


    我认为有两条路可以走：


    第一条路是，如果你不能建立特别高的技术壁垒，那就要找到你熟悉的细分市场和用户痛点，尽早进入并占领高地，建立自己的用户壁垒。


    我们一直强调：


    创业一定要看清楚什么是你能做到而别人做不到的，在无法建立技术硬壁垒的情况下，就一定要建立其他的壁垒。


    具体到共享经济，就需要创业者对某个行业或者某个用户痛点有特别深刻的理解，并且还能够利用资本的力量快速扩张。在别人还没反应过来之前，就建立起稳固的用户壁垒，到那时别人再想跟你竞争市场就没那么容易了。


    第二条路是，建立足够高的技术壁垒。


    就像我们在周一提到的 Infostellar 公司，它做的是卫星共享平台。卫星共享不仅需要强大的专业技术背景，而且还要有连接全世界卫星运营商和天线运营商的能力。


    对普通人来说，这两条无论哪一条都不容易实现，所以高门槛自然会帮你把一大批竞争者挡在门外。而且随着细分场景的挖掘，企业需要建立起自己的技术壁垒，用硬实力和别人竞争。


    ## 三、建立信任感


    除了建立别人难以逾越的壁垒之外，对于创业者来说，共享经济还有另一个需要解决的难题，那就是信任感，这也是让绝大多数创业企业感到头疼的事。


    想让共享经济这门生意站得住脚，买卖双方必须建立信任关系，但是这点非常困难。因为大多数共享经济企业只是为了促进买卖双方达成交易，而没办法控制库存或者卖家。


    就像 Airbnb 刚成立时，没有什么信用积累。你这个平台上并没有持有 If you hold any... 你这个平台上并没有持有一套房，那么房东凭什么放心地把房子交给你租出去呢？如果这房子哪里被房客弄坏了，房东又该找谁承担责任呢？


    同样，当多家共享单车企业倒闭、巨额押金无法及时退回时，信任危机就会凸显。以押金为代表的共享经济成本，其实很大程度上是信用成本。


    所以共享经济创业公司必须面对信用问题，目前在中国，个人信用、商业信用的建立都还不完善，可能会在交易中出现欺诈行为，因此创业公司必须注重信用的培养和维持。常用的手段有：


    - 1. 评价系统；

    - 2. 资质审查；

    - 3. 依靠政府和第三方机构。


    其中，评价系统是现在最常见的信用建立手段，比如滴滴打车的订单一完成，App 就跳出一个评分页面，让你给这次行程和司机打分。


    这种打分系统背后利用的是“群体的理性”，就是说，当一个群体内的个体都作独立决定时，那么综合得到的一半都是最理性的选择。因此用户在不断使用滴滴时，就会逐渐信任这个平台，因为他们信任群体的决策。


    另外，资质审查也是平台必须加以控制的，只有通过了严格的审查，才能既让供应商有归属感，又能保证消费方得到高质量服务。


    依靠政府和第三方机构也是为企业增加信用的一个手段，这方面英国政府走在了前面，他们提出了一种叫做“共享经济认证标志”（The Sharing Economy
    TrustSeal）的资质。当一家共享经济公司拥有认证标志时，就代表它通过了政府的检验，这会极大地提升它在用户心中的信任感。


    这个认证体系，主要会审查申请公司的几项指标，比如身份认证、企业背景调查、安全支付/定价与退款原则、保险与担保制度、数据安全性等等。所有审查程序会由专业的咨询公司来执行，然后向专家咨询小组汇报，由专家咨询小组授予并管理认证公司，如果企业不合规范，专家小组有权取消它的资格认证。


    己的可能性，每个人都是一家独立运转的企业。


    这让我联想到 Robin Chase 出的那本著名畅销书《Peers Inc.》，直译过来就是“同伴公司”，你的同伴人人都是一个公司。在未来，会有大量的个人崛起。但请注意，想要抓住这次机会，你得拥有对别人来说有独特价值的能力才行。因此，不断精进培养自己的“长板”是每个人的核心任务。


    当个人价值被共享经济放大之后，传统的企业形式可能也会发生变化，诞生类似于“维基百科”这样的分布式协作生态。


    比如，我们昨天讨论的 GitHub 就是基于共享经济思维形成的代码分享平台。在未来，可能企业中的绝大部分任务都可以通过在共享平台上进行“外包”的方式来完成。


    最后，由于共享经济依托于互联网，所以在运作过程中将会产生大量的交易数据，特别是机器数据。通过这些数据，企业不仅能对每个人的信用进行打分和预期，还能更深度地挖掘客户价值。


    这些信息还可以用区块链等技术手段进行加密保护，从而建立起个人信用体系和企业信用体系，而这两个体系的建立将会给未来商业的发展奠定坚实的基础。


    ## —— 今日内容小结 ——


    今天我们讲了共享经济的机会和风险，希望你掌握以下三点：


    第一，共享经济目前处于“天时、地利、人和”的时期。不论从消费者、技术还是宏观环境的层面来看，都具备了爆发的可能。但是，创业者要小心进入，因为共享经济是典型的模式创新，创业者一不小心就会面临压力大、风险高的竞争局面。


    第二，创业者要杀入共享经济，一定要建立自己的壁垒。理想状态是建立足够高的技术壁垒，但是如果没办法做到这点，那就要找到你熟悉的细分市场和用户痛点，充分借助资本的力量迅速积累用户，形成规模优势。


    第三，共享经济会产生随机协作的可能性，你的闲置资源很可能就是别人的稀缺资源。这就意味着，即使是个人，在共享经济平台上也有分享自己的可能，当个人价值被共享经济放大之后，甚至会产生完全不同于传统企业形式的、类似于“维基百科”这样的分布式协作生态，最终帮助整个社会进行资源的利用和优化配置。


