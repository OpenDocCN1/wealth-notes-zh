    但其实，Zipcar 的模式并不是颠覆了传统汽车租赁，而是看到了用户另外的需求和使用场景，并利用科技来巧妙实现。


    为什么这么说呢？


    我来解释一下：


    在你用 Zipcar 租车的时候，可以根据自己的喜好和不同场景的需求来选择租车的类 型，比如周末租辆 SUV 去海边兜风，平 时去超市就租辆小型轿车。再看看传统汽车租赁，租车必须租一整天，还得
