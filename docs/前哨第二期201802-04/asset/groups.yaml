    在这个创业生态里面，Carmichael 是一个非常耀眼的明星。你回想一下，你知道的风险投资人，是不是全是西岸的，或者是甚至都是硅谷的。


    比如说你知道彼得·蒂尔、马尔·汉德森、杨致远，红杉的 Michael Moritz，为什么没有西岸的呢？


