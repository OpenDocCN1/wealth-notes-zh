    ## 160 | 外骨骼让老年人重获行动力


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 外骨骼的前景有多大？

    - 2. 为何外骨骼一直饱受质疑？

    - 3. 外骨骼开发的新趋势是什么？


    咱俩小时侯写作文，经常会写到一个题目，就是“红领巾扶老奶奶过马路”，听到这个你可能都笑了。


    不过，这个题目却折射出一个非常现实的问题，那就是：


    老年人的行动能力大不如前了。


    几乎所有老年人都会因为年老或疾病，导致行动能力下降甚至丧失。在全球，跌倒是老年人受到伤害的头号杀手，2014年的時候，咱们中国65岁以上的老人中，每年因为跌倒造成的伤害就达到了4000万人，而且多年来，跌倒一直是老年人死亡的前十大原因之一。


    你肯定也会想到，现在科技这么发达，那我们能不能弄个设备来解决老年人行动不便的问题呢？


    相信你已经知道答案了，这就是我们今天要讲的“外骨骼”设备，而且，这种设备其实早就有 了。


    ### 一、外骨骼设备


    你肯定知道漫威系列电影里的《钢铁侠》吧。电影里，主人公斯塔克身上穿的机甲装备就是非常正宗的外骨骼设备，英文是Exoskeleton，这个词是来自于节肢动物，你看，像螃蟹和虾这类甲壳类动物的外壳，其实都可以被称为外骨骼，它们的
    作用就是支撑和保护动物柔软脆弱的器官和身体。


    虽然目前我们距离钢铁侠的水平还要差很远，但实际上，人类早就开发了不少外骨骼产品了。比如，古代士兵穿的盔甲，现代的潜水服和航天服等等。


    ![](img/812dfc825c17043226940aa4afb22b20_60_0.png)


    在工业领域，比如福特已经给生产线工人配了名叫 Ekso 的外骨骼背心，这个技术是加州大学伯克利分校的 Ekso Bionics 公司和他们合作研发的，售价6500美元，有8斤重，里面一个电子元件都没有，主要就是弹簧类的机械连杆，能对胯臂和腰部起到很好的支撑作用，帮助工人省力气和避免受伤。


    其他还有更高级的军用外骨骼和医疗用外骨骼。


    ### 二、Cyberdyne 与 HAL


    而今天我们要讲的就是一家生产外骨骼设备的公司，日本的 Cyberdyne，说来也巧，Cyberdyne 和电影《终结者》里，那个导致了机器人革命的公司恰好同名。


    Cyberdyne 是世界上最早的外骨骼公司之一，它最大的亮点，就是在外骨骼设备上加入了智能感应功能，让外骨骼能像机器人一样，帮助行动不便的人重新获得行动能力。


    而这款外骨骼，就是2008年正式发布的 HAL，是 Hybrid Assistive Limb 的缩写，翻译过来就是“混合辅助肢体”，它是全球第一款获得安全认证的外骨骼机器人，也是这个领域最早进入消费级市场的产品。


    ![](img/812dfc825c17043226940aa4afb22b20_60_1.png)


    其实，在 HAL 刚推出的时候，外骨骼还是一个很新的概念，用创始人山海嘉之的话说，就是五个完全“没有”的全新领域：


    - 没有市场、没有用户、没有专业人士、

    没有产业、没有社会规则。


    所以 Cyberdyne 的意义非常重大，它不只是生产了一款产品，而是从无到有地创造了这五个要素，它是利用科技撬动“银发经济”的先驱者。


    ### 三、创始人：山海嘉之


    既然要介绍 Cyberdyne 公司，最关键的创始人山海嘉之肯定不能落下。


    山海嘉之在小学三年级的时候就读过美国科幻作家阿西莫夫的作品——《我，机器人》。从那以后，他就立志要当一名研究机器人的科学家。后来他在筑波大学攻读人造器官专业，顺利拿到工程学博士学位。


    毕业后，山海开始了对 HAL 的研发。从1990年开始，他先是花三年时间摸清了控制腿部运动的神经系统，然后跟团队花了四年时间做出了第一个硬件原型。不过，虽然后来又对产品原型做了三代更迭，但
    HAL 依然有不少问题，光电池部分就重达22公斤，更别提穿上这套设备还得两个人辅助才行了。


    在过去的几十年里，“少子老龄化”一直是日本的死结，所以这里就成了发展机器人和外骨骼的沃土。


    2004年，在日本政府的资助下，山海嘉之创立了 Cyberdyne 公司，开始将 HAL 产品化。经过不断的实验和改善，HAL 外骨骼机器人重量越来越轻，还内嵌了计算控制系统，也就是说，HAL
    真正变得可行了。


    2008年，经历了漫长的研究和完善过程后，HAL 终于正式发布。


    值得一提的是，筑波大学是 HAL 的专利持有者，而 Cyberdyne 公司则拥有独家使用权，这堪称是校企合作的成功典范。Cyberdyne 是一家以技术为核心竞争力的公司，它先在高校探索技术方案，制造出用于科研的产品，然后再逐步产业化，打造消费级产品。而这个过程，恰恰就是科技产业化的过程。


    顺便说一句：


    我们的科技考察团去美国，一个很重要的目的，就是去各大高校了解现在具有产业化前景的技术，帮助一个未来的 Cyberdyne 对接中国的合作者。2018年5月，我们的考察团又要启程了，如果有兴趣，欢迎到我们的公众号“全球风口”当中，了解更多的
    情况。


    ### 四、HAL 的工作机制


    跟其他外骨骼的设计不同，HAL 特别强调跟人体的整合度，具体来说就是：


    - HAL 外骨骼可以探测人体肌肉的发力时

    间点，从而介入工作，目的是增强人体

    的肌肉所欠缺的力量。


    所以，HAL 系统更像是人体的自然延伸，而只是一种助力工具。


    不过，要说 HAL 最吸引人的地方，那就不一样 “意念控制”莫属了。听起来有点玄乎，其实现原理不难理解。我们的身体在运动的时候，皮肤表面会溢出微弱的生物电信号，HAL
    就是去监测这个信号，然后通过安在关节部位的动力装置提供力量，就好像是受到了意念控制一样。


    有了 HAL，使用者在日常生活中的一切活动几乎都可以借助 HAL 来完成，比如，站立、步行、攀爬、抓握、举重物等等。


    我们举个具体的例子：


    - 在2011年，49岁的日本残疾人内田靖史，就让他的朋友佩戴 HAL 背着自己登上了法国圣米歇尔山。


    内田靖史是残疾人，无法自己发力，所以只能让他朋友有足够的力气背着他。但我们可以想象，那些只是行动能力差的老年人，是可以借助 HAL 外骨骼轻松行走，甚至参与长途旅行、登山、徒步等活动的。从这个角度看，HAL
    的市场是非常广阔的。


    不过我们都知道，像 HAL 这样的科技产品，监管机构的批准是它们走向市场的主要门槛。


    ![](img/812dfc825c17043226940aa4afb22b20_61_0.png)


    而就在2015年10月，HAL 正式被日本许可进入医疗领域，医院的护士们经过短暂培训，就能顺利使用 HAL 来帮助病人了。而且就在2018年的1月份，美国
    FDA 批准了 HAL for Medical Use 这个版本的外骨骼作为医疗用品上市，可以帮助下肢受损的患者更好地行走。


    ### 五、备受欢迎的技术


    那么，究竟 Cyberdyne 公司的技术有多受欢迎呢？


    听听数字你就知道了：


    2014年3月，Cyberdyne 在日本创业板上市，成为日本第一家生产医用及社会福利事业机器人的上市公司，山海嘉之也被福布斯网站誉为机器人领域的首位亿万富翁。


    2015年，上市仅一年的 Cyberdyne 还没开始盈利，股价就已经翻了两倍。这足以证明投资者有多看好它的技术所带来的发展前景。


    不仅如此，正因为 HAL 能够大幅提升人的肢体能力，所以它也有很大的军用空间，甚至有传言说，Cyberdyne 公司曾经受到美国军方的资金支持。


    不过，Cyberdyne 公司一直坚持服务社会，对待技术是很慎重的。创始人山海教授在接受媒体采访时，就曾说“不论技术有多么强大，关键还是使用技术的人”，他也身体力行地避免
    Cyberdyne 向军事化的方向前进。


    ### 六、发展瓶颈与趋势


    不过，虽然 Cyberdyne 的技术很先进，但它也有显著的发展瓶颈需要去突破。


    首先，HAL 还是比较笨重，而且价格昂贵。在日本国内，HAL 的价格大概在15万美金左右。 为了解决昂贵的使用成本问题，Cyberdyne 采用了租赁的方式。但是，只靠租金和少量的销售收入，是很难弥补大额的研发投入的，因此
    Cyberdyne 一度处于亏损状态，这对投资者来说无疑是个巨大的打击。


    ## —— 今日内容小结 ——


    总结一下，今天我们介绍了外骨骼机器人公司 Cyberdyne 和它的产品 HAL，希望你能够掌握以下三点：


