    ## 175 | 未来汽车保险的新趋势


    175 | 未来汽车保险的新趋势


    ## ——◆ 今日内容看点 ◆——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 什么是“基于用户驾驶行为的保险”？

    +   2. 汽车保险是如何按里程计费的？

    +   3. 个性化车险为何在中国发展缓慢？


    今天我们要聊的话题，跟车险有关。


    相信很多朋友都有购买车险的经历，也知道就算你在liw...等5种最基础的保险，也要花上几千块，甚至上万块钱。


    可最无奈的是，就算你的爱车天天躺在家...只能寒下一块半牛排。


    那么，有没有灵活一点的个性化的车险服务呢？


    还有，今天，我们就来介绍一家美国 UBI 领域的互联网车险公司 Metromile，这家公司打破了传统车险单一化的定价模式，按照个性化里程收费。


    ## 一、基于驾驶行为的保险


    说起来，Metromile 这个定价模式，正好解决了用户这个尴尬又无奈的痛点：


    +   一来，你不用再为长时间没上路的车花费用；

    +   二来，从出险赔付的概率分布来看，以前相当于安全优秀的驾驶员总在为高风险的驾驶员买单，现在不会了。


    Metromile 公司是怎么做到的呢？


    刚才我们提到了一个词，叫 UBI，我先来解释一下：


    +   UBI 指的是 Usage Based Insurance，翻译成中文就是“基于用户驾驶行为的保险”。


    说白了，就是用一种技术来实时跟踪监测你。安全驾驶的人，保费自然优惠，而高风险的驾驶员就要承担更高的保险价格。


    Metromile 利用车上的 OBD，也就是车载诊断系统的接口，来调用记录行车的数据，比如行驶里程、急转弯、急刹车、加速超车等，随时记录驾驶行为的数据，为后续设计保险产品提供依据。


    ## 二、里程计费式保险


    究竟这是一家什么样公司呢？

    我们先来了解一下：

    2011年，Metromile 在美国旧金山成立。


    有意思的是，它的 CEO 兼联合创始人 Dan Preston 以前并没有任何保险领域的相关经验，但他是一个拥有丰富的机器学习和计算机科学背景的数据专家，也就是说，他对怎样找到能够彻底改造一个产品或行业的数据见解很深。


    也许正是因为拥有这样的背景，Metromile 才创造性地发明了里程计费式保险。


    那么，这个里程计费式保险究竟是怎么计算的呢？


    首先它由基础费用和里程费用两部分组成。


    比如，你的基础费用是30美元，里程费用是4美分/英里，这个月你的车一共跑了500英里，那么，里程费就是20美元，也就是说你这个月总的保费是30加20等于50美元。


    另外，它还会根据各州情况设置不同的里程上限，比如华盛顿地区就是250英里，如果你当天的里程超过250英里就不再多缴纳保费了。


    这种设定方式就是对汽车驾驶风险的精算，总体来说肯定是开的越多，风险越高。


    值得注意的是，Metromile 设置的基础保费只有传统正常保费的一半左右。另外每日的费率设置上限值，是根据每一天用户所在地区的限速和用户所能驾驶的最长时间估算出来的，这种设置既不损失公司利益，又让投保人有安全感，可以对每日的最高保费有个概念。


    总之，Metromile 能让大部分低行驶里程的用户，一年下来节省约大概500美元。


    ## 三、Metromile 的操作模式


    主要从三个方面来实现：


    第一个方面，是精确记录行驶里程数据。


    在众多驾驶行为数据中，Metromile 只聚焦在地点信息数据上，他们给买了保险的用户免费提供一个售价100美元的 OBD 设备，叫做 Metromile
    Pulse，只要用户在手机上装好同名 App，就能实时获得 OBD 采集的各号汽车运行数据。


    ![](img/812dfc825c17043226940aa4afb22b20_95_0.png)


    从安装的第一天起，你的每一次启动、每一个行程信息都会详细记录到手机里，通过互联网传到云端的服务器，所有用来计算保费的数据对客户是透明公开的。


    并且，你每天都能看到跟传统车险相比所省下的费用，这让你觉得“公平、公正、公开”，而且还划算。


    第二个方面，Metromile 在节约保费的同时，还为司机提供很多增值服务。


    你可以利用 Metromile Pulse 的 App 享受和地点相关的其他服务，如在停车场定位你的汽车，检测汽车的健康状况，提供最优的导航线路，一键寻找附近的修车公司，街道清洁的禁止停车提示以及检查汽车是否有罚单等等，总之，非常方便。


    顺便说一句：

    为什么叫街道清洁的禁止停车提示呢？

    在美国，有很多地方允许路边停车，但一周总有一个半天的时间段，这块地要做清洁，这半天就不能在这儿停车，很多人会因为忘了挪车，从而收到罚单。


    第三个方面，Metromile 还在努力培养潜在用户的使用习惯。


    如果客户下载了 Metromile 的软件，但是不想买保险，这也没有关系，Metromile 给在客户端申请的人免费送一个叫做 Metromile Tag
    的硬件。


    ![](img/812dfc825c17043226940aa4afb22b20_95_1.png)


    这个设备可以通过一种叫 iBeacon 的低功耗蓝牙的无线互联技术和手机相连，把它放到车上，也能记录各种基本信息，只不过准确度没那么高。


    其实这么做就是在培养潜在保险用户的...产生高黏性，进而成为自己未来的用户。


    ## 四、按里程计保费的优势


    了解完 Metromile 的具体操作，下面，我们来分析一下这种操作模式的优势在哪个？


    在我看来，同样有三点：


    +   第一，量身定制的保险计划让开车里程少的客户可以更加公平地支付保费，当然，行程高的人自然支付更多。所以，对保险公司来说，收入总额影响不大，反而让保费的分布更加合理；

    +   第二，在按照里程计保费的政策下，根据统计，Metromile 有超过半数的客户，有意识地减少了行车里程，这也意味着整体车险的出险率同时降低，相当于大幅节约了公司支付的保费；

