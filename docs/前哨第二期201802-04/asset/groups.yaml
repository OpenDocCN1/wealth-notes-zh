    # 155 | 创意孵化器-想法实验室 Idealab


    155 | 想法实验室-Idealab


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    +   1. Idealab 的运行模式有哪些过人之处？

    2. 在创意孵化过程中，Idealab 具体都做了什么？


    在前两天的内容里我们说过，创意产业和其他领域的创新一样，都需要其他产业链的支撑。就是说，需要合适的政策、资金、设计、营销这些全方位的配套服务。每个人都可以利用各种科技手段和平台，实现自己的梦想。


    而说到让人梦想成真的创意平台，周一的时候我们已经介绍过中国的太火鸟和洛可可，那么今天我们就说说美国的想法实验室 Idealab，看看他们是怎么帮助科技创意公司开发产品的。


    # 一、Bill Gross 和 Idealab


    相信咱260讲的不少老用户都听说过 Idealab，因为我们曾经常带中国的企业家代表团去访问过他们，而且在前咱第一季中做过介绍。


    Idealab 是1996年成立的，在美国属于是比较早的科技创业公司孵化器，20多年來孵化了大量的科技初创企业。比如我们在讲到智能文娱板块时介绍过的 ObEN
    公司，就是在 Idealab 孵化的。


    简单回顾一下 ObEN 近年的动作：


    去年5月，ObEN 跟韩国最大的明星公司 SM 娱乐集团，在香港合资设立了幻星香港有限公司，联合打造 SM 旗下所有明星的 AI 形象产品，让粉丝们可以随时和偶像互动，得到偶像的陪伴。当然，这款产品也不只局限于明星，未来每个人都会拥有自己的虚拟形象。


    在 Idealab 孵化的项目中，像 ObEN 这样的初创企业还有很多。接下来，我们就先从 Idealab 的创始人说起。


    ![](img/812dfc825c17043226940aa4afb22b20_46_0.png)


    Idealab 的创始人叫 Bill Gross，他是一位连续创业者，童年时搬到加州生活。早在高中时代，他就创建了第一个太阳能领域的公司 Solar Devices。考上加州理工大学后，他发明了一种改进斯特林发动机的装置，卖出设计后，挣到了大学第一年的学费。此后，Bill
    又创办了 KA 公司（Knowledge Adventure），这是一款多媒体的儿童教育软件，5年之后 Bill 卖出了 KA 公司，不到40岁就成了闻名整个加州的亿万富翁。


    看得出，Bill 在创业领域成绩斐然，那么，他为什么要创立 Idealab 呢？


    就是因为他经常会有很多创意冒出来，而且他认为一个企业越专注于实现某个创意，它就越有希望成功。于是，他希望建立一个工厂，既能生产创意，又能协助别人实现创意。1996年，Idealab
    就这样应运而生了。Bill 除了担任 Idealab 的创始人以外，他继续担任加州理工大学及艺术中心设计学院的董事会议成员。


    在过去的20多年里，Idealab 孵化了大概150家创业公司，其中45家成功上市或者通过收购退出，可以说是战绩辉煌。


    # 二、Idealab 的运行模式


    这不禁让我们好奇，到底 Idealab 的运行模式有哪些过人之处呢？


    第一，Idealab 采用积木式创新模式


    我们多次强调：创业公司要想成功，光有一个好的创意还远远不够，这只是其中的一块积木，还需要很多其他积木，比如搭建团队、整合各方面资源、找到资金支持等等。这些积木需要迅速配合跟协同，才能保证创业公司的成长。


    对于每一个好的创意，Idealab 都会专门成立一个新部门，相当于是一个独立的子公司，有独立的负责人、研发经费和资源支持。


    创业公司 CEO 不仅能够得到 Idealab 提供的全套服务，比如技术研发、产品设计、市场营销、财务咨询、人力资源、法律会计等等，CEO 和创始团队也能拥有股权。也就是说，创始人的创意可以充分被重视和实践，赚了钱后还能享受到股权收益。这样一来，创始人的积极性不会打折扣。


    当然，既然是积木式创新，就需要提供可替代性。也就是如果发现某个模块不适合，Idealab 会协助团队迅速找到可更换的资源，其中也包括创始人。因为创始人的创意可能是非常好的，但却不一定是一个好的掌舵者。


    总之，靠着这种积木式创新模式，Idealab 营造了一种专业、具有契约精神的合作环境，每个角色各尽其责，提升转化效率。


    第二，Idealab 会进行项目控股


    其他孵化器占项目的股份一般不会超过10%，比如，Y-combinator 只占6%左右，LaunchBox Digital 更少，只占4%左右。而 Idealab
    只会给投资人和创始人各25%的股份，剩下的全由自己控股。这样控股不仅可以让 Idealab 在退出时得到好的收益，还能在企业发展初期享有充分的决定权。


    不过，这种情况不太可能发生在咱中国。


    因为在国内，一般创始人对创业的成败起到决定性作用。如果创始人换了，或者创始人的股份太小了，项目基本上就无法顺利进行下去，不 đương初的创意有多棒。我认为最大的差别是心态，尊重契约精神或者叫愿赌服输的心态。


    在美国，Idealab 认为自己不是在和创业孵化器竞争，而是在和大公司的新产品开发部门竞争，Idealab 孵化项目的 CEO 虽然不控股，但至少拿股权，比起不拿股权却同样做新产品开发的大公司的部门强多了。


    顺便说说：


    我们投资的公司的 CEO，也有很多经过多轮投资稀释到了小股东的地位，但这些毫不影响他们的工作热情，因为他们说，如果公司成功上市或卖出，小股东一样赚很多钱啊。而在中国，创业公司的
    CEO 会觉得我能决定公司的生死，我付出也最多，如果不让我占最大股份，我就一定不干。


    # 三、Idealab 的全方位支持


    你可能会觉得，如此强大的 Idealab，为何那些投资人和创始人还是愿意合作呢？


    而且，像 Idealab 这样的孵化器，还总会有海量的创意源源不断地出现，那么面对这些创意，Idealab 又具体都做了什么呢？


    第一，创始人 Bill 本身具有广泛的投资视角，孵化项目涉及领域比较广泛，覆盖太阳能、清洁技术、AI、教育、安全以及创意行业。


    你可能很难想象，这其中90%的创意，都出自 Bill 和他的团队。他们经常自己挖掘创新方向，通过市场调研和竞争分析，建起一个初步模型，然后再招募 CEO 来共同组建公司。


    当然，Idealab 也不拒绝外来的优秀创意，对于好创意，Idealab 会安排 CEO 和核心管理团队，为创意保驾护航。


    第二，在帮助企业找对方向、选好 CEO 之后，初创企业还要找到合适的团队，并找到各种需要的资源。关于这一点，Idealab 会帮助企业做招聘，迅速搭建核心团队。


    另外，Idealab 还会提供办公共享服务，比如提供办公空间和基本管理的服务。这样就能让核心团队完全专注于产品的开发和营销，尽量避免被琐事分散精力。不仅如此，Bill
    还借助加州理工董事的人脉关系，获得了来自顶尖科研机构的技术支持。


    第三，在资金支持方面，Idealab 具备直投能力'
