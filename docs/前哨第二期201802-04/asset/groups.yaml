    除了这两位创始人之外，Lemonade 还把杜克大学的行为科学家 Dan Ariely 教授聘了过来，这位 Dan Ariely 就是《怪诞行为学》的作者丹·艾瑞里，是现在全球行为经济学专家里年轻一代的代表。


