    # 140 | 如何把握社群经济中的机会？


    140 | 如何把握社群经济中...


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 为什么说社群经济的机会中存在陷阱？

    2. 为什么说社群的秘诀在于“个性化”？

    3. 传统的产品销售如何利用社群突出重围？


    今天我们来讨论社群经济的机会和风险。


    其实社群经济最大的一个特点，就是能给普通人赋能。过去，除了大牌明星以外，一个普通人想要拥有自己的粉丝群体几乎是不可能的，更别说还让他们甘愿为自己买单了。但是，基于社交网络的社群经济出现以后，就相当于给普通人提供了流量入口，让普通人也能拥有一群粉丝。而且这些粉丝还具有统一的身份同感，这也让他们更紧密地团结在“网红”周周。


    # 一、机会中的陷阱


    听起来这是个非常吸引人的机会，但其实，给普通人赋能也恰恰是社群经济最大的一个陷阱。


    为什么这么说呢？


    你看，随着社交网络的全面覆盖，建立一个传播渠道的门槛并不高。只要申请一个微信公众号、开通一个直播间或者其他平台账号，就可以开始向粉丝输出你的内容了。


    但门槛一低，自然就会有大量竞争者出现，这个问题可以说相当普遍。在商业里，当很多人都能以很低的门槛进入时，看似满天飞的机会可就不一定是你的机会了。


    实际上，成功的社群都要依赖高质量的内容和高品质的运营，所以，怎样保证持续的、高质量的内容生产，是每个内容社群都都要面临的问题。


    要想抓住社群经济的机会，就必须认真思考如何充分利用自己的优势，培养和运营好一个社群。那么接下来，我们就重点来说说如何培养和运营好一个社群。


    从战略角度来看，社群成功的秘诀在于“个性化”。也就是说，你可以为用户提供独特的内容和价值。


    比如，我们周一提到的健康饮食社群“好好吃饭”。他们就通过不断分享健康饮食方面的干货来吸引用户。这些文章的专业性、全面性和可读性都做得很好，因此一种健康向上的生活方式就成了他们独特的气质。而被这种气质所吸引的用户加入之后就会形成黏性，成为“超级用户”。所以，必须足够有“个性”，你才能够有足够的吸引力。


    # 二、男士形象指导公司Alpha M.


    至于战略具体应该如何实施，还是通过一个例子来分析一下，这里我们介绍一家名叫 Alpha M. 的公司，是2006年的时侯由时尚专家 Aaron Marino
    成立的，业务是男士形象指导。


    当时，Aaron 注意到市场上并没有针对男士形象的高质量咨询服务，他自己又恰好在这一方面有一些理解和想法，然后就制作了一些关于改造男士形象的视频，传到了 YouTube
    上。顺便说一下，2005年 YouTube 刚刚成立，所以2006年它已处在平台化阶段，获得关注的成本很低。正好 Aaron 提供的內容迎合了市场需求，所以他的粉丝数量增长非常快。


    敏锐的 Aaron 从这里看到了商机，他注册了 Alpha M. 公司和商标，并开始不间断地在 YouTube 上发布视频。Alpha M. 在 YouTube
    上提出的口号是“帮助你每时每刻成为最好的自己”，这样一句口号迎合了大量缺乏自信的男性用户群体，也让这群人拥有了共同的追求和信仰。


    到目前为止，Alpha M. 频道已经拥有300多万订阅用户和700多个视频，并且还在以每周3到4个视频的速度增长。


    除了在 YouTube 上不断更新内容和反复强调那句富含煽动性的口号外，Aaron 还建立了自己的个人网站来销售一系列原创课程。同时，依靠在 Alpha M.
    上的健身内容，Aaron 还给自己创办的健身房招来了第一批用户。


    另外，Aaron 还会在视频中销售一些其他小商家生产的产品，最近他还推出了自己建立的男士护发品牌 Pete & Petro，通过扩大产品范围，获得收入的同时也提升了自己的影响力。


    Aaron 不单注重跟用户的互动，还很重视跟其他男士用品商家的合作。从2014年开始，Aaron 就发起了 Menfluential 的商务会议，这场会议的主题是探寻男性的生活方式。这吸引了很多商家的参与，借此，Aaron
    和商家们建立了良好合作关系，也形成了一个商业社群。这个社群可以帮助 Aaron 给自己的用户提供更多高质量产品，同时也拓展了 Alpha M. 的可能性。


    总结一下，从 Alpha M. 的例子中我们可以看出，Aaron 的策略是先依靠内容聚集粉丝，形成自己的用户数量优势。然后，再通过视频营销和 Menfluential
    会议等方式跟其他商家共同形成“商业社群”。这其实就启示创业者，不仅要运营好自己已有的用户社群，还要有拓展的眼光，跟其他公司共同组成“商业社群”，争取达到“1+N”的互补效果。


    # 三、传统产业新玩法


    当然，不只是依赖互联网形成的网络社群能够带来无限可能性，传统产品销售也可以依靠社群经济突出重围。


    相信大家对江小白肯定不会陌生。我们都知道，江小白白酒的特点是：神似二锅头的笑瓶包装，以及杰出的包装文案。


    当白酒市场中的其他竞争者都在把数以亿计的资金砸向广告时，江小白凭借社群运营和品牌营销，从默默无闻一步步成长为青春白酒代言人，它的销量在5年内从0增长到了10个亿。江小白之所以能够这么成功，就是因为它抓住了年轻人群体的特点，用精心设计的文案和独特的卡通形象把自己的品牌深深地印在了消费者心里。


    下面，让我们具体来看看它是怎么做约。


    首先，江小白设计了一个卡通形象，是一个帅气男生，他长着一张大众脸、鼻梁上架着无镜片的黑框眼镜、脖子上系着英伦风的围巾、身上还穿着休闲小西服。


    重点来了，这个卡通形象旁边都会配有一段文案，仿佛是出自卡通人物之口，而文案的创作正是江小白社群运营的核心所在。


    ![](img/812dfc825c17043226940aa4afb22b20_13_0.png)


    众所周知，很多传统名酒分了大部分中国市场份额，比如茅台、五粮液、汾州老窖等等。正是这样，后期品牌能够发掷的空间都不大，很多新兴品牌尽管奋斗多年，但依然无法撕开一个市场的缺口。


    一般来说，传统大牌白酒给我们留下的印象是：深厚的白酒文化、圆桌文化、父辈交际必需品，以及跟年轻人无关。


    而江小白就是重新定义了一个市场空间，那就是：让年轻人喝白酒。迎合年轻人的最重要手段，就是江小白的文案。


    我们简单听听江小白的几句文案：“我把所有人喝趴下，就为了和你说句悄悄话”“手机里的人已坐在对面，你怎么还盯着屏幕看”，这些文案都堪称字字句句用心、句句经典。


    江小白把目标人群定位为“有情绪”和“青春”的年轻群体，这群年轻人大多数刚毕业走进社会，事业还没发展稳定，友情和爱情也正经受着巨大的考验。在充满了情绪却无处释放的时候，江小白恰好给了他们一个宣泄的渠道。甚至有人为了集齐江小白的瓶身文案，跑遍了全重庆的火锅店和便利店。


    很多人都诧异：江小白的这些文案都是从哪里来的？是高薪聘请了大神级的文案写手？还是厂家老板自己的灵光一闪呢？'
