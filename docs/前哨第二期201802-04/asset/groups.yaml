    那最后的40%，则会放入正常的理赔资金池，当客户的保险到期时，理赔资金池中剩余的这些钱就会按照客户的意愿捐赠给慈善和福利机构。


    因为 Lemonade 已经从客户的保费中抽取出20%作为运营开支，所以只要他们的运作成本能降低，那么降低的部分就是纯利润了。


    # 4. Lemonade 的公司架构


    上面我们说完了 Lemonade 的创始人、产品和资金运作模式，那最后我们稍微讲一下 Lemonade 的公司架构。


