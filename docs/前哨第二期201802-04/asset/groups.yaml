    # 166 | 如何把握普惠金融发展的机会？


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. 互联网金融机构的机会在哪？

    - 2. 普惠金融如何利用区块链技术？

    - 3. 小企业如何把握普惠金融的机会？


    昨天我们讲了蚂蚁金服，它让我们每个人都可以用极低的成本享受到以往大机构才能提供的金融服务，给了大家用资本作为杠杆，从而创造和增值财富的机会。


    那么，对于我们每个人来说，构建和积累终身的个人征信是必然的发展趋势。自然地，信用水平越高，能享受到的金融服务和产品就会越多。


    # 一、打造“个人信用体系”的趋势


    我先跟你分享一个新闻，就是今年2月底，国内首张个人信用征信牌照下发，这就意味着打造个人信用体系已经成了趋势。获得牌照的“百行征信有限公司”俗称“信联”，它是由中国互联网金融协会牵头，和芝麻信用、腾讯征信、深圳前海征信等8家市场机构共同出资成立的一家市场化的个人征信机构。


    大家都知道，除了传统的商业银行，市场上还有很多互联网和民间的借贷机构。但是，咱们的央行征信中心只有每个在商业银行的信用记录，这其中可能有两个原因：


    - 央行认为只有商业银行的信用记录是可靠的；

    - 很多民间借贷机构并没有拿到国家发布的小贷牌照，因此不会上报到央行征信记录中。


    这就会造成央行征信的“信息孤岛”现象，给那些用心不良的借贷者留了空当，比如说常见的“一 人多贷”、“以贷养贷”等行为。但是现在信联成立了，这就能在很大程度上弥补央行征信中心在个人信用信息方面的欠缺。


    和央行个人征信系统相比，信联在数据源和数据结构上会有比较明显的不同，尤其是在人群覆盖上可以更加多元化。这带来的最大的好处是，把央行征信中心没能覆盖到的个人也覆盖进来，纳入到他们的金融信用数据库体系里，构建一个国家级的信息全面的基础数据库。


    那这意味着什么呢？


    也就是说未来，一个人不管是向传统的银行贷款，还是向民间借贷公司、P2P平台进行贷款，不管你是做生意，还是交朋友谈恋爱，只要涉及到金融，你都别想再隐藏任何不良的记录了。这将成为普惠金融良好发展的一个非常非常重要的基础。


    # 二、构建个人信用平台


    那么下面重点来了，我们来说说科技在推动普惠金融发展的过程中，还会涌现出哪些机会。


    首先，对于互联网金融机构来说，构建一个能终身积累的个人信用平台，然后随着个人客户信用的增长，把金融服务的水平也逐渐提高起来，就能获得更大的发展机会。


    昨天的內容里我们就聊过，在蚂蚁金服的信用平台上，积累了大量的个人消费和收入数据。通过分析数据和个人信息，建立风险控制模型，就能让每个人都拥有一个“量身定制”的信用指标，这就是“芝麻信用”，相信很多人已经享受到它带来的便利了。


    那么，金融市场早已成熟的美国现在又是什么情况呢？


    可以说，美国的个人征信体系是很完善的，现在主要有三家机构，分别是：


    - 全联公司（ Trans Union ）、艾奎发公司（ Equifax ）和益百利公司（ Experian ）。


    这三家征信公司一起覆盖了全美超过2亿成年人 的信用资料，市场份额达到了95%。而这三家公司都使用个人消费信用评估公司费尔艾萨克公司推出的信用评分模型——FICO。


    那么我们来比较一下FICO信用评分模型和芝麻信用有什么区别。


    FICO在计算个人信用分数时采用了5大指标，这和芝麻信用是一样多的，但具体指标的内容是不同的。


    - FICO是：付款历史、欠款数额、信贷历史长度、新信贷账户情况以及在用的信贷类型；

    - 芝麻信用是：信用历史、行为偏好、履约能力、身份特质以及人脉关系。


    根据这些个人的征信数据，FICO也通过分数对消费者的信用进行评分，分数在300~850分之间，分数越高代表消费者信用程度越高。按照分数可以分成5个等级，分别是：


    - 1. 有风险的借款者；

    - 2. 消费者在信用评分的均值以下，但银行仍然可以考虑给他贷款；

    - 3. 信用良好的消费者；

    - 4. 非常可信的消费者；

    - 5. 信用绝佳的消费者。


    # 三、利用区块链技术


    接下来，我们也讲一下火热的区块链技术，因为一套信用评价体系要得到认可并持续维持下去，最重要的是解决公平和安全的问题，而这正好是区块链技术的优势，谁能利用好这个技术，谁就能在普惠金融市场获得更大的可能性。


    很多人可能并不了解，其实普惠金融和公益援助有共通之处，比如说：它们的服务对象都是社会中相对的“弱势群体”，特点是基数都很大。如果想进行切实的服务，就需要严格的监管和审查，避免腐败和赃污的发生。


    分布式记账系统，则保证了身份数据的唯一真实性，以及交易数据的去中心化、不可篡改性和可追踪性。


    另外，救援机构通过区块链技术，直接向销售商付款，不需要再经过第三方的机构，保证了交易的透明，避免了腐败现象，为整个援助项目节约了98%的管理成本。


    这还带来另外一个好处，就是获得了更高的可信度和权威性，减少了质疑。


    通过这个例子，我们就能看出，科技公司可以积极地运用区块链技术，然后结合生物验证手段，比如说虹膜、指纹验证等等，再加上个人征信信息，就能建立起一套完整、安全、可追溯的记账系统，这一定能让普惠金融的各种项目更安全、成本也更低廉，真正地惠及到普罗大众。


    对于中国来说，现在很多年轻人的“超前消费”欲望强烈，对于小额现金贷的需求非常大，P2P现金贷就是应用场景之一，创业者以及相关的从业者一定要重视区块链技术的应用。


    比如芬兰赫尔辛基大学法学院毕业的 Stanislav Kulechov，他就运用了基于以太坊的区块链技术，成立了一家 P2P借贷的互联网金融公司 ETH Lend，发行了
    Lend 币。


    他们让借贷不再需要一家中心化机构，也就是银行或第三方机构，而是把贷款者和借贷者通过平台直接连接了起来。


    首先，借贷者在平台上发布借款请求，这个请求相当于智能合约，里面要写上借贷的金额、时长和利率。同时把其他一些虚拟货币作为抵押物加入到合约当中，通常就是用以太坊。这样一个合格的借款合约就产生了。之后贷款人只要觉得合约合适，就可以把资金以虚拟货币的方式转账给借款人，一笔借贷交易在几秒钟之内就能完成了。


    由于整个系统都是去中心化的，所以合约并不保存在某一个具体的中心化服务器中，就算是 ETH Lend 平台也无法将智能合约中的抵押物取出。因此也就保证了借贷双方资金的安全。同时，ETH
    Lend 平台还会根据借贷双方的信用评级进行双重保险。这样就可以实现全球范围内小额度的 P2P 借贷业务了。


    总结一下：


    普惠金融的机会存在于建立一套强大、可靠的个人信用数据平台，挖掘细分的

    应用场景，以及积极利用科技手段提高

    过程的安全和效率。


    # 四、小公司的机会


    刚才我们说到，把征信体系和商业应用结合，是最大的机会。然而，事实上这也会带来垄断的趋势。


    在商业上，那些已经非常成功的企业，它们对于整个供应链的掌控能力都是非常强的，它们可以把积累的大量数据用来构建自己的信用体系，然后到金融领域中进行拓展，在这个过程中，大量最新的商业数据还能不断优化信用体系。


    可以说，在建立个人征信系统方面已经成功的企业，它们的优势非常明显，在参与到某个具体领域的业务时，也就更有竞争力。尤其是在量化指标以后，它们的客户画像精确，转化率也较高。也就是说，无论在信用体系还是商业领域，只要在一个方面占有了垄断优势，就极有可能赢者通吃。


    对于互联网金融来说，它的市场可以分成个人征信业务和小微金融业务这两块。


    对于创业者来说，由于初创企业往往拿不到大量、全面、系统且精确的支付细节及信用数据，因此做个人征信业务将会成为初创企业的陷阱。


    而借助国家发布的征信平台，结合自身对于细分产业的了解，创业公司可以将目光放到细分领域中进行“精耕细作”，同时也可以将落脚点放在如何辅助这些在某一方 面有垄断优势的公司上，做它们的“智囊团”和“服务商”，这也还是有一定发展空间的。


    # —— 今日内容小结 ——


    总结一下，今天我们介绍了普惠金融的机会，希望你掌握以下3点：


    第一，对于互联网金融机构来说，最重要的是建立一套强大、可靠、数据量足够大的个人征信数据平台，再结合细分的商业场景，发掘发展机会。


    第二，区块链技术会逐步发展成为互联网金融机构的基础设施，可以尝试将区块链技术与金融业务相结合，建立一套完整、安全、可追溯的记账系统，降低交易成本，更安全地发展普惠金融。


    第三，总的说来，征信体系和商业应用结合是最大的机会，然而这也带来了垄断趋势。只是在一个方面占有垄断优势，就极有可能全面占尽先机。对于征信系统优势不明 显，而且商业上还没有到“独角兽”级别的公司，机会并不显著。因此创业公司要积极思考如何辅助大型互联网金融公司，做它们的“智囊团”和“服务商”。


    # —— 今日思考题 ——


    你认为区块链技术在互联网金融行业中的应用机会还有哪些呢？


    欢迎在留言区分享你的观点。


    # 划重点


    1.对于互联网金融机构来说，机会在于建立一套强大、可靠的个人信用数据平台，随着个人客户信用的增长，把金融服务的水准也逐步提高。

    2.对于创业者来说，可以将目光放到细分领域进行“精耕细作”，也可以将落脚点放在如何辅助有垄断优势的公司上，做它们的“智囊团”和“服务商”。

    3.一套信用体系要得到认可并持续维持下去，最重要的是解决公平和安全的问题，谁能利用好区块链技术，谁就能获得更大的可能性。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我们明天见。


    # 用户留言


    提交留言可与专栏作者互动


    # 167 | 正确认知投资风险


    # —— ◆ 全周总结 ◆ ——


    本周的话题是普惠金融，我们介绍了三个重点：


    第一，在任何相对平穏的社会阶段，资本回报的增长率，总来讲都大于整个社会价值的增长率。所以，大家要积极利用金融工具，充分发挥资本的杠杆作用，实现资本的增长。但是，千万不要承担超出自身抗风险能力的金融服务，因为杠杆越大，风险也随之增加。


    第二，普惠金融背后有两个重要基础：


    - 一是良好的个人信用，并且终身不断积累和维护；

    - 二是与个人实际情况相匹配的风险承担能力。


    我们总觉得从事金融活动的标准是资本，所以总以为只有富人才能从金融活动中获利。但是，从事金融活动更重要的一个因素是信用，穷人也能很讲信用，完全可以获得和实际需求相匹配，也和自己的抗风险能力相匹配的金融服务。


    第三，征信体系和商业应用的结合是最大的机会，类似于蚂蚁金服这样的可量化的信用平台，为实现信用等於财富的梦想提供了可靠的信用保障。未来，类似的新型银行将迎来蓬勃的发展。


    但是，也会带来 overlapped 的趋势，只要在一个方面占有差异优势，就极有可能全面占尽先机，征信系统优势不明显，而且商业上还没有到独角兽级别的公司机会并不显著。


    因此，创业公司要积极思考，如何利用大型互联网金融公司提供的信用系统，如何辅助大型互联网金融公司，做它们的智慧团和服务商。


    # —— ◆ 用户答疑 ◆ ——


    金融其实并不能让风险消失，只能转移风险，未来的个体风险有可能降低，但系统性风险出现的几率可能更高。而一旦出现又会波及所有人。未来如何避免出现系统性金融风险，对于不从事金融行业的普通人，在面对金融市场的时候，如何才能实现自己的财富积累？


    我的回答是：


    个体风险降低的时候，系统性风险不必然升高。比如银行业，个人存钱到银行收取固定利息，风险降低了，但是银行负责放贷，所以银行的系统风险升高了。


    不过这是过去，现在是 P2P 信贷，平台只负责撮合，所以它的风险大大降低了。但是，平台也利用大数据提供贷款人的信用，使得放款人的风险并不升高，或者风险升高的时候，回报也会随着提升。


    也就是说，科技能够使得个体风险降低的时候，整体系统性的风险并不升高。没有科技，鱼与熊掌不可兼得。但是科技就是要提升整体水平，要做到鱼与熊掌是可以兼得的。


    当然，随着金融科技的发展，资本流动性大大增高了，各个领域的金融壁垒消失了，传统的把鸡蛋放在不同篮子里的模式就失效了，所以这就是你说的系统风险增高的原因，其实这不是个体转移风险造成的，而是金融科技的发展和资本流动性的提高造成的。


    这也是08年金融危机的原因，因为次贷危机击破了房产市场，以前出现次贷危机这样的情况，基本上只会使得房产市场受损，而不会波及到其它行业。但是现在，金融流动性增加以后，次贷危机击破了房产市场，使得其它各个产业都出现了危机。


    反之，我们会在下周的资产管理里面介绍美国的高校基金，其实它们的特点就是另类资产配置比例特别大，说的更明白一点，其实所谓风险有两重含义，我们往往把这两者混淆起来。


    - 一个是没有人能够了解，能够掌握的波动性很大的一件事务的内生的风险；

    - 另一个是多数人不了解，需要很多专业知识，但是可以被掌控的外部人看起来的风险。


    其实成功的投资人都是规避第一种风险，而投身到第二种风险的领域，并把自己变成专家的。而一旦你成为专家，这第二种风险根本就不是风险，反而是机会。


    比如说，我曾经发现，全球任何的经济体，经济一好转，进口葡萄酒的销量就飙涨，尤其是进口法国葡萄酒，涨幅大大超过经济增长的水平。所以08年开始做天使投资的时候，投资了逸香葡萄酒公司，它是全国最大的葡萄酒教育机构，结果这成了我们最成功的投资之一。


    所以我们一直强调：


    每个人都有自己的长板，在你自己的长板领域，你的风险当然就比别人小得多。当然，作为普通的投资者，一个擅长的领域也没有，那我就学会识别哪些领域可能是系统风险小，但需专业知识的领域，然后识别出来谁是这个领域的专家，然后跟着他投，或者投资给他。


    人们与生俱来的贪婪与恐惧，使得大部分人在投资时属于“冲动型”投资，对于风险的评估以及风险的承受能力表现为过度自信。那么政府如何干预普通市民的风险承受呢？


    我的回答是：


    全球都是设置准入门槛的，但是现在准入门槛的设置有一定的问题，只能是用钱来约束。比如要投资未上市企业，必须是合格投资人，就是你能证明你的流动资产在100万美金以上。


    我们投资了 AngelList，它是美国最大的股权众筹平台，AngelList 呼吁了很久，请美国政府放低限制，也就是说合格投资人的限制能不能从100万降到50万，但是到现在也还没放低。


    不过，这种限制在国外大抵可行：


    - 一是钱多的人自然就赔得起；

    - 二是严格管理了，没有经过认证的人，你卖股权给他，卖方要承担很大的责任。所以，只有有钱的人才能做未上市的股权投资；

    - 三是其实如果眼光好，信息相对完备的股票市场的回报，甚至超过股权投资的回报。


    所以你会看到，现在全球的首富是巴菲特，而不是哪个风险投资人或者是哪个风险投资基金的掌门人。所以没有必要对所有人开放那个风险很大的，未上市公司的股权投资市场，因为如果你想投资，钱又不够多，风险承受能力又不够，但是你又想获得足够高的回报的话，你去股票市场，按照是有机会的。


    当然，前提和我们上一个问题说的一样，就是你得是专家。所以，哪个领域想要有成就，首先应该是专家。


    当然，我们前一个问题讲到了，这个股权投资的风险是第二种风险，大多数人不懂，但是非得要投。但是，其实如果你懂的话，资本不够也挡不住你，你其实也可以投。


    什么意思呢？


    就是如果你真懂，当然是你的人脉和资源都足够了，然后你就可以直接找到这家你想投的公司，软磨硬泡，当个联合创始人，给人家提供资源，提供人脉，顺便再投点钱。如果你是联合创始人话，你投1块钱都可以，当然就没有那个合格投资人的限制了。


    那这时候你会说，你说我不认识他们，怎么可能当联合创始人呢？


    那我就问你了，这种股权投资，你不认识他们就敢投资吗？我们专业的投资人做股权投资的时候，都是要去认识创始人，认识团队，甚至认识他们的家里人，然后才敢做投资的。所以这块不得不感慨，我们中国人对专业性的强调太不够了，都喜欢自己来投资。


    我们经常开玩笑说：


    投资就像谈相声，会说话的人都觉得自己会说相声，而赚过钱的人，不管赚多赚少，不管是持续赚到的，机会赚到的，还是能力赚到的，都觉得自己会做投资。


    的，还是能力赚到的，都觉得自己会做投资。


    所以，我的建议是，和国外一样，一定要设置准入门槛。现在看起来最好的办法就是设置资本准入门槛。


    当然，如果未来找到更好的办法了，比如说能够精确地衡量你对一个事情的了解程度，那么最好是设置专业准入门槛，也就是说你对一件事情了解得足够专业，你就可以进入，如果不够专业，就不行。当然，不管什么门槛，我们都认为，必须要严格执行，破坏规则的要严惩。


    至于说ICO，其实就是变相融资，而且还不说明你占了多少股权，所以我认为，对ICO的监管至少要和股权融资的门槛一样，要设置一个合格投资人的准入门槛，非职业人士还是算了吧。


    王老师，Lumentum 以18亿美金收购Aclarо，您怎么看？


    # 我的回答是：


    首先，我很喜欢这种和时事相结合的问题，欢迎大家以后多提，这样我在回答问题的时候顺便还能把时事点评做了。


    熟悉我们前哨的朋友都知道，我在iPhoneX刚出来的时候就提醒大家注意Lumentum，不过我说完之后，它的股价应声下跌。幸好，因为苹果的合作，Lumentum的业绩表现得还很强劲，最近股票涨了70块以上。


    其实现当初Lumentum股票下跌，是因为它的激光点投影背后的那个核心技术，叫做垂直共振腔面型激光 VCSEL，叫Vertical Cavity Surface
    Emitting Laser。当然，不给大家详细解释这个技术了，只是简单说，这个技术原来主要是用在光通信上的。整个2017年，全球的光通信市场都不景气，据说尤其是来自中国的订单锐减。


    # —— 下周预告 ——


    我们下周的话题是资产管理。


    我们常常听一句，叫“你不理财，财不理你”，如果你能很好地打理自己的资产，不仅仅能抵抗通货膨胀造成的货币贬值，甚至还能使自己的资产实现大幅增值。


    # 划重点


    - 1. 每个人都有自己的长板，在你自己的长板领域，你的风险当然就比别人小得多。作为普通的投资者，如果没有擅长领域，就要学会识别专家，然后跟着他投，或者投资给他。2.
    依据技术和市场作预测，有时会超前于股票表现，股票跌了，正好继续买进，这样可以拉低你购买的均价。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，咱们下周见。


