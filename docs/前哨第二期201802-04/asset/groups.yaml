    我们海银资本这几年一直在做海外高科技企业的投资布局，这个事情也得到越来越多的认同和支持。


    前不久我们和光大控股一起组建了一个新的基金，叫光控海银。它是以海银资本全球高科技项目为基础，以光大控股的产业投资能力为后盾，推动全球的高科技原创技术与中国行业龙头企业的产业融合。


    投资方向将专注于全球未来创新科技领域的公司，重点是在新能源、医疗健康、人工智能和机器人、新材料、计算机与电子、航空航天等创新领域当中具备领先科技的企业。


    现在我们希望招募志同道合的人加盟，一起把这个事情向前推进。


    关注我们“全球风口”微信公众号，回复“光控海银”或者“招聘”这两个关键词，就可以看到相关的信息。


    ### ——全周总结——


    本周，我们的话题是资产管理，介绍了三个重点：


    第一，随着经济的蓬勃发展，新兴中产阶级的兴起带来了资产管理需求的新浪潮，然而传统的资产管理机构却无法满足这个群体的需求，因为传统资产管理机构 acquired...高净值人群作为用户群体，高昂的投资进入门槛以及投资管理费用将新兴中产阶级拒之门外。


    智能投顾恰恰就是看到了这一痛点，充分利用技术的手段，降低资产管理的门槛，将普通人的财富汇聚起来，实现财富升值，从而打开了华尔街的大门。


    ### ——用户问答——


    如果全部把资产交给机器管理，大家的水准平均会趋于相近，那会不会陷入失衡困境，最后众人皆输的局面呢？我的回答是：


