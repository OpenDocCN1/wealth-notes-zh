    # 180 | 如何用行为科学预防慢性病？


    ## ——今日内容看点——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    - 1. Sean Duff 是如何建立起 Omada Health 公司的？

    - 2. Omada 开发的产品 Prevent 有哪些特点？

    - 3. 如何才能真正帮用户得到相应的行为改变？


    今天我要给你介绍一家数字医疗科技公司 Omada Health。和我们昨天提到的重资产型的凯撒集团不同，这家公司旗下没有一家医院。


    Omada Health 主要是运用行为科学、大数据以及健康顾问定期咨询相结合的方式，帮助用户建立良好的生活习惯，从而预防慢性病对身体健康的危害。


    ## 一、利用“团体力量”


    周一时我们就已经提到，影响人们健康和生存质量的因素当中，生活方式占60%，所以健康的生活方式非常重要。但健康的生活方式本质上是反人性的，普通人想要做到实在很困难，外界的诱惑那么多，明知道抽烟、喝酒不好，但就是很难通过自控力来杜绝它们。


    面对这种情况，往往就需要借助组织的力量。


    以戒酒为例，在美国最著名的戒酒组织就是戒酒互助会，简称 AA，全称是 Alcoholics Anonymous，AA 会定期在某个城市举办聚会。在聚会上，会员们诉说自己的戒酒经历，并通过其他会员的鼓励、赞许获得力量，把戒酒坚持下去。对于坚持戒酒的会员，AA
    还会根据他们坚持的时间颁发不同的勋章。


    这种团体的力量是巨大的，AA 也在美国取得了巨大的成功。目前，AA 正在帮助120万人进行戒酒，而且这个数字还在不断上升。


    那么，我们也可以根据戒酒互助会的经验，把“团体力量”运用到慢性病的预防和治疗中，来监督患者。


    而我们今天要介绍的 Omada Health，就是把科技和“团体力量”结合起来，把原来只能靠“面对面”交流的健康管理手段，搬到了可以规模化的数字医疗平台上。


    ## 二、命中注定的医疗科技之路


    要了解 Omada Health，还得从它的创始人 Sean Duff 说起。


    用 Sean 自己的话来说，他从小就是一个“严重的计算机书呆子”，对科技非常痴迷。Sean 的妈妈是一位护士，所以 Sean 从小就对医疗知识耳濡目染。


    2003年，Sean 进入哥伦比亚大学学习神经科学，大学期间他完成了所有医学预科的资格考试。


    但在2006年本科毕业时，硅谷正处于爆发期，谷歌几乎以每年翻倍的速度在招聘人才，软件的力量也被逐渐开发出来。而 Sean 也逐渐发现，他对计算机技术的追求超过了去医学院深造的冲动，最终
    Sean 选择加入谷歌。


    在谷歌工作的这段时间，Sean 意识到，真实世界比信息技术世界要复杂得多，里面的问题也要深刻得多。


    由于既有医学知识、又有技术背景，Sean 萌发了把医疗保健和科技结合起来的野心。但是要做成这件事，他必须既懂医疗、又懂商业，于是 Sean 申请加入了哈佛大学商学院和医学院合办的项目
    Harvard MD-MBA Program，这个项目的目的就是培养既精通医学，同时也精通管理学的医生领导。


    在这个过程中，Sean 又作为健康领域的专业顾问加入了一家叫做 IDEO 的设计咨询公司。他因此有很多机会跟 CDC，也就是“美国疾病控制与预防中心”的人打交道，而
    Omada Health 正是在这个过程中成立的。


    ## 三、从项目到公司的完美蜕变


    下面我们说说 Omada Health 的业务。


    他们的主要客户是那些有可能得糖尿病的 人，这些人的血糖比正常水平要高，但又还没有达到糖尿病的水平。


    Sean 曾经在演讲中提到，说当时在美国有8500万的糖尿病早期患者，如果不进行预防或治疗，就很可能转变为糖尿病。


    那么为什么 Sean 会选择糖尿病作为创业突破口呢？


    这就要说到1996年的一个研究项目了。


    1996年，美国国家卫生研究所开始了一个研究项目，叫“糖尿病预防项目”，简称 DPP，是 Diabetes Prevention Program 的缩写。


    DPP 项目做了一个实验，把3000多名高血糖测试对象分成三组：

    - 第一组，给安慰剂；

    - 第二组，给了二甲双胍，这是一种治疗糖尿病的常见药物；

    - 第三组，则参加了“生活状态干预计划”，这个计划的任务是：以减重7%为目标，每周至少进行150分钟的身体锻炼。


    DPP 研究组跟踪了这些人大概3年，结果令人大吃一惊：

    - 3年后，使用安慰剂的病人100个人中有11个患上了糖尿病；

    - 使用二甲双胍的这组有7.8人；

    - 而参加“生活状态干预计划”的那组却只有4.8人患病。


    2010年，经国会任命，美国疾病防御控制中心 CDC 开始掌管 DPP 计划。


    跟 CDC 的交流让 Sean 意识到 DPP 研究的重要性，但同时他也发现了一个问题：


    就是研究中的样本只有3000多人，所以像戒酒互助这样进行“面对面”的干预不成问题。但这种模式放到全国超过8500万人身上，可就玩不转了。


    想想看，全国哪来那么多地方？哪来那么多医生呢？8500万人的参与度是多少？那该怎样在全国范围内推行 DPP 呢？


    答案是：借助科技的力量。


    于是，2011年 Sean 创立了 Omada Health，公司的第一代产品 Prevent 就是基于刚才提到的 DPP 项目的研究成果开发出来的。


    Prevent 的核心逻辑就是：

    - 把已经在临床试验中被证明有效的“生活方式干预项目”通过科技进行数字化和规模化，让用户可以通过简单的训练掌握这套工具，并用它来改变、监控自己的生活、饮食、健身方式，从而降低发生糖尿病、高血压，以及各种心血管疾病的概率。


    可以说，Prevent 对用户的筛选是非常严格的。


    在注册阶段，用户就要填写很多个人信息，包括身高体重性别、饮食运动习惯，以及是否已经患有糖尿病和高血压，有没有上述疾病的家庭史等等。


    Prevent 会通过这些信息来筛选用户，它希望做到把目标放在那些真有必要，而且可以去干预的用户身上，尤其是身体史的肥胖患者。


    至于已经得了糖尿病的用户，Prevent 会明确说明，这套方案不适合他们。


    ## 四、Prevent 的“4+4”体系


    那么这款产品究竟是如何帮助用户改变生活方式的呢？


    Prevent 的组成部分可以通过“4+4”来表示，两个“4”分别代表4个阶段和4大组成部分，这套体系的效果得到了医学界的承认。


    从2014年到现在，Omada Health 已经在临床医学期刊上发表了9篇论文，获得了临床医学界的认可。目前，Omada Health 已经有超过10万用户，注册人数还在不断扩大。


    - 改变饮食习惯；

    - 提升运动强度；

    - 让用户拥有正确的心理调整能力；

    - 教用户正确地应对周围的环境。


    - 小组支持；

    - 健康专家辅导；

    - 行为改变课程；

    - 健康数据追踪。


    我们刚才说的这一切都在线上进行，人力成本和资金成本都很低。


    ## 五、Prevent 的操作步骤


    下面我们主要说说 Prevent 的4大组成部分具体是怎么操作的。


    第一个部分，就是小组支持，应该说是整个项目中最重要的。


    因为“团体的力量”会让成员有一种强烈的归属感，这种归属感可以帮他们更好地规范自己的行为，养成良好的习惯。


    Prevent 产品在选择小组成员时会考察3个指标：

    - 一是居住地点；

    - 二是年龄；

    - 三是 BMI，也就是身高体重指数。


    只有3个指标都相近才会被分在一个小组，这样成员之间的认同感和同理心就能得到最好的发挥。


    BMI 是 Prevent 中一个最关键的指标，Prevent 展示了这样一组数据：

    - 如果 BMI 分数低于25，发生前期糖尿病的概率为35%、血脂异常的概率为23%、得高血压的概率为23%；

    - 但要是 BMI 在30-35之间，这些事件的概率就会飙升到54%、52%、44%。


    也就是说，一个 BMI 大约30的人，大概率会得前期糖尿病，如果这位朋友的家庭再有糖尿病史，那这个概率还会更高。


    Prevent 给出的这个数据对保险雇主和保险公司来说非常有吸引力：


    你看，如果能够筛选并降低这些超重员工的体重，那么各种慢性病风险就会显著降低，保险公司赔付的风险也就大幅降低，企业也可以尽量减少员工因为身体原因造成的生产力下降。


    更重要的是，Prevent 会根据用户最后的减重情况和临床结果收费，没有效果就不收费，这为企业和个人消除了后顾之忧。


    第二个部分，是健康专家的定期辅导。


    每个小组会由一名经过 CDC 认证的专家领导。跟小组成员进行一对一的交流后，专家会实时跟踪学员的进展，提供个性化的指导意见。


    这一点非常重要，但是很容易被忽略掉。因为大量的行为改变学研究显示，改变最大的困难在于心理和环境因素。当你想坚持晨跑时，宿舍的舍友却都在睡懒觉，久而久之你也会丧失坚持的信心。这也是
    Prevent 健康专家存在的价值，他们了解用户面临的一切挑战，也会在用户动摇的时候坚定他们的信心，帮用户找到适合自己的饮食方式、运动方式以及合适的心理应对机制。


    第三个部分，Prevent 还包含了一套行为改变课程。


    每周日会定期发布最新的课程，小组成员将受到督促，在业余时间进行学习。他们的成果可以跟专家和小组成员进行分享。


    ![](img/812dfc825c17043226940aa4afb22b20_110_0.png)


    第四个部分，我们来说说 Prevent 的健康数据追踪。


    在创始人 Sean 看来，Omada Health 既是一家医疗公司，又是一家大数据公司。只有收集用户数据，并对数据进行统计分析，再结合最新的临床研究成果，才能真正帮用户得到相应的行为改变。


    用户加入 Prevent 后，会收到一台无线体重计，用户称体重时，体重数据就会上传到用户的在线账户中。Omada 会根据你的所在地、体重和 BMI 把你安排到跟你相似度最高的小组中。每天，你只要通过手机
    App 和计步器，上传你的食物消耗情况、运动和睡眠数据，健康专家就能对你进行点评，并作下一步的指导。


    总之，Prevent 的“4+4”体系给用户提供了一站式的行为改变体系，在这个过程中，不仅融入了数据分析的技术，让健康专家能够作出科学的分析，还融入了人性化的关怀，增强了用户对更好生活的信心。


    ## —— 今日内容小结 ——


    今天我为你介绍了一家数字医疗公司 Omada Health 以及它的创始人 Sean Duff。希望你掌握以下三点：


    第一，健康管理是一件反人性的事，大多数人本能地会选择让身体感到愉悦的事，所以抽烟、喝酒甚至毒品是人性使然，而健康管理在很多情况下并不会让人感到愉悦，反而可能让人遭罪。


    因此，健康管理企业都要考虑到如何帮助用户战胜人性的弱点。


    第二，对于创业公司来说，使用那些已经被证实有效的技术，把它进行商业化运作，是一条成功的捷径。这就跟从高校拿到先进科技转化成产品上市是一个道理。


    反过来看，把商业化运作和医疗成果进行闭环连接，在获得商业利益的同时，也可以积累更多医疗数据，推动医疗领域的发展。


    第三，创新小企业之所以近年来能够进入传统重资产型的健康管理产业，一方面是个人健康管理市场的需求，另一方面则得益于技术的发展。


    可穿戴设备以及即时诊断设备在家庭的渗透率不断提升，获取数据的门槛大幅降低，再加上在线平台摊薄了专业医护人员的服务成本，对于用户和企业来说是一个双赢的选择。


    ## ——♦ 今日思考题 ♦——


    除了小组监督，你认为还有哪些手段可以帮助人们将健康管理坚持进行下去？


    欢迎在留言区分享你的观点。


    ## 划重点


    - 1. 健康管理企业都要考虑到如何帮助用户战胜人性的弱点。

    - 2. Omada Health 的成功，在于运用行为科学、大数据以及健康顾问定期咨询相结合的方式，帮助用户建立了良好的生活习惯，从而预防了慢性病对身体健康的危害。

    - 3. “团体的力量”会让成员有一种强烈的归属感，这种归属感可以帮助他们更好地规范自己的行为，养成良好的习惯。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，我们明天见。


    ## 用户留言


    提交留言可与专栏作者互动


    不得不多说两句：


    其实 GymPact 的创始人兼 CEO 是一个华裔女孩，她是在哈佛读的经济学，毕业之后，她就把行为经济学理论运用到了健身上，你想想，奖励你 5 毛钱你可能不觉得有什么，但是罚你
    1 块钱你多多少是会有些不爽的。


    GymPact 实际上就是在运用人性的弱点，比如说“变瘦”这个梦想虽然让人很有动力，但属于长期梦想，而人往往对“立刻的好处”更有动力，免费健身无疑就是最具诱惑的“立刻就能得到的好处”。


    所以，用户几乎是想都不想就直接签约了，而那些无法克服自己惰性的用户就要为 GymPact 贡献营业额了。


    ## 三、社区医疗的机会


    除了个体化和参与化两个趋势，最后一个不得不提的，就是社区医疗的机会。


    现在，公立三甲医院主要还是以承担急重症和复杂疾病为主，它们真的没有多余的精力，而且在地域上也不太可能为所有人提供健康管理服务。


    所以，健康管理，尤其是慢性病管理的职责，天然地就落在了社区医疗机构和诊所的肩上。


    社区医疗的优势是便利性和专业度，要知道，健康管理和慢性病管理不可能完全由个人来完成，而且也不可能完全在线上或者在家里面就完成。虽然现在出现了不少可穿戴设备，但是目前看来，还不大可能出现太多消费级的医疗可穿戴检测设备，所以很多检查还是需要依托医疗实体来完成的。


    而且，专业医护人员的及时指导和干预也是非常必要的。


    所以，社区医疗机构就可以积极地和一些科技公司合作，通过线上线下的融合，为长期带病生活的慢性病患者提供连续性、综合性和个性化的社区干预服务。


    举个例子：


    比如说美国的慢性病管理平台 Welldoc，他们推出的产品 BlueStar 是第一个通过 FDA 审批的“处方 App”，他们针对的是 2 型糖尿病患者的管理。


    这个 App 会实时跟踪记录患者的状况，并把他们的糖尿病数据和电子病历整合到一起，提供相应的临床分析和疾病发展的趋势预测，最终给医生作参考，用来确定最佳的治疗方案。


    Welldoc 在推广这个产品的过程中，下了非常大的销售成本去说服家庭医生采用 BlueStar。


    大家都知道，美国的医生是独立执业的，每个家庭都会有自己的家庭医生，实际上，美国家庭医生的角色和国内的社区医院其实是有些异曲同工，都是渗透率最高、最基层的医疗服务提供者，所以，只要有更多的医生认同
    BlueStar，就意味着 Welldoc 能有更高的营业收入。


    这其实也是为什么 Welldoc 要把 BlueStar 申请为处方 App 的原因。


    首先，作为处方 App，BlueStar 能成功地从五花八门的移动医疗应用中脱颖而出，赢得医生的认可。


    此外更重要的是，你试想一下，如果是非处方 App，那使用 App 进行慢性病管理就只能是来自医生的建议，或者是靠自律，这对人来说太难坚持了，而作为处方 App，使用它就成了医嘱的处方，那坚持使用
    BlueStar 就显得更有必要了。


    最后，处方 App 也更容易让保险公司为之买单。


    所以，国内的创业者不妨鉴鉴 Welldoc 的做法，想办法把自己的健康管理服务渗透到社区基层，并想办法获得专业机构的背书。


    ## —— 今日内容小结 ——


    今天我们介绍了科技与健康管理相结合的方式，以及健康产业发展的趋势和机会，希望你记住以下三点：


    第一，当下中国正在经历医疗支出的快速增长，随着人口老龄化加剧，如果医疗健康产业依然是以专科与急重症治疗为主，必将消耗巨大的资源，不仅无法满足国民的医疗需求，国家和地方医保账户甚至面临亏空的风险。因此，健康管理在中国已经势在必行，也存在巨大的市场空间。


    第二，健康管理有两大趋势：个体化和参与化。基因检测、智能可穿戴、移动互联网、大数据等技术的成熟，使得个体化和参与化成为可能。


    同时，创业者也可以借助两大手段帮助客户战胜人性中的弱点，达到好的健康管理效果：

    - 一是运用实时或及时行为数据，让用户获得及时反馈；

    - 二是将健康管理活动游戏化、社群化，利用人性的弱点激励用户达到养成健康生活习惯的目的。


    第三，虽然健康管理不是一个新的产业，但是在技术的冲击下，原有的产业结构必然会发生调整，创新小企业有机会借助科技的力量完成“逆袭”，但是这并不代表传统的医疗机构或健康管理公司没有机会，相反，不同身份的机构都可以借助健康管理浪潮完成功能上的转变，实现再次增长。


    ## —— 今日思考题 ——


    你认为还可以给哪些特定人群定制个性化的健康管理服务呢？


    欢迎在留言区分享你的观点。


    划重点


    - 1. 针对健康管理，创业公司最需要考虑的问题，是如何让人积极参与。

    - 2. 如果能用有趣的方式或者激励的方式，把原本反人性的健康管理服务做到顺应人性，那就很有可能取得巨大的成功。

    - 3. 健康管理，尤其是慢性病管理的职责，天然地就落在了社区医疗机构和诊所的肩上。


    王煜全

    我是王煜全，你的全球科技前哨侦察兵，我们明天见。


    # 181 | 健康管理两大趋势：个体化与参与化


    ## —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：

    - 1. 个体化与参与化分别是什么意思？

    - 2. 创业者如何把握健康管理的机会？

    - 3. 为什么说社区医疗机会巨大？


    这周的内容播出以后，很多朋友都留言分享了自己的健康管理方法，在这里我给你展示几条：


    比如有个用户说自己每顿饭只吃到8分饱，戒烟戒酒，作息规律，定期锻炼身体。

    还有个用户说他从2014年就开始健身，每年都去体检。

    还有的说自己每天都冥想，舒缓压力。


    这些其实都说明了，我们大家都有健康管理的意识和需求。


    但你发现没有，刚才的几个留言其实都有问题，虽然大家或多或少都在做健康管理，但是这些方法几乎都是无法量化的，你只能凭借感觉判断今天做得好坏，却不能真的按自己的身体情况决定摄入多少热量，做多少运动。


    这就说明，其实我们大多数人都是非常需要有专业的人来帮助自己做科学的健康管理的。


    而且对于中国的创业者来说，健康管理可以说是一片巨大的蓝海，但想要开发这座金矿，创业者们就必须要掌握好健康管理产业的两个大趋势，也就是：个体化和参与化。


    而且实际上，这两大趋势都是离不开科技的，这也是创业者以及传统企业都可以考虑的地方，那就是如何把健康管理与科技结合起来进行创新。


    那么今天我们就聊聊，个体化和参与化具体是什么呢？在这两大新趋势下，健康管理产业都有哪些机会呢？


    ## 一、健康管理的个体化趋势


    最近几年有个热词叫“精准医疗”，这个我们以前也讲过，而在健康管理这个领域，精准这个目标也同样适用。


    我们都知道每个人的体质其实是有差异的，如果只是给你一个很宽泛的建议，比如说“你每个星期应该做3次运动，吃饭要保证低热量、低盐”，可想而知，这样的管理效果几乎不会好。


    所以，我们需要针对个体差异，针对不同的健康管理目标和需求，做出更精确和专业化的定制健康管理方案，这就是健康管理的个体化趋势。


    举个例子：


    老人退休之后有大量的时间锻炼身体，但是老人的肌肉含量和骨骼里的钙含量都大大减少了，所以即使是运动，他们也需要非常专业的运动方案，否则就很容易受伤。而老人一旦受伤，生活质量就会大大下降，这个我们在讲经济贫乏时也仰绍说过。


    ## 二、健康管理的参与化趋势


    健康管理有一个最大的难点，就是怎么让每个人都参与进来。


    相信你可能也见过或者自己就有过这样的经历，比如说，好看容易在健身房办了张卡，下定决心要健身，可常常是三天打鱼两天晒网，一年能去7、8回就不错了。我自己的例子更极端，我曾经买过一张健身卡，然后一次都没有去过。


    这就是因为我们每个人都天生有惰性，而健康管理最大的难点就在和人性抗衡，所以医院的生意永远都比健身房要好。

