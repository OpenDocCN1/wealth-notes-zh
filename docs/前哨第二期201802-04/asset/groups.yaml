    ## 171 | 如何避免另类投资中的风险？


    ### ——今日内容看点——


    通过阅读今天的内容，你将会掌握以下2个问题的答案：


    - 1. 如何降低另类投资中的风险？

    - 2. 为什么说投资ICO风险巨大？


    昨天我们讲到，以智能投顾为代表的技术进步，正在推动资管管理服务从高净值人群下沉到新中产群体，但它的收益并不高，而一直被普通人忽视的另类投资却具有更高的回报率，当然，高回报也意味着高风险。


    那么今天，我就要给你讲讲如何降低另类投资中的风险。


    ## 一、另类投资的种类


    我们先来看看另类投资的种类，摩根士丹利财富管理部门将另类投资分为了五大类：


    - 一是，以房地产、黄金为代表的实物类投资；

    - 二是，以对冲基金为代表的绝对收益类投资；

    - 三是，以管理期货、母基金为代表的股权对冲类投资；

    - 四是，以多、空仓策略为代表的股权收益类投资；

    - 五是，以私募股权为代表的私人投资类投资。


    The GIC Categorizes Alternatives into Five Buckets


    ![](img/812dfc825c17043226940aa4afb22b20_86_0.png)


    ## 二、另类投资的成功案例


    其实很多人都知道，另类投资这两年来受到了广泛的关注，其中一个重要原因是，它越来越有大众化的趋势，以前只有富人才能接触到的投资，现在净资产相对较少的平中产家庭也能接触到了，而最关键的是，收益率还很不错。


    很多机构也因为投资另类资产实现了资产的快速增值。


    其中比较著名的例子就是耶鲁大学捐赠基金（The Yale Endowment），根据耶鲁捐赠基金官网上的数据，基金的资产规模从1985年的13亿美元涨到了2017年的272亿美元，30年时间翻了近20倍，并创下了年化11.3%的净回报率，这给人的印象实在太深刻了。


    可以说，这支基金成功的核心经验就在于它进行了大量的另类资产投资。


    ![](img/812dfc825c17043226940aa4afb22b20_86_1.png)


    我们从耶鲁大学官网公布的数据就可以发现，这只基金最抢眼的一点，就是在它的资产配置里，风险投资和私募投资占了很大一部分，而这种策略也带来了巨大的回报。


    ![](img/812dfc825c17043226940aa4afb22b20_86_2.png)


    通过图表可以发现，风险投资带来的回报率超过了16%，不仅是所有投资种类中最高的，还大大超过了基准回报率。有了耶鲁捐赠基金的先例，其他常春藤大学的捐赠基金也都开始效仿，都加大了另类投资的比例。


    ## 三、另类投资的大众化趋势


    从耶鲁捐赠基金的案例中，我们可以看到另类资产对于投资者的价值。


    你听到这里可能会问，大型基金和机构投资能接触到的投资项目，我们普通人很可能接触不到，也投资不起，那有没有适合普通人的投资项目呢？


    答案是有，而且另类资产种类非常多，随着互联网的普及，另类投资也有大众化的趋势。


    以股权投资为例，我们海银资本投资的 AngelList，它首创的股权众筹模式，通过开放的互联网平台，将大量初创企业和投资者连接起来，使资金持有量相对较少的投资人，也能参与初创公司的股权投资。好的创业团队往往都去找大型风投机构融资，而现在
    AngelList 通过互联网实现了股权投资的民主化和去中心化，这恰好符合 AngelList 中文译名“天使名单”的寓意。


    具体来说，AngelList 首创的联合投资模式，叫 Syndicates，可以让单个投资人像 VC 找 LP 募集基金一样，找到其他个人投资者凑钱，进而可以让资金不多的投资人也有机会扮演
    VC 的角色。


    比如说，一个天使投资人，即使他看项目的眼光很好，但如果他只有2万美元，那么他想投资一个初创企业也是很困难的。但是他有了 AngelList，就 可以找到10个另外的投资人朋友，只要这10个人认同这个天使投资人的眼光，决定每人出资2万跟着投资，那么总共有22万放到资金池了。毫无疑问，这将他的投资能力进行了成倍地放大。


    这个模式一出来就取得了很大的成功，目前投资界采用的“领投、跟投”的投资模式，其实也是基于相同的原理。


    AngelList 通过股权众筹的方式，已经成功帮助很多知名公司完成了早期融资，比如大名鼎鼎的 Uber，与此同时，也让早期投资的投资人获得了不错的收益。


    目前，AngelList 已经聚集了25000多名合格的投资人，寻求融资的创业企业数量也已经达到55万家，成为了投资界非常具有影响力的股权众筹平台。


    ## 四、正确分析另类投资的回报率


    除了股权投资以外，普通投资者还有不少其他的另类投资可以参与，比如红酒、老爷车、艺术品等，这些都是近10年来关注度比较高的投资类别。


    但是这里要提醒你的是：


    - 我们听到的有关投资案例的报道，往往都有偏差，因为媒体只注重报道投资成功的案例，忽视平均的回报率。


    以红酒为例，我们经常在新闻里看到有人通过投资红酒实现了财富增值，以至于很多人相信红酒是回报率特别高的投资品。


    但实际情况是什么样子的呢？


    Liv-ex 佳酿100指数是精品葡萄酒行业的主要标准，而标准普尔500指数，是记录美国500家上市公司的股票指数。如果我们比较这两个指数过去5年的回报，你就会发现从2013年到2018年初，葡萄酒行业的增长率还没有标普500的增长率高。也就是说，葡萄酒的整体回报率低于股市的回报率。


    当然，别被骗了，就这么轻率地得出结论说葡萄酒投资回报高是骗局。


    其实如果放到更长期比如10年，或者更短 期比如1年的角度，葡萄酒投资回报确实比股票投资回报高。


    5年期回报不行，一是因为葡萄酒行业 2013-2015年的投资回报放缓，其中一个原因 是，西方很多人都认为，是中国从2011年开始的反腐，使得中国名贵红酒的消费大减，进而带动全球红酒市场价格跳水，直到2015年全球市场才恢复过来。另外一点别忘了，咱比较的这段时间正好是美国股市连续9年增长的大牛市时期。


    2017年前11个月标准普尔指数上升了惊人的20.5%，可是红酒的佳酿100指数竟然上升了21.8%，还是超过了标准普尔。当然，又是一个转折，更加收窄的佳酿100指数，也就是只记录更加名贵的前


