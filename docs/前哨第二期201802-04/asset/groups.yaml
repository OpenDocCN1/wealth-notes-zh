    \n总的来说，心理是动物进化到人类才出现的高阶形式，其机制非常复杂，而且需要之前的各个进化阶段的器官和功能的支持。\n\n因此，心理疾病的原因也是非常多的，有生理的，也有纯粹心理的，也就是说没有可检测的生理变化的。\n\
    \n当然，还有很多是我们今天还没有搞明白的，需要等待认知科学的进一步进步帮我们搞懂。\n\n## —— ◆ 下周预告 ◆ ——\n\n我们下周的话题是“品位升级”。\n\
