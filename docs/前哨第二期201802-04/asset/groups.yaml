    \n## 二、成功收购星巴克\n\nHoward 加入星巴克一年多后，就冒出了新的灵感。\n\n当时他偶尔要到意大利米兰去出差，他发现米兰几乎每一个街道拐角处，都有一家咖啡吧。但他们不是卖咖啡豆，而是卖现做的最新鲜咖啡饮品。而且店里一般会播放意大利歌剧，气氛很轻松，大多数顾客可以在这儿待上大半天。\n\
