    - 1. 共享经济是重要的社会趋势，未来人们会越来越习惯拥有一项物品的使用权，而不是拥有这个物品。

    2. 共享经济需要满足三个条件：产能过剩、共享平台以及人人参与。

    3. 共享经济的底层逻辑，就是利用技术来解决闲置资源的有效利用问题。

    4. 共享经济开始呈现出一个比较明显的特点，就是共享内容不断趋于向细分产业发展，而且专业化程度也在逐渐提高。


