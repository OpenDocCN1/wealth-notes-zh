    # 152 | 共享经济趋势带来的社会变革


    152 | 共享经济趋势带来的...


    # ——◄ 今日内容看点 ►——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 共享经济将来会如何发展？

    2. 共享经济正在摧毁工业阶层吗？

    3. 同一个领域的公司如何实现差异化运营？


    # ——◄ 全周总结 ►——


    本周的话题是共享经济，我们一共介绍了三个重点：


    第一，共享经济目前不论从技术层面还是从宏观环境的层面来看，都具备了爆发的可能。未来，人们会越来越习惯于拥有某一项物品的使用权，而不是拥有一个物品。而共享经济得以实施离不开三大条件：产能过剩、共享平台、人人参与。


    第二，共享经济得以实现，离不开技术的支持。就像 Uber 和滴滴出行成功的背后是手机地图与移动支付的普及，在未来，共享经济企业依然离不开技术的支持，甚至随着细分市场的出现，技术的门槛会越来越高。


    第三，创业者要杀入共享经济，一定要建立自己的壁垒。要么建立足够高的技术壁垒，要么充分借助资本的力量迅速积累用户形成规模化优势。


    # ——◄ 用户答疑 ►——


    现在的共享经济似乎还没有带来自发的去中心化的交流，也没有什么自发参与的感觉，比如共享单车并不是人们自发地去分享给别人，更像是传统的租赁。共享经济将来如何发展呢？会对人们交流、协作带来什么认知层面的改变呢？


    我的回答是：


    这是一个好问题，现在很多共享经济业务模式本身就不是由社会中的提供者来提供的，而是由平台统一提供的，比如共享单车，包括首汽租车也都是自己的汽车。


    很多专家认为，共享经济业务模式应该分为两大类：


    +   一类是 P2P，这类提供者，也是社会当中的大众；

    另一类是分时租货，其实提供者往往可以是集中的，统一的。


    在 P2P 这样的共享模式里，如何使提供者找到自发参与的感觉则是相当关键的。


    比如 Airbnb 就会鼓励房屋提供者给自己的房子拍照，晒出自己房子的特色，以吸引租客。但是在具体操作当中，他们就发现，房主拍照不专业，不能把房子的吸引力更好地表达出来，所以他们还得自己雇佣专业的摄影师去给房子拍照。


    可见要做好并不容易，能够鼓励大家自发参与，而且参与得高质量其实很难。


    至于共享经济的发展。


    第一是看领域：


    随着城市化的进程，这会造成没有地方放置闲置物品了，大家环保意识的加强，因为这样只使用不拥有肯定是更加环保的，大家都会接受这一点，那么相对大件，共享更环保的东西就更容易共享。


    比如国外现在很常见的公共洗衣房，在各个社区里都能见到。将来户型越来越小，大家到公共洗衣房去洗衣服会更经济，所以未来的小户型社区下面都会配上公共洗衣房。你去那里洗衣服，还能顺便交附近社区的朋友。


    第二是从模式角度看：


    共享平台的设计将会更加人性，既保障使用，又能促进参与的积极性，还能顺便社交，一举三得。


    比如国外很多 Uber 的车主，其实只是退休了找点事情做，给生活增加点乐趣而已。这样让他们在做 Uber 之外，也把其他 Uber 司机组织起来，给他们提供些服务，或者让这些人做
    Uber 论坛的版主，和 Uber 的用户有更多的交流，我认为应该都会有不错的效果。至少现在来看，Uber 用户的交流实在太弱了。


    今天的平台上的供方和需方都过度扁平，未来我认为应该更加立体，未来的服务应该更加综合。


    有些人认为共享经济正在摧毁工业阶层，比如《经济奇点：共享经济、创造性破坏与未来社会》这本书就认为，Uber、TaskRabbit 等公司声称它们能够将“自由的劳动力”变成“独立承包商”，或
    者“自己的老板”，但实际上，这些工人都被迫去做了一些特别琐碎的工作，被迫成为“兼职工”“永久临时工”，然后从这些公司丰厚的利润当中赚取一点儿微 薄的薪水。经济地位每况日下，社会保障日渐薄弱。王老师怎么看待这个问题？


    我的回答是：


    其实这是社会发展的大趋势，美国新增就业的50%都属于自我雇佣，也就是未来会有越来越多的人会选择成为自己的老板。


    在这个趋势下，一些竞争能力比较缺乏的人就只有干琐碎的工作了，经济地位会下降，但这不代表全部。就像只要有市场经济就会有企业倒闭，但是你不能指责市场经济造成了大量企业倒闭，因为那是以偏概全的，你忽略了还有大量企业盈利呢。而在共享经济当中，我们也不能忽略大量个人通过自雇，生活得到了极大的改善。


    当然，越来越多的人自我雇佣，社会就要给他们提供更好的支持，包括福利保障方面，职业培训和就业方面。


    我们在《前嗅》第一季中介绍过，Betterment 就和 Uber 合作，为他们的司机提供资产管理服务。


    另外，一般自雇者可能不太有长远眼光，所以未来对自雇者的持续学习培训也需要加强，甚至需要出台相关的法规。现在的医生要想继续执业，每年都需要修够一定的学分，这样才能保证他们能及时获取最新的医学知识，也能把这些知识运用在自己的患者治疗上。


    未来，也许像滴滴司机这样的自雇者也需要每年修够一定的学分，也可以是在得到 App 上修够一定时间的课程，这样保证他们有持续的竞争力，因为现在已经是终身学习时代了。


    现在的共享经济，同一个领域的公司特别多，大家往往是一窝蜂冲进去，有没有什么办法能够让自己的公司实现差异化运营呢？


    我的回答是：


    我们介绍过，这是模式创新的特点。


    我们春节期间的内容也介绍了，为什么大家都只听说过硅谷的风险投资人，没有听说过其他地方的风险投资人。因为硅谷也是以模式创新为主的，风险投资人需要为项目站台。而如果不是模式创新的项目，风险投资人出名的需求就小很多。


    其实模式创新：


    +   第一，需要创业者出名，所以国外 Y Combinator 这样的孵化器特别热，因为创业者去那里镀个金，名气就会很大，估值也会涨很多；

    第二，需要尽量找到著名的风险投资人背书，著名 VC 都看中了我，说明我胜出的几率更大；

    第三，要用期权激励吸引牛人加盟，牛人和自己一起打天下，加速用户的获取、加速企业的成长；

    第四，要有大量资本支持，这样才能尽快用资本的力量跑马圈地。


    一旦用户规模超过了雪崩点，雪崩点指的是市场上的新增用户多数都会选择你这个应用，这个应用就会有马太效应，那么企业就会胜出了。


    当然，最后如果市场当中只剩下两家寡头的竞争，因为都是用资本的力量推动的，资本的意志就会超过创业者的意志，两家不会一直打，因为一直打的话都没有利。


    不会一直打，因为一直打的话都没有利润，而两家会合并。


    当然，创业者不愿意合并，因为至少一个人就会出局了，但是资本意志会更强，合并一定会发生。中国有大量的合并的原因就在这儿，从本质上来说，因为这些合并的企业都是模式创新，也就是说技术壁垒不够。


    以上就是今天的回答。


    # ——♦ 下周预告 ♦——


    我们下周的话题是创意产业。提到创意，大多数人的印象就是脑中灵光一闪，一个好创意就出现了。但实际上，创意的价值往往都是要和产业深入结合，需要背后一个完整生态的支持才能发挥出来的。


    想象一下，如果没有好莱坞，《哈利·波特》这么个 IP 还会被传播得这么广泛，产生这么大的价值吗？所以你会看到，一个好的 IP 能撬动一个大的产业，而一个完整的生态能够把一个好
    IP 的价值发挥到极致。


    下周我们就来讲讲科技和创意生态是如何为一个好 IP 赋能的，欢迎大家关注。


    # 划重点


    +   1. 共享经济业务模式分两类：一类是 P2P，由大众自己提供资源；另一类是分时租赁，由企业统一提供。 2. 未来会有越来越多的人选择成为自己的老板，一些竞争力缺乏的人只好干琐碎的工作，经济地位也会下降，但更多的人生活会得到极大的改善。
    3. 属于模式创新的共享经济领域，会因为门槛低而出现众多参与者的激烈竞争，没有技术壁垒，就要尽可能利用资本的力量跑马圈地。


    王煜全


    我是王煜全，你的全球科技前哨侦察兵，咱们下周见。


    # 153 | 商业价值巨大的创意经济


    153 | 商业价值巨大的创意...


    王煜全


    今天是春节假期后的第一个周一，相信你已经调整好进入工作状态了，在这里祝你开工大吉。我希望你新年有新的进步，新的行动！


    节日前，我也透露一个我的开年大事：


    今年的4月22日，我要做我第二届的前哨大会了。去年4月22号，我做了第一届，用4个小时对全球的科技创新做了年度盘点，有1000位用户来到北京现场和我一起体验了2017年的这场回顾和展望。


    # —— 今日内容看点 ——


    通过阅读今天的内容，你将会掌握以下3个问题的答案：


    +   1. 创意经济是如何发展起来的？

    2. 创意产业中科技扮演什么角色？

    3. 如何才能让好创意落地？


    下面言归正传，本周开始，我们要来聊聊创意经济。


    # 一、何为创意经济？


    创意经济，也叫创意产业，它是在全球化的消费社会背景下发展起来的，主要强调创造力对经济的贡献。总体上看，创意产业是文化产业发展到一定程度后的产物。


    # 二、创意落地面临的挑战


    除了科技的支持，一个创意本身想要落地是一件非常困难的事情。


    # 三、创意平台


    +   1. 太火鸟


    水下机器人，可以实时传输来自水下的高清影像，这款飞行鱼也获得了 CES 创新大奖。


    飞行鱼的一个优点是，在水下运动时，它具有出色的流体力学设计和机器人姿态控制。另外，它的交互体验设计和高清实时的视频效果，也做得非常好。你还可以结合 VR 和直播技术，体验置身于海洋中的沉浸感。


    在未来，飞行鱼还有其他更多的应用场景。举个例子，它可以作为水下作业的平台，搭载不同的专业设备，比如机器人臂、环境监测系统等等。


    更值得一提的是，过去在水下机器人领域，只有造价上百万的专业级产品。而飞行鱼则率先开辟了消费级市场，普通顾客也能承受它的价格。在飞行鱼的整个开发制造中，太火鸟扮演了创意孵化平台的作用。


    # 2. 洛可可


    当然，不只是科技创新公司需要完整的创意众包平台，其他领域的产业也需要设计思维，下面我们来看看比太火鸟成立早10年的洛可可是如何变的。


    洛可可，目前是一家全流程创新设计服务提供商。


    刚才提到的故宫文创产品里，有相当一部分设计就来自洛可可，比如故宫猫系列。其实，洛可可在刚成立的时候，是只做工业设计的，其他环节的服务一概不做。但是，随着专业化分工越来越细的趋势，对资源整合能力的要求也越来越高。


    这就是我们提出的“新木桶理论”，当你自己有一块长板时，必须要跟其他长板合作，才能提高成功概率。


    于是到了2016年，洛可可就成立了名叫“洛客”的互联网设计平台，尝试打造一个设计师、企业和用户的交互平台，大家分享创意，共同设计制造。平台把技术、工具、用户、供应链、大数据等资源提供给设计师，让他们深度介入产品的后续开发流程。截至2017年底，这个平台已经拥有超过3万名设计师了。


    在这样一个全流程创新服务体系里，洛可可做出了不少成绩。


    比如，2016年它为科大讯飞设计了一款“晓译翻译机”。晓译翻译机就像一位随身翻译一样，可以满足即时翻译的需求，晓译翻译机小巧精致的外形跟一部手机差不多大。


    目前，晓译翻译机可以支持汉语对英语、日语、韩语、法语和西班牙语的翻译。也就是说，未来不论你是出国旅行还是进行商务考察，都不用再为外语发愁了。甚至一些基础的同声传译业务，也可以完全交给翻译机完成。


    洛可可的例子就充分说明了，科技的发展和专业化趋势直接推动了创意生态的演变。


    像科大讯飞这样的科技企业，可以专注做长自己的技术长板，而把产品开发、项目管理中的其他环节交给洛可可来合作完成，包括外观设计、研发、生产、销售服务等等，充分发挥各自的优势。而且，科技产品的生命周期越来越短，对于洛可可这样的全流程设计服务公司的需求也会越来越大。


    总之，科技发展为创意产业提供了技术支撑，创意产业又源源不断地提供创造力为技术服务，而众多创新平台的涌现，又能逐渐构建起完整、动态的生态链，创意产业在中国的发展潜力巨大。


    此外，现在人工智能已经工具化，就像今天我们对工业设计多样化的需求那样，未来对跨学科的人工智能设计的需求也会越来越多。而 AR/VR 技术的进展，也会带来新的创意设计思维。所以说，好的设计师一定要密切跟随着科技的发展。


    # —— 今日内容小结 ——


    我们主要介绍了创意产业的发展、挑战以及创意设计服务平台，希望你通过今天的学习能够了解以下三点：


    第一，创意产业是在经济全球化背景下产生的以创造力为核心的新兴产业，随着双创的推进，中国创意产业的发展潜力和商业价值巨大。


    第二，一个创意想要顺利孵化成一款产品，需要充分利用“新木桶理论”。也就是说，一个符合市场需求的好创意，一项核心技术，以及一个创新孵化平台，一起来完成创意到产品的落地。


    第三，科技为创意产业的赋能，推动了创意产业的演进，创意产业已经开始与其他产业深度互动。尤其是人工智能、AR/VR、大数据等技术工具化以后，设计师和创意家都需要具备机器思维，才能设计出更具市场价值的创意产品。


