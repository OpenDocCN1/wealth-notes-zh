  md: '# 第36课：障眼法套路5


    # 如何用烘托和对比,让客户感觉很划算


    很多市民有逛超市的习惯，没事就在各个超市里转悠，一件件商品比来比去，有时候还把价格抄下来。他们肯定以为自己的算盘打得精，不会花冤枉钱。但他们不会想到，很多人学了一诺老师的课程，早氨基酸想好了法子对付他们呢！


    # 案例：超市定价，如何利用消费者的非理性


    通过一诺老师的研究发现，消费者在价格感知中存在诸多非理性行为。消费者掌握的价格信息往往是不对称的，无视消费者的非理性而采取的成本加成定价和竞争导向定价，往往会作出无效的利润让渡，或者无法有效吸引消费者……


    ![](img/15f198c22cd7a7cb9b4d6820552aa00d_176_0.png)


    有弟子问：“请问一诺老师，超市的定价该如何有效利用消费者的非理性，从而确定出合理的价格策略呢？”'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# 1、价格形象商品的选择


    消费者往往习惯通过某些商品的价格来确定超市整体的价格定位，这些商品成为价格形象商品。这些商品之所以能够成为价格形象商品，很大程度上是因为消费者能够记得住这些商品的价格，从而完成该类商品的不同超市之间的价格比较。


    一诺老师研究发现，消费者对经常购买的商品，购买周期短、购买频率高的商品价格记忆度高。因此以该类商品作为价格形象商品是比较合适的，比如大米、牛奶、蔬菜等。但是由于强势厂家的降价，自有品牌的商品也可以作为价格形象商品的理想选择，来完成消费者对超市整体价格形象的认知。


    ![](img/15f198c22cd7a7cb9b4d6820552aa00d_177_0.png)


    # 2、价格形象商品的定价


    一诺老师觉得，价格形象商品确定之后，其价格的确定是非常重要的。对于所确定的价格形象商品的定价，就应该采用竞争导向定价法或者牺牲品定价法，比照竞争对手的该类商品'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 全球最黑的《商业黑幕和套路 1》容易走火入魔！未满 18 禁读此书！


    的价格，制定起码不高于竞争对手的价格；甚至采用牺牲品定价法，通过低价来吸引消费者，塑造商品的低价形象。牺牲品定价法最好是通过自有品牌的商品来实现，这样不至于引起和厂家的矛盾，扰乱厂家的价格体系。


    # 3、开业期的价格策略


    消费者对超市的价格形象有一个形成期，而这个形成期对于多数的消费者来说是超市开业期。因此在超市的开业期应该尽可能多地吸引消费者走进超市，同时要制定出开业期的价格策略，给消费者传递超市的价格形象，通过几个购物周期形成消费者对超市价格形象的认知，并且形成消费者的购买习惯。


    ![](img/15f198c22cd7a7cb9b4d6820552aa00d_178_0.png)


    因此，一诺老师认为，开业期必须制定出优惠的价格，并贯彻超市的价格策略。如果在开业期给消费者形成一个高的价格认知，或者是让消费者感觉和其他超市在价格上没有什么区别，之后对于消费者认知的改变将是困难的。'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 4、价格敏感客户的价格策略


    一诺老师发现有些客户具有较高的价格敏感度，该部分客户往往喜欢比较不同超市的商品价格，对商品价格的记忆度也比较高。


    比如很多 40 岁以上的家庭主妇，她们以家庭为事业，精打算着用每一分钱，不惜体力地在各个超市间购买最 “划算” 的商品。


    超市可能会担心基于消费者非理性的定价策略容易造成该部分客户的流失。


    其实，超市的定价不可能同时满足所有消费，而且这部分客户也并不会因超市的定价策略而流失，该类消费者往往只购超市内的低价商品，隔于超市的低利润客户。单品的低价促销往往对该部分客户比较有效。


    ![](img/15f198c22cd7a7cb9b4d6820552aa00d_179_0.png)


    普通的消费者不会想到，超市的商品定价居然有这么多诀'
