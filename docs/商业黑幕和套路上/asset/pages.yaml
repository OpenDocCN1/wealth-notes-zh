  md: '# 案例：化妆品的成本与价格


    来自广州的欧阳从事化妆品原料批发多年，由于他是一诺老师的弟子，于是向一诺老师透露：“无论是国际知名品牌，还是本土货，化妆品的主要原料都差不多。”


    成千上万种化妆品原料经过不同的排列组合，最终形成价格各异的产品。尽管不同品牌的化妆品在价格上天差地远，但其原材料成本却相差无几。


    欧阳向很多国内、国外的化妆品生产企业提供原料，诸如油脂、乳化剂、防腐剂这类必备基本原料。欧阳说：“国际采购价格是很透明的。”比如膏霜类化妆品的基质主要是由油脂和水组成，油脂分为植物油脂和动物油脂。常用的品种价格为：葡萄籽油
    40 元/千克，硅油 35 元/千克，白矿油 10 元/千克。这些油脂在最终产出的膏霜中占比为 3%~10%，而占比为 4%左右的乳化剂价格则从 40 元~200
    元/千克不等。


    企业盈利之道就是要把顾客当成黄金卖！

    —诺老师'
