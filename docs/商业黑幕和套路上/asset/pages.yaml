  md: '# 第 25 课：概念套路 6


    # 造概念第六招：把相同的东西卖出不同


    一诺老师在课程中经常提到定位，所謂定位，就是令你的企业和产品与众不同，形成核心竞争力。


    ![](img/15f198c22cd7a7cb9b4d6820552aa00d_111_0.png)


    一诺老师研究发现：在同质化的市场中，唯有传播能创造出差异化的品牌竞争优势，而有效传播必须有一个以消费者需求为出发点的核心概念。


    那些成功的品牌之所以成功，就是在于它们能够把相同的产品卖出不同来！


