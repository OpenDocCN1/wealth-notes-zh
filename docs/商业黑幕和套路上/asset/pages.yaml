  md: '# 全球最黑的《商业黑幕和套路 1》容易走火入魔！宋襄 18 禁读此书！


    看清楚了吧？你别看一个产品的价格高、利润高，那不是哪个企业能独吞的。


    一诺老师不断的提醒想要弯腰捡硬币的苦逼企业家：很多时候给产品定高价，也是迫不得已的——你的价格低了，给中间商、零售商的利润就低，人家给你卖的积极性也低。更严重的，你的产品根本进入不了销售渠道，连跟消费者见面的机会都没有。你心眼再好，总不能让自己的企业关门吧？


    ![](img/15f198c22cd7a7cb9b4d6820552aa00d_265_0.png)


    # 如何给产品定高价


    以前的做法，是先计算一下成本和费用，再在这个基础上加上一个利润率，就成了价格。如果东西俏一点，利润率就定得高一点。比如开餐馆的，在每道菜的食材和加工成本上加两倍的毛利，一道菜的价格就出来了。


    从你看了一诺老师这本书，你就不能这么干了。


    再把定价和成本扯在一起，这生意就没法做了。'
