  md: '# 全球最黑的《商业黑幕和套路 1》容易走火入魔！未满 18 禁读此书！


    我们企业家是做实战的，不是搞学问的，要的是直接、响亮。吹牛逼谁不会！关键是要能够像一诺老师的助理和弟子那样，真刀真枪的干，整点实在的！


    一诺老师听过一个通俗的说法： “营销就是为产品找客户，为客户找产品，达到双方利益的最大化。”


    这个定义，一诺老师觉得至少比科特勒的通俗，但还不够透彻，特别是后半句，有点虚。


    达到双方利益的最大化，有这么两全其美的事情吗？


    消费者都希望一分钱不掏，企业白送最好。


    ![](img/15f198c22cd7a7cb9b4d6820552aa00d_36_0.png)


