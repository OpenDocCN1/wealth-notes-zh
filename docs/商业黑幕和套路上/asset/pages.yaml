  md: '# 第 04 课：商业的真相和内幕


    # 这是教科书上永远学不到的套路


    要想吃营销这碗饭，首先要弄清楚一个基本问题：


    ![](img/15f198c22cd7a7cb9b4d6820552aa00d_35_0.png)


    如果不让一诺老师给你来一场“脑震荡”，你的脑子转不过弯来，营销这个工作对你将是一种痛苦的折磨。


    营销是干啥的？美国的菲利普。科特勒先生有一个定义：


    > “市场营销就是通过创造、交换产品与价值，从而满足消费者的欲望与需要的过程。”


    这个定义好吗？一诺老师觉得当然好。但很多人听不懂啊，不知道其中的奥妙所在，更不知道如何运用。


    怎么创造产品与价值，又怎么交换价值？


    消费者的欲望和需要是什么关系，怎么满足？


    对这些问题，每个人的理解不同，解释起来得几天几夜。'
