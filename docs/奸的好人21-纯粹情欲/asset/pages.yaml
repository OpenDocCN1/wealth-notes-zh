    # 爱，会使人出轨


    # 众人误解的出轨原因


    很多人以为出轨的原因不外是在一段痛苦的感情或婚姻里面，然后遇到了一个高素质的第三者，受不住诱惑之下而出轨。但，现实中的出轨，通常不是发生在痛苦的关系里面，反之痛苦关系中的伴侣，特别是那位位居受害者或被欺压的，往往就算再痛，也不会随便分手。


    人的本性就是贱，你为了对方牺牲过很多，或对方虐待了你很多，你反而 would认为你更爱对方。


    反之，出轨的主要原因就是一个字：


    闷。


    即夫妻相处理处太过平凡，特别是那些平淡得需要此地无银三百两的告诉你「平淡是福」的，就是容易被引诱的目标。


    # 情欲解码：


    一段痛苦对比一段沉闷的感情，往往是沉闷的比较容易出轨。痛苦反而会让人坚持下去。


    # 三个会害死你婚姻的建议


    当有人婚姻或男女关系遇到问题时，不少的朋友都会给他们一些就算不会大大的对，也不会错到哪里的建议。诸如「两个人在一起，就是一人让一步」之类的话，然后会好像成龙在电影中的一贯说教模式告诉你婚姻的秘密就是要信赖、尊重和责任。


    但，我就是要告诉大家信赖、尊重和责任不是最重要的维持快乐婚姻元素。


    游牧人 156'
