  md: '换句话说，动了情后，是什么借口都没问题，总之有个借口来让人家口头上可这讲得通一些道理就足够了，大家是明，有些话不需要分析得太清楚，聪明地半真半假装成愚蠢的人，才能让自己过自己良心那关。


