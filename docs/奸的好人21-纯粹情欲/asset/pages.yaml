  md: '这种什么角色扮演、SM 的玩意儿，其实说开了，就是做爱会闷，再怎样做爱，姿态、程序、反应等，都已经很机械式的。所以在清单式的做爱之下，床事上觉得乏味，甚至在情感上也开始乏味，进而出轨的机率就高了。


