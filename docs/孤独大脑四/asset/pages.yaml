    客人说：“月明星稀，乌鹊南飞”是曹孟德的诗吧？眼前壮丽景色，都是他战斗过的地方。曹操如此牛逼，固一世之雄也，而今又在何处呢？


    随后，苏东坡写出了传颂千古的诗句。


    这些话说充满了现代型。对于观察这个世界的智慧，对于经验知觉，苏东坡、休谟、康德、马赫、爱因斯坦们把酒言欢。


    苏东坡说道：


    “你也可知道这水与月？时间流逝就像这水，其实并没有真正逝去；时圆时缺的就像这月，终究没有增减。可见，从事物易变的一面看来，那么天地间万事万物时刻在变动，连一眨眼的工夫都不停止；而从事物不变的一面看来，万物同我们来说都是永恒的，又有什么可羡慕的呢？


    何况天地之间，万物各有主宰者，若不是自己应该拥有的，即使一分一毫也不能求取。只有江上的清风，以及山间的明月，听到便成了声音，进入眼帘便绘出形色，取得这些不会有人禁止，感受这些也不会有竭尽的忧虑。这是大自然恩赐的没有穷尽的宝藏，我和你可以共同享受。”


