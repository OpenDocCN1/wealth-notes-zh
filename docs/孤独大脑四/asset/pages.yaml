  md: '简单来说，暗狗对“简单的复杂游戏”有效，但是对于复杂系统并没多大作用。


    然而，一个人的成长，本身就是一个复杂系统，应该用园丁思维，而非木匠思维。可教育里的“暗狗”不就是一把批造型的大砍刀吗？


    +   ◊ 当所有人都在偷跑的时候，偷跑也就失去了意义；


    ◊ 当刷题越来越高级时，就像所有的人都在学习“在捕鼠机上雕花”，孩子们把最宝贵的岁月浪费在那些一辈子都用不上的雕花手艺上；


    ◊ 流于带狗下棋，其实会让一个人从此失去对围棋的独立思考；


    ◊ 大量超前辅导，也会让孩子对学习产生迷失，并且失去想象力和“解决没有标准答案的问题的能力”；


    ◊ 社会成本巨大，影响个体和国家未来的竞争力。


    可是，在收益面前，这些损失算什么？先上个名校，以后慢慢“补过”嘛。


    毕竟，在成年人的世界里，以后再也没有类似的暗狗可以带了。


    # 六


    几乎所有人都意识到了K12领域的暗狗所带来的危害。


    在“掐尖教育”里，只有极少数人能够成为暂时的赢家。


    但长期而言，不管是对于个体，还是对于国家，竞争力都有赖于多样化、生态化和涌现。


    掐尖，就像当年挑出“天才少年球员”送到国外集训指望实现足球腾飞一样。'
