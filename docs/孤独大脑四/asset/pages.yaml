- pgno: 380
  md: '+   对于两个玩家的对抗游戏，其中任何一个玩家的决策会依赖于另外一个玩家之前的决策，且另外一个玩家总是竭尽所能地想要获得胜利。


    +   因此，一方会在所有选项中选择令其自身优势最大的一个，而另一方则会选择令对手优势最小的一个。


    +   通过穷举不同玩家之间的策略，该算法可以构建一棵搜索树，并通过穷举不同的可能，选择其中能得到最佳结果的路径。


    # 对抗搜索


    +   对抗搜索(Adversarial Search)也称为博弈搜索(Game Search)


    +   在一个竞争的环境中，智能体(agents)之间通过竞争实现相反的利益，一方最大化这个利益，另外一方最小化这个利益。


    狭路相逢勇者胜

    勇者相逢智者胜

    智者相逢德者胜

    德者相逢道者胜


    ![](img/3dace955367687898560fd4145a321db_380_0.png)


    请点击放大，看下图右边的搜索树的最下面一行，3、12、8这一组数字，是“我”期望获得的可能利益。'
  merge: -1
  img_proc: true
- pgno: 381
  md: "# # 对抗搜索：minimax算法\n\n给定一个游戏搜索树，minimax算法通过每个节点的minimax值来决定最优策略。当然，MAX希望最大化minimax值，而MIN则相反\n\
    \n```\nMinimax(s) =\n    { Utility(s)                              if Terminal-Test(s)\n\
    \    Max{ Minimax(RESULT(s, a))}   if PLAYER(s) = MAX\n    Min{ Minimax(RESULT(s,\
    \ a))}   if PLAYER(s) = MIN\n```\n\n![](img/3dace955367687898560fd4145a321db_381_0.png)\n\
    \n通过minimax算法，我们知道，对于MAX而言采取α行动是最佳选择，因为这能够 得到最大minimax值（收益最大）。\n\n+   • 对于对手而言，当然会选择让“我”利益最小的走法，所以，在MIN那一\
    \ 行的B节点，对手会选择3、12、8中的最小值3。\n\n+   • 同理，在C节点，对手选最小的2；在D节点，选最小的2。\n\n+   • 而在MAX行，“我”要选择“3、2、2”这一行极小值当中的极大值“3”。\n\
    \n这就是Minimax（极小化极大）算法。\n\n但是，即使是对于棋类这种完美博弈，该算法的计算复杂度也会呈指数级增长。\n\n因此往往需要引入剪枝策略来简化搜索的复杂度。\n\
    \n以及，通过多次采样的蒙特卡洛树搜索，以减少计算量。"
  merge: -1
  img_proc: true
- pgno: 382
  md: '# 对抗搜索：主要内容


    +   - 最小最大搜索(Minimax Search)：最小最大搜索是在对抗搜索中最基本的一种让玩家来计算最优策略的方法。


    +   - Alpha-Beta剪枝搜索(Pruning Search)：一种对最小最大搜索进行改进的算法，即在搜索过程中可剪除无需搜索的分支节点，且不影响搜索结果。


    +   - 蒙特卡洛树搜索(Monte-Carlo Tree Search)：通过采样而非穷举方法来实现搜索。


    再 往 后 ， UCT


    算法将蒙特卡洛树搜索方法与UCB公式结合，有效解决了围棋上的问题。


    进 而 ， 基 于 深 度 强 化 学 习 ，


    AlphaGo 诞生，惊人地击败了人类，完成了以往被认为还需要 20-50年才能实现的任务。


    德谟克利特对原子的理解令人赞叹，然而只有基于爱因斯坦的公式，人类才能造出原子弹，以及安全地利用核能。


