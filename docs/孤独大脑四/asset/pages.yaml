- pgno: 70
  md: '3、这一“不断定”的结果就是“不动心”状态，又称“平静安宁”，或“无动于衷”，或摆脱烦恼。


    对于“既存又不存在”，或“既不存在又不得不存在”，我愿意将其理解为一种概率化思维。


    承认自己无知的“近似解”，比过于自信的“最优化”要好。


    在围棋棋盘上，“悬搁判断”并非不判断，而是如同阿尔法狗般，面对遥远的终局，以及模糊的当下，用概率计算来判断。


    以及，对随机性控制下的各种结局坦然接受。


    由此而得的“不动心”，正是吴清源反复强调的“平常心”。


    此乃他的另一个秘密武器。吴清源说：


    胜负只有神明才知晓。在棋盘上尽全力作战，之后坦然接受结果，遵从“尽人事听天命”的原则，才能够保持平常心。


    当他的弟子林海峰参加自己人生的第一场冠军争夺赛时，正是靠这三个字战胜了内心的忐忑。


    怀疑论的理论活动，服务于“心灵的宁静”。


    我无法判定，心灵的宁静，到底是目的，还是结果，抑或是“道”本身。


    我也不打算展开对比斯多亚派与道家在“接受命运”这一理念上的异同。


    吴清源在围棋上的天赋毋庸置疑，但在世俗世界里格外愚蠢。


    谁又不是凡人呢？


    他幸运地出生于大户人家，却正好赶上家道败落。


    年仅11岁时，吴清源便开始靠下棋养家。'
