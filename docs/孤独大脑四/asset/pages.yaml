  md: '# 运用自己的理智


    对于个体而言，需要学会策略地思考，在人生博弈中扩大胜面。


    首先，我们要读懂康德的《什么是启蒙运动》：


    启蒙运动就是人类脱离自己所加之于自己的不成熟状态，不成熟状态就是不经别人的引导，就对运用自己的理智无能为力。


    当其原因不在于缺乏理智，而在于不经别人的引导就缺乏勇气与决心去加以运用时，那么这种不成熟状态就是自己所加之于自己的了。


    Sapere aude! 要有勇气运用你自己的理智！这就是启蒙运动的口号。


    其次，我们要思考扑克游戏对教育的启发：


    从孩子到成年人，都应该掌握认知风险的技能。


    在我看来，该训练的目标是建立基于反馈系统的认知闭环。


    所有学校应该秉持的两个教学原则：


    +   1. 教授现实生活问题的解决方法；


    +   2. 不要为考试而教，要为生活而教。


    古人塞内加说过，我们不是为生活学习，而是为学校学习。'
