- pgno: 221
  md: '这种沟通会大幅提升你和朋友之间的沟通效率，也能逐步构建你自己的“叠化人生”。


    叠化自己的想法极为重要。


    给出一个估值，看起来很傻，但是在我心目中，可以拿米区别不同类型的人。懂得量化和概率思维的人极少，能够照此行事的更少。


