  md: '原因在下面。


    假如你没有感到一点点晕，那么你可能并不是真的懂。


    那么霍金的合著者，与耶鲁大学的博士，到底谁对谁错呢？


    真相是：


    +   1. 两个人的答案都是对的。


    +   2. 但“耶鲁博士”对“霍金合著者”的批评是错的。


    那问题出在哪儿呢？


    原因是：


    这两位牛人讨论的题目，压根儿不是同一个。


    我们再来看一下。


    （霍金的合著者）题目A：


    两个孩子，已知至少有一个是女孩，另外一个是女孩的概率是多大？


    （耶鲁大学博士）题目B：


    两个孩子，亲眼看见一个是女孩，另外一个是女孩的概率是多大？


    难道这说的不是一回事儿吗？


    “亲眼看见一个是女孩”，不就证明了“至少有一个是女孩”吗？


    你觉得呢？'
