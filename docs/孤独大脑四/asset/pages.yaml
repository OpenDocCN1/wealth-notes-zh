    # 极少有人属于“机能健全者”。


    美国心理学家罗杰斯认为在成长中，多数人得到的积极关注多是有条件积极关注，而很少得到无条件积极关注。


    只能表露“好的”有条件积极关注的逻辑是：你必须做到A，我才能给你B。B可以是物质奖励，也可以是主观赞赏。


    在有无条件积极关注的影响下，一个人会形成这样的经验：只能表露“好的”（或“可接受的”），否则就会被拒绝被伤害。


    一个人的成长就是不断学习、修正自己“应该如何部分地表露”的过程，最终就形成了一套外在评价体系。


    然而，“表露”经常违背内心。你认为自己“应该这样做”，但你的体验和感觉却是另外一回事。


    久而久之，一个人会逐渐忽略乃至压抑自己内心的体验与感觉，只去关注别人是怎么看待自己的，自己怎么才能的到别人更大的物质或精神奖励。


    罗杰斯认为“机能健全者”有如下五个特征：


    # a、对经验的开放性。


    对于一切情绪和态度，只要它们存在，机能健全者就能够接受。他们相信，任何经验都不可怕，没有必要去歪曲或掩饰。这种态度使得他们的心胸更加广阔；思想更为充实，行动也更趋灵活。


    # b、协调的自我。'
