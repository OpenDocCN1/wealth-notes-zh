- pgno: 294
  md: '女诗人对世界的赞叹，例如“我为称之为必然向巧合致歉”。W则感慨辛波斯卡文字里的精确性，例如“我偏爱自由无拘的零/胜过排列在阿拉伯数字后面的零”。


    摄影师对故事的这个开头既失望又好奇。他一直坚持用胶片拍摄风景，“胶片让我珍惜每一个按下快门的决定”，而网络爱情通常没有他所钟爱的那类古典美。好奇的是，小A和W，两个都是黄皮肤然而文化属性迥异的年轻人，在这个毫无诗意的年代居然因为诗歌而相识。也许只有诗才有这种张力和黏合力。


    假如我正坐在第一堆篝火旁，那么摄影师是在第二堆篝火旁问小A：所以你们相约来走这条死亡之线？小A说，那是上一回了。说完她看W，他不作声。


    小A说，在网上聊了3个月之后，她和W决定见面。W见过“死亡之线”大本营旁墨绿色崖石的照片，他对她说，这像是我梦过很多次的地方，我的父亲一定会喜欢坐在这里吹长笛。


    然而不能。他的父亲在W15岁时失踪，有人说他跳了珠江，也有人说他逃去海外。在欠了一大笔钱之后，这个早年下海打拼了十多年的男人与家人不辞而别，也带走了债主无尽的追讨。


    W年少时恨父亲的懦弱，长大后，尤其是自己创业，又隐约感受到他的坚忍。他潜意识里不愿相信父亲自杀，也许他躲在某个地方，例如遥远的澳洲或者北美，做他喜欢的木工，哪怕他再娶妻生子也没关系。他一定喜欢在那样墨绿色的崖石边，吹他喜欢的长笛。


    W的故事激发了小A掺杂了母爱的恋情。两人如约成行，走在“死亡之线”的第一天，小A给W讲起了自己的父辈。她的爷爷的爷爷的爸爸1880年来加拿大修太平洋铁路。


