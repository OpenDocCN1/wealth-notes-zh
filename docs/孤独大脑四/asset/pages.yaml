  md: '# 未必懂得计算


    金立老板赌博输掉公司。但也可能是，手机行业不好了，公司输了，令老板爱赌露出水面。这个因果我们先不谈。


    喜欢下围棋的人，按理说大局观不会差，思考也有深度。例如围棋爱好者马云，虽然水平很一般，但公司战略颇有围棋智慧。


    但金立老板为什么却陷入赌场，连公司也输掉了？


    这或许是因为，围棋给人一种控制局面、发现最优解的错觉。


    作为围棋爱好者，压力大的时候我会下盘棋“放松”一下。下棋不是费脑子吗？但是有边界的棋盘，大致可控的计算，落子与对手的反馈，输赢的即时满足，能给我带来“有所为”的幻觉。


    班热，他既是斯坦福大学的物理学家，也是一位德州扑克高手。


    物理学训练让他习惯于在纷繁复杂的现象中寻找最简约的数学规律，但是他最终发现：


    他不能指望只凭算牌赢钱。他还需要知道什么时候只凭算牌是不够的。


    > “作为一个物理学家，很难承认你不能仅仅通过推理赢牌，但是扑克就是这样。你不能为扑克建造一个完美的模型，因为所要考虑的变量太多了，你似乎无穷无尽。从这个意义上来讲，打牌就是现实生活的写照。”


    班热说自己早就能够快速算出每手牌的赔率了，但是直到最近，才开始在世界扑克大赛上表现出色。


    > “我猜我在其他方面的技能越来越熟练了，就是那些无法量化的方面。”


    运气和逻辑同样重要。'
