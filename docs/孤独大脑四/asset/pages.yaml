  md: '认为未来的结果完全是现在预期的反馈的观点看起来是荒谬的。


    索罗斯和巴菲特都对市场有效理论提出了质疑。然而，巴菲特会建议普通人去买基于市场有效理论的指数基金，索罗斯则强调自己的理论是“炼金术”。


    对于费曼眼中“荒唐的自然”，以及索罗斯所说的“不确定的人类”，概率都是不错的思考工具，哪怕只是作为拐杖。


    难处在于，理解概率已经不是容易的事情了，而影响人类世俗成就（主要是指成功和发财）的，远非单一的概率计算。


    洞察大机会，确认大机会，捕捉大机会，是多层概率叠加的结果。


    这方面最有名的类比案例，也许是下面这张图了。


    ![](img/3dace955367687898560fd4145a321db_172_0.png)


    该图背后的故事，已经是老生常谈了：


    泰德·威廉斯在他的《击球的科学》一书中这样描述道：对于一个攻击手来说最重要的事情就是等待最佳时机的出现。'
