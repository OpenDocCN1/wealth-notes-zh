    # 现实的容错性与可能性


    为什么聪明人无法征服世界？


    我理解这是现实世界“设计者”的某种仁爱。


    我们常感觉生活是无力的，但也因此，我们被置于一个保护垫当中。


    世界被设计成一个复杂的简单游戏，而非一个简单的复杂游戏，能令每个参与者都有机会。


    所以，现实既具有很大的容错性（看看，你过得那么一塌糊涂，日子照样还可以继续），又具有很大的可能性（每个人都可能中某种人生彩票）。


    如此一来，你可以凭借聪明，凭借冷静，凭借伪装，凭借坚持，凭借分享，甚至凭借运气，来征服这个世界。


    随机性给我们以惊喜，并在无数个你我并不知晓的时刻保护我们。


    你能战胜比你聪明的人，比你强壮的人，比你精明的人，比你勤奋的人。


    这种有趣的设计，令个体的自由意志最大化了。只要你是一个“觉醒”了的人'
