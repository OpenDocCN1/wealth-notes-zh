  md: '刻意掐尖不对，但是如果孩子的个性化优势涌现出来，我们的花园和园丁应该能够呵护好他们。


    # 七


    人类社会的进步史，也是“明狗”和“暗狗”的进化史。


    过去250年的经济增长，受益于三次工业革命，每次都有不同的“狗”大展身手，直至最近的阿尔法狗。


