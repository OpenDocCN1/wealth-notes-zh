- pgno: 373
  md: '然而，这位专家的观点是：


    如果他们想在原地杀你，你早就已经死了。


    所以：


    +   他们不想在原地杀你，他们希望带你去其他地方，或者先干点别的事。


    +   通过打乱他们的计划，你会成为他们最恐怖的噩梦。


    +   如果他们不想被抓，不想把事情搞得太麻烦，他们可能就会直接逃跑了。


    以上三点原则的所有原因，其实只有一个：


    如果你进了他的车，或者跟着他们去了某个地方，你死定了。


    ·以上经验仅供参考，不构成本文作者对遇到绑架的具体建议。


    # 2


    以上是一个生动的博弈场景。


    由此引出我的一句“大脑碎片”：


    好的一手棋，是其令对手有不好的下一手，以及自己有好的下一一手棋。


    我们姑且不论，在第1节里，专家应对绑架的三点原则的适用范围，以及如何根据情境调整策略。


    本文的焦点是：


    极大极小原理。'
