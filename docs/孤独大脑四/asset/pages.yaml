- pgno: 376
  md: '让我们回到绑架现场。


    即使被绑架者非常被动，但这仍然是一场博弈。


    要理解这一点，我们需要强调三个名词：


    +   1、回合；

    2、节点；

    3、选择权。


    # ### 回合


    许多事情，都是连续决策的结果。


    而零和博弈，是敌我双方轮流决策，由一个一个的回合叠加起来。


    # ### 节点


    上述每个回合，你都有一个属于自己的决策节点。


    然而，很多人要么忽视了节点，要么放弃了节点。


    # ### 选择权


    在每个回合的决策节点，你其实是在做一个选择。


    你有选择权，对手也有选择权。


    敌我双方都试图让自己的选择收益最大化，让对方的收益最小化。


    当你被绑架的时候，对手已经出招，现在轮到你走棋了。'
