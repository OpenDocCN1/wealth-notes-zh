    彼得·蒂尔在《从零到一》里总结：


    +   - 只找最好的，因为最好的产生了更多的价值。


    +   - 这个世界遵循幂次法则：一小部分的公司完胜其他所有公司之和。


    他由此总结出了一个风险投资规则：


    只投资给获利可达整个投资基金总值的有潜力的公司。


    这个规则的反例是：


    安德里斯·霍洛维茨投资基金给Instagram公司投资了25万美元，后来赚到了7800万美元，两年不到获得312倍的回报。


