- pgno: 300
  md: '接下来，发生在第三堆篝火旁的故事，尤其是离开篝火后小A和W，或者是M，他俩在崖石上的情节，经历过小A，摄影师，以及我的三重加工，不可避免地会有些戏剧性。即使摄影师用他那腕拍摄的星空照片作证，一切都是真实的。


    小A跑到崖石边时，W，或者M正望着大海，用手向前摸着什么。小A喊道：你的父亲已经死了！


    W或者M停住了，像个没被完全唤醒的入梦者。小A大声说：“他已经死了，没有躲去任何地方。每一个父亲都甘心为自己的孩子去死！”


    温和环境下长大的小A，是在听爷爷讲爷爷的故事时懂得这句话的。爷爷问自己的爷爷：当年你为什么那么勇敢？爷爷的爷爷回答：我从头到尾都是一个胆小鬼。但你要记住，假如我在战场上死了，是为你，而不是为别的任何家伙。


    W或M后来向小A解释自己在摸什么，“我看到父亲坐在墨绿色的崖石上，孤伶伶的。他望见我，一点儿也不惊讶，只是问，你有烟吗？我找不到烟了。”


    W或M哭着去摸父亲的肩膀，他想为过去这些年所有的怀疑和憎恨向父亲道歉。他向前走 去，距离悬崖一步之遥时，听见了小A的大喊。


    再回到篝火旁，小A发现坐在身边的W或者M，已经是一个陌生了。她从他的眼睛里看不到自己曾经熟悉的W。在某种意义上，那场“自杀”成功了，但不知道是W杀死了M，还是M杀死了W。


    W或M必须从父亲的死亡之中走出来，他需要一场仪式，来告别他的告别。'
