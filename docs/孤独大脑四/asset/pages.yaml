  md: '当沙子足够多时，大数定律发挥作用，我们数一下落在不规则图形里的沙子的数量，再除以落在长方形里的沙子的数量，该比值非常接近于“不规则图形的面积/长方形的面积。


    因为长方形面积已知，所以根据该比值，可以计算出不规则图形的面积。


    （伽利略用过更加古典的方法，他会将不规则图形剪下来去称重量。）


    这种看起来很笨的聪明方法，作为非确定性算法，可以在保持对不规则图形的未知的情况下，非常精确地计算出想要的数字，尤其是在计算机的帮助下。


    蒙特卡洛方法，能够解决那些确定性算法无法解决的问题。


    随机性和不确定性，不再是人类的敌人。


    这种方法的名字，来自摩纳哥的蒙特卡洛赌场。


