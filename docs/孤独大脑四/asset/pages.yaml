- pgno: 111
  md: '摘韋聪明人的时刻到了。


    你看，即使是耶魯的博士，也混淆了二者之间的区别。


    > （《簡單統計學》是很好的書，而且也有說小說竟是我說錯了。）


    最简单的方法是采用贝叶斯公式来计算，但是我继续采用**零公式**的方式，来做一些可感知的推理。


    “**至少有一个是女孩**”，与“**亲眼看见一个是女孩**”，并非一回事。


    这个是关键。


    这二者直接的差别，可以从空间、时间两个维度的“整体与局部关系”来揭示。


    1、先看空间维度的“整体与局部关系”。


    “**至少有一个是女孩**”，不能确保你亲眼看见的那个就是女孩。


    尽管你可以由“亲眼看见一个是女孩”推理出“**至少有一个是女孩**”，但是，你不能由“**至少有一个是女孩**”推理出“亲眼看见一个是女孩”。


