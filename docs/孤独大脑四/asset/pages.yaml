  md: '# 启发六


    # 所谓仁慈的狮子，


    是指你要当好人，但保留惩罚坏蛋的权利


    如题，这一条启发，反过来也是适用的。


    例如，你彻底放弃惩罚对方的权利，以换取对方彻底的信任。


    前提是你相信对方是一个珍惜荣誉的人。


