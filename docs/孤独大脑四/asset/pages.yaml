- pgno: 296
  md: '100年前的年轻人們对欧洲大陆的遥远战争慌张无措。小A的爷爷的爷爷，出人意料地站了出来说：我去参战。那是人們第一次觉得这个小混混干瘦的身材如此伟岸，陆续有人追随，华人们奔赴前线，为不属于他们的国家，打一场不属于他们的战争。


    爷爷的爷爷成了战火中华人小伙子们的领袖，他对每一个人说：要活着回来。他甚至带着一个小分队执行过危险的敌后任务。小A的爷爷给她讲自己爷爷的故事：爷爷一枪都没开过。小A不敢相信。爷爷说，重点在于，他活着回来了。更神奇的是，社区里和他一起去欧洲的十来个年轻华人，全部回来了。他们不辱使命，此后华人的地位逐渐改善。然而，战斗过的年轻人几乎没机会看到，2006年加拿大总理为“历史上向华人征收人头税”而道歉。


    第四天，小A和W来到了大本营，死亡之线的正 midpoint，过去和未来的原点。日落时W在崖石边矗立了很久，景色正如照片，陌生而熟悉的美让人不安。晚上照例会有篝火，也就是本文我烤生蚝的篝火、摄影师的星空下的篝火之后的第三个篝火。


    我倒不是为了设计什么套式的叙述结构，只是在尽量忠诚地转述摄影师所转述的由小A转述给他的故事。在第三个篝火旁，W感谢小A邀请他来，过去四天的时光是他此生最难忘的经历。小A愣了一下，说：不是你邀请我的吗？


    第一堆篝火旁的摄影师说：小A在第二堆篝火旁在讲述这段故事时，W在旁边一直没说话，好像和他无关似的。第三堆篝火旁的小A和W都意识到发生了些状况，假如他们都没有邀请对方，那么是谁设计了这次会面与徒步穿越？


    1573'
