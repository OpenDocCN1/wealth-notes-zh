    # 段⼦


    青年：“⼤师，我期末辛苦准备了很久成绩却还是不好，GPA降了好多，有什么⽅法能让我GPA只升不降么？”


    禅师微笑，答：“海浪翻涌，⽉圆⽉缺，这世上有甚⽌规律是⼀直增长且断然不会下降的？”


    青年略⼀沉吟说：“熵”。


    孤立系统的熵值永远是增加的。化学及热力学中所指的熵，是⼀种测量在动⼒学⽅⾯不能做功的能量总数，也就是当总体的熵增加，其做功能⼒也下降，熵的量度正是能量退化的指标。熵亦被⽤于计算⼀个系统中的失序现象，也就是计算该系统混乱的程度。


    根据熵的统计学定义，热⼒学第⼆定律说明⼀个孤立系统倾向于增加混乱程度。


    在信息论中，熵被⽤来衡量⼀个随机变量出现的期望值。它代表了在接收之前，讯号传输过程中损失的资讯量，⼜被称为信息熵。熵是对不确定性的测量。在信息世界，熵越⾼，则能传输越多的信息，熵越低，则意昧着传输的信息越少。


