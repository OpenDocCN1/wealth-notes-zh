    # 扑克高手第四课


    控制情绪


    # 要点1：克服恐惧


    首先，你要克服恐惧心理。


    居里夫人说：


    生活中没有什么可怕的事物，只有需要理解的事物。现在是我们理解更多事物的时候了，只有这样，我们害怕的事物才有可能越来越少。


    从不犯错的系统称不上是智慧的系统。


    克服恐惧，并不是彻底摆脱恐惧。


    恐惧应该是一种高级的情感。而且，从基因层面，我们很难用几千年的文明史去改变自身数十万年的丛林生活记忆。


    克服恐惧，这个说法需要更精确地描述：


    我们要的不是在理性决策的时候不恐惧，而是在恐惧的时候依然能够理性决策。'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# 要点2：“无记忆”打牌


    一位牌手在回答“打扑克让你印象最深的一件事是什么”时，有如下精彩回答：


    可能每一个长期的德州扑克玩家，都各有各的“顿悟”瞬间。我自己印象最深的“顿悟”，不是在牌桌上悟到的，而是在多年前学物理学的时候。


    大家可能都听说过布朗运动，就是花粉颗粒在水溶液中不停地做无规则运动。记得当年我学习布朗运动在数学上的理论，叫马尔可夫过程。


    简单地说，这种过程必须具备“无记忆”的性质：下一状态的概率分布只能由当前状态决定，在时间序列中与之前的历史无关。


    学到这里，我突然吓了一大跳，意识到德州扑克比赛就是一个马尔可夫过程，状态就是你桌子的筹码量。


    ![](img/3dace955367687898560fd4145a321db_233_0.png)


    比如我桌子上现在有一万个筹码，是刚刚由五千个筹码翻倍赢来的，还是两万个筹码被别人一个Bad Beat输了一半剩下的，数学上是绝对无区别的，也就是说接下来我在这个比赛的成绩，只跟我现在有一万个筹码这个事实相关，跟我如何拥有这一万个筹码的历史无关。'
  merge: -1
  img_proc: true
- pgno: 234
  md: '但对人来说，两者的区别是天上地下。人性显然是不可以完全克服的，但从这个时候起，我就尽量让自己像水中的花粉，完全“无记忆”地打牌。


    我曾经说过，每个牛人都是一个人肉阿尔法狗。阿尔法狗下围棋的特点是什么？它下的每一手棋都会重新思考，并且从终局推算赢棋概率。


    **不要因为糟糕的结果而否定正确的选择。**


    在现实中，你坚持做正确的事情，短期内未必有很好的回报，但你还是要坚持做正确的事情。


    打无记忆的牌，不止是追求平常心的状态，还包含了“将过往压缩为已知条件”的智慧。


    # ## 要点3：控制自己的情绪


    在打牌的过程中，每个人都会有情绪失控的时候。扑克中的术语叫“on tilt”，


    +   比如坐在牌桌上，每当系统风险给你带来不利的时候你的情绪会失控，会开始胡乱地加注入池、胡乱地诈底或者买一些不该买的牌。那么在这种情况下你的决策就属于非理性决策，更容易造成亏损。


    巴菲特称之为：当你掉进一个坑里的时候，会更加卖力地挖坑，结果越陷越深。


    《赌博思维》写道：


    > > 顶级扑克牌手也有40%的时间在犯错，客观面对错误比任何技巧都重要。


    该书作者Annie Duke始终在强调一点：'
  merge: -1
  img_proc: true
- pgno: 235
  md: '扑克牌技术并不是制胜的关键，逢赌必赢也不是成为顶尖高手的必备条件，而是一场心理战，其中很重要的一个策略就是克服“自利偏差”（Self-Servicing
    Bias）的心理障碍。


    “自利偏差”，简而言之就是推卸责任和自我欺骗。


    在


    Annie


    Duke看来，这种“自利偏差”就是扑克牌最顶级的高手和普通牌手的分水岭，想要成为顶尖高手，最重要的途径之一就是克服这个心理。


    具体而言该怎么做呢？


    Annie


    Duke获胜的关键在于，每局牌结束之后的短暂间隙，她都会迅速回溯刚才的比赛，总结自己在决策过程中成功之处和犯过的错误：


    “最差的决定也可能在运气的帮助之下赢钱，而最好的决定也可能因为时机不对而输钱，好和坏不能以结果来定义，我必须分清楚究竟是我的技术导致还是运气的帮忙，这点非常重要”。


    # 要点4：控制他人的情绪


    以德州扑克的加注行为为例，表面上看起来是玩家展示对底牌的信心，但也可能只是诈唬，想偷鸡。所以职业扑克选手总是要解读对方。


    所以最好的扑克选手也是最好的骗子，用最真诚的诈唬和最始料不及的下注打乱对手的阵脚。他们知道对一个牌手而言，最重要的不是你手中有什么牌，而是让对手认为你手中有什么牌。


    玩家必须让自己的行动随机化，这样他诈唬时才能让对方无法确定真假。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '卡耐基梅隆大学开发的AI程序Libratus和Pluribus把这一点做到了极致。它的下法非常的随机化，甚至超过了人类最好玩家的水平。


