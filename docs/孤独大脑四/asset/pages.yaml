- pgno: 26
  md: '# How


    你怎么样读书？


    **首先，我赞成用“切割”的方式。而非“收集邮票”。**


    证伪比证实更具现实意义。例如你没“证实”这个世界上没有会飞的猪，但你可以“证伪”这个命题，只要你找到一头会飞的猪。


    “有用”的书，价值在于让你不要做什么事。


    读书的目的是为了“扩大你的认知半径”，读书的结果是为了“缩小你的行动半径”。


    +   - 你想发财，首先是让自己别当韭菜；


    +   - 你想幸福，首先是让自己远离那些让你不幸的事情。


    芒格鼓励人们掌握多种思维模型，很多人认为就像收集龙球，只要达到一定数量就可以很厉害了。


    这是巨大的误读。


    **多元思维模型不是用来搭建一个“厉害杀人武器集合”的，而是用来切割钻石。这个钻石就是你的大脑。**


    陶冶性情的阅读，如果不能切割你的灵魂，也是浪费时间。


    **其次，跨学科的目是为了形成底层的连接。就像神经元之间的连接一样。**


    但是做到这一点非常难。学科之间的智慧很难转移。表面上的跨界，只是让你到哪儿都能发表一下评论而已。'
