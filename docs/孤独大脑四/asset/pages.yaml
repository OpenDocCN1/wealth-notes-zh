    ![](img/3dace955367687898560fd4145a321db_334_0.png)


    沙漠隐修士埃瓦格里乌斯·庞帝古斯定义出八种损害个人灵性的恶行，分别是贪食、色欲、贪婪、悲叹、暴怒、懒惰、自负及傲慢。


    六世纪后期，教宗额我略一世将那八种罪行减至七项，将自负并归入骄傲，悲叹并归入懒惰，并加入妒忌。他的排序准则在于对爱的违背程度。其顺次序为：傲慢、妒炉、愤怒、懒疮、贪婪、暴食及色欲。


    欲望是一种“可食用”的枷锁。


    每当人们通过满足某个欲望而短暂地摆脱该欲望枷锁，该枷锁很快便加倍地卷土重来。'
