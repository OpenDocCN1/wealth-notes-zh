- pgno: 295
  md: '"你知道吗？我从来没有坐过那段铁路。"


    W问为什么，小A答：“每英里铁轨下都有华工的尸骨。”


    铁路沿着菲莎河谷陡崖的那一段，风景有多壮美，当年的华工就有多悲凉。两人边走边说，W摘了一朵野花给小A，念叨：“远方的战争啊，原谅我带花回家。”小A听出是辛波斯卡的句子，沉重的脸上微微有笑。


    直至18岁，小A都没去过中国。因为年代久远，亲戚早已踪迹难觅。刚上大学那年，她去煤气镇看爷爷的爷爷在唐人街的旧居。他是修铁路华人的下一代，境遇并不因为自己父亲的卖命而改善，当时的政府卸磨杀驴，向华工征收人头税。


    小A穿过小巷时，看见一家小小的服装店，里面挂着中式衬衫。晚上她做了个梦，梦见自己穿着那样的裙子，走在粉墙黛瓦边的油菜地里。她认定那是自己家园的样子。


    "我有家，但没有家园；你有家园，但没有家。"徙步的第三天，小A对W说。


    W安慰她，说自己回到老家，早已物是人非，故乡有故无乡。也许像你这样的跨国流浪者反而更懂得家园的意义。


    小A问，你的故乡有油菜花吗？W说，有。老家房倒了，湖臭了，唯有油菜花还和记忆里一样，仿佛江河里不随波浪流逝的浮标。


    小A讲爷爷的爷爷的故事：他没机会读书，游手好闲，也不擅干活。一战开打，华人社会的长老们说，也许我们该做些什么。尽管已经付出了很多，受到不公正待遇的华人仍然试图证明，自己有资格生活在大洋彼岸的这片土地上。'
