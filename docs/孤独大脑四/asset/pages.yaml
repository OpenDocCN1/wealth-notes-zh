  md: '清风徐来，水波不兴：白霜横江，水光接天。一时间，他飘飘乎如遗世独立，羽化而登仙。


    这时，客人中有吹洞箫者，倚歌而和之，其声呜呜然，如怨如慕，如泣如诉。


