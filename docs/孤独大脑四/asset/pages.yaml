- pgno: 66
  md: '如果他遇到吴清源，一定会有很多话想说。例如势和利的平衡，过去、现在、未来的关联，时间贴现，等等。


    马克.施皮茨纳格尔写道：


    资本具有跨期特征：它的定位和未来不同时点的优势是核心。时间是资本的生存环境————定义它、塑造它、帮助它、阻碍它。当用一种新方式思考资本时，我们也必须从新的角度考量时间，当我们这么做时，这就是我们的路径，我们的资本之道。


    该书的关键词之一是“迂回”：为了在后期获得优势，而愿意在前期处于劣势。


    这正是围棋里“势”与“利”的关系，其中交织着计算以及对未来的预测。


    吴清源在棋盘上如行云流水，得益于他对“势”与“利”的超常洞察。


    马克.施皮茨纳格尔认为“迂回”这种做法几乎不可能有人会愿意遵循。


    正如老子所说：“明道若昧。进道若退。夷道若颡。上德若谷……大器晚成。”


    有人认为马克.施皮茨纳格尔传递了这样一种理念：


    弄懂如何处于胜利位置的过程，要比确定赢利目标更重要。


    好玩儿的是，王铭琮在研究围棋AI何以碾压人类时，得出了超乎常人设想的结论：


    +   - 我们以为AI算法是靠计算力击败人类，就像汽车是靠机械的“蛮力”而比人跑得快。

    - 但事实是，比起堆积意义的“算棋”，无从捉摸的“形势判断”重要太多了。'
