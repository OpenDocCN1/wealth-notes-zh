- pgno: 219
  md: '**风险：如果风险是已知的，想要做出明智的决策，你需要的就是逻辑思维和统计学思维；**


    **不确定性：如果有些风险是未知的，想要做出明智的决策，你还需要直觉和睿智的经验法则。**


    瑞士最高法院于2010年裁定德州扑克是一个以运气概率为主的游戏(game of chance)，因为“简单的数学、策略及心理学在此游戏中所占的分量比不上运气成分”。


    美国宾夕法尼亚州上诉法院于2010年3月裁定德州扑克为非法赌博，因为认定德州扑克的运气成分大于技巧成分。


    那么扑克赢家主要靠实力还是运气呢？


    和现实世界的人生一样，短期靠运气，长期靠实力。


    当然，还有我经常说的，运气也许不能改变，但运气的运气可以。


    在那些运气是技术的一大大部分的游戏当中——例如德州扑克和风险投资——长线的结果总是会趋向玩家（投资人）真实的技术实力，而在短线上，运气决定了一切。


    怪 诞 行 为 学 鼻 祖 Steven Levitt，在测量了运气与技术德州扑克中的关系后，总结道：


    > “那些在游戏前就被鉴定为高手的玩家平均比一般玩家多获得30%左右的投资回报。”


    但这个结论也有一个大坑，我们在游戏前如何鉴定出谁是高手？上面这个结论，会不会是幸存者偏差式的统计错觉呢？


    这些，也许正是扑克和人生有趣的地方。'
