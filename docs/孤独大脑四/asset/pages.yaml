  md: '# 创业是一种童子功


    > “在所有的知识中，

    智者与好人寻找最多的是了解他们自己。”


    芝士比亚


    # 故事一


    二十岁那年，我将要读大三，父亲来北京探望。夜晚的北三环路上，居然有骡子拉着车“啾啾啾”走过。


    我冷不丁对父亲说：我想经商。


    “扯淡。”


    他以自己一贯的利落回答道。


    毕竟那时是1993年，中国奇迹般的三十年经济腾飞还是萌芽阶段，商人地位低下，名声恶劣，包分配的大学生毕业后找个好单位是唯一选项。


    之所以有经商的念头，是因为我总去和平街北口的书报摊买围棋杂志。


    有时我会顺手翻翻别的书，琢磨一下标题和封面设计，根据书的摆放位置推测畅销程度。


    边看边想：“假如是我来做，我会怎么做呢？”


    我发现，自己对“商品”有感觉。'
