- pgno: 379
  md: '游者决不会从他的最佳策略上偏尚到对自己造成威胁的策略上去。


    尤其是在零和博弈中，对你有利，对绑匪就不利。


    请看上面的图，在第三回合，绑匪会极力让你的收益最小化。


