  md: '# **斯德哥尔摩综合征**


    1973年发生在斯德哥尔摩的一场银行劫持案。4名人质数月后仍对劫匪显露出怜悯的情感，并对警察采取敌对的态度。


    研究者发现这种综合征的例子见诸各种不同的经验中，从集中营的囚犯、战俘与乱伦的受害者，都可能发生斯德哥尔摩综合征。男女皆可能有此症状，女性的比例比较高。


    美国联邦调查局的人质数据库显示，大约27%的人质表现出斯德哥尔摩综合征的症状。


    据心理学者的研究，情感上会依赖他人且容易受感动的人，若遇到类似的状况，很容易产生斯德哥尔摩综合征。


    # **讨厌改变，渴望稳定性**


    布里的萨说：只有尿湿裤子的孩子才喜欢改变。


    不喜欢改变，是渴望现状的稳定感。建筑行业过高的荣誉，便是基于人们对牢靠（通常以体量和设计感来夸大这牢靠）支付的溢价。


    如加尔布雷思所言：当面临要么改变想法，要么证明无须这么做的选择时，绝大多数人都会忙于证据。一个人的大脑有极强的说服自己的能力，而且可以令那枷锁毫无痕迹。


    最难改变的是观念。观念的改变，开始时多表现为负收益。但正如彼得·德鲁克的真知：观念的变化不能改变现实；但能改变现实的意义。


    改变，也是一种相对状态。当众人都被一种理所当然的趋势所裹挟时，不改变亦为某种“改变”。'
