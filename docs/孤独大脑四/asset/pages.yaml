  md: '![](img/3dace955367687898560fd4145a321db_265_0.png)


    我们假设，上图是一个赌徒与赌场的对赌游戏：


    赌徒闭着眼睛在长方形上空往下扔沙子，假如掉在不规则图形里，一块钱变两块钱；假如掉在不规则图形之外，一块钱全输掉。


