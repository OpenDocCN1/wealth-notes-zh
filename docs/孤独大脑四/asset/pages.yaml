    麻省理工学院的视觉专家泰德·阿戴尔森谈及人类的错觉时说：


    这表明了视觉系统的成功之处而非失败之处，我们的视觉系统并不能作为物理学的测光表，这也不是它存在的目的。


    正所谓成也萧何，败也萧何。


