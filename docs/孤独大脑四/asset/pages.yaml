  md: '• 不仅为现在，还为未来。


    • 不仅为自己的未来，还为别人的未来。


    无论一个人是否有具体的人生目的或使命，他或多或少都在做一些超越自身的“跨期”选择：


    +   - **总体大于部分之和，那个东西就是有生命的；**


    +   - **在无限时间里的价值大于有生之年的价值，那个生命就是有灵魂的。**


    # 十三


    爱彼迎的创始人去拜访巴菲特，聊了几个小时后，股神对他赞赏有加：


    **哪怕不给这个家伙一分钱，他也愿意干现在的事情。**


