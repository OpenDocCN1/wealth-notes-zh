- pgno: 262
  md: '然而令人惊讶的是，这种自然的无序扩散可以创造出精致的结构。这种扩散如果发生在引擎中，就可以让发动机吊起砖块建造教堂；这种扩散如果发生在种子里，就可以让分子形成花朵。这种扩散如果发生在你的身体里，在你的大脑中随机的电流和分子就可能会被加工成想法。


    这就是生命与创造的魅力，也是信念的价值和意义。


