  md: '从中，我们似乎可以发现犹太人“超额”成就背后的秘密。


    然而，这一点，绝非单靠学校可以实现。


    教育的困境之一是，人们从教育方式上试图为孩子们营造一个游乐场，从教育目的上却又无法隔离成人世界的功利。


    先说方式。我们为孩子的教育设置，像一个知识上的过家家游戏，我们仿佛在教会孩子一些为真实世界做准备的东西，但其实只是些过分简化的模型，比乐高好不了太多。


    成人教婴儿说话，喜欢说：吃糖糖。也许由易到难是对的，但是一直刻意回避现实世界的复杂、艰难、混乱，对教育而言并不正确。


    童年是人类的发明。这一发明是为了让孩子在一个相对被保护的环境里，更高效地通过探索、犯错、学习，来理解真实的世界，而不是把孩子保护在真空箱里。


    教育体系的过家家，令大多数从业者和父母，都把精力放在细节上，他们把教育孩子当做了插花游戏，浪费时间在那些没完没了的造型、角度，在萝卜上雕花，在植物的早晚会换掉的幼叶上精益求精，纠结于彼此之间毫无意义的比拼，完全忽视了复杂系统的科学原理与常识。


    教育的理论家和研究者，不仅应该是“面对孩子世界难题”的专家，更应该是“面向成人世界难题”的专家。


    童年的设计，教育的目的，是让孩子在被保护的环境下，有机会直面整个世界的难题，全体人类的难题。


    我现在，正尝试在这方面做些什么。


