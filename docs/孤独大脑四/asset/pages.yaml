    # 对于教育孩子，更别掉入比较的陷阱。


    单一维度的竞争，不会有真正的赢家。教育更是如此。


    教育部最近打算禁止各地搞分数排名，绝对英明。


    就像《星际穿越》里说的，买条裤子还需要两个数字，为什么一个孩子的未来可以用一个数字决定？


    人生有太多维度，孩子有太多可能，简单粗暴的比较，是对未来的伤害。


