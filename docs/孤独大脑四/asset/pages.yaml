- pgno: 374
  md: "绑架，是一场零和博弈。\n\n就像下棋，一个人赢，一个人输，即使和棋，也只是暂时的平静。\n\n双方没有合作的可能。\n\n对于这类博弈，冯·诺依曼提出了“极小极大原理”。\n\
    \n《囚徒的困境》一书，用我们熟悉的分蛋糕来示例。\n\n众所周知，公平的分法是：一个人切，一个人选。\n\n假如两个孩子都不是孔融，并且都想吃更多蛋糕，这其实是一个典型的零和博弈。\n\
    \n+   * 第一个孩子（切蛋糕那个）的两个策略是：不均匀和尽可能均匀。\n    * 第二个孩子（挑蛋糕那个） gli也有两个策略：选较大的那一块或选较小的那一块。\n\
    \n如下图。\n\n（请注意，表格里的4个结果，都是指切蛋糕的孩子的所得收益。）\n\n| 切蛋糕者的策略<br>尽可能切得均匀<br>使得一大一小 | 挑蛋糕者的策略\
    \ |  |  |  |\n| --- | --- | --- | --- | --- |\n|  | 挑较大的那一块 | 挑较小的那一块 |  |  |\n\
    |  | 拒收大点的半块蛋糕 | 收大点儿的半块蛋糕 |  |  |\n|  | 小的半块 | 大的半块 |  |  |\n\n切蛋糕的孩子貌似掌握了主动权，但他决策的关键点，取决于“然后呢？”——即对手的下一步会怎么做。"
  merge: -1
  img_proc: true
- pgno: 375
  md: '显然，挑蛋糕的孩子，会追求让自己的蛋糕最大化，也就是让对手的蛋糕最小化。


    对应上面的表格，挑蛋糕的孩子总是会选择左边一列，从而导致切蛋糕的得到左边一列的两个较小蛋糕的结果。


    于是切蛋糕的孩子要做的事情，就是：


    **让挑蛋糕的孩子将要留给他的最小的那半块蛋糕极大化。**


    因此，切蛋糕的孩子只能选择尽量均匀分蛋糕，以保证获得差不多的半块蛋糕。


    这个量，是行中极小值的极大值，被称为"极大极小"。


    也许有人会说，这么简单的道理，为什么要说这么啰嗦？


    德谟克利特早在公元前300多年前，就创立了"原子论"，认为每一种事物都是由原子所组成的。


    然而，这只是一种想法。


    对比而言，爱因斯坦对原子的理解，才算是科学。


    二者之间的区别在于：后者可实验，可计算，可运用。


    作为博弈论的创始人，冯·诺依曼说过：没有极大极小定理，就没有博弈论。


    《囚徒的困境》一书对极大极小定理总结道：


    +   在两个利益完全相反的人之间出现的有精确定义的冲突，总存在一种理性的解；


    +   所谓理性的解，就是在给定冲突性质的前提下，双方都确信他们不可能期望有更好的结果了。'
