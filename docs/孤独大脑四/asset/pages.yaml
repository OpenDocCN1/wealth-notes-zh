  md: '# 胶带纸思维：聪明人正在用的“笨办法”


    如果一个蠢方法有效，


    那它就不是蠢方法。


    要想成为厉害的人，你并非要像世界上最聪明的那些家伙一样，事事都做到完美。


    恰恰相反，你应该学习的，是他们面临困境时的秘密武器：


    “胶带纸思维”。


    这个听起来有点儿奇怪的思维方式，看起来笨拙、临时、凑合，但是非常管用。


    而且，“胶带纸思维”真的就像胶带纸一样，拿来就能用，看起来简单，却能解决大问题。


    正如传说中的《美国士兵守则》第二条所说：


    > “如果一个蠢方法有效，那它就不是一个蠢方法。”


