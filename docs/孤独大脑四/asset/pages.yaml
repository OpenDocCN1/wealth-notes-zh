- pgno: 182
  md: '![](img/3dace955367687898560fd4145a321db_182_0.png)


    如此一来，各路学家乱七八糟的理论和建议，就有了一个（看起来）清晰的架构了，而且，为概率分析搭建了可计算的框架。


