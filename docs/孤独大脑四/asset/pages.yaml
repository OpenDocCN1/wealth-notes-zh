    # ### 贝叶斯方法在法航事件搜救过程中的应用


    在2009年6月1日号里，法航447机师失事。2010年7月，法国空军及调查处委托Metron负责重新检查分析已有的搜救有误，以便绘制一副飞机残骸可能地点的概率分布图，如图5-5所示。图中由大到小的顺序为：红，橙，黄，绿，蓝。


    ![](img/3dace955367687898560fd4145a321db_255_0.png)


    在对高概率区域进行持续一周的搜寻之后，残骸被发现。


    随后，飞行数据记录器和驾驶舱话音记录器均找到。


    最终确认残骸的位置与图中的概率中心位置并不远。


    如上，也是一张“格子”图。


    救援队根据上述概率分布图，先从概率最大的区域搜索，如果没有发现，就在过往数据基础上更新概率分布，继续搜索最大概率区域。


    其中，贝叶斯更新的过程，简单示范如下：


    ```

    p(H|D) ∝ p(D|H)p(H)

    ```'
