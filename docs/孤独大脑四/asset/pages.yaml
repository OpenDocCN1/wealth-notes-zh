  md: '# 无岸


    本篇是旧文，约有10%更改。


    "生他之地不养他，养他之地不留他。"妈妈曾在襄阳街头为我求到此卦，算命先生也许听出了她的武汉口音，精确地"算"出她的儿子"生于彼处而长于本地"，而未来则又在他乡。那个下午，我正在北京的学校里，被裹于青春的泥泞间，并不知自己将会随便买张南下的火车票，在广州一留十六年。对从小就怕热的人而言，这是个有点儿宿命般的嘲弄。


    除了被童年记忆虚构过的暑假，我经历过的最舒服的夏天在温哥华，一座被加国人认为很不加拿大的飞城。即使到了六月，城市北边的山尖上依然可见白雪。太阳晒得东西发烫，但只要有点儿阴凉之地，就像有冷气从哪儿漏出来似的吹在身上。仿佛窝在炉火旁看窗外的冷雨，我喜欢这有点儿分裂的感觉。


    2016年暑假我们去了鲍威尔河，需要坐两次渡轮，开5个小时左右的车。营地不远处有一个小岛，没水没电，却满是当地人的各色度假屋，老孩子们无无所事事地在码头捞螃蟹。


    上岛需要做船。也有人直接从城市飞来。水上飞机降落在湛蓝的海面，徐徐滑至沙滩边，先出来的是飞行员，她亚麻色的头发扎在脑后，眉目清秀神情羞涩，脸颊微红像开拖拉机的三八红旗手。女飞行员身兼数职，从机身下侧拿出乘客一家人的行李箱，挥手说再见，爬回驾驶坐，像海鸥一样轻盈地飞去了。


    1569'
