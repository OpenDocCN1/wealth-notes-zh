  md: '# 做拥抱风险的水手


    《财报就像一本故事书》一书中的故事：


    1835年，法国思想家托克维尔在其名著《论美国的民主》（Democracy inAmerica）一书中提问：为什么当时欧洲和美洲之间的贸易，大部分被美国的商船所垄断？答案：美国商船渡海的成本，比其他国家商船的成本低。


    何以有这种成本优势？美国商船的建造成本不低，但使用时问短：美国商船雇用船员的薪水还高，表面上看来真是一无是处，毫无优势。托克维尔却认为：美国商船之所以拥有较低的成本，并非来自有形的优势，而是因为心理与智力上的优势。


    书中的结论是：


    +   - 欧洲水手过于追求确定性；


    +   - 美国水手敢于拥抱风险。


    欧洲水手做事谨慎，往往等到天气稳定时才愿意出海；在夜间，他们张开半帆以降低航行速度；进港时，他们反复地测量航向、船只和太阳的相对位置，希望避免触礁。


    相比之下，美国水手似乎爱拥抱风险。他们不等海上风暴停止就急着拔锚起航，日以继夜地张开全帆以增加航行速度，一看到显示快靠近岸边的白色浪花，就立刻加速准备抢滩。


    这种不畏风险的航海作风，使得美国商船的失事率远高于其他国家的商船（这种风险颇能解释为为什么要支付水手较高的薪资），但这种航海作风确实能缩短漂洋过海的时间，并大幅降低成本。'
