- pgno: 78
  md: '原来，我们对“日拱一卒”理解得太浅了。


    真正的高手，对“日拱一卒”，有如下正确姿势：


    +   1、“日拱一卒”是做乘法，而不是做加法；


    +   2、关键在于大规模重复，进而形成网络效应；


    +   3、“拱”是行动，更是决策，以应对不确定性；


    +   4、“日拱一卒”需要凸性的守护；


    +   5、在资产和资源的大局观下“日拱一卒”。


    # 姿势之一


    > “日拱一卒”是做乘法，

    而不是做加法


    让我们回到开头的段子。


    假如你每天赚208万，你的财富变化是这样的：


    第一天：208万；


    第二天：416万；


    第三天：624万；


    第四天：832万；


    ……


    第n天：208×\On万。'
