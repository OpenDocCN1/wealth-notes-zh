    几乎没司机有动机要撞你。


    但是，理论上，每个司机都有撞你的“可能性”。


    对你而言，这个最坏的结果可能性很小，后果很严重。


    这正是极大极小原理的灵魂：


    “你知道，你所能期盼的最好结果就是避免最坏情况。”


    # 启发五


    # 珍惜每一个选择权，


