- pgno: 297
  md: '第三堆篝火旁的W像被夺去了魂魄。M的计划，前半部分（设计两人相识）非常完美，后半部分（设计两人相遇）极其冒险，衔接处的漏洞（设计两人邀约）虽不明显，可对于两个喜欢辛波斯卡这类如激光手术刀般精准的诗歌爱好者而言，早晚会识破。


    然而M一如既往地主聪明，假如想让两堆不相干的火烧在一起，你必须挖掘出双方心底最深处的燃料。他在那个古老的BBS不多的几个注册者中挑出了小A，这个险值得冒，也是最优解。


    除了彼此吵闹三观不符，W和M是一对天生搭档。这一次他俩再次默契配合，W在第四天看穿了M的圈套，这是一个完美的位置，没有退路。不管是向哪头走，两三天内都不会有手机信号。M足以让律师准备文件，卖掉他俩的公司，W再也没有机会去拍M的桌子。


    第二堆篝火旁的小A告诉摄影师，W离开了第三堆篝火，独自一人走向海边。她没有跟去。她不知道该从哪一头来安抚W，因为她也是受害者之一。但显然W受伤程度更大，被戳破的爱情幻觉，搭档的背叛，事业的戛然而止。上一次类似的打击是他父亲的离去。小A猜测W会坐在墨绿色的崖石上发呆，大海远处或许有夜行的邮轮经过，开向阿拉斯加的冰川。


    讲到这儿，第一堆篝火旁的摄影师环顾了一圈静静发呆的我们，有点儿诡异地笑，你们以为这是故事的结局？不。


    一个好的摄影师必须是一个好的故事讲述者，构图的张力和情节的张力，拥有类似的空间与时间压缩原理。摄影师说，在第二堆篝火旁的时候，我和你们一样，沉浸在情节里，但又隐约觉得电影还没到收场的时候。这时，小A开始继续讲第三堆篝火旁的故事。


    第三堆篝火旁的小A脑子全空了，W的空位置上，有一张小纸片，她拿在手里无意识地翻转着。这时旁边一个一直默不作声的徒步者小心翼翼地说道：我知道W的公司。


    1575'
