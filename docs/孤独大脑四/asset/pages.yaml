- pgno: 293
  md: '到了晚上，我们在营地围着篝火烤生蚝，海边遍地都是这种柔软美味的动物，坚硬的外壳不能改变它被生吃或被活烤的命运。坡下几个帐篷住着闹哄哄的印度人，于是他们旁边的两拨华人跑过来“避难”。


    我因而听到了小A和W的故事，也许还有M。讲述者是位摄影师，移民加拿大前他是位地产商，过去十年拍遍了北美山川。同期，他的富豪朋友们或者更富，或者“挂掉”了。


    摄影师说，他是在一条被称为“死亡之线”的野外徒步路径上遇见小A和W。这条路径以漫长和难走著称，全程需要七天。路线正中，也就是走到第四天的时候，有一个海边的营地，不远处是巨大的断崖，海浪打击着墨绿的岩石。


    这个营地有点儿珠峰大本营的味道，驻扎着来自世界各地的怪人，人们疲惫而兴奋。大家都说，至少今天不用再纠结于是前行还是放弃，因为两头的距离都一样。


    小A是第六代的华裔，爷爷的爷爷的父亲在上上个世纪从广东来到加拿大BC省修铁路。她不太像一个“黄面白心”的香蕉人，中文讲得很好，不知为何还有点儿江南口音。


    W是从中国来的游客，在南方创立了一家科技公司。摄影师对小A和W的相识相恋很好奇，怂恿他们讲自己的故事。那晚星空格外灿烂，没什么风，大海也仿佛搬了小板凳坐在篝火旁，静静地听着。


    所以，确切来说，我是在篝火旁听到一个陌生的摄影师讲他在另外一个篝火旁听到的别人讲的故事。我们盯着噼啪作响烧着的木柴，仿佛情节正从另一个火焰里穿越而来。


    小A和W相勤于一个BBS，这年头网上姻缘已是常态，不寻常的是BBS算网络古董，更不寻常的是这个BBS的主题是半波斯卡。小A喜欢这位波兰'
