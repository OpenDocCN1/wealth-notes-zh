    所以，处在第二回合的“我”，要考虑的是，第三回合的对手会怎么做，以及自己会有怎样的第四回合。


    《囚徒的困境》引用了卡尔维诺在《寒冬夜行人》一书中的一句话：


    > “你知道，你能期盼的最好结果就是避免最坏情况。”


