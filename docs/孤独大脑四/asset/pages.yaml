    +   5、总算实现了移动互联网定向闭环LBS广告。


    你看，是不是很笨、很低效、很临时？


    对于这家初创公司而言，重点不是用“胶带纸思维”实现了他们的第一个信息流个性化推荐广告，而是他们认定：


