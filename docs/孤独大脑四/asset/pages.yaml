    +   - 狭义而言，"暗狗"类似于开外挂，在有边界、有标准答案的竞技游戏里，利用偷跑，以及辅助工具，来获得规则之外的竞争优势。


    K12领域的狭义的暗狗，其破坏力也许恰恰来自其"公开"和"公平"，所有的人都能跑，就像剧场所有的人都能踮起脚跟，由此导致"剧场效应+军备竞赛"的巨大浪费。


    人们之所以热衷于这场竞赛，原因大致如下：


    +   1、偷跑的确有效，好幼儿园有好小学，好小学有好初中，好初中有好高中，好高中有好大学，好大学的门票很值得，由此不断倒推，大家不得不从娘胎里就开始偷跑：


    +   2、刷题的确有效。单一的可习得能力，的确可以通过刻意练习来获得，尤其是在有标准答案的时候：


    +   3、成年人发现自己的世界再也没有这类带"暗狗"的机会了，于是加倍地要在孩子身上找到用暗狗赢得胜利的感觉。


    举个例子来说吧，我下围棋可以带暗狗，做投资却没有暗狗可以带。


    即使不能偷偷带AI，我也能够有清晰的路径让自己的围棋水平再高一点儿，那就是做死活题，打谱，下指导棋，等等，只要功夫下到，一定有长进。


    但是投资就不一样了，你再努力，再勤奋，再练习，也几乎没哈用。


    而且，多强大的AI，也没法辅助你赢得投资的胜利，否则谷歌们就把股市炒翻天了。


