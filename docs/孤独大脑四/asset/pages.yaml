- pgno: 261
  md: '这个伟大而残忍的定律，表述了热力学过程的不可逆性——孤立系统自发地朝着热力学平衡方向——最大熵状态——演化。


    熵，是混乱程度的度量。同样，这个概念也是基于概率的。


    根据熵增原理，一个玻璃杯子早晚会被打碎，而我们却看不到碎玻璃复原为一个完整的杯子。--这个说法并不精确。


    正确的表述是：


    +   • 一个杯子被打碎的概率非常大，时间越长，越接近于100%（这是文物价值的概率原理）；


    +   • 碎玻璃复原为完整杯子并非不可能，而是概率极小，再考虑到原子大小与杯子尺度之间的关系，几乎没人见过碎玻璃复原。即使这个概率极小，但仍然大于零。


    熵 增 理 论 里 的 ΔS≥0，是指“事物会变得更糟糕”。更具体地说，它认为物质和能量总是朝着混乱的方向发展。


    《存在与科学》写道：


    如果任由其自由发展，物质会分解，能量会扩散。比如在某个容器内，无序运动的气体会充充满整个容器。炽热金属块中的原子会发生剧烈的碰撞，它们同时会与该金属块周围温度较低的原子发生碰撞，这会使金属块中的能量散发出来，然后其温度降低。这就是自然变化的根本原因——无序扩散。


    这就是墨菲定律：凡是可能出错的事就一定会出错。


    然而，ΔS≥0只能用于“孤立”系统。


    例如，地球并不是一个孤立系统，因为地球不断地从太阳以太阳光的形式接收能量。于是，作为负熵过程的生命得以诞生。'
