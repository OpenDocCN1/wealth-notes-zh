  img_proc: true
- pgno: 377
  md: '再次强调，本文不涉及对报警流程的具体等级建议。


    **你仍然有选择权：**


    +   1、放弃抵抗，上对方的车；

    2、大声呼救，拼命反抗。


    这个时候，大多数人会想，我抵抗的话，会有什么后果：


    +   会受伤吗？

    会激怒对方导致生命危险吗？


    然而，从博弈思维来看，你仅仅纠结于当下的一步棋去想，毫无意义。


    **你应该去想：**


    **我如果这样做，对手会如何回应呢？ 再然后我又该如何应对他的回应呢？**


    **也就是说：**


    +   你要计算下一步，以及下下一步。

    **然后**，再由此倒推，你现在这一步该如何做选择。


