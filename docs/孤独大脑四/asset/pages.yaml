- pgno: 268
  md: '这一只机会聚集个体零散的概率权，例如每个人获胜的信念都是51%，但仍然有49%的失败概率。


    吸引力法则的运用者，能够聚集这些零散的概率权，就像历史上发生过的极少次数的（在期望值为正的意外情况下）合买彩票，偶然的、较小优势的概 率，汇聚为必然的赚钱机会。


    人类事务、信念风帆，吸引力法则，还能够构建一些社会属性的信念体系， 例如此前谈到的比特币定价。


    赌场的例子和成功学的道理，在我眼中都是概率世界鲜活的样本，因为每个 人的命运就是一次随机事件，这个随机事件又在当事人的自由意志下努力去 改变自己的命运。进而，人们共同的看似有序的无序扩散，探索出了世界的
    边界和轮廓。


    一旦信念被赋予概率数值，我们就可以不再依赖于神秘主义的解释。


    我们不仅发现边界，还改变边界。


    我们并不只是探寻51%的信念。


    +   - 当下的信念，我们要的是大概率：


    +   - 未来的信念，可能只是微弱的小概率。


    前者可能是制造一辆车，后者是指探寻人类另外的居住星球。


    人们通常高估了当下的信念，而低估了未来的信念。


    例如，从厉害的人那里得到股票内幕消息，你对这一信念往往赋予了过高的 概率数值。


    人们又低估了为未来种下森林的信念。


