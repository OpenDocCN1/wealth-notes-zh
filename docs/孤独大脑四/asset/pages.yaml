  md: '巴菲特说：就互联网的情况而言，改变是社会的朋友。但一般来说，不改变才是投资者的朋友。


    虽然互联网将会改变许多东西，但它不会改变人们喜欢的口香糖牌子。查理和我喜欢像口香糖这样稳定的企业，努力把生活中更多不可预料的事情留给其他人。


    # 厌恶损失


    人们通常只理解了“损失厌恶症”的一半。


    损失厌恶，又叫损失规避，是指人们面对同样数量的收益和损失时，认为损失更加令他们难以忍受。


    具体来说：损失带来的负效用为收益正效用的2至2.5倍。


    但是，大多数人的理解到此为止了。


    事实上，损失厌恶反映了人们的风险偏好的某种不对称性：


    +   - 当涉及的是收益时，人们表现为风险厌恶；


    +   - 当涉及的是损失时，人们则表现为风险寻求。


    简单来说，当人们赚钱的时候，愿意为赚确定性的小钱，而放弃不确定性的大钱，尽管后者的期望值更高。


    这也是我的“概率权”这一概念的意思。


    但是，当人们亏钱的时候，反而更愿意为不确定性而冒险。


    还有另外一种短视损失厌恶，是指：'
