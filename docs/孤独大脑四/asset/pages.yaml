- pgno: 229
  md: '生命的个体也许并不是对于许多不同的生存策略进行理性的选择，而是通过偶然的试错过程发现了最优的策略。当所有个体都完成了最优生存策略的“自然选择”之后，就达到了纳什均衡。


    我曾经在达尔文的“性选择”（一口阅读该文请点击）里讨论过类似话题。


    蒲勇健在《策略思维》的序言里，提及一个有趣的问题：


    人们为什么喜欢高个子？


    在人类出现的东非大峡谷，那些高个子的人类祖先，因为生存更加困难（高个子更容易被豺狼虎豹看见，在野兽追来时更难以躲避），心脏负荷大，需要更多的食物而处于生存劣势。


    这么说，高个子应该被淘汰呀？


    但，恰恰因此，只有那些生存能力较强的高个子基因遗传下来了。这是一种不对称信息博弈中的信号博弈现象。


    高个子是发送优良基因的信号，所以人们在谈对象的时候，一般喜欢高个子，这是因为他们或许载有更加优良的基因，可以通过与他们结合把自己的基因遗传下去，因为既然高个子生存更加困难，但是当他们还生存着时，就意味着他们具有更加强大的生存基因。


    表面看起来，喜欢高个子是因为我们觉得高个子赏心悦目，是美的元素。其实，人类的美感是与生存能力联系起来的。这是所谓进化博弈论的发现。


    人类的一些美德也符合类似的逻辑。


    例如，爱是一种能力，而不仅仅是付出。


    一个人的和善，在尔虞我诈的世界里，即使毫无用处，甚至会像孔雀的大尾巴那样可能造成被捕猎的风险，却能传递着这样一种信号：'
  merge: -1
  img_proc: true
- pgno: 230
  md: '你看，我不争不抢不装，也能过得不错啊。


    和善的背后，是某种更具生命力的优良基因的炫耀和呐喊。


    对于聪明人而言，假如愿意去做一些似乎平凡的事情，例如去当一名小学老师，去做一个村官，去当一个志愿者，看似没有最大化自己的天赋，其实对社会群体而言，也许反而意味着进化博弈论的共赢。


    # 领先时该怎么办？


    你领先的时候应该采取什么策略？


    博弈论教导我们：领先时应该采用让对手先行的保守策略。


    让我们看一个生动案例的关键节点剖析：


    +   1983年美洲杯帆船赛决赛前4轮结束之后，“自由号”在这项共有7轮比赛的重要赛事当中暂时以3胜1负的成绩排在首位。'
  merge: -1
