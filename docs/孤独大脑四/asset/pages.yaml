    所谓全局观，是指你的每个决策点既是相对独立的，又和过去和未来相关联。


    有些人只管当下舒服，而不顾自己的下一手该如何。


    如果你在一个球队里，队友总是给你传烂球，或者不给你传球，你一定会骂他烂人。


    可是在现实中，现在的“你”，可能经常不顾及未来的“你”，不管未来的“你”是否有好的选择权。


    一连串有算法的选择权，就是一个人的“人生算法”。


