  md: '在这样的安逸环境里，再次跳进创业的河流，不是一件容易的事情。


    2015年，在周围朋友大多在享受高尔夫时，我创立了春藤。


    任何从零开始的创业都很难难。因为创业是一种状态，你不浇水的话，就会干枯，你需要重新积蓄力量，就像重新开始种下一棵树。


    为什么选择一个陌生的领域创业？


    2017年我在硅谷和某位做投资的朋友聊起这个话题。他说：


    “为什么不安静地做个‘人生导师’，既享受生活，又自由，赚钱也更轻松吧？"


    那时我的公众号“孤独大脑”意外地“火”了起来，《人生算法》一门课在得到App卖了一千万，中信出版社的新书也上了年度畅销榜，书约不断，各种讲座邀请的出场费让我受宠若惊。


    然而，除了偶尔接几个教育类的广告，我几乎拒掉了所有“孤独大脑”的商业机会，而是将全部资源投入春藤的创业。


    原因很简单：


    我想做正确的事情，而不是容易的事情。


    春藤的愿景是，让每个中国孩子都有机会分享最好的教育资源。


    再次创业的目的不是为了证明自己，也不是简单的“赚更多钱”。


    我的想法是：我们这代创业者很幸运，能否用这运气的恩赐，再做点儿什么呢？


    可是，从零到一的艰辛，永远不会因为美好的愿望而减少。


    在最艰难的时候，我也会像朋友那样问自己：你何苦呢？


    我曾在《孤独棋士》里，写下这么一段：


    柯洁（独白）：你们永远不会明白，所谓赴场烟火般的人生是怎样的。'
