    # 彻底远离损人不利己的人


    博弈论的假设是：双方都是理性的。


    博弈论只研究对赢感兴趣的、有完善的逻辑思维能力的游戏者参与的博弈。只有你相信你的对手（一个或几个）既是理性的，又是希望赢的，而你自己在玩的时候也始终憋着一股劲儿，要力争为自己取得最好的结果，这样的博弈才是博弈论分析的对象。


    对博弈论而言，自私的人并不可怕，可怕的是不理性的人。


    为什么呢？


    +   - 一个自私的人可能做损人利己的事，一个合作的人可能做利人利己的事情。


    +   - 但是，一个不理性的人可能做损人不利己的事情。'
