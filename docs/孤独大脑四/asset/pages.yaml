  md: '在上面的公式里，时间t的对应值是Vt，其初始值为V0，且以速率R增长。


    凸函数的斜率是递增的：函数值随度量值的增加而增加。


    (上述来自《模型思维》一书。)


    最近以及未来数十年，数字化产业突飞猛进，造富无数，底层原因之一是摩尔定律惊人的凸性。


    让我们再回到开始的段子：


