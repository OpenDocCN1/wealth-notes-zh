    # 不确定性


    不确定性是宇宙的基本秩序之一。


    对不确定性的不同感受，可以用来区隔青少年与中老年。


    不确定性是青少年眼中充满无限可能的未知世界：


    +   - 是不计算投入产出的梦想；

    - 是不评估繁衍组合的爱（虽然基本来自繁衍冲动）；

    - 是无知者无畏和无产者无惧。


