    大脑是一种捆绑与束缚的结果。神经元的构成，像熔铸。熔铸是一种连接形式，如婚姻，家庭，商业，法律，国家，SM，等等。


    > > “神经元之间的连接网络：一个人在出生之前，脑中的1000亿个神经元已经几乎全部准备号，而神经元之间的连接网络则是十分稀疏的。因为婴儿未能意识思考，故此，他只凭外界的刺激而制造连接网络。”


    每一个人脑的神经元数量上下不会超过1%～2%，所以一个人的聪明程度不是由神经元的数目决定，而是由神经元之间的连接网络决定。此外，或许还包括连接的形式与强度。


