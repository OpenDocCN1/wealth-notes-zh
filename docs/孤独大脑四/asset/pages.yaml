- pgno: 200
  md: '![](img/3dace955367687898560fd4145a321db_200_0.png)


    如上，箭头指向自己的，是指客户留存。指向别人，则是客户流失。


    马尔可夫模型的一个特点是：当转移概率固定时，不管初始数是多少，总会达到一个“命中注定”的、唯一的统计均衡。


    所以，即使奶茶店B刚开张，一个顾客也没有，要不了多久，也会抢走大部分奶茶店A的顾客。


    不管A开始的时候多么有优势，钱最后还是追者B去了。


