- pgno: 79
  md: '看起来，似乎是很好的“日拱一卒”，而且拱得相当大。


    但是，用加法来计算，并不能精确反映财富的变化。


    我们应该用乘法。


    第一天的财富V1=208万；


    第二天的财富V2=V1×□（1+G2）；（G2代表当日财富增速，为100%）


    第三天的财富V3=V2×□（1+G3）；（G3代表当日财富增速，为50%）


    第四天的财富V4=V3×□（1+Gg4）；（G4代表当日财富增速，为33.33%


    ……


    第n天的财富Vn=208万×□（1+G2）×□（1+G3）×□（1+G4）……×□


    （1+Gn）


    从上面的计算，可以看到，Gn越来越接近于零。


    所以，即使假设你每天能赚200万，并且可以活上一千年，但是你的财富的


    增幅越来越小，很难超过盖茨夫妇。


    重点在于几何平均值的计算。


    上面的简单推理，还蕴藏着两个深刻的概念：


    +   1、独立事件；


    +   2、整体资产。


    # 独立事件'
