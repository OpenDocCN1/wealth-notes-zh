- pgno: 275
  md: '但是，如果你根据帕斯卡赌注，每天向一个女明星求婚一次，那就很愚蠢了。


    # 3、破坏人的大脑。


    更大的成本是，买彩票等行为，让人沉迷于了一夜暴富的幻想中，极其消磨斗志。


