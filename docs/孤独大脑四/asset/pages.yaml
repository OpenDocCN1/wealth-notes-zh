- pgno: 287
  md: '又比如《大空头》里的故事，主人公是逆向应用了墨菲定律，该碎的泡沫早晚會破灭，但时间充满了不确定性。可是，如果期望值为正，依然是胜率极大的对赌。这是征服了时间上的不确定性。


    # 认知上的不确定性


    再如投资和创业。其成功遵循幂律分布，少部分人大胜，大部分人并未因为投身不确定性而获得利润补偿。


    然而，正是因为发生在参与者之间的认知上的不确定性，令这场游戏格外有吸引力。


    对于少数投资赢家，秘密就在于购买了“因为不确定性被错误定价”的凸性组合。


    我们可以将概率所描述的可能性，视为这个真实世界的另外一个维度。


    数学家 Henry Segerman用视觉化的方式，为我们呈现了线性三维“平面”，只是弯曲的4维“时空”的投影。'
  merge: -1
