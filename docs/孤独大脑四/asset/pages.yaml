- pgno: 301
  md: 'W或M一直被父亲的死拖着拽着。这与父亲是否真的死了，以及因何而死并无关 系。


    在人类的情感体系中，父爱是一种奇怪的存在。雄性动物不负责任的特点 ，在人类社会并未得到多大改善。于是男人们为了尊严，决定做一次自我 辩解式的了结，那就是：


    牺牲。正如小A的爷爷的爷爷主动奔赴战火。


    W或M的父亲无论是自杀了，还是躲去了哪个地方，都是某种不容置疑的 牺牲。假如他死了，这是牺牲；假如他没死，他一生都会经受生不如死的 煎熬，这也是牺牲。


    牺牲是父子间的传承方式。像是老剑客对年轻剑客的传授，没有半句废话 。


    在长大成人的过程中，W或M对父亲的情感，并非是憎恨或者和解，而是 一次待完成的继承。他需有足够长的时间来完成从男孩到男人的蜕变。 在那个过程中即使父亲已经离去，但却是时刻伴随的。


    “死亡之线”的正中，断崖，峭壁，激浪，青岩，是一个完美的告别之地。


    W或M在一个梦境中与父亲重逢。意外的是，父亲苍老而虚弱。儿子以为 父亲会保持他离开前的模样，大部分头发仍然是黑色的，有点儿混蛋的模 样。但眼前并非如此。在时空的流放之地，父亲继续孤独地支撑着，一年
    年老去。


    在那一刻，W终于理解了一个父亲的牺牲到底是什么。


    当他差点儿触及父亲的亡灵时，她的声音唤醒了他。


    1579'
