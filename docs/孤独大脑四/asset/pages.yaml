  md: '金翊评：“这个珍珠变幻百端，因人而异，爱财者因贪失误、易怒者由愤坏事。戡济之败，在于爱心太重，不肯弃之；慕容复之失，由于执着权势，勇于是弃子，却说什么也不肯失势。”


    库克从乔布斯那里学到的正是“弃子”：最难的决定是“不做什么”。


    不论是对个人和公司而言都是，最难的是你要放弃掉“不好的想法、一般的想法和劣的想法”，专注于几种产品，做到最好。


    库克回忆说，人们往往记得乔布斯的才华，却忽略了他的专注力，大家会奇怪他为什么总穿同样的衣服，因为他要消除掉一些不必要的事情。


    1997年回到快破产的苹果，乔布斯传达了一个理念，决定不做什么跟决定做什么一样重要。他迅速砍掉了没特色的业务，并告诉同僚，不必保证每个决定都是正确的，只要大数次的决定正确即可。因此不必害怕。


    还不够。在一次产品战略会上，他在白板上画了个2*2的矩阵图（乔布斯非常喜欢画这种图），在两列顶端写上“消费级”“专业级”，在两行标题写上“台式”和“便携”，“我们的工作就是做四个伟大的产品，每格一个”。这便是Power
    Macintosh G3、Powerbook G3、iMac、iBook四款产品。


