    《不确定世界的理性选择》对此有精确描述：


    主持人的规则至少有三种可能的解释。


    **第一种规则：主持人总是随机打开没有被参与者选择的门**（例如，在上面的

    情境中，主持人掷一枚硬币来决定打开2号或

    3号门）。这表示主持人可能打开一扇门并展示出门后的轿车，然后（和观众

