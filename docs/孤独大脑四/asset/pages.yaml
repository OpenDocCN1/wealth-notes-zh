- pgno: 242
  md: '如本文开始所提及，在面临“未知的未知”时，我们需要借助于直觉和经验法则。


    经验法则，某种意义上也是一种修剪决策树的方法。


    解决复杂问题时，“启发法”作为简单解决方法，经常是有效的。


    例如“单一理由决策法则”：


    找到最重要的那条原因，并忽略其他原因。


    又例如点菜时候的经验法则：


    你可以问服务员，如果你是客人，今晚你会点什么菜？


    人类通常解决问题有多种思维方法：


    +   • 有一种方法是逻辑推理和计算，这就是搜索所有可能的解决方案，来寻找一个最佳的方案；


    +   • 还有一些方法不需要通过搜索所有的问题解决的可能性，而只是根据我们的经验、直觉，选择较少的问题解决的方案，这个叫做启发式的问题解决策略。


    经验法则并不愚蠢。在一个充满了不确定性的世界里，简单的经验法则，比精确的计算更有助于人们做出好的决策。


    例如，当斯皮茨纳格尔为自己期货交易的女导师克里普带去概率方面的书籍时，会感慨一句：


    这类书对这个依靠直觉的老交易员来说没有什么实际意义。


    少即是多。复杂问题并不一定需要复杂的解决方法，应该先寻找简单的方法'
