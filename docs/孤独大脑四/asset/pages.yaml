- pgno: 298
  md: '小A抬头望着他。那人说：W的公司在圈子里小有名气，我的一个同学提及过。但是……


    小A问：但是是什么？


    那人答：那家公司只有一个创始人，那就是W。我从未听说过有M这个人。


    第二堆篝火旁的摄影师，和第一堆篝火旁的我们全都愣住了，但惊奇程度都比不上第三堆篝火旁张大嘴的小A。她突然意识到什么，站起来向海边冲去。


    后来在第二堆篝火旁，小A告诉摄影师，她一下子看明白了W那张涂鸦的小纸片。上面只是些没头没脑的文字：“我走上楼梯，看见一个不在那儿的人。他今天也不在，我希望他离去。”这不是一首诗，也没有更多寓意。那个瞬间小A想起这句话是电影《致命ID》片头的一句台词，那是一部关于人格分裂的电影。


    我问摄影师，所以W和M其实是一个人？


    摄影师望着我，没回答，而是说：有一种说法是，所谓自杀，是里面的人把外面的人杀了。


    我说：那么设计者是W还是M？要卖掉公司的M会喜欢辛波斯卡吗？“被骗”的W真的一无所知吗？所谓的人格分裂是指会在不同的时间分裂成两个完全不一样的人，还是仅仅是一个人的自圆其说？


    摄影师说：谁知道呢？关于人格的同一性，地球上没有人有答案。


    如果W和M真的是一个人，那么W或M似乎有两个维度的“分裂”：一个是世俗维度的。W渴望自由生活，而M追逐没有尽头的“成功”；一个是情感'
  merge: -1
  img_proc: true
- pgno: 299
  md: '维度的。M憎恨抛弃了自己的父亲，一心要忘掉他，而W一直在找寻与父亲的和解。


    小A也有着某种更广义的分裂。她有黄皮肤的中国面孔，里面都是白色的。可她的基因在隔了好几代之后，似乎仍与江南的油菜花魂牵梦绕。


    慢着，我突然意识到，只有眼前的这堆篝火是真切的，而另外两堆篝火，都出自摄影师的口中和口中。分裂的会不会是他？


    第一堆篝火，是我们坐在这儿，听摄影师讲小A和W的故事。


    第二堆篝火，是小A给摄影师讲故事，当时是她和W或M重逢后，再次走“死亡之线”。


    第三堆篝火，是小A和W网友见面，第一次走“死亡之线”。


    这三条叙述线，又是嵌套式的。嵌套是分裂的反义词，二者连时间逻辑都是逆向的。分裂如同树木向上的枝桠，而嵌套则是时间的回卷：现在，第一堆篝火旁的摄影师，复述他过去在第二堆篝火旁听到的，发生在第三堆篝火旁的过去的过去的故事。


    即使是摄影师编造了这个故事，也合情合理。也许他的心底有一对W和M，作为青年时的移民，做人生选择时，潜意识里一定有W和M之间的争执。在拍摄异围他乡的壮丽景象时，他比谁更怀念家乡的山河故人。在某次长途跋涉的夜晚，望见无尽的星河，触动他的并非“向死而生”那类巨大的命题，而是他童年的某个不能更具体的细节记忆。


    这三堆篝火，就像三个不同机位的摄像机，分别记录着此刻，过去，和过去的过去。这让摄影师获得了某种电影导演式的立体化叙述特权，且听他继续讲吧。


    1577'
