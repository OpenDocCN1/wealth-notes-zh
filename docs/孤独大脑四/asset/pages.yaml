- pgno: 222
  md: '我在别的文章里会详细展开说“灰度认知”。


    扑克高手Annie Duke的建议是：


    首先，改变任何事情都追求100%确定的心态。试想一下，这件事情我真的是有100%把握吗？如果是70%的把握，那么剩下30%的可能是什么？就像是在扑克牌桌上，高手计算下一张牌的可能性一样；


    第二是保持一个更加开放的心态。从更多的渠道获取不同角度、多元的信息，而不是跟不同的人问询，然后不断确认自己已经肯定的事情和观点，“尝试着找那些你从来没觉得需要向他们请教的人聊一聊，你也许有意外的收获”。


    # 要点3：期望值计算


    这部分我在被蠢人、穷人与聪明人放弃的“概率权”（↗阅读该文请点击）说过很多。


    对德州扑克深有研究的人工智能专家余小鲁说，金融圈最感兴趣的就是风险。德州扑克对玩家的一个大的考验，就是要长期保持一种风险中性（risk neutral）的态度。


    举个例子，你面前有两种打法：


    第一种是有20%的机会赢得五千元筹码：


    第二种是有百分之百的机会赢得八百个筹码。


    大脑里面固有的风险偏好，让我们很难选择第一种打法。


    但恰恰在绝大多数的金融市场和德州牌桌上，要当长期的成功玩家，必须学会自然的选择第一种打法。因为根据期望值计算，第一种的回报是1000，大于第二种。当然，这个和筹码总值也有关。'
  merge: -1
  img_proc: true
- pgno: 223
  md: '假如你根据期望值计算的方法是正确的，但结果却输了，这就是所谓的“系统风险”。


    作为投资人怎么在投资中面对这种风险？你应该坦然面对。系统风险是无法避免的，因为盈亏同源。


    你要反思的，不是根据期望值计算作出的选择，而是你的计算系统是否精确，是否需要校验。


    # 要点4：黑白决策


    AI下围棋的秘密是，计算可能招法的终局赢棋概率，然后选择概率最大的那一手。


    看起来似乎很简单，其实并不容易。


    1968年，马克斯刚到花旗银行工作时，他们的口号是“胆小难成大事”。采取明智而审慎的投资方式，争取胜多负少，及在成功时获得的收益要多过在失败时遭受的损失十分重要。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '但避免所有的损失则会带来严重后果，坚持这样的投资方法也绝非制胜之举。这样可能会确保你避免损失，但同样也可能导致你无法取得收益。


    就此，许多人心目中最伟大的冰球运动员韦恩·格雷茨基(Wayne Gretzky)说的话可能会为你带来一些启发，他曾说：“如果你不出手，就会100%地错过进球的机会。”


    Duke曾经担任业余选手比赛评论员，有一次她告诉现场观众，说当前的局面，A选手赢的概率是76%，B赢的概率是24%，结果B赢了比赛，当时观众就说“你的预测错了”，Duke回答：不是预测错了，她已经说过了B选手赢的概率是24%，也就是概率24%事件发生了。


    做决策的时候要理性、坚定。执行完之后，迅速归零。要将执行和结果分开。


    不管现实多么灰暗，自己手上的牌多么卑微，未来多么渺茫，仍然敢于做决定，并且坚定地选最好的那一手，是一种非常了不起的天赋。


    这就像全盛时期的德国队、即使落后了三个球，也阵脚不乱，堂堂正正地踢出每一脚球。


    只要你还没开始自暴自弃，仍然在思考、决策，即使被打趴下，也不算失败。


    # 要点5、形成系统


    道理人人都懂，概率我也会算，期望值没啥难的，为什么我还是做不到？


    这正是人性艰难的地方。


    我们每个人都被设计成“自动驾驶”的智能生物，为此付出的代价是，克服人性的弱点是非常不容易的。'
  merge: -1
  img_proc: true
- pgno: 225
  md: '对牌手来说，游戏目标不应是赢取单局彩金，而是基于数学（概率论）及心理学上做出正确的决定。因为如此一来，期望回报值为正的情形下，可将每一局的平均利益最大化，长久下来赢钱总额会比输钱多。


    扑克生涯和漫长人生一样，是由很多个连续决策构成的。


    你 不 能 在 乎 一 城 一 池 的 得 失 ， 而 是 要 建 立 一 个 大 概 率 赢 钱 的 科 学 决 策 系 统 。


    普通人关注结果，高手关注系统。


    对于该决策系统，你一方面要坚定地执行，另外又要能够不断反思优化。


    这两点都是反人性的。


    # Annie


    Duke认为，顶尖的扑克牌高手和普通的牌手之间，一个重要的差别就是：


    顶尖高手， 能够始终保持稳定的决策能力，不会因为周围环境的变化、自己的输赢而影响决策，他们通过训练自己，养成了深思熟虑解决问题的习惯。


    普通牌手，他们的心情很容易随着周围的环境发生变化，从而导致决策水平 的 不 稳 定 ， 极 端 的 情 况 下 ， 他 们 甚 至 是 依 靠 条 件 反
    射 来 做 决 定 。


    然 而 在 “不 确 定”的 扑 克 世 界 ， 如 同 我 们 的 现 实 世 界 ， “ 系 统”都 是 暂 时 的 ， 局 部 的 。


    所谓系统，是从简单的因果上升至反馈回路，从而通过重复面构成了一台赚钱机器。


    然而，这台机器必然有其适用的情境，并且只有局部时间有效，与机器的操 作者（人性和情绪控制）也紧密关联。'
  merge: -1
  img_proc: true
- pgno: 226
  md: '有次和几位基金经理朋友聊起当下一位股市大神的投资系统，我的观点是：极可能是这位大神的个人系统（和风格）碰巧与当下的A股市场相契合。十年以后会如何，很难说。


    有些系统基于算法，有些系统基于人性和直觉。大多数系统是二者的混合体。


    所以，投资高手几乎都是阿尔法狗，连文艺复兴的西蒙斯也不能例外。


    西蒙斯说文艺复兴的秘密在于统计学。统计推断，位于数学、经验科学和哲学三门学科的交叉点，此外，赚钱系统还需要数据、算法和算力。


    西蒙斯试图用万物原理来揭秘金融市场，他唯一不要的就是华尔街那些无知的赌徒和自圆其说的解释者。


    即使如此，地球上也只有一家文艺复兴，并且仍是一个黑盒子。


    系统和系统之间又存在着博弈。有些貌似不靠谱的系统，因为有更加不靠谱的猎物，也可以很厉害，例如A股市场的猎手和韭菜。


    系统是动态演化的。韭菜在演化，猎手在演化，猎手的后面会出现新的猎手。


    从行为金融学和"反思性"的角度看，利用人类的"不靠谱"，以及群体的非理性，本身也能构建系统。


    例如诺奖得主靠勒的对冲基金 Fuller & Thaler Asset Management，就是利用人类的非理性所形成的反转机会来赚取超额利润。


    赚钱系统貌似是靠"成功预测"赚钱，但事实恰恰相反，假如一个系统依赖于"成功预测"，那么该系统极可能是脆弱的。


    所以，很难定义什么是"好的系统"，但好的系统几乎都有如下特性：


    **强健、高适应性、韧性。**'
  merge: -1
