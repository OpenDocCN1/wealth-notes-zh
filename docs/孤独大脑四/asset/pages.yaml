  md: '围棋虽然复杂，但似乎是完全透明的。通过基于神经网络的深度学习，计算机已经征服棋手，但是对付德州扑克，AI还处在很早的阶段。


    ![](img/3dace955367687898560fd4145a321db_214_0.png)


