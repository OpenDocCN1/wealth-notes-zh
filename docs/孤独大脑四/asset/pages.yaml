  md: '为了探寻未知，信念将自己作为方法和路径，与随机性共舞，去探寻自我的边界。


    **蒙特卡洛方法**，也称**统计模拟方法**，是一种以概率统计理论为指导的数值计算方法。是指使用随机数（或更常见的伪随机数）来解決很多计算问题的方法。


    例如，用该方法来求不规则图形的面积：


    ![](img/3dace955367687898560fd4145a321db_263_0.png)


