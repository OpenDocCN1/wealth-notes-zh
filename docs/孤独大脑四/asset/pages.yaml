- pgno: 227
  md: '这些特性，恰恰是在不确定性的环境里，会显得更加耀眼。


    但是“糟糕的系统”却很容易定义：


    假如一个基金经理强调自己料事如神，热衷于精确的预测，喜欢搭建自圆其说的结构，那个系统可能非常浅薄，极其脆弱。


    “好的系统”的高适应性，伴随着试错中的学习。


    假如一个人的决策系统的底层，不和学习系统相连接，很快就会变成“刻舟求剑”。


    # 3


