- pgno: 220
  md: '# # 2


    # ## 扑克高手第二课


    # **建立概率化思考的决策系统**


    # **要点1：量化**


    在上一节，我们说了，没什么东西是确定的。


    而这一节，我们又要说，不管一件事情多么模糊难测，你也要努力去量化它。


    英国物理学家开尔文说：


    > 当你能够量化你谈论的事物，并且能用数字描述它时，你对它确实有了深入了解。但如果你不能用数字描述，那么你的头脑根本就没有跃升到科学思考的状态。


    就像天气预报说明天有80%概率下雨一样，你也要养成类似的思考和沟通方式。


    例如假有人约你周末吃饭，当你不确认时，别说“也许可能或许大概”这类台词，你最好说：


    **我有60%的把握。**


    如果想有点儿戏剧化的效果，你还可以说：


    **我有58.62%的把握。**'
  merge: -1
