    # 前言


    # 爱情的规矩要守还是要破？


    江郎鬼才曾经江郎才尽


    曾经约了一个我对其感兴趣的大波女生，我们第一次的约会是共进晚餐。而在我们用餐完毕之后，她邀请我到她的公寓喝茶（不是喝咖啡非）。结果，我们在她的公寓喝茶聊天。一直聊到凌晨四、五点钟，虽然没发生什么事情，但我当时对这次约会觉得还蛮满意的。


    第二次约会的时候，她也邀请我上她的公寓，因为她亲自下厨烹煮晚餐，所以我就带了红酒上门。当晚她穿短短的紧身裤，露出修长雪白的双腿。当时我心中不能说没有期待，但可能就是因为期待的关系，内心很想采取行动，但行为上却又像第一次约会般，二人只是聊的很融洽，也是谈到凌晨三、四点钟。


    我离开的当时，心里面就在想“不能了！下次我一定要采取行动。”过了不久，我们约定第三次约会。


    同样的，我们在外用了晚餐后，又上她的公寓喝茶。喝茶的当儿，我们谈到自己头部的形状，我说我的头顶尖尖的如同屋顶，她说着她自己的头又是哪一个形状，我们还用双手互相抚摸对方的头顶。剧情发展到这里，好像开始有些头绪了。接下来她做了一个举动，让我不知所措。


    她说她吃得太饱，然后就在我的面前，她解开自己裤子的腰带，也在裤头处打开了一个钮扣。当时，应该能够看到她内裤的上端，但我却因紧张而刻意装得若无其事，所以完全没有留意到。我心跳得很厉害，头脑不断的想：“怎么办？这是个好消息，但下一步要怎样呢？怎么办？”


    虽然我们说是聊到凌晨三、四点，而且她的裤头选是一直开着，我的脑袋就好像冻结了般，致使结果仍然跟第一次的约会一样：什么事情都没发生。


    我也不知道当时的自己是笨选是没胆子，但就知道机会之门为我而开，而我却没有走过去。


    在第三次约会之后，我们还有第四次再见面，不过我隐约的觉得她对我的感觉渐渐转成友善，更在第四次约会之后，我们见面时，她反而会跟她的朋友一齐出席。那道门已经关上了。'
  - '[PAGE 5]


    这一种“该上没上”的情操，是很典型的好男人病毒，这种毒素和我们小时候被灌输的文化有关，这种文化严重起来的话，还可能会使男人在女人眼中变成毛骨悚然的动物。


    # 电影世界的半真半假


    男女的游戏在于拿捏“很在乎”和“不在乎”一部好看的爱情电影是双方都摸不清对方的“在不在乎”，而且自己也不清楚自己“在不在乎”。这种双方都在“乱拳打人”的爱情策略，男女主角皆势均力敌，才让观众看得过瘾，才能成为故事的中枢。


    若戏中的某个角色是全世界最美、最性感的女人，同时她又能完全摸透男角的心理，以色诱兼心理战术掌控厂男角，这将是故事中的一个旁支。举例，美国电影 Hich 是述说一个专业的把妹教练如何帮另一男角得到他要的女人，但同一时候把妹教练又看上了一个女生。但，因为他动了情，所以在把妹上策略和技术都开始出现状况，同时也也渐渐的丢失了自己的主控权。


    换句话说，编剧要把这位把妹达人的功夫废掉一半，他才能跟女主角势均力敌，如此才能成为故事中的主线。故事中的两位男角（主角和配角）最后就是因为真正的爱上两位女角，结果真情流露，各自做回自己而各得美人。


    虽然这是故事，但这故事其实有一半是真理，另一半是噪音，因为电影故事若完全是百分百的写实，，观众就不需要看电影了。同时，若电影情节百分百虚构，观众又觉得跟自己的经验相去太远而不能产生共鸣。就好像我上面所写的“开裤头”故事般，一个人确实有可能在动情后，会如
    Hitch 般出现技术上的状况，而我本身当时也还不至于动真情，但当我的欲念被启动时，我的脑袋也出现状况。


    但 Hitch 的故事结局一一“做回自己，赢得美人”就是虚构的噪音，它只是为了故事有个“浪漫喜剧”的结局而已。现实的情况中，大部分男人在动情后才出现状况的话，往往是不够够起死回生的，而且男人在出现状况后再“做回自己”更会被打入十八层地狱。


    # 要守规矩还是破规矩？


    想象一下如果你正在擂台上打拳，一上擂台你就很惊讶的发现原来裁判有一双斗鸡眼，你的教练见状就马上跟主办单位投诉，，但他们说今天这场比赛，所有的裁判都没办法出席，所以只能聘用这位斗鸡眼裁判。'
  - '[PAGE 6]


    你勉为其难 的开始 了 拳赛，但 中途的时候你发现当天的对手 好像 摸清了这位裁判 的底子，因为 他 常在 斗 鸡 眼 裁判 的盲点处，对你打 出了 一些
    犯规的 拳法 。 而且 这家伙还在 他 犯规后， 弄了个 斗 鸡 眼 来 讥笑 你。


    碍于 裁判 对 这些 特别 角度的 犯规 好像 视若无 睹， 请问，你 还 会不会 守规矩？


    你 要 执意 的 站在 斗鸡眼 裁判眼睛 所 看到的 角度 打拳？


    还是 在 特定的时候，也会 闪过 去 在 裁判 盲点 的 地方 出击？


    在 电影的故事中，观众 确实 是 要求 Hitch的 把 妹高手 因动情 而 废掉一半功力，这样的 戏 才 好看。但，爱情的 战场 上 却也 有 不少 残酷的事实，因为现实中
    是 兵不厌诈 的。


    # 此地 无银三百两


    我 认识的 一对 夫妻 会 常 在 大家 面前，半虚半实 的 互 牛 目 诬赖 对方，说是 对方 先喜欢自己的。


    老公 已经 是 事业 有 大成 之人， 所以有时候会 比较 醋。而 老婆 则 因为 人 喜欢 发表 的天性， 有时候反而 会 “ 讲多错多 ” 的 越 描
    越 黑。某次 她还 说： “ 其实 我 当时 喜欢他，不是 因为 他 靓仔… ”


    呵呵， 这么 一个 “ 此地无银三百两 ” 的 资讯， 反而 让我 更加 的 怀疑 她 当年 应该 是被 老公 的外表 和 风度 所吸引。


    这 不 难 明白， 因为 大部份 的 男女 在 约会的 初阶， 都会 玩着 商场上 的 一个 谈判游戏—— “ 开价 ”。


    # 开价 拖拉战


    我记得 某次 我 的 朋友 开车 载 我 去 吃饭 时， 听到 他 接 了 一 通 电话， 是 他的 供货商打 来的。 由于 我 就 坐 在 他的 旁边，
    所以 他们 之间 的 对话 听得 一清二楚。


    朋友 说： “ 你 开个价 给 我们 啦。 ”


    供货商： “ 你们的 budget(预算) 是 多少？ ”


    朋友： “ 你 最好 的 价钱 是 什么？ ”


    “ 你们 的 公司 应该 有 budget 的 范围 嘛！ 我知道 了 你们的 范围 后， 就 比较 容易 谈 下去… ”


    “ 现在 是你 要 做 我们 的 生意， 当然 是 你 报价 上 来 嘛…… ”


    接下 来 的 五 分钟， 这两个人 就 不断的 大打 太极 推手， 好像 充满 了 华人 的 礼让'
  - '[PAGE 7]


    化般说：“不小，你先讲吧”，对方则回敬“不要客气，你先讲啦！”


    回过头来看，在约会的初期，如果双方势均力敌，（即你有我要的美色，我又有你欣赏的才智或垂涎的资源），同时又隐隐约约的知道对方好像对自己有兴趣，两个“聪明人”就会开始玩这种“你先开价”的谈判游戏。


    开始时我可能还会承认对你有好感，但我的计划是打死也不先说我爱上你。（这个计划先失手的通常是男性）


    # 两难


    所以曾经有一位年轻的男读者告诉我：“江老师，我看了你们《好的好人》系列书，书中建议男人在追求女生时，最好不要先以做朋友的策略入手。”


    我说：“对，通常以做朋友的方式入手，很难再把朋友的印象转换成情人。我不是说不可能，从朋友转成情人是少数。你若问女生的话，大部分都会跟你说要先从做朋友开始，好让大家有个认识和了解的机会，然后再看看能否发展下去。但，千万别相信女人所讲的官方言论。


    “我也认同，所以我现在认识了心仪女生后，我都很快的给她知道我喜欢上了她，不过效果还不是很好。”


    “哈哈，你这本来就是该死的。才认识人家就表白或暗示你喜欢她，基本上是跟女生说了：“我很想跟你一搞。”难道你还要预计女生们宽怀的接纳你吗？"


    才认识女生就说你爱上了她，就好像一个人刚认识你就跟你借钱一样，你势必会很快的想回避他。


    现在你可能会问自己一个很现实的两难问题：“那么一个男人刚认识心仪女性时，应该怎么做呢？做朋友又死，让她知道自己喜欢上她也死。”


    我相信这也是很多男人所经历过的两难困局。


    一些男性读者可能会采用一个双管齐下的策略：“那么是不是先跟女方做个‘假朋友’，因为如此就不会失去主控权。同时也不会打草惊蛇。但自己所做的却是‘男朋友’的举动，进而打动她？


    老实说，很多男人都是采取这个策略，口头上说是做朋友，行为上则献上无限的关怀，但是他们不知道女人恰恰就是最讨厌这种男人。


    后续我将在本书内解释为什么女人会有这种负而反应，而男人却会一再的犯这个同样的错。'
