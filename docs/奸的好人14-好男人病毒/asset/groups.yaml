    NLP 课程时，以上面“及时行乐”的概念性废话问我如何加上策略性的心锚。欲知我所举办的课程时间表，可以到我的雅虎部落格浏览 http://hk.myblog.yahoo.com/kongkeeyung
    或在 Facebooke 上搜寻我的英文名字 Kong Keen Yung。）


    政治家在发表政治宣书时，也很喜欢讲这种概念性废话，例如他们说：“我们要提升人民的教育水平，增加公务员的效率，同时要提高政府的清廉度和透明度。”


