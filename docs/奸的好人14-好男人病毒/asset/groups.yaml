    不过，如果一个只看到这菜肴的赞者，在错误的时机搞这个“鲍鱼即食面”招式，例如才刚认识的女生，她还未对你有兴趣，就算你请她吃“鲍鱼即食面”，还是照样得不到完整的效果。而且你还要记得，K的“鲍鱼即食面”是做得很即兴的，因为即兴在女人的眼中就是浪漫。（注：关于这个即兴的道理，可参考《爱情阴谋论》和《看穿女人心、迷惑**男人心**》）


    概括来说，这一招制造出三个效果。


    - 第一，“鲍鱼即食面”确实是很有创意、够新鲜，所以自然的就在女生的脑海中种下强烈印象。

    - 第二，若这招用在女方还未对他有兴趣之前的话，它就会沦为贿赂了。但他的时机则选对：在女方开始对他有兴趣之后，这就会继续强化女生对他的兴趣。

    - 第三，即兴的上他的家，即兴的吃一道新菜肴。虽然我还未吃过“鲍鱼即食面”，但可以想象到应该蛮好吃。如果我是他的话，我就会从“鲍鱼即食面”的美味讲到美食，从美食讲到享受，从享受讲到人生（可加“及时行乐”的话题），从人生再讲到更感性的话题（到了这里可以“趁火**燎**吻”）。这就叫做——浪漫。


    各位好男人还要特别留意，高手K的**所**做的这个送礼，不是你们平常的那种买个贵重东西送给女方。他是自己本来就要吃那鲍鱼，顺便邀请女生一齐吃而已，而且女方不觉得他是特意安排。呵呵，很讽刺的是：他的这个“K记餐馆”、“K记主厨／服务生”、“美食节目主持人”、“跟女生一齐**取**菜名”等，他都已经演练过很多次，都已经滚瓜烂熟到“很自然”。


    # 维持期和追求期送礼方法的异与同


    有些读者若已经看了我的《爱情阴谋论》，就必定知道什么叫做送礼的“四不定时则”。根据“四不定”的做法，你是很随机的有时候该送的就送，有时候该送的也不送，时而不该送你也送，时而不该送的话，你就不送。若你以“四不定时则”与上面所说的“奖赏强化理论”对比来看，你可能会觉得有其矛盾之处。


    若依“四不定”的其中一个架构：不该送的时候你也送，这不会强化她那些“不该”的行为吗？


    答案很简单，“奖赏强化理论”主要是在追求阶段的时候用，“四不定”则在维持感情阶段就很重要。


    但，你若看高手K的鲍鱼故事，他显然是用“奖赏强化理论”，但因为他做得即兴，所以也附带一点的“四不定”。而且，在维持感情的阶段时所用的“四不定”的**其中**一招就是“该送的时候就送”，这其实也是“奖赏强化理论”。


    在追求期的送礼，就是要做到上面所说那种一举三得的效果：“特别印象”、“强化女方对你的喜爱”和“即兴浪漫”。


    # 如何跟女人谈心才不会沦落为好男人？


    # 要谈心还是要谈爽？


