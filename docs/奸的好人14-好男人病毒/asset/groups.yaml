    \n那么K的口才如何呢？\n\n#### 把妹能手的口才\n\n跟他讲话的时候，你肯定不会觉得他有很强的分析能力，他对时事或政治的看法也只是…一般，你也肯定不会觉得他是个思想精密的人。\n\
    \n我见过K和女人的互动情形，不觉得他谈的话题是深入的。他的话题总是离不开吃喝玩乐，口沫横飞的讲得过瘾，但也不会有深入和精彩的描述。他的口才算是流畅，但也不是特别好。我教他“阴阳二分法”的时候，他如获至宝。（欲知何为阴阳二分法，可参阅《印象洗脑术》。）\n\
