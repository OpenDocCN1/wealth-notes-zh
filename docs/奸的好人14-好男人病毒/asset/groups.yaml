    # 开放式的考题有封闭式的效益


    我记得我在刚追求着我女友时，因为她知道我有常上电视台参与选美的节目，她有时候会在简讯中揶揄我是否又在跟什么美姐喝茶，我传了一则简讯给她。我当时是和李老师一齐喝茶，所以我就告诉了李老师我的简讯内容。


