    好男人认为送礼的哲学就是一种投资理论，即我现在送东西给你的目的就是要未来得到回馈，以为送礼就是能够代表自己的诚意。但在女人的心目中，你这个送礼其实是一种“贿赂”，因为你是做着无理由的送礼。


