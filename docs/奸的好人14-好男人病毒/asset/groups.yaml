    江郎鬼才题外话：我认识不同国家的朋友，香港女平常的时候，敢都直接的讲出自己要什么，但真的正面交锋时，香港人反而变得很“间接”。


    换句话说，不管你是港女、台女、大陆女、马来女、坡女、鬼女或非洲女，你都是一样的。若你被问：“理想的情人是怎样的？”


    你一定会说：“感情专一，跟我在一起五十年后，晚上在床上一看到我的海葵春睡的样子，他还会兴致勃勃。要有钱，最好能够有钱到我什么都不需要做。最好他的家族生意是饮食业，公司旗下拥有法国、意大利、日本和泰国餐厅，同时也有家在黄金市区最贵的甜品店。能够带着我在意大利吃早餐，然后在米兰
    shopping，接着就到巴黎吃晚餐。外型要有姚明般高大威猛，样貌要有郭富城般俊俏，男根要有可乐罐般粗壮，而且舌头还可以如震荡器般每秒轮舔三百下…”


    理论上，你问任何女人她心目中的“理想”情人，她就不跟你讲她的“理想”嘛！没有女人会跟你讲：“哦，我理想中的情人是矮矮的、丑丑的、笨笨的。…哦，还有，还有，有一些地方，越短越小就越好。”


    就好像若你问男人同样一类的问题：“撇开人格和内涵的问题，假设这两个元素都已经拥有了，你理想中的情人是怎样的？”


    我相信没有一个男人会介意自己的下一个女友是漂亮一点、胸部大一点、皮肤光滑一点、叫床的声音再销魂一点。


    ## 什么叫做理性的爱情？


    什么时候女性会一定选一个身高样俏的男人？


    答案是：当所有追求她的男人都不特别，都无法激发她的幻想，都擦不出火花，她才会依最“理想”的选择：选外型或选经济能力。


    你想象一下有两个男人同时追求一个女生，其中一个貌似周星驰电影中的丑角“八两金”，另一个则貌似“郭富城”，但两个都是工厂的清洁工人，他们的家庭背景也不特别，两个人的
    IQ 和 education 水平都是一样的程度，两位都同样的跟女生在一齐时都没什么共同话题，更谈不上擦出什么火花。而且宿命先生跟她说未来三十年中不再有任何男生对她有兴趣，八两金和郭富城就是她唯一能够有机会成为她的男友的人。


    接下来我要问一个不公平的问题：“如果你是那位女的，你会选谁呢？”


    正常的女人当然会选郭富城。


    除了样貌以外，也不要以为有才艺、能讲出满口美国腔或英国腔的英语，就一定很有女人缘，我见过很多“真聪明”和“自认聪明”的男人，都不是追女高手。


    我也见过经济能力很稳固，甚至很富有的人在追求女生的这一个领域上完全失败。（当然，你若是穷光蛋，自己的三餐都成问题的话，我还是鼓励你就先把自己的饭碗搞好。）


    各位读者，我不是说有钱、有样貌、有地位没帮助，我在成为畅销书作家后，以前一个我追求失败的女生还会主动打电话来对我说：“没有想到你这么有文采。”


    所以，我不敢说这些东西没帮助，但，更难判断的一个事实是：怎样断定什么叫做有钱、有样貌和有地位？


    ## 怎样界定有钱、有样貌和有地位？


    我们先撇开所有其它“有钱”的定义，因为我喜欢用现金来算一个人有没有钱。你要在银行户口中拥有一百万？五百万？一千万？还是一亿才叫做“有钱”？


    什么才叫做有"地位"?名人？明星？政治人物？如果是艺人的话，上电视还是演电影才叫做“有地位”?就算是演电影，你是做主角还是做配角的？


    我和李俊杰老师在马来西亚是畅销书作家，也是目前（2010年）唯一能够立足港台的马来西亚作家，而且我们办的课程，每一个月都有台湾、香港和大陆的读者们专程飞到吉隆坡来上我们的各种课程，在马来西亚我们可算是“有地位”，但在国外的话，我们还不算大红，那么我们还算是“有地位”吗？


    所以，要断定什么叫做“没钱没地位”会容易过于是去断定什么叫做“有钱有地位”。


    江郎鬼才有话说：有没有钱和地位，都是从对比而判断出来的。


    换句话说，若我站在众多的刘德华、郭富城和 Brad Pitt 之中，我江郎鬼才就是丑，但如果我站在众多的“八两金”和“肥猫(郑则仕)”当中，我就是俊。


    一个拥有百万现金的人，他肯定不会觉得拥有少于百万的人有资格称“有钱”。他甚至会认为就算另一个人拥有三百万也没什么大不了，因为自己也只差那两百万而已。一个拥有一百万的人，可能就会觉得拥有一千万现金或以上的人，才能堪称“有钱”。


    大家可能心中就会有一个问题：“那么是否只要比心仪女生有钱得越多倍，你追得到她的机率就越高？”


    答案是：对和错。


    ## 有钱能吸引女人


    为什么我会说对呢？


    一位我曾经因为做电视节目的关系而有一面之缘的选美冠军小姐，在前些日子高调的与一位富家子弟交往，未来家翁还称赞她样貌与内涵兼具，是难得的好女生。听到这里、很多人可能就会说“你看，有钱就能有女人。”但，事实上其故事发展是我们完全想象不到的。


    我不知道是谁先起头行动的，事隔一年多后，家翁跟美姐竟然有一腿。整个事情我们可从两个可能性下手推测：一，可能是有人看多了日本某些“特种嗜好”的AV片吧；二，有人可以写一本《金龟阴谋论》来和我的《爱情阴谋论》抗衡。


    （嘿嘿，我不想写出其它的可能性，因为怕人说我观摩了太多“特种嗜好”AV片而猜测出来的。）


    我的一位朋友虽不是大富之家，但他的父亲因为是公务员（学校老师），所以在买房子的时候，政府有津贴，他只需要付非常非常低的利息。所以，就远在本《富爸爸穷爸爸》这本书还未面世前，他的父亲就已经不断的借钱买很多的房子，然后全数租给学生、外劳公司等等。但也由于他父亲经营有方，间接的影响到我朋友的生活。


    因为他交的女朋友中，有两个是在喝醉酒时，因为无故的讲出“唉~难道要等到你爸爸死去？”的这种话，搞得我这位朋友现在交女友的时候，都是草木皆兵。


    所以我才说有钱能够有女人，但我觉得要很成熟又很看得开的有钱人，才能够真正的享受到他得到的女人。


    那我为什么又说“有钱就能有女人”这句话也是错呢？


    ## 有钱不能吸引女人


    我认识的一位女艺人，她自己也承认自己是一个很爱钱的人，同时也很积极的赚钱。因为她名人的关系，追她的人不乏富商、有钱少爷之类的。不过，最近见到她的时候，她又好笑又无奈的告诉我：“我最近才．知道自己有多么的清高。”


    原来又有另一个富商追求她。


    她说：“他真的恨他妈的有钱，我到今天为止还不曾认识过可以有钱到像他这么夸张的人。”


    这富商在吉隆坡黄金闸区的市中心就拥有上百个旺店都是他的，又拥有兴旺的购物广场，而且还拥有上市公司。撇开他做生意的收入，单单只是租金的月收入就已经是个很恐怖的天文数字了。


    然后她说：“虽然我很爱钱，他也很喜欢我，简直无微不至的关怀我，把我当成公主般的呵护。但，……哎唷，不知为什么，我就是不能接受他。”


    其实这位女艺人不是不能接受他的“人”，而是不能接受他的“沟通方式”。这富商的沟通方式把男女互动中的火花全部歼灭，她完全没办法对这个人有任何感觉。我还笑着跟她说：“嘿，你要叫这些人来上我的课。”


    你们可能会问是不是他的沟通方式很霸道？很大男人？很猥琐？很木讷？


    都不是！他很喜欢她，也很尊敬她，也很关心她，也很有诚意……但这些就是他败笔的地方。


    那么，如果不是算有钱，或者收入普通的人，他们能不能把到超级正妹呢？


    记得，我上一本书《爱情阴谋论》中就说过，一般男人见到超级正妹，就会断定是有钱或者装有钱才能把到她们。


    ## 没有钱能够吸引女人


    前阵子我的一位学员留言给我，当时是他刚上了追女孩一个礼拜。他说：


    一进夜店我运用了男子汉肢体语言，刚开始的时候我对一位很漂亮的女生，用了一个江老师传授在夜店搭讪的打招呼方法。我也不知道行不行得通，因为在上课的时候我选当众问过老师这个方法在东方社会用不用得着。（江郎鬼才按：这方法就是先跟对方有眼神的接触，然后向她微笑举杯碰干。）打了招呼后，我就直接说了开场白。这个开场白的声调和肢体语言，我尽量模仿江老师在课程当中的示范。很cool，很Man的。


    取笑的部分我有点忘了（我是临场发挥的），不过她被取笑后要打我时，我就照本宣科的说：“我不是随便给人乱碰的…”然后我就用了江老师的那一句“反高潮”的话，她又大笑得更厉害。后来在跳舞时，我打开我的“同病相怜”和“性能量”（江老师广告时间：看我们的《心魔行销》来明白如何启动同病相怜和性能量），…之后我在临走前才跟她要电话，她还抓着我的手，一直交代我一定要打给她～


    她是有混到白种人血统的印尼美女，身材火辣，她还有开车，我骑电单车～第二次出来见面时，她开车来载我~哈哈。


    他这篇留言还有下文的，留言后的两个多礼拜，他终于搞定了这位混血儿。而搞定的意思是：他们俩互相上了一节对方的人体生理课程，互相研究对方的呻吟声和呼吸急速的频率，同时也研究了双方的精液和分泌物的味道。


    大部分人看到这个学员的经验，会有两种想法：


    ### 一、这是不是巧合


    答案是：我不敢讲是，也不敢讲不上。追女班所教的技巧虽厉害，并不能确保你要追哪个女生，就能百分百让你得到那个女生。但，我可以确保我那一句“反高潮”的对白，却是百分百能够让女生大笑。我在夜店用这句‘反高潮”，还曾经使到女生马上非礼我的胸部，（上过追女班的学员会明白）这句话是绝对的经典。（欲知这句话怎么讲，可以参加我的追女班，详情浏览我的部落格
    http://hk.niyblog.yahoo.com/kongkeeyung/index?l=f&id=23）


    ### 二、这位学员用这个技巧追到这样的女生，但他能不能维持这段感情？


    答案是：我不知道，我也不认为有人能够知道任何一段感情能不能永续经营，因为我要问的问题是：就算你用最传统的方法追求到一位女生，不管你是用钱，用才华，抑或用你的关怀来成功得到一个女人的芳心，那是否能表示你们就能够永远在一起？


    答案是：除了月老上帝，没有人会知道一对男女是否会永远在一起。


    所以，我也不知道骑电单车的男生追到开车子的女生，他们的关系能够维持得久不久，但，我知道“追求”和“维持”感情是两种不同的系统。虽然两个过程中的某些技巧会重叠，但基本上它们有结构上的分歧。


    ## 钱在什么时候重要？


    在我上一本《爱情阴谋论》中有讲过：Fall in love 和 Love 是有分别的。而“追”的目的就是要让对方 Fall In Love，而女人在被追的过程中，往往会被感情蒙蔽了自己的理性，她会更容昜的爱上男方的“潜能”。


    所以我才会说“追”女人的时候、让女人 Fall in Love 的时候，钱和样貌不是最重要，除非你是追着“心中章子怡已经完全被唤醒”的女人。(注：要明白什么叫做“心中的章子怡”可参考《爱情阴谋论》。)


    难道“钱”一点都不重要吗？


    哈哈，当然不是“钱”在维持感情时就很要紧了，不少的夫妻都是为钱不够用而吵架。但，问题是：Fall in Love 的时候，女人会很容易把“当下”的感觉，盖过任何未来的担忧。


    我还记得多年前，我的前女友在热恋期的时候，想把她母亲给她的一笔钱，分一半给我。她的理由是：我当时没钱，生活潦倒。(当然，没说出口的是：“我爱你，所以想给你钱。")


    我没有要她的钱，可能是我拥有大男人的意识吧。但，我认为若当年我有收下她的那一笔钱，在要分开的时候，她可能就会难分难舍了。(注：但如果现在有女人硬要我收下钱的话，我肯定不会拒人所好。)


    > 江郎鬼才有话说：大部分女人都是“爱情信徒”，少部分的女人才有办法做到“爱情不爱人”。很多读者以为我把章子怡列为“爱钱不爱人”的名女人，但我认为章子怡今天的境界是：“爱人也爱钱”

    > 她的选择权实在太大了，(她已经不再需要偎着人家喂葡萄了)。追她的男人最基本的就是要身价上了不知多少忆，然后还要得擦出火花。

    > 所以，我们的女读者群中就有此一说：“女人一定要看《看穿女人心、迷惑男人阵》，男人就一定要看《爱情阴谋论》。”


    若要我讲句公道话，追女的策略大概分两派，一派是以“外在条件”为主，另一派是着重于“内在条件”。


    我认为外在条件的钱、样貌和地位，在追求的过程确实能够打开方便之门来结识女生。但，方便之门打开后，若没办法向女生展示具吸引力的人格，她就没办法感受到火花。


    也因为这样，所以另一派以“内在条件”为主的就会着重于向女生展现诚意，向女生献出关怀。


    ## 老老实实关怀女生的追求策略


    大家阅读到这里，看到了钱财、样貌和地位都不是最关键的女人春药，那么老老实实的对女生付出关怀重要吗？


    我在这里告诉大家：追女生时，“关怀”也只是能打开方便之门而已，因为没有人会拒绝另一个人的好意。不过，问题是：阿猫阿狗也会关怀女人，女人不会因为你的关怀，她就会爱上你。


    付出和关怀在维持感情 (Love) 的阶段非常重要，但在要使人爱上你 (Fall in Love) 的阶段，往往会很容易有反效


    就拿“以钱追女”为例，若女生还未喜欢上你，不断的做银弹攻势，花钱在女人的身上，对方会觉得你想用钱来“买”她。如果你是一副色狼的模样，女方就觉得你想用钱来买她的身体。就算你一副好好先生的模样，真心诚意的以钱来关怀她，她可能觉得你想用钱来买她的心，但，你还是没办法完全打脱自己想用钱来“买”她身体的嫌疑。


    > 江郎鬼才有话说：要让女生有恋爱的感觉，你的管道不是用钱、样貌、地位、口才、才华或关怀。钱、地位、口才和才华让人敬佩，样貌让人看多几眼，关怀让人感恩，但敬佩、看多几眼和感恩不是恋爱的感觉。


    先决条件是：只要女方喜欢上了你，这些管道才能把“喜欢”升华到“恋爱”。


    反过来说，如果女方开始喜欢你了，就算你的本意是用钱来“买”她的身体，她还是觉得你很有“心”。


    不要以为走关怀路线女方就会喜欢你，用关怀和用钱追求女生可能最后的效果是一样的：女方觉得你想用关怀来“买”她的身体。


    呵呵，对比之下，用关怀来“买”到跟女人上床的机会，比用钱的人更吝啬，因为你这个Cheap bastard想嫖个不需花钱的妓。


    在 Fall In Love 的阶段，千方百计的关怀对方反而不是最重要，但，这也是很多好男人犯错的地方，因为他用了 Love 阶段的策略来处理 Fall In
    Love 阶段的问题。


    好男人常犯这个“关怀罪”，主要原因有两个：一个是属内心的矛盾，我将在在本书第四章跟各位探讨。


    而第二个主因是因为我们男人听太多女人的废话。


    # 第二章 男人欲把妹若听女人言、吃亏在床前


    ## 女人喜欢废话连篇论爱情


    女人喜不喜欢男人记得她讲过的话？


    曾经在台湾的 NLP 大师 Hogan Lee 的部落格中，有一个人问起了一个策略上的问题，要网上的 NLP 诸友帮个忙。（注：有兴趣的朋友，这一篇网志在
    Hogan 老师部落格的网址是：http://tw.myblog.yahoo.com/taiwan-nlp/a?ticle!mid=3907&p=-2&next=-2&page=1&sc=l#ya"tCmt)


    这位男生对自己长辈所介绍的一位面包店的门市小姐有兴趣，虽然跟对方交换了电话号码，但对方都没接他打的电话。面包店小妹的官方声明是说她那段时间比较累，所以很早早就睡了。


    （注：这本书的下一章我就会解释到这位面包店小妹回避男生电话的原因。）


    他的问题是：怎样能够让女生对他好奇，期待他打过去的电话？


    好多个朋友都给了不错的答案，其中最让我留意的是一女生给的答案。


