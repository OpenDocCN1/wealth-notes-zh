    Carm 也是一位常经过我的便利店的女生（不是那位多伦多大学的女生），她不完全 是白种人，可能是希腊、意大利或犹太人。她身材是瘦小、不高、肤色是浅橄榄色、看起来很舒服，属气质型的女生。（若要我比较的话，Chantal
    会比我更艳，Carm 是乖女型的。）


    她给我“电”到每天早上经过时，就会对我笑得很甜。直到有一天我的“电眼神功”发出了我想象不到的功力。


    她在经过我店前时，当我们如常的眼神接触时，我的眼神可能就像“我有话要告诉你”般，所以她进入了能量最低点，停下来。她看着我的表情就好像想问我“Yes?”般，眉毛有少许上扬，但她用这个表情看着我的时候，她才惊讶地记起原来我并没有跟她讲过任何话，所以她也微微地尴尬。


    #### 不知所措的装病


    我见她如此地有能量最低点，轮到我问她：“Yes？”


    然后，她紧张地惊醒过来说：“呃……呃……没有，我……我有点不舒服。”


    我心里偷笑，但表面上我还是问她：“你OK吗？你需不需要头痛药？”


    她说：“不需要，不需要，谢谢。我没事。”


    她离开后，我心中暗想：“嘿嘿，电眼神功的功力又提升了。Yes!”


    第二天她经过我的店前时，她做了一个举动让我信心大增。


    #### 眼神换取礼物


    她手上拿着两杯咖啡跟我说：“刚才我经过 Tim Hortons，我买了一杯加糖黑咖啡给你，你喝咖啡吧？”（Tim Hortons 是一家多伦多卖咖啡和 Donuts
    甜圈的连锁店）


    要知道我们都还是陌生人，大家虽然每天有甜美的微笑，但我们互不知对方的名字，只是点头之交而已，关系还不致于为对方买咖啡的那一种。


    好了，现在问问大家，这个信号好不好的？


    这是好信号，我当时谢了她后就跟她聊聊天，心中盘算着既然上一次得不到高大丰满的，这一次就找个娇小玲珑的吧。然后我就顺势地跟她提议约会：“如果你有空，我们可以出来喝喝茶。”


    她也很兴奋地说：“Yes, I''d really love to. 好啊，我也很喜欢啊。”（注：这是外国人的说法，是“好主意”的意思。）


    当时我们约定了是星期三在她下班后喝茶，不过之前一天她又给了另一个信号，她让我见识到她的演技。


    #### 第二次的装病


    星期二她早上经过我的店时，她告诉我：“江，我这几天有喉咙痛，我想我们能不能把明天的约会挪后两天？”


    然后在我的面前咳了两声给我看。


    我心想：“哇赛，做戏还做全套，很专业咧。”


    我当时心中微觉资讯不对称，不过身为男士就要有男人的气度，所以就跟她说：“没问题啊。”


    请问在我们把约会挪后到星期五，结局是什么呢？


    相信大家也猜到了吧！


    一到了星期五，她就有某一个“亲戚从远处到来”，约会就从星期五又服役到下个礼拜二，……然后又有其它理由……最后变成无限期的延后。


    当时我心里又无奈又气：“哦，发克！之前想追比较艳的，连第一步也做不到，现在要追比较乖的，为什么又是这样？”


    后来，更诡异的事情又发生了。


    #### 我越来越不明白女人


    事隔大概两个月后，我在她工作的购物广场遇到她，她竟然很热情地跟我说：“Kong! Haven’t seen you in a long time! How
    are you? 江！好久不见！好吗？”而且还过来抱我。


    我虽有抱她，但实是能量最低点。


    我以为既然你对我没有兴趣，我们再相遇时，你不可能会比我们之前，更热情吧？


    当时心想：“他妈的，这到底是怎么一回事？我并非如色狼般跟你讲话，我还很尊敬你，我也不是完全没诚意，我还主动约你喝咖啡，也不是要约你吃饭喝酒啊！只是出来喝个茶来认识女生真的有这么难吗？”


    你是否看到我跟女人互动的一个格式？


    这个格式可能很多男人都经历过：“你本来对我有些兴趣，然后我要约你的时候，你又没有兴趣了。之后再遇上你的时候，你又好像对我有兴趣。他妈的，你到底是有兴趣还是没兴趣？！”


