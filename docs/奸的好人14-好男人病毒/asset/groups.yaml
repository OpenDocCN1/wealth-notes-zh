    > 江郎鬼才有话说：我相信很多读者在这里开始呕吐了。好男人又持枪自轰双边睾丸，左一枪，右一枪。还以为自己说得浪漫和正气凛然。但女人心里面是想着：“公你妈的平！你以为你是谁？我要不要接受其他男人关你什么事？还要跟你先交代？神经病！”


