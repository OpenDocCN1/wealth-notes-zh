    我记得当年跟李老师说：“他所谓的‘良心事业’应该有很特殊的定义吧！”


    李老师说：“就好像我的亿万富豪的表亲在上了权谋课程后，特别的找我谈话，说我不应该教人这种权谋之术，他还叫我多上台湾陈怡安教授的课程。”


    “陈怡安讲些什么主题？"


    李老师笑得吱吱声说：“哈哈，没记错的话，他好像是讲佛家思想之类的课题。而且诡异的很诙谐的地方是：我表亲面不改色的一边教我要做好人，一边就吩咐他的下属如何用强硬手段逼债主还钱。”


    “哈，他叫他他的下属做什么？"


    “他说如果要放XXX的话，一定要…”


    （注：这强硬手段是犯法的，而且还是利用马来西亚的警察和民族主义，所以在此不多写。）


    最近，这么巧的我们又遇到这位做“良心事业”的学员，他问了我们的一个问题。他说：“我网上你们的课程时，你们还没写书，但，我现在看你们的书时，发现到你写的议题很极端。因为书可以触及的层面比课程更宽广，有没有想过你们的书对社会有什么影响？好比刘墉所写的书，我就觉得很好，因为他在散播正面的讯息，我觉得如果你们能写得像他一样，就更好。”


