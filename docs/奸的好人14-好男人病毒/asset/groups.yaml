    澳洲妹的那一场搭讪是在夜店，我跟她聊了三个小时，而墨西哥妹我是在等巴士时搭讪，只跟她聊了还不到四十分钟。两个女生我都交换了电邮，在回国后，我传了电邮给这两个女生。


    澳洲妹在回复时，只是两三行字而已。


    墨西哥妹则写了整篇文章来回复我，而且还在电邮中拍我马屁，暗示她很仰慕我这种男人。而且墨西哥妹还一直跟我互传电邮，又说她的生日会中她父亲请来了Mariachi乐队（墨西哥街头乐队，戴大帽子，穿上加斗牛服装的，**寄来了**乐队和她跳舞时所摄的照片。因为远水不能救近火的关系，我就开始渐渐没再跟她联络。


    不过，当年东南亚发生海啸的灾难时，她又传电邮给我，很关心的问候我，问我和家人有没有事。因为这样我又和她保持联络了一段时间，当然最后还是回归到远水不能救近火的现实问题。


    你们可能会想：澳洲妹跟我聊三小时，墨西哥妹才四十分钟，怎么是墨西哥妹会对我更有兴趣？


    我和墨西哥妹间的聊天就是着重于取笑和打情骂俏，不大认真就对了，只是谈得很爽很过瘾。但，只是那近四十分钟的互动，就有很强烈的印象，而且还不断的很有意愿的想跟我继续保持联络。


    反之，我还是要告诉大家，我搭讪澳洲妹时，她对我是有兴趣的。不过，我跟澳洲妹互动时，她有跟我分享她和她男朋友之间的问题。她说男朋友不成熟，还跟我说她想跟他分手，问我意见。当天晚上我们**聊**得得来，大家谈得很有亲切感，除了谈她的男友，我们**也**谈到工作、家庭等。


    我们谈心三小时，但，就是火花不足。我回国后，她只是回复我的电邮一次而已。


    > 江郎鬼才有话说：谈心不是不重要，以上面的例子，要有了墨西哥妹的反应后再谈心才是正确的。


    # 好男人的辅导双重标准


    有没有注意到，一个刚认识的心仪女生是有办法使一个男人花更多的时间和精力来分担她的烦恼。当女方心情不好的时候，好男人会约女生出来，请她吃饭喝酒，花两个小时听她诉苦，再费一个小时跟她做辅导、给建议和激励，然后又买些可爱的精品送给她，让她的心情好一点。


    但，如果是你的多年男性好友心情不好，你请他出来**吃**饭喝酒，然后聆听、辅导、激励，然后又买可爱的精品来逗他开心，你说有可能吗？


    答案是：男人与男人之间，若你朋友心情不好，是“他（心情不好那一方）”请你出来喝酒。但，男人与女人之间，若女性朋友心情不好，是男人（心情没问题一方）请女人喝酒。


    > 江郎鬼才有话说：大部分的好男人都有严重的双重标准。


    如果女生要你出来，因为她真的发生一些不如意的事情，我不是说你不听，但你要听得有价值，即以自己的条件来听，跟她讲你什么时候才有时间听，而不是随**叫随到**。


    # 印象定型：辅导式和顾问式追求的危机


    在追的阶段时，男士们不要去解决她的问题。我的意思不是说她跌倒你不扶她起来，而是说她的家庭、人际、钱财、感情、人生方向等的问题，你都不要去解救她。


    举例，如果你追求着的女性说她的生意不好，但你却是知道很多销售技巧是能够帮到她的，你就要控制着自己不要教她。请注意，**表面**看起来是很冷血的，但，如果你太热血，觉得能帮则帮，而且她也接受了你的帮助，你就要预知可能追不到她。


    如果在追的期间，她问你的解决方案时，你也傻傻的给意见的话，她会觉得你的意见有价值，但，你的身份也就开始倾向成为她的免费个人辅导或顾问了。


    这就叫做“印象定型”，往后她一需要吐苦水，或解决某些问题时，才会想起你。


    > **男人向女人诉苦的真相：** 之前就有一位女学员问过我一个问题，她说她在我们的书上看到的若要跟女生发生感情的话，就千万不要做对方的辅导员，不要聆听她的痛苦。


    所以，当有一个男生对她说：“你不是我要的那一类型”后，他开始跟你诉苦、讲心事。女学员因为对这个男生没兴趣，所以就照着我们书的说法，跟他**辅导**，结果这个男生之后就跟她表白了，她问为什么会变成这样。


    第一，一个对你没兴趣的人不会跟你讲“我对你没兴趣、你不是我喜欢的类型、我不是要追你”之类的话，特别是不打自招的讲了两次，就很肯定是在讲反话了。


    第二个重点确实是我们之前的书里没写清楚的：男人和女人不同，女人对男人诉苦的话，她会把男方看成好朋友或好姐妹。但是，男人若对女人诉苦的话，往往是已经对女方有兴趣了，他想用的策略是希望女生同情他。


    所以我才屡次在书中提出“不要做辅导男”的戒条，因为大部分女生都只能对辅导男“感恩不**感**受”，但问题是一些女生在约会时不期然的诉苦，其实人与人之**间**诉诉苦是蛮正常的，只不过好男人遇到女人诉苦时，他们会情不自禁的去继续放大女方的诉苦行为，然后尝试借势做拯救者或智者，结果这就像在木头上淋水，很难再擦出火花了。


    我也不是说完完全不跟女生分忧，但要怎样做才是正确的处理？


    # 应付诉苦的女生


    有些女人喜欢长篇大论的讲自己过去的感情，特别是之前的那些有不好结局的感情，或者细数对她不好的前任男友。特别是如果你跟她第一次约会，她就跟你讲这种话，她对你那方面的兴趣还是不大，甚至可能是你还未擦出足够的火花，当然还有另一个可能性是：她是瘟疫女。


    我不是说如果女生第一次跟你见了面就诉苦，就表示没救了。我可以接受听她讲前任男友如何伤了她，但我只能接受听一次。如果第二次见面时，她又重提的话，我就会尝试用话术来做转移。如果我转移了过后，她还是重提的话，表示她还未准备好把过去放下。


    这个时候我会有两种做法：一，如果我确实对她很有兴趣，而且她看起来也不像是“瘟疫女”（放不下不一定等于瘟疫女），我就会选择用NLP的技巧把她的这个记忆淡化。二，如果她放不下，同时我确定了她是“瘟疫女”（即除了前任男友伤过她，她还认为每个人都伤过她），我不会浪费时间，我会马上放下。


    那么男读者最关心的问题就是：“如何不让女生不断的说她的心事和诉苦？”


    # 错误的“情绪式”四两拨千斤


    你若没有吸引她的话题，又不主导着话题，而且又是一个很好的聆听者（好男人往往是聆听者），女方会很自然的就开始跟你讨论姐妹群谈论的话题，而姐妹话题中就少不了要诉诉苦。


    如果女方在初次约会就讲出自己的烦恼和痛苦，你就稍微认同一下，因为你不让她觉得你完全不关心她的感受。然后紧接着就要转去其它更精彩的话题，这就是四两拨千斤。


    这个认同是有技巧的，你不要认同她话中的某些特定字眼，更加严禁认同她话中情绪元素很重的字眼。


    举例，她说自己的前任男友在她的背后跟其他女生交往，她觉得男友不尊重她。如果你说：“我很认同你的说法，两个人在一齐的最基本，就是尊重。”


    “尊重”这两个字就是情绪元素很重的字眼，只要你一讲出这两个字的话，她就会觉得你实在很了解她，还触动她内心的郁结，她就会开始喋喋不休的把自己当时的情况和痛苦道出。


    而好男人还会笨到要想问出更多细节，你越问，对方就越投入于过去不好的回忆中，这个过程在我们的《印象洗脑术》中称为“重新逼真化（Revivification）”。


    这个时候你就会变成一个很好的聆听者，同时也变成了“辅导男”。（我上一本书《爱情阴谋论》中就用玩具熊来比喻这些辅导男。）


    > 江郎鬼才有话说：当她已经开始喜欢上你，你则反而要认同和反映她那些情绪元素很重的字眼，如此她才会觉得跟你有心心相连的快感。


    # 正确的“概念性”四两拨千斤


    初约会**到**过诉苦女生的话，安全的做法是讲一讲模棱两可的概念性浪漫废话，然后就转移话题。例如说：“我明白你那些经历不是很开心，我们每个人都有过去，每个过去都会有不如意的事情，每个不如意都是生命给我们的教育。所以，最重要我们要问自己…『我们现在想怎样？我们要怎样才会开心？』……就好像…（这里你开始转移话题）”


    上面这段话的第一句“我明白你那些经历不是很开心”是用来让对方觉得你有听，但，请注意，这句话是模棱两可的。所以，你是“概念上”认同她，但情绪是没有给予明显的认同。


    第二到第四句的“我们每个人都有过去，每个过去都会有不如意的事情，每个不如意都是生命给我们的教育”，属于是宏观的转移。换句话说，现在我们不是谈着“你”的问题，而是讨论着“众生”的问题。在下意识中，你把她狭窄的视野提升到宏观世界了。在我们的《极端自我就是王》中有解释到，这种描述词是能够把听众暂时抽离她的立场，你告诉她的潜台词是：“不是只有你痛，每个人都有痛，不只是你惨，每个人都惨，所以你的惨痛没什么大不了。”


    其实，你就是很“宏观概念性”的安慰了她，把她的痛苦减轻。


    > 江郎鬼才有话说：我若遇到挫折，我最大**不**希望被人安慰，我觉得安慰我其实就是在侮辱我。一个男人若追女遇到挫折，跟他讲什么“坚持下去，明天会更好”之类的话，是一点用处都没有。


    上段最后那三句话就是转移的铺排，而且当你说“我们现在想怎样？我们要怎样才会开心？”这两句话有两层意思，单看字面的意思，这是大家都明白的，你是尝试把她的思路转移到现在，而不是不断的想到过去。但，这两句话中的代名词“我们”是很模糊的，这个“我们”是泛指所有人呢？还是指“你和她”？


    其实两层的意思都有，你是讲着所有人，同时也讲着你和她，所以当你偷偷的顺便也讲了“我们（你和她）要怎样才会开心”，同时也在她的下意识播下了种。


    记得，你是话题主导者，如果你主导的话题比她的烦恼更具吸引力，就算她本来有烦恼，也会被分了心，进而转移来跟你探讨你那更爽、更过瘾、更精彩的话题。


    好了，就算大家已经变成情侣后，也不要因为听到她诉苦就表示需要帮她。


    # 女人诉苦的目的，就是为了诉苦


    不少的老公在听太太诉苦后，就会马**上**给予建议要如何解决问题。我有一个朋友的太太就是常回到家就投诉老板怎样不好，朋友听老婆投诉多次后，就给了她几个建议，不过奇怪的事情就发生了。


    每次我的朋友建议她辞职或换公司，他的老婆必定都有理由。如：现在还不是时候，因为她要把某个计划先弄好；又或者说现在的行情不好，冒冒然出去面试的话，得到的薪水不会太高；总之朋友的每一个建议都被否决掉。


    > 江郎鬼才有话说：女人有**时**的诉苦，就只是**纯粹**要诉苦而已。


    所以就算老公一片好意要帮忙老婆解决问题，你还是忍**着**。所以从老公的角度，有些男学员会问我：“江老师，我看过老婆的这种情况，若再走下去，一定会出什么问题，难道我知道了她会出什么问题，我不阻止她吗？”


    # 不断给建议的伤害性


    我告诉大家，没有一个人是喜欢不断的听人家的建议和警告，若你不断的每一次都建议和教导你的太太应该怎样做，时间一久，她还是会对你有抱怨。因为不断给建议伴侣，实在是间接的说她笨，而且没有人喜欢自己的伴侣认为自己笨，男人更加不能忍受自己的太太女友说自己笨。


    > 江郎鬼才有话说：直接讲自己伴侣笨，会有伤害，但，间接讲伴侣笨的做法（即不断给建议），伤害更大。


    被直接讲的人，可能会生气的就反应，怒气可能表达了出来。被间接说笨的人是最难受的，因为伴侣没有做出任何人身攻击，但你却感受到，你要怎样骂架呢？


    而且给建议的一方背后一定有一个振振有词动机——“我为了你好”，你要怎样去骂一个“为了你好”但却又间接说你笨的伴侣呢？


    就算你的建议是对的，她没跟随你的建议而终于遇到挫折，你跟她讲：“你看！我老早就跟你讲了，你就是不听……”


    请问她真的会服吗？


    如果你是不听人家的话，结果真的失败，你喜欢听到对方说“是不是！？我老早就跟你讲了……”吗？


    坦白说，你知道你的决定是错了，但是还是照样的不服气。


    > 江郎鬼才有话说：不断的给建议太太，会让太太觉得你看不起她。就算你的建议是对的，最后对方还可能会恨你“对”了建议。


    就算你有办法给太太很多很好的建议，要记得不能常给。同时要给建议的话，以轻描淡写的方式来讲，而不是以“我教你怎么做”的态度来讲。


    # 条件式的听伴侣诉苦


    男和女对比起来，女人是比较注重她的情绪生活，她需要宣泄，千万别以为她诉苦就表示她要解决问题。


