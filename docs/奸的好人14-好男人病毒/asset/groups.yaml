    最后，就好像需要打扫客厅和清理冰箱般，我竟然会记起原来还有一件事情要办……我的表带最近坏了，该是时候去买一个新手表。


    结果，我又花了二十分钟去买了一个手表。不过，在补了我生活上的一些物质不足后，我好像再也想不到其它的借口。


    后来，就硬着头皮，上去打招呼，但这是拖了整整一个多小时的思维包袱的招呼。而且一开口时，我却用上了一个全新的借口。


    我走到她的摊位前，跟她说了：“嗨，好吗？”


    她见到是我也微笑说：“好啊，你呢？”


    我就说：“还好……因为我在附近买了手表，所以顺便过来见见你。”


    他妈的，自己还是有点不好意思，我还傻傻地展示新手表给她看，好像想证明我真的是有买手表，幸好还没有笨到把手表的收据也拿出来给她看。


    大家寒暄几句后，我就跟她说我温习了七天的对白：“I was wondering that if you are free, maybe we can go
    grab a cup of coffee some time.（我在想如果你有时间的活，我们或者可以出来喝喝咖啡。）”


    这可说是我人生中第一次约女生的对白。


    她很高兴地说：“好啊，可以啊，我给你我的电话号码。”然后就给了我她的电话号码（当年在加拿大，手机还不是很流行），我满心欢喜拿出把电话号码放到自己钱包内，确保放得好好的，但后来我才知道电话号码的真相。


    #### 遥遥无期的电话


    过了几天，我一打电话给她的时候，才知道原来她给我的是她工作地方的电话号码。


    她的同事接了电话，然后叫 Chantal 来听，当我一讲我的名字，她说：“Oh yes yes, 我记得你。”


    “没有啦，就是想看看你什么时候有空，我们去喝咖啡。”


    “好啊，好啊，但我现在在个工作着，不如这样吧，我迟些时候打个电话给你。”


    “好啊，假如我不在的话，就留言在我的语音信箱。”


    各位读者请暂停，思考一下，你们觉得之后的发展是什么结局呢？男读者们，请问通常这个情况下，女生还会再打电话给你？


    #### “我再打给你”的意思


    这是我第一次了解到，当女生跟男人讲“我现在不能，我再打电话给你好不好？”时，通常她们的意思是：傻佬，我不会打电话给你的，你也不要因为我不给你，而你又打给我。我知道你笨，但我还是希望你能了解我的意愿。”


    她们只是还未直接对你讲“发克哦夫”而已。


    百分之九十九点九九她是不会主动打给你，在我们的《心魔行销》中有讲到，如果女生没有给你 counter offer（即另外一个建议），她的意愿就不是很强了。


    当女生跟你讲：“我暂时没空，一知道了我的时间，我就给你知道。”


    这不是承诺，承诺的意思是起码她告诉你哪一天有空。


    后来这“咖啡约会”就不了了之。


    最诡异的是，之后的她一经过我的便利店面前，她又对我微热情，我再约她的时候，她还是照样跟我说她会打电话给我。


    #### 虚火现象


    甚至还有一次她来到便利店买东西时，恰巧有另一个多伦多大学的女生来买香烟，这位女生平常对我是很热情的。而当她很热情地跟我嘘寒问暖时，Chantal 就开始有一同我预料不到的反应。


    Chantal 的眼睛微露不屑之光，斜视这位女大学生，然后眼睛上下的打量她一圈，而且她的眼光还是非常不友善的那一种。然后 Chantal 就转过头来，开始对我更热情！


    我在一旁虽然很投入地跟这两位女生双边交流着，但我的内心其实是已经抽象、已经灵魂脱体了。


    当时我觉得女人真的很“狗”。有人要我的时候你就会对另一个人狗眼看人低，然后又对我热情。我当时心想：“他妈的，女人在搞什么鬼？为什么女人这么麻烦，发克！”


    > 江郎鬼才有话说：有其他人要的东西叫做“好东西”，给你的目标看到她的对手，“你”的供应就会变得“有限”，这个时候你的目标被“嫉妒”冲击，你的价值就会提高。


    你本来可能打算把家里的一个旧物丢掉，但如果听到传闻有人想收购你的垃圾，这时你可能还会暂时保留着垃圾。


    Chantal 之后跟我有没有下文？


    没有。


    我称 Chantal 这种反应为“虚火上升”，它不是真的火花，之后我就暂时放下了 Chantal，因为我有了新的目标。


    ### 因约会面生病的女人


    #### 不小心放电的效果


    Carm 也是一位常经过我的便利店的女生（不是那位多伦多大学的女生），她不完全 是白种人，可能是希腊、意大利或犹太人。她身材是瘦小、不高、肤色是浅橄榄色、看起来很舒服，属气质型的女生。（若要我比较的话，Chantal
    会比我更艳，Carm 是乖女型的。）


    她给我“电”到每天早上经过时，就会对我笑得很甜。直到有一天我的“电眼神功”发出了我想象不到的功力。


    她在经过我店前时，当我们如常的眼神接触时，我的眼神可能就像“我有话要告诉你”般，所以她进入了能量最低点，停下来。她看着我的表情就好像想问我“Yes?”般，眉毛有少许上扬，但她用这个表情看着我的时候，她才惊讶地记起原来我并没有跟她讲过任何话，所以她也微微地尴尬。


    #### 不知所措的装病


    我见她如此地有能量最低点，轮到我问她：“Yes？”


    然后，她紧张地惊醒过来说：“呃……呃……没有，我……我有点不舒服。”


    我心里偷笑，但表面上我还是问她：“你OK吗？你需不需要头痛药？”


    她说：“不需要，不需要，谢谢。我没事。”


    她离开后，我心中暗想：“嘿嘿，电眼神功的功力又提升了。Yes!”


    第二天她经过我的店前时，她做了一个举动让我信心大增。


    #### 眼神换取礼物


    她手上拿着两杯咖啡跟我说：“刚才我经过 Tim Hortons，我买了一杯加糖黑咖啡给你，你喝咖啡吧？”（Tim Hortons 是一家多伦多卖咖啡和 Donuts
    甜圈的连锁店）


    要知道我们都还是陌生人，大家虽然每天有甜美的微笑，但我们互不知对方的名字，只是点头之交而已，关系还不致于为对方买咖啡的那一种。


    好了，现在问问大家，这个信号好不好的？


    这是好信号，我当时谢了她后就跟她聊聊天，心中盘算着既然上一次得不到高大丰满的，这一次就找个娇小玲珑的吧。然后我就顺势地跟她提议约会：“如果你有空，我们可以出来喝喝茶。”


    她也很兴奋地说：“Yes, I''d really love to. 好啊，我也很喜欢啊。”（注：这是外国人的说法，是“好主意”的意思。）


    当时我们约定了是星期三在她下班后喝茶，不过之前一天她又给了另一个信号，她让我见识到她的演技。


    #### 第二次的装病


    星期二她早上经过我的店时，她告诉我：“江，我这几天有喉咙痛，我想我们能不能把明天的约会挪后两天？”


    然后在我的面前咳了两声给我看。


    我心想：“哇赛，做戏还做全套，很专业咧。”


    我当时心中微觉资讯不对称，不过身为男士就要有男人的气度，所以就跟她说：“没问题啊。”


    请问在我们把约会挪后到星期五，结局是什么呢？


    相信大家也猜到了吧！


    一到了星期五，她就有某一个“亲戚从远处到来”，约会就从星期五又服役到下个礼拜二，……然后又有其它理由……最后变成无限期的延后。


    当时我心里又无奈又气：“哦，发克！之前想追比较艳的，连第一步也做不到，现在要追比较乖的，为什么又是这样？”


    后来，更诡异的事情又发生了。


    #### 我越来越不明白女人


    事隔大概两个月后，我在她工作的购物广场遇到她，她竟然很热情地跟我说：“Kong! Haven’t seen you in a long time! How
    are you? 江！好久不见！好吗？”而且还过来抱我。


    我虽有抱她，但实是能量最低点。


    我以为既然你对我没有兴趣，我们再相遇时，你不可能会比我们之前，更热情吧？


    当时心想：“他妈的，这到底是怎么一回事？我并非如色狼般跟你讲话，我还很尊敬你，我也不是完全没诚意，我还主动约你喝咖啡，也不是要约你吃饭喝酒啊！只是出来喝个茶来认识女生真的有这么难吗？”


    你是否看到我跟女人互动的一个格式？


    这个格式可能很多男人都经历过：“你本来对我有些兴趣，然后我要约你的时候，你又没有兴趣了。之后再遇上你的时候，你又好像对我有兴趣。他妈的，你到底是有兴趣还是没兴趣？！”


    这个格式令我非常的迷茫。


    我是不是用错了策略？还是……我自作多情而看错了信号？抑或我的样貌欠佳？或者是她们看到我只是一个小店员（没钱没地位）所以很难对我产生兴趣？


    ### 现实中的爱情：运用金钱、样貌和地位的追女策略


    #### 实力、外表


    很多人都一概而论地讲了些很模棱两可的道理：有钱就会有女人，有样貌就会得女人心，有地位的男人女人会自动送上门。但，针对金钱、样貌和地位，我们需要更深入的探讨它们是怎样帮男人吸引女人。


    曾经有一位台湾过来马来西亚上追女课的学员问过我一个问题。


    他说他很矮，自己的身高只有一百六十公分，而且他已经二十多岁，不可能再长高了。他因为喜欢身材较好的女生，所以自己以前追过的都是比他高了两寸到六吋。


    说实在的，不少这方面的官方信息确实显示大部份的女性都喜欢较高的男人。甚至这位台湾男生所认识的女生和他所追求过的女生都亲口跟他说同样一个资讯——女人喜欢比自己高的男生。


    这位学员最关心的事情就是……


    他觉得自己的外型（即样貌和身型）都没有什么特别吸引女人的地方，就算上了追女班，学了这些技巧，他还有没有机会追到自己喜欢的那种身材较高的女生？


    他也正在积极的培养着自己的实力、才艺。其中的一个计划就是要把自己的英文搞好，他希望自己能够讲得一口流利的英语。但他却也知道这种自我增值的投资是需要时间的酝酿，不是一朝一夕就可以看到成果。


    换句话说，他的问题就是：“如果没有外在的吸引力，如：样貌、体高、财富，也没有内在吸引力，如：才华、知识、英文等，我学了这些技巧，是否真的能帮助

