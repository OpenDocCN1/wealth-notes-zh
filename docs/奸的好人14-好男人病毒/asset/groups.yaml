    - 后记 江郎鬼才的“大男人真言” - 141\n\n---\n\n## 前言\n\n### 爱情的规矩要守还是要破？\n\n江郎鬼才曾经江郎才尽。\n\n\
    曾经约了一个我对其感兴趣的大波女生，我们第一次的约会是共进晚餐。而在我们用餐完毕之后，她邀请我到她的公寓喝茶（不是喝咖啡）。结果，我们在她的公寓喝茶聊天，一直聊到凌晨四、五点钟，虽然没发生什么事情，但我当时对这次约会觉得还蛮满意的。\n\
    \n第二次约会的时候，她也邀请我上她的公寓，因为她亲自下厨烹煮晚餐，所以我就带了红酒上门。当晚她穿短短的紧身裤，露出修长雪白的双腿。当时我心中不能说没有期待，但可能就是因为期待的关系，内心很想采取行动，但行为上却又像第一次约会般，二人只是聊得很融洽，也是谈到凌晨三、四点钟。\n\
    \n我离开的时候，心里面就在想“不能了！下次我一定要采取行动。”过了不久，我们约定第三次约会。\n\n同样的，我们在外用了晚餐后，又上她的公寓喝茶。喝茶的当儿，我们谈到自己头部的形状，我说我的头顶尖尖的如同屋顶，她说着她自己的头又是哪一个形状，我们还用双手互相抚摸对方的头顶。剧情发展到这里，好像开始有些头绪了。接下来她做了一个举动，让我不知所措。\n\
    \n她说她吃得太饱，然后就在我的面前，她解开自己裤子的腰带，也在裤头处打开了一个钮扣。当时，应该能够看到她内裤的上端，但我却因紧张而刻意装得若无其事，所以完全没有留意到。我心跳得很厉害，头脑不断的想：“怎么办？这是个好消息，但下一步要怎样呢？怎么办？”\n\
    \n虽然我们说是聊到凌晨三、四点，而且她的裤头选是一直开着，我的脑袋就好像冻结了般，致使结果仍然跟第一次的约会一样：什么事情都没发生。\n\n我也不知道当时的自己是笨还是没胆子，但就知道机会之门为我而开，而我却没有走过去。\n\
    \n在第三次约会之后，我们还有第四次再见面，不过我隐约的觉得她对我的感觉渐渐转成友善，更在第四次约会之后，我们见面时，她反而会跟她的朋友一齐出席。那道门已经关上了。\n\
    \n这种“该上没上”的情操，是很典型的好男人病毒，这种毒素和我们小时候被灌输的文化有关，这种文化严重起来的话，还可能会使男人在女人眼中变成毛骨悚然的动物。\n\
    \n### 电影世界的半真半假\n\n男女的游戏在于拿捏“很在乎”和“不在乎”。一部好看的爱情电影是双方都摸不清对方的“在不在乎”，而且自己也不清楚自己“在不在乎”。这种双方都在“乱拳打人”的爱情策略，男女主角皆势均力敌，才让观众看得过瘾，才能成为故事的中枢。\n\
    \n若戏中的某个角色是全世界最美、最性感的女人，同时她又能完全摸透男角的心理，以色诱兼心理战术掌控男角，这将是故事中的一个旁支。举例，美国电影《Hitch》是述说一个专业的把妹教练如何帮另一男角得到他要的女人，但同一时候把妹教练又看上了一个女生。但，因为他动了情，所以在把妹上策略和技术都开始出现状况，同时也渐渐地丢失了自己的主控权。\n\
    \n换句话说，编剧要把这位把妹达人的功夫废掉一半，他才能跟女主角势均力敌，如此才能成为故事中的主线。故事中的两位男角（主角和配角）最后就是因为真正的爱上两位女角，结果真情流露，各自做回自己而各得美人。\n\
    \n虽然这是故事，但这故事其实有一半是真理，另一半是噪音，因为电影故事若完全是百分百的写实，观众就不需要看电影了。同时，若电影情节百分百虚构，观众又觉得跟自己的经验相去太远而不能产生共鸣。就好像我上面所写的“开裤头”故事般，一个人确实有可能在动情后，会如\
    \ Hitch 般出现技术上的状况，而我本身当时也还不至于动真情，但当我的欲念被启动时，我的脑袋也出现状况。\n\n但 Hitch 的故事结局——“做回自己，赢得美人”就是虚构的噪音，它只是为了故事有个“浪漫喜剧”的结局而已。现实的情况中，大部分男人在动情后才出现状况的话，往往是不够够起死回生的，而且男人在出现状况后再“做回自己”更会被打入十八层地狱。\n\
    \n### 要守规矩还是破规矩？\n\n想象一下如果你正在擂台上打拳，一上擂台你就很惊讶的发现原来裁判有一双斗鸡眼，你的教练见状就马上跟主办单位投诉，但他们说今天这场比赛，所有的裁判都没办法出席，所以只能聘用这位斗鸡眼裁判。\n\
    \n你勉为其难的开始了拳赛，但中途的时候你发现当天的对手好像摸清了这位裁判的底子，因为他常在斗鸡眼裁判的盲点处，对你打出了一些犯规的拳法。而且这家伙还在他犯规后，弄了个斗鸡眼来讥笑你。\n\
    \n碍于裁判对这些特别角度的犯规好像视若无睹，请问，你还守不守规矩？\n\n你要执意的站在斗鸡眼裁判眼睛所看到的角度打拳？\n\n还是在特定的时候，也会闪过去在裁判盲点的\
    \ 地方 出击？\n\n在电影的故事中，观众确实是要求 Hitch 的把妹高手因动情而废掉一半功力，这样的戏才好看。但，爱情的战场上却也有不少残酷的事实，因为现实中是兵不厌诈的。\n\
    \n### 此地无银三百两\n\n我认识的一对夫妻会常在大家面前，半虚半实的互牛目诬赖对方，说是对方先喜欢自己的。\n\n老公已经是事业有大成之人，所以有时候会比较醋。而老婆则因为人喜欢发表的天性，有时候反而会“讲多错多”的越描越黑。某次她还说：“其实我当时喜欢他，不是因为他靓仔…”\n\
    \n呵呵，这么一个“此地无银三百两”的资讯，反而让我更加的怀疑她当年应该是被老公的外表和风度所吸引。\n\n这不难明白，因为大部份的男女在约会的初阶，都会玩着商场上的一个谈判游戏——“开价”。\n\
    \n### 开价拖拉战\n\n我记得某次我的朋友开车载我去吃饭时，听到他接了一通电话，是他的供货商打来的。由于我就坐在他的旁边，所以他们之间的对话听得一清二楚。\n\
    \n朋友说：“你开个价给我们啦。”\n\n供货商：“你们的 budget(预算) 是多少？”\n\n朋友：“你最好的价钱是什么？”\n\n“你们的公司应该有\
    \ budget 的范围嘛！我知道了你们的范围后，就比较容易谈下去…”\n\n“现在是你做我们的生意，当然是你报价上来嘛……”\n\n接下来的五分钟，这两个人就不断的大打太极推手，好像充满了华人的礼让化般说：“不小，你先讲吧”，对方则回敬“不要客气，你先讲啦！”\n\
    \n回过头来看，在约会的初期，如果双方势均力敌（即你有我要的美色，我又有你欣赏的才智或垂涎的资源），同时又隐隐约约的知道对方好像对自己有兴趣，两个“聪明人”就会开始玩这种“你先开价”的谈判游戏。\n\
    \n开始时我可能还会承认对你有好感，但我的计划是打死也不先说我爱上你。（这个计划先失手的通常是男性）\n\n### 两难\n\n所以曾经有一位年轻的男读者告诉我：“江老师，我看了你们《好的好人》系列书，书中建议男人在追求女生时，最好不要先以做朋友的策略入手。”\n\
    \n我说：“对，通常以做朋友的方式入手，很难再把朋友的印象转换成情人。我不是说不可能，从朋友转成情人是少数。你若问女生的话，大部分都会跟你说要先从做朋友开始，好让大家有个认识和了解的机会，然后再看看能否发展下去。但，千万别相信女人所讲的官方言论。\n\
    \n我也认同，所以我现在认识了心仪女生后，我都很快的给她知道我喜欢上了她，不过效果还不是很好。”\n\n“哈哈，你这本来就是该死的。才认识人家就表白或暗示你喜欢她，基本上是跟女生说了：‘我很想跟你搞。’难道你还要预计女生们宽怀的接纳你吗？”\n\
    \n才认识女生就说你爱上了她，就好像一个人刚认识你就跟你借钱一样，你势必会很快的想回避他。\n\n现在你可能会问自己一个很现实的两难问题：“那么一个男人刚认识心仪女性时，应该怎么做呢？做朋友又死，让她知道自己喜欢上她也死。”\n\
    \n我相信这也是很多男人所经历过的两难困局。\n\n一些男性读者可能会采用一个双管齐下的策略：“那么是不是先跟女方做个‘假朋友’，因为如此就不会失去主控权。同时也不会打草惊蛇。但自己所做的却是‘男朋友’的举动，进而打动她？”\n\
    \n老实说，很多男人都是采取这个策略，口头上说是做朋友，行为上则献上无限的关怀，但是他们不知道女人恰恰就是最讨厌这种男人。\n\n后续我将在本书内解释为什么女人会有这种负反应，而男人却会一再的犯这个同样的错。\n\
    \n### 为什么越顺从越麻烦？\n\n不少的男学员很想在自己女友身上出招，因为女方时常乱发脾气和闹情绪，每次一发脾气就会闹得他们头昏脑胀，因此，他们会常问我有什么招式可以用来控制女友。\n\
    \n通常我在还未回答他们之前，都会惯例的先问：“你常不是很顺从她？”\n\n百分之七十的答案是肯定的，而他们最不明白的是——“为什么已经如此顺从我的女友或太太，但她却还是对我不满意？！”\n\
    \n我的一些女学生说：“自己每天不对老公发脾气，就好像不自在似的。”当男人越来越服从女人时，她的脾气反而会越来越大。\n\n这是我个人的界限：我不对人乱发脾气，很自然的，我就会要求对方不要对我乱发脾气。在男女关系里面，如果我的界限明确但女方是发脾气者，下场只有两个：就是分开，因为我不能接受；一，如果我们要继续的相处下去，她就必须要尊重我的界限。\n\
    \n在结识女生时，若我知道她常情绪不稳定、乱发脾气，我只会说“Thanks, but no thanks”即使再漂亮，我都没时间跟她相处。我当然有能力去控制这个状况，但我不可能笨到要找一个状况来控制。\n\
    \n对方若是对很多人都乱发脾气的话，这是人格问题。但，若女方是在跟你相处后，才展现这种常乱发脾气的现象，特别是对他人都不乱来，唯有对你才发脾气，这百分之九十是你弄出来的。\n\
    \n> 江郎鬼才有话说：正常的男女关系里面，只有热恋期的时候能对伴侣千依百顺而不会有反效果。若你在追求期或成为伴侣后千依百顺，你越顺从对方，对方则越刁难你。\n\
    \n所以，当男女要进入一段感情前，请坦白的问问自己：“我个人的界限是什么？”\n\n本书将会教你在厘清自己的界限后，如何有效的跟女生划清界限，反而会得到她们的尊敬与青睐。好男人可能会觉得我所讲的这些好像是反其道而行，他们认为要无微不至的关怀女性，甚至无条件顺从自己的女友才会得到女性的接纳。但，同样的好男人也会很懊恼的说：“为什么每个女人都说要一个好男人，但当好男人真的出现时，她却却步的说出他没有感觉？女人到底要什么？”\n\
    \n要从理性角度了解女人，将是很痛苦的一件事情。\n\n### 女人的爱情观合不合道理？\n\n在上一本书《爱情阴谋论》中，有提到我和一位新加坡男性被一群女生问及会不会原谅已经劈了腿但又要求复合的女友。我是用心兼用脑的回答，我大概说：“很多男人都会觉得我们男人出轨是天公地道，女人出轨则是水性杨花，但我觉得要公平，不能有双重标准。我自己守规矩的话，就会要求自己的另一半也要守规矩。但如果连自己也不守规矩，又怎能要求人家守规矩呢？”\n\
    \n答案涉及范围包括人伦、公道、同理心、社会规范等等，但得不到女学生们太大的圆满。\n\n反之，新加坡男只是说了一句“要看我还爱不爱她”，老实说他就讲了那一个“爱”字，女学生们听到这个字就感动得尖叫喝采起来。\n\
    \n所以，我就在《爱情阴谋论》中、说了一句话：“女人‘要’相信‘爱’可以是一切的理由。”我还在该书中的第九十二和九十三页模拟了一个夸张版的对话，说明了女人听到“爱”字就会疯掉，这模拟对话如下：\n\
    \n再讲得难听一点，如果这些女生问他：“你女朋友劈腿，你会怎样？”\n\n他可以说：“我会去吃牛排，然后剪指甲，接着不穿鞋的跟朋友一齐打保龄球。”\n\n\
    “蛤？为什么？？”\n\n“因为我太爱她了…”\n\n“啊~~~~!!!!”女学生们羡慕的尖叫…\n\n其中一名看了我们《好的好人》系列书之后而来上课的读者，他在看了《爱情阴谋论》后，就针对上面这些模拟对话，对他的妈妈做了一个试验。试验结果是让他目瞪口呆的。\n\
    \n他的母亲有时候会跟爸爸说：“老公，如果有其它男人追我，你会怎样？”\n\n我学生的老爸每次都回答：“我会祝福你们。”\n\n不用说，学生的母亲每一次听到老公的这个答案都不开心。\n\
    \n后来学生就再问母亲同样的假设性问题，他问：“老妈，如果你问了老爸：‘有其它的男人追我的话，你会怎样’而老爸就告诉你：‘我会继续的吃饭、睡觉跟往常一样 的上班，…因为我还是很爱你。’你会觉得怎样呢？”\n\
    \n他老妈的反应是他没想到的，她很认真、眼神中隐隐约约的泪光晃漾说：“我…会很感动！”\n\n当下我的学生心想：“这是什么道理？这是什么逻辑啊？说他会继续上班工作，就等于什么都没讲过。只是加多了一句‘因为我很爱你’你就傻掉了。喂！你已经不是一个小妹妹咧。”\n\
    \n所以说女人是一个很需要爱情的动物，而且从男人的角度来看，这学员母亲的答案根本是废话，但，女人则觉得很有“道理”。\n\n很多男女因为被刷文化的洗脑，认为情场上的这个游戏是讲道理和很公道的，付出多少就会得回多少。但，恰恰的情场是个很不公道的战场：善者未必有善报，恶也未必有恶报。\n\
    \n这本书不是教你如何在职场上行善，更不是教你要恶，爱情这个游戏不是单纯黑就是黑或白就是白，它跟人性……一样，拥有很大的灰色空间，它需要你时而行善，时而用恶，时而善恶并用。\n\
    \n你要明白，一些东西看时似善，其实是恶；也要明白，什么东西看时似恶，其实是善。\n\n---\n\n## 第一章 把妹无能启示录\n\n### 自然把妹高手——翻公道话\n\
    \n#### 一个家庭观念很重的男人\n\n我的一位学员叫做 K 的男人，他是一个将近六十岁、拥有部份葡萄牙籍血统的马来西亚人，已婚，育有二女，其中一个女儿在澳洲念书。他是一个卖健康食品的传销商，私底下曾经跟我说过：“What\
    \ a man wishes for is to live to the ripe old age so that he can give his grandfatherly\
    \ advice to his grandchildren.”\n\n意思是他人生中最期望的就是能够给予自己的子孙们“爷爷式”的忠告。他是一个家庭观念很重的男人，跟自己女儿的关系也很好，不过这个人生性风流。\n\
    \n他婚前风流，婚后也风流。\n\n#### 自然的把妹高手\n\n一个家庭观念这么重的人，同时又很风流，嘿嘿，合理吗？\n\n有时候我怀疑他加入传销业的原因是除了能够自由工作外，应该是这份事业给了他很多结识其它异性的机会。因为他能够出师有名的向女性们推销一些她们最关心的产品：美容、纤体、保健等等。\n\
    \n这位 K 男除了在印度尼西亚和泰国有女朋友以外（这些女朋友不是应召，是他传销工作上所认识的），也有一个日本航空公司的空中小姐的兼职女友，每次她飞到吉隆坡时，他们才幽会（对我们男人来讲，这叫做\
