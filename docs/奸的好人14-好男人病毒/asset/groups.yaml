    \n### 电影世界的半真半假\n\n男女的游戏在于拿捏“很在乎”和“不在乎”。一部好看的爱情电影是双方都摸不清对方的“在不在乎”，而且自己也不清楚自己“在不在乎”。这种双方都在“乱拳打人”的爱情策略，男女主角皆势均力敌，才让观众看得过瘾，才能成为故事的中枢。\n\
