    特别是一些香港男生要过来吉隆坡上我的追女班时，他们也很关心的问：“江老师，你的追女班技巧用在『港女』的话，会有效吗？”


    ## 香港女人很现实？


    香港人所谓的“港女”在选男友的话，一定要有钱有楼的（因为香港地贵），所以香港男士就说“港女”是最现实的。


    其实我不认为港女是最现实的，她们只是把自己的“理想”讲得最直接、喊得最大声。其它国家或文化的女生只是讲得比较圆滑、厚道或含蓄而已。


    江郎鬼才题外话：我认识不同国家的朋友，香港女平常的时候，敢都直接的讲出自己要什么，但真的正面交锋时，香港人反而变得很“间接”。


    换句话说，不管你是港女、台女、大陆女、马来女、坡女、鬼女或非洲女，你都是一样的。若你被问：“理想的情人是怎样的？”


    你一定会说：“感情专一，跟我在一起五十年后，晚上在床上一看到我的海葵春睡的样子，他还会兴致勃勃。要有钱，最好能够有钱到我什么都不需要做。最好他的家族生意是饮食业，公司旗下拥有法国、意大利、日本和泰国餐厅，同时也有家在黄金市区最贵的甜品店。能够带着我在意大利吃早餐，然后在米兰
    shopping，接着就到巴黎吃晚餐。外型要有姚明般高大威猛，样貌要有郭富城般俊俏，男根要有可乐罐般粗壮，而且舌头还可以如震荡器般每秒轮舔三百下…”


    理论上，你问任何女人她心目中的“理想”情人，她就不跟你讲她的“理想”嘛！没有女人会跟你讲：“哦，我理想中的情人是矮矮的、丑丑的、笨笨的。…哦，还有，还有，有一些地方，越短越小就越好。”


    就好像若你问男人同样一类的问题：“撇开人格和内涵的问题，假设这两个元素都已经拥有了，你理想中的情人是怎样的？”


    我相信没有一个男人会介意自己的下一个女友是漂亮一点、胸部大一点、皮肤光滑一点、叫床的声音再销魂一点。


    ## 什么叫做理性的爱情？


    什么时候女性会一定选一个身高样俏的男人？


    答案是：当所有追求她的男人都不特别，都无法激发她的幻想，都擦不出火花，她才会依最“理想”的选择：选外型或选经济能力。


    你想象一下有两个男人同时追求一个女生，其中一个貌似周星驰电影中的丑角“八两金”，另一个则貌似“郭富城”，但两个都是工厂的清洁工人，他们的家庭背景也不特别，两个人的
    IQ 和 education 水平都是一样的程度，两位都同样的跟女生在一齐时都没什么共同话题，更谈不上擦出什么火花。而且宿命先生跟她说未来三十年中不再有任何男生对她有兴趣，八两金和郭富城就是她唯一能够有机会成为她的男友的人。


    接下来我要问一个不公平的问题：“如果你是那位女的，你会选谁呢？”


    正常的女人当然会选郭富城。


    除了样貌以外，也不要以为有才艺、能讲出满口美国腔或英国腔的英语，就一定很有女人缘，我见过很多“真聪明”和“自认聪明”的男人，都不是追女高手。


    我也见过经济能力很稳固，甚至很富有的人在追求女生的这一个领域上完全失败。（当然，你若是穷光蛋，自己的三餐都成问题的话，我还是鼓励你就先把自己的饭碗搞好。）


    各位读者，我不是说有钱、有样貌、有地位没帮助，我在成为畅销书作家后，以前一个我追求失败的女生还会主动打电话来对我说：“没有想到你这么有文采。”


    所以，我不敢说这些东西没帮助，但，更难判断的一个事实是：怎样断定什么叫做有钱、有样貌和有地位？


    ## 怎样界定有钱、有样貌和有地位？


    我们先撇开所有其它“有钱”的定义，因为我喜欢用现金来算一个人有没有钱。你要在银行户口中拥有一百万？五百万？一千万？还是一亿才叫做“有钱”？


    什么才叫做有"地位"?名人？明星？政治人物？如果是艺人的话，上电视还是演电影才叫做“有地位”?就算是演电影，你是做主角还是做配角的？


    我和李俊杰老师在马来西亚是畅销书作家，也是目前（2010年）唯一能够立足港台的马来西亚作家，而且我们办的课程，每一个月都有台湾、香港和大陆的读者们专程飞到吉隆坡来上我们的各种课程，在马来西亚我们可算是“有地位”，但在国外的话，我们还不算大红，那么我们还算是“有地位”吗？


    所以，要断定什么叫做“没钱没地位”会容易过于是去断定什么叫做“有钱有地位”。


    江郎鬼才有话说：有没有钱和地位，都是从对比而判断出来的。


    换句话说，若我站在众多的刘德华、郭富城和 Brad Pitt 之中，我江郎鬼才就是丑，但如果我站在众多的“八两金”和“肥猫(郑则仕)”当中，我就是俊。


    一个拥有百万现金的人，他肯定不会觉得拥有少于百万的人有资格称“有钱”。他甚至会认为就算另一个人拥有三百万也没什么大不了，因为自己也只差那两百万而已。一个拥有一百万的人，可能就会觉得拥有一千万现金或以上的人，才能堪称“有钱”。


    大家可能心中就会有一个问题：“那么是否只要比心仪女生有钱得越多倍，你追得到她的机率就越高？”


    答案是：对和错。


    ## 有钱能吸引女人


    为什么我会说对呢？


    一位我曾经因为做电视节目的关系而有一面之缘的选美冠军小姐，在前些日子高调的与一位富家子弟交往，未来家翁还称赞她样貌与内涵兼具，是难得的好女生。听到这里、很多人可能就会说“你看，有钱就能有女人。”但，事实上其故事发展是我们完全想象不到的。


    我不知道是谁先起头行动的，事隔一年多后，家翁跟美姐竟然有一腿。整个事情我们可从两个可能性下手推测：一，可能是有人看多了日本某些“特种嗜好”的AV片吧；二，有人可以写一本《金龟阴谋论》来和我的《爱情阴谋论》抗衡。


    （嘿嘿，我不想写出其它的可能性，因为怕人说我观摩了太多“特种嗜好”AV片而猜测出来的。）


    我的一位朋友虽不是大富之家，但他的父亲因为是公务员（学校老师），所以在买房子的时候，政府有津贴，他只需要付非常非常低的利息。所以，就远在本《富爸爸穷爸爸》这本书还未面世前，他的父亲就已经不断的借钱买很多的房子，然后全数租给学生、外劳公司等等。但也由于他父亲经营有方，间接的影响到我朋友的生活。


    因为他交的女朋友中，有两个是在喝醉酒时，因为无故的讲出“唉~难道要等到你爸爸死去？”的这种话，搞得我这位朋友现在交女友的时候，都是草木皆兵。


    所以我才说有钱能够有女人，但我觉得要很成熟又很看得开的有钱人，才能够真正的享受到他得到的女人。


    那我为什么又说“有钱就能有女人”这句话也是错呢？


    ## 有钱不能吸引女人


    我认识的一位女艺人，她自己也承认自己是一个很爱钱的人，同时也很积极的赚钱。因为她名人的关系，追她的人不乏富商、有钱少爷之类的。不过，最近见到她的时候，她又好笑又无奈的告诉我：“我最近才．知道自己有多么的清高。”


    原来又有另一个富商追求她。


    她说：“他真的恨他妈的有钱，我到今天为止还不曾认识过可以有钱到像他这么夸张的人。”


    这富商在吉隆坡黄金闸区的市中心就拥有上百个旺店都是他的，又拥有兴旺的购物广场，而且还拥有上市公司。撇开他做生意的收入，单单只是租金的月收入就已经是个很恐怖的天文数字了。


    然后她说：“虽然我很爱钱，他也很喜欢我，简直无微不至的关怀我，把我当成公主般的呵护。但，……哎唷，不知为什么，我就是不能接受他。”


