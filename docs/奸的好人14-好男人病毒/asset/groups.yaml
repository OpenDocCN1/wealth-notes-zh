    \n我的一些女学生说：“自己每天不对老公发脾气，就好像不自在似的。”当男人越来越服从女人时，她的脾气反而会越来越大。\n\n这是我个人的界限：我不对人乱发脾气，很自然的，我就会要求对方不要对我乱发脾气。在男女关系里面，如果我的界限明确但女方是发脾气者，下场只有两个：就是分开，因为我不能接受；一，如果我们要继续的相处下去，她就必须要尊重我的界限。\n\
