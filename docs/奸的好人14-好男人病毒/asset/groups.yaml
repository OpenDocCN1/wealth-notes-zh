    同样的，“及时行乐”一文中，这以下的八字字眼全是未有明确定义的，概念性废话：做人、重要、知道自己要什么、人生、及时行乐、快乐、意思、追求。


    ### 财色双通的“及时行乐”


    所以，如果在讲这个“及时行乐”的废话前，我预先铺排了三个话题都是讲到某某人当机立断的做事业上的决定。最后得到机会来到时，顺利的搭上了这发达的顺风车，当我开始讲“及时行乐”的结论时，你会在脑中把这八个概念性废话的字眼都联结到事业、成功和赚钱上。在你头脑里而，你听到的将会变成是：“做人最重要是赚钱，人生所存到的钱可能一下子就用完，今天不知明日事，最重要的是趁年轻时能多赚点钱，不发达，活着又有什么意思？很多时候，商机一出现时，不要想太多，发达不能辨别人，一定要靠自己争取。”


    但，如果我预先铺排的三个话题都是讲一些朋友的两性关系的故事，而这些故事的主题都围绕着主角如何机缘巧合之下，终于找到爱情，但在找到爱情的时候，却惊愕的发现自己患了绝症。接下来我一讲同样的“及时行乐”结论时，这八个概念性废话的字眼又会联结到爱情上了。


    江郎鬼才有话说：“概念性废话”是催眠师、宗教家和政治家最常用用来影响人的武器，催眠师用来引导听众的思路，宗教家用来推销无形产品，政治家用来安抚和迷惑群众。


    概念性废话的其中一个功能就是把不实的变成实在的，把无形的变成有形。就好像佛教中的大乘经典的一句话：“色即是空，空即是色”般，概念性废话能够让人把虚无缥缈的错觉为具体的。


    “色”在佛教的意思是“事实”或现象，“空”就是不实的。同理的，爱情信徒会极端的认为爱情是完全真实的，而极端的科学家可能就会告诉你爱情只是头脑中的化学作用。


    特别是已经看过我上一本书《爱情阴谋论》的朋友，一定会记得爱情的“现象”和爱情的“解释”是有分别的。基本上我的看法就是：爱情不是“真”也不是“假”，它是一个很真实被解释出来的主观体验。


    在 NLP 的角度，我们称它为“概念性产物”，即被物质化后的概念，诸如：爱、自由、快乐、伤心等等皆是。


    注意，我不是说让人割了一个伤口的“痛”是概念性，而是指“伤心”。嘿嘿，我当然不排除有些特别的人会认为给人滴蜡鞭打是快感。所以，快感可以是“神经中枢性”（真实现象）的，也可以是“概念性”（主观解释）的。


    概念性产物就是把一个“过程”描述为“实物”。举例：很多人会说“拥有爱情的女人才是最美丽的”，或者“我失去了爱情”。


    当一个人说，我失去“爱情”，他简直是把爱情当成是一个如手机般的“实物”所以才能“丢了”爱情。当一个人说“拥有爱情的女人才是最幸福的”，他已经把爱情描述成如一个
    LV 袋般的“实物”。


    江郎鬼才有话说：其中一个检视自己有没有把概念性产物当成是实体产物，就是问自己：“能否把这个东西装进货车里面？”如果装不进的话，它就是被描述成“实物”的一个“过程”。


    把过程解释成实物后，会影响到我们对该解释产生执着。举例：吃东西本来就是填饱肚子的现象，当一个人把吃东西解释成“享受”，吃东西就变成一种执着。车子本来就只是交通工具，但，当一个人把拥有高级的交通工具解释为“享受”，名车就变成执着。


    或者我问间大家：一个认为嫖妓是为了泄欲的人，相较于一个把嫖妓解释成一种享受的人，哪一个会比较执着？


    甚至，当一个人把“吃东西”、“名车”和“玩女人”这三个领域都解释成“享受”，他执着的程度是会降低还是提高？


    呵呵，如果这个人享受了吃、车和女人，十年后，他回顾了过去，就会有这个解释：“人生就是享受，享受就是吃、车、女人。”


    换句话说，人生就等于吃、车、女人，或者更直接的就是“他”=“吃、车、女人”。他已经把自我的定义窄化，当然只要他开心、活得自在，窄化后的人生意义应该也不是问题。


    不过，当一个人对自己讲这种概念性的浪漫废话，为自己制造了一个活得不自在的执着，它就变成了一种包袱。


    ## “幸福”概念的真相


    在《极端自我就是王》中，我们写到有位女士问过李老师“成功的女人有没有幸福？”李老师直接说她浪费时间，我也认为讲这种话就等于讲着自欺的废话，通常是又不成功又不幸福的女人才会问这种问题。（后来我们听回来的消息是：她不是赚到钱，而且也跟老公安了婚，最近听说跟新男友在一齐）


    她是一个典型型被概念性废话洗脑的人，所以表面上虽是追求幸福，事实上它已经变成了包袱。“幸福”这个字眼不再是女性用词，因为女人追求“幸福”，男人也迫不得已的也开始被这两个字所洗脑。


    我办课程多年，见过不少的男士在喜欢上一个人的时候，会给自己一个很伟大的解释，例如他们会讲些“为了她的幸福、为了我们的幸福，我想把她追到手”之类的话。


    你会发现在平常的时候，男人跟男人聊天是很少用“幸福”这两个字，但一旦他决定要追求一个女生的时候，“幸福”这两个字会很机械式的常挂口中。


    各位男士，如果你挂在口中的有“幸福”之类的字眼，例如：“我要给她幸福、我要寻找我的人生幸福、我要为了我和她的幸福着想”，请问幸福这两个字是怎样被灌输到你的脑中的？


    很多男男女女都囫囵吞枣的相信了一些爱情信仰，女性希望自己能够得到幸福，男性则希望自己能够给予幸福，但你有没有思考过“幸福”这两个字在你的个人定义中，代表着什么？


    就算你自己“幸福”的定义已经厘清，你又怎知道对方的“幸福”也有清楚的定义？


    甚至在一大部分年轻女孩脑海中，“幸福”这两个字根木是浪漫废话。她的幸福概念根木尚未成形，你认为你真的能够给她幸福吗？


    男人若要吸引女生的话，你要先把自己定位为一个能让她心痒的男人，先不要想着什么“为自己幸福、为她的幸福着想”的废话。


    用“幸福”策略来追求女生，是男人被女人误导后的爱情信仰。被误导后的男人会开始很沉重的看待如何追求女人，而男男女女也开始自己骗自己，认为人生的幸福只是在于没有美好的爱情。


    李老师也提过一个很过瘾的观点：他说为什么离婚的人会被别人或自己标签为“婚姻失败者”？但在商场上被骗、被遗弃、亏本的人却不会被人家说：“你看！这家伙是一个生意失败者！”


    很多人把爱情或婚姻看成是“终生幸福”，这可能是小时候看太多童话故事的缘故，因为童话故事中男女主角的结局，往往是很公式化的 They live happily
    ever after (从此他们就过着快乐的生活)。


    然后在媒体上的电视节目、电影、小说等，多多少少的都会出现“终生幸福”这四个字。在潜移默化之下，人们就囫圪吞枣的相信了它，概念性废话又成功的俘虏了新一代的人。


    ## 如何把废话变成智慧？


    ### 为什么所有的人生道理都是废话？


    很多的人生道理都是相互矛盾的，一边有人跟你说“做人最重要大胆”；另一边又有人跟你说“处事最重要小心”，他妈的，到底你要我大胆还是要我小心？


    我也听过女生说：“我喜欢的男人是要体贴的，能顺着我的意思、而且男人嘛，他一定要有主见。”


    所以这就是为什么女人被火冠上“反复无常”之名，又要人家顺着你的意思，又要人家有主见，到底你要什么？


    甚至我听过一些女生说：“我觉得男人的魅力在于他的自信，有信心的男人会让人心动。不过，千万不要过份的自信，否则就变成人人讨厌的自大狂。


    我想说的是：“小姐，一边说要人家有信心，一边又叫人家不要太有信心。你不是在讲废话吗？”


    ### 自大和自侨都是假的


    各位，你们有没有见过身边的一些女性朋友会爱上一个被你圈子公认为超级臭屁自大狂的人？


    每个人都认为他的自信已经过了头、吹牛、夸大，就只有这位女生会觉得他有实力，就算现在他没有实力的话，只是机会还没到来而已，假以时日，只要他遇到了伯乐或进对了市场，必定一飞冲天。


    问题是：这个假以时日是何时何日？五年后？十年？二十年还是要等到五十年后才遇到伯乐？


    但，恰恰的饱的女人就是喜欢他，一点都不觉得他是自大狂。这是什么道理？或者如果你有在宗教界混过一段日子的话一定见过一些教主，被非信徒公认为


    自大肚、胡言乱语、妖书惑众，但他却被信徒公认为数千年以来最伟大的宗教家。


    举例：新兴宗教真佛宗的教主卢胜彦自称是佛王之王，韩国统一教的教主自称是耶稣再世，当年白莲教的创办人也跟耶稣称兄道弟，在局外人来看，这些人都是自大疯狂和妖言惑众，但在信徒眼中他们都是千真万确和宣扬真理。


    这又是什么道理？


    江郎鬼才有话说：很简单，你喜欢了-个人时，你就会把“自大”看成“自信”。你讨厌一个人的话，就会把“自信”看成“自大”。

    宗教和爱情一样，它们的前提条件是：“你有没有被吸引到？”（可参考《印象洗脑术》中所提到的“偶像”、“天堂”和“桥梁”的概念。）


    ### 废话换智慧的思考技术


    就好像你学习厨艺时，你妈跟你说：“这一道菜，它最重要的特色是它的咸味，所以一定要下多点盐，但不能下太多，变成太咸的话，就不好吃了。”


    你的心里面一定会有很多问题：“什么叫做“多盐”？什么叫做“太多盐”？如果我的菜肴份量增加的话，要怎样的去调盐份？或者若菜肴份量改变的话，我要怎样才能测试出“对”的盐量？”


    若有人跟你讲“做人最重要大胆”，为了把废话变成有实用价值，你就得探讨“做人什么时候要大胆？什么时候不能大胆？要怎样大胆？胆量又有多少种？”


    你明白了如何问这种问题，废话就能变成实际，矛盾的道理也有机会被你厘清。


    江郎鬼才有话说：大部分似是而非的人生道理都是模棱两可的，若你不把这些道理变得“细致化”，所谓的人生道理就永远是浪漫废话。


    同样的，“女人要男人细心关怀”这一句话，不是不对，但更重要的问题是：“这一句话在“什么”时候才对？”


    ### 关怀的时机


    台湾 NLP 大师 Hogan Lee 部落格中的女网友说“女人最喜欢男人记得她讲过的话”是可以成立的，“女人喜欢细心关怀她的男人”也可以成立，但是得要求女方已经对那男生产了好感后才行。


    这时你展示能够记得她所讲过的话，她做过什么，穿过怎样的衣服，化过什么妆，她就会很感动的觉得你很细心体贴。


    如果一个女生觉得“没感觉”的男人忽然间记得她很多的细节，在女方的立场是一件很恐怖的事情。


    其恐怖程度就好像一个刚认识的男性朋友，忽然间讲出他记得我江健勇所有的细节，包括我讲过的话，穿过的衣服，我喜欢吃什么和不喜欢吃什么，甚至还跟我说：“江老师，你小便的常态通常是双脚分开一尺，如果那天吃得较饱的话，你双脚会分开近两尺，但，不管怎样，你排尿停止后的一点五秒就会微微颤抖。”


    老实说，我从此会很怕这个人。


    （不过，如果章子怡跟我讲跟上面同样一句话，我却会受宠若惊，扭捏的跟她说：“喂！你不要这样看人家啦！不公平！不公平！现在轮到你蹲着…”）。


    江郎鬼才有话说：男人若要学追求女生的话，不能跟女人学，更不能以女人的爱情见地来做你的追求方针。


    Hogan 老师一看到这女生留书说喜欢男人记得她讲过的话，他也响应了一个思考性的问题：“喜欢记得自己讲过的话，是否只能适用于自己已经对他有好感的男人？”


    而我当时给予男主角的建议是打情骂俏，甚至，如果可以的话，带自己的一个女性朋友一齐到面包店，然后在服务生面前上演你跟女性朋友打情骂俏的戏码。


    （这个是利用了羊群心理和女人的妒嫉竞争感，当然事先要跟女性朋友彩排彩排。）


    这女生之后的其中一个响应是：“打情骂俏弄不好，会让女生觉得你很轻浮，有了女友了，还没说没有，不然就是看到女生漂亮一点，讲话就这么不老实。追女生还是老实点好。毕竟不熟之前，谁知道这个女生是用何种感官在看自己。有一点好感，用什么都有OK；没好感，还不如学101次求婚。”


    老实说，她讲“打情骂俏拿捏得不好，女生会觉得你很轻浮”，基本上这句话根本冇讲到什么重要信息，因为这句话就好像一个人跟你说“做运动对健康很重要，但如果过度运动，或错误的运动，反而会伤了身体。”听众会想“这是废话，谁不知道适量好，过量坏。”


    但，一个专家可能就会跟你说：“要增强心脏的运动的话，你每个星期起码要有三次的运动，每次运动是要让你的心跳加速到你年龄的心跳极限的百分之七十，然后再保持二十分钟那百分之七十的心跳。但，算心跳极限的方程式也有几派不同的算法…”


    如此，什么叫适量，什么叫过量，就一目了然了。

