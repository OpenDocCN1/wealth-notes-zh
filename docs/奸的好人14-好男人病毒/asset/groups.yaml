    例如，老板对员工说：“我看你平常做事都很聪明，你是公司里面少数有头脑的员工，是不是因为你有头脑，所以你认为可以不依公司的规矩做事？！是不是因为你聪明，所以你可以骑在老板的头？！”


    几个月后，我们又见门面，用着午餐时她就三分装有罪恶感、七分装可爱的不断的跟我说：“嘻嘻，哪里有男人会这么粗鲁对女生讲这种话。”


    吃完饭后，我们要离开时，我就对她做了一个我平时没跟她做过的举动——我好像要握手般的伸出我的右手。她也迟疑了少过半秒，然后也很机械式的伸出她的右手。


    我们两的右手按近要碰触到前，我就抽回了我的右手，看着她笑言：“哈哈，没想到你还这么老套，难道你真的要跟我握手吗？”


