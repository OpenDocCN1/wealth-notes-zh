    \n对方若是对很多人都乱发脾气的话，这是人格问题。但，若女方是在跟你相处后，才展现这种常乱发脾气的现象，特别是对他人都不乱来，唯有对你才发脾气，这百分之九十是你弄出来的。\n\
    \n> 江郎鬼才有话说：正常的男女关系里面，只有热恋期的时候能对伴侣千依百顺而不会有反效果。若你在追求期或成为伴侣后千依百顺，你越顺从对方，对方则越刁难你。\n\
    \n所以，当男女要进入一段感情前，请坦白的问问自己：“我个人的界限是什么？”\n\n本书将会教你在厘清自己的界限后，如何有效的跟女生划清界限，反而会得到她们的尊敬与青睐。好男人可能会觉得我所讲的这些好像是反其道而行，他们认为要无微不至的关怀女性，甚至无条件顺从自己的女友才会得到女性的接纳。但，同样的好男人也会很懊恼的说：“为什么每个女人都说要一个好男人，但当好男人真的出现时，她却却步的说出他没有感觉？女人到底要什么？”\n\
    \n要从理性角度了解女人，将是很痛苦的一件事情。\n\n### 女人的爱情观合不合道理？\n\n在上一本书《爱情阴谋论》中，有提到我和一位新加坡男性被一群女生问及会不会原谅已经劈了腿但又要求复合的女友。我是用心兼用脑的回答，我大概说：“很多男人都会觉得我们男人出轨是天公地道，女人出轨则是水性杨花，但我觉得要公平，不能有双重标准。我自己守规矩的话，就会要求自己的另一半也要守规矩。但如果连自己也不守规矩，又怎能要求人家守规矩呢？”\n\
    \n答案涉及范围包括人伦、公道、同理心、社会规范等等，但得不到女学生们太大的圆满。\n\n反之，新加坡男只是说了一句“要看我还爱不爱她”，老实说他就讲了那一个“爱”字，女学生们听到这个字就感动得尖叫喝采起来。\n\
    \n所以，我就在《爱情阴谋论》中、说了一句话：“女人‘要’相信‘爱’可以是一切的理由。”我还在该书中的第九十二和九十三页模拟了一个夸张版的对话，说明了女人听到“爱”字就会疯掉，这模拟对话如下：\n\
    \n再讲得难听一点，如果这些女生问他：“你女朋友劈腿，你会怎样？”\n\n他可以说：“我会去吃牛排，然后剪指甲，接着不穿鞋的跟朋友一齐打保龄球。”\n\n\
    “蛤？为什么？？”\n\n“因为我太爱她了…”\n\n“啊~~~~!!!!”女学生们羡慕的尖叫…\n\n其中一名看了我们《好的好人》系列书之后而来上课的读者，他在看了《爱情阴谋论》后，就针对上面这些模拟对话，对他的妈妈做了一个试验。试验结果是让他目瞪口呆的。\n\
    \n他的母亲有时候会跟爸爸说：“老公，如果有其它男人追我，你会怎样？”\n\n我学生的老爸每次都回答：“我会祝福你们。”\n\n不用说，学生的母亲每一次听到老公的这个答案都不开心。\n\
    \n后来学生就再问母亲同样的假设性问题，他问：“老妈，如果你问了老爸：‘有其它的男人追我的话，你会怎样’而老爸就告诉你：‘我会继续的吃饭、睡觉跟往常一样 的上班，…因为我还是很爱你。’你会觉得怎样呢？”\n\
    \n他老妈的反应是他没想到的，她很认真、眼神中隐隐约约的泪光晃漾说：“我…会很感动！”\n\n当下我的学生心想：“这是什么道理？这是什么逻辑啊？说他会继续上班工作，就等于什么都没讲过。只是加多了一句‘因为我很爱你’你就傻掉了。喂！你已经不是一个小妹妹咧。”\n\
    \n所以说女人是一个很需要爱情的动物，而且从男人的角度来看，这学员母亲的答案根本是废话，但，女人则觉得很有“道理”。\n\n很多男女因为被刷文化的洗脑，认为情场上的这个游戏是讲道理和很公道的，付出多少就会得回多少。但，恰恰的情场是个很不公道的战场：善者未必有善报，恶也未必有恶报。\n\
    \n这本书不是教你如何在职场上行善，更不是教你要恶，爱情这个游戏不是单纯黑就是黑或白就是白，它跟人性……一样，拥有很大的灰色空间，它需要你时而行善，时而用恶，时而善恶并用。\n\
    \n你要明白，一些东西看时似善，其实是恶；也要明白，什么东西看时似恶，其实是善。\n\n---\n\n## 第一章 把妹无能启示录\n\n### 自然把妹高手——翻公道话\n\
    \n#### 一个家庭观念很重的男人\n\n我的一位学员叫做 K 的男人，他是一个将近六十岁、拥有部份葡萄牙籍血统的马来西亚人，已婚，育有二女，其中一个女儿在澳洲念书。他是一个卖健康食品的传销商，私底下曾经跟我说过：“What\
    \ a man wishes for is to live to the ripe old age so that he can give his grandfatherly\
    \ advice to his grandchildren.”\n\n意思是他人生中最期望的就是能够给予自己的子孙们“爷爷式”的忠告。他是一个家庭观念很重的男人，跟自己女儿的关系也很好，不过这个人生性风流。\n\
    \n他婚前风流，婚后也风流。\n\n#### 自然的把妹高手\n\n一个家庭观念这么重的人，同时又很风流，嘿嘿，合理吗？\n\n有时候我怀疑他加入传销业的原因是除了能够自由工作外，应该是这份事业给了他很多结识其它异性的机会。因为他能够出师有名的向女性们推销一些她们最关心的产品：美容、纤体、保健等等。\n\
    \n这位 K 男除了在印度尼西亚和泰国有女朋友以外（这些女朋友不是应召，是他传销工作上所认识的），也有一个日本航空公司的空中小姐的兼职女友，每次她飞到吉隆坡时，他们才幽会（对我们男人来讲，这叫做\
    \ Perfect Arrangement……—完美的安排）。\n\n有时候他展示跟不同女性朋友互相性暗示的简讯给我看。有时候也展示还未见面的某某女性朋友，常常邮寄送给他的礼物，我称这种人为“自然把妹高手”。（注：这个人没有上过我的追女班，这种自然高手往往是人生经验的随机促成。他也没什么兴趣上追女班。但，这种自然高手往往是“不知道自己如何知道。”）\n\
    \n可能一些读者会说他是不是有如 Brad Pitt 般俊俏的样貌？他是不是很有钱？很有才华或很有头脑？\n\n都不是！别以为混血的人样子一定很好看，他的样子不难看，但也不是特别好看。若不认识他，你就会觉得他只是一个普通的中年人；他不穷，但也不是很有钱，只比小康再好一点。\n\
    \n那么你可能看到这里就会有一个想法：“如果不是有钱又不是样貌佳那这个人的口才是不是很精湛？”\n\n#### “深度”和“心痒”的沟通模式\n\n我见过不少口才很好的男人，在追求女生的时候同样能发挥他的口才，但就是偏偏没办法突破朋友关系。因为女人觉得你很有“深度”和女人觉得你让她“心痒”的沟通模式是不同的。\n\
    \n她的脑袋里面有两套不同的语书：一套是平常的时候用的，另一套语言是她追求浪漫时用的。\n\n女人的逻辑不是男人逻辑，男人的深度和女人的深度也不同，很多“真”聪明和“自认”聪明的男人，在面对面自己心仪的女人的时候，还是没办法把话谈到她的心窝中。我也是一个聪明的男人，所以也在这方面碰过不少的钉子。\n\
    \n那么K的口才如何呢？\n\n#### 把妹能手的口才\n\n跟他讲话的时候，你肯定不会觉得他有很强的分析能力，他对时事或政治的看法也只是…一般，你也肯定不会觉得他是个思想精密的人。\n\
    \n我见过K和女人的互动情形，不觉得他谈的话题是深入的。他的话题总是离不开吃喝玩乐，口沫横飞的讲得过瘾，但也不会有深入和精彩的描述。他的口才算是流畅，但也不是特别好。我教他“阴阳二分法”的时候，他如获至宝。（欲知何为阴阳二分法，可参阅《印象洗脑术》。）\n\
    \n反之，我的口才从中学思春期开始就已经非常好，但，到了二十六岁才第一次谈恋爱，之后追求不少的女生都是以失败收场。\n\n所以市场上所流传的“只要口才好，就能够很容易追到任何女生”，真的吗？\n"
