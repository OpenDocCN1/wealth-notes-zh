    江郎鬼才有话说：“概念性废话”是催眠师、宗教家和政治家最常用用来影响人的武器，催眠师用来引导听众的思路，宗教家用来推销无形产品，政治家用来安抚和迷惑群众。


    概念性废话的其中一个功能就是把不实的变成实在的，把无形的变成有形。就好像佛教中的大乘经典的一句话：“色即是空，空即是色”般，概念性废话能够让人把虚无缥缈的错觉为具体的。


    “色”在佛教的意思是“事实”或现象，“空”就是不实的。同理的，爱情信徒会极端的认为爱情是完全真实的，而极端的科学家可能就会告诉你爱情只是头脑中的化学作用。


    特别是已经看过我上一本书《爱情阴谋论》的朋友，一定会记得爱情的“现象”和爱情的“解释”是有分别的。基本上我的看法就是：爱情不是“真”也不是“假”，它是一个很真实被解释出来的主观体验。


    在 NLP 的角度，我们称它为“概念性产物”，即被物质化后的概念，诸如：爱、自由、快乐、伤心等等皆是。


    注意，我不是说让人割了一个伤口的“痛”是概念性，而是指“伤心”。嘿嘿，我当然不排除有些特别的人会认为给人滴蜡鞭打是快感。所以，快感可以是“神经中枢性”（真实现象）的，也可以是“概念性”（主观解释）的。


    概念性产物就是把一个“过程”描述为“实物”。举例：很多人会说“拥有爱情的女人才是最美丽的”，或者“我失去了爱情”。


