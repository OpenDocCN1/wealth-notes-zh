    \n老实说，很多男人都是采取这个策略，口头上说是做朋友，行为上则献上无限的关怀，但是他们不知道女人恰恰就是最讨厌这种男人。\n\n后续我将在本书内解释为什么女人会有这种负反应，而男人却会一再的犯这个同样的错。\n\
    \n### 为什么越顺从越麻烦？\n\n不少的男学员很想在自己女友身上出招，因为女方时常乱发脾气和闹情绪，每次一发脾气就会闹得他们头昏脑胀，因此，他们会常问我有什么招式可以用来控制女友。\n\
