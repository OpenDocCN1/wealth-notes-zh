    \ Hitch 般出现技术上的状况，而我本身当时也还不至于动真情，但当我的欲念被启动时，我的脑袋也出现状况。\n\n但 Hitch 的故事结局——“做回自己，赢得美人”就是虚构的噪音，它只是为了故事有个“浪漫喜剧”的结局而已。现实的情况中，大部分男人在动情后才出现状况的话，往往是不够够起死回生的，而且男人在出现状况后再“做回自己”更会被打入十八层地狱。\n\
    \n### 要守规矩还是破规矩？\n\n想象一下如果你正在擂台上打拳，一上擂台你就很惊讶的发现原来裁判有一双斗鸡眼，你的教练见状就马上跟主办单位投诉，但他们说今天这场比赛，所有的裁判都没办法出席，所以只能聘用这位斗鸡眼裁判。\n\
    \n你勉为其难的开始了拳赛，但中途的时候你发现当天的对手好像摸清了这位裁判的底子，因为他常在斗鸡眼裁判的盲点处，对你打出了一些犯规的拳法。而且这家伙还在他犯规后，弄了个斗鸡眼来讥笑你。\n\
    \n碍于裁判对这些特别角度的犯规好像视若无睹，请问，你还守不守规矩？\n\n你要执意的站在斗鸡眼裁判眼睛所看到的角度打拳？\n\n还是在特定的时候，也会闪过去在裁判盲点的\
