    他说他很矮，自己的身高只有一百六十公分，而且他已经二十多岁，不可能再长高了。他因为喜欢身材较好的女生，所以自己以前追过的都是比他高了两寸到六吋。


    说实在的，不少这方面的官方信息确实显示大部份的女性都喜欢较高的男人。甚至这位台湾男生所认识的女生和他所追求过的女生都亲口跟他说同样一个资讯——女人喜欢比自己高的男生。


    这位学员最关心的事情就是……


    他觉得自己的外型（即样貌和身型）都没有什么特别吸引女人的地方，就算上了追女班，学了这些技巧，他还有没有机会追到自己喜欢的那种身材较高的女生？


