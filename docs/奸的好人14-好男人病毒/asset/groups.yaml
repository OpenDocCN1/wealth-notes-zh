    他这篇留言还有下文的，留言后的两个多礼拜，他终于搞定了这位混血儿。而搞定的意思是：他们俩互相上了一节对方的人体生理课程，互相研究对方的呻吟声和呼吸急速的频率，同时也研究了双方的精液和分泌物的味道。


    大部分人看到这个学员的经验，会有两种想法：


    ### 一、这是不是巧合


    答案是：我不敢讲是，也不敢讲不上。追女班所教的技巧虽厉害，并不能确保你要追哪个女生，就能百分百让你得到那个女生。但，我可以确保我那一句“反高潮”的对白，却是百分百能够让女生大笑。我在夜店用这句‘反高潮”，还曾经使到女生马上非礼我的胸部，（上过追女班的学员会明白）这句话是绝对的经典。（欲知这句话怎么讲，可以参加我的追女班，详情浏览我的部落格
    http://hk.niyblog.yahoo.com/kongkeeyung/index?l=f&id=23）


    ### 二、这位学员用这个技巧追到这样的女生，但他能不能维持这段感情？


    答案是：我不知道，我也不认为有人能够知道任何一段感情能不能永续经营，因为我要问的问题是：就算你用最传统的方法追求到一位女生，不管你是用钱，用才华，抑或用你的关怀来成功得到一个女人的芳心，那是否能表示你们就能够永远在一起？


