    在他出关后，他兴致勃勃的告诉我他搭讪的成功，在关中他弄到女方嘻嘻哈哈的，电话号码也交换了。因为女生是新加坡人，她也叫我的朋友如果到新加坡玩的话，一定要联络她，她会充当导游。


    一个礼拜后朋友就南下新加坡了，南下之前他还打了个电话给正妹，她的反应很热情，又说要带他去吃什么地道的食物。不过他回来吉隆坡后却跟我报告了一个故事。


    ### 好男人的盲点


    他一到了新加坡后，就在电话上跟她再度确定约会的时间。基本上的发展是对方忘记了该约会，也没有打电话给我的朋友。她在第二天才打电话来道歉，说自己昨天工作太忙所以忘记了，而我的朋友马上很有风度、很彬彬有礼的跟她说“不要紧、没问题”。


    但他发现无条件的原谅了她后，再出来见面时，她比在马来西亚见我朋友的时候冷漠了好多倍。因为之前在马来西亚的时候，她是很热情的。但现在的整个过程就好像是在应酬我的朋友般，感觉非常的不好。


    我朋友不明白的地方是：为什么原谅了女方犯错，女方反而会对男的更不好？这就是最令好男人迷茫的：我原谅你就是对你好，但是为什么我对你好的时候，你反而对我不好？


    ### 宽容生懒惰


    特别是如果女生约会迟到得很厉害，好男人通常是宽容政策，他心中认为“哎呀，大家高兴就好了，我也不要太介意啦，她有出来的话，我已经开心得不得了。”他有办法骗到自己，认为他一点都不介意，对迟到很厉害的女生说一句“不要紧、没关系、有到好过没到”就放过这个迟到又不交待的女生。


    这是一个很危险的举动。


    因为正常的“人”，就会在你犯错后，会有所表示。但好男人因为把女人捧上了神台，女人犯错后他却完全没有表示。明明是女方不对，但只要男方无条件原谅女方的话，她一是觉得你没立场，再不然就会觉得是你的行为“不对称”。


    而且她头脑里面会认为你这个不对称其实就是想“得到一些东西”，意思就是“你想搞她”。你认为这种超随和的男人（即一个“肯为了性欲而放下尊严”的男人），他在女人眼中是被尊重还是被鄙视的？


    一个最好的测试自己界限的方法是你反问自己：“如果是一个普通朋友这么迟到，我会不会觉得有问题？”


    好男人常有双重标准，即普通朋友如此迟到又不打电话通知我，我会觉得有问题。但女生这样来对我，我是没问题的，甚至如果是美女这样来对我，是更加的没问题。


    很多好男人得不到女人的青睐，是因为好男人在女人面前表现得永远不骂女人，他们太注重自己的男人风度。这种好男人把女人捧上了神台，使她变成“上帝”，而女人所做的一切，不管多无理，都要无条件接受。


    另一种好男人在刚开始的时候也是永不得罪女人的，但一旦女人没有给到他他要的反应，他就会开始埋怨和怨恨。换句话说，他很虔诚的拜神，但在千祈万祷后还拜不到自己所求，他就开始咒骂神了。


    其实女方在没交待而迟到或不到时（没交待是很没有礼貌的行为），男人虽不需大发雷霆，但也不需要忍气吞声。你可以借这个机会来告诉她你的个人界限是什么，很平稳的对她说：“我是个尊重朋友时间的人，虽然我不是从不迟到，但如果是我到或不能到的话，我一定会预先通知对方，以后如果你不能来，你可以事先的通知我。”


    我不能担保你如此说就会让女方马上对你有好感或爱上你，但你将起码得到她的尊敬。甚至有时候直接的骂她，反而会得到她的青睐。


    ### 如何借女方的道歉赚取更多的好感？


    ### 我也遇过的约会障碍


    在我还是好男人的时候，我曾经对一个女生有兴趣，那时候虽然交换了电话号码，但我对于如何擦出火花的方法还未完全掌握，所以每次在电话上约她出来的时候，往往她都有借口。其中一次的借口还让我蛮生气的。（注：你是好男人，才会有这种气。）


    我在简讯中约她，她就回复说她正在从一个很远的地方回家，很疲倦了，所以不能来。我就回复她说：“你回到家后我再给你个电话。”


    大约半小时后，她回复我说她的一个朋友要来找她，所以她现在要出去见朋友了。


    当时我是蛮生气的，因为你先说疲倦而推掉了我的邀约，现在却又说要出去见朋友，只觉得自已被当傻瓜。我当时没马上回复她，因为我在盘算着明天我要怎样兴师问罪。（记得，女生不出来约会，男人兴师问罪是一种好男人病毒行为。）


    ### 欲问罪者被定罪


    第二天，我打算把我的感觉告诉她，我打电话跟她说：“我约过了你好几次，但每一次你都是在最后的时候，就说没办法出来。昨天你说你疲倦所以不想出来喝茶，但转个身，你又说要出去见朋友…”


    各位男士千万不要学我讲上面这种话，这是不成熟的话，而且你还会用上了“心理强化法则”来更加的巩固她这些行为。就算一个人是用着借口来推掉你，不管对方是有意还是无意，你—把它直接讲出来的话，你就会强迫她给自己的行为一个合理化的解释，甚至还可能挑起对方骂架的情绪。


    她答：“我觉得你好像不断的在分析我，好像要看穿我般。我在工作上已经很多人要看穿我，现在你又要看穿我，我觉得有很大的压力…”


    她把一大堆理由讲了出来，基本上是 把罪名都丢在我的身上。


    江郎鬼才有话说：确实的我不能怪她，我当时身为一个好男人，最自豪的就是自己的分析能力。当年的我虽然没有每天传简讯，但我基本上会每隔两天保持联络，然后再尝试约她出来。其中一个我做得不足的地方就是没有擦出足够的火花，当年的我还不至于是“瘟疫”，但可以说是“苍蝇”。


    我确实有罪，但不是她所丢给我的罪名，她丢给我的罪名只是她的合理解释。


    ### 太极罪恶拳


    我当时听了她的指控后，心里当然很不爽，我很坚定的告诉她：“我不知道你交朋友的方式是怎样的，不错。我是对你有兴趣，但我还不至于会要追求你，因为我根本都还不认识你。所以我才想约你出来喝茶，来认识你。如果你交朋友的方式


    是一定要怀疑人家背后是有什么企图的，或者你是觉得我对你有企图，那么，不好意思，我答应你，我以后不会再联络你。”


    对方还来不及响应，我一讲完就马上挂电话。从策略的角度来看上面这段话，我只是尝试耍耍太极，把罪恶感丢回给她。不过，我当时确实是认定了不再联络她。


    三天后，我在计算机工作着的时候，我的电话响起来了，是她的来电。


    ### 罪恶感的拉锯战


    我心里面兴奋的要命，还未接电话前我还说：“Shit！难道真的有效了？”


    我尽量保持冷静的接电话，电话中她整个语气都变了，她使用了一个很弱的声音说：“Sorry啊，江。”


    我一听到她说 sorry 时，心里面就已经窃笑了，同时我整个人就软化了下来。从她这么弱的语气，我可以想象到她那三天跟罪恶感搏斗的思路。


    我问她：“Sorry 什么？”


    “…如果是我有 hurt 到你，伤害到你，我跟你说过不起。”


    我心里叫出了 YES! 她跟我道歉，可以说是个好现象，但是我的好男人毒素还未清除，所以很大方、很快、很紧张又很关心的说：“哦，不用对不起，你没错，你没有伤害到我，我没问题的…”


    我不知道你有没有试过讲了一些话，你好像可以看到那些话从你口中飞奔而出，然后你很希望能够把那些话收回来？


    我当时一讲了那句话后，就知道自己讲错话了。


    ### 太快原谅的后果


    因为我被胜利冲昏了头脑，在我很快的无条件原谅她后，她好像进入能量最低点，因为她不知道如何响应我。她只是在电话的另一边“呃…一呃…”的。


    当时我还傻傻以为可以连消带打，我问她：“那么我们要不要出来喝茶交个朋友？”


    > 江郎鬼才问问题：上面这一句话犯了两个错，是哪两个错呢？

    > 提示：思考“要不要”和“还”这两个字。


    她好像还在能量最低点，她说：“我还没准备好。”


    本来我很想问“赫？准备什么？"但，我想了想，就算了。只是跟她说了“没问题”后，就挂上电话。


    我觉得她还很迷茫的想着：“赫？，我伤害了你，你怎么还无条件接受我？”


    ### 好人和坏人如何接受无条件的道歉？


    我可以很肯定的告诉大家，如果对方是个“坏人”，他伤害了你，然后跟你道歉，你马上无条件接受他的道歉的话，你是在姑息养奸。坏人会把你这个弱点记录在案，他知道以后要利用人的时候，你会是他的第一人选。


    但是，如果伤害你的人是“好人”，然后他有歉意而向你道歉，你也是马上毫无条件的接受“好人”的道歉，对方反而会开始回避你。


    他回避你的原因有两个：


    - 一，他觉得自己真的伤了人，所以不值得接受如此无条件的原谅，所以不想“睹物思情”才回避你。

    - 第二，对方会对你的无条件原谅感到很奇怪，他会想：“蛤？我之前不是得罪了你吗？怎么你连生气的反应都没有，我到底是否真的得罪了你？”


    因为你之前的举动让他觉得他有“做错”，他现在见你马上接受他的道歉，他会怀疑你之前的举动是否在“做戏”。


    > 江郎鬼才有话说：我当时不是为了做戏，我要“太极拳”把罪恶感推回给她不是我预设好的对白，纯粹是把自己的感想说出。不过，我那马上无条件接受人家道歉的行为确实是会让人觉得我不是个老实人（甚至她可能会当我是伪君子），但我的动机是什么都不重要，对方觉得我不老实，我就不是一个老实人了。


    所以，沟通的意义不在动机，而在对方的反应。


    ### 怎样回应人家的道歉？


    你可能很想知道如果遇到好像上面这个例子的道歉，身为一个男子汉，应该怎样回应呢？


    马上接受她的道歉的下场就是——死。不接受她的道歉，又好像是个不够大量的男人。哭哭啼啼的说自己真的受了伤，又好像小孩子般不成熟。


    虽然我现在讲的都是马后炮，但当女方跟我说“假如我伤了你，我跟你道歉”，比较正确的答法是很稳定的跟她说：“你没有伤害到我... 但，并不代表你没有错。”


    然后静下来，让她继续的道歉和解释自己的行为，目的是要让她开口自我暴露自己的罪行。一旦她一接受自己犯错，这时你就要惩罚她。


    惩罚的意思不是把她绑起来鞭打（虽然看多了日本特种 AV 片的人会想鞭打她），而是让她为你付出。


    ### 以 “假障碍” 来制造欲求


    但惩罚是要有策略的，只是纯粹的跟她讲：“如果你真的有诚意要道歉就请我吃饭。”对方可能妥协，也可能继续的再推，因为她觉得你多多少少有点像——趁火打劫。


    正确的做法是先称赞她说：“我想说你算是一个负责任的人，现在很少女生有这种气量和责任感，起码你口头上肯道歉。”


    上面这段话术是心理强化术，旨在强化她认罪的印象。我们强化她的这个形象的目的，为的就是要铺排让对方肯为道歉而付出。记得，讲到“起码你口头上肯道歉”就要停下来，目的是要让她回应，向你证明她是真心道歉。


    为什么一定要她口头上说些话来证明她的诚意呢？


    很简单，她亲口说过一些话来自封一个“有诚意”的形象，她就开始会自己说服自己。


    你可能会问：“她真的听到这段话就会如你所说般，一定会开始向我们证明吗？”


    一定会，因为上面的这三句话是有玄机的，当你说“我想说你算是一个负责任的人，现在很少女生有这种气量和责任感”时，你是做赞许她，但赞许后的那句话就是玄机，“起码你口头上肯道歉”，是暗喻她做得对，但只差那一点点，就会做得完美，这就是先前所讲的“美中不足”法则。


    你接着说：“我知道妳没有伤害到我，但…（欲言又止的吞一口气）…没关系…”


    在此处，对方一定会被勾魂，她会进入能量最低点而很好奇的问：“什么？”


    你这时就说：“其实有些东西我想讲，不过我觉得讲给你听也未必有用…”


    这一招是使用了《心魔行销》一书里面所讲的“假障碍”，它会使正常的人在此处追问你说：“你不讲，又怎知道有没有用呢？”


    其实只要她一追问，就已经中了一半的招了。


    这时你就坦然说：“其实我不想接受你的道歉，但我想接受你约我出去。…别怕，我不会拒绝你的。”


    如果对方笑出来的话，你就开玩笑说：“就是嘛，人家都已经约了你太多次了。除此外，你还要买玫瑰、汽球送给我…...”


    上面的这些是贡献给那些讲错话而被好女人误会的好男人，但是我还是要告诉各位“好男人”一个男子汉是“敢”得罪女人的。


    > 江郎鬼才有话说：好男人“怕”得罪女人，坏男人“常”得罪女人，男子汉“敢”得罪女人。


    好男人觉得常常需要人家的认同，特别是需要女生的认同，更需要美女的认同。认为只要美女一认同他的话，他就站在世界的顶峰了。


    男人一定要记得，样貌漂亮是不够的。一旦你知道你是“要”女人的认同，而不是“需要”认同，你就会“敢”得罪女人。


    敢得罪女人的男人才是真男人。


    ### 江郎鬼才骂女人的三重转


    ### 我被当成后备约会男


    我记得以前在追着一个很漂亮的女生时，因为我和她都很忙，所以很辛苦的才找到大家有空的时间出来见面。在吃了个不到一小时的晚餐后，我就建议我们去喝些东西，她却跟我说：“哦，不能，我等一下还要见另外一个人。”


    我听了后有点纳闷，因为这是她第二次找我来充塞她的时间，我只是她用来打发她下一个约会前的空档。她第一次拿我来塞时间，我还会觉得她可能是无意的，但如果连续的发生第二次，我就觉得这是故意了。


    她见我的反应，就开始扮可爱、讲搞笑的来过关。


    之后我送她到她的车子的时候，我就很冷静的跟她说：“我很少见到你，所以想花多点时间跟你在一齐…如果以后你跟朋友有约而只是叫我来填饱肚子，你不需要找我，我相信很多男人都肯陪你吃饭。”


    她还是以装可爱讲笑的方式过关，我听她讲话时，已经很想摇头了。


    ### 儿童不宜的留言


    我进入了我的车子后，拔了个电话给她，问她：“你有没有什么东西要跟我讲？”


    她开始火大，说我这ㄍ男人怎么这么不大方，然后就挂了她的电话。我再拨一次，她不接。我想了想，终于想到要跟她讲些什么话。我这些话要分成两个部分来讲。


    大约半小时后，我再拨个电话给她，她还是不接，而我就是预计了她是不接电话的。话我才能讲我要讲的话。


    来电不接的一定会转到电话的 Voice Mail，当我听到“哔”一声后，我就开始我的电话留言。我有点气的说出第一部分的话：“刚才我听到你所讲的那些话，我很生气，我已经想了很多很臭的话来骂你……”


    在这里我停顿了一下，做一个深呼吸，然后换了一个稍微平静的声调说第二部分：“……不过，现在半个小时后…我已经平静下来了，我只想跟你讲两个字——法克幽！(F**k
    you!) ”


    然后就断线。


    ### 怎样骂女人才能量到她永远记得你？骂人三重转


    我可以告诉大家，她永远记得这句话。


    这一话术印象之强，在于第一部分的铺排是先让对方觉得我很生气，然后第二部分以较平和的语气来讲，先一紧，后一松。


    紧是因为她觉得我即将好像要破口大骂，咦，然后语气一松就让她觉得我好像不骂了、她可以过关了，岂知道一松之后的转折点竟然是一个又干净利落、又重点式强调的粗口。这最后的粗口就变成了整段话的结论，这就叫做——“有印象”。


    > 鬼才超级骂人法：先让对方觉得你在真诚的称赞他的优点，然后把这优点骂成是他犯错的罪源，这就是天堂地狱的骂人法。


    例如，老板对员工说：“我看你平常做事都很聪明，你是公司里面少数有头脑的员工，是不是因为你有头脑，所以你认为可以不依公司的规矩做事？！是不是因为你聪明，所以你可以骑在老板的头？！”


    几个月后，我们又见门面，用着午餐时她就三分装有罪恶感、七分装可爱的不断的跟我说：“嘻嘻，哪里有男人会这么粗鲁对女生讲这种话。”


