    这个“爱”的感觉一出来的时候，头脑更不清醒，不清醒之下，更会随之作出更多的机械化笨蛋行为。


    我以前也犯过这种笨蛋错误，但我要告诉大家：“其实笨不要紧，最重要的是知道自己笨。”


    我相信不少读者也犯过这种“不清醒的笨蛋行为”，特别是我们在面对到自己喜欢女生时，还会一错再错。


    记得，犯错并不可耻，最重要的是知道自己犯了错。知错不改也不是可耻，而是可惜。不知道自己犯了错的人本应可怜，却往往都是“可恨”的，因为人就可能要一生继续的错下去，持续的伤害自己和骚扰他人。


    知道了自己的错，是可喜的，因为现在你可以死得瞑目。知道了自己的错而想改过的话，是可贺的，因为下一章开始我会跟你分享“好男人病毒”解脱之道。


    # 第五章 好男人病毒的解药


    # 好男人向女人证明自己，坏男人则使女人向他证明


    ## 好男人通病：急于向女人证明


    好男人因为觉得需要得到女人的认同，所以很多时行为上都是向女人证明这个、证明那个的。为什么他要关怀女生？他希望能向女生证明他的诚意。


    在本书前端“很有创意的拒男系统”中提到一位台湾的学员刚开始的时候因为以无辜行为来邀约女生，结果邀约回避了他，他也逼不得已的放下她了。后来他看了我们《奸的好人系列书》时，已经是放下半年后的事。他接下来以悟性明白了自己过去追女成功和失败的关键分别，然后重新追求成功。


    话说有一天他和女友在看着台湾的综艺速配节目，节目中的一名人气最旺的女生在描述自己的择偶条件时，说出了她讨厌性格不成熟的男生，同时要求自己的未来伴侣是有经济基础的人。接下来节目中参加速配的一位男生就不断的说自己是如何的成熟，还说自己虽然未有雄厚的经济基础，但他正在很努力的赚钱。


    我这位台湾的男学员一听这电视上的男生如此说，他忍不住的破口大笑，因为他明白男生越向这位人气女生证明自己，他的价值反而就会越来越低。当时台湾学员的女友问他到底在笑什么，他就说没什么，也没跟女友解释电视上的这位男生其实正在削小着自己的睾丸，而且越削越小。


    但，一个有价值的男人，他就有办法让女人向他证明。


    ## 借李老师的口来拍马屁


    在好几年前，某个电台定时的每个星期邀请我上节目成为嘉宾，女主持人是个气质型女生，她有一双大大的眼睛和一把清脆的声调，我和她在空气中的互动非常有火花，而且有时候她还会在节目中以她的声音来做角色扮演。


    在我上了她的节目几次后，李民杰老师在听了节目后，他说我的声调在电台上的时候有了一个特色。我听到了李老师给我的回馈后，我就想到了下一次做节目时，我一定要跟这电台的主持人分享李老师的见解。


    一般的电台节目一定会有广告时间，这时主持人和嘉宾就会在空气中暂停互动。就在这个短暂的休息时间，我就跟她闲聊。我说：“我最近跟我的伙伴谈起我们这个项目，他告诉了我一些关于我的事情是我完全不知道的…”(如果大家有看我们的《勾魂夺心洗脑催眠》和《心魔行销》，就会明白为什么这一句话一定会引起听众的反应。)


    大眼 DJ 就好奇地问：“你们谈了些什么呢？”


    我说：“我的朋友说你的声音很清脆，同时你很会做角色扮演。他说我的声调有男人的深沉的磁性，但同一时候又稍微的带了一点母性的温柔。”


    “哗，你的朋友的耳朵很厉害咧！”


    “对啊！他是一个很听觉型的人，所以对声音的分辨能力很强。他还说我和你在做节目时，做得很有火花、很有默契。”


    “不是每个嘉宾都能跟我有默契，一些嘉宾没什么话讲，一些讲很多话却没重点。”


    “不过，他就说我们在节目上的互动有火花，但是如果出来喝茶的话，他怀疑我们还会有火花。”


    我讲到这里就停了下来，她也只是应酬式的响应我，因为时间就到了，我们的节目就要继续了。


    # “美中不足”的推动力


    注意，我上面这段话是个以“假障碍，来引导对于过关的方法。我先借李老师的口来称赞她，说她和我在节目是很有火花，然后就抛出了一个“障碍”。


    结果，在节目结束后，我正在收拾自己的东西时，大眼 DJ 就在我临走前说：“喂，有时间的话，我们出来喝喝茶，聊聊天吧。”


