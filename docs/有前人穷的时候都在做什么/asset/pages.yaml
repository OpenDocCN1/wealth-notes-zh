- pgno: 194
  md: '我的朋友桑妮刚到保险经纪公司任职时，认识了工作能力很强的保险业务员格雷先生。他的签约件数经常是第一，还是位帅哥，深得客户信赖，也是同事眼里的英雄人物。我与格雷只见过几次的。


    格雷非常照顾刚进入这一行的桑妮。他告诉她：“有任何不懂的地方，可以问我。”还说，“我觉得这个数据值得参考，你最好看一下。”他经常使用电子邮件传送数据给桑妮，在工作上给她很多帮助。


    女同事们只要一谈起格雷，就会眉开眼笑地说：“格雷能力好，人又体贴，真是完美男人！”桑妮好像也对格雷颇有好感。


    可是，有一天一件丑事发生了。格雷和往常一样，打算发送数据给桑妮参考，寄出的数据文件竟然是全裸的性感美眉的视频文件。


    “因为电脑桌面的文件太多了，才会搞错寄了裸女视频文件给你。”虽然格雷作了这样的辩解，但为时已晚。这是何等失态的事啊！不用说，桑妮对于格雷的美好印象，就在瞬间破灭了。


    记得当时我一边回想着格雷的电脑桌面，一边语带同情地对桑妮说：“他的电脑桌面确实塞满资料。”


    后来大家好像都在抨击格雷，没多久他就被调到地方的分公司。根据不可靠消息，公司是以“错将客户个人资料外泄”的理由，对他下达了调职命令。'
