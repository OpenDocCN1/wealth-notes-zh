    # ## 对鸡蛋估值


    很多有钱人都投资股票，也通过股票赚了钱。很多普通人也买股票，却不知道买股票的第一步是评估股票的价值。为了更形象地阐述这个复杂的问题，下面我以对鸡蛋估值为例来说明。


    比如，你从 A 超市花了 10 美分买回一个鸡蛋，而 B 超市同样鸡蛋的零售价格为每个 12 美分，那么，这个鸡蛋到底应该值多少钱？


    有人说，鸡蛋的价值就应该等于它的价格，既然是花费 10 美分买来的，那它的价值就应该是 10 美分。


    这种估值法被称为“市价法”，也就是价值等于市场价格。但是，这种估值法无法回答这样的问题，即同样是这种鸡蛋，A 超市的价格是 10 美分，B 超市价格是 12
    美分，或许农场主售出的价格是 8 美分。那么，鸡蛋的价值到底应该等于哪个价格？'
  merge: -1
  img_proc: true
- pgno: 132
  md: '还有，如果鸡蛋被打碎了，打碎的鸡蛋没有什么价值了。即便有用，也就只能当狗粮了，这点狗粮最多只值 1 美分。那么，这个烂鸡蛋的价值最多就是 1 美分了。


    这是按清算价值来估值的一种估值法，当资产被清算时，已基本丧失本身价值，所谓“清算价值”，和半卖半送一样，恐怕比残值多不了多少，清算价值是所有估值方法中所给价值最低的。


    也有人说，这个鸡蛋的价值应该等于在 B 超市重新购置所花费的钱，现在花费 12 美分才能买到这个鸡蛋，所以它的价值应该就是 12 美分。这种估值法叫“重置成本法”，也就是认为资产的价值等于它的重置价值。


    那么，到底股票是个什么东西呢？股票的价格为什么会有涨跌？读了下面这个巧克力工厂变股票的故事你就明白了。


    威廉有一个宏大的梦想，那就是做出不会融化的冰激凌、不会失去味道的口香糖和连魔鬼都会为之出卖灵魂的香甜的巧克力。


    但威廉却没有足够的钱用于扩大生产。要实现这个目标，他还需要购置一座大厂房，雇用更多的小侏儒工人，购买可以更快生产巧克力的机器。


    于是，威廉找人与纽约证券交易所接洽。实际上，在他自己都还是浑然不觉的情况下，就已经有人开始投资于他的巧克力工厂了。这些人购买工厂的一部分生意，其实就是“股份”或者“股票”。尽管威廉已经不再是工厂的唯一老板，'
