  md: '如果你只切到金字塔的尖上一点，是很难赚钱的。所以如果想赚大钱呢，要尽量向量大的市场进军。


    第二个原因是市场不够大。比尔·盖茨的软件行销全世界，几十亿人口，跟他比起来，即使其他人跟他智慧一样，能力一样，但他的市场过大他们，后者赚的钱还是会比他少。


    # 借一个支点撬起地球


    大多数人工作很努力，希望借此获得财务自由或赚更多钱。但他们并未深入研究商业策略，原因在于他们认为自已擅长经营活动，并沉溺其中。他们认为，不一定要对商业策略感兴趣，才能把生意做好。很多人即使成了经营者，也不愿意考虑如何将企业的利润、业绩、固定资产最大化，这也意味着他们会不停地做无用功。


    实际上，你已经把所有精力都投入到经营上去了。你没日没夜地工作，许多经营者也跟你一样努力，但却回报甚微。其实你不需要这么辛苦，只要转变一下思维方式就可以了。我提倡的新观念，就是要利用他人的帮助和投资将你的业务最优化。邀请他人参与经营，是让利润和固定资产价值最大化、使你获得快乐和自由的最快方法。你工作已经够努力了，为什么不能从别人的投资中获得最大回报呢？


    我可以保证的一点是：单凭一己之力，绝对无法获得最优结果。听起来是陈词滥调，但没有谁是在孤岛上生活，接受这一现实不仅是自救的关键，也是新时代哲学的核心内容。而且，它还是你获得利润的关键。如果你是负责制定策略的人，也跟进了所有流程的执行，你很可能已经意识到自己无法独自完成所有的事情。'
