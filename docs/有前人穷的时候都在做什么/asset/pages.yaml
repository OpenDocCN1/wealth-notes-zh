- pgno: 50
  md: '国宾夕法尼亚铁路西部管理局局长汤姆·斯考特先生工作，还是从事股票生意、管理钢铁企业，他都展现了正直的品行。可以说正直是卡内基获得巨大财富和建立钢铁王国的支撑力量。


    安德鲁·卡内基出生于苏格兰，外祖父是一位性格开朗、机智幽默，又具有不屈不挠精神的人。卡内基以外祖父的名字命名，从小也以有这样的外祖父为荣。


    他的外祖父是天生的雄辩家，也是一位富有才智的政治家，更是当地颇为活跃的政治领袖。从事纺织行业的父亲虽然生活捉襟见肘，但为人非常正直。少年时，卡内基常跟随鲸居的叔叔到处参观古迹。在接触英国历史的过程中，他对骑士华莱士揭竿起义的故事非常着迷，同时被其正直守信的品性深深打动。童年的教育和濡养养成了卡内基诚实正直的品质。


    移民美国后，14岁的卡内基进入电报公司，虽然他当时对于线路一点都不熟悉，但却向公司许下诺言，说自己一星期就可以熟记全城的线路。公司经理被卡内基的毅力感动，留下了他。卡内基果然实现了自己的诺言，很快成为公司的熟练工。工作一年后，由于表现优异，他被提拔为管理信差的监督者。


    当时，美国的电报公司是很吃香的行业：每个城市都分区投递，如果投递的电报超过责任区，可向主人收取一毛钱的小费。电报童常为这一毛钱的外快争抢这份差事，有时还'
