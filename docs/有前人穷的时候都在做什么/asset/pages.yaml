  md: '摩服务。只要经营好现有财产，接下来的40年他们都能继续享受下去。


    他们之所以能有今天，源自多弗早年对负债的极端厌恶。


    多弗对负债憎恨无比。大多数人可能会觉得这太偏执，但对他来说，欠钱就像是在和魔鬼做交易。只要提起负债，多弗总会想到那些最糟糕的画面，他会不由自主地担心，一旦失业而无法还贷时会发生什么。


    现实生活中，也许大多数人并没有像多弗那样痛恨负债，反而在不知不觉中积累了不少欠款。通常而言，信用卡购物和兑现、汽车和住宅的按揭等，在还清以前，都属于“欠款”这一类别中。把信用卡还款和住宅按揭换成“欠款”这个词后，给人的感觉立即变得沉重了。但是，这正是卡账和住宅按揭的真面目。也就是说，它们都是隐藏在你家庭经济中的欠款。包含信用卡消费的“欠款”，不但能提醒你注意日常生活中的小额支出，也是家庭经济崩溃危险度的重要指标。


    虽然这么说可能有些严重，但意志薄弱和无计划的借款（透支刷卡也一样）不会有任何好处。为了立即得到眼前自己想要的东西，要付出支付利息的代价。如果放纵自己，便会因不断积累的使用额而使每月的还款金额增多，最终被其夺走大部分收入。


    有人把每月还信用卡欠款当成理所当然的事。但它和总是在某处欠账是一样的。请不要被信用卡公司打造的假象牵着鼻子走。


