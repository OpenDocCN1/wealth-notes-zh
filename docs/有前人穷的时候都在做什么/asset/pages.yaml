  md: '# 第 6 章 创业

    人生4象限，一开始就站进“富象限”里


    可能认为自己用的已经是最佳方法了，但我向你保证，绝对不是。经营者们通常难以接受这条真理，那些在传统经营理念影响下成长起来的经营者尤其觉得难以接受。


    过去，单枪匹马、勤勤恳恳的创业者形象让人肃然起敬，而依靠他人的人则显得软弱无力。但是，最好不要把合作视为“依赖”，而要把它视为一种杠杆作用。


    著名高管教练罗伯特·哈葛洛夫曾说过，21 世纪伟大企业家的最大特征，是他们创造性地与他人合作的能力。随着社会经济、基础设施和技术的发展，一个人或一家企业再也不可能掌握打败竞争对手、满足客户日益增长需求的所有必要技能了。相关研究显示，在当今快节奏的世界里，人类的知识总量每半年翻一倍。你怎么能指望依靠个人力量掌握这么多必要的知识？寻求合作并不意味着你在哪个方面有欠缺，只是意味着你在有效地整合知识、技能和关系。


    把各部分结合在一起，你就打造了一个无与伦比的体系。单打独斗永远没有借助外部力量的效率高，因此，优化公司业务的第一步就是引入“利用他人资源”的概念。


