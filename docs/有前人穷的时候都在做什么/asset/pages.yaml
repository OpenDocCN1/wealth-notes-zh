    # 到底需要几个鸡蛋几个篮子？


    当鸡蛋与篮子相遇，究竟该怎样放？股神巴菲特说，投资者应该把鸡蛋都放在一个篮子里，然后小心地看护它，因为集中投资可以降低成本，取得利益的最大化；塞万提斯却在《堂吉诃德》中教育我们说“不要把鸡蛋放在一个篮子里”，以免篮飞蛋打。要怎样选择篮子？你是巴菲特还是塞万提斯？


    诚然，我们都不是巴菲特。巴菲特之所以放心地把鸡蛋都放在一个篮子里，是因为他已经透彻地了解“篮子”的所有细节。在作出投资决策前，他总是花上数个月甚至几年的时间去考虑投资和合理性，会长时间地翻看和跟踪投资对象的财务报表和有关资料，从来不购买不熟悉公司的股票。比如，当网络股高潮的时候，人人都把这当作是“金摇篮”，巴菲特却没有购买。


    普通投资者受自身专业知识和精力所限，很难作出比较正确的投资决策。在这种情况下，由于没有足够的耐心和足够的专业水准来了解“篮子”，把鸡蛋全部放进去就变成了一种鲁莽。但是，凡事总有例外，'
