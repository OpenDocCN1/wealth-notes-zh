  md: '![](img/e4394970edb70b507c05aef8837a7762_46_0.png)


    # 钱喜欢有信用的人


    谈到债务，接下来我要跟你讨论一下你最重要的资产之一———你的信用值。很多人都没有意识到，赚到和挥霍百万美金的关键区别就在于你的信用值。


    首先我想先谈一谈诚信的重要性以及诚信与信用值的关系。


    必须承认，并非所有的有钱人都有诚信。他们当中的很多人是踩着别人的肩膀爬上去的，会在背后插人刀子，也会在达成交易之后出尔反尔。而且他们当中的很多人还会酗酒、吸毒。他们的生活当中没有平静。他们虽然赢得了这个世界但却失去了自己的灵魂。


    但我需要指出的是，在这个世界里人永远比钱更加重要。你一定要把这句话牢记在心。我永远不会为了金钱而出卖亲人或朋友。所以我从来不会为了金钱而欺骗某人，也不会为了金钱而故意冤枉某个人。对于我来说，人际关系要比金钱更加有价值。赚钱非常容易，但要跟'
  merge: -1
  img_proc: true
- pgno: 47
  md: '人建立良好的关系却不是一件容易的事情。


    我们必须明白，人来这个世界上就是需要建立关系纽带。你的DNA里就包含这种需要。你来这个世界上是为了爱别人，同时也是被人爱的。我们每个人来到这个世界上都是为了享受快乐、安宁、成功。你的DNA里面就有这些因素。


    在猎豹的DNA里，就有一种追杀斑马的需要。只有在追杀斑马的过程中，猎豹才能体会到一种真切的生命感。可如果你把猎豹放到动物园里，没错，那样它的确会衣食无忧，可这会磨损猎豹的本性。你的生活可能也达到了一般水平，但我告诉你，除非你能够跟自己周围的人建立起良好的关系，否则你就会像那头猎豹一样，被套住了！所以你一定要把人放在比金钱更加重要的位置上，要把人际关系看得比金钱更加重要。


    试想一下，就算你成了一名有钱人，但你的孩子却染上了毒品，那金钱又有什么意义呢？你的确拥有了金钱，但在这个过程中你却失去了婚姻。可如果懂得人际关系的重要性，你不仅可以做出自己的蛋糕，而且可以享用它。我就是一个很好的例子，我不仅拥有了金钱，而且拥有一份美好的婚姻。我不仅过上了富足的生活，还跟我的孩子们建立了非常好的母子关系。为什么？因为我懂得把人际关系放在生活中最重要的位置上。


    记住这一点后，让我们继续讨论诚信。诚信是一个人所能拥有的最伟大的品质之一。诚信的对立面是口是心非。通常来说，口是心非意味着表里不一。诚信则意味着能够保持前后一致。人们都喜欢讲诚信的人，也愿意跟这样的人合作。'
