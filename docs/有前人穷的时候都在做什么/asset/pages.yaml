- pgno: 27
  md: '# 第 1 章 理 念


    即使衣不蔽体、每根脑神经上也挂满金子


    会承担一些风险。难道说敢于承担风险的人就一定不会失败吗？绝对不是。有钱人失败的次数远比你我多得多，所以他们才有可能成为有钱人。


    畅销书《富爸爸，穷爸爸》的作者罗伯特·清崎指出，10家企业当中，有 9 家都是失败的。听到这个，相信大多数人都会觉得这种胜算的概率的确不利于自己，所以千万不能创业。普通人会告诉自己：“普通人失败的概率是
    90%。”而有钱人则会说：“这一下可好了，只要连续创办 10 家公司，我最终就一定会成功。”


    哪怕失败 9 次也没关系，因为只要第 10 次成功了，你就会赚到千万美元。很少有人 的失败次数能够比唐纳德·特朗普还多，但特朗普远不是一名失败者。


    关于时间。有钱人看待时间的方式和普通人截然不同。普通人浪费 时间，任由他人偷走自己的时间；而对于有钱人来说，时间是他们的最宝贵的资产。


    普通人把金钱看做自己最宝贵的东西；而有钱人则说：“我总是可以赚到更多钱，却无法赚到更多时间。”


    对于有钱人来说，时间是一种永远无法取代的资源。在他们所拥有的所有资源当中，只有时间资源是有限的。只要能够换来时间，他们甚至愿意付出一切。


    你可以偷走他们的钱，“没关系，我还可以再赚”。


    你可以偷走他们的资产，“没关系，我还可以去买”。


    但有钱人绝对不会容许你偷走他们的时间，因为时间是一种永远无法取代的东西。


