  md: '# 亚马逊五星级读者评论 THE MONEY SAVING MOM''S BUDGET


    # 适合有强烈赚钱欲望的人 Rachel


    我一读完《有钱人穷的时候都在做什么》就想写篇评论。我想把这本书介绍给别人看，这的确是我的心声。克里斯特尔·佩因在这本书里所讲的东西，都是我很喜欢的。这本书尤其适合目前虽然没钱但有强烈赚钱欲望的人，因为它方方面面都讲到了，其中的信息量相当大。


    # 虽然琐碎但亲切温馨 Hloyall


    我很喜欢《有钱人穷的时候都在做什么》，因为我感觉作者克里斯特尔·佩因是以一个聊天者、朋友的身份向我们娓娓道来，虽然不乏琐碎，但给人一种亲切温馨的感觉，而且有些片段确实很出彩。


    # 与作者的一次愉快的谈话之旅 Michele Graber Cubell


    克里斯特尔·佩因很会鼓励他人，启发他人。她的微博有一大批忠实的追随者。所以看到《有钱人穷的时候都在做什么》一书时，我很兴奋。它给我的感觉就是：我似乎是在与作者进行一次愉快的谈话之旅。而且她的写作风格很随意，阅读起来没有一丝障碍。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# 很吸引人眼球，充满了激动人心的话语 LifeBlogger


    《有钱人穷的时候都在做什么》开篇很吸引人眼球，充满了激动人心的话语。虽然结尾有点平淡，但我们仍欣慰地看到，克里斯特尔·佩因不仅仅是一位出色的赚钱高手，更是一位激动人心的大师，激励人们勇敢地追求财富。


    # 给渴望财富的人们指点迷津 Robin Poirier


    作为克里斯特尔·佩因的忠实读者，我自然要为她的新书《有钱人穷的时候都在做什么》写点评论。在本书中，佩因将她成为有钱人的思维方式都告诉我们，给渴望财富的人们指点迷津，帮助人们实现财务自由，真是令人佩服。


    # 开始尝试 Andrew Garett


    我想将《有钱人穷的时候都在做什么》推荐给那些只知道一味羡慕有钱人生活方式的人。克里斯特尔·佩因极力鼓励人们追求这种生活方式，也给读者带来了许多新鲜的思路和方法。打开《有钱人穷的时候都在做什么》开始尝试吧。


    # 迫不及待等着书 Jamie


    我阅读克里斯特尔·佩因的微博已有一年多了。我很喜欢她提出的建议。早在11月我就预订了《有钱人穷的时候都在做什么》并且迫不及待等着它早点到我手上。我在家里也制订了一个赚钱计划，但总是坚持不了。我希望能在这本书里发现一些以前从未听说过的思路，好让我继续我的赚钱计划。


