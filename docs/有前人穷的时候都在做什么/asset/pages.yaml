- pgno: 71
  md: '# # 第 3 章

    ## 机会和风险

    ### 有钱人为什么先吃最喜欢的菜？


    所以，如果有无法吃到自己喜欢东西的风险，那么，其解决办法就是尽可能在风险发生之前把它吃掉！


    通常，在有钱人的大脑中会先有预想的结果，然后再从结果去逆向思考“目前应该要做的事”；但是普通人的脑中大多是顺向思考，从现在思考到未来，尽可能向前进。所以他们不会知道结果是什么，只是一味紧张地迎接即将到来的结果。


    所以，可以说，有钱人其实并非“将利益最大化的专家”，反而是“将风险最小化的专家”。


    举个例来说，如果某天一只股票损失了 500 元，有钱人不会在这个损失得到弥补之前再忍耐一下，而是尽早止损，然后重新寻找投资的机会。


    因为对他们来说，弥补损失所花费的时间反而是种浪费！因为在他们看来，“花费时间”其实也意味着“这期间所隐藏的机会”跟着消失了。


    所以说，在有钱人的心里，非常重视“现在”这个时间点。因为下一个瞬间会发生什么事不知道，这就是一种“风险”。因此，他们尽可能把握现在，把不确定的风险排除，这才是他们的作风。


    # 机会关上安全的门，却打开冒险的窗


    自有文字记载以来，冒险总是和人类紧紧相连。虽然火山喷发时所产生的大量火山灰掩埋了整个城镇，虽然肆虐的洪水冲走了房屋和财产，但人们仍然愿意回去重建家园，继续生活。飓风、地震、台风、


    57'
