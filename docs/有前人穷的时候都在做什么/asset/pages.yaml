  md: '大的人之所以能够吸引金钱，是因为他们宽广的胸怀吸引了无数人追随他，为他提供信息、资源或人才。有了这些，金钱迟早会找上门的。当一个人身上拥有了吸引金钱的特质时，金钱就会自然地聚集，金钱会在这些人身边停留的时间最长。也许渴望获得财富的人们应该重新思考自己的行为是否符合了金钱规律，如同大地的规律，唯有阳光普照大地，万物才得以生长。从某种意义上说，金钱是人们做了正确的事情之后伴随而来的副产品。


