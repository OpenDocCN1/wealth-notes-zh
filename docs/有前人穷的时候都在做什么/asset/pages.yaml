  md: '你是一个小业务员或是修车技术工，平常勤于与人“互动”，让人际关系活跃起来，赚钱的机会自然较多。赚了钱之后的投资理财行为也一样，投资是“动”，储蓄是“静”。如果只是储蓄，所赚利息常被通货膨胀吃光，是赚不了钱的人。在“动”的过程中，要特别记住不要害羞，不要怕没面子。你要大胆、乐观地试试看。尝试的过程，不仅让你体会人生百态，也让你领悟赚钱的方法。


