- pgno: 114
  md: '把时间往前快进20年。现在安妮已经25岁了，尽她已经不在垃圾场捡铝罐，她母亲还是坚持让她每月上交45美元，相当于每天1.45美元左右。玛丽继续把安妮的钱用于投资，而安妮则在当地农贸市场叫卖自制的“捕梦网”。


    而安妮最好的朋友托尼亚则住在纽约市，就职于一家投资银行（我知道，你肯定会问这两个人怎么会有瓜葛，我承认，这纯粹是我胡编的故事）。托尼亚过的是“优质”的生活，出则宝马汽车，吃则高档餐馆，余下的收入就买买衣服，看看演出，或者花在昂贵的高档皮鞋和炫目的珠宝首饰上。


    到40岁的时候，托尼亚开始每月储蓄800美元，而且还常常通过电子邮件对安妮每月只投资45美元的做法指手画脚。


    安妮起初并不想吹嘘，但日子久了，她觉得自己实在需要给托尼亚一点颜色瞧瞧。


    于是他回了一封邮件：“托尼亚，在理财方面遇到问题的是你，不是我。你现在每月用于投资的钱确实比我多，但如果你想在退休时和我一样有钱，每月只投资800美元可是远远不够啊。”


    这封邮件让托尼亚有点摸不着头脑，他觉得，安妮肯定是吃了波西米亚特有的迷幻蘑菇，否则绝不会这样胡言乱语。


    25年之后，两个女人都65岁了，于是，她们决定一起到墨西哥的查帕拉湖边租住一套退休公寓，在那里，她们的钱足够花上一段时间。'
