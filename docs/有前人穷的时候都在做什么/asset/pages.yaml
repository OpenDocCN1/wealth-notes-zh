- pgno: 52
  md: '正直也是一笔值得珍惜的财富。为什么成千上万的商人在芝加哥大火中失去所有的财富，却仍能够迅速东山再起呢？有人甚至还成了规模更大的批发商。他们并没有创业资本。然而，诚实信用就是他们的银行账户。商业机构认为他们是正直的人。他们从不拖欠，也很勤奋，对所有的人都讲信用。这种声誉就是东山再起的资本，这种声誉让一个身无分文的人可以买到数千万美元的货物。大火毁掉了商店，却毁不掉正直的声誉。


    # 一个人的器量大就会吸引金钱


    一直以来，人们为了金钱付出的不仅是时间和自由，还有幸福和健康，以至人们早已忘记金钱不过是人类无中生有的交易货币，往深处看的话，金钱内里实际上空无一物。


    然而，大多数人一生被金钱这支魔棒指挥得团团转，跟在金钱的屁股后，忙碌一辈子，省吃俭用，却似乎仍无法积累到足够的钱。本来唾手可得的幸福，都被各种担忧和莫名的恐惧给侵蚀了，这不能不令人遗憾。


    事实上，追逐金钱很可能只会使金钱逃跑得更快，而有钱人却会用心地创造一个能够吸引金钱到来的氛围。没有科学的证据显示哪些人就一定会富有，哪些人就注定要一生贫穷，但无可否认，许多真正的成功者确实都具有一些与金钱没有直接关系的特质，包括：器量、智慧、勤劳、热情、忍耐、勇于承担和自律等。


    在以上众多吸引金钱的品质中，器量是较为重要的一条。器量'
