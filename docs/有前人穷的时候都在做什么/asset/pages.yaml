- pgno: 170
  md: '视记者问她能否区分伪富豪与真富豪。


    “当然。”她答得相当肯定。


    “好的，那么在这个房间内谁最有钱？”记者质疑。邻桌坐着3个衣冠楚楚的男人，穿着剪裁得体的西服和手工衬衫，喝着苏格兰威士忌。记者想当然地以为安吉丽娜会在这些候选人之中挑选一个。


    相反，安吉丽娜犹如敏锐的猎人，仔细地打量了房间的每个角落。然后她指着坐在角落里一个穿着破破烂烂的牛仔裤、留着长长指甲的家伙说：“他非常富有。”


    记者大吃一惊，问道：‘你怎么知道？’


    “他的举止像有钱的人。”


    安吉丽娜可以一眼看出角落里毫不起眼的家伙坐拥庞大资产，而这仅仅因为他周身散发着正能量。


    然而，如果你完全无法感受到对方的正能量，就是非常严重的问题了。与对金钱散发出负能量的人交往过甚，你自身对于金钱的正面能量也可能因此逐渐抵消、丧失。所以，这样的人，目前即使很有钱也还是远离为好。


    # 绅士名媛都了解“精品”的价值


    另一个关于建立名流人脉的关键，就是要了解精品的价值。例如只要用一个方法，我就可以判定一位女性是否有成为名媛的潜力。'
