- pgno: 128
  md: '请各位检验自己是否有“从一而终”的品质再作决定。


    对于喜新厌旧又行色匆匆的大多数人，谁能够准确说出自己需要几个篮子才是风险最小化与利润最大化的交点？


    答案是——你需要的篮子与别人不同。


    由于肩负保障家庭财务平稳有序运行的重要使命，投资的最终目的就是在于保证家庭生活的前提下，在正常的风险范围内增加家庭财富。投资前必须明确家庭紧急预备金、保险金支出、子女教育和购房规划等一系列支出计划。为了规避投资风险，你有必要对自己的投资项目进行整合，分散投资，弱化风险。


    但如果可用于投资的资金非常有限，过度分散投资会导致投资成本增加，利润在波动中也会被摊薄。这个时候应考虑减少篮子的数量，由于资本稀缺，你的鸡蛋比别人的更脆弱。在这种情况下，篮子已经变得不可捉摸。因此，在慎重选择好篮子的同时，更请留下几个鸡蛋放在手中留作备用。


    # 投资星座：你是狮子座还是兔子座？


    性格决定命运，性格也决定财富的多少。


    按照风险承受能力进行划分，投资者可分为积极型、稳健型、保守型3类，但这种分法稍显草率。正如广告中所言“男人要两面”，人性如此复杂，就算是积极型投资者身上通常也有稳健或远虑的另一面。


    投资顾问总裁、畅销书作家彼得·J.泰诺斯，就曾创造出一整套投资性格分析问卷，根据一些简单的自我测试，将投资者的投资性格'
