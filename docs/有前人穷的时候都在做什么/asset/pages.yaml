  md: '与对金钱渴望的强烈程度比起来都无关紧要。所以人穷志别穷，只要不甘人后积极进取，终有一天会踏上富裕之途。


    # 金钱是中性的，没有善恶之分


    有钱人从来不善于表达自己对金钱的热爱。我知道，很多人都可以搬出大段的理由证明我们为什么应该安贫乐道。但让我来问你几个问题：有哪位父母不希望自己的孩子能过上富足的生活？哪位父母不希望自己的孩子能够一生衣食无忧？哪位父母不希望自己的孩子能够取得成功？所以，有钱人之所以有钱，就是对金钱采取了不同于穷人的态度。要想彻底改变对待金钱的态度，我们首先就应当弄清楚这些问题。


    或许你的确曾经接触过一些人，他们发了大财，结果反而葬送了自己的人生，所以你相信是金钱让他们受到了诅咒。如果按照这种思路的话，我也认识一些婚姻不幸的人，难道我们说是婚姻让他们受到了诅咒吗？我还认识一些去过教堂之后蒙受灾难的人，难道说是教堂毁掉了他们的生活吗？


    其实，金钱是中性的，并没有道德感和善恶之分，既不能行善或行恶，也不会让人变善或变恶。真正让金钱变善或变恶的，是我们使用金钱的方式。一句话，金钱是善还是恶，取决于你如何利用它。


    垒球拍是善还是恶？毫无疑问，如果你拿着球拍，带孩子出去玩上一会儿，那它就是善的。可如果你在 一 时 暴 怒 之 下 用 球 拍 砸 瘪 了 邻 居的汽车，那它无疑就是恶的。'
