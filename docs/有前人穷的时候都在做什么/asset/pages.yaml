  md: '100 美元是善还是恶呢？如果你用这笔钱带家人一起出去度过一个美好的夜晚，它无疑就是善的。可如果你用这笔钱去找了一位妓女，这笔钱显然就是恶的。还是那句话，金钱本身并无善恶之分，关键是
