    000美元。可仔细一算账，我用这笔钱赚到了100万美元，收益率大概是1 000%。在世人眼中，我是在退步；而在有钱人看来，我是在跳跃着前进。当我决定二次抵押贷款的时候，很多人都告诉我这是一个错误：“行了，还是继续付清那笔房款吧。”而我则不断地告诉这些劝告我的人：“有钱人可不是这么做的。”


    今天我在银行里存的钱比任何时候都多。但债务也比以前更多。我的欠债总共达到1 300万美元。当然，这笔欠债也给我带来了上千万的收益。如果没有这些贷款，我就永远不可能赚到这些钱。


    有钱人知道，这个世界上的债务有两种，一种是优良债务，一种是不良债务。所谓“不良”债务，是那些会影响到你赚钱能力的债务；优良债务则会给你赚更多钱的机会。所以你必须改变自己对于债务的思考。


    例如，为了购买公寓申请住房贷款。因为公寓可以产生价格上升的收益或租赁的收益，所以是优良资产。在这种情况下，住房贷款是为了持有优良资产的优良负债。只要以后实现收益，就可以回收前期向银行支付的所有贷款费用。而且，因为是以公寓的状态保持价值，所以贷款本金也不会消失。因此，只要还清所有的贷款，公寓就会完全属于自己。即使无法在约定的期限内偿还贷款，也可以通过出售公寓的形式偿还。


