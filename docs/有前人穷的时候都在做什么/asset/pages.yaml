  md: '的确，那个时候迈克尔·杰克逊非常穷，没有现金。但他不是没有资产，他有一项资产，即梦幻庄园。但是，庄园里面的一草一木，一虫一鸟，还有他收养的孩子们，全都在消耗现金流。他有一个值钱的庄园，但却是一个不能给他带来现金流的资产，反而不断消耗他的现金流。


    迈克尔·杰克逊虽然有资产，但并不能给他带来现金流，所以并不是生息资产。因此，说到底，他还只是一个有资产的穷人。


    # 会借钱也能成为有钱人


    如果用一句话概括负债就是“借来的钱”。因为为是“别人的”，所以要在约定的期限内全部还给别人。


    从经济的角度来说，我们大多数人最想要的是什么？如果你问一下身边的人，相信10个当中有9个人会这样回答：脱离债务。听起来绝大多数人都有“无债一身轻”的想法。也就是说，我们的目标就是将债务清零。


    有钱人可不这么做。他们并不想回归到零，而是想着如何突破10亿大关。我们大多数人都在付双份的车款，在付更多的房款，所以我们总是想着付清所有的债务，感觉那样会让自己在经济上更加自由。


    可有钱人的做法则截然不同。如果我能用6%的利率从银行那里借到钱，只要我的投资收益率不低于7%，我就可以用银行的钱让自己赚得更多。当然，这还不包括我因为投资而减免的税收。


