- pgno: 116
  md: '慎重选择，投资之后耐心等待。只有那些耐心等待的人，才能最终得到“醇美的香槟”。


    复利的魔法没有火花的魔法那么华丽，也不是提前几个小时到达，然后站在好位置就可以欣赏到的一场秀。复利的魔法只有秉持信任，一直耐心等待的人才可以看到，是在漫长的岁月中忍耐的结果。而且，复利的魔法一旦开始，绝不会像火花魔法那样昙花一现，而是会漫长更久，甚至会延续到下一代。


    那些白手起家、令人羡慕不已的有钱人们，在过去贫穷的日子里，也曾迫切地期盼能够获得财富，于是拼命地储蓄和投资，最终，他们都见证了复利的魔法。


    时间对每个人都很公平，它不会因任何人而暂停脚步，永远只会向前走。有的人在某一天终于成了有钱人，而有的人一辈子清贫。


    现在，我们一起试着解“财富方程式”，可以简单理解成：“要想成为有钱人，就要满怀迫切地、坚持不断地进行复利投资。”


    # 有钱人的四本存折


    有钱人通常都有一个自动化的理财系统，这个系统包括4本存折或者说4个账户。这个系统一旦启动，就会自动地生钱。这个系统的原理很简单，跟家中的用水情况很类似：


    水箱里的水通过不同的管道流入厨房或洗手间。流入厨房的水只用于刷碗和饮用，流入洗手间的水只用于洗漱和冲厕所。表面上看起来都是水，但按各自的用途，在不同的空间各司其职。因此，如果家'
  merge: -1
  img_proc: true
- pgno: 117
  md: '里只有一个自来水管和一个水龙头就会非常方便。


    我们的月收入就和水箱里的水一样。虽然都是同样的钱，但用途却不一样。所以，只用一本存折管理所有的支出和投资会非常麻烦。如果能够根据钱的用途使用不同的存折管理，就会方便得多。


    现在，我们来划分钱的用途。从大的方面可以分为固定支出、变动支出、备用资金、投资等4个用途。与这4个用途相对应，需要4本存折或账户。


    # 第一本存折：收入存折


    收入存折是获取收入及管理固定支出的存折。所谓“固定支出”，包括自动缴付贷款、利息、公寓管理费、各种公共费用、子女补习费、保障性保险等。你可以把所有自动缴付日期设置为一个月中的某一天，当所有的缴付结束后，第二天自动转账一定的金额到消费存折。上面的操作结束后，收入存折就不需要再支出钱了，剩下的钱作为这一个月的可存金额，全部转到投资存折。从这时起，一直到下一个发薪日期之前，收入存折的余额都为零。


    从收入进入账户那天起，已自动缴付所有固定支出，生活费用也已经自动转账到消费存折，所以月末只要确认最终余额，再把剩下的钱全部转到投资存折，就不用再费心管理收入存折了。


    # 第二本存折：消费存折


    消费存折是管理变动支出即每月所需的生活费用，用途不同，支出的金额会有一定变动。存入这个存折的钱主要用于支付日常饮食、'
  merge: -1
  img_proc: true
- pgno: 118
  md: '交通费、休闲费等。变动支出是维持生活的必要支出，因此，无论再怎么节约，所能减少的支出金额也是非常有限的。所以，在进行变动支出管理时，养成每月定额消费的习惯就显得至关重要。如果包括固定支出在内的所有支出都可以保持在无变动的水平，那么，对订立和实行投资计划将是非常有利的。


    规定一个月所需要的大概支出金额后，每月从收入存折自动转账到消费存折，尽可能地每个月的生活费控制在这笔钱的范围内。


    # 第三本存折：备用存折


    备用存折是管理备用资金的存折，平时存入充分的备用资金，只用于特殊情况。特殊情况是指发生意想不到的事情而需要支出一笔高额费用，或用于缴付财产税、汽车保险费、支出休假费或过节费等季节性支出。除此之外，如果生活费超过了预算，消费存折中的余额不足时也可以暂时周转。


    备用资金最好保持在月平均支出金额（固定支出＋变动支出）的3倍以上。如果很难做到这一点，也要确保有一定金额的资金。在投资之前，要先确保留有备用资金，如果支出了备用资金，要及时补充。


    # 第四本存折：投资存折


    投资存折是管理投资的存折。用于投资的股票、基金、保险等金融产品都可以自动转账，因此，把所有金融产品的自动转账日期设置为同一天或相近的日期，会比较方便管理。


    从收入存折中自动缴付各种固定支出和生活费之后，把剩下的'
