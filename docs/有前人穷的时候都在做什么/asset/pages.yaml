  md: '由于每个人的投资性格各异，即便都是投资股票，所挑选的标的也会略有不同。如树袋熊型投资者较厌恶市场的波动，骆驼型投资者则喜欢采取买入并持有的投资策略。在进行资产配置时，树袋熊型投资者不宜过度配置股票资产，固定收益乃至不动产反倒是更好的投资方向。


