- pgno: 73
  md: '职业，有朝一日，大多数人会从他们的职位上消失。


    每个人面前都摆着许多令人难以置信的机遇，我们需要做的，就是去努力把握这些机遇。刚开始的时候，你好像是在完成一个不可能 的任务，但随着工作的逐渐推进，你的内心会逐渐发生变化，从而导
    致外部的变化。最终，当万事俱备的时候，成功自然也就水到渠成了。生活就是打开一个个机遇之窗的过程，很多人之所以会错过这些机遇， 就是因为他们没有作好准备。他们没有认真改变自己的内心世界，没
    有考虑如何为自己的将来更加努力获取知识和智慧。


