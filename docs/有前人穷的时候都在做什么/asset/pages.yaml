- pgno: 162
  md: '标新立异是要担风险的，但风险往往和财富并存。如果一味地拒绝风险，那么也相当于把财富拒之门外了。真正的有钱人，都是善于看准时机、大胆进入的。否则，前怕狼后怕虎，等别人抢先一步，那到手的财富就只能拱手让人了。


    赚钱其实并不像我们想像中的那么难，如果你能经常思考、多加创新井和市场需求恰当结合，那很可能找到新的财富奶酪，让更多的财富滚滚而来。


    几年前的一个周末，美国年轻人史蒂芬在湖边漫步。他捡起一块圆滑的鹅卵石，爱不释手地玩弄着，忽然灵光一闪，他想到了一条发财妙计。


    回到家后，这个年轻人定做了一个精致漂亮的小木盒，下面垫上稻草，然后把鹅卵石放进去，并且美其名曰“宠石”出售。另外，他还附了一本广告小册子，说“宠石”是世界上最理想的玩伴，既不吵不闹不需要喂食，也不必清理粪便。它不像狗那样邋遢，每天要牵着散步；也不像猫那样执拗，对吃那么讲究。


    他选择圣诞节前推出包装精美的“宠石”，每件售价仅5美元。这种大胆的做法迎合了不少人求新、求异的心理，结果“宠石”销售火爆，成为最畅销的礼品之一。说起来也许令人难以置信，这个年轻人只用了4个月的时间就净赚了140多万美元，一举成为大富翁。'
