    这个故事中的穷人有钱人的起点是完全相同的，但最终穷人还是穷人，有钱人还是有钱人。可以说，他们的机会是完全一样的，环境是完全公平的，之所以出现不同的结果，原因就在于不同的选择，即对资本的不同运用。


    在这个世界 上，能够拿来赚钱的“资本”只有两种。一种是“劳动资本”，另一种则是“金融资本”。


