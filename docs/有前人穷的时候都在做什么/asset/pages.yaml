    我朋友琳德塞和她丈夫有4个孩子，却只靠一份收入来维持生计。琳德塞喜欢拍照，渴望开创自己的摄影事业。但她知道，想要大幅度提高自己的摄影技术以便依靠摄影从事一份兼职工作，就必须把自己原来那部傻瓜相机换成一
    部专业相机。


    琳德塞和丈夫已经过着非常节俭的生活了，而且也在以非常有创意的方式利用现有的资源，但还是很难进一步压缩财务预算以存到更多的钱，更别说存到购买昂贵相机的钱了。不过，她没有一时冲动使用先借后还的方式，而是决定用付现金的方式来购买这部相机。由于他们手头很紧，这几乎是个不可能完成的任务，但是她并没有因此望而却步。她首先搞清楚自己需要多少钱，然后考虑每周可以采取哪些具体的'
