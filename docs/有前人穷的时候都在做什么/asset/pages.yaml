- pgno: 148
  md: '![](img/e4394970edb70b507c05aef8837a7762_148_0.png)


    # 人生4象限：雇员、自由职业者、创业者和风投资者


    罗伯特·清崎，全球知名的企业家、投资家和财商教育专家，在他《富爸爸财务自由之路》一书中，根据人们收入来源的不同，将人们划分为4个象限。


    第一象限即E象限（雇员）：包括工人、职员、公务员、教师、医生。收入来源是为他人工作而赚取薪金。


    第二象限即S象限（自由职业者）：包括商店老板、餐厅老板、私企老板、会计师、律师以及自由职业者和小生意人。收入来源是为自己工作而赚取的钱。


    第三象限即B象限（企业家）：拥有一个能够良好运转的企业系统，让别人为他们工作，收入来源是企业的收益，并且可持续发展。


    第四象限即I象限（投资者）：有B的基础和投资能力，让钱为他们工作，收入来源是各种投资，用钱来产生出更多的钱。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '无论你是哪个行业的，必然位于4个象限中的一个，而你所处的位置由你的现金来源决定。


    很多人靠薪水生活，属于雇员类型，而另外一些人则是自由职业者。雇员和自由职业者都位于现金流象限的左边。从自己拥有的企业或投资中获得现金流的人则位于现金流象限的右侧。


    左边象限的人群：从事的是挑水型的工作，从事某种职业，获得主动收入；


    右边象限的人群：从事的是渠道型的工作，拥有自己的事业，获得被动收入。


    当你选择通向财务自由的道路时，你需要制订一个目标计划，使自己在未来能够成为你想成为的人。


    当然，财务自由在4个象限中都有机会实现，只不过B或I的位置能使你更快地实现财务自由。从这个意义上说，每一个成功的E都应该努力使自己成为一个成功的I。


    左上象限E（工薪一族）的特点，是用时间来换金钱。


    你都能想象得到，每天工作8小时，加上路上来回的时间，所以你一天里最宝贵的时间都被用来换取工资了，对吗？所以工薪一族是没有时间自由的。


    再想想，身边有些朋友上班上了几十年，退休的时候，哪些实现了财富自由？相反的是，在退休的时候收入可能更少了。所以在这个象限内是没有财务自由的。


    同样，在这个象限里，无论你从事什么样的工作，什么样的职位，都是别人提供的，如果赶上经济不景气，或者公司裁员，可能还有人'
  merge: -1
  img_proc: true
- pgno: 150
  md: '际关系的因素等，你还有可能失去这个位置，所以在这个象限也是没有安全感的。


    左下边这个 S 象限，是自由职业者和小生意人。


    可能你周围都会有这样的朋友，他们是在给自己做事情。比如说，开饭店、美容院、诊所等。但是，正因为是他们自己创造了一份工作，所以所有的风险都是由他们自己来承担，他们的收入曲线是波浪式的，不稳定的。同时，他们要投入更多的时间来换取金钱，也是在用时间来换金钱。他们只有干才能赚钱，不干就没钱，所以，在这个象限里，也是没有时间自由的。


    同样，这些老板，他们如果挣到很多钱的时候，会有很高的支出。当他们生意不好的时候，更不能减少自己的支出，反倒要撑着门面，以吸引更多的人跟他合作。当他们生意好的时候，会投入更多的精力去打拼，因为凡事都要亲力亲为，他们会更累。有人形容这里的人，前半生是用命换钱，后半生是用钱来买命。


    罗伯特·清崎也讲了，在这个象限里，当你获得成功的时候，比不成功更可怕，这是 S 象限的特点。


    右上边是 B 象限，B 象限是企业家或系统拥有者。


    在生活里，你把 B 和 S 都称之为老板，但他们有所不同。因为企业家或系统拥有者有一个赚钱系统。


    什么是赚钱系统呢？举个例子，当你购买了麦当劳的特许经营权，你也把他很成熟的商业体系同时购买过来。所以，你进到店里而会发现：同样的装修、同一个口味的汉堡包和同一个温度的可乐。这就是一个非常成熟的体系，运用这个系统，就可把生意做起来。'
