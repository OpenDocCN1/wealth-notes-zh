- pgno: 191
  md: '步就是整理。所谓“整理”，并不是排列整齐，而是整理自己“需要的物品”，要用的时候马上就能找到。因此，首先你必须辨别哪些是“不要的东西”，然后全部丢掉。不丢东西，就无法进入整理整顿的阶段。如果你总是舍不得丢东西，就意味着你缺乏辨识能力。为了培养辨识能力，首先你要面对自己，重新审视眼前的状况。比如，对于卡莉而言，就是面对她“负债累累”的现况。


    下面我向大家推荐一个快速决定一个物品去留的5个办法：


    我是否需要这个物件？需要在这里是关键词。就算没有这个物件，你的生活也不受影响，那么你可能并不需要它。我并不是说你应该只有2件外套，1双鞋，但是应该客观地评估你到底需要多少服饰。


    我是否经常使用这个物件？如果那个物件你6个月才用一次，扔掉吧。如果你在地工作室的角落里找到一个过去10年来只用过1次的食物脱水机，你要么把它拿出来重新使用，要么给它找个新主人。


    我是否喜欢这个物件？有时候，保持杂乱更加容易，仅仅因为我们已经习惯这种状态了。由于这个物品已经成为家的一部分，我们根本不会去注意有用或者喜欢的东西。如果它对于你一点作用都没有，甚至你都不喜欢，扔掉它！


    这个物件是否会占用我宝贵的空间？很多人都认为，他们需要更大的房间才能放得下所拥有的东西，但其实应该扔掉一些东西才对。比如，刚结婚的头6个月，我和丈夫都是住在一个只有一个壁橱和一间卧室的公寓里。我们把所有可用的空间都占用了，包括床底、浴池下。同时，我们学到了重要的一课：你拥有的空间越小，你需要的东西越少。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '可以把这个物件送给别人吗？我最喜欢的送出物件的方式之一就是，把我不再喜欢、不再使用的东西送给需要的人。这不仅摆脱了不需要的物品，而且在这个过程中方便了别人，似乎还让对方省了不少钱。我并不是鼓动你把10包垃圾扔到朋友家门口，而是说，如果你知道朋友家需要尿布，而你的儿子已经长大了，家里有没用完的半箱尿布，就可以把它们从育儿室里拿出来，省得它们占用空间。


    还记得上文中提到的我那位疲惫不堪的朋友卡莉吗？她的生活一团糟，并总是为此付出代价，不是字面意义上的代价，她确实为此掏腰包了。不过，当她清除生活上的杂乱之后确实发生了可喜的改变。


    卡莉知道不能继续这样下去了，于是她选择了某个星期，取消了日常安排上的一切活动，一整周都只做简便的晚餐。她花一天的时间四处查看自己的家，找到杂乱的区域以及需要解决的存放问题，然后每天解决一个区域的问题。


    重要的日子来临的那一天，她走到第一个区域，把所有东西都清出来，分类成“扔掉”“卖掉”“送人”或者“重新放好”。当家里变得井井有条后，她又想办法保持这种整洁，以免家里再次陷入混乱。


    卡莉现在的生活比过去舒适多了。最棒的是，与过去一团糟似的日子相比，如今她能够省下更多的钱。现在，她学会了为生日和节日而提前购买礼物和其他东西，而不再像以前那样在最后一刻才冲到商店购买。她也不再交滞纳金了，'
