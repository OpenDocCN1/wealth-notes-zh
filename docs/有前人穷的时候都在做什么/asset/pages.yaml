  md: '有一次，我和一对教师夫妇共进晚餐，席间，他们提到了储蓄的话题。他们想知道为将来退休存多少钱合适。和那些享有退休金的公立教师不一样，作为私立学校教师，他们必须要为退休后的生计打算。


    我随便说出一个我认为他们每个月应省下来的最低数字。但这居然是他们目前每月积蓄的两倍。那位女士露丝认为这个数字努力是可以达到的，她丈夫约翰则认为这极不靠谱。


    于是，我让他们做下面这几件事：写下近3个月需要花钱购买的所有物品，包括食品、抵押贷款、汽车加油费和健康保险。在这3个月快过完时，算出每个月的平均花费。


    在我们的另一次聚会上，两位朋友把他们的结果告诉了我。说实话，这让他们自己都大为震惊。露丝对自己在外出吃饭、买衣服以及购买星巴克咖啡等零碎物品上的花销感到有点不可思议；约翰则觉得他与朋友外出打高尔夫球时在俱乐部酒吧喝啤酒花掉的钱实在太多了。


    在随后的3个月，两个人逐渐觉醒了。掏出塞在钱包里的购物发票，每天晚上把当日花销记录下来，这让他们意识到自己正过着怎样挥霍浪费的生活。正如约翰说的那样：“我知道，我必须要每天晚上上记录开支，将它当做可衡量的标准。于是，我变得不那么乱花钱了。”


    一年之后，他们用于投资的金额就翻了一倍。两年之后，我们再次聚会，得知他们的投资款已经达到最初的3倍了。两个人都不约而同地说：“我们以前从来不知道每月的钱都'
