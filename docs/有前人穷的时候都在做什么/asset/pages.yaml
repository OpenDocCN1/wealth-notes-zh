- pgno: 168
  md: '同时想像你嘴里正咬着牙齿矫正器，这会让你嘴角上扬。然后，你昂首挺胸地穿过那道门，这会你鹤立于骚动的人群之中。你站在舞台的中央，犹如万众睎目的明星，引起人群的惊讶与羡慕，他们都伸长脖子望着你。现在你看起来就像一位有钱人。


    有一天，为了测试这个诀窍的有效性，我决定计算一天内穿过门的次数：60 次！包括家里和办公室。每天做同一件事 60 次，就足以形成一种习惯！良好的习惯性姿态是成功者的第一个标记。运用这种简单的“可视化技术”，会你整个人看起来像个已经习惯自豪、成功和喜悦的有钱人。


    # “正能量”的人可以吸引金钱？


    “我不想跟他们一起去喝酒”、“那种朋友还是早点断绝关系为妙”，我当然不鼓励大家向朋友说出这类的话。不过，你还是可以再考虑一下这段关系对你而言，究竟有多重要？


    我认为对于立志成为有钱人的人，仍然有必要跳脱原本的世界，积极建立“能够带给你成为有钱人能量的人际关系”。例如，在你的朋友中，只要有一人可以称得上是“上流社会的绅土名媛”，对你的价值观就会产生很大的影响。


    当然，“绅土名媛”并不是走在路上可以随随便便就遇到；更不是每个拿着爱马仕铂金包、牵着一只黄金猎犬、走在地价高得吓人的黄金地段散步的女性，都能够被称为名媛贵妇的。就我个人的观点而言，能被称为“绅土名媛”的人，应该符合以下条件：'
