- pgno: 171
  md: '“好漂亮的手表啊！是劳力士吧？”


    如果是由女性先抛出问题，我心里都会有“真是敏锐的观察力啊”的赞叹，并十分佩服她。大部分的男性都没有女性这种敏锐的观察力，即使有这种观察力，也会装作若无其事。


    有一种人是虽然表面上会装作什么都不晓得，但心里往往比谁都清楚，因此也会若无其事地释放信号给别人。例如看到某商品而不直指，却说：下一代的新产品好像快要上市了等。各位读者是否能想象，如果具备这种观察入微的能力，对于建立自身人脉能产生多么大的帮助呢？


    我相信无论什么人，都会因为他人的赞美而感到高兴。因此，如果你有注意到某事也装作若无其事的习惯，最好还是改掉为妙。毕竟，“你的领带好好看喔”，光是这么简单的一句话，就能让对方感到“你真识货”，并且因此对你产生好感。


    就算没有真正说出赞美之词，但在宾客云集的宴会等处，你也可以观察他人的穿着。那种一发现某个人好像名媛绅士，就想去和他说话认识一下的人，通常有很多机会拓展自己的人际关系。由此可见，了解精品价值与否，对于人际关系的影响力有多大，它可以帮助你认识更多你想认识的人。


    当然，真正的名媛绅士们并不会把钱穿在身上。最近我和一个朋友聊天，他说：“有钱人基本上分3种：一种把钱全穿在身上；另一种把一半钱穿在身上；还有一种，身上完全看不到钱。”最后一种人常常才是真正的有钱人。


    我上大学的时候，就认识许多第三种有钱人。比如有个欧洲来的'
