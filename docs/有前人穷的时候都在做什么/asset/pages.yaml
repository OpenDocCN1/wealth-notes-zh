  md: '眼光已经看到 39 年之后，人们桌子上会摆一台小的电脑。所以他的眼光跟别人是不一样的。


    IBM 后来为什么会面临失败，然后又重整旗鼓？原因就是公司的名称定得不太好。I 代表什么意思？I 代表 International，国际；B 代表什么，Business，商务；M
    代表 Machine，即机器。合在一起就是国际商务机器公司。所以 IBM 认为它的主顾客都是公司，因为只有公司才能使用大的计算机。


    但是在 39 年前，在美国有一个人叫史蒂夫·乔布斯，他创办了苹果电脑。苹果电脑叫做 ApplePC。PC 代表的真正含义就是 Personal Computer：个人的电脑。所以乔布斯在
    24 岁的时候，资产一度高达 5 亿美金，那时候乔布斯是全美年轻人的偶像，那时的比尔·盖茨和他简直没法比较。但是，39 年之后，比尔·盖茨身价却超越乔布斯
    65 倍。


    难道比尔·盖茨比乔布斯聪明 65 倍吗？答案是否定的。只能说比尔·盖茨的眼光比乔布斯更好。比尔·盖茨时常说：在信息时代，掌握信息重不重要？事实上掌握信息不太重要，掌握未来的趋势才是更重要的。很多人都在掌握信息，但比尔·盖茨这些最会赚钱的人都在掌握趋势，而且不仅是掌握趋势，还要掌握全世界最大的趋势。


