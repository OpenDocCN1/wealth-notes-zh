- pgno: 172
  md: '同学最爱去二手店买衣服，但家里养的马全用 Hermes 马具；另一个同学穿得像个流浪汉，但传闻他老爸不久前才捐了一栋建筑给学校。


    仔细观察他们的穿着，发现这些“低调大户”其实穿得也不那么便宜。虽然一身牛仔裤和仿古 T 恤，却搭配顶级的 CSShmere 围巾；瘪瘪的复古眼镜，识货的人则知道是手工的牛角镜框，一副上千美元。这些同学看来不起眼，但身上四处泄露的小线索，加上优雅的谈吐举止，透露着他们其实是落入了几间的贵族。


    后来我想，许多家里有钱的年轻人的低调，更能显示自己的“厚底子”。暴发户通常才会把名牌挂满全身，而真正的“贵族”在长久的优越生活之下已经学会收敛的艺术，懂得如何让奢华变得低调，并以气质取代一身看不到的钱。


    因此，真正的绅士名媛大多是在一些看似毫不起眼的细节处，多花心思装点，例如佩戴诸如手表这类的小型配饰，或是用高级但朴素的单色系精品，还有一看材质就知道价值不菲的配饰……


    除了这些元素外，还有其他许多要素是上流人士会善加利用的。为了能注意到这些小细节，你当然要先了解清楚，哪些关键地方是别人会特别精心打扮的，什么样的用品其实属于低调中的奢华。这样，你才可以对其主人有更深入的了解。


    这也没有什么特别的诀窍，就只能靠自己多“学习”了。不过我认为更重要的是，你自身确实要对这些事物抱着一定的兴趣。这肯定是必备的，因为衔着金汤匙出生、生来就是绅士名媛的人，与努力想进入上流社会、也想成为绅士名媛的你，一定都有些“想要拥有之物”。因为想拥有的欲望是成为有钱人的关键。'
