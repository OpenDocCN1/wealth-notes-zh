    # 掌握趋势比掌握信息更重要


    比尔·盖茨曾说过，创业成功要有好眼光，其实所谓的好眼光基本上需要具备3个条件。阐述这3个条件之前，我们先来看一看比尔·盖茨眼光到底有多好。


    微软公司的英文名字叫做 Microsoft，它事实上由两个词组成：Micro 和 Soft。Micro 是什么意思？微小？ Micro 代表的含义是 Microcomputer，不只是微小，还有微电脑的意思；那么
    Soft 代表什么意思？不是软，代表的是 Software，是软体、软件的意思，也就是微软公司所设计的软体是给微小电脑使用的软件。


    但是比尔·盖茨在 39 年以前，当他 20 岁创业的时候，全世界第一名、最顶尖的公司叫做 IBM。当时 IBM 的总裁汤姆斯·沃森曾经是世界首富。39 年前一台电脑有整个房子这么大。但是比尔·盖茨的'
