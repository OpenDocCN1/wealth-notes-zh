  md: '一幅来替代原来的那一幅，这实际上有益于艺术的传播。


    每次，我们花费一美元，不是带来好处就是带来坏处。若我们错误地使用，不仅伤害到自己，也会殃及我们居住的社区，因为我们的消费鼓励并传播了不良的事物。但若我们正确地使用，就能刺激正当的贸易，让好的事物加快流通。


    金钱本身没有善恶之分，对金钱的使用才会产生好的结果或难以估量的罪恶。如果使用金钱之人是恶棍，那社会将会面临不好的影响；如果使用者是道德高尚之人，金钱则可以与自己与社区服务。所以，你花的每一分钱都可以为善，亦可为恶；可以让你变得更好也有可能更坏；可能有益于你或别人，也有可能对你或别人造成伤害。


