- pgno: 28
  md: '# 欲望大小与金钱多少成正比


    有钱人越来越有钱，穷人越来越穷，原因之一是对金钱的渴望程度不同。有钱人有着强烈的致富欲望，而穷人最多只是想想“我要有钱就好了”。由此可见，欲望的大小与金钱的多少成正比，要想成为有钱人，首先就要使自己拥有强烈的、持续的致富欲望。时刻想着赚钱的人，才能激发出更多的赚钱的灵感。


    许多人也想过赚钱，也想过致富，但只是偶尔想想。这不行，没有强烈的致富欲望，就没有巨大的致富动力。约瑟夫·墨菲说过：“想得到财富，必先将财富的观念送入潜意识，不论何时何地，你心中先相信会有很多财富。”


    要想成为有钱人，首先应当拥有强烈的创富欲望。只有饱含创富的欲望，一个人才能竭尽全力地完善自我，寻找一切机会发展自己的事业，也只有全身心投入的人才能获得成功。


    美国人约翰·富勒有 7 个兄弟姐妹，他从 5 岁开始工作，9 岁时会赶骡子。他有一位了不起的母亲，她经常和儿子谈到自己的梦想：“我们不应该这么穷，不要说贫穷是上帝的旨意。我们很穷，但不能怨天尤人，那是因为你爸爸相信命运，相信我们就是穷人，所以从未有过改变贫穷的欲望，使得家中每一个人都胸无大志。”


    这些话深植富勒的心灵深处，他一心想跻身富人之列。他相信自己可以掌控自己的命运，所以开始努力追求财富。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '12年后，富勒接手一家被拍卖的公司，并且还陆续收购了7家公司。


    有记者采访富勒，问其致富秘诀时，富勒用多年前母亲说的话回答：“我们很穷，但不能怨天尤人。那是因为爸爸相信自己就是穷人，从未有过改变贫穷的欲望，家中每一个人都胸无大志。然而我不相信，所以我努力成为一个富人。”


    在多次受邀演讲中他说道：“虽然我不能成为富人的后代，但我可以成为富人的祖先。”


    为什么富勒的先天条件并不好却能够成为富翁？关键就是他有改变自己命运的强烈欲望，而大部分穷人之所以一辈子都是穷人，则是由于他们缺乏做富人祖先的雄心大志。


    如果没有想要成为“有钱人”的强烈欲望，那么你终生都赚不到大钱。所以你最好使自己感受到贫穷的切肤之痛，这样才能激起赚钱的渴望。越贫穷的人，对赚钱越有兴趣，而且成功的机会越大。


    社会经济学家麦迪先生认为，对金钱的强烈渴望是创造和拥有财富的源泉。一个人一旦滋生了这种欲望，便会激发意识能量，从而不断构思，并最终得出一个超乎寻常的创富计划，然后再凭借这种欲望带来的持久的兴奋，最终实现这个计划。


    穷人之所以穷不是因为口袋里没有钱，而是因为对钱的“麻木”或者说“淡漠”。这也就是为什么在美国领取救济金的人比乞丐更受人歧视的原因。在美国，乞丐是一种职业，当乞丐还意味着想要通过劳作去赚钱；而领取救济金则意味着一种放弃和对现实的默认。所以'
  merge: -1
  img_proc: true
- pgno: 30
  md: '在很多情况下，你能不能成为有钱人，一开始就有了定数：穷人是可能成为有钱人的，因为他们有做有钱人的理想；拥有一些东西却感觉自己很穷的人，是最容易成为有钱人的，因为他们对财富的追求已经上升到了一种境界；而最不可能成为有钱人的，就是拥有了一些东西，并已心满意足的人。


    美国著名的《成功》杂志创始人马登曾经讲过这样一个故事：有人问一个著名的艺术家，他那个很有才气的学生将来会不会更有成就？艺术家回答说：不可能！永远不可能！又问：为什么？艺术家回答：他现在每年卖画能收入
    6000 英镑，他早已经满足于这种不错的收入了！


    这就给了我们一个启示：已有的财富往往是阻人致富的大敌。如果你从心里深感自己就是个穷人，那你多半也成不了真正的有钱人。我们常看到这样一群人：他们表情木然、行动萧索、心态落寞，唯一的心愿就是能够维持眼前的局面。他们祈愿的就是裁员千万不要裁到自己身上，再就是每月工资能够按时足额发放。他们本来有足够的学识、能力以及资源来开创一番事业，却没有那样的欲望，总觉得眼前的生活就已足够好了。凡是有人群的地方就有这样的人，你如何能够指望他们去创业、去求富、去力争成为有钱人？这些对金钱没有强烈欲望的人只能接受庸碌的人生。


