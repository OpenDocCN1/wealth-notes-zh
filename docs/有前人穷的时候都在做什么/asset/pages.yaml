  md: '也不再因为找不到家里的东西而另买一个了。而且，由于提前计划，她不用来回奔波，节省了不少油钱。由于时间充裕，她不再急着赶路，而是把车速保持在每小时 60
    英里（约合 96 千米）以内，这种速度能够节省不少汽油。最重要的是，她再也不用半路折回来取忘记拿的东西了，因为出门前她作了充足的准备，把所有需要带上的东西都列出来，出门前再检查一遍是否带齐了所有东西。


    # ### 混乱的电脑桌面象征主人混乱的大脑


    我经常在咖啡店看见拿着笔记本电脑、随时随地都在工作的“游牧工作者”。我平常不会拿着笔记本电脑四处奔走，因此这些人对我而言非常特别。


    不知道为什么，我觉得这样的人好酷：可以一边喝咖啡，还能一只手利落地敲键盘。如果手机响了，他们会用肩膀夹手机，双手继续敲键盘，还能跟手机另一端的人交谈：“是的，关于那件事。如果可以的话，我马上把提案送过去。”我真的很崇拜这样的人。


    每当我在咖啡店看见动作利落地敲键盘的人，不管对方是男性或女性，我都会尽量选择他附近的座位，然后悠闲而仔细地观察对方的工作情况。


    在此声明，我绝对不是偷窥狂，只是很羡慕“游牧工作者”的工作态度。可是，也曾遇过让我失望的例子。因为我看到对方的电脑桌面被文件堆满了。根据我过往的经验，这些人通常就是“没多少钱的人”。'
