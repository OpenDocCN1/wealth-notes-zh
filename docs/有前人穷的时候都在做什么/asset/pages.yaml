- pgno: 151
  md: '所以，这个 B 象限是通过建立一个稳定的、有利润的生意而创造持续不断的收入。


    通过一个系统来支配别人的时间和金钱，来实现自己的梦想。同时可以获得时间和财富的自由。


    右下边的 I 象限，是投资者。


