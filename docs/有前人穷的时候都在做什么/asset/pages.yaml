- pgno: 72
  md: '泥石流等自然灾害都无法阻止人类一次又一次勇敢地面对可能发生的危险。


    当我们横穿马路的时候，实际上总是有被车撞到的危险；当我们在海里游泳的时候，也同样有被卷入逆流或激浪的危险。尽管统计数字表明，坐飞机比乘汽车要安全一些，但我们的每一次飞行仍然包含着风险。毕竟我们依赖于飞机牢固的构造及其良好的性能。如果不是由自己驾驶的话，我们还必须寄希望于飞行员和整个机组。总之，任何地方的旅行都潜藏着冒险，小到丢失自己的行李，大到作为人质被劫持到世界上某个偏僻的角落。


    事实上，我们总是处于这样那样的冒险境地，因为我们别无选择。我们必须横穿马路才能走到另一边去；我们也必须依靠汽车、飞机或轮船之类的交通工具，才能从一个地方到达另一个地方。


    每个人在每一天都面临冒险，除非我们永远扎根在一个点上原地不动。的确，当冒险的结果不太令人满意的时候，总会有人会说：“还是躺在床上保险。”很多穷人从来不愿去冒险，似乎习惯于“躺在床上”过一辈子。


    “千万要小心谨慎从事”，许多人都是在这样一种敦促、提醒、告诫的语言环境中一点点长大成熟的。正因为周围环境时时刻刻存在这样的善意提醒，使得一般人很难挣脱原有束缚去冒一把险。


    许多人从不考虑为自己打工，因为那“太冒风险了”。接受大公司的职位是大多数人的选择，似乎其中不存在某天被解雇的风险。许多人一心只想着“干活——拿工资——花钱”，要公司“关心”他们的生活。这就是理想的低风险的工作。但是，他们错误地估计了这个'
  merge: -1
