- pgno: 70
  md: '![](img/e4394970edb70b507c05aef8837a7762_70_0.png)


    # 先吃最喜欢的菜，否则有吃不到的风险


    请你想像一下，眼前有一盘精致的饭菜，你会先吃其中最喜欢的菜吗？还是会把最喜欢的留到最后享用？有钱人通常先吃最喜欢的那道菜。


    那是因为，如果把最喜欢的菜留到最后，万一不小心吃太饱，就有可能吃不下；也可能突然发生不可预期的事情，必须在吃掉它之前就离席；还可能在没来得及下筷前就被别人吃掉了。


    换句话说，如果把自己喜欢的食物留到最后享用，无法确保自己一定能吃得到。其实，这对有钱人来说，就是很大的“风险”。


    尽可能而且优先排除无法预测的风险，是有钱人的行为法则。换句话说，如果风险是“可能无法吃到自己喜欢的菜”，只要在风险发生之前，把它吃掉就对了！


    有钱人“对于无法预测的风险会尽可能排除”，而且会优先排除。'
