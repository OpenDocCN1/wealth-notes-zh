    还有另一个小秘诀。经过几年之后，你的薪水极有可能会增加。如果你的工资在某年增加了1000美元，你至少应该把其中的一半转入投资账户，然后把剩余资金当做特殊用途备用金存入另一个专用账户。这样，你就可以因为这次加薪而获得双倍报酬。


    # 真正的有钱人是生息资产高的人


    30岁的时候，我还算不上有钱人。但如果我愿意我可以装富，而且很简单：租一辆保时捷，借一大笔钱买一幢外观华丽的豪宅，去全球旅行并住五星级酒店。我可以让所有看到我的人都以为我是有钱人，或者也可以凭着银行贷款和信用卡源源不断的资金输送来维持光鲜的生活。但表象总是和事情的本质存在差距。


