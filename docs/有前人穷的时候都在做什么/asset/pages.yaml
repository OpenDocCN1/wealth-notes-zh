  md: '![](img/e4394970edb70b507c05aef8837a7762_110_0.png)


    # 财富加速方程式


    自然界中关于“加速度定律”，由于是牛顿发现后用数学方法表示出来的，所以叫“牛顿第二定律”。这个定律可以用简单的数学公式表示：


    F（力）=m（质量）× a（加速度）


    我一直在问自己：这世间如果真的存在一则财富增长的定律的话，该怎么用公式表示？经过不懈探索，我最终得出了如下结论，其数学公式如下：


    财富 = 对钱需求的迫切程度 × 复利 × 时间²


    我把这个公式称为“财富方程式”，也就是我一直探索的财富定律。


    其实，世上并不存在成为有钱人的绝对定律。而且，我也不能提供推导出这个公式的具体数据。不过，这个公式里面确实包含着能够让财富增值的原理。'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 对钱需求的迫切程度


    在我见过的人当中，有的人连正式的工作都没有，整天靠父母的财产生活；有的人每天只想着有没有办法继承财产。和这些人不同的是，也有一些人迫切地想要成为有钱人。


    你是真的想成为有钱人呢，还是只是想“要是能成为有钱人就好了”？要想了解你自己是不是拥有这种迫切感，其实很容易。


    如果你想成为有钱人，但现在还没有第一桶金的话，那是因为你对钱的需要并不是那么迫切。如果你决定要增加储蓄，但几个月后却放弃了；如果你决定要比上个月减少支出，却从未做到，则说明你对钱的需要还不够迫切。


    # 利用复利，让钱加速倍增


    1626年，美国早期移民用价值24美元的首饰和小玻璃球，向印第安人买下了整个纽约曼哈顿。当以华尔街为象征的曼哈顿成为世界金融中心后，人们嘲笑当时的印第安人愚蠢。但著名的基金经理彼得·林奇却有不同的看法。他说，如果当时印第安人把收到的东西换成钱，按年利率8%投资复利式债券的话，363年后的1989年可能已经有大约32万亿美元了。


    1989年，整个曼哈顿的地价按市值还不到1000亿。可想而知，32万亿是一笔多大数额的钱了。人们称这样的现象为“复利的魔法”。如果把24美元按年利率8%用单利投资，363年后会有多少呢？其结果更让人惊讶，仅仅是721美元。由此可见复利的力量。'
  merge: -1
  img_proc: true
- pgno: 112
  md: '复利这个概念听起来似乎有点深奥，但其实非常简单。


    如果投资 100 美元每年可以收取 10% 的利息，那么我们知道，一年之后，这 100 美元就可以赚到 10 美元，变成了 110 美元。


    第二年，你可以用手里的这 110 美元重新开始投资，如果这笔钱继续增值 10%，那么，它在第二年结束时就可以赚到 11 美元，变成了 121 美元。


    第三年，你用 121 美元继续投资，还是按 10% 获得利息，那么，它在第三年结束时就能赚 12.10 美元，你的本钱就变成了 133.10 美元。


    让这个雪球继续滚下去。看看最初 100 美元的投资按每年 10% 的利息递增，最后会变成多少钱。


    100 美元本金，每年按 10% 获得复利，那么：


    +   - 5 年之后变成 161.05 美元；

    - 10 年之后变成 259.37 美元；

    - 15 年之后变成 417.72 美元；

    - 20 年之后变成 672.74 美元；

    - 30 年之后变成 1 744.94 美元；

    - 40 年之后变成 4 525.92 美元；

    - 50 年之后变成 11 739.08 美元；

    - 70 年之后变成 78 974.69 美元；

    - 80 年之后变成 204 840.02 美元；

    - 100 年之后变成 1 378 061.23 美元。


    后面那些较长期限的情况看上去似乎不太现实。不过，你用不着成为《暮光之城》里那些长生不老的吸血鬼，也一样能享受到复利的'
  merge: -1
  img_proc: true
- pgno: 113
  md: '回报。比如说，一个从19岁开始投资的人，如果能一直活到90岁（我就是这么希望的），那么，他就可以享受71年的市场复利收益。当然，他在这个过程中多少还是要花掉一部分的，但假如还想活到100岁，那么他肯定还是要留下相当一部分用来收获复利。


    5岁的女孩安妮与妈妈玛丽一起生活在波西米亚的一个小岛上。这里的人民自给自足，无论男女都不用剃刀刮毛，即使满身臭汗也能泰然处之，虽然原始落后，却也怡然自得。


    尽管这听起来相当诱人（尤其是在人头攒动的集市上，那味儿可真是绝了），但不幸的是，这里绝非天堂。岛上居民和当地人都喜欢把空易拉罐扔进排水沟里。玛丽告诉安妮，收集这些铝罐后回收利用，不仅有利于保护环境，还能让她成为百万富翁。玛丽带着安妮来到当地的垃圾场。在这里，安妮捡拾铝罐和玻璃瓶，然后将它们卖掉，这样，她平均每天可以赚到1.45美元。尽管玛丽有一颗波西米亚人的心，但她绝非一个乡下土包子，她还说服安妮将回收铝罐赚到的1.45美元用于投资，这样就可以让女儿成为百万富翁。


    玛丽把每天赚到的1.45美元投资于美国股市，每年赚到9%的平均回报（这还略低于过去90年股市的平均年收益率呢）。此外，她还在别的方面比其他母亲棋高着一着：如果教安妮学会节约，女儿同样能变成一个理财高手。但是，必须让女儿自己学会赚钱，而不是把金钱作为“礼物”送给安妮，因为那样做的话，女儿或许会变成一个理财弱智。


    99'
