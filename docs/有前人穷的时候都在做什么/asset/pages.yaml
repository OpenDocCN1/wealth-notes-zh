    第一个是目标问题，第二个是可行性问题。财富目标要建立在现实的基础上，而没有可行性或可行性很小的都不是目标。


    很多人常常把梦想和目标混淆。如果你希望自己能够成为比尔·盖茨那样的世界首富，而且这种梦想非常迫切，那你一定会采取积极的行动。


    但这不是一个现实的目标。目标是经过计算并且具有极大可行性的。例如，根据你目前的收支情况分析，每年可存金额最多有 6 万元，


