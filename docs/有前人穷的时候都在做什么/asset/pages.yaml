- pgno: 6
  md: '顾客人。《有钱人穷的时候都在做什么》一书告诉读者如何作出明智的选择，最大限度地利用好时间和金钱。


    # 玛丽·奥斯汀


    《一周只需75美元就能享受家庭大餐》作者


    你是否在寻找成为有钱人的方法呢？作为3个孩子的母亲，我花费数年时间研究如何更明智地赚钱。如果早在几十年前，我就看到克里斯特尔·佩因的这本书，我想我会少走很多弯路。《有钱人穷的时候都在做什么》确实让想摆脱财务困境、变得有钱的人们看到了希望。


    # 汤小明


    全球财商教育畅销书“富爸爸”系列图书策划人


    《有钱人穷的时候都在做什么》问了一个很有吸引力的问题。当然，在“做什么”中也必然包括“想什么”，因为先有思想后有行动。正如全球财商教育畅销书《富爸爸，穷爸爸》作者罗伯特·清崎所说：“金钱是一种思想。”而《有钱人穷的时候都在做什么》的作用就是帮助人们从思想到行动都镀上一层财富的光芒。


    # 任宪法


    小天财财商工作室教育总监、畅销书《快挖掘你的财商》作者


    作者在书中讲道：“富有，不只是机会，更是一种选择；掌握趋势比掌握信息更重要。”这是提高财商必备的两种重要能力，一种是选择力，一种是趋势力。趋势力是把握趋势的眼光和行动决断能力。顺势获利不费吹灰之力，逆势赚钱举步艰难。读者可从中学习提高这两种能力。


    4'
