  md: '你的还款目标现实起来。现在你已清楚，每周你需要额外赚取多少钱或者节省多少钱，明年才能支付那1 500美元的卡债。虽然1 500美元听上去是很大一笔钱，对于手头很紧或者勉强收支平衡的人来说，更是一笔巨款，但当你把1
    500美元分解成“容易下咽”的每周32美元之后，还款计划就变得务实和可行了。


