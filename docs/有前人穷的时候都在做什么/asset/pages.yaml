    一方面你要不停地学习，但另一方面，你也要学会实干，用你所学到的东西帮助自己取得成功。如果你只是口头说说，告诉每个人你想要努力，想要出人头地，但却从来没有采取实际行动来证明自己的决心，那你就只能是空谈，最终将会一无所获。不知你是否接触过那些典型的空谈者，他们在过去的10年甚至20年里一直在讨论一个“绝妙的创意”，并且费尽口舌让你相信他们的创意真的能带来滚滚财源。可在实际生活中，他们仍然日复一日地重复自己的生活，20年之后，如果再次见到他们，你会发现他们的生活仍然没有任何改变。


    要想成为有钱人，一个最重要的原则就是要学会冒险。在现实生活中，任何事情都会伴随着一定的风险，而这些风险也会给我们带来切实的回报。这个世界上从来没有不带风险的回报。


