  md: '开的是最新款的“捷豹”跑车，在当地的价格高达 25 万美元以上。他们住的是豪宅，妈妈戴的是“劳力士”。索菲亚认为他们绝对是名副其实的有钱人。


    几堂课之后，该女士拿给索菲亚一张支票。她满脸笑意，滔滔不绝地讲述着刚刚过去的海外假期，也对索菲亚在这段时间对孩子的关心千恩万谢。


