- pgno: 49
  md: '睛，握着对方的手，答应对方某件事情，可在内心深处，他们根本不打算兑现自己的承诺。我敢保证，如果你按照这种方式做事，即便最终得到了自己想要的金钱和财富，你也不会感到幸福。


    那些缺乏诚信的人大多是一些毫无原则的人。当拥有金钱的时候，他们很容易将其挥霍一空，也很容易为了金钱而抛弃自己的配偶，背弃自己的承诺，做事喜欢走捷径，相信这样可以让他们赚得更多。可到最后呢？他们所得到的只有心痛和沮丧。


    # ## 信只和正直的人交往


    正直是人格的重要组成部分，常表现在日常决定和行为中。没有正直的品质，很难获得同事和上司的认同，更不要说事业成功。很多公司在用人的时候，宁可找一位才能平平但正直的人，也不用那些心怀鬼胎的能人。因为上司需时时提防这种人，特别是涉及管理钱财的工作；面对利益分配，同事也会对他倍加防范，小心谨慎。无论在职场还是在日常生活中，为人正直都是立身之本，正直之人才能获得信任和拥戴。


    为什么很多公司的字号沿用数十年甚至数百年前的人名呢？因为它暗示着正直的品格，表明可靠的信用。


    作为美德的正直是什么？那就是处事公正、为人真诚、言行一致、表里如一、质朴敦厚、光明磊落、无私无畏、刚正不阿。正直的，也必然是诚实的。正直的对立面是虚伪、奸诈、欺骗。


    钢铁大王卡内基的一生，无论是在电报公司工作，还是为当时美'
