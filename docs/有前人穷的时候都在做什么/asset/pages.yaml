    80%。那么，你想站在哪个象限呢？


    # 富有，不只是机会，更是一种选择


    关于财富与人的话题有人提出过这样的一个假说：在一个系统内，初始状态包括有钱人和穷人。然后，把系统内的所有财富重新平均分配给系统内的每一个人。结果会怎样？只要一个小时以后这样的平均就会被打破。


    比如：有人拿着分到的钱去下馆子，而有的人用分到的钱去开馆子，一个小时之后，财富就又不平均了。一年以后，也许会长一点，5 年以后，原来的有钱人还是会是有钱人，原来的穷人还会是穷人，又回到了初始的状态。


    这个假说告诉我们一个人最终是穷人还是有钱人不是运气，也不是所谓的机遇，而是选择，选择了一种生活方式和价值体系。如果你'
  merge: -1
  img_proc: true
- pgno: 152
  md: '选择了有钱人的生活方式，选择了有钱人的价值体系，你就会成为有钱人。


    有个穷人，因为吃不饱穿不暖，而在上帝面前痛哭流涕，诉说生活的艰苦，天天干活累得半死却挣不来几个钱。哭了半晌，他突然开始埋怨道：“这个社会太不公平了，为什么有钱人天天悠闲自在，而穷人就应该天天吃苦受累？”


    上帝微笑着问：“要怎样你才觉得公平哪？”


    穷人急忙说道：“要让有钱人和我一样穷，干一样的活，如果有钱人还是有有钱我就不在埋怨了。”


    上帝点头道：“好吧！”说完上帝把一位有钱人变成了和穷人一样穷的人，并给了他们一人一座煤山，每天挖出来的煤当天可以卖掉买食物，限期一个月挖光煤山。


    穷人和有钱人一起开挖，穷人平常干惯了粗活，挖煤这活对他就是小菜一碟。很快就挖了一车煤，拉去集市上卖了钱。他用这些钱全买了好吃的，拿回家给老婆孩子解馋。


    有钱人平时没干过重活，挖一会停一会，还累得满头大汗。到了傍晚才勉强挖了一车拉到集市上卖，换来的钱他只买了几个硬馒头，其余的钱都留了起来。


    第二天，穷人早早起来开始挖煤，有钱人却去逛集市，不一会带回两个穷人。这两个穷人膀大腰圆，他们二话没说就开始给有钱人挖煤，而有钱人则站在一边指手画脚地监督着。只一上午的工夫有钱人就指挥两个穷人挖出了几车煤，'
