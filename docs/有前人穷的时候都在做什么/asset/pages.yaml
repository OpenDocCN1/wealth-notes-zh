    # 价值投资 VS 技术分析：你是面包派还是甜甜圈派？


    我曾经养过一只叫“苏”的小狗，每次给它喂食我都怀疑自己喂的是火箭燃料，而不是狗粮。在庭院里玩的时候，只要主人一背过身，它就会上演《越狱》桥段，跳过5英尺（约1.5米）高的篱笆，把隔壁家的花园摘得一塌糊涂。这让我们和邻居的关系变得非常紧张。'
