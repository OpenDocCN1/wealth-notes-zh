- pgno: 74
  md: '壳牌石油公司的管理人员也对亨茨曼的冒险能力叹为观止，于是他们在交易完成后买了一座铜像送给他，上面刻着“河船赌徒——壳牌公司友人敬赠”。“我把这个雕像视为对我的极大褒扬，”亨茨曼说，“河船赌徒是19世纪险境求生的高手，他们以此形容我，我感到很荣幸。多年来，我一直
    是壳牌石油公司最大的个人客户，我认为这是一种荣誉的象征。”


    面对不可知的情况，我们都不妨把它当成一个新的机遇之窗，一个创造奇迹的机会。当机遇来临时，一定要努力把握，否则你就会与机遇失之交臂。


    # 利润是风险的定价


