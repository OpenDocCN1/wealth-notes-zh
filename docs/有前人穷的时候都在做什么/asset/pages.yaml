  md: '是你的潜在价值，你现在的时间在未来的价值究竟会有多大。问问自己，如果你把现在的时间用来做一些对未来有益的事情，这些时间将会创造出多大的价值？如果计算的结果表明，你现在所浪费的这些时间在未来会价值数百万美元，你就可以得出结论，你现在的每小时绝对不止价值
    10 美元或 6 美元。


