    # 量大是致富的关键


    舒尔茨 1953 年出生于纽约，这是世界上人口最多的城市。他从小家境一般，但这不妨碍他体面地长大成人。他很早就开始自己做生意，没多久，他就转行进入咖啡业。因为不喜欢纽约的现实和紧张气氛，他搬到了美国最有欧洲气息的城市西雅图，并于
    1982 年加入当地一家小型企业 Moby-Dick,后成为其合伙人。该企业以出售一种广受欢迎的饮料而'
