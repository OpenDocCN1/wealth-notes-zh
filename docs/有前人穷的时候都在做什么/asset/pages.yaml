  md: '# 第6章 创业

    人生4象限，一开始就站进“富象限”里


    闻名，成绩不错，但是市场占有率不太大。


    有一次，舒尔茨到米兰出差。那次出差，其他人满脑子想的都是坐船在意大利美丽的河道上穿行，而舒尔茨想的是咖啡。他注意到当地人经常围坐在小小的咖啡馆里，无所事事，沉浸在那种现在被他称为“咖啡体验”的气氛中。这就是星巴克的原型。你我都曾经见过懒散欧洲人，闲坐着喝那种酸酸的宛如电池溶解液一样的咖啡，以此消磨时间。但是舒尔茨却能从这些稀松平常的现象中发现巨大的市场，并因而改变了整个世界。


    他在意大利洞察到了咖啡文化的关键所在。喝咖啡已经成为当地人的日常仪式，而且是非常重要的仪式，特别是对米兰人而言。在米兰，甚至经常有人说：“没有咖啡，我就活不下去了。”因此，这已经不是一桩生意，而是私人化的东西。正是这些美好的原始材料才造就了我们的生活习惯、梦想和大量的财富。舒尔茨发现了这一点，并且再未曾动摇过。


    舒尔茨为什么赚这么多钱，事实上理由很简单，就是因为他的产品需求量很大。所以量是致富的关键。或者换句话说：还没有赚钱只有一个原因，就是产品的需求量不够大。


    量为什么不大呢？我发现了几个原因：


    第一个原因是市场的需求度不够。假设一个普通人要买车，他会买福特，还是买劳斯莱斯？当然买福特。所以，劳斯莱斯公司最后被卖给了德国的大众汽车公司，因为购买劳斯莱斯汽车的市场需求度太小了。


