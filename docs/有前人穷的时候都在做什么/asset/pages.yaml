  md: '选择一个只要你下定决心，未来几年完全有可能实现的财务目标。


    最后，选择一个你希望实现但是几乎没有可能实现的财务目标。


    注意：如果你有信用卡欠债，或者有汽车贷款、医疗贷款、学费贷款及消费贷款，那么，你的首要目标应该是把欠款还清。一旦你还清了贷款，就应该优先支付银行按揭或者为买房存够一大笔钱。


    第五，把3个目标用白纸黑字写下来。如果你觉得自己常常忙得像钟表里24小时不停转动的齿轮，但财务状况却始终不见好转，那么这个步骤会彻底改变你的金钱观。把目标写下来能够让你集中精力朝着特定的目标前进。这个写下来的目标就是你的财务地图，即使你只是在做诸如购买日用品这样的小事，这张地图也能够为你指点迷津。如果你遇到了预料之外的账单或阻挠，或者财务好转的进度比你预想的要慢，那这3个目标还可以成为你继续前进的动力。


    第六，把你的目标分解成“容易下咽”、容易计量的小目标。根据你的目标，确定未来5个月或者5年内，为了达成每个目标，你需要做的事情。把长期目标分解成年度目标，然后把年度目标分解成月度目标，接下来把月度目标分解成周目标。这样一路分解下来，目标就变成了“容易下咽”的小目标。


    例如，如果你希望未来一年还清1500美元的信用卡债，可以用1500除以12个月。也就是每个月需还款125美元。125再除以4，每周就只需要还32美元。现在，每周只需要还32美元这个事实，令'
