- pgno: 184
  md: '一下子就瘫在了沙发上，然后很自然地拿起遥控器，按下电视开关。“今天的节目还是很无聊啊！”虽然嘴里抱怨，但他拿着遥控器的手却还是不断地转换频道。后来，他将频道锁定在深夜的综艺节目，整个人坐定，打算认真看电视。“说真的，这个节目永远都是这么无聊。”“既然这样，不看不就得了……”尽管心里这么想，凯瑞的眼睛还是盯着屏幕看着。等回过神来，已是凌晨两点，该上床睡觉了。直到这时，凯瑞才不得不关掉电视。于是，一天就这样毫无意义地度过了。


    与凯瑞类似，有很多人每天都要花1～3个小时看电视。如果睡眠时间是7小时，一天的活动时间就是17小时。白天几乎都在公司度过，上下班也要花费很长的时间。除掉这些“被公司剥夺的时间”，剩下来属于你的时间大约只有7个小时。而你竟然用1～3个小时来看“无聊的电视”。除了公司，连电视也剥夺了你的宝贵时间！


    你是不是也跟凯瑞一样，每天都过着这样的生活？


    说真的，电视简直就是“窃取时间的小偷”。一旦打开电视，就算嘴里埋怨电视节目“无聊”“低级”，还是会一直盯着看下去。你的宝贵时间就在看电视的时候，一点一滴地流逝。如果你希望“不再为钱烦恼不安”，从今天起就减掉一直开着电视的生活模式。因此，请向有钱人看齐，别再一直开着电视，将看电视的时间用来自我成长吧。你可以看书、学习，或是为了赚钱累积必备的知识。坚持下去，一个月你就能拥有60～90个小时的学习时间。能做到这样，一定能够快速成长。提高斗志，以坚定的意志，渐斩那些“坏习惯”吧。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '如果你不支配你的金钱，它就会像细沙一样，从你的指间溜走。如果你不好好思考一下如何用钱，那你就清楚不上个月的钱都花在了哪些地方。时间也是一样。如果你不好好规划你的时间，那么你最终可能也会臣服于美国作家查尔斯·赫梅尔所谓的“紧迫事件的专制”，一整天都忙碌不已：同时做好多事情，总是忙不迭地跑去救火，却无法离你的目标更近一步。


    制订一个时间预算表会让你成为时间管理大师，重新把握每一分每一秒。你再也不会有一天结束时，除了筋疲力竭之外，一无所获。当你规划自己的时间时，你不仅有了更多的可用时间，你的生活也会恢复平静和规律。这会让你更加效率和精力充沛。它会引领你获得更大的财务自由和时间自由。


    那么，该如何制订时间预算表呢？以下是我的一些建议：


    第一，从你拥有的时间开始。无论你是否乐意，你一天只有24个小时。但大多数人总想着如何把需要额外花费5个小时的工作、项目、活动挤进这24小时里去。这实际上是在否认你一天只有24小时的事实。难怪你会觉得每天都有成百上千件事情等着你去做。


    第二，预留8小时的睡眠时间。我们都知道成年人需要保证7~9小时的睡眠时间，但是很少人做到这一点。讽刺的是，开夜车并不会让你效率更高。事实上，长期无法保证7个小时睡眠时间的人，更有可能遭遇体重超标之类的困扰；患心血管疾病、糖尿病、心脏病风险更高；反应变迟钝，头脑敏锐度下降，包括记忆力衰退和认知障碍；生活品质下降。因此，首先要保证充足的睡眠时间，你才能够过上健康、有活力的生活。'
  merge: -1
  img_proc: true
- pgno: 186
  md: '第三，预留 2 小时的储备时间。在时间预算表里，给睡眠时间预留 8 个小时后，你可能想把剩余的 16 个小时填满。如果你这样做的话，就相当于一开始就失败了。因为生活并不会完全依照你的计划进行：有人打电话、登门拜访、宝宝拉肚子了、洗衣机坏了、路上堵车了等。所以，不要让意外事件毁了你一整天的计划，不妨预留
    2 个小时的应急时间，以便处理意外事件。


    第四，按照事情的优先顺序安排剩下的 14 个小时。你可以为每个特定的事项分配一个时间段，然后根据每天的活动微调；你也可以只把时间预算表当作指南，确保你的优先事项排在前面，不要让紧迫任务扰乱你生活中的重要方面就行了。


    我的朋友杰西卡制订了时间预算表后，她的生活也因此焕然一新。


    以前，杰西卡认为她必须制订一份规定得很死的时间表，因为大家都是这么做的。但是作为 2 个学龄孩童的母亲，她很难做到这一点，因为总是有意外事件发生。她不可能预料到什么时候该换尿布或者什么时候某个孩子需要帮助。所以，最终常常是时间表不可避免地被打废，而杰西卡也因为自己总是没能完成计划而没有勇气制订计划。时间预算表的不同之处在于，杰西卡可以为某件事情多预留一些时间，找到时间后立刻把它完成。


    时间预算也不同于标准的任务清单以及杰西卡过去使用过的其他时间管理工具。它让杰西卡觉得自己才是时间的主'
