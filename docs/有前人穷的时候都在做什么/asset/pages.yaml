  md: '# **第 5 章 理财投资**

    有钱人的财富加速方程式


    但是通过出售股份，他可以用股东投入的资金建造更大、更有效益的工厂。由于生产效率提高，工厂的利润也开始迅速增加。


    现在，威廉的公司已经成为“公众的”公司，这意味着，股份持有者可以把他们持有的股份转手卖给其他人。当一个公司公开发行在股市上流通交易的股票时，这一活动给公司经营带来的影响几乎可以忽略不计。这样，威廉就可以专心致志地做好自己最擅长的事情：制造巧克力。另一方面，股东也不会给他添麻烦，因为在通常情况下，少数股东不会给公司的日常经营活动带来什么影响。


    威廉的巧克力实在是够神奇的。更让股东高兴的是，威廉的巧克力在市场上卖得越来越多。但股东们需要的不仅仅是纽约证交所的一张纸，或是拥有当地经纪公司的股份证明。他们想分享巧克力工厂创造的经营利润。这也很正常，因为从严格意义上来说，股东们毕竟也是工厂的所有者。


    于是，由股东选举产生的公司董事会决定将每年利润的一定比例送给股东，也就是股息。听到这个消息，大家都很高兴。这个过程是这样的：威廉的工厂每年销售价值 10 万美元的巧克力和其他商品。在缴纳了所得税、支付了雇员工资和设备维护成本之后，他的巧克力工厂实现了
