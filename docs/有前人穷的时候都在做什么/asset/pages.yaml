- pgno: 93
  md: '质就是思维的角度不同。节俭的人的思维模式，永远都是：买东西的时候，能便宜就便宜，攒下钱还有其他用处呢，等以后钱攒多了再买，想的都是等有钱了以后怎么怎么样。


    那么，有钱人又是怎么想呢？对喜欢的东西，他们永远考虑的都是在：我如何做才能够买到它呢？我如何才能赚到那么多的钱呢？大家发现了吗，由于他们想的是如何才能赚到钱，而不是想：有钱了之后才怎么怎么样。就这一个差距，使得有钱人的赚钱的点子、方法越来越多，而这些都是伴随着自己的欲望、自己的野心而成起着。今天赚的钱开上了奔驰，明天喜欢上了别克，他就开始想现在赚的钱太少了，怎么才能赚更多的钱？接着，他会迅速调整自己的工作，调整自己的事业，进而买到自己喜欢的东西，进而过着别人不可思议的生活。


    另外，如果从宇宙的能量的角度来看的话会发现，我们内心长久向往什么，能量就会实现什么，这就是宇宙的吸引力法则。心想事成。认真反思自己的生活，我们的今天正是我们过去思考的结果，那么，明天也必然是今天思考的结果。


    现在认真来回味一下“越花钱的人越有钱，越舍不得花钱的人越贫穷”的结论吧。


    过奢侈的生活！大手大脚地花钱！始终记住，不要按照你的收入来过日子，这样能使你自信！如果你现在穿着你喜欢的衣服，喜欢的鞋，挎着自己喜欢的包，是什么感觉？肯定比现在自信很多倍！而自信带来的价值呢？是你的能力成倍地增加。自信的力量是巨大的，人一旦有了自信，就会干成别人认为不能做的事情，人一旦有了自信，就会干成自己不自信的时候认为做不成的事情。自信，可以让一个人'
  merge: -1
  img_proc: true
- pgno: 94
  md: '更乐于与人交往，更乐于表现自己，进而有更好的心态，有更好的环境，进而就会有更多的人愿意与你交往，愿意把好项目和有用的投资信息与分享，进而会让你有进更好的收入，如此就可以进入良性循环。


    人突破习惯是很难的，尤其是突破根深蒂固的思维习惯。但无论怎么难，请改变吧，立刻改掉以前舍不得花钱的习惯，现在就以“如何做才能赚到钱实现你的欲望”的思维来思考问题。不过请注意，我在这里是在倡导花钱，敢于突破自己一步步过上富足美满、自己所向往的生活，而没有倡导大家去浪费钱。


    赚钱是为了消费的，而不是用来浪费的，而花钱也是有艺术的，至于应该怎么花，有钱人有这个理念：钱只要不浪费，所有花费都是合理的。例如一双价格不菲的鞋子，相信除了可以提升自己内心的自信和社会地位之外也是是为了耐用，因为这是一种投资观念。悟透了这一点，对于越花钱越有钱，越舍不得花钱越没钱的理念，你会有透彻的认识的。


    花钱是一门学问，有的人花了 1 元却挣了 100 元，有的人花掉 100 元却一文不赚，更不要说全部赔光的了。会花钱，就是会投入，只有懂得如何投入，才能得到很好的产出。


    # 消费前分清“想要”和“需要”


    要想成为有钱人，我们就必须积累资产，而不是负债。能让人终生受用的最保险的办法，就是少花多赚，然后再用剩下的钱理性投资。但太多的人却没有区分清楚什么是“所需”，什么是“所想”，放纵自'
  merge: -1
  img_proc: true
- pgno: 95
  md: '己的欲望过度消费，也因此损害到他们的“财富健康”。


    在我们身边，有很多人一出校门便找到一份能让自己衣食无忧的好差事，然后就走上了过度消费之路。最初往往是无意而为之，或许只是用手头的信用卡买了一张新餐桌，但马上发现餐盘和刀具不配套，于是换掉；接下来是长沙发，越看越觉得和优雅别致的餐桌不搭调，不过，好在还有信用卡，谢天谢地——该是换掉这个破沙发的时候了。但没过多久，这些亲爱的朋友又注意到，旧地毯根本就配不上新沙发，于是，他们开始在五彩缤纷的广告里疯狂搜罗，为他们的新沙发找上一张相配的波斯地毯。然后，他们开始梦想着再添置一套新娱乐系统，而后是全面装修，最后还有一次夏威夷豪华游。


    与其说他们生活在“美国梦”之中，还不如说他们早已经深陷魔幻世界的梦魔而难以自拔。宙斯惩罚惹恼了众神的西绪弗斯的方式，就是让他不断把巨石推上山，而每当接近山顶，巨石就会滚回山脚。不良消费习惯也让很多消费者面对同样残酷的恶性循环。每当债务快还清的时候，他们就会忍不住给自己一点奖励。这就让负债的“西绪弗斯”巨石越滚越大，最终把他们推入永不见天日的深谷。


    攒钱买东西（而不是以信用卡购买）是20世纪50年代的事，早已过时了——至少今天的很多消费者是这么认为的。而结果自然不难想象，21世纪给了我们堆积如山的负债，而我们唯一能做的事情就是把这些负债藏起来，让我们的外表依旧光鲜靓丽。


    在成为有钱人之前，首先要学习如何攒钱。如果我们想凭借中低收入者的薪水致富，那么就必须彻底放弃那些令很多人吃亏的消费习惯，在消费前分清“想要”和“需要”，谨慎对待每一分钱。'
  merge: -1
  img_proc: true
- pgno: 96
  md: '大学毕业几个月之后，杰弗里到一所学校教授7年级课程。那时，他盘算的就是凭着低房租和低生活成本还清自己的学生贷款。


    马铃薯、意大利面条和蛤蜊就是杰弗里所能找到的最便宜的“美食”。蛤蜊可以提供大量的纯蛋白质呢。于是，他就挎着篮子在沙滩上四处闲逛，他每次都能收获一大堆蛤蜊。回来后，他用微波炉烘烤马铃薯，或用水煮熟意大利面，把蛤蜊一股脑地扔进去，再加一点橄榄油。瞧瞧，这就是不到1美元的晚餐！日复一日地吃如此乏味的东西，和吃狗食似乎没什么区别。不过，每月只花掉工资的30%，也确实让杰弗里的负担不断缓解，因为他可以用70%的工资偿还负债。


    与室友分担房租也能削减生活成本。但杰弗里根本就不想支付房租，于是，他寻找那些为躲避冬日寒冷而去南方度假的人，看看他们是不是想找人看房子。


