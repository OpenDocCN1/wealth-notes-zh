- pgno: 91
  md: '# 花钱反而赚钱？


    会花钱就等于赚钱，也许这样说有点不合常理。毕竟，在大多数人的理念里，花钱总是和吃喝玩乐联系在一起。所以有不少人在挣了一些钱之后，总喜欢深藏不露。更有甚者终其一生，花费甚少，身后却留下巨款一笔，让人大吃一惊。


    会花钱，就是会投入，只有懂得如何投入，才能得到很好的产出。常听朋友们在一掷千金挥霍后，仍然豪气万丈地说，这点钱算什么，只要我花得开心就行。不过，花得开心不等于花得多，花得多也不等于花得开心。


    会花钱就等于赚钱是有前提的，不是花 10 元钱，换来了 10 元的货这样简单，而是花了 10 元钱，得到 12 元，甚至更高价值的商品，这才是真正意义上的赚。会花钱就等于赚钱的前提是花费之前多思量，凭一时冲动或心血来潮花钱，其结果常常是换来一时的快感或满足，并没有得到更多的利益。当然，这种经大脑思考过后的决定，可不是讨价还价或优柔寡断，而是在消费之前将自己定位成一个合格的市场调研员。


    认真看看你周围的人，那些从小就大手大脚地请朋友吃饭或者花钱的人，到现在依然有条件大手大脚地花钱；而那些每次一到了付钱时就没有带钱包的人多少年之后，依然过着拮据的生活。似乎越花钱的人越有钱，越舍不得花钱的人却越穷。


    不想不要紧，一想真的是吓一大跳。怎么可能？我们自古以来都是在教育着：只有节约才能省下来，越节俭越能攒钱；不管赚多少，'
