- pgno: 195
  md: '这是格雷的故事。也许他又像误传裸女视频文件那样，搞错文件，将重要的个人数据文件外泄……


    请你现在马上检查自己的电脑桌面。是不是文件已经多到看不清桌面图案了呢？是否有一堆文件杂乱无章地塞满整个桌面？当你想找资料时，是不是要从头到尾一个个看，才能找到资料呢？如果是这样的情况，小心格雷的故事在你身上重演。


    电脑桌面确实是个方便的场所。建立数据文件后，可以先摆在桌面。当桌面资料文件只有三四个，要搜寻时自然一目了然了。但是，当数据文件增加到10个或20个，光是找出想要的资料文件，就得花不少的时间。如果没有依文件夹种类归档整理，当你想要某份资料时，就无法马上打开文件，工作也无法顺利进行，更有可能哪天犯下无法挽救的失误。


    电脑桌面塞满文件的人，他的大脑一定也是乱七八糟的。为了不跟格雷犯一样的错误，在整理电脑桌面的同时，也要清理你的脑袋。如此一来，工作自然会顺利进行，赢得他人信赖，钱也会被吸引过来。看到这里，如果你的反应是“真麻烦”，那么你这一生将永远无法与钱结缘。即使这样，你也无所谓吗？


    电脑桌面不是摆放文件的场所，它只是方便你打开文件的连接工具摆放场所。在此介绍几个整理电脑桌面的诀窍。


    首先，要建立电脑桌面以外的“储存场所”。如果是Windows，本来就有“我的文件”。除了这些，你也可以自己建立专用文件夹。总之，文件一定要存盘在这些文件夹里。


    其次，建立连接各文件夹的快捷方式。只有使用率高的文件需要'
  merge: -1
  img_proc: true
- pgno: 196
  md: '另外建立快捷方式。这样做可以让整个电脑桌面显得清爽而有条理。


    再次，储存文件时，一定要做好文件夹分类。同一个项目的文件可以储存于相同的资料夹。这样就可以大幅缩减搜寻文件的时间。


    最后，就是依你的风格来建立文件名称。只要在建立文件名时花点心思，就能让桌面一目了然。


    # 找不到名片，等于失去了“未来的金主”


    丹尼是汽车经销商业务员。他是“标准胖子”的体型，即使冬天在外面跑客户，还是会汗淋漓。


    一天傍晚，丹尼拜访完客户，顶着一身汗回到了公司。他还有工作要做。他必须写问候信给曾拜访并交换过名片的客户。本来拿到名片就应该立刻寄出问候信，但是，丹尼却一拖再拖。今天他终于有了“回寄问候信”的想法。


    但是，当他拿起办公桌上捆成一束的名片时，顿时露出困扰的表情。“奇怪，怎么会这样？这张名片怎么这么旧？”几天前，丹尼不小心把那捆名片弄掉在地上。这一掉也把名片顺序弄乱了。


    “糟了，这样就不知道哪些人该寄问候函了！”丹尼摇晃着肥胖的身体，不甘心地一边叹气，一边检查每张照片片。那捆名片起码有一百张。丹尼凭着回忆，选出需要寄问候信的名片，一转眼就到了晚上8：00。


    “肚子好饿，明天再寄问候信吧！”说完，丹尼将已经选'
  merge: -1
  img_proc: true
- pgno: 197
  md: '好的20张名片再放回那叠名片上，然后起身，离开了办公室……


    请问，这样的丹尼将会失去几位“未来客户”或者说“未来的金主”呢？


    在商场上，名片当然是不可或缺的工具。不会整理名片的人会在必要的时候无法与重要人物取得联系，于是丧失了商机，也就是失去了赚钱的机会。


    请问，你会如何整理已到手的名片？依行业分类收纳于名片夹？还是依拼音顺序摆在名片盒里？或是归档在方便的转动型名片盒里？抑或跟丹尼一样，使用橡皮筋捆成一束？其实哪个方法都行。你只需确定你喜欢的名片分类法，将名片妥善分类，以便需要的时候可以马上取出那位人士的名片。


    我每个月在演讲会、研习会、读书会上认识许多人，也拿到许多名片。如果使用名片盒保管，一定很费事。所以我先用橡皮筋将拿到的名片捆起来，再在上面贴上日期标签，有时还会在每张名片背后注明收到名片的地点。如此一来，就算名片一大捆，也可以马上重新分类。另外，我还会在名片背面记下主人的特征。这个备注工作如果等到累积好几十张名片才做，会很辛苦。不过，如果能在每次拿到名片时就进行，根本花不了多少时间。如果你凡事都是汇集后再整理的话，注定会失败。养成每天一点一滴处理的习惯，这非常重要。


    几年前，乔治参加了美国中西部的一个政治性筹款活动。'
  merge: -1
  img_proc: true
- pgno: 198
  md: '一位参加活动的客人引起了他的兴趣。乔治看到他有时跟几个人热烈交谈，有时又独自站一边，在手上的卡片上写些东西。当乔治再次抬起头时，他又和别人攀谈开了。很快，他又在手中写着些什么。连续一个多小时他都重复着这个聊天模式。这个人彻底勾起了乔治的好奇心。像多管闲事的邻居，乔治开始琢磨：“这家伙是谁？”


    终于机会来了。当乔治独自站在小吃桌边时，这个人笑容满面地朝乔治走过来，热情地与他握了握手，并自我介绍：“嗨，我叫戴维·史密斯。”他问乔治在喝什么，乔治告诉他在喝白葡萄酒。然后他们开始谈论各自的喜好。无意中，乔治提到自己最喜欢的是桑塞尔白葡萄酒（产于法国中部卢瓦尔河流域）。不过，在整个聊天过程中，乔治忍住了，没有问他刚才一直在记些什么。


    几分钟后，当乔治看到一个朋友经过，正表示歉意准备离开时，戴维向乔治要了张名片。在他转身的那瞬，乔治偷偷看了一下。他知道了！戴维正在乔治的名片上涂写，像上文中提到的一样！乔治又转回身去，开玩笑似的询问：“嘿，我没给你我的三围呀！你在写什么呢？”


    听了乔治这个不雅笑话，戴维哈哈大笑着：“被你发现了！”他把名片递给乔治看，上面写着：桑塞尔。然后，为了满足乔治的好奇心，他把口袋里的名片都掏出来，让乔治看他在每张名片背面所做的备注。刚开始，乔治以为那只不过是戴维用来记住别人的小方法，直到几个月后，乔治才明'
  merge: -1
  img_proc: true
- pgno: 199
  md: '白他奇怪的行为背后自有其道埋。


    一天早晨，乔治在邮箱中发现了戴维寄来的私人明信片。他告诉乔治，自己正在竞选参议员，然后在明信片的最下方写道：“近来可品尝了什么好的桑塞尔白酒？”戴维一下子赢得了乔治的好感。如果乔治住在他所在的州，单凭这样的小感动就可能促使乔治把票投给他。


    接下来就是为名片分类。在分类的时候，自然会挑出“约好下次再见面的人”，这时候就将这张名片归档于名片夹里。比如，我根据“出版”“股票研习会”等类别来归档名片的。未被归档在名片夹里的名片，就是没有约定再见面的人的名片，则使用橡皮筋捆好，放进纸箱保管。纸箱里的名片我会先保管两年，一旦确定不会用到，就将这些名片剪碎后丢掉。'
  merge: -1
  img_proc: true
- pgno: 200
  md: '# 在那些没钱的日子里


    最近，我和丈夫杰西查看过去的个人宣言时，发现其数量多得令人吃惊。杰西就读法学院的第一年，有 6 个月的时间里，我们每个月的收入不到 900 美元，有些月份的收入甚至只有
    650 美元。那些艰苦的岁月，至今仍在我的脑海中呼之欲出，但再次看到这么多数量的宣言还是让我们很惊讶。


    那时候，我们一个月的房租就已经超过 500 美元了。我还是不敢相信，当年我们仍依靠那么一丁点钱活了下来！怪不得当年我们很少吃肉、几乎离不开优惠券、连续几个月都不外出就餐或者买衣服，经常祈祷。总之，我们基于现有收入水平生活。


    我记得当时我们把收入的 10% 捐给当地的教堂，还要支付房租和基本开销，然后祈祷剩下的钱足以支撑到收到下一笔收入前。缴学费的那部分钱，我们已经预留出来并存进银行账户了，除非发生生死攸关的事情，否则不能动它。还好，我们有一份兼职，每个月我们就依靠这笔兼职收入过日子。


    那些年，我们住在一间小小的地下室里。我可以把吸尘器的插头'
  merge: -1
  img_proc: true
- pgno: 201
  md: '插进一个插座里，不需要换插座就能把整间房间打扫干净。杰西读书的第一年，我们的第二辆车就报废了。接下来的两年里，我们共用一辆车。杰西一边工作一边读书，经常忙到深夜。我们几乎不认识居住在镇上的其他人，尽管我们非常努力地结交朋友。


    在那种境况下，人非常容易被绝望吞噬。我不否认，有时我也替自己感到难过，希望能在舒适的环境里生活。然而，最终我还是决定凭借有限的条件创造最好的环境。


    由于我们没钱外出就餐，我会想出一些有创意的方法获得免费的娱乐。我们从图书馆借电影碟、吃自己做的比萨。冬天时，我们会煮咖啡、自己做爆米花。有时候，我们还会去公园野餐或者在美国最大的零售连锁书店巴诺书店的阅读区看书。


    我们也没有多余的钱来装饰公寓，但我还是想法让它看起来温馨、舒适。我努力保持家里的干净、整洁。我想，虽然家不够漂亮，但我可以让它保持干净整洁。我经常会放点音乐，点上蜡烛，然后烘焙食物。食物的香味和音乐让我们觉得富有了些，即便我们手头上没有多余的一毛钱。


    我们负担不起奢侈的美食，也无法去豪华的餐厅吃饭，但这并不意味着我们无法吃得好。我经常尝试做新的菜式，四处搜寻划算的商品、尽可能让我们的日用品用久一点。做这些事情时，我也从中获得不少乐趣。另外，我经常去图书馆借书看，而不是上街购物。


    也正是住在这个地下室公寓时，我开始写博客、查看网络创业之类的资料。要不是闲暇时间很多，没有什么朋友做伴，我可能永远也不会想到写博客。而且你猜怎么着？有一天，窝在那间小小的地下室'
  merge: -1
  img_proc: true
- pgno: 202
  md: '里，我建立了 www.MoneySavingMom.com 这个网站，教其他人如何节省日常开支并学会赚更多的钱。我完全没有想到的是，不到几年的时间，这个网站已成为最大的个人理财博客，帮助世界各地成千上万的家庭改变了金钱观。


    没错，住在一个不熟悉的小镇上的地下室公寓里勉强度日，虽然这从来都不是我自己的选择，但我还是永远心怀感激，感谢上帝让我在那3年半的时间里学会了感恩，学会了热爱简朴的生活并充分利用手头上已有的资源。


    逆境中，积极乐观的心态可以支撑你坚持很长一段时间。你可以选择抱怨玫瑰上的刺，也可以选择欣赏怒放的玫瑰花。


    那么，在没钱的日子里，除了想办法成为一个有钱人之外，我们还可以做些什么呢？


    多想想自己幸运的地方。如果要给值得感谢的事情、对象列个清单，估计每个人的清单都会很长。如果你能喝上干净的水、身上有衣服穿、不至于忍饥挨饿、头上有一片瓦挡风遮雨，你就比很多人要幸运多了。我们很容易把注意力集中在自己所没有的东西上，而忘记感激我们已经拥有的东西。这样做只会养成消极悲观的心态。


    制作一张感恩清单。当我愤愤不平、感到沮丧时，我就逼迫自己努力寻找值得感恩的事。通常我会随意选择一个数字，例如10，然后开始写。一开始时，进展很慢，但一旦开始以后，我就没法停下来了。接下来，我的整个心态都改变了，因为生活中有那么多事情值得我深深感恩。


    不要与别人攀比。世界上总有一个人比你更漂亮、比你更苗条、'
  merge: -1
  img_proc: true
- pgno: 203
  md: '比你更富有、比你更健康、比你更有创意、比你更会规划、比你更有活力。期望变成另外一个人很容易让你荒废一生：祈求拥有他那样的身材、拥有他那样的家人、住在他住的豪宅里、拥有他那样的工作，或者拥有他所拥有而你所没有的东西。但是祈求成为他并不会改变你自身的状况。


    做一个乐施好善之人。杰西就读法学院时，我们常常不知道下个月付账单的钱在哪里，但每个月我们都赚到了勉强度日所需的钱。在收入有限的情况下，我们用免费的优惠券购买杂货，然后把它们分派给挣扎在贫困线上的其他人。另外，我们还会花时间帮助那些需要帮助的人。虽然我们捐赠的金钱、付出的时间都不多，但已经尽力了。帮助他人时，我们感到特别快乐和满足。


    杰西从法学院毕业后，我们的收入大大地增加了，但为了能够大方地捐助其他人，我们仍然继续过这种简朴、不负债的生活。我们在自己身上花的钱越少，能够捐献给别人的东西就越多。确实，慷慨地伸出援手帮助他人所获得的满足感和充实感，比把这些钱花在自己身上要大得多。


    无论你一年赚 10 000 美元还是 250 000 美元，我建议你把捐赠当做预算中最优先的选项。如果你优先考虑捐献，你可能也会像我们一样，奉献得越多，你将来拥有的也会更多。'
  merge: -1
  img_proc: true
