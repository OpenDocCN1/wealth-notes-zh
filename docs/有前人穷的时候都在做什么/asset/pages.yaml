  md: '打个比方说，住房贷款相当于用水瓢借水倒进水缸后，再用水瓢还借用的水。类似这样的情况，优良负债就是有助于增加资产的。相反，不良负债其实是持有了不良资产的负债。


    例如，为了购买汽车，贷款分期付款。由于从买汽车的那一刻开始，汽车不仅不会产生收益，反而开始减少价值，所以属于不良资产。在这种情况下，分期付款相当于持有不良资产。而且，这项资产并未产生一点收益，所以无法回收支付给金融公司的贷款利息和分期付款手续费。用上文提到的那个比喻，贷款买车相当于用水瓢借来水倒进破碎的水缸，为了还借用的水要么重新打水，要么继续借水。类似贷款买车这种情况，属于不良负债，它不能为你增加资产。如果抵押住房贷款购买了车，也是不良负债。


    为了消费而借钱也是不良负债。借来的钱因消费而消失，所以要处理其他资产或赚钱来偿还。负债费用也无法回收，所以也不能增加资产。


    总之，能够增加资产的就是优良负债，除此之外就是不良负债。所以，如果不是为了持有优良资产，尽可能不要借钱。即使是优良资产，也可能会贬值或无法产生收益。因此，为了持有优良资产，借钱的时候，要先考虑清楚资产的期望收益和预想的负债费用等再作决定。过多的负债会产生无法承担的负债费用，造成个人不稳定的金融状态，所以要特别注意。


    为了持有优良资产而借钱，其目的是投资或获得收益，即“借鸡生蛋”。因此只有投资收益减去负债费用后还会有剩余时，才能够作这样的决定。换句话说，如果投资失败，可能会失去借来的钱或无法'
