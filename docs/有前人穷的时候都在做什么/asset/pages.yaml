  md: '去了理智，疯狂地买卖股票。当时的股票交易所里人山人海，大量的买卖单据使股票交易所里的工作人员忙得喘不过气来。而此时的巴菲特却并没有失去理性，他在手中股票涨到20%的时候就非常冷静地悉数抛出。后来，股票市场出现大幅下跌，不少投资者遭受了巨大的损失，甚至倾家荡产，而巴菲特却安然无恙。其原因就是在别人都在巨大的利益面前变得贪婪时，他保持了冷静与理智，从而在这场大股灾中幸存了下来。


    在财富投机上恐惧同贪婪一样是错误的，恐惧与贪婪均让普通人赚不到钱。


    人为什么会害怕的心理？人在做每件事情的时候都会有意识对外界进行预测，当你对外界不能预料的时候，也就是说感觉到自己不能够控制的时候就会产生恐惧了！我们在做一些大型的活动时，为什么要做那么多的准备呢，就是为了能够更好地控制事态，并在我们预想中进行，以免失误。


    害怕失败，对人们的心理产生了极其有害的影响，这种影响体现在以下几个方面：


    害怕失败，使得人们谨小慎微，行动过于保守，往往坐失良机。由于害怕失败，人们力求风险尽可能的小，尽可能没有风险。但是没有风险的事情，往往也是利润较小的事情，这也不是投资者的目标、愿望。人们应该做的事情是高利润、创新性的事情，而这就具有风险。


    害怕失败，不敢给自己曾经做过的品种以足够的投入，这就影响了财富目标的实现，严重的会造成再次失败。由于害怕失败，人们往往不敢在资金、精力、时间上全力投入，而是分散或保留一部分。这样，'
