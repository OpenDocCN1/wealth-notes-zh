    你所需要做的，就是下定决心，开始管理好自己的时间，将其视做一项重要的资产。学会像有钱人那样思考。扔掉那种“我现在每小时只能赚 10 美元，所以我还不如自己洗车”的想法。你需要这样思考：“我会花
    250 美元洗车吗？”答案是显而易见的。当你开始用这种思路来思考问题的时候，你就会换上一种完全不同的心态。


    # 看电视的时间和成为有钱人的概率成反比


    凯瑞是一家房地产公司的职员，每天过着单调的生活，没有钱，单身。由于近年经济不景气，房市供应过剩，让他的销售工作迟迟没有进展。每天，凯瑞都要加班。好不容易回到家，已经是晚上了。凯瑞脱下西装，换了
