  md: '![](img/e4394970edb70b507c05aef8837a7762_166_0.png)


    # 看起来像有钱人，才能成为有钱人


    一个人的外表跟金钱是有关系的。看看你周围没钱的人，不是他们想要这样，但是他们的外表往往已注定了失败。如果可以改变外表，人生就会改善，因为旁人对待你的方式会不一样。人类也会以不同的态度，对待看起来没钱的人。有钱的人都是一派自信，一副趾高气扬的样子。我建议你看起来就要像这样，有自信、抬头挺胸。


    你问我怎么买得起有钱人的服饰？请别就字义直接解释，请作点延伸和联想。人猿可不是靠高级服饰得到族群的尊敬。你走路的姿态比穿的衣服重要，这是你的整体形象。


    但这并不表示你可以随意乱穿，每个人都可以光鲜亮丽。跟亲朋好友借一套体面衣服，或是趁着促销买一套好西装（千万不要在平时用信用卡先付账）。


    看起来像个穷人，你得到的就是穷人的待遇，你做什么都暗淡无'
