  md: '# ## 恐惧与贪心是财富的杀手


    巴菲特说：“当人们因贪婪或受到惊吓的时候，他们时常会在买卖股票时犯下愚蠢的错误。”在他看来，贪婪是财富最大的敌人。许多投资者血本无归，都是由于太过贪婪造成的。


    贪婪是人性的弱点之一，所以，当大多数人面对巨大的利益诱惑时，常常会失去理智，总希望抓住一切机会，赚取最大利润。其后果就是这种不理性的贪婪行为给他带来很大的损失，甚至是血本无归。所以，巴菲特认为，太贪婪的人根本不具备有钱人的基本素质。


    投资者最大的心理敌人就是贪，由于贪念过重，想一夜间暴富，许多投资者在决策和操作上视同赌博，急于下注，却从不进行冷静而科学的分析。投资就有风险，这是投资的基本规律，即使把钱存到银行也不能说没有任何风险，不同的只是风险高低有所差异。高收益的投资往往伴随着较高的风险，这一点也是投资的规律。


    但事实上，贪婪的人往往只看到收益，对收益背后的风险却视而不见。这样一来，投资失败也就是早晚的事情。


    当然，赚钱是投资者进入股市的唯一目的，这说明每个人都贪，但贪也要有度，如果一味地胡贪、乱贪，那么市场最终会毫不留情。有的投资者确实在投资市场上大捞了一把，但由于不懂及时退出，对利润的无止境的追求导致最终还是亏损；更有甚者，有些投资者的贪念随盈利的增多而不断高涨，以致高位套牢，终究一无所获。


    巴菲特的“不贪”心态常常使自己避免了损失，例如，20 世纪60 年代，美国的股票市场牛气冲天，面对巨大的诱惑，许多投资者失'
