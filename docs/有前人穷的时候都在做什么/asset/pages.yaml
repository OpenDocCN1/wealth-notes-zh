- pgno: 107
  md: '# 第4章 消费

    为什么有钱人越花越有钱?


    穿的鞋子、表现出的态度等。面对重要的生意，却穿着一看就知道是廉价便宜的皮鞋时，连带也会影响别人如何评估这个人的实力及商业手腕。然而，如果反向操作，巧妙地利用这种时机与一般人的刻板印象，就算是小公司的业务员，也有机会签下大公司的合约。


    许多旅馆、饭店，也会以客人的外表打扮及行李，来判定这位客人的等级。对一般的饭店服务生而言，客人的小费，是他们收入的重要来源，因此当他们认为“这位客人是有钱人”时，也会展现出有别于他人的殷勤周到。因此我在饭店登记住房时，一定都会配戴高价的名牌手表。


    如同我在上文中所提及的，花大钱买昂贵的高级手表，是种刺激自身欲望的来源。不过实际上来看，一定会有一群人，会因为拥有这类物品，同时也了解其价值，而聚集在一起。这些了解这些物品价值的人，就是“上流社会的人”。与上流社会的人交往，可以非常确定一件事：他与你交朋友的目的绝非为了钱！通常，这些在一般人眼中已经是有钱人的人，都是为了“想成为更出色的上流阶层”“构筑更好的人际关系”等理由而聚集在一起。


    让我举个例子，假设以参加一场门票略贵的音乐会来作说明，相信你就能完全明白我的意思了。


    一张票价1 000元、2 000元的演奏会，可能还不会让听众产生什么特别的感觉。然而若是一张票价要1万元的音乐会，进场后的你一定可以感受到该音乐会的听众们，个个都散发着活力与自信。


    我并不是说，买得起1万元门票的听众，就一定是上流阶层、一定是有钱人。正因为这个理由，所以我应该这么说：来听这场音乐会


