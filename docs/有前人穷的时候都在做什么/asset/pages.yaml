    # 眼里永远只看见西瓜，不见芝麻


    对赚钱而言，最重要的莫过于眼光。没有宏观视野、没有全球市场概念的人，永远只能赚自己家乡一撮人的钱；在现代社会，眼观全球的人，才能成为世界级有钱人。如果我们把市场当成水，鱼是消费者，那些眼光短浅、视野狭隘的人，一辈子都只想在自己身处的小池塘里浑水摸鱼，也不管这个池塘是否快干涸，池子里是否还有鱼，他们眼里就只看到这个小池塘。相反，有钱人的眼里通常只有西瓜，不见芝麻。像巴菲特那样把全球当成一个市场的人，就等于是优游在海洋里的大型渔船，尽情地使用权取之不竭、用之不尽的大海资源。


