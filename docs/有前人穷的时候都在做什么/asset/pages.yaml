  md: '和窗帘相匹配。就着装而言，西服套装总是可取的，而穿晚礼服永远不会出错。


    不谈过激话题。在一个高档的社交场合说话时，千万不要用一个过激的话题来吸引别人的好奇目光。人们并不只是想听到一个话题，而是想听到一个有关此话题的体面说法。


    一般而言，谈论环境是一个不错的话题，比如，环境像蜂鸟的翅膀一样脆弱。此外还可以谈论媒体，比如，媒体总是误导民众。当然也可以谈论棒球，比如，与马球相比，棒球这种运动要更为民主。谈论艺术时，要记住，艺术只是内心世界的一种装饰。当谈论金钱时，要说它是神圣不可侵犯的。如果聚会主人说他喜爱胡萝卜，那你就得提一提彼得兔和康涅狄格州的花园。


    # 要成为有钱人就可少的魔法话语


    要想成为有钱人，就要学习如何成为“让绅士名媛喜爱的人”，以借此机会扩展自己的人脉。而在此过程中，有一些要素是取得成功的关键。这些要素也不仅适用于与绅士名媛的交往、应对上，只要适当地加以调整，也可以套用于所有的人际关系中，可说是万能的“魔法话语”。只要你的态度、言行举止中透露出隐含这些要素的重要讯息，就可以让那些能帮助你成为有钱人的人自然而然地聚集到你身边。


    我将这些要素总结成几个关键词来传递给各位读者。


    关键词一：梦想。想成为富翁，一定要有非常强烈的赚钱欲望。而金钱，也是用来满足个人欲望的。罗曼蒂克的人为了实现人生的梦'
