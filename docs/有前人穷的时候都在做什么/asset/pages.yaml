- pgno: 92
  md: '只有省下来的才是自己的。这些理念难道都是错误的吗？


    我们可以经常看到有些人出没于高档的消费场所，喝的酒多是顶级的、珍藏版的、限量发行的，每一次消费都是几千上万的，奢侈吗？按理说，他们这样花钱，应该是越花越少才対啊，但是事实是，他们的钱却是越花越多，似乎这又印证了“越花钱的人越有钱”的结论。


    讲到这里，肯定会有人心里想：废话，我要是身家有个上亿资产，不要说上亿就是上千万我也会那么消费的。然而，现实究竟是先有花钱的习惯、思维之后才变得有钱，还是有了钱之后才适合花钱请客呢？


    如果是后者，那么节俭可以致富就是正确的了，因为，我们也只有靠自己的节俭才能攢下更多的钱，我们也应该更少花钱，那样，我们也才能早日富裕；但是如果结论是前者的话，那么，我们是不是就说一贯的节俭就是错误的呢？或者有其他
    的奥秘呢？


    社会上节俭的人实在太多了，80%以上的人，都是不断节俭着，把能省的都省下，能少开支就少开支。而对于有钱人呢？他们银行里的存款占到自己财富的 1%都不到，而这些钱也就是为了自己近一段时间花费的开销。其他的钱绝对不会放在银行里，不但不会，反而会想方设法从银行里贷款。银行是什么？银行就是一个把不喜欢花钱的人的钱聚集起来，给那些喜欢花钱的人花的
    地方。所有 80%主张节俭、少花钱的人的钱，都是被那些喜欢“大手大脚花钱”的人所花着，而最可恶的是，这些人越花钱还越多。


    如果你不喜欢花钱，那么结果就只有一个，那就是你的钱让别人来帮你花。


    而为什么越花钱的人越有钱，而越不喜欢花钱的人越贫穷呢？本'
