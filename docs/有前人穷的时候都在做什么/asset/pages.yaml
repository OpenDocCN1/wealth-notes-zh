- pgno: 188
  md: '金钱是息息相关的。这点从我庞大的博客粉丝中，可以看得一清二楚。换句话说，如果想要改善金钱方面的问题，就必须重新审视其浪费或消费的部分，如果不从日常生活开始改善，就无法治本。我深深感到，在意识到金钱的使用方法的同时，也必须重新调整生活才行。


    请做一下下面的小测试：


    +   ◇房间脏乱，需要的东西要找半天才找得出来。


    +   ◇不把跟朋友的约定当回事（比如常常迟到）。


    +   ◇跟同事出去吃饭或喝酒的时候，常常会请客。


    +   ◇冰箱里永远都塞满食物，甚至有些已经坏掉了。


    +   ◇身上穿戴的多半都是名牌货。


    +   ◇一提到买东西，就想到便利商店。


    +   ◇一点都不注重外表（衣服或鞋子等总是脏兮兮的）。


    +   ◇对于自己的缺点总是有一大堆借口（常把“但是”挂在嘴边）。


    +   ◇对任何事都采取逃避态度（常常说话不算话、联络不到人）。


    +   ◇不只是在金钱上“非常随便”，也表现在体型上（也就是肥胖的意思）。


    +   ◇收到账单往往不会马上打开来看，有时候还会搞不清楚当月要付多少钱。


    +   ◇虽然很喜欢买东西，但过几天就会忘记自己买过什么了。'
