- pgno: 51
  md: '引起冲突。卡内基当上监督没几天，纷争就消失了。原来，卡内基规定：“小费全部放在箱内，到月底大家再平分。”到了月底，诺言果然兑现，卡内基按人数平分，从不徇私舞弊。


    一个延续许久的矛盾化解后，每个信差的积极性大大提高。每天早晨，大家轮流提前一个钟头到公司打扫，而卡耐基每天都提前一个钟头到达公司。他正直的品格起了良好的带头作用。


    我们从卡内基身上可以看见：正直表现在行为的各个方面，它是内在高尚品格的外化。在个人的品格中，正直和诚信是一体两面：信任是他人基于你的正直而对你做出的回报。你获得了别人的信任，就意味着你获得了可靠的收入。正直要求我们必须坚持自己的原则和价值观，坦然地面对不公和错误，及时予以纠正，并将所作所为规范在道德准绳之内，绝不能抱任何侥幸心理。


    今天，我们在向卡内基先生学习的时候，可以认真思考一下，自己在正直方面还有哪些不足之处？在面对金钱利诱的时候，你能否泰然处之？面对公司（同事）利益与自己的利益发生冲突的时候，能否做到公私分明？在面对朋友和陌生人、亲疏不同的同事的时候，你能否公平、不分内外？在面对邪恶势力和不公平待遇的时候，你是否能刚正不阿、奋起反击？在面对部属和上级的时候，你是否都能做到不卑不亢？


    一些似乎并不起眼的细节却反映出人性的内蕴；一个小小的失误就会让你蒙受巨大损失。正直是一个人通往财富之路的扶梯和基石。'
