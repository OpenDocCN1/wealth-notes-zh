  md: '自己跑进来口袋”的意思。像这种运用“金融资本”赚钱所产生的思考回路，我称它为“投资脑”。


    在美国，有许多人被称为“有钱人”，但是这些有钱人其实大多都是“劳动富翁”，也就是因为认真劳动而变成有钱人的人。但是另一方面，真正的有钱人是即使不用劳动也够赚钱的“正牌大富翁”，这些人大都拥有“投资脑”。


