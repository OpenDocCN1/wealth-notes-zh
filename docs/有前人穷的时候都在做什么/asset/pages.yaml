- pgno: 182
  md: '有钱人把时间看成自己最宝贵的财产，在他们看来，很多人对待时间的方式似乎都让人费解。有钱人之所以能够成为有钱人，就在于他们拥有足够的远见，懂得让别人来修剪自己的草坪，打扫自己的房间，这样他们就可以有更多的时间去追逐自己的梦想。时间和金钱之间有直接的联系，有钱人非常清楚，实现梦想的秘诀就在于最大限度地利用自己的时间。


    要想更好地理解自己利用时间的方式，不妨举个洗车的例子。问问自己，你是如何看待洗车这件事情的呢？大多数人可能都会说，“我才不会花 9.99 美元让人来洗车呢，我完全可以自己洗。”于是他们就这么做了。


    可不知你想过没有，如果自己洗车的话，你需要花费怎样的成本。准备洗车的工具和洗车加在一起差不多需要 1 小时的时间，也就是说，为了节省 10 美元，你需要花掉
    1 小时的时间。


    但如果你能换种思路，让别人来洗车，这样你只要等上半个小时就可以了。不仅如此，在这半个小时里，你还可以读一本书，学到更多更有价值的东西。如果你能够有效地利用这段时间，它所给你带来的收益将远远超过
    10 美元。


    换油也会浪费你很多时间。只要花上 16 美元，你就可以在沃尔玛让人帮你换油。我知道有些人会选择花 10 美元买工具，然后再用 1 小时的时间来完成所有工作。不过，这样总共也只能为他们节省
    6 美元。如果你用这一个小时来做一些对于实现自己梦想有用的事，它所带来的收益也绝对不止 6 美元。


    请问问自己，你的潜在价值有多少？我不是说你现在的价值，而'
