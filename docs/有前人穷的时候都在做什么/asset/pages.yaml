- pgno: 167
  md: '光。穿着真的有帮助，穿得像有钱人，大家会以为你有钱，而且待你态度恭敬。学习有钱人的穿着，要看起来低调而高雅。有质感、简单又经典的样式是有钱人的穿着习惯。一个好发型、干净的指甲……我相信你了解种细节。


    不止穿着要像有钱人，还包括其他很多方面。还记得歌舞剧传奇巨星雪莉·巴锡那首老歌吗？“当你走进夜总会，我就能看出你是一个与众不同的人：一个真正的大富豪。貌似潘安，风度翩翩。难道你不想知道我正在想什么吗？”


    当医生用讨厌的小锤子敲击你的膝盖时，你的小腿会抽动一下。你的身体还有另一个本能反应：当你感受到幸福快乐、觉得自己是一个胜利者时，你会无意识地昂首挺胸，嘴角不自觉上扬，眼里荡漾着柔柔的笑意。


    这就是胜利者一贯的表情。他们的姿态和举止，都显得很有自信，笑容中也充满了自豪。毫无疑问，良好的姿态透露出你是一个非常成功的人。


    下面这个技巧的目标不是让你看起来像一个挥金如土的暴发户，而是让你在别人一看到你时就觉得你是一个如假包换的有钱人。


    现在，想像一下你正在走进一道门。那道门可能通往你的办公室、会议厅甚至你的厨房。同时，想像你是一位世界著名的走钢丝杂技演员，你要穿过这道门，迅速地奔向舞台中央，你将用身体的平衡吸引台下观众的目光。


    设想门框上悬挂着一小块钻石，它刚好在距离你头顶1英寸（约0.3厘米）的地方晃悠，你要努力用脑袋碰到它，这会拉升你整个人的曲线。'
