- pgno: 119
  md: '钱全部转到投资存折。这些最好在各种金融产品的自动转账日期之前操作。


    从投资存折中自动转账支付各种投资产品后，把剩下的钱全部转到备用存折。备用存折中的钱除了备用资金以外，如果已积攒了一大笔钱时，就可以投资股票或基金等。


    如果你按上面所说的，重新设计了自己的理财系统后，可能会遇到一些麻烦，尤其是刚开始的几个月，可能还会出现操作失误。但我向你保证，用不了多久，你就会发现这是一个非常便利的理财系统。


    每年至少检查一两次理财情况，其最重要的目的是确认收入中存了多少钱，和上一年比起来增加了多少净资产，并分析原因，努力改善。


    # 先投资后消费，才能滚出第 N 桶金


    有钱人对自己的生活成本一清二楚。而记录开支，通常会带来两个好处：其一，只要把握了自己的当月光销，你就清楚有多少钱可以用来投资；其二，它还可以让你为每一笔开支负责，这显然会鼓励大多数人厉行节约，遏制消费。


    下一个步骤是要精确计算你平均每个月能拿到的报酬。


    从月收入中扣除每月的平均开销，就能得到每个月可用于投资的金额。不要等到月底再去投资，而是在拿到薪水那天就把这笔余钱转存进你的投资存折或账户。否则，到了月底的时候，你永远都不会有足够的余钱（只需彻夜狂欢几个晚上）去贯彻自己的理财计划。'
