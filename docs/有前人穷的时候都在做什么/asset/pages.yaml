    想，也就充满了斗志，这斗志就是激励赚钱的最大动机。因为，只有赚大钱，才能实现“美梦”。


    关键词二：施舍。越有钱的人越小气，赚过钱的人才知道赚钱的困难，但他们一定懂得适度“施舍”，因为施舍也是赚钱的重要手段。白手起家的人，一定待己俭朴，一条毛巾可以用到破，一块香皂可以磨到完，但他知道赚钱是靠大家一起完成的，因此，他绝对乐于与他人分享。


    关键词三：上进。如果你已习惯朝九晚五的上班族生活，整天上班、下班，日复一日，任凭岁月流逝，你一定成不了富翁。一个积极想要赚钱的人，绝不以温饱为满足，一定想要让生活多姿多娯，天天充满赚钱的活力。具备了这个要素，再坏的天气，再苦的工作，你也会心甘情愿地去做。而当你养成了这个赚钱“习惯”后，财富自然愈来愈多。


    关键词四：渴望。社会上的大富翁，出身背景往往呈现两极化，不是继承祖业的企业家第二代，就是从小贫困、白手起家的创业者，而后者的能力和累积财富的持久力大多优于前者。这充分说明，一个生长在贫穷家庭的小孩子，因为穷怕了，所以有着比一般人更强烈的赚钱欲望。


