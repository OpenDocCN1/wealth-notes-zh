- pgno: 153
  md: '有钱人把煤卖了又雇了几个苦力，一天下来，他除了给工人开工资的钱，剩下的钱还比穷人赚的钱多好几倍。


    一个月很快过去了，穷人只挖了煤山的一角，每天赚来的钱都买了好吃的好喝的，基本没有剩余。而有钱人早就指挥工人挖光了煤山，赚了不少的钱，他用这些钱投资做起了买卖，很快又成了有钱人。


