- pgno: 43
  md: '行动来达成自己的目标。她想到了“开心周五”活动,周五时,妈妈们可以把自己的孩子留给她照看,她组织孩子们一起玩游戏和参加各种活动。同时,她还找了一份一周工作一个半小时的兼职清洁工作,孩子们则交给丈夫照看。


    她把“开心周五”以及做清洁赚到的钱都存入买相机的账户,并以百分比的形式来衡量达到目标的进展状况。每隔几周,她就会更新一次数据,写明她现在距离目标还有多远。当她一步一步靠近终点时,我们都为她兴奋不已。


    在清洗了34个马桶、清扫了190个房间、替别人照顾小孩25个小时后,也就是4个月后,琳德塞达成了自己的目标,用现金购买了一部新相机。激动不已之余,她告诉我,存钱和等待的过程非常艰辛,但付出这么多后,最终获得的回报也是喜人的,也让她更加珍惜这部来之不易的相机。与此同时,她存钱的过程也让她有时间研究哪部相机的性价比最高。比如说,她最终就选择了另外一部性能更好的相机,而不是最初看中的那一部。


    我很欣赏琳德塞这种热情和埋头苦干的劲头。她并没有因为现实的经济情况不允许她购买一部新相机而什么都不做,只顾着抱怨。她也没有在自己负担不起时刷卡买相机。她制定了一个大目标,然后把它分解成“容易下咽”的目标,据此来确定她每周必须达到的目标,然后就开始埋头苦干了。


    她的耐心和坚韧终于有了回报：不仅用现金购买了一部全新的专'
