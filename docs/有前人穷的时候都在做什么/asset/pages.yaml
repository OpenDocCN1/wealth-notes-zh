  md: '![](img/e4394970edb70b507c05aef8837a7762_180_0.png)


    # 时间是最重要的资产


    有钱人最重要的资产并不是他的钱，不是他的车子、房子，甚至不是他的公司，而是他的时间。在我们拥有的所有资源当中，只有时间是真正有限的。每个人都可以去赚更多钱，可以买新车，但我们永远不可能买到更多时间。每个人在这个地球上生存的时间都是有限的。


    我发现，在时间的问题上，有钱人和常人的想法迥然相异。正是这种区别每年带给他们成百上千万美元的收入。正是这种思维方式上的差异造就了穷人和有钱人在生活上的天壤之别。


    从来没有人能够清楚地阐释时间的价值，但只要留意那些有钱人，你就会发现，这些人身上都有一个共同的特点：他们懂得珍视时间。对于他们来说，时间是最可宝贵的财富。其他一切都可以被看成是无限的资源：如果丢了钱，你还可以通过努力去赚更多；丢了车子，你还可以再买一辆；丢了房子，你还可以换套新的。'
  merge: -1
  img_proc: true
- pgno: 181
  md: '但时间对于任何人来说都是有限的，一旦失去了时间，你就根本不可能再找到任何东西来替代它。我们都有足够的时间来实现自己的理想，但与此同时，我们的时间资源又都是有限的。在这段有限的时间里，你可以选择为这个世界留下一笔财富，也可以晃晃悠悠地虚度光阴。时间一旦被偷走，就再也无法挽回。


    可不幸运的是，大多数人都没能看清这一点。他们并没有足够重视自己的时间，更不懂得去精心守护自己的时间。这种态度让他们失去了原本可以帮助他们实现梦想的时间。


    有钱人意识到，时间其实就像是未来的种子。你每天为自己的未来播种多少，取决于你每天是如何运用自己的时间的，你的未来就在于你播种的方式上。


    你的时间都用来干什么了？你是否用它来实现自己的梦想，还是


    在无所事事地浪费时间？再过6个月、1年、5年，你可能仍然跟这个社会上95%的人没有任何区别，你不懂得守护和利用好自己的时间，于是你的梦想也就永远只能是梦想。


    但只要能够了解这一点，并把它记在心里，你就可以改变自己的未来。这种改变可以让你进入有钱人的行列，因为有钱人绝对不会浪费自己的时间，他会最大限度地利用每1分钟。对于他们来说，时间是一种绝对无法取代的资源。


    每个人都可以用时间来换取自己想要的东西。只要使用得当，你所花费的时间就会让你的生活发生变化，从而会让你得到自己想要的东西。你需要学会重新组织自己的时间。在利用时间这个问题上，有钱人都掌握一些基本的方法，这些方法是任何人都可以学习的。'
