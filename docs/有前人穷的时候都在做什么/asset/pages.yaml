    老人帮她接过箱子就朝检票口走，虽然看起来他是那么的不堪重负。不一会儿，火车慢慢启动了。胖太太抹了一把汗，庆幸地说：“要不是你，我非误车不可。”说着，掏出一美元递给老人。老人并不推辞，微笑着伸手接过。


    这时，列车长走了过来，对老人说：“您好，尊敬的洛克菲勒先生，欢迎您乘坐本次列车，我很乐意为您效劳。”“谢谢，不用了，我只是刚刚做了一个为期5天的徒步旅行，现'
