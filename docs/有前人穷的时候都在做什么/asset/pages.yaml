  md: '分为 8 种类型：狮子（积极稳健）、秃鹫（积极冒险）、野狼（随机冒险）、猎豹（谋定狼取）、鳄鱼（智谋投机）、骆驼（保守稳健）、树袋熊（保守无为）和兔子（随性无为）。由于泰诺斯没有为这
    8 种类型命名，我称之为“投资星座”，它们各自的投资特征如下：


    狮子：王者。代表无畏，不管市场如何变化，总是能用自己的方式来应对风险，相信自己的投资策略，多喜欢投资蓝筹股。


    秃鹫：对变化很敏感，相信直觉很少犹豫，愿意接受新的投资概念和投资品种，偏好高成长股票。


    野狼：喜欢刺激和投机，追求立竿见影的高报酬，投资时常出现大赢大输的局面。


    猎豹：快。代表捕捉机会，深谋远虑，只要机会来临，就能一击即中。喜欢可行性高、大胆的新计划，并挑战被普遍接受的投资策略。


    鳄鱼：狠。代表冒险精神和与众不同。不怕高风险，敢于与众不同，认为高风险背后蕴含高收益。能承受高风险，对高收益投资感兴趣。


    骆驼：积蓄能量。代表回避风险，少亏就是大赢。重视传统，倾向低风险且稳定报酬的投资。


    树袋熊：对钱不太感兴趣，更喜欢与人相处。用钱节省，投资保守，喜欢收支平衡的理财投资方式。


    兔子：充满创造力，但不擅长投资。


    认识自我的重中之重，就是要清楚自己的投资星座。动物们的捕食风格都很鲜明，物种不同、生存方式不同、捕食风格也大不相同。如果狮子用兔子的方式捕食、猎豹用骆驼的方式捕食、鳄鱼用树袋熊的方式捕食，不但荒唐可笑，而且无法生存。投资亦是如此。各人的'
