  md: '比尔·盖茨说：“我总是坚持这样的理念：做生意是一种创新。如果总是跟在别人的后面，踩着别人的脚印走路，赚钱是非常困难的。”


    这是一条朴素的商业原理，但也是一条充满智慧的原理。要想创业，就应该走自己的路，出奇制胜，用自己的慧眼去发现别人还没开创的事业。如果只是跟在别人后面跑，走别人走过的路，人们做什么你也做什么，只能把原本宽裕的经营市场挤得很窄，无法维持。别人根基稳，还可减产，而你也许多没有太雄厚的财力，早已倾囊而出，最终的结局往往就只能是等待破产了。所以，要想赚钱，就应该走自己的路，出其不意，用自己的独到思维去发现别人未做过的生意。


    有钱人总是在不断地挑战一切，包括他们自身在内，所以这些人虽然早已经是“亿万富翁”，拥有的金钱一辈子也花不完，仍然每天拼命工作，他们的目的是在创造财富过程中享受创新的快乐。


    一提饰品店，大多数人都会想到女性饰品店。的确，卖女性饰品的店很多，而且生意似乎都很红火。可是，有人却“冒天下之大不韪”，开了一家男性饰品店。


    这个人认为，男人的饰品更有经营的空间，因为这样的店很少，而男性又有这方面的需求。并且，这种店投资不多。但由于男性都不太擅长讲价，所以只要在进货时多注重一下品质和材料，就可以转手卖出高于原价几倍的价格。


    这个男性饰品店开业后，很快就顾客盈门。不到一个月的时间，店主就收回了成本，而且开始大幅赢利了。店主说，自己信心很足，接下来打算物色一个适合的商场，再开一个男性饰品专柜，毕竟现在这个领域做的人不多。'
