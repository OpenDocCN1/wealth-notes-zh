- pgno: 89
  md: '衣服、手表、首饰、名牌包、鞋以及其他奢侈品？是什么让他们在奢侈品的专卖店门外辛苦排队数小时，并忍受无礼的对待？难道这一切只是为了有一只印着巨大商标的帆布包？为什么中国的普通行政人员愿意用整月薪水换取一只
    Gucci 的钱包？为什么在香港，上至富商巨贾下至平民百姓，都有一只或几只瑞士手表？为什么韩国的白领女性将 Ferragamo 鞋子视为基本装备？


    答案就藏在人们财富观念的改变里。现在，血统、家族之类的“先天性标志”已经靠边站，人们有了崭新的确立社会地位、展示个人形象的方式，那就是“以财富论英雄”。人们不用再担心自己的出身，只要赚到足够的钱，就能成功上位，赢得尊重。


    但是，怎么才能将银行存款转化为相称的社会地位，为自己赢得尊重呢？那就是名牌消费品。生产者把自己的商标包装成醒目的品牌标志，跨越了语言障碍，让人们用唾手可得的简便方式，明确无误地显示自己雄厚的经济实力。如果你拎着一只价值
    500 美金的 LouisVuitton 皮包，那就等于告诉周围人，你家底殷实；如果你手上挽着的是一只招摇的价值 10000 美金的 Hermès 铂金包的话，毫无疑问，你就是显贵人士。


    在这个创富时代，人们认为自己的衣着方式能充分代表并展现自己。Ferragamo 鞋与 Gucci 包不仅仅是女孩们对潮流的追逐，Rolex 手表与 Armani
    套装也不仅仅是男人们的名利场装备，它们标志着一种社会阶层。你穿戴的名牌展示着你的身份和自我价值。崭新的、用名牌划分社会等级的方式正在替代原有的划分标准，其依据就是你的
    Chanel 套装和 Cartier 手表。'
