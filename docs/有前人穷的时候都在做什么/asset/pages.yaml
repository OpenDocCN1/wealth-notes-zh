- pgno: 189
  md: '怎么样？如果你有5个以上选项的话，就要注意了。你已在不知不觉中过着没有钱的生活了。


    # 金钱问题就是生活问题


    下面为大家举个金钱跟生活息息相关的实例。


    我的朋友卡莉（33岁，单身，上班族），明明月薪高达8000美元，却还是债台高筑、没有钱。她看起来是个非常精明干练、成熟稳重的人，一点都不像“负翁”，没想到负债总额居然高达7万美元！


    开始，我还以为她负债的原因是由于女性的通病，也就是购物依赖症，没想到竟然是因为她是个人众公认的美食家，一个月的伙食费高达3000美元，这实在太多了。再仔细追问下去，她每个月居然还要付3000美元的保险费。月薪有8000美元，而且还是位单身贵族，有必要支付那么高额的保费吗？


    那么，卡莉明明有那么高的收入，却还是债台高筑、没钱的原因是什么？


    +   ◇伙食费太多了（应该要控制在收入的15%~18%）。


    +   ◇保险费太贵了。


    +   ◇还款额度太高了（虽说欠债还钱，天经地义，但如果收入无法支撑还款额度的话，财务就会出现缺口）。


    对卡莉来说，以上皆是。就是因为这些原因，导致她生活捉襟见肘，靠信用卡预支现金，形成恶性循环。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '最让人觉得不可思议的是，换作是一般人，早就应该对这些过高的数字产生疑问了，而卡莉却浑浑然不觉。于是，我让卡莉做“生活自我测量表”，结果发现：


    +   ◇ 冰箱里明明还有堆积如山的食物却还要买。


    +   ◇ 上班太累了，实在提不起劲自己做饭。


    +   ◇ 经常买地下美食街的食品打发一顿。


    当然，冰箱里的食材也常常没来得及吃完就坏掉了。既然如此，我建议她如果要买熟食的话，就别再囤积食材。而且因为熟食实在太贵，不妨试着在假日自己煮饭。


    卡莉表示愿意在可能的范围内自己做饭。当然，有时候还是会买熟食来吃，但是购买方式已经改成只买必要的东西，同时也已经养成尽可能先把冰箱里的东西解决掉的习惯。这么一来，她的伙食费便轻松地减少了30%。可见她以前花了多少钱在食物上。而且，不止省了钱，还有一件令人开心的事：原本身材有点丰满的卡莉，在改变生活习惯之后，可能是因为减少了油脂摄取量，身材似乎苗条了一点。


    当我告诉卡莉这个发现时，她很高兴地告诉我，只一个月，她的体重就已经减轻了3公斤。“没想到改变生活方式之后，不光有钱了，对美容及健康也有益处。一直以来，不管是我的生活习惯还是花钱方式都乱七八糟的。”卡莉这样说。


    由此可知，金钱和生活是会互相影响的。卡莉已经切身感受到，不良的生活习惯跟浪费是一体两面。所以，想要有钱的必不可少的一'
