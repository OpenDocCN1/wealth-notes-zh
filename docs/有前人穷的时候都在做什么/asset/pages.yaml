    看你身边大多数有钱人，你知道他们的钱大部分都是通过投资房地产赚回来的，“上帝，这些家伙真是太幸运了。”可事实并非如此——你只是看到了他们的收获，却没有看到他们在办公室里奋战的情景。


    正像我前面说过的那样，为了寻找成为有钱人的秘密，我读了无数的书，听了无数的 CD，只有在付出所有努力之后，我才突然领悟到有钱人和我们的想法有多么不同。


    我至今还记得自己第一次买下一块不动产时的情形。看到这块地皮的时候，我突然想起自己几年前看到的竟是同一块地皮。


    我向经纪人询问它的价格，经纪人告诉我 是 22.5 万美元。'
