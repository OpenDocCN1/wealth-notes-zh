  md: '们都存到子女大学教育基金账户，或者为度假和购买家具存钱，或者为她和丈夫的个人退休账户存钱。


    使用现金、坚持预算完全改变了他们的消费方式。他们不再因为临时起意、疯狂购物致使支票簿变薄而觉得压力过大。他们偶尔还是会狂欢购物，但他们还是会坚持做预算，只使用分配在购物开支项上的金额。


    用现金支付能够让你更好地掌握财务状况以及现金的去向。而且，用现金购物的话，你立刻就得经历这种痛苦：你从信封里拿出现金支付，信封里的钞票变得越来越少。这种直观的感受只有使用现金结算时，你才能切实体会到。


    # “花在哪儿”比“花了多少”更重要


    “我对于一名男性拥有多少财产完全不感兴趣，我真正在意的是他用钱的方式。”说这句话的，是曾引起时尚界大革命的可可·香奈儿。她一手创造了知名品牌“香奈儿”，除了身为香奈儿的设计师、女性实业家外，她丰富多彩的感情生活也是众人瞩目的焦点。


    由香奈儿的话中可以得知，像她这般的上流名媛，是以对方使用金钱的方式，作为一个值不值得交往的判断依据。


    一同用餐时如何付款、身上穿着什么样的衣服、使用了什么样的随身物品等，这些全部都可以作为判断的标准。


    此外，也会有人以去海外出差时的状况来评定一个人，例如对方'
