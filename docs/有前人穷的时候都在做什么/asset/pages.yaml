- pgno: 66
  md: '“。”也就是说，事实上所有的障碍都是可以跨越，可以克服的。


    有钱人喜欢迎接挑战。他们总是在寻找可以攀登的山峰。而对于一般人来说，他们总是在遇到高峰的时候选择绕道而行。他们想要回避问题，想要从自己的生活中剔除所有的负面因素。当然，在这种思维方式的指导下，他们永远不会有任何改变，也不会有任何成长。而成功人士则会把问题看成是对自己有利的东西。


    每次读到童话故事时，我们总是喜欢各种“完美”和“无忧无虑”的结局，只有这样的故事对我们才有吸引力。可我们却经常会忘记这样一个事实：这种结局往往是经过各种考验之后才会得到的，而到达结局的过程就是考验你信念的过程。


    当你开始学会像一名有钱人那样思考、行动的时候，你就会用一种不同的角度来看待眼前的问题，你会学会用一种不同的方式来解决问题。一旦改变了自己的内心世界，你会发现以前各种可能让你消沉或焦虑的因素突然之间荡然无存了。如果想要进入下一个层次，你首先就必须学会解决而不是回避问题。你这一生能够取得怎样的成就，在很大程度上取决于你如何应对自己所遇到的问题。


    我曾经见过很多这样的人，在他们看来，所谓成功，就是事事如意，要风得风，要雨得雨。可问题是，越是成功的人，他所遇到的问题就越多。成功与问题本身就是一对孪生姐妹；但另一方面，你所解决的问题越多，生活也就会变得越美好。


    如果你能够学会解决工作中的各种问题，你的上司就会非常欣赏你。你在他的事业中就会变得无可替代。他会不断地给你加薪、升职，想尽一切办法把你留下来。你希望自己的工作有保障吗？最好的方式'
