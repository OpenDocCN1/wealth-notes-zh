    # “完全不可控”才是真正的风险


    假如你眼前有两台赛车。A车的故障率是零，5年内不曾发生事故，也都没有故障。每次都以非常好的成绩跑回终点。


    B车每次回到维修区时都会出现故障，每次都需要修理。基本上就是边修理边跑的状态。所以和A车比较起来，赛车的成绩没有那么好。虽然这样，每次也都可以跑回终点。


    那么，请问一下大家：如果要买这二辆车的其中一辆，你会选择哪一辆？


    我想，大多数的人应该都会选择A车。理由很简单，因为这辆车是零事故的“优等生”。跟老是有故障的B车比起来，当然零事故又没故障，比赛成绩还很好的A车才是最佳选择。'
