- pgno: 138
  md: '股票投资中的情绪问题有关。大家知道，股价是大量市场情绪的集中体现。股票的内在价值在一定时间内是相对恒定的、客观的，但股价却经常大幅波动，更多的是市场情绪化的合力，是市场所有投资者的情绪集体投票的结果。


    人的情绪是主观而疯狂的，时而疯狂看涨，时而悲观看跌。看跌时，即使股票实际的内在价值很高，也会被投资者疯狂抛售，从而导致股价变得很低。也就是说，股价固然和价值有关，但更多的是和市场情绪有关，股价所反映的更多是市场情绪。如果不了解市场情绪，只单独片面地分析研究股票的内在价值，就难以真正透彻了解股票的内在价值。


    所以，我想到了另外一种比喻，或许更恰当。情绪就像面粉，而股票的内在价值就像馅，如果股价中包含的内在价值更大，那情绪就相对较少，那么，这只股票就像中空带馅的优质甜甜圈；如果股价中包含的内在价值较少，而情绪较多，那么，这只股票就像劣质甜甜圈；如果股价中包含的内在价值少到忽略不计的程度，那么，这只股票实际上就是没馅的面包，而不再是甜甜圈了。


    甜甜圈有甜甜圈的吃法，面包有面包的吃法。同理，证券市场就像风云突变的大海，股价变幻无常，诡秘莫测，而投资就像在大海中航行，时而风平浪静，风光旖旎，让人感觉无限惬意；时而好似在惊涛骇浪的风雨中飘摇，巨浪中蕴藏着的无穷风险让人胆战心惊。不同的人在股价飘忽不定的大海上驾驶投资这艘船，就有不同的风格，形成不同的流派：甜甜圈派、面包派等，而甜甜圈派的投资方式，完全迥异于面包派。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '甜甜圈派认可股票的内在价值，忽视情绪的影响，实际上是市场上的价值投资派。甜甜圈派进行投资，就要挖掘寻找那些皮薄馅多的优质甜甜圈，对优质甜甜圈进行估值，通过估值判断甜甜圈的合理价值，在市场价格低于其内在价值时买入，在市场价格回升到合理价值或超出其合理价值以后卖出，实现甜甜圈派的价值投资。


    面包派忽视股票的内在价值，只看重面包的性质、颜色和质地。面包派认为，股价可以充分反映市场上的所有信息；历史可以重演；以往的股价走势对未来的股价走向有指示作用。


    因此，有的面包派通过研究分析过往的股价、交易数量等市场数据以及由此形成的指标、图形和形态，对未来的股价走势进行判断；有的面包派将面包的信息数据归纳总结，进行数据挖掘，形成公式，定型为指标，通过总结指标的规律性，得出投资判断；还有的面包派对市场价格直接形成的图形进行总结，得出一定的规律，用历史经验来得出决策结论；更有的面包派用自然界存在的一些神奇数列如费波拉比数列等，对股价进行预测，并以此指导投资。面包派是投资流派中的第二大派。


    面包派大都为甜甜圈派所不齿，被鄙视为不入流，不具有实际操作性，但如索罗斯、西蒙斯等面包派的代表人物，却取得了比大部分甜甜圈派更辉煌的投资业绩。


    其实，两种派别各有优劣，最好综合利用二者的优点，避开二者的弱点。比如可以用面包派的方式，但挑的是甜甜圈。通过研究市场的情绪，掌握甜甜圈的周期性波动规律，在低谷买入甜甜圈，在市场情绪狂热时卖出甜甜圈，则更容易获利。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 止损：投资者的第一军规


    股市中有这样一个关于止损的说法：鳄鱼法则，可以充分说明止损的重要性。鳄鱼法则的原意是：假定一只鳄鱼咬住你的脚，如果你用手去试图挣脱你的脚，鳄鱼便会同时咬住你的脚与手。你愈挣扎，就被咬住得越多。所以，万一鳄鱼咬住你的脚，你唯一的机会就是牺牲一只脚。在股市里，鳄鱼法则就是：当你发现自己的交易背离了市场的方向，必须立即止损，不得有任何延误，不得存有任何侥幸。鳄鱼吃人听起来太残酷，但股市其实就是一个残酷的地方，每天都有人倾家荡产、血本无归。


    那么，到底什么是止损呢？所谓“止损”就是停止损失，是当你断定自己的投资方向和市场的走势相反时采取的一种措施。在《股票投资的24堂必修课》中，欧奈尔指出：“止损是最后的保护性措施，是对错误的投资方向的果断处理，是投资的第一要义。”


    对于投资者而言，止损的目的是保护自己免受难以恢复的损失。不论是投资新手还是有经验的投资者，都会犯错，如果不能很快止损，你迟早会遭受巨大的损失。所以，用头脑、教育、自负、顽固和骄傲来代替完善的卖出规则的制定和执行，结果是致命的。


    当你买进某只个股的时候，你总是希望赚钱。当你不得不卖出它而承受损失的时候，你会觉得心痛而且不愿承认自己错了。你宁愿等一等，希望价格能回到原位。


    更糟糕的是，当你卖出股票止损的时候，可能有半数股票的价格却回升了。于是你会觉得非常沮丧，你会认为卖出股票是错的，止损'
  merge: -1
  img_proc: true
- pgno: 141
  md: '是个糟糕的选择。而实际上，止损是个非常关键的卖出规则。回顾历史，大多数投资者都是在这个问题上犯糊涂，栽了跟斗。


    我们不妨这样想：你为自己的房子买过火险吗？那么你的房子着火了吗？如果没有，你有没有认为买火险糟蹋了钱而觉得沮丧呢？你会不会在下一年不再买火险呢？那么，你为什么买火险，是因为你觉得房子会着火吗？当然不是，你买保险只是为了保护自己免受无法承受的损失。其实，这也是止损所要达到的目的。


    成功投资需要时间把止损当学费。成功投资不会一夜间实现。很多投资者就花了两三年才弄清楚整个系统是怎么回事。对于大部分人来说，学习的过程是大致相同的。随着时间的推移，你会越来越善于选择股票，损失也会大幅下降。而且，这些较小的损失也会由于你在其他赢利股票上获利丰厚而抵消。


    不妨把这些可控范围内的损失当做付给股市的学费。许多人都认为投资大学教育是聪明的决策。他们并不认为这是浪费，因为他们希望学位能带来事业上的成功。股票市场上也是如此。


    任何值得努力的事情都需要花时间去学习。职业球员不是两三个月就能培养出来的，成功的投资者也一样。成功人士与普通人的唯一区别就是他们有决心和毅力。


    不过，作出止损决策时要摆脱感情因素的影响。毕竟，由于下跌50% 而决定卖出某只你几星期前刚买入的股票，不会是件开心的事。于是你的感情因素起作用了，你会为了自己当时的买入决策而辩护，证明继续持股是正确的，尽管你已经在赔钱了。


    巴菲特说：生命的第一条规则是生存。第二条规则是只要能够让'
  merge: -1
  img_proc: true
- pgno: 142
  md: '第一条成立，不要管其他所有规则。做投资，保存实力是绝对重要的，这也是投资者的第一条军规。


    # 像军人一样守纪律


    投资，部分是理性，部分是情绪。对于大多数普通人而言，在股市进入牛市时，容易亢奋、冲动，常有“像买菜一样买股票”的豪情；而在熊市时，却变得过分谨慎。随着牛熊转换，对风险的承受程度也在非常保守与非常进取之间来回切换。而投资成功了的有钱人都知道，当市场理性而平静时，很难赚到钱。而当市场亢奋或恐惧时，从情绪波动过大的交易者身上赚钱，却是很容易。他们会把便宜的筹码像垃圾一样扔给你，而把已经存在大量泡沫的筹码像宝一样接过去。


    有钱人要么执行长期投资，要么如猎豹般等待有限的机会。而普通人由于情绪冲动，总是追涨杀跌，似乎急着要把资金献给市场。


    利弗莫尔曾说过，投资者应在操作中形成自己的准则，并严格遵守。生市场的气没有任何好处。投资者在买入股票前后，应保持清醒，摆脱“身在此山中”的迷思，及时定下投资纪律，严格遵守当初制订的投资计划，并通过写投资日记，培养良好的投资习惯。


    在变化多端的市场中，只有坚守“投资纪律”，对各种风险进行有效的管控，以构筑坚固的盾，投资之矛才能更显锋利。


    不过，世间的事总是说时容易做时难。无论是投资、减肥或向着任何人生目标的奋斗，最困难的并不是不知道怎么做，而是知道之后执行的毅力、行动的决心，也就是执行纪律的坚决性。即使你有适合'
  merge: -1
  img_proc: true
- pgno: 143
  md: '的投资交易系统，但是如果不遵循它的规则，不守纪律，不严格执行，那么，交易的结果必然还是一团糟。因此，无论决策如何完美，只有被有效执行，才能得以实现。严格执行投资纪律，依照既定的交易计划行动，就是投资纪律的体现。


    成功者与失败者的差别，不全在于智慧和知识的差别，更在于执行力的差别。纪律，是一种人生态度，是投资者依据的法则和原则。巴菲特在交易的执行力方面也有见解：“我之所以能有今天的成就，是依靠自律和他人的愚蠢；我们没有必要比别人更聪明，但我们必须比别人更有自制力。”


    人们的行为，总是遵循自我的行为模式，这就是习惯。在投资过程中，如果总是重复犯某种错误，那就是不良习惯在作怪。这种不良习惯，会导致投资者的交易系统存在重大缺陷，而亏损大都来自这个重大缺陷。巴菲特也认为习惯的链条在重到断裂之前，总是轻到难以察觉。因此，要扭转反复亏损的局面，完善自我投资交易系统，就要纠正不良的交易习惯，使得习惯与交易模式相适应；而要调整这些不良习惯，就必须坚决执行纪律，像军人一样守纪律。事实上，股市中大部分成功投资者所靠的都是守纪律，而不是所谓眼光。


    # 投资是一种生活方式


    马尔基尔在《漫步华尔街》中说道：“投资是一种生活方式。”其实，将投资视为一种生活方式，不仅是他所信奉的法則，更是很多投资大师所恪守的投资哲学，比如琼斯和巴菲特。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '股神巴菲特也说：“投资已经成了我的一种典型的生活方式。”从下面的一则轶事中你就会发现这位投资大师所言不虛。


    > 一天晚上，巴菲特和他的妻子苏珊受邀去朋友家中吃饭，朋友刚从埃及回来。晚餐过后，他们的朋友架起幻灯机向他们展示金字塔的照片。这时候巴菲特说：“我有个更好的主意。你给苏珊放照片，我去你的卧室读一份年报怎么样？”


    读年报不光是巴菲特的爱好，还是他最喜欢的休闲活动。对很多人来说，读年报是一件枯燥乏味的工作，但在巴菲特眼中却是一件充满乐趣的事情。因为投资对巴菲特来说已不只是一份工作、一个职业，而是他生活中必不可少的一部分。


    巴菲特是亿万富翁，如果他早上不想起床，他可以不起床。而他还是个非常节俭的人，他已经拥有的财富可能永远也花不完。那么是什么因素在激励他继续赚钱？他的动力是什么？


    巴菲特的动力很简单：他只想得到乐趣。“世界上没有什么工作比经营伯克希尔更有趣了，我觉得能在这里工作是我的运气。”


    对他来说，乐趣就是每天“跳着踢踏舞”来到办公室，阅读一堆堆的年报，与“令人激动的人”在一起工作，“赚钱并看着财富增长”。正如他所说：


    > “我认为，如果一名衣食无忧的运动员表现良好，那他们要的不是钱。我猜如果特德·威廉姆斯是薪水最高的棒球运动员但只有220个本垒打，他不会快乐；而如果他是薪水最低的棒球运动员但有400'
  merge: -1
  img_proc: true
- pgno: 145
  md: '个本垒打，他会很快乐。我对我的工作也有这种感觉。我在做我非常爱做的事情，钱只是副产品。"''


    但是并非每个普通人都像巴菲特一样出于乐趣而投资，有些人的投资是受其他某些原因驱动，例如追求物质享受。他们认为有钱才会快乐，才会更被人重视或更安全。在这种观念的支配下，他们投资时经常患得患失。如此一来，投资对他们不仅没有半点乐趣可言，反而变成一种沉重的负担。'
  merge: -1
  img_proc: true
