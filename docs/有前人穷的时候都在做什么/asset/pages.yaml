  md: '由于投入不足，就会影响产出，甚至造成没有产出，导致失败。


    害怕失败，就会在人的潜意识里种下失败的种子，这样，成功的种子就得不到充分的营养。失败的种子吸收了养分，潜意识就很难集中全部精力工作。害怕失败的心理，对于潜意识的工作是十分有害的。它影响人的创新性活动，同样影响目标的实现。


