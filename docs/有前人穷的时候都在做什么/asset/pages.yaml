  md: '个性特征不同，只有适合自己投资星座的投资方式才更容易取得成功。所以，每个人都要找到自己的投资星座，按照自己的投资风格去建立自己的投资交易系统，不必刻意去学习模仿他人，因为适合别人的，未必是对自己有用的；适合自己的，才是最好的。


    只有明白了自己的投资星座，才能建立适合自己的投资交易系统。一般而言，秃鹭星座的人擅长进行趋势交易，善于把握股价波动的交易机会，而获取盈利；猎豹星座的人擅长价值投资，更善于挖掘投资品种的价值，一般通过长时间的复利增长而获得财富；而兔子星座的投资者，大都不能长期持续地从投资市场获利，基本上是投资领域的失败者，如果投资人的投资星座不幸是这一类的话，就要通过系统学习投资，有意识地回避投资性格中的缺陷，发扬自身优势，才能增强投资成功率。


    很多人从事投资多年，却没什么进步，经常处于亏损境地。这些投资的失败者，就是因为没认识自己所属的投资星座，没搞清楚自己的投资风格。比如，明明投资星座是猎豹，却按秃鸮的投资方式交易；投资星座是狮子，却按鳄鱼的方式投资。


    投资者在认清自己的个性后，也应明白，一味顺应自己的个性去投资，也不完全是对的。例如，如果是秃鸮星座的人，其通常凭直觉投资，随时寻找新投资机会，但很容易被情绪左右，投资时常因此作出错误的决策；如果是狮子星座的人，其追求稳定获利，多倾向投资蓝筹股和绩效不错的基金。而猎豹、鳄鱼的长项是长时间等待，然后在关键时刻猎杀，非常“快、狠、准”。秃鸮、野狼一旦成功，就会过于相信自己的成功经验，却可能在某次投资中因赌注太大而一败涂地。'
