  md: '![](img/e4394970edb70b507c05aef8837a7762_88_0.png)


    # 选择了一种消费方式，就选择了一个社会阶层


    穿着 T 恤衫、紧抓高尔夫球杆的男人，身着晚礼服、怀抱贵妇狗的女人，带泳池的大别墅……这就是“富人国”公民的标准形象。所谓“富人国”，就是那些拥有百万美元以上家产的有钱人，这群仅占美国人口
    1% 的群体，事实上“已经形成了他们自己的一个‘国家’”。要知道，他们一年内赚的上千亿美元收入，甚至比法国、意大利或加拿大的全国总收入还要多。


    而这些有钱人的消费方式，为社会其他阶层设定了模仿的新标准，才使得有那么多人为了追逐 Gucci、LV、Burberry 之类的英文字母而卖命地赚钱。如果抛开“追求虚荣”、“过度消费”的偏见，从另外一个角度来看，我们可以认为，这种模仿其实是一种励志行为：选择了有钱人的消费方式，实际上就选择了有钱人这个社会阶层。


    为什么成千上万的普通人愿意一掷千金，去购买昂贵得令人发指的'
