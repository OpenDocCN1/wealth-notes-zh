  md: '1973年以来，美国畅销书作家、理财分析师托马斯·斯坦利一直对美国有钱人进行调查。他发现，在美国，大多数市值达到100万美元（截至2009年）的房产并不属于百万富翁。相反，绝大多数价值百万的房产均以抵押贷款购置，而且房主均属于崇尚高消费之流。与此形成鲜明对比的是，那些符合百万富翁基本标准，即拥有的净资产价值达到100万美元的美国人，90%居住在价值不到100万美元的住宅里。


    如果你确实家财万贯，大手大脚当然不碍事。但是，不管一个人的薪水有多高，如果失业时他不能依旧活得滋润惬意，那就只能说明他并非真的有钱。


    以上是从表面来看有钱的表现形式。如果我们再专业一点，从财务的角度来看的话，可以这样理解：如果一项资产，无论它的价格怎么变化，你的生活品质都没有变化，我们就说它是自用资产，就是你自己消费的资产。如果我们的车子和房子不能带来现金流，那它就是自用资产。自用资产是自己消费的资产，其显著的特征是其价值的改变不能带来生活品质的变化。所以我要告诉大家另外一个非常重要的概念就是“生息资产”。生息资产是能带来现金流的资产，也常被称为“可投资资产”。


    有钱人是拥有生息资产比例高和净资产高的人。


    你认为迈克尔·杰克逊是有钱人还是穷人？或者他死之前是有钱还是没钱？


    答案是没有钱，甚至特别穷，连保姆都请不起了。他死后，他的保姆哭着说：“他好可怜，他死前的最后一个生日我都买了蛋糕去看他。”'
