- pgno: 173
  md: '具备让上流人士“看得起”的本质


    绅士名媛及朝这个梦想迈进的人，不仅拥有的物品都是一流的精品，其教养也理应是一流的教养。这来自于他们追求一流生活、一流人脉的自我意识。


    如果佩戴着劳力士的高价手表，却连基本的打招呼、问候的礼节都不懂，对其他人也总是一副高高在上的态度；或是连女性优先这种最基本的礼仪都不了解的人，算不上“拥有一流的教养”。这种人充其量只能算“有钱的暴发户”。


    和这种人建立友好关系，并不会为你带来任何好处，对你的人脉也没有任何意义。因此，除了注意一个人所拥有的物质条件之外，其待人处事的态度与方法，也需要多花点时间观察才行。与此相对应，当你举手投足都透露出一流的教养时，其实对方也正在仔细观察你的一举一动。


