  md: '![](img/e4394970edb70b507c05aef8837a7762_24_0.png)


    # 有钱人的逻辑：想穷都很难


    变成有钱人这件事其实极其简单，但在我之前的生活中，我却始终与其擦肩而过；这件事情极其容易，但我却总是逃避它。后来，我意识到，要想变成有钱人，我必须改变自己的思维方式。一旦改变自己的思维方式，我就会改变自己的行为方式，这反过来又会改变我所得到的结果。这件事情极其简单，但我却用了多年才认识它，并真正将它付诸实践。


    俗话说：“思路决定出路。”一旦我开始真正像一位有钱人那样思考，我必然会享受到有钱人的生活。同理，你今天所处的位置，完全是你昨日思考的结果；而你明天所能到达的位置，也正是你今天思考的总和。如果你能够像世界上
    5% 的有钱人那样思考，过了一段时间之后，你就会成为那 5%。而如果你一直像那 95% 的穷人那样思考，你就只能是庸碌之辈。你将继续过着平庸的生活：攒点钱退休，可能'
  merge: -1
  img_proc: true
- pgno: 25
  md: '会有一辆不错的汽车，你还可以靠退休金和社保了此残生。但如果你开始像有钱人那样思考，你的生活从此就会发生彻底的变化，就算你想穷都很难。


    即便你抢走比尔·盖茨的一切，只要给他一点时间，他又会恢复到今日的身价，原因就在于他的思考方式。可以说，正是他的思路决定他的财富。


    在经过大量的采访、阅读、收听 CD 之后，我剔除了所有愚蠢可笑的“快速致富秘诀”；在对所有有用的信息进行提炼总结之后，我发现有钱人之所以能成为有钱人，关键就在于他们的思考方式。下面是有钱人对于与金钱有关的几个命题的逻辑思维方式，你将发现，它们是如此与众不同。


    关于金钱。有钱人对金钱的作用有着不同的思考。我们通常会把金钱当做购物的工具，而有钱人则把金钱当做一种投资工具。我们需要更多的钱来买更大的房子、更漂亮的汽车、更大的电视，而有钱人则会想着如何让钱生钱。一旦赚了钱，他们就只用其中的一小部分来改善自己的生活，而用一大部分来投资，以便为自己获得更大的回报。一般人则相反，只用一小部分进行投资，以便继续维持自己的生活。


    只要手头一有富余，我们就会想方设法把它花掉；而有钱人则会立刻想该如何投资。只要升职加薪，我们就会给自己买辆更漂亮的汽车，因为现在我们完全可以承担更多的月供了，也可能会立刻去买一台大屏幕彩电，并在接下来的
    5 年时间里为它分期付款；而有钱人则会说：“我可以继续开现在的汽车，看现在的电视，要是能把这笔钱进行投资，我就可以把每月省下来的 250 美元变成数百万美元。然后，'
  merge: -1
  img_proc: true
- pgno: 26
  md: '我就可以买那些东西了。”我们是因为缺少东西才去购买，有钱人则是因为富足才去购买。


    我们今天消费，以至于在未来不得不付出更大的代价；有钱人今天投资，以便让自己在未来能够买得更多。


    关于投资。普通人之所以投资，是为了能够安心地退休；有钱人投资的目的，是为了让自己更加富足。普通人对投资一窍不通，所以很难获得令人满意的收益。


    有钱人则会会把投资看成是一件极其重要的事情，所以他们会经常阅读、研究、学习各种关于投资的知识。每次打开雅虎首页时，普通人可能只是稍微浏览一下股票版，简略地读上一两篇相关报道；但有钱人却会投入相当一部分时间去学习如何成为成功的投资者。普通人只是抽出一小部分时间去了解有钱人是如何投资的。而且，每次读到这样的文章之后，普通人都会展想：“我怎么从来没遇到过这样的好事呢？那家伙可真是太幸运了！”不，并不是因为他幸运，而是因为他早已作好了准备。幸运总是青睐那些有准备的人，有钱人的理念和普通人不一样，而正是这种不一样的思维方式让他变得如此幸运。


    关于风险。普通人之所以不愿意冒险，是因为害怕失败。普通人会问自己，如果这个想法行不通怎么办？而在有钱人看来，不敢去承担风险本身就是一种失败。


    普通人会问：“如果生意出问题了怎么办？我会一贫如洗的。”而有钱人则会这样想：“如果再抓住这次机会，我可能就会失败得一塌糊涂。”


    真正富有的人都是敢于承担风险的人，普通人必须挺起胸来，学'
