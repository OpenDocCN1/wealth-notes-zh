  md: '他说你付的不只是酒钱，这 100 美元买的是餐厅气氛、服务、坐落的高级地段、餐厅的优雅格调、精致摆设、存放好酒的细心、服务生对酒的知识、周遭衣着高雅的宾客、享受美味食物和朋友的交谈。


