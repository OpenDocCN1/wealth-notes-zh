- pgno: 137
  md: '当我带着苏到野外散步时，它的马力总是开得足足的。我只顾闷头慢跑，而苏则像没头苍蝇般四处乱闯，时前时后，时左时右。但因为有一根长长的绳子拴在脖子上，它无论如何跑也逃不开我的牵制。


    如果我牵着苏从湖边跑到仓库需要 10 分钟，任何明眼人都会意识到，苏跑完这段路也需要 10 分钟，因为它的速度完全取决于我。的确，在整段路上，苏时而远远地跑到我前面，时而落在后面嗅着其他狗留下的“礼物”，但无论如何，苏跑完这段路的时间不可能比我差得很多，因为我们之间有一根绳子。


    现在，我们假设有一群非常情绪化的赌徒，他们的赌注就是这只被绳子拴住的苏。当它突然加速跑到主人前面时，赌徒们下注，赌这只狗会跑得很远。然而苏注定会慢下来或是停下来，因为只有这样，牵狗的主人才能赶上它。


    进行股票投资的人都知道，通常股价是对股票内在实际价值的一定反映。那么，股价和股票内在价值之间到底是一种什么样的关系？有投资大师将此总结为：人遛狗的关系。股价就像一只狗，而股票的内在价值就像那遛狗的人，狗一会儿在人的前面跑，一会儿在人的后面跑，股价和其内在价值之间的差距，就像人手中那根长可短的缰绳。


    实际上，人遛狗只是一种简单的比喻，股价和内在价值的关系，要比这复杂得多。我在这里所指的“面包派”，是一种投资流派，与'
