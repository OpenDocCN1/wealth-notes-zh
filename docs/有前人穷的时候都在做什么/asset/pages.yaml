    052美元。


    # 时间 = 等待 = 金钱


    现在我们来谈一谈时间对于财富增长的意义。可以说：“没有时间，复利就没有魔法。”


    在财富形成的过程中，时间很重要，所以我在财富方程式中列出了时间的平方。其实，在这里所说的“时间”，也可以解释为“等待”。


    现代人做事大都比较浮躁，甚至有人在投资基 金的时候，也像投资股票那样，总是在短期内买进卖出，一年内多次从这个基金换到那个基金。但事实上，并不是着急就能赚得更多更快。应该在投资之前'
