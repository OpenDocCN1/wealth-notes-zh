  md: '有那些拥有超常胆识的人，才能够成为真正的有钱人。


    # 你遇到的麻烦比有钱人的多吗？


    这个世界上任何事情都不是凭空想像就会发生。要想让一件事情发生，你必须有所行动。在前进的道路上，你总是会遇到各种各样的挫折，你必须改变自己对问题的看法。你不能因此放弃努力，而且它们也是完全可以克服的。


    你在生活中遇到的一切都有一种“阻力”。如果想要在天空翱翔，你必须要克服地球引力；如果想要赢得一场足球比赛，你必须打败对手；如果想要在生活的某个领域取得成就，你同样也必须克服眼前的阻力。你为自己设定了一个目标，如果想要实现它，你也必须在前进的道路上克服所有的障碍。


    很多人天真地以为只要祈祷就可以让眼前的困难烟消云散，但事实并非如此。生活总是充满问题，如果事事都一马平川，则生活也必将变得枯燥无味。一座只要抬腿就可攀登的大山登起来必然毫无趣味；反过来说，只有攀登那些崎岖陡峭的山峰才能给你带来真正的快感。很多人之所以喜欢面对挑战，原因就在于此。


    当你面对你的事业的时候，你就会充分激发内心的潜能，来努力实现梦想。这时你就会克服许多阻力，最终体味到成功的喜悦。一般来说，只有当人战胜一些比自己更加强大的事物时，他才会获得更大的满足感。


    在克服这些障碍的过程中，你所遇到的一个问题就是：它们会让'
  merge: -1
  img_proc: true
- pgno: 64
  md: '你的生活变得更加艰难，它们会阻碍你的计划。摆在你面前的阻力是什么？是什么在妨碍着你走向成功之路？你必须找出自己的阻力，想清楚该如何克服这些阻力，并最终取得成功。你必须转换自己的视角，这样才能不被眼前的障碍吓倒。你必须把它们看成是对自己的挑战，只要努力，你就一定可以将其克服。


    事实上，许多障碍都是你构想出来的。许多障碍其实只是你的心理障碍。同样，在你的事业当中，阻碍你发展的，并不是你的邻居或上司。他们并不会妨碍你尝试新事物，获取新想法。你的邻居并不会妨碍你成立一家新公司，你的上司也不会阻碍你进行任何投资。这些东西都不是问题。唯一能阻碍你取得成功的是你自己。你可以轻而易举地克服你眼中所有的困难，只要你首先愿意改变自己。


    思路决定出路，一个人的想法决定了他的做法，也最终决定了他所得到的结果。如果你坚信自己不可能取得成功，那你就不能成功——就是这么简单。真正需要改变的阻力是你自己以及你的思维方式。当你的思想变得积极的时候，成功就离你不远了。因为这时你的身体将别无选择，只能让你成功。


    找到任何一位有钱人，看看他们在想什么，你就会发现，他们的外在往往直接反映了他们的内心。你会看到，他们的所作所为，正是他们内心信念和思维方式的外在表现。


    你可能仍然在跟自己童年时被灌输的错误观念纠缠不清。如果想要成为有钱人，你就必须改变自己的思维方式。要知道，你的内在终究会决定你的外在成就。


    我们每个人都在努力地想要过上一种无忧无虑的生活。每次祈祷'
  merge: -1
