  md: '案。过去，如果杰西卡把“洗衣服”写到清单上，如果不把所有的衣服洗完，她就会感觉很糟。但是如果杰西卡知道自己只预留了 30 分钟洗衣服、叠衣服、收纳衣物，那她的负罪感就减轻了。因为即使还有些衣服没有洗，今天洗衣服的任务也已经完成了。时间预算让杰西卡意识到自己能力有限，让她看清自己完成了哪些事，就算没有全部做完，也不必感到内疚。


    制作时间预算表并不难，跟金钱预算表差不多。但是你必须坚持到底，必须经常进行评估并找到解决问题的办法。生活是艺术，不是数理化，因此，总需要做一些取舍。但是，当赶不上时间预算表时，你可以每天坚持完成其中一件事，从中获得一些鼓励，慢慢的，就可以走上正轨了。


    # 房间脏乱差的人，通常也没钱


    打扫房间、整理冰箱、收拾书桌……凡此种种，初看之下跟金钱一点关系也没有的事情，却往往是我大力推荐的。这些事跟金钱有什么关系呢？想必有人会觉得很不可思议吧！不过，在我终于可以只靠投资获利生活的过程中，察觉到了某个有趣的法则：我发现“丢弃不用物品”的行为与“储蓄”有着密切关系。在我“负债累累”的时期，房间里堆满了“物品”。


    在金钱上出现问题时，通常在生活上也会出现问题。因为生活和'
