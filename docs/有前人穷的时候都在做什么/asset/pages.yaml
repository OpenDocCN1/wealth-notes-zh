  md: '尼斯—派克食品公司”。派克负责产品开发，而海尼斯则负责利用自己的名气和媒体资源将他们的产品营销出去。


    他们合作得很顺利。不到3周的时间里，他们所生产的各种蛋糕粉即占据了美国48%的蛋糕粉市场。


    把你的资产与他人的资产结合在一起后，就创造了竞争对手无法匹敌的杠杆。他们仍然在单干，你却朝伟大迈进了。真正的杀手锏在于，你的合作者愿意为你的成功贡献力量，因为你也同样为他们的成功贡献了力量！如果你提供了他们想要的、欠缺的或需要的，他们反过来就会回报你最需要的。


    合作的第一步，当然是确定目前缺乏但可通过“借助外部力量”获得的资源。然而，做第一个为潜在合作伙伴考虑上述问题的人，同样至关重要。找出别人想要却没获得的资源、他们需要这些资源的原因以及如何帮助他们得到它。对有些人来说，这种资源是认可；另外一些人可能需要知识刺激；有些人渴望加入你参与的一个有挑战性的项目，而项目的挑战性则说明它具有成就大业的潜质。


    # 踏常走常新，让对手无路可走


    在创业过程中，那些充满创意、让人觉得异想天开、无法办到的事，其实比想像更容易赚钱。因为异想天开的事，大部分人都觉得不可能 会达成，也不会想要去做。一旦做的人变少，就代表你的“竞争对手”跟着变少，反而更容易成功。'
