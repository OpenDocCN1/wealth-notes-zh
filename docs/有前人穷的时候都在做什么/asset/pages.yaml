  md: '彰显得你形态。想让自己在上流圈子里分量十足，一个简单经济的办法是，摆出庄重的姿态。能身居上流社会的人本身就已见多识广，你轻浮的举止一定逃不过他们的眼睛，更会让自己在圈子中一文不值。因此，看看如下规则：


