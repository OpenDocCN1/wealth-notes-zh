- pgno: 65
  md: '时，我们总是希望上帝能够解除生活中的烦恼。我们相信，只要能够消除生活中的烦恼，我们就会成为世界上最开心的人。可有钱人的想法则截然不同，他们知道，生活之所以美妙，原因就在于每个人都会遇到很多问题。而恰恰是由于这些问题，富翁们才能大发其财。一般人忽视问题，而有钱人则会主动寻找问题。我们想要一种无忧无虑的生活，而有钱人则知道，生活本来就是一个发现和解决问题的过程。所以要想达到有钱人的高度，我们就必须在这点上跟他们保持一致。


    每当遇到问题的时候，我们总是在祈求上苍：“天啊，要是……该有多好！”“上天呐，帮我劝劝我太太吧，我并不会做任何改变，也不会学习如何成为一名更好的丈夫，但我希望你能帮我劝劝我的太太。”“还有，我已经有好几年没有工作了，财务问题不断，所以如果你能再帮帮忙给我点钱，那就再好不过了！”


    要知道，解决问题本身就是取得成功的一个重要组成部分。大多数人都想不劳而获，但只有那些能够直面困难，并真正从克服困难的过程中有所成长的人才能取得最终的成功。


    我们来到这个世界上就是来解决问题、消除障碍的。解决问题是一项你必须要掌握的技能。之所以称其为“一项技能”，是因为它可以通过学习来掌握，并在实践过程中不断完善。而且如果想要取得成功，你就必须掌握它。


    拥有克服障碍的能力是有钱人的一个共同特点。在困难面前，他们会表现出和我们不同的思维方式。他们会迎上前去，直面困难。有钱人属于这个社会最上层的5%，他们不会回避任何问题。那些有过成功经历的人知道，这个世界上其实并不存在所谓的“无法逾越的障碍”。'
  merge: -1
