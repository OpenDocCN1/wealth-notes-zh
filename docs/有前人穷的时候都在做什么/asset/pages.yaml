- pgno: 48
  md: '罗杰打算在家里后院的草坪上修建一个游泳池。因为要从银行贷款，所以他给几家公司打了电话，希望他们能给他报价。


    其中有一家公司的动作缓慢，拖拖拉拉。因为夏天就要到了，天气变得越来越热，所以罗杰开始变得有些着急了。就在这个时候，另外一家公司给罗杰发来了报价，由于时间很紧迫，所以他毫不犹豫决定接受第二家公司的报价。


    可就在罗杰作出这一决定的第二天，第一家公司给他打来电话。他们的报价要比第二家公司的报价低3 000美元。遇到这种情况的时候，很多人都会想办法取消跟第二家公司的合作，转而接受第一家公司。可罗杰没有这样做，他认为既然已经作出了承诺，就应当兑现它。这就是诚信。对于罗杰来说，当同意一件事情的时候，他就必须为自己说过的话负责。一个人的诚信绝对不丢3
    000美元。


    结果呢？罗杰的诚信终于得到了回报。几个星期之后，他接受报价的那家公司回过头来告诉他，他们当初计算出现了错误，多收了罗杰4 000美元。毫无疑问，罗杰非常感动，同时也坚信：诚信的人一定会得到应有的回报。


    有句谚语说，诚信甚至比财富还要值钱。只要一个人能够保持诚信，财富、名誉等都会陆续来到你的身边。我曾经见过很多人一夜暴富，但他们的财富只是昙花一现。这种财富之所以无法长久，是因为拥有这些财富的人本身就缺乏诚信。他们可以很轻松地看着对方的眼'
