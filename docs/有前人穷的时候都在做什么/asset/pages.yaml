  md: '为我们贪婪，所以亏钱，因为我们恐惧，所以错失很多机会，因为贪婪或恐惧时常让我们做出错误的选择。而要想获利，要想赚钱，就一定要克服这种心理。


    # 没有失败，只能暂时停止成功


    俗话说：“失败乃成功之母。”可以说，如果没有失败，那就意味着暂时停止成功。


    美国著名的汽车巨子福特曾说：“我在聘用人才的时候，总是喜欢那些经历过重大失败的人；对于那些从来没有失败过的人，我一般会慎重考虑的。”


    的确，一个没有经历过失败的人，他就没有感受过失败给人的痛苦，不懂得破茧成蝶那一刻的欣喜是什么滋味。


    著名的科学家乔纳斯·索尔克博士在经历 200 多次失败后，在第 201 次，终于成功发现了小儿麻痹症的疫苗。他曾在一次采访中这样讲道：“在我人生的字典里没有失败这个词。前
    200 次实验增加了我的经验，让我学到了许多知识。如果没有这 200 次的失败，我不可能实验成功。”


    在这个世界里，没有永远的成功者，也没有永远的失败者。在失败面前永不放弃的人，最后肯定能够成功；在成功面前志得意满的人，最终难免遭受失败的打击。只有那些经历过无数次失败，又在失败中勇敢站起来并获得成功的人，才是真正的成功者。


