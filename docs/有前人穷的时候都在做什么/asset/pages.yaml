- pgno: 169
  md: '# # 第7章 人际关系

    ## 识别对的人会召唤金钱


    +   ◇接受良好教育，有良好教养，在某方面拥有杰出的才能，并能积极学习、善于自我启发。

    ◇拥有可自由使用的资金与资产。

    ◇一年至少有两次长达两周以上的休假，并会妥善规划度假计划。

    ◇有3块以上能够表现自我个性的手表。

    ◇最少拥有一栋别墅。

    ◇对于社会有一定程度的贡献。


    你周围的朋友中，谁完全符合这样的条件呢？当然，找不到任何一位也是正常的，因为这些条件其实可以算是最终目标了。这样的人已经不仅是个有钱人，还是能站在上流阶层舞台的人。因此，我才会建议大家，尽快建立属于自己的名流人脉。其中的关键在于，对方是否能带给你成为有钱人的强大力量。


    假如你有位朋友，他没有别墅，没有高级轿车，每个月的收入非常低，而且从事的还是以时薪计算的工作。这种情况下，是不是应该和他划清界线或远离他呢？


    当然不是！关键在于，你这位朋友发出的能量与力量，是否正朝着成为绅士名媛的方向前进。有成为绅士名媛倾向的人，即使现在穷得一贫如洗，将来还是很有可能跻身上游社会。


    我的一个朋友安吉利娜，周游全国举办一个名为“如何嫁个有钱人”的趣味研讨会。有一次在拉斯韦加斯赌场，电'
