    答：你这个属于打散工的了。嫁得好是很远了。要不考虑一下金融业大叔？


    # 我28岁小护士一枚，未婚


    在一家县级医院上班，上了7年，我现在很焦虑，一眼看到头的生活，不是我想要。领导岗位就那么多人，职位岗位不是说我就能进去的（这个大家应该能懂吧）现在年轻还好，以后上了年纪，扎针扎不上，能力又不好。我今年感觉要找个对象都难了，每天接触的人，差不多都是老头老太太。'
