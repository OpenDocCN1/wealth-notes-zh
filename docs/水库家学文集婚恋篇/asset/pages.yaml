    # ## 40 岁大叔想让我生孩子


    菜菜，我 24 岁（爹级滚美比赛档次），遇到一个 40 岁大叔，他老婆不能生，想让我给他生孩子，现金买了辆 50 万的车，怀孕后买房，想想这么做的话，最坏会有什么下场，私生子受法律保护吗？


    +   答：首先，我讲大道理，劝你不要听。


    其次，如果大老婆起诉，相关财物要返还的。


    第三，私生子和嫡生子，相同待遇。


    第四，最坏待遇是白忙一场。


    # ## 〈倒插门〉第一课


    举个京沪编制，找个有房子的郊区县。女方只要过去就行了，百鸟在林，不如一鸟在手。有个底座的，先用起来。


    然后，一心一意考高离，估计 40-45 岁，万事大吉了。


    # ## 他们全款买房，我看呆了


