  md: '结婚后，两个女人都很强势，吵起来又是鸡毛蒜皮。母亲指责婆婆不收拾房间，婆婆指责母亲烧菜太咸。故意惹人。生了孩子后，外婆来接孩子，两个老太太互相看不上眼。谁地板的污水倒在地里都会吵起来。


