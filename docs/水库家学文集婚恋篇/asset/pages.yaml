    想想自己的男朋友发 50 万现金也拿不出（我认为他是潜力股），我真的只是想哭。自己年纪也不小了，凭交只能眼膜镜，兼职老嘴做起来！也怕时间不等人，崇明岛地铁一通也会涨起来，机会不等人。经济危机应该只是用来赚福利的，有钱人有大把现金。


    # ## 上海高异女，育一女


    夫妻感情不合，主要是男方家庭实在不尊重女方，觉得女方高薪各种酸酷甜香香辣味，自行脑补，并且要求女方生儿子，女方生女儿前已经打胎 2 次，实在不想打胎才坚持生下女儿。由于种种委屈，只想离婚，协议上海
    2 套房归男方，江苏两春小公寓，男女各一套。考虑孩子教育问题，女方同意孩子归男方。


    由于婚后男方退伍，女方形象一般，但是底子好，离婚后放发自我，开始花钱打扮（离婚前工资都交给男方）。由于底子好，30 岁的少妇打扮一下优雅有韵味，看起来很尖，前夫肯定想再生儿子，开始物色女友。然而再对三起，猛然觉得老婆还是原配好，听话说乖巧工资上的老婆很难找，再加'
