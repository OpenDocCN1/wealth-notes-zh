    读了这么多故事，渐渐感受到这些企业符号或者产品背后鲜活的人生，是的，我觉得商业史更像一部部成功人士的电影，正因为大家都是人，所以能感受到这里面的曲折起落，有温度的体会是对商业最大的理解。


