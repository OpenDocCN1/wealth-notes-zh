  md: '# 周末互动 | 任何概念都是流动的，公司也不例外


    你好，欢迎来到《商业务精粹》专栏的周末互动。到了和大家聊天的時候。


    这周我们讲的是迪士尼，照例我会用一个关键词来总结一下这周的内容。不过让我先卖个关子，在说这个关键词之前。我先来讲一个看起来有点无关的故事：一个关于文学的故事。


    2016年年底，一位著名的歌手和艺术家鲍勃·迪伦，获得了诺贝尔文学奖。当时引起了很大的反响。因为很多人都是鲍勃·迪伦的歌迷，包括之前我们讲到过的乔布斯，也是他非常忠实的拥趸。《乔布斯传》中还有专章介绍乔布斯对音乐和鲍勃·迪伦的热爱。另外可以说个小八卦，乔布斯一任对他很重要的女友，也和鲍勃·迪伦交往过。


    # 流动的公司


    当时鲍勃·迪伦获奖，引发一个争议，就是很多人说，为什么一个歌手写的歌词也能得诺贝尔文学奖？大家对文学的理解大多还是来自于书、小説、纪录文学等等。


    这背后蕴藏着的问题是：歌词到底能不能算文学。


    如果你看一下一百年多年来诺贝尔文学奖的历史——诺贝尔文学奖应该是1901年开始颁发的——你会发现，其实现史上很多获奖作品都超出了当时传统意义上文学的范畴。


    比如，大哲学家罗素在1950年就获得过诺贝尔文学奖，当时获奖的是他的哲学著作，并不是严格意义上的文学；还有一位著名的诺贝尔文学奖获得者，英国首相丘吉尔，他当时的获奖作品是其历史论著和回忆录，在当时同样也不是人们理解的文学的概念范畴。


    其实，当我们说文学是什么的时候，真正说的是，在这一刻，世人对文学的理解是什么。换句话说，从1901年到现在的100多年来，正是因为不断有各种各新的作品获奖，大家对文学这个概念的认知才在不断扩充。任何概念都是流动的，随着时间的发展，人们认知边界不断地扩展，很多词和概念的含义也在不断改变。


    所以，我们现在说的“文学”，和一百年前的“文学”，肯定是不一样的。


    我为什么要讲这件事呢？因为这正是这周讲迪士尼，我感触很深的地方。


    周一的内容里，我提了一个小问题是：你对迪士尼这家公司的印象是什么？我发现有很多有意思的答案。比如有的同学说，还以为迪士尼就是经营迪士尼乐园和放动画片的；有的同学说，一直觉得迪士尼是给小孩子玩的东西等等。这些观察都没错，只不过，它们并不是此刻的迪士尼，而是它某个阶段的样子。


    如果我们回顾一下这周的内容，相信你能发现，迪士尼一开始是个以米老鼠、白雪公主和睡美人建立起来的动画制作公司；后来由于创始人离世，公司陷入了动荡；接着来了一位性格强势的埃斯纳，在迪士尼低谷时为它打造了很坚实的基础，拓展了各种商业模式；再后来，鲍勃·伊格尔又在这个基础之上做了更多的延伸，打造了迪士尼新的辉煌。


    如同我们刚才提到的“文学”这个概念一样，迪士尼这家公司，本身也是不断在变化的。这就是为什么我觉得这周的关键词是“流动”——概念是流动的，公司是流动的，人也是流动的。没有什么是一成不变的。


    # 动态的视角


    在理解了“流动”这个概念之后，对我们看待商业史和一家公司有哪些帮助呢？我觉得应该有三个方面：


    首先，要学会用一种动态的眼光去看待我们周围的事物。很多事情都在变化发展，人也是一样。我们有时对外界事物建立的印象，只是停留在某一个时刻，比如我们偶然接触到它的时候。但任何东西都在不断发展变化，我们应该努力不断更新我们的认知。这一点，相信已经在“得到”的你，应该很有感触。


    第二，应该理解：这个世界是由很多随机事件组成的。商业的成功也不例外。比如有些读者会在后台问我：张老师，迪士尼的董事会是采用了什么样的优秀机制，保证他们选出了埃斯纳呢？说实话，我也不知道，因为历史上没人总结过这一点，当事人从来说没声过。更何况，哪怕真的有人总结了，我也会持有一<|start|>一种怀疑的态度，因为这些都是事后的总结，当时真的就是那样么？其实很难说。


    再换个角度，如果世界上真有一种完美机制，能保证董事会选出来的CEO每次都特别成功，那么理论上所有公司现在都应该在采用这种机制了吧？但实际上并没有。


    当然，每家公司都有很多成功的经验甚至失败的教训可以为我们所用，但是这个世界终究是复杂的、变化的、流动的。历史就是由很多随机事件组成，于是 一家公司，尤其是历史比较悠久的公司，在不同时刻呈现出来的样子也是不一样的。在讨论任何公司的时候，我们都应该把“时间”作为一个很重要的参数。这也是我个人在学习商业的时候一个重要的感受。


    最后，我们要有一点自信。正因为事情都是“流动”的，听了埃特尔、苹果、皮克斯、迪士尼你会发现，这些这么厉害的公司也有那么糜的时候，也有公司一蹶不振、完全找不到方向，甚至面临破产边缘的时候。所以作为我们一个普通人，遇到一些困难还有什么可害怕的呢？毕竟一切东西永远在流动着，从来没有一个所谓的终点。


    就像迪士尼这家公司一样，成立90年以来经历了风风雨雨，现在迎来了一个巅峰时刻。但这就是这家公司的终点了吗？并不是，它前面的路仍然很长。所以，不管是一家公司，还是我们自己，在路途中不停地努力以享受，才是最重要的。


    还记得乔布斯的那句“The journey is the reward”么？过程就是奖励。


    这周的闲谈就到这里。你可能发现了，我写这个专栏的风格和笔法也一直在调和迭代，接下来的两三周，我们会有更多的一些变化。敬请期待。


    下周，让我们跳出娱乐文化和科技行业，来看一家新的公司，耐克。谢谢大家本周的留言，我们下期再见。


