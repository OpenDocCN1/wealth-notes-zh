  md: "# 美国零售简史 | 从连锁小店到超市诞生\n\n上篇专栏我们讲的是美国现代零售业的第一个阶段：邮购阶段。我们还提到，历史总是在重复自己，零售行业尤其这样。\n\
    \n今天要讲的是美国零售业的第二个阶段，从简易连锁店发展到超市的诞生。在这个阶段你依然能发现这一点。\n\n# 简易连锁店的探索：A&P\n\n邮购模式最红火的时间应该是19世纪末到20世纪初，也就是1890年至1920年左右。到了这个时期的后半段，一个新的业态开始出现了，就是简易的连锁店。\n\
    \n把这种模式发扬光大的是美国现代零售业的开拓者，The Great Atlantic & Pacific Tea Company。它的中文翻译有点长，叫做：大西洋太平洋茶叶公司。业界一般称它为A&P。\n\
    \n从名字就能听出来，A&P是做茶叶起家的，早在1859年公司就成立了，还做过很长一段时间的茶叶邮购。到了1912年的时侯，经过高层的一番辩论，A&P决定实验一下，做经济型的连锁店铺。要知道，那个时候主流的零售业态还是小的夫妻店，再加上邮购模式。\n\
    \n# 不过A&P已经决定探索新的业态了。比起那些街边夫妻店，A&P在经营模式上做了几项重要的改革：\n\n+   第一项改革是：与现在的大型连锁超市一样，A&P有独立的仓库和车队。这样他们就能摆脱中间商对货源的控制，直接和制造商对接，提高了供应链效率\
    \ miesz 降低了成本。\n第二项改革是：整个A&P全店只有一位经理负责，装潢也比较简单，尽可能节约成本，把利润让给客户。\n第三项改革：和当时那种街边夫妻店不同，A&P不提供送货上门服务，减少库存、减少赊账。这样可以进一步优化运营效率，降低成本。\n\
    \n你应该能看出来，当时这种模式，已经是非现在非常流行的连锁经营模式的雏形了。不过严格地讲，A&P在运营方面和现代化的连锁店还是没法比——比如店与店之间没有统一的管控，更谈不上什么数据的互联了。单店的规模也比较小——所谓A&P的连锁，更像是一个个个体商铺的简单集合，中间的协同效应不是很大。\n\
    \n# 超级市场的诞生\n\n不过，在连锁店走向巅峰的时候，新的竞争业态很快就要出现了。这就是：单店规模更大的超级市场（supermarket）。也就是我们现在所熟知的“超市”。\n\
    \n+   1. 整个社会进程的改变和经济的波动，带来了新的社会风潮。 \n2. 在新形势的影响下，消费者的群体和需求发生了变化。“多快好省”的排列组合像一个魔方一样开始转动。\
    \ \n3. 一些新技术开始出现，导致满足新需求的方式开始成熟了。\n\n# 首先，是整个社会的大变革。\n\n当时，美国整个交通业进入了快速发展期。从1920年到1935年，美国新铺设的公路里程翻了三倍。福特在1908年发明了历史上最重要的T型车。经过二十年的发展之后，汽车终于是走进了普通的美国家庭。1930年，美国登记的汽车数量有2300万辆，是1920年的将近三倍。当人们的活动范围开始扩大，到郊区购物就变得可能了。\n\
    \n# 其次，在1929年10月的时候发生了一件大事，就是大萧条。\n\n# 另外，当时还慢慢诞生了一项“黑科技”，那就是——冰箱。\n\n# —— 今日小结\
    \ ——\n\n+   第一，整个社会进程的改变和经济的波动，带来了新的机会。也就是我们说的，交通行业的大发展和经济危机的出现。\n第二，在新形势下，消费者的需求发生了变化。“多快好省”的排列组合像一个魔方一样开始转动。对应到超市的出现就是，汽车的普及使得人们活动范围变广、经济危机的出现让人们更愿意做大宗的购物。\n\
    第三，一些新技术开始出现，导致满足新需求的方式开始成熟了。在这个时期，汽车的普及、冰箱的发明、电视广告的出现，甚至冷链技术和集装箱，都对超市的诞生和发展有着重大的影响。"
