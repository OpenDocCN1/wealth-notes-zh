  md: '# 英特尔 | “等灯等灯”（5/5）


    我们之前讲到了英特尔的诞生，以及这家公司为什么如此重要，之后讲了三个核心人物戈登·摩尔、鲍勃·诺伊斯和安迪·格鲁夫的复杂关系，又说到了格鲁夫的管理风格和英特尔历史上最重要的一
    些商业决策。


    今天，我们可以稍微轻松一下，来讲讲关于英特尔的五个有意思的小故事。


    # 一、Intel 的名字由来


    第一个故事，是关于英特尔这个名字的。你肯定知道，英特尔的英文名字是Intel。那这个名字是怎么来的呢？


    其实摩尔和诺伊斯刚开始创业的时候，给公司起的不是这个名字。当时最伟大的科技公司是惠普，它的英文名是 Hewlett Packard，是两位创始人姓氏的排列。摩尔和诺伊斯本来打算仿照这种命名方式，但是他俩的姓一组合就是
    “Moore Noyce”，发音非常像 “More Noise”，也就是 “更大的噪音” 的意思。这对于一个电子产品公司来说可能有点不吉利。


    于是后来，他们花了15000美金买来了 “Intel” 这个名字，含义是 “Integrated Electronics”（集成电子）的单词缩写。这样，英特尔公司终于有了自己的名字。


    # 二、极致工艺


    第二个小故事关于英特尔的工艺。你可能知道，CPU（中央处理器）的生产，一直是世界上最高级的工艺之一，也是我们国家一直想突破的一个技术。生产高性能的CPU对工艺要求特别高。


    举个例子：


    1978年，英特尔发布8086处理器的时候，芯片上有29000个晶体管。那现在在摩尔定律的加持下，数量到了多少呢？


    苹果发布iPhone 6和6s的时候，用的是自己研发的A8处理器，它的晶体管数量是——20个亿。我们人类大脑已经很难理解这个数字是什么意思了，而且它还是被放在一块小小的芯片上。


    这就是几十年来芯片工艺指数级发展的成果。


    另外，组装芯片还需要一些特殊的设备，比如需要一个 “无尘室” ——这可能是地球上最干净的地方。因为现在的晶体管实在太小，所以无尘室里不允许有直径超过0.5微米的颗粒。


    你肯定听说过PM2.5的危害，那无尘室的概念就是，一个PM0.5的颗粒都不能有。所以里面的空气每分钟就过滤10次，比一般医院的手术室还要干净几万倍。


    而且更夸张的是，无尘室的面积可以达到三个足球场那么大。这就是现代生产芯片要达到的技术水平。


    # 三、人人平等


    第三个故事，关于平等主义。这里的平等主义，指的就是一个公司里面平等而宽松的工作氛围。


    现在大家提到硅谷公司的时候，都会想起这个概念——比如层级扁平化、对个人的尊重、着装的随意甚至应有尽有的零食……这种平等主义的文化，是由惠普开启，然后由英特尔发扬光大的。


    这种风格其实在仙童半导体的时期就开始了。要知道，那时候美国大部分的公司还是等级非常森严，甚至连女性员工的一些最基本权益也得不到保障的时代。但英特尔那时已是最先锋的公司了。


    在鲍勃·诺伊斯近乎 “放任自流” 的管理风格下，仙童有着世界上最先锋的企业文化和激进的年轻人。有一个英特尔的员工后来回忆说，当其他公司都严格地穿西服，对领导毕恭毕敬的时候，英特尔开会的时候，大家则凑在一起吃巧克力蛋糕，甚至有时还便有威士忌喝。这在上世纪六十年代的美国是不可想象的。


    而且，不仅员工如此，当时公司的创始人也没有架子。如果你走进那时候的英特尔公司，就会发现里面全是大片的格子间。甚至耶称建筑算总部也不太明显，因为诺伊斯、摩尔和格鲁夫经常到处乱窜，分散在不同的地方办公。而深受大家爱戴的鲍勃·诺伊斯所谓的
    “办公室”，就是一个大一点儿的格子间。他和所有人一样，坐在一个白色硬塑料桌前。唯一的差别是别人贴在案前的是家人和孩子的照片，而他放的是国家发明奖章。


    后来很多科技公司都以这种轻松、平等、自由的文化自豪。比如雅虎的大堂是个游乐场；谷歌有大厨做饭，有按摩室和乒乓球桌等等。2015年的時候，Facebook的创始人扎克伯格还晒出来一张自己办公桌的照片，大家发现他没有自己的专属办公室，然后大加感叹与称赞。但实际上，这种文化从英特尔开始就建立起来了。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_10_0.png)


    # 四、“等灯等灯”


    第四个故事，关于英特尔的营销。其实对于英特尔，很多人低估了它的营销能力。


    英特尔作为一个不直接面对用户的品牌，比如像可口可乐、麦当劳或者耐克这样的公司来说，能达到这种知名度是非常难得的。这要感谢英特尔历史上最著名的一次营销计划。就是1991年左右，英特尔推出了
    “Intel Inside” 这个口号，直接翻译过来就是，英特尔的处理器就在里面。另外，这个口号还配合了一个你很熟悉的音效，就是那个著名的 “灯～等灯等灯”。看文稿的读者们估计已经在心里默默唱了出来。


    先说说 “Intel Inside” 这个口号。英特尔推出这个口号是在1991年左右，当时他们面臨着很大的一个挑战，就是另一家叫超微的半导体公司（英文叫AMD）也研发出了性能很不错的CPU，而且价格更便宜，英特尔逐渐失去了垄断地位。于是公司开始策划一次史无前例的广告活动，目的就是让处理器在电脑中的地位更加突出，而且更要突出英特尔处理器的地位。


    于是 “Intel Inside” 这个标志和口号应运而生，这个口号一经推出，大家一下就有了一种 “就是要买有Intel处理器的电脑” 的感觉。并且，英特尔投入巨资启动了一轮整体的营销计划，所有的合作伙伴，比如联想、IBM这样的PC厂商、笔记本厂商，只要在广告里也打上
    “Intel Inside” 的标志，就可以和英特尔分摊广告费。


    另外，英特尔还请了奥地利著名的电子音乐艺术家亲自编写了 “等灯等灯” 的音效，每一个音符都是用木琴、马林巴琴等各种乐器合成的。这轮广告可以说是广告营销史上的一个经典。差不多在十年后的2000年，英特尔在一次全球的品牌调研中，成为了世界最知名品牌第二位，仅次于可口可乐。这对于一个工业品牌来说，是非常不可思议的。


    这就是英特尔历史上最重要的一次营销。我们现在来讲最后一个故事。最后一个故事，我们说到第一期讲到的仙童半导体。讲讲它后来对硅谷的影响。


