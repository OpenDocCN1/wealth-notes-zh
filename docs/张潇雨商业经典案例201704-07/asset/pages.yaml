  md: '# 研究商业的原则（一）

    ｜不要把商业当作物物理学


    之前做了一点预告——这周，我们不讲具体一家公司，而是借助之前讲的内容，加上这段时间你们的反馈，来讲一讲我研究商业的一些原则和方法。希望这周的内容讲完，你再看这个专栏，或者自己去看一些公司的时候，能有更正确的视角。算是对你的一种回馈。


    讲述的方法也会有点特殊。这五天的内容，我会作为一个整体，周一到周四，先讲讲研究商业时，“不要”做的事。我会试着破除一些概念，比如大家看待商业常有的一些误区和不合逻辑的想象。最后一天，我会讲讲我们应该怎么做，研究和分析商业的原则和理念到底应该是怎样的。最终，我希望你能把这些原则和理念带到你的生活里，受用终生。


    现在我们就进入正题，讲讲研究商业的第一个原则：不要把商业当成物理学。


    这其实是在我和这个专栏的用户交流的时候，发现大家经常存在的一个误区。举个例子：


    之前专栏的内容中讲到过迪士尼对皮克斯的收购。一开始负责收购的迪士尼CEO是迈克尔·埃斯纳，但是他太不招人喜欢了，乔布斯非常看不上他，于是迪士尼和皮克斯的合作一度搁浅；后来，深受大家爱戴和受到乔布斯喜欢的鲍勃·伊格尔上任迪士尼新CEO，很快就把这个收购推
    adoption 完成了。K而且这个收购意义非常重大——由于有了这次收购，才有了后面收购漫威、卢卡斯影业等等。迪士尼这台赚钱机器才能够开动起来，可以说是一次伟大的商业决策。


    # 人类历史上的物理研究大略过程是这样的：


    # 首先，我们要对客观世界有一个观察。比如，苹果掉在了脑袋上。当然，很多时候这种观察是反复出现的，也正因为它反复出现，我们才会重视这个现象；


    # 接着，我们会根据对客观世界的观察，开始总结规律，并试图用各种方式描述这种现象。比如：万有引力定律就是我们总结出来的。很多时候这种定律，还是用数学来表达的；


    # 再之后，就到了验证的部分。所谓科学精神，很重要的一点就是实证精神。简单来说，这个世界上任何人都能提出各种对客观世界的解释，甚至总结规律，但是你总结对不对，还得用实践来检验。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_76_0.png)


    # 什么是严格的因果律？说的是，万事万物的发生都有原因，是原因导致了结果。因为一个苹果存在，你把它扔到了天上，于是它掉到了地上。如果这个苹果不存在，或者你并没有扔它，那么苹果掉在地上的这个结果也就不会存在。


    # 那么什么是定律的可重复性？简单来说，任何人在任何时间站在地球上往上扔一个苹果，它都一定会掉在地上，这个结果是可重复的。不管是牛顿在几百年以前扔，还是美国总统在白宫扔，还是我来扔，都没有区别。换句话说，定律之所以是定律，是因为它能预测未来。


    # 说回真正的主题，商业：


    我一直说，研究商业的第一原则，就是不要把商业当成物理学。它本质上的意思就是，当我们在研究商业、分析公司、总结各种商业理论的时候，要有一个清晰的意识。那就是，构成科学大厦的两个重要基础——严格的因果律和定律的可重复性——在商业世界都是不太成立的。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_76_1.png)


    如果一旦有了万有引力定律这个武器，你就可以非常大胆自信地和人说，现在只要你向上扔苹果，它一定会落下来。结果是非常确定的。


    所以，任何商业事件，都是被千千万万的...'
