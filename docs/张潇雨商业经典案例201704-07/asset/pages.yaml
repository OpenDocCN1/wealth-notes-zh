    \n有一点想法，其实投资界的三个法则也适用于个人找工作或公司。进入新起步并且已经看出有巨大市场潜力的行业，看CEO的个人简历，和团队整体素质。毕竟普通的工资阶层人士占大多数，在早九晚五的职业生涯出卖自己的时间也是要一些技巧的。\n\
    \n+   1. 之前听嘉御基金董事长卫哲老师提到一个投资建议：关注效率而非规模。现在共享单车很火，但是他不关心每天新单车投放量，而是单车的开机率；Airbnb模式很火，他不关心有多少间房，而是关心闲置率多高。不要把注意力放在追求做大规模上，而是追求密度，密度高才容易口碑传播。一个小区内如果做不好密度，大谈做全国或全球市场是没有用的。\
