  md: '# Netflix | 把你当作“成年人”的独特文化


    Netflix | 把你当作“成年人…


    今天我们继续来讲Netflix这家公司。之前的几期专栏，我们都是围绕着Netflix的历史和业务来展开的，今天我们讲讲Netflix这家公司的另一个侧面，就是它的文化。


    你肯定知道，硅谷有很多公司都以企业文化独特而著称。但Netflix的文化即使在硅谷也是很值得说的一个。《哈佛商业评论》曾经几次把Netflix的公司文化作为经典的商业案例进行报道和分析。


    2012年的时候，Netflix放出了一份长达124页的PPT，上面讲述了所有关于Netflix对文化的理解。Facebook的COO雪莉·桑德伯格（Sheryl
    Sandberg）评论说：“这可能是硅谷流出来的最重要的一份文件。”


    所以，今天我们就来讲讲Netflix公司文化的一些独特的侧面。


    此链接为2012年Netflix公司关于企业文化的PPT下载地址：

    http://nfil.es/w/T2rX4c/?s=wanqu


    Netflix的核心文化理念，概括起来就是两个方面：


    +   第一，招聘和留住最好的人；

    第二，把公司的所有人都当成“成年人”来对待。


    # | 招聘和留住最好的人


    不管是硅谷的创业公司，还是中国的互联网公司和创业公司，都常常把“要招最好的”挂在嘴边。但Netflix算是把这个理念落在了实处上。


    首先，Netflix反复强调，公司对员工的期待就是做得“非常好”，如果做得“还可以”，那么这个人就应该离开。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_109_0.png)


    不过，这只是Netflix单方面的要求。求职永远是双向的选择。那Netflix怎么保证自己总能招来最好、最合适的人呢？


    他们通常会以高出市场价15%-20%，甚至更高的价格去招聘；在年终，还会发放超出员工预期的各种福利。另外，Netflix的离职补偿非常丰厚——最低也有四个月的工资，上不封顶。比如，哪怕一个入职刚刚两周，但是公司觉得他不是很合适，那么Netflix也会给他发四个月离职补偿金，然后让他走掉。


    # | 只要“成年人”


    说完“招聘和留住最好的人”，我们来说说Netflix的第二个理念：把公司的每个人都当成“成年人”来对待。


    你可能想，什么叫“成年人”呢？其实一句话就能概括，就是：Netflix认为，你作为一个成年人，是有成熟的判断力的，所以我们不会用呆板的规则和条例去限制你。


    比如，在Netflix员工的假期是没有限制的。也就是说，你一年里想歇多长时间就歇多长时间，只需要把工作做好就行。当然，休假都是带薪的。如果你想休假，提前和自己小组的同事打好招呼，做好交接就行，不需要额外的审批。'
