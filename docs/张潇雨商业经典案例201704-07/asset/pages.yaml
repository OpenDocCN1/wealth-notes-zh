    # 苹果 | 旗开得胜 (1/10)


    思考题：你觉得商业史上都有哪些伟大的“借鉴”？


    我知道一个“借鉴”，就是李嘉诚当初在创业阶段一直苦于不知道怎么生产高质量的塑料花，因为当时他手上没有先进的生产塑料花的机器，而最成熟的生产塑料花的技术在欧美国家。


