    张潇雨


    学习了！


    好和坏的界线在成人世界里并不存在。对任何事，每个人的感受和理解都不一样，这就是人类社会，也是创新的来源。


    万老师一直在强调，他要我们保持一个精英的思考能力，脑子里存着矛盾的概念仍能正常行事，这就是成熟。他曾讲过《注意力商人》这本书，希望我们不要被别人控制。但是，认真想起来，有时候被控制，或者控制别人，也未必就是非黑即白的。每个人命运都不同，有时候独立很好，有时候顺应很好。每个人自己要对自己在关键时刻的选择负责，这是我一直秉持的态度。


