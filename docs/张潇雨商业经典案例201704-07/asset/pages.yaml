- pgno: 55
  md: '很可能就不会了。所以对于一家公司来说，什么时候选择什么样的领导人也是非常重要的。


    我记得我很喜欢的风险投资家本·霍洛兹（Ben Horowitz），也就是《创业维艰》那本书的作者，写过一篇文章叫做《和平时期的CEO和战争时期的CEO》，非常经典。说的就是，公司在不同阶段、遇到不同情形的时候，对于领导者的要求也是不同的。


    对于我们自己来说也是一样的，在不同的时刻、不同的人生阶段，选择怎样的成长和前进的方式，也是应该时不时地跳出来看看的。


    # —— 今日小结 ——


    今天我们讲的是鲍勃·伊格领导下的迪士尼，是怎样通过买买买的战略，来建立自己的帝国的。同时我们也谈到了这些收购对我们自身的启发。


