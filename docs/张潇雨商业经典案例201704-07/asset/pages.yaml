  md: '# 苹果 | 周末互动（1）：找刚需？需求也可以被创造


    欢迎来到《商业史精读》第二周的周末互动。这一周我们讲的是苹果公司和乔布斯的“上半场”，中间做了一点发散，讲到了乔布斯的演讲技巧，风险投资的历史和一些观念。


    这周更多的同学来留了言，和之前一样，我在后面附上了一些精选的评论，也欢迎大家在之后继续一起来互动。


    另外之后的专栏规划和周末互动里，我会多聊聊我自己对商业、公司和创业的一些感受和体会，也回答一些大家的问题。


    回答问题的方式有两种，一种是简短的回答，点到为止，但给你启发，而且能回答的比较多；另一种是，深入地试图把一个问题说透。


    之后这两种方法我都会使用，而且我会试图把这个专栏的很多价值，放在与你们的互动和讨论里面。所以这次，我想稍微花点时间深入地讨论一个问题。这也是一个很有代表性的问题，我做过很多思考，也走过不少弯路。


    这个问题是一个叫@孔维琦 的同学问到的，他在看完“风险投资的历史与哲学”这一期之后说：


    除了从投资人的角度思考外，是不是投资“需求”也很重要？特别是一些挖掘出来的需求，例如最后一公里使用自行车，闲置的房子怎么利用，怎么更有效率和高 质量地获取知识？


    这个问题很有意思，本质上是关于“需求”的。我来谈谈自己的体会：


    这几年有一个很流行的词叫“刚需”，相信你肯定听过。与这个词配套的还有一些说法，比如“创业一定要做市场现有的需求，尤其是刚需。不要幻想着自己能创造需求。”或者，“创业者是没有能力和资源去教育市场的，这是大公司的事。创业者应该寻找已经存在的痛点。”


    这些说法对不对呢？我觉得非常对。但我同时要说我的另外一个判断，就是：需求也是可以被创造出来的。'
