  md: '# 英特尔 | 绝境逢生格鲁夫（4/5）


    上期我们讲了英特尔的三个最关键人物：戈登·摩尔、鲍勃·诺伊斯和安迪·格鲁夫之间微妙又复杂的关系，以及这种关系对英特尔乃至整个硅谷企业史的影响。


    今天，我们来Н讲讲英特尔给我们留下的另一项伟大的资产：它的管理思想。


    # 硅谷最伟大的管理者


    英特尔的管理思想，很大程度上都是通过一个人呈现的，那就是安迪·格鲁夫。我们之前也提到过，格鲁夫应该是硅谷公认的“最伟大的管理者”，可能没有之一。在2016年3月，格鲁夫去世的时候，传奇创业者和投资人马克·安德森（Marc
    Andreessen）说：“安息吧，格鲁夫。你是硅谷有史以来最优秀的企业家，很可能未来也是。”


    应该说直到现在，硅谷所有的企业家和创业者还在学习格鲁夫的管理思想。这种学习主要是通过两本著作，一本是《格鲁夫给经理人的第一课》（High Output Management），另一本是《只有偏执狂才能生存》（Only
    The Paranoid Survive）。这两本书早已是管理学的经典著作，有兴趣的用户可以来阅读。


    今天我想讲讲安迪·格鲁夫的童年和他的性格，以及英特尔历史上最经典的两个商业决策。听完这些，相信你会对格鲁夫为什么被称为硅谷“最伟大的管理者”，以及为何能写出这样的著作，有一些新的感悟。


    先来说说格鲁夫的童年和性格。上期更新的时候我们提到，如果用一些词来概括格鲁夫的性格，可能是强硬、凶悍、激进、果断、不近人情、蔑视人性……这实际上和他的童年有很大关系。


    安迪·格鲁夫是匈牙利人，他之所以来到美国，是为了躲避德国纳粹的追杀，坐船逃难来的。所以，不像成长于中产阶级家庭的摩尔和诺伊斯，格鲁夫从小就有一种强大的生存本能。而且命运就是如此奇妙，这种极致的性格让格鲁夫在带领英特尔的关键时刻，敢于扛着性命豪赌，从而赢得最大的回报。


    关于半导体行业，有一个很重要的背景——这个行业其实是整个人类历史二百五年来，第一个能以指数级速度发展的行业。这意味着历史上没有人知道在这样迅速发展的行业里，应该怎样管理公司。


    现在我们早已理解，像当年的团购大战、外卖O2O、打车出行，甚至共享单车这样的行业，都在以多快的速度发展，但格鲁夫执掌英特尔的时间里，根本没人见过这种发展速度的企业。所以在英特尔短短五十年的历史里，才屡屡有着无数次的行业崩溃、资本寒冬、大裁员、战略转型等等，极为不易。而格鲁夫恰恰因为这种凶悍的管理风格，带领英特尔走出了这段最动荡的历史。


    # 绝处逢生


    英特尔有两个最经典的商业决策，是格鲁夫这种凶悍的管理风格的最佳案例。


    第一个发生在20世纪80年代初左右。当时行业又一次崩溃，半导体大大供过于求，整个行业都在洗牌，大家都推迟新品开发、削減费用，英特尔的日子同样很惨。


    当时格鲁夫刚刚接手公司的CEO职位，所有迹象都表明此时公司应该保守谨慎，度过寒冬。而格鲁夫的贱徒本质在那一刻再次爆发，他不仅没有削减费用或者裁员节省成本，还大举投资新建工厂，并且一举推出四款新的处理器。然后，在公司内部还宣布一个后来恶名昭彰的所谓“125%解决方案”（125%
    Solution）。


    这是什么意思呢？就是格鲁夫要求从1981年10月开始的6个月里，每个员工每天额外工作两小时，但没有任何报酬。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_8_0.png)


    可能科技公司的加班文化就是从那个时候开始的。另外，英特尔还卖了12%价值2.5亿美金的股份给了IBM。这一套组合拳下来，英特尔不但度过了危机，而且也彻底打败了一众保守的竞争对手，稳稳地占领了统治地位。要知道，这只是格鲁夫接任CEO的第一年。


    这就是第一个英特尔历史上的重要的商业决策，而第二个，可能更加著名。


    # 战略转型


    这个商业决策，就是英特尔历史上最著名的一次战略转型。如今人们提起“企业转型”这个话题时，英特尔的这个案例仍然是被大家引用最多，也最津津乐道的。


    当时是1984年左右，那时候的英特尔有两个核心业务：存储器和微处理器。不过，英特尔从诞生伊始就是一家存储器公司，微处理器只是顺手做着玩玩，并且当时微处理器的业务还远远没有显示出能变成一个几万亿美元大市场的迹象。而存储器那边，由于日本厂商一直在打价格战，所以一直在亏损。


    于是英特尔当时面临一个重要的抉择：一边是公司创立一开始就在做的核心业务，但是现在亏损；另一边是新业务，体量还很小，未来很不确定。作为公司的管理者，你会怎么选？


    格鲁夫后来回忆也说，关于要不要关闭处理如业务，他们吵了很多次。大家不停地开会、争吵、辩论，最后还是达不成统一意见。为什么当时的英特尔如此犹豫呢？主要有三个原因：


    +   第一，存储器业务不仅仅是一个贡献收入的业务，还是英特尔的技术核心。因为他们一旦研发出新技术，都会放在存储器上先测试，对于一个崇尚技术公司来说，这特别重要；

    第二，英特尔一直有一个“全产品线”的信条。它们觉得如果没有一条完整产品线，销售人员就很难面对客户，很难拿下订单；

    第三，可能也是最关键的一点，就是英特尔的骄傲。诺伊斯和格鲁夫都不想看着公司起家的核心业务，在他们的带领下关闭，这对他们来说实在是太失败了。


    格鲁夫在《只有偏执狂才能生存》这本书里还提到了一个小插曲：


    > 有一次在拜访工厂的时候，一个基层员工得知，公司要关闭存储器业务，于是特别不满地问格鲁夫说，你觉得不生产存储器的英特尔还是英特尔吗？格鲁夫当时特别生气，但只能忍着。


    直到1985年，格鲁夫和摩尔在他的办公室里还在讨论，心情非常糟糕。突然，格鲁夫望着窗外，问出了企业管理史上非常经典的一个问题，他说：


    > “如果我们现在被踢出去，董事会会招来一个新CEO。你觉得新的CEO第一件事会做什么？”


    > 摩尔说：“TA会退出存储器业务。”


    于是格鲁夫看着摩尔说：“那么为什么我们不能自己这样做呢？”


    于是就这样，英特尔彻底关闭了培养公司创业一个又一个辉煌的存储器业务，并且裁掉了7200个职位，几乎是公司总人数的1/3，而且绝大多数都是表现很好的员工。后来，一个董事会成员在投票的时候说，“这是我担任董事会成员之后，做过的最令人悲伤的决定。”


