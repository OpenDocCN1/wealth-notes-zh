  md: '# 周末互动 | 请谨慎选择竞争对手，因为最终你们会很像


    20170707-张潇雨07007...


    欢迎来到我的商业经典案例课，我是张潇雨。又到了周末互动的时间。


    这周的专栏我们讲的是亚马逊。不知道这一整周的内容你有没有看过瘾，希望你能有很多收获。亚马逊这家公司确实非常有意思，我也花了很多时间和精力来研究。其实我也鼓励你在专栏之外，对自己感兴趣的公司和案例做一些延伸的阅读和思考，也可以有自己的分析和结论。毕竟我们真正的目的是在学习案例中培养我们的商业思维和思考人生的方式，过程才是最重要的。


    这周的内容如果还没有看过瘾或者听过瘾也不用着急，因为下周我们的主题还是亚马逊。而且我会带着你站在一个更高的维度去看这家公司，内容会更加精彩。


    今天是周末互动，在烧脑了一周之后，我觉得我们可以从理论和方法里跳出来一下，来讲一点和“方法”相关的事情。关于亚马逊和贝佐斯，我觉得有一点我的印象是很深的，那就是他们“拜客户教”的理念——非常重视客户，以客户为中心的精神。我们在之前的专栏里也详细地讨论过。


    不过在这里我想说的并不是关于服务客户的，而是这个理念里面蕴含了一个道理，就是：很多时候我们要把注意力放在正确的地方，而不要被不重要的东西分心。比如：不要太关注竞争对手。


    贝佐斯就是一个非常刻意不关注竞争对手的人。他在很多场合都半开玩笑地说过：不要管你的竞争对手在做什么，因为他们又不给你钱。关注对手可能做到第一，但关注自己你会做到唯一。


    实际上如果你观察一下亚马逊目前的业务，你就会发现贝佐斯的确是这么执行的。如果他天天盯着其他电商在干什么，他是不可能发展出AWS云服务这种对一个电商来说很奇怪的业务的；如果他整天琢磨着沃尔玛或者梅西百货会不会是威胁，那他也不会去开发Alexa人工智能语音助手，或者亚马逊Echo智能音箱。


    但同时，他又非常注意从竞争对手身上学习。比如亚马逊内部有个很有意思的组织，名字起得跟007电影似的，叫做“竞争情报组”（Competitive Intelligence）。他们主要的工作就是在其他电商网站上大量购买商品，然后评测它们服务的质量和速度，比如：购物流程畅吗？服务速度快吗？退换货容易吗？然后，这个小组会把体验写成报告，汇报给贝佐斯和一个高管团队组成的委员会。


    简单来说，这个小组的任务就是研究竞争对手哪里做得比亚马逊还好，然后让核心高管针对这些反馈制定计划。


    听到这儿，你可能觉得，这和上面我们说的好像有点矛盾：既不要把注意力放在竞争对手身上，又得关注它们的各种动作。我觉得这应该就是毛主席说过的那句话：要在战略上藐视敌人，在战术上重视敌人。想一想，还是非常有道理的。某种程度上来说，战略是说你觉得一个事情的本质是什么，它最终应该达到什么样的状态和结果——这与任何人的想法和意图是没关系的；但是从具体做法和路径上，可以多向别人学习和借鉴。


