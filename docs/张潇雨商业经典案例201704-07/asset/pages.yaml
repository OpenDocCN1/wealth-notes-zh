  md: '# 皮克斯 | 与迪士尼的天作之合（2/5）


    上次的更新里，我们讲到了皮克斯的诞生，也就是乔布斯是怎么把这个原本的电脑3D制作部门收购下来，通过一部电影《玩具总动员》走出低谷，并且上市的。上市之后，皮克斯和迪士尼达成了新的协议，可以再合作五部电影，并且票房分成50%。


    今天，我就讲讲后面一件非常重要的事情，迪士尼对皮克斯的收购。


    之前我们也提到过，迪士尼对皮克斯的收购意义重大。一方面，皮克斯借由这次收购，从此摆脱了生存危机；另一方面，迪士尼收购皮克斯的时候也正处于自己的低谷，结果借由这次收购，皮克斯把先进的动画电影流派带入了迪士尼内部，慢慢改变了迪士尼电影的生产流程，做出了像《超能陆战队》、《疯狂动物城》、《冰雪奇缘》这样的好电影，帮助迪士尼开启了一个黄金十年。


    迪士尼是2006年1月以74亿美元正式收购皮克斯的，对于一个动画制作公司，可以说是天价了。要促成这种大型的并购，往往要在人和事两方面都合邀。我们今天就从人和事两个方面来说说。


    # 彼此需要


    先说事的层面。从业务层面来讲，这次收购对迪士尼和皮克斯都非常需要。


    对皮克斯来说，其实动画制作这个生意本身，并不算是太好的生意模式。因为首先，电影的制作周期很长，通常需要两三年，而动画电影就更长了，皮克斯一部电影制作4到5年是很常见的，所以在整个过程中，公司的收入非常有限。不像你开个麦当劳，每天都有人来吃饭，每天都有收入；


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_41_0.png)


    # 谋事在人


    但是，业务层面的东西很多时候都只占一小部分，真正做成交易的还是人。可以说在这次改变行业格局的交易里，人的因素是巨大的。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_41_1.png)'
