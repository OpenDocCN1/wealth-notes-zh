  md: '# 研究商业的原则（五）

    | 归纳的过程、混沌中寻找秩序与自我观察


    欢迎来到本周专题内容的最后一篇。我们先来总结一下之前的内容。我们说了四个在研究商业时“不要”做的事情：首先是不要把商业当成经典物理学；其次不要陷入因果谬误；第三是不要执着于概念；最后是不在原地。


    在我们说了这么多“不是”什么之后，我当然要给大家讲一讲研究商业到底“是”什么。毕竟这才是这个专栏最大的意义。所以，今天我们的主题就是，商业研究到底是什么？这也正是这期专栏的标题：归纳的过程、混沌中寻找秩序与自我观察。


    # 归纳的过程


    所谓“归纳的过程”，包括两个方面。一是归纳，二是过程。这里的归纳，其实取自一个逻辑学的概念“归纳法”。在本周第一期的专栏里，我曾经说过不要把商业当成经典物理学，不过，这二者有一点是共同的，就是对归纳法的使用。


    归纳法指的是通过对客观世界重复的观察，并试图总结出规律的一种研究方法。比如先前人类发现，一些材料（金、银、铜等）能够导电，于是就有了猜想：是不是所有金属都能导电？这就是一种归纳。之后，科学家们根据这种归纳，来试图证明或推翻这种猜想，从而就完成了一个物理规律得出的过程。


    对于商业我们其实也在做类似的事情。比如，在讲耐克这家公司的案例时，我提到它最早是针对垂直领域提供产品——通过给专业长跑运动员提供新的跑鞋，才逐步占据了更大的市场。历史总是惊人的相似，后来的锐步、安德玛等运动品牌在上世纪八十年代和九十年代也按照类似的方式，从小市场切入，逐渐做大。锐步占据的是女性健身市场，安德玛占据的是专业健身运动员的健身衣。


    商业著作《创新者的窘境》中，对这一现象进行了经典的总结。它归纳出了一套初创小企业如何取得自己的一席之地，甚至颠覆大公司的商业理论。这本书连根本不爱看商业书籍的乔布斯都非常推崇，理论非常流行。所以在我们看商业的时候，这种跨越时间、空间、行业的归纳，确实是要反复去做的事情，这也是这个专栏的核心使命之一。


    但在这里我更加强调的是，一定ánchez：归纳的过程比归纳的结果更重要。当我们去做这些归纳的同时，应当要保持一种清醒的意识，就是虽然我们归纳出了这样的规律，但它们并不是一成不变的，甚至很可能在未来的某一天被证明是错误的。所以比起具体的结论，如何得出这个结论的过程更加重要。


    就像我们之前在讲苹果公司的时候，专门花了两天的篇幅研究乔布斯这个人本身（《苹果 | 性格乔布斯》和《苹果 | 乔布斯之死》，你可以在以往的文章中查到）。虽然此时此刻，我们再去给乔布斯这个人下任何定论，意义已经不大了。但如果我们能努力地去还原当时发生了什么、乔布斯到底做了哪些事情、为什么他的某些行为和想法看起来是自相矛盾的？我们就可能更加接近真相，同时在这个过程中，涉及到他的大脑和内心里。在研究商业和研究一家公司中，这样的经历才是最大的收获。这就是归纳的过程。


    # 混沌中寻找秩序


    如果把这个逻辑再往前推一步，归纳的过程本质上也是在混沌中寻找秩序的过程。这里的“混沌”并不是我随意用一个词，而是一个专有名词。有门学科就叫做“混沌学”，开创者是提出了“蝴蝶效应”的洛伦兹，他本人是一位美国的数学家和气象学家。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_84_0.png)


    正是洛伦兹气象学的背景，让他开创了这么一门全新的学科。你会发现，对天气的研究和对商业的研究是非常类似的。我先来讲讲混沌学是怎么被洛伦兹开创的，你就能明白这一点。


    上世纪六十年代初，洛伦兹正在电脑上计算天气预测的数据。当时的电脑运算速度比较慢，于是他为了省事，在某一次计算的时候，没有从头计算，而是使用了上一次计算的结果。为了省事，他还抹掉了结果很后面的几位小数，把它当成新的参数输入了计算机里。然后他就下楼去喝咖啡了。


    结果一个小时回来以后，神奇的事情发生了。他发现这次计算出来的天气模拟结果，完全突破了之前的设定框架，得出的数据和预测的完全不同。这件事让他发现，如果要模拟一个复杂系统的结果，哪怕是关键因子的一点点细微的差异，也可能导致结果的彻底变化。这个小小的意外，就开启了混沌学这门新的学科。


    商业世界同样也是这样。首先，商业世界就像天气一样，也是一个关键因子非常多的复杂系统。其中任何一点小小的扰动，就像那只在巴西煽动翅膀的蝴蝶一样，可能会在另一个地方造成巨大的风暴。我们还可以举之前提到过的迪士尼收购皮克斯的例子：


    想象一下，如果乔布斯的癌症复发之后，鲍勃·伊格尔此推迟或拒绝了收购，可能如今的迪士尼就是另外一个样子了。而如果迪士尼是另外一个样子，后面的漫威和卢卡斯影业的收购可能也就不存在了。没有收购漫威，现在这么火热的漫威宇宙的电影也就不存在了。漫威宇宙电影不存在，可能如今好莱坞大制片公司的运作方式也就不一样了……如此延伸下去，可能我们现在的商业世界都是非常不同的。这就是一个混沌系统里，微小因子的改变带来的结果的巨大不同。


    但同时，我们不要忘了一件事情。那就是，虽然我们很难预测北京明年的今天早上8点具体温度是多少，但我们肯定知道，它一定在某个范围内。比如一定不会是50摄氏度，也不可能是零下20摄氏度。也就可以说，精确的天气预测虽然几乎不可能，但“气候”确是可预测的。在一定的区域内，气候是有规律的，可预测的，可感知的。


    商业的规律也是一样——虽然我们无法精确地做出具体的判断，但一些规律和逻辑是可以感知、归纳的，也是可以指导我们的生活和工作的。当然，在使用任何规律的时候我们一定不要忘了，我们只是努力在一个混沌的系统中寻找秩序，咔能总结出一些规律、获得一点心法，我们都应该非常满足了。


    就像那句话说的：从来没有什么人对高山的征服，只有对高山允许我们去攀登的感激。面对商业，我们也应该有这种敬畏之心——这是一个非常复杂、多元、充满了不确定性的地方，作为其中的一分子，我们应该抱着平和的心态努力寻找一些规律。


    # 自我照照


    最后一点，研究商业的过程其实是一种自我照照的过程。所谓的“自我照照”，指的是我们如何在商业史中看到自己、看到人性。因为慢慢你会发现，所有商业史、公司史，甚至金融史、货币史、娱乐史等等，最终都是人的历史。历史总在重复自己，但又常常常新。本质上是因为人性总是费管始终的，每个人都能在里面照照到自己。


    所以，在研究商业的时候我们应该能够做到两层面的自我照照。


    第一点，研究商业锲韧的应当是自己从多个维度分析思考事物，同时又跳出各种思维误区的能融。商业世界如此复杂、但也因为它的复杂，反过来给了我们提供了绝佳的案例和素材。让我们能够对这个真实的世界有所观察、有所理解、有所连接。在真实发生历史中，去磨练自己思考的能力，是非常难得的机会。


    第二点，也是我常强调的，研究商业就是研究生活本身。如何独立思考、如何与人沟通、好朋友和好伙伴的特质是什么、如何与他人竞争、关键时刻应该怎样做决龁、如何转换自己的人生路线、怎样激发最好的创意，甚至应该有什么样的消费态度……这些问题，商业和公司们其实都告诫我们。'
