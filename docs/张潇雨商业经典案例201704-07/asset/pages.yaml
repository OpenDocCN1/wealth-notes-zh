  md: '# 亚马逊 | 神圣法则

    —— “拜客户教”


    亚马逊 | 神圣法则—— “拜...


    今天我们继续来讲亚马逊。昨天的专栏里，我们对亚马逊的总体业务做了介绍：它的三大支柱业务 Prime、Marketplace、AWS，以及它们之间联动产生的“飞轮效应”，可以说是亚马逊做出了巨大的贡献。


    从另一个角度讲，亚马逊最重要的一个核心理念，不仅对它的成功起到了决定性作用，同时也推动了整个“飞轮”的转动。这个核心理念用四个字就可以概括：拜客户教。


    “拜客户教”是一种略带夸张的说法，不过它也准确地形容了亚马逊最核心理念，就是一切以客户的利益为出发点。你可能想说，现在所有公司都这么号称自己啊。每个公司都说自己把客户摆在第一位，或者客户至上，亚马逊这么说也没什么稀奇的。


    但之所以亚马逊的理念能被称为上“拜客户教”，而且在美国一直位列服务业消费者满意程度的第一名，正是因为他们真的把这个理念发挥到了极致。


    或者我们再进一步地说：真正的理念或者原则，不是在乎平时喊喊口号用的，而是在你面临艰难抉择的时候，指引你的行动的。而亚马逊的很多做法正是这种精神的最好体现。我来举几个小例子。


    # |一切为了客户利益


    贝佐斯在2003年的股东信里写过这么一件事——


    在亚马逊刚刚成立的时候，就给用户开通了评论商品的功能。结果他们收到一些供应商的抱怨，说：你们到底懂不懂自己在干什么啊？你们是靠卖东西赚钱的，为什么允许别人在你们的网站上发负面评论呢？尤其是，当时亚马逊也做过一些市场调研，了解到很多用户确实会因为看到负面或者一般的评论，就不下单了。


    结果贝佐斯说，我们不是靠卖东西赚钱的，我们是靠帮用户做好的消费决策来赚钱的。于是，负面评论的功能就保留了下来。当然，现在这个功能已经成为亚马逊的标配了。


    # |把利润让给消费者


    除了维护各种客户的利益，对客户好还有一个非常重要的方式，就是给客户提供最低价的商品。实际上贝佐斯在很多地方都强调过亚马逊的低价策略，他说：“这个世界上atri种公司，一种是尽可能地说服客户支付一个高的利润；另一种是拼命把价格降到最低，把利润都让给消费者的公司。我觉得这两种公司都能非常成功，不过我们坚定地选择做后面这一中。”


    # |亚马逊的节俭文化


    当然在我看来，印象最深的还是亚马逊公司自己的节俭文化。也就是，它们为了让客户享受到最低的价格，要最大限度地减少成本，所以不惜牺牲自己员工的一些利益。


    张潇雨


    今天我们说的是亚马逊最核心的公司理念：拜客户教。今天来一个小的互动：

    你]在消费的时候，遇到过什么印象很深的好]的消费体验？当时是怎么回事？

    欢迎来专栏后面留言，一起参与讨论。

    我们下期再见。'
