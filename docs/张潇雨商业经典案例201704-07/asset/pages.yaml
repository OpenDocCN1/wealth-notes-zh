  md: '再拿我作为“得到”上的订阅专栏用户来说，我一天的时间和精力是固定的，虽然订阅了所有的专栏，但不是每个专栏都能看，更无法互动，创造内容，对于不看的专栏，我不属于网络效应用户，但我在薛雨老师的专栏这里是。那该如何评估“得到”的网络效应呢？这就是我不会迷信大数据、云计算一类的原因。


