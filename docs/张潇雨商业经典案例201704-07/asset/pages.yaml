    # 耐克


    +   1. 实体生意经常要面临资金周转问题。比如伟大的公司耐克从一开始到上市，一直都很缺钱，而且是生意越好，资金压力越大。耐克上市其实都是一件不得已而为之的事，因为业务虽然非常厉害，但还是缺钱。


    +   2. 小品牌面对巨头怎样才能后来居上呢？应该先从巨头看不上的、不太重视的市场切入，获取非常垂直细分人群的喜爱，再逐步扩张到主流人群，最终统治市场。运动品牌锐步、安德玛都是这样逆袭的。


    +   3. 耐克和运动员乔丹的合作是一次划时代意义的合作。这次合作不仅拯救了耐克的业绩，还定义了一种明星代言的行业标准，同时，还对种族主义说了No。


