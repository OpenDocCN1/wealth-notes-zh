    # Netflix | 巨头百视通的致命错误


    百视通让我想到：永远都是自己打败自己。一家企业经营失败了，往往不是因为竞争对手，而是自己犯了太多错，还做慢地不及及时改正，继续一错再错，最后收不了手。


    大公司看起来的做慢，每个人当下表现出来的可能更深刻。父母有时候对孩子的批评，某种某种意义上是对自己的批评；在训导孩子时候，其实习往往是不敢承认自己曾经或是现在的不足或是做不到。对于社会圈子里自己反感的一些事，总是会有一些不屑的态度,若剥甚至伤害，可能那些讽刺和伤害就是对潜意识的自己的咒骂。人是多面的。大多数人不读者面自己被骂的那一面，当被揭露的时候（在别人身上发生也一样），我们会条件反射地掩饰，证实那些和我无关，对他人的态度就是证明。我想这些都是人的做慢和不自知造成的，人性总是寻找内心的安全感，却不反观自己，还总是没法掩藏。但掩藏一时掩藏不住一世，当弊端积淀久了，这颗毒瘤自然病变，怎么死的呢？就是逃避和自大。毕竟不是每个人都叫乔布斯。


    张潇雨


    说得很好了。商业皆人性。


    听了这两天的课我有这么几点感受：1. 颠覆式创新其实并不会频繁地发生在每一个时代。网飞战胜百视通更多的是赶上了互联网这一时代变革的大风口，就像国内的当时打破新华书店一样。倘若不是处在互联网这一时代大背景下，我很难想象网飞或者当当能有什么颠覆性的手段去打败百视通和新华书店；2.
    并不是每个传统行业的大佬都有壮士断腕的魄力去追赶时代浪潮的。所以正像老师说的那样，百视通、新华书店这样的传统大佬一定会顾及自己的门店业务，因而很难在新时代来临的时候完成华丽转身。毕竟余乔布斯这样的商业领袖只是凤毛麟角；3.
    颠覆式创新可遇而不可求，它需要机遇，需要土壤，需要技术支持，简直就是天时地利人和缺一不可。所以颠覆式创新做的好就好像苹果挑战诺基亚，网飞挑战百视通，万一做的不好的……君不见如今满地都是那些奇奇怪怪的o2o创业企业的尸体……


    马云说：看不见、看不懂、看不起、来不及。大公司最缺的是颠覆自己的认知模式，对新事物首先要及时发现，看懂未来，及时介入。如果百视通成立一个独立部门是否会成功呢？估计也够呛，没有创业环境，从动力上看，新事物负责人拿着高薪怎么能和一拨创业亡命徒比呢？内部竞争的微信、真实创业环境的阿里妈妈、裂变式创业的芬尼克兹是三种较为成功的模式。不要让新业务背旧业务的包袱。


    张潇雨


    亡命徒这三个字说得好……


    # Netflix | 颠覆者的自我颠覆


    转型，不是一个企业面对的话题。它意味着危机，也存在卸筋动骨的危险和依赖性强的情感。这也是为什么这些成功的转型让我们敬佩的原因。找到自己的问题，打破已有的生态链，重塑一个新的商业模式，并发展起来，真的不易。壮士断臂，并且砍掉右臂以后，还能用左臂撑出来绝世武功，实在是值得称赞，譬如杨过，譬如英特尔，譬如Netflix。


    什么是大公司转型？我的理解是这样的：在一个人可以健步如飞的时候，主动砍掉自己的一条大腿，替换成一个天知道好不好用的义肢，在伤疤中磨合等待，也许在不久的将来可以轻松打破世界纪录，也许从此只能在轮椅上度过残生。成功了就是旷世传奇，失败了就是不死作就不会死的典范！


    # Netflix | 把你当作“成年人”的独特文化


    我觉得今天讲的两点Netflix企业文化中，第一点是第二点的一个重要前提，否则第二点就是天方夜谭。只有招到了能力又好价值观又一致的人，才可以成年人的方式去管理公司，毕竟有的时候竞争的人性很容易就战胜了所谓的相互尊重和理解。企业文化：我最近在读的谷歌的《重新定义公司》里，谷歌那种人才之上，尊重每一个创意精英，给他们足够的自由度去发表和思维的文化，被很多公司影响，也影响了更多之后的公司。


    员工自主决定带薪休假时间和报销物品，这个细节说明公司有很强的文化渗透力。即便是员工离职率高峰时，仍然能这么做，说明公司文化价值观是得到主流员工高度认同的。公司减少了一些行政管理制度，用员工高度认同的文化价值观，在员工心里建起的是非荣誉该怎么做、能不能做的群体意识准则，大大提高了效率和团队主动性。公司运营效率和效果极大的获得提升，把企业文化在公司的力量充分展现了出来。我的一位同学，在德国博士公司任职，她有吃虾报销的权利，不过，每次她请我们大家吃饭，无论多贵，她从来不开开发票，因为她认为这顿饭和公司无太大关系，就不应该找公司报销。这就是文化给员工带来的自律，比制度说教强大百倍。


    # Netflix | 投资价值与公司未来


    公司和人一样，有“初生-发展-繁荣-低谷”这样一个过程，而且总是不断循环往复。人有生老病死，企业也一样，哪有什么基业长青呢？即使历史上幸存下来的企业，也都经历了很多变化。人都要经历生老病死，为什么企业就要基业长青呢？后浪推前浪，一代代更替，才有多样性和生机。在出生与发展期持有，敢于投入，一起成长，在繁荣期及时脱手，拿到收益，不贪求更多，有收益比低谷期没有好，及时止损，动态地看待企业，不妄念企业可以一直活的都好。


    我最大的感受是：不能迷信任何的“百试百灵”，即使是当下相对新兴火热的大数据和云计算以及AI。事情的变化和结果是很多因素综合作用造成的，有些我们看得见，有些看不见。即使是单一因素自身变量的波动，有时候一样会带来“蝴蝶效应”。“算法有穷尽的可能'
