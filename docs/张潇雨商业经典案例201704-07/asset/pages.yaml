  md: '一个思考者，思考的是公司的方向和未来的趋势。一个对外的 人，是促进公司的商业化实现，比如销售，比如合作。一个行动的人，想法没法但目标达成，提升生产效率。


    从这里来讲，格鲁夫的性格适合让大家行动起来，像军事管理一样的效率。反过来再说创业公司的团队，需要一个对未来有判断有思考的创始人，需要一个强力执行的CEO，还需要一个能把产品和服务卖出去的人。


    英特尔的三人组可以给我们很多启发，虽然我们不一定会去跟别人搭班子开公司，但是，在实际生活中，有许多人际关系需要我们正确地处理。


    我们可以看不惯同事的做法，但是，当我们在一起工作时，还是要尽量协调好工作，因为只有整体工作做好了，自己的利益才能够保证。


    再者，即便跟陌生人之间，互相尊重，也是对自己的保护。你一个不善意的眼神，都可能给自己带来诸多麻烦。别人的性格好不好，并不影响自己做好自己的事，特别是，如果有共同的事业，更要精诚团结。


    # 英特尔 | 绝境逢生格鲁夫 (4/5)


    印象最深的企业战略转型应该是：星巴克在舒尔茨手里，从一家只卖深烘咖啡豆、小而美的咖啡店，变成一家完美咖啡体验、最成功的商业咖啡品牌。


    舒尔茨不是创始人，但舒尔茨的坚持接续了星巴克的品牌生命，重新定义 的“第三空间”成为星巴克商业与情怀的代名词。从天天咖啡到收购星巴克的 品牌，从无数次敲开投资者的办公室到
    坚持提供最好的咖啡体验。


    用今天互联网的打法来看，舒尔茨无疑 用更加清晰的产品线、更加友好的客户体验和更加丰富的品牌价值认同，重新 拯救了最初那个小而美的星巴克。这份毅力和始终如一让人心生敬意。


    想起苹果在乔布斯回归时，做减法的例子。


    我们都能理解，因为专注才能做好。格鲁夫这个转型战略，难度更大。有点壮士断腕的感觉。


    +   1、存储器业务受到低价冲击，利润下滑，不知道有没有亏损。估计他们判断，前途无望。2、处理器业务还很小，市场不明。但至少管理层是已经看到了处理器的前途，他心里清楚这是未来。


    +   1、慢慢让存储器业务萎缩，加大处理器的投入，这不是很好的平稳模式吗？为什么没选这种？2、直接停止存储器业务，专注处理器业务。


    最大的障碍来源于人心，大家对老业务有感情，也牵涉到饭碗。还是没想明白，格鲁夫为什么要这么选？理由是什么？


    企业转型诺基亚必须是一个经典，开始是做橡皮，然后是橡胶轮胎，再又成为最大的手机生产厂商，但是在智能手机时代退出了手机市场，转而在解决方案、网络和领先科技等领域深入。


    据说现在，诺基亚整体盈利都很好呢。说起来，绝对是一个商业上的经典案例。每一个转变，不能简单用成功或者失败来总结，关键是我们不能转换更多的角度去理解每一个商业里的事件。


    中国公司经典的案例转型，两个微转型。所谓微转型是，舍弃原有的主要业务，但新的业务不脱离原有的行业，又可以引领新的行业发展。


    第一个是大连万达，在2000年舍弃正红红火火的住宅地产，开拓商业地产，就是如今的万达广场，进而拓展旅游，文化产业。万达的这次微转型避开了住宅地产的红海竞争，开拓了蓝海的商业地产，成为业界的标杆和标准。


    第二个是万科，在80年代王石将万科发展为各个行业都涉猎的公司，但最终一年核算下来，没有很好的利润，最后将主营业务定在了住宅地产，只做住宅地产，这一选择才造就了今天的万科，当时王石定了一个标准，利润不能超过15%，不知道这个框框有没有被打破。


    +   1、格鲁夫的经历和“125%解决方案”，让我马上想到了同样经历二战的匈牙利人索罗斯，他们的风格何其相似！


    索罗斯最出名的是1994年狙击英镑和1997年狙击泰铢，被誉为“全球金融界的环球袜子”，被外看成投机、冒险、但其实是非 常严密的分析以后，像猎豹一样迅速行动，一旦有误会敢于承认，以最快速度撤出！


    +   2、时势造英雄，英雄造时势。童年的经历培养了他的处事风格，这种处事风格恰恰是这个时代需要的，而这种风格还沿袭至今，他被誉为硅谷有史以来最伟大的管理者。感觉像是看了一部精彩的电影，这拍成电影一定很好看！


    +   3、格鲁夫的那个问题“新上任的CEO会做什么”值得我们深思，其实也应该成为我们做人生决策、面临人生难题时问自己的问题。这非常有助于我们发现自己到底被什么存量资源绑架了，已有的资源让我们过上好日子的同时，慢慢会绑缚我们，变成“资源担罪”。要抛开存量资源是一件非常艰难而痛苦的事情，不亚于从自己身上割下一块肉来。


    +   4、我想到 的战略转型最经典的案例就是苹果。本身iPod储存音乐已经覆盖整个行业，然后出了iPhone，智能手机就有iPod的功能，对原有业务就是一种挑战。后来又出了扩大版的手机iPad，同样是对iPhone手机业务是一种挑战。


    我们外人看起来就是不断出新产品，但其实每个产品盛极一时之时，投入资源去研发另一个产品去挑战这个原有业务，难度是非常大的！


    格鲁夫做的决策，与其说是在冒险，不如说是他把握住了公司发展的趋势。


    从外人来看，他好象是一个赌徒，可是实际上，作为一家公司的决策者，他一定经过了反复反复的思考，权衡，考量，最后才做出那种惊世骇俗的决定。不管是一个人，一家公司，还是一个国家，首先要选择做正确的事。只要做正确
    的事，才有可能成功，要是做的事情本身就是错的，越努力越悲惨。


    其次，单纯正确，其实也没用，还得加上 持续独立行。如果英特尔死死抱住存储器不放，像大多数公司一样，是绝对不可 能大获成功的。正是因为格鲁夫做到了持独立行且正确，英特尔才成为一家伟大
    的公司，他本人才有那么高的社会地位。


    # 张潇雨


    以上就是本周的精选留言。最后，再卖两个小关子——


    +   1、有不少同学都在问“课表里为什么没有阿里、百度或者小米？”这个问题我之后会回答；


    +   2、另外有一些同学，希望能梳理一下公司的时空轴，以及多讲一讲商业决策的逻辑。这两个小要求，随着后面几家公司讲完，答案就会慢慢浮现了。


    所以，谢谢你的耐心。周末愉快，我们下周见。'
