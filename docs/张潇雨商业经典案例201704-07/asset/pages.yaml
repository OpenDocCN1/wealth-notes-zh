  md: '# 苹果 | 急转直下

    （2/10）


    苹果 | 急转直下（2/10）


    上次我们说到了苹果公司的诞生，第一个爆款产品苹果二代，以及，乔布斯在施乐的研发中心看到了图形交互界面，这可以说是个人电脑历史8898e上的一件大事。


    今天我们来聊聊这之后的一段历史，也就是从乔布斯看到了图形交互界面，到他离开苹果的故事。在这个阶段里，有三个很重要的东西：


    +   - 一个划时代的产品，

    - 一个关键性的人物，

    - 一次历史转折性的事件。


    # 划时代的1984


    先说这个划时代的产品。这个产品，就是1984年苹果推出的麦金塔电脑（Mackintosh）。


    当时乔布斯看到施乐的图形交互界面之后，就放弃了苹果三代的开发，而是想把这个技术迅速使用起来。他开始先做了一个面向企业的项目，但由于乔布斯实在不适合做企业产品，而且那时候他的自大狂性格正是最为严重的时候，所以很快就失败了；然后，他的目光就投向了另外一个面向普通人的个人电脑项目，就是麦金塔电脑。


    如果现在来看麦金塔电脑，就像我们刚才提到的，是一个划时代的产品。不过，这个划时代可能和你想象的不一样。因为它既是一个划时代的成功，也是一个划时代的失败。


    先说说它划时代的成功。麦金塔电脑有两个巨大的、历史级别的成功之处：一是它的广告，二是它的发布会。


    # 广告狂人


    当时乔布斯对麦金塔电脑寄予厚望，找到着名的广告人李·克劳来操刀整个麦金塔的宣传。他们抓住了当时一个重要的社会思潮——


    就是个人电脑刚刚流行起来的时候，很多人都对它抱有戒心，觉得电脑会取代我们的工作，甚至消灭人类，和我们现在对人工智能的想法非常类似；而比如果IBM这种生产电脑的大公司，更像是一种控制大众的邪恶的存在了。


    于是，他们就按照这个思路，制作出了后来被称为20世纪最伟大的商业广告。也就是1984主题的麦金塔电脑广告。


    你可能知道乔治·奥威尔有一本著名的小说就叫《1984》，描写的就是一个令人窒息和恐惧的极权主义社会。而乔布斯和克劳，正好利用了麦金塔也是1984年发布这个巧合。那个广告现在网上就能搜到，有兴趣的话你可以找来看←。


    整个广告是一种金属灰冷的色调，有一种冷峻的科技感。然后巨大的屏幕上出现了一个邪恶的帝国者，代表的就是IBM这种大公司。他在大屏幕上正说“我们必胜！”的时候，一个女性冲出来用一把锤子砸碎了屏幕，代表的就是苹果这种反抗强权统治的，勇敢独立的公司。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_16_0.png)


    而且好玩的是，这个广告里连麦金塔电脑都没有出现，只是预告了一下，接下来苹果要发布这个新款电脑了。广告的最后一小段字幕是：苹果即将在1984年1月24日发布麦金塔电脑，到时候你就会知道，为什么1984不会成为真的“1984”。


    更有意思的是，乔布斯在董事会播放这个广告的时候，大部分董事会成员都觉得，这是自己看过的最差的广告片。但是公司已经花钱买了两个最贵的广告时段，也是美国春晚——橄榄球的“超级碗”的广告时段。于是大家都主张把买的时段转手卖了，别丢这个人。


    还好广告公司和乔布斯都消极抵抗，卖了一个比较短的时段，保留了另外一个长一点的。


    结果，这则广告在“超级碗”一经播放，立刻引起了全国的轰动。美国三大电视网和50个地方电视台都播放了关于这个广告的新闻，可以说在没有互联网的时代，这成了一个现象级病毒视频。这个广告后来也被称为20世纪最伟大的商业广告之一，在广告营销领域青史留名。


    这就是麦金塔电脑广告的故事。现在万事俱备，只等最终的发布会了。


    # 完美揭幕


    1984年麦金塔电脑的发布会，一句话就能说明它的历史意义，那就是它从此给科技产品的发布会设立了一个标杆。你肯定知道，乔布斯在世的时候每次苹果的发布会都有无数人关注，而且他的演讲也是业界不可逾越的标杆。实际上这一切就起源于1984年这场麦金塔的发布会。


    当时乔布斯为了这场发布会，做了很多匪夷所思的设计。比如：


    +   - 他将麦金塔放在一块天鹅绒布下，发布的时候就像魔术师表演一样掀开，让大家看到这台电脑；

    - 他还对发布会所在的剧院的应急灯不满，觉得当整场的灯光都暗下来的时候，那些紧急出口的灯破坏了整个效果，所以要团队一定要把它们关上，但这实际上是不符合消防规范，是违法的；

    - 并且，他还临时决定，让麦金塔成为历史上第一台自我介绍的电脑，因为这给人一种亲切感。所以他同同事在两天内开发出一个语音生成器来，于是当乔布斯掀开天鹅绒布的那一刻，麦金塔说了一声：Hello，我是麦金塔。


    这场发布会取得了前所未有的成功，不管是现场观众、大众消费者还是媒体，全部都被这个发布会展示的东西所折服。一夜之间，所有人都在期待麦金塔上市，乔布斯好像成为了这个世界上最具有魔力的人。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_16_1.png)


    # 名不符实


    可惜就像我们刚才说的，虽然麦金塔在广告和发布会上取得了历史性的成功，但它在产品这个维度上，却是一个划时代的失败。


    因为，虽然营销简直完美，但麦金塔电脑产品本身有着非常严重的缺陷。比如，乔布斯在外观上花了非常高的成本，为了控制整机的价格，只能在性能上妥协，所以麦金塔电脑干什么都很慢。而且，为了所谓的“使用体验的优雅”，乔布斯还没给麦金塔安风扇，因为他觉得风扇很吵。结果麦金塔电脑经常温度过高，出现各种故障。后来消费者管麦金塔直接叫“烤面包机”。


    所以，麦金塔一开始几个月的销量还不错，但是随着糟糕口碑的流传，它销量开始大幅下滑，很快就几乎卖不动了。这个产品在营销上的成功，反而衬托了它在产品上的失败。不得不说是一个巨大的讽刺。


    # 斯卡利：那个赶走乔布斯的人


    后来，麦金塔电脑的失败，可以说间接导致了乔布斯的出局，当然这里面还有一个关键性的人物，也在乔布斯的出局这件事上起到了推波助澜的作用。他就是约翰·斯卡利（John
    Sculley）。


    斯卡利之前做营销出身，是百事可乐公司的总裁。之后来到苹果公司做CEO。这里介绍一个小的背景，就是硅谷公司很长时间以来都有一个习惯，在年轻的创始人们创立公司以后，投资人和董事会一般都会找一些经验更丰富，年纪更大的高管来给公司担任CEO，做实际的管理。而创始人，可以去负责产品、战略等等这些自己比较擅长的方面。这个斯卡利，就是苹果...'
  merge: -1
  img_proc: true
- pgno: 17
  md: '比较擅长的方面。这个斯卡利，就是苹果找来的其中一任CEO。


    而且一开始，还恰恰是乔布斯主张把斯卡利找来的，但没想到后来斯卡利却是那个把他赶出公司的人。当年乔布斯在劝说斯卡利来苹果的时候还说过一句名言，“你是想卖一辈子糖水呢，还是想抓住机会改变世界？”
    糖水指的是百事可乐了，改变世界呢，当然是指加入苹果。


    两个人度过了一段蜜月期，乔布斯觉得斯卡利很有经验，像自己的父亲和导师一样；而斯卡利觉得被这样一个年轻天才所看重，也是特别骄傲的。顺便提一句，乔布斯那个时候只有30岁，已经是一家上市公司的创始人了。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_17_0.png)


    然而，蜜月期一过，两个人 trainers 不合的地方就暴露出来了。乔布斯，一贯是那个脾气很大，又特别骄傲的自大狂；而斯卡利，他虽然对营销很懂行，但是对电脑和科技行业太不懂了，这让乔布斯非常看不起。


    有一个小例子很有意思：斯卡利当初入主苹果之后，招的第一批员工里有一个叫技术助理的职位，其实主要工作就是教他怎么使用苹果二代电脑。


    所以两个人的裂痕很快加深。乔布斯开始指责斯卡利完全不懂产品，斯卡利则说乔布斯的脾气太烂了，而且他号称自己很懂产品，但是麦金塔电脑却做得那么烂。所以1985年3月左右的时候，斯卡利想撤掉乔布斯产品负责人的职务，结果乔布斯不接受降职，反而准备逼宫董事会，让他们解雇斯卡利。


    于是，这时候就产生了之前我们提到的，苹果在早期的转折性事件——这次苹果的高管大会。会议之前，乔布斯先和自己的一些心腹成员推了牌，说自己决定推翻斯卡利。结果这个秘密被苹果的一个高管偷偷泄密，告诉了斯卡利。那时候斯卡利本来要来中国谈一些项目，但是飞机起飞的前一晚，紧急取消了行程，为的就是和乔布斯当面质对。


    1985年5月23日的时候，乔布斯和斯卡利在苹果高管大会上摊牌。出乎乔布斯意料的是，绝大多数的高管、顾问和董事会成员，都支持斯卡利。乔布斯突然意识到自己在苹果的日子好像要到头了，但是他太难接受这件事了，直接冲出了会议室，在路上就哭了起来。


    很快，乔布斯就正式辞职。他把自己所有的苹果股票变卖了7000万美金，只留了一股。为的是还能参加苹果的股东会。接下来，他即将进入离开苹果以后的，人生长达十一年的一个低谷期。不过，这个低谷期也为后来他的王者归来，打下了最坚实的基础。这段历史，我们之后再讲。


    # —— 今日小结 ——


    今天我们讲的是乔布斯被逐出苹果的故事。里面有一个关键的产品，麦金塔电脑；一个关键的人，约翰·斯卡利，这些导致了一个关键的转折事件，就是苹果将自己的创始人乔布斯，正式地驱赶出去。


    下次更新，我们先从故事里跳出来，聊一个很重要的事，就是乔布斯的性格到底是怎样的？只有对这个问题有一个了解，之后我们才能更好地理解乔布斯的决策方法，和苹果这家公司。


    张潇雨


