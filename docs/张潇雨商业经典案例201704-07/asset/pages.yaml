  md: '于想做事的人来讲你要记得两件事：


    第一，你要选择一个比较稳定的市场作为你公司战略的最终战场，不要选择那种变化快快、飞速发展的领域作为最终战场。这里面要注意“最终”两个字，一开始初创期，你是可以非常专注于细分领域的。但是，也就是要说的第二点——


    第二，你要每过一段时间，比如半年左右，把对自己业务的理解向上抽象一个层次。也就是，你到底在干一件什么事？到底满足的是哪个人类非常基本的需求？满足这个需求你还能找到其他哪些方案？


    这才是这期读者问答真正的“题眼”。也就是，你想做的事情，想参与的事情，想分析的事情，想投资的事情，到底需求是什么，以及你应该在哪个层面理解这个需求。


    回到刚才的例子，“骑共享单车”可能是被创造出来的需求，但它又满足了人类一个永恒的需求，就是非常方便、快捷、适宜、高效地出行和移动。所以在这个层面，“共享单车”又不是一个被创造出来的需求。这就是我为什么刚才说，两个看似矛盾的结论，其实并不矛盾。


    研究商业史和公司史的乐趣也在这里，因为在不同的角度与维度，你看到的这个世界运行的规律是不同而又相同的。


