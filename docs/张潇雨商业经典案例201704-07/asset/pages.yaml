- pgno: 35
  md: '# 苹果 | 结尾与终章（10/10）


    今天是两周以来讲述苹果的最后一期了。上期更新我们讲到了乔布斯的去世，话题有点沉重，最后一期，我们就来讲讲五个关于苹果和乔布斯的小故事，作为这两周的结尾。


    # “苹果”的由来


    第一个故事，是苹果公司名字的来历。


    关于苹果公司的名字，有很多版本的传说，比如因为伊甸园里夏娃偷吃了智慧树的果实，完成了人性的启蒙；或者牛顿由于当初被苹果砸在脑袋上，发现了万有引力，所以乔布斯用了这个名字；还有说算机之父阿兰·图灵因身为同性恋被排挤，最后是吃了一个毒苹果自杀的，乔布斯为了致敬他起了这个名字。


    其实这些都不是真相。乔布斯回忆说，主要原因就是他那一座常去苹果园，并且由于一些宗教灵性方面的原因在吃水果餐——也就是只吃水果不吃别的；另外，苹果这个词比较柔和，可以抵消计算机当时给人的恐惧感和阳刚感；最后还有一个理由是——A打头的单词可以排在电话簿比较靠前的位置。


    # 第三个创始人


    第二个故事是个冷知识。


    很多人可能不知道，苹果公司本来有三个创始人，第三个创始人名叫罗恩·韦恩。他是乔布斯的旧同事，主要负责在乔布斯和沃兹尼亚克之间斡旋，调和他俩的关系。


    苹果成立的时候，股权结构是乔布斯和沃兹尼亚克各占45%，韦恩占10%。但韦恩之前创业失败过，心有余悸，对个人电脑行业以及乔布斯这喜怒无常的老板心里又打鼓。所以公司成立11天之后他就要求退出了，后来公司用2300美金回购了他的股份。


    如果他持有到现在，这部分股份的价格应该超过了70亿美金。


    # 音乐革命


    第三个故事是个管理学上的门道。


    你可能还记得，之前的更新里我们提到，乔布斯在推出iPod之后，建立了音乐商店，让大家能以99美分的价格购买一首歌。这个举措也给音乐产业带来了革命。当时他为了促成这件事，需要和五大唱片公司谈判，其中一个就是索尼唱片。


    但这里面有一个非常微妙的事情。你想想，索尼是一家音乐产业方面很厉害的公司，它的电子消费品比如随身听、CD机、MP3音乐播放器等等，都是业界标杆性的产品。同时，它的唱片公司旗下也签了很多大牌歌星，比如乔布斯的偶像之一鲍勃·迪伦（Bob
    Dylan）就在索尼旗下。但是，为什么索尼没有想到这种改变音乐产业的商业模式呢？


    最主要的原因是，索尼的不同部门都是各自为战的，大家首先想到的是维护自己地盘的利益。比如，99美分卖一首歌的举措，可能会暂时影响自己部门的收入，如果你是这个部门的负责人，可能就不太情愿推动这样的变革。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_35_0.png)


    但苹果在这方面就做得非常好。直到今天，苹果公司内部也是没有所谓 “iPhone部门负责人”、“iPad部门负责人” 这样的职位。因为一旦设立了这种职位，大家的天性就是维护自己的产品和部门，利益一旦形成，想要撤走就很难了。


    所以苹果在2014年停售iPod的时候，是不用有什么顾虑的。只有这样，公司才能不断迭代，自我颠覆。也许未来某一天，迟iPhone也要被停产了。


    # Apple Store：又一个天才产品


    第四个故事，我们来讲讲Apple Store，也就是苹果的线下零售店。其中也蕴含了苹果非常多的思考和智慧。


    乔布斯第一次萌生开线下零售店的想法是因为，他觉得，所有苹果产品的体验都已经打造得很好。只有一个环节还是例外，就是用户购买苹果产品本身的体验。


    于是乔布斯就准备自己开店，把这个环节的体验也掌握在自己手里。结果，不管是董事会还是同事，都觉得这是一个很糟糕的主意。因为当时是2000年左右，一方面互联网泡沫即将爆掉，另一方面大家都开始非常重视电商，为什么要劳民伤财开线下店呢？


    所以，历史上很多伟大的产品都是这样，一开始都是不被看好，甚至被冷嘲热讽的。


    好在乔布斯比较坚定，他聘请了美国著名超市塔吉特的高管鲍勃·迈和他一起来做这个项目。他俩的目标都是，打破传统零售的旧观念。一上来，他们就提出了三个和传统零售思路非常不一样的观点：


    首先，他们认为苹果店一定要开在非常繁华的地区以及购物中心里，无论租金多贵。而传统观念认为，电脑手机之类的产品，更换的频率不是很高，不像日用品，所以大家应该是愿意开车去比较远的地方买的，这样租金成本也低。其实这也有道理。但乔布斯认为，产品一定要反复和用户对话，吸引他们走进来看看，能激发他们的好奇心，这才是最重要的。


    第二，乔布斯说，苹果本身的产品就那么几种，肯定没有百货公司那么多，但是苹果的店一定要大，这样才能显示出苹果的品牌感。否则店很小，大家就会看低你一头。所以上来了乔布斯就不惜成本地用最好的材料和设计来打造苹果店，而且面积通常都很大。


    最后，乔布斯认为，苹果店本身能卖多少货并不重要，重要的是消费者的体验。所以他搞了 “天才吧”，目的就是让用户直接在店里接受服务，虽然这个名字经常被很多人吐槽。他也给零售店员工进行了很好的培训，举办各种讲座等等，都是为了让用户更好地使用苹果的产品。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_35_1.png)


    在店的设计上，乔布斯当然也花了许多心思。比如，如果你去过苹果店的话，那个很经典的，透明的旋转楼梯，就是乔布斯的发明，专利写的是他的名字。这个楼梯的灵感来自于当年他在NeXT办公楼设计的楼梯。


    第一家苹果店在2001年5月19日正式开启，推出后获得了巨大的成功。比如，纽约第五大道的哪家苹果店，现在是全世界各类型商店里每平方公里销售额最高的地方，比LV、蒂凡尼珠宝，甚至是巴克、麦当劳的店，都要高出很多。


    苹果零售店，也是乔布斯在iPod、iPhone、iPad之外，打造的又一个现象级的产品。


    # 结尾与终章


    我们已经讲完了四个小故事，关于苹果名字的来历，早早退出的第三个创始人，苹果的管理理念，以及苹果零售店的故事。想想这两周的时间里，我们跟着苹果和乔布斯走过了一段跌宕起伏的旅程。相信你也发现，即使是苹果这么伟大的公司，也曾经有很多困难；而乔布斯作为一个如此伟大的CEO，也有脆弱和矛盾的时候。


    在这段旅程的最后一小段，我想暂时忘掉那些镁光灯与光环，回到乔布斯这个普通人身上的。我来读读《史蒂夫·乔布斯传》这本书的最后一段话，作为两周专栏的一个收尾吧：'
