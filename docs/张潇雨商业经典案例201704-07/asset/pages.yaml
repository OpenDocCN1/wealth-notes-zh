  md: '# 携程 | 以小博大的收购


    携程 | 以小博大的收购


    今天我们继续来讲携程这家公司。之前我们反复讲过一个案例，就是迪士尼对皮克斯的收购。（推荐阅读：5月24日《迪士尼 | 买买买帝国》）


    当时我们说，一方面迪士尼与皮克斯在业务上非常契合，皮克斯帮助迪士尼这台以内容和IP为引擎的机器加足了马力。另一方面，拉赛特和卡特穆尔把皮克斯良好的工作方式和生产创意的方法带入了迪士尼，也反过来帮助迪士尼重新焕发了活力，确立了行业的霸主地位。


    有意思的是，携程通过两次收购也达到了非常类似的效果——这两次收购里，一次直接帮助携程锁定了一笔行业寒冬期时候的巨额融资，一次带来的人才使得携程的业务有了将近100倍的提高。不过和皮克斯74亿美金的大型收购相比有些不同的是，携程的两次关键收购都发生在公司的早期。


    所以，今天我们就从另一个角度来讲讲企业的收购，看看这两次收购给携程究竟带来了怎样的影响，以及携程是如何在自己仍然弱小的时候完成如此重要的收购，以小博大的。


    # 收购现代运通


    对于携程来说，在早期它做的最重要的两笔收购，一个是王胜利带领的现代运通公司，另一个是从商之行出来的吴海。


    你应该还记得之前我们讲到，携程在早期的时候经过一次小的转型，从旅游门户网站转型到了酒店客房预订。但是酒店这个行业相对陈旧，想要快速做起来并不容易。所以携程的团队就萌生了收购同行其他公司的想法。


    他们的第一个目标就是王胜利带领的现代运通公司。现代运通其实是国内第一个酒店订房中心，公司还背靠着有空军背景的蓝天实业，实力比携程雄厚得多。王胜利也是一个非常出色的管理者——现代运通在他的带领下，最初的几个月里就以每个月100%-200%的火箭速度增长，迅速成为了全国最大的酒店分销商。现代运通当时峰值一个月有2-3万的房间预订数量。


    而携程当时做到了多少呢？一个月900间夜左右。而且，携程不仅公司还在亏损，那时候还没有完成过一轮50万美金的融资，第二轮融资还没到账，银行里的现金少得可怜。


    在这种情况下，携程是如何以小博大的呢？总结起来，仍然是天时、地利与人和。


    那个时候，国家正好开始整顿军队搞实业的问题，所以现代运通的命运是必须要被卖掉，此乃天时。从另一方面来说，这次收购要感谢互联网泡沫。因为携程这家公司虽然现金不多，公司也在亏损，但它由于借了互联网的概念，在资本市场的估值却非常高，那时候他们正在洽谈第二轮融资，估值已经到了6000万美金，所以，季琦沈南鹏们的如意算盘是，只用很少一部分现金，加上一些携程的股票就能收购现代运通，此乃地利。


    但做成任何看似不可能的事情，光有天时、地利都是不够的。即使当时现代运通的出售已经不可避免，但携程远不是最有实力的那个收购者，看上现代运通的企业还有很多。比如当时背靠着李嘉诚的和记黄埔和长江实业的华夏旅游网，以及背靠着华晨集团的上海华晨旅游。


    比起这些实力雄厚的公司，携程有的只有自己的诚意。当时，梁建章和季琦频繁地飞到北京找王胜利聊天，反复强调来到携程大家可以一起做事情，实现自己的理想。而王胜利恰恰也很希望把自己在现代运通没有实现的东西继续下去。


    后来他也说，他那时候觉得虽然携程公司还不大，但自己和四个创始人接触下来，觉得他们有知识、有文化、有眼光、有魄力，这一点，和他接触的其他公司都不一样。最终，对团队的赏识促成了这次关键性的收购。在2000年10月，携程以几百万元现金加上携程的股票，整体收购了现代运通。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_93_0.png)


    在早期携程做对了一系列事情里，收购现代运通可能是最重要的 一件 事。这次收购不但让携程的用户数扩大一倍，也让王胜利来到携程，后来为北方市场的开拓做出了巨大贡献。


    当然，这次收购一个最直接的结果就是，它直接敲定了携程第三轮的融资。因为当时的主投资方，美国的凯雷集团提出的投资携程的先决条件就是，成功地收购现代运通。于是，在收购的一个月之后的2000年11月，凯雷集团以及其他联合投资方的1200万美金融资及时到账。


    也就是说，在那个互联网泡沫刚刚破裂，大批创业公司正在等死的时候，携程却拿到了天文数字的弹药，供自己施展拳脚。这就是这次收购带来的巨大意义。


    # 战将吴海


    而另一次收购的意义同样重大。它带来的是后来携程主管销售、市场和商务开发的高级副总裁：吴海。


    比起业务上的彼此需要，这次收购更像是硅谷经常提到 的一个名词——“Acqui-hire”，这是一个用“acquire收购”这个词和“hire雇佣”这个词拼接起来的词，说的就是互联网公司侧重于人才的收购现象。


    吴海这个人，也是中国酒店行业的一个传奇人物。他毕业于中央财经大学，很早就进入了旅游行业。在1999年，吴海也嗅到了酒店行业的商机，创建了自己的公司商之行，主打订房业务。同样，当携程做到每个月预订900个晚上的时候，吴海的商之行已经做到了三万。


    不过，由于缺乏更强的融资能力，吴海只能把商之行卖给了一家美国基金，自己只留下了一小部分股份。然而他和这家基金的合作并不愉快，所以也萌生了离开的念头。'
  merge: -1
  img_proc: true
- pgno: 94
  md: '季琦在发现吴海的去意之后，反复地和他沟通，希望他能够来携程工作。因为吴海具有的正是携程缺乏的把订房量规模化做上去的经验。最终，季琦给了吴海极大的授权，还接收了他带来的商之行的全部管理层。


    吴海任职之后，马上在携程复制了商之行的做法——建立呼叫中心、建立销售队伍、建立酒店谈判团队等等。只用了非常短的时间，携程的订房量就涨了几十倍。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_94_0.png)


    另外非常值得一提的是，吴海和他的团队还带来了一个携程早期极为成功的推广方法。

    那就是，蓝色携程卡。


    所谓的携程卡，其实就是携程早期在机场免费发放的会员卡。这也是来自于吴海早期在商之行的成功经验。当时他也面临着怎样获取客户的难题，尝试过很多方法。后来在一一次会上一个员工讲了个故事：他有一位朋友，是卖牙膏牙刷的。销售方法很简单，就是雇佣大量销售人员，按家按户上门推销。结果这个看着不起眼的方法，让他一年赚了3000万元。


    吴海受到了这个故事的启发，于是开始到机场发卡片。结果由于那时候市场需求真的存在，很多接过卡片的人在需要订房的时候就会拨打上面的电话。那时候，这种“发卡”的方法带来的转化率有惊人的30%。吴海后来也把这种推广方式带到了携程。


    另外，吴海还给发卡人员每个月一万块钱的工资，在2000年的时候，这绝对是一个天价了，所有人都觉得他疯了。但是吴海说：“他们想要拿到这一万块钱，就要日夜加班，下班后以及周末都要在北京的王府井，上海的外滩找客户。哪怕在写字楼被保安打，在机场被警察,$(...)$。这就是我要的效果。”现在想想，其实这应该就是在中国互联网行业一直屡试不爽的“地推”在早期的一种尝试吧。


    吴海的这个策略奏效了？数据就能说明问题。在他2000年3月加入的三个月之后，携程的每月预订间夜数就从不到1000增长到了2万。又过了几个月，携程已经是全国最大的酒店分销商了。而到了2001年年底，吴海因为个人原因离开携程的时候，18个月里携程的订房量从每月几百，增长到了10万。


    这次人才的收购，也为携程的成功打下了最坚实的基础。


    张满雨


    今天我们讲了携程关键的两次收购。一次利用互联网公司的高估值以小博大，锁定了融资；另一次是对人才的重视带来了业务的百倍增长。


    今后，我们还会利用讲解不同公司的机会，继续来说说商业并购的逻辑。


