  md: '到菜市场，都在对这一不断增长领域的消费进行蚕食。曾经是一头狼吃独食，现在虽然肉多了，但是也扛不住狼多啊！


    # 美国零售简史 | 战略第一问：你的核心客户到底是谁？


    想起了一句老话：打铁还需自身硬。如果没有麦当劳对食品品质和服务的高标准，怎么会有收取加盟费和收取授权费的盈利模式？没有好市多极致的多快好省，怎么会有收取会员费的盈利模式？自身本职业务的高标准严要求是如此重要。回想起前面专栏写到战略的一句话，不要用战术的勤奋去掩饰战略的懒惰……战略规划优于战术部署。战略大方向不对，也就是核心竟争力和核心用户都没搞清楚，再优秀的战术也不会起到太大的作用。这也告诉我们自己，任何事情先去挖掘事件背后真正的核心因素是什么，再采取相应的行动。


    Costco收取会员费是个人非常高明的决策，会员费一次投入后，相当于沉没成本，大部分人不会再去计算会员费投入。会员接下来买什么都觉得便宜，其实都均摊在了会员费里。但如果不收会员费，Costco需要对每种产品进行更加细致的分析，消耗更多的人力物力，将会费分摊到各种商品里，最终价格可能显得没有现在这么超值，客户的满意度和忠诚度也可能没有现在稳定。通常一家公司很难占领整个市场，往往只是一个小份额，那么对客户和产品的定位至关重要，我认为比较理想的是找到一个有共同特性的群体，对这一部分客户服务做到极致，然后凭借法则四周拓展。不应该从起始的时候就想着垄断市场，虽然这可能是最终目标，但对初期打入市场并不一定是个好选择，因为缺乏核心竞争力和核心客户，很有可能会被多个竞争对手瓜分市场。


    如何定义核心客户是从起步阶段就要确定的，尤其是现在细分市场越来越聚焦，一定要瞄准目标仔细打造产品，现在做面向所有人的产品越来越难。至于如何从目标顾客那里赚钱，其实我觉得就像专栏里讲的，要么通过产品，要么通过会员。通过产品又分两种方式，可以是一个好到超过行业水准或是独一无二的产品卖一个客户愿意支付的高价，或者是走量加一个非常小的毛利来赚钱，不过这种走量的流量思维越来越困难了。


    这是一个供应链管理问题。每个行业都是一条供应链，或者叫利益链条。通常，每个公司都处于利益链条的一个环节中，对自己下游提要求，以自己的上游为核心，这其实没错。但是当这个链条出现问题的时候，作为整合供应链的主导者，也有义务进行修正。在麦当劳的供应链里，消费者才是核心。没有了消费者的满意，链条就不存在了。好市多也一样，消费者对低价、品质、省时等满意，是整合供应链的核心。最好的方式是，技能服务好上下游，也能促进整合链条良性运行。


    1. 关于怎样选择核心客户，有清晰的理念、进行合理的差异化竞争很重要。2. 举例：刚好在隔壁羽绒 “知识内参” 看到丁磊在接受采访时提到，网易是一家有品位的、创新的科技企业，网易对品位的要求和追求，是网易和其他互联网公司最大的差别。在特定的场景下，品位能提高用户愉悦度，这对产品创新开发有帮助。所以网易在产品开发上面，无论是网易严选、网易云音乐，还是网易养猪，都很注重品位，追求把产品做到极致。比如网易严选，把一些基本的生活品例如拖鞋、毛巾、浴巾等做得非常精美，性价比很高，硬是从京东、阿里这些强大的竞争对手那边分流了一部分客户（包括我最近也是频繁在上面消费）。这个过程，品位起了很关键的作用。3.
    总结起来，我觉得在如今这个“消费升级”的年代，新消费以品质、个性为核心，尤其是近90后成为品质消费新力量，未来年轻人对消费品质的要求将远高于现在。因此网易在定义核心客户时，“做有品位的科技企业”这个战略定位就符合了未来的消费趋势。


    # 美国零售简史 | “地产公司”麦当劳？


    一直以为麦当劳是靠薯条可乐汉堡赚钱，今天发现原来利润的大头在加盟商付的租金和授权费。突然意识到，我们很少去认真地观察一家公司的商业模式，而是想当然地流于表面和惯性思维。Costco和麦当劳的共同之处：1.
    做好产品，通过产品的附加值来赚钱。麦当劳的产品是可乐汉堡之类的快餐，通过产品打造品牌，通过品牌吸引加盟商。Costco通过低价产品吸引消费者付会员费。2.
    目标清晰。Costco目标客户就是中产阶级，产品都是大剂量的，用于家庭，其他群体不考虑。麦当劳的目标客户就是小孩子和青少年，产品就是他们喜欢吃炸鸡汉堡，大人老人不考虑。


    麦当劳和好市多都在追求一种不会被竞争对手轻易攻陷的稳定收入，卖薯条和对供应商压价都只是他们留住客户的手段。相应的，麦当劳做出来的就是稳定的租金收入，好市多做出来的就是稳定的会员费。越是对零售理解深入的经营者，越不会把收入和利润寄托在销售额的增长上。


    通过这两天的学习，我在写留言的时候突然想到了这两家公司都是看到了商业（人性）本质的公司。Costco做到了满足消费者低价、高质，减少选择成本的服务。反过来也给生产厂商指明了生产方向。最重要的是，他们看清了利润如何分配，并且做到了获取（并且只获取）属于自己的那一部分利润。麦当劳则是满足人们，能够用快速美味的食品，解决饥饿问题之后，带动其他相关（有意向有能力）从业人员进入麦当劳，一起用“麦当劳”的方式，用过解决人们“吃饭”的问题，改善周围环境和参与者的劳动收入。他们都做到了在自己用核心（商业逻辑、价值观）竞争力之后，给相关上下游赋能。


    最近学习专栏的感悟：我理解商业创新的一个角度，在一个产业链条上，利润被不同的环节按照不同的比例进行分割，而商业创新就是打破这些利润分割的比例，进行重新洗牌，排位座次。科技创新改变社会和人们的生活，包括商业。


    好市多和麦当劳的秘诀是PK维度。人们普遍会认为零售就是赚差价，差价越大，利润越高；餐饮也是赚差价，差价越大，收入愈丰。而上述两家公司恰恰跳出来人们普遍的认知空间，将人们普遍认为的利润点全部放弃，从而打击对手，得到口碑。做出品牌影响力，获得巨大市场认可后，从其他维度产生超级利润。从这个角度上看，现代互联网公司补贴大战同出一辙，速度不计成本地占领市场份额，从另外的维度上实现利润。


    # 美国零售简史 | 仓储会员超市：Costco的低价与严选


    以前去过迪卡侬，这是一家法国的运动用品的大型超市。里面商品的种类也比较少，没有太多选择，产品包装简单，甚至就是没有外包装，价格适中，质量有保证，里面购物环境也不错，没有服务员给介绍等，体验比较好。不过迪卡侬好多产品都是自己产的，自产自销能够更加激烈地控制供应链。它也有会员制度，不过不像好市多只有会员可以来。还有就是它会组织很多运动活动，把消费者组织起来，归属感比较强。总体上，我觉得二者都是定位准确，服务人群小众，对供应链控制强，保证低价优质，从而口碑非常好。


    今天讲了美国另一家零售巨头好市多。这家零售企业也非常会做生意，虽然没打 出“天天低价”的口号，但这么低的毛利率就可以看出，它为客户让利的决心和态度了。从财务上看，它的利润只是会员的会员费。所以只要购买了会员费，在买想要的商品时，基本上是厂家直销模式了，并且还“中间商不赚差价”，赚到的少数利润可能和仓储、运输成本等都抵消了。还有特点特别的是它的目标客户很明确，就是中产阶级。'
