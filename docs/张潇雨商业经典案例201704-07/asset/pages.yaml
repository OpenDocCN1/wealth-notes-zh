  md: '# 周末互动 | 不积跬步，无法在关键时刻更有底气


    又到了周末和你互动的时间。


    本周我们说的是Netflix。在开篇的时候我就说，Netflix在商业界是一家非常经典的公司，可以说它的成长之路就像一本商业教科书一样，验证了非常多的理论。另外，这也是一家我个人非常偏爱
    locating 公司，当然并不在于Netflix拍的剧非常好看，而是这家公司的发展历程蕴含了很多商业和人生的道理。今天的互动，本着这个专栏的周末内容一贯质量很高的原则，加上给Netflix一个好的收尾，我来给你讲一个经典的商业现象。


    在2016年的時候，《哈佛商业评论》刊登过一篇研究，说的是很有意思的一个商业现象：就是他们发现，那些从创立开始到后来，创始人能一直担任公司的最关键角色——比如CEO、董事长、总裁等等——的公司，长期表现会比那些中途更换了CEO之类的公司，要好很多。这些好体现在很多方面，比如最直接的利润和股价，还有公司的投资并购的表现，甚至专利数量等等。


    趁这个机会我们可以复习一下之前的內容，给你提供一点知识背景。之前有一篇文章我们提到过关于创始人是否要担任CEO的话题，就是《迪士尼 | 被“成年人监管”的CEO》（文未有文章链接）。里面我们提到过，硅谷一直有一个所谓“成年人监管”（adult
    supervision）的文化，就是当年年轻的创始人创立公司以后，投资人和董事会往往会找来一个更成熟的职业CEO帮助他们管理公司。最成功的例子就是谷歌的埃里克·施密特了。另外，硅谷之外的传统大公司，不管是迪士尼，还是你肯定听过的福特、通用电气，都有外来或者提拔的新CEO力挽狂澜、拯救公司的经典案例。所以，当时这篇《哈佛商业评论》的研究报告一出，还是引发了很多讨论的。


    我在文稿里附上 Dawn 報告裡的一張圖，是從1990年至2014年，研究團隊統計的“由创始人领导的公司”和“非创始人领导的公司”的一张对比图。在图中你可以清晰地看到两类公司回报的不同。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_115_0.png)


    所以，到底应该怎么解释这种现象呢？


    后来，在研究了很大大大小小的公司和材料之后，我得出了两个最核心的结论：


    首先，相信你应该同意，现在不管任何类型的公司——互联网公司也好、创业公司也好、大型传统行业的公司也好——所有公司的前进动力都是创新。在这样一个充满快速变化的时代，公司的适应能力、调适能力和创新能力是非常重要的。但是，创新往往意味着长期投入，而职业CEO往往只能盯住公司相对短期的效益，因为他们的薪酬和收入往往就是和短期的股票价格、收入利润挂钩的。


    另外，由于他们常常是空降而来，所以对这家公司的理解无法像创始人CEO那样非常深入——深入到很具体的产品细节、深入到整个团队的架构方式，甚至深入到核心团队的每个人当年是怎么招来的，性格脾气怎么样等等。这些都限制了一名职业CEO发挥的余地，所以他们更倾向于把目光投向那些可以立刻改进、立竿见影的地方，比如缩减成本、裁撤人员等等。而作为公司的创始人和CEO，他们不仅对公司大大小小的方面有更深入的理解，而且他们更可能以一种养育自己孩子的心态，去关注更长期的发展。


    所以，创始人CEO往往敢于投入一些暂看不到效果的产品或者技术，而往往也是这类产品，才能带来最大的回报。在这方面，很多创始人CEO都做得非常出色，比如亚马逊的杰夫·贝佐斯、Facebook的扎克伯格都是这样。亚马逊现在的明星业务AWS云服务，还有Facebook对WhatsApp190亿美元的收购，都不是立刻能给公司带来利润的业务，但现在都成为了明星业务。另外，还有一个好例子，就是我们这周讲的Netflix的创始人里德·哈斯廷斯。他几次带领公司转型，也是这个道理。


    所以，第一个核心原因就是，创始人CEO更容易做长线的思考。


    第二个原因我觉得更加有意思，而且也是人们常常忽略的一个因素。那就是：创始人CEO往往有一种“道德权威”，能让他们在关键时刻强硬地做出艰难的决定。


    什么是“道德权威”呢？


    这不是我发明出来的词，在英语世界里有一个对应：Moral Authority。“道德权威”指的是什么呢？是这样的：任何一家公司想要不断地发展、想要基业长青，往往意味着在发展的过程中，要不断地转型、变革、抛弃存量——相信你在读了我这么多专栏之后，肯定已经感受到了，不管是大公司还是小公司，都经常会面临这样艰难的抉择。而这种转型，往往意味着公司要抛弃很多之前的业务、用户，甚至整个公司的文化和信仰。而在这种时刻，往往只有创始人CEO才能做出这种艰难的选择——因为说白了，公司的
    一切都是他创造的，所以他也更有底气来推翻这些东西。所以，创始人CEO在公司往往有一种“道德权威”感，这通常成为了他们成功的原因。


