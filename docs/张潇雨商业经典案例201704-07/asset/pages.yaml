  md: '# 周末互动 | 潮流易逝，但风格永存


    周末互动 | 潮流易逝，但风… ↓


    > "Fashion passes, style remains. —— Coco Chanel"


    又到了周末互动的时候了。这周我们讲的是耐克，我最想讲的一个关键词是：潮流。


    其实耐克这家公司有很多着眼点，但我觉得最值得解读的还是“潮流”两个字。耐克这五十年来 gek发jo历ʧ史，就是潮流的变迁史。


    从一开始，推广日本跑鞋，是一种潮流；到后来“Just Do It”广告语，是一种潮流；再后来女性健身的兴起，它落后于竞争对手，是一种潮流；到乔丹这个子品牌受到非常多人推崇，形成了一种街头文化，是一种潮流；到之后把自己的产品和专业运动员、科技和体育精神联系到一起，是引领一种潮流；到这几年所谓“运动休闲风”的新风潮，耐克又开始落后并且正在迎头赶上，还是一种潮流。


    所以，我说耐克不只是一个普通的运动品牌，更是社会潮流、时代精神的一个缩影。几十年来潮流的变迁，也映照了耐克这家公司上上月下、起起伏伏的变迁。


    在周四的专栏内容中，我们做了一点大胆的延伸——把耐克这几年的发展和女性吸烟的历史联系在了一起。其中有一件事值得多讲一下。在推广女性吸烟的消费理念时，女权活动家们说出了一句经典的“我们举着的不是香烟，而是自由的火焰。”


    这背后是商业、社会学、消费心理学甚至广告学里面非常核心的一个概念：当我们在消费的时候，很多时候我们购买的是一种身份的象征，或者说是阶级的标签。


    举个例子。如果你观察时尚，你会发现，某种时尚的流行通常发源于明星、王室、精英阶层突然开始穿着某种东西，接着社会其他阶层开始模仿他们的着装、搭配等等。消费品牌也会说，某个明星、名人也用爱马仕，吃米其林餐厅，参加某种体育活动，比如冲浪、攀岩、潜水、蹦极等等。于是更多的人跟随他们进行类似的消费活动，这样逐渐形成了某种时尚。你可能经常听到的一句话“XX同款”就是这一现象最好的说明。


    再举个小例子，来看看上层阶级的生活方式是怎样向下渗透影响的。你可能知道，美国的中产阶级，很喜欢买个房子，房子的门口有草坪。可以和孩子，家里的狗在草坪上玩。但实际工业革命之前，草坪是贵族才有，中产阶级没有能力在家里拥有草坪。因为没有机械化的设备，完全靠人力进行草坪的维护，成本是非常高的；而且除了欣赏价值，草坪并没有任何实际用途。


    这也是显彰自己身份的一种方法，说白了就是，你看我钱这么大手大脚做一件这么没用的事，说明我的人生是非常闲适的。后来，这一句话被中产阶级学走了，他们也开始弄草坪。当然，有自动喷水器等现代化装置的帮助，现在维护草坪的成本已经大大降低，不过这种生活方式和习惯保留了下来。


    所以，很多时候——当然不是所有——当我们在购买一个产品或者一种服务的时候，本质上是在购买一种标签，这种标签的作用就是帮助我们来定义自己在社会中所处的位置。而如果你社会位置相对稳固了，不用太在意别人的评价了，其实跟不跟随潮流和时尚就没那么重要了。


    有很多例子可以证明——


    政治家和王室的服装风格，几十年都不会有大的变化，风格非常稳定；


    乔布斯或者扎克伯格这种成功的企业家，靠着套头衫牛仔裤或者黑色T恤，行走江湖一点也不违和，甚至还有很多夸奖；


    甚至各国军队的服装风格，几乎也不会有什么大的变化。这些都证明了，时装、时尚和潮流，往往是某种阶级的标签，加上消费品牌与媒体的一场合谋。


    明白这个道理之后，我们应该怎么做呢？其实这套逻辑之所以成立，很大原因在于，人是很难完全了解自己，也不知道自己到底处于一个什么位置的，于是就会受到别人评价的影响。当我们的内心会<|start|>一种不安全感，就会希望用外物来理解自己、定义自己。


    所以，如果你想打破这种循环——这里说的打破，并不是不要进行任何消费了。我一直说我们不可能生活在真空里，而且正是自由市场经济的存在，我们才能享受这么好的东西——它就是打破一种完全被他人带领的盲目消费的循环，最终还是要回到自己。


    你可以努力去创造一些东西、去努力了解自己真正想要的是什么，然后明白，是你创造了什么东西定义了你是谁，而不是你消费了什么东西定义了你是谁。


    消费的潮流总是一波一波地来，媒体、明星、大V们总会不断地告诉你，什么东西是新潮的，什么东西是时尚的。但当你非常了解自己是谁，有了真正属于自己的风格——不管是穿衣风格、说话风格，还是做事风格，你就更不容易受到他人的影响了。你也会发现自己变得更加自由。


    张潇雨


    下周，我们会开一个一周的小专题，给大家讲讲我研究商 业史的原则和方法。我花了很多人心来梳理和总结这个专题的内容，敬请期待。 今天就到这里，我们下期再见。


    # —— 本周留言精选 ——


    # 耐克 | 世界第一（日本）运动品牌？


    通过张老师数字化地描述耐克的实力，让我大吃一惊、原来一直阿迪耐克地叫，原来两者之间差距得好远。


    说起奈特，他利用了当时社会科技不发达背景之下信息ög极度不对称、成功地忽略了日本人，但其中我看到了几点索特未来成功v必要因素：


    +   1. 耐生想法就马上行动去日本，这正是 "just do it" 的完美诠释；

    2. 作为一个鼾鼾害羞的人，可以突破自我，远赴日本寻找鞋代理，这和耐克不断鼓励每个人突破自我的品牌理念非常一致；

    3. 在短时间内可以迅速通过联想编出一个公司，体现了他的临场发挥应变能力。


    商业策略应当随着时间的变化而进步，奈特五十多年前的善意谎言，在这个互联网时代，没有任何的可能性。所以现在的年轻人还是应该脚踏实地，积累好自己的能力，在面试或谈判之前，利用现在的技术，穷尽对方的资料，做深度的调查，做到知己知彼，然后尽可能展现自己的与众不同。


    我想到马云腾老师专栏里讲的一个故事，说马云是如何给支付宝上牌照的。阿里的大小股东是软银和雅虎，马云的股份不到10%。支付宝这样的支付服务需要银行发牌照，当时非常稀缺。马云悄无声息地把支付宝移出阿里巴巴公司，移到了一个叫阿里巴巴电子商务有限公司的机构，马云在这家公司占80%的股份。2011年，中国人民银行把第一张电子商务的牌照给了支付宝。马云跟投资人解释说，央行要求进入支付服务行业的非金融机构不能是外资或合资的，所以阿里巴巴不能拿这个牌照。结果，雅虎的杨致远跑去问央行为什么会有这种规定。央行回复外资可以申请牌照，只是需要更长更复杂的申请流程而已，并没有不准许。我觉得对商人来说，欲望和野心可能比能力更重要，是决定能不能把生意做大的原动力。中规中矩的人可以更多规避风险，但也难以闯出一番事业。创造历史改变世界的人，在关键时刻可以不遵守规则，甚至让自己成为后来的规则。常人的不理解不接受，无法阻止他们前进的脚步。


    创业公司这种善意欺骗和撒谎，我觉得很像幸存者偏差。如果当初耐克拿不到代理权在美国销售失败的话，估计鬼冢公司是不set善罢甘休的。 今天这个案例我想到了一个可能不太恰当例子，就是微软的空手套白狼、比尔·盖茨签约了别人的DOS系统、变成自己的。'
