    \n# 亚马逊 | “超级接口化” 的公司\n\n我以前认为：商人、外交官之类的都是谋私利的野心家。现在才认识到但凡能有所成就的，都是先成就别人、心系他人、善于倾听、善于赋能的高手！一生都在追求一种境界——我能为你做什么？我做的事情对别人有没有用？通过改变自己来为他人做更多的创造者。那句“屁股决定脑袋”的话，个人是不赞同的，把时间和空间都延长扩大我觉得正好相反。一定是你的格局和胸怀决定了你的职位和高度。影响力是别人赋予的，那些承蒙关照过的人们和自己创造的生活赋予的。（野心家们可以成就一時，且受不受人尊敬就另外另论了吧！）\n\
    \n把内部功能化的东西，变成外部服务化的东西，这是一个好的观点，对于我们来说，可以加以借鉴。比如，我们在学编程，我们可以这样做，一方面，自己学，另外一方面，我们可以教别人学，为别人提供服务。只要你的服务足够好，能帮到别人，别人是会愿意付费的。这样一来，就能促进自己，学得越来越好。自己既学好了技能，又赚到了钱，还能积累人脉，非常划算的事。对，就应这样干。在接下来的日子里，不管学什么，都要再给自己加一个维度，把学到的东西，制作成课程，教给别人。\n\
    \n# 亚马逊 | 神圣法则—— “拜客户教”\n\n+   1. 负面评价很重要。记得最初始在亚马逊的时候，总是...\n\n+   1. Amazon在自己的平台上引入第三方卖家，一是让消费者有更多的商品选择，更重要的是让自己身处始终有强劲的对手，避免自我膨胀和懒怠。\n\
    2. Amazon把利润让给消费者，用了商业管理中渗透定价法这个套路，就是以低价进入市场，把价量之... \n3. 至于拜客户教这一点，去过海底捞吃快饭的人应该都有体会了。那叫一个服务到位，顾客至上。除了它家我还看过一本书，叫《三双鞋》写的是Zappos这家专门卖鞋的网站，他们也是以贴心服务为卖点。客人订一双，商家就发三双过去给客人试，试到满意。退回的运费由商家负责，当做广告费支出，不让消费者有心理负担。书里面感人的例子有好多，个个精彩。“得到”里边有这本书的音频版。\n\
    \n# 亚马逊 | 三大支柱业务与 “飞轮效应”\n\n亚马逊的飞轮效应感觉是一个整体，不是哪一块拿出来和对手竞争，而是形成一个互相促进的整体来竞争。Prime会员服务，应该是各个业务整合的连接点。\n\
    \n# 张潇雨\n\n没错。贝佐斯在股东信里面写过：Prime是我们飞轮的“引擎”。\n\n今天的文章让我想到《好战略、坏战略》里的一种好战略，大致是：链条环节（环环相扣）。其实，不仅是亚马逊，为什么其他家具有公司仅凭模仿宜家的会员服务或设计风格，很难超越宜家？为什么沃尔玛起家时选在了当时巨头零售业都不进入的小城镇，还能获得成功？这都是“飞轮效应”的体现。再说到个人，当你理解了“飞轮效应”，你也能更有效地构建自己的个人竞争力。比如：对于咨询行业的从业者，你写案例、提案、演讲能力都不错，若再加点广告公司从业者的创意能力，便可構築自己系统化的竞争力。\n\
    \n# 张潇雨\n\n“系统化的竞争力”这个词我觉得很到位。\n\n所谓飞轮效应，相当于公司各业务模块之间的“网络效应”。网络效应值得是增加的客户为整个业务带来增值；飞轮效应，是指业务内容直接的彼此连结和增值。也就是说我们常说的1+1>2，这种增值可以是规模效应上的，传染力上的，边际成本上的，服务上的。但是，彼此间的合力，带来各业务之间的不断交叉增长和提升，形成巨大的合力。这些合力形成的，是别人很艰一时建造的竞争壁垒。京东、淘宝也有很多和亚马逊相似的模式，但又有不同。京东更注重自身产品销售，淘宝则更注重第三方卖家业务。天猫也在整合各商家，以使提高仓运服务，譬如：天猫的各电器商家，都通过天猫指定的日日顺物流配送，即使你在不同的店买电器，它们都可以一起送来，节约时间和运输成本。我一直是亚马逊的死忠粉，好期待这两周的专栏。"
