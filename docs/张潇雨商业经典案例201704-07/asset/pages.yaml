    +   1. 在迪士尼的收入构成中，我们最熟悉的电影、动画片，也就是影视娱乐部分，只占17%。占比最大的是 “媒体网络” 部分，主要指电视，而其中最大的收入来源是一个以体育内容为主的电视网。


    +   2. 内容生意就是不断网罗好内容。迪士尼CEO鲍勃·伊格尔先后收购了皮克斯、漫威、卢卡斯影业，合作创作了《冰雪奇缘》、《疯狂动物城》等一系列电影，打造了钢铁侠、美国队长、复仇者联盟等一系列IP，不断为迪士尼创造新的辉煌。


    +   3. 一条清晰葳董事会/董事长、CEO和总裁之间是什么关系。谁出钱买了公司股份谁就是公司的主人，他们叫股东。股东选出董事会代表自己的利益，董事会组成董事会，再选出董事长来领导所有董事，董事长有权任命公司CEO。总裁相当于CEO之外的二把手，后来逐渐被首席运营官COO代替了。CEO、总裁做不好都有被罢免的可能。如果一个人集创始人、董事长、CEO于一身，那他就是当之无愧的老大了。


