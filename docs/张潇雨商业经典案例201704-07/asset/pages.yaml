  md: '# 周末互动 | “我们做这件事情，不是因为简单，而是因为它难”


    欢迎来到商业经典案例课。我是张潇雨，又到了周末互动的时间。


    这周我们讲的是PayPal这家公司，不过我们先放一放PayPal，说几句上周讲的Netflix，一会儿我们回过来再说PayPal。


    你应该还记得Netflix吧，这家公司创业的时候做的是DVD邮寄业务，当时就面临着巨头百视通的挑战，起步非常艰难。


    我在一本Netflix的公司传记里看到说，公司在决定做DVD邮寄业务之前，一些核心高管非常犹豫。因为聪明人一下就看得到这个业务里的难点——DVD机还不普及、影片选择太少、邮寄的成本看起来也很高，而且也很很难预测一年会丢失或者损坏多少DVD……


    所以，很长一段时间Netflix的创始人团队都在评估这个业务行不行，到底应不应该做。


    结果，是联合创始人之一的伦道夫，一句话最终打消了大家的顾虑。他说：“你看，这些东西确实很贵。所以你不觉得，一旦我们真的把这些问题都解决掉，就制造出一个别人无法企及的高门槛，让潜在的对手们根本无法和我们竞争么？因为我们要做的事确实是太难了啊。”


    于是因为这句话，Netflix这家公司成立了。后来，他们花了几个月时间筹备——没事就跑邮局优化寄递流程、反复设计邮寄时候装DVD的封套，努力找各种DVD机厂商合作等等。最终，这些努力成就了Netflix早期创业的成功，也让它后来成为市值超过600亿美金的娱乐巨头。


    你知道，这件事让我想起哪句话么？不是某个大企业家说的，而是美国前总统约翰·F·肯尼迪在1962年，对全国人民演讲的时候说的：


    > “我们选择在这个年代登月，不是因为它简单，正是因为它难。”


    也正是这句话，激励了一代美国航天人，最终完成了当时看起来不可思议的登月任务。


    回到这周的PayPal，你会发现情况也是类似的。PayPal给自己设立的宏大目标、面临的来自方方面面的挑战和压力，包括政府的监管，即使在创业公司里面也是非常困难的。但是，经过这一场场硬仗，PayPal的员工都得到了巨大的锻炼。这些经历也为他们后来在硅谷的开枝散叶，打下了完美的基础。


    所以，我在写作这个专栏的时候，慢慢也觉得，有时候选择做更难一些的事，是一种智慧。所以下面我想详细地讲讲，为什么我们应该选择做“难”的事：


    +   1、最难的问题，有时候也是最重要的问题，或者是能影响最多人的问题。谷歌给这样的题总结过三个特点——

    （1）解决的是一个巨大的问题；

    （2）选择一个激进的解决方案；

    （3）使用突破性的技术


    如果你关注过谷歌的一些神秘项目，例如让所有人都能上互联网的热气球项目、无人驾驶汽车，甚至是扛击衰老的神秘项目，遵循的都是这个标准。


    +   2、“最难的”事情有时候反而会“更简单”。因为大多数人都喜欢做50-80分难度的事情，所以你会发现这个区间里挤满了各种各样的竞争。而当你的目标是120分难度的时候，反而会发现没什么人和你竞争，视野一片开阔。


    +   3、当你的目标极其远大的时候，你也能获得最好的帮手。因为最优秀的人一般都愿意解决最重要、最不可思议的问题，而不是那些平庸的东西。你当然也会在这种人身上学到最多的东西。


    +   4、无论多难的问题，解决的第一步都是：把它看成可解决的。哪怕你暂时不知道方法，但持续地用最疯狂的想象力去不断思考就好了。


    +   5、当“做最难的事情”的时候，人思考问题的方式和做一件“逐渐改进型”事情的时候是截然不同的。有时候你会被自己天马行空的想法震惊，而这样的想法看起来不可能，但往往就是解决问题的关键。就像我们说过的，人类最伟大的建筑都是在限制最多的情况下造出来的，道理类似。


    +   6、“做最难的事情”一个优势是：它的价值和影响力会是普通问题的10000倍，但难度可能只有100倍。所以本质上你在性价比上面赚到了。


    +   7、“做最难的事情”一个实用主义的好处就是，哪怕你失败了，可能结局也不会太糟。就像有一句话说的：“瞄准月亮，哪怕失败了，至少可以落到云彩上。”


    +   8、当你想做特别难的事情的时候，你的思考原点就会非常纯粹和专注。因为难的事情非常容易失败，所以一旦你决定做，它的动机一定不是功利的，而大部分是来自于你的真心和理想的。这些东西让你在困难的时候坚持下去。


    +   9、最难的事情，经济的回报自然也就越大，然后你就可以把这些回报投入到“新的最难的事情”里。就像沃尔特·迪斯尼说的：“我们拍电影不是为了赚钱，我们拍电影是为了赚钱拍更多的电影。”


    +   10、最后，最难的事情，当然能提供最大的满足感和成就感。


    所以，我鼓励你、号召你，给自己设立难一点的目标，选择难一点的挑战。当然这个目标不一定是马上就要实现的，但至少你可以从现在开始思考，如果有一天你要去做一件很难的大事，那么那件事情会是什么。


    好了，这就是本Related


