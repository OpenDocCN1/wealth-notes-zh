  md: '# 苹果 | 乔布斯之死

    （9/10）


    苹果|乔布斯之死 (9/10)


    上期我们讲到了可能是苹果公司最伟大的一项发明，iPhone的诞生历程。这也是苹果在业务上达到的一个巅峰。不夸张地说，我们现在生活 niektor很大一部分，都是由这个小小的手机塑造的。


    今天是两周苹果专栏的倒数第二期，我想说一个很大分量的话题，乔布斯之死。这个话题之所以有分量，是因为它不仅是一个天才CEO人生旅程的终结，还体现了苹果公司和乔布斯的精神。


    很多人都知道，乔布斯在56岁的时候因为癌症而死。但你可能未必知道，从医学上来说，乔布斯的病本来是一个治愈率非常高的胰腺疾病，甚至连癌症可能都不算。而且，乔布斯查出这个病的时候只有48岁，还算年轻人，如果治疗得当，康复的可能性很大。


    所以，对于乔布斯之死，一个真正摆在我们眼前的問題是，为什么我们这个时代最聪，最富有洞察力、最有远见的人，会输给这么一个本来并不严重的疾病呢？


    我想稍微等一下再回答这个问题。在说出我的答案之前，我先来讲讲乔布斯得病的故事。


    # 阴影初现


    2003年，苹果正走向巅峰。当时乔布斯成为苹果的正式CEO已经有三年了，其间，他推出了iPod，建立了苹果线下零售店，并且用音乐商店的形式改变了整个音乐产业。


    2003年年底，他去做了一次肾结石手术，手术很顺利，不过他的医生在B超里发现了一个阴影。于是，他敦促乔布斯去做进一步的检查。


    乔布斯一开始不想面对这件事，而且相信你明白，乔布斯很强的一个能力就是，固执己见，不听他人的意见。但后来医生的语气越来越严重，乔布斯不得不重视。结果到了医院一查，发现是胰腺上的肿瘤。


    不知道你是否了解，胰腺癌被称作“癌中之王”，一般病人从发现到去世，就是6至9个月的时间，没得治。当时检查的时候，有医生已经让乔布斯准备后事了。


    但是第二天，进一步的检查结果出来了。乔布斯得的是所有种类的胰腺癌里最罕见的种类之一，而且是可以治愈的一种，只需要配合医生就好了。这个结果一出来，乔布斯就和抢来了一条命没区别。


    # 致命延迟


    对于一般人来说，听到这种消息的第一反应就是非常高兴，然后应该立刻配合医生治疗了吧。但乔布斯就是乔布斯，在后来的9个月里，他完全不遵医嘱，不愿意进行手术，直到2004年7月，CT扫描显示他的肿瘤已经长大并且扩散到肝部了，乔布斯才不情愿地接受了手术。


    这9个月之间发生了什么？可以说，乔布斯做了很多看起来非常荒诞，甚至匪夷所思的事情。比如他尝试严格的素食，摄入大量的胡萝卜汁和果汁，希望以此能击退癌细胞；他还试过一些奇葩的疗法，比如针刺疗法、草药疗法，甚至还请过灵媒——就是有点类似于巫师和术士的人。


    # 一意孤行


    这些行为，对于我们常人来说很难理解。但对于乔布斯自己而言，可能却是非常正常的。现在也许可以来回答我们刚才才提出来的问题了。就是，为什么我们这个时代最聪、最富有洞察力、最有远见的人，会输给这么一个本来并不严重的疾病呢？


    答案其实也不复杂，因为他从来就是这么一个固执己见，坚持认为世界会按照他的方式运转，完全不顾客观事实甚至直抬扭曲现实的人。他在每件事情上都蔑视权威，不关心大众智慧。他总是坚持寻找自己的方法，然后永远乐观地相信他相信的事情总会成功。


    从这一点来说，乔布斯面对癌症的态度，和他面对产品、同事以及管理公司没有任何的区别。他的世界观从来没有变过，并在每一件事上都做到了极致。


    只是，有时候这种固执让他赢得非常漂亮，比如力排众议推出苹果的零售店；比如按照自己的方式改造唱片行业；比如重新定义手机；但还有一些时候，这种固执让他输得也同样惨烈。


    这就是，乔布斯被疾病打败的最重要的原因。有时候我会想，如果拿掉这种固执，乔布斯可能不会在年纪轻轻的56岁就离开人世，而是会陪伴我们到76岁，86岁，甚至96岁。但同时，如果没有这种固执的话，他还会是如此伟大一个产品家和CEO吗？


    所以，硬币总是两面的。那些带你走得越远的东西，到了某些时候，就越会反过来限制你。


    关于乔布斯这种出奇的固执，我还可以讲很多。比如有两个小故事给我印象很深：


    一次是在2009年乔布斯做肝移植的时候，因为当时癌症扩散得比较严重了，需要换肝。有一项医疗程序，在做之前需要乔布斯把胃排空。但是乔布斯拒绝这样做，一直在挣脱，于是医生只能给他打镇定剂。结果在打镇定剂的时候，乔布斯把其中一些镇定剂吸到了肺里，导致了肺炎。由于他那时候已经很虚弱了，差点因为这个肺炎死掉。


    那时候情况严重到，乔布斯的家人已经用两架私人飞机把乔布斯四个孩子都接了过来，因为他们觉得乔布斯撑不过那个晚上了。


    另一个故事令人印象更深。有一次乔布斯在被打了镇定剂之后，医生要往他的脸上戴面罩。结果即使他已经几乎没有任何知觉了，那种强烈的人格还在。医生一递给他戴面罩，他就一连把面罩扯下来，然后嘟囔着说不喜欢这个面罩的设计，还命令医生拿不同的面罩来，他要选出一个最喜欢的。


    乔布斯还很叮嘱医生安在他手指上的监测氧含量的监视器，他说那个东西太难看也太复杂了，而且给出了好多简洁设计的建议……这就是乔布斯在病情最严重的时候，做出来的事情。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_33_0.png)


    # 最后阶段


    从2009年做完肝移植手术，到2011年10月5日，乔布斯进入他人生的最后一个时期。这个时期，乔布斯应该完全践行了他2005年在斯坦福那次著名演讲里说的，把每一天当做生命中的最后一天来活。他把所有时间都奉献给了两件他认为最重要的事情：苹果公司和他的家庭。


    在这个阶段，乔布斯在公司最重要的产品是iPad。这款产品同样大获成功。乔布斯在iPad的发布会上还阐述了他的一个重要理念，那个著名的“科技+人文”理念。当时在最后一张幻灯片里，乔布斯放了一张标有“科技”和“人文”两条街交叉路口的照片，他说：“苹果之所以能够创造出iPad这样的产品，是因为我们一直努力融合科技和人文艺术。”


    另一个他晚期很重要的作品是，苹果总部。这个总部大楼叫Apple Park，苹果园区。造型就像一个大型的飞船一样，非常漂亮。这也是世界上最昂贵的办公区，造价有50亿美元。乔布斯和之前设计NeXT大楼与皮克斯办公大楼一样，亲自操持了很多细节。以ਵ后有机会的话，也许你可以去加州的Apple
    Park亲自感受一下。


    最后，乔布斯把生命的其余剩下的时间，都给了家人。在这个阶段，乔布斯几乎不和任何不需要来往的人来往了，把时间都留给了他的妻子劳伦·鲍威尔·乔布斯，还有他的四个孩子——三个女儿和一个儿子。他甚至还说，“我和上帝做了笔交易——一定要让我赶到大儿子的高中毕业典礼，也就是2010年的時候。”这个信念让乔布斯度过了艰难的2009年。


    可以说，家庭在乔布斯人生的最后几年，给了他巨大的支持和帮助。'
