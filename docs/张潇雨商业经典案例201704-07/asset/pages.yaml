  md: '系，公司内部人的关系。


    研究商业要回到当时决策的时刻，看是哪些要素，构成什么样的关系网影响了什么样的决策。站在现在看过去似乎是明晰的，在当下的世界都是混沌的，学习过去，在当下理出走向未来的密码。


    # 研究商业的原则（二）|避免归因谬误


    今天讲的归因问题，让我想到了我这学期计量经济学的causal effect。好多的自变量只是与因变量相关，而并不代表有紧密的因果关系。


    我们在分析商业史时，也应该了解更多的信息加入更多的变量，而不是高估或低估某个变量带给一家企业的变化。

    这样对每一家企业的分析就会更加准确，作为后人借鉴起来适用性就会更强。


    可能很多企业家并不知道自己是怎样成功的。之前看过一个报道，硅谷有个团队采访了一些独角兽公司的CEO，向他们成功的原因是什么，百分之七十的CEO说说是运气。但是是怎样去拥有好的运气却没有一个明确的方法。那么我想，一个企业的成功除了团队的努力之外运气可能也很重要。


    # 研究商业的原则（三）|不要执着于概念


    共享经济，根据字面意思，就是人们把手头上多余的资源共享出来而产生的一种商业模式，比如Uber、Airbnb等都属于这个范畴。


    # 研究商业的原则（四）|不要站在原地


