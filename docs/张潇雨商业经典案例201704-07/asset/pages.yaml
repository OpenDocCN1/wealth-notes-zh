  md: '一两家最好的公司。


    我印象特别深的是曾经和一个好朋友聊天。他是国内某个著名风险投资基金的合伙人，他说，有一次他们公司举办内部复盘会，大老板放出来一张图，上面是他们投资过的所有公司，以及这些公司给整个基金带来了多少回报。


    结果一看，他们投的几十家公司里，带来回报最大的一家公司，占了全部回报的90%，剩下的公司加起来占了10%。但还没完，老板又放了一张图，是把那家最成功的公司拿掉以后的回报计算，结果发现，在剩下的这些公司里，回报最大的那家公司，还是占整个回报的90%。


    所以，对于风险投资来讲，怕的不是投错了公司亏钱，而是错过了好公司。英文里有个词组叫fear of miss out，缩写是FOMO。意思就是“惧怕错过”。说白了就是，宁肯错投一千，也不能放过一个。因为你放过的那个，很可能就是决定你投资成败的那家公司。


    所以有时候朋友会问我，为什么我看好多基金，都会投资一些看起来特别奇葩的创始人或者是创业项目啊？那些投资者都没脑子吗？


    我一般都这么回答：如果回到2004年，你会想到一个平时只穿拖鞋、大学都没读完的宅男，会做出一家价值4000亿美金的、改变了一整个时代的公司Facebook吗？


    # —— 今日小结 ——


    今天我们讲的是风险投资的行业史，包括两个关键人物，阿瑟·洛克和创办了红杉资本的唐·瓦伦丁，以及投资里的四个关键认知：越早回报越大；投资人或者赛道都可以成立；投资人会提供的除了钱以外的价值；以及投资的“幂法则”。


    明天，我会再来讲一些干货，是关于乔布斯的一个伟大的能力的。欢迎收听。


