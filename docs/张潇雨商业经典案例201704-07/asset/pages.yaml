  md: '# 亚马逊 | 终极野心——万“税”帝国


    亚马逊 | 终极野心——万“... ↓


    今天我们继续解读亚马逊。在之前的专栏里，我们提到过“终局思维”这个概念，今天我们就来真正想象一下，亚马逊的终极野心是什么？


    很多不熟悉亚马逊的人，会把亚马逊归类为电商公司；一些用过亚马逊多元化服务的人，会说它是一家平台公司；还有一些人比较重视技术，认为亚马逊未来会是一家人工智能的公司。


    我认为，这些都把亚马逊的格局想小了。不管是电商、平台，还是人工智能，都只是亚马逊的手段，不是目的。亚马逊的终极野心是：向所有网上的活动“收税”。


    换句话说，只要你使用互联网上的服务，你就要向亚马逊交税。这就是亚马逊的终极格局。


    # 核心业务的关键逻辑


    为了说明这个观点，我们来重新回顾一下亚马逊CEO杰夫·贝佐斯钦点的几块核心业务。


    首先是亚马逊的云服务，AWS。可以回忆一下AWS服务是怎么诞生的：当时亚马逊的内部系统已经支撑不住公司的发展了，技术团队试图找到一个一劳永逸的方式解决内部服务问题，于是开始开发云服务平台AWS的雏形。


    结果做到一半的时候他们意识到，独立开发一套这样的系统非常费时费力，而且不仅亚马逊需要，很多大大小小的公司都用得着。于是他们决定把这个服务外部化、商业化，最终成就了这样一个明星业务。


    现在AWS云服务平台已经是全世界性价比最高的云服务了。不管是通用电气这样的大公司，还是普通的创业小公司，都可以把自己的系统建立在AWS上，而且是随用随取随付费，和家里用电没有什么区别。


    你会发现，在这整套商业逻辑里，有这么几个关键点：


    +   1. AWS云服务平台的前期投入和固定成本很高，比如买服务器，养大量的工程师等等；

    2. AWS云服务平台诞生之初就有一个非常好的大客户，就是亚马逊自己的电商业 务。这个客户使得AWS平台不仅能够深刻地洞察需求，还能不断迭代自己的技术和服务；

    3. AWS云服务非常受益于规模效应。也 就是越多人用，这些前期成本和固定成本摊下来也就越低。所以把AWS开放给外部，开放给全世界，AWS也就能够更 加便宜。也就不难有人和它竞争。


    # 带着这三点思考，我们来看另一个亚马逊的核心业务，也是我们之前提到过的：FBA亚马逊代发货业务。


    FBA（Fulfillment By Amazon）直译成中文是，“完全由亚马逊完成的服务”。本质上，FBA业务能够让依附于亚马逊生态上的商家，将自己的货物寄存在亚马逊的物流中心，从而享受亚马逊遍布全球的仓储和物流服务。甚至没有进驻亚马逊平台的公司都像买电一样使用FBA业务，随用随付费。


    你可能发现了，这整套商业逻辑里，有类似的几个关键点：


    +   1. FBA业务的前期投入和固定成本很高，单靠打造一套仓储和物流服务需要花多少钱，相信你能想象；

    2. FBA业务诞生之初就有一个非常好的大客户，就是亚马逊自己的电商业务。这个客户使得FBA不仅能够深刻地洞察需求，还能不断迭代自己的技术和服务；

    3. FBA服务非常受益于规模效应。也 就是越多的人用，这些固定成本摊下来也就越低。所以把FBA开放给外部也是非常合理的。


    你还记得亚马逊的Marketplace业务么，就是那个第三方卖家可以在亚马逊平台上卖自己商品的业务。这些卖家现在每年的销售额已经达到了亚马逊电商总量的40%，三年以后可能会到50%。Marketplace的商家也大大充实了FBA的客户群，从而让FBA更加便宜。也就不难有人和它竞争。


    这两个业务一相加，就产生了一个我们在讲亚马逊的时候第一时间就强调的概念——飞轮效应。你还记得贝佐斯钦点的三大支柱业务的Prime会员业务么？


    99美金，你就可以享受亚马逊的各种服务。比如免邮费；两日、次日，甚至两小时抵达的快递；各种书、电影、电视剧娱乐内容免费看等等。并且，越多第三方卖家来卖货，用户的选择就越多；越多商家使用FBA代发货服务，亚马逊快递覆盖的商品也越多，Prime会员也越超值。这样，飞轮就转起来了。


    # 收购Whole Foods超市


    接下来，我们再来看前一阵亚马逊做的一件市场上声音很大的事情：收购Whole Foods超市。


    这里可以简单介绍一下Whole Foods超市。这是 一家主要在美国、加拿大和英国运营的，以售卖健康的有機天然食品为主的超市，现在一共有接近500家门店。


    2017年6月的时候，亚马逊以137亿美金的价格全资收购了Whole Foods超市。当时也有很多人分析原因——有说亚马逊想要进军高端食品市场的，有说亚马逊想要拓展自己的生鲜业务的，还有人说亚马逊一直有开线下店的想法，这应该是一种尝试……


    同样，这些分析还是把亚马逊的格局想小了。


    我们来看，Whole Foods超市背后代表的这个生鲜和杂货市场，特点是什么：


    +   1. 由于不像书籍、百货那么标准化，生鲜杂货保质期也短，所以亚马逊在这个市场一直没做得太成功；

    2. 当你有了Prime会员，而且亚马逊给你提供 的选择无穷无尽的时候，慢慢你就会在亚马逊上买一切东西 了。（想想你是 怎么用淘宝的？）这时候，唯一一个让你，一个Prime会员，可能去别的地方买东西的大型品类，就是生鲜杂货类了；

    3. 换个角度说，Whole Foods这样的超市，是为数不多的，会提醒你Prime会员也覆盖不到的品类的地方。这对亚马逊帝国来说，是个战略上的漏洞。


    在这样的情况下，假设现在你是亚马逊的CEO，你打算怎么解决这个问题？


    如果回头看一下我们刚才对AWS云服务平台和FBA代发货业务的分析，你会发现，整条生鲜杂货的产业链，也有两个核心特点：一是，前期投入和固定成本高（比如物流、仓储等等，甚至比百货要复杂得多）；二是，它也非常受益于规模效应，越多的人用，成本也就越低。


    这会儿你应该明白了，亚马逊最缺的其实是一个非常好的大客户——这个客户能够帮助亚马逊重构整条关于生鲜杂货的产业链，并且在过程中还能不断产生收益，最终，开放给全世界使用。不管你是街头小餐馆需要买点葱姜蒜，还是大型餐饮集团，需要成吨的牛肉和番茄酱，亚马逊都能够像AWS平台和FBA业务那样，给你提供又快又好、性价比又高的服务。


