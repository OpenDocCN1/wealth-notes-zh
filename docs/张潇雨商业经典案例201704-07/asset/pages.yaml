  md: "# 亚马逊｜三大支柱业务与“飞轮效应”\n\n你好，欢迎来到张潇雨的商业经典案例课。这周我们要开讲一个非常重要的公司，亚马逊。\n\n亚马逊这家公司的重要性是多维度的：\n\
    \n+   1. 首先，它就像苹果、Facebook、腾讯、阿里巴巴这样的公司一样，在过去二十年实在在地影响了我每个人的生活；\n2. 它二十多年走过的历史非常独特。亚马逊早已不再是你印象中的“网上百货商店”了，而是一个非常多元化、又开放的平台公司；\n\
    3. 亚马逊二十多年的掌门人杰夫·贝佐斯（Jeff Bezos），可以说是当前最伟大的CEO，甚至没有之一。他的商业洞察以及背后的哲学思想，可以和杰克·韦尔奇、乔布斯、巴菲特、马云这样的商业领袖相提并论。\n\
    \n所以接下来的两周时间，我会从各个维度来解读亚马逊这家公司，以及贝佐斯的商业哲学。相信这两周过后，你会对商业世界以及公司到底是一个什么组织，有更深刻的理解。\n\
    \n首先我来讲一讲，现在的亚马逊到底是一个什么样的公司。就好像刚才我提到的，很多 let's  ... \n\n# ｜三大核心业务\n\n2014年亚马逊年度股东信中，贝佐斯开头写了这么一段话：\n\
    \n> “一个梦幻般的业务一般要有四个属性：一是客户非常有需求；二是它能成长到很大的规模；三是资本回报率〕高；四是它能抵抗时间——也就是说能够存续很多年。当你找到这样一种业务的时候，你应该把它紧紧抓住不放。\n\
    \n噢，我很高兴地告诉大家，亚马逊不止有一个这样的业务。经过二十年的努力和冒险，以及好运气之后，我们现在已经有三个毕生追求的业务了：Prime、Marketplace和AWS。”\n\
    \n+   1. Prime 业务——也就是亚马逊的会员服务；\n2. Marketplace 业务——也就是第三方卖家平台；\n3. AWS——也就是亚马逊的云服务。\n\
    \n贝佐斯反复说，这三块业务是亚马逊这个价值超过4000亿美金公司的三大支柱。你会发现很有意思的一点是，他并没有提到亚马逊最大的一块业务，也就是我们最熟知的网上自营卖货的部分。\n\
    \n# ｜可能的隐忧\n\n但是听到这里，你可能隐隐地发现了有点不对。我好像一直在夸奖亚马逊的三大核心业务多好，但它们其实也有一些商业逻辑上的问题，比如：\n\
    \nPrime 会员99美金一年的服务非常好，但是提供的所有服务——包邮、各种娱乐和书籍内容、游戏等等——都不是白来的，而且相反成本都很高。难道不是卖得越多就越亏么？\n\
    \n# ｜飞轮效应\n\n这里面真正的智慧，也是理解亚马逊这家公司各个业务线的关键，就是亚马逊和贝佐斯本人都反复强调过的一个商业理念——飞轮效应（Flywheel\
    \ Effect）。\n\n> “飞轮效应”是指，一个公司的各个业务模块之间，会有机地相互推动，就像咬合的齿轮一样互相带动。一开始从静止到转动需要花比较大的力气，但每一圈的努力都不会白费，一旦转动起来，齿轮就会转得越来越快。这也是亚马逊这家公司真正的秘诀。"
