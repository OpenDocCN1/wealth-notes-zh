  md: '# 研究商业的原则（四）| 不要站在原地


    非本店铺购买，不更新


    今天我们继续来讲研究商业的原则。之前我们说了不要把商业看成物物理学；不要陷入错误的归因；不要执着于概念，要敢于跳出来。今天我们要说的是第四个研究商业的原则：不要站在原地。


    所谓“不要站在原地”，有两个层面的意思。第一个层面是时间维度，不要站在此刻去看历史，用现在的眼光判断过去发生的事情。而是应该努力地回到历史的情境里；第二个层面是空间维度，不要仅仅站在外面去描述一家公司或一名企业家做的事情、下决策。而是要尽可能走入公司内部、企业家的内心，去感受那个时刻他们做的决定。


    只有这样，我们才能更好地研究商业、理解商业。只有在时间和空间中不断观察和转换，才能最接近商业的本质。


    你可以想象一下，如果我们在拍一个精彩的商业传记电影，导演肯 останови  一方面要还原当时真实发生的故事，另一方面也要走进关键人物的内心。其实研究商业和拍电影的道理是异常类似的。


    之前在周末问答的时候我提过一个概念，叫做“动态视角”，说的也是与此类似的道理。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_83_0.png)


    这就是我想说的研究商业的第四个原则，不要站在原地。要动起来，走进那个时代，走进那家公司，走进那些伟大的商业人物的内心。只有这样，你才能在商业里获得真正的洞察，而不仅仅是得出一些简单的结论。'
