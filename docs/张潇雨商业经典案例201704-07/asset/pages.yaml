  md: '# 迪士尼 | 天时地利埃斯纳（2/5）


    迪士尼 | 天时地利埃斯纳（... ↓


    今天我们继续来讲迪士尼。上期内容提到迪士尼目前的营收结构和商业模式，它可能已经不再是我们想象中的那个动画片制作公司，而是一个覆盖全产业链的媒体与娱乐帝国了。


    但是，迪士尼是如何走到今天的，是谁打下的这个基业呢？


    应该说，迪士尼能在过去漫长的三十年时间里逐渐变成现在这样的全产业链赚钱机器，正是印证了我们老祖宗说的那句话：天时、地利、人和。


    之所以强调这点，是因为贯穿商业史，甚至人类历史你会发现，对于一个已经有着优秀传统、辉煌时期、建立基业的国家、社会、组织或者公司来说，想要进行大刀阔斧的改革是非常不容易的。对于迪士尼来说，如果没有“天时、地利、人和”，同样困难。


    从1984到2004年，迪士尼可以说实现了业务的腾飞。它从一家年收入16亿美金的公司，变成了一家年收入308亿美金的公司，收入增长19倍之多；利润也从1亿美金变成了45亿美金，涨了45倍。但在这段辉煌之前，迪士尼已经陷
    departments 了接近二十年的低谷，甚至在1984年时，还差点被一个金融大鳄恶意收购，经历非常惨痛。


    作为一家当时已经成立五十多年，创造过非常多辉煌的公司，想要变革是非常困难的。因为这其中有太多的阻碍和包袱，并且大众早已对迪士尼有了固定的品牌认知，要改变这些都需要很大的勇气。


    好在迪士尼在那个时期正好赶上了天时、地利与人和的配合。天时，是指当时的娱乐业和好莱坞，正好来到一个高速发展的黄金时代的前夕，本身就在经历变革。这给迪士尼的改变创造了条件；地利，是指当时的迪士尼正处于低谷，反而施展的空间很大，因为那时，活下去才是最重要的；人和，则指主导这一切改革的人正好是当时最正确的人选，他就是迪士尼从1984至2004年间，在任时间长达20年的CEO迈克尔·埃斯纳。正是这个埃斯纳，奠定了迪士尼现在整个产业链和利润链条的基础。


    接下来，我就从天时、地利、人和三个方面，来讲讲那段时间迪士尼的变革。


    # 天时


    20世纪70年代中后期，家用录像机面世。很多家庭开始用家用录像机来刻录电视台播放的经典电影。这对于当时电影公司渠道策略的冲击是异常巨大的。


    从某种程度上来说，家用录像机的发明很像当今的互联网，由于大家有了新的观看娱乐内容的渠道，倒逼电影制作公司开始针对这个渠道进行产品的制作和发行。所以，那时候好莱坞的很多电影制片公司，都开始陆续发行一些电影录像带，提供给租赁市场。


    这非常像现在诸如Netflix、HBO，甚至亚马逊影视，都开始制作只在网络上，或者主要在网络上播放的电视剧，比如你可能看过的《纸牌屋》、《硅谷》、《高堡奇人》等
    等。这就是一个典型的，新技术带来渠道变革，渠道变革又带来了内容生产方式变革的一个例子。正如我专栏中反复提到的，商业史总是自我重复，螺旋发展。


    这就是所谓的“天时”。那这种时代的变迁，对迪士尼有什么样的影响呢？别急我们继续往下说。下面讲讲“地利”。


    # 地利


    1984年，迪士尼找来了新的CEO迈克尔·埃斯纳。埃斯纳当时获得的最大的“地利”，其实就是，由于沃尔特·迪士尼去世，公司一下陷入了群龙无首的阶段，迪士尼逐渐陷入了最低谷。在生死存亡的时刻，反而不管是股东、董事会还是管理层，都会甩掉各个偶像包袱，一切都为了生存，一切都为了利润。


    所以，埃斯纳任职的时候，签的合同都是和利润紧密挂钩的——当时除了基本年薪和期权以外，迪士尼年利润超过一亿美金的部分，要分2%作为奖金给埃斯纳。


    有了这种环境上的便利，埃斯纳的改革就开始了。他上来就施展了三板斧：


    首先，他提高了迪士尼乐园的门票价格。那时候迪士尼乐园全世界只有一个，所以不用担心提价后就没人来了。沃尔特·迪士尼在建立迪士尼乐园的时候，是想把它打造成为一个美好的乌托邦，也希望能让更多的家庭和孩子来玩。但是埃斯纳可不管这么多，他的眼里只有生存和利润；


    第二步，是拼命扩张。埃斯纳首先为主在巴黎开建一个新的迪士尼乐园；其次，他主张为主题公园增加各种配套设施，比如酒店、餐厅、迪士尼专卖店等等。也就是说，现在迪士尼乐园常见的那些配套设施，都是那时候开始建立的。只有这样，才能让游客更多地在迪士尼里面消费。在他的领导下，公司拥有的酒店房间从2500个迅速增加到32000个，利润也大大提高了；


    最后，还记得我们刚才提到的“天时”吧。也就是当时好莱坞的电影公司逐渐开始销售家庭录像带。其实本来迪士尼也有这个业务，但并没有力推，因为他们怕迪士尼的经典形象如果过多地出现在家庭里，可能会伤害迪士尼的品牌。但公司在低谷中，当然就顾不上那么多了，何况埃斯纳对迪士尼品牌本身也没有那么多顾虑，他的核心指标就是利润。


    于是，迪士尼把电影录像带从80美金一盘大幅降价到30美金，并且投入巨资宣传。他们主推的第一部录像带《木偶奇遇记》，一下就卖出了170万盘，直接收入就是5000万美金。当时迪士尼全年利润不过一亿美金。


    《木偶奇遇记》之后是《睡美人》。当时埃斯纳的团队算了一笔账，之前我们也提到过，迪士尼的电影平均每七年要重映一轮，因为总会有新的孩子出生和长大。如果《睡美人》在未来20年里重映3至4次，按照估算20年的总收入不过1亿美金出头。但如果现在就做成录像带，他们预计能卖300万盘，按照每盘30美金计算，这一年直接收入就按'
  merge: -1
  img_proc: true
- pgno: 53
  md: '近1亿美金。


    利润如此丰厚，还有什么可等的呢？于是，埃斯纳的团队再次加大了广告预算，力推《睡美人》的电影录像带。最后真的卖出了300万盘。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_53_0.png)


    在这三板斧之后，仅仅四年时间，迪士尼的收入就翻了三倍，股价翻了四倍。由于经营成功，埃斯纳本人一年的收入也超过了4000万美金，成为了美国收入最高的企业管理者之一。


    环境的宽松带来的“地利”，让埃斯纳得以施展以前管理层不敢采取的一些追逐短期利益的措施，而这些措施也一举将迪士尼从颓势中带了出来。虽然这个时间段他也做过一些错误决策，但是改革总有风险，埃斯纳早期的工作可以说顺不掩瑜，甚至非常成功。


    # 人和


    最后的“人和”，我们可以多说说迈克尔·埃斯纳这个人。虽然埃斯纳业绩出色，但他从来不是一个有魅力、受到大家拥戴的人。相反，他在迪士尼一个著名的绰号叫做：暴君。


    # —— 今日小结 ——


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_53_1.png)


    今天我们讲的是迈克尔·埃斯纳如何在他20年的任期里，奠定了如今迪士尼的商业逻辑和行业地位。


    张潇雨


