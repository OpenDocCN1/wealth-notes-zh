  md: '# 亚马逊 | 贝佐斯真正的核心哲学——反熵


    亚马逊 | 贝佐斯真正的核心...


    今天我们终于来到了亚马逊的最后一讲。两周以来对于亚马逊的拆解和分析，不知道你的感受如何。从我的角度来说，希望能给你一个由浅到深、由外到内、不断深入到商业本质和世界运行规律的思考过程。


    有时候我觉得这个专栏一个很大的乐趣在于，可以让我们的思维一起飞行。所以这段飞行的结尾，我们就试着着陆在整个亚马逊帝国的最底层，来讲一讲亚马逊的核心管理思想：反熵。


    我在研究亚马逊的时候，在1998年亚马逊致股东信里发现了这个词。它可能被很多人忽略了，因为这句话并不显眼，贝佐斯只是在第二页中间的一段中提了一下，他说：我们要反抗熵。英文原文是
    We want to fight entropy。这个 “entropy” 就是我们这里说的 “熵”。


    回看的时候我发现，“反熵”（anti-entropy）这个理念，正是贯穿亚马逊二十年多年的管理的核心思想。这时候，我有了一种恍然大悟的幸福感。所以今天，我们就来讲讲这个非常重要的管理思想：反熵（anti-entropy）。


    # “熵”的定义


    这个词最早来源于物理学的热力学第二定律。在物理学中，“熵”指的是一个系统混乱的程度，或者说是无序程度的度量——越无序，熵的值就越大；越有序，熵的值就越小。


    而热力学第二定律说：在一个封闭的系统内，事物总是从有序趋向于无序，所以熵的值一定是增加的。这就是“熵增定律”。


    我们来举个例子。想象有一片沙滩，沙滩上还吹着风。你可以把“沙滩+风”看成一个封闭系统。假设你突然看到，在沙滩上有一个沙子堆的小城堡，你肯定知道，这一定是某个人主动堆出来的一个形状，而不可能是风将沙子吹起来，然后精确地吹出了一个城堡的样子。因为从沙子变成沙子做的城堡，就是一个从无序到有序的过程，在封闭系统里这是不可能发生的。


    那么要发生怎么办呢？这个封闭系统一定要和外界有能量的交换，比如来了一个人，跳进来堆了这个城堡，其实就是他对这个本来封闭的系统输入了一些能量，这个城堡才有可能存在。


    反过来説，从有序到无序则可以非常简单。比如这个“沙滩+风”的封闭系统，本来有一沙子做的城堡，它肯定会因为风的作用，最终消散，变成沙滩的一部分，也就是从有序变到了无序。这个过程，就是大自然中一个很自然的过程。


    所以热力学第二定律的推论就是，假设我们存在的这个宇宙之外什么都没有，也就是如果没有人向这个宇宙输入能量的話，那么我们宇宙的最终结局就是走向彻底的无序，也就是走向死亡。


    不知道听到这儿，你有没有发现，一个公司就很像这样的系统。因此，熵的增加对于一个企业来说，是非常可怕的。所以，在企业管理中，就出现了一个非常重要的管理思想“反熵”。


    # 公司管理中的“反熵”


    第一次把“熵”这个概念引入企业管理领域的，是管理学的大师彼得·德鲁克。他说：管理要做的只有一件事，就是如何对抗熵增。在这个过程中，企业的生命力才会增加，而不是默默走向死亡。


    后来哈佛商学院的著名教授迈克尔·波特——就是那个发明“波特五力”模型的波特——说：在生物有机体中，生命能量的消耗是为了维护一种精巧的秩序。一个企业这样的组织，是由人这样的网络构成的，它具有绝对的、可能陷入更大混乱状态的倾向。


    所以，如果你不对这个组织采取任何措施，它就必然会慢慢走向混乱状态。那为了避免混乱，这个采取措施的过程，就是管理的过程。


    我们再回到实践中来看，其实一个企业熵增的过程，也就是逐渐进入复杂、混乱，需要管理这样一个必然的状态，是符合我们对一家公司成长历程的认知。具體來說：


    创业阶段，所有人齐心协力，从混乱和混乱中杀出一条生路，这是一个从无序到有序的过程；


    成长阶段，公司不断成熟和发展，抓住更多机遇做强做大。这是一个从初步有序到更加有序的过程；


    成熟阶段的时候，可能一些问题就要出来了。比如部门之间开始各自为战，争取引利；企业变大之后开始官僚主义，企业效率低下；整个组织结构也越来越臃肿，创新能力下降等等等等。这个过程，就是一个从有序回到无序的过程。


    我们之前讲过很多成功的大公司，不论是苹果、特斯拉、迪士尼，还是耐克，你应该有印象，它们都曾经有很长一段的低谷期，甚至离灭亡只差一步。但在关键时刻，它们都力挽狂澜，改变了企业的命运。这也告诉我们，某种程度上来说，熵增像一种阻碍、一种宿命，可能是无法逃脱的。我们只能尽可能地增加自己的生命力、延续自己的生存机会，但是下一次还会有乔布斯或者迈克尔·埃斯纳来拯救全局吗？可能谁也不知道。


    听到这儿你可能想，那有没有对抗熵增，也就是“反熵”的方法吗？难道我们要坐以待毙吗？我们来看看亚马逊是怎么做的：


    你应该还记得之前专栏中我们讲过亚马逊有两个非常看重的理念，一个是“自由现金流”，一个是“可选择权”。你会发现，这两个理念对应的概念都是“流动”。而“流动”几乎就是反抗熵增的关键。


    不知道你是不是还记得，我们在专栏开篇讲“熵”的概念的时候，有一个重要的前提条件，就是熵增是发生在封闭系统之内的。所以，避免熵增的有效方法就是，建立一个能和外界不断进行能量和物资交换的、流动的开放系统。这个开放系统的学名叫“耗散结构”，是一个叫普利高津的科学家提出的，他也因为提出这个理论获得了1977年的诺贝尔化学奖。


    我们进一步解释一下，流动的开放系统之所以能避免“熵增”，是因為在与外界的交换中，会使得整个系统产生耗散，同时产生负熵。这样，在抵消的过程中，系统就能从原来趋向无序状态的趋势转变为有序状态。


    华为的总裁任正非曾经对耗散结构有过很经典的一个比喻——这里可以插一句，吴伯凡老师在他的专著《伯凡·日知识》里曾经説过，任正非和华为的整套管理思想，都是建立在“熵”这个概念上的。不得不說，东西方在这个问题上有一種大道至简的相似。


    任正非是这么说的：


    一个人每天去锻炼身体跑步，就是一个耗散结构。因为你身体的能量如果储得多，就要把它耗散掉。在耗散的过程中，这些能量就变成了肌肉，变成了更强大的血液循环。当能量消耗掉了之后，糖尿病就不会有了，肥胖也不会有了，身体也苗条了，漂亮了，这就是最简单的耗散结构。


    在这里面，有两个最关键的条件：


    +   1. 这个系统必须不断地远离平衡，不能静止，不能沉寂；

    2. 这个系统必须是开放系统。孤立、封闭的系统，是无法产生熵减的。


    最终，我把它概括成两个关键词：流动和开放。


    # 亚马逊对抗“熵增”的战略


    这样，再回来看亚马逊对抗企业“熵增”的两大战略：重视“自由现金流”和“可选择权”，你会发现，有了不一样的认识。


    在讲自由现金流的时候，我们说，亚马逊的CEO贝佐斯不在意囤积公司利润，更在意“自由现金流”，就是要不断地让钱流动起来；在讲“可选择权”的时候，我们提到了贝佐斯不断试新的领域，甚至是看起来和公司主营业务相竞争的领域，比如最终成为AWS云服务、FBA物流体...'
