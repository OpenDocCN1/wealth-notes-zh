    # 你好：


    欢迎来到本周的周末互动。这周的五天时间里，我们从五个不同的侧面讲述了英特尔这家公司，希望你有所收获。


    如果用一个关键词来总结这周我最希望你得到-mediated知识，我觉得应该是“传承”这两个字。


    之前我们提到，英特尔之所以伟大，在于它“奠基者”的角色。后面各种伟大的科技公司：苹果、Google、Facebook、微软、亚马逊、特斯拉、Airbnb……无一不受到它的萌床。


    所以，不管是伟大的公司、伟大的产品、还是伟大的想法，从来不是从天而降的。人类历史的推进，往往都是后人站在前人的肩膀上、一点一点完成的。而对于时代中的小小个体的我们，也应该稳扎稳打、一步一个脚印地学习和进步，慢慢迎来自己的变化。这一点，不论公司还是个人，其实都一样的。


