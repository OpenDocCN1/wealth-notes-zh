  md: '# 迪士尼 | 被 “成年人监管” 的 CEO（4/5）


    今天我们继续来讲迪士尼。之前我们提到过一个关键人物，在迪士尼任职20年的CEO迈克尔·埃斯纳。


    他虽然在任时功绩显赫，但最终还是因为性格问题被辞了职位。2004年，以罗伊·迪士尼（也就是创始人沃尔特·迪士尼的侄子）为首的董事会，联合了43%的股东，在年度股东大会上罢免了埃斯纳的职务。


    如果你还记得我们之前讲到苹果的时候，乔布斯在1984年同样被赶出了公司。如果你再去看看商业史和公司史，会发现CEO或者公司关键的创始人被罢免或者撤职，好像是一件经常发生的事。


    这背后有一个更深层次的问题，就是现代商业社会里的一家公司，到底谁是所有者？董事会或者董事长，和CEO、总裁等的关系到底是什么？今天我们就借这个机会来讲讲这个硬知识。


    # 股东、董事会与CEO


    本质上，现代公司治理结构下的一家企业，最终应该是属于股东的，也就是说，谁出钱买了公司的股份，谁就是这个公司的主人。


    不过股东的数量可以非常多，所以他们需要找一些人来代表自己的利益，行使权力。于是股东就会选举或者指派出了董事，这些董事在一起就形成了董事会。


    而所谓的董事长（Chairman），就是董事会设置来领导大家的职位。因此，董事长可以说是股东利益的最高代表，行使着很多权力，比如：召集董事会开董事会，召集临时或者非常规的股东大会等等。另外，董事长还有一个重要权力，就是代表董事会任命公司的CEO。


    所以本质上，CEO是向董事会汇报的一个高级打工者，同时也是在向股东负责，因为董事会代表了股东的利益。另外，有的公司还会设置一个“总裁”的职位，相当于CEO之外的二把手，负责公司具体运营层面的事。后来总裁也渐渐被如今所说的首席运营官COO代替。


    因此，如果公司CEO表现很差或者无所作为的时候，董事长和董事会就有权罢免CEO的职务。像微软公司的比尔·盖茨，还有长江实业的李嘉诚，都早就是各自集团的Chairman，也就是董事长了，而单独聘请一个CEO来为公司和集团工作。


    # 旱涝保收的高管


    不过在现实中，虽然公司高管会受到各种限制，但是他们往往在经济上能够旱涝保收。比如雅虎之前的CEO玛丽莎·梅耶，在任期间可以说业绩平平，但最后离职的时候还是拿到了2400万美元的赔偿金，不得不让人有点感叹。


    另外一个典型的例子应该是2008年金融风暴的时候，很多金融机构连选垮掉，但是在很多员工丢掉饭碗的时候，那些公司高管却可以拿着高额离职补偿金离开，这在当时也引起了很大争议。包括我自己也觉得这非常不合理。


    我们先抛开情感上的判断，来分析一下为什么会有这种<|start|>情况。


    如果你稍微懂一点经济学的常识，就应该知道，商品的价格很多时候是由供需决定的。而好的CEO和高管，非常稀缺。比起天价的离职补偿，如果你不舍得花钱来找好的高管，可能公司和股东的损失更大。


    这可以给我们一个启示，就是财务回报有时候并不完全和你的工作表现挂钩，而是和你能提供技能的稀缺性挂钩。这就是为什么那些CEO、企业高管们，即使表现不好也能有很高的财务回报，因为他们有谈判的资本。


    # 独裁的创始人


    讲到这里，你应该对股东、董事会、CEO和公司高管之间的制约关系比较清楚了。可以说这种相互制约，也使得公司的治理能够比较均衡地发展下去。


    当然，我们也会看到一些极端情况，比如公司的董事长和CEO是同一个人。这个人可以说是大权独揽，完全自己说了算。


    这个世纪以来最著名的例子就是Facebook的CEO马克·扎克伯格，他就是集董事长、CEO、联合创始人于一身的，Facebook当之无愧的老大。


    为什么他能做到这样呢？除了扎克伯格确实实力强，带领公司成长很快以外，背后还有一个小故事。


    硅谷很长一段时间以来，都有一个文化，就是不太信任年轻的创始人。所以硅谷的风险投资机构（VC）很长时间都有一个传统——不让年轻的创始人做CEO。


    他们倾向于投资一家公司以后，找来一位比较成熟、有经验，或者说年纪大的人，来当CEO管理公司。我们之前讲苹果的时候提到，乔布斯在早期大部分时间里都不是公司CEO。就是这一文化的体现。


    硅谷甚至有一个专有名词来形容这种现象，叫 “adult supervision”，翻译过来就是 “成年人监管”。意思是，像小孩未成年时没有完全的民事行为能力一样，需要父母的照顾。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_56_0.png)


    这种做法有很成功的案例，也有非常失败的案例。最著名的成功案例是Google的两位创始人佩奇和布林，在红杉资本本杰的建议下，聘请了比他俩大二十岁左右的埃里克·施密特作为CEO。施密特当了长达十年的谷歌CEO，可以说谷歌帝国的创立和他有着密不可分的关系。之后再讲到Google的时候也会提到这段历史。


    而失败的案例则数不胜数。其中一个失败案例，大大影响了扎克伯格，让他从创立Facebook以来就一直非常重视把公司的绝对权力抓在自己手上。这里面的故事还被拍成了《社交网络》这部电影。


    扎克伯格创立Facebook的时候，有一位著名的创业导师肖恩·帕克（Sean Parker），他为早期的Facebook做了非常多的贡献。比如当时扎克伯格不知道Facebook前景怎么样，想回哈佛继续读书，不辍学了。帕克就对他说，Facebook的潜力非常大，让他一定要坚持，不要回去上学。


    帕克本人也是一个绝对的少年黑客天才，他在十七八岁的时候就开发过一个叫Napster的音乐分享应用，做到了几千万用户，因为版权问题还惊动了美国FBI和中央情报局。后来他把Napster关闭之后又创立了一个和通讯录相关的公司，这家公司也迅速做到了两千万用户，并且获得了顶级风投机构的投资，红杉资本就是其中的一家。


    但是帕克生性比较自由散漫，红杉越来越看不惯他。后来，红杉资本就通过各种运作，把帕克赶出了自己创立的公司，并且一点股份也没有留给他。自此，肖恩·帕克就特别痛恨红杉。


    后来红杉对扎克伯格的公司很感兴趣，而帕克那时正好是扎克伯格的战友和导师。于是他告诉扎克伯格千万不要拿红杉的钱，否则就会重蹈自己的覆辙。


    帕克让扎克伯格不但不要红杉的钱，还要羞辱红杉。他设计了一个恶作剧：首先，在和红杉开会的时候扎克伯格要故意迟到；第二，扎克伯格要穿睡衣过去；第三，他还要讲一个PPT，叫做“你不应该投资我的十大理由”。后来年少轻狂的扎克伯格真的这么干了，红杉当然也没有投到Facebook这家公司。


