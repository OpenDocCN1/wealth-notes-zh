    你好，这里是《商业史精读》的专栏。又到了周末互动和你聊天的时 间。这周我们讲了一个系列专题：如何看待商业和商业史。这周的内容比较硬和烧脑，我周末就说点轻松的。


    有很多同学留言说，这周我们讲了混沌系统、归因谬误，讲了概念一直在变化，那我们到底应该怎样面对商业、面对自己的生活呢？其实道理也很简单，就是：做好自己的事，等随机事件来。


    在听完了这几周的公司历史，你会发现很多大公司的成功，就是一连串随机事件的作用。很多时候一个小小因素的改变，可能就会导致结局非常不同。


    迪士尼对皮克斯的收购是这样，耐克签下乔丹意外大获成功是这样，往后的故事中你还会看到，很多如今如雷贯耳的大公司，在自己遭遇非  常的时候，甚至差点卖给了自己最直接的竞争对手。比如苹果就差点卖给了IBM、漫威差点把自己卖给DC（就是出品超人、蝙蝠侠、神奇女侠的公司）、Netflix（就是现在如日中天的、出品了《纸牌屋》的公司）也差点把自己卖给了百视通——曾经最大的电影录像带租赁公司。


