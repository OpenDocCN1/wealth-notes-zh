  md: '# 研究商业的原则（三）

    | 不要执着于概念


    今天要讲研究商业的第三个原则，不要执着于概念。


    在本合同的第一篇内容中，我们讲了不要把商业当成物理学来研究，也就是不要以为有什么恒定不变、百试百灵的商业规律；第二篇，我们讲了在研究商业时最重要的就是归因能力，一定不要陷入典型的几个归因误区。今天，我们就来讲讲，在研究商业的时候，要敢于跳出概念。


    什么是跳出概念？我先来举个例子。在讲迪士尼的时候，我提到迪士尼和苹果共有的一个产品哲学，叫“高度控制”。这两家公司在各自产品上都有一种理念，就是由它来掌控每一个产品的细节，并且营造一个封闭的环境。就像迪士尼乐园的园区和iPhone的系统，消费者和开发者是不能参与的，为的就是保持整套系统体验的完整性。


    有位用户留言说，“高度控制”的产品哲学，也就是“只有我来高度控制一切，人们才能享受最佳的体验”，使我想到了MUJI（无印良品）公司的管理。号称一款新品研发成功后，不出一周就能投放全世界各地的专卖店。他们还有一本内部“大典”，对服务人员从客户跨入店门第一步开始，如何说话，如何推荐，甚至手势动作都做了详细规定。“大典”内容月月更新，更新来源于各专卖店的一线员工。这是不是也是一种“高度控制”呢？


    我看完这个留言的第一反应是，这种举一反三的学习方式是特别好的。从迪士尼和苹果的产品哲学出发，这位用户延伸到了无印良品公司的店面管理风格。Yes


    不过，我当时并没有马上回复这条留言。不是我没看到，实际上我每天都能在大家的评论里学到很多东西，这个专栏很大的特点之一是评论也很好看。我没有立即回复的原因是：


    首先，一开始我对“高度控制”的理解，更多的是强调“系统的封闭性”。无论是迪士尼乐园、苹果系统，还是当时延伸到的VR环境，都是进去之后就“与世隔绝”了。我说的这种“高度控制”，有一种把你与外界隔离开来的感觉。当然，隔离的目的不是因禁你，而是给你更好的产品体验，也就是苹果和迪士尼的产品哲学和信仰。所以，从这个角度来说，无印良品的店铺管理哲学并不是我说的“高度控制”。


    其次，我没有立刻否定这个读者的想法，因为就像我们之前说的，商业里的概念并不是一个严格的物理学定义，这些概念的定义可以是流动的。之前的周末问答中，我们也说过这个道理，当时我举的是诺贝尔文学奖的例子。一百多年来，随着各种大师的不同类型的作品被诺贝尔文学奖认可，文学这个词的含义本身也在被充实和变革。


    那么放到这里也是一样，这位用户好像给“高度控制”这个词注入了一些新的含义，从我说“系统的封闭性”，来到了“通过无限拆分服务的环节，把控制整个服务和用户对接的界面”，我觉得也是一个非常好的角度。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_80_0.png)


    所以，本质上看，在这里，“高度控制”这个概念具体是什么定义已经不重要了，而能够回到对这几家公司本身的观察才特别重要。至于怎么去归纳、用什么词来归纳，其实只是方便我们来记忆和理解，并不影响事实本身的样子。


    我们在研究商业的时候，要敢于跳出概念，回到事情的本质中去，这就是我在 poist


    接下来，我再来举一个例子，来说明如果我们太执着于概念本身会出现一些问题。相信听完之后，你会更加理解我们要说的内容。


    你应该记得，小米公司在前几年非常火的时候，提出过一个口号，“专注、极致、口碑、快”。我非常喜欢这个口号，当时也有很多分析师拿这七个字做了很多文章。但你可能也发现了，这两年小米发展遇到了一
    些问题，整个企业速度也慢下来，再也没有什么人提这七字口号了。但是，难道因为小米发展慢了，我们做事就应该“不专注、不极致、不要口碑、不快”了么？显然也是不对的。


    +   小米这件事情本身给我们三个很重要的启发：


    一是我们应该意识到，任何概念都是高度抽象和模糊的。就像我说 “高度控制”，或者雷军说的“专注”和“极致”，其实都是对复杂现实状况的一种高度概括。而一旦我们对客观世界做出了这种概括，就会损失很多信息。


    比如，做企业“专注”很重要，但是什么什么时候该专注，多专注叫专注，专注多久合适呢？譬如，小米还做很多投资，打造小米生态链企业，这种行为是否不专注呢？同样，“极致”也有这个问题。多极致叫极致，在什么方面极致，为了极致不计成本是否可行呢？在一句口号，或者一组概念里，为了表达简练，这些问题都不得不被忽略了。


    当然这种概念和口号也有它的作用，比如能让我们快速理解和记住一个东西，人与人之间交流也非常方便，但概念本身是必然有它局限性所在的。这就是我想说的第一个方面。


    二是，由于概念往往是高度抽象的，在理解概念的时候，我们容易进入一个经典的思维误区，也是美国投资家，沃伦·巴菲特的黄金搭档查理·芒格经常说的一个概念，“证实性偏见”（confirmation
    bias）。


    说的是，当我们脑中有一个概念之后，会不自觉地寻找支持这个概念的证据。比如当你知道了“专注、极致、口碑、快”之后，可能看很多公司时就都想套入这些概念。看到老干妈，就想，老干妈非常专注，这么多年只做辣酱，而且做到极致；看到顺丰，就想，它口碑很好、服务非常快速，所以能爆火。


    这些说法虽然没错，但是它把一个公司的成功大大简化了。因为没有公司是因为口碑著称成功的，也没有因为产品特别难用，服务不到位而成功的。所以如果我说顺丰因为口碑好和服务快速而成功，等于是什么都没说。而当我们在脑子里有不完整的概念，又找一些事实来反复印证这个概念时，最后就会陷入对真正深入思考的停滞了。


    我要说的第三点是，一旦陷入对概念的执着中，往往会   有一种掌握了武功秘籍的感觉。好像能做到某些口号和概念，就一定能达到某种成功了。但其实，现实总是更加复杂。正如我们之前说的，商业没有必胜的法则，有时候赢家自己给自己的归因都不一定准确。


    这也是商业的魅力所在，因为它不是恒久不变，而一直是变化发展的。所以我们每个人都有机会获得属于自己的成功，或者至少通过观察和研究获得很多新的知识。


    # —— 今日小结 ——


    说到这儿，我们可以整体总结一下：


    由于商业概念是高度抽象的，所以在抽象中，我们会损失很多信息；而如果我们在使用概念的过程中，不断希 望能寻找证据来支持这些概念，就容易陷入“证实性偏见”；而一旦陷入“证实性偏见”，其实我们离深入思考，以及真正的成功就越来越远了。


    这也是我这篇专栏最想传递的一点，就是要敢于破除概念，回到事情的本质。今天我们讲了研究商业的第三个原则：不要执着于概念。明天我就来讲讲研究商业最后 一个“不要”做的事。


