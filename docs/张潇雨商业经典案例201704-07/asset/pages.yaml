    先说点儿外话吧。前几天我在翻看自己之前的笔记的时候，偶然发现我提到过一篇  文章。文章的作者是Paul Buchheit。


    这个人在公众层面并上并不是太有名，但其 实是硅谷一位大神级的人物。他是一个产 品家，做过最著名的产品是Gmail。离开 谷歌后成为了一名风险投资人，在硅谷最著
    名的创业孵化器Y Combinator当合伙人 和产品顾问。


    关于创业公司他说过一句非常有名的话， 这句话现在已经成了创业者做产品的“圣 经”了。我在之前的直播里也提到过，就 是“作为一个初创的产品，有100个非常 爱你的用户，要远比好过有10000个觉得
    你还不错的用户。”


    这句话我暂 时不展开讲，之后专栏的内容 里可能还会遇到，到时候再细说。


    这  只是文章链接： http://paulbuchheit.blogspot.jp/2010/02/if-your-product-is-great-it-doesnt-need.html?m=1&from=groupmessage&isappinstalled=0


    这里我只想说一下它的标题，因为这个标 题已经有足够的信息量了，叫 If Your Product Is Great, It Doesn’t Need To
    Be Good。翻译过来大概是：如果你的产品非常伟大，那它就不用做得很好。


    听起来是不是有点拗口。不过想想我们之前专栏说iPhone的时候讲到的一句 话，“如果你的优点足够突出，用户其实 是愿意忽略你很多不完美的地方的。”


    这 两句连起来，再努力感受一下。


    好了，言归正传。之前我们讲英特尔的时 候，总结的一个关键词叫“莫基”，也就 是讲它的开创性。如果把这两周的苹果做 一个简单的关键词总结，或者说我最想传 达的东西，应该是四个字:复杂人性。


    # —— 精选评论与回答 ——


    # 苹果｜王者归来 (6/10)


    思考题: 在你的印象里，有哪些公司因为专注或不专注的企业战略，获得了很大的成功或者失败呢？有哪些故事使你印象特别深刻？


    摩根士丹利的创始人老摩根有一次和亨利·福特喝下午茶时对他说，他是自己见过的全世界最有商业奇才的人，并邀请福特到华尔街发展。说他可以做很多事，不单是开汽车公司，还可以开饮料公司、办银行，甚至可以成为全世界最伟大的建筑商，还可以去竞选总统。


    亨利·福特却说，这些也许都是真的，但他只对汽车发动机感兴趣，也不会有人比他更了解汽车了，别的<|start|>事就让别人去做吧，他做这一件事就可以了。


    这种专注于一件事情的精神成为了福特汽车的一个基因，直至今天为止，福特公司仍然在汽车行业中，坚持要做全世界最好的汽车公司。


    当今的商业社会，各种因素变化的节奏比以前快了好多，增长率不断在增加，像一个加速度在不断增长的火箭，这就是为什么人类在过去100年里所创造的财富比人类自史以来所创造的总和还要多得多。


    专注固然是企业的必备基因（也是最重要的基因），但懂得坚持，又知道何时应该求变，这才是最难得的。'
