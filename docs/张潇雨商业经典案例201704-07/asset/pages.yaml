  md: '# 苹果｜乔布斯的魔力演讲（5/10）


    今天是讲苹果第一周的小结尾，照例，我们来说一点稍微轻松些的话题。之前几期，我们讲了苹果的诞生、乔布斯的出局，还讲了他的性格、他的回归。


    其中在讲到1984年发布麦金塔电脑的时候，我说，那次发布会可以重新定义了后面所有科技产品发布会的标准。相信你肯定也同意，乔布斯除了是一个产品大师之外，还是一个天才的营销大师与演说家。


    今天，我就来聊聊乔布斯的演讲，看看我们在乔布斯的演讲里，可以学到哪些东西。


    # 乔布斯的五个演讲技巧


    如果把乔布斯所有的公众演讲拿出来看，可以说有非常多值得学习的地方。其中我觉得有五个技巧是特别重要，同时也是你可能一听就懂、一学就会的。它们分别是：


    +   1）传达一个核心信息

    2）建立听众的共鸣

    3）把数字形象化

    1）提供口头路线图

    5）赋予更宏大的意义


    # 传达一个核心信息


    我们先从第一个开始。第一个技巧是，传达一个核心信息。这句话可以从两个角度理解，一是，你一定要有一个核心信息；然后是，这个核心信息不能太多，有一个就足够了。


    让我们来看看乔布斯是怎么做的。


    # 建立与听众的共鸣


    下面我们来说第二个技巧，建立听众的共鸣。换个简单点的说法就是，你说的这些东西，和听众到底有什么关系呢？


    # 把数字形象化


    下面来说第三个技巧。也是我个人很喜欢的一个，那就是把数字形象化。


    # 口头路线图


    第四个技巧，提供一个口头路线图。什么叫口头路线图呢？其实也很易理解。'
