  md: '# PayPal | 护城河理论之 “网络效应”


    PayPal | 护城河理论之 “网...


    之前在提到PayPal战胜eBay自己的支付工具的时候，我提到过PayPal的一个优势，叫做“网络效应”。这实际上是商业里非常重要一个概念。


    你可能知道，巴菲特有一个著名的“护城河理论”，可以说是他很核心的一个投资理念。而“护城河理论”里面一共有四个要素，其中一个核心要素就是“网络效应”。


    今天我们先来简单说说“护城河理论”，然后再来拆解一下什么是“网络效应”。


    # 护城河理论


    “护城河”的定义 rijden：它是一种企业建立起来的可持续的竞争优势，可以保护自己比较长期地抵抗竞争对手的进攻，所以也就能源源不断地获得利润。说得再简单一点儿：护城河就是，一家企业拥有一些很特别的东西，别
    人很难拿走，于是市场上的钱就都让你挣了。


    巴菲特最爱投资的就是拥有“护城河”的公司。


    不过，很多时候我们都会把一些莫名其妙的东西加入到这个理论里面。所以我总说，比起定义一个概念“是什么”，很多时候我们更要清楚的是它“不是什么”。可以稍微提一句，巴菲特的护城河理论里，有单独一章叫做“什么是‘假’护城河”，也就是“什么不是护城河”，里面开头第一句就说：


    > “在我的经验里，最常见的假的护城河就是：优质的产品、巨大的市场份额、高效的执行能力和很强的管理团队。”


    那什么是真正的“护城河”呢？是下面这四种东西：


    +   1、企业的无形资产：比如品牌，或者进入某个行业的准入许可证等等；

    2、高客户转换成本：也就是，用户放弃你的产品转他人的成本非常高；

    3、成本优势：通过各种方式，你可以持续地以低于竞争对手的价格出售你的产品或服务；

    4、网络效应。


    我知道听到这儿，你可能已经有很多疑问了。不要着急，在未来的专栏里，我们还会反复地学到这个“护城河理论”，我会利用各种公司案例来给你从不同的方面来拆解。今天，我们就先把“网络效应”这个概念讲透。


    # 网络效应


    你一定要记住，“网络效应”的本质是：如果有一种产品或者服务，它随着每一个用户人数的增加，自己本身的价值也会提高，那么这个产品或者服务就叫做有“网络效应”。


    我们举出很多有着“网络效应”的好产品，比如大家非常熟悉的微博和Twitter——在微博和Twitter里，每增加一个用户，你可以关注的人、可以收看的内容都会增加，而且这种增加是指数级的。这就是有着很好的“网络效应”的产品。


    对于我们讲的PayPal来说也是这样。实际上，在PayPal的创业初期，CEO彼得·蒂尔反复给团队灌输的一个概念就是，PayPal是一家非常仰仗于网络效应的企业。因为要想很好地实现人与人之间的转账和支付，一定需要很多的用户，这个网络才能成立。


    也就是说，每多进来一个用户，整个的支付网络的价值本身也会提高一点。所以，我们之前提到，PayPal烧了非常多钱补贴用户，以及使用各种“增长黑客”的方法来获取新用户，都是建立在这个“尽快创造网络效应”的理念上。


    # 什么不是“网络效应”


    不过听到这儿你可能觉得，对于任何公司，有新用户的加入肯定价值都会提高嘛？谁还会拒绝新用户啊？别急，接下来我就讲讲，什么东西不是“网络效应”。


    先来说第一个。有时候，一些产品在宣传自己的商业价值的时候会这么说：当越多 人使用我们的产品，就会吸引更多人使用我们的产品。这是一种奇妙的“网络效应”，所以VC们才给我们好多投资。


    但实际上这个逻辑是错的。来看一家我们很熟悉的企业——肯德基。肯德基就是一个不具有“网络效应”的企业。因为，多一个人去肯德基吃饭，并不能天然地让肯德基的炸鸡变得更好。甚至如果太多人挤进同一家店，肯德基的用餐体验还会下降。但是，如果很多人去吃肯德基，可能会带动更多人去吃，但这不叫“网络效应”。这个现象也早就有
    一个专有名词了：口碑。


    # Uber的逻辑


    最后，我想讲一个小故事。这个故事是Uber的创始人特拉维斯·卡拉尼克（Travis'
  merge: -1
  img_proc: true
- pgno: 123
  md: '的创始人特拉维斯·卡拉尼克（Travis Kalanick）亲自讲的。


    他说，他和他的团队很长一段时间以来其实都在兼职管理Uber，因为他一直觉得“Uber 是个小得不能再小的，高端的玩意儿。不值得投入太多时间。”因为最开始Uber的业务就是派发豪华轿车的服务给有钱人。


    然而有一天，卡拉尼克突然想到，如果在旧金山有3辆Uber的车在街上，那么乘客一般需要等待20分钟才能用车。然而有时候一些周末的晚上，路上会有20辆Uber的车，那时候等待时间会大幅下降。卡拉尼克说：“我突然意识到，Uber的车越多，Uber的服务也就越好。那么Uber的司机也就能够赚更多钱，服务成本下降，乘客也会更开心。我突然觉得……这个东西可以变得很大。”


    当卡拉尼克意识到Uber的网络效应的时候，一家传奇的公司就诞生了。


    张潇雨


    这就是今天的内容。今天的思考题是：说说你对网络效应的理解？有哪些产品你觉得是拥有这种护城河的？


