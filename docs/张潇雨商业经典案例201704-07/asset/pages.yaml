  md: '如果问哪家企业和好市多很像，我想起了我们中国这里的京东。京东也有会员制，它有自营业务和联盟平台企业业务。我就买了京东的会员。成为会员后，京东可以给出很实惠很低的价格，甚至是长厂家直销。前几日购物，买了2箱雪菲力汽水。结果京东联系厂家，让他们直接厂家直送。我拿到的价格是45元一箱，一箱24瓶，外加5元送货费。还有次购物，买了纽瑞滋奶粉，价格后来比较了下卜蜂莲花的奶粉的价格，结果是它的半价。而且京东还有特殊的会员产品，这类商品是有特别打折的，还有自营商品免快递费，以及每买一定商品有返现京东豆，1000京东豆=10元。总之，感觉京东最像好市多的就是最大让利给顾客。它们赚的可能就是会员费。我没看过京东的财报，只是直观感觉它们是这样做的。所以，京东是继淘宝天猫后迅速崛起的一家电商，市值紧追淘宝。另外想起京东当年最好的口碑是在电子产品上，它是从电子电器产品作为切入点，进入电商市场的。这个和亚马逊从书籍作为切入点有些异曲同工的商业战术体现。


    目前沃尔玛旗下的SAM CLUB，跟Costco类似，只是觉得Costco选择更专业一点，在美国基本都是借卡在那里买东西，体会还是蛮多的。深圳原本有一家好市多的店，但开得不够精心关掉了。这样的零售业态对人员和团队要求很高，不求多，求精，这个做法很值得研究。


    可以从Costco看出亚马逊Prime会员服务的原型。用会员费盈利，把商品价格降到最低，让会员最大限度获利，绝对是零售业另辟蹊径的思路。麦德龙是典型的会员制仓储超市，顾客定位于小型零售商、企事业单位等，秉持的理念是“现购自运”。在顾客定位、大包装、精选少数品牌上和Costco很像，但从“成为客户的仓库”的口号可以看出，麦德龙的重心仍在传统的“仓储”上，经营模式没有Costco的创新。'
