    我一直说，这个专栏最大的特点是，评论的质量和价值都很高。我还记得在讲到迪士尼的时候，后台有上海迪士尼乐园的工作人员直接给专栏留言。我们聊到了迪士尼的服务精神、培养规范和令人感动的企业文化。这些都是非常有价值的内容。


    所有来自你们的讨论与思辨，构成了《商业史精读》这个整体的一部分。某种程度上来说，是你和我，我们在共同创作这个专栏的。


