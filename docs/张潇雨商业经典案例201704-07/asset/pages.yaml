- pgno: 178
  md: '行，相信你已经非常能够感受到了。


    所以刘强东在文章里说，未来不管采用什么技术，最终都是要围绕促进信息、商品和资金的更高效率流带来服务的。


    而所有这些东西交织在一起，最终就形成了两个关键词：“无界”和“精准”。


    所谓无界就是，以往无数人登录一个网页去购买，而未来是一个人面对无数多的屏幕场景和入口。所以，未来的流量中心不再重要，真正重要的是以客户为中心。


    而精准就是从大众到每个人。过去的零售是以品类和市场为单位的，瞄准的是大众市场，提供的是批量商品。但未来零售商对消费者的洞察是非常深的，所以服务也会越来越精准。否则不管是“多、快、好、省”，还是“成本、效率、体验”，都是无法做到的。


    而京东要做的是什么呢？就是在这一场变革中，打造一套塞基于“信息、商品和资金”的零售基础设施。而且刘强东说，这套零售基础设施一定是开放、赋能的。它不是消灭今天许多的零售业态，而是与它们融合在一起，共同发展。它影响的不仅仅是消费领域，还包括流通领域，最终给整条供应链（从订单到生产、到终端、再到消费）带来翻天覆地的变化。这就是刘强东心目中，零售的终极形态的样子。


    # —— 本周留言精选 ——


    # 美国零售简史 | “品类杀手”的崛起与衰落（下）


    [1] 记得在德国留学的时候，就经常看到主打Bio的小超市，卖的有机产品相对普通产品更贵。但始终没有发现他们采用会员制或者其他方式进行促销，一直是小规模地存在着。随着REWE、EDEKA等中高端超市也开始划分出有机专区，这个态势对那些Bio小超市的影响会很大。问了问身边大学的同事，他们也说不太出Bio的独特好处，所以可以想见这些Bio小超市的生存压力会很大。


    [2] 对于“快”来说，大家的追求始终是没有极限的。记得以前坐火车出差，都想着提前买好面包和香肠。现在大城市的高铁站，上车前去便利店随时就可以买到想吃的东西。上两周，高铁更是推出了外卖服务。所以，在这种快节奏的出差场景中，人们对快的追求没有止境，接下来一定是对另外三个维度的关注。[3]
    另外大品牌零售店的最大特点就是大、耐逛。ZARA、优衣库和MUJI不用说，如果愿意，在里面随意便便就可以逛个20分钟。可以对比的就是阿迪达斯这类传统大牌，阿迪在三里屯的旗舰店的客流明显就大于在普通商场的小隔间。所以，后面的实体店发展应该更加关注的是“好”，不仅产品要好，各类体验都要好，才能让消费者停下脚步。


    # 美国零售简史 | “品类杀手”的崛起与衰落（上）


    品类杀手的衰落原因：1.竞争对手的模仿以及超越。2.巨头的品类细分，这三家公司做的是一个单一品类，但这只是如亚马逊这样公司的一项业务，当亚马逊深耕这个单项业务时，原有的优势不再具有。3.市场的发展，单一品类的公司无法满足顾客的一站式购物，这对顾客的购物会有麻烦。4.互联网的出现让原有品类杀手的价格优势不再。'
