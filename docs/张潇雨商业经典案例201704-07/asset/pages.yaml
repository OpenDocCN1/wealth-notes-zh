  md: '# 亚马逊 | 贝佐斯的《黑天鹅》与 “可选择权”


    为期两周时间的关于亚马逊和贝佐斯的讲述，已经到了尾声。相信你对亚马逊的商业模式，以及贝佐斯仍营这家巨头公司的思路，都有了非常深入的理解。


    最后两期专栏，我们就再走更深的地方走一走。来uptsächlich讲影响贝佐斯这个人的非常底层的两个思想。分析商业到了这个维度，才真正的透彻和到位，而且也是最有趣的。


    今天我们就来讲讲对贝佐斯影响很大的第一个思想：制造“可选择权”。


    关于贝佐斯，很多你可能知道他有一个著名的12本书的书单。周末的时候我们作为彩蛋发送给你。在亚马逊的传记《一网打尽》里面，你也经常看到对贝佐斯喜欢读书的描写——他不但自己读，还会把觉得很好的书推荐给高管们，组织大家一起讨论。


    这个书单里有些我们之前反复提到过，比如《创新者的窘境》——贝佐斯正是受了这本书的启发，才不断让自己的员工去研发能颠覆亚马逊业务的新产品，比如电子阅读器Kindle承担的就是颠覆亚马逊纸书业务的任务。


    另外还有一本书，其中的思想贯穿了贝佐斯二十年来对亚马逊的管理，也是构成他底层思维逻辑的重要部分。这本书就是《黑天鹅》，也是我们今天要讲的主题。


    # “可选择权”的三个认知基础


    你可能听说《黑天鹅》这本书，它的作者是纳西姆·塔勒布（Nassim Nicholas Taleb），当代最重要的思想家之一。塔勒布这个人写过的几本书都很有意思，从《随机漫步的傻瓜》，到《黑天鹅》，到《反脆弱》，都很快销。


    而且塔勒布这几本书的思想一以贯之，讲的都是一件事，其核心就是一个英文单词，叫：Optionality。这个词其实严格来说是个金融行业自造的词，我们就翻译成“可选择权”吧。


    塔勒布的“可选择权”概念，建立在三个认知之上：


    # 第一个认知是，我们对这个世界会发生什么 是难以预测的。


    这个道理我相信你在很多地方都听到过。世界难以预测的本质在于：世界是一个复杂的混沌系统，而人类的大脑是无法处理对这种复杂系统的预测的。就像在2007年1月之前，那时候iPhone还没有推出，没有人能预测到智能手机到底能给我们的生活带来多大的变化。


    站在十年前，我们是无法想象现在的。


    而且，不只是你我无法想象，这个世界上最聪明的的大脑、最有远见的企业家也无法想象。拿乔布斯来说，iPhone这个划时代的产品是他发明出来的，但你还记得当时乔布斯当时面对各方批评，对iPhone做的三个经典解释么？


    首先他说，iPhone不需要3G网络，因为美国到处都是Wi-Fi，3G模块可有可无；然后他说，iPhone不需要App，也就是不需要手机应用。因为iPhone手机第一次把浏览网页的体验变得非常好，大家直接用网页上面的应用就行了；还有一个你可能有印象的，是乔布斯一直说iPhone不需要大屏幕，因为单手能够操控的手机是最优雅的。


    我们现在再来看这三个预言，我们当代最伟大的企业家之一，是不是也对未来估计得非常离谱。这就是《黑天鹅》里面的第一个核心认知：未来发生什么，尤其是一 些影响人类社会的大事，是无法预测的。


    # 第二个认知是，一件事情的结果和产生的影响是非线性的。


    举个最通俗的例子。所谓的“非线性” 是说，比如一个1斤的石头不小心砸到了一个人的头上，他去医院缝了2针；但是如果一个5斤的石头砸在这个人头上，可能就不是缝10针的问题了。


    同样，像9·11、福岛核泄漏、2008年的次贷危机这样的极端事件，不仅无法预测，而且产生的影响也不是简单线性的。这种事件虽然发生的概率很小，但一旦发生就能改变整个世界的进程。塔勒布也管这种事件叫做“黑天鹅”事件。


    当然，“黑天鹅”也有可能是好的：比如你突然机缘巧合签下了一个大客户，从此业务腾飞；或者你写的书被某个名 人推荐了一下，成了畅销书。这些都是好的“黑天鹅”。但最本质的是，你的书被100个朋友推荐一下的力量，可能和雷军或者是尔·盖茨推荐一下的力量相比，是无法相提并论的。这就是一件事情产生影响的非线性。如果
    你回忆一下《三体》这套科幻小说在中国 的走红，除了刘慈欣 确实写得好以外，整个过程也有一些“黑天鹅”的味道。


    # 最后一个认知是，面对无法预测的非线性世界，我们应该制造“可选择权”（Optionality），让我们尽可能地暴露在好的“黑天鹅”的事件中。


    这个“可选择权”最核心的意义是，它可能面临的损失是可承受并且有下限的，但是万一好的“黑天鹅”发生，它带来回报的上限可以非常非常高，甚至是上不封顶的。


    # “黑天鹅”理论对亚马逊的影响


    贝佐斯，是怎么理解“黑天鹅”对亚马逊的影响呢？其实把这个理论嫁接过来就是：


    +   1. 能打败亚马逊的公司到底是谁，是很难预测的；

    2. 公司投入资源做的事情可能产生的回报，是非线性的；

    3. 应该让自己的公司创造更多的“可选择权”，也就是用可控的风险赌黑天鹅级别的创新。


    > “我觉得亚马逊有一个很特别的地方，就是关于失败。我相信亚马逊是这个世界上最适合失败的地方。（而且我们失败的例子确实很多！）”


    你知道，失败和创新是一对不可分开的双胞胎。想要创新，你必须  要做各种实验。换句话说，如果你确定一个东西肯定能成功，那就不叫实验了。我见到的大多数的大企业都  喜欢说自己热爱创新，但它们几乎都不   承受失败的结果......


    # 首先，他反复强调说，亚马逊要做一家完全以客户为中心的公司，而不是每天盯着竞争对手干什么。因为世界会发生什么很难预测，你真正的竞争对手很可能在你的视线之外。


    # 第二，贝佐斯非常鼓励创新和试错。一个很好的例子是我们介绍过很多次的Market-'
