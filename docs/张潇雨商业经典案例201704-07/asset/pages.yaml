  md: '# 周末互动 | 找到你的热情……等等，热情到底是啥？


    欢迎来到《商业史精读》专栏的周末互动，又可以和你聊天了。今后我会在周末互动里，多讲讲自己的一些观点和解读，这样对你之后再听商业史和公司故事的时候会有些帮助。


    之前在讲述史特尔和苹果的时候，我都总结过一个关键词。同样，如果这周要给皮克斯做个总结的话，我觉得是两个字：热情。就是英文中 Passion 这个词。


    在皮克斯这家公司身上，我们能看到的最重要的品质就是热情。从实际干活的创始人老卡特穆尔、拉塞特，到出钱的乔布斯，再为了某一部《玩具总动员2》不惜推翻重来，疯狂加班的员工，皮克斯公司的人这种对动画的热情，对自己工作的自豪感，是令人特别印象深刻的。


    周四那期我也讲到，如果你对自己做的事真的有热情，那么你周围的人，哪怕是你老板，也是能被打动和感染的。所以，找到你的热情非常重要。


    但是，如果就这个鸡汤路线走下去，这个专栏也就不好玩了。的确，找到热情和激情很重要，但这里面有什么要注意的地方？有什么我们经常会忽略的地方？大家对热情往往又有什么误解呢？我来谈谈我的一点体会。


