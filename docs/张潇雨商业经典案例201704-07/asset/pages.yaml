  md: '# Netflix | 颠覆者的自我颠覆


    Netflix | 颠覆者的自我颠覆


    今天我们继续来讲Netflix这家公司。在之前的专栏里，我们从两个视角讲述了Netflix战败百视通的经典案例。在这个案例里，除了Netflix做对了很多事情以外，百视通作为行业巨头也犯了很多错误。所以这次以弱胜强、以小博大的案例才能发生。


    之前我说过，我之所以很喜欢Netflix，是因为它本身20年短短的历程就非常传奇，也蕴含了很多商业道理。其中特别值得一说的，就是Netflix从2007年到2012年这一段时间自己对自己的颠覆。换句话说，Netflix不仅在创业初期颠覆了百视通这个之前的霸主，而且在自己逐渐成为霸主之后，在行业大风向有所变化的时候，自己坚决地把自己也颠覆了，这才有如今Netflix的辉煌。


    那它是如何做到的呢？今天我们就来讲讲这段故事。


    先来说说当时的行业大背景。大概在2006-2007年期间，美国互联网行业发生的最大变化是，美国家庭的宽带普及率比前几年翻了一倍还多。当时拥有宽带的美国家庭数量超过了一亿，尤其是中产阶级的美国家庭的宽带覆盖率更高。另外还有一件事，在2005年的时候，Youtube横空出世。它于2005年2月注册成立，到了2006年11月就被谷歌公司以16.5亿美金收购。


    可以说，技术上的成熟，加上Youtube迅速、巨大的成功，让人们一下意识到，在网上收看视频内容的时代真的来了。这就是我们后来所称的“流媒体”时代。


    这个时候，DVD租赁行业的领头公司Netflix当然也感受到了行业即将变革的大趋势。你看，商业就是这么有趣，在这个历史节点上，Netflix好像变成了当年的百视通，面临着新的挑战。而曾经的颠覆者Netflix当然知道，与其让别人来革我的命，还不如自己先动手。


    # 三步自我革命


    面对这次行业变革，Netflix分了三步走。


    第一步是，Netflix推出了一个新服务：会员可以在电脑上直接在线观看电影电视剧等内容，不需要订购DVD了。不过，他们一开始上线的，是版权价格比较低的老电影和老电视节目，直接免费提供给会员。于是Netflix在成本没有太大增加的情况下，让用户可以每月花10美金享受“DVD租赁+流媒体”两项服务。


    这种策略比较温和，不影响DVD租赁业务的增长，也能吸引一部分对在线视频感兴趣的客户。实际上，从2008-2011年这几年，Netflix的DVD租赁业务仍然有30%的增长，其实现增速一点也不慢。


    2011年，温和的Netflix走出了激进的第二步。在那年的7月份，Netflix把原来10美金的DVD+流媒体打包服务，拆分成了每个单项服务收费8美金。当时非常多的人不理解为什么这么做，觉得这就是变相提价了60%。


    其实现从当时整个市场看，Netflix 16美金的打包服务费比起其他视频内容供应商，比如HBO或者ESPN还是要便宜的。而且六美金的提价其实算不上多，都买不了两杯星巴克的咖啡。但用户的心里总是很琐磨，加上这次单方面提价过于简单粗暴，也没和用户事先沟通或者商量，所以新的价格政策一宣布，反对的声音极大，到了九月底公司就流失了80万用户——而之前Netflix增长的势头是每个季度100万。


    于是，在华尔街的眼里，Netflix突然从一个高成长的明星企业，成为了一个业务突然停滞，不确定性非常大的公司。你知道投资人都很不喜欢不确定性的。结果从宣布提价的2011年7月份到那年的年底，不到半年时间里，Netflix的股价从接近300美金，一路跌到了70美金左右，跌幅接近80%。非常恐怖。


    另外，除了股价大跌以外。Netflix还面临另外一个挑战。


    从DVD租赁业务转变为线上流媒体的业务，看起来只是内容的存储介质的变化，但实际上Netflix触动了别人的蛋糕。因为，以前的各个大影视公司、内容产出商等等，它们和Netflix是上下游的关系。Netflix可以帮他们卖DVD，带来更多的销售额，影视公司当然是非常欢迎的。而一旦Netflix自己开始播放内容，这些大影视公司的DVD等等一系列服务的销售就会受到影响。


    于是，这些内容提供商开始纷纷涨价，把自己给Netflix的授权费大幅提高。比如在2008年，Netflix和一家叫Starz的付费电视公司有个协议：Netflix每年支付三千万美金的版权费，就能让自己的用户收看Starz上面大量索尼、迪士尼出品的电影。结果协议2011到期的时候，Starz把授权费直接涨到了三亿美金。


    说到这里，我们可以阶段性地总结一下。关于企业的转型，我们其实说了很多次。不管是之前的英特尔、苹果，还是最近的百视通，你会发现转型确实是非常难的。对于Netflix来说，现在当然是如日中天，坐拥接近一亿的付费订阅用户，但回到2011年的时候，它股价大跌八成、用户数量每个月都在损失，还被行业其他玩家挤压，情况是非常艰难的。所以，我们不能只看到当时百视通的愚蠢，应该去理解，很多时候企业转型就是杀敌八百，自损一千的事。


    当然这时候，Netflix走出了自我颠覆的第三步。这一步并不是什么神奇的绝招，就是两个字：坚持。


    比较幸运的是，Netflix这种壮士断腕式的改革，并没有等得太久就迎来了春天。虽然公司在2011年到达了最低谷，但是从2012年下半年开始，公司的业绩就出现了好转。到了2012年的第四季度，Netflix流媒体的用户增长数量为205万，而DVD租赁业务季度取消的用户数量是38万。从2007年到2012年，公司的流媒体用户数终于到了2500万，而DVD租赁的用户只有800万左右了，这标志着公司在业务上的转型已经成功。


    也就“在”这个时段，Netflix的股价也开始腾飞。因为投资者们发现，流媒体业务的最大好处就是公司彻底不需要给内容以实体载体了——之前DVD的时代，每增加一个客户，寄送的成本以及人力的成本都要增加不少；但对于在线视频来说，100万人看和200万人看却没有什么显著成本的增加。这就是经济学里我们常说的边际成本的概念。当然华尔街也是最喜欢这种边际成本接近于零的公司的。


    就这样，依靠着自我颠覆的这三步走，Netflix度过了自己转型最危机的时刻，迎来了从2012年到如今的辉煌。现在看来，这次决策也是非常正确的。如果你你在2012年底，Netflix转型成功之后买了Netflix的股票，到现在应该已经赚了7倍以上。这个侧幅应该不低于北京和上海的房价了。


    张潇雨


    今天我们讲的是Netflix是如何走过自己的转型的。


    讲了两天颠覆和转型，今天的讨论稍微轻松一点：你这一两年都主要在哪些消费娱乐的内容？感受如何？


    欢迎来专栏留言，一起参与讨论。我们'
