  md: '# 亚马逊｜公司价值的本质——自由现金流


    亚马逊｜公司价值的本…


    今天我们继续来讲亚马逊。在1999年的亚马逊致股东信里，贝佐斯写到一件很玩的事。当时亚马逊成立四年，上市两年，他被邀请去斯坦福大学参加一个活动。提问环节，一位年轻的女生问了贝佐斯一个很棘的问题，她说：


    > “我有100股亚马逊的股票，所以我拥有的到底是什么东西？”


    这个问题之所以很棒，是因为它背后隐藏了一个非常本质的问题：一个公司的股票背后，代表的价值到底是什么？


    相信这是个大家都很关心的问题。但是，这个问题的答案众说纷纭，世人有很多种不同侧面的解释。而其中最主流的一种说法是：一个公司股票背后本质的价值，是它能产生的自由现金流。


    请注意，不是现金流，也不是利润，而是自由现金流。这种说法的重要支持者，有大家非常熟悉的巴菲特，还有我们的主角亚马逊，以及它的创始人贝佐斯。


    # Ⅰ “自由现金流”与利润


    “自由现金流”和利润有什么不同？一个简单的理解方法是，利润只是自由现金流的组成部分之一。


    它当然是一个非常重要的一部分，但还不全面。因为利润指的是某一个时间段——比如一年里——一家公司通过经营活动能够获取的额外的价值。但是自由现金流还考虑了另外一件事，就是你为了维持或者不断增加公司的利润，所需要投入的额外的钱。也就是说，你要从利润里剔去维持利润要投入的额外的钱，剩下的才是自由现金流。


    公司利润计算

    基本条件：

    每年总投资 160 百万元

    运送费率 10 万元/年

    运送价 1000 元/人

    运送成本 500 元/人

    车辆寿命 4 年

    (单位：百万元) 第一弊 第二年 第三年 第四年

    总收入 100 200 400 800

    总运送成本 50 100 200 400

    摊销 40 80 160 320

    利润 10 20 40 80


    按照这份成绩单，你作为CEO可能就功成名就、走上人生巅峰、被《财富》杂志评为类似“世界最有潜力CEO”称号了。毕竟第一年你就给公司赚了1000万，而且后三年，每年的利润都翻倍。就是苹果和亚马逊也做不到啊。


    公司自由现金流计算

    (单位：百万元) 第一弊 第二年 第三年 第四年

    总收入 100 200 400 800

    总运送成本 50 100 200 400

    投资支出 160 160 320 640

    年度自由现金流 -110 -60 -120 -240


    这时候你就发现了一个神奇的现象：如果整体地看这四年你公司的发展，公司一共创造了1.5个亿的利润，表现很好，但是自由现金流却是-5.3亿。


    这时候你就明白了，为什么说利润无法真实反映一个公司是否盈利，以及是否有发展潜力。如果用一句话来概括就是：一个企业长期自由现金流的情况，才决定了它本质上值不值得投资。'
