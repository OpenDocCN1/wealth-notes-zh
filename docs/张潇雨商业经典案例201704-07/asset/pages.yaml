  md: '# 研究商业的原则（二）

    | 避免归因谬误


    我们继续这周的话题：研究商业的原则。今天是第二个：避免归因谬误。


    先来回顾一下昨天我们提到的第一个原则：不要把商业当成物理学。本质上，我是在说商业不是严格意义上的科学，不应该像研究物理、化学那样去研究商业。严格的因果律以及定律的可重复性，在商业世界都不是严格存在的。今天，我就来多说说因果，谈谈在研究商业中，应当避免的三种归因谬误。


    记得有一次和知乎的CEO周源老师聊天，谈到一个CEO最重要的能力是什么。我当时提了一个观点：一个CEO最重要的能力是归因能力。也就是说，一个CEO要能知道，自己或者公司做的某件事、某个决策的成与不成，原因究竟是什么。因为很多时候哪怕是成功的公司，也经常不知道自己究竟是怎么成功的，于是就在之后就很难保持这种成功。


    这样的例子在商业史上再发生。当时知乎刚刚完成一笔较大的融资，算是阶段性的成功，但前路仍然漫长。周源老师很同意我的观点，他认为创业公司的CEO，要能非常清晰地知道自己的公司到底是做对了哪些事情才有了成功，否则在这种一日千里的行业里，距离失败也就不远了。


    我后来又听过一次类似的讨论，是在前豌豆荚CEO王倘煜老师的一次分享会上。当时他回顾了豌豆荚在发展路上一些失误和他的反思。他说，其中最重要的一点是，他错误地解读了豌豆荚发展最快的两年时间，也就是2012年和2013年，发展那么快的真正原因是什么。


    他说，如果从现在往回看，当时豌豆荚发展如此之快，包括在2014年1月还获得了软银1亿美金融资的真正原因，其实是“大势”。当时智能手机发展速度极其迅猛，谷歌退出中国后，安卓手机上没有好的App应用市场，所以豌豆荚就脱颖而出了。当然豌豆荚也有一些其他做得很好的地方，比如非常重视工程师、重视产品、打造了谷歌化的公司文化等等。这些确实也起到了作用，但都不是决定性的。


    但在豌豆荚内部，他们错误地把公司的飞速发展主要归结于了自己的努力，并且相信只要持续努力，公司就会一直发展这么快。现在看来这种归因就有些问题的。后来安卓市场开始受到百度、腾讯等巨头的重视之后，豌豆荚的竞争力一下就不足了。这就是一个错误归因的案例。


    王倘煜老师后来还打了一个比喻，我印象非常深。他说，有时候企业就像一个飞速上升的电梯。电梯里有人静静地站着、有人在倒立、有人在不停地跑圈，最后等电梯上到最高层的时候，每个人都认为自己做的事，才是让这个电梯上来的最重要的原因。但实际上这和事实相差太远了。


    实际上，我在研究和分析商业、公司的時候也经常会有这种感觉。人是喜欢因果的动物，很多时候我们希望能找到某种终极和秘诀，使得我们能重复商业上的成功。但这种盲目归因的倾向，也会对我们的研究商业、分析公司起到一些误导。


    # | 三种归因谬误


    总体来说，我们在归因上最常见的错误有三个：一是简单归因，二是过度解读，三是因果倒置。下面我就用一个例子，把这三种归因谬误串起来讲一讲，让你感受一下，当我们分析一家公司的时候，经常会犯哪些归因错误。


    之前在讲皮克斯的时候，我们讲到“智囊团”机制。所谓“智囊团”，就是皮克斯的一些核心员工组成的一个委员会。他们的主要职责是：一部电影每进行到一定的阶段，这些人就聚集在一个屋子里，一边看样片一边给这个电影的导演提意见。一开始，智囊团是皮克斯最早的五个元老自然行成的，后来不同层级的人员不断扩充进来，保证都能参与发表意见，而不是变成了高管的一言堂。


    当时我说，这个机制，是皮克斯能源源不断产生好创意的诀窍。但是，我当时没有敢给出一个结论，就是：只要有了智囊团，就能保证好创意，或者皮克斯就是因为这个“智囊团”的存在才成功的。


    我记得当时有好几位读者，看到“智囊团”这一机制都非常欣喜，说希望马上在自己的公司里推行。这是一种特别好的学习方法，不但学习理论，还注重实践，并且还能推动自己与周围人的成长。但是，我当时却留了一个伏笔，在专栏里没有讲一个东西，就是“智囊团”之外，皮克斯保证创意的另外一个方法。也就是皮克斯和传统动画厂商在生产方式上的区别。


    简单来说，动画片的生产有两种模式：


    一是，正常找来导演、团队，写好剧本，画好分镜头，然后各个岗位分工生产。这种模式和一般的真人电影没有太多区别，只是onne不需真正地用摄像机拍摄，而是用电脑画图。


    另一种，就是皮克斯的生产方法。它会套用一个经典的故事框架，把核心角色塞进去——如果你看过皮克斯的电影，会发现几乎所有的主题都是“成长”，不管主角是小老鼠、退休的超人，还是机器人瓦力，框架都是类似的。但真正出彩的，是框架之外的场景、创意、构思、细节等等。


    谁敢让一个人人喊打的老鼠当餐厅大厨呢？谁敢让一部孩子看的动画片，前40分钟一句话对白都没有呢？谁敢在主流商业动画电影里，不设置一个反派人物，来让主角打败呢？皮克斯就敢，而且这种创新不是一次两次。


    那么这种创意是怎么来的？其实这些细节，都是一群人，坐在一个房子里，一段戏一段戏、一个镜头一个镜头地想出来的。每个镜头都不浪费，每个背景细节都要非常到位，每场戏都要出彩。他们一边想一边就画出来贴在墙上，最终成为一部完整的影片。


    这两种生产方式的不同在于：用主流工序生产的流水线作品，一个片子最多有8-12个亮点和高潮；而用皮克斯这种生产方式，则苛求非常细碎，打磨每一个细节。所以每场戏都有亮点，每一小段就有个高潮，一部片子可能呈现30甚至40个高潮的段落。再加上天才的构思，以及“智囊团”的把关，皮克斯的动画片在观看的乐趣上，和其他动画电影就不是一个级别的了。


    现在你知道，没有这种变态的生产方式，光靠智囊团的机制也是没用的。所以如果我们简单地把皮克斯生产创意的能动归结为“智囊团”，就犯了简单归因的错误。


    说到这儿，你肯定更想知道，这么厉害的生产方式皮克斯是怎么想出来的呢？他们有哪些成功的诀窍使得他们能创造出这种生产方式呢？是他们挑选员工的时候特别挑剔，特别注意保护公司文化，还是有什么特别的培训机制？


    一旦开始想这些问题，你就走进“过度解读”的陷阱了。因为我马上要告诉你一个事实，那就是，这种生产方式根本不是皮克斯创造的，而是业界早就发明出来，后来又被淘汰了的。这套方法的发明者正是沃尔特·迪士尼本人。


    实际上，在上世纪40年代的时候，迪士尼就开始用一种很新的理念去做动画了，那就是“构建整个动画世界”。也就是说我们现在看日本动画、漫威宇宙，以及科幻电影常说的“世界观”。想打造一个“世界观”，就是要抠很多观众可能都注意不到的细节，这样才能营造出真实感。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '到的细节，这样才能营造出真实感。


    但在那个年代，由于技术的限制，这样创作是非常费时费力的。但由于沃尔特·迪士尼当时正处于人生体力最好、事业巅峰的时候，所以面对这种难题，他不但在技术上作了很大的突破，还在创意机制上也有巨大的革新。其中重要的一条，就是这种多人头脑风暴似的剧本创作过程。


    不过，后来连迪士尼公司自己都抛弃了这种创作方法。因为这种生产方式实在是太麻烦了。时间、过程、花多少钱都不可控，无法保证影片上线时间，这对一个上市公司来讲，很难和股东交代。所以在这件事情上，皮克斯并不是开创了什么新的模式，而是捡起了被淘汰的传统。那代价是什么呢？你还记得我们之前提到过，乔布斯离开苹果时套现了7000万美金，5000万都花在皮克斯身上，自己差点破产。


    换句话说，这么搞，也许能出影史杰作，但更有可能一败涂地、输个精光。当然，乔布斯和皮克斯最后靠一部《玩具总动员》算是赌赢了，但过程特别艰险。可能换个不是乔布斯的老板，或者执掌皮克斯的不是对动画有着赤子之心的卡特穆尔和拉赛特，这样的成绩就不会发生了。


    所以，其实很多人并不知道这些细节的故事。但是他们在分析皮克斯的时候，经常把皮克斯的成功归结于其创意文化、对细节的追求，甚至是皮克斯的总部大楼的设计。但这些其实都是因果倒置。


    任何伟大的商业成功，都是由很多因素综合决定的。对于皮克斯来说，可能有两位创始人对动画非常有热情，分工非常好；有一个任性的老板，愿意给他们不断地写支票支持他们；可能在关键时刻找来了迪士尼合作，并且拍出了《玩具总动员》这部名留青史的动画；可能有乔布斯的英明决策，让皮克斯在和迪士尼谈判之前上市，从而获得了谈判的自由；还有他们特别令人羡慕的，畅所欲言、消灭层级的创意文化……但说到这儿不知道你是不是觉得，这些东西哪些是因，哪些是果，已经不是特别重要了？


    如果你有这种感觉，恭喜你，你对商业有了更深入的认识了。在研究商业的时候，的确你会发现，很多时候我们的归因都是极其草率、不理性的。我们有时会把原因简单化，有时会过度解读，有时候会把因果倒置。但就像我们一开始说的，不管是一个公司的CEO，还是我们自己在生活中，不断去锻炼自己的归因能力都是非常重要的，这也是我们在学习商业、分析商业中会获得的一个重要能力。


    张潇雨


    今天我们讲的是研究商业的第二个原则：避免归因谬误。


