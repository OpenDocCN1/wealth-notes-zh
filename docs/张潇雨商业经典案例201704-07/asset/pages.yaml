  md: '# 耐克 | 两个里程碑


    前两期我们已经把《鞋狗》这本书的主要内容讲完了。之前我也提到，《鞋狗》只讲到了1980年公司上市为止，但实际上耐克后面的故事更加精彩。


    其中有两件大事，可以说给耐克整个品牌和运营模式定了基调：一是“Just Do It”这个口号的由来；二是耐克与迈克尔·乔丹的传奇合作。今天我们就来讲讲这两段历史。


    # Just do it


    耐克这家公司最出色的就是它的营销，而在营销里，“Just Do It.”这句广告语可以说是经典中的经典。


    某种程度上，耐克是因为这句广告语从低谷中走出来的。而这句广告语的来源非常有戏剧性。不过，这不是一个什么华丽或温情的故事，反而有点奇妙，甚至荒诞。因为这句广告语，其实来自一个杀人犯。


    上世纪八十年代，虽然耐克上升势头迅猛，但整个运动品牌市场仍是群雄并起。阿迪达斯一直是个长期的对手，另外，很多本土品牌，比如锐步（Reebok）追赶势头也非常猛。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_68_0.png)


    回归正题。耐克被锐步反超之后，整个公司都非常紧张。危急之中，耐克找到了著名广告公司W+K，委托他们设计一句广告语。希望能扩大品牌影响力，尤其engg想打动那些刚刚开始参与健身的女性消费者。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_68_1.png)


    # 传奇合作


    现在我们来说耐克与迈克尔·乔丹的传奇合作。'
