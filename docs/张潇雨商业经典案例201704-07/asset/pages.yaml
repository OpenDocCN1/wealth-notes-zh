  md: '# 妻店的邮购模式


    美国零售简史 | 颠覆夫妻店...


    在结束了亚马逊两周的内容之后，相信你不管是对亚马逊，还是对整个零售行业，都 Bernhard 一些新的理解。接下来这两周，我们趁机梳理一下美国零售业的历史。你会发现，“商业史就是不断地自我重复”这句话，在零售行业里的体现最淋漓尽致。


    本周我们将通过对零售业变迁的观察，对其中一些经典公司以及案例的分析，系统梳理一下整个美国零售业的发展。这周结束之后，你对这个行业的认知不仅会达到新高度，还会深刻地体会到丘吉尔的那句话：“你能看到多久的历史，就能看到多远的未来。”


    # |零售业的核心特点


    零售行业最重要也最核心的特点就是一句话：顾客需求是永恒的，而满足顾客的方式是不断螺旋式发展的。整个现代零售行业一百多年来来的发展，就是一个螺旋式上升、新零售业态打败旧零售业态的过程。


    # 1、“业态”是什么？


    在零售行业，这个词基本上是指企业向顾客提供商品和服务的具体形式。比如我们常见的业态有：连锁店、大型超市、便利店、电商等等。这些你应该都还很熟悉。当我们看美国零售历史的时候，你会发现这些业态就是不断地循环涌现、相互代替的一个过程。


    # 2、什么是“螺旋式上升”？


    第一，消费者的需求是永远不变的。


    任何时代的消费者，追求的永远都是“多、快、好、省”，再加上优质的售后服务。而且奇妙的是，不同时代消费者的需求往往是这几个元素的排列组合。比如，有时候主流消费者在意的是选择多而且便宜，有时候在意的是速度和质量。不同的需求组合，就催生了不同的零售业态。


    第二，消费者的需求，很大程度上是随着社会进程和经济的波动变化的。


    第三，技术的创新与革命，在促使新业态代替旧业态的过程中总会起到关键性的作用。


    另外要补充说明一下，“多、快、好、省”里面的“多”不是一种绝对的多，而是一种平衡。重要的是既可以给消费者足够的 wyboru，又不用挑花眼。


    # |美国现代零售业的第一阶段：邮购


    时间要先回到19世纪80年代，也就是130年前的1880年左右。那个时候美国人口只有5600万，也就是现在的1/6，并且其中三分之二都生活在农村。


    那个时候，一个重大的技术加社会变革诞生了，就是美国的铁路有了巨大的发展。19世纪后期，美国在全国范围内铺设的铁路线，让本来处于边远地区的农民们进入了现代消费体系。在这个阶段之前，所谓的“零售”基本上都是传统的街边小店的形式，很多就是小的夫妻店。


    # |邮购的特点和优势


    第一，过往的夫妻小店无法覆盖农村用户。而兴起的邮政和铁路系统，可以触达这些客户。


    第二，夫妻小店对上游供应商的影响力非常小。而邮购公司由于可以相对统一采购，所以就可以把价格降低，这也是农村用户非常在意的。


    # |邮购的商业逻辑


    首先，铁路系统的成熟使得新消费群体出现了，也就是农民用户。一个大的市场被创造了出来，这就是我们刚提到社会的进程对零售的影响。


    张澍雨


    这就是今天的内容。如果你对零售业有什么发现和困惑，欢迎在留言区写下来和大家分享。'
