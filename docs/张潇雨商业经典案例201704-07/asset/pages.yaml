    # 美国零售简史 | 沃尔玛：价格屠夫重塑美国


    沃尔玛跟亚马逊的低价战略看起来很像，但其实不同。沃尔玛用自己强大的门店网络，强行让上游供应商整合成自己的供应链来达到更低的成本。对于上游供应商来说，这并不能算坏事，<|start|>幕竟这能帮助供应商去掉其他低效的竞争对手。但相对于亚马逊，它并没有去强行整合上游的供应链，而是让第三方低价进驻门店并开放亚马逊的物流、仓储以及网络支持。总而言之，沃尔玛之所以低价是因为强行整合上游产业链，用更高效的生产压低了成本。而亚马逊的低价是因为开放了平台，让卖家自己竞争迫使价格下降。


    难怪佩佐斯说，曾就学过沃尔玛的经营方式。一直觉得，一个企业，本质上是消费者给你钱，让你获得更好的对上下游要价的能力。也就是企业真正应该做的，是降低成本，给消费者让利，自己从中赚一些钱。沃尔玛这种对供应链的掌控，让我想到了苹果，只是苹果的做法没有沃尔玛那么极端。最终，在供应链掌控这件事情上面，我们又回到了对“度”的把握。


    今天才知道，一家超市通过自己的努力，能够对美国社会产生巨大的影响。沃尔玛通过“天天低价”，迫使部分商品提高运营方式和效率，也会同步提高美国社会的整体效率和竞争力。这背后，山姆·沃尔顿要承受极大的压力，破产的连锁店要骂他，低工资的员工要起诉他，竞争对手诋毁他，还有部分媒体的不理解。当前，亚马逊利用新技术异军突起，“多快好省战略”更加明显有效，作为深耕多年的零售帝国，沃尔玛应对应对措施如何？如何实现数据智能+网络效应方面的应用？


    亚马逊的线上百货从起步时，就借鉴学了沃尔玛的“天天低价”，亚马逊也是依靠低价来赢取客户。一直以来，沃尔玛有一个亚马逊难以超越的优势就是庞大的连锁店网络，加上山姆·沃尔顿的卫星布局，消费者开车几分钟就能够到达门店。为了对抗线下沃尔玛的这种便捷性，亚马逊就推出上两周老师讲的Prime会员服务，将原本美国普通8天以上的快递缩短到两天之内免费递送。有数据显示约60%以上的美国家庭都拥有亚马逊Prime会员。但沃尔玛并没有坐等，而是积极向线上进军，推出免会员制的两天内免费递送，也就是不用像亚马逊那样事先缴纳会员费，就能享受送货服务。
    今年亚马逊这么着急收购全食，明显是受到来自于沃尔玛的压力。

    在亚马逊宣布这笔交易的同时一天，沃尔玛也宣布以3.1亿美元的价格收购男装销售网站Bonobos。毫无疑问，这显示了沃尔玛向线上进军的决心。总之这两个零售业巨头，一个线上一个线下将有一场战争，我们拭目以待吧。


    # 美国零售简史 | 沃尔玛与大型超市的腾飞


    通过建立支持零售的后端系统，在店铺少的时候，投入成本很大。当店铺达到一定规模，用系统支持上万家店铺的运营，反而是节约运营成本的。这也导致沃尔玛有资做天天特价，同时也是有效抵御竞争的商门槛。


    沃尔玛的成功，体现了宏观思维的重要性。坐飞机看地面人口流向，从而决定开店，是视野上的宏观；发射卫星，取得商品销售信息猜大数据，是分析上的宏观；建立销售对接系统也是如此，是角色扮演上的宏观。开商店本是很简单的事情，但是有了宏观思维就变成了不简单的事情，并用那种不简单的优势掌握了更多的经营规律，以此赢得先机，是一个重要的思考方向。


    每个时代的聪明商人都会很好地利用当时的新技术，或者说最好的商人之所以是最好的，就是因为对这些技术的运用。'
