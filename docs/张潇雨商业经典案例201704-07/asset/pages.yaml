  md: '# 耐克 | 世界第一（日本）品牌？


    耐克 | 世界第一（日本）品...


    今天我们来讲一家新的公司，耐克。


    # 耐克的地位


    耐克这家公司的重要性在于，它不仅是世界第一运动品牌，影响力更是延伸到了运动之外，包括服装、时尚、文化等等行业，都在受到耐克的影响。耐克早已不是一个简单的运动品牌公司了。


    我说一个数字你可能就能明白，耐克现在的市值大概是900亿美金左右。900亿美金是什么概念呢？世界第二大运动品牌你肯定听说过，是阿迪达斯。阿迪达斯的市值只有350亿美金，耐克是阿迪达斯的将近三倍。


    另外一个品牌LV你肯定也知道，它的母公司叫LVMH，它的市值是1000亿美金。然而LVMH旗下有50多个品牌，不只是LV一个。比如你可能知道的迪奥、纪梭希、香槟，甚至丝芙兰化妆品连锁店，都是LVMH集团下面的。也就是说这50多个品牌加起来的价值才和耐克差不多。


    所以，只有了解耐克这家公司，你才能对整个运动品牌、服装甚至奢侈品领域有一个全面的把握。这周，我会结合耐克创始人菲尔·奈特的公司传记《鞋狗》，来给你从不同方面讲一讲耐克。包括它的创业历史、遇到的困难、关键的营销事件和关键的决策，以及它未来面临的挑战。


    另外，虽然《鞋狗》这本书写得非常真诚，读起来很有意思。但它有一个小缺点，就是只从创始人菲尔·奈特开始创业的1962年，写到了耐克上市的1980年。而后面三十多年特别精彩的故事都没有讲到。所以我会先花两天时间，把这本书讲完。然后就进入虽然书里没写到，但你也特别应该了解的关于耐克的故事。


    # 耐克的前身


    今天，我们先从耐克的起源开始。


    关于耐克，可能很多人都不知道，它在长达八年的时间里其实都算半个日本公司。因为在创业初期的八年里，耐克这个品牌根本不存在，公司的名字叫“蓝带体育公司”，而蓝带体育只有一个业务，就是代理日本运动鞋，在美国销售。换句话说，没有这家被代理的日本运动鞋公司，就没有今天的耐克。


    要讲这段历史就要说到耐克的创始人菲尔·奈特了，也是这本传记《鞋狗》的作者。菲尔·奈特是1938年生人，现在已经79岁了。他在耐克公司CEO的位置上工作了长达51年，直到2015年才退休，可以说是耐克当之无愧的灵魂人物。


    不过他在刚萌发创业想法的时候，只是一个24岁的商学院毕业生。而且虽然耐克这个品牌的形象一直都是非常阳光、向上、充满能量的，但创始人菲尔·奈特却是个生性腼腆，特别羞涩的人。他在书里还特意写道，自己24岁还没有交过女朋友呢。菲尔·奈特在大学是长跑队的运动员，对跑鞋一直非常感兴趣。这种兴趣也奠定了后来耐克在运动鞋方面的霸主地位。


    上世纪六十年代的背景是，全世界最好的运动鞋在德国，最大的运动鞋公司是阿迪达斯。同时日本跑鞋逐渐崛露苗头，开始挑战阿迪达斯。菲尔·奈特很有实在，他没想着马上赚遍世界，而是想看看能不能先把日本跑鞋引进美国卖。


    有了想法的萌生，下一步，菲尔·奈特就要开始行动了。


    他打算直接去东京看看那边的运动鞋公司，这对一个腼腆的年轻人来说还是很不容易的。那时还有一个背景，正值二战结束没多久，美国在二战中往广岛扔了一颗原子弹，两国的关系也
    很微妙，大家对该怎么和日本人做生意非常拿不准。但奈特想做运动鞋生意的愿望非常强烈的，于是他飞去了东京。


    奈特当时看上了一家日本运动鞋公司，叫鬼冢公司。有意思的是，鬼冢公司现在还活着，还活得很好，旗下有一两款鞋甚至可以说是爆款，非常流行。不过它的规模和如今的耐克就完全没办法比了。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_64_0.png)


    # 两次尴尬


    菲尔·奈特拿下鬼冢运动鞋代理权的故事，特别有戏剧性。甚至可以说他是靠着战略性的撒谎和尴尬才做成的。这个尴尬可不是开玩笑，而是真正字面意义上的尴尬。


    当时菲尔·奈特到了东京以后，就给鬼冢总部打了电话，想去谈谈。那会儿也没有互联网、E-mail之类，大家沟通交流都比较直接。日本人也很友善，很快接洽了菲尔·奈特。


    他们带奈特参观了整个公司，参观完结以后，大家坐在会议室里要开始谈正事了。菲尔·奈特刚要说，很想在美国代理他们的跑鞋，还没说完，对方一个高管就打断了他，说：“奈特先生，请问您就职于哪家公司呢？”


    日本人做生意是非常严谨的，一般很看重对方公司的来头、资质等等。 por这样对方要代理自己的产品也比较放心。但当时菲尔·奈特只是一个刚毕业的大学生，别说公司了，连工作都没有。


    他特别紧张，背上腺素急升。一般人在特别危急的时候，都会想到让自己最安全的地方。奈特在书里回忆说，他当时一下就想到了自己父母的家，想到了自己的卧室，以及卧室里四周墙上贴的他在大学田径比赛里得的蓝丝带，这应该是当时他人生里最值得自豪的东西吧。于是奈特脱口而出说：“先生，我代表的是俄勒冈州波特兰市的蓝带体育公司。”


    还好当时没有互联网，日本人也没能搜索一下是不是有这家蓝带体育公司。加上，上世纪六十年代的日本正逐渐走出二战后的阴霾，经济开始复苏，即将进入一个高速发展期。很多日本公司就像现在中国的公司一样，开始“出海”，走出国门外面去。而美国运动健身市场一直是全球最大的市场，于是鬼冢公司也没多想，两边一拍即合。菲尔·奈特就凭这个无中生有的蓝带体育公司，拿下了日本鬼冢公司在美国的代理权。


    更好玩的是，奈特还不止尴尬过他们一次。后来有一次奈特又去日本，谈全国的代理权。因为之前大家的协议是，奈特可以在美国西海岸代理鬼冢的运动鞋，东部的代理权并没有给他。在二次谈判的时候日本人说：“虽然你们这两年业绩不错，但我们希望全国代理商应该比较有实力，至少除了西海岸，在东海岸，比如纽约、波士顿等也得有办事处。”结果奈特马上说：“我们有啊！”实际上根本就没有。


    但这次日本人还是很实在，再一次相信了奈特，给了他一纸三年的独家代理合约。可以说早期的蓝带体育，也就是耐克的前身，就是靠这两次生死攸关的尴尬稳固了脚跟。也因为和鬼冢公司的合作，才有了之后
    的耐克。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_64_1.png)


    # 分道扬镳


    到这儿，你已经听到了菲尔·奈特的创业想法，以及他是如何搞定代理权的。但古人说得好，成也萧何、败也萧何。最终蓝带体育和鬼冢公司还是分道扬镳了。


    因为这种品牌代理的合作模式，对于一个有着创业之心的创业者来讲，本就无法长期持续。在代理的过程中，菲尔·奈特和他的团队，起到的远不只是一个代理商的作用。他们对跑鞋进行了很多技术上的改进，并且把这些专利技术都免费送给鬼冢公司，却没得到任何好处。


    而鬼冢公司方面，一直害怕蓝带体育发展得太快，会反过来威胁到自己。于是两家公司相互的隔阂越来越严重，到了1971年...'
