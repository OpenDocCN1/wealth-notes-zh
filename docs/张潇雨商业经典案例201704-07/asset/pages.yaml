  md: '# 福利｜如何提高商业洞察能力&已有案例关键点提示


    专栏从开始到今天，已经更新了快两个月了，讲了6家公司，40期内容，外加8篇周末互动。并且，我们刚刚经历了升级。所以今天，我来做一期特别的加餐——为你总结一下过去40期的内容。首先帮你巩固已经讲过的知识；另外，也让新来的同学和没得及学完的同学尽快赶上我们的进度。


    今天的总结主要分为两部分。第一部分是提高商业洞察能力要抓住的7个原则与方法，某种程度上，这是《商业经典案例课》专栏的学习指南。如果你能记住并且慢慢理解这些原则，你就能越来越接近洞察商业的本质。第二部分是已有案例的核心要点提示，包括6家公司的关键点梳理，不求全面，主要用来巩固和记忆唤醒。而且这些公司，我们在之后的课程里还会反复提及和讲到，这样你就会不断加深自己的理解。


    # —— 如何提升商业洞察 ——


    # 1. 不要把商业研究当成经典物理学


    经典物理学研究是一个“观察世界——提出假设——验证假设”的过程。其中贯穿着严密的数学推导、规律总结、实验验证，最终得出的是众人承认的定律。整个过程之所以能成立，是因为其中蕴含了两个基础：严格的因果律和定律的可重复性。譬如，在地球上把一个苹果往天上扔，它一定会掉下来，无论谁扔、在哪里扔，结果都不会变，并且能无限重复。但是，这样的严格因果和可重复性在商业世界并不成立。影响商业的因素难以穷尽，有时即使条件完全一样，结果也未必可复制。


    所以，要想提高商业洞察，首先要摒弃一个想法——一定要找出确定因素、固定规律、期待可重复实现。商业研究不是物理学。这也是商业很有魅力地方。


    查看原文：研究商业的原则|不要把商业当作物理学


    # 2. 在“混沌”中寻找秩序


    你一定知道“蝴蝶效应”，它其实是一种“混沌学”现象。说的是，在一个复杂系统中，那怕是初始因子一点微小的变化，也可能导致结果巨大的变动和连锁反应。商业世界也是这样，细微因素的改变会带来结果的巨大不同。


    以迪士尼收购皮克斯为例：如果在乔布斯癌症复发后，迪士尼CEO鲍勃·伊格拒绝此推迟或拒绝了收购，可能迪士尼就不是如今的样子了。没有这样的迪士尼，就没有后来对漫威和卢卡斯影业的收购。而没有对漫威的收购、没有漫威宇宙电影，如今好莱坞大制片公司的运作方式也将完全不同。商业世界就是这样盘根错节，彼此影响。


    提升商业洞察的第二步，就是要在理解世界是“混沌”的前提下，努力寻找一些规律和秩序。从这个角度讲，我们都是商业世界的学生。


    # 3. 重视“归纳”的过程，而不是结果


    “归纳”——通过对客观世界的重复观察，试图总结出一定规律。回顾耐克、锐步、安德玛等几家运动品牌公司的早期历史就能发现，它们从获取第一批最忠实用户，到占领更大的市场的过程，正是经典商业著作《创新者的窘境》里描述过的理论——利用颠覆性的新技术、提供差异化的产品体验；然后找到细分的小众市场，最终挑战大公司。这种归纳就是十分有价值的。


    然而对于洞察商业而言，归纳的过程比得出的结果更重要。因为任何商业理论都不是一成不变的。随着市场变化，很多理论也会被证明是错的、不完美的。但是归纳的过程能让我们保持清醒与思考、认识规律，并更接近真相。所以，要学会重视“归纳”的过程，而不是仅仅记住一个结果。


    # 4. 避免归因谬误


    +   有三种归因谬误最常见：1）简单归因；2）过度解读；3）因果倒置。


    提高商业洞察的第四步，就是在研究商业的过程中努力避免以上三种谬误。一个CEO如果不能正确判断公司成功的真正原因是什么，那么，即使获得过成功，也很难以保持。


    以皮克斯为例：


    如果你认为只要有皮克斯著名的“智囊团”机制就能保证好创意的产生，就是陷入了“简单归因”的谬误；


    如果你开始追溯皮克斯是如何产生这样复杂的创作流水线的，是否与公司文化、培训机制等相关时，又可能陷入“过度解读”；


    如果你想当然把皮克斯的成功归结于它对细节、创意的追求，甚至可能出现“因果倒置”。一味对创意和细节的追求，也曾经差点让皮克斯破产。


    查看原文：研究商业的原则｜避免归因谬误


    # 5. 要敢于跳出概念


    一旦抽象为概念，就会造成很多信息缺失。这使得“概念”本身就具有局限性，拘泥于其中会让人看不清问题的全貌。一个商业概念的含义，还会随着商业环境的变化而迅速变化。而对于人来说，一旦脑中有一个先入为主的概念之后，就很容易陷入查理·芒格常说的“证实性偏见”——当我们主观已有一個概念的时候，就会不自觉地去寻找支撑这个概念的证据。这样就难以进入对商业现象、本质真正的思考和质疑。所以，要想跟上商业概念的变化，就必须<|message|>要破除概念的束缚，随时跳出原有的概念，直接回到问题和时间本身。


    查看原文：研究商业的原则｜不要拄着于概念


    # 6. 运用“动态视角”


    在时间维度上，我们要还原到当时的历史情境，而不是用现在的眼光去判断历史。这需要我们拥有包容的态度和不同维度的思考方式；


    在空间维度上，要尽可能走进公司内部和企业家内心，去感受他们当时的决定，而不是停留在外部的揣测。这需要我们拥有尽可能多的资料。


    二者结合，我们才能还原商业本身，而不仅仅是得出一些简单的结论。


    查看原文：研究商业的原则｜不要站在原地


    # 7. 研究商业是“自我观照”的过程


    商业史之所以常看常新，是因为人性总是亘穿始终，每个人都能从中有所感悟。


    “自我观照”包括两个方面：


    在复杂的商业世界中锻炼自己多维度分析、思考、跳出思维误区的能力；


    在研究商业的过程中学会研究生活本身，譬如，如何与人沟通、如何进行关键时刻的决策、如何激发创意，这些都能从研究公司和商业中看到。


    所以，提升商业洞察的最后一步，就是要学会在商业中看到自己、掌握生活的智慧。


    查看原文：研究商业的原则｜归纳的过程、混沌中寻找秩序与自我观照


    # —— 往期案例关键点梳理 ——


    # 英特尔


    +   1. 硅谷文化的奠基者是英特尔。英特尔奠定了技术至上与人才至上的企业文化；英特尔创始人戈登·摩尔发明的摩尔定律推动了整个行业；英特尔间接促成了现在风险投资业。

    2. 英特尔给硅谷所有企业的创始人树立了一个经典的合作模板——一个对外的人，一个思考的人，一个行动的人。这就是英特尔核心三人组的真实分工，也是管理大师彼得·德鲁克后来对一个完美CEO必备素质的描述。

    3. 英特尔的另一项伟大资产：管理思想。创始人之一安迪·格鲁夫是硅谷公认的“最伟大的管理者”。他的管理风格现在两项重大决策上：在危机时刻依然要加大投资、即使是赔以起来的核心'
