  md: '以，虽然iPhone一直有很多缺陷，消费者也有各种吐槽，但真正掏钱的那一刻，大家往往都会忽略掉那些问题，而选择那些自己最看重的东西。


    其实，在生活中也是这个道理。有时候我们选择雇佣一个人，甚至喜欢一个人，往往不是因为他们缺点很少，而是有一些我们特别看重的优点。为了这些很宝贵的优点和品质，我们愿意去接纳一些他们身上的不足之处。这就是iPhone给我们带来的另一个重要的启示。


    # —— 今日小结 ——


    今天我们讲到了iPhone的诞生，以及这个划时代的产品，给我们带来的两个重要启示：首先，伟大的产品往往不是一蹴而就的；另外，伟大的产品可以有明显的缺陷，但要有更突出的优点。


    下次更新，是我们苹果两周连播的倒数第二期了，我们来聊一个既有点沉重，也非常令人困惑的话题。就是乔布斯之死。我想试着回答一个问题，就是当代最伟大、最聪明的的一个企业家与CEO，为何会让一个本来并不太严重的、可以医治的疾病，最终打垮自己的呢？


    张潇雨


    最后还是留一个小小的思考题：


    你印象里有哪些产品是优缺点都非常明显的呢？你当时为什么选择了这个产品？


    欢迎来专栏后面留言，我们下期再见。


