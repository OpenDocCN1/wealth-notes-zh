  md: '对保持皮克斯的企业文化这点，能深刻体会到乔布斯对皮克斯的爱，以及他深知企业文化对皮克斯的深远影响。


    我记得乔布斯在《书呆子的胜利》采访时，在镜头前谈起他12岁被邀请去进惠普公司工作接触到的企业文化。


    乔布斯说，“惠普是我见过的第一家公司，它让我懂得什么是公司，如何善待员工。每天上午十点，公司运来满满一卡车的甜面圈和咖啡，大家停下工作喝杯咖啡，品尝甜面圈，很明显惠普明白公司真正的价值在于员工。”


    “我的成功得益于发现了许多才华横溢、不甘平庸的人，而且我发现只要召集到五个这样的人，他们就会喜欢上彼此工作时带来的前所未有的感觉。他们会不愿再与平庸者合作，只招聘与自己一样优秀的人。所以你只要找到几个精英，他们就会自己扩大团队。”


    我对当时记在笔记里的这句话记忆犹新。


    # 皮克斯 | 创意机器（3/5）


    思考题：你印象里有哪些特别好的创意？它们都是怎么诞生的？


    好创意是不断迭代出来的，在大家一起合作的时候，把自己和自己的idea分开来看待，是对自己作品的珍视和对自己的尊重。


    在《创造》这本书里，作者提到创意的想法和普通 generell 的想法的诞生过程其实是一样的，称其为创意只是从结果上来评价这个想法。而关于如何变得更有创意，作者的观点是大量的时间投入，重复性地磨练技能，即勤奋的工作。


    隔壁古典老师的《超级个体》专栏今天讲到“哈克尼斯圆桌”——每个人都坐在圆桌周围，最后就有了 一种每个人都看到对方，每个人都必须发言的方式……他的本意是让每个人都发言，做到联机版学习。


    我借用在今天张老师讲的“创意”这里，这个圆桌也是让每个人都有机会表现自己观点，更容易激发创意的一个方法。


    郝广才老师讲过一个故事，说作家刘易斯和托尔金两人约定搞个比赛，要超越安徒生，给英国孩子书写新的童话故事，看谁写得更好。多年以后，前者写出了《纳尼亚传奇》，后者写出了《魔戒》三部曲。


    张潇雨


    设立一个远大的目标有时候的确很管用……只要敢想敢干！


    # 皮克斯 | 和皮克斯二老学习“向上管理”（4/5）


    再次想起罗胖多次提到的那个例子：脱不花娘娘手下有名实习生，给她写邮件时总会在结尾写上希望<|start|>回复的时间，这也让娘娘从此不敢“怠慢”对方的邮件。可见，管理上司，是每个下属都应该学会的技能。


    今天的文章很应景，因为昨天，我和CEO的助理刚讨论了这个问题。CEO助理到昨天入职刚好一年，工作开展得不理想，究其原因刚好三点，和今天的文章不谋而合：


    +   1. 不了解CEO的说话、办事的方式。每个老板都是人，有自己的个性和习惯，但是如果只想：我只做我自己，无论什么样的老板，我说话办事的方式都一样，其实是很难以理解“话语下的意思”或者“为什么这个事情要用这样的方式”。自然，也很难处理好CEO和助理这样两个职位的关系。了解老板，很重要。


    +   2. 管理者的工作，很多时候，要源于自己的突破能力，尤其空降兵，如何在新公司新职位破冰，更多的是源于自己，而不是源于别人给的指示，敢于向你的老板提出要求，不仅仅是资金，更重要的是让他支持你的想法、做法。


    +   3. 热情和真诚的重要性不言而喻，我还想增加一点：自信。你的自信绝对具有感染力，从自信获得的小支持，进行小尝试开始，让老板了解你的能力，用结果证明你的自信，从而将自信演变为互信。


    管理老板，很重要，职场上很多杰出的经理人，不仅仅擅长管理下属，更擅长管理老板。


    # 皮克斯 | 无处不在的细节（5/5）


    追求品质，推倒重来。在苹果和皮克斯都有这样的文化。我们人很容易受到经验或已投入成本的影响，而抱残守缺。结果是自己的停滞不前。只有不断地推翻自己，重新开始（实际上不是从0开始），才能有更好的东西出来。这也是皮克斯创意的方法，从一开始接受很差，到慢慢变得更好，本身就是一直在推倒重来。


    听完埃特尔、苹果和皮克斯，感觉更喜欢去皮克斯上班。


    这是一群有智慧、热情、团结和有远见的人。既能管理好自己的老板，也能尊重团队成员，从而自下而上源源不断地产生好创意（个人认为这是皮克斯最有价值的地方，将不确定的创意生产变成了可掌控的模式），团队之间协作和宽容的文化非常宝贵，无论是谁都有可能犯错，但那又怎么样？纠正过来之后这个错误就会变成整个团队都牢记的教训。


    总之，这家公司内耗很少，值得期待持续的生产力。


    《玩具总动员2》开始没有受到皮克斯的重视，觉得续集难度不大，交由两个新手导演来完成。等到临近交付的时候才发现阶段老套缺乏创意，而核心团队当时刚结束一部高强度新片的创作，需要休整。由于这个问题团队重新集结，每周7天高强度工作了6个月，才有了我们今天看到的这个版本。


    我想象张老师的问题是，到底是那两个新人导演缺乏创意，还是他们没有得到智囊团的支持反复打磨导致的失败，或只像约翰·拉赛特这样的大神级人物和皮克斯的智囊团创新机制的结合，才能做出好作品？


    张潇雨


    《创新公司》里提到一个细节。就是在《玩具总动员1》做完之后，虽然票房大获成功，但是团队内部的项目经理和动画师互相对见解其实很大，都觉得对方不配合自己的工作。


    所以开启2这个项目的时候，他们花了很多精力进行内部整顿，同时像你说的，也没有太重视续集的难度。


    另外，智囊团的机制那时候也不成熟。其实还是个刚起步，成功法则正在建立，自己还不完全知道自己成功在哪里的阶段。'
