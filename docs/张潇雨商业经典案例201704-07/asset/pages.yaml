  md: '# 苹果 | 王者归来

    （6/10）


    苹果 | 王者归来（6/10）


    上周我们在主线故事上讲到了，苹果在一次股东大会中选择了支持当时的斯卡利，而乔布斯无法忍受这种屈辱，愤而离职。于是是从1985年离开苹果到1996年回归，乔布斯度过了一段长达十一年的放逐生活。他自己也说，这段时
    间是他的一 个人生低谷。


    不过，乔布斯就是乔布斯，在低谷时他仍然做了两件大事。一件比较失败，是成立了NeXT电脑公司；另一件非常成功，就是收购了皮克斯动画工作室。而这两件事真正重大的意义在于，这段放逐的时间，加上两家公司的一得一失，让乔布斯从那个不知天高地厚的小年天才，真正蜕变成了一个成熟、谦虚，关键时刻懂得考虑大局的CEO，这为他回归苹果之后创造奇迹打下了坚实的基础。


    # 失败的NeXT


    被苹果逐出公司之后，乔布斯当然还继续留在电脑行业。不过由于竞争禁止的关 系，他不能做和苹果重合的业务，于是乔布斯准备打造给企业和教育机构专门使用的电脑设备，成立了NeXT这家公司。


    但你肯定意识到了一一给企业打造电脑设备，这是微软最擅长的事情。乔布斯最擅长的是把据消费者的心理，打造给消费者的产品，影响世界上每一个个体。而对于企业这种组织，他是丝毫没有热情的。果不其然，NeXT从来就没有接近过成功。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_27_0.png)


    # 皮克斯：意外的神来之笔


    皮克斯这家公司，当时是一个3D工作室，也制作一些动画短片。今天你可能看过很多它的电影了，包括《玩具总动员》、《怪物公司》、《海底总动员》、《飞屋环游记》、《机器人总动员》等
    等，都是非常好的电影，我个人也非常喜欢。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_27_1.png)


    # 王者归来


