  md: '# 美国零售简史 | 战略第一问：你的核心客户到底是谁？


    昨天的专栏，我们讲的是麦当劳的商业模式。或者说，麦当劳到底是怎么赚钱的。最后我们的结论是，麦当劳的主要利润来源于加盟商的租金和授权费，这让它看起来有点像一个房地产公司。不过麦当劳本身的品牌、产品、运营和操作能力也非常关键。没有这些东西，这套商业模式也无法运转。


    之所以昨天的专栏从零售行业突然跳到了快餐行业，讲了一天麦当劳，是因为我们要讲一个对商业、公司、创业最重要的问題：你的核心客户到底是谁？


    我们先回顾一下Costco（好市多）这家公司。在分析Costco的模式的时候我们说，Costco这家超市最大的特点是，它的大部分利润来自于会员费。当时我们还列了一组数字：


    2016年的财报显示，Costco的会员有4760万名，直接带来的会员费是26.5亿美金，但是Costco这一年的税后净利润也是23.5亿美金。也就是说，Costco的商品卖出去再扣除各种成本以后，几乎是不赚钱的，Costco每年的利润基本上来自于会员费。


    另外，Costco商品的毛利率非常低，平均在11%左右，就是维持一个基本运营的费用而已，偶尔还会轻微的亏损。但是，由于Costco的利润来自于会员费，所以在给商品降价这件事情上，Costco和它的客户，也就是它的会员们的利益是很一致的。这种利益的绑定也让Costco的会员忠诚度非常高，从而整个这套体系也可以运转起来，而且运转得非常好。


    # |战略第一问：谁是核心用户？


    那我们为什么要把Costco和麦当劳放在一起讲呢？因为，这两个案例结合起来，背后说明的是关于商业、关于公司、关于创业的最重要的问题，就是：


    你的核心客户到底是谁？你准备怎么从他们身上赚钱？


    这一组问题，被哈佛商学院的教授罗伯特·西蒙斯称为“战略第一问”。也就是说，只要你想弄懂商业，只要你想分析一家公司，只要你想创业，这两个问题都是你最先需要考虑的——你的客户到底是谁？你打算怎么从他们的身上赚钱？


    你可能觉得这个道理很简单，这不是做生意的基木道理么。但很多时候，我们对最基本的问题的认知是非常不够的。现在，我们可以带着这个思路，重新看看麦当劳和Costco这两家公司。


    # |麦当劳：消费者是新老板


    在2002年年底的时候，麦当劳曾经陷入过一次危机。那是公司从1965年上市以来，第一次出现季度亏损，这对麦当劳来说简直不可接受。于是2003年1月，公司就更换了CEO，新的CEO坎塔卢波上任。他是一个在麦当劳工作了28年的老兵，两年前刚刚退休，在危机时刻又被召喚了回来。


    他上任之后，做了各种调研，分析了一遍公司，然后宣布说，公司的新策略是：“消费者是麦当劳的新老板。”


    这句话一听就有点玄机，什么叫“新”老板呢？难道麦当劳不是服务消费者的么？其实确实是这样——很长一段时间以来，麦当劳的内部，认为自己的核心客户是地产商和加盟商。


    回到我们刚才那组问题的第一个问题，你的核心客户到底是谁？对于麦当劳来说，很长一段时间里，它们的答案都是：地产商和加盟商。在上期的专栏里你也看到了，麦当劳的主要利润的确就是来自于加盟商和提供土地的地产商的，所以公司这么看待自己的定位也是丝毫不奇怪的。


    那定义自己的核心客户有什么意义呢？主要意义就在于，它可以指导你怎么投入资源。所以对于麦当劳来说，当它认为自己的核心客户是加盟商和地产商的时候，它就会围着这些客户来打造自己的公司组织架构，然后分配自己的资源。


    比如，你可能之前不知道，从20世纪60年代开始，麦当劳内部就有了房地产部门。当时他们雇佣了一整批房地产专业人才，在美国各地寻找适合麦当劳开店的地产。等找到之后，麦当劳还会有专门的人员来和他们谈判，以非常便宜的价格租下非常长时间的合约。比如20年甚至30年，而且经常是房租锁定一个固定的价格，不涨价的。


    麦当劳遇到一些好的物业甚至会直接买下来。然后，在麦当劳对这块地方进行改造之后，它们就会以更高的价格租给加盟店，赚取中间的差价。当然，麦当劳收的租金可是要随着市场行情上涨的，这就给它创造了更高的利润空间。而地产商之所以喜欢和麦当劳合作，是因为它们的加入可以带来人气，提升区域其他店铺和土地的价值，甚至有的时候还是政绩。所以很长一段时间里，麦当劳和地产商、政府都走得非常近。


    另外，你肯定听说过，麦当劳有一套标准的服务手册。据说整个手册有五六百页，里面有上万条对技术的讲解和详细的操作流程，比如——一个牛肉饼要多少克，可乐的最佳饮用温度是几度，炸薯条的时间长短，甚至店铺的装修、灯光等等等等，都有详细规定。这当然是保证麦当劳食品品质的一种方式，但你有没有从另外一个角度理解过这件事情？麦当劳为什么要这么做呢？


    其实还是回到刚才那个问题，你的核心客户是谁。如果麦当劳认为加盟商是自己的核心客户，那么它自然要投入各种资源，尽可能可能地去服务加盟商——比如让它们能更快地开店、能更好地收回成本等等。麦当劳之所以在全球能开出36000家店来，正是因为快速开店，多收租金和加盟授权费，一直是它们最核心的战略。所以整个公司的架构也是围绕这种定位来设计的。


    结果，这种战略定位一方面让麦当劳的模式非常成功，成为全球最大的连锁快餐店之一，但也造成了很多问题。所以21世纪初期，尤其是2002年的時候，麦当劳来到了一个低谷。因为当时它们太沉迷于这种房地产的商业模式了，陷入了一种攻城略地的快感，慢慢偏离了消费者的需求。


    当时公司的COO阿尔伍雷斯回忆说，每个月，他超过三分之一的时间都完全花在了与房地产相关的事情里，根本没有时间做消费者的研究，或者倾听他们的需求。结果那一阵麦当劳推出的各种新产品几乎都失败了，市值在四五年里跌掉了1/3，只剩下400亿美金左右。


    直到新CEO的上任，重新确立了公司的核心客户，关闭了很多不太合格的加盟店，重塑了公司的组织架构以后，麦当劳才慢慢迎来了又一个辉煌。到了2017年，麦当劳的市值创造了歷史新高，达到了1300亿美金，是低谷时候的三倍多。


    这就是制定战略的第一个问题，你的核心客户是谁？


    刚才除了第一个问题之外，我们还延伸出了另外一个问题：你确认了自己的核心客户之后，打算怎么从他们身上赚钱呢？


    # |Costco：服务好核心客户


    对于普通的超市，它们的做苻你应该很清楚了。尽量低价地进货，然后加一笔越高越好的毛利率给消费者来赚取差价——这也许也是全世界最古老也最经典的商业模式了。但是Costco不是这样做的。


    它的核心客户是它的会员，它赚钱的方式并不是靠卖商品的差价，而是靠会员每年交的会员费。所以Costco的目标一下就变成了，尽可能让会员在Costco占最多的便宜，然后下一年他们就会续费，继续做Costco的会员。


    所以，围绕着这个目标，Costco做出了这样一些看起来奇怪的事情：


    +   第一，商品毛利越低越好，甚至偶尔亏钱卖都沒关系。因为这样会员才最省钱；

    第二，任何会员来买东西，遇到不满意的情况，甚至觉得价格不合理，可以不说明任何理由直接退换货；

    第三，商品精挑细选，不求全，但质量一定要高。这样会员们才能买得放心，还非常节省时间；'
  merge: -1
  img_proc: true
- pgno: 172
  md: '常节省时间；


    第四，Costco不光提供超市服务，还提供药店、加油、验光配镜、健康检查、旅游服务等等。为的就是让会员能够一站式地享受又多又好的服务，永远不想离开Costco；


    最后，如果你买了 Costco的会员，不满意可以随时退款。


    我之前也说过，贝佐斯在打造亚马逊的会员服务的时候，学习了Costco非常多的理念。他形容亚马逊会员服务的时候，有一句话我印象非常深，他说：“我们亚马逊会员服务的目标就是，让任何一个人都觉得，来亚马逊如果不买我们的会员服务的话，就是对自己的一种不负责。”我想这句话用在Costco的会员服务上也是一样的。而Costco正是靠着这种对核心客户的明确定位，才成为了一家让人无法忽视的公司。


    所以，商业最后就是化繁为简。当你把自己的核心客户定义清楚，把如何从核心客户那里赚钱定义清楚的时候，你就可以非常清晰地分配资源、打造一个真正成熟的商业模式了。


    在我看来，麦当劳和Costco都是在这个方面做得非常优秀的企业，而且只有我们深入地去研究它们，才能感受到里面的魅力所在。


    张潇雨


