  md: '# 周末互动 | 刘强东的终极零售观


    周末互动 | 刘强东的终极零售观...


    # 小师弟,你好


    欢迎来到《商业经典案例课》，我是张满意。


    这两周时间，我们把零售行业的变迁做了一个梳理和总结。正好，前不久京东集团的创始人和CEO刘强东，亲自写了一篇文章，叫做《第四次零售革命即将来临》，发表在了《财经》杂志上。当时我正好刚刚写完“美国零售简史”这一系列，在看这篇文章的时候，感触非常深。尤其里面很多观点大家是很类似的。


    这篇文章很长，有接近4000字，还配了四五张图。我想利用这周周末互动的机会，来给你解读一下这篇文章，帮助你梳理一下在刘强东的眼里，未来的零售是怎么样的。当然，我其实推荐你有空去仔细阅读原文，收获会很大。我把文章的链接也附在了文稿的后面。


    文章一上来刘强东就说：虽然新技术在不断冲击着各个行业，零售业也不例外。但“从零售历史来看，今天我们所面临的变革和过去相比并没有什么特别。技术的应用从来都没有在根本上改变零售的本质。所以说，我们并不需要不断地用新词沆去定义一个行业。零售业的本质万变不离其宗：成本、效率、体验。抓住了这一
    点，我们就可以很清晰地看到未来行业的 机会。”


    这里，有两点非常值得注意。


    +   1. 刘强东在理解他所在行业的时候，也是要回到历史中的。这和我们的思路非常一致。


    +   2. 他说得很有意思。零售业的本质万变不离其宗：成本、效率、体验。有没有觉得这和我们这两周一直说的“多、快、好、省”有很大的相通之处？“成本”可以理解成“省”，效率应该是“快”，“体验”就可以对应到“多”和“好”了。当然我要注意，“多、快、好、省”的逻辑还是从消费者这一端出发的，而刘强东作为京东集团的CEO，他应该是从需求端和供应端一起讨论的。但无论如何，有一点大家的理解非常一致，就是零售行业的本质从来没有变化过。


    文章再向下，就开始讨论零售业历史的三次革命了。


    第一次是百货商店，刘强东的总结是：“百货商店带来两方面的变化：在生产端支持大批量生产，降低了商品的价格。在消费端，百货商店像博物馆一样陈列商品，减少奔波，使购物成为一种娱乐和享受。由于兼顾了成本和体验，百货商店成为一种经典的零售业态，一直延续到今天。”


    第二次是连锁商店。文章里写道，“连锁店建立了统一化管理和规模化运作的体系，提高了门店运营的效率，降低了成本。同时，连锁商店分布范围更广，选址贴近居民社区，使购物变得非常便捷。”


    第三次是超级市场，也就是超市。刘强东的总结是“超级市场开创了开架销售、自我服务的模式，创造了一种全新体验。此外超级市场还引入了现代化IT系统（收银系统、订货系统、核算系统等），进一步提高了商品的流通速度和周转效率。”


    说到这里，我想我应该不用做太多解释了。如果你读了这两周的专栏，应该会对这些判断非常熟悉了。


    这篇文章的题目叫《第四次零售革命即将来临》，那么在刘强东眼里，第四次零售革命是什么呢？他说，从上世纪90年代左右，电子商务开始普及。由于不受物理空间限制，商品的选择范围急剧扩大，使消费者拥有更多选择。电商颠覆了传统多级分销体系，降低了分销成本，使商品价格进一步下降。


    但是，互联网对零售的再次改变只是一个初级形态，之所以说“第四次零售革命即将来临”，因为过去20年电商的这一波发展，只是这波大变革的序幕而已。那么接下来，零售的变化会是什么样的呢？


    刘强东说，“判断趋势首先要分析趋势背后的驱动因素。从历史上看，每一次零售革命都是由两股力量共同推动的结果。这两股力量第一是消费的改变，第二是技术的更新。”


    还记得我们专栏开篇上来就说的一个理论么？当时我们说：每一个重要的新零售业态开始涌现，然后逐渐替代旧业态的时候，往往都是由于：


    +   1. 整个社会进程的改变和经济的波动，带来了新的社会风潮。在新形势的影响下，消费者的群体和需求发生了变化。“多快好省”的排列组合像一个魔方一样开始转动。


    +   2. 一些新技术开始出现，导致满足新需求的方式开始成熟了。


    在这个判断上，大家又达成了共识。


    所以，刘强东接下来从消费的变化和技术的更新两方面，讲了讲他对零售行业趋势的预测。


    从消费来说，他提了三个概念：


    # 第一，需求个性化，指的是消费者越来越注重自身个性的表达。


    大家的关注点从性价比、产品功能等这些共性特征，转向美学设计、价值标签这些比较个性的特征。所以大家的需求会越来越细分。比如说，未来每个消费者可能都会有一个“个人信息账号”，账号内记录了包括肤质特点在内的个人生物信息，那么根据每个人不同的肤质，零售商就可以生成个性化的护肤美容产品提供给消费者。这就是需求个性化。


    # 第二，场景多元化，指的是消费场景会越来越分散。


    比如，企业和消费者的接触点不再局限于商场或者网站上面，而是无处不在。比如未来家里的智能冰箱可以自动识别鸡蛋、牛奶还剩多少，然后自动下单；大家可以对着电视剧中喜欢的服装搭配随手拍照，自动识别售卖来源并实现购买；还可以和虚拟助手聊天，让它帮自己给朋友买个生日礼物……所以未来购物的场景会变得非常即时化、碎片化、多元化。


    # 第三，价值参与化，这一点说的是，消费者在整个零售环节的角色越来越积极，不只是被动接受了。


    比如：爱好、身份、标签相似的消费者可以非常方便地聚在一起，形成社群；抓住一切机会与品牌互动：从内容创造、设计参与、决策参与、体验分享到品牌传播……最终，消费者会嵌入在整个价值链条的各个环节，与企业一起创造价值。


    所以，需求个性化、场景多元化、价值参与化，是刘强东认为的未来消费端的前进趋势。那么技术端呢？


    这里，刘强东并没有空谈那些所谓的人工智能、大数据一类的技术变革。他把事情放到了非常底层的层面。刘强东说，零售业的运转在本质上，就是三个东西的不断流转。哪三个东西呢？信息、商品和资金。换句话说，历史上所有零售业的升级，都是信息、商品和资金流动效率的升级。


    在这个维度上，京东有一个发现是，所谓信息、商品和资金流动效率的升级，就是一个信息、商品和资金服务提供者一步步走向社会化、专业化的过程。


    刘强东举了一些很经典的例子。


    比如在信息流方面，他提到了沃尔玛的Retail Link系统，这个系统我们在上周讲的美国零售简史的第4篇《沃尔玛与大型超市的腾飞》也提到过。这个系统的作用就是链接几万个供应商，和它们共享数据：比如销售、库存、门店数据等等。供应商拿到这些数据，就能更好地安排商品的生产、配送、定价、促销等等这标志着零售数据不再是某个企业的专有资产，而是大家可以共享、共同利用的公共资源。


    比如商品流方面，物流也在走向公共服务。刘强东举了什么例子你可能已经想到了，就是我们之前介绍过的亚马逊的FBA（Fulfillment by Amazon）业务。不管你是不是在亚马逊上卖货，都可以使用亚马逊开放的物流服务，这样不但更加规模和经济，你也可以更专注在自己增长的事情上。


    至于资金流方面，现在各种供应链金融的产品，各种针对小商家小企业的货款的盛行，相信你已经非常能够感受到了。'
