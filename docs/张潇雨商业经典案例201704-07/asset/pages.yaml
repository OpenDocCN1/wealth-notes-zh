  md: '# 苹果｜旗开得胜

    （1/10）


    苹果｜旗开得胜 (1/10)


    今天我们要进入一个新的公司了，那就是苹果。


    相信你对苹果公司肯定不陌生。毕竟这是我们这个时代最伟大、最重要的公司之一，从市值上来说，苹果也是当之无愧的第一名。


    但我同时觉得，你可能对苹果并不是真的熟悉。因为不管是围绕在这家公司，还是它的传奇CEO史蒂夫·乔布斯身上，都有太多的谜团以及形形色色的故事了。有的时候信息过多，反而让我们看不清楚这家公司的真实面貌。


    # 两本传记


    这周开始我们来说说苹果的历史，乔布斯这个人，以及那些在商业史上已经成为传奇的故事。由于苹果和乔布斯在商业史上太过重要，我会花两周，十次更新的时间来给你详细解读。


    描写苹果和乔布斯最全面的传记一共有两本：一本是乔布斯亲自授权的《史蒂夫·乔布斯传》，作者是沃尔特·艾萨克森（Walter Issacson），封面就是那张你芮定见过的很经典的乔布斯揪着下巴的照片。


    第二本是后来出版的一本书叫《成为乔布斯》（Becoming Steve Jobs），作者叫布伦特·施兰德（Brent Schlender），他是很著名的科技记者，也是乔布斯的多年好友。我的解读，也会围绕这两本加起来超过900页的传记来展开。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_14_0.png)


    不过你可能会想，为什么在官方传记之外，还要再找一本书辅助呢？其实，这里面也有一个有意思的故事。


    当时，乔布斯钦点了艾萨克森来写他的传记之后，给他很多的空间和时间来创作，同时也亲自接受了很多采访，所以这本书的内容非常详尽和全面。不过，在2011年乔布斯去世，这本传记推出来之后，他的很多同事、家人、生平的挚友都不干了，纷纷站出来反对说，这本书并没有还原一个真实的乔布斯的性格，而是夸大了他性格不完美的地方。


    于是后来，第二本书的作者施兰德就开始写作这本《成为乔布斯》，而乔布斯的这些朋友家人也努力贡献出很多时间接受他的采访。这本书出版后，受到了大家的好评。当然，《成为乔布斯》并没有把乔布斯刻画成一个完美的人，而是把他还原成一个真实的人。所以，这两本传记我都有所参考。


    如果纵览乔布斯的整个职业生涯，其实可以分为三段：


    +   第一段是他从创立苹果，到被苹果踢出局的一段时间；

    第二段，是他离开苹果之后，创立了NeXT这家不太成功的公司，同时收购了皮克斯动画工作室的过程；

    最后一段，就是他回归苹果，实现了商业史上最伟大的一次王者归来的阶段。


    第一周我们先来讲讲前两段的故事，第二周我们会讲后面的那一段。当然，我们不仅会聚焦在苹果和乔布斯身上，还会和你聊聊苹果贯穿的这整个时代。


    今天，我们就从苹果公司的创立开始，讲讲苹果第一个成功的产品，以及苹果公司早期的一个转折性的事件。


    # 另一个斯蒂夫


    先来说说苹果公司的第一个爆款产品。


    众所周知，乔布斯可以说是一个产品大师，但他从来就不是一个顶级的工程师。所以在创立苹果这家科技公司的时候，他需要一个人的帮助。这个人就是史蒂夫·沃兹尼亚克（Steve
    Wozniak）。


    按照现在的说法，沃兹尼亚克就是一个天才的极客和宅男。他比乔布斯大五岁，很早就显示出了在电子产品方面的天赋。两个人认识之后就一拍即合，立刻开始一起做东西玩。


    他们的第一个产品并不是电脑，而是一个叫“蓝盒子”的东西，其实是一个让你能免费给全世界任何一个地方打长途电话的电路板。当时他们用这个蓝盒子搞了很多恶作剧，比如给梵蒂冈的教皇打电话，号称自己是美国国务卿基辛格，而且还真接通了，好在当时教皇正在睡觉。


    对于沃兹尼亚克这种黑客来说，做出这种东西是想免费分享给整个社会的，但是乔布斯坚持要每个卖150美金。最后他们净赚了6000美金。后来乔布斯回忆说：“可以说没有蓝盒子，就没有苹果公司。”


    尝到甜头之后，在1976年左右，两个人开始琢磨做个新东西。那会以英特尔为首的半导体公司已经相对成熟了，极客们开始接触一个叫计算机的东西。于是两个人再一次同样的分工，沃兹尼亚克负责设计电路板，乔布斯来找客户。沃兹尼亚克很快就做出了一个新产品，他俩就管它叫苹果一代。苹果公司就这样在不经意间诞生了。


    当时两个人也很幸运，附近正好有一个卖电器的良小店找到他们，要订购50个苹果一代，每个500美金。对于一家初创公司来说，上来就有付费用户是多么可喜的一件事啊。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_14_1.png)


    # 苹果二代


    而且，这个小店的老板，不但做了苹果的第一个客户，还提了一个至关重要的建议。这里要稍微解释一下，虽然苹果一代听着像是电脑，但那个时候的电脑其实就是一个焊接好的电路板，连键盘、鼠标以及显示器都没有，只有极客和工程师才知道怎么玩。


    那个小店的老板说，现在的电脑其实都是电路板，消费者买回去之后还得自己各自凯种配置、编程什么的，使用门槛太高了。你们应该把个人电脑变成一套完整的设备，提供给消费者，这样不仅能扩大你的客户群，还能卖更高的价钱。


    实际上这和乔布斯与沃兹尼亚克的想法不谋而合。于是，他们就着手开发了苹果一代的后续产品：Apple II，苹果二代。


    苹果二代在一代的基础上做了很多升级，比如内存更大、性能更高。而且，这时候乔布斯的产品天赋开始显现出来了，比如他让工程师为苹果二代单独设计了一个电源，这个电源没有普通电源那么容易发热，所以也就不用噪声很大的风扇来降温了，这让产品的使用体验特别安静。


    苹果二代电脑推出之后可以说一炮而红，这款产品可以算是苹果公司的第一个爆款。而且有一点是，当公司有一个畅销产品大卖之后，就 ecx以投入资源去实验新的产品了。实际上在乔布斯被苹果董事会踢出局之前，整个公司做了一系列不靠谱的产品，但正是因为苹果二代一直畅销，给公司提供源源不断的现金，公司才能存活下去。'
