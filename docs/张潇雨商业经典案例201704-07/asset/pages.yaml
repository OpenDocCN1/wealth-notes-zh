  md: '# 苹果 | 性格乔布斯

    （3/10）


    上次更新我们说到，乔布斯在第一段职业生涯的后期接连遇到了几次失败，首先是表金塔电脑在产品上非常失败，同时和公司CEO斯科利的关系也非常失败，加上他年轻时性格非常不成熟，最后导致他被逐出了苹果公司，开启了一段长达十一年游离于苹果之外的旅程。


    但是在讲这段十一年的历史之前，我想先来说讲乔布斯的性格，试着给他一个更加公平，也更全面的评价。这样，你以后再看到乔布斯的一些想法和决策时，可能<|message|>会有更深的体会和理解。


    关于乔布斯的性格，我知道你肯定有各种各样的印象。比如觉得他很粗暴、偏执、高傲；当然也有一些好的词，好奇、专注、热情。不管你想起哪个词，都证明了一件事情，就是乔布斯可能和我们一样，是一个非常复杂、有着很多面的普通人。


    不过，在所有这些特质里面，他最大的特点应该是：乔布斯为了做出他心目中最好的产品，可以牺牲几乎所有的东西。不管是别人的喜爱，还是自己的健康，甚至世人的评价，他都可以不在意。只要能做好好的产品就行。关于这一点，在《史蒂夫·乔布斯传》和《成为乔布斯》这两本传记里，有三个故事特别值得讲一讲。


    # 施乐之星


    第一个故事是他职业生涯早期的時候。之前的专栏里我们提过，乔布斯曾经拜访了施乐的研究中心，然后决定用看到的图形交互界面技术，研发苹果的下一代新产品。


    其实当年施乐自己也依托这个技术做了一个电脑，叫“施乐之星”。“施乐之星”用上了图形界面技术，但总体来说产品做得很一般，销量也很差。


    这款机器发布的时候，乔布斯立刻去经销商那里看了一下，看完以后，他直接给施乐之星团队的一个硬件设计师打电话说：“你这一辈子做出来的东西都是垃圾，留在施乐没有任何前途。干脆你来为我工作吧。”结果那个个人虽然在电话里被乔布斯穷头盖脸羞辱了一番，但最后居然同意加入苹果了。


    乔布斯从来都是这样，并不太在意别人的想法。只要觉得符合自己那套产品第一的价值观就可以。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_18_0.png)


    # 推翻重来


    第二个故事，是乔布斯在规划苹果的线下商店时发生的。你会发现乔布斯的另外一个习惯，就是为了产品的完美，不惜在发布之前的最后时刻推翻重来，完全不顾成本损失和上线时间的考量。


    当时在设计苹果的线下零售店，也就是Apple Store的时候，大家在讨论店内产品的布局。当时的方案很自然地就是按照产品规划，比如Mac电脑是一个区、iPod是一个区，等等。


    但是即将大功告成的时候，零售店的设计主管罗恩来找乔布斯说：“我觉得我们应该按照顾客做些什么来划分，比如有一个电影区，主要演示如何用我们的设备拍摄和剪辑电影，还有音乐区，大家可以在那里学习用苹果的设备制作和管理音乐，等等。”


    乔布斯当时就暴怒说：“你知道这个变化多大吗？我为线下零售店折腾了六个月了，所有细节都定好了，结果你现在告诉我全部要更改。”


    爆发完之后，两人一起开车去开早间例会。路上他俩都一言不发，气氛非常尴尬。然而到了之后乔布斯突然跟大家说：“罗恩刚刚给我提了个建议，我想了想他是对的。我们得重来。”


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_18_1.png)


    有意思的是，正是乔布斯这种对事不对人的特性，他身边的同事慢慢也开始学会对付他的方法了。比如从公司的早期开始，苹果团队自己就设立了一个内部的年度奖项，用来颁发给这一年最能够敢面对乔布斯的人。


    # 无法赴约


    这件事大概发生在2008年年底，是乔布斯职业生涯的很晚期了。他当时给《成为乔布斯》的作者施兰德打了一个电话，通知了他一件很重要的事。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_18_2.png)


    要知道这四个人应该是世界科技史上最重要的几个企业家了，凑在一起是多么不容易。他们来回沟通商量时间，最后把采访定在了2008年的12月。施兰德也为这个/ios采访准备了半年时间，但就是在采访前的不
    到一周，乔布斯的电话来了，就是故事开头的那个电话。乔布斯说，他没法加 了。'
