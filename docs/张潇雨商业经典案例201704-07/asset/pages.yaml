  md: '# 英特尔 | 硅谷文化的奠基者（2/5）


    英特尔 | 硅谷文化的奠基者...


    上一期我们讲了英特尔的诞生，以及硅谷这个地区的诞生。


    你可能已经感觉到了，英特尔这家公司对整个硅谷的影响是非常大的。今天，我就想详细讲讲英特尔的开创性与奠基性，也就是它是如何给之后层出不穷的科技公司定下一个基调的。听完这期你会发现，不管是苹果、Google、微软、Facebook，还是特斯拉这种现象级的公司，或多或少都有英特尔的影子。


    关于英特尔给硅谷定下的基调，最重要的是三个方面：


    +   一是技术至上与人才至上的企业文化；

    二是摩尔定律对整个行业的推动；

    三是英特尔对硅谷的投资和融资行业的影响。


    这三个方面可以说哪一个单独拿出来都是革命性的，但是是英特尔一身就兼具了三个。


    # 一、技术至上


    我们先从第一个讲起，也就是技术至上与人才至上的企业文化。


    现在如果提到硅谷精神，可能首先会想起这么一些描述，比如崇尚科学与技术、尊重最优秀的人才、和最优秀的人才一起工作，以及相信小公司、小企业也能改变世界。实际上这些精神正是由英特尔发扬光大的。


    比如上期我们提到，仙童半导体刚创立的时候，他们就想搞定IBM这样的大客户，于是所有技术人员疯狂加班加点，研究出一种全新的技术，一下把晶体管的成本降低了几倍，最终成了行业领先的企业。之后，这种基因就深深印刻在了英特尔的公司里。也就是相信，只要我有全世界最好的技术和科技，就没有什么做不到的事情。


    也因为有这种信念，英特尔的招聘也特别苛刻，只要求行业最好的 人。并且招进来后，每周工作80小时以上，最大限度地压榨他们的能力。比如诺伊斯在招聘的时候，经常吓唬选人，反复说英特尔的工作很辛苦，老板可能随时会骂人，干不好就走，而且工资也不是全行业最高的，然后问候选人还愿不愿意来。这样招进来的人，就都是最愿意和英特尔一起创造历史的人了。


    另外，英特尔还反复给员工灌输一个信念，就是：因为你是英特尔雇佣的员工，所以你是最好和最聪明的，只有在这里你才能发挥所有潜力。可以说，因为英特尔的巨大成功，硅谷的人们都把这种公司文化奉为金科玉律，包括乔布斯的管理风格，以及谷歌对于人才的重视，都受到了英特尔很大的影响。


    # 二、摩尔定律


    第二个方面是技术方面，也就是摩尔定律对硅谷的影响。我们先来复习一下摩尔定律的内容：


    +   当价格不变时，集成电路上可容纳的元器件件数目，大约每隔18个月就会增加一倍，性能也将提升一倍。换句话说，每1美元所能买到的电脑性能，将每隔18个月就要翻一番。


    不过很多人都理解错了的是，摩尔定律其实并不是一个真正的“定律”。它不是一个严格的数学或者物理定律那样的东西，比如像牛顿的万有引力定律，你向上扔一个苹果是一定会落地的，是不以人的意志为转移的。而摩尔定律，一开始只是戈登·摩尔对半导体产业发展速度的一种观察和预测，但提出之后影响力越来越大，后来就变成了一个行业的一种规范或者目标了。所有半导体行业的公司都为达成摩尔定律所预测的速度而并命努力，这也直接影响了我们所有人的生活。


    你可能听过一个段子，就是：你现在手里拿着的手机的运算能力，相当于美国国家航空航天局（简称NASA）在阿波罗登月时，使用的所有计算机运算能力的总和。换一种说法，就是你现在使用的手机的运算能力，如果全速运行，可以让超过1000个当时的太空舱同时登月。


    这既是段子，也是事实。而这一切都要拜摩尔定律所赐。


    同时，摩尔定律对于英特尔来讲还有一个非常大的意义。作者在书里总结得非常到位，那就是，英特尔在后来已经变成摩尔定律的捍卫者。


    什么叫捍卫者呢？就是，在英特尔五十年的公司历史里，它曾无数次站在巨大的失败边缘，或者面临马上就要破产的危机，因为科技行业本身波动性就很大。但是每一次英特尔在面临生死抉择的时候，如果它有两个选择，一个是收紧投资，先度过寒冬再说；另一个是，继续拼命加大投资，保证摩尔定律依然成立，它最终都选择了捍卫摩尔定律本身。
    而且神奇的是，这样的赌注恰恰让英特尔无数次在危机中绝处逢生，最终再一次辉煌。


    所以后来人们都说，不仅仅是英特尔成就了摩尔定律，摩尔定律也反过来像神祇一样，庇护了英特尔这家公司，使它屹立不倒，一直站在科技行业的最前列。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_2_0.png)


    当然，摩尔定律对英特尔来说还有一个附加的好处。那就是因为摩尔定律的发明者戈登·摩尔是英特尔的创始人，同时鲍勃·诺伊斯本身在行业的期望也很高，于是光他们两个的影响就足以让全行业的人才趋之若鹜，哪怕环境压力特别大也愿意来英特尔工作。也正因为此，他们这种对人才和技术的超高标准的要求才能持续下去。


    # 三、风险投资


    最后，来谈谈英特尔对整个硅谷风险投资行业的深远影响。


    你应该还记得，当时诺伊斯和摩尔作为“八叛逆”中的两个人，逃离仙童之后打算成立一家新公司，也就是英特尔。他们所做的第一件事，就是融资。


    在英特尔成立的1968年，还没有成熟的风险投资产业。不像现在，如果你现在去硅谷，离斯坦福大学不远处有一条沙丘路，只有两三公里长，但是聚集着世界上最有影响力的几十家风险投资机构，管理着几千亿美元的资金。但在上世纪六七十年代的时候，一般的公司想融资，都要跑遍整个美国，时间非常之长，过程相当麻烦。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_2_1.png)


    但是英特尔的融资却创造了历史。当时融资正式开始之后仅有48小时，各种狂热的投资人就已经打爆了电话，悉数认购了所有份额。后来他们回想说，如果不是因为那会儿大家只能用固定电话回复，这个时间可能还会更短。


    而且，没抢到份额的投资人的确应该很失望，因为那时候如果你投资了一万美金，而持有到现在的话，你现在手里就将有三亿美金了。


    这其实是硅谷历史上一个重要的转折点，因为英特尔这次融资成功的消息，迅速传递到了整个电子产业界，给很多潜在的创业者和工程师打了一剂强心针，于是大家纷纷跳槽创建自己的公司，造就了一波创业的海潮。而且，现代最早、最著名，也可能是最重要的风险投资机构红杉资本的创始人，也是诺伊斯和摩尔的同事。


    可以说，英特尔的诞生，也间接促成了现代的风险投资业，从而也让高科技公司正式登上了引领整个时代的舞台。


    # —— 今日小结 ——


    今天我们讲了英特尔这家公司为什么如此重要，主要是它塑造了硅谷的三个方面：一是技术至上与人才至上的企业文化；二是摩尔定律对整个行业的影响；三是英特尔对风险投资行业的推动。'
