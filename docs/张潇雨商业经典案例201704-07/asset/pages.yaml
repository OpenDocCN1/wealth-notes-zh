  md: '# 迪士尼 | 买买买帝国（3/5）


    上期专栏里我们讲到奠定了迪士尼基础的迈克尔·埃斯纳，可以说他为迪斯尼的辉煌 contribut  汗马功劳，但同时也因为傲慢和自大，最后黯然退场。他的功过，留给后人慢慢评价。而接替他的，是之前公司的COO鲍勃·伊格，也就
    是那 个将埃斯纳打下的基础发扬到极致的人。


    今天的题目叫“买买买帝国”，它想说明的是，迪士尼这十年来不断创造辉煌最重要 的一个原因是，它做了一些最重要的收购。某种程度上来说，如果没有鲍勃·伊格主导的
    这些买买买，迪士尼可能不会有如此的成就。今天我们就来讲讲这段历史。


    # 影响行业的收购


    我们先来说说迪士尼对皮克斯的收购。这段故事我们在之前的专栏里已经讲过了。还有一点需要强调的是，对皮克斯的收购之所以非常重要，是因为它真正改变了迪士尼，也影响了整个行业。


    在收购皮克斯的2006年初，迪士尼正处于又一个低谷。毕竟埃斯纳后几年的管理是比较糟糕的，跟合作伙伴的关系搞得也 很僵，迪士尼已经很久没制作出好的动画作品了。好在鲍勃·伊格促成了对皮克斯的收购。


    鲍勃·伊格后来在接受采访时讲到过一件小事，他在当上CEO之前，去参加香港迪士尼乐园的开幕仪式。其中一个经典的庆祝活动，是所有迪士尼相关的卡通人物在主街上游行。当时因为迪士尼和皮克斯在合作一些电影，所以皮克斯的角色也在里面。


    鲍勃·伊格说，他在看游行的时候有一种恍然大悟的感觉，他意识到十年以来最好的动画角色全是皮克斯创造的。从那个时候开始，他就萌生了收购皮克斯的想法。


    在把皮克斯并入迪士尼之后，以卡特穆尔和拉赛特为首的团队，把自己很多好的工作流程和文化也带进了迪士尼。比如开放的沟通氛围、智囊团的机制、考察旅行、鼓励冒险等等。所以迪士尼的动画部门在他们两个的引领下，逐渐恢复了活力，制作出了像《冰雪奇缘》、《超能陆战队》、《疯狂动物城》等等一系列好电影，同时皮克斯也在不断地贡献着新的IP。


    这次好的合作，让鲍勃·伊格有了两个很大的启发：


    首先，他自己并不是一个以创意和讲故事闻名或出身的CEO，从这个角度上说，他非常需要优秀的人来帮助。约翰·拉赛特就是很好的例证。而鲍勃·伊格的优势，在于设定战略、精细化的运营，另外他谦虚、和善以及真诚的特质，可以赢得很多好的合作伙伴。之前我们也讲过，连乔布斯这么挑剔的人，也把伊格当成可以推心置腹的好朋友。这是很难得的；


    其次，鲍勃·伊格也意识到，迪士尼集团本质是一个内容或者说IP的生意，所以他应该不断把世界上最好的内容纳入到迪士尼旗下。这个商业模式之前我们也重点提到过，在内容一渠道一衍生产品这个覆盖全产业链的模式下，内容是那个核心的驱动引擎。
    只有好内容进来，这台赚钱机器才能运转起来。


    另外，当你在购买好内容的时候，优秀的人自然也就被买过来了。所以在2006年迪士尼收购皮克斯之后，十年间伊格做的最重要的 一系列事情，就是：买买买。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_54_0.png)


    # 漫威与星战


    于是，在2006年以74亿美金的高价收购皮克斯之后，伊格又力主迪士尼做了两次娱乐业非常重大的并购。分别是，2009年以42亿美金收购漫威，以及2012年以41亿美金收购卢卡斯影业，也就是制作了《星球大战》这个IP的工作室。


    这两笔收购，伊格同样做了非常充分的准备。在收购漫威之前，他组建了一大批实习生，去搜罗能找到的所有漫威的漫画，然后写报告给他，来评估故事、角色等的价值。你可以猜猜漫威的旗下有多少个角色呢？8000个。伊格做了一圈调研之后就判断，漫威是一座沉睡的金山。


    收购卢卡斯的电影工作室也很有意思。当时伊格和卢卡斯在吃早餐，一边聊电影，一边看似不经意地问了他一句说：“你有想要卖掉自己的公司吗？”当时卢卡斯已经快70岁了，的确在考虑退休的事了。他说：“我其实正在考虑这件事情。”


    于是六个月之后，伊格打电话给卢卡斯打说：“还记得半年之前我们吃早餐的时候聊的那件事情吗？”


    伊格的这句话看似不经意，其实是早有预谋的。在和卢卡斯会面之前，他一口气把六部《星球大战》全看了一遍，边看边做笔记。这让他和卢卡斯的会面里，充分赢得了对方的好感。


    现在看来，这两次收购的成绩单都非常出色。漫威的超级英雄电影系列这几年可以说是大热，钢铁侠、美国队长、绿巨人、奇异博士、复仇者联盟等等，这些电影都获得了非常好的票房成绩，也给迪士尼贡献了众多新的IP；


    《星球大战》电影重启的第一部，就在全球拿下了超过20亿美金的票房，位列整个电影史的第三名（仅次于《阿凡达》和《泰坦尼克号》）。漫威和星战系列为迪士尼这几年的公司业绩，做出了巨大的贡献。


    另外，收购漫威和卢卡斯影业还有一个特别的考虑——迪士尼很长一段时间以来，因为角色形象等原因，吸引的主要是女孩子。但是超级英雄和星球大战的加入，让他们一下子赢得了男孩子的心。


    # 一些启示


    这就是迪士尼近十年的收购策略对这家公司决定性的影响。可以说没有这些收购，就不会有迪士尼现在的辉煌。在这段历史里，我有两个很重要的启发想和你分享：


    首先，漫威和卢卡斯影业之所以愿意把自己卖给迪士尼，除了业务上的协同性之外，很大程度上是因为他们看到了迪士尼是怎样对待皮克斯的。


    之前我们也提到过，迪士尼收购皮克斯之后，不但非常尊重皮克斯自己的文化和工作流程，还让过来让皮克斯对迪士尼产生了影响。两家的合作非常愉快。


    其实出售自己公司的人，很多时候就像把自己含辛茹苦拉扯大的孩子送人一样。没人希望自己的孩子不被好好对待，而且最好在新人家还能成长，焕发出新的活力。所以迪士尼这种对待自己收购公司的方式，为整个行业树立了一个很好的标杆。


    实际上乔治·卢卡斯就和鲍勃·伊格说过：“如果有一天我真的决定把公司卖掉的话，唯一的目标就是卖给迪士尼。”


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_54_1.png)


    这对我们个人也是一样的。如果你能先做成一件小小的事情，为别人创造了价值，也给自己赢得了尊重的话，那么以后就会有更多的好事情来找你。 这一点，小到日常工作的积累，大到几十亿美金的并购，都是
    一样的。


    第二，我想简单说说鲍勃·伊格。可能这几期听下来，你会觉得伊格是个非常出色的CEO。他很有眼光，为迪士尼定下的收购战略非常成功；同时，他为人谦逊和善，为迪士尼争取到了很多合作伙伴的信任，可以说是广结善缘，为建立这样一个娱乐帝国打下了坚实的基础。


    但如果我们回头看看上期聊到的同样成功，但是脾气暴躁、专制的迈克尔·埃斯纳，如果这两个人担任CEO的时间换一下，迪士尼还会现在的成功吗？


    很可能就不会了。所以对于一家公司来说'
