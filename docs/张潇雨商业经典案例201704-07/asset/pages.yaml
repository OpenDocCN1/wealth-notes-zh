  md: "场。\n\n自由现金流是巴菲特最看重的，没想到贝佐斯也是如此看重自由现金流。满雨老师讲亚马逊第一堂课有个细节，贝佐斯每年也给股东致一封信，当时我的感觉就是，贝佐斯极为敬畏资本的力量，在这篇里果然得到印证。凡是看重自由现金流的企业家，都不会滥用资本，都是稳健平衡的高手，也是管理运营方面的效率高手。这也从前面课程当中的细节可以看出一些，如贝佐斯个人的节俭，和员工工资不算高等，这样就会使当期经营现金流的支出尽可能的低，把珍贵的现金投放到资本性现金支出上。\n\
