  md: '# 苹果 | 风险投资的历史与哲学（4/10）


    上次更新我们讲到乔布斯的性格。想一想，如果你是一个投资人，看到一个如此年轻自大、目空一切、妄想改变世界的人，你敢投资他吗？但现在你肯定知道了，如果你错过投资苹果这样一家公司，可能要悔恨一辈子。


    实际上，风险投资这门生意里也有很多学问。今天，我就来给你讲讲风险投资的历史，以及里面一些小门道。相信如果你之前对这个行业只是听说过，但没那么熟悉的话，听完之后就会对这个行业有更全面的认识。


    我们今天就来讲风险投资史上的两个关键人物，以及这两个人给整个行业带来启示的四个关键认知。


    # 风投之父阿瑟·洛克教给我们的事


    第一个人叫阿瑟·洛克（Arthur Rock），我们之前在讲英特尔的时候提到过这个人。他现在也被称作“风险投资机构之父”。


    你可能还记得，当时以鲍勃·诺伊斯和戈登·摩尔为首的“八叛逆”出走以后，正是阿瑟·洛克帮他们找到了仙童公司，帮助他们创立了后来的仙童半导体。等到仙童半导体分崩离析后，又是阿瑟·洛克帮助诺伊斯和摩尔筹集了资金，创立了英特尔。当然，他在里面也获得了巨大的回报。后来1978年的时候，洛克又投资了苹果57600美元，结果苹果两年之后就上市了，洛克的回报是243倍。


    洛克当时的成功，被他自己总结成了两点。这也是我们说的四个关键认知之中的两个。


    一个是，要想获得超额的回报，一定是越早投资越好。当然，投资越在早期，风险也就越大。所以“风险投资”，也就是 Venture Capital这个词，就是在洛克之后才广为流传的。


    第二，是洛克说自己投的不是产品或者行业，而是投人。他对待项目可以说非常挑剔，宁缺勿滥。有时候他会花几个月跟创业者深谈，从各个方面了解他的人品。而且一般他投资的项目都是朋友的推荐。另外，他也不看重什么商业计划书，比如当年英特尔的计划只有两页。所以，重视人际关系，看重创始人
    的品质，是洛克自己总结的投资成功的秘诀。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_20_0.png)


    # 唐·瓦伦丁的红杉传奇


    不过，对于投人这件事，很快就有另外一个行业宗师级别的人出来反对了。这个人就是开创了当代最成功的风险投资机构红杉资本的唐·瓦伦丁。这就是我们要说的第二个关键人物。


    唐·瓦伦丁的名字我们之前也提到过，他在仙童时期就和英特尔三巨头：鲍勃·诺伊斯、戈登·摩尔和安迪·格鲁夫是同事，职位是销售经理。结果他的业绩非常出色，很快被升职为地区的销售总裁。在瓦伦丁的事业高峰时期，他选择去创业，结果在创业过程中，他发现自己对行业、产品以及投资的判断越来越准，于是，决定转军风投行业。并且用加州最大、最长寿的红杉树给自己的投资机构命名了名，这就是红杉资本的由来。可以说，如果洛克是风险投资个人的鼻祖，那么瓦伦丁创立的红杉资本就是风险投资机构的标杆。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_20_1.png)


    # 风投是如何赚钱的


    到这儿我们已经讲了两个关键人物和三个关键的认知。现在我们来讲最后一个关键认知。这个认知是关于，风险投资机构是怎么赚钱的。'
