  md: '# 英特尔 | 开启一切

    （1/5）


    英特尔 | 开启一切 (1/5)


    在筹设整个“商业史精读”专栏全年版图的时候，我想了很久到底用哪家公司开篇。毕竟全年我们要讲几十家全世界最重要的公司，所以第一家应该有足够的分量。最终我决定，讲英特尔。


    英特尔可以说是现代科技公司一个奠基者式的角色，是一切的开端。不管你觉得苹果、Facebook、Google、微软、亚马逊、特斯拉等等这些公司有多么厉害，不夸张地说，如果没有英特尔，就不会有这些公司。而且这种影响，不只是从半导体到个人电脑到智能手机这种产品层面的，还包括管理思想、团队组织架构、公司文化的影响等等。


    有这么一个小故事：


    在创立英特尔的时候，有几个核心团队的成员就在汽车旅馆里办公。当时他们需要一个工作台，但是大伙都不知道要多高，于是其中一个人就拿了几本电话号码簿摞在桌子上，直到硌到自己的肚子位置差不多的时候，他和同事觉得，“嗯，这个高度合适”。后来这个滑稽的工作台就成了今天的工业标准。


    可见英特尔对整个行业的影响力。所以专栏开篇的第一周，我就结合《三位一体》这本传记，来讲讲关于英特尔的那最最重要的历史。


    这本书厚度有522页，内容非常详尽。我会从几个方面来讲英特尔：包括它的创立与后面的历史，英特尔都对硅谷有哪些影响，它三个传奇创始人######################################


    # 一、八叛逆


    八叛逆，实际上就是八个背叛了自己老板的员工。当然，这八个人有着足够的理由去这么做，不然他们也不会青史留名。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_4_0.png)


    但是现在看来，肖克利这样一个天才，实际上是一个颇有悲剧性的人物。因为他的专业水平非常高，但是情商和为人处世的能力实在是太差了。可以说，你能想象到的一个老板具有的最糟糕的品质他都有，狂妄自大、独断专横、蔑视下属，丝毫不懂如何运作一家公司，更不懂如何激励员工。


    # 二、仙童半导体


    于是我们来到了第二个关键词，仙童公司。当时还没有风险投资行业，这八个人的第一选择是找一个愿意整体雇佣他们八个人的大公司。


    +   仙童半导成立初期，鲍勃·诺伊斯已经显示出了伟大企业家的素质。公司成立以后，他立刻非常冷静地做了三个判断：


    首先，作为一个创业公司想要活下去，一定要尽快推出产品，打向市场；


    第二，晶体管是硬件设备，大公司的大工厂一定有规模效应和成本优势，所以初创公司想要生存，一定 break


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_4_1.png)


    仙童半导体成立初期，鲍勃·诺伊斯已经显示出了伟大企业家的素质。公司成立以后，他立刻非常冷静地做了三个判断：


    可以说这三个判断是非常精准的。根据这三个判断，鲍勃·诺伊斯将团队分成两

    个小组并各自派了一个负责人，让他们互相竞争，来研发最新的制造工艺。仙童的技术人员果然不负众望，发明了一个叫做“平面处理”的新工艺，这可以说是20世纪最伟大的技术飞跃之一。'
