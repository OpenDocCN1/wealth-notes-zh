  md: '# 携程｜寒冬期的竞争逻辑


    今天我们继续来讲携程这家公司。上周我们说到，携程超级团队的组建过程，以及它给我们的一些启示。


    有一个好团队对于一家公司当然非常重要，但携程能在互联网的泡沫寒冬期挺而出，四年就上市，在业务层面也是有很多值得我们学习的地方。所以，今天我们就来说讲携程早期是如何找到自己的商业模式，然后脱颖而出的。


    # 两个逻辑


    如果我们回看携程早期的成功，你会发现，它再次印证了一个商业真理：做事情的时候不要在意风潮，而要回归生意本质。1999年诞生的携程赶上的两件大事就能很好地说明。一是，当时门户网站正在中国大行其道；二是，互联网行业在一年里从泡沫迅速转向寒冬。


    所谓门户网站的大行其道，其实源自于新浪、网易、搜狐这三大门户网站的成功。从1999年的中华网开始——现在这个域名为 china.com 的网站已经淡出人们的视线了——到2000年的4月份新浪上市、6月网易上市，然后7月搜狐上市，这几家公司的成功极大地刺激了想在互联网领域创业的人们的野心。就如同每个互联网的泡沫期一样，人们开始一窝蜂地做起了各种门户。携程也不例外。


    可能很少有人知道，在“携程”这个名字之前，它还曾经短暂地使用过另一个名字：游狐。就是旅游业的搜狐的意思。而携程网上线的时候的自我介绍也是：携程旅游网是专门为旅游者、旅行团体以及旅游相关行业提供在线旅游服务、旅游产品介绍的旅游门户。


    也就是说，和现在的机票酒店预订，旅游深度服务的偏电商逻辑的业务相比，携程其实也走过一段弯路，单纯做的是一个信息门户网站。


    但是在那个时代，人人都想做下一个新浪、搜狐，很少有人真正研究互联网这门生意本质是什么。2000年年初的时候，全球互联网热潮已经到达了顶点，每个人都在幻想互联网的无数可能性和它迅速带来财富的机会。也有无数资金涌入这个行业，投资给形形色色的公司。组建这些公司的，有真诚的创业者和投资者，但绝大部分怀着的想法都是：提高点击率——融资——再花钱提高点击率——继续融资——最后上市套现。


    当时并没有人清楚地知道如何从互联网上赚钱，互联网公司的CEO们也似乎并不在意这一点，他们相信只要不断扩张做大，这个游戏就可以一直玩下去。


    不知道说到这里，你有没有在历史中感受到一丝熟悉。


    # 活下去的方法


    在这种热闹和喧嚣中，梁建章和季琦是不多的保持了冷静思考的人。虽然他们很难预见到互联网这个泡沫具体崩盘的时刻，但他们知道：一个公司总要赚钱，不赚钱的公司没有存在的理由。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_91_0.png)


    如果回归到一个生意的最本质，简单概括起来就是四个字：开源节流。携程也恰恰是这么做的。


    在开源方面，也就是找到一个可以持续性产生收入的业务，携程做了很多尝试。从成立到2000年初，携程卖过飞机票，卖过旅行团，还趁着2000年世纪之交的机会，销售过上海龙华寺新年敲钟的门票。


    但当时携程的体量与知名度还支撑不了这种小而美的非刚需业务，结果居然一张也没卖出去。当时携程的员工们还不得不冒着寒风到龙华寺门口当“票贩子”，可以说被逼无奈变成了一家O2O，从线到线下的公司。


    很多次尝试之后，携程慢慢才发现，酒店订房是一个容易进入，也有发展前景的行业。这又回归到生意的本质了，那就是供给和需求。


    从供给来说，当时的酒店急需能帮助它们销售出更多房间的中介方。其时正值1992-1995年期间，正是邓小平同志“南巡”讲话之后，中国酒店数量迅速爆发，造成了供应的短期过剩。当时有数据显示，全国6000家星级酒店，有3000家是亏损的，行业空房率在30%以上。


    从需求来说，对于寻找住宿地的旅客，也需要一个合适的中间，方便他进行酒店预订。因为当时，随着酒店数量的增多，找到一个合适的地开始变得很困难。没有人会告诉你酒店或者接待所有没有空余房间，旅客也不可能随身带着一本城市黄页来查找酒店的电话。唯一能做的，基本就是通过旅行社找酒店，甚至选择那种在火车站门口招揽生意的小旅店。


    所以那个时候，如果有一个人能在他出发前就帮他预订好合适的房间，而且手续简单，价格低廉，他一定会非常满意。


    我们常说，互联网的最大作用之一就是消除信息的不对称。在它刚刚兴起的1999-2000年，这个逻辑被完美体现了在旅游行业里。于是，在世纪之交的时刻，携程开发了酒店在线预订系统。很快这也成为了他们真正能够赚到钱的核心业务。


    在节流方面，携程也做得不错。你知道，在这种泡沫时期，公司可以做出很多荒谬的烧钱举动。就像这几年的创业热潮一样，那时候 each “财大气粗”的网站，经常大做路牌广告、车身广告、地铁广告，还有公司在上海的甲级写字楼里租了整整一层，人数最多的时候也还有一半是空置的。


    泡沫一破，这样的公司的结局可想而知。


    携程虽然也在意点击率，但由于几个创始人的理性性格，他们的钱花得合理很多。比如携程早期的广告经常是围绕飞机乘客的，比如投放在国内的大型机场里，有一些精準营销的理念；携程还和民航总局合作举办过空姐大赛，在网上进行了独家的直播，传播效果也非常好。


    后来，根据沈南鹏的估计，当时的市场费用加起来有一两千万左右，算起来只有一两百万花得不太合理，远没有到致命的程度。所以在互联网泡沫破裂之后的寒冬期，携程反而活得不错。


    > 2017.06.13 关于在行业泡沫期，如何找到属于自己的商业模式。携程的做法是，回到供给和需求的本质。


    # 失控的竞争对手


    作为对比，我们可以看看携程的竞争对手在做什么。当时携程一个最直接的竞争对手叫做艺龙。它的创始人唐越也非常优秀，背景和沈南鹏有些相像，年龄相近，也曾赴美留学，并且在美国最大的投资银行之一美林证券工作过。


    同样，艺龙最开始的定位也是门户网站的思路，他们自称是“城市生活服务商”，向各大城市提供娱乐、活动、天气预报、购物、健身、新闻等信息。之后，艺龙开始了一系列收购，包括当时很著名的社区“西祠胡同”。然后，它收购了一个酒店订房中心，叫百德勤商旅。


    然而非常可惜的是，艺龙在错误的时间点选择了错误的合作方。2000年3月，美国一家当时很著名的互联网公司 Mail.com，看上了艺龙这家公司。在互联网泡沫的顶峰，用自己6800万美金的股权收购了艺龙。当然最后这些股权几乎变成一文不值'
  merge: -1
