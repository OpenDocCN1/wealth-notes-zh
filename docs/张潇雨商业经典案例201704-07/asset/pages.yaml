  md: '# 美国零售简史 | 沃尔玛与大型超市的腾飞


    今天我们继续来研究美国零售业的历史。

    先总结一下前面几篇文章主线：


    美国零售业从18世纪末到19世纪初有了邮购形态，之后有了简易的连锁店，然后是大型折扣超市诞生，但是还在默默发展，这个阶段的主角是大型购物中心……


    整个过程就是新业态不断代替旧业态的过程。所以你应该知道，我们又要进入下一个阶段了，这个阶段就是从20世纪70年代开始的，大型折扣超市的爆发期。


    # 明星公司沃尔玛


    这个阶段最有代表性的明星公司，就是我们最熟悉的沃尔玛。即使现在看，沃尔玛这家公司的地位都是无法忽视的：在收入排名的《财富》500强单里，沃尔玛常年都列在第一位。沃尔玛现在的年收入接近5000亿美金。作为对比，苹果的年收入是2000多亿美金，亚马逊是接近1400亿。


    另外，在之后的学里你还会发现，沃尔玛不仅影响了零售业，它的影响还延伸到了行业之外。比如亚马逊的很多做法和理念，就是向沃尔玛学习的。再有，媒体之前统计过，沃尔玛现在的员工超过200万，在数量上仅次于全世界的两个组织：一个是美国国防部，一个是中国人民解放军。


    所以不夸张地说，沃尔玛是一家重新塑造了美国的公司。今天我们就详细说说大型折扣超市诞生的背景，以及沃尔玛的崛起。


    沃尔玛实际上是在1962年开出的第一家店，但是在整个六十年代，大型折扣超市——也就是以低价和大规模作为主要卖点的超市——还没有迎来爆发期。沃尔玛真正的爆发是从20世纪70年代开始的，一直延续到90年代。


    在沃尔玛的历史财务报表中，有一个数字可以说明这个变化：沃尔玛的第一家店是1962年开的，到了1970年的時候，这个数字变成了32家，可以说是稳步增长；而到了1980年，沃尔玛拥有的店铺数量变成了276家，两年后的1982年又跳到了491家。可以说，整个70、80年代，是大型超市发展的黄金时期。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_162_0.png)


    按照我们之前讲过很多次的逻辑。在某种生态爆发的时候，一定有一些社会大趋势上的变化。所以美国的七十年代发生了什么呢？


    # 美国经济与大型超市的起家


    熟悉美国历史的同学应该知道，美国在20世纪70年代进入了“滞胀”时期。“滞胀”是一个经济学术语，指的是停滞性的通货膨胀。说的是，这个阶段里经济增速缓慢甚至停滞，但是物价却持续飞涨。可以说是很痛苦的一个阶段。在“滞胀”的时期，企业产值下降，失业率会上升、国民收入下降，是一个经济非常不稳定的状态。


    实际上，在1970年-1982年这短短的12年里，美国就经历了4次经济危机。可以说二战结束之后20年的黄金时代正式宣告结束了。可想而知，这个阶段里，人民的收入减少，消费能力降低，所以对日常用品的价格又开始敏感了。这个时候，早在20世纪60年代初就登场了的这些大型折扣超市，突然就迎来了历史的机遇。


    当初大型折扣超市是怎么起家的呢？


    20世纪60年代初，购物中心发展火热，不过很多精明的零售商觉得，价格低永远是消费者的需求，所以它们一直没放弃探索成本更低的销售方式。到了1962年的時候——这一年份在零售行业应该是很神奇的一年份——因为在这一年里，沃尔玛（Walmart）、塔吉特（Target）、凯马特（K-mart）和科尔士（Kohl’s）这几家后来全部成为美国零售业巨头的公司，都都是在这一年开业的。


    它们主要借鉴的是之前超市的概念，比如：开在郊区，所以可以规模巨大而且租金便宜；装饰也非常简单，甚至可以说简陋。很多店直接是仓库改装的，这样就可以把成本降到最低。


    不过比起之前的超市，它们除了要卖日常的食品杂货以外，还有电器、服装、各种家用工具等等，所以准确来说更像是个折扣式的百货商场。不过为了大家的习惯，我们还是把沃尔玛这样的零售业态称作大型折扣超市，或者大型平价超市。


    这些大的折扣超市出发点非常简单，就是低价。它们觉得只要低价就一定受到欢迎。而且幸运的是，它们等到了美国经济下行的一个时期。所以我们一直说，千百年来顾客的需求其实就那么几种，只是看谁能以最高的运营效率去满足。


    你看，郊区选址、商品低价、店铺做到大规模、商品包罗万象，并且利用技术优化运营，这些方面，哪个都不是沃尔玛最先发明的。但是，它的真正厉害之处，就是把每一项都发挥到了极致。这就像我们之前在讲苹果的iPhone时讲到的：伟大的产品和创新往往不是一蹴而就的，而是把很多前人的技术和成果拿来，组合成新的方式，而且发挥到极致。在沃尔玛身上，这一点再次得到了印证。


    # 沃尔玛的独特之处


    所以接下来，我们来看看沃尔玛这家公司，到底有哪些与众不同之处。


    要想说明白沃尔玛的成功之处是个很大的命题，今天我们先从沃尔玛对新技术的运用这一个角度进行分析，其他方面在之后的文章还会提到。


    之前我们说到，第一家沃尔玛是1962年开业的，不过它的真正腾飞是从70年代开始。那70年代开始发生了什么呢？


    如果你记得《商业经典案例课》专栏开篇的第一家公司，英特尔这家，是1968年成立的。从那个时候开始，人类可以说迎来了一个新的时代，就是信息时代。


    沃尔玛在20世纪70-90年代爆发，其中一个重要的原因就是它很早就开始运用新技术来辅助自己经营，它慢慢战胜了许多在这一方面思路比较陈旧和僵化的传统零售企业。举几个例子说明一下。


    第一个例子是：在20世纪70年代初的时候，沃尔玛的创始人山姆·沃尔顿买了自己的第一架私人飞机。如果你对沃尔顿有所了解的话，应该知道他一生都是一个非常节俭的人，而且把这种节俭深深地带入了沃尔玛。所以这次投资对他来说也是非常不容易的。


    结果，这次投资飞机成了他人生做的最好的决定之一。沃尔顿后来説：“我买第一架飞机的时候，主要是为了更方便地在店之间往来，这样能够及时解决了经营状况。不过随着沃尔玛分店越来越开，我们突然发现，飞机成了勘察新店地址的一个最佳工具。我们从空中俯瞰，观察当地的交通流向，判断哪些城市和小镇正在快速发展。这个做法比绝大多数零售商领先了十年。”


    后来，山姆·沃尔顿和他的团队用这种方式亲自选定了开始时的100多家店，而且至少前400家店的新址选定都是由山姆亲自完成的，可以说是亲力亲为。使用飞机也是沃尔玛在腾飞时期一个妙招。


    还有一个例子。20世纪80年代初的时候，当其他零售商还在琢磨到底如何利用IT系统，怎么“信息化”的时候，沃尔玛已经开始和外部公司合作，花2400万美金造了一颗人造卫星。然后在1983年发射升空。之后沃尔玛又陆续投资了6亿多美金，建立起了一套完整的电脑和卫星系统。


    借助这套系统，沃尔玛的上千家店之间可以快速沟通，了解每天的销售情况、查到当天信用卡入账的总金额，以及任何区域任何商店甚至任何商品的销售数量。这在互联网还没有大范围普及的时代是极为先'
