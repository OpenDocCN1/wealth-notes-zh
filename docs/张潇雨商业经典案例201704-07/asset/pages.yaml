    # PayPal | 支付战争中的幸存者


    +   1、识大局的合并或是说放手才真正的智慧和前瞻性。

    2、之前一篇有名的论文《市场的短见》里，主要说了应该去认识到市场中存在的不同形式的竞争，这与PayPal当时的形势以及现在一些互联网支付信贷企业都密切吻合，除了来自企业之间的竞争，还有外部的比如银行、证券公司等一些别的机构。

