  md: '于是PayPal团队顺藤摸瓜地到eBay上面一搜，发现已经有几千个商品页面里有PayPal链接了。而且为了赚这10美金，好多商家还会在页面上详细介绍如何注册PayPal的教程，于是PayPal一下意识到，他们应该大力向eBay发展。


    于是PayPal围绕eBay做了非常多的工 作：比如他们在官网上放置了一个功能， 让商家可以一键将PayPal链接添加到自己 的商品详情里面。有一个数据可以告诉你
    eBay和Paypal之间多么互相依赖，在 eBay收购PayPal的时候，eBay上面已经 有超过一半的商户都使用PayPal作为支付 工具，而PayPal的三分之二的业务来自于
    eBay。可以说这两家公司谁也离不开谁 了，这也为后来的收购埋下了重要的伏 笔。


    但是，当你把自己的核心商业模式建立在别人的平台之上的时候，就会处处受制于人。实际上，eBay早早就收购了一家叫Billpoint的支付公司，想要打造自己的支付工具。而且可想而知，eBay对自己的支付工具有很多政策上的倾斜，比如：在首页放上各种横幅广告宣传；还有，在默认支付选项上直接勾选Billpoint，引导大家注册等等。


    但后来，PayPal还是顶住了eBay“亲儿子”的竞争。原因主要是两个方面：


    首先，PayPal的业务模式本身有一个天然优势，叫做“网络效应”。简单说，就是一旦一个用户使用了PayPal给别人转账，那么很容易就会激发新用户的Stores；而且这个关系网络人越多价值也就越大，所以PayPal是有所谓的“先发优势”的；


    另外还有一个很重要的因素就是，eBay还是一个比较有“节操”的公司，它没有粗暴地直接把PayPal封掉，不允许大家使用。因为当初eBay的创始人还是很想做一家开放自由的平台的。当然，当时eBay也不敢做得太绝，毕竟PayPal已经有很多忠实的卖家用户了。


    总之，PayPal靠着自己的努力，最终让eBay付出了15亿美金的代价收购了自己，也成为了早期互联网时代的一个奇迹。


    # 两个延伸


    最后，作为今日得到，我想给PayPal的创业史做两点总结和延伸：


    首先，人们常说“识时务者为俊杰”，彼得·蒂尔和埃隆·马斯克就是识时务的人。如果他们当时不选择合并，很可能两家都活不下去。因为当你眼中只有对手的时候，你总会想着怎么把对方击败，就看不到其他地方伺机而动的危险了。


    实际上支付这门生意，竞争对手只是很小的一个威胁，因为你还要面临很多利益相关方的挑战：大银行、VISA这样的信用卡组织，金融监管机构，地方政府，甚至还有顽固的用户……


    你会发现，后来在中国互联网的合并潮的时期，58和赶集，携程和去哪儿，在讲述它们之所以要合并的原因的时候，都提到了类似的理由。所以在什么时候、应该和谁竞争，不仅是商业的智慧，也是我们在生活中可以去思考的问题。


    另外还有一个小彩蛋。当年PayPal为了反诈骗，研发了非常多的技术。结果后来，这些累积的技术和经验，都用在了另一家创业公司里，就是彼得·蒂尔后来成立的神秘的大数据公司Palantir。


    这家公司现在已经估值超过百亿美金，而且和美国政府，包括中情局、联邦调查局都有合作。所以，不管你觉得现在做的事情看起来多么琐碎和没有意义，它都可能成为日后非常有价值的东西。


    张潇雨


