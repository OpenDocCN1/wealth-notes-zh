  md: '# 美国零售简史 | “品类杀手” 的崛起与衰落（上）


    这上一篇的介绍之后，这两周的时间里，我们沿着美国零售行业发展的历史，讲到了这个行业的一些基本特点、一些重要的公司，还有一些核心的商业概念。今天我们就顺着这个路徑继续往前走。接下来的两天里，我们会一起看看三家企业从崛起到衰落的变迁过程，以及它们背后的商业现象。


    这三家公司分别是：玩具零售商玩具反斗城（Toys ’ R’ Us）、办公用品零售商史泰博（Staple）和有机食品零售商全食超市，也就是我们之前提到过的，被亚马逊收购的
    Whole Foods。这两期专栏之后，我们对整个零售史的梳理也就暂告一段落了。


    # |婴儿潮下的玩具反斗城


    1948年，一个叫查尔斯·拉扎勒斯（Charles Lazarus）的人开设了第一家婴儿家具店。如果你还记得我们之前提过的美国历史的话，1948年正是二战结束，美国经济开始进入20年黄金发展期的时候。在这个黄金时期，美国不仅经济大发展，人口也大爆发。从1946年到1964年这18年里，美国出生的婴儿有7800万，占比超过了当时美国人口的三分之一。后来人们把这个阶段称为“婴儿潮”，这个阶段出生的孩子也叫“婴儿潮一代”（baby
    boomers）。


    于是，玩具行业迎来了一个高速发展的阶段。拉扎勒斯一开始做的是婴儿家具生意，在1957年，他顺势成立了第一家玩具大卖场——玩具反斗城。


    # |哈佛高材生创建的史泰博


    史泰博是美国最大的办公用品和文具零售商，有超过1500家店，每年的销售额在180亿美金左右。主要卖的产品就是：纸、笔、曲别针、文件夹这类东西，你能数得出来的那些
    Each 大公司基本都是它的客户。


    # |深耕绿色食品的全食超市


    Whole Foods是1978年成立的，主打绿色、有机、天然食品，同样也是一个“品类杀手”。不过 Whole Foods的模式和玩具反斗城以及史泰博有一点不一样的是，之前两家都是在现有一个大的市场里面抠出一个品类，然后通过精细化的运营方式、更低的价格和更优质的服务和选择，创造了一盘大生意。而
    Whole Foods 代表的这个市场更加垂直细分，创立也早，可以说它在美国消费者还不太理解“有机”这个词的时候，就开始推广这种健康理念和生活方式了。'
