  md: '# PayPal | 快速增长期的三个理念


    今天我们继续来讲PayPal。如果你看了之前的专栏，应该能会到一件事情——由于PayPal所在的支付领域对手众多、PayPal的业务特性决定了它非常依靠网络效应，所以对于PayPal，生死线就是一件事情：疯狂增长。或者说，为了快速获取用户、迅速增长，PayPal是不惜代价的。


    那么除了对用户进行大额补贴、使用各种“增长黑客”的技巧之外，PayPal还做了哪些事情让它们保持了这种快速增长的势头呢？今天我们就来说说，PayPal快速增长的三个理念。


    # | “有害”的人员多样性


    第一个理念是招聘方面的。PayPal有一个反直觉的早期招聘的理念：创业早期招人最好不要什么多样性，招的人越像越好。


    现在的很多公司，尤其是互联网公司，经常强调员工的多样性。不管是性别，还是人种，包括地域、教育背景等等，大家都会觉得员工的多样性越强，公司的创新能力也就越强，公司的业务就会越好。


    但PayPal的做法是相反的。它们认为：创业早期不应不管什么政治正确或者创新能力，一切都应该为了速度服务。所以组建团队的时候，应该大量招自自己背景类似、思维方式类似，甚至生活习惯都类似的人。这样公司就不会花大量时间来辩论各种大小的决策，比如应该用什么语言来编程，最优的内部沟通工具是哪一个，甚至办公室地点应该在哪个等等。一旦团队把时间花在这种辩论上，作为初创公司的“小快灵”的优势也就没有了。


    所以PayPal做到了什么样的程度呢？它们最早的10个工程师全部都是UIUC（伊利诺伊大学香槟分校）毕业的，大家大学上的课程几乎都一样；而最早的5个非技术人员，都是彼得·蒂尔在斯坦福校友网络里的人。这种趋同化的背景，让大家的沟通成本非常低，所以PayPal在早期可以非常快地成长。


    有一句话说，“一个人可以走得更快，一群人可以走得更远”。PayPal早期的这种组建团队的思路，就是在把一个小团队变成好像一个人一样，这样不论行动和思考都可以很快了。


    # |极端聚焦


    第二个理念，是彼得·蒂尔作为PayPal CEO的时候的一个管理哲学。PayPal内部把它叫做“极端聚焦”哲学（Extreme Manager Focus）。


    彼得·蒂尔说，在管理公司的时候，人们经常会问这样的问题：“这是期你的五大工作重点是什么？”或者，“你衡量本季度工作成效的三个最重要的指标是什么？”


    但是彼得·蒂尔认为，这种方式是不对的。因为你一旦开始给自己手头上的事情排优先级，就意味着你的注意力要分散了。所以，他要求PayPal的管理者和员工一次只能专注一件事情。而且他做得很绝对——如果任何员工找他讨论自己那个核心任务以外的的事情，蒂尔都会拒绝讨论。直到那个员工把那个核心任务完成才行。


    而且，在年终总结的时候，蒂尔要求PayPal的员工必须明确写出他们“对公司最有价值的一个贡献”。重点是，只能写一个。


    后来彼得·蒂尔是这么解释他的理念的，他说：人其实是喜欢逃避挑战和困难的一种动物。比如，现在你手头上有两个任务：一个非常难，没有明确答案，但是是一旦解决对公司会有巨大的推动作用；而另一个，答案相对明确，对公司也有一些帮助，但好处没有那么大——这时候，人往往会优先去解决那个有明确答案的问题。一旦解决完了，他会给自己再找一个简单的问题，最后那个非常难但是又非常重要的问题就被搁置了。


    但如果你只有一个任务呢？你就会拼命地、想尽一切办法去解决它。因为你无可逃了。


    蒂尔说：公司如果一直在忽略95分难度的 问题，而一直在解决80或者85分难度的问题的话，那么最终这家公司也就就会是一家七八十分的公司了。


    这种“极端聚焦”的管理理念，不仅让人能集中所有精力专注地完成任务，也能让公司一直去超越自己，不断有更上一层楼的表现。这种理念也为PayPal的成功打下了很坚实的基础。


    # |格局与心胸


    最后一件事情更有意思，是关于彼得·蒂尔和埃隆·马斯克两边团队的战争的。


    之前我们提到，在PayPal和X.com打得最凶的时候，彼得·蒂尔和埃隆·马斯克选择将两家公司合并，然后立刻融资了一亿美元继续向前狂奔。但实际上，这两边的团队，包括蒂尔和马斯克本人，一直有着很多理念的冲突，合作并不是那么一帆风顺。


    首先是彼得·蒂尔先辞职。在那笔一亿美元的融资之后不久，彼得·蒂尔和X.com那边的 intermitt 高管就发生了冲突。因为X.com的高管认为PayPal应该收费，毕竟大家花钱太快了。但彼得·蒂尔觉得一旦收费，公司的速度就会慢下来，这很不利于PayPal的发展。而且，双方有很多其他细微的工作上都不断地冲突，最终为了公司的顺利发展，彼得·蒂尔决定辞职离开PayPal。'
