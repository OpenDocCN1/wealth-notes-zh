  md: '# PayPal | “PayPal黑帮”的神话


    PayPal | “PayPal黑帮” ...


    今天是我们讲PayPal的最后一期。相信通过前面几篇专栏的学习，你已经对PayPal这家公司有了比较深入的了解。我们讲了PayPal的对手、“增长黑客”技术的运用，还讲了网络效应以及它的一些核心理念。但有一个核心的问题，我们一直都没有解答：“PayPal黑帮”到底为什么这么厉害？


    如果你对这个词有点陌生了，我们可以来复习一下：“PayPal黑帮”（PayPal Mafia）指的是当年一帮在PayPal工作过的创始人和早期员工，后来离开PayPal之后在硅谷开枝散叶，又创立了很多人，有巨大影响力的公司。像彼得·蒂尔、埃隆·马斯克、LinkedIn的创始人里德·霍夫曼、Youtube的创始人陈士骏、Yelp的创始人斯托普尔曼等等，都是这样。


    上一次硅谷有这样开枝散叶的公司，还是半导体时代的英特尔或者说仙童公司。所以，PayPal和英特尔到底有什么相似之处，能达到如此的成功呢？


    或者从另一个角度说，彼得·蒂尔还提过一个问题：你们有没有想过，为什么“PayPal黑帮”后来在硅谷又创建了这么多成功的公司，而同一时间成立、后来影响力显得更大的Google，却没有几个员工后来再次创业成功呢？


    今天，我就来回答一下这个问题。在我看来，PayPal和英特尔以及仙童的创业者们能有后来的成功，最重要的在于：他们是真正打过硬仗的人。


    # |初心与目标


    第一，不管是英特尔还是PayPal，它们在创立之初，就给自己设定了一个极其宏大的目标。英特尔的三巨头，上来就是做世界上最重要行业的最重要的公司，后来他们真的做到了；而PayPal的创业故事是这样的：


    上世纪九十年代末，美国市场主流的支付方式还是现金、信用卡和ATM。但是这些支付方式都非常笨重，也很依赖基础设施。而且这些设施往往是在商家端使用，消费者之间的转账非常麻烦，通常要写张支票然后去银行兑现。


    所以，彼得·蒂尔和技术背景的马克斯·列夫琴认为，应该有一种新的支付方式，能让消费者之间非常便捷地转账和支付。


    你肯定知道，金融系统是一个非常庞大、利益方很多的领域，任何没有官方背景的个人创业者想在这个领域创新都是非常艰难的。但是，蒂尔和列夫琴显然觉得还不够。他们不想把业务局限在转账上，而真正想的是：让PayPal成为互联网时代的新货币。


    而且他们觉得，如果所有的货币都能数字化、电子化，那么世界上任何一个地方的人，就可以随时把自己的钱换成更安全的货币，比如美元或者英镑了。尤其是对那些落后的第三世界国家来说，他们的钱可能在很短的时间内就会大幅度贬值，所以他们希望利用PayPal的技术，能让第三世界国家的普通人和穷人很好地保护自己的财产。


    这就是PayPal的初心。彼得·蒂尔后来说：“我认为伟大的公司都会有这样一股使命感，就是那种，如果你不做就没人会做的使命感。这就是PayPal的真正初心。”


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_126_0.png)


    有一件小事可以体现当时PayPal的野心。由于彼得·蒂尔一直在强调PayPal要快速获取用户，扩大自己的网络效应，所以员工肯定就要追踪公司的用户数。当时他们的工程师做了一个小程序，连到了PayPal的数据库里来统计总的用户数，然后显示在每个人的电脑屏幕上。他们还给这个数字起了一个名字——不叫“累计用户数”，也不叫“总用户数”，而是叫做：“统治世界指数”。


    # |目标的力量


    而当你设立了一个如此远大的目标之后，通常有两件事就会发生：


    第一是，非常好的人会开始聚集在你的身边。因为，优秀的人通常是希望解决最大最难的问题的，他们都有巨大的野心。所以PayPal的这种愿景，让它不断召集来了行业最出色的一帮人。而这些人也在日后PayPal极度混乱但又飞速前进的道路上，为公司做出了巨大的贡献。


    如果你能回想起英特尔混乱的创业故事，你就会发现历史总是非常相似。半导体业同样也是变化极快、敌人众多。但英特尔靠着自己公司的声望，以及鲍勃·诺伊斯、戈登·摩尔的品牌，不断招来了行业中最出色的人。最终所有这些英特尔人不[断地克服困难，带领公司一次次绝地逢生。


    另外一件事是：由于你的目标远大，你肯定会给自己树立众多的敌人。所以，从PayPal诞生起，它就是四面楚歌的。当你想成为互联网上的新货币的时候，你的敌人就有：大银行、VISA这种信用卡组织、金融监管机构、地方政府，当然还有竞争对手、顽固的用户，甚至还有想要洗钱的外国黑手党....


    颠覆者总要面临既得利益者和无数明睁暗处的对手的竞争，这就是它们天生注定的命运。


    所以，面对如此困难的局面，PayPal从一开始就有一种强大的生存本能，他们每时每刻想的都是如何活下去。所以，不管后来的与竞争对手合并，还是发动政变更换CEO、和FBI一起打击诈骗犯，或者和eBay官方支持的支付工具作战，只要为了生存，PayPal做什么都可以。而且在这[种极端的生存压力之下，整个团队也形成了一种巨大的相互信任。


    最后，这些真正打过硬仗的人，在被收购之后，带着所学习的所有创业经验和技能，以及壮志未酬的决心，四散到硅谷，开启了自己新的事业。后来，他们就被称为了“PayPal黑帮”。


    # |学习正确的经验


    很多年以后，彼得·蒂尔做过一个非常经典的总结。他说：创业者的人肯定会学到很多经验和方法，但那些经验和方法通常是错的。


    比如，如果一个人 ED 20世纪90年代末创业失败了，他就会想，创业应该现实点，把眼光放低，做一点更容易的东西。因为90年代末正是互联网泡沫的最高峰，人人的梦想都吹得非常大，所以当时的失败反而让他们后来不敢尝试了。


    又比如，如果你是在Google这样一家公司——从开始就几乎一帆风顺，没有遇到过太多生死攸关的问题，那么你学到的经验可能是：创业没什么的，只要做好好做产品就行了。所以出自这样类型的公司的创业者，往往又会低估创业的困难性。


    而像PayPal这样，真正打了无数场硬仗，取得了阶段性的成功，但又没能达成完美结局的公司，才最有可能继续创造辉煌。


    彼得·蒂尔说，最终你会发现：你想实现的梦想，其实往往是在完全不可能和比较容易之间的某个平衡点上——要实现它肯定非常非常困难，但并不是不可能的。如果[你能做好这种准备，你就可以出发出发了。


    张潇雨


