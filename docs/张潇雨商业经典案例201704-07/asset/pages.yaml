  md: '# Netflix | 颠覆式创新的完美案例


    Netflix|颠覆式创新的完美..


    你好，这周我们又要开讲一家新的公司，就是Netflix。


    Netflix的中文名字应该叫网飞，不过这个名字并不太被大家所熟知，所以我们还是使用它的英文名字Netflix。


    Netflix是一家我个人非常喜欢的公司，当然，这个喜欢并不只是因为这几年它们产出了像《纸牌屋》、《女子监狱》这样的精彩的美剧，还因为Netflix在短短20年的历史里——它成立于1997年——给商业世界留下了很多经典案例：比如初期的弱小的Netflix是如何起家的、它是如何在夹缝中生存、还打败了行业霸主百视通（Blockbuster）的、它后来遇到整个行业风向的变化，是如何自如颠覆完成转型的，以及它代表的内容行业是如何变迁的，等等。我一直觉得如果把Netflix这家公司研究透彻，就能够掌握非常多的商业智慧甚至人生道理，所以这周，我们就来一起研究一下Netflix这家一度险临破产、上市的时候估值3亿美元，而如今市值已经超过660亿美元的公司吧。


    之前我们提过几次《创新者的窘境》这本书，这本书是哈佛商学院的教授克莱顿·克里斯坦森的一本经典的商业著作，里面最重要的内容就是阐释了这样一个问题：颠覆式的创新是怎么发生的？或者说，一个创新的小企业是怎样打败大公司的？最后书里总结道，颠覆式创新的发生，最核心的三个步骤就是：


    +   第一，利用颠覆性的新技术；

    第二，提供差异化的产品体验；

    第三，找到属于你的细分小众市场，把产品卖给他们。


    现在回头来看，Netflix在创业初期正是完美地执行了这个理论，从而完成了小公司挑战行业霸主的奇迹。所以今天，我们就讲讲Netflix早期的创业故事。


    # Netflix的起家


    先说说Netflix对颠覆性新技术的利用。


    Netflix成立于1997年，创始人是里德·哈斯廷斯（Reed Hastings）和马克·伦道夫（Marc Randolph）。不过伦道夫后来比较早地离开了公司，而哈斯廷斯担任Netflix的CEO二十年，直到今天。1997年，有两个新技术要改变世界，一个是大家非常熟悉的互联网，而另一个是：DVD终于开始进入民用市场了。在当年的2月份，包括哥伦比亚、米高梅、华纳兄弟、宝丽金等等的几大电影公司，宣布支持DVD格式标准；3月份DVD播放机开始在美国市场正式销售。哈斯廷斯和他的团队感觉这应该是一个机会，于是成立了在网上租赁DVD的公司，这就是Netflix。


    # 困难重重


    说到这里，你可能感觉这是一个完美的商业故事，小企业通过新的技术手段、先进的商业理念、友好的产品和服务体验开始了对大公司的颠覆。然而，如果分析就停在这里，我们就犯了之前说过的“简单归因”，以及没有站在历史的角度去看待商业的错误了。Netflix当然做对了很多事情，但那更多是我们事后诸葛亮式的总结。在当时，它其实现面临着非常多的具体困难，甚至一度濒临破产，后来靠着自己的努力和很多运气才走到了今天。那当时是怎么回事呢？'
