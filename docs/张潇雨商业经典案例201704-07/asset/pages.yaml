  md: '# Netflix | 颠覆式创新的完美案例


    一个人如果没有很多钱，他要做公司，最好从细分领域开始。从满足小众人群出发，再扩大自己的经营范围。这样，可以节省资金。而且，能更好地把握用户的需求，有利于以后的推广。在今天这个时代，一定得出新。市场上，几乎所有的大小领域，都有独角兽公司，即使没有，那些独角兽公司也正在进入。要想活下来，只有创新，出新，才有可能。更重要的是，你在保证自己的产品质量的同时，一定要有变现能力。千万不要说，等我有10万潜在客户，再来变现。你有10万潜在客户，变不了现，那么，你有10万潜在客户，也不可能能变现。


    个人感觉Netflix应该是对《创新者的窘境》里面的颠覆式创新理论——一个小企业要颠覆大公司，应该善于利用颠覆性的新技术、提供差异化的产品体验、找到属于自己的细分市场——的最好诠释。回顾过去和在现实中努力前行以求破局是天壤之别，成功者才有资格回顾。


    从老师选取的留言看，大多数例子都是成功的，很少有失败的，大概是我们身边成熟的产品都是从小众开始逐渐被接爱，最后大众化。而失败的小众一定是被人们忘记了，我记得有一种五指裤，曾经有人穿过，好像还是舶来品，但一直没大众化，不知现在有没有了。直觉应该是小众逆袭失败的案例更多，满雨老师怎么看这种比例关系？


    张满雨


    说的没错，失败的可能性是更大的。不过要注意一点，大部分的失败其实并不是巨头来打你，而是自己没做好而死掉的。换句话说，得像Netflix这样把很多事情都做对了（加上运气因素），巨头才有这个心思过来打你…


    # Netflix | 巨头百视通的致命错误


    百视通让我想到：永远都是自己打败自己。一家企业经营失败了，往往不是因为竞争对手，而是自己犯了太多错，还做慢地不及时改正，继续一错再错，最后收不了手。


    大公司看起来的傲慢，每个人当下表现出来的可能更深刻。父母有时候对孩子的批评，某种某种意义上是对自己的批评；在训骂孩子时候，其实在往往是不敢承认自己曾经或是现在的不足或是做不到。对于社会圈子里自己反感的一些事，总是有一些不屑的态度，讽刺甚至伤害，可能那些讽刺和伤害就是对潜意识的自己的咒骂。人是多面的。大多数人不敢直面自己被咒骂的那一面，当被揭露的时候（在别人身上发生也一样），我们会条件反射地掩饰，证实那些和我无关，对他人的态度就是证明。我想这些都是人的傲慢和不自知造成的，人性总是寻找内心的安全感，却不反观自己，还总是没法掩藏。但掩藏一时掩藏不了一世，当弊端积累久了，这颗毒瘤自然病变，怎么死的呢？就是逃避和自大。uni竟不是每个人都叫乔布斯。


    张满雨


    说得很对。商业皆人性。


    听了这两天的课我有这几Env点感受：1. 颠覆式创新其实并不会频繁地发生在每一个时代。网飞战胜百视通更多的是赶上了互联网这一时代变革的大风口，就像国内的当当打败新华书店一样。倘若不是处在互联网这个时代大背景下，我很难想象网飞或者当当能有什么颠覆性的手段去打败百视通和新华书店；2.
    并不是每个传统行业的大佬都有壮士断腕的魄力去追赶时代浪潮的。所以正像老师说的那样，百视通、新华书店这样的传统大佬一定会顾及自己的门店业务，因而很难在新时代来临的时候完成华丽转身。毕竟像乔布斯这样的商业领袖只是凤毛麟角；3.
    颠覆式创新可遇而不可求，它需要机遇，需要土壤，需要技术支持，简直就是天时地利人和缺一不可。所以颠覆式创新做的好就好像苹果挑翻诺基亚，网飞挑翻百视通，万一做的不如人意……君不见如今满地都是那些千奇百怪的o2o创业企业的尸体……


    马云说：看不见、看不懂、看不起、来不及。大公司最缺的是颠覆自己的认知模式，对新事物首先要及时发现，看懂未来，及时介入。如果百视通成立一个独立部门是否会成功呢？估计也够呛，没有创业环境，从动力上看，新事业负责人拿着高薪怎么能和一扌批创业亡命徒比呢？内部竞争的微信、真实创业环境的阿里妈妈、裂变式创业的苏尼克兹是三种较为成功的模式。不要让新业务肯旧业务的包袱。


    张满雨


    亡命徒这三个字说得好……


    # Netflix | 颠覆者的自我颠覆


    转型，不是一个企业面对的话题。它意味着危机，也存在伤筋动骨的危险和依赖雏鸡的情感。这也是为什么这些成功的转型让我们敬佩的原因。找到自己的问题，打破已有生态链，重塑一个新的商业模式，并发展起来，真的不易。壮士断臂，并且砍掉右臂以后，还能用左臂挣出来绝世武功，实在是值得称赞，譬如杨过，譬如英特尔，譬如Netflix。


    什么是大公司转型？我的理解是这样的：在一个人可以健步如飞的时候主动砍掉自己的一条大腿，替换成一个天知道好不好用的义肢，在伤疤中磨合等待，也许在不久的将来可以轻松打破世界纪录，也许从此只能在轮椅上度过残生。成功了就是时代传奇，失败了就是不死就不会死的典范！


    # Netflix | 把你当作“成年人”的独特文化


    我觉得今天讲的这两点Netflix企业文化中，第一点是第二点的一个重要前提，否则第二点就是天方夜谭。只有招到了能才又好价值观又一致的人，才可以以成年人的方式去管理公司，毕竟有的时候贫穷的人性很容易就战胜了所谓的相互尊重和理解。企业文化：我最近在读的谷歌的《重新定义公司》里，谷歌那种人才之上，尊重每一个创意精英，给他们足够的自由度去发挥和思维的文化，被很多公司影响，也影响了更多之后的公司。


    员工自主决定常薪休假时间和报销物品，这个细节说明公司有很强的文化渗透力。即便是员工离职率较高时，仍然能这么做，说明公司文化价值观是得到主流员工高度认同的。公司减少了一些行政管理制度，用员工高度认同的文化价值观，在员工心里建起的是非荣誉该怎么做、能不能做的群体意识准则，大大提高了效率和团队主动性。公司运营效率和效果极大的获得了提升，把企业文化在公司的力量充分展现了出来。我的一位同学，在德勤博士公司任职，她有吃饭报销的权利，不过，每次她请我们大家吃饭，无论多贵，她从来不升发票，因为她认为这顿饭和公司无太大关系，就不应该该公司报销。这就是文化给员工带来的自律，比制度说教强大百倍。


    # Netflix | 投资价值与公司未来


    公司和人一样，有“初生—发展—繁荣—低谷”这样一个过程，而且总是不断循环往复。人有生老病死，企业也一样，哪有什么基业长青呢？即使历史上幸存下来的企业，也都经历了很大变化。人都要经历生老病死，为什么企业就要基业长青呢？后浪推前浪，一代代更替，才有多样性和生机。在出生与发展期持有，敢于投入，一起成长，在繁荣期及时脱手，拿到收益，不贪求更多，有收益比低谷期没有好，及时止损、动态地看待企业，不妄念企业可以一直活的都好。


    我最大的感受是：不能迷信任何的“百试百灵”，即使是当下相对新兴火热的大数据和云计算以及AI。事情的变化和结构总是自动且复杂变化的，至此'
