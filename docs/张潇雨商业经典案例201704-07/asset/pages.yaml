  md: '# 美国零售简史 | “地产公司”麦当劳？


    昨天我们说了美国零售行业的一家明星公司，Costco（好市多）。说它是明星，不仅仅是因为它业绩好，股价涨得多，更重要的是它把一种新的商业模式发挥到了极致，也给了其他公司很多灵感。关于Costco，我还有一些关键的洞察想要分享给你，不过我们下期的专栏再讲。因为，在讲这些之前我们需要要做一点铺垫。


    今天的专栏，我们做一次大胆的跳跃，来看一家我们都非常熟悉的公司：麦当劳。


    关于麦当劳可讲的东西非常多。今天我们要讲的是：麦当劳到底是通过什么赚钱的。而了解了零售行业的Costco，以及快餐行业的麦当劳，下期的专栏我们就可以把这两个案例合并，去讲解一个重要的商业概念了。


    # | 麦当劳的营收构成


    不知道你是否听过一个说法，“麦当劳其实是一家房地产公司”。这个说法到底对不对呢？我们先看麦当劳的营收构成。


    麦当劳的餐厅门店有两种形式，一种是直营店，一种是特许经营店。直营店就是麦当劳亲自运营的店。比如麦当劳会租下一个地方，装修、进货、培训店员，然后开业卖汉堡等等；而特许经营店则类似于我们们常说的加盟店。


    所谓加盟店，就是麦当劳会寻找加盟商一起和它来开这个店。作为加盟商，你要出前期投资，要出特许权的使用费，还要把一小部分收入分成给麦当劳，而麦当劳会授权你使用它的商标、产品、给你一套标准化的操作流程，等等。


    总结一下，我们会发现：麦当劳的直营店，赚的是商品的差价，也就是和开一个普通餐厅没什么区别。把汉堡和薯条做出，卖给顾客，然后赚取中间的利润，这个模式很好理解。而加盟店呢，赚的是三个部分的钱：


    第一部分是初始保证金，如果想加盟，先要给麦当劳一笔保证金，这笔钱一般不太高。


    第二个部分是授权费，这个部分其实是年度销售额的一个百分比。这个数字在不同地区也不太一样，平均在4.5%左右。也就是说，授权加盟店每年要把店里销售额的4.5%交给麦当劳，作为授权费。


    第三个部分更有意思，是加盟店为麦当劳贡献的大头收入——租金。这相当于麦当劳变成了一个二房东。它会先为一个店选好地址，然后做好前期的各种准备工作，而如果你想要加盟的话，就要从麦当劳那里租这个店面。因为你能拿到的租金和麦当劳能拿到的租金完全不是一个概念，所以麦当劳可以在中间赚一个差价。


    所以，麦当劳整体的收入构成简单说就是两大块：一大块是直营店，赚的就是汉堡薯条可乐这些东西的差价，相当于开餐厅。另一大块是加盟店——这里面每家加盟店卖多少汉堡薯条和麦当劳自己就没关系了，因为麦当劳挣的主要是租金和授权费用，还有一小部分是保证金。


    # | 占比频高的加盟店


    了解了麦当劳的收入构成之后，我们再来看一组数据。看完这组数据你就知道麦当劳真正的商业模式了。先说明一下，下面这组数据来自于麦当劳2016年的年度财务报告里的官方数据。


    第一组数据，是直营店和加盟店分别给麦当劳贡献的收入有多少。


    2016年，麦当劳整体收入是246亿美元，其中直营店有153亿美元，加盟店是93亿美元。也就是说麦当劳的全年收入里，超过60%是直营店带来的，不到40%是加盟店带来的。


    再来看第二组数据，是直营店和加盟店利润的比较。在2016年，直营店的营业利润，基本可以理解成税前利润，是26亿美元左右；而加盟店是76亿美元左右。也就是说，麦当劳的利润里面，有大概3/4都来自加盟店。或者说，虽然加盟店收入占比才40%，但是利润占比却占了大头。


    为什么会这样呢？其实也不难理解。在直营店里面，所有的食品原料、店面租金、人员工资等等，都是要作为成本的，所以扣完这些之后利润也就不高了。而在加盟店里面，这些都是加盟店的店主承担的，麦当劳收的就是租金和授权费。所以利润会非常高。


    而加盟店的收入，一年是93亿美元，这里，租金是61亿美元，授权费是31亿，剩下的1%是保证金。


    | 麦当劳（数据来自2016年年报，金额单位为“百万美元”） | | 占比 |

    | 直营店数量 | 5,669 | 15.3% |

    | 授权加盟店数量 | 31,320 | 84.7% |

    | 总店数 | 36,989 | 100.0% |

    | 直营店收入 | 15,295 | 62.1% |

    | 来自加盟店的收入 | 9,327 | 37.9% |

    | 总收入 | 24,622 | 100.0% |

    | 来自加盟店收入的组成部分： | 9,327 | 100.0% |

    | 租金 | 6,108 | 65.5% |

    | 授权费用 | 3,130 | 33.6% |

    | 初始保证金 | 89 | 1.0% |

    | 直营店营业利润 | 2,596 | 25.4% |

    | 加盟店营业利润 | 7,609 | 74.6% |

    | 总营业利润 | 10,205 | 100.0% |


    说了这么多，就是想说明一件事：你看每年麦当劳，卖那么多汉堡薯条可乐，但它利润来源最大的两个部分，一个是租金，一个是授权费。另外可以提一句，麦当劳现在在全球有37000家店左右，其中有31000家是加盟店。也就是85%的麦当劳都是加盟店。


    # | 麦当劳的租金与品牌


    正因为租金占了麦当劳每年利润的大部分，所以有些人会说，麦当劳其实是一家房地产公司。而且你也知道，麦当劳之所以能赚到租金的差价，是因为它的品牌好、能带动周边的效益甚至地价，而且选址的眼光非常精准。通过麦当劳的选址和后续操作，让地价升值，然后转租给别人，好像这和一个地产商也没什么区别。


    所以，说麦当劳是一家房地产公司到底对不对？我觉得也对也ORE不对。


    对的地方在于，从利润来源看，麦当劳赚的钱确实很大一部分都是来自租金。尤其是麦当劳通过自己的品牌效应，通过自己的眼光，通过自己的谈判能力，一次能签下来二三十年的长约，还能找到好的土地和地段，通过自己标准化的运营再转租出去....这个过程的确有一流地产商的风范了。


    但是从另一个角度说，如果麦当劳没有认真经营自己的汉堡薯条等等产品，没有把自己的品牌做得这么好，不能通过自己给周边区域带来人气的提升和地块的升值，那么也就不会有人和它合作。所以，只有保证了自己的快餐业务，麦当劳这整套商业模式才能玩儿得转，加盟商才会心甘情愿地和麦当劳合作。毕竟，加盟店的利益和麦当劳本身是一致的，大家都是想要赚钱。


    所以，就像我们之前的专栏里提过的，其实麦当劳是不是一家房地产公司并不重要，我们不用去抠着具体的概念。重要的是，通过整个分析的过程，我们又抬一家公司的情形弄明白了，以后你再见到麦当劳的时候，应该就对它有新的理解了。


    不过听说道这儿你可能仍有小小的疑问，就是为什么我们说着美国零售历史，说着Costco，怎么忽然又跳到了麦当劳呢？别急，在明天的专栏里，我会帮你来分析Costco和麦当劳底层非常相似的一个特质，然后给你讲一讲关于企业战略的另一个重要问题。


    张潇雨


    今天给你留个作业：在明天的专栏更新之前，你可以猜一猜Costco和麦当劳究竟有什么样的关系？


