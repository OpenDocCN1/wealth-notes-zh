  md: '# 美国零售简史 | 大型购物中心的出现


    美国零售简史 | 大型购物中心...


    我们今天继续梳理美国零售业的历史。上篇专栏我们讲了美国现代零售业的第二个阶段：从简易的连锁店到超市的诞生，时间基本是在1920年至1950年左右。


    不过由于种种原因，超市暂时还没有迎来它的爆发期。想要真正爆发，还需要二三十年的时间。而在这个阶段里，1950年至1970年，也就是第二次世界大战结束后的二十多年间，另外一个新型的零售业态诞生了，就是：大型购物中心。


    和之前的谬误一样，大型购物中心的诞生背后，也有着非常深刻的社会和商业原因。今天我们就来讲讲，大型购物中心是怎么出现的。


    # 美国社会与大型购物中心的产生


    二战结束后的这二十年，是美国经济大发展的黄金二十年。很多我们现在习以为常的社会规则和生活方式，基本就是在这个时期奠定的。比如人们很喜欢去商场购物，尤其是那种综合性的，包括餐饮、娱乐、电影院等等这些业态的商场，就是在这个时期迅速爆发的。在二战刚刚结束后的1946年，美国一共只有8个购物中心，而到了1970年的時候，这个数字变成了8000。


    我们先来明确一下大型购物中心的概念。历史上第一家大型购物中心是1956年开业的，是美国明尼苏达州的南谷购物中心。它后来也成了现代大型购物中心的经典模板。比起略为寒酸的连锁店和超市，当时的南谷购物中心简直可以说是高端大气：


    这个购物中心是完全封闭式的，有三层结构，内部可以自动控制温度。整个购物中心面积有12万平方米，5200个停车位。除了最基本的零售功能，南谷购物中心还有餐饮、电影院、银行、邮局，甚至小型动物园。里面的装修也非常豪华，包括中庭、喷泉、绿化带、拱形走廊、长椅、艺术壁画......应有尽有。


    这些听起来是不是非常像现在综合购物中心的样子？其实在美国的五六十年前，这个模板已经设立好了。当时，去大型购物中心过周末是非常流行的一种文化。


    那么，大型购物中心为什么会很快出现呢？我们又可以复刍前两天专栏提到的谬误——每一个新的零售业态开始涌现，逐渐代替旧业态的时候，往往都是由于三点：


    +   1. 整个社会进程的改变和经济的波动，带来了新的社会风潮；

    2. 在新形势的影响下，消费者的群体和需求发生了变化；

    3. 一些新技术开始出现，导致满足新需求的方式开始成熟。


    大型购物中心的出现再次验证了这个谬误。所以，二战之后的黄金20年，美国发生了什么呢？


    # 首先，是经济的繁荣。


    在资本主义强国里面，美国是受二战影响最小的国家，而且还通过战争发了不少财。战后，整个美国开始经济大发展，各类新的大企业和大公司开始涌现，美国成为世界第一经济强国，就是在这个阶段发生的。


    # 其次，是社会整体的变化。


    在1954年发生了一件伟大的事情，美国最高法院做出了一个判决：公立学校所实行的种族隔离教育违反了美国宪法。在之后的15年里，美国经历了一个轰轰烈烈的黑人民权运动时期。你最熟悉的应该是1963年，马丁·路德·金发表的那个著名的演讲——《我有一个梦想》。这场运动直到5年后马丁·路德·金遇刺身亡，才算是划下阶段性的句号。


    在这个阶段里，美国黑人的地位逐渐提高，他们也开始大量涌入城市。例如，由于种族隔离制度被废除，黑人学生和白人学生开始混合上学；另外，黑人还引发了一些高犯罪率的问题。所以那个时候，很多白人就像鸟群飞一样，开始离开大都市中心，搬到黑人住不起的郊区，到那里进行子女教育等等。


    后来还有一个专有名词来形容这个现象，叫做 “white flight” ——翻译过来就是“白人群飞”。你看，这么多年过去，种族问题在美国还是没能解决。


    # 上面发生的两件事，就是我们说的：整个社会进程的改变和经济的波动，带来的新的社会风潮。


    那么，在这些新形势的影响下，消费者的群体和需求发生了哪些变化呢？


    # 第一，经济的繁荣，各类企业和公司的涌现，让美国白领和中产阶层的群体迅速开始扩大。1956年，白领工作者的数量第一次超过了蓝领工人；到了1970年，白领群体已占到工作人群众的50%左右，而蓝领减少到了35%。在这个时期，中产阶级和白领群体正式成为了美国经济的主要群体。


    # 第二，由于社会风潮的变化，美国在上世纪50-70年代产生了一个“人口郊区化”的浪潮。这个阶段，很多像医生、律师、大学教师这些群体，为了子女教育等原因都纷纷转移到郊区生活，从1950年到1970年，美国郊区居住人数翻了一番；到了1980年，美国前15大城市里，只有一个休斯敦是郊区人口小于50%的。最夸张的是波士顿，有84%都是郊区人口。


    最后，在大众收入整体开始提高的情况下，整个美国社会的消费心理也发生了变化。以前大家更注重商品的实用性，但从这个阶段开始，人们开始更注重商品的象征意义和炫耀的价值。


    那时候美国整个消费结构都开始发生变化：私家车、私人住宅、家用电器、珠宝首饰等等高档耐用品，包括娱乐方面的追求与享受，开始占据了社会主流。用现在的话说，美国50-70年代，也在经历一个“消费升级”的阶段。


    随着美国经济的繁荣、人口郊区化的趋势，还有人们消费理念和消费方式的转变，需要有新的零售业态来承载这个变化。大型购物中心这种业态应运而生。


    它们功能齐全，能购物、餐饮、休闲、娱乐，比起无聊的连锁店和超市简直有意思多了。甚至当时很多购物中心还举办音乐会、戏剧表演、艺术展览这些社区活动，很好地满足了正在消费升级的消费者们的需求。


    # 促进大型购物中心产生的新技术


    听到这里你应该想了，顺着我们的逻辑：当时有没有什么新的技术，促进了这个社会浪潮呢？


    # 第一个还是我们之前提到的汽车。从1945年至1975年，汽车的数量从不到3000万增长到了1亿多，可以说汽车已经完全成了家庭的必备品。那个时候，开车去购物中心消费、吃饭、娱乐简直是最时尚的休闲活动。很多购物中心也都选址在交通便捷的地方，比如高速公路的交叉口，当然也配备了大片的空地作为停车场。


    # 另外还有一个你现在很熟悉的东西也是在那个阶段发明的，那就是信用卡。1958年的時候，美国运通公司发行了第一张现意义上真正的信用卡——美国运通卡。从那个时候开始，美国就迅速进入了信贷社会的阶段，大家都纷纷开始花未来钱，然后再分期慢慢还掉。人们都觉得这种消费方式是非常先进的。


    除此之外，信用卡还能让购物中心更加了解消费者。比起现金来说，信用卡里面储存着顾客的各种交易数据和交易行为，购物中心可以比较容易地掌握顾客的身分、家庭住址、消费水平、购物的喜好和品位等等相关信息。而且购物中心还能利用这种信息，开展各种促销活动，进一步促进大家的消费。


    于是，在50-70年代，美国进入了一个繁荣的消费阶段，而大型购物中心，正是这个阶段零售业的主角。


    听到这儿，不知道你有没有一种似曾相识的感觉。很多我们现在的消费习惯，以及商家对我们的影响，甚至是所谓的“大数据”分析，在50年前都是有雏形的。一方面，人类社会的确在不断螺旋发展，科技水平越来越高，满足需求的方式也越来越有效率，体验越来越好；另一方面，人类的很多需求都是循环往复的，甚至是不'
