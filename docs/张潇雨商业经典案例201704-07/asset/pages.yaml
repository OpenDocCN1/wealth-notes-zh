    # 苹果 | iPod：主动出击 (7/10)


    思考题：你觉得当今数字音乐行业都有了哪些新的变化？未来会是怎样的呢？


    Apple Music已经按照AppleID订阅方式呈现，一旦订阅可以在你授权AppleID的所有终端使用，歌手会在平台上自行发布和推荐，系统也会按照个人喜好推荐，关键一点是正版！你只需订阅，无需拥有，也是一种断舍离的实现。


    未来的娱乐形式中，音乐的独立性应该会降低，就是说多媒体将是趋势，歌曲应该有色彩，影像甚至AR的组合。歌手是明星的时代会走路，平民即歌手将是大趋势。


    一个明显变化是，明星演唱会线上化，线上演唱会平民化（像直播）。非常想唠叨的是，新浪UC被发明得太早了……


    # 苹果 | iPhone：改变一切 (8/10)


    思考题：你印象里有哪些产品是优点缺点都非常明显的呢？你当时因为什么选择了这个产品？


    划时代产品在诞生时都是不完美的，甚至是脆弱的，火车刚发明的时候时速不到20公里，到现在超级火车时速听说超过一千公里；电灯发明时只能亮几分钟，到现在地夜晚比白天更加璀璨美丽。这从另一个侧面说明诞生时的不完美，更有利于产品的更新升级。


    划时代产品总是要源于一个伟大的梦想，更是诞生于对梦想有着几乎偏执狂的伟大的人之手；划时代产品往往都是颠覆人类生活方式方面的革命性产品，iPhone是个很好的案例教材，配得上这个“价值万亿美元的经验与方法”专栏！


    想买电动汽车这个优点和缺点都明显的产品，总觉得电动汽车还有技术上的突破，一直没下手。


    隔壁王煜全老师说，长板要足够长，才会有来自帮着弥补短板。从小到大常常被教育要谦虚，导致往往的确看到了自己的短板太多，就乱了阵脚，不知所措。


    +   Kindle: 1、非常省电，只有在刷屏的时候才耗电而且耗电也极低；2、没有任何亮度，在太阳底下可以非常方便地阅读，而普通的LCD、LED屏在太阳光下很难阅读；3、显示效果非常接近纸，待机状态下犹如在屏幕底下压了一张报纸。


    +   其缺点包括：1、屏幕非常薄，因此在外力作用下极易损坏，即出现所谓“碎屏”，而“碎屏”的机器，厂家是不予以保修的，只能自费换屏，这也是采用E-ink屏幕的电子书的共同弱点；2、屏幕没有任何亮度，这个既是E-ink屏幕的优点，也是其缺点，因为在日光下它的显示效果非常出色，而在光线差或者完全没有光线的环境下，阅读就变得困难或者完全没法阅读，需要借助其他光源。


    当然，最新的Kindle paperwhite已经通过paperwhite技术，解决了这一问题。此款机器能够在黑暗时，根据阅读者的需要自行打开灯。为什么选择？当然是因为看书方便，电池续航时间长。简直就是出差好伴侣。


    # 苹果 | 乔布斯之死 (9/10)


    这句话说得很好，那些带你走得越远的东西，到了某些时候，就越会反过来限制你。


    最感动我的是乔帮主和遗霜的说话，怀念青春岁月，真想重返当年，可成往事，而悲悯之感。


    有句话叫“向死而生”，把生命的每一天都看成是最后一天。有种死叫“尊严死”，尊重临死者的想法，不再被过度 cum 医疗折磨身心。


    乔布斯把自己最辉煌的一生献给了他最爱的事业，从这个角度说，他是“活”得很有深度！可以说是“向死而生”。最后，他选择和家人一起度过最后平静安详的日子，没有遭受太多的医疗干预，算是“尊严死”。


    有些人，只是“在”这个世界上走了一遭，而不是“活”在这个世界上。乔布斯，是真正“活”在这个世界上一代伟人！


    我的感受是，乔帮主是一个很有幸福感的人。他有信仰，这个信仰让他获得成功，也带走了他的生命。这可能就是“一饮一啄，自有定数”的现实表达。他有一个好的家庭，家人的支持是他努力坚持的原动力。


    所谓生活，也非是两件事，家庭和事业，而乔帮主在这两方面都做到了极致。


    # 苹果 | 结尾与终章 (10/10)


    如果韦恩不同意苹果回购他的股份，苹果有权强制收购吗？


    张潇雨


    这个要看当时具体协议是怎么签了，我猜当时VC才刚有两三年，还没有规定这么具体（纯猜测）。当然现在回购这些条款已经都很清晰了。大家合伙创业的时候常常也不在意，经常是出了事再撕……


    潇雨老师连续两家公司都是以小故事结尾的，非常浩泼，又给商业史这个字面上看起来很严肃的话题注入了一股淡淡的清新和浓烈的人情味。尤其是最后一段，让我对乔布斯有了更多的理解，走在时代前沿的天才有跨越今生的想法是非常自然和谐的。


    +   听了今天的小故事有两点感受，1、以前没注意到苹果内部管理理念这么先进，以公司整体发展为主线确实有利于克服人性的弱点；2、感慨于乔布斯把用户体验做到极致的特点，包括购物体验都成了一个大亮点，听说亚马逊要做线下店时的第一反应是在模仿苹果的线下店的举动……


