    快速地回顾这些重要节点你就会发现，这二十年亚马逊的扩张步骤，加上中间开放的各种服务，打造Prime会员体系，最终形成的一整套“飞轮效应”，最终的指向就是在亚马逊涉及的任何行业，都能达到“多、快、好、省”的“占优策略”，从而实现我们在之前的专栏文章《亚马逊｜终极野心——万“税”帝国》里面提到的，向所有线上线下涉及到互联网活动收税。


    张潇雨


