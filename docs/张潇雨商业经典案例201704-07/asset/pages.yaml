  md: '# 美国零售简史 | 仓储会员超市：Costco的低价与严选


    这周我们继续讲零售行业。稍微回顾一下上周的内容。上周我们的整条主线是美国零售的历史。从19世纪末开始出现的邮购模式，到上世纪20-30年代的简易连锁店，再到30-50年代超市的诞生，然后是50-70年代大型购物中心的兴起。之后从70年代开始，美国进入了滞胀的阶段，所以像沃尔玛这样的大型折扣超市开始爆发了。


    今天的专栏我们顺着这条主线继续讲。时间来到了上世纪80年代，这个阶段里有一家非常重要的公司是肯定绕不过去的，就是在1983年成立的Costco（好市多）。


    关于Costco这家公司，我们应该是这几年才开始熟悉起来的。尤其是近日雷军提到Costco是一家给他启发很大的公司，小米也借鉴了很多它的方法和模式。另外还有一个人也非常喜欢这家公司，就是巴菲特的搭档查理·芒格。他说这是一家他“想带进坟材”的公司，从2000年开始巴菲特和芒格就持有Costco的股票了，一直到现在。


    所以今天我们来把Costco的模式好歹分析一下。


    # 仓储型会员超市


    在详细说Costco之前，我们先来简单介绍一下Costco代表的这种业态，叫做仓储型会员超市。


    所谓仓储型超市，就是超市本身具有两种功能：存储和卖货。这种超市一般利用的都是闲置的仓库或者厂房，再把所有货都堆在里面。不太注重美观，但比较注重实用——这种方式在零售业叫开架式陈列，顾客可以直接选购。


    听过之前一周的专栏，你应该对各种零售业态都有一定概念了。仓储型超市的优点其实还是那么几项：积金便宜、规模大、对供应商可以压价、商品比较全。当然到了上世纪八十年代，像条形码、进销存的管理，也就是采购、入库、销售的动态管理过程，都已经比较成熟了，所以管理起来也比较方便，服务也不错。


    所谓会员超市，就更好理解了。仓储型会员超市是需要购买一个年度的会员才能去消费的，这和亚马逊的Prime会员服务非常类似，区别就是这种超市只对会员开放，或者会员可以带一个朋友去。而在亚马逊，无论你是会不会员，都可以购买。但模式基本是类似的。


    我们刚才提到的Costco，就是仓储型会员超市这种业态的最突出代表。下面我就来说说Costco的神奇之处。


    # 关于Costco的神奇，有这么几组数据：


    过去五年里，在线下零售整体不景气的大环境里，Costco的股价上涨了一倍左右，而沃尔玛只涨了20%；


    过去五十年内，Costco商品的毛利率是可怕的11%。要知道，有能把毛利率降到这个水平，生意还能持续做，这对商业模式和运营效率等各方面要求是非常高的。而在这方面做到极致的沃尔玛，毛利率也有25%；


    Costco的销售额是沃尔玛的1/4，市值是沃尔玛的1/3。但是店的数量只有沃尔玛的1/6，而员工数只是沃尔玛的1/10。


    # Costco商业模式的核心特点


    那Costco商业模式的核心到底是什么呢？有四个方面非常重要。


    # 第一，Costco的利润完全来自于会员费。


    在Costco，只有会员或者会员携带的消费者才能进入消费。而购买一年会员的价格也并不贵——普通会员年费是55美金，高级会员是110美金，但是能享受一年内购买金额的2%的返还，最高返还金额是750美金。所以买得越多就赚回来了。'
