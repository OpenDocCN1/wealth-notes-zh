  md: '# 亚马逊 | 贯穿二十年的长线思考


    亚马逊 | 贯穿二十年的长线...


    上周我们讲了亚马逊这家公司。相信在一周的学习之后，你对亚马逊的业务状况、运营机制和战略规划都有了更深的理解。


    亚马逊这家公司实在是太有意思了，它的CEO杰夫·贝佐斯（Jeff Bezos）的很多思想也非常深刻。可以说，在我的心目中，他和巴菲特在思维深度上的地位是并驾齐驱的，这两个人也是非常好的朋友。


    所以这一周，我们就借助由亚马逊这家神奇的公司和贝佐斯这位伟大的企业家，在商业的理论、洞察与哲学上做多一点的延伸，相信在这周之后你对商业的理解也会有一个新的提高。


    今天，我们要讲的是亚马逊CEO贝佐斯的一个核心理念：长线思考。


    # “长线思考”的代言人


    “长线思考”这个词并不难理解，包括巴菲特在内的很多投资者和企业家也都反复强调过。但是亚马逊这家公司，可以说真正把“长线思考”贯彻到了极致，是“长线思考”的真正代言人。


    有两件事情我印象非常深：


    第一件事情是，这家公司1997年上市，但直到2011年至2012年左右股价才真正开始腾飞，到达了现在的位置。而且，这并不是因为亚马逊在这几年突然找到了什么赚钱的秘方扭亏为盈，而是它之前一直默默地努力耕耘，这么多年都没有变过，只是直到这几年才被人看懂。


    但在这个过程中，亚马逊和贝佐斯没有过任何动摇，一直按照自己的思考和信念做事，才最终取得了今天这样的成就。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_145_0.png)


    第二件事情则更为神奇，在亚马逊这二十年的股东信中，每一封股东信的后面，都附上了1997年亚马逊第一封股东信的文稿拷贝。通过这一举动，这些年贝佐斯在不断地 signalling：你看，二十年来我们一直在反复强调的、一直在做的事情，和1997年的时候没有任何不同。


    甚至1997年的第一封股东信里单独有个章节，说的就是“我们要以长期的眼光经营这家公司”。我摘录几条里面提到的内容，你就能够看出来：


    > “我们要把注意力极度聚焦在我们客户的身上”；


    > “比起短期的利润考量以及华尔街对股价的反应，我们更在意公司长期的领导地位”；


    > “如果必须在公司财务报表的美观和自由现金流之间选择的话，我们会选择自由现金流”；


    > “哪怕一些投资暂时看不到短期回报，但如果长期对公司有益的话，我们也会大胆去做”；


    > “我们会一直保持公司的创新。”


    你看，我们不妨把这些话和亚马逊的经营策略和哲学联系起来，在1997年亚马逊成立的第三年就已经写到了。而后面的二十年，就是贝佐斯和他的团队反复践行自己信仰理念的过程。这就是“长线思考”的真正力量。


    # “长线思考”的关键要素


    那么，在贝佐斯“长线思考”的思维方式里，都有哪些关键要点呢？我看到了三个。


    第一个是贝佐斯反复说过的：要把战略建立在不变的事物上。


    在亚马逊举行的一次行业大会上，贝佐斯说过这么一段话：


    > “我常被问一个问题是，在接下来的10年里，会有什么样的变化？


    但我发现，很少有人问我另外一个问题，在接下来的10年里，什么是不变的？我认为第二个问题比第一个问题更加重要，因为你需要将战略建立在不变的事物上。”


    比如，在亚马逊的零售业务里，我们知道，消费者会想要更低价格的产品，10年以后肯定还是这样；他们想要更快的物流，更多的商品选择，这些东西是永远不变的。你很难想象，会有顾客在10年后跑来和我说，Jeff，我很喜欢亚马逊，但你们的价格能不能贵一点，或者到货时间再慢一点……


    所以，我们就会把精力放在这些不变的东西上。因为我们知道，现在在这方面做的投入，会在10年里持续地、不断地为我们带来益处。所以，如果你投资一个你觉得做的\事情，而10年后它也会变的话，那么它就不是你应该长期的投资。”


    如果能回顾起我们之前讲到的亚马逊的业务，不管是Prime会员服务，还是引入第三方卖家的Marketplace，或者是支持卖家的FBA代发货服务。亚马逊在“多、快、好、省”四个维度上一直持地努力，投入了巨大的资源，堪怕牺牲其他的利益也在所不惜。


    当然，这种执着也收获了巨大的回报。尤其是在这个变化快速的商业世界里，我们经常很容易被变化的东西吸引，而忘记去关注一些不变的东西。贝佐斯的这句“把战略建立在不变的事物上”，可以说不仅是商业智慧，也是一种人生智慧。


    第二个要点更加是人性层面上：想要有长线的眼光和思考，很重要是：要经得住短期的波动和诱惑。


    说明这件事的最好例子就是亚马逊的股价。刚才我们提到，亚马逊这家公司股价的真正腾飞就是最近五六年的事情。而且这家公司很长一段时间都被人们误解——比如大家并不懂一个电商公司为什么要做云服务，也看不懂为什么亚马逊一直在盈利和亏损之间徘徊。而华尔街明星基金出身的贝佐斯，更是知道这种短视行为的危害。


    所以关于亚马逊的股价，贝佐斯反复说过两句很经典的话。第一句是他经常引用的本杰明·格雷厄姆说的一——这个人也是巴菲特在投资方面的老师——他说：“股市从短期来说是投票器，而长期来说是个称重机。”


    这句话就是说，短期来看，股票价格反映的是市场对一只股票阶段性的情绪反应，看好或不看好，觉得应该逃走还是赌一把。不同人的不同判断就会反映在股价上；但从长来看，决定一只股票的价格最终还是取决于公司的分量。好公司的价值自然会高，而差的公司的价值一定会很低。


    所以作为亚马逊的CEO，贝佐斯时常和市场、投资人以及自己的员工反复强调，不用在意一时的股价，而要在意长期的价值。


    在2000年的时候，由于互联网泡沫的破裂，亚马逊的股价跌掉了80%。而贝佐斯在那一年的股东信里写道：“虽然我们的股价跌去了80%，但从我们的业务数据上你可以看出来，亚马逊的业务是前所未有的健康……所以我们现在需要的是，埋头做好自己的事情，让公司变得越来越‘重’。”


    第二句贝佐斯关于股价的话更有意思，他说：“如果你买的股票这个月涨了30%，你不要觉得自己好像聪明了30%似的，因为如果这样，它如果哪天跌了30%，你就觉得自己蠢了30%了。”


    说到这里我又想起了巴菲特的一句很经典的话：如果不想要持有只股票10年，你就不要持有它一分钟。我想，不管是巴菲特还是贝佐斯，他们能在自己的领域里取得如此大的成就，在思想上是有很大的共通之处的。


    贝佐斯最后一个关于“长线思考”的关键点，也是贝佐斯在各种场合反复提到的一句话，“作为企业家，你要甘愿很长时间被别人误解。”因为如果你做的事情所有人都能理解，那么你肯定并没有在创新。


    我在写作商业经典案例专栏的时候，常常会有一种感觉，就是最重要的道理，往往听起来也是最简单的。相信当你在这二周的回顾里，真正读够了亚马逊与贝佐斯'
