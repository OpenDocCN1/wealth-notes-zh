  md: '来越在意健康、有机食品越来越成为风口的时候，Whole Foods却开始增长放缓，在很多战线上节节败退了。实际上，这就是下期专栏里我们要讲的内容——


    “品类杀手”在一个历史特定时期必然有它的优势，但随着时代发展，它ant的很多劣势又开始被放大，然后又被新的业态和更高级的商业模式所替代。这里面除了你能想到的电商的发展，还有一些其他的原因。


