  md: '比如最终成为AWS云服务、FBA物流体系这样的明星服务一开始都是看似与主营业务相悖的。


    那实际上，这个过程就是一个“流动”的过程。因为如果亚马逊只是停留在自己看似非常强的自营电商业务里，可能它在一段时间内能够获得不错的利润，达到一种稳固的平衡态。但随着时间的推进，企业一定会越来越缺乏活力，缺乏创新，最终走向死亡。


    贝佐斯非常清楚“熵”对一个企业的危害，所以他不断远离平衡感，不断把钱、把资源投入到新的领域，不断让企业进入到新的不稳定状态，最终让亚马逊创造出了重量级的明星业务。这就是“流动”的力量。


    而在讲到“超级接口化的公司”、“飞轮效应”包括“亚马逊的终极野心”的时候，其实我们讲的是“开放”这两个字。你还记得我们之前说，贝佐斯的一个思路是，当你把公司内部的业务，打造成一个商业化的对外的服务时，它就要面对市场竞争、不断打磨自己的服务，最终提高自己的核心竞争力。这其实不就是一个开放的系统，不断地和外界交换能量的过程么？


    所以，亚马逊现在的样子，像是一个个既独立又彼此链接着的精密机器，每个模块和接口都可以面对整个世界，独立生长与发展，与外界交换能量；同时它们之间又相互围绕在一起，互相促进，飞快旋转。这一切，都是因为贝佐斯打造了一个抵抗熵增的开放系统。


    讲到这里，我们已经真正来到了亚马逊商业哲学的最底层了。我们再来总结一下这两周的内容。亚马逊到底是怎样的一家公司呢？


    在哲学底层，它的核心理想是“抵抗熵增”。因此，亚马逊一直在打造一个流动与开放的体系；


    在运营层面，亚马逊的方式是最大化“自由现金流”和创造“可选择权”。使得自己能够不断创新，积累优势；


    在治理企业思路的层面，整个亚马逊的指导思想就是四个字：长线思考；


    在具体业务上，由于上面这些思想的指导，亚马逊形成了三大支柱业务：以用户为中心的 Prime 会员服务，开放的 Marketplace 第三方卖家服务，以及创新并且可以长期产生效益的
    AWS 云服务；


    最终在整个企业层面，亚马逊形成了“飞轮效应”，并且达到了博弈论里最佳的“占优策略”。


    最终，亚马逊成为了如今这样一个无孔不入的商业帝国。


    张潇雨


    现在回看这两周的内容，不知道你是不是对亚马逊有了不一样的理解。感谢你这一段时间以来和我的思维一起飞行，这家公司我们就讲到这里。


    如果你有任何想法或者感受，欢迎你来专栏下面留言。也欢迎你把今天这篇有些烧脑的内容分享给你的朋友，我们一起来学习讨论。下期再见。'
