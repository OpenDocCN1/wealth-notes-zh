  md: '# 耐克 | 三件小事


    耐克 | 三件小事


    今天是关于耐克的最后一期。之前我们讲了耐克的前身蓝带体育、耐克的诞生、遇到的困 Govern 及耐克充满挑战的未来。周五，我们照例稍微轻松一下，来讲讲耐克这家公司的三个小故事。


    一是关于耐克的第一批用户，二是耐克的一个经典的鞋款，三是耐克历史上一个非常重要的技术。每个故事在耐克的历史上都是值得书写的一笔。


    # 第一批用户


    不知道你是不是还记得，之前我们讲到锐步（Reebok）通过主打女性用户，逐渐占领市场，反超耐克。后来安德玛（Under Armour）也这么做过，一开始先占领专业健身人士的市场，再逐步打开。这种战略思路，在经典管理学《创新者的窘境》里有非常好的总结。


    如果我们来看耐克的早期历史，会发现历史总是惊人的相似。耐克早期也是靠针对非常垂直细分领域的用户，才开始崛起的。


    菲尔·奈特开始卖第一批代理的鬼冢虎鞋的时候，万先的是当地的体育用品商店。因为大家直觉上都觉得，比比较大的，或者针对的消费者比较杂的渠道可能销量会比较好。但体育用品商店直接拒绝了菲尔·奈特，理由也很冠冕堂皇，就是“这个世界上已经有太多跑步鞋了，不需要更多了。”


    于是菲尔·奈特决定开车去经常举办田径比赛的西北地区，在比赛间隙找田径教练、运动员，以及观众们聊天，一边聊天一边推销他的鞋子。结果由于鬼冢虎的跑鞋确实技术先进，穿着也很舒适，一下受到了专业运动员和教练的欢迎。因为这些人比普通消费者更加识货。


    就这样，鬼冢虎跑鞋在专业群体里一下打开了销路，而且早期全部都是靠口碑传播，菲尔·奈特很快卖出了第一批鞋子，公司开始走上正轨。


    后来，硅谷的创业教父保罗·格雷厄姆（Paul Graham）用一句话总结了这个现象。这里插一句，保罗·格雷厄姆的创业孵化器Y Combinator在之后的专栏里我们也会讲到，这个孵化器在硅谷非常重要。他说：对于一个新产品而言，有100个非常狂热的粉丝，比有10000个觉得你还可以的人好得多。


    这么多年过去了，不管是运动品牌、消费品还是互联网科技产品，道理仍然没有变。


    # 最著名的植入


    第二个故事是关于耐克一款经典的跑鞋。耐克有一个系列叫做Cortez，这个名字有点拗口，不过它另一个更流行的名字，叫“阿甘鞋”，就是电影《阿甘正传》里的那个阿甘。


    你可能知道，《阿甘正传》讲的就是一个跑步者的故事。1994年电影上映的时候，耐克强势植入了广告，阿甘穿的就是这款Cortez鞋。从此这双鞋也叫阿甘鞋了。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_72_0.png)


    这款鞋的来历很有意思。当时菲尔·奈特的合伙人，也是他的长跑教练鲍尔曼，在1966年做出了一个技术上的突破。他把两款不同鞋的鞋底结合在了一起，达成了当时极致的缓震功能，同时也不损失速度。他们就把这个技术发给了鬼冢公司，让他们可以应用在最新款的鞋上。


    1967年这款鞋推出了，鬼冢公司征求菲尔·奈特和鲍尔曼的意见，问他们叫什么比较好。一开始他们选的是“阿兹特克”（Aztec）这个名称，用意是向1968年在墨西哥城举办的奥运会致敬，因为阿兹特克人是墨西哥重要的一个族群。鬼冢公司也很喜欢。结果，阿迪达斯之前有一款鞋叫“阿兹特克黄金”（Aztec
    Gold），于是他们威胁要起诉菲尔·奈特和蓝带体育。


    耐克和阿迪达斯两家公司在之后缠斗了很久，直到现在还是竞争激烈的对手。那次“阿兹特克”事件，应该算是蓝带体育，也就是耐克的前身，第一次直面当时行业的巨头阿迪达斯的威胁。结果鲍尔曼问：“后来是谁打败了阿兹特克人？”


    这其中的历史背景是，14-16世纪存在于墨西哥的古文明阿兹特克人，在1520年左右遭到西班牙科尔特斯人领军入侵，领土很快就被占领了，族人也被杀掉了很多。菲尔·奈特想起了这段故事，他说：“是科尔特斯人（Cortez）。”


    于是鲍尔曼答道：“好的，我们的鞋就叫Cortez了。”


    # Air Max：一种文化现象


    最后一个故事，是关于耐克历史上最重要一个技术Air Max，也就是耐克的气垫技术。


    你可能在大街上或者网上看到过一些耐克的鞋，鞋底的地方有空气充满的一个小装置，这就是Air Max气垫技术。实际上这个技术40年前就发明了。40年来，Air
    Max系列鞋，已经成为一个现象级的系列，也给耐克带来了大量收入。而且，这个技术很酷，是来自美国的太空总署NASA，本来是用在太空上面的。


    当时是20世纪70年代初，一个叫弗兰克·鲁迪（M. Frank Rudy）的前航天工程师，发现他之前给NASA做的技术不仅能用于太空，还能用在地面。只要把这种空气缓冲技术做在鞋底，就可以大大减少地面和脚之间的反作用力，减少冲击和运动伤害。


    他的第一反应是，推荐给行业龙头阿迪达斯。结果阿迪达斯在错过乔丹那个代言人之前，又错过了Air Max技术，真是祸不单行。之后，弗兰克·鲁迪找到第二家公司鬼冢公司，再次被拒绝。直到1977年，他才找到了耐克，见到了菲尔·奈特。


    那是一个春天的早上，弗兰克·鲁迪到耐克开会，他说：“我现在有一个新的技术，可以把空气注入运动鞋里。”菲尔·奈特后来回忆说，他一辈子听了关于鞋子无数的愚蠢建议，这个可能是其中最蠢的一个。


    因为鞋这个产业，在几百年内，技术变革都很少。比如意大利人做皮鞋，很早就达到一个很高的水平，之后的工艺、材料等，都是微小改进。大家也很尊重这种传统。运动鞋也很类似。


    所以听到把空空气打进运动鞋里这个想法时，大多数人都会觉得非常不靠谱。而且当时弗兰克·鲁迪带了一双样板鞋，这双鞋看起来又大又重，鞋底还有一个诡异的加压气囊，一看就让人不想穿。


    不过菲尔·奈特还是愿意尝试一下。他穿着这双鞋出去跑了10公里。回来他说：“虽然还有很多不完善的地方，不过这双鞋真的让我有腾空的感觉。”


    于是，耐克骨子里的那种创新精神再一次发挥了作用。菲尔·奈特决定和鲁迪合作。而弗兰克·鲁迪，也做出了可能是他这一辈子做过的最好的一次决定。他没有要求耐克一次性出钱买断这个技术，而是要求每卖出一双“气垫鞋”，他就获得一小笔专利授权费。


    后来Air Max气垫鞋，成了耐克最畅销的系列之一。


    张潇雨


    这周里，我们一起经历了耐克的诞生、遇到的困难、以及一些延伸的内容。到这里，我们已经讲了英特尔、苹果、皮克斯、迪士尼、耐克五家公司了。


    之前我答应过大家，要讲一讲我研究商业的一些理论。下周我们就开一个小专题“研究商业的关键原则”，来系统讲一讲，研究商业和公司时应该采取的视角、容易犯的错误、以及关键的原则。


    希望你一起多参与学习和讨论。欢迎在专栏后面留言，我们下期再见。'
