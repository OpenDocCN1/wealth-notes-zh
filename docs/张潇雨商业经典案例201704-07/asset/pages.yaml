  md: '# 美国零售简史 | 沃尔玛：价格屠夫重塑美国


    美国零售简史 | 沃尔玛：价...


    今天我们顺着美国零售业的历史，来聊聊一家无论如何也无法绕过的公司：沃尔玛。


    上期专栏里，我们讲了沃尔玛是怎样通过对新技术的利用来打造竞争优势的。今天，我们就来说说沃尔玛的真正核武器，它著名的口号：天天低价。包括沃尔玛到底是怎么做到这一点的，以及“天天低价”对整个美国社会有什么样深远的影响。


    之前我们反复说，在任何时候，消费者对于“低价”的需求是永远不变的。各种零售商也在拼命想各种方式，让自己的商品价格降到最低。在这方面做得极致的，就是沃尔玛。


    # |沃尔玛的“天天低价”


    曾经有很多研究机构研究过沃尔玛的案例，我找到了一些有趣的数字：


    在全美165个城市中，沃尔玛开店后，整个地区商品物价下降了1.5%～3%，物价下降能达到7%～13%；每开一家沃尔玛，5年内，该地区能增加50个就业岗位，但是平均会有4家其他店铺消失；1994年-2004年，美国有29家超市连锁店申请破产，其中有25家在破产声明中说，沃尔玛的直接竞争是主要因素之一。


    上面的数字主要是20世纪90年代末到21世纪初的数字，也就是亚马逊刚刚成立的四五年之内，影响还比较有限的时候。但从这几个数字里，我们就能看到沃尔玛的价格竞争力有多强。


    为了达到这种价格竞争力，沃尔玛可以说无所不用其极。不管是对企业本身，还是对供应商，甚至是对员工，都下手相当狠。


    首先来说对沃尔玛自己。为了降低价格，最重要的是当然是优化自身の運营效率。之前的专栏里我们介绍了，沃尔玛为了优化运营，早年地就买了私人飞机到处巡视，到后来，还建立了自己的私人卫星系统，来监控全国几千家店面的动态。


    另外，沃尔玛会在任何可能的地方节省每一分钱。比如在20世纪90年代初的时候，美国的止汗产品，通常瓶子外都有一个硬纸的包装盒。顾客买到之后，一般都是拆开纸盒，把瓶子取出来，再把纸盒扔掉。沃尔玛观察到这个现象以后就提出不要这个盒子了，因为硬纸盒并不能提升消费者的使用体验，还会占据更多货架空间。运输的时候，额外的重量还会消耗更多燃料，更何况盒子本身也要花钱设计和生产。


    所以，沃尔玛和生产商说，这个盒子不应该要了。后来通过计算发现，去掉这个盒子，每个产品的成本可以降低5美分。于是沃尔玛把这5美分分成了两份：一半给消费者让利，另一半给到了生产商。一两年之后，不管你走到美国哪家超市或者药店去买止汗剂产品的时候，你会发现所有的纸盒都无影无踪了。这就是沃尔玛的力量。


    还有一个小例子可以说明沃尔玛到底有多节省。从沃尔玛成立之初到之后的几十年时间，它们都是这么要求供应商的：要么给沃尔玛设立一个免费电话专线，要么就给沃尔玛报销电话费。因为为了降低运营支出，沃尔玛是不会付这笔钱的。


    事实上，由于沃尔玛的规模非常大，它对上游供应商的控制确实到了一种极致的程度：


    美国曾经有一个自行车厂商叫做哈非（Huffy），20世纪90年代的时候是沃尔玛的一个主要供应商。哈非说，他们在和沃尔玛打交道的过程中，对方的态度就是一句话：“如果你按照我们说的做，按照约定好的时间、地点，把我们需要的产品送来，我们就可以合作。而且我们也会给你的生意带来很大的帮助；但如果你做不到，我们就会把货架腾出来，把机会让给别人。”


    有一次，哈非公司的一款低端自行车卖得特别好，沃尔玛就给它下了一个订单，额度是90万辆。当时两家商量好，对这种入门级的低价自行车，哈非要保证无限量供应，甚至其他那些高档的高利润的，沃尔玛不关心。


    结果这个订单一来，哈非的人就觉得完蛋了。因为他们计算了一下，自己的工厂哪怕加班加点地开工，也只能生产45万辆。这离沃尔玛的要求还有一大截。


    为了满足这个订单，能及时向沃尔玛交付这批车。哈非做出了一个惊人的决定——他们直接把产品的设计图纸发给了竞争对手，说服他们生产自己的车，好为沃尔玛供货。后来哈非的负责人说：“我们不但交出了图纸，还损失了销售额和利润。而且，沃尔玛并没有让我们这么做。但我心里知道，如果辜负了沃尔玛的信任，后果会有多严重。所以我们还是这么做了。”


    这就是沃尔玛对供应商的控制力，也是沃尔玛不断能在非常低的价位源源不断地给消费者提供商品的又一个保证。


    # |沃尔玛低价对美国社会的影响


    沃尔玛对自己的员工也是比较苛刻的。首先，沃尔玛给员工开的工资并不算高，在很多州还可以算是非常低的。


    甚至，沃尔玛历史上还打过几次集体的劳资诉讼案件：有160万现任和前任的沃尔玛女性员工，起诉沃尔玛系统性地压低了她们的工资，并且剥夺了升职的机会。2004年《纽约时报》还在头版文章里揭露了一个沃尔玛的惯例：10%左右的门店都会把员工锁在店里过夜，以便更好地管理门店。当然，后来沃尔玛停止了这种做法。另外，沃尔玛还打过几十起诉讼官司，几乎都是和员工被迫加班有关。


    员工说，他们经常被迫在休息时间工作，或者下班打卡之后被要求返回岗位上接着干，而且没有报酬。这些都是门店经理拼命控制成本的直接产物。


    所以，当我们说沃尔玛通过“天天低价”改变了整个零售行业甚至美国的时候，其实这里面也有很多非常复杂的情结。


    比如，沃尔玛通过不断降低商品价格，使得很多行业的运营方式和效率都有了更大的提高，也为美国社会提高了整体效率。很多供应商都会说，和沃尔玛合作“让自己变成了一家更好的企业”。


    当然，也有一些供应商成为了牺牲品。在《沃尔玛效应》这本书里面，作者提到过一个很经典的例子。当时有一家叫福来喜的泡菜厂商，沃尔玛的一个采购偶然看上了它们一个超大罐的泡菜产品，有接近4升那么大——相当于两个超大瓶可乐那么多。结果，沃尔玛要求福来喜把价格降到3美元以内，基本就是不到行业一半的价格，然后说：“只要你降价到这个水平，我就帮你在全国的沃尔玛铺货。”


    结果，这个大罐的泡菜在全国都卖疯了，然而销量虽然大涨，但是厂商的利润几乎全部被吃掉了。而且，它反过来也重创了整个泡菜行业的产业链，比如厂商们不得不去督促农民们种植更多的黄瓜。但比较可怕的是，这种3美元一大罐的腌黄瓜，并不是市场自己调节的产物——比如今年正好消费者需求旺盛，或者黄瓜赶上了一个丰收年——而是被沃尔玛强行制造出来的。而它被制造出来的原因，仅仅是为了让消费者感受到沃尔玛的“天天低价”。


    最终，福来喜在2001年申请破产。当然这个破产不能完全归结在和沃尔玛的合作上，但是沃尔玛在福来喜垮台阶段所作为也是有所争议的。而这种掏空供应商的利润，或者是破产本地零售小商铺的争议，在整个沃尔玛发展的进程中比比皆是。


    最后，沃尔玛甚至教会了美国人怎么当一个消费者。它改变了人们对“核算”的定义和品质的判断标准：毕竟，当你天天看到沃尔玛里面10块钱一瓶的洗发水的时候，就会觉得15块钱一瓶的感觉有点贵——而沃尔玛正利用了这种人性，在无数领域里都充当了价格屠夫的角色。


    它最终的诉求就是，来到沃尔玛你是绝对放心，不用再去比价的。因为它们这里的东西一定最便宜。不知道说到这儿，你有没有感觉到后来这些打法，全部被一个叫亚马逊的公司学走了。


    张潇雨'
