  md: '# 周末互动 I 《商业经典案例课》在干什么？


    周末互动 I 《商业经典案例... ↓


    # 小师弟,你好


    欢迎来到《商业经典案例课》，我是张潇雨。


    我们两周关于亚马逊这家公司的课程算是说完了，希望你听得过瘾。我确实花了很多心血来理解亚马逊这家公司，可以说不仅你们觉得有收获，我在这个过程里也受益很多。所以在这一周的周末互动里，我想我们可以一起来重新回顾一下，《商业经典案例课》的使命到底是什么，我们到底在做一件什么事。也算是在你们跟着我的思维飞行了好长一段时间之后，一个小的总结。


    我们之前的专栏提到，贝佐斯说曾经有一个斯坦福大学的女生问他：我有100股亚马逊的股票，我到底拥有的是什么？我 مغ可以借用一下这个概念，就是：当你订阅了一个《商业经典案例课》，你订阅的到底是什么？


    我觉得，我们一起在做的，是三件事。


    # 第一件事，给商业祛魅。


    祛魅这个词是个外来词，是德国著名的社会学家、经济学家和哲学家马克思·韦伯提出的一个词，在当代社会的语境里面，它基本是说对一件事情的神祕性、神圣性的消除和消解。说得简单一点，其实是让大家来领略真实的商业是怎么样的。因为对于商业、对于公司、对于大企业家，我们在很远的地方站着观看的时候，总有各种幻
    Membuat，觉得商业特别神秘，或者特别宏大，那些大企业家都特别高深等等。


    这些想象当然有它的道理，但我想做的，是给你展现它们同样非常普通和平常的部分：


    +   比如亚马逊业务确实很厉害，但它也是这20多年一步一步走过来的，中间也犯过很多错误，也经常被人误解；

    比如贝佐斯确实思想非常深刻，但他也是读了很多书，慢慢建立的自己的思考体系。

    另外可以告诉你一个他和乔布斯最大的相同点——那就是——他们都得过肾结石。所以美国有评论说，现在能阻止亚马逊的只有一颗小石头了。


    当然这是开玩笑，但企业家也是凡人，也是一步一步走到现在的。另外，听了两周亚马逊的专栏之后，你再看这家公司，你的眼光和角度就再也不一样了。比如前一阵亚马逊在搞Prime会员的会员日，有各种福利和活动，原来你看这个东西，只会把它想象成一个促销，但是现在不一样了，你知道了亚马逊为什么要对会员这么好，会员作为飞轮效应的引擎有多重要。我觉得这就是这个专栏的使命。这也是一个还原真实的商业，给它祛魅的一个过程。


    # 第二件事，穿透商业，看到它最底层的 人性和哲学。


    其实在发刊词里我也说过，商业的有趣之处在于，人性是不变的，商业最本质的道理也经常是不变的。


    我们之前讲《乔布斯之死》的那期专栏，很多同学留言说自己都哭了，这应该是自己订阅过的第一个看哭了的专栏，为什么？这不是我多厉害，而是人性本身就是很打动人的。我们还讲哲学，比如亚马逊的“反熵”，这是一个物理概念，后来被引入了企业界和管理学界。每当你看到，物理学和管理学思想的相通，贝佐斯和任正非思想的相通，商业和生活的相通，你一定有一种洞察本质的喜悦。这就是一个从表层走向底层的过程，这也是研究商业的时候最有趣的一个过程。


    # 最后一件事，当你订阅了这个专栏的时候，其实你是在帮助自己感受一些最本质的人生道理。


    注意，这里我用的词是“感受”，不是“学习”、不是“体会”，甚至都不是“理解”，而是，感受。


    我来举个例子。如果ridium绵琢磨一下，这周我们的三篇专栏：


    +   《长线思考》那一篇，其实我们讲的就是，在生活中，我们要敢于用长线的眼光和心态做事；

    《战略》那一篇，其实我们讲的就是，做事要有所以有所不为；

    而《反熵》那一篇，其实我们讲的就是，做人不 要固步自封，要开放。


    长线的眼光，有所为有所不为，要开放不要固步自封，其实都是非常简单，非常本质，誰都会说 的一些道理。你可能已经在无数地方听无数人讲了无数遍了。但是你为什么没有真正去把它融入到你的生活
    里呢？是因为，道埋你记住了，但你没有真正感受到它们。因为你听到的时候，它们是轻飘飘的，是随便说出来的，是没有分量的，所以你 是不会听进去的。


    所以我在做一件什么事呢？其实就是，我在用非常精彩的故事，各种跌宕起伏的剧情，还有真实又复杂的商业案例，来反复给你讲一些最简单，最本质的道理。比如：


    # 什么是长线的眼光？我用贝佐斯1997年和2017年，间隔长达20年但又好像一模一样 的股东信来告诉你。


    # 什么是有所为有所不为？我用亚马逊20多年的扩张路线和业务取舍，还有它们那么多年被各种人的误解，反复讲给你。


    # 什么是不 要固步自封，要开放？我通过亚马逊看似不同，但是底层逻辑又完全相通的几大区块链，展现给你。


    其实这些道理我们都 知道，而且世间的真理也就那么多，但我们真正要做的，是感受它们。感受很多时候是超越知道，超越理解，超越你的理性思维的。感受是直达灵魂深处的一个过程。有了这些难忘的感受之后，我们就可以带着这种感受去继续地学习，逐渐地改变我们的生活了。我觉得这才是这个专栏的终极使命。


    好了，这就是这两周亚马逊的专栏的结尾了。感谢你一直跟着我的思维飞行，我讲完亚马逊也是长叹一口气，感觉完成了一个大任务。下周开始，我们可以稍微换一换节奏，聊点稍微轻松的内容，让那些很底层的哲学先在潜意识里生长和发酵一会儿。所以接下来我们会讲一讲零售业，当然这也和亚马逊有关系，不过我们切入的角度是历史。欢迎到时候继续来收听。


    # —— 本周留坑精选 ——


    # 亚马逊 | 贝佐斯真正的核心哲学——反熵


    亚马逊的商业逻辑是个三层倒金字塔结构，底层是对抗熵增的开放与流 动哲学，中间是“自由现金流”和“可选择权”两大战略，最上面是Prime会员服务、Marketplace第三方服务、AWS云服务三大服务。也可以用曾鸣教授为的未来商业的网络协同和智能数据“双轮驱动”解释。亚马逊的Prime会员服务是“网络协同”。（据报道，会员人数将超过订阅有线或卫星电视服务的人数，目前已有7900万。）Marketplace第三方卖家服务以及AWS云服务是“智能数据”，实现精准服务，反过来又增进会员价值，不断转动前进。


    “可选择权”和“反熵”的概念可以结合在一起看作为贝佐斯个人的商业哲学，是建立商业理念、发展战略、经营策略的根本，也是由理念、战略、策略抽象形成的商业逻辑。从商业行为抽象成逻辑，再从逻辑升华成哲学思考，需要极高的个人修为（突然觉得贝佐斯光亮脑袋极具禅意）。查阅了一些资料后发现“熵与反熵”的概念也常被运用在计算机、通信科学等领域。原来真正的大师都是跨界高手和博学通才。学习专栏到现在，亚马逊是体系最完整、干货最多、维度最广、思考最深、角度最新的案例，也是我自己反恩最多、笔记做得最多的案例。希望张老师在今后的案例当中可以沿着亚马逊的剖创思路带给我们更多的反思。


