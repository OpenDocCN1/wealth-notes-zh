    # 耐克 | 真正诞生


    前几天看了一个报道，说王健林总结万达模式就是，长期稳定的现金流模式。长期、稳定、现金流，缺一不可。


    我就有感想，现金流模式能把企业规模做大，哪怕利润低甚至不盈利（像之前的亚马逊）。然后规模上去了，就做“空手套”生意，意思是“万达”两个字已经会有人和你合作开酒店，待建承建，代销。


    徐小平老师说，现金就像库存，是件不好的东西，它让公司缺少狼性。也可能是因为缺钱，耐克才活到了今天？是不是老师！


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_74_0.png)


    # 张潇雨


    其实我这么说我还真有点同意。或者说，连这么困难都没有放弃，说明真的是有很大的决心想做好。


    作为资深的家装行业的一员，我可以很自信地说家装是个现金流很好的行业。家装行业在此前很长的时间内都属于低关注的行业。但是随着近几年经济形势的低迷，家装行业低风险、现金流充裕的特点很容易就被资本市场所青睐。


    另外，虽然家装行业的竞争目前比较激烈，但是这个行业总体上还是不成熟的。家装公司上市也很不容易。家装市场虽被公认为是个万亿规模的行业，但是目前这个行业的佼佼者每年也才几十亿的销售额，上市企业也才几十亿的市值。可观这个行业对家装企业来说成长空间是非常大的。


    再加上家装行业还是属于民生行业，市场需求始终是有保障的，所以即使在经济形势不景气的背景下，依然有资本愿意进入这个领域也就惊奇了。当然，家装作为很多领域的接口也是它的卖点之一，比如智能家居等等。


    Tesla去年合并Solar city，今年关掉Solar city在加州的site，并入纽约工厂，很大程度上应该是出于成本的考虑。2003年WDC在可以qualify
    Read-rite的产品时玩拖延战术，以致使对方资金链断裂，以白菜价收购了对方，由此走上了和希捷分庭抗礼之路。


    这是现在听到的最真实的一个公司成长史，没有光环，没有神话，每一步都跌跌撞撞，一路走来非常不容易。关于名字，关于logo，关于鞋盒颜色，当然每件事都能在事后被修饰成一个个故事，然而这一个个真实的事件的感染力是无与伦比的，一个真实生活的还原。


    缺钱是我见到周围创业公司的常态，一般只有半年的周转资金，做事总是捉襟见肘。当然也有例外，拿着钱都找不到花的地方的幸运公司也见过。其中的酸甜苦辣非常人所能想象，耐克从一家这样的公司一步步成长为一个世界级影响深远的公司本身就非常励志。


    # 耐克 | 两个里程碑


    # 偶然?


    乔丹的例子让我想到索尼唱片公司签约另一个巨星迈克尔·杰克逊，惊世骇俗的眼光才有如此高回报，销售额翻了十倍。安德玛从健身身家又签约库里，也造就了安德玛的崛起。


    近些年中国市场最印象深刻的代言，就是聚美优品陈欧的“我为自己代言”。第一版广告的每一字每一句都深深地敲在了80后的心上，产生共鸣。成为当时红极一时的“陈欧体”。与其说陈欧表达的是聚美优品的形象和他个人的理念，不如说，这个广告在当时是为80后代言，真是看得人感动万分、热血沸腾。但是，聚美近几年经营得不好，真是一个遗憾。


    农夫山泉有点甜，其实和很多水一样。但光这一条就已经在瓶装水市场获得成功！


    明星代言广告最早有记录的，恐怕应该是《战国策·燕策》里的一则故事：有一个卖骏马的人，接连三天守候在市埸里，也无人问津。卖马人很着急，于是去见伯乐，说：“我有一匹骏马，想卖掉它，可是接连三天守候在集市里，也没有哪个人来问一下，希望先生能看着我的马看一下，离开时还回头看它一下，这样我愿意奉送给你一天的费用。”


    伯乐答应了，真的来到集市，依言固绕着马转了几圈，离开时还回头再看了一眼。结果马不仅卖了，而且马价还暴涨十倍。看得出卖马人颇有商业头脑，十分了解“名人效应”的作用，仅花一天的劳务费，便请到当时的相马专家伯乐，实现卖掉马的商业目的，这也是开了名人参与商业行为拿“出场费”的先河。


    聚美优品陈欧，为自己代言。当年他的代言非常具有话题性，主要是他身上集结了很多矛盾引起了大家关注。比如男生创业做化妆品，名校生回国创业等等。


    当然在他之后，也有很多人企业老板也站出来为自己的品牌代言，比如小米、格力。也可以说是创了一种新风潮吧。


    # 耐克 | 女士香烟旧史与耐克的最新困局


    今天我想到了一个词“顺势而为”，但凡经典的广告创意也好，还是因为抓住热点，将公司带入巅峰也罢，都是顺应了当下的潮流。从点看，商业史和国家兴亡史还真的有点曲同工之妙，小一点就是企业，大一点就是国家罢了。


    说到潮流对自己的影响还是很显而易见的，比如淘宝硬生生造出了光棍节（狂欢购物节），自己也 g 能幸免地在双十一当天买买买。我很赞同“学习商业本质上就是学习生活本身”，我们不是通过商业的学习，让自己规避哪些风险，而是让自己能过好自己精彩的生活。


    今天的专栏从文化的角度分析了与商业策略以及营销公关的作用。结合社会思潮利用大家的从众心理固然可以对顾客的行为进行控制，但是不能做到持久。


    最经典的一个ted演讲者Simon曾经说，真正可以持久的是让顾客认同你所相信的，他们买的是你的belief而不是仅仅是product，这样才能培养顾客忠诚度。所以Nike虽然没赶上或者说落后了这一波，但它培养的顾客忠诚度完全可以让它度过这一波的低迷，迎来下一波的高潮。


    从某种程度上说，商业发展的历史就是近代以来人类演化的历史。所以非常喜欢老师新的跨界结合，这对大家视野的拓展都非常有帮助。


    关乎思考题：最近英国流行起了一个极其无聊的小玩具，也没有什么科技含量，叫fidget spinner，卖得很火，《金融时报》也对此进行了报道。不知这个东西到底有何好玩的，但或许就是从众心理，小孩子想拥有。我也想到了我小的时候，从总橡球到陀螺出一款玩具买一款，其实也不是自己有多爱，就是因为别人有。


    想到了著名的品牌研究者Douglas Holt在《品牌如何成为偶像》这本书中提到的，品牌的价值源于其通过品牌概念的展现缓解民族文化冲突的能力。


    在20世纪60年代后期，民权运动和失败的越战撕碎了美国内部原有的民族团结，当时的可口可乐创作为了“我想让世界学会歌唱，人 们和谐欢畅”为核心的经典广告语。这个编制民族团结、修补美国公民身份的概念直接让可口可乐成为了美国的标志。


    可口可乐在那个时代的流行与女性香烟和运动时尚风的崛起有着相同的底层逻辑，它们都触及了社会深层的文化冲突。'
