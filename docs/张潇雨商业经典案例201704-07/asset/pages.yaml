  md: '# 苹果 | iPhone：改变一切（8/10）


    经过前面漫长的旅程，我们终于要讲到苹果 Innen最... iPhone 。在我心中，iPhone 的意义就是四个字——改变一切。


    # 改变一切


    “改变一切”可能是很大的一个帽子，没有几个人或者产品能担得起这个称号。但对于iPhone来说，这个称号可以说实至名归。


    iPhone给我们带来的改变至少是两个层面的。首先，iPhone改变了手机的定义。如果你在2007年iPhone推出之前，世界是诺基亚、摩托罗拉和黑莓时代，但iPhone推出以后，整个世界对“智能手机”这四个字的理解完全不同了。下图是iPhone推出前后，手机外观的对比。你会发现这十年的手机，长得样子都差不多，这是非常惊人的影响。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_31_0.png)


    另一个层面上，由于iPhone的兴起，人类真正来到了“移动互联” 时代，各种建立在手机上的信息、服务、App等等，可以说重新塑造了我们的生活。包括你现在能够听到或者看到这个专栏，都要拜iPhone和苹果所赐。从这个角度讲，iPhone的确是改变了一切的。


    所以今天，我们就来讲讲iPhone诞生的故事，和它带给我们的两个启示，分别是：第一，伟大的产品往往不是一蹴而就的；第二，伟大的产品可以有明显的缺陷，但要有更突出的优点。


    # 厚积薄发


    我们先说第一条，伟大的产品往往不是一蹴而就的。之所以这么说是因为，iPhone当时使用了非常多具有突破性的技术和设计，但大多数都是之前就存在的，很少是临时发明或者发现的。而乔布斯最伟大的地方，在于把它们巧妙地组合在了一起。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_31_1.png)


    这个玻璃的产品名称叫“金刚玻璃”，是一个叫康宁的公司（Corning Glass）生产...但实际上，这个金刚玻璃的技术是50年前，也就是20世纪60年代的。...


    # 瑕不掩瑜


    另外一个启示，刚才也提到过，就是，伟大的产品可以有明显的缺陷，但优点足够突出才可以。


    其实回想一下，第一代iPhone有很多在当时匪夷所思的缺陷。比如，电池最多就能用一天，而且有问题了还不能拆卸；产品比较脆弱，稍微摔两次就碎了，别说第一代iPhone了，十年之后的iPhone还会...等等。'
