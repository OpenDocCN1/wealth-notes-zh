  md: '# 携程 | 创造奇迹的团队


    携程 | 创造奇迹的团队


    这周我们要讲的公司是携程。相信携程这家公司，你一定很熟悉。应该说在国内的旅游领域，携程是当之无愧的老 현실，正是在合并了“去哪儿”之后更是稳坐第一。当然，携程这家公司也出现过不少问题，曾经被消费者各种吐槽。总之，这京是一个你并不陌生的公司。


    但是，很多人并不知道，携程这家公司有着非常神奇的历史。从某种程度上来说，它是中国互联网历史上的一个奇迹，对后人也有着非常重要的启发式的意义。


    今天，我们就来šiu說，携程这家公司的重要历史地位，以及创造这段奇迹的四个人。


    # 携程奇迹


    说携程是中国互联网历史上的一个奇迹，主要在于三个方面：


    首先，和我们之前提到过的英特尔、苹果、耐克这些公司不同，携程是一个“命題作文”的产物。所谓命题作文，是说携程涉及的旅游领域，并不是创始人自己之前积累了很多年的专业所在，或者是有着非常强烈的兴趣，而更多是看到了互联网发展的大潮，然后顺势而为创建的一家公司。


    我们常说不要为了创业而创业，但携程好像是反其道而行之的。而且从1999年6月创立，到2003年12月在纳斯达克上市，携程的上市之路仅用了四年。而且，这还是在互联网的寒冬期做到的。正因为这种“命题作文”式的成功，他们的经验更值得我们借鉴。


    第二点更有些神奇色彩，携程的团队接连打造了两家成功的企业。硅谷有一句话叫“一次是你运气好，两次才是真的实力。”说的就是，很多 人由于时势、运气等等偶然因素，能做出一家很成功的公司，但他们自己都无法重复自己的成就。


    携程的创始人却做到了。携程孵化的经济酒店品牌如家，在携程的联合创始人季琦的带领下，同样是从2002年创立，再到2006年10月在纳斯达克上市，也是花了四年时间。八年做到两家纳斯达克上市公司，可以称得上是一种奇迹了。


    最后一點可能更值得敬佩。携程的四位创始人：季琦、梁建章、范敏、沈南鹏，不但聚在一起做出了 一家成功的公司，在公司成功之后的生活也非常精彩。


    季琦后来又创办了汉庭，到现在已经发展成国内领先的华住酒店集团了；梁建章创业成功之后去美国斯坦福大学攻读了经济学博士学位，师从诺贝尔经济学奖获得者Gary Becker，在人口学方面有着很深的造诣；范敏一直成功地带领携程成长，直到梁建章回来后重新担任CEO执掌携程；而沈南鹏则成为了中国最成功的风险投资人之一，也是全世界最好的VC红杉资本的中国区的掌门人。


    这四位创业者，不仅做出了成功上市的企业，还以各种方式不断为中国互联网界做着贡献，这是更值得敬佩和学习的。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_89_0.png)


    # 组建超级团队


    所以，这四个人组成的到底是怎样一个超级团队，完成了如此不可思议的成就呢？接下来我们就来说讲携程四位创始人的故事。


    如果现在来看携程的创始团队，你会有两个非常深刻的印象。一是，这个团队是真正豪华的阵容，每个创始人的背景都非常过硬；二是，这四个人在一起，产生了一种惊人的化学反应，促成了非常好的合作。


    这种化学反应不是一种激情的、热烈的、槽冲直撞的状态，而是内敛的、彼此信任的、非常宽容和成熟的关系。孔子说：君子和而不同。在我看来，这正是携程的四位创始人达到的境界。


    我来讲解携程早期创立的故事和这几个人的背景，你就能明白其中的道理了。


    发起这次创业旅程的是季琦和梁建章。1999年，互联网热潮席卷整个世界。和如今智能手机爆发之后出现的创业潮简直一模一样，不管是地铁车厢、街头巷尾还是酒吧茶馆，你总能听见大家要建个网站。季琦和梁建章也第一次有了做一个网站的想法。


    背景上，季琦是个普通农民家庭的孩子。考到上海交通大学之后，他没有走常规的职业路线，而是受到了当时经商潮流的感召，成为了一一个卖电脑的专业户。上世纪九十年代初期，正是计算机在中国普及的开端。季琦抓住了这个机会，迅速成为了交大校园里骑着三轮车拉着电脑送来送去的一员，很快在几个月的时间里就赚到了几万块钱。


    梁建章则不太需要通过卖电脑来获得人生价值的实现。他从小就有一個著名的绰号：大头神童。13岁那年他就利用电脑写了一个作诗的程序，被上海电视台报道；15岁的时候他跳过高中，直接进入复旦大学少年班。一年后他考入佐治亚理工学院学习计算机，很快就读到了硕士。后来顺利地进入了美国的甲骨文公司工作。


    如果你还记得我们之前讲过的德鲁克对公司核心团队架构的解读（推荐阅读：4月26日《英特尔 | 伟大又微妙的三巨头》），你会发现早早开始创业的季琦是那个开创者和行动者，而内敛、沉稳、理性又总爱用数字说话的梁建章是那个思想者。这两个人虽然背景不同，但对一件事是有着高度的共识的。那就是互联网最大的机会应该是在中国。


    在有了创立一家网站的想法后，在那个风险投资还不盛行的时代，他们的第一反应是，应该再找一个有资金的人。这时候他们想起了一个共同好友，他是季琦的大学同届，又和梁建章在美国相识。这个人就是，后来成为中国最重要的投资人之一的沈南鹏。


    比起另外两个人，沈南鹏的背景毫不逊色。他中学的时候就获得过全国数学竞赛一等奖，后来进入了上海交通大学应用数学系学习。毕业后又考入美国哥伦比亚大学数学系。但很快他就觉得自己并没有真正的数学天赋，更多是靠刻苦地做题和训练取得成绩。


    于是沈南鹏很快从哥伦比亚大学的数学系退学，不久后就出现在了耶鲁大学的商学院里。毕业之后，他成为了中国最早一批进入美国华尔街的金融从业者，在花旗银行开启了他传奇的职业生涯。


    沈南鹏在美国也早就感受到了互联网来临的大潮，所以当前面两个人找到他的时候，他迅速就答应了一起创建公司的提议。于是，梁建章和季琦各出了20万元，各占股30%，沈南鹏出资60万，占股40%，携程旅游网就这么成立了。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_89_1.png)


    就像一个超级英雄团队一样，在季琦、梁建章和沈南鹏组队之后，你觉得这个团队还缺一个怎样的拼图呢？没错，他们当时也意识到了，虽然三个人性格和背景都非常互补，但团队里缺一个真正懂旅游的人。


    范敏就是他们的答案。1965年出生的他是四个人里年纪最大，也是最低调的。他也是上海交通大学的学生。研究生毕业后加入了上海的老牌国企新亚集团，逐渐成长为新亚集团旗下上海大圩饭店的总经理。


    一次偶然的机会，季琦听说了范敏这个人，发现他交大毕业，做过旅行社，还在瑞士进修过酒店管理，觉得这就是他们要找的人。经过无数次的软磨硬泡，范敏心里的激情终于被唤醒，答应一起参与这次创业。


    之所以要花如此的篇幅介绍每个人的背景，是因为这里面有一个很简单但又很重要的道理。那就是：很多时候加入一个好的团队，和优秀的人一起工作，可能比自己'
