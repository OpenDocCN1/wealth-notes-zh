    # 美国零售简史 | 大型购物中心的出现


    今天的购物中心，以体验式业态为主（因为实体零售正受到电商冲击）。同时，今天的shopping mall，因为数量很多（甚至有些供过于求），竞争激烈，都要有一个主力业态，如：室内滑雪场、主题乐园等，作为吸引客群的卖点。


    [1] 注重把人留下来。现在的购物中心都在想方设法把人留下来。无论是通过特色餐饮、独特品牌、大型超市的引入来满足传统需要，还是建立电影院、溜冰场、健身房、展览区等来挖掘人们新的需求，这些方法都在努力放慢人们的脚步。特别是近年来，新的综合商场在设计时都安排了极大的公共空间，典型案例就是北京的颐堤港和芳草地。与传统长安商场、双安商场那种一个格子挨一个格子的设计不同，新商场的公共空间让人
    sob things，更愿意把逛商场的公共空间作为一种享受，而不是简单地穿梭在品牌店的小隔间中。[2] 注重孩子的需求。与欧美的商场不同，现在绝大多数商场都开始增加婴幼儿早教、青少年培训等服务，通过抓住青少年的需求，让家长不得不来到购物中心，从而吸引和激发更大的购物欲。在通过挖掘大人刚需受困的同时，满足孩子的需求，自然也能把大人带过来。[3]
    更加注重体验。很多人到商场，就是想在视觉之外来体验不同的产品。无论是衣服的材质，还是科技产品的效果，这些多维度的感知体验有助于大家做是否购买的决策。特别是苹果的体验店、无印良品、优衣库等，它们的实体店更多的就是提供各种各样的体验，至于顾客是在实体店下单还是回到网上，感觉店家并不太关心。[4]
    未来的购物中心，或者说是休闲中心一定是与各种新技术紧密结合的。其核心的目的往往不是卖产品，而是满足人们在公共空间相处，能够使用廉价的方式，体会到技术带来的幸福感和快感。


    第一个感受是，现在购物中心尤其是CBD的购物中心，餐饮店的占比在不断上升，而受电商的分流，服装类的店铺比例持续下降，而且很多服装类店铺的展示功能已经超过销售功能。第二个感受是，中小型购物中心的密度越来越高，比如我所在的深圳福田区，中心地段的密集度甚至可以达到每一到两站地铁就有一個购物中心，而这些购物中心主要还是以餐饮类店铺为主，这和当代都市白领的消费习惯相符。前几年很火热的那种以服装消费为主的百货公司，则越来越萧条。第三个感受是，购物中心在商铺类型的引入方面，开始注重文化。西西弗这类“新型书店”成了每个商场的标配，很多商场以超低租金招揽这些商铺，主要这些商铺销售图书商品。


    # 美国零售简史 | 从连锁小店到超市诞生


    想到了最近罗辑思维栏目中，罗胖讲的液晶产业变迁，也是不断产业升级循环：新的液晶技术出现->行业大量投资和生产->需求过剩->厂商开始缩减这轮投资->研发新的技术，再从头开始继续循环，不断升级推动了液晶技术的迅猛发展。


    制造业的起源是家庭小作坊式的生产，随着市场的完全竞争逐渐放开，小规模的量产已经不能很好地满足市场供给，于是厂商开始提高规模和效率，并搬迁到租金比较便宜的郊区，又随着市场需求的多元化和中产阶级的需求升级，大量加工厂开始思考品牌化经营，于是开始设置体验店或商场专卖店，制定战略规划，这个过程和零售业的发展路径非常相似。


    从互联网到移动互联网其实也遵循着这么一个逻辑，首先技术层面，智能手机和pad的发展以及基础设施的不断完善，使得人们越来越开始在指尖完成一些日常的事务。其次，随着社会节奏的加快，人们对于时间的看法发生了重大的变化，移动互联网技术为人们刻下了大把的时间，满足了人们对于时间的需求。最后，移动互联网又加强了随时随地网络协同和数据智能的目标，为人们提供更快更好更精准的服务。


    管理领域也有类似的进程。从马斯洛的需求理论出发，生理、安全、情感、尊重和自我实现。科学管理的效率敲碎，背景就是工厂模式的发展，人们普遍贫穷，生理和安全需求都难以满足，所以抬着秒表，合理地流程分工就能又快又好地把活干了。而现在小康，乃至富足剩余时代，生理、安全已经满足，对于情感、尊重及自我实现的需求成为主导。管理上就并行激发个体，激发主动性，给予员工充分的尊重，讲究企业文化，合作氛围，还有倡导“员工第一”的企业，将员工的自我实现放在组织成长之前。再加上移动互联网、数据智能等新技术的发展，让分工可以更高
    效，让人员更精简，更少的人借助工具完成了人类不可能完成或者很难完成的任务。想到这里，对马云的新零售、新制造……有了更深的体会。


    《注意力商人》的课程中提到过，广告行业的发展也存在这样的循环：依靠科技进步的媒介创新：从口碑传播，到报纸广告、电视广告、互联网广告、社交媒介宣传发展；顺应时代和经济的发展；满足客户不同阶段的需求重点。


    # 美国零售简史 | 颠覆夫妻店的邮购模式


    有人问富兰克林·D·罗斯福，如果要让苏联人知道美国人的生活的舒适和优越，他会向苏联人推荐一本什么书？罗斯福的回答是：西尔斯公司的广告宣传册。


    7月14日新闻，在加拿大有65年历史的百货公司Sears Canada申请破产保护并获法院批准，并已进入法庭监管的重组程序。这是继Target之后又一家零售业巨头结束在加拿大的经营。刚刚听过曾鸣教授“智能商务”的几讲，估计Sears和Target对网络协同和智能数据这两大趋势没有给予足够重视。或是被之前积累的巨大存量绊住了手脚，来不及瘦身，没能跟上时代的步伐。“成也萧何，败也萧何”，100多年前成功地用新技术、新业态颠覆夫妻店。现在又由于全新的互联网技术而临被颠覆。


    我觉得近几年新零售的典型代表有优衣库、名创优品等，它们不仅多快好省，而且除了有线上店，还有购物环境和体验都很不错的线下店。互联网的发展加上资本的充足、活跃以及流动，人们对有些物品还是需要亲自去看到、触摸到以及直接体验到（作为只有线上店的填充和补充），满足了人们依然会外出购物的需求，可以算是一种新零售的“消费升级”吧。


    最近阿里的无人超市已经在杭州开业了。无人系列从开始的无人收银到现在的无人超市，无人步伐在一点一点地前进。相比较于自动售卖机，无人超市需要经历的考验有：1.
    新鲜之后的客流留存；2. 模式的复制，现在很多人才不愿意远距离购物，规模化后才能够让更多的人接受它；3. 安全问题，如果超市出现安全问题，是否可以得到及时解决。'
