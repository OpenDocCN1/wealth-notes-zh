  md: '可以说，家庭在乔布斯人生的最后几年，给了他巨大的支持和帮助。乔布斯曾经和已经出柜的苹果现任CEO蒂姆·库克反复说，他也应该组建一个家庭，因为他深刻地感受到了家庭对自己的改变。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_34_0.png)


    在2011年夏天，也就是乔布斯生命最后几个月的时候。他给一个叫安·鲍尔斯（Ann Bowers）的老朋友写信，希望她能来看他。


    这个鲍尔斯其实是一个人的遗孀——英特尔的联合创始人鲍勃·诺伊斯，也是乔布斯重要的人生导师之一。鲍尔斯来看了乔布斯，聊了一会儿，乔布斯又疼痛发作，没什么精神，但是仍然坚持很兴奋地给鲍尔斯展示他设计的苹果新总部大楼。乔布斯说：“你应该为我们所创造出来的东西感到骄傲。”


    然后，乔布斯看着安·鲍尔斯，问了她一个最为诚恳的问题。他说：“告诉我，我年轻的时候是什么样子的？”


    鲍尔斯说：“你那时候非常冲动，非常难相处。”然后顿了一下继续说：“但是你的视野让人折服。你告诉我们，人生过程的本身就是一种奖励，结果证明，你说得没错。”


    乔布斯看着她说：“是的。我确实在这个过程里学到了一些东西。”然后，过了一分钟，他又重复了一遍，像是为了让鲍尔斯和他自己安心一样，他说：“我确实学到了一些东西，真的。”


    好了，这就是今天关于“乔布斯之死”的内容。这个话题有些沉重，今天就不给大家做回顾，也不留思考题了，你可以慢慢感受一下这期内容。下一期，也是苹果的最后一期，我们来讲一些轻松的小故事。我们下期再见。


