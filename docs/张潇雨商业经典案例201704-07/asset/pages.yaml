    # 伟大的“抄袭”


    接下来，我们来讲苹果早期一个重要的转折性事件。


    苹果二代大获成功之后，乔布斯没有满足，马上开始研发三代产品。但最后苹果三代不但没有成功，还成为了一个半途而废的产品。为什么呢？因为个人电脑史上的一次大事就要发生了。


    这件事，就是乔布斯在施乐公司偷学到电脑的图形界面的事件，它可以说永远地改变了个人电脑的历史，后来也成为了商业史上最伟大的一次抄袭。


    当时苹果公司成立三年多，正在进行第二轮融资。有一个公司叫施乐，施乐最有名的产品是复印机和打印机，到现在这个公司还在。当时施乐想参与苹果公司的融资，于是乔布斯说，“如果你给我看看施乐研发中心都在干什么，我就让你投资100万美金。”


    这个施乐的研发中心，放在现在有点类似于Google X实验室，主要是研发一些比较超前的黑科技。乔布斯知道他们有很多好东西，于是特别想看看。


    施乐公司只能同意了，于是乔布斯带着一帮同事就去参观。一开始，研究中心的人并不愿意给苹果看他们的研究成果，就拿了一些不痛不痒的产品来糊弄乔布斯，比如当时在开发的类似Word文档处理器软件。


    但乔布斯和同事不干了，他们早就读了施乐的研究中心之前发表的论文和专利，知道他们这是欲盖弥彰。于是乔布斯给施乐总部打电话施压，要求他们开放全部成果。于是研究中心的人只好非常不情愿地给他们展示了自己最核心的东西。


    这个东西，就是大名鼎鼎的图形交互界面，英文叫 GUI（Graphic User Interface）。简单说，就是最开始的电脑系统都是黑黑的一个屏幕，你可以通过各种文字命令来操控它。但是图形界面就是我们现在使用的这种系统，有图标可以点击，有文件夹等等，而且施乐居然还研究出来一个叫“鼠标”的小设备。


    当时乔布斯看到这个完全震惊了。书里记载说，乔布斯当下就认定，这就是个人电脑的未来，施乐自己坐在一个金矿上都还不知道，实在是太笨了。


    于是，乔布斯回去之后，就放弃了苹果三代的研发，因为他知道这只不过是之前产品的改进版罢了，他决定要把这个最新的技术用在一条新的产品线上。这就是后来著名的，在1984年隆重推出的麦金塔电脑。不过这个产品，也是导致乔布斯第一次人生失败，被踢出苹果公司的一个导火索。我们留在下期的更新再讲。


    # —— 今日小结 ——


    今天我们主要讲的是苹果公司的诞生，第一个爆款产品——苹果二代，以及个人电脑界的一件大事，乔布斯偷学施乐的图形交互界面。


    下次更新我们就来讲后面的一小段历史，乔布斯是如何被踢出局的。


    张潇雨


    最后还是给你留一个小小的思考题：你觉得商业史上都有哪些伟大的“借鉴”？


    欢迎到专栏后面留言，一起来参与讨论。我们下期再见。


