  md: '并转移到肝上了。他和施兰德说：“我现在瘦得不行，狂吃东西但是体重仍然一直下降。没人想看到我现在的样子，我连下个月每年固定公布新品的苹果大会都参加不了了……”


    他又说：“这个消息，我还没告诉董事会，连蒂姆·库克都还没有说。但是我马上要去休病假了。我给你打电话就是想亲自告诉你，虽然我很想参加这次访谈，但是我力不从心了。当然，请你不要把我的病情告诉任何人。”


    施兰德虽然特别遗憾，但是也非常理解。于是他问：“那我该怎么跟盖茨、戴尔还有安迪·格鲁夫解释这件事呢？怎么解释你在访谈前最后一刻突然反悔了呢？尤其是当初是你提议找来这几个人一起聊啊。他们也是因为你才来的。那我能不能说，你身体不太舒服么？其他的东西都不说，只说你最近身体不太好。”


    乔布斯在电话的那头停顿了几秒钟，然后说：“你就告诉他们我是个混蛋吧。可能他们心里就是这么想的，你就帮他们说出来吧。”


    这个故事，可能是乔布斯性格的最佳注释。他的确是一个性格上有很多缺陷的人：自大、粗鲁、无礼……但他从来不是一个冷血的人，他会主动帮朋友完成采访，会亲自打电话为了不能赴约而道歉；而且他也知道外人是怎么看待他的。然而，他把自己的一切，都献给了苹果公司和他的产品。


    # —— 今日小结 ——


    今天我们讲的是乔布斯的性格。听完你也许能明白，人性总是有很多面的，而对于乔布斯来说，虽然他有很多性格上面的缺陷，但这一切比起做出好的产品来，都不是那么重要。


    之后，我们当然也会讲到他最得意的几个产品。不过明天的更新，我们继续做一点延伸。之前在讲英特尔的时候我就答应你，要梳理一下风险投资业的历史，因为这段历史和苹果也有很多交集。那么，在回归主线之前，我们就来讲讲
