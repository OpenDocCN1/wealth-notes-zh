  md: '# 英特尔 | 伟大又微妙的三巨头（3/5）


    之前的更新里我们讲到了英特尔的诞生，讲到了这家公司的开创性和奠基性。今天我们来说说英特尔三个最重要的人物：戈登·摩尔、鲍勃·诺伊斯和安迪·格鲁夫。


    毫不夸张地说，要想理解英特尔这家公司，最重要的就是了解这三个人以及他们之间错综复杂的关系。不过，前面两期里我们已经讲到了一些摩尔和诺伊斯的故事，你对他们应该有一个初步印象，但我一直还没有提到格鲁夫。


    严格来讲，安迪·格鲁夫并不是英特尔的创始人，而只是4号员工。因为他一直非常崇拜戈登·摩尔，就一直追随着他。但后来很多人提到英特尔，第一反应不是其他两位，反而是安迪·格鲁夫。而格鲁夫后来也被称为“硅谷最伟大的管理者”，为什么是这样？我们之后的更新也会讲到。


    接着说回来，摩尔、诺伊斯和格鲁夫这三个人的关系，可以说完全定义了英特尔这家公司。而更加具有历史意义的是，他们三个人的合作方式，给硅谷的所有企业建立了一个新的经典模板。这可能是他们除了创立英特尔这家伟大的公司之外，留给世人最大的贡献。


    # 什么叫设立新的模板？这里面至少有三层含义：


    +   - 第一层是功能方面，

    - 第二层是性格方面，

    - 第三层则是精神方面。


    # 对外者、思考者与行动者


    首先在功能方面，用一本书来概括可能最为合适。被称为“现代管理学之父”的管理学泰斗彼得·德鲁克曾经写过一本小书，叫《管理的实践》（The Practice of
    Management），里面提出了一个问题：一个完美的CEO应该具有什么样的品质？彼得·德鲁克说，完美的CEO应该具有三种人的性格于一身：一个对外的 人，一个思考的人和一个行动的人。


    安迪·格鲁夫读到这本书的时候非常认同，还特意把这一章的复印件发给了摩尔和诺伊斯。


    就像这本书里写的那样，从功能上来讲，英特尔的核心三人组里，诺伊斯是对外的人，摩尔是思考的人，而格鲁夫是那个行动的人。而在英特尔大获成功之后，现代公司的核心团队也或多或少地按照这种方式组建了。比方有个很经典的例子：


    +   Facebook的CEO马克·扎克伯格，在2008年的时候，觉得自己虽然懂技术和产品，但是在管理和行动方面实在不擅长。

    于是他花了很大气力游说来了前谷歌的女高管雪莉·桑德伯格，担任Facebook的COO。而他自己则更多地负责战略思考和对外的部分，后来这段合作也成为了硅谷佳话。


    这就是英特尔三人组功能层面的意义。他们定义了公司核心团队的一种最优的运作方式，而后来公司都深受英特尔这种组建方式的影响。


    # 不融洽、却成功


    第二层意义是性格层面的，这个层面更加有趣。《三位一体》这本传记里概括得很好，它说：坦率来讲，英特尔可能是有史以来由一个关系并不太融洽的团队创建的历史上最成功的科技公司。


    这个认知可能有违常识，因为之前我们都在讲，摩尔、诺伊斯和格鲁夫三个人分工多么明确、配合多么默契，但实际上他们之间的关系并没有那么理想。


    比如：摩尔和诺伊斯的关系非常亲密，从仙童公司开始就并肩战斗，但实际上摩尔的行事风格很像一个隐世的高人，很早就不管公司的具体事情了。《三位一体》里说，摩尔只要一下班，就几乎没和另外两个人待在一起过。


    还比如：格鲁夫非常崇敬摩尔，但一直非常看不起诺伊斯，因为觉得他优柔寡断、完全没有领导力。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_6_0.png)


    书中提到过一个小故事，安迪·格鲁夫曾对自己的传记作者透露过一件他忍无可忍的事：


    +   当年仙童有个部门经理，很长时间都有酗酒问题。有一次格鲁夫和他约在早上9点开会，到了11点这个人满嘴酒气、跟踱跟跑地走进格鲁夫的办公室。


    +   显然这种行为是完全无法令人接受的。

    但就是这么一个员工，诺伊斯也不愿意去解雇，而是毫无作为、放任自流。这对性情耿直和好斗的格鲁夫来讲简直无法忍受。


    # 性格各异


    说到这里，有一个问题显而易见——为什么即使关系这么不融洽，这三个人还是能合作下去呢？在回答这个问题之前，我们可以稍微多说说三个人各自的性格。听完可能你就能更加理解一些。


    先说戈登·摩尔。正如前面所说，摩尔是英特尔的思想者，他为人沉默寡言，非常谦虚。可以说一直是美国最有权力也最富有的人之一，但又特别与世无争。


    书里有这么一个小故事：


    +   有一次摩尔受邀去录制一个节目，整个摄制组一边在演播室里吃饭，一边等他的司机开着他的豪华轿车抵达时通知他们。


    +   结果大家等了半天都没有等到摩尔。后来突然发现，摩尔正在演播室里闲逛，观察摄像机上的各种电子元件。原来他是自己从英特尔总部开车过来的，停车以后发现门没锁，就走了进来，也没告诉任何人，一直专注地观察那些设备。


    戈登·摩尔就是这样一个低调而友善的人。


    鲍勃·诺伊斯的性格则颇为不同。一个比喻特别恰当：他就是一个脾气很好、待人友善版的乔布斯。两个人有很多相似的地方：都很有人魅力，特别热衷于技术和产品，并且是自己公司最好的形象代言人。


    他们俩的关系也很亲密，可以说诺伊斯是乔布斯一位重要的人生导师。当然，两个人最大的区别就是，硅谷每个人都喜欢诺伊斯，但是很多人都不喜欢乔布斯。后来鲍勃·诺伊斯被大家亲切地称为“硅谷市长”，就是他受到爱戴最好的证明。因为硅谷本身只是一个通称，并不是一个真的行政区域，但大家都认为，诺伊斯是最能代表硅谷的。


    这个称号背后也有一个小故事：


    +   当时差不多是1985年，硅谷的半导体行业需要选出一个代表去华盛顿和政府谈判，寻求一些帮助。

    因为，当时日本公司正在用低于成本的价格倾销半导体，这种超低的价格很快席卷了市场，而且背后还有日本政府的支持。

    这时美国的半导体公司才醒悟过来，他们打的不是公司层面的价格战，而是国家层面的贸易战。所以这时他们唯一的出路，就是寻求政府的支持。


    +   但当时，美国半导体公司的竞争特别激烈，双方经常互相掐角，关系很不好。

    而且，硅谷也一贯不爱和政府打交道，希望自己远离政治，专注于科技。这个时候，他们最需要的就是一个能把大家团结在一起，理解每个人的利益，还能利用自己的地位和魅力与华盛顿打交道的人。


    +   最后大家一致认为，这个人只能是鲍勃·诺伊斯。

    于是诺伊斯花了几年的时间，奔走在硅谷和华盛顿之间，并帮助美国半导体行业挫败了日本半导体行业。从而也赢得'
  merge: -1
  img_proc: true
- pgno: 7
  md: '业战胜了日本半导体行业。从而也赢得了这个“硅谷市长”的美名。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_7_0.png)


    这就是诺伊斯的性格和在硅谷的地位。如果说摩尔是一个隐士一样的高人，那么诺伊斯就是一个永远站在大家面前，非常自信，把大家团结起来的角色。最后，我们再说说安迪·格鲁夫。


    关于格鲁夫的性格，可以简单用些词来描述：强硬、凶悍、激进、果断、不近人情、蔑视人性……你可能不会愿意和这样的人交朋友，但如果你有一家公司，身处一个高速发展、极其动荡的行业里，这样的一个CEO可能是你梦寐以求的。而格鲁夫也确实在很长一段时间内，担任了英特尔实际的掌舵人。关于他的传奇故事，我们下次更新里会详细讲述。


    # 天作之合


    现在回到我们之前提出的问题，为什么即使关系并不融洽，他们还是能合作下去呢？其实有两个方面的原因。


    第一个方面是性格的原因。在这个三人组里，又自信又有魅力的诺伊斯，把温和的摩尔带上了创业这个凶险的旅程；而温和的摩尔，又充当了凶悍的格鲁夫和诺伊斯之间的润滑剂；而强悍的格鲁夫，在两个人的庇护下，带领英特尔在竞争最激烈的半导体行业里，杀出了一条血路。可以说这三者哪怕缺少一个，英特尔都不会有现在的成功。


    另外可能更重要的是，这三个人的构成方式，除了在功能和性格方面建立了一个经典的模板之外，还有一层的含义，就是精神。这三个关系并不完美的人之所以能一直合作下去，正是因为他们都有一个共同的信念，就是把英特尔打造成为世界上最好的科技公司，并且无论多艰难，都要捍卫摩尔定律的有效性。这种精神信念远远超越了个人恩怨，让他们在关键时刻总能以大局为重，带领英特尔不断前进。


    # —— 今日小结 ——


    我们今天说的核心就是一件事：英特尔三人组这种特别微妙和互补的关系，以及这种组合，对于后来的公司，不管在功能、性格还是精神层面，都有着极大的启发和开创的意义。可以说，自英特尔之后，大家对公司核心团队的组建，又有了新一层次的认识。


    当然英特尔给后人的启示远远不止这么多，尤其是安迪·格鲁夫，可以说为后来的企业贡献了很多伟大的管理思想。


    下次更新，我们就来讲讲硅谷最伟大的管理者，安迪·格鲁夫。


    张潇雨


