  md: '# 皮克斯 | 和皮克斯二老学习 “向上管理”（4/5）


    之前在讲苹果的时候我们也提到过，乔布斯作为我们这一代最伟大的CEO之一，他的职业生涯并非一帆风顺的。


    从1985年被赶出苹果到1996年回归，乔布斯度过了十一年的的人生低谷。但这段时间，也让他真正成长蜕变成了一个更成熟的CEO和更好的人。


    在这段时间里，皮克斯对乔布斯的改变可以说是非常大的，这段经历从某种意义上来说治愈了乔布斯。而其中最重要，帮助乔布斯成长的两个人就是皮克斯的创始人卡特穆尔和拉塞特。


    在皮克斯的核心三人组里，虽然卡特穆尔是那个管理者，拉塞特是那个天才创意家，但本质上乔布斯是他们两个的老板。有个小数字就能证明这一点——皮克斯在上市前夕，乔布斯在公司的股份占到80%，剩下的团队一共才20%。


    另外，皮克斯所有的运营资金都是乔布斯提供的。之前我们也提到过，他当时在皮克斯和NeXT上花了7000万美金，其中皮克斯就占5000万以上，乔布斯一度面临破产。


    所以无论从哪方面说，实际意义上，卡特穆尔和拉塞特都是乔布斯的下属，但他俩反而对乔布斯影响非常巨大。所以今天这期专栏，我们就跟着卡特穆尔和拉塞特，学学如何管理你的老板。


    现在有一个很流行的词叫“向上管理”，说的就是如何与你的领导沟通，如何管理他们的预期等等。关于如何做好“向上管理”，其实已经有很多的书和文章了，这里我更想结合皮克斯实际发生的案例，来重头说说“管理老板”的三个方面。


    # 知己知彼


    第一个方面听起来很简单，叫“了解你的老板”。


    这一点可能对乔布斯格外适用。相信你也知道，乔布斯是个非常有个性的CEO，脾气时好时坏。


    之前在讲苹果的时候我们提到过，他的下属说，对付乔布斯很重要的一个点是，要会翻译他说的话，比如当他说“这个东西简直是垃圾！”的时候，你不要害怕，他的意思其实是“你能不能给我讲讲你为什么选这个方案？”如果说的有道理，乔布斯会听取你的意见。


    卡特穆尔在这点上就做得非常好。有个小故事：


    卡特穆尔在乔布斯收购皮克斯的时候，和他接触了多次，他发现乔布斯有两个特点，一是乔布斯非常在意自己时间的利用，尤其那个时候他要管理NeXT和皮克斯两家公司，时间就更紧张了；二是，乔布斯说好听点是非常注重细节，说得不好听就是什么都想自己插手管管。


    针对这两个发现，卡特穆尔在一开始就做了一个决定——


    首先，他并没有让皮克斯搬家，也就是搬得离NeXT总部近些，而是很长时间都一直在原先的小破办公室。但是他每周一会开车近一个半小时，穿越旧金山的金门大桥，主动去给乔布斯汇报工作。


    这样，一方面节省了乔布斯的时间，让他一直清楚皮克斯在做什么；另一方面，又让乔布斯无法插手皮克斯日常非常细致的运营工作，他和拉塞特可以自己说了算。因为你也知道，创意行业最怕的就是不懂行的老板瞎指挥。所以卡特穆尔这一招非常妙，而这也是建立在对乔布斯性格的理解上的。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_45_0.png)


    还可以稍微延伸一点。之前我们讲英特尔的时候提过管理学泰斗彼得·格鲁克，他在自己两本管理学著作《管理的实践》和《卓有成效的管理者》里都提到过管理老板的理念。他在书里说：


    > 你要知道，你的老板也是个人，是个与众不同的个体，有他自己习惯的工作方法，作为下属，你应该知道你的老板需要什么、不需要什么。


    比如，有的老板是阅读型，有的则是倾听型。阅读型的需要你给他写报告、列数字，这样他才能很快把握你要汇报的东西；而倾听型的呢，可能更喜欢你当面和他把事情讲清楚，甚至用感性和情绪打动他。


    对于不同风格的老板，你的工作方式应该是不同的。这当然要建立在你对他的了解之上。这就是我们要说的第一个方面。


    # 勇于提出你的要求


    第二个方面，叫做“敢于向你的老板提要求”。


    “敢于向你的老板提要求”这个说法可能稍微概括得有点简单，说得更细一点，就是你应该了解你的老板到底需要你的部分是什么。也就是说，你的不可替代性是什么，然后要利用这个不可替代性，敢于向你的老板提出要求。


    卡特穆尔在这件事上做的也很有意思。之前我们在皮克斯的第3期《创意机器》里提到过皮克斯的“智囊团”，也就是皮克斯不同部门的一些很有经验的人，定期会给某个导演拍摄的电影样片提意见。但其实乔布斯是不在这个“智囊团”里面的，这就是卡特穆尔和乔布斯的一个约定。


    有一次，卡特穆尔要去拜访微软，乔布斯很害怕卡特穆尔被微软挖走，就给卡特穆尔打电话。其实卡特穆尔在《创新公司》这本书里也写过，他并不想去微软工作，他很热爱皮克斯，完全不想撤离。但是他知道乔布斯有点担心他被挖走，就要了点小心机。


    他说，“我当时和乔布斯讲，‘智囊团’现在彼此配合得非常默契，如果你要来参加这个会的话，大家就不能轻松做自己了。”


    之前我们也提到，“智囊团”最重要的一个原则就是大家互相帮助、彼此坦诚。所以卡特穆尔知道，乔布斯最好别出现的，否则他那种见空一切的性格和大嘴巴一定会让大家很紧张。结果，乔布斯也答应了他的要求，从此他就再也不出现在“智囊团”里了。


    在这里，卡特穆尔其实用了一点点小技巧。他知道皮克斯和乔布斯都离不开他，所以在恰当的时候，他对自己的老板提出了一个要求。并且这个要求也得到了满足。我想，这对于你也是一样的，要想想自己的不可替代性在那里，然后利用你的这个特质，去影响你的老板和同事。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_45_1.png)


    # 真诚与热情


    第三个方面，我觉得可能是最重要的，那就是，永远不要低估真诚和热情的力量。


    刚才这个卡特穆尔所请要小心机的故事，其实我只说了一半。我觉得这个小技巧之所以管用，是因为，卡特穆尔并不是在为自己谋取利益，而是真诚地作为品、为团队、为皮克斯这家公司考虑。


    乔布斯如果硬要插手各种电影创意，可想而知，皮克斯也不会有现在的创造能力，也拍不出如此多的好电影来。我想在乔布斯的内心深处，他也是知道这一点的。所以当你真诚地为自己的工作考虑的时候，别人才能够感受到的。'
