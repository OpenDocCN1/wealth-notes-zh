  md: '# 皮克斯 | 创意机器

    （3/5）


    皮克斯 | 创意机器（3/10）


    之前的更新我们讲到皮克斯的诞生，以及它与迪士尼的多次合作，最终被迪士尼收购的历史。


    里面我们提到，一部电影从制作到上映，中间有很多环节，所以皮克斯这种单纯的内容制作，并不是一个很好的商业模式。尤其是，它对创意是比较依赖的。


    但皮克斯最神奇的一点是，在拍出了青史留名的《玩具总动员》之后，接连生产的一系列动画电影都是既叫好又叫座，而且在被迪士尼收购之后，皮克斯的这种能力还转移到了迪士尼身上。比如2016年爆火的《疯狂动物城》，整个生产方法非常受皮克斯的影响。


    所以，今天我就想借助《创新公司》这本书，来说说皮克斯的创意管理哲学。这本书里大量提到了皮克斯的管理细节，这些细节就是皮克斯源源不断创意的保证。


    +   1）消灭沟通层级，让员工畅所欲言

    2）好创意是不断迭代出来的

    3）鼓励冒险


    # 在小事中更要坚持公司文化


    第一个原则是，“消灭沟通层级，让员工畅所欲言”。


    # “很丑的婴儿”


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_43_0.png)


    # 冒险：创意的源泉'
