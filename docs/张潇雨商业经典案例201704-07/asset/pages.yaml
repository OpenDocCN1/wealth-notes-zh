    很多同学提到“得到”。在我的理解里，“得到”不是一个具有网络效应护城河的企业，但它具备护城河理论另外两个重要的要素，之后我会讲到。


    # PayPal | 快速增长期的三个理念


    +   1、PayPal这种人员上的趋同性，其实也是分时期的。短期内会减少沟通成本加速企业快速发展，但长期，人员的多样性必然会在公司的创新和产品服务的质量上有着重要的作用。
    2、一交叉只完成一件事的专注，可以让每个部门的人把一件事情做到极致，但是问题就在于，有些身陷局局的同时专注的方向可能有错。如果作为旁观者不提醒一下，可能不利于公司总体的效率，而且这样的文化，也会失去一些跨界的好点子的启发，公司也许会错过一个非常好的洞见。


    # PayPal | “PayPal黑帮”的神话'
