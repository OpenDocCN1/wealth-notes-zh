    “你就告诉他们我是个混蛋”，听到这句话的时候，默默地再次给乔布斯竖起了大拇指。伟人之所以成为伟人，果然还是有很多理由的。我们普通人有的缺点他或许也有，但是他有的优点我们却没有。


