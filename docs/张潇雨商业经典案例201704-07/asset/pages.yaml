  md: '# PayPal | 神秘武器 —— “增长黑客”


    今天我们继续来讲PayPal。之前说过，PayPal在很多层面对于硅谷有着很大的影响。除了 “PayPal黑帮” 以外，PayPal在创业的方法论上也给了后人很多的启示，比如今天我们要介绍的
    “增长黑客” 技术。


    “增长黑客” (growth hacking)，可以说是一种方法或者理念的概括。指的是利用一些非常规的、低成本的手段来迅速获取客户，这种手段有时候是技术层面的、有时候是运营层面的。发展到现在，“增长黑客”
    还变成了一种职位。在如今的硅谷以及中国的互联网公司，已经是一个非常普遍的职位配置。


    “增长黑客” 的核心，是要出奇制胜，花最少的钱办最大的事。经过近十几年的发展到今天，增长黑客的理论也是越来越成熟，这一却都源自于PayPal当年对这个概念的发扬光大。


    # | PayPal妙招


    PayPal当时都做了哪些和 “增长黑客” 有关的事情呢？有三个非常经典的小动作。


    第一个是在PayPal最早期的時候。那時候找客戶的傳統方法都是在電視、報紙、廣播上做廣告，成本非常高。而且對網絡支付這種新興事物來說效果也不好。于是PayPal的員工利用了電子郵件這個工具——


    当时他们每个员工都给自己的好友，以及能找到的各种邮箱发邮件，上面写：“你的PayPal账户里有1美金，只要登录就可以领取。” 于是PayPal就通过这个方法，获取了最早的第一批用户。


    这个方法很妙的地方在于两点：


    # | 三个案例


    如今 “增长黑客” 已经是硅谷科技公司标配的一种获取新客户的方法了。在PayPal之外，我们还可以举几个小案例，帮你对 “增长黑客” 有更深的了解。我们再说三个案例：Hotmail、Airbnb和网易云音乐。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_120_0.png)


    关于Airbnb，它是共享经济的代表公司，是一个可以让你在全世界的城市租借各种不同类型的房屋作为住宿的一个平台，我们在后面的专栏里也会详细分析这家公司。'
