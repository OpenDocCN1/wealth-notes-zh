  md: '# 迪士尼 | 高度控制与VR技术伦理学（5/5）


    之前我们围绕迪士尼的发展历史和商业模式做了很多文章，这期专栏，我想做一点更广的延伸。


    这段时间，市场上有一个重磅传言，就是苹果有可能收购迪士尼。如果这个交易成真，那么8000亿美金市值的苹果和2000亿美金市值的迪士尼一起，将会组成人类商业史上第一家价值万亿美金-limit公司。


    你有没有想过苹果收购迪士尼的逻辑在哪里？这两家公司合并的真正基础是什么，会成功吗？


    今天我们就聊聊这件事，然后从这件事情，延伸到迪士尼与VR/AR技术的一些关系。最后，我想谈一些商业伦理学和哲学的东西。


    # 苹果收购迪士尼？


    先来简单说说苹果收购迪士尼的基础逻辑。


    # “高度控制”的产品哲学


    不过这些并不是我最想讲的，我最想讲的是，苹果和迪士尼的契合，还体现在产品层面。如果你仔细观察，这两家公司在“产品哲学”方面是高度一致的。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_58_0.png)


    # 迪士尼乐园——我们目前拥有的最佳虚拟现实


    顺着“高度控制”的产品哲学，我们来说第二件事。这几年有一个很火的概念，VR和AR，全称是Virtual Reality和Augmented Reality，也就是虚拟现实和增强现实技术。很多大公司和创业公司都在布局这个领域，它们也被视为继智能手机之后的下一代计算平台。相信你也读到过类似的新闻。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_58_1.png)


    # 技术伦理学


    再做一点延伸，如果我现在说，我们几百年前其实就有AR和VR技术了，你会相信吗？你肯定觉得我在胡扯。但如果我们把虚拟现实和增强现实技术再做一点抽象，你会发现，它们提供的Chart就不就是一个让你脱离现实，进入虚拟世界的功Recent吗？'
