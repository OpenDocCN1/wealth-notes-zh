  md: '# 亚马逊｜从“多快好省”到“占优策略”


    亚马逊｜从“多快好省”到…


    上期专栏里我们谈到了一个在商业领域里常见的概念——战略。我们说战略的本质就是做出选择，有所取有所不为。但是，亚马逊这家公司在零售领域好像是个异类。因为它好像占据了所有维度的优势，而且二十年来一直就是这样打造自己的企业的。亚马逊到底是怎么做到的呢？


    # “多快好省”


    我们先来看看零售领域的竞争维度。


    作为一个发展超过百年的行业，零售领域的理论体系发展得已经相当成熟了，这个领域最重要的用户体验其实就是四个字：多、快、好、省。


    +   “多”——商品的选择多；

    “快”——消费者可以迅速地获得自己想要的商品；

    “好”——东西的质量或者品牌要好；

    “省”——价格便宜，性价比高。


    一个零售商一定是围绕这几个字来打造自己的业务。我们来看几个熟悉的例子。


    当年淘宝起家的时候，靠的是“多”、“省”两个字——淘宝选择多，价格也便宜，但相对在“好”和“快”方面落后一些；

    后来京东来了，打的主要是“好”和“快”两个字，强调的是品牌商品，保证真货，然后快速物流到家，甚至针对企业还有完善的各种企业服务，让人放心。

    711、全家这样的线下便利店，它们主打的肯定是“快”和“好”了。因为便利店一般就一两百平米，货物全是不可能的了，而且价格也不便宜。

    像沃尔玛这种大超市，在美国一般都要开着车去采购，所以东西又多又便宜，和线下便利店的战略选择肯定是不一样的。

    这些例子都体现了我们之前说过的，战略意味着做出选择。


    所以对于一个创业者，甚至对于我们每个人来说，可能都要想想，在给自己的企业，甚至是给自己的人生做规划的时候，你要选择做哪几个字？因为如果你所有事情都想做到，很可能所有事情都做不到。


    但我们这两周在讲的亚马逊好像是个异类。按照我们说的“多、快、好、省”四个维度，好像亚马逊都做到了。按照我们上一周对亚马逊整个业务的拆解，发现“更多的选择、更便宜的价格、高质量的内容和服务”等这些元素，正是它产生“飞轮效应”的关键。所以这里面到底是怎么回事呢？


    # “占优策略”


    要讲清楚这件事，先要讲一个博弈论里面的经典概念，叫做“占优策略”（dominant strategy）。当年在创业的时候贝佐斯非常敏锐地发现，如果亚马逊按照他的规划发展，是可以达到“占优策略”的。


    所谓占优策略就是说，在各方竞争的时候，你可能会根据其他竞争对手来设定自己的竞争策略。但是如果存在一个，无论其他竞争对手做什么，你的选择都不变的策略，这个策略就叫做“占优策略”。比如作为零售商，你的对手有的选择“快”和“好”，有的选择“省”和“多”，但你能选择“多、快、好、省”全部，那么你这个策略就可以无视其他竞争对手的选择，直接去做就好了。这就是“占优策略”。


    “占优策略”当然是竞争中的企业非常希望能达到的一种理想状态了。但是在现实生活中，能有这个地位的企业非常少，但亚马逊通过二十年的努力，就接近了这样一种状态。


    之所以能做到这样，是因为贝佐斯有两个关键的洞察：第一，他发现互联网这个颠覆性的技术，可以带来零售店边界的变化；第二，他在很久以前就发现，同时具备“多、快、好、省”的占优策略，是可以通过时间的累积逐渐达成的。


    # 1. 贝佐斯发现：颠覆性技术可以带来零售店边界新变化


    1995年亚马逊成立的时候，正是美国互联网开始火热的时候。到1997年中上 市，亚马逊的奔跑速度可以说非常快。你应该知道亚马逊一开始是卖书起家的，当时宣称的口号是“地球上最大的书店”（Earth''s
    biggest bookstore），后来还因为这个口号和当时线下的图书第二巨头巴诺书店（Barnes & Noble）打过好几场官司。当然后来谁赢谁输现在已经很明显了。


    贝佐斯在很多场合都说过，当时他以书籍起家，主要是因为书有这么几个特点：


    +   由于网上书店消除了物理的边界，所以亚马逊的书籍选择一定要比任何书店都多；

    虽然20世纪90年代初期的物流体系不是很发达，但网上买本书寄到家，总体方便程度还是不错的。而物流体系总是可以进步的。

    由于书籍是标准品，也就是你在网上买的书和在線下书店买的书没有任何区别；

    由于没有线下租金等等费用，而线上的成本往往是能随着规模扩大被摊薄的固定成本（比如人员工资，服务器等等），所以亚马逊可以让利给消费者，让它的书可以比线下书店便宜很多；


    上面四件事，正是书籍市场的“多快好省”。可以看出来，在“多”和“省”上，亚马逊都占有明显的优势；而在“好”上，因为书籍是标准品，所以线上和线下是打平的；最后在“快”方面，亚马逊虽然暂时小小落后，但是赶超是一个必然的结果。最终你发现，贝佐斯一上来就知道，亚马逊在书籍市场上可以达到最佳的“占优策略”，所以它的胜出几乎是一种必然。这当然要感谢伟大的互联网了。


    # 2. 通过时间积累可以同时做到“多、快、好、省”


    贝佐斯在二十多年运营亚马逊的过程中，如教科书一般地把亚马逊的边界不断扩大。你会发现亚马逊二十年来的品类扩张，基本遵循的是一个主线——按照某种商品在线上交易的难度，或者说是产品标准化的难度，逐渐扩张。一开始的书籍最标准化，而最近收购的Whole
    Foods背后的生鲜杂货，是最难标准化的。


    在这个过程中，亚马逊一边围绕不同商品品类的特点把它们从线下搬到线上，一方面把这个过程中需要用到的各种服务，比如仓储物流服务FBA、云服务AWS不断搭建并且开放出来，也进行商业化，最终形成这样一个帝国式的产业链。


    也就是说，贝佐斯从一开始就知道，亚马逊绝 đối不只是要卖书，而是会不断地拓展自己的边界。虽然一上来就在每个维度都比其他人好是不可能的，但只要慢慢扩张，稳扎稳打，最终就能在不同领域里做到“占优策略”，达成统治地位，形成一条斯克的护城河。只要相信时间的力量。


    有个小细节很能说明贝佐斯的整套思路。

    在1997年亚马逊的上市文件里，在描述自己的公司使命的时候，亚马逊是这么说的：

    “亚马逊的目标是成为领先的产品与服务的在线零售商，而一开始我们会聚焦在书籍市场。”

    到了1999年的股东信里，贝佐斯又公开强调了一遍，他说：

    “我们的使命是成为全世界最以消费者为中心的公司，一个消费者可以在这里找到任何东西的线上平台。”

    结果几年之后，亚马逊的目标就剔除了上面的前半句：“我们的使命是成为全世界最以消费者为中心的公司。”连“线上平台”这个形容都不见了。


    亚马逊的实际发展历程也是这样的：1995年成立——1997年上市——1998年宣布要进军书籍之外的行业——2002年开始探索99美元包邮服务——2005年正式推出Prime会员服务——2006年AWS成熟，向外推出并且商业化——同一年推出了协助第三方卖家的FBA服务——2007发布电子阅读器Kindle——同一年扩充了28个大的商品品类，“万货商店”基本形成雏形——2009年收购了鞋类电商Zappos，进军相对难标准化的鞋类市场——2011年开始进军视频和娱乐这种内容行业——2014年收购游戏视频'
