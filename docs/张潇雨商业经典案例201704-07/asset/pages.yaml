  md: '个行业立刻进入衰退期。


    内忧加上外患，仙童半导体开始盛极而衰，大批的人才开始出走。诺伊斯也决定离开仙童。这时候，之前提到的“风险投资之父”阿瑟·洛克对诺伊斯说，如果他带上另外一个“八叛逆”的人一起成立一家公司，就帮他融资，给他找钱。而诺伊斯带上的这个人就是戈登·摩尔，那个发明了“摩尔定律”的摩尔。


    # 三、英特尔诞生


    诺伊斯和摩尔出走之后，带着一帮老同事成立了一家新公司。这可能是现代科技史上最重要的一个公司，它的名字当然就是英特尔。


    英特尔的创立还标志着另外一个里程碑，就是“硅谷”这个词的由来。


    当时仙童半导体迅速倒塌，于是其中包括诺伊斯、摩尔在内的无数员工都出来投身于创业的大潮，并且这些人创立的都是以“硅”为核心材料的半导体公司。于是到了20世纪60年代末的时候，美国西部湾区的圣克拉拉（
    Santa Clara ）这个地方，就充斥了一大批半导体公司，而且几乎每家公司里都有从仙童出来的人。1971年的时候，一个叫《电子新闻》的小报派了一名记者来报道这种新潮流。这个记者在报道中常使用的新闻电头是，“今日报道来自：美国，硅谷（
    Silicon Valley ）”。


    就这样，硅谷这个引领了人类近五十年科技大航海时代的地方，就正式诞生了。


    # —— 今日小结 ——


    今天我们讲了三个关键字：八叛逆、仙童公司和硅谷。也就是八个离开了之前老板的人，加入了仙童公司，最后又离开仙童，创立了英特尔以及一众半导体公司，直接导致了“硅谷”的诞生。其中最重要的两个人就是英特尔的两名创始人鲍勃·诺伊斯和戈登·摩尔。


    在了解了英特尔的诞生之后，下期内容我想讲讲为什么这家公司如此重要，以及它对之后的科技企业究竟有什么样的影响。


    欢迎在专栏后面留言，我们下期再见。


