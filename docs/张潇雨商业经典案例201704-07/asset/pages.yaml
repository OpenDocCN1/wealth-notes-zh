  md: '在互联网技术、人工智能快速发展的今天，积极创造企业内部更多的可选择权，极为适合当今的时代发展潮流，太重要了。我的理解就是把对外部的创思域内化，这种创思域内化可以赋予内部员工积极创新的能量。战略层面发展的稳健，业务层面的积极创造更多可选择权，并追求业务非线性发展机遇，可以更加有效地加快实现最终策略。在个人发展上，阶段性的指数型发展往往可以极大地改变人生，大大缩短个人的人生规划目标。非常感谢满雨老师近期给我带来的可选择权这个概念。


    这两周的收获：第一，与黑天鹅相对的是白天鹅，如果在可控风险范围内（对于企业来讲就是有充足的自由现金流），那么一旦实验成功，带来的商业价值和回报也是非线性的，这就是著友老师讲的跨越不连续性，一只且小鸭成长为白天鹅一样飞冲天自由翱翔。第二，多快好省占优策略背后的第一性原理是关照客户利益，十年后客户确定性的需要质量更好，速度更快，价格更低的产品和服务不会变，这是贝佐斯对于未来的确定性预见，体现了优秀管理者的特质。第三，hung比人的命容易，革自己之命难。主动照顾自己的主要盈利业务，引入竞争对手来鞭策自己变得更好。第四，亚马逊IPO的日子贝佐斯居然没到，说明公司忘掉华尔街追逐短期利益，而专注于业务的长期发展。


    # 亚马逊 | 从“多快好省”到“占优策略”


    问答内刚听专栏时，一听到多、快、好、省四个字，第一反应就是这跟我以前学的相悖。然后就按照这个思路去找依据。接着在整理笔记的时候才发现原来都还没审对，但是对占优策略还是不太明白。又去查了查博弈论，加上罗胖的讲解，我现在明白了。占优并不是指大而全，多、快、好、省不是目的，而是结果。罗胖讲的是他自己作为一家中等能力公司，只有影一条路，直接撞牌，不要使用任何计策，而是用蛮力跟对方直接见面。这样的好处：不引起战略猜疑。中等能力的人只有一句话是对的，叫“没有任何道路通向真诚，真诚是通向一切的道路”。任何数据不撒谎，用最真诚的状态沟通，只盯住产品，更新迭代，这是最合适的策略。不要谈策略和技巧，直接撞牌就好。这跟贝佐斯的洞见一样，无视其他竞争对手的选择，直接去做。只要相信时间力量。容...


    多快好省的这个占优策略，对当时的亚马逊来说，可以说是一个必然的选择。当时互联网刚刚兴起，大家都还没过神来。同时贝佐斯的打法，先行动，再补救，是那个时代最好的打法。当年贝佐斯为了打造圣诞节的（玩具）礼物，哪里贴线在钱下买贵得多的玩具，也要给客户便宜的价格，在线上卖。为的就是占领用户的心智，我这里价格便宜，啥都有，你来就对了。当年亚马逊网站在刚刚开始的阶段，雅虎希望能在主页贴上亚马逊网站，这对亚马逊的技术完全不可行，但是贝佐斯还是允许了，后来技术才跟上。万老师在之前专栏讲到，贝佐斯和特朗普的打法很像，先干起来，后果以后再说。


    # 亚马逊 | 战略的本质：正反皆战略


    不要用战术上的勤奋掩盖你战略上的懒惰，是我特别特别喜欢的一句话。身边很多人对公司战略很侃而谈，但是对自己，没有战略，或者，只有工作战略。有人说：计划赶不上变化，有人说：生活不能太serious。我总觉得，你的人生战略才能决定你的事业高度，连为何做都搞不清楚，只是为了工作而工作，或者为了赚钱而谋生，能有多少发自内心的动力和坚韧呢？没办法，人这种生物，是需要点something
    bigger than yourself的东西的。很高兴地说，五年对自己的战略目标，我今年实现了，目前，正在思考下一个五年，祝我好运吧！


