- pgno: 125
  md: '后来，马斯克在eBay对PayPal的15亿美金的收购里，个人获得了1.65亿美金的收益。然后他就把这笔钱，一股脑地投入到SpaceX、特斯拉和SolarCity里面。后面的故事你已经知道了。


    之前我们在讲到英特尔和携程的时候，都着重讲过他们的创始人。在PayPal的这个案例里，你应该再一次理解了什么是顾全大局，以及人与人之间的“和而不同”的边界是什么样的。正因为有这种格局和心胸，彼得·蒂尔和埃隆·马斯克，后来都成为了在硅谷有着数一数二影响力的人物，同时也成了很好的朋友。


    # ——今日小结——


    今天我们讲的是保证PayPal飞速增长的三个理念：


    一是，保持人员背景的相似性可以让公司跑得更快；二是“极端聚焦”的管理哲学；最后是无论在什么时候，格局和心胸都是很重要的。


    听完这几个案例你有什么体会？欢迎到专栏后面留言，一起参与讨论。我们下期再见。


