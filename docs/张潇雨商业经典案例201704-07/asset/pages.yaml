  md: '# 耐克 | 真正诞生


    上期我们说到，耐克的前身是蓝带体育公司，主要业务是代理销售日本鬼冢公司的跑鞋。但是双方合作了八年之后彻应合作不下去了，只能分道扬镳。这时，耐克的创始人菲尔·奈特终于决定成立自己的公司，也就是我们现在熟悉的耐克。


    今天我就来说讲《鞋狗》这本书的后半部分，也就是耐克的诞生、遇到的困难，以及最终的上市。


    # 那个logo


    关于耐克的诞生，当时鬼冢公司为了掌控蓝带体育和菲尔·奈特，提出了收购蓝带体育51%股份的要求。这对于奈特来说完全不能接受。于是他第一反应是，做自己的品牌。


    菲尔·奈特和团队先找了一家新的制鞋工厂，算是正式抛开鬼冢公司自立门户。接着要考虑的就是品牌了，第一个任务是，给自己的品牌设计一个醒目的logo。


    当时菲尔·奈特的想法是，这个logo，一定要有和阿迪达斯的三道杠、鬼冢公司的老虎图案区别开来，感觉要特别不一样。他想起了之前一直给他们公司做宣传册和海报的年轻女生，名字叫卡罗琳·戴维森（Carolyn
    Davidson）。菲尔·奈特找来戴维森说，他需要一个logo，要求就是要给人们特别动感的感觉。


    你一听就知道，这和现在很多甲方一样，其实自己也不知道自己要什么。不过戴维森还是带着这个要求回去设计了。两个礼拜之后，她带着一堆设计草图回来，大家一看，这个图案掺有意思的，很像一个肥胖的闪电，又像一个丰满的对勾号。


    你肯定知道了，这就是耐克现在logo的样子。不过很多人并不知道这个对勾的官方名字是什么——当时有个同事说，这个符号看起来像“嗖”的一声在空气中留下的痕迹。于是，这个对勾就被命名成了Swoosh，在英文里就是“嗖的一声”的意思。


    这就是耐克这个经典logo的来历。后来耐克付给戴维森的设计费，是35美元。比起乔布斯在上世纪八十年代花10万美金设计一个NeXT公司的logo，可是节省多了。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_66_0.png)


    关于耐克Nike名字来历的故事，也很有意思。当时“对勾”的logo设计出来之后，大家一起给公司想名字。结果大家想的都是动物名字，比如“猎鹰”（Falcon）、“孟加拉虎”等等，菲尔·奈特在书里说，他当时想名字想得听说动物名字都要吐了。另外一个选择是“六维”（Dimension
    Six），但是除了菲尔·奈特，大家都觉得太复杂了。


    当时想名字还有一个截止日期，因为工厂马上就要开始生产了，必须赶在开工之前把名字定下来。菲尔·奈特动员了所有公司员工想名字，但是到了截止日期的时候，大家说的还是
    acquired 一堆动物。


    最后，有一个叫杰夫·约翰逊的员工，他也是蓝带体育的第一个全职员工，正好在美国东部办公，有三个小时时差，所以他就申请拖延三个小时。结果他想着想着睡着了，梦到了古希腊传说中的胜利女神，名字就Nike——NIKE。


    醒了以后他立刻给菲尔·奈特打电话，说想到了一个新名字，耐克。但是奈特听到这个名字之后，还是有点犹豫。到最后一分钟，他还在传真机前面徘徊，最终，终于打下N-I-K-E这四个字母，发了出去。


    这就是耐克诞生的故事了。可以说它起源于蓝带体育和鬼冢公司的分道扬镳，又阴差阳错地选择了这个logo和名字，甚至你可能很熟悉的它们的橙色鞋盒，也是因为奈特觉得那时候的大部分鞋盒颜色太单调了，不是白色就是蓝色，所以才定下橙色来的。


    历史有时候就是这样在各种巧合中发生。说耐克的诞生，就要讲一讲它之后遇到了哪些困难，以及是如何上市的。


    # 始终缺钱


    可以说，不管是在蓝带体育阶段，还是在耐克的阶段，甚至是上市的时候，遇到的最大困难都是：没钱。《鞋狗》这本书里，菲尔·奈特无数次回忆当时是怎么为钱发愁的。


    比如1970年，也就是公司成立6年之后，他还在为两万美金的现金发愁；到了1975年，也就是菲尔·奈特创业十一，耐克这个品牌成立三年的时间，他还为了凑钱给经销商，好几周发不出工资。


    这里有一个商业常识，就是对于实体生意，比如卖鞋、卖服装，经常要面临资金周转的问题。因为上游要给材料商付款，下游的零售商、百货商店的结算又经常不是特别及时，所以资金是一个很大的问题。


    而且生意越好，资金压力就越大。尤其是对于这种运动时尚品牌，商品的潮流得快去得也快，所以库存积压、成本波动、消费者口味瞬间改变导致货卖不出去这种情况更是特别常见。因此，耐克在很多年里都是非常缺钱的，能活到今天绝对不容易。


    另外还有一个背景，你应该还记得，之前说苹果的时候，我们讲到了风险投资业的发展史。特别巧合的是，红杉资本和耐克是同一年成立的，都是1972年。但是那个时候大家都在投资半导体公司和电脑公司，还没有投资零售和消费公司的概念，所以耐克唯一的途径就是向银行贷款。但那时，银行也是非常保守的。


    所以自己本身生意的特点，加上时代背景这两个因素，耐克过得一直特别艰难。甚至还有债主集体上门讨债的时候。


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_66_1.png)


    所以，到了1980年的時候，耐克的上市反而是不得已而为之的一件事情。他们的业务非常厉害，在北美第一次超过了阿迪达斯，达到了50%的份额，但还是缺钱。


    其实菲尔·奈特一直不想让公司上市，因为他说，作为一个个性比较偏执的人，想起上市的过程要面对那么多人，就觉得很头疼。但是为了公司，还是不得不做。对于很多公司来说，上市可能是一个特别值得庆祝、值得大书特书的里程碑，但对于耐克和菲尔·奈特来说，这只是漫漫长路的普通一站而已。


    最后，我想朗读一下《鞋狗》这本书的最后一段话，是菲尔·奈特描述自己在公司上市之后的几个小时状态的，我想这段话，可能最准确地描摹了祂当时的心境：


    # 上市


    > “我想起，上市之后，我的同事鲍尔曼将有900万的身价。凯尔森是600万。其他几个人也是。


    如梦如幻的数字，也是没有意义的数字。我从来不知道一个数字，竟然可以既意义重大又毫无意义。


    我睡了几个小时。醒来后，天气很冷，正在下雨。我走到窗边，看到树叶正在滴水。所有的一切都是朦胧的。整个世界和昨天一样，和一直以来没什么区别。没有发生什么改变，包括我自己。虽然後我的身价是1.78亿美元。


    我沖了个澡，吃了早餐，开车去工作，我比任何人都更早到公司。”


    # —— 今日小结 ——


    今天我们讲到了耐克真正的诞生，包括它的名字和logo的由来，也讲了耐克始终面临的资金困难，以及最后的上市。到这里，《鞋狗》这本书我们就讲完了。


    下次更新我们来讲一些耐克在上世纪八十年代非常精彩的故事。'
