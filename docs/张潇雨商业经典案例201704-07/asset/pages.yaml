    +   4. 追求市场份额是一个战术目标，它的最终目的是获取恒定市场里的稀缺资源，就是那些有比较高独占性、不太具备扩张性，当你占了之后别人就很难进入的资源。去哪儿就是靠这一招后来居上的，这本质上是一种终局思维。


