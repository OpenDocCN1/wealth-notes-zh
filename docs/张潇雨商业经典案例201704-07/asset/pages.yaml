    从这个角度讲，技术进步当然是一件好事。但我想提醒你一点，就是如果这些技术真的实现，那么意味着，我们把自己感官的大部分功能，都交出去了。


    看书的时候你被书的控制程度是比较低的，你可以随时从书中的世界抽离出来。但如果cont是VR呢？它很可能控制了你的视觉、听觉、触觉，也许有一天还有嗅觉和味觉。换句话说，某一天我们的生活可能是Facebook和苹果来定义和控制的，作为一个消费者，我们是不是应该有所警惕呢？我们是不是也应该用一些方式去保护和锻炼自己的思考能力呢？


