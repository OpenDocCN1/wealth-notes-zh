  md: '# 周末互动 | 上帝视角与无微不至


    周末互动 | 上帝视角与无微不至… ↓


    # 小师弟,你好


    欢迎来到《商业经典案例课》。我是张潇雨。


    我们这周说的是美国零售业的历史。不知你听的感觉如何，我在写的时候有一个很深刻的感受，就是感觉自己开了上帝视角，有俯视众生的感觉。


    我们这周讲了零售业的各种业态：邮购、连锁店、购物中心，还有沃尔玛这样的大型折扣超市，等等等等。我们也说，这种新业态对旧业态的代替，基本上都是因为社会风潮的新流行，经济的波动，新技术的出现等因素造成的一一尤其是我们站在此刻回头看的时候，这种趋势和规律确实非常清晰，犹如开了一个上帝视角，当时要发生什么，每个人会怎么做，等等等，都非常清楚。


    我觉得其实这就是学习历史的好处，历史能让我们以一种更高的维度去观察当时的世界，观察一些事物运作的最基本规律，甚至能够让我们预测未来。下周有一篇专栏文章，我们就会用这两周提到的一些理论，对未来的零售业做一些推测。


    不过，今天的周末互动我想给你一点提醒，那就是：开着上帝视角读历史虽然很过瘾，但是也有它的局限性。因为当我们用这种角度去看的时候，很多时候会觉得这些东西的发生好像是必然的，好象是不费吹灰之力的。但实际上，历史上看起来必然的，都是当时的人们一点一点，摸索、奋斗、努力出来的。


    我们这周讲的零售行业更是这样，山姆·沃尔顿有本个人自传《富甲美国》，是刘强东写的序。他在文章里就说，零售业其实没什么秘密，消费者要的就是那些东西，所以一切都在于细节。最后他还写了一句：不瞒你说，零售业的秘密都在沃尔玛的货架上。


    这其实也是我想说的，虽然我们在阅读历史的时候有一种开着上帝视角的快感，但是也别忘了历史经常是被细节改变的。

    沃尔玛之所以称霸美国零售业几十年，靠的就是各种各样无微不至的细节，才能让如此大的一个零售帝国良好地运转，让顾客满意，让价格一直保持在最低。


    我印象里有很多这样的一些小故事：


    比如一个顾客在沃尔玛买了一台果汁机，出了一点小毛病就去店里维修。结果沃尔玛的营业员不但立刻换了一台，还退了他5美元，因为果汁机刚刚降价了。


    比如为了打造一种节俭的文化，早期沃尔玛员工喝公司的咖啡是要在存钱罐里放10美分的；而而且沃尔玛内部打印经常用废纸，工作记录本也经常是用废纸剪裁出来的。 为的就是让员工明白，“天天低价”是沃尔玛不可动摇的商业哲学，它要体现在每个工作细节里。


    还比如沃尔玛的创始人山姆·沃尔顿的著名的“小黄本”。只要他去店里巡视，或者去竞争对手的店里考察，都会随身带一个小黄本，看到任何一些细节，比如一个店员的灵感，一个偶然发现的促销方式，一个竞争对手的小诀窍，他都会记录在这个小黄本上。最终随着沃尔玛帝国的壮大，小黄本也成了独一无二的零售业宝典。


    之前我们在《不要站在原地》那篇专栏里提到过，研究商业的时候我们要有“动态的视角”，要回到历史里，走到那个时代。在这里我们其实可以给“动态视角”再增加一个维度，其实你可以把自己想象成一个电影导演，很多时候我们在拍一个大的全景镜头，在拍时代的大趋势，但是也别忘了拍点细节、拍点人物特写，最终组合起来就是一部很...电影了。所以，在研究商业的时候也是一样，有时候我们在研究大历史，就像这周的零售史一样，有的时候我们在研究商业人物的特写，比如之前讲过的迪士尼的鲍勃·伊格，或者桔子酒店的吴海，有时候我们又在琢磨一些细节，一些理论，一些商业哲学。最终这些东西组合起来，就是商业的全貌了。


