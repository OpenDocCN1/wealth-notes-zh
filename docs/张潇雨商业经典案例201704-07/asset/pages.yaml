    # 本周留言精选


    # 英特尔 | 硅谷文化的奠基者（2/5）


    摩尔定律，我们听来只是个定律，似乎像原理，理所应当。背后的辛苦，无数工程师的努力，我们都不了解，也才会不了解创业艰辛。


    +   1、 一篇不到8分钟的文章一下子揭开我对“硅谷”这个圣地的好奇心，顺便还带出了风险投资业的起源，看得真是过瘾。感觉张老师对硅谷真的有非常深刻的了解和认识，也看得出张老师超强的佯息梳理和整合能力。

    2、 诺伊斯对入职者那句“能进来英特尔工作的都是全世界最优秀的人”，实在是非常高妙！我想起到西雅图的星巴克虽然仅仅晚几年创立，难道也受到英特尔的影响？创造一种近乎宗教的企业文化，让员工产生一种被蒙召的无上荣誉感。

    3、 摩尔定律成就了英特尔，英特尔反过来也自证摩尔定律。这跟我们日常生活何其相似：我们所说的话、所做的事塑造了我们在别人眼中的形象，反过来为了达到别人眼中的那个自己而不断努力。也正是这种“压力”，我们的生活才会有一个可以使劲的出口和发力点，不会感到迷茫，面对挫折才更容易挺过去。


    # 英特尔 | 伟大又微妙的三巨头（3/5）


    摩尔定律，使英特尔关注长期市场，科技驱动，高效率研发。然后产生安迪-比尔定律，带动价值链的软硬件良性循环，使电脑变成消费品而非耐用品。


    从中有一个小感悟，罗胖在以前的罗辑思维节目中经常提起，现在是自由人的自由联合，我们都有自己的想法，怀着自己的理想走在一起，相互理解，也是相互牵绊，妥协与斗争，最终共同前进。'
