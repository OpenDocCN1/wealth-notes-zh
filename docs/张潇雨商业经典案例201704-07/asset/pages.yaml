  md: '# 美国零售简史｜“品类杀手”的崛起与衰落（下）


    美国零售简史｜“品类杀手…” ↓


    两周的美国零售业研究已经来到了尾声。相信这两周的专栏过后，你应该对零售行业有了一个框架性的认识。比如：社会风潮和经济波动对顾客需求的影响、新技术新业态对旧业态的取代、零售业历史的螺旋式上升，等等。


    昨天我们讲到了另一种业态的崛起，那就是专注于某个细分领域产品的“品类杀手”，今天我们就来谈谈它们后来衰落的原因，以及给我们的未来所带来的启示。


    昨天我们提到，玩具反斗城、史泰博和Whole Foods（全食超市）的结局都是在开始衰落之后被收购了，那么它们到底是为什么走向衰落的呢？主要有三个原因，以下具体阐述。


    # |大型超市的杀手锏


    第一个原因是，“品类杀手”虽然在价格上比起小型精品店有优势，但遇到更大的玩家，优势就迅速被瓦解了。


    比如对于玩具反斗城来说，它们开始衰落的时候，正是像沃尔玛、塔吉特这样的大型平价超市开始进入玩具产业的时候。这些大型超市有三个杀手锏：


    一个是，它们可以通过同样大量的进货，在价格上和玩具反斗城这样的专门店进行竞争。因为沃尔玛实在体量太巨大，所以即使是玩具一个品类，它们的供应链能力也是不输于专门店的，这样玩具反斗城的价格优势就减少了很多。


    第二个杀手锏是，沃尔玛很好地利用了规模优势和二八法则。所谓规模优势是说，由于沃尔玛把自己打造成了一个无所不包的购物目的地，所以很多人们会到沃尔玛买其他生活用品的时候，顺便也采购一下玩具。而且，在玩具领域里二八法则也是成立的——80%的销售额是20%的最好的玩具产生的。所以沃尔玛就可以专注引入最流行的玩具，进一步巩固价格优势。


    后来很多美国人都是去玩具反斗城带孩子逛，体验各种服务，但真正买东西的时候还是到沃尔玛。这就像我们现在有时去逛书店但是并不真的买书，而是逛完以后在网上下单一样。


    最后，大型的超市还能利用一个终极武器，就是价格战。2000年年初的时候，决定大举进入玩具业的沃尔玛发起了价格血战，以成本价甚至低于成本的价格大肆推销各种玩具，结果其他玩具零售商不得不跟进。但是沃尔玛的优势在于，玩具只是它自己的一个小小品类，所以即使亏损也没关系，因为可以从其他的地方补回来。但是只专注玩具的零售商就没有这么足的气态了。


    所以我们经常说，优势也是劣势。当初“品类杀手”的成功在于它们粤模式比小型店和百货公司的玩具部门更先进，而且专注和深耕能让它们制造好的体验，但是在更先进业态的绝对的价格优势面前，这些优势就不复存在了。而且专注反过来又成了缺点。


    # |改变游戏规则的大玩家


    第二个“品类杀手”走向没落的大原因是，往往大玩家进场的时候，会直接改变游戏规则。


    # |新模式的胜利与未来零售的可能性


    最后一点，可能也是最令人感叹的一点，就是无论沃尔玛、Whole Foods、玩具反斗城们如何竞争，它们最终还是会被更新的、更先进的生态打败——比如亚马逊。


    # 第一个角度是，究竟现在的社会风潮与经济形势是什么，它们会产生什么样的消费者需求？


    # 第二个角度是，在消费者不变的“多快好省”的恒定需求下，有哪些新的技术手段可以催生出好的消费体验？


    # 最后一个角度，我把它叫做，什么样的线下业态是亚马逊做不了的？


    +   一是泛餐饮。

    二是体验式。'
