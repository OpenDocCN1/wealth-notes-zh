  md: '# 亚马逊 | 战略的本质：正反皆战略


    ![](img/f2bf310bff763117f6a8fa685fd2e6ec_147_0.png)


    亚马逊 | 战略的本质：正反...


    今天我们借助亚马逊这家公司，讲一个重要的商业概念：战略。这是商业里面一个非常基本的概念，如果你能够对“战略”有一个更清晰的认知 concurrency 那对你以后学习专栏都会有很大的帮助。


    你可能觉得，“战略”这个词你已经非常熟悉了，很多地方都听过无数次。但是，在很多情况下我们对“战略”这个词的理解是很模糊的，甚至是有偏差的。如果让你现在说说，什么是公司战略？你可能大概有个感觉，但又很难用语言描述出来。所以我们今天从一个维度来仔细拆解一下战略这件事。


    # ｜什么是战略？


    先来看这么一个场景：你有一个好朋友和你说想要创业，想做财富管理相关的业务。你问他：那你的核心战略是什么？于是他开始解释，说了一大堆之后他总结说：我们的核心战略就是，为那些有意愿使用财务管理服务的相对富裕的人群，提供一系列综合的财务管理和增值服务。这就是我们想做的业务。


    听起来是不是好像有点问题？又没法第一时间说出问题在哪里？


    实际上，这也是我们谈到“战略”这个词的时候最常犯的错误。这个错误就是，刚才说的这一大串其实并不能算作战略，因为战略的本质是——做出选择。


    选择是什么意思呢？其实就是：你要放弃一些东西。后来我在《哈佛商业评论》的一篇文章里看到了一个更精彩的说法，叫做：战略的相反面也必须是一个战略。否则的话，你说的事情就不能叫战略。


    我们可以把刚才那个例子用这个方法检验一下。刚才那位朋友说的是：我们的战略是，为那些有意愿使用财务管理服务的相对富裕的人群，提供一系列综合的财务管理和增值服务。那么它的相反的表达应该是：我们要为没有意愿使用财务管理服务的相对贫穷的人群，提供不那么好的财务管理服务。


    这肯定有问题。因为它的相反面并不是一个战略。


    # ｜战略是“有所为有所不为”


    “做出选择”还有一个表达方法：战略是“有所为有所不为”。


    我们来举一个真实世界的例子。滴滴打车在创业初期的時候给自己定过一个战略目标：让用户唿叫出租车之后，能5分钟之内打到车。这就是一个非常好的战略。为什么好呢？


    因为它指出了整个企业行动的方向，也就是，公司的一切资源、一切努力都要投入到“让用户5分钟之内打到出租车”这个目标之上。换句话说，滴滴在制定这个目标的时候放弃了很多东西，比如：它不去碰所谓专车和快车业务，就专注在出租车上；它也不管用户的乘车体验好不好，而是5分钟内叫到车就行；甚至它也没想降低什么价格——总之，5分钟之内叫到车就行。


    所以，假设你是滴滴早期团队的一员，你会发现这个战略给你的工作带来了巨大的推动。因为这个战略一出，整个公司的目标非常明确——让用户5分钟内打到出租车。所以，找来更多的司机和车加入滴滴的网络很重要、精确地识别用户的位置很重要、在用车的高峰时间优化车辆的调度也很重要——因为这些都是让用户快速上车的环节。而至于其他的事情，你都不用去浪费时间做了。一个好的战略目标作用就是这么强大。


    还可以再举一个更新点的例子。也许在关注亚马逊的过程中，你发现他们这两年上市了一款很火的智能音箱，叫做亚马逊Echo。它的作用主要是能够让你用语音控制家里各种系统，甚至还可以连接到亚马逊上帮你买东西、买书、放音乐等等。亚马逊Echo应该是目前智能音箱界最成功的产品了，再加上它背后蕴含的云计算+人工智能的潜力，大家都很看好它。


    结果，2017年的上半 年，苹果在WWDC大会（苹果全球开发者大会，英文全称是“Worldwide Developers Conference”）上也宣布在年底要推出自己的智能音箱设备，叫HomePod。想象一下，如果你是苹果的CEO蒂姆·库克，你会怎么设定这款产品的定位和战略？别忘了，亚马逊的Echo其实2014年底就推出了，苹果已经迟到了三年；而且你可能也知道，苹果的智能语音系统Siri并不算业界领先，反而亚马逊的云计算能力和人工智能能力是很强的。在这种情况下，HomePod应该怎么办呢？


    这里又涉及到了一个经典的差异化战略的理论，也就是，当对手领先的时候，如果落olot没事...落後者没有明显的产品上的優勢，那麽它最好的做法是——直接改变游戏规则。


    所以苹果的HomePod是怎么做 ？它上来就说，我是整个市场最好的家庭音箱，而且我还是智能的。也就是说，HomePod当然也有那些语音控制、人工智能一类的功能，但这些目前不是最重要的。最重要的是，我首先是个家庭音箱——作为音箱，我音质好、长得也好看，还便宜。你想，以苹果做iPod和iPhone的多年底蕴，亚马逊和微软这样的公司，做音乐哪儿可能做得过它啊。所以当苹果上了牌桌之后，首先做的事情就是改变游戏规则，让大家认为，智能音箱目前的重点不在智能，而在音箱。后来各家媒体的产品评测也证明，HomePod在播放的音质方面的确远远超过亚马逊Echo和其他一些智能音箱品牌。虽然这不一定意味着苹果必然成功，但这种战略的打法确实是非常犀利的。


    # ｜如何给你自己制定战略？


    现在你应该明白什么叫“战略的本质是选择” 了。接下来，我们可以从商业回到我们自己身上。我在专栏里反复说，商业的一个核心的魅力在于“自我 півні”，我们每个人都能在学习商业中修养自己。今天这个战略的话题，就是一个很好的例子。


    所以我们可以来思考一个问题：如果你把自己看成一个公司，你应该怎么制定战略呢？


    很多人可能在平时总说，我要勤奋学习，我要认真工作。这些当然没错，但这些都不算战略层面的选择。因为按照我们刚才提到的检验方法：一个战略的反面要是另外一个战略。所以显然，不勤奋学习，不认真工作不是一种战略。而什么呢？“学好英语”可以算，因为这意味着你放弃了学好写作、学好演讲、学好弹琴等等等等。但这样，你就可以非常专注地投入时间精力来达成自己的目标，而不是总被分心，受到各种其他的诱惑。有所有的有不为，才是给自己制定战略的真正秘诀。


    这里我还要再往前走一步：其实当我们在讨论公司的时候，我们很容易能明白制定战略非常重要，甚至制定好战略之后怎么打法、怎么执行，那些都是战术层面的事。但一回到我们个人身上，很多时候我们就把这件事忘了。我们会执着于战术层面的事，特别努力、拼命加班、努力完成老板或者老师给的任务，但是我们经常忘了，这些事情真的值得做么？有没有更好的完成的方法？你给自己制定了战略么？你有没有做出选择，有没有“有所为有所不为”呢？


    我想，这时候我们可以来回顾一下商业领域中经典的话了：一句是——不要用战术上的勤奋掩盖你战略上的懒惰；另一句是——做正确的事情，很多时候要比正确地做事情重要得多。


    另外，听到这儿你可能會有一個疑問，就是：战略不是做选择么？怎么之前我们提到的亚马逊，一直强调的战略是，我东西又要多、又要好、又要快、还要便宜呢？怎么好事都让亚马逊占了呢？它是怎么做到的这一点的呢？别急，明天的专栏里，我们就要解答这个问题，以及博弈论的经典知识。欢迎你明天继续来学习。


