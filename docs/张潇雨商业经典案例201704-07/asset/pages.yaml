  md: '# 携程｜桔子简史


    携程｜桔子简史


    这周我们的主题是携程这家公司。今天是周五，在昨天比较理论的内容之后，我想讲一个和携程有着密切关系的人，以及他自己公司的故事。这就是我们之前在本合同的第三篇《以小博大的收购》中提到过的，在携程早期就加入的吴海，以及他后来创立的桔子酒店。


    在这个最真实的商业案例里，你可以看到一个企业从出生到结局，到处要经历多少的转折与坎坷，以及一个创业者是如何在市场的大潮中，想要坚持自我却不可得的。


    我们先从故事的结局讲起。


    2017年2月25日，华住酒店集团和美国凯雷投资集团等投资人签署了股权收购协议，以36.5亿元人民币的价格全资收购了桔子水晶酒店集团100%的股权。华住酒店的创始人和董事长正是携程和如家的创始人季琦，而桔子水晶酒店集团的创始人和CEO，则是我们今天这篇专栏的主人公，携程早期的高级副总裁吴海。


    # 起源


    先介绍一下桔子酒店的创立背景。2006年，离开携程接近五年之后，吴海意识到了连锁酒业的巨大市场份额，萌生了再次创业的想法，这次的项目就是桔子酒店。


    # 隐忧


    在注重设计和“消费升级”的过程中，桔子酒店也埋下了三个隐忧。


    首先，产品的任何特色，反过来都是一种代价。对设计感的强调让桔子酒店房间的装修成本一直居高不下。行业里，大部分中档酒店品牌每间房装修的基准线是10万元左右，像控制能力比较强的全季，一间房的装修可以做到9万元。但高端桔子酒店的成本高达一间房20万元。这让它们开店的成本比一般的经济型酒店高得多。


    # 退出


    资本既然投资你，就有要你退出的一天。2016年末，凯雷中国的大老板杨向东和吴海商量想要退出桔子酒店的事情。不过和你想象的可能不一样，这并不是一次 τρα什么。


    # 吴海其人


    说到这里，你可能大概明白：这就是一个现实世界里发生的d最真实的商业故事。一个对创业有着热情的创业者，做出了自己在意的产品，为自己赢得了口碑和客户，然后又不得不在市场大潮的左右下，逐渐放弃了自己的坚持，拥抱了资本，最终把自己的作品交了出去。'
