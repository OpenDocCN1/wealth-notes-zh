  md: '# 案例梳理 | Netflix与PayPal的关键14条


    在昨天的周末互动里，我不仅讲了PayPal，也提到了上周讲的公司Netflix。今天的这篇特别加餐，我就来为你梳理一下这两家公司的关键知识点，作为你学习这两家公司的辅助材料。


    # ——► Netflix ◄——


    # 基本信息：


    Netflix，就是出品了《纸牌屋》、《女子监狱》等爆款视频的网络视频点播公司，成立于1997年，创始人是里德·哈斯廷斯（Reed Hastings）和马克·伦道夫（Marc
    Randolph）。当时是录像带的天下，但是他们赌DVD格式会爆发，于是成立了网上租赁DVD的公司Netflix，最终，他们赌赢了。


    # 传奇历史：


    创始人初期，Netflix有个巨头竞争对手，就是统治家庭娱乐市场的霸主公司百视通（Blockbuster），这个对手在巅峰时期有五千万的订户，线下有八千家实体的门店。但最终，被Netflix打破成了。


    # 做对的事：


    Netflix以小博大的方法，总结起来其实是《创新者的窘境》里提到的颠覆式创新方法论：第一，利用颠覆性的新技术；第二，提供差异化的产品体验；第三，找到属于你的细分小众市场，把产品卖给他们。对应到Netflix的行为就是：不开设实体店，只在网上运营；直接把寄DVD给客户；推出了没有到期日、没有滞纳金、免邮费的“三无”会员制。


    # 幸运之处：


    # 对手的失败教训：


    +   1) 破坏性技术往往更简单、价格更便宜，但利润也更低。所以对于大企业，利润不高 начиная的业务往往是不会去做的；

    2) 好的大企业一定会多多“听取消费者的意见”，根据反馈对自己的业务进行优化，但这种思考方式往往只能带来渐进式的改变，而不是颠覆性的创新，因为主流用户往往是不会关注不成熟的新技术或者新产品的；

    3) 为了创造利润、维持股价，甚至为了内部员工的晋升和发展，大企业也要保持自己的增长率，所以，它们往往会着眼于足够大的市场来保持自己的增长，但颠覆性的技术一开始针


    # 自我颠覆：


    # 独特文化：


    +   1) 招聘和留住最好的人。Netflix有一个杀手 मंगल问题 “你手下的哪个人，如果有一天和你说TA要离开去加入一家和我们同行业公司了，你愿意付出巨大的代价去挽留吗？”
    这个问题用来检验员工是否足够好；

    2) 把公司的所有人都当成“成年人”来对待。Netflix的员工带薪休假不需要审批，时间也没有限制，只要做好交接就可以休假。Netflix的费用报销也不需要审批，员工自己决定。另外，Netflix的员工还可以自己决定薪酬里现金、期权的比例。


    # 自制大剧：


    自制剧是Netflix用相对低的成本提高内容黏性的方式。《纸牌屋》大获成功后，大家都认为Netflix的大数据发挥了作用。Netflix也乘胜追击，在《纸牌屋》之后，用两亿美金的大制作打造了一部历史剧《马可·波罗》，结果骂声一片，可见大数据指导内容未必靠谱。


    # ——► PayPal ◄——


    # 烧钱大战：


    烧钱竞争然后合并，不是现在才有的互联网打法，PayPal就是这么尘埃落定的。当年它和埃隆·马斯克创办的X.com为了竞争，各自给消费者的补贴都太猛了，最终两家以50：50的价格合并，成为了现在的PayPal。


    # “PayPal黑帮”：


    很多参与PayPal早期创立的人后来都成立了有巨大影响力的公司。比如特斯拉、SpaceX的创始人埃隆·马斯克，LinkedIn（领英）创始人里德·霍夫曼，Youtube创始人陈士骏（Steve
    Chen），美国“大众点评”Yelp的创始人杰里米·斯托普尔曼等等。


    # 验证码：


    # 增长黑客：


    增长黑客的主要理念是利用一些非常规的、低成本的手段——有时候是技术层面的、有时候是运营层面的——来迅速地获取客户。简单说就是要出奇制胜，花最少的钱办最大的事。这个理念现在已经越来越成熟，但最早是PayPal发扬光大的。


    # 网络效应：


    PayPal创业初期，CEO彼得·蒂尔反复强调，PayPal是一家仰仗于网络效应的企业。网络效应的本质是：如果有一种产品或者服务，它随着每一个用户数量的增加，自己本身的价值也会提高，那么这个产品或者服务就叫做“网络效应”。


    # PayPal快速增长的三个理念：


    +   1) PayPal有一个反直觉的早期招聘的理念：创业早期招人的时候最好不要什么多样性，招的人越像越好。比如PayPal自己，最早的10个工程师全部都是UIUC（伊利诺伊大学厄巴纳香槟分校）毕业的，大家大学上的课几乎都一样；最早的5个非技术人员，都是彼得·蒂尔在斯坦福校友网络里的人。这种趋同化的背景，让大家沟通的成本非常低。

    2) “极端聚焦”哲学。这是彼得·蒂尔作为PayPal的CEO时的一个管理哲学，要求PayPal的管理者和员工一次只能专注一件事情。而且他做得很绝对——如果任何员工找他讨论核心任务以外的事情，蒂尔都会拒绝，直到那个员工完成核心任务为止。

    3) 无论什么时候，格局和心胸都是最重要的。X.com和PayPal合并后，彼得·蒂尔与X.com的高管发生了冲突，因此辞职，由埃隆·马斯克接替CEO的职位。'
