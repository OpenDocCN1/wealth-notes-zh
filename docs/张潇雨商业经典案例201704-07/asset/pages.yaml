  md: '# Netflix | 巨头百视通的致命错误


    今天我们继续来讲Netflix。之前的专栏里我们借Netflix早期的创业故事，讲了一个商业理论，关于：一个创新的小公司该如何打败大公司。


    其中有三个环节很重要：（1）利用颠覆性的新技术；（2）提供差异化的产品体验；（3）找到属于你的细分小众市场，把产品卖给他们。


    当然我们也说了，这些道理总结起来简单，但是真正做起来会遇到很多具体的问题。所以，任何小企业在起步的时候，可以说都是非常凶险的。


    另外，如果你回顾一下历史上经典的以弱胜强的案例，应该会有一个印象：就是在任何这种以弱胜强的案例里，不管是商业、体育还是战争等领域，除了弱小的那方要做对很多事情以外，另外一方也要犯很多错误才行。那在这种情况下再加上一点运气，可能一个经典的案例就会诞生了。


    Netflix早期的创业故事也是一样。所以今天，我们就从另一个角度来说说Netflix颠覆百视通的故事，也就是：百视通作为一家行业的霸主，都犯了哪些错误，以及受到了哪些限制，才让它被一个小公司打败，最终沦落到破产的呢？


    本质上，一个巨头被颠覆的内因——也就是它自己犯的错误——都能归为两个大类：第一，它自身积累的资源成为了它转型时的限制；第二，它一定犯了做慢的毛病。


    之后我们还会很多案例里看到类似的情况，我们也会从不同侧面反复讲到其中的逻辑，这样就会对“颠覆式创新”这个概念，有更深刻的认识了。


    # 优势也是劣势


    我们先来说说百视通自身的情况是怎么限制它的转型的。先来看看两家企业的规模对比，建立一个更直观的认识：在Netflix2002年上市的前后，它的用户数大概在70万-80万左右，而百视通的活跃用户数有接近两千万，总用户数有五千万。


    但是，百视通的巨型体量也给自己带来了很多限制，其中有三点是非常致命的：


    首先是它的商业模式。比起Netflix全部在网上运营的、轻资产的模式，百视通很长时间引以为傲的就是它线下几千家加盟的门店。当时媒体上有着数据统计，70%的美国人都能在10分钟车程内找到一家百视通的线下连锁店。这在美国这种很多地方地广人稀，同时非常依赖开车的国家，可以说是做到极致了。


    然而，当Netflix这种轻资产、网上运营的模式兴起之后，这反而成了百视通的劣势。因为如果它一旦也做类似的服务，线下的加盟商就会有很大的意见，因为用户可能就不再去他们的店里了。而且，这也可能会直接导致百视通利润和股价的下滑。作为一家大型上市公司，是很难向股东交代的。


    第二点，Netflix对用户租赁滞纳金的取消对百视通的影响太大。我们可以在时间上做一个对比：


    当Netflix在1999年年底正式推出零滞纳金，也就是用户可以无限期保留自己想看的电影，不需要担心什么时候还的时候，百视通是什么时候跟上这个很受用户欢迎的零滞纳金的服务的呢？2005年。它的反应之慢可见一斑。


    # 做慢的代价


    接下来我们说说百视通的另一个错误，也是巨头公司经常犯的一个错误：做慢。关于百视通的做慢，有两件小事就可以看出端倪。


    第一件事情是，在Netflix上市的时候，媒体采访百视通的CEO怎么看。结果他说，百视通不认为Netflix是什么威胁。因为首先，他们觉得DVD这个新格式未必有很大的前途，录像带很长时间内还会是主导；另外他还说：大多数顾客租电影的决定是在走进店门口半小时才做的，所以百视通遍布全国的几千家连锁店会具有不可替代的价值。'
