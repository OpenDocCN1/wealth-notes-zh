  md: '# 携程 | 价格战、稀缺资源与终局思维


    这周我们讲的是携程这家公司，今天，我们稍微做一点延伸，讲一讲：携程做错的一件事情，以及它的竞争对手“去哪儿”做对的一件事情。其中会涉及一些商业理论和商业逻辑的知识。


    首先，介绍一下背景。携程这家公司，从1999年成立到现在接近20年的时间里，遇到过无数的竞争对手，毕竞互联网旅游这个行业在中国一直非常火热。在所有竞争对手里，庄辰超带领的“去哪儿”网应该是最有力的挑战者。直到2015年年底，这两家公司在经历了几年的惨烈争斗之后终于合并，才给这段恩怨历史上了一个句号。


    在之前的一次周末互动《找刚需？需求也可以被创造》里，我曾经讲到过一个问题，那就是：在互联网这个如此强调速度的行业里，为什么去哪儿比携程晚成立了6年，最终仍然能和携程平起平坐呢？


    今天的专栏里我们就更加细致地讲讲这个问题，以及其中蕴含着哪些商业逻辑。


    # 携程的误算


    首先必须承认，一家公司对另一家公司后来居上的赶超，一定是由非常多的因素决定的。不过，在这次去哪儿对携程的赶超里，有两个因素起到了非常重要的作用。那就是：携程做错了一件事，而去哪儿做对了一件事。


    携程做错的事情——按照去哪儿的CEO庄辰超的说法——是它算错了自己的市场规模。很长时间以来，携程都觉得自己争吵的市场叫做“在线旅游”。但实际上，这个定位是有问题的。


    这个定位的问题在于两个方面。第一个方面是，“在线旅游”这个市场定位是一个高速流变，而不是恒定的市场定位。在一个本身就是一直以每年40%-50%速度在高速增长的市场里，你即使做到市场份额第一名，意义也是不大的。


    比如，携程很长一段时间市场份额都超过50%——这已经非常高了——但如果这个市场本身以50%的速度也在增长，你的速度稍微慢下来，比如以20%的速度增长，两年以后你的市场份额也就不到1/3了。即使你的增长速度也能有50%，但增长过程中释放出来的市场容量是非常大的，完全可以再容纳更多的公司，这就等于给潜在的竞争对手留下了空间。


    第二个方面在于，“在线旅游”的定位没有解决人的根本需求。庄辰超举过一个例子。他说：你可以想一个问题，为什么携程没有做出像Airbnb这样的业务？因为本质上携程觉得，“在线预订酒店”是携程主攻的市场。但“在线预订酒店”并不是人的根本需求。


    如果我们把这个需求抽象一下，它其实是“不在家的时候需要有个地方住”。所以Airbnb的理念是，你别住酒店了，住在别人家吧，又便宜又有独特性。它直接开辟了一个新的市场。现在，携程加上去哪儿的市值在270亿美金左右，而Airbnb的估值已经超过300亿美金。


    所以，这里蕴含的道理在于：当你思考自己的市场，观察自己的竞争对手的时候，一定要把你的目光定义在一个恒定的市场。 在一个高速变动的市场里如果你是第一名，听起来好听，实际上有巨大的风险。因为如果市场本身突然加速了，或者玩法变了，那么整个行业的商业策略、竞争模式也会发生根本的变化。


    拿携程和去哪儿举例来说，去哪儿虽然在2005年才成立，比携程晚了6年。但那个时候，正是整个旅游市场从门户网站逻辑，向搜索引擎逻辑转移的时候。也就是说，以前大家是去携程这个整体的入口买机票订酒店。而去哪儿初期提供的解决方案是，自己并不直接提供旅游产品，而是像搜索引擎一样，能帮你搜到几百上千家机票酒店服务的提供商。


    这就是从门户逻辑到搜索引擎逻辑的改变。另外可以提一句，2005年还发生了什么事情呢？百度在美国上市了。


    再加上过去十年中国的旅游市场增速非常快，所以早期携程积累下来的市场份额的优势，很快就被大大小小的竞争对手削弱了。这就是去哪儿即使晚了6年，仍然能给携程造成市场威胁的一个重要原因。


    # 去哪儿的价格战逻辑


    去哪儿能够将携程造成市场威胁的另一个原因，也就是我们刚才所说的，去哪儿做对的一件事情，它成功地使用了价格战这个武器，逐渐占领了市场份额。


    说到价格战你肯定不陌生。当一家公司主动降价，甚至把价格定在低于成本线销售产品的时候，它的目的 неиз定是获取更多的用户，取得更大的市场份额。但人们常常犯的一个错误是，把市场份额本身当成了战略目标，或者觉得价格战的终极目的就是获取市场份额。


    去哪儿的逻辑则非常清楚，庄辰超说，追求市场份额永远只是一个战术性目标，你一定要知道自己在使用价格战的武器、追求市场份额的最终目标其实是：获取市场里的稀缺资源。


    我们先简单梳理一下已有的逻辑。刚才我们提到，要把自己的目光放在一个相对恒定的市场，上，要在这个市场里去追求市场份额，否则不管你是第几名，意义是不大的。现在我们讲到，利用价格战这个武器，可以获取更多的市场份额，但追求市场份额只是一种战术手段，它的最目标是，获取这个恒定市场里的稀缺资源。


    什么是恒定市场里的稀缺资源呢？就是那些不太具备扩张性、 有比较高的独占性的、当你占完了以后，别人很难进来再占领的资源。


    举个例子就好理解了：对于旅游行业，典型的稀缺资源就是飞机座位资源和酒店房间资源。因为酒店是不可一年多出50%来的，航空公司的飞机也一样。同样，对于一些内容生意，好的版权就是一种稀缺资源。它们都是一种独占性的、难以快速规模化扩张的资源。


    那如何获取稀缺资源呢？这就要回到刚才所说的市场份额了。一种获得稀缺资源的方式，就是利用你已经占有的市场份额的力量去锁定。


    庄辰超说，对于旅游行业，当你有5%的市场份额的时候，那些稀缺性资源，比如机票酒店等等，它会至少允许你使用它；当你有25%的市场份额时，你就能对稀缺资源有一定的控制力，比如可以要求它们配合你的运营活动，降价等等；当你在市场里有了50%的市场份额的时候，你可能对某一一些稀缺资源就完全的掌控力了，甚至可能是排他，也就是有资格阻止他人获取同类资源。


