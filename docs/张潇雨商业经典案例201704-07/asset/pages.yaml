    # 苹果


    +   1. 现在，电脑有文件夹等小图标可以点击，这是再正常不过的事了。但最早，是苹果率先把这种图形用户界面推到大众面前，在那之前，电脑都是用文字指令来操控的。但乔布斯却因为这个有重大意义的产品被驱逐出自己的公司。


    +   2. 乔布斯在外漂泊十一年后回归苹果，做了三件逆转苹果颓势的重要决策：砍掉了苹果90%的产品线；打造了 “Think different” 这个彰显创新精神的经典口号；下调了期权价格，赢得了人心。


