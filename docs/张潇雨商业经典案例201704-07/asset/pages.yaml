    今天的文章让我想到《好战略、坏战略》里的一种好战略，大致是：链条-环节（环节相扣）。其实，不只是亚马逊，为什么其他家具公司仅模仿宜家的会员服务或设计风格，很难超越宜家？为什么沃尔玛起家时选在了当时巨头零售业都不进入的小城镇，还能获得成功？这都是“飞轮效应”的体现。再说到个人，当你理解了“飞轮效应”，你也能更有效地构建自己的个人竞争。力。比如：对于咨询行业的从业者，你写案子、提案、演讲能力都不错，若再加点广告公司从业者的创意能力，便可构建自己系统化的竞争力。


    张潇雨


    “系统化的竞争力”这个词我觉得很到位。


    所谓飞轮效应，相当于公司各业务模块之间的“网络效应”。网络效应值是增加的客户为整个业务带来增值；飞轮效应，是指业务内容直接的彼此连接和增值。也就是我们常说的1+1>2，这种增值可以是规模效应上的，传导力上的，边际成本上的，服务上的。但是，彼此间的合力，带来各业务之间的不断交叉增
    Gains 和提升，形成巨大的合力。这些合力形成的，是别人很难一时建造成的竞争壁垒。京东、淘宝也有很多和亚马逊相似的模式，但又有不同。京东更注重自有产品销售，淘宝更注重第三方卖家业务。天猫也在整合各商家，以使提高储运服务，譬如：天猫的各电器商家，都通过天猫指定的日日顺物流配送，即使你在不同的店买电器，它们都可以一起送来，节约时间和运输成本。我一直是亚马逊的死忠粉，期盼这两周的专栏。'
