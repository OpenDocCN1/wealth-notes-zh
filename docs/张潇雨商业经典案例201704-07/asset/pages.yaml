  md: '2、找到破局点。在迪士尼发展 dilemmas 时，新上任的CFO的鲍勃·伊格能够迅速找到破局点，从商业模式IP内容—渠道—衍生品入手，迅速行动，大量并购制造新的IP内容。


    3、漫威和卢卡斯影业看到迪士尼如何对待皮克斯，这点也很像公司内部，新入职的员工会了解公司如何对待老员工。老员工会了解公司如何对待离休员工。公司如何对待人力资源，所有人都在看着呢。


    # 迪士尼 | 被“成年人监管”的 CEO（4/5）


    技能稀缺性和工作表现这两个我宁愿选择工作表现，如果一个人的工作表现突出，那就自会直接带来公司的财富增加。技能稀缺性也是为工作表现服务的。


    回到本质，技能稀缺性带来的苟公司竞争力的提升，这种竞争力提升会带到工作表现中，来直接提高公司的盈利。


    之前在万维刚老师专栏里有一篇特别放到《战诸古今皆准的权利游戏》，给我的启发很大。我把他套用到公司股权分离上，发现普通股东就是名义选民，投票股东就是实际选民，董事会监事会就是胜利联盟，最终得以实现高管权力。


    一家上市公司如果实际选民（实际参与投票的股东）集中，那么胜利联盟相对稳定，高管的位置坐得也比较稳，这就好像今天潇雨老师讲到的Facebook与扎克伯格的这种股权结构；


    如果一家公司名义选民多，可争取的投票对象众多，那么很容易发生高管的变动，就像齐布斯被逐出苹果、埃纳斯被逐出迪士尼。


    我还在A股做了大数据研究，一个惊人的发现是，这两年股权之争的焦点，像宝万之争，南玻A，格力电器这种公司，十大股东的持股比例较低，有的甚至在30%以下，是成人监管的天然土壤。


    这种制衡机制似乎就是为了与人类贪婪、自大、爱面子等特点来做对抗。这似乎就可以慢慢理解，为什么有的时候，领导们考虑的事情往往不是具体细节，而是“生产关系”如何安排，如何保住自己的“阵地”等。


    因此，在做具体技术的时候，要用技术的维度来思考。在向上汇报时，也要尝试从管理和资源分配的角度来思考。一味地讲自己的技术多好，取得了多少突破只是汇报中的一个方面。


    但技术往往并不会拗着“生产关系”的既定设计发展，原有的“生产关系”往往会因为一项或几项技术的突破而破坏。


    如果是以技术立命的人，还是要打磨好自己的手艺，而不是过多地关注如何抢占“蛋糕”的问题。如果是以管理立命的人，则更多是要思考哪些技术会带来冲击，站在更大的时间尺度上做判断，而不是把家都压在一两项热门技术上。


    这些年就是看着公司高层不停的权利斗争中度过的。今天潇雨老师的分享起到了一个高度概括总结的效果。


    现代公司管理制度下的企业最重要的一个点就是公司快速发展和市值上升。在这个前提下，投资人、董事会、CEO和员工之间的利益是一致的，但权利之争无论在呢里，无论什么时候从来都不会停止，人的天性所在。


    2011年初Doug Williams入职美国东海岸的著名制药企业Biogen，作为EVP执掌整个研发。他重新调整了整个Biogen的临床pipeline，Biogen的股票成为了华尔街的宠儿，从60美元左右开始了长达四年的攀升，一度单天到了480美元。内部对他的信任远超CEO
    George Scangos。


    Doug Williams在2015年7月因对Biogen未来发展计划与整个公司高管层意见相左而离职，当时财富杂志就发长文报道此事，同时Biogen股票在一周内一路下跌，从400跌到300，再也没高过330……这其中原因非常多，但Doug的离任是大家公认的最大因素之一。


    作为一名HR，换CEO或者配合CEO血洗之前的高管，都是本职，本职，本职工作。哈哈哈。


    职业经理人会有一种植宿命：倘若非你不可，你说的都对，你做的都行；倘若具有可替代性，甚至替换了更好，那就没有什么本钱性格了。


    对于CEO，业绩是王道，在危难或全力发展之时，你强你有理，只要你能多多赚钱，董事会没人和你计较，重点是没人和钱过不去。但倘若天下太平，无数备选，还是老点实比较好。


    总而言之，CEO还是与人为善点儿好。今日留一线，他日好相见。不然，真是那么有本事的CEO也没有岁月静好地度完这一段职业生涯。


    肖恩·帕克和扎克伯格的Facebook公司与红杉资本之间的故事太有趣了。这是第一次听到，创业公司羞辱投资大佬的故事。


    另外，说说我以前曾工作过的神州数码公司，具体的应该算是神码的子公司。当时有句顺口溜来形容公司的CFO——铁打的营盘流水的兵。公司CFO过段时间换下，又过段时间换下，在CIO位置上几乎无论是空降兵还是自己公司内部提拔的都干不长，不知道原因为何。


    后来，看到有媒体的采访报道，才从媒体上知道，原来公司的战略不清楚，一直在变。一段时间做自己的产品却不了解市场，卖不出去；一段时间想做软件外包业务，一段时间做并购，一段时间又想做“智慧城市”的构想；一段时间发现房地产老发财了，就去做房地产了。结果，不管是联想也好神码也罢（神码是联想分出来的公司），都挣棋不定到底专做什么业务。


    而且人才不管是高管还是技术专家都流失严重，跳槽到其他公司或有的被辞退。公司始终没有某方面特长的长时间的积累。这也最终使得联想系、神码系公司在与华为、阿里巴巴、腾讯、小米等公司的竞争中，逐渐陨落下来。


    如果你问联想、神码到底是做什么产品或服务的？很难用一句话说清楚。而你问华为、阿里巴巴、腾讯是做什么的？估计你马上就能说出他们的明星产品和服务了。


    # 迪士尼 | 高度控制与VR技术伦理学（5/5）


    苹果与迪士尼的内驱理念都体现了“高度控制”这个商业缩略点，如果他们成功结合，最终会演化为一个科智智能+文化娱乐的商业大生态系统。有点类似《西部世界》中那种真实+虚拟的世界，其中的一切都是设计过的高度控制，你能在这里体验一种从未有过的虚拟增强现实人生。


    我的感受是，万维钢老师曾经在介绍《未来简史》的时候提出了一个公式：知识=体验×敏感度。


    读书是一种提升敏感度的方式，有助于人更好地进行体验并获得智慧；而AR和VR只是一种刺激，一种有更强控制力的刺激，对敏感度的提升可能有限，让人可能会丧失探索未知的兴致。


    书本文学带给人表象，人们通过思维对表象进行操作形成想象，中间过程就是创造。如何保护我们的创造力，绝对是一个值得思考的问题，谢谢潇雨老师将这个问题作为今天的内容之一。


    坚信可以提供最好的专业产品，让客户减少自己的DIY，在某一程度上也可以保证较高的体验。但在今后的某个时刻，会不会也因为客户对自主性的追求而失去竞争力？


    早早上车的时候张老师讲虚拟现实，说书就是虚拟现实，恍然大悟，我有一点自己的想法，不知道正确与否？


