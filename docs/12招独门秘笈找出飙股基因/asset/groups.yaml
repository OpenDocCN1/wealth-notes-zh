    然而，就在國人普遍不看好的預期心理下，台股不僅逆勢上演驚驚漲的走勢，更打破史上持續時間最長的萬點紀錄，截至2018年5月，不僅已連續超過365天站上萬點，超越1990年的65天，更將1989年26天、1997年及2000年時4天的紀錄，遠遠拋在後面。


