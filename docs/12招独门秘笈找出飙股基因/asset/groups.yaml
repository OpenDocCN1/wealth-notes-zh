    以京鼎2017年第3季財報公布後，股價最高來到249元的走勢來看，244元的合理股價似乎得到市場最直接的驗證。


    ### 2017年3～12月京鼎（3413）股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_269_0.png)


    資料來源：CMoney 資料整理：《投資家日報》


    ### Note


    ### 第11招


    ### 存股聖經


    ### 不看盤輕鬆獲利40%


    台股長期維持4%以上的高現金殖利率，在現行全球低利率的投資環境中，確實獨樹一格，不僅吸引國際熱錢這幾年源源不絕地湧入台股，更讓許多有志想要透過理財增加財富的投資人，期望能藉由「存股」的方式，幫自己加薪。


    撇開稅負問題，選擇優質的好股票存股，對於許多投資人來說，確實是不錯的理財選擇，畢竟它創造出來的收益，一方面遠高於銀行的定存，另一方面更可為自己每年都帶來一筆額外的被動收入。


    ### 用殖利率計算 抓住最佳買賣時機


    以500萬元本金為例，放在台灣銀行1年期定存，利率只有1.065%，因此1年利息收入僅53,250元，平均1個月只有4,437元，不過，若將相同的資金，買進可配息7%的股票，1年不僅會有35萬元現金股利，平均每個
    Boston2.9萬元，未來甚至還有「資本利得」的收益可以期待。


    買進殖利率7%的股票，除了有豐沛的「現金股利」之外，未來還有機會賺「資本利得（價差）」，這是我長期在台股投資上的研究心得，並且命名為「7%存股聖經」的投資策略，其投資步驟有4：


    - ①選擇近5年，年年都能配息的股票。②以近5年現金股利的平均值，來計算殖利率。③當現金殖利率來到7%時，買進。④當現金殖利率降到5%時，賣出。


    之所以會選用近5年平均值，而非只看1年的股利，目的是透過拉長時間，平衡一家公司營運的高低落差，畢竟只要能夠年年配息，就代表公司有一定的獲利能力，短暫的股價起伏，可以平常心看待，聰明投資人甚至還可以掌握到低檔布局的契機，這也是我會研究「7%存股」投資方法的原因，因為這蘊藏了「既可賺股利，又可賺價差」的投資機會，而其靈感來源，


    就是2011年那一段聯發科（2454）的成功經驗。


    回顧2011年時的聯發科，當時股價一路從2009年的最高點590元，走跌到最低點221元的過程，投資人如果懂得利用近5年平均現金股利，搭配7%買進、5%賣出的原則，便可精準掌握到聯發科這一段「既可賺股利，又可賺價差」的投資契機。


    整體而言，雖然聯發科2007～2011年的現金股利有高有低，最高是2009年的25.99元，最低為2011年的9元，但在平均值為17.59元的條件下，便可依此設定進出場的最佳時機點，7%殖利率的買進價落在251元（17.59÷0.07），5%殖利率的賣出價則落在351元（17.59÷0.05），如此便可創造即使不看盤，也能輕鬆獲利40%的投資績效。


    ### 2007～2011年聯發科（2454）現金股利


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_273_0.png)


    說明：7%殖利率251元，5%為351元；資料來源：《投資家日報》


    ### 2009～2012年聯發科（2454）股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_274_0.png)


    資料來源：CMoney 資料整理：《投資家日報》


    7%存股聖經的投資策略，不僅成功抓到2011年聯發科股價自谷底翻揚的契機，即使套用在2014～2017年间的股價走勢，同樣適用。


    2012～2016年聯發科的現金股利，分別為8.99元、15元、21.99元、11元以及9.5元，在近5年平均值為13.3元的基礎下，7%殖利率的買進價，將落在190元（13.3÷0.07），5%殖利率的賣出價，將落在266元（13.3÷0.05）。


    ### 精選基金 2-11


    ### 2012～2016年聯發科（2454）現金股利


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_275_0.png)


    說明：7%殖利率 190元，5%為266元；資料來源：《投資家日報》


    姑且不論基本面與產業面的分析，聯發科股價自2014年時的最高點545元走跌以來，市場許多投資人都在尋找危機入市的時機，投資人若能掌握7%存股聖經的投資策略，即使不看盤，也能輕鬆掌握到這一波聯發科「買低賣高」的最佳時機。此外，雖然7%殖利率買進價190元，與聯發科這波最低價的192元，還相差了2元，但5%殖利率賣出價的266元，與這波聯發科2017年6月以前的最高價274元，幾乎相差不遠，再度印證了這套投資策略的可信賴度。


    ### 2013~2017年聯發科 (2454) 股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_276_0.png)


    資料來源：CMoney 資料整理：《投資家日報》


    ### 騰取最大獲利 緊守「3%賣光」原則


    存股聖經的投資策略，其實還有一個完整版的內容，除了7%買進、5%賣出之外，殖利率若降到3%，除非公司基本面出現結構性改變，否則賣光光將是保存最大獲利的最佳選擇。


    ### 完整版「7%存股聖經」投資策略


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_277_0.png)


    資料來源：《投資家日報》


    舉例來說，聯發科在2014年5月期間，股價衝上500元以上的價位時，當時市場不僅有高達13家外資機構發表關於聯發科的分析論點，投資評等更涵蓋了「買進」、「加碼」、「中立」、「賣出」等不同方向，甚至連目標價的高低差異，也相差了269元，最高為里昂證券的640元，最低則是港商聯昌證券的371元。


    面對琳瑯滿目的外資報告，我認為，投資人只要學會合理評價股票的方法，哪一家外資說了什麼話，其實一點都不重要。

