    # 當巴菲特遇上彼得林區


    曾經有人問過股神巴菲特，在企業評價各項指標中，若只能選擇1個財務數據做為最重要指標，他會選擇什麼？巴菲特毫不'
  - '[PAGE 265]


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_265_0.png)


    考慮地回答：「股東權益報酬率（Return On Equity，英文簡稱ROE）。」


    ROE的重要性是，它是所有財報分析比率中，唯一可以對企業營運做出全方位評量的指標。


    而一家公司能夠長期維持優良的股東權益報酬率（至少15％以上），代表公司在行銷部門（淨利÷銷貨收入）、生產部門（銷貨收入÷總資產），以及財務部門（總資產÷股東權益），都能維持良好的績效運作，自然就能夠帶給投資人長期穩定且豐沛的收益。


    巴菲特偏好長期擁有高ROE企業的選股邏輯，同樣獲得《財富》雜誌的研究支持，在1977～1986年合計1,000家樣本企業中，能夠連續10年創造平均ROE 20％，並且沒有一個年度低於15％者，只有25家企業，進一步追蹤股票績效表現，有高達24家優於同期S&P
    500的表現。


    由於ROE是所有財報分析比率中，唯一可以對企業營運做全方位評量的指標，能夠創造高ROE表現的背後，自然就容易帶給投資人豐沛的收益。


    除此之外，「股東權益報酬率」與「盈餘成長率」的高低，又會牽涉到合理「本益比」的推估，因此可以合理延伸出一種選股與投資策略，我命名為「當巴菲特遇上彼得林區」，其選'
