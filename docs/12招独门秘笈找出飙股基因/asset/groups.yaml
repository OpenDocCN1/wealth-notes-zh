    「我們在這方面提出了創新的解決方案，讓台積電看到優點，開啟了雙方合作機會，」許金榮接著說，作為半導體設備廠商，最後10分鐘的進度，需要花費90%的經歷，中間不只需要解決技術問題，還有控制的議題，如果沒有台積電齊心共力，不可能設計出如此完整、高生產效率與高精準度的設備機台，「過去台灣廠商最大優勢，在於成本控管優於國際大廠，但現在即使比設備的精密與良率，我們也處在領先地位。」他語帶自信地闡述。


