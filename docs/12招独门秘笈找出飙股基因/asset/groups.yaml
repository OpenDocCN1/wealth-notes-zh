    ### 當巴菲特遇上彼得林區


    曾經有人問過股神巴菲特，在企業評價各項指標中，若只能選擇1個財務數據做為最重要指標，他會選擇什麼？巴菲特毫不


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_265_0.png)


    考慮地回答：「股東權益報酬率（Return On Equity，英文簡稱ROE）。」


    ROE的重要性是，它是所有財報分析比率中，唯一可以對企業營運做出全方位評量的指標。


    而一家公司能夠長期維持優良的股東權益報酬率（至少15％以上），代表公司在行銷部門（淨利÷銷貨收入）、生產部門（銷貨收入÷總資產），以及財務部門（總資產÷股東權益），都能維持良好的績效運作，自然就能夠帶給投資人長期穩定且豐沛的收益。


    巴菲特偏好長期擁有高ROE企業的選股邏輯，同樣獲得《財富》雜誌的研究支持，在1977～1986年合計1,000家樣本企業中，能夠連續10年創造平均ROE 20％，並且沒有一個年度低於15％者，只有25家企業，進一步追蹤股票績效表現，有高達24家優於同期S&P
    500的表現。


    由於ROE是所有財報分析比率中，唯一可以對企業營運做全方位評量的指標，能夠創造高ROE表現的背後，自然就容易帶給投資人豐沛的收益。


    除此之外，「股東權益報酬率」與「盈餘成長率」的高低，又會牽涉到合理「本益比」的推估，因此可以合理延伸出一種選股與投資策略，我命名為「當巴菲特遇上彼得林區」，其選


    股條件如下：


    ### 當巴菲特遇上彼得林區的選股策略


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_266_0.png)


    條件1

    近4季ROE

    在20%以上


    條件2

    近4季EPS的本益

    比在10倍以下


    條件3

    近4季

    皆獲利


    資料來源：《投資家日報》


    會有上述的選股策略，主要是考量到，單純就「盈餘成長率」的財報公式來推估一檔股票合理的本益比，在台股實務經驗中會遇到許多限制與盲點，歸結最大原因，就是台灣企業配發現金股利的比率與標準，遠高於歐美企業，容易出現失準的狀況。


    ### 觀股基?? 2-10


    ### 盈餘成長率的計算公式


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_267_0.png)


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_267_1.png)


    > 資料來源：《投資家日報》


    以漢唐（2404）為例，2016年EPS為6.52元、現金股利則為6元，在盈餘配發率高達92%（6÷6.52）的情況下，雖然近4季股東權益報酬率達到23.18%的水準，但在


    此財報公式下，盈餘成長率卻只有1.85%。換言之，若以彼得林區的觀點來看，漢唐合理的本益比只有1.85倍，不僅不符合實務經驗，更會因此忽略了許多被市場低估的好股票。


    雖然有些高配息的股票，會讓盈餘成長率的計算與合理本益比的推估，出現嚴重盲點，不可否認的是，市場中還是有不少股票適合這樣的評價方式，設備股京鼎（3413）就其中之一的例子。


    以2017年第3季財報作為基準點，計算方式如下：


    - ① 近4季ROE＝8.67＋6.75＋10.64＋9.22＝35.28元

    ② 近4季EPS：3.32＋2.62＋4.09＋3.32＝13.77元

