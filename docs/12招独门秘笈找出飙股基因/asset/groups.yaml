    ## 贏家的操作心法：大賺小賠


    最後，我想跟大家分享的是，從客觀數據來看，單純用「季線」作為股票買賣的依據，或者是用獨門秘技第3招所提到的「20週均線」，平均賺錢的勝率其實都不高，大約落在20%～30%之間，換言之，每10次出手，就有高達7次到8次最後是以賠錢收場。


    然而如此低落的賺錢機率，竟然都可以創造出優於大盤同期


    ## 決定投資績效的2大因素：報酬率與勝率


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_200_0.png)


    資料來源：《投資家日報》


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_201_0.png)


    的績效表現，其關鍵原因就在於「大賺小賠」的操作原則，當看對股票時，就要好好抓住例如上銀這樣一路成長的好標的，即使抱股將近1年也無所謂，因為它就是能賺錢；反之，若看錯股票時，就應該適時停損出場。


    此外，股票投資的過程，最後決定賺錢與否的影響因素，不外乎有二，一是每筆投資的報酬率，二是每筆投資的勝率，換言之，想要有好的結果，不是從拉升報酬率著手，就是要從拉高勝率來努力。


    一般而言，技術分析的勝率，雖然部分「好用的技術指標」可以達到50%～60%的成功機率，但大部分技術指標的成功勝率都落在20%～40%之間，因此想要賺錢獲利，就必須掌握每一筆賺錢的報酬率，該賺100%的股票，絕不能在賺10%、20%時，就急著想要獲利了結；只能賠15%的股票，也不能放任虧損擴大


