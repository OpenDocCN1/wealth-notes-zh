    ## 春節加班找飆股

    預收款項藏好股


    除了從現金流量表中的投資活動，可以找到領先指標的飆股基因之外，我還有2個獨門的財報領先指標，可與大家來分享，分別為「春節加班找飆股」與「預收款項藏好股」。

    每年農曆春節，台灣與中國大陸都會有所謂的長假效應，但春節放假的時間，有時會落在1月、有時會落在2月，因此我認為聰明的投資人，可利用每年1、2月營收年增率（YOY）的起伏，窺知一家公司今年營運的成長面貌。


    ## 春節加班趕工 隱藏大漲462%飆股


    舉例來說，2018年春節是落在2月16日，2017年春節是落在1


    月28日，因此從工作天數來看，在不考慮台灣獨特的228假期影響下，2018年2月就會比2017年2月，整整縮減26%的工作天。


    換言之，在縮減26%的工作天之下，一家公司2018年2月份營收較2017年同期衰退，不僅是正常，26%更是觀察的指標，月營收年減26%，或26%上下3%，都屬合理範圍。


