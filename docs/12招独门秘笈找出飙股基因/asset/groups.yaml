    ## 從2個財報數字 找出公司擴產蹤跡


    上述的概念，與我前一本著作《源源不絕賺好股》第2篇第8章「遇見大成長 金牛變明星」內文中，其實有著前後呼應的論證，當時分析指出：在股票市場中可以舉出非常多的例子，說明一檔股票能夠出現「驚驚漲」的上揚格局，公司「基本面大好」一定扮演相當重要的關鍵角色，而基本面大好最直接的證據，其實就是「每月營收大成長」。


    然而對於從事生產製造的廠商而言，「營收大成長」絕對不會憑空而來，必須建立在2個基礎上：下游客戶需求旺盛、本身產能足以支應，兩者缺一不可。


    一般而言，一家公司的訂單狀況，牽涉到客戶的商業機密，大部分公司會選擇語帶保留，盡量避免對外公布太詳細的資訊，所以對投資人而言，除非有內線訊息，否則頂多只能以「大膽假設、小心求證」的方式去推論。因此，在尋找具有「大成長」潛力的股票時，我習慣從公司「擴充產能」的動作，去發現市場還未注意到的蛛絲馬跡。


    這是一個簡單的思考邏輯，對於公司的經營者來講，除非「未來的訂單」已經有把握掌握在手上，否則不會貿然大手筆投入資


    ## 大擴產反應在現金流量表的2大意義


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_216_0.png)


    資料來源：《投資家日報》


    本支出進行產能的擴充，尤其如果該公司過去的經營風格又是以「穩健成長」著稱，此時「大擴產」的意義就更非比尋常了。


    而所謂的「大擴產」，反應在財報上，主要會呈現在2個會計科目上，第一是現金流量表中的「固定資產（購置）」加「預付工程及設備款」，第二則是現金流量表中的「投資活動之現金流量」，兩者的差別，前者是單純擴充自有產能，後者則是包括購併同業的產能。


    以Tesla概念股的貿聯-KY（3665）為例，追蹤2009～2016年固定資產購置（資本支出）的狀況，不難發現後3年出現了明顯


