    ## 跟著飆股 搭上複利的財富列車


    不輕易放棄股價已突破歷史新高的好股票，是我近幾年從實務經驗中，深刻體驗到的投資心法，並且具體反應在「停損不停利」的操作紀律上，堅信停損是為了保存實力，而不停利則是為了創造複利的財富效果。當然，要能創造複利的財富效果，不要輕易放棄正在漲，或股價已突破歷史新高的好股票，就會是必要條件了。


    或許有許多讀者會問，一檔股票從10元漲到300元，會不會太誇張了？


