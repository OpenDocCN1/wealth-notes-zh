    # 搭配均線糾結 投資更有效率


    在了解大數據分析的客觀驗證之後，再來檢視老牌的家電廠大同（2371）。


    大同的股價從2016年8月時的5.2元，一路狂飆到2017年2月的20.65元，波段漲幅達到驚人的297%，分析大同能夠出現如此慄悍的漲勢，一方面歸功於2017年的董監改選，另一方面股價長期「遠低於」每股清算價值，更是一大關鍵。


    以大同2016年第3季的財報為例，總資產為2,402億元、總負債為1,511億元、應收帳款與票據為110億元、存貨為173億元、長期投資（大數據版）為69億元，因此可計算出清算價值為539億元（2,402億−1,511億−110億−173億−69億），以股本233.95億元計算，發行股數為23.395億（股本×0.1），換算下來，大同的每股清算價值為23.04元（539億'
