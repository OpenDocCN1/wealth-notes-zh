    # 4大理由 證明萬點將是常態


    不過，我在2017年3月卻大膽提出：這次台股的萬點，會站得穩且站得久，直到投資人開始「習慣萬點」。


    習慣萬點的概念，其實是源自行為心理學中的「21天效應」，說明一個新習慣的養成，至少要經歷21天的時間，才能從「刻意、不自然」塑化成「刻意、自然」，最後內化成為「不經意、自然」的習慣。


    當時支持我認為台股投資人要開始「習慣萬點」的理由有下面4個。


