    資料來源：CMoney法人系統 資料整理：《投資家日報》


    ## 飆股基因③：股價創新高


    第3個飆股基因是，要搭配股價創歷史新高的條件，因為從籌碼面來看，一檔股票的股價若能突破歷史新高，除了代表過去所有買這檔股票的投資人，目前都呈現賺錢的局面之外，更透


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_63_0.png)


    露這檔股票在未來沒有任何「解套」的賣壓，非常容易引爆出一段「上漲無壓力」的飆漲走勢，就技術分析中的波浪理論來看，許多人稱之為「邪惡的第5波」，但我認為，這是投資飆股過程中，能夠創造出驚人收益的最重要階段。


    波浪理論是美國投資大師艾略特（Ralph Nelson Elliott）於1946年所提出，他認為，股價走勢都具有一定的韻律與型態，基本上包含了5波的上升趨勢（下圖1、2、3、4、5），與3波的下降趨勢（下圖a、b、c），其中第5波雖然是上漲的末升段，但在實務經驗中，卻也常常是漲勢最「無法無天」的一段。


    其關鍵的原因，我認為與「上漲無壓力」有關，而一檔股票也只有在股價突破歷史新高的時候，未來才能在沒有任何解套賣壓的情況下，出現這所謂的邪惡第5波。


    ## 波浪理論：5波上升趨勢與3波下降趨勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_63_1.png)


    資料來源：《投資家日報》


    舉例來說，半導體設備股的京鼎（3413），2016年2月19日股價突破2008年106元的歷史新高之後，後續股價飆漲的速度不僅加快，僅1年多時間，股價就竄升至289.5元，大漲超過173%，充分顯示邪惡第5波的驚人力量。


    ## 2008～2018年半導體設備龍頭：京鼎（3413）股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_64_0.png)


    > 資料整理：《投資家日報》


    談到京鼎，就不得不提到所屬的半導體設備產業，同樣屬於未來的趨勢產業，其舵轄是，中國扶植半導體的政策決心，不僅符合「過去」沒有，「現在」開始有，「未來」會有許多的條件，更將讓台灣半導體設備廠商，成為第1波最大受惠的族群。


    2006年中國就已經躍升為全世界半導體IC的最大消費國，占


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_65_0.png)


    比已達全球需求的41%，半導體設備需求所衍生出來的「在地化生產」，顯然出現了明顯的落差，以2014年底的資料顯示，中國大陸半導體的自給率僅為26%，換言之，目前仍有高達74%的需求，要仰賴從國外進口，每年進口值更高達2,300億美元。


    為了解決IC產業極度仰賴國外進口的結構問題，2014年6月中國政府頒布了《國家集成電路產業發展推進綱要》，除了延續租稅優惠之外，更透過成立1,200億人民幣（約台幣6,100億元）的「投資」基金，而非「發展」基金，一改過去政府只是旁觀者的角色，成為直接的參與者，來推動中國半導體的整併與發展，並規畫「進口替代」的時程表，期望2020年時，中國內需IC的自給率可以達到40%，2025年時一舉完成70%的政策目標。


    ## 中國大陸半導體「進口替代」政策目標時間表


    - 2014年 — 中國IC自給率為26%

    - 2020年 — 中國IC自給率達40%

    - 2025年 — 中國IC自給率達70%


    資料來源：《投資家日報》


    中國政府推動半導體的進口替代，目前響應的地方政府已包括北京、上海、四川、山東、安徽、天津、江蘇濱海、武漢與瀋陽等地，政府與民間合計參與的投資金額，預估將上看1.2兆人民幣（約台幣6兆元）。


    姑且不論中國大陸是否有足夠的能力來發展進入門檻比「光電面板」高上許多的半導體產業，但在國家政策推動下，未來10年，中國大陸的半導體建廠需求，勢必會如雨後春筍般冒出，並且成功推升相關設備產業的需求，至於台灣的半導體設備廠商，有機會受惠嗎？


    關於這個問題的答案，讓我想起先前獨家專訪漢微科（3658）董事長許金榮的內容，當時他分析說：「在台積電的帶動下，近幾年台灣半導體設備支出呈現扶搖直上的增長，但全球半導體製程的設備市場，合計有高達50%都掌握在ASML、AMAT與TEL等歐、美、日大廠手上，因此國內設備廠商能受惠者寥寥可數。」


    上述情況直到2009年之後，開始有了一些轉變，關鍵在於台灣半導體的製程設備，如果必須仰賴國外大廠，將不利於長遠發展，尤其主要競爭對手韓國三星，近年來積極扶植本土的設備廠商，使韓國半導體製程設備的自製率已達20%，預計2020年將可提高到50%，未來韓國若進一步完成供應鏈的整合，將


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_67_0.png)


    對台灣廠商造成巨大的競爭壓力。


    有鑑於此，台積電從2009年開始，積極尋找在國內可以共同合作開發製程設備的廠商，並且培育出一批台灣半導體設備產業的藏寶圖商機。


