    ## 第12招


    ## 神奇公式

    年年可赚40%


    不斷精進選股策略的效率，是我這幾年投資研究的重心，其中年年賺40%的「葛林布雷神奇公式」更是獨家秘技。


    談到葛林布雷（Joel Greenblatt），稍微簡單介紹一下他的背景，他是美國哥倫比亞商學院的教授，同時也是戈坦資本投資（Gotham Capital）創辦人，最令世人津津樂道的是，他在過去20年期間創造出平均40%報酬率，遠勝過巴菲特的投資績效。


    ## 3步驟計算 挖出好公司股票


    過去，我在投資組合的規畫上，也曾參考過葛林布雷的研究心得，他認為：只買1檔股票無法分散任何非系統風險，但若


    持有2檔股票，就可消除46%的非系統性風險，若提高到4檔股票，72%的非系統性風險可被消除，提高到8檔，將減少81%的非系統性風險，若投資人一次買進500檔股票，99%的非系統風險都可被消除，換言之，投資人只會面臨到系統風險。


    從非系統風險來看，持股4～8檔已經降低了72%～81%的風險，但投資組合的報酬仍會產生13%～25%的差異，葛林布雷指出，若大盤預期年化報酬率為10%，持有5檔股票，1年後約有三分之二的機率投資報酬率會落在負11%～31%之間；持有8檔股票的投資組合，1年之後報酬率有三分之二的機率會落在負10%～30%之間，換言之，即使投資組合中少了3檔股票，持有5檔股票與8檔股票的投資組合，1年後的報酬率其實差不了多少。


    上述觀點，也是我認為一般投資人最適合的持股數量，應落在5檔的原因，這將是「風險」與「報酬」之間最佳的平衡點。


    持股家數與風險的關係


    | 持股家數 | 可消除的非系統風險（％） |

    |---|---|

    | 1 | 0 |

    | 2 | 46 |

    | 4 | 72 |

    | 8 | 81 |

    | 16 | 93 |

    | 32 | 96 |

    | 500 | 99 |


    資料來源：Joel Greenblatt，《You Can Be a Stock Market Genius》


    此外，葛林布雷在其著作《You Can Be a Stock Market Denius》一書中，曾分享他之所以能夠創造出驚人報酬率，完全歸功一個神奇的財務公式，透過「盈餘報酬率」與「資本報酬率」的評量與計算，將美國3,500多家的企業，統整出一個排行榜，排名越前面的公司，就越具有投資價值。


    ## 神奇公式的內涵


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_289_0.png)


    資料來源：《投資家日報》


    先來了解「盈餘報酬率」的計算方式，考量每家企業的稅率不盡相同，選取企業盈餘時，一律採用稅前淨利，此外，為了更貼近公司營運的現況，我做了些許的調整，稅前淨利不以前一年度為代表，而是改用最近4季的總和。


    再者，企業價值（Enterprise Value）的計算方式為：市值＋利息費用＋長期負債＋特別股；有了稅前淨利再除以企業價值，


    便可得「盈餘報酬率」。


    基本上，與本益比的概念有點像，差別就在於「分子」，盈餘報酬率是稅前淨利、本益比是稅後淨利，而分母，前者除了市值之外，還多加長期負債與特別股，更能呈現一家公司資本運用的完整面貌。


    ## 盈餘報酬率的計算方式


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_290_0.png)


    資料來源：《投資家日報》


    完成「盈餘報酬率」的排名僅是第一步，因為葛林布雷的神奇公式，還必須考慮「資本報酬率」的排名，兩者相加的排序，才具有發掘潛力股的客觀因素。根據葛林布雷的定義，資本報酬率的計算方式為：稅前淨利÷（淨營運資本＋淨固定資產），淨營運資本是利用流動資產減去現金後得之，淨固定資產則是考量折舊後固定資產的總值。


    ## 資本報酬率的計算方式


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_291_0.png)


    資料來源：《投資家日報》


    完成了「盈餘報酬率的排名」與「資本報酬率的排名」，最後一個步驟是將兩者排名相加，合計數值越小者，總排名就越前面；分數越高者，總排名就會越後面。就好比一個學校有1,500位學生參加學測考試，英文成績有英文成績的排名，數學成績也有數學成績的排名，就實務經驗不難發現，英文考得好的學生，數學不一定考得好。


    因此為了完整呈現每一位學生「全方位學習」的成果，將


    兩項成績的排名相加後，得出最後的分數，便可作為評比的標準，舉例來說，英文排名第1的學生，假如數學排名滑落到第100名，最後的總排序，會落後給英文與數學都排名在第50名的學生，因為前者的分數是101分（1＋100），後者的分數是100分（50＋50）。


    ## 葛林布雷神奇公式3步驟


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_292_0.png)


    > 資料來源：《投資家日報》


    ## 買在股價低基期 享受高成長果實


    使用葛林布雷這套選股邏輯，同時考量公司賺錢品質及市值（股價）變化，最大的好處，就是可以找到具有獲利、股價又在低基期的好公司，畢竟在正常情況下，「高獲利」與「低股價」本不該在同一邊的天平上，若能透過一個財報公式，快速篩選出符合標準的股票，自然可大幅提高投資勝率。


    葛林布雷年年賺40%的神奇公式，不僅是我能夠長期挖掘潛力好股的重要參考指標，更是截至今日為止，台股中最獨家的投資策略，並且成功運用在許多潛力好股的投資上。


    舉例來說，2013年10月透過「盈餘報酬率」與「資本報酬率」2項財務指標，篩選出值得投資人留意的潛力好股，其中名列A段班的廣隆（1537），更是我印象深刻的一家企業。


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_293_0.png)


    之所以會印象深刻，是因為廣隆光電生產的鉛酸電池，是一個再成熟不過的產業，回顧人類使用鉛酸蓄電池，甚至已有百年歷史，然而，看似傳統且高度成熟的產業，98%營收皆來自


    於鉛酸蓄電池的廣隆光電，卻可繳出營收連續18年成長的佳績，2012年每股稅後淨利更寫下7.78元的歷史紀錄。


    更難能可貴的是，近年當全球電池產業的廠商，都瘋狂投入鋰電池的開發時，董事長李耀銘卻展現高度理性的經營態度，一句「做鋰電池還不會賺錢」的思維，非但沒有貿然投入大量資源進行鋰電池開發，反而逆勢擴大在鉛酸電池的生產線與產能，李耀銘這個決定，讓廣隆即使身處最傳統的產業，依然可以繳出令人驚豔的營運績效，並激勵股價在往後18個月內，一路從62元大漲到165元，實現年年賺40%的獲利目標。


    ## 2013～2015年廣隆（1537）股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_294_0.png)


    資料來源：CMoney 資料整理：《投資家日報》


    2016年9月，我也透過這個年年賺40%的神奇公式，挖掘出當時總排序同樣在A段班的企業——普萊德（6263），並藉由獨家專訪普萊德董事長陳清港的過程，完整分析這家公司的長線投資價值。


    當時分析指出，成立於1993年的普萊德，主要從事網路通訊產品的製造與研發，除了以自有品牌Planet行銷全球，2004～2015年期間，更連續12年獲得《台灣精品獎》的肯定。


    不同於台灣大多數的科技廠商，企業獲利容易受到全球景氣起伏的影響，普萊德自1996年以來，即使經歷過2000年美國網路泡沫、2003年SARS危機、2008年金融海嘯，與2011年美債風暴等系統性風險，依然能夠創造出「年年獲利」與「不曾虧損」的營運紀錄。


    其中，2000～2011年雖然EPS獲利呈現逐年下滑的趨勢，一路從6.93元，衰減到6.11元、5.34元、4.31元、2.74元與1.51元，但2011年以後，由於專注在利基型市場，加上不斷提升高毛利產品比重的營運策略，讓EPS止跌回穩，更開始節節高升，一路從最低時的1.51元，上升到2012年2.62元、2013年3.2元、2014年4元與2015年4.26元。


    ## 普萊德（6263）歷年EPS表現


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_296_0.png)


    資料來源：《投資家日報》，2016/09/20


    值得一提的是，這幾年台灣網通廠商，除了中磊（5388）與普萊德之外，其他公司不僅陷入紅色供應鏈崛起的競爭威脅，更反應在獲利節節敗退的表現上，以正文（4906）與友訊（2332）為例，2011～2015年的EPS分別呈現3.01元、1.48元、0.23元、0.69元，與1.24元、1.04元、0.09元、-2.9元的衰減；反觀普萊德同期獲利，卻繳出逆勢成長的好成績，背後一定有產品定位正確，或已建立技術門檻的原因。


    ## 剖股基準 2-12


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_297_0.png)


    照片來源：《投資家日報》


    2016年9月我透過葛林布雷年年賺40%的神奇公式，挖掘出普萊德，經歷16個月時間的市場驗證，股價不僅一路從47.25元上漲至目前最高點的71元，若再考量3.9元的現金股利之後，波段漲幅也達到58%，完全符合「年年要賺40%」的獲利目標。


    ## 2016～2018年普萊德（6263）股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_298_0.png)


    資料來源：CMoney 資料整理：《投資家日報》


    總結而論，使用葛林布雷這套選股邏輯，由於同時考量公司賺錢的品質，以及市值（股價）的變化，最大的好處，就是可以找到具有獲利、股價又在低基期的好公司，容易具體實現年年賺40%的獲利目標。


