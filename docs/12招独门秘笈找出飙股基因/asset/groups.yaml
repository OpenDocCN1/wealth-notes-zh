    再者，留下長長下影線紅K棒所蘊藏的底部訊號，近幾年最經典的案例，就是台灣加權指數2015年4月27日當週從10,014點開始暴跌，直到同年當週8月24日出現留下長長下影線的紅K棒之後，就此確認7,203為這波修正走勢的底部位置。'
