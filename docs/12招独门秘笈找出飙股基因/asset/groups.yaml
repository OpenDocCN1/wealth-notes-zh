    ## 高點停利的

    3個策略


    在股票市場越久，就越讓我深刻體驗一個道理：獲利根本不需要著急，它只不過是一個時間累積的過程。財富要增長，重點只有一個，就是要透過不預設高點的投資策略，抓緊並搭上「複利」的財富列車。


    抓緊複利的財富列車，其實與歐洲股神科斯托蘭尼（André Kostolany）所主張的「雞蛋理論」有異曲同工之妙。科斯托蘭尼綜合畢生的投資精華，認為一檔市場中所述的「飆股」，在上漲的過程中，會經歷3個階段：初升段、主升段與末升段。


