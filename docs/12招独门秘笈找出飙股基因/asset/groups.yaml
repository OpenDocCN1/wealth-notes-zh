    ## 1994~2018年宜進（1457）月線走勢圖


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_72_0.png)


    資料來源：CMoney 法人系統 資料整理：《投資家日報》


    前3次宜進股價在15元附近時，成交量都不小（3次累積的成交量高達76.6萬張），因此2017年雖然受到本業轉好、業外又大進補的利多，股價呈現穩步走揚的趨勢，但累積長達17年等著解套的籌碼，都讓這一波宜進的上漲走勢，在15元附近的價格就遇到沉重賣壓。


    不過話說回來，一旦宜進未來股價能夠成功化解並突破15元的天花板，不僅在技術分析上，將打岀一個結構非常扎實的底部，更容易引導後續的股價，出現一波上漲無壓力的走勢。


    ## 投資飆股最高境界 用複利將獲利極大化


    市場有許多飆股，在飆漲的過程中，可能因為籌碼的因素，可能因為題材的認同度，而完全脫離基本面可判斷的方向，因此聰明的投資人，在面對這個類型的股票時，與其去預測高點，還不如跟著多頭行情順勢而為，如此才能將獲利極大化。


    舉例來說，一檔股票以10元的成本買進，一根漲停板的報酬率，就是10%，如果持股續抱到20元，那一根漲停板的報酬率，就


    可以翻倍到20%，以此類推，抱到100元，一根漲停板的報酬率就是100%，200元則跳升到200%，300元則暴增到300%。


    換言之，如果投資人只以賺50%為目標，股價漲到15元就心滿意足地賣出，不但可能會錯過獲利最豐厚的那一段走勢，更會錯失透過「複利」來累積財富的機會。


