    至於最早一次的月K連6紅，則是發生在1988年4月～1988年9月期間，當時指數從3,373點狂飆到8,402點，雖然一度讓市場投資人戒慎恐懼，月成交量縮到只剩下1.06兆元，但僅歷經4個月的回檔修正，便又再開啟了一波上漲到12,682點的萬點行情。


