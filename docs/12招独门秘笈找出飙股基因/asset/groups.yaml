    ## 成為贏家關鍵：掌握核心技術、監控品質


    簡單來說，關鍵原因有二：①致力掌握最上游的抽絲技術、②抽出來的絲，必須經由科學儀器檢測，一方面客觀證明品質，另一方面還可作為再精進的依據。


    一般而言，紡織品的製造會經歷原料、抽絲、紡紗、纖布、


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_95_0.png)


    染整的過程，其中從原料抽絲而成的原絲，更是決定最終產品品質的關鍵，「如果上游廠商只願給你一般漁網用等級的原絲，最後的產品一用就斷。」王昭仁點出為何必須投入抽絲技術的開發。


    此外，即使掌握了抽絲技術，但「品質」不穩定，也會造成公司財務與商譽上的損失，因此王昭仁為了確保品質，不惜重金從日本進口檢驗設備儀器的拉力機，以當時耀億的規模，拉力機的投資是一筆非常大的支出，但王昭仁心裡卻明白，有了這台可以檢查延伸度、強力與拉力的機器，才能確保生產出來的線，可以符合下游不同客戶對品質的要求。


    掌握最上游的抽絲技術，才能在不受外人控制的情況下發展各項產品，此外，科學的檢測儀器，則是做為生產過程中再進化的依據。因為掌握了最上游的技術，耀億才能從容應變過去40多年來下游產品的劇烈變化，也因為有科學儀器檢測，才能讓耀億透過不斷修正，達到最後完美產品的水準。


    耀億不是單獨的例子，幾年前我獨家專訪亞洲第1大、全球第3大的健身器材集團喬山（1736）董事長羅崑泉，也看到相同的發跡過程。


    「1975年跟太太兩個人，離開了原本安穩的海關工作，並花光了所有積蓄創立喬山，憑藉的就是一股I can do anything


    ## 獨家專訪 喬山（1736）董事長羅崑泉


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_96_0.png)


    圖片提供：《投資家日報》


    （我能做任何事）的意念，」羅崑泉回憶說，因此當6個月之後，接到第1筆啞鈴的訂單時，雖然當時完全不知道什麼叫做「dumbbell」，但透過不斷走訪20幾家廠商的過程，不僅逐漸摸索出啞鈴的生產流程，更掌握到3年後成為全球最大供應商的競爭優勢。


    他進一步解釋，當時所有代工廠的生產成本至少每公斤要30元以上，但喬山的成本卻可以降到7.5元，即使1公斤賣16元，獲利也超過1倍。羅崑泉接著說，能夠大幅降低成本的關鍵有二，一是將過去依賴老師傅經驗的師徒制生產方式，改為標準


    化的生產流程，一個人只要學會5個動作，2個小時後就可以上線，此舉不但有效降低了人力成本，更確保了產品大量製作的品質。


    其次則是，一改過去依賴國內供應商的模式，直接到巴西原產地進口原料，得以讓原料成本大幅下降。喬山創業初期，憑藉著標準化的生產流程，並透過直接掌握最源頭的原料，僅花3年時間，就從無到有成為全球最大的啞鈴生產商。


    看到耀億與喬山成功的故事與背後的原因，讓我有種心有戚戚焉的感觸，因為股票投資何嘗不是如此。


    ## 成為贏家的條件


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_97_0.png)


    資料來源：《投資家日報》


    ## 透過大數據分析 找出投資獲利策略


    股票市場瞬息萬變，讓許多參與的人不知所措，心情甚至七上八下，然而，如果投資人能夠拋開市場的紛紛擾擾，正本清


    源地致力在掌握「最上游的技術能力」，那麼即使面對行情的劇烈變化，依然能夠從容應對、獲利賺錢。


    什麼是股市中最上游的技術能力，說穿了，就是「買低賣高」這4個字，然而，何謂「低」，何謂「高」，不同的分析師會有不同的主觀見解，但我認為，不管「主觀見解」為何，都必須透過「客觀數據」的驗證，當具有「可測量」與「可信賴」的標準之後，才能形成有用的策略，甚至再進化的依據。然而，主觀的選股邏輯，要如何通過客觀的回測驗證？統計學中的「醉漢回家理論」，提供了一個參考依據。


    醉漢回家理論的內容如下：有一個喝酒喝到不知方向的醉漢，往前走7步，可安全回到家，往後走7步，就會掉入懸崖，假設往前走與往後走的機率各為50%，醉漢最後安全回到家的機率為50%，然而，如果往前走的機率為40%，往後走的機率為60%，最後醉漢能夠安全回到家的機率，就只剩下5.53%。


    第一次看到上述這種從50%掉到5.53%的統計結果時，確實大感意外，因為若以這樣的機率運用在股票投資上，不管是採用何種分析內容，如果平均賺錢的機率只有40%，那最後成為贏家的機率，也將掉到只剩下5.53%。


    會讓我感到意外的原是，綜觀目前市場中，許多分析師甚至媒體推廣的各項投資策略，賺錢機率鮮少能超過60%，例如


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_99_0.png)


    利用「K線變化」、「均線概念」、或「成交量放大」等判斷多空的分析策略，有些勝率更只有40%、30%、甚至20%。


    因此自然可以解釋，為何一般投資人很難在股市中長期獲利，畢竟如果無法進一步搭配「大賺小賠」的投資紀律，最後運用這些方法的投資人，能夠晉升股市長期贏家的機率，其實只有5.53%。


    反之，如果投資人採用的是賺錢勝率超過60%的策略，長久下來，在機率高達94.47%（100−5.53＝94.47）的情況下，自然能夠成為市場中的常勝軍。


    換言之，醉漢回家的理論所呈現的統計結果，讓我更加確認一件事，就是任何一筆投資分析，只有在平均勝率可超過60%的情況下，才有進場布局的理由，唯有如此，才能真正晉升到


