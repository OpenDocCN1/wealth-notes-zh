    # 步驟① 計算近5年現金股利平均值


    2009～2013年期間，由於聯發科營運有高有低，反應在現金股利配發上，也呈現出營運好時，能夠每股配發25.99元，營運衰退時，現金股利只剩下8.99元的狀況。


