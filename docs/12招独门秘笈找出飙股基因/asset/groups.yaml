    上述的投資策略，不僅在這幾年的實務經驗中，展現出100%賺錢的勝率，更讓我收穫匪淺，此外，由於簡單到幾乎所有投資人都可以輕鬆學會，我將之命名為：一輩子都不用再為錢煩惱的贏家祕技。


    ## 2016～2018年台灣50正2（00631L）走勢與KD指標


