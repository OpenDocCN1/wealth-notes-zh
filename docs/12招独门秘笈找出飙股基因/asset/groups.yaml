    # 策略③：月KD在80以上死亡交叉


    就波段操作者而言，月KD是我認為非常具有參考價值的技術指標，尤其當月K來到20以下，通常都代表股價已經歷一段較大的跌幅，或者是較長時間的整理，因此若進一步搭配與月KD值呈現黃金交叉，股價後續自然容易出現大漲的行情；反之，月KD在80以上出現死亡交叉，同時又出現在「多頭的強勢股」身上，通常有非常高的機率，代表股價即將「由多翻空」。


    以大立光（3008）為例，追蹤2016～2017年這一波股價從1,790元起漲到6,075元、股價大漲239%的過程，直到2017年'
  - '[PAGE 90]


    9月，月KD指標才明顯在88附近出現「死亡交叉」，因此對外部投資人而言，不僅可用來判斷大立光這一波的多頭走勢已經正式結束，更可視為股價「由多翻空」的重要訊號。換言之，以2017年9月的收盤價5,375元計算，投資人若能適時停損與停利，將可成功躲過後續股價暴跌到3,000元的負面衝擊。


