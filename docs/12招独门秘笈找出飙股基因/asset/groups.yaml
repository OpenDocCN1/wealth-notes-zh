    ## 危機入市3部曲

    100萬變8600萬元


    危機入市選股法，一直是我長期能夠創造優異投資績效的重要策略之一，其靈感來源，除了源自於股神巴菲特（Warren Buffett）之外，多次成功運用在台股操作上，更是讓此策略日益成熟的關鍵所在。


    股神巴菲特曾說過，他一生中受到兩位啟蒙老師的影響，其中85%是來自於班傑明·葛拉漢（Benjamin Graham），學習到價值型投資與危機入市的賺錢技巧，另外15%則是源自於菲利普·費雪（Philip
    Fisher），掌握到成長股投資的精髓。


    整體而言，我這幾年鑽研的投資策略，大多從這3個面向出發，當然，在考量台股投資的實務經驗之後，會作一些調整與


    變動，以符合一般投資人都可以遵循與學習的步驟。


    舉例來說，危機入市選股法就是一個非常成功的案例，從企業經營的角度切入，並且參酌技術分析的觀點，形成截至今日為止，績效表現最為驚人的贏家策略。


    ## 撿到危機入市最佳時機


    為了避免「危機入市」投資策略最後「接到正在下墜的刀子，滿手是血」，因此我主張，任何一檔股票如果遇到麻煩而造成股價重挫時，絕非進場撿便宜的最佳時機。我從多年來走訪上市櫃公司的經驗中觀察到，任何一家公司要走出當前的營運麻煩，絕對不可能在明天、或是下個月，甚至1年內就看到解決麻煩的成果。


    在「解決麻煩需要時間」的條件下，真正危機入市的最好時機，是等到麻煩出現後的1～2年，才會出現真正的投資契機。


    此外，在技術分析方面，當一檔股價跌深時，短、中、長期（月線、季線、半年線、年線）均線會呈現「空頭排列」的走勢，此時投資人若選擇進場布局，一方面股價還有持續破底的風險，另一方面，公司解決麻煩需要時間，因此即使投資人接到股價的最低點，也需要花很長的時間來等待公司營運走出麻煩，並且重返榮耀。


    因此，聰明的投資人，不如等到短、中、長期均線呈現「均線糾結」的情況時，再來進場，將可有效避免上述兩種情況。


    ## 危機入市3部曲


    跌深

    因遇到麻煩，造成股價重挫

    技術面：空頭排列


    整理

    解決麻煩的過程需要時間

    技術面：均線糾結


    進場

    度過麻煩，營運重返榮耀

    技術面：多頭排列


    買在跌深後的均線糾結，賣在多頭排列時


    舉例來說，電聲元件大廠美律（2439）股價從2014年3月最高點195元走跌的過程，短、中、長期均線就是呈現非常明顯的「空頭排列」架構，想要危機入市的投資人，必須得忍受100元不是底、50元也不是底的鉅額虧損，因為直到2015年8月股價


    來到30元時，才見到波段的最低點。


    換言之，以波段跌幅高達84%來看，不管在任何一個時機選擇進場布局，最後的結果，可能都是「接到正在下墜的刀子，滿手是血」。


    然而，聰明的投資人如果能等到2016年5月，當月線、季線、半年線與年線大約在58元附近均線糾結時，再來「危機入市」，其最後的結果，就是無需多久時間，就享受到股價開始噴出的喜悅，一路飆漲到2017年8月最高點的255元，1年多的時間，可獲得超過339%的投資報酬。


