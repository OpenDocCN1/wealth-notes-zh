    # 2個領先指標

    揀出起漲前的成長股


    許多人總認為，不管是每個月10日上市櫃公司所公布的營收數據，或是大約每3個月公布的季報內容，都只是反映一家公司過去1～3個月的營運狀況，從時間邏輯來看，公布的財報似乎只能代表「落後指標」，並不是具有可以發掘「未來」股價動向的「領先指標」。


    平心而論，就我這些年對財報分析的了解與領悟，目前上市櫃公司定期公布的損益表、資產負債表，甚至現金流量表等財報，林林總總各項會計科目中，確實有高達95%以上的科目都是屬於落後指標，對股票投資的參考意義不大，其中還包括許多投資人會密切關注的營收、每股盈餘（EPS）、毛利率、淨利'
