    \n既然單純從工作收入要賺到「財務自由」的目標，在現今的台灣已成難事，那又該如何達到呢？或許有錢人的經驗可以當作參考。根據統計，台灣大多數的上班族，薪資所得約占所有收入的95%，但追蹤有錢人（收入最高的前1%）的收入中，薪資所得僅占所有收入的29%，換言之，大多數有錢人的收入來源，都是仰賴「投資收入」。\n\
    \n## 有錢人的所得從哪裡來？\n\n□資本利得 □自營所得 □… □薪資所得 □資本所得\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_16_0.png)\n\
    \n資料來源：朱敬一及研究團隊（引用自《天下雜誌》）\n\n我撰寫此書的目的，就是期望能透過抓住飄股基因的方式，協助所有讀者，不僅晉升到有錢人的行列，更能達成財務自由的目標。\n\
    \n此外，現在台灣人還共同面對一個很嚴重的課題，就是不僅身陷在「什麼都漲，只有薪水不漲」的惡性循環裡，未來還要面對「退休年金不保」、「機器人全面取代」的風險，這些都讓想要認真打拼、想要過上好生活的人備感壓力，因此學會投資這件事，在過去，或許只是為了可以提早實現財務自由的目標，但現在，不學投資，幾乎沒法活了，至少是活得有尊嚴。\n\
    \n「低薪、機器人取代、年金破產」這3大問題，不僅將構成影響台灣經濟結構的3大棘手問題，更會衍生出一個嚴重的後果，就是：因為低薪，所以努力工作也只能糊口（沒有存款），且要隨時面臨工作被機器人取代的威脅（失業危機），即使幸運地熬到可以退休的年紀，但退休金不保的年金問題，更會完全摧毀「老有所養、老有所依」的理想生活，甚至會淪落為日本\n\
    \n## 台灣經濟結構3大棘手問題\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_17_0.png)\n\n資料來源：《投資家日報》\n\
    \n人眼中的下流老人——為了每天都能夠三餐溫飽，必須工作到進棺材前的一天。\n\n## 退休年金不保 破產已成定局\n\n近幾年，年金議題炒得沸沸揚揚，我自2012年花了一些時間，了解各項年金的財務結構之後，便有了徹底覺悟，就是不管哪一種年金、不論如何改革，最後一定會走向破產的命運。關鍵原因有3：少子化的人口趨勢、保費負擔率太低、以及缺口大到政府根本沒有能力撥補等3個結構性問題。\n\
    \n## 勞保走向破產的3大原因\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_18_0.png)\n\n資料來源：《投資家日報》\n\
    \n所謂保費負擔率，指的是為了確保未來可以領到一定額度的年金，現在要繳納多少的金額費用。\n\n以攸關978萬名勞工權益的勞保年金為例，要能夠享有目前的福利標準，保費的負擔率要來到27.84%，換言之，想要在退休後，享有每個月的1萬元的年金福利，在職期間每個月份至少要繳交2,784元才夠。\n\
    \n但2012年時保費負擔率僅8.5%（2017年調整到9.5%，預計2022年再調高到12%），兩者的缺口不僅超過18%，根據主計總處2017年5月計算，潛藏負債已經累積到9.56兆元，與2016年所計算的8.77兆元相比，光是1年時間就大增了7,900億元，以目前中央政府1年總預算僅1.99兆元來看，根本是不可能、也沒能力來填補這個越來越大的缺口，走向破產只是時間早晚的問題而已。\n\
    \n此外，即使政府開始正式面對年金破產的問題，但目前看到的所有改革，也只是延後破產的時間，以教育人員退撫金為例，從2028年破產，延後到2049年；以公務人員退撫金為例，破產時間也只是從2030年延後到2051年。至於如何解決勞保基金2027年破產問題，至今還是一個未解的難題。\n\
    \n## 台灣各項年金破產時間\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_20_0.png)\n\n資料來源：《投資家日報》\n\
    \n## 未來20年 47%工作將被機器人取代\n\n談到AI機器人的快速崛起，是我從2016年底至今在產業研究上的一大課題，雖然挖掘出許多賺錢商機，但也同步看到了威脅的存在，其中最直接的威脅，就是人類沒有工作的那一天，或許真的快來了，根據牛津大學2016年的研究顯示，未來20年，將有47%的工作會被機器人取代。\n\
    \n其中最容易被取代的工作，分別為電話行銷員、房地產資訊蒐集員、保險評估、理賠與估價師、銀行開戶、貸款人員等，其中門市服務員、金融機構行員被取代的機會甚至高達95%，另外，像計程車司機、保全等，也有高達8成的機率會被機器人取代。最不容易取代的工作，依序為按摩師、生化學家、宗教人員、公司董事、監獄教育人員、藝術家等。\n\
    \n即使是目前許多人稱羨的高階人才，包括證券分析師、律師、甚至醫師等，也會面臨被機器人取代的風險，尤其IBM在2016年所推出的「機器人律師」，經實證顯示，有高達90%的準確率，不僅勝過人類律師的70%，IBM更樂觀預估，未來全球律師的人力需求，將只剩下目前的10%。\n\
    \n另一個高階人才被取代的風險，將落在「醫師」這個行業，尤其2017年麻省理工學院將推出「機器人醫生」的產品，倘若在臨床、門診、外科等實務運作上效益不錯，那人類的挑戰才正要開始。\n\
    \n不過話說回來，與其煩惱未來被機器人取代的威脅，不如好好利用現在的時機，賺到不愁吃穿的人生財富，這才是最實際的作法，至於要如何賺，當然就藏在你手中這本尋寶書中了。\n\
    \n要如何脫離上述的困境？我始終認為只有兩個方法，一個是創業，如果有任何好的想法，就要勇於走出舒適圈，透過創業來成就自己的未來，另一個就是學會投資理財，當然如果能中樂透，娶到或嫁給有錢人，也不失為一個更快速的捷徑。\n\
    \n## AI發展將減少人類工作機會\n\n| 排名 | 最容易被取代的工作 | 最不易被取代的工作 |\n|---|---|---|\n| 1 | 電話行銷員\
