    資料來源：CMoney 法人系統 資料整理：《投資家日報》


    相同的狀況，也發生在台股重量級權值股鴻海（2317）身上，追蹤2016～2017年股價自72.5元起漲到122.5元、股價大漲68%的過程，直到2017年9月，月KD指標才明顯在82附近出現「死亡交叉」。


    因此對外部投資人而言，不僅無須理會有某家外資將鴻海目標價上調200元的大利多訊息，更可直接判斷鴻海這波多頭走勢已經正式結束，並且出現了股價「由多翻空」的重要訊號。換言之，以2017年9月的收盤價107元計算，投資人若能適時停損與停利，將可成功躲過後續股價暴跌到79.5元的負面衝擊。


