    上述的觀念使用在工具機大廠上銀（2049）的股票操作上，確實完全體現了「季線是生命線」的價值；2017年5月8日上銀股價收盤在192元，一方面正式超越並站上191.7元季線位置，另一方面則提供投資人買進布局的契機。


    截至2018年4月2日，上銀股價始終未跌破季線（下頁圖的綠色曲線），因此在沒有出現任何賣出訊號的條件下，累積波段漲幅超過122%，確實提供以季線作為買賣依據的投資人豐沛的收益。


