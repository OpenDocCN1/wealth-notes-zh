    再者，2008年由中證股份公司所編製的白酒指數（CS399997），由於涵蓋例如貴州茅台、五糧液等前50大的白酒商，也可視為檢視中國大陸頂級消費的衡量指標，而追蹤此指數2016～2017年的表現，不僅一路從2016年初最低時的2,295，上漲到2017年年初時的3,425，近一年累積上漲的幅度更高達49%。換言之，無論是紅酒指數連續13個月的上漲，


