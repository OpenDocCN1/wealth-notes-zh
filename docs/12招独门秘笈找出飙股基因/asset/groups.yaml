    市場有許多飆股，在飆漲的過程中，可能因為籌碼的因素，可能因為題材的認同度，而完全脫離基本面可判斷的方向，因此聰明的投資人，在面對這個類型的股票時，與其去預測高點，還不如跟著多頭行情順勢而為，如此才能將獲利極大化。


    舉例來說，一檔股票以10元的成本買進，一根漲停板的報酬率，就是10%，如果持股續抱到20元，那一根漲停板的報酬率，就<|start|>可以翻倍到20%，以此類推，抱到100元，一根漲停板的報酬率就是100%，200元則跳升到200%，300元則暴增到300%。


