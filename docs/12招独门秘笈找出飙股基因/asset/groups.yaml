    同樣的狀況，一樣適用在判斷台股指數高低的標準上，雖然根據一般投資人的主觀印象，總以為1萬點、甚至1萬1千點的台股，已經来到價格的天花板，但從追蹤台股上市櫃公司的總獲利來看，相信不難察覺，台股其實已經出現了結構性的變化，並具體反應在近6年的總獲利上，一路從2012年時的1.04兆元，成長到2013年的1.57兆元、2014年的1.84兆元、2015年的1.85兆元、2016年的1.89兆元，以及2017年的2.19兆元。若以2012年與2017年相比較，上市櫃公司的總獲利，不僅從1.04兆元幾乎翻倍成長到2兆元，更說明這波台股的萬點行情，是建立在「獲利大幅增加」的基礎上，一方面完全改變過去「萬點」的結構內容，另一面也支持我所認為「萬點不高」的理由。


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_50_0.png)


    資料來源：《投資家日報》


    此外，雖然台股來到萬點之上的時間，已經創下歷史最長的紀錄，但我依然認為，現階段的台股，處處充滿黃金，而支持的主要理由，就是觀察到台股目前的指數，其實不能真正代表、甚至反應全體股票的狀況，充其量只能說是「少數」幾檔股票的表現而已。


    根據證交所2018年3月23日的資料顯示，台灣加權指數前10大的權重股，依序為台積電、鴻海、台塑化、中華電、台塑、國泰金、南亞、台化、聯發科、富邦金，而這10家公司的股票市值，就合計佔了台股41.98%的比重，若再加計前11大到前20大的股票市值之後，合計便佔了台股高達53.18%的比重。


