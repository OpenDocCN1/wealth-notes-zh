    僅容易受到營運起伏的影響，更會讓計算一檔股票合理股價的過程，變得難以掌握，因此我主張透過5年平均值的概念，可以有效解決上述問題。


    換言之，由於2009～2013年期間，聯發科現金股利分別為25.99元、19.99元、8.99元、8.99元及15元，5年現金股利的平均值，就落在15.79元。


