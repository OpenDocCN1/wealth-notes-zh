    2001年11月，台股大盤月KD在19.95黃金交叉，不僅開啟了6個月的多頭行情，指數更一路從3,910點，驚驚漲到6,484點，漲幅65.83%；2003年5月，月KD在34.62完成了黃金交叉之後，帶動了後續長達11個月的多頭行情，指數從最低的4,108點，起漲到7,135點後才止步，漲幅73.68%。


    時序進入到2004年12月，月KD在35.9黃金交叉之後，不僅'
