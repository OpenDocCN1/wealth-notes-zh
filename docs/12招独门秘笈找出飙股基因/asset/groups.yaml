    ○ 環宇-KY（4991）代工、Qorvo持股9.95%


    資料來源：《投資家日報》'
  - '[PAGE 146]


    雖然台廠專業分工的模式，主要是建立在IDM廠本身產能不足時釋放的委外訂單，一旦IDM廠本身的產能足以消化訂單時，代工廠就必須面臨被抽單的困境，不過由於這幾年全球需求強勁，加上3D感測應用大爆發，因此不僅讓穩懋的代工訂單暴增，也激勵股價節節高升。


