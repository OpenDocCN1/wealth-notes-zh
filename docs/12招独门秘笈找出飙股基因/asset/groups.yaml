  - '[PAGE 11]


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_11_0.png)


    # 1-1


    # 面對3大難題

    不學投資沒法活


    關於財務自由的定義是什麼？我認為在不考慮房子與退休年金因素下，至少要擁有3,000萬元的流動資產，才能確保財務自由後的退休生活，可以維持在一定的品質之上。


    相信許多人會問，3,000萬元會不會太多？我認為，這只是保守估計，理由有以下2點：


    # ① 每月至少要有6萬元支出能力


    根據主計總處的統計資料顯示，2016年台灣每人每月消費支出，雖然平均值為21,086元，但若生活在台北市或新竹市，則會攀升到28,476元及26,749元，若僅以一家兩口老夫老妻來計算，每個月的<|message|>基本消費，便會來到56,952元及53,498元，而這'
  - '[PAGE 12]


    還不包含未來的通貨膨脹。


    當然，進入退休生活之後，許多支出（例如房貸、教育基金）都會減少，但也會計同步增加其他的支出（例如旅遊、保健），在一來一往之後，每個月擁有6萬元的支出能力，是維持一定生活品質的基本條件。


