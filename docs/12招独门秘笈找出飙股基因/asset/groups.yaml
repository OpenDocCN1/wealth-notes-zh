    到大20%、30%，甚至40%以上。


    舉例來說，每次投入100元並投資5次，即使過程中高達4次都是賠錢收場，但只要每一次虧損都控制在負15%，並成功掌握到一次大賺100%的機會，即使在賠錢機率高達80%的情況下，累積的報酬，依然可以達到8%的水準。


    本章的內容雖然都是關於技術分析的教學，但我真正想說的是，在股票投資的市場中，無論是使用技術分析、財報分析、籌碼分析或產業分析，即使是聽明牌得來的也沒關係，不管是用何種方法，最後反應在長期贏家的策略只會有一種，就是


    「大賺小賠」。


    當看「對」的時候，利用「大賺」來創造財富，當看「錯」的時候，只容許「小賠」來保住東山再起的能量。


    投資人如果沒有辦法做到「大賺小賠」的操作策略，我認為，市場中的任何一種方法，都幫不了投資人創造出真正的財富，因為「小賺大賠」甚至「小賺小賠」，都無法長期累積財富，甚至會讓財富縮水。


    總結而論，做了再多的投資分析，最後能夠決定賺錢的關鍵其實只在「操作」2字，以及「大賺小賠」這4個字。


    ## Note


    ## 獨門秘技 第7招


    ## 2個領先指標

    揀出起漲前的成長股


    許多人總認為，不管是每個月10日上市櫃公司所公布的營收數據，或是大約每3個月公布的季報內容，都只是反映一家公司過去1～3個月的營運狀況，從時間邏輯來看，公布的財報似乎只能代表「落後指標」，並不是具有可以發掘「未來」股價動向的「領先指標」。


    平心而論，就我這些年對財報分析的了解與領悟，目前上市櫃公司定期公布的損益表、資產負債表，甚至現金流量表等財報，林林總總各項會計科目中，確實有高達95%以上的科目都是屬於落後指標，對股票投資的參考意義不大，其中還包括許多投資人會密切關注的營收、每股盈餘（EPS）、毛利率、淨利率等，其實就嚴格的定義來看，都是屬於「落後指標」的內容與範疇。


    不過，財務報表中仍有大約5%的會計科目，具備「領先指標」的意義，而這些領先指標，不僅蘊藏未來業績成長的動力來源，更奠定未來晉升為市場飆股的重要基礎。


    ## 一般人對財報分析的迷思


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_206_0.png)


    資料來源：《投資家日報》


    ## 資本支出大幅增加 展現公司營運決心


    舉例來說，在現金流量表「投資活動」項目中的「固定資產（增加）減少」（市場俗稱資本支出），就是我所認為的「領先指標」，畢竟對製造業來說，營運的大成長絕對不會憑空而來，必須建立在大擴產的準備上。至於大擴產的定義，不能只


    看數字的絕對值，必須進一步考量到每家公司的「股本」規模後，才有相同的比較基礎。


    一般而言，當年度資本支出的金額，若能達到股本80%以上，就符合了大擴廠的定義，此外，一家公司決定開始增加固定資產的投資，到最後能開始貢獻營收與獲利，至少需要1～2年的時間，因此若要預測2018年有哪些公司有機會出現營運大成長，投資人所要追蹤的「資本支出」時間點時，就必須回溯到2016年。


