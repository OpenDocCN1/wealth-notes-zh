    ## 利用年初觀察 可窺知公司營運面貌


    看到創意身處在「春節加班出飆股」的行列中，就不得不提起先前我獨家專訪創意總經理賴俊豪的一段小插曲。


    當時我花了將近2個小時的時間，請益台灣IC設計服務產業的優勢與未來成長契機，並於採訪過後寫了一篇研究報告，標題為「創意所屬的IC設計服務產業，未來還有100倍的成長空間」，不過隨即接到公司派來電，提出能低調一點的要求，後來修正為「還有很大成長空間」的字眼，但絲毫不影響創意這幾年投資價值的大幅提升。


    整體而言，創意的營收來源主要集中在NER（接受IC設計公司的委外設計）以及Turn-key（幫助IC設計公司安排生產製造流程）兩塊業務上，隨著2018年台積電16奈米的南京廠即將量產，不僅將大幅提高創意在爭取中國客戶訂單的能力，近幾年由於公司集中資源在AI人工智慧及深度學習的領域，逐漸看到成果，並爭取到2家國際大廠的訂單，未來營運展望相對樂觀。


    環球晶也是另外一檔讓我印象非常深刻的股票，記得2017年10月我上TVBS《國民大會》節目時，主持人于美人特別問起，股價已經漲到330元的環球晶還會再上漲嗎？


    當時我毫不猶豫地回答，從自己獨家專訪董事長徐秀蘭的過程，不僅貼身感受到這位台灣半導體女戰神的魅力，加上公司先前購併美、日、丹麥等大廠的成功決策，剛好搭上這一波矽晶圓產業大缺貨的浪潮，訂單旺到2019年，環球晶的股價自然有持續上漲的動能。果不其然，3個月後，環球晶股價跳漲到489元，繼續寫下「春節加班出飆股」的傳奇故事。


    重新再回到春節加班找飆股的議題，其實類似的電腦歷史回測，我在2014年也曾做過統計，當時的數據分析合計有204檔股票符合「春節加班」的條件，並且追蹤持股1年之後的股價表現，賺錢的家數為145家，賺錢的機率為71.08%；賠錢的家數為59家，機率為28.92%，至於平均的報酬率則落在34.85%，


