    # Part 1 觀念篇


    投資人Slider有這檔的疑問：

    這次成功的賺錢經驗，運用在其他股票上，

    是否能夠經得起市場考驗？勝率能有多少？


    事實上，賺錢方法有跡可循，成功經驗可以被複製！！

    只要能從過著諸多成功操作經驗中挑出共同特徵，

    並且將這些共同特徵量化成實際數據，

    作為進場條件及「買進」、「賣出」的依據，

    就能提高賺錢勝率...'
