    當然，一家公司的營運與股價能夠節節高升，背後一定有產業大成長的驅動力，而漢平正是這幾年全球「黑膠唱片」復古潮興起下的受惠者之一。根據美國唱片業協會統計資料顯示，2009年全球黑膠唱片銷售量僅92萬張，但到了2013年卻成長到460萬張，2014年跳升到1,500萬張，2015年更達到2,250萬張。


    一個看似即將走入歷史的產品，竟然在這幾年出現如此驚人的成長，其原因有3。


    # ①黑膠唱片的「類比」音質，更勝於「數位」音質


    根據許多樂迷的分析，黑膠唱片撥放出來的音質，相較於數位化音樂，更有立體感、更溫暖、更動態、更真實自然，因此得到許多樂迷的認同與愛好。


    # ②黑膠唱片對唱片公司的利潤很大


    根據美國錄音協會統計資料，2015年黑膠唱片為音樂公司帶來的利潤，甚至高於從YouTube這類網路平台分潤到的廣告收益，因此帶動音樂公司更加積極推動相關產品的行銷。


    # ③M型化社會，消費者更勇於追求小確幸


    近幾年隨著M型化社會結構越來越明顯，中產階級崩落，雖然導致荷包縮水，但不代表就要放棄追求生活品質，反而創造出一股更要勇於追求「小確幸」的動力，平價時尚的服飾品牌

