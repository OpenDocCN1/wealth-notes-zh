    還是白酒指數近1年以來的飆漲，都透漏全球經濟已經看到明確的復甦，景氣的春燕早已到來。


    # 2015~2017年中證白酒指數（CS399997）走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_41_0.png)


    資料來源：CMoney法人系統 資料整理：《投資家日報》


    此外，具有台灣景氣領先指標的統計數據——製造業採購經理人指數（Purchasing Managers'' Index，簡稱PMI），同樣也顯示2017年以來台灣製造業確實處於非常熱絡的榮景，截至2018年2月，已連續24個月呈現擴張狀態。


    從上述數據顯示，當前台灣的製造業不僅已呈現百花齊放、蒸蒸日上的繁華榮景，更推動這一波台股走勢得以不斷向上走高。


    # PMI指數組成的5大要件


    整體而言，PMI指數是由5個面向所綜合組成的分數，包括：①新增訂單數量、②生產數量、③人力雇用數量、④現有原物料存貨水準、⑤供應商交貨時間。其中一個簡單的衡量標準，就是以50分為分水嶺，PMI指數低於50分，代表製造業呈現衰退的局面，高於50分則顯示目前製造業處於成長的擴張階段。


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_42_0.png)


    資料來源：《投資家日報》


    # 月K連6紅 台股必啟動多頭行情


    從技術分析的觀點來看，紅K形成的要素是「收盤價＞開盤價」，因此能夠出現連續6個月以上的月K收紅，不僅代表市場完全不畏懼過去已「漲多」的格局，更顯示市場大戶不計成本，也要將底部越墊越高的做多心態。


    整體而言，台股歷史上，能夠出現月K連6紅以上的機會並不多（扣除這一次，只出現過4次），但每一次出現，都代表未來將有「大行情」誕生。例如2012年11月～2013年5月期間（月K連7紅），當時台股一路從7,166點上漲到8,254點，雖然月成交量僅有1.86兆元，但絲毫不影響1年之後指數續攻到10,014點的萬點行情。


    # 2012年11月～2013年5月台股月K連7紅


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_43_0.png)


    資料來源：CMoney 法人系統 資料整理：《投資家日報》


    時間再往前推到1996年11月～1997年4月，不僅出現月K連6紅的走勢，指數更一路從6,426點上漲到8,485點；值得留意的是，當年的時空背景，除了即將受到亞洲金融風暴襲擊之外，美元指數也成功突破100的整數關卡，但這些負面衝擊，並未影響同年8月台股登上10,256點的萬點走勢，月K連6紅的月成交量，則是達到3.66兆元。


