    此外，用功的投資人如果能進一步搭配「技術分析」與「籌碼分析」的綜合觀點，個股的選擇與持股的天數，必然可以大幅下降，讓投資變得更精準、更有效率。


    以大同為例，股價在飆漲前，就曾經歷過短（月線）、中（季線）、長期（半年線與年線）均線糾結的發展，不僅技術分析上具備波段漲幅的條件，再搭配市價遠低於每股清算價值的條件，自然容易出現驚驚漲的走勢。


