    ## 剋股基因 2-6


    以2013年台股漲幅最兇的DRAM股華亞科（3474）為例，3月5日出現了一根幅度超過10%的實體黑K，若以當時股價已經從2.16元大漲到7.4元來看，這根實體黑K的出現，勢必會讓一般投資人以為「漲勢已結束」，殊不知，這根實體黑K，真正的角色是「黑色騙線」，主要的目的~是隱藏多方想要繼續上漲的企圖，因為10個月之後，華亞科的股價硬是大漲到27.4元的波段新高。


