    # 搭配產業分析 成長趨勢向上可買進


    當然市場中的任何一檔飆股，一定要搭配產業趨勢的浪潮，才能推砌出一段驚驚漲的波段行情，穩懋所屬的砷化鎵產業，就是我當時看重的趨勢。


    「砷化鎵」是一種由鎵與砷兩種元素組合而成的化合物，與「矽」相比，砷化鎵更具備高頻、抗輻射、電子遷移速率快與耐高溫等優勢，因此不僅適合運用在無線通訊產品上，更為砷化鎵產業帶來長線成長的趨勢。'
  - '[PAGE 144]


    整體而言，砷化鎵IC產業的長線趨勢，主要是來自於全球進入到物聯網（Internet of Things，簡稱IoT）時代，以及智慧手機跨入4G、甚至5G的通訊速度之後，對於砷化鎵IC的需求將大幅提升。根據《Navian，RF
    Devices/Modules for Cellular》在2014年的統計預估，每台行動裝置須裝載砷化鎵IC的顆粒數，不僅從2000年的1.3顆，成長到2014年的7顆，2018年時甚至將上看10.9顆。


    # 每台行動裝置須裝載砷化鎵IC的顆粒數


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_144_0.png)


    資料來源：Navian，RF Devices/Modules for Cellular


    資料日期：2014年12月'
  - '[PAGE 145]


    此外，穩懋在砷化鎵IC產業的關係，所扮演的角色就是為沒有晶圓廠，或產能不足的IDM客戶，提供代工生產的服務，簡單來說，就是砷化鎵產業中的台積電（2330）。


    「IDM客戶」是Integrated Devicd Manufacturer的簡稱，指的是從設計、製造、封裝測試到銷售都一手包辦的半導體整合公司，例如Skyworks、Avago與Qorvo，其中對應台灣廠商的關係，宏捷科（8086）為Skyworks的代工廠，穩懋則為Avago的代工廠，後合併Broadcom，並更名為Broadcom。


    # 全球3大功率放大器（PA）廠商的代工關係


