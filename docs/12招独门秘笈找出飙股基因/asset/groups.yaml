    然而，單純以「季線」作為買賣股票的參考依據，真的能夠套用在每一檔股票的操作上嗎？季線真的具有股價生命線的意義嗎？


    整體而言，我針對「季線」進行了3個不同時期的大數據分析，只要台股中的任何一檔股票，股價站上季線就買進，跌破季線就賣出，完全不考慮任何產業分析與財報分析的影響，其結果如下：


