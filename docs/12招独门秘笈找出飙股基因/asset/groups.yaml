    # 策略②：設定獲利回吐的最後防線


    設定獲利回吐的最後防線，其重要性，不亞於負15%的停損機制，前者攸關「大賺」成果的保存，而後者則是「小賠」操作的紀律，而大賺小賠更是所有長期在股市中能成為贏家者的共同策略。'
  - '[PAGE 87]


    # 獲利回吐操作方式


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_87_0.png)


    資料來源：《投資家日報》


    重新回到「獲利回吐最後防線」的設定上，可參考賽局理論（Game Theory）的內容。


    賽局理論又名博弈論，是美國猶太裔數學家約翰·馮·諾伊曼（John von Neumann）在1944年提出的概念，透過賽局的策略思考，可以確保自己在競爭中獲得最大的勝算與利益；此外，賽局理論不僅被譽為20世紀在經濟學上最偉大的成果，更是研究各種具有「競爭性質」現象，例如國際關係、生物學、軍事謀略等，頗具參考的理論與方法。


    具有「競爭性質」現象的領域，當然也包含股票投資與賭場博弈，其中，更被運用在當今所有Casino（賭場）大師的共同策略上，就是在賭場獲利達到一定程度時，如果開始手氣不'
  - '[PAGE 88]


    順，甚至獲利已回吐50%，唯一的做法，就是起身換掉籌碼，


    離場走人，絕不戀棧。


    上述的邏輯，同樣也可運用在「獲利回吐最後防線」的設定上，以2011年我在操作羅昇（8374）這檔股票為例，當初成本在26.67元的持股，之後股價最高來到95.7元，最佳的累積獲利也達到258.83%，但隨著股價開始自高檔反轉，獲利回吐到129.42%之際（258.83%×0.5），也就是股價跌到76.4元時，透過「全數出清持股」，不僅確保了最大利益，更完全避開了後續股價暴跌回起漲點22元附近到窘境。


