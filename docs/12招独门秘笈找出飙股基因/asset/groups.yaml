    ## 續跌訊號 沒有上下影線的實體黑K


    這類型的K線，由於開盤價就是最高價，收盤價就是最低價，不僅代表下跌力道猛烈，通常股價後市都還有低點。


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_179_1.png)


    舉例來說，宏達電（2498）在2011年股價曾一路從1,300元跌落到700元附近，當時雖然有許多人認為可以進場撿便宜（當年前3季EPS已達59.51元，全年上看73元），但11月21日那根實體黑K棒，卻預告股價還沒跌完，後市還有低點。


