    \ 貨物及貨運處理員 | 牙齒矯正醫師 |\n| 8 | 報稅代理人員 | 室內設計師 |\n| 9 | 照片沖洗人員 | 製片人和導演 |\n| 10 |\
    \ 銀行開戶人員 | 攝影師 |\n| 11 | 圖書館技術人員 | 物理治療師 |\n| 12 | 數據輸入人員 | 時裝設計師 |\n| 13 | 定時裝置裝配工\
    \ | 材料工程師 |\n| 14 | 保險理賠人員 | 材料科學家 |\n| 15 | 仲介文書業務人員 | 土壤和植物科學家 |\n| 16 | 訂單文書人員\
    \ | 健康診療醫生 |\n| 17 | 貸款人員 | 土木工程師 |\n| 18 | 保險估價師 | 物理治療師助理 |\n| 19 | 體育裁判員 |\
    \ 建築師 |\n| 20 | 出納人員 | 環保工程師 |\n\n資料來源：《投資家日報》\n\n然而，談到投資，許多人會質疑，投資有風險，不會只賺不賠，最後還有可能把辛苦賺來的錢賠掉，我不否認上述風險，但也始終堅信，人生最大的風險，就是不敢冒險，與其像溫水煮青蛙地等待上述危機降臨而措手不及，還不如冒一點險，來\n\
    \n![](img/1fa1f4d4436b0fbf820926994a4b7975_23_0.png)\n\n追求海闊天空的財富自由。\n\n此外，談到投資的風險，不免再次老生常談一個觀念，就是投資風險有很多，但我認為，最大的風險就是投資人根本不了解所投資的公司或標的。透過深入了解所投資的公司，不管是從產業分析、財報分析、技術分析、還是籌碼分析的架構，學會用聰明且理性的方式來看待投資，才能長期穩健地在股票市場中獲取合理的利潤，並為自己創造財富增長的效益。\n\
    \n當大環境不可靠時，只有靠自己，才能突破現在的困境；當\n\n## 股票投資分析的4大架構\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_23_1.png)\n\
    \n退休年金不保時，也只有靠投資，才能翻轉劣勢，創造出有品質的生活條件。\n\n## 利用台股改善投資環境 讓財富水漲船高\n\n此外，我認為現階段的台股，投資環境其實對投資人非常友善，主要原因有二：\n\
    \n### ① 資訊揭露 非常透明與完整\n\n隨著近幾年主管機關對於上市櫃公司的監理要求越來越高，投資人不僅每個Month、每季可以檢視公司的財報表現，甚至內部人與大股東的籌碼流向，都可以輕易地透過電腦追蹤取得，因此對許多認真且用功的投資人而言，要精準掌握一家公司的營運狀況，其實都已經不是難事，也就自然能夠反應在投資獲利的績效表現上。\n\
    \n### ② 無須課徵資本利得稅\n\n台股投資另一個對投資人友善之處，就是不用課徵資本利得稅（俗稱證所稅），以一位同樣年收入1,000萬元的人為例，如果全是薪資所得，最高將被財政部課徵450萬元綜合所得稅，反之，若是1,000萬元收入全來自股票投資的資本利得，在1毛錢都不需要課稅的情況下，對財富資產的累積有很大的助益。\n\
    \n![](img/1fa1f4d4436b0fbf820926994a4b7975_25_0.png)\n\n## 台股2大友善投資環境\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_25_1.png)\n\
    \n資料來源：《投資家日報》\n\n不過對短線投資者而言，台股就不是一個友善的環境，因為交易成本之高，幾乎可以說是獨冠全球，以1,000萬元資金為例，假設每一次都不賺不賠（例如用108元買進鴻海，同樣用108元賣出），只要進出100次，1,000萬的本金將只剩下557萬元。\n\
    \n台股會有這麼高的交易成本，關鍵原因是現行賣出股票所課徵的千分之3證券交易稅，其實已經內含「證所稅」的概念，畢竟追蹤民國43年所制定的《證券交易課稅辦法》，當時稅率僅為千分之1，之後由於證所稅於民國79年停徵，才上調到千分之6，民國82年之後，再降至千分之3至今，換言之，多出來的千分之2證交稅，就是課不到「證所稅」後政府做的補償方式。\n\
    \n## 台股交易成本有多高？\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_26_0.png)\n\n每次不賺不賠\
    \ 例如隔108元買進鴻海，同樣隔108元賣出\n\n> 資料來源：《投資家日報》\n\n## 台股交易成本結構\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_26_1.png)\n\
    \n證交稅 — 千分之3（賣出要扣）\n\n手續費 — 千分之1.425（買進、賣出都要扣）\n\n總成本 — 約為股價×6\n\n> 資料來源：《投資家日報》\n\
    \n當然投資人如果是用網路下單，買進與賣出的手續費都還會再打5～7折不等，因此上述的交易成本會依照每個人的交易方式而有所不同，但我要說的重點是，在不考慮投資勝率的條件下，一般投資人想要靠「短線交易」在股市中賺到大錢，確實會有相當大的難度。\n\
    \n總結而論，現在的台灣人雖然身陷在「什麼都漲，只有薪水不漲」的惡性循環裡，未來還要面對「退休年金不保」、「機器人全面取代」的風險，讓所有想要認真打拼、想要過上好生活的人備感壓力，但如果能善加利用台股友善的投資環境，並學會找出飆股的基因，相信對未來不僅將可無所畏懼，更可提早實現財務自由的目標。\n\
    \n## Note\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_29_0.png)\n\n## 打破歷史魔咒\n\
    要習慣萬點是常態\n\n在2017年舉辦的台北世大運，台灣不僅創下奪獎牌數最多的隊史紀錄，更有許多讓我激動與動容的時刻，例如舉重好手郭婞淳在抓舉破世界紀錄的那一刻、翻滾男孩李智凱完美落地的一瞬間、台灣最速男楊俊瀚在100公尺田徑場上最後一刻領先衝刺到終點的那一秒……相信都讓許多國人喜極而泣，因為他們不僅將原本遙不可及的夢想實現，更把外界認為的不可能化成可能。\n\
    \n台股何嘗不也是如此？2017年1月TVBS公布最新民調，在1,034位有效受訪者中，對於2017年台灣經濟發展有信心的比率僅25%，沒信心者高達54%，此外，對台股2017年展望悲觀者達到40%，無法表示意見為48%，表示樂觀者僅為13%，如此沒信心的狀況，甚至逼近2008年金融海嘯時的12%。\n\
    \n然而，就在國人普遍不看好的預期心理下，台股不僅逆勢上演驚驚漲的走勢，更打破史上持續時間最長的萬點紀錄，截至2018年5月，不僅已連續超過365天站上萬點，超越1990年的65天，更將1989年26天、1997年及2000年時4天的紀錄，遠遠拋在後面。\n\
    \n上述這份民調雖然顯示當時台灣人對於未來感到悲觀，但我認為：政府施政要看民調，投資賺錢不能看民調，因為民調往往是投資的反指標。舉例來說，2015年1月16日國泰金控經濟研究處公布台灣景氣調查報告，在3萬名受訪者中，雖然對台灣未來景氣的展望分數，來到近22個月以來的許高水準，但認為台股有機會一舉攻上萬點的比率，竟然只有2%（編按：2014年台股封關時指數為9,307點）。\n\
    \n其中有高達52.7%的民眾認為，台股指數將落在8,500點到9,500點之間，然而，不到5個月的時間，台股便成功站上久違15年的萬點，完全打破98%台灣人以為的認知。\n\
    \n平心而論，多數台股投資人會對台股萬點行情沒有信心，我認為與過去幾次不好的歷史經驗有絕對關連，根據統計，排除2017年的萬點行情，台股曾有6次上萬點的經驗，分別落在\n\
    \n## 台股歷史上萬點行情持續時間\n\n- No.1\n  2017年，已超過365天，紀錄還在持續中\n- 其次\n  1990年，連續65天\n \
    \ 1989年，連續26天\n- 其次\n  1989年，連續18天\n  1997年、2000年，連續4天\n\n說明：統計到 2018/5/31；資料來源：《投資家日報》\n\
    \n## 2017年TVBS民調：對台股樂觀僅13%\n\n![](img/1fa1f4d4436b0fbf820926994a4b7975_31_0.png)\n\
    \n僅13%民眾對來年股市感到樂觀，與2008年金融風暴時12%的低點相當，感到悲觀有40%，無法表示意見有48%，是歷次調查最多，顯示投資人籠罩在不確定感中。\n\
    \n資料來源：TVBS；整理：《投資家日報》\n\n1989、1990、1997、2000及2015年，然而若就統計數據來看，看，台股上萬點後的相關表現，後續高點與回檔低點的落差，確實會讓人戒慎恐懼。\n\
    \n整體而言，過去6次台股上萬點之後，後續高點分別再出現8.29%、26.65%、1.97%、2.53%、2.56%、0.12%，平均7.02%的漲幅，然而，上萬點之後的回檔低點，卻依序呈現-27.26%、-80.4%、-31.35%、-20.62%、-19.82%、-28.07%，平均-34.59%的跌幅。\n\
    \n換言之，在高檔有限（平均7.02%漲幅），回檔嚇人（平均34.59%跌幅）的歷史經驗下，自然會讓一般投資人，對於台股站上萬點之後的行情，產生保守看待的疑慮。\n\
