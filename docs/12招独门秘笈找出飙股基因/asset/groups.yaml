    ![](img/1fa1f4d4436b0fbf820926994a4b7975_176_1.png)


    以光學鏡頭廠玉晶光（3406）為例，2015年曾出現一段股價快速從「百元俱樂部」跌出的空頭走勢，直到同年8月24日當週出現一個留下長長下影線的紅K棒之後，才算正式結束波段跌勢，並且成為股價即將反轉向上的徵兆。


    值得一提的是，2014年12月1日當玉晶光的股價攀升到129.5元時，當週留下長長上影線的紅K棒，後續股價開始崩跌，因此也呼應上述頭部訊號的定義：雖然有強烈的上漲意圖，高檔卻遭遇強大賣壓，若出現在波段上漲的行情中，要注意可能隨時反轉向下。


