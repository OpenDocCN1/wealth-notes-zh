    此外，另一個反應大擴產的財報科目「投資活動之現金流量」，同樣也看到相同的內容；追蹤2009～2016年的金額變化，2014～2016年期間，一方面出現跳升的狀況，分別達到7.23億元、4.09億元，以及16.67億元，遠高於2010～2013年每年約1.85億元的平均值，占股本比率更則上升至83%、45%及162%。


