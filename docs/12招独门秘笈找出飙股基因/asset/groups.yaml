    ## 飆股勝利方程式

    別只賺50%就滿足


    我認為，市場中的飆股都有它的基因，其中最重要的特徵是公司所屬的產業，一定要符合未來的產業趨勢，因為只要產業對了，相關供應鏈的股票自然就容易獲得市場認同，並激勵股價的水漲船高，畢竟「站在風口上，連豬都會飛。」


    什麼叫做符合未來的趨勢產業？有一個簡單的判斷標準，只要這個產業符合「過去」沒有、「現在」開始有、「未來」會有很多，就具備趨勢產業的條件。


    ## 飆股基因①：符合未來產業趨勢


    舉例來說，3D感測就符合「過去」沒有，「現在」開始有，


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_57_0.png)


    「未來」將會有許多的3大條件。


    平心而論，我第一次看到智慧型手機搭配「3D感測」的功能時，其實並沒有太大驚喜，但在經過進一步研究之後，才驚覺這項功能或許將徹底改寫手機的定義，並且完全改變人類生活的面貌。


    2017年蘋果（Apple）率先推出在前置鏡頭採用3D感測模組的iPhone X，不僅用於臉部辨識，更開啟3D感測應用的元年，未來的iPhone手機不僅前置與後置鏡頭都將採用3D感測技術，甚至還會將功能進一步擴大到AR虛擬實境的用途。


    上述虛擬實境的功能，與寶可夢遊戲中的AR，最大差別就在於「人工智慧」涉入的程度，搭配3D感測模組的iPhone，就好比幫手機裝上人類的眼睛，有利準確接受、分辨、甚至分析外在人、事、物等處境與變化。


    舉例來說，當消費者用手機鏡頭對準遠方的高塔時，手機便能自動辨識這是位在美國舊金山、建立於1933年的Coit Tower；當手機移動到一位小女孩臉上時，不但知道她的名字叫Sandra，更能察言觀色到她目前的心境是平靜的；此外，將鏡頭拉到捷運車站裡，手機不但能偵測所在位置，甚至還能引導用戶再走65公尺就要下樓梯了。


    再者，3D感測的應用，除了可以結合在智慧型手機上，更可


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_59_0.png)


    以向外延伸到平板、電腦、汽車（先進駕駛輔助系統）、夜間安全監控系統、機器人等領域，進而出現大爆發的成長。


    ## 飆股基因：符合未來產業趨勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_59_1.png)


    資料來源：《投資家日報》


    根據摩根大通的研究報告顯示，iPhone全面採用3D感測之後，預估將可帶動非蘋陣營Android手機跟進，其中在全球第1大智慧型手機品牌Samsung（三星）與第3大品牌華為相繼投入研發後，2018～2020年的滲透率將分別達到5%、15%和30%，應用於智慧型手機的3D感測模組，數量也將從2017年的5千萬套，爆漲20倍來到2020年的10億套，並且達到100億美元的產值規模。


    3D感測產業如此驚人的成長幅度，勢必將讓相關廠商未來幾年的營運水漲船高，其中台股的代表就屬穩懋（3105），而我


    早在2016年9月《非凡電視台》的節目中便完整分析，當時穩懋的股價僅在62.4元，在符合未來產業趨勢的條件下，長線投資價值不容忽視，1年過後穩懋股價已經大漲至340元，飆漲444%的背後，再度呼應飆股勝利方程式，就是要符合未來的產業趨勢。


    ## 3D感測飆股：2016～2017年穩懋（3105）股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_60_0.png)


    資料來源：CMoney 法人系統 資料整理：《投資家日報》


    ## 潮股基因②：獲利成長


    此外，飆股的另一個重要基因是，企業營收與獲利必須大成長，因為「基本面好」，才容易得到法人的認同，並反應在源源不絕「買進」股票的決策上。


    ## 潮股基因：獲利成長、股價創新高


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_61_0.png)


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_61_1.png)


    資料來源：《投資家日報》


    以機器人概念股的上銀（2049）為例，2017年營收已經繳出較2016年成長31%的成績單，時序進入2018年，更持續展現強勁成長的內容，前2月累積營收不僅大增54%，法人更樂觀預估今年EPS將有機會挑戰16元，相較2016年的4.83元與2017年的9.77元，雙雙出現大增的好表現。


    如此優異的基本面，也讓外資與投信持續站在買超的一方，


    外資持股張數從2017年初的52,554張，倍增到2018年3月27日的131,143張，而投信持股張數更從2017年初的594張，暴增超過10倍來到2018年3月27日的7,022張。


    ## 2017～2018年上銀（2049）股價走勢與法人持股


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_62_0.png)


    資料來源：CMoney法人系統 資料整理：《投資家日報》


    ## 飆股基因③：股價創新高


    第3個飆股基因是，要搭配股價創歷史新高的條件，因為從籌碼面來看，一檔股票的股價若能突破歷史新高，除了代表過去所有買這檔股票的投資人，目前都呈現賺錢的局面之外，更透


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_63_0.png)


    露這檔股票在未來沒有任何「解套」的賣壓，非常容易引爆出一段「上漲無壓力」的飆漲走勢，就技術分析中的波浪理論來看，許多人稱之為「邪惡的第5波」，但我認為，這是投資飆股過程中，能夠創造出驚人收益的最重要階段。


    波浪理論是美國投資大師艾略特（Ralph Nelson Elliott）於1946年所提出，他認為，股價走勢都具有一定的韻律與型態，基本上包含了5波的上升趨勢（下圖1、2、3、4、5），與3波的下降趨勢（下圖a、b、c），其中第5波雖然是上漲的末升段，但在實務經驗中，卻也常常是漲勢最「無法無天」的一段。


    其關鍵的原因，我認為與「上漲無壓力」有關，而一檔股票也只有在股價突破歷史新高的時候，未來才能在沒有任何解套賣壓的情況下，出現這所謂的邪惡第5波。


    ## 波浪理論：5波上升趨勢與3波下降趨勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_63_1.png)


    資料來源：《投資家日報》


    舉例來說，半導體設備股的京鼎（3413），2016年2月19日股價突破2008年106元的歷史新高之後，後續股價飆漲的速度不僅加快，僅1年多時間，股價就竄升至289.5元，大漲超過173%，充分顯示邪惡第5波的驚人力量。


    ## 2008～2018年半導體設備龍頭：京鼎（3413）股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_64_0.png)


    > 資料整理：《投資家日報》


    談到京鼎，就不得不提到所屬的半導體設備產業，同樣屬於未來的趨勢產業，其舵轄是，中國扶植半導體的政策決心，不僅符合「過去」沒有，「現在」開始有，「未來」會有許多的條件，更將讓台灣半導體設備廠商，成為第1波最大受惠的族群。


    2006年中國就已經躍升為全世界半導體IC的最大消費國，占


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_65_0.png)


    比已達全球需求的41%，半導體設備需求所衍生出來的「在地化生產」，顯然出現了明顯的落差，以2014年底的資料顯示，中國大陸半導體的自給率僅為26%，換言之，目前仍有高達74%的需求，要仰賴從國外進口，每年進口值更高達2,300億美元。


    為了解決IC產業極度仰賴國外進口的結構問題，2014年6月中國政府頒布了《國家集成電路產業發展推進綱要》，除了延續租稅優惠之外，更透過成立1,200億人民幣（約台幣6,100億元）的「投資」基金，而非「發展」基金，一改過去政府只是旁觀者的角色，成為直接的參與者，來推動中國半導體的整併與發展，並規畫「進口替代」的時程表，期望2020年時，中國內需IC的自給率可以達到40%，2025年時一舉完成70%的政策目標。


    ## 中國大陸半導體「進口替代」政策目標時間表


    - 2014年 — 中國IC自給率為26%

    - 2020年 — 中國IC自給率達40%

    - 2025年 — 中國IC自給率達70%


    資料來源：《投資家日報》


    中國政府推動半導體的進口替代，目前響應的地方政府已包括北京、上海、四川、山東、安徽、天津、江蘇濱海、武漢與瀋陽等地，政府與民間合計參與的投資金額，預估將上看1.2兆人民幣（約台幣6兆元）。


    姑且不論中國大陸是否有足夠的能力來發展進入門檻比「光電面板」高上許多的半導體產業，但在國家政策推動下，未來10年，中國大陸的半導體建廠需求，勢必會如雨後春筍般冒出，並且成功推升相關設備產業的需求，至於台灣的半導體設備廠商，有機會受惠嗎？


    關於這個問題的答案，讓我想起先前獨家專訪漢微科（3658）董事長許金榮的內容，當時他分析說：「在台積電的帶動下，近幾年台灣半導體設備支出呈現扶搖直上的增長，但全球半導體製程的設備市場，合計有高達50%都掌握在ASML、AMAT與TEL等歐、美、日大廠手上，因此國內設備廠商能受惠者寥寥可數。」


    上述情況直到2009年之後，開始有了一些轉變，關鍵在於台灣半導體的製程設備，如果必須仰賴國外大廠，將不利於長遠發展，尤其主要競爭對手韓國三星，近年來積極扶植本土的設備廠商，使韓國半導體製程設備的自製率已達20%，預計2020年將可提高到50%，未來韓國若進一步完成供應鏈的整合，將


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_67_0.png)


    對台灣廠商造成巨大的競爭壓力。


    有鑑於此，台積電從2009年開始，積極尋找在國內可以共同合作開發製程設備的廠商，並且培育出一批台灣半導體設備產業的藏寶圖商機。


