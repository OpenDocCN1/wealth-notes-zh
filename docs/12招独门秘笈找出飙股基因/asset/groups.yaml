    # 月KD 40以下黃金交叉 台股大盤由空翻多


    月KD指標除了可適用於判斷台股長線「由多翻空」的訊號之外，同樣也可用於判斷「由空翻多」的轉折變化。下表為2000年以後，台股月KD在40以下出現黃金交叉之後，指數後續的表現統計，整體而言，確實都具備了開啟大多頭行情的意義。


