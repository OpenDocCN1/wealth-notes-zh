    具備領先指標的意義


    說明：IFRS 會計科目為應付建造合約款 資料來源：《投資家日報》


    一般而言，預收款項的主要項目包括「預收工程款」與「預收備料款」等2大科目，而在會計處理上，雖然客戶因為預付了費用，必須將「預收款項」歸類在流動負債上，但償還此負債的方式並不是透過「金錢貨幣」，而是透過在一段指定期間內提供「某種商品」或「某種服務」，因此，在某種程度上，不僅可視為「在手訂單」的延續，更可看作是「營收」的領先指標。


    換言之，雖然預收款項因為會計認列的方式，不會立即反應在營收上，但這批款項是來自於「客戶的預付費用」，只要未來能夠依照合約提供對等服務，自然就能夠轉換成未來營收與獲利的增長。


    ## 2015～2018年漢唐（2404）股價走勢


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_231_0.png)


    資料來源：CMoney 資料整理：《投資家日報》


    上述的概念，就好比加入健身房的會員一樣，對健身房的經營者而言，雖然預收了會員1年或數年的會費，必須認列在資產負債表中的「負債」上，但由於未來還債的方式是透過提供對等的「健身服務」，而非「金錢」，因此只要未來兩造雙方沒有毀約，這筆「負債」最終還是會反應在「營收」與「獲利」的數字上。


    舉例來說，從2015年以來，我便持續追蹤至今的半導體設備股漢唐（2404），之所以能夠在股價還在33.55元時，就看到其未來的投資價值，並掌握到後續股價翻倍大漲到72.7元的過


    程，除了看中所屬的半導體設備產業前景可期之外，另一個支持的理由，就是財報分析中關於「預收款項」的領先指標意義。


    追蹤2012～2017年漢唐每季的「預收款項」，一路從2012年第2季的20.3億元，上升至2013年第1季的35.7億元，以及2014年第1季的44.3億元，雖然2017年第1季的52.9億元，較2016年第1季60.4億元下滑，但仍維持在50億元以上的高水準，加上之後又快速回升到2017年第3季的56.4億元，以及2017年第4季的65.6億元，不僅再創下歷史新高，代表本業賺錢能力的「毛利率」與「營業利益率」也相繼提升。


    ## 2012～2017年漢唐（2404）預收款項


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_232_0.png)


    資料來源：《投資家日報》


    ![](img/1fa1f4d4436b0fbf820926994a4b7975_233_0.png)


    這不僅加強我對漢唐營運後市看法偏樂觀的論點，更期待後續股價能夠出現改寫波段新高的上漲動能。


    最後，稍微幫讀者簡單介紹漢唐的公司背景，這是一家成立於1982年，同時也是台灣唯一具備電子廠商建廠能力的工程公司，下游客戶包括半導體產業的台積電、日月光、力晶、瑞晶、華邦電、旺宏、光電產業的友達、群創、彩晶、中電熊貓、華星光電、高通顯示器、深超光電，以及太陽能與PCB產業等相關公司。


    此外，在台股中與漢唐同屬一個產業的公司，還包括漢科（3402）、亞翔（6139）、帆宣（6196）、聖暉（5536）、同開（3018）等5家業者，而我也特別將其族群命名為：建廠6雄。


