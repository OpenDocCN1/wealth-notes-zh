    ## 獨門秘技 第2招


    ## 月KD的妙用

    抓住起漲點、起跌點


    技術分析中關於KD指標的應用，有一個簡單的定義，就是當D值在20以下時，代表股價進入超賣區，賣出股票有可能賣在相對低點；而當D值在80以上時，則代表股價進入超買區，追價風險大增，因此，反應在操作策略上，就是等待D值來到20附近時才買進股票，而接近80時則可將股票賣出。


    此外，就波段操作而言，月KD是許多人會參考的技術指標，尤其當月K來到20以下（有時會放寬到25以下），通常都代表股價已經歷一段較大的跌幅，或是較長時間的整理，因此若進一步搭配與月D值呈現黃金交叉的情況，自然就容易出現後續的上漲行情。


