  md: '# 证明商业模式前严格控制成本！


    +   正确


    +   错误


    +   - 在一个城市，甚至只选择某城市的一个区域试点；

    - 保持小而精干的团队；

    - 尽快上线产品，获取实际用户反馈；

    - 小规模的尝试客户获取，测试ROI；

    - 密切关注用户留存和活跃度；


    +   - 迅速扩张到多个城市；

    - 团队迅速扩张到上百人；

    - 精益求精，产品不打磨完美不上线；

    - 大规模的通过各种渠道洗流量，或者通过高额补贴获取用户；

    - 只关心用户总数；


    # 密切关注用户留存！


    ![](img/7a02d093f22d4b34f1f7e41fd915e3b5_6_0.png)


    +   - 6个月用户留存如果低于20%，很难发展成10亿美金以上的互联网大型平台；

    - 密切关注不同版本和运营策略是否提升用户留存；

    - 强网络效应的应用场景可能会有留存翘尾的现象；'
