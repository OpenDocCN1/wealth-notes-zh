  md: '# 炒房客の流派（三） ---法租民宿派 #485


    2015-11-20yevon ou 水库论坛 水库论坛


    ![](img/7a02d093f22d4b34f1f7e41fd915e3b5_22_0.png)


    # 炒房客の流派（三） ---法租民宿派 #485


    优雅地赚钱。


    # 一）鱼和熊掌


    职业炒家的第三个流派，是法租/民宿派。


    > 在之前的文章中，我们说道“大面积低单价”流派防止破产的最后防线是“成本足够地低”，买来就是七折。


    而老破小流派不注重资本利得。却特别地注重“租金%”，只要持续地有5%现金回报，长线收租天塌下来也不怕。


    好了，现在有一个流派，他兼得二派优势。比二派都强。


    当老破小流派绞尽脑汁，谋求“3.5~4.0%”租金回报标的时，有一个流派，他的纯租金回报可以做到8~10%


    而且这个流派，他还不耽搁你赚钱。在资本利得方面一样很强，壮牛狂奔。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '这个流派，就是法租/民宿派。


    # 二）法租派


    我们说过，要获取高额租金%，有二次方式：


    1）最最最低端。以至于基本生活需求无法压缩。最最极小面积户型。


    2）做外国人生意


    法租流，其实做的是外国人生意。


    做外国人生意，有专门只做外国人生意的地域板块。譬如古北，虹梅，碧云，主打的都是国际社区。


    如果你的房子买在了古北，碧云，那么很不幸，你的房子，可能是过去十五年涨幅最低的房子。古北从 1997 年$2000 美金，到今天就没涨几倍。


    炒古北不是流派。因为死亡的不是多军流派。


    多军流派，都是指赚钱的流派。


    所谓的“法租流”，主要是指买湖南路，天平路，武康路，衡山路一带，传统法租界，绿树成荫的地方。


    这几乎是上海最好的地区。康办也在这里。


    而法租流之所有可以胜出，则是他在**获取高额租金的同时**，**控制了成本**。


    就总体而言，法租派的内功心法，可以归结为以下几条：


    1）选择湖南天平衡道，传统法租界地区。但是购入房价又很低，是跟土著价走，而不是外销房走。


    2）进行极为**专业**的改建和整修'
  merge: -1
  img_proc: true
- pgno: 24
  md: '+   3）出租给老外。


    +   4）或出售


    因为法租界并没有古北那种成片，成规模的名都城外销房小区。在法租界选筹，主要是：


    +   - 50~60 平米老公房


    +   - 新里


    +   - 独院小洋房（之部分）


    “法租派”这一系列的领教人物是网友 Wonderful，譬如他在 2013.7 分享了一个案例：武康路 47 平米租 10000.


    房子在武康路星巴克旁，1981 年老公房 4/6F，实在是普通得不能再普通。


