- pgno: 12
  md: '这么的房源，他们怎么维护的。“天下房源一大抄”。


    # 五）抄袭的时代


    现在的网站，基本是一个大杂烩。


    你譬如某中介有个 15 万条的数据库。另一个中介有个 20 万条的数据库。拿过来拼在一起，就成了 35 万条房源。


    再找个机器爬虫，爬在网页上一条条搜。于是数据库都成了大家拷贝来拷贝去，谁的都一样。


    建立一个 1000W 条房源信息的大网站，可能只需要三个月。而成本几乎为零。


    这样的信息系统建立起来，结果是他非常地“脏”。


    房源需要维护。你不要责怪中介每天 18:30 吃饭的时候打你电话，但实际房源一定频率的更新是必须的。


    上海楼市，大致是每个月 1%的上涨速度。十分稳定。任何一个数据库，如果不更新的话，那他十二个月后彻底没用。


    最近我们看到许多用“大数据”分析房地产市场的文章。我们可以肯定地说你没用。


    不是分析的方法没用。而是数据本身太脏。


    “房源组”已经被解散了许多年。当这套体制，这套系统没有建立之前。你只在垃圾堆里分析，再怎么也找不出黄金的。


    今时今日，数据隐藏在一线业务员的小本本里。而不是中央电脑数据库里。只有解放自由，让贩卖信息的可盈利可图，整个生态圈才会好转。


    链家近期拿出 4 亿现金，希望能更新 3000 万条真房源。这无疑是走在正确的道路上。他们也被“脏”数据折磨得死去活来。


    但可以预言的，他们仍将会是失败。因为他们还是轻视了这个问题，10 元/条的预算根本只够完成一期工程。


    整个产业的 30%收入，要投入房源维护，才能差不多把房源更新到最新。


    # 六）安居客的时代


    直到今天，篱笆上的一些小白，仍然坚持地相信，“安居客比真实价格低 15~20%”，“取最高的价格，差不多就是真实房价”。


    一笑加一笑 (微信号: 150500211) 邀您加入水库交流群。群内文集每月一更新……'
