    # 五) 民宿流


    随着法租流的描述，我们要讲讲另外一个流派：“民宿流”。


    民宿流可以视为法租流的“全面加强版”，它在各个指数方面都要胜过快租流。


    曾经有人说，奋斗的真谛就是：“35 岁之前拼命地压榨自己，35 岁之后享受人生，35 周岁整退休”。


    这句话到了没心没肺的某多军口里，就变成了：“既然有人可以 35 岁退休，为什么不可以 28 岁退休”。


    28 岁退休，很 NB 么。


    不，我们还是低估了中国 90 后的威力。这句话到了某 90 后的嘴里，又变成了“既然可以 28 岁退休，为什么不可以 23 岁就退休”。


    于是某人一毕业，毕业第一年就退休了。'
