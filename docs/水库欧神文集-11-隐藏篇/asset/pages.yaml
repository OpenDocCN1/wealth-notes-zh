  md: '# **伤敌十指，不如断其一指！**


    +   创业初期必须在一个痛点上做到极致；

    最忌讳纠结各种细节，用力不够集中，同时延误宝贵的时间；


    只做 <br> 不做 <br> • 出租车； <br> • 专车； <br> • 支付； <br> • 用户积分；


    ![](img/7a02d093f22d4b34f1f7e41fd915e3b5_7_0.png)


    ![](img/7a02d093f22d4b34f1f7e41fd915e3b5_7_1.png)


    # **先拼长板，再拼短板！**


    ![](img/7a02d093f22d4b34f1f7e41fd915e3b5_7_2.png)


    +   创业者需要先把自己的长板发挥到极致，从千军万马中杀出一条血路，抢先获得融资，把业务优势转化成融资优势（关键是速度，不要过分纠结估值和金额）；

    业务和融资暂时领先后，需要尽快补齐自己的短板，再次转化成下一轮的融资优势；

    案例：某社交电商

    擅长社交传播能力，借助社交媒体迅速低成本的获取了大量用户，但是供应链能力不足，客户体验不好，早期留存很差；

    A轮融资后，迅速完善供应链能力，提升用户体验，留存大幅提高；'
