- pgno: 11
  md: '信息就是财富。IP 就是金钱。


    各大房产公司自然不会配合，谁也不会免费地把信息共享给 fangdi.com。


    后来上海市政府强行规定，任何二手房交易，必须先把房源公示在 fangdi.com 上面十四天，然后才可交易。


    于是各大中介公司，约好了客户，签好了合同。再把房源上传公示。无非多一道手续，拉长点交易流程罢了。


    再之后，上海市政府也觉得无趣。Fangdi.com 就这样不死不活地挂着，前几天还见过二个该公司的人。事业单位。


    # 四）生态的摧毁


    Fangdi.com 事件并没有平息。但其背后，则是对应着整个业界生态圈的破坏。


    自从 2006 年 fangdi.com 时间后，各大经纪公司，不约而同地，开始削减了“房源组”的规模。


    因为现在政府不找你麻烦。而你做大做强之后，始终是一个法律上的隐患。政府告你隐藏数据库怎么办？


    之后各大经纪公司的做法，是扩大“销售”部分，削减“房源”部分。强大四肢而萎缩大脑。


    宏观调控之后，交易量骤减。又加上一连串削减成本的要求，于是房源组越发萎缩。到今天已经微乎其微了。


    今日今日我们接触的是什么，是安居客，是房多多，是 Q 房，是搜房，爱屋及乌，德佑在线。


    他们共同的特点，一是互联网，二是海量房源。


    这是一件让人完全无法理解的事情。我很难想象一家网站，如何拥有上海 80 万，全国 1000 万条房源的。


    众所周知，房源是需要维护的。因为房价时时在变，房源时时在变。最多 3 个月，报价就会不同。有时候连房屋状态都会不同。


    找到一个真实的电话，再打过去，这些都需要成本。维护一条真实的信息，每个月至少需要 2~5 元。


    可是，许多网站，一出手就是几十万条房源，几百万条全国。'
