  md: '她退休的主要方法，是搞“民宿”。


    民宿是什么，没见过猪你至少知道国外 Top 20 中有一个 Airbnb 网站，国内有蚂蚁（mayi.com），小猪（xiao zhu. com）等山寨跟风。


    民宿就是短租。其主要的特色，是把房间装修成非常有特色温馨之所。


    然后在空间上分割：出租一个卧室，提供早餐。


    在时间上分割：提供 1~3 天的短租。


    民宿的主要竞争对手是酒店和长租，但是：


    +   1）虽然民宿和住酒店都是 800 元/晚，并不便宜。但是酒店标房一般只有 25 平米，行政套房 37 平米。


    而 800 元住民宿，可以住到 80~120 平米的二房。几乎比酒店总统套房更宽敞。


    +   2）虽然酒店有更标准化的洁净服务，但民宿一般可以通过房东的温馨，聊天，导游指引，提供 更 Face to face 的人性化体验。


    +   3）虽然民宿比月租要贵，一般贵三倍左右。但是民宿灵活。可以提供 1~3 天的超短租赁。也能提供一个卧室，甚至一个储藏室的超廉价产品。


    +   4）如果形成 Hostel 类似群体，则在民宿中可以结识新的朋友。


    民宿一般租得很贵。如果按照房间数 * 天数，则它的总租金，可以租到整租月租的 300% 左右。


    也就是你普通月租 6000 的三房；


    如果搞民宿，则是 800 一天。


    可是，这是非常非常高的利润。也很容易赚钱。


    论租金，民宿甚至比专门做外国人生意的“法租派”还要高。'
