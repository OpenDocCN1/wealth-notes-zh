  md: '在这个时间段中，我们给予它的是“十年”的耐心。十年已经是一个足够长的时间，足够你将现实和理论中的珍珠沉析出来。


    2015 年，你借助的其实是 2005 年的单字。这个单字必需，必然，必定已经足够的赚钱。譬如你 60W 变成 2400W 的例子。然后这套房子。你再进行资本运作，无论是出售，加租，再抵押。都足以支撑你下一轮今年
    2N 的运作。


    而 2016 年呢，你用的是 2006 年的单字。


    2017 年，用的是 2007 年单字。


    …………


    ……


    到了 2025 年实在没存货了。可是，不还今年 2015 新买的么。


    到了这个阶段，2N 定理算是通关了。


    我们一直说 2N 通关不难。难的是下一句。


    # 五）结束语


    人无远虑，必有近忧。


    你今天的财务状况，是由十年前的举动所决定的。


    我们说炒楼是一件升级修真的道。从 6 套一直可以修到 54 套。


    但是，其中每一个阶段，其实是环环相扣的。


    你必需在前一个阶段完成得很好，才有后一个阶段继续上升的潜力。


    “房价翻五倍” “没有大的损耗” “没有走弯路”，才能共同构建起你今天继续升级的潜力。如果当年你买得不够多，涨得不够快，期货浪费损失了很多钱。手里最优质资产只不过是一些小炮弹；


    那你就很难维持极速的发展速度。换句话说，内功基础没打好，吃吃补药吧。


    （vevon_ou@163. com, 2015 年 5 月 16 日晚）


    # 六）最后一段话是写给 zhifei 的


    Zhifei ：


    如果要我给你开财务重组药方的话，我的建议如下：


    +   1）专注于“巨幅升值楼盘”。赚钱归根到底是靠一套套房子累积起来的。你目前甚至没有一套房子可以升值 5 倍以上。这是方向错误。


    +   2）未来二三年，你可能没有激进扩张的能力。不如接受这个现实。


    +   3）但是，希望永远在明天。从现在开始战略伏笔某些巨大潜力股，你可以比 2N 更快。'
