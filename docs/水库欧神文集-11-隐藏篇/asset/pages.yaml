- pgno: 77
  md: '投资的股东方，朋友方，你们也可以带朋友来。


    如果你们的朋友喜欢，任何人看中，出到 1000W 就可以拿走。


    这样的投资项目，他的 “回报” 就是被锁死的。就是 200%


    而唯一不确定的呢，则是 “时间”。


    你有可能仅仅花二年的时间，就翻了 200%，则你的年化有 40%多。


    你也有可能花了 20 年时间，期间经历大跌，再经历楼市复苏。一直到苦难周折，最后到你的孙子手里，才遇到 1000W 出货。廿年化 3.5%回报。


    但无论如何，从 “套利和套险” 的角度来看。


    你的收益永远是正收益。只不过赚大赚小而已。


    这就保证了你第一级安全性。


    同时，因为房地产本身是一个 “通胀驱动” 行业。


    只要纸币不断滥发。大排面不断涨价。从长远来看，核心城市的房价永远是涨的。


    所以你这个 200%的目标也是可以实现的。只不过时间长短而已。


    而这个策略的好处是什么呢。


    最大的好处，是绕过了 “估值” 这个大难题。


    这套房子，当你买下来时，是按照 500W 的市值来买的。


    买下那一刻，他肯定是不值 1000W 的。


    此后，随着纸币的通胀，只要某一天纸币后面多加三个零。1000W 是肯定到来的。这点也是毋庸置疑的。


    那么，如何面对股东的指责 “贱卖” 呢。'
