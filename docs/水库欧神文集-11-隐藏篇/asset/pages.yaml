  md: '# 天诛晋升方案 #F690


    2016-10-29yevon_ou水库论坛


    ![](img/7a02d093f22d4b34f1f7e41fd915e3b5_116_0.png)


    # 天诛晋升方案 #F690


    我们家带两个小孩，忙得天昏地暗。天天趴在屁股后面收拾残骸都来不及。


    听说旧家庭都是生八个，九个孩子。俺怀着崇敬的心情，问家里老人当年是怎么撑过来的。老太太眨眨眼睛，“柴捆柴”啊。


    # 一）天诛的瓶颈


    炒楼到达 1 套，6 套，16 套，都会遇到明显的瓶颈。


    在 16 套时，较主要的是“资源”的瓶颈。


    在这个一阶段，基本所有潜能都已经开发了。现金和定期存款几万年没见到过了，理财产品也很久没买了。基金股票被削减，被抽血，只剩小股部队。


    所有能挖掘的财源，信用卡已到了尽头。父母亲友的钱都打借偿还过了。而多军池子里的拆借，都是同路苦难人。


    在 16 套时，一个明显的瓶颈：“没钱了”。


    这是切切实实，实实在在的没钱。每年的 2N，似乎是一个无底深渊。吞噬了你所有的精力和潜力。


    2N 已经履行了太久的时间，感受是“诸军皆溃”。各条战线都已经透支作战，疲惫不堪。


    别说继续扩张，加速度的扩张。哪怕是你仅仅维持目前的水准，都已经开始了有漏水。有时甚至是负现金。


    今天 zhifei 问我，该如何破。


    # 二）柴捆柴


    老人们的回答，是“柴捆柴”。'
