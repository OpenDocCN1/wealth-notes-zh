  md: '化现任，收集选票造反。更狠的是，不时找上在任业委会主任家们去闹，早晨上班时路上堵住找麻烦，据说还发生过肢体冲突。我对此很反感，感觉跟文革一样，我相信许多业主也有同感。在任的四十岁左右，正直事业上升期，哪架得住一伙人软硬兼施地磨消耗，没几个月也就下了，以M伯为核心的新一代大爷大妈领导集体正式接任，和前任之间的矛盾立即按下，之前大字报里所述的所谓黑幕再也不提。


