    # 众筹买房计划 #Z01


    起因，方法，利益，发展，目标。


    一）众筹买房的起因


    “众筹”这种事，早在三四年前就想搞了。


    想要搞众筹，有几个显然的历史原因。


    首先，2011~2012 年市场上充满了笋盘。有大量我们“明知”可以翻三四倍的房源。


    “炒楼”是一片蓝海。这个市场广阔广袤。资源不是问题。根本不愁收割不完。


    但是，眼看一大群沙丁鱼在眼前。这钱你却是赚不完的。


    因为你“啃了一套”“又啃了一套”“再啃了一套”。


    这事终究是有底的。你家又不是开银行的。瓶颈主要困于“自有资金”。当你自有资金打光了，你也就啃不动了。


    但接着你可以动用“债权”，你可以向小伙伴们融资，借钱。'
