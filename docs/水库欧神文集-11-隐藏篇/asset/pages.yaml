- pgno: 10
  md: '寻觅优质的房源，和寻觅优质的客户一样重要。


    这是中介发展的二大方向。


    # 三）掠夺


    2006 年时，上海市政府出台政策法规，要求所有的二手房挂牌。统一先登记在 fangdi.com，然后才可以对外销售。〔注 [1]〕


    当天晚上，我和几个四大的 P 在新天地吃饭。会计们纷纷表示支持政府的决定。认为这样可以建立一个“公正，透明，公开”的市场。避免二手房市场的价格不透明，恶意跳价等等现象。


    我幽幽地说道，“几位身为四大的高级 Partner，如果有一天离开了四大，你们剩下的最宝贵资产是什么”。


    几个经理们面面相觑，然后说：“资历”。


    “经验”“工作经历”。


    我冷冷地继续问，如果老板请你去，纯粹因为你的个人能力。那你最宝贵的资产是什么，凭什么说你是从四大出来的。


    “你最宝贵的资产。其实是你的小本本。上面记录着你这些年接触过的客户，CEO 和 CFO，他们的电话，联络方式，喜好和搭讪方法”。


    “信息，信息才是一个高级管理人员最宝贵的珍藏”。


    同样道理，对于房产中介来说，信息就是宝贵的财富。


    获取一个电话号码，平均至少需要人民币 30 元。


    如果你要上门拍照，每一组成熟详尽的含照片数据。至少价值 200 元。因为这至少意味着 2 个员工，1 小时以上的工时。


    对一个业务员来说，他最宝贵的就是他的客户租户信息。对于一个公司来说，他最宝贵的就是房源信息。


    “fangdi.com 是一家商业机构，不是政府部门。你今天强行要求全市的中介，无偿把信息全部都登录到 fangdi.com 上去。你这不是抢钱是什么”。


    事情的解决方案，自然是富与中国特色的幽默喜感。'
