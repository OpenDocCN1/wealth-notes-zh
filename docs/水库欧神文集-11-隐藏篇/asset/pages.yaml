  md: '到 2023 年，你再以 A 单元向银行申请加挢 200W 元。


    也许有人会问，你 A 元不是已经借过 200W 元了么。怎么又可以再借？


    别忘了，这时候已经过了八年，你的贷款已经还得差不多了。


    你每个月还进去的，其实一大半都是本金，只有小部分才是利息。现在这些本金又积累成你的财富了。


    按照这个 pipeline 流水线的模式，你每年都可以新增 200W 的现金流。一小部分留出作月供，足够的实力够你再去 2N，足够的实力够你花天洒地。


    这是一件了不起的事啊！


    你想象一下，一个“税后年薪”200W 元的钻石领领，过的是什么样子的人生。而普通人一年五六十万，又是怎样的生活质量。


    有这个 Pipeline 存在，你就可以保证在可预见的将来，每一年都有 200W 现金年收入。


    要做到这一点，首先你要有十个“成熟”的儿子。


    我们一直说，在第 1 套，6 套，16 套时，会有明显的分界线边际。


    要形成这套流水线架构，你至少需要入套房子，最好十套，最少六套。


    # 五) 结语


    从一开始，我们就没想把贷款还清过。任何一个资深的多军都明白，“完全没有贷款”，是一种不可想象的生活。晚上也是睡不着觉的。


    工业时代，城市生活，我们和田园农村永别，再也不是那样的三观。


    我们假设的是 D 算法永远维持那个水准，贷款永远不变。当一套房子的贷款，由 100W 降到 70W 时，我们就再做一次加按揭，再把他的负债率泵上去。


    贷款是什么，贷款只不过是一种理财工具。'
