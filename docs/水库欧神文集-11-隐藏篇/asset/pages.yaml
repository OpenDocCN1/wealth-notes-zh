  md: '# ## 中介篇（二）----房源（全） #2455


    ![](img/7a02d093f22d4b34f1f7e41fd915e3b5_9_0.png)


    # **中介篇（二）----房源 #2455**


    在很久很久以前，中介是分为寻找房源和寻找客户二个组的。


    +   一）房源组


    中介要促成成交。他有两个方向可以努力：


    +   1) 更豪爽的客户


    +   2) 更便宜的房源


    你们店开在那里，就是等顾客上门。最理想的是进来一个土豪，看啥都便宜。


    随便聊几句就下一排订单。


    优质的客户就意味着金矿，人形ATM。就象温州富婆一样。


    但是，中介还有一个努力方向。更便宜的笋盘。


    譬如，你找套内环线的房子，只卖 5000 元/平米。或者找套汤臣一品，卖 100 万元/套。


    那么，你的客户会从人民广场排到老西门，几十组人疯抢一套房子。


    发掘到了笋盘，也就意味着大把握成交。意味着大把握获得佣金。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……'
