  md: '譬如说南瓜太妹搞了笔 800W 的企业贷款，分 36 期，每个月还 25 万多。还到吐血～怨声载道，死去活来。


    她一度质疑在如此艰辛的生活下，还能不能进一步扩张，还有没有未来。


    我说没问题啊，随时迈入下一个关口。


    因为你归还的 800W 贷款，每月月供 25W。其中有 21W 其实是还本金，只有 4W 是还利息。


    看似你每个月都在往银行搬桑塔纳，其实你是在存款，不经意间银行又有 300W~400W 的信用恢复。


    那么你该怎么办呢。过个二年二年半，重新再问银行申请借出来！


    这时候，你一笔又可以再借个五六百万，马上就是大型项目的首付。金额增加，时间拉长，而月供也并没有变化。


    一般而言，我们对抵押贷款的利率并不敏感。甚至对抵押贷款是 10 年，还是 20 年 30 年，也并不敏感。


    而后者，往往是新晋多军津津乐道，以为天大的事情一般。


    为什么，因为我们清楚，无论怎样的抵押贷款，“三年之内肯定要毁掉重新做”。


    一笔十年期的抵押贷，过了三年，我们往往并不等到他全程都结束。


    截断他。


    重新向银行申请借出来。哪怕其他所有的条件都不变，我之前 36 个月还进去的几十万“本金”至少可以重新借出来。


    一笔 10 年期贷款，到了第 7 年末。我们就重新办一下。再把他“展期”成十年。


    哪怕和当初月供利率都不变，我也能按揉套出几十万。'
