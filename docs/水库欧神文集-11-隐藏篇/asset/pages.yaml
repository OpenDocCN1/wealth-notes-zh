    所以对于最高层级干部，“不动如山”是最重要的评语。而轻浮惶恐之人，则往往被认为不堪大任。


    股灾发生时，中堂正在欧洲。对情况不了解。我们不知道是谁给他汇报的工作。但里面显然大有玄机。


    在汇报中，将中国的“金融形势”描绘得惊险万分。网顾 170%普遍赢利的现实，把中国描绘成券商资金链几乎断裂，融资融券连锁反应，恶劣到像 2008 年美国次贷危机前夜。


    我们不知道是谁做的二五仔，但这显然是个坑。


    我们不知道这次是谁挖了坑给中堂跳。但他显然是被牺牲的。因为在整个事中，哪怕救市的结果南辕北辙，但真正的损失，却是中堂在大事件面前的“慌张”。


    他真是慌了。慌得失去了分寸，慌得失去了仪表。


    经此一役，人望和口碑都降到了极低。难道该轮到丁草花 A。


