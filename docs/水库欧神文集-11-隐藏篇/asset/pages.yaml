    # 二）众筹买房的方法


    5. 28 日和 Shínehich 聊（就是 SPI 那位），他说他正在拉几个朋友合伙买房。


    因为上海的豪宅，实在被低估得不象话。陆家嘴滨江两岸，买二套大户型高区景观房。才是永久的稀缺资源。


    聊天中他无意的一句话，“设定目标价”。


    顿时让我灵光一闪，豁然开朗。困扰了四五年的难题，一下子全解决了。


    “众筹买房”的路就此通了。


    解决的方案，是将整个的逻辑倒置。


    好比我拉 30 个人，大家一起合伙买了套 500W 的房子。


    我们不约定“操作技巧”。我们直接约定“目标价位”。


    好比我和各位说，“这次买的是 xxx 房子，买进 500，目标价 1000”。


    从买下的第二天开始，就在中介市场挂牌。


    挂牌价 1000W，绝不还价。但也绝不涨价。


    只要到到“净到手 1000”，就必走。没有任何理由，没有任何借口。不可以拒绝。'
