  md: '是珍妮纺织机么，显然不是。还不如黄道婆。


    瞠目结舌，其实你对于“工业革命”一无所知。$^{[4]}$


    “商鞅变法”究竟是什么，我们打开百度，大致有这么几条：


    +   1) 废井田、开阡陌


    +   2) 重农抑商、奖励耕织


    +   3) 实行连坐法


    +   4) 励军功，实行二十等爵制


    +   5) 改革户籍制度，禁止父子同居


    +   6) 推行县制


    现在我告诉你，开阡陌，鼓励农桑这种事，各国都在做。你不鼓励人家也勤劳。


    连坐法，统一度量衡，后世也玩烂了。没多大杀伤力。


    “商鞅变法”写了六条。


    其中五条是虚的。都为了掩护真正一条：励军功，二十等爵制。


    水库论坛，很久之前，有一篇论文《三代之治》#F129.


