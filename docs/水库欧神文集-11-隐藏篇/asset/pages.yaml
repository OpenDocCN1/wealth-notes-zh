  md: '# 一） 第一重


    我少年读书，强闻博记。课本中不懂的地方不多。


    《过秦论》是少数几篇，严重歪梧，想了许久都不明白的课文。


    最最令我抓狂的，是“秦国”为什么会灭亡。


    当时，俺正没日没夜地玩游戏，KOEI 的《三国志》。


    《三国志》是一款三观严重不正的游戏。小孩子千万别玩。绝对把你带歪了。$ ^{[1]} $


    哥哥就是掉入三国志的大坑。连续十几年没有明白。历史，政治，社科，全部都吮悟了。


    因为《三国志》，它基本是一款单向变强的游戏。


    最早开局的时候，你只有刘备，一座小小的城市，2000 兵力。几个将领。


    随着时间的推移，城市等级越来越高，户外农田产量狂升。


    兵力积累，武将如云。


    最神奇的是，武将“忠诚度”也是可以提高的。只要赏赐 200 金，就可以提到 100。而且永远都不会下降。


    “城池”忠诚度也能升。不断地开仓放粮，城池忠诚度也到 100，而且持久不降。


    没有贪污，没有腐败。


    没有九品中正制，没有府兵制破产。也没有结党和权臣。'
