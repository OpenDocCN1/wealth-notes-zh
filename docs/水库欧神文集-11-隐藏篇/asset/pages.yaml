- pgno: 47
  md: '可是，这样的思路是不对的。


    水库论坛是一个“毁三观”的论坛。


    因为从小生活在一个 Communism 的国家，这养成了我们质疑一切的习惯。因为谁也不知道哪条准则原则，就是国家精心安排的洗脑教育。


    “贷款”真的应该还清么。


    你看李嘉诚的长江实业，现在还有上千亿的银行贷款。可是直到李嘉诚退休，过世，你认为长江实业会还清银行贷款么。你认为长江实业会以“还清银行贷款”作为奋斗目标。


    不会的。对于整个李嘉诚，长江实业，富人阶层来说，这 1000 亿已经成为“底仓”了。或许会有 800~1200 亿的波动范围，但无论如何，长实绝不可能将贷款还完。


    贷款是什么。贷款绝不是一种要归还的东西，贷款是一种理财产品。


    # 二）D 算法


    搞清楚了这个概念。我们再回过头来看 D 算法，就显得十分清晰。


    | 算法 | 思路 | 公式 | 下限 | 上限 |

    | --- | --- | --- | --- | --- |

    | A | 最好不贷款 | 贷款 = 闲散资金 | 0 | 贷款 = 收入 33% |

    | B | 尽个人能力贷款 | 贷款 = 个人收入 | 贷款 = 收入 33%，自由现金流很大 | 贷款 = 收入 75%，自由现金流为零 |

    | C | 尽量挖掘全部可挖掘能力贷款 | 贷款 = 个人收入 + 房租 | 贷款 = 收入 75%，一套房也不出租 | 贷款 = 收入 75%，所有房都出租
    |

    | D | 贷款就是一个数字 | 利息 = 个人收入 + 房租 | 收入 = 月供 | 收入 = 利息 |


    C 算法的上限 = D 算法的下限，大致是年收入的 30 倍左右。


    计算如下，按照目前的利率水准，每一期的月供，大约是贷款总额的 0.6%，一年 7.2%


    房屋本身的租金，1000W 房子租 25000，大约是房价的 3%，或贷款额的 4%


