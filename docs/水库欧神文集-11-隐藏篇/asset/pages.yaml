    极大地拉低了回报率。


    所以这事很考究“产品经理”的设计能力。


    当我们设计一个产品，“xxx 房屋，买进 yyy 万，目标 zzz 万”。其实我们心中是有谱的。对目标有一个大致的估算。


    什么样的房子，第一级阻力位，第二级阻力位............


    目标 150%， 200%， 250%，本身是是不同的产品策略。


    考究的是产品经理对市场的理解，预测能力。考的是功力。


