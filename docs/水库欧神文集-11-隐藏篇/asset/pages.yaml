    众所周知，战国初期，秦国并不是最强的国家。


    论人口，魏国最强。初期魏国的“重装铁甲”步兵军团，战国无敌。


    论国土，楚国最强。延绵长江流域。最后还吞并了吴越。


    论文化，齐国最强。稷下学宫，诸子百家一半出在里面。


    秦国像开挂一样，一下子彗星般的崛起，主要是靠“商鞅变法”。


    商鞅变法，秦国十年间由极弱变为极强。千年后读来这段历史，仍然令人目眩神迷。


    但是，“商鞅”变法，究竟做了些什么呢。


    中国的教科书，就喜欢在干货上遮遮掩掩。


    好比我们背了八小时“工业革命”伟大意义。


