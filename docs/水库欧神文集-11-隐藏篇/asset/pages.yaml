  md: '论升值，鉴于“出售时品相一定要好”理论，民宿和法租派都极佳流派。民宿甚至更好一点。因为软装花团锦簇。


    论适应性，法租派严格地被局限在法租界以内。浦东和郊环都根本没有这种生态。而民宿派则相对宽松得多。最佳民宿虽然仍是在 Downtown，但其他区域也是有移植活下去的可能。


    民宿相当于“法租流”的全面加强版。


    # 六）民宿派的缺点


    民宿派的弱点是什么。


    在悲观主义者的眼里，他们几乎想也不想就列出来了：


    +   1）持牌旅馆的灰色地带，警察的骚扰


    +   2）如家七天等经济型酒店的竞争


    +   3）门槛低，同业新对手竞争


    但我们要说，这几个问题都是麻烦，会削弱我的利润率。但绝对不是灾难。


    民宿有其市场定位，在五星级酒店/经济型酒店/普通住宅之间，的确能划出这么一片细分市场。


    他兼有五星级酒店的高 bigger，经济型酒店的价位，和民间住宅的宽敞。


    从细分市场而言，这一个划分是有效的。所以民宿市场，是可以活下去的。


    至于竞争，天下哪门没有竞争。只要仍处于灰色角落，竞争没有刺刀见血狂打价格战就可以了。


    那么“民宿流”的真正瓶颈和缺陷在哪里呢。


    在于“心力”。'
