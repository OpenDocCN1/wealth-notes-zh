- pgno: 13
  md: '这真是一个绝妙的主意。看来我只要在网页上加上一个小插件，每次 App 查询时自动乘以 1.15 倍，那安居客就是精准的，完备的，一致的？


    事实上，任何一个学过统计学的人都知道。如果乘以 1.15 就精确，所有房源“步伐一致”地矮一截。那他根本不是混乱，而是绝对的精确。


    真正的混乱是什么。


    有一些房源高，有一些房源低，有一些房源低估 15%，有一些房源低估 25%，有一些房源低估 50%。问题是，你还不知道那些是低估 15%，那些是低估 50%的。


    这才叫一团乱麻。连做反向指标的价值都没有。


    小白们从来没有经营过一个企业，从来没有操办过一个实体。他们不知道“精确的错误”有多难。


    如果 Anjuke 上所有的房源都是 85%的价格。那意味着他每一条房源都得到过核实，每一个客户都打过电话，每一个跟进电话都是确实的。


    所有的行政区，所有的板块，同比例同幅度的更新，同尺度的犯错。


    这么精确的事情。他根本做不到。


    所以实际的情况是，他有的数据低估 15%，有的低估 25%，有的低估 50%，以至于完全没有任何参考价值。


    一团乱麻。脏到尽。


    七）德佑在线


    讲了这么多务虚的话，我们来点实际的。


    譬如，长期抱怨中介的电脑系统完全不准。那我们 来实际举例。


    很多人都知道，我住在新天地复式。再熟悉不过了。


    打开德佑在线 www. lianjia.com，输入：“黄浦众鑫城”。'
