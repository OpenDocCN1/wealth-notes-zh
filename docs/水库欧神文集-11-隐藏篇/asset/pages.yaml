    在实际操作中，我们可能会出“众筹产品一号”“众筹二号”“众筹三号”之类的项目。


    升值幅度，不一定是 200%。


    更有可能的是，“一号”目标 150%， “二号产品” 目标 200%， “三号产品” 目标 300%


    因为楼市的涨幅，本身是“波浪型”的。他明显地区分为“高潮期”和“观望期”。


    最怕的就是，上一轮涨幅，正好到你“目标价”的 90%，九百万差了一口气没卖掉。


