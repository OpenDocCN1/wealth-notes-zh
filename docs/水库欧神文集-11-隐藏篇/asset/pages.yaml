    天子的儿子是诸侯，诸侯的儿子是大夫，大夫的儿子是公卿，公卿的儿子是士，士的儿子是庶人。


    这个天子是你的。但天下不是你的，还有很多小伙伴。


    不过不要紧。你只要生，使劲地生，拼命地生。'
