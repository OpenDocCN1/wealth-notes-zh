  md: '通过“债权”的方式，你可以再啃 NN 套。


    但是若干年后，举债这条路也是走尽了。


    因为你身边可以借钱的“小伙伴”是有限的。小伙伴往往也是多军。


    而且债权融资随着潜力的挖尽，利率是不断上扬的。最终廉价资金再也搞不到。


    你可以多买 N 套房子。但终究也有极限的。


    到了“天诛”后期，瓶颈越来越厉害，越来越厉害。所以你就一定要转型。


    任何赚钱之路，走了十年，就一定要转型。否则速度会越来越慢，阻力会越来越大。


    转型的一个方向，是 OPM（Other People’s Money）。


    所谓“OPM”，基金经理代理理财，就是一个非常好的例子。


    因为任何一个人，他的“自有资金”永远是有限的。


    但是代理理财就不同了。你可以操纵一笔大得多的资金，然后仅抽取 1%的“管理费”。


    靠管理费，就可以让你活得很好，活得很滋润。


    最重要的是，“代客理财”的上限，就可以大很多。成长无极限。


    天底下的“基金经理”千千万万。但如果你仔细看，“股票基金”“债券基金”很多。却从未见“炒楼基金”。甚至连这个行业都没有。


    连“私募”都没有。


    根本不是政策法规的问题。真的一家也没有。


    为什么？


    答案出在根本性的一个问题：“无法确定收益”。'
