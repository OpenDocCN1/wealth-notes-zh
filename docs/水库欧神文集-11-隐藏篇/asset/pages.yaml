- pgno: 117
  md: '柴捆柴本是乡村术语。意思是上山砍柴的时候，你不用带一根很长的绳子。真的砍了许许多多柴火，你可以将软枝抽出来当绳索。以软树枝束硬树枝，把整捆扛回来。引申到带孩子上。就是以“大孩子带小孩子”。


    如果你真的生八个九个孩子，那么等你小孩子出生的时候，老大早已经 8~10 岁，甚至 13~15 岁。


    在这样情况下，老大已经是一个很懂事的孩子。他可以照顾弟弟妹妹，分担家务，甚至完全不用家长操心。


    我们举“柴捆柴”的例子，对应的是天珠的困境。


    从炒楼这件事一开始，我们就是 2N 的节奏。第一年 2 套，第二年 4 套，第三年 6 套，第 4 年八套……


    你们有没有发现其中的逻辑谬误？


    逻辑的谬误在于，你永远都是“付出”。


    这件事，对于刚开始炒楼，或者入行不深的人。是一恍惚不会想到的。


    但其实“单纯的付出”，是很不合理的。


    就好像父母抚养孩儿，当孩子 1~2 岁，3~4 岁，5~6 岁，8~10 岁的时候，父母都是单方面的付出。


    可是然后呢。


    # 三) 次级火箭


    孩子终究要长大，好单子终究会开花结果。


    如果你每年 2N，那么当你买到 16 套时，差不多是第九个年头。


    一般而言，我们的“项目”，十年无论如何见到了回报。


    上海的房产，2005 年的价格大约是 2015 年的 20%。


    十年之间，上海房价翻了五倍。如果算上杠杆，则赢利更是惊人。


    譬如我 05 年初买的黄浦东叠城四房复式，240 平米，当年仅花了 200W。


    三成六十万贷款。


    今天他的估价能到 2600W。扣除贷款后净 2400W。相当于 60W 翻了 40 倍！


    由 60W 变成 2400W 是什么样的感觉。妥妥的 A6 变 A8。


    法语简直就是 Nouveau Riche 啊。


    用带孩子的感觉，相当于你每年 2N，终于带出头了。孩子 22 岁，上大学毕业开始工作了。不仅不需要向家里拿钱，而且还能反哺家庭了。


    同样道理，如果你每年 2N。坚持八年。到第九年实在再也抽不出血时，怎么办。你回头看看自己的苗子，有没有茁壮成长的？


    # 四) 苗子


    我们这个流派，称之为“大户型低单价”。其核心思想，是放弃掉一切的流动性，专心追逐升值。


    我们这个流派，可能是过得最苦的，最难修行的，但一定是“账面”财富增长最快的。


    但是，再漫长的路程，终究是有尽头。是金子总会发光，哪怕这个时间再远。但终终定要一鸣惊人，一飞冲天的。


