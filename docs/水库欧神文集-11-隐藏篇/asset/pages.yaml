- pgno: 48
  md: '则每一套房子，你现金缺口：7.2%-4%=3.2%


    这部分要靠你自己的工薪性收入去填。所以就是 30 倍。


    你每年“税后消费后”结余 60W，你就能撑起 2000W 的房贷规模。


    但是我们从 C 算法跨入到 D 算法时，我们的扩张能力要增加不少。


    在 D 算法中，你只需要和利息打平。


    目前基准利率是 5%，房租收入等于贷款额的 4%


    则你每年的缺口，仅仅只有 5%-4%=1%


    也就是说，你可以撑起自己收入“100 倍”的资产组合包。50W 的年薪，可以维持运作 5000W 贷款。


    这仅仅是一个最简单的举例。在真实的世界中，多军的资金来源往往很杂。


    按揭贷款，抵押贷款，私人借款，信用卡，企业经营贷款。在这么多“借款来源”之中，30 年期按揭贷款往往只有一笔。只有第一笔才能做按揭。


    这就导致多军的资金流压力，远远大于理论值。


    当你只有一千多万的外债借款时，往往月供就要上 10W 了。这极大地限制了你的扩张步伐。


    因为你没有那么多的现金流来源去补，无法做到现金流平衡。


    而当你知道了 D 算法之后，你就相当于吃了一颗定心丸。


    你只要计算一下“总收入=总利息”支出。只要这两项打平。在 D 算法下你就是可以活过来的。


    即使你扩张徒急，也不会遭遇麻烦。


    # 三）D 算法的实务操作


    在实际实战中，D 算法主要靠“持续不断的加按揭”。'
