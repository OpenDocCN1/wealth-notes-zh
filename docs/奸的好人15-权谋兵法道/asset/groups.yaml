    李老师：如果你要顺着一个人的意思，如果是我，我一附和就会附和到极致。什么意思呢，示贱价，反正你都要顺一个人的意思了，一顺就顺到底，做到最附和对方那个就对了，对方肯定就记得你，好过你不温不火，就是刚才江魔说的那个，又不想得罪人，又想保留自己立场。但是，你不停顶撞人的后果，别人会不爽你。我们有个学生是不是和妹子相处总是批评人家？


    江魔：是的，我们有个学生，他什么都批评，在我们面前没有直接批评而已，但也会间接批评。在刘小姐面前直接批评我们。“他们这样做怎么可以？他们的书封面设计怎么可以？他们这样这样怎么可以？”他在我们的女学员面前，可能想示高价什么的。会和她们说：“他们这样讲课程，其实他们讲的东西我都可以说啦，我不想说而已。”但他又会挑那些女学员的毛病，说人家选择什么的又是有问题，他以为是在示高价，好像很有主见。但是他就已经得罪了很多人。


    李老师：那你注意下，其实用阴谋论来看，用资讯不对称来看，我们的学生都已经看出了他资讯不对称，“既然你整天说他们不好，你还来上他们的课？”上课是要给钱的哦？他其实经常来上课。“你这么看不起他们的书，你又要买？”他又专门在女生面前谈论我们，他目的是什么？他根本就是想示低价。在女生面前吹水，说我很厉害哦，我连老师都敢批评，我都能看穿老师的缺点，封面怎么做更好。诸如此类，他就是要包装自己，让别人觉得他很厉害。


    江魔：对于大人物，你其实不用光是拍马屁，或者纯粹贬低人家，再或者纯粹模棱两可。明天我们会说天堂地狱法。如果你有办法做到，对方对你的印象就会很强。所以这些东西是有技巧上的巧妙之处的。


    李老师：我们今早说的一样东西，有时令对方爽的办法是什么？让他觉得你教会你一些东西。如果你真遇到李嘉诚，你要制造一个惺惺相惜的错觉。你可把你平时说的东西，变成他平时说的词汇字眼，然后和他交谈，但是你要故意说错一点点，我们是要不耻下问。但我们要是有技巧的不耻下问，什么意思，以错换对，我专门在这个资讯上专门说错一点点，一说错了，那个人如果好为人师，他就中弹了，他就要纠正你，那你就学到更多东西了。所以你要学会以错换真。


    江魔：主控权你一开始就尽量要拿到。如果你没拿到，我们在讲义上写了几种可行的策略，第一是勾魂。一勾魂，如果对方把注意力到了你身上，那暂时主控权就到了你的手上。第二。你没办法勾魂，就完全不为你所动吧，有时候你不为所动对方就会怕你，第三。你被逼无奈只能踩进对方的格局，那你就看看能不能用条件式的交换。


    李老师：条件式交换呢，你加个括弧写上限照12页，你现在别看，你回去做功课再看，我们有在12页写了一个例子，在这本红色的讲义里面。有说你做一个假交换，感觉上对方很有主控权，好像完全压制你，好像是在做条件交换，其实一开始你就要做好布局的，你写好参照12页。


    江魔：最后如果你没办法了，进人家格局了，你什么办法都没了，那就君子报仇十年不晚吧。


    李老师：记住，做生意，我们经常说一个理论叫大象理论，做生意的人、创业的人都要有危机意识，就好像你要知道，你的主控权是怎么被人夺走的。就好像你接外贸市场，那些有经验的国外商人呢，和你谈判他们是讲规则的，他要知道你工厂每个月的生产上限是多少，假设你是卖杯子的，你每个月上限生产数是5w个的话，国外的权谋手段呢，他们会用资源控制，特别是美国人，他们会用资源控制这招，他们会在你工厂下一个占你工厂每月生产上限数目70%的订单。你要不要接这个大订单？美国人为什么要这么干？是有目的的，假设你的工厂是个泳池，本来你泳池的水没有满，他下一个70%数量的大订单是什么用意？他是个大象，如果他进入了泳池，水位是不是很容易就满出来？大象体积很大嘛。人是很容易忘记危机的，当你们交易了一年半年后，美国人就要和你出招说，我们不玩了哦。拜拜了您了。你注意到没，大象一离开，你泳池的水会如何？水位恢复原位，你整个工厂会如何？开销不够了吧，你本来投满了生产力，美国人的
    70% 订单正好是够养这群人你还有赚。现在美国人撤单了，你经济不就没保证了？这个你要记得，这个是用外国人和你玩权谋手段，用一年半年换回他的合法伤害权，他稍微有点不满意或者想玩你的时候。他和你谈判可以说，喂，明年我不和你下单了。你会很紧张。整个谈判的局面你就被他拉扯住了。你就要进他的格局了。这个危机意识呢？江魔说的君子报仇，其实当这个大象跳进泳池的时候，你这一年半载的时间要做什么？你要铺开另一条路，我不是说要杀大象了，你有钱赚为什么要杀大象，你要把你的公司生意开拓到：有你这个订单很好，没你这个订单，我照样可以拿到别的订单。就是用这个手法来做声了，大陆有这样一个例子。


    大陆有个很有名的作家，余秋雨，都认识吧，他在大陆卖书很有钱了。他的版税多到没话说，你知道大陆的出版社怎么和他谈判？出版社付给他某本书的版税的时候，就和他说，我决定这一本书的版税我不给你，但我给你等价的股份给你，余秋雨第一时间听到，他肯定会同意，因为他从作家成了出版社的老板，你想过为什么出版社这样做？因为那时候余秋雨是出版社的大象，出版社在余秋雨没有离开他这个泳池之前，用版税卡住余秋雨，说没钱给，你书太好卖了，我没那么多版税给你，那不如你做我股东吧？你想，你不会吃亏的嘛，他就用这个办法，把余秋雨变成老板，又开了另一条生产线，叫余秋雨本人，因为说余秋雨你也是老板了嘛，那你也培养另一个畅销书作家出来赚钱咯。这也是化解大象离开的办法，不管你是什么行业，出现大象的时候，你一定要留意。


    江魔：在我们的第一本书里面，有个例子说，在我要去一家保险公司做演讲，保险公司的老板就和我谈判说为什么要请我做演讲，不知道你们还记得不，他大概就是说我们请过
    XXX 讲师，人家表情丰富，会唱歌跳舞，他就这样说，他说完后，我就没有附和这个人说我也会这些，因为如果我附和他，我的价值就下降了。举个例子，这个是我的价值，这个是公司的价值，在公司的立场看，他肯定认为我的价值比他低，价值，在我们书里写的，价值是真还是假？假的。他只用对比得出的结论，也就是说，价值高可以碾压价值低的，比如他说他喜欢
    XX 讲师，他们会唱歌跳舞表情丰富，如果我也这样说我也唱歌跳舞表情丰富，你看我的表情（笑），我一开始向他证明我的价值就降低了，当时我没回应他，原因他没问我任何问题，只是和我说这个故事，以后有人无端和你说这里对比故事的时候你们一定要注意，看看这种故事背后有没有这种测试，他想测试你，当然不是说你心虚。但你有冲动想证明的时候，你就要小心了，不是百分百你会被降低价值，但是你要避免踏进这种降低你价值的格局里，所以当时我没鸟他，因为他什么细节都没问，当他第一次出招没什么效果，第二个经理就进来和我说，这个是个好机会来的，曾经有个
    XXX 讲师来我们这里做演讲，我们总裁很喜欢他风格，跟着请他在全国都做这样的演讲。这是个好机会，因为他打压不下我的价值，他就想尝试提升自己价值，“这是个好机会，你做得好可能我们推广你全国演讲”。那么这样他价值就提高了，很多人就是这样加强对比。我一样没鸟他，我没回应他，最后他还是一直讲，就问我上课的时间，安排什么的，书里写很明白，我怎么回答？这个不行那个也不行。慢慢把价格提升了，最后他又说了一次他们喜欢
    XXXX 讲师，当时我做了个很简单的动作，因为我没写进书里。你们才会来上课（笑），就是我很轻微往后倾，看着他。当时我朋友在我旁边也是一样往后倾，看着他。不是那种很嚣张往后倾鼻孔见入人，而是稍微后倾面带笑容，好，现在你们问我“江老师你的课程多少钱？”我后倾一次和不后倾一次你们看看区别。分别是什么？你不在乎，但你别做的那么嚣张是吧。。（笑）你还是很有礼貌，你稍微向后，当时他也没问价钱，只是我向后倾后说完那些就报价钱，我们双方没有讨价还价的情况下，他就和我成交了，OK。


    你想，如果对方是很有经验的，很清楚格局，他可以和我说“我们喜欢 XX 讲师，他会唱歌跳舞表情丰富，”那么江老师我们为什么要请你？当他直接这样问你的时候你是不可以不回答的，他不问之类问题你可以不回答，但是没问也要小心，刚才他之前说那个故事，他们喜欢那些表情丰富的讲师我的确可以不回答，但是如果他说的是，他们很讨厌迟到的讲师，如果我不回答会如何，我等于默认，所以他说正面的问题你可以不答，但说负面的问题你一定要回答，你要和对方证明你不负面，如果对方问你：江老师你为什么要请你？你们要怎么回答？你们不回答，很奇怪哦，人家问为什么请你你都不回答？这么屌？答都不答人肯定有问题了，不回答是有问题。如果你回答，谁向谁证明？你向他证明你价值会如何？贬低吗？不，通常是连续回答了两次三次之后，例如问你：为什么选你做讲师？你回答：我的这个课程是市场最先进，很有效，你回答了，下一句你觉得别人会再问你什么？别人会问你：怎么有效呢？你要说：哦，学了我的技巧你们成交几率会高很多哦。如果我继续这样回答我就越来越辛苦，我越说我越辛苦，他越听越怀疑。


    李老师：你要记得，一个人拿你来对比的时候，那是人性来的，他未必经过很谋略的计算，或者也是经过了谋略的计算，他专门这样说，但这是人性的反映，像刚才江魔说的，为什么他们要提
    XX 讲师，我们假设，他听过这个讲师的名字，他用这个讲师的名气来比较，因为可能他没上过 XX 的课程，或者上过，用那个讲师做标准，现在你不够那个讲师出名对吧？当然现在江魔很有名。上述情况就少了，你想，他用一个有名气的压低你，你是不是要抬高自己？举例，江魔很有名，你是个新人讲师，别人就问你，你的课程和江魔课程有什么分别？你很难回答吧？难道你要说：我，我比江魔靓仔。（笑）人家肯定就说，帅有个屁用，重要是你教的东西有效吗！但是你写过书么？（因为江魔写过书）你想，不用很厉害，人性来说，因为他那个想法是主观认为，他觉得好的，他认为能压制住你的，他才用这样东西来做比较，在我们生活中，爸爸妈妈也是经常做比较的“你看隔壁小明，读书年年第一。你看你？”（大家是不是很恨小明。。。）他就是做这种对比，但是父母教孩子别用这种对比啊。你这样说，不是抬高你孩子的价值，而是越说越低，他会越来越没信心的。


    江魔：所以，对方问我“江魔我干嘛要请你做演讲培训，你有啥特别么”，你回答也不是，不回答也不是，模棱两可也不是，其实有办法回答的，答案就是，都要回答，回答之后，卡住一些东西，卡住啥呢
    15 分钟后说，现在是不是有茶点？


    刘小姐：5 分钟后有


    李老师：问问问题先吧


    江魔：来回答问题时间。


    学员：你们刚说的欠钱的时候，可以把人拉做股东的办法，那要是反过来，要是别人拉你进去股东呢？


    江魔：其实你的钱都是在别人身上，别人真的有合法伤害权的。


