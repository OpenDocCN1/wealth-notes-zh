    试过，在街边有时有基督徒走来搭讪，大多数很失败的原因是：第一，是一支公(是一个男人)，第二，一开始就问我一些乱七八糟的问题：“这个对方怎么去？”“有时间去参加……聚会？”“什么聚会？”“我教会……”我就不理他了。有些则很过瘾，我当时正在马来西亚双风塔(双风塔？)下读书，“你是不是住在这里？”“我说你的意思是我住在这个……”“不，不是。我的意思你是不是住在吉隆坡这一带？”我说是。接着他说我们的教会有……我：“没兴趣。”


    江：香港我就不清楚，在马来西亚可是很多人进入传销的。大部分都是这一年龄层的：第一，有很多幻想；第二，读完书不知怎么办，所以会有这种影响的。


    李：你要注意一下换工阶段，换工阶段是最容易被人洗脑的。洗脑的其中一个口诀是：刚刚新来新知道。如果你是一家公司的老板，你改变老臣子是不是觉得很难搞？公司推出一个新制度，老臣子反对，不肯。但你去一个新公司那里，那新公司有什么新制度你是不是都要听它的？所以说帮人洗脑也好，拿回主控权也好，都是在他进入能量最低点，他的方向还不是很明确，有压力，工作有挫折的时候。


    在马来西亚 97 年的时候，盗版光碟很火爆很猖狂，对电影院打击很大。我的一个朋友，他是马来西亚一家很大型的连锁戏院（电影院）的总经理。在那时，他经营的电影院每个月至少亏损
    200 万马币，一年就亏损 2400 万马币。因亏损严重，老总每个月都开会，老总开会不教他怎样做生意，也不骂人，而是连续问他问题。他感到自己的职位就要摇摇欲坠了。他压力很大，开始彷徨，没什么方向。


    这个人对传销是反感的，他整蛊（捉弄）传销商的手法是很过瘾的。传销商来推荐他，拉他做脚（下线），他第一时间就问传销商：你是想找我做脚是吧？那你觉得传销是易做还是难做？注意一下，他这一招是在刁难传销商的。假如你是传销商，你来和我说：“李生，江生，我推荐你入会了，你们两个做我的脚啦。”我现在就问你：“你说做传销是容易还是艰难？”


    学：应该答容易。


    李：你答容易？我说给你听，“你现在连保荐我们两个你都保荐不了，你还说容易？这么多年的朋友了，你还来骗我？”假设你来找我时夜晚。“9点多了，容易？来拉，保荐我啦！”


    你觉得答艰难有问题吗？


    学：有。


    李：答艰难的话。“艰难？是不是朋友来的？这么艰难的事你还来找我做？”


    所以，无论你是答容易还是艰难都是死！他是专门整蛊你的。因为他职位的关系，许多传销公司的老板都来找过他，连 001 都找过他。马来西亚还有两家本土的传销公司，后期找一个卖粟子的农夫，只和他讲了一个很简单的说法，刚好在
    97 年，他工作压力大，那农夫说做传销好，这是属于你自己的事业，打工不是你的事业，打工是帮老板打工，做传销呢，是你自己做老板。农夫就是用这么简单的话来骗他，让他这一家大型连锁戏院的总经理做了自己的脚！


    你们要清楚，做传销、做保险，你觉得自己是老板吗？老板的定义对我来说很简单：整间公司我有决策权，整间的公司运作我清楚，入什么产品我有权。我想问你一个问题：传销商有这个权力吗？没的吧！公司和你说入美国的
    ABC 货，和你说得多神奇多厉害，你就代表公司去卖 ABC 产品。是的，我就形容你为高级销售员，真的是高级销售员。传销商，次高级销售员都有同一概念，在有工作压力和挫折时，嗖的一声，人家和你讲多么简单的一句话，跟老板打工，他会将这一样东西当诚信。


    在马来西亚，有很多做传统生意的人，整天想加入传销公司，他的背后隐藏着一个资讯：那些做生意却想加入传销公司的人，其实他们的生意都是有问题的，因经营得很辛苦才有这种想法。“唉呀，做生意做得不怎样，我都不知道怎么好，做大没本事(本领)，要死又死不了，要生显得好辛苦。”他们通常都是这样，没什么方向，很容易被人骗入去。假如在坐的有传销商啦，你们有没看到一个缺口？这个缺口是什么呢？


    学：没方向感的人。


    李：传销商乘虚而入，简单来说就是趁他病要他命！


    这就像一些（意外、分手、离婚、家庭纠纷、家人的病-死），诸如此类，这一类你画一个括号，这区域的人大部分是处于没办法求助，无可奈何的心境。在这客观条件下，这一类人最容易什么呢？本来是信仰基督教的，可能被人影响而信任道教或佛教；本来是一个佛教徒，被传教士影响一下，他会变成基督教徒。全部是没办法，无可奈何都是这样的。


    当一个人好像有家庭纠纷，离婚，第一时间我们马来西亚会讲，是不是我老公中了降头(降头：一种在南洋地区盛行的巫术)?因为她想挽回这段感情而又不想承认自己两个人相处出了问题。是不是我老公中了降头？肯定是啦！响(语气词)，我曾经见过


    一个学员，她和她的仔(儿子)起了很大的冲突，她的儿子和她断绝关系不去住，而去和亲家(夫妻双方的父母彼此互称“亲家”)住。这老人家就和我讲了一句话：“唉，我个仔被人下了药，中了降头。”最容易来说，她在没办法，无可奈何时，那时我如果要骗她，我只需要和她说，幻想版的，我没做出来。“其实呢，我有一个办法可以帮到你。我上童(上童，即跳童。乩童请神上身的仪式)给你看，你要信我，拿一笔钱……，”就是这样一个过程咯。


    江：是祈福党。


    李：祈福党，我们在《财色战场》写过的。祈福党都是拿这些东西来骗你的，只要不是身处绝境，不是每个人都中招的。举例：假如这间是庙，我上童，通常我是神坛的主持人，我是上童的那人，“你是不是要跳童？”你们是不是叫跳童？


    学：跳童。


    我跳完童后，假设这个人经常来神坛是我的信徒，你们两个是他的朋友。如果我要骗钱，你们两个是我目标，我找的是你们两个，不是找他。我问他，“这个是你朋友吧？”洪生就说是。这个人活不了七天。


    学：我看师很难的。


    李：他是我信徒。你感到他和我没利益关系，他就成了半个销售员。他一样是拿这些东西来骗你，只有七天命啰。我们华人有一句话：宁可信其有不可无。在这七天里面，只要有一点不好，你都会穿凿附会来解释，你会觉得越来越灵。


    江：好像你们电视上的鸡精广告，很厉害的。说你连续十四天买，会头脑清醒什么的，你在这十四天里面，比如考试得第一名……，连续十四天，就算不好，他都赚你十四天的钱，好厉害的广告。


    李：OK？接着就到，刚刚到陌生之处的，就像我的一个朋友……


    江：就像刚刚移民的一样，你那时一样是彷徨的，环境生疏，过一段时间你就比较容易入手了。我有一个朋友就是，他现在已经退休的了，不过在未结婚之前很喜欢骗女人，所骗的女人都是外地那些小地方到首都打工的。他专向这一类女仔下手，下手时就专门带她去一些五光十色的地方，通常的做法是去一动一静的地方。举个例子：先去跳舞很厉害的地方接着去饮咖啡，接着又去一个发生很多事的，再执着去一个比较静的地方。以一动一静每一次的转换,心中所产生的能量最低点,你可以想像一下,你在很热沙的地方,在出门的一刹那,你的心就由紧变松,这一刻有一个很细微的能量最低点。这个人在当时就是用这个方法来卖关怀的,送这样送那样来关心她。通常的女仔在两到三个星期就被他骗上床,再玩弄两三个星期就抛弃了。OK?你们有的见客户,不要只是坐在酒吧里面,做生意的认为只有在酒吧里才可以做生意，但谈的时候也很难谈成的，太吵了。不过你要借进去到出来的那一刹那，甚至你别以为在音乐和酒精的作用下，那人变得没那么戒备之类的，没错，开头没那么戒备，但在里面的时间一长，他就习惯了，反而变成机械式的了。你是要见一次换几个对方，李生亿万富翁的表哥，有时也是用这种方法，和不好说话的人来签合同的。


    李：是这样的。他很自豪的告诉我，好多供应商请一些人去酒吧或夜总会饮酒是有目的的。他告诉我，他是有策略和目的来做这一件事的，他的目的就是，一开始就社交，第二次，第三次是有布局的。比如我今天做生意和他有冲突啦，少些钱行不行？算了，不谈不开心的事，今晚我们去夜总会饮酒。好，慢慢聊吧。他们饮饮饮，到了夜晚的时候。他司机开车过来了。我在送他上车的那一刹，这么多年的朋友，怎样？怎样？一人让一步啦，开出一个他容易接受的价，达成一个小小的口头协议。是刚刚要走，出去的那一刹，心境转变的那个阶段和他说。


    第二件事，夜总会的消费是笔较高的，打工仔，销售员的一个小赢的策略是：你和一个客户第一次到一个地方吃饭，尽量找一些比较有纪念价值的餐馆(ABC,在客户的名片上写上坐在那餐馆的什么位置,什么日期,什么时间。这是一个伏笔。假设三年后,我和这个客户产生冲突,我做错了事,服务不周到。“不如这样,陈生,我们那晚的事怎么样。这天我很有诚意和你谈一谈,我看
    在 ABC 餐馆好不好?” 到 ABC 餐馆坐回当天的位置,一坐下来我就说，“陈生,你有没想过我们为什么坐在这个地方?” 他通常是想不到的。你就说:“在 1997
    年 7 月 7 号这天，我们坐在同一张台的时候就开始了我们的第一个缘分啊。尤其说我们华人，你是不是很重情谊的人啊，我服务你这么多年，发生了不愉快的事，这段时间我做错了，你难道真的是想咬住我不放吗?”
    这张名片在这里就起到了化解和客户冲突的润滑剂的作用。


    学：在商场那些地方可以吧？


    李：在外面一样是可以的。你可以讲回见面的时间。对白就是：“这么多年来，虽是人是物非，但是我们的感情还是那么好。”这样就可以免转头了。


    李：你们香港的建筑变化是很大的。


    江：能量最低点分两大类。我们刚才所说的那一类，是被动式的，是比较内在的，你未必控制得到的。我们最主要教你主动式的勾魂。主动式的勾魂有四个方向，之前李老师有写过以效果为信仰为导向，其实勾魂不止这四种方向，勾魂有好多种方法，OK？只要你达到这效果：对方停下，眼定定口张张的等你继续发言就对了，我们给你的这四大类是给你参考的，是为了激发你的头脑的，这里面的句子你不需要全部都背下来的，只要背下你最需要的就行了，至于其它的，你可以用自己的创意整出来。


    第一个：我们要讲的是好奇。总之人一有好奇的时候时间是暂时转给你的。好像我们所说的，主控权又分为实质的合法伤害权和虚构的格局主控权，如果格局暂时在别人的身上，如果你能勾到魂，对方好像傻了一样听你讲，这主控权就会暂时都会交给你，所以勾魂和格局和主控权是有关系的。OK？有几个例子，我们不需要全部都说给你听，其中一个是你和朋友谈了一段时间之后，就说我听了你这一番话，我注意到一件事，停下来，停下来之后你的眼神要定定的看着对方，要等对方问你什么事？接着你就可以说下去。


    李：这样的，就好像我刚才和你说的，一群人开会，你先让别人讨论一段时间。听你的话，我注意到到一件很重要的事，就停下来。“什么事？”所有人的目光就集中到你身上。


    江：你发言的时候，可以听听大家的意见，自己先写下，整理一下，看看有什么漏洞，再整理一个厉害的出来，给人的感觉就是你的见地有些不同。我和李老师认识的那个姓梁的辩论大师，在书中出现过几次的。他的头脑是很聪明的，他有一个很厉害的做法，他在开会前是没什么讲的，就是听听听，他听听就可以组织，到最后才说。他一讲，给人的感觉就是：“我刚才怎么没想到？”他就将你的见地提升了，不管是真的提升还是假提升，从另外一个角度来看，你是提升了。在中学生，大学生的辩论圈子里，那些人是将他当成神的。所以，你组织后见有漏洞，你就勾了魂再说出来。只怕就是你勾了魂而没话说，这就很尴尬，你勾了两三次就什么的了。


    讲：你看看第三个例子，这里有没有人经常做运动的？有的举手。


    江：我问你一个问题，你尽管回答就可以的了。


    江：你是不是经常做运动？


    学：是。


    江：哦，怪不得。


    江：我现在在问你第二次，你答「没有。」


    江：你是不是经常做运动？


    学：没有。


    江：哦，怪不得。


    江：当然，你说完后要有话说。我用一个例子，假如我是做室内设计的，这一间是你有的在办公室，我进来推销。我问你：“你在这间办公室通常感觉如何？”“好舒服，通常我都是在办公室办公多过家里。”


    江：哦，怪不得。你看这光线够猛，和墙上的色彩对比不强烈，比较柔和，你在这里干活是很容易的。假如你和我说道：不行呀，浑身不舒服。我就说：哦，怪不得。你看这光线那么猛...。一开始OK，但做多了你就觉得很闷。千隆间屈是可以重叠的。


    李：“哦，怪不得。”是可以用来害你的对手的。我用一家是制造矿泉水瓶的工厂来做一个假设。我到你工厂估价，你说：我帮你制造这矿泉水瓶。我很认真的看，还做出一些表情：“介意不介意我向你提一个问题？方便就告诉我，不方便就算了。”你对制造这个矿泉水瓶的原料生产是不是很了解？通常制造矿泉水瓶的并不了解制造过程的，我假设你不是很了解。“唉，”我好像有难言之忍。我深吸一口气，很严肃的问：你是不是和矿泉水瓶的老板很熟？你看我之前的表情，你是不是多少觉得有些不受？你一答熟，我就用嘴角来笑：哦，怪不得。你想到了什么？你答不熟，我笑：哦，怪不得。你看到一个人这样说，你第一时间想到了什么？我一定是发现了一些秘密而没说出来，而且是负面的东西。


    如果我要害你，第二步就拿一个有暇疵的产品和一个没暇疵的产品放在你面前比较一下，接着说：怎么有人制造出一些有暇疵的产品，说出一些理由出来。人的头脑是很喜欢预测和乱猜的。当你将这两个情节联系起来，你会想到什么？注意，我没有讲他一句坏话吧？你一下这个毒，以后你的竞争对手就有麻烦了。第三阶段：教他怎么管这一家厂。当然，有人问我，抢了这一客户你值得吗？你会麻烦吗？再想下去，万一竞争对手又抢回这客户，他用我教他的东西来管我，你问我觉得值得吗？我就认为很值得，因为很竞争。我认为吃得咸鱼抵得渴（吃得咸鱼抵得渴：做了某事就要承担相应的后果），讲的人你一定会认为他是好人，举例：su
    wei feng（苏文风？在马来西亚演讲的时候，他一上台，就骂风水佬。唉，现代的风水叔叔啊。在古代的风水如何如何，现代的风水如何如何…所以现代的风水叔叔的最高境呢，走江湖啊，好似我一样。两样东西是他最高的心法：一是老作（自已编写），二是拈估（猜测）。


    我问身旁的人，苏文凤的演讲怎样？很好，很老实，不是跑江湖的。呐，利害吧？苏文风害现代的风水师多惨呀！


    李：我今天如果想害同为讲师的人，我就说：衡量一个讲师的资格有两个，第一个条件是他有没出过书，如果他没出过书你根本就看不到他的思想架构和组织能力；第二，他的书虽没广告一样可以让你产生去上课的冲动。没做到这两条的讲师就有没料（料：本领、本事）。经济学家说人人心中都有一把秤，我在你心中放了这把秤，你以后以为讲师会怎样？你有没有出过书？给我看看，没上课的冲动哦。就算我很有料都变没料了。


    李：打开十一页，张力，张力兵法是什么意思呢，先给你们一个情景的感受，比如坐过山车，哪个阶段令你们心情最紧张呢？慢慢上升的过程最紧张，越来越高 的时候，你期待着冲下来的一霎那，那个冲下来瞬间是解脱来的，是解脱后的那种刺激。你上升的那个过程的心情，就叫做张力。


    比如看恐怖片，整个荧幕安静下来，声音越来越小的时候，你的头脑里就会想，鬼怪就要出来啦，就要出来啦。如果你和女朋友一起看，你女朋友很紧张的抓着你的手，等待妖怪出现，当妖怪出现的时候，她大喊一声：啊!!!
    其实喊出来是一种解脱。张力的意思是说：就要出来就要出来的那一刻，之后来一个转折，像过山车一样冲下来的那种转折，这就是张力兵法抓住情绪的一种模式。


    江：要玩张力呢，你要有少少的演技，当然不是让你具备梁家辉张曼玉那样的演技，你只要学会皱皱眉头，忍住表情，那就已经绰绰有余了。有的人问如何控制自己的表情没有变化呢？眉头不动，眼睛不张大，颧骨的肉不起来，总之全部是平，当然你要经常去练习，没有捷径可走，练到没表情为止。当然不是说平时也要没表情，什么时候才需要呢？讲价钱的时候。平时可以有自己的表情。玩张力，最简单的就是要学会皱眉，这是不需要学演技班就可以做到的。当你问别人问题的时候皱着眉头，别人就会有点点担心的情绪。举个例子，你皱着眉头很严肃的和对方说：“我有样东西告诉你，希望你不要介意。”对方头脑会有什么反应呢，对方可能会想是什么负面的东西，然后有点点担心的感觉。


    李：你们去餐厅吃饭的时候，可以拿来练习出招的，当然不要很多人的时候出。有一次我们在餐厅，吃完东西时候，就叫一个服务员过来，很严肃的和他他说：“你介不介意我问你一个问题？你们的厨师是哪里人？可以叫他出来吗？”我这样的表情你会想到什么？这回有麻烦了，发生了什么事情啊？然后厨师出来了；我们问他：“你是哪里人？你说，你煮的是什么菜式来的？”然后厨师讲了一大堆，出现了一点点紧张的样子，问我们，有什么问题吗？


    我说：“没有，我想说，你煮的东西真的很好吃。”哈哈！过了半年，我又回到那个地方吃，那个人还记得我，你们认为那次张力兵法（应为“兵力”或原文如此，此处保持原样：张力兵法）的拍马屁，是不是让你印象深刻呢？


    江：有一次坐飞机，下飞机的时候我皱着眉头问一个空姐：能不能问你一个问题？空姐说：可以。我说：你是怎么做的？空姐愣了一下，啊？做什么？我说：你的发型是怎么做得那么好看的？然后空姐哈哈大笑，接着用了五六分钟的时间跟我解释如何弄。另一次也是在飞机上，皱着眉头和一个空姐说：有没有人说过你的脸？空姐说，啊，我的脸怎么了？我说：没有，你的脸很Q，很像洋娃娃。


    李：我们有一次在一家鞋店，看一下人家做销售的手法，顺便收集一些资讯，去到的时候，我们看了一下鞋的价位，就是没事找事做，我们一坐下来，明知道对面的那个就是老板，我们就大喊：这里谁是老板？老板说：什么事？我皱着眉头很严肃地说：介不介意我问你一个问题？这些货是谁摆的？老板纳闷的说：有什么问题啊？我说：没有，刚才我走过前面几家店，看他们摆的货，没有你摆的那么出众。老板心里顿时乐开了花。


    江：请注意我们的架构是拍马屁来的，当然，这种拍马屁和普通的拍马屁有不少不一样，普通的拍马屁直接说你很棒啊，你很厉害啊之类，当然对方也是机械式的反应，拍马屁有两种反应才是真的，一是别人很刻意的控制着笑，不想给你看，二是笑到随风摆柳。这就是真的拍马屁有效果了。这个马屁如何拍出，其实就是用勾魂类来拍出，勾了魂，让对方定了下来，你再拍，就很有效果。


    李：对方会以为你讲些很严重的问题。我妹经常说我没良心，因为我每次出去旅行的时候，我妹都经常交待我帮她带一些她想买的东西回来，但是每一次我都忘记；我就记得买书而已。后来我一旅游的时候，我妹就过来说我：大哥，我要跟你讲一个好消息和坏消息。她是皱着眉头和我说的，我一听好消息坏消息，到底是发生什么事情呢？然后她拉着我的手，拉我进客厅。因为我当时能量最低点，就被她洗脑咯，就跟她走进客厅，问她什么事？她从手提包里拿出一张纸条，说：“坏消息就是你去到那个地方，按照清单上的给我买东西。好消息就是，我会给回钱给你。”然后我一去旅游的时候，印象就非常深刻。我就想起她让我买的东西，如果她没有这样做的活，我可能买完书，办完事就不记得她交待买的东西了。


    江：我们书里面那个问空姐拿电话的故事，那个空姐我已经有7年时间没有见她了，有天在一个地方正好碰到她，她一瞬间就认出了我。之气我没留长发胡须，再次见到她的时候，她说：你那条不一样了哦。哈哈。我们至少有七年没有联络，但是见到的时候还记得。就是因为当时做了勾魂马屁。大家要记得勾魂马屁的强项是给人家很深的印象，它的缺点是不能够老是用，因为它的印象太深刻，你不能短时间内再次用它。有次我一个学生对他女朋友多次用勾魂马屁，到后面就没有效果了。这一招的印象是非常强的，大家一定要注意斟酌。假如你对你老板要做勾魂马屁，一定要挑选好机会来做。如果你是做领导的，你可以用这种方式来奖赏下属，有时候奖赏下属不一定是要用钱的，用这种方式产生的效果会比用钱要强。如果你做得好，它的力量比用钱还要强。


    李：我们翻到13页，意料之外的举动。这个时机的把握比较重要。


    江：你要讲一些东西，做一些东西，是别人没有想到要这样做的。比如书里说的，拿着一张六合彩的票，接触街上的人去兜售信用卡，这就属于意料之外。有一次有个朋友和我聊天，聊得很投入，再过多半个小时，就要去一家餐厅见两个人。当他讲得很投入的时候，我就很突然地问了他一句话：你的车是不是停在那里？他说，是啊，就在那里，什么事？我说过半个小时我要去一个地方见两个朋友，你可不可以搭我过去？他还在迷茫中，说好好好。然后我说陈安之你知道吗？他说知道啊。我说：等下陈安之在哪个哪个酒店有一个讲座，等下有时间我们一起去吧？他说好好吧。当然，这个情况的客观条件是，他当时没有什么事情做。他莫名其妙的搭我去见两个人，等了我一个小时，然后又搭我去听讲座，听完了讲座又搭我回家。这招是有用到一点点洗脑，洗脑我们下午再讲，用意料之外让他迷茫的那一霎那，我们再做。祈福党，还有马来西亚掉钱党，都是用这个方法来做，你在街上走着走着，突然掉下一沓钱，你很意外，不知道该如何反应的时候，他们把握

