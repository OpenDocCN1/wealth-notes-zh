    ## 面试与格局技巧


    **李老师**：温和不？有些公司要钱也要人，是不是很温和？简单说你是逼到他没路走，要钱也要人。


    **江鹰**：有些公司根本不看人才，只要钱而已；有些公司呢，看重人才是不在乎钱的；还有的公司两样都看重。我想知道你们公司是那一类，一定选什么？第三个啦？


    **学员**：是不是把那个条件放最后？


    **江鹰**：没错，一定放最后。


    **李老师**：我问了我们那个经理朋友后，他听了之后没法回答，过两天他给我电话说想到办法了。他说遇到这样的人问这个问题的时候他就说：“现在是我审视你还是你审视我？”（笑）我就不知道他会不会这样做，面试不用这么僵吧？他是个找个下台阶的借口。


    **江鹰**：当别人选格局“钱也要人也要”，你就可以说：“没错，这就是我今天来找你的原因了。”这也是个赐封（Close）来的。然后继续谈下去，对于赐封你们还有什么疑问？（是一开二和一开三的模式？）


    **李老师**：一开二就是一正面形象、一负面形象；一开三是一正面形象、一负面形象、一中和面形象。


    **江鹰**：你要怕得罪人就一开三，你不怕得罪人就一开二。类似之前传销公司老总和我的对话。


    **学员**：赐封和 FREE 有什么区别？


    **江鹰**：有重叠，但不完全是。赐封是倾向影响人的行为，FREE 的范围比较大，它是 NLP 里面的。所以赐封这个东西，如果你想玩格局，你可以玩赐封；不玩赐封你就玩审核。我审问你要你向我证明，我们在《勾魂洗脑》一书里面写的那个例子不知道你还记得不：买鞋那个销售员去公司问了老板一些问题，老板还求他，他就用他公司只给客户
    33% 折扣和其他公司给 40% 以上折扣的规则做盗雷（Do Re）。说“我们不会给你太高折扣，但我们公司还存在了这么多年，这个是有原因的”，这个是勾魂。说你和我们公司订货，方圆多少公里的店面我是不给货品的，我怕你们互相压价弄到大家都不好，所以我们有规定。当然这是引诱对方，还问老板公司名称、员工、银行帐号等等信息。现在变成销售员审核客户。


    **李老师**：你们注意第六页。这个审核有真假之分，公司是不是要了解客户这些？这个表格是销售员自己做的，这个完全是假审核，你们要连惯你们。要看红色讲义，你写上“参考第
    11、12 页”。


    **学员**：如果对方不用我呢？


    **江鹰**：那是因为你没勾魂，你勾魂做够了那个才有效果。


    **李老师**：我们说面试。我们现在教学生你们去面试，很多面试官会和你说下“请你的三个理由”。因为大家都这样玩，所以我就教你们用反的方法。一进去，你就要主动说：“你看完我简历，或许你们公司有几个可能不请我。”然后又说几个“你们请我的理由”，接着马上审核公司：“公司里面怎么奖励优秀员工？”不停问，问的问题都是假设，一定是假设。为什么要做这个？你要让面试员觉得你有信心，一路问这种福利类，除非面试官很精通权谋。


    **江鹰**：我有个朋友其实不用打工，他也经常去面试玩。他经常去玩到最后，他经常问“你们是不是家族企业？”人会很好奇你为什么这样问。他说：“没什么，我想知道我能去到最高的职业是多少。”他这样说就暗示别人他很有上进心。


    **李老师**：如果是家族企业的人，肯定就说不：“是，每个家族企业都这样，你们。”这样谁和谁证明了？


    **江鹰**：时间不多了，你们有问题就问吧？6 点前要结束。


    **学员**：那第六页那个怎么破解？


    **李老师**：那些问题是你不能说的，你说这些是制造机会给人玩你。


    **江鹰**：别怕别人用格局玩你，他没兴趣是不会给你格局的。一个妹子对你完全没兴趣，你说你喜欢他，她只会和你说谢谢。和你玩格局就看你玩的手段漂亮不漂亮，能不能把主控拿回来。


    **学员**：有时候我们回答问题快慢是不是要控制？有时候我试过，我买东西、我写字慢，他以为我不鸟他，结果他还给我减价。


    **江鹰**：我会教学生用静默。有个学生是商业顾问，公司说可以给他 5% 的总营业额，他就用静默看着老板。


    **李老师**：是稍微后倾静默。


    **江鹰**：然后人不说话，对方是很不自然的。老板就开始解释了，他一看，有意思，继续不出声，最后一直提到给他 25%，他自己都崩溃了。


    **学员**：到一定程度老板是不是也会说“这是上限”？


    **江鹰**：当然，你一直不说话也不可能提高到 100% 给你啦。


    **李老师**：你们记得，学招式。这招可以攻，万一一家不说话，谈判里叫闷局。人家不说，你也不说，你比谁都耐。心，大家都不说，看看谁更需要谁？


    **学员**：问他有什么看法？


    **李老师**：不用这样。


    **江鹰**：我有个马来那边演艺圈的朋友，因为马来演艺圈的人收入少，拍电视收入不高。之前他每次拍戏前，老板问片酬的时候他总被人压价。后来他学了这招后，不说话，老板就会主动给他加价。当然这个是有限度的，你可以给稍微的静默给对方压力。


    **学员**：是不是成交前先勾魂？


