    ## 面试与格局技巧


    **李老师**：温和不？有些公司要钱也要人，是不是很温和？简单说你是逼到他没路走，要钱也要人。


    **江鹰**：有些公司根本不看人才，只要钱而已；有些公司呢，看重人才是不在乎钱的；还有的公司两样都看重。我想知道你们公司是那一类，一定选什么？第三个啦？


    **学员**：是不是把那个条件放最后？


    **江鹰**：没错，一定放最后。


    **李老师**：我问了我们那个经理朋友后，他听了之后没法回答，过两天他给我电话说想到办法了。他说遇到这样的人问这个问题的时候他就说：“现在是我审视你还是你审视我？”（笑）我就不知道他会不会这样做，面试不用这么僵吧？他是个找个下台阶的借口。


    **江鹰**：当别人选格局“钱也要人也要”，你就可以说：“没错，这就是我今天来找你的原因了。”这也是个赐封（Close）来的。然后继续谈下去，对于赐封你们还有什么疑问？（是一开二和一开三的模式？）


    **李老师**：一开二就是一正面形象、一负面形象；一开三是一正面形象、一负面形象、一中和面形象。


    **江鹰**：你要怕得罪人就一开三，你不怕得罪人就一开二。类似之前传销公司老总和我的对话。


    **学员**：赐封和 FREE 有什么区别？


    **江鹰**：有重叠，但不完全是。赐封是倾向影响人的行为，FREE 的范围比较大，它是 NLP 里面的。所以赐封这个东西，如果你想玩格局，你可以玩赐封；不玩赐封你就玩审核。我审问你要你向我证明，我们在《勾魂洗脑》一书里面写的那个例子不知道你还记得不：买鞋那个销售员去公司问了老板一些问题，老板还求他，他就用他公司只给客户
    33% 折扣和其他公司给 40% 以上折扣的规则做盗雷（Do Re）。说“我们不会给你太高折扣，但我们公司还存在了这么多年，这个是有原因的”，这个是勾魂。说你和我们公司订货，方圆多少公里的店面我是不给货品的，我怕你们互相压价弄到大家都不好，所以我们有规定。当然这是引诱对方，还问老板公司名称、员工、银行帐号等等信息。现在变成销售员审核客户。


    **李老师**：你们注意第六页。这个审核有真假之分，公司是不是要了解客户这些？这个表格是销售员自己做的，这个完全是假审核，你们要连惯你们。要看红色讲义，你写上“参考第
    11、12 页”。


    **学员**：如果对方不用我呢？


    **江鹰**：那是因为你没勾魂，你勾魂做够了那个才有效果。


    **李老师**：我们说面试。我们现在教学生你们去面试，很多面试官会和你说下“请你的三个理由”。因为大家都这样玩，所以我就教你们用反的方法。一进去，你就要主动说：“你看完我简历，或许你们公司有几个可能不请我。”然后又说几个“你们请我的理由”，接着马上审核公司：“公司里面怎么奖励优秀员工？”不停问，问的问题都是假设，一定是假设。为什么要做这个？你要让面试员觉得你有信心，一路问这种福利类，除非面试官很精通权谋。


    **江鹰**：我有个朋友其实不用打工，他也经常去面试玩。他经常去玩到最后，他经常问“你们是不是家族企业？”人会很好奇你为什么这样问。他说：“没什么，我想知道我能去到最高的职业是多少。”他这样说就暗示别人他很有上进心。


    **李老师**：如果是家族企业的人，肯定就说不：“是，每个家族企业都这样，你们。”这样谁和谁证明了？


    **江鹰**：时间不多了，你们有问题就问吧？6 点前要结束。


    **学员**：那第六页那个怎么破解？


    **李老师**：那些问题是你不能说的，你说这些是制造机会给人玩你。


    **江鹰**：别怕别人用格局玩你，他没兴趣是不会给你格局的。一个妹子对你完全没兴趣，你说你喜欢他，她只会和你说谢谢。和你玩格局就看你玩的手段漂亮不漂亮，能不能把主控拿回来。


    **学员**：有时候我们回答问题快慢是不是要控制？有时候我试过，我买东西、我写字慢，他以为我不鸟他，结果他还给我减价。


    **江鹰**：我会教学生用静默。有个学生是商业顾问，公司说可以给他 5% 的总营业额，他就用静默看着老板。


    **李老师**：是稍微后倾静默。


    **江鹰**：然后人不说话，对方是很不自然的。老板就开始解释了，他一看，有意思，继续不出声，最后一直提到给他 25%，他自己都崩溃了。


    **学员**：到一定程度老板是不是也会说“这是上限”？


    **江鹰**：当然，你一直不说话也不可能提高到 100% 给你啦。


    **李老师**：你们记得，学招式。这招可以攻，万一一家不说话，谈判里叫闷局。人家不说，你也不说，你比谁都耐。心，大家都不说，看看谁更需要谁？


    **学员**：问他有什么看法？


    **李老师**：不用这样。


    **江鹰**：我有个马来那边演艺圈的朋友，因为马来演艺圈的人收入少，拍电视收入不高。之前他每次拍戏前，老板问片酬的时候他总被人压价。后来他学了这招后，不说话，老板就会主动给他加价。当然这个是有限度的，你可以给稍微的静默给对方压力。


    **学员**：是不是成交前先勾魂？


    **江鹰**：勾魂是暂时把主控拿来，后续你做不好一样没用。


    **学员**：是不是先拿主控权？


    **江鹰**：主控未必是真的，暂时给你那个不一定是真的，他只是好奇就把主控给你，你拿到那个主控不是真的。


    **学员**：关于沉默我要怎么压制表情？


    **江鹰**：我可以给你所有理论，但这个要训练的。


    **李老师**：这个是累计的。失去主控的心情是患得患失，你是那一霎，那就真的是患得患失，装不出的。


    **学员**：有些公司阶级观念重，低级总是被人踩死，有办法让人知道不能随便踩低自己吗？


    **李老师**：什么情况？


    **学员**：有时候你做什么都被鸡蛋挑骨头。


    **李老师**：两个情况，注意。人家不停挑衅你要观察，如果你的阶级是 C11、C12 那种，如果他对每个销售员鸡蛋挑骨头，他就是为人问题；但他如果只针对你，你就要对他发一次很大的火，但我叫你不是去打人啊。那个人是老板不？


    **学员**：不是，他就主管。他喜欢在人多的时候欺负我。


    **李老师**：我以前被人欺负过，我在我新小说有写《聚光灯下的小丑》。你得记得，办公窒也好，同事之间也好，你未必是最弱的，但你在被人开始欺负的时候没反抗，比你弱的人都会联手欺负你，全部人要把你变成聚光下的小丑。我被人关过厕所的，反锁在里面。


    **学员**：如果他对每个人都这样呢？


    **李老师**：做到生意咯。销售员可以嚣张的资本就是你业绩够高。我在 YSP 做到生意的时候，我是唯一一个可以坐飞机回来的员工。


    **学员**：那遇见阶级观念特别重的人怎么做？


    **李老师**：阶级观念是人的天性来的，改变不到的。


    （下课）


    ## 第二天


    **学员**：老师，我想问你“英雄之路”的故事有什么重点元素？


    **李**：你讲的英雄之路是？


    **学**：即是塑造一个人物出来的故事手法。


    **李**：我听你刚才所说，我不知道是不是，一个鬼子（吉·加德纳？）他是写分析古代和现代的神话，他曾经讲过你刚才所说的“英雄之路”，讲郭靖啦，他的转接啊。


    **学**：是的。


    **李**：我不知道《千年英雄》有没有重新改过封面，你可以到 Siren Jin（斯人俊？）看一下这本书的。我肯定有《千年英雄》这本书的，你问他有没改过名。保险点的做法是你向他要作者的名字，他们就一定会找到的。


    **李**：《冷血救世》里面的一篇文章，其中的一段记载：施小姐的弟弟在池塘街做水果批发生意，刚开始生意周转不灵，跟施小姐借了一笔钱，后来生意越做越大，越来越有钱，而此时施小姐生活拮据，见到弟弟有钱却没有要还钱的念头。她就来问我有什么方法可以让她弟弟还钱给她。我就问了她说一个问题：“你弟弟在池塘街有点面子吧？”人有面子就要维护自己的面子的，这就是他的弱点。“我有一招，但你用了之后你们的姐弟感情可能就完了，你要不要试？肯不肯付出这个代价？”她说：“这样的弟弟不要也没关系。”她就叫我给她计（方法）。我给她的计是这样的：说老公不行了，让她去问亲戚/他的朋友借钱而不惊动她弟弟。怎样借钱呢？举个例：你是我舅父。我对你说：


    “舅父啊，我老公不行了，你借我 20 万。你别紧张，这 20 万我一定能还给你的。你看我弟弟是不是很有钱？我借给我弟弟这一笔钱，他还没有还给我。不如这样吧，你帮个忙，你现在先借我
    20 万，我周转得过来就还给你。就算我弟弟没钱给我，我也一定还给你的。我弟弟早还我，我周转得过来也就早些还给你。”


    **李**：你现在站在舅父的立场，听到我这样讲，你会有什么想法？


    **学员**：“我听到觉得很奇怪。”


    **李**：是很奇怪。你看过《冷血救世》就明白了。


    你是表哥，接着我就问你；你是朋友，我就问你……如此转折直到让弟弟知道。


    **李**：如果你不想借我 20 万，你会怎样做？是不是先去和我弟弟饮杯茶，讲这事给他听？


    **学员**：是的。


    **李**：“听说你姐过得很不好啊。她向我借 20 万喔。”然后半真半假地说她告诉我，“你姐说你欠她钱还未还给她啊。”


    当时，真的有一个人的跟她弟弟说起此事，她弟弟听后很生气，没理由不生气的嘛，她这是在间接破坏他的名誉。她弟弟和她吵了一架，就把钱还给了她。


    **学员**：我的合作人，他落了公司价（下订单）。我们向他追钱时，他说他在做一份新的工作。老板出粮（发工资）就还给我们，但是老板经常拖粮（拖欠工资）。


    **李**：你们香港是可以报警的吧？


    **学员**：是的。


    **李**：香港六甲海报警可以吓他很长一段时间了。


    **学员**：但他是烂仔（流氓，混混），他不怕你报警。


    **李**：烂仔，说真的，他烂极都有限，除非他是大佬（老大）一个。他不为这么少钱落价的。


    马来西亚警察贪污和很多年前的香港警察贪污是一样的。我有一个朋友，他找一帮青年仔（年轻人）去打一个人。


    **江**：印度人。


    **李**：印度人好找，印度比较穷，黑社会较多，花 2000 元左右就可买下一个人的手。他带人去打情敌，打得人家连门牙都掉了。打人的人有一个观念：警察是很容易买通的，我打完人就给钱警察，买通警察就没事了。马来西亚警察是可以双吃的。他不知道他打的人是一个大学生，这大学生给一笔钱给警察，叫警察抓他。警察认识我朋友。


