    ## 关系中的付出与回报


    **学员**：……


    **李民杰**：其实这些不是杯谋毒。有个学生写信给我，跟我说一个事情。李老师啊，我老婆一个月要我跟他逊一次家乐福，去买家庭日用品，我怎样可以不去买家庭日用品呢？我不会回答这个问题，因为我觉得一个月才一次而已，不是很过分的。我要先衡量一下你是不是有很严重的损失先。


    **学员**：女朋友要你每天开车载她出入出入，怎么做？


    **江健勇**：你不是叫她为你牺牲会一些东西罗，哈。除非你一早设下的关系是只有你为我付出我不会为你付出，但是正常的男女关系是双方都会互相付出。


    **李民杰**：……


    **江健勇**：你可以跟女朋友说，这几天你辛苦下，哈


    **学员**：……


