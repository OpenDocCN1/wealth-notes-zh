    上次，你跟我讲的那句话，我试过之后，发现……\n有样东西，我讲了后，你可能会不相信我……\n有些话我很想跟你讲，但是我怕讲了之后也没有用……\nX先生，我想问你一个从来复有人问过你的问题……\n\
    X先生，我想告诉你一个很重要的信息/秘密……希望你听了之后不要感到奇怪/愤怒……\n我知道你很忙，也未必想见我。所以我只会计三个理由给你听，为什么你要来见我。讲了过后你如果是没兴趣见我的话，以后我也不会再打电话给你。\n\
    \n为离苦得乐而好奇→设计出只要讲1到3句的话就能够激起对方的求知欲。对方将会很好奇地想知道你是如何可以帮他脱离痛苦，或者得到快乐。所激发的痛苦情绪如：恐惧、愤怒，悲伤、罪恶感等。所激发的快乐情绪如：贪欲、优越感、虚荣心、梦想等。目的是让对方希望你很可能就是他的拯救者。为达此目的，须用到UESP\
    \ (Unique Emotional Selling Proposition)特点式情绪销售。\n\n| 快乐的情绪 | 痛苦的情绪 |\n| :---\
    \ | :--- |\n| 贪欲 | 恐惧 |\n| 优越感 | 愤怒 |\n| 虚荣心 | 悲伤 |\n| 梦想 | 罪恶感 |\n\n### UESP\
    \ 特点式情绪销售\n\n(1)以对方的立场回答这合题：“在有很多选的择情况下，在可以什么都不做的情况下，为什么我一定要跟你买？”这个问题的目的是要检察你的卖点够不够特别。假如不够特别，对方就不可能注意到你。\n\
    \n(2) 我的卖点是否非常明确又特别？假如卖点不明确，将不能针对性的激起对方的反应。\n\n(3) 我的买点要如何才可以在一两句话就可以激发到对方情绪上的反应？\n\
    \n#### UESP 例子：\n\n假如有一个方法可以让你老公好像初恋般爱你疼你。你想不想知道？\n\n假如有一个方法可以让你老公不再到处逢场作戏，你想不想知道？\n\
    \n我可以令到你的老公天天有外遇，但是你却会很开心……。\n\n如果告诉你一件事情后，你很可能会失业，同时又很开心，你想不想知道？\n\n我是帮你制造幸福家庭的。\n\
    \n我是帮公司派钱给那些有眼光和胆识的人。\n\n我是合法收保护费的。\n\n如果你不想衰给人看，你来找我。（广东话）\n\n我是上帝…我说 NO 时，产品就不能出来了\n\
    \n我是会走路的银行。\n\n你买彩票一六一小赔五千。你跟我买的话，一大一小赔一百千。买了 20 年还不中的话，我还回所有的钱给你。\n\n我是一个可以令到你生意上的竞争对手非常开心的人。\n\
    \n我有样东西，放了进去后两个小时，就永远拔不出来了。\n\n我可以帮你领养一个将来肯定会超过 100% 孝顺你的孩子。\n\n我教你怎样弄到女朋友叫得很大声然后她会谢谢你\n\
    \n我是帮人准备打一场 20 年的战。\n\n我可以让你耳朵有高潮。\n\n我可以使别人看到你就想人非非。\n\n我们是卖一些使到你的员工孝顺的产品。\n\n\
    你请一个保姆要每个月$500。我可以帮你每个月$45找到一个。\n\n我是教会你怎样偷走政府的钱。\n\n我的产品吃了会上瘾，但政府却给我卖。\n\n我会令到国家的失业率不断提高……\n\
    \n我是可以用空气来帮人做催眠的，见到我的人就像去了 sauna 一样。\n\n我可以令到你在 5 秒内变成一个明星。\n\n我可以令到整天脸黑黑的人，别人见了他也会很开心。\n\
    \n我会命到你的对手在一夜之间，身败名裂，夺去他所有的财产。\n\n张力→使人有关心或担心的感觉，讲这些话时必须皱眉，或保持极度严正的表情才能产生张力。\n\
    \n例子：\n\n你知不知道你这样做……是很危险的？\n你知不知道你这样做……是很有问题的？\n我有一个问题想问一问你，希望你不要介意……\n我有一样东西想告诉你，希望你不要介意……\n\
    我听了你这番话后，我注意到一件事情……\n我本来都不相信你这种人……接着拍马屁）\n吓！你的脸……\n有些话我讲了后，你别生气…\n老陈，我们还是朋友吗？……你可以帮忙我吗？\n\
    我可以问你一个问题吗？但是你千万别误会……\n我 有 一 个 好 消 息 和 一 个 坏 消 息 要 告 诉 你 ， 不 知 道 你 是 不 是 可 以 听\
    \ 下 去……\n（轻微摇头叹息，作操呼吸状）我有一件事，（吞吞吐吐）……不知道应不应该告诉你，我怕你听了之后会很生气……（我怕你听了之后。不肯帮助我）\n\
    \n### 破局转局的张力兵法：\n\n| 破局转局兵法： | 例子 |\n| :------- | :------- |\n| 张力兵法 1 | (a)x\
    \ 先生，我想告诉你一个很重要资讯 / 秘密…… |\n| | (b)x 先生，我希望你听了这个信息之后，你不要感到奇怪…… |\n| | (c)……如果你要跟我们的公司订货，你千万别妄想有更大的折扣……\
    \ |\n| 张力兵法 2 | (a)x 先生，我想问你一个从来没有 人问过你的问题…… |\n| | (b)x 先生，你认为，做生意应该攻比较好呢？还是守比较\
    \ 好呢？ |\n| | (c)……（不论对方怎样答），你有没有想过，其实这就是你要跟 我们公司配合真正的原因……你知道为什么吗？ |\n| | (d)……如果你要跟我们的公司订货，你千万别妄想有更大的\
    \ 折扣…… |\n| 好奇心的兵法 | 难道你不觉得奇怪吗？为什么我们的公司在市场上 40 多年，都没有给客户特别的折扣……（用千隆问屠术及宏观微观说话术解释。）\
    \ |\n| 破局转局 | X 先生，因为你没有 卖过我们的产品，我不知道我们的产品是否适合你，所以我想问你几个问题…… |\n\n### 张力销售法：\n\
    \n假设 A 客户想向你订购 T-Shirt，而你弄清楚他的需求是：\n\n- (a)价钱：RM18.00 一件。\n- (b)交货期：两个星期。\n- (c)品质：上好的\
    \ 100% Cotton。\n- (d)用处：公司为宣传而赠送的 T-Shirt\n\n你要制造张力的方法如下：\n\n- 1. A 先生，我想问你一个从来没有人问过你的问题，我希望你可以回答这个问题。\n\
    - 2. 刚才听你所说的 4 样需求，到底那一样才是你认为最重要的……只要你告诉我，我一定会想尽一切的办法来替你完成，拼了命也弄给你……（此举的目的是让对方有放心的感觉。如果对方答：两个星期。）\n\
    - 3. 如果你两个星期拿不到货，你会怎样……？（等对方说出他的痛苦，你就再放大他的痛苦，增加他的担心……）\n- 4. 你的意思是说，如果我可以在两个星期内交货，你在其他三样需求是可以有所调整……（制造张力，让对方为你牺牲。此处和洗脑的苦法则相同。）\n\
    \n当你用此张力销售法，是可以帮助你重设新的格局。\n\n意料之外的举动→讲一些对方意料不到你会讲的话。目的是让对方不知所措。须视情况而定。通常问此类问题时，虽然是中途杀出，但也要让对方觉得你是很有心要问那问题。\n\
    \n例子：\n\n> 你有没有买彩票？——（洗脑、UESP、夺心）\n> 你有没有把车停在那边？——（洗脑）\n> 你一没有用支票？——（UESP、夺心）\n\
    > 突然指着对方……\n> 你认识 A 医生吗？听说他中了头奖……你知道吗？……关你什么事？\n\n迷茫→讲一些理论上是对方应该明白的东西，但是你的你的口吻或表情却表示对方根本不明白。或讲一些理论上是对方应该不可能明白的东西，但是你的你的口吻或表情却表示对方是明白的。讲完的一刹那，对方就会变得很迷茫。\n\
    \n例子：\n\n你知不知道我们现在在什么地方？\n你知道你刚刚讲过什么话吗？\n你是怎样做的？\n对方以为他明白时，就告诉他 “不！其实你还不明白。”\n\
    对方以为他不明白时，就告诉他 “不！其实你已经明白了。”\n对方以为他讲对的时候，就告诉他 “错！……”\n我听了你说 ABC，其实都不是你真正的问题……\n\
    \n勾魂四大口诀：\n\n制造四种情绪：好奇心、张力、意外举动、迷茫\n\n引起对方情绪反应的种种讯号：\n\n- 1. 表情：呆滞、迷茫、惊讶。\n- 2.\
    \ 反应：追问、发出惊叹声、要求你重说、微笑、默不作声。\n- 3. 肢体：前倾、抬头凝望、微微侧头。\n\n销售或谈生意的勾魂：\n\n•以好奇心人手。先用\
    \ “为好奇而好奇”开头，再以 “UESP”来加深其能量最低点。然后就夺心洗脑。夺心洗脑的过程中再以更多的好奇心、张力、意料之外的举动和迷茫来制造更多的能量最低点。\n\
    \n•为好奇而好奇→UESP→夺心洗脑\n\n一般交友、男女或伴侣感情、教育、辅导等的勾魂\n\n·一开始就不断的以好奇心、张力、意料之外的举动和迷茫来制造许多的能量最低点。每一次有能量最低点时，马上趁机用夺心或洗脑。\n\
    \n| 和刚认识的女生谈了不久后，你一弄到她笑时，就问：其实我觉得你这个人蛮奇怪的…… | 目的： |\n| :--- | :--- |\n| 她：什么意思呢？\
    \ | | \n| 你：唔……我不是不想说，我只是不清楚你是不是真的很想了解自己到底是哪一种人？ | 目的： |\n| 她：我想了解自己啊！ | | \n\
    | 你：这样好吗？我是可以告诉你的，不过我今天没时间。因为只要我告诉你话，你是肯定有很多很多话会跟我说，同时也告诉我很多事情。不如这样吧，在XX区有家coffee\
    \ house是我常去的。我接下来的两天都没空，只有星期六三点后，和星期天十二点前才有时间，在哪一天你比较有空呢？ | 目的： |\n\n### 夺心兵法\n\
    \n夺心兵法的目的在于与受术者探讨其内心价值观时，将施术者的印象深深植入对方的内心。\n\n制权魔术分：1）权威心态 2）宏观微观说话术 3）千隆问屈\n\n\
    #### 权威心态\n\n- 先跟自己定位成什么专家。\n- 不管如何，我永远是对的，我永远知道我在讲什么，我更永远知道你在讲什么。\n- 如果对方觉得我讲错，我会继续让对方知道：我其实不是讲错，我只是...还没讲清楚而已。\n\
    - 当然，最重要的是我会继续收集成为这方面专家所须要的任何信息或情报。\n\n收集信息的方向与心态：\n\n| | |\n| :--- | :--- |\n\
    | 人无 | 我有 |\n| 人有 | 我优 |\n| 人优 | 我特别 |\n| 人特别 | 我创新 |\n| 人创新 | 我改变 |\n\n#### 宏观微观说话术\n\
    \n- 由宏观带到微观的教育对方，把产品或服务分类归纳。让对方觉得从你的身上学得分辨好坏的方法。过程中不可缺少运用特定术语、泄漏天机、独特见解和千隆间屋。\n\
    - 带人为什么自己的产品不同。优胜处和特点在那里。通程中不可缺少运用特定术语、泄漏天机、独特见解和千隆间屋。\n- 终点时，作出利害的分析。此处可加自毁。让对方错觉你是一个客观无偏私的人。\n\
    \n宏观微观说话术的架构\n\n1.先用阴阳二分法，作分门别类（如：课程主要分成“感受性”的激励课程和“理智型”的手段技巧课程。）\n2.再分辨“阴”与“阳”的特点功用。（如：“激励”的特点完全在于如何激发学员们的情绪反应，使他们可以从沮丧中重新振作，勇敢冲刺；“手段技巧”的特点完全在于如何很实际地解决问题，化解困境。）\n\
    3.根据特点、功用，作出优缺点，效果的分析。在销售时更应该约分其利害关系。（如：“激励”最大的好处可以让你从沮丧中重新振作，勇敢冲次，“但是太依赖则变成‘精神鸦片’，使你无法正视困境所隐藏的解决方法：‘手段技巧’最大的好处是可以很实际地学会解决问题，化解困境的方法，可是却无法让你从沮丧中重新振作，勇敢冲次。）——分析利害的例子——（除非你每一次遇到困境，就沮丧，然后就去上激励课程；其实每一个困境都隐藏着一个解决的方法，如果你不想沮丧，只有提升你的‘手段技巧’。）”\n\
    \n#### 千隆问屈\n\n- •先决条件：对方不能对你有抗拒。请参考 NLP 的模仿技巧和同生共死技巧。\n- •以“可能性”的话来旁敲侧击，观察对方的反应。\n\
    - •一旦击中，不管对方有好或坏的反应，马上以“肯定性”的话来卖弄你的权威。\n- •不断的重复“可能性”和“肯定性”的两种说话术。只用“可能性”的话语会给人没主见的感觉，只用“肯定性”的话语会给人太过主观的感觉。\n\
    - •当对方开始相信你是专家时，逐渐增加‘肯定性’的话语。\n- •用千字诀时，须以“可能性”的字眼来进行。\n- •用问字诀时，大多数的的时候，须以“可能性”的字眼来进行。看得很准时，才可以用“肯定性”的字眼。\n\
    - •屈和隆字诀就一定要以“肯定性”的字眼来做之。\n- •隆就是销售自己的意思，要旁敲侧击中时才作之。击中还要勉强作之，会给人自吹自擂的感觉。\n- •屈就是先假设了对方是有问题或还做得还不够好，然后给对方指点迷津。对方如果讲不好，你就要符合对方而给对方原因为什么会不好。对方如果说很好的话，你也要给对方原因为什么会很好。让对方认同你后，再透露给对方知道，其实他有一些很关键的东西能做到。如果做到的话，其实可变得更好。\n"
