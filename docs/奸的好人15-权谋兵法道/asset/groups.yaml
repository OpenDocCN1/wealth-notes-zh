    所以我教传销商，约人的时候，不要那么猥琐。如果要说，就大方一点，比如讲：“陈先生，我说一个好消息和一个坏消息给你听，坏消息就是我加入了传销公司，好消息是你放心，我不会推荐你加入我的传销公司。”那你如何接下去，如何让他加入呢？我暂时还没仔细想到，因为我没做传销嘛。起码你想这个开场白好过“我告诉你一个
    XX 商机”。既然你知道大家都避不开这个免疫系统的，你就要改变方法咯。将这个东西颠覆，将大家的规矩打破。


    江：有些做保险的学员和我说，和客户谈的时候，对方已经很认同他的产品了很有兴趣了，反应非常之好，但是最后还是没没有买，我问他你怎么知道对方的反应好？他说对方很认同嘛。我问他你怎么知道他认同，他说不出一个所以然。问了好久，他才说他用这种封闭型式的问题来问对方，比如：你是做老爸的，做老爸的一定是爱孩子了，是不是？爱小孩就要保护他了，是吧？保护他一定要保障的啦，是吗？
    所以，这种不叫问问题，这是对方逼不得已，很不爽的情况下回答，他等着去反驳你。之前我有个女朋友是做保险的，当她听到别人用这些招式的时候，她就说：你有什么东西卖就赶快卖给我，别当我是傻的。用这种封锁问题方法就一定要小心了。


    李：如果你遇到一个中产阶级，有子女的，你可以用一些颠覆性的开场白。“你觉得一个人在香港要养到五个人容易吗？”不容易是吧？“五个人养一个人容易吗？”容易很多是吧？


    但是我告诉你，那是错的。这个就是一个颠覆咯。怎么会错呢？你看一下，做爸爸妈妈的要养五个子女，不那么容易了，辛辛苦苦为子女付出，但是当子女长大有了自己的生活，他们挣了钱，让他们把钱拿出来养父女，并
    不容易。这不就是颠覆的一个对白咯。当然你不要和那些刚出社会的年轻人说，那些人不中招的嘛，那些人没有这种感受嘛。所以你要出一招那些人有过这种感受的。虽然你未必设计得好，起码你用这个手法，获得一个机会。
    不要一直用讲 YES 的方法。


    江：对于勾魂还有其他问题吗？没问题我们就看 17 页，关于夺心的问题。夺心最重要就是制造权威，夺心需要你们花很多时间去准备。勾魂你花一点时间去试验，但是时间不会太长，你很快就发现这句可以做，那句不能做，勾的时候能量最低点也是很短的，勾了之后你就要夺心，夺心是你需要花很多时间去收集资讯，铺排，产品知识等等。这部分是要花最长时间的。目的就是让你变成权威。


