    李老师：你就拿回格局了。


    江魔：所以你得知道，女生说这些，你可能价值会降低，但你一定要记得把女生价值也降低。大家平衡。


    学员：那是不是要把别人的价值一直降低呢？


    江魔：不是，你要看到，我们权谋课程和你讲很多例子是有目的的，通常不只是只和你说销售例子，也有男女关系，甚至有时候说朋友间交往，有时候不小心你朋友给你的格局。原因是要你头脑里那些字眼，今早我们说的，字眼是影响你思考的。你有了这些字眼，你以后就不仅仅在销售中学到东西，你可能去看电影、和朋友聊天，听到这类字眼你都可以学到很多东西。我就有试过，我妈妈在客厅看港片，我在工作，我就听港片的对白。听着就听到：女生给格局了，男人中了，一直中？但我还在继续工作着，跟着又听，诶？男生也不傻啊，中了女生格局还知道还一个给她。你到我这个境界，你就处处能学到东西了。


    甚至以前有个女学员上我们权谋课，她没学过格局的时候，她不小心用了一个很厉害的格局，很特别的这个招式。她说出来的时候我分析给她听，她都说：我这么厉害哦。她说以前有个男生追她，她也喜欢这个男生，有天男生在很远的地方给她电话，说那天想约她。女生说我不知道我车停哪里，不方便开车。男生说不如我们折中选一个地方在大家中间的地方见面吧。男生选这个地方是对的，说格局的时候，谁愿意顺着谁的意思，谁就大。举例，我们今天来这里开课程，是你们有主控权的（笑），这么远飞来和你们上课。


    李老师：你们一会要请我们吃饭，我们不能拒绝的哦，你在马来是没这个机会的哦（笑）。


    汪鹰：我意思就是，你见客人或者怎么都好，你可以刻意找个中立地点。不是说我全部顺着你或者你顺着我，但如果是别人找你做生意，你就可以刻意叫人家去你那里。谁肯付出多点，谁的主控权就低了。那男生也不是完全不懂，就说大家找个折中点咯。但那个女的说不行呢，我今天不舒服呢，男的就说那好吧我来找你吧。那天碰巧堵车，平时用一小时可以到的路程，男生花了两个半小时才到女生那边。到那边就和女生说今天堵车好厉害，女的就说是啊，我听我朋友也说了今天大堵车呢，所以你这样让我有点点好像做公主的感觉。注意这个东西：“我有点点好像做公主的感觉”。里面是有格局的，是非常巧妙的话术。现在给你对比，如果男的上来，女的对他说：“你对我这么好，我真是有做公主的感觉。”对比“我好像有做公主的感觉”，两个话术的效应如何？


    学员：一个有继续发展的余地，一个就没有？


    汪鹰：就是了，等于说你考试及格了。


    李老师：继续努力。


    汪鹰：但她第一个方法呢，说等于告诉你，你付出的方向是对的，不过还有不足，你可以继续努力；另一个就是说你已经付出够了，不用再付出了。


    ### 案例解析：总裁与经理

    李老师：在我们《财色战场》开头有个故事，故事说我在台湾药厂的时候，第一年我要求公司帮我们一个滞销的产品打广告。那个总裁就说，我们是有钱打广告，但如果卖不出怎么办？谁负责？第二年的时候有个行销经理说：我负责。跟着问了老总一句话，老总回答不上，他下台拥抱这个经理。其实老板用这招是化解自己的尴尬下台阶，他用拥抱的行为想说“我找到了我要找的人才”。这个招式比较没品，不够高明。他这样给经理的错觉是：你已经是我要的人才了。等于说“我终于找到我的公主了”。如果一个很有气势的老板，他有心理准备的话，他第一时间会让你觉得你虽然是个天才，但你还是要继续努力，他肢体语言不能下去拥抱他的。如果汪鹰在他旁边，他就侧头和汪鹰说：你这种人就是我们公司要找的人，这样的效果会比下去拥抱他的效果更好。


    江魔：当时经理反问老总的话是类似审问的：你想做多少业绩？所以老总不敢回答，因为老总说做不到业绩谁负责，是不是你负责？是不是可以扣你薪水，经理说是，然后反问老总：你想做多少业绩？老总不敢回答了。


    李老师：一家大公司，老总是不能随便说业绩的。说太多业绩，这么多销售员会觉得老总你在刁难经理；说少了，你又怕自己说漏了，你等于告诉销售员自己的底牌。所以这个审问，老总是很难下台的。


    学员：但老总这个行为不做也可以啊。


    李老师：这场戏是一定要做的，但我们不要做得那么没品。


    学员：那你台上和旁边的人说这是我要找的人，貌似也很刻意？下台不是更有诚意？


    李老师：大家注意，如果你们是一群销售员，老板开会，肯定是会对着台下所有人说：你们看，这样的人才就是我们要找的人了。


    学员：那这种话我们学过的，听不就是废话来的么？


    李老师：当然是废话。


    学员：没品归没品，但抱抱是不是更让人觉得你有诚意？


    江魔：抱也不是真的行为了。


    学员：反正我们不吃这套，哈哈。


    江魔：最主要呢，李老师在《有钱人的偏方》里写的一个佛教作家，南怀瑾。当时有个女居士叫叶曼，叶曼就去找南怀瑾探讨人生要追求什么，探讨到南怀瑾已经没办法和叶曼回答了。南怀瑾就和旁边的人说：这个女的可学禅宗。他不是对着女的说，他斜斜和旁边的人说这句话：这个女的可学禅宗。他其实是赞她，但他没有正面赞，而是玩侧面。正面等于我把我的认同全部给你，你会觉得我很犀利；但如果我和旁边的人说，等于我把我的认同没有全部给你，只给你一部分。他就用这个办法下台。他这样做好过直接赞这个女的。如果他直接了，女的赞同，女的以后可能就可以说自己得到过南怀瑾的赞成，成大师之类云云。所以南怀瑾没有这样做，只是侧面赞。


    学员：万一他身边没人咋办？


    江魔：没人就要用之前案例那个女的的說法。


    学员：她说有少许慧根（笑）。


    江魔：你不是完全给认同对方，而是给一部分。


    ### 领导格局与激励

    李老师：你这个事情你要注意，如果你公司是在朝廷要用兵的时候，你下去拥抱这个人的效果还是很好的。


    学员：但是我还是觉得你下去拥抱比较好，好过你在台上说废话。只在台上说废话的话，大家听都没感觉的啊。你下去拥抱给大家看到，会不会有鼓舞士气的效果呢？


    李老师：其实他做什么，我们在台下看都是无动于衷的。


    学员：反正你如果只是光在台上，效果肯定没下去好。就算是认输一下也没什么吧？


    学员 2：我觉得老板应该保持点自己的格局，不能随便给人知道自己的底线。就算下台也要保持自己的神秘感和威严。


    江魔：问题是老板不回答这个问题，老板都怕，因为老板自己真不知道答案。


    学员：那老板可以回答那我多给你薪水？


    江魔：他的举动是因为他听到经理那句话楞了一下，能量最低点后的反应。这个老板反应都算快了。有些老板如果没经验的，人家一问你，老板一愣，若有所思还问一句：我想做多少？你就玩脱了，很麻烦的你这样回答。但他反应都算快了，因为这个老板平时嚣张惯了。


    李老师：有次开会，他也让我进了一个两难的局面，他在台上说。我在台下和我朋友聊天没鸟他，他说着说着就问我：李民杰，我问你，我刚说的开会四大议程第三个纲要是什么？我刚才一直跟我朋友聊天去哪里玩，我哪知道什么三大纲要？我回答不上，他叫我站起来。我和我旁边的主任打了个眼色叫他提醒我，老板看到了就直接说，谁都不准提醒李民杰，我就要李民杰自己说。我回答不出，他马上发飙，说你两条路选：1、我现在马上炒你鱿鱼，给够你工资你给我滚；2、你给我站上桌子上去。他就开始倒计时了。我当时想过第一念头是要不就不干了。但我外面有点小生意，也算是犯法的，我倒卖药品。我把医生的西药拿到中药店卖，中药店搭配卖可以加强药效，中药店和我拿货是双倍价格拿的。我倒卖一批是可以赚很多的，我要是不在公司做了就拿不到西药了。我想到这个利益，就站到桌子上了。这个老板真的是疯的。


    学员：我们公司老板也有这样行为，他看到你开会不专心直接会开除你的。


    江魔：这个是违反劳动法的，这个不行的。所以这个所有的技巧格局，


    ### 借钱中的内外需求

    李老师：我们再说一个例子，如果今天我是你多年不见的朋友，我们见面了，我说我们多年不见，但我现在生活很穷困，你能不能借钱给我？这是第一个例子，你要感受里面的感觉。第二个，我们十几年朋友，十几年，我现在周转不开，你能不能借钱给我？哪个例子有压力？第二个。为什么呢？


    学员：因为你用十几年做筹码。


    李老师：没错，我们认识这么久，我们这么好，我现在有难，你没理由不帮我的？


    学员：对啊，没理由不帮了。


    李老师：其实你们中招了，你们被一样东西骗了。人有两个需求，一个是内在需求，一个是外在形象。我们这么多年受社会教育，朋友有难，两肋插刀。中国传统里面很讲义气。拜关二哥都是说“没理由不帮我我两肋插刀”。但是你要知道，有时候你很有钱的时候，别人问你借钱你觉得无所谓。但是你要是没钱或者生活不宽裕的时候，有人和你说借钱，你内在需求是和你说
    NO。但是他和你说这么多年朋友，我从来没求你，现在来求你，很有道理你要帮吧？这么多年的朋友，你的外在形象就要维护你了。你会如何？大部分人会违背你的内在需求。我不是教你朋友有难你不帮，我是要教你们尽量不要违背自己的内在需求。有些人问你借钱，你很有钱的情况下
    OK，你可以帮他们，这个是合理的。但是如果你没钱的情况下，只是要面子，违背自己内在需求去保护自己的外在形象，是很傻的。对一个权谋行者来说，是很傻。但一个权谋行者看到这点，大部分人会被自己的外在形象锁住的时候你应该如何？利用！权谋就是这么毒辣了。利用别人的外在形象，这个就是我们接下来说的，赐封形象，把他的形象锁死！


    ### 赐封形象的概念与应用

    江魔：赐封我们一直都有说，刚才的例子也有，赐封分正负两面，在讲义里没的。


    李老师：我来简单介绍下，你记得这个是心态，第五页，千万别有这个心态啊，你出来做销售员的别说小框框里的话啊。如果你是采购员，你看到大樾樾么，你听到销售员和你说这些，你就利用里面的话和他玩格局。锁住他！这个就是你们回去要做的温习，我们现在继续说赐封形象。


    江魔：就像刚才那个女模特说之前她男人每个月有 3500 马币零花。这个属于什么赐封呢？正面的，她赐封出来的人是有正面优点的，正面好处的。如果这个女人这样说：我和我之前的男人分手是因为他有了我还经常看其他美女。这个就是反面赐封，我把这个人的缺点说出来了。正反赐封那个容易让人中招？


    李老师：如果我给你一个反面赐封，你就会想跳出来辩护，平息。所以这个比较容易让人中招。


    江魔：大部分人不想做坏人，他未必想做好人，但他一定不想做坏人。当你用反面赐封，别人会比较容易中招。


    李老师：我们说借钱的例子，你不帮朋友，你们认识几十年，人家都没求过你，你不帮人？你是好人还是坏人？但是如果你假设你没钱，当然了，你要是很有钱，你不帮人的确是有点那什么了是吧？如果你真没钱，你还要借钱就是被外在形象骗了，你不想做坏人而已。


    江魔：像之前传销经理说的：有些讲师是坑钱，有些讲师是真心想教人。一次扔了正反两面赐封，你只能选正面，这个叫一开二的赐封。之前有人在脸书上有写了一段港片的剧情，就说女主角不知道要怎么开拓自己的珠宝实业，女主的奶奶就说，不是每个人都喜欢珠宝的，你别认为大家都要喜欢你珠宝。女主就说人有两种，一种要进步的，一种是不敢进步的。这个就是一开二赐封。但你要留意，一开二的时候，这个港片里一开二可以成功的原因是因为女主家里有个那个关系，有做生意的门路。有人看来就留言说女主这个是用阴阳二分，我就指出说：这个不是阴阳二分，是赐封。


    李老师：所以光看书的人要注意，不是所有一开二是阴阳二分，她是在锁内在需求和外在形象，她主要是锁定外在形象。


    江魔：她潜台词是什么？如果我们做了，我们就是上进的人；如果我们不做，我们就是不进步的人。你这样赐封了，对方肯定要选正面赐封了。但你要留意，因为女主这样说成功是因为女主是有权力的。当时也有学员对我用赐封，其实大家别玩这个，对我用这个是没用的。大家都这么熟了，有个学员对我勾魂，我无动于衷，他就留言和我说我勾魂失败了。


    ### 师生互动中的赐封攻防

    李老师：其实你还是直接点写信和我们说就好啦，别搞那么复杂。


    江魔：我就问他怎么失败了，他说我对你勾魂没用呢。我说你试招别用我们啊，我们不正常的啊，我们对招式很敏感的，你要找普通人来实验才能看到我们的招式有没有效果呢。这比较公平。有个学员和我说点宗教的东西，然后他就说如果江老师继续和我说宗教我还是很乐意的（笑），但他老人家高高在上不喜欢和我这种人說。他是尝试在做赐封，一正一反两个赐封，他好像在用，但他也只是好像在用而已。他说你高高在上是什么？完全就是在贬低。他用的都是负面赐封，你这样说我还怎么和你说？你封锁完我所有的格局了，我进哪个都是死的啊。


    学员：你们到底谈论什么？


    江魔：我们是在说宗教，后来他去部落格我又继续说，我在部落格说我去企业里做了个培训发生的小插曲然后我马上搞定。他就说，江魔的勾魂能力真是厉害，我自认没有江魔的功力。有个学员就笑他自比江魔。他又说孔明自比管仲，我就自比江魔咯。他说了很多，我最后就回答他哈哈哈资讯不对称，但我没有点名说是谁。就有人来问我是不是说谁，我说是啊，很明显。第一，你叫别人不要把我当偶像；第二，你又说比不上江魔，你又自比江魔，资讯太不对称了。他尝试用赐封玩我，但大家师徒一场，你别玩那么复杂啦，玩这个很浪费时间的。有问题你就直接问咯。


    李老师：有些人问问题不要玩那么多赐封，说什么李老师你是市场开发王之类，看到我都怕了。最后他就问我，怎么做市场开发？不用这样，你直接问我不就好了？你赞我那些我没什么反映的。


    江魔：所以说赐封有一开二，之后我们还研究出一开三。一开三有时候的效果会更好，我们现在给你一个测试题目。


    ### 面试场景中的策略测试

    李老师：你们马上回答的就好了。


    江魔：假设你来面试，我和李老师是面试官，你要写一个申请表格，在薪水一栏写上你希望的数字。我没开始面试之前看看表格就说，你薪水有点高哦，我们没这么高工资的待遇，你能不能减少？不能的话我们就别谈了。


    李老师：来吧，回答我们。


    江魔：你们现在要回应了。


    李老师：这个肯定是谋略来的，没面试就要你减少工资，哪有这样的公司？正常面试不会这样，这个肯定是谋略。


    学员：你这样是不是不想请我？


    江魔：不是，我是说你开的工资有点高。


    李老师：你肯减少我们就考虑要你，你不肯，我们就得没说。


    学员：那你请这个职位的人有什么要求？


    李老师：先把你薪水降低，降低了我们再说。


    学员：那我可以降低点咯。


    李老师：哇，你这么快就减价？


    学员：那我问你是减一百还是减两百？


    李老师：你也是在减价嘛，虽然是有用一个二选一。但是证明一样东西。假设你来应征的是销售主管，不说是行政的，行政层不会这样和你谈条件的。假设是销售主管，你现在写减价数字，老板给你这个题目是要看你：客人要求你减价的时候，你会给什么样的策略回应。


    学员：如果我谈下去让你公司就会发现我效率高，一个顶俩，你会不会给我更高薪水？


    李老师：刚才我们给你的方向是一开三是最好的。


    学员：那你这么高水平的公司，


    李老师：你说这个就开始有这个方向了，说这么高水平的公司，这个对了。


    学员：你们这么高水平的公司，肯定是会请高水准销售主管吧？那工资肯定不会少咯？


    李老师：那你这样说只给我一条路，你一个这么厉害的公司肯定工资高，你这是和我斗牛咯？不行。


    学员：那我说：通常无故降低人工资的是无良公司哦（笑）。


    李老师：嗯？你说完。


    学员：这样做的公司，要就是无良公司，要就是内部竞争力很大的公司，但现在这样的公司普遍没那么多，跟着第三我想不到了。


    学员：我会考虑你们开的条件才和你说，因为我自己有例子被人压价，那个人很厉害，鸡蛋挑骨头那种人。我明知道那天签不到那个合同的了，我和她耗了整整三小时水都不喝，我和她说今天就算我们签订不到，明天我一样也不会退让我条件的。第二天我们电邮联络也是没有退让任何条件，我和他签订了这个合约。就是打时间战，如果她继续说的话，说什么不重要了，反正都说了这么久了。


    江魔：就像今早说的在街市买菜那个，说了 45 分钟已经很 有购买意愿了，只是在谈论成交细节而已。


    李老师：这个谈判的拖字诀，谈判有些情形下，战略战术就是要拖的。


    学员：我说给她考虑，我说我考虑的方向就是引诱她多说点，但我又什么都没说。到时候她说要减价，我也有机会说我没同意减价。


    江魔：其实一开二一开三是赐封来的，记得。


    李老师：刚才他说无良公司，给了一个负面赐封给那个公司。


    学员：那我和他说，我真替你不值得，为了点钱，放弃了个这么好的人。


    学员：我可以不可以说：我们谈了再说，然后我们再想对策怎么做。


    江魔：这个可以说，但我建议你从一开二一开三下手。


    李老师：你把他们的答案结合起来，一个大公司出手不应该这么低，一家无良公司才出手这么低。其实有了两个形象挂出来了，你从这个方向发展。


    学员：一个聪明的公司不应该这样。


    李老师：跟着？


    学员：一个聪明的公司应该会对有能力的员工高薪。


    江魔：如果你直接说聪明的公司不该如此，你也是搞对立，因为我现在用屈就，你再这样一说，我肯定反弹你。


