    97 年，他工作压力大，那农夫说做传销好，这是属于你自己的事业，打工不是你的事业，打工是帮老板打工，做传销呢，是你自己做老板。农夫就是用这么简单的话来骗他，让他这一家大型连锁戏院的总经理做了自己的脚！你们要清楚，做传销、做保险，你觉得自己是老板吗？老板的定义对我来说很简单：整间公司我有决策权，整间的公司运作我清楚，入什么产品我有权。我想问你一个问题：传销商有这个权力吗？没的吧！公司和你说入美国的
    ABC 货，和你说得多神奇多厉害，你就代表公司去卖 ABC 产品。是的，我就形容你为高级销售员,真的是高级销售员。传销商，次高级销售员都有同一概念，在有工作压力和挫折时，嗖的一声，人家和你讲多么简单的一句话，跟老板打工，他会将这一样东西当诚信。在马来西亚，有很多做传统生意的人，整天想加入传销公司好，他的背后隐藏着一个资讯，那些做生意的却想加入传销公司的人，其实他们的生意都是有少问问题的，因经营得很辛苦才有这种想法。「唉呀，做生意做得不怎样，我都不知道怎么好，做大没本事(本领)，要死又死不了，要生显得好辛苦。」他们通常都是这样，没什么方向，很容易被人骗入去。假如在坐的有传销商啦，你们有没看到一个缺口？这个缺口是什么呢？


