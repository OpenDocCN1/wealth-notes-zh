    # 阴阳二分法


    江: OK？我们看那个 18 页，这个宏观微观的话术呢，其实就是阴阳二分法。这里呢，我们最主要就是把三个技巧综合，第一个是阴阳二分，第二个是千隆问届，第三是天堂地狱，这三个重叠来应用，阴阳二分，其实有没有人没看过印象洗脑术的，就是人人都看过咯，书上写的是他能把复杂的东西简化成两个，两个之后再在那里做那个开出，开出那个资讯的优点缺点，这个阴阳二分，一你就跟我们书上所说的娱乐和兴趣，这是一个方法，另一个方法就是人与人之间聊天的话题，将他分成简单的一个说法就是生活话题，地球话题，宇宙话题，生活话题就是，手提电话，电脑，开什么车之类，地球话题就是说一些国家与国家之间的事，例如社会，政治，宇宙话题就是哲学，生命，宗教，类似这些东西，这是比较高层次一点点的，聊天的时候就看对方的兴趣，根据这个马斯诺需求层次，如果一个人属于低层次的，你跟他说高层次的一点用处都没，一个人注重他目前有什么享受，你跟他说，宇宙总有一天会毁灭的，最重要的是明白生命的真相，这样的话没办法聊下去的，同样所有话题你都可以做一些阴阳二分法，我们做一个很简单的游戏，就是我要你们随便选一个，生活？地球？还是宇宙，随便选一个话题，里面又选一样东西，地球你可以选香港经济，或者美国政治之类的，说地球话题有一个好处，就是当你面对那些老板级的人马，大部分当然是男人，他们希望跟他们交流的人是有头脑的，他喜欢这一类的人，你分析时势分析政治，会给人一种错觉，尤其是你可以做一个阴阳二分法，那这个人就会对你有一个印象了，宇宙话题，当然宗教的人就喜欢听你讲宇宙话题，也有一些大老板，自己在战场上打生死打了很多年，通常这种人会找一些宇宙的东西，精神上的修炼，心灵上的修炼，宗教这些东西，说到宇宙话题你又能做阴阳二分法的话，他们会对你另眼相看，生活话题也一样，我就要你们随便选一个，大概三五分钟时间，设置一个阴阳二分法出来，到时候我们就现场帮你修改，看'
