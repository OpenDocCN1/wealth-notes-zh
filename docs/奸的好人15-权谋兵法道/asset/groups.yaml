    江魔：就像今早说的在街市买菜那个，说了 45 分钟已经很 有购买意愿了，只是在谈论成交细节而已。


    李老师：这个谈判的拖字诀，谈判有些情形下，战略战术就是要拖的。


    学员：我说给她考虑，我说我考虑的方向就是引诱她多说点，但我又什么都没说。到时候她说要减价，我也有机会说我没同意减价。


    江魔：其实一开二一开三是赐封来的，记得。


    李老师：刚才他说无良公司，给了一个负面赐封给那个公司。


    学员：那我和他说，我真替你不值得，为了点钱，放弃了个这么好的人。


    学员：我可以不可以说：我们谈了再说，然后我们再想对策怎么做。


    江魔：这个可以说，但我建议你从一开二一开三下手。


    李老师：你把他们的答案结合起来，一个大公司出手不应该这么低，一家无良公司才出手这么低。其实有了两个形象挂出来了，你从这个方向发展。


    学员：一个聪明的公司不应该这样。


    李老师：跟着？


    学员：一个聪明的公司应该会对有能力的员工高薪。


    江魔：如果你直接说聪明的公司不该如此，你也是搞对立，因为我现在用屈就，你再这样一说，我肯定反弹你。


    学员：公司你舍得用多点资源请人才回来，公司才有好发展。如果公司一味节约资源请不到好人才就影响公司发展了。


    江魔：还有呢？还有一个。你开了两个了，开的两个都够了。


    李老师：她方向对了。


    学员：做比较啊？


    江魔：很简单的，有些公司要钱不要人，有些公司要人不要钱。要钱不要人的公司是不是人才都要？你不要说这个是好或者不好，你说了等于直接影射人家不好。你说公司要钱不要人，第三种公司是一人和钱都要。

