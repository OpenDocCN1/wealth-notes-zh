    2 块钱我。”“不行！”哈。当下他首先就是能量最低点。吓。因为没人这么快就拒绝他。接着他就开始生气，在我面前走过……后来他就在书局找其他人，他找的人都是那些看上去比较像好人的人，哈。所以我的意思是说只要你一知道对方出招，其实你已很难再中招了。你可以表演到顺着他，但是到最后你说不行，这样对方就进入能量最低点。


