    ## 对话记录


    李：自己的书都收集到。


    李：我自己的书，我是会破坏我这本书的，我会在书里写字画东西，为什么呢，因为第一次看的时候感觉是这样，第二次看的时候又不一样，不需要把书保存得漂亮，对我来说，我是很经济效益的，一本书才多少钱啊，就算
    35 块吧，吃一顿就没有了。我买一本书，有这种感觉，重复看，又有不同感觉。


    江：博学和尚的渊体现在，一个作家之前写的书，他有买，然后再版，他还买，不断追踪下去。其实很多和尚是为了赚钱，和尚是事业来的，就是出去给人打斋赚钱回来，而这个和尚就不同。


    李：我带我朋友去见他的时候，很多人问我，这个和尚如何生存？因为他不去化缘，不去做法会，不去募捐。但是他竟然能生存，还买了很多书。


    江：香港有个出版社专门出版术数修行的书，博学和尚有没有股份在里面我们不知道，但是他收藏有很多这类的书，有些书非常的破旧甚至是文革时候的他也有收藏，他是个书痴来的。我和李老师是很尊重他的。你们可以想象他看书的那个范围有多大。


    李：他讲得很多东西讲的很深入，我根本没法反驳，真是不可思议。


    江：他讲到道德，说道德可以杀人多人。


    李：中国人说“德”，他说德是比人还要高的，孔子提倡有爱心，但是到了德这个层面，是不需要爱心的。假设发生海啸，是可以不用救人的，可以不流泪的。他用十月围城这个电影来解释这个德，电影里那个生意人想帮革命党，但是又害怕害死出千的那帮人，他知道那帮人死定了。如果你有德的修行，那帮人死你应该是没感觉的。他就从这里分析，讲出人性法则和传统文化。我第一时间听，是不是真的啊？之后我花了几个月的时间，看到眼都晕去找相关资料。他的知识真的是很厉害。


    江：收集资讯的方向应该是冷门了，收集之后要回到“破立用”上面。


    李：破立用是因人而异的，我破的方向是看真实性和利益性，利益性除了破之外，还站在用和立之间。看这个东西对我有什么利益产生。什么是真实性呢？举个例子，《引爆趋势》这个作家提出一个六度分离理论，比如在马来西亚，我们要认识国家元首，我们的人际关系是不会超过六个层次的，我第一时间看到这个，我想：“哇，用来做直销好哦。”比如我要认识首相，我不直接认识，但是我认识我表哥，我表哥认识大臣，大臣又认识首相。你们算一下身边那些关系，要认识一个人不会超过六个层次的。有人做过一样研究，是通过寄信的方式实验，寄信给股票行交给主席，在各种地方寄信，综合起来发现，不会离开六个层次。《引爆趋势》这本书还加了很多新鲜的资料进去，它引入传染病的分析，畅销产品一夜之间爆红的分析，用这个大理论来推论出所有的产品怎样用来引爆资讯，你一看这本书，好过瘾，好像学到很多东西，但是实际上，你如何找出书里说的资讯人啊喇叭人啊。甚至乎你拿这本书去忽悠学者，是可以忽悠到的。后面我就找了很多资料，说的是一個女数学家无意中发现这个理论是假的。她做了一些实验，给出一些分析，举例，在一些地方，可能电话都没有资讯很封闭，那里的人有没有办法通过六度分离理论认识温家宝?那些人可能一辈子都出不了那个地方，她继续从一些数据分析，为什么耶鲁大学，麻省理工大学研究这个东西不会错呢？美国那些智囊团遇到问题的时侯，第一时间会请教耶鲁大学，哈佛大学那些教授，做他们的幕后智囊团的嘛，社会精英也是从这些学校出来的啦，在这种环境下，六度分离是不是很容易？我们继续讲那个女数学家，把这个理论破了之后，她出名吗？没出名是吧。你让我说这本书叫啥名字，我都想不起来。但是六度分离到目前为止依然畅销，我听到这些理论，第一时间想到对我有什么利益先，除了利益性之外，还有可能性，我可能就去思考了，在什么领域里面这个理论有用，而我比较少考虑的是，超越性，我是有个概念的，做生意，没有坏的东西我是不会去修理的。六度分离我头脑一闪而过，是可以做传销的。我就想出一个话术来勾魂了：“好多人说做传销可以发达，我告诉你，你是狗屎，做传销是没办法发达的。因为很多传销商他不知道一个号码，这个号码就是六，一个传销商不明白六这个字的话呢，他一辈子都没办法发达。”接着呢，你要选一个时机，用很简化的方法，来介绍六度分离理论。如果我有心想做传销，我的话术可以发展到我连首相都可以推荐来参加传销。所以，我会将一个学问，变成所谓的可能性。


    江：“立”的话，就有机会成为流行，如果只是“破”就未必能做到，你想让理论一直能够传播下去，就要“立”，而不是只能“破”。如果只是破，破的当下是很爽的，为什么爽呢，因为证明你比他厉害咯。但是爽是一回事，如果你没有立一个新的东西出来，就很难流传。我们提到的李天鸣，就是教人家怎么破，李天鸣的徒弟是高人一等的，他们认为整个社会的现象都被他们看穿了，如果纯粹是破的人呢，破了又如何？有没有钱呢？有没有如呢？能不能影响到别人听你讲呢？我们写书的方式，方向都是先破后立，先破了勾了你的魂，然后再立，就变得有个方向让你思考了。


    李：我们给你解释四性论是有一个目的，你要把握你看书消化的习惯，找你的脑瓜讨论的时候，这四性论给你一个参考方向。我看书时候，最快的触觉是真实性。我和龙震天讨论过一本书，叫做《精子战争》，他问我对这本书怎么看。如果我从真实性来看呢，我指出两个故事，是很有矛盾的。书里提到一个实验是很轰动的，在男性和女性那里都放一个显微镜，男性射精进女性子宫的时候，子宫颈如何吸精虫，旧的理论是说精虫一起杀进子宫卵巢里，专家用显微镜看到，其实教科书写的是错的。精虫应该是像军队一样分成三批，第一批是冲得，第二批是围起来，第三批是往外出。然后作者开始提问，为什么会这样？他就做推理。原始人的生活，令我们的基因如何如何，在原始人时代，女性是可以和不同的男性交配的，精子的战争是我杀你的精虫，你杀我的精虫，男人的龟头为什么会有突出来的，书里也写有。当插入抽出的时候，将别人的精虫弄出来。然后作者再用不同的故事情境来描述一个现象。龙震天说有两个前后矛盾的地方。有两夫妇，用了很多人方法生不出小孩。如果男的很久没做爱，就要先打飞机，然后过了两天之后，再做女方比较容易怀孕。书中有一个故事，说一对夫妻邀请丈夫的朋友来家里做客，然后丈夫出去办事，丈夫的朋友就和那个少妇在厨房偷情做爱，做完爱过后一段时间，那个妻子就发疯似的要和她老公做爱，之后妻子就生了小孩，后来发现那个小孩是丈夫朋友的。作者就从基因和潜意识来分析了，她的老公生活不错，有了钱，女性的潜意识认为，开始要稳定的生活。在她贫穷的时候，潜意识告诉她，要繁殖下一代。现在生活稳定了，潜意识又发出信号，要找理想的对象，所以女性喜欢看男性的屁股，总之用一大堆理论说明，那个女的借着老公给她的环境，令她理想情人的下一代可以延续下去。我用真实性来看这个问题，比如在中国有十几亿人口，越穷的人越生小孩，于是我对他的论点产生两个疑问，第一个是中国和印度的人口知识水平是相对比较低的，如果基因会做出选择这些东西去繁殖下一代，是不是很有问题？照这么说美国生活环境那么好，应该很多小孩出生才对，是不是越先进的地方，由于环境污染问题，让人不容易怀孕呢？这是我第一个想法。另一个故事是，一个上师看上了一个女士，两个人就眉来眼去产生感觉了，女士就叫上师拿出鸡鸡给她看，为什么要这样呢？书里又分析了一大堆，然后女的选择给男的打飞机，她要看男的射精出来的程度，终于到最后，这两个人就做爱了。我平时很习惯破的，我就同时将这两个东西合起来，之前又说那个在厨房做爱的会选择，怎么在厨房做爱前先打飞机再做？我在这里又产生另外一个疑问问我自己，好像有多少不丢哦。从人性的角度分析，假设那个故事是真的，为什么那个有妇之夫先帮那个人打飞机呢？从外国人的角度来说，她有第二罪的感觉，第二罪是什么意思呢？哎呀，我和我上师发生关系就叫通奸好，我有少许良心上过意不去，我打飞机应该不算通奸吧？为什么我不能从这个角度解释呢？为什么一定要看屁股，看基因，看身体健康这些角度解释呢？我看书习惯很快找出漏洞，你问我为什么那么快找出漏洞，我不知道，我一看，头脑就有这种反应。我不是专门去设局反它，我看书就是为了过瘾而已，我也不知道为什么一下就能看出漏洞。所以在四性论里面，我自己推敲我读书的性格，我一定从利益性出发，这是我最快吸收书中内容产生的思维模式。江先生就不是从这个角度去思考的。


    江：前段时间，博学和尚和我说一个道家的修行方法叫做龙虎丹。龙虎丹以前那些人误会以为是男的又搞女的又搞，其实不是。龙虎丹是找一百个童男童女，每天到适当的时候，老家伙身体要返老还童，就在一棵树里面，那棵树有两个洞，一个洞在下体，一个洞在鼻子，连接两条管子，让那些童男童女从管子里吹气进去，让老家伙返老还童。博学和尚说那是以前的有钱人才那么做的。我听完龙虎丹就出去吃东西了，大鱼大肉的时候，我在想，这些玩意谁想出来的，那么变态，我当时听的时候，我不是怀疑真假，我假设是真的话，我能不能灌装置童男童女那些气，到一定时候就拿那些气出来用。我就在想这些可能性。到我吃饭的时候，我才考虑这些方法是不是那些猥琐佬想出来的，会不会是以前那些道士用来骗那些有钱佬的？返老还童是不可能的，然后那些道士想了个那么复杂的方法出来，等搞到最后搞不成功，越复杂的东西就越容易出错咯。这些东西勉强来说算是破，但是我是没证据的，李老师要破的话，是找那个矛盾来破的。我不是为了破，我是好奇那么复杂的东西，到底哪个家伙想出来的？到底什么情况才会导致那些人想那么复杂的玩意出来？我是从这里做推论。


    李：表面上我是破了精子战争这本书的内容，其实我心里是非常佩服这个作者的。作者可以从这两个现象弄出一个理论出来，从写书的角度，这个人真了不起。


    江：我去听讲座有一个习惯，就是除非讲的东西非常夸张，夸张到脱离了物理世界，我才会想没搞错吧，行不行的啊？通常第一时间我不是思考这个玩意是否实在，我是想如果我要做得比他更加厉害，我应该怎么做？以前我上
    NLP 的时候，有个师傅说 NLP 应该如何如何搞，对方会有什么反应，我第一时间不是想这个东西是不是真的，我是想如果这样的话，我能不能隔山打牛来弄它啊，我就是用这种可能性来思考的，这是我学习的方向。


    李：给了你们两个参考的模式，你们应该找回自己四性论当中，哪一个排在第一位呢？为什么说我们对这个东西那么注重呢，其实我和江生开始迷上看书时候，我是从来没想过要出来做讲师，我迷上看书时候纯粹就是为了看书。如果一个人从利益性来看书的时候，未必能够学得深入。我有一个朋友，看书第一时间想，这本书能教我什么？我和江生销售书也看，黄色书也看，什么书都看，我不只是看商业管理书，我反而觉得我和江先生聊天的时候火花的，和那个朋友没有火花。


    学员：设计一个理论有些什么架构？


    江：这个方向好大，而且好远，我们还是吃了饭再说吧。


    李：现在目前你们公司的政策改变后，找回和用户大概方向来改，你公司有多少个用户？透过在 20 个用户，啊不是，你一共有多少个用户？


    学员：200 个。


    李：200 个，先假设，我从 200 个用户的名单里挑选出 10 个用户出来，再把这个代理权的规划中的。。。（由于学员的声音，这里省去几个字）所以你要找些借口来应付这几个人。


    学员 A：（悄悄的问）那个 XXX 老师叫什么名字？


    学员 B：不是很记得了。


    李：如果你有做那样东西，第一样，是在 200 个里面找 40 个。那你就觉得自己的客户那个咯，你有制造哪个叫做对比啊那个布局给你看，起码在那几十个里面有个对比嘛，你不是说，第一件事情我这样说，但每个客户都能做到……（学员又聊天了……）


    李：你们有没有上门跟人家讲解的？


    学员 C：上门讲解自己……


    李：不是，这个事业。你们香港的代理怎样的？


    学员 C：其实，代理很多人都觉得一部分人……


    李：少部分。


    学员 C：都很少一部分。不知道多少张单才有钱出的，三张单才有钱出的，有的出的时候一百几十块。


    （学员聊天中）


    江：你是那里认识博学和尚的。多伦多还是香港？香港，当时那个师傅，你不知道还是什么，哦，你不知道。OK，那有什么他的八卦事情讲给我们听听？


    学员们笑。


    江：他不会讲自己的八卦事情，他只会说别人的八卦事情。讲回给我们听，让我们回去试一试。


    李：我觉得。


    江：博学和尚说一些故事给我们听，之后再说，千万不要写在书上啊，我跟你说啊，你千万不要写在书上啊。他有说一些内幕的东西，例如说，就算和尚都不知道怎样跟人家交代的，就是有些那些不知道叫什么谱啦，记录那个佛教里面的某一派传承的那些人有没有破界的，就是有些记录在后面，例如谁有抽烟啊，谁去破界啊这些东西，全部记录在里面，所以变了是很敏感的资料，所以不会对外宣扬的。有时候那些佛教的宗派里面，那些掌门人是靠算圣杯来决定，算出来说，菩萨选的，那就没问题了。都是一样破界，破了界后的东西全部记录在里面，他就会把里面的东西有时候会讲给我们听。


    学员 B：那个时候是什么年代。


    江：九四~~~到他回马来西亚之前。


    学员 B：那个时候还有一本内理杂志。


    学员 D：那我不是觉得。。。死了，我都不记得我要问什么。


    江：他是零二回马来，我们第一次见他的时候是世界杯。他回到去当然会有那些权利斗争啦，那回去马来后有个大和尚跟他说，我看好你的，那你现在先做这个马来西亚佛教组的副会长，你先做着，到时候再把你抬上去。但这个大和尚看到另一个和尚回来后又说，我看好你的，你现在先做着副会长，迟点我把你抬上去。那样，他就在这个和尚面前说那个和尚的坏话，在那个和尚面前又说这个和尚的坏话。因为这个和尚不知道他们会用
    E-mail 的，他们发 E-mail 的时候发现，这个和尚跟那个和尚说，他跟我这样说的。那个和尚又跟这个和尚说，他又跟我这样说的。最后博学和尚 3 年之后离开，因为他知道那个老家伙在耍他，他离开过后，另一个和尚再离开。他说不要一次两个都离开，不然的话他知道我们两个串通，怕我们什么的。他们离开了三个月那个和尚已经挨不了了，他又要离开。离开之后呢，这个老家伙就在其他和尚面前又说他们有多好，又多有才华，又说一些好话。之后不知道第几年，有一个不知道什么选举，佛教组的选举，这个博学又放小消息出去说要选。那个老家伙又紧张了。


    江：这个博学和尚很聪明的，他教李老师一个让他儿子喜欢看书的方法，很有创意的。这个和对上人性的掌握，他知道怎样引诱这个小孩。大部分的父母叫孩子看书就说要以身作则，一直在那里看书看书法。那个和尚教的那个方法是不让他看的。


    李：用以身作则这个势来封闭他不让他看书，他教我把家里的书柜，弄成下面是盖住的，看不到的，以后送礼物的时候推开，让他知道是从这里拿给他的，上高这里呢，跟着他年龄大，这里能放（三个字不懂），逐步深入，刚刚拿到的，然后越来越高，以后我书房的门就要长期锁着，久而久之就开一点点给我的儿子看，例如十万个为什么，当有一些很过引的知识要说呢，我就走进这个房间，进去之前跟儿子说，你不要跟爸爸进去，你在外面等等，出来之后就跟他说。这个地方对我儿子来说就变成一个神秘的禁区了，再想象一下，长期训练后，他就会想，爸爸为什么进去后出来会变成另外一个人？以后他会对这个地方产生好奇，现在不是时候，之后我看书不是问题，他跟着我，有时候我经常去书店，他说要买
    5 本书，要劝你劝的很辛苦，才给他买 3 本。这个方法总比，读书啦，读书啦孩子。我认为那让更能够吸引他不断的追求学习。


    江：所以有时候他跟儿子讲故事的时候说到一半，儿子问他一些问题，他就又走进书房，出来又变另外一个人。


    江：我不知道中国古代是不是有这些招式，让那些小孩子犯贱去看书，那个时候我们送了一本书给他，书本上讲的那些犯贱的技巧他已经全部看完，但我听他一说我吓了一跳。如果中国古代有这个东⻄，为什么到现在还没有人能说出来，就是怎样引诱小孩子犯贱。如果古代没有的话，这家伙很厉害。一看完一些东西就有一个系统出来了。


    李：这是他其中一样东西啦，第二样东西，我用过一个招式去跟朋友的儿子相处，一放学请他去吃东西，我就跟他说，你不要跟叔叔去一个地方，因为如果去到那个地方，一定会吓到你的，因为去到那个地方，你会看到很多我的分身，吓到你就不好了。小孩子就问，什么地方来的。其实很简单，为什么这么多分身，因为有很多本书。之后不让他碰，再跟他说，我跟你讲一个故事，我不懂英文不懂马来文，为什么可以在马来西亚做生意。之后第二天去那个什么塔里，有个水族馆，这个馆里面有人用马来人说食人鱼，用多少分钟吃完，他用英文来说，听的时候我不明白，他就问我他讲什么。我就说，我不知道他讲什么。所以说，你不懂马来文不懂英文，是不是在马来西亚做废品呢。之后朋友跟我说，他儿子想买书来看，他问我要买什么书。他爸爸跟我聊电话的时候聊到哭，一直哭，他说他儿子读书很差的，从来不用工读书的，想不到跟你相处了一段时间。他以前教我销售技巧，想不到现在反过来我教他的儿子，他说只是因果报应啦，还好我做的是—件好事，他说他儿子很不喜欢读书的。之后他儿子每次来到这个地方就说要来找我，找我要找书给他看，但是我不会选太多字的，因为我知道他是小孩子，一开始的时候是一些知识性的漫画给他看，例如那些探险之类的书，给他看这些书。有时候我跟我儿子讲故事，他就坐在我旁边听着我讲故事给我儿子听，从这个反应，我对这个方法有信心。


