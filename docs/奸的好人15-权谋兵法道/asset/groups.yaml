    **江健勇**：这种洗脑的方法就是所谓的举手之劳。我们的书里都有说，面对一般的顾客，都要用到一些简单的洗脑技巧。洗脑其实很简单，就是让对方举手之劳做出一点东西，不是太辛苦的。OK？昨天我有说到我去见一个保险公司的经理，我们玩着格局，我一去到，握完手，准备要坐下，他一坐，我就说等等，先不要坐下来，他问什么事啊。这样他就是第一次服从。我说因为我走了很远才到这里，我有一些口渴，你介意不介意拿杯水给我？“哦，没问题。”第二次他服从。坐下来谈话，交换卡片，我说，不如这样子，你可不可以给多几张卡片我，如果这次我做不到呢，我就将这些卡片pass给其他的讲师，叫他们可以联络你。“没问题。”又给卡片我，所以第三次他服从。谈到时间表了，我就拿出我的时间表，就问他我说可不可以放在你这里，他说可以。第四次服从。接着我用手推开他的东西，入侵他的私人空间，然后翻开我的本子，开始讲我的东西。所以就是利用他服从，服从，不断服从。这就叫做举手之劳。


    **江健勇**：在你们的讲义里面，举手之劳就叫做要求式洗脑。问方向，问路，叫对方写一些东西给你，叫对方介绍些东西给你，以此类推，拿卡片啊，借电话啊，叫他说话大声点小声点啦，这些都是例子，任何细节的东西都行。今天早上李老师说他的妹妹跟他说，我有一个好消息和一个坏消息跟你说，吓，你出来啊出来啊，出来坐下来一听，这个是洗脑来的。就是你引导对方让对方服从。不只是做销售，连老千都会用这些招式。


