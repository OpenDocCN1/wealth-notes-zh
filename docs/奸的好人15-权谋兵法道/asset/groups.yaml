    ## 洗脑兵法


    洗脑兵法同样运用苦乐法则。


    ### 行为操控五步曲


    1. 决定一个惯用的暗号来影响对方的潜意识。例如： “小强，我想麻烦你一下。” 或拍一拍对方的肩膀说 “能不能够帮我一个忙？ ” 或看着对方说 “我有个要求。”
    这暗号要在每一次提出要求前做之。

    2. 提出一个对方不可能会拒绝的要求，同时也要给一个理由。（可参考以下 “要求式的洗脑”）

    3. 对方完成了你的要求后，要谢谢他、称赞他、奖赏他等。

    4. 久不久就重复 1)——3)。

    5. 久不久就加大你所提出的要求，得寸进尺，使对方开始习惯接受你的要求。


    ### 要求式的洗脑


    - 问路或问方向

    - 坐过来一点

    - 写东西或画图

    - 叫对方帮你看守东西

    - 问那里有好介绍的餐馆

    - 叫对方等你而你办其他事情

    - 写下名字、电话或地址

    - 讲大声或小声一点

    - 给多一张名片

    - 调冷气、灯光等

    - 拿东西给你

    - 借用对方的东西资源……笔、火

    - 讲一些稍为私人的信息

    - 要求延长时间

    - 放东西逐步霸占对方的空间

    - 移动位置


    苦乐法则交替运用：


    ### 乐法则的例子：


    > （对方是乐意协助你的举手之劳）


    1. 请问现在几点？

    2. 麻烦你可以告诉我从这里要到 xyz 那里，要多久？怎样去？（等对方说过后，重复肯定几个重点。）麻烦你可否画出来？

    3. 借笔：我的笔已经没有墨水，能否借我一支笔？

    4. 借打火机：能不能帮我一个忙？我的打火机没有了火石，可否借你的打火机一用？

    5. 我将数据放在桌上可以吗？我的公文包可以放在这里吗？

    6. 我可以看一看你的照片吗？/我可以看一看你公司的文宣(或年报会讯)吗？

    7. 麻烦你可以将冷空调调小一度吗？

    8. 可以帮我复印这份文件吗？/麻烦你将此文件传真到我公司可以吗？

    9. 我的手提电话电源不足，可否借你的电话？

    10. 如果我的经理打电话来，麻烦你告诉他……

    11. 你可以大声一点／讲慢一点／讲快一点吗？

    12. 我可以坐过来这里吗？


    ### 苦法则的例子：


    （凡是带有半强迫性，对方是半推半就下的服从皆是苦法则。）


    1. (假设对方是坐在自己的办公室内)xx 先生，麻烦你站起来……(此时你也应该站起来，作扶领的动作，待对方一起来)xx 先生，麻烦你过来这里，(当对方走到你想要的位置，即可展示你的产品或说出你原本设计好的话。如果你是卖鞋的，你应当立刻蹲下来，替对方换上你想要销售的鞋。)

    2. xx 先生，现在我介绍给你的货。不知道还有没有存货…等一下，我可以用你 office 的电话打给我的经理吗？(接通后，跟你的经理谈话内容尽是此客户订货的可能性，迫你的经理留货给他，然后替他好话说尽，突然要你的经理与他交谈，此时将电话不分由说交给了给你的客户。)

    3. xx 先生，你可以先拿住这个（将你要销售的产品或数据交给他），来，你看看这里……（此时对他重复指令，要他看这，又要他看那，要他试这，又要他试那）

    4. 阿明，你暂时今天停你手上的工作，来先处理这件事……（你的员工新加入不久，你要趁彼此还存陌生感下手，重复数次后，你下达命令，他会优先尊崇之。）

    5. 阿明，现在几点钟？……哎呀！阿明，麻烦你立刻将这批货送到 A 客户那里，再迟恐怕就来不及了！（制造紧急状态，不容他有所考虑。重复数次后，他已不懂如何拒绝你。）


    ### 重点：


    - 运用苦乐洗脑法则时，尽可能给对方一个理由。特别是运用苦法则时。但是忌给多过一个理由。

    - 先以乐法则洗脑，然后再以苦法则洗脑。

