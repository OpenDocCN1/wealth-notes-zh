    江：有一种病症是无端端会竭斯底里讲脏话的，我们有过一个学员，上课上到一半的时候，就会突然竭斯底里，就是一种精神病，有时候会突然骂：“日你老母”。那时候我们自已都被能量最低点，上课的时候，他就突然发作。我就让他如果新认识朋友的话，就直接盗雷，和别人说他有一种症状，这样交朋友的时候不会那么吓人。有次上课的时候，我让他这样先盗雷说自己有这样的症状，但是他没有说，还好上课的时候他没有发作，我们也害怕啊。所以这种也是一种意料之外。另外还有一个技巧叫做迷惘。比如你和对方说一些东西，对方不明白的时候，你就告诉他：“其实你已经明白了，只不过你不知道你自己明白而已。”又或者对方已经明白的时候，你和他设：“你以为你已经明白了，其实你是不明白的。”总之就是让对方摸不着头脑，迷惘。这样的好处是对方的头脑暂时地打开，没有方向感，这样你才有办法去继续引导他。有次李老师见到一个
    ISO 顾问，那个顾问不停地推销他自己，李老师就对他使用迷惘这招。


    李：这个人用一些包装手法显示自已，他不久不就从他包里拿出来一些东西，这个是我送给我太太的戒指。其实你都不知道我是否喜欢戒指钻石之类的东西，他就讲这些给我听，暗示他的事业成就很好，他是用钱来包装的。如果一个人要包装，包装是要制造话题的，其中一个方法是，如果你的小孩子有照片，你可以拿出来给人家分享，但是注意一个前提，如果对方没有小孩，那么对方是不会情绪反应的，如果对方刚好有小孩子，你拿照片出来跟对方分析，那么就很容易拉近双方的距离。当时那个人说他买钻石给太太之类的，我的感觉不是很大，我只知道他在做着包装而已，表示他很有钱。他在销售他的课程，即将要成交的时候呢，他是不去我的公司谈的，他找一个借口，说他有一些星巴克优惠券，他请我去星巴克，然后谈完最后的那些东西。我心想，好啊，反正有免费吃喝，不吃白不吃。于是就答应他，一起去星巴克。他帮我点完了东西，点完东西之后继续巴拉巴拉谈后续的业务了，他开始解释他的价格以及一些东西。然后我就突然问他：“你知不知道我们现在在哪里？”你们假设，我们现在在教室，我突然问你：“你知不知道我们现在在哪里？”我突然问你这句话，你心里会想：这样问不会那么简单的，究竟他想干嘛呢？
    然后那个顾问很迷茫回答我说：在星巴克。我说：是在星巴克没错 他说：哦。我说：“在普通茶餐厅，我们喝一杯咖啡是 1 元钱，而在星巴克我们喝一杯是 10 元，我们做工厂的就好像在茶餐厅卖
    1 元的咖啡，你们做顾问的就像在星巴克卖 10 元的咖啡。”然后我就一路吹捧他，说他做'
