    江：哦，怪不得。你看这光线够猛，和墙上的色彩对比不强烈，比较柔和，你在这里干活是很容易的。假如你和我说道：不行呀，浑身不舒服。我就说：哦，怪不得。你看这光线那么猛...。一开始OK，但做多了你就觉得很闷。千隆间屈是可以重叠的。


    李：“哦，怪不得。”是可以用来害你的对手的。我用一家是制造矿泉水瓶的工厂来做一个假设。我到你工厂估价，你说：我帮你制造这矿泉水瓶。我很认真的看，还做出一些表情：“介意不介意我向你提一个问题？方便就告诉我，不方便就算了。”你对制造这个矿泉水瓶的原料生产是不是很了解？通常制造矿泉水瓶的并不了解制造过程的，我假设你不是很了解。“唉，”我好像有难言之忍。我深吸一口气，很严肃的问：你是不是和矿泉水瓶的老板很熟？你看我之前的表情，你是不是多少觉得有些不受？你一答熟，我就用嘴角来笑：哦，怪不得。你想到了什么？你答不熟，我笑：哦，怪不得。你看到一个人这样说，你第一时间想到了什么？我一定是发现了一些秘密而没说出来，而且是负面的东西。


    如果我要害你，第二步就拿一个有暇疵的产品和一个没暇疵的产品放在你面前比较一下，接着说：怎么有人制造出一些有暇疵的产品，说出一些理由出来。人的头脑是很喜欢预测和乱猜的。当你将这两个情节联系起来，你会想到什么？注意，我没有讲他一句坏话吧？你一下这个毒，以后你的竞争对手就有麻烦了。第三阶段：教他怎么管这一家厂。当然，有人问我，抢了这一客户你值得吗？你会麻烦吗？再想下去，万一竞争对手又抢回这客户，他用我教他的东西来管我，你问我觉得值得吗？我就认为很值得，因为很竞争。我认为吃得咸鱼抵得渴（吃得咸鱼抵得渴：做了某事就要承担相应的后果），讲的人你一定会认为他是好人，举例：su
    wei feng（苏文风？在马来西亚演讲的时候，他一上台，就骂风水佬。唉，现代的风水叔叔啊。在古代的风水如何如何，现代的风水如何如何…所以现代的风水叔叔的最高境呢，走江湖啊，好似我一样。两样东西是他最高的心法：一是老作（自已编写），二是拈估（猜测）。


    我问身旁的人，苏文凤的演讲怎样？很好，很老实，不是跑江湖的。呐，利害吧？苏文风害现代的风水师多惨呀！


    李：我今天如果想害同为讲师的人，我就说：衡量一个讲师的资格有两个，第一个条件是他有没出过书，如果他没出过书你根本就看不到他的思想架构和组织能力；第二，他的书虽没广告一样可以让你产生去上课的冲动。没做到这两条的讲师就有没料（料：本领、本事）。经济学家说人人心中都有一把秤，我在你心中放了这把秤，你以后以为讲师会怎样？你有没有出过书？给我看看，没上课的冲动哦。就算我很有料都变没料了。


    李：打开十一页，张力，张力兵法是什么意思呢，先给你们一个情景的感受，比如坐过山车，哪个阶段令你们心情最紧张呢？慢慢上升的过程最紧张，越来越高 的时候，你期待着冲下来的一霎那，那个冲下来瞬间是解脱来的，是解脱后的那种刺激。你上升的那个过程的心情，就叫做张力。


    比如看恐怖片，整个荧幕安静下来，声音越来越小的时候，你的头脑里就会想，鬼怪就要出来啦，就要出来啦。如果你和女朋友一起看，你女朋友很紧张的抓着你的手，等待妖怪出现，当妖怪出现的时候，她大喊一声：啊!!!
    其实喊出来是一种解脱。张力的意思是说：就要出来就要出来的那一刻，之后来一个转折，像过山车一样冲下来的那种转折，这就是张力兵法抓住情绪的一种模式。


    江：要玩张力呢，你要有少少的演技，当然不是让你具备梁家辉张曼玉那样的演技，你只要学会皱皱眉头，忍住表情，那就已经绰绰有余了。有的人问如何控制自己的表情没有变化呢？眉头不动，眼睛不张大，颧骨的肉不起来，总之全部是平，当然你要经常去练习，没有捷径可走，练到没表情为止。当然不是说平时也要没表情，什么时候才需要呢？讲价钱的时候。平时可以有自己的表情。玩张力，最简单的就是要学会皱眉，这是不需要学演技班就可以做到的。当你问别人问题的时候皱着眉头，别人就会有点点担心的情绪。举个例子，你皱着眉头很严肃的和对方说：“我有样东西告诉你，希望你不要介意。”对方头脑会有什么反应呢，对方可能会想是什么负面的东西，然后有点点担心的感觉。


    李：你们去餐厅吃饭的时候，可以拿来练习出招的，当然不要很多人的时候出。有一次我们在餐厅，吃完东西时候，就叫一个服务员过来，很严肃的和他他说：“你介不介意我问你一个问题？你们的厨师是哪里人？可以叫他出来吗？”我这样的表情你会想到什么？这回有麻烦了，发生了什么事情啊？然后厨师出来了；我们问他：“你是哪里人？你说，你煮的是什么菜式来的？”然后厨师讲了一大堆，出现了一点点紧张的样子，问我们，有什么问题吗？


    我说：“没有，我想说，你煮的东西真的很好吃。”哈哈！过了半年，我又回到那个地方吃，那个人还记得我，你们认为那次张力兵法（应为“兵力”或原文如此，此处保持原样：张力兵法）的拍马屁，是不是让你印象深刻呢？


    江：有一次坐飞机，下飞机的时候我皱着眉头问一个空姐：能不能问你一个问题？空姐说：可以。我说：你是怎么做的？空姐愣了一下，啊？做什么？我说：你的发型是怎么做得那么好看的？然后空姐哈哈大笑，接着用了五六分钟的时间跟我解释如何弄。另一次也是在飞机上，皱着眉头和一个空姐说：有没有人说过你的脸？空姐说，啊，我的脸怎么了？我说：没有，你的脸很Q，很像洋娃娃。


    李：我们有一次在一家鞋店，看一下人家做销售的手法，顺便收集一些资讯，去到的时候，我们看了一下鞋的价位，就是没事找事做，我们一坐下来，明知道对面的那个就是老板，我们就大喊：这里谁是老板？老板说：什么事？我皱着眉头很严肃地说：介不介意我问你一个问题？这些货是谁摆的？老板纳闷的说：有什么问题啊？我说：没有，刚才我走过前面几家店，看他们摆的货，没有你摆的那么出众。老板心里顿时乐开了花。


    江：请注意我们的架构是拍马屁来的，当然，这种拍马屁和普通的拍马屁有不少不一样，普通的拍马屁直接说你很棒啊，你很厉害啊之类，当然对方也是机械式的反应，拍马屁有两种反应才是真的，一是别人很刻意的控制着笑，不想给你看，二是笑到随风摆柳。这就是真的拍马屁有效果了。这个马屁如何拍出，其实就是用勾魂类来拍出，勾了魂，让对方定了下来，你再拍，就很有效果。


    李：对方会以为你讲些很严重的问题。我妹经常说我没良心，因为我每次出去旅行的时候，我妹都经常交待我帮她带一些她想买的东西回来，但是每一次我都忘记；我就记得买书而已。后来我一旅游的时候，我妹就过来说我：大哥，我要跟你讲一个好消息和坏消息。她是皱着眉头和我说的，我一听好消息坏消息，到底是发生什么事情呢？然后她拉着我的手，拉我进客厅。因为我当时能量最低点，就被她洗脑咯，就跟她走进客厅，问她什么事？她从手提包里拿出一张纸条，说：“坏消息就是你去到那个地方，按照清单上的给我买东西。好消息就是，我会给回钱给你。”然后我一去旅游的时候，印象就非常深刻。我就想起她让我买的东西，如果她没有这样做的活，我可能买完书，办完事就不记得她交待买的东西了。


    江：我们书里面那个问空姐拿电话的故事，那个空姐我已经有7年时间没有见她了，有天在一个地方正好碰到她，她一瞬间就认出了我。之气我没留长发胡须，再次见到她的时候，她说：你那条不一样了哦。哈哈。我们至少有七年没有联络，但是见到的时候还记得。就是因为当时做了勾魂马屁。大家要记得勾魂马屁的强项是给人家很深的印象，它的缺点是不能够老是用，因为它的印象太深刻，你不能短时间内再次用它。有次我一个学生对他女朋友多次用勾魂马屁，到后面就没有效果了。这一招的印象是非常强的，大家一定要注意斟酌。假如你对你老板要做勾魂马屁，一定要挑选好机会来做。如果你是做领导的，你可以用这种方式来奖赏下属，有时候奖赏下属不一定是要用钱的，用这种方式产生的效果会比用钱要强。如果你做得好，它的力量比用钱还要强。


    李：我们翻到13页，意料之外的举动。这个时机的把握比较重要。


    江：你要讲一些东西，做一些东西，是别人没有想到要这样做的。比如书里说的，拿着一张六合彩的票，接触街上的人去兜售信用卡，这就属于意料之外。有一次有个朋友和我聊天，聊得很投入，再过多半个小时，就要去一家餐厅见两个人。当他讲得很投入的时候，我就很突然地问了他一句话：你的车是不是停在那里？他说，是啊，就在那里，什么事？我说过半个小时我要去一个地方见两个朋友，你可不可以搭我过去？他还在迷茫中，说好好好。然后我说陈安之你知道吗？他说知道啊。我说：等下陈安之在哪个哪个酒店有一个讲座，等下有时间我们一起去吧？他说好好吧。当然，这个情况的客观条件是，他当时没有什么事情做。他莫名其妙的搭我去见两个人，等了我一个小时，然后又搭我去听讲座，听完了讲座又搭我回家。这招是有用到一点点洗脑，洗脑我们下午再讲，用意料之外让他迷茫的那一霎那，我们再做。祈福党，还有马来西亚掉钱党，都是用这个方法来做，你在街上走着走着，突然掉下一沓钱，你很意外，不知道该如何反应的时候，他们把握

    '
