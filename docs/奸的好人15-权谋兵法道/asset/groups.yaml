    # 勾魂兵法


    勾魂的目的→制造能量最低点。


    能量最低点→当人类 98%的机械性反应被打破，头脑会出现极短的空白时间，在这段时间人的主控力最弱，平时的“固定执著的想法”会暂时放下，情绪上和行为上的反应亦很容易被外力操控。


    被动式能量最低点：


    （初入社会、换工阶段、压力、挫折）（意外、分手、离婚、家庭纠纷、亲人的病或死、初到陌生之处、刚遇到灾难或意外。）


    主动式能量最低点（四大技巧）：


    (1)好奇心、(2)张力、(3)意料外举动、(4)迷茫


    好奇心→问一些问题或讲一些话来激起对方的好奇心。纯粹是针对人性之中必然的求知欲。好奇心的能量最低点夜分成两种。(1)为好奇而好奇(2)为离苦得乐而好奇。


    为好奇而好奇的例子：


    我听了你这番话后，我有注意到一件事情……


    你这样做的时候，不知道你有没有注意到一个很重要的东西／事情？


    你有没有 X=(受过 DJ 训练)……哦！怪不得……（你讲话这么有条理）（拍马屁）


    X 先生……麻烦你一下……我有一样东西想同一问你……假如不方便，你不需要告诉我。但是，方便的话，我想请你告诉我一件事情。


    有没有人告诉过你，其实……


