    ## 社交博弈与推销技巧


    江魔：没休息之前，我提出有个人问你你怎么回答？有个案，有个传销公司，他们开大会要演讲，要请很多讲师演讲，就请到我。当时他总裁开会就和我闲聊，开始开会他就问我：江魔你最擅长什么？他问这个，如果我一回答，谁和谁证明？我和他证明。他问江老师你最擅长什么？你们可能想象不出那个现场压力，我给你一个夸张版的例子，一男一女拍拖，准备要搞第一次，开房，接吻，脱衣，准备搞摘（？），那个女的忽然问男的，江老师你最擅长什么？？（笑）临门一脚的压力。正式的版本他其实还问细微点，那你一定要回答你是做什么的，你不能不回答的。


    方法是，你记得，价值是虚假的，价值是用对比形成得出的。所以很简单，你回答他的话，你价值下降，你跟着要拉着他一起下降，大家一起下降价值差异就没那么大，不会让他摁死了问你，你回答到一点价值都没有。换个话，你轻描淡写回答他后，连捎带打又回一个问题给他，要让对方向你证明一些别的东西。再说一句，你只能踩进他格局的时候，你回答后，价值下降后，连捎带打回一个问题给他，让他要和你证明的时候，大家价值一起下。


    当时我就回答：我教的东西是比较特殊的催眠技巧来影响人，但，这个技巧很厉害，有些公司不适合做。这个当然是勾魂让他好奇，他就问为何呢？我就说因为有些公司企业文化不够成熟的话，他们高层的人就没办法接受下属比他们高层的人更会销售，顶头的人不希望下属比自己厉害。他听了要怎么回答？


    学员：直接声明？


    江魔：那个这个就没品味了，这么快下马说我们很成熟？


    李老师：你们要模仿这个老总的回答，他的架构很巧妙。


    江魔：他不是用直接的方式，而是用讲故事的方式回答。如果是刚出来的年轻人呢，就要上陈安之他们的成功激励课程，我们出来混这么多年了，我们要的是技巧。他间接说什么？向我证明什么？证明他成熟。他有些刚出来社会的要成功学，我们这些出社会这么多年的要技巧。他说我们出来那么多年要证明什么，证明自己是成熟的。


    李老师：他找了个替死鬼出来，踩了一脚，我是清白的，我成熟，那些替死鬼的课程是不成熟的。


    汪鹰：没错，他用了间接的方式，他老奸巨猾了。他说完后，他和我证明了，他价值低了，他又回了我一个问题，但他很巧妙给了我另一个格局。他说，有些讲师目的纯粹赚钱坑爹，有些是真的教人东西。


    李老师：这个格局很巧妙，你要注意，你要做他生意你没理由说：对啊，我就是为了赚钱哦！这不自己坑自己？但你又不能说：我是一个热忱救人的讲师！你说这个是很危险的，人家可以说你为了教育是不是可以少收点费用？你又给人一个压价的机会。他这个一次开了两个格局，你踩进去一定要找到平衡点。


    汪鹰：所以这类讲故事你们要小心，他是用讲故事在玩赐封术。他说，讲师有两种，一个坑爹，一个有料，一负面一正面。没人会自己说自己坑爹吧？所以是逼你选正面，这种讲故事的赐封你要看情况，正面赐封你可以不回答，但负面的赐封你一定要回答。他说我很讨厌迟到的讲师，你不能不回答。但你记住这个游戏的规则，我要和你证明的话，我也要你和我证明，因为如果我没有这个小动作要你也证明，人很贱的，有一就有二三，你会不停问，我就被动了，所以谁问问题，谁就拿住谈话方向。


    你要留意，当时我刚出道的时候我在报纸登广告，我留了家里电话和公司号码。一有人看到广告，我下令公司接线在电话是不公开课程收费的，我只会在说明会上说价钱。但有些人打来就会问收费，我会下令叫接待不说价钱。为什么，因为他没来听过我说明会，我怎么说价格对方都可以说，太贵了，除非我价格便宜到不行。接线的人经常就有这样的情况，但我接电话就没这种问题，因为第一个提问的是我，不是他们，我牵制住他们。他们打来就问：这里是平凡企业吗？我说对的对的，你们是不是看到我们的广告了？我就开始问第一个问题。对方说是的啊，-我说不介意我问下你们是看到那个报纸的广告吧？其实我们就在一个报社上了广告而已（笑）。对方说：星洲日报。我说：星洲日报是吗。我们周三
    7 点半在中华大会堂有说明会，那中华大会堂在哪里你知道不？我追问了，我自己说到一半没说完我自己截断自己的讲话就又他了。对方：哦，是不是吉隆坡那里前面有个喷泉的那个礼堂？我说，是啦就那里，我们周三晚
    7 点半就有说明会，那你几个人来啊？（笑），反正我就一直这么追问，最后我就说：OK, 那某某先生，那你就 7 点半之前来，我们留两个位置给你，OK 收线。就没人能在电话追问我，正式课程多少钱。当然你见客人别像我这样一直问哦。。


    李老师：人家问你价钱的时候，你肯定还是要回答的。我们以前开说明会的时候，我们开完说明会后，那些犹豫要不要上课的人就回来问我们，李老师江鹰你们的课程和 XX
    讲师有什么区别呢？后期我们统一一个回答模式，我们问他三个问题，然后叫他别来上课，结果我们实验的结果是，我们叫他别来，他也要来。就有过一次，我们这样说完被一个人撒泼摔门出去，其他都是问了后就去报名的。


    他问我和 XX 课程有什么区别，我第一个问题是：你上过 XX 的课程了不？两种可能，这个我们不关心，要么你上了，要么你没上。如果你没上过，你来上我课程不公平，你没上过人家的对吧？他上过我们要怎么做？我们就问：你觉得有什么分别。我这样问你的时候就成了我们在审视你，他就要想他上课的东西是怎样的。他不论回答什么，我们就继续说：今天你听我们的东西，如果和外面的讲师一样，没区别，那你别来上课了。


    第二个我会问，你来听我说明会有没有哪个部分让你大开眼界呢？我会给他自己回答下。我第三个问题会说，如果我的说明会没有东西让你觉得大开眼界，你不要来上课浪费时间。


    我们第三个问题有早期回答和后期回答，早期回答我们有说退款计划，我们会问你信不信呢？通常大部分说到这个很多人都相信了。但是后期我们觉得不够完善，把回答改成了：你们在人生和做生意到现在为止有没有遇到问题。这个肯定是
    100%会遇到问题的，如果你没问题，你肯定不用来。一般我们关键字用了大开眼界，有什么不同，有什么分别，用这些说大家一般都会报名。或者我们会问你们听我们演讲有一般讲师有什么分别？我们会考考他们要他们说出具体答案，然后问第二个问题，我们俩小时演说有没有什么地方让你大开眼界？如果没有，那你也不要来上课，等他们自己说什么地方让他们觉得大开眼界，等于我们在审核他们。


    李老师：我们说这个是有自己的料才敢说的，如果我们演讲一开始就叫人起来唱歌跳舞，那就没意思了对吧，我们真的很辣，我们演说会从来不介绍自己，上台就直接开说。没主持人的，我说过我们自己能做就自己做，连报价都是我们自己说。


    江鹰：我甚至有过于有个人听我们说明会后，跟我说：江老师啊，我听完了你的说明，假设真的好想上课。那你来试试影响下来上你课好不好？(笑)。我没直接回答，我就按公式问：你有没有觉得课程和别人不一样？你有没有听到一些让你大开眼界的资讯？我都不用再问第三个问题了，他就自
    已去报名了。报名后我又和他说，你来上课你提醒我，我告诉你你为什么现在报名了。然后上课的时候我又和他说这三个问题影响他，所以这就是销售员也是有办法审视回顾客的，大部分时候是顾客比较高在上，但销售员也有办法降低他们的位置。你就要用这个手段把价值的错觉降低。


    ### 案例：模特女友与财富展示


    当时那个传销公司的老板请我做了5次培训，当时我有个朋友是做生意的。生意人都很会包装自己，戴手表一定要劳力士，开奔驰，穿阿玛尼，其实商业聚会就是大家比谁更碉堡。他是个合法的百万富翁，有洋楼，跑车，加起负资产什么的，你们懂的，他已经包装自己很好了，他还想了一个包装是什么，找个模特女友。你觉得找这个有提升包装不？


    李老师：我打断下江魔的讲话，我不知道香港那边的风气，我们马来这边，几个男性成功的商人，聚在一起私下肯定会说自己有养情人，养过模特，肯定会交流这些东西。为什么呢？这是暗示自己有钱，能搞定两个家，你们要信我能力。


    江魔：而且他利用了大家对模特的错觉，以为模特女友要用很多钱，他用这个包装是对的。人是很肤浅，看到你带模特女友或者你妹子很漂亮，他会你的判断是会提高的，这是很人性的判断。他当时追个模特，那个模特就说以前她男友每月给她3500马币，


    李老师：3500以马来现在的金融指数，比马来应届毕业大学生高，大学生毕业只有1600.到3500在马来基本是经理级别的工资了。她这样说，我朋友要怎么回答，如果你是我朋友你要追这个女的，女的说以前她男友给她3500零花，你怎么回答？


    李老师：你就当我们现在是模特（笑），你们怎么回答。


    学员：和她说每次我带出去的妹子每月都不一样？


    李老师：你这样是在挑战？你现在是迫人，你这样说女人可以当没听到。你这样回答等于在说自己很花心。


    江魔：你们想过这个妹子问这个话的背后想说什么？


    学员：能要多点钱。


    李老师：没错了。


    江魔：也不是说一定要够3500，但起码要有3500.


    学员：那也可能她之前每个月也没有3500。是故意说的。


    江魔：有可能。


    李老师：有可能之前她只有 1600 零花哦，她开高点给你还价。


    江魔：搞不好可以还价哦（笑）。但我朋友比较厉害，他没直接说。你也不可能直接说，我给你 3600 一个月？那女生肯定和你说你当我是什么？？不能这样直接说。我朋友就用了间接的说法，因为当时妹子在他的名车里面，不用再推销他有名车，但你也没理由刻意听出了她
    3500 的资讯，故意说带妹子回家看金鱼。说什么我今天忘记喂金鱼了带妹子去看你的豪宅。他就说，前段时间我去意大利看到个窗帘，我觉得很漂亮我很冲动就买了，用了接近
    700W 马币，包邮费什么的，放上去才发现不搭配我家，我就送人了。


    李老师：你注意故事的层次，很冲动，用 700W 买窗帘，放上去不合适，立马送人。


    学员：很浪费。


    李老师：没错。


    学员：我可能还会再买。


    江魔：模特可能会想，700W 的窗帘他家窗子多大啊？他家应该很大，接着几百万的东西能送人，他很大方。


    李老师：其实，那女孩没住过豪宅，住过豪宅都知道很多落地窗，700W 窗帘是小意思而已。你们做过房地产，做别墅都知道，装修的窗帘肯定是几百万的，住过豪宅的人一听，700W？小意思而已，你也不是很有钱，他的境界也是不够高的。


    江魔：我们的朋友的办法不是完全正确的，谁和谁证明？他这样说是向妹子证明什么？证明他有钱。很多时候你看到有钱人，很有钱，但是被二奶扯着走。


    李老师：你们要注意江魔说的这个资讯，很重要。很有钱，被二奶扯着走，其实谁有主控权？


    学员：正常肯定是有钱人啦。


    李老师：正常肯定是有钱人啦，不是二奶。你说二奶有主控你就被二奶这个词迷惑了，二奶是靠有钱人的钱嘛。


