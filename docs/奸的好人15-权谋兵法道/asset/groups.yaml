    \n勾魂四大口诀：\n\n制造四种情绪：好奇心、张力、意外举动、迷茫\n\n引起对方情绪反应的种种讯号：\n\n- 1. 表情：呆滞、迷茫、惊讶。\n- 2.\
    \ 反应：追问、发出惊叹声、要求你重说、微笑、默不作声。\n- 3. 肢体：前倾、抬头凝望、微微侧头。\n\n销售或谈生意的勾魂：\n\n•以好奇心人手。先用\
    \ “为好奇而好奇”开头，再以 “UESP”来加深其能量最低点。然后就夺心洗脑。夺心洗脑的过程中再以更多的好奇心、张力、意料之外的举动和迷茫来制造更多的能量最低点。\n\
    \n•为好奇而好奇→UESP→夺心洗脑\n\n一般交友、男女或伴侣感情、教育、辅导等的勾魂\n\n·一开始就不断的以好奇心、张力、意料之外的举动和迷茫来制造许多的能量最低点。每一次有能量最低点时，马上趁机用夺心或洗脑。\n\
    \n| 和刚认识的女生谈了不久后，你一弄到她笑时，就问：其实我觉得你这个人蛮奇怪的…… | 目的： |\n| :--- | :--- |\n| 她：什么意思呢？\
