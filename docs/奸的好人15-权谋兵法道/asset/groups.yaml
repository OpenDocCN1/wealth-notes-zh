    abc 供应商，临时来到公司，要开一张很重要的 check 给他，你要快点回来签 check。如果不是，人家这么远过来，他是第二个州属的，没请他吃饭还不签
    check 给他？很不好，我们要保持信用。我刚刚开车到那个区域，……（缺一部分）


    **江健勇**：为人牺牲我们书里有写，牺牲小价值就小，牺牲的的话你会合理化，价值就大。有一个实验，让女大学生看一碟录像，这碟录像是讲性教育的。分两组女学员，一组是报了名就可以看了，看完后要打分数。另一组的女学生除了报名以外，还要做一些很奇怪的东西，比如站在凳子上，五个人对着唱一首不知道什么歌，然后才能看这碟录像，就是要做一些麻烦事情，看完后也要打分。你说两组学生打的分数，哪一组会觉得这个性教育的录像更有价值呢？第二组。也就是说她们做了些麻烦事，再看录像呢，就会给更多合理化的解释。所以牺牲就有这个好处，纯粹的举手之劳还没能制造这样的反映。


    ## 中奖效应


    **江健勇**：第三个层次呢，就叫做中奖。很多公司用很多东西来奖励人，其实这不叫中奖，我们说的中奖指的是比如说六合彩赌博中奖赢钱一样，是非定性，你不知道什么时候会中的。很多公司里边，销售业绩做得好，就给些东西奖赏他。这不叫中奖，这种奖赏时间长了他会觉得我做得好这些东西是应得的，所以这不叫中奖。还有些公司年底会请大家吃大餐啊，或者叫大家去度假村，这都不叫中奖，因为这已经定下来了。中奖的意思是受奖的人永远不知道会发生什么事情，他们永远不知道什么时候可以拿到。拿刚才那个吃东西的例子，除非说那个公司有一天
    9 点上班的时候突然说，今天大家不用上班，现在我们出去吃东西，要迟到最后才能回来。这叫做中奖。


    **江健勇**：我们有个学员上完我们的课以后，他就不是用钱来中奖，但是他们的公司是不错的了，他们公司是已经赚到钱了，某一天他突然间就说明天大家放假，就是说他的假是突然来的。这样子他就会令到员工的士气增强！我有问过李民杰老师一件事情，就是他以前的股东，那个股东没有做举手之劳，原因就是大家有利益关系，老板要对你下手，他可以做举手之劳，但是他不需要。


    **李民杰**：老板要你牺牲的时候你是很难拒绝的。


    **学员**：我想问你的客户是不是都是为你牺牲的？


    **李民杰**：其实，我需要我的客户，我的客户不需要我，呵呵。其实老实说，我不去，不打电话给他都无所谓的。我为什么要打电话回去，因为我以前做过销售员，所以我觉得有交代会好些。第一次我去到他
    office 的时候，我迟到半个钟。第二次我去到他 office 的时候，他叫我在哪里等，在会议室等，等他在半个钟。接着他就慢条斯理拿着那些文件来，我说要不要等这么久啊，他就半说半笑地说，上次你迟到半个钟，今天要你等一个半钟，我是想让你知道，你浪费我时间，我现在要浪费你时间。她是个女人。我当时都很气氛，但是要做这个生意，所以忍住了。所以自此以后我很少迟到。见客户的时候我尽量很少迟到。因为主控权还是在别人手上，有些生意，比如说做保险，我不是做保险的，做保险这个不行可以找另一个。就像有些人上权谋课程，威胁我，你不降价，我不来上这个权谋课程，格局谁大谁小，不降价就是不降价，你能怎么样？我不会因为降价给你而得罪更多人。因为我做讲师，我面对的是群众。我做的生意是怎么样呢，例如，我是做药厂销售员，我少一个客户就等于少一个医生，假如说马来西亚有
    100 个医生，我得罪一个就相当于只有 99 个医生，我的市场就少了。我是这样的角度来看市场，所以种这种情况，我尽量少得罪客户。但是对于做演讲行业，做保险行业，做信用卡行业，少一个不少，多一个不多，你不要来威胁我。


    **江健勇**：当时我问过李老师这个问题，那个股东不断要你牺牲牺牲牺牲，因为李老师很多年前说过他想看一套书，毛泽东评点 24 史，毛泽东读 24 史读了 30
    多次，每次都做了些笔记，有人把这些笔记收集起来成为一套书，这套书当时在马来西亚卖几千块的。李老师很想看这些书，但是当时李老师没有钱买这些书。假如那个股东有一天突然打电话给李老师，喂，你在哪里啊，快点过来快点过来。Shit，是不是又要搞我。去到的时候呢，股东把整套东西放在桌子上打开，说，整个马来西亚只有一套《毛泽东评点
    24 史》，我知道你很喜欢，所以我以公司的名义买下来送给你。就用这种惊喜式的做法。我就问假如这样的事情发生，你会怎么看这个人呢？李老师说现在就很难判断了。我们用想象版，你会怎么看之前搞你的人呢？这个人都不是很衰的，而且你还会想之前的牺牲好像是值得的。这种中奖加牺牲就是又爱又恨，这样就制造了死心塌地了。


    **江健勇**：我们在马来西亚认识以为企业家，这个企业家跟首相很亲近，他自己有一家广告公司，有一家大学，很有钱。他的广告公司，很特别的地方就是能留住人才，里边的人才一做就是十几年。很多公司都留不住人才，但是这个企业家做到了。怎么做的呢，在他的广告公司，员工做的作品，假如不合格，他会走到你的面前，叫你站起来，大家都见到，因为
    office 都是开放的，他就把你骂得狗血淋头，然后就将你的作品撕了，扔你的脸。大家都看到了，是侮辱的了。扔了以后说，你回去再重做。牺牲来的。


    **李民杰**：你们不要问为什么那些人还要做下去。台湾有个很有名的主持人叫黄慧中，江湖上流传着，不给中哥看剧本的人，这个人是不会成才的。黄慧中就像那个马来西亚富豪一样，他可以用很用心地写一个剧本，然后撕烂它，然后当众侮辱到那些编剧家哭的，男人啊，都哭啊。这个人是神啊，在台湾综艺栏目届。


    **江健勇**：骂完以后，侮辱肯定很大了，自尊心是受伤了，在你生日那一天，那个企业家亲手拿着 5000 元马币，相当于港币 1 万多块了，拿着红包 cash，拿上去找你，亲手交给你。


    **学员**：是私底下还是当众给？


    **江健勇**：就看当时的情况，你的生日是在家里还是跟朋友在一起，他想办法亲手拿给你。你会怎么看这个人？所有的牺牲，可能都是为了我好呢，哈。你就会有合理化解释。


    **学员**：……


    **李民杰**：被骂的时候肯定很痛的，像被针刺到肉一样。


    **江健勇**：你不是那个拿钱的人呢，你未必能够感受到那种兴奋的喜悦。


    其实严格来说，马来西亚的大富豪可惜没有上过我们的课程，如果上过我们的课程就更加简单，效果更加好，省下更多的钱。生日那天给 5000 块，严格来说不完全是中奖来的。记住中奖一定是不理由的，不是说他表现得好我才给他。而是他没有任何表现的时候，突然间拿着
    5000 元的 cash，拿去给他，在别人面前给他也行，在私底下给他也行。如果有演技的话还可以这样说，你知不知道以前我要这样骂你，因为我仅仅是对家人才这样的。


    **学员**：是不是说要关系亲密才行？


    **江健勇**：不一定要关系亲密的，总之是一些你希望留下来的人。


    **学员**：对异性都 ok 吗？


    **江健勇**：不分性别，第三个性别都可以，哈。你想下，如果那个马来西亚富豪用我们这个版本的中奖方式呢，他不用每一个人都是生日给钱，他仅仅是给过几个就可以了，这几个就会当他是神了，然后这几个就会传播福音了。他们就会说，你知不知道啊，我们那个老板，不要看他这么衰，哈。越传越多，其实这才是最好的。传到整个公司都有这个神话的时候，其他人就在想，不知道什么时候可以轮到我。


    **李民杰**：台湾中哥是不给钱的，但是你知道台湾综艺是怎么传的吗？被中哥骂过的人可以出位。没被中哥骂过的人，一辈子都不能出位。你看多严重，这个是台湾综艺节目届传着的神话来的。被他骂很难受，但是被他骂的同时很光荣。当时我就想，脾气臭就是脾气臭啦，呵呵。


    **江健勇**：所以这个就是苦，这个就是乐。最大的乐就是上瘾，因为你不知道什么时候会得到。两样东西搭配起来就会导致这个人死心塌地。又比如对异性，为什么有些坏男人打女人，那些女人给他打还粘着他，还给他钱花，还不肯放下那个男人呢？就是那个男人这样做了，牺牲牺牲牺牲，久不久就做一些好事情。


