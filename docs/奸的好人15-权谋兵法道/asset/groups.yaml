    # 格局兵阵


    格局兵法最重要口诀：我讲了这句话，或作了这个行为后，谁有主控权？如何看出谁有主控权：


    +   谁向谁证明自己？


    （A 向 B 证明自己，____有主控权，谁要谁的接受）

    （B 希望 A 接受自己，____有主控权，谁需要谁）

    （A 让 B 觉得 A 很需要 B，____有主控权，谁顺着谁的意思）

    （A 在审定 B 的资格/条件，____有主控权，谁在审定谁）

    （A 顺着 B 的意思，____有主控权）


    # 沟通


    +   1、 自己先抢到主控权；

    2、 对方先抢到主控权；


    +   a 运用勾魂攻破对方的格局，然后再夺回主控权。

    b 如果想不出如何勾魂，对对方所设的格局完全不为所动，若对方格局不强，通常不攻而破。

    c 如果逼不得已要踩入对方的格局，一定要列出条件。可用洗脑兵法。

    d 毫无谋略的话，记得暂时性任人鱼肉。谨记英雄报仇，十年未晚。


    踏入格局陷阱的心态：


    +   (1)我很在乎你，你对我很重要…

    (2)我很想得到你的订单…'
