    ## 宏观微观说话术的分类方法


    课程的种类→1、激励课程；2、知识学术；3、技巧手段。→种类优缺点。


    ### 资料内容：


    1. 激励课程的特点功用：确立人生目标，放大梦想，激发志气。


    利（优点）：当你迷惘、沮丧、灰心失意，全无斗志，屡遇挫败，陷入困惑之境，激励课程可以帮助你，重新振作，振奋志，勇往困惑之境，冲向挫败。是处理事隋，投入热情的良方。


    弊（缺点）：它让你情绪起伏，大哭大笑，就像兴奋剂，使你无法客观正面现实情况，不能用来解决问题，处理因境难题。


    2. 知识学术课程的特点功用：像商业管理，让你了解业务运作，大企业的营运手法，政商行政事务，经济趋势。


    利（优点）：增进知识，开拓视野，具提醒及参考的作用。


    弊（缺点）：未必有切身关系，所提供数据往往会因不同的时间、地区、人物而有所误差。


    3. 技巧手段课程的特点功用：可以将所学的技巧手段很实际的运用，处理人际关系上的各种利害问题，解决困境。


    利（优点）：即学即用，可转换成实际的利益。（如：学到 COLD CALL 手法，即可用来开发新客户。）


    弊（缺点）：需要思考消化手段运用之窍门，并要自动自发去应用，没有人会推动你。


    ### 数据内容：


    参考例子：


    向推销员介绍权谋课程


    | 目的 / 手段 | 对话内容大要 |

    | :--- | :--- |

    | 先做勾魂 | X 先生，我想问你，你是不是准备听真心话？……有些话我讲了出来，希望你别生气……（参考勾魂兵法好奇 心或张力兵法。） |


    | 目的 / 手段 | 对话内容大要 |

    | :--- | :--- |

    | 千一问之术 | 根据我的经验，每 100 位推销员，通常只有 1-2 位可以成为 TOP SALES，大部分的推销员甚至没有办法达到公司为他所预订的业绩，这些没有办法做到业绩的推销员，很大可能都是技巧上出了问，是的，x
    先生，请问你是不是 TOP SALES 呢？((a)是:(b)不是;(c)有些时候做到业绩，有些时候做不到业绩。） |


    | 目的 / 手段 | 对话内容大要 |

    | :--- | :--- |

    | 制造张力隆→宏观微观→夺心探情 | 听了你这样讲之后，我注意到一件事情……（注意对方的反应）。请问你有没有参加过任何课程？((a)有→哦，难怪！从和你
    对谈的过程中，注意到你的肢体动作和谈话内容，觉得你别具一格，有不凡的风范，大概都知道你是受过训练的。请问你上过什么课程？……（对方答后，你就可以除了）一般上市场上的训练可分成三大类……（用宏观微现分类，再补以价值观排列）；(b)没有。）
    |


    | | |

    | :--- | :--- |

    | (b)答法，你的回应是：先拉向快乐。 | 以你的实力，加上你的谈吐态度与技巧……其实你只要找到方向感，你一定可以成为很有魅力的推销员，只可惜你没有受过训练，没有办法将你更大的潜力发挥出来！
    |

