    ## 马来西亚生意中的信任与防骗策略


    道。李老师以前做生意的时候没什么追债的问题，是他根本就不碰那些有问题的人。


    李老师：同时我会很小心，当然了，我也不是一天就有这样的功力，可能被 人骗多了我就学聪明了。第一，如果在马来西亚，我会巡视他的工厂。我开车要停车的对吧？香港停车可能很难，不过在马来这边停车挺容易。我会先看这个公司的规模，如果这个公司有
    50 人以上，主管级以上的人，没有人开（这里我听不懂，大概是某种中产阶级人买的车），我会很小心这家公司。


    江魔：就是主管级别的人没有这个车。


    李老师：我不是要求每个员工都有，这个是不可能的。没有这个，我会很留意，但我不是用这个作为最后标准。第二，我会看他工厂，我会看他工厂文职的人忙不忙。他的工作人员如果像政府部门一样聊天上班，你觉得呢？这个其实是很实际的评估。为什么呢？公司忙代表什么？有生意做。有些东西你赚多少是一回事，主要你要有生意做，你的资金才会是在流动，在转的。他说什么我都不信，我要亲眼看到那些我才信。


    我曾经和一个做金锭的人做过生意，马来西亚一个金锭商人，全马货币都是他做。我帮他做服装这个事情上过报纸的。我对马来人天生特别提防的，那个人约我的时候去哪里？国家银行啊，过几重关见他我都不信。他一要我签约，我就一句话：要做生意你先给我定金，一定要先给。然后他就要很小心证明给我看他有钱。他怎么做？他请我去他家吃饭，我们没成交就请我吃饭。我去到后，我看到我们首相，苏丹，元首在生日会的时候庆祝生日的照片，我看到我也很冻练（冷静）。他是不是真的这么碉堡（厉害），是不是真有钱？但我一路控制我自己，“不要相信马来人”，中一招我就难搞了。你带我看这个，必定有资讯不对称。用阴谋论来说，我一个普通人你干嘛要给我看这个？你会不会是设局想弄我？我一直很小
    心提防这个人，就算到交易最后一天我做好了货我也没给他。他为了向我证明他有钱，他把支票传真给我，我就送过去。我送过去的那天，出事，你知道什么事情？全部交通警察在那里，我们国家的元首和首相去参观他的金锭厂。当然我有个合法伤害权，因为加拿大领事要去参观他工厂，他现场的人要穿新的制服，我有这个合法伤害权，进去是要搜身的，我说我送制服的哦！就避免了。


    我就没那么轻易信人，包括马来西亚的民族性。因为大 马人的人性，我情愿做少点生意，我都不愿意被人骗。我和江魔都不相信规模的，很多人说，做生意看规模。你看我们做课程？恩？我不是说做规模不好，我会给自己一个合理解释：如果你用
    60 个人一个规模的生意，你同样 3 个能做这个规模的生意的话，在我角度 3 个人不是更赚钱？我开销小啊？不是说我们的看规模大小，而是要教你们说，不要光看规模这个东西。


    ### 案例：国有公司合作陷阱


    汪魔：李老师当时有个好朋友的爸爸介绍了一个马来当地人，有地位的，听说很有地位。因为那个朋友的爸爸以前是记者，认识很多这样的人，介绍给李老师做生意。那个人就说李老师你家不错，如果你要做多大，我们合作，因为国家有个部门要你们制服很多的，我们可以和那个部门合作，但是你们自己想和那个部门合作是不可能的，我们要合作。他又说李老师的产品很好，就要订
    6000 套，很大的诱惑对吧，6000 套。结果在最后下订单前就改成了 200 套，6000 变 200，说要试试先。


    李老师：他说的资讯其实是实话。他带我进国有，那个公司是国有石油公司，国有公司。我们要开户进国有一定要有本地人股份，本地马来人一定要 30% 实权股份，就算他啥都不干也要那
    30% 实权股份，我们才能进国有。我们去申请国有的单据就要第一个问你，你有没有本地马来人合作？他有没有 30% 实权股份？没有的话，你闪边去。真要这个关系，他就是带我去见到国有公司的人，最后他订单
    6000 变 200。


    汪魔：李老师最后决定不搞，搞的当时李老师的股东和李老师都闹便扭（别扭）。李老师就很坏地把这个生意给了另一个人做。结果那人一直到现在收不回货款。（笑）


    李老师：不可能的嘛。很简单分吗。认识这么大背景的人，我是不知道他用了什么办法让国有部门的人见我，但是没理由吗 6000 变 200？我接过蜘蛛侠的衣服他都不可能开始
    6000 最后变 200，就算是 COS 服都不可能，开始订购 1W 套最后都不会变 1K 套，这个肯定有诈。


    汪魔：老千经常用的手段就是最后一分钟变卦，你一定要小心。


    李老师：而且，老千们不止是变一次，几次都有。所以我宗旨，不信你过好过相信你。我就是用这个方法提防他。很多做大生意的人会和你说，这个是小事，你要建立信任。但是在我看，这些如果是有资源的成功人士对你说，别信。对一个从零开始的人，你能被人玩多少次？你有多少资源被骗？用某人的话：人生有几个十年？你可能被人玩两次你就死了。我情愿我起步慢点，迟点发达，我都不想被人骗。这是我一个很固执的人生态度。


    汪魔：OK 15 分钟茶点。


    学员：如果你很有资源你也不在乎？


    李老师：我很有钱我肯定不在乎那 200 套啦对吧？


    学员：那他没必要降低啊，要够原来数目不好么？


    李老师：你要知道，老千会心虚嘛。


