    ## 李江对话：自我、野心与好学


    李：举例，你去吃东西的时候，别天天都这么挑剔。你可以要求厨师不放葱花，分量多加一点等等的小要求。有人插队的时候，你站出来去骂他，代表群众骂他。他也可以态度很好的说你不要插队，你说这些的时候要不卑不亢。


    江：当然，你要选一些弱小的人来骂。哈哈！这些是最好的机会去训练你，如何踩入对方的界限。


    李：不踩过线是统治阶级统治群众的手段。如果你是喜欢研究历史的，你可以看一下，春秋战国那些人，最喜欢干嘛？最喜欢的就是去踩入对方的界限，讲话的时候，占大王的便宜，还有尝试越过国界。有一些国被别人越界的时候，不出声，就被人得寸进尺。所以踩过界是争取格局优势的一个很重要的东西。


    江：除了狂之外，还有一个是野心。一个人有野心的话，身体上的化学元素会改变。野心会带来身体上的变化是男性荷尔蒙，睾酮素。有人做过实验，一个公司里面，领导者和服从者，领导者男性荷尔蒙偏高，服从者偏低。男性荷尔蒙高的时候，声音会变沉，睾酮素高的时候，人会很爽，比如比赛的时候，获胜的那刻，是很兴奋的。美国有的总统，发动战争的那些，他的年龄正好遇到睾酮素下降的时候，当发动战争的时候，睾酮素就提高了一些上来。古代的皇帝，喜欢打猎，骑马。打猎杀生嘛，骑马会有征服感嘛。还有，搞后宫佳丽咯，这几样皇帝都会做。


    李：当然现代你打猎之类不能随便都能玩到，杀人更加不可以了。我本人的方法是找出一个假想敌，接着短期目标是想尽一切办法超过他，但是假想敌不要当真，能打败就打败，不能打败你也没有损失，不断找出假想敌，去征服它。除了找假想敌，还有一种方法，就是找出一样你喜欢的东西，先喜欢，再入迷，然后入魔。当你入魔的时候有一个很大的好处，你的框架会很强，你的知识会不断扩宽。


    江：这种性格，其实也是挺危险的，又自我又傲又狂，一是极端自我就是王，要么就是亡。我们要从效果去看这样东西，但是单单看效果是不够的，因为你要效果，你有这种性格作为支撑，但是你又达不到效果的时候，你就需要提升，所以我们填上最后一个空格“好学”。很多人说学习重要，很多人喜欢把学习摆第一位。但是我们认为学习不是第一位。虽然我们这样说，对我们的生意是有一些打击，理论上来讲，我们应该散播一些噪音，学习是最重要的。但是我们认为学习不是最重要，学习是有了自我和野心之后，你再去学习，学习才会有效益。但是没有自我，很好学是赌博。可能会帮助你，也可能帮不了你，有很多人看了很多书，上网找资料，一辈子只是在转圈圈。所谓的好学，我们做个比喻，你的自我就像火，好学像风，如果你的火小，风很大，会把火吹灭，如果你的够大，你学多的东西就有用。


    你们要知道，从权谋的角度来说，学东西不需要学完，学到有用就可以了。学的时候你就会过滤。如果是从学术的角度来说，当然要到全面。**权谋主要看效果，学到有用就可以。**
    学术你就要全面。好学分两个层次：学和教。未来的一年，你们要做一个功课，这个功课是你们要收徒弟，收一两个就可以了，别收那么多啊。敢播点喋首先。（笑）你要找一个人肯听你讲的，意思说这个人不能比你强的。你收个笨笨的徒弟，原因是当你教人的时候，因为你的自我就可以带出傲，别人用你教的东西，去试的时候，回来跟你报告，有效哦。那你听到你教的东西有效，你就会就觉得很爽。理论上就是身体上的男性荷尔蒙增加，野心就带出来了。当然你可以教你很拿手的领域，你也可以教权谋，但是不要开班抢我生意就好了。哈哈。


    ### 李：学与教的重叠


    李：今天你来上这个课程，你希望学点东西有一技之长。你学的时候，你的头脑不是在消化我们的东西，你只是在尽量记得我们的东西，所以你学的东西只有形式，而没有内力。假设你有了收徒弟这个概念之后，你听完我们讲，你就会分析我们的架构应该怎样使用，用了之后如何迷惑我的徒弟，你的头脑是两个层次的变化，你不是追求记得和安心，**你在整个过程你有教的心态，会将我们的内容提炼和消化。**
    当我们看书的时候，我们的过程除了学的成分，更多的是教的成分，我们两种心态是重叠的，学的心态在下面，教的心态在上面，为什么专家和学者不断开发出理论出来呢？教授要干嘛呢，要教人咯。他们在旧的理论里面，两种心态相辅相成学的心态在下，教的心态在上，学的时候不断看穿架构，不断消化突破。中国古话说“究天人之际”这个是学习者的心态来的，你学完天文地理，把所有资讯都记在脑子里。然后就“通古今之变”。中国很重视历史，你要知道历史变化的故事。其实你知道这些故事有什么用？“百无一用是书生”古代皇帝都是这样形容读书人的。因为你学完了，你也是书生之见，你不能只有书生之见，你要成一家之言，成一家之言是什么呢？目的是准备教人，一旦你有教的心态，你的心理会有三种变化：第一，你会看漏洞，你会学到：破。这个理论有没有漏洞？今早说的优越感。我头脑里有破的资讯你要养成一个习惯，看这个理论有没有矛盾，有没有毛病。第二，就是要：立。为什么要立？你就算是站在完全学的心态，就算你逻辑思维很好，你也只有破没有立，你知道为什么吗？你只想学而已啊。当你重叠教的心态，你怎样从一个理论变出更加特别的东西，是我的独家之言。当你只有学的心态，就像刚才江先生说的，你的火很容易被吹灭。


    李：比如市场上有一个本书叫做《蓝海策略》，当个个都说这本书的时候，整个市场都在随大流推崇这本书。马来西亚曾经流传过一本书叫《长尾理论》，你一听，这个理论似乎很有道理，这本书主要是推翻意大利经济学家的理论，80%对
    20%的原则，长尾是说 20%的畅销产品，取代 80%的普通产品，80%普通产品可以制造出一个长尾巴。它用一个例子，比如亚马逊，一年卖两本畅销书，这些书累积起来，有
    4 个美国最大型的书店那么大。它把什么彗星啊，宇宙学的理论全部套用进来解释它这个理论，你听起来觉得很有道理，但是你心里想想，合理吗？一个出版社老板可能会想，一年卖两本，我什么时候回本？那这个理论对出版社老板有用？一点用都没有。别以为那些外国人是学者你就相信他。这个就叫做破，我破了之后对我有什么帮助？可能一点帮助都没有。站在一个讲师的立场，我不总是破，我会想长尾理论是有问题，我再重叠教的立场，我破了它之后，我如何立和用？我会想，如果我要教长尾理论的话，我要教什么对象，我不会教零售店的人，我会把它变成销售技巧教那些批发商，因为批发商可以用这个长尾理论去忽悠那些零售商，让零售商去拿那些不好卖的产品回去卖。IT
    行业里 HP，苹果，戴尔很有名，而我是做山寨产品的，比较难销售出去，我怎样用长尾理论，忽悠那些零售商拿我的货呢？你和那些零售商说，大品牌的厂家是大奶，而我是卖二奶货的。有勾魂效果吧？卖二奶货哦。那些人会很好奇，什么是二奶货啊？你就说：“根据美国的研究，20%的产品，取代
    80%的利润，现在流行的这个理论是错的，要真正成功的话 ....balabala 搬出一堆长尾理论来，接着说，你有没有遇到一些客人进来，看到大品牌厂家的产品，就走了，为什么？因为他们要的是便宜的价格。你一看到他们不喜欢大品牌的产品，你就把二奶货拿出来。”这个就是批发商用长尾理论去忽悠那些零售商的用处。我身为一个讲师的身份，我不是站在学的角度，我看到这些理论，我是站在教的角度来做，当我说长尾理论的时候，我就说出一家之言，这是我独特的见解，在市场上你看不到讲师讲这些类似的东西。当我破、立、用同时出来的时候，你们会产生我知识非常渊博的错觉，你三管齐下的时候，你包装自己的手法就会更强。


    ### 江：性格转变与收徒


    江：这不单只资讯上的包装，性格上也要改变它。我从小就喜欢当师傅教人，很下意识的就这样做，我这样的性格就比较早形成。李老师小时候性格懦弱，而现在已经完全改变，刚开始是因为环境所逼，到后来就收了徒弟，就是书里那个乱打人的徒弟。收了徒弟就很明显的性格上产生改变，要变得自我，修炼最快的方法就是收徒弟。要从你比较擅长的领域入手。


    李：你收一个徒弟，你是没有收他钱的，因为你也是半桶水而已，当然你那个徒弟是要比你笨一些的，这些所有的东西是你进步的工具，但不是究竟。是一个过程而已。你学习的时候，要教与学重叠，还要记得我们的原则：破立用。这里理论我怎么破，破了之后我讲些什么给你听。你不要把所有的东西看成是固定的，你要用变化的角度看问题，人类不断进步。如果你是一个上进的师傅，你自然会进步。因为教的过程中，你的徒弟令你很爽，你会看多几本书的。


    学员：这个长尾理论是不是一点都不值得信呢？


    李：这个长尾理论，站在生产商的角度上，你就千万不要信了。如果是批发商的角度，你就要相信这个理论了，你还要将几个理论背熟。


    学员：如果你教了一个徒弟，这个徒弟有了这些思想，来破你了，你怎么办？


    江：其实市场是很大的。我的念力班里有个学生，就像教主一样，经常帮人家念力发功。别人问我：你不怕他将来厉害过你，成了一家之言和你竞争吗？其实市场是很大的。如果你真的要做教主，你就要搞一些封锁资讯，你收徒弟就不需要去控制人，控制人的话，就真的要像教主，做资讯封锁。你要做邪教教主，还要控制别人的行为，我们的目的，是要你做师傅，不是要做教主，做师傅让你的性格开始变化，性格变化你的自我就突显。


    李：一个邪教教主，连信徒的起居饮食都要干涉，做什么都要干涉，当他有这样的倾向的时候，被控制的人相当于没有了自我，那个人的自我就越来越少咯，教主的自我就越来越大咯。信徒就进入了教主的世界。


    学员：如果我学了权谋，好像就把每个人当工具了怎么办？好像什么都用权谋利益来权衡。


    李：你要问自己，你是想骗钱吗？你还有教他的东西吗？你有多坏？每一个人支持你，和你踩着每一个人上去，是有分别的，不要将这两个概念重叠起来。你是不是觉得，学校谋一定是每一个人踩着每一个人上去呢？如果你感受到这个东西，就是你误解了我们传播的资讯。我们没让你出卖和你一起的伙伴，你收了徒弟，只是让你给他灌输你学回来的资讯，我们没让你去打人做黑社会，你灌输资讯给你徒弟，目的是提升自己，同时你要问回自己，你的徒弟是不是也会提升？他当然也会同时提升了，你没有害人啊。你千万不要给一些东西所重叠，这是你学校局要懂的，不要被重叠所迷惑了。


    社会规范是道德观念约束的，不是市场规范。举例，我们要将社会规范和市场规范分得很清楚。假设你出来工作，你的时薪是 2000 元每小时，然后你老妈叫你帮忙大扫除一会啦，你就和你老妈说，老妈，给我
    2000 元一小时吧？你老妈臭骂你一顿，死仔，和我那么计较？然后你又拿出市场理论和她说：我的工作是 2000 元一小时啊，要不打个折你给我 1500 吧，不然去请个钟点工来做更划算啊。从你老妈的角度来说，是市场规范侵犯了社会规范。她觉得你很计较钱。我不知道我猜的对不对，你学了权谋之后，你是不是觉得权谋就是把每个人都在利用对方，我不是教坏人了，其实你有吗？你想想你和社会规范对比下，你有害人吗？我们在这里，大家也作证。我们也没有叫你在老板面前打同事小报告啊？但是你可以教他招式，收他做徒弟，但是你沒有侵犯社会规范啊。所以你不要把一些东西重叠在一起。


    学员：要是一个人社会规范太差呢？


