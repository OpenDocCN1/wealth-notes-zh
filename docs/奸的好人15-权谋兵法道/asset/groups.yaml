    学员：如果我谈下去让你公司就会发现我效率高，一个顶俩，你会不会给我更高薪水？


    李老师：刚才我们给你的方向是一开三是最好的。


    学员：那你这么高水平的公司，


    李老师：你说这个就开始有这个方向了，说这么高水平的公司，这个对了。


    学员：你们这么高水平的公司，肯定是会请高水准销售主管吧？那工资肯定不会少咯？


