    3 岁我送到他去香港的一间学校，学校里的同学就跟他说做歌星好做歌星好，那么，他的兴趣就会被这群人影响了，觉得这个是我真的兴趣。所以说呢，张太炎就看得到这个人性的空隙和漏洞，他说，其实不要太注重本性，密切留意他的发展，关心和怎样用伪性来控制一个人和做一个超越性的修炼。中国清朝根据这个人的行为提出了一个教育系统分析法。

