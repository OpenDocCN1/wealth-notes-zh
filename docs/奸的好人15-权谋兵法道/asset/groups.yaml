    **学员**：关于沉默我要怎么压制表情？


    **江鹰**：我可以给你所有理论，但这个要训练的。


    **李老师**：这个是累计的。失去主控的心情是患得患失，你是那一霎，那就真的是患得患失，装不出的。


    **学员**：有些公司阶级观念重，低级总是被人踩死，有办法让人知道不能随便踩低自己吗？


    **李老师**：什么情况？


    **学员**：有时候你做什么都被鸡蛋挑骨头。


    **李老师**：两个情况，注意。人家不停挑衅你要观察，如果你的阶级是 C11、C12 那种，如果他对每个销售员鸡蛋挑骨头，他就是为人问题；但他如果只针对你，你就要对他发一次很大的火，但我叫你不是去打人啊。那个人是老板不？


    **学员**：不是，他就主管。他喜欢在人多的时候欺负我。


    **李老师**：我以前被人欺负过，我在我新小说有写《聚光灯下的小丑》。你得记得，办公窒也好，同事之间也好，你未必是最弱的，但你在被人开始欺负的时候没反抗，比你弱的人都会联手欺负你，全部人要把你变成聚光下的小丑。我被人关过厕所的，反锁在里面。


    **学员**：如果他对每个人都这样呢？


    **李老师**：做到生意咯。销售员可以嚣张的资本就是你业绩够高。我在 YSP 做到生意的时候，我是唯一一个可以坐飞机回来的员工。


    **学员**：那遇见阶级观念特别重的人怎么做？


    **李老师**：阶级观念是人的天性来的，改变不到的。


