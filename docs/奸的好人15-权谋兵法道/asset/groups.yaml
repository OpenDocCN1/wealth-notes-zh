  md: '

    # 128


    时机，就有人走过来和你说一起分这笔钱。这一招利用几个意外：第一，掉钱下来；第二，那么大一沓钱；第三，突然走出一个人和你说话；第四，还要和你分钱你不知如何是好。他们运用很多意料之外的招式。


    李：我们书里有一节“一根手指的力量”，说江先生怎样用一根手指抠到女，还有书里有一个情节，说一个女经理骂我们，然后用一根手指指着她说她像莫文蔚，这些都是属于意料之外的举动。别人指责你的时候，你不要马上上去解释，解释就等于你站在对方的对立面上。最后先有一个意料之外的打断，打断之后讲两句别的，然后再解释，这样的好过马上就解释。


    我有一个朋友是卖药的，卖心脏病药。他们公司除了一个心脏病的药，这个药是有一些副作用的，他们要去跟医生收集一些意见。有些医生是很可恶的，一直骂他们。然后他就想出一招，不用被医生骂得狗血淋头，还有机会给到医生一些解释。他这招是这样的：他一边听的时候，突然冒出一句：“你认不认识黄医生啊？”（太吵听不清楚）。一个人讲话的时候，突然被别的东西打断，你要讲回刚才的话题，你觉得容易吗？比如你说：“你认不认识陈医生啊？”对方说：“啊，什么事啊？”（再次听不清楚）。让人家恍然大悟后，重新再给对方做一个解释。


    我自己有过亲身经历。我去店面买东西，我是要赚小便宜的。我四处比较，找到足够的证据，我准备去折腾销售员。我就拿一个借口，这个借口是他迟送货过来，我小题大做，骂那个销售员，找了很多借口来骂，然后说我要取消这个订单。其实是想趁机占他们的便宜，要多点东西。那个销售员估计是不想取消，然后就来求我了。求我的时候，我就列出我的条件，要送这样、送那样，讲了一大通。然后销售员去征求经理意见，经理说：“行，我马上帮你取消订单，办理取消订单的手续。”我马上愣了。这个不是我原来的目的嘛，这简直是意料之外。我在想有什么办法可以回头呢？我怎么下台呢？对方经理又接着说：“这样，在你还没填写取消订单的手续前，希望你能让销售员解释一下情况。”我发现可以回头了，笑着说：“好好好……”然后就成交了。


    江：这种意料之外的举动，曾经有个大公司，是做心脏病的药，这个药有副作用。然后公司专门培训这种手法，来应付医生的投诉。曾经有作家写过一本书《真相》，去揭露这个公司专门用这种打太极的方法来推脱责任，从来没有真正去研究如何解决药的副作用。


    李：书里的内容是用来攻击那个公司的，说那个公司用很无耻的手段来推脱。但是我们看得很开心。


    江：李老师以前有一个女朋友，那个女朋友和公司的经理好上了，然后抛弃了李老师。李老师心情不好的时候，就找他的师傅老吴倾诉。老吴说：“你是不是真的要追回她？如果你真的要追回她的话，我就替你想尽办法，把她追回来为止。”每次说到“是不是真要追回她”这几个字的时候，就做了一个停顿，他看着李老师，然后接着说：“如果我们想尽办法还是追不回呢，我就带你去叫鸡，找一个像她那样的鸡。”之前讲“想尽办法追回她”的都是意料之内的，后面讲那句“如果追不回呢，就带你去叫鸡，找一个像她那样的”，是意料之外的话，让李老师整个人都开心起来。这是一个非常经典的勾魂。


    李：老吴带我去看他怎么做生意，和我说他想了一个方法，可以化解客户认为产品很贵的看法。他即使骂粗口骂客户，客户也会接受，接着不会说他的产品贵。当别人说他供应的产品贵的时候，他就和对方说：“老板，之前你卖的那个东西多少钱啊？”对方说
    2000 块。老吴就看着我，对我说：“真是傻瓜来的，是我标价，我就标 5000 啦！”注意，他是看着我，对我说，不是看着客户说。那个客户当时就傻了，居然有人说他是傻瓜，马上生气，对老吴说：“你傻啦？说
    5000 就 5000，没有定价的吗？2000 块的东西，标到 5000 块，隔壁那家才卖 2000 块，我还用做生意吗？”老吴很冷静地看着老板说：“老板，你已经将我要解释给你听的话说出来了，你认为我们供应商的价格那么高是乱标的吗？刚才你不是将我的立场讲出来了吗？”那个老板顿时愣了。这个就是意料之外的一个手法了。


    江：你们要注意，他骂对方是傻瓜的时候，不是看着对方骂，是看着李老师骂。如果看着对方骂，真的是要打架啦。老吴的这个架构确实不容易学的。他勾魂的架构，我也不知道怎么教，我们给它起了个名字，叫“开悟”。但是这个方法是不容易做到的。他最后的那个东西一讲出来，令你有一种恍然大悟的感觉，整个效果就不一样。


    李：我们事后分析，老吴带上我去，因为之前和客户介绍过我是写《勾魂夺心洗脑》的作者，我在客户的心目中有着一点点地位，也算半个名人。换句话说，客户要突然暴跳如雷，也不是那么容易。起码在名人面前要有点面子，顾及一下形象。可能有各种因素，这是其中一个计算好的情境，我们不知道如果是你自己一个人去骂，会有怎样的效果。但是他的架构就是用意料之外、别人想不到的东西，去达到这个勾魂的力量。


    江：有一种病症是无端端会歇斯底里讲脏话的。我们有过一个学员，上课上到一半的时候，就会突然歇斯底里，就是一种精神病。有时候会突然骂：“日你老母。”那时候我们自己也能量最低点。上课的时候，他就突然发作。我就让他如果新认识朋友的话，就直接盗雷，和别人说他有一种症状，这样交朋友的时候不会那么吓人。有次上课的时候，我让他这样先盗雷说自己有这样的症状，但是他没有说。还好上课的时候他没有发作，我们也害怕啊。所以这种也是一种意料之外。


    另外还有一个技巧叫做迷惘。比如你和对方说一些东西，对方不明白的时候，你就告诉他：“其实你已经明白了，只不过你不知道你自己明白而已。”又或者对方已经明白的时候，你和他设：“你以为你已经明白了，其实你是不明白的。”总之就是让对方摸不着头脑，迷惘。这样的好处是对方的头脑暂时地打开，没有方向感，这样你才有办法去继续引导他。


    有次李老师见到一个 ISO 顾问，那个顾问不停地推销他自己，李老师就对他使用迷惘这招。


    李：这个人用一些包装手法显示自己。他不久就从他包里拿出来一些东西，说：“这个是我送给我太太的戒指。”其实你都不知道我是否喜欢戒指钻石之类的东西。他就讲这些给我听，暗示他的事业成就很好，他是用钱来包装的。


    如果一个人要包装，包装是要制造话题的。其中一个方法是，如果你的小孩子有照片，你可以拿出来给人家分享。但是注意一个前提：如果对方没有小孩，那么对方是不会情绪反应的；如果对方刚好有小孩子，你拿照片出来跟对方分析，那么就很容易拉近双方的距离。当时那个人说他买钻石给太太之类的，我的感觉不是很大，我只知道他在做包装而已，表示他很有钱。


    他在销售他的课程，即将要成交的时候呢，他是不去我的公司谈的。他找一个借口，说他有一些星巴克优惠券，他请我去星巴克，然后谈完最后的那些东西。我心想，好啊，反正有免费吃喝，不吃白不吃。于是就答应他，一起去星巴克。他帮我点完了东西，点完东西之后继续巴拉巴拉谈后续的业务了，他开始解释他的价格以及一些东西。


    然后我就突然问他：“你知不知道我们现在在哪里？”你们假设，我们现在在教室，我突然问你：“你知不知道我们现在在哪里？”我突然问你这句话，你心里会想：这样问不会那么简单的，究竟他想干嘛呢？然后那个顾问很迷茫回答我说：“在星巴克。”我说：“是在星巴克没错。”他说：“哦。”我说：“在普通茶餐厅，我们喝一杯咖啡是
    1 元钱，而在星巴克我们喝一杯是 10 元。我们做工厂的就好像在茶餐厅卖 1 元的咖啡，你们做顾问的就像在星巴克卖 10 元的咖啡。”然后我就一路吹捧他，说他做顾问多赚钱多赚钱，我一直把他推上神台。我勾了魂之后，让他迷愣住了，再把他推上神台，把他捧到了很高。他就和我说了一句话：“其实你有所不知啊，做
    ISO 的讲师其实市场上有很多，有 2000 多位。”


    我一听，有两千多个，我头脑中第一时间出现的资讯是：我要继续比较价钱咯。意思是市场上他那样的专家多的是，那我要慢慢挑咯。当时，他还拿出一些东西告诉我，他有兼职做其他的工作。这表示什么？表示他做
    ISO 的讲师不是那么好赚，要做其他的工作补贴家用。对一个懂得谈判的人来说表示什么？表示低价值咯。他的行为体现出是他需要我，而不是我需要他。


    江：有时候你见一些老板，你不断地吹捧他几次，捧到他不好意思了，他会把一些真实的东西讲出来。像刚才李老师讲的顾问，他很刻意去包装自己。如果只是捧他呢，这样的效果没那么明显。那就要先让他迷愣，勾了魂能量最低点的时候，再吹捧他，越吹越高，让他在神台上面。他摔下来的时候，神像里面装些什么东西你都可以看清楚。


    如果一个专家说他又做这行又做那行，如果你包装自己是一个专家的，你告诉别人你还兼职做其他行业，其实对你来说是一种打击。


    李：一个人被别人吹捧这样好那样好的时候，一般的反应都是谦虚的说“没有啦，其实也没那么好啦”。当他谦虚的时候，还有多说一样东西出来，来支持他这个谦虚。他会机械式反应讲一些他痛苦的东西出来。


    举个例子：有一个讲师很久没出来做公开课程了，我很久没联系他了，我就打个电话和他沟通一下。沟通的时候，就用吹捧的手法说他的课程效果如何好，别人的评价多棒之类的。不断捧他的时候，他就和我说：“我都很久没有出来做公开课程了，市场上很多人都做这个课程，A
    先生也是这么做，B 先生也是这么做，做烂了。我想做和别人不一样的东西。”我是这样分析他的话的：做讲师满街人都是啦，我自己也做啦，别人做他不做表示什么，表示他被市场上的竞争给淘汰了。然后他还说：“广告费太贵，而且来说明会的人不多。”我就是用吹捧这个手法，让他自己讲出了一大堆真相的资讯。


    江：我们书里说过，有人吹捧你，你就要夸张式的接受它。但是如果是一个和你不熟的人吹捧你，你就不用这么做，你就说是啊是啊就行了。如果是一大帮朋友在你身边，或者是见一些客户的时候，有人突然吹捧你，你才要夸张式的接受。当然不需要每一次都要夸张式接受，要看情况来。


    勾魂目前就是运用我们归纳出来的四种方法。大家要记住，勾魂的时间持续是非常短暂的，最多几秒钟到十几秒钟，不会很长时间的能量最低点。有一些老千集团，令人能量最低点时间延长的原因不是他只勾魂一次，他是勾魂很多次。通常那些老千不是一个人出手，而是几个人，一个讲一句七嘴八舌的，就让人能量最低点的时间拉长了。如果勾了魂，什么都不做，那最后的结果是那个人会清醒，醒了之后就没效果了。


    我们打开 12 页做一个功课。如果你刚刚认识一个女孩没多久，令她笑，然后突然对她说：“其实你这个人也挺奇怪的。”这个的目的是什么呢？就是勾魂咯，制造好奇。下一句：“我不是想说，我只是不清楚你是不是那种真的想了解自己的人？”这个目的是什么？是格局来的。对方要向我证明她是想了解自己的人。再下一句：“我可以告诉你的，不过今天没时间，因为我一讲给你听的话，你会有很多话和我说，同时有很多东西要问我。”这个目的是好奇咯。“不如这样咯，在某个地方有间咖啡馆，很多人去的，不过我今天没有空，就只有礼拜六和礼拜天有空。”这种就是简单的二选一。大家留意一下，“某个地方有间咖啡馆很多人去的”表示我不是专门要和你说这个东西而约你出来，而是我本身就要去那个地方的，你有兴趣得空就过来一下，大家聊聊天，就表示不是那么迫切的需要。


    凡是要搞勾魂，要和昨天讲的哪一个性格来配合的？勾魂的成功和哪一个性格比较相应？狂！


    学员：我想问浪漫废话怎样做到问的时候像没有问一样？有没有架构？问了之后让对方觉得你很有见地。


    江：除非有一些例子，不然让我凭空给你想一个出来我现在没办法做到。


    学员：能不能让对方一直说 YES，比如你销售的时候，让对方不断的认同你？


    江：可以，但是这种 YES 是很机械式的。不是让他明白一样东西或者对一样东西有觉悟的那种 YES。问这种问题要小心，这种问法通常是问一些问题封锁住你，不让你说
    NO。你被人这样问多几次之后，你是很烦的，所以要小心。比如做传销的经常说，假如有个商机让你发财的，你想不想花少点时间了解呢？类似这种问题，你如果回答 NO
    的话，就好像显得很笨。


    李：比如做保险的也是，设计一系列的问题，你退休之后是不是想有一笔钱？这一系列的问题设计出来都让你回答 YES 的。比如在我们马来西亚，传销和保险盛行的地方，你一问这种问题，别人全身的防御系统都会警惕。所以我教传销商，约人的时候，不要那么猥琐。如果要说，就大方一点，比如讲：“陈先生，我说一个好消息和一个坏消息给你听，坏消息就是我加入了传销公司，好消息是你放心，我不会推荐你加入我的传销公司。”那你如何接下去，如何让他加入呢？我暂时还没仔细想到，因为我没做传销嘛。起码你想这个开场白好过“我告诉你一个
    XX 商机”。既然你知道大家都避不开这个免疫系统的，你就要改变方法咯。将这个东西颠覆，将大家的规矩打破。


    江：有些做保险的学员和我说，和客户谈的时候，对方已经很认同他的产品了很有兴趣了，反应非常之好，但是最后还是没没有买。我问他你怎么知道对方的反应好？他说对方很认同嘛。我问他你怎么知道他认同，他说不出一个所以然。问了好久，他才说他用这种封闭型式的问题来问对方，比如：“你是做老爸的，做老爸的一定是爱孩子了，是不是？爱小孩就要保护他了，是吧？保护他一定要保障的啦，是吗？”所以，这种不叫问问题，这是对方逼不得已，很不爽的情况下回答，他等着去反驳你。之前我有个女朋友是做保险的，当她听到别人用这些招式的时候，她就说：“你有什么东西卖就赶快卖给我，别当我是傻的。”用这种封锁问题方法就一定要小心了。


    李：如果你遇到一个中产阶级，有子女的，你可以用一些颠覆性的开场白。“你觉得一个人在香港要养到五个人容易吗？”不容易是吧？“五个人养一个人容易吗？”容易很多是吧？但是我告诉你，那是错的。这个就是一个颠覆咯。怎么会错呢？你看一下，做爸爸妈妈的要养五个子女，不那么容易了，辛辛苦苦为子女付出。但是当子女长大有了自己的生活，他们挣了钱，让他们把钱拿出来养父女，并不那么容易。这不就是颠覆的一个对白咯。


    当然你不要和那些刚出社会的年轻人说，那些人不中招的嘛，那些人没有这种感受嘛。所以你要出一招那些人有过这种感受的。虽然你未必设计得好，起码你用这个手法，获得一个机会。不要一直用讲
    YES 的方法。


    江：对于勾魂还有其他问题吗？没问题我们就看 17 页，关于夺心的问题。夺心最重要就是制造权威，夺心需要你们花很多时间去准备。勾魂你花一点时间去试验，但是时间不会太长，你很快就发现这句可以做，那句不能做。勾的时候能量最低点也是很短的，勾了之后你就要夺心。夺心是你需要花很多时间去收集资讯，铺排，产品知识等等。这部分是要花最长时间的。目的就是让你变成权威。


    # 129


    李：我们书里讲过，你至少把自己定位成三个领域的专家。一个是你自己行业里面的；第二是娱乐性的，娱乐性就是吃喝玩乐那些。娱乐性的通常有两个方向可以制造出你比较有品位的：吃和喝。会吃的话，让人错觉你很会享受人生，让人觉得你很有品位。接着你的兴趣要特别，兴趣特别，会令人觉得你有深度。比如江先生对神秘学、宗教等研究是很深入的，很专家，可能比一些所谓的上师研究还要深入，这就是他的兴趣咯。


    江：你制造这三个层次有少矛盾或者冲突，就令人对你的好奇程度很强。你塑造你人格上的层次感，本身也可以变成一种勾魂。像书里说，一个贵妃是学泰拳的，很心狠手辣的，我们会很好奇。


    李：刚才我灵光一闪想到李天鸣。大家都知道李天鸣是谁，在香港他是教思考方法的。昨天我听说他去参加神坛的活动，如果李天鸣能够成功的包装到他走道教之路，他可以令到一大帮人迷信道教。你会想一个思考方法的专家，那么相信道教，经过他的过滤和审核之后，道教是不是很可信？这个会令人产生一种错觉，强烈的对比：一个思考方法专家居然相信道教，很强烈的对比。他敢公开他的个人神秘经验，比我们要做行销包装还厉害。


    江：这些人格上的层次包装要慢慢玩。但是，比如你的样子看起来很乖，你去刻意找一些很相反的东西，那些东西又不是你喜欢的，那你就没有这个必要。你要找回自己那个兴趣，尝试用这个兴趣和你的性格做对比。不一定是整个人来对比，和某一个人格做对比就可以。


    李：大家要记住一样东西，权威者的心态。无论怎么都好，我都是对的；我永远知道自己在讲什么；我更加知道你们讲些什么，在我的领域。你从理性来分析，有没有一个人永远是对的呢？但是技巧可以帮助你做到永远是对的。如果对方觉得我说错，我都有办法让对方知道，我不是说错，我只不过是没讲清楚而已。这些全部都可以用千降问屈术做到的。


    江：你要做一个专家，你一定要下功夫的。你学一些阴阳二分法你可以扮一个假专家，但是假专家只是开头而已。你开头吸引到人，那些人好奇，一定会追问下去。追问下去，你没东西讲，这就叫行骗不遂。对方就会说你没本事。有的人很刻意的包装自己的本事，但是最后什么都做不成。


    李先生有个朋友，李先生要买大房子的时候，那个朋友教他这样那样一大堆东西，说得天花乱坠，但是一问到关键性的问题，就发觉他在讲浪漫废话。开头好，但是接不到尾巴。


    李：他一开始说一些新的资讯给我听，说现在有一种新技术，不用砌砖，直接整块钢板放下去如何如何，我从来没听过觉得很新鲜。他之前是做有一些包装的，一路讲下来，不时地补充一些新的资讯给我听。我当时就问他一个问题：“买地起房子需要一些什么样的要求？”他就跟我说
    ABCDE 一大堆长篇大论出来。


    从这个人那里了解到资讯之后，我又咨询了一个小型地产商，买地起房子需要什么条件。那个人的回答没那么多花俏的东西，很简单的说，要看你买在什么地方，多少钱，一平方尺
    140-180 唧（货币单位），还要看你用什么材料。我后面又问了另一个地产商，他的回答和之前的小型地产商回答是一样的。将这些资讯一对比，就可以发现最早那个说得天花乱坠的家伙，只是把听回来的资讯转述给你而已，他把别人的故事变成他自己的故事而已。其实已经资讯不对稱了，为什么地产商知道一平方尺价格是多少，而他不知道呢？那家伙讲一大堆新理论出来，连最基本的一平方尺多少钱都不懂。我们从基本功的角度看，他练基本功都没打好。他讲的全部是阁楼上的东西，没讲基础的东西。我一听就知道这个是不是我需要的，资讯好像很多，但是不是我需要的。


    江：那个朋友讲一句浪漫废话“起房子，最重要的是知道自己要什么”。其实在任何领域，我听到别人说“最重要要知道自己要什么”，其实我会怀疑的，所以这种废话以后要少说点了。


    你要成为专家，我们给一个方向给大家：人无我有，人有我优，依次类推。


    李：举个例子，市场上每个人都讲蓝海策略，你可以略为涉足。如果你想走捷径，就要问一些专家，蓝海策略是什么啦。假设我想知道少少许秘学，我直接问江先生，那就够了，我可以拿到我想要的资料。江先生知道那些不是畅销资料，是很冷门的，你不需要动脑，你问他就可了。


    人家没有的东西你要有。你要多看些冷门书，如果你一开始喜欢权谋，什么权谋书你都要买来看，看到好的介绍给我们就行了，我们可以节省很多时间。买错买对都不重要，你可以从错的里面发现什么是对的，知道哪些是好的，哪些是有实力的，尽量多看冷门书。


    江：有些人不知道到底哪些是冷门书。很简单，畅销书大部分不是冷门的，其他边缘的书要越看越多。每一个领域，你看得多才能知道什么是冷门，你看得不够多，很难知道是不是冷门。任何和社会规范走相反路线的，很大可能就是冷门，你可以从这里入手。我见到冷门书不管三七二十一，先买回去再说，因为冷门书大多不畅销，可能过一段时间就绝版了。


    我收藏那些冷门书其中一本是讲强奸的，是一些学术数据来的，它不是教你如何去强奸，它只是研究一些数据之类的。有人肯写，能出版，我就愿意去买。


    李：香港一个很大的书商说过：“我不出版违反道德的书。”其实这个观点在出版界来说是错误的。资讯是不分好坏的，你们想想，一个强奸犯能够写出如何强奸，一个性骚扰专家能够写出如何性骚扰，头脑别那么死板，你只想到坏人能看这些吗？好人为什么不能看呢？好人看了可以防备啊。外国要比这里开放，江先生有买到教藏毒的
    VCD。


    江：美国可以找到一些很奇怪的书。我们的书进入香港的时候，有个出版社说我们的书太过负面，出版的话妇女或者公众人士会去示威，对公司的影响不太好。我心想，他妈的！香港这边的文化届比我想象中保守。


    美国有本书是教人如何转换身份的，这本书在美国一些州是不合法的，教人去医院找死亡证书，再去一些部门注册死亡，然后再如何申请一个新的身份证，换一个身份。


    李：大陆出的书现在很大胆，还大胆过台湾。


    江：还有那个藏毒的 DVD，是一个前警察教的，说如何才能检查你的车，如何逃避检查之类的。我为什么要收藏这些 DVD？我觉得过瘾咯。还有教人如何做扒手的。


    李：你收集到这些资讯，你出去聊天，是一个很好的话题来的。


    江：还有一本书，是女同性恋者写给男人看的，如何取悦你的女人。之前还有一本男同性恋者写给女人看的，教女人如何取悦男人。我一看书名，那么吸引人，买回去咯。谁知道买回去一看，那些招式是废话来的。他的写法和包装是跟社会规范抵触的，我会尽量去收藏。这些我不会深入，我能收藏就够了。要深入那些，是属于发烧友那些。比如一个人喜欢静坐的，他收藏二三十本静坐的书都不奇怪。不同的作家，对一个论点会有不同的角度，这样看下去会深入一些。


    李：同一样东西，你要收集足够多的资讯，才能讲出不同的变化。


    江：一个是宽一个是深，当你够深的时候，才能成为专家。我们认识的博学和尚，看的书是很宽的，又够博又够深。他叫李老师去台湾找的一些书，李老师都没听说过。之前他不看龙应台的，后面听李老师介绍，连龙应台初

    '
  mdcn: '

    # 128


    时机，就有人走过来和你说一起分这笔钱。这一招利用几个意外：第一，掉钱下来；第二，那么大一沓钱；第三，突然走出一个人和你说话；第四，还要和你分钱你不知如何是好。他们运用很多意料之外的招式。


    李：我们书里有一节“一根手指的力量”，说江先生怎样用一根手指抠到女，还有书里有一个情节，说一个女经理骂我们，然后用一根手指指着她说她像莫文蔚，这些都是属于意料之外的举动。别人指责你的时候，你不要马上上去解释，解释就等于你站在对方的对立面上。最后先有一个意料之外的打断，打断之后讲两句别的，然后再解释，这样的好过马上就解释。


    我有一个朋友是卖药的，卖心脏病药。他们公司除了一个心脏病的药，这个药是有一些副作用的，他们要去跟医生收集一些意见。有些医生是很可恶的，一直骂他们。然后他就想出一招，不用被医生骂得狗血淋头，还有机会给到医生一些解释。他这招是这样的：他一边听的时候，突然冒出一句：“你认不认识黄医生啊？”（太吵听不清楚）。一个人讲话的时候，突然被别的东西打断，你要讲回刚才的话题，你觉得容易吗？比如你说：“你认不认识陈医生啊？”对方说：“啊，什么事啊？”（再次听不清楚）。让人家恍然大悟后，重新再给对方做一个解释。


    我自己有过亲身经历。我去店面买东西，我是要赚小便宜的。我四处比较，找到足够的证据，我准备去折腾销售员。我就拿一个借口，这个借口是他迟送货过来，我小题大做，骂那个销售员，找了很多借口来骂，然后说我要取消这个订单。其实是想趁机占他们的便宜，要多点东西。那个销售员估计是不想取消，然后就来求我了。求我的时候，我就列出我的条件，要送这样、送那样，讲了一大通。然后销售员去征求经理意见，经理说：“行，我马上帮你取消订单，办理取消订单的手续。”我马上愣了。这个不是我原来的目的嘛，这简直是意料之外。我在想有什么办法可以回头呢？我怎么下台呢？对方经理又接着说：“这样，在你还没填写取消订单的手续前，希望你能让销售员解释一下情况。”我发现可以回头了，笑着说：“好好好……”然后就成交了。


    江：这种意料之外的举动，曾经有个大公司，是做心脏病的药，这个药有副作用。然后公司专门培训这种手法，来应付医生的投诉。曾经有作家写过一本书《真相》，去揭露这个公司专门用这种打太极的方法来推脱责任，从来没有真正去研究如何解决药的副作用。


    李：书里的内容是用来攻击那个公司的，说那个公司用很无耻的手段来推脱。但是我们看得很开心。


    江：李老师以前有一个女朋友，那个女朋友和公司的经理好上了，然后抛弃了李老师。李老师心情不好的时候，就找他的师傅老吴倾诉。老吴说：“你是不是真的要追回她？如果你真的要追回她的话，我就替你想尽办法，把她追回来为止。”每次说到“是不是真要追回她”这几个字的时候，就做了一个停顿，他看着李老师，然后接着说：“如果我们想尽办法还是追不回呢，我就带你去叫鸡，找一个像她那样的鸡。”之前讲“想尽办法追回她”的都是意料之内的，后面讲那句“如果追不回呢，就带你去叫鸡，找一个像她那样的”，是意料之外的话，让李老师整个人都开心起来。这是一个非常经典的勾魂。


    李：老吴带我去看他怎么做生意，和我说他想了一个方法，可以化解客户认为产品很贵的看法。他即使骂粗口骂客户，客户也会接受，接着不会说他的产品贵。当别人说他供应的产品贵的时候，他就和对方说：“老板，之前你卖的那个东西多少钱啊？”对方说
    2000 块。老吴就看着我，对我说：“真是傻瓜来的，是我标价，我就标 5000 啦！”注意，他是看着我，对我说，不是看着客户说。那个客户当时就傻了，居然有人说他是傻瓜，马上生气，对老吴说：“你傻啦？说
    5000 就 5000，没有定价的吗？2000 块的东西，标到 5000 块，隔壁那家才卖 2000 块，我还用做生意吗？”老吴很冷静地看着老板说：“老板，你已经将我要解释给你听的话说出来了，你认为我们供应商的价格那么高是乱标的吗？刚才你不是将我的立场讲出来了吗？”那个老板顿时愣了。这个就是意料之外的一个手法了。


    江：你们要注意，他骂对方是傻瓜的时候，不是看着对方骂，是看着李老师骂。如果看着对方骂，真的是要打架啦。老吴的这个架构确实不容易学的。他勾魂的架构，我也不知道怎么教，我们给它起了个名字，叫“开悟”。但是这个方法是不容易做到的。他最后的那个东西一讲出来，令你有一种恍然大悟的感觉，整个效果就不一样。


    李：我们事后分析，老吴带上我去，因为之前和客户介绍过我是写《勾魂夺心洗脑》的作者，我在客户的心目中有着一点点地位，也算半个名人。换句话说，客户要突然暴跳如雷，也不是那么容易。起码在名人面前要有点面子，顾及一下形象。可能有各种因素，这是其中一个计算好的情境，我们不知道如果是你自己一个人去骂，会有怎样的效果。但是他的架构就是用意料之外、别人想不到的东西，去达到这个勾魂的力量。


    江：有一种病症是无端端会歇斯底里讲脏话的。我们有过一个学员，上课上到一半的时候，就会突然歇斯底里，就是一种精神病。有时候会突然骂：“日你老母。”那时候我们自己也能量最低点。上课的时候，他就突然发作。我就让他如果新认识朋友的话，就直接盗雷，和别人说他有一种症状，这样交朋友的时候不会那么吓人。有次上课的时候，我让他这样先盗雷说自己有这样的症状，但是他没有说。还好上课的时候他没有发作，我们也害怕啊。所以这种也是一种意料之外。


    另外还有一个技巧叫做迷惘。比如你和对方说一些东西，对方不明白的时候，你就告诉他：“其实你已经明白了，只不过你不知道你自己明白而已。”又或者对方已经明白的时候，你和他设：“你以为你已经明白了，其实你是不明白的。”总之就是让对方摸不着头脑，迷惘。这样的好处是对方的头脑暂时地打开，没有方向感，这样你才有办法去继续引导他。


    有次李老师见到一个 ISO 顾问，那个顾问不停地推销他自己，李老师就对他使用迷惘这招。


    李：这个人用一些包装手法显示自己。他不久就从他包里拿出来一些东西，说：“这个是我送给我太太的戒指。”其实你都不知道我是否喜欢戒指钻石之类的东西。他就讲这些给我听，暗示他的事业成就很好，他是用钱来包装的。


    如果一个人要包装，包装是要制造话题的。其中一个方法是，如果你的小孩子有照片，你可以拿出来给人家分享。但是注意一个前提：如果对方没有小孩，那么对方是不会情绪反应的；如果对方刚好有小孩子，你拿照片出来跟对方分析，那么就很容易拉近双方的距离。当时那个人说他买钻石给太太之类的，我的感觉不是很大，我只知道他在做包装而已，表示他很有钱。


    他在销售他的课程，即将要成交的时候呢，他是不去我的公司谈的。他找一个借口，说他有一些星巴克优惠券，他请我去星巴克，然后谈完最后的那些东西。我心想，好啊，反正有免费吃喝，不吃白不吃。于是就答应他，一起去星巴克。他帮我点完了东西，点完东西之后继续巴拉巴拉谈后续的业务了，他开始解释他的价格以及一些东西。


    然后我就突然问他：“你知不知道我们现在在哪里？”你们假设，我们现在在教室，我突然问你：“你知不知道我们现在在哪里？”我突然问你这句话，你心里会想：这样问不会那么简单的，究竟他想干嘛呢？然后那个顾问很迷茫回答我说：“在星巴克。”我说：“是在星巴克没错。”他说：“哦。”我说：“在普通茶餐厅，我们喝一杯咖啡是
    1 元钱，而在星巴克我们喝一杯是 10 元。我们做工厂的就好像在茶餐厅卖 1 元的咖啡，你们做顾问的就像在星巴克卖 10 元的咖啡。”然后我就一路吹捧他，说他做顾问多赚钱多赚钱，我一直把他推上神台。我勾了魂之后，让他迷愣住了，再把他推上神台，把他捧到了很高。他就和我说了一句话：“其实你有所不知啊，做
    ISO 的讲师其实市场上有很多，有 2000 多位。”


    我一听，有两千多个，我头脑中第一时间出现的资讯是：我要继续比较价钱咯。意思是市场上他那样的专家多的是，那我要慢慢挑咯。当时，他还拿出一些东西告诉我，他有兼职做其他的工作。这表示什么？表示他做
    ISO 的讲师不是那么好赚，要做其他的工作补贴家用。对一个懂得谈判的人来说表示什么？表示低价值咯。他的行为体现出是他需要我，而不是我需要他。


    江：有时候你见一些老板，你不断地吹捧他几次，捧到他不好意思了，他会把一些真实的东西讲出来。像刚才李老师讲的顾问，他很刻意去包装自己。如果只是捧他呢，这样的效果没那么明显。那就要先让他迷愣，勾了魂能量最低点的时候，再吹捧他，越吹越高，让他在神台上面。他摔下来的时候，神像里面装些什么东西你都可以看清楚。


    如果一个专家说他又做这行又做那行，如果你包装自己是一个专家的，你告诉别人你还兼职做其他行业，其实对你来说是一种打击。


    李：一个人被别人吹捧这样好那样好的时候，一般的反应都是谦虚的说“没有啦，其实也没那么好啦”。当他谦虚的时候，还有多说一样东西出来，来支持他这个谦虚。他会机械式反应讲一些他痛苦的东西出来。


    举个例子：有一个讲师很久没出来做公开课程了，我很久没联系他了，我就打个电话和他沟通一下。沟通的时候，就用吹捧的手法说他的课程效果如何好，别人的评价多棒之类的。不断捧他的时候，他就和我说：“我都很久没有出来做公开课程了，市场上很多人都做这个课程，A
    先生也是这么做，B 先生也是这么做，做烂了。我想做和别人不一样的东西。”我是这样分析他的话的：做讲师满街人都是啦，我自己也做啦，别人做他不做表示什么，表示他被市场上的竞争给淘汰了。然后他还说：“广告费太贵，而且来说明会的人不多。”我就是用吹捧这个手法，让他自己讲出了一大堆真相的资讯。


    江：我们书里说过，有人吹捧你，你就要夸张式的接受它。但是如果是一个和你不熟的人吹捧你，你就不用这么做，你就说是啊是啊就行了。如果是一大帮朋友在你身边，或者是见一些客户的时候，有人突然吹捧你，你才要夸张式的接受。当然不需要每一次都要夸张式接受，要看情况来。


    勾魂目前就是运用我们归纳出来的四种方法。大家要记住，勾魂的时间持续是非常短暂的，最多几秒钟到十几秒钟，不会很长时间的能量最低点。有一些老千集团，令人能量最低点时间延长的原因不是他只勾魂一次，他是勾魂很多次。通常那些老千不是一个人出手，而是几个人，一个讲一句七嘴八舌的，就让人能量最低点的时间拉长了。如果勾了魂，什么都不做，那最后的结果是那个人会清醒，醒了之后就没效果了。


    我们打开 12 页做一个功课。如果你刚刚认识一个女孩没多久，令她笑，然后突然对她说：“其实你这个人也挺奇怪的。”这个的目的是什么呢？就是勾魂咯，制造好奇。下一句：“我不是想说，我只是不清楚你是不是那种真的想了解自己的人？”这个目的是什么？是格局来的。对方要向我证明她是想了解自己的人。再下一句：“我可以告诉你的，不过今天没时间，因为我一讲给你听的话，你会有很多话和我说，同时有很多东西要问我。”这个目的是好奇咯。“不如这样咯，在某个地方有间咖啡馆，很多人去的，不过我今天没有空，就只有礼拜六和礼拜天有空。”这种就是简单的二选一。大家留意一下，“某个地方有间咖啡馆很多人去的”表示我不是专门要和你说这个东西而约你出来，而是我本身就要去那个地方的，你有兴趣得空就过来一下，大家聊聊天，就表示不是那么迫切的需要。


    凡是要搞勾魂，要和昨天讲的哪一个性格来配合的？勾魂的成功和哪一个性格比较相应？狂！


    学员：我想问浪漫废话怎样做到问的时候像没有问一样？有没有架构？问了之后让对方觉得你很有见地。


    江：除非有一些例子，不然让我凭空给你想一个出来我现在没办法做到。


    学员：能不能让对方一直说 YES，比如你销售的时候，让对方不断的认同你？


    江：可以，但是这种 YES 是很机械式的。不是让他明白一样东西或者对一样东西有觉悟的那种 YES。问这种问题要小心，这种问法通常是问一些问题封锁住你，不让你说
    NO。你被人这样问多几次之后，你是很烦的，所以要小心。比如做传销的经常说，假如有个商机让你发财的，你想不想花少点时间了解呢？类似这种问题，你如果回答 NO
    的话，就好像显得很笨。


    李：比如做保险的也是，设计一系列的问题，你退休之后是不是想有一笔钱？这一系列的问题设计出来都让你回答 YES 的。比如在我们马来西亚，传销和保险盛行的地方，你一问这种问题，别人全身的防御系统都会警惕。所以我教传销商，约人的时候，不要那么猥琐。如果要说，就大方一点，比如讲：“陈先生，我说一个好消息和一个坏消息给你听，坏消息就是我加入了传销公司，好消息是你放心，我不会推荐你加入我的传销公司。”那你如何接下去，如何让他加入呢？我暂时还没仔细想到，因为我没做传销嘛。起码你想这个开场白好过“我告诉你一个
    XX 商机”。既然你知道大家都避不开这个免疫系统的，你就要改变方法咯。将这个东西颠覆，将大家的规矩打破。


    江：有些做保险的学员和我说，和客户谈的时候，对方已经很认同他的产品了很有兴趣了，反应非常之好，但是最后还是没没有买。我问他你怎么知道对方的反应好？他说对方很认同嘛。我问他你怎么知道他认同，他说不出一个所以然。问了好久，他才说他用这种封闭型式的问题来问对方，比如：“你是做老爸的，做老爸的一定是爱孩子了，是不是？爱小孩就要保护他了，是吧？保护他一定要保障的啦，是吗？”所以，这种不叫问问题，这是对方逼不得已，很不爽的情况下回答，他等着去反驳你。之前我有个女朋友是做保险的，当她听到别人用这些招式的时候，她就说：“你有什么东西卖就赶快卖给我，别当我是傻的。”用这种封锁问题方法就一定要小心了。


    李：如果你遇到一个中产阶级，有子女的，你可以用一些颠覆性的开场白。“你觉得一个人在香港要养到五个人容易吗？”不容易是吧？“五个人养一个人容易吗？”容易很多是吧？但是我告诉你，那是错的。这个就是一个颠覆咯。怎么会错呢？你看一下，做爸爸妈妈的要养五个子女，不那么容易了，辛辛苦苦为子女付出。但是当子女长大有了自己的生活，他们挣了钱，让他们把钱拿出来养父女，并不那么容易。这不就是颠覆的一个对白咯。


    当然你不要和那些刚出社会的年轻人说，那些人不中招的嘛，那些人没有这种感受嘛。所以你要出一招那些人有过这种感受的。虽然你未必设计得好，起码你用这个手法，获得一个机会。不要一直用讲
    YES 的方法。


    江：对于勾魂还有其他问题吗？没问题我们就看 17 页，关于夺心的问题。夺心最重要就是制造权威，夺心需要你们花很多时间去准备。勾魂你花一点时间去试验，但是时间不会太长，你很快就发现这句可以做，那句不能做。勾的时候能量最低点也是很短的，勾了之后你就要夺心。夺心是你需要花很多时间去收集资讯，铺排，产品知识等等。这部分是要花最长时间的。目的就是让你变成权威。


    # 129


    李：我们书里讲过，你至少把自己定位成三个领域的专家。一个是你自己行业里面的；第二是娱乐性的，娱乐性就是吃喝玩乐那些。娱乐性的通常有两个方向可以制造出你比较有品位的：吃和喝。会吃的话，让人错觉你很会享受人生，让人觉得你很有品位。接着你的兴趣要特别，兴趣特别，会令人觉得你有深度。比如江先生对神秘学、宗教等研究是很深入的，很专家，可能比一些所谓的上师研究还要深入，这就是他的兴趣咯。


    江：你制造这三个层次有少矛盾或者冲突，就令人对你的好奇程度很强。你塑造你人格上的层次感，本身也可以变成一种勾魂。像书里说，一个贵妃是学泰拳的，很心狠手辣的，我们会很好奇。


    李：刚才我灵光一闪想到李天鸣。大家都知道李天鸣是谁，在香港他是教思考方法的。昨天我听说他去参加神坛的活动，如果李天鸣能够成功的包装到他走道教之路，他可以令到一大帮人迷信道教。你会想一个思考方法的专家，那么相信道教，经过他的过滤和审核之后，道教是不是很可信？这个会令人产生一种错觉，强烈的对比：一个思考方法专家居然相信道教，很强烈的对比。他敢公开他的个人神秘经验，比我们要做行销包装还厉害。


    江：这些人格上的层次包装要慢慢玩。但是，比如你的样子看起来很乖，你去刻意找一些很相反的东西，那些东西又不是你喜欢的，那你就没有这个必要。你要找回自己那个兴趣，尝试用这个兴趣和你的性格做对比。不一定是整个人来对比，和某一个人格做对比就可以。


    李：大家要记住一样东西，权威者的心态。无论怎么都好，我都是对的；我永远知道自己在讲什么；我更加知道你们讲些什么，在我的领域。你从理性来分析，有没有一个人永远是对的呢？但是技巧可以帮助你做到永远是对的。如果对方觉得我说错，我都有办法让对方知道，我不是说错，我只不过是没讲清楚而已。这些全部都可以用千降问屈术做到的。


    江：你要做一个专家，你一定要下功夫的。你学一些阴阳二分法你可以扮一个假专家，但是假专家只是开头而已。你开头吸引到人，那些人好奇，一定会追问下去。追问下去，你没东西讲，这就叫行骗不遂。对方就会说你没本事。有的人很刻意的包装自己的本事，但是最后什么都做不成。


    李先生有个朋友，李先生要买大房子的时候，那个朋友教他这样那样一大堆东西，说得天花乱坠，但是一问到关键性的问题，就发觉他在讲浪漫废话。开头好，但是接不到尾巴。


    李：他一开始说一些新的资讯给我听，说现在有一种新技术，不用砌砖，直接整块钢板放下去如何如何，我从来没听过觉得很新鲜。他之前是做有一些包装的，一路讲下来，不时地补充一些新的资讯给我听。我当时就问他一个问题：“买地起房子需要一些什么样的要求？”他就跟我说
    ABCDE 一大堆长篇大论出来。


    从这个人那里了解到资讯之后，我又咨询了一个小型地产商，买地起房子需要什么条件。那个人的回答没那么多花俏的东西，很简单的说，要看你买在什么地方，多少钱，一平方尺
    140-180 唧（货币单位），还要看你用什么材料。我后面又问了另一个地产商，他的回答和之前的小型地产商回答是一样的。将这些资讯一对比，就可以发现最早那个说得天花乱坠的家伙，只是把听回来的资讯转述给你而已，他把别人的故事变成他自己的故事而已。其实已经资讯不对稱了，为什么地产商知道一平方尺价格是多少，而他不知道呢？那家伙讲一大堆新理论出来，连最基本的一平方尺多少钱都不懂。我们从基本功的角度看，他练基本功都没打好。他讲的全部是阁楼上的东西，没讲基础的东西。我一听就知道这个是不是我需要的，资讯好像很多，但是不是我需要的。


    江：那个朋友讲一句浪漫废话“起房子，最重要的是知道自己要什么”。其实在任何领域，我听到别人说“最重要要知道自己要什么”，其实我会怀疑的，所以这种废话以后要少说点了。


    你要成为专家，我们给一个方向给大家：人无我有，人有我优，依次类推。


    李：举个例子，市场上每个人都讲蓝海策略，你可以略为涉足。如果你想走捷径，就要问一些专家，蓝海策略是什么啦。假设我想知道少少许秘学，我直接问江先生，那就够了，我可以拿到我想要的资料。江先生知道那些不是畅销资料，是很冷门的，你不需要动脑，你问他就可了。


    人家没有的东西你要有。你要多看些冷门书，如果你一开始喜欢权谋，什么权谋书你都要买来看，看到好的介绍给我们就行了，我们可以节省很多时间。买错买对都不重要，你可以从错的里面发现什么是对的，知道哪些是好的，哪些是有实力的，尽量多看冷门书。


    江：有些人不知道到底哪些是冷门书。很简单，畅销书大部分不是冷门的，其他边缘的书要越看越多。每一个领域，你看得多才能知道什么是冷门，你看得不够多，很难知道是不是冷门。任何和社会规范走相反路线的，很大可能就是冷门，你可以从这里入手。我见到冷门书不管三七二十一，先买回去再说，因为冷门书大多不畅销，可能过一段时间就绝版了。


    我收藏那些冷门书其中一本是讲强奸的，是一些学术数据来的，它不是教你如何去强奸，它只是研究一些数据之类的。有人肯写，能出版，我就愿意去买。


    李：香港一个很大的书商说过：“我不出版违反道德的书。”其实这个观点在出版界来说是错误的。资讯是不分好坏的，你们想想，一个强奸犯能够写出如何强奸，一个性骚扰专家能够写出如何性骚扰，头脑别那么死板，你只想到坏人能看这些吗？好人为什么不能看呢？好人看了可以防备啊。外国要比这里开放，江先生有买到教藏毒的
    VCD。


    江：美国可以找到一些很奇怪的书。我们的书进入香港的时候，有个出版社说我们的书太过负面，出版的话妇女或者公众人士会去示威，对公司的影响不太好。我心想，他妈的！香港这边的文化届比我想象中保守。


    美国有本书是教人如何转换身份的，这本书在美国一些州是不合法的，教人去医院找死亡证书，再去一些部门注册死亡，然后再如何申请一个新的身份证，换一个身份。


    李：大陆出的书现在很大胆，还大胆过台湾。


    江：还有那个藏毒的 DVD，是一个前警察教的，说如何才能检查你的车，如何逃避检查之类的。我为什么要收藏这些 DVD？我觉得过瘾咯。还有教人如何做扒手的。


    李：你收集到这些资讯，你出去聊天，是一个很好的话题来的。


    江：还有一本书，是女同性恋者写给男人看的，如何取悦你的女人。之前还有一本男同性恋者写给女人看的，教女人如何取悦男人。我一看书名，那么吸引人，买回去咯。谁知道买回去一看，那些招式是废话来的。他的写法和包装是跟社会规范抵触的，我会尽量去收藏。这些我不会深入，我能收藏就够了。要深入那些，是属于发烧友那些。比如一个人喜欢静坐的，他收藏二三十本静坐的书都不奇怪。不同的作家，对一个论点会有不同的角度，这样看下去会深入一些。


    李：同一样东西，你要收集足够多的资讯，才能讲出不同的变化。


    江：一个是宽一个是深，当你够深的时候，才能成为专家。我们认识的博学和尚，看的书是很宽的，又够博又够深。他叫李老师去台湾找的一些书，李老师都没听说过。之前他不看龙应台的，后面听李老师介绍，连龙应台初

