    # 洗脑兵法基本心法


    - 开始运用苦法则洗脑后，再以非定性法则，给对方不劳而获的大奖赏。如此对方才觉得有牺牲又有收获，进而开始死心塌地。

    - 得寸进尺，逐步争取对方承诺或付出。

    - 逐步扩大自己的领导权。

    - 让对方逐步习惯受你的影响。


    ## 超级销售、谈判或情歌兵法


    1. 勾魂

    2. 夺心

    3. 洗脑之得时进尺，逐步进攻法（注）

    4. 限量法则

    5. 要求承诺

    6. 临成交前戳破目前与未来的一切后悔

    7. 成交


    **注 1**：过程中，每当对方有良好或对自己有利的情绪反应时，乘机销售一下。如果是男女关系，则乘机加强亲密度。每次乘机进攻时，须加得寸进尺法则。须由多个小成交，进展到最后的大成交。目的是训练对方习惯成交。


    以下是一个如何运用权谋兵法道里的各种技巧来向朋友介绍这个课程的例子：


    | 角色 | 内容 |

    | :--- | :--- |

    | 你 | 其实人生中，有些时候我们是很迷茫，但是有些时候呢就会有很大很大的觉悟。虽然我们到今天为止已经明白了不少的东西，但是有些时候我们会明白到一些事情，是会惊撼到我们会完全清醒过来…那天，我没想到自己会去上一个我不可能上的课程……
    |

    | 友 | 你上了什么课程？ |

    | 你 | 我现在上了这个课程后，我不是很想让我的老板，伴侣知道我有上过这个课程。其实呢，不是每个人都能面对现实，这个课程就是教我们如何面对现实。 |

    | 友 | 什么意思呢？ |

    | 你 | 我们学到最重要的观念是…所有的价值都不是真的… |

    | 友 | 什么？ |

    | 你 | 试想一下，如果一个男人去追一个女孩子，谁比较有价值？谁有主控权？ |

    | 友 | 当然是女的有主控权。 |

    | 你 | 当一个销售员去找一个客户做生意时，谁有主控权？ |

    | 友 | 当然是客户啰。 |

    | 你 | 对了！这就是我老师所讲的，我们都给社会骗了。其实这些主控权都不是真的，但是很多人都没办法看到这个真相。你有没有纸和笔？[伸手]我画一些东西给你看你就会明白了…[画那说明会里的男女格局图，画完后把纸一转，推到对方的前面]…哪，拿着这支笔…[把笔交给他]…好！你现在把那个男子删掉…在那写上“你”…好！你现在把那个女子删掉…在那写上客户…好！你看，只要你一去见客户的时候，你就很自然的进入了对方的格局。
    |

    | 你 | 我再举个例子。假如你问我：这个课程和那些激励课程有什么不同？…这是个普通问题，对不对？ |

    | 友 | 对。 |

    | 你 | 其实，那问题是一个陷阱，我照直答你的话，这个课程的价值就开始下降了。或者你问我：上了这个课程后会得到什么好处呢？…这也是一个陷阱。如果我照直答你的话，这课程的价值就下降了。…或者一个老婆问老公：你爱不爱我？……那也是一个陷阱。假如答不爱，就死定了。假如答“爱”…也照样的会死，只不过死得慢一点而已。假如答“爱”，她就可能问：你有多爱我呢？…那就是第二个陷阱了。那么男的会可能说：假如你病了，我就放假，全天照顾你…那么那个女的就可能说：“嗯…不过我以前的那个男朋友也是这样对我。”那么这男的就想办法去证明他比她以前的男朋友更好。其实男的不知道，那是第三个陷阱。女方也不一定是刻意的设陷阱。不过只要那个男的照着答下去，他的价值就下降了。其实有很多人大概隐隐约约的知道，好像有很多地方都有陷阱。但是不是每个人都能很明确的看透这些陷阱。这个课程就是教我们怎样扭转这个格局…
    |

    | 友 | 那么要怎样才做到呢？ |

    | 你 | 其实我是可以告诉你我们的老师是谁…咦！等一下[身体向后倾]假如你上了他的课程，我怎样知道，会不会用来对付我？ |

    | 友 | 喂！我们是朋友，我需要这样对你吗？ |


    ## 讲座实录


    ### 第一天


    **江**：学这个枢纽呢，最重要就是刚才我们说的思考模式，这个思考模式，我们就是给多一个角度给你参考而已，你不应该完全用我们的思考模式，有的模式适合我，但是未必适合其他人，也就是你们未必跟着一个思考模式去做，未必合适你。


    **李**：我们要记得的一样东西就是，江先生的思考模式和我的是完全不一样的，他是很冷静的，但是我要想东西想得很厉害呢，我是要被少少情绪而激发，当然不是失去理智的，我意思是说，哇这个为什么那么厉害啊？厉害过我家啊，我的性格就令我的斗心起来了，是什么理由会那么厉害呢，为什么会厉害过我呢？如果他是写书的，我会一口气把他所有的书买回来做参考，做笔记，通常在做参考做笔记的时候，因为他厉害过我，我就不服气，一不服气，我就找他的漏洞，激发我自己的思考方法，我是需要有情绪去推动我的。有适当的情绪带动我，我会有一个比较完善的思考，所以，你们要找回你们自己的思考模式，思考习惯。


    **江**：通常激发到李老师思考的都是一些负面情绪，但是负面情绪不代表不好，主要看能不能激发到你做一些东西，我的模式是比较倾向对方有没有什么东西可以引诱到我，所以有人问我，你是不是需要用情绪推动的，其实不是，我只是不用负面情绪推动，我是被那些比较引诱性的情绪推动，所以你们要找回你们的思考模式。很多时候不只是在课堂里面学，你要在外面生活中，整个天地都是你的道场，对一些现象找回你自己的解释，这些东西为什么会这样。我们不认思考模式可以完全复制得到，因为人和人不一样，那种强制复制是不行的，所以一会我们学完之后，要消化，一会还和你们解释，记得和消化有什么不同。


    **李**：就像你们做销售的，上完课之后呢，你们先养成一种习惯，这种习惯就是能把你们的问题很具体的描述出来。例如有一些顾客，来刁难你，你没办法回答到，当你没办法回答的时候，你就要马上将他的问题写下来，你要一模一样将他的话用文字写给我们，我们才能根据你的情况对症下药，千万不要这样问：李老师，我要做保险，请问如何勾魂？那么大的问题我从何答起。有时候我想，不如我从头帮你设计，然后抽你一半的薪水好不好？（玩笑）


    例如你和对方说：陈生，我是卖保险的。对方马上挂你电话。你就要知道，你的开场白用得不好，当你知道你的开场白用得不好，这一招不灵，你就要转变，再例如，所有的客人都对你说，为什么你的东西那么贵的啊？我们在印象洗脑教你什么？那你就用蓝雷咯，先将这个缺点讲出来，一讲出来，咦，有效果哦。下次再有人刁难你呢，你的招式才会进化，其中一两个最简便的方法是这样的，当别人一刁难你，你马上去另一家店，找另一个销售员，用别人刁难你的方法，去刁难他。他不一定能回答得到你，但目的是，在他回答你的过程当中，感受这个气氛，他给你怎样的回应，你将这些回应全部描述下来，回去做一个分析，你以后学招式，就会很快。


    **江**：我们的生活中，会出现很多的这种状况，你要会利用这些状况，变成有价值的东西。我们的课程当中，会有分析那些成功的人。举个例子，在马来西亚有个赌王，写自己的自传，说怎样赚取第一桶金，他开发树林，卖木材，发达之后买了块地，用这块地盖起了赌场，他没将他的第一桶金很明确的写出来，他的自传有两个版本，一个是自己写得，一个是别人写的。那个别人写得版本里面，说他原来是马来西亚共产党的，后来他出卖了这个党，与马来西亚政府妥协，把这个共产党铲除了，得到马来西亚政府的重用，之后就飞黄腾达了。这个就是他成功背后的真相。在我们的书里，还有一个人，在马来西亚注册了麦当劳的商标，然后通过一些方法让麦当劳很想进驻马来西亚，当麦当劳想在注册商标的时候发现商标已经被抢注了，然后只能支付一大笔钱给那个人买商标权，因此那个人就发达了。


    **李**：最近你们看报纸，有讲马来西亚赌球即将合法化。其实有些老板，即使政府不发赌场执照，他依然有办法拿到几张博彩业的执照。


    **江**：当你们看到以上那些故事的时候，你们好像是学到了一些东西，但其实你们是什么也没学到。第一个故事里面，说出卖了党派，因此得到发达。但是你不是党派成员，没有党派给你出卖。第二个故事，你现在不可能像以前一样，去到别的国家引诱那些大品牌来你国家进驻，然后你把商标注册了，让别人买你的商标权。所以我们要懂得从这些故事当中，怎么找出这个思考模式，这才是我们要学的。


    **李**：马来西亚一些成功学的人士经常说，学成功学最好的方法就是看别人成功的故事，从别人成功的传记里面，就可以学到人家成功的模式。我是很喜欢看传记的，但是我看传记，是专门抓他的漏洞的，当你仔细留意成功人士的传记的时候，你会发现里面有很多假东西，当然不是整本书都假，在他的立场来说，他希望尽善尽美的包装到你们可以看到的哪一面，看不到哪一面呢？香港的黎智英算是比较坦白的人，但是我看到他书里的一些东西是包装过的，你用这种态度去看书的时候，看久了你就不会别人讲什么就相信什么。举例，马来西亚有一个老板，在电台接受访问，接受访问的时候说他上过激励大师陈安之的课程，在课程中学到好多所谓成功的例子，让你听了采访之后知道为什么他可以那么成功，于是他在电台讲了三个故事：第一个故事是说，他在温州遇到了一个做鞋的，然后去到欧洲，去参观工厂，发现了一种机器，这种机器在温州是没有的，他把机器拿回到中国大陆去生产鞋子，然后就把鞋子卖到欧洲，最后就发达了。第二个故事是说他在中东认识了一个总裁，接着在那里发现了一些香料，然后把香料卖到中国给一些酒店和饮食店，最后就发达了。第三个故事也是讲类似的这种故事，最后，我想说的是，他在电台分享这些故事的时候，我第一时间的反应就是，关我什么事呢？如果我是一个打工仔，我都没有机会出国了，去欧洲了，就算我是去旅游，我也是跟团去，跟团去是去看风景啦，怎么可能去参观工厂呢？所以大家看成功传记的时候，除了去抓住他的漏洞，还要去找它的共同点出来，找出这些共同点的架构出来之后，你就要给他做一个命名，那刚才我们说的那三个故事，他觉得很重重要，他才会在电台和我们说，我们可以用一个名称去给他命名，这个名称我们就叫它“资讯不对称”。给这些现象命名，是第一个步骤，它的好处是令你方便观察这些现象，你思考的速度就加快了。举例说做销售的人，很重要的是要让人注意力集中在你身上，听你讲话。我就算讲一百个故事，我的目的就是为了让对方停下来，把注意力集中在我身上，那我们把这种现象做一个命名，做什么命名呢？叫做“勾魂”。当你在街上遇到一个人叫你买东西，你根本不听他讲就走开，你就很快的能把这个现象用一句话概括：“哦……那个人没有对我做勾魂。”这样你是不是就方便了观察整个大环境，让你加快你的思考速度？


    **江**：有语言学家做过一些研究，北极的某个种族的爱斯基摩人，他们对“雪”有二十四种形容词去形容，而我们英文只有一个单词“snow”他们在这个环境下，需要不停的天气分析，他们就会成为分析天气的专家。另外有个故事是说有一个受过
    30 年训练的野生动物学家，去到非洲的一个部落，竟然不够部落的那些人来分析某种鸟的种类，部落的人对鸟的形容词是非常的多，包括这只鸟煮熟了是什么味道，这些形容词都放进去，他们一看到这些鸟，就很快的可以分析得出来。换句话说，你对一些现象命名越多，就方便你思考速度加快。刚才李老师举的例子，勾魂，比如一个人做勾魂做得不好，但是做专心做得不错，你用几秒钟的时间就把整个现象思考完成。如果用一般的方法去做，可能你用了几分钟才想清楚。这种思考方法呢，是双刃剑来的，它令你思考快，这是它的好处，但是它的坏处是，它会令你“狭窄化”你的思考。有的人销售成功，不一定是勾魂做得好，大部分时候是勾魂做得好，但是有时候也不一定是，如果你一狭窄化之后，你会觉得一个人明明勾魂都做得不好，但是那个人之后还能做出成绩，你会觉得没天理。所以大家要记住，在令你思考速度加快的同时，也会狭窄化你的思考。


    **李**：大家知不知道我们华人的数学是所有民族里面对比来说最好的？在德国做过研究，因为我们华人对数字的念法都是单一音节的，例如 1,2,3...10。只有一个音节。像英文的
    7，念起来就两个音节，马来西亚人的数学是最差的，为什么马来西亚人好像数学特别笨一些的呢？因为马来人数学里 10，读音是三个音节，当一个民族单词的音节越多的时候，就会降低它的思考速度。给名号的意思就是要加速你的思考速度。刚才江先生讲的呢，一个东西，描述他的名词越多的话，他的变化就越精细，像小孩子
    9 个月大的时候，他是开始认名词和认一个字的声音，在他 9-18 个月的时候，你能将你描述的情境用很丰富的词描述出来的时候，在他 18 个月之后，如果小孩的语言区域发育得好的话，他可以认识一万个字以上。


    **江**：我们的意思是，如果你要变成一个招式家，你就要对这些招式有不同的名词去形容，如果你要成为思想家，那你就要对各种思想有名词上的描述。有一个佛教的派别，对人的意识上的一些变化呢，会有不同字眼形容，最初描述烦恼只有
    5 种，但到了后期有 100 多种描述，当他描述越细致的时候，他就有办法对各种变化能够触摸得到，你要对哪一个领域研究深入的，——你就要制造多点名词出来。我们只是在权谋销售里面制造这些名词，你可以在你的领域建立更多的名称出来，那你的思想就会生成了。


    **李**：刚才我们说的“资讯不对称”的例子，你以后要记得放在你的头脑里面，看电视，听人讲话的时候，你就不会那么容易相信别人。有一个电视节目，是讲创意的，有一集说的是如何卖柠檬水赚更多的钱，其中有一个商业博士，在天桥底下，挂一个牌，在牌上写柠檬水的价格，意思说用很便宜的价格来卖柠檬水，希望用数量来创造销售的奇迹。另外有一个人呢，我们的话说叫他不切实际的。想了一个很特别的方法，借着这个电视节目这个背景，把柠檬水以
    1000 元一杯的价格来销售。他就在纽约--有个很多人的广场演讲，来吸引人们的注意，他请大家买他的 1000 元一杯的柠檬水，帮他实现美国梦。当然最后是很多人围观，但是没有人购买
    1000 元一杯的柠檬水。节目的评委点评这两个人的时候，就说第一个商业博士很蠢，降价卖柠檬水什么时候才能赚到很多钱？接着就赞扬利用节目背景来卖柠檬水的那个人。好，现在我问你们，你是不是觉得评委们讲的东西很有道理？但是其实你们是学不到东西的。我第一眼看到这个节目的时候，就发现只是一个娱乐性很强的节目而已，但是你们绝对学不到东西。在现实的世界里面呢，那个博士这样去做，是有机会能赚到很多钱的，而那个卖
    1000 元一杯柠檬水的人，在现实世界里，你是不会去听他说什么的。为什么节目里有那么多人听他演讲呢？你有没有注意到一样东西？那些听众全部都被节目摄制组拍摄下来了，也就是有人在旁边打灯啊，调配音响啦，一大堆工作人员忙来忙去了，那些人路过当然好奇了，所以才会停下来听那个人演讲。


    真实的世界里，没有这一大堆节目组的工作人员在旁边拍摄，做各种配合工作，你觉得会有人好奇停下来听演讲吗？当你用这个思考模式去看待一些现象的时候，你就不会那么容易中陷阱了。


    **江**：曾经有个朋友很关心我们做生意是不是发达啦，做得对不对啦。我相信你们身边都有这样的朋友教你应该怎样做生意。那个朋友教我应该买件贵的衣服来穿，买个劳力士来带，再买辆名车。他教训完我们之后呢，就讲些故事出来，美国的一个传媒大亨，说大陆有个电视台叫凤凰卫视，和他合作一起开了一个电视台，赚了钱之类，凤凰卫视的一个股东，去见传媒大亨的时候，开了一部很名贵的车，停在传媒大亨办公室门口，通过这样的方式去见传媒大亨，才有办法展示自己是成功人士这样的一个形象，当别人见到他是成功人士，才会和他合作。我那个朋友不停的讲这一类的故事，他也买了一些很贵的手表和衣服，他也有出书，出书的发布会找来当地的立法会议员，还有电视台的主持人在现场帮做
    MC，通过这样的方法来做新书推荐会。但是我们的新书推荐会没有这样的排场，我们的成绩在马来西亚是第五名以内。


    我和李老师私下探讨，假设你有一辆很名贵的车，难道传媒大亨没有吗？难道传媒大亨真的看得起你那辆车吗？或者他有更加多的车。我们怀疑凤凰卫视的股东去见传媒大亨的时候，一定有一些关系在帮协调，或者是其他的原因，如果传媒大亨是没有得到任何利益的话，他不会和你合作，虽然你有钱是你的事，但是你要给到利益给他，他才会给到机会和你谈合作，就不是因为穿这些名贵的衣服，开这样名贵的车才会合作成功的。这些包装到今天还是有人信，我当然不是说包装没有效益，但是包装绝对不是唯一的效益。


    **李**：包装可以骗到什么人参？奋斗中的人。就比如我去买房子的时候，我是穿10块钱的短裤去的，穿一件破烂的衣服。然后我就问销售员一些问题，销售员说，买房就买房咯，怎么那么多问题的？态度很不好。我一看，心里肯定不爽了。当然，奋斗中的人是非常介意这些东西的。我有一个邻居，他非常的有钱，他家里有4台车，这4台车都是从英国空运回来的，但是他本人开车出去见人的时候，是开马来西亚最便宜的车。我意思是说，那个传媒大亨，如果想买飞机大炮的话，对他来说已经不是问题，就比如你对李嘉诚说，我开奔驰S500来见你了，李嘉诚也许会想，不就是奔驰S500吗，有什么了不起。也就是你不可能用这些包装来吸引到李嘉诚和你合作，你无论穿多名牌，你也不够李嘉诚有钱。所以当一个人只是迷信一样东西的时候，就看不清楚现实真相了。


    **江**：我们这个朋友经常教我们要借钱做生意，把生意做大，大到没有崩溃之前，就卖给别人，那么自己就可以赚一笔走人。确实李老师有个朋友是这样做生意，做到越来越大，但是却非常危险，到今天还没倒闭，但他不是有钱人。但是已经处于边缘的位置，确实是一个奇人来的。那个教训我们的人说，他这样做才是对的，但是我们想，为什么他自己不这样做？这个就是资讯不对称了，他口头上宣扬是一回事，但是做不做又是另一回事。


    **李**：当你看到一个人资讯不对称，你就要开始用另一个层次去分析这个人了。我们就要从人性的角度去分析刚才我们的那个朋友，我们称之为阴谋论。我和江魔一起平时在生活就是我们极端自我一书写写的“脑友”，你们平时也应该多找几个这样的脑友。我们开始分析为什么这个人要这样说呢？这个人为什么要教育我们呢？他又不会借钱给我们做生意，也和我们没有任何利益关系。那江先生分析呢：这个人是没有胆量，他很羡慕这种方式做生意的人，他想做，但是他没胆量做。我们就从背后的人性层次去看这个人，我们不是说这个人愚蠢，他举见面就不断教我们，他很希望他身边的朋友都非常有胆量，但他自己本身又没胆量做，自己有心这样做，但是没有勇气去做，所以他很羡慕会做包装的人。那我们就可以看到他心理层次上的变化了。


    **江**：我们鼓励大家要多看书，看出多一些的不对称的资讯，当然不只是要看我们的书，其他有价值的书也要看，看多了就会懂得过滤这些资讯。比如有些谈判专家讲的一些东西完全是不切实际的，甚至现实生活几乎没有人这样去做的。有个美国很出名的谈判专家叫罗杰杜生，他教的东西是触摸到少格局思想的边缘，但是他的一些招式是有问题的。他是克林顿的谈判顾问。他说，当他走到海滩，看到一艘船，是他想买的，但是他和卖家说，没有这样的需要，没有兴趣。但是他又问卖家，如果这艘船要卖的话，打算卖多少钱呢？他对卖家先说没兴趣，但是又要问卖家多少钱，这里面有没有问题呢？很有问题。明显的资讯不对称。如果是见过世面多的人，听到讲这种话，就会觉得少少的不妥，但他未必会将这点捅穿。如果你对资讯不对称已经有了这样一个种子，当你发现有人这样做，你就会开始分析，这个人到底是要还是不要，如果是一个真正不要的人，会不会浪费时间去问？正常不会有人这样做。还有一些卖楼的人经常说，其实我都不是很想卖的，口头上说不想卖，行动上又是要卖，那到底是卖还是不卖呢？如果卖楼的遇到我这种人呢，我就说君子不夺人所好，我不好意思买你的东西。


