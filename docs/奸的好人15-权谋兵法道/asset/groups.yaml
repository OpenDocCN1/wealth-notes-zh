    表面。我赞着你了。你分析可以从多重角度，可以分析的非常详尽。这个是你的强处，同时也将是你的弱点。因为你的分析力太强，对事对人你看得出太多的缺陷，你不知道要做哪一个决策。所以远见地的人呢，就会变成讲的时候天下无敌，做起来是无能为力。这就是地狱。你再看手段一样是这样的。你再看性格一样，先天堂，后地狱。所以全部都是天堂地狱来的。你解出这五种性格的好处就是，这些成功了的人，或者以为自己成功了的人呢，甚至那些不想成功，但是以为自己明白什么是成功的人呢，你解出来给他听他会觉得大家惺惺相惜。这是他内心的价值观来的，所以就会跟你的内心距离拉近。拉近了以后你有可能造出一个形象，这个形象就是你是他的大师。如果你有需要解得好的话，你有办法做他的大师。


    接下来呢，他就跟他的客户说，其实老板是可以分成三品的，照我们书上写的说，下品的老板，人见人爱；中品的老板，人见人怕；上品的老板，是又爱又怕的。照着书上的说。然后就开始拍马屁，“如果我没有记错呢，xxx。”把他讲成是人见人爱的那个，现在正在向又爱又怕的那种转变，从这个方向来拍马屁。注意，老板分成三品呢，虽然不是二分，而是三分，但是听的人，如果他没有思考过这个问题，你会觉得，咦，这个人好像有点料，有点见地喔，所以就制造了个形象出来。当时他拿到了那个生意，那个生意原来不是给他的，因为这样的生意通常是不给外人的，而是给内部，或者给亲人，但是那个人依然把生意给他。所以这就是用勾魂夺心。记住篇幅里边的内容，照版跟别人讲。


    （01：48：40）


    学员：我想问下，有时候做了张力之后，再做一个刚才好像上下中三品，最后再拍马屁。这个张力跟马屁隔了这么就会不会没有效果？


    江健勇：张力不应该等了这么久才讲第三品，张力扯不到这么长。


    李民杰：就好像你看一个恐怖片，不出声不出声不出声，其实是有一个极限的，你半个钟都不出声，你等着这个恐怖恐怖恐怖，你就爆开了，这感觉就过开了。


    学员：……


    江健勇：先看谁有主控权。任何一招都跟主控权有关的。勾魂就是我暂时讲主控权转移到我这里，夺心是我制造到我是专家，我是神，所以我暂时将主控权转移到我这里。洗脑就是要求你不断服从我，所以是暂时将主控权交还给我。所以都是息息相关的。


    李民杰：看格局呢，再给多一个额外参考的指标给你。一个格局，如果你的很大，本来就是胜局，那么你根本就不需要说话。如果你本身是一个输局，他这么大，你这么小，是我的话我就会用这一招，破局，大赌一场。就像昨天讲到的我见到
    xxx, 我都已经没什么把握了，但是又不想失去这个生意，所以我就抢到这个电话，交给你听。碰到输局的时候，念你都输定了，有多毒辣的手段，就想多毒辣的手段来毒害你的竞争对手，教你的客户
    xxx。因为你最清楚你的客户有什么弱点，你公司有的问题，这一行有的问题，你的客户一定会碰到。你坦白跟他说，我可以给到你的服务是这样，做这一行遇到的最大的问题是怎样，就是讲所有的问题全部讲给他听，怎么控制，两个礼拜后会看到什么，看不到什么的话会发生什么问题，你全部要预告给他听。就好像古代的军师，要出去行军打仗了，情急之下，打开一个锦囊。只不过你将这个锦囊的答案讲完给他听。这是输局的时候用的一个招式，为什么呢，君子报仇十年不晚。你把毒布好了，毒害你的竞争对手，其实你毒得好是有很好的好处的，你的客户不是记得你罗。


    还有一点，你用勾魂的时候，还有一些很关键的东西，记得在平局的时候，就是你大他也大的时候，还有就是和在局的情况下，这两种情形，在真实的世界，你是不知道的，你说了这么多名词，对方说的东西有没有顺着你的意思，你在平局跟和局里边，观察看谁开始占小小的优势，我们给了个方向给你，格局兵法，怎么样看出对方有格局，尽量留意这些情形，如果在平局跟和局中，你尝试去审核对方，设一点假的审定，卖鞋的故事，是不是设一些假的审定？你们公司多少年了，尽量给一些赐封。在平局跟和局中，大家不知大家的底牌，你越做得多，对方会怎么认为？大佬，好像你强过我喔。他感觉上，好像优势到了你这边。你就从这四个方向来看怎么样下药。当然，你在输局的时候尽量多做一些勾魂，尽量找机会破局。输，其实不一定是输的。举例，我跟一个客户经营了
    20 年的生意，你现在来抢我的客户，这个本来就是输局来的，我都经营了 20 年了，你怎么害我？就这样来看关系。


    学员: ……


    江健勇: 说了解一下的客户是自己都不知道自己要什么的，这种是大部分的客户罗。有一些是明确知道自己要的就是这样的了，没这样你就不要跟我谈了。但是你见到的大部分客户是这一种（不知道自己要什么）。


    李民杰: 刚才说持势凌人，你是胜局的时候你怎么做？


    江健勇：好需要是废话来的，每个人都好需要，我还好需要很多女人先。个个都需要一些好点的电话，好点的产品，个个都需要的。但是不是个个都肯拿钱出来买这个东西。这些人就是不知道自己需要什么。


    李民杰：你跟我們两个讲保险啦，其实我们两个想，我们死掉了还有价值的，因为我们是 xxx，我们死了我们的孙子还会 xxx。(01: 56: 00)


    学员：......


    江健勇：就是这两天学的招。如果对方对这些招式很清楚，你出招未必很有用的。


    李民杰：很简单，你就拿出红色这本书，第几期在这里。“这位师兄，请问你是多少期的学生？我是第 77 期，你呢？”


    江健勇：因为对方已经很清楚，你没办法用任何的东西，对方的格局已经很大了。你没办法再用，这种叫做说服的技巧，去影响对方的。因为他已经太清楚了，ok? 一个基佬，他用在犀利的勾魂，都没办法再勾到我们的，哈，因为实在太辛苦了，你怎么勾，怎么夺，怎么洗脑，怎么讲格局，都没用。江老师，你又讲你是鬼才，鬼才喜欢创意罗，创意是要新鲜的东西罗，哈，都没搞过不是新鲜罗，哈。堪称是鬼才了，我屌他了，哈。太清楚的话你用什幺技巧都难。(01:
    57: 35)

