    # 宏观微观说话术的分类方法


    课程的种类→1、激励课程；2、知识学术；3、技巧手段。→种类优缺点。


    资料内容：


    +   1. 激励课程的特点功用：确立人生目标，放大梦想，激发志气。


    利（优点）：当你迷惘、沮丧、灰心失意，全无斗志，屡遇挫败，陷入困惑之境，激励课程可以帮助你，重新振作，振奋志，勇往困惑之境，冲向挫败。是处理事隋，投入热情的良方。


    弊（缺点）：它让你情绪起伏，大哭大笑，就像兴奋剂，使你无法客观正'
  - '[PAGE 25]


    面现实情况，不能用来解决问题，处理因境难题。


    2. 知识学术课程的特点功用：像商业管理，让你了解业务运作，大企业的营运手法，政商行政事务，经济趋势。


    利（优点）：增进知识，开拓视野，具提醒及参考的作用。


    弊（缺点）：未必有切身关系，所提供数据往往会因不同的时间、地区、人物而有所误差。


    3. 技巧手段课程的特点功用：可以将所学的技巧手段很实际的运用，处理人际关系上的各种利害问题，解决困境。


    利（优点）：即学即用，可转换成实际的利益。（如：学到 COLD CALL 手法，即可用来开发新客户。）


    弊（缺点）：需要思考消化手段运用之窍门，并要自动自发去应用，没有人会推动你。


