  - '[PAGE 119]


    李：你们香港的建筑变化是很大的。


    江：能量最低点分两大类。我们刚才所说的那一类，是被动式的，是比较内在的，你未必控制得到的。我们最主要教你主动式的勾魂。主动式的勾魂有四个方向，之前李老师有写过以效果为信仰为导向，其实勾魂不止不止这四种方向，勾魂有好多种方法，OK？只要你达到这效果：对方停下，眼定定口张张的等你继续发言就对了，我们给你的这四大类是给你参考的，是为了激发你的头脑的，这里面的句子你不需要全部都背下来的，只要背下你最需要的就行了，至于其它的，你可以用自己的创意整出来。第一个：我们要讲的是好奇。总之人一有好奇的时候时间是暂时转给你的。好像我们所说的，主控权又分为实质的合法伤害权和虚构的格局主控权，如果格局暂时在别人的身上，如果你能勾到魂，对方好像傻了一样听你讲，这主控权就会暂时都会交给你，所以勾魂和格局和主控权是有关系的。OK？有几个例子，我们不需要全部都说给你听，其中一个是你和朋友谈了一段时间之后，就说我听了你这一番话，我注意到一件事，停下来，停下来之后你的眼神要定定的看着对方，要等对方问你什么事？接着你就可以说下去。


    李：这样的，就好像我刚才和你说的，一群人开会，你先让别人讨论一段时间。听你的话，我注意到到一件很重要的事，就停下来。「什么事？」所有的人的目光就集中到你身上。


    江：你发言的时候，可以听听大家的意见，自己先写下，整理一下，看看有什么漏洞，再整理一个厉害的出来，给人的感觉就是你的见地有些不同。我和李老师认识的那个姓梁的辩论大师，在书中出现过几次的。他的头脑是很聪明的，他有一个很厉害的做法，他在开会前是没什么讲的，就是听听听，他听听就可以组织，到最后才说。他一讲，给人的感觉就是：「我刚才怎么没想到？」他就将你的见地提升了，不管是真的提升还是假提升，从另外一个角度来看，你是提升了。在中学生，大学生的辩论圈子里，那些人是将他当成神的。所以，你组织后见有漏洞，你就勾了魂再说出来。只怕就是你勾了魂而没话说，这就很尴尬，你勾了两三次就什么的了。


