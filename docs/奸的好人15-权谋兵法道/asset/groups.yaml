    要注意，不要被市场上一些道德的噪音所迷惑，做过销售员的都知道，如果你的顾客很难搞，你经常会给他多一点的优惠。市场上一些噪音经常说，做人不能做那么绝的，但是成功的人，他压你价钱的时候，都是非常自我的，在战略上自我的采购员，通常是拿到最多优惠的。为什么呢？因为做出最多让步的，通常是做生意的人，销售员。他明白这就是主控权的游戏，在战略上越自我越有利，要让对方跟着他的游戏规则来玩。


    政治学家研究，凡是很魅力的总统，一定有两个因素：自我+自恋。能够自我加自恋的人呢，如果他换一个电灯泡，魅力总统的意思是什么？他要等全世界的人都注意到他的时候，才在大众的面前表演换电灯泡。越自恋的人能做美丽总统的原因年觉得是什么？政治领袖能够制造出魅力的一个原因是，普通的人不愿意思考，很懒思考，会等救星。当我们发生危机的时候，假如有两个大师在你面前，你第一时间会怎样？请教他咯。大师，怎么解决啊？我们给一个方向给你们，你们注意了，我们给的是浪漫废话，我们给你的假逻辑，你一昕，哇，好舒服哦。那些越自我的领袖，给出越多假逻辑，就越能领导那些选民，记住，极端自我就是王。但是极端自我还会变成另外一种情况：亡!!!


