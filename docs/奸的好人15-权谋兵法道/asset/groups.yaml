    # 权谋兵法道讲义


    # 见地修炼


    学习三大信念：


    +   第一：学习根本就是一件永无止境的事，人的进化与演变也是永无止境。


    +   第二：没有事件是可以完美的，任何的事件都有很大的进化与演变的空间，人类必须要有发现事件不完善的反思能力与批判精神。


    +   第三：人类的潜能是无限大，当你有无穷的学习欲望，就表示有不断自我超越与突破的空间。


    三类人的学习法：


