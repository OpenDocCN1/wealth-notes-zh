    次的转换,心中所产生的能量最低点,你可以想像一下,你在很少沙的地方,在出门的一刹那,你的心就由紧变松,这一刻有一个很细微的能量最低点。这个人在当时就是用这个方法来卖关怀的,送这样送那样来关心她。通常的女仔在两到三个星期就被他骗上床,再玩弄两三个星期就抛弃了。OK?你们有的见客户,不要只是坐在酒吧里面,做生意的认为只有在酒吧里才可以做生意，但谈的时候也很难谈成的，太吵了。不过你要借进去到出来的那一刹那，甚至你别以为在音乐和酒精的作用下，那人变得没那么戒备之类的，没错，开头没那么戒备，但在里面的时间一长，他就习惯了，反而变成机械式的了。你是要见一次换几个对方，李生亿万富翁的表哥，有时也是用这种方法，和不好说话的人来签合同的。


    李：是这样的。他很自豪的告诉我，好多供应商请一些人去酒吧或夜总会饮酒是有目的的。他告诉我，他是有策略和目的来做这一件事的，他的目的就是，一开始就社交，第二次,第三次是有布局的。比如我今天做生意和他有冲突啦，少些钱行不行？算了，不谈不开心的事，今晚我们去夜总会饮酒。好，慢慢聊吧。他们饮饮饮，到了夜晚的时候。他司机开车过来了。我在送他上车的那一刹，这么多年的朋友，怎样？怎样？一人让一步啦，开出一个他容易接受的价，达成一个小小的口头协议。是刚刚要走，出去的那一刹，心境转变的那个阶段和他说。第二价事，夜总会的消费是笔较高的，打工仔，销售员的一个小赢的策略是：你和一个客户第一次到一个地方吃饭，尽量找一些比较有纪念价值的餐馆(ABC,在客户的名片上写上坐在那餐馆的什么位置,什么日期,什么时间。这是一个伏笔。假设三年后,我和这个客户产生冲突,我做错了事,服务不周到。「不如这样,陈生,我们那晚的事怎么样。这天我很有诚意和你谈一谈,我看
    在 ABC 餐馆好不好?] 到 ABC 餐馆坐回当天的位置,一坐下来我就说，「陈生,你有没想过我们为什么坐在这个地方?」他通常是想不到的。你就说:「在 1997
