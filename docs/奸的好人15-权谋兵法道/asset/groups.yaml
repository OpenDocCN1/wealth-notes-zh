    李：你要注意一下换工阶段，换工阶段是最容易被人洗脑的。洗脑的其中一个口诀是：刚刚新来新知道。如果你是一家公司的老板，你改变老臣子是不是觉得很难搞？公司推出一个新制度，老臣子反对，不肯。但你去一个新公司那里，那新公司有什么新制度你是不是都要听它的？所以说帮人洗脑也好，拿回主控权也好，都是在他进入能量最低点，他的方向还不是很明确，有压力，工作有挫折的时候。在马来西亚
    97 年的时候，盗版光碟很火爆很猖狂，对电影院打击很大。我的一个朋友，他是马来西亚一家很大型的连锁戏院（电影院）的总经理。在那时，他经营的电影院每个月至少亏损
    200 万马子，一年就亏损 2400 万马子。因亏损严重，老总每个月都开会，老总开会不教他怎样做生意，也不骂人，而是连续问他问题。他感到自己的职位就要摇摇欲坠了。他压力很大，开始彷徨，没什么方向。这个人对传销是反感的，他整蛊（捉弄）传销商的手法是恨过瘾的。传销商来推荐他，拉他做脚（下线），他第一时间就问传销商：你是想找我做脚是吧？那你觉得传销是易做还是难做？注意一下，他这一招是在刁难传销商的。假如你是传销商。你是传销商，你来和我说：李生，江生，我推荐你入会了，你们俩个做我的脚啦。我现在就问你：你说做传销是容易还是艰难？


    学：应该答容易。


    李：你答容易？我说给你听，「你现在连保荐我们俩个你都保荐不了，你还说容易？这么多年的朋友了，你还来骗我？」假设你来找我时夜晚。「9点多了，容易？来拉，保荐我啦！」


    你觉得答艰难有问题吗？


    学：有。'
