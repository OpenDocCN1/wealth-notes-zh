    140-180 唧（货币单位），还要看你用什么材料。我后面又问了另一个地产商，他的回答和之前的小型地产商回答是一样的。将这些资讯一对比，就可以发现最早那个说得天花乱坠的家伙，只是把听回来的资讯转述给你而已，他把别人的故事变成他自己的故事而已。其实已经资讯不对稱了，为什么地产商知道一平方尺价格是多少，而他不知道呢？那家伙讲一大堆新理论出来，连最基本的一平方尺多少钱都不懂。我们从基本功的角度看，他练基本功都没打好。他讲的全部是阁楼上的东西，没讲基础的东西。我一听就知道这个是不是我需要的，资讯好像很多，但是不是我需要的。


