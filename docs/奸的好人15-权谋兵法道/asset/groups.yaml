    **江健勇**：不一定要用钱的，我们今晚讲的勾魂马屁也可以做。给个张力他，再拍他的马屁就行了。我们之前有个女学员，上了我们的课以后，回到公司。公司里有一个下属，老板正在想事情的时候他过来问些东西，打断思路。过一下又过来问些东西，又打断。第三次过来问，又打断的时候，这个女老板当众骂这个人，骂得很不给脸。下属还是个男人，年龄都不必她小，同一个年龄层来的。照样骂，骂到哭。第二天这个女老板就跟这个下属说，以后公司任何一个人，需要请假，或者需要借钱之类的，全部需要经过你。那个下属受宠若惊，问为什么，老板说整个公司我只是信你一个。这个下属就开始有很不理智的合理化了，从此以后做事情就很用心。


