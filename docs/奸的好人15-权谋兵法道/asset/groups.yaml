    ## 假障碍与毒害对手


    **学员**：讲义 33 页有个摧毁一切后悔是怎么做？


    **江健勇**：假障碍。假障碍是令对方不后悔。基本上我们的课就上完了。


    **学员**：……


    **李民杰**：其实很简单的，看资讯不对称，看阴谋论。看一个人的思想架构，这个是立法人。能看到背后的因素的是立法人。所谓的执法人是仅仅知道招式，仅仅是模仿到招式，但是看不到背后的架构。守法人的意思是别人讲一句你就跟这一句，这是守法人，纯模仿而已。我们一开始说资讯不对称，讲马来西亚的几个富豪的故事，你仅仅是记住了那几个故事，如果你仅仅是跟这来说成功是建立在
    xxx，这个就叫做守法人。仅仅是背成功者的故事而已。仅仅是背招式，但是看不到背后的思想。举个例子，比如说我们今天把格局思想拿开，把人性法则拿开，我们可以仅仅教你们勾魂夺心洗脑的，但是格局思想其实是灵魂来的，如果没有灵魂，勾魂夺心洗脑不会有很高水平。比如说市场上写权谋的书，我够胆叫你们放胆去买，因为你看得越多，你会发现，一个故事一个解释，一个故事一个解释，写得不深入。为什么给写得不深入？因为仅仅在执法人的层次，甚至只是守法人。写的人只是分析一个招式，但是招式后面的原理是什么呢？就好像百里奚的故事，……读过历史的都知道了，但是背后涉及到什么格局关系呢？……瘦田无人耕，耕了有人争。这就是资讯不对称。你有守法人的思想架构，重新读回战国策，重新读回东周列国志列国志，你会看得很过瘾。如果你看春秋的话就不要看史记了，史记是比较沉闷一点的。最好是看东周列国志，虽然是小说来的，但是都看得很过瘾。有故事连在一起会看得爽一点。看史记就只是一个平面图，很闷的。


    **学员**：……


    **李民杰**：你的意思是假障碍跟毒害对手有什么区别。


    **江健勇**：假障碍是在对方犹豫的时候，前提是对方有兴趣了，做着决策的时候用的，在我们的《心魔行销》写得很清楚，你第一买不需要买超过 xx 个，这个就叫做假障碍。一种应酬式的拒绝，不是真拒绝。就像我们昨天说的，你觉得我们的说明会跟其他的讲师有什么区别，如果你觉得完全没区别的话，这个课程你是不需要上的。这个是假障碍来的。而不是说，你讲得出就上，讲不出就不要上，这个是真障碍。


    **李民杰**：假障碍是给多一次机会给头脑合理化，给多一次机会给他解释他为什么要过来报名。再举多一个例子，假如你是一个人 才，我要将你挖角到另外一个公司，这个情形之下，你是可以设置假障碍的。你可以问你的老板，其实，你有没有想过，你为什么要请我？你要这么多钱来请我，挖角我到你的公司，值得吗？我本来想挖角
    你，但是你一开 场跟我讲这番话，你说我会怎样？“值得，肯定值得啦……”当然这是夸张版的表现，哈。


    **学员**：……


    **李民杰**：你可以把自己的价值提高。你的目的是什么？我假设你的目的是要参与一个很大的计划的一份子，“值得！Abc……”“你有没有想过，你请我 12 个月后，你可不可以收回这笔钱先？你公司赚得回来吗？”在这一刹那你是不是不敢大反应先，这个时候我就可以进一步来蚕食你的利益了。“我有一个问题，你方便的话就可以讲给我听，不方便的话是不需要讲给我听的。我不知道你为什么要用这笔钱来请我，挖角我到你的公司，如果你不介意，我想听一下，你们公司未来的发展计划，安排我做什么棋子。”这一出招，我就会问出你公司未来的发展计划中的情况。这个时候老板就会进入两难的局面，第一我挖角，我讲的东西好像很有道理，但是要考虑是不是要继续说。对于我自己来说，我有我的目的，我要知道我过去以后我能掌握什么重要的资讯，如果不能，我不会跳槽过去，我要留在这家公司，我安全。假障碍，在这个阶段就会发生这些目的性的作用。


    **江健勇**：对方合理化以后将来后悔的机会就会降得非常之低。


    **学员**：很短时间內洗脑怎么做？


    **江健勇**：就是这个，举手之劳，对任何人都可以用的。就算是买东西跟别人讲价，都可以用，“你过来一下，过来一下”。我跟你讲，一个天堂，一个地狱，就可以了。


