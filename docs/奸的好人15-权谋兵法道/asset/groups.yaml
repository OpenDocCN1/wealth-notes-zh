    20 多块钱，很难得的，等等。大部分人都不愿意买，他就说，不买不要紧，我还有一些灯，这些等可以夹在书里边，……拿来看书，这些等只是 5 块而已。5 块对比
    20 块。“我们已经卖得差不多了，就快卖完了。”这个是什么法则？限量法则。“不这样了，5 块我卖给你两个了。”原来 5 块一个，现在 5 块两个。这个是加强你买的理由。他就用这
    6 招，每一台都用这 6 招。做这一行赚钱不是不可能，但是要非常勤奋，每天做十几个钟，可以赚到马币七八千块钱，相当于一万五六左右的港币。就是单靠卖笔。


    **学员**：……


    **江健勇**：你给多一个理由，这个理由不一定是真的。举个例子，我们怎么样毒害其他的讲师呢？


    **李民杰**：我们说什么呢？我们说，一个讲师，要看他有没有料，首先要看他有没有写过书，你看他这本书的时候，才可以看到他的思想架构，他的理论，他的程序是什么样的。你看他的编排架构的时候呢，你看书的那一刹那，有没有令到你有冲动，想去给钱和报名这个课程呢？如果一个讲师连这种水准都做不到，你认为他有没有料来教你？


