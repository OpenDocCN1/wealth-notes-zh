    | 汉堡包 | 50 元 |

    | 炒饭 | 70 元 |


    他虽然没有给到警察，但真的好像香港《磊落神探》的故事一样。叫大学生见他，给他一笔钱。我不知道他给了那大学生多少钱，那大学生才放过了他。


