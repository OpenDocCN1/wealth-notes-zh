    顾问多赚钱多赚钱，我一直把他推上神台。我勾了魂之后，让他迷愣住了，再把他推上神台，把他捧到了很高。他就和我说了一句话：其实你有所不知啊，做 ISO 的讲师其实市场上有很多，有
    2000 多位。


    我一听，有两千多个，我头脑中第一时间出现的资讯是，我要继续比较价钱咯。意思是市场上他那样的专家多的是，那我要慢慢挑咯。当时，他还拿出一些东西告诉我，他有兼职做其他的工作。这表示什么？表示他做
    ISO 的讲师不是那么好赚，要做其他的工作补贴家用，对一个懂得谈判的人来说表示什么？表示低价值咯。他的行为体现出是他需要我，而不是我需要他。


    江：有时候你见一些老板，你不断地吹捧他几次，捧到他不好意思了，他会把一些真实的东西讲出来。像刚才李老师讲的顾问，他很刻意去包装自己，如果只是捧他呢，这样的效果没那么明显，那就要先让他迷愣，勾了魂能量最低点的时候，再吹捧他，越吹越高，让他在神台上面，他摔下来的时候，神像里面装些什么东西你都可以看清楚。如果一个专家说他又做这行又做那行，如果你包装自己是一个专家的，你告诉别人你还兼职做其他行业，其实对你来说是一种打击来的。


    李：一个人被别人吹捧这样好那样好的时候，一般的反应都是谦虚的说没有啦，其实也没那么好啦，当他谦虚的时候，还有多说一样东西出来，来支持他这个谦虚。他会机械式反应讲一些他痛苦的东西出来。举个例子：有一个讲师很久没出来做公开课程了，我很久没联系他了，我就打个电话和他沟通一下，沟通的时候，就用吹捧的手法说他的课程效果如何好，别人的评价多棒之类的。不断捧他的时候，他就和我说：“我都很久没有出来做公开课程了，市场上很多人都做这个课程，A
    先生也是这么做，B 先生也是这么做，做烂了。我想做和别人不一样的东西。”我是这样分析他的话的：做讲师满街人都是啦，我自己也做啦，别人做他不做表示什么，表示他被市场上的竞争给淘汰了。然后他还说：“广告费太贵，而且来说明会的人不多。”我就是用吹捧这个手法，让他自己讲出了一大堆真相的资讯。


    江：我们书里说过，有人吹捧你，你就要夸张式的接受它。但是如果是一个和你不熟的人吹捧你，你就不用这么做，你就说是啊是啊就行了。如果是一大帮朋友在你身边，或者是见一些客户的时候，有人突然吹捧你，你才要夸张式的接受。当然不需要每一次都要夸张式接受，要看情况来。勾魂目'
  - '[PAGE 128]


    前就是运用我们归纳出来的四种方法。大家要记住，勾魂的时间持续是非常短暂的，最多几秒钟到十几秒钟，不会很长时间的能量最低点。有一些老千集团，令人能量最低点时间延长的原因不是他只勾魂一次，他是勾魂很多次，通常那些老千不是一个人出手，而是几个人，一个讲一句七嘴八舌的，就让人能量最低点的时间拉长了。如果勾了魂，什么都不做，那最后的结果是那个人会清醒，醒了之后就没效果了。我们打开
    12 页做一个功课。如果你刚刚认识一个女孩没多久，令她笑，然后突然对她说：“其实你这个人也挺奇怪的。” 这个的目的是什么呢？就是勾魂咯，制造好奇。下一句 “我不是想说，我只是不清楚你是不是那种真的想了解自己的人？”
    这个目的是什么？是格局来的。对方要向我证明她是想了解自己的人。再下一句 “我可以告诉你的，不过今天没时间，因为我一讲给你听的话，你会有很多话和我说，同时有很多东西要问我。”
    这个目的是好奇咯。“不如这样咯，在某个地方有间咖啡馆，很多人去的，不过我今天没有空，就只有礼拜六和礼拜天有空” 这种就是简单的二选一。大家留意一下 “某个地方有间咖啡馆很多人去的”
    表示我不是专门要和你说这个东西而约你出来，而是我本身就要去那个地方的，你有兴趣得空就过来一下，大家聊聊天，就表示不是那么迫切的需要。凡是要搞勾魂，要和昨天讲的哪一个性格来配合的？勾魂的成功和哪一个性格比较相应？狂！


    学员：我想问浪漫废话怎样做到问的时候像没有问一样？有没有架构？问了之后让对方觉得你很有见地。


    江：除非有一些例子，不然让我凭空给你想一个出来我现在没办法做到。


    学员：能不能让对方一直说 YES，比如你销售的时候，让对方不断的认同你


    江：可以，但是这种 YES 是很机械式的。不是让他明白一样东西或者对一样东西有觉悟的那种 YES。问这种问题要小心，这种问法通常是问一些问题封锁住你，不让你说
    NO。你被人这样问多几次之后，你是很烦的，所以要小心。比如做传销的经常说，假如有个商机让你发财的，你想不想花少点时间了解呢？类似这种问题，你如果回答 NO
    的话，就好像显得很笨。


    李：比如做保险的也是，设计一系列的问题，你退休之后是不是想有一笔钱？这一系列的问题设计出来都让你回答 YES 的。比如在我们马来西亚，传销和保险盛行的地方，你一问这种问题，别人全身的防御系统都会警惕，


    127'
