    李：「哦，怪不得。」是可以用来害你的对手的。我用一家是制造矿泉水瓶的工厂来做一个假设。我到你工厂估价，你说：我帮你制造这矿泉水瓶。我很认真的看，还做出一些表情：「介意不介意我向你提一个问题？方便就告诉我，不方便就算了。」你对制造这个矿泉水瓶的原料生产是不是很了解？通常制造矿泉水瓶的并不了解制造过程的，我假设你不是很了解。「唉，」我好像有难言之忍。我深吸一口气，很严肃的问：你是不是和矿泉水瓶的老板很熟？你看我之前的表情，你是不是多少觉得有些不受？你一答熟，我就用嘴角来笑：哦，怪不得。你想到了什么？你答不熟，我笑：哦，怪不得。你看到一个人这样说，你第一时间想到了什么？我一定是发现了一些秘密而没说出来，而且是负面的东西。如果我要害你，第二步就拿一个有暇疵的产品和一个没暇疵的产品放在你面前比较一下，接着说：怎么有人制造出一些有暇疵的产品，说出一些理由出来。人的头脑是很喜欢预测和乱猜的。当你将这两个情节联系起来，你会想到什么？注意，我没有讲他一句坏话吧？你一下这个毒，以后你的竞争对手就有麻烦了。第三阶段：教他怎么管这一家厂。当然，有人问我，抢了这一客户你值得吗？你会麻烦吗？再想下去，万一竞争对手又抢回这客户，他用我教他的东西来管我，你问我觉得值得吗？我就认为很值得，因为很竞争。我认为吃得咸鱼抵得渴（吃得咸鱼抵得渴：做了某事就要承担相应的后果），讲的人你一定会认为他是好人，举例：su
    wei feng（苏文风？在马来西亚演讲的时候，他一上台，就骂风水佬。唉，现代的风水叔叔啊。在古代的风水如何如'
