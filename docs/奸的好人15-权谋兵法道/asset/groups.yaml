  - '[PAGE 124]


    时机，就有人走过来和你说一起分这笔钱。这一招利用几个意外：第一，掉钱下来，二个，那么大一沓钱，第三，突然走出一个人和你说话，第四，还要和你分钱你不知如何是好。他们运用很多意料之外的招式。


    李：我们书里有一节“一根手指的力量”，说江先生怎样用一根手指抠到女，还有书里有一个情节，说一个女经理骂我们，然后用一根手指指着她说她像莫文蔚，这些都是属于意料之外的举动，别人指责你的时候，你不要马上上去解释，解释就等于你站在对方的对立面上，最后先有一个意料之外的打断，打断之后讲两句别的，然后再解释，这样的好过马上就解释。我有一个朋友是卖药的，卖心脏病药，他们公司除了一个心脏病的药，这个药是有一些副作用的，他们要去跟医生收集一些意见，有些医生是很可恶的，一直骂他们。然后他就想出一招，不用被医生骂得狗血淋头，还有机会给到医生一些解释，他这招是这样的。他一边听的是时候，突然冒出一句：你认不认识黄医生啊？￥%￥……%￥……（太吵听不清楚），一个人讲话的时候，突然被别的东西打断，你要讲回刚才的话题，你觉得容易吗？比如你说：你认不认识陈医生啊？对方说：啊，什么事啊？#￥%……%@（再次听不清楚）让人家恍然大悟后，从新再给对方做一个解释。我自己有过亲身经历，我去店面买东西，我是要赚小便宜的，我四处比较比较，找到足够的证据，我准备去折腾销售员，我就拿一个借口，这个借口是他迟送货过来，我小题大做，骂那个销售员，找了很多借口来骂，然后说我要取消这个订单，其实是想趁机占他们的便宜要多点东西。那个销售员估计是不想取消，然后就来求我了，求我的时候，我就列出我的条件，要送这样送那样讲了一大通。然后销售员去征求经理意见，经理说：“行，我马上帮你取消订单，办理取消订单的手续。”我马上愣了。这个不是我原来的目的嘛，这简直是意料之外，我在想有什么办法可以回头呢？我怎么下台呢？对方经理又接着说：“这样，再你还没填写取消订单的手续前，希望你能让销售员解释一下情况。”我发现可以回头了，笑着说：好好好……然后就成交了。


    江：这种意料之外的举动，曾经有个大公司，是做心脏病的药，这个药有副作用，然后公司专门培训这种手法，来应付医生的投诉。曾经有作家写过一本书《真相》去揭露这个公司专门用这种打太极的方法来推脱责任，从来没有真正去研究如何解决药的副作用。


    李：书里的内容是用来攻击那个公司的，说那个公司用很无耻的手段来'
