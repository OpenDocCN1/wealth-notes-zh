    ## 第二天


    **学员**：老师，我想问你“英雄之路”的故事有什么重点元素？


    **李**：你讲的英雄之路是？


    **学**：即是塑造一个人物出来的故事手法。


    **李**：我听你刚才所说，我不知道是不是，一个鬼子（吉·加德纳？）他是写分析古代和现代的神话，他曾经讲过你刚才所说的“英雄之路”，讲郭靖啦，他的转接啊。


    **学**：是的。


    **李**：我不知道《千年英雄》有没有重新改过封面，你可以到 Siren Jin（斯人俊？）看一下这本书的。我肯定有《千年英雄》这本书的，你问他有没改过名。保险点的做法是你向他要作者的名字，他们就一定会找到的。


    **李**：《冷血救世》里面的一篇文章，其中的一段记载：施小姐的弟弟在池塘街做水果批发生意，刚开始生意周转不灵，跟施小姐借了一笔钱，后来生意越做越大，越来越有钱，而此时施小姐生活拮据，见到弟弟有钱却没有要还钱的念头。她就来问我有什么方法可以让她弟弟还钱给她。我就问了她说一个问题：“你弟弟在池塘街有点面子吧？”人有面子就要维护自己的面子的，这就是他的弱点。“我有一招，但你用了之后你们的姐弟感情可能就完了，你要不要试？肯不肯付出这个代价？”她说：“这样的弟弟不要也没关系。”她就叫我给她计（方法）。我给她的计是这样的：说老公不行了，让她去问亲戚/他的朋友借钱而不惊动她弟弟。怎样借钱呢？举个例：你是我舅父。我对你说：


    “舅父啊，我老公不行了，你借我 20 万。你别紧张，这 20 万我一定能还给你的。你看我弟弟是不是很有钱？我借给我弟弟这一笔钱，他还没有还给我。不如这样吧，你帮个忙，你现在先借我
    20 万，我周转得过来就还给你。就算我弟弟没钱给我，我也一定还给你的。我弟弟早还我，我周转得过来也就早些还给你。”


    **李**：你现在站在舅父的立场，听到我这样讲，你会有什么想法？


    **学员**：“我听到觉得很奇怪。”


    **李**：是很奇怪。你看过《冷血救世》就明白了。


    你是表哥，接着我就问你；你是朋友，我就问你……如此转折直到让弟弟知道。


    **李**：如果你不想借我 20 万，你会怎样做？是不是先去和我弟弟饮杯茶，讲这事给他听？


    **学员**：是的。


    **李**：“听说你姐过得很不好啊。她向我借 20 万喔。”然后半真半假地说她告诉我，“你姐说你欠她钱还未还给她啊。”


    当时，真的有一个人的跟她弟弟说起此事，她弟弟听后很生气，没理由不生气的嘛，她这是在间接破坏他的名誉。她弟弟和她吵了一架，就把钱还给了她。


    **学员**：我的合作人，他落了公司价（下订单）。我们向他追钱时，他说他在做一份新的工作。老板出粮（发工资）就还给我们，但是老板经常拖粮（拖欠工资）。


    **李**：你们香港是可以报警的吧？


    **学员**：是的。


    **李**：香港六甲海报警可以吓他很长一段时间了。


    **学员**：但他是烂仔（流氓，混混），他不怕你报警。


    **李**：烂仔，说真的，他烂极都有限，除非他是大佬（老大）一个。他不为这么少钱落价的。


    马来西亚警察贪污和很多年前的香港警察贪污是一样的。我有一个朋友，他找一帮青年仔（年轻人）去打一个人。


    **江**：印度人。


    **李**：印度人好找，印度比较穷，黑社会较多，花 2000 元左右就可买下一个人的手。他带人去打情敌，打得人家连门牙都掉了。打人的人有一个观念：警察是很容易买通的，我打完人就给钱警察，买通警察就没事了。马来西亚警察是可以双吃的。他不知道他打的人是一个大学生，这大学生给一笔钱给警察，叫警察抓他。警察认识我朋友。


    马来西亚警察有一张清单：


    | 项目 | 金额 |

    | :--- | :--- |

    | 印度烧饼 | 20 元 |

    | 汉堡包 | 50 元 |

    | 炒饭 | 70 元 |


    他虽然没有给到警察，但真的好像香港《磊落神探》的故事一样。叫大学生见他，给他一笔钱。我不知道他给了那大学生多少钱，那大学生才放过了他。


    所以你不用怕，我说的带印度仔打大学生的那个人是马来西亚 VCD 盗版商，他都不吃小钱。你那落价的是吃小钱的人，你可以威胁到他的，你报警就有合法伤害权了。


    **学员**：我和几个人合伙做生意。有一个人凭着是老板的朋友，整天在 KTV 赖吃赖喝，他扮成老板之一，但他根本就没给过钱。我想有一个干净的地方做生意，怎样才可以赶走他？


    **江**：你和你大股东商量好。


    **学员**：他们是非常好的朋友。


    **江**：都要商量好。


    **学员**：那接下来该怎么办？


    **江**：定一个规矩，股东吃东西一样要给钱，就能解决这个问题。这是做餐厅的人的一个经营手法，我在马来西亚都认识开连锁生意的，股东吃东西一样要给钱，大家都有协议。在开张不久尚未有营业额时，股东带朋友回餐厅吃饭是要按餐厅价给钱的。


    **学员**：嗯（语气词，这里表示认同）。


    **江**：你想过一个问题没有？你改这制度千万不要说：“你带朋友来这赖吃赖喝”这种有冲突性的话。你餐厅现在的制度，股东吃东西要不要给钱？


    **学员**：有的。


    **江**：股东吃东西都要给钱，股东的朋友也一定会给钱的，就算他们假扮成你公司的股东也一样要给钱。但是你别犯一个错误：股东可以签名。一些餐厅就犯这错误。


    **江**：你们是不是电子单据的？


    **学员**：现在是。但我不是整天都在店里的。


    **江**：可以看单的嘛。


    **别的学员**：今天他拿吃的，明天他就拿钱了。


    **学员**：问题是他已经拿了！


    **李**：早知这样，我就不教你这招了，哈哈。你请我们所有人到你餐厅吃饭就好了，我后悔教你这招了。


    【众学员大笑】


    **学员**：对方抛一个格局出来，不需要理他的格局，另外抛一个格局出来。举例：昨天所说的见工（面试）一开三，如果我是老板，我可以不理他，直接抛一个格局。比如这样，我一听完他的一开三，可以先做出这样的表情说：“其实，现实的公司有两种，一种是懂得利用资源的，另一种不懂……”


    **江**：其实，我和你说见工的都是两种人来的……


    **李**：刚才所说的事，你在外面做生意却可以讲的，销售员有两种……


    **学员**：你之前是不是有一本书提到？


    **李**：《心魔行銷》


    **学员**：老师，请问有没有见过、说过一些话，其实是没什么的，但别人听了很生气？


    **李**：会有的。很多年前，有个很有钱但是说话嚣张、没口德的朋友请我和一群朋友在外面吃饭。其中一个人比较能吃，我们男士都是抢菜吃的，只有一个女士吃得很文雅。这朋友这样说男士：“看你们这班禽兽，吃东西都抢成这样。”接着他对女士说：“你再不吃就没什么吃的了。”这时发生了一件令我们目瞪口呆的事：只见这女士口发出狗叫声，接着泪流满面。我们都停下筷子看着女士，呆了。他碰了一下我的手，问我这是怎么回事？我说我也不知道。散宴后，女士对我说：他看不起她！各位，你有没有看出他是看不起她的？


    **学员**：从我的角度看是没问题的，但从她的角度来说，有可能触发她内心的某些东西，才会……


    **学员**：有些时候，比如我，有些在某方面都是一样的，没人听你所说的。我和几个朋友聊天，我说的话没人理我，另一个朋友和我说的一模一样，但大家都在听。


    **江**：你说的一模一样是指内容一模一样。


    **李**：我们在印象洗脑里讲过蓝海策略，……


    **江**：有时候你要注意说话的声调，你刚才说和朋友出去吃饭，你放慢了速度会使人很难集中注意力的。你想要人注意你，你可能要将声调提高提快些，使频率接近大家。继续，我听到你昨天和刚才说的话，速度、能量差了些，其实无关系，你可以语速快些再下降的，“你知不知道那天啊”（语速快地读）“有一件事”（语速慢）再变回正常。


    **李**：我姑父……他是帮我爸吊针水……买书时又见到这个人……


    **李**：这个人是我表哥；是我舅父刚出来做生意时，你们是不是叫吊水啊？


    **学**：吊盐水（打吊针，这里是指打生理盐水）。


    **李**：他用六个月的时间布局，帮一家马来西亚人的公司，这家公司是将这家公司的所有资源，很复杂的，总之是商业诈骗之类的。走法律漏洞没证据抓他，没办法报警的就欠我们公司一笔钱。吃饭的时候，我们一路追，追得很辛苦的，见到我表哥。我表哥就像我在书中写到的：他拍一拍我肩膀，说这是正常的。这个人就是我表哥。如果法律程序催不了他，那公司倒闭了，我没理由向他个人追债的。


    **学**：之前是朋友，变成敌对后，有利益冲突。


    **李**：这对我而言很简单，我不会将所有人当成敌人的，火气过了，无事就再做回朋友。昨天不知道谁问过我，我觉得这不成问题。


    **李**：不和他玩（交往）。


    **学员**：要叫上他，因为他和上司很熟。


    **李**：其实，他是想你们识做（懂规矩）。


    **学员**：但不是一次两次的了。比如有一次是凑钱送礼。


    **李**：他是想你们识做，做事别拉上他。其实你讲了一个很重要的资讯给我听：你们是怕被他打小报告。他有那种厉害关系。


    **学员**：我不是很喜欢他，但也不想得罪他，得罪一个人是很麻烦的。


    **李**：这其实就是变相的贿赂和变相的贪污。


    **学员**：有什么方法解决或降低大家的损失？


    **江**：以前我公司有一个家伙也是这样的，有一次大家吃东西，大家都不拿钱出来，就等他结帐。从此以后，他就不和大家出来了。


    **李**：你们敢不敢冒这个险？


