    ## 课程实录：格局与赐封


    ### 关于追问与反应

    李老师：你这样直接问不是找架吵么？“你问我为什么值 3500？你当我是鸡么？”（笑）（那我问她对于 3500 有什么感觉？）那，你是想追人咯，你现在成狗仔队那种，你成苹果日报的记者了，你这样问。


    江鹰：你这样问她一定回答你浪漫废话，“这不是钱不钱的问题”，（笑）她肯定就说这种浪漫废话。


    李老师：你们看第四页，你们回答这个问题的时候，第四页最后一条说什么？谁顺着谁的意思？你们刚说的例子是谁顺着谁？不管是你是访问式，还是那个说窗帘的故事。不过说实话，你说窗帘的故事，把数字夸大就对了，这个是真的。你要包装自己的豪宅，你就把窗帘的价格提高，700W
    窗帘真的是很少。


    学员：那我能不能装一个很惊讶的表情说：3500？？？


