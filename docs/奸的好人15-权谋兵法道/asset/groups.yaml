    **汪**：Ok？如果没其它问题，我们要开始……


    **学**：我想问一个问题。如果本是朋友，但发生利益冲突，自己为了利益不理朋友。事后，那朋友耍赖，说我怎样怎样的。


    **李**：看个人够不够成熟而已，那事过了就过了。


    **学**：那朋友做了对不起我的事，自己不够成熟，想不开呢？


    **李**：你可要想得开喔。


    **汪**：就像学权谋的第一件事，理论上就是你需要辅导的阶段过了，再来学权谋。如果辅导过后还没过，你还是怕自己情绪上的感受，这时学权谋未必是最适合你的。如果有一个人的，他失败了，只有一味的痛苦，他就没有办法想自己的下一步该做什么，这个人不要来学权谋，他是要等伤口好了，才能去学权谋。一旦学权谋，假如你把一千美金给我，就开始要权谋而不是要辅导的了。换一句话来说，只要你认为我没有伤害人，没做非法的事的情况下，对方怎么在背后看你，这你，这你就不用理他。如果对方令你损失钱，那就不同了。如果只是令你心感到不舒服，这是完全不重要的。在感受和钱之间，我永远选钱多过选感受。这事要你自己想明白了。


    **江**：你可以恨他。你衡量哪个重要些，以效果为重，学权谋就简单一点。


    **李**：我说一个故事给你听。股东和我产生很大摩擦，接着我理开那家公司，但那人头脑很聪明。我尝试各种办法，请他喝茶。严格来说，各方面都是他对不起我，我也很努力去挽回这个朋友。过去的所有事对我而言都不重要了，但他头脑资源，可能是因为利益关系，跟江生谈……


    **江**：可能又能出一本书啰。


    **李**：这故事很精彩很经典的。OK？我都是想将他头脑里的资源拿出来的。想和他冰释前嫌，但他一直不肯给机会我。我打电话给他，他躲我。他的公司是很有规模的，三层楼，内部的文员都有二十几个。他托一个朋友，即另外一个股东来约我，跟我借一笔钱。借一笔钱在我马来西亚叫做打老虎。即是我开一张支票，他就开一张半年后的支票加利息给我。他不想向银行借钱想向我借钱，我心想：好机会。你和我借钱，你就会和我聊天，对不对？我回那股东的话：“这么多年不见他了，顺便去看他。”好了，我去看到了他。我说：“ABC先生。”他一见到我就转过身，用后背对我。我虽然挽回这段友情，但我此时还是忍不住生气。你向我借钱竟然还用后背对我？你说我会不会借钱给他？我不会。接着他求我借给他，我讲给我老婆听。我老婆向那股东：“你那大股东向李生借钱，然后竟然用后背着他。你说他会借钱给他呢？”我觉得被他头脑引诱了。我和我老婆讨论，觉得那个人肯和我聊天，大约两星期之后才借钱，我觉得我会中招。


    **江**：讲的很肉麻。


    **李**：这一招够毒阿。


    **江**：其实，李生过去的股东在李生离开公司时，说你死定了什么什么的。现在李生发（财）了。其实不是李生看不起他，是他看不起自己。以前这股东是手段很厉害的一
    个人，就是“感受”这样东西放不下。做生意你当然是看钱的 了，不是看自己感受的。你公司要笔钱用，银行不借给你，有个好朋友要借给你，你要顾自己感受而不去回他拉回关系，这就叫不成熟。


    **李**：看我的另外一个想法。我其中一间公司是被他利用一些手段拿了个名去，我和这个人的相处，我想过去的就算了，我只是想要他脑中的资源。


    **江**：上权谋的，我不是清除自己的感受，你就问自己目前想要什么或暂时要什么？要效果的话就不要理他。ok?


    **李**：看第7页。勾魂。勾魂的目的就是要制造一些能量最低点，方向就是要人类固定模式打破。什么叫固定模式？举例：当你接到销售员的电话，你不想也想地说，我没什么需要。当你打电话联络客人时，无论你卖的是什么产品，他一定会讲：“怎么那么贵的？”他没有分析过，是机械式反应。你就是要打破他的机械式反应，这就是勾魂的最根本目的。


    **李老师**：江老师，我做了勾魂，那人怎么没反应的？


    总之一定要记住勾魂的根本目的是一说出来，他一定会有以下反应：第一，如果他好像大老板一样靠着椅子坐，你一说出来，他身体有前倾少许，“什么？多说一次。”即是他有这种连续性反应，就表示这个人被勾魂了；或见到他眼睛睁得大大的，以惊讶的表情看着你，这就表示勾魂成功了。就好像你刚才所说，一群朋友说话，你一讲完那句活，所有人第一时间静下目光焦距看着你，这就是勾魂功夫。我们说效果，你自己有这个效果，你已经达到了这效果。你用这个来作鉴定标准，你一定要有一个鉴定标准：“哦，我已经成功做了勾魂。”这句话术，你就可以记录在案了。


    勾魂一开始分成两种；你看这本书所写的：被动式的能量最低点，里面写着：“（刚入社会、换工阶段、有压力、有挫折阶段）”，这里用括号括住。这一类人都有同一感觉：焦距模糊，没什么方向感，不知哪里是东南西北一样。刚读完书走向社会要做什么呢？听陈生说做传销好，“是，做传销好。”接着听洪生讲做保险好，“是，做保险好”。这就是没方向感的人。你听得多，你自我就少的嘛。你自我少等于你的主控权少，所以叫被动式的好微弱的客观条件的能量最低点。


    **江**：甚至邪教，他们通常喜欢招人入会。去招读大学读了3~4年的人。因为他们快出来工作，心里多少有些彷徨，这一类人比较容易入宗教。通常是派两个异性来接触他/她。派两个是有目的的，如果一对一地搭讪，人的戒备心会强一些；两个异性走来和你聊天，你的戒备心就没那么强。我自己就……

