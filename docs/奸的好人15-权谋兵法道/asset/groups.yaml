    ## 如何运用“千隆问屈”+“宏观微观说话术”击败你的竞争对手：


    用过以上的一套预先设计好的话局，再进一步攻击你的对手。


    ### 第一阶段：分辨好坏的起手式：


    1. 先找出你对手的破绽。

    2. 用你专业的领域先考验你的客产。例子：如果你的对手的衣服有破绽，你立刻展示你比他更好的样本，然后用（千一问）字诀：“你看这两件衣服有什么分别？”（万一对手没有破绽和痛脚给你提到，你展示早准备好的两件衣服，用回同一招。）

    3. 不论对方可否分辨得出来，你即用[屈]字诀和[降]字诀：“这就是我为什么要展示给你看的原因……（屈后而降一宏观微观说话术）”


    ### 第二阶段：星移斗转的刺字诀：


    1. 为你的对手说好话，说成是经验不足，我们以前亦犯同样的错。

    2. 用“宏观微观”教育客户分辨工厂优缺点。（包装的自毁格局）


    ### 天堂地狱推拉法


    1. 先做好宏观微观说话术。

    2. 再将你客户的情绪分成：(a)快乐，希望的利益；(b)痛苦，烦恼的危害。

    3. 将利害关系运用推拉交替法，制造情绪上的反应。

    （推=推向痛苦（地狱）；拉向快乐（天堂））


    例子：


    | 所讲的话 | 目的 |

    | :--- | :--- |

    | 等等……，为什么你的眉骨会这样的……（伴行者也看着受术者的脸）……（吓！） | |


    ……我看过很多高耸突显的眉骨，一般很有智慧的人眉骨只是高，但你的眉骨虽“高却隐而突显”，非常奇特，你绝不是“池中之物”，你肯定会一飞冲天……” 请问你是从事盛行？（伴行君答：他是教权谋的讲师，又是生意人……）


    哈哈……（自信地颔首点头），这就是了。我果然没有看错…古代所讲的权谋军师，或者很有智慧和手段的，就是你这种眉骨，我看你在未来三年内，一定大富大贵……要什么得什么。


    咦？!你的右脸红色的……是胎记呢？还是弄伤的疤痕？（伴行者答：胎记!）这就是了，你的事业会因为你右脸红色的胎记阻塞障碍你一飞冲天的前程……？


    话虽如此，但你的气色很好，所以一定会有贵人相助，高人指点，可以帮逢凶化吉……


    只可惜，在你即将要大旺大盛，这三年就是不利你，你的贵人又不知在何方？所以你一定要在短期内，找到你的贵人。


    不如这样，你封上 RM5 的红包与我结缘，让我帮你起一支卜，先找出你的贵人在何方。


    ## 游说商家投资中国：


