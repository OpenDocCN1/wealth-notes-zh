    **学员**：如果整个公司都知道这个神话，还需不需要再做这个动作？


    **江健勇**：再做多一次罗。所以我意思就是说这个马来西亚的富豪这样做反而是笨，损失很多钱。每个人每年都要给一次。可能是某几个，他觉得好一些的。而用我的中奖法则，他只需要给一两个，接下来就不需要每年都给了。接下来可能是两年给一次，但是不知道要给哪个。以前是一年给
    5 个，接下来可能 2 年给一个，省下不少。这个神话更厉害，不只是传在一个小圈子，而是传到整个公司都是。整个公司的人都在猜，不知道下一个会不会是我呢。……还有什么问题呢？


