    一个学员，她和她的仔(儿子)起了很大的冲突，她的儿子和她断绝关系不去住，而去和亲家(夫妻双方的父母彼此互称“亲家”)住。这老人家就和我讲了一句话：「唉，我个仔被人下了药，中了降头。」最容易来说，她在没办法，无可奈何时，那时我如果要骗她，我只需要和她说，幻想版的，我没做出来。「其实呢，我有一个办法可以帮到你。我上童(上童，即跳童。乩童请神上身的仪式)给你看，你要信我，拿一笔钱……，」就是这样一个过程咯。


