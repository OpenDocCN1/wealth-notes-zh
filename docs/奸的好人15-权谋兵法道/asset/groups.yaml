    50%是食指比中指长的，他又说，有 50%很厉害的人是指比食指长的，所以西方国家是暂时定论为这样。结合西方理论来说，小孩子 9 个月的时候，他的前额叶开始发育，所以那个阶段的时候，根据西方的教育来说，就要训练他会选东西，和丢东西，他头脑里面很想抓一样东西的，这个就是选东西的力量。还有时候你要去扔东西，有些东西你不要的，前额叶又控制这样东西的，所以中过的找周我要说一套理论出来的话，就可以把西方的那个前额叶的发育，选东西扔东西，配合这个找周，说出一种好象有道理的理论。我们说会章太炎，他说找周是本性的东西，一些小孩生出来可能特别有耐性的，一些就特别没有耐性的。如果用佛教的解释就是这样了，悟性比较重的就比较聪明的，天生的，天赋来的。章太炎说了，你这样看的话是不是很悲观。人会被社会规范是对的，三岁过后的小孩在古代他们要选学校，不是送他去学校读书，而是请老师回来教，因为不会被大环境污染，做爸爸的就要观察他的本性的发展，接着捡药，例如这个小孩子老师教他的时候，他有什么情况，那个老师就转告他爸爸，爸爸就要开始调整了，妈妈你负责做什么，女儿你负责做什么，婆婆你负责做什么，工人你负责做什么，就要全部作出调整。为什么呢？因为要用他的伪性来骗他的本性。伪性如果用权谋的话来说，就是一种外在形象，如果用现代的话来说，你送到他去一间学校，假如他没有梦想做歌星的，但在马来西亚
    3 岁我送到他去香港的一间学校，学校里的同学就跟他说做歌星好做歌星好，那么，他的兴趣就会被这群人影响了，觉得这个是我真的兴趣。所以说呢，张太炎就看得到这个人性的空隙和漏洞，他说，其实不要太注重本性，密切留意他的发展，关心和怎样用伪性来控制一个人和做一个超越性的修炼。中国清朝根据这个人的行为提出了一个教育系统分析法。

