    推脱。但是我们看得很开心。


    江：李老师以前有一个女朋友，那个女朋友和公司的经理好上了，然后抛弃了李老师，李老师心情不好的时候，就找他的师傅老吴倾述。老吴说：“你是不是真的要追回她？如果你真的要追回她的话，我就替你想尽办法，把她追回来为止。”每次说到“是不是真要追回她”这几个字的时候，就做了一个停顿他看着李老师，然后接着说：“如果我们想尽办法还是追不回呢，我就带你去叫鸡，找一个像她那样的鸡。”之前讲想尽办法追回她的都是意料之内的，后面讲那句，如果追不回呢，就带你去叫鸡，找一个像她那样的，是意料之外的话，让李老师整个人都开心起来，这是一个非常经典的勾魂。


    李：老吴带我去看他怎么做生意，和我说他想了一个方法，可以化解客户认为产品很贵的看法。他即使骂粗口骂客户，客户也会接受，接着不会说他的产品贵。当别人说他供应的产品贵的时候，他就和对方说：老板，之前你卖的那个东西多少钱啊？
    对方说 2000 块。老吴就看着我，对我说：真是傻瓜来的，是我标价，我就标 5000 啦!!! 注意，他是看着我，对我说，不是看着客户说。那个客户当时就傻了，居然有人说他是傻瓜，马上生气，对老吴说：你傻啦？说
    5000 就 5000，没有定价的吗？2000 块的东西，标到 5000 块，隔壁那家才卖 2000 块，我还用做生意吗？老吴很冷静的看着老板说：“老板，你已经将我要解释给你听的话说出来了，你认为我们供应商的价格那么高是乱标的吗？刚才你不是将我的立场讲出来了吗？”那个老板顿时愣了。这个就是意料之外的一个手法了。


    江：你们要注意，他骂对方是傻瓜的时候，不是看着对方骂，是看着李老师骂。如果看着对方骂，真的是要打架啦。老吴的这个架构确实不容易学的，他勾魂的架构，我也不知道怎么教，我们给它起了个名字，叫“开悟”，但是这个方法是不容易做到的，他最后的那个东西一讲出来，令你有一种恍然大悟的感觉，整个效果就不一样。


    李：我们事后分析，老吴带上我去，因为之前和客户介绍过我是写《勾魂夺心洗脑》的作者，我在客户的心目中有着一点点地位，也算半个名人，换句话说，客户要突然暴跳如雷，也不是那么容易，起码在名人面前要点点面子，顾及一下形象，可能有各种因素，这是其中一个计算好的情境，我们不知道，如果是你自己一个人去骂，会有怎样的效果。但是他的架构就是用意料之外，别人想不到的东西，去达到这个勾魂的力量。


