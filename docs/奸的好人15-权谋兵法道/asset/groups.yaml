    \n### 勾魂兵法\n\n勾魂的目的→制造能量最低点。\n\n能量最低点→当人类 98%的机械性反应被打破，头脑会出现极短的空白时间，在这段时间人的主控力最弱，平时的“固定执著的想法”会暂时放下，情绪上和行为上的反应亦很容易被外力操控。\n\
    \n被动式能量最低点：\n\n（初入社会、换工阶段、压力、挫折）（意外、分手、离婚、家庭纠纷、亲人的病或死、初到陌生之处、刚遇到灾难或意外。）\n\n主动式能量最低点（四大技巧）：\n\
