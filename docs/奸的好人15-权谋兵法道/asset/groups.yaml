    # 临成交前会让你失去主控权的话：


    (1)要不要…(2)想不想…(3)要多少…(4)可以吗…(5)OK 吗…(6)几时有空吗…


    注：你在核实一系列的问题时，等于将主控权交回给对方，除非你的问题有勾魂的作用。当你开口问对方，对方肯定会重新考虑，如果此时。他是有经验的高手，会再设一个新的格局，如：“我不是不要，而是你给我这些……，我会比较容易跟我的股东交待。”


    # 如何设格局


    +   1. 先以勾魂或夺心挑起对方的兴趣。


    +   2. 当对方一有兴趣时，马上让对方知道你在审核对方的资格或条件。审核方式可分真假两种：


    +   - 真审核：问一些审核对方是否符合你的条件的问题。


    +   - 假审核：问一些对方一定会中计的审核问题。（废话）


    # 可以审核些什么？


    品质性（quality）：经验，成就、客户、学历、专业资格


    数量性(Quantity)：在业多久、多少员工、分行、预支、货量、几架车或计算机、数期多久'
