    江鹰：你这个属于错误的广告。


    学员：那可以给个反应不出声么？


    李老师：不出声是其中一个正确的格局反应，因为你不是顺着她的意思。


    学员：那我很愕然地对她说呢？


    学员 2：然后你要用浪漫废话么？


    江鹰：当时我们还和他想了一个很碉堡的计划，但他没机会用。做模特这行，不是每个妹子，但大部分妹子都想钓金龟婿、钓凯子，你们懂的。当时我朋友有次带她去个商会，当晚有个参加商会的另一个家伙开了一台更碉堡的名车去，那晚那个模特就不要我朋友送她回去，而是要那个开更碉堡名车的家伙送她，所以他觉得没意思就没用我那招了。当时那个计划是我和李老师和他一起在酒吧想的，想到的时候我们一路淫笑，笑到全酒吧的人都看过来。我们的计划是，当时他们还没热络。如果他继续发展，到
    KISS 的地步的时候，要他吻下去，先把女生推开。通常男生和女生 KISS 是谁先推开谁？肯定是女生。推开你说什么我还没准备好之类云云。我叫他先把女人推开，他吻到一半，把女生推开，然后深深叹一口气，不说话，那感觉像奥斯卡大片的感觉就对了。女生一定问，第一，她是女生；第二，她是美女。一般只有美女推开男人，没有男人推开美女。她一定问你怎么了，你就玩深沉地表情说：没什么（学员笑）。


    ### 情感博弈与价值平衡

    江鹰：只不过以前我和女人太快亲热，太快发生关系，我就会疯狂爱上那个女人，然后就会对她千依百顺失去理智，反而女人那时候就会占我便宜。变成我们之前的感情不是真的，所以我觉得你是个很真的女人。


    李老师：你要注意到么？江魔之前的故事，把一些女人定义成拜金女，一起拉进地狱，两个都贬低。比如，我可以给你钱，但你是不是光为了钱才跟我呢？他的故事就拉低了女生的价值。你不是直接说她，但你别点名说是她，你说的是别的女生。你说完了你又开了个引诱，女学生会想：赶紧和他做一次，他会把钱给我哦？


    江魔：如果这个妹子中招，你认为她口头反应是什么？你是女生。我吻你到一半，跟着和你说那些。


