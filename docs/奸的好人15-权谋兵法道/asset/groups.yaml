    ## 权谋与性格修炼：勾魂、自我与傲骨


    ### 一、 勾魂的效果与客观因素


    咯。所以我们的目的是求财，而格局这些东西不是死板固定的，要灵活变通。那我们接下来就要分享一样东西，就是性格方面的东西。


    **学员**：有时候我们要弄一些手段，那怎么知道手段有没有效果呢？


    **江**：就是看对方是不是妥协咯。


    **李**：举例：你是做销售员的，你讲了一句话，对方愿意停下来听你讲，就表示你这句话有效。对比你以前，你说了一大堆东西他都不听，你现在讲了这一句，对方听了，就是有效。但是注意，这一句有效果，不代表第二句第三句也有效果。


    **江**：有勾魂的效果，和最后的成交，未必有直接的关系，只有间接的关系。


    **李**：有的人问我，为什么我勾魂了之后，对方还没停下来听我说话的呢？大家注意了，这个问题里面有没有问题呢？他对这个勾魂的意思完全误会了。勾魂其实就是为了让对方进入能量最低点，停下来呆呆的听你说话。有时候你设计一句对白，你自己认为是勾魂，但是没效果，那就代表你没对勾魂咯。


    **江**：勾到魂的意思是对方给机会你继续讲下去，但是这个离成交还有一段距离。勾魂成功不代表一定能成交，勾魂之后，成交的几率，理论上会高过没勾魂。但是有些时候，勾了魂未必能成交，有的人没有勾魂也可以成交。我们要看最终的效果，和段落性的效果。勾魂让对方产生好奇，这个是可以控制得到的，表示段落性有效果，但最终能不能成交，那不一定，还有其他的客观因素，天时地利人和都要考虑进去的。所以我们从两方面效果来看，段落性的，和最后的。


    如果你段落性的效果每一次都成功，但是最后都无法成交，那么你要重新思考过了。有时候可能是招式有问题，有时候可能是当时的情形不利，有时候可能是产品有问题。有个学生曾经和我们说，她勾了魂，夺了心，但是成交不了。虽然她的招式是有问题，我们叫她重新设置了招式，她说还是不行。最后我们发现了深层次的原因，原来她是做美容公司的，专门给客人销售美容产品。她的老板拿了一种进货价
    5 元的产品回来，销售到 200 元，还要求有回头客跟你买。哇，这个很难啊!!! 我们不是神啊，5 元钱的东西，你卖到 200 元，还要人家经常回来买。招式虽然是可以勾到魂，但是你的产品上是有问题的，产品是有很大缺陷的，你再用什么高端手段话术都好，都很难见效。


    **李**：举例：你卖一辆汽车，这辆汽车市场价 20 万，每个人都知道去任何一个地方买这车，只要 20 万就可以了。那你想以 23 万的价格卖出去，你说可能吗？这个是被价钱所主宰了，这就叫客观条件/客观因素。而你能控制的只是，你以
    20 万的价格去卖，可以有更多的客人跟你买，你的成交率会高一些。


    **江**：我们的意思就是说，有些东西你是改变不了的，就像刚才说做美容产品的学生的例子。你的产品是有很大的缺陷的，你去推销，假设你很厉害，可以卖出去一次，但下一次很难有人再跟你买。其实这就和做老千一样的道理。所以这些东西要你们自己去斟酌。你的产品很烂，你又要卖得很贵，这样的推销是不可能成功很多次的。


    ### 二、 应对中招与自我性格


    **李**：假设你们不幸中招，你用 200 元买了只值 1 元钱的东西，一旦中招，不要给愤怒盖过了你的理智。权谋行者第一个阶段应该怎么做呢？可以生气，但是生气过后你要思考：我为什么会中招？他说了些什么？如何制造这些客观条件令你入局的呢？你将他的招式全部分析出来，还要养成一个习惯，写笔记。接着再思考，如何变成自己的招式。不要被情绪主宰了。


    **江**：好，我们现在开始讲和权谋思想有关的性格，请看第三页。有五个空位，那么就在中间的空位写上：自我。


    自我是你最重要的一个性格，这个性格有其他的性格作为支撑。自我就是你知道自己要什么。最主要的目的就是你的立场稳不稳，因为你要运用你的手段，所以立场站得稳是先决条件来的。甚至自我也主宰了你将来学习的速度。


    **李**：家乐福最初进驻马来西亚的时候，是很会玩手段的。当那些供应商聚在一起等家乐福的采购员过来谈的时候，采购员就看准几个年轻的供应商，拿他们开刀。采购员问：“你在公司能做主吗？不能？回去！你呢，你能做主吗？也不能？回去！！所有做不了主的都给我回去！叫能说得上话的人来跟我谈！”在谈判没开始之前，当你看到这样的情景，是不是很震撼？这个是手段来的。一来就给供应商下马威。


    家乐福所有的制度其实很不公平的，经常会扣供应商 2%的利润当做是行政费。如果你不给，他就不跟你来往。你遇到那么强的客人，客人在战略上是不是很自我？你作为供应商，你是不是要让步？一让步，就进了对方的格局。供应商就要按照家乐福的规律来玩。所以你们要注意，不要被市场上一些道德的噪音所迷惑。做过销售员的都知道，如果你的顾客很难搞，你经常会给他多一点的优惠。市场上一些噪音经常说，做人不能做那么绝的。但是成功的人，他压你价钱的时候，都是非常自我的。在战略上自我的采购员，通常是拿到最多优惠的。为什么呢？因为做出最多让步的，通常是做生意的人，销售员。他明白这就是主控权的游戏，在战略上越自我越有利，要让对方跟着他的游戏规则来玩。


    政治学家研究，凡是很魅力的总统，一定有两个因素：自我+自恋。能够自我加自恋的人呢，如果他换一个电灯泡，魅力总统的意思是什么？他要等全世界的人都注意到他的时候，才在大众的面前表演换电灯泡。越自恋的人能做魅力总统的原因年觉得是什么？政治领袖能够制造出魅力的一个原因是，普通的人不愿意思考，很懒思考，会等救星。当我们发生危机的时候，假如有两个大师在你面前，你第一时间会怎样？请教他咯。大师，怎么解决啊？


    我们给一个方向给你们，你们注意了，我们给的是浪漫废话，我们给你的假逻辑，你一昕，哇，好舒服哦。那些越自我的领袖，给出越多假逻辑，就越能领导那些选民。记住，极端自我就是王。但是极端自我还会变成另外一种情况：亡!!!


    我们马来西亚人很喜欢吃米粉掺面，就是米粉里加面条，或者面条里加米粉，这个是我们马来西亚的饮食习惯，把面和米粉类的东西加在一起煮。有一次我们去一家很出名的福建面餐厅，我说要吃福建米粉面，那位服务员一下进入能量最低点，因为餐厅没有这种食物。提供服务员表现出很吃惊的样子，我也因为服务员那种吃惊的样子，一下也进入了能量最低点，我也想叫个米粉面要这么夸张么？


    过了一会，叫了餐厅老板出来，老板很拽的说：你们要吃什么？我说要吃福建米粉面，我给钱啊，我是消费者啊。老板继续很拽的说：我告诉你，我们这里是不煮福建米粉面的。很碉堡的样子说的。然后老板给出了一个好像很有道理的道理：煮面不容易煮烂，米粉容易煮烂，两个时间不对称的时候，米粉煮出来就烂了，口感就很差了，所以我们这里是不煮福建米粉面的，要么就是吃米粉，要么就是吃面。我当时就愣愣的说，我来一碗面吧。（笑）


    大家要注意了，你要看老板遇见什么人了。如果我当时不是进入能量最低点，被那个服务员的样子吓到的话，我会和老板说，不吃就不吃咯，你这样的态度，我很不爽。我走！但是我进入了能量最低点的时候，一点都发不起火灾，我不知道发生什么事情。大家想一下，如果这个极端自我我没有在这样的巧合情景下出现，会怎样？会失去一个客人咯。值得吗？


    我和江先生讨论这个问题，我们江魔是脑友，就一起讨论这个问题。江先生说：如果这个煮面的老板不断地用这一招的话，他会流失很多客人，因为他用这个很拽的态度嘛。其实还有一个方法，你依然可以极端自我就是王，依然可以做到更多的生意，应该怎么做呢？改变一下态度，态度好一些，用回同样的理由，不如此样，提出第三方案。接着先煮一盘面，再煮一盘米粉，然后给客人自己混合吃就行了。你们自己混起来吃，我们不这样混着煮的。这样做甚至可以卖多一份面或者米粉。


    如果他用回那么恶劣的态度，就会变成：极端自我就是亡！如果你们要做极端自我的话，你们要记得，看回那个效果。因为你不是做黑社会玩恐吓对方。


    **江**：那个福建面老板的目的，锁定在炒福建面这个专业里，所以他的行为就会这么做。如果他的目的是锁定在我要赚钱，尊严固然重要，但是赚钱更加重要。尊严可以摆在第二位，第一位当然是要赚钱。如果我的思考方向是，我要保住我的尊严，又让这帮傻瓜多买一份面，那么思考方向又不一样了，就会向应该如何推销这个方向来做。极端自我就是王的前提是，利用效果来做你的导向，这样就不会搞到自己不开心。这个极端自我需要用其他的性格来支撑，其中一个就是：傲！


    ### 三、 傲气与傲骨的修炼


    **李**：其实你们不用上激励课程，你们做生意，跟老板提一个意见，老板拒绝了你的意见，你们爽不爽？你们的情绪就会低落了。这个时候你就要上激励课程了。当你们提意见的时候，你们很担心老板会反对你们的意见；其实你是不够傲的。


    傲分成两种，一种叫做傲气，傲气是一个过程，是给你修炼的一个过程。什么叫傲气呢？举例，我在销售权谋课程，和客人讲了半天，客人坚决不上课，然后我就想：看你什么时候死！
    这就叫傲气。是我的话，我会借着这个情绪提升战斗力，但是要记得，这个傲气是帮不了你的。你诅咒他倒霉是帮不了你的，你要用的方法是，回忆你刚才说了什么，我以后应该用什么方法来对付他。当你修炼到一定时间之后，你就慢慢从傲气变成傲骨了。


    这个过程是怎么样的呢？心态的转变是有层次的分别的。你傲气修炼的时候可能会骂人，当修炼成傲骨的时候，他拒绝我和不拒绝我，我都没什么感觉。我头脑里的感觉只是，变换招式而已。我在想以后这样说行不行，那样讲行不行，不断去测试这些招式而已。


    **汪**：你有傲气是权宜之计，有的人被拒绝之后，就会变得自卑，你有傲气，就不会变自卑。当然这不是解决问题的最终方法，最终方法还是要的技巧上着手。傲气就是一个过程，最后变成傲骨。


    马来西亚讲师协会里有些人，非常希望得到演讲分享后的那些荣耀，很享受大家焦点在他身上那种感觉。这种人比较容易在台上紧张，他很喜欢别人留意他，同时他很害怕上台演讲。我本人从小到大上台演讲是没有问题的，不知道是什么原因。以前一对一讲话时候有问题，当然现在没有这个问题了。


    我上台演讲不是喜欢上台演讲那种感觉，我的同行的人生希望就是希望演讲到那些人很感动。我本人就没兴趣这些东西，当然你鼓掌我不介意，但这完全不是我要的东西。我最怕的就是你听完演讲之后不给钱！（笑）这是我最担心的~~有鼓掌也
    OK，没鼓掌也都 OK，最重要的要给钱。


    以前做说明会的时候，现场有些人是非常不给面子的，但是给钱报名！给钱就是老爸！只要肯给钱就行了，我是不介意给不给面子的。我对我的效果是锁定得很死，做讲师就一定要赚钱，第二是教别人东西，但是如果不赚钱的话，教什么都没有用。


    有的讲师会害怕，害怕学员现场提问，回答不了问题，他完全不在课室里面回答问题。我完全不害怕，能回答就回答，不能回答我就说不能回答。我完全锁定我擅长的领域，做到最后，最重要的要有那个傲骨。大家要留意，自我和傲有什么关系呢？训练你做的方法呢，一有人赞美你，很大方的去接受它，不要谦虚。


    **李**：你以前有不好意思，也要训练到自己不要不好意思。你们千万不要被中国的儒家文化欺骗，儒家文化和你说骄兵必败。骄兵必败是讲给民众听的，权谋家从来不会和你说骄兵必败。


    韩信没打过一场仗，可以做大将军，你认为他骄傲吗？诸葛亮经常把自己比喻成管仲乐毅。管仲是齐桓公的宰相啊。用现在话来说，他把自己比喻成比尔盖茨，自己没做过生意，就比喻自己是比尔盖茨。口气大不大？有骄兵必败这个意思么？他们在争取相位的过程中，全部都很有气势的。不会用什么骄兵必败教育自己。古代出门前的军令状，你没有傲气和傲骨，你是做不出来的。


    **汪**：如果一个环境是很动荡的，很危险的，你就不必用那么高的姿态，比如有害怕分子冲进来，说：哪个是江老师和李老师？我们肯定就跳到人群说他们俩不见了，你就不要那么高姿态跳出来。如果一个环境竞争很激烈，低调是一点用处都没有的。低调是给那些境界很高的人用的。李嘉诚可以低调，李嘉诚用低调包装自己，这样更可以让自己更高调。低调里边也有高调的作风。


    **李老师**：我们曾经去见一个上市公司的老板，这个老板是宗教团体里边帮人家排解疑难的。那个人表面上是很低调的，但是他说话很不低调的。有些人找他占卜一些事情，他说他不需要什么神通，只要看一看人，就知道对方性格上有问题，只要开解两三句人家就马上想通了。他似乎很低调说自己没这些特异功能，但是反过来想，只要讲两三句就可以开解别人，这就表示他很厉害很高调。上了位的人可以这么做，但是没有上位的人不要刻意去做这种低调。我本人就没有刻意去做高调低调，但是谦虚这个东西，我从前到现在都没有用过。我不会刻意做谦虚，不是我不谦虚啊。除非你遇到一些很厉害的人，那些人又正好是发工资给你的，那你就谦虚点，如果你没有遇到，你就不需要做谦虚。


    **李**：你学学谋，尽量要把“不好意思”的那些感觉给删除。


    马来西亚有一个印度餐厅，吃饭是自由给钱的，一般我们进去都会给合理的价钱。我们也不是那种厚脸皮的人。当你进去吃了很多的时候，你自由给钱时，是不是衡量一下自己吃了些什么东西才给那份钱，是不是？有一次我和刘小姐去吃，我们点了很多东西，吃了，很多。去给钱的时候你们知道我们给多少钱吗？给
    2 元！那个印度侍者非常惊讶地看着我们，对我们说：知不知道你们刚才吃了什么东西啊？我说：不是自由给钱的吗？他说：你知不知道你们给多少钱啊？我说：给 2 元咯。那个印度人脸色黑完。你觉得过分不这样做？印度人说你不是应该给
    5% 小费给我么？我说好啊，马上很爽快地给了他五毛。那个印度人都快疯了。


    其实呢，这个情况是要你们拿来做修炼的，当然不是叫你们天天做。当你们知道你们有这样的性格弱点呢，你要训练你自己。你去到一些高级餐厅有很一些很便宜的食物活动，你进去就先点那个最便宜的食物，不要觉得在高档场所选便宜的东西吃很丢人。但是很多人是过不了自己外在形象那一关的，外在形象其实是害你一辈子的东西。你要注意，你出去谈判，你为了包装自己，进到一个高级场所，就要很豪爽的浪费，那你不是中招咯？你要训练自己，将这些不好意思降到最低，你就会进步。


    **江**：我开什么车你们知道吗？我是开马来西亚最便宜而且是二手的车。当时李老师和我和一起去有车，刚开始我是看韩国车，然后又打电话咨询朋友听一些建议，我是想买二手车。去到二手车行，车行的老板很会推销，老板说：其实你看上这辆韩国车的话，你是看不上我们本地的国产车的。


    **李**：大家记得，这一招是很有用的，等下你们就会知道为什么有用。


    **汪**：老板继续介绍，然后还给我算了一笔账，我也觉得挺合理。我也问我朋友，问我妹妹。大家都说超值了。然后老板问我要一些定金，定金要 300 元。然后我对老板说：我没有！


    **李**：其实汪先生钱包里面有很大一沓现金的。


    **汪**：其实我是有 300 块，但是我和老板说：我没钱。老板说：“其实没有三百块也没关系，那就先给 50 块吧。”其实我不想给那 300 元是因为我不想做了这个行为之后，再去合理化它。有些人是做了一个承诺，之后就把它合理化，我就不想给自己有合理化的机会。老板说：“就给
    50 块吧，没理由你连 50 块都没有吧？”我说：“没有，真的没有 50 块。”我那是连面子都不要了。


    我当然可以做出我不好意思，说什么我真没钱了。但是我没有。老板当时都囧了、哈哈。之后峰回路转，我买了马来西亚最便宜的那款车。所以你不要把这些社会规范，那些不好意思，当成是你自己。当你察觉到你有那个情绪，就表示那个情绪已经不是你了。你要和自己说，我有这个情绪，但是我不是这个情绪；我有不好意思，但我不是不好意思。将它抽离，以后他对你的影响就会减轻。


    当然不是为了抽离而抽离，而是在抽离的过程中，对效果还是非常的注重。有的人问我，为什么你情绪少，其实我不是情绪少，而是我注重效果太多。我情绪是有，但是我把注意力集中在效果上，我感觉不到情绪的干扰。举例，你脚有点疼，觉得不舒服，我拿个锤子狠狠地敲你的头，你的头非常非常的疼，都飙血了。这时候你还会注意脚那一点点疼吗？如果你的注意力是放在效果上，情绪这个东西你自然不会那么的注重。


    **李**：所以各位的功课就是，久不久要做一些不要面子的事情。做那些事情，是一个很好的体会，以后还可以跟你的朋友分享，哇，好过瘾。但是不要天天做就好了。哈哈。


    **学员提问**：当那些人看着你，你做那些不要脸的事情，我都会不好意思啊。比如把价钱压得很低的时候。所有人都会看着你啊，老板大声和你说话的时候。


    **汪**：当时李老师那种情景是，侍者在用群众压力。你把这个情景用个名字描述“群众压力”，你的情绪反而就不会那么大了，你知道他在用一个技巧。


    **李**：当所有人注意我的时候，我是将所有的群众压力转移视线的。我和那个侍者说：“你不是说随便给钱的吗？”其实是挺难的。当时所有的人应该都在想，这两个人是不是那么不要脸啊？但是他们这群人是无声的木偶而已嘛。其实店家也会想，这么多人看着我，我情愿让这俩傻逼占我便宜，也不要让这么多人觉得我是坏人吧。


    **江**：那些人其实你根本不会再遇到他。


    **李**：这个世界是很大的，一个餐厅那么大的人流量，谁都不会记得我，所以根本无所谓。但是如果我是首相，我就不会那么做了，哈哈。


    ### 四、 狂性与时机


    **江**：这个就是傲了。另外一个支撑着自我的性格，就是狂。有一句话说：历史是由疯狂的人制造的，毛泽东也好，爱迪生也好，都是些疯狂的人。狂就是有点点神经病，有点点神经病的时候，你就不会太注重那些社会规范的东西。当世界上的人晚上都要点蜡烛才能看东西的时候，爱迪生说我能不能不点蜡烛也能看到东西呢？


    根据一个研究，那些有精神分裂症的家族，他们的成就比起普通的家族在一些方面要高，比如艺术，创意，音乐，宗教情操等等。希特勒在德国的时候，让全国那些不正常的人结扎，哪怕只是外形畸形，更不用说是精神病家族那种。几代之后，德国就不会有精神病人了。但是负责实验的人员发现，那些德国的名人或者科学家，他们的家族里面，或多或少都有一些精神分裂等方面的问题。


    当然你自己千万不要有精神病，但是如果你有做到少许精神病的象征，对你来说是一种竞争力。


    **李**：有些勾魂的招式，别人可能不太敢使用，但是你要敢用。我们在勾魂一书里说过一个卖信用卡的例子，普通人都是问别人要不要信用卡，而那个人逢人就问：有没有买六合彩啊？这个不是每个人都敢用的。就像我们刚才说那个吃东西只给
    2 元钱的例子，只有够狂的人才敢做。


    根据易经卦象说的，乾卦九四爻，九四：或跃在渊，无咎。象征着人生经过奋斗，到了一个小山峰，象征你有了一个小小的成就。但是你一望前方，还有一座更高的山。当人走到这个运程的时候，一定要有心理支撑做一个变化，不是失去理智。他就少了一些理智，多了一些狂性。他能够胆跳过去，要么摔死，要么成功。


    所以要问一问自己的心态，敢不敢跳过去，如果不敢，就别跳，时机未到。你要有这样的天时地利人和。人和不是说你身边有没有贵人。人和是指你的心境有多狂，当狂到一定程度，跳了过去，就到了九五卦，九五卦是九五至尊，飞龙在天。所以有人占卜看卦象你要问问自己，卦象是走到这里，你的心境到了这里吗？如果你觉得你的狂态不够，你不敢跳，你一害怕，就会摔死。它不是说绝对，它说是或者，意思说
    50% 的几率。


    NBA 的姚明大家都知道，姚明的教练曾经说他打球很斯文，不够奸诈。你们知道打球的人肯定都是有点小动作的，没这些东西你没办法打比赛。打球的人要突出，是不能太守规矩的。那个教练就教姚明讲粗口，要粗鲁，不仅是对对方球队的人，对自己队友也要说。甚至在训练中和队友讲粗口，“give
    me fuck the ball!” 经过一段时间，他的狂态出来之后，他在 NBA 的技术就会进步。有报纸曾经刊登一个标题：变坏的孩子才会赢。


    **江**：姚明太守规矩，他的教练教他讲粗口，就能有效激发狂态。这个行为是挑战你那些不必要的社会规范。不是叫你说粗口你就是大师。假如一个人讲粗口已经讲到麻木，那当然没有效果。当然不是教大家要讲粗口，最重要的是他要挑战这个社会规范。


    **李**：做生意你敢对客人做一些狂的手段出来，是有机会做成生意的。我去谈一个生意的时候，我了解到争取这个订单有很多竞争对手，没有太大的把握能拿到订单。抱着试一试的心态和对方的经理进行谈判。我和对方的经理在谈判的过程中，我没经过他的同意，就突然打电话回我的工厂，当着对方经理的面，说要准备准备什么货。突然间把电话给对方经理，说：“经理，你看还有什么需要的，你和我们的股东说一下。”


    你们看，我这样做礼貌吗？不礼貌吧，我简直是侵犯了对方的自主权。我当时的心态就是赌一把，赢了就做下去，输了最多就不做这一单生意。他当时是有一点点不高兴，但是他爱面子嘛，他不会骂我。如果有一些大胆的人，马上说：“我什么时候跟你下达订单？”
    然后盖掉电话，他不就赢了吗？但是那个经理爱面子，他要包装自己成好人。


    然后我给他在电话里和我们的股东很礼貌的聊完之后，我就直接和他说：“出订单吧。” 当然，这个不是成功的必然标准，我是说你已经没有什么把握了，你也不知道会不会成功，不如赌一把咯。赢了就飞龙在天，输了最多就是没有了这个订单。所以有时候，你是要赌一赌的，要有点狂的心态。


    **江**：我是建议学生在修炼当中，尝试去得罪一些不重要的人。我希望你们明白，踩过对方的界限的感觉是怎样的。我的意思是说，不是什么人的界限都踩啊，你要选一些不重要的人，去尝试一下。左青龙右白虎的黑社会你就不要去惹了。哈哈。

