    # 转局破局的信念：


    +   1. (1)具有忍痛放下的大气魄和勇气。

    2. (2)我越在乎的，越想要的，对我越重要的，越要用平常心看待，绝不可患得患失。

    3. (3)只要你成为我的客户 / 情侣，就是你最大的福气···


    | 踩进格局的情景 | 令你失去主控权的言谈 |

    | :--- | :--- |

    | 我是做 uniform 的…… | 我已经有 suppliers……而且他算到我很便宜，他还可以为我做……（他刻意抛出你的竞争者，可以下设他想要的条件，要你自动降格附合他想要的额外需求。）
