    3 块钱来用下啦，帮下忙，刚出来没钱用啊。我朋友就说，没钱啊。你一说没钱，他口气一软，帮下忙，3 块了。我朋友就很机械式地，给了 3 块钱他。一给完钱，oh，shit，为什么我会给他。哈。这里的关键点就是，已进入能量最低点，就要马上说，过来过来，不要挡住其他人。其实都没有挡住其他人。只是走几北路而已了，在那边继续讲。不要小看这移动几北路，这是谁服从谁？


