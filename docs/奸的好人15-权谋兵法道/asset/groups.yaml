    汪：当你知道资讯不对称也好，阴谋论也好，我们玩权谋的人目的是要效果而已，而不是去争一口气，千万不要去揭穿对方的老底。就是你买了之后你别再问别人一句你开始不是不想卖给我么，怎么又卖了？举例在街边买东西讨价还价，一个人对卖家说，你的东西怎么那么贵，别人的才多少多少钱，这个是一个明显的资讯不对称，别人的便宜为什么要在这里和我说，直接去便宜那家买就好了。卖东西的人可以和对方推来推去找理由，但是千万不要说，人家的便宜，你为什么不去买人家的？一旦揭穿了对方，就不是做生意了，做生意的目的就是要那个效果，就算你没有任何的技巧，你也不要揭穿对方的资讯不对称。你自己知道就好，不要去揭穿对方。就算你和他讨价还价半天，总之什么都好，就是别揭穿对方老底。


    李：千万不要只是相信别人口头上说的资讯。一定要看对方的行动。


    汪：当你有了阴谋论的概念，你就比较容易分析出这些人背后的动机。当你有了这些概念，会不会对你的人际关系有些阻碍呢？我们不排除这个可能性，我们称之为中权谋毒。中毒的意思是，比如人家请你喝茶，叫你请坐请坐，你会想对方叫我坐？是不是想让我顺从他的意思，这样他就取得主控权？初学的时候中权谋毒是不奇怪的，你知道这个中权谋毒，你就会思考自己有可能中毒了，那将来你是有机会可以复原。就像我们开场时候说，字眼帮助你思考，加速你思考，但是也会窄化你的思考，这个是避免不了的，任何利害的方法都是双刃剑。唯有你制造出更多的字眼，字眼越多的时候，你思考的角度就越大，这样就不会那么容易窄化你的思考模式。一个宗教，在开办的时候，一定要制造自己的那些术语，每一个宗教都有，基督教，佛教，都有。制造这些术语之后，你就开始用这些术语来看这个世界，就方便他的教义不断地去深化，这个是他的好处，当然他有没有坏处呢？对宗教散播是很好的。对信徒的思考未必有百分百的好处。它会封锁你的思维，所以你看他的资讯和一些字眼是有冲突的，你就会想这些不是真的。那我们有没有用这样的方法来对我们的学生呢？我们是有的，我们用的一些字眼是很噁心的，甚至你一听到呢，头脑里面会有很强的印象，所以一些学生说，看了我们的书之后，看别人的书很辛苦。当看别人的书时，怎么没有勾魂的？大哥……不是有勾魂的书就是好的啦。有的书时有勾魂，有内容，有的书是有勾魂，但是没内容的，有的书是没勾魂，没内容，有很多的可能性。我的意思是说，你要学习的目的，不只是要看勾魂，勾魂看起来是很过瘾，但是你要明白勾魂的招式怎么出，里面的内容又是些什么，那么你就可以很快将一本书那些次要的东西删除，看到里面重点的内容。我和李老师看的书，有一些是非常闷的，是比较学术性的，学术性的书不可能勾魂，但是这些书非常有价值。所以你做学者，是不需要搞勾魂，但我不知道你要不要做学者，如果不是做学者，那你要会散播一些噪音。


    李：我想问下大家，政治家一般都是怎么样的？会讲不会做嘛，是不是。别以为美国的政治家就很好啊，其实也一样，会讲不会做。有个科学家就对政治家的演讲做了大量的研究，他把总统的演讲分成几种类别：话术，内容，愿景，表演手法，肢体语言。大家都知道，我做演讲的时候被人家批评过，有一次在马来西亚演讲，演讲到一半的时候，有个人就说这个讲师没水平的，我就问为什么觉得我没水平呢？他说我演讲的时候站的姿势不对，我们演讲又插裤袋，又写又画，又看下资料，又看提纲，这种就是没专业受过训练。哎呀，其实我也承认，我是没专业受过训练。刚才我们说的几种类别呢，第一种情况就是全部都有，又有话术又有内容又有表现手法，百年难得一见。但是很少人是全部都有的，比如二战时候的丘吉尔。


    科学家研究发现有两样东西是很惊讶的：


    - 有话术，没内容，没表现手法；

    - 无话术，有内容，有表现手法。


    学者的角度看，有话术是什么意思呢？假设你去应聘，你和老板说：老板，其实今天我来应聘，你们公司有三个理由不聘用我。听清楚，这个是话术，是招式来的……，那普通人只会说，老板，你聘用我有三个理由。但是教话术的人呢，教你说：“老板，你有三个理由不聘用我！


    其中一个理由就是，今天我到这里来，你是不是觉得我像在背台词？如果我不背台词，我担心我的竞争力不够，所以我要做足功课来背台词。如果我不背台词，我什么机会都没有，如果我背台词，还有一线机会。但是为什么我把这个列入第三个你不聘用我的理由？理由很简单，因为我相信你是个人很有经验的人，我一背台词，你一定看得出来。”这个就叫话术，大家明白吗？其实这个招式是背出来的，这个就叫做有话术，没内容。如果你说的时候很紧张，说的断断续续就是没表现手法了。政治研究人员研究出一个结论，如果有话术/没内容/没表现力的人与没话术，有内容/有表现力的人竞争，那个有话术的人一定中选。为什么呢？因为人的头脑是跟着感觉走的，就像刚才讲的那个故事，第三个不聘用我的理由，是因为我像在背台词，我背台词的目的，是来搏一搏，如果不背，一点机会都没有。


    当面试官听到这句话的时候，第一时间大脑的骗子就跳出来了，他忘记了对方这段话其实就是一个话术来的，即使最笨的人，你教他练这一招，他也能练出来，但里面是没内容没表现力的。而面试官大脑的骗子跳出来，让面试官觉得，这个人好真诚，好感动啊！！！我觉得这个人好真诚啊！！！其实那个人是不是真诚呢？可能真诚，可能不真诚，你是不知道的。为什么会有这种感觉呢？因为话术会带着他那种感觉，他的感觉出来了，一出来，大脑的骗子也就出来了，合理化的解释这个人很真诚，即使他技术差也不要紧，我们公司有最强的培训系统，我可以训练他成为人才！这样的解释一出来，就会加固了选民或者是老板对这个人的信心。我曾经教过一个学生，他讲话表现力是很差的，但是他是做很多功课的，他讲很多台词写出来做成纸条，他说：李老师，我没有口才，如何做销售呢？很头疼啊。


    他说曾经有一次讲到一半，很紧张，手上拿着写好的台词和客人说话，他问我发生这种情形怎么办？我说这样很简单，用话术来包装，你做销售多紧张都没关系，你讲话表现力差也没关系，就算是看着台词对客人讲也没关系，你当对着面的背完台词，你就把台词放下，然后对客人说：“你觉得我今天和你做生意讲话是不是很奇怪？很官僚，像是在背书一样。为什么呢？因为我在背台词和你说话，我只有一个目的，因为我想做好这份工作。如果我不背台词的话，我连这份工作都做不了，我背台词是因为我想做好销售这份工作。”当他这样一说完，通常那些客人就很感动，说：慢慢来，年轻人，你有什么东西买？我看一看。其实人是没有那么有头脑的，他没有资讯不对称或者阴谋论这样的概念，他的头脑第一时间是跟着感觉走。


    甚至英伦集团的经理听他说完，被感动到不行，甚至要教他怎么销售。这个就是话术的力量。你学权谋，我们的责任是要教会你出招，同时让你不要被招式所迷惑，你用这些资讯不对称或者阴谋论的概念，让你明白话术的用处以及研究政治家得出的结果，话术比内容，比表现手法更加重要，学权谋还要有一个心态，这个心态就是：只准州官放火，不准百姓点灯。也就是说，我们权谋行者，要看内容，我们要明白人是的这种人性的弱点，我们不要被迷惑，但我们做生意时要用话术，出去迷惑别人。简单来讲，就是说废话咯。这就是作为权谋行者的本色。我们不是鼓励你去做老千，我们是让你明白这种现象是什么。


    江：上权谋后，你要明白大多数人其实是笨蛋。选民多数是很笨的，在美国，政府比较注重人权，政府注重人权的目的，就是为了公关，他的目的就是为了让人变笨。当你有了话术的时候，你的竞争力就会变强，如果你的招式不够多，你的功力不够深厚，另一个功力深厚的人对你出招，你要破解也是非常简单的，虽然你不一定马上能还招，但是你要防身是很简单的，只要你怀疑这个人在出招，他就很难对你下任何的招式。你在怀疑他，是不是在出招啊，只要你有这样的怀疑，无论对方是不是在出招，你中招的几率就会降低了。


    李：我们《冷血救世》里写过：误信，不如不信。这个观点你们要放在头脑中，就可以防止被骗，起码你有一个防身的技能。在马来西亚，很多人会看头衔，比如说拿督。我们的一个学生从英国回来，很辛苦地凑了一笔钱，在马来西亚开一家餐厅。他父亲的一个朋友，是一个拿督，这个拿督来到他的餐厅，就扮成很这款的样子，显得很有兴趣对餐厅进行投资。对我的学生说，这里应该如何如何装修，那里如何管理，又该怎样怎样发展，和他说了
    ABCDEFG 一大堆东西，给了一大堆意见。做什么连锁之类说的我学生心痒痒，我学生就对他说明拿督我没钱做呢。然后他对我学生说，有意向给他投资 200 万。我学生听了非常兴奋，今天出来见贵人了。大约过了一个星期，拿督到我学生的餐厅里，显得很心急的样子，说：我今天和工人去买点货，我没有带现金，人家不给我刷卡，你能不能先借我
    2000 马币？ 拿督问一个普通人借两千块，你想想，这个即将为你餐厅投资 200 万的人，问你借两千块而已嘛，有没有关系呢？没有关系嘛，很合理啊，可能对方在考验我呢？我的学生就开始分析了：如果我不借给他，可能会得罪他，然后他就不会在我这里投资了。
    接着就二话不说，马上借两千块给拿督。在三个月之内，这个拿督都用这方法借了一万多马币，每一次这个学生都会出现一个合理化的解释。其实你们要知道一样东西，如果我学生有资讯不对称这个概念的话，你想他会被骗一万多块吗？一个拿督，要在我餐厅投资
    200 万，经常身上连几千块都没有？**你们千万不要合理化一样东西**，那些有钱人，不是整天带现金的，他们都是刷卡，千万别这样想。要给你投资 200 万，问你借几千块，这个第一个资讯不对称，如果你从阴谋论来看，一个普通朋友，来到你的餐厅，给你一些建议，然后就给你投资几百万，你觉得会有那么幸运的事吗？当然，我不排除人会后中六合彩，但是一个普通朋友，跟你非亲非故，给你投资两百万，还把经营权给你，有这种好事吗？如果你是那个拿督你投资
    200W 你要不要经营权？恩？他又不认识你，这个就是资讯不对称了，你从阴谋论和资讯不对称下手，在他没想到招式骗你之前，你也不会那么轻易上当对不对？


    江：所以这个资讯不对称的概念，是方便你会观察，提高你的观察力。但是会观察不代表会出招。只是代表你会分析，会分析是一回事，**做不做得到是另外一回事**。有的人是没办法分析，但是有办法做到。我们的书里提到一个老胡的人，他是没有办法去分析的，他分析的时候，天南地北的讲，自己都分析错了，但是他有办法能做到。


    李：我有一个朋友是做家具生意的，他有办法培训那些销售员，让客人一进到店里的时候，就马上可以把客人锁定住听销售员讲。他让那些客人一进店 家具店，就可以不马上问价钱，而是好奇的听他讲，不一定马上成交，但是客人会暂时把主控权交给了销售员：


    他问客人：“你介不介意告诉我，你买家具是因为家里是从新装修呢，还是新房入住呢？如果你是新房入住或者是从新装修的话，你会不会介意让我知道，你需要哪种类型的家具？或者，在我们卖家具的专业人士的角度，可以给到你一些建议。如果你有设计图拿来的话更加好，我们坐下来让我分析给你听，告诉你如何帮你搭配。”你想一想，如果你是消费者，你与否愿意听这个销售员继续讲下去？你是一个客户，你进到店里，不一定会听完他的建议，但是你心里面会想，听一听又何妨呢？听一听又没有什么损失。所以呢，你会暂时把主控权交到他那里。


    所以他这一句话术，就可以快速的锁定客户听他讲。我们分析这一招的用处时，我们问那个朋友：你是怎么想出来用这一招的？这一招有什么用处呢？朋友回答：买家具都是这样的啦！ABCDE
    讲了一大堆，但是都没讲到重点。你们看看，有内容有表现手法，但是他没话术的时候，跟你讲了一大堆，你都听不明白，你学东西是不是很慢啊？我建议你们**找一个脑友，观察一些现象的时候，用术语对现象进行描述**；这样你们看东西是会比较深入一些的。


    江：李老师那个朋友，有些招式是非常厉害的，我们听的时候都觉得很惊险，但是他本人就没有办法能够解释得到，他解释出来都是废话。可是他就是有办法能想那些招式出来，绝对是个招式王。这个人呢，就是因为搞太多这样的招式，导致出现了很多其他的问题，出现新问题的时候，又要去想招式，所以他想招式的速度就是这样训练出来。这个人和别人一接触的时候，它会尽快的让对方尊敬他，他会很快的跟你有共同语言，很快的能找出你喜欢的话题，这方面他非常拿手。当他找到你喜欢的话题之后，他就令你非常的尊敬他，敬佩他。这个就是他的思考模式。


    他先要有这样的目的，才能看到这样的效果，他出招的时候，是不管出什么招的，总之就是能尽快达到这样的效果出来，他就是有办法能做到，但是让他解释，他就解释不出来。我们给两个方向给你们，一个方向就是，你用李老师的朋友的那种思考模式，就是不停的乱出招乱出招，可能可以达到那样的效果。另一个方向就是，我们给这些招式命名，对这些招式有了概念，然后再去用，用的时候，一样要以有没有效果为标准。我们有一些学生，学完之后就知道有这么一回事，知道之后我的心就会比较定，但是对他来说，他不会出招。这是因为他不注重效果。


    李：反方向的思考其实是很简单的，曾经有一个马来西亚讲师界的老前辈，分析销售员如何做销售，他说做销售有几种东西是很重要的，第一个层次是优越感，第二是让客人有利润的感觉，第三是爱心，第四是讲恐惧，第五是讲需要。大家要注意了，这些不是我们要教的东西！


    江：我们要跟大家分享的是：我们一得到一些资讯，我们是怎样分析以及应用这些资讯。


    李：你们想一想，那个讲师的说法，是不是能让一个刚开始学习方法的销售员首先有一种安心的感觉？比如买 BMW 的客人，是不是追求一种优越感？客人买东西有时候是很虚荣的。你一听，对哦！很有道理哦！为什么这件衣服那么贵还有人抢着买呢？为啥
    A 货也有人去买呢？因为他追求的是优越感。你听起来是不是很有道理呢？你完之后就有一个感觉：安心。但是当 我们听到这一类的资讯，我们的反应是，没错，确实是制造了优越感，但是我本身会不会因为优越感而买这个东西呢？我首先第一时间会想，什么是我要的？假设我是卖药的，我去见一个医生，能不能凭借优越感让他买东西呢？


    各位来上课的学员，会不会因为优越感会让你从钱包里拿钱出来上我们的课程呢？你有很大的可能性是从利益，然后是恐惧，再接着是需求，来激发你的购买欲望的。


    江：那个讲师说，你推销一样东西，先从优越感开始推销，如果推销了优越感，反应不是很大，就推销利润，再推销利益，如果反应还不大，再推销爱心，不行就吓他。如果还不行，再讲需要。他是这样解释的，他讲完我也抄下来，我不是认为这个东西正确，我是觉得这个素材可以让我去放噪音。我不敢说他绝对正确还是错误，但是我就是利用这个资讯来放噪音而已。他之后就说一个客人会有五种可能性不跟他买。一不需要，二不急买，三没兴趣，四不相信，五是没钱。


    李：当你听到一些资讯，这些资讯让你很安心，听完很舒服了，但是你要会演变成你的招式出来。如果讲师要骗学生，就编刚才那套理论出来，比如你知道为什么生意难做吗？先编一套故事出来，让你知道销售员的生意很难做，先挑起你的痛苦，然后告诉你不跟你买的原因是没需要，你听起来好像很有道理，没兴趣，对啊，他不急，是啊很有道理。这个是他不买的原因。那么怎样让他买呢？就照这个架构，先制造他的优越感，然后再者是利润，再次是爱心，再讲需要等等，讲师这样一说，似乎解决问题的方法就出来了！你听完之后就觉得很大安心了。所以，你们要注意，这一招就是给你们制造话术的方法。（这一段是一边写黑板一边讲的，因为没有看到黑板写得内容，单从语音上可能理解不是很透）


    江：假设你对你的客人说：你有五种情况不会跟我买。其实这是一个盗雷的招式，所以对方听了就觉得很舒坦，舒坦之后你再跟他继续讲。各位有没有记得我们在书里说的成功者五大元素？五大元素你说哪个元素最重要？？其实这就是制造噪音的方法。你和他说你不买有五个原因，那五个原因里面，你觉得哪一个是最重要的呢？让对方先讲出来，讲出来之后再跟他做天堂地狱法；我们明天会讲到天堂地狱和千问局属，然后就在他的答案里面，再对他进行销售。但是这套东西是否是真的呢？可能是完全没有根据的，只不过他有办法做到这样的效果出来，你要会制造一些噪音出来。比如一个人很害怕大象，他经常幻想大象来追他，但是他知道大象怕老鼠，那你就给他一个盒子；告诉他盒子里面有老鼠，其实盒子里是没有老鼠的，只要你让他“以为”有老鼠就可以了，他便会安心。其实大象是不存在的，老鼠也是不存在的，我们只是用假的药来治疗他假的病。


    李：大家是否记得我们说过价值都是假的？当一个销售员使用话术来包装的时候，你会觉得这个销售员谈吐不凡，他会让客人觉得在他身上可以获得一些特别的资讯，当你有办法能够包装一些资讯的时候，你的客人会因此而欣赏你。


    江：如果你能模仿我们的成功者五大元素的理论来制造一个你自己的理论出来，每当遇到客人的时候，就讲给他听，讲给他听的过程当中，其实就是在给他洗脑，给他灌输一些价值观，接着你就可以影响他，明天的课程我们会教你们勾魂夺心，最好你要带一本《勾魂夺心洗脑》来上我们的课，明天我们会讲到成功者五大元素，你可以照搬照眠的跟别人说的，是有办法让别人很尊重你的。假设对方的身份是老板，是地位高的人，你照搬照眠背出来给他听就可以了。那明天我们会解释为什么你背的时候有这样的功效，将来我们可能会制造新的理论出来，制造新的噪音。好，现在是休息时间。


    （休息时间……）


    江：其实我们不必时时都处于一个高的位置，有些时候你可以这么做（有时候可以不这么做），但有些时候你遇到一些人格局是非常强的，你不需要指出来，指出来反而对你没用处，我们是教如何做生意，如何赚钱，如何得到对方的妥协，不是教你黑社会式的谈判，黑社会的谈判是你大我，我又大回你，虽然格局变得很强，但达到的效果就是大家火拼，这不是我们的目的。我们目的是大家赚钱而已。有一个地方有一些社工，这些社工帮助一些有问题的人，那些有问题的人经常就会骂社工，有一个社工，干了很长时间，但从来不会有人骂他，别人很奇怪就问是怎么回事，他说：“我会沟通，会了解对方痛苦，会聆听等等，还有重要的一点，我会将对方坐的凳子调得高一些，将自己的凳子调得低一些。当别人坐下来的时候，别人就高了一些，我就矮了一些，我用这种矮的姿态跟对方沟通，对方态度就不会那么差。”我暂时没有去证实这个故事的真实性，我的意思是说，当你遇到一些客人主控权是很强的，比如你遇到李嘉诚，你在他面前对他说我不需要你，其实就是资讯不对称，因为你不需要他的话你没必要讲出来嘛，你再对他说，有钱人没什么大不了呢，这就是资讯不对称的话语，没啥大不了的话就不需要在他面前说

    '
  mdcn: '

    理拿走之后，应该谁先出价，才能拿到这个主控权呢？当然是**先开价的拿到主控权**了。有两个方法，一个是讲故事，比如这个 ABC 先生，曾经出价 2300 万买这块地，我们目前希望成交的价格是
    2300。假如你是买家，一开始从哪里开始谈呢？就从 2300 万开始谈了。先开价的人就会有稍微多一点的主控权。而你是要从我要求的标准把价格压下去。


    汪：当你知道资讯不对称也好，阴谋论也好，我们玩权谋的人目的是要效果而已，而不是去争一口气，千万不要去揭穿对方的老底。就是你买了之后你别再问别人一句你开始不是不想卖给我么，怎么又卖了？举例在街边买东西讨价还价，一个人对卖家说，你的东西怎么那么贵，别人的才多少多少钱，这个是一个明显的资讯不对称，别人的便宜为什么要在这里和我说，直接去便宜那家买就好了。卖东西的人可以和对方推来推去找理由，但是千万不要说，人家的便宜，你为什么不去买人家的？一旦揭穿了对方，就不是做生意了，做生意的目的就是要那个效果，就算你没有任何的技巧，你也不要揭穿对方的资讯不对称。你自己知道就好，不要去揭穿对方。就算你和他讨价还价半天，总之什么都好，就是别揭穿对方老底。


    李：千万不要只是相信别人口头上说的资讯。一定要看对方的行动。


    汪：当你有了阴谋论的概念，你就比较容易分析出这些人背后的动机。当你有了这些概念，会不会对你的人际关系有些阻碍呢？我们不排除这个可能性，我们称之为中权谋毒。中毒的意思是，比如人家请你喝茶，叫你请坐请坐，你会想对方叫我坐？是不是想让我顺从他的意思，这样他就取得主控权？初学的时候中权谋毒是不奇怪的，你知道这个中权谋毒，你就会思考自己有可能中毒了，那将来你是有机会可以复原。就像我们开场时候说，字眼帮助你思考，加速你思考，但是也会窄化你的思考，这个是避免不了的，任何利害的方法都是双刃剑。唯有你制造出更多的字眼，字眼越多的时候，你思考的角度就越大，这样就不会那么容易窄化你的思考模式。一个宗教，在开办的时候，一定要制造自己的那些术语，每一个宗教都有，基督教，佛教，都有。制造这些术语之后，你就开始用这些术语来看这个世界，就方便他的教义不断地去深化，这个是他的好处，当然他有没有坏处呢？对宗教散播是很好的。对信徒的思考未必有百分百的好处。它会封锁你的思维，所以你看他的资讯和一些字眼是有冲突的，你就会想这些不是真的。那我们有没有用这样的方法来对我们的学生呢？我们是有的，我们用的一些字眼是很噁心的，甚至你一听到呢，头脑里面会有很强的印象，所以一些学生说，看了我们的书之后，看别人的书很辛苦。当看别人的书时，怎么没有勾魂的？大哥……不是有勾魂的书就是好的啦。有的书时有勾魂，有内容，有的书是有勾魂，但是没内容的，有的书是没勾魂，没内容，有很多的可能性。我的意思是说，你要学习的目的，不只是要看勾魂，勾魂看起来是很过瘾，但是你要明白勾魂的招式怎么出，里面的内容又是些什么，那么你就可以很快将一本书那些次要的东西删除，看到里面重点的内容。我和李老师看的书，有一些是非常闷的，是比较学术性的，学术性的书不可能勾魂，但是这些书非常有价值。所以你做学者，是不需要搞勾魂，但我不知道你要不要做学者，如果不是做学者，那你要会散播一些噪音。


    李：我想问下大家，政治家一般都是怎么样的？会讲不会做嘛，是不是。别以为美国的政治家就很好啊，其实也一样，会讲不会做。有个科学家就对政治家的演讲做了大量的研究，他把总统的演讲分成几种类别：话术，内容，愿景，表演手法，肢体语言。大家都知道，我做演讲的时候被人家批评过，有一次在马来西亚演讲，演讲到一半的时候，有个人就说这个讲师没水平的，我就问为什么觉得我没水平呢？他说我演讲的时候站的姿势不对，我们演讲又插裤袋，又写又画，又看下资料，又看提纲，这种就是没专业受过训练。哎呀，其实我也承认，我是没专业受过训练。刚才我们说的几种类别呢，第一种情况就是全部都有，又有话术又有内容又有表现手法，百年难得一见。但是很少人是全部都有的，比如二战时候的丘吉尔。


    科学家研究发现有两样东西是很惊讶的：


    - 有话术，没内容，没表现手法；

    - 无话术，有内容，有表现手法。


    学者的角度看，有话术是什么意思呢？假设你去应聘，你和老板说：老板，其实今天我来应聘，你们公司有三个理由不聘用我。听清楚，这个是话术，是招式来的……，那普通人只会说，老板，你聘用我有三个理由。但是教话术的人呢，教你说：“老板，你有三个理由不聘用我！


    其中一个理由就是，今天我到这里来，你是不是觉得我像在背台词？如果我不背台词，我担心我的竞争力不够，所以我要做足功课来背台词。如果我不背台词，我什么机会都没有，如果我背台词，还有一线机会。但是为什么我把这个列入第三个你不聘用我的理由？理由很简单，因为我相信你是个人很有经验的人，我一背台词，你一定看得出来。”这个就叫话术，大家明白吗？其实这个招式是背出来的，这个就叫做有话术，没内容。如果你说的时候很紧张，说的断断续续就是没表现手法了。政治研究人员研究出一个结论，如果有话术/没内容/没表现力的人与没话术，有内容/有表现力的人竞争，那个有话术的人一定中选。为什么呢？因为人的头脑是跟着感觉走的，就像刚才讲的那个故事，第三个不聘用我的理由，是因为我像在背台词，我背台词的目的，是来搏一搏，如果不背，一点机会都没有。


    当面试官听到这句话的时候，第一时间大脑的骗子就跳出来了，他忘记了对方这段话其实就是一个话术来的，即使最笨的人，你教他练这一招，他也能练出来，但里面是没内容没表现力的。而面试官大脑的骗子跳出来，让面试官觉得，这个人好真诚，好感动啊！！！我觉得这个人好真诚啊！！！其实那个人是不是真诚呢？可能真诚，可能不真诚，你是不知道的。为什么会有这种感觉呢？因为话术会带着他那种感觉，他的感觉出来了，一出来，大脑的骗子也就出来了，合理化的解释这个人很真诚，即使他技术差也不要紧，我们公司有最强的培训系统，我可以训练他成为人才！这样的解释一出来，就会加固了选民或者是老板对这个人的信心。我曾经教过一个学生，他讲话表现力是很差的，但是他是做很多功课的，他讲很多台词写出来做成纸条，他说：李老师，我没有口才，如何做销售呢？很头疼啊。


    他说曾经有一次讲到一半，很紧张，手上拿着写好的台词和客人说话，他问我发生这种情形怎么办？我说这样很简单，用话术来包装，你做销售多紧张都没关系，你讲话表现力差也没关系，就算是看着台词对客人讲也没关系，你当对着面的背完台词，你就把台词放下，然后对客人说：“你觉得我今天和你做生意讲话是不是很奇怪？很官僚，像是在背书一样。为什么呢？因为我在背台词和你说话，我只有一个目的，因为我想做好这份工作。如果我不背台词的话，我连这份工作都做不了，我背台词是因为我想做好销售这份工作。”当他这样一说完，通常那些客人就很感动，说：慢慢来，年轻人，你有什么东西买？我看一看。其实人是没有那么有头脑的，他没有资讯不对称或者阴谋论这样的概念，他的头脑第一时间是跟着感觉走。


    甚至英伦集团的经理听他说完，被感动到不行，甚至要教他怎么销售。这个就是话术的力量。你学权谋，我们的责任是要教会你出招，同时让你不要被招式所迷惑，你用这些资讯不对称或者阴谋论的概念，让你明白话术的用处以及研究政治家得出的结果，话术比内容，比表现手法更加重要，学权谋还要有一个心态，这个心态就是：只准州官放火，不准百姓点灯。也就是说，我们权谋行者，要看内容，我们要明白人是的这种人性的弱点，我们不要被迷惑，但我们做生意时要用话术，出去迷惑别人。简单来讲，就是说废话咯。这就是作为权谋行者的本色。我们不是鼓励你去做老千，我们是让你明白这种现象是什么。


    江：上权谋后，你要明白大多数人其实是笨蛋。选民多数是很笨的，在美国，政府比较注重人权，政府注重人权的目的，就是为了公关，他的目的就是为了让人变笨。当你有了话术的时候，你的竞争力就会变强，如果你的招式不够多，你的功力不够深厚，另一个功力深厚的人对你出招，你要破解也是非常简单的，虽然你不一定马上能还招，但是你要防身是很简单的，只要你怀疑这个人在出招，他就很难对你下任何的招式。你在怀疑他，是不是在出招啊，只要你有这样的怀疑，无论对方是不是在出招，你中招的几率就会降低了。


    李：我们《冷血救世》里写过：误信，不如不信。这个观点你们要放在头脑中，就可以防止被骗，起码你有一个防身的技能。在马来西亚，很多人会看头衔，比如说拿督。我们的一个学生从英国回来，很辛苦地凑了一笔钱，在马来西亚开一家餐厅。他父亲的一个朋友，是一个拿督，这个拿督来到他的餐厅，就扮成很这款的样子，显得很有兴趣对餐厅进行投资。对我的学生说，这里应该如何如何装修，那里如何管理，又该怎样怎样发展，和他说了
    ABCDEFG 一大堆东西，给了一大堆意见。做什么连锁之类说的我学生心痒痒，我学生就对他说明拿督我没钱做呢。然后他对我学生说，有意向给他投资 200 万。我学生听了非常兴奋，今天出来见贵人了。大约过了一个星期，拿督到我学生的餐厅里，显得很心急的样子，说：我今天和工人去买点货，我没有带现金，人家不给我刷卡，你能不能先借我
    2000 马币？ 拿督问一个普通人借两千块，你想想，这个即将为你餐厅投资 200 万的人，问你借两千块而已嘛，有没有关系呢？没有关系嘛，很合理啊，可能对方在考验我呢？我的学生就开始分析了：如果我不借给他，可能会得罪他，然后他就不会在我这里投资了。
    接着就二话不说，马上借两千块给拿督。在三个月之内，这个拿督都用这方法借了一万多马币，每一次这个学生都会出现一个合理化的解释。其实你们要知道一样东西，如果我学生有资讯不对称这个概念的话，你想他会被骗一万多块吗？一个拿督，要在我餐厅投资
    200 万，经常身上连几千块都没有？**你们千万不要合理化一样东西**，那些有钱人，不是整天带现金的，他们都是刷卡，千万别这样想。要给你投资 200 万，问你借几千块，这个第一个资讯不对称，如果你从阴谋论来看，一个普通朋友，来到你的餐厅，给你一些建议，然后就给你投资几百万，你觉得会有那么幸运的事吗？当然，我不排除人会后中六合彩，但是一个普通朋友，跟你非亲非故，给你投资两百万，还把经营权给你，有这种好事吗？如果你是那个拿督你投资
    200W 你要不要经营权？恩？他又不认识你，这个就是资讯不对称了，你从阴谋论和资讯不对称下手，在他没想到招式骗你之前，你也不会那么轻易上当对不对？


    江：所以这个资讯不对称的概念，是方便你会观察，提高你的观察力。但是会观察不代表会出招。只是代表你会分析，会分析是一回事，**做不做得到是另外一回事**。有的人是没办法分析，但是有办法做到。我们的书里提到一个老胡的人，他是没有办法去分析的，他分析的时候，天南地北的讲，自己都分析错了，但是他有办法能做到。


    李：我有一个朋友是做家具生意的，他有办法培训那些销售员，让客人一进到店里的时候，就马上可以把客人锁定住听销售员讲。他让那些客人一进店 家具店，就可以不马上问价钱，而是好奇的听他讲，不一定马上成交，但是客人会暂时把主控权交给了销售员：


    他问客人：“你介不介意告诉我，你买家具是因为家里是从新装修呢，还是新房入住呢？如果你是新房入住或者是从新装修的话，你会不会介意让我知道，你需要哪种类型的家具？或者，在我们卖家具的专业人士的角度，可以给到你一些建议。如果你有设计图拿来的话更加好，我们坐下来让我分析给你听，告诉你如何帮你搭配。”你想一想，如果你是消费者，你与否愿意听这个销售员继续讲下去？你是一个客户，你进到店里，不一定会听完他的建议，但是你心里面会想，听一听又何妨呢？听一听又没有什么损失。所以呢，你会暂时把主控权交到他那里。


    所以他这一句话术，就可以快速的锁定客户听他讲。我们分析这一招的用处时，我们问那个朋友：你是怎么想出来用这一招的？这一招有什么用处呢？朋友回答：买家具都是这样的啦！ABCDE
    讲了一大堆，但是都没讲到重点。你们看看，有内容有表现手法，但是他没话术的时候，跟你讲了一大堆，你都听不明白，你学东西是不是很慢啊？我建议你们**找一个脑友，观察一些现象的时候，用术语对现象进行描述**；这样你们看东西是会比较深入一些的。


    江：李老师那个朋友，有些招式是非常厉害的，我们听的时候都觉得很惊险，但是他本人就没有办法能够解释得到，他解释出来都是废话。可是他就是有办法能想那些招式出来，绝对是个招式王。这个人呢，就是因为搞太多这样的招式，导致出现了很多其他的问题，出现新问题的时候，又要去想招式，所以他想招式的速度就是这样训练出来。这个人和别人一接触的时候，它会尽快的让对方尊敬他，他会很快的跟你有共同语言，很快的能找出你喜欢的话题，这方面他非常拿手。当他找到你喜欢的话题之后，他就令你非常的尊敬他，敬佩他。这个就是他的思考模式。


    他先要有这样的目的，才能看到这样的效果，他出招的时候，是不管出什么招的，总之就是能尽快达到这样的效果出来，他就是有办法能做到，但是让他解释，他就解释不出来。我们给两个方向给你们，一个方向就是，你用李老师的朋友的那种思考模式，就是不停的乱出招乱出招，可能可以达到那样的效果。另一个方向就是，我们给这些招式命名，对这些招式有了概念，然后再去用，用的时候，一样要以有没有效果为标准。我们有一些学生，学完之后就知道有这么一回事，知道之后我的心就会比较定，但是对他来说，他不会出招。这是因为他不注重效果。


    李：反方向的思考其实是很简单的，曾经有一个马来西亚讲师界的老前辈，分析销售员如何做销售，他说做销售有几种东西是很重要的，第一个层次是优越感，第二是让客人有利润的感觉，第三是爱心，第四是讲恐惧，第五是讲需要。大家要注意了，这些不是我们要教的东西！


    江：我们要跟大家分享的是：我们一得到一些资讯，我们是怎样分析以及应用这些资讯。


    李：你们想一想，那个讲师的说法，是不是能让一个刚开始学习方法的销售员首先有一种安心的感觉？比如买 BMW 的客人，是不是追求一种优越感？客人买东西有时候是很虚荣的。你一听，对哦！很有道理哦！为什么这件衣服那么贵还有人抢着买呢？为啥
    A 货也有人去买呢？因为他追求的是优越感。你听起来是不是很有道理呢？你完之后就有一个感觉：安心。但是当 我们听到这一类的资讯，我们的反应是，没错，确实是制造了优越感，但是我本身会不会因为优越感而买这个东西呢？我首先第一时间会想，什么是我要的？假设我是卖药的，我去见一个医生，能不能凭借优越感让他买东西呢？


    各位来上课的学员，会不会因为优越感会让你从钱包里拿钱出来上我们的课程呢？你有很大的可能性是从利益，然后是恐惧，再接着是需求，来激发你的购买欲望的。


    江：那个讲师说，你推销一样东西，先从优越感开始推销，如果推销了优越感，反应不是很大，就推销利润，再推销利益，如果反应还不大，再推销爱心，不行就吓他。如果还不行，再讲需要。他是这样解释的，他讲完我也抄下来，我不是认为这个东西正确，我是觉得这个素材可以让我去放噪音。我不敢说他绝对正确还是错误，但是我就是利用这个资讯来放噪音而已。他之后就说一个客人会有五种可能性不跟他买。一不需要，二不急买，三没兴趣，四不相信，五是没钱。


    李：当你听到一些资讯，这些资讯让你很安心，听完很舒服了，但是你要会演变成你的招式出来。如果讲师要骗学生，就编刚才那套理论出来，比如你知道为什么生意难做吗？先编一套故事出来，让你知道销售员的生意很难做，先挑起你的痛苦，然后告诉你不跟你买的原因是没需要，你听起来好像很有道理，没兴趣，对啊，他不急，是啊很有道理。这个是他不买的原因。那么怎样让他买呢？就照这个架构，先制造他的优越感，然后再者是利润，再次是爱心，再讲需要等等，讲师这样一说，似乎解决问题的方法就出来了！你听完之后就觉得很大安心了。所以，你们要注意，这一招就是给你们制造话术的方法。（这一段是一边写黑板一边讲的，因为没有看到黑板写得内容，单从语音上可能理解不是很透）


    江：假设你对你的客人说：你有五种情况不会跟我买。其实这是一个盗雷的招式，所以对方听了就觉得很舒坦，舒坦之后你再跟他继续讲。各位有没有记得我们在书里说的成功者五大元素？五大元素你说哪个元素最重要？？其实这就是制造噪音的方法。你和他说你不买有五个原因，那五个原因里面，你觉得哪一个是最重要的呢？让对方先讲出来，讲出来之后再跟他做天堂地狱法；我们明天会讲到天堂地狱和千问局属，然后就在他的答案里面，再对他进行销售。但是这套东西是否是真的呢？可能是完全没有根据的，只不过他有办法做到这样的效果出来，你要会制造一些噪音出来。比如一个人很害怕大象，他经常幻想大象来追他，但是他知道大象怕老鼠，那你就给他一个盒子；告诉他盒子里面有老鼠，其实盒子里是没有老鼠的，只要你让他“以为”有老鼠就可以了，他便会安心。其实大象是不存在的，老鼠也是不存在的，我们只是用假的药来治疗他假的病。


    李：大家是否记得我们说过价值都是假的？当一个销售员使用话术来包装的时候，你会觉得这个销售员谈吐不凡，他会让客人觉得在他身上可以获得一些特别的资讯，当你有办法能够包装一些资讯的时候，你的客人会因此而欣赏你。


    江：如果你能模仿我们的成功者五大元素的理论来制造一个你自己的理论出来，每当遇到客人的时候，就讲给他听，讲给他听的过程当中，其实就是在给他洗脑，给他灌输一些价值观，接着你就可以影响他，明天的课程我们会教你们勾魂夺心，最好你要带一本《勾魂夺心洗脑》来上我们的课，明天我们会讲到成功者五大元素，你可以照搬照眠的跟别人说的，是有办法让别人很尊重你的。假设对方的身份是老板，是地位高的人，你照搬照眠背出来给他听就可以了。那明天我们会解释为什么你背的时候有这样的功效，将来我们可能会制造新的理论出来，制造新的噪音。好，现在是休息时间。


    （休息时间……）


    江：其实我们不必时时都处于一个高的位置，有些时候你可以这么做（有时候可以不这么做），但有些时候你遇到一些人格局是非常强的，你不需要指出来，指出来反而对你没用处，我们是教如何做生意，如何赚钱，如何得到对方的妥协，不是教你黑社会式的谈判，黑社会的谈判是你大我，我又大回你，虽然格局变得很强，但达到的效果就是大家火拼，这不是我们的目的。我们目的是大家赚钱而已。有一个地方有一些社工，这些社工帮助一些有问题的人，那些有问题的人经常就会骂社工，有一个社工，干了很长时间，但从来不会有人骂他，别人很奇怪就问是怎么回事，他说：“我会沟通，会了解对方痛苦，会聆听等等，还有重要的一点，我会将对方坐的凳子调得高一些，将自己的凳子调得低一些。当别人坐下来的时候，别人就高了一些，我就矮了一些，我用这种矮的姿态跟对方沟通，对方态度就不会那么差。”我暂时没有去证实这个故事的真实性，我的意思是说，当你遇到一些客人主控权是很强的，比如你遇到李嘉诚，你在他面前对他说我不需要你，其实就是资讯不对称，因为你不需要他的话你没必要讲出来嘛，你再对他说，有钱人没什么大不了呢，这就是资讯不对称的话语，没啥大不了的话就不需要在他面前说

