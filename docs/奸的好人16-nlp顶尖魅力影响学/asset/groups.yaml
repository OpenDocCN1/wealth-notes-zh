    5、策略性印象播种：问自己要在对方脑中种下什么印象？诚实、有趣、创意、克服万难、联系、爱心、孝顺、尊敬……


    # 隐喻法：


    +   1、找出“问题”的主要题材。


    +   2、找出要达到什么“目标”。


    +   3、找出“引导”对方从“问题”达到“目标”的“过程”。


    +   4、设计一个相关的隐喻故事。可从奇幻故事、人生经验、个人经验、传说等找题材。隐喻故事的内容其实就是一个间接的同步和引导。同步就是所谓的“问题”，借用隐喻的方法来间接“引导”对方潜意识的“过程”。加强隐喻故事戏剧化和情绪化的效果。（可以从好的电影，或好的故事中找出方法。）


    +   5、设计出一个终极的大挑战、大危机来成为故事中的终极转换点。


    +   6、故事中的角色因为经历了终极转换点而有了新的观点、领悟或行为。进而达到了“目标”。


    Federal Express 是一个每天做上亿的生意。


    在总行的输送机有一天不能够动，叫了很多专家来修理都没修好，每天损失上亿的生意。


    后来听说有一个在这行里的修理专家之神，很辛苦找到他，很机缘巧合找到他，总裁 Fred Smith 跟他说钱不是问题，最重要是能够修好。


    他看了公司的蓝图、输送机蓝图、问了公司里的工程师，走到总行里的其中一根柱子，往上一看，看到了一个电路盒子。叫人拿了楼梯，然后爬了上去。打开了盒子，找到其中一个螺丝，把那螺丝扭了一下，在扭第二下时，轰！总行里的所以输送机，全部开始运作了。


    总裁 Fred Smith 整个人就松弛下来了，很开心的跟这位专家说“谢谢你，我们要给你多少钱？”


    专家说“十万元是一个公道的价钱。”'
  - "[PAGE 16]\n\n总裁说：“啊！有没有搞错。请你跟我解释一下为什么这是一个公道的价钱？”专家拿出一张纸，在上面写了几个字，交给了总裁。\n\n总裁拿过来一看，笑得很大声然后说“原来如此，我们马上就来给你钱。”\n\
    \n纸上写着：扭螺丝收1￥，知道扭那一颗螺丝收￥99999.00\n\n# 价值观和准则的引出\n\n**价值观**：我们想要的或我们以为自己想要的。\n\n\
    **准则**：我们队自己的价值观所下的定义和标准。\n\n可以引出价值观的问题：\n\n你认为 X 最重要的是*什么*？\n\n**X 可以是：**\n\n\
    +     - 一段美满的感情\n  - 聘请一个人/经理/……\n  - 你购买一部车/时\n  - 你理想中的（男朋友/女朋友/伴侣/职员/经理等等）\n\
    \  - 你最（喜欢/欣赏/羡慕）的（同上……）\n\n记得运用言谈模仿（backtracking）的开放式问题和封闭式问题两种技巧来引出对方的价值观。运用开放式问题来让对方讲出自己的重点用词，运用封闭式问题来得到更多的重点用词和加深共鸣。为了不让对方觉得你不断重复对方的重点用词，有时候你不用封闭式，只是讲些话来认同对方，而这些认同的话中却可以采用他提供的重点用词。\n\
    \n然后问准则问题来找他对方价值观的定义：\n\n你怎样知道 Y 或你怎么才知道 Y？\n\n**Y 是对方所用的重点用词。**\n\n不断的重复问什么和怎样这两个问题来引出对方的价值观和准则。记得"
