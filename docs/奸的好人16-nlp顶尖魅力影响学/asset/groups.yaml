    # 超级影响话题方程式~最实用的言谈催眠法


    +   预设话题法：

    1、回想一下有什么主题是常围绕着你工作上，或生活上的话题。

    2、把话题写出第一个草稿。

    3、你希望如何影响对方？

    \*你要对方作出什么行为？签约、决定、买卖、行动。

    \*你要对方进入什么心理状况？开心、讨厌、兴奋、紧急、喜欢。

    4、重读草稿时，加入 nlp 间接催眠暗示技巧：隐喻命令、心锚、假设、同步引导等。请依 3 所决定的方向来设计你的间接暗示。

    5、重写原稿。

    6、自我演练。


    # 讲故事的催眠术


    讲故事的催眠影响术分两种：个人故事法与隐喻法。


    +   个人故事法：

    1、从自己的人生经验中，记录下所有的精彩和感性的故事。（长度是半分钟到 3、5 分钟）

    2、剪裁：1）把所有不重要的资讯细节剪去，只要剪掉后的故事还是能够明白。2）松紧交替、散播勾魂。3）加强示高价值，剪去示低价值。

    3、补缺：故事是否太过戏剧化？太过完美？

    4、意境成事实的结论法则：把故事中的意境，设下“心锚字眼”，再复'
  md: "\n# 第一部分 毒辣 NLP 讲义\n\n## NLP 成功模式\n\n1. 明确知道自己的目标\n\n除了知道不要是什么，一定要知道“我要的是什么？”\n\
    \n2. 采取行动\n\n假设自己已经到达目标，从目标的立场，推理出所有的过程。“我要采取什么行动才可以达到这目标？”\n\n最少推理出三个选择。\n\n\
    3. 观察是否接近目标\n\n假如观察到偏离目标，重复第 2 个步骤。\n\n假如观察到接近目标，保持所采取的行动。\n\n4. 灵活性的调整所采取的行动直到达到目标\n\
    \n在合法及没有伤害到任何人的情况下，不择手段。\n\n## 思想形态认证\n\n| 特点 | 视觉型 | 听觉型 | 触觉型 |\n| --- | ---\
    \ | --- | --- |\n| 语速 | 快 | 中 | 慢 |\n| 语调 | 高 | 变化 | 沉 |\n| 呼吸 | 上部 | 中部 | 下部\
    \ |\n| 动作 | 大 | 普通 | 触摸 |\n| 视线 | 上 | 旁 | 下 |\n\n![](img/13f08b43c255398fb0594fbc271fee1a_5_0.png)\n\
    \n## 眼睛解读线索\n\n- $V^R$: 记忆中的视觉意象：以前看过的意象，以这个方式来回想第一次看见时的景象。\n- $V^C$: 建构的视觉意象：对以前没有看过的事物的想象或意象。\n\
    - $A^R$: 记忆中的听觉声音：以前听过的话语或声音。\n- $A^C$: 建构的听觉声音：以前没有以这种方式听过的声音或话语。\n- $A^D$: 听觉性的对话：和自己或别人进行对话。\n\
    - $K$: 触觉性的：感受、感觉和情绪。\n\n## 感官用词\n\n当你听出对方谈话中所运用的字眼类型，你就用回同一类型的字眼来与对方沟通。\n\n|\
    \ 视觉型 | 听觉型 | 触觉型 | 不定型 |\n| --- | --- | --- | --- |\n| 观察 | 听到 | 觉得 | 察觉 |\n\
    | 看法 | 说法 | 感觉 | 理解 |\n| 清楚 | 讨论 | 掌握 | 领悟 |\n| 观点 | 回应 | 接触 | 知道 |\n| 明显 | 吵闹\
    \ | 冷淡 | 明白 |\n| 看看 | 淡淡 | 乏味 | 记得 |\n| 回顾 | 安静 | 痛心 | 相信 |\n| 模糊 | 问答 | 稳定 |\
    \ 想法 |\n| 注目 | 解答 | 沉重 | 注意 |\n\n## 观察力\n\n- 身体的角度\n- 头部的角度\n- 手足的动作和位置\n- 表情变化：眉、眼、瞳孔大小、视线移动、鼻、嘴、脸色、极微表情等。\n\
    - 声音：速度、调、音量、常用字、感官用词\n- 呼吸：速度、位置\n\n初学者每次见到一个人有表情变化时，内心开始描述他的表情。\n\n谈话中，请常留意对方的“极微表情”。\n\
    \n## 眼神的运用\n\n基本方法：\n\n- 看着对方两眼中的鼻梁。\n\n讲价钱、提出要求、或拍马屁时，一定要保持眼神稳定的接触，不可看其他的地方或眨眼。\n\
    \n**诚意眼神**\n\n保持眼神稳定的接触，然后头部轻微的向旁边倾斜。会使对方觉得你有诚意或关心他。\n\n也可以让一个陌生人觉得你有真诚的友善。\n\n\
    ## 亲和力\n\n瞬间与任何人建立亲切感和倍增。怎么快速的拉近彼此的关系。让别人更加尊敬和喜欢你。\n\n任何可以观察到的行为都可以模仿。\n\n- 直接模仿：将自己变成如对方的镜像。\n\
    - 间接模仿：用自己的一个行为来模仿对方的另外一个行为。\n\n**你的功课**\n\n- 第一阶段，一交涉就马上直接模仿对方的头部动作，身体、手足等，要慢几秒才模仿。\n\
    - 第二阶段，在第一阶段的基础上，再加上模仿对方的表情，声音，呼吸。\n- 第三阶段，在以上两个阶段的基础上，再加上模仿对方的一些无意识细微动作。\n\n\
    初学者，最好练习模仿一个你不需要跟他讲话的陌生人或模仿一位你不需要回应他的人。当你能够很自然的模仿时，就开始练习同时模仿兼说话回应。\n\n初学者刚开始练习模仿时，模仿得越接近越好。当你能够很自然的模仿时，就开始练习模仿得越来越细微。\n\
    \n## 言谈模仿\n\n在一问一答言谈间，运用对方所注重的用词，回应对方。然后再进一步将对方所注重的用词，逐步分解。重点在于不断重复回应和分解两个步骤，这是一个可以深入了解对方的技巧，同时可以很快的建立默契感。假如不用言谈模仿而不断问问题，会让对方有被盘问的感觉。\n\
    \n注意的用词的重点——语气特别、重复次数、表情动作。\n\n- **回应**：用对方的重点用词来问一个问题，对方将很自然的认同。\n- **分解**：以问题来问对方，其重点用词是什么意思。\n\
    \n> 你：其实你们是需要一个怎样的人才会觉得满意呢？\n>\n> 他：最重要的是他一定要有责任感。\n>\n> 你：你认为最重要的是一定要有责任感？（回应求证）\n\
    >\n> 他：当然！责任感非常重要。（求证成功）\n>\n> 你：我同意，责任感是非常重要的。那么我想知道一下，那个人要怎样才能表现出他有责任感呢？（第一层分解）\n\
    >\n> 他：最起码他一定要明白我们的要求。\n>\n> 你：哦！他一定要明白你们的要求？（回应求证）\n>\n> 他：对！（求证成功）\n>\n> 你：我赞成你的说法。但是要完全明白一个人的要求是不容易的。你认为一个人要怎样才能完全明白你们的要求呢？（第二层分解）\n\
    >\n> 他：至少，有不太明白的地方一定要问清楚。\n>\n> 你：哦！至少他一定要问清楚？（回应求证）\n>\n> 他：对！（求证成功）\n\n**你的功课**\n\
    \n- 第一阶段，别管自己要怎样回答。只管找出对方的重点用词，同时把对方所用的重点用词，尽量记住。\n- 第二阶段，开始将对方的重点用词，作出回应求证和分解。\n\
    - 第三阶段，在影响过程中，尽量用上对方的重点用词。\n\n**言谈模仿的好处：**\n\n- 让对方觉得我确实有在听，因为我用对方的语言心锚来应对对方。\n\
    - 让对方不断认同你，因为我用对方的语言心锚来应对对方。\n- 制造亲切感，因为对方觉得我有听，同时对方又不断肯定我。\n- 减少误会。\n\n## 同步和引导\n\
    \n同步=不可否认的事实。或者是听众的目前状况。用同步的目的就是为了让对方进入认同的状况。可以用 tag question，是不是？对不对？不是吗？来让对方点头。其中一种惯用的方法是发表正反面对比意见。\n\
    \n引导=想要对方接受的意见。\n\n说服力强的人，通常会先两个同步，然后一个引导。沟通能力弱的人，通常不惯用同步，而一开始就用引导。\n\n我知道你是**不可能**现在就完全接受我的说法。（同步）因为每个人对**都会**有个人的看法（同步）所以今天，我希望能够了解你对**的看法。同时我也要**求你花些时间了解我的看法。\n\
    \n每个人都希望作出最好的选择。（同步）有些事情对你来说，可能不是很**重要的。但是有些呢却非常重要。（同步）那么我们这次见面的目的，其实就帮你**了解**的重要性。（引导）\n\
    \n当你第一次见到一个人的时候，你不知足是否可以相信他。（同步）但是他跟你讲话的时候，你发现这个人的某些优点，（同步）然后你就开始知道你会**越来越喜欢这个跟你讲着话的人。（引导，暗示着现在我就是那个跟着你讲话的**人。）\n\
    \n我知道我不认识你，你也不认识我，当然在这样情况下开始我们的合作，**未必是最好的选择，但是我在这一领域，是已经拥有多年的经验……**\n\n## 互动式的同步和引导\n\
    \n| | 方法 | 目的 |\n|---|---|---|\n| 1 | 运用言谈模仿来问出关于对方所面对的挑战或问题。 | |\n| 2 | 把对方的挑战，以更详尽的方式，讲回给他听。\
    \ | |\n| 3 | 给对方建议。 | |\n\n## 以同步和引导消除抗拒\n\n| | 方法 | 目的 |\n|---|---|---|\n| 1\
    \ | 列出对方所有抗拒你的原因。 | |\n| 2 | 列出对方应该接受你所有的原因。 | |\n\n## 三种基本的声调\n\n![](img/13f08b43c255398fb0594fbc271fee1a_10_0.png)\n\
    \n## 隐晦命令\n\n运用语调、手势、表情，将一个命令隐藏在一句话中，对他人作出潜意识的影响。它可以让你：\n\n- 超越他人的理性防线。\n- 将信息直接植入他人的潜意识中，快速影响其决定。\n\
    \n米尔顿 艾瑞克森医生通常会在隐晦命令的前后稍微停顿。当发出命令时，可以把声调放沉，放慢，或放入适当的情绪。\n\n当一个人听到一些他很有兴趣的事情时，通常都会很容易的……完全被吸引着。（同步，隐晦命令）\n\
    \n很多人会……马上做**。其实你没有必要……现在做。除非……你觉得**非常好**。那么到时你才……**选择**也是可以的。\n\n有很多人认为，当你听着这种音乐时，你会很容易的变得轻松。\n\
    \n当一个人已经知道这个产品的好处，只要公司有足够的预算，是可以……马上跟我们订购的。\n\n| 命令例子 | | | | |\n| :--- | :---\
    \ | :--- | :--- | :--- |\n| 这是你要的 | 你想要 | 你觉得满意 | | |\n| 越来越喜欢 | 用心的听 | 觉得很舒服\
    \ | | |\n| 马上行动 | 采取行动 | 时常认同我 | | |\n| 完全肯定 | 被吸引着 | 看到他的益处 | | |\n| 觉得有需要 |\
    \ 越来越兴奋 | 让自己完全相信 | | |\n| 这个难得的机会 | 你有兴趣 | 相信我 | | |\n| 时常想着 | 这是最好的 | 有很好的感觉\
    \ | | |\n| 看起来很好 | 听起来很好 | 这是很重要的 | | |\n| 把握这个机会 | 决定要这一个 | 现在就要买 | | |\n| 现在选择\
    \ | 把犹豫放下 | 改变你的想法 | | |\n| 越来越有利 | 把自己打开 | 很有吸引力 | | |\n| 觉得非要不 | 这是你的梦想/理想 |\
    \ 觉得很熟悉 | | |\n\n| 引用词 | 隐晦命令 |\n| :--- | :--- |\n| 当你…… | 对（……）觉得很兴奋 |\n| 你可以……\
    \ | ……很留心的听…… |\n| 你有没有曾经…… | ……很全神贯注…… |\n| 你有没有试过…… | 对……觉得很有兴趣 |\n| 你有没有想过……\
    \ | 对……有很好的感觉 |\n| 我不知道你可以变快…… | ……完全相信…… |\n| 你或者是…… | ……时常想着一个人…… |\n| 你可能会……\
    \ | ……觉得有需要…… |\n| 有些人…… | ……越来越喜欢…… |\n| 很多人…… | ……把握这个机会…… |\n| 你没有必要…… | ……马上行动……\
    \ |\n| 你不必…… | ……觉得很满意…… |\n| 有人说…… | ……完全认同一个人…… |\n\n## 最重要的催眠命令功课\n\n将“感觉很好”“有很好的感觉”“觉得非常好”等指令运用在以下的日常生活中：\n\
    \n1. 刚认识新朋友时\n2. 在收银处付钱时\n3. 面对服务员或销售员时\n4. 称赞别人时\n\n可以把以上的指令放在隐晦命令、反面命令或引述命令等方法里把它写成种种可以在以上日常生活中，适合运用的句子。一有机会就马上练习。同时又可以让好人有好的感觉，实为一石二鸟之策。\n\
    \n另外一种设心锚的方法，是不需要问问题的。只是在说话的过程中做之。\n\n* 代表一个特定的动作，& 是另外一个特定的动作。\n\n每个人都想作出最好的决定*。当你作出一个选择的时候，你会开始比较。比较一下有那些事情是不重要的&，有那些事情是很重要的*。有些是很琐碎的&，有些却是你已经寻找了很久的*。那些不重要的可能是一些很普通的事情&，那么那些很重要的可能是一些你一定要*又很特别的*。假如有一些人(向外指)是讲一些不重要的事情&，你会觉得好像要应付他。但是当一个人（自指）是跟你讲些你认为是很重要的事情*，你会很自然就……全神贯注，对不对？那么今天我跟你介绍我们公司的服务*。当然，我不能肯定我们公司的服务*，对你来说是不是很重要。但是，我相信我们公司的服务*有几个特别的地方，是你还没知道的……（适当的地方，讲到优点时，启动心锚*）那么我知道你当然现在用着其他公司的服务&，我也相信你现在所采用的服务&，在某些方面也可以帮到你。只是我自己……*对我们公司的服务*……*非常有信心*，所以才向你推荐我们公司的服务*。\n\
    \n## 假设布局成交\n\n- 时间上的假设：\n\n在还没有X之前，你要不要Y？X=你想要的，Y=局\n\n在还没签约之前，你需不需要我再将这一部分解释多一次？（认定了会签约，问题是签约之前要不要多解释多一次而已。）\n\
    \n在我们还没有见面之前，你想不想我把我们公司的资料传真给你？（认定了会见面，问题是要不要先传真给你）\n\n- 二选一的假设：\n\n你想要X或者是Y呢？X和Y都是局。\n\
    \n你想现在就签约呢还是回去和家人商讨后才签约？（认定了会签约，问题是现在或是回去后而已）\n\n假如我们……安排见面的话，（隐晦命令）你认为是这个星期见面还是下个星期见面比较好呢？（认定了见面，问题是这个或下个星期而已）\n\
    \n- 知觉性的假设：\n\n知道、明白、了解、发觉等。\n\n你知不知道我们的公司在同行之中，是可以给到最合理的价钱？（认定了本公司给最合理的价钱，问题是你知不知道而已）\n\
    \n我知道你不可能……*现在就改变你的想法*。（反面，隐晦命令）但是你有没有发觉到，我所提出的几个要点，其实是很有道理的？（认定了我提出的要点是很有道理的，问题是你有没有发觉到而已）\n\
    \n- 简单假设：\n\n用完全正面的句子：\n\n![](img/13f08b43c255398fb0594fbc271fee1a_13_0.png)\n\
    \n你可以几时作出决定？Vs 你要多久才可以作出决定？\n\n你不会方便告告诉我？Vs 你会不会介意告诉我？\n\n请相信我 Vs 我不会骗你\n\n##\
    \ 超级影响话题方程式~最实用的言谈催眠法\n\n预设话题法：\n\n1. 回想一下有什么主题是常围绕着你工作上，或生活上的话题。\n2. 把话题写出第一个草稿。\n\
    3. 你希望如何影响对方？\n   - 你要对方作出什么行为？签约、决定、买卖、行动。\n   - 你要对方进入什么心理状况？开心、讨厌、兴奋、紧急、喜欢。\n\
    4. 重读草稿时，加入 nlp 间接催眠暗示技巧：隐喻命令、心锚、假设、同步引导等。请依 3 所决定的方向来设计你的间接暗示。\n5. 重写原稿。\n6.\
    \ 自我演练。\n\n## 讲故事的催眠术\n\n讲故事的催眠影响术分两种：个人故事法与隐喻法。\n\n- 个人故事法：\n1. 从自己的人生经验中，记录下所有的精彩和感性的故事。（长度是半分钟到\
    \ 3、5 分钟）\n2. 剪裁：\n   1) 把所有不重要的资讯细节剪去，只要剪掉后的故事还是能够明白。\n   2) 松紧交替、散播勾魂。\n   3)\
    \ 加强示高价值，剪去示低价值。\n3. 补缺：故事是否太过戏剧化？太过完美？\n4. 意境成事实的结论法则：把故事中的意境，设下“心锚字眼”，再复\n"
