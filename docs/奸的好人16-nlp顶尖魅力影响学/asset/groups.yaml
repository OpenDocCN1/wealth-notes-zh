    你怎么样知道你的那个声调是用对了呢？现在我要你做一个很简单的实验，你用你其中一只手，放在胸口之下，肚子之上，那么你跟着我发出这个声音，啊（上）？（啊（平）？）啊（下）——（啊——）啊！（啊！）再来一次啊，啊？（啊？）啊——（啊——）啊！（啊！）第三个的声音“啊！”下去的时候呢，有没有感觉这边的震动或者这边的感觉会比较强？他会感觉比较强，那个“啊！”的感觉就是你的那个，命令的语调。有命令的语调这部分是会有一些，这个震动是最强的。“啊！”注意一下。那，我？（我？。）我。（我。）我！（我！）再来一次啊，我？（我？。）我。（我。）我！（我！）再来一次啊，相信我？（相信我。）相信我！


