    2、模仿对方肢体、表情、语调和重点词句。

    3、以言谈模仿来使对方产生认同。凡是有正面话题的认同就设一个心锚。凡是有负面话题的认同就设另外一个心锚。设越多越好。

    4、话题中尽量加入如“喜欢我”“爱上我”等的隐匿命令、反面命令或引述命令。发出此等催眠命令时，记得同时触发之前所设的正面心锚。或者讲到如“喜欢一个人”“爱上一个人”时，就记得指一指自己和同时触发之前所设的正面心锚。

    5、视你个人价值观而定，如果对方一提起你的情敌的话，你就马上触发之前所设的负面心锚。


    ## 附录 2：催眠话题分析


    今天我来到这里，不是要跟你买，而且，也不是每一个人都需要这个产品。我今天来这里的目的是，最重要是教育你。


    意思是说，客户是最怕做错决定。所以在你还没有决定跟任何人买，就算是要跟我买之前，我们要确定你已经得到足够的相关资讯。


    有一些人，他们根本不管你是否买到一个你需要的产品。


    而另外的一些人呢，就算你没有需要，他们都要想尽办法说服你买越多越好。


    但是，最重要的是，你是客户，主控权在你的手上，我认为身为客户，你多多少少是知道你需要的是什么。


    而当你跟一个人买东西时，是因为你发觉到这个产品的好处，很符合你个人的需要，甚至你能想象到它未来怎样帮到你。


    其实，钱，每个人都想赚，但是我最想要的顾客，是那种跟我们买了好多年过后，还是继续的觉得满意。


    所以假如你认为有一个产品是不能够符合你的需要，请告诉我，我若知道其他地方有更适合你的产品，我会告诉你。


    ## 附录 3：催眠话题分析


    今天我来到这里，不是要你跟我买。而且，也不是每一个人都需要这个产品。我今天来这里的目的，最重要是教育你。


    意思是说，客户是最怕做错决定。所以在你还没有决定跟任何人买，就算是要跟我买之前，我们一确定你已经得到足够的相关资讯。


    因为销售员有两种，第一种销售员是他们也怕一样东西……他们怕你怀疑他，怀疑他的产品。但是如果他们只是怕你怀疑他的话，这种销售员是有问题的。


    说实的，我也怕客户怀疑我，也怕人家不相信我，但我更怕我的客户买了后会后悔。


    其实，钱，每个人都想赚，但是我最想要的顾客，是那种跟我们买了好多年过后，还是继续的觉得满意。


    所以假如你认为有一个产品是不能够符合你的需要，请告诉我，我若知道其他地方有更适合你的产品，我会告诉你。


    ## 附录 4：催眠话题分析


    我的经验告诉我，我是没有办法强迫一个人喜欢我或爱上我。


    我唯一可以做到的，是让自己成为一个对方可以爱上的人。


    那么他们是否要跟我在一起，完全是他们自由的决定。


    爱情火花这种东西，如果是没有的话，就算你常跟那个人见面，还是不可能。但如果你跟一个人有火花的话，就算那么不能见面，你也会不断的想起他。


    因为当我们爱上一个人的时候，不只是因为你看到这个个人，或听到这个人的声音，而让你有一种很好的感觉。更重要的是，你的直觉告诉你什么？


    每一个人的内心都有一把直觉的声音，当你这一把内心的声音，不断在重复的告诉你：“喂！这就是你一直都在寻找的。”你就会有一种终于明白的感觉。


    我，也有这种声音，我记得有一次……


    ## 附录 5：催眠话题分析


    我知道很多人说客户是买产品，这个是我不认同的，我认为不管你买什么，你是要买一个“结果”。


    我可以把产品好处和功能讲完给你听，但是如果这些好处所带来的“结果”不是你要的，就算我讲出八个产品的好处，都没用。


    所以一个客人要买东西的时候，是第一他知道了产品的结果。第二，除了知道结果，他还知道结果和自己的密切关系。


    买东西的人分成看痛苦和看快乐的两种人，第一种就是想知道你买了后可以解决什么问题；第二个就是想知道买了后你可以得到什么。


    举例，我买车是为了解决交通问题，但一些人买车是为了得到一些东西，如享受、地位。有些人买书是为了应付一些问题，但我买书是为了要得到得到享受，那么你买东西的时候，你觉得你是哪一种？


    ## 附录 6:心理状态引出法


    你可以透过问问题、普遍经验的描述、讲故事或对对方作出一些事情的种种方式，来引出你想要对方进入的心理状态。


    ### 问问题的方式


    以引出价值观和准则的问题来引出对方的心理状态，记得把每一个价值观都设在同一个心锚上。然后把对方所有的价值观都列出来，再问对方如果他真的能够享有这些所有的价值观的话，他会觉得如何。对方反应时就马上设心锚。


    假设你是卖房子的话，当你和客户在屋子里时，你可以跟你的客户说：我有很多客户都说，当你进入一所和你有缘的屋子时，你很可能会…<u>有些特别的觉察</u>（触发之前所设的心锚）…请问…


    针对对方的某一种经验，以言谈模仿的问题，不断仔细地问下去。目的是要对方也以很仔细的方式描述他的经验。记得看准时机设下心锚。


    假设你是以言谈模仿的问问题技巧，不断使对方仔细的描述他最甜蜜的恋爱经验。设下心锚后，可以对我说：“其实有些时候，你对某个人（指自己）时，忽然莫名其妙的开始……<u>有些特别的觉察</u>（触发之前所设的心锚），你可能会很好奇想知道为什么你会喜欢这个人。”


    ## 附录 7: 和陌生人谈天练习


    1、任何时候，身旁的单独陌生人，就是你增加 NLP 功力的好机会。

    2、我通常是用“双重普遍”问题来打开话题。例如在飞机上我会问“是你去 KL 呢，还是回 KL？”他们肯定是不会答 NO，而会答你他们是去还是回。如果他们看起来是蛮年轻的话，我下一个问题就是“那么你是读着书呢还是工作？”如果他们看起来像是工作的话，我就会问：“那么是你在公司上班呢还是拥有自己的生意？”

    3、用言谈模仿来找出他们的价值观或他们所有最喜欢的话题，记得要设心锚。

    4、接下来就是要运用所说的设的心锚；


    问一问对方目前有没有面对一些挑战。让他描述。让他描述着时，你就不断的触发心锚。


    你也可以给对方的你的名片，然后说：“在不久的将来，你可能几天，几个礼拜或几个月内，每一次你想到你需要 X 时，或当你知道你的朋友需要 X 时，你可以……<u>打电话给我</u>……我或者可以帮到你。”


    如果你想要得到对方的电话，临走前就说：“不如你……<u>给我你的电话</u>……我还有些东西想告诉你。”

