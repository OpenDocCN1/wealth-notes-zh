    \n另外还有一个内容是知觉上的假设：\n比如，你知不知道这些技巧全部都是经过验证并且是真实有效的？（这里无论是知道还是不知道，~我都是以这些技巧是经过验证并真实有效为前提）（看到这里我相信你已经完全学会了毒辣\
    \ NLP 的所有技巧，未来的今天你可能已经把这些技巧用在你的生活和人际关系中，同时你肯定因为运用这些技巧找到了自己喜欢的美女，此时你已经庆幸自己的选择是多么的明智，当你使用这些技巧的同时你会想起那些在你生命中帮助过你的人，你用技巧用的越多，你就会越想感激他们）\n\
    \n# 第三部分 毒辣 NLP 课程实录\n\n## NLP 介绍\n\n江老师：这两天你们学的东西主要是讲怎么样去影响一个人，部分的影响技巧是比较明确的，明确的就是对方也知道你想在影响他，大部分的技巧是不明确的，不明确的意思是我们有很间接的手段来做这个影响。你们会学到些什么东西呢？这边多少个是\
    \ OK 的。\n\n其实有看到我们那个部落格的人，就有看到在我们有些学员我觉得学 NLP 最著名的就是怎么样去弄人家分手。看我那个部落格，比方这个分手 3\
    \ 天、那个 5 天，以为这个是 NLP 最出名的。其实弄人家分手也不是最特别的地方，最特别的地方是与那个人分手，但是没有讲到分手，这是它最特别的地方。可以跟那个人聊着天、风花雪夜、谈情、谈政治、谈狗、谈人、谈什么……谈这些话题的时候，然后那个人要觉得看来我们还是\
    \ 要分手。这个是 NLP 最出名的地方，就是破坏一个人的那个信念，NLP 就是很强。\n\n那么在 我们的书，那个第一本还有那个《冷血救市》里面，有讲到我有一个朋友的弟弟就是本来要出家，就是要加入一个宗教组织。那么我当时出手，我不想，本来是不想弄他离开那个宗教，我只要他问多一点问题而已。当时，在我的个人立场上认为那个宗教在浪费人家的时间。它不是坏，它不是教坏一个人，它只是浪费一个人的时间而已。那么，我只是弄这个朋友的弟弟怀疑那个宗教，怀疑他们的教主。但是我\
    \ 没有把那些不好的东西放进去他的头脑，马上是说这个教是坏的，是骗人的。这个东西没有，完全没有放进去，我只是叫他思考多一点，去想！而且把他的教主不要看得太重，这个是我放下去的东西。当时他的那个弟弟就开始想，一个半小时过后，他决定不要出家了。第二，他决定是看一\
    \ 看其它的书。因为当时在我朋友的家，当时是这样的我不是在那个弟弟自己的家去影响他，而是在另一个朋友的家我和他 去聊天。那么另外一个朋友家里就有一系列的书，有各种佛家教派的书，那个弟弟本来是其它教的\
    \ 书都是不看的，只看自己教的 书，其它全都是不看的。那一天，他哥哥之后说是这个事突破了，这个弟弟就问了我另外那个朋友这个书还有那个书能不能借给他看，那两本全不是他教派的\
    \ 书。这个我们看到是一个好的现象。之后那么我们就没有联系，再过了几个月之后， 他已经肯定是不出家了。我都已经觉得是‘CASE’我要做的东西已经做到了。今年我再见到我那个朋友，他告诉我他那个弟弟已经没有跟那个宗教有任何的联系了。这个不是我本来要出的手，那么到最后也延伸到这样子，当然是觉得那个宗教是有问题的。不过当时我是要弄他把整个过程加快或者是把时间缩短肯定是可以做到的是看我放什么东西下去。\n\
