    看电影，美国电影，其中除了欣赏，享受这种好的故事，我本身拿它们做为我的教材来讲，把它们里面的招式变成我们平常可以用的，我看那个电影叫做？？？他是一个雇佣兵，日本人透过一个美国人雇佣了他，但是雇佣他的那个老板很讨厌那个人的，有一天呢那个老板就取笑他，就讲他怎么怎么，他很生气的，不过他是老板，他不可以骂他，当时我在电影里面，他就跟老板说：我是雇佣兵，只要人家给了我500块美金，这个很多年前，他们要帮他们杀谁呢，我就帮他们杀，他要上，你给我500块的话，要我帮你杀黑人，我帮你杀，你给我500块的话，要我帮你杀黄皮肤的我也帮你杀，你要我杀？？的人，我也帮你杀，只要你给我500块，不过呢，要是有人要我杀你的话，免费的，（笑），电影里，用这种笔记本，就抽了出来，翻了有一页，是没有写东西的，就拿出笔忘记在记，然后才TMD知道有DVD（大笑），之后才知道不需要那么辛苦，不过翻版的那个对白呢是全部错乱的，全部是翻译错误的，所以鼓励看的时候就这样子来抄，抄那个对白，看那个故事的意境怎样去改，这一种，你们要学这种讲故事的话，等下午餐过后，会给你们一些练习，怎么样来讲这些故事，不过假如你们是想看这些电影，角色是讲很多故事的呢，你们可以买，这是课外话题，刚刚的故事，有什么特别的？就是这宇宙有好的外星人，有不好的外星人，战争，人类在中间就有矛盾，故事很普通，不过它最特别的地方是每一个角色都很会讲故事，其中一个角色是一个医生，当时的故事是这样的：


    太空上，他们一入口的那些的食物，他们全部都是要检查，那个医生呢，医生就跟那个保安队长讲：你的血压已经高了，这些胖胖的食物不可以再吃了，这个保安队长就走私一种食物，就是橄榄油，因为之前有一个故事，那个保安队长跟那个医生说：我的爸爸是一个很会讲话的人，不过每一年爸爸就就是一公斤的橄榄油，一半的牛油，煮，然后拿走面包，沾那个牛油，这样子来吃，医生就讲，你不可以吃这样的东西了。当时我的爸爸，每一年就会煮这个东西给我们吃，可能是他想用这个方法来告诉我们他爱我们，因为他不是很喜欢讲话，他就这样子来做，这个镜头放去一边，到进入结尾的时候，医生发现，这个队长走私了牛油和橄榄油，医生就问，你为什么这样子，他说没有，因为最近打仗，大家都很辛苦，之前我有受伤，你有照顾到我，其实我是想煮给你吃，（笑）明白吗？


    这个故事的意境开始怎么样了？你想像一下，这个人的感情就怎么样'
  - '[PAGE 162]


    呢？就加强了，ok，那么这个？？其中有个故事也是很难启的，他说他小时候很喜欢听下雨的声音，一听到就会睡的很舒服，他说他当时有一个很重要的考试，之前呢很紧张，睡不着；这么巧那一天晚上下雨，他说哇，我真的很好，今天下雨了，我会睡的很舒服，第二天起来就会很精神，去到考场的时候，看到每一个朋友就会很憔悴的，很辛苦的人，别人问：你怎么今天没精神啊？他说：没有啊，我昨天睡的很舒服，下了一场雨。朋友说：昨天没有下雨啊。他说：奇怪啊。他回家的时候才知道，他的爸爸昨天做了什么？拿了个水龙头射在窗口那边，一直这样射，不知道射了多少个小时，他才睡着。这整个那个剧的故事是普通的而已，每一个角色讲的故事呢，我一听就：oh,shit！妈的，又一个故事。就这样子来抄，当时是英文的，有机会的话，可以去这个是收藏，我想问台湾的朋友，是不是有一些书把那些连续剧的英文是给写成书的，有没有其他人知道？


    假如下一次你们再来上课的话，可能是念力的，或者其他什么样的，你给我一个EMAIL，还是怎么样，因为我要哪一些剧你呢，你帮我带一个过来，我会给钱你。


    # 影响策略


    我是越冷门的我就越去掌握这些资讯，以后写这些东西关于。举个列子，基督教里面那个有一个人是给耶稣用来复活，死而复活，那么很多人就认为耶稣把他能弄复活。当时他经典的计算是有问题的，是因为不知道什么世纪的时候，他的教众是因为要改那一篇文章，他邀请了教会的热学者帮他改，然后那个学者说这个是上帝的文字，不能够乱改。然后那个教众为什么要改呢？那是因为忘记了那篇新约圣经，我忘记了，他在坟墓里面，当时有人经过坟墓的时候呢，听到拉撒哭泣，在那边哭。那么死了怎么还哭？都已经死了，怎么还能哭？


    那个学者去研究在看以前文化的时候死是有两个意思的，1: 一个人真死2: 人心上已死，人心死的意思是说一个宗教不接纳你。在宗教里叫non-acceptance他不接受这个人是我们要这个教里面
    non-acceptance。在宗教的立场那个人就是怎么样死了，那么他说耶稣把那个人救活的意思是什么，他跟那个教会的人谈判然后怎么样，慢慢教会的人再接受回那个拉撒就死而复活，这是其中一个学者的一个解释。'
  - '[PAGE 163]


    处女处女生孩子，有另外一个版本。处女生孩子的意思是在古代的修士或修女，不错是保持独身主意的，不可以有性行为的，不过每三年会搞一次。就是他们有文典记录，原因是她们要生出一个孩子，这个人，是以前跟她们church，她是要传给这个有修士的学童，或者祭祀的学童的人才可以承接那个庙。你是王族的学童你承接那个王宫。


    处女的意思呢，另外处女是可以形容谁呢？所有修女她们都是用处女来形容的，处女生孩子是什么意思呢？一个修女还不到第三年的时候中间跟一个人搞了，生了孩子所以叫处女生孩子。所有历史是很过瘾，不同角度来解释，这些东西我们很有兴趣，这是越奇怪的越有争议性的东西越有兴趣。


    有些人讲NLP是一门宗教，我的看法是什么？任何一个团体里面都有很迷信的要研究，保险是一个事业也是一个什么？宗教。宗教都有些？传教也可能是宗教里面？NLP里面确实是有人把NLP当成宗教，什么东西都是要用NLP才可以解释的到，什么东西都是NLP，也有人是这样子，不过这一个假如有人这样做的话，其实是违反了NLP当时的创办人的原意。


    当时的创办人是说任何的一个，我们遇到一样东西的时候，起码有多少个选择，可以有三个选择，他说NLP只是其中一个选择，就是其中一个思考模式，另外一个思考模式可能叫权谋，另外一个思考模式可能叫做宗教，另外一个思考模式可能叫做其它东西。假如他说一个人只有一个思考模式的时候，那个人的那个行为就变的不灵活，那么选择不灵活，本来NLP那个最主要的那个一个思想就是说人是要有多过三个选择以上才有机会做人。那这种是一种选择。


    所有假如有人把NLP当成是一个宗教的时候，确实是这个违反了NLP创办者当初的原意，从另外一个角度来讲，NLP确实可以解释不少东西，所有当一个人用它来又是解释这个又是解释那个的时候，感觉上会感觉有点像宗教。当然它还是有个领域的，它不能用NLP来解释为什么会有海啸，这是解释不到，宗教可以解释的到，上帝不开心。所有现在对地球不好了，这全部都是解释，宗教有宗教的解释，NLP是做什么？所以假如是从这个角度，我们又不能讲NLP宗教，因为它不能解释所有的东西，宗教是什么呢，它的解释是包山？包海，什么鬼都包了就是宗教。


    同学：老师，如果是做销售员，我们要在我们人家不到第一次见面成文不到，那我们要怎样在最短的时间，当顾客和我们离开的时候，留下'
  - '[PAGE 164]


    一句最美的话语。


    老师：你之前要看这人对你的反应怎么样呢？你觉得他当时反应呢，他好像他把那个叫做兴趣不大，承诺感不大的那一次你不一定要成交，那一次你讲到最高潮的时候，最兴奋的时候讲一个理由，我还有下一个客人，一会再不去的话会塞车，找不着他，我觉得你现在还没准备好，不如下次我发个样本给你吧，最高潮的时候走，他才有那个叫做期待，叫他记住你。我们讲故事讲到最高潮时候就要停，不然的话就破坏了整个的气氛，所有你是讲到最低潮时候他才走，他有没有兴趣再接触你呢？没有。


    其中个很简单的方法就是，有些人跟我说他跟他女朋友不能常常见面，他不知道要怎么维持，他说他只可以在电话上跟那个人沟通，说怎么办。那是不是可以在电话上跟他讲话，讲到最兴奋的时候最爽的时候走，讲一个理由出来要大便，找个理由，就是在最兴奋的时候走，她才有期待去接你下一个电话，就不要等到，特别是有些人，他可能是很需要对方的时候，他一直跟对方在电话上聊，然后很兴奋，很兴奋的时候他希望继续保持兴奋下去，继续保持兴奋，人的兴奋是有一个限度，他可能不断地兴奋下去，兴奋差不多时候他开始微笑，那么你想再把他推上一点点那就要开始下了，那么你等到下了，之前那边对比是注意到了，这里你才终止对话的时候。奇怪感就不像样，所有最好是上，上，上，他的情绪也是动着的，你不一定上到最大，因为你永远也不知道最高是在哪里，上上上上到差不多了，还是上着的时候，他就哎呀可以了，朋友叫我出去了，可以出去了，我约了朋友？下次我们再谈。这个是有些客户也是这样子，没办法开始没办法成交的话，在最高潮的时候走。


    这一对夫妻要领养一个孩子，看到很多小孩他们不知道选谁，然后他们一坐下来心里很爽不知道选谁，坐在这里，有一个小老鼠它会讲话，刚开始小老鼠是推销其他的孩子。然后那个小老鼠就开始做，他逐步引导做的非常好。刚才那夫妻讲的话是老公讲一句，基本上是他还没讲完老婆就讲，老婆讲一句，那个字还没讲出来老公就讲了，这个一个是假如模仿一个人的时候，模仿有共鸣，有些人可以做到。


    在我的那个第一本书有讲过我模仿一个那个台湾的小姐，勾魂夺心洗脑，刚刚看了NLP的书我就模仿，模仿两个月了就拿她模仿，其中一个理由她很放心地把很多秘密告诉我，其中的秘密就跟就是她的性有关的，她肯告诉我'
  - '[PAGE 165]


    呢，是因为我们聊天的时候出现了那种状态她讲一句话说出来，他说在她的学校她是学钢琴的，她说她们学校里面有个韩国的男生，好像对他有意思，不过那男的跟她互动的不是很好，我就讲了一句话，我说你我觉得他是一个
    jeer（混蛋）是一个英文字，“混蛋？”差不多是这个意思。我就把她头脑里面拿出来讲，所有她才觉得对我呢有互动的感觉，所以刚才的这个互动是有可能做得到，假如你模仿很深入的时候，这种会出现。这个是题外话，主题还是推销小孩。


    还是这边开始推销其他的小孩，你不需要担心选哪一个。因为每一次都是一样的，每一次来选都是一样的。现在开始它的逐步引导，它说你会觉得很紧张你又不知道做什么，它现在是做的哪一部分？同步，因为这对夫妻不知道选谁，这个小老鼠就说，也不知道选谁也不知道怎么做？同步刚才的感受，声调开始改变，刚开始很紧张不知道选谁，然后你遇到其中一个，遇到一个它成交下来了，你跟他讲话选谁都可以。就跟老鼠讲话，双重的意思是怎么样？然后呢不知道为什么这个就是你想要的，有没有人不明白刚刚的老鼠。


    同学：它是要这两夫妻领养它。


    老师：它有没有这么好，你看看它的样子多可爱，这老鼠如果上了我们的课，这个对自就恨完美了。它也没有假设自己，它只是同步引导那对夫妻，它说刚开始的时候你不知道选谁很紧张，然后你见到其中一个，哪一个呢它没有讲，然后你就讲你就跟它讲话，刚开始不知道为什么？你跟它讲话去认识它，然后呢？不知道什么原因，你知道那个就是了，它声音改变。这么巧谁想跟谁讲错话，两个夫妻讲话错，两个意识重叠了，所以不要小看了这些电影，也有东西学的。你跟你的组员做那个练习是很紧张的，跟你的组员讲出你的故事，可以是精彩的可以是感性的都不要紧。听的人？三个人不够前后一起六个人，多几个人来帮你听你的故事，直接的告诉他，假如你听着讲故事的人，他讲的时候你的情绪动也不动的话你要怎么样？最起码讲故事的知道，我以为觉得有趣的东西别人是觉得是没错，那就要把那个故事要怎么样呢？（英文：qie
    s↓）ok，明白了？


    你跟那个组员那边六个人一组，不要讲的太长。组员给你回应就是说太长太怎么样或这些都讲的很好，你要给他一个回应。那么不要太过给面子，如果你听到很闷的话，你回他说不错啊，不要这样子来做，如果你真觉得是


    ![](img/13f08b43c255398fb0594fbc271fee1a_165_0.png)'
  - '[PAGE 166]


    闷的话，在这个教室，拿着你的准证指名道姓讲他讲的很烂（笑），因为你们来的目的就是要大家学到。好，你们 6 个人一组，我来解说。


    (练习中……)


    老师：好，暂停，我想听听哪一组哪一个人是想分享他的故事的？然后我现场帮你们剪裁，那么你们就很快的知道我的那个模式是怎样的，有哪一组或者哪一个人是要分享的呢？


    (粤语分享……)


    老师翻讲：他讲的故事有多少个事听不到的，OK，勉强翻译一下：一只狗，我不喜欢那只狗啊（都笑），他讲又一次游泳的时候有一个水泡，那只狗以为我要淹死了，那只狗就跑过来就咬着那个水泡，就拉那个水泡，他很生气，就踢了那只狗，后来有一次呢他们那有个人很喜欢偷东西的，那个人就来到他们家附近，有一个晚上就在那边偷看，就看到那个狗被铁链绑着，所以那个人就爬进来，那只狗呢就挣扎，铁链挣扎脱了，就去咬那个人，那个人就后来就到那些动物不知道什么协会的人就说这只狗呢，主人没有好好照顾这只狗，没有把它戴口罩，这只狗是有危险的。然后那只狗呢？（有插音，听不清）所以要拿去人道毁灭，他做的那个结论就说没有珍惜那只狗？那个结论有些勉强，那个结论就是忽然间跳，跳，跳了几步。


    你要加强的那个地方了就是，昨天讲（甜点？）那边不要讲太长，你是说你有只狗呢，我不是很喜欢它的，就是将那个水泡的那个，水泡那个可以讲，就是这样子来拉你，然后你要加强的地方，OK,整个故事前面说水沟拉你的那个要尽快讲完，因为那边的情绪起动不大，尽快的讲，精彩的那个地方是那个人要进来偷东西那边，你要这样子来形容，你要加强的地方是，那个狗是带铁链的？它是挣扎到颈部位了血，明白吗？然后再讲这只狗呢你很舍不得它？这样就有道理了，明白吗？所以你那故事前半段尽量缩短，而讲人家进来偷东西的时候那个狗呢挣扎，挣扎到那个皮破血流，但是那个狗呢还是很生气要去咬那个人？还是那种好像要保护你的那个样子，这样子然后呢抓取人道毁灭（？），这样子你很舍不得它，就有理由了，所以那边要加强，前面要缩短。


    同学：（粤语）


    老师：结论是可以这样的，讲完了这故事，有些时候你会发现有些人为你做一东西其实是你不知道（同学大笑），明白了？这是其中一个结论。所有'
  - '[PAGE 167]


    很多时候要你珍惜身边的人，因为有时他们为你做的事情你们不知道。后面那一组有人举手，ok，站那边大声讲究可以了。


    同学：我是宾城人，上个星期来 K11（一个地方，听不清）找了一个房间，然后我去（什么地方）碰到个女孩子，她说：那么上个礼拜就来到这个房间，走进去我是没有任何那个人，然后出来迎接我的是另外一个女人。


    老师：长的很像日本人？


    同学：像日本人？当时订的还是那个房间，是一个混血儿。那蛮性感的。


    老师：那女的以转身就跑？（大笑）继续，继续。


    我意思是说，你要尽快把那个前半部讲的很出的那个没问题，骂你 shit，这个都可以讲，就是讲到自己取笑自己，这是没有问题的。后半部讲那个上 NLP，当然是来上
    NLP 的，你讲的是来上 NLP 之后会怎样？这也是可以讲，假如是对换你呢？不需要讲上完 NLP 后过后又怎么样，但是其他场的那部分是不需要，你只需要说后来，哪一天她如果找我，那一个你可以加一些谈话（笑）然后我就讲：应该可以的。


    然后说对你很温柔，你用那个后面的那个高潮点你弄弱了一点点，我不知道你们听的时候会怎样，后面的高潮一下子弱了一点点。我现在还找不到那个关键点，那个关键点是，你说她的房间里面有另外一个女人，你讲了就变成之后那些人讲你所读那个名字的时候的话，那这个张力就不强。这是一个可能性，第二个可能性那就是说我要在想想，你这个是个很好的故事，只是前后需要改一改，假如我想到得话，你这个故事是
    OK 的，但是我只是觉得后面有一些地方出了一个很小的错误？所以变成，


    我不敢讲是不是不讲就会有惊讶，因为当时已经讲了那边空白的地方。我不知道那个时候是以为，我听你讲的时候我已经想到，可能是那个，什么 讲讲 讲讲讲，一讲同性恋，我没有那个惊讶的感觉，看的时候开始有那个感觉，好像你要讲是那个女的。


    女同学：他是否可以这样子来操作。她很正啊，他就走过去叫那个女孩子的时候刚巧门是没有关的？（大笑）


