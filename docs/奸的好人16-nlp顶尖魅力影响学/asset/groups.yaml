    NLP 来解释为什么会有海啸，这是解释不到。宗教可以解释的到，上帝不开心。所有现在对地球不好了，这全部都是解释。宗教有宗教的解释，NLP 是做什么？所以假如是从这个角度，我们又不能讲
    NLP 是宗教，因为它不能解释所有的东西。宗教是什么呢，它的解释是包山包海，什么鬼都包了就是宗教。


    ## 推销与故事结尾的艺术


    **同学**：老师，如果是做销售员，我们要在我们人家不到第一次见面成文不到，那我们要怎样在最短的时间，当顾客和我们离开的时候，留下一句最美的话语？


    **老师**：你之前要看这人对你的反应怎么样呢？你觉得他当时反应呢，他好像把那个叫做兴趣不大，承诺感不大的。那一次你不一定要成交。那一次你讲到最高潮的时候，最兴奋的时候讲一个理由：“我还有下一个客人，一会再不去的话会塞车，找不着他。我觉得你现在还没准备好，不如下次我发个样本给你吧。”最高潮的时候走，他才有那个叫做期待，叫他记住你。我们讲故事讲到最高潮时候就要停，不然的话就破坏了整个的气氛。所有你是讲到最低潮时候他才走，他有没有兴趣再接触你呢？没有。


    其中个很简单的方法就是，有些人跟我说他跟他女朋友不能常常见面，他不知道要怎么维持，他说他只可以在电话上跟那个人沟通，说怎么办。那是不是可以在电话上跟他讲话，讲到最兴奋的时候最爽的时候走，讲一个理由出来：“要大便”，找个理由。就是在最兴奋的时候走，她才有期待去接你下一个电话。就不要等到，特别是有些人，他可能是很需要对方的时候，他一直跟对方在电话上聊。然后很兴奋，很兴奋的时候他希望继续保持兴奋下去，继续保持兴奋。人的兴奋是有一个限度，他可能不断地兴奋下去，兴奋差不多时候他开始微笑。那么你想再把他推上一点点那就要开始下了。那么你等到下了，之前那边对比是注意到了，这里你才终止对话的时候。奇怪感就不像样。所有最好是上，上，上。他的情绪也是动着的，你不一定上到最大，因为你永远也不知道最高是在哪里。上上上上到差不多了，还是上着的时候，他就“哎呀可以了，朋友叫我出去了，可以出去了，我约了朋友？下次我们再谈。”


    这个是有些客户也是这样子，没办法开始没办法成交的话，在最高潮的时候走。


    ### 会说话的老鼠


    这一对夫妻要领养一个孩子，看到很多小孩他们不知道选谁，然后他们一坐下来心里很爽（爽/爽？原文如此，可能是指纠结或放松）不知道选谁。坐在这里，有一个小老鼠它会讲话。刚开始小老鼠是推销其他的孩子。然后那个小老鼠就开始做，他逐步引导做的非常好。


    刚才那夫妻讲的话是老公讲一句，基本上是他还没讲完老婆就讲；老婆讲一句，那个字还没讲出来老公就讲了。这个一个是假如模仿一个人的时候，模仿有共鸣，有些人可以做到。


    在我的那个第一本书有讲过，我模仿一个那个台湾的小姐，勾魂夺心洗脑。刚刚看了 NLP 的书我就模仿，模仿两个月了就拿她模仿。其中一个理由，她很放心地把很多秘密告诉我，其中的秘密就跟就是她的性有关的。她肯告诉我呢，是因为我们聊天的时候出现了那种状态。她讲一句话说出来，他说在她的学校她是学钢琴的。她说她们学校里面有个韩国的男生，好像对他有意思，不过那男的跟她互动的不是很好。


    我就讲了一句话，我说：“你我觉得他是一个 jeer（混蛋），是一个英文字，‘混蛋？’差不多是这个意思。”我就把她头脑里面拿出来讲。所有她才觉得对我呢有互动的感觉。所以刚才的这个互动是有可能做得到，假如你模仿很深入的时候，这种会出现。


