    ### 医生的故事


    太空上，他们一入口的那些食物，他们全部都是要检查。那个医生呢，医生就跟那个保安队长讲：“你的血压已经高了，这些胖胖的食物不可以再吃了。”这个保安队长就走私一种食物，就是橄榄油。


    因为之前有一个故事，那个保安队长跟那个医生说：“我的爸爸是一个很会讲话的人，不过每一年爸爸就是——一公斤的橄榄油，一半的牛油，煮，然后拿走面包，沾那个牛油，这样子来吃。”医生就讲：“你不可以吃这样的东西了。”当时我的爸爸，每一年就会煮这个东西给我们吃，可能是他想用这个方法来告诉我们他爱我们，因为他不是很喜欢讲话，他就这样子来做。


    这个镜头放去一边，到进入结尾的时候，医生发现，这个队长走私了牛油和橄榄油。医生就问：“你为什么这样子？”他说：“没有，因为最近打仗，大家都很辛苦，之前我有受伤，你有照顾到我，其实我是想煮给你吃。”（笑）明白吗？


