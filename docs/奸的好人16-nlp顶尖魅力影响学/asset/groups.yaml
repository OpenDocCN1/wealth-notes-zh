    ### 问题 1：电话怎么设心锚？


    **江**：电话用声音音调做心锚。客户讲到一些负面的事情做皱眉，重复他刚刚讲的开放封闭；讲到开心的东西你用笑脸重复他刚才讲的话。你这样重复在他脑海里面对话对方大脑潜意识已经有那个记忆了。那么下次打电话给你客户的时候呢，你用同步引导前面讲到过在，完了以后，当顾客讲正面的事情你用笑脸做回应，当他讲负面的是用皱眉做回应。这是听觉做心锚的方法。


    另一种方法就很简单了。打电话的时候，讲开心的话离嘴边近一点，讲不开心的拿远一点。有没有分别呢？有分别的开心，不开心都可以变成一个心锚。


    另外一个做法就看你开放封闭的功力了。之前我追一个女孩子的时候呢，这个女孩子还不能忘记他的前男友。有没有试过以前有的本来你是很喜欢他的，不过后来了不知道发生了什么事情，然后你开始觉得不是那么喜欢他了，同时已经开始把慢慢淡忘掉的人。注意这句是废话，讲的很模棱两可的废话。有没有试过以前有认识过一些人，刚开始可能你是很喜欢的，然后了不知道做了什么事情，不再那么喜欢他了，甚至最后了开始忘记了他。

    （女回答：她说有。这样说的原因是把他记忆里面的某个，他喜欢的人的经验习惯拿出来。）

    **江魔问**：是谁？

    （女回答：是他前任男朋友。）

    发生了什么事情让你对他有这种感觉？你前任男朋友有什么不喜欢吃的？

    （女回答：猪肉。）

    **江回答**：哦，猪肉。（注意声调 回答猪肉的时候加重音稍微拖长一些。）


    总结：在回答所有负面的做回应的时候声调都做重复做加深重音，稍微拖长一些。设几次心锚之后。

    **江魔问**：你忘了哪前男朋友叫什么名字呀？

