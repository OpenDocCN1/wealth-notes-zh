    # 观察力


    身体的角度


    头部的角度


    手足的动作和位置


    表情变化：眉、眼、瞳孔大小、视线移动、鼻、嘴、脸色、极微表情等。


    声音：速度、调、音量、常用字、感官用词


    呼吸：速度、位置


    初学者每次见到一个人有表情变化时，内心开始描述他的表情。


    谈话中，请常留意对方的“极微表情”。


    # 眼神的运用


    基本方法：


    +   - 看着对方两眼中的鼻梁。


    讲价钱、提出要求、或拍马屁时，一定要保持眼神稳定的接触，不可看其他的地方或眨眼。


    诚意眼神


    保持眼神稳定的接触，然后头部轻微的向旁边倾斜。会使对方觉得你有诚意或关心他。


    也可以让一个陌生人觉得你有真诚的友善。'
