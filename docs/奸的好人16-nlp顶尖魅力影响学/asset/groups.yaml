    # 隐晦命令


    运用语调、手势、表情，将一个命令隐藏在一句话中，对他人作出潜意识的影响。它可以让你：


    +   * 超越他人的理性防线。

    * 将信息直接植入他人的潜意识中，快速影响其决定。


    米尔顿   艾瑞克森医生通常会在隐晦命令的前后稍微停顿。当发出命令时，可以把声调放沉，放慢，或放入适当的情绪。


    当一个人听到一些他很有兴趣的事情时，通常都会很容易的……完全被吸引着。（同步，隐晦命令）


    很多人会……马上做**。其实你没有必要……现在做。除非……你觉得'
