    那女的就问他：“你是不是为了你爸爸妈妈做这个的？”他说：“可能是？？？差不多是这个意思，英文的翻译不能够完全的。”


    （继续）


    他这边是讲：“你常说，你一直等这些事情的发生，每一个人等的事情呢？”


    （继续）


    在等什么？这个就是，故事的意境开始怎么样呢？变成现实了。这一点的时候，那边意境就变成现实了。我是等，是等什么？等 你。那故事本来是跟她有没有关系的？现在变成好像有关系了。因为这个等的这个字了。她之前听了很感动了。他是一个怎样的人？孝顺，有承诺，把承诺的事情死要来做给女人，又有印象，又很感动。这个东西结合，就变成了他们之间的那个什么？互动。KISS
    这个东西，明白吗？


