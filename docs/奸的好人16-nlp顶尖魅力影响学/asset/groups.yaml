    总结：总之认同摸右边手肘，反对摸左边的手肘。所以触摸这里给他做开心的感觉做记号。


    很多人来（加重音做隐嗨命令）上我的课程的时候，然后就是开始讲废话。各位注意的，当我讲到哪里我触碰了他，（现场学员：来）（对，当我讲到来的隐嗨命令同时加上刚才做已经做到触摸认同的信号）。


    现在做那个不触摸的那个心锚。假如你要找一个的女朋友，哪一种女孩子你会喜欢？

