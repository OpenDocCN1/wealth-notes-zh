    99 年的时候，有一个创业家的演讲。他自己就是一个创业家，他上台后就讲：“噢，很多创业就是看到人家赚钱他就跟着做，他说这个不叫做创业。真正成功的创业家，你的嗅觉要很强。他讲在商机还没有完全正式成型之前已经嗅到那个商机，你要有那种猎杀动物、那种猎杀的本能，有这种本领你才会有办法成功。”


