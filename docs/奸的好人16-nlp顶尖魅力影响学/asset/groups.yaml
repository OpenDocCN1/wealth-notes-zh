  mdcn: "\n# 第二部分 极速掌握毒辣 NLP\n\n## 第一天（毒辣 NLP 毒辣表情应用）\n\n**电眼神功**：先有眼神接触，然后微笑，同时略微偏头露出脖子，这样的眼神和表情会让人觉得被关心和有诚意。\n\
    \n**坚定的眼神**：眼睛盯住眉心的位置，这样讲出话的时候会让她觉得你的观点很坚定不容易被动摇。\n\n**诚意手势**：讲话的时候将手放在胸口会让人觉得你是再讲实话和有诚意。\n\
    \n**男子汉眼神**：将两手食指伸出，与两眉同宽，想象两根手指间有一条线连起来，然后移动到两眉处，想象关联两眉处的肌肉运动，分别左手指向右边眉毛的方向反复运动，右手向左边眉毛的方向反复运动。这样肌肉受到手指的暗示后会加大眉毛处肌肉的紧绷程度，看起来会有一种男子汉的感觉。刘德华就很善用男子汉眼神。\n\
    \n**亲和力眼神**：将两手食指伸出，与两眼中间部同宽，想象两根手指间有一条线连起来，然后将两手指移动到鼻前两侧，顺着鼻子两侧的斜线，分向左下右下反复移动，眼部下方肌肉受到手指移动的暗示会加强脸部肌肉的松弛，松弛后的表情和眼神看起来很友善的。\n\
    \n## 第二天（毒辣 NLP 引导技巧使用）\n\n### 言谈模仿\n\n先提出一个开放式的问题，再用一个封闭式的问题来回应对方。\n\n比如：你觉得一个好产品应该是怎样的？（开放式），我想应该是耐用和价格便宜吧，还要有很好的售后。哦，假如现在这个产品是耐用和价格便宜，而且又有很好的售后，你会觉得他是个好产品吗，对不对？（封闭式）言谈模仿会让对方觉得你有在听，并且用对方的价值观回应，会迅速拉近彼此的距离。\n\
    \n### 同步引导\n\n- **同步** = 不可否认的事实。或者用一个封闭式的问题来回应对方。\n- **引导** = 想要对方接受的意见。\n\n\
    比如：我知道你现在不可能完全同意我的看法。（同步）因为每个人对某些事都有不同的角度去看待（再同步），所以今天我希望我们能理智的谈谈这件事，同时也请你认真的考虑下我的意见。\n\
    \n重要的是：两个同步一个引导。\n\n### 隐含命令\n\n运用语调，手势，表情，将一个命令隐藏在一句话中，对他人作出潜意识的影响。它可以让你超越他人的理性防线，将信息直接植入他人的潜意识中，快速影响其决定。\n\
    \n心理医生通常会在隐含命令的前后稍微停顿。当发出命令时，可以把声调放慢，放沉，后放入适当的情绪。\n\n比如：\n- 当一个人听到一些他很有趣的事情时，通常都会很容易（完全被吸引着）。“完全被吸引着”就是隐含命令。\n\
    - 当一个人已经知道这个产品的好处，只要公司有足够的预算，是可以（马上跟我们订购的）。“马上跟我们订购的”就是隐含命令。\n\n**如何设计隐含命令**：\n\
    明确目的，然后写出需要对方执行的指令。\n（可以先写指令，然后用宏观说话术模拟出目的）尽量让多个命令在一起使用，命令越多，威力越大，同时不要影响句子的完整性。将命令融入宏观的活术中。\n\
    \n### 假设布局成交（有兴趣，喜欢+假设=成交默认）\n\n**时间上的假设**：\n- 没有签约之前，你需不需要我再将这一部分解释多一次呢？\n- 我们还没有见面之前，你想不想我把我们公司的资料传真给你？\n\
    \n**二选一的假设**：\n- 你想要 X 或是 Y 呢？\n- 你想现在就签约呢还是回去和家人商讨后才签约？\n- 假如我们……安排见面的话，你认为是这个星期见面还是下个星期见面比较好？\n\
    \n**动作假设成交**：\n卖葡萄的故事：4 块一斤，报价的同时就装葡萄，称好份量问你，2 斤够吗，然后直接交到你手上。\n\n**知觉性的假设**：\n\
    - 知道，明白，了解，发觉。\n- 我知道你不可能……（现在就改变你的想法）。（反面，隐含命令）\n- 但是你有没有发觉到，我所提出的几个要点，其实是有道理的？\n\
    \n**简单假设**：\n- 你会不会方便告诉我？\n- 请相信我\n\n### 价值观和准则的引出\n\n- **价值观**：我们想要的或我们认为自己想要的。\n\
    - **准则**：我们对自己的价值观所下的定义和准则。\n\n**可以引出价值观的问题**：\n- （你认为（X）最重要的是什么？）\n- **X** 可以是：\n\
    \    - 一段美满的感情\n    - 聘请一个人或经理\n    - 购买一部车\n    - 一个有意义的人生\n    - 你最（喜欢、羡慕）的\n\
    \n运用言谈模仿的（开放问题）和（封闭问题）两种技巧来引出对方的价值观。运用（开放问题）来让对方讲出自己的重点词，运用（封闭问题）来得到更多的重点词和加深共鸣。为了不要让对方觉得你不断重复对方的重点用词，有时候你不用（封闭式），只是讲些话来认同对方，而这些认同的话中却可以采用他提供的（重点用词）。\n\
    \n然后问（准则）问题来找出的对方价值观的定义：\n- 【你怎样知道（Y）？】或【你怎样才知道（Y）？】\n- **Y** 是对方所用的重点词。\n\n不断的重复问（什么）和【怎样】这两个问题来引出对方的价值观和准则。记得把自己的故事和价值观也加插其中。\n\
    \n尽量将价值观和准则的重点用词记下来。把这些重点用词放进你要讲的话，催眠剧本，话题，故事，隐喻中等等，甚至可以针对性的以这些（价值观）设心锚。假如你的产品或服务不符合对方的价值观和准则，千万不要将之联系到自己的产品或服务上。后果自负。\n\
    \n### 普遍经验\n\n- 你有没有发现，其实好像全世界的婆婆和儿媳间都有仇似的？\n- 你有没有试过，有些人其实第一次见他的时候就觉得得很亲切，而另外有些人，缺不由自主的讨厌他？\n\
    \n夫妻之间的物质生活水平，通常是由收入较高的一方来决定；夫妇之间的精神生活水平，往往是由素质较低的一方来决定。一个女人能有多美，通常是由与她相伴的男人来决定；一个男人能走多远，往往是由与他相随的女人来决定。\n\
    \n你是否注意到，现今的推销与多年前已有不同？以前所用的技巧（例如高压及迅速成交），不再合适现今的企业环境。消费者和顾客更精明，也世故多了。他们的要求更多，多年前似乎无往不利的推销方式已经不起作用。\n\
    \n+ 【同步引导】消费者进步了，我们与消费者互动的方式也需要进步。人们变得精明，我们也应该更有技巧。更关心客户，了解他们各种层次的需求，才能影响他们，作成采购的决策。\n\
    \n你可能有过这样的经验，走进一家餐厅，女侍不情愿的问，“只有一位？”\n\n普遍经验有层级之分，处在不同层级的人会有不同的普遍经验，在于平时的积累。\n\n\
    ## 第三天（毒辣 NLP 含意装置故事播种技巧）\n\n### 含意装置（装置+启动）\n\n运用（故事法）（话题法）将特定的价值观和准则置入对方的内心，这就是播种，然后，你将一些有办法触发的（准则）联系到对方的特定的价值观上，目的就是让对方重新定义一个价值观。\n\
    \n比如：通常比较厉害的催眠师，他们看到对方使用一些方法的时候，是有办法立刻讲出那个架构给你知道。然后等一下，再讲出，刚刚那个人讲的故事中，其实是有在播种……（后面备有详细案例）\n\
    \n### 毒辣 NLP 讲故事\n\n故事有两种：小插曲，三分钟故事。\n\n剪辑故事的时候去掉低价值的部分。\n\n**故事 1：配合【含意装置】**\n\
    \n**【装置】**：长久以来，购买双方之间，由于咄咄逼人，短视近利，只顾及卖方的利益，而不顾及买方的需要，而形成落落。\n\n**引用**：约翰纳斯比特在《大时尚》一书中，利用一整章比较在企业还礼和公司理念方面，长期和短期的差异。销售和行销并无不同。\n\
    \n**（装置）**：现今企业的成功，大多由于客户长期的满意，建立口碑，重复购买，而使采购的周期很长。\n\n**个人故事**：例如，不久之前，我要买一部安全的好车。（讲故事要分清主题与副题，这个故事的主题是比较长期销售与短期销售的差异，而副题则是炫耀自己买了一部XX车）我看上一步高价位、豪华的美制柴油车。业务员向我保证，那部车的性能非常好，引擎保用一万五千里，几乎不需要维修。\n\
    \n结果，在第一年之内，十四度造访维修厂（包括四次拖吊），证明那部车的性能一点也不好。每次送厂维修，我对那名业务员及经销商的愤怒，成等级数增加，最后我终於换购性能良好的外国车。购买新车时，业务员花费很多时间，了解我不只是注重车子的安全性，还要兼具豪华与性能。业务员细心的之处，由于车子的性能良好，每一套系统都有支援的系统，顾及家人和我自己的安全。业务员还说，由于双重安全系统，及高性能的因素，我在一年之内可能需要数度进厂维修。他说的对，第一年车子进厂维修十几次。但是，每次维修都增强了他们对瞧兼顾安全与性能的观念。\n\
    \n**【启动】**：他们所采用的方法，使我觉得收到关心，安心的享用这部车，觉得自己买对了。你认为哪一家汽车公司，可以使我重复购买，继续做我的生意？\n\n\
    （故事中没有该汽车的品牌和价格，取而代之的是像“安全性”“豪华”等标准，还有对一些细节的描写，如：每一套系统都有支援系统。和数次维修。都能让人觉得作者的经济实力很强，却没有炫耀的嫌疑）\n\
    \n**故事衔接**：长期使顾客满意的重要性，从麦当劳成功的例子可见一斑。（让故事不停的讲下去）\n\n雷克拉克的麦当劳王国，建立在品质、服务、整洁及价值的基础，这些都是长期的付出。一份炸鸡太老，他宁可丢弃。热狗被手指按了一个凹痕，他也宁可丢弃，而不会端出去。\n\
    \n他知道从Newark的麦当劳供应的汉堡，可以看出世界各地的分店水准。他的行销内容，不知是今天卖给顾客的一份炸鸡或汉堡。（简单描述麦当劳的故事，掩饰启动时候的棱角）。\n\
    \n### 隐喻\n\n人生有时候就像拉大便，其实很多时候你已经很努力了，但结果可能只是个屁。\n\n### 心锚\n\n**偷印象**：当我们讲到对方心中的偶像，或理想中的对象，或对你任何有利的形象时，策略性的指指自己，策略性的意思是用比较隐秘的手势，如指指神功一般，我没法在文字里说明，就算我说了，可能很多读者也看不太明白而误导您用错，讲一个大概的方向，就是双手竖起来时，两个拇指自然而然的指向自己的胸口位置。\n\
    \n**破坏印象**：当我们谈到一些不好的人，令对方反感的事物的时候，我们可以策略性的指向那些你不喜欢的人，用整个手掌向外推出去，推向那个人的方向。若当时那人不在场，您可以谈到对方反感的内容时策略性的伸出一根手指，（千万不要竖中指出来）每当讲到的时候，就做同样的动作，之后您在谈起其他您不喜欢的人时，可以同时伸出那根手指，这样就把坏印象和对方链接到了一起，也是\
    \ NLP 心锚中十分毒辣的用法之一，在您不讲对方一句话的同时，破坏了对方的印象。\n\n**种心锚**：当我们讲到一些美好的事物时，如破坏印象般的伸出一根手指，但不要再同样手指，最好不要同一只手，这样就比较容易区分，之后每每讲到您的产品或您希望给对方好感的东西上，伸出那根手指，就把好的感觉链接上了。一个温馨提示：当您种心锚的时候要掌握好时机，通常要超过\
