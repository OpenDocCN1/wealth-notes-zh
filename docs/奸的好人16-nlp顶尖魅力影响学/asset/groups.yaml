    # 亲和力


    瞬间与任何人建立亲切感和倍增。怎么快速的拉近彼此的关系。让别人更加尊敬和喜欢你。


    任何可以观察到的行为都可以模仿。


    +   * 直接模仿：将自己变成如对方的镜像。


    +   * 间接模仿：用自己的一个行为来模仿对方的另外一个行为。


    你的功课——第一阶段，一交涉就马上直接模仿对方的头部动作，身体、手足等，要慢几秒才模仿，


    第二阶段，以上第一阶段，再加上模仿对方的表情，声音，呼吸。


    第三阶段，以上两个阶段，再加上模仿对方的一些无意识细微动作。


    +   * 初学者，最好练习模仿一个你不需要跟他讲话的陌生人或模仿一位你不需要回应他的人，富你能够很自然的模仿时，就开始练习同时模仿兼说话回应。


    +   • 初学者刚开始练习模仿时，模仿得越接近越好。当你能够很自然的模仿时，就开始练习模仿得越来越细微。


    # 言谈模仿


    在一问一答言谈间，运用对方所注重的用词，回应对方。然后再进一步将对方所注重的用词，逐步分解，重点在于不断重复回应和分解两个步骤，这是一个可以深入了解对方的技巧，同时可以很快的建立契莫感。假如不用言谈模仿而不断问问题，会让对方有被盘问的感觉。


    注意的用词的重点——语气特别、重复次数、表情动作。


    +   * 回应：用对方的重点用词来问一个    问题，对方将很自然的认同。


    +   * 分解：以    问题来问对方，其重点用词是什么意思。


    > 你：其实你们是需要一个怎样的人才会觉得满意呢？


    > 他：最重要的是他一定要有责任感。


    > 你：你认为最重要的是一定要有责任感？（回应求证）


