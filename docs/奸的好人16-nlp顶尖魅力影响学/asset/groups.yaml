    ## 普遍经验的程序


    1、 用问“普遍”问题的方式或暗示命令等的技巧来将对方的意念开始导向一个特定的方向。

    2、 当你问这个问题时，你自己必须先稍微进入该心理状态。

    3、 用“仔细”来推动对方相关的心理状态。

    4、 运用其他 NLP 技巧、五官用词和情绪化的描述来加强对方的心理状态。

    5、 当对方进入状态时，或在特定的“字眼”处，记得要设心锚，以备将来需要时，能够随时启动相同的状态。


    ## 价值观的灌输……含意装置法


    运用故事法、话题法将特定的价值观和准则置入对方的内心，这就是……播种。然后，你将一些你有办法触发的准则联系到对方特定的价值观上，目的就是为了对方重新定义一个价值观。


    简单的例子：我告诉你：“我的父亲曾跟我说一个好的讲师（指自），通常在讲课后，都会给机会你问问题。”然后我开始讲课，讲完课后，我就会跟你说：“现在讲完课后，我会给机会你们问问题。你们有什么问题吗？”如此，我在你的潜意识里，很间接的就是一个好的讲师。因为……我给机会你问问题。


    一般做法是：

    1、引述一个报告、书、文章。

    2、引述一个人家的故事、话题。

    3、引述自己的故事、话题。

    但，这两三个“引述”中，所灌输的价值观是一贯的。


    ## 例子


    我曾问过我的学生：“为什么你一定要参加我的课程？”他们都告诉我，当时他们决定要参加我的课程时，他们就好像你们一样，来到听我这个免费的讲座时，我会讲很多新的技巧。每次他们听到一个新的技巧时，他们都会有新的想法。可能是他们看到一些东西（指脸），或是听到一些东西（指口）。当他们有了新的想法时，他们就会有新的兴趣，然后就会有新的承诺要学这个新的学问。


    或者我说：“我曾问过很多人为什么他们要参加一个课程，他们告诉我通常上课的理由有两个：

    1、有新的东西学；

    2、这个新的东西跟你生命有关。因为若毫无相关的话，就算是新东西，学来干嘛？”


    以上的例子是运用隐喻、隐藏命令等来做含意装置。当我讲完以上的剧本后，我就开始我的讲座。每次我讲完一个新的技巧时，我就会问：“有没有学到新的想法？”来让听众承认他们有学到新的想法。为什么呢？因为我所装置的含意是：学到新的想法——有新的兴趣——有新的承诺要学——参加课程。


    在我的隐喻里面，我先播的种是“新东西”会最后牵连到要参加课程。所以，之后的我只要现在不断的激发“新的想法”，教“新东西”就可以了。


    *假设你是一个很幽默的人，你可以很随意使别人笑，你会如何装置含意来让对方喜欢你？

    *如何装置使人觉得你是一个信得过的人？

    *假设你为对方的某个心理状态设了一个特定的心锚，如一个开心的心锚，你会如何装置含意来让对方喜欢你？完全相信你？


    ## 消除抗拒


    1、引出对方的价值观和准则，设下心锚 x。每次讲到你的产品的好处时就触发心锚 X。

    2、每当对方提出抗拒的理由时，设下另外一个心锚 Y。

    3、**消除**抗拒的心锚 Y，**加强**价值观和准则的心锚 X。


    例如：


    我很了解你的现况。而且我也很高兴知道你是一个非常小心的客户，因为这表明你不是一个乱作决定的人。通常在这个时候，很多人都会根据自己过去的经验。来决定什么东西
    Y 要放下。什么东西 X 要注意。当你发觉这些东西 Y 是不必要的时候，你可能会……**放弃它 Y** 或忘记它 Y。但是当你发现到某些东西 X 是和你过去经验符合时，你可能就会……**接受它
    X** 也很自然的需要它 X。我想知道一下，你过去有没有…….


    ## 帮助他人改变


    江老师如何帮助一位空姐忘掉前任男朋友的痛苦经验。


    1、每次讲起对前任男朋友的愤怒和烦恼时，我以右拳设下**伤痛**的（心锚 1）

    2、当她告诉我在她还没认识前任男友前，她是一个开心果时，我就不断 地问得越来越仔细。当我见到她进入良好状态时，我会以言谈模仿的方式， 重复她的开心重点用词，同时以左手无名指在沙发上刮了一下。如此就设下
    了开心（心锚 3）

    3、两种心锚设了多次后，我开始作未来引导说：“在不久的将来，可能 几天，几个礼拜或几个月内。你可能会想到你的前任男友（心锚 1），他打电

    话给你（心锚 1），或者你可能会见到他时（心锚 1）……你可能会开始……（我举起双手大喊一声吓她，此为头脑空白的心锚 2）……你会想到其它一些更重要的东西（心锚
    3）”

    4、我久不久就会连续的触发心锚 1→心锚 2→心锚 3。目的是让她的头脑不断很下意识的演练（一见到前任男友）→（头脑一片空白）→（回忆起自己是个开心的人）多次。


    ## 未来引导的程序


    1、设心锚。

    2、透过“策略性模糊”的描述，把对方的念头带到未来。

    3、讲出对方“特定”会看到、听到、感觉到、想到的可能性情景，这些情景将会变成对方环境中的……“触机”。

    4、启动心锚而讲“策略性模糊”的描述，引导对方到你要的地方。因为你把“心锚”复印到对方未来的环境中，以后他的环境中只要出现你预设的“触机”，你现在所设下的心锚就会被启动了。


    ## 成为 NLP 大师的终极心法


    不要全部的招式一齐练习，要把一招练到熟练了，才练习另一招。

    不要期待效果，不要完美的预计，你要的效果就是不断的练习


