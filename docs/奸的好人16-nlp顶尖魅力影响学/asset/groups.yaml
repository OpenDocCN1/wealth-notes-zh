  - '[PAGE 152]


    些女人喜欢高，有些女人喜欢警察。是因为这个人给你们带来安全感，会保护你，明白吗？你是这样子来说。其他问题？


    # 讲故事


    他是把自己的那个，你整篇隐隐的某个颜色放那个比较深的，其他浅的，举个例子，我隐隐给你知道我很有钱，就算我跟你加强那句话，我很有钱，不错，我是隐隐，但这个不是命令来看，我直接告诉你，那个人听了这句，他的潜意识，要做什么？所以那已经没有用了，那个男人跟女人讲：我下面很长，so，没有任何的行动了，这样就不重要了，你要放隐隐命令，你看那些：之前并请我的客户，你加涨的话，反而比之前说，我有这个，我有这个要好，但也不会好到哪里去，只是对比起来，好一些。


    好，给你们看一看，第 20 页。昨天讲的那个故事。基本上了，我认为是这样的，你们每一个人都是很吸引人的，原因是这样的，只不过你们没有办法把自己的人生经历，剪裁出来，假如有一个很厉害的导演，把你人生的故事写出来，再把它接起来以后，应该，我认为会拍出来一部电影，是不会亏钱的，每一个人过去人生经验，只要满
    20 岁以上，应该发生过很多精彩的，感性的事情都有发生，看你怎么样去剪裁了，加起来，看起来就会很好了。问题是你见客人的时候，或看看这些朋友，那些人没有时间去认识你，可能要认识你很久，才知道你是个孝顺的人，很久才知道你是怎么样怎么样的，其中一个，我们是说不完这个过程，人的头脑是，相信故事多过相信资讯，比起来，故事容易记起来，人过去的几万年，每一个文化的历史是怎样传下去，通过讲故事，所以头脑记故事容易。


    好了，假如一个人跟你讲一个笑话，你会讲了个笑话，真的很好笑，假如有一个人连续讲了十个笑话，你很开心，你会怎样回应？你这个人很好笑？一个，你觉得这个笑话很好笑，十个呢？你觉得这个人很好笑，这个叫做做印象了，所以从故事里面，都可以带出你想要的印象。在香港，台湾有报纸是
    NO. 1。是什么？？日报，最出名的是什么，八卦。就算是那些很差的报纸，在马来西亚，英文叫？？这些小报是很赚钱的，为什么呢？里面包含的东西，很多人是不会相信的，不过那些人还是要看，他们还是要看，为什么？因为够八卦。


    人是喜欢八卦的东西，精彩的故事，你有方法把自己的精彩的部分告诉'
