    ## 三种声调


    我们的声调，我们的声调大概是有三种，有一种就是，那个讲话的时候，讲到最后的时候声调是往上。第二种有些就是完全是平的，到最后也是平的。第三种有一些到最后是往下。往上的这个名称，这个叫做问问题。这个声调（平），这个叫做发表声明。第三种叫命令，隐喻命令（下）。


    举个例子呢，比如我说，小明他走了过去（声调往上）？小明他走了过去（声调往上）？我会问你，小明他是不是走了过去？


    比如我说，小明他走了过去（平），注意我的声调，小明他走了过去（平）。我是告诉你呢，小明他，已经走了过去。那么这一个，小明他走过去（声调往下）。我是命令小明怎么？走过去。


    在我们目前的这个社会，比较多的女生，是受训的，就是用这一种声调，然后就是走往上的。男的是怎么？比较用这一个，命令的语调。很多时候，女人就是讲男人为什么不听我讲，就是叫他洗碗他不洗碗，我叫他买钻石他不买钻石。因为你是问他能不能够洗碗，一个是问，一个是命令。那他们在那些大公司里面也做过这样一个统计。通常是在领导层的人和不是领导层，其中的一个变化就是身体上的那个睾酮素。领导层上的那个睾酮素会比较高，睾酮素一高就是其中一个就是会影响你的声调，会受影响，会变得比较沉。所以，假如你是在某些时候你是做领袖，或者你就算不是做领袖，你是要命令一个人，叫一个人做一些事情，你要用哪一个声调呢？命令。讲价钱，人家问你这一个东西是多少钱？是用哪一个声调？不是命令，价钱的时候你要告诉对方一个事实，不是命令。你命令，比方说，你问我，你的课程多少钱，你现在问我。


