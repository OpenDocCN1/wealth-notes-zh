    # 开放问题与封闭问题


    基本上刚才我只问了二种问题而以，一个叫做开放式问题，一个叫做封闭式的问题，**开放式问题是怎么样问的了，用英语话来说就是WHY、HOW、WHAT、WHO、WHERE，**
    就是对方就不能用YES或NO来回答我，他一定要讲出他的看法，**封闭式问题是怎么样答的呢，YES或NO。**


    当发生在这个情况他不能用NO来答我。当我问封闭式的时候，为什么，因为我用回他的字眼来做什么，来问回他，他的封闭问题他，所以这个封闭问题，他一定要答YES，所以我第一个问题了的开放的，你最喜欢的是什么车，劳斯莱斯的，喔你喜欢劳斯莱斯，劳斯莱斯那一个车呢，刚才在一直不断的重复，我先讲的是反问，我刚才这样子做的时候，短短的二分钟里面，总共有，一，二，三，四，五，六，七，八，八个意思，就是我跟他互动的时候，他点头了八次，他会有一个错觉就是这个人的了解他的，这个人是一样去了解他，而且也会了解他。怎么加插了其他那些叫做故事呀，或者是说个人就变成很正常很顺畅的个人互动。就是二种问题，开放、封闭，开放、封闭，你要注意，假如完全不封闭了，就变成什么，盘问，盘问对方。


