    ### 同步引导与催眠


    同步引导在最原始的 NLP 技巧是用来做催眠的，就是催眠师要给一个人催眠的时候他讲一些话来客户没办法不认同的，他一定要认同的。举个例子假如那个人坐在椅子上，那个催眠师就这样讲：“你现在坐在椅子上，你可以认真听着我的声音，甚至一会察觉附近有什么其他什么声音和其他事情，这一切都不重要的。你听到什么声音和什么知道什么想法都会让你更加的放松。”


    大家留意我刚刚说话的之间都是有同步的，甚至乎催眠师讲假如你的身体忽然间移动了一下，催眠师马上把移动加进他的那个催眠语言里面。这个是在极端自我就是王里面有讲到催眠那些人看前世那个催眠就会问你看到什么东西了，继续引导他。假如给他催眠的那个人呢？任何一刻有什么改变或者有什么变化呢？催眠师是可以把他的变化加进去他的同步的，原因是变成我现在在讲的话就是目前你所经历的事实，所以你
    就不能拒绝。


    举例假如我是催眠师，在催眠着你，突然间问你能你听到我这样讲话会偷笑，那么催眠师不能够假装你没有偷笑，催眠师会说：“噢……笑是很正常的，让这个开心感觉，让你变的越来越放松。”你注意到你有什么反应？好催眠师都四两拨千斤，把你的这个反应讲回给你听，你给你一个指令，在你的反应解释成一种让你进入更放松的状态。


    我的一个同学和出现在一次学习米尔顿催眠的时候他这样讲，他讲到开心的时候在这边，讲伤心的时候在另一边。然后的当他想催眠的时候就站在开心的那边，假如他在笑就说“你这个开心的感觉让你更加放松”。他所用的技术跟所有的感觉同步然后让你进入催眠状态，所用这个同步引导也变成另外一招就是叫做重新定义。


    其实 NLP 的换框就是重新定义的意思，要是悲伤有了一个反应你就把那个反应讲出来，讲出来以后从那个反应在去解释，这个就是最简单的同步引导。甚至乎我们的 NLP
    创办人之一约翰·格瑞德他在教导的呢？现场发生任何的一些反应，有什么声音，或者有人说话，他就借那个东西在你现场的人一个指令，每一个东西他都借，借了后就这样子引导你进入催眠状态，这也是同步引导。


    或者，忽然一声，澎……的声音。他假装没有发生有什么后果？其实现场人的心已经被拉掉了，但是我假装没有事，你的心里面也会假装听，但是你心里面那个刺还在。所以平常我的每一次这些有来常复习过很多次的或者以前有听过我的课程的学院应该看到我有一个习惯的，现在有人打断的话或者有一些事情，然后接回去的时候我会假装我忘记我讲到哪里了，我不知道老学员有没有留意到每一次都是这样的。经常有人电话嘟嘟响了，这个时候就打断了对不对，假如我当着没有发生继续讲下去，你们的心情是没有准备好的。


    我的方法就是刚才讲到哪里了，有些人就说讲哪里？哪里呢？当然这需要演技。假如你们以后有复习可以留意一下假如有突发事情呢我是会假装忘记我们讲到哪里了，今天你们就可以留意到我假装了几次。原因是为什么我一一这样子讲的时候由你们的口里讲出来。咦……刚才我讲到哪里？我假装我忘记哪里了你们去想，然后你们自己就接会刚才的状态了，我就不需要强迫你们回去了，那就结的很顺畅了。


    假如现在有人发神经疯了啊啊的乱叫，这个时候我们处于混乱状态了，处理好她我就算直接说“我们刚才讲到哪里了？”


    **学员**：怎么样破坏印象。


    这是跟心锚的技巧，心锚的方法有很多种变化多端，之前有叫做权谋份子的，他来上 NLP，他就一直问明天我会把他会搞到怎么从疯癫？那种心锚的技巧可以运用到什么恐怖的程度。


    心锚的技巧是几乎是无穷无尽的。当我明天讲的你们就会知道他的那个发展的空间有多大。基本玩法我今天先将一些简单的，简单的需要做一些示范，我需要一个人上来配合我：首先最简单的心锚就是触觉了，触觉的讲法就是，我在跟他讲话的时候讲到某一个环节他认同我的时候我就触摸一下手肘这样来做。所以这边是认同，这边是反对。举个例子假如我问他：


