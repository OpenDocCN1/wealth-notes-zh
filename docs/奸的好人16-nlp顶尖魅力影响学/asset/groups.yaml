    所以我刚才是要讲，要是公众的时候要怎么呢？而且我不要你讲你的废话。正式的情况，开放封闭的中间要加些什么东西？自己的废话，就会变得对方会觉得你，因为一直在重复地讲。当时一定今天你到这里上课就是要听我讲废话。我讲我不要你问问题，你讲废话的时候，当时一句话很长，我只要你们自己做开放封闭，就尝试直接对着我说好了。


    我要求你们感兴趣做反问，你们在家里的叫做咨询意见。


    OK，再来，要听到：“老师，除了宗教，你本身是研究历史吗？”

    “历史呀，很少，我的历史都是研究宗教历史。”

    “老师都是研究宗教历史，这是开放还是封闭呀？”

    “开。”


    初学的人了，我帮助你们就是用这种重复来帮你们。假如在正式的情况，你们可以讲一讲废话，然后你们在……也不是这么多人喜欢的历史，不过你的意思就是你喜欢宗教的历史。我就觉得比较自由，我给你们做，因为你们是初学。其他的我会少研究，但是宗教的历史，我会研究。


    假如是在正式的情况，你们可以讲个黑话，再：“其实也不是这么多人喜欢那个历史，不过……”你的意思就是封掉你以前的历史，我就可以知道。我给你们一个教程来做，因为你们是初学。其他的，我比较少研究，但是宗教的历史，我有研究。


    **学生：** 为什么你会比较多研究宗教的历史？你对哪些地方有兴趣？


    **老师：** 这个是第几层？第二层。我去研究宗教的历史是因为我想看：宗教的人，本身他们讲的那个故事是一个版本，历史记载的那个版本又是另外一个。而且有些宗教的信仰，比方说，这个人信仰观音还是哪一个菩萨，他的那个来源，当时他出现的时候，整个文化背景是怎么样的？文化背景与信仰会改变主流，这些东西我是想知道，所以我才想这样子研究下去。


    **学生：** 老师，既然你喜欢研究宗教信仰，那你是不是……


    **老师：** 封闭了我刚才的。你不说你刚才封闭，你挑出了另外一些封闭了。你直接问我是不是……你刚刚封闭了我讲的东西。


    想一下我刚才用的字，我刚才用了什么字？某一个新娘在什么文化背景之下，他可以封闭我？


    **学生：** 所以你研究宗教的历史是因为你看一下世界的文化背景……


    **老师：** 勉强……来我们做第三层。现在做了两层，我们来做第三层。


    这个是封闭，我可能会讲漏。当然你也可以这样子问，在正常的情况之下，你可以随便这样子问。我只会讲一次，不会把整篇流畅的程度打乱。老师，我要求你们学会，起码不能讲话让对方一直这样子握手。你刚才问我


    会不会出家？正常的答案是不会。我要你用我刚才的字眼，因为你一用那些字眼，我逼不得已要怎样？我就要说 yes。再来，在某个城市，我的研究没有讲满意，没有讲不满意。因为研究这个东西不是讲满意不满意的。我研究的东西到底比谁更厉害？我比那些比如那些学者更厉害，其实这个没有什么满意不满意的。你看，他封闭我的时候，没有讲到教我那个字，我可以丢掉。你想象一下，假如你们俩是同一个个人，你刚才第一个封闭我：“你这么喜欢研究宗教的历史，是不是想出家？”而不是会想到出家。然后第二个问题就是你那个问题：你研究的问题满意不满意呢？不能讲满意，也不能讲不满意，因为跟满意不满意是无关的。


    好，现在我们讲话的流畅度开始不稳定了。我才要你们刻意得选我用过的字来问问题。


    所有的宗教都是剥削的，宗教界的人都会长大，把你吃掉。宗教界的人都会想很多理由来解释那个是有理的。大部分都是，现在已经讲到三层了。举个例子，我可以讲佛教的一些例子。例子举出来，那个就是变成第四层了。讲到第三层以上，那个对谈就有味道了。你没有讲到三层以下的，两层好一点，但是是不够的。好的要在三层以上，那个时候对谈就是有味道了。


    你们耳朵听出来吗？他第一讲的时候说的是“不是全部的宗教都是剥削的”，我只是指出来。你继续。


    “神棍”的意思是他知道这个是假的，然后他也认为是假的，但是他……讲个黑话……宗教里的传教人，当然有些人知道是剥削的，但是大部分宗教界里的人，他给了自己一个合理化的解释，那个时候，他就不认为是剥削的。这个我们就不能讲做神棍了，因为他也是相信了那个故事。神棍是他自己也知道是剥削，事实上也是剥削。这个是我的那两个的区分。神棍知道自己讲的是屁话，但还是来剥削。


    这个练习是很重要的，因为这个练习等到我们迟一点讲新魔的时候，新魔要跟这个刚刚的封闭要结合。每一个我教的东西是可以全部串起来，而且串起来的效应才是最好的。有没有问题？


    很简单的，你听我讲，不只是我一个人回应你的时候，你听哪些字眼出现的次数。注意次数，次数多了的话，就是你要重复的。这是第一。第二，就是有没有加重。第三，你真的耳朵又不够敏，眼睛又不够明，很简单。那个人讲了一大堆的废话，找那个废话当中的最后几个字的字眼，来巩固。你的记忆是最新鲜的，你应该是记得的，拿最后几个字来重复。


    加重的意思是分两种，可以是听觉的，也可以是声调、声调，可以是视觉的。你要加入一家公司是怎样的？我加入的公司是稳定的，老板是爱他的下属的，照顾他的下属的，而且有成长空间的。表情变大了，放大了，就是他比较关心的那种。


    你可以从听，也可以是听觉，也可以是视觉。所以今天早上我训练你们做表情，听那个人的声调，这些全部都是有关联的，全部都是有关联的。还有其他的问题吗？


    没有的话，我就播放一些东西给你们看。这个是英文的记录片，我把它拷贝下来。


    暂停一下，书本上没有讲过的，讲的是下半部，会有动作。上半部比较长，他是很快出现，很快消失。真的笑容是波浪形的，消失的时候是过两天消失，而不是“啪”不见了。你们看看这三张图片，哪一张图片是有真的笑容的？哪一个是真的笑容？这一个。眼睛，其他的人嘴有笑，眼睛的那个有笑，其他的眼睛没有笑的。


    暂停一下，有些人英文不是很好，他是讲有个人在大学做了一个统计。那些人在 20 岁的时候拍了一张照片，看他笑得真不真和这个人之后的命运，开心不开心，怎么面对自己的命运，信号能不能看出，预测出来。刚刚有三张图片，就是这些人。


    暂停一下，他们是看两个地方：一个是嘴角，第二个是眼圈旁边的肌肉，看有没有笑。所以今天早上讲的眼睛笑的，那个是用一些气功，看眼圈旁边的肌肉。本来是不受控制的，现在是受控制的。


    现在看这三个女人呢，大家想一想，结构是什么？笑容是真的和那个心态：

    她大学毕业后，去跟她初恋情人，也是大学里的同学，结婚一直到今天。她有儿子在做什么，女儿在做什么，她的人生观是“半杯空”，这是她这样形容自己。

    中间的那个女人，外国的女人，她毕业后，很快就结婚，但也是很快的离婚。她的感情生活是起起落落的，起起落落，起起落落……这样子的。

    第三个的那个东方女人呢，她的情绪就是这一天过得非常好，过个两天，跌倒谷底。这个人呢，到今天都还没有结婚，到现在都是单身。


    接下来，我要你们看的就是电视机里有一个电视机，就是电视机的荧幕里有另外一个的荧幕。荧幕里的荧幕，一个课程里面有另外一个课程。荧幕里的荧幕里有一个人，他的额头有一些皱纹，那个瞬间出现的很快，但是画面很快的就消失了。我指给你看，你们留意一下他出现的这个速度。看不清楚的话，就到前面这里来看，荧幕里的荧幕。


    平常的那个表情是半秒到两三秒。他们那边做的实验呢就是，问了一些人，给了一些人一样东西，里面讲两个话，一个是讲正话，一个是讲片话（骗话），说谎的时候要讲完全相反的。然后他们做的实验就是，看你认不认同死刑。有些人是选择讲真话，有人是选择讲假话。他们就研究讲假的人的表情。


    你们看到的那个，他说他是认同死刑。如果他是讲真话呢，这个东西就不会出现了。


    接下来给你们看的是伟哥总裁，伟哥那个药厂的总裁。美国的那些药厂是很有钱的，有钱到可以影响国家的政策。所以这些访问者就问这个人：他捐钱，就是你们伟哥的公司有没有捐钱到政治，那些政党里的那些人呢？对方一说有，那个人就问他：你们的目的什么？然后那个人就说的是：这个只是支持国家的那个民族，民族的制度，那个是对国家有帮助的，我们用钱来帮帮他。


    这个是一段对话。那个反问者，问这个伟哥总裁，问到那个叫做“明党”问题的时候，你们留意一下，这个总裁是怎样答？他答的时候有几个东西是可以看到的：越来越高的。通常语调越来越高的时候是表示那个人紧张。第二，他讲的那个谎话感呢，之前是讲的流畅的，讲到那里后就断断续续的，断断续续的……


    暂停一下，这里是讲的比较官方的那个发表。接下来是那个总裁的讲话，你们注意一下，那个人是怎么样的问他。他这里是说我们捐钱是没有要求有回报的。注意这个声调是越讲越高。这个我不能说他是……不能说他的意思是骗的。你们看到几个东西，几个信号，我很肯定他是骗人的。药厂是常常捐钱来影响这个国家政策的。我的意思是，假如你没有干扰，你只看这一个人，他这样子来答你，你注意一下刚才他的回答：他讲的是模棱两可，声调又越来越高，第三个是什么呢？断断续续的。他本来是讲得很流畅的，后来是断断续续的。那么这一个我们可以肯定的是说他有隐瞒，他肯定有一些东西不想讲。不能够说他一定是骗人的，有隐瞒也可能是有骗的，但是不完全是相等的，明白？


    有没有什么问题？再给你们看一些美女。对了，药厂，全世界的药厂都是影响国家的，所以捐了很多钱。从全国的角度，药厂捐了这么多的钱给政府，难道他真的不要求回报吗？肯定是要回报的。从这个角度想，他肯定是骗的。撇开这两个角度，看一个人，我们都知道他是伟哥总裁，一个普通人，他有隐瞒，但不一定是骗。


    接下来就是，现在这里有 4 个小姐，选美的。你们注意第一位和第三位，这是我邀你们看的第一位和第三位，这两位是有问题的。你们看到的，你们用广东话来将，不一定是广东话，就是这一个。


    暂停一下，我就录了两次。她第一次出现的时候用了广东话。我们玩的心理测试只是把个人的缺点讲出来。刚开始的时候她不知道。我问她你讨厌哪一个人？她说了什么？要跟这个人讲什么话。做了这个测试之后，我跟她讲：其实你讨厌的人的理由就是，你也会有有这个习惯，这样子来讲。所以她讨厌的东西，刚才主持人说我跟你讨厌他的是一样的的东西吗？然后就问：这个是不是你的写照？这个是不是你？那个女人就怎样？做这个动作，推上去。她不能够一直很生气的样子，在电视上要保持那个仪态怎么样的。这是第一次。


    第二次的时候呢，那个主持人就问她：你和你家人的关系是怎样的？这个女的就讲的好像很倔：他们很爱我的，我是最年轻，她们很爱我的。讲话 Q，这是假扮的，这是希望把情绪带到好的那一方面。那个主持人就问：怎么他们对你很好，但是你呢？敏感问题来了。那个女人的嘴角向后绷紧。其实这种绷紧呢，是她想跟那个人有一点距离。如果动作大一点的话，一个人讲到一个敏感问题，她可能会身体后退。身体不能后退或后面有东西挡着，或者有很多人看着不能后退了，他会头部后退。而头部也不能后退，嘴巴就要后退。再给你们看一次。


    接下来就是假的笑容，书本上有讲过一个女生假笑。第三位她不认同我们做的那个判断，她把麦交到下一个小姐的时候，那个假笑容，你们可以看得很明确。


    再来一次，再来看第二次。接下来就是我要给你们做一个练习。五个人一个圆圈，我数到 1，2，3 的时候，你们选一个说话者出来。1，2，3，说话者。说话者做到这边，其他人做到这边，可以看到全身。因为昨天有朋友是从香港、台湾过来的，所以喝了不少酒，醉了。在这个过程中要提醒，这个是题外话。就是用你的手指捏你的耳朵，往外拉，戳，用力得往外拉。第二个的时候，稍微下一点点。换句话讲，你的耳朵，第一次是从这里往外拉，第二次是按摩按摩。这样子可以给睡眠不足的提起精神。这样子，要用力的，夹着，这样子拉，从上面拉到下面，再从上面拉到下面。


    大概重复几次，上下做几次之后，你们感觉到了什么？除了耳朵痛以外，你们感觉到了什么？有没有感觉到头部左右痛？是不是有点热？拉的时候这里有点热。起码半个小时到四十五分钟左右就会有提神得半个小时到四十五分钟。自己觉得训练不够的可以做一做那个动作。


    好，接下来：我们回到我们这个练习。组员们可以问问题，问这个说话者什么。

