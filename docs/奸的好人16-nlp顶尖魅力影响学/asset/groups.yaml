    ## 心锚与引导技巧详解


    是一种讲废话，是引导对方过去的例子。


    在第一本书《勾魂》那本，原先那个版本没有，后来有的是讲那个传教士引述圣经的话的时候狠，讲上帝说“除了我之外没有第二个神”，有两重意思。第一是圣经的意思，第二个是什么？是讲这话的人也是一个“我”，就是这两个重叠了。所以传教界为什么传销的人可以吸引到很多人来跟着他，因为他们往往引述书上很多的经典，看他是怎么策略性的引述，有些是无意的，有些策略性的会引导群众开始把他当做上帝。


    那种人你要用心锚，而且要长期种，你要长期见他，一直不断地做。就你想你要长期种心锚来影响这个人戒烟，你让他忘记一个人易于忘记烟啊毒品啊，这种的上瘾的人你要常常出招。到现在我没有跟有毒瘾烟瘾的做这个招式，我有那个招式的方向，我在我的
    NLP 补习班里有一篇往事讲，因为有人问起。要一个人戒烟，我给她们一个方向，这是你们要做的。这个方面我就没有练习，有些朋友抽烟，我也没有刻意管过，说什么不要抽烟什么的，我不能说的。所以我没有个人的经验，我把方向写出来你们去试。但是用心锚去影响她的情人跟他分手是容易于让他戒烟的，这是我个人的理论。


    好，你们看第二个中间的例子。这个例子捏我知道我不能是他，你不能是我，这个是我看电视看过来的。这个电影是由两个影帝演的，两个都是小偷，其中一个是很出名的小偷，另一个是不出名的小偷，也就是小贼。小贼想要找出名的小偷去偷很著名的东西，那个人拒绝了他。然后那个人去到他的家里，说：“我不认识你，你不认识我，在这种情况下合作不是很好的方法。”多少个
    Yes？三个。但是我的个人记录是很好的，你可以去问某某检察官我偷过什么东西。最后一个部分才是引导，先同步再引导。所以我抄下来：“你跟别人做生意，你不认识我，我不认识你，这种情下合作是最好的方法。”你要同步就是要把对方所关心的或者知道的东西讲出来。


    所以曾经有个朋友刚刚离婚，心情很低落。就是朋友之间我不做引导的，就是不要看不开什么的。后来我带这个朋友去了一家咖啡厅，我们在外面坐下聊了一会，这时候我看到里面有个女的，我看出朋友对她有兴趣。然后我点点头他也点点头，然后我就庆祝你刚离婚，因为我带他去咖啡厅的其中一个理由是告诉他：“你失去一棵树，还有很多得森林。”然后我看到那个女的桌子上是没有饮料的，她应该是等朋友去咖啡厅，如果在酒吧我就不知道了，有可能是妓女什么的，在咖啡厅等朋友所以没有饮料。所以我去讲，你是不是等一个朋友？她说是。我说我可不可以问一个问题？她说可以。我说我先前坐外面的，我看到你坐在这里，我知道我不认识你，你不认识我。在这种情况下，我认识你不是最好的方法，但是我捏不住这个机会上来认识你。她点头，然后开始聊天。聊到他开始笑的时候，我看可以了，我就招手叫我的朋友，我来介绍。因为我的其他朋友在那边，所以我陪那边的朋友，然后我那个朋友就开始搭讪了。


    我要你们用笔在同步引导这个第十页上面打上一颗星星，因为同步引导是一个最重要的技巧。假如你真的没有其他技巧了，就用这个。你遇到什么难题没有招了就用同步引导，把对方心里的话讲出来然后再引导。刚才有人问起跟一个人有心结了，他心里面有抗拒，之前你对他做了对不起他的事什么的，道理都是一样。你要讲出来之前的事，我知道我之前做的东西你肯定是不认同的。你把他内心的感受讲出来，而且我也不会要求你原谅我，因为错误就是错误。你要跟他想要原谅我会服吗？你讲出他的痛苦，证明给他看你有办法了解到了，然后将出其他的理由，我们要合作做什么东西，要引起对方的兴趣，然后讲我也不会要求你原谅我，因为错误就是错误，道歉我会道歉，但是你不原谅我，我是完全可以接受的。对方会想我原谅你是怎样的。假如你说“我知道我错了，这一次你一定要原谅我”，对方一定不会原谅你。所以你没有什么方法捏你就用同步引导。


    ### 互动式同步引导的三个步骤


    第一步骤运用言谈模仿来问出对方的表象和问题。言谈模仿是运用哪两种问问题的方法呢？开放和封闭。你问出对方的痛苦还有烦恼还有问题，你用开放封闭式方法对方比较容易回答你。他有共鸣了他会回答你。你有没有目的？重点的是就是好像去见
    HR，问你希望公司是什么样的？然后你说“我希望公司是有成长空间”，成长空间就是重点词。你问问题收集对方的重点词。假设这个花十分钟。


    第二个步骤重复对方的烦恼问题，怎样重复？重点词来重复。重复的时间是 15 到 20 分钟。那你会想为什么要 15 至 20 分钟？我拿到那个重点词还要去猜还有没有别的重点词，而且猜出来的东西不会差多少，把他的痛苦放大。第一个步骤找到对方的伤口，第二的步骤是撒盐。目的是同步。


    第三的步骤你才给你的建议，你决定给建议的时间，这个目的是什么？引导。先收集对方的重点词，然后重复，之后加点你的观点然后放大。因为很多销售员可以做第一步，也有办法讲产品有什么好处，但他没办法证明他了解客户的痛苦。客户有时候怀疑你是不是真的理解我的问题，就是向他证明你了解他的痛苦。


