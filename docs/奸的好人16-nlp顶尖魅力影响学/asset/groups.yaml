    学员： 邋遢的。


    假如我现在要介绍一个女人给他认识，我要怎么给他设心锚呢：把我要介绍的女和他好的心锚做连接。


    假设他目前一个很想追的女生是我又不想让他追，就问那个女的不好是一面，然后做反对心锚连接。我的目的就是要对他目前想追的这个女人给他减分。


    换话题电影：


