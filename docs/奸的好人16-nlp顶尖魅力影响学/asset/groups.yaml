    再⻅。”当时那个是我老公。好，刚才多久讲完？其实⼀分钟都不到，我是拉长了⼀点。我算过，30 多秒，是要短的。有⼀些东西，是你没想到的。这些所谓精彩的，你自己呢，准备⼀些关于这些这样的，以后，认识新朋友的时候了，就讲⼀讲。听了⼀个不过瘾，第⼆个，又很过瘾，第⼆个⼜很过瘾呢，他潜意识的机械式反应，3
    次后，精彩的印象就种下来了。


    ## 故事的情绪剪辑


    那么这种精彩的故事呢，你们要问问自己了，你的故事要怎么样去做剪接。一个故事呢，要做的好，放一个图片给你们看，这个是情绪，这边是松，这边是紧。紧可以是正面也可以是负面。大部分的好故事呢，不好听的故事是这样子的：全部是资讯，资讯，时间越久得话，听的人越来越闷，没任何情绪，叫不好的故事。


    好的故事通常是怎么样的呢，紧，然后？松，一紧一松，一紧一松，这就是好的故事，松紧交替的。能不能够一直不断的紧下去呢？不能，刚开始是很紧张，完全是不一样的。有一个电影，那是我头一次看科幻电影睡着（笑），它一直制造了很多紧张。你能不能够看半个小时？打一下，紧，再换其他的，松紧松紧，就可以一直看下去。一直松，一直紧，都不好。好看的电影，好听的故事，它一定是又紧又松的。


    举个例子：有个电影是儿童电影，叫猫捉老鼠。一个小老鼠讲话，我是在电影业看的这个，我是顾面子得一个人，这么大一个男人去看，我就抄写了那个对白，那个时候还没有
    DVD，后来才有。开头的时候是有同步引导的人，引导那两个人去，里面有一幕，很经典的就是，又紧又松，任何好莱坞电影都可以看到，那些座座的。那个小老鼠，叫着车，去到纽约的公园，晚上到那边的时候，小车一下子抛锚，不能动的时候，镜头就看到一些猫的影子，情绪会怎样？紧张（笑）。那老鼠下车，就开车，越来越紧张。紧张过后，猫还没有走过来的时候，老鼠弄好了，就进去，关了门，现在情绪怎样？松？它就驾车走了，那些猫越追越近，又紧。差不多的时候，那个车一跑到，嘭，冲到一个悬崖，跌在一个水，跌下去，开始紧了。车浮上来，小老鼠没事，那猫不可能跳下去，就一直喵嗷，然后就松了。但是我们问你们？瀑布（大笑），又紧又紧，又没事。


    ok，明白呢？就算是一个废话的故事，没有内容的故事，你有办法弄到又松又紧，听的人就能够控制自己，就一定会听下去，明白吗？ok，所以，你的故事你准备好了吗？你跟人家讲的时候，假如你一直讲，发现对方的反应，他没有集中精神听，他没有追问你，表示他们没有动情绪，所以你要做剪接，要改，注意一下。你不是做记者，记者就是报道事实，但是我的意思是，传统的记者是要报道事实的，你的工作不是记者。你要的是讲到故事过后，制造一个印象，制造情绪上反应，这是你们的目的，所以你们的故事要剪接，太长，不起情绪就要剪掉，把它们情绪化。


    我举个例子，在第一本书，还记得跟一个空姐拿电话，跟她讲：“有诚意的话，就交换电话。”还有前半部呢？是，那一个事情之前的六个月，从滨城飞回吉隆坡，那个空姐，在起飞过后，她就开始讲那个安全的。她坐在那边，我坐在第三的样子，所以能看到她的样子，只看到她的半个脸。读的差不多的时候，就看看乘客，读到，看过我那边过后会有什么后果？电她，她一看过来，我就盯过她，一指呢，她停了下去。再开始读，下飞机的时候呢，她就跟她讲，用前隐晦命令英文跟她讲。是有前半部的，才又后半部的，才拿电话的时候，称赞她，过后才拿的电话。假如我写文章写到那里的时候，把两个故事，前因后果都讲，这个流程就是什么样呢？明白吗？你要问自己，我写那篇文章的目的是什么？就把那些不重要的那些资讯全部剪掉，只要你不要剪到一听是不逻辑的，就可以了。剪接太多久不好了，只要还有逻辑，就剪接下去。


    那一个资讯，剪了过后，入门之前，我还要让他拖一个男人。其实那不剪也可以，因为那个笑话，他是胡须，他不是百人，也不是黑人，叫什么人呢？他买了一些香油呢，就点一些什么，起一点我们的额头。要报告刚才我讲了就把他剪接出来，ok，我还可以剪了，再出来，就吃很多东西。吃东西的时候，真的就，完了过后，那些电影，他们吃东西的时候，摆什么羊腿啊，长长的桌子，摆什么羊腿，摆很多食物，当然有人切，摆在那边，好像吃自助餐一样。


    刚才讲的就是剪的，进去的时候，整个过程就没有剪了。因为洗脚那个，是精彩。你刚才听我讲故事的时候，少女给我一朵花，一听到夏天的那个女生，她忘记了，因为我电她，情绪起一起；老太婆，起一点点；洗脚的时候，坐下来，唱歌，情绪没有起；红色的液体，好像是要起了；我的朋友问我：“80
    个人的口水”，紧张；她走过来交给那个人呢，松。我心里就想，传过来，tmd。ok，你要注意那个故事，我是特意不讲出来吃东西，是有理由的。整个故事最高潮是哪里？是饿了，喊另外一边，那个是罪高潮，所以过后就要停，不要讲，再讲的话，情绪就要下了，明白了？


    这样子来讲：80 多个人 的口水，但是我讲那个故事的时候，我的内心的想法。第二个想法是：那个人一喝，我心里就想，逆时针转。那么这两个那个有情绪。希望他传给我，结果传那一边，80
    多个人 口水的味道，这个就变得很好笑。所以，最好笑的时候，最好就要停，因为之后我讲吃东西，我再讲精彩，不能够精彩的过程，那边最好笑的时候，这个就是讲故事的时候最重要的领悟。


    不需要讲，他问就不要紧，他问你可以讲一些资讯上的。但是那个故事，在那边一定要告一个段落，不然的话，你这样子讲下去，讲到吃东西，才告一段落，那个情绪已经是跌了下来。你要讲到最高潮的时候，停一停，那个人才有期待存在。


    当我讲这个故事的时候，很多人把很多印象呢，这个人很精彩啊，就讲那些很过瘾的故事给我听，这是其一。其二，有些人会比较笑，会笑，就会哇，会笑。有些人就会皱眉头。这样子得女孩子都有？我不知道，所以她会会很生气的，没有想到有这样一个结果。这就叫做精彩。那个故事，场白是真是真的，我当时确实想过这样子来跟他讲。


    我现在这样子讲那个女的时候呢，会不会把那个女人偷情的印象，种在我的身上呢？除非我这样子讲，我很认同这个女的。或者，讲了这个故事过后，给一个结论是什么？其实呢？人就是这样的咯，男人，女人在一起，就是我骗你一下，你骗我一下，这个种在我身上咯。就算我不下这样结论，我就把那个东西种在自己身上。不然只是精彩的八卦而已。有些人皱眉头，她不是皱眉头我，是皱那个女的，但是，不是对那个精彩不精彩的，还是精彩的，她只不过是
    在道德上，不能接受那个女的这样子。


    就是有一个，很精彩的故事，怎么样去打乱他，他讲了一半，你要打乱，你要有一个理由，你要直接去挑战他的，你看你的身份，看那个场合，适合不适合。你这样子说：电话一打肯定会打乱这个东西。假如那个人是上过我的课，打乱了，怎样做呢？（示范，笑）但是，我回去那个原？真的是要打乱的。你要这样子来做。


    那么为什么要讲感性的故事？精彩的是吸引人的。感性的故事呢，特别是你要卖出一种特定的印象。其中有个故事就是在，心魔行销里面，我有提示到，但是 没有讲出来。里面讲到李老师有讲有狗的故事，那天我就提示了，提示的目的，就是让别人来上我课，说我的那个故事就是我的杀手锏。这个狗的故事呢，是当时我用的之后，才吸引人的。我发现是怎样的呢？


    假如我是跟女生约会的话，没有讲这个故事呢，或者没有其他擦火花，通常就是见过 3 次，就没有戏了。我不是靠样貌的，通常讲？就有效了。假如我不小心讲这个狗的故事，通常跟这个女生，就会一直想见我。我讲这个故事的时候，里面的那个结论改□改，我下这个结论的话，那个女的就会跟我就会有那个事情发生。这个结论要怎么样来讲呢？上过道女班的，听过那个故事，不过没有讲这个结论怎么讲，因为这个结论是
    NLP 里。


    那故事是这样的，也是真实的，发生在加拿大，我人生见过最美丽的东西。我问那女的，有没有见过最美丽的东西呢？我见过最美丽的东西，发生在加拿大的时候。有一天，下着雪，我在巴士上，在前面是一个女的和她的孩子，一个非常可爱的小男孩，戴着手套。一个是，另外一个是这样，那么久，当时就过了不久，有个男人上了巴士，他一坐下来，他把他的衣服一拉下来有的时候，里面有两只小狗，很小的。那小狗可能是第一次上巴士，所以那小狗非常非常的兴奋。这个男人，他是失业汗，没有工作，他家里收了很多小狗。他就问那个妈妈，要不要买只小狗，给这个小男孩呢？就跟小孩讲，可能那小孩是第一次见这么可爱的小生命，很兴奋。然后这个小狗可能一生也没有见过这么小的人，小狗也很兴奋。这两个这么可爱的生命呢，那么久需要引导他们，就抱在一起，那个小狗就舔那个
    BABY 的脸。刚开始那个小男孩就笑的很开心。这幅画面，是 NLP 的招式，是我人生中见过最美丽最美丽的东西。但是我觉得这两个美女呢，但是我可以很好的告诉你，这一副画面，我肯定会永远永远都记得。（哦，哦……大笑）。刚才讲的时候，我还没有放情绪进去，因为我现在是讲这个，做老师有老师的责任的。


    我不放情绪，放下去就会蛮经典的。这一个讲呢，刚才是用心锚来做的。心锚怎么做呢？这一副画面是哪一副呢？两个意思，一个意思，是狗和小男孩的画面；另一个，我现在从心锚的层面来给你们解释这个招。换个角度，不要从心锚，我们从播种，那个印象播种那个层次来解释。我播的什么印象？你听我讲这个故事的时候，觉得我是什么样的？喜欢小孩？还有？爱心。这个就是人的头脑里面笨的地方。为什么笨？很多人就会认为你喜欢狗，喜欢小孩，你就不会坏到哪里去。老实说，喜欢小孩和狗是两回事，是不是好人，是不是一回事呢？不一定。我是好人！（笑）。但是我的意思是说，就是要告诉你们，就算那个人是好还是坏，喜不喜欢狗，和有没有爱心，是两回事，人很喜欢断章取义。


    我确实当时那一副画面是真实的，这个样子，我也有讲到，这个是真实的。不过真实的讲一些故事的时候，我发现人对我的反应是不同的。男人对这个故事有反应，和女人的反应哪个大呢？女人。之后不小心就对女人就讲这个故事。原来我讲这个故事是播什么种，才有这个效果。之后我在开始系统的用这个故事，策略性的用这个故事。怎么样讲呢？要靠一点点演技，不是完全一摸一样的。是说，当那个狗舔小孩子的脸的时候，笑的非常开心。当时那副画面呢，是我人生中见过最美丽的东西，我觉得是最完美的。假如我跟一个女的在一起的话，不过呢，假如当时你的？？在那边的话，这幅画面才是真正的完美。（笑）。这一种，你一讲这个结论呢，那女的通常就会跟我就会发生哪些感情上的东西。另外一个女生，我讲同样一个故事，最后的时候，这女的时候笑的时候，是非常非常的真。我趁讲了这个故事过后，过来几分钟，她一笑的时候，我记得你的笑脸，就让我想起那个狗和小孩。因为之前刚讲了故事，那小孩子给狗舔脸的时候，那种笑脸很真。又会发生感情了。我是把那个故事的意境跟这个人的互动，开始连接在一起了。OK，简单的就变成了，就变成了意境，变成了现实，明白吗？


    ## 电影示范：幸福终点站片段


    （备注：游牧人奸的好人读书群文件共亨里）


    看一看电影的那个情节，我是没办法把那个屏幕，字幕已经坏了，那个声音，我希望你听的清除。这一套电影呢，是幸福终点站。


    这一幕呢，有没有些人是看过这部电影的呢？我要解释一下：这一个东欧的某一个国家的人，他要去纽约。去纽约的时候，他的国家的政府就倒台了。倒台了过后，他就成了一个没有国籍的人，他的护照不受承认的，所以纽约的机场海关的人，不给他入境，也不能送他回去，就在那个机场活了
    9 个月。


    在过程当中，就认识了一个空姐，他们就开始有一些互动，有一些花花了。然后呢，那个他就没有跟空姐讲，他其实是无家可归。后来知道了他这个秘密，就问他：“为什么骗，不给我讲呢？”这一段时间，我只是以为这么巧的见到你了。然后就问他，为什么我会看到你拿着一个花生的那个罐头，铁罐头。因为是有人报告给她说，神秘的罐头一直拿着不给人的，就想知道他是啥，到底有什么秘密。


    我要给你们看的那一幕呢，就是他拿着罐头出来，讲一个故事，你要听这个故事。这个故事的情绪是很厉害的，是电影的一个高潮点。然后，这个故事一讲完的时候，我要你们看了，他怎么样把这个故事的意境转移向的，这个现实的互动。


    暂停一下，他开罐头，拿出来一个纸，这个就是杰斯音乐。他说在多少年得时候，看到一个报纸；他说在报纸上看到杰斯音乐团的那些照片，他一直看，看了整七天。她就问他，是谁。他有讲一些杰斯音乐家的那些名字出来。那个看了之后，他要写信给全世界的那些音乐，纽约还是哪里。人家这些修女帮他写信。假如是看戏的话，就会把那情绪中断。我们是来上课的，不是看戏的，所以我要中断来解释。真正看戏的这边的情绪第一次久会爆满。他说把信寄给全世界的那些音乐家的地方，他就开始等。一个礼拜，一个月，一年。他等啊等，等了
    40 年。情绪就开始，观众第一时间就会动。他说那些音乐家就签了名，寄过来给他，这边情绪又是再动了。然后就？？？？一直等，会不会？你要记得，因为等一下了，他会用？？的这个字来把故事的意境结合。而且他是用那个？？的原因，之前他等着一个，有夫之妇，等着她的男人跟她离婚，是什么呢？你注意这几个字，他是怎么样把那几个字重叠起来。


    （继续电影）


    他说怎么样？他爸妈已经死了，签名还没寄回来。看他怎么样播那个种。


    （继续）


    他说去纽约拿最后的一个签名，刚才那个罐子，Ok。


