    然后那个教众为什么要改呢？那是因为忘记了那篇新约圣经（我忘记了），他在坟墓里面，当时有人经过坟墓的时候呢，听到拉撒路哭泣，在那边哭。那么死了怎么还哭？都已经死了，怎么还能哭？


    那个学者去研究，在看以前文化的时候，死是有两个意思的：

    - 1. 一个人真死

    - 2. 人心上已死，人心死的意思是说一个宗教不接纳你。在宗教里叫 non-acceptance，他不接受这个人是我们要这个教里面 non-acceptance。在宗教的立场，那个人就是“死了”（不被接纳）。


    那么他说耶稣把那个人救活的意思是什么？他跟那个教会的人谈判，然后怎么样，慢慢教会的人再接受回那个拉撒路，就死而复活。这是其中一个学者的一个解释。


    ### 关于“处女生子”的历史解读


    处女生孩子，有另外一个版本。处女生孩子的意思是在古代的修士或修女，不错是保持独身主意的，不可以有性行为的，不过每三年会搞一次。就是他们有文典记录，原因是她们要生出一个孩子。这个人，是以前跟她们
    church（教会/团体），她是要传给这个有修士的学童，或者祭祀的学童的人才可以承接那个庙。你是王族的学童，你承接那个王宫。


    处女的意思呢，另外处女是可以形容谁呢？所有修女她们都是用处女来形容的。处女生孩子是什么意思呢？一个修女还不到第三年的时候，中间跟一个人搞了，生了孩子，所以叫“处女生孩子”。所有历史是很过瘾，不同角度来解释，这些东西我们很有兴趣，这是越奇怪的、越有争议性的东西越有兴趣。


    ### NLP 与宗教


    有些人讲 NLP 是一门宗教，我的看法是什么？任何一个团体里面都有很迷信的。要研究，保险是一个事业也是一个什么？宗教。宗教都有些？传教也可能是宗教里面？NLP
    里面确实是有人把 NLP 当成宗教，什么东西都是要用 NLP 才可以解释的，什么东西都是 NLP。也有人是这样子，不过假如有人这样做的话，其实是违反了 NLP
    当时的创办人的原意。


    当时的创办人是说，任何一个我们遇到一样东西的时候，起码有多少个选择？可以有三个选择。他说 NLP 只是其中一个选择，就是其中一个思考模式。另外一个思考模式可能叫权谋，另外一个思考模式可能叫做宗教，另外一个思考模式可能叫做其它东西。假如他说一个人只有一个思考模式的时候，那个人的那个行为就变的不灵活，那么选择不灵活。本来
    NLP 那个最主要的其中一个思想就是说人是要有多过三个选择以上才有机会做人。那这种是一种选择。


    所有假如有人把 NLP 当成是一个宗教的时候，确实是这个违反了 NLP 创办者当初的原意。从另外一个角度来讲，NLP 确实可以解释不少东西。所有当一个人用它来又是解释这个又是解释那个的时候，感觉上会感觉有点像宗教。当然它还是有个领域的，它不能用
    NLP 来解释为什么会有海啸，这是解释不到。宗教可以解释的到，上帝不开心。所有现在对地球不好了，这全部都是解释。宗教有宗教的解释，NLP 是做什么？所以假如是从这个角度，我们又不能讲
    NLP 是宗教，因为它不能解释所有的东西。宗教是什么呢，它的解释是包山包海，什么鬼都包了就是宗教。


