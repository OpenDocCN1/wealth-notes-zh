    5000。眉毛不要上，要平。要保持平。眉毛上，让对方继续讲，你不是减价钱，你是要对方讲那个问题。就用你的眉毛看着对方。他就问还有吗？对方就继续讲下去。


    要对方把那句话讲出来的时候，可以用眉毛。但是你讲价钱的时候不可以。就让眉毛不要动。说价钱的时候头可以点吗？头可不可以点呢？不是不可以，但是要小。等会儿我给你讲点头的东西。不可以一直点。很小的动作点一下不要紧，但是不可以一直点头。


