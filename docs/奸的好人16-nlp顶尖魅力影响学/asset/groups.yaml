    看电影，美国电影，其中除了欣赏、享受这种好的故事，我本身拿它们做为我教材来讲，把它们里面的招式变成我们平常可以用的。我看那个电影叫做《？？？》（注：原文模糊），他是一个雇佣兵，日本人透过一个美国人雇佣了他，但是雇佣他的那个老板很讨厌那个人的。有一天呢，那个老板就取笑他，就讲他怎么怎么，他很生气的，不过他是老板，他不可以骂他。当时我在电影里面，他就跟老板说：“我是雇佣兵，只要人家给了我
    500 块美金——这个很多年前，他们要帮他们杀谁呢？我就帮他们杀。你要我上，你给我 500 块的话，要我帮你杀黑人，我帮你杀；你给我 500 块的话，要我帮你杀黄皮肤的我也帮你杀；你要我杀？？的人，我也帮你杀；只要你给我
    500 块。不过呢，要是有人要我杀你的话，免费的。”（笑）


    电影里，用这种笔记本，就抽了出来，翻了有一页，是没有写东西的，就拿出笔，忘记在记，然后才 TMD 知道有 DVD（大笑），之后才知道不需要那么辛苦。不过翻版的那个对白呢是全部错乱的，全部是翻译错误的。所以鼓励看的时候就这样子来抄，抄那个对白，看那个故事的意境怎样去改。这一种，你们要学这种讲故事的话，等下午餐过后，会给你们一些练习，怎么样来讲这些故事。


    不过假如你们是想看这些电影，角色是讲很多故事的呢，你们可以买。这是课外话题。刚刚的故事，有什么特别的？就是这宇宙有好的外星人，有不好的外星人，战争，人类在中间就有矛盾。故事很普通，不过它最特别的地方是每一个角色都很会讲故事。


    其中一个角色是一个医生，当时的故事是这样的：


    ### 医生的故事


    太空上，他们一入口的那些食物，他们全部都是要检查。那个医生呢，医生就跟那个保安队长讲：“你的血压已经高了，这些胖胖的食物不可以再吃了。”这个保安队长就走私一种食物，就是橄榄油。


    因为之前有一个故事，那个保安队长跟那个医生说：“我的爸爸是一个很会讲话的人，不过每一年爸爸就是——一公斤的橄榄油，一半的牛油，煮，然后拿走面包，沾那个牛油，这样子来吃。”医生就讲：“你不可以吃这样的东西了。”当时我的爸爸，每一年就会煮这个东西给我们吃，可能是他想用这个方法来告诉我们他爱我们，因为他不是很喜欢讲话，他就这样子来做。


    这个镜头放去一边，到进入结尾的时候，医生发现，这个队长走私了牛油和橄榄油。医生就问：“你为什么这样子？”他说：“没有，因为最近打仗，大家都很辛苦，之前我有受伤，你有照顾到我，其实我是想煮给你吃。”（笑）明白吗？


    这个故事的意境开始怎么样了？你想像一下，这个人的感情就怎么样呢？就加强了。


    ### 下雨的故事


    OK，那么这个《？？》其中有个故事也是很难启的。他说他小时候很喜欢听下雨的声音，一听到就会睡得舒服。他说他当时有一个很重要的考试，之前呢很紧张，睡不着。这么巧那一天晚上下雨，他说：“哇，我真的很好，今天下雨了，我会睡得很舒服，第二天起来就会很精神。”去到考场的时候，看到每一个朋友就会很憔悴的，很辛苦的样子。别人问：“你怎么今天没精神啊？”他说：“没有啊，我昨天睡得很舒服，下了一场雨。”朋友说：“昨天没有下雨啊。”他说：“奇怪啊。”


    他回家的时候才知道，他的爸爸昨天做了什么？拿了个水龙头射在窗口那边，一直这样射，不知道射了多少个小时，他才睡着。


