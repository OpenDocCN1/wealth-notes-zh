    # 你的功课


    +   第一阶段，别管自己要怎样回答。只管找出对方的重点用词，同时把对方所用的重点用词，尽量记起。

    第二阶段，开始将对方的重点用词，作出回应求证和分解。

    第三阶段，在影响过程中，尽量用上对方的重点用词。


