    备注：在自己运用的时候可以多寻找他讨厌的东西做心锚连接，最好是视觉、听觉、感觉一起出现，越多越好。


    **学员**：要多少个心锚？


    **汪魔**：回答传统 NLP 是设三个以上，比如三个开心，三个讨厌。


    毒辣 NLP 之所以毒就是越多越好。我个人习惯五个，在聊到更夸张的东西又可以设设的心锚之后马上连接。连接他的公司，连接他的宗教，连接他的男/女朋友。比如一讲到他男朋友就做刚才那个声调加重或者手势动作。


    **学员**：当你做心锚记号是开心的，要是他放屁的时候他嘿嘿的笑，然后就是设了心锚。


    ### 怎么样做印象心锚


