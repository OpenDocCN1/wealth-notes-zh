    ## 隐喻法


    1、找出“问题”的主要题材。

    2、找出要达到什么“目标”。

    3、找出“引导”对方从“问题”达到“目标”的“过程”。

    4、设计一个相关的隐喻故事。可从奇幻故事、人生经验、个人经验、传说等找题材。隐喻故事的内容其实就是一个间接的同步和引导。同步就是所谓的“问题”，借用隐喻的方法来间接“引导”对方潜意识的“过程”。加强隐喻故事戏剧化和情绪化的效果。（可以从好的电影，或好的故事中找出方法。）

    5、设计出一个终极的大挑战、大危机来成为故事中的终极转换点。

    6、故事中的角色因为经历了终极转换点而有了新的观点、领悟或行为。进而达到了“目标”。


    Federal Express 是一个每天做上亿的生意。


    在总行的输送机有一天不能够动，叫了很多专家来修理都没修好，每天损失上亿的生意。


    后来听说有一个在这行里的修理专家之神，很辛苦找到他，很机缘巧合找到他，总裁 Fred Smith 跟他说钱不是问题，最重要是能够修好。


    他看了公司的蓝图、输送机蓝图、问了公司里的工程师，走到总行里的其中一根柱子，往上一看，看到了一个电路盒子。叫人拿了楼梯，然后爬了上去。打开了盒子，找到其中一个螺丝，把那螺丝扭了一下，在扭第二下时，轰！总行里的所有输送机，全部开始运作了。


    总裁 Fred Smith 整个人就松弛下来了，很开心的跟这位专家说“谢谢你，我们要给你多少钱？”


    专家说“十万元是一个公道的价钱。”


    总裁说：“啊！有没有搞错。请你跟我解释一下为什么这是一个公道的价钱？”专家拿出一张纸，在上面写了几个字，交给了总裁。


    总裁拿过来一看，笑得很大声然后说“原来如此，我们马上就来给你钱。”


    纸上写着：扭螺丝收1￥，知道扭那一颗螺丝收￥99999.00


    ## 价值观和准则的引出


    **价值观**：我们想要的或我们以为自己想要的。


    **准则**：我们对自己价值观所下的定义和标准。


    可以引出价值观的问题：


    你认为 X 最重要的是*什么*？


    **X 可以是：**

    - 一段美满的感情

    - 聘请一个人/经理/……

    - 你购买一部车/时

    - 你理想中的（男朋友/女朋友/伴侣/职员/经理等等）

    - 你最（喜欢/欣赏/羡慕）的（同上……）


    记得运用言谈模仿（backtracking）的开放式问题和封闭式问题两种技巧来引出对方的价值观。运用开放式问题来让对方讲出自己的重点用词，运用封闭式问题来得到更多的重点用词和加深共鸣。为了不让对方觉得你不断重复对方的重点用词，有时候你不用封闭式，只是讲些话来认同对方，而这些认同的话中却可以采用他提供的重点用词。


    然后问准则问题来找对方价值观的定义：


    你怎样知道 Y 或你怎么才知道 Y？


    **Y 是对方所用的重点用词。**


    不断的重复问什么和怎样这两个问题来引出对方的价值观和准则。记得把自己的故事和价值观也加插其中。


    尽量将价值观和准则的重点用词记起来。把这些重点用词放进你要讲的话、催眠剧本、话题、故事、隐喻中等等，甚至可以针对性的以这些价值观来设心锚。假如你的产品或服务不符合对方的价值观和准则，千万不要将之联系到自己的产品或服务上。后果自负。


    以下的这个例子是在应征时，用来引出对方聘请人的价值观和准则。须注意在你还没引出他的价值观和准则前，你已经暗地里影响着对方认为你就是他们要的人。


    应征时：我知道你已经看过了我的履历，同时你也跟其他的应征者见过面了。所以，在你的脑海中也应该有了一个理想的人选，一位你想找的人，一个你想聘请的理想（经理/行销员等）。我想问一下的是，当你想到这个你想聘请的人时，你认为这个人需要拥有最重要的条件是什么？


    ## 影响全体的~普遍经验


    普遍经验是一些近乎每个人都有 的经验。通常它也是非常好的同步。当对方听到普遍经验时，除了会认同你之外，还会进入相关的心理状况或经验。


    高素质的普遍经验通常都是自己不小心用上，或从别人口中听到，或从书本或电影电视中得到。请随身携带小笔记本把这些难得的普遍经验记下。


    例子：


    - 你有没试过见到一些人（指外）时，你就知道没有办法和这种人沟通。但是你见到另外一种人（指自）时，很奇怪的是，你却会很喜欢他们，你会有一种一见如故的感觉。

    - 你有没试过在小时候，你发觉到有一些东西（心锚）是你很想要的，或者是一些很重要的东西（心锚）。然后你就开始想象要买这个东西。你开始存钱，存下了好多的零用钱。最后你用了你所存下的钱来把这个东西（心锚）买下。


    请写出一些适当的普遍经验是能够启动以下的心理状况：

    - 很想要买一样东西。

    - 完全相信一个人

    - 很想帮一个人

    - 兴奋

    - 强烈的需要

    - 一些你一定要做的事情

    - 一些你已经不相信的事情

    - 一些不做就会一世后悔的事情


    | 类型 | 描述 |

    | --- | --- |

    | 普遍 | 你知不知道你当你对一样东西很有兴趣或很有需要时，你自然就肯对这样东西付出和投资？ |

    | 仔细 | 就好像有些女人，因为爱美的关系，就很舍得花钱在美容或化妆的产品。<br>就好像有些人，因为很喜欢车的关系，就很舍得花钱。<br>就好像有些男人，因为喜欢上一个女人，就很舍得花钱在这个人的身上。<br>就好像你小时候，你对一样东西很有兴趣时，你就开始把你的零用钱存起来，你不舍得吃，也不舍得喝。最后把你所存得的钱都花在这个东西上。
    |


    | 类型 | 描述 |

    | --- | --- |

    | 普遍 | 你知不知道有些事情我们会很容易记得，但是有些东西却很容易的一下子就会忘记掉了？ |

    | 仔细 | 就好像你刚刚起床时，你知道你做了一个梦，但是你却没办法记得起来。而且你越想它时，你会记得更一干二净。<br>就如你见到一个人时，你知道你有见过他，但是你就是没办法记起他的名字。<br>就好像你一直不断的提醒自己你一定要记得一些东西，但是偏偏到时候你却忘记了。
    |


    | 类型 | 描述 |

    | --- | --- |

    | 普遍 | 你有没有试过有些东西是你小时候相信的，但是你长大以后就不再相信它了？你有没有试过有些东西是你以前相信的，但是现在你就不再相信它了呢？ |

    | 细节 | 就好像你小的时候，很多人都告诉你，只要考到好的文凭和有良好的教育，就可以将来赚到很多钱。但是今天我们都知道那不是真的。 |


    以上的例子都是以“普遍”的问题来开始，紧接着以“仔细”的描述来加强对方的反应，甚至还可以再接自己的一些相关的故事来强化它。


    记得，你在问“普遍”问题时，你的目的不是真的为了要得到对方的答案，你的目的是透过问问题的假动作来启动对方脑中的经验和状态。


    ## 普遍经验的程序


    1、 用问“普遍”问题的方式或暗示命令等的技巧来将对方的意念开始导向一个特定的方向。

    2、 当你问这个问题时，你自己必须先稍微进入该心理状态。

    3、 用“仔细”来推动对方相关的心理状态。

    4、 运用其他 NLP 技巧、五官用词和情绪化的描述来加强对方的心理状态。

    5、 当对方进入状态时，或在特定的“字眼”处，记得要设心锚，以备将来需要时，能够随时启动相同的状态。


    ## 价值观的灌输……含意装置法


    运用故事法、话题法将特定的价值观和准则置入对方的内心，这就是……播种。然后，你将一些你有办法触发的准则联系到对方特定的价值观上，目的就是为了对方重新定义一个价值观。


    简单的例子：我告诉你：“我的父亲曾跟我说一个好的讲师（指自），通常在讲课后，都会给机会你问问题。”然后我开始讲课，讲完课后，我就会跟你说：“现在讲完课后，我会给机会你们问问题。你们有什么问题吗？”如此，我在你的潜意识里，很间接的就是一个好的讲师。因为……我给机会你问问题。


    一般做法是：

    1、引述一个报告、书、文章。

    2、引述一个人家的故事、话题。

    3、引述自己的故事、话题。

    但，这两三个“引述”中，所灌输的价值观是一贯的。


    ## 例子


    我曾问过我的学生：“为什么你一定要参加我的课程？”他们都告诉我，当时他们决定要参加我的课程时，他们就好像你们一样，来到听我这个免费的讲座时，我会讲很多新的技巧。每次他们听到一个新的技巧时，他们都会有新的想法。可能是他们看到一些东西（指脸），或是听到一些东西（指口）。当他们有了新的想法时，他们就会有新的兴趣，然后就会有新的承诺要学这个新的学问。


    或者我说：“我曾问过很多人为什么他们要参加一个课程，他们告诉我通常上课的理由有两个：

    1、有新的东西学；

    2、这个新的东西跟你生命有关。因为若毫无相关的话，就算是新东西，学来干嘛？”


    以上的例子是运用隐喻、隐藏命令等来做含意装置。当我讲完以上的剧本后，我就开始我的讲座。每次我讲完一个新的技巧时，我就会问：“有没有学到新的想法？”来让听众承认他们有学到新的想法。为什么呢？因为我所装置的含意是：学到新的想法——有新的兴趣——有新的承诺要学——参加课程。


    在我的隐喻里面，我先播的种是“新东西”会最后牵连到要参加课程。所以，之后的我只要现在不断的激发“新的想法”，教“新东西”就可以了。


    *假设你是一个很幽默的人，你可以很随意使别人笑，你会如何装置含意来让对方喜欢你？

    *如何装置使人觉得你是一个信得过的人？

    *假设你为对方的某个心理状态设了一个特定的心锚，如一个开心的心锚，你会如何装置含意来让对方喜欢你？完全相信你？


    ## 消除抗拒


    1、引出对方的价值观和准则，设下心锚 x。每次讲到你的产品的好处时就触发心锚 X。

    2、每当对方提出抗拒的理由时，设下另外一个心锚 Y。

    3、**消除**抗拒的心锚 Y，**加强**价值观和准则的心锚 X。


    例如：


    我很了解你的现况。而且我也很高兴知道你是一个非常小心的客户，因为这表明你不是一个乱作决定的人。通常在这个时候，很多人都会根据自己过去的经验。来决定什么东西
    Y 要放下。什么东西 X 要注意。当你发觉这些东西 Y 是不必要的时候，你可能会……**放弃它 Y** 或忘记它 Y。但是当你发现到某些东西 X 是和你过去经验符合时，你可能就会……**接受它
    X** 也很自然的需要它 X。我想知道一下，你过去有没有…….


    ## 帮助他人改变


    江老师如何帮助一位空姐忘掉前任男朋友的痛苦经验。


    1、每次讲起对前任男朋友的愤怒和烦恼时，我以右拳设下**伤痛**的（心锚 1）

    2、当她告诉我在她还没认识前任男友前，她是一个开心果时，我就不断 地问得越来越仔细。当我见到她进入良好状态时，我会以言谈模仿的方式， 重复她的开心重点用词，同时以左手无名指在沙发上刮了一下。如此就设下
    了开心（心锚 3）

    3、两种心锚设了多次后，我开始作未来引导说：“在不久的将来，可能 几天，几个礼拜或几个月内。你可能会想到你的前任男友（心锚 1），他打电

    话给你（心锚 1），或者你可能会见到他时（心锚 1）……你可能会开始……（我举起双手大喊一声吓她，此为头脑空白的心锚 2）……你会想到其它一些更重要的东西（心锚
    3）”

    4、我久不久就会连续的触发心锚 1→心锚 2→心锚 3。目的是让她的头脑不断很下意识的演练（一见到前任男友）→（头脑一片空白）→（回忆起自己是个开心的人）多次。


    ## 未来引导的程序


    1、设心锚。

    2、透过“策略性模糊”的描述，把对方的念头带到未来。

    3、讲出对方“特定”会看到、听到、感觉到、想到的可能性情景，这些情景将会变成对方环境中的……“触机”。

    4、启动心锚而讲“策略性模糊”的描述，引导对方到你要的地方。因为你把“心锚”复印到对方未来的环境中，以后他的环境中只要出现你预设的“触机”，你现在所设下的心锚就会被启动了。


    ## 成为 NLP 大师的终极心法


    不要全部的招式一齐练习，要把一招练到熟练了，才练习另一招。

    不要期待效果，不要完美的预计，你要的效果就是不断的练习


    ## 附录 1：简单有效的 NLP 影响方程式


    这一页是这份讲义中，最重要的精华。


    一般情况：

    1、眼睛观察肢体表情等，耳朵听对方的语调和重点词句。

    2、模仿对方肢体、表情、语调和重点词句。

    3、以言谈模仿来使对方产生认同。凡是有正面话题的认同就设一个心锚。凡是有负面话题的认同就设另外一个心锚。设越多越好。

    4、然后以同步和引导的方式来开始影响对方。特别是当你做到“引导”的那部分时，记得同时触发之前所设的正面心锚。

    5、当对方提起抗拒的理由时，你就马上触发之前所设的负面心锚。


    男女情爱：

    1、眼睛观察肢体表情等，耳朵听对方的语调和重点词句。

    2、模仿对方肢体、表情、语调和重点词句。

    3、以言谈模仿来使对方产生认同。凡是有正面话题的认同就设一个心锚。凡是有负面话题的认同就设另外一个心锚。设越多越好。

    4、话题中尽量加入如“喜欢我”“爱上我”等的隐匿命令、反面命令或引述命令。发出此等催眠命令时，记得同时触发之前所设的正面心锚。或者讲到如“喜欢一个人”“爱上一个人”时，就记得指一指自己和同时触发之前所设的正面心锚。

    5、视你个人价值观而定，如果对方一提起你的情敌的话，你就马上触发之前所设的负面心锚。


    ## 附录 2：催眠话题分析


    今天我来到这里，不是要跟你买，而且，也不是每一个人都需要这个产品。我今天来这里的目的是，最重要是教育你。


    意思是说，客户是最怕做错决定。所以在你还没有决定跟任何人买，就算是要跟我买之前，我们要确定你已经得到足够的相关资讯。


    有一些人，他们根本不管你是否买到一个你需要的产品。


    而另外的一些人呢，就算你没有需要，他们都要想尽办法说服你买越多越好。


    但是，最重要的是，你是客户，主控权在你的手上，我认为身为客户，你多多少少是知道你需要的是什么。


    而当你跟一个人买东西时，是因为你发觉到这个产品的好处，很符合你个人的需要，甚至你能想象到它未来怎样帮到你。


    其实，钱，每个人都想赚，但是我最想要的顾客，是那种跟我们买了好多年过后，还是继续的觉得满意。


    所以假如你认为有一个产品是不能够符合你的需要，请告诉我，我若知道其他地方有更适合你的产品，我会告诉你。


    ## 附录 3：催眠话题分析


    今天我来到这里，不是要你跟我买。而且，也不是每一个人都需要这个产品。我今天来这里的目的，最重要是教育你。


    意思是说，客户是最怕做错决定。所以在你还没有决定跟任何人买，就算是要跟我买之前，我们一确定你已经得到足够的相关资讯。


    因为销售员有两种，第一种销售员是他们也怕一样东西……他们怕你怀疑他，怀疑他的产品。但是如果他们只是怕你怀疑他的话，这种销售员是有问题的。


    说实的，我也怕客户怀疑我，也怕人家不相信我，但我更怕我的客户买了后会后悔。


    其实，钱，每个人都想赚，但是我最想要的顾客，是那种跟我们买了好多年过后，还是继续的觉得满意。


    所以假如你认为有一个产品是不能够符合你的需要，请告诉我，我若知道其他地方有更适合你的产品，我会告诉你。


    ## 附录 4：催眠话题分析


    我的经验告诉我，我是没有办法强迫一个人喜欢我或爱上我。


    我唯一可以做到的，是让自己成为一个对方可以爱上的人。


    那么他们是否要跟我在一起，完全是他们自由的决定。


    爱情火花这种东西，如果是没有的话，就算你常跟那个人见面，还是不可能。但如果你跟一个人有火花的话，就算那么不能见面，你也会不断的想起他。


    因为当我们爱上一个人的时候，不只是因为你看到这个个人，或听到这个人的声音，而让你有一种很好的感觉。更重要的是，你的直觉告诉你什么？


    每一个人的内心都有一把直觉的声音，当你这一把内心的声音，不断在重复的告诉你：“喂！这就是你一直都在寻找的。”你就会有一种终于明白的感觉。


    我，也有这种声音，我记得有一次……


    ## 附录 5：催眠话题分析


    我知道很多人说客户是买产品，这个是我不认同的，我认为不管你买什么，你是要买一个“结果”。


