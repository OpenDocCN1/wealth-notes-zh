    voice couch，那些讲话的教练讲的，你弄那个“哒哒哒哒哒哒哒哒哒——”最低了，ok，上来，五个（笑），“哒哒哒哒哒哒哒哒哒——”这里就是我跟大家讲话的声音。你做到最低，然后你再上来五个，这个就是目前你最自然的声音。好，假如你要弄到更沉的话你每天就是，“哒哒哒哒哒哒哒哒哒——”每天不断地念，念久了，这个要练多少个月我不清楚，声调就开始变的比较沉。


