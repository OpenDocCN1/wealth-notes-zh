    之前有一个学员，他是在印度街，印度人，他去买东西，他就讲跟店长在那里聊聊，聊差不多时候，他忽然间就看他的中间就讲“这个给我再便宜 5 元。”这是最好的教训。对方就再给他五块钱的折扣。谢谢。再聊聊聊，然后又说一句能不能再减。注意没有表情只看中间。他说是店价调整。最多两次，不可能有第三次，因为那样对方也觉得有点儿过份了。最高可以求两次。大部分一次就可以做到。你甚至试试看，在夜市买东西的时候，有时候要求减价。不看着对方讲，有的看着对方讲。


