    2 选 1。曾经有教过一家，有的学员做传销，卖些保健品，当他推销到很兴奋的时候，他讲：“你呢，是要加入我们公司成为会员过后才买我们的产品，因为比较便宜，或者你要吃了过后，觉得效果不错，再加入我们的会员？”这个是什么？这个是结合
    2 选 1 和时间。这个注意，他第一个选择是什么？加入会员才买产品；二个选择呢？吃了产品再加入会员。这个是两个重叠了，重叠的时候效率会高。


    再看第 19 页，知觉性的假设。我再问你一个问题，你知不知道我的 NLP 课程是全东南亚、全亚洲最厉害的？假如你说知道，代表了什么？不知道呢？其实你是认同了，只不过你还不知道。就像你知不知道其实你是很爱我的？不知道。不知道是什么意思？我是爱你的，只不过我不知道你是不是爱我的。这是知觉性的假设。不管他怎么样讲，总体是什么？他是爱你的。不同的假设。对这个假设有什么问题？


    看是什么时候讲那句话，就好像那个 2 选一的，做传销的那个学员，假如他做的听众完全没有反应，根本情绪没有爆发，最后你要跟他讲是加入会员后再买东西，还是买了试了之后再觉得不错再加入会员，他根本就没兴趣，他就根本不会认同。情绪动呢，情讲才有效果。刚才的问题是跟那个女生说，其实你知道你是喜欢我的，看你什么时候讲。我无端端走近一个女生，我不认识她，跟她说，你知不知道其实你很喜我？我知道你是个神经。那如果擦出了火花，再来讲呢，效果就不同了。有没有关于假设的问题？


    没有的话，我们来看第 20 页。刚才实践的时候，有个人问我，初学的时候是不是要自己写那个剧本？我说是，我以前就是这样子的。我有五六十本的那种东西，我喜欢没有线条的，因为可以画，乱写都可以。这是我的做法。你想到什么心得可以写下来，你怎么样去影响你的客户，你的朋友。对白像剧本一样，要怎么讲，讲到这里呢，要隐晦命令，那里呢，做什么动作，讲这里要指自己，讲这里要讲巧克力。写了过后，自己练习一下，跟朋友过过招，我是这样子。我这边是给你的大慨的方向，你自己可以想下怎么设主角，什么场景，你把这个写个主题，打个草稿，大致得写出来，然后你就要问你自己了，我希望怎么样演讲这个，你要进入什么状态，要采取什么行为，你决定过后，把你的稿子再改，把调味料再加上去，隐晦，心锚，同步引导都加进去。


    看后面有个例子，在第 37 页，这个只是一个大致的草稿，有些地方可能夸张了点，你看，不是每个人都需要这个产品，这里可以放许多进去。而且不是每个人都需要这个产品，来这里的目的是跟我买，隐晦命令；来这里的目的是教育你，就不用。这个是
    37 页，给你们 3 分钟时间，看下哪里可以变成自己的命令，哪里可以心锚，看哪里可以指自己，画下去。我本身，我自己用的符号是这样的（演示），这是我的做法，我会在那边打一个符号，指外面呢？指内，我的那个剧本。我设一个心锚是这样的，两个心锚呢，符号就会变成是这样子的。给你们
    3 分钟的时间，在 37 页弄一弄自己的剧本。


    好了没有？在这个地方，设一个心锚。客户最怕做决定了。有时候，昨天有人问我，能不能只设一个正面的信号，或者是一个负面的信号，或者正面反面两面都设？都可以，只不过有时候你设的，对方有个不好的，有负面的反应，用不上，只放在一边，你备着不时之用。如果你觉得效果没达到，可以用这个信号。不过，初学的人先不要想太多，我昨天已经说过了，先设好了一个，一个设好了，才可以一个一个再得说。


    “在你还没决定跟人买之前，我该做什么？”跟我买做隐晦命令，先画线。不要在跟我买的时候指自己，你要注意，指自己的时候是这样的。有些人你看上去很讨厌，但是我是好人。太明显，太明确的时候会被人马上忽略掉。你是一看上去很讨厌，但是另一个人是喜欢的，我没有这样子，所以你头脑里面会去过滤。但是手指向自己，自己播一个种下去，那什么时候指呢？“在你还没决定跟人买之前”“任何的人”可以指一下自己。


    有些人，根本不管你买不買你要的产品，这时候做什么？这是一个做法；另外一些人，就算你不需要，但是他还是想尽办法说服你买得越多越好。你可以到那个隐晦命令，你可以看到他想尽办法让你买的越多越好，你会发现。但是最重要的是，你是客户，主动权在你手上。我的问题是，客户需要是什么？假如你的产品是摆在你前面的，你会怎么做？你是客户，主动权在你手上，多多少少你会知道你需要的是什么。稍微指一下那个产品，当你跟一个人买的时候，你会做什么呢？当说“买”的时候指向自己，买东西时是因为这个产品有好处，很符合你个人的需要。那你想下在未来他会怎么帮得到你，这里要怎么做？指一下产品，说自己很需要。其实钱是很多人都想赚的，其实我最想要的顾客呢，是我卖一种东西卖了很多年后，觉得还是很满意，隐晦命令，所以继续来买。假如这个产品不适合你，你可以告诉我，提早去适应你的地方。


    我们来看看第 39 页，上面有段话，最后一句话，删除掉。那段话跟整个东西是没关系的。我的经历是告诉我，我没有办法讲出第一句话，我是爱上我的。爱上我，喜欢我，隐晦命令。我唯一可以做到的是让自己成为让对方爱上我的人，不一定讲对方。两种做法，你可以讲对方，他就是对方；假如我是女的，我成为对方爱上的人，这是一种做法。另外一个做法，你可以让对方改变声调，可以爱上我。我种的种子是她可以爱上，这是一个做法。有两种做法：一种是我可以做到让自己成为对方爱上我的人；另外一种是我可以成为让对方可以爱上我，隐晦命令，指自己，它就是变成我，我是那个可以爱上的人。


    我是怕你突然觉得很怪。他们跟我在一起，完全看我们自己的决定，用隐晦命令。爱情火花这个东西，如果是没有的话，你常跟他见面，还是不可能的；如果是有火花的话，就算你们不能见面，也会还是想起他。有些人就明白，一个是没火花的心锚，一个是有火花的。假如一个女人提出来哪个男的再追她，我怎么说呢？就触动了没有火花的那个心锚。“因为我们爱上一个人不仅仅是看到这个个人，听到这个人，听到这个人还有一种很好的感觉，更重要的是你的直觉告诉你什么是好的”，这时候该做什么手势？这里可以出什么招式？“爱上一个人，指自己，不仅仅是看到这个个人，听到这个人的声音而让你有一种很好的感觉，更重要的是你的直觉告诉你什么是好的”。这该怎么办？“不只是因为看到这个人”这是我的做法，我故意做的这样子，“看到这个人或听到这个人的声音”好像在讲“看”，可以指着我的脸，“不只是看到这个人或听到这个人的声音”，为什么指口呢？是我的声音吗？“而让你有种很好的感觉”“很好的感觉”就是看情况啦。比如这个人坐得很近的时候，“看到这个人的声音而让你有一种很好的感觉”。我的手一碰下去，碰到她手的时候，这样做就很奇怪，“很好的感觉”是哪一种感觉？是两个感觉：爱情很好的感觉，同时触觉是不是感觉？所以，这一个感觉就跟爱上一个人的看到、听到、感觉到的是在一个心锚上，明白？


    我在选择很好的感觉碰下去的时候是有目的的，因为是两重意思，双重意思来同步引导你之后，有时候，在你人生的战场上，你会看到舞台上的那个人。现在不是同步，在每个人的战场上都有一个舞台，当你看到那个舞台上的那个人是你最尊敬的那个人的时候，就想象你就怎么样变成那个人。现在我在讲什么东西，这么巧我又是在舞台上，但是我用这个比喻是说什么呢？你人生的战场上，一定要有一个舞台，“那么巧，我有坐在舞台上，那个舞台上的那个人是你最尊敬的那个人”。两重意思，到底是头脑里的那个比喻呢，还是江老师坐在舞台上？这两个东西就开始重叠了。所以你爱上一个人的时候，有时候是你看到这个人或听到这个人的声音而让你有很好的感觉，一讲到感觉的时候，就啸下去，那对方就觉得怎么样呢？到底是这一个感觉呢，还是爱上了的感觉，还是这两个怎么样，重叠了。“更重要的是你的直觉告诉你什么”我们来看一看这一段，“因为每个人的心里都有一把直觉的声音，当你把这个内心的声音放出来之后，这就是你找的，你就有一种你终于明白了的感觉”。


    好，你们告诉我这个要怎么讲？这个应该不容易讲出来。这个学催眠的人，学到我这精才能讲出来的。注意我做？看我的手啊，“因为每个人的心里都有一把直觉的声音，当你内心的这一把声音在不断地重复告诉你”。为什么我要指我的口？指的目的是什么？讲到这里的目的是什么？把我这一把声音变成什么？对方内心的声音，把我的声音变成对方的心声。“当你内心的这一把声音在不断地重复告诉你，哦，这就是你一直寻找的”。这个要怎么做呢？“这指自己，你会有一种终于明白的感觉，我也有这一把声音”。这有什么意思？我也有这个生意，这个有两个意思。面上代表什么？我也有这个声音。另一层呢？代表什么？我也有这一段声音。嘴呢，指也可以，不指也可以，因为这一句话是两种意思已经重叠了。这就是我给你们两个：一个是做销售的，一个男女关系的，你们可以从这边去研究。一个很好用的，这个练习很简单的，拿我们的书随便翻一页，然后看到文字，这里可以放什么，那里可以放什么，自己练习。你也可以随便拿一张报纸，一个专栏来看，我要跟一个朋友分享这个专栏，哪里可以放隐晦，哪里可以做什么，哪里可以做什么。明白了就先写自己的剧本。


    还有没有哪里有问题？


    学员：触碰那个手的时候，是否有爱的感觉？下一次，女生会不会有不同的反应？


    我昨天已经讲了，设心锚的时候，往往过后，假如你不做连接的时候，那个心锚容易被污染。所以设那个心锚过后，你要马上做一个转移。讲到自己的时候，碰她的手啊。或者说有时候，有些人，有些女生才刚认识我不久，就跟我讲：“老师，你有没有想过跟我在一起？”我那一句话是用隐晦命令来做，碰触她的手，隐晦命令和感觉一结合。未必是对的，是一碰的时候，那个感觉出来了，但是未必是连接在那他身上。你碰了过后，要连接在自己身上，或者是给的那个命令。你们不要怕那个心锚哦，有些人一碰，爱上她怎么办呢？不是这样的。心锚是不断的被环境触碰到的，你看一下爱情的，恐怖的电影，很多心锚就被触发掉了，并不是说你看了过后，你看你旁边的那个家伙就会爱上她了，不是这个意思。心锚还要跟命令做连接，才可以有那个效果和反应。好，其他问题。


    同学：隐晦命令是短短的几个字。


    老师：对，不要太长。


    同学：比如一段话里面有，比如说，前面有，后面有爱上我。


    老师：你可以，就好像我在讲那个朋友哦，会不会，爱上我，连接（示范）。你爱上我，或（笑），你要这样子做是可以的。但是，通常我选择简单一点的，短的。隐晦命令那一段就是一个命令，而不是把那个命令拆开。可以这样子做，拆开的话，那个写剧本的能力要更强，你用的那个字要更小心，我就简单一点，一个命令就是一个隐晦，你可以这样子来做。


    同学：假如我是写剧本的，一段段跟人家聊天的话，怎么播种？


    老师：你播的那个种，你要注意了，昨天我要求你们打三个星星，同步引导，和隐晦那个重要？同步引导。隐晦命令不是这么重要，是调味，是加强。但是，假如你的同步做的不好，或者本身你承载的那个内容不够吸引人，那个情况下加隐晦就没有用。调味就像加在鸡和大便上，一点用处都没有；但是加在大便上，一点用都没有。所以，隐晦不是最强的，是调味的。所以有人问我，要不要在写
    EMAIL 的时候，用那个隐晦命令？可以，把那个字弄大，弄粗，变颜色，都可以。但是假如你卖一篇文章，那个 EMAIL，根本不吸引人的，那些隐晦命令就没有用了。明白？最重要的是那个，是写的那个讯息本身才能吸引人。昨天我讲了，那个同步引导呢，很重要的，就是这个意思。其他问题？


    同学：假如在考场，我们是用笔的写的，画线的杯发现，怎么办？


    老师：记得，最重要的不是隐晦命令，最重要的是内容写的好。你先集中把内容写好了，那个隐晦命令才有用。我不知道考场啊，不过，你一直画了，就给人感觉，考官就会感觉奇怪啊，还是太乱啊，这个我不清楚。


    同学：如果我只是画线，会不会有影响？


    老师：画线，隐晦命令是可以。比如那些 EMAIL，广告，你可以用画线来做隐晦命令，绝对能帮到你。


    同学：刚才那个男女关系的例子，开始就把那好的感觉连接在一个动作上，最后还连接在自己身上，会不会更好点？


    老师：可以，你要连接在自己身上。一，直接指自己。二，设了一个动作过后，在连接在自己身上的时候，语言上要灵活了。等下你要跟她讲废话的时候，你的名字指自己的时候才触动那个心锚。


    同学：那如果指自己的话，就不用设很多次了。


    老师：就是一直讲好的，就指自己。就好像说，你最喜欢的男人是怎样？她就讲啊，高大的？假如我不高啊，你说：哦你喜欢高的啊。假如一个高的男人，你一见到他（演示），注意啊，我不是在讲高的时候指自己。我指自己的话，是不进去的。特别是那个女的觉得我矮的话，讲：“你这高的男人呢”，讲高的时候指自己了，她就不感觉高了。说：“假如你一见到一个高的男人，这一个，你看，我分开两句：你这一个高的男人，是一个人呢，给你带来什么感觉呢？”回保护我咯，安全感咯。其实换句话说，高或者其他，有

    '
