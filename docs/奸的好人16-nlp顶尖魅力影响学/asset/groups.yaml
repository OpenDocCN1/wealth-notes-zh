    can speak english? ok，然后她一点点头就笑，然后我就，会不会讲广东话？然后我就一直讲，然后我在下面看到你在上面然后我就上来，然后就是一直讲她就一直笑，然后又没有讲话，然后我就这样，到底你是不是广东人会不会讲广东话，“啊我不是呀~”（笑）那个女的好像那个谁啊，好像那个……香港的那个那些无线电视的那女演员，我现在忘记她的名字了。（笑）那么就，我看到，我上去，我本来给她眼神电到，但是一讲话的时候我就是，很辛苦，就是没办法，就是那分数马上就飙升了飙最高分。刚开始的时候，一旦下去我就没办法接受这个事实。就是声调，马来西亚人的声调是偏高的。马来西亚女人的声调，更偏高，更加偏高。这个就是，我其中的一个猜测，只是我的猜测而已。


