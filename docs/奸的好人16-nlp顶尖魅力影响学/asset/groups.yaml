    500 块美金——这个很多年前，他们要帮他们杀谁呢？我就帮他们杀。你要我上，你给我 500 块的话，要我帮你杀黑人，我帮你杀；你给我 500 块的话，要我帮你杀黄皮肤的我也帮你杀；你要我杀？？的人，我也帮你杀；只要你给我
    500 块。不过呢，要是有人要我杀你的话，免费的。”（笑）


    电影里，用这种笔记本，就抽了出来，翻了有一页，是没有写东西的，就拿出笔，忘记在记，然后才 TMD 知道有 DVD（大笑），之后才知道不需要那么辛苦。不过翻版的那个对白呢是全部错乱的，全部是翻译错误的。所以鼓励看的时候就这样子来抄，抄那个对白，看那个故事的意境怎样去改。这一种，你们要学这种讲故事的话，等下午餐过后，会给你们一些练习，怎么样来讲这些故事。


    不过假如你们是想看这些电影，角色是讲很多故事的呢，你们可以买。这是课外话题。刚刚的故事，有什么特别的？就是这宇宙有好的外星人，有不好的外星人，战争，人类在中间就有矛盾。故事很普通，不过它最特别的地方是每一个角色都很会讲故事。


