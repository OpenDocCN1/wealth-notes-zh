    NLP 技巧，她们尝试出招。差不多到“和”的时候，我只是负责讲，就像台上的肖像。过了不久，两个女的讲到了巧克力，我就做了个实验，我要示范两个朋友：“你最喜欢吃哪种巧克力？”我忘记讲到哪个地方了，就假设那种很贵的那种。有时候你可以想象一下，你很喜欢吃那个东西，你已经有整整
    6 个月没有吃过那个东西，你很想吃了。或者有一天，终于看到那个东西，你买了，你准备回家吃（笑），因为你这么久没吃了，你在买的时候就可以想象把东西放在嘴里的味道。我注意到一个事情：那两个女的，我一讲巧克力的时候，她们就……我一讲，就“吧唧”，看到的时候还没有开始吃，请开始想象把他放进口中，感觉那个味道。我一讲呢，两个女的同一时间，注意我的动作（演示）。一扭，“哇哦”，有个女的脸色红了，一直跟我有眼睛对看。没有要再进一步的，我这样子出招，会不会有什么事发生？不会的，因为我什么都没有做，我只是做了那一个部分。她是有幻想，但不一定代表她一定会（笑）。如果要有的发生的话，我还是要追，我还是要做其他的事情。


    假如看到有男生跟女生讲话，那么就知道是上课的（笑），那你就问他：“你是哪一期的？”就知道上过我的课了。你有没有试过一些东西？你要他动，他不动；你要他不动，他偏偏要动（大笑）。目前在
    NLP 圈子里，在美国会有人教，在华人圈子里很少，我是第一个教这个的。这一种东西是说其中一个最早期的口语录，班德勒前妻，最初做治疗其中他们发现那些伴侣有婚外情的那一种，往往很容易会用味觉来形容异性。


    比如一个男的看到一个女的，那个曲线啊怎样，这是用什么用法呢？视觉。或者那个女的说那个男的声音让我觉得温馨的感觉？听觉和感觉。有些人会用味觉，比如说那个女的像一瓶老酒，老酒是什么？味觉。或者说，我有一个朋友，常搞一夜情，他只是想找一个，你怎么样找猎物，要一种味道，描述是要有野味，味觉，就变成了，刚刚说到了巧克力的食物，把味觉联系到一起的时候，性器官，性和味觉就重叠了。有没有注意到，特别是女的讲吃的时候会很兴奋，你跟她讲吃的时候，她听得的时候就就很兴奋。我见过一个女的，吃的巧克力蛋糕，她说：“哇哦，那种巧克力蛋糕……”我看到之后就“哇哦”，看到她吃的蛋糕，好爽的样子，很热很热，形容那种爽的样子。


    我猜测这个讲巧克力或吃的时候，跟性器官做联系的时候，两个管道，触觉和味觉重叠起来，身体上会有感觉。所以我刚刚讲吃巧克力的时候，那个女的做了什么动作？女的一走呢，就“有没有看到，有没有看到……”这个部位是跟什么有关呢？是跟性有关。所以以后要追求异性，就自己看着来用，别对每个女人来用。女人对男人做，应该也可以。我只对过女人做，所以我还不道女人对男人做，男人会有什么反应，目前还没有听到。在坐的女生，上过这个课，你有兴趣，你可以对你喜欢的男生或老公说什么，你男朋友如果有不同的改变，你可以留言给我，不需要留名。所以你们用了过后，你们告诉我，对男人有没有用。


    在博客里留言“老师，我想要我男友把房和钱都给我”，我可能会回应你，也可能不会回应你，因为有些人是没有上过课的，不会额外指导你的。我会看你是 NLP 补习班的人，我才会额外的指导你，读者是另一回事。


    这个是没有特别的人去研究，他的一本书有提出来。被某个异性吸引到的时候，会用味觉来描述他，所以当你的老公、老婆、男朋友、女朋友，习惯用味觉来称呼某个异性的时候，你要小心了。有两种做法，一是当他对性有冲动的时候，你要想办法转回到你的身上来；还有一种是对性有冲动的时候，会痛苦。


    ## 假设成交


    我们看看第 18 页，假设成交，方法有 20 种，常用有 7 种还是 9 种，我本身是用到了 7 种，这三种是用的比较多的，我就教我本身的常用。第一种是时间上的假设。举个例子，这还没有签约之前，你还需不需要我解释多一次？假如你要解释后？


    学员：解释过后签约


    老师：解释过后就签约，解释后不要？不要解释。不要太开心，这只是播种。对方要签你的问题，他为了要你明白的问题，他就会假设。他会假设你签约，要连续假设很多个，其中一些，比方说你是卖车的，在你决定要不要买的时候呢，你要不要开始
    drive 一次？他说要，你就要。他就说，不需要啊，这样可以来播种子，不是说只播一个，要播连续个。


    在早期我们接触的时候，我们做了一个广告在电视上，就有一个人打电话来找我。打电话来啊，他接电话后，很麻烦，一直问长问短，问了很多问题：“这个老师是谁啊？”“背景是什么啊？”“你们免费办这个讲座，肯定会有课程，这个课程多少钱啊？”还没有印证这个说明会，你就跟他讲这个多少钱，这个有没有这个效果？没有，他没来听不知道这个课程的价值。问这个课价钱的话，他会有一个很快的判断。我就没有，原因是我一接电话，是我先问问题，我不是等客人问问题。他说一打电话来，是我先过去说话，是我先问他。他一问“是不是平凡”，我讲“不是”的时候，我就问问题。不是以前我问对方“有什么事吗？”，而是我问“你们是不是看到了那个广告？”“是啊，是啊”“你是看到哪一份报纸的呢？”我只是登了一份报纸而已。“我是看那个《新周刊》”哦，《新周刊》。“在你还没来应征我们的讲座之前，我能不能先问你几个问题？”“好，可以。”假设的什么？来听了讲座。


    “你能不能帮我一个忙？”“可以”“你是看了我们登的哪份报纸的广告啊？”我再讲，“我们这个讲座在中华大会堂，你知道中华大会堂在哪里吗？”“哦，是不是一个白色的建筑物，上面有个喷水池啊？”我说：“对，7点半之前。请问会有多少个人会过来呢？”“只有我一个人过来”“那请问你的名字是什么呢？”“陈先生”“好，陈先生，在晚上7点半之前在中华大会堂，只有你一个人过来，Ok？”他就“ok”。现在接电话没有一个是放在最后核对信息的。因为我是个主导权，一直不断的问。


    学员：有没有人是不愿意来的？


    老师：肯定是有人不愿意来的，只是打个电话进来看看。我就假设了什么，我只是播了一个种，我把我的几率提高了。当然，我最厉害的还是写广告，我们现在可以不用广告来招生了，直接是书本上。有些广告写了之后，很多同行看了不认同我们的做法，很古老，够邪派，够争议性，够夸张。有同行跟我讲，看了之后，就说……我其中有一张照片，我们两个不是看着镜头，是看着天空。教育水平不高的人，……然后一直骂……教育水平不高的人，根本是不会去听讲座，虽然他会骂你，但不会去听讲座。广告确实是有吸引力，然后打电话过来的时候，再通过一些假设，就比较容易让人怎么样呢？过来。


    2 选 1 的假设，是最多人用的。举一个例子，我做催眠的话，你来到我的办公室，你要坐在椅子上或者是沙发上上来给我催眠，不管你是选择哪一个，是沙发上还是椅子上，结果是什么？被催眠。我要坐在椅子上，你是希望你张着眼睛给我催眠，还是闭着眼睛给我催眠？不管你选择什么，最后还是催眠。后来我问他，你是要我现在就开始，还是要你准备好后，我再来催眠呢？不管是现在，还是等一下，最后的结果是什么？还是被催眠。这叫
    2 选一。通常选的时候，x 或 y，这个，是要容易一点，你就问对方你要选择哪一个，把不容易选的放在后面，有用处的，因为一句话，你讲完之后人家还是记得的，你要把容易的那个，放在这里。这叫
    2 选 1。曾经有教过一家，有的学员做传销，卖些保健品，当他推销到很兴奋的时候，他讲：“你呢，是要加入我们公司成为会员过后才买我们的产品，因为比较便宜，或者你要吃了过后，觉得效果不错，再加入我们的会员？”这个是什么？这个是结合
    2 选 1 和时间。这个注意，他第一个选择是什么？加入会员才买产品；二个选择呢？吃了产品再加入会员。这个是两个重叠了，重叠的时候效率会高。


    再看第 19 页，知觉性的假设。我再问你一个问题，你知不知道我的 NLP 课程是全东南亚、全亚洲最厉害的？假如你说知道，代表了什么？不知道呢？其实你是认同了，只不过你还不知道。就像你知不知道其实你是很爱我的？不知道。不知道是什么意思？我是爱你的，只不过我不知道你是不是爱我的。这是知觉性的假设。不管他怎么样讲，总体是什么？他是爱你的。不同的假设。对这个假设有什么问题？


    看是什么时候讲那句话，就好像那个 2 选一的，做传销的那个学员，假如他做的听众完全没有反应，根本情绪没有爆发，最后你要跟他讲是加入会员后再买东西，还是买了试了之后再觉得不错再加入会员，他根本就没兴趣，他就根本不会认同。情绪动呢，情讲才有效果。刚才的问题是跟那个女生说，其实你知道你是喜欢我的，看你什么时候讲。我无端端走近一个女生，我不认识她，跟她说，你知不知道其实你很喜我？我知道你是个神经。那如果擦出了火花，再来讲呢，效果就不同了。有没有关于假设的问题？


    没有的话，我们来看第 20 页。刚才实践的时候，有个人问我，初学的时候是不是要自己写那个剧本？我说是，我以前就是这样子的。我有五六十本的那种东西，我喜欢没有线条的，因为可以画，乱写都可以。这是我的做法。你想到什么心得可以写下来，你怎么样去影响你的客户，你的朋友。对白像剧本一样，要怎么讲，讲到这里呢，要隐晦命令，那里呢，做什么动作，讲这里要指自己，讲这里要讲巧克力。写了过后，自己练习一下，跟朋友过过招，我是这样子。我这边是给你的大慨的方向，你自己可以想下怎么设主角，什么场景，你把这个写个主题，打个草稿，大致得写出来，然后你就要问你自己了，我希望怎么样演讲这个，你要进入什么状态，要采取什么行为，你决定过后，把你的稿子再改，把调味料再加上去，隐晦，心锚，同步引导都加进去。


    看后面有个例子，在第 37 页，这个只是一个大致的草稿，有些地方可能夸张了点，你看，不是每个人都需要这个产品，这里可以放许多进去。而且不是每个人都需要这个产品，来这里的目的是跟我买，隐晦命令；来这里的目的是教育你，就不用。这个是
    37 页，给你们 3 分钟时间，看下哪里可以变成自己的命令，哪里可以心锚，看哪里可以指自己，画下去。我本身，我自己用的符号是这样的（演示），这是我的做法，我会在那边打一个符号，指外面呢？指内，我的那个剧本。我设一个心锚是这样的，两个心锚呢，符号就会变成是这样子的。给你们
    3 分钟的时间，在 37 页弄一弄自己的剧本。


    好了没有？在这个地方，设一个心锚。客户最怕做决定了。有时候，昨天有人问我，能不能只设一个正面的信号，或者是一个负面的信号，或者正面反面两面都设？都可以，只不过有时候你设的，对方有个不好的，有负面的反应，用不上，只放在一边，你备着不时之用。如果你觉得效果没达到，可以用这个信号。不过，初学的人先不要想太多，我昨天已经说过了，先设好了一个，一个设好了，才可以一个一个再得说。


    “在你还没决定跟人买之前，我该做什么？”跟我买做隐晦命令，先画线。不要在跟我买的时候指自己，你要注意，指自己的时候是这样的。有些人你看上去很讨厌，但是我是好人。太明显，太明确的时候会被人马上忽略掉。你是一看上去很讨厌，但是另一个人是喜欢的，我没有这样子，所以你头脑里面会去过滤。但是手指向自己，自己播一个种下去，那什么时候指呢？“在你还没决定跟人买之前”“任何的人”可以指一下自己。


    有些人，根本不管你买不買你要的产品，这时候做什么？这是一个做法；另外一些人，就算你不需要，但是他还是想尽办法说服你买得越多越好。你可以到那个隐晦命令，你可以看到他想尽办法让你买的越多越好，你会发现。但是最重要的是，你是客户，主动权在你手上。我的问题是，客户需要是什么？假如你的产品是摆在你前面的，你会怎么做？你是客户，主动权在你手上，多多少少你会知道你需要的是什么。稍微指一下那个产品，当你跟一个人买的时候，你会做什么呢？当说“买”的时候指向自己，买东西时是因为这个产品有好处，很符合你个人的需要。那你想下在未来他会怎么帮得到你，这里要怎么做？指一下产品，说自己很需要。其实钱是很多人都想赚的，其实我最想要的顾客呢，是我卖一种东西卖了很多年后，觉得还是很满意，隐晦命令，所以继续来买。假如这个产品不适合你，你可以告诉我，提早去适应你的地方。


    我们来看看第 39 页，上面有段话，最后一句话，删除掉。那段话跟整个东西是没关系的。我的经历是告诉我，我没有办法讲出第一句话，我是爱上我的。爱上我，喜欢我，隐晦命令。我唯一可以做到的是让自己成为让对方爱上我的人，不一定讲对方。两种做法，你可以讲对方，他就是对方；假如我是女的，我成为对方爱上的人，这是一种做法。另外一个做法，你可以让对方改变声调，可以爱上我。我种的种子是她可以爱上，这是一个做法。有两种做法：一种是我可以做到让自己成为对方爱上我的人；另外一种是我可以成为让对方可以爱上我，隐晦命令，指自己，它就是变成我，我是那个可以爱上的人。


