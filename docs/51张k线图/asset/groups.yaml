    # PART 3 探索股市的漲跌原理


    買與賣，買方的資金動能（M）與賣方的股票籌碼（T）。多與空，多方的嗜買意願與空方的賣股態度，兩者結合而造成的交易速度（V），將影響市場價格（P）的高與低。


    總結而言，費雪方程式能清楚說明本間宗久肚子裡的秘密，而K線理論其實也不外就是想解讀 MV = PT，也就是投資人在股市的交易心理透過量價關係對價格造成的趨勢方向而已。


