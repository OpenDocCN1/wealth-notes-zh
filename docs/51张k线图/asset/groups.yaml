    # 晨星


    股價不斷下滑，市場充滿悲觀氣氛，幾乎沒有人要買股票的狀況下，突然有一天，股價開盤就跳空下跌，但收盤價卻拉回來收小紅K線。雖仍無法回補跳空缺口，且之後幾天，股價雖力圖開高卻仍收小黑K線。


    圖2. 一連串微保留的小黑K線中，突然出現一顆明亮的小紅K線，或是長長的探底針，這意味著多頭情來了嗎？


    ![](img/79f6bd7607ea490114d5f5cca5e80114_107_0.png)'
  - '[PAGE 108]


    這時候，市場仍在底部區盤旋，但是投資人卻可以大膽買入股票。這是為什麼？


    根據酒田戰法的晨星圖則，當股價在底部低檔盤整，卻出現一根微微往下開出的小紅K線，這就像黎明前夕，落到地平線邊緣的小小星星，暗示著市場即將 unambiguous
    盤，股價上揚的機率大增。


    為何如此解讀呢？


    首先，從供、需狀況來觀察，迎續多根小黑K線代表供給曲線已經右移到一個極致，市場賣壓已經釋放得差不多，但需求曲線卻未跟進右移，導致價格在低檔盤旋，而且賣壓仍略多於買壓，才會收黑線。


    突然有一天，供給曲線上的某人，終於願意以更低價格來賣股票了，賣單一掛出，一開盤就有買方以低價承接，之後，吸引了更多買盤進場低接，導致終場買盤略勝賣盤，K線收小紅。


    敏感一點的投資人，見微知著，看到這根小紅線，可以判讀出市場底下有買盤蠢蠢欲動，因為跳空下跌也反應著市場虹吸現象出現之前的水管抽空現象。另外，當日收盤價高於開盤價，也代表需求曲線右移，有利改變早先由賣壓控盤的局面，這謂著市場沙漏有可能要翻轉壓力方向了。


    如果出現晨星小紅K當日的成交量萎縮到極小，則表示賣盤同步縮手，有利供給曲線左移與需求曲線跟進右移的多頭趨勢發生，投資人這時押多方勝出的贏面頗大。'
  - '[PAGE 109]


    # 案例2、華寶的晨星圖


    ![](img/79f6bd7607ea490114d5f5cca5e80114_109_0.png)


    案例2為華寶（8078）的日K線圖，在八月上旬時，股價下挫收多日黑K線，且成交量不小，意謂著是供給曲線右移導致的股價下跌。之後，出現一個跳空下跌的小紅K線，當日成交量則萎縮，意謂著賣盤縮手，供給曲線不再右移。


    投資人接下來要留意，需求曲線是否跟進右移擴張呢？從晨星出現後的幾日之成交量極度萎縮來看，需求曲線雖未右移，但供給曲線已經確定不再右移了。也就是說，賣壓已經釋放完畢，投資人可以大膽布局，押寶買驚即將破繭而出的時日。


    九月初，紅三兵出現，確認多頭虹吸現象發生，在晨星出現後大膽布局華寶的投資人，將有豐碩的股價上揚成果。'
