    # 十字變盤線、下捨子線、探底線


    股價開盤後，價格一度上漲、又一度下跌，最終收盤時，價格竟然與開盤價一樣。這種線型，被稱為「十字線」，同時又被稱為「變盤線」。為什麼呢？


    另外，股價當日跳空下跌，最後卻收十字K線，這種線型在K線理論中又被稱為「下捨子線」，又為什麼呢？


    圖3、黑K線出現十字變盤，當今價格平平一段，常常需要...來判斷...。設計，代表...底部...不像...？


    ![](img/79f6bd7607ea490114d5f5cca5e80114_110_0.png)'
  - '[PAGE 111]


    十字線，又可被稱為捨子線，這種線型的名稱源自於捨子花。這是石蒜花的日本俗名，又因常開在墓地邊，而被稱為死人花。


    捨子花便是印度的曼珠沙華，據說開在天上時是白色，落到地上，吸收死人的幽靈後就變成火紅色，因此又稱為「彼岸之花」，是接引亡靈的花。另外，這種花秋天開花，而且是葉落之後才開紅花，紅花落了以後，又轉開綠葉，使得綠、紅顏色不會一塊出現在枝葉上，並形成田間大地上的
    QP 一種綠、紅顏色的瞬間轉換。


    是的，正是這種日本鄉間、墓地常可見的紅花、綠葉之顏色的季節性轉換，而被 K 線理論借用來比喻「變盤」！


