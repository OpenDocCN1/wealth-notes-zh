    \ | 出現在高 檔作空， 出現在底 檔作多 |  |  |  |\n\n或許你會問：「根據紅黑棒子的長短，以及上下影線的高度來研判市場買賣力道，會很準確嗎？能有一套客觀的觀察指標嗎？」\n\
    \n好問題！一根有上影線的紅 K 棒（上影陽線），跟沒有上影線的紅 K 棒（光頭陽線），分別代表什麼意義呢？\n\n一根有長下影線的黑 K 棒（下影陰線），跟一根只有短下影線的黑\
    \ K 棒（小陰線），又代表什麼資訊呢？\n\n紅、黑 K 棒短到呈現一字型（一字線），或者一字線又留上下影線而成為十字型時，又將代表什麼市場意義呢？\n\n\
    表 1 是市場上流傳下來的解讀版本，這些被記載於各種《阪田戰法》、《酒田戰法》、《阪田五法》、《本間 K 線 88 法》等書籍上的解釋內容，各家幾乎大同小異。\n\
    \n這似乎意味著，某種線型出現時，投資人就可以按古老的祕錄所載，找出市場的多空變化方向來。\n\n但事實真是如此嗎？\n\n根據我自己的經驗，投資人如果真的「照本宣科」、「照表操作」的話，大概會死得很慘，因為市場往往是不按牌理出牌的，今天的一根光頭陽線（長紅線）之後，不代表明天不會有光頭陰線（長黑線）。萬一是長紅、長黑反覆出現時，投資人又該如何買股或賣股呢？\n\
    \n古人說：「盡信書不如無書。」如果把 K 線理論當成一套武功祕笈，那麼真正站到比武擂台上，比武者跟著武功祕笈依樣畫葫蘆地見招拆招，那肯定會因臨場反應不及或失之呆板而身首異處。\n\
    \n## PART 1 K 線的歷史與起源\n\n投資人一定要深刻理解武功原理，把武功祕笈融會貫通，活學活用，而不是依死板板的招式出招，才有辦法打敗敵人。這觀念很簡單，但要領悟到\
    \ K 線圖形、本間法則背後的市場價格漲跌原理，卻並不容易，因為坊間流傳的版本就是一連串的禪宗公案，並不符合現代投資人的思考方式。\n\n到底古老的 K 線理論與各類本間祕笈背後的原理法則是什麼呢？我們有沒有辦法用更簡單的方法來詮釋、演繹這些股價漲跌的祕密呢？\n\
    \n恭喜你，本書稍後各卷就是要把這個漲跌原理與法則給揭露出來，讓投資人不再對神祕莫測的大陽線、小陽線、大陰線、小陰線、母子包孕線、三紅兵、三黑兵等圖形，感到玄妙難解，甚至能靈活運用，達到協助做好投資獲利的目標。\n\
    \n![](img/79f6bd7607ea490114d5f5cca5e80114_28_0.png)\n\n## PART 2\n解讀阪田戰法\n\n\
    ## PART 2 解讀股市戰法\n\n## 從西方經濟學看 K 線理論\n\n假如本間宗久真如歷史傳說那樣，出生於西元 1724 年。在他出生前一年，遙遠西半球歐洲大陸外海上，英倫群島的蘇格蘭地區也誕生一位日後著名的經濟學者亞當。史密斯（Adam\
    \ Smith，西元 1723 ～ 1790 年）。\n\n亞當。史密斯被奉為現代經濟學之父，他所提出的「一隻看不見的手」（an invisible hand），為詮釋現代市場運作的最高指導原則，並成為古典經濟學的核心概念。\n\
    \n經濟學家後來根據亞當。史密斯的創見，逐步演繹出「讓市場飛」的自由市場概念。古典經濟學家們揭櫫一個很經典的自由市場說法，就是「市場機能」可以決定最有效率的商品價格與生產量，因此又被稱為「價格機能」。\
    \ \n\n今天，翻開任何一本經濟學教科書，在討論個體經濟學時，都會談到「需求」與「供給」決定市場價格，而「需求」與「供給」也就是那「一隻看不見的手」。\n\
    \n## 圖 1 需求曲線\n\n![](img/79f6bd7607ea490114d5f5cca5e80114_31_0.png)\n\n所謂的「需求」，其實是「需求函數（曲線）」的簡稱，這個函數表示「價格與數量之間所呈現的反向變動關係」，亦稱為「需求法則」。\n\
    \n舉例來說，當消費者覺得蘋果便宜時，對於蘋果的需求量會增加；但當蘋果價格上揚時，消費者會覺得太貴而減少購買需求（如圖 1）。這個價格與需求的關係，就會形成一條需求的函數（紅色曲線）。\n\
    \n同樣的，站在蘋果供應商的角度來說，也 Gizmo 一個「供給函數（曲線）」，顯示出另一種「價格與供應數量之間的同向變動關係」，又稱為「供給法則」。\n\n\
    ## PART 2 解讀阪田戰法\n\n## 圖 2、供給曲線\n\n![](img/79f6bd7607ea490114d5f5cca5e80114_32_0.png)\n\
    \n蘋果價格（元）\n\n蘋果供應數量\n\n價格太低，商人不想賣蘋果\n\n價格攀高，賣蘋果的供應商增多\n\n## 圖 3、供需決定的均衡價格\n\n\
    ![](img/79f6bd7607ea490114d5f5cca5e80114_32_1.png)\n\n蘋果價格（元）\n\n蘋果交易數量\n\n供給與需求共同決定一個雙方合意的價格與均衡數量\n\
    \n舉例來說，當蘋果價格高昂時，水果供應商會因為利潤高而提高出貨量；反之，當蘋果價錢太差時，供應商就會轉而提供其他利潤較佳的水果，而減少蘋果的銷售量（如圖\
    \ 2）。蘋果價格與供應商願意銷售的數量意願，為一條與價格呈現同向變動的供給函數（綠色曲線）。\n\n古典經濟學家根據亞當．史密斯的市場創見，進一步認為，一個不受人為干預的自由市場，將會透過消費者的需求函數，以及供應廠商的供給函數，進行價格與數量的調整，一直\
    \  到市場出現買、賣雙方都有同樣數量的人造成雙方滿意的交易價格為止。\n\n比如，從供、需兩條曲線交叉比對來看（如圖 3），當供應商用每顆 30 元價格賣出\
    \ 3,000 顆蘋果時，市場上願意接受用 30 元買蘋果的消費數量，只有 1,000 顆，此時市場就會產生超額供給（2,000 顆蘋果賣不掉）。\n\n\
    為此，廠商只好降價以求售，而一旦降價到每顆 10 元，願意這樣賣蘋果的廠商將減少，而供應量剛好降為 1,000 顆蘋果數量。但這時，願意用 10 元買蘋果的消費數量卻是\
    \ 3,000 顆，市場又產生需求不足（2,000 顆蘋果的需求量沒有被滿足）。\n\n這樣一來，蘋果供應商又開始抬高價格，並增加供應量。而消費者看到價格上揚，又減少蘋果購買量，直到供給和需求函數在蘋果每顆\
    \ 20 元，達到 2,000 顆交易量的最適均衡點。\n\n這個供給函數與需求函數的均衡點，將會產生最適的市場交易量與最適價格。這個均衡點表示市場上不會有超額供給（廠商供應太多蘋果卻賣不掉），或者需求不足（消費者願意低價買蘋果卻買不到）。\n\
    \n這就是亞當．史密斯所稱的「市場黑手」，這隻黑手能協助市場調節出最有效率的價格與數量，並達到供需雙方最大的滿意程度。\n\n以上說法，可說是現代經濟學的主流思維，但，這與\
    \ K 線理論有什麼關係呢？\n\n有！大有關係！因為當我們把「蘋果」這兩個字替換成「股票」時，投資人將發現，市場上某一檔股票的價格，也是由買方（需求曲線\
    \ Demand）與賣方（供給曲線 Supply）所共同決定。\n\n買方就是市場上想買股票的人；賣方就是市場上想賣股票的人。這兩群人在證券市場上，會從早上開盤後就開始議價搓和，一直到收盤為止，努力尋求一個買賣雙方最適合的均衡價格。\n\
    \n這其實也是 K 線發明者本間宗久所觀察到的市場交易現象，只是他不用供、需兩條線來代表這隻市場黑手，而直接用陰陽兩色的一根棒子來說明市場價格的微調過程。\n\
    \n陰陽兩線，是東方人比較能接受的思考模式，特別是本間宗久喜歡把米市當成戰場，把資金當成部隊來運用，因此資金部隊如何在戰場上奇、正相生，在價格漲跌中追隨多、空對峙有利的一方押寶，就成為本間宗久解讀市場運作時的核心理念。\n\
    \n如圖 4 所示，假如蘋果電腦公司在市場某一天的開盤價為每股 28 元，表示市場上有賣方（空方）以這個價錢在賣股票，而買方（多方）有少數人接受，因此能達成一個交易價格。\n\
    \n這時候，其他未成交賣方看見有利可圖，立刻提高價錢至 30 元才賣，而這個價位表示有 3,000 張的股票持股者希望以這個價位賣股，這導致大量賣壓湧現。\n\
    \n買方因為不能接受 30 元價位，只有 1,000 張的需求量能接受，這使得賣方只好降價以求，盤中成交價位立刻下滑到 10 元（假設市場沒有漲跌幅限制）。\n\
    \n買方一看到盤中蘋某股票價格跌至 10 元，立刻湧現大量買單，使得賣方開始抬高價格賣股票，最終，當日收盤時，買賣雙方在 20 元價位達成一個最合適均衡的價格。\n\
    \n## 圖 4 · 供需法則與 K 線圖\n\n![](img/79f6bd7607ea490114d5f5cca5e80114_35_0.png)\n\n\
    這檔蘋果電腦在股票市場上的價格微調過程，在一天當中用 K 線記錄起來，不就是開盤價 28 元、盤中高點 30 元、盤中低點 10 元，以及收盤價 20 元嗎？（圖\
    \ 4 右方所示）\n\n由於行情開高走低，因此這根蠟燭線被畫成綠色的黑 K 線。\n\n本間宗久的一條黑色蠟燭線，用現代經濟學角度來解讀，就是供、需曲線在一日市場中的價格微調過程。如果供給曲線上的賣方，是先開出較低的價格，再慢慢抬高價格到一個均衡價位，則一日市場的價格調整過程將是開低走高，K\
    \ 線顏色將變成陽線或紅線了。\n\n日 K 線代表市場供需一日的價格微調紀錄，週 K 線反映週一至週五開盤到週五收盤的市場價格調整過程，月 K 線反映月初開盤價到月底收盤價的價格調整過程。\n\
    \n這個價格調整機能若是激烈，則棒子的上下長度與上下影線，將被拉得很長。但若市場趨於靜態，則 K 線會被壓縮成一字線或小縫鑽線。但不論棒子是高還是低，都只是反映市場供、需兩條線的價格調整過程而已。\n\
    \nK 線若從這個角度來理解，似乎也沒什麼神秘可言。\n"
  mdcn: "\n對於價格變動難以捉摸的市場，日本米市商人本間宗久透過 K 線，掌握米價漲跌的秘密，成為當時全日本的首富。這點與禪宗透過明心見性，希望修得「天上天下、唯我獨尊」的正果，是否也有觸類旁通之妙趣呢？\n\
    \n如果從這個角度來理解 K 線理論，似乎一切如墜五里霧中的 K 線排列法與三山、三川、三木等法則，就都豁然開朗了。\n\n被稱為「阪田戰法」或「酒田五法」的一些神秘名詞，其實只是在解說市場變化的趨勢和方向，師父藉由歷史型態的歸納整理，把一些容易漲或跌的趨勢做出總結綱領，並傳承給徒弟，這可說是一個猜測或預測未來價格走勢的重要模式。\n\
    \n問題的關鍵在於，K 線用一種接近禪宗公案的直觀方式在教導徒弟，而不是西方那一套客觀且科學化的縝密流程在分析技術指標。再加上師徒傳承二百多年，派別日增，說法漸多，這使得市面上流傳的\
    \ K 線理論讓人感覺高深莫測。\n\n說穿了，K 線理論也只是一套有效猜測股價之技術分析工具，只是本間宗久希望門徒們活學活用，活解市場價格的轉折趨勢，以達到在米市或股市裡「不用神仙真祕訣，直教枯木放花開」的賺錢境界。\n\
    \n那個米商師徒相傳的 K 線圖形與法則口訣，如果我們能用現代人理解的經濟學語言，或者現代金融市場的知識來分析它，將會得出什麼樣的奇特發現呢？\n\n##\
    \ PART 1 K 線的歷史與起源\n\n## 米市的天才小子\n\n在我們準備破解 K 線的祕密之前，請先來看看傳統如何介紹 K 線理論的發明人本間宗久（Munchsia\
    \ Honma，西元 1724 ～ 1803 年）。下列是有關這位 K 線理論發明者的生平資料：\n\n本間宗久乳名「加藤吉作」。他出生於日本上川河口的酒田港出羽地區（現在的山形縣酒田市），當時這地方是十七世紀米市的重要交易中心。\n\
    \n加藤吉作長大後，為本間家族所收養，命名為「本間宗久」。本間家族當時活躍於德川幕府的吉宗將軍時代，而這位德川幕府的第八代將軍，則有中興英主的稱號。\n\n\
    承平的吉宗年代，日本工商繁榮，本間宗久全力研究稻米現貨買賣及定期交易的價格資訊及走勢，並約於 1755 年完成《三猿金泉錄》，歸納出他長期在稻米交易上的心得，並認為稻米的價格雖與市場供需有很大的關係，但價格也同時受交易者的心理所影響，所以，價格與商品的實體價值存在著某種差距。\n\
    \n本間宗久對於季節性、天候變化、戰爭政治及投機心理狀況的掌握都有獨到見解，靠著研究行情戰術及精識過人的行情預估，他\n\n賺進鉅額財富，並在京都、大阪、江戶（現在的東京）地區引起轟動。\n\
    \n當時的人形容他為「出羽的天狗」，還有一句話形容他的富有為「你可以像大名（封地的領主）一樣有錢，但不可能像本間一樣富有」。本間宗久還曾被當時的天皇聘為大藏省首席，並被策封為武士，後來居住於江戶的根岸，但最後卻突然出家學佛，於享和三年（1803\
    \ 年）去世。\n\n一個晚年遁入空門的日本米市首富，究竟生平參悟了什麼市場價格的祕密呢？想像一下在 1755 年夏天，日本大阪的米市裡，許多米販拿著一張又一張的「米單」，在市場裡焦急地喊價兜售。\n\
    \n「聽說今年大豐年，五穀豐登，不趕快把米穀賣掉的話，米價會越來越便宜，再不賣就要賠錢了。」「是呀，國家太平也不是好事。」市場裡傳言紛紛，急得不少米販又把米單的喊價壓低，就是擔心賣不掉米。\n\
    \n米單，這是日本興起於十八世紀初期的一種賣米現象。封建時代的地主或貴族階層，都是領取稻米作為封地的租金，如果地主需要現金的話，就必須把多餘的地租——也就是稻米，拿到市面上賣掉。\n\
    \n承平時期的德川幕府，因為沒有戰爭，領地與領地之間的貿易流通自由，促成全日本米市交易的繁榮興盛。\n\n米市為何興盛呢？因為坐領封地的貴族領主們，有時想要把今年秋天才能收到的地租，提前在夏天賣掉，這時就會填寫一張白米憑證，證明自己今秋的米倉裡將有幾萬石白米進帳，並藉著出售這張「米單」，就能把自家米倉裡的地租提前賣掉而換取現金。\n\
    \n為什麼地主要提前賣米呢？因為富裕往往過不了三代，領主傳了幾代以後，多少會出現一些納懶子弟，生活過度奢華，弄到寅吃卯糧，而要提前賣米變現金來度日。\n\n\
    至於為什麼有人要提前買「米單」呢？因為有些嗅覺靈敏的米市盤商，根據季節氣候變化，嗅出夏天看似豐年，但秋天可能會颱颱風，米價可能因為產量未如預期豐收而導致價格上揚。\n\
    \n這些米商們和地主管家們的見解相反，因此願意提前逢低收購穀物，靜待穀價上揚。萬一米商看錯行情，當然也會損失嚴重，但這就是商人必須要承擔的經商風險。\n\n\
    米單可以說是現代期貨的早期形式。所謂期貨商品，一般又稱為避險商品，其道理和米單一樣，是種玉米、大豆的農夫，提前把三個月後才會出貨的穀物，以合理價格賣給願意對未來價格作賭注的人。\n\
    \n期貨是協助商品市場之農夫做好價格避險工作，因而產生提前買賣貨品契約的市場，故稱為「期貨市場」。\n\n一個農夫可以藉著以合理價格提前銷售「期貨」，而規避掉日後季節變化而導致的價格波動風險。而期貨契約的買入者，則可以根據自己作為盤商的角色，以靈敏的嗅覺，提前以更優渥的價格來布局貨品部位，日後好出貨給下游通路商或經銷商。\n\
    \n本間宗久可說是當時日本米市繁榮時代下的成功期貨商，因為他具有一套能提高預測米價未來動向的能力。\n\n通常參與米市或期貨交易的人，只需要預付一筆訂金，而不需要全額支付全數的米價，就能掌握到二、三月後才會生產的穀物。這形成一種財務擴張效應，米市盤商只要用一點點的錢，就能低價買到大量的米單，然後等到價格上揚時，再以高價拋售米單。\n\
    \n這完全是一種以小搏大的米市中盤生意，本間宗久因為有一套可以提高猜測米價機率的法寶，因而能夠快速地累積獲利，並成為當時的米市鉅富。這個祕密法寶後來被延伸運用到股價漲漲跌跌的證券市場中，成為短線炒股者愛用的技術工具。\n\
    \n![](img/79f6bd7607ea490114d5f5cca5e80114_23_0.png)\n\n## PART 1 K 線的歷史與起源\n\n\
    ## 蠟燭線裡的八個祕密\n\n本間宗久的法寶是什麼呢？就是蠟燭線。\n\nK 線又稱陰陽線或蠟燭線，是將每天的開盤價與收盤價疊成直立的縮寫了，若當天最高價大於收盤價或開盤價，則在粗棒子上方加畫一直線稱為上影線；而當天之最低價弱小於開盤價或收盤價，則在粗棒子下方加畫一直線稱為下影線。\n\
    \n如果當天收盤價高於開盤價，表示當日人氣看多後市，稱為陽線，並以白色或紅色表示，代表當天「收紅盤」。但若收盤價低於\n\n圖1-6 K線的定義\n\n![](img/79f6bd7607ea490114d5f5cca5e80114_24_0.png)\n\
    \n跌盤價，表示當日人氣轉趨悲觀，稱為陰線，並以黑色表示，當天則是「收黑盤」(圖6)。\n\nK線是由每日的開盤、最高、最低與收盤價，四個價格所組成，可以反映出當日交易之多空雙方形的決戰過程。再加上陰、陽兩色，等於可以反映出八種價格訊息。\n\
    \n一條K線，卻具有呈現當日市場行情之八種訊息的功能，這就是本間宗久厲害的地方。他能利用紅、黑兩色的棒子，研判出當日盤中的買賣力道，然後再決定自己明天應該站到買方或賣方。\n\
    \n雖然說，不管是黑線或紅線，當日K線都可能出現上影線或下影線，但同樣是上影線，紅K線與黑K線的意義就會不一樣，因為紅色上影線可能代表多方買氣在盤中一度達到價格高點，可是收盤時又弱下來。而黑色上影線則可能代表開盤後雖曾有價格上揚走勢，但最終無法抵禦市場賣壓，導致收盤時行情下滑。\n\
    \n同樣有下影線，紅、黑K線所表達出來的市場買氣或賣壓也會不一樣。比如，黑色下影線可能代表市場價格曾經比收盤價稍低，但尾盤卻拉高，賣壓可能已經釋放得差不多，明天有可能發生反彈上揚行情。而紅色下影線可能意味著，當日行情並非一路開低走高，而曾經測試過更低的價位。\n\
    \n上下影線的長度，以及紅黑棒子的高低長度，都能夠有效呈現當日市場之高低價差的幅度，以及開盤、收盤價格間的差距，這些資訊，都能有效協助一位市場參與者去判讀市場買賣力道的狀況。\n\
    \n這就是使用K線的好處，可以有效研判一天之內，市場買氣與賣壓的力道拉鋸狀況。而如果將多根日K線排列出來看，則短線的多空趨勢會反映得更明顯。\n\n## PART\
