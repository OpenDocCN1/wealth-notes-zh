    \ 年。在他出生前一年，遙遠西半球歐洲大陸外海上，英倫群島的蘇格蘭地區也誕生一位日後著名的經濟學者亞當。史密斯（Adam Smith，西元 1723 ～ 1790\
    \ 年）。\n\n亞當。史密斯被奉為現代經濟學之父，他所提出的「一隻看不見的手」（an invisible hand），為詮釋現代市場運作的最高指導原則，並成為古典經濟學的核心概念。\n\
    \n經濟學家後來根據亞當。史密斯的創見，逐步演繹出「讓市場飛」的自由市場概念。古典經濟學家們揭櫫一個很經典的自由市場說法，就是「市場機能」可以決定最有效率的商品價格與生產量，因此又被稱為「價格機能」。\
    \ \n\n今天，翻開任何一本經濟學教科書，在討論個體經濟學時，都會談到「需求」與「供給」決定市場價格，而「需求」與「供給」也就是那「一隻看不見的手」。"
  - '[PAGE 31]


    # 圖 1 需求曲線


    ![](img/79f6bd7607ea490114d5f5cca5e80114_31_0.png)


    所謂的「需求」，其實是「需求函數（曲線）」的簡稱，這個函數表示「價格與數量之間所呈現的反向變動關係」，亦稱為「需求法則」。


    舉例來說，當消費者覺得蘋果便宜時，對於蘋果的需求量會增加；但當蘋果價格上揚時，消費者會覺得太貴而減少購買需求（如圖 1）。這個價格與需求的關係，就會形成一條需求的函數（紅色曲線）。


    同樣的，站在蘋果供應商的角度來說，也 Gizmo 一個「供給函數（曲線）」，顯示出另一種「價格與供應數量之間的同向變動關係」，又稱為「供給法則」。'
