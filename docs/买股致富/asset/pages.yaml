  md: '# 第3章 投資人與金融業該前往何處？


    就選股準確性對投資顧問與客戶的高度重要性來看，令人驚訝的是，許多個人與投資機構似乎不花時間去檢查與核對建議買進的正確性，反而花許多時間去跟客戶推銷這些未經充分調查的證券。他們花在精進投資方法，好確定建議買進的股票是真正誘人的時間，甚至更少。然而，挑選傑出投資標的所用的方法是卓越還是差勁，這之間的差異，在短短10年間，便可能造成投資顧問與他的投資客戶是發財還是失敗。


    # 投資評估的方法


    我們可別犯下這種常見的錯誤。我們不妨檢視這些年發展出來、用以提升投資績效的成功方法。首先，我們要明白既有投資方法的優點與缺點。如果了解缺點，便可知道如何防範，以及未來可能可以如何改進。


    直到30年前，評估誘人股票的公認方法，是非常仔細檢視公開的資產負債表與損益表。然後，主要依據這種會計資訊，加上對公司業務本質的簡單理解（這種理解就像一般人對該公司產品線的認識），而做出投資決定。以這種方式來挑選傑出投資標的，就像只知道未來可能的另一半姓名，以及看過對方1、2張沙龍照片，便試著挑選終身伴侶一樣，沒什麼道理可言（而成功的機率也一樣低）。在運氣超好的情況下，或'
  merge: -1
  img_proc: true
- pgno: 163
  md: '許可以成就一樁圓滿的婚姻，或是傑出的長期投資。然而，由於完全不知道終身伴侶或股票的許多基本特質，犯下錯誤的風險極高。1923年到1932年大熊市的慘重虧損，證明那些完全依賴這種選股方法的人有何下場，儘管造成這場浩劫的，還有其他幾項因素。這段時間讓大多數的金融圈人士學到，如果他們想成功進行股票投資，還需要更努力才行。


    在大蕭條的困境中，孕育出成功評估股票方法的重要新發展。此一新發展，就是透過聯繫公司高層，詢問他們有關公司股票投資的相關問題。1930年代開始出現證券分析師的各種組織，也因此開啟實地訪問工廠的時代。這也開啟了公司主管回訪金融圈，向金融圈人士的團體或協會，報告他們所管理的公司有何特點。


    這個做法極有幫助，那些不辭勞苦聯繫公司主管的人，比以往更能看清楚一些公司的相對優點與缺點。然而，二次大戰結束時，大家開始明白，光是這樣做還不夠。如果要徹底消除平庸與差勁的投資，以及想享有選出大贏家的高勝算，就必須更努力才行。如果投資人真的要知道自己在做什麼，就必須更努力。


    接下來，是投資方法另一個進步的里程碑。由於找不到更好的用語，'
