  md: '# 第5章 1960 年代的主要成長產業


    可能造成的損失。


    然而，這跟我先前談到買進最好的化學股，既十分相似又大不相同。相似處是，如果隨便挑個時間買進，靠成長帶動股價的因素可能十分充足，因此若買進最好的製藥股或化學股，經過足夠的時間之後，買進最好的製藥股或化學股，或許預估將出現可觀的獲利。就跟化學股一樣，有耐心並利用偶爾出現的合適時機買進的投資人，將獲得較大的利潤。這個時候，便出現與化學股大不相同的地方。但買進最好的化學股與製藥股的時機，基本情況很不相同，就像我先前說過的，化學股的買進機會，通常是在景氣衰退的時候，而這種時期，是買進績優製藥股的差勁時間。因為製藥業只會略受到景氣影響，當其他產業的獲利大幅減少時，投資人反而對製藥股的評價可能特別高。結果，在景氣衰退時，製藥股並不會變得低價。不過，其他事情偶爾會造成這個產業失去投資人的喜愛，其一，是政府可能干預製藥公司在攸關人類福祉的產品享有高獲利率，這種事情很容易讓製藥股在
    1960 年代偶爾出現買進機會。無論這種機會是否出現，就像以前某些時間曾發生過的，某家製藥公司的獲利突然大幅下跌，可能讓金融圈領悟到（因為它們常選擇遺忘），這種事情也會發生在其他公司。所有製藥類股因此會被冷落一段時間，直到其他新藥大成功之後，新的熱情讓人忘掉這件事。那些在利空時刻保持冷'
