  md: '業公司。此外，這種收購通常伴隨著樂觀的報告，有時候，它們是有事實根據的，也就是說，這些成長企業合併起來，可以減少各自的營運成本（進而增加獲利率）。其中一個可能的方法，儘管機率不是很高，是由收購一方的公司管理高層，去經營被收購的公司，但不必為了承擔這些額外職責而擴增管理高層。這麼做可以降低管理成本，同時擴大獲利率。另一個理論上看起來很好、但實際上只偶爾出現的好處是，藉由結合生產設施來降低製造成本，這麼一來，便可以減輕製造費用的負擔。更多時候，合併的節省成本，是來自銷售與物流成本的預期經濟效益。一家小公司經常發現，僅僅為了銷售一個小小的產品線，卻要維持足以涵蓋潛在市場的銷售人力，是一個沉重的負擔。如果一家大公司原本已向同一批顧客銷售一些產品，也可以再多處理一個產品線，而且幾乎不需要額外的成本。當然，如果這家大公司是銷售給另外一批不同的顧客，這種預期中的節省成本，是不太可能實現的。


    合併可以創造重大利益的另一個方法，並不是立即節省生產或銷售的一般費用等方面的成本；相反地，它是來自一支高效率管理團隊接管一家以前沒有妥善經營的公司之後，因而提升了整體營運。在數年期間，通常可以找到足夠的方法，來增加被收購公司的獲利率，進而使總獲利達到可為原始投資創造可觀報酬率的程度。有時候，被收購公司的銷售'
