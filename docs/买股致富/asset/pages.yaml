- pgno: 115
  md: '轉時，優良股票（那些經營良好、跨足成長領域的公司股票）上漲幅度卻可能達數倍之多，然後在高檔盤整，接著又再創新高價。許多這種股票，10年間的上漲可能達到
    1,000%，而不是 100%。


    這當然很幸運，但如同我在《非常潛力股》強調，有一些明確的規則可以用來挑選創造這些獲利強勁股票的傑出公司主管，而且至少有一定 的準確度。另一方面，我認為紀錄顯示，以目前的經濟發展狀態，景氣衰退的預測尚不足以作為可靠的投資工具。就今年高度複雜的經濟而言，有太多因素可能影響這些預測，愈來愈多不同的影響力之間的複雜關係尚未被充分了解。我認為，這是為何許多經濟學家彼此見解不同，以及許多人有時錯得離譜之故。


    就已知結果來看，我注意到在投資決策上極為重視經濟預測的投資人可以分為兩大類：一類是天性謹慎的人，他們幾乎總是可以找到他們偏好的預測，這些報告援引看似正確的理由，顯示企業界即將遭遇嚴重經濟困境，因此，他們在面對投資機會時很少加以把握，而這些錯失的機會意味著經濟預測為他們的投資績效造成無比的傷害。另一類是天生樂觀的人，他們總是可以找到有利的預測來滿足他們，既然他們向來決定要勇往直前，很難看出他們花在景氣預測上的那些時間有什麼好處。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '愈來愈多投資人開始明白，依據直接明了的因素，例如評估主管素質和個別公司產品線成長潛力，來做出股票決策的好處。這些事情既可以用一定的準確程度加以衡量，又對長期投資績效更具影響力。直到預測景氣循環的方法變得比今日更為科學之前，我認為經濟學家在投資界的角色將不斷縮小。我認為，經濟學家本身，其中不乏才智出眾的人士，已逐漸意識到他們的專業還不足以作為景氣預測的角色，而許多這個專業之內與之外的人士都搶著在做這件事。因此，全國企業經濟學家協會（NABE）在1959年秋季召開第一屆年會時，媒體報導說，這些民間企業顧問認為他們應該放棄預測景氣的聲浪升高，但未達到全體一致的意見。多數顧問認為，他們應該為雇主提供的қ用是讓主管們知道「他們企業運作的社會、政治和商業環境的前景」，並且提供比法務部門更為寬廣的反托拉斯觀點。據悉會中一名演說者表示：「我放棄預測景氣了，」因為他對「有關未來的數據」失去信心。儘管這個團體是民間產業的經濟學家（大多是製造商、零售商和運輸公司），我相信至少股市經濟學家也應該如此。


    我認為我們可以假設，基於這些理由，總體景氣趨勢的預測將在1960年代趨於式微，那麼，在企業管理、利率變動和稅法修改等具有公認影響力的領域之外，有沒有任何其他領域是投資人應該加強注意'
  merge: -1
  img_proc: true
- pgno: 117
  md: '的？我認為是有的，由於缺乏更好的名詞，我暫且稱之為影響股價的心理因素。


    想要了解這點，我們先來探討一些投資基本觀念。為什麼一檔股票在某些時候會出現某種價格？那不是因為它現在、以前或未來的情況，而是因為大多數實際或可能對這檔股票有興趣的投資人認為股票將有何種表現。當我們談到人們在一個特定時間對一檔股票的看法，而不是這檔股票本身的內在本質，我們便是在談論心理因素。


    確實，心理因素不過是短期特點，大部分的金融界可能因為過度高估一檔個股或是整個產業的吸引力，而可能在一年或數年間持續為這檔股票（或該產業的大多數股票）付出高價，遠超過這檔股票真正的價值。可是，當該檔股票或產業無法達到高度的預期，便會引發一段時間的幻滅，股票的本益比將大幅下跌，讓它下修至較為接近真實價值。很多時候，股市甚至會反應過度，股票跌到遠低於我所謂的「內在價值」（
    intrinsic value ）。


    這表示，我們可以把任何股票的股價想像是一顆氣球，不是綁在地上，而是繫於一條浮動的粗線，這條線代表「內在價值」。隨著時間推進，'
  merge: -1
  img_proc: true
- pgno: 118
  md: '如果一家公司的獲利能力及前景改善，這條線便往上移動；如果內在價值的基本因素惡化，線也會跟著下降。在任何時間，心理影響（亦即金融界對內在價值的基本評價）都會造成該檔個股的股價遠高於或遠低於這條線。然而，儘管金融界的集體熱情或莫須有的悲觀會造成股價遠高於或遠低於內在價值，它絕對不會完全脫離「內在價值」這條線，就像綁住的氣球遲早都會回歸到這條線。


    股票價值這件事之所以困難的原因，還包括沒有人可以明確指出何種價格才是內在價值。所以我才會在氣球的例子，將「內在價值」比喻成一條粗線，並用引號框起來。我們可以找到一群公司具有相似的內在價值，其中有些在相同領域，有些則在很不同的產業、但成長率相近。因此，我們可以說，經過這類比較與考量管理階層素質、成長率、景氣敏感度等相關因素之後，XYZ公司目前的內在價值約介於每股
    25 到 30 美元，我懷疑還能更加準確地設定這個區間嗎？在超高速成長的產業，理論上值得超高本益比，我懷疑其本益比還能更加貼近這個區間嗎？影響股價的一個重大因素不是現階段成長率，而是這種超高成長率將在未來持續多久的時間？


    愈是推進到遙遠的未來，你錯估情況的機率便愈高，因此，可能的誤'
  merge: -1
  img_proc: true
- pgno: 119
  md: '差範圍愈大，評估真正價值也就愈困難。無論如何，這中間涉及太多因素，將內在價值估算到 1/8 個基點甚至 1 個基點，都不是明智之舉。假若一檔股票的未來夠吸引人（因此代表內在價值的那條線會升高），而你可以在比預估內在價值多
    25% 或 30% 之內的價格買進，這是再好不過的大賺機會了。其中的危險在於，你興奮過了頭，以至於用此內在價值高出數倍的價格買進。


    簡言之，不論股價處於低本益比或者高本益比，跟股票是天生低價或高價一點關係也沒有。當一家公司的經營品質與前景跟另一家相較之下出現大幅差異，原本就會使本益比大相逕庭。重要的是，這些事實是否值得這樣高的本益比或低本益比？大眾輿論是否太過重視一檔天生好股的誘人因素，以至於這原本會是一項好投資，可是就目前股價來說並不吸引人？抑或正好相反，如同時常發生的情況？是否大部分的投資界都害怕這家天生誘人的公司的高本益比，以至於其股價尚未被推升到公司未來應有的水準？換句話說，投資界現在對某一檔股票的心理展望，是否導致它遠高於或遠低於其內在價值？


    重要的是，我們要了解這類研究在成功投資所扮演的真正角色，即使只是為了不要誇大其重要性。當前的投資界心理不應該跟你要投資什麼'
  merge: -1
  img_proc: true
- pgno: 120
  md: '股票扯上關係，買進股票的決定應該完全根據公司相關的基本事實。就目前情況來說，挑選優良的成長企業，時間久了，你便可獲得豐富報酬，20 世紀企業史已一再證明這點。假如你有足夠耐心，你能忽略當前的市場心理，基本面就將為你帶來良好獲利。然而，你需要非常、非常有耐心（以及掌握基本面的技巧），這種買進好股票並耐心持有方式，所換來的獲利程度，將超過你利用當前投資人心理弱點來擇時買進所賺取的獲利。換句話說，在決定何時進場買股時，心理學家遠比經濟學家更有幫助，但心理學家在這些股票一開始是否值得投資等基本面研究上則幫不上忙，只有在另一種情境下，心理學家也有作用，就是從基本面來看，有兩檔以上股票在長期成長方面都很理想時，心理學家可以幫忙決定以目前的市價而言，哪檔股票最誘人、哪檔最不誘人。


    我稱此為心理層面，意味著我們是在考量投資界如何由股票內在價值以及它們未來的可能估值，來評估某些特定股票。舉例來說，即使大多數投資人在蘇聯突然發射第一顆史普尼克人造衛星之前，已高估了火箭燃料製造商的股價，但心理學家可以很篤定的說，這個事件給美國人造成巨大震驚（註⑩），火箭燃料製造商的股價高估程度，還可能進一步


    註⑩：編按：指在太空競賽中落後蘇聯。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '擴大。


    1958 年春天時，投資界得出一個更簡單卻更重要的心理結論：「華爾街」幾乎一致認為，過去數個月的景氣衰退造成企業獲利能力的大幅滑落，尚未充分反映在股市跌勢上，但事後來看，該波跌勢已於
    1957 年 11 月 15 日觸底。我記得當時大型券商的主管們紛紛表示，他們預期股價將跌得更低，在當時的情況下，他們不會進場買股。我不記得投資圈什麼時候曾經這麼意見一致過，似乎沒有人認為，股票價格應該根據未來數年預期的獲利，而不是公司在很短期間內的獲利表現（正如同你不會因為天候不佳導致一年作物歉收，就把一座好農場的價格砍半）。同樣沒有人考慮到，那些因為當時股票號稱可以對抗通膨的心理吸引力，而準備投入到股市的投資金額。在這種心理層面之下，極適合買進本質上屬於優良長期投資的股票，如果不景氣持續下去，瀰漫的空頭氣圍顯示跌勢可能已接近尾聲，好的股票只會再溫和下跌而已。假如景氣浪潮反轉，原先大量從股票轉入現金、等待「逢低承接」的資金將瘋狂湧入股市，將在短期內形成可觀的漲勢。這是個幾近完美的範例，說明持續觀察當今的群眾心理是否違反基本面以及這種趨勢可能持續多久，將可以幫助你決定何時買進一家好公司。這個方法並且可以告訴我們，何時應該等待更好的機會，何時應該到其他沒有那麼熱門的產業去找尋類似'
  merge: -1
  img_proc: true
- pgno: 122
  md: '的機會。


    可是，有一個很不一樣的方法，亦即有關股票投資的人類行為心理研究，可能對投資人更有幫助。我相信這個領域在未來將出現長足的發展。多年來，人們知道再也沒有其他人類活動領域比股票投資更容易受騙，很多時候，看似乎是正確的事，其實正好是錯誤的。老練的股票經紀人表示，不只是一些顧客，而是大多數的顧客都一而再、再而三的犯下相同錯誤。


    我不認為這些事是巧合或偶然，過去 50 年來，股票投資在許多方面都出現急遽的改變。可是，人類想要藉由購買資本資產來獲利的天性完全沒有改變。既有的數據顯示，數個世紀前發生在荷蘭的鬱金香商品投機熱潮，其價格走勢圖與美國
    1929 年前後瘋狂時期的主要股價漲跌走勢圖有著驚人的相似程度。研究 18 世紀舉國上下對英國東印度公司獲利可能性的樂觀情緒，引發一股淹沒不列顛群島的股票狂潮，我們便能更加清楚這點，當時主要與次級股票的波動差異與近期市場出現驚人的相似。股價漲跌的波動幅度與持續期間，與整體物價漲跌趨勢亦很相近。雖然這些對比令人眼花撿亂，它們都證明大多數精明的觀察家在對投資大眾有了充分理解之後所得出的心得：人類總是對相同的投資刺激做出'
  merge: -1
  img_proc: true
- pgno: 123
  md: '相同的反應。


    那麼，心理研究如何利用這個不變的因素，為內行的投資人開創增加獲利的方法呢？我要求舉一個今日仍不為人知、但充分的研究或許可提供極具價值答案的領域作為個案。我要舉的例子是我們快速進步的技術時代一再發生的事情。


    一家上市公司的研究部門研發出一項新製程，在達到完全的商業成果時，可能使該公司獲利總額增加 50%。公司主管在董事會的會議上報告這件事，以取得必要的資本支出授權。計畫獲得核准，新工廠動工，預計
    18 個月投產，但實際上花了 24 個月。投產 6 個月後，新製程開始獲利，3 年後取得公司獲利提升 50% 的完全成果。


    這種發展顯然可以大幅推升公司股價，可是股價何時才會反映？我的猜測是（據我所知，尚未有人就這類事情進行充分研究，所以無人可以確定），向公司董事會報告這件事的那一天是一個關鍵日期，這些董事通常可以分辨真正的投資機會。他們自己的財力或許就可以買進足夠數量來改變股價，他們甚至可能有親朋好友也是大戶。因為我還沒有資料來佐證我的想法，但我猜想從此刻起，股價將出現
    U 型反轉，在隨後數'
  merge: -1
  img_proc: true
- pgno: 124
  md: '週，股價將漲到驚人程度，因為華爾街對於新製程的興奮之情不斷升高。數個月後，由於新製程的獲利仍在遙遠的未來，一些新進的急切買家失去了熱情，股價便告下跌，跌幅將取決於新製程達到獲利之前所需的時間。等到期待的獲利終於出現，另一波漲勢將出現，假如這段期間沒有其他新的有利發展出現的話，可能觸及原先興奮時的高點，但也可能無法再創新高。


    這些都只是我對於在不時出現的情況下，典型好股票其股價可能波動的猜測，或許很不準確。值得一提的是，在金融界部署大量人力試圖為既有或潛在顧客尋找獲利機會之際，竟然還沒有對這種事情進行徹底研究（正確來說，這些事件發生時，可能對股市大盤走向造成重大影響）。之所以尚未進行研究的原因是，金融界並不注意心理層面，亦即人們對於一個事件的想法，而專注於事件本身。此外，這些研究需要對於公司內部事務相當熟悉。公司董事會是在何時明白一個新產品的重要性，只能從接近董事的人士探聽，才能得到第一手資料，僅僅閱讀年報的調查人員無從得知這些。


    我對於可以大幅提升投資人未來績效的心理研究所舉的個案，又引出一個更基本的股市心理問題。特別是在整個股市都很興奮的時期，對於'
  merge: -1
  img_proc: true
- pgno: 125
  md: '那些利多還需要一段長時間才會發酵的股票，股價通常不會反映這些未來的利多。這些利多必然會出現，但需要數年的時間。究竟這段等待發酵期可以到多長，而不致讓手持股產生重大風險，亦即持有的投資人因厭倦長期間等待，而在利多發酵開始影響獲利之前，便拋售他們手中持股並造成股價大跌？這種願意等候的時間長度，是否會因市場處於投資樂觀期與悲觀期而出現明顯差異？如果是的話，是否有任何近似關係可作為衡量？在精密技術的時代，要完成一項產品的研發到生產獲利之間的前置時間愈來愈長，這些事情將影響到愈來愈多好公司的股票。由於人類對相同的投資刺激，像是希望、信心、恐懼和不耐煩，都用相同方式加以回應，不只是年復一年，而是一世紀又一世紀；這些事情是金融心理研究應該可以解決的，我認為進入
    1960 年代，大家將逐漸注意到此類研究。


    除了精準評估某些公司訊息能在何時得到充分人數的注意，並對此做出一般性結論之外，有沒有其他方法可以解決這些心理問題？似乎是有 的。1950 年，奧瑞岡大學金融學教授柏瑞爾（O.K.
    Burrell）進行了一項實驗。雖然後來《商業及金融紀事報》（Commercial and Financial Chronicle）曾經報導過這項實驗，我不認為金融界給予它應有的注意。這項實驗率先採用一項方法，若進一步實施將可了解一般投資人對一項'
  merge: -1
  img_proc: true
- pgno: 126
  md: '特定影響的反應。藉由發掘常見的投資錯誤，這項方法可能價值連城，因為它可以幫助投資人防範可能造成重大虧損的行動。


    柏瑞爾教授告訴班上的 40 名學生，他們有 2 萬美元的額度，必須一次投資在 A 到 F 等 6 檔股票。他們對這些假設股票的唯一資訊是柏瑞爾教授隨意設定的股價、去年的獲利、配息率和除息日。學生可以自由選擇如何將資金分配在這
    6 檔股票，但沒有規定要分散投資。


    這 6 檔股票的價格每隔一段時間會隨意變動，模擬股市的波動，學生可以用他們覺得最可能獲利的方式來調整持股。這整個期間內，每位學生在每次價格波動後的股票部位以及損益，均加以詳細記錄。由於柏瑞爾教授想要試驗的事項之一是，在一些股票上漲而其他股票下跌時，一般股票買家是否會賠錢，因此學生們必須在所有時間都保持完全投資，等到模擬的
    3 年期間結束時，雖然一些股票上漲，其他則下跌，這些漲跌完全相互抵銷。


    這項實驗的一些結果十分有趣。首先，它顯示一個強烈傾向，所有股票買家在腦子裡都將買進股票的價格與其實際價值連結在一起。柏瑞爾教授將這個結論歸因於班上學生有向下攤平（average
    down）的傾向，'
  merge: -1
  img_proc: true
- pgno: 127
  md: '也就是說，他們覺得如果在 40 的價位買進一檔股票，跌到 28 時必然更具吸引力。除了學生有忍受虧損、向下攤平的傾向之外，他注意到，最不成功的學生（就這個實驗而言）有迅速獲利的傾向，而比較成功的學生則會對獲利的股票持有較長的時間。另一個有趣的觀察是，低價股並沒有比高價股受歡迎，為測試這點，股票刻意設計成具有相同本益比和相同收益率，那些總是以擴大股市規模為由倡導「分割」（splitting）高價股的人士可能會對這點感到困惑。


    然而，相較於其結論，這項實驗更重要的可能是它率先開發出一個方法，可以用以測試大眾對一項特定投資影響的反應，隔絕所有其他在真實股市中會牽動投資人恐懼與希望的影響。舉例來說，我們可以挑選
    6 檔真正的股票，但不公布公司名稱，以避免事後諸葛的意見。這 6 檔股票在同樣的 3 年期間，各自的市場波動可能有很大的差異。我們可以找老練的投資人參加，而不是學生，一如實際生活中，我們或許不必規定參加者一定要隨時完全投資，而是設定一個固定的本金金額，供他們隨意投資或保留部分現金。買賣股票的唯一動機是報價改變，因為沒有其他資料可幫助他們做決定。今日，我們知道股價波動本身就可以導致大量的買進與賣出，可是除此之外，我們便沒有更多的了解。這種實驗如果謹慎進行，或許可以大大增進我們對於投資人行為（或許及其背後原'
  merge: -1
  img_proc: true
- pgno: 128
  md: '因）的了解，如果（如同可能發生的情況）極為成功的少數參加者與不怎麼成功的多數參加者，各自之間出現該群體的一致模式，我們甚至可以因此獲得投資人該做什麼及不該做什麼的實用資料。


    除了前述的股票分割及投資人對股價波動的反應之外，我們不需要有豐富想像力便可看出柏瑞爾教授的實驗方法可以經過特別設計，用來顯示許多其他投資相關事項的重要性（或者不具備重要性）。因為這些心理事項和正確投資行動之間的關係很少受到探討，我沒有辦法對於這些方法可以幫助投資人改善績效做出武斷的聲明，唯一能說的是，1940年代及1950年代對於預測景氣循環的部分注意力，可能在1960年代轉而投注在這個完全不同的領域。競爭的速度或許會促成這件事，因為儘管這類研究無法對解決投資人的最基本問題產生重大影響，也就是如何挑選該買進或賣出的股票，但是它卻會對第二重要的問題形成很大的影響，也就是何時該買進或賣出。'
  merge: -1
  img_proc: true
