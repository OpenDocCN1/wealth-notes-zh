  md: '追趕新的目標。如果一家公司可以做到這點，就不必害怕外國競爭更甚於國內競爭。


    況且，這種技術領先的公司，可以從外國工業國家必然將在 1960 年代茁壯的過程中受益，如果該公司產品線具有技術優越性，這些外國公司就會想要購買，如同稍早外國工業大崛起之前的時期一樣。但是，直到最近，這些潛在外國買家受限於貨幣問題，而被它們的政府限制購買美國產品的數量。到
    1960 年代，這比較不會成為問題。因此，技術優越的公司所面對的出口市場規模可能是過去數十年所無法想像的。


    最後，如果一家公司擁有很好的產品，外國公司根本無法匹敵，而且該公司正好在海外設有一些分廠，在反外國企業的課稅或資產充公方面就有一些保障，好過那些倒楣的公司。希特勒（Adolf
    Hitler）屠殺猶太人早已為世人熟知，無須多加討論，可是，儘管希特勒仇視大多數猶太人，少數猶太人完全沒有受到騷擾，因為他們擁有希特勒迫切需要的特殊技能。同樣地，一家擁有專業知識可生產外國需要的關鍵產品的公司，便占有大多數公司比不上的地位，可以跟敵視的外國政府討價還價。如果希特勒的例子太過極端，我們不妨回想大型石油公司在近東（Near
    East）的經驗，當地政府不是因為合約協議或喜愛這些外國公司，而是'
  merge: -1
  img_proc: true
- pgno: 107
  md: '明白它們擁有運輸及銷售石油的設施，這些公司才沒有得到惡劣對待，萬一外國掀起國家主義浪潮，知道如何生產重要產品將更形重要。


    這些有什麼意義？站在投資人的立場，在 1960 年代防範外國競爭加劇的法則，跟尋找卓越投資的法則沒有什麼不同。不管有沒有外國競爭。如果投資人發現有一家公司，因為傑出的企業管理與技術優越，在外國競爭構成全面威脅之前便將成為投資熱潮，他就不必擔心
    1960 年代的外國低廉勞工成本。反倒是生產外國人可輕易仿製的產品的平庸公司，才會有危險。


    這些都是狹義地看待外國競爭的問題——亦即個人投資人可以賺錢而不是賠錢的方法。但是若從廣義來看呢？我們整個國家的經濟，會因為無法與低成本外國勞工生產的大量進口品競爭，而遭受損傷嗎？


    我認為，直到確定未來哪些人將占據總統寶座，以及他們如何領導這件重要事項之前，這個問題都無法獲得解答。現在已逐漸累積證據，顯示美國企業主管已可以因應國內外薪資差異的問題及平衡成本，但前提是從此刻起國內薪資上漲速度不要超過外國（後者也持續攀升），以及工會強迫雇主額外雇用工人的舉動（featherbedding）不再增加美國產'
