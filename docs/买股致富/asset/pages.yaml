- pgno: 133
  md: '沒有資產也可能造成股價下跌。機敏的企業主管會找尋活用資產來賺取超高投資報酬率的地方，如果這些主管看到別家公司用少少的資產便賺到高報酬，或許會想說，他們是不是也可以進入這個事業來分一杯羹。通常，我們有很好的理由，可以知道這種做法行不通，行不通的理由包括：如何能用較少的資產來產出高獲利的專業生產知識、專利保護、顧客對知名品牌的忠誠度，還有十餘種其他因素。然而，萬一新手很簡單就能進入一項可以用少量資產來創造超高報酬率的事業，可以想見許多人也會跟進，以致競爭加劇削減先前的獲利率。因此，每當投資人發現這種低資產、高獲利的情況，就應該像其他產業的企業主管一樣，考慮要不要進入這個領域，如果投資人認為找不到好的商業手段，可以來阻止其他人進入這個領域競爭，最好把低資產視為一項警訊而避開。然而，大多數時候，投資人會找到很好的理由，證明該領域的大型公司比潛在的新入行對手更具競爭優勢，如果不是的話，其他人老早就加入競爭了。在這種情況下，投資人應該完全忽視資產或帳面價值，因為這跟股價的未來趨勢沒有任何關係。


