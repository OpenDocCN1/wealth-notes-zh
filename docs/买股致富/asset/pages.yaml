  md: '就像過去 10 年一樣，那麼，相較於 10 年前增值為 2 倍的機率，但伴隨著更高的風險，這檔股票或許在今日仍是吸引人的投資（以可以達成獲利的機率，與無法達成獲利的風險相比）。


    一位精明的投資人會認為，就投資原則來看，以及我在先鋒金屬案例中所假設的機率是正確的話，那麼，20 年前、10 年前和現在的先鋒金屬，都是同樣吸引人的投資，然而，他對這種一般性的結論絲毫不感興趣，會讓他感到有興趣的是，對他的特定投資需求和目標來說，什麼才是最吸引人的投資？因為這個投資人的特定需求和目標可能與其他也在考慮這筆投資的人很不相同。


    我個人的看法是，投資人可支配的總資源，可能是決定哪種投資最吸引他的關鍵因素。如果他只有區區幾千美元，而且不可能得到更多資金，便應該做出坦白與實際的決定，他必須明白，就最低風險投資的資產成長率來說，光靠這幾千美元的投資，他這輩子不可能達到足以改變生活水準的金額。因此，他必須在
    2 件事當中做出抉擇，他是否希望這筆資金作為通膨保障資金，保護他或家人不致遭受未來的意外財務緊急事故？如果是，就必須把投資標的局限在最好的低風險法人股，類似本益比
    36 倍的先鋒金屬。又或者，他認為這些錢反正是「閒置」資金，另'
