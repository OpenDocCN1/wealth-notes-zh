- pgno: 190
  md: '# 第3章 投資人與金融業該前往何處？


    投資業有 4 大組織，各自想滿足投資人的需求。我已討論過投資顧問、股票經紀商和投資銀行家。直到現在，我都沒有談到在 1950 年代成長最多的組織，這當然是指投資信託。


    我故意把這個組織的評論留到最後，這是因為我認為它們的投資重要性成長或萎縮，不在於它們自己的行動，而取決於其他投資組織提升績效標準，以滿足投資人需求的程度。就像我在本書其他章節指出的，由於投資信託業者重視分散化投資，大部分的投資信託，有大量傾向平均績效的結構性偏誤。像是在
    1950 年代那種時期，許多投資人對於其他投資管道感到挫折，這樣的投資建議，像是分散化投資，以及保證高於平均水準的安全性，這些對投資人來說是極具吸引力的。如果到了
    1960 年代，許多股票投資人仍不確定他們要到哪裡，才能找到徹底了解他們自己所推薦股票的顧問，則可以創造「接近平均」績效的投資信託，就會繼續產生極大的吸引力。另一方面，若是其他投資群體發展出技術，提升投資服務品質，那麼投資信託的分散化投資，以及僅僅提供平均績效，就不會有那麼大吸引力了。簡單來說，我認為投資信託的大幅成長，有一部分顯示出投資人不相信他們能在其他地方找到高水準的投資服務。如果這種想法轉變了，投資信託股票的一大部分市場或許就會消失。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '然而，我認為過去 10 年來，投資信託會出現這種大幅成長，還有另外一個理由，這種成長主要源於共同基金。這些共同基金通常向買家收取足夠的「價差」，遠高於信託的淨值，以確保可支付高額佣金給銷售人員，他們即使推銷相當小額的共同基金持分，也能獲得報酬。著眼於向收入不高的人推銷基金這種經濟誘因，投資信託人員的推銷工作可說是做得可圈可點。仿效壽險業輝煌的成功歷史，投資信託銷售人員鎖定的客戶是以前從來不是主要股票買家的經濟族群。就像之前的壽險銷售人員，他們也是用這種方法取得龐大的業績。


    投資相關產業裡的其他行業，都無法利用投資信託業的這種銷售技巧。投資銀行業的銷售人員（或是以「買進」與「賣出」的價差，可作為銷售佣金的上櫃證券商），是最有機會可以這麼做的。然而，投資銀行業的活動，無法讓他們進行單筆低於數千美元的交易，通常也沒有機制，可以讓客戶定期定額買進。相反地，股票經紀商透過紐約證交所每月購買計畫等設計，提供一個管道，讓散戶投資人可以用每個月的儲蓄購買股票。然而，就像我已經解釋過的那樣，一般股票經紀商的佣金，只占投資金額很小的一部分，根本沒有足夠的獲利率，可讓經紀商的代表像投資信託的代表一樣，花時間跟小客戶推銷。最後，大部分投資顧問每年的收費，是他們管理資金的
    0.5%，他們很多人覺得，每個帳戶最起'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# 投資人與金融業該前往何處？


    碼要有 10 萬美元的資產，才能讓他們的工作獲得報酬，因此，也不會廣泛開發這個大眾市場。


    為什麼這些經紀商和投資顧問的收費這麼少？我認為，主要是因為很多顧問的績效實在太差，一般投資人不願再付更多的費用。但假設投資人相信顧問工作很有水準，雖然以我自己的經驗可能不具指標性，因為我並不服務一般民眾，我發現，一旦投資人確信他看到了投資績效，就不會不願意支付較高的費用。為什麼？如果在很長的年間，一個人或一個機構持續創造比大盤指數高出
    50% 或 100% 或 150%，為什麼投資人會反對支付比現今投顧或經紀標準費用高上數倍、卻仍只占操作績效很小一部分的費用？


    如果真如我所料，未來金融公司會花費更多立即的資金支出，才能取得基本資料，以妥善處理投資人的股票部位，但工作水準會改善很多，金融公司收取的費用因而大幅增加，也是完全合理的。我認為，最近一些主要投資銀行股票經紀商，在它們一般的經紀費用之外，另外收取投資顧問費，這種趨勢會發展成愈來愈大的規模。假設（而且是基本的假設）服務水準好到值回票價，我認為這個趨勢很符合各方的最佳利益。隨著趨勢發展，將來收費將多到一定程度，足以讓銷售人員去向散戶投'
  merge: -1
  img_proc: true
- pgno: 193
  md: '資人推銷他們的服務。如果這個情況發生，而且一般大眾篤信投資服務的價值（除非服務確實值得好評，否則這種情況不太可能長久維持），會使得投資信託業在它們現今最強大的一個業務領域，面臨強大的競爭。它也可能造成證券業整體業務量大幅增加，這麼一來，股票的整體需求也會增加。


    至於那些再次覺得我花了太多時間討論未來，而他只關心眼前的投資人，我要指出在這裡可以學到一件他們眼前關心的重要事情，那就是大約只需5年的時間，兩檔股票的價格在市場波動之間就會出現巨大差異，如果投資人信任他的投資顧問，他支付給顧問的費用是少、較多或更多，根本沒有什麼比較的意義，要證明這一點，只需要簡單的算術。但投資人要如何才能確信顧問工作的品質？為了在這一點提供協助，我已提出挑選合適投資顧問的5步驟。除此之外，我只能說，在今日的專業世界，成功或甚至只是倖存的主要指標之一，就是能否在我們不是專家的領域，挑選到一名合適的專家。我們要讓心愛的人活下去，最重要的莫過於找到合適的醫師。那些沒有受過醫學訓練的人，要如何挑選？或者，同樣的道理，要如何挑選合適的律師、合適的建築師，或是合適的水電工？我擔心有些人在做出這類重要決定時不夠細心或精明，一些人總是就近找個所謂的專家，然後才怨歎為什麼自己總不像鄰居那麽「好運」。'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 第3章 投資人與金融業該前往何處？


    因為我太常聽到這種抱怨了，我知道你們有些人對這種說法的反應。 當然，你會說，我打算支付較高的費用，去聘請一流的投資顧問。我明白可以得到什麼報酬率，但我就是沒時間去調查許多投資專家，再從中挑選合適的人。


    實際上，在今日的投資世界（距今數年後的情況或許很不相同），支付更高的費用，甚至是投資顧問費，根本不能保障獲得更高水準的投資服務。根據我的觀察，我猜想，在許多公司，收費與平均長期績效之間，其實是沒什麼關聯的。


    然而，針對現在沒有找到滿意的投資顧問，又說自己沒時間去徹底研究合適人選的人，請容我說一句：只要我們認為那些事情夠重要，這個世上沒有什麼事，是找不到時間去做的。如果你懷疑這件事的重要性，不妨做這個簡單測試：拿一份紐約證交所上市股票按照字母排序的清單。最簡單的方法，是翻閱各大都會報紙的最新股票報價頁，準備一枝鉛筆，接著，像小朋友玩「給鱷子釘尾巴」的遊戲，閉上眼睛，用鉛筆在報紙上隨便點一點，請隨意點選。接著，刪去所有優先股，從你點到的那一點，往下挑選
    20 檔普通股。列入配息、分割等因素之後（如果覺得很難自己計算的話，大多數股票經紀商都會願意幫你代勞），會看'
  merge: -1
  img_proc: true
- pgno: 195
  md: '到這 20 檔普通股 5 年前以及今日的價格。平均之後，你會看到驚人的差異，一些股票的價格，可能比 5 年前跌掉一半；大多數可能上漲或下跌 20% 到
    40%。然而，有幾檔股票可能上漲 2 倍或 4 倍，還有 1、2 檔可能大漲 10 倍以上！最近一項數據顯示，不同股票之間有著驚人的大幅差異，雖然 1959
    年道瓊工業指數的平均水準，約為 1946 年的 3 倍，但 1946 年紐約證交所上市的所有股票，卻有大約 1/3 低於它們 1959 年的價格。


    簡單來說，視你買進及持有的普通股而定，5 年到 10 年的期間，可能造成它們價值增加或萎縮的幅度，因而跟股市大盤出現頗大的差異。在這種情況下，如果不花時間好好自己管理投資，或是找到可以代管的人，還有任何人可以持有股票嗎？投資人到底是覺得自己的時間有多寶貴？在事關重大之下，他還是「太忙」，忙到沒空去了解投資和投資業的基本原則嗎？假如你運氣不好，還沒找到合適人選的話，就只有親自去了解才能找到。光是因為今後數年將更容易得到良好的投資建議，就足以讓你現在使盡全力去利用最佳服務了。'
