- pgno: 273
  md: '自少數幾項重要產品。況且，這些重要產品通常占總獲利的比率更高。 因此，被競爭對手淘汰掉一項或兩項重要產品，可能會重創製藥公司的獲利能力，股價也會跟著下跌。


    雖然這些基本情況，跟我在電子業提到高成長高風險相似，有其他因素可略微抑制成長率與風險因素，使得狀況不像電子公司那麼極端。 例如，就美國來說，影響人類健康的新產品，在獲得美國食品藥物管理局（Federal
    Drug Administration, FDA）許可之前，是無法上市的，這表示公司要提交許多臨床資料，而這很耗時費時間。在有充分時間預警下，競爭對手可採取措施來因應情況。同時，我們必須記得，大多數藥物的真正市場，是由美國與海外數十萬開立處方的醫師來決定。這麼龐大的人數當中，必然包括許多隨時都在找尋更好治療方式的醫師，這些醫療界人士會歡迎那些被證實可改善治療效果的新藥。但在龐大的執業醫師之中，也會有很多明白各種強力新藥涉及的風險，而偏好使用舊藥；因為通常會有某位病患在未知理由下，出現藥物不良反應，即便眾多其他人並沒有不良副作用。最後要說的是，有些醫師使用舊藥好多年了，對調配藥方極為熟練，他們會猶豫要不要使用尚未習慣的新藥，即使新藥或許更好。基於這些理由，製藥業的經驗是，有價值的新藥，很少能快速取得與其藥效相稱的市占率。同樣地，在技術上完全過時的藥，幾'
