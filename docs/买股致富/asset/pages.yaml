  md: '我繞了一整圈，又回到開始這些評論的起點。在典型華爾街評析為何該買進一檔股票的各項理由之中，令人驚訝的是，最重要的理由竟然很少出現：「這家公司的主管逐漸證明，他們有能力發展成為最終將獲得法人認同的成長型企業，不過，當前的本益比並未顯示金融界已注意到該公司主管的優秀管理能力。」如果以上陳述的背後事實正確，這類公司主管日後將解開偉大投資成功的基本方程式：原已豐厚的投資獲利，將因為股價的本益比急遽改變，而大幅增加。


    然而，要解開這個價值寶箱，這種陳述所依據的事實和理論，都必須是正確的。就像本書已說明的，現在低本益比的公司，若未伴隨有能力創造高本益比的管理階層，通常會是一項投資陷阱，而不是投資寶藏，管理階層一定要真的很傑出才能達成本益比提升的成果。只是，被人稱為傑出還不夠，就像一家大型波士頓信託公司幾名高層主管說的，在評估一檔普通股時，管理階層占
    90%，產業占 9%，其他各種因素占 1%；而在波士頓，投資受託人是一項大產業。雖然這種說法不能用數學來量化驗證，但它簡單說明了如何利用本章所討論事項來進行投資的策略，這是可提供股票增值達到最大的關鍵。'
