  md: '常潛力股》之後的另一本著作，由他的兒子，同為投資界名師、成功基金經理人的肯恩·費雪（Kenneth L. Fisher）重新推出。他繼承了父親菲利普的投資智慧與理念，所創立的投資公司至今已管理超過
    400 億美元以上的資產，本人也因此致富、榮登美國富豪排行榜之一。


    儘管此書撰述的時代背景是以 1950 年代至 1960 年代的美國為主，然而，其智慧的高度至今相隔半個世紀來看，還是那麼的實用、而且清新儉永，這是最令人驚豔之處！


    事實上，投資學領域的發展可以說是在 1961 年「資本資產定價模型」（Capital Asset Pricing Model，簡稱 CAPM）由美國財務學者威廉·夏普（William
    Sharpe）、約翰·林納（John Lintner）、傑克·特雷諾（Jack Treynor）和賈恩·莫辛（Jan Mossin）等人先後提出幾經改良演進之後，逐漸形成現代投資組合理論，也才開啟了投資學領域的先端，因此，在本書作者菲利普·費雪撰述此書的年代，根本還沒有所謂的投資學。當時有關投資相關的學術討論仍涵蓋在財務學當中，而投資學是隨著股市的發展漸趨於成熟後，才從財務學中被獨立發展出來的，然而，費雪在此書所提出的諸多觀點，在後來投資學領域當中成為重要的討論議題，儘管他並不是投資學家，但絕對堪稱過去
