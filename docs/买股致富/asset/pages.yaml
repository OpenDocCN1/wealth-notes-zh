  md: '得很嚴重，卻沒有其他主管可以接任？假設數千哩外的一個研究團體，有了一項很棒的技術發現，證實其他廉價新金屬或合金性能，大幅優於先鋒金屬開始建立聲名的金屬？假設那名極為滿意先鋒金屬表現，而提供必要融資、避免先鋒金屬破產的大型製造商總裁，當時正好在歐洲度假，而他的助理雖然也欣賞先鋒金屬的做法，卻不認為「應該冒死」提供先鋒金屬公司資金？以上這些都是完全有可能發生的事，或是其他更多的狀況，都可能讓羅賓森投資的故事，出現全然不同的結局。


    相反地，當該公司股價達到本益比 18 倍，就比較不容易有什麼事能阻礙公司進一步成長。即使發現更有競爭力的金屬與合金，也不會太嚴重。這時候，該公司已擁有技術人才能嫻熟轉移到新材料，同樣重要的是，擁有財務實力可度過昂貴的摸索時期。況且，即使在這個時候，先鋒金屬已展開新的軸承事業，具備足夠的多角化經營，在新事業發展的昂貴過渡時期，其他事業仍可維持高度獲利。簡單來說，相較於極高危險之下獲利
    40 倍，超低風險之下增值 6 倍，可視為更誘人的投資。


    那麼，第 3 個 10 年期該如何看待呢？該檔個股如今達到本益比 36 倍，幾乎已完全具備最高等級投資的地位。在這些情況下，在普通年度，本益比不會再升高了，在這種情況下，買進先鋒金屬股票不是很傻嗎？'
