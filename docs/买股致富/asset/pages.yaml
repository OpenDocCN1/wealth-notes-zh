    # 再添一本

    投資書籍的必要性


    證券投資書籍愈來愈像電視廣告及犯罪漫畫。大多數人以為這類書刊早已太過氾濫，因此，在原已汗牛充棟、相互矛盾、令投資人不知所措的股票投資建議之外，我仔細考慮過本書的內容，是否可以減少混淆或只是徒增投資人困擾。


    兩年前，我為這個早已擁擠的領域增添了一本書，我會這麼做，是因為相信我的書提出了需要說明的投資理念，至今我仍這麼相信著。該書引發的熱烈迴響，證實了這項結論。但現在再寫第二本書，除了讓這個領域更加擁擠之外，是否還有其他作用？會不會像是在已有
