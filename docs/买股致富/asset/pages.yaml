- pgno: 167
  md: '部人士、好讓他們願意跟投資人士見面，並接受他提問的合適來源，也同樣困難。地理位置又是另一個問題，最佳線民的潛在人選，或許跟該投資人士不在同一地區。另外，在打探消息的半途中，跟那些身在遠方的人交叉核對新資訊，顯然也是困難的。不只如此，通常距離愈遠，就愈難找到可以代為介紹理想線民的合適來源。


    可惜，以今日科技與金融發展的驚人速度來看，機會不會總是等候這種悠閒的調查步調。很多時候，當你完成必要的調查工作，別人也已經看到潛在的投資機會。因此，你正在研究的股票，其價格可能上漲到一個程度，使它的吸引力遠低於你剛開始研究的時候。同時，當大多數最佳投資機會來自複雜科技進步的時代，投資人士可能遇到極為複雜的科技，他可能搞不清楚互相矛盾的技術性說法。他或許會發現，光靠自己的學術背景，不足以做出明智的決定。


    我們傑出產業的公司研究實驗室，費盡辛苦才能成功開發出來的複雜技術顯示，這也預示挑選傑出股票的方法，終究也會改良。我們重要的發明與新產品，不再是大多來自一個埋頭苦幹的天才；相反地，會是來自一群人的團隊合作，每個人各有不同的科學專長與背景。在現代產業，舉例來說，一項重要的新產品或製程，很可能是來自
    5 個人的合作，而'
