  md: '額也會大幅增加，一些最值回票價的收購案例，是早在合併之前，收購公司的研究或工程部門便已想出方法，可大幅重新設計被收購公司一個以上的主要產品，進而擴大潛在市場。


    純財務方面的好處，有時也可帶來重要的節約。一家進行收購的大公司，或許擁有足夠的信用評等，可以用 4% 的利率借取融資。它可以收購一家較不穩固的公司，後者可能是較不牢靠的債務人，必須支付
    6% 的利率。合併可以使營運立即獲得再融資，小公司的利息負擔可以減少 1.5 個百分點。


    既然購併有這些及其他各種好處，為什麼以前的購併趨勢，沒有像近年來這麼高速？難道優秀主管不該把大部分的時間，花在搜尋這方面的機會嗎？難道投資人不該迫切尋找透過收購而不斷成長的公司嗎？


    這件事用美式足球來比喻，或許最能講得清楚。如果能成功的話，掌握空中優勢，也就是長傳急攻，可讓球隊更快取得推進碼數，勝過持球跑過全場（註①）。但當球隊主要依賴長傳而不是持球的話，萬一傳球


