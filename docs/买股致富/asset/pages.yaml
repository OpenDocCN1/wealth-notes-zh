    品必須負擔的成本。


    超額雇用工人的問題，亦即堅持那些添增不必要工作的勞動規定，並不是簡單的問題。企業主管或許宣稱，超額雇用叫人無法忍受（確實如此），可是勞工代表總是頑固地堅持這些規定，直到受波及的工人獲得某些保證——當他們被效率更高的設備取代時，他們會在相同社區找到其他薪資近似的工作。研發中的工程創造出無數新產業的同時，也讓老舊產業可用較少的工人生產較多產品，只要肯多加留意，這種為被裁撤的工人找到薪資近似（甚至更好）工作的保證並不太困難。如果運氣夠好，1960
    年代的政府有總統願意正視超額雇用的問題，那麼我相信大多數美國產業不僅能夠守住在國內市占的地位，還能維持與外國的薪資差異。如果不是這樣，而美國薪資成本相較於其他國家上漲更多，將發生大量失業及經濟
    Punj 的時刻。然而，我目前找不到任何根據可以猜測會發生何種情況，此結果將取決於未來的總統放任美國陷入完全沒必要的經濟危機，抑或他可以發揮個人影響力與魅力，讓各界了解到什麼是該做的事。如果美國製造的產品想要對抗廉價外國勞工的激烈競爭，而且不犧牲現在的高生活水準的話，企業與工會領袖就必須在這些議題上合作，但迄今仍未見雙方有合作的跡象。萬一我們走到只有政府可以出面領導的地步，一切將取決於誰來領導政府以及他的作為，在本書撰寫'
