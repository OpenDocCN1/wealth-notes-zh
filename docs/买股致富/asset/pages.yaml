- pgno: 197
  md: '是那麼大，我認為花太多時間及心思在這些考量上，是有害無益的。主因是這會讓人分心，以至於沒有在更重要的投資元素裡，投入更多時間考量。其中有一些事，讓許多投資人都感到無比困惑。在本書這一章，我想討論一些投資意義各不相同的事情，但都相當令人混淆的事情。其中最重要的一件事，便是公司合併對投資的意義。


    # 合併這件應該好 不好？


    我不厭其煩地強調，想在幾年間獲得大幅獲利的投資人，最好的方法便是只投資在有強烈跡象顯示，獲利成長將遠高於整體美國企業的公司。我也指出，銷售額穩定上揚的趨勢是獲利成長的基本條件，但它不是唯一的條件，因為若每股盈餘沒有相對應的增加，銷售額的成長對投資人是完全沒有用的。銷售額若沒有大幅上升的趨勢，股東只會偶爾享受到管理階層設法明顯提升效率，促使獲利一次性大增帶來的短期利益，然而，在短短數年間，這個方法就會達到極限。因此，每股盈餘好幾十年持續大增的那種投資盛況，必須源於銷售額同步增加。基於這個理由，銷售大幅而持續上揚的趨勢，往往被視為投資格外誘人的第
    1 個線索。


    最能造成公司銷售快速或大幅增加的方法，莫過於收購 1 家以上的營'
