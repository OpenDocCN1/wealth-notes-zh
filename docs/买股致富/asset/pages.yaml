  md: '# 推薦序

    歷久彌新的

    基本選股策略


    《買股致富》是先父的第二本著作，可說是他在 1958 年撰寫的《非常潛力股》（Common Stocks and Uncommon Profits）這本經典的續篇。他的第一本著作，數十年來一直是史丹佛商學研究所的基本教科書，改變了無數讀者的投資觀念，包括華倫．巴菲特（Warren
    Buffett），他曾說這本書讓他脫離單純的葛拉漢策略，日後建立起他個人的投資策略。雖然本書的銷售量、影響力，或是發行時間，都比不上第一本書，但對所有認真研究市場的學生來說，依然相當重要及實用，理由有二：


    第一，本書潤飾第一本書的觀念，增添深度與內容，其中許多是他後'
  merge: -1
  img_proc: true
- pgno: 7
  md: '來覺得應該寫進第一本書的內容。喜救第一本書的人（為數頗眾），將在本書找到更多。本書是在《非常潛力股》出版後不到兩年內撰寫的，也是先父要去史丹佛商學研究所教授投資課之前出版的。在這第二本書裡，他更詳盡說明他認為普通股票與好股票，以及普通企業與好企業之間的差異。


    第二，有關1960年代的投資業狀況，以及當時認真的專業人士對投資市場的擔憂，本書或許提供了最佳的寫照。從某方面來看，這是一本歷史書籍。雖然先父在撰寫時沒有刻意那麼做，但結果就是如此。現在沒有多少專業人士，年紀大到對1960年代有深刻記憶，我就沒有。我對那個時期的記憶，是透過一個男孩的迷濛雙眼，看著父親在晚餐桌上談論而來的；而我，現在已經56歲了。如果你比我大上10歲，即將退休，你的雙眼應該見識過更多，但很可能當時你只是個年輕的初學者，沒什麼經驗，正在摸索這個領域。1960年代，是投資史一個很重要的年代，當時股市達到一個高水準，是後來20年都很難超越的。透過頂尖經理人的眼睛，了解投資人如何看待這個年代的開展，這本書的重要性將不亞於你所能找到的任何一部歷史書籍。


    2007年，我出版了13年來ѱc第一本書——《投資最重要的3個問題》'
  merge: -1
  img_proc: true
- pgno: 8
  md: '（The Only Three Questions that Count），並成為《紐約時報》暢銷書。這本書根據一個基本概念，也就是半數以上被我們奉為投資智慧的，其實都是虛假的神話。只要設法找出並衡量神話真假，你便能了解別人不知道的事，然後跟他們對作。因此，我喜愛《買股致富》的獻詞：


    > 「不論是大戶或散戶，所有不認同『大家似乎都相信，那必然是對的』這種想法的投資人，這本書是獻給你的。」


    這句話是用簡化的方式，表達出相同的意見。別忘了，那是現代投資組合理論被廣泛採用之前的年代（當時距離馬克維茲（Marjowitz）提出現代投資組合理論基礎，僅僅過了
    9 年的時間）。


    首先，他提出一個問題：「是否有任何可能的藉口，再寫一本投資書籍？」47 年後的現在，一無是處的投資書籍氾濫到超出常人能理解的程度，這仍是一個好問題。我們很少在一年看到兩本以上真正實用、歷久彌新的投資書籍，有很多年甚至連一本也沒有。


    在第 1 章，他先討論今日的頭號問題：通膨。你會發現，他的分析有些缺點，但具先見之明。之所以有缺陷，是因為當時他仍未接觸到尚'
  merge: -1
  img_proc: true
- pgno: 9
  md: '未興起的貨幣學派，不久之後，米爾頓·傅利曼（Milton Friedman，註 ①）才讓這個流派蓬勃發展。他寫作本書 3 年後，傅利曼才發表驚天動地的《美國貨幣史
    1867～1960》（A Monetary History of the United States, 1867-1960）。（況且，又過了好幾年，傅利曼這枚
    860 頁的「炸彈」才完全爆炸，影響全世界。）


    然而，本書的討論充滿先見之明；他讓大家領略到連傅利曼都會喜歡的精準分析：為什麼央行調升和調降利率，未必與控制通膨的貨幣政策一致。他告訴你，為什麼在某些狀況下，聯準會升息反而會增強通膨壓力，而不是壓抑通膨。他主張聯準會不應該透過調整利率的做法，來對抗通貨膨脹，即使傅利曼也會完全認同這種說法。然而，今日的世界，是先父和傅利曼所鄙視的，央行用來控制通膨的主要機制，就是升息及降息。


    然而，與傅利曼正好相反，他描繪的通膨景況，基本上是聯準會將臣服於社會的大潮流。我認為他是對的，如果你把聯準會視為一名強大的


    註①：美國經濟學家，以主張自由放任資本主義而聞名。1976 年取得諾貝爾經濟學獎，以表揚他在消費分析、貨幣供應理論及歷史等鉅略的貢獻，被譽為 20 世紀最重要
    的經濟學家之一。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '受害者，是受到長期緩慢轉變的社會價值所決定的龐大體系所害，便能理解為什麼在某些環境下，聯準會過得比較輕鬆，其他時候則否。他極為正確地預測，通膨會永久持續下去，甚至還會加速。1960
    年代的社會潮流，包括大政府、嬰兒潮邁向高齡後的支出增加，以及喜愛高價品、不喜歡廉價物的心理轉變，種種情境創造一股通膨上漲的浪潮。果然就出現了這些情況。


    但他接著指出，我們還是有機會的。買入表現平凡的股票或許無法抵抗通膨，買入好股票便能做到，只要利用股市波動，一次的股市下跌便可提供足夠的反彈，抵銷好幾年的通膨。不要常常這麼做，但機會來時要好好做，這是他最接近支持市場擇時逢出（market-timing）的時候。


    先父一再證明，科學與技術是通膨的敵人，卻是投資人的朋友。本書可能是第一個預測科學與技術，對生產力、成長、通膨產生影響的著作。千萬不要誤會，先父一輩子對這一點的看法都很極端。他認為，有利於通膨的社會壓力永遠不會止息，唯有科學與技術的效率，以及削減成本的力量，才是解決通膨之道。


    我不再詳述他對這點的說明，但他的論點在今日看來，依然是正確的。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '我們現在生活的世界，通膨熊市是錯誤的，因為過去 10 年來的生產力成長幅度，已超越大多數觀察家探測的能力。成長的動力是什麼？正是先父將近 50 年前，在本書預測的事物，他堅信，新工廠會削減成本，有助於對抗通膨，而政府的所作所為，包括調升短期利率，往往延緩新工廠、新技術（可削減成本）的發展，反而造成通膨。


    他認為，工會與科學是勢均力敵的死對頭，工會有害，而科學有益。只不過，他無法預測到實際發生的事，就是後來大多數工會都式微了（除了政府工會大規模成長之外）。他從未料想到，這個世界會變成政府員工需要、想要，或是獲准才能取得工會的保障；不只如此，就像他指出的那樣，無法想像確保婚姻美滿竟會變成政府的工作。


    他提到課稅對股市的影響，這已超越他那個時代的前供給面經濟學（pre-supply-side economics）。更有趣的是，當我們以為沒有人想到這些事，他已經開始重視海外競爭與外國投資了。當然，有人想到這些事，但你必須把本書當成歷史書來看，才會知道這點。


    他有一句話，是所有富裕的人都應牢牢記住的。在第 105 頁，他說：「首先，家族裡的富裕成員幾乎總是受到其他人的嫉妒及討厭。」話雖不錯，'
  merge: -1
  img_proc: true
- pgno: 12
  md: '但想想，我們有多少人立志成為「被討厭的人」，真有趣！當然，他這句話有其他用意，但仍是千真萬確的：讓你的手足、表親以及其他人嫉妒和討厭你的方法，就是變得比他們有錢。奇怪的是，那麼多人都這種抱負。


    在第 2 章，他對先鋒金屬公司（Pioneer Metals Corporation）的描述，又是一個大家都知道，卻從未想過的案例。一個人、一個觀念可以讓一家乏味、不賺錢的公司，以及不值錢的股票，在短短數年內，轉型成為創新的全球領導者。先父表示，這家假想的個案並不是任何單一公司，而是許多公司的合成。然而，在重讀第
    2 章時，我訝異地發現，12 年後的紐柯公司（Nucor），完美地詮釋了這個案例。


    肯恩·艾佛森（Ken Iverson）把紐柯公司這家瀕臨倒閉的金屬公司，翻轉成為低成本鋼鐵生產商，最終成為美國最大的鋼鐵廠。我也小小參與了那種興奮之情，我在
    1976 年發掘紐柯，並帶領一群投資人投資這家公司，包括先父，他一直持有這檔股票，直到他過世時，獲利已超過 100 倍。紐柯的故事，與這數十年來的進展，跟先父虛構的先鋒金屬公司，可說有異曲同工之妙。如果你不熟悉紐柯，便錯過了一個最偉大的美國故事，建議你應該閱讀我朋友理查·普雷斯頓（Richard
    Preston）'
  merge: -1
  img_proc: true
- pgno: 13
  md: '寫的該公司傳記《美國鋼鐵》（American Steel）。


    但本書還有更多故事。先父寫到一些人轉變他們各自的領域，同樣引人入勝。他寫到比爾·惠烈（Bill Hewlett）及大衛·普克（Dave Packard）創辦惠普公司（Hewlett-Packard）時，做了類似紐柯公司翻身的事。這真叫人吃驚，因為先父撰寫此書時，惠普公司市值僅1億5,000萬美元。假如有人當時便買進惠普的股票，並持有數十年，他們就賺翻了。德州儀器（Texas
    Instruments）是他寫到的另一家這類公司，大家只要在當年購買本書，買進這些個股，績效就可以數十年來領先幾乎所有人，光是這件事本身，就是一個了不起的故事。


    在我認為，第3章不是先父撰寫本書的最佳片段。從各方面來看，其中皆沒有什麼先見之明，至少在我看來是如此。自從本書初版以來，已有無數書籍討論如何挑選基金經理人。本章最重要的概念，或許是他在1960年便開始討論這個流程，真的是走在時代尖端。


    但接著，第4章的內容很驚人。假如那個年代的執行長，聽從他對合併的忠告，1960年代的企業集團災難，或許就可以完全避免。他對愚蠢的合併，提出鞭辟入裡的批評。他準確地說明及預測哪些合併往往能'
  merge: -1
  img_proc: true
- pgno: 14
  md: '成功，哪些很少成功。簡單來說，先父帶領大家了解，為什麼在自己核心能力領域進行垂直整合的收購者，往往可以成功，而追求橫向多元化的收購鮮少成功。當然，1960
    年代的企業集團，幾乎都在追求橫向多元化，事後來看，對社會完全沒有效益。但凡是想要進行合併，或是持有進行合併的公司股票的人，都應該熟讀他的 9 條合併規則。在本書再版的
    2007 年尤其需要，因為用現金進行的公司合併案數量達到歷史新高。


    第 4 章有關投票權的部分，說明我們現今重視公司治理及股東投票，是多麼愚蠢的事。在這點，他超前時代 50 年，我們社會數十年前在這個議題轉錯了方向（由政客、社會學家以及律師帶頭），從此沒有回頭，我們因而蒙受重大損害。


    他的另一個觀點很符合 2007 年的潮流，他說明政客與政治根本不是我們想像的，你完全沒有理由為了美國兩黨政權轉移便賣掉股票，或甚至更換持股類型。他強調的是國會權力消長，而不是總統，這在
    2007 年尤其實用，他在大約半個世紀前寫的，就好像是為 2007 年寫的一樣。


    關於第 5 章的內容，一方面可作為歷史研究，一方面可作為企業分析的標準工具，他的重點放在當時很現代化的產業分析。表面上，現在希'
