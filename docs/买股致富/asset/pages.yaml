  md: '望獲得買股建議的讀者，可能會覺得大部分內容並不相干，大多數讀者會訝異他花那麼多篇幅在化學產業，很難理解他為什麼這麼做。但在那個時代，化學是主要的成長產業，就像他說的，當時化學業的成長率是美國經濟成長率的
    3 倍。現在，成長率達到全國成長率 3 倍的任何產業，都會得到大家重視，因此，當時的情況並不令人意外。


    當時的化學產業，很像今日的科技業：高速成長了數十年的主要領域，巨型老牌業者及小型新創公司都想進入。他明白表示，如果你找到合適的大型化學公司，基於成長的安全性，可以長時間依賴它們。他尤其點出兩家：陶氏化學（Dow
    Chemical）及杜邦（DuPont）。這兩家公司現今是美國化學巨擘，假如你買進其中一家的股票，並長抱到 1970 年代、1980 年代，甚至是 1990
    年代晚期，是可以打敗股市大盤的。杜邦是當時美國最大的化學公司，陶氏是第 5 大。


    先父從未提及美國聯合碳化物（Union Carbide）、孟山都（Monsanto），或是格雷斯（W.R. Grace）等當時其他大型業者，但它們都沒維持最初的獨立公司形式，它們都被解體、分拆及出售，包括部分賣給陶氏和杜邦。當時其他較小但仍頗具規模的化學公司，像史多福（Stauffer）及羅門哈斯（Rohm
    & Haas），數十年前便已遭吞併及下市。因此，先父專'
