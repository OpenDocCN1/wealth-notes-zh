  md: '# 第5章 1960年代的主要成長產業


    「鋁」這第一個成為重要產業的工業金屬，自60年前開始應用於商業後，數十年來不斷成長，這種成長已遠遠超越美國工業的整體速度，所有跡象都顯示，這個產業將維持高於平均的擴張速度。「鎂」是第二個出現的「輕金屬」，也享受到類似的迅速成長，未來10年的前景，同樣令人振奮。在1950年下半，先是鈦、鋯，後來是鈹，逐漸吸引投資目光，因為原子、航空、飛彈和化學加工等成長領域的特殊需求顯示，這些金屬的特性將具有龐大市場。鉬和鈮或許會在1960年代加入這份名單，如果人們對如何用較低成本提煉這些金屬的成本，以及對較容易的鍛造方法，能有更多了解的話。誰能說出哪一種今日不具商業意義的其他金屬或其他物質，不會成為明日科技的迫切需求？誰能說出哪一種可以成為重大的投資標的？


    我猜想，這時候，許多讀過這些段落的人，已搶先一步知道我現在要說的話了：太過依賴一個產業的性質，來決定投資吸引力，是有限制的，這是因為產業之間沒有明確劃分的界線。通常，大家都是任意假設一個龐大產業，例如食品加工業，是分在同一個類股，又或者，區分為較小的區塊，例如，肉品加工、烘焙或蔬果罐頭。對於想判斷一個產業投資特性的投資人來說，比較重要的事實是，產業之間存在模糊地帶。為了進一步探討這點，我們不妨回顧上一段最後一句的關鍵字眼。那就是「或'
  merge: -1
  img_proc: true
- pgno: 281
  md: "其他物質」。 \n\n以投資人的角度來說，�ritis這種物質的投資特性，和鋁並沒有基本差別。然而，作為一種稀土，金融界自動將鈽分類為化學業，而大部分華爾街會把鋁視為金屬業，而不是化學業。這兩種物質都是化學元素，兩者都是經由化學加工製成商業產品。對投資人最重要的是，這兩種物質的加工，都比挖掘含有鈽或鋁的礦石（也就是採礦）來得更複雜，這兩個領域的公司，作為股票投資時的基本表現將十分相似，勝過鋁公司與銅、鋅、鉛、銀生產商等礦業公司投資特性的相似程度。\n\
    \n然而，這裡需要進一步分類。在今日的情況下，銅的開採與精煉，完全不像在化學製程更複雜的鋁或鎂產業。因此，就投資來說，唯有整合型銅公司及鑄造業務，才能跟鋁或鎂公司相提並論。但這種差異並非永遠如此，有好幾年，業界嘗試新化學製程，它們使用不同製程，來生產一些古老的工業金屬，儘管商業成功結果並不相同。如果這些方法最後成功了，一些礦業的古老分支，或許會具有跟今日很不相同的投資特色。為了實際的目的，某些我們今日視為礦業的公司，在數年後或許會變成化學公司。簡單來說，不同產業之間投資特色的界線不僅模糊，而且，在\
    \ 1960 年代這種科技快速擴展的年代，今日存在的界線也會和明日的"
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 第5章 1960年代的主要成長產業


    界線很不相同。


    如果金融圈用以區隔投資的產業分類，大多都很隨便，花那麼多時間去研究不同產業的不同特色，有何意義呢？從獲取最大的投資利得來說，我認為還是有意義的。以IBM的股票為例，該公司被分類在①電子業、②機械業，或是③辦公室設備業，都沒什麼關係。真正重要的，是在考慮該檔股票時，投資人必須了解公司是否有能力持續開發更好的機器（因為這類設備不會很快耗損），以及售後服務的重要性，因為這兩點是評估機械股的重點。同樣重要的是，投資人必須知道IBM符合挑選電子股時需要格外注意的一些事項，我是指在討論電子業的時候，提到需要特別注意的4件事：①保持研究領先的能力；②國防與民間業務的相關性；③產品線獲得顧客認同以提供價格競爭優勢，以及④銷售能力。當然，這些重點都無法免除投資人本身必須自行承擔的責任，也就是判斷IBM或其他股票是否符合一家經營良善公司的其他特點，例如，保持生產效率的能力，以及善待人才的能力。然而，了解產業的投資特色，並判斷這些特色之後，確實很快便能夠看出：①要尋找什麼標的，以及②投資類型。


    由於金融圈極為重視公認的成長產業，因此一些出色的投資機會，不'
  merge: -1
  img_proc: true
- pgno: 283
  md: '會存在這些產業的核心，而是在這些產業的邊緣。例如，就在 1950 年代的最後 15 個月，投資人開始注意到一家新罕布夏州小公司微型精密軸承（Miniature
    Precision Bearings）的長程潛力。這家公司的主要投資特色如下：這家公司是一系列微型滾珠軸承的最大生產商，也是最低成本生產商之一。這些微型軸承，與較大或傳統尺寸產品相較之下的優越品質，似乎將開啟未來多年優於平均的成長前景。它們不僅符合許多地方正在開發中的迷你化概念，而且，它們運用在飛彈的優勢，使得無論眾多互相競爭的武器系統之中最後由誰獲選，都必然會使用愈來愈多這些微型零組件。同時，它們早已運用在重要的民間開發，例如高速鑽牙機，因此，這種產品的未來，並不完全維繫於武器。這項因素進一步增強，因為該公司擁有一款較大型軸承的專利，已來到商業生產初期，而且與國防毫無關聯。因為這些迷你軸承的雄厚市場潛力，一些其他公司，包括很大型傳統軸承製造商，都設法要搶奪這個市場。然而，生產技術與品質管理，使得這家小公司得以保住最大供應商的地位；製造技術、行銷能力與擅長特殊冶金，使得該公司有可能持續這種地位。


    這家公司屬於不太受矚目的冶金業，卻具有受矚目的電子與機械業的成長因子。這檔個股的投資魅力關鍵，在於技術很困難，如果其他公司很容易便可追上或超越主要供應商滿足這個產業的嚴格顧客標準，'
  merge: -1
  img_proc: true
- pgno: 284
  md: '那麼微型精密軸承公司的股票便沒有什麼投資魅力可言。正因不容易，以及在經營理念與管理高層素質這兩方面，該公司都很可能保持名列前茅。1959年時，出現投資這家成長企業的真正機會。隨著製造技術在1960年代愈趨複雜，這類機會也會愈來愈多。需要觀察的關鍵因素，首先，是今日的龍頭公司，在產業成長時守住市占率的可能性；其次，是產品未來的成長規模。


    上述這些話，不是為了替1960年代有投資機會的產業清單做出結語，即使是最粗略的嘗試，我懷疑是否有人充分了解美國企業的所有面向，而能做到這點，我很確定自己沒有那種程度的了解。然而，在下結論之前，我想要再提一個我認為將持續出現投資好機會的主要領域。那就是提供服務，而不是產品或工作的公司，它們的地位，使得大多數人找它們提供那項服務，而不會去找別人。我要舉的以前發生過的例子，是提供競爭性事業的重要素材，也就是提供資訊情報的那些公司。1960年代出現的機會，或許也會出現在資訊提供廠商，因為將來會不斷需要更多與更好的資料，但為顧客提供不同種類服務的公司也會出現機會。


    在1950年代，鄧白氏（Dun & Bradstreet）的股票證實是一項很好的投資，這家公司成為取得一般信用資訊的來源。隨著企業成長，這類'
  merge: -1
  img_proc: true
- pgno: 285
  md: '資料的需求愈來愈多，該公司已奠定基礎，可滿足這類需求，而不必增加成本。


    同樣地，在 1958 年底，尼爾森（A.C. Nielsen）股票首度公開發行，由於金融界對它還不熟悉，這檔股票的投資特色並沒有得到應有的注意，由於它是投資人在
    1960 年代應該注意的投資類型典範，詳細檢視這種情況，或許可產生豐碩的成果。這家公司有其他業務，但獲利主要來自提供準確的即時資訊，給美國許多標準消費品（罐頭食品、香菸、湯、紙製品等）的大型製造商，包括它們自己與對手產品線的每一樣產品，在每個地區的銷售資料。它們實際訪查精挑細選的樣板零售管道，以取得資料。由於該公司為許多顧客提供服務的費用，遠低於製造商自己進行，甚至是一些廠商合作進行的成本，新進業者不太可能搶奪這項業務，除非該公司提供給顧客的服務品質明顯惡化，這點也是不太可能。同時，該公司的業務逐年大幅成長，這歸功於
    3 項成長力量，分別是：①既有顧客愈來愈多產品線使用這項服務；②該公司為愈來愈多不同種類的產品開發服務，這項成長因子似乎擁有無比潛力；③把這些服務拓展到海外，而這部分的獲利才正要開始。最後，在過去幾年，該公司由電視收視率服務和點券處理服務賺取一些營收，這些業務也是才開始獲利。並非因為該公司業務已成長多年，而是因為業務很有可能在未來多年同樣'
  merge: -1
  img_proc: true
- pgno: 286
  md: '穩定成長，所以，股票首度公開發行 6 個月後，便為投資人創造可觀的利潤，大型機構投資人認定這是一檔成長股，安全性也符合他們的需求。


    有人或許會問，為什麼要這麼詳細討論尼爾森公司，因為它是一家性質很獨特的公司，類似的投資機會可能不會再出現。當然，我的回答是，這就是我想要說明的、那種可成為良好投資的服務業公司。只不過這家公司很獨特，提供
    的服務是許多其他公司無法仿照的，而可能成為熱門股。然而，就整個經濟來看，提供服務的產業成長速度，遠高於提供實體產品的產業。就像鄧白氏與尼爾森站上投資舞台，我猜想，未來
    10 年，其他公司也將出現。假如符合成功投資的基本特點，它們可能很值得等候，這就是有高道德標準跟非凡能力的 quản lý 階層，可領導公司業務，跨入需求成長高於平均的領域。通常，這些領域基於某些理由，是新對手很難跨入的，因此，該公司會持續享有預期成長的所有市占率。然而，在偶爾的情況下，如果成長潛力夠大，而且如果公司管理階層能力超強，這個服務領域的某個專業部門，仍可能出現重大的投資機會，至少在表面上，這些領域看來欠缺天然保障阻止其他公司來爭奪成長。


    在尼爾森股票首度公開發行之後，金融圈新近又見識到這類投資機會，我是說萬寶華（Manpower）的股票。這家在 1948 年創立的公司，是'
  merge: -1
  img_proc: true
- pgno: 287
  md: '全國最大的企業短期人力仲介公司。截至 1959 年 6 月，該公司在全美 40 州以及 10 個海外國家，成立了 169 間辦公室。許多美國最大規模的工業、金融和零售公司，都定期尋求該公司的服務。如果這家公司沒有滿足實際需求，便不可能有這種成長。該公司明白，由個人法律事務所到大型公司，員工生病、度假或臨時的異常工作量，都會讓它們需要可短期派遣的專業人員。同時，家庭主婦、學生、教師、退休人士等族群，是這類人才的龐大來源，他們或許希望一週工作幾天，或是一年工作幾個月，但無法找正職工作。萬寶華按照實際工作時數，來支付這些人薪水，他們被派到不同的萬寶華顧客那裡工作，顧客可省去找尋臨時專業人才的麻煩，以及付給他們薪水的成本。以今日的員工福利、保險成本與其他隱藏薪資費用來看，省下來的費用，時常可抵銷萬寶華超過基本薪資以上的收費，還可免除挑到不理想臨時員工的風險。萬寶華的業務快速成長，自然不令人訝異。


    然而，這項事業是否真的適合長期投資呢？在任何社區設立人力機構的所需資金並不大。凡是在一個城市或郊區，有許多朋友與熟人的人，都可以發揮巧思與推銷能力，而取得他所在地區的一定業務量。這種領域難道不是很多人可以輕易競爭的成長市場，因此不算是項吸引人的投資嗎？'
  merge: -1
  img_proc: true
- pgno: 288
  md: '這項服務十分新穎，只有等到未來才能知道確定的答案。然而，我相信，有跡象顯示，儘管具有這些明顯的缺點，萬寶華即將證明自己的投資價值，它的股價大漲，也會證實是有道理的。萬寶華的管理階層，已展現在許多不相干領域拓展服務的能力。它的辦公室部門提供的人才，由速記員、總機接線員，到檔案管理員、簿記員、製表員，以及較複雜的現代辦公設備操作員。它的工業部門提供的人才更廣泛，像是倉儲員工、清潔工、庫存盤點員、通訊員，甚至是洗車工。它的銷售輔助部門，在提供銷售人員之外，還提供示範人員、模特兒和收集市調資料的人員。它的技術部門提供臨時專業人才，包括工程師、繪圖員和會計師。有了這些經驗之後，該公司已學會如何爭取生意，以及如何降低整體費用。它設定的收費，可能讓既沒有業務量，又缺乏攏客能力，以及不易為專業人員找到理想兼差經驗的新進業者難以競爭。


    想在 1960 年代服務業尋找理想投資機會的投資人必須記住，這個領域的新公司業務，將會跟我舉的例子有很大的不同，就像鄧白氏、尼爾森與萬寶華彼此之間並不相同一樣。許多公司因為性質的關係，並不適合作為長期投資，在考慮各家公司時，投資人應該問自己
    3 個問題：這個領域是否保證有很好的成長？這家公司的管理階層是否真的很卓越？在這個領域取得領導地位，是否可以保證以後不會有很多其他競爭對手'
  merge: -1
  img_proc: true
- pgno: 289
  md: '來搶奪成長（而且實力不會遠不如龍頭公司）？唯有這 3 個問題都出現肯定答案時，服務業才會提供最大的吸引力，屆時，這些股票將會是未來 10 年報酬最豐厚的股票。


    # 戰後數年的假成長股


    一項常見的投資謬誤，是造成許多投資人往往無法取得理想績效的一大原因，那就是無條件認為最近幾年發生的事，必定會在無限的未來持續發生。多年來，或者可說數十年來，其他投資媒介很明顯為保守派投資人提供比鐵路股更好的前景，全國各地的內行法人買家，把大部分股票部位配置在這些股票，主要是因為大家都這麼做。同樣地，由於一些產業的股票，像是紙類、水泥和木材廠，為股東創造可觀的漲幅，如果比較
    1950 年代後期的股價，與 10 到 20 年前的價位，我想在嚴格檢視許多享受光環的股票之後，會發現這種漲幅其實沒有正當理由。


    這些產業的一項特色，是它們需要鉅額資金，水泥廠或造紙廠的每一噸產能，都需要龐大的投資。木材廠不需要，但大漲的木材股並不是只擁有工廠設施；而是它們也擁有自己的木材供給，擁有林地也需要大量投資。'
  merge: -1
  img_proc: true
- pgno: 290
  md: '我們現在回到大蕭條的 1930 年代。同樣這些產業，就是造紙、水泥、木材，當年是比較衰弱的。它們因為不同程度的產能過剩，造成廠房閒置，仍在營運的工廠，也是獲利微薄。結果，因為股價通常與獲利有關，而不是它擁有的固定資產，這些類股的股價大多跟水泥廠、造紙廠和林地的原始成本出現大幅折價。


    在二戰結束之後不久，這些產業發生很大的轉變，這項轉變出現在兩個主要層面：一方面，遍及幾乎所有產業的經濟成長浪潮，意味著水泥、紙張和木材的需求，激增到一個高點，不僅戰前的過剩產能全都派上用場，而且還需要興建更多工廠。這個時候，第二股影響力開始抬頭了，戰後惡性通膨導致的價格結構，致使每一噸新增的水泥或紙張工廠產能，都必須用比
    1920 年代高出許多的成本去建造，目前較新的工廠，大多是那個年代興建的。同樣地，取得更多可伐木的林地，也必須付出同等的額外成本。


    由於這些新增的設施，都是真的有需要，市場立即因應這種價格結構，讓新上線的產能，可以在戰後成本的基礎上獲得正常利潤。但看看這對戰前工廠的獲利能力有什麼影響，戰前工廠仍占這些產業的絕大部分產出。由於它們現在產能滿載，相較於戰前產能過剩，獲利已大幅增加。'
  merge: -1
  img_proc: true
- pgno: 291
  md: '除此之外，它們現在營運的價格結構，使得成本較高的工廠，也能獲得可觀的報酬率。難怪，這些水泥、木材和造紙股的獲利大增，而且股價漲幅驚人。


    我相信，除了罕見例外，這些類股在 1960 年代不會是理想的股票投資，不是因為這些類股在戰後幾年的大漲並不完全合理。而是因為造成這種大漲的兩項條件，不會再度出現。其一是通膨，就如同近期發生的狀況，大家或許仍會持續感受到通膨，由於這些產業在通膨環境下很興盛，而且很可能繼續成長，因此幾乎沒有可能再一次發生這些類股的股價由「皮包骨」（bare
    bones，註②）水準回升到正常穩健水準，所拉出一大段漲幅。


    我們來比較水泥、木材和造紙股的表現，以及化學、電子與製藥股的表現。後者在 1930 年代後期，從未出現超低價位，它們大多本益比頗高，股價是帳面價值的數倍。在那之後開始的大漲，幾乎完全是因為這些公司在那幾年推出的新產品，而這要歸功於它們自己的研究或工程努力，這項過程必然會在
    1960 年代持續進行，這不同於水泥、木材和造


    註②：編按：指之前被殺到見骨的超低價。'
  merge: -1
  img_proc: true
- pgno: 292
  md: '# 第5章 1960年代的主要成長產業


    紙等類股的一次性的「鹹魚翻生」或「一夕暴富」改變。


    當然，基於每家公司之間的差異，我們如果不提到某些個別公司，便不能對類股做出這一類的全面性説法。有的化學與電子公司顯然可繼續在這些活絡的產業競爭，結果它們逐漸萎縮，因為似乎無法再開發新產品。相反地，一些績優的紙業公司，例如舒潔（Scott）及皇冠澤勒巴赫（Crown
    Zellerbach），經由傑出的開發與行銷重要新紙品，大幅拓展自家業務，往後的數十年，都可望為股東創造良好報酬。戰後一長串的紙製品，出現龐大的人均消費，例如餐巾紙、紙巾、紙杯，尤其是牛奶與冷凍食品紙盒，都要歸功於舒潔及皇冠澤勒巴赫等公司的優秀管理階層。不過，隨著塑膠與合成紡織品的價格逐漸下跌，特色也愈來愈不相同，化學業給某些紙製品市場帶來的挑戰愈來愈明顯，包括拋棄式紙杯、某些冷凍食品容器和乾洗店的袋子。我們不妨仔細觀察
    1960 年代時，紙製品龍頭廠商，是否能抵擋它們自行研發的一些產品所面臨的挑戰，或是在不斷改善的合成紡織品之下，它們能否開創新領域的銷售管道，比如拋棄式紙製衣物。


    還有一個產業，近年來已大受矚目，但在 1960 年代的投資獲利機會不如戰後的前幾年那麼好，當然，我說的就是石油類股。在 1950 年代'
  merge: -1
  img_proc: true
- pgno: 293
  md: '結束時，最受到投資圈青睞的類股，莫過於石油股了。即使在 1958 年，各項法人持股資料都顯示，這些股票所受到的無比熱情毫無減損。這些持股清單通常顯示，石油股的占比超過所有其他類股，儘管基於先前解釋過的理由，這類數據並沒有很大的意義，因為類股分類的定義是很隨便的。


    然而，在這之後，金融界先前對石油股的熱情，被潑了一大盆冷水。理由有很多，卻不難發現，在美國，每年的石油需求成長率總是略低於預估。此外，未來還有兩項因素，可能導致預估成長進一步被削減：其一，是美國民眾對小型或「經濟型」汽車的意外喜愛，這些車每加侖汽油可跑更多里程。其二是其他燃料對工業與暖氣用途的石油，構成強大的價格競爭壓力。同時，隨著淺層及容易探勘的國內石油來源似乎已逐漸被發掘，替代淺層石油挖掘的成本已不斷升高，因為石油公司必須愈挖愈深。另外，國外業務也開始失去光彩，海外石油需求的年增率愈快速，以及海外發掘的盛產油田愈多，使得「國際公司」乍看之下，可以免於純國內產油商的弊病。但現在阿拉伯世界、委內瑞拉與印尼，都出現極端國家主義浪潮，這股浪潮往往伴隨著民間對「外國石油剝削者」的怨恨。最糟的後果，可能是直接沒收資產；最輕的情況，可能是大幅加稅。就這些狀況來看，許多熱切的投資人不免要開始懷疑，在銷售與獲利穩'
  merge: -1
  img_proc: true
- pgno: 294
  md: '定增加，而且地底石油蘊藏量不斷增加的支撐下，他們是否尚未大量買進這個過去 15 年漲勢最大的類股。


    對那些和我一樣，認為唯一值得持有的股票，是可以在未來數年提供超高成長前景的人來說，我認為有很重要的理由，去重視現階段石油股受到的嚴格評價。大多數石油公司獲利水準的最重要因素，是自家產品的價格水準，這個重要性遠超過在許多產業占有率的重要程度。因為愈來愈難（所以愈來愈貴）找到新油源，以及這個產業的薪資與其他成本不斷上漲，就像其他產業一樣，如果這些公司獲利要大幅成長的話，原油價格就必須進一步上漲。然而，全球各地不同地方發現的大量石油讓我相信，油價上漲不太可能是全球性的。以美國國內來說，既有的價格結構，大多取決於政府設定的進口配額與各州實施的配給，我認為，油價上漲會令政壇人士極為難堪。


    然而，假如目前的情況改變之後，可能導致石油股讓許多熱切的支持者極為失望，我相信，它們同樣也會讓極端的誹謗者感到失望。有些人讀到中東、拉美或印尼一些政客的極端言論，擔憂革命與當地政局，將造成美國大石油公司的龐大資產遭到沒收。大量石油蘊藏量雖然使得石油股沒有那麼吸引人，卻可為大多數產油國家提供長期的強力保障。伊'
  merge: -1
  img_proc: true
- pgno: 295
  md: '朗在 1950 年代中期試圖沒收石油資產的經驗，證明煉油廠裡的石油，並沒有多大的經濟用途。石油必須運送到遙遠的地方，只有大型公司才有油輪和靠近顧客端的儲油設施；最重要的是，只有它們擁有可以銷售石油的組織。況且，現在的石油太多了，如果任何國家或種族團體企圖阻止石油進入市場，缺口很容易便可由其他地方補足。自由世界的
    молекр國家，像是加拿大、委內瑞拉、印尼、阿拉伯中東和伊朗，不太可能永遠同步行動。同等規模的石油儲存設施，已開始在北非出現，拉美其他地區可能也會有。在這些情況下，在協商談判時，爛牌也不一定都在產油國手中，雖然暴民之類的隨時都可能取得控制，停止某個國家的石油生產，這些情況將帶來痛苦，不過只會是短暫的。


    然而，如果產油國並不是一手爛牌，它們也會有一些很不錯的牌。我猜測，1960 年代將看到最近的趨勢持續下去。緩慢但穩定地，這些國家的稅收（或是占總獲利的比率，這是相同一件事）將不斷增加。這表示，每生產一桶石油，石油公司賺的錢會愈來愈少（註③）。另一方面，全球石油需求成長，總產油量也將隨之增加。我進一步猜測，這兩種影響將相互抵銷。這表示，在近期的幾年，巨型國際石油股既不會像過去


    註③：編按：意指石油相關稅負愈來愈高。'
  merge: -1
  img_proc: true
- pgno: 296
  md: '一樣是鯨股，也不會如一些人警告般，構成投資危險的來源。


    如果我的猜測正確，表示恰好與一些美國最佳石油公司知名管理階層的看法相反，投資石油股的黃金年代已然結束。如果這個一度受到投資人喜愛的類股已經結束它的好時光，或許很快又會崛起另一類能源生產商——煤炭業，它們多年來一直被視為最不適合投資的產業之一，假如它們有眼光，而且擁有可以展望新局面的管理階層的話，或許隨著地表煤炭挖掘的機械化穩定進展，甚至是化學製程進步，不久將為一些煤炭公司開創新局。'
