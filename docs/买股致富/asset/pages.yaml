- pgno: 185
  md: '第 4 步，如果你早已持有一些證券，詢問納入考量的投資顧問，對你應該賣出或持有其中哪些股票有什麼意見。沒有人可以取得無窮無盡的背景資料，足以勝任各家交易所或店頭市場所有股票的專家。因此，當這些顧問在面對不是以前他建議買進的一批股票時，誠實的顧問通常會覺得棘手。他可能讓新客戶繼續持有名聲良好、但他不是很熟悉的股票；另一方面，他也可能會坦白告訴客戶，只能負責自己真正了解的投資，讓客戶決定是否願意把他們兩人都熟悉（而仍然可能是優良投資）的股票，轉換成或許不一定是更好的股票、但卻是該顧問可以明智觀察的投資標的。通常，坦白告知自己不知道事情的投資專業人士，才是徹底了解其他事情的人；假裝成萬事通的投資專業人士，可能是很危險的。同樣地，絕對不要期望一個投資專業人士可以對所有股票發表看法。如果你知道建議買進一家公司的股票需要多少了解，便不難看出理由。


    第 5 步，針對你在考慮的投資顧問，要盡量調查他的績效紀錄，刪除調查期間績效輸給大盤的人。此時，你要牢記，一些最成功的股票投資，可能要花上數年時間才會獲得市場認同，因此，盡可能忽略沒超過
    3 年的績效紀錄。另外，除非你跟他很熟，否則不要讓你在考慮的投資顧問提供績效參考。他為某些人操作的績效，必然會勝過其他人，這是一定的。人性使然，他會舉出操作績效超好的客戶供你參考。然而，如果你'
  merge: -1
  img_proc: true
- pgno: 186
  md: '# 第3章 投資人與金融業該前往何處？


    可以找到他已服務多年的客戶，他們的意見便很具參考性。接著，如果績效紀錄不好，但你對考慮中的那位人士及他的公司印象很好，不妨再深入了解一下。有時一名投資顧問的績效看起來不好，主要是因為客戶只是部分聽從他的建議，而不是完全聽從。因此，一些投資人犯下重大的金融疏失，無法抗拒小有獲利便出場，他們不聽勸告，貪圖股價上漲幾個點，在一檔好股可以漲
    3 倍或 4 倍前老早便賣掉，因此，他們沒有大幅獲利可用來彌補偶爾的虧損，這是任何一般股票投資顧問都無法避免的。在客戶不聽從建議之下，為此責怪投資顧問，當然是很荒謬的。


    打聽某個經紀商或銷售人員的紀錄比較重要，還是打聽他所屬的公司比較重要？這要視情況而定，有的投資公司極為嚴格管控它們員工可以推薦的股票。我認為，將來會有愈來愈多公司遵循這種政策。相反地，其他公司會設法讓它們的員工接收各種訊息，然後，讓每個人決定要如何應用這些資料。以以前者來說，公司的績效紀錄才重要，若是後者，則是個人績效比較重要。在大部分的情況下，如果你直接詢問，我相信，公司會如實告知你它們奉行何種政策。


    雖然我把「核對績效紀錄」列為挑選投資顧問的第 5 步，也就是最後一步，但或許應該把它列為第 1 步。我沒有這麼做的原因，是希望特別'
  merge: -1
  img_proc: true
- pgno: 187
  md: '強調立即刪除那些較在意自己能立刻從你身上賺到佣金、不在意你能否因為他建議而獲取重大利益的短視近利者。然而，若是你挑選合適投資顧問的第 1 步，是跟朋友打聽哪些人或哪些公司長時間提供良好服務，這是完全合理的。那些在這種調查中脫穎而出的人，就是值得進一步考慮的合理人選。在這種情況下，我列為第
    5 步的方法，或許應該改成第 1 步。


    我為找不到投資協助的人建議的步驟，可能引發一個較嚴厲的指責。儘管有很多著名投資顧問公司、股票經紀商和投資顧問，會以優異的成績通過這些測試，然而，我建議各位關注的那些重點，卻會讓大型投資顧問公司、股票經紀商和投資顧問取得特定優勢，這些大型機構較可能擁有對投資人最具價值的員工、公司董事會成員和投資消息管道。但這是否代表只有少數員工的小型本地公司，在投資業就沒有立足之地？


    面對這種指責，我個人是相當敏感的，因為我強烈認同我們國家必須保護小公司不受大公司壓迫，只要這麼做不會造成高到不行的社會及經濟成本就行。我以實際行動努力實施這項政策，而不只是說說而已。舉例來說，我習慣刻意繞路，去跟認識我的、會在我偶爾需要服務時照顧我的小型獨立銷售商購物，而不會用相同的價格，在大型連鎖店或百貨'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 投資人與金融業該前往何處？


    公司購買相同的商品。在另一方面，在其他領域，這件事就另當別論。很多年前，我為了支付一小部分的大學開銷，在空閒時間批發雜貨給很小的獨立雜貨店。經濟貧困地區一些價格高又不衛生的食品商店，被清潔又低價的連鎖商店取代，並不是純粹的罪惡，我認為，小公司是否值得在大公司之下倖存，應該在個別情況下單獨討論。


    就股票經紀商、投資顧問等來說，我認為最重要或最基本的考量應該是：哪一種體系，可以為你的投資人顧客創造最大利潤及最小損失？個人儲蓄因為無能或缺乏知識蒙受損失或賠光，而造成嚴重的社會災難與個人問題，這是任何其他基本標準都無法想像的。在今日情況下，大型投資公司，如果組織完善，或許擁有少許競爭優勢，因為它們負擔得起雇用更多專家去研究及追蹤投資，跟公司高層有更多聯繫等。然而，在我認為，投資業的不同公司，擁有的技能與效率差異頗大，大型公司現今的優勢太小，所以，現在有許多小型股票經紀商和投資顧問，還是做得比一些大型同業更好。


    當評估股票的藝術發展到成本更高、股票分析更有效率的下個階段，管理完善的大型公司當然會更壯大。投資業的各個方面，都將出現大量的購併，因為經濟的必要性，促使它們跨入許多其他業務。然而，即使'
  merge: -1
  img_proc: true
- pgno: 189
  md: '是這種時候，也沒有理由認為小型投資公司一定會完蛋；只要它們能發揮才智與準確的判斷，好好挑選其他地區的合作夥伴，就沒有問題。就好像今日的情況一樣，沒有事情可以阻止這些公司挑選不在它們自己地區的大型機構，成為它們的訂戶或發展其他合作關係。沒有事情可以阻止一些不同地區的小型獨立金融公司互相合作，為自己的客戶提供良好的投資服務。以挑選股票來說，2
    項日後證明成功的投資建議，遠勝過 10 項還好的建議，這個基本事實，是限制「大型投資公司通常具有優勢」的另一因素。


    在 1960 年代會發生麻煩的，不是小型投資公司，反而會是員工「太忙」、沒時間好好研究他們推薦股票的那種公司。很多時候，你會聽到「除了跟那家公司的一名主管打聽之外，我們根本沒有時間進一步調查一家公司。」在
    1950 年代的大多頭市場，這種方法通常已足夠「過關」。但大多數股票在 1950 年代上漲的程度，墊高了股價，使得 1960 年代這個時期需要更多調查與技巧，才能達成相同的滿意績效。忙到沒時間好好照顧投資人的投資顧問或投資公司，會發現
    1960 年代的投資氛圍，類似於年復一年種植相同作物、卻又「太忙」無法為田地施肥的農夫。


    或許各位已經注意到，這些評論當中似乎遺漏了什麼。我提到目前在'
