- pgno: 38
  md: '# 第十章

    預測1960年代的關鍵影響


    有時候，重大投資觀念的基本改變，會影響到許多普通股。通常在感受到這些新的影響一段時間之後，大多數投資人還是無法領會到它們真正的重要性。然後，當真正的意義趨於明朗，受到影響的股價便會產生劇烈波動。若能搶先在這種影響明顯反映在股價波動之前便領悟，投資人往往可以趁此大賺一筆。


    我們來看看1950年代的金融界，為適應新局面做出的兩項重要調整，檢視歷史上這類的調整，可以讓我們更加了解及預測1960年代即將發生的一些轉變。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '其中一個改變，是意識到 1/4 個世紀以來，在公司管理上的進步，已使得「藍籌」工業股具備真正的投資地位。大家很容易忘記，直到 1940 年代後期，大部分投資圈依然認為，無法承受大量風險的人，應該把他們的投資部位局限在債券、高級優先股，以及可能在一些公營事業普通股。當時大家的記憶仍停留在公司管理大部分屬於家族事務的年代，那些掌控公司的人可能很能幹，也可能完全不行。然而，隨著時間流逝，這些公司只有偶爾把權力下放，而且幾乎從來不曾想過建立管理的持續性，以符合外部股東的利益。在他們想起要培養接班人的時候，通常是基於準備要把權力交給某位受偏愛的年輕親戚，由他來繼續管理，以維持家族利益。公司主管通常是獨裁者，不論決策是好是壞，都是根據個人信念而來的。他們從沒想過要收集大量背景資料，或是請教各類外部專家，來為決策奠定更好的事實基礎。等到金融界終於領悟到，一些警覺性較高的管理階層已在指揮日常事務、做長程規畫，以及對外部股東擁有深度責任感等方面做出巨大進步，那些公司的股價終將大幅上漲，這幾乎可在意料之中。不過，較令人意外的是，透過徹底改善管理因素，而使得某些股票更具內在價值，居然在持續了很長一段時間之後，股價才開始明顯反映多年來的情況。


    我們再來考慮另一個可能同樣重要的新發展，使得某些類別的普通股'
  merge: -1
  img_proc: true
- pgno: 40
  md: '因此受到影響。愈來愈多公司注意到，透過在自然科學領域進行適當「研究」的方式，並用來開發、行銷無數新穎但相關產品，可以大幅增加公司的營收與獲利。再一次地，這些關於創新產品線的重要研發，在許多年前便已開始，及至
    1940 年代後期，這種趨勢已臻成熟，但卻要至 1950 年代，金融圈才廣泛體認到，公司掌握這門獲利可觀的管理藝術，具有重大的投資意義。到了 1950 年代，這些最有前景的公司，它們的本益比才開始確實反映這項特色。


    我相信，研究（與思考）1950 年代導致股價調整的「新」因素，可以得到兩項重要的心得。其一，那些搶在他人之前考慮到這類新影響的人，可以創造利潤（或是避免虧損）。其二，這些所謂的新因素影響很長一段時間之後，才會開始反映到大部分股價。因此，為了預測
    1960 年代一些類似的影響將對股市帶來的調整，並沒有必要去預測較長期的未來；相反地，只需檢視近期已發生的一些影響，相對應的那些股票或許尚未充分反映此影響，甚至也有可能是以錯誤的方式做出反應。


    # 影響力 1》 股票與通貨膨脹


    在 1960 年代（如同先前的 30 年），通貨膨脹進一步升高的威脅，'
  merge: -1
  img_proc: true
- pgno: 41
  md: '仍將對所有投資人都有重大的意義。然而，在 1960 年代，我相信對於持有普通股與通膨的真正關係，必然會更加明朗。因此，某些股票的價格水準，將與現今相當不同，現在就了解這種關係的人，未來將不致遭受龐大的虧損。


    因為這整件事在投資方面如此重要，我相信值得花時間來探究通膨的基本性質，然後再來討論它與不同類股間的關係。在了解通膨真正的起因後，投資人的基本觀念，便不會受到一些政治人物的武斷評論所迷惑。


    首先要考慮的就是通貨膨脹是什麼？儘管有許多複雜的定義，我也不認為，為了投資目的，有必要或最好納入複雜的定義。為了簡單實用，我們只需把通膨當成是：用相同的錢可買到的商品及服務總量卻愈來愈少，並且只有短期間會出現程度些微的相反狀況。這種情況，與美國史上大多數期間形成強烈對比，過去，在很多年的期間，當美元貶值、通膨之後，便接續出現差不多長的期間，發生物價水準下跌、美元同步升值的情況。


    關於通膨，投資人需要了解的第一件事，或許也是最重要的事情，就是：只要絕大多數美國民眾對政府職責的既定看法一直持續下去，通膨'
  merge: -1
  img_proc: true
- pgno: 42
  md: '愈來愈高是無可避免的。消除政府浪費與平衡預算，是遠大的目標，如果達成此一目標，而且沒有造成景氣大幅衰退，對降低未來通膨率便極有助益，甚至可能在一段時間內完全阻止通膨。然而，政治人物若是談到在當前的美國，靠這些措施可永久阻止通膨上揚，都只是空談而已。


    為什麼通膨一定會愈來愈高？因為在我們建立的經濟體系下，通膨種子不是在繁榮時期萌芽，而是在衰退的時候。大約 8 成的美國聯邦收入來自企業和個人所得稅，這個聯邦資金的基本來源，對景氣極為敏感，即使總體經濟只是溫和下滑，稅收也會急遽萎縮。


    然而，景氣惡化時就不是這種情況了，我們會實施各種法令，包括失業保險和農場救濟，使得景氣惡化的同時政府支出大幅增加，而這恰是聯邦收入最低的時候。況且，這些法律書籍明列的法令，必然只是嚴重景氣衰退發生時、政府資金特別支出的一小部分。看看美國國會在
    1958 年景氣溫和衰退時的措施，便可明白這點，馬上就有人提出提振經濟的各類提案，棄國家財政健全於不顧。這些提議包括大幅削減個人與企業稅負（以便擴張已經萎縮的購買力），以及設立組織提供特殊融資，給遭受景氣衰退打擊的團體，還有大規模擴大公共建設計畫等等。雖然這些提案大多沒有實行，但有趣之處在於未能實行的原因。兩黨幾'
  merge: -1
  img_proc: true
- pgno: 43
  md: '乎無人反對「假如確實需要終結衰退，便需執行」的這類計畫，但共和黨的立場是，反正衰退很快就會結束，不妨先保持觀望，如果預期中的景氣回升未能成真，「需要這類措施的話」，也只需要採取一些創造通膨的措施即可。


    1958 年的事件，證明當時的不景氣極為短暫，因此這類措施被實際執行者寥寥無幾，但對政黨政治稍有了解的人可能會懷疑，在較長的不景氣時期，我們的民選官員難道不會一致選擇數百億美元的年度赤字，讓選民不會再度經歷嚴重衰退的艱苦？就這方面來說，有人敢肯定地說這種產生赤字的做法，不是符合國家利益的正確做法嗎？我可以肯定的
    是，鉅額赤字必將造成更高的通膨，我們也能明確感受到物價大幅上漲將造成的不公平與艱苦。然而，這種不公平與艱苦，跟 1930 年代初期的大蕭條相比，對勞工與業主造成的痛苦與艱辛是一樣的嗎？


    無論我們每個人對這件事有何想法，一面倒的輿論早已替我們做好決定。如同我在《非常潛力股》（Common Stocks and Uncommon Profits）提到的案例，在
    150 年前，輿論不會認為政府的工作，是確保經常性的經濟榮景，就像政府不確保大家有幸福的婚姻。50 年前，輿論認為政府必須去做一些相對低廉的救濟措施，像是設立麵包發放處和'
  merge: -1
  img_proc: true
- pgno: 44
  md: '熱湯廚房，好讓大家不再挨餓。當時，輿論影響不大。在當年仍以農業為主的經濟，這些赤字根本不足以引發通膨。當然，聯邦所得稅當時仍不存在，就百分比來說，全國的政府稅收，並沒有像今日這般隨著經濟景氣走向而劇烈波動。


    我們得到什麼結論？在不久之前，官員及選民幾乎一致同意，認為政府的工作是保持經濟永恆的繁榮，這種看法是不太可能改變的。可惜，不景氣降臨時，政府唯一的藥方便是用超過稅收的大手筆支出，創造出足夠的購買力，以扭轉趨勢，但這也會造成更多通膨。為了換取享受自由民間企業體系的所有其他好處，偶爾的景氣下滑似乎是我們所必須付出的一部分代價；而以政府作為唯一雇主的國家，其人民所須付出的代價是生活水準下降、生產的商品減少及損失個人自由。因此，只要我們維持自由經濟體系的好處，意料之外的不景氣將會偶爾出現。只要我們是民主國家，而輿論維持目前論調，就會有愈來愈多通膨。


    不過，這個時候，我們需要考慮另外一件事，就像許多人誤以為不需要獨裁政權，也可阻止通膨一樣，更多人有另一種錯誤想法，他們以為由於通膨發展過程的內在因素，會使得通膨無可避免地不斷加快速度。通膨有時被比喻為馬匹，一開始緩步行走，最後卻危險狂奔，我們時常'
  merge: -1
  img_proc: true
- pgno: 45
  md: '聽到的形容詞——「奔馳」與「失速」的通膨，無疑是源於這類比喻。


    那些認為通膨必定會加速的人，他們的論調如下：一旦物價開始上漲，有遠見的人明白，通膨會對經濟前景造成影響。於是，他們開始在價格上漲之前，買進他們未來需要的物品。一旦需求增加，往往造成這些物品的價格上漲得更快速，漲價的速度愈來愈快，讓其他人警覺到通膨的影響，因此也開始準備未來的需求，這種通膨的惡性循環，便會不斷增強力道。消費者今日便去購買他們通常在未來才會需要買的東西，企業囤積庫存遠超過平常水準，以及投機者想在這種局勢中大撈一筆，這些都是造成通膨急升的原因。


    奇怪的是，就算面對各種相反的證據，許多很實際評估現有通膨壞處的人卻自己嚇自己，並完全誤導投資人，宣稱那些對我們現今無害的通膨，日後一定會失控變成惡性通膨。雖然多年來，這些人一直這樣預測未來的發展，而且至今可說完全錯誤，但他們的想法卻得到大眾的接受。這件事對投資人的重要影響，我待會將說明。但首先來看，為什麼這種「通膨將惡化」的觀點與實際情況正好相反？近年來，大部分企業界都認同通膨愈來愈高的可能性。然而，在企業界，我們找不到它們有任何傾向會在承平時期只因這點便增加庫存。相反地，我們發現企業界不斷'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 預測 1960 年代的關鍵影響


    設法削減庫存總量，理由不難察覺：維持庫存的成本太高了，只因為未來的物價水準終將升高便囤積存貨，太不划算了。


    想清楚了解這件事，我們不妨仔細檢視這些成本。首先，被過多庫存綁住的資金，原本是可以賺到利息的。如果手頭沒有閒置資金，則必須靠借貸來買入多餘庫存，這種成本甚至會更高。其次，還要計入倉儲或儲藏這些多餘庫存的成本，以及火災、竊盜或其他損失的保險成本。接著，還有地方不動產稅，不論在一年中何時持有這些庫存，地方政府皆會課稅。最後，就某些商品來說，可能因為時間流逝使商品實體受損，或是有些商品因為潮流風格或技術的改變，導致商品變得沒價值的危險。


    基於這些理由，即使美國自二戰以來便有通膨以及對通膨抱持警覺，卻找不到任何傾向顯示企業會以囤積商品庫存作為通膨避險之用。這種偶爾發生的預先買進，幾乎都是出於擔心物資短缺（如同韓戰初期），或者，擔心特定商品價格上漲，但從來都不是因為擔憂通膨。有時，即使特定商品即將溫和漲價的消息已經宣布，也不會刺激企業預先買進，因為與負擔庫存的費用相比，漲價的幅度微不足道。


    這並不表示一戰爆發沒多久，德國與法國便發生通膨急遽升高的情形'
  merge: -1
  img_proc: true
- pgno: 47
  md: '不可能在美國出現，美國也可能發生這種情況。然而，這種情況若要發生，首先通膨必須大幅度加速，而在真正發生前，應該會有許多預先的徵兆。況且，基於先前討論過的原因，如果真的發生這種通膨加速，也會是在經濟衰退時，而非經濟繁榮的時候。在這種時候，通常有很多逢低投資普通股的機會，這對投資人意義重大，因為這表示當股價高的時候，投資人不必為了擔心通膨將侵蝕資金價值，而急著把閒置的資金投入股市。


    那麼，什麼是通膨的真正速度？沒有人可以完全肯定說出每年通膨成長的速度到底有多快（也就是相同的金額所能買到的東西減少了多少），這是因為用來衡量通膨的各種指數，沒人能確定不會存在一些誤差。但美國勞工統計局的消費者物價指數（CPI）在編製時十分用心，或許最接近能正確衡量如此複雜的事情。從
    1950 年 1 月 1 日到 1959 年 12 月 31 日的 10 年間，CPI 顯示每年通膨平均成長率略高於 2%。我們假設，這項指數衡量物價波動的誤差幅度高達
    50%（儘管這非常不可能），就算這樣，我們每年物價平均才上漲 3%。


    這件事對投資的意義應該顯而易見，然而投資人時常無法理解。它的意義是，從長期來看，通膨是一股必須處理的強大力量，任何投資如果'
  merge: -1
  img_proc: true
- pgno: 48
  md: '無法至少每 10 年增值 20% 至 30%，都可視為差勁的投資。


    另一方面，許多投資人誤會的一點是，即便現金、債券和許多種類的股票，天生不具備抵抗通膨的特性，但單憑這點，不代表我們應該一有機會就拋售這類資產，而轉去投資合適的股票。在任何一年，現金的實質價值最多可能縮水
    2% 到 3% 的範圍（註①），這約略相當於現金（稅後）目前所能賺到的利息所得。這表示，如果忽略利息因素，在 4 年內，現金實質縮水不超過 8% 到 12%。然而，在任何一年，最理想的普通股價值波動都會遠超過
    3%，而在 4 年期間，股價波動會是 8% 到 12% 的許多倍。


    聰明的投資人應該用正確的觀點來看待通膨，長期來看，我認為投資人的目標應該是：若無法保證該筆投資，至少增值到足以彌補資金購買力因通膨而縮水的幅度，就不該去做。但短期來看，投資人更要明白，選擇合適的投資標的，並在合適的時間買進，遠比快速得到通膨保障來得更重要。反過來說，當投資人已預留一定金額作為特定用途，並準備在幾年內動用這筆資金（例如，蓋一棟房屋或帶家人去海外旅行），我


    註①：編按：因為通膨每年約為 2% ～ 3%。'
  merge: -1
  img_proc: true
- pgno: 49
  md: '認為，他應該要把這筆錢以現金方式持有，不必試著進行通膨保障的投資。如果他已購買某種通膨避險商品，等到他要動用現金時，或許該金融商品的價格下跌幅度，已遠超過他原本儲蓄的錢在這段期間可能因通膨而減損的微小幅度。


    為什麼那麼多投資人在這個注意通膨的時代，對持有大量現金感到驚懼？他們急於進場投資，卻一點也不願意花時間找尋真正理想的投資機會。有時，這或許是沒耐心或不成熟的人顯露的跡象。然而，在很多時候，我相信他們的行動背後有一個特別的原因：他們毫無質疑，便接受一種普遍的謬誤，也就是認為通膨必然將加快速度，因此，處置現金或類似部位的速度，就變得極為重要。


    由於太常聽到了，我很清楚許多思考周密的人，這時會對我的基本結論提出反駁。他們會說，我主張唯有在戰爭造成政府赤字或景氣蕭條時，才會發生通膨大幅上揚（因此不急於進行通膨避險），我的這種論調，完全是基於通膨是由貨幣基礎擴張造成的。他們認為，事實上，物價穩定上漲是其他原因造成的，那就是我們的法律，賦予工會的不公平經濟優勢，藉由給予單一組織獨占的權力，可為所有產業提供迫切需要的勞工或不提供勞工，這些工會掌握的權力，是其他企業界所無法匹敵的，'
  merge: -1
  img_proc: true
- pgno: 50
  md: '這導致工資大幅上漲，企業別無選擇，只能讓薪資上漲，再以調漲產品價格的方式轉嫁給大眾。他們認為，比起景氣壞的時候，這股力量在景氣好的時候，將推動通膨不斷增加。


    我大致上認同這種說法，但我認為這只是全景的其中一部分而已。雖然貨幣供給增加才是造成通膨的直接原因，而非因為薪資上漲，但這兩者基本上是同一件事。這是因為當薪資上漲的速度，超過生產力上漲的速度時，公司主管只能把大部分或全部薪資上漲的成本，用調高產品價格的方式轉嫁出去。原因是，所有的企業利潤平均只占每
    1 美元營收的幾美分而已，但薪資總額卻是企業利潤的許多倍，除了調漲產品價格，公司絕對沒辦法吸收薪資上漲。其次，政府也早晚會落到別無選擇的地步，政府可透過聯邦準備體系來「批准」薪資上漲，政府透過擴大貨幣供給帶動物價上漲，讓民眾可以在最近一波薪資上漲後，也能購買到以往的商品數量。然而，政府也可以拒絕「批准」，而把貨幣供給維持在以往水準。若政府拒絕「批准」，就不會有足夠的貨幣作為支撐，在較高的物價下，民眾便無法買到以往的商品數量。那麼，景氣便開始走下坡。這些管控國家資金的經理人若不扭轉他們的政策，景氣衰退便會加深。接下來，聯邦收入開始減少、支出增加，產生可觀的赤字，政府因而必須擴大貨幣供給，最終，薪資與物價的連袂上漲，還是獲得了批准。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '幸好，現在還有另外一股強大的力量幾乎跟大型工會同樣有力，而且對物價結構形成正好相反的作用。它就是近年來科學研究與產業發展的驚人成長。企業主管、科學家與工程師的團隊合作，創造巨大的利潤，這個被哈佛大學教授薩姆納·施萊希特（Sumner
    Schlichter）貼切形容為「探索的產業」（Industry of Discovery），正以驚人速度在成長，過去6年已成長3倍，目前每年資本支出約為90億美元，這跟30年前僅數百萬美元的資本支出相比之下，這可說是直線成長。


    我們很容易想見龐大的工程師團隊對物價結構的影響力，他們藉由新機械與新方法不斷設法讓物品價格變得更低。另一類龐大的研究人員團隊，他們的工作無法輕易量化，因此有時會被我們忽略，他們的工作對物價結構的影響力是讓物品變得更好。舉個例子來說明這點，假設現在輪胎的價格跟35年前相同，以前的輪胎很常會被刺破，現在輪胎很少被刺破。其次，當年每個輪胎可使用的總哩程數，即使使用慢速行駛，也不到今日標準的一小部分而已。因此，以包括維修的總成本來說，輪胎價格已大幅下降。


    這個不斷成長的「探索的產業」，使我們得到一股物價的反作用力，它讓物品變得更低價的傾向，平衡了薪資上漲造成物品變貴的大部分力'
  merge: -1
  img_proc: true
- pgno: 52
  md: '量。研發支出與創造更低廉、更優質產品的成果之間，存在很大的時間差，由於研發支出穩定成長，我們可以確信未來會有相同的成果上升曲線。因此，我們可以確信這個趨勢，對於降低物價的影響力只會增強，不會減弱。這正是何以我相信通貨膨脹雖然不會停止，但是這個強大的「煞車」可以削弱通膨勢力。除了鉅額赤字引發經濟衰退的特殊情境下，其他時候，投資人都可以慢慢地找尋良好投資機會，投資人無須因為害怕通膨速度將加快，而覺得必須在一碰到有通膨避險的機會時，便急忙投入。


    投資人一旦了解通膨必然將愈來愈高，很自然地會把心思集中在問題的核心：在通膨的世界裡該如何配置資金？不過，在此之前，我認為還有一個基本事項，在提到何種資產配置最適合
    1960 年代最有可能發生的通膨之前，投資人若先了解這件事，將可獲利良多。


    接下來，我要談的這件事挑戰一個全球公認想法的正確性，就是因為太多人沒有多加思考，便相信某件事是真實的，才會讓人覺得該件事不可被質疑。針對這些人，我要指出一點：歷史已經證明，在各個年代及各種人類知識領域，許多幾乎被大家認定為事實、懶得再去思考的看法，都已證明是大錯特錯。人類經歷幾個世紀的文明，才知道地球繞著太陽'
  merge: -1
  img_proc: true
- pgno: 53
  md: '運行，而不是太陽繞著地球轉。直到上一個世代，即使是學識淵博的科學家都會嘲諷，「最堅硬的物體幾乎是完全空洞的空間」這個說法，但現在，我們知道這是真的。你還記得嗎？以前人們說孕婦要一人吃兩人補，但我們現在知道，這是很不理想的習慣。由於某件事被認為理所當然，甚至連掌握權力、備受尊重的領導人，都據以擬定他們的政策，但即使這樣，這也並不會讓錯誤的事變成正確的。


    在現代，幾乎所有銀行家和許多政府都認為，對抗通膨的方法是調升利率。假如在我們這種慢速通膨的情境下，人們的行為是像理論經濟學家對應傳統通膨觀念中所該有的舉動，或者像在快速通膨時人們確實採取的那些行動，升息便可以有效遏阻通膨。傳統觀念認為在面臨通膨預期時，商人、消費者和投機者會爭相囤積他們現在不需要、但認為日後會漲價的東西，這會造成價格愈漲愈凶，直到許多物品被過度囤積及過度購買，這種榮景才會破滅。這類額外購買，大多是以信用或融資進行的，因此，拒絕提供更多信用，藉以提高這類資金的成本，便可阻止這種危險的進程，而成為真正抑制通膨的措施。然而，因為在真實情況下，這些人並沒有進行不必要的採購或預先購買，此時若採取調升利率的做法想遏阻通膨，反而像是拿治療肺炎的特效藥，去治療進食過量而不舒服的病人。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '投資的時機選擇非常重要，因此我們不妨先仔細討論升息的真正效果。首先，我們來看看央行是怎麼說的。要記得，這些人是掌握權力的人，因為他們可以控制銀行信用的供給，能對貨幣利率施加巨大影響力。


    他們說，調漲薪資會增加通膨，加薪會增加經營企業的成本，進而把這些增加的成本轉嫁給消費者。另外，調漲原物料、製成品或服務的價格，當然也會增加通膨。這不僅會直接影響相關產品的成本，還會升高購買這類產品或服務的企業的經營成本，進而推動其他產品的價格也上漲。但我們的央行官員卻說，調高資金成本可以減少通膨！我們須知，企業必須融資才能持續營運及成長，而調高資金成本會增加經營企業的成本，資金成本被調高，就像企業營運所需物品漲價一樣，央行卻說升息能降通膨，這說得通嗎？


    奇怪的是，在特定情況下，還真的說得通，只可惜，這類情況正好跟美國經濟的正常運作狀況有極大的不同。我們來看看所謂的特定狀況：假設我們的經濟需求接近經濟總產出，幾乎所有主要產業的產量，已是它們工廠所能生產的最大數量。再進一步假設，例如說鋼鐵的實際消費量並沒有像市場上的需求量那麼大，鋼鐵廠的過度生產，其實不只是為了生產足夠的鋼鐵，以滿足美國的實際需求，同時，也是為了拿來興建'
  merge: -1
  img_proc: true
- pgno: 55
  md: '更多鋼鐵廠，以因應預期中的需求，也就是鋼鐵業被要求供給足夠的鋼鐵，來滿足當前的一般需求，以及計畫中的新建鋼鐵廠。在這種情況下，收緊企業融資，可以達到兩種成果，一則可以延緩新鋼鐵廠興建的速度，並把多餘的鋼鐵需求延後到未來，進而延長榮景。更重要的是，這可以強迫大多數公司接受它們能持有的最低鋼鐵庫存，並維持營運。這麼一來，或許可以預防所有鋼鐵業顧客祭出更高價格，從鋼鐵廠搶購更多鋼鐵造成的鋼價失速暴漲。在這種情況下，而且唯有在這種情況下，高利率及所謂的「緊縮貨幣（註②）」（tight-money），才能有效抑制通膨趨勢。


    然而，在 1960 年代，美國經濟與前述個案非常不同。除了在面臨產業罷工時，大多數主要產業的開工率介於 70% 到 90% 之間，幾乎各個地方都有閒置產能。有數百萬人失業，至今可能依然如此。最重要的是，產業界現今考慮中的新設備與機械計畫，是那種在利率低的時候大量獲准，但在利率高時被大幅削減的計畫，它們大部分都不是為了擴大新產能；相反地，它們是為了把老舊設備更新。這些計畫會以更低的單位成本生產，通常是用新機械及更好的製程，替換老舊機器與老舊製程。


    註②：編按：即升息。'
  merge: -1
  img_proc: true
- pgno: 56
  md: '最能抑制通膨率的，莫過於上述這件事，這是一項雙刃的抗通膨武器。

    一方面，透過協助產業界，以低率借貸進行許多這類現代化的產能更新計畫，產業界得以降低成本。由於我們競爭體系的正常運作，節省下來的成本通常會回饋給消費者，雖然有時候，回饋方式是由產業自行吸收員工的加薪成本，因此不必去調漲產品價格。另一方面，這些現代化計畫為產業帶來更大量的訂單，足以擴增所有企業的訂單量，同時促使薪資調漲，這必然會明顯改善目前依賴企業及個人所得稅增減的聯邦預算。


    我們現在應該明白，「緊縮貨幣」無法達成減緩通膨的目的。它反而會誘發動力，遲早會加速通膨。我早已試著證明，藉由不斷設法研發更低廉的方法生產出更優良的產品，已成為延緩通膨進程的一股強大力量。然而，由於所有降低成本的研發計畫幾乎都需要資金，產業界是否採用，將直接受到貨幣市場的影響。當資金成本高、很難借貸時，大多數企業被迫只能採用研發工程部門最傑出的成果，其他的優秀計畫往往被延宕或放棄，因為無法取得這些計畫所需的資金，或是成本太高、難以負擔。所以，為了預防通膨而調升利率，反而抑制降低生產成本及降低價格所需要的企業活動！


    緊縮貨幣造成通膨愈來愈高，但緊縮貨幣並不是唯一或最基本的掣'
  merge: -1
  img_proc: true
- pgno: 57
  md: '因。我也曾試著證明通膨的基本原因是來自景氣衰退，因為景氣嚴重衰退時期，必然造成赤字融通大幅增加，不論是遠到 1930 年，或是近到 1957 年，每當聯準會大幅提高利率，都會對景氣形成相同的效果。產業抑制資本支出，房屋營建及其他主要產業都會受到波及，在這些產業，融資成本對最終消費者價格的影響很大。這些容易受景氣影響的「搖擺」（swing）產業的衰退，逐漸傷害到其他產業，全面性衰退就會發生。自從
    1930 年代的大蕭條以來，每次不景氣都導致聯邦赤字大幅增加，以及更高的通膨滲入經濟之中。


    如果我花了太多篇幅來說明高利率的影響，那是因為我認為高利率對投資人的意義，遠超過大多數人所了解的。儘管投資人應該永遠謹記，通貨膨脹有很高的機率會愈來愈高，但是在一般時候，通膨十分緩慢，投資人應該慢慢挑選好的機會，而不必盲目地進行通膨避險。然而，當貨幣利率開始上揚，基金經理人似乎也贊同利率上升，此時，規則就有些不同了，投資人這時應該比平常更加謹慎，因為景氣可能就要反轉向下。了。即使沒有，考量到收益率的因素，也可能造成股票跟隨債券一同下跌。這不表示投資人在這段時期要暫停所有買進（你絕對不能為了近期因素，就放棄真的很好的投資機會），而是表示投資人應該對買進標的更加挑剔。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '然而，在緊縮貨幣持續一段時間之後，情況便會整個改觀。使用提高利率來對抗物價上漲，央行官員就像身體感染危險病毒的人，決定以不吃東西來餓死病毒。早在病毒被消滅之前，這個人就會先餓死自己。此外，就像大多數人一樣，聯準會通常在飢餓措施導致身體愈來愈痛苦時，便會放棄嘗試，政策轉向。投資人通常無法明確知道這種改變何時會發生，但飢餓期持續得愈久，聯邦赤字不斷累積，資本財與建築業受創，待政策大轉彎之後，很有可能爆發另一波通膨大增。因此，累積赤字的時期愈久，投資人便更應積極確認自己的股票是否適合作為可對抗通膨的長期部位。


    哪一種部位可以提供通膨保障呢？我認為，過去 10 年的天真想法，將在 1960 年代猛然覺醒。人們普遍認為，幾乎所有代表資產所有權的普通股，都可以作為通膨避險，這徹底錯誤。就過去來說，只要看許多持有鉅額資產的公司，在過去
    15 年、物價不斷上漲期間（美元購買力因而不斷縮水），其股價並沒有上漲，許多甚至大幅下跌，即可輕易證明。單憑這一點，便可駁斥一項大家公認但似是而非的論調：「股票代表實體所有權（例如土地、工廠、庫存等），在通膨來臨時，東西的價格會上漲，透過持股來持有這些東西，可保障股東不受到美元價值縮水的影響。」'
  merge: -1
  img_proc: true
- pgno: 59
  md: '許多投資人進一步詮釋這種論調。他們宣稱，擁有大量地下天然原物料的公司，例如礦業和石油公司，是理想的通膨避險。隨著美元價值縮水，這類實質資產的所有權將大幅增值，因此，這類公司的股東便得到保障。基於我接下來將解釋的理由，其中一些公司可能是很值得的通膨避險標的。不過，這是出於完全不同的因素，不是因為這些公司正好擁有大量的實用原物料。在
    1958 年和 1959 年，許多以前樂於持有石油公司的股東，開始理解到這件事。


    如果我們牢記一個基本觀念，便可以避開這項常見的謬誤，也就是「因為股票代表實體所有權，它們在本質上便可提供我們通膨避險」。就整體物價水準來說，相對於其他物品，我們購買的物品價值總是在波動。即使整體物價水準穩定（但緩慢地上揚，在這種龐大且類似冰河的運動當中，還是有一些東西的價格上漲，而其他物品跌價。在不斷發明及發現新製程的時代，有時可以大幅削減生產成本，一些產品的跌價可能很可觀。同樣地，大眾喜好的改變，也可能導致相關產品或服務的價格明顯增加或下跌。


    為了說明這點，我要舉一個極端個案，有人或許認為這太誇張。不過，我認為，股票投資人如果想避免在通膨時期買到錯誤股票的常犯錯誤，'
  merge: -1
  img_proc: true
- pgno: 60
  md: '便應該謹記這點。而且，我們舉的例子，會是當代世界見過的最極端通膨。1920 年代初期的德國，當時的德國馬克（一戰之前的匯率約為 25 美分）變得一文不值，有一度
    10 億馬克還買不到一條麵包。許多德國人了解情況之後，竭盡全力把貶值的資金兌換成實體物品。假設有個人為了通膨避險，而買了一倉庫的褲撐（註③）。1890 年代，基於我無法理解的理由，當時的女性喜歡偽裝（抑或強調）她們身體的某個部位，囤積褲撐可能是很好的投資，那個時期，這項商品很有價值。然而，到了
    1920 年代，由於劇院服飾走紅，褲撐變得毫無價值，無論價格高或低的群撐，也不管是用大家預期的、很快就要變成廢紙的貨幣報價，都沒有差別。沒有人想要褲撐，褲撐這項實體物品在
    1920 年代完全不具通膨保障功能。


    現在，我們來談普通股。除了公司即將清算之外，每一股股票背後的資產價值，跟股票市價其實沒什麼關聯。理由主要是，除非資產即將發放給股東，資產的作用在於它創造的收入，或是金融界預估它們可以賺進多少。如果你懷疑這點，想要確認，我們不妨進行一個簡單的測試。紐約證交所（NYSE）的上市股票，是按照字母順序排列的。在名單上


    > 註③：用硬挺衣料裁製而成的褲撐，放在裙子底下可以改變裙子的外型和下襬，使裙子蓬鬆鼓起。'
  merge: -1
  img_proc: true
- pgno: 61
  md: '任意點選一個位置，然後研究之後的 20 檔股票，你會注意到，不論你剛好選到什麼類股，股價與資產價值都沒有關聯。有的股票價格與資產價值之間出現大幅折價，有的股價卻是資產價值的許多倍，它們之間一點兒關係也沒有。如果這點仍無法說服你，我們再來做另一種測試。雖然現在已不像多年前那麼常見，股票經紀商偶爾會發行快報，告訴人們注意某些因帳上資產很有價值而值得逢低承接的股票。去找一份幾年前發行的快報來看，我們可以回顧這些股票後來的波動，來跟大盤指數做比較。你會發現，公司擁有許多資產，跟股價的表現沒有什麼關係，這些資產未必會在通膨時期增加價值。光是持有資產這一點，是不足以讓股票價格大幅上漲的，資產價值並沒有能力推升股價上漲。


    真正推升股價上漲的兩個因素，是密切相關的：其一，是公司的獲利能力上漲；其二，通常也是較為重要的，是投資界對公司未來獲利能力的看法。這兩個因素密切相關的理由是，金融圈往往認為，由於某家公司的每股盈餘年復一年穩定增加，這種趨勢將可在未來持續一段長時間。撇開景氣循環的短暫影響，這種邏輯通常很正確，但有時也可能錯得離譜。不論是任何速度，每股盈餘的穩定成長，才會造成本益比穩定上升（隨著金融圈愈來愈看重某檔股票），這才是成長股價值大幅增加的主因。這種組合在貨幣穩健時，可為投資人創造最大增值；在貨幣貶值時，'
  merge: -1
  img_proc: true
- pgno: 62
  md: '也可提供最大的通膨保障。


    換句話說，不論是哪種通膨狀況都會大漲的股票，才是唯一可以保障投資人資產不受通膨影響的股票。這不是因為普通股與通膨避險之間，有任何根深柢固的關係，它們之間並不存在內在的關係，這完全是一種巧合，也就是這些公司的營運良好，使得股價增值的速度，等於或高於通膨侵蝕投資人資金價值的速度。這表示投資人的實質資產，可以保住原本會被通膨侵蝕的部分。如果在大部分金融圈了解到某家公司的吸引力之前，便搶先買進這種真正的潛力股，就表示在我們經歷的這種慢速通膨之下，股價上漲會超過資金貶值，因此，在通膨避險之外，投資人還可以獲得可觀的實質獲利。


    換句話說，挑選真正可提供通膨保障股票的原則，就和我在《非常潛力股》一書説的一樣。你要找尋的公司，是擁有能幹的主管、利用研發或其他方法，年復一年增加每股盈餘的公司（扣除每年景氣循環的暫時波動）。要確定公司主管決心維持這種成長，並培養年輕主管，讓他們接受相同政策的訓練，以保障這種成長。然後，如果你能搶在大部分金融圈了解到這點之前，買進這些股票，之後只要公司政策不改變，不論股價漲到多高，都選擇長期持有。這麼做的話，你便可以得到真正的通'
  merge: -1
  img_proc: true
- pgno: 63
  md: '膨避免，以及理想的獲利。在大家都了解到這些公司的特質之後，才買進股票，或許仍可獲得通膨避免，卻不會有很多獲利。相反地，買進平庸公司的股票，尤其是在大家搶著炒高所有股票的價格之際買進，或許根本無法得到任何真正的保障。


    許多人問說：「如果大多數股票無法提供充份的通膨保障，至少可以提供某些保障吧？」畢竟，我們的通膨往往讓景氣不好的時期縮短，而且可能在景氣好的時候刺激經濟活動。這難道不會幫助所有股票創造更多獲利能力嗎？這種獲利能力難道不會創造更多實質價值，足以部分抵銷資金縮水嗎？


    我認為，還沒有足夠的證據，可以給上述問題一個肯定的答案。然而，我傾向於認為，隨著進入1950年代，以及投資圈普遍認為，普通股（單純以普通股來說）是通膨避風港，大家太過重視這些事了，這是因為投資人忽略了這個情況的另一面，也就是通膨對普通股既造成傷害，但也有助益。


    隨著物價上漲，達成相同營業額的必要成本也隨之增加。假設一家公司營運已很有效率，只需要最小量的庫存，便可迅速滿足顧客需求，每'
  merge: -1
  img_proc: true
- pgno: 64
  md: '次物價上漲，就表示該公司必須花更多錢，才能維持相同的最小量原材料、半成品和製成品。記住，除了在會計幻想之外，這並不是一項流動資產。這是公司必須永遠負擔的永久性增加投資，因為公司必須保持這種最低库存，才能維持既有的地位。相同地，隨著物價上漲，更多資金會鎖死在應收帳款，用來維持相同的業務，而不是投注到更多業務上。最後，也是最重要的是，廠房與設備造成的金融負擔。要記得，有的機械與建築物的使用期限較短，其他的使用期限較久；不過，它們都是會老舊的。一家公司能採用的設備折舊率，取決於稅捐機關對每項物品使用期限的估計。然而，我們古老、相當不公平的折舊法規允許的折舊率，只能讓一家公司回收這些資產最初的成本，而不是更新設備所需的成本。因此，在通膨時期，所有公司都面對廠房與設備的常年金融負擔與損失價值。這相當於一大筆金額，也就是這些物品折舊後的帳面價格，以及更新成本之間的差價。


    以普通股股東的觀點來看，這種通膨導致的財務耗損，只能仰賴一種保障，那就是可以穩定創造獲利的傑出企業主管。而這種獲利增加，通常來自擴大既有業務，或是開創相關產業類別的新業務。這類獲利成長必須足夠龐大，才足以在通膨時期滋養業務；因為除了要為舊有的業務提供更多資金，還有為新業務提供資金的問題，這需要能力超強的企業'
  merge: -1
  img_proc: true
- pgno: 65
  md: '主管，以及挑選合適擴張時機的卓越判斷，擁有這種主管的公司，通常正是在通膨時候最值得投資的那種公司，這也是為什麼主管平庸的公司股票，不太可能提供通膨保障的原因。


    隨著 1960 年代展開，我相信，了解這一點，在未來幾年通膨對財務衝擊加劇時，對避免可能造成虧損來說，是非常重要的。在 1940 年代及 1950 年代初期，所有指向通膨必然升高的指標變得十分清晰，就像過去
    10 年一樣。然而，由於某些因素，直到幾年前，許多投資人都還沒有看到這些跡象。然後，在 1956 年到 1957 年，以及 1958 年到 1959 年，原本對這件事不甚關心的數百萬投資人，突然開始對通膨產生集體恐慌。在經濟基本面絲毫沒有改變，以及通膨並未比多年前變得更危險（或更不危險）之下，他們表現得好像若不立即買進普通股（任何普通股都好）作為保障，自己的資金將被一掃而空的樣子。結果是全體普通股報價和本益比急遽上升。有些股票真的可為通膨上揚提供保護，但其他股票因為情況發展影響到它們未來獲利能力，要不是無法提供充分保障，就是完全沒法提供保障。


    那些在 1956 年到 1959 年間湧入股市，首度買進普通股的富裕人士，大多可視為真正的長期投資人，而不是投機者，他們是真心擔憂通膨。'
  merge: -1
  img_proc: true
- pgno: 66
  md: '他們因此不再喜歡免稅的市政公債，以及這類免稅債券（可為富裕投資人帶來日益增加的稅後淨收入）。他們買進普通股，有時甚至不顧價格。他們把股票鎖進保險箱，以為自己將不會受到通膨升高衝擊，還有不論他們在什麼價位買進，個股價格都必將在通膨時期大漲，並對此感到一陣安心。


    我相信，這導致的一種情況，值得1960年代初的精明投資人密切注意。我這麼認為，是因為我覺得可以合理認定，這些富裕的股市菜鳥，或許不乏在其他領域具有傑出能力，卻是投資智商較低的人。否則，所有的通膨跡象，都至少跟10年前一樣明顯，他們應該不會那麼長時間專注在難以抵抗通膨風險高的免稅債券，也不會那麼迅速且盲目地接受這樣的說法：不管價格高低的任何股票，都能提供通膨保障。


    我認為，以下的情況很有可能發生：這些新近受通膨刺激而買進普通股的人，有很多可能表現得像是一輩子都住在地底，不了解天體運行的人。晚上8點整的時候，你帶這個人去看月亮，你告訴他，入夜之後，月亮會跨越整個天空。他充滿興趣地看著月亮，但看不到月亮移動，於是，他一直盯著看。8點1分，月亮似乎動也不動；8點2分，他還是沒看到移動；8點3分，仍然看不到什麼改變；到了8點4分，他厭倦'
  merge: -1
  img_proc: true
- pgno: 67
  md: '地放棄了，因為什麼都沒有改變。他覺得應該善用自己的時間，做點別的事還更有好處。然而，凌晨2點時，如果他回來，就會看到跟8點4分他放棄時很不一樣的改變。


    我認為這種情況，很可能發生在許多最近因為通膨而持有普通股的人身上。經過數月，或是數年，以通膨目前的速度，自他們買進普通股之後，還是很難看到通膨構成一股強大的力量。他們的情緒會達到上述8點4分的狀態，他們會受到「通膨真的不重要」這種普遍感受影響，就像他們買進股票時，是受到「自己沒有得到保護」的群眾恐懼心理影響一樣。如果這種情況發生，而且可能就發生在最需要通膨保障的時候，1960年代不必過多久，群眾一旦開始撤離普通股，就可能成為短期的重大影響。


    對機警的投資人，這種可能性開啟兩條可立即採取行動的途徑。現在，許多普通股的市價，用過去的標準來評估似乎太高了，他或許可以重新審視自己的持股，剔除任何沒有特點的投資。另一方面，如同我在《非常潛力股》一再提到的，縱使真正傑出的股票股價有可能暫時偏高，投資人也不能因此就賣掉這些股票。這個狀況有太多可能，像是：1.
    預期中的股價下跌反應不會發生；2. 如果確實發生了，投資人會看著股價進'
  merge: -1
  img_proc: true
- pgno: 68
  md: '一步下跌而不敢進場，直到股價又回到更高水位；3. 等到市場開始反映通膨因素時，股票將持續大漲，即使短期下跌，日後股價也會高於現今的水準。


    等到投資大眾終於從「任何股票都是通膨避險」的想法中清醒過來，便會替機警的投資人開啟另一條行動途徑。總是很難找到的、真正的成長公司，至少會暫時因大盤賣壓而下跌。如果這種賣壓確實發生了，便可能成為真正可提供通膨保障股票的稀有買進機會。在一般、正常的大盤拉回，所有股票都會大跌，但唯有真正好的股票之後會強勁反彈，並締造歷史新高。


    總體來說，我認為很有可能到了 1960 年代結束時，投資大眾都會認同這樣的看法：通膨無可避免地將不斷升高，以及任何投資最重要的考量就是通膨避險。然而，我想等到那個時候，投資人對保護自己的股票投資，將有一定程度的嫻熟，這是今日無法想像的。但不是任何股票，而是只有在非通膨時期表現異常強勁的股票，才會被視為真正可作為通膨保障的股票。大家會明白，貨幣購買力下降與推升股票上漲之間，並沒有直接關聯。同時，大家也會明白，除了經濟衰退時期，股票無論如何可能會出現低價之外，沒有什麼急於買股票作為通膨保障的理由。挑'
  merge: -1
  img_proc: true
- pgno: 69
  md: '選及買進正確的股票，是最重要，且而且現金的實質價值縮水極為溫和。因此我們有充分理由相信，等上好幾年，出現合適的投資標的才買進是必須的。然而，投資大眾對這個主題要達到一定嫻熟程度，進程既不簡單，也不是沒有痛苦。在
    1960 年代初期時，有一段期間大家可能會對「所有股票都可作為通膨避險」這個觀點感到相當挫敗與覺醒。警覺的投資人，不妨檢視自己手上的持股是否原本不具吸引力，只是因為大家誤認它們可以作為通膨避險，才達到異常高的市價。之後，如果真的發生投資大眾清醒的時期，他們或許可以趁機買進一些極具吸引力的股票。


    # 影響力 2》 法人買股


    股市裡的法人買進，主要有五大來源：1. 年金與分紅基金；2. 私人受託人，主要是大型銀行的信託部門；3. 投資信託；4. 保險公司；5. 教育及慈善機構，包括最富裕大學的大型交易。


    這些法人買家對股票影響的重要性，並不是 1960 年代獨有，就像我們先前談到的通膨影響力一樣，並不新穎。跟通膨一樣，差別之處在於投資人逐漸意識到這種新影響的真正意義，更了解如何利用這種影響。更重要的是，如何避免被它傷害。'
  merge: -1
  img_proc: true
- pgno: 70
  md: '為了解這些事情，我們不妨來談一點金融史。1930 年代，大多數時間的股價，都處在很低的水位。主要理由被歸咎於兩種影響：其一是景氣不好；其二是很多投資人擔憂，羅斯福政府接下來不知道會對他們做些什麼。但除此之外，還有第三種、較不為人知的力量，往往會壓低股價：那就是我們的稅法在市場建立的金融機制。


    1930 年代，美國各州與聯邦所得稅，儘管沒有現在這麼高，但以先前和平時代的標準來看，已屬很高的水準，這表示，當超富裕的股東死亡時，必須出清大量的股票才能繳稅。高所得稅大幅削弱富裕階級儲蓄能力的同時，又發生這種負儲蓄（也就是強迫大量股票進入股市，而它們原本會是鎖在保險箱的）。而這個富裕族群，正是股票買盤的最大來源，換句話說，在這
    10 年間，已形成股價下跌的傾向。有意購買股票的人，他們的新儲蓄，趕不上當時發行的新股，以及清算遺產釋出的大量股票。


    接著，二次大戰以後，一股新影響及時出現，完全扭轉這種失衡，那就是法人買家。當然，並非所有的法人買家都起源於這個時期，私人與銀行受託人、保險公司、教育與慈善機構，多年來都持有大量股票。另外，還有一些投資信託，雖然比不上不久之後將新增的那麼多。這幾種'
  merge: -1
  img_proc: true
- pgno: 71
  md: '新影響力，先後對股市的某些部分，施加相同的力量。


    首先，是一般大眾對股票是否適合作為保守投資的認知明顯升級。結果，專業受託人、教育與慈善機構於股票投資的總資產比重大幅增加，保險公司的比重溫和增加。它同時開啟投資股票的開放型投資信託急遽成長的道路，最重要的是，投資股票的年金與分紅基金急速成長。


    這些年金與分紅基金的穩定成長，最具金融意義的層面是，它們往往汲取全新及重要的儲蓄來源，以買進股票。原本會流入工廠工人與低收入辦公室職員口袋的資金，如今都流入股市，而這兩群人，原本都不是以他們持有的股票數量受到矚目。同樣地，愈來愈多投資信託銷售人員發現到，向這些以前從沒有想過拿儲蓄去買股票的族群推銷，可以讓自己賺錢。這麼一來，這些以前把儲蓄投入其他資產的族群，便出現愈來愈多股票需求。


    簡短來說，1950年代，法人買進變成一股強大力軍，推升股市上漲的力道，遠超過戰前高遺產稅及高所得稅為股市帶來的下跌趨勢。此外，就是我已經提過很多遍的，這些法人機構的買進，對股價造成的衝擊，遠超過相同規模的個人買進。這是因為新買進的股票（雖然持股可能輪'
  merge: -1
  img_proc: true
- pgno: 72
  md: '替），有大部分會作為多年長期投資，甚至永久持有，而不會像許多個人持股一樣，遲早會被賣出。股票的供給因而減少。唯有對股票天生優於其他投資的基本想法出現重大改變，才可能讓這些股票重新回到股市。這種基本觀念的轉變通常極為緩慢，以及（在股票得到目前高度評價的）多年以後，基本情況改變，讓大眾的想法逐漸改變。


    如何評估在 1950 年代，有多少新的股票買進力量是源自於這些法人，沒有人確切知道。然而，一些隨機的數據，可以透露出它的規模龐大。1959 年接近尾聲時，約翰漢考克共同人壽公司（John
    Hancock Mutual Life Insurance Company）總裁拜倫・艾略特（Byron K. Elliott），在舊金山一場演說中預測，等到
    1960 年底時，私人年金基金儲備將較 1940 年增加 20 倍，總額達到 480 億美元。同年 7 月，麻省理工學院工管學院財政副教授維克・安德魯（Victor
    L. Andrews），在美國勞工部發行的《每月勞工評論》（Monthly Labor Review）發表文章表示，年金計畫信託基金的持股金額，從 1951
    年占總資產的 12%，到 1958 年已升高到 27%。同一個月，《華爾街日報》（Wall Street Journal）報導，美國銀行家協會（American
    Bankers Association）依據一項使用科學性採樣的全國調查，「遠比以往的估算來得可靠」，估算美國銀行業在個人信託帳戶持有的總資產，其中有 306
    億 6,450 萬美元，相'
  merge: -1
