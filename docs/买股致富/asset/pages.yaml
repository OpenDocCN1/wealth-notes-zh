  md: '今後增值的唯一來源是獲利改善，而這種獲利能力提升對股價的影響，無法大到像本益比那樣，增加的話可以讓股價翻漲幾倍。


    # 通常遭到忽略的報酬


    我已在本書第1章討論過這些法人股的投資特性，沒有必要在這裡重述，然而，有一點應該要強調：傑出的管理階層帶給股東兩種報酬，而不只有一種。本益比不定期但持續升高、直到該檔個股的本益比觸及「法人上限」（我們的先鋒金屬個案如今已達到的）所帶來的巨大報酬，是一般投資人似乎沒有注意到的，因此，基於它巨大的金錢意義，我用了這一整章來加以說明。


    傑出的管理階層還為投資人帶來第2種、而且同等重要的報酬，這種報酬超越景氣循環階段所造成的暫時漲跌，股東的獲利將以遠高於平均水準的速度數十年不斷成長。如果我們的先鋒金屬股票達到本益比36倍，是有正當資格的，那就表示管理階層極為優秀，公司已達到穩定成長，未來10年獲利增加為3倍（與過去10年的成長率相同），或許可視為「在預料之中」。如果公司發展到一種程度，未來10年獲利增值為3倍的機率所伴隨的風險，只有無法達到獲利增值目標風險的一半，'
