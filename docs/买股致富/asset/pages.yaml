- pgno: 165
  md: '找上門。一方面，公司財務長絕對不想捲入其他主管之間的紛爭；另一方面，如果財務長看到這名投資人士早已了解狀況，他或許在回答一個直接問題時，會使用相當謹慎的措辭，但仍可能暗示這種報導是否屬實。投資人士聽到這種答案之後，或許可以提出更重要的問題，例如：「公司是否採取任何措施來解決這種情況？如果有的話，是什麼措施？」


    聯繫公司主管之前進行的「閒聊」極為重要，並不是只為了打探具有重大投資意義的機密資訊。判斷一家公司長期前景的最重要因素，莫過於高層團隊的經營效率。那些規模大到會引起投資者興趣的的公司，其高層團隊通常會有多達
    5 名到 6 名重要主管。僅有少數投資代表可以在對一家公司還沒有投資興趣，只是在調查這種可能性的時候，就會得到公司管理層的賞識，獲得安排與全部或大多數重要主管會面。因此，他所會晤的
    1 位或 2 位主管，可能遠高於或遠低於這個團隊的平均水準。除非他預先經由「閒聊」，探聽到這個團隊每位成員的充分資訊，否則是無法由他會晤的 1、2 名主管的印象，來判斷整個公司管理階層的效率與狀態。在企圖分辨一筆投資是良好還是平庸時，這類的評估錯誤，可能會付出昂貴的代價；相反地，如果預先做好「閒聊」，投資者聽到一位人們口中能幹或無能公司主管的各種評語之後，便能決定是否要求跟他見面，如果真的見面，這位投資者將掌握極大優勢，明確知道他想'
