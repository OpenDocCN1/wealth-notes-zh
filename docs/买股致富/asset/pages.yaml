  md: '繁榮，並吸引不同國家競相爭奪這股黃金浪潮。只要能帶來愈來愈多繁榮、新建築合約，以及其他好處，外國人當然會受到歡迎。可是等到資金不再流入，而且營業利益開始回流母國，情緒便可能反轉，這種情況類似於美國和西班牙領導人佛朗哥（Francisco
    Franco）磋商西班牙美軍基地時，歐洲精明的觀察家所做出的嘲諷。幾乎在西歐各地，美國資金湧入之處，反美情緒都在高漲，有些地方甚至達到巨大的程度，然而在西班牙尚未得到資金，但有希望很快就得手的情況下，美國在當地就極為受歡迎。


    古巴式情況在未來發生的機率高於過去的另一個原因是，這種發展的動能大多來自於衰退時期，而不是繁榮時期。在景氣差的時候，經由選票或子彈，掌握權力的人被推翻，換上新人執政，如果古巴以前不是那麼貧困，卡斯楚（Fidel
    Castro）或許就不會上台。許多國家今日掌權的人都急於爭取更多美國海外設廠投資，因而歡迎美國投資人，這不就指出未來可能推翻執政黨的許多在野黨政客，在景氣衰退來襲時可能採取的立場嗎？


    基於上述各項理由，投資擁有大筆海外業務的公司，未必永遠都像現今獲利數字所顯示的那麼吸引人。擁有許多海外工廠的公司或許有幾年'
