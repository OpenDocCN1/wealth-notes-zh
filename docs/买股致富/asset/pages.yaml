- pgno: 16
  md: '注在陶氏和杜邦，證明他的眼光看得長遠：哪家公司有深度，哪家沒有。


    先父個人在 1950 年代持有杜邦股票，但在 1960 年代初期本書完成後賣出。他持有陶氏股票，直到 1970 年代後期才賣掉。等到他賣出時，陶氏已是這個大幅整合後的產業的第
    3 名，現今則是全美最大的化學公司。今日的化學產業已像是原物料產業且成長率低，這個產業向來是典型的景氣循環概念股。


    或許在不久的未來，科技業也會變成這樣。先父在第 5 章並未提及科技業。他談到的是「電子業」。當時這個產業是新興領域，小公司宰殺大公司，然後急速變身為巨人。他特別提到兩家公司——德州儀器與
