- pgno: 274
  md: '乎必然會以相當穩定的速度，繼續享受數年的銷售成績，儘管會低於新競爭藥品出現在市場上之前的速度。


    還有一個因素，也會讓製藥業的競爭步調，不像電子業一些部門的技術競爭那麼嚴重：一般醫師都忙到不行。每一 sương都有許多新藥上市，其中很多都做出誇大的藥效宣示，醫師根本不可能有時間掌握他專業領域所有的製藥發展與藥效宣示。他會從技術報告或醫學期刊廣告獲得一些新藥資訊，他或許也會由製藥業所謂的「細節人士」（detail
    men）得到部分資訊，這些細節人士是各家藥廠雇用的銷售代表，負責拜訪醫師，讓醫師掌握該公司產品線的重大發展。然而，大部分醫師沒有時間會晤所有人，只會約見少數新藥推銷員，因此，他們挑選少數推銷員見面。挑選的基準無疑有一部分是根據新藥推銷員的性格，還有一部分，是該名醫師以前對新藥推銷員任職的製藥公司的看法。這種影響往往讓信譽良好，並有一支訓練有素推銷員隊伍的大公司，享有一些競爭優勢。在一定程度上，它也可以阻止新上市的藥品，產生合理預期中應有的突然競爭效應。


    站在投資人的立場，除了推銷員部門的規模與地位之外，一家製藥公司與另一家公司相較之下，建立新藥市場的能力，並沒有如穩定開發新'
