  md: '的情形？就心理上來說，為何古巴的情況很容易一再重演？


    首先，家族裡的富裕成員幾乎總是受到其他人的嫉妒及討厭。對世界各地大多數平凡人來說，美國是超富階級的國度，美國的電影和無所不在的美國觀光客將這種印象傳播給世界各地的人們。我猜想，9
    成的美國觀光客舉止表現都有利於美國名聲。然而，凡是曾經出國的人都看過這種舉止惡劣、恣意批評當地風俗習慣、滿嘴髒話，讓其他美國同胞感到不齒的人。不幸的是，一個態度惡劣的美國人對國際善意所造成的傷害，超過
    50 個行為合宜的美國觀光客。美國觀光客給我們在世界大多數地區留下巨大的惡劣印象。


    再加上幾乎全世界所有人都討厭行事風格不同的外國人，我們得到什麼結論？外國投資人，尤其如果它是一家美國公司，當然便會成為想要增強自己勢力的當地政客利用的目標。為什麼原本應該友善的古巴所發生的情況，不會再度在其他地方重演呢？


    如果這種情況將會發生，為什麼沒有已經頻頻發生呢？理由不難發現，首先，在 1950 年代接近尾聲時，受到海外勞動成本低廉的刺激，美國在海外設廠的投資金額已達到海嘯般水準，這在當地國家創造出異常的'
