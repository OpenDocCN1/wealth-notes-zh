  md: '# 小事但不完全是瑣事


    對被收購公司員工的工作構成危險，所以很少發生內部權力鬥爭。況且，進行收購的公司高層可能十分了解這個領域，因此管理高層不太可能牽扯到自己無法處理的新問題。同樣地，由於公司高層對這家公司很熟悉，不太可能提出太高的收購價格。相反地，雖然這種收購有時對進行收購的公司很有幫助，卻很少對該公司股東有極大的助益，對股東來說，它們通常是沒什麼意義的。


    3. 以股東的立場來看，整合下游的收購，也就是進行收購的公司或存續公司獲得固定客源，可以用第 2 條規則所提出的，用評估整合上游公司的同一套標準來判斷。但有一個情況例外，這個例外情況是管理階層犯下錯誤，收購一家跟其他顧客互為競爭對手的公司，卻無法彌補以前是顧客、如今變競爭者所流失的銷售，這麼做可能
    zt付昂貴代價，然而，持平來說，這種情況未必只會因購併而產生，有時，一家公司舊有的組織創造出新產品線，而跟原有的顧客相互競爭，這種結局幾乎都很不理想。


    4. 當一家大公司收購一家規模相對小很多的公司，大公司股東通常沒什麼風險。即使新收購的小公司變得一毛不值，大公司受到的衝擊也不至於嚴重到影響投資價值；另一方面，如果新收購的小公司十分令人滿'
