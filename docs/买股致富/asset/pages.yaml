- pgno: 202
  md: '即使一家公司在合併之後取得主導地位，除非格外謹慎的處理，否則人事問題可能會讓被收購的公司，變得比預期的更沒有價值。對被收購公司貢獻最大的同一批主管，在這些年以來，可能跟共事的執行長培養出無比的默契。現在一夕之間，權力核心便轉移到他們不認識的人身上。他可能是在千里之外，而不是在走廊另一端，不安與疑慮必然會發生，除非妥善處理，否則可能會造成寶貴的人才流失，而且很難替補。即使處理得很妥當，在合併初期產生的不安，也一定會大到足以導致一些效率的流失。


    一樁大型公司合併案，基於必然會發生的人事問題，可以比喻為外科手術。如果一切順利，手術不久之後，病患可能會好轉很多；如果不順利，病患可能就會變得更不好了。姑且不論能否取得預期的長期效益，在合併後的短時間內，大型合併就像大手術一樣，會使開刀的病患暫時變得贏弱，而不會馬上強壯起來。如果合併使得原本合作無間的管理團隊，變成內部摩擦的溫床，合併後的公司或許永遠都會比以前來得虛弱。


    每一件合併案都有些不同，尤其成功之後的效益程度，更是不同。萬一合併令人失望，投資人要承擔的風險也是如此。有沒有一些規則或標準，是投資人可用來作為路標，在這種影響投資前景的重大事件時作為'
