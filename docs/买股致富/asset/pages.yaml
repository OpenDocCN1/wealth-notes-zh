  md: '特殊軸承業務做得很好，沒多久，該公司也成為這個領域的公認領導者。與此同時，發生了一件更重要的事，管理團隊學會在技術邊境尋找未來有巨大商業成長，而且該公司有特殊優勢、可以勝出的新領域。它們展開好幾項新業務。當然，並不是每一項都成功，不過，大部分都是成功的。由於每項新業務的初期投資都很小，成功的事業才投入大筆資金，隨著業務開始獲利，成功業務遠超過少數失敗的小額成本。為了這些成功新事業的融資，公司數度增發新股，然而，只有在增加的獲利多到一定程度，使得流通股數的每股盈餘在募資之後仍可提高，而不致被稀釋的情況下，公司才會這麼做。結果，在首度公開募資之後
    10 年，先鋒金屬的每股盈餘又再提高為 3 倍。總獲利在這段期間增加得更多，但從流通股的每股盈餘角度來看，變得更龐大的總獲利，對股東是沒有意義的，因為對股東有影響的是，每股流通股獲利能力增強的幅度。


    # 法人買進的角色


    然而，同時又發生其他事情。隨著該公司規模成長與業務多角化，全國的大型金融機構，對先鋒金屬的發展產生興趣。現在，這家公司證明了自己的實力，投資信託、年金基金，甚至是最難討好但也是最理想的股東類型，也就是銀行的信託部門，都準備把部分資金投入買進它的股'
