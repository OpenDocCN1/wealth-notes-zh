    我們又要用什麼樣的心態看這本書？


    首先，我們要知道，經過了一段時間以後，裡面所描述的產業或公司都已經大不相同了。我們不能理所當然地認為書中講的公司或產業至今仍符合書中描述，並根據這些描述進行我們的投資決策，而是應該思考這些產業能夠對照到今天的什麼產業。再者，我們可以研究他提及的那
