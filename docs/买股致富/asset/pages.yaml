- pgno: 171
  md: '往的發展。對企業資助者來說，現代的研究實驗室成本更高，超過以前高明的個人專業投資人獨自研究的舊方法。況且，單是組成技能各不相同的研究專家團隊，並不能保證可締造成功投資，它只保證眼前的龐大費用。但許多最成功的公司歷史證明，經過巧妙的指導之後，這些成本昂貴的現代研究機構，可成為源源不絕產生利潤的引擎，而這是前一代個人發明者做夢也想不到的。這樣的轉變不是一夕之間達成的，首先，2
    位或少數幾位擁有不同專長和訓練的人開始一起工作，然後才逐漸發展現代工業研發技術。同樣地，投資業由現今一名專家獨自跑遍全國，轉換為在每個主要地區都有人脈與重要消息來源的團隊，並不是一蹴可幾的。一些不同領域的傑出人士解決同一個問題（而不是只在完成個人工作之後交換筆記），將開始更快得出更多正確的投資答案，勝過使用既有的方法，總有一天，競爭將取代目前做出投資決策的方法。


    未來投資業的發展，將與運輸業現在及未來的情況極為相似。在 1962 年到 1964 年間，將為世人熟知的貨運噴射機，購機價格將比舊款 DC-4 更昂貴，每小時的飛行成本也更高。但是新噴射機將可載運更大量的貨物，由於速度更快，它們每星期可飛行的次數更多，因此，它們每噸哩（ton-mile）載運每磅貨物的成本，將遠低於
    DC-4。這會使得空運的龐大貨物噸數變得可能，而在以前的 DC-4 費率架構下，是絕不'
