  md: '時，都還無法對這些事情做出明智的判斷。


    # 影響力 4》 人口增加


    嚴格來說，相較於我們先前所討論的影響，1960 年代人口激增的影響這種事根本不應該列入未來重大投資影響的討論之中，這是因為我不認為這件事會成為影響投資的重大力量。然而，輿論極為注意這件事，而且與「黃金
    60 年代」（golden sixties）的概念密切相關，我認為值得探討一下，即使只是從合適的觀點來評判。


    大致上，那些詳細解說「人口可確保未來景氣大幅前進」這種悅耳但層淺論調的人，所根據的是一種極其簡單的說法，他們以二次大戰爆發時的生育率大增為例，除了中間曾小幅中斷之外，這種情況一直持續到現在。然而，直到目前為止，人口大增大多集中在嬰兒、年幼學童和較小的青少年人數增加，相對於近期未來的需求，這些年齡層的需求相對單純。隨著人口增加擴散到年紀較大的青少年，汽車及日常用品的需求都將成長，包括較昂貴的衣服、更多的旅遊設施和其他所有的年輕人的經濟需求。在這之後將是新成立的家庭大幅增加，如此又將帶來更多經濟需求，像是房屋、家電、裝潢等。由於生育率依然居高不下，由嬰兒'
  merge: -1
  img_proc: true
- pgno: 110
  md: '到兒童族群的需求維持於不墜，這些東西的需求將創造景氣榮景且日益繁榮。


    批評者對此則有一套標準回答，他們宣稱，人口本身無法創造繁榮，如果人口可以創造繁榮，那麼印度、埃及和中國就會是全球最富裕的國家，而不會是最貧窮的國家。年輕人口受制於年齡的限制，大多是在花錢，而不是從事所得夠高的工以創造可觀財富，因此，可能的情況將是，原已沉重的家庭預算必須進一步重組，一般家庭可用於支付這些需求的收入就是那麼多，青少年與年輕人的額外開銷，父母必須減少自己需求的開銷才能平衡過來，因此，對企業的營業總額來看，其實差不多相同，結果只是金錢花費的方式進一步調整。由於食指浩繁，人均所得與生活水準將下降。


    這兩種預測何者將是正確的？就目前的美國經濟來看，或許兩者皆非。眾多為人父母者已明白，隨著孩子們長大，各種需求變多，便會給家庭預算造成問題。解決方法主要是調整家庭收入的花費方式，以及減少父母自己的開銷，以這個角度來看，悲觀派是正確的，某些商品的需求大增、可是支付這些東西的所得卻沒有同步增加，並不會對整個國家的繁榮造成很大的刺激。'
  merge: -1
  img_proc: true
- pgno: 111
  md: '然而，這並不是事情的全貌。美國不像埃及、中國或者印度大部分地區，美國經濟確實提供很大的發展空間，讓個人與家庭可以增加他們的財富（以及社會的總財富），前提是他們有足夠動力去這麼做的話。譬如原本沒有工作的家庭主婦可以找到實用的工作，成為家庭的第二收入來源；又或是在更多家庭需求的激勵下，一家之主更勤奮工作，在財務上追求更上層樓，因而轉移到更重要及更具生產力的工作。隨著這些青少年成長，他們也投身成為社會的勞動力，因此在某種程度上，至少為了滿足較大孩童需求的家庭，所創造的財富總額也增加了，因此，企業銷售總額確實也跟著增加。


    簡言之，就整體企業而言，人口成長的影響雖然無法達到大眾談論的確保「黃金 60 年代」繁榮，但也不至於像某些人宣稱的，其唯一的影響是造成生活水準大幅下降。可是，從股票投資人的觀點來看，這些人口改變為總銷售額所帶來的成長，遠不如乍看之下有那麼重大的影響，這是因為投資人並不是持有總體經濟的股票，而是個別公司。儘管這些公司的產品潛在市場將隨著勞動力成長而擴增，競爭也會同步加劇，在許多領域，將會有更多公司瓜分市場。


    同時，針對人口成長，在許多家庭只需要局部性地調整家庭預算，但'
  merge: -1
  img_proc: true
- pgno: 112
  md: '在某些家庭卻需要大幅調整，這表示，整體需求將出現許多改變，由一類產品轉移到另一類。有的產品會增加，有的則必須面對下跌趨勢。


    為何不嘗試預測哪些公司將獲利最多，進而擬訂投資計畫？除了在極其罕見的個案，我不認為這是明智的做法。理由是，在家庭預算左支右絀之下，你很難判斷他們會決定由何種產品轉移到另一種。舉例來說，這不是單純猜測家庭是否放棄重新粉刷房屋而選擇多買一輛車的問題，他們或許會換成低價的車款或是只買中古車，而以前他們總是買新車。他們或許會開始多吃義大利麵，少吃點肉。他們在調整開銷時，可能做出各式各樣事情，他們甚至可能發現，技術進步促使他們想要的產品得以更低成本生產，為他們帶來迫切需要的節省支出。以美國家庭戶數與他們可能做出的選擇數量來看，我們所能做的是觀察情勢，然後對這種趨勢是否將持續做出合理的判斷。唯有在極少數個案，這種事情才有足夠重要性讓我們做出許多投資決策；簡言之，人口改變這件事被過度強調了。


    既然「黃金 60 年代」必然確保繁榮的概念，係以人口影響作為主要依據之一，這整個概念是否只是個幻象？這倒未必，技術與發明的穩定擴張步調將可創造源源不絕的新產業及改造舊產業，奠定前所未見的擴'
  merge: -1
  img_proc: true
- pgno: 113
  md: '張與繁盛基礎。但這能否成真，將取決於政府是否將這些事處理得一塌糊塗，譬如不明智與限制性的課稅、金融政策、勞動政策，以及政府的監管事務等等，以至於阻撓這種技術與創新發明趨勢帶來的
    hood 處。這些事情唯有在進入下個年代後才能回頭評估，以目前來說，我們要記得，1950年代許多股票大漲或許在很大程度上已反映這種前景，換句話說，1960年代股票大漲的情況必然比1950年代更具選擇性。除了極少數個案，人口成長曲線這種被大肆宣揚的事跟股價上漲一點關係也沒有。


    # 經濟學家退場，心理學家登場


    我曾經評論過，金融界有個奇特的傾向，就是理應向前看的他們，卻總是未能領先看出環境改變，而是等到新影響已存在多年之後才發現。我認為，這是為何試圖預測景氣走勢的人，在1940年代及1950年代被視為是影響投資決策的重要因子。甚至在今日，許多的投資人與專業投資人士仍然認為，明智投資策略的核心在於盡力取得最佳景氣預測。如果景氣展望趨於擴張，那)],
    就買進；如果展望趨於下跌，那)


    多年之前，這種投資策略的優點或許遠勝於今日，當時的金融體系較為疲弱，沒有人保證政府會在真正危急時出手救援（救援過程必將造成'
  merge: -1
  img_proc: true
- pgno: 114
  md: '大量通膨）。在景氣（連帶包括聯邦稅收）處於超低水準時，沒有任何稅制可以不嚴重刺激通膨性的支出。當時沒有這樣的大眾輿論，認為每當景氣衰退時，政府會採取強力反制措施來力挽狂瀾。最後一點，當年的產業類別更為狹隘，在今日複雜經濟裡的大量產業，彼此的基本特點甚少具關聯性，因此今日或許可以保證，即使沒有政府行動，現代的景氣衰退也不會像以前那麼嚴重。當大多數產業走下坡時，有的產業具備超強的背景得以擴張，這種情況往往可以穩定整體經濟。


    這表示，比起多年以前，經濟衰退對投資人不是那麼重要，雖然這不表示，了解景氣走勢不再是那麼實用的資訊，但是，擁有這類資訊並不是股票投資成功的關鍵。簡單的計算便可以證明這點，當股市下跌碰到嚴重經濟衰退時，例如
    1937 年到 1938 年以及 1957 年到 1958 年，大多數股票下跌了 35% 至 50%，等衰退結束時，較好的股票便反彈，而且通常創新高。即使在史上景氣最嚴重衰退時，也只有少數公司倒閉，亦即跌幅達
    100%，這些倒閉公司大多是債務龐大，以及優先股多於普通股的公司。即使在史上最大投機泡沫之後，當時的股市榮景大多由融資帶動，股價平均跌幅為 80% 或 90%；但當股票上漲數年之後，即使是最鬆散的股市歷史研究都可看到其漲幅達到倍數以上。股市的短暫下跌通常跌幅只有
    35% 至 50%，並且往往伴隨著經濟衰退，然而景氣好'
