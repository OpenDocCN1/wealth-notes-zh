  md: '指引？我相信有，它可以總結為以下幾項：


    1. 購併為投資人帶來 3 種主要風險，考慮收購的公司管理階層，與正在考慮收購的公司股東，應隨時牢記下列可能的危險，分別是：①合併後，公司每個高階職位（財務主管、銷售副總裁、研發總監等）的爭奪戰會很難看，波及大多數關鍵人員，以致原本合作無間的團隊，淪為內鬥與摩擦的溫床；②管理高層將捲入許多以前不熟悉領域的問題，而無法維持原先的效率；③由於賣方必然比買方更了解自己的公司，存續公司買到的公司，缺陷必然會遠多於收購價格可容許的程度。


    2. 凡是垂直整合上游公司的購併，鮮少為股東造成重大風險。這些合併可讓一家公司以更有優勢的條件，取得原材料、零組件，或是其他供給品的固定來源。會有這種優勢，或許是因為使用公司所需的這些供給，會變得更廉價，低於以前向其他廠商採購的價格。也可能是因為如果下游公司本身也生產這些供給品，在製造上會更謹慎，以便符合該公司的品質標準。然而，無論如何，這種合併的效率，可以在事前精確估計。更重要的是，這種性質的合併，通常不會開啟第
    1 條規則提及的 3 種風險這個潘朵拉的盒子。因為被收購的人員適應他們自己的利基，既不會跟進行收購公司的大多數運作產生衝突，進行收購的公司人員，也不會'
