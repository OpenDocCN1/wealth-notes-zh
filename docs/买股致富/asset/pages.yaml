  md: '# 第2章 股票增值如何達到最大？


    另一件有趣的事是，剛開始營運時並未推出特別誘人產品線的公司數量。就像我所舉的瓊斯鋼板工廠例子，其中許多公司取得成功的主要動力，是因為找到可以跨入的誘人產品線，還有基於原始業務而擁有一些優勢（例如德儀跨入電晶體）。其他公司，例如超級成功的化學公司，很快便發現它們產業成功的核心，在於不斷對應該進軍或退出哪些部門做出正確決定（或者，至少在這種決定上，成功率很高）。


    如果你全心相信，就真實商業世界不斷發生的情況來說，我在先鋒金屬個案說的都還太含蓄了，其實並不誇張。我們不妨來討論一個很基本的考量，我們回到先前提出、但尚未回答的一個基本問題，延續先鋒金屬的例子，為什麼明智的投資人願意用
    18 倍本益比買進公司股票，並滿足於 10 年只賺 6 倍（雖然看上去不錯），而他其實可以在 10 年前尋找跟先鋒金屬發展初期類似情況的股票，如此可以為他帶來
    40 倍的報酬？


    當然，答案在於涉及的風險程度。任何投資的評論標準，不是只看一切順利的話可以賺到多少錢；相反地，應該是就涉及的風險來看可以賺到多少錢。在先鋒金屬的例子，公司能否撐得過低本益比的早期階段都很難說，它需要好運及好的判斷。假設羅賓森在公司發展關鍵的早期病'
