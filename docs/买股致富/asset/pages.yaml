  md: '# 第2章 股票增值如何達到最大？


    倍數沒有改變，公司的獲利大幅增加也只能讓他賺到 30 萬美元。


    有時候，股市跟風會造成本益比大幅但短暫的提高，在這種情況下，全體投資人對某個風光的產業前景過於憧憬，在一段時間之後，把股價炒高到不切實際的水準。此外，有時投資人對所有股票過度熱中（或過度冷淡），在
    1、2 年的期間，股市會出現高得危險（或低得誘人）的本益比倍數。然而，本益比倍數的最大改變來自一個原因，而且只有一個原因；公司出現根本上的改變，這改變持續數年，而且本益比上調與股市大盤無關。這些改變，使得股票在投資人眼中比以前更安全、更具吸引力。我希望在先鋒金屬這個範例中談到的各種細節，可以讓大家明白我說的公司管理，並不是抽象的理論事務；相反地，它們可以造成投資人的實質獲利大幅增加或減少。


    話雖如此，在股價從羅賓森原始買進價格上漲 40 倍之後，有哪個投資人會聰明到去買先鋒金屬的股票？假設先鋒金屬實現期望，獲利進一步成長，基於本益比倍數的重要性，就算是獲利有可能再進一步成長，有遠見的投資人去買本益比已大漲的股票，豈不是太不智了？為了明白這個問題的答案，我們來看看（但不像前文那麼深入）先鋒金屬之後
    10 年的發展，也就是羅賓森管理的第 2 個 10 年。'
