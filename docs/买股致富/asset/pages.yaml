  md: "進行數項收購，就會變得更危險。許多人不同意這種說法，但我相信，當一家公司的組織結構存在下列兩種情況的其中一種，這種投資風險甚至還會進一步增加：其一是執行長總是花許多時間在收購；其二是公司指派一名高層專責進行收購。這兩種情況下，公司的有力人士通常很快便會形成一種心態，要完成夠多收購，才能證實他們沒有浪費時間，這會造成跟第\
    \ 6 條規則正好相反的「壓力」。 \n\n8. 基於第 1 條規則的理由，以及企業購併與個人投資人買進持股的理由非常相似，最不理想的收購，是用相對於既有資產與以往獲利的超低價格，買下一家不甚吸引人的公司。最吸引人的收購，往往是用高價買下完全符合需求的一家公司。原本可能對股東來說是大好機會的公司，有好幾次因為管理階層收購數家疲弱或平庸的企業，衝擊本身良好的事業，而變成毫無魅力。通常，它們會跟股東解釋，藉由多角化經營，股東的立場會變得更加強大！這種收購平庸企業的情況發生時，以前該公司股價穩定上漲的趨勢有時會戛然而止，甚至永久停頓。\n\
    \n9. 一家公司涉足全然不同的產業類別愈多，管理階層的壓力也愈大。眾多成功企業都把它們的業務局限在一個廣泛的產業類別，例如，化學、電子或紙製品。然而，有一些也很成功的公司，能用很高的效率，投入"
  merge: -1
  img_proc: true
- pgno: 207
  md: '2種、甚至 3 種完全不同的產業。況且，以今日複雜科技來說，產業之間沒有明確的界限。舉例來說，奇異（GE）大部分的業務是電子，但這些各不相同的電子業務，代表的是一項產業或數項產業？基於這樣的理由，我們無法設定硬性規定，以決定一家公司過度多角化經營時的危險程度。對投資人的風險來說，一家公司分散業務的速度，可能比跨足的業務數量更有關系。因此，除了規模不同（見第
    4 條規則）及業務不同的公司合併之外，購併都應該用最嚴謹及最高度懷疑的態度去研究。


    這些年以來，股市對跨足數項極為不同業務的公司，一直給予較低的本益比，低於業務集中在一種或少數產業的公司，這或許是一項正確的規則。假如真是如此，針對新近在以前不曾投入領域進行大型收購的公司，給它們較低的本益比，難道不也是一項完好的評價政策嗎？像給予這種較低的評價，難道不該至少持續到這些公司的管理階層，證實他們有能力同時做好「腳踏兩條船」的艱難工作為止嗎？


    因此，取決於合併的性質，我們可以把它們總結為投資意義可能有很大差異的事件。我相信，真正大型的合併，為股東帶來的陰昧多過它們承諾的。但我要介紹一種新的相關事業活動領域，那就是組成共同控制公司。這不是合併，而是兩家以上技術背景通常不同的大公司，聯'
  merge: -1
  img_proc: true
- pgno: 208
  md: '手組成一家新公司，由數家母公司共同管理。例如，陶氏康寧（Dow Corning）和歐文斯康寧纖維玻璃（Owens Corning Fiberglass）這些極為成功的公司，這些合作近年來散見於經濟地圖。它們絕大多數都是成功的，很多公司甚至極為成功。


    我們不難發現這種活動成長的理由。隨著產業愈來愈趨於技術複雜，開啟的新商業機會，或許遠超出一家公司的技術能力，但不會超出兩家以上科學專業知識不同的公司合併後具備的技術。又或如一家或一家以上的創辦公司或許不具備技術背景，但擁有新公司需要的原材料供給，或是對重要市場有深入的了解。另外，像是經常需要大量資本，有時也是組成這種聯營企業的另一個因素。


    組成這類公司的合理商業邏輯，並不是眾多這類公司成功的唯一理由。另一個理由，是許多的母公司都有傑出的主管，這表示他們可以把優秀人才轉移到新公司。新公司起步時，就可避免新手上路的危險，這個因素困擾許多原本充滿機會的新公司。


    眾多聯營企業都很成功，它們是否讓母公司的股價大幅上漲？我認為，大致上來說，沒有。從股市的本益比來看，共同控制公司以股息形式繳'
  merge: -1
  img_proc: true
- pgno: 209
  md: '給母公司的獲利部分，其市場評價跟母公司的獲利是一樣的。但，我相信，除了極少的案例，投資人不太在意母公司在聯營公司保留盈餘的占比，而比較在意母公司本身的保留盈餘，這表示聯營公司保留作為未來成長所需的盈餘，對母公司股價產生的影響，比不上母公司保留盈餘作為未來成長對股價的影響。


    乍看之下，這個説法的理由可能不合邏輯。明智的投資人會很滿意由管理階層來決定公司多少利潤要拿去配發股息，多少利潤要保留下來，因為他們相信管理階層可以做出最符合各方長期利益的決定。如果他們沒有信心，應該會賣掉股票。但當利潤保留在這些共同控制公司手裡，便不是由他們認識及有信心的管理階層完全掌控。他們投資的公司，管理階層必須獲得他人的核准，或是有時要跟他人取得妥協，才能進行這些事情，因此，共同控制公司的資產，似乎距離股東較遠，像這樣的資產，遠遠比不上母公司擁有的資產。就這方面來說，共同控制公司的保留盈餘，得到的評價低很多。


    這個問題有沒有解決方案？有沒有任何方法，可以讓這些聯營公司的獲利，對母公司股東來說也同樣理想，就跟他們直接持股的母公司獲利一樣？我相信，是一個相當簡單的方法，這個方法，是把這些共同控'
  merge: -1
  img_proc: true
- pgno: 210
  md: '制公司因成長而需要更多資金時偶爾所使用的做法普及化。有時，它們必須對一般大眾發行股票來募資，這麼做，會形成這些共同控制公司股票的公開市場，然後，便會培養出欣賞與支持這些共同控制公司主管的投資人團體，而不是忠於母公司的投資人。母公司如果願意的的話，可以把在這些共同控制公司的股權部分或全部變現，按照市價賣出這些股票。


    只要有真正出色的管理階層，執行這種至今依然少見的做法，將可使這些共同控制公司的真正價值很快反映在母公司的股價。這些共同控制公司的保留盈餘，首先反映在它們自己公司的股價上漲，接著是母公司的股價。對母公司的股東來說，這會使得這些共同控制公司的保留盈餘，跟母公司的保留盈餘同樣有價值。


    某些特定的金融人士會反駁這項結論。他們會指出，在封閉型投資信託領域，信託業者出售一些公司股票的價格，與這些股票在公開市場的售價往往存在大幅折價。他們會說，如果這些共同控制公司的未上市股票形成公開市場，這種折價也會出現，共同控制公司的真正價值，同樣無法好好反映在母公司股價上。我相信，情況不一定會這樣。我認為，這種低於流動資產清算價格的折價，顯示出兩件事。以投資信託來說，它們反映出投資信託營運的成本。投資人認為，這些信託的股票價'
  merge: -1
  img_proc: true
- pgno: 211
  md: '值，遠不如那些股票的清算價值，是因為信託從那些股票收益扣除的費用。這裡必須加上我相信「已調整」（adjusted）清算價值的折價（或溢價），才能反映金融圈對該信託主管能否維持股東最佳長期利益的能力缺乏信心（或充滿信心）的程度。舉例來說，雷曼公司（Lehman
    Corporation）的管理階層這些年來極為善待股東，金融圈似乎十分相信這些人將來也會有良好表現，股價總是高於清算價值，從來沒有低於清算價值。以此類推，如果一家營運完善的公司持有一家同樣營運完善的共同控制公司股權，而它的股票已形成公開市場，投資人就可以確定這些證券的報價，會有很大程度反映在他持股的市價上。


    假如這麼簡單，就可以讓愈來愈多的共同控制公司對母公司股東更具價值，為什麼沒有更多這類公司公開發行股票？為什麼向來快速挖掘賺錢領域的投資銀行家，沒有敦促這些公司進一步透過公開發行股票來集資？答案就是許多金融界人士完全錯估與高估股東表決權的重要性。我們不妨來探討一下。


    # 表決權與代理權等籌劃


    在大多數公司，普通股票持有的每一股都可以投一票，他們的表決將'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# 小事但不完全是瑣事


    選出公司董事會。在法律上，公司董事會是公司最高權力核心。董事會任命所有重要主管，包括總裁，董事會也決定大部分的重大決策。


    基於這些理由，這種表決權從表面看來，對投資人具有實質意義與價值。金融界表面上似乎證實了這點，因此，在證交會要求大多數新股發行時所公布的公開說明書，必須說明證交會認為這些股票最重要的資訊。任何不同於標準表決權模式的做法，必須在這些公開說明書詳加解釋。同樣地，許多雜誌報導和一些書籍已探討過這個主題不同層面的對與錯。舉例來說，吉伯特兄弟（Gilbert
    Brothers）多年來因為改革一些公司慣例而聞名全國，他們倡導的改革，大多直接或間接與股東表決權有關。


    我接下來要說的，不該被解釋為我認為即使是在表決權領域，吉伯特兄弟等大多數改革者都不是完全合宜。在某些例子，像是他們倡議取消交錯任期制的董事會（少數公司仍保留這種保障管理階層的機制），他們的意圖似乎相當正確。我想說的是，為什麼對遵守穩健投資慣例、自行處理投資的投資人來說，表決權這種事完全不重要。


    我相信，這件事帶來的<|message|>混淆，來自大家習慣把非常不同的兩件事拿來對比。其一，是民主國家的公民，對國家及他所在地事務擁有及使'
  merge: -1
  img_proc: true
- pgno: 213
  md: '用投票權的重要性；其二，是股東擁有相同權利的意義。大家忽略這兩項流程之間的主要差異。一個公民運用自己的判斷去行使投票權，是為了維護自己的重大利益。他應當協助在既有人物及議題選項之中，選出最好的（有時是最不糟糕的）。近代史上許多案例顯示，絕大多數人對這些事情的重要性毫不關心，而導致全體人民陷入悲慘的局面。然而，這些政治事務會極為重要的理由在於，有各種不同的關係，把一般家庭與他們生活的國家聯繫在一起。即便是在政局變得難以忍受時，收拾家當（假如帶走家當不構成犯罪的話）及搬到其他地方，都不會是簡單的決定。


    相形之下，公司股東並不相同。在大多數的情況下，股東並不是一出生就擁有一檔股票，不像一個人一出生便取得國籍。股東可以，並應該挑選管理階層符合行為標準的公司股票。即使是繼承股票的情況（或是很常遇到投資人買到一家他不滿意管理階層的公司股票），他可以處置自己的持股，輕易轉換到他挑中管理階層的公司股票。基於這點，我認為即使只是隨便挑選目前持股的投資人，也一定要遵守這項表決權的基本策略：他要不是全力支持管理階層，就是賣掉持股。


    我很清楚，這種說法跟大多數對公司表決權這個主題發表意見的人士'
  merge: -1
  img_proc: true
- pgno: 214
  md: '想法相左。大家都聽過下列這種評論：「無論一家公司的管理階層有多好，如果他需要股東核准某件股東認為不理想的事情，則股東應投票予以否決，這不只是為了股東的利益，更是股東的職責。股東賣掉一家管理不善公司的持股，而不加入代理權爭奪戰，以換上更好的管理階層，等於是讓別人來收拾爛攤子，而不是自己設法去收拾。在換上更好的管理團隊，以讓公司股價上漲之前，早早就賣掉股票的這種人得不到原本屬於他的獲利也是活該。」


    這種論調並不新，它們乍看之下似乎是對的。我們在更深入探討之後，看看是否還有道理。我們先從股東本身的利益來看，接著再從大眾的利益來看。


    首先，我們來討論一名股東對持股公司的管理階層很有信心，也很尊重他們，如今卻發現自己並不認同管理階層打算要去做的某一件事。因為兩個聰明的人極少對每件事都看法一致，管理階層遲早會提出某些股東不希望公司去做的事情，這並不令人意外。不過，股東並不認為這個提案有糟到讓他只因為這樣就想賣掉這家好公司。這個提案或許是購併、增資或減資、遴選新董事會成員，還是某種股票選擇權或新的主管薪酬計畫。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '就投資人相信管理階層的能力來看（如果他不是這麼想，或許應該自問為何要持有這檔股票），我認為，首先他應該問自己這個問題：「我是否確定自己對這件事的看法是對的，而管理階層是錯的？畢竟，管理階層可能比我更了解他們提案的某些層面。」假如管理階層很誠懇很有能力，難道股東不該重新考慮，至少想想自己的看法有沒有可能是不正確的？然而，我們假設這位股東仍然相信管理階層的提案不好，但並沒有重大到讓他想因此賣掉一檔好股票。


    如果真是如此，我們便來到問題的核心。股票投資人試圖在小事情上施加影響力，以抑制迄今表現傑出管理階層想做的事，這是明智之舉嗎？我認為，只要檢視管理階層的基本運作，便能明確知道這不是明智之舉。沒有大公司可以不把權力下放給表現良好的人，而能建立起一支傑出的管理團隊。不這麼做的話，資淺主管便沒有機會由實務經驗來提升自我，進而成熟並成長。只要這些主管在公司政策的框架內運作，並產生良好的結果，便可以自己做出決策，即使最高管理階層可能在做法上有些不同，情況大致會是這樣。如果最高管理階層應該要自我克制，給部屬一些行動自由，就意味著部屬有時會從他們的錯誤中學習，只要整體表現良好並創造佳績的話，為什麼股東不能同樣克制，給予表現傑出的最高管理階層相同的行動自由？我認為，如果不這樣對待傑出的管理階層，'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# 小事但不完全是瑣事


    可能造成怨懟及內部緊張，股東付出的代價，可能遠高於因管理階層偶爾執行一項不智提案蒙受的損失。


    然而，我們現在來看一個更極端的案例。這種情況是，股東對自己投資的公司很滿意，但遭到他反對的那項提案實在太不理想了，萬一真的執行，他寧可賣掉持股。這種情況不常發生，但偶爾可能會出現。在決定表決反對這件事之前，股東應該問自己兩個問題。第
    1 個問題是：是不是真的有機會否決這項提案？第 2 個問題是：如果管理階層竟然支持這麼糟糕的事情，有沒有可能他們的判斷或士氣，已遠比我想像的來得低落，即使否決這項計畫，他們也會再提出跟這個一樣差勁的提案？第
    1 個問題出現肯定答案的機會很低，而第 2 個問題出現否定答案的機會也很渺茫。除非這些答案符合事實，否則由個人投資人的觀點來看，最好是賣掉股票，等待下一個真正理想的投資，而不是持續持有他所無法阻擋一項很差提案的公司的股票，或是即使可以阻擋，未來也很有可能不斷面對類似的投票反對提案問題。最能讓管理階層分心、連簡單工作都做不好的，莫過於跟股東的內部鬥爭。


    幸好，優秀管理階層的提案，讓股東權益陷入重大危機的情況少之又少，而且很少引起代理權爭奪戰。大多數的代理權爭奪戰，都是發生在'
  merge: -1
  img_proc: true
- pgno: 217
  md: 紀錄不佳的管理階層身上，其結果是大股東團體發動內部革命，或是某個外部團體看到可以有取得控制的機會，而試圖說服持有大量股票的人，相信換人做可以做得更好。近年來最可觀的代理權爭奪戰，大多是這種情況，一般股東（不論誰贏了，股東都不會得到高薪工作）在代理權爭奪戰選邊站之前，不妨思考一些投資基本原則。如果差勁的管理階層長期控管公司，最大的耗損通常發生在資淺主管階級，有才幹的年輕人會跳槽到更有升遷機會，以及不討厭、甚至歡迎新意見與建議的地方。因此，若股東推翻舊有的差勁管理階層，把能幹的人放到高層，通常需要花幾年找來低階主管，並加以訓練，直到整體績效紀錄明顯提升。但在同時，也有可能新管理階層不像代理權爭奪戰時期看起來那麼能幹，所以並未產生太大的基本改善。或許這些新進高層，只是一群油嘴滑舌的投機分子，逮到機會為自己騙到高薪工作而已。基於這些理由，我認為如果有明顯證據，顯示代理權爭奪戰不是由傑出管理階層發動的，不去蹚混水而是賣掉持股、等候更好機會以投入原始資金的投資人，通常才會有最好的結局。或許他該等到
    2 年或 3 年這樣足夠的時間過去，再回顧前一家持股的公司，如果公司有了更好的管理階層，就是機會開始出現的第 1 個明確跡象，那麼，就可能出現真正的買進機會。無論如何，等到一開始的騷動消退，我想不出過去
    20 年，有哪一次的公開經營權之爭，促使公司股價在隨後幾年大幅超越大盤。或許這是另一個指標，
  merge: -1
  img_proc: true
- pgno: 218
  md: '顯示股東表決權對那些喜歡「亂講話」或愛打官司的人才重要，對主要想藉股票來賺錢的人來說並不重要。


    但如果從股東眼前利益的自私立場來看，假如他不相信管理階層好到能讓他一路相挺，最明智的做法幾乎一定是賣掉持股，那麼從公共利益的角度來看這種行動呢？若股東對管理階層的任何要求，都跟「橡皮圖章」一樣通過，他們會不會因此撤除了防範未來管理階層濫權的最強力護網？如果他們認為一名管理階層有錯，而另一名更好的人希望股東支持，他們對其他股東難沒有道德責任，應該透過股權表決以進行改變嗎？


    再一次，我相信深入探究的話，可以證明大家接受的答案並不是正確答案。這是因為股東的表決權，是十分笨拙又沒有效率的工具。在 5 年間因為代理權之爭而歷經高層人事變動的上市公司家數，僅占全體上市公司的一小部分。同樣地，我猜想，在管理階層沒有被推翻，但因為股東投下反對票而遭到否決的管理階層提案，應該又更少見了。這是因為管理階層，尤其是軟弱的管理階層，知道自己可能遭到攻擊，因而準備鞏固自己的權力，通常經由買進股票、與大股東結盟，或是利用表決權信託（voting
    trust）等大家熟知的機制，管理階層便能鞏固自己，使得他們幾乎堅不可摧，除非遭受其他同樣也進行結盟、財力雄厚團體攻擊。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '在這裡，大家時常把一家公司的股東，比喻為一個社會的公民，一樣完全說不通。政治專家告訴我們，在美國，即使是最強大的政治團體，也很少能拿下 20% 以上的有效票，這是沒有組織的公民很難跨越的門檻，但覺醒的公民便可以跨越。然而，企業這種實體，是我們可以輕易脫離關係的，不像公民和國家，公司掌權者往往可以取得
    50% 以上的票數，使他們立於不敗之地。


    然而，如果說要對不合格的管理階層施壓，表決通常是一項很弱的武器，但股東其實擁有另一項十分強大的力量，那就是一開始便為自己的私利著想，如果他們不喜歡管理階層，便賣掉自己的持股，不去碰它。強悍、自我中心的管理階層，可能忽視不滿的少數股東表決。但在另一方面，持續的股東賣壓，會直接波及公司經理人的個人財富、他們賴以維持權力的盟友財富，以及他們的營運業績。因此，當持續的股東賣壓湧出，造成股價本益比遠低於競爭對手的水準，管理階層很少會置之不理。這種投資人表達不滿的證據，也會造成公司未來可能進行的融資成本，高於名聲較好的對手。而且，正中要害的是，假如管理階層持有大量公司股票（或是他們賴以取得支持的人士，如果管理階層沒有足夠股票可以掌權的話），這些股票淨值將減少到只剩投資圈喜愛它們時的一小部分。對法律上站不住腳的人，這種事情可能會造成真正的傷害，這'
  merge: -1
  img_proc: true
- pgno: 220
  md: '# 小事但不完全是瑣事


    比一些否決票更可能改變管理政策。


    簡單來說，投資人完全是為了自己著想，而拋售一家經營不善的公司股票，此舉壓低了該公司股價，並加劇投資圈對管理階層的不良觀感。不過，投資人的賣股行為或許在無意間對管理階層形成真正的壓力，如果有足夠人數也這麼做，便會形成一股真正的力量。另一方面，投資人死抱股票而去否決管理階層的提案，即使有許多人也這麼做，通常都是螳臂擋車，他無法改善自己的投資局面。或許這就是為什麼儘管表決權討論得沸沸揚揚，並在新股公開說明書等刊物占據大篇幅，「市場的冷血判決」卻認為它們毫無實質價值。如果你懷疑這點，不妨查一下過去40年的各種案例，同一家公司同時發行兩種股票，股票幾乎完全相同，唯獨因為表決權信託安排或其他法律機制，讓其中一種股票不具有效表決權，另一種則有。具有表決權的股票幾乎從未因表決權而享有更高市價，這兩種股票，就報價來看，通常是可直接互換的。


    或許，成功投資人就這整件事所能學到的是：「如果深入探究，你便會明白，股東與公司的關係，以及公民與所在地或國家的關係，基本上不是相似的。」以上說法一點兒也不正確。忽視公司表決權的性質吧！因為無論怎樣，它們跟投資人未來的財富毫不相干。專注在傑出的管理'
  merge: -1
  img_proc: true
- pgno: 221
  md: '階層，因為這才能創造重要的投資成果。當你找到這種管理階層，無論你是否支持每一項提案，都用表決權持續支持。這麼做，就好像你對自己信任的專家，會支持他的任何計畫，該名專家藉由獨特的技能，已為你創造獨特的成果。就像你的醫師、律師、水電工，或是任何你自己挑選的專業人士，如果你對他們的看法因任何理由而大幅惡化，不要跟他們爭辯個沒完沒了，直接換掉他們，找個更好的人吧。


    # 該因美國選舉前景而買賣股票嗎？


    試想以下這個場景：我們從大學畢業已有數年，不再熟悉學生或學校事務的消息。當我們去足球場，看到「大賽」正要開始，我們的大學正要迎戰死對頭。我們從未見過兩支球隊的任何球員，實際上，我們不清楚任一球隊的背景，不過，當樂隊開始演奏熟悉的進行曲，一看到向來認為自己所屬的球衣顏色，我們在情感上立即選邊站。我們或許很少想過，那些穿著我們認為自己所屬制服的球員，或許是一群混小子，他們出賽的費用，是由一群性格外向的校友支付。那是我們的球隊，突然間，我們一心希望他們好好表現。


    今日，社會科學家已證明，我們許多人對美國兩大政黨的情感聯繫，'
  merge: -1
  img_proc: true
- pgno: 222
  md: '十分近似於原本參與度低的校友在體育比賽時，一看到母校的顏色、校歌與服裝時，便完全效忠的情況。研究證明，各種因素，像是我們成長的州、成長的社區、現在居住的社區、我們的種族背景、我們的宗教背景，以及我們認同的經濟階級，都是強力的繩索，將我們拉向支持一個政黨的候選人。很快地，雖然我們或許自稱獨立思考，仍會發現自己愈來愈政治效忠，以致接受我們選擇政黨的極端政見。我們這種傾向，甚至很可能影響到投資決策。


    很多人會問，把選擇的政黨列為重要因素，是一種基本上穩健的投資策略？政府的作為，可能對股票價值造成重大影響，因此，我們有信心的政黨執政時買進股票，難道是不智的嗎？如果我們擔憂某個政黨的目標，而它又有可能勝出，難道我們不該賣出股票嗎？


    要回答這些問題，我們先要從一個理解的共同基礎出發，也就是說，政府權力可以改變股票的價值，這點是無庸置疑的。為了實現領導人堅信的某些社會目標，而不惜降低全體人民生活水準的政府，會對良好股票投資的價值，造成嚴重的不良影響。另一方面，比起近年來我們經歷的政權都還要英明的政府，或許可大幅提升股票的價值。沒有人可以否認政府的影響力，這不是問題，問題在於，不論是最近的美國，或是可'
  merge: -1
  img_proc: true
- pgno: 223
  md: '預見未來的美國，仍像目前的狀況，一個政黨的勝利都很可能被視為有足夠的重要性，足以改變投資決策。


    許多投資人對這個主題的想法，大概如下所列：共和黨主要是企業政黨，共和黨了解並同情企業問題；民主黨的票源，是來自嫉妒及敵視企業成功的許多團體。因此，當共和黨執政，企業就安全了，那麼就該持有股票；當民主黨掌權，股票投資人就要受苦了。


    還有一批人數相同的選民族群，這個族群並不富裕，對股市沒那麼大的影響力（但還是有一些），他們的想法正好相反。由於在 1932 年觸及谷底的大蕭條發生在共和黨政府執政時期，因此他們認為共和黨是衰退政黨，而民主黨是繁榮政黨。他們便宜行事地遺忘，假如他們曾經知道的話，其他幾次的嚴重蕭條都發生在民主黨政府執政時期。他們相信，在共和黨執政時，股票投資人和所有人必須擔心隨時可能捲土重來的衰退，只要民主黨執政，則大家都可以安心。


    我相信，在今日的美國（未來或許會很不一樣），以及不遠的過去，這兩種想法都沒有確實的基礎。認為民主黨擁有特殊配方可以預防衰退，或是它們在這方面可以做得比共和黨更好，似乎大幅偏離可證明的事实，'
  merge: -1
  img_proc: true
- pgno: 224
  md: '實在沒有必要浪費時間討論。然而，相對的看法，也就是在共和黨前途光明時應該買進及持有股票的想法，普遍存在於許多股票投資人族群，值得較詳盡的討論。


    一般的共和黨公職人員，比一般民主黨公職人員更支持企業，這種基本想法或許沒錯。然而多年來，這方面一直沒有明確的分界線。民主黨籍的參議員A，擊敗現任的共和黨籍參議員B，前者或許比參議員B更仇視企業。然而，相隔3個州外，民主黨籍的參議員C，同樣擊敗現任的共和黨籍參議員D。而我們發現，參議員C比參議員D更支持企業的看法，此外，因為他是多數政黨的重量級黨員，或許更能推動他的意見。


    然而，有一股現代美國政治的基本趨勢，對股票投資人來說更重要，勝過參議員A、B、C、D的個人立場，那就是大多數的美國選民，都強烈傾向溫和派，他們反對極右派與極左派。因此，重點不在於公職人員的立場，而是他做了什麼，他做哪些事以獲得連任？


    典型的共和黨員在選上之後，便會開始做出各種稍微左傾的舉動，希望吸引廣大中間選民的支持，證明他不是「大企業的怪物」。他或許打從心底不喜歡其中一些舉動，不過，他還是做了。先前民主黨政府的一'
  merge: -1
  img_proc: true
- pgno: 225
  md: '系列反托拉斯措施，像是緩和進一步的「社會福利」、犧牲有經濟效率的階級，以及把個人而不是企業視為最優先的稅率減免，都是近年來這種趨勢的一些徵兆。


    那麼典型的民主黨員在選上之後會怎麼做，以希望吸引廣大中間選民的支持？他有時會發表強力反對「大企業」的談話，但很少倡導危及正統美國企業的措施。他的稅法主張極為溫和。至於他真心希望給予經濟弱勢階級的額外「社會福利」、而犧牲有經濟效率階級的金額，或許會比共和黨議員增加一點，但也只是一些些而已。當真的發生經濟衰退時，他或許比共和黨議員更急於減輕企業負擔。


    這些基本情況不會永久持續下去，基本輿論遲早會改變，大多數選民或許不了解（一如今日的情況），在自由獲利體系下運作的美國民間企業效率驚人，那才是讓美國各主要族群生活水準不斷升高的唯一力量，並同時承擔和平時期自由人民被要求背負的最沉重國防負擔。廣大的美國選民，或許出於根深柢固的直覺，而不是有意識的思考，似乎認為創造開明的利己（enlightened
    self-interest）私人利潤，是造成所有人不斷提升效率，以及造成這些成果的唯一影響力。如果這種觀點改變，現代政治的基礎也會改變。那時候，對股票投資人來說，政黨政治或許會比'
  merge: -1
  img_proc: true
- pgno: 226
  md: '# 小事但不完全是瑣事


    現在來得更重要。然而，幸好現在連一點點跡象也沒有。直到那種情況發生之前，因為不喜歡政黨政治前景而賣出好股票的投資人，可能重蹈新政（New Deal，註⑰）初期一些極富裕與成功的共和黨投資人覆轍，當時他們太過憂慮新政府，以致忽視那個時期的好機會。他們完全錯估了形勢，那些他們只是稍感不滿的部分法條，卻施以強烈的反對。譬如關於普通股所有權的法案，只因可能受特定立法影響而膨脹，因此就被全然反對。如果將來又選出一個溫和反商的政府，這種影響力交錯的組合，或許又會捲土重來。


    如果我們輕易做出結論，說同屬一個政黨的每位國會議員都是中流砥柱，這或許會誤導投資人；同樣地，並不是每個反對黨的議員都是危險來源。為了說明這點，來看看我認為過去
    1/4 世紀最邪惡的商業立法。這個法律，就是所謂的「超額利潤稅」（excess profits tax），支持者為這種十分邪惡的稅，扣上冠冕堂皇的名稱，以掩飾本質。這種稅為害極大的理由是，它針對那些經營事業成功、開發新產業，以及創造新就業機會的公司，施以特別的懲罰；它為那些沒有效率、對經濟沒有貢獻的


    > 註⑰：編按：指 1933 年富蘭克林·羅斯福（Franklin Roosevelt）就任美國總統後所實施的一系列經濟政策，其核心是三個 R：救濟（Relief）、復興（Recovery）和改革（Reform）。'
  merge: -1
  img_proc: true
- pgno: 227
  md: '公司，提供相對競爭優勢。凡是密切觀察這種稅對成功企業影響的人，很快便會明白，它對企業決策造成的日常影響是，成功企業不再像原先那樣努力減少浪費與無效率。因為對這些公司來說，只要這種稅持續課徵，政府便會繼續亂花錢，企業於是就習慣奢侈浪費。它甚至對勞雇關係造成不良影響，因為它無法為員工解決問題，一大部分的罷工成本，實際上是轉移到政府身上。


    這種稅最初獲得的主要支持，來自所謂的民主黨開明派。1952年，共和黨政府上台，許多投資人以為共和黨會堅決反對這種稅，但事實證明並非如此。當新政府呼籲暫時延長這種稅，理由不是說它是一種好的稅，而是政府需要這筆稅收，改變立場的共和黨議員人數多得驚人。同時，更驚人的是，一些較開明的民主黨人，看到這種稅在他們的州造成弊病之後，也轉變了立場，徹底喪失原先對這項立法的熱誠。由於政黨立場時常轉變，同一個政黨的黨員性格及看法有許多歧異，以致黨派立場很不堅固，只要大多數美國選民保持像今日一樣的中間路線，實際或可能的政黨勝選或敗選，將仍舊不會成為長期投資決策的穩健基礎。


    如果在現今的政局下，這些單純的政黨勝選或敗選，不會對長期投資規畫造成影響，它們會影響短期投資或入市時機的看法嗎？我們假設，'
  merge: -1
  img_proc: true
- pgno: 228
  md: '基於本書其他章節倡導的基本理由，你已經對買進或賣出一檔股票做出決定。如果這項決定是在很接近選舉日的時間，只要牢記下列事項，通常可以取得好一點的價格：


    那些富裕到足以大幅影響股價走勢的人，似乎認為共和黨勝選會讓股票上漲，而民主黨勝選會讓股票下跌。然而，由於總統與國會選舉十分受到矚目，以及選舉結果的專業意見（例如賭注賠率反映的狀況），幾乎都是正確的，股市多年來在實際投票日前的一段短期內，便已預先反映選舉新聞。這表示除了在少數選舉意外翻盤的情況下，全國大選後的下一個交易日，股市走勢會跟大多數人預期的正好相反。換句話說，若按照以往情況，選舉結果如同專業政客預料的，選舉後的那天，民主黨勝利的話，股市反而會大漲，而共和黨勝利的話就會大跌。舉例來說，民主黨的富蘭克林·羅斯福總統（Franklin
    Roosevelt）那 4 次壓倒性勝選後的第一個交易日，股市都大漲。同樣地，1946 年共和黨在 18 年間首度全面大勝，囊括參眾兩院主導權，這也是早在兩黨專家的預料之中，翌日股市出現單日崩跌。牢記這些事實，並據此提早或延後選舉時期的交易，基於健全理由，可讓計畫在這種時候交易股票的人多賺一些。


    那麼，偶爾發生選舉翻盤的時候，也就是選舉結果沒有按照賭注賠'
  merge: -1
  img_proc: true
- pgno: 229
  md: '率與政治專家看法的時候，該怎麼辦？這時候，民主黨勝選似乎會造成進一步賣壓，以及股市大跌。這正是 1948 年杜魯門總統（Harry Truman）意外當選後的情況，或許，這是
    20 世紀唯一一次真正總統大選翻盤；另一方面，當共和黨意外勝選，翌日股市可能出現放煙火慶祝行情，1954 年的國會大選，就是這種情況，民主黨原先預料將橫掃選舉，以大幅領先從共和黨手中奪過國會控制權，然而，副總統尼克森（Richard
    Nixon）發動最後時刻的強力助選，把共和黨在美東的災情減輕到最低，並讓民主黨在美西大敗。民主黨在國會領先的席次，意外少到可以忽視，結果，隨後好幾天，而不只是一個交易日，股價都是大漲。


    比較選情翻盤的隔天，與沒有翻盤的隔天，我們會看到一條很容易遵守的規則，就像遵守下列這條基本規則一樣：不要因為政黨選舉結果而做出投資決策，除非直到多年來維持的政治氛圍出現改變。這條規則就是，如果你無論如何都要在選舉時期交易股票，以賭注賠率認為哪個政黨最被看好作為參考。如果是預期共和黨勝選，就在選舉前一天賣出股票，然後在選後至少一整個交易日才買入股票；如果是預期民主黨勝選，就在選前買入股票，但等到選後大漲才賣出股票。如果原本預料民主黨勝選，結果竟然出現翻盤，共和黨取得意外領先，你或許會發現自己遵守這條市場擇時規則真是太有價值了。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 第5章

    1960年代的主要成長產業


    我相信，想讓自己的資金取得最大長期增值的投資人，務必要徹底了解我即將在本章談到的一些重點。然而，我認為同樣重要的是，投資人要知道，了解這些重點，對他的幫助是有限的。閱讀本章不是為了跟讀者報明牌，告訴他們該買進及持有什麼股票可以賺大錢。事實上，雖然這個有些偏離目前的主題，我還是必須說，我不相信閱讀本書或任何其他書籍，就可以看到這點。從一本書寫作到讀者看到之間，必定會有一段時間差距，使得一本書成為股票明牌資訊來源的機會，是極為渺茫的。


    投資人閱讀本章能得到與不能得到的好處，與一名釣客研究新地區的'
  merge: -1
  img_proc: true
- pgno: 231
  md: '釣魚指南非常近似：就算閱讀一份很好的山區溪湖釣魚指南，也無法保證會釣到很棒的魚。這是因為即使是最好的紙本釣魚指南，也無法告訴你在什麼時間可以釣到珍貴的魚。同樣地，等讀者讀到一項特優投資標的時，情況或許早已大幅改變，就像溪流的釣點一樣。如果有許多人都知道一項吸引人的投資，價格或許已經到令其大賺機率沒有１、２年前或１、２年後的水準。


    我覺得，應該要進一步討論釣魚指南跟本章內容之間的對比。我們已談過釣魚指南做不到的事，那麼它可以做到什麼？它可以告訴你，在哪些特定溪流的彎曲處、特定湖泊，甚至這些湖泊水岸區段，最容易釣到魚。同樣重要的是，它會告訴你，哪些地方最容易釣到哪些種類的魚。或許對這個地區的新釣客來說，最重要的是，釣魚指南會告訴你一定不會釣到哪些種類的魚。


    在大眾的心目中，有一些產業跟成長聯想在一起，就像一些溪流的水岸，讓一名新釣客聯想到魚一樣。然而，我猜想，這些產業提供的投資種類，跟其他產業的投資差異，遠較一條溪流的魚種，跟不遠處另一條溪流的魚種的差異大。我認為，了解這些關係，會協助熟練的投資人鎖定他想調查的地區（也就是產業），以找出可以進行何種投資。這也可'
  merge: -1
  img_proc: true
- pgno: 232
  md: '# 第五章 1960 年代的主要成長產業


    以幫助許多既沒有時間也沒有背景知識自行管理投資、必須依賴投資業專業人士的投資人。這可以幫助他們評估投資專業人士的工作，以及了解他們現在或潛在的顧問，可以幫他們做些什麼。


    有了這些目標，來看看大家經常去尋找所謂的「成長股」，而且偶爾會找到的一些主要領域。我們稍微深入一點，看看這些產業彼此之間的

    不同，這樣就可以說明為何這些差異，會創造出全然不同的投資種類。它也可說明要找尋何種標的，才能最完整地利用偶爾出現的機會。


    # 化學業


    首先，我們來討論化學業。我不想糾結在準確的定義，而是為了投資目的隨興假設，化學業公司的主要業務，包括利用存在於自然的簡單量子，把它們重組成更複雜的物質，使之具有特殊性質而符合經濟利益。這種隨興的定義，排除硫生產商及肥料公司等事業，理由是（業者本身或許不同意），基於投資特性的立場，這些公司主要活動涉及的化學並不是很複雜。它同時排除製藥公司，理由同樣隨興，因為它們的化學過於複雜，而且經濟背景完全不同，就投資來看，屬於完全不同的產業，具有完全不同的投資特性。'
  merge: -1
  img_proc: true
- pgno: 233
  md: '符合這項定義的公司，在過去 50 年來，是所有美國產業當中成功紀錄最可觀的。事實上，化學業與極為成功的投資的關聯，緊密交織在一般投資人腦海裡，許多人認為，化學業是想「快速致富」的希望寄託，他們因為過去的大成功，而有了這種想法。還有報導指稱，即將有更多五花八門的新產品上市，必然可推動銷售成長，並進一步獲利，這類報導有許多看起來很真實。他們把化學業看成某種魔術輸送帶，一端是一些試管，由其中產生出無數的神奇新產品。這些五花八門的新奇產品，由輸送帶送到終端消費者的途中，便會自動且無止境地為幸運的製造公司創造更多利潤。


    我認為，最偏離事實的，莫過於說化學業是美國一個主要的快速致富產業。


    實際上，它完全不是快速致富產業；相反地，它相當不同。化學業提供現代美國投資人，一個以「緩慢而穩定」速度致富的最佳機會。容我解釋及佐證這項說法。


    在常見的情況下，統計數字會依據採用的數值而有些出入。然而，一般來說，比較化學業跟所有產業的銷售額曲線，便可看出，就很長的期'
  merge: -1
  img_proc: true
- pgno: 234
  md: '間來說，化學業在美國的成長率，是所有產業每年約 3% 成長率的 2.5 倍到 3 倍。這個產業研發費用愈來愈高的上升趨勢，加上具體證據顯示，實驗室開發的各個階段都有大量新奇產品，強力保證化學業跟整體產業比較的成長率倍數至少可以維持好些年，它的前景甚至有可能更好，由於一個產業的不同公司，絕對不會用相同速度成長，運用簡單的算術便可看出，成長最快的公司，可以顯著超越業界平均水準（化學業的平均成長水準至少是所有產業
    3% 年增率的 2.5 倍，也就是每年成長 7.5%），足以高過一些金融權威認為，真正成長股起碼該有 10% 平均年增率。這種持續成長率，將足夠滿足幾乎每一位投資人。然而，這通常無法促使股價一年又一年大漲，類似其他產業的一些飆股，例如電子業，不同領域的龍頭股，維持平均年增率達到一年
    25% 到 40% 的驚人速度。


    在這個可能擴張的市場，除了成長率之外，還有另一個理由，必然會限制內部有機成長率，甚至連成長最快的龍頭化學公司也不例外，這個比率會壓低到 25% 到 40%
    以下；對其他產業來說，偶爾見到這樣的成長率，就很驚人了。理由是，因為這個產業大多數的廠房擴充形式，需要不尋常的龐大資本。


    即使有最高明的化學工程技術，花 1 美元建造的新廠，也才能生產出'
  merge: -1
  img_proc: true
- pgno: 235
  md: '1 美元的額外產品，幾乎全部所謂的「通用」或「基本」化學品都是如此，這些是該產業複雜生產技術的起點。獲利較多的中間與最終產品，大多數也是如此。光是這項因素本身，就會抑制一家經營完善的化學公司成長率，還有如何藉由出售股票來融資，得以進一步成長，又不致稀釋每股獲利的老問題。為此，化學公司大多數擴廠都是經由保留盈餘或貸款來融通的。如此一來，如果推出熱門的新產品，雖然可能創造極高的利潤，而利潤增加，又可以融通更多新產品，形成「超級複利」的無止境成長，不過，在
    1 美元新增銷售額需要 1 美元資本來擴廠之下，一家公司每年的成長，顯然是有最高速限的。


    此外，廠房的高昂成本，加上這個產業的複雜生產技術，還會用另一種方式，來抑制業界龍頭公司的成長速度（但不是成長機率）。實驗室要研發出一項潛在市場龐大的新產品，單是這個階段，通常至少費時數年。接著，公司必須想盡辦法，去避免投入龐大資金建造新廠，以及用未經測試新製程可能產生的風險。因此，他們會蓋一座試驗工廠。通常，會先蓋一座小型的試驗工廠，以便讓製程在最簡單的情況下運作。然後，在進行過各種調整，由小型試驗工廠取得最好的結果之後，蓋一座大型試驗工廠，再花好幾個月，在不同的情況下進行調整、測試。即使現在終於亮起綠燈，可以進行量產了，這座新的最終產品工廠，在一般狀況'
  merge: -1
  img_proc: true
- pgno: 236
  md: '# 第5章 1960年代的主要成長產業


    下，也需要一段長時間才會動工。它需要大量的特殊中間化學品，而這又需要大量的基本化學品。通常，在工廠鄰近地區，都無法取得這兩類化學品的足夠數量，因此，必須興建、改善，或是擴大基本化學品工廠，才可能完成新的最終產品工廠。由於新廠的每一步，都必須經過困難的新創階段才能「上線」，從實驗室研發出令人興奮的重大新產品，到真正開始量產，通常要花上很多年。接著，又需要更多時間，來讓一般潛在顧客相信新產品的優點。


    然而，如果這些事情，是投資人由投資一家成功化學公司而快速致富的主要障礙，它們同時也可能是一項優勢，因為除了一些高度專業領域之外，龐大資本需求往往阻止新成立的公司進入化學業與之競爭，這與美國產業其他快速成長的領域不同。但是，這種龐大的資本需求，卻無法阻止其他產業的大公司大量湧入化學領域，試圖分一杯羹。我認為，這種情況值得密切研究，但與金融界許多人的看法不同，我相信，優良的傳統化學公司投資人可以安心。原因是，一些生產技術與化學業極為相似的石油公司與橡膠公司，雖已成功建立起化學業務，尤其是在與它們原料極為相近的領域，但一些舊化學公司也成功轉型為油氣生產商，自行取得原料與電力供給，至少扳回了一城。而且，即使是幾年前野心勃勃想設立化學工廠的石油與橡膠公司，以及許多開始進軍「燦爛」化'
  merge: -1
  img_proc: true
- pgno: 237
  md: '學業的其他產業公司，我認為結果都不如人意。生產技術複雜只是其中一道門檻，為維持高研究生產力，以及銷售給許多不同種類的顧客，通常會構成比原先預期更棘手的問題。


    在二戰結束後不久試圖「進軍」化學業的大量公司，現在已經可以看出眉目。我相信，一些結論已是很明確了，對一些基本化學品，像是阿摩尼亞及苯乙烯等來說，這種競爭很激烈，特別是自設電廠的前化學業顧客。尤其是生產過程沒有產生重要副產品，一名顧客即可吃下工廠所有產出（因此，不會發生嚴重的銷售問題），以及生產技術可由一家工程公司「統包」；意思是負責蓋廠的公司，可確保工廠順利運作，並訓練其顧客的員工經營工廠。符合這些情況的產品，我猜想將有愈來愈多生產商蠶食未來的成長，導致近年來獲利率縮減的情況將持續下去。


    然而，一旦離開這些較不複雜的基本化學產品，進入較為複雜的業務，而這些正是大多數最成功化學公司的核心業務，競爭態勢就有了急遽改變。在這裡，許多產品都是彼此的副產品，你必須找到所有產品的銷售管道，這個問題有時是藉由銷售給許多顧客來解決，有時則是研究更新的產品，來吸收一些剩餘的產品。所以，你不但要在化學工程及化學研究取得領先，而且要保持領先，這就變得極為重要。我認為，只有少數'
  merge: -1
  img_proc: true
- pgno: 238
  md: '新的化學業者可以跟上腳步，即使做到這點，也不代表增強了競爭力，因為有些是藉由合併而做到的，也就是藉由舊有化學公司的協助。我冒昧說一句，雖然化學市場仍將持續像以往一樣，至少跟總體經濟同等速度成長，深入了解這些問題之後，便不會重演
    1940 年代後半期，那種外行人大舉湧入化學業的情況。因此，過去 10 年得以維持競爭地位的公司，至少在未來 10 年也會做得很好。


    當然，這句話只適用於產品線夠多元的化學公司，它們受到平均法則（law of averages）的保障。如果一名競爭對手的技術進步，使得它部分產品線變得陳舊，也只會影響到整個業務的一小部分而已。該公司自己的新技術對其他產品帶來好處，因而增加了競爭力，很有可能完全彌補對手的影響。在這個產業，一家專業公司有時會出現驚人成長，例如，泰爾克化學（Thiokol
    Chemical）是因為政府需要火箭用的固體化學燃料。然而，投資人必須隨時記住，專業公司同樣可能出現逆轉，不是因為它們自己出錯，而是因為出現一項改變更大的技術。


    總結來說，過去 10 年來，再度證明在異常嚴峻的情況下，現代化學業的歷史，證明了一項基本投資因素，那就是一家多角化經營的大型化學公司（以便在業界出人頭地），必須結合大量技術與高度商業判斷，'
  merge: -1
  img_proc: true
- pgno: 239
  md: '以生產愈來愈多複雜但具相關性的化學產品。一旦成為這方面的佼佼者，該公司便取得許多不同業務的「專業知識」，外行人很難在同一時間嫻熟這麼多業務，以便在平等條件下跨入這個領域。這代表一旦一家多角化經營的化學公司，成為一些領域的領導者，只要做到兩件事，便可以保持這個地位：①技術領先必須至少跟上涉足領域的速度；②該公司必須具備良好的商業判斷。在基本策略與行為準則已深植於一些領先化學公司之下，一些化學業龍頭似乎必然可以做到這兩件事。


    現在，就考慮投資化學業的人來看，這些投資特質有什麼重要性？在化學業，格外容易挑選最吸引人的公司作為長期投資，因為以往的紀錄可作為參考；技術領導廠商與低成本生產商的特點，大多數可以輕易查到，因此，要買什麼樣的個股，並沒有什麼困難。這個情況，跟大部分為投資人提供成長機會的其他產業，形成強烈對比，在那些其他產業當中，挑選買進的個股就困難許多。


    然而，從實際來看，若投資人可以很輕鬆找到未來必然會大幅成長的化學公司，對他來說，其實沒什麼好處，這是因為既然他很容易便能找到這些公司，對許多其他投資人也一樣容易。結果，這些好的股票，往往被推升到預先反映這種成長的價位，所以，績優化學股通常本益比都'
  merge: -1
  img_proc: true
- pgno: 240
  md: '很高。


    有關在高本益比的價位買進化學股的「危險」，已經有很多 пре 寫過，但許多都是出於沒有眼光的人在胡說八道。雖然隨時都有可能發生短暫的市場下跌，而造成這類投資（或任何其他投資）出現短期虧損，但一些化學股至少可以確保一定的長期利得，這是因為它們有很高的可能性，可維持穩定成長。然而，在一般時期買進化學股之前，仍要牢記兩件事：


    第一件事，是一些其他化學公司素質略低於或大幅低於最吸引人的化學公司。由於許多投資人習慣找尋「差不多一樣好，但沒那麼好」的投資標的，這些「沒那麼好」股票的本益比，往往跟業界龍頭一樣高。買進這種股票或許有點危險，因為它們無法保證會有支撐高本益比所需的成長。一旦出現證據，顯示無法達成這種成長率，本益比便可能大幅下跌，這可能造成投資的永久虧損。每當你急著想在高價位買進化學股時，要記住的另一件事是：儘管在時間夠久之後，買進最佳化學股必然會獲得一些利潤，但只要運用一些自我紀律，就可能藉由投資這些好公司，獲得更大的長期利得。


    這讓我們開始討論買進績優化學股，以及其他好的成長股之間，投資'
  merge: -1
  img_proc: true
- pgno: 241
  md: '觀點有何差異。如前所述，挑選最佳化學股非常容易，因此，「買什麼」的因素便顯得不那麼重要（註①），「何時買」便成為需要深思熟慮的事情。


    在大熊市形成之際，造成幾乎所有的股票光環褪色，這時最適合買進績優化學股，以獲得大幅長期升值。尤其是如果熊市背後的經濟理由，是景氣衰退或蕭條的話，更是如此。除了大多數股票在這種時候可能都已進入買進區間，還有一個更基本的理由，那就是化學業的經濟結構。


    在年頭好的時候，多頭氛圍往往造成太過樂觀的結論，投資人常因化學業的重要新產品而追捧，他們做出錯誤的結論，以為化學業不會受景氣衰退影響，這是大錯特錯的。因為必須事先擬定計畫，為這些新產品準備生產設施（並滿足舊產品在景氣繁榮時的需求），化學生產需要長久的前置準備時間，致使新產品無法預防產業過度擴張。一般來說，每當景氣曲線意外下降時，總會出現產能過剩。不過，在每次景氣繁榮時，「這個產業的強勁成長率使它可以『抵抗』景氣衰退」的投資迷思，似乎會一再浮現，下場通常就是迷思幻滅，在景氣衰退開始的時候，最好


    註①：編按：因為很容易找到好的化學股。'
  merge: -1
  img_proc: true
- pgno: 242
  md: '的化學股下跌速度，就跟劣質的股票一樣快。


    然而，當此股市低迷之際，根據股票經紀商的研究，又會重新「發現」化學公司獲利仍是會受到景氣循環影響，但化學業獨有的經濟結構再度發揮作用，好的化學股買點也已浮現。這是因為憑著平均成長率至少是整體產業的
    2.5 倍（當然，如果是頂尖的化學公司，成長率將遠高於這種業界平均水準），其他新產品即將出現，舊產品也會出現新用途。因為這些新產品的原料，大多是一家公司原已生產、現在有過剩產能的相同基本化學品和中間產品，它很快便可開始利用部分的過剩產能。這個時候，獲利成長回復速度將遠高於整個業界。換句話說，就景氣衰退來說，化學業成長率的真正意義不在於不會發生劇烈下滑，而在於景氣下滑的時間比整個業界短，也更快達到新的高峰。這表示最佳化學股的價格下跌可能很短，掌握這一點，可為投資人帶來可以成長好多年的良好投資，而且，買進價格可為投入資金創造驚人的增值。


    我在撰寫這些文字時，企業界與金融圈的樂觀氛圍高漲，幾乎所有人都認為，「黃金 1960 年代」根本不會發生景氣衰退，即使有，也是輕微、短暫，不需要擔心的。如果大家沒忘記在
    1958 年春季觸底的那波短暫衰退時，當時工商業界瀰漫著愁雲慘霧，金融界甚至更嚴重，但其實那'
  merge: -1
  img_proc: true
- pgno: 243
  md: '波的景氣下滑並沒有像預期中那麼嚴重的這項事實，這個事件似乎讓美國民眾更確信景氣衰退不再值得擔憂，景氣榮景將持續下去。


    我不想再重複在其他地方針對這個主題說的話，經濟史一再向我們證明，這種看法很危險。不景氣，似乎是我們為了維繫自由競爭的眾多優點所必須付出的代價。它們向來是在意料不到的時候出現，而愈是意料之外，它們對股票價格的影響也愈大。此外，傳聞中的「內建經濟穩定器」，根本無法對抗景氣衰退；這些東西只能承諾景氣衰退會比較短暫。因此，或早或晚，1960
    年代某個時候，將會像晴天霹靂一般地出現典型的景氣衰退，屆時，理所當然地，在股市裡，陶氏（Dows）、杜邦（DuPonts）及其他大型化學公司，首先會跟其他股票同步下跌。在這個時候買進這些股票的人，並不是用低價買進成長最快的股票；相反地，他們買到的，是雖然較慢但很理想的成長率，而且，高度確定這種成長一定會出現。在未來因景氣衰退而造成股市短暫波動時，那些有眼光、還是一直持有這些股票的人，這些股票很有可能再次證明它們是絕佳長期持股，以往它們已一再證明了這點。


    還有另一種情況，有時成為買進上選化學股的良好時機，而且不需判斷景氣循環，這種情況是利用：1. 新廠上線的龐大資金造成的暫時性高'
  merge: -1
  img_proc: true
- pgno: 244
  md: '成本；2. 新產品開始上市時的特別銷售成本，兩種情況皆會導致獲利減少，進而引發股價下跌。針對那些跟公司管理階層密切保持聯繫的人來說，這提供一個好機會，因為可用超低折價及風險買進絕佳的長期投資。


    這種投資機會的利潤頗豐，值得深入研究。通常，當一家新廠興建或重要新產品即將上市，該公司股票將吸引熱切投資人的大量買盤，這種買盤大多屬於投機性質，來自那些對技術問題一無所知，卻仍期待快速、輕鬆致富的人。當更換新設備的昂貴成本，造成公司一個月又一個月的虧損，而不是預期中的獲利，這類投機性的股票投資人在害怕之餘，往往會拋售持股。起初，跌勢很溫和，因為其他投資人會「逢低承接」。然而，隨著技術問題持續下去，愈來愈多股東感到害怕，當公司管理階層「麻煩大了」的傳言出現，股票便像石沉大海般下跌。通常，在克服技術問題好幾個星期之後，再過一段時間，新廠已開始創造好幾個月獲利的這段期間，股價都只會有小幅反彈。當然，這種買進機會較可能出現在小型化學公司（或是化學加工業的公司），而不是大公司。通常，以最大型的公司來說，設立一座新廠的龐大成本，對總獲利的衝擊沒那麼大，因為在同一期間，公司的許多其他工廠都有營運利潤。


    這種買進機會的經典範例，發生在 1958 年賓州瑞丁（Reading）的'
  merge: -1
  img_proc: true
- pgno: 245
  md: '鈹公司（Beryllium Corporation）股票。數年來，這家公司生產鈹銅合金材料，以及把這種合金材料，鑄造成那些顧客製造最終零件及其他產品所需的線材、條棒等，並在這個領域享有獲利與成長的事業。隨著這個領域證明成長前景，以及該公司具備強勁競爭地位，股票價位達到相當高的本益比。接著，鈹金屬開始展現令人興奮的前景，包括來自原子與航空業的消息，雖然生產鈹金屬與生產鈹銅合金材料是兩回事。1957年，這家公司與另一家公司，分別拿到原子能委員會的一紙5年合約，要它們提供超高純度的鈹金屬。鈹公司買下賓州海澤爾頓（Hazleton）一座老舊的火車頭車庫，開始安裝需要的設備。該公司股價到1940年代中期一直很低，但在鈹金屬為這家小公司帶來的ası前景推升下，大漲到59.5美元。


    不久之後，股市開始大跌，隨後便陷入1958年的不景氣。如果沒有鈹金屬的炒作，鈹公司的股價無疑會溫和下跌，這是因為原有的合金業務雖然還是賺錢，但不免會受到景氣影響，就像大多數原材料和零件供應商。然而，從瑞丁廠的銷售與獲利仍維持穩定看來，股價下跌原本應該很溫和。


    然而，在隨後慌亂的數個月，公司管理階層面對新廠的一連串問題，'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 第5章 1960 年代的主要成長產業


    情況就完全相反了。一個又一個意想不到的技術難關，需要去研究、診斷和解決，這些都要花錢，其中大部分還要花時間。月復一月，在 1958 年上半年，海澤爾頓廠的鉅額虧損，幾乎要吞噬原有業務因景氣衰退而減少的獲利，上半年財報顯示，公司勉強達到損益兩平。


    在這段期間，一些投資團體前幾年的樂觀氣圍早已消失，取而代之的，是深深的悲觀。沒有人能確定這段虧損期何時會結束，每當眼看虧損就要結束，就會發生新的麻煩。一如往常，有人開始懷疑問題是否能妥善解決。同時，雪上加霜的是，又發生了新產品推出前常見的問題——鈍金屬的近期需求，跟新廠設立時的情況很不相同，原能的需求事實上遠不如預估。雖然航空需求仍遠高於原先預期，卻無法驅散眼前原能需求不振的悲觀，因為航空需求仍屬於推測，而且是在未來才會出現的。


    在種種情況下，該公司股票的反應一如預期，1957 年終時，股價已失守 30 美元；1958 年前 6 個月，大量股票拋售於 24 美元到 30 美元的股價區間，大多數時候都更接近低價區。更有趣且典型的情況是，那一年的下半年有一段時間，海澤爾頓廠明顯好轉，但由於之前太過看空，導致許多投資人似乎仍不相信該公司真的已克服了生產問題。即使報導更看好鈍金屬應用在國防用途，還是可以在
    30 美元出頭買到該公'
  merge: -1
  img_proc: true
- pgno: 247
  md: '司的許多股票。即使該公司的合金業務興旺，等到年底時，股價也只回升到 38 美元到 39 美元水準，這正是鎳金屬廠在影響該公司股價之前的價位！一些投資人明白，這一切不過是運用新技術的工廠，在順利運作前時常發生的狀況，他們要不在這些問題最嚴重時的
    24 美元到 30 美元區間買進；要不就是減少風險、在這些問題即將解決時的 30 美元到 40 美元區間買進。他們做的，不只是買進一檔近期即將大漲的股票，逢低承接之下，他們買進的，是隨著嶄新產業將不斷成長的股票。


    隨著許多領域的技術步調穩定加快，對願意設法了解事實，而不是被華爾街情緒牽著鼻子走的人，這種機會在 1960 年代將更為頻繁地出現，多於過去 10 年。科技的步調愈快，這種機會就愈多。


    我相信，還有另外一種方法，可以在化學業用最低風險，獲得重大的長期利潤。截至目前為止，只有公認最吸引人的公司，才會有人投資，也就是那些有一段時間被消息人士視為擁有傑出管理階層的公司。然而，在化學業或其他產業，有些公司以前被視為在某一部分的管理能力很好，但其他部分的管理表現很差，後來這些公司換上一批新的管理階層，他們用公司以前的強項作為基礎，打造出一家整體表現很不好的公司。在任何產業，這都會造就絕佳投資機會。由於化學業具有成長高於平均水準，'
  merge: -1
  img_proc: true
- pgno: 248
  md: '以及風險低於平均水準的特殊吸引力，投資意願會更強烈。這是投資化學股千載難逢的機會：介入一家經營良好、很有可能大幅成長的公司，卻不必支付很高的價格。


    由於這種機會太吸引人，它們通常造成股價急漲，因為愈來愈多投資人看到機會。當然，在這種漲勢下，是沒有理由賣出的，因為這種管理階層能力精進的公司，未來可望持續成長。然而，這也意味著最佳買進機會已經結束了。


    說到這點，Nopco 化學公司的股價，在 1958 年 7 月 30 日到 1959 年 3 月 31 日之間大漲，是一個很有趣的例子。在發放股息後，公司股價在
    9 個月內漲了大約 1 倍。部分漲幅不是因為公司管理階層能力的評價改變，而是因為新產品上線前的高成本時期結束，類似皴公司的案例。建立新技術領域的生產設施時，經常會發生的情況，也同樣發生在
    Nopco，該公司堅固又有彈性的聚氨脂泡沫塑料，上線的成本比預想的高，時間也拖得更長。如今，這些產品不再虧損，開始出現獲利，股票價格也做出正常的回應。然而，我相信，這種漲幅代表更深的涵義。不久之前，該公司換上一位極為能幹的新總裁，各項高層人事異動隨後展開。一如往常，過了一段時間才開始出現實質證據，顯示公司已有了'
  merge: -1
  img_proc: true
- pgno: 249
  md: '長足進步。然而，這個新趨勢變得明顯之後，金融界的大咖逐漸注意到，這家管理階層很幹練的小化學公司，是他們以前忽略的。我相信，公司管理階層評價改變，遠勝過其他任何因素，是促使股價後來大漲的主因。


    食品機械與化學公司（Food Machinery and Chemical Corp.）這家較大的化學公司，大約在同期，股價也大漲 1 倍，主因也是金融界對管理階層的評價好轉。這家公司是一個很有趣的例子，因為它證明大型法人買家態度的轉變，對股價產生的極端影響，就像本書先前討論過的那樣，在
    1960 年代，法人的態度對股價的影響將愈來愈大。


    從 1934 年，到二戰結束之後不久的這段期間，食品機械與化學公司是股市的翹股之一。儘管少數法人買家看好（或許是因為他們對公司高層有信心），但該檔個股在隨後
    10 年至 12 年期間，並不受許多數投資人青睞。它的地位滑落，主因為該公司的化學事業大多是戰後幾年收購其他公司而來。這整個時期，機械部門一直被視為傑出的低成本生產商，公司的高水準研發工程，確保它能有機成長，並足以讓這些業務成為理想的法人持股。相反地，化學事業雖然銷售額占公司總額的一半，但利潤率遠低於法人標準，使得整個公司不被看好。工廠老舊、一些化學部門的員工士氣低落，以及公司沒有研發出令人興奮的新產品，都被'
  merge: -1
  img_proc: true
- pgno: 250
  md: '當成低獲利率將持續下去的證據。


    公司派遣新的傑出管理階層，來解決這些化學問題。一如往常，有好幾年的時間，大家沒有注意到有什麼地方獲得改善，公司股價並未上揚。公司管理階層經由提升效率節省的成本，大致上被大增的研發經費給抵銷，因此，真正的進展並不是很明顯。1958
    年下半年時，公司管理階層的驚人表現逐漸浮上檯面，吸引金融界的興趣。等到 1959 年，市場明白一家很優秀的化學公司已經出現了。


    在食品機械與化學、Nopco 的例子，搶在金融圈之前，意識到公司管理階層變動的投資人，可設法參與傑出化學公司的穩定成長，而不必付出投資人在參與這類成長時，經常要支付的高本益比成本。此外，就某方面來說，察覺公司管理階層的根本改變，是達成這個目標的最簡單方法，因為這些公司的新管理階層上任之初，股價很少跟著好轉，而是要等到一段時間，在他們工作成果出現之後，股價才會有所變化。


    投資人或他的顧問應該要很確定自己的立場，才能做出結論，說一家等級較低的化學公司，已經歷過真正的管理階層素質提升，足以確保它的投資評價大幅升高。一些紀錄不是很好的公司，有時會宣稱它們已經'
  merge: -1
  img_proc: true
- pgno: 251
  md: '改變做法。我想起數年前，有一家營收與獲利成長紀錄，並不是業界最好的一家知名化學公司，該公司計畫進行融資，一些高階管理階層與全美各地的金融集團開會，他們大舉宣傳公司已經出現的改變與改善，不久之後，該公司股票便出現一些買盤。我相信，這些買家之後大多認賠賣出，因為可以明顯看出該公司沒有什麼根本改變。


    # 電子業


    現在，我們來討論另一個偶爾可發掘豐碩長期報酬的重要領域，這個產業是電子業。


    由投資觀點來看，化學與電子業只有兩項重要的共同特徵：1. 它們幾乎都確定未來會有巨大成長；2. 在這兩個產業，這種成長會來自藉由成功研發，不斷推進科學知識的邊境。除此之外，這兩種產業的投資性質，可說有如極圈與熱帶的天差地遠。


    用熱帶來比喻電子業，並不如乍看時那麼誇大。這個領域年年維持高年成長率，在金融界之外是不可思議的，頂尖的電子公司，一年可以成長 25% 到 45%，這種成長率曲線再往後估算幾年，數值足以讓幾乎所'
  merge: -1
  img_proc: true
- pgno: 252
  md: '有長期投資人高度興奮。但如同熱帶叢林的激烈競爭，這種驚人的成長可能來得快，去得也急。


    多種影響力造成電子公司這種突然彼此互相超前，有時卻又急速落後的傾向。其中一個因素，是國防合約的重要性，各種鉅額合約中，有時由一家公司及供應商轉移到另一家。更重要的是科技性質，不但是科技用無比的速度前進，而且，在這個產業的重要（但不是所有的）部門，今日領先的公司，無法保證明日也會領先，電路設計師很容易便可抄襲及稍加改善另一名設計師的作品。


    比較化學與電子業，便可明顯看出化學公司成長率較低，但競爭安全性較高的其他理由。在化學業，就像我先前指出的，對大多數主要公司來說，假如每 1 美元的新資本支出，可以增加一年
    1 美元的產出，它們就很滿意了。但在電子業的大部分階段，機械設備並不是那麼重要，要增加 1 美元的營收，只需要 20 美分的新廠與設備，有時甚至只需要 10
    美分即可，這表示新對手僅需要很少的資本，便可以跨入電子業的許多（但絕不會是所有的）部門。此外，批量製造（batch manufacture）通常發生在這些低資本成本的領域，因此，一名有效率的新對手生產某些電子產品，像是一些特殊用途的真空管，往往可以跟業界大廠一樣低'
  merge: -1
  img_proc: true
- pgno: 253
  md: '成本。這跟新對手企圖在一項主要化學製程競爭時，至少需要數百萬美元，以及新對手若想跟大型生產商一樣壓低生產成本，需要有龐大產量相比，簡直有如天壤之別。最後，許多產品彼此之間是副產品，因此可以阻擋新競爭的特色，這在較複雜的化學業很普遍，但在電子製造是前所未聞。簡單來說，由於電子業起步的資本門檻很低，許多部門只需要少量生產，以及可能靠著一份大型政府合約便展開事業，不難想見新公司與傳統產業的大公司，不斷大量湧入這個產業。


    那麼，就投資來說，電子股大漲的可能性更高，勝過最佳化學股，但也面對更大的競爭風險，因此，挑選電子股的重點與化學業大不相同。市場擇時的因素，也就是「何時買進」，變得沒那麼重要。如果電子公司有合適的產品及管理階層，大幅成長可能會急速出現（除非股價早已全部反映這兩件事），所以，任何時候都是買進「正確」電子股的正確時間，即使是在大熊市降臨之初也一樣。但買進什麼股票（通常在挑選主要化學公司時，是相對簡單的事情），不但變得更重要，也變得更困難；因為選錯公司的話，虧損會很驚人。


    大致上來說，在挑選可能表現突出的電子股時，需要評估兩件基本事情：第一，是該公司要用多快的速度成長，才能夠維持產品的需求市占'
  merge: -1
  img_proc: true
- pgno: 254
  md: '率？第二，是該公司維持這種成長，而不被競爭對手意外超車，破壞成長曲線的可能性。在 1950 年代後期電子股經歷的瘋狂牛市，這些事情首度受到全體投資人的注意。然而，某些產品和某些公司的性質，使得它們在第二件事，也就是突然被對手趕上的風險，遠低於電子業許多其他公司。隨著
    1960 年代來到，我相信，1950 年代後期一些電子熱門股的粗心投資人，他們在經歷不愉快的經驗後，會導致第二個因素比起第一個因素更受到重視。在我看來，電子股應該要符合這兩個因素，才值得考慮投資。如果確實符合，我認為，1960
    年代將再次證實 1950 年代後半期不斷戲劇性出現的情況，如果投資人能夠搶先在整個金融界了解該股票的強項之前便買進，這種股票的獲利，會超越你所能想像的程度。


    這段時期，眾所周知的是，即使是小額投資 Ampex 或德州儀器（Texas Instruments，簡稱「德儀」）這類公司，從 1950 年代中期持有到後期，便可奠定一個人財務獨立的基礎。或許大家已極為熟悉這段歷史，電子股的漲幅不是以數倍計算，而是數十倍，重點在於這些電子股的驚人漲勢。同時，我們也應該注意到，只有一些電子股為它們的股東創造豐盛報酬，許多其他電子股就像曇花一現，它們或許在一段短時間飆漲，但只是一次性的表現而已。'
  merge: -1
  img_proc: true
- pgno: 255
  md: '雖然搶在市場追捧之前，挑選正確的電子股，是很難做到的，但如果做到了，便會有極大的回報，基於這點，我相信，值得花一些篇幅來說明一些特點，好讓投資人有很高的機率，可以選到未來的最大電子股贏家。當然，投資電子股（或是任何其他產業的股票投資）可以簡潔歸納為，經營得最好的公司，會是漲幅最大的，儘管這句話對幫助潛在投資人來說，或許還是有些不足。這句話確實是對的，尤其是在像電子業這種競爭激烈的產業，如果在優良企業管理的主要層面缺乏高度效率的話，即使是強大的專利保護與高水準工程都無法長期確保進步。除了這點之外，投資人還要注意哪些優良企業管理的其他層面，才能挑到前景大好的電子股？


    我相信，以下是特別重要的幾個特點：


    1. 這家公司是否有研究單位，可以不斷在它的領域保持領先，而不只是暫時領先？


    我認為，德儀這家成功電子股的典範，正可證明這點的重要性。幾年前，該公司在矽電晶體的商業發展取得領先，就當時該公司的資源，不過是一些大型競爭對手的一丁點兒來看，許多人質疑德儀能否長久保持'
  merge: -1
  img_proc: true
- pgno: 256
  md: '領先。然而，德儀在那之後的進一步研發與工程進步，讓許多競爭對手非常辛苦，總是掙扎著要達到德儀的位置，但等到它們終於到達這個目標之後，才發現這家小規模的德州生產商，已又再前進到新的位置。然後，這種我追你跑的過程一再重複，這使得這家以前屬於小規模的半導體生產商，在這個美國所有產業裡成長最為快速的領域持續保有很高的市占。隨著半導體產業逐漸機械化，以及行銷的標準模式形成，這個產業正經歷無可避免的循環，淘汰掉許多沒有效率的小生產商，剩下少數有效率的大生產商。這表示，不過幾年前這家還是很小的公司，已設法爭取到有力競爭者的幸運地位，因此證實其股價配得上高本益比，不像以前它被視為一個有前景但未必賺錢領域裡的眾多小公司之一。這種獲利不斷改善與本益比不斷上升的雙重效應，促成德儀股價的大漲。


    如果研究與工程尚不足以讓一家電子公司保持領先的話，另一個因素就變得很重要，我認為德儀是絕佳範例。德儀聘雇的高階人才，以及投入在研發的數百萬美元，都不足以創造它的成果。在這些之外，研究單位與超高水準的銷售與行銷單位相互連結，導引半導體事業的研究活動方向，以創造未來更大的銷售潛力。在半導體和電子業的許多其他層面，這個領域成長的速度極快，幾乎沒有哪一家公司，可以探索與研究自家專長可應用的所有產品。如果公司有眼光和團隊合作，可以把研究單位'
  merge: -1
  img_proc: true
- pgno: 257
  md: '導引到未來市場更廣大的專業領域，便能由研究經費獲得更多利益。即使只是因為它們可以用最快的速度擴大產量，並享受到擴大產量創造的降低生產成本，這種公司也會有更可能超前競爭。


    雖然研究與行銷（或市場研究）的密切合作，對提升研究成果有很大的作用，在電子業的許多部門，研究人員與負責製造及銷售問題人員之間的合作效率，也同樣重要。光是生產市面上還沒有的更好裝置，並不足夠，因為其他人可能很快也會做出同樣好的裝置。開發工程師與銷售人員密切合作之下，知道如何改善設計，在提高基本效率之外，更能迎合顧客的偏好與偏見，也可以創造決定性優勢，勝過完全依照工程標準來設計產品的公司。同樣地，可以依據基本工程與顧客需求來設計產品，並可以用更簡單、更低價方法去生產的公司，會享有顯著的價格優勢，勝過那些因生產及研發沒有密切合作，導致產品成本墊高的對手。


    實際上，不論是在電子業或其他產業，如果說持續成功的公司研究活動中，有一個最重要的特點，就是團隊合作。今日的科技通常已具有足夠深度，領先的產業研究，需要集結許多科學專業背景的一群人，而不是單一背景。開發一項產品時為了取得突破，理論物理學家、數學家、無機化學家、冶金學家和固態物理學家可能都需要一起投入。此外，同'
  merge: -1
  img_proc: true
- pgno: 258
  md: '一家公司正在進行的一項相關計畫，或許需要6名不同的專家，這些人如何一起合作，可能是他們技術成果的決定性因素。然而，他們對股東的貢獻，不僅取決於這些技術專家是否能合作無間，也取決於他們能否跟銷售、製作、市調的一般商業人士合作，尤其是公司管理階層。在現代產業的情況下，可以說是三個臭皮匠勝過一個諸葛亮。


    反過來說，管理高層的視野如果夠寬廣，可以了解技術人員的目標，並與他們合作，通常可以為股東創造出更好的成果，遠勝於那些只看得到研究計畫眼前獲利的管理階層。基本上，有許多高階技術人才更在意達成技術進步，以及贏得他們在專業同僚之間的地位，而比較不在意賺錢。公司管理階層若是明白這點，並設法支持一名研究人員，做出重大的科學貢獻，而這名研究人員也知道，公司管理階層明白這項計畫不會有什麼近期報酬，那麼，如果管理階層妥善管理研究的的話，通常可以獲得可觀的長期成果，因為所有技術人員會加強團隊合作及提高生產力。在團隊合作與熱誠對成功極為重要的研究活動中，公司管理階層若能技巧性地領導研究人員維持高忠誠度與動力，該公司便可望維持年復一年的進步。


    電子股投資人在研發事項上，有什麼應該要注意避開的陷阱呢？在我'
  merge: -1
  img_proc: true
- pgno: 259
  md: '看來，有兩項很常見的錯誤是投資人應該要注意的：第 1，是投資人絕對不要只因為某位傑出科學家，例如諾貝爾獎得主，加入一家公司、即將大展身手，便買進該檔股票。現代產業不是那樣運作的，新來的人，或許是這個領域全球最強的專家，但如果他沒有得到其他專業領域，以及市場調查與製造等一般領域傑出人士的協助，很可能只會在該公司激起短暫火花。即使該名傑出科學家技術能力再好，如果無法達到團隊合作的要求，不但無法激起短暫火花，反而只會造成龐大開銷。許多投資人後悔自己太過衝動，聽到
    X 博士或 Y 教授加入一家公司，便買進該公司股票，而沒有好好檢查他是否融入該公司，或是該公司是否有安排適合成他的職位。


    投資人在研究活動第 2 個常見的錯誤，是單純因為一家公司研究支出龐大，或許是相對股價占比高，或是相對全年營收占比高，便買進股票。首先，除非做出最仔細的會計調整，這些資料很可能誤導人。一家公司可能把許多成本列為研究經費，而另一家公司可能將之列為工程銷售成本或直接生產製造成本。近年來，由於管理高層知道，華爾街有很多人十分重視每年的研究經費，便產生一種不好的習慣，一些公司把所有可能的項目都列入這一項。但即使進行會計調整，還有另一個基本理由，讓依賴這些資料的投資人，可能會損失慘重。所有產業（廣告業或許例'
  merge: -1
  img_proc: true
- pgno: 260
  md: '外），各家公司的研發支出到產出給股東的利潤之間，彼此間的差異頗大。以 10 年期間來看，假如只算營運最好的公司的話，這種差異最高可達 3 比 1。如果比較平庸的公司與一些最優異的公司，這種「研究生產力」的因素，在公司之間的差異，可能達到上述比例的許多倍。顯然，股東重視的，是他可以得到的長期利益。而在這個利益與花費最不成比例的企業活動層面，股票投資人不是用研究成果來評估一家公司的吸引力，反而是研究經費花了多少錢！在評估電子股吸引力的時候，我們需要調查的特點將證明，為何太過重視這種簡單的數學比率、這種粗糙的指引，可能導致極為誤導性的結論。


    # 2. 這家公司的產品，在國防相關與民用事業之間的比率是否健全？


    電子股投資人絕對不能忘記一件事，是電子產業有 49% 的業務，都是直接或透過承包商，來自於美國政府的；這些幾乎都是軍事應用。況且，如果冷戰情況持續，這種巨大需求不僅很可能成長，而且還會大幅成長。由於長程飛彈，以及局部地區戰爭使用的傳統武器等領域的工程進步，需要愈來愈多電子產品。同時，這些工程進步需要更加精密、因此也更昂貴的電子系統，高過它們所取代的武器，所以，在軍事電子市場，擁有優異電子與製造能力的公司已為它們自己開啟龐大銷售量的機會。'
  merge: -1
  img_proc: true
- pgno: 261
  md: '然而，從投資人的觀點來看，軍方業務通常遠不如相同金額的民間訂單來得理想。這裡列出一些理由，其中最不重要的或許是，獲利率通常很低。這並非不合理，因為有時訂單的龐大數量，足以讓獲利總額彌補較低的獲利率。


    軍方業務一個基本缺點是很不穩定。如果武器競賽能終結，東西方能重新建立真正的信任；大家一直希望遲早可以找到方法達成這個目標，對所有大國來說，絕大多數公民都將共蒙其利，假如真的實現，大型軍方供應商就會失業了。然而，即使排除這種可能性，以目前全球緊張局勢來看，似乎不太有希望，軍方業務的不穩定因素仍遠高於民間業務。


    「為了政府方便」，合約在無預警下被取消是很常見的事。電子採購的科技步調不斷加快，讓這種情況不僅沒有減少，還可能變得更頻繁，因為一家承包商可能設計一種武器系統，讓既有系統變得陳舊而無用。


    造成這種不穩定的因素，還包括很難在政府業務建立起民間業務關係常見的「善意」(good will)。如果一位重要的固定供應商在估算成本時出錯，而在一項重要合約賠錢了，開明的民間企業往往會進行適當的合約調整，雖然這在法律上並沒有必要，公司不需要那麼寬厚地支付高於法律要求的價格，但這種善意往往在日後當買家急著買貨，需要協助'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# 1960年代的主要成長產業


    的時候，產生豐厚的回報。同样地，大多數個人消費者會對可以滿足他們，以及時常光顧的品牌或零售商，產生忠誠度。相反地，在軍方採購中，若別人就相同產品提出更低的報價的話，並不會只因為某家供應商以前特地提供特別服務，便持續跟該供應商做生意。加上軍方習慣輪調，今日跟一家公司做生意的採購軍官，或許明天就不在了，因此，進一步增加具持久價值的善意或忠誠度的困難度。大多數軍火承包商必須考量到，它們的重要業務隨時可能無疾而終。


    還有另一個大家尚未察覺的因素，使得軍方業務對電子股投資人來說很不理想，那就是軍方有一種公認的慣例，它們預期民間產業用很少的利潤，甚或沒有利潤，去發展工程或研究。這種做法的背後理論是，如果做得好的話，開發中的工程，遲早可以帶來重要的生產合約，屆時這些大量生產訂單可以創造足夠的利潤，好讓公司能在沒有獲利的基礎下，進行政府不會得到實際武器的研究工作。


    這種在沒有獲利基礎下進行設計，然後藉由生產來獲利的習慣，在二戰前與二戰時變得很普遍，也運作得很好。這是因為那個時候，大部分的軍方硬體是坦克、步槍、炮彈等軍械，以及由人駕駛的飛機。以今日標準來看，當時開發每一項新武器的工程總工時是相對得少；相反地，'
  merge: -1
  img_proc: true
- pgno: 263
  md: '需要的武器數量很龐大。因此，工程研發時數與硬體購買量的比率很低。


    過去 15 年的改變步調極為快速，今日可能用於戰事的武器及科技，與二戰的差異，或許甚至大於近代與中古世紀武裝的騎士與侍衛。這使得期望軍火承包商用略高於成本的價格去進行研發，然後靠著之後量產軍火來賺錢的慣例變得陳舊不堪，這是因為許多最現代的武器極有效率，只需要少量便可摧毀所有目標。然而，在研發速度極為快速之下，早在一款武器的研發完成之前，另一款便已進入設計初期，使得前者變得老舊。就大部分現代武器系統來看，生產的武器與研發的時間之間的比率，已較二戰大幅降低。有人說，在今日的武器競賽，要囤積的不是武器，而是研發工程！當然，這也有例外，某些電子零組件只需要略做修改，便可用在許多武器系統上。然而，整體來說，這表示對投資人來說，軍方業務愈來愈不理想，因為公司必須進行愈來愈多基本上沒有利潤的研究，才能取得生產合約，而且產量愈來愈少。


    在國家必須維持國防工程的領導地位，否則可能就會攸關生存的時代，政府習慣把所有的獲利重點，放在次要的地方（製造），而不是最需要的地方（創意工程），真是悲劇。我認為，民間業務基本上比軍方業務更吸引人，已造成極為不利的影響，就是讓一些全國最優秀的工程與商'
  merge: -1
  img_proc: true
- pgno: 264
  md: '業頭腦，把他們的時間浪費在改進一些最不重要的消費品上頭，而國家安全其實需要他們的貢獻，才能在武器競爭保持領先地位。這種情況的危險與愚蠢，或許早晚將會改變基本情況，然而，我尚未看到這種改變的絲毫跡象。在跡象開始出現之前，投資人為了自己好，應該就可能發生的情況來做出判斷，而不是他希望發生的情況。因此，在不遠的未來，除非軍方的電子業務直接與民間業務相關，否則應該被視為遠不如非政府業務來得理想。


    基於這點，有人或許認為，若是投資人想要挑選可以創造最大增值的電子股，應該把眼光局限在沒有做軍方業務的公司，實際上，這真的是大錯特錯；相反地，投資人要找尋的公司，是軍方業務的研究與非政府事業密切相關，因而可以由政府業務那邊獲得雙重利益。除了在政府合約存續時期能賺取的業務之外，還可以由政府出錢來培養技能，協助公司發展更有利潤、更持久的民間業務。


    一些有不同工程與行銷背景的管理階層的公司，已培養出很高明的技巧，來挑選對自己最有利的政府合約。這種合約可提升它們跨入技術相關、但有時極為不同的工業或消費者市場。這可能包括政府研究合約、生產合約，或是兩者兼具。通常，只有十分擅長相關領域的公司，才能'
  merge: -1
  img_proc: true
- pgno: 265
  md: '拿到這些合約。然而，如果一家電子公司可藉此培養寶貴的民間業務知識，而不只是口頭說說，可能會被視為有潛力成為優秀電子股，值得密切研究它是否也符合成功投資的其他重要特質。


    很多時候，電子公司管理階層會驕傲地告訴投資人，他們的業務均衡分布在政府與民間業務。乍看之下，這種分散化好像很有好處。這種分散化，如果無法滋養民間業務，或許與沒有分散化的公司相比，具有一些穩定的優點。然而，電子股投資人絕對不能忘記，為求最大的投資吸引力，公司這兩種業務不但應該互有關聯，管理階層還必須設法運用軍事技術來推動民間業務。


    以國家安全的觀點來看，很幸運的是，今日的複雜電子科技有時可以達成這點。以美國面臨的危險來看，我們的習慣與政治，使得最傑出的工程師與企業人士，眼前只看重設計一款更好的捲髮器或烤鬆餅機，而不是攔截與摧毁敵人導彈的新系統，這真是一件可怕的事。這些專家本人，將擁有捲髮器或烤鬆餅機的設計專利，如果機器很好用，他們會從中獲利。成功的飛彈攔截系統，不僅可以拯救
    500 萬人的生命，還可嚇阻潛在敵人發動類似的攻擊。然而，在完成寶貴的國防裝置研發後，設計所有權不屬於研究的公司。在完成競標之後，生產合約，也就是按照'
  merge: -1
  img_proc: true
- pgno: 266
  md: '我們老舊的軍事採購理論，應可「彌補」幾乎沒有利潤的政府研發合約，可能會被別家公司拿走。而且，最後標到生產合約的公司，經過重新協商之後，幾乎必然得到很不穩定且獲利率超低的業務。簡單來說，雖然由國家利益來看，飛彈攔截系統極有價值，改良版捲髮器沒有價值，但對公司來說，即使是最微不足道的消費品市場，也勝過為政府工作，相同的業務量與工程研發能力，就能創造更多、更安全的經濟報酬。在這種體系下，如果無法偶爾由軍方電子研發工作得到額外民間業務的好處，將會有更多最優秀的工程與管理階層人才，由飛彈攔截系統流向捲髮器。因此，就結果來說，不可能有政府不花任何成本的系統，因為軍方工作無論如何都要做，而且確實要在最需要的地方，吸引到更多頂尖人才。所以，在
    1960 年代，那些有高等電子技術的人，將和 1950 年代後期一樣，在軍方與民間電子專業知識密切相關的企業，有機會為它們的股東做出巨大貢獻。


    # 3. 這家公司的重要產品線是否能建立起公認的科技優越性，讓顧客不會只是因為價格優惠，便去購買知名度較低的其他產品？


    尤其是在與生產儀器相關的電子業領域，但不局限在這個領域，這兩種條件的結合將對投資人極有好處。產品品質極為重要，很少顧客願意'
  merge: -1
  img_proc: true
- pgno: 267
  md: '冒著新品牌或二級品牌表現不好的風險，只因為這個新品牌或二級品牌的價格比較便宜，比方說，低了 10% 或 15%。因為超過這種幅度的價格優惠，不太可能達到損益兩平，通常很難用大幅折價，來對抗既有的高效率生產商，畢竟，它們可能已具備大量製造的成本優勢。


    這些情況都可能存在，若是兩家以上大型生產商在產品品質的地位相當，對電子股投資人就沒什麼意義了。然而，有時在最複雜、最難生產與服務的產品裡，某家生產商會被公認是品質最好的，在這種情況下，該檔電子股的地位將出現變化，可能促使股價大幅上漲及本益比提高。想了解這點，我們必須談談大多數電子股的基本投資特色。那就是它們具有遠高於平均水準的成長潛力，同時，也有遠高於平均水準的風險，在無預警之下，競爭可能干擾成長，甚至嚴重到危及整個投資。不過，偶爾當一家公司得到這樣高的品質名聲時，其他廠商就愈來愈難跨入，電子股的一般投資特色便開始改變。成長因素或許還是跟以往一樣重大，但假設公司管理階層有眼光，不犧牲品質，而持續大力提升產品，風險因素便會降低。如果這發生在有卓越成長前景的企業，便可構成絕佳電子投資的種子。


    1950 年代的熱門電子股 Ampex 公司，或許可視為是最好的範例。'
  merge: -1
  img_proc: true
- pgno: 268
  md: '以先前提到其他電子投資標準來看，Ampex 這家公司的表現十分突出。但在我看來，除了成長率很高、事業管理優良、工程能力傑出，以及政府與民間事業關係良好之外，Ampex
    股價的高本益比，還可以歸功於其他因素。在該公司的大部分儀器項目，顧客絕對不會在品質上冒險。在這部分的產品線，其他人很難挑戰該公司的品質聲譽。只要這種情況維持下去，相較於電子業往往風險偏高，該公司很有機會保住這個活絡成長領域的龍頭地位，而由於競爭干擾的風險偏低（跟大多數電子公司相比），高本益比是有道理的。


    許多無法理解為何某些電子股本益比高到不合理的投資人，如果記住一項基本觀念的話，就可避免嚴重估算錯誤。在這種成長熱絡的領域，免於重大競爭干擾，是決定合理本益比的重要因素，其重要性相當於成長曲線。


    # 4. 這家公司的銷售與行銷能力強不強？


    雖然其他事情也很重要，但在所有的製造業中，構成一項理想投資的主幹，主要在於 3 項基本優越性，分別是：①比大多數競爭對手更有效率地銷售與拓展銷售的能力；②生產能力，也就是能比大多數競爭對手'
  merge: -1
  img_proc: true
- pgno: 269
  md: '生產出更好、更低價的產品；③研發工作不僅可穩定協助改善既有產品，也可在該公司足以勝任的領域，開發出賺錢新產品的能力。這些同樣適用於其他產業和電子業，因此，從另一個觀點來看，在討論電子股的投資特色時，格外強調銷售能力或許看似不合邏輯。然而，就像我在談到電子股研究時提到的，對投資人來說，在這個高速前進的產業「研發」扮演了主要角色，勝過許多其他產業，但是，基於另一個很不同的理由，我相信電子股投資人應該要更重視一家電子公司的銷售能力，遠超過考慮其他類股時投入的注意力。


    這個理由，要回溯到絕大部分電子公司都發源自聯邦政府。我很清楚，電子公司要持續取得重要的政府業務，需要某種銷售能力。然而，我相信那是很專業的銷售技能，相較於在一般商業管道行銷的高明技能，向國防部銷售的技能雖然更容易培養，但是在我看來，本質完全不同，由銷售觀點來看，政府銷售的豐富經驗，並無法建立一家公司的民間行銷技能。


    換句話說，在大多數產業，如果一家公司沒有強大的銷售組織，通常無法成長。精明的投資人很少會受這種公司的吸引，這些公司也不常出現所謂「成長股」的高本益比。但在電子業，這種公司如果有充份的工'
  merge: -1
  img_proc: true
- pgno: 270
  md: '程研發能力，也可以成長到可觀的規模。靠著工程研發能力，這種公司甚至有時可取得一些大公司顧客的重要業務。然而，我相信，挑剔的電子股投資人，應該要避開這類公司，因為政府業務享有「今日來，明日去」的惡名。從電子股投資最要緊的是防範銷售前景突然變化的這個角度來看，最重要的莫過於投資一家已建立行銷組織、能在迫切需要時找到大量潛在顧客的公司。不論這類組織是這家公司自己的銷售人員，或是外部行銷人員，例如獨立製造商的代表，都不重要。重要的是，參與的個別單位，不論是公司員工或外部人員，都是精挑細選、受過訓練，明白該公司需求，而且該公司知道如何在需要新銷售概念時，透過他們迅速確實得到新想法。


    只透過檢視資產負債表和損益表，是無法讓投資人得知這些事情的，政府與民間業務比率的粗略數據也不行。然而，挑選在這個科技躍進產業不斷保持領先的電子股，沒有幾個因素比銷售這點更重要。許多電子公司都是由具高度創新工程技術的個人創立及主持，這類人才幾乎對生產與研發工程同等關心，因此，生產方面的業務，很少會不受重視或了解。但除了一些特例，這些傑出的工程人才卻對銷售並沒有什麼興趣，他們對如何建立行銷領導能力，沒有直覺式的了解。因為表面上看來，擁有優秀工程師卻沒有優秀銷售部門的公司，有一段時間對電子股投資'
