- pgno: 172
  md: '可能考慮使用空運的。擁有採用這些新噴射機所需的龐大資本與複雜組織的公司，將開啟重大成長來源與新事業。同樣地，使用將來開發的方法來為客戶提供妥善服務，可能成本高昂，只有現在營運的大公司或是數家小公司合作，才能負擔競爭的資本。然而，它們能以更高效率完成工作，每位滿意客戶的成本，將相較於現今浪費又不確實的方法低，就像
    1964 年與 1958 年的空運成本落差一樣。隨著愈來愈多人發現，很簡單便可得到真正了解公司內部運作、推薦股票很少出錯的專業人士得到投資建議，投資人的總人數與他們投入股票的金額將形成驚人的成長。美國各地跟我抱怨他們找不到真正善於提供投資建議的人，實在多到不可勝數。


    想要更理解為何今日無數投資人很難找到合適的投資建議，我們不妨觀察投資業不合邏輯、疊床架屋的大雜燴成長方式。如果我們進一步檢視這個行業的主要組織，看到它們實際運作與理論上應有的方式大不相同，我們就會有更深入的了解。在進行這項研究時，我們應該牢記以下的一些基本觀念：


    +   1. 所有投資人對他們往來投資業任何組織的唯一希望，就是得到正確的投資建議，知道應該買進、持有及賣出哪些股票。'
  merge: -1
  img_proc: true
- pgno: 173
  md: '2. 投資業可提供這類良好建議的人，幾乎全數都會不斷拓展他們的業務；相反地，那些推薦股票紀錄很糟的人，就不會有發展，他們往往瀕臨破產，因為他們被迫不時要大幅宣傳，試圖找尋新客戶來替補流失的客戶。


    3. 提供對投資人有利投資建議的唯一方法，就是知道自身推薦買進或持有股票的所有重要資訊。更重要的是，如果這些建議要為投資人創造可觀利潤的話，就必須知道可能影響這些公司的重要改變，不論是變得更好或更糟，而且要在大多數金融圈都獲悉這些資訊之前，以及這些改變反映在本季財報之前得知。


    這個負責管理美國股票投資資金的重要產業，目前大致可分成 4 大主要組織：它們可被稱為投資銀行家、股票經紀商、投資信託和投資顧問。就像目前看到的那樣，它們之間的界線極為模糊。然而，我們要試著分別看看它們在理論上及實務上，是否符合這
    3 個投資績效基本觀念，而這將攸關投資人客戶與投資公司的最佳利益。


    首先，我們來談投資顧問。至少在理論上，這個族群應該要非常符合這 3 項基本觀念。他們唯一的功能，也是獲得薪酬的基礎，就是追求投'
