- pgno: 168
  md: '# 第3章 投資人與金融業該前往何處？


    不是1個人，他們可能包括1名化學家、1名物理學家、1名抽象數學家、1名生產工程師、1名生物學家或業務部門代表。這些人彼此腦力激盪，團隊之間可以利用各自的專業知識，才能在這個較不複雜的進步都已出現的世界，創造出長足的進步。


    然而，我們不能忘記，這種合作並不容易。背景不同的人，脾氣不太可能完全合得來；要讓他們有相似的展望及目標，甚至更不可能達成，因此，真正的團隊合作無法簡單達成。唯有經過不斷嘗試錯誤的艱難方式，產業界才學會如何建立領導階層，把不同性格與學術背景的人組成團隊，以產生重大的實際成就。


    現在，我們回到金融業。今日一些最大規模及最成功的投資銀行、經紀商與投資顧問，員工裡都有真正或所謂的投資專家，各自擅長某一個特定或某一類別產業。這些人幾乎都派駐在一個城市，通常是他們擔任合夥人或主管的公司總部。視他們的天生能力，以及他們多常運用「閒聊」方法等因素而定，他們的投資績效有著很大差異。可惜，有一些「投資專家」仍習慣在不同公司主管之間游走碰運氣，就看哪一家公司願意主動告知營運資訊。而所有分析股票的人士，不論是最高明或最無能的，都因為工作負荷而無法經常旅行。而且，他們必須在沒有別人協助及核'
  merge: -1
  img_proc: true
- pgno: 169
  md: '對的情況下，獨力完成大部分的專業工作。


    精明的金融業管理階層，將會達成類似工業研發的「投資研究」團隊合作，一個不同且極有效率的系統即將誕生，舉例來說，以後不會再有一名電子專家派駐在紐約辦公室，1
    年「巡迴全國」2 趟；相反地，會有1 名紐約人士分配到上至紐約州，下至西賓州及北維吉尼亞州的地區。他的工作不是局限在收集這個地區電子公司的資訊，而是收集這個產業當前所有可能分析的電子公司資訊（包括一家公司的競爭優勢與弱點），不論那些公司的總部在哪裡。同樣地，在新英格蘭、加州和其他電子業的主要中心，例如芝加哥
    - 密爾瓦基 - 明尼亞波利斯地區，會有同一個團隊的其他成員。如果這些人具有合適的才幹，每個人都會建立起各自的朋友、同僚和人脈，很快便可透過已建立的人脈，取得大量的背景資料和看法。這個團隊的成員，再也沒有理由被限制在研究單一產業。每個人免去長途跋涉出差省下的時間，便可以讓他們研究自己所在地的更多產業，超過現在許多專家可研究的產業。


    除了幾天便可完成本來需耗時數月的工作之外，這種系統還有更多優點：這種系統可以跟客戶、競爭對手、廠商等交叉核對資訊，遠超過現在的「閒聊」。就參與的投資者人數來說，這樣可以降低任何一個人因'
