- pgno: 161
  md: '本週會上漲個 3 個百分點，或是認為投資顧問的基本功用，是告訴他們「大盤」的走向；幸好，這些人的數量似乎在穩定減少。大多數投資人想要的，是顧問徹底了解自己推薦的那些股票，因此，當他說某次配息是安全的，就真的是安全的；又或者，當他說某檔股票在一個合理時間內會上漲，漲幅就會確實遠高於大盤，而不是低於大盤。投資顧問對大部分推薦的個股都有準確的看法，像這種基本的事情，才是那些依賴他人建議買股的投資人唯一感興趣的，不管提供服務的是投資顧問、經紀商，或是該名股票買家往來的金融公司轄下的投資銀行部門都一樣。那些把資金放在投資信託或銀行信託部門的人也是這樣。在這種情況下，客戶主要希望那些機構負責這些業務的人，充分了解自己做的事，才能讓客戶買入的股票表現，大致上符合買進時的預期。


    對負責執行投資工作的人和他的客戶來說，股票績效都很重要，投資業的人或許態度像個怪胎，性格像個蠢蛋，但如果他挑選的股票表現突出，而且有合理的一致性，客戶會招徠更多客戶，直到他的業務多到無法負荷。相反地，即使是業界個性最好、最討人喜歡、最辛勤工作的紳士，只要他是一名投資顧問，但總是看錯股票，就必然會瀕臨破產邊緣。以股票交易顧問的業內人士來看，先前推薦個股的成敗紀錄，或許比其他任何因素更能決定他今日成功的程度。'
