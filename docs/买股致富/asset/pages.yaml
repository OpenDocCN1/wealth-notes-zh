- pgno: 73
  md: '當於 61.7%，投資在股票。1959 年 11 月，波士頓基金（一檔共同基金）公布一項調查指出，在 1959 年 6 月 30 日，68 所大專院校持有
    39 億 1,291 萬 9,958 美元的股票，占資產的 56.6%，高於 1 年前的 51.7%。甚至連向來對股票興趣缺缺的壽險公司，似乎也加入這股趨勢。最近，公平人壽保險（Equitable
    Life）總裁詹姆士．奧茲（James F. Oates Jr.）表示，雖然直到最近，公司 96 億美元資產組合裡沒有多少股票，但打算在未來 10 年，以每年
    4,000 萬美元的速度買進股票。《華爾街日報》最近一項調查，可以看出壽險公司增持股票的趨勢，可能對股市造成多大的影響，這項調查顯示，公平人壽總資產裡的股票只占不到
    0.04%；最大的壽險公司——大都會人壽保險的股票占不到 0.02%；保德信（Prudential）占 2.3%；紐約人壽（New York Life）占
    3.1%、約翰漢考克共同人壽占 5%。


    同樣地，全國投資公司協會（National Association of Investment Companies）估計，投資人在 1959 年買進 23
    億美元的共同基金，遠高於 1958 年的 16 億美元。該機構同時公布，1959 年贖回的金額是 7 億 8,000 萬美元，高於前一年的 5 億 1,100
    萬美元，計算之後，共同基金可供投資的新資金在 1959 年為 18 億美元，1958 年則為 11 億美元。由此來看，投資信託可能每年由市場抽走 10 億美元以上的股'
  merge: -1
  img_proc: true
- pgno: 74
  md: '票，加入它們的資產組合。


    紐約證交所最近一項調查，可能綜合了這些所有的趨勢。這項調查顯示，1959 年底時，整體法人持有 510 億美元上市股票，占總額的 16.6%。10 年前的金額是
    95 億美元，比重是 12.4%。


    然而，這些都是歷史。了解以前的事，會幫助我們賺錢，因為它可以幫我們對未來將要發生的事，做出更準確的判斷。展望 1960 年代，我們面臨的第一個問題是：在未來
    10 年，法人買股是否會構成更強大的力量，或者，它的重要性會減弱？


    首先，這裡我們要考慮的是，法人買盤對股市的巨大影響，絕不是全部來自新資金的投資，另一個重要的資金來源，是來自先前投資在其他媒介，目前轉移到股票的資金。現在，股票受到極高的評價，從歷史觀點來看，相當高比重的資產都已投資在股票。在
    1960 年代比重是否會進一步成長？真是這樣的話，即使各類買股法人本身資金沒有進一步成長，對股市的影響仍很可觀。


    我相信，答案是整體法人資產將進一步轉移到股票，儘管幅度不會像'
  merge: -1
  img_proc: true
- pgno: 75
  md: '1950年代那麼大。然而，不需要1個百分點，便足以對股價產生十分巨大的影響。要記得，1950年代的法人買盤（我是指購買股票的總額，而不是由一檔股票轉換到另一檔股票），早已把當時買進的股票，從股市裡抽走了，因此，1960年代的買進，會加劇對股市的影響。


    我相信有幾項理由，預示資金將進一步轉移到股票，然而，幅度會比不久之前更溫和。可望使股票買氣增加的一項重要事實是，各州和其他政治部門已開始把它們持有的年金基金這類龐大資產，投資在股票上。除非這股趨勢的增強動能，在擴大到足以撐過一次性挫敗之前，便突然出現熊市，因而扼殺了這項新發展，否則這股趨勢將成長到相當重大的比率。


    同時，尤其是在年齡層較大的受託人之中，有部分的人仍習慣在信託持有固定比重的債券，這不是因為有任何合理的理由，讓持有債券符合該信託的需求，而是因為他們在債券被視為所有信託骨幹的時代，已養成這樣的金融習慣。他們根本無法想像有哪一檔妥善管理的信託基金不持有債券。隨著這些老一輩的人，被那些在債券不那麼受重視的氛圍下成長的年輕受託人取代之後，這些信託帳戶持有的債券比重還會進一步縮小，其中很多都會被股票取代。'
  merge: -1
  img_proc: true
- pgno: 76
  md: '還有一些其他影響力，但是只會部分抵銷上述有利於股票的力量，而不能全部抵銷。有可能但無法確定（政治影響力可能是重要因素），相較於股票，債券的收益率或許會相對更有利，遠勝於
    1950 年代大多數時間的狀況。如果這種情況出現，就會有很多人、包括一些有充分理由這麼做的人，他們會偏好在本金實質價值下跌的風險下獲得較高的當前收益，多過於在本金價值長期增值下獲得較少的收益，這將導致一些資金回流債券。尤其是在下列
    2 種時候，這種情況會很明顯：1. 債券價格位於超低水準，可預期債券將大幅反彈，足以彌補近期通膨升高侵蝕價值；2. 股票價格位於超高水準，近期展望可能是大幅下挫，而不是持續上漲。


    另外，我認為還有一個更重要的影響力，會降低 1960 年代法人把既有資金配置在股票的比重。如果應對得當，在技術開啟許多投資機會時，比如像現在，股票很適合作為法人投資的主流。然而，有很多投資經理人，包括受託人及他人，我認為他們沒有能力處理股票投資。1950
    年代的大多頭市場，遮掩了這些人的無能（至少就股票管理來說）。股市單一方向的走勢是不正常的，無法預期永久持續下去。在 1960 年代，可能出現比 1957 年到
    1958 年還長久的空頭市場，屆時將揭露這類管理弱點。法人及信託受益人到時候或許應該會對這些經理人大感失'
  merge: -1
  img_proc: true
- pgno: 77
  md: '望，但為了自尊起見，反而轉而對股票感到失望。這也可能進一步扭銷 1960 年代法人增持股票的趨勢，但我懷疑，1、2 年的時間是否足以扭轉趨勢。


    上述這些影響，都會左右法人管理的資產流向股票的資金比重。現在，我們碰到一個同樣會對市場造成重要影響的問題：1960 年代流入股市的新募集資金會跟 1950
    年代同樣壯觀嗎？如果是的話，全體股票投資人都有必須應對這股力量！我認為，檢視各種法人機構的前景，便可以得出這個問題最清楚的答案。


    在這麼做之前，我覺得應該考慮一項正悄悄改善許多大型法人買家績效的基本轉變，這不是表面形式的改變。從整體法人層面來看，大部分法人的營運大致上和 10 年前一樣，有些法人的實際運作甚至幾乎沒有改變，然而，也有許多更重要的法人已做出長足改變，且看到其投資績效改善。如果在過去那個對股票投資不夠嫻熟的時代，這些法人都已經大幅增加股票投資，那麼隨著它們在投資效率上的提升，進一步擴大買入股票，也就變得愈發可能。


    當大銀行、慈善組織、保險公司，或投資信託業開始進行買賣大量普'
  merge: -1
  img_proc: true
- pgno: 78
  md: '通股的複雜工作時，它們大致上是藉由成立投資委員會來處理相關事務。有一些委員會的組成方式是由機構內的全職工作者來組成，另一些委員會的組成較多元，有些來自機構內的主管，有些來自優秀的企業家，甚至董事會中的固定成員，並且雇用一或數位全職投資專家來提供投資建議給投資委員會，然而，投資委員會仍擁有最終的投資決策權。


    在許多個案中，這些全職投資專家時常被稱為「證券分析師」，但其實算不上是績效卓越的專家。儘管法人投資委員會的表現很平庸，但在法人機構嘗試股票交易的初期，或許很有必要依賴這類委員會，來評估尚未獲得肯定的全職顧問建議。


    不過，真正能幹的證券分析師，開始出現在一些投資委員會的會議上。通常在一開始，這對一個有才能的投資專家來說，是一個打擊士氣的經驗。被任命為投資委員會的人，可能是一家機構的會計長或財務長、當地公營事業的總裁，或是繼承了
    300 萬美元的財產。有資格擔任這種委員，未必表示他更擅長判斷該買賣哪一檔股票，就像他沒有資格判斷副總統的盲腸是否應開刀切除，或是一件官司應撤回或成立。雖然這些投資委員會的成員，或許毫不猶豫便會把這類醫療或法律決策，委任給這些領域的合格專家，但基於這些成員他們都有處理錢的經驗，以及獲任'
  merge: -1
  img_proc: true
- pgno: 79
  md: '為投資委員會的事實，這往往讓人不再懷疑他們是否有足夠的智慧來評斷全職投資專家的每一項建議。


    上述的各方面，都不利於有才能的投資人士去面對不信任的投資委員會。通常，大多數（即使不是全部）的投資委員會成員，地位都在投資專家之上，不僅是在公司之中，商業與社會階級也是如此，這使得投資專家更難爭取讓自己的投資建議獲得通過。況且，召募投資專家通常只是為了確定投資方針，因此，反對專家的委員通常會占上風，因為當意見分歧時，是無法採取行動的。這些因素往往導致由投資委員會能力最差的人來做出投資決定。我常聽到一名新加入一家機構的傑出投資人說：「我知道這是我們該買的股票，但建議這檔股票也沒有用，我的委員會絕對不會同意。」


    然而，隨著 1950 年代過去，一再有個案顯示，許多傑出的全職投資人，逐漸在他們的機構享有很不一樣的地位。由於事實證明，他們的建議大多勝過委員會的選擇，不論是形式或實質上，某些投資委員會開始把投資決策交到這些專業投資人手中。如果事情進行順利，一家銀行、保險公司，或是大學的信託部門的投資績效確實明顯優於同儕，將來的趨勢，會是由合格專家進行決策，而不是由大型投資委員會。我不知道'
  merge: -1
  img_proc: true
- pgno: 80
  md: '我看到的樣本，是否多到占總數的一定比率，讓我可以說這種趨勢沒有重大例外，但我的經驗是，投資專家掌握愈多權力，投資委員會成員的影響力削弱，投資決策的素質就愈好。部分原因是，原則上，把決策交給最有資格的人是有道理的；部分原因是，唯有才華洋溢的投資人才會主導投資委員會裡的知名人士，而不是被他們主導。無論如何，競爭將促使這種趨勢，在
    1960 年代更加盛行。同時，許多大型法人股票買家的操作水準將進一步提升。這麼一來，愈來愈多人會找這些法人提供服務，這些法人對一些股票的影響力，也會變得愈來愈大。


    現在，我們要來——檢視法人買家的主要類型，值得一提的是，過去 10 年來，這個團體裡成長最迅速的類型，是年金與分紅基金。我預測未來 10 年，這些機構也將繼續鉅額增加它們的股票部位。已成立的這些基金數量已十分眾多，新增的數量或許不會太大。然而，既有的年金基金融資計畫，以及分紅式信託未來可預期的新增資金，在在顯示股票投資需求將穩定持續增加。


    我相信這些年金與分紅基金的未來計畫已十分確定，我認為，只有一件事可以阻止它們在未來對股市發揮強大的多頭影響力，那就是：如果這些基金的財務主管拙劣或不誠實，會導致整個基金產業失去魅力。許'
  merge: -1
  img_proc: true
- pgno: 81
  md: '多這類小型基金籠罩在神祕之中，所以無從判斷它們。然而，一些大型基金顯然營運良好，因此，這整個體系不太可能名聲掃地。


    至於個人信託基金，我認為可以確定它們在 1960 年代也將進一步成長，就像大型都會銀行與獨立信託公司的信託事業（及投資管理事業）一樣，可望成長。我個人認為（但許多人或許不同意）在二次大戰之前，這些事業有很多經營得不甚高明，不過自從戰後，一些銀行在全國拓展，從東岸的波士頓與紐約，橫跨到西岸的聖地牙哥，它們開始邁大步，把投資管理提升到更高水準。其他同業迫於競爭，也採取類似的改變，結果，整個信託部門繁榮起來。如果在
    1950 年代標準升高之際，也能有這種成長水準，我看不出有任何理由，會在 1960 年代停止成長，因為績效勢必更好。因此，這個重要類型也將為股票增添新需求。


    同樣地，我也看不到有什麼理由，讓保險公司新增的股票買進數量，不會以如同近期的溫和速度成長。至於教育及慈善機構，第一顆史普尼克（Sputnik）人造衛星進入太空，讓輿論注意到教育的必要性；現代生活無窮無盡的壓力，則讓大家注意到慈善的必要性。如果經濟景氣維持繁榮，有更多新的捐贈和大筆現金捐款，將流入這些機構，金額將多於不景氣的時候，但是無論景氣繁榮與否，流入的總資金都將是往上攀升'
  merge: -1
  img_proc: true
- pgno: 82
  md: '的趨勢。


    現在，尚未討論到的主要法人買家類型，就只剩下投資信託了，就這個類型來說，我認為無法預估未來趨勢。1960 年代，幾乎任何情況都有可能發生，經營得較好的投資信託，確實提供了實用的服務，因為它們提供了一種方法，給那些資產太少、但又需要做一點資產分散投資，卻無法在他處獲得這類服務的人士。況且，為了這種分散化，許多投資信託在它們的資產組合，加入大量的「非法人」型部位，也就是沒有完全符合大多數其他類型法人買家標準的公司股票。在今日的情況下，它們也提供服務給一些大型投資人，後者因為某些理由，似乎找不到合格的專業投資人士給他們做顧問。這些信託的分散化投資，讓投資人相信他們的資產不會大幅縮減，除非是遇到熊市。但即使是在熊市，跌勢也不會太快，很可能比整體股市下跌的速度慢一點。這些，當然都是有好處的。


    另一方面，這種分散化同時意味著，在股市上漲時，這些基金上漲幅度可能也跟市場差不多。許多人會不同意我這種說法，但我認為，真正優秀的投資標的很難找到，沒有個人或機構可能累積到一長串這種優秀投資標的清單。因此，我相信就本質來說，在某種程度上，投資信託被'
  merge: -1
  img_proc: true
- pgno: 83
  md: '視為平庸與績效普通。傑出的投資信託管理，通常會努力達成高於平均的績效，然而，在我看來，投資信託距離大多數投資人希望獲得的傑出績效，仍有一段長路要走。


    基於這些理由，我想投資信託在1960年代究竟會增加或減少重要性，這取決於整個證券業能否在1960年代，發展出比目前更好的機制，來給予中小型股票買家更好的服務。我會在本書其他章節來討論證券業可能的未來趨勢。不過，如果投資業本身的結構沒有出現劇烈發展（而且股市沒有發生一些不愉快的事情），投資信託事業將持續吸引許多人，並且取得成長。


    我認為，投資信託領域還有另外一項威脅，由於開放式信託（註④）經歷大幅的成長，有些人冷嘲熱諷地說，在多頭市場一切都沒事，然而，投資人隨時都可以用接近清算的價值來贖回股份，這會在熊市造成惡性循環。贖回股份的大量要求，將迫使投資信託拋售大部分持股，以籌募資金來支付投資人的贖回。在大盤早已下跌一段時，大量贖回的這個舉措會將贖回價值壓低到嚇壞更多投資人的水準，讓他們也想拿回現金，


    註④：編按：即開放式基金。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '這又會引發更多的資產清算，進一步打擊股價，並且讓更多人想要拿回現金。


    至少在理論上，這種惡性循環將持續一段長時間，但在實際上，1950 年代的熊市完全沒有出現這種大麻煩。然而，整體來說，1950 年代是異常的多頭氛圍。如果 1960
    年代發生更大規模或更漫長的熊市，開放式信託是否會因而流失投資人，導致資產規模萎縮？


    這我不知道，然而，我不認為可以用過去 10 年沒發生、未來便不會發生的說法，來打發這件事。我相信，一般的投資信託投資人，現在可能對信託股份的未來報酬，有著極為樂觀的預期。但是我覺得，沒有理由相信大多數的信託管理績效可以達到這種預期，因為許多信託的資產組合非常分散化，幾乎可以確定績效將接近平均水準，而不會特別好或特別壞。由於涉及太多股票，一些股票的平庸表現，必然會稀釋其他股票的超高績效。如果考慮到這種「內建穩定裝置」之後，大多數投資信託的績效已屬相當理想，只是仍不及許多投資人的樂觀預期，便可能出現一段時期的希望幻滅與出清股份。


    如果這種情況發生，許多信託的一種操作實務，會使得問題更加嚴重，'
  merge: -1
  img_proc: true
- pgno: 85
  md: '而我認為一些不精明的投資人，可能被這種操作實務騙到——那就是資本利得股利（capital gains dividends，註⑮）。每位投資人都知道「資本利得」這個詞，在稅務用語裡，是持有6個月以上投資的獲利，稅率是當期所得稅率的一半，而且絕對不會超過獲利的25%。有賺到利得的投資信託，可以「回饋」給投資人，它們可以從這些獲利來配發股利。可以想見，這些股利對投資人極具吸引力，因為股利的稅率遠低於其他投資收益。


    這套做法有什麼不對？假如因為非稅務考量而賣掉股份是明智的決定，又或者，假如投資人把股份漲幅超越大盤的金額視為真正獲利，在這兩種情況下這套做法並沒有不對。可惜，情況通常不是如此，投資人已經愛上這些有節稅功能的股利，他們總想得到更多股利。基金的銷售人員知道資本利得股利是很有效的推銷說詞，基金的銷售人員同樣也想賺更多。當整個股市已經上漲，基金的漲幅其實跟大盤相同，在支付資本利得股利後，基金把餘額再投資在上漲幅度相同的東西。不過，基金早已先把獲利以資本利得股利的形式支付給投資人，因此，再投資的金額是收益扣除股利。因為先前買進的股票跟大盤同步上漲，再投資去買


    註⑮：編按：類似基金配息。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '到的同一檔股票，必然遠不及先前持有的數量。因此，除非可以十分確定新買進的股票，比賣出的股票好很多，否則這些資本利得股利其實近似於用本金支付的股利（這是就投資的觀點，而不是就會計理論來看）。


    因為太多人不了解這點，我們來舉一個理論性的例子。一檔投資信託以 20 美元買進 1 萬股的北方鋼鐵，總額 20 萬美元；股價漲到 30 美元，賣出後得到 30
    萬美元。根據傳統會計，資本利得利潤是 10 萬美元，因為股票持有超過 6 個月，這 10 萬美元用誘人的資本利得股利形式回饋給投資人，剩下的 20 萬美元再投資南方鋼鐵。先前用
    20 美元買進北方鋼鐵時，南方鋼鐵的價格是 40 美元；由於鋼鐵類股走強，南方鋼鐵現在已漲到 60 美元。因此，現在只能買到 3,333 股，而不能買到 5,000
    股、好讓該信託基金在鋼鐵股獲得相同配置部位（因為價格是 2 倍，所以只能買到 1/2 的數量）。實際上來說，基金在鋼鐵業的配置部位少了 1/3，因為那 1/3
    已經以所謂的「利潤」配發出去了。


    當然，如果南方鋼鐵日後的股價增值幅度較北方鋼鐵高出 50%，便足以彌補減少的部位，資本利得股利便可獲得實際利潤的補償，而不只是帳面利潤。此外，在投資信託孳生資本利得的日常交易中，並不是那麼簡單就可以看出實際發生的情況。投資信託可能不是賣出某一檔鋼鐵股、'
  merge: -1
  img_proc: true
- pgno: 87
  md: '買進另一檔鋼鐵股以期增加獲利，而可能是賣出一檔石油與汽車股，買進銅、貨櫃與零售股。然而，重點都是一樣的，因為發放資本利得股利之後，信託可用來再投資的金額，必然少於賣出時拿到的金額。唯一可證明這些資本利得股利沒有導致投資本金減少的方法是，等到數年後，重新投資在其他股票的部位增值，並超過先前為了配發股利賣出的股票的增值。有朝一日，為了保護投資人實施的開明立法，或許會規定投資信託必須證明資金明智地重新投資，可以在幾年期間內彌補資本利得股利，否則投資信託不得發放這類股利。然而，在這種情況成真之前，一旦發生熊市，而賣出及買進的股票波動幅度約略相同，屆時，許多投資人會更清楚看出，這些資本利得股利正在侵蝕本金。


    目前，這些股利被一群奸詐的經理人操控，可能變成一種真正的投資風險。投資人和銷售人員都已經習慣股利，也喜歡股利，但市場行情在下跌，投資組合裡的股票只有 1 檔或
    2 檔仍有大幅獲利。良好投資的一項基本規則是，長抱有獲利的股票，了結有虧損的股票。換種說法，當大盤下跌，而這幾檔股票仍在上漲的唯一理由，是因為它們極具吸引力。投資信託是否會屈服於投資人及銷售人員想要有股利的壓力，而賣掉這幾檔可望創造最大未來獲利的股票？投資信託是否會賣掉它最不該出脫的股票？如果真是這樣，未來的績效將極為黯淡。'
  merge: -1
  img_proc: true
- pgno: 88
  md: '由於可能在 1960 年代遭遇這些問題，投資信託是可能（但未必會）偏離總體上升趨勢的法人部門。然而，無論投資信託的買股能力增強或萎縮，來自其他法人買家對股票的需求，勢必會對
    1960 年代的股票投資人產生巨大衝擊。投資人不能忽略這股力量的理由，在於兩個基本因素：一個是經濟面，另一個是法律面，這會促使穩定需求及買氣集中在少數幾檔股票，它不能也不會普及到整個股市。


    首先，我們來看經濟面的因素。一個產業裡低成本生產者賺到的 1 美元利潤，絕對比邊際生產者（marginal producer，註⑥）來得安全，因此，低成本生產者向來受到保守投資人的青睞。同樣地，如果生產成本大約相同，一個產業裡可年復一年獲得大量業務的公司，就會比一直只有少量業務的公司更具投資吸引力。常見的情況是，業務規模和低成本兼具的話，投資吸引力將更加可觀。


    然而，在過去 30 年，一些基本商業趨勢相互結合，給予大型或巨型低成本公司愈來愈多勝過其他公司的投資吸引力。科學研究增加，是讓公司興起或沒落的強大力量的之一，大公司可負擔大規模的綜合計畫，讓


    註⑥：編按：指該產業裡利潤最低的生產者。'
  merge: -1
  img_proc: true
- pgno: 89
  md: '它們更有彈性，而這是小公司很難辦到的。大政府與大型工會的崛起，創造出各式企業專業人士的需求。大公司有足夠的業務，需要各種稅務專家、產業（或勞資關係）專家、華府的業務代表、全世界不同區域的外貿專家，更不用說那些無數的其他專家了。小公司的經理人可能什麼都要會一點，在今日的複雜世界，有時這要花很多錢。大公司在基本管理事務上享有明確優勢，大公司有更多操作空間，可以達成深度管理及管理政策的連貫性。在一家經營良好的公司，這些都是有投資價值的，值得付出高倍數的本益比。最後，大公司通常占據更有利的地位，可接觸到其他領域的機靈主管，能獲悉其他人在做什麼，以讓事業經營更有效率，並迅速利用這項資訊。這些也都是有投資價值的。


    基於這些理由，即使沒有形成龐大的法人股市，至少一部分所謂的「藍籌股」也會出現。相對少數的、經營良善的大企業股價溢價（premium），會逐漸高於大多數其他公司。溢價這種金融名詞，代表這些股票的本益比上漲，高於那些不具這些投資優勢的公司。更大的安全性與持續的良好管理，很可能確保成長趨勢至少高於平均水準，而值得這個溢價。


    然而，1950年代確實出現不斷成長的法人需求。由於這些法人基金絕大多數要面對背後的最終受益人本質，因此它們必須把幾乎所有的資'
  merge: -1
  img_proc: true
- pgno: 90
  md: '金，配置在最強勁的股票種類。雖然或許有很好的理由，把大筆的大學、遺孀或公司年金信託的基金，配置在像股票這種高風險資產，但唯有為這類投資人選擇最好的股票種類，才符合商業與經濟眼光。


    然而，並不是只有這些基本合理的經濟理由，讓龐大的法人需求，集中在股市的一個部分。負責為大多數法人買股的人是信託受託人，他們肩負受託人的所有法律責任。依據許多法院判決建立起來的受託人責任，規則是十分清楚的，但是在這個瞬息萬變的時代，這些規則並不是很有利於提供明智的股票管理。無論是不是受託人，全體投資人都應了解這些背景規則，因為這些規則會繼續對所有股票的價格，產生極為重大的影響。


    信託受託人很少會因為投資高明而獲得特別報酬，他的費用是預先設定好的，絕對不會因績效超好而增加；相反地，萬一投資虧損，他可能會受到重罰。然而單是投資虧損，他未必會因而得到處罰，他面臨的巨大風險，是萬一讓受益人賠錢，以至於違反某些規定時，必須由他個人賠償信託的虧損！現在，我們要記得，受益人控告受託人，要求彌補虧損，是利用後見之明。在事情發生後，受益人可以採取行動，宣稱受託人當時應該做得更好。相反地，受託人只能發揮先見之明去預做防範，'
  merge: -1
  img_proc: true
- pgno: 91
  md: '在這種情況下，受託人會密切注意法規，以保障自己不要承擔沉重的個人責任，即使他的行動會為信託招致龐大虧損也一樣，這就沒什麼好意外外的了。


    什麼法規可以保護受託人不會因為虧損而被告呢？以法律用語來說，倘若受託人當時善盡謹慎職責，便不必負個人責任。說得真漂亮，但這是什麼意思？你如何證明受託人有沒有善盡謹慎職責？以實際用語來說，就跟大多數律師的解釋一樣，這句話的意思是，如果受託人買進或持有大多數其他受託人都持有的同一批股票，而且配置的部位差不多，就沒有什麼個人責任的風險。由於你無法確認其他受託人持有哪些股票，那麼你就會把大筆的資金投入在最大型、最知名，以及理論上消息最靈通的受託人所持有的標的（例如，紐約銀行業的信託部門）。就像一個批評者說的：「大幅虧損沒有關係，只要你買的股票都是好公司就沒事！」


    按照這些法規，令人相當意外的是，受益人的處境每下愈況。甚至是設定這種模式的法院都一定知道，這個業界正因此而處於轉變當中。5年前很適合受託人買進的一檔股票，或許已經更換公司主管，所以，現在不該被列入考慮。另一家擁有傑出主管的公司，只是5年前公司還太'
  merge: -1
  img_proc: true
- pgno: 92
  md: "小也太新，不適合受託人買進，但不管是今日或以後，這類公司或許正是<|message|>  \n是有責任心的受託人所應該買進的。然而，根據法規，假使後來證明受託人的判斷錯誤，他不會因為持有前者而被罰，反而會因為買進後者而被罰。\n\
    \n拜勇敢的個人受託人，以及一小撮都會銀行的先鋒信託部門之賜，儘管法律背景不利於他們的工作，信託管理已有了長足進步。\n\n過去已發生、現在正在發生，以及未來也將發生的一件事是：少數格外強勁的公司（主要是原本就最適合受託人購買的公司），獲得所謂的「法人認同」（institutional\
    \ acceptance）。它們大多數有一些特點，可確保很高的本益比。然而，由於這些股票是受託人買盤集中的股票，而物以稀為貴，本益比又變得更高了。其他非信託法人基金，例如保險公司，以及大多數投資信託（註⑦），認為既然這些是最強勁的公司，它們也應該持有，至少作為它們持股的一部分。這麼多買家把這些股票從市場中買走，這些公司與那些未獲法人認同公司之間的「價差」，就會變得很大。\n\
    \n註⑦：投資信託通常是由董事會控制的公司，技術上來說，它們不能算是信託。"
  merge: -1
  img_proc: true
- pgno: 93
  md: '進入 1960 年代，精明的非法人投資人和能幹的法人買股者，會比現在更了解這些基本情況對他們的幫助。他們將會明白，最受法人認同的一小撮股票只會緩慢改變，但確實是有改變的。這就像一家高級俱樂部的會員名單，每年的變化很小，然而，最近才發達起來
    quant 的一些人獲准加入，一些舊會員因死亡，或是有人付不起會員費而退出。但這些都是例外，絕大多數的會員還是同一批人。


    想藉由股票賺取可觀利潤，並沒有簡單的方法。然而，上述的投資環境或許可提供一個最不困難的方法，在 1960 年代賺大錢。你不妨仔細研究可望獲得法人認同的股票，我指的是目前或未來獲利將穩定上揚的中型企業。這些公司或許早已被納入一小部分法人買家的核准購買名單之中，或是尚未獲得任何法人核准買入。這些公司必須擁有能力傑出的管理階層、成長特質、該產業中相對高的獲利率，以及足夠的規模，才能吸引機構投資人。如果它們成長到十分適合專業受託人買進的地位，受託人遲早會感受到必須投入全部資金的壓力，以及他們可投資的其他股票已處於相對高價，將促使這些公司「加入俱樂部」，也就是獲得普遍的法人認同，以及這種認同帶來的高昂本益比。


    在這種股票獲得金融地位之前，便先行買入的幸運投資人，可賺到雙'
  merge: -1
  img_proc: true
- pgno: 94
  md: '重利潤。首先，如果不是獲利成長高於其他同業，股票是無法取得這種地位的。因此，投資人因為獲利成長而獲得第一重利潤。但投資人還有其他收穫，我們假設有一家公司，現在被大部分金融圈視為濫竽充數或平庸，在不是嚴重衰退或格外繁榮的一年，它的每股盈餘是
    2 美元，每股股價是 24 美元，因此本益比是 12 倍。5 年後，又是不嚴重衰退或格外繁榮的一年，它的獲利年復一年地成長，現在已達到每股盈餘 4 美元，若本益比是相同的
    12 倍，股價應該上漲 1 倍，達到每股 48 美元。然而，在這段期間，金融圈開始認同這是一檔真正的法人股；而這是 5 年前無法想像的。結果，這家公司現在不只值
    12 倍本益比，甚至輕易便達到 24 倍本益比，也就是每股 96 美元。換句話說，由於預先覺察的買家準確預測到法人認同，以及股價將因而改變，他的獲利不只會翻倍，還可能增值到
    4 倍。


    上述這名投資人的財富，在 5 年內變為 4 倍，有部分原因是他的持股本益比升高，還有部分原因是這些股票的獲利能力增強。儘管這都是拜持股獲利能力增加 4 倍所賜，這名投資人可以覺得自己的財富淨值增加很安全，而高枕無憂了嗎？


    簡單來說，我們先前有關股票的法人需求，在未來是否會成長或萎縮'
  merge: -1
  img_proc: true
- pgno: 95
  md: '的冗長討論，早已得到這個問題的答案。假使就像我認為的那樣，那些跡象在未來會變得極為清楚，至少和今日相同，需求會集中在少數個股，所以投資人不需要擔心，因為最佳法人股的本益比，會持續遠高於整體股市。因此，假如投資人相信，本益比改變造成他的持股價值大幅升高，都是因為他的持股如今享有法人認同，他便可以放心這種情況會持續下去，而且獲利將是「真正的」（也就是永久的），因為這完全是源於獲利能力的改善。


    然而，在這方面，投資人要注意一件事：每隔一段時間，基於不同理由，一個特定產業會成為股市的最愛。有時候，這股投資大眾熱潮背後的理由很健全；有時候，利多因素或許是真的，但價格可能偏離事實，因為當下沒有人注意到利空因素。化學、鋁業、壽險公司、鉛礦公司和藥品公司，都是二戰結束以來，相繼享受到這種短暫投資歡呼的類股。而在1950年代的尾聲，獲得大眾喜愛的，則是電子股。


    當投資熱潮背後的理由健全，在大眾對這個類股的興奮終於消退時，這個產業裡的最佳企業股價，通常不會自高點下跌太多。更重要的，在幾年內，通常在不那麼引人矚目之下，這些優良股票又會悄悄締造新高。然而，即使這種對某個產業投資前景的興奮，基本上是正確的，但在該'
  merge: -1
  img_proc: true
- pgno: 96
  md: '產業裡的次級、營運不是很好的公司，也可能漲到無法代表正確價值的高本益比。對一個產業的興奮過了頭時（例如 1950 年代中期的鉸礦和壽險公司），這種危險會更明顯。


    換句話說，想把握非法人股將來取得法人認同、進而創造較為持久的高本益比的投資人，務必要這麼做：每當自己手中的一檔股票本益比上揚高於整體股市，就應該十分詳細地檢視。他應該判斷這種改變，是因為法人機構開始持有這檔股票，還是完全不同的因素。無論如何，他都必須判斷這家公司（而不是整個產業）的主管、前景、先天風險，以及其他所有決定這家公司真正投資地位的因素，是否可以佐證本益比上揚。如果是的話，就不需要擔心這個來源創造的財富增加只是鏡花水月，而不是來自持股的獲利能力增強。


    接著，我們要談到這件事的另一面：預先覺察的投資人，如果想從法人買家在 1960 年代對許多個股股價造成的影響下賺錢，而不是賠錢的話，就必須注意的第二件事。長久以來獲得認同的股票，要花很久的時間，才會從法人認同名單上消失，就像新股票很慢才會被加入名單當中一樣。然而，這些改變終究都會發生，就像成長中的公司遲早會被加入，經過多年後，一些公司的缺點開始顯露，管理階層變得枯燥乏味、失去'
  merge: -1
  img_proc: true
- pgno: 97
  md: '動力，或是無法維持在業界地位，最終就會從法人最愛名單中被剔除。


    要記得的是，法人認同股票的股價表現，就像我們國家所有傑出且能幹的人士（但只限於被公認是傑出且能幹的人）習慣踩高蹺到處走一樣。唯有踩上高蹺，才能跟這些領導人來往。況且，只要這些人保持他們的高水準，就絲毫沒有從高蹺跌落的危險。然而，萬一其中有任何人喪失他的優點（不是立刻，而是在一段時間之後），他的高蹺便會腐朽，然後狠狠摔下來。


    以相同的方式，最佳投資標的之股價，拜法人需求的推升，就像踩了高蹺，這一點兒都不危險，只要保有優點，它們會維持這種高本益比，並和獲利同步繼續上漲。如果喪失讓它們踩上高蹺的特點，就會變得極其危險，它們的股價下滑，不只是跟著獲利一起下跌，下跌的速度甚至會更快，等到法人終於將之拋售，它們便喪失溢價。然而，通常等到法人股失去大部分吸引力一段長時間之後，才會發生股價下跌。這種時間差的部分原因，是投資人遲遲才會察覺，以前獲得吸引力的股票，其特點改變了。此外，緩慢回應的原因，還有受託人基於法規壓力，必須加入大家公認的道路，尤其是較大型、較知名受託人所走的道路。只要了解這些法人棄股的理由，以及掌握事前的預警，持有最高本益比股票的'
  merge: -1
  img_proc: true
- pgno: 98
  md: '投資人也不必擔心高本益比，只要他們有強力理由相信，他們的持股將持續獲得原有的競爭優勢所保護著。


    但為什麼在 1960 年代，個人投資人要繼續持有這些法人認同的股票？一旦它們到達或接近法人認同的巔峰，價值只會與獲利同步成長（註 ⑱）。因此，投資人把它們賣掉不是聰明一點嗎？他可以把獲利重新投資在其他即將獲得法人認同的股票。如果他的判斷正確，資產將繼續用高速成長，因為法人認同將帶來高本益比，促使每股盈餘增加數倍。顯而易見的是，只能從獲利成長來推升價值的股票，很少以這種高速來增加價值。


    雖然這些事都是正確的，我相信完全照章行事的投資人，並無法了解法人股的真正特質。一檔股票會獲得法人認同，現在的股價達到高本益比，通常是因為它有以這種速度維持獲利進一步成長的穩定前景。當投資人成功並累積鉅額財富，我相信，應該至少將部分財富投入在最高級與最安全的投資，才符合他的利益。對那些已累積可觀利潤的人來說，讓資產安全地進一步成長，與在較高風險之下追求較快速的增長，兩者相比，前者也是很有吸引力的。因為按照我的比喻，一旦股票取得卓越的投資地位，從高驕摔落的速度往往很緩慢，警覺的投資人應該會得到'
  merge: -1
  img_proc: true
- pgno: 99
  md: "充足的警告，謹慎管理自己持股的大型投資人，沒有理由不去享受這類最高等級股票占大部分資產帶來的 Cao 好處。這麼一來，可避免資本利得稅對成功投資人造成的沉重負擔。畢竟，美國企業歷史證明，這些高本益比法人股當中最知名的公司，會維持管理階層的活力，讓它們永遠不會自高驕跌落，而能在數十年間不斷成長。\n\
    \n# 影響力 3》 外國競爭\n\n直到 1957 年中，大多數美國人對本國的經濟霸權，已經自滿到沾沾自喜的程度，但歐洲小型車早已強勢入侵美國本土市場，而在大多數海外市場，早在低成本勞工生產的歐洲與日本產品大舉入侵之前，美國汽車、工具機，以及無數其他美國產品便已開始消失。然而，一般美國人尚未察覺到這種情況的長期影響。\n\
    \n接著，大眾情緒大幅逆轉，景氣加劇衰退，黃金大量流出諾克斯堡 ( Fort Knox，註⑨ )，外國低價車的銷售穩定上升，都是造成前景轉變的原因。\n\n\
    註⑧：編按：意味不再有額外的本益比提升驚喜。 \n註⑨：譯註：美國國家金庫所在地。"
