  md: '# 第2章 股票增值如何達到最大？


    票。一方面，現在有足夠的流通股票，加上股票的廣大市場，這些法人覺得這檔股票的流通性，讓它們可以用平常交易的規模來買賣。當先鋒金屬首度公開發行時，這種情況還不存在；另一方面，先鋒金屬有能力拓展到一般對手難以進入的成長業務，使得這檔股票完全符合許多法人機構的需求。


    在本書的其他章節，我討論到法人買家對股市的影響。我指出，這類買盤集中在少量的幾檔股票，往往使得這些精選的少數股票本益比，高於沒有被選中的股票（通常是有道理的）。如今先鋒金屬充分符合這類股票的資格，股價本益比已達到
    36 倍。


    因此，除了先鋒金屬股票的每股獲利在 10 年間上漲為 3 倍之外，還要再加上本益比升高，使得漲幅再加倍。簡單來說，那些在先鋒金屬首度公開發行時買進的人，在
    10 年間享受到 6 倍的增值（註③）。假如投資風險不高的話，很少投資人會對這種程度的報酬不動心；稍後我會提到風險這件事。另一方面，這種報酬跟羅賓森（或是他的支持者）相較之下，便顯得微不足道，假如其他人以前買下一些瓊斯的持股，來幫


    註③：編按：獲利為原來的 3 倍、本益比提高為原來的 2 倍，增值 6 倍（3×2）。'
