  md: '意，效益也小到不會產生重大影響。不過，有時候不是這樣，如果新收購的小公司有一條新產品線，可以發展成大公司重要的新產品領域，或是新收購的小公司有 1、2
    名人才，可以對進行收購的公司管理階層做出重大貢獻，這類收購不僅最不危險，也是整個購併領域最能獲利的。


    5. 基於第 1 條規則列舉的風險，當產品線相似、多年來熟悉彼此業務，並徹底了解對方問題的公司進行合併，這種購併才有最大的成功機率。相反地，兩家產品線極為不同、以往彼此不熟悉的公司快速合併時，慘敗的機率最高。


    6. 最成功的收購紀錄，通常發生在不是經常進行收購，只在所有可衡量因素都680適合，且被收購公司的領域與存續公司的業務密切相關時，才偶一為之的公司間。這種偶爾的交易，對股東來說，通常是一樁好交易，因為進行收購的公司「順其自然」，而不是一直積極地追求「交易」。


