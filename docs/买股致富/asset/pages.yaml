  md: '# 第4章

    小事

    但不完全是瑣事


    追根究柢，即使是最成功的股票投資，基本上就是包含 3 個元素，而且只有這 3 個元素。它們分別是：1. 挑選一檔或多檔未來漲幅將超越大盤的股票；2. 知道何時應該買進；3.
    如果要賣出的話，知道何時該賣出。然而，想做好這 3 項，需要對自己投資的公司具備大量背景知識，同時，還需要了解一些我在本書其他章節稱為投資圈對某一類股票的投資心態。成功的投資人或他的投資顧問若沒有學會應該找尋何種資料，而且花很多時間去尋找的話，便無法取得這些重要的背景資料。


    投資人時常面對其他一些需要考慮的事，但那些事對投資的重要性不'
