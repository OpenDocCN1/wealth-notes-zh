  md: '人或許仍很有貢獻，很多ѕ人便容易持續忽視長期下來，有個優秀銷售部門的重要性。等到數年後，沒有忽視這方面的電子股投資人，或許會獲得極為豐盛的報酬。


    # 製藥業


    另一個在 1960 年代讓投資人充滿希望的主要成長領域，是製藥業。人類對抗以前幾乎無能為力的疾病，例如白喉或小兒麻痺症，已大有斬獲，不難想見至今仍危害人類與寵物身體的各種疾病，以及許多心理疾病，若出現有效或更好的治療，就會立即出現強勁需求。以現代來看，直到二戰期間與之後幾年的一些驚人發展，而成功研發出抗生素之後，這個產業才算成熟，製造許多這些神奇藥物的生產技術臻於完美，使得這些藥品的價格，可以在大眾市場銷售。基於這個領域最關鍵的技術突破之後，將隨即造成巨大市場，經營良善、合乎道德的製藥公司，花費在銷售的費用，足可媲美最傑出電子公司用來尋找新的、更好產品的費用。除非所有的跡象都出錯，製藥業將為警覺的投資人，在
    1960 年代創造一些可觀利得。而這個多采多姿的領域，有什麼投資特點？


    就科學上來看，製藥業類似工業化學業，藉由化學製程，把一些分子'
  merge: -1
  img_proc: true
- pgno: 272
  md: '重組成具指定特性的其他分子，或是把原子和相當簡單的分子，組合成較複雜、具一組指定特性的物質。換句話說，即使製藥業製造的分子，通常比化學業的產品較大，也較複雜，但以技術來看，這兩類產品之間的差異很模糊。


    然而，從投資觀點來看，它們的情況其實相當不同。製藥股的投資特性介於化學與電子股之間，而基於價值成長速度，以及我認為它們大多具有高度風險，製藥股的投資特性更貼近電子股，而不是化學股，儘管製藥業與化學業的技術較相似。我已經指出，在化學業，一旦一項重要產品通過測試工廠階段，通常需要數百萬美元資金與很多時間，來設立生產該產品需要的複雜工廠。最好的化學工程，也只能偶爾提升傳統的1美元工廠資本創造1美元年銷售的比率。相反地，在製藥業，滿足全國市場所需的設備，通常可以很快設定，而且成本相對低廉。因此，製藥業並不存在化學業那種艱難的實體壁壘，可快速利用一項新產品，以及迄今仍大量銷售的競爭對手產品，可能同樣快速沒落。


    此外，雖然許多人或許不同意，但我相信在這個隨時都可能出現技術急速落伍的領域，仔細檢視大型製藥公司的產品結構便可看出，它們在這方面的防護，遠較一般人想像得少。許多製藥公司的大量銷售額，來'
  merge: -1
