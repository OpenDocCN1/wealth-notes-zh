  md: '來源。絕對不能忘記的是，一個聰明但所知訊息有限的投資專業人士，投資績效會遠遜於一個能力普通的投資專業人士，只因為後者充分了解大多數人還不知道的某家公司重大訊息，正因如此，消息來源才會極為重要。這也是為什麼一定要運用我說的「閒聊」，除非該名投資專業人士跟公司的管理階層極為親近，他可以依賴這個來源，去徹底了解有利及不利的發展。這通常要在密切往來數年之後，才能形成這種關係，否則，投資專業人士從一名公司管理階層身上探聽到的消息，雖然可能都是正確的，卻無法判斷是否有其他足以抗衡或壓制的消息。所以，一名十分成功的大戶投資人最近告訴我，他已阻止一些所謂的「證券分析師」打電話給他，「那些人只是在公司之間游走，把跟他們不熟的公司管理階層講的話轉述給我聽。我發現這類片面的消息可能很危險。」


