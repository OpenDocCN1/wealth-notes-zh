  md: '![](img/d88c2cbc14e9f8f0a4ef2a9b5869a2d8_158_0.png)


    # 第3章


    # 投資人與金融業該前往何處？


    出版《非常潛力股》（Common Stocks and Uncommon Profits）產生了一項意想不到的結果，就是我開始深入思考過去 2 年來最讓投資人擔憂的事情。這是因為幾乎從出版那天起，便有以前不認識的人登門拜訪、打電話和寫信給我。他們大多數都有很想問的問題，這些問題五花八門，但我最常被問到的問題是：「我一直在尋找可以信任的人，我找不到任何人真正了解他自己推薦的股票。我想花錢買這種服務，你可以告訴我應該去找誰嗎？」


    即使全國各地不斷有人問我這個問題，我無意暗指現在的投資業無法'
  merge: -1
  img_proc: true
- pgno: 159
  md: '滿足許多投資人需求，但其中一些人可能對此狀況毫無察覺。儘管在投資領域的某些部分，許多人無疑已找到能幹的人，受到適當的照顧，然而，仍有為數驚人的投資人，找不到他們覺得合適的投資顧問，我相信，這顯示投資業的基本方法，還有大幅改善的可能性。


    我起初有些猶豫，不知道分析這個產業現今的做法出了什麼問題，以及討論最終可能可以如何補救等相關議題，是否適合納入一本以投資人為對象的書。我後來判定那是合適的。假設正如我相信的那樣，大部分投資人都覺得找不到他們想要、也願意為此付錢的協助，讓這些投資人了解自己為什麼會有這種問題，可能會有些好處。不只如此，如果藉由了解這一點，他們可以自己好好判斷，現在有哪些投資服務最有可能滿足其需求，這些討論就會更有助益。


    我很確定本書其他章節討論的內容，在整個 1960 年代，都會影響到投資人。我接下來要說明的改變，也可能在這段期間發生。相形之下，儘管我相信金融業的這些改變遲早會降臨，卻無法準確預測何時會出現，理由在於投資業現今普遍形成的榮景。我認為，持續多年的股價漲勢，部分掩蓋住許多投資顧問的大量工作都處理得很草率，而他們從事的業務，卻是指引投資人如何投資。這種股價的漲勢，同時也讓許多做得很'
