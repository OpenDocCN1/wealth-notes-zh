  md: '# 4. 股價持續創新低


    當股價持續下跌、屢創新低，低點一次比一次低，就不應對它有太多的寄望。此外，不少投資人看到低點就想逢低買進，這並不符合簡單投資法的正確投资策略。因為就趨勢而言，低還有更低，你永遠不知道低點有多低，投資人應該順勢交易，跟隨著趨勢走，而不是預測低點抄底，畢竟底深不可測，應遵守紀律、眼見為憑、相信數據才是正確的投資方式。


