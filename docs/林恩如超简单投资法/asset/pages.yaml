  md: '# 巴菲特的「打卡投資法」


    巴菲特有一個投資理論叫做「打卡投資法」，他說：「我用一張考勤表就能改善你最終的財務狀況；這張卡片上有 20 格，所以只能有 20 次打卡的機會，這代表你一生中所能擁有的投資次數。當你把卡打完之後，就再也不能進行投資了」。


    這一段內文的意思並不是說我們這輩子只能投資 20 次，而是比喻「不要頻繁的進出市場」，在買進任一檔股票前，請「先再三確認所有情況是你真心能接受的」。


    以均差距計算為例，進場之前，請試算買進價格至週 20MA 的距離，得出均差距後再乘上 1,000，也就是說股票跌至週 20MA 是這一檔股票的最大損失。假設進場價格是
    60 元，週 20MA 價格是 55 元，均差距就是 5 元，那麼每張股票的可能虧損為 5,000 元（手續費未計）。


    # 風險計算


    進場價格－週 20MA 價格＝均差距，


    均差距 ×1000 = 虧損值


    【範例】：60 − 55 = 5


    5×1,000 = 5,000（元）


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_57_0.png)'
