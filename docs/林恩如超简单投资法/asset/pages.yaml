  md: '容易失去理性，被「快速致富」這四個字的慾望帶著走。投資之前記得要了解金融市場運作原則以及規定，熟悉規則進入股市做投資，尤其對新手來說應該從小額、長期投資開始，才能有效運用資金，讓錢滾錢獲取更大報酬，慢慢來不會比較慢，按部就班就算起步較晚，也能在股市大有所獲。


    # 蹈德類型4 借貸投資，影響生活品質


    投資相當忌諱借貸，若是手中沒有閒錢投資，必須要先打消進入金融市場的念頭，先從存錢開始。在金融市場中，勝出者大多是手中有多餘，拿著閒錢做投資的人，這些人懂得資產配置、分散風險，加上投資只是花「閒錢」，不影響日常開銷，也就不會因投資而影響情緒和生活品質。


    相反的，若是依靠借貸投資，一進場心態就輸了，會產生預期猜測盤勢和時間壓力，這樣很容易萌生出想要趁機翻倍、一次就要賺足的想法，因為急著想要快速獲利，更容易出現誤判行為，不僅沒有獲利，甚至越賠越兇，導致生活陷入困境，借貸來的錢成了更大的資金缺口。


    # 蹈德類型5 聰明牌買股，投資血本無歸


