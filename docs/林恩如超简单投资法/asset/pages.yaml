  md: '# 通膨的原因


    常見原因 1 大量印製鈔票


    當政府大量印製鈔票，會使過多的現金流入市場，而市場上的商品有限，並不會因為多印鈔票的關係讓商品變多，實際上是供給量仍小於需求量。因此，人們為了買到想要的東西就願意掏出更多鈔票購買，導致物價上漲，造成通貨膨脹。


    幸好，政府為了保障貨幣價值，通常會管控貨幣的流通，不隨意印製鈔票。印製鈔票的前提，包括考量國內生產總值（GDP）的成長比例、外匯存底狀況、通膨率等，經過評估之後，政府才會決定鈔票的印製數量。


    常見原因 2 戰亂


    因為現代使用的貨幣不是黃金或鑽石等有形資產，而是金屬硬幣和紙鈔，沒有實質價值，因此更需要國家的保障，當戰亂、國家政局不穩定，就無法保障貨幣價值。


    # 通膨的影響


    影響持有現金的人


    通貨膨脹除了會造成貨幣貶值，最重要的是會衝擊持有現金的人。也許，我們以為從現在開始只要每月固定存錢，等到退休時就可以擁有一筆錢可以花用。


    然而，這筆錢經過時間的累積並不會因此增值，反而會因通貨膨脹而不夠用。以銀行定存利息僅約 1% 來看，假設有 100 萬元的存款，經過 20 年的本金加利息計算，得到
    122.019 萬元，戶頭只多了約 22 萬元，可見只有 1% 的利息是完全跟不上通貨膨脹 3% 的速度。


    對抗通膨依靠有形資產


    除了現金之外，無法對抗通膨的資產還包括定存、儲蓄險、國民年金等，因為其價值會越變越小。反之，可以對抗通膨的則是有形資產，包括股票、股票型指數基金、黃金、不動產，它們不會因為貨幣漲跌而影響價值。'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 利用「開源」與「節流」，降低通貨膨脹影響


    通貨膨脹是每個人都會遇到的事情，但需要思考的是：如何降低通膨對自己影響的程度？


    想要降低通貨膨脹的影響，最重要的就是提高收入，就目前就業市場來看，不用指望公司能提供多優渥的薪資條件，因此我們更要創造收入。創造收入有兩個方法，那就是「開源」和「節流」，以「節流」來說，因為收入有限，就算再精打細算的生活，省下來的錢都不足以對抗通膨。


    因此「開源」就顯得相當重要，開源的主要方式有兩種，一是當斜槓族，培養多種工作技能，從多方兼職獲得更多收入；另一種則是投資理財，前提是必須先了解自己、評估虧損風險，找到適合自己的方式才能開始投資理財。


    # 面對未來，請超前部署人生規劃


    現在該以什麼姿態來面對未來，與是否做好人生規劃息息相關。簡單來說，就是確立自己的人生目標，並且做好有系統的安排與計畫。


    當決定好人生目標，才能為自已設定短期、中期、長期的里程碑，'
  merge: -1
  img_proc: true
- pgno: 19
  md: '並且朝著心之所嚮的未來一步一步的努力前進。但在邁向目標的過程肯定艱辛難耐，各種難題等著我們解決，畢竟人生的一切規劃大多是為了能夠在退休時過上富裕的生活。


    假使我們在築夢的過程中冒出過多的慾望就會前功盡棄，也許很多人將「及時行樂、把握當下」奉為圭臬，反正也不曉得明天會如何，各種小確幸營造美好的生活，但這都是不切實際的假象。


    因為，當收入還不夠充裕的情況下，這些想法都應該要避免，平時減少不必要的花費，例如高昂的治裝費、一頓動輒上千元的大餐等。若是真的有此需求則可以利用節慶促銷時再消費。


    為了擁有自給自足、輕鬆愜意的退休生活，就必須要認知在達到目標之前的過程將十分辛苦，請及早落實人生規劃，才能享受往後的人生不愁吃穿。'
  merge: -1
  img_proc: true
