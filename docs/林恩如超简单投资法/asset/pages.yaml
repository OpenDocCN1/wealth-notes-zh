- pgno: 104
  md: '圖」反映的是連日來的價格波動，「週線圖」反映的是連續數週以來的價格波動，「月線圖」則是連續數月的價格波動，當時間波段拉得越長越能看出股價趨勢。


    其中，週線圖的交易週期適中，趨勢明顯，一般投資人較能接受；日線圖波動較敏感，時間過短看不出方向，尤其主力有可能在短時間內操作股價，造成大起大落的走勢，無法正確判斷形勢；月線圖等待時間則更長，一般投資人耐不住長期的等待。所謂「見樹也要見林」，建議投資時以週線圖作為參考依據，關注個股長期走勢，判斷進出場所。


    # 投資策略一種就好


    投資最擔心「朝令夕改」，今天採用 A 策略、明天採用 B 策略，後天又改 C 策略，每天使用不同方式投資的結果，根本搞不清楚自己適合哪一種投資方法，也可能發生看錯圖形與時間軸，做出錯誤決定的情況。


    因此，穩定的投資策略才有穩定獲利的可能性，希望大家看懂股市多空循環圖之後，接著就是找出適合自己的投資方法，做好資產配置及風險控管，再進場交易。股市新手建議先從長線波段操作開始，別輕易選擇短線操作，否則極有可能在短時間內就損失鉅額本金，以及賠上高額的手續費，而提早離開市場。'
