    點一定準時打開手機聽著週報。


    經過一段時日，每週看週報解說盤勢，以及粉絲團不定時分享超簡單投資法的四大法寶運用方式，她反覆練習，先從模擬下單開始，利用虛擬交易初步學習如何買賣股票，接著開始嘗試實際下單，一開始她先從一檔股票開始，投入資金約
    100 萬元，很幸運的有 20% 的獲利。她與我分享她的心路歷程，她說雖然剛開始下單時有些害怕，但因為做好反覆確認個股是否有符合四大法寶條件才下單，之後也遵守跌破
    20 週均線時賣出，反而讓她覺得很安心。這位新加坡學員說，原來投資股票並不難，只要擁有穩定的心性嚴守挑選股票的原則，就可以讓自己獲利。'
