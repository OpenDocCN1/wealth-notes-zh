    # 理財小教室


    # 當沖 vs.長期波段操作


    當沖是一件嚴重透支信用的行為，不少投資人常羨慕當沖客可以在一天之內殺進殺出，但卻不知道當沖需要冒多大的風險而且交易量要夠大，才能在 4 個半小時中賺取報酬。其實，當沖並不是真正的投資，它需要強大的心智、果決的執行力、承受鉅額風險的能力，畢竟當沖就是以一天之內的股價波動進行買賣，因此當股市一大早開盤就要開始緊盯股盤直到收盤，每一個數字對當沖客都很重要，也因此須具備強大的心理素質才能勝任。


    相對的，長期波段操作看的是股價長期的趨勢，利用長期波段的相對高低點賺取價差，相對來說壓力較輕，也不會耗費過多心力在盯盤，加上若能堅守投資策略，情緒就不易被股價牽著走，也能做出正確判斷。'
