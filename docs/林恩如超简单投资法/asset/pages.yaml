  md: '# 法寶 4：成交量


    最後一個選股法寶是「成交量」，超簡單投資法除了運用均線判斷進出場時機外，同時要掌握趨勢線、型態，以及觀察成交量變化，四個法寶相輔相成就能挑選出好股票。那麼「成交量」在超簡單投資法中扮演什麼角色呢？答案是：評斷這檔股票是否有大戶進駐。


    所謂「大戶」包括法人、擁有千張股票以上的大戶，例如公司董監事、監察人、關係人、外資、投信、投顧等對象，這些人手上通常握有龐大資金可以大量進出股市。當他們一出手往往會瞬間拉抬股價，當然放手時也會使股價大幅下跌，有人「照顧」的股票會呈現在成交量指標上，投資人一定要關注成交量的變化才能判斷是否有買氣，確認股票是否該買進或賣出。


    投資人需要特別注意：如果某檔股票的股本很小而且成交量很低，但價格卻上漲，代表沒有主要大戶介入，這時候不宜買進，因為股票流動性低，有可能會出現想賣卻沒人要買的情況，最後只能入住套房。建議投資人挑選成交量大、明顯有大戶進駐的大型股、好進好出，才不至於買進出現後進退兩難的窘境。


    此外，檢視成交量請以週線圖為主要判斷週期，因為日線圖時間太短，即使在 3 ～ 5 天內有明顯爆量，也僅能看出大戶短期的動態，較難看出長期走勢，難以判定有無延續力道。然而，週線圖不僅區間較大，也較易看出成交量在一段區間內有無延續暴增的量能，當成交'
