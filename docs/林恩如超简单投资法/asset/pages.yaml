  md: '# 新手投資心法 1 **持股檔數**


    初入股市必定對整個股市操作與波動不熟悉，投資新手建議持股檔數為 3 ~ 5 檔，投資太多股票容易無暇顧及，單一個股投資像雞蛋全部放在同一個籃子，將會增加投資風險，分散在各股反而能降低風險。經過一段時間的交易累積，選股功力會大增，當獲利有感之後，再慢慢提高資金，增加持股水位。


    # 新手投資心法 2 **設定停損點**


    投資人在每一次進場前都要考慮風險，先想損失而不是先想報酬，所以設定停損點非常重要。計算可以承受的最大虧損金額，當股價不幸觸及停損點請毫無懸念截斷損失，最害怕在原地躊躇，猜測股價是否會再上漲的不甘心作祟。台股有上千檔股票，不需要執著在同一支股票，要像壁虎「斷尾求生存」一樣，才能降低資金的損失。


    # 新手投資心法 3 **選擇長期投資**


    一般投資可分為短期、中期、長期投資，短期投資包括當沖、隔日沖等，屬於極短線操作，並非投資本意，投資真正的意思是依靠長時間累積，進而用錢滾錢，賺取更大利潤。因此，投資股票應先從中期或長期投資開始，給市場時間讓利潤奔跑，當趨勢轉換時再賣出。


    # 股市正確心法 4 **加碼前要重新評估**


    隨時加碼是投資的特性之一，投資人選擇加碼的原因不外乎是看好股票的成長性，加碼投資可以提高利潤。然而，提高利潤的同時也'
