  md: '# 特性 3 交易成本容易被忽略


    每次買進賣出的手續費成本為 0.1425%，賣出則會再加上證交稅 0.3%，與其它銀行的金融商品相較，交易成本比較低，但卻往往被投資人忽略，常有投資人看上交易費低，因此經常買進賣出導致賠上過多手續費，長期下來也是一筆可觀的費用。


    # 投資美股，等於投資全世界


    「美股」是指美國股市的股票，透過投資美股等於投資全世界，參與世界上最優秀的大型國際企業的成長，包括谷歌（Google）、臉書（FaceBook）、蘋果（Apple）、亞馬遜（Amazon）等耳熟能詳的公司，成為它們的股東。


    美股市場相較於全球其他市場規模更加成熟、資訊更透明，也極少內線交易，很少人能夠撼動整個市場。因此，個股穩定性高，膽面上全球大型知名企業相對安全，趨勢明顯容易判斷。想要前進美股市場，在投資之前請先做好功課，了解美股的市場脈動，可以從三大指數著手，包括道瓊工業指數、標準普爾
    500 指數、那斯達克指數，之後再進一步研究各股產業脈動與市場狀況，找尋體質好的投資標的。'
