  md: '# **投資股票類型**


    投資股票應以中大型股與趨勢股為主，中大型股的優勢在於穩定性高、風險相對較低，投資新手可以選擇台灣 50 或中型 100 的商品；趨勢股則是看好未來趨勢，具有飆股的潛力，從
    K 線圖走勢可觀察得知。


    選擇高穩定、低風險的大型股


    第一次投資選擇穩健、低風險的股票，除了指數股票型基金如台灣 50（0050）、台灣高股息（0056）之外，也可以選擇老字號的大型股，像是台積電（2330）、聯發科（2454）、台塑（1301）、統一超（2912）等，這些企業規模夠大、體質健全，又有多角化經營，呈現穩定成長走勢，適合長期持有。


    以統一超（2912）為例，2016 年 1 月至 2018 年 7 月間，股價從 188 元漲至 378 元，走勢呈現上升狀態，長期來看是穩定向上成長，不過仍要注意即使是大型權值股，還是必須評估風險。'
