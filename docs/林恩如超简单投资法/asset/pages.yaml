  md: '# 自序


    # 看見簡單裡的不簡單


    我的經歷，你的借鏡


    「剛開始心中的一個小火種，點燃之後所發出的火光竟意外燦爛！」這是 24 年投資生涯的心情寫照。從小生長在交易之家，父母親是生意人也是全程參與台股的資深股民，在忙碌的工作之餘，最熱衷的就是股票投資。記得在懵懵懂懂的孩童時期，父親就開始教我金錢及投資觀念，經年累月的潛移默化之下，在我年幼的心中種下投資的小火種。


    踏入社會後因緣際會進入知名證券商當開戶小妹，剛開始負責開戶、集保、信用、出納、打單等櫃台工作，那時台股正值萬點行情，交易市場熱絡，於是公司大幅擴編，我輪調至前線擔任營業員，負責股票買賣業務。但是，多數的客戶習慣找資深業務員服務，以為這樣容易打聽到市場明牌，當時我才
    20 歲，因為資歷太淺總是被客戶拒於千里之外。不過，不服輸的個性以及抱持著不求人的心態，我決定自己當大戶，靠當沖就能達到業績目標，從此展開我的專職交易之路。'
  merge: -1
  img_proc: true
- pgno: 3
  md: '當時年輕氣盛總認為自己可以快速致富，短線當沖交易成為我的生活重心，每天都在尋找任何可能的投資機會，將時間全部花在關注全球股匯市的表現、閱讀多份財經報紙。一早8點45分開始繃緊神經，全神貫注在期貨盤，接著9點交易現貨，目光無時無刻緊盯盤勢，記錄著每一個行情的跳動，中午收盤之後接續看日股、美股等國際市場，深怕遺露任何機會及訊息。每天上緊發條的高壓生活步調，長期下來實在吃不消，毫無生活品質可言。


    日復一日的當沖生活過了10年，回首來時路，那時我真像一個職業賭徒，因為進出交易金額大，所以不把輸贏當一回事，不可一世的態度，讓我的價值觀徹底偏差。當時當沖交易就像在豪賭，贏了就貪心怪自己怎麼沒有梭哈；輸了就不甘心寄望下一把一次回本。其實，戶頭裡的錢很少是從價差獲利，即使有也只是微利，多數的錢都是交易手續費折讓，原來我一直在玩「吃角子老虎」遊戲機，只是拿回之前先支付的錢而已。反之如果沒有靠大量交易先繳出高額的手續費，我根本沒有收入，簡直就是白做工，然而這一段當沖經歷讓我對金融市場有更深入的認識。


    在職場生涯中，看盡證券交易廳的百態，觀察法人、市場大戶、散戶的交易手法，清楚知道某些特定人才是贏家，於是我開始解析贏家之所以能屹立不搖的原因，扭轉散戶總是賠錢的宿命。走過撞牆期，鑽研各種技術分析、研究各方數據、財報，最後發現何不直接回歸到市場最真實的大數據，透過多年實戰交易累積經驗，慢慢整理出自己'
  merge: -1
  img_proc: true
- pgno: 4
  md: '的投資策略「超簡單投資法」，這次不再是橫衝直撞，而是定心定性的優雅投資。


    十年磨成一劍，我在股海 24 年的時間磨出了兩把劍，第一把劍是磨「心」，第二把劍是磨「耐性」，散戶在股市往往鏦羽而歸的原因都是一心想賺大錢，而忽略培養正確投資觀念，強化投資心性的重要性，正所謂「財不入急門」，建議投資人進入市場前優先考量風險，進場前必須做最好的準備及最壞的打算，才不至於在發生風險時束手無策，以有限的風險賺取無限的獲利，真正的以小博大，複製成功交易模式並反覆操作，達到「大賺小賠」的投資結果。


    金融市場是一個人人平等的舞台，做好交易可以翻轉人生，人生不應該被交易捆綁，請將時間花在其他有意義的人事物上。


    感謝家人一路上的支持，更要感謝父母親從小就幫助我培養良好的投資理財觀念，一路陪伴，記得 20 多年前，為了提高當沖的信用額度，是父母親冒著可能會失去房子的風險拿房契當信用抵押，讓我能順利提高融資級數順利交易，若沒有雙親的不動產擔保，我無法擁有巨額且豐富投資經驗，記得過去交易失利慘賠時，媽媽生氣地對我說：「真不曉得這樣是害你還是幫你！」現在可以非常肯定的說，都是因為父母親的好眼光成就了我，那個幼年時埋下的小火種，現在已經發出燦爛火光，'
  merge: -1
  img_proc: true
- pgno: 5
  md: '同時，感謝全曜財經資訊李岳能先生率領優質的團隊，從軟體的編寫到解決用戶的疑難雜症，正因為有這一大群幕後功臣鼎力相助，讓我可以順利推廣超簡單投資，讓更多投資人知道交易可以很優雅，賺錢真的可以很簡單。


    從事理財推廣這些年來，看見各地學員的回饋，每個人都有著不同的故事，看到他們分享逆轉勝的歡喜過程，我衷心祝福，感謝每一位願意見證超簡單投資的學員，願你我一起創造更多的幸福共好。「敬天愛人」是我很喜歡的一句話，做一個喜樂的人，把自己喜歡的投資事，與您分享。


