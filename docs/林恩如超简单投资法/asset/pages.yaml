  md: '# LESSON 17


    # 個人理財規劃

    就從「現在」做起


    「阿才是一位年過 30 歲的上班族，嘴巴經常嚷嚷著要學投資，

    希望學會理財和投資，做好財務管理，幫助自己加薪，但說和做

    完全是兩回事，心裡想但沒有行動一切都是空談。做好理財和投

    資的方式並沒有想像中困難，最重要的就是決心，最好的理財時

    間就是『現在』，假如什麼都沒做，永遠都不會有任何成績。」


    # 從「現在」起，就要做好理財規劃


    在第一章中，我們已經提過理財的重要性，理財規劃关乎人生規

    劃，做好財務管理才能進一步實現各個階段的人生目標。


