  md: '# 心理準備3：準備好投資本金


    很多人想投資但第一個門檻就無法通過，所以在前一章提到投資之前必須先存錢，小資族第一桶金可以設定為 50 萬元，之後再慢慢累積第二桶、第三桶金，或訂定更大的目標，當然本金越大，獲利金額相對越多。


    投資必須先準備一筆「閒錢」，「閒錢」代表不會影響生活，就算這筆錢賠光也不至於破產，每個月除了基本生活開銷、緊急預備金、儲蓄等必要支出，必須再額外提撥投資本金，就如同存旅費，慢慢累積總有一天能達到目標。另外這筆錢絕對不要向他人借款，借款進行投資理財，只會增加你的負債，而不是資產。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_59_0.png)


    > 借款投資的錢是你的負債，不是你的資產。


    建議小資理財族可先從投資本金 50 萬元開始，本金多寡會決定投資時的靈活度，若是太少會顯得綁手綁腳，選擇機會不多，也無法分散風險。相對的，若金額較多則有機會選到好標的，也容易從中獲取高報酬。'
