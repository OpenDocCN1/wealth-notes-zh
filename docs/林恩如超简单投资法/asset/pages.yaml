  md: '# 理財小教室


    # 雞蛋水餃股、殭屍股


    「雞蛋水餃股」是指只要用買雞蛋、水餃的價格就可以買股，代表這檔股票太便宜了！「殭屍股」則是流通性低、成交量少，屬於冷門的股票。目前主管機關正積極整頓體質不佳的個股，因此建議投資時盡量避開淨值低於
    10 元、流通性低的個股。


    # 新手看過來，搞懂股票的三大特性


    不少投資新手會選擇股票做為投資入門，因為股票投入門檻較低，理論和邏輯也比較容易了解學習，以下分別列出投資股票的三大特性：


    +   特性 1 共同承擔公司利潤與風險


    由於購買股票就是成為該公司的股東，當股票上漲就能分享利潤；當股票下跌就是承擔跌幅損失，需要與公司共同承擔利潤與風險。


    +   特性 2 投資門檻低


    投資股票的入門標準較低，若以最低面額 10 元計算，1 萬元就可以購買一張股票，若能準備更多買股資金，那股票的選擇性將更多。此外，股票具有可變現性，隨時可以賣出換取現金，資金流通性較大。'
  merge: -1
  img_proc: true
