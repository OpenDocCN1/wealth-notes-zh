  md: '# **LESSON** 07


    # # 認識常見的投資工具


    「小楷是一個投資新手，面對琳瑯滿目的投資工具，有股票、期貨、基金等，他一開始茫然無措，不曉得應該選擇哪一種投資商品，但經過時間研究，加上衡量手頭上的閒錢以及自己的投資個性，他決定先從股票開始。」


    # ## 看懂投資工具，你握有選擇權


    市面上有各式各樣的投資商品，包括股票、期貨、基金、外匯等，令人眼花撩亂，到底該如何挑選呢？請先衡量自己實際情況，並評估以下 4 件事情：


    +   1. 願意投入多少心力學習


    根據投資商品的不同，風險高低也不同。舉例來說，若你是工作忙碌的上班族，幾乎沒有時間研究又想要投資理財，建議可從台灣'
  merge: -1
  img_proc: true
- pgno: 65
  md: '50、中型 100 成分股開始投資，大型股具有高度的流通性，基本面好、市值大不易倒閉，不用花時間深入研究公司體質是否健全，只需要遵守紀律交易，假以時日就能累積資產。


    # 自我評估 2 依喜好選擇投資商品


    從投資商品的持有時間來看，投資人可以根據自己的個性選擇不同的投資商品，每一種金融商品如基金、股票、債券、期貨、權證等，都有不同的交易規則，端看投資人的選擇。其中，期貨市場因有結算日的關係，近月商品最長持有時間為一個月，而股票依趨勢決定持有時間，而趨勢通常都會維持一段時間。


    # 自我評估 3 長期持有？還是賺價差？


    投資時可自問是要參與公司的配股配息？還是賺取價差？依據波動可分為兩種投資商品，第一種是選擇波動率低，長時間可穩定配息的股票進而長期持有，但此一方式有可能選錯標的，發生「賺了股息卻賠了價差」的情況；第二種則是賺取波段價差，像是股票、期貨等商品，此一邏輯也就是追隨市場趨勢，選擇時機進出場以賺取差額，但同時也要承擔停損的風險。


    下一章節會介紹「超簡單投資法」的投資概念，適用於所有的投資商品，運用一條均線判斷，站上均線買進、跌破均線賣出，就能一招打天下。'
