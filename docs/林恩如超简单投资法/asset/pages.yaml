  md: '# LESSON 15


    # 三不一沒有，

    不盯盤獲利法


    > 「選好股票後，就關掉看盤軟體吧！」CC 謹記這個祕訣，每次買好股票後就關電腦做別的事情去，盡量不想股票走勢，也不聽取他人意見，更不會和他人討論股票買賣的事，幾個月下來，她保持穩定的心性，不受波動影響，果然每個月都為自己加薪。」


    # 「不」聽，自亂陣腳得不償失


    「超簡單投資法」想傳遞最簡單的投資方法給大家，除了實用的策略之外，也同時考量投資人的情緒及心理素質，想在股市生存最重要的是擁有強大的心理素質，而不是高超的選股技巧。


    累積多年的投資經驗領悟出深刻道理，我強調投資應該遵守「三不一沒有」的原則，就是「不聽、不看、不說，沒有穩賺不賠」。以前在券商工作時，觀察到一些有趣的現象，有些投資人總是四處打聽'
  merge: -1
  img_proc: true
- pgno: 164
  md: '明牌、到處參加投資顧問、理財講座，甚至同時閱讀多家券商研究報告，每天盤後還耗時做一堆認為投資必做的功課，把自己搞得非常忙碌。然而，多年下來的績效仍然不彰，以負報酬居多。


    不可否認，許多投資人都相當認真，畢竟想要在股市獲利就要先學會金融市場的運作方式，並理出一套邏輯。但是做事需要正確的方法才能達到最高的效率，總不能付出所有時間及心力，最後徒勞無功，還賠上大筆辛苦錢。倘若你花了很多精力，有獲得同等報酬，那表示這個投資方式適合自己，若是做了很多功課，績效仍差強人意，那麼就必須好好檢討問題到底出在哪兒？


    基本上，投資必須做到「不聽」，在未經證實的情況下，不隨意聽取他人意見，有時股票會隨著市場消息波動，而突來一陣急殺，這時不論是各大媒體、社群網站、投資顧問、親朋好友，都會給出各種「自以為」的建議。但是，這些建議真的對投資有幫助嗎？首先你無法判斷給予意見的人是否真正了解市場，再者一旦聽進不同聲音，就很容易因為意志不夠堅定而改變原來的投資策略，甚至賣出手中持股，改買他人建議的「明牌」，忘了當初說好的「承諾」，投資步調就會大亂，也無法正確掌握進出場原則，落的明明有一手好牌卻全盤皆輸的下場。'
  merge: -1
