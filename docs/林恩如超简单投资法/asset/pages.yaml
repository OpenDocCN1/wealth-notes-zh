  md: '不同，賠錢長抱堅持不賣，也就是俗稱的「凹單」，然而當股票稍微有漲勢就火速賣出，長期下來不僅沒有獲利，還賠上金錢和時間，簡直就是傷心又傷荷包。


    **理財小教室**


    **何謂「凹單」？**


    當股票已經跌落至原本設定的出場價，原則上應該要立即停損賣出，但投資人卻不認輸，反而繼續抱著等待行情反轉，就是凹單。


    # 錯誤心態 4 抱怨——不滿足的心


    喜歡抱怨的投資人通常有著不知足的心態，當股票賣出之後，股價有可能持續往上，有些投資人就會開始抱怨怎麼沒有賣在最好價位，卻忘記操作應該是依照策略執行，如此不正確的投資心態就算是賺錢也感覺不開心。倘若遇到虧損較大時，周圍的親朋好友可能會陷人「怨念的颱風圈」一起聽抱怨，持續低氣壓的投資氛圍將會賠掉生活品質。


    **理財小教室**


    **心理素質比 IQ、EQ 更重要**


    良好的心理素質比 IQ 和 EQ 更重要，好在心理素質像肌肉一樣可以鍛鍊，只要維持機械化操作，不加入過多情緒，就能漸漸突破障礙，在該投資時積極行動、該脫手時毫不猶豫。


    第 3 章 個人投資心法，不看盤輕鬆加薪 175'
