  md: '由上述圖表得知，每月除了必要的基本生活開銷，應該盡量避免非必要的娛樂與餐費的花費，省吃儉用以達到存錢目的。


    住家裡：500,000÷（22,400×12）=1.86（年）


    租屋族：500,000÷（10,400×12）=4（年）


    # 找到適合自己的存錢方式


    除了省吃儉用之外，這裡也列出一般常見的存錢方法，請評估自己的投資個性，找到適合自己的存錢方式才能養成好習慣。另外，第一桶金往往是憑著堅持的信念，不畏任何原因，每月存固定金額，才能在時間內達到目標。


    # 方法 1 零存整付


    「零存整付」是指每個月存入固定金額，同時收取機動利率的利息，到期後再加上利息一次領回。以每月存下10,000元來說，若年利率為0.815%，到期利息為531元，連同本金就有120,531元。


    零存整付適合剛出社會還沒有第一桶金的小資族使用，透過這樣的存錢方式不僅風險低，也能保有本金並賺取利息，同時訓練自己建立儲蓄習慣的好方法。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 方法 2 進階版排序存錢法


    「排序存錢法」可以設定日、週、月的時間單位，以「週」單位為例，例如第一週存 10 元、第二週存 20 元、第三週存 30 元……，以此類推累加，一年共有 52
    週，到最後一週時會存 520 元，一年總計可以存下 13,780 元。


    ```

    10元 + 20元 + 30元 + …… + 520元 = 13,780元/1年 52 週

    ```


    若是經濟能力許可，可以嘗試進階版的排序存錢法，每週以百元為單位，第一週存 100 元、第二週存 200 元、第三週存 300 元，以此類推……，到最後一週時存入
    5,200 元，一年將可存 137,800 元，存款放大 10 倍，就可以於 4 年內存下 50 萬元的投資本金。


    ```

    100元 + 200元 + 300元 + …… + 5,200元 = 137,800元/1年 52 週

    ```


    # 方法 3 整鈔帶出去存錢法


    所謂「整鈔帶出去存錢法」適用於每月已有固定存錢習慣，但還想再加快存錢速度的人。這個方法是指出門時只帶千元大鈔，遇到必要消費時再花錢，回家之後存下剩餘的零錢，建議可以準備一個撲滿，每天將身上的零錢投入，日復一日，等到年末時結算，可以發現長期下來減少一些不必要的花費，同時又累積了一筆存款。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 方法 4 信封袋存錢法


    「信封袋存錢法」是指月初時先將薪水分成基本消費與強迫儲蓄，分別放入信封袋。以上述住家裡的小資族來說，可將薪水分成 5 份，分別放入 5 個信封袋，上面分別寫上餐費、交通費、電話網路費、其他、儲蓄。其中要儲蓄的部分不可動用，其他部分每天可以從信封袋裡的錢支出，等到月底再結算剩下的金額，再另外存入銀行帳戶。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_35_0.png)


    # 理財 TIPS 365 存錢法


    存錢方法千百種，每一種都有其擁護者。曾有新聞報導一名女網友利用 365 存錢法無痛存錢，第一天存 1 元、第二天存 2 元、第三天存 3 元，依此類推......，到第
    365 天時存入 365 元，而她一天共存兩次，因此一年下來就存了 133,590 元。


    你不想理錢，錢不理你。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 克服挫折，存錢好簡單


    許多人都有「月薪那麼低，哪有多餘的錢存下來？甚至是理財？」的疑問，但其實無論收入多寡都可以做好存錢這件事，這裡也列出多數人在存錢時常見的挫折，記得存錢時一定要克服心中的魔鬼，才能成功儲蓄。


    # 挫折 1 目標訂太高


    剛開始存錢時，許多人都以短短幾年內存百萬元為目標，但卻沒有檢視自己的基本開銷，不切實際的目標就容易前功盡棄。存款目標必須要兼顧經濟能力及執行可行性，請按部就班訂立階段性目標，當完成第一階段目標時，再朝第二階段、第三階段目標邁進。


    # 挫折 2 意志不堅定


    若是原本沒有儲蓄習慣，存錢時肯定痛苦萬分、無法走出原本的舒適圈的人更不能適應，容易出現「存錢好累又好難」、「原本生活比較快樂」、「人活著為什麼要那麼痛苦」等想法，此時記住堅持到底才能抵達終點。


    # 挫折 3 受不了誘惑


    受不了誘惑除了本身物質需求較高，也可能來自各種優惠活動訊息的影響，像是新品上市、折扣季等，企圖喚起你的衝動消費。這時候一定要反問自己「是需要？還是想要？」，又或是延後
    2~3 天再做'
  merge: -1
  img_proc: true
- pgno: 37
  md: '決定，另外也要避免與愛購物逛街的朋友出門，同儕之間的勸敗也是存錢大敵。


    # **理財 TIPS**  21 天養成存錢好習慣


    行為心理學研究發現，人們養成一個新習慣至少需要 21 天，第一階段的 1～7 天會感到刻意、不自然；第二階段的 7～21 天還是會感到刻意，但已較能自然面對，不過還是需要意識控制；第三階段的
    21～90 天就能不經意且自然，也不需要意識控制，就能夠自然養成某種習慣。


    存錢也是需要習慣的養成，存錢的過程絕對會感到痛苦，因為無法任意支配有違人性，但只要撐過 21 天就能順利養成習慣，將存錢變成生活的一部分，按部就班累積財富。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_37_0.png)'
  merge: -1
