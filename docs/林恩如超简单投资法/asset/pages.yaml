  md: '會增加成本和風險，所以加碼之前應該三思而後行，畢竟對新手來說，不加碼頂多是以獲利，但加碼後有可能失去更多本金，應求穩不求快。


    # # 面對股市黑天鵝，有準備就可無懼


    金融市場總會遇到黑天鵝事件的發生，黑天鵝事件（Black Swan Events）是指極不可能發生卻又發生的真實事件，通常會引起市場連鎖負面反應，甚至是顛覆現況。偏偏金融市場沒有不可能的事，2019年末至
    2020 年，新冠肺炎肆虐全球，大家都被這隻黑天鵝搞得人仰馬翻，不僅美股重挫在一個月內就啟動 4 次熔斷機制，台股狂跌，導致國安基金進場挽救股市，全球各地股災蔓延。


    究竟面對黑天鵝這一類無法預測的突發狀況，有沒有辦法降低風險，事前做好準備呢？答案是有的。投資人只要做好風險控管與資產配置，面對黑天鵝事件就能安然度過。風險控管方面，評估自己能夠接受的最大損失風險，主要以
    20 週均線為停損點，遵守遊戲規則，說好的停損一定要狠心執行。


    資產配置方面，投資本金要保留三成現金，七成投資本金，千萬不要孤注一擲，將所有資金投入。此外，七成的投資本金不要全部投入同一檔股票，以免資金過度集中，無法分散風險，每一次交易都應該做好最壞的打算、最好的準備。'
