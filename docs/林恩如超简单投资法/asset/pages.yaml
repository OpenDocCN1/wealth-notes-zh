  md: '1999 年電子股當紅，當時只要閉著眼睛隨便買股，就可享受天天漲、天天賺的快感，而我也因此累積一大筆財富，但是，好景不常，2000 年網路泡沫，市場行情急轉直下，全球看好的網路股全軍覆沒，台股大幅下跌逾
    6,000 點。當時，我手上有一檔相當看好的網路概念股，價格從 120 元跌至 20 元，面對雪崩式的股災，讓我措手不及，也首度見證台股萬點崩跌行情。


    記得第一次遇到股市崩盤當天，不知道如何面對家人，就躲進房間假裝睡覺，心情跌至谷底。經歷過慘痛的教訓之後，我決定休養生息，短暫離開股市，但仍天天心繫股市，每天記錄大盤走勢、整理資料、閱讀大量書籍，並沒有因為停止交易而暫停增加自我實力。


    # ◎ 投資心法 3：不間斷練習，越賺越上手


    投資就像學習新事物，需要透過長期且持續的練習，才足以累積大量經驗與心得，並且越來越上手，養成賺錢本質最後內化成體內 DNA，讓賺錢和賠錢都像呼吸一樣自然。


    2008 年發生次級房貸、雷曼兄弟破產一連串危機，掀起金融海嘯，全球各地股市陷入風暴，讓我再次歷經慘賠，一個月之內狠狠賠了 7 位數的資金，心情再度跌落谷底，後來經由爸爸的鼓勵，不放棄的我再燃起鬥志，爸爸常說：「打電動都有攻略可以破關了，金融市場一定有也！」'
