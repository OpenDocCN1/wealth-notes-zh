  md: '# 投資人最迷惑的盤整市場


    盤整合常見於股價在一個區間內上上下下，小幅度的波動，並沒有明顯上漲或下跌趨勢，最高價與最低價相差不大的狀況。


    依據歷史統計回測，股市盤整大約占了七成的時間，多数的股票在漲或下跌時都必須經過一段時間的盤整，這段期間不上不下的走勢十分磨練耐性，多數投資人都無法通過這關考驗，時常在盤整期間耐不住性子將手中持股賣掉。


