    除了對於金錢的態度之外，也需要觀察日常生活中，對於學習是否只有三分鐘熱度，容易相信別人講的任何事情，卻疏於查證真偽，這些都是評估你是否適合進入股市的條件，因為投資最怕人云亦云，沒有獨立判斷的能力。最後則是可否承受盤勢波動的壓力，往往盤勢震盪劇烈時，投資人的壓力隨之而來，對於虧損無法平常心看待就容易受到影響。


