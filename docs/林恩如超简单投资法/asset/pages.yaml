  md: '# 跟著大戶動向走的「籌碼面」


    籌碼面主張跟著大戶動向走，所謂的大戶大致上分為 3 種，第一種是三大法人，包括外資、投信公司、自營商；第二種是千張大戶，也就是一次購買上千張股票的主力大戶；第三種是關鍵內部人士，包括董監事、經理人、大股東等。籌碼面分析派認為，大戶因為擁有雄厚資金，通常會經過長時間觀察，看好股票未來走向才進場，因此與其自己花時間研究，不如搭上主力的順風車跟著買賣。一般來說，大戶買進、賣出時通常是連續動作，不會在一天之內就結束所有買賣，當主力大戶開始動作時，股價就會呈現連續上漲或是連續下跌的情形，這時散戶也就可以跟著大戶一起動作，獲利機會相對提高。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_92_0.png)


    圖中紫色框框處代表大戶連續買進，因此股價有一段漲勢。（資料來源／強棒旺旺來）


