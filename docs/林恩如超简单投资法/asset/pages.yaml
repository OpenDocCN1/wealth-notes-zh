- pgno: 23
  md: '# 理財規劃 4 步驟


    在擬定理財計畫時，我們需要詳列自己的收支項目，妥善安排資金分配，才能繼續設定財務與人生目標，並選擇適合自己的投資方式進一步累積財富。可以依循四大步驟進行理財規劃，依序如下：


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_23_0.png)


    # 第 1 步  詳列收支狀況


    理財規劃的第一步是詳列收支狀況，依照每月薪資收入，檢視自己當月的消費內容，同時列出目前帳戶的存款數字與年度固定支出金額，包括保險、旅遊、孝親等項目，透過記帳方式了解自己都把钱花到哪裡去了。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '記帳是掌握手中金錢流向的重要方法，平時若是沒有記帳習慣，大部分的人通常記不得自己買了哪些東西？做了什麼事？透過記帳才能逐一檢視自己的用錢方式，並從中學習分辨「想要」與「需要」的差異。


    舉例來說，每天習慣喝一杯50元的手搖飲料，請問這是需要？還是想要？答案當然是想要。因為喝飲料這件事並沒有急迫性也不重要，不喝也不會對生活造成影響。所以必須透過反覆檢視與思考，才能大幅減少不必要的支出。


    以月入30,000元的上班族為例，生活支出通常包括食衣住行育樂的開銷（如下表）。由下表來看，這位上班族每月必要開銷約17,600元，每月可存12,400元，雖然每年還有固定開銷包括繳稅、保險費等，不過通常可以與年终獎金相抵消。


    |  | 金額 | 支出佔比 |

    | :--- | :--- | :--- |

    | 三餐費 | 12,000 元（400 元×30 天） | 40% |

    | 交通費 | 1,500 元 | 5% |

    | 娛樂費 | 3,000 元 | 10% |

    | 電話、網路費 | 500 元 | 1.7% |

    | 其他（醫藥、生活用品） | 600 元 | 2% |

    | 合計 | 17,600 元 | 58.7% |


    上述案例是以住在家裡的上班族為例，倘若是租屋族則每月還需額外支付房屋租金大約8,000～10,000元，那麼可以存下來的錢就更'
  merge: -1
  img_proc: true
- pgno: 25
  md: '少了，因此更需要避免不必要的開銷，包括娛樂費、飲料與零食費，若是想再多省一點錢，可以選擇自己帶便當，節省開銷。


    # 每天花不到 100 元的小資生活


    記得 20 多年前，我在證券公司上班，因為這是剛出社會的第一份工作，身上沒有存款，想要投資卻連進入的門檻都達不到，所以只能努力存錢，幸運的是那時住在家裡，沒有多餘的花費，每天只有早餐和交通費的支出。


    還記得那時每天早餐只點培根蛋吐司 25 元，中餐由公司免費供餐，晚上就回家吃媽媽煮的晚餐。交通費的部分，每天騎著機車通勤，當時油價 1 公升 17 元，每週僅花
    50 元的加油費，就這樣日復一日，每天花不到 100 元，順利月存 9 成薪水。加上獎金分紅、兩年後就存到人生的第一桶金 100 萬元，那些日子辛苦的控制預算，在看到帳戶裡的數字後，感覺一切都值得了。


    # 第 3 步 設定財務目標


    財務目標關係著想過何種人生，但人生不是想想就好，需要透過長期規劃執行才能達標。舉例來說，若是想在 30 歲存下第一桶金、35 歲結婚生子，40 歲買下第一棟房子，60
    歲退休生活無虞，上述的希望都需要金錢來實現，因此做好財務分配，以及設立短期、中期、長期的財務計畫就更加重要。


    財務分配方面，我們可以将收入三分法，包括生活必要支出、存錢、零用金，未來想過好生活建議對自己嚴苛一點，不要規劃太多零'
  merge: -1
  img_proc: true
- pgno: 26
  md: '用金的花費，若零用金占比過高，相對會降低存款金額，那就必須花更多時間才能完成人生各個階段目標。


    各階段目標方面，所謂短期目標是指短期內想要做的事，例如計畫 3 年內存出第一桶金、兩年內進修取得碩士學位；中期目標則是比短期稍遠的目標，例如 5 年後結婚生子；長期目標則要將時間軸拉更長遠，就是需要更多時間和金錢的目標，像是買房置產、子女教育金、退休金等。


    # 第 3 步 選擇合適工具


    訂立好短期、中期、長期目標之後，接下來就要累積財富達成各階段的目標，除了工作收入、業外收入之外，最重要的是投資理財，包括股票、期貨、指數型基金、海外期貨、美股、黃金、外幣等都是投資工具。在投資之前，請先了解自己的投資個性，並且比較各種投資工具的優缺點，從中選出適合自己的投資方式。


    # 第 4 步 定期檢視調整


    對於規劃內容及執行方向，可以定期透過檢視目標，在執行時發現不合適之處，或是人生需求改變，甚至是外在環境變化，導致須將時間和金錢挪用他處，那麼就要微調方向，並且隨時追蹤新目標的執行狀況與成效，經過反覆的檢視調整，才能往人生最終目標邁進。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 失敗的理財規劃常見原因


    許多人都是從信心滿滿、胸有成竹的開始進行理財規劃，但總是半途而廢，有一搭沒一搭的執行，最終宣告失敗。一般來說，無法做好理財規劃最常见的原因大致可分為 4 種，包括賺多少花多少、對存錢無頭緒、以為傻傻存錢就好，以及懶得理財。


    # **原因 1 賺多少花多少**


    沒有記帳習慣、購物慾望較強、縱容自己任意消費、喜歡及時行樂的人，通常都是「賺多少花多少」的典型生活型態。即使是生活富裕的人也有可能發生這樣的狀況，因此提早做好理財規劃，養成記帳習慣、學習分辨想要和需要將可慢慢改善。


    # **原因 2 對於存錢毫無頭緒**


    每個人都是從存錢開始，累積資本才能隨心運用，不懂得存錢通常是對自己和金錢都不夠認識，或是對於花錢與存錢沒有計劃的人。萬事起頭難，請從現在開始存錢，了解自己的生浩開銷，設定好儲蓄目標，強迫自己存錢，當養成存錢習慣，正視金錢之後，你就能輕鬆支配它。


    # **原因 3 以為傻傻存錢就好**


    試想一個問題，學會理財投資與單純將錢放在銀行，哪一個方法才能累積財富？答案是前者，理財投資不僅可以將金錢做有效運用，


    第1章 20年後，遇見財務自由的你 29'
  merge: -1
  img_proc: true
- pgno: 28
  md: '更能利用錢滾錢創造財富。但若只是將錢存入銀行，以目前定存僅利息1%來計算，短期常因為有固定領取微薄利息就能增加財富的錯覺，以為把錢放在銀行最安全，但長期來看，經過20年物價已上漲幾乎一倍，積蓄卻只增加20%，完全跟不上通貨膨脹的速度，反而會有錢越來越小的感覺。


    # **原因4：懶得學習理財**


    所謂「你不理財，財不理你」，假使沒有花費時間與心力打理財富，那麼將難以進行各項人生規劃，也無法達到真正的財務自由，尤其現金會因為通貨膨脹而變小，錢也不會從天上掉下來，因此及早學習投資理財，做好資產配置，用心打造自己的財富，才有機會擁有優渥的生活品質。


