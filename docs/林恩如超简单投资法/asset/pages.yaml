  md: '以剛出社會的小資族來說，短期可先以 50 萬元為第一桶金的目標，比較容易達成，之後再慢慢累積第二桶金、第三桶金。


    # 每個人都要做好理財


    那麼何時才是最好的理財時機呢？答案就是「現在」。每個人都希望能提早退休，達到財務自由，享受安逸生活，這些期望都必須從早一點理財開始。理財可以幫助自己做好個人財務規劃，並且進一步實現人生各階段目標，而且理財越早開始越好。


    試想，當我們年輕時剛踏入職場，負擔相對較輕，沒有結婚生子、買房買車的壓力，此時沒有過多的額外開銷，這個階段是透過儲蓄累積資產的好時機。隨著年紀增長，大約 30～35
    歲時開始規劃下半段的人生，此時大筆開銷接踵而來，除了要成家，還有扶養雙親的壓力，這時候三明治人生的重擔正要開始，因此趁早開始理財相當重要，做好規劃讓人生下半場過得更精彩。


    # 與錢有約，落實執行


    知道理財的重要性之後，接著就是訂立目標，並且有系統的執行，人生不能漫無目的地想到什麼就做什麼，需要做好規劃並確實執行，人生才有意義。舉例來說，計畫在 3 年之內從小公司跳槽到大公司，那麼就該條列出所有要達成的目標，包括所需具備的專業能力、累積的作品經驗、建立相關人脈等，有目的的去執行，展現出來的企圖心及信心才能達成目標。'
