- pgno: 58
  md: '計算出可能的最大損失後，評估自己能否接受賠掉這筆錢再進場，若是願意承擔風險，那麼在未跌破週 20MA 之前請好好抱牢持股，只要方向正確，隨著時間停損金額會慢慢縮小，獲利即可慢慢浮現，進場前先計算最大損失金額，經評估後可接受再進場，形成有效控制風險的狀態。


    以乖離率計算風險為例，公式為收盤價格減移動平均價除以移動平均價，乖離率代表的是成本中最大虧損值的比例，當比例越大虧損越大，比例越低虧損越低。


    ```

    （收盤價格－移動平均價）÷ 移動平均價

    【範例】：（60 − 55）÷ 55 = 9.09%

    ```


    > 在買進任一檔股票前，

    請先再三確認所有情況是你可以接受的。'
