  md: '# 投資自己，穩賺不賠


    > 「在還搞不清楚資本市場的運作，以及如何投資理財之前，我靠著每天大量閱讀及交易，並且付出龐大的時間研究、了解各種投資方式，因為我相信，一旦了解箇中奧妙與邏輯，就能在投資上獲得豐厚報酬。」


    # 聰明的你，就是要投資自己


    上述的情境是我的親身經歷，回想那些年日以繼夜鑽研投資的时光，雖然辛苦卻充實，每天閱讀大量投資理財書籍、親手繪製K線圖，建立深厚的財經知識基礎，同時也抱持著學中做、做中學的精神，不斷累積實戰交易經驗，經歷過台海危機、中共試射飛彈、網路科技泡沫、金融海嘯等大股災襲擊，即使曾經慘賠，我依然不放棄，靠著堅定意志和努力學習，終於在投資的道路上，獲得財務自由。'
  merge: -1
  img_proc: true
- pgno: 39
  md: '有時遇到朋友問我：「投資到底該從哪裡開始呢？」這時我一定會問對方：「你想達到什麼樣的目的？目前還欠缺哪些能力和資源？」在釐清目的之後，接著就是充實能力以及檢視資源，而所謂資源並不一定是指金錢，人脈、時間等也包括在內，評估各方條件，務實的開始著手準備，當能力與資源完備後，就能以更有效率的方式進一步達成目標。


    因此，學習投資的第一步就是投資自己，因為心中的恐懼往往都來自於無知，所以充實自我的知識和能力，並且真正靠自己學會，搞清楚市場運作，才能少走冤枉路，開啟投資的康莊大道。


    # ● 投資新手必做的事


    初入股市的投資新手什麼都不懂，就像一張白紙，想要在白紙上畫出漂亮的圖案，就必須靠自己的努力。投資新手是最好塑形的階段，只要願意行動，學習正確的方法就能跨出成功的第一步。可以從三大方面著手，包括充實理財知識、嘗試實單交易、學習情緒管理。


    **方法 1) 充實理財知識**


    在投資之前擁有本金與充實相關知識相當重要，不少人進入股票市場都是跟風投資，完全不曉得自己在做什麼事，所以容易受到市場消息的影響，心情也跟著上下起伏不定，無法堅持而不斷更換投資方'
  merge: -1
  img_proc: true
- pgno: 40
  md: '法，誤以為什麼都學可以集各學派大成於一身，到最後變成任何投資方法都無法通透。


    然而，我們進入市場無非就是想賺取價差，增加財富，每一次交易都将希望寄託在某一檔股票，最好市場趨勢不斷往上、股價日漸攀升，檔檔都能獲利，但別忘了那都只是投資人自己打的如意算盤。縱使我們明知股市有高低起伏的波動，但當市場開始回檔時，內心就跟著恐慌害怕，其實都是來自於看不懂趨勢和不了解市場運作，證明投資一定要靠自己懂，所以學習相關理財知識刻不容緩，上戰場之前請充分準備生存技能，才能面對戰役。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_40_0.png)


    ▲ 股市走勢圖：股市走勢圖不會穩定上升，通常會呈現略為上下下下的狀態。（資料來源／強棒旺狂來）'
  merge: -1
