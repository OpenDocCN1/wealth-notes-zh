  md: '# 小月光 VS 小理財的故事


    小月光和小理財都是月薪 3 萬元的小資族，其中，小月光是個極度享樂主義者，每月 5 號領到薪水就開始約朋友唱歌、逛街、吃美食，到月底常常荷包見底，每月戶頭裡僅剩幾百元至幾千元不等，一年下來，帳戶裡的存款連一個月的月薪都不到。


    而同為小資族的小理財，知道剛出社會薪水不多，也不知道該怎麼投資才能利用錢滾錢創造更大收入。因此，他決定一邊工作、一邊存錢，同時學習投資，每月可以存下 2 萬元，一年之後，小理財的戶頭裡就有
    24 萬元的存款。


    發現了嗎？短短的一年之間，兩人就相差約 12.8 倍的存款，相信年復一年，沒有理財與有理財者的差距會越來越大，由可見理財的重要性。


