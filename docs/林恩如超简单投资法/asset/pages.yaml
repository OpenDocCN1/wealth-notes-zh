  md: '# **案例分享 1 美國學員投資美股**


    曾有移民美國的學員因為在國外工作不易，除了靠穩定的工作收入來源外，也希望能夠創造第二份收入，不僅幫忙養家，也盼能為自己提早存下退休金，他翻來覆去想了許多方式，決定選擇投資來創造第二份收入。


    在廣大的網路世界裡，他從 YouTube 頻道認識「超簡單投資法」，並將所有的教學影片看完，然後報名參加線上學習。透過幾個月的學習，他開始運用超簡單投資法投資美股，挑選美股的原因除了生活在美國外，還看好美國金融市場規範夠成熟、資訊透明、個股穩定性也高，因此他決定投資美股。他檢視個股
    K 線圖，包括股價是否站上 20 週均線、型態是否成立、趨勢線以及成交量狀況，每一次挑選個股都是利用四大法寶做篩選，並且定期檢視手中持股，反覆操作，嚴守進出場原則，他告訴我，超簡單投資法讓他即使身處異地也能累積獲利，交易原來一點都不難，只要將簡單的步驟重複做就能成功。


    # **案例分享 2 瑞士學員投資全球**


    曾有一對旅居瑞士的夫妻檔學員，投資商品廣泛，涵蓋全球金融商品，太太為了想上課學習搭機返台，不論課程辦在高雄、台中或是台北，只要有時間她都會來上課，並且將課堂內容錄給先生看。


    記得某一次台中場下課結束之後，我問她是什麼樣的動力讓她願意花 15 個小時搭飛機來上課，她說自己原本都是透過網站學習，在網'
