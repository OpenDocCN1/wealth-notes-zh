  md: '# # 滑雪帶給我的啟示


    2014 年 3 月，我到日本旅行，當時適逢雪季，心想人都來了，怎麼可以不滑雪呢？於是，在沒有仔細評估自己對於滑雪的運動能力，也沒有花太多時間練習，只簡單學會平面滑行。心裡想著：「平面滑行沒問題，要從滑雪道向下滑應該也沒問題！」於是，錯估形勢的我坐了
    10 幾分鐘的纜車抵達滑雪道頂端，沿路風景優美，但我無心享受，只聽見忐忑不安的心跳聲，看見陡峭的滑雪道，擔憂著等等如何順利滑下去，但是纜車是單程車道，沒有回頭路。


    果然，我完全無法踩著雪橇帥氣的滑雪，現在回想起來，真的好慶幸能平安回來，全程費盡力氣、嘗試各種姿勢，連滾帶爬的滾下來，當中不知道摔了多少次，只記得摔到全身是傷，連手機都摔壞了。


    當摔倒在雪地上時出現幾個想法「會不會有人來救我？」、「我會不會被其他人壓過去？」結果大家在雪地上都只顧自己滑雪，根本不會有人相理，唯一的生路就是「自救」，於是，我一次又一次的站起來、摔倒、忍痛站起、摔倒，翻滾了數圈才抵達終點。


    交易可以從生活中借鏡，這個慘痛的滑雪經驗，就如同投資交易，用錯誤的方法不僅無法順利抵達目的地，過程中也會受盡折磨。所以請做有把握的事情，找到方法並反覆練習，才能享受成果。'
  merge: -1
