  md: '# 持續工作，活出自我價值


    財務自由並非鼓勵大家不要工作，而是要改變生活的意義，活出自我，讓自己不再是為了賺錢而工作，而是因為興趣而工作。因此達到財務自由時，可以評估是否要維持原來的工作，或是選擇從事一份自己喜愛的工作，發揮所長，創造人生最大價值，為生活品質加分。


    # 永遠保持理財習慣


    持續保有理財習慣相當重要，不能因為錢多錢少而停止，養成良好的消費習慣、有紀律的投資才能維持財務自由。


