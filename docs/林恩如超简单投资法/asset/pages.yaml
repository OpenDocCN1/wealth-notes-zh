  md: '術線圖，找出其中兩個低點，隨著 K 棒走勢以線條方式連接，接著判斷走勢有無出現如「W」的樣貌。


    M 型態指的是股價的位置位於相對高檔，從股票某一段時間的技術線圖，找出其中兩個高點，隨著 K 棒走勢以線條方式連接，判斷走勢是否出現有「M」的樣貌。


    Q9  具有型態的股票是否比較會上漲？


    A：型態是超簡單投資法的四大法寶之一，所以是強勢股必備的條件之一，因為股票會上漲必須先經過反覆打底，才有機會突破趨勢線，此一階段的K線圖會出現明顯的漲相，可視為起漲前的徵兆。


    Q10  如何一眼辨別 M 型態與 W 型態？


    A：通常明顯的M型態或W型態必須經過一段長時間股價的大幅波動才會留下軌跡，遇到股價波動起伏較小，高低點沒有特別明顯時，表示該股票正經歷盤整階段，較不易看出型態，此時僅需要等待走勢有明顯起伏之後，再進行操作的判斷。多練習、勤畫圖，假以时日會發現K線圖正在和你對話。'
