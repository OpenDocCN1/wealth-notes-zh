  md: '投資理財的目的是希望可以賺到大錢而不是蠅頭小利，若只想在短時間內獲利，例如當沖交易的模式，可能僅賺取些微價差，卻容易在不賺不賠的情況下付出更多交易成本。


    相對的，若是投資人能有穩定的心性，願意花時間觀察股價長期走勢、掌握趨勢、判斷型態與成交量，通常可以找到正確的進出場時機點，而不會隨意買賣出股票。


