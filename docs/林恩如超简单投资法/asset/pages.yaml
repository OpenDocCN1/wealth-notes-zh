  md: '# 掌握美股三大特性


    投資美股就等於投資世界知名大公司，想想看，這些知名企業是否都和我們的生活息息相關？每天起床先滑蘋果（Apple）手機，早餐點麥當勞（McDonalds）滿福堡套餐，再來上一杯星巴克（Starbucks）咖啡，上亞馬遜（Amazon）網購，假日則是到好市多（Costco）採買生活用品，再到迪士尼樂園（Disney）旅遊，而大家常用的信用卡（VISA、Mastercard），全部都是屢一屢二的跨國企業。因此，若想要投資世界第一強的公司，可選擇美國股市，相對穩定，美股又具有以下三大特性：


    # 美股特性 1 適合長期持有


    由於美股市場的個股大多屬於穩定的大型股，因此除非遇到金融風暴或是天災人禍，很少有大幅度的漲跌幅波動，適合想長期持有的投資人操作，等待相對時機出場，賺取高額利潤。


    # 美股特性 2 沒有漲跌幅度限制


    美股不同於台股，沒有漲跌幅 10% 的限制，因此當有重大事件發生時就會出現大幅漲跌的情形，例如 2020 年初影響全球的新冠肺炎疫情，重創全球股市，美股因為沒有漲跌幅的限制，更數度觸發「熔斷機制」，因為市場發生劇烈波動，必須強制暫停交易一段時間，讓大家「冷靜冷靜」，再重新恢復交易。'
