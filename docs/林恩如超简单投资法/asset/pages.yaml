  md: '此外，手上永遠要保留至少三成現金，不少投資新手因為希望賺快錢、賺大錢，常常一開始就把積蓄全部投入，但一次押注的行為，風險過高，沒做好資金控管下場慘賠的大有人在，甚至提早股市畢業，更因為曾有不好的投資經驗留下陰影，永遠抗拒投資。基本上，投資高手也不會一次投入全部本金，因為他們懂得保命錢的重要性，「留得青山在，不怕沒柴燒」，請投資人要留住部分本金，才有東山再起的機會。


    # ## 心理準備 4：認識資本市場


    資本市場屬於長期資金市場，是提供一年以上長期資金供需的交易所在，例如：證券交易、債券交易等。資本市場對於投資者來說，雖然可以隨時買進賣出，但對於發行公司來說，只要賣出股票或債券就可獲得資金，並且可以長期使用，叫做資本市場。


    資本市場主要是依靠「趨勢、時間」累積賺取資金，金融投資市場是由多頭市場、空頭市場與盤整市場等三個面向不停循環，投資時只要搭上趨勢列車，方能利用波段賺進趨勢財。


    # 多頭市場，所謂的「牛市」


    多頭市場的由來是指當股票價格大漲的時候，投資市場熱絡，此時證券公司擠滿了看盤的投資人，形成萬頭鑽動的現象，所以叫做'
