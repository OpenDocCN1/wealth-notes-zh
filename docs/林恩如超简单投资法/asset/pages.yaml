  md: '量醫藥費用的規畫，當然可以透過保險發揮作用，但畢竟保險無法提供完整的醫療保障。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_22_0.png)


    接著將生活費、醫藥費、娛樂費加總並乘以 20 年，可得到以下數字：(264,000 + 100,000 + 51,000) ×20 = 8,300,000
    元


