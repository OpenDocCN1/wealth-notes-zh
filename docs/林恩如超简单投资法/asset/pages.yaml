  md: '# 公司股本大於 20 億元以上的「中大型股」


    台灣上市上櫃公司可以股本區分為大型股、中型股、小型股。大型股為 50 億元以上的股本，中型股為 20 億元～ 50 億元的股本，小型股的股本則是 20 億元以下。股本大於
    20 億元以上的個股通常穩定性高，不容易被特定人士操弄，且市場流通性也較高，投資人容易變現。反之，若是股本較小，流通性相對較低，成交量也不高，容易被有心人如股市禿鷹炒作，股價易暴漲暴跌，當出現意外狀況就會難以脫手。


    # 佈局美麗的「趨勢股」


    趨勢股顧名思義就是看好其股票的未來爆發力，只要在相對低點進場，耐心抱股在相對高點時賣出，利潤自然豐厚。投資人在選股時，請挑選股本大的個股，接著檢視其技術線圖，包括判斷趨勢為順勢交易、成交量爆增有大戶進駐、W
