  md: '# 法寶 _2 趨勢線


    趨勢線可以用來觀察股價在某一段時間內是上升還是下跌，它是

    以 K 線圖為基礎，再自行畫出一條趨勢線，趨勢線可分為 3 種，包括

    上升趨勢線、下降壓力線與橫切線，以下分別介紹：


    # 上升趨勢線


    第一種「上升趨勢線」

    是指股價在過去某一段時間內

    往上走，趨勢線的畫法是找出

    連接股價波動的低點，兩點相

    連，若股價沿著此線方向往上

    走，那就代表該股走勢正在上

    升，屬於上漲的行情。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_131_0.png)


    # 下降壓力線


    第二種「下降壓力線」

    是指股價在過去某一段時間內

    往下走，趨勢線的畫法是找出

    連接股價波動的高點，兩點相

    連，若股價沿著此線方向往下

    走，代表該股走勢正在下跌，

    屬於下跌行情。


