    # 基本面的名詞解釋


    每股淨值

    每股淨值可視為衡量公司股票價值的標準之一，當公司長期獲利、市場願意給的溢價高時，股價就會高於每股淨值；當公司長期虧損、市場願意給的價格低時，股價就會低於每股淨值。


    股價淨值比

    股價淨值比可以做為股票買賣依據，當股價淨值比大於 1，表示市價被高估，價格較高；反之，若股價淨值比小於 1，表示市價被低估，價格較低。


    殖利率

    殖利率主要是用來判斷投資報酬率，計算方式是以現金股利除以股票價格。


    本益比

    本益比是投入成本與每年收益的比例，計算方式是股價除以每股盈餘。'
