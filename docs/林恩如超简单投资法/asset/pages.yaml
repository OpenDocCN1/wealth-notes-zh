  md: '# Q1 何時該進場和出場？


    A：以超簡單投資法的原則，最簡單的進出場指標就是以 20 週均線為依據，當股價站上 20 週均線時買進、跌破 20 週均線時賣出。此外，進出場也必須搭配四大法寶——均線、趨勢線、成交量、型態，當符合相關條件時，能夠更精準判斷買賣出的關鍵點。最重要的是進場前先設好停損點，同時把握「慢慢進、快快出」的原則，當機立斷的處理持股。另外，進場原則是於每週最後一個交易日，確定股價在收盤時站上
    20 週均線再買進；出場原則是股價於任何一個交易日，若跌破停損點就應立刻出場。


    # Q2 如何分配手上資金？


    A：請準備一筆不會影響日常生活的「閒錢」再進入股市投資。以新手來說，建議先存 50 萬元，每次投資股票檔數約 3～5 檔，平均分配以達分散風險。另外，身邊永遠要保留至少三成的現金，千萬不要一次投入全部資金，以免股價發生非預期性的崩跌，到時沒有現金可以運用，難以東山再起。


    # Q3 过多的股票档数应该如何选择？


    A：利用超簡單投資法選出符合條件的股票之後，若發現選出來的股票還是太多，可以利用類股輪動原則，挑出數檔優質的金流股，也可再'
  merge: -1
  img_proc: true
- pgno: 211
  md: '次利用四大法寶進行篩選，逐一檢視個股圖形，選出技術線圖漂亮的股票，並計算自己能接受的個股最大虧損風險進行排序，從中挑選出前 3 ～ 5 檔的股票進行操作。


    # Q4 投資心性不穩定該怎麼辦？


    A：想要透過投資獲利，最重要的前提就是訓練自己的投資心性，不受任何外力干擾，股價上下波動實屬正常現象，不必過於在意。若是發覺自己很難不在乎，應盡量避免參加過多的投資社群，因為吸收太多無效資訊，反而容易影響判斷力。記得只在必要時檢視持股，堅守「不聽、不看、不說」法則，例如：每週五檢查股價有無跌破
    20 週均線，反覆提醒自己遵守遊戲規則，訓練靜心與耐心。


    # Q5 資金有限應該如何選擇標的？


    A：手上資金有限時更要做好資金管控，不要過度買進股票，可選擇 1 ～ 2 檔穩定的大型股開始投資，同時繼續學習投資方法，包括控制風險，學會面對虧損，增強自己的投資心性，慢慢累積經驗才能累積財富。


    # Q6 如何挑選出潛力頸股？


    A：挑選股票可以選擇大型股本的股票入手，例如台灣 50、台灣中型 100 指數的 150 檔股票，因為公司股本大，代表流通性佳，較無人為'
  merge: -1
  img_proc: true
- pgno: 212
  md: '操作的問題。選定個股後，運用超簡單投資法的四大法寶進行判斷，包括是否突破趨勢線、型態出現、成交量增加等條件。或是，選擇剛盤整結束的個股，因為股價起漲之前一定會先有一段醞釀期，盤整結束加上趨勢來臨，就有機會發動漲勢。


    # Q7 如何判斷趨勢線？


    A：趨勢線分為上升趨勢線、下降壓力線與橫切線，其中，上升趨勢線是指股價在過去某一時間內往上走，找出連接股價波動的低點，兩點相連，畫出股價趨勢，中間不能有K棒穿越趨勢線，若發現趨勢線往上，就表示股價正持續攀升。


    反之，下降壓力線是指股價在過去某一時間內往下走，找出連接股價波動的高點，兩點相連，畫出股價趨勢，中間不能有K棒穿越趨勢線，若此一趨勢線往下，就代表股價正形成持續走弱。


    另外，第三種趨勢線是橫切線，是指局勢不明的盤整狀態，趨勢線的畫法是找出連接股價波動的高點，兩點相連，中間不能有K棒穿越趨勢線，若該線條呈現水平狀，就表示股票正處於盤整格局。


    # Q8 型態的W底和M頭怎麼看？


    A：W型態指的是股價的位置位於相對低檔，從股票某一時間段的技'
  merge: -1
