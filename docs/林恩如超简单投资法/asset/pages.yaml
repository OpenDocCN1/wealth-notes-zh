    # 理財小教室


    # 定期定額不要輕易停止買賣


    定期定額強調的是長時間投資並且分散風險，以 0050 為例，長期投入的報酬率優於定存，因此不要輕易的中斷定期定額的投資動作，以 2008 年金融海嘯那年來看，雖然跌幅約
    50%，但台股市場長期仍是漲大於跌，若持續投入交易的人當時沒有因為害怕就停止買進，就可以有不錯的報酬率。'
