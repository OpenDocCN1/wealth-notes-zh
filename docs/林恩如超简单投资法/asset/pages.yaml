- pgno: 169
  md: '# ## LESSON 16

    # 大賺小賠，

    # 很多人都做到了


    「史丹佛大學的『意志力科學』課程受到學生歡迎，2008 年第一次開課時，因為太多學生報名，為了容納不斷加選的學生，一共換了 4 次教室，有人上完課因此收拾脾氣，不再對小孩亂發脾氣；有人開始規律運動；有人戒除甜食癮，追根究柢發現；無論是學業、事業或投資，心理素質的重要性遠比技術更重要。」


    # ## 沒有穩賺不賠的投資


    我們知道股市沒有「穩賺不賠」，那到底賺錢的人都是用何種方式獲利？其實，成功的投資人都是靠著「大賺小賠」累積財富。所謂「大賺小賠」，就是賺大錢、賠小錢；賺錢大於賠錢，最後的結果是「賺錢」，例如
    10 筆交易中有 6 筆賠錢，有 4 筆賺錢，但 4 筆賺錢的交易都是大賺，就可以彌補那 6 筆賠錢的損失，甚至還有盈餘，經過長時間的累積盈餘，自然會滾出一筆豐厚的利潤。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '那麼投資人要如何做到「大賺」呢？除了不要過度交易外，還要跟隨趨勢、順勢交易，當掌握到正確的趨勢方向時，請緊緊抱住持股，直到盤勢轉向再出場。此時已經抓住波段機會，獲利是市場回報給遵守遊戲規則的投資人。此外，停損更是獲利的關鍵，當觸及停損點時請毫不猶豫的出場，將損失限縮在可接受的範圍就是「小賠」，每一次的交易都要以平常心看待，才能捱到賺錢的那一次。


    保持穩定的投資心態包括嚴守投資紀律、保持交易信心、良好風險控管、做好資金分配與確實執行停損等五大重點；反之，錯誤的投資心態則有貪心、妄想、偏執、抱怨等四種人性弱點，以下分別說明：


    # **致勝心態 1 嚴守投資紀律**


    投資要有所本，就像玩遊戲要遵守相關規則及注意事項，才能安心、安全的玩樂。超簡單投資法的紀律就是：當股票符合站上 20 週均線，以及符合四大法寶後才能出手買進；反之，當股票跌破
    20 週均線就即刻停損，而非憑自我感覺，隨心所欲的交易。


    # **致勝心態 2 保持交易信心**


    在學習投資的一路上，交易信心是最受考驗的環節，市場總是冷酷無情，不會留情面給投資人，又最愛出題磨練投資心性，倘若交易都一直賠錢，就會產生不好的投資經驗，進而啟動人類的保護機制，為了安全不再靠近風險，此時交易信心就容易瓦解。


    172'
  merge: -1
  img_proc: true
- pgno: 171
  md: '有時投資是違背人性的，我們必須想辦法克服，那就是抽掉情緒，機械化交易，不帶感情才能戰勝交易。當賠了N次之後，再度出現符合條件的股票時就進場，進場的原因不是「賭」而是條件符合。交易信心需要靠一次又一次的操作才能體悟箇中道理。


    # 致勝心態 3 良好的風險控管


    你我都不是天生財力雄厚的天之驕子，行走在金融市場，風險無所不在，每一次投資前都必須做好風險評估，再三確認自己的虧損承受度，絕對不是嘴巴上說說而已，而是要說到做到，愛錯了不甘心不放手才是最大的風險。


    # 致勝心態 4 做好資產配置


    投資理財不是賭身家，買股票更不可以孤注一擲，應該做好風險分散。投資的資金一定是要不影響日常生活運作的「閒錢」，就算賠光也不至於破產。另外，全面考量投資理財的資產配置，例如存款、股票、期貨操作等，其中進入股市身邊至少保留三成資金，以備不時之需，無論是東山再起、或是乘勝追擊，都需要有資金才能執行。


    # 致勝心態 5 確實執行停損


    面臨停損之際，絕對是一場天人交戰，當初確定的進出場原則，最容易在此刻拋諸腦後，因為「不甘心」。停損是需要不斷練習才會練就的功夫，遇到停損請當機立斷砍單出場，不可以躊躇不前，往往一個遲疑就會擴大損失，陷入賠太多會捨不得賣、最後演變成越賠越多的結果。'
