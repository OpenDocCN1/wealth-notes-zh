  md: '接著，挑選有潛力的產業進行個別產業分析，指標包括各產業整體銷售量、產品效能、產業公司數、產業公司規模、國內外競爭狀況等，從中抽絲剝繭後再挑選出有前瞻性的公司放入分析名單。


    依據公司的財務狀況、內部運作、市場狀況、銷售量、價格、新舊產品等進行研究分析，進而選出值得投資的公司。一般來說，公司發展會隨著景氣高低而有起伏，經濟繁榮時，營收自然增加，股價也會跟著上漲，相對的，景氣衰退時，營收會持平甚至下降，導致股價下跌。


    # 觀察數據做客觀分析的「技術面」


    技術面主要是分析各種數據，並研究股票圖形、觀察趨勢以判斷未來走向，因此學會看懂 K 線圖非常重要。此外，各項技術面的指標也要了解，包括均線、型態、趨勢與成交量等，才能提高投資勝算。其中，均線指的是過去幾日內收盤價的平均值，常用均線包括
    5 日均線、10 日均線、20 日均線、60 日均線、100 日均線、120 日均線、240 日均線，投資者根據自己的交易模式決定觀看的均線週期。若投資人是使用「超簡單投資法」，那麼就屬於中長期交易者，建議以
    20 日均線、100 日均線為準。


    另外，常用的型態包括 W 底、M 頭及盤整型態，主要是用來判斷某區間的價格走勢，該指標不需要計算數字，只需要用肉眼觀察即可。在檢視型態時請以固定週期來觀察，不要今天看短、明天看長，一致的基準，分析才有意義。'
