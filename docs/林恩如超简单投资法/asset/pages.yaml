  md: '# 簡單的方法最好用


    股票運作的道理很簡單，當股價上漲時會從低價往高價走，相對的，當股價下跌時會從高價往低價走，我們只要設定一個中間的參考價格，做為買賣的基本依據，就能在股票市場中長期操作。而超簡單投資法就是利用
    20 週均線操作法，並且搭配均線、趨勢線、型態、成交量等四大法寶做為交易策略，投資人只要穩定操作，極度相信，長期就能達到大賺小賠的目標。其中，當出現停損跡象時就要對股票有敏感度，關注是否會跌到自己預設的停損點，若已經跌破
    20 週均線就該即刻出場，才能將損失降到最小。


    在金融市場生存多年，光是確實嚴設停損點就學了好幾年，當中也付出過慘痛的代價，繳出昂貴的市場學費買來的寶貴經驗。在經過一次又一次的修正調整，徹底嚴格執行停損，將停損內化為投資DNA，才讓我一路走到現在，停損說來簡單，但真正發生時願意立刻果決執行可不容易，畢竟人性總是選擇寬以律己，抱持再看看的念頭，通常那個「再看看」會讓人錯過最佳出場時機，「看」到最後的結果就變得萬念俱灰，若想在股市長期交易，必須真正學會停損。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_174_0.png)


