    想要避免跟風投資且不受他人影響，一定要知道「投資是自己的事」，當學會投資這門學問，擁有獨立判斷的頭腦，才能不畏金融市場的波動，同時要強化投資心性以及情緒管理，如此一來就不會受到他人影響。


