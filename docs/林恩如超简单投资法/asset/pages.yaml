    # Q15如何設定停損、停利點？


    A：最簡單的停損、停利點的設定，就是當股價跌破 20 週均線時賣出，另外也可以根據個人的風險接受度設定，例如跌破 20 日均線、每週前一根 K 棒低點等方法，詳細內容可參考第
    14 課「設定停損停利點」。


    # Q16股價在 20 週均線附近糾結，請問該繼續等待、還是賣出？


    A：有時剛買入的股票就進入盤整階段，一直在 20 週均線點位附近糾結，非常磨人心性，時常讓投資人出現「進退兩難」的心情，此時只要沒有跌破停損點，請耐心繼續等待，無須天天看盤影響情緒。


    # Q17如何判斷起漲點？


    A：判斷股票的起漲點可以透過四大法寶進行判斷，包括股價站上 20 週均線、出現「底部高」的 W 型態、突破下降趨勢線、成交量爆量等轉強訊息，當出現上述訊號就表示股票即將起漲。'
