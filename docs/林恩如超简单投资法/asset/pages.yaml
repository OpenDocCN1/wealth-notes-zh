- pgno: 235
  md: '# 後記


    # 當自己的人生資產管理師


    每个人都應該思考人生的核心價值究竟是什麽？值得慶幸的是「投資」一直是我的人生當中最熱衷的事情，如果喜歡的事可以因此讓他人富足，那何樂而不為呢？2006 年諾貝爾和平獎得主罕黙德・尤努斯（Muhammad
    Yunus）曾說：「一個人的影響力，沒有極限。」在祖國孟加拉最動亂的時刻，他毅然回到家鄉，選擇走入人群，創辦微型貸款銀行，幫助窮人創業，30 多年來從未停歇，而尤努斯提倡的理念更被應用於全球數十個國家，幫助超過一億人民掙脫貧窮。幫助他人翻轉人生就是我最重要的人生價值！


    爸爸與我曾經有一個幸福約定，他說：「如果有一天有能力的话，别忘了回饋社會，人生會因此更快樂。」在金融市場上，看過很多人為了奪金而散盡家產，也有不少人了为了一賭運氣，而慘賠人生？我將青春年華的時光全部獻給
    24 年的股市生涯，這段人生旅程驚險萬分，曾為了慘賠的交易付出極昂貴的學費，但是也非常感謝上天讓我先體驗過黑暗再走到光明，在人生最低潮的時刻仍然保有積極樂觀的態度，沒有因此而放棄投資，反而將所有無論好壞的交易經驗轉化為前進的動力，從中悟出「超簡單投資」的交易法則。對投資有更透徹的見解。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '我將這些年的真金白銀實戰經驗化為文字與您分享，盼能讓投資人避開冤枉路，走上正確的投資道路，直接從最實際的交易策略開始學起。對我來說交易即是生活，交易已經深入日常生活之中，它必須要有原則、有紀律，它更是一種態度、一種理性、一種自主。記住，任何事情都有跡象、有循環，進入金融市場必須學習靜觀其變，相信自己眼睛所看到的數據，而不是相信他人的空口無憑。


    投資最重要的關鍵不在於一心想著快速獲利，而是在進場前先想好損失，在交易操作時，必須知道高一和趨勢不同方向時該如何應對？至於能獲得多少利潤就由市場回應，達到心中無股票的境界才是投資王道。


    「 時間和機會 」是投資人的好朋友，獲利的關鍵除了選對標的之外，更重要的是堅定抱住的心態，多數人無法賺到錢的原因在於害怕賺大錢，只要稍微一有獲利就馬上出場了結，其實想要賺大錢靠的是時間累積。另外，請將買賣股票當成實體企業來投資，就如同開設公司必須進行事前評估規畫，先設想好所有的風險，而非只是在鍵盤上動動手指頭按一按般的輕鬆。


    學習理財投資任何時間都不嫌晚，只要你願意起心動念，勇敢跨出第一步，才能有真正的開始。投資人必須擁有人生自主權，做自己的資產管理師，交易請務必 「 自己學、自己會、自己懂
    」，學會了就是自己的資產，任何人也帶不走。讀完這本書，相信你在投資道路上'
  merge: -1
  img_proc: true
