  md: '# 投資是雙面刃，掌握風險最重要


    投資是一把雙面刃，從小到大我們一定聽過這句話「投資一定有風險，投資有賺有賠，申購前應詳閱公開說明書」，說的就是認清投資風險的重要性，無論是哪一種投資工具，可以賺到錢也可能會賠錢，因此事前更需要做好風險管理。


    做好風險管理包括進入金融市場前先計算風險、設好停損點，確認虧損接受度再進場，畢竟每一次投資都是辛苦賺來的錢，若是沒有做好風險控管，一不小心賠光本金就會變得痛恨股市，也可能永遠不再踏入股市。因此，隨時提醒自己評估好風險，做自己可以承受的事，選擇適合自己的投資方式與工具，才能讓投資幫助自己。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_184_0.png)


    > 投資股票不是中樂透，不可能買一次股票就人生大翻身。'
  merge: -1
  img_proc: true
- pgno: 185
  md: '# 聰明選股，練習排序做選擇


    > 「辰辰是一間網路公司的數位編輯，一開始在投資理財這條路上並不順遂，她沒有自己的投資方法，總是靠著到處問朋友，跟著別人一起買賣股票，幾年下來幾乎都是賠錢出場，後來她因緣際會接觸到『超簡單投資法』，憑著一條均線操作方式，把握進出場原則，終於在數月後開始累積獲利。'']


    # 選你所愛，愛你所選


    在開始接觸投資時，一定或多或不少會接觸各種投資訊息，像是財經新聞、親朋友好分享、網路文章等，建議在理財投資這條道路上，你必須建立好一套適合自己的投資策略，從頭到尾貫徹執行，不中途中隨意更換方式，反覆執行才能看見成果。


    在眾多投資商品中，股票是門檻相對較低、交易邏輯也較好理解'
  merge: -1
  img_proc: true
- pgno: 186
  md: '的一項金融商品，但也因為很多人的過度輕忽，在股市中跌得遍體鱗傷，最後只能黯然退場。其實無論是哪一種投資商品，只要理解它，懂得用正確的方法操作，就能在市場中輕鬆獲利、優雅生存。


    對於投資股票來說，許多人一開始都因為「選股」這件事而感到無所適從，畢竟要從台股 1,700 多檔股票中選出適合的標的真不容易，因此我們必須要有一套自己的選股策略。市面上選股有好多種方式，包括以研究公司營運狀況的基本面分析、透過數據和圖形判斷的技術面分析，以及觀察股票重要持有者動態的籌碼面分析等，投資新手一定要找到適合自己的投資策略，投資才能順利上手。確定每一步操作都有所依據與邏輯，就能從茫茫股海中篩選出漂亮的股票，並從中有效判斷股票的升值潛力。


    # 超簡單投資法，看圖選股好簡單


    投資新手剛開始會到處找資料，在看過投資方法之後，還是會因為訊息太龐雜，方式難理解、資料太多等原因而選擇放棄，加上現代人工 作繁忙，沒有多餘時間分析複雜的資料，以及追蹤消息的正確性，所以投資理財時常不得其門而入。


    而「超簡單投資法」解決投資人的這些障礙，採用的是技術分析，利用大數據解析各檔股票走勢，不用在意過多的消息，也不需分析各種'
  merge: -1
  img_proc: true
- pgno: 187
  md: '財報數據，用最簡單的方式做為選股策略。


    只要以一條均線做為最根本的投資原則，並且搭配均線、趨勢線、型態與成交量等四大法寶，利用圖形做驗證，選出好股票。「均線」可用來判斷股價走勢多空，當股價站上 20
    週均線就表示方向偏多；「型態」是判斷底部還是頭部，當 W 底型態成立就容易產生上漲趨勢，反之，當 M 頂型態出現就可能出現下跌狀況；「趨勢線」是判斷上升趨勢或下降趨勢，當股價持續沿著上升趨勢線就表示行情持續，反之，當股價跌破上升趨勢線就表示將轉弱；「成交量」則是判斷股票是否有大戶進駐，當成交量爆量就表示受到市場關注。


    # ## 跟著類股輪動，找出領頭羊股票


    「超簡單投資法」擁有「強棒旺旺來」、「長線聚寶盆 Plus」兩大選股軟體，透過工具篩選出數檔股票後，若是數目太多，可以用類股輪動的方式進一步挑選，建議每一次投資以
    3 ～ 5 檔股票為限，持股檔數不要太多比較容易掌握，大資族可等比例放大持股檔數，切記要做好資金分配與分散風險。


    類股輪動中的類股是指某種產業類型的股票，例如：水泥業、觀光業、生技業等，目前市面上的產業有數十種類型，可簡易區分為三大類，分別是傳產業、電子業與金融業；輪動則是指輪流發動，產業有景'
  merge: -1
  img_proc: true
- pgno: 188
  md: '氣循環，每一種產業都有機會輪到當領頭羊，引領大盤走勢。當輪到強勢的產業就稱之為領頭羊類股，這類股票比其它股票強勢，也容易受到市場大戶的關注與資金流入，因此又稱之為金流股。「長線聚寶盆
    Plus」中的領頭羊類股，可以從類股輪動掌握大戶資金流向的股票。


    另外，由於市場景氣有循環，因此在金融市場中不會永遠只是某一種產業一枝獨秀，或者永遠穩坐第一名，每個產業都有機會當領頭羊，找出當期金流股的方式，可以透過觀察市場供需情形判斷，當需求面大於供給面，大家搶著買相關產品，該產業類股自然成為盤面上的吸金股。


    例如隨著科技越來越發達，VR 虛擬實境、人工智慧機器人正流行，科技業類股就會變成熱門流行股；又或是寒暑假來臨時，就會帶動觀光業發展；國家正在發展重大建設時，鋼鐵、水泥等原物料需求就會大增，便會帶動相關產業發展，這時就會成為市場上的領頭羊。投資人觀察大數據投資領頭羊類股中具有潛力的股票，獲利機會自然會提高。


    不過要注意的是，即使透過類股輪動找出金流股，仍須觀察板塊與金流的概念，所謂的板塊指的是類股，金流則是該類股票中的領頭羊強勢股，當同一產業類型的股票有數檔股票一起上漲，就表示該產業受到市場關注行情較容易持久；反之，當同一產業類型的股票只有一檔股票大漲，有可能只有短暫的行情。'
  merge: -1
  img_proc: true
- pgno: 189
  md: '這是因為投資需要跟隨產業與金流，觀察族群才能掌握趨勢的變化。華爾街操盤手傑西 · 李佛摩曾向他的孩子說過：「不要只看 1 檔股票，要追蹤 2 檔，因為同族群的股票總是齊漲齊跌，若兩檔姊妹股像協力車一般，波動方向亦步亦趨，這個訊號就是最明確的證明。」說明追隨主流的重要性。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_189_0.png)


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_189_1.png)


    △ 「長線聚寶盆 Plus」軟體中有當期與前期領頭羊類股排序 。（資料來源／長線聚寶盆 Plus）


    # 理財小教室


    # 何謂類股輪動？


    類股指的是某特定產業，像是金融類股、電子類股、鋼鐵類股或營造建材等，輪動一詞可解釋為輪流變動，「類股輪動」簡單的說就是指產業有景氣循環，從大盤觀察目前是哪一個產業帶頭上漲，還有目前市場上的供需狀況，例如：當需求面大於供給面時，很多人搶著買相關產品，該類股自然就成為盤面上的主流類股，例如疫情發生時的醫療類股。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 檢視個股 K 線圖，好股票自然浮現


    當篩選出數個金流股之後，若是股票仍然太多，不知道該如何進一步挑選，可以從個股 K 線圖加以檢視，以超簡單投資法的四大法寶相互比較，包括觀看型態與趨勢線，從中比較出哪一檔股票的線圖較漂亮，從最理想到可接受的往下做出排序，並且計算進場風險，再選出適合投資的股票。


    # 訓練投資心性，坦然面對漲跌


    投資最重要的成敗關鍵在於建立良好的投資心態，擁有正確的觀念、懂得停損、嚴守紀律，才能在金融市場中走得長久。想在股市中獲利除了要有資金，還要有進出場原則，許多散戶在買進股票後，容易受到盤中價格跳動影響，當看到手中持股股價下殺，心情就開始忐忑不安，最初設定的交易策略和進出場原則都在剎那間忘記，一不小心就誤殺手中的金雞母，抱憾出場。若是容易受到市場消息干擾的投資人，強烈建議不要時時看盤也不要加入任何討論，保持冷靜的心。


    把握進出場原則，反覆操作，用平常心看待股票走勢，畢竟股票本來就會有漲跌，不論是股價反彈、買進之後不漲、一買就賠或是停損等都是正常現象，別被股價波動搞得心情七上八下，影響日常生活，才能從事長期交易，累積收益。'
  merge: -1
  img_proc: true
