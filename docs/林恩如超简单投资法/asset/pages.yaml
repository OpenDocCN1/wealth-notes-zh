  md: '# 堅定信念，紀律投資


    波段操作是利用股價的高低起伏，選擇相對低高點進出場，因此需要有堅定的投資原則與強烈的時間概念，必須嚴守進出場紀律，不可隨著短天期的股價走勢高低起伏隨意進出場，否則就失去了波段操作的意義。


    # 嚴守紀律才能控制風險


    波段操作不僅重視投資紀律，也相當要求確實控制風險，進場前就必須設定停損點。以超簡單投資法而言，除了自行計算可接受的最大虧損做為出場點之外，當股價跌破 20
    週均線時也要立即出場，才能做到長期投資、大賺小賠的目標。


