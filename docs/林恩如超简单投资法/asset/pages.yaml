  md: '衛、汽車組裝人員等，這些工作相對較形式化，透過電腦可以取代執行；而取代性相對較低的職業則有室內設計師、醫師、幼教人員、編輯人員等，擁有專業技能，較無法由機器人取代。


    由此可知，每個人都要尋找開源，所以創造被動收入格外重要，股神巴菲特曾說過：「人生就像滾雪球，你只要找到濕的雪和很長的坡道，雪球就會越滾越大。」這句話已經完全解釋趁早投資的重要性，其中「找到很長的坡道」指的是「時間」，說明投資要趁早，晚開始的話得更加倍努力、比他人花更多的力氣；「濕的雪」指的是「投資報酬率」，濕的雪球在滾動的過程中會吸附更多的白雪，讓雪球越滾越大，形容隨著時間的累積，投資的成果也會越豐盛。


    # 善用時間優勢，增加專業能力


    除了聰明分配資產，善用時間投資也是一件相當重要的事。對年輕族群來說，最大的資產優勢就是時間，而要讓這筆資產發揮最大效益，除了努力工作，最好的方式還有學習投資理財。


    以現在最熱門的兼職外送員為例，若是每天花 3 小時外送，每個月或許可以幫自己加薪 15,000 元，但試想這些是用努力和時間換取的錢，隨著時間流逝，終將無法持續；相對的，若是將這一筆可觀的時間拿來充實自己，學習用正確方式進行投資，得到的效益將不僅是
    15,000 元而已。隨著年紀增長，時間和體力將不再是最大的本錢，在有限的时间里，必須思考做更有價值的事，才能創造更多收益。'
