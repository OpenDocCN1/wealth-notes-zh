- pgno: 87
  md: '灣股票交易採「T+2日」制，是指買賣股票成功後的第2個營業日的上午10點前，投資人要將戶頭內金額補足，否則可能會留下信用污點。例如，6月5日進行交易，「T+2日」就是指6月7日上午10點前要将金額存入交割戶。


    > ### 理財小教室


    選擇適合的交易平台


    交易平台關係到選股與下單方式，一般來說有三種，第一種是手機交易平台，適合喜歡隨時隨地看股，不常使用電腦的投資者；第二是電腦網頁交易平台，適合喜歡大螢幕、喜歡一個一個慢慢觀察的投資者；第三種是軟體交易平台，可以搭配多個螢幕和視窗做個股觀察與選擇，投資者可選擇自己習慣的方式決定交易下單平台。


    # ### 股票的三大面向


    研究公司價信的「基本面」


    投資人對於選股通常會從研究公司各種經營數據開始，像包括研究市場動態、產業動向與公司經營分析，找出股票的真實價值進而投資。其中，市場動態通常會應用到總體經濟學，包括國內外基本經濟指標，例如國內生產總值成長率、通貨膨脹率、貨幣匯率、各國生產力、國際能源價格等，分析目前市場概況。'
