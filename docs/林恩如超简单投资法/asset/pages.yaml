  md: 'LESSON 20


    # 超簡單投資法，全球金融市場適用


    「小真進入股市多年，經歷過數年的台股交易後，決定開始進行美股交易。她深知投資美股等於投資全世界，在美股市場不僅可以買賣大公司的股票，更能感受到美股市場的熱鬧，而她投資美股時用的仍是『超簡單投資法』，她發覺『超簡單投資法』適用於任何有量價的金融商品，只要有K線圖就可以做判斷，不必再多花心思研究其他投資方法。」


    # ❍ 超簡單投資法行遍天下


    「超簡單投資法」適用於全球金融商品，透過大數據的技術分析，只要有K線圖就可以進行判斷，包括美股、陸股、黃金等商品，投資人只要將超簡單投資法融會貫通，並利用四大法寶操作，不管身處何地都可以投資。


