  md: '路上觀看我的文章和影片許久，後來還是希望能夠面對面，學習四大法寶的精髓，包括實際觀看型態、趨勢線、練習畫圖等，因此專程搭飛機回台，她說就算花機票錢也非常值得。


    這位瑞士學員提到，在還沒認識超簡單投資法之前，原本都是賠錢出場居多，後來學習超簡單投資法開始逐步獲利，並且擁有不錯的報酬率，繳出從 20% 到 70% 的成績單，利用超簡單投資法不僅提升自己的獲利，同時也更清楚自己適合選擇的股票。


    # ### 案例分享 3：新加坡學員投資港股


