  md: '# Q11 如何避開盤整型態？


    A：根據歷史回測，股市有七成的時間都在盤整，當個股處於盤整階段時，波動較小並無明顯的走勢，此時，投資人以趨勢線工具來判斷股票的表現，同時避開盤整區，但並無法完全避開，股票盤整時可以選擇不進場，守住資金等機會來臨。


    # Q12 無法忍受等待期該如何調適？


    A：別忘了任何事物都要經過時間的考驗，交易需要時間和成本，買進股票後請耐心等待時間發酵，「財不入急門」千萬別有急於獲利的念頭，只要掌握買進、賣出原則，嚴守紀律操作，市場自然會回報豐厚利潤。


    # Q13 股票被套牢該怎麼辦？


    A：當持有的股票因為不懂得停損出場，因持有時間過長被套牢時，請觀察股價是否跌破 20 週均線，只要符合條件就應該毫不留戀出場，以免擴大資金損失。


    # Q14 如何自己繪製K 線圖？


