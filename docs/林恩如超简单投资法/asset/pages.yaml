  md: '# LESSON 08


    # 第一次投資股票

    最容易上手


    > 「因為對投資有興趣，誠誠在了解常見的金融商品之後，決定先從股票開始，原因很簡單，股票邏輯清楚，選擇又有方法，加上資金門檻不高，他相信只要靠著認真學習，計算風險，就能靠股票賺取價差。』


    # 投資新手的股市入門


    對於第一次進入金融市場想投資的新手來說，我建議從股票開始接觸，因為股票以現股買進，沒有槓桿的風險，損失可以掌控，邏輯也相對簡單，而且門檻不高，大約準備 50
    萬元的閒錢就可以進場。記得這筆閒錢需要扣除日常開銷或緊急預備金，提醒大家，千萬不可以拿出所有家當來投資，辛苦工作得來的血汗錢有可能因為不當操作而血本無歸。所謂「留得青山在，不怕沒柴燒」，至少要保留三成現金，當投資失利時還有機會重新檢視交易模式，找出問題點，重新開始。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '此外，新手投資時，不要一次就扼注大筆資金，沒做好資金控管非常危險。記得，交易是一輩子的事，別把它當成一下子，先從小額投資開始，慢慢練習，等上手後，再增加持股部位，並持續做功課，養成良好的獲利模式。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_84_0.png)


    交易是一輩子的事，別把它當成一下子。


    # 第一次交易看過來：股票操作流程


    股票交易分為5個步驟，包括開戶、選股、下單、成交、匯款。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_84_1.png)


    # 第 1 步 開戶


    許多投資新手對於到證券公司開戶總是不得其門而入，其實就像'
  merge: -1
  img_proc: true
- pgno: 85
  md: '到銀行開戶一樣，只是換成證券公司而已，而且現在開戶非常簡便。目前開戶方式可分為臨櫃開戶和線上開戶，臨櫃開戶可選擇自己方便的證券商辦理，例如公司或住家附近、已有證券公司的銀行戶頭等；線上開戶則是進入銀行證券
    APP 或開戶網頁填寫開戶資料，手指動一動就能完成開戶。開戶時會一併設定證券集保戶與股票交割帳戶，證券集保戶是登記買賣股票交易紀錄，交割帳戶則是做為後續款項匯入、匯出使用的專用戶。


    開戶時需要攜帶印章、雙證件，並填寫相關基本資料以及徵信資料表，做為證券商調查財務狀況的根據。辦理開戶的同時，券商也會要求先存入最低金額，一般是 1,000
    元。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_85_0.png)'
  merge: -1
  img_proc: true
- pgno: 86
  md: '# 第2步 選股


    選股是整個投資操作流程中相當重要的一環，記得「慢慢進、快快出」的口訣，也就是慢慢選股再進場，一旦進場後超出可承受風險就出場。選股方式主要包括基本面、技術面、籌碼面等方法，每一種都有人擁戴，這部分是依投資人的選擇為主，沒有哪一種選股方法最好，只有適不適合自己。


    # 第3步 下單


    選好喜歡的股票與想要交易的張數就可以進行下單，下單时需要輸入買進或賣出的張數與價格，再點選確認交易，等待交易所撮合，交易是否成交必須確認，不是有下單就一定會成交。


    # 第4步 成交


    以往台股的撮合機制為「集合競價」，每 5 秒撮合一次，每 5 秒才能看到新價格，自 2020 年 3 月 23 日已正式實施全球大部分股市使用的「逐筆交易」，與國際接軌。「逐筆交易」簡單來說，假設當有一筆新的「委買單」50
    張掛入，價格高於、等於目前最低的委賣價，此時系統會從「最低委賣價開始向上成交」，直到滿足這一筆 50 張委買單為止。


    # 第5步 匯款


    成交之後可以登入券商 APP 查詢成交股票、數量及交割金額，投資人只需在 T+2 日將款項補足至交割帳戶，如此就完成買賣股票。'
  merge: -1
