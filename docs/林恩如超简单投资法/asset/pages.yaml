  md: '天黑夜的轉換，投資人要跟著趨勢走，伺機而動才能站上浪頭。波段操作就是利用股價波動起伏間賺取價差，在股價相對低點時買入，在價位相對高時賣出，只要方向正確，不難獲利。另外，波段操作方式較靈活，在市場氣氛不佳時，可以幫助投資人有效避免市場風險，更能保存資金實力，等待下次機會來臨時再擇機進場。


    基本上多數個股都有一定的波段，投資人只需要在波段中找出對的時機點進出即可，波段操作主要有 4 個技巧，包括選股、買入、賣出與持股，每一階段都是學問，也是投資人在學習投資時必須突破的重要關卡。


    其中，選股請挑選已經結束下跌期、進入一段時間的打底，打底完成之後準備上升的個股，篩選出數個個股後再逐一比較單一個股，包括股本大小、產業脈動是否具有前瞻性等，衡量自身資金以及最大損失承受度，評估多方條件皆符合後再進場。很多人在買入個股後傻傻抱著不動，不知道如何出場，其實只要未觸及停損點位就長抱，直到波段結束，跌破
    20 週均線再獲利或停損出場。


    # 「週線圖」一眼看出個股走勢


    波段交易仰賴的是股票長期走勢，因此學會看 K 線圖相形重要，但是 K 線圖依據時間長短又可分為日線圖、週線圖與月線圖。「日線'
  merge: -1
