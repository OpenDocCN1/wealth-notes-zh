  md: '# 自我評估 4 評估風險承受度


    就交易而言，風險指投資發生虧損的可能情形，權衡交易的潛在風險與潛在回報是交易策略的重點，而不同投資商品的風險承受度都不一樣，其中「ETF」屬於指數型股票基金，投資不可以將雞蛋放在同一個籃子，ETF
    指數型股票基金就具有這樣的特性，將績優股結合成各種組合，達到分散風險的目的，讓投資人以低風險參與金融投資。


    「股票」則是選擇單一公司投資，透過個股走勢、基本面、技術面與籌碼面等進行分析再進場。由於是投資單一公司，風險相對較高，若不幸選錯標的又不願意停損的話，股價大打折或變成壁紙都是可能發生的事情。


    另外，「期貨」本身則是屬於高槓桿操作的金融商品，採取保證金交易，只要拿出一小筆資金就能運用槓桿原理操作，風險較股票高出些許。以現股買賣為例，最大損失是根據當時買進股價來計算，若萬一不幸下市，賠光的金額就是原來投資的錢；期貨則不同，萬一沒有即時停損，損失的不只是當初的保證金而已，還可能產生超額損失，大於原本投入的金額好幾倍。不過，期貨的槓桿大小是可改變的，換句話說「期貨的風險是可控的」。


    完成以上 4 項評估之後，接下來就是初步認識各金融商品的特色及投資門檻，再從中選擇適合自己的投資工具。'
  merge: -1
  img_proc: true
