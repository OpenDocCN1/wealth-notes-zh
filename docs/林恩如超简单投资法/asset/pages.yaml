  md: '# 關於股票發行名詞


    +   ▸ 股票


    股票一種有價證券，是股份公司為了籌措資金而發行給股東的持股憑證，公司會根據出資人投資的比例給予相對等比例的憑證，也就是股票。


    +   ▸ 股票面額


    股票面額指的是印在股票上面的金額，過去規定一股 10 元，但目前已經取消此一規定，各公司可以自行決定股票面額，例如 1 元、5 元、10 元、20 元等。


    +   ▸ 股價


    一般我們聽到的股價是市價，是經由市場交易、透過公開販售而決定出的價格，就稱為股價。


    # 關於證券交易所


    +   ▸ 股市


    股市全名為股票市場，是股票進行發行、買賣、交易的地方，依據交易股票類別可分為集中市場與店頭市場。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '+   ▸ 集中市場


    集中市場指的是上市股票在證券交易所，以集中公開競價方式進行交易，交易商品皆為標準化，目前我國集中市場的交易價格是由電腦自動撮合決定，但部分國外交易所則是由人工撮合。


    +   ▸ 店頭市場


    店頭市場又稱為櫃檯買賣市場，指的是上櫃股票在證券商營業櫃檯，以議價方式進行交易的行爲。一般來說大型公司會在集中市場掛牌，小型公司會在店頭市場掛牌，集中市場的大公司流通性比較好，店頭市場的小公司流通性稍差。


    +   ▸ 上市上櫃


    上市上櫃公司的差異在於審核制度不同，上市公司無論在設定年限、實收資本額、獲利能力、股權分散等都較上櫃公司嚴格。


    +   ▸ 開盤


    開盤指的是證券交易所每天營業後的第一筆證券買賣。


    +   ▸ 收盤


    收盤指的是證券交易所每天營業後的最後一笔證券買賣。


    +   ▸ 漲停板、跌停板


    漲停、跌停代表股票當日最大的漲跌幅，台灣證券交易所從 104 年 6'
  merge: -1
  img_proc: true
- pgno: 222
  md: '月 1 日起將漲跌幅度從 7% 放寬為 10%，手中持股的股價一天最多只能有 10% 的漲幅，或一天最多只能有 10% 的跌幅。


    # ▸ 成交量


    成交量指的是某一段時間內具體的交易股票數量，可以反映出資金在金融市場進出的情形。


    # ▸ 交割


    交割指的是「一手交錢一手交貨」，在金融市場中，股票交割帳戶就是將股票款項匯入與匯出的帳戶。


    # ▸ 交易日


    台灣股票交易採 T+2 日交割，當投資者交易成功後，應於 T+2 個交易日上午 10 點前完成證券交割，遇到假日則順延。


    # ▸ 抽籤


    「股票抽籤」正式名稱為「股票申購」，當一家企業準備上市時會以較低的價格賣出，抽籤一次手續費是 20 元，當申購者太多，釋出股票太少，就會用抽籤決定。


    # ▸ 除權息


    除權息是指配股、配息，一般會集中在每年的 6 月至 9 月之間。'
