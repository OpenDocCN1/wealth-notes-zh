  md: '短期來看，與前一年度相比差距甚少，並不會有太多感覺，但是，通貨膨脹其實是一個長期累積的過程。我們將時間拉長來看，經過複利計算就可以發現 20 年後價值
    100 元的商品幾乎漲了一倍，來到 180.6 元，尤其對於房屋、土地等大型資產的價值影響很大，導致現代人經常有居住大不易的感受。


    假使我們的薪資也跟著成長，加薪幅度若大於 3%，那麼當然不會認為錢變少了。不過，從目前勞工普遍起薪為 22k ~ 25k 的情況，加上每一年的加薪幅度不一定，薪水漲幅實在有限。然而，人們的平均壽命屢創新高，使得我們必須延長工作年限，以及找到投資報酬率大於
    3% 的被動收入，才能累積足夠的財富，真正對抗通貨。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_16_0.png)


    歷史上曾發生過幾次因戰亂而導致通貨膨脹的案例，最著名的是第一次世界大戰時，德國戰敗為了償還債務，開始大量印製鈔票購買外匯，以至於國內貨幣價值越來越低，當時
    2,000 億馬克只能買到一條麵包。'
