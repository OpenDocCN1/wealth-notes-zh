- pgno: 165
  md: '# 「不」看，看了也無濟於事


    股市新手剛進入金融市場時難免緊張，常會一直盯著盤勢，只要手中持股稍微一有波動，心情就會跟著起伏，情緒跟著盤勢波動七上八下。因為過於在乎，常常睡不著、吃不好，整顆心全繫在股票上，深怕錯過所有消息，所以四處加入相關投資社群，以為東學西學就能增加投資功力，殊不知如此過量的雜訊，讓投資人無所依歸也無法客觀判斷，做出正確的投資決定。


    其實，投資應該是一件優雅的事情，不影響日常生活節奏，只要信守紀律，就能以平常心從容面對。投資人必須在進場之前就做好全盤考量，確定進場後，設好停損點，結果交由市場決定。投資是生活的一部分，請平常心看待，做該做的事，不需要時時刻刻盯著盤面，否則看久容易出事，不是還沒漲就賣出，要不然就是正要注意漲就已全數賣光，最後只能向隅。


    # 「不」說，學著跟自己對話


    每個投資人對於買股這件事有著不同的心情，像是想與他人分享獲利的喜悅，賠錢又急於聽別人意見，這些都是投資百態，人性始終無法避免情緒的發生，只能訓練自己正確應對。所以，對於買股的七情六慾請保留給自己，無須與他人分享，對於股票未來走勢，沒有人'
