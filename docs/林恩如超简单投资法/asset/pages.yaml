  md: '# LESSON 13


    # 輕鬆學會


    # 台灣 50 ETF 投資法


    「投資新手小紅在認識完常見的投資方式後，決定買一支股票進場投資，但她手頭現金不多，加上對各檔股票認識不深，最後她決定選擇台灣 50 股票指數型基金 (0050)
    ，因為 0050 追蹤的是大盤指數，不僅不必花太多時間看盤，又能一次投資一籃子的優質股，達到分散風險的目的。」


    # 誰適合投資台灣 50 ETF？


    ETF（Exchange Traded Funds）稱之為指數型股票基金，ETF 不僅將指數證券化，投資時僅需關注大盤走勢，不用花太多時間研究個股，而且投資方式與股票完全相同，無須另外開帳戶就能投資，加上可以分散風險的特性，相當受到投資人的喜愛。


    其中，目前台灣最熱門的台灣 50 ETF（股票代號：0050），更是'
  merge: -1
  img_proc: true
- pgno: 147
  md: '受到新手們的喜愛，台灣前 50 大公司是 0050 的成分股，一次買進全台最大的 50 檔股票，每 3 個月更新一次名單。因此不論什麼時候投資，永遠都是投資台灣前
    50 大公司，可以將 0050 想像成一個藍籃，買了一張 0050 就等於是投資一籃子的優質大型股。


    雖然 0050 只有 50 檔成分股，但這 50 檔股票的市值約占台灣上市公司總和的 6 ～ 7 成，因此 0050 的走勢、漲跌幅與大盤有高度相關性，可以透過觀察大盤，進一步決定
    0050 的進出場點。


    另外，由於 0050 屬於穩定性高、低風險、波動較小的商品，因此適合無法承受風險的族群，以 0050 年化報酬率約 6% ～ 10% 來計算，長期獲利比定存高出許多，而且投資時也不用每天盯盤，也能以最少的時間發揮最大的金錢管理效率，透過時間的發酵才有穩定的獲利。


    # 投資台灣 50 ETF 的 3 種方式


    台灣 50 ETF 的投資方式大致上可分為 3 種，分別是分散風險的定期定額投資、在股票崩盤時逢低買進的大跌大買，以及利用超簡單投資法的波段操作。'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# 方式 1  定期定額，懶人投資法


    定期定額又稱為「懶人投資法」，是指每隔一段時間投入固定的金額做投資，定期定額不必在乎進場時機，也不用在意市場價格波動，只要每隔一段時間，通常是以一個月，若金額太小可採
    2 個月或一季執行一次，固定投入成本即可。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_148_0.png)


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_148_1.png)


    # 平均分散成本


    由於定期定額是每隔一段時間就投入一筆資金，因此可能買在相對低點，也可能買在相對高點，但可以平均分散成本。由下圖的元大台灣 50（0050）歷年走勢圖可以發現，即使股價走勢有高低起伏，但透過定期定額投資，就可以避免單次就買在相對高點的風險，以及買在相對低點的風險。'
  merge: -1
  img_proc: true
