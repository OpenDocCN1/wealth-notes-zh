  md: '道瓊工業指數（Dow Jones） | 工業為主

    標準普爾 500 指數（S&P500） | 工業、金融、公共事業為主

    那斯達克指數（NASDAQ） | 高科技產業為主


    一般來說，熟悉台股操作對於學習美股就容易上手，美股交易的方式包括「自行交易」或是「複委託」，兩者主要差異在於有無專人可協助，以及交易實成本。想投資美股除了專門開海外證券帳戶之外，透過國內的股票券商「複委託」也是一種投資方式。


    複委託正式名稱是「受託買賣外國有價證券業務」。意思是透過國內券商協助交易購買股票或是 ETF 指數型基金，不過交易手續費較高，從交易金額 0.5% 至 1%
    以上都有，依各家券商規定而有所不同，另外也要計算匯費等投資成本。雖然複委託交易成本比較高，但遇到問題有專人服務則可省去自己處理的麻煩，相對便利。


    另外，自行交易者則可於海外券商平台自行下單，目前很多海外交易平台免手續費，替投資人省下交易成本。知名海外券商交易平臺包括 IB 盈透證券（InteractiveBrokers）、第一證券（FIRSTRADE）、德美利證券（TD
    Ameritrade）。選擇適合自己的券商，按照開戶流程辦理就能順利交易。'
  merge: -1
  img_proc: true
