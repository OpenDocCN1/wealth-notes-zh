  md: '# LESSON 02

    理財規劃

    就是生涯規劃


    「今年 34 歲，在外商公司擔任行銷經理的 C 先生，月薪 6 萬元，年薪近百萬，相較於其他同年齡的人，待遇算是不錯。然而，因為對理財沒有概念，加上重視行頭，看到什麼就買什麼，也懶得儲蓄、投資，工作
    10 年，存款竟然不到 50 萬元，面對銀行帳戶的數字也只能搖頭興嘆……。」


    # 理財規劃是人生當務之急


    每個人都必須重視理財規劃的重要性，它與生涯規劃環環相扣，人生是一條長河，每一個階段都需要理財規劃才能幫助我們完成生活所需及達成夢想。談到賺錢時，大家都希望能賺越多越好，那麼到底要賺多少錢呢？相信不是每個人都有確切的答案。


    若是以退休金來說，依主計處所提出的數據保守估計，建議至少'
  merge: -1
  img_proc: true
- pgno: 21
  md: '準備 830 萬元。目前我國國民平均退休年齡約 60 ～ 65 歲，平均壽命為 80 歲，至少需要準備 20 年的資金才夠維持生活開銷。然而，退休後的花費只會更多不會變少，主要的花費包括生活費、娛樂費、醫藥費，分別計算如下：


