  md: '可以啟動自行導航模式，不至於走偏，再也不會沒有主見、無所適從，更不用到處蒐尋無效資訊。只要掌握超簡單投資法的四大法寶—均線、趨勢線、成交量、型態，圖中自有黃金屋，並且運用最真實的買賣大數據，打造專屬的交易系統，做為進出場的判斷依據，強化投資心智用健全的投資觀念，以及穩定的交易策略，創造優雅的投資人生。


