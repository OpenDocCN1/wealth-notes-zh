- pgno: 80
  md: '# 海外期貨的四大優勢


    「期貨」可分為國內期貨與海外期貨，交易商品包括各國期貨指數、金屬、外匯、原物料、能源等商品眾多，因此交易機會很多，成交速度也快速。


    海外期貨與國內期貨不同之處在於可以 24 小時交易，比較不會出現跳空風險。此外，海外期貨具有交易量⼤、商品選擇多、有停損單機制等特性。


    # 海外期貨優勢 1：24 小時交易時間長


    海外期貨交易時間長，幾乎 24 小時都能進行交易，部分交易所更只有 15～60 分鐘的休息時間，連續性的交易時間可以避免跳空狀況。


    # 海外期貨優勢 2：交易量⼤、流動性佳


    海外期貨交易量相當⼤，流通性相對充足，由於樣本數⼤可以分析趨勢，透過技術分析評估適合的進出場點。


    # 海外期貨優勢 3：停損單機制，不必整天盯盤


    大多數的海外交易所都設有「停損單機制」，只要當天設定好停損單後，在有效停損單的週期內都有效。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# ### 商品種類多元、獲利驚人


    海外期貨商品種類多元，部分商品保證金低，波動幅度大，獲利速度驚人。雖然有機會讓價差翻倍，但高風險高報酬，一體兩面，對於不熟悉趨勢的人做錯方向會造成鉅額損失。此外，目前市場也有推出小規格商品，例如A50指數、微型歐元、小日經等商品，切記不管保證金多小，都要注意資金控管，投資時仍需要準備充足的保證金。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_81_0.png)


    # 期貨VS現貨


    期貨最大的特色就是它是一個未來契約交易的概念，也就是說可以事前制定價格，在未來用當初訂好的價格購買，以下比較期貨與現貨交易的差異：


    假設某甲以投資現貨的方式，一開始花10萬元，一年後賺到6萬元，他的獲利就是6萬／10萬＝60%


    但若是以投資期貨的方式，一開始花2萬元買到「未來買50公斤小麥的權利」，同樣賺到6萬元，獲利卻是6萬／2萬＝300%'
  merge: -1
  img_proc: true
