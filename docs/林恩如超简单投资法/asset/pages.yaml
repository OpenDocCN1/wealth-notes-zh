  md: '# 投資地雷 4 豪賭一把就妄想翻身


    投資並不是像中樂透，中了一次頭彩就賺進高額彩金，一夕致富翻轉人生。投資靠的是本身的紀律、穩定的策略、固定模式的交易，透過長時間累積大賺小賠的成果，但多數投資人看多了各種傳說式的商業廣告，以為隨隨便便可以快速致富達成財務自由，但真實的金融市場，不可能買一次股票就翻身。


    > 離盤面越近交易越容易失策。'
