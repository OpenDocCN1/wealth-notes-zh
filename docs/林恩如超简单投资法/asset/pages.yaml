  md: '理財小工具 「強棒旺旺來」 選股都在這裡


    只要把握正確的投資原則，無論長線、短線操作都能累積獲利，若是想進一步了解市場短期動態，可以選擇「強棒旺旺來」選股軟體，做為觀察大戶籌碼面及市場走勢的利器。


    「強棒旺旺來」選股軟體能在當天快速篩選出盤中的強勢股和弱勢股，它將個股分為多方條件與空方條件，依據目前大盤燈號，大盤紅燈選多方標的，綠燈選空方標的，快速篩選出多空個股。投資人可以從每一檔股票的日線、週線檢視比對，擬定相關波段交易策略。


    雖然「強棒旺旺來」主要是為即時盤中判斷所做的設計，但中長期投資人也可以透過該軟體找出大戶近期布局的個股，並確認從「長線聚寶盆 Plus」中選出來的標的，是否同步出現在「強棒旺旺來」，若是個股在這兩個工具都有出現，就代表該檔股票相當具備飆股潛力。


