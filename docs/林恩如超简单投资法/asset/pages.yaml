  md: '# 「期貨」是未來的買賣契約


    期貨是一種跨越時間的未來買賣契約，起源於日本江戶幕府時代，當時米價受到軍事影響非常大，米商為了避免稻米收成後價格大幅波動，因此預先向農夫訂立契約，並於收成時再以當時預訂的價格一手交錢一手交貨。


    「期貨」是當時的一種衍生性商品，演變到現在不只現貨商品可用來當作期貨，各種金融指數也可以做為期貨投資，按照屬性可分為兩大類，包括商品期貨與金融期貨：


    |  | 商品屬性 | 舉例 |

    | :--- | :--- | :--- |

    | **商品期貨** | 農產品類 | 黃豆、玉米、小麥、棉花等 |

    |  | 能源類 | 石油、燃料油等 |

    |  | 金屬類 | 金、銀、銅等 |

    |  | 其它 |  |

    | **金融期貨** | 指數類 | 台股期貨、電子期貨、美國道瓊期貨、日本東證期貨 |

    |  | 外匯類 | 小型美元兌人民幣期貨、美元兌日圓期貨等 |

    |  | 股價指數選擇權類 | 台指選擇權、電子選擇權等 |

    |  | 其它 |  |


    資料整理／林恩如'
  merge: -1
  img_proc: true
- pgno: 76
  md: '期貨的特點就是採取保證金交易，因為期貨是一種未來契約的概念，契約到期時必須用當時約定的價格進行買賣。通常雙方會有一人賺錢、一人賠錢，為了避免雙方違約，所以設定保證金制度，保證金金額大約是契約價值的
    3%～10%，當期貨交易日到期時就必須進行結算，若保證金不夠賠虧損時，將追加保證金，稱為追繳保證金。


    > ## 理財小教室


    ### 期貨保證金


    期貨有保證金額度，保證金會依據市場現況調整，以 2020 年 3 月期交所公告為例，小台期貨所需保證金為每口 3.7 萬元，大台期貨所需保證金則是每口 14.8
    萬元，因此必須準備最低資金就是以口數乘上每口保證金價格而定。為了風險起見，不可以只準備剛好的資金進場，通常會以 5 倍做為進場資金，「以五做一」的方式操作，例如：一口小台期貨為
    3.7 萬元，買一口小台就要準備 18.5 萬元的資本再進場。


    # ## 了解期貨三大特性


    「趨吉避凶」是期貨的特性之一，當股市不佳時，可以將資金轉入期貨市場，只要看準趨勢方向就能獲利，彌補股市損失的部分，也能利用同一商品在不同市場的價差進行套利，幫助投資人「趨避風險」。此外，因為期貨市場有各種類型的投資人在交易未來契約，因此又具有價格發現的特性。'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 期貨特性 1 規避風險


    期貨的本質就是避險，為了可以在未來能以合理的價值交易，因此事先訂立合約，降低真正交易時的虧損幅度。


    舉例說明，小麥農夫為了避免將來小麥價格下跌，因此跟麵粉製造商協議，先以合理市場價格做買賣，雙方並預先各付一筆保證金，等到將來小麥收成時再付款與交貨。


    # 期貨特性 2 套利以賺取價差


    套利是指同一種商品在不同市場中有不同價格，套利者可從價格低的市場中買進，再到價格高的市場中賣出。舉例來說，A 國家的小麥每公斤 100 元，B 國家的小麥每公斤
    110 元，投資者的從 A 國家進口小麥到 B 國家賣出，賺取中間價差。


    # 期貨特性 3 價格發現


    由於期貨市場具有避險、高槓桿、高流通性，因此吸引各種投資人參與，包括想要趨避風險的買方與賣方、套利者等，各方會透過公開競價方式快速揭露成交價格，達到預見未來現貨市場的商品價格。'
  merge: -1
  img_proc: true
- pgno: 78
  md: '# 以小搏大，認識期貨三大優勢


    期貨市場沒有多空的限制，交易人可以在契約到期前自由買賣該期貨，此外，期貨也可以利用高槓桿原理操作以小博大，而交易成本也是優勢之一。


    # **期貨優勢 1：** 多、空皆可交易


    期貨交易不同於股票交易，沒有放空條件的限制，投資人可以任意做多或放空，只要順勢布局，獲利機會大。


    # **期貨優勢 2：** 以小博大，財務槓桿效果好


    期貨市場採用保證金交易，因此可以發揮以小博大的精神，槓桿倍數根據保證金與交易金額比例，可獲利高達數十倍甚至數百倍，發揮財務槓桿效果。


    舉例來說，假設目前大台期貨指數是 10,000 點，1 點 200 元，一口大台指期貨契約價值為 200 萬元，假設保證金價格為 10 萬元，就能以 10
    萬元來操作 200 萬元，具有 20 倍的財務槓桿，以小資金搏取大利潤不是夢想。


    不過，具有風險意識的投资人不會只存入 10 萬元保證金，因為一旦保證金低於一定比例或虧損時，就會立即被追繳，建議至少存入保證金 5 倍以上的資金，平均大約
    50 萬元～ 80 萬元為宜。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '大台期貨契約價值：10,000 點 × 200 元 = 2,000,000 元

    假設保證金：100,000 元

    槓桿倍數：2,000,000 ÷ 100,000 = 20（倍）


    # 期貨交易成本低


    期貨的交易成本相較台股低，只有手續費與期貨交易稅，尤其現在多數的投資人都是利用網路自行下單，因此手續費相對更透明。以大台指期貨為例，期交稅為10萬分之2，手續費約在50～100元之間。


    **理財小教室**


    **期貨交易單位**


    在股票市場的交易單位是「張」，在期貨市場交易單位則是「口」。'
