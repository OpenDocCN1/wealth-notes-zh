  md: '# 停牌、停券


    停牌、停券指的是原本可以融資、融券的股票暫時不能再以融資、融券方式賣出，通常是因為個股有超過融券限額、股票變為全額交易股、下市、有鉅額違約交割情勢、股價波動激烈、股權過度集中、成交量過度異常、即將除權息等狀況。


    # 融券強制回補


    融券強制回補是指以融券放空投資人，必須將股票買回並還給證券商，常發生在股東會與除權息的時侯，原因是企業要確認誰才是真正的股東，才能夠辦理後續股東會和發放配股配息的作業。


    # 和交易有關的名詞解釋


    # 做多


    做多指的是投資者判斷股票會有一波上漲趨勢，因此以現價買入等待持股上漲，並在上漲後賣出，賺取中間的差價，交易的順序為「先買後賣」。


    # 做空


    做空是投資者判斷股票會有一波下跌趨勢，先向券商借股票賣出，等股票跌了再買進還回，賺取中間差價，交易的順序為「先賣後買」。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 停損


    停損意即為停止虧損，是用來控制交易風險的方式，進場時先設定停損點，當股價到達停損點時就執行賣出動作。


    # 停利


    停利意即為停止獲利，是用來保障獲利的方式，有些投資人在進場時會設定停利點，當股價到達停利點時就執行賣出動作，以鎖住獲利。


    # 當沖


    當沖全名為當日沖銷，指的是在同一天內，買賣相同數量的股票，達成結清交割的行為，不需要負擔個股本金，只需支付交易手續費，以及當賠錢時補齊款項即可，適合極短線投資人。


    # 融資


    融資指的是當手上現金不足時，可以跟券商借錢做交易，雙方各付一部分的錢來買股票。一般來說，上市櫃股票的融資成數為60%，但實際仍需以交易所公告為準。


    # 融劵


    融券指的是向券商借股票來賣，當手上沒有股票，又看壞市場時就可向券商借股票，原則上需付出90%的保證金，但有些特殊情況保證金會提高，實際仍需以交易所公告為準。'
  merge: -1
  img_proc: true
- pgno: 225
  md: '# 追繳


    追繳指的是券商發出「融資追繳令」要求投資人補錢。目前融資維持率為130%，當股價跌幅過多，融資維持率低於130%時，券商就會發出追繳令，要求投資人在兩日內補繳至130%。


    # 斷頭


    斷頭指的是當投資人沒有在兩日內補齊款項，券商就會在市場上賣出該股票，並且收回借款與相關手續費，再將餘款還給投資人。


    # 平盤下禁空


    平盤下禁空是指平盤下禁止放空，目的是用來抑制股票跌勢，以2020年3月19日為例，當日金管會宣布即日起有條件「禁止平盤以下放空」，只要當天收盤價跌幅達3.5%，隔天禁止平盤以下放空，可避免個股價格因為放空加速跌勢。


    # 借券


    借券指的是將自己手中股票借給他人，賺取利息，讓他人做履約、賣出利用。


    # 警示股


    交易所判定當股價連續六個交易日大漲或大跌，或是成交量過大，會被列為警示股，提醒投資人注意風險。'
