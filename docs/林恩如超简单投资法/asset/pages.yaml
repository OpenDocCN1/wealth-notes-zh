  md: '# Q18 遇到漲幅已拉大，如何判斷是否追高？


    A：遇到股價漲幅已拉出一段距離，請先評估目前股價的最大停損金額是否能夠接受，若經過三思後可以接受再進場，若不能接受請不要勉強追高，免得進場之後因過度恐慌而失策，股票非常多檔，請找符合自己期望的標的物才是正確的選擇。


    # Q19 停損之後，隔日就回漲應該怎麼辦？


    A：停損是在進場之前就設定好的遊戲規則，投資人往往會在停損後遇到股價回漲而心有不甘，其實保持穩定的交易策略反覆操作，才能強化投資心性，嚴守停損點是保護資金的最高原則，一旦到達停損點就應立即出場，即使出場隔日就回漲也不要灰心。


    因為投資是長期的事，並不是只交易一次，只要保持心性穩定，遵守進出場的紀律，長期來看可以達到「大賺小賠」的目標，真正累積財富。


    # Q20 跟著大戶一起買股票好嗎？還是相信直覺買股？


    A：進入金融市場，每一個投資人都應該有一套適合自己的交易策略，獨立判斷及應用，以超簡單投資法而言，就是以均線為基礎，搭配四大法寶進行股票操作，其中「成交量」就是做為判斷有大戶進駐的'
