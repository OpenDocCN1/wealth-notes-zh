- pgno: 123
  md: '因此，痛定思痛，下定決心捲土重來，這一次我付出更多時間及心力，研究所有的技術分析指標，即使不眠不休，心中總有個信念，就是要找出「破關秘笈」。當時每天進書店報到，翻閱國內外經典財經書籍，親自手繪
    K 線圖、熟記大盤 K 線圖的走勢，並列出之前每一次的交易成績，一筆一筆的檢討可能的問題，經過不斷的修正，調整策略及心態，整裝再出發。後來，靠「超簡單投資法」的策略，在金融海嘯時，放空跌破均線的台股並倍數賺回。於是，確定技術分析是可執行且獲利，我慢慢整理出自己的交易系統，以及領悟四大法寶（均線、趨勢線、成交量、型態）的重要性。


    投資時只要根據「一條均線」即可判斷多空，也就是 20 週均線，這一條均線代表過去一段時間，所有投資者的平均交易成本，當站上 20 週均線就代表持有者是獲利狀態，反之，跌破
    20 週均線則代表大部分的持有者為虧損狀態。


    # ## 投資心法 4：想敗部復活，請留保命錢


    投資首重風險，前述內文已說明風險的重要性，市場永遠有風險存在，投資人必須懂得與風險共存。風險無法預測，我們能做的是盡量將風險控制在可接受的範圍內。所以，投資不能全部梭哈，聰明的人手上總是留有三成現金，以備不時之需。'
  merge: -1
  img_proc: true
- pgno: 124
  md: '在經歷股市多次的大起大落，我總是嚴格執行停損以及部分保留本金，絕對不會做出超出能力範圍的決定。而且，在每一次慘賠的同時會更加冷靜看待自己和大盤對話，包括
    2000 年的網路泡沫、2006 年波段長抱股票套牢、2008 年金融海嘯放空股票，獲利滿滿，爾後在 2009 年又因台股反轉沒做好資金控管，再次白走一遭。每一次的交易停損，我都平常心面對，理性估算停損之後的剩餘資金，因為那代表身邊還有多少銀彈可以再投資。


    除了檢視剩餘資金之外，其次就是要想辦法增加資金，繼續累積到一筆可動用的開錢再投入市場，資金越大代表投資的彈性空間越大，選擇的商品也多；相對地，資金越小可以運用的空間也越小，選擇條件也容易被限縮。


    # ## 投資心法 5: 不想認賠，你會賠更多


    許多散戶的投資行為在進場前後是兩樣情，進場之前看好 A 投資方法，進場之後因為股市波動，馬上改 B 投資方法，和自己當初說好的遊戲規則不同，例如原本是價差交易卻因為股票套牢而改變心意，變成領股息的投資人。這一類型的散戶認為，股票只要沒有賣出就沒有賠。若是股價持續下探，散戶的邏輯通常是說服自己當成長期股東，等待有一天遇到市場反轉向上，就能不用賠錢。但是，沒賣股票真的就等於沒有賠錢嗎？還是只是安慰自己一面說詞？每一個投資學派的答案不一，'
  merge: -1
  img_proc: true
- pgno: 125
  md: '我認為進入市場就要勇敢面對自己的交易盈虧，以及認真看待資金。


    股票沒有賣出，感覺沒有賠錢，因為還保留一絲希望。但是，帳上的未實現損失明明是虧損狀態，若股價持續下滑，實際損失也會越賠越多，侵蝕本金。過去有不少的上市櫃公司下市，以博達（2398）為例，若沒有及時停損，股票就會變成一張墻紙，毫無價值可言。


    過去曾經紅及一時的宏達電（2498）也是很多股民心中永遠的痛。2011 年，宏達電（2498）股價一度衝到 1,300 元，當時市場全面看好，更成為台股人氣股王，內外資紛紛調高目標價，但股價並未持續走高，反倒是往下走。股價在跌破
    20 週均線之後就開始續跌，近 10 年的股價每況愈下，年年有低價，到了 2020 年時股價僅剩 30 元，和過去的風光股價相比，簡直是天差地別。（歷年下市公司可見附錄三）


    股票入手之後，若是沒有設定停損點就必須承受高風險，該停損的時機不出場，無疑就是在凌遲自己的身心靈，眼睜睜看著資金縮水，卻又不敢有所作為。因此，投資必須要做好風險控管，面對風險、擁抱風險，並且設好停損點，才能保護自己的資產，等待下一次投資的機會。


