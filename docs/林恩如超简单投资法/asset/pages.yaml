  md: '秉持著「不聽、不看、不說」的規則，相信眼見為憑的走勢，成為聰明的投資者。


    # 投資股票不應該做的事


    投資新手進入股市，往往因為搞不懂規則，而走了許多冤枉路，繳了許多學費，甚至提早股市畢業。投資股票千萬要避免以下三點，包括避免頻繁交易、從眾行為、不購買新上市的股票。


    # 第 1 點 避免頻繁交易


    投資是一輩子的事情，它需要時間的累積才能看得到成效，千萬不要短進短出，過度頻繁交易不見得獲利，反而會付出可觀的手續費。


    舉例來說，今年一月買了一張 10 萬元的股票，一週買賣一次，每月買進賣出 4 回共 8 次，剛好每次進出成交金額都是 10 萬元，一年下來買賣各 50 次累積交易
    100 次，在不賺不賠的情況下，就得支付 29,300 元的手續費，計算表如下：


    交易成本=買賣手續費+證交稅


    | 股價 | 股數 | 成交金額 | 買進* 手續費 | 賣出* 手續費 | 證交稅* | 合計 |

    | :---: | :---: | :---: | :---: | :---: | :---: | :---: |

    | 0.1425% | 0.1425% | 0.3% | | | | |

    | 100 (元) | 1,000 (股) | 100,000 (元) | 143 (元) | 143 (元) | 300 (元) | 586 (元) |


    * 買進、賣出手續費皆為 0.1425%、此處四捨五入計算

    * 證交稅僅需在賣出股票時支付


    第 1 章 20年後，遇見財務自由的你 47'
