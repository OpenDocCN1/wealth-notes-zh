- pgno: 49
  md: '「財務自由」簡而言之，就是不用再為了生活開銷而努力賺錢，並且達到任意支配金錢的狀態。它可以透過訂立明確目標、分階段計畫執行的方式，而被計算出到底需要存多少錢。不過，財務自由不僅僅是指金錢，而是指身心靈都是自由的狀態。當你不再為生活煩惱，不再被工作綑綁，可以自己支配金錢、時間和生活，隨心所欲做自己想做的事，那樣優雅、快樂的人生才完美。


    # ## 創造被動收入，實現財務自由


    想要實現財務自由就需要有被動收入，被動收入是指不需要花太多時間，就能產生持續的現金進帳。


    被動收入包括房地產買賣、出租房屋、投資股票、賺取股利與價差、基金分紅、退休金等。其中，投資房地產與出租房屋是最常見的方式之一，但需要付出較高的成本，投入的時間也較長，投資門檻相對較高，一般人較不適合。


    透過金融市場投資也是創造被動收入的方法之一，雖然市場具有不確定性，但卻可以透過正確的投資行為，事前計算風險、規避風險而賺取高額倍數的價差，而且，投入資金門檻和房地產相比低很多，現金週轉時間也較短，變現速度快，適合一般大眾。'
