  md: '+   黃金交叉


    黃金交叉為短週期的移動平均線向上穿過長週期的移動平均線，例如20日均線向上穿越 100日均線，當出現黃金交叉時，表示股價可能將有一波上漲趨勢，可視為買進訊號。


    +   死亡交叉


    死亡交叉為短週期的移動平均線向下穿過長週期的移動平均線，例如20日均線向下穿越 100日均線等，當出現死亡交叉時，表示股價可能有一波下跌趨勢，可視為賣出訊號。


    # 籌碼面相關名詞解釋


    +   三大法人


    三大法人指的是外資、自營商與投信，外資為外國機構投資者；自營商為政府核可的證券公司，運用公司的資金進行投資；投信則是基金公司，募集投資人的資金進行投資。


    +   千張大戶


    指的是擁有大量股票的人，他們資金雄厚，是市場主力之一。


