- pgno: 41
  md: '# ＞ 理財TIPS ＞ 別跟風，賺到 200 萬元背後的風險及本金


    某 A 因為投資某一檔股票賺了 200 萬元，他興奮的向朋友分享，因為看準某檔股票一定會上漲，所以在低點時買進，短短幾個月就大賺 200 萬元。朋友聽到這裡相當羨慕，也開始猶豫是否跟著一起投資，但又不知道何時是進場時機，只能每天跟著股價上上下下，心情跟著起伏擺盪。


    也許我們看到某 A 獲利 200 萬元令人欽羨，但我們沒有看到的是：他背後投入的本金可能高達 4,000 萬元，換算下來投資報酬率僅 5%，並沒有想像中來的高。


    閱讀投資理財相關書籍與研究各種投資方法，是累積財經知識的基本功。現代人每天接觸大量的網路資訊，根本沒有時間閱讀，許多人甚至認為讀一本書得花好幾天的時間，不符合效益。然而，書籍是作者累積數十年的經驗和心得，讀者只需要花幾天的時間就能汲取精華，實在是非常值得投資的事情。


    股神巴菲特曾說：「沒有聰明人不閱讀的。」閱讀是一件投資報酬率相當高的事情。挑選經過時間考驗、就算經歷過世代交替仍流傳的書籍，包括知名投資大師的著作、一再出版的書等都是選書名單。


    # 方法 2 嘗試實單交易


    除了閱讀之外，準備一筆小額資金試著實單操作也相當重要。看書或模擬下單雖然可以幫助自己學習投資，但卻無法取代真金白銀實'
  merge: -1
  img_proc: true
- pgno: 42
  md: '際進場交易的感受。所以，在充實理論之後，真正實務經驗才能累積投資功力。


    當努力存下一筆閒錢，這筆錢建議至少 50 萬元，從中撥出 20% 嘗試買股交易，我們可以將這筆錢當成學費，即使賠錢也能實際感受投資的真實狀況與市場波動，並檢視自己的投資方式是否正確，才可以逐步修正找到最適合的投資方法。


    # 方法 2 學習情緒管理


    投資交易的情緒管理非常重要，大多數成功投資者都是理性的，有一套屬於自己的穩定交易策略，透過有效的分析技能找出潛力股票。


    然而，一般散戶之所以會成為輸家的原因，大多為盲目投資或短視近利，時常在股票起漲之際，趨勢剛發動時見股價稍有上漲就衝動賣出，往往接下來的股價走勢仍持續走高，此時只能飲恨或是重新進場；趨勢股起漲不會只在短時間內，但散戶常因有小獲利而賣出，造成短進短出賺不到大錢的狀況，面臨賺了指數卻賠了價差的局面，看得到卻吃不到。


    | 股票 | 心態影響 |

    | --- | --- |

    | 盲目投資者 | 不理性、看不懂趨勢、沒有足夠的分析技能 |

    | 聰明投資者 | 理性、充分分析、驗證才投資 |


