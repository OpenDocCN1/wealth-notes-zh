- pgno: 127
  md: '量的變化。超簡單投資法擁有均線、趨勢線、型態、成交量等四大選股法寶，投資人透過四大法寶相互確認就能挑選出好股票。以下就先從看懂 K 線圖開始：


    # 3 分鐘搞懂 K 線圖


    大多數投資人判別股市的走勢，最常用的方式就是 K 線圖，K 線圖是由紅 K 棒與黑 K 棒（在台灣黑 K 棒多以綠 K 棒表示）組成，每一個 K 棒都包含四種價格，分別是開盤價、最高價、最低價、收盤價，也就是記錄當天買賣的交易狀況。當收盤價高於開盤價時就會以紅
    K 棒表示；當收盤價低於開盤價時就會以黑 K 棒表示，當每日 K 棒依照時間排列就形成 K 線圖，也就是股價 K 線圖。


    其中，K 棒有長有短，有時還會出現上影線跟下影線。當天走勢上漲，收盤價比開盤價高就會以紅 K 棒表示，其上影線就是當日出現的最高價，下影線則是當日最低價。反之，綠
    K 棒就是當日走勢下跌收黑，收盤價比開盤價低，其上影線就是當日最高價，下影線則是當日最低價。


    視投資人的喜好選擇 K 線圖的週期，以短期投資而言，通常會使用分鐘線、小時線或日 K 線；中期投資會選擇使用週 K 線；長期投資則是看月 K 線。超簡單投資法是一種中長期的投資方法，所以主要使用週線圖進行操作，因為週線圖擁有觀看中長期走勢的優勢，也沒有短週期短進短出的缺點，可以有效運用在波段操作。'
