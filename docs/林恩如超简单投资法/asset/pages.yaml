  md: '# 心理準備 2：計算最大的承擔風險


    投資的特性在於「報酬」與「風險」，這些年在教學之路上，常發現許多人眼裡只看到報酬，一昧認定進場就會賺錢，而忽略了風險。事實上，報酬與風險是成正比的，「高風險、高報酬」、「低風險、低報酬」是投資定律，你不願意承擔風險是無法得到好報酬。進場前請先重視風險大於報酬，因為損失可以控制，報酬卻能無限量。


    華爾街操盤手傑西·李佛摩曾說：「利潤總是能夠自己招呼自己，損失則永遠做不到這一點。」而利潤與損失就像好學生與壞學生，我們不需要擔心好學生的成績，因為他總是自動自發讀書、完成所有功課，但我們卻要特別關注壞學生的表現避免更偏差；投資則是應留意損失的部分，視情況進行調整，以降低損失無限擴大。


    根據多年的實戰交易及各方面的研究，整理出「超簡單投資法」，這個方法有兩種計算風險的方式，一是「均差距」，以價差做為損失的計算，二是計算「乖離率」，乖離率是一種衡量目前股價偏離移動平均線的指標，股價在移動平均線之上稱為正乖離，反之，若股價在移動平均線之下則稱為負乖離。乖離率的範圍很廣，可用來判斷進出場訊號，而「超簡單投資法」則是以此判斷停損點。'
  merge: -1
  img_proc: true
