  md: '# 聚焦四大錯誤投資心態


    # 錯誤心態 1 貪心——忘了初衷


    當持有部位開始獲利時，心中小惡魔就會降臨，它會忍不住說：「怎麼買這麼少？應該再加碼啊！」等小劇場，當有這種念頭就容易亂了交易方寸，忽略資金控管的重要性，也將當初自己訂下的交易策略拋之腦後，最後胡亂加碼，不只亂了買進規矩，連該怎麼賣都模糊不清，最後使得資金暴露在高度風險之下，十之八九導致虧損的局面。


    # 錯誤心態 2 妄想——不可能檔檔獲利


    每一次看個股線圖，眼睛總是不自覺的尋找最低點和最高點，然後開始想像每一個高低點都能精準掌握，以為自己的交易永遠能夠「買在最低，賣在最高」。這是一件不切實際的事情，就像買樂透，在還沒中獎之前，內心已經過足有錢生活的乾癮，然而回到現實中，不過是一場空，因為幸運兒不是你。超簡單投資法運用波段交易，買在相對低點、賣在相對高點，並利用趨勢賺取部分獲利，就像是魚身理論，魚頭有刺、魚尾沒肉，魚身最肥美，若享受到最肥美的那一段也是讓人回味。


    # 錯誤心態 3 偏執——不願面對真實


    偏執容易發生在不認輸、不甘心的投資人身上，他們通常心態比較消極，當賠錢時就會催眠自己：「沒有賣就沒有賠，一切只是帳上虧損，最終肯定會賺回來。」但這樣的心態和當初進場時的想法完全'
  merge: -1
