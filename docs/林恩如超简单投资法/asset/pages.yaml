  md: '以擁有資產 50 萬元、每月生活開銷 12,000 元為例，經過估算，緊急預備金至少是 36,000 ～ 72,000 元，儲蓄因人而異，接著，再做投資資本金規劃。


    # 創造「被動收入」的重要性


    當累積到一定存款之後，就可以開始規劃投資資本金，投資資本金必須是一筆專門用來投資的專用閒錢，不可和固定存款混在一起，建議另設立投資帳戶，將投資資本金存入，方便定期檢視投資狀況、虧損和獲利情形。


    投資的目的在於讓自己的收入變得更为廣泛，而不僅是靠領薪水過日子，隨著年紀增長，身體狀況也會逐年下滑，無法像年輕時用勞力換取金錢，也無法整天盯著電腦不喊累，尤其若遇到經濟不景氣、產業變動、公司裁員等不可控制的情況發生，那就更應該開源創造收入。


    英國牛津大學副教授麥克·奧斯本尼（Michael A. Osborne）與卡爾·佛雷普（Carl Benedikt Frey）曾經針對美國、英國和日本提出一項報告，內容指出在未來
    20 年中，人工智慧（AI）有可能取代美國約 47% 的職業，英國部分則是 35%，日本則是 49%，這說明未來 AI 極有可能取代人工，代表將出現更多失業人口。


    其中，最有可能被取代的職業包括一般行政人員、銀行櫃檯、警'
