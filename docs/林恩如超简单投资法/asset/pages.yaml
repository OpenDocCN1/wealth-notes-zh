  md: '# 穩賺不賠是神做的事


    世界上沒有一種投資方式可以保證穩賺不賠，任何投資都有風險，最重要的是停損點的落實，以超簡單投資法來說，只要嚴守「跌破20週均線就停損出場」的法則，當股票跌破停損點及時截斷虧損，損失就不會再持續擴大，買到好股票抱牢，讓利潤持續增加，長期下來就能做到小賠大賺。


    # 打破選股盲點，靠獨立判斷的頭腦


    不論是在股海中已經投資許久的老手，或是剛入門的新手，都會遇到投資盲點，因此判斷是非的能力相當重要。哈佛大學校長德魯·福斯特曾在2017年時向新生發表演說，她告訴學生「大學教育的意義除了追求真理之外，最重要的是要確保學生有明辨是非的能力，並辨別有人在胡說八道。」


    理財投資也是如此，在投資道路上會不斷遇到各種阻礙，投資人在面對挑戰时需要堅定方向，不被小道消息或他人影響，才能在金融市場中安然生存。以下舉4種常見的投資地雷，請投資人小心應對。


    # 投資地雷1 緊抱虧損不出場


    當買入股票之後，第一件事情請設立停損點，告訴自己當股票到達停損點時就要出場，然而不願意認賠的投資人，每次到達停損點時，'
  merge: -1
  img_proc: true
- pgno: 192
  md: '內心就會出現：「再等等，或許股價會反彈回升！」繼續抱著虧損部位不肯出場，最後終究落得長期住套房。適時的停損才能延長自己的投資生涯，當下一次機會來臨時，手上才能有資金重新進場。


    # ## 投資地雷 2. 選擇錯誤標的加碼攤平


    加碼攤平是指當股票跌落至一個相對低點時，投資人為了攤平成本進而加碼，達到攤低成本的目的。然而，在股市投資中，趨勢會出現低還有更低，不停損就像是坐上一台沒有剎車系統的汽車，若還想趁機攤平成本岂不是把自己推向危險邊緣。


    股市有一句常言：「錯誤的攤平，只會越攤越貧」，當手中持股跌破設定的停損點仍持續賠錢，代表方向錯了，這時候該檢視是否該繼續持有，而非心繫著已經付出的成本，並且一味加碼攤平。


    # ## 投資地雷 3. 認為保守型股票相對安全


    很多投資新手總認為購買保守型股票最安全，例如：大型股、金融股等可以當作存股穩賺取配股配息，有時會為了賺取股息卻賠上了價差，然而股票市場是動態的，無法保證現在的優質股未來也是，過去有不少績優股變成「積憂股」，若在不對的時機買進，當心被套牢，不少存股票的如中鋼（2002）、神腦（2450）就是血淋淋的案例。


    中鋼（2002）在 2003 ～ 2007 年時全球景氣熱絡，加上是原物料的黄金時代，因此中鋼股價一度從 11 元推升到 52 元，一口氣上漲 4 倍，'
  merge: -1
  img_proc: true
