  md: '# LESSON 11


    # 掌握關鍵投資心法


    『跌得越深，就要蹲得越低』，每一一次的失敗都是累積經驗值，曾數次在股海中大起大落的我，在最後一次慘賠之際，決定重新檢視每一個交易環節，記得當時每天睡不到 3
    小時，靠著手繪 K 線圖，研究台股歷年走勢，終於打造屬於自己的『超簡單投資法』，重新出發之後，不再整天盯盤，就能輕鬆獲利。」


    金融市場無論過去或未來都是多空循環交替，每一種金融商品的 K 線圖都是由買賣雙方交易結果所組成，當知道這個基本的簡單原理之後，再透過宏觀的視野看待市場循環，就能比較清楚市場輪廓了。在了解金融市場就是多空無限堆疊，接下來就是尋找適合的投資方法，學習如何進出場。'
