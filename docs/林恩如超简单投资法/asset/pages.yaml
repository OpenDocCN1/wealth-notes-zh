  md: '# LESSON 12

    超簡單投資法


    「進入股市今年已 24 個年頭，前半段熱衷於當沖交易，即使繳出亮眼的成績單，也只是幫券商打工，付出鉅額的證交稅給政府。但我始終沒有放棄投資，靠著鑽研技術分析、加上大量實單交易，終於搞懂金融市場的運作模式，淬鍊出『超簡單投資法』，搭配完美的四大法寶，只需要
    K 線圖就能輕鬆判讀任何金融商品的走勢。」


    # ● 超簡單投資法，適用任何金融商品


    「超簡單投資法」沒有過多複雜的招式，只依靠一條均線就可輕鬆判斷多空趨勢，當股價站上 20 週均線買進，跌破 20 週均線時賣出，簡單的原則，讓投資人知道交易其實可以很輕鬆優雅。


    超簡單投資法依據的是技術分析中的「K 線圖」，K 線圖中不僅可以看出過去股價走勢，也能了解股票未來趨勢、型態的軌跡、成交'
