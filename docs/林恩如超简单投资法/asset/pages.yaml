    「佳佳在 5 年前賺進第一桶金之後，開始學著買股票投資，因為不懂金融市場運作，她不斷買進賣出、聽信他人意見、跟風投資，以至於在幾年內就輸掉上百萬元的資金，幾乎破產，讓她一度生活失去重心，無法面對家人……。」


    # 心理準備 1：先了解自己的個性


    進入金融市場前最重要的就是擁有正確的投資心態，找出適合自己的投資方法，以及學會計算風險、面對風險與擁抱風險，並堅持所選的投資方法，有紀律且穩定的交易，評估上述條件，準備好再進場投資。


    許多人在投資前，因為不懂金融市場運作就貿然進場、胡亂買股，然而，知己知彼才能百戰百勝，強化投資心理素質的第一件事：請先了解自己的投資個性，因為實際進入市場，情緒及個性會影響交易的'
