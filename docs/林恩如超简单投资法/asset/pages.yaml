  md: '# 股市賭徒的常見心態


    在賭場中，最受歡迎的就是賭徒，而最不受歡迎的就是那些拿著本金，仔細計算風險，並在對的時機下注的客人。賭徒受歡迎的原因不外乎就是貪心、沒有耐心、急著獲利的個性，股市也是如此，身為聰明的投資人必須要拒絕以下錯誤的投資心態。


    # **賭徒類型 1：期盼一夕致富，一次就梭哈**


    不少賭徒型的投資人想要一夕之間致富，因此在毫無懸念之下就傾注所有本金，通常梭哈的結果可想而知，不是大賺就是大賠，投入的資金越多風險就越大，若是運氣好當然能獲利，但運氣不好也可能血本無歸，投資變成在賭運氣。


    # **賭徒類型 2：投資無原則，交易頻失利**


    賭徒型投資人期盼能快速致富，只要任何可能獲利的方式都想去嘗試。然而，因為不清楚交易模式與邏輯，所以經常變換投資方法，幾乎每次投資都失利。基本上，每一次的交易背後應該要有一套可依據的邏輯和理由，支撐著買股原因。若只是隨心情變動，或是聽信他人意見，投資容易沒有主見，最後變成只是在賭哪一支股票會上漲，戶頭的存款也會越來越少。


    # **賭徒類型 3：缺乏耐心等待，急於快速獲利**


    投資報酬需要時間等待，若是沒有耐心、急於一時快速獲利，很'
