  md: '# 股票面額以「千」為單位


    台灣買賣股票通常以一張為單位，一張是 1,000 股，通常至少購買一張，若是購買一張以下則稱為零股交易。


    購買股票時須考量成交價與面額，股票面額就是印在股票上的金額，過去規定 1 股為 10 元。不過，自 103 年 1 月 1 日起，根據《公開發行股票公司股務處理準則第
    14 條》，公司可依照自身需求決定股票面額，也就是說股票面額不再受限於 10 元，可以是 20 元、5 元或 1 元等，假設 1 股是 50 元，一張股票是
    1,000 股，一張股票就是 50,000 元，計算如下：


    ```

    50（元）×1,000（股）= 50,000（元）

    ```


    目前，我們常看到的股票價格是經過市場買賣交易、波動之後的價格，該價格是市值而非面額，熱門股票因為需求大、投資者多，股價自然上漲。舉例來說，假設台積電（2330）成交價是
    300 元，那麼它的市價就是面額的 30 倍，股票穩定性越高就越不容易下市下挫；反之，若股票較冷門，常因為需求量低、投資者少，長期下來導致市價小於面額時，就會變成所謂的雞蛋水餃股，又稱殭屍股，就有下市下檔的風險，最壞的情況就是股票變成壁紙。'
