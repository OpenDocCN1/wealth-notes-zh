  md: '# 「股票」是公司發行的有價證券


    「股票」是一種有價證券，因為股份有限公司需要籌措資金，因此釋出一部分公司所有權，而股票就是一部分公司所有權的證明，公司藉由發行股票可以募集資金，投資人也可透過購買公司股票，為公司創造更大價值。


    # 股票的交易方式


    投資股票依投資人交易習性分為 3 種，第一種是「短線交易」，例如當沖交易，短天期的進出最為一般投資人喜愛，因為大家都想要賺快錢，但是短線交易並不易賺到大錢；第二種是「波段交易」，利用波段賺取價差，而「超簡單投資法」也是以波段操作為主要策略，適合跟隨趨勢參與市場行情，賺進趨勢財的投資人；第三種則是「價值型投資」，參與公司的配股配息，每年等待公司分紅，是基本面投資人的最愛。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_67_0.png)


    # 股票的由來


    17 世紀歐洲流行海上貿易，從事歐洲與亞洲之間的貿易往來，西元 1602 年，荷蘭東印度公司應運而生，然而海上貿易雖然可以創造高額利潤，卻也得承受巨大風險。為了分散風險以及籌措足夠資金，他們想出了一個辦法，就是發行股票，只要想投資該公司者都可以購買，這也就是股票最早的由來。'
  merge: -1
  img_proc: true
