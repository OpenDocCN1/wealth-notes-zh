  md: '# 「沒有」穩賺不賠，賠錢是賺錢必經之路


    有一次我到銀行辦事時，有一位投資人跑來問我一個問題：「投資到底有沒有穩賺不賠的方法？」我瞪大眼睛反問他：「那你覺得這世界上有長生不老的方法嗎？」他大笑說：「比喻得好貼切」。事實上，大家都曉得投資沒有穩賺不賠，偏偏許多人一生都在苦苦追求，這就是不正確的投資心態，相對也會帶來不好的投資結果。


    股票交易是一種機率遊戲，有賺必有賠，沒有穩賺不賠，這套邏輯運用在超簡單投資法也是如此，沒有任何一個投資方式可以保證百分之百獲利，只有保持穩定的操作，才能有「大賺小賠」的結果。


    理財小教室


