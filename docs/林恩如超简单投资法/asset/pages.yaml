  md: '# 理財小教室


    # 「買進後不漲」，其實很正常


    不少散戶進入股市從來沒有賺過大錢，總是認為股票只要有獲利就要趕快賣出，僅賺到微薄的買菜錢，長時間來看將會賺少賠多。個股買進後不漲，長抱數月都是很正常的情況，因為股票有成七成的時間都處於盤整，一般持股只抱
    2～3 天都屬於短線操作。買進股票後別忘了給市場時間，讓股價發酵，只要沒有跌破停損點都值得等待，等到波段行情向上噴出再獲利了結，才能達到「大賺小賠」，財富才得已累積。記得一有風險就出場，一旦股價跌破
    20 週均線就立刻停損賣出，以免損失更多本金。


    # 出現四大訊號請立刻停損


    投資最重要的就是計算風險，並嚴格遵守停損點，不戀棧的出場。每每在行情由牛市轉為熊市時，投資人選擇的處理方式歸納為兩種，第一是假裝沒看到，賭它之後會再漲回來；第二是恪守說好的「約定」，認賠殺出，拿回部分資金。以下也提供
    4 個停損訊號，投資人一旦看到訊號出現就要謹慎應對，股票該走該留自己最清楚。


    # 停損訊號 1 跌破 20 週均線


    「跌破 20 週均線」是超簡單投資法中最強調並且必須遵守的原則，當股價已經跌破 20 週均線，就表示行情轉弱、多方趨勢不再，必須立即砍單出場，等到下一次股價再度站上
    20 週均線再進場。'
