  md: '# LESSON 01


    # 未來 20 年，

    你將面臨什麼？


    「20 年前，到巷口麵店飽餐一頓，隨意點一碗乾麵、一盤滷味再加上一碗熱湯，算一算不用 50 元，但現在點一模一樣的餐點卻要破百元，為了不讓荷包失血，只好不點小菜和熱湯，免得錢都花掉了……。」


    # 未來 20 年將面臨通膨威脅


    上述的情境熟悉嗎？這是一個通貨膨脹的過程，也是通貨膨脹的結果。未來 20 年我們將面臨什麼呢？答案很簡單，就是「通貨膨脹」。大家對於通貨膨脹或許會感到害怕，甚至有人會用怪獸、恐龍形容，通膨就像怪物一樣會把錢吃掉，因為它正代表著錢縮水了。


    根據統計顯示，近 20 年來台灣消費者物價指數（CPI）每年約上漲 0.98%，也就是大約 1% 的漲幅，但若是遇到像是次級房貸、石油危'
  merge: -1
  img_proc: true
- pgno: 15
  md: '機等重大經濟事件，消費者物價指數就會大幅上升，低則 $20\%$ 、高則 $50\%$ 的比例，將會拉高整體平均值，因此平均來說消費者物價指數每年的漲幅約
    $3\%$ 。




    ### 消費者物價指數


    | 年 | 漲跌幅（%） | 年 | 漲跌幅（%） |

    | :--- | :--- | :--- | :--- |

    | 89 | 1.26 | 99 | 0.97 |

    | 90 | -0.01 | 100 | 1.42 |

    | 91 | -0.20 | 101 | 1.93 |

    | 92 | -0.28 | 102 | 0.79 |

    | 93 | 1.61 | 103 | 1.20 |

    | 94 | 2.31 | 104 | -0.30 |

    | 95 | 0.60 | 105 | 1.39 |

    | 96 | 1.80 | 106 | 0.62 |

    | 97 | 3.52 | 107 | 1.35 |

    | 98 | -0.87 | 108 | 0.56 |



    資料來源／中華民國統計資訊網


    那麼 $3\%$ 大約是多少呢？以價值 $100$ 元的商品為例，每年上漲 $3\%$ ，第 1 年之後價格來到 $103$ 元，第 2 年為 $106.09$
    元，可以參考以下算式：

    第 1 年：$100 \times 1.03 = 103$

    第 2 年：$103 \times 1.03 = 106.09$

    第 3 年：$106.09 \times 1.03 = 109.2727$

    第 4 年：$109.2727 \times 1.03 = 112.5509$


    $\vdots$


    第 19 年：$170.2433 \times 1.03 = 175.3506$

    第 20 年：$175.3506 \times 1.03 = 180.6111$'
