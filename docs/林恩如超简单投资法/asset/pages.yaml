  md: '# 空頭市場：所謂的「熊市」


    當投資者看壞股市，股價開始向下崩跌、趨勢開始走下坡時，證券交易所自然就不會聚集投資人，看盤中心門可羅雀，形成空頭現象。


    除了空頭市場，「熊市」是指股價正處於跌勢，在美國早期拓荒時代，美國牛仔常有「熊鬥牛」的活動，而熊掌往下賣力搏鬥的形象，就像把股票市場往下壓，這也就是「熊市」的由來。


