  md: '# 節省研究時間


    透過定期定額可以節省許多研究分析的時間，比起研究個股必須花上時間研究單一股票的股價波動、短期與長期走勢、判斷進出場點等，相對來說較省時省力。


    # 適合長期持有


    定期定額是於固定時間投入固定資金進行投資，例如每個月 5,000 元，或 10,000 元固定買入，適合長期投資人。有時候我們會為了等待一個相對低點進場，因此錯過許多更好的進場時機，但透過定期定額投資
    0050 就能長期穩定擁有金流，包括穩定領取股息股利，也能等待時機賣出。


    方式 2 ：大跌大買，逢低進場


    「大跌大買」是指在股票暴跌時，投入大筆資金買進，而 0050 是由台灣市值前 50 大的公司組成，原則上體質好，較不會有倒閉的風險。投資人可以利用大跌大買的策略買進
    0050 。大多數的投資人總是希望能買在最低點，但實際上，我們不會知道何處是最低點，只能利用大跌大買的_strategy分散風險，而暴跌就是一個很好的進場時機點。


    投資人想做到「大跌大買」必須具備 3 個條件，第一是耐心等到大跌的時機，第二是大跌時手上有足夠資金可以投資，第三則是穩健的心理素質。股神巴菲特曾有句名言：「別人恐懼時我貪婪，別人貪婪時我恐懼。」指的就是在股市出現大跌時仍要穩定心性，並勇於買'
  merge: -1
  img_proc: true
- pgno: 151
  md: '入可投資的潛力股。


    # 準備足夠資金交易


    想要在大跌時進場投資的人，必須準備好充裕的資金，「大跌大買」策略一般投資人並不容易執行，因為當金融市場狀況不穩定時，人心惶惶、市場消息雜亂，眼見著市場重挫，多數投資人身邊會想保有現金，不敢進場交易，這是人性的表現。此時，投資人的心理素質要相當健全，並且備有充足的閒錢才能運用此一策略。


    # 方式 3 波段操作，靈活運用資金


    波段操作方式則較為靈活，主要是運用技術分析、利用數據找出相對低點進場，在相對高點時出場。可以透過超簡單投資法並搭配四大法寶進一步實現。另外，雖然波段操作可以靈活運用資金，但卻需要嚴守紀律、禁止貪念，並且確實控制風險與執行停損點，才能在投資路上走得長久。


    # 學會判斷進場時機


    超簡單投資法最基本的判斷方式是：當股價站上 20 週均線買進，以 2019 年 8 月 30 日的 0050 為例，當時股價剛站上 20 週均線（如 P154
    圖），通常會出現一段走勢，所以突破 20 週均線是起漲點，投資人必須要懂得判斷，才能在最好時機進場。'
