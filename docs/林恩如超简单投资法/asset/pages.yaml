  img_proc: true
- pgno: 227
  md: '# 技術面的名詞解釋


    均線


    均線（Moving average）指的是過去一段時間股票的平均成交價格，常見參數有 5 日線、10 日線、20 日線、60 日線、100 日線、120 日線等，投資人會依照習慣的週期單位作為參考依歸。


    K線


    K線圖由紅K棒與黑K棒組成，黑K棒一般又稱為陰線、黑K、綠K等。台股上漲的K棒以紅色K棒表示（在本書圖示上以紫色K棒表示紅K棒），下跌的K棒則以綠色K棒表示。K棒是用來判斷股市波動的情形，每一根K棒都包含四種價格，分別是開盤價、最高價、最低價、收盤價，以記錄當天買賣的交易狀況，當收盤價高於開盤價時就會以紅K棒表示；當收盤價低於開盤價時就會以黑K棒表示。


    趨勢線


    趨勢線分爲上升趨勢線與下降趨勢線，上升趨勢線是指股價在某一段走勢期間，低點連接到高點的線；下降趨勢線則是股價在某一段走勢間，高點連接到低點的線。


    乖離率


    乖離率（BIAS)做爲判斷股價與均線距離高低的指標，當乖離率過大時，表示股票在相對高點，反之，當乖離率較小時，表示股票在相對低點。'
  merge: -1
  img_proc: true
