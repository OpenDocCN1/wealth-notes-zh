  md: '# 長線保護短線，波段操作才穩健


    中長期的波段操作需要運用「長線來保護短線」原則，也就是當股票同時符合突破 20 日均線與 100 日均線才能放心進場，若只看短期波動則難以正確判斷股票的長期走勢。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_158_0.png)


    △ 以聯發科（2454）為例，紫色線是日線圖的 20 日均線，黑色線是日線圖的 100 日均線，100 日均線相當於週線圖的 20 週均線。（資料來源／強棒旺旺來）


    # 掌握四大停損停利法則


    停損和停利是一體兩面的，當波段明顯時，停損點同時也是停利點，停損、停利的方式需要依照投資人的現實狀況而定，包括個人可'
  merge: -1
  img_proc: true
- pgno: 159
  md: '承受的風險、想要保住多少獲利等因素，選擇最適合自己期望的方式進行。掌握以下四大法則，輕鬆停損停利。


    # **法則 1 股價跌破 20 日均線**


    當股價跌破 20 日均線即出場，簡單來說就是當股價跌至過去 20 天的平均價格時就賣出，此一方法適合無法承受大虧損風險的投資人，缺點則是較容易頻繁交易，且累積的交易手續費也會成為投資成本。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_159_0.png)


    以台表科（6278）為例，紫色圓圈代表進場點，黑色圓圈代表跌破 20 日均線則賣出，此處為停損同時也是停利出場。（資料來源／盛餘旺旺來）'
  merge: -1
  img_proc: true
- pgno: 160
  md: '# 法則 2 移動停利法，守住前一根週 K 棒


    移動停利法是在底部進場且有一大段漲幅，擔心若守 20 週均線會獲利回吐成為紙上富貴，為了確實保住利潤可以運用，只要股價跌破前一根週 K 棒的最低點就可以先執行停利，若個股走出趨勢，停利點會隨著股票上漲而越守越高，此一方法適合想要保住獲利或是沒有時間盯盤的投資人，每週花
    5 分鐘固定檢視持股現況，將停損點改為前一週的 K 棒低點，這是一個簡單又實用的停損停利方法。原則上只要每天的最低價沒有觸及前一週 K 棒的低點，就可續抱不動，但若是跌破前一週的週
    K 棒最低點，就要即時執行停利／停損，避免獲利回吐或損失擴大。


    ![](img/976c3a9d2b44a7a2e8cb5c78f24a42d9_160_0.png)


    a 以揚博（2493）為例，紫色圈圈處代表進場點，之後每一週都觀察有無跌破前一週 K 棒低點，只要趨勢正確，通常都能有波段獲利。（資料來源／強棒旺旺來）'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# **法則 3** 觀察關鍵 K 棒


    透過觀察關鍵 K 棒也能找出停損停利點，當看到 K 線圖中有爆量的長紅 K 棒或是爆量的長綠 K 棒，都是關鍵 K 棒。鎖定關鍵 K 棒後就可設定停損或停利，另外也可搭配型態的高低點找出停損停利點。每一個投資人的選擇不同，對於停損停利，只要找出自己可以接受且遵守的原則，每一筆交易才真正有意義。


    # **法則 4** 股價跌破 20 週均線


    有別於前述守 20 日均線的停損停利方法，中長期的投資人可以選擇以跌破 20 週均線為出場依據，此一方法可以享受甜美獲利，也可能讓你獲利回吐且倒賠，適合風險承受度較大的人使用。不過，投資人只要遵守投資紀律，長期下來終能達到大賺小賠、經常性獲利的結果，長遠來看，這個方式相對穩健。以聯發科（2454）為例（見
    P.164 圖），若是採用 20 週均線停損，在 2019 年 1 月 17 日以收盤價 244 元買進，直到跌破 20 週均線時，在 2020 年 1 月
    31 日以開盤價 400 元賣出，單張股票就可獲利 156,000 元，一年的報酬率達近 61%。'
