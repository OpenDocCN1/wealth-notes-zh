  md: '# ## 善用工具，學會選股


    進入股市投資其實沒有想像中困難，投資人只要掌握交易的標準程序，遵守買進賣出的原則，設好停損點，投資其實可以很簡單。當股價往上攀升時，一定是由某個低價往高價走，當股價下跌時也一定是由高價往低價走，不論是在高價還是往低價走，都會有一個明確的「價格」做為依據，不用自己胡亂瞎猜，這個數字就是
    20 週均線的均值。


    我們依據 20 週均線來判斷行情的多空，並加上趨勢線、型態、成交量的相互確認，就可以在股票市場中長期生存。然而，對上班族來說，每日朝九晚五的辛勤工作，遇到工作量大還要加班，回家之後又有家人要陪伴，幾乎沒有時間可以好好研究股市行情。


    於是，「沒有時間」成了多數上班族將投資理財拒於門外的藉口，但我相當鼓勵大家越早開始投資理財，對人會越有助益。因為，人生還有許多事情值得經營，懂得如何利用錢滾錢創造財富，才能在無經濟壓力之下，擁有更好的生活品質。


    幫助大家翻轉人生是我進入投資理財教育的初衷，因此，我將多年交易的實戰經驗，轉化成人人皆可複製的選股方式，包括統整所有技術分析的精華，以及融合四大法寶，化為有系統的交易程序，打造「長線聚寶盆
    Plus」、「強棒旺旺來」兩大選股軟體，只要利用軟體'
  merge: -1
  img_proc: true
- pgno: 144
  md: '就能在 5 分鐘內，從台股 1,700 多檔股票中，選出當週的強勢股及當日的強勢股，確認風險接受度後，就能選出適合自己投資的股票。


    理財小工具 「長線聚寶盆 Plus」 潛力股集合地


    「超簡單投資法」最重要的交易策略，就是嚴守股價站上 20 週均線進場、跌破 20 週均線就出場的原則，這個方法適用於大多數的投資人，不論長線、短線操作都可以簡單運用。


    「長線聚寶盆 Plus」是為長線操作而設計，將成功的交易策略透過大數據演算呈現，投資人只要選定喜歡的股票屬性，例如剛起漲的股票，或是已經上漲一段時間的個股，融合四大法寶的判斷，將每一檔個股進行星級評價，找股票不必再看一大堆數字，只要看星星數就能判斷符合趨勢型態、帶量突破的強勢股。此外，除了用星星先篩選個股之外，還可依靠「火焰指標」進一步選出強勢明星股，節省選股時間。


    另外，目前台股「類股輪動」的情形越來越快，同一產業中，領頭羊個股隨時會有所變動，因此投資人不容易找出產業中的龍頭股，這時也可利用軟體中的「当期強勢類股排行榜」功能，找到金流類股。


