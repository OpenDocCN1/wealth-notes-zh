    元，一個月平均出 3 次，累積下來是一筆開銷。


    後來佩佩逐漸拒絕小恬的邀請，每次外出工作都獨立完成，省下喝咖啡的時間與金錢，並利用額外的時間完成工作，避免工作未完成要加班的窘境。


    一年之後，佩佩每月平均省下 400 元，一年省下 4,800 元，對她來說不僅減少金錢和時間損失，而她也利用下班閒暇之餘學習理財投資，並且想辦法創造業外收入，讓自己擁有更多積蓄。


    # 財務自由不等於什麼都不做


    財務自由不等於什麼都不做，不少人認為達到財務自由後就可以自在揮霍、隨心所欲生活，然而一旦這樣想就不會成長。當達到心中的財務自由時仍需維持以下習慣，才能保有財富並讓錢繼續壯大。


    # 持續投資，長期獲利


    錢永遠不嫌多，因此即使達到財務自由仍可持續投資，但要注意的是投資是長期的事，仍應尊重趨勢，做好資金配置、風險控管，才能持續保泰。'
