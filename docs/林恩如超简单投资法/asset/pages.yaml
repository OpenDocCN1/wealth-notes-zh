  md: '資人通常會出現兩種想法，一是認定短線就能賺到快錢，一是認為波段操作太慢，沒耐性長期抱住。


    無論是哪一種想法，最常發生在投資人身上的就是已出場的股票，隔天續漲，心裡只好安慰有賺到錢就好，之後眼睜睜看著標的一直上漲，內心扼腕不已。那麼該如何避免這樣的狀況發生呢？答案是：「避免在短時間內頻繁交易」。


    「超簡單投資法」強調的是「波段操作」，波段操作最重要的就是抓到股票的起漲點，而所謂的起漲點是指買進股票後，噴出一段漂亮上漲趨勢的時機點。當所選的個股符合股本大於
    20 億元、股價站上 20 週均線、股價在底部盤整完成、成交量爆大量等四大條件就可以進場，進場後的首要工作是「設定停損停利」關鍵點。


    > 理財小教室


    先學會停損再學會停利


    學習投資最重要的關鍵就是學會停損，停損是投資人進入市場後的保命符，想要在股市安然生存，就要真正懂得停損。雖然很多投資人認為自己已經曉得停損邏輯，卻因為沒有確實遵守紀律，以至於常常停損在錯誤的價位，而因小失大，當真正學會停損後才能學會停利。


    158'
