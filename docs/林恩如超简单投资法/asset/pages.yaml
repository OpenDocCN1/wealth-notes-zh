  md: '就越要提高警覺，資深員工會成為最沉重的人事包袱，當大環境不景氣時，企業為了生存，必須縮編、裁員、資遣，這一群人絕對是優先淘汰的人選。未來能讓你做到退休，養活你一輩子的公司將越來越少，你，準備好了沒？


    # 做好資產分配，讓錢為你工作


    在下定決心開始理財之後，可以從分配資產做起，經過檢視及評估才能計算可以運用的投資本金。其中，資產配置的部分可將自己手邊的資產分成三份，包括一個月必要的生活開銷、緊急預備金以及儲蓄，三者比例大小依照個人需求分配，但要提醒的是，必要開銷僅限於真正需要的支出，而非娛樂開銷，緊急預備金則建議準備
    3 ～ 6 個月以上的基本開銷，預防非預期的支出，例如醫療費，而儲蓄則是依照財務目標訂定存錢目標。


