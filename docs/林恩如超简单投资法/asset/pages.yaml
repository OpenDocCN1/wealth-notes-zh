  md: '在不賺不賠的情況下，只要進出股市 100 次，光是手續費就高達本金的 29.3%，還沒有獲利就已經賠錢了。


    # 第 2 點 避免從眾行為


    散戶的投資模式大部分是賠錢居多，這是因為從眾行為造成的結果，投資沒有主見，人云亦云，又熟袁於短進短出，常常是小賺大賠收場。散戶都想要今天買、明天賺，再從中取得利潤，試想只有一天
    的時間，能夠有多大的獲利呢？別忘了，投資需要時間。


    買股票實際上就是投資一間你看好的公司，期待它的成長為股東帶來獲利，投資人應該抱持實體投資的心態來購買股票，而非當成虛擬物品隨意買賣，當視買股為實物時，心態自然會更加謹慎，也較願意用心找出適當標的物，評估各項條件是否符合，認真挑選的股票才有機會從中獲利。


    # 第 3 點 不入手新上市股票


    新上市股票由於才剛閏市，很多投資人會想參與蜜月行情，但無法掌握這檔股票的前瞻性及本質好壞，也不知道能否順利在市場上生存下來，基於可參考數據太少，建議投資人不要入手。


    挑選股票請盡量以大型股為主，這一類的企業往往股本大、成立時間長，當趨勢形成時，走勢相當明顯，即使價格下跌也不至於下市，只要控制好風險，損失有限，只需要找一個相對位置就可以買進。


