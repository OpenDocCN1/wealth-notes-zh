  md: '# 認識四大法寶


    四大法寶是超簡單投資法用來判斷股票走勢的工具，包括 20 週移動平均線、趨勢線、型態與成交量，這四種判別指標各具重要性，集合起來運用能更精準的選出好股票，減少進出場次數，分別了解四大法寶的意義之後，就可以實際套入個股練習，判斷股票走勢。


    # 法寶 1 20 週移動平均線


    移動平均線（Moving Average，英文縮寫 MA）簡稱「均線」，是由美國投資專家葛南維（Jogepsb Ganyle）創立，簡單來說，均線就是每日收盤價加權平均，從而得到一條帶有趨勢性的軌跡，它代表投資人在某一段時間內買入股票的平均成本，反應股價在一定期間的變化，故又稱之為成本線。


    均線可以分為 5 日線（週線）、10 日線（雙週線）、20 日線（月線）、60 日線（季線）、100 日線（20 週線）、120 日線（半年線）、240 日線（年線）等不同週期。很多投資人會運用均線做為交易基礎，差別僅在於均線參數不同，沒有哪一種週期最好，端看投資人的交易習慣而已。以
    20 週均線為例，我們可以透過 20 週均線圖看出 100 日股價的走勢，當均線往上即表示股價向上攀升，當均線往下就代表股價向下展開跌勢。


    而超簡單投資法的四大法寶之一就是採用 20 週移動平均線，趨近'
