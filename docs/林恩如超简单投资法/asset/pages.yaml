  md: '而趨勢則是當觀察股價在一段時間內的走勢後，得出上漲或是下跌的趨勢方向，進而畫出一條虛擬的趨勢線，用來判斷該檔股票走「多」還是走「空」，進而決定是否要進場。


    成交量就是觀察該股票的交易量，當交易量大表示有大戶進駐，這時候就可搭上大戶的順風車買進；相對的，若是成交量低迷表示沒有大戶支撐、市場流量差，就不宜買進，才不會發生買得到、賣不掉的情況。


