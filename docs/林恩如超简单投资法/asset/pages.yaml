- pgno: 119
  md: '# 投資心法 1：穩賺不賠的投資，就是投資自己


    在進入金融市場之前，必須先學會看懂市場運作，這樣才算是拿到投資市場的入門票，「想要怎麼收獲就先那麼栽」，每一件事情都是經過努力而得來的，投資理財亦是，透過不間斷自我學習，以及經驗累積才能算是正式進入投資領域。


    市場投資人最希望的就是「穩賺不賠」的交易，若要找到穩賺不賠的投資，那就是投資自己，而且投資報酬率有可能高得驚人。「一分耕耘、一分收穫」，只要有所努力，就會有所成果。


    在進入「超簡單投資法」之前，想跟大家分享一件事，以前在證券公司工作時，我一直認為選股技巧比投資心性更重要，只要擁有出神入化的選股能力，就能天天從市場獲利。然而，當沖的歲月讓我明白空有高超的選股技巧，都遠不及強大的投資心性來的重要，因為人性不會改變，所有的貪婪和恐懼都能影響交易結果。


    學習投資請先懂得存錢、充實財經知識、熟悉相關投資策略，以及做好資金控管與情緒管理，其中存錢是投資的第一步，有了本金才能夠錢滾錢，充實財經知識可以透過閱讀書籍、研究
    K 線圖等，而養成穩定的投資心性，不被市場的紛雜訊息影響，才能做出客觀判斷。


    另外，投資方法百百種，每一種方法都有擁戴者，找出最適合自'
  merge: -1
  img_proc: true
- pgno: 120
  md: '自己的方法並確實執行。就如同選大學科系，一定會先想好自己的興趣及能力，才能選出最符合自己就讀的科系。此外，投資之前請務必做好三大準備：


    # 準備 1 評估風險，設定停損


    每一次的交易最先想到應該是能「賠」多少，而不是想「賺」多少，股市不怕投資人賺錢，更不會在乎投資人賠錢，所以，設定停損是保護自己的最佳法則。人家都說股市無情，所以千萬不要跟它發生感情，該停損就瀟灑離開，情牽股市，不願停損的人，往往都沒有好結果，尤其遇到空頭時損失將更慘重，最嚴重更有可能傾家蕩產。


    投資時記得要嚴守遵守進出場原則，股票符合條件就毫不遲疑的進場，當跌破 20 週均線，或是到達停損點時就出場，嚴格遵守「20 週均線」的原則，機械式的反覆操作，才能收成「大賺小賠」的甜美果實。


    # 準備 2 敬畏趨勢，大賺小賠


    記得剛進市場時，爸爸送給我一句交易金言「順勢而為、勿逆勢而行」，指的是順著趨勢交易，獲利機會才大，股票上漲時做多，下跌時放空，不要和市場唱反調。進場前先判斷目前趨勢是多頭市頭，還是空頭市場，定出交易方向再設定可以接受損失的金額，接著就是等待市場給予的結果。


    只要選對趨勢方向，市場自然會回報合理報酬，不少投資散戶認'
  merge: -1
  img_proc: true
- pgno: 121
  md: '為，買股就是要穩賺不賠，但實際上，股市並不存在穩賺不賠。過去打著保證獲利、穩賺不賠的人，大多是吸金或是詐騙居多，交易沒有穩賺穩贏的事，偏偏許多人一直在找這個不存在的事，成功的投資人幾乎都是靠大賺小賠累積財富。


    # 準備 3 未來無法預測，報酬需要等待


    生活化交易是指日常生活中有許多觀念、行為都可以運用在投資上，讓交易融入生活，才能優雅投資。好比獵人外出打獵，等待獵物出現需要時間，套用在投資上就是想要有優雅報酬，同樣需要時間等待，投資時應把心思放在手中的股票，而不是觀望他人手中大漲的股票，應該要將眼光放在自己身上才正確。


    投資人最需要的是靜心等待時機、依照紀律進出場の，別在慌張之下毫無根據的買賣股票。另外，還有一種心態需要避免，那就是當聽到市場出現大跌時就跟著恐慌，且聽從他人預測，胡亂賣出手中持股，常常是冤枉賠錢出場。


    # 投資心法 2：堅持信念，永不放棄


    「每一次的投資，我都做最好的準備、最壞的打算，即使賠錢，也不輕言放棄。」這是我一貫的投資原則，就像學習任何新事物一樣，持續練習、不輕言放棄，才有可能達成目標。'
