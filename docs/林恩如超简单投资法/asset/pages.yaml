  md: '# 投資報酬無法預測


    許多投資人喜歡計算投資報酬，買進股票之後就開始預測能賺多少，然而未知的報酬其實無法計算，也不需要預估，畢竟若有獲利，市場自然回報滿意答案。反之，風險容易被投資人忽略，因為先想賠錢有違人性，但評估風險才是獲利必經之路。


    # 紀律投資穩健操作


    投資策略是在股市的求生技能，它必須透過經驗累積，生存技能才會提升，所以，一旦確認好投資方法以及交易策略，就不再隨意更改。舉例來說，若是長期波段操作者，就觀看長線走勢圖為主，不要任意改成短線操作，也不要受到他人影響，定心、定性、定法很重要，紀律投資可以幫助自己訓練心性，穩定情緒，不受波動影響。


    # 懂得等待伺機而動


