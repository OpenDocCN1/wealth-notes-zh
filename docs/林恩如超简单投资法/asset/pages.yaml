    聽到理財規劃有些人或許覺得陌生，但事實上我們無形中可能已經做過相關規劃。舉例來說，小美想在明年冬天到韓國滑雪，估計旅費 40,000 元，因此從今年起，每個月都必須額外存
    4,000 元，10 個月後才足夠應付旅行支出，這就是理財規劃的一種方式。'
