  md: '# LESSON 19


    # 定時健檢手中持股


    「君君謹記著超簡單投資法的每句話錄，自從買了幾檔股票後，她每週定期檢查一次手中持股，觀察股價是否仍在 20 週均線之上以及趨勢現況，再加上紀律操作，總能穩定心性投資。」


    # 持股健檢，定期管理


    每個股市交易學派，觀察的指標雖然不同，但無非都是想知道下一步該如何操作？金融市場最有趣的是：每個人都在找尋那個不確定性，但未來的事誰能說的準？所以，我從來不對盤勢做任何臆測，只是按照盤面提供的指引，順著現在的方向下單。有的人專注指標、財報、營收、價值、消息、均線、型態等，常會有人問我哪一種方式行得通？！說真的，我覺得只要能獲利都可行，重點是適合自己而且自己能夠做到。在金融市場找門路，我會建議找一個適合自己的投資方法，而且極度相信，不畏盤勢波動，肯定自己會百分百遵守制定的遊'
  merge: -1
  img_proc: true
- pgno: 197
  md: '戲規則，願意長期執行就是好方法。


    而這一課要求談的是學會超簡單投資法後，你該如何把手中的持股做健康檢查，學習如何進行交易固然重要，但投資後的定期管理才是決定勝敗的關鍵。就好比車子需要定期檢查、懷孕需要定期產檢、人們需要定期健康檢查，當然股票也是，平時定期追蹤與管理，才能隨時做好應變。


    # ● 股票健檢的重點與頻率


    手中持股健檢頻率建議一週一次，忙碌的上班族最少應該在每週五下班後打開看盤軟體，觀察手中持股走勢，並觀看健檢重點，決定應對方式。健檢重點仍是第 12 課提到的超簡單投資的四大法寶，包括均線、趨勢線、型態與成交量，以下簡單重述整理說明：


    +   - [x] 均線


    均線指標是確認持股股價在 20 週均線之上？還是之下？這部分可以直接從圖表上的數字看出，當股價仍然在 20 週均線之上，就可以繼續持有，反之若已經跌破 20
    週均線就出場。


    +   - [x] 趨勢線


    趨勢線則是觀察目前該股的趨勢，除了股價站上 20 週均線，還要'
  merge: -1
  img_proc: true
- pgno: 198
  md: '觀察股價狀況，若是股價仍在上升趨勢線中則屬偏多趨勢，是安全範圍；若股價跌破 20 週均線，而且跌破上升趨勢線就是偏空趨勢，請停損出場。


    # ☑ 型態


    型態包括 W 底型態、M 頭型態或盤整型態，當股價仍在 20 週均線之上，並且剛完成 W 底型態，就屬安全範圍；跌破 20 週均線若出現 M 頭型態，股價持續下探，就是出場時機；若是出現盤整型態代表局勢不明，可先持有並觀察再決定。


    # ☑ 成交量


    成交量主要是觀察有無大戶進駐，若成交量持續爆量，且股價站上 20 週均線則屬安全範圍，若成交量持續爆量，但股價已跌破 20 週均線，就表示大戶正賣出手中持股，必須快速離場保命。


    定期持股健檢不僅可以帮助自己檢查股票現況，確認操作方向是 否正確，當有狀況時也可以及早做好停損，並決定停損後的下一步， 同時也能增加股感，提升選股功力，每週花
    15 分鐘檢查、練習畫圖， 相信日積月累就能增進投資實力。'
