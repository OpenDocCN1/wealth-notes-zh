  md: 'LESSON


    # 03


    # 拒當月光族，

    訂定存錢計畫


    「『我是小資族，今年 27 歲，月薪只有 3 萬元，每個月扣掉房租、交通費和閨蜜們出遊，一下子 2 萬元就花光，到底該怎麼存錢啊？存錢好累喔！』看著她一邊喝著連鎖咖啡店的昂貴咖啡，一邊唉聲嘆氣，答案已經很明顯，她花了太多金錢和時間在娛樂花費上，自然沒辦法存錢，也不知道錢花到哪裡去。」


    # 設定目標，存下第一桶金


    所謂「金錢有限、慾望無窮」就是上述案例中的享樂主義者常見的寫照，若是一直抱持即時享樂的想法，永遠都存不了錢。為了避免入不敷出，請痛定思痛下定決心先為自己存下第一桶金，再透過投資創造更多的財富，延後享樂才能真正體會財務自由的甜美果實。'
