  md: '# 看盤名詞小知識


    一般我們打開看盤軟體，觀看個股走勢時，可以從折線圖看出當日個股成交的狀況，此外還會有 5 個常用數字，包括開盤價、最高價、最低價、收盤價與成交量，分述如下：


