    | 103 | 19,978 |

    | 104 | 20,421 |

    | 105 | 21,086 |

    | 106 | 22,032 |

    | 107 | 22,168 |


    資料來源／行政院主計總處


    # 娛樂費


    娛樂費以國內外旅遊為大宗，假設以每年國內旅遊開銷 30,000 元、國外旅遊 70,000 元計算，一年就需要 100,000 元的旅遊費。


    # 醫藥費


    根據衛生福利部統計資料顯示，每人每年醫藥費平均約 51,000 元（如下表），老年生活對於醫療需求增加，在準備退休金時，必須考'
