  md: '# LESSON 14


    # 設定停損停利點


    「凱凱自從某一檔股票站上 20 週均線之後，就買進長抱不動，但經過 1 ~ 2 個月，遇到大盤偏空，這時他擔心中持股價下跌，萌生停損念頭，經過觀察發現股價已經跌破
    20 週均線，也跌破上升趨勢線，他趕緊賣出，拿回部分本金，等待下一次進場的好時機。」


