    涉及瑞士私人銀行界的貪腐案件，似乎以每日出現的頻率充塞在他們國家的報紙。外國寶藏貯放在瑞士的銀行裡，有合法有非法，已經俘獲作家從佛萊明 (Libé Lémoin)
    到勒德倫 (Robert Lémé) 等人的文學幻想。現在，記者們首度有機會一探究竟。


    卡瓦哈爾將本專案代號取成「航海家」 (Voyage) 。


    卡布拉及國際調查記者同盟資料團隊整個夏天不知疲倦地把法爾恰尼名單，轉化成可以理解及搜尋的東西。這可不是簡單的事。法爾恰尼從匯豐提取資料時，分節分段。接下來法國稅務當局把它破解除成CSV活頁簿，依國家分類，與交好的各國政府分享。到二〇一五年，因為這批資料而超出的逃漏稅，全球已有大約十三億六千萬元。國際調查記者同盟此時試著重建原始資料庫，把拼圖還原。這些資料跨幅二十年，以很多碎片呈現。每個名字可能與一或數塊有關係，每塊都揭露不同的歷史。這批客戶資料始於一九八七年，直到二〇〇七年，包括人名、地址及銀行帳戶。接下來還有注解；匯豐行員手工加入到檔案裡，作為該銀行客戶關係管理系統的一部分。但注解只有二〇〇五年。這批資料另側重銀行帳戶餘'
