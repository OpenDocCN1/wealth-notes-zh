    ## 拯救世界的夢想


    馮賽卡一直很敢做夢，同時做很多事，經商、寫小說、從政。他出生於一九五二年，全名拉蒙·恩里克·馮賽卡·莫拉（Ramon Enrique Fonseca Mora），兒時玩伴叫他「里克」，也就是恩里克的簡稱。他的祖父是哥斯大黎加駐巴拿馬的首任大使，外祖父本來是牙醫師，後來參與革命。他津津樂道於家族長年激情投入政治，而且經常是與美國角鬥；巴拿馬與美國之間關係歷時長而複雜，可以追溯到一九〇三年，美國策動巴拿馬自哥倫比亞獨立，華府企盼取得優惠條款，以便建造運河穿越地峽。由此簽訂的新條約，讓新生的巴拿馬共和國在事實上變成美國的庇護國，美國對後來的運河取得絕對控制，另有權干涉巴拿馬內政，但是對這項特權，只需付出微薄的代價。這樣的安排使巴拿馬人極度不滿：在運河區，非美國人不得自由出入，當地工人拿的工資較低。離開運河區，美國人把持巴拿馬政府要職，英語壓過西班牙語，成為強勢語言語種。


    馮賽卡的外祖父莫拉${}^{10}$便是挺身反抗這種在自內國內當二等公民的革命分子。${}^{10}$莫拉曾在美國就讀斯沃茲莫爾學院（Swarthmore
    College），並在賓州大學攻讀牙醫。在一九二一年的畢業照裡的他戴著眼鏡，腦袋兩邊大耳招風，粗厚的上下唇嘟起來，嚴肅地直視鏡頭，沒有微笑。回到巴拿馬後，莫拉約二十出頭歲，便致力組成反貪腐、反美國「社區行動」（Community
    Action）組織。沒在看診時，他就經營一間反對派報社，還蓋了一間很賺錢的萊姆酒廠。


    一九三一年，莫拉手持左輪槍、跟一小群年輕人起而革命，成功推翻新羅塞梅納（Florêncio Arosemena）政府。美國為維持和平穩定，做出小幅退讓。莫拉當上農業及公共工程部長。他做了九個月，接下來社區行動組織選出的總統哈莫迪奧·阿里亞斯·馬德里（Herníudio
    Arias Madrid）拔掉他的部長職。繼而掌權的是哈莫迪奧的弟弟阿里亞斯·馮塞卡（Amilto），兩人都有參與革命，莫拉退到旁邊看著。阿里亞斯兄弟追求民粹主義政綱，女性取得投票權，創設社會安全系統，排外言論持續升溫。一九四〇年，公開同情納粹及墨索里尼的阿努爾福當選總統，一年後被巴拿馬國家警察在美國的授意下推翻。


