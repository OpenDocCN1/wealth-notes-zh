    改行成銀行家的克瓦恰克 (Yury Kovalchuk)，以及德國跨國大企業西門子的當地代表人沙瑪羅夫 (Nikolai Samarov)，後者求學時原本攻讀牙醫。普丁用自己已在政府的權位，幫忙把這些國有資產合法轉移到私人手上。


    俄羅斯銀行的股東們，與他們的政府贊助人普丁，在聖彼得堡的肯索默爾斯科伊湖 (Lake Komsomolskoye) 東岸，共同擁有一個設有大門的社區，建築物都是俄國鄉間大宅。以普丁市府官員的薪水，如何買得起超級豪宅，一直是個謎。這批人替社區住戶辦了一個合作社，名稱就叫「本湖」
