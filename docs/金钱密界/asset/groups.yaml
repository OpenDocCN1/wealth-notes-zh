    在巴拿马，瓦丝奎兹与布朗斯坦夫妇总是乐于提供帮助。另要感谢罗德里格兹、诺瑞拉、贾拉米尔（Rafael Perez Jaramillo）、亚历阿斯及卡斯提列罗（Gian
    Castillero）。我第二次前往巴拿马，要感谢「国际反贪污研讨会」（International Anti-Corruption Conference）二〇一六年的邀请。大会的会外会上，阿尔梅妲、孟恩、哈度（Paul
    Radu）及沙克森（Nicholas Staxson）都不吝提供意见。


    在老家附近，高登很体贴、有耐心、直接了当。魏斯特人真好，翻遍他试图遗忘的记忆，谈那些试炼及胜利。乔魏奇提供目光如炬的艺品市场观察。另要感谢法格（Keith
    Fogg）、伯尔曼（Brad Berlman）及史密斯（Frank Smith）。


    我能跟布伦姆、毕恩（Elise Bean）、韦伯（David Weber）谈论这本书，真是太幸运了。他们对金钱密界、洗钱及各造想管制这类活动的心血，知识可谓百科大全。我真希望能多在它们跟前悉心聆教。


    这本书诸多可称道之处，来自前述所列出各位。有任何错误，我只能引以为咎。我另要感谢我秀外慧中的太座伊芙，她除了让我不失理智，还帮我做出研究到编辑的一切。另感谢我的经纪人派特森（David
    Paterson）及山德斯（Howard Sanders），还有我的律师席恩尚（George Shemshang）。亨利·霍尔特（Henry Holt）出版公司的编辑哥罗伯（Paul
    Golio）热情又有耐心。感谢「公园坡食品合作社」（Park Slope Food Coop）的耐心宽恕。


    有几位我不能提及，原因在他们嘱咐我不能透露姓名。大家心照不宣。我感谢你们的信任及洞见。


    本书条陈的泄密案调查，若是没有某些人把资讯透露给记者，原因在他们认为大众必须知情，那么没半件能化为现实。他们是全书真正的英雄。其中的代表人物称为某某人。要特别感谢您。


