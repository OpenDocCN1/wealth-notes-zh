    後，OECD的黑名單讓紐埃籍公司的聲譽急速下降，使人提不起半點興趣。美國國會聽證會還直接點名紐埃，說它做俄羅斯生意。接下來在二O一一年一月，紐約銀行（Bank
    of New York）及大通銀行（Chase Manhattan）禁止一切資金轉帳到紐埃。紐埃總理提議，如果OECD會員國真要他的國家停止做離岸生意，那麼該補足該島年度預算的差額。莫馮事務所一年付一百六十萬美元給紐埃，金額占政府歲人的八成。24莫薩克前往紐西蘭，向該國政府保證莫馮在紐埃的業務營運不會害人，但紐西蘭外長拒絕接見他。25


    魏斯特指出，莫馮事務所是離岸生意中的主要參與者，但決定放該事務所一馬。像莫馮事務所這樣的中间商不容易被抓到把柄。真叫魏斯特憂心忡忡的，在於莫馮是律師事務所，他們的活動很可能受到律師與客戶保密特權所庇蔭。美國政府裡有很多人相信，這項特權並未含納法律界人士所做的商業交易，比如組成一間公司。只是，只求無過的國稅局長久以來小心翼翼，不願在法庭上測試這項理論。此外，國稅局要向外國中間商如莫馮取索資訊，想不走漏消息，或者不被告密者爆料，實際上面臨很多法律障礙。


    為了有效起訴離岸避稅天堂，魏斯特的研究鎖定四大課題。第一項與納稅人如何進入離岸世界有關。建好避稅架構，行銷展示，而讓各方能整合起來，居中斡旋的是何許人也？第二，納稅人要怎樣把他的錢轉移出去？跟洗錢一樣，運錢招數可說層出不窮。生意人可以透過巴哈馬或者其他避稅天堂，指揮交易進行，然後不動聲色地把利潤存進離岸銀行帳戶。他們可以假造發票，把錢付給自己，或者同夥，購買從沒發生過的服務。另一種方'
  - '[PAGE 95]


    式是把資產賤賣給自己的離岸公司，不僅轉移錢財，還能沖銷應稅額。第三，魏斯特得證明，該納稅人祕密操控匿名公司、信託及基金會。最後，該納稅人要怎麼把離岸資金弄回國內？現金如果取用不到，就算免稅也沒有好處。魏斯特了解，要享免倒不一定要擁有。任何資產，不管是名車、遊艇還是房地產，其持有權可以放給離岸，再回租給所有人。魏斯特去拜訪馬修森那個被布倫姆及公共電視台曝光的守衛者銀行主腦。馬修森因洗錢、逃稅及詐欺等罪名，被判處很長刑期，他便與政府合作，得免牢獄之災。他向魏斯特說，守衛者銀行提供穩妥的方法，可以撥回離岸資金。那種手法，魏斯特在自已於休雷斯展上取得的小冊子廣告上也曾看過。


    馬修森說，他的銀行會發信用卡給客戶。只要他們在自己帳戶裡有足夠的現金，就能用卡片，在世上任何地方，提領現已免稅的金錢。沒人會過問這些買賣。信用卡連通離岸銀行，是這一行業的標準做法。客戶要莫馮事務所推薦銀行供他們的匿名公司使用時，事務所考量的準則之一，便是信用卡。


    魏斯特倒是找出突破口。信用卡雖是外國銀行簽發，但交易記錄卻通過公司放在美國的伺服器。他拜訪各发卡組織，了解過程如何運作。發卡組織把交易匿名處理後，再儲存起來，有些發卡組織用的格式要比其他來得現代化。例如VISA使用八軌磁帶來存記錄。


    這位國稅局幹員準備好報告，呈給上級，另外提出多種提案來打擊離岸惡行，從查看信用卡，到集中心思對付製造匿名公司的事務所。他的紐澤西上司們挑了第一種：查信用卡。'
  - '[PAGE 96]


    魏斯特接下來鋪陳大膽的行動計畫。他所選擇的戰術，當時國稅局並不常使用，那便是「軼名傳票」（Sub Poë Dôe Summons）。《網絡網路稅收法》（Internet
    Revenue Code）賦予國稅局權力，可以發傳票給第三造，合力偵辦不具名個別人士，而國稅局認為那人值得細查。要說服法官，進行如此模糊的求證，門檻之高可想而知。國稅局必須指出，由其他管道無法輕易取得資訊，另外必須提出充足理由，佐證如此蒐集證據，一定能揪出不法分子。


    魏斯特懷疑，使用離岸信用卡避稅的美國人，只怕有數萬之多。國稅局上司對他說，局裡只能處理五百宗案子。他則把這件事晾在一邊，不想讓上司的不起勁打擊到他的士氣。他把焦點放在三大發卡組織：VISA、萬事達（MasterCard）及美國運通（American
    Express）。後兩家把伺服器放在美國東海岸。在當時，國稅局因地理而分區管理。魏斯特的上司們有意進行，但是要鎖定VISA，他必須取得西岸國稅局的批准。這件事進展緩慢。雖然有延遲，但由紐澤西發動的查稅進行下去。


    二〇〇〇年十月十八日，國稅局向位在邁阿密的美國聯邦地院申請軼名傳票，希望能獲得萬事達及美國運通兩公司索取信用卡記錄。魏斯特及布倫姆提供聲明作書面證詞。國稅局要求三十六國發行的信用卡消費記錄，包括巴拿馬、英屬維京群島及瑞士。法官不到兩星期便批准這項要求。接下來，國稅局把傳票送到發卡組織。過程花了幾個月。公司憂心的是客戶隱私，但資料上不附姓名。公司的律師們主張，相關資訊就算不是完全不可能，也很難提取。但魏斯特已諮詢過發卡組織裡的技術主管：他們說辦得到。'
  - '[PAGE 97]


    隨著這件事緩慢進展，密西根州民主黨籍參議員列文（Carl Levii）繼承羅斯在華府高舉的大旗，當上參議院常設調查小組委員會主席。列文舉辦聽證會，發布報告談私人銀行、逃稅及洗錢。有場聽證會上，列文估計每年因藏匿到離岸世界而損失的稅收達七百億美元27。列文挖苦，要是國稅局能收到哪怕半數的逃稅，就能支付一項處方藥的津貼，「不必調升誰的稅或砍掉誰的預算。」另一項報告中，小組委員會認定，其中十六個避稅天堂已發出執照給大約四千家離岸銀行，而銀行掌控的資產估計為五兆美元28。


    因為小組委員會挖出逃漏稅，列文提出全面的法律修正案。《洗錢防制法》（Money Laundering Abatement Act）29倡議，強迫銀行改變奉行達兩百年的做生意方式。以前客戶怎麼動用自己的錢，大致上是他們自己的事。金融機構必須申報的，只有可疑的活動、大筆現金交易，還有以現金購買流通證券如不記名債券。列文進一步把銀行轉變成監管單位、執法者的幹員。依據列文提出的法案，美國的銀行必須創設出盡職調查的流程，不時監控私人銀行業客戶的帳戶。它們必須辨認出擁有美國銀行帳戶的外國人，聯邦銀行監理單位要求反制洗錢資訊時，它們四十八小時內就必須回應。反對金融監督的共和黨把列文的法案擱置兩年。


    接下來到二〇〇一年九月十一日，劫機者駕機衝向世貿雙塔及美國國防部。當時馮賽卡在盧森堡。聽到九一一新聞後，他從飯店往窗外看，臉色變白。他住的房間可以俯瞰歐洲原子能共同體（European
    Atomic Energy Community），依他看來是恐怖分子最愛的攻擊目標。但他不曉得九一一事件的餘灰會影響到他的生意。'
  - '[PAGE 98]


    雖說恐佈分子的金融活動只占私人銀行業及離岸活動的一小部分，但此時美國聯邦政府更迫切地想洞悉外國人及離岸公司如何使用這套銀行系統。列文的洗錢防制法案，提供範本而變成《愛國者法案》（Patriot
    Act）的第三類，九一一恐攻一個月後就通過。諸多要求之中，有一條便是強迫美國金融機構要執行全面的反洗錢流程。此時，美國一間銀行要與一間外國金融機構做生意之前，要先徹底調查對方老闆的身分。愛國者法案賦予財政部權力，得對銀行頒布更進一步的法規，「了解客戶」（Know
    Your Customer）。而且，該法條提倡的那種國際合作，是小布希政府原先所憎惡的。


    二〇〇二年三月，魏斯特要的特用的信用卡資料終於開始流入了。國稅局長羅索蒂（Chris Rosotti）因這個方案興奮不已。他得意洋洋地對《新聞日報》（Newsday）宣稱，「簡而言之，離岸銀行保證提供的隱密就此消失。要是有人使用這些非法的離岸手段來藏匿收入，我們會把他們揪出來。」


    魏斯特沒能撐到完全參與這項行動。為了參與攻破離岸產業的行動，他暫時離開國稅局的國際公司部門，工作於個別納稅人部門。他奮戰不已，推動該專案，卻讓國稅局官僚體系裡很多人不喜歡他。他一位上司叫他滾回（不是走回）老單位。一等等自己成功推動信用卡專案，魏斯特便調派到研究部門。他的兩位同事接手他的心血，便是特審律師麥杜格（Logan
    McDougall）及國稅局幹員瑞佛斯（Dan Reeves），後者擁有參與資料及洗錢偵辦的經驗。


    羅索蒂局長下令，局裡使用取得的資料，馬上推動三百五十件稽核案。但艱難工作才剛'
  - '[PAGE 99]


    開始。國稅局必須找出個人等非因商業目的使用信用卡的形態。接下來還得去找那些請款所在地的商家，以便取得可疑逃稅人的姓名。這項工作交由管區幹員去做，而他們主要的經驗，是在稽核時翻箱倒櫃。他們的工作經驗裡，沒有創意地思考，雖有訓練課程，但是與這種資料打交道，既陌生又有危險。因為羅索蒂把數量及速度擺在品質之前，最初找到的都是毫無價值的內容，大多是無害的外國信用卡使用者，如交換學生。管區幹員們有配額待完成，當他們覺得找不到好結果，就會避而不再進行下去。


    羅索蒂宣稱打擊離岸避稅天堂已勝利，經證實言之過早。只是，包圍信用卡專案的公關造勢，逼迫數千美國納稅人修正自己的所得，或者為離岸帳戶尋求赦免。光是有被逮獲之虞，便足以嚇阻那些貪婪但膽子小的人。國稅局裡流傳一則笑話，說魏斯特、麥杜格及瑞佛斯讓好多稅務律師大發利市，客戶聘用的律師來拯救他們，以免因為持有離岸財產而處於受罰危機。帛名傳票變成國稅局的重要工具，最後把被藏起來的數十億美元稅收追回美國。


    只是，魏斯特的職業生涯沒能回復。與官僚體系奮戰，使他形銷骨立。他年紀輕輕便退休，對自己成就很自豪，但經驗很苦澀。離開國稅局不久，魏斯特走到自家後院，把自己從信用卡專案蒐集的資料堆起來。他狂笑一陣，再把打火機油倒上文件，點燃火堆。'
  - '[PAGE 100]


