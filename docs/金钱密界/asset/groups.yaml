    自慚形穢。只要外國人是在美國境外賺錢，就沒有必要申報任何財務事項。內華達與國稅局沒有資訊分享協議。州內經濟繁榮，確保基礎建設發達進步。事務所對潛在客戶說，最重要的是，內華達並不被視為離岸中心，因為大家都沒注意到，所以把公司設在當地的客戶，可以讓密等級再升一層。到二〇一三年，委託莫瑪註冊一間內華達公司，手續費約兩千美元，往後年費一千七百七十五美元；莫瑪事務所擁有約三百五十間有在運作的內華達公司。


    艾略特管理公司申請傳票，索取據說跟拜茲有關公司的活動資訊，莫瑪的回應是提供一紙由蒙托亞（Leticia Montoya）簽名的書面證詞，她在那些公司裡，都擔任董事。事實上，月薪約九百美元的蒙托亞是莫瑪最強的名義董事之一，擔任大約一萬千家莫瑪公司的董事。蒙托亞的書面證詞宣稱，那些公司裡，沒半間有回應文件，另外它們也沒在拉斯維加斯方圆一百英里內做任何生意。莫瑪進一步宣稱，ZM
    企業服務有限公司是獨立承包商——獨立存在的單位——並非莫瑪所擁有。辛格的人馬接下來想叫阿穆娜特古伊（Patricia Amuragui）宣誓證供；她出生在智利，曾在賭場工作，經營莫瑪內華達辦事處已逾十年。辛格／艾略特的律師們想調查拜茲的錢如何移動，還有莫瑪與
    ZM 企業服務有限公司之間，確切關係是什麼。法院攻防許久，法官終於准許取證。


    二〇一四年九月十一日，阿穆娜特古伊與辛格的律師藍尼茲基（Dennis Hartzky）坐下來取證七小時。當天隨著時間進展，態勢愈來愈清楚，阿穆娜特古伊一直避重就輕。藍尼茲基透過最初傳票取得阿穆娜特古伊的雇佣契約，巧妙運用，來指出她說詞的荒謬之處。但'
