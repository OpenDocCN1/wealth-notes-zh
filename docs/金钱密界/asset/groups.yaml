    根據巴拿馬公司法，只有巴拿馬律師才能註冊巴拿馬籍公司，但該律師可以代表任何人。一九二七年起，巴拿馬便允許外國人購買該國的匿名公司，而且不必公開老闆或股東的名字。公司也不必申報年度財報。雖說公司必須有董事，而且必須公開名單，但董事們不必然是公司的所有人。註冊的費用極低，而且只要一個星期限就能設立一間公司。外國人買下巴拿馬公司要做何用，政府並不在意；而且只要公司是在巴拿馬境外賺錢，就不必繳稅。巴拿馬一九二七年公司法，讓該國成為世上第一批離岸轄區（offshore
