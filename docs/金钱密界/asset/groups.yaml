    基本概念的運動。其成員有著「自由與繁榮中心」（Center for Freedom）、「保衛自由市場聯盟」（Coalition to Protect Free
    Markets）、「公民力挺徵稅限制」（Citizens for Limited Taxation）等名稱，是資金雄厚團體的大聯盟，它們向莫馮等離岸服務業者請款，支持他們的活動。他們把避稅天堂描繪成自由的堡壘，正受圍攻。為了防止西方政府不停地想追查應稅財富，而侵犯其公民的隱私權，金錢密界正是因應之道。


    有個團體就充當美國自由派、富裕商業利益及離岸世界之間管道，特別有效率，它便是設在佛州的「主權協會」（Sovereign Society）。它表面上是出版機構，負責主辦會議，讓美國人與離岸服務提供者如莫馮搭上線。根據主權協會自己網站，其宗旨在預防「苛稅雜捐、瑣事與訟的劫奪」。任何主權協會招攬給莫馮的新業務，莫馮會撥一〇％佣金給它。按事務所檔案，主權協會至少招到六十九家莫馮公司。


    莫馮的歐文斯經常到主權協會的會議上演講。二〇〇八年在巴拿馬市辦的一場會議，其手冊寫道：「透過一個有八十二年歷史、身經百戰、百分之百免上法院的架構，守住您的財富。
