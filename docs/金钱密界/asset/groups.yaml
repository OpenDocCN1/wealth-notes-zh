    ## 高官們的個人銀行


    莫馮檔案裡有普丁朋友的名字，比如大提琴家羅爾杜金（Sergei Roldugin），他對待這位初出茅廬的情報幹員，就像兄弟一般。他們二十幾歲時，坐在羅爾杜金的拉達車子裡，遊逛列寧格勒街道，聊天、飲酒，偶爾打架。羅爾杜金安排的四人約會，讓普丁遇見後來的妻子，而且他是普丁夫妻第一個孩子的教父，而他擁有多家莫馮公司。阿卡迪與波里斯．羅騰堡（Arkady
    and Boris Rotenberg）兄弟也使用莫馮的公司。他們與兒時玩伴普丁在同一間武術俱樂部練拳。從政府取得的合約，包括索契冬季奧運營造工程，讓兩兄弟變成億萬富豪。他們的莫馮公司充當管道，祕密給付數百萬美元。


    打從普丁任職德國及擔任聖彼得堡政府官員起，便蒐羅其他同夥。莫馮事務所不是這個圈子唯一的離岸服務供應商。俄國總理、後來接任總統的梅德韋捷夫（Dmitry Medvedev）一九九〇年代便與後來成為俄國統治者的普丁，在聖彼得堡同一個市府辦公室併肩工作。梅德韋捷夫有好些不同的離岸服務提供者，他用自己的校友網絡充當人頭，控有基金會及匿名公司。據說這些親信及他們的結構網，輪流代表梅德韋捷夫持有豪宅、遊艇，以及葡萄酒莊。


    據美國財政部表示，設在聖彼得堡的「俄羅斯銀行」(Bank Rossiya) 便是「俄羅斯聯邦高官的個人銀行」，坐鎮與普丁相關的莫馮公司中央。二○○四到二○○八年普丁第二任總統任期內，俄羅斯銀行高層與莫馮有條不紊地造出離岸公司網絡。這些公司的活動遍及全球，設址在英屬維京群島及塞浦路斯等地，銀行帳戶則在瑞士及盧森堡。


    普丁與俄羅斯銀行的關係可回溯到一九九一年七月，當時，他負責剛組成的外事委員會 (Committee for Foreign Liaison) 才一個星期，便指揮列寧格勒市政府參與，跟俄羅斯銀行合資創業。


    當時銀行的所有人是當地共產黨，但情況即將改變。當年年底蘇聯垮台，俄羅斯不再由共產黨統治。


    前格別烏軍官施維茨（Yuri Shvets）在美國國會作證，談到接下來發生的財富爭奪。他說，對格別烏軍官來說，首要之務便是建立新的企業行號，或者滲透進入現有的，銀行也在其內。蘇聯掌控的海外帳戶消失了，再出現時已變成個人財產。他做證：「西方金融系統遭俄羅斯犯罪組織大規模滲透8，就發生在蘇聯崩潰前夕。這場爭奪戰的主要玩家，是前蘇共高官、格別烏領導高層及黑社會老大。這種關係的主要目標，在俄羅斯陷入金融大紊亂之前，敘聚最大的個人財富，建造安全的海外避稅天堂。」


    俄羅斯銀行原屬共產黨的股份，絕大多數轉移給一羣聖彼得堡商人9，其中有物理學家改行成銀行家的克瓦恰克 (Yury Kovalchuk)，以及德國跨國大企業西門子的當地代表人沙瑪羅夫
    (Nikolai Samarov)，後者求學時原本攻讀牙醫。普丁用自己已在政府的權位，幫忙把這些國有資產合法轉移到私人手上。


    俄羅斯銀行的股東們，與他們的政府贊助人普丁，在聖彼得堡的肯索默爾斯科伊湖 (Lake Komsomolskoye) 東岸，共同擁有一個設有大門的社區，建築物都是俄國鄉間大宅。以普丁市府官員的薪水，如何買得起超級豪宅，一直是個謎。這批人替社區住戶辦了一個合作社，名稱就叫「本湖」
    (Ozero)。合作社開了一個共有銀行帳戶，任何成員都可以從中存提金錢，這是在數十年後莫馮檔案中發現的一種可能模式——同一批人透過服務多重利益、多個所有人的公司群而連結起來。


    另一位俄羅斯銀行的早期投資人是佩特羅夫 (Gennady Petrov)。 ${}^{10}$ 執法單位消息人士目前認定他是聖彼得堡犯罪幫派「坦伯夫斯卡亞」
    (Tambovskaya) 的一名頭目。一九九五年，莫馮替美利堅企業服務設立了一間公司，公司董事的名字與佩特羅夫完全相同。目前並不清楚公司所有人就是那個黑幫老大，還有公司接下來三年做了什麼，然後它就消失了。


    「組織犯罪及貪腐舉報專案」（Organized Crime and Corruption Reporting Project）指出，普丁盟友兼克里姆林宮「總統事務部」（Department
    of Presidential Affairs）首長馬留申 (Ivan Magarin)，早在聖彼得堡時代初期，便與佩特羅夫合影做生意。馬留申自己便有一間透過莫馮設立的公司
    ${}^{11}$。佩特羅夫還與普丁的核心圈有關聯，原因是俄國情報界與黑幫合作 ${}^{12}$ 要他們處理法外事務，這種歷史由來已久。類似活動還以網路犯罪持續到今天。


    佩特羅夫不是第一個與莫馮檔案有關聯的俄羅斯黑幫老大。因為黑社會勢力之廣，一度被稱為「老大的老大」的莫古列維奇（Semion Mogilevich），他的黨羽就與莫馮合開多家公司。美國檢方相信，這些公司中的一間「羅絲巴德顧問」（Rosebud
    Consultants）每月給付兩萬美元給那位老大，但原因不明。另外在「兄弟圈」（Brother’s Circle）的檔案裡也找得到。兄弟圈是源自俄國的跨國黑幫，美國財政部相信，它充當多個犯罪網絡的協調組織。


    雖說俄羅斯銀行股東與普丁一九九〇年代就彼此奧援，但等到普丁登上權力頂峰，還有更大財富等著他。一九九六年，普丁的上司索布恰克（Anatoly Sobchak）於聖彼得堡市長敗選，普丁離開彼得堡。乍看是受挫，最後變成轉機。克里姆林宮「總統財產管理理事會」（Presidential
    Property Management Directorate）理事長鮑羅定（Pavel Borodin）網羅普丁當副手。葉爾欽總統治下的俄國，是貧腐吃到飽的自助餐廳，但它還有隨心所欲的媒體把理事會稱為「特權部」，原因是它在葉爾欽的任用網絡裡占有重要角色。


    鮑羅定接下來惹的麻煩，讓他在莫馮的檔案裡值得一提。大約在普丁搬到莫斯科、開始工作的時候，鮑羅定與一間瑞士營造公司簽約，翻新「大克里姆林宮」（Grand Kremlin
    Palace）。接下來還與該公司的姊妹公司簽了更多合約。據瑞士官方估計，大量出現的草率案子衍生出大約三千萬美元的回扣，供鮑羅定可以支配。這筆錢流經慣熟的路徑：一間塞浦路斯空殼公司、日內瓦及盧加諾的銀行帳戶，再加上列支敦斯登及巴拿馬的基金會。


    鮑羅定肯定讓葉爾欽分一杯羹。那家瑞士公司替俄國總統、第一夫人及他們兩個女兒付信用卡帳單。


    有個獨立檢察官斯庫拉托夫（Yury Skuro）著手偵辦這些案子16。儘管在這期間有支持愛錄影帶流出，男主角看來有點像他，但斯庫拉托夫拒絕退縮，所以葉爾欽將他免職。一年前的一九九八年，葉爾欽已提名普丁執掌「聯邦安全局」（Federal
    Security Service），該局繼承格別烏的功能。接下來，普丁對葉爾欽的忠心，讓他取得總理的位置。一九九九年二月三十一日，就在瑞士簽出對鮑羅定的逮捕令之前，葉爾欽辭職，普丁成為代理總統。普丁的第一批總統令當中，包括特赦葉爾欽，還有任命鮑羅定擔任俄羅斯與白俄羅斯聯盟（Union
    of Russia and Belarus）國務卿，這個職位有外交豁免權。莫馮最早意識到鮑羅定是在將近十年後的二〇〇九年，當時事務所發現，一位鮑羅定的銀行家（也是莫馮的客戶）因鮑羅定的案子，遭瑞士法院以洗錢罪名起訴17。銀行家聲稱自己無罪。但莫馮還是從他的公司抽身走人。


    莫薩克對直接跟俄羅斯人做生意，一向小心謹慎。他說：「蘇聯解體之後18，工廠的副理群變成寡頭治理者。這實在不正常——誰都看得出來。」


    美利堅企業服務的高登取笑莫薩克，叫他放輕鬆，冷戰結束了19。不管莫薩克擔心什麼，俄羅斯金錢經由設在避稅天堂的離岸公司、基金會及信託，流入塞浦路斯及瑞士，數量如此巨大，想避開不沾，根本不可能。俄國人透過他們的律師、銀行家大批買下的莫馮公司，就算沒幾千也有幾百家。俄羅斯銀行的網絡，透過以前跟莫馮有關係的瑞士律師，找上這家巴拿馬的律師事務所。


    ## 我想，這件事很微妙


    在司法系統不管用，經濟又搖搖欲墜的俄羅斯，有機會捍衛自己財富的人都那麼做了。


    俄國政府統計，該國一九九九到二○一五年間，嘗到資本淨流出大約五千五百億美元的滋味²⁰，話雖如此，有人懷疑實際金額應該超過一兆美元。要把現金運出俄國，離岸公司是常用的工具。


    有時候，儘管這麼小心謹慎，依然有漏洞可鑽。莫馮就發現，有人想非法篡改一間它在巴拿馬註冊的公司。公司受益人是一位俄羅斯香料進口商。犯罪分子找一位當地律師兼譯者，想非法改動其董事群，從而控制那家公司。莫馮發現陰謀正在進行，於是制止。代表那位俄國進口商與莫馥打交道的奧地利律師表示，他並不吃驚。他寫電子郵件給該事務所：「這樣子取得公司方式很正常，在俄國天天發生。你的公司可能一夜之間就不見了。」


    對於普丁喜歡的人來說，國家是可以合法分贓的。季姆琴科（Gennady Timofeev）早在聖彼得堡時代，就是普丁圈內人。他也是俄羅斯銀行股東。季姆琴科透過石油交易機師賈茨（Gimzo）及國家出資的基礎建設專案，賺了幾十億美元。美國政府進一步斷定，普丁個人有分買沃一杯羹。美國宣布制裁季姆琴科前一天，他就把自己的貢沃持股份賣掉了。


    美國財政部表示，季姆琴科與一問註冊在英屬維京群島的莫馮公司有關聯，公司名叫「南港管理服務有限」（Southport Management Services
    Limited）。它是設在列支䕶登的機構「席郭伊亞特魯漢德信託」（Seygolia Treeland Trusts）所創；該信託獨占一批東歐客戶，另與莫馮擁有密切且賺錢的工作關係。席郭伊亞特魯漢得信託巧妙將公司與基金會整合在一起，確保自己的客戶完全匿名。它跟莫馮至少造了二百二十二家公司，莫馮完全不知道那些公司歸誰所有。雖說莫馮要求全體客戶提供資訊，但席郭伊亞特魯漢得信託硬固拒絕透露自己公司所有人的相關資訊。根據在莫馮檔案裡找到的會議記錄，席郭伊亞特魯漢得信託甚至拒絕簽署莫馮捎給客戶的協議書。記錄宣稱：「他們不肯向我們透露受益人／終端客戶的詳情。²²」


    跟黑箱作業的席郭伊亞特魯漢得信託不一樣，俄羅斯銀行的公司網在莫馮的檔案裡列得清清楚楚。該行一名高層接洽瑞士「狄特利支鮑姆加特納聯合事務所」（Delétre,
    Ramsgatte），想設立一間空殼公司，於是找上莫馮，莫馮便在二〇〇六年三月，於英國維京群島註冊「檀香木大陸」（Sandalwood Continental）。檀香木大陸由俄羅斯商業銀行塞浦路斯分行（RCB）吸錢。俄羅斯外貿銀行有插股
    RCB。RCB 進行可疑的貸款安排，並持續從不尋常的便宜股票交易中得利。除了檀香木大陸，另外創設的四家公司，作為俄羅斯銀行的網絡，它們共參與約一百宗不同的交易。總計起來，它們陳列一長串糖果世界般的祕密利益、酬僱及優惠貸款。


    為了藏匿其交易，設立這套公司網絡的那位俄羅斯銀行高層要求莫馮提供名義董事，供檀香木大陸及其他公司使用。檀香木大陸董事的名字——艾倫·亞歷山大及王，出現在幾十筆貸款及股票交易文件上，至少在理論上提供另一層保密。每份需要名義董事簽名的公司正式文件，都必須通過莫馮的巴拿馬辦事處，在當地它們被歸檔進事務所的檔案庫。


    書面上，檀香木大陸的指定所有人高爾定（Otsg Gould）是位小生意人，他在向RCB申請銀行開戶的文件上自述，擁有在一執法單位工作的經歷。創設檀香木大陸、指揮其活動的俄羅斯銀行高層要找一位比高爾定更清白的人，應該很難。只是對一個不起眼的人如高爾定，竟有管道取用數額驚人的資本。二○○九到二○一二年間，RCB提供檀香木大陸的信用額度高達八億美元。那家銀行提供這一大筆錢，給一位沒沒無聞的人，以及一間生意模式很模糊的公司，任其動用。


    即便是莫馮的巴拿馬合夥人，都注意到檀香木大陸與RCB之間的關係曖昧不明。RCB貸給檀香木大陸的第一批款項當中，有一筆高達一億三百萬美元。這筆貸款的數額，以及環繞貸款周遭的無解問題，叫莫馮人馬心生警戒。貸款文件上沒提到利率要多少、何時歸還、撥款目的是什麼。


    莫薩克用西班牙文寫電子郵件給合夥人：「我想，這件事很微妙。」莫薩克碰到可疑活動時，經常用「微妙」這個詞彙。這個詞彙的功用，好比修辭上的交通號誌黃燈——趁此機會該停下來，重新計算莫馮該索取多少費用，以確保數字與事務所願意承擔的風險一致。


    莫薩克說，如果莫馮的名義董事沒有必要細節，就為這麼大筆金額簽字，事務所碰到來源及終點都可疑的撥款，只怕要親自在場」。若是貸款經證實不妥，事務所不想因此獲罪。佐林格附議，表示事務所沒先取得擔保函，豁免責任，就不該簽字。


    經過催促，指揮那筆貸款的俄羅斯銀行高層才多提供一點細節。這筆款項顯然是用來買油輪的。該高層制定還款時間，補上莫馮要的擔保函。貸款撥出，這不是俄羅斯銀行網絡透過莫馮而釋出的第一筆貸款，而且就莫馮合夥人所知，也不可能是最後一筆。單就這件案子，莫馮光是提供一些簽名，就進賺兩万多美元。未來會再賺錢的幽靈，在莫馮的算計天平上，可能占有一定的分量。合夥人於是對將來的交易打出綠燈，允許莫馮的名義董事簽字批准，讓歐盟銀行把數億美元，轉移給一間匿名公司。


    俄羅斯銀行的公司網絡裡，檀香木大陸充當的角色，是貸款的清算中心，也是信用卡，憑以支付雜七雜八的開支。它令人回想起本湖合作社的銀行帳戶，只是放大很多，依照莫馮檔案顯示，在一九九九年，檀香木大陸簽起的金額約六億美元，而在二〇一〇年至少有三百五十萬美元。這些錢大多流向其他公司製造者提供的公司，而非莫馮的。


    檀香木借出大約七十三萬七千美元，給一間索爾塔瓦拉市（Surat）擁有土地及飯店建築群的公司：索爾塔瓦拉位在景色怡人的拉多加湖（Lago Ladoga）北端。組織犯罪及貪腐舉報專家指出，當地有部分落格認定索爾塔瓦拉市可能有供普丁度假的大宅。幾年之內，檀香木大陸借給俄羅斯「歐鐘」（Orla）公司一千一百三十萬美元，利率為1％。貸款的償還期限，經常長達二十年。貸款的條款另外變更還款貨幣，進一步降低歐鐘必須償還的總值。  香木大陸另外借出五十九萬美元，給地址與歐鐘相同的第二家公司，條件類似，理由是在拉多加湖蓋一間遊艇俱樂部。  俄羅斯銀行的克瓦恰克在收到香木大陸款項的時候，是歐鐘的共同所有人。此時克瓦恰克已成為俄羅斯銀行執行長兼最大股東。幾年後，美國政府把克瓦恰克列為「普丁帳房」之一。  檀香木大陸開始貸款給歐鐘一年後，克瓦恰克的公司在本湖合作社區不遠處，買下一大塊山坡地。歐鐘在當地蓋了「伊果拉」（Igora）滑雪度假區，據說目前成為普丁最愛的滑雪勝地之一。有間鄉區大宅矗立於當地，當地人宣稱它專供國家領袖使用。二〇一三年，滑雪勝地在森嚴戒備下，主辦普丁二女兒卡捷琳娜（Katerina
    Tikonova）嫁給基里爾·沙瑪羅夫（Kirill Samatov）的婚禮；基里爾的老爸尼可萊·沙瑪羅夫便是前西門子代表、俄羅斯銀行的大股東兼本湖合作社成員。


    ## 普丁好友


    二〇〇七年，也是創設檀香木大陸一年之後，俄羅斯銀行高層開辦另一間公司「海外鈴鐘」（Somette Overseas）。它的所有人比高爾確定更不可思議。書面上，公司歸普丁的好友、大提琴家羅爾杜金所有。羅爾杜金寬顱闊面，經常留著內捲式髮型，他在訪談中扮演優雅的對話人，讓普丁顯得人性化。設立海外鈴鐘一年後，俄羅斯銀行又另組一問公司叫「海外國際媒體」（International
    Media Overseas）。表面上第二間公司也歸羅爾杜金所有。對一個自稱音樂家、沒有经商經驗的人來說，他的公司展現出不可思議的獲利能力，能指導複雜的企業交易。


    神祕的付款由多重管道理進羅爾杜金的公司，包括股票交易。二〇一〇年，國際媒體公司答應購入俄羅斯科技公司「俄羅斯石油公司」（Rosneft）股票。另一問與莫馮無關的巴拿馬匿名公司則擔任交易的賣方。交易細節裡有項條款，表明本交易若未能順利完成，羅爾杜金的公司可取得約七十五萬美元的賠款。兩份交易文件同日出爐。第一份完成股票交易。第二份則取消第一份，因此啟動未成交條款，保證讓羅爾杜金的公司能收到橫財。如此這般，一筆說不通的付款，就能做到看似名正言順。


    另一項安排，對象是與一問開曼島匿名公司，內容涉及交換數量相同的俄羅斯軍火企業「俄羅斯國家技術集團」（Rosco）股票。因為數額相同，相互抵消，所以實際上沒有該集團的股票易手。接下來便交換協議在較早的日期生效，而開曼島匿名公司的股票在協議生效日期的價格，比真正簽署協議的時間還要更低，因此必須付差額給國際媒體公司。二〇一一年，一系列這種交易讓海外國際媒體進賺四十六萬三千八百美元。可疑的交易變得合法，檀香木大陸也做類似交易，二〇〇八到二〇一一年間至少獲利四百萬美元。


    羅爾杜金的海外鈴聲公司野心甚至更大。它加入一個集團，進行祕密又複雜的計畫，打算控制俄羅斯最大卡車製造廠卡瑪斯（Kamaz）。莫馮檔案裡有幾份協議書，顯示公司持股比例及義務有所交換。這頂交易如果成功，大提琴家就可取得發言權，干預企業計畫、預算及外國投資人在卡瑪斯的角色。後來因為二〇〇八年金融海嘯，這筆交易未能實現。


    雖說他的公司那麼複雜，羅爾杜金對自己的商業利益，卻展現令人稱奇的放任態度。俄羅斯銀行的高層寫電子郵件向莫馮抱怨說：「我們有時候很難掌握國際媒體等公司（受益人）而取得他的簽名。」他建議迂迴繞過這個問題。羅爾杜金授權給另外一個人簽署文件；這樣子就不必去打擾那位音樂家。


    二〇〇八年，普丁卸下總統職。俄羅斯憲法規定總統不得連任兩期以上，於是他與自己的總理梅德韋捷夫換位子。這樣交換職銜不減普丁的權威。普丁二〇〇八到二〇一二年當總理期間，俄羅斯銀行的資產負債表規模增大一倍以上，由四十億美元到超過八十億美元。與莫馮合建的離岸網絡也高速運轉。


    普丁改當總理以前，俄羅斯銀行積極收購媒體。它買下電視網的擁有權，普丁接著把該電視網變成全國播送業者。俄羅斯銀行還拿下RBC-TV，這間電視公司談論理想的新聞報導，在老老闆擠壓下結束。俄羅斯銀行另外公開自己掌控最大廣告商「國際影視集團」（Video
    International）一六％股份；海外國際媒體也持有該公司股份達一二·五％，據莫馮檔案裡找到的一張銀行帳戶表格，權值大約一年可分一千萬美元股息給羅爾杜金。25


    俄羅斯銀行公司網絡的離岸活動，很多都以塞浦路斯為焦點。塞浦路斯是通往歐盟的門戶，國家如此腐敗，以至於購買空殼公司，還附贈一個已經開好的銀行帳戶，什麼都不過問。多年來，俄國有錢人早聚集到該島的銀行。檀香木大陸的「撲滿」銀行RCB設址也在當地。只是在二〇二二年，塞浦路斯陷入金融危機。隨著該島國槓桿操作過度的金融機構坍倒，無力償債，俄羅斯銀行高層們開始把自己的公司，搬到其他離岸轄區，找別的離岸服務供應者。這麼做的不止他們。這段期間，隨著俄國人逃離塞浦路斯，俄羅斯人對英屬維京島的直接投資增加八倍。26


