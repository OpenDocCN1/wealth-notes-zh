  - '[PAGE 319]


    他15。他乾脆不自己做房地產開發，而專心在做的銷售他的品牌，從國外賺取營收。此時，他授權「招牌式」、有他姓名的開發案，完全按他規格去蓋。飯店酒店方面，川普集團經常以收受一定百分比的營收，來管理物業。美國以外的生財之道，使他變得愈來愈不在乎其來源。


    二〇一六年選舉之後，川普糾葛不清的外國生意，升級為國家安全及憲法在意的事。他的生意夥伴希望以新的方式，從自己與美國總統的關係中獲利16，因此要判定川普政府的施政，是爲了大眾利益還是營逐私利，變得愈來愈困難。同一時間，白宮與共和黨主宰的國會結盟，推動新的金錢密界政策方針，更能反映他們共同的放任意識型態。


    歐巴馬在任八年內，政府試圖把政策往更透明、監督離岸系統的方向移動。除了簽署二〇一〇年《外國帳戶合規法案》，政府試圖加緊管看管好比德拉瓦、內華達、懷俄明各州；它們兜售自己當安全港，提供鐵了心想逃稅、進行犯罪活動的外國人使用。


    遭逢律師、銀行家及州方官員激烈反對，歐巴馬政府改採細碎步驟，來對抗這項難題。它先通過試行方案，強迫邁阿密及紐約房地產仲介申報17，那些匿名公司用現金購買房地產，真正的受益人是誰，話雖如此，法規只要求那些擁有房地產業利益達二五％或以上的姓名。財政部二〇一七年擴大這項施政。國稅局另頒布一條規則，要求設在美國的外國人擁有的責任有限公司，都取得「職工識別號碼」（Employee
    Identification Number）（相當於企業的社會安全號碼，對收稅有其必要）18，還要記帳寫記錄以備稽核，指定能控制公司的一負'
  - '[PAGE 320]


    責人】(Responsible Person)。


    最重要的是歐巴馬政府向美國富人加稅。川普及共和黨把加稅，尤其是富人稅，視為政府搶錢法令，只要有可能，必加以鏟除。國稅局堪比對抗美國富人透過金錢密界逃稅的前線部隊，卻資源短絀，歐巴馬治下，花費心血想替它增加款項，但面臨共和黨的抵抗，所以一事無成。打蒼戰期間，川普自稱自讚，唆使盡全力逃避繳稅。希拉蕊譴責他長年來避而不繳聯邦稅，川普的回應是：「這顯示我聰明。」


    川普上任幾星期，新總統及共和黨把持的國會就示意要終結歐巴馬對金錢密界的方針。國會在第一批重大投票中，廢止一項反貪腐施政。


    該法條原本強迫石油、天然氣及礦業公司，要向美國證券交易委員會做年度申報，詳述它們在有生意往來的國家，付給外國政府的款項。立法原旨在減少賄賂，它被廢除，對採礦業真是大禮，而採礦業透過數百萬獻金，幫忙共和黨競選。廢除那條規定，讓幾個川普的外國生意夥伴也受益，他們大力投資在石油及採礦產業。


    川普反對官方打擊行賄外國的種種行動，早已記錄在案。二〇一二年，在消費者新聞與商業頻道(CNBC)一場Call-in節目上，他把《海外反貪汙行為法》(Foreign
    CorruptPractices Act)稱為「大爛法」而應予變更；該法強制美國公司調查跟自己做生意的人，以確保公司沒參與、協助非法活動。川普說：「其他國家前往那些地方，都做應該要做的事。川普普說，假如美國公司避而不行賄，「那麼到處都別想做生意。"'
