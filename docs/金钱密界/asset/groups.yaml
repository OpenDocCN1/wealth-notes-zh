    前往。當然，納瑪德家族也到場。


    有好好讀裝釘精美的岡茲拍品目錄的人，或許會讀到精美圖文當中，潛藏一句聲明，寫道：「佳士得在這次拍賣所有物件，有直接利益關係。」


    這句聲明讓人疑惑。佳士得利益的本質並沒說明白。讓人曉得那些畫作已歸路易士所有，而非岡茲家族，是否會減損大家對這次拍賣的熱情，現在已經無從得知了。


    等到競標《阿爾及爾女人》系列畫作最重要的《〇版本》（Version O）的時候，隨著標金愈升高，群衆倒抽一口氣的聲音清晰可聞。拍賣槌落下的時候，該畫作售價為創記錄的三千一百九十萬美元。買方是位倫敦經紀商，據說是代表一位富有的中東客戶買下的。四十年前，維克多及莎莉・岡茲夫妻買下那幅畫的時候，才付七千美元。


    當晚，大衛・納瑪德買下《阿爾及爾女人》的《H 版本》（Version H）。那次拍賣總售價高達兩億六百五十萬美元。


    ## 八十三幅大師畫作下落不明


    二〇〇四年，一位紐約藝術品經紀商的代理人與莫馮簽約，要事務所到巴拿馬公共註冊局進行「緊急」企業搜尋，對象是「威爾頓貿易公司」（Wilton Trading
    S.A.），一間不是莫馮代為註冊的公司。他們要求取得全部歷史資料，尤其是一九八五年到一九九三年那段時間。莫馮花一天就完成那項工作，索費一百十美元。事務所不想讓自己與真正想索取資料的人，紐約的藝廊老闆喬魏奇（Ess
    K. Coway）有瓜葛，也不想知道他為什麼要那些資訊。


    喬魏奇想徹底查清，價值約三十億美元的八十三件畫作，為什麼會不翼而飛。如果能找回來，他可以賺上不少錢。喬魏奇不曉得的是，他的代理人去找莫馮的時候，他要找的答案，有些便在另一個莫馮客戶的公司檔裡頭。


    跟據莫馮替喬魏奇找出來的資訊：威爾頓貿易創設於一九八一年，但要到十六年後才設立董事會。該公司最重大事件發生在創設四年後，沒經過董事會。當時公司還不是登記於巴拿馬。一九八五年，據說希臘船運大亨巴席爾．古蘭德里斯（Basil
    Gourdanis）把他所有八十三幅大師畫作的收藏品——包括雷諾瓦、梵谷、馬蒂斯及畢卡索的——以低到可笑的總價三千一百七十萬美元，賣給威爾頓貿易。這位大亨的侄子彼得．古蘭德里斯（Peter
    Gourdanis）表示，他叔叔會出售那批畫作，是因為急需現金。威爾頓貿易的所有人瑪麗亞．古蘭德里斯（Maria Gourdanis）是被得的母親，現已去世。


    那起交易最令人難以理解的原因，在於只要出脫其中幾幅畫作，顯然就可以賣得這位希臘船運大亨所需要的現金。另外始終沒有任何證據，佐證有買賣往來。喬魏奇質疑那宗交易是否真有發生。


    雖然據說那八十三幅畫作已經脫手，但巴席爾與其妻子葉莉絲（Elise）的財產裡仍有那些藝術品，甚至借展給博物館，還賣了幾幅給經紀商，而陳列的藝術品來源彷彿它們依然屬於那夫妻倆。巴席爾於一九九四年去世之後，葉莉絲獲通知，說畫已賣給威爾頓，據說她也信服，認為應該遵守交易，只求換得部分畫作。二〇〇〇年她過世，並沒有子女。一年之後，她的侄女翟米絲（Apsara
    Zanns）控告葉莉絲的遺囑執行人，認為她該分得那八十三幅畫的一部分。據《華爾街日報》報導，幾年後，喬魏奇決定提供財務支援²⁵，幫翟米絲打官司，以交換任何取回的畫作，翟米絲選擇出售時，他有權第一個买下。


    喬魏奇最大疑問之一，是那些畫作現在哪裡？他懷疑它們是被鎖藏在某地的自由港。大約在他的團隊開始火速調查威爾頓貿易的同一時間，其中幾幅畫作出現在市場上。


    物主總是莫馮設立的匿名公司，通常設在英屬維京群島。「特萊康尼歐控股」（Triconio Holdings）在富比士倫敦分公司拍賣會出售波納爾（Pierre
    Bonnard）作品《浴室內》（Dans le cabinet de toilette）。「赫樂迪亞控股」（Heredia Holdings）也同意透過蘇富比出售夏卡爾的《藍色小提琴家》（Le
    violoniste bleu）交付拍賣。還有私下交易的，是「傑可布投資組合公司」（Jacob Portfolio Incorporated）做的，它把梵谷一八八一年一籃子柳橙的靜物畫寄給加州一間直銷公司老闆，得款兩千萬美元。


    喬魏奇把這些買賣都瞧在眼裡。他曉得這些畫曾歸巴席爾及葉莉絲所有，只是不曉得誰在賣它們。莫馮的檔案都指出，上述公司的所有人，都是希臘名媛、暱稱「多姐」（Doda）的沃麗迪斯（Marie
    Vodla），巴席爾的妹妹。要到巴拿馬文件公布，喬魏奇才能證明那個家族的親緣關係。


    ## 別讓愛爭財產的親戚發現


    高更一九九二年在毛利島繪下《從前》(Mata Mua)，當地語的意思是「古時候」。這幅色彩豐富的油畫描繪著一處山巒周遭的風景，裸肩的棕色女子沿著一個巨大的藍色神像跳舞，神像為月亮女神。據馬德里市提森-波涅米薩博博物館（Tyzsen-Bornemisaiza
    Museum）描述，畫作內容為「敬輓消失的黃金時代」$^{27}$，《從前》目前展示於該館。


    那幅畫作現在是由暱稱「蒂坦」（Tia）的卡門·提森-波涅米薩（Carmen Tyssen- Bornemisaiza）借給博物館展覽的；她是西班牙前選美皇后，繼承祖上豐厚遺產，個人藝術品收藏大約七百名名畫，價值逾五億美元。她已過世的丈夫提森-波涅米薩男爵（Baron
    Hans Heirich von Tyssen Bornemisaiza）是世界上藏品最多的藏家之一。他還善加使用避稅及離岸隱密的黃金時代，這項遺產，碰到祕密外洩及加強管制的現在，他的遺孀想要維持就頗為費力。


    男爵出生在荷蘭，但祖先及財富都來自德國。他的貴族頭銜是匈牙利給的。他有瑞士公民權，但為了稅務理由住在摩納哥。還在世的時候，他情牽盧加諾，在當地他擁有法沃利塔別墅（Villa
    Favolita），一棟十八世紀的豪宅，裡頭放了千餘幅畫作$^{28}$。他妻子的律師向西班牙《機密報》（El Confidencial）透露，男爵的收藏直到被轉移給家族基金會之前，本來分屬三十到四十間公司²⁹。


    這樣的離岸架構，讓男爵夫婦得以節稅數百萬美元。


    一九九三年，西班牙蓋了間博物館以儲存那批藝術品之後，男爵把七百七十五幅畫賣給西班牙政府，大約是他收藏品的一半。一開始他想要捐贈，但後來向西班牙要了三億五千萬美元的作品價欒，但還是比市價低了很多。翌年起，男爵夫人開始自己收藏，透過離岸公司隱藏自己的購畫行動，如同她的丈夫³⁰。


    賣畫給西班牙一年之後，男爵夫人創設「瑙蒂蒂斯信託人有限公司」（Nautilus Trustee Limited）及「薩加索信託人有限公司」（Sagasoso
    Trustees Limited）。兩家公司設址都在南太平洋偏遠避稅天堂的庫克群島。公司係透過不記名股票持有。接下來七年當中，它們在蘇富比及佳士得等拍賣公司購畫，再把藝術品分散到全世界。據她的律師表示，這個企業架構存心設計得晦澀複雜，把這些畫作藏起來，不讓男爵愛爭產的家族發現。男爵結婚多次，育有子女四名，還收養蒂妲的私生子波哈（Boha）。


    二〇〇二年，男爵去世。遺囑認證既紊亂又神祕。一年之後，庫克群島規定，所有不記名股票都得由經註冊的代理人保管。替男爵夫人做事的律師們有找尋，但那些不記名股票遍尋不得。到最後只好發行新的。依新的股東安排，她與波哈平分公司。但這項安排，隨著波哈宣布，自己的女友已經懷孕，男爵夫人斬斷與他的聯繫³¹，而變得棘手起來。


    男爵至少有一間公司「康奈利拉」（Cornelia Company），是由莫馮註冊的。一九九〇年代初期，康奈利拉向德國私人銀行「柏林商業法蘭克福銀行」（Berliner
    Handels- und Frankfurter）申請一筆短期貸款，拿《從前》及英國畫家康斯特勃（John Constable）的畫作《水閘》（The Lock）當抵押品。該筆貸款於一九九三年撥發。代表男爵操作該公司的信託代人變更註冊代理人之後，公司就離開莫馮。


    男爵夫人雖被一間瑞士雜誌拼為全瑞士第七富女性，財產總值超過十億美元，然而她抱怨說，自己的現金都綁死在畫作上了。32 二〇一二年，她決定賣掉《水閘》。她有沒有賣掉《從前》，令人生疑，原因在這幅畫是她的最愛之一，而且她的一艘遊艇以它命名。


    康斯特勃的畫作賣到三四百萬美元，33 成為同類型中售出價格最高的畫作之一。它是透過男爵夫人擁有、設在開曼群島的離岸公司「歐米克薩收藏品有限」（Omixon
    Collections Limited）而出售的。後來，她兒子波哈想刺破該公司的法人的外殼，宣稱男爵給他一兩《戈雅與賈坎多》（Goya and Guarando），估價在九百萬美元，也由該公司控有。波哈官司打輸了，男爵夫人建造的離岸藝術碉堡仍然完好無損。


    ## 現代版維京海盜：冰島破產危機


    二〇〇九年三月，冰島一家電視台邀請法國前法官兼反貪腐鬥士伊娃·喬里（Eva Joly）上週日談話節目，談論冰島的危險處境。四個月前冰島面臨金融危機，是二〇〇八年金融海嘯最早的受害者之一。前三大銀行的資產總額達國內生產毛額的十倍1。國債總額使得冰島這個小島國的每個國民都背負四十三千美元程度的負債2，資本流動性極低，冰島貨幣克朗價值劇貶。一夜之間，冰島人民無法償還貸款，島國必須的進口品價格格飆。窮困、迷惘又生氣，冰島人民來到首都雷克雅未克街頭，想找到怪罪對象。


    出生在挪威的喬里長久以來敬重堅毅的冰島人。儘管幾百年來冰島人作為貧窮的漁民，與惡劣的生活環境搏鬥，但就保留維京人文化方面，冰島要比挪威做得更好。喬里獨自回到挪威，在此之前，他在法國偵辦億而富（Elf）石油公司，這間公司陷入醜聞而成為貪腐、行賄、與洗錢網絡的中心。多年審訊下來，法國大眾對這起醜聞，以及承審本案奮戰不已的法官，已經厭倦了。二〇〇二年，她受挪威司法部的邀請，在「國際開發署」（Agency
    for International Development）擔任特別顧問3，參與組織對抗全球貪腐的行動。


    喬里接受冰島談話節目邀請，在節目上譴責那些她認為導致冰島財政崩潰的非法活動。在她受訪幾小時當中，有一則臉書貼文希望她能參與冰島政府這次危機的調查行動，這則貼文被按讚數百次。喬里上完節目隔天，冰島司法部長找到她，請求她的幫助。喬里心想，冰島夠小，一個人也可以找出真相，於是答應幫忙。


    在檢察總長因自己的兒子身為某銀行高層，而自請避嫌後，冰島國會創設特別檢察官辦公室，追捕不法。當冰島政府宣傳這個檢察官職務時，總人口三十二萬的冰島全國，只有豪克森（Otahur
    Haukesson）一人挺身而出。


    豪克森寬頭闊面，言談樸素，身材魁梧如橡樹，在冰島西岸的小港鎮阿克拉內斯（Akranes）擔任地區司法行政長官十年；當地離雷克雅未克約十二英里（約十九公里）。地區司法行政長官的職務，身兼警長、收稅官員及海關官員於一身。即便職責這麼重，豪克森還是能找到時間釣魚。他說，自己答應接下特別檢察官一職，原因在金融危機規模之大，要有人因應。5
    豪克森不曉得接下來會怎樣，但估計自己大約過兩年就可回返舊職。


    八年後，豪克森還在當時特別檢察官。喬里除了提供辦案方向，還成功爭取經費。豪克森工作的一開始，辦公室空盪，募儉團隊只有四人：一名法學教授、兩位警方調查員及一位司法部派來的律師。全盛期工作人員劇增為一百二十名雇員、十位承包商。如同喬里所質疑的，團隊發現廣泛的非法行為，是一群銀行界內線人士所做，尤其在財政大崩盤之前。特別檢察官調查兩百件個案，將三十起案件提交法庭。偵辦過程中，豪克森及其團隊深入全球金融界的暗巷，由冰島到盧森堡，再到更遠。縱觀一切，有一間法律事務所的名字一再出現
    莫薩克·馮賽卡。


    豪克森從沒把莫馮當成標靶——他全神貫注於冰島的不法案情。只是，他注意到那些冰島現代版的強盜大亨、被媒體討為「維京打劫人」（Viking Raids）的人，都透過莫馮創辦了幾百家匿名公司。在豪克森挖掘出來自買自賣、操控市場的案件中，這些匿名公司占有關鍵角色，每一間公司都代表一層保密結構。


    豪克森很不情願，但仍帶尊敬地說，莫馮「是一台運作良好的機器。」


    ### 冰島銀行的詐欺行爲


    冰島政商名流們在一九九〇年代末期開始把國家銀行民營化時，應該沒想到下場會如此淒慘。當時冰島財政部長哈爾德（Geir Haarde）趁著二〇〇二年出售大銀行「國民銀行」（Landbanki）之便，預祝未來光明。他完全相信市場效率那一派的理論，哈爾德引述美國前總統雷根的話：「政府無法解決我們的問題，政府本身就是問題。」接下來，他把保管三分之一的冰島人民存款的國民銀行
    6，送到私人手上。


    冰島克朗幣強勢，投資資本容易到手，二〇〇〇年代初期冰島充斥著廉價資金。美國股市在二〇〇三到二〇〇四年間漲了一倍，但冰島股市增長九倍。冰島銀行的股票特別搶手。


    原本昏昏欲睡的漁民之島，開始大量入人為出過日子。冰島人民貸款進行全國購物大狂歡，由漁船、汽車到房子，什麼都搶著買。冰島最大銀行「克伊普辛」（Kaupthing）盧森堡分行行員回溯這股狂熱的日子到二○○三年夏天，當時他注意到，冰島人開嶄新的法拉利跑車來銀行。


    盧森堡是冰島通往全世界的門戶。新近民營化的銀行全都有分行在當地營運。那些盧森堡分行幫股東們創設離岸公司，用來買賣資產及銀行股。一旦離岸後，冰島的稅務及銀行監管機構就查不到那些交易了。


    盧森堡辦事處是莫馮生意最繁忙的辦事處之一，絕非巧合，經銷商是優斯特及安娜貝拉．德克斯（Lou and Angelola Dos）夫妻檔。優斯特高而英俊，是德國人，出身體育界。他妻子是巴拿馬人，嬌小、聰穎、更多智、金融服務業資歷更久，曾在美林證券當過股票經紀人。她自學生時代就認識賽卡，而且跟她某位前妻是密友。一九九六年，德克斯夫婦說服莫薩克及馮賽卡，把盧森堡經銷權賣給他們，這件事大致上是事後之明，當時莫馮盧森堡授權經銷商已不再招攬客戶。事務所合夥人心想，反正也沒什麼可損失的，就同意把莫薩克．馮賽卡盧森堡公司五百股，以每股一美元的價格賣給德克斯夫婦，條件則是分公司如要出售，只能賣回給莫馮。


    優斯特與安娜貝拉分工。優斯特專注於服務面，大力仰仗往日情懷的風格來提振業務，討客戶歡喜。安娜貝拉是兩人中更堅毅、懂得世故的，她讓後勤作業順利，打點年費續約。


    相形她丈夫，安娜貝拉的名字鮮少出現在通訊或文件上，但他們合力，把盧森堡辦事處轉變成莫馮事務所最賺錢的分支機構之一，而業績很多得自冰島人。


    到了二〇〇四年，光是國民銀行一年就跟莫馮盧森堡辦事處合造一百多家公司。父子黨布約高爾福·古德蒙森（Bjorgolfr Guttormsson）及布約高爾福·索爾（Bjorgolfr
    Thorbjornsson）買下國民銀行多數股。兒子索爾一九九〇年代在俄羅斯聖彼得堡開一閒酒廠，賺到人生第一桶金。也是在聖彼得堡，索爾了解，結合少量資本與大量貸款，可以把個人的期初財富放大多倍。索爾這個名字也指北歐雷電之神，於是他把揮鋮之神的形象化為布約高爾福企業的商標，但他與父親真正崇拜的，是財務槓桿操作之神。父子兩人完全具備當時冰島人在全球金融橫衝直撞的情況——過於自信，實力又不夠。


    二〇〇四年九月，國民銀行向盧森堡分行來找優斯特·德克斯，提出非比尋常的建議。該行一般購買莫馮的名義董事服務，供它買下的巴拿馬及英國維京群島空殼公司所用。書面上的公司高層會把代理權授予國民銀行客戶，或者提供簽名，以敲定貸款及保證履約。這些交易經常涉及幾千萬美元。莫馮經常要求免責擔保函，如此他們要是碰到交易失敗，能免遭殃及。事務所合夥人以此方式，希望能免除一切因掛名董事而可能引起的麻煩難題。


    國民銀行當時生意做得很大，所以想讓流程更順利。該行向德克斯洽詢，是否能簽空白擔保函——「更順暢的解決方案」——來涵蓋未來與莫馮的一切交易及創設公司。德克斯寫信給巴拿馬事務所合夥人轉述此一要求時表示：「這麼做，我們可以提供更快的服務，也不必讓案子延遲幾星期或幾個月，只為等待擔保函簽字寄來。倒也不是說他們不願把這類保函都寄給我們公司，只是每一次，他們必須取得委託人的同意甚或簽字，這種狀況讓他們及我等全體都感困擾。」


    德克斯請事務所安心，說在它的記錄裡，國民銀行對全部受益人都做全套的盡職調查。他另外指出，盧森堡銀行監管官員有在監督該行。按此安排，莫馮會失去監督其名義董事們到底授權什麼行動的機會。只是，合夥人原則上同意這項建議。他們樂得把盡職調查的責任交卸給別人，尤其是銀行，條件是它不會令事務所涉險就行。


    莫馮把擔保函草稿寄給國民銀行評估。銀行把一段得保證其客戶可信賴、有財力的篇幅除掉，還添加文句：依莫馮董事給與代理權下，受益所有人採取的行動得豁免責任。換句話說，一旦公司有在營運，國民銀行要受益人造出來的任何麻煩，停留在莫馮的名義董事群及空殼公司裡，不關銀行的事。這樣子當然把擔保函的本意給否定掉。


    當一位莫馮的低階律師收到變更後的草稿，她立刻拒絕。馮賽卡指示她與德克斯及國民銀行磋商。雙方你來我往幾乎兩年，才達成協議。二〇〇六年三月，國民銀行終於接受莫馮最初的草稿。雙方同意，任何源自擔保的爭執，提交國際仲裁處理。


    到此時節，國民銀行應該是急著想解決這件事了。一個月前，也就是二〇〇六年二月，信用評級公司惠譽（Fitch Group）降低了冰島的主權信譽評級，聲稱它「無法持續」¹⁰。惠譽強調，會把該島國金融部門拖垮的理由一應俱全──信貸成長太過、赤字龐大、債務過多。只是，雖有惠譽的預測，冰島揮金如土的生活方式還是再撐了兩年多。惠譽真沒想到冰島的前幾大銀行居然串通起來，以犯罪共謀的方式，讓冰島金融機器持續運作。因為莫馮的公司，是這項陰謀的關鍵成分，所以對國民銀行來說，不能回去找莫馮事務所，為每一項有疑慮的交易擔保函簽字，自然比較好。


    豪克森講述一件軼事，它足可概括本時期那些大銀行玩的把戲。克伊普辛銀行在二〇〇六年時的工作內容很簡單。每天早晨起床，到瑞典股市買自家銀行股。克伊普辛銀行回購自己股票，刻意把股價維持在高檔，保持這部金錢機器能運轉，股東依然閒綽，銀行家持續放款收取費用。直到有一天，那位年輕銀行員睡過頭了。他沒按時購買，股價在幾個鐘頭內大跌四％，而股市想找出克伊普辛銀行的適當價位，非常困難。


    金融海嘯的前一年，國民銀行與莫馮合創了八十多家公司。這些公司裡，很多遭銀行股東及高層用來自我，方法是透過一些貌似欣欣向榮的交易。光是在二〇〇八年前六個月，國民銀行就借給自己董事會成員四百億克朗（大約五億六千兩百萬美元）”。外觀上，民眾能看到的，全是一些位在英屬維京群島及巴拿馬的公司取得貸款，買賣股票及資產。這對全世界來說，顯然是完全合法的市場活動。


    舉個例子，有位藥師的遺孀跟她兩個兒子，持有一間布約高爾福父子已購下的製藥公司很多股份。那家人透過國民銀行盧森堡分行，與莫馮合創八家離岸公司。這些公司接下來向國民銀行貸款幾百萬美元，用來購買索爾跟他父親擁有的其他資產。雖說因為把風險全集中在同一間公司，這種內線交易被視為危險又愚笨的理財方式，不過不必然構成犯罪。但國民銀行執行長阿爾納森（Staton
    Aranson）設想出來的一套計畫，就不適用同樣說法了。


    二○○七年，國民銀行設立兩家巴拿馬籍公司（其中一間透過莫灣註冊），並收到國民銀行借貸給公司的數千萬美元。阿爾納森協調這些貸款，以便這些公司能購買國民銀行的股票，設局拉抬國民銀行股價。


    克伊普辛銀行也做同樣的事，而且規模大得多。在二〇〇八年九月，冰島財政崩潰前一個月，克伊普辛銀行有項重大宣示。來自卡達的投資人、阿勒薩尼（Mohammed bin
    Khalifa al-Sani）大公打算買下該行股份達五．一%。當時國際放貸嚴重受限，而克伊普辛銀行這家金融機構的償債能力備受質疑，阿勒薩尼大公此舉對克伊普辛銀行展現非凡的信心。購股百分比絕非巧合，只要超過五%就得公告。這次購股讓克伊普辛銀行執行長西古德松（Hrafur
    Nyr Sigurdsson）好友的阿勒薩尼成為該行第三大股東。西古德松及該行第二大股東上電視宣稱，這項投資顯示出該行健全，持續成長；阿勒薩尼的購股就是證據。


    但是在幕後，由克伊普辛銀行盧薩堡分行造出來的一堆莫灣公司卻講述截然不同的故事。二〇〇八年七月，優斯特·德克斯把一間設在英屬維京群島的「布魯克斯貿易」（Brooks
    Trading），賣給代表克伊普辛銀行的另一位中間人。布魯克斯貿易很快就向克伊普辛銀行開了帳戶。布魯克斯的藏鏡人老闆，是一家莫灣公司，而該公司則為阿勒薩尼所控制。二〇〇八年九月十九日，克伊普辛銀行把五千萬美元放進布魯克斯的帳戶裡。那筆貸款

