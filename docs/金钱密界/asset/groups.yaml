    深入了解英屬維京群島的公司法。馮賽卡叫計程車司機載他去市中心。路程很短。計程車讓他在一條狹窄的雨綠道下車。雞與山羊漫步在鵝卵石上。街道兩旁是簡陋的木屋。


    一九八六年，全英屬維京群島只有一萬二三千多人——大約九千人住在托爾托拉。¹⁸小島上，親戚關係凝結穩如磐石。英屬維京群島上，聰明人絕不講鄰居的壞話，以免反噬到自已。羅德城的人際關係很緊密，總用狐疑的眼光看人，因此馮賽卡必須找到方法，以贏得當地人的信任。一旦他們嘗到跟莫薩克·馮賽卡合作的好處，信賴就隨之到來。


    避稅天堂是凝聚力很強的社會。居地主導的是金融服務業。當地政商名流跟著現金行動，不是直接加入金融服務產業，就是以其他方式提供服務。商業利益與政治建制交纏起來。一旦產業屹立，原已存在於小型、孤絕社區的社會控制力，就代表該產業而啟動。當地人接受一定程度的貪腐，只為保持金錢不斷流入的好處。抗拒的人被嚇得默不作聲、遭到排斥，如果他們一直抗拒，有時會被拘禁，或是被趕出故鄉。


    英屬維京群島隸屬英國的避稅天堂系統。這些大英帝國過去的領土，除了英屬維京群島，還有開曼群島、百慕達、海峽群島、土克凱可群島。相去更遠但同屬避稅天堂家族的前英國屬地還有巴哈馬群島、貝里斯、塞浦路斯、新加坡及塞席爾。


    這些離岸轄區當中，最古老又受敬重之一便是諾曼地外海、英倫海峽裡的澤西島(⁵⁹⁰)，從倫敦搭機前往當地不到一個小時。莫薩克還記得一九七〇年代他還住在英國的時候，曾多次來澤西島開會，¹⁹學習離岸產業。澤西島是倫敦金融業的延伸。'
  - '[PAGE 37]


    一九九〇年代初期，克里斯汀森（Tom Christensen）曾擔任澤西島經濟顧問。他生長在當地上流階層家族，卻與《華爾街日報》合作，揭發牽涉到該島最有权勢政治人物的金融弊案。英國國會委員會對克里斯汀森的部門展開多起調查，他認為，那是要毀掉他的名聲並且累死他。親友不願與他來往，他的哥哥任職於澤西島一間信託公司，有將近二十年不跟他說話。


    克里斯汀森回述說，澤西有句俗話：「你若不滿意本地現況，明早就有船可以離開。」馮賽卡在托爾托拉大街彼得斯的辦公室，找到那位三叉戟推薦的律師。彼得斯指點他去找英屬維京群島首席部長羅姆尼（Curll
    B. Romney），申請一張成立公司的商業執照。羅姆尼是一九八四年公司法的倡議人，聽馮賽卡說完，他答應評估整件事，再回答馮賽卡。


    見過羅姆尼之後，馮賽卡碰到當地珠寶商兼立法會議長弗拉克斯（Sega），21他是羅姆尼和彼得斯的密友。22過不了多久，馮賽卡跟弗拉克斯就發現，他們兩人都是古老共濟會的成員。共濟會可追溯到英國工業革命，使用其他行業工會（比如石匠）的會徽，而組成一個兄弟會，透過祕傳儀式及聚會所，存留迄今。


    馮賽卡接通一個存在避稅天堂中的地下網絡，它堪稱祕密社團中的祕密社團，特別是在英國的那些避稅天堂。曉得共濟會的暗語、符號及儀式，經常能打通管道，進入這個封閉的文化之中；藉此，共濟會成員馬上就能得到牢靠的情誼，有機會接觸到只提供給地下網絡的官方與商業好處。克里斯汀森表示，他在澤西島時，多次有人邀他加入這種祕密社團，但他'
  - '[PAGE 38]


    總是拒絕。他並不特別討厭共濟會，或是社團裡過從甚密的政治精英，只是覺得共濟會讓他感覺不太舒服。


    弗拉克斯邀請馮賽卡到聖厄休拉共濟會所。馮賽卡記得他們深入叢林走很久，最後抵達一處林中空地，他在那裡看到一棟共濟會廟宇，華美程度前所未見。他看著會所，因為感冒而開始不停咳嗽。他覺得很沒面子，努力想把咳嗽壓下來的。此時羅姆尼像是從天而降般出現在他身旁。這位首席部長說：「我知道你很緊張。別擔心，你會取得執照的。」


    業務所很快便聘請弗拉克斯的妻子羅絲瑪麗來經營托爾托拉辦事處。她有在信託公司工作的經驗。更重要的是，她在當地人緣很好。弗拉克斯蓋好三棟三層樓建築，便把頂樓租給莫薩克·馮賽卡事務所，這個律師事務所不久就被簡稱為「莫馮」（Mosgsen）。弗拉克斯則把這棟天藍色的建築，用夫妻及三個女兒名字的頭字母，取名為「阿卡拉」（Akara）。


    # 把「保護隱私」當成商品


    一開始，莫馮在英屬維京群島開設的公司，售價低廉只要七百五十美元。生意很簡單：买下公司的通常只是中間人如律師、會計師或銀行家，他們是真正客戶的代理人；真正客戶被稱為「最終受益人」（Ultimate
    Beneficial Owner），又稱受益人。有時買方想買早已成立的公司。已設立多年的公司感覺上很體面，看來好像歷史悠久。莫馮也有一批這些「歇業公'
  - '[PAGE 39]


    司「待賣，費用另加而已。


    受益人現在必須做出決定。由誰擔任公司股東？有許多離岸轄區，包括巴拿馬及英屬京群島，都允許公司發行「不記名股票」（Bears share），再添加一層保護，更難追蹤。這些股票憑證均為實體，誰具體擁有它們，就擁有公司。不記名股票可以用來完全不一具名地轉移資產，是洗錢人士的最愛，也是莫鴻事務所較為暢銷的產品之一。


    最後，受益人必須挑選董事。只要再支付一百美元，莫鴻就會替受益人再增添一層保護，安排人頭擔任公司董事。離岸產業中被稱這些人頭為「名義董事」（Noms），表面上管理公司。實際上他們只是充當受益人的替身，受益人透過私下授權，就能匿名控制公司。名義董事是在企業規範上做做樣子，這個做法在離岸產業中經常使用。


    名義董事倒是為莫鴻創新的獲利機會。當這些匿名公司打算執行：開設銀行帳戶、移動資金、簽合約、採購：：：等行動時，名義董事就會開會（通常是書面的），提供簽名，確保活動合法。每一個簽名都替莫鴻的金庫增加四十五美元。


    開業初期，莫薩克與馮賽卡，以及為數不多的員工，甚至還有員工們的親戚，都得替他們註冊的公司充當名義董事。早在事務所合夥人自己不再擔任名義董事之前，早已替幾千家公司當董事了。後來，隨著莫鴻的公司生產工廠升級，事務所就需要幾十個名義董事了。雖說這項服務讓事務所賺頭不少，但莫鴻發給充當人頭的員工薪水卻很少。莫鴻最有力的董事們，都擔當幾萬家公司的高階主管。有些人甚至替好幾家註冊代理機構工作。德·艾斯崔比'
  - '[PAGE 40]


    （Adelina Marcelo de Claviária de Estrada)總共替一百多家莫馮的公司、二萬七千多家巴拿馬註冊的公司擔任名義董事。


    名義董事的職務之一，是在幾百張空白表格上簽名。這些空白表格會變成合法的企業文件與決議案。莫馮把這些簽名好的空白表格，提供給全球辦事處。簽名出現在白紙的不同位置，端看它們該出現的文件性質決定——舉個例子，持股憑證就該出現在底部，若是辭職書則在中央。名義董事就算不曾認真讀過自己簽名的文件也沒關係。他們從未對公司行使過真正的權力。對於僅擁有一虛構一員工的公司來說，效率是必須的，因此只要簽好字的空白表格。


    馮賽卡對莫馮事務所一位歐洲員工解釋，「簽好字的空白文件，讓客戶可以不必花一或兩週，等候文件送達，就可以開銀行帳戶，進行商業活動。我們在日常的競爭者在做相同的事，所以，我們不得不這麼做。


    莫馮事務所一旦設立好公司，便會將其歸檔封存，就此遺忘，一直到一年過後，才會因為寄出單據辦理續簽，重新想起這間曾註冊過的公司。一九八五年，續簽年費為一百五十美元。


    離岸公司有各式各樣的合法用途，甚至可用來避稅。跨國企業已行之有年。母公司設在避稅天堂，可以有效運作跨越多個離岸轄區的生意，減少稅捐及法律義務。除跨國企業，個人為了相同的理由，也要同樣的服務。匿名公司可以藏匿資產，供生意人或政客包養情婦，'
  - '[PAGE 41]


    減低煩人親戚與綁匪的關注。從莫薩克及馮賽卡的角度來看，他們出售的服務是保護隱私。事實證明，在英屬維京群島設立公司讓犯罪分子心癢難耐。要挪動或藏匿非法活動賺的錢，匿名公司正是完美工具。


    馮賽克抵達英屬維京群島一年之內，另一間巴拿馬律師事務所「摩根摩根」（Morgan and Morgan）也來設點，接著有更多事務所跟進。開發中國家生活水平上升，也令離岸產業的市場擴大。原先是超級富豪享有的領域，此時只要算有錢就能打進去。專為新式全球政商名流服務的公司設立服務，業務量飛增，讓英屬維京群島出現繁榮時代。


    在莫馮事務所早期年代，加勒比海地區販毒所得汩灌成災。要釐清莫馮替販毒所得洗白，占其總業務達多少，實在不可能，話雖如此，它應該很可觀。毒品交易讓托爾托拉添加一股無所不能的味道。加拿大律師兼詐欺研究者肯尼（Martin
    Kenny）記得那個時候，為了從某間英屬維京群島信託公司獲得資訊（當時有數十家），而去找經營者。經營者是位酒吧老闆，用放在酒吧後室的一台傳真機經營信託業務。因為要掛蘭姆酒忙不過來，酒吧老闆就指著堆在傳真機旁的那堆紙，請肯尼自己去找他要的文件。


    肯尼談到離岸產業的客戶審查時說：「當時離岸從業人員就好比三不猴：不看、不聽、不說。」


    匿名公司很快就超越信託這項傳統的保密工具。信託這個概念可追溯到封建時代的英格蘭。準備去參加十字軍的騎士，會把他們的地產信託給管家，幫他們守著，以便他們能到'
  - '[PAGE 42]


    異域浴血作戰。管家通常是男性成年親戚或朋友，監管著那些資產。信託對地主們也是很清楚的做法，可以逃避稅賦及繼承的糾葛。那個時代，遺產的法律基礎還不穩固，附有死後指示的信託，讓有錢人能把資產遺留給情婦，或者較疼愛的子女，就能規避不得讓女性取得遺產的禁令。信託確保家族生意，能交給聰慧的女兒，而非白癡兒子。


    此時管家稱為受託人（Trustee），交付資產的人稱為委託人（Settlor）。政府既不登記也不認可這種受託人關係，由契約闡明雙方關係，它屬私人契約，以低成本的方式，就造出一層穿不透的隱密高牆。把資產以信託方式，交付受託人，可以享受擁有人的各項好處，又免掉稅捐及法律義務。嚴格說來，資產交付信託，就不再歸委託人所有，而歸受託人。課稅依信託所設地點而定，這樣讓英國人造出的避稅天堂興旺起來。信託法規定，違反守密將重重責罰。在巴拿馬，任何人違反信託守密，得處以五萬美元的罰金，或處有期徒刑達六個月。$
    ^ { 27 } $


    然而對莫馮的銷售團隊來說，信託有個大瑕疵：客戶並不信任受託人。在英美兩國，排名在前的信託機構都是老招牌。談到保護資產，它們聲譽卓著。此外，《信託衡平法》（Trustee''s
    Law）行之有年，法院承認並了解信託行為。這些制度上的保護，在新興市場如拉丁美洲、中國及東歐付諸闕如——而莫馮追求在那些地區有所成長。


    在那些地區，貪腐不受處罰，驅使人們前來莫馮挑買匿名公司。他們不僅不指望自己政府及司法系統能保護他們的財富，反而害怕政府官員想偷走他們的錢——如果他們自己並非小偷這一行。他們對自己國家機構欠缺信任，連帶對外國的也一樣，而且有時還大有道理。'
  - '[PAGE 43]


    # 競爭激烈的市場


    在澤西等避稅天堂²⁸，法院有時會找資產轉移的麻煩，質疑其合法性，還把某些信託安排稱為「騙局」。²⁹ 很多莫馮的受益所有人，要把錢財運離自己國家時，都嘗過很多苦頭。想到要把自己辛苦賺來的錢，交付給第三方，放置在沒註冊的金融結構，而且只有一套他们都沒什麼信心的法律系統來保障，自然提不起勁。


    一九八九年，莫馮添加另一個避稅天堂「巴哈瑪」到自己的名單中，巴哈瑪離美國很近，老早就是美國人逃稅的最愛。一九三七年，小羅斯福總統致函國會，抱怨美國人使用巴哈瑪、巴拿馬及紐芬蘭來避稅。總統準備說，民眾在巴哈瑪組織幾六十
    四間離岸公司，以躲避其公民責任。他寫道：「當我們的合法稅收遭到攻擊，整個政府結構就被攻擊。」³⁰ 「狡點的小技倆」傷害到社會的根本，那時就不值得稱道了。³¹


    美國禁酒時代，黑手黨利用巴哈瑪擔當私酒販賣起始點。巴哈瑪第一位總理西默內特（Sir Ronald Symonette）就靠走私威士忌致富。³² 一九五九年，卡斯楚關閉黑幫在古巴的前哨站之後，黑手黨顧問藍斯基（Meyer
    Lasky）便相中巴哈瑪群島。³³ 他順利與西默內特結成同盟。巴哈瑪當地有群政商名流結成團夥，叫「灣街男孩」（Bay Street Boys），因為他們在首都拿索城中的灣街、夏洛特街交會的俱樂部集會，西默內特是其中一員。他們一起造出'
  - '[PAGE 44]


    一套由政府撐腰的離岸金融及製造公司系統,33從事洗錢,以及協助跨國企業及個人逃稅。莫馮打算進入巴哈馬本已擁擠的市場。據巴哈馬公共註冊局指出,在一九九〇年有一百多名代理人在當地為公司註冊。莫薩克說:「這門生意看似簡單,實則困難。競爭無時無地不在。」利潤低、競爭激烈,必須不斷改善服務才能存活。在離岸這一行,這主要意味著設立公司的步驟要比別人快而簡單。


    隨著更多競爭對手湧入英屬維京群島及巴哈馬,莫馮便著眼到別處拓展生意。美國人的某些做法為他們指出明路:莫薩克是海商法專家,與賴比瑞亞船船註冊局很熟。34 自一九五〇年代起,賴比瑞亞便招攬船隻懸掛賴比瑞亞國旗,註冊局從未將據點設在非洲,而是設在紐約市的一套辦公室裡。註冊局是前美國國務卿與受益企業如殼牌石油合作的產物。賴比瑞亞能輕鬆分到利益,35故欣然同意。


    莫薩克想,若是美國人能經營賴比瑞亞的註冊局,有專營權,那麼莫馮有何不可？於是他們找到一個位在澤西辦事處、才剛喪夫的經理南西·布若德赫絲特（Nancy Bross
    Hurst），指示她前往南太平洋找個可以成為莫馮專屬的公司註冊司法管轄國。


    馮賽卡回憶道:「布若德赫絲特失蹤了一整個星期,就如同字面上的意思,是在巴布亞紐幾內亞『消失』了。我們很擔心,生怕她被食人族吃掉了或碰到類似的事。」


    原來,布若德赫絲特跑去巴布亞紐幾內亞一場離岸產業商品展探路了。會議期間,有一天她在飯店酒吧,與坐隔壁凳子的人攀談起來。她說巴拿馬籍老闆派她來,是想找個神奇的'
  - '[PAGE 45]


    地方，充當離岸公司的新據點。她的新朋友很有興趣地聽著，接著對她說：我的國家可以。她在酒吧碰到的朋友叫路易（Frank Liu），是島國紐埃（Niue）的總理。


    紐埃距離紐西蘭東北一千五百英里，是珊瑚礁小島，人口稀少，地點偏僻。國土目前約一百零三平方英里（約二百六十七平方公里），但正在上升中的海平面使得陸地愈來愈少。歐洲人第一次知道這地方，是在一七七四年，當時島民頻頻阻止庫克船長（James
    Cook）登陸，氣得他把這座島稱為「野蠻島」（Savage Island）。紐西蘭於一九○一年占領過這座島，但一九七四年又依聯合國協定，准紐埃自治。身為紐西蘭的保護國，紐埃得到補助，但根據莫薩克說，那筆錢不足以彌補開支。布若德赫絲特與路易見面時，該島領袖們正在研究轉型為避稅天堂，以便替國家大約五百人口的居民創造額外收入。


    布若德赫絲特回到巴拿馬，加入一群莫馮的律師，為紐埃起草公司法。他們大致沿用英屬維京群島的法律，維京群島的法律又是沿用自德拉瓦；接著再替紐埃量身設計，添加他們自己的一些創新。舉個例子，紐埃公司法允許漢字及俄文西爾母命名的公司，而英屬維京群島並沒有。一九九四年，《紐埃國際商業公司法》（The
    Niue International Business Company Act）通過。同年稍晚，莫馮事務所請路易赴全球各地推銷紐埃，其中一站是香港，目標是中國人。他們把紐埃廣告成「南太平洋王冠上的珠寶」。


    隨著註冊局設在莫馮的辦公室，事務所能在一小時內產出一間紐埃籍公司，價格由事務所隨心所欲決定。莫馮設在全球的辦事處都取得空白文件及官印，已經先由紐埃的副註冊局'
