    額，但只有二○○六到二○○七年持有的最高數額。這些客戶來自兩百多個國家，總計起來控有超過一千億美元，許多人是透過設在避稅天堂的離岸公司持有。


    若是正常的資料專案，資訊來自公關單位如政府部局處，記者可以向提供者提出問題，而了解全部意義。在這個專案中，國際調查記者同盟記者們顯然不能前往匯豐尋求協助。卡布拉把情況比喻成重建一盤已拆散的沙拉。


    這群人只好借助於一支程式，它能揭露個中關係、自動顯示人名、公司及地址之間的牽連。軟體是由法國四人初創科技公司 LexisNexis 所生產。LexisNexis
