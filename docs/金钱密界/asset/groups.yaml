    # 金融海嘯爆發之後


    既不擔保也沒有抵押，在任何正派經營的銀行裡，都會挑起戒心。十天之後，克伊普辛銀行釋出更多貸款，總計達一億兩千五百萬美元，流進另外兩家由阿勒薩尼控有的英屬維京群島莫馮公司。這些錢最後來到一間塞浦路斯公司，然後買下大公那五·一的克伊普辛銀行股份。外表看來是展現信心的驚人動作，事實上是由克伊普辛銀行推動的詐騙案”，用以掩飾它購買自己股票。


    美國金融海嘯使得冰島銀行都告崩潰。九月十五日，雷曼兄弟宣布破產，全球金融系統無法運作。三個星期內，冰島政府把國家三大銀行格里特利爾(Credit)、國民銀行及克伊普辛銀行國有化。二〇〇九年初，喬面前來幫助毫克森的時侯，銀行共謀犯罪到什麼程度，只剩蛛絲馬跡。


    毫克森說：「他們跌落懸崖，但沒有打滑煞車的痕跡。」意思指的是大家或許認為應該看到銀行逐步走頓，但實際上並沒有。可以說一天前銀行都還健康，隔夭卻全破產了——這種金融幻象，只有靠著莫馮及德克斯夫婦協助，才能實現。


    雖說可以隱藏導致金融海嘯的陰謀詭計，但其後果免不了公開而血腥。金融海嘯咬掉極大一塊莫馮的利潤。事務所最受歡迎產品英屬維京群島的空殼公司大減三五％。二〇〇九年'
  - '[PAGE 162]


    初，馮賽卡通知優斯特·德克斯，表示莫馮把離岸公司的年費調升十八美元。德克斯抗議了。他說，碰到金融海嘯還升年費，時機再糟也不過。他跟妻子拒絕聽命；兩人在致合夥人函件中，把事務所片面行動描述成違反雙方合約。此外他們讓旗下六百六五十八家還活躍的公司年費維持不變，把莫馮送來的每張發票打掉十八美元，再把錢捎去給事務所。換算下來，等於年收入減少將近十二萬美元。


    到了二月，德克斯夫婦提議把盧森堡經銷授權，賣回給莫馮，作價一千萬歐元，提議遭合夥人拒絕，表示太貴。事務所沒提出反報價，而是強迫德克斯夫婦在巴拿馬進行仲裁過程。仲裁員的裁定不利德克斯夫婦，他們提起上訴。莫馮接下來致函所有盧森堡客戶，通知他們說，德克斯夫婦已無權再銷售事務所的公司。德克斯夫婦提出反告訴訟，指責莫馮詐欺、逃稅，在盧森堡以及巴拿馬皆是如此。訴訟案拖了很多年，讓以前的生意夥伴，變成水火不容的仇人。


    因為金融海嘯而跟他人衝突的可不止德克斯夫婦。雷克雅未克城裡，每天都有人示威，要求政府下台。超過五萬冰島人丟了存款。六個月內，失業率由二%上升到一〇%¹⁵。抗議者用可以潑的食物丟擊政府建築物。全世界各國政府為因應金融海嘯，大幅減少公共服務開支。這些奪節政策，讓專注於避稅天堂的群衆運動得到動力，緊盯它們劫走必要稅收而損害公共財時扮演
    的角色。


    多年來，有群志士很專注地提倡打擊離岸系統造成的政治腐敗及逃稅行爲，喬里名列其'
