  - '[PAGE 105]


    針對美利堅企業服務的討論，對莫馮的公司製造廠來說意義重大。美利堅企業服務只是莫馮的客戶之一，而且遠不是最大客戶。事務所還有其他幾百個客戶。二〇〇四年，事務所做一張全部客戶及自己造過公司的表列，全長四百五十四頁。莫馮與多少銀行家、律師、會計師合作，造出公司供犯罪分子、洗錢者甚至恐怖分子使用？事務所註冊的那幾萬家公司，不管是否活躍，還有什麼醜聞蠢蠢欲動？合夥人似乎不怎麼想知道。他們自我安慰，認為經銷商或銀行對他們的客戶，有在做必要的查核。問題出現時，能夠克服。


    # 危险的客戶


    與此同時，莫馮全速前衝。二〇〇二年，該事務所造出七千多家公司。兩年後那個數字幾乎加倍。如此成長，部分要歸因歐盟的儲蓄指令，也就是巴拿馬大罵的那件事。指令要求歐盟的銀行監督歐洲帳戶所有人，另外，如果他們不是帳戶所在國的國民，要對存款孳息收稅，一開始高達一五%。祕密把錢存在外國銀行的歐洲人，突然遇到得因此繳稅的狀況。只是，二〇〇三年宣布而到二〇〇五年七月才施行的這條法律，有個不小漏洞。它只適用於個人，而非公司。


    到了二〇〇四年初，很多莫馮的客戶，尤其是銀行，開始來找事務所，想設立公司，如此讓它們的客戶能躲開儲蓄指令。這次生意的規模驚人。歐文斯會見設在丹麥的日德蘭銀行'
  - '[PAGE 106]


    （Lyesco Bank）主管們，他們對歐文斯說，為因應歐盟儲蓄指令，他們已替客戶設立了兩千家公司，大多選址在巴拿馬或直布羅陀。匯豐向自己歐洲客戶行銷把錢藏在其瑞士私人銀行這條策略。設在瑞典的北歐聯合銀行（Zottes
    Bank）也幫忙客戶們透過莫馮躲開法規，另外很多間銀行也是如此。


    要躲避儲蓄指令是如此容易，甚至免強算有錢的人都用上了。匯豐銀行有人描述一位比利時棉花出口業客戶的態度。他在客戶的檔案裡寫道：「我們討論即將實施的歐盟儲蓄指令，儘管節稅下來的利益很少，他仍決定透過莫馮設立公司，再把一切資產轉移過去。」


    二〇〇四年八月第二週，莫馮事務所在這次大發利市後裁了個大跟斗。事務所發出電郵給自己客戶及特許經銷商，表示事務所的專屬避稅天堂紐埃已決定關閉其公共註冊局。莫馮擁有超過九千家公司註冊於該島，換算下來，公司數為居民數的四、五倍；只是公關形象之糟，終於讓紐西蘭難以忍受。紐西蘭答應補充莫馮事務所貢獻給紐埃預算的資金，希望紐埃放棄離岸生意。小島還是得活下去，即便不再製造公司，還是維持住油水頗豐的情報電話產業。同一時間，那九千家公司必須到另外一個友善國度找新家。


    紐埃消息宣布的翌日，莫馮律師艾絲柯巴捎出備忘錄給合夥人，表示事務所給英屬維京群島辦事處的盡職調查流程，已經過期了。羅德城辦事處沒有法規及洗錢通報人員，而且反洗錢合規手冊必須更新。她指出，事務所合夥人與英屬維京群島辦事處主任弗拉克斯（Rosanne
    Flax）談了好幾年，而佐林格則向合夥人們保證，他已與弗拉克斯講過，英屬維'
  - '[PAGE 107]


    京群島政府不足為憂11。


    大約同一時候，莫馮盧森堡辦事處主任傳電子郵件給事務所合夥人，講述他與一位客戶之間「很嚇人」的一通電話交談。客戶還傳來後續傳真，封面第一張打字寫道「惠請以最高機密處理本資訊」，原因在牽涉其中的個別人等都狠危險，通常聘請前東德國家安全部幹員當保鑣。


    傳真內容包括一則有關佩薩（Franzisco Pessa Salem）的新聞報導。佩薩是名聲極差的西班牙情報幹員兼世界級投機分子12。他與西非國家赤道幾內亞的獨裁者做生意，還賣導彈給巴斯克恐怖分子，只是在上面偷裝追蹤晶片，導致他們被捕——藉此贏得西班牙官員讚許。一九九四年，佩薩協助西班牙國家衛隊前指揮官藏匿賄款，在過程中自己咬走數百萬美元。接下來他導演自己最大壯舉，捏造自己的死訊。訃聞說他在泰國死於心腦病，遺體火化。偽造的死忙證明讓外界不再懷疑，親屬還替他辦了一場天主教彌撒。


    二〇〇四年，一位私家偵探與西班牙記者合作，發現佩薩還活著，住在盧森堡。佩薩改用法蘭西斯科·桑琪士（Franzisco Salem）這個名字，拿阿根廷護照行走四方。報紙報導，更有趣的是佩薩把自己的新身分減成了十四歲。佩薩在盧森堡與姪女合作，創設離岸公司，而且用新名字，擔任七家莫馮公司的董事。新聞報導聲稱，這個西班牙人替軍火走私販還有俄國黑幫設立公司。後來，佩薩把自己的死訊推波成無心之過，也否認自己與組織犯罪有任何牽連。'
  - '[PAGE 108]


    「馬上調查！」馮賽卡對本傳真回應說。


    然而，莫馮事務所裡的法務單位，動作要比設立公司的單位慢得多。莫馮耗時一年多才完全與佩薩斷絕關係；事務所聲稱，自己害怕那個名聲差勁的西班牙間諜會損害它的形象。但真是多慮了。莫馮依然沒浮出臺面。¹³


    # 政治敏感人物


    艾絲科巴於二〇〇五年九月再次提醒，要事務所合夥人把心思放在符合法規。只是還有一次驚嚇，事務所又一次不經意間發現，有個擁有好幾家莫馮公司的人，其背景令人困擾。


    這次讓人擔憂的類型不太一樣，這位最終受益人是「政治敏感人物」（politically exposed person，PEP）。這個詞彙從一九九〇年代末期開始流行起來，起因是奈及利亞試圖要回前統治者阿巴查（Sani
    Abacha）盜走的數十億美元。阿巴查貪腐惡名昭彰，透過瑞士的銀行及離岸公司，把自己部分非法所得弄出奈及利亞。¹⁴為了打擊這種高層的政治腐敗，聯合國及歐洲共同體下令，銀行及離岸服務業者要審核自己客戶，了解他們是不是政治敏感人物或其親戚。如果是，那麼銀行及販賣匿名公司的業者必須對其財富的來源，蒐集額外詳情。


    莫馮還沒採行那些準則。幾個月前，事務所才粗略曉得，自己有一些客戶是政治敏感人物。當時，一間事務所設立的公司，向事務所索取正式簽名，以便替一間設在英屬維京群島'
  - '[PAGE 109]


    的「蒙狄歐工業」（Mondo Industries）完成購買價格一千三百萬美元遊艇的案子；公司是莫馮應法國里昂信貸（Credit Lyonnais）銀行盧森堡分行所請而設立。


    里昂信貸的要求很特殊。他們的客戶不僅要替蒙狄歐設置名義董事，還要一個假的股東。莫馮事務所乍看是蒙狄歐的所有人，但實際替第二家匿名公司「SVG 投資」（SVG
    Investment）當信託人，而後者才是信託真正受益人，另是蒙狄歐的老闆。真正所有人躲在 SVG 後頭，與他的遊艇隔了三層保密。雖說這樣做違反信託的中心理念，所有人應把資產的掌控權交出去，但莫馮很爽快答應擔任公司的假老闆。


    這位最終受益人（Ultimate Beneficial Owner）的倫敦律師接洽莫馮盧森堡辦事處。莫馮既是蒙狄歐的書面老闆，他要莫馮簽字，融資買遊艇——馬上就要。該律師問道，能否請莫馮倫敦經銷商的一位律師提供簽名。只是經銷商的律師馬上領悟出此中風險。假如交易發生不愉快的事，鬧上法庭，簽名者可能被掛上拒絕往來名單，甚至被起訴。這件事可不是巴拿馬基層員工當名義董事簽署文件，而是倫敦律師不實宣稱擁有某公司，損失可能很大。


    倫敦經銷商做了莫馮沒做的事：調查躲在蒙狄歐公司後頭是誰。內部文件指出，最終受益人是吉內拉羅夫（Sergey Gunarov）。在國際網絡上搜尋吉內拉羅夫不用花多少時間。他是俄羅斯人，因為俄國是貪腐的大蘆坑，這件事本身就是危險信號。只是事情還嚴重得多。吉內拉羅夫謊如俄國人所述，「並非無名小卒」。他當過俄國石油巨擘「尤科斯」（Yuko）的副總裁，接著出掌燃料及能源部。後來在俄國國會下院杜馬（Duma）及「國家企業管理'
  - '[PAGE 110]


    委員會（National Council on Corporate Governance）都取得席次。換句話說，吉內拉羅夫是不折不扣的政治敏感人物。


    莫馮倫敦經銷商寫信給位在巴拿馬的事务所合夥人，「請設想一下可能發生的醜聞。自二〇〇三年起，吉內拉羅夫就在俄國打點公司管理事宜！〔15」


    電子郵件於是飛速穿梭於倫敦、巴拿馬、盧森堡及英屬維京群島。一位莫馮巴拿馬律師怯懦地承認，自己不了解尤科斯，也沒有密切追蹤俄國的政治情況。莫馮決定不在文件簽字。翌月，吉內拉羅夫就開除該事務所的註冊代理人身分。


    艾絲科巴及孔耐霍敦促合夥人改善事務所的盡職調查作業。艾絲科巴寫道：「我想藉蒙狄歐事件之便再次提出過去的建議，〔16，只是建議不曉得為何都沒落實（我記不得是否有人說，那麼做太複雜了。）」


    終於，莫馮付費訂購一個類似谷歌的付費搜尋引擎「世界查核」（WorldCheck），希望有助於查出政治敏感人物及罪犯。雖不是第一次，但事務所再揹出函件給銀行等專業客戶們，要求他們做客戶查核。後續追蹤發現他們幾乎沒有跟進。這與動機強弱有關。要是醜聞曝光間歇零星，那麼似乎總會自行消散，不致於過分地傷害到事務所。與此同時，生意蒸蒸日上。二〇〇五年，事務所銀行設立的空殼公司數目，成長達三倍。那一年底，莫馮旗下


    有可能活動的公司，數目超過七萬家。想對它們都做必要的盡職調查，成本貴得嚇人，有時還


    可能做不到。這種生意立足於隱密，哪有人願意提供資訊。'
  - '[PAGE 111]


    美利堅企業服務的高登說：「很多案例中，現有客戶就是不理睬我們的要求。我們也不


    是註冊代理人（註冊代理人是莫馮），所以很難約束他們。」


    大約同一時間，莫馮發現事務所加速成長而出現的另一挑戰。三十六歲的事务所員工維安卡·史考特（Wangs Scott），她同時也是事務所棒球隊最投入的球員，史考特不幸在二


    〇〇五年九月二日夜裡車禍死亡。事務所「特別專案部」雇用她特擔任莫馮所設立公司的名義董事。在她去世之際，擔任近八千家公司的高階主管。雖說史考特從沒離開過巴拿馬市的辦公室，歸在她名下的金融活動倒是遍及全球，從英屬維京群島、賽席爾到香港都有。


    給全公司的備忘錄中宣布她不幸去世，也說出令很多人好奇的事。文件結尾說：「謹致相關人等，我們此刻正在考慮，如何更換維安卡·史考特出任董事的那些公司之董事。」


    日內瓦辦事處帶頭討論這件事。莫馮諸多辦事處裡，它使用的名義董事最多。相關各造都希望確保取代史考特的人選能不拖累業務成長。莫馮巴拿馬總部建議，由其員工當中挑三個可能人選。他們的姓氏分別為艾倫（Alan）、威爾森（Wilson）以及王（Wang）。三人都很年輕，另外具備一項重要賣點。誠如佐林格指出，他們的名字在國際上聽起來都平淡無奇，更加好賣。


    莫馮準備好表格，授權用另一位董事取代史考特；他們把表格放進現仍活躍的公司檔案裡。只要名義董事得替公司執行正式行爲——比如開一個銀行帳戶或者批准一項合約——新任的理事就執行該動作。只是，史考特過世十年之後，依然是很多家莫馦公司的董事。那'
  - '[PAGE 112]


    些公司不需要它們的董事做正式行爲。一個一生因悲劇而縮短的人，卻以隱密工具的身分而活在書面上。


    # 可以為客戶做到什麼程度


    莫瑪事務所經證實手段卓越，設立那麼多家公司，而公司的活動，事務所都能避而不受傷，但別的業者就没那麼幸運了。二〇〇五年快結束的時候，事務所開始收到阿根廷恐饞投資人的電子郵件。他們把自己的錢，投資到深富魅力、前保險仲介員庫拉托拉（Enrique
    Caruana）經營的穩妥基金裡。17好些年來，他們收到的收益高達四十五％，提錢毫不費力。


