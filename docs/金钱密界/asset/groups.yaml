  - '[PAGE 274]


    華洋盞的年輕女性──來自法國的斯奇莉-加耶那（Cécile Skills-Gallgo）及來自委內瑞拉的迪亞茲-史特拉克（Emilia Diaz Struck）──她們打點由協調夥伴到研究的一應事宜。卡瓦哈爾把本案代號取為「普羅米修斯」（Prometheus）。這個名字不僅指從奧林帕斯盜火給人類的神明，還是星艦迷航記劇集裡，星際艦隊最強戰鬥艦之一的名稱。17


    卡布拉還介紹 Global-LH9。這支臉書般的應用程式，讓成員可以安全登入，分享他們從資料裡找到的機密資訊。Global-LH9 還成為散居全球記者們第二個家，可以聚集、溝通。它提供的那種操作彈性及數位安全，莫馮只有在夢中才能遇見。


    議程最後一項也是最困難之一──何時發表。阿根廷公共電視頻道「十三頻道」（Trece）記者派翠克（Matis-Fitz Patrick）興奮地懇求，讓阿根廷人在十月二十五日該國總統大選前發表。假如資料含有可以連繫到基西納總統的犯罪活動，那麼必須讓大眾知道那些資訊。這番交談很是費勁。在場人人都曉得派翠克說法的價值，但這個專案不再是只與單一國家有關。聚集到華府的記者們來自全世界。除非報導已經就緒，不然他們不能發表。


    到此時節，《南德日報》記者們已經了解要處理這批資料有多困難，所以放棄在二〇一五年發表。與其跟上司對抗，他們寧可有效法全球記者都做的──追隨就好。賴爾對他們說，一旦他們的上司瞧見專案的規模與驚人的發現，他們會轉變態度，同意變更最後期限的。


    華府會議後一個星期，莫馮的律師團呈繳一份莫薩克的聲明書給拉斯維加斯美國聯邦地區法院。甘冒著偽證罪，莫薩克宣稱 ZFL 內華達公司與莫薩克·馮賽卡沒有母公司子公司'
