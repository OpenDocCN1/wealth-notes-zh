    接下來二十五年，賴爾改頭換貌，成為澳洲最頂尖記者之一，娶了當地一位多媒體編輯，而且在雪梨海灘附近買了間產權獨立公寓。賴爾身形瘦長，眼睛炯炯有神，有愛爾蘭人歡快輕鬆氣質，與他經常掛在臉上的憂心忡忡恰成對比。他歸化成澳洲人，以犀利的調查採訪而出名。他報導主題有警界貪腐、土地不法交易、令人生疑的醫學實驗。賴爾十二次打進澳洲記者最高榮譽的「沃克利傑出新聞獎」（Wakley
