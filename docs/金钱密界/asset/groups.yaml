    # Jake Bernstein


    陳亮 伯恩斯直 譯 潘勤 圖


    > 一問在中美洲巴拿馬小街上的律師事務所，每年全球竟有數億美元的資金流入，卻消失無蹤，再也追查不到。一 這一切，是怎麼開始的？


    一名記者追查一份報告的祕密，竟能吸引八○國、六七○一洗貸貨幣手、發動史上最大規模的政商名流跨國金流大追擊。一 這場揭弊行動，揭開多少避稅祕密？'
