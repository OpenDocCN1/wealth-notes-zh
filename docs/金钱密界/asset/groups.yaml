    賴爾及克里斯蒂安松決定請瑞典公視記者憂曼出馬。憂曼與他的同事對製作自己版本的冰岛新聞，很有興趣。瑞典公視要求採訪貢努格松，談談冰岛處理金融海嘯一事。他們計畫讓克里斯蒂安松以當地調停人的身分，陪伴攝影團隊前住。一等憂曼問到溫翠斯，克里斯蒂安松就插話訪談，以冰岛語問相同問題。


    採訪安排在二〇一六年三月十一日，憂曼與他的人馬前幾天便已抵達。到此時節，克里斯蒂安松也邀集三位冰岛同事，同時拍攝採訪，要在冰岛公視播出。他們在克里斯蒂安松狹窄的客廳裡，把家具推到一旁，模擬採訪，揣測可能有什麼反映及回應。大家公認，自己當過電視名人的總理，不會理睬這些問題。


    午餐吃過魚塊及薯條，團隊前往位在加納塔納（Tjarnargata）的總理官邸16，那是一座舊式的木板房，裝有屋頂窗，總理在那裏召開正式會議。還沒架上攝影鏡頭以前，憂曼聊足球及瑞典，成功地讓貢努格森放鬆下來。隨著憂曼問到二〇〇八金融海嘯，以及冰岛的因應之道，訪談內容放寬。憂曼慢慢地拉近核心問題。他問道，最近有報導說，冰岛政府已購買「敏感的稅務資訊」，意思指的是盧森堡莫瑪辦事處資料。克里斯蒂安松的一名攝影師史蒂芬松（Birkur
    Stefansson）心跳加劇，奮力想把搖晃的攝影機三腳架穩好在本頭地板上。貢努格松說，他想讓民眾知道，他的政府「不會放過任何陰暗角落」。


    憂曼問道，貢努格松自己對有人使用設在避稅天堂的離岸公司藏匿資產，有何看法。總理說，在冰岛，「我們極爲重視，人人都該付應繳的稅」。這位瑞典人接下來祭出致命一擊。'
  - '[PAGE 290]


    # 巴拿馬文件


    「總理先生，您以往或現在與離岸公司有任何牽連嗎？」


    賈勞格松首度緊張起來，結結巴巴，前言不搭後語地回答說：「這個問題很不尋常……冰島政治人物被這麼問。感覺上好像被指控制什麼似的……但……我可以肯定，自己從未隱藏任何資產。」


    燮曼接下來問道：「總理先生，您能跟我談談一問叫溫翠斯的公司嗎？」


    一抹驚恐神色拂過賈勞格松的臉龐。他接下來講了更多語無倫次的話：「我開始覺得這個問題有點奇怪了。」


    燮曼對賈勞格森說，他的冰島夥伴有細節，想進一步問他。克里斯蒂安松接下來用冰島語，連珠砲般地問問題。


    生命中很少出現瞬間就此注定一個人或國家命運的時刻。賈勞格森本可以保持平靜，試著用口才擺脫那次採訪的。但他沒那麼做，而是突然由椅子站起來，向記者們反罵幾句，便從他能看到的第一道門逃出房間，而門是通往廚房的。克里斯蒂安松及燮曼隔著緊閉的門，要求他出來完成訪談，但沒有用。


    時間倒推回九月，國際調查記者同盟高層在慕尼黑談論該替專案取什麼名字。格拉瓦請'
  - '[PAGE 291]


    夥伴們提供意見。賴爾不想再用「解密」為題了，雖說以往國際調查記者同盟專案都因此生色。他喜歡「巴拿馬」加「文件」，此外還讓人連想到一九七一年，艾爾斯柏格（Ellsberg）公布重大的越戰時代五角大廈文件。瓦絲奎茲及《新聞報》團隊並不樂意，生怕那個名稱為不公平地羞辱到他們全國。但名稱為板定案，一如發表日期，最終由《南德日報》及國際調查記者同盟決定。巴拿馬文件勝出。


    到了十二月，發布最後日期又告推遲，到二○一六年四月三日星期日美東日光節約時間下午兩點。《南德日報》那麼晚才注意到，三月十三日與德國區域選舉撞期，而略感尷尬。


    換了新的截稿期限，替專案工作的記者們可以開始接洽替自己或別人製造離岸公司的人，在二月二十一日發表評論。國際調查記者同盟要求他們別提全球性資密或者通力合作，只說他們瞧過文件提到特定公司（或多間公司）就好。至於接觸莫薩克·馮賽卡律師事務所，則自三月六日起分兩階段進行。


    冬去春來，洩出資料的某某人不耐煩了。自從首次與歐伯邁爾接觸，已將近一年，還是沒半篇新聞見刊。德國人與國際調查記者同盟每星期以電話及電子郵件交談，討論該如何處理這項難題。做離岸解密密期間，賴爾也碰到跟消息人士之間類似的緊張狀況。歐伯邁爾能做的，只是一次又一次請某某人安心。這樣子並不夠。某某人接洽維基百科，看看該組織對那些檔案有沒有興趣。幾百名記者辛苦了幾個月，現在提心吊膽，但維基百科未能回應爆料電話。莫馮檔案於是留在國際調查記者同盟17。'
  - '[PAGE 292]


    二〇一六年一月下旬，巴西聯邦警方突襲莫馮的聖保羅辦事處。一連串行賄指控，牽涉到巴西營造公司「奧德布雷赫特」（Odebrecht）、國營石油公司巴西石油（Petrobras）及巴西政治最高層，偵辦行動快速升高。檢方簽發六個人的逮捕令，其中至少三人與莫馮有牽連。在突襲後的記者會上，檢察官利馬（Carlos
    Fernando dos Santos Lima）譴責莫馮事務所一名員工銷毀文件。他把莫馮描述為「洗錢機器」 18 。


    事務所回應一篇聲明 19 ，指出莫薩克·馮賽卡巴西辦事處不歸巴拿馬莫薩克·馮賽卡管轄。巴西辦事處創立那家外界懷疑的公司，時間點在二〇〇五年，應一位中間人所請。聲明說，莫馮遵照當時已有的法規，善盡盡職調查本分。


    民眾對莫馮業務的關心程度，似乎與日俱增。巴西的記者夥伴表示，害怕自己的新聞屆時已算舊聞，不過保證緊守大家同意的發布日期。很多人好奇，這項史上最龐大的新聞操作要保密，能不再撐兩個月，而賴爾則勸告要冷靜。看來肯定會有人不願遵守時間。


    到了三月初，有些莫馮的客戶通知事務所，說記者們接洽他們，想了解莫馮製造的公司。馮賽卡出現在巴拿馬電視上，為事務所辯護。三月四日，國際調查記者同盟向莫馮捎上十七條一般問題，包括「莫馮事務所、旗下辦事處或員工，是否曾幫助別人等洗錢、逃稅或者規避制裁？」「信件請事務所在三九月九日下午六時以前回答。收到信件後沒多久，馮賽卡臨時請假，離開瓦雷拉政府的職位。


    距離三月九日最後期限還有三十分鐘，莫馮的公關主任蘇薩（Carlos Sussa）回應以內'
  - '[PAGE 293]


    容三段的電子郵件。他寫道：「事務所僅籌辦公司，大概任何人都會認定，公司很重要，對確保全球經濟運作順遂至為關鍵。提供這些服務的過程中，我們遵守法律，就法條字面意義及立法精神皆然。」


    莫馮還在考慮怎麼回答的時候，參與專案的七組電視記者團——來自美國、法國、德國、丹麥及芬蘭——來到巴拿馬。蘇薩寄出電郵回覆翌日，電視記者們守在莫馮辦公室外頭。近二十名記者、節目製作者帶著十部攝影機指著門口，要求找個人出來跟他們講話。過了一會兒，蘇薩才出來回答幾個問題。


    翌日，蘇薩、莫薩克及另一位莫馮律師造訪《新聞報》。馮賽卡前一星期已接洽過報社董事長，敲定會議，只是由莫薩克代他去除。會議桌另一側是調查部主任羅德里格茲、《新聞報》集團主席及總編輯。莫薩克覺得《新聞報》與會者不肯跟他們視線相對，而憂慮起來。他先宣稱，自己的事務所是被害者，國際記者們鐵了心想譁眾取寵，接下來莫薩克說，他知道《新聞報》裡有個記者在幫他們。雖說他不知瓦絲奎茲的姓名，但描述她的外表態。莫薩克警告，假如《新聞報》誹謗事務所，可能吃上官司。接下來他邀請羅德里格茲到事務所去，多了解莫黛實際在做什麼。


    《新聞報》高層討論一下，決定派保鑣給瓦絲奎茲。她在深夜工作，他們擔心她會出意外。這麼安排頗為尷尬。即便瓦絲奎茲跟她的美籍丈夫布朗斯坦（Scott Bronstein）在協助外國記者，他們也與來自英屬維京群島、做離岸生意的朋友交遊。國際記者還在巴拿馬市的'
  - '[PAGE 294]


    時候，他們請離岸朋友那星期別來。記者群離開翠口，瓦絲奎茲與布朗斯坦便邀朋友們外出吃晚餐。他們請保鑣扮成優步（Uber）司機。一群人往餐廳出發時，布朗斯坦往前座看去21。駕駛身旁袋子裡有把手槍，掩飾得很勉強。其他人都沒注意到。'
  - '[PAGE 295]


    # CHAPTER 17


    # 全球震盪


    賴爾與格瓦拉把普羅米修斯專案最後三個星期，用在安撫夥伴們。在冰島，克里斯蒂安松及其瑞典同事們，在貢勞格松總理凄慘的採訪發生後，提議他再受訪一次。他拒絕了。他們另外要求跟他妻子帕絲多提爾交談，因為她掛名莫馮公司溫翠斯的老闆。記者們給這對夫妻幾天時間回覆。


    最後期限結束前一個小時，帕絲多提爾在她臉書專頁貼出讓人困惑的聲明，「雖說聲明沒直接談到貢勞格松的受訪，但她承認擁有溫翠斯，而且說從沒想隱瞞公司的存在。她強調，該公司活動而致的應稅捐都已給付。因為冰島記者們還是頭一次聽到這家公司，於是吵著要更多資訊。


    俄羅斯總統普丁也採取先發制人手段。三月二十三日，國際調查記者同盟、《南德日報》、《世界報》等媒體指出請求評論的詳細函件送到克里姆林宮。函件發問的主題包括普丁老朋友、古典音樂大提琴家羅爾杜金表面上控有多家莫馮公司，與他有什麼牽連；另外，普丁有沒有下令謀殺他的前通訊部長；那位前部長也擁有一間莫馮公司，二○一五年十'
  - '[PAGE 296]


    一月，有人在华府某旅館房間發現他傷痕累累的屍身。


    五天後，俄羅斯總統發言人佩斯科夫（Dmitry Peskov）召開記者會，譴責「一個自稱國際調查記者同盟的組織」發來「口蜜腹劍的詢問函」。克里姆林宮發言人警告說，全球五花八門媒體打算發布新聞，內容牽涉到的離岸公司，據稱與普丁以及一大堆普丁一生從未見過的生意人「有關」。俄國人顯然不曉得，本專案內容遠不止普丁。佩斯科夫的妻子也有問莫鴻製造的公司⁴，他責備那些還沒問世的爆料，是外國情治單位的陰謀。根據國營新聞機構「衛星社」（Sputnik）表示，發言人矢言，它們的攻擊行動不會奏效。


    在華府，賴爾閃躲其他媒體組織的電話，它們想打探即將問世的新聞有什麼內容。國際調查記者同盟幾家夥伴表示憂心，認為目前揭露的消息足以毀掉整個專案，但賴爾把提前發布的建議壓下來。他堅定地對擔憂的編輯、記者們說，提前見光的這些事反而會吸引興趣。他說，大家應該高興才對，原因在普丁及賈勞格松已經回應這些消息，而且消息站得住腳。


    賴爾一直很平靜，原因在前幾次解密調查案，他已經歷過這種場面。


    莫薩克與馮賽卡還是不了解當時面對的是什麼狀況。資料外洩了，這一點很清楚，但外洩多廣、有多少媒體組織參與調查，依然成謎。馮賽卡現在還記得，國際調查記者同盟、《南德日報》及《衛報》再寄一張四十八條問題的表格給事務所，所方吃了一驚。問題如莫薩克的父親是不是納粹分子，還有指控事務所替聲名狼藉的布林克斯（Brix）黃金搶劫案洗錢，凡此種種讓事務所合夥人們相信，記者們是想睌眾取寵，而非認真對話。馮賽卡插'
  - '[PAGE 297]


    述，這些是「白癡問題」，與合夥人的自我感受，恰成尖銳對比。


    莫薩克半退休了。馮賽卡進政府當官。合夥人自視為正直生意人。他們從沒替銀行搶匪製造公司；他們只是把公司賣給倫敦的代理人，而代理人再把公司轉售他人。他們相信，莫馮的公司產品對世界造成什麼傷害，既不該由他們操心，也不是他們的責任。


    這種想法即將改觀。


    四月一日星期五，莫馮事務所終於向現實屈膝，捎出通知給客戶，說自己的郵件伺服器遭非法入侵。通知由行銷及销售主任蘇薩簽名，承認資訊已落入記者手中，而記者們找上事務所。


    通知函無客戶：「事務所平常心回應，並沒提供細節，而致進一步曝露機密資訊。」這好像馬匹已經逃走了，再把馬廄的門關上，但是，事務所可不想揹上自己甘願洩露資訊的罪責。


    通知函繼續說：「請放心，事務所將您的資訊安全及機密性質，視為最高前提。我們動用多層電子安全保護，限制取用檔案，只有本事務所特別人員才能接觸得到，以防止入侵。」事後對莫馮網路安全的分析顯示，通知函的內容太高調自負。它最大錯誤，就是把公司內部網絡，也就是事務所的資料庫及通訊，與面向大衆的網站，放在同一部伺服器和所錯上加錯的是：即使安全漏洞及瑕疵讓資料庫可公開取得了，莫馮還是沒有升級軟體。根據事後刊在《Wi-Fi》的報導指出，莫馮事務所的內容管理系統至少有二十五種已知的弱'
  - '[PAGE 298]


    點⁷，有些格外薄弱。


    報導發布的前一天，馬爾他有個部落格把各點連繫起來。部落格作者在專案合作夥伴芬蘭公共電視台的網站，看到宣傳短片，談論即將播報的巴拿馬解密。格瓦拉及賴爾同意少數電視界夥伴播出廣告性質的插播，但只能提到新聞界大合作、巴拿馬及資料洩露，而不能提到莫薩克·馮賽卡的名字。有些案例中，電視台是按法律得先廣告他們的節目。馬爾他的部落格接下來取得莫薩克·馮賽卡給客戶的函件。把兩者湊起來，部落格貼出文章，標題為「莫薩克·馮賽卡的祕密被人得悉，全球即將報導龐大的巴拿馬解密資料」。⁸
    這種事一般只會造成小小不便。只是本案當中，部落格作者是國際調查記者同盟資料解析員實利齊亞的母親戴芙妮·卡魯安娜·實利齊亞（Daphne Caruana Galizia）。某些合作夥伴嘟囔抱怨了，馬修·實利齊亞發誓，他從沒跟他母親講過這個專案。


    在冰島，除了克里斯蒂安松的製作公司「雷克雅未克媒體」（Reykjavik Media）員工，還有他每日新聞節目《Íbúðir》做記錄片的同伴以外，沒幾個人曉得國家電視台即將發生什麼；克里斯蒂安松要在那裡播出報導。他們到播出前一天才告訴電視台執行長。時段為週日下午六時，原本是保留給冰島最長青電視兒童節目的。既然全世界都要在同一時間發布，電視台便把兒童節目調開，播報特別報導。


    克里斯蒂安松堅持節目播出時，他得在導播室內；他製播的節目，都奉行這個慣例。他坐到棚內時，兩眼滿是血絲，臉色因緊張、疲憊而看來顫顫的。他感受到責任的壓力，不僅'
  - '[PAGE 299]


