  - '[PAGE 348]


    在巴拿馬，瓦絲奎茲與布朗斯坦夫婦總是樂於提供協助。另要感謝羅德里格茲、諾瑞加、賈拉米爾（Rafael Perez Jaramillo）、亞歷阿斯及卡斯提列羅（Gian
    Castillero）。我第二次前往巴拿馬，要感謝「國際反貪腐研討會」（International Anti-Corruption Conference）一二六年的邀請。大會的會外會上，阿爾梅妲、孟恩、哈度（Paul
    Radu）及沙克森（Nicholas Staxson）都不吝提供意見。


    在老家附近，高登很體貼、有耐心、直接了當。魏斯特人真好，翻遍他試圖遺忘的記憶，談那些試煉及勝利。喬魏奇提供目光如炬的藝品市場觀察。另要感謝法格（Keith
    Fogg）、伯爾曼（Brad Berlman）及史密斯（Frank Smith）。


    我能跟布倫姆、畢恩（Elise Bean）、韋伯（David Weber）談論這本書，真是太幸運了。他們對金錢密界、洗錢及各造想管制這類活動的心血，知識可謂百科大全。我真希望能多在他們跟前悉心聆教。


    這本書諸多可稱道之處，來自前述所列出各位。有任何錯誤，我只能引以為咎。我另要感謝我秀外慧中的太座伊芙，她除了讓我不失理智，還幫我做出研究到編輯的一切。另感謝我的經紀人派特森（David
    Paterson）及山德斯（Howard Sanders），還有我的律師席恩尚（George Shemshang）。亨利·霍爾特（Henry Holt）出版公司的編輯哥羅伯（Paul
    Golio）熱情又有耐心。感謝「公園坡食品合作社」（Park Slope Food Coop）的耐心寬容。'
