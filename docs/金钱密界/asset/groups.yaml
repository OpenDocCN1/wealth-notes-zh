    根據一份美國中情局（Central Intelligence Agency，CIA）的解密報告，葉哈茲曾在一九六三年接洽中情局，提議販售共產古巴的情資，但檔案裡並沒有細談他與中情局維持什麼關係（就算有好的）。葉哈茲舉家搬到巴拿馬後，在漢莎航空（Lufthansa
    airlines）找到工作，也曾嘗試過不同的職業。尤根在全家抵達巴拿馬時已經十三歲，不懂西班牙語跟英語。一家人只能彼此溝通，所以凝聚力很強。尤根意識到語言障礙，自己又天生害羞，交友困難。他回憶時以一貫地低調說：「交朋友有點難。」只是，莫薩克一家有著移民追求成功的幹勁。尤根自豪地表示，他七歲大的弟弟在六個月內就成為全班第一名。


    ## 我誰也不信


    尤根·莫薩克的成長過程，因為語言及父親的納粹背景而受到孤立，而教懂他守密，一生維持謹慎。人們把他的害羞誤認為冷酷，這一點他也不想澄清，因为他發現，叫人有些望而生畏，反而有不少好處。有個屬下談到他們前幾次見面時的經驗說：「他用冰冷的視線瞪著你，彷彿眼前不存在任何人。」只是，同一位員工很快就發現，若是有困難要解決，該找的人是莫薩克，而非他的合夥人馮賽卡。


    事務所偶爾會辦員工旅遊，另一位員工回憶，有一次一位團隊帶隊人引導大家做建立信任活動，但她不曉得自己挑到事務所負責人，而把莫薩克的眼睛蒙起來，接下來由一位基層員工領著他四處走。活動結束後，團康帶隊人問莫薩克感覺如何？是否信任自己的嚮導？莫薩克回答說，他一點也不喜歡這個活動。據說他表示：「我誰也不信。」


    莫薩克就學於巴拿馬一間小型天主教私立大學，主修法律，想當律師，專長是海商法。二十世紀初期，巴拿馬便開始兜售自己是外國船舶改登記的好地方。掛上巴拿馬國旗，船東就能規避母國要求的稅賦，以及保障勞工與船隻安全的法規。鑽採產業（石油、礦物、貴金屬）最早發現這些好處，好比標準石油（Standard
    Oil）一九一九年便把油輪船隊登記於巴拿馬。


    一九七三年從法學院畢業後，莫薩克便到巴拿馬頂尖的律師事務所「艾羅塞梅那、諾瑞加及卡斯楚」（Arroceras Noriega & Castro）工作，在倫敦協助設立辦事處。然而莫薩克兩年後就憤而辭職，因為事務所拒絕承認他的貢獻，不付相應的薪水給他。一九七七年，莫薩克返回巴拿馬，賭上自己的志氣，開一間新的事務所，獨自執業。莫薩克回憶：「那時非常艱困，我不知道自己能不能賺到足夠的錢來養活一家人。」


    莫薩克開業之初，剛從法學院畢業的馮賽卡順道來訪，祝他好運。


    直到今天，馮賽卡都非常崇拜莫薩克的眼光、堅韌及組織能力。他承認，年紀比他大的莫薩克，因為身高六英尺三英寸（約一百九十公分），表情一直很嚴肅，所以看起來令人害怕，但馮賽卡堅稱，莫薩克事實上只是「大尺寸的泰迪熊」。
