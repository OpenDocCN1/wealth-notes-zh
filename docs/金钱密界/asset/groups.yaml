    # 中國解密


    國際調查記者同盟員工注意到，雖說卡布拉殷殷囑咐，《財經》的記者們就網路安全方面，做得有些鬆懈。有時候他們電子郵件忘了加密。只是，他們的工作成果不錯，主動搜尋'
