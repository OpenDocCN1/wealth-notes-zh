    要他們處理法外事務，這種歷史由來已久。類似活動還以網路犯罪持續到今天。


    佩特羅夫不是第一個與莫馮檔案有關聯的俄羅斯黑幫老大。因為黑社會勢力之廣，一度被稱為「老大的老大」的莫古列維奇（Semion Mogilevich），他的黨羽就與莫馮合開多家公司。美國檢方相信，這些公司中的一間「羅絲巴德顧問」（Rosebud
    Consultants）每月給付兩萬美元給那位老大，但原因不明。另外在「兄弟圈」（Brother’s Circle）的檔案裡也找得到。兄弟圈是源自俄國的跨國黑幫，美國財政部相信，它充當多個犯罪網絡的協調組織。


    雖說俄羅斯銀行股東與普丁一九九〇年代就彼此奧援，但等到普丁登上權力頂峰，還有更大財富等著他。一九九六年，普丁的上司索布恰克（Anatoly Sobchak）於聖彼得堡市長敗選，普丁離開彼得堡。乍看是受挫，最後變成轉機。克里姆林宮「總統財產管理理事會」（Presidential
    Property Management Directorate）理事長鮑羅定（Pavel Borodin）網羅普丁當副手。葉爾欽總統治下的俄國，是貧腐吃到飽的自助餐廳，但它還有隨心所欲的媒體把理事會稱為「特權部」，原因是它在葉爾欽的任用網絡裡占有重要角色。


    鮑羅定接下來惹的麻煩，讓他在莫馮的檔案裡值得一提。大約在普丁搬到莫斯科、開始工作的時候，鮑羅定與一間瑞士營造公司簽約，翻新「大克里姆林宮」（Grand Kremlin
    Palace）。接下來還與該公司的姊妹公司簽了更多合約。據瑞士官方估計，大量出現的草率案子衍生出大約三千萬美元的回扣，供鮑羅定可以支配。這筆錢流經慣熟的路徑：一間塞浦路斯空殼公司、日內瓦及盧加諾的幾個銀行帳戶，再加上列支敦斯登及巴拿馬的基金會。'
  - '[PAGE 123]


    鮑羅定肯定讓葉爾欽分一杯羹。那家瑞士公司替俄國總統、第一夫人及他們兩個女兒付信用卡帳單。


    有個獨立檢察官斯庫拉托夫（Yury Skuro）著手偵辦這些案子16。儘管在這期間有支持愛錄影帶流出，男主角看來有點像他，但斯庫拉托夫拒絕退縮，所以葉爾欽將他免職。一年前的一九九八年，葉爾欽已提名普丁執掌「聯邦安全局」（Federal
    Security Service），該局繼承格別烏的功能。接下來，普丁對葉爾欽的忠心，讓他取得總理的位置。一九九九年二月三十一日，就在瑞士簽出對鮑羅定的逮捕令之前，葉爾欽辭職，普丁成為代理總統。普丁的第一批總統令當中，包括特赦葉爾欽，還有任命鮑羅定擔任俄羅斯與白俄羅斯聯盟（Union
    of Russia and Belarus）國務卿，這個職位有外交豁免權。莫馮最早意識到鮑羅定是在將近十年後的二〇〇九年，當時事務所發現，一位鮑羅定的銀行家（也是莫馮的客戶）因鮑羅定的案子，遭瑞士法院以洗錢罪名起訴17。銀行家聲稱自己無罪。但莫馮還是從他的公司抽身走人。


    莫薩克對直接跟俄羅斯人做生意，一向小心謹慎。他說：「蘇聯解體之後18，工廠的副理群變成寡頭治理者。這實在不正常——誰都看得出來。」


    美利堅企業服務的高登取笑莫薩克，叫他放輕鬆，冷戰結束了19。不管莫薩克擔心什麼，俄羅斯金錢經由設在避稅天堂的離岸公司、基金會及信託，流入塞浦路斯及瑞士，數量如此巨大，想避開不沾，根本不可能。俄國人透過他們的律師、銀行家大批買下的莫馮公'
