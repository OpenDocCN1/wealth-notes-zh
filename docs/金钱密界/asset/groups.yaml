    # CHAPTER 4

    與銀行攜手合作


    一間離岸公司沒有銀行帳戶，作用不大。要想有一定程度的金融活動，必須有銀行。一百多年來，銀行守密的最高規格是瑞士；客戶相信當地銀行業者不會暴露帳戶所有人身分，或揭發客戶的違法行爲。事實上在瑞士，銀行業者透露客戶的私人資訊，就是違法。瑞士大小銀行不在乎錢的來源是合法還是犯罪所得。有繳稅與守法義務的人是帳戶所有人，而非替他們藏錢的銀行。但若是在瑞士有帳戶的人想大筆花錢，同時維持錢財不曝光，由匿名公司來做才是正解。通情達理的瑞士銀行業者，會協助他們的帳戶所有人設立離岸公司。瑞士銀行業者名列莫馮的最佳客戶，有他們相挺，莫馮事務所日內瓦辦事處才能成為獲利冠軍。


    莫馮最佳銀行客戶中，匯豐銀行（HSBC）特別突出。匯豐與莫馮事務所乘著一波參雜合法與非法的金融全球化浪潮，共生共榮。兩家機構對客戶篩選的態度都很鬆散，把獲利擺在第一位。莫馮事務所還未關閉前，匯豐向它訂購兩千三百多家公司。匯豐購買那些的匿名空殼公司時，都是大批採購。當客戶有所需求，匯豐就會要求莫馮將公司轉讓過來。雙方從一九八○年代初期開始合作，透過駐日內瓦的南非商人哥瑞羅（Gregory'
  - '[PAGE 66]


    Cardino）牽線，當時莫薩克還未與馮賽卡聯手。哥瑞羅雖不具備法學專業，也清楚當中間商很有賺頭。他替日內瓦的銀行家、律師們向馮賽卡購買空殼公司。莫馮合組事務所之後，成爲哥瑞羅取得匿名公司的主要管道。


    哥瑞羅的頭號金融客戶是設在盧森堡的薩夫拉利實控股（Safa Raschik Holding）公司，該公司在瑞士經營一家成功的私人銀行，其三萬名高淨值客戶裡，有非洲腐敗領導人的捐客、中國官二代、中東王室、俄羅斯黑幫、邪惡的鑽石商，以及洗錢者。那些人大多需要離岸公司提供保密服務。這間銀行控股公司具備專業——絕對謹慎、極少發問，以及禮實服務，就如同上千本間諜小說中諷刺描寫的瑞士銀行：服務周到、事事打點，但絕對保密。


    哥瑞羅是個很好的銷售員，卻不是個好的生意人。他有個習慣，就是向客戶收取公司登記續約年費，卻沒有真的續約。只有等到客戶需要公司做些什麼時，哥瑞羅才會持續約費。他對客戶的傲慢態度，可能是他突然離開日內瓦的原因之一。一九九八年，他突然去了巴拿馬一趟，回到瑞士辦事處之後，便對助手賽門（Sasimon）說，他已經把生意賣給莫馮了。這一時衝動的決定，並沒讓賽門有多麼驚訝。哥瑞羅早半開玩笑地說，他很擔心被客戶追殺，睡覺時都把護照藏在枕頭底下。


    馮賽卡來到日內瓦，整理哥瑞羅留下的爛攤子。他委任來自西班牙的前翻譯員、學校老師賽門主持公司事務。那位西班牙人鞏固公司與優良客戶如薩夫拉利實控股公司的關係，而薩夫拉利實控股公司當時正在轉型。'
  - '[PAGE 67]


    # 銀行家薩夫拉


    當時，薩夫拉利寶控股的創辦人薩夫拉（Edmond Safra）正打算把自己的金融帝國賣給匯豐，雙方磋商之中。薩夫拉身價億美元，先人曾在敘利亞經營銀行，堪稱金融世家。薩夫拉說，薩夫拉利寶控股公司及其姐妹機構、紐約都會區第三大零售銀行的「利寶銀行」（Republic
    National Bank of New York），都是他的孩子。兩家機構可說個兒，管理的資產加計起來有五六十億美元，客戶遍及八十國家。


    老派銀行業講關係，今日，最後一批與它還有牽連的人，薩夫拉是一個。他的祖先為鄂圖曼帝國的駱駝商旅做融資。他手下的銀行從業員肯替危險的人保密。旅遊時，薩夫拉經常帶著一隊裝備精良的以色列保鏢。他極度迷信、偏執，又得了帕金森氏症，所以不太情願把自己這塊版圖，換手給一個更重機器而非血肉的企業。


    一九九九年十二月三日，薩夫拉還未把薩夫拉利寶控股與利寶銀行（以下合稱利寶）賣給匯豐之前，他一位擔任過美國軍醫兼綠扁帽戰士的男護士，在他位於蒙地卡羅的閣樓，往廢紙簍放火。那名護士接著高聲示警，說房子裡有武裝刺客。根據警方的說法，這件事其實是弄巧成拙的騙局，這名護士本意是想虛構攻擊事件而拯救薩夫拉，讓他印象深刻。只是，這起偽警報使得六十七歲的金融大亨與另一位護士躲到一間以鋼樑強化、被當成避難室的廁所。當火勢擴大時，警方敲打牆壁要薩夫拉出來。但就算他妻子莉莉打手機求他，那位'
  - '[PAGE 68]


    嚇壞的金融大亨就是不肯開門。等搜救人員終於打破那個碉堡般的洗手間進入時，發現薩夫拉與菲律賓女護士已因吸入濃煙嗆死，屍身蓋滿黑色煙灰。


    薩夫拉離奇死亡，使得匯豐這起一千多億美元的交易案籠上陰影，但沒有終止。就在親友還在日內瓦猶太教會所，哀悼薩夫拉之死的時候，美國聯準會批准那起交易案。


    利舊的企業文化扎根於瑞士，在當地，刻意視若無睹既是傳統也是法律。瑞士銀行界的守密傳統5，至少可以追溯到二十世紀初期。法國、德國周遭國家都加稅之後，兩國富人蜂擁到鄰國瑞士藏錢。瑞士的銀行接下來在全歐陷入動盪的第一次世界大戰環境中平安度日。


    隨著金融服務業愈來愈趨強大，瑞士銀行界加強其控制力。一開始，銀行從業員等人洩露帳戶所有人的資訊，還只是民事罪。一九三四年，瑞士把它改成刑事罪行，可處三年有期徒刑6。相形之下，逃稅還是違反民法而已。


    匯豐忠於自己殖民時代的根源，沒什麼想更改利舊的營運方式，生怕會因改革而減損利潤。英法聯軍在第二次鴉片戰爭擊敗清廷，打劫並焚毀圓明園五年後的一八六五年，香港上海匯豐銀行便開門做生意7。英國商人創辦匯豐，目的是為了周轉國外貿易，而把總部設在殖民地香港8。匯豐得到其極保守、遮遮掩掩又傲慢的名聲9。這間銀行之所以能夠對自己在香港極差的形象毫不在意，是因爲與政府關係良好、不存在披露需求，而且控制媒體言論。


    一九九三年，匯豐把總部搬到倫敦，藉著大肆購併其他銀行，想擺脫舊日的保守作風。匯豐盼望購併利寶，能讓自己登上稱為「聯盟表」（consorcio）的銀行排行之首。當時的'
  - '[PAGE 69]


    觀點是規模愈大愈好，很多銀行都由合併、購併，「瘋狂進食」而規模大漲。至於如何整合整併後不同銀行文化，管理分佈遙遠的跨國大企業，銀行經營者並不是這麼關心。


    匯豐高層認為，全球富有階級崛起，堪稱該行致富壯大的康莊大道。超級富豪愈來愈不在意意蘊籍。他們的往來銀行在日內瓦，住在倫敦、紐約，在巴黎、米蘭購物。他們持有資產的方式，是透過註冊於英屬維京群島等避稅天堂的的離岸公司。匯豐高層解讀各種跡象，知道新的貧富不均時代降臨，即便他們不承認這一點。匯豐的一份策略報告表示，各國政府正在抽走給公民退休金及健保的錢。無國界富人對自己的祖國沒什麼效忠之忱，想到繳稅給國家就嗤之以鼻。所以他們把自己的業務設在避稅天堂，銀行則用瑞士的，並覺得這麼做有其意義：瑞士的守密謹慎已經融入基因。這些趨勢代表財富管理業務大有商機。


    匯豐知道購併利寶有諸多危險，但置之不 理。利寶替犯罪階級服務的傳聞歷時已久。雖說瑞士銀行家替無恥之徒服務周到，像是女僕，有這種名聲很正常，但是對利寶的指控更是超過前述。到一九九〇年代末期，公共領域已有很多事實可以佐證。利寶主動參與骯髒商品交易，如黑社會最愛的鑽石及黃金。巴拿馬獨裁者諾瑞加在自己的國家洗錢，利寶就牽涉在內。美國司法部曾接獲爆料，俄國黑幫在使用利寶的代理銀行服務。雖說這些醜聞當中，牽涉到多家銀行，但利寶的名字一直赫然在目。


