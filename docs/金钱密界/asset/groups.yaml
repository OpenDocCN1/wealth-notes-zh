    # 情報界與避稅天堂


    福特（F. David Forte）是利寶銀行瑞士、盧森堡、摩納哥、巴黎、耿西、直布羅陀法務處部門主管，⁴¹ 也是盡職調查委員會成員。他負責向銀行高層提供反制洗錢建議。福特寬頰闊面，有娃娃臉，當過美國海軍軍法署（Judge
    Advocate General''s Corps）軍官，後來任職司法部。他在國際事務處刑事部門擔任高級法律顧問六年，與歐洲同儕合作，協助引渡，配合法律濟助，另與日內瓦檢察官署維持友善關係。匯豐買下利寶之後，新老闆把福特招至魔'
