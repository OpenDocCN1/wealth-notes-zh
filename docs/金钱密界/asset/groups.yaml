    司，就算沒幾千也有幾百家。俄羅斯銀行的網絡，透過以前跟莫馮有關係的瑞士律師，找上這家巴拿馬的律師事務所。


    # 我想，這件事很微妙


    在司法系統不管用，經濟又搖搖欲墜的俄羅斯，有機會捍衛自己財富的人都那麼做了。


    俄國政府統計，該國一九九九到二○一五年間，嘗到資本淨流出大約五千五百億美元的滋味²⁰，話雖如此，有人懷疑實際金額應該超過一兆美元。要把現金運出俄國，離岸公司是常用的工具。


    有時候，儘管這麼小心謹慎，依然有漏洞可鑽。莫馮就發現，有人想非法篡改一間它在巴拿馬註冊的公司。公司受益人是一位俄羅斯香料進口商。犯罪分子找一位當地律師兼譯者，想非法改動其董事群，從而控制那家公司。莫馮發現陰謀正在進行，於是制止。代表那位俄國進口商與莫馥打交道的奧地利律師表示，他並不吃驚。他寫電子郵件給該事務所：「這樣子取得公司方式很正常，在俄國天天發生。你的公司可能一夜之間就不見了。」


    對於普丁喜歡的人來說，國家是可以合法分贓的。季姆琴科（Gennady Timofeev）早在聖彼得堡時代，就是普丁圈內人。他也是俄羅斯銀行股東。季姆琴科透過石油交易機師賈茨（Gimzo）及國家出資的基礎建設專案，賺了幾十億美元。美國政府進一步斷定，普丁個人有'
  - '[PAGE 125]


    分買沃一杯羹。美國宣布制裁季姆琴科前一天，他就把自己的貢沃持股份賣掉了。


    美國財政部表示，季姆琴科與一問註冊在英屬維京群島的莫馮公司有關聯，公司名叫「南港管理服務有限」（Southport Management Services
    Limited）。它是設在列支䕶登的機構「席郭伊亞特魯漢德信託」（Seygolia Treeland Trusts）所創；該信託獨占一批東歐客戶，另與莫馮擁有密切且賺錢的工作關係。席郭伊亞特魯漢得信託巧妙將公司與基金會整合在一起，確保自己的客戶完全匿名。它跟莫馮至少造了二百二十二家公司，莫馮完全不知道那些公司歸誰所有。雖說莫馮要求全體客戶提供資訊，但席郭伊亞特魯漢得信託硬固拒絕透露自己公司所有人的相關資訊。根據在莫馮檔案裡找到的會議記錄，席郭伊亞特魯漢得信託甚至拒絕簽署莫馮捎給客戶的協議書。記錄宣稱：「他們不肯向我們透露受益人／終端客戶的詳情。²²」


    跟黑箱作業的席郭伊亞特魯漢得信託不一樣，俄羅斯銀行的公司網在莫馮的檔案裡列得清清楚楚。該行一名高層接洽瑞士「狄特利支鮑姆加特納聯合事務所」（Delétre,
    Ramsgatte），想設立一間空殼公司，於是找上莫馮，莫馮便在二〇〇六年三月，於英國維京群島註冊「檀香木大陸」（Sandalwood Continental）。檀香木大陸由俄羅斯商業銀行塞浦路斯分行（RCB）吸錢。俄羅斯外貿銀行有插股
    RCB。RCB 進行可疑的貸款安排，並持續從不尋常的便宜股票交易中得利。除了檀香木大陸，另外創設的四家公司，作為俄羅斯銀行的網絡，它們共參與約一百宗不同的交易。總計起來，它們陳列一長串糖果世界般的祕密利'
  - '[PAGE 126]


    益、酬僱及優惠貸款。


    為了藏匿其交易，設立這套公司網絡的那位俄羅斯銀行高層要求莫馮提供名義董事，供檀香木大陸及其他公司使用。檀香木大陸董事的名字——艾倫·亞歷山大及王，出現在幾十筆貸款及股票交易文件上，至少在理論上提供另一層保密。每份需要名義董事簽名的公司正式文件，都必須通過莫馮的巴拿馬辦事處，在當地它們被歸檔進事務所的檔案庫。


    書面上，檀香木大陸的指定所有人高爾定（Otsg Gould）是位小生意人，他在向RCB申請銀行開戶的文件上自述，擁有在一執法單位工作的經歷。創設檀香木大陸、指揮其活動的俄羅斯銀行高層要找一位比高爾定更清白的人，應該很難。只是對一個不起眼的人如高爾定，竟有管道取用數額驚人的資本。二○○九到二○一二年間，RCB提供檀香木大陸的信用額度高達八億美元。那家銀行提供這一大筆錢，給一位沒沒無聞的人，以及一間生意模式很模糊的公司，任其動用。


    即便是莫馮的巴拿馬合夥人，都注意到檀香木大陸與RCB之間的關係曖昧不明。RCB貸給檀香木大陸的第一批款項當中，有一筆高達一億三百萬美元。這筆貸款的數額，以及環繞貸款周遭的無解問題，叫莫馮人馬心生警戒。貸款文件上沒提到利率要多少、何時歸還、撥款目的是什麼。


    莫薩克用西班牙文寫電子郵件給合夥人：「我想，這件事很微妙。」莫薩克碰到可疑活動時，經常用「微妙」這個詞彙。這個詞彙的功用，好比修辭上的交通號誌黃燈——趁此'
  - '[PAGE 127]


    機會該停下來，重新計算莫馮該索取多少費用，以確保數字與事務所願意承擔的風險一致。


    莫薩克說，如果莫馮的名義董事沒有必要細節，就為這麼大筆金額簽字，事務所碰到來源及終點都可疑的撥款，只怕要親自在場」。若是貸款經證實不妥，事務所不想因此獲罪。佐林格附議，表示事務所沒先取得擔保函，豁免責任，就不該簽字。


    經過催促，指揮那筆貸款的俄羅斯銀行高層才多提供一點細節。這筆款項顯然是用來買油輪的。該高層制定還款時間，補上莫馮要的擔保函。貸款撥出，這不是俄羅斯銀行網絡透過莫馮而釋出的第一筆貸款，而且就莫馮合夥人所知，也不可能是最後一筆。單就這件案子，莫馮光是提供一些簽名，就進賺兩万多美元。未來會再賺錢的幽靈，在莫馮的算計天平上，可能占有一定的分量。合夥人於是對將來的交易打出綠燈，允許莫馮的名義董事簽字批准，讓歐盟銀行把數億美元，轉移給一間匿名公司。


    俄羅斯銀行的公司網絡裡，檀香木大陸充當的角色，是貸款的清算中心，也是信用卡，憑以支付雜七雜八的開支。它令人回想起本湖合作社的銀行帳戶，只是放大很多，依照莫馮檔案顯示，在一九九九年，檀香木大陸簽起的金額約六億美元，而在二〇一〇年至少有三百五十萬美元。這些錢大多流向其他公司製造者提供的公司，而非莫馮的。


    檀香木借出大約七十三萬七千美元，給一間索爾塔瓦拉市（Surat）擁有土地及飯店建築群的公司：索爾塔瓦拉位在景色怡人的拉多加湖（Lago Ladoga）北端。組織犯罪及貪腐舉報專家指出，當地有部分落格認定索爾塔瓦拉市可能有供普丁度假的大宅。幾年之內，檀'
  - '[PAGE 128]


    香木大陸借給俄羅斯「歐鐘」（Orla）公司一千一百三十萬美元，利率為1％。貸款的償還期限，經常長達二十年。貸款的條款另外變更還款貨幣，進一步降低歐鐘必須償還的總值。  香木大陸另外借出五十九萬美元，給地址與歐鐘相同的第二家公司，條件類似，理由是在拉多加湖蓋一間遊艇俱樂部。  俄羅斯銀行的克瓦恰克在收到香木大陸款項的時候，是歐鐘的共同所有人。此時克瓦恰克已成為俄羅斯銀行執行長兼最大股東。幾年後，美國政府把克瓦恰克列為「普丁帳房」之一。  檀香木大陸開始貸款給歐鐘一年後，克瓦恰克的公司在本湖合作社區不遠處，買下一大塊山坡地。歐鐘在當地蓋了「伊果拉」（Igora）滑雪度假區，據說目前成為普丁最愛的滑雪勝地之一。有間鄉區大宅矗立於當地，當地人宣稱它專供國家領袖使用。二〇一三年，滑雪勝地在森嚴戒備下，主辦普丁二女兒卡捷琳娜（Katerina
    Tikonova）嫁給基里爾·沙瑪羅夫（Kirill Samatov）的婚禮；基里爾的老爸尼可萊·沙瑪羅夫便是前西門子代表、俄羅斯銀行的大股東兼本湖合作社成員。


    # 普丁好友


    二〇〇七年，也是創設檀香木大陸一年之後，俄羅斯銀行高層開辦另一間公司「海外'
  - '[PAGE 129]


    鈴鐘」（Somette Overseas）。它的所有人比高爾確定更不可思議。書面上，公司歸普丁的好友、大提琴家羅爾杜金所有。羅爾杜金寬顱闊面，經常留著內捲式髮型，他在訪談中扮演優雅的對話人，讓普丁顯得人性化。設立海外鈴鐘一年後，俄羅斯銀行又另組一問公司叫「海外國際媒體」（International
    Media Overseas）。表面上第二間公司也歸羅爾杜金所有。對一個自稱音樂家、沒有经商經驗的人來說，他的公司展現出不可思議的獲利能力，能指導複雜的企業交易。


    神祕的付款由多重管道理進羅爾杜金的公司，包括股票交易。二〇一〇年，國際媒體公司答應購入俄羅斯科技公司「俄羅斯石油公司」（Rosneft）股票。另一問與莫馮無關的巴拿馬匿名公司則擔任交易的賣方。交易細節裡有項條款，表明本交易若未能順利完成，羅爾杜金的公司可取得約七十五萬美元的賠款。兩份交易文件同日出爐。第一份完成股票交易。第二份則取消第一份，因此啟動未成交條款，保證讓羅爾杜金的公司能收到橫財。如此這般，一筆說不通的付款，就能做到看似名正言順。


    另一項安排，對象是與一問開曼島匿名公司，內容涉及交換數量相同的俄羅斯軍火企業「俄羅斯國家技術集團」（Rosco）股票。因為數額相同，相互抵消，所以實際上沒有該集團的股票易手。接下來便交換協議在較早的日期生效，而開曼島匿名公司的股票在協議生效日期的價格，比真正簽署協議的時間還要更低，因此必須付差額給國際媒體公司。二〇一一年，一系列這種交易讓海外國際媒體進賺四十六萬三千八百美元。可疑的交易變得合法，檀'
  - '[PAGE 130]


    香木大陸也做類似交易，二〇〇八到二〇一一年間至少獲利四百萬美元。


    羅爾杜金的海外鈴聲公司野心甚至更大。它加入一個集團，進行祕密又複雜的計畫，打算控制俄羅斯最大卡車製造廠卡瑪斯（Kamaz）。莫馮檔案裡有幾份協議書，顯示公司持股比例及義務有所交換。這頂交易如果成功，大提琴家就可取得發言權，干預企業計畫、預算及外國投資人在卡瑪斯的角色。後來因為二〇〇八年金融海嘯，這筆交易未能實現。


    雖說他的公司那麼複雜，羅爾杜金對自己的商業利益，卻展現令人稱奇的放任態度。俄羅斯銀行的高層寫電子郵件向莫馮抱怨說：「我們有時候很難掌握國際媒體等公司（受益人）而取得他的簽名。」他建議迂迴繞過這個問題。羅爾杜金授權給另外一個人簽署文件；這樣子就不必去打擾那位音樂家。


    二〇〇八年，普丁卸下總統職。俄羅斯憲法規定總統不得連任兩期以上，於是他與自己的總理梅德韋捷夫換位子。這樣交換職銜不減普丁的權威。普丁二〇〇八到二〇一二年當總理期間，俄羅斯銀行的資產負債表規模增大一倍以上，由四十億美元到超過八十億美元。與莫馮合建的離岸網絡也高速運轉。


    普丁改當總理以前，俄羅斯銀行積極收購媒體。它買下電視網的擁有權，普丁接著把該電視網變成全國播送業者。俄羅斯銀行還拿下RBC-TV，這間電視公司談論理想的新聞報導，在老老闆擠壓下結束。俄羅斯銀行另外公開自己掌控最大廣告商「國際影視集團」（Video
