    ## 海外生意與憲法爭議


    他授權「招牌式」、有他姓名的開發案，完全按他規格去蓋。飯店酒店方面，川普集團經常以收受一定百分比的營收，來管理物業。美國以外的生財之道，使他變得愈來愈不在乎其來源。


    二〇一六年選舉之後，川普糾葛不清的外國生意，升級為國家安全及憲法在意的事。他的生意夥伴希望以新的方式，從自己與美國總統的關係中獲利，因此要判定川普政府的施政，是為了大眾利益還是營逐私利，變得愈來愈困難。同一時間，白宮與共和黨主宰的國會結盟，推動新的金錢密界政策方針，更能反映他們共同的放任意識型態。


    歐巴馬在任八年內，政府試圖把政策往更透明、監督離岸系統的方向移動。除了簽署二〇一〇年《外國帳戶合規法案》，政府試圖加緊管看管好比德拉瓦、內華達、懷俄明各州；它們兜售自己當安全港，提供鐵了心想逃稅、進行犯罪活動的外國人使用。


    遭逢律師、銀行家及州方官員激烈反對，歐巴馬政府改採細碎步驟，來對抗這項難題。它先通過試行方案，強迫邁阿密及紐約房地產仲介申報，那些匿名公司用現金購買房地產，真正的受益人是誰。話雖如此，法規只要求那些擁有房地產業利益達二五％或以上的姓名。財政部二〇一七年擴大這項施政。國稅局另頒布一條規則，要求設在美國的外國人擁有的責任有限公司，都取得「職工識別號碼」（Employee
    Identification Number，相當於企業的社會安全號碼，對收稅有其必要），還要記帳寫記錄以備稽核，指定能控制公司的一負責任人（Responsible
    Person）。


    最重要的是歐巴馬政府向美國富人加稅。川普及共和黨把加稅，尤其是富人稅，視為政府搶錢法令，只要有可能，必加以鏟除。國稅局堪比對抗美國富人透過金錢密界逃稅的前線部隊，卻資源短絀，歐巴馬治下，花費心血想替它增加款項，但面臨共和黨的抵抗，所以一事無成。打蒼戰期間，川普自稱自讚，唆使盡全力逃避繳稅。希拉蕊譴責他長年來避而不繳聯邦稅，川普的回應是：「這顯示我聰明。」


    川普上任幾星期，新總統及共和黨把持的國會就示意要終結歐巴馬對金錢密界的方針。國會在第一批重大投票中，廢止一項反貪腐施政。


    該法條原本強迫石油、天然氣及礦業公司，要向美國證券交易委員會做年度申報，詳述它們在有生意往來的國家，付給外國政府的款項。立法原旨在減少賄賂，它被廢除，對採礦業真是大禮，而採礦業透過數百萬獻金，幫忙共和黨競選。廢除那條規定，讓幾個川普的外國生意夥伴也受益，他們大力投資在石油及採礦產業。


    川普反對官方打擊行賄外國的種種行動，早已記錄在案。二〇一二年，在消費者新聞與商業頻道（CNBC）一場Call-in節目上，他把《海外反貪汙行為法》（Foreign
    Corrupt Practices Act）稱為「大爛法」而應予變更；該法強制美國公司調查跟自己做生意的人，以確保公司沒參與、協助非法活動。川普說：「其他國家前往那些地方，都做應該要做的事。」川普說，假如美國公司避而不行賄，「那麼到處都別想做生意。」


    ## 川普的俄國生意夥伴


    二〇一三年十一月，川普走在莫斯科環球小姐選美會紅毯上，滿面春風。他的俄國行程格外順利，即便普丁並沒現身。前一年六月，川普在推特發文推測普丁是否會參加時，口吻聽來簡直像普丁的大粉絲。川普問道：「你認為普丁會來十一月在莫斯科的環球小姐選美賽嗎？如果來，他會成為我最新好友嗎？」普丁沒來，而送上一只噴漆的裝飾盒及個人便箋。


    然而，真正的示好求愛，發生在選美會的邊廂。俄羅斯生意夥伴支持川普那次選美會，是阿拉斯及葉甫·阿加拉羅夫（Aras and Emiri Agharov）這對父子檔億萬房地產開發商。阿拉斯·阿加拉羅夫是普丁的密友，一個月前曾由普丁本人頒授俄國榮譽勳章給他。這趟行程中，阿加拉羅夫父子與川普討論在莫斯科興建組合式公寓大廈。


    在一場與阿拉斯·阿加拉羅夫共同作東的會議上，川普與一羣俄羅斯寡頭精英見面，包括普丁的前經濟部長、當時主掌俄羅斯聯邦儲蓄銀行（Sberbank）的葛列夫（Herman
    Grc）。俄國行之後，川普向《房地產週刊》（Real Estate Weekly）誇口說：「我跟很多俄國人關係很好，當時所有寡頭幾乎都到會場了。」


    自一九八〇年代起，川普一直想打進俄羅斯房地產市場。一九八七年，川普與第一任妻子伊凡娜（Ivana）前往莫斯科，與蘇聯飯店觀光局合夥，想找塊地蓋豪華酒店，但那起生意没能做成。一九九六年，他再試一次，这回与美国菸草业大亨们合伙，计画盖公寓大厦，只是也告落空。不到十年后，他与贝罗克集团搭夥（Burrock
    Group），研究想在莫斯科盖棟川普大厦。


    虽说这次莫斯科专案一样，未能开花结果，贝罗克与川普倒是完成其他几项案子。川普由贝罗克找到一个名声虽欠佳但很有意願的夥伴，而且与金钱密界及莫馥颇有联關。就算川普无法把他的生意带到俄羅斯，贝罗克倒是譲俄羅斯及东歐的钱向他流去，化爲可能。


    贝罗克的老闆是泰夫維克·阿里夫（Tozik Art），曾在蘇聯商貿部擔任經濟學家。在东歐集團分裂，政府官員及幫派瓜分公共财的時候，泰夫維克與他兄弟雷費克（Reik）拿到哈薩克的阿克秋賓斯克鉻化工生產聯合體（Aktubinsk
    Chromiumium Combine Plant）（鉻是鋼製品的重要成分）。泰夫維克·阿里夫与土耳其总统艾爾多安的親戚塔明斯（Turas）是生意盟友，而塔明斯拥有土耳其豪华連鎖酒店里克斯（Rixos），至少控有開莫馥公司（有些公司股東交互持股）。阿里夫也在美國開分公司，重新開發舊公寓大廈，還有布魯克林區羊頭灣（Sheepshead
    Bay），濱海一處購物中心。


    二○○八年四月，贝羅克控股巴哈馬分公司成立，接下來阿里夫在德拉丁、佛州及紐約也成立分公司。他把贝羅克的管審基地，設在第五大道川普大厦的二十四楼。二○○八年金融海啸之前，贝羅克現金充裕。等它還要更多錢的時候，錢就會魔法般出現。根據向紐約聯邦法院逸出的訴訟說，錢是他兄弟雷費克以土耳其基地，而他的生意透過很多家莫馮公司來經營。


    莫馮檔案裡，與阿里夫家族有關的公司至少二十五家，做的生意很廣泛——什麼都做，從出租私人飛機到銷售化學品、投資房地產。至少自一九九六年起，阿里夫兄弟就在金錢密界裡打滾，創設複雜隱密的離岸架構，有家莫馤公司甚至控有阿里夫家族基金會「瑞瓦那」（Rawaa）。與該家族主要生意組織「東鷹集團」（Oran
    Group）有關的離岸公司，還涉及國際足球貪腐。


    貝羅克高階職員當中，有一人是前股票經紀人及前科犯沙特（Frx Sx）。他出生在俄羅斯，成長於布魯克林，曾在酒吧打架時，把打破的瑪格麗特玻璃杯捅到同事臉上，而入獄坐牢。出獄後，一九九八年他參與一次與黑手黨有關、價值四千萬美元而開拾出貨的雞尾酒餃股詐欺案。他靠著搖身變為政府機密線民，而逃過這些犯行的重罰。沙特與川普結伴進行商務旅行至少一次，可是川普被問到沙特這個人的時候，宣稱只聽說過他的名字。


    川普二〇〇五年與貝羅克聯手，他提供品牌，而阿里夫的資金可以躲在背後與他合夥。他們最知名的合夥案便是「川普休南」（Inmsoo）酒店，那家高四十六層樓的公寓大廈酒店位在曼哈頓最时髦區之一。二〇〇六年，川普在他的電視節目《誰是接班人》（Ih
    Appcrricn）宣布這項專案。使用到他的名號及投資，所以川普收到銷售額的一五%，另有三%撥出來給他子女伊凡卡及小唐諾。


    二〇〇七年，阿里夫與冰島El Grupo 裁定五千萬美元的案子，資助川普休南及其他三個的與川普相關投資案，交換未來獲利。川普簽署文件，同意這項安排。El Group
    這家國際投資公司乘著冰島金融狂熱而起，股東們生產離岸公司的速度猶如紙風車，其中不少透過莫灣。金融海嘯爆發，揭穿冰島經濟奇蹟背後原來是詐欺與自買自賣，El Group
    就像死魚翻白肚了。到莫灣檔案搜尋 El Group，順藤摸瓜找到冰島各銀行、亂花錢的冰島超市連鎖、印度投資以及克伊普辛銀行盧森堡最大債務人，都提供貸款。冰島特別檢察官豪克森以侵吞企業款項約兩千兩百萬美元的罪名，起訴集團前執行長斯馬拉森（Harness
    Smarason），但那個生意人經審判後無罪開釋。


    貝羅克前員工克里斯（Toby Kiss）向公司提起民事訴訟，訴狀推斷 El Group 背後有些資金源自俄羅斯。克里斯聲稱，貝羅克多年來的營運手段，是「有跡可尋而持續相關的犯罪，包括郵件、電話及銀行詐騙；逃稅；洗錢；要陰謀；行賄；勒索以及侵吞。」他進一步聲稱，El
    Group 投資川普休南一案，事實上是買屋偽裝成貸款，藉以規避繳交大約兩千萬美元的稅金。貝羅克否認這些指控。川普堅稱，自己與這起融資無關，只出借自己姓名而已。


    雖說他簽過一份文件，上頭明白指出 El Group 幫忙融資川普休南，但川普在二〇一一一年一次採證說：「我不曉得誰控有貝羅克。我真的不曉得貝羅克的老闆是誰。」根據一本公司手冊，另位顯然透過貝羅克而投資川普休南的人，是馬什科維奇（Alexander
    Mashkevich），這位俄羅斯億萬富豪與另外兩人合為三人組，控有歐亞天然資源公司（Eurasian Natural Resources Corporation,
    ENRC）股份。該公司從採礦到營造都有涉足。馬什科維奇的發言人則表示，這位富翁從未投資川普林南或貝羅克。


    這位礦業巨擘與哈薩克終身總統納扎爾巴耶夫（Nursultan Nazarbayev）走得很近；納扎爾巴耶夫的孫子及其他親戚都有自己的莫馮公司。二〇一一年，歐亞天然資源公司背後的三大股東——馬什科維奇、喬迪耶夫（Pavel
    Chodiev）、伊布拉吉莫夫（Alisa Ibragimov）遭比利時指控洗錢。接下來，三人同意給付未經透露金額，與官方妥協，罪名便撤消，但他們也沒承認犯法。


    歐亞天然資源公司與莫馮淵源很深，至少可以回溯到二〇〇三年，當時便透過英吉利海峽的耿西島信託公司，跟那家事務所牽連起來。歐亞天然資源公司的公司當中，有些涉及剛果採礦。在西非，歐亞天然資源公司牽連到以色列鑽石商格特勒的行賄偵辦當中。格特勒也有多家莫馮公司及匯豐瑞士銀行帳戶。他否認有不法情事。


    二〇一四年，耿西中間商「聖彼得信託」（St. Peter''s Trust）想把十五家 ENRC 公司直接撤去給莫馮。事務所的法務部門審核此案，發現這些公司都與
    ENRC 有限（ENRC, Ltd.）公司有關，而那間公司，是歐亞天然資源公司三大股東與哈薩克政府聯合投資的風險事業。參與者都是政治敏感人物。而且，歐亞天然資源公司與剛果總統締結採礦協議，而備受爭議，接下來股價大跌，投資人被套牢，歐亞天然資源公司則被倫敦證交所摘牌。該公司在哈薩克及非洲面臨一大堆貪腐指控，正被偵辦之中。即使是莫馮也覺得，危險信號也太多了。事務所法務處人員寫道：「因為在調查過程中，發現太多負面影響，建議別接納這些公司到事務所麾下。」


    川普休南一開頭便運氣欠佳。經發現，工地是前非裔美以美教會（Metodist Episcopal Church）的墓地，構工時，工人們挖出以前埋在墓地裡的骨骸，隨著遺骸要挖要搬，工期延擱。施工時有位工人從四十二樓跌落而亡，身首異處。


    建築物落成之前，川普撒謊，說那將近四百套房賣得很快，已收到三千二百件申購書，但事實上在二〇一〇年四月，大樓開幕當時，只有約六十套房找到買主。伊凡卡還捏造銷售數據，公開聲稱那些房間已賣出六成。買主生氣了，提出告訴，指責銷售數據根本灌水。二〇一一年進行和解，一些買主收到訂金九成的退款。到二〇一四年，開發商賣出去的單位不到三分之一，逼得大樓破產被法拍。


    川普休南的買主當中，有一戶人家來自哈薩克，他們便是赫拉普諾夫（Kharapnov）家族，二〇一三年以三千一百萬美元買下三間套房。哈薩克阿拉木圖市指控那家人透過匿名公司購買房地產，是為洗白維克托．赫拉普諾夫（Viktor
    Khrapnov）擔任該市市長任內竄走的數億美元。赫拉普諾夫家族否認那些指控，聲稱自己是異議分子，受到哈薩克威權統治者、納扎爾巴耶夫總統的政治迫害。赫拉普諾夫家族另掌控幾家莫馮公司，而握有哈薩克的財產。


    赫拉普諾夫家的兒子娶了哈薩克寡頭精英阿里亞佐夫（Mulliar Atyazov）的女兒；阿布里亞佐夫及其同夥遭控侵佔BTA銀行六十億美元。在BTA銀行集團主席任內，阿布里亞佐夫據稱借了幾十億美元給從沒還錢的空殼公司。BTA在其官網上市了七百八十六家阿布里亞佐夫有股份的公司，其中幾十家出現在莫馮檔案上。


    川普休閒開幕幾個月後，泰夫維克·阿里夫與歐亞天然資源公司三人組登上長四百五十英尺（一百三十七公尺）、租來的遊艇「薩瓦羅納號」（Savarna）上，土耳其警方突襲那艘船，原因是懷疑召妓買春。船上男人們有九名年紀在十八到二十三歲的女子作伴。阿里夫跟他同夥買春想開性愛派對，其中甚至有十五歲的少女，警方監視已達幾個月。參與的男子都否認有犯意。而女孩們沒半個答應證詞。檢方只好放棄本案。


    這場娼妓臥底失敗幾年後，一間莫馮公司「佳明製鐵」（Zarin Ferrous Limited），其董事是泰夫維克·阿里夫的一個兒子，控告歐亞天然資源公司，原因是訂金兩億兩千萬美元被綁在二件巴西採礦協定上。兩年後，兩造和解。


    除了川普休閒，貝羅克還蓋了後來稱為「勞德岱堡川普國際大廈酒店」（Trump International Hotel and Tower Fort Lauderdale）的建築。川普在佛羅里達州有好些掛品牌的房地產。勞德岱堡開發案碰到與川普休閒類似的命運。二〇〇八年金融海嘯之後，開發商不再給川普錢，所以他這位房地產巨頭便宣布，與這家由二百九十八個單位組成的豪華公寓大廈酒店脫離關係。接下來打官司。那座物業價值還不起一億三千九百萬美元的貸款，銀行於是取消抵押品贖回權，進行法拍。


    光顧川普品牌的房地產的客戶裡，有許多俄羅斯人。據路透社分析，至少有六十三個拿俄國護照或地址在俄國的人，買下有川普名字的大樓物業約一億美元。那些買主中，很多有莫馮公司，包括「絕對集團」（Absolute
    Group, LLC）共同創辦人兼集團長特魯斯科夫（Antey Trusov），擁有俄羅斯最大銀行之一的「絕對銀行」（Absolute Bank），與普丁關係密切。


    巴拿馬有「川普海洋俱樂部酒店」（Trump Ocean Club），由川普冠名並簽有營運合約；俄羅斯人來買這裡的公寓套房如此頻繁，以至於銷售團隊與莫馮簽約，使用俄語翻譯服務。這處房地產的開發商哈菲夫（Rogo
    Khafi）還用該事務所來做其他事務。二〇〇八年，他有一度還問莫馮，是否有替伊朗人弄簽證的經驗，因為有些拿伊朗護照而往英國的人，打算來巴拿馬置產。


    佛州房地產直接進益於川普的交易，莫過把一處棕櫚灘豪宅，賣給俄羅斯億萬富豪雷波諾列夫（Dmitry Rybolovlev）。二〇一四年，川普在一場破產拍賣買下那棟大宅，價錢為四千一百四十萬美元。四年後，他把豪宅轉售給那位俄國寡頭精英，得價九千五百萬美元。雷波諾列夫可能從未踏進那棟房子。買屋幾個月之後，那位億萬富豪便打醜惡婚官司而焦頭爛額。雷波諾列夫買了幾家莫馮公司，而他堅稱，那麼做是為家人設想。但他的前妻說，那是用來藏匿離婚案資產的。男女雙方達成金額不詳的妥協案後，還同意拆了那棟豪宅。


    ## 貪汙腐敗的指控


    早在二○一三年，莫馮就曉得阿納爾·馬馬多夫（Anar Mammadov）這位三十三歲亞塞拜然商人的重要細節。莫馮的法務處將馬馬多夫的姓名，輸入「世界查核」查詢。「世界查核」是付費資料庫，莫馮憑這個資料庫判斷一些客戶有沒有被世界刑警組織通緝，或者深陷媒體負面報導。事務所取得他護照的影本。馬馬多夫還提供簽了字的財產來源聲明，文件顯示他是政治敏感人物，有位親戚是亞塞拜然政府官員。馬馬多夫甚至講明自己的離岸公司要做什麼商業用途，即保管資產與投資。


    莫馮的盡職調查指出，阿納爾的父親是亞塞拜然的運輸部長齊亞·馬馬多夫（Ziya Mammadov），還挖出不怎麼討喜的新聞報導。阿納爾·馬馬多夫是靠運輸特許權、公共營造專案及石油勘探，變成億萬富豪的。他宣稱，自己創辦該國最成功的商業開發公司之一，而當時他還沒滿二十二歲。那家公司可能只是他父親的幌子，阿納爾還在倫敦大學當全職學生，公司就經歷爆炸性成長。馬馬多夫家族专精於不招標的國家發包案及專賣權，而且擁有亞塞拜然最大計程車及客運公司。


    這些資料顯示，阿納爾不喜歡記者們窺探他的事情。亞塞拜然位居新聞自由指數底部國家，這是司空見慣之事；當地記者經常挨打、被關還有被殺。阿納爾控告過亞塞拜然兩家反對派報紙，說它們報導不實。記者們想拍齊亞·馬馬多夫等家族成員豪宅別墅的照片，照相機會被抄沒，然後被審訊三小時。


    美國一位外交官評論說，齊亞·馬馬多夫「即使在亞塞拜然，也算格外貪腐」。


    鑒於治理亞塞拜然的官員都是明目張膽的賊，美國外交電文說馬馬多夫特別引人側目，實在非比尋常。該國位在伊朗北邊的裡海畔，一度是蘇聯的戰略地區。一九六九年，蘇聯總書記布里茲涅夫任命格列烏高層蓋達爾·阿利耶夫（Heydar
    Aliyev）擔任亞塞拜然共產黨中央委員會第一書記。阿利耶夫掌權二十年，直到戈巴契夫因貪腐指控而摘掉他的職位。蘇聯解體的時候，亞塞拜然取得獨立，變成盛產石油的共和國。該國第一位總統因政變被罷黜後，阿利耶夫又回來掌權。二〇〇三年十月，也就是蓋達爾·阿利耶夫病逝兩個月後，他的兒子伊爾海姆·阿利耶夫（Ilham
    Aliev）贏得繼任他的選舉。小阿利耶夫接下來斬獲一次又一次壓倒性總統選舉勝利。選舉舞弊的程度，從二〇一三年亞塞拜然選舉委員會在選舉日前一天便公布選舉結果，可見一斑。


    莫馮無疑跟阿利耶夫的貪腐石油國很熟，原因是這位亞塞拜然領袖的子女都有莫馮的公司。阿利耶夫的兩個女兒萊拉（Leyla）及阿爾朱（Arzu）控制全國經濟相當大的部分，包括一間銀行、一間獨占的行動電話公司、金礦及營造公司。萊拉·阿利耶夫嫁給川普的俄羅斯生意通合夥人葉明·阿加拉羅夫九年。兩姐妹另透過兩家莫馮公司，來購買、斂聚全球豪華房地產，價值一億四千萬美元以上。經過大約十年，莫馮辭去其中一間公司的註冊代理人身分，原因是設立該公司的英國經銷商拒絕提供最新取得的盡職調查文件。至於兩女的另一家莫馮公司，作為經銷商的倫敦「柴爾德法律聯合事務所」（Child
    & Child）未能認出兩女是政治敏感人物。


    就馮馬多夫一案，莫馮確切跟著程序走。事務所曉得委託人是誰，是做什麼的。只是還是決定，透過歐西的經銷商賣幾家公司給他。莫馮把馮馬多夫列為政治敏感人物，「加強盡職調查」，但實際上也沒多做什麼。


    川普也把馮馬多夫視為生意夥伴。二〇一二年，川普與馮馬多夫的公司「加蘭特控股」（Granit Holdings）簽署授權合約，興建一間掛著川普名號的豪華公寓式大酒店。那座三十層樓建築物本已在亞塞拜然首都巴庫市某偏遠工地工程之中，重新命名為「巴庫川普國際大廈酒店」。專案兩年後透過公司的新聞稿公開宣布，內容掛滿最高級形容詞：「『巴庫川普國際大廈酒店代表川普集團不懈追求卓越標準，以及我們只參與全球最佳的開發案，』川普集團集團主席川普說，『我們二〇一五年開幕時，來賓及住客將體驗到巴庫前所未有的奢華住居——領先全球。』


    川普的人馬重新設計該大樓。他把內部空間挖掉，按川普集團的規格重建。伊凡卡·川普率領這次重新設計。據說，由木質隔間到造景，每項元素都要由她批准。伊凡卡貼出她戴安全帽在施工現場的照片，另外拍了支視頻稱讚巴庫專案。


    跟莫馮不一樣，川普有沒有對自己亞塞拜然生意夥伴做好盡職調查，這個不得而知。他的發言人對記者們說，川普有做全面篩選，但拒絕提出盡職調查的文件，甚至不肯說是誰審

    '
