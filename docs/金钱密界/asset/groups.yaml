    # 藏在自由港內的超高價名畫，免税！


    正如瑞士替外國人藏錢在銀行的技術高人一等，這個阿爾卑斯山國家也替藝術品做類似服務。藝術品交易在瑞士可達數十億美元¹。交易中心是日內瓦自由港（Geneva Freeport），它在市區西邊的工業區裡，儲存空間逾六十萬平方英尺（約一萬六千八百多坪）²。當地的主要建築群躲在安全圍籬牆背後，裡頭有一排多樓層的紅灰色貨棧。貨棧裡收藏近一百二十萬件藝術品³，從古羅馬古董到估計一千件畢卡索作品，琳琅满目⁴。總計起來，放在日內瓦自由港的藝術商品，保守估值在一千億美元以上⁵。它跟博物館不同，沒人能源見這些珍寶擺在一塊。藝術品鎖在保險櫃，很多案例顯示，櫃中物品只有物主知道。如果有人想隱姓埋名的話，一如很多自由港顧客，創立一間設在英屬維京群島或類似離岸轄區的公司裡，再用公司名義承租保險櫃。在瑞士，沒有規定離岸公司的受益人必須公開，因此自由港不會索取公司背後受益人的身分。然而，能吸引人到這個很有趣、看來很不顯眼的自由港，原因與其說是隱密，不如說是金融上的好處。只要藝術品待在自由港，它就免税。一個有錢人可以在紐約的拍賣會上買下畫作，把它送往日內瓦自由港，接下來除非它'
  - '[PAGE 136]


    離開這個水泥避稅天堂，不然沒有政府會向它收任何一分稅。


    日內瓦這個儲藏所歷史最悠久，另外還有其他專精藝術品的自由港，如盧森堡、摩納哥、新加坡、北京及德拉瓦。有錢人跟膽大妄為的人很喜歡這些地方。二〇一六年，義大利警方撬開放在日內瓦自由港某保險櫃內達十五年的板條箱，保險櫃租用者是間離岸公司。他們在裡頭發現一批無價的羅馬、伊特魯里亞時代的盜掠藝術品，把它們堆放在那裡的，是一名破產的英國藝術品交易商，他困在庭上撒謊，呈報自己資產不實，而被判有罪入獄。各國官方擔憂有更多案子還待踢爆，然而那是沒有辦法確認的，原因是自由港存貨盤點並不連貫。


    這些自由港不光儲存藝術品而已。交易銷售也在它們的範圍內進行。有時候，藝術品只是由賣方的保險櫃轉到買方的，而現金則由空殼公司的帳戶轉支。藝術品從沒離開自由港區域。


    全球各國官員都怕這種事可供洗錢。可想而知，洗錢者可以在同一個所有人的不同離岸公司之間虛構交易。那些離岸公司接下來在自由港內，以哄抬後的價格買賣物件，價差使現金得以洗白。這種交易甚至可以納入根本不存在的品項，自由港則替這種安排提供合法的假像。我們無法確知，這些做法有沒有發生？有多頻繁？


    對確實存在的藝術品進行轉讓的交易準則已經發展成熟，可以讓參與者都不透露姓名，並讓詐欺的可能減到最小。在自由港內營運的各機構擔任第三方，代管購買價，並充當藝術'
  - '[PAGE 137]


    品的監管人。碰到適當時候，他們監督買賣，確保雙方不受損失。有些公司在自由港內甚至 有實驗室，可以檢驗畫作真偽，或者進行修復。


    藝術品生意靠著隱密而欣欣向榮，自由港只是其中一例。按估計，全球藝術品交易每年 達三百億美元^7，其中逾半數藝術品買賣是私下進行的^8。參與這個行業的人，都發覺金錢
    密界很有用。匿名公司有助於替買方賣方搭橋的經紀人，讓他們避開曠日廢時的公文作業。 經紀人因資訊不公開獲取的利益，跟藝術品本身一樣多——有什麼要賣，誰想買，出價多
    少。所有權藏而不宣，讓中間人可以控制那些資訊。大拍賣公司如佳士得 (Christie''s)、蘇 富比 (Sotheby''s) 也因隱密而受益，交易背後，買方賣方的身分全都遮隱藏起來，可以推高喊
    價或保障售價。最後買賣雙方自己都用離岸公司來藏匿活動，不讓任何人知道，包括稅務人 員、親戚及生意夥伴。


    除了保密不可，避稅天堂、自由港及匿名公司對藝術品交易還有很多助益。由於一幅畫 從購買地送到買家的指定地點，可能需要經過多個國家。選擇在避稅天堂營運，對金融與後
    勤物流來說都相當明智。在碰到訴訟官司時，也能提供一定程度的保護。自由港提供不受天 候影響、最先進的安全保管，讓保險費用降到最低。一幅昂貴畫作掛在家中，要花的保養更
    高。


    莫馮檔案裡蒐羅許多藝術品生意的重要人物，顧客們利用匿名公司交易藝術品，然後撤 去自由港。檔案裡查得出來的藝術品交易數量，可能只占真實發生的零頭。莫馮售出的公司'
  - '[PAGE 138]


    裏，絕大多數後來都不再與業務所接洽。因為自由港的所有人沒有公共註冊處，要想了解有多少莫馮的公司把值錢物件藏在那裡，或者換個方式參與藝術品交易，實在很難。


    藝術品向來是很方便的工具，可以用來儲存及運輸價值。銀行倒閉或發生動亂時，人們要逃走前都會收拾自己的珠寶及藝術品。小小畫作但價值數百萬美元，可以放進手提箱裡。


    另外，藝術品蘊藏人類情感的方式，不是冰冷現金能相比的。比起買賣遊艇或者購買房地產，更是如此；莫馮檔案裡發現的很多藝術品交易，都夾帶著家族大戲，還有個人一生的大起大落。


    自由港的概念本身可以追溯到十九世紀，當時有所謂的「保稅區」（bonded area），用以暫時存放大宗商品如穀物、菸草及工業製品。它們逐漸轉型，變成免稅藏寶窟，替超級富豪貯藏藝術品、古董、珠寶、鐘錶及名酒。今天存放在意力自由港的物件，六五以上是藝術品及古董。


    與保稅區從貯藏乾貨轉變為包管貴重物同時發生的，是藝術品收藏行為的變化，這種變化隨著全球政權商名流權力與行動力而加速。以往藝術品收藏者會把自己的珍藏，捐給自己的居住地的博物館。全國稅收系統提供誘因給這類捐贈——例如慈善稅捐扣抵。今日的富豪們被綁在某一地區或稅收體制的程度減弱。到二〇一四年，七六%的收藏家購買藝術品，是投資策略的一部分。一度用來裝飾豪宅牆壁，用以誇耀地位，或者知識淵博的收藏家當成賞心樂事的藝術作品，現在則充當投資標的而擠聚起來，經常祕而不宣，而它們的價值節節上'
  - '[PAGE 139]


    升。這種藝術生意的轉變，也顯露在莫馮的檔案上。


    # # 祕密交易


    除畢卡索家族以外，私人手上最大量的畢卡索作品收藏，一般相信就在日內瓦自由港裡。那批畫作屬納瑪德（Zanmad）家族所有，他們是敘利亞籍猶太人，率先將美術作品商品化，買下畫作，保管在日內瓦自由港，直到它們在市場上的價格來到很誘人的地步為止。


    該家族也是莫馮的老客戶，歷史可追溯到一九九〇年代，哥瑞羅的日內瓦辦公室那時。


    納瑪德家族靠炒匯賺到第一桶金。一九五〇年代開始改投資藝術品，帶頭的是裘寶佩·納瑪德（Griseppe Zanmad），三兄弟裡的大哥。裘寶佩以英文的喬（Joe）這個名而著稱，在羅馬、米蘭、菲諾港及倫敦都有公寓，而且
    在公寓牆壁上掛滿美術作品。這種奢侈的生活方式，讓他的朋友們戲稱他為「法魯克」（Fawork），¹¹ 比喻他為那個愛炫富的埃及統治者：¹²法魯克的收藏品從珍罕錢幣到名車無所不包，令人稱奇。


    裘寶佩·納瑪德為了經商逐利，偶爾會故意挑戰一下法律界限。¹³ 一九五七年 在義大利，曾因持有值七萬美元的贓物，被捕而短暫入獄。四年後，稅務人員偵辦他，說他炒股九千萬
    百萬元但沒繳稅。一九六〇初期，裘寶佩·納瑪德手頭不 便，便叫他兩個還十幾歲的弟弟艾茲拉（Ezra）跟大衛（David）賣掉一些他的藝術品。兩個弟弟做得風生水起，便開'
  - '[PAGE 140]


    始到巴黎廉價購畫，到米蘭轉售，而取得更漂亮的價錢。一種生意模式於是展開。


    接下來幾年內，納瑪德三兄弟因手腕靈活、資金周轉有創意而名聲鵲起^{14}。過程中，他們蒐集到十億美元的藝術品，成為全球藝術品市場的台柱。拍賣公司得找他們提供畫作，免得拍品不夠。市場走跌的時候，納瑪德家族就買進，讓價格持穩。除開一場性騷擾官司，還有一個孫子參與一個設在紐約市川普大廈的俄羅斯賭集團營運以外^{15}，納瑪德家族大致上躲開爭議——直到一幅畫遭控是納粹劫掠品，把他們拉上法庭，還有巴拿馬文件，把他們的祕密經商活動，揭露給全球有心人知悉。


    納瑪德兄弟註冊第一個莫馮公司「史雲頓國際」（Swinton International），是在一九九二年，但是他們可能在更久之前，就在用離岸服務了。史雲頓國際開設三年後，又開了「國際藝術中心」（International
    Art Center），只是後者很可能早就存在於另一個離岸轄區。莫馮檔案裡有份文件提到一間同名公司，於一九八九年十月買下寶加（Etgar Degas）的粉蠟筆畫作《芭蕾舞女》（Dancer^{16}）。


