    # 對記者宣戰


    選舉之夜，川普與土耳其總統艾爾多安通電話時，替伊凡卡做了宣傳。川普告訴艾爾多安，她是他的粉絲兼支持者。電話裡，他推崇自己女兒是川普土耳其建設案的成功關鍵，他已授權該酒店使用自己姓氏。


    二〇一二（2012）年四月，伊斯坦堡川普大廈落成典禮上，伊凡卡就在川普身旁。前一天，艾爾多安才替大廈開幕典禮剪彩。那些四十樓高而連結起來的住商大廈主打公寓、高級店面、健身房、游泳池及電影院。當時，伊凡卡向土耳其媒體說：「四年前我與雅爾琴達見面，開始討論本案時，非常興奮。雅爾琴達與道昂家族結成姻親；川普描述道昂家族時說他們超越生意夥伴。還變成要好朋友。」


    美國總統競選時，艾爾多安說，自己很後悔前往該建築物的開幕典禮，而且要求把川普的姓，由大樓群除掉，原在川普說「不能容忍在美國的穆斯林」。那番談話是另個例子，顯示土耳其總統與道昂家族的關係陷入緊張。


    道昂家族的大家長艾丁．道昂（Aydin Dolan）多年來靠著撇弃土耳其政治勢力互鬥而興起，主要是透過他握有的媒體，尤其是《自由報》（Hürriyet）及電視頻道「CNN土耳其


    倒是很醒目。'
  - '[PAGE 334]


    其「〔CNN Inc.〕」與「[[Rand.D.]]」。他旗下的集團擁有十多家媒體，外加房地產、金融服務及能源生意。他在艾爾多安的「正義與發展黨」〔A.D.
    P.R.P.〕故技重施。道昂某些媒體一直攻訐正義與發展黨，直到二〇〇七年總統選舉正義與發展黨勝選。一等艾爾多安鞏固土耳其其黨統治，以往讓道昂吃香的策略，就變成一大累贅。


    二〇〇九年，道昂控股因未繳稅而被開罰二十五億美元，幾乎等同公司的總價值。 65道昂的出品部也受到攻擊、恫嚇，包括呼籲杯葛它們，以及攻擊他旗下媒體記者。二〇一六年三月，土耳其檢察官起訴道昂及四十六名同夥，罪名據說是二〇〇一到二〇〇七年間惡意逃稅，當時一千人等是燃料零售商「歐菲西石油」〔Petro
    Otis〕的所有人。


    歐菲西石油二〇〇〇年由一間澤西信託公司成立於巴哈馬。公司一開始名叫「利莎投資」（Lyssa Invest）。幾年之內，公司便轉到莫馮麾下。莫馮倫敦辦事處與該公司董事伊斯凱夫耶利〔Orta
    Iskerler〕開會，會議記錄中，他描述歐菲西石油為「土耳其其最大石油零售公司。 66年營業額四十億英鎊」。伊斯凱夫耶利後來隨著道昂被起訴。道昂控股執行長達爾巴茲（Metin
    Turan Darbas）也是歐菲西股東之一。


    這家巴哈馬公司是莫馮旗下與道昂控股有關的幾家公司之一。道昂的女兒中，三個有莫馮公司，大多在二〇一三年艾爾多安升高對道昂家族施壓時停止運作。還在做生意的「格連杜恩有限」（Grundoon
    Limited）公司設址在英屬維京群島的阿卡拉大樓。依據資金來源聲明，公司主要受益人為巴曼貝克（İmre Batmarker）， 67即道昂控股的集團副主席。根據該'
  - '[PAGE 335]


    表格，公司成立目的是投資金融市場。


    面對艾爾多安施壓，道昂便下台，不再經營家族生意。他女兒阿爾朱漢·道昂（Anzhuan Doeç）繼任他為集團主席，而她丈夫雅爾琴達被提名為執行長。被駭來而由維基解密流出的電郵顯示，雅爾琴達十分賣力，想討艾爾多安的歡心68。他的做法主要是走艾爾多安女婿兼能源部長阿爾巴伊拉克（Barat
    Albayrak）的後門管道；土耳其很多人相信，阿爾巴伊拉克正受栽培，當艾爾多安的接班人。電郵另指出，雅爾琴達努力刪除道昂媒體中，批評艾爾多安的新聞。有封電郵中，雅爾琴達說自己CNN土耳其台的主播是「敵人」。另外電郵顯示，有個土耳其媒體人，把國際調查記者同盟貼上網的巴拿馬文件資料庫，整理出來的土耳其人與他們的公司清單69，轉寄給阿爾巴伊拉克。


    雅爾琴達雖然否認電郵是他寫的，只是維基解密流出來的資料，還是逼得他辭去道昂公司的職位。艾爾多安攻擊土耳其記者的力道不輟。截至二〇一七年八月，土耳其政府已逮捕二百多名記者及媒體工作者。在美國，雅爾琴達的生意夥伴川普搖身變成美國總統，也對記者們宣戰，貼標籤說他們是做「假新聞」的人。'
