- raw:
  - '[PAGE 62]


    Administration）的臥底幹員、綽號「紀KIKI）的卡馬蘭那（Enrique Camarena）打進卡路．昆德洛興旺的大麻生意。他帶領緝毒署來到契瓦瓦（Chihuahua）州北部的「水牛」（El
    Burro），一座龐大的大麻種植場，找到一千多畝的大麻作物。墨西哥士兵摧毀的毒品，價值可能達數十億美元。被怒火及偏執弄到抓狂的卡路．昆德洛出擊。一位來自美國明尼雅波利的小說家，以及一位來自渥太華的牙醫學生名列第一批被殺害的對象。他們兩人是朋友，不慎走進瓜達拉哈拉市外薩波潘（Zapopan），一問卡路．昆德洛擁有的「瘋狂龍蝦」（Crazy
    Lobster）餐廳。那位大毒梟當時在裡頭辦私人派對。飲酒取樂的人懷疑那兩位學生是緝毒署幹員，便綁架起來，用刀子及冰錐在廚房裡虐殺他們，再把兩具屍體埋在當地公園。其中一人被丟進地洞時，其實還活著。


    翌月，卡路．昆德洛的手下在卡馬蘭那離開瓜達拉哈拉市美國參事館後抓到他。那位三十七歲的前陸戰隊員，被抓到卡路．昆德洛一座豪宅後頭的小房間，遭香菸燙、折胎棒打、折磨了兩天。酷刑期間還叫醫生待命，保持那位緝毒署幹員活命。在墨西哥局當局發現卡馬蘭那殘缺的屍身以前，卡路．昆德洛已登上軍事商務噴射機，離開墨西哥。


    是年三月，卡路．昆德洛前往哥斯大黎加，在當地與律師普拉．霍里特（Loreta Alia Horlitt）做生意；那位哥斯大黎加律師有一堆幹壞事的客戶。幾年前，美國政府想把起訴書遞給逃亡中的金融業者費斯科（Robert
    Vesco），罪名是洗劫一個共同基金達數億美元，美國大使館建議，把文件交給費斯科律師團成員的普拉．霍里特。莫馮事務所早期，'
  - '[PAGE 63]


    曾把巴拿馬籍公司，賣給普拉．霍里特，還有幾名費斯科的合夥人。


    四月四日，哥斯大黎加官方以販毒相關罪名，逮捕卡路．昆德洛<sup>31</sup>。他停留哥斯大黎加那段時間，輪流轉住自己的四棟房子，在最棒的餐廳吃晚餐，開豪華轎車旅行。雖說這次逮捕廣獲矚目，但普拉．霍里特成功不讓自己浮上檯面。卡路．昆德洛被引渡到墨西哥兩星期之後，普拉．霍里特代表該毒梟向莫薩克註冊第一間巴拿馬籍公司（後來還有第二家）。他需要最大程度的保密，於是付錢給莫薩克，叫他擔任公司的一名董事。莫薩克顯然不曉得受益人的真實身分。兩家公司裡，至少有一間控有一棟占地廣闊的豪宅，地點在哥斯大黎加首都聖荷西市郊區。


    一九八九年，墨西哥法官判決卡路．昆德洛坐牢四十年，為該國當時最高刑期。美國執法單位後來指控，這名毒梟在牢裡繼續指揮他的生意。財政部制裁卡路．昆德洛的親友，原因在他們幫他把巨額財富投資在合法生意。普拉．霍里特的客戶入獄且財產被充公，便不再付錢給莫馮。兩家空殼公司陷入難換。普拉．霍里特於二〇〇四年耶誕夜去世<sup>32</sup>。


    一年後，一位莫馮的律師發電子郵件給事務所掛名合夥人說，哥斯大黎加國家奧林匹克委員會主席兼祕書長帶著一個棘手的問題來到辦事處。哥斯大黎加政府把卡路．昆德洛的豪宅，送給奧委會當新總部<sup>34</sup>，但奧委會無法合法取得產權，原因在該毒品大王透過莫馮的巴拿馬公司，技術上仍控有房子。


    奧委會希望身為公司董事的莫薩克，能把豪宅「捐贈」給奧委會，以避免繁琐的法律程'
  - '[PAGE 64]


    序。把一棟技術上仍屬於全球最令人畏蕈的房子捐贈出去，對莫薩克而言，這個建議極不明智。事務所決定，莫馮的名義董事都辭去職務。哥斯大黎加人要房子，自己去做平法律問題。


    莫薩克在一封西班牙文寫的電郵中說道：「相形卡路·昆德洛，大毒梟艾斯柯巴（Pablo Escobar）只能算是吃奶的嬰兒！我可不想成為卡路·昆德洛出獄之後，會去算帳的人。」


    莫薩克自保的本能，經證實為先見之明。二○一三年八月九日，瓜達拉哈拉一位法官以法律細節為由，無預期釋放卡路·昆德洛，比他刑期服滿還早十二年。美國還沒能引渡他之前，卡路·昆德洛就消失了。直到本書寫作時，他的名字還高居緝毒署逃犯名單之首。'
