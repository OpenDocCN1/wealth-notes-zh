    Luminous 的圖表上，北極星占居螢幕中央，幅條扇狀散開，接觸到銀行帳戶、律師及信託。點擊每個幅條，都讓記者可以探索資料庫裡的關係。卡布拉曉得自己的展示讓大家留下印象；她在機場等候搭機回馬德里時，手機不時亮起收到訊息，與會者捎來消息說博坦剛剛去世。


    前來巴黎開會的記者當中，普拉特納（Titas Platnas）與比雷（Francois Piri）是好朋友，但受雇於兩家彼此競爭的對手報。兩位記者任職於瑞士媒體公司
    Tamedia 的時候，曾併肩合作於離岸解密不可只是接下來比雷職，加入Tamedia 的對手榮格（Rutger）集團。因為兩名記者都想參加匯豐專案，兩家對手媒體同意組成聯盟，甚至分享新聞撰稿人署名。Tamedia
    以德文刊登，榮格則用法文。這種情況就好像《華盛頓郵報》及《紐約時報》不僅合作，還准許自己員工掛名在對方報紙——一切只為新聞影響力更大。


    瑞士評論家及政府官員在離岸解密發表後，曾公開嚴厲批評 Tamedia 的記者們。逃稅是瑞士金融體系基礎的一部分，而創設離岸公司則是該系統的重要組件。收受有財有勢人物的錢，哪怕他們是外國官員，在瑞士並不被視為值得吵的醜聞。但稅收因此被剝奪的其他國家，看待這件事則大不相同。法爾恰尼的檔案裡，約莫有三千名法國公民使用匯豐的瑞士私人銀行。法國政府調查行動中判定，那三千人當中，為自己瑞士銀行帳戶而繳稅的，只有'
  - '[PAGE 252]


    六人。


    Tango 調查部主任齊爾曼從這批匯豐資料庫瞧出機會。除了逃稅資料，檔案裡還直接點出犯罪分子的姓名，其中包括毒販、軍火走私者，以及其他靠著為非作歹而發財的人。他認為，假如團隊詳細寫出犯行，指出被害人，那麼他們的同胞對瑞士與貪腐系統的串通，就不可能裝沒看見。


    Tango 專盯瑞士鑽石商夏洛普（Emmanuel Chalup）一類的匯豐客戶；夏洛普的瑞士匯豐行員二〇一五年便注意到，夏洛普一遭到比利時稅務當局壓力，官方正在調查他在鑽石稅詐欺的活動」。五年後，夏洛普遭比利時上訴法院判決有罪¹⁸，罪行為幫忙獅子山「革命聯合陣線」（Revolutionary
