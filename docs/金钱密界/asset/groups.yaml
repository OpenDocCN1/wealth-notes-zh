    為什麼前納粹分子會認為，兜售重振光榮的美夢能讓葉哈茲輕易上鉤？從美國陸軍的一份評估報告可見端倪：「（葉哈茲）受過廣泛但膚淺的政治教育，完全沉浸於納粹意識型態。他是標準的（希特勒青年團）領袖，仍然活在呼喊納粹口號的自我世界裡，是希特勒治下德'
