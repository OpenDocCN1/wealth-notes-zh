    ## 國際調查記者同盟


    國際調查記者同盟是「公共誠信中心」（Center for Public Integrity）的產物，也是非營利調查新聞界的先驅之一。中心創立於一九八八年，創辦人為劉易士（Charles
    Lewis）。劉易士是電視新聞節目《六十分鐘》（60 Minutes）的前製作人，因為上司要他刪剪節目的一個段落，因而從哥倫比亞廣播公司辭職。劉易士的口頭禪是：「絕不要讓那些混帳弄得你沮喪、恫嚇你。」中心把這句話印在滑鼠墊上。在他引導下，公共誠信中心成為新聞界戰鬥部隊，踢爆柯林頓及小布希政府許多事，包括大金主可以在白宮林肯臥室過夜，還有哈利波頓獨家承擔政府許多軍火發包案。


    一九九二年在莫斯科舉行的國際新聞學大會上，劉易士靈光一現。公共誠信中心在對抗的命題，從政治貪腐、環境破壞，到侵犯人權及金融詐騙，並不受限於國家疆界。全世界偉大記者調查這些主題，都是單打獨鬥。劉易士想造出一個網絡，讓多個國家的最強調查記者能通力合作，報導舉世矚目的新聞。他花了五年，才籌到創設國際調查記者同盟的資金。


    一九九七年，公共誠信中心邀請一批世上最頂尖記者搭機前來美國，參加在哈佛大學舉行的開幕大會。劉易士對他們說，他不要什麼，只想幫忙。


    在這樣的和樂氣氛下，有人感覺出一定程度的權威專制，但並非來自劉易士本身。有人質疑，國際調查記者同盟是否是獨占組織，而不是公共誠信中心的附屬單位；公共誠信中心的英文頭字母簡稱，聽來好像美國的情報機構。


    《衛報》的大衛．雷伊（David Leigh）說：「會場氣氛讓人覺得，國際調查記者同盟是把美國的新聞標準，帶給愚昧可憐的開發中國家歸化人民。」雷伊是國際調查記者同盟的初始成員之一。


    雷伊與另一位創始成員坎貝爾（Duncan Campbell）出力，讓該組織取得第一次新聞大成功。他們向許多國家的新聞夥伴提供一萬一千份英美菸草（British
    American Tobacco）公司（雖是上市公司卻大致上接近不得）的內部資料，進行一次跨境調查，得知菸草公司如何規避健康法規及洗錢。這項壯舉，只是即將到來的洩密調查的初級版，仰賴當地記者共享知識與資料。初步報導見刊於二〇〇〇年一月的《衛報》，讓國際調查記者同盟取得公信力。其他專家跟進，報導的主題包括軍火承包、美國對死刑行刑隊的支持，以及水源私有化。


    二〇〇五年，劉易士由國際調查記者同盟執行總編離職。失去他的視野及人格力量後，國際調查記者同盟枯萎了。形式上國際調查記者同盟還有數十成員，但該網絡本身幾無建樹。成員對它的營運，直接投入幾乎是零。公共誠信中心也過得很艱辛。最初劉易士替公共誠信中心創造一個完全由記者組成的理事會。理事會逐漸變形為推舉來籌款而非新聞的單位。中心難以適應數位時代，以及數目日益增多的非營利新聞組織，也難以爭取有限的金援。


    二〇一〇年，公共誠信中心被索羅門（Josh Soloman）傷害很重。索羅門言詞便給，是一個精力充沛的新聞創業人士，他矢言讓中心創新並取得資金。他的提案表面上看來很可笑，做法包括一天刊登到二十則原創的調查報導，而且一年賣掉五萬則網路訂閱，每次五十美元。當時，該中心依然很幸運，能收集到一萬次臉書按讚。公共誠信中心理事長布森伯格（Bill
    Bunode）及理事會接納索羅門的幻想，任命他為執行總編。


    當時的國際調查記者同盟主任卡普蘭（David Kaplan）看破索羅門的保證不可能達成，雙方衝突難以避免。因此當國際調查記者同盟發布調查報導，主題是總值達數十億美元的藍鰭鯨黑市，兩人的矛盾爆發開來。過度漁撈讓鯨魚數量大減，而旨在防止過度漁撈的多國法規體制並不管用。國際調查記者同盟的團隊取得管道，得窺追蹤鯨魚漁獲量的多國法規資料庫。團隊的調查揭露，該資料庫庫資訊嚴重不完整。


    索羅門接下來攻擊卡普蘭與國際記者團隊，說他們非法進入該資料庫，還付錢給報導裡援引的專家顧問。索羅門把指控提呈給公共誠信中心的理事會，理事會聘請法律事務所調查。調查證實國際調查記者同盟沒有任何不法。理事會成員兼哥倫比亞大學新聞學教授科羅爾
    (Stella Cowing) 堅持該向大眾澄清真相，但卡普蘭最後決定辭職，不想再當索羅門的部下。四個月後的二〇一一年五月，索羅門也辭職了，讓公共誠信中心士氣低落，財務岌岌可危。公共誠信中心理事長布森伯格接下來花了三年，才把瀕臨分崩離析邊緣的組織整合復元。


    那年九月，賴爾抵達華府，對漁業專案的爭執，還有索羅門遺留下來的滿目瘡痍，大致一無所知。布森伯格幫忙賴爾，把他妻子波特尤絲 (Kimberly Porter)
    也哄來美國，給她中心數位部主任的職務。勞動節那個週末，華府吹著暴風雨，賴爾夫婦前來美國展開新生活。他們頭幾天花時間找房子，華府房市供不應求，他們徒勞無功。勞動節當天，賴爾走進公共誠信中心及國際調查記者同盟空蕩的辦公室，面見新老闆。


    布森伯格對賴爾說，他已經把承諾給波特尤絲工作給別人了。而且，賴爾發現，國際調查記者同盟的預算、員工數目也不一樣。原先承諾的預算一百五十萬美元，此時剩不到一半，確實的員工為六人而非七人，而且因預算被砍，他到後不久就減為四人。賴爾悶悶不樂地回到飯店。波特尤絲外出購物去了。衣櫃裡掛著嶄新套裝，準備第一天上班穿著。賴爾鼓足勇氣，才說得出新狀況。他在澳洲《坎培拉時報》(Canberra
    Times) 的副總編輯空缺已有人補上。後路已斷，無法回頭。


    幾個星期後，滿懷罪惡感的賴爾把波特尤絲留在華府一間沒家具的房子裡，搭機去基輔參加「全球深度報導大會」(Global Investigative Journalism
    Conference)。這項會議及其他國際新聞學聚會提供場合，讓國際記者們能見面，飲酒聯誼個數小時，這對國際調查記者同盟未來的各項合作專案至關重要。


    伴隨在賴爾旁邊的，是國際調查記者同盟資歷比他還早的副主任格拉瓦（Muras Walter Guvara），她是阿根廷記者，曾替卡普蘭效力。格拉瓦在祖國阿根廷就是調查記者，二〇〇二年得到《費城詢問報》(The
    Philadelphia Inquirer) 的研究獎學金，到美國讀書六個月，當時費城詢問報的聲望很高。是年，阿根廷陷入經濟危機，為了養活母親，她一邊留在美國繼續求學，一邊在各種新聞機構工作，直到落腳於國際調查記者同盟。格拉瓦對開發中國家十分熱稔，組織能力也十分出色。她很友善也很有魅力，但有必要時也很強硬果斷。最重要的是，國際調查記者同盟的國際成員們很信任她，他們當中很多人仍對藍鰭鮪紛感到憤怒，認為美國過分影響國際調查記者同盟。


    毒舌的瑞典電視記者兼國際調查記者同盟成員勞倫（Lotta Lamm）說：「格拉瓦不是偏執的美國人。她真正了解這個組織要做什麼，了解世界重於美國。」


    二〇一一 年 到 華 府 的 團 隊，包 含 勞倫 及 雷伊，都 是 在 基輔 的 全 球深 度報 導 大會 招募 到 的；賴爾 在當 地讓 許 多國 際調
    查記 者同 盟成 員認 識了 他。賴爾 特別 需要 《衛報》 參 與，如 此 可以 使專 案更 具公信力。每 位成 員都 必須 遵守 某些 基本 規則 才能
    合作。他 們同意 同時 發布 新 聞，沒 有人 會洩露 資料，大 家必須 維繫 新聞 標準。


    記者 們返 國後 沒多 久，裝滿 賴爾 資料 的硬 碟便 裝在 橡膠 盒裡，由 聯邦 快遞（FedEx）送 達。當 時，國 際調 查記 者同 盟對 資安 並不
    特別 在意。這 批資 料完 全沒 有加 密，只 是賴爾 還 是 覺得， 硬碟 別送去 俄羅 斯比 較好。


    處 理這 些資 料與 了解 它們 是兩 回事。格 式有 多種，比 如很久 以前 就已 廢棄 的舊 式電子 郵 件系 統，還 有掃描 的文 件，除 此之外，資
    料裡 找到 的人名、公 司名 是用 不同 的試 算表 格式， 必須 設法 搭配 起來。 團隊 裡幾個 人還 收到 一份 強大 的索 引軟體。 賴爾 說服 一問
    澳洲 公司「 鑒 真數位」（ZENX）捐 贈給 國際 調查記 者同 盟刑 事偵 察軟體；他 含糊 地承 諾，未 來有 個案， 如果 成功了，可 以為 公司
    帶來 良好 的公 關宣傳。光 是為 了運作 那個 程式，《衛報》 及國 際調 查記 者同 盟就得 購買 更強力 的電腦。總 計起來，鑒 真共 授權 十份 軟體，比
    起需 求量，只 算杯水 車薪。


    一開 始，賴爾 及格 瓦拉 認為，夥 伴們 會前往 各中 樞城 市如 華府 或布 加勒 斯特，而 在當地


    探究這批資料。接受邀約的人沒幾個。為了吸引更多記者的興趣，還得把試算表傳給個別夥伴，而上頭則有資料裡找到的當地地址、他們國人的姓名。如果夥伴們有意進一步研究，再接洽國際調查記者同盟，而由國際調查記者同盟協助整合文件。這種做法，經證明難以進行。專案開始將近一年，坎貝爾在一位軟體開發者協助下，造出一個能搜尋又安全的網站，讓夥伴們能用來自行探索那些文件。坎貝爾既是深度調查記者，又是資料及通訊內容的鑑定專家，曾在一九八八年出力踢爆美國政府的「梯陣」（Echelon）全球偵監計畫。在調查新聞界得享盛名，實至名歸。


    專案團隊同意在二〇二二年九月發布調查報告。


    賴爾接下來找全球頂尖媒體合作。公共誠信中心的劉易士聚焦於某些特定記者，賴爾則不一樣，他認為唯有大型媒體組織，才能帶來他所期待的影響。他首先找到《紐約時報》。公共誠信中心理事會成員科瓦奇（B
    Kovac）從前是《紐約時報》的記者及編輯，他與《紐約時報》資深主編貝克（Bruce Bebe）見面開會。賴爾隨身攜帶一份資料，當他也現身會議時，貝克顯然不曉得他來做什麼。賴爾談到一些國際調查記者同盟的初步發現，貝克就著迷了。他召集幾位高階編輯，賴爾再度展示。這批次高權重的聽眾衷心說比較高。雖說賴爾在澳洲素有嚴謹美名，但那對這幾個美國媒體人算不了什麼。他們同意進一步討論見報事宜。磋商進行了幾個月。《紐約時報》請賴爾把資料及消息來源交出來，而《紐約時報》則在報導中歸功於國際調查記者同盟，作為回報。《紐約時報》拒絕與多家大型新聞機構合作，也不讓報社以外的記者掛名聯合報導。談判破裂，賴爾就放棄與《紐約時報》合作的想法。


    事情在其它地方的進展也差不多。歐洲媒體如西班牙《國家報》（El País）及德國最傑出的《明鏡週刊》（Der Spiegel）都拒絕賴爾的提議。大家就算承認離岸體系存在，但仍抱持漠視的態度。而新聞界通力合作於揭露它的壯舉，則試都沒試過。


    賴爾前往巴黎，找法國《世界報》（Le Monde）的人見面，看看該法國報紙想不想參與。他準時來到《世界報》新蓋、外牆全罩玻璃的辦公大樓，但與他接洽的人卻全忘了。賴爾在大廳等他的時候，看到街上有人朝大樓走來，開始猛力用頭撞擊玻璃。這幅光景用來自況真是絕佳啊。


    ## 《南德日報》加入


    賴爾組織調查行動同時，還與消息來源保持聯絡。他收到硬碟快過一年了，對方愈來愈不耐煩。賴爾可以理解。畢竟他也沒有自信，能獨力做好這項調查。


    發布調查報告的期限愈來愈不切實際。讓國際調查記者同盟成員取用這批資料，已變得緩慢棘手。很多文件是由照片或 PDF 檔組成。每份文件都得經由光學特徵識別軟體處理，才能以關鍵字符串尋得到，過程慢而累人。


    賴爾在國際調查者同盟設立專用電腦，供消息來源從遠端接觸這些材料。他想，如此他們可以幫忙重建這些資料，添加他們的洞見。有一天上線時，賴爾發現一則意料之外的通訊。消息來源忘了刪除一條他們交流的信息：他們對賴爾已失去信心。信息裡勾勒一項計畫，打算偷偷刪光那些資料，把整個專案銷毀。賴爾應變迅速，切斷他們連上那部電腦的管道，佯裝暫時下線。等到他恢復聯絡時，賴爾裝做什麼都沒發生過。


    國際調查記者同盟涉足太深，難以回頭了。專案成員每天都能找到引人注目的內容，而且愈來愈多。他們發現有關菲律賓獨裁者馬可士家族、亞塞拜然總統家族的資料。其中還涉及內瑞拉、泰國及蒙古政府官員，連同約旦、沙烏地阿拉伯、印尼及西班牙的超級富豪。他們甚至發現許多除政商以外的知名人士。以《鱷魚先生》（Crocodile
    Dances）劇集而聞名的澳洲影星保羅·霍根（Paul Hogan）錯信惡劣的資產管理人，許多財富被捲離到離岸世界。


    資料裡另外揭露丹妮絲·里奇（Denise Rich）擁有的財產，她的億萬富豪前夫占居柯林頓政府時代最惡劣醜聞的中心。馬可·里奇（Marco Rich）的大宗商品貿易公司今天叫做嘉能可（Glencoe），靠著販售被禁運制裁的石油而獲利。時任紐約聯邦檢察官的朱利安尼（Rudolph
    Giuliani）以逃稅及敲詐勒索罪名起訴他之後，他躲到瑞士去。捐了幾百萬美元給民主黨政治人物，他妻子又居中求情，讓柯林頓在總統任期最後一天特赦了他。資料裡顯示，丹妮絲·里奇在庫克群島的一間信託裡有一億四千四百萬美元，以及一艘叫「歡樂女士」（Lady
    Joy）的遊艇。


    加拿大名律師、「集體訴訟之王」梅尚（Tony Mercier）的祕密資產、隱私機密，也都在那批資料裡。梅尚是加拿大薩斯喀徹溫省（Saskatchewan）多彩多姿的公設辯護人，為了補稅與加拿大國稅局官司打得不可開交。加拿大政府顯然不知道，梅尚在庫克群島也有信託，在當地存了至少一百一十萬美元。梅尚堅稱，自己以郵遞寄送無法追蹤的現金到地球另一邊，給付他的信託。他的離岸服務供應者開玩笑說，如果他們把有梅尚名字在上頭的傳真，寄送給他，只怕他會中風。那批資料中找到四百多位加拿大人，梅尚名列其中之一。


    如同年初步會議中施列諾夫的懷疑，資料中有很多俄羅斯人，包括政客及商界領袖。普丁總統頻頻呼籲俄國人揚棄離岸系統，因此施列諾夫決定比照資料，如果能發現其中的偽善，就值得報導。


    國際調查記者同盟工作人員在很多事跡當中，特別強調與人稱馬格尼茨基（Magnitsky）事件的關係。設在英屬維京群島的聯合信託有限公司至少造了二十三間公司，用以偷竊一問美國對沖基金——清修院資本管理有限」(Heritage
    Capital Management Limited) 控告俄羅斯的生意。該對沖基金的俄國律師馬格尼茨基（Sergei Magnitsky）因抗議而被下獄。還在收押階段，馬格尼茨基就因虐待而死。聯合信託顯然不知道它創的公司在做什麼事，直到清修院來接洽它為止。


    德國傳來好消息。賴爾的第二選擇、設在慕尼黑的《南德日報》（Suddeutsche Zeitung）接受他的邀請參與這項行動。報社派出一位年輕記者歐伯邁爾（Bastian
    Obermeyer）。歐伯邁爾原先是位專題記者。這個跡象顯示，報社主管對這項專案期望值不高，因此派一名沒什麼調查經驗的記者來做。


    因為那麼多離岸資料都實,串到瑞士,賴爾及格瓦拉另希望找個瑞士夥伴。這個構想很難辦到。瑞士靠得就是銀行守密,充值前往離岸世界的跳板發跡起家。法國《世界報》一位同仁建議找
    Tanous, 這家媒體公司在瑞士的德語、法語區都辦有報紙。Tanous 才剛成立調查小組,任命前柏林特派員及新聞編輯齊爾曼( Oliver Zillmann
    )主持。國際調查記者同盟不曉得 Tanous 的老闆蘇必耶諾(Patxo Sumno)本身就是離岸業律師。值得推崇的是,蘇必耶諾也熱心支持新聞。雖說這項專案牽涉到他的同事,但他不想干預它。


    齊爾曼派他一位頂尖的記者普拉特納(Titus Rutter)與歐伯邁爾搭檔,去調查薩克斯(Cutter Saxo),那位德裔瑞士籍花花公子億萬攝影師曾娶了法國女星碧姬·芭杜(Britte
    Bardot)。那篇報導並不容易。首先,薩克斯已過世了。替薩克斯服務的律師事務所有一堆信託、公司及基金會,等他們測繪出來,發現那幾十條縱橫交見的線,看來像縱帆船的帆索。


    最用心寫作及報導的是英國《衛報》。該報準備了全套九篇報導,從名義董事到誰使用匿名公司在倫敦置產,鉅細靡遺。雷伊甚至寫了篇報導,談一位倫敦備受爭議的整型名醫,說他似乎用離岸公司逃避繳稅等責任。


    到了夏天,賴爾對顯而易見的狀況屈服了:他們進度嚴重落後。只有人都賣力,通力合作才能有所成果,但團隊並沒有同心合力。主題很新穎。資料卻難以釐清,而且大致上無法取


    用。有參與的媒體組織尚未全心投入該專案。賴爾只好把發表的日期挪後到二〇一三年初。


    《衛報》不願意,它拒絕等到三月。雷伊對賴爾說,報社打算十一月見報。


    賴爾無能為力。參與專案的媒體,以《衛報》為最大。它產出一系列高规格的深度報導,包括維基精密的外交電文,以及報社電話被竊聽醜聞。更重要的是,它具體掌握那批資料。賴爾並沒有影響力。《衛報》不需要國際調查記者同盟。團隊裡的參與者說服上司相挺這項專案時,都保證其他機構無法搶先報導,但《衛報》認為對自己沒什麼影響。


    ## 充滿災難


    專案進行時,有些日子滿是災難、不睦,而賴爾及格瓦拉會相顧著說:「今天肯定完蛋。」他們把那些日子稱為「癌症日」。


    《衛報》決定不遵守同時發布調查規定那一天就是癌症日。只是,賴爾有技巧地把這件事嚴重性降低,從性命堪憂減為一時耗弱。他與《衛報》編輯高層們磋商,別提到牽涉在內的兩家離岸公司名稱,還有資料來自有人洩密。而且到最後,《衛報》不清不楚的報導,未能吸引大衆廣泛注意。


    賴爾及格瓦拉加斑安無其他合作夥伴。反諷的是,《衛報》的報導見刊讓那批資料得到保證。心存懷疑的歐洲新聞同業對《衛報》敬意很高,突然熱情擁抱這項專案。


    當時國際調查記者同盟資訊研究處主任卡布拉（Mar. Cabra）回想而笑著說：「《衛報》大便滋味很棒，接下來各媒體高層就說，『好，我們來吃吃大便吧。』


    卡布拉這位西班牙女性個子嬌小但活力十足，原本是讀戲劇系，但後來她改讀新聞學，也是一位在賴爾來國際調查記者同盟之前就已經加入的成員。在西班牙電視台當主播播稿到失去熱情後，她靠著口才進入哥倫比亞大學科羅爾（S.
    J. Crowley）新聞學程就讀。還當學記記者時，她就與人合作，拍攝記錄片談養子養女服藥過度的現象，而獲美國公共電視台向全國播送。在《邁阿密先鋒報》（Miami
    Herald）任職一段時間後，她返回西班牙參與國際調查記者同盟的漁業專案。


    卡布拉的職責在讓專案的研究樞紐發揮功效。她很快就了解，要提供所有必需的文件，是不可能的事。各國記者都必須有能力自行探索資料。很不幸地，資訊處理還在進行中。資料新聞學（data
