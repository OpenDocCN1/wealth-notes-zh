    Party）執政僅十一天，就被國家衛隊逼退。這次政變讓托里霍斯（Ómar Torrijos）將軍崛起，他是深富魅力的民粹領袖，提倡「好心腸的獨裁」（dictatorship,
    with a heart）。


    一九六八年政變時，馮賽卡十六歲，是才剛崭露頭角的激進主義分子，後來還醉心於成為神父－拯救世界1。幾百年來，馮賽卡的家族每個世代都有人當神父12。馮賽卡讀大學一年，就受到耶穌會改革派的熱忱吸引而輟學。這些神父私底下經營工作坊，讓大學生可以與公民社會其他熱衷社會改革的成員打交道。透過耶穌會，馮賽卡結識時年三十歲的賈耶哥（Hector
    Gallego）神父，他來自哥倫比亞，有領袖魅力。賈耶哥信仰自由主義神學，這派神學教誨論及教會對窮人的責任，還包括改善他們的政經處境。


    賈耶哥在巴拿馬貝拉瓜斯省（Veraguas）一個叫聖塔菲（Santa Fe）的偏遠鄉村傳教。現今從巴拿馬市行經公路到聖塔菲只要四小時鐘頭。但是在一九七〇年代初期，坐美國人捐贈的吉普車前往當地得花一整天，震得骨頭發疼。聖塔菲農民與世隔離，活在封建條件下，替大地主做苦工。大多數人無法取得潔淨飲水，天主教會估計，當地兒童營養不良者達五成13。收到賈耶哥的邀請，馮賽卡搬到聖塔菲，神父讓馮賽卡負責幾項工作，其中包括埋葬死於飢餓及衛生惡劣的嬰兒。


    賈耶哥幫農人們組成合作社之後，當地地主與這位激進神父關係惡化。地主們與軍方發動騷擾戰，一九七一年六月九日午夜最為激烈，兩名當地陸軍基地的士兵綁架了賈耶哥。


    接下來發生的事，震撼有如神話。士兵們把賈耶哥架上直升機，飛到巴拿馬太平洋外海十六英里（約二十五公里）遠的科伊瓦（Coiva）島上空，把他推下去。這位斯文的神父從空中掉入島上濃密的樹林，從此消失，因為幫助窮人而殉難。


    賈耶哥神父的失蹤，對馮賽卡影響巨大。巴拿馬大主教麥格拉斯（Mark McGrath）敦促馮賽卡取得神職，延續賈耶哥的大義不死。馮賽卡答應了，只是當他了解自已難以放下世俗塵事後便放棄了。接下來他回大學讀法律，但對政治依舊保有熱情。巴拿馬大學生長久以來，一直抗議美國人把持運河，對此美國士兵有時會影響以暴力。政變之後，學生們也示威反對獨裁政權。馮賽卡參與那些示威，成為學生領袖。他的奶奶在後院牆壁擺著一把梯子，以便警察叩門時，可以讓孫子趕快逃走。


    然而即便長大成人後，馮賽卡都沒忘記賈耶哥的死。「一個人下落不明，要比他去世下葬還要糟，事情還沒有結束，我一直在找他。」


    一九八八年，記者赫許（Seymour Hersh）在《紐約時報》（New York Times）報導，賈耶哥被推落直升機後倖存下來。14至少多撐了幾天。據說巴拿馬軍方情報首長諾瑞加（Manuel
    Noriega）將軍開玩笑說，這件事讓他學懂，最好先把人殺了再丟下直升機。事發快要十年，有位退伍士兵提供資訊給教會：有個祕密墳塪，據說賈耶哥及另外幾個人就被棄埋在裡面。挖掘之後發現一堆人骨，但官方做去氧核糖核酸（DNA）檢驗的結果卻無法得出結論。


    此時已是成功律師的馮賽卡提議再做一次DNA檢驗。雖說其中一名失蹤男子的身分已經確定，但卻沒辦確認賈耶哥神父的遺骨。有好些年，馮賽卡把一箱混雜的人骨，放在莫薩克·馮賽卡律師事務所自己辦公室書桌底下，疑似他恩師的骨骸就安息在他腳畔。（一九六五年，法務部門向他索回。骨骸有待妥善檢驗及安葬。


    諾瑞加將軍過世前一年，病中的他與賈耶哥的妹妹講述一九七一年事件的另一種版本。他說，從直升機推落致死、叫全球目瞪口呆的故事是騙人的。諾瑞加最後的描述沒那麼驚悚，但一樣殘忍。賈耶哥被綁架後，被架上車開往巴拿馬市，原本預想是叫他流亡離開。但是吉普車行駛在路上，賈耶哥竟然跳車，而刺破一邊肺部。抓他的人狠狼狽他一頓。抵達巴拿馬市的時候，他已經奄奄一息。掙扎了幾天，他死掉了，屍體被丟進亂葬崗。馮賽卡懷疑，自己恩師的遺骨還沒進行新的
    DNA 檢驗，就是因為與這項罪行有關的人，至今在巴拿馬依然有影響力。


    ## 賺錢，但不必繳稅


    一九七六年，馮賽卡完成學業取得法學文憑，離開巴拿馬，到倫敦經濟學院深造。但是他還沒完成學業，聯合國便聘用了他。聯合國需要中美國籍律師，以補湊配額。馮賽卡在聯合國的工作視為領優渥薪水又能拯救世界的機會，於是接受聯合國「貿易和發展會議」(United
    Nations Conference on Trade and Development) 在日內瓦的職位。但是過了幾年，他跟老闆的關係就惡化了。


    馮賽卡說：「身處聯合國官僚體系，我的理想消磨光了。」他失望地發現，周遭的人保持組織的全球任務，以便讓自己發財。上司們把公務出差變成公費旅遊。幸好，一位日內瓦的女律師出現，拯救了他。在一次會議時，那位女律師一直瞧著他。


    「你是巴拿馬人？」中場休息時，她興奮地問說：「你真的是巴拿馬律師，對吧？」


    那位女律師一直在找合適對象，替她客戶開設巴拿馬公司。遇到馮賽卡，她找到人了。


    根據巴拿馬公司法，只有巴拿馬律師才能註冊巴拿馬籍公司，但該律師可以代表任何人。一九二七年起，巴拿馬便允許外國人購買該國的匿名公司，而且不必公開老闆或股東的名字。公司也不必申報年度財報。雖說公司必須有董事，而且必須公開名單，但董事們不必然是公司的所有人。註冊的費用極低，而且只要一個星期限就能設立一間公司。外國人買下巴拿馬公司要做何用，政府並不在意；而且只要公司是在巴拿馬境外賺錢，就不必繳稅。巴拿馬一九二七年公司法，讓該國成為世上第一批離岸轄區（offshore
    jurisdictions）之一──外國人在那些地方，可以繳很少的稅，甚至免繳，而且法規最少，因此得利。


    巴拿馬的公司法，是依據美國德拉瓦、紐澤西及阿肯色等州公司法而制定的。¹⁸ 事實上，德拉瓦的公司法已經成為樣版，供大多數避稅天堂常借鏡。十九世紀時，德拉瓦政府既想立法與鄰近各州（尤其是紐澤西）競爭公司設立的業務，但又擔心可能會發生貪腐，為此刻猶豫不已。當時在美國，公司已被视为金融不穩定、權力難以約束的源頭，原因在公司容許個別人等從事投機，橫行不法又可以逃卸罪責。


    一開始，德拉瓦只准許如果生產等當地產業設立公司 19，而且資金規模設有上限。到了一八七五年，在德拉瓦設立公司，必須由州議會票決，或者由法官核可，而法官可以判定公司是否守法，會不會傷害社會。藉由這種做法打擊貪腐，反而使得公司在籌設時使用不同的手段。由說客組成的小團體，為了賺到錢，他們向打算在德拉瓦設立新公司的客戶保證，一定能在州議會弄到足夠票數
    20。一八九九年，德拉瓦通過《一般公司法》（General Corporation Law），以紐澤西法律為本，但稅率更低，吸引企業到當地設立公司。州議會及法官把關的時代一去不返。新法保護以德拉瓦為基地的公司免受不利條件傷害，賦予它們到美國任何州，或世上任何地方做生意的權力。它們只需避免在德拉瓦有商業活動就行。


    那位日內瓦律師既當馮賽卡的保證人，又替他引見客戶，帶著他走進幽暗的離岸世界。她把那些公司叫做「肉雞」。生意很簡單— 在巴拿馬孵出肉雞，當註冊代理人而收取年費。馮賽卡說，他還任職聯合國的時候，把工作交給巴拿馬一位親戚去做，親戚答應等馮賽卡返回祖國時，把那些公司還給他。


    最後令馮賽卡放棄聯合國工作的原因，來自一個看似無害的提議。他接獲通知，說他已經夠資格，未來可以下葬在一塊日內瓦專為聯合國保留的墓地。聯合國把這項提議視為員工福利，還幫忙支付墓地成本。突然之間，馮賽卡瞧見自己當官僚到最後，其他人鏽泥土蓋住他棺材的畫面，這樣一輩子有什麼意思。


    在聯合國任職六年，馮賽卡於一九八二年辭職，搬回巴拿馬，開設自己的律師事務所，由親戚那取回他聯合國任內創設的公司。馮賽卡創辦一間巴拿馬控股公司「米其安那國際」（Muirans
    International）來打點註冊生意。他的新客戶包括當時的全球首富、沙烏地阿拉伯億萬富豪軍火商卡舒基（Adnan Khanoggi）。（那位日內瓦女律師幫馮賽卡取得卡舒基這位大客戶。）


    ## 吸引犯罪犯者的賣點


    卡舒基欣然採納避稅天堂的好處，尤其是當成他遊艇船隊的註冊地；他有多艘遊艇，像是漂浮水面的歡樂王宮，用來招待朋友，以及可能做成生意的要人。馮賽卡的米其安那國際替卡舒基註冊至少三艘遊艇，包括他訂製最豪華的納比拉（Naïla）號。


    納比拉號是以卡舒基的女兒命名，造價及船上配備斥資約八千五百萬美元（依今天幣值換算約為兩億五千萬美元）。遊艇長二百九十二英尺（約八十八公尺），可以儲存給一百人吃三個月食物，滿油可連續航行八千五百英里（約一萬三千六百公里）。船上有美髮沙龍、手術室及法式蛋糕店。船高五層、客房一百間，雜處其間的是供五十二名船員休息的艙房。電影明星、樂手及大富豪在船上舞池跳舞。衛浴設備都由大型單塊綺瑪瑙石切鑿而成。卡舒基的個人套房天花板為琍瑪材質，重點是十英尺（約三百零四公分）長的大床，床頭背後有個供債婦來往的祕密通道。卡舒基矮胖又禿頭，養了一堆高檔妓女，供他召喚。那艘遊艇是自給自足的活動世界，對一個控制欲超強、曲解事實、喜好奢華的億萬富豪而言，很是理想。債權人一九八八年收回納比拉號，最後由川普
    (Donald Trump) 買下。22 這些挑釁都是為了做生意。卡舒基擔任軍火及大宗商品交易的掮客，每做成一筆生意都能抽得可觀佣金。在納比拉號的特等艙裡，中東國家王室成員、一財星五百大一公司的高層、瑞士銀行家及政府官員勾心鬥角。如有必要，遊艇還可以行駛到公海完成合約，以避開如稅務問題等政府的限制。


    馮賽卡回到巴拿馬幾年之後，有樁交易牽涉到卡舒基的另一艘遊艇，讓馮賽卡及莫薩克以律師身分頭一次碰面。據馮賽卡表示，卡舒基把一艘遊艇賣給某位阿拉伯王公，而對方是莫薩克的客戶。交易中規定，遊艇要裝好直升機坪，交給那位王公。兩位律師會商細節。過程中兩人建立密切關係。


    卡舒基的名聲令人不敢恭維，但莫薩克及馮賽卡要替他辦事，顯然都毫不猶豫。一九七〇年代中葉，美國國會的聽證會便揭露，卡舒基參與美國國防承包商諾斯洛普 (Northrop)
    主導的行賄案，規模龐大，牽涉許多國家。諾斯洛普把幾千萬美元賄款注入外國官員的帳戶，以便贏得軍購契約。諾斯洛普一九七〇到一九七五年間，付給卡舒基的顧問費有一億六百萬美元。聽證會中指出，至少有四十五萬美元是用來行賄兩名沙烏地阿拉伯將軍。23


    在巴拿馬，道德有模糊空間，正是專業的賣點。該國律師及銀行家，已經把巴拿馬打造成全球罪犯的歸宿。托里羅斯政權愈來愈腐敗，把國家轉型為離岸金融樞紐。依法律，巴拿馬銀行不得洩露帳戶所有人的任何資訊，即使對政府也一樣。這種由公司與銀行保密政策所組成的保護襖，吸引橫行不法的人。接下來在一九八一年，托里羅斯的座機墜毀於巴拿馬西部，他在事故中喪生，很多人相信那是一場政治謀殺。全國隨而陷入動盪。


    替托里羅斯當情報頭子的諾瑞加很快用計掌權。²⁴ 他加快步伐往貪腐邁進，把巴拿馬轉化成一次到位的金融服務供應者，替哥倫比亞販毒集團服務。賣古柯鹼給歐美而賺到的數十億美元，使透過巴拿馬市洗白、打點。國際譴責隨之而至。


    馮賽卡加入一場公民運動，運動成員很多是反對諾瑞加的扶輪社及獅子會成員。他跟莫薩開始討論，應該把兩人的事務所合併起來以保護自己，讓獨裁者有所忌憚而不敢施壓。從生意角度來看，合併也是明智的做法。他們做的業務相似，合併之後，註冊於名下的公司大約五千家，這樣年費便足夠有穩定收入。


    莫薩克說：「合併成一間強大的事務所更為理想，能夠抵禦任何政治刁難，而且更能爭取到大客戶。」


    一九八六年七月，莫薩克與馮賽卡在巴拿馬市的「聯合俱樂部」（Union Club）舉辦雞尾酒晚會，慶祝新事務所誕生。聯合俱樂部長久以來是巴拿馬寡頭政治集團聚集喝酒的場所，因為祖父是外交官，馮賽卡成為會員。想到當時，他笑了起來：「我們在政治圈有人脈，不過沒什麼錢。」


    事務所三十五週年短片，特寫兩人在雞尾酒晚會上的張照片，他們穿著西裝，舉杯互敬。馮賽卡眉飛色舞。兩人合敬未來時，即便是嚴肅的莫薩克，也對著鏡頭微笑起來。


    ## 進駐更多避稅天堂


    由聖湯瑪斯（Saint Thomas）港開出的渡輪經過蒼翠島嶼，掠過以往海盜肆虐的碧綠水面。大約半小時之後，船橫越法蘭西斯德雷克爵士海峽（Sir Francis
    Drake''s Channel），抵達托爾托拉（Tortola）島上的羅德城（Road Town）。一九八六年秋天，馮賽卡並不曉得這次搭船，接下來會發生什麼事。


    莫薩克及馮賽卡兩人合夥後不久，開始替他們名下的公司找尋新基地。巴拿馬深陷入全面罷工使得國家躁動不安，美國情報界公開指責瑞加與販毒集團合作。局面顯得政府無法償還國際貨幣基金及世界銀行的貸款，巴拿馬在國際上陷入孤立。局勢不穩，使得新事務所的主要產品——巴拿馬籍公司——名聲變糟。


    莫薩克回憶：「CNN上頭播者示威，鏡頭聚集在焚燒中的輪胎上，這對生意很不妙。[兩]位律師詳詳世界地圖，想找個離岸轄區來發展事業。他們想找的地方，要能提供公司企業：一、對國外財務課稅低或不課稅；二、官方強制保密；三、政治系統穩定；四、其他同業競爭最少。地點還要接近巴拿馬，方便交通，要製造數萬間公司效率又高。


    換句話說，他們想找避稅天堂。設立公司的權力來自政府。沒有這種避稅天堂的共謀關係，好比莫薩克・馮賽卡這樣的事務所便無法存在在。由離岸服務提供者的角度來看，最好的避稅天堂都有類似的特質：親商的政治文化、正常運作的司法系統、經濟競爭有限。離岸產業提供註冊的估價費，以及其與公司註冊相關費用，讓政府取得迫切需要之稅收。政府為了報答，則支持並保護離岸產業。


    一如往常，提供法律範例的是德拉瓦的公司法。公司註冊登記費用，占州預算可觀比例$^{4}$，州政府大力捍衛這項收入。雖說真正在德拉瓦做公司註冊的業者很少$^{5}$，但他們對這項政治流程的控制力大到不成比例$^{6}$，撰寫法律管理協助公司註冊的業者，另外在州議會上捍衛他們的特權。


    ### 英屬維京群島的公司製造機


    馮賽卡坐的船抵達托爾托拉的時候，得了重感冒，病得非常厲害，沒好好想想曾有哪些人曾到過此島。一九九三年，哥倫布漆巧發現這個群島，把它取名為「聖厄拉及她一千名處女」（Santa
    Úsara and her 1,000 Virgins），後來簡稱為維京群島（Virgin Islands）。據天主教傳說$^{7}$，聖厄拉是位公主$^{7}$，帶著處女侍往前被匈奴人包圍的科隆城朝聖，但她們並不受歡迎。匈奴人把處女們斬首，匈奴人頭目還用弓箭射殺厄拉。


    英國人在一九六二年取得這個由四十多個火山島所組成的群島，至今以英屬維京群島得名。托爾提拉面積二十一平方英里（約五十五．七平方公里），是最大且人口最多的島。除了引進奴隸，種植出口作物以外，英國人對帝國外緣的這小塊落後領土，沒什麼建設開發。於是一九四九年起，當地呼籲獨立，大約二十年後如火如茶，制憲造出兩級制政府。被稱為「歸屬者」（Dependent）的當地人推選立法會，立法會再選出首席部長。歸屬者們監督國內法律、維持和平及課徵稅收。英國王室則任命一位總督來照看其他事務，打點外交政策。用伊莉莎白女王名字命名的橘櫟、公園到處都是，而且她的肖像掛在各級學校及政府機關。女王一九六六年来訪，坐一輛林肯敞篷車巡島，幾年後那輛車還陳列在一走私者灣沙灘酒吧（Smuggler''s
    Cove Beach Bar）。


    英屬維京群島成為避稅天堂的起源，要追溯到一九七〇年代中期，當時華爾街稅務律師巴特勒（Paul Butler）接洽群島上唯一開業的「哈尼．威斯伍德及雷格絲」（Harry
    Westwood & Regels）律師事務所。巴特勒是租稅協定的專家，那些協定旨在避免多個司法管轄區對同一筆收入課稅。他很聰明地表客戶動用美國與荷蘭安地列斯島（Netherlands
    Antilles）的一條協定。依據那則租稅協定，美國不對設在安地列斯群島的公司課稅。反過來，安地列斯島也不對外國投資課稅。因此，美國公司在安地列斯群島設有子公司，就能不被兩國政府課到稅。只是，巴特勒發現荷蘭語是個相當難克服的障礙。


    英屬維京群島與美國也有類似的約定。群島作為大不列顚王國領土，於是劃歸一九四五

