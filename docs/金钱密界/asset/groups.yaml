    # CHAPTER 3


    # 販售隱密的王國：建立經銷網絡


    加上英屬維京群島、巴哈馬與紐埃，莫馮已替它的空殼空司找好避稅天堂的據點。下一步該做的，便是設法把產品，賣到更多客戶手上──更多更多的客戶。莫薩克及馮賽卡從麥當勞的營運模式中得到靈感，認定達成目的的方法，便是特許經銷。他們想找出擅於銷售的人，把他們變成莫馮的經銷商。為了取得自己區域內獨家經銷莫馮產品的權利，經銷商以很差的折扣拿到那些匿名空殼公司。莫薩克認定，事務所這麼做，可以用最少開銷擴大市場。


    除開經銷舊，透過經銷商賣出公司還有另一個好處，那就是在莫馮業務與產品的終端客戶（也就是公司的受益人）之間，又添增一層阻隔。莫馮可以仰仗經銷商，確保公司合法使用。如果受益人經證實有不良行為，莫馮就可以宣稱，是經銷商（或者律師、會計師、銀行家）未能妥善過濾買方。此道精髄就在卸責。話雖如此，想把責任推卸給經銷商，事實上很困難。做惡很難遮掩，要掩埋罪行十分麻煩。雪上加霜的是，當合夥人認為獲利大於風險時，莫馮是甘願賭一把，直接參與可疑活動的。


    一九九三年，馮賽卡到紐約，想找個賣空殼公司的代理商，開發美國市場。他找到高登'
  - '[PAGE 50]


    （John Gorham）。高登很聰明，但拙於社交；他一九八一年自奧巴尼的紐約州立大學畢業，，取得心理學士學位。他找個法院執達員工作，但做兩年都只拿到最低薪，高登便跨界去做公司設立，大致上便是替紐約市的律師們，向位於奧巴尼的紐約州政府申報公司設立文書。


    莫馮延攬高登的招術，包括招待他去莫馮迷人的康塔多拉島（Contaore）沙灘別墅徜徉一個週末。莫薩克用他的西斯納小飛機，從巴拿馬市前往當地。兩人還在莫薩克的遊艇上釣魚。搏魚二十分鐘，身材瘦長的高登在莫薩克協助下，釣起一尾三十四英寸（約八十六公分）的青鮭。接下來，高登前往英屬維京群島一遊，樂得避開奧巴尼的寒冬。他住在莫馮事務所位於羅德城的公寓。事務所嘉償帶他去諾曼島（Norman
    Island）浮潛，也就是激發史蒂文森（Robert Louis Stevenson）寫作小說《金銀島》（Treasure Island）的地方。這種貴賓級待遇奏效。一九九四年三月，莫馮宣布，高登的「美利堅企業服務」（USA
    Corporate Services）公司成為事務所在美國的獨家經銷商。


    對高登而言，跟莫馮結盟，似乎真是打進國際公司製造市場的絕佳途徑。但是，事實證明要比他想像的困難。他的生意新夥伴對業績不佳極不耐煩。馮賽卡起初很迷人，但要是他無法稱心如意，外表底下的他脾氣非常大。高登解釋，美國人要開合法用途的公司，可以去德拉瓦。守法的美國人不需要莫馮。「美利堅企業服務」只好去《經濟學人》雜誌刊廣告，到離岸產業商品展兜售自己的金融產品，但是要賺錢還是很困難。高登愈來愈敬仰伏國外客戶。'
  - '[PAGE 51]


    一九九七年初，塔本（Lair Turner）與辛赫（Stuart Sine）來找高登，想在巴哈馬開設公司，透過不記名股票持有。他們成為客戶之後，高登把他們推薦給蘇格蘭皇家銀行（Royal
    Bank of Scotland），預想銀行會好好過濾客戶。事實上看起來並沒有人仔細檢查他們的業計畫，因為內容是剽竊微軟的 Office 軟體。過不到兩年，英國媒體報出他們公司的陰謀，堪稱英國史上仿冒軟體最大案例之一。接下來的審訊揭露，兩人藉由仿冒撈到的錢達兩百五十萬英鎊（合今天約六百萬美元）。兩名男子用這筆錢過著闊綽生活。塔本住在罕布什爾的高級住宅。辛赫開著黃色保時捷名車。


    塔本跟辛赫在英國有家公司叫「反斜線經銷商」（Backslash Distributors），但他們想由避稅天堂來經營業務。透過高登及莫馮，兩名男子一九九七年三月開了一間公司叫「巴哈馬軟體代理」（Bahama
    Software Agency）。莫馮提供名義董事，充當巴哈馬軟體的公司主管。


    局外人想找該公司董事的時候，只找得到莫馮的名義董事；塔本跟辛赫並不曝光。蘇格蘭皇家銀行很快就開辦帳戶，供新設公司使用。


    兩個月後，塔本跟辛赫就安排巴哈馬軟體，以十二萬英鎊買下反斜線，事實上這是自賣自買。莫馮在這筆交易必不可缺，因為充當公司高階主管的名義董事必須簽名，同意撥出款項。莫馮提供那些簽名，只收幾百美元。按交易內容，塔本及辛赫把反斜線經銷商的帳冊、記錄等，送去莫馮在巴哈馬的辦事處保管。


    塔本及辛赫設立巴哈馬軟體後三個月，公司把一張手寫函件，傳真到莫馮，要求事務所'
  - '[PAGE 52]


    把文件打在印有巴哈馬軟體信頭的信紙上，找莫馮設的董事簽好字，再寄回給反斜線經銷商。從外部不可能知道，兩人事實上是要把信寄給自己。信的主旨寫道：「回覆：有關真品來源的難題」。信件開頭寫道：「本公司花了不少時間，細讀確定收到的帳冊及記錄，另一考量本公司這段期間由貴公司取得之產品，其品質問題，而貴公司曾提醒本公司注意，本公司遺憾地以本函指示做下列行動。」「巴哈馬軟體接下來指示塔本及辛赫毀掉那批軟體，停止一切交易，再把一應記錄送到巴哈馬。


    # 避免不必要的關注


    莫馮收到傳真，叫它的名義董事簽字，事務所應該知道，被要求做的事並不合宜。外表看來，任何調查反斜線經銷商的人都會認為，新所有人巴哈馬軟體公司，是想讓自己與過往的麻煩脫鉤。實情乃是：這一招用意規避免斜線經銷商不法活動的責任。莫馮克依然授權巴哈馬辦事處主任為信函簽字。只是，他教她別用自己姓名，只簽頭銜「助理祕書」。


    +   - 一位巴拿馬律師寫信給巴哈馬辦事處主任：「莫薩克先生不想要妳在那種文件上簽字。」


    莫薩克另外囑咐高登核可那封信。徵詢過辛赫之後，高登照辦。


    一個星期後，莫馮傳真給高登，說明莫薩克已達極限。莫馮收到簽署那封誤導人的信件的費用以後，莫薩克打算退出。一位莫馮的巴拿馬律師寫信說道：「莫薩克指示我們在執行的費用以後，莫薩克打算退出。'
  - '[PAGE 53]


    該文件之後，辭去董事，因為事態有點危險 5 。


    莫馮事務所要高管知會塔本及辛赫，董事已辭職，要他們另外任命。一年後，該起大規模剽竊行為引起微軟及執法單位注意。


    高登回憶：「那兩人是白癡 6 。居然在倫敦市中心樹立看板，廣告他們的產品。」


    罕布什爾反詐欺小組突襲兩名男子住宅。倫敦的《週日泰晤士報》報導，警方抄沒數千份微軟盜版軟體 7 及兩具收縮膜包裝機。


    微軟律師取得倫敦高等法院的緊急強制令趕到巴哈馬，想刺破包覆這起案件的隱密保護。此時莫馮才發現，事務所派的名義董事根本沒從巴哈馬軟體辭職，高登及事務所也沒貫徹妥當的解決方案，讓辭職正式生效。各方都認為，對方有責任那麼做。


