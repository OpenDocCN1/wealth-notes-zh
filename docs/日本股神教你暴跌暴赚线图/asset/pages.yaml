    候，如果出現「屁股」訊號，就是之後將會反彈上漲的前兆。


    # 利用「2的法則」在反彈時脫手


    原本下跌的股價，若是轉為上漲，短期均線就會像追著股價似的轉為上升。


    強勁的下跌趨勢持續時，股價與均線的排列方式，由上到下就會依序變成「100 > 60 > 20 > 5（日線）> 股價」的「反PPP」排列。


    反PPP形成後，股價轉為反彈上升的話，5日線也會連帶上升，先是由下往上穿過位於上方的20日線，接著會往20日線上方的60日線'
