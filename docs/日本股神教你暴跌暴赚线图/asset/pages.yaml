    # 圖 2-18 下跌趨勢中的分歧、N 大的具體案例


    ![](img/995fe8c16a19f37c02681d08b0e34a73_77_0.png)


    5 日線接近 20 日線後又離開的走向。此時是反彈脫手和趁下跌搶進的機會


