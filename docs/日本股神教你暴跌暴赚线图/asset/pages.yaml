    最理想的情況是在助跑期間內——例如在累積了10—0空方部位的基礎上——才迎來20日線與60日線的死亡交叉。


    如此一來，在趨勢轉換的時間點上，你已經擁有大筆的未實現利益，可以就此讚美歌頌著下跌趨勢，並瞄準即將到來的「上漲趨勢助跑期間」實現空單利益，然後開始累積多方部位。


    這樣的行動，完全可說是「波段交易」的基本原則。


    圖4-15是將圖4-14中的「非武裝中立地帶」放大來看，並加上新的相得益彰交易工具：3日線與10日線的日經平均股價指數。


    我們來看一下，面對 B 點的 20日線、60日線死亡交叉時，該如何累積空方部位呢？


