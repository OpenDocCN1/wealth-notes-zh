  md: '我想說的是，既然要投資股票，那麼就該養成習慣，時常提醒自己「漲上去就一定會跌，跌下去也一定會漲。」


    # 在事情發生之前，就幻想事發後的情況


    只要瞥一眼線圖，我就能預測下一步：「現在雖然是下跌行情，但是之後還是會再漲一次，然後再跌下去」。


    養成習慣，在事情還很遙遠、尚未發生的時候就先去思考對策，這是相場式投資的基本功。


