- pgno: 80
  md: '# ⑱ 超越／跌破「前一波高點／低點」


    雖然在第 3 章才會詳細說明，不過股價是在上漲、下跌的反覆變動中，以低點→高點→低點→高點→…在這樣的過程中無數次達成低價或高價。上漲趨勢就是指低價與高價不斷往上突破的走勢；相反的，下跌趨勢則是不斷往下突破的走勢。也就是說，**判斷趨勢將會持續與否的重要依據，**
    即為「股價是否會突破前一波高點」「前一波低點會不會被跌破」。


    如圖 2-20 的概念圖所示，「股價未跌破前次低點，反彈上揚」「股價突破上次高點線上漲／未跌破反彈上揚」，這些地方可說是上漲氣勢加速的瞬間，可以在這個點上下單做多。


    # 圖 2-20 利用前次的高點、低點來判斷買賣


    ![](img/995fe8c16a19f37c02681d08b0e34a73_80_0.png)'
