  md: '# 08

    運用週線，掌握「為跌而漲」的走勢


    對初學者來說，PPP 類宛如一座比較好賺的股價理想國。


    如果是期間較長的週線 PPP、反 PPP，就會呈現幅度更大、持續更久的漲跌趨勢。所以說，這樣的情況確實就像天堂。


    以下就來思考一下，當週線圖中持續出現強勁的趨勢時，我們該如何看準「接下來，股價會為了上漲而下跌」（暫時性下跌），以及「接下來，股價會為了下跌而上漲」（暫時性反彈）吧！


    # 注意週線的 PPP、反 PPP


    任何事都一樣，想綜觀大局，就必須站上高處。


    股價分析中的「高處」，即是觀看時間軸更長的週線或月線圖，藉此掌握股價的重大趨勢。


    均線期間越長，線圖對股價波動的反映就越遲鈍。


    相較於日線圖的均線，週線圖的均線就算股價產生變動，也會像是紋風不動的頑固老頭。


    這些頑固的老頭們如果可以排出像 5 週 > 20 週 > 60 週 > 100 週這'
  merge: -1
  img_proc: true
- pgno: 157
  md: '樣整齊的 PPP，那這個排列方式就不太容易變形走樣。


    也就是說，當週線 PPP 剛開始不過3個月左右時，不妨判斷為「些微的下跌，是為了下一次的上漲而跌，因此可以大膽買進」。


    圖 4-10 是索尼金融控股（Sony Financial HD）的週線圖，圖中框起來的部分，是週線所形成的 PPP 排列。從開始上漲的時間點算起，約莫經過3個月左右，上漲趨勢失速，連續出現黑線，隨後股價穿破了5週線，跌到20週線。


    再怎麼強勁的上漲行情，3個月之後，都會因為之前買進的人獲利了結而暫時下跌。但是週線的 PPP 是很強的。第3個月左右的第一個盤整局面，即可視為「為漲而跌」，因此很有可能再次上揚。


    # 圖 4-10 出現在週線的 PPP 下跌，都是為了接下來再次地上漲


    ![](img/995fe8c16a19f37c02681d08b0e34a73_157_0.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: '圖中買點是在連續黑線之後，20週線稍微上面一點出現紅線①的地方。又或者是隔週的②——此處雖然暫時跌破20週線，但以結果來說卻拉出了一根大紅線，轉而上揚。


    這根紅線②穿越了5週線的A點，此時可以放膽信任週線 PPP 的強度，判斷「為漲而跌的行情結束了，現在開始還會再漲！」並積極地買進。不妨用這樣的想法來觀察日線，相信會找出許多本書已說明過的各種「買進」訊號。


    而實際上，股價也確實再度轉為上揚，在③的上影紅線達到了最高點。然而，在那之後形成了大幅穿越5週線的反下半身④，雖然一度出現長下影的紅線⑤，免於跌破20週線，但是隔週再度以黑線⑥對20週線出現反下半身，股價下跌。這時候的反下半身⑥是典型的轉為賣空的場面。此週線上的賣空時機，可以選在下週一之後，當日線出現黑線時就賣。


    來到⑥的階段後，無論週線的 PPP 再怎麼強，此處已經是「弱化」的轉捩點。


    圖中③的紅線以上影線碰到高點時，週線的 PPP 大約已歷經6個月了。在這段期間內買進這檔股票，並持續等到紅線③的每一個人，想必都賺到錢了。沒有人虧到。


    不過，從上漲到現在已經過了6個月，表示很多人會開始考慮：「已經賺夠了，差不多該獲利了結了。」


    抱有这样想法的人數比率，應該會比在第3個月時獲利了結的人要多上許多，畢竟上漲行情在第3個月時還很淺。我們會在第6章說'
  merge: -1
