  md: '仔細觀看幾千年份的歷史線圖，就能夠深切體會：「股票會上漲也會下跌，下跌之後還會再上漲。這是不變的道理。」


    線圖看得夠多，你就會領悟到這30多年以來，股市的本質就是「漲上去的必定會跌，可是跌下來的卻未必會再次上漲」。


    # 3 無論漲跌，股市充滿發財機會


    圖1-1是日本的代表性股價指數——日經平均股價指數，從1987年到2018年這30年當中的股價推移。


    日經平均股價指數在1989年12月29日的封關日（交易時間）當天，來到史上最高的3萬8957點之後，又在前所未有、席捲全球的金融危機——雷曼風暴衝擊之下，於2008年9月10日創下泡沫經濟後的最低點6994點。然而2012年11月民主黨政權敗退之後，該年12月，安倍領軍的自民黨政權誕生，其後展開「安倍經濟學」（Abenomics），使指數開始走高，在2018年1月上揚至2萬4129點，2018年10月2日更再度創下睽違27年的2萬4448點高點。經過6年以上，仍持續著強勁的價格變動。


    不過，觀看圖1-1會發現，不論是上漲行情還是下跌行情，股價都不是一直線的變動，而是呈現鋸齒狀、曲曲折折，在山峰及山谷間，反覆地上下變動。


    若以整體來看，日經平均股價指數在近30年內，一次也未曾超越之前創下的高點。由此可知，與其做多，做空的機會還更多一些。'
