    雖說如此，在股價上方還有著往下走的20日線，此處也有止漲的可能性，因此以0—4的多方部位獲利為前提，在下一根小黑線⑮附近稍微追加一點空方部位，變成1—4。


    股價越過20日線往上升，但此處暫不增加多單，保持觀望。理由在於（1）20日線正在下降（2）60日線在其上方持續下降（3）從最'
