  md: '也就是說，3日線會首先轉換，然後依序是5日線、7日線、10日線，接著3日線和5日線會暫時轉轉，但碰到7日線和10日線，四條均線密集聚攏。之後，均線會向下分散開來，宛若「釋迦牟尼的手」。當情勢發展至此，就能事前察覺：「趨勢要開始轉換下跌了！」舉例來說，圖5-11是千葉銀行2018年的股價波動圖。此圖僅顯示3、5、7、10、20、60日線，並把7日線加深加粗。


