    # ## 用手指查看相場式交易的四大重點


    看圖時，檢查的重點有四項：


    +   ①均線的排列變化

    ②下半身、反下半身等 K 線的狀況

    ③整數關卡和上漲、下跌的期間

    ④前一波高低價。


    例如，假設原本均線的排列方式是以 5 > 20 > 60 > 100 的強勁上漲趨勢推移，此時 5 日線卻跌破 20 日線，又跌破了 60 日線。這時候你能否感覺到事有蹊蹺呢？因為，這時候股價已經在
    60 日線的下方，跌破 60 天以來的平均價格了，這樣的現象讓人不得不懷疑：「是否表示上漲結束，要開始下跌了？」


    如果你這麼想，並留意起價格的變動，就會看到股價雖然暫時上漲越過 5 日線，卻被位於上方的前一個高價或整數股價、從盤整轉為往下走的 20 日線、60 日線這些障礙阻擋，然後再次轉為下跌的局面。這時候，如果
    K 線再次以黑線形式用力穿越 5 日線，出現反下半身的話，可說是給你了一個靈光乍現的機會：「哦？差不多該賣了！」


    不過，假設股價非但沒能突破前一個高價，還跌破前一個低價，並更進一步下跌，此時就是追加賣出的時機了。'
