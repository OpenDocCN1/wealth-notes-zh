  md: '圖 3-5 是造成全球金融恐慌的「雷曼風暴」前後的日經平均股價指數推移情形。如圖所示，日經指數從 2008 年 9 月——也就是雷曼風暴發生近前一年——就已經進入下跌行情。


    下跌行情的初期階段中，穿破 20 日線的 5 日線雖然暫時轉為上升，卻未能到達 20 日線而再度下跌，反 N 大訊號在①及②的地方出現。由此可知，「反 N
    大是大行情的前兆訊號」，這條法則可說是活生生地在眼前上演。


    透過均線的排列方式，很清楚看到整體趨勢已轉換成下跌行情。在剛開始下跌的 A 點盤整的 300 日線，被往下走的 60 日線、100 日線陸續穿破。在此之前，小泉純一郎政府的郵政民營化政策使行情一直維持長期的上漲趨勢。


