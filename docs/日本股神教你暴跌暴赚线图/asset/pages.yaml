  md: '鳥嘴，之後股價下跌機率將會提高（請見圖2-17的b）。


    # 圖 2-17 下跌趨勢的蠟筆、鳥嘴的具體範例


    ![](img/995fe8c16a19f37c02681d08b0e34a73_75_0.png)


    反鳥嘴發生前，K線應該已經往下穿越5日線、20日線，反下半身訊號亮起的可能性會變高。


    進一步發生反鳥嘴的話，就表示下跌趨勢已經正式形成，是追加賣出，或是繼續持有空頭部位、提升獲利的好機會。


    # 分歧


    5日線與20日線呈現蠟筆狀態的趨勢加速後，雖然5日線暫時往20日線方向靠近，但結果還是若即若離，原本的趨勢又加速進行。這樣的訊號就稱為「分歧」。出現此訊號時，若在下跌趨勢，即可追加'
  merge: -1
  img_proc: true
- pgno: 76
  md: '賣出；如果是上漲趨勢，即可追加買進。


    下跌局面中，在「分歧」發生之前，K線向下穿破5日線、發生反下半身訊號的機率非常高。


    如果你是已經習慣做空的中級投資者，可以在這個反下半身做新的空單，在分歧完成時繼續持股或是追加買出，以提高獲利（請見圖2-18的 a）。


    若是初學者，則只要在確認分歧完成後再做新的空單就可以了，一定來得及。


    # ## N 大、反 N 大


    N 大是分歧的變形，也是在趨勢轉換的初期階段經常出現的訊號。


    反 N 大的情況是指，在20日線上方的5日線越過20日線開始下跌，又暫時反彈上升到20日線附近，然而沒能超過20日線，又再次開始下跌，並相對於20日線畫出大寫
    N 字型後下跌。


    也就是先出現烏嘴，再形成分歧的情況。


    發生趨勢轉換的最初期階段，經常會發生 N 大，此時很可能會發展成一波大行情，因此要特別注意。


    反 N 大發生的時候，K線雖然會暫時上升到20日線附近，但卻無法完全突破20日線，又再度往下跌。直到確認了原本的支持線20日線變成壓力線之後，趨勢才會正式轉換，這就是反
    N 大所顯示的價格變'
