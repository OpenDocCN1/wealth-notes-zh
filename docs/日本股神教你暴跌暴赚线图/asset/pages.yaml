    這就是在本書首次公開的「進化版忍耐·K 線隱身練習術」。我也想過是否要採用「來回閱讀」這個名稱，畢竟這項練習法的目的是為投資者帶來清醒的效果，因此我又取了另一個名字叫「來回打臉閱讀法」。


    你可以透過日經平均股價指數，或是「適合自己的個股過去 30 年來歷史走勢圖」，來來回回地持續打臉自己，應該就會發現：這段時間內，不斷出現許多似曾相識的場面。'
