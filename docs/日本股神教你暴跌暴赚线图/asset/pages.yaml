    下降，股價呀！你是為了下次的下跌而上漲的吧？我都知道的。」


    只不過，一旦貨真價實的反 PPP 完成之後（A 區），紅線④以下半訊訊號穿透5週線後，連續出現紅線之時，剛好相當於下跌開始後的第6個月左右，因此也要思考趨勢轉換的可能性。


    此時有可能並非「為了下跌而上漲」的行情，而是真的即將就此持續上漲。


    當然，20週均線目前還在往下走，60週、100週均線還是很上面，所以也不能完全摒棄「反正還會再跌」的想法。這種時候要怎麼辦？


    此時，最好繼續懷疑「為跌而漲」的可能性，同時趁勢做多，若K 線的數量出現下跌徵兆，就暫時先把多單結清，加入新的空單。'
