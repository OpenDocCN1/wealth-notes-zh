    # \U0001f7e1留意週線的「強勁趨勢」，用日線交易


    圖4-12是將圖4-11週線圖中粗框內的期間，以日線圖方式顯示的結果。這段期間內，股價從4000日圓附近反轉，到5000日圓的關卡前後停漲，算起來將近有6週的時間持續上漲。正因如此，用日線圖來觀察的話，就能看出相當大幅的反彈上升。


    不過，一併搭配週線的俯瞰圖來看，會發現在週線的基準下，下跌持續了6個月，也差不多該暫時反彈。而日線也是在大紅線$1出現前的股價低點附近止跌，而且正嘗試去觸及位於上方的20日線。合併


