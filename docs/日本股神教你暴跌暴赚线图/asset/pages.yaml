  md: '# 圖 5-4 軟體銀行集團下跌後，上漲局面的買賣計畫


    ![](img/995fe8c16a19f37c02681d08b0e34a73_196_0.png)


    如上所述，只要觀看純均線圖，股價波動就會抽象化，因此便能很輕易地掌握股價目前的狀態及走勢。這就是「閱讀均線」的效果。


