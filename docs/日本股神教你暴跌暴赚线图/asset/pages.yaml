    # 5日和20日線交織而成的訊號一覽


    我的口頭禪是「人生只看紅與綠」。紅就是女性……抱歉，我是說5日線，綠就是男性……不，是20日線。


    線圖上的5日線與20日線都在蜿蜒蠕動著。5日線可以直接反映出股價的震盪變動，因此「曲折度」較高。兩條線忽近忽遠忽而交錯，以各種型態移動，指示我們股價的方向性，也就是趨勢的持續、加速、失控、轉換。


    我過去的作品曾提過，5日線與20日線上出現的許多訊號，都對做空的買賣判斷頗有幫助。


    雖然稍微扯遠了，不過我們可以先看一下子這些訊號的使用方法。


    # 蠟筆


    相場式訊號「蠟筆」是指5日線與20日線保持間隔距離，並呈現平行狀態，往同一個方向上漲或下跌。


    在下跌「蠟筆」持續的期間，繼續賣出的話，獲利就會越來越多。下跌速度加快的話，兩者的間隔會從平行方向逐漸擴大，但仍可視為蠟筆訊號持續。


    5日線與20日線同樣持平的時候，即便看似平行，也不可以視為蠟筆。'
  merge: -1
  img_proc: true
- pgno: 74
  md: '下跌趨勢下，股價與均線從上往下，以20日線＞5日線＞股價的順序排列，三者維持一定程度的間隔，並保持平行往下跌的型態——此刻的蠟筆，才正是做空賺錢的時機。下跌蠟筆發生前，若能事先布局做空，再配合蠟筆確定亮燈後所建立的空頭部位，即可提高獲利。


    相反的，下跌蠟筆的排列順序要是崩塌了，就應該考慮暫時先獲利了結（請見下頁圖2-17的 a）。


    圖中雖然沒有顯示3日線、7日線，但是使用線圖軟體練習，或是在實戰買賣時，建議在5日線之外，再加上這兩條線。當位於下跌蠟筆狀態的3日線與5日線轉而往上，或是轉向持平，並與7日線交接的時候，就可以視同下跌獲利了結的時機。


    # # 鳥嘴


    5日線由下往上突破20日線的時候，兩者成銳角型的交叉，就是「鳥嘴」訊號。相反的，5日線由上往下以銳角穿破20日線時，則是「反鳥嘴」，股價的趨勢轉為往下走，顯示投資人的角力關係由多頭優勢轉變為空頭優勢。


    5日線與20日線的傾斜度越陡，角度越銳利，便可判斷鳥嘴訊號的趨勢轉換力道越強勁。


    一般稱短期均線與長期均線的交叉為「黃金交叉」「死亡交叉」，但是當長期均線持平時，經常出現看似交叉、隨後股價卻又糾纏進入 B（盤整）的情況。


    相對的，一旦5日線由上方完美穿過已經朝下的20日線，形成反'
