  md: '# 用賣空方式看準「PPP 的崩壞、準 PPP 的崩壞」


    如同圖4-8所示，5 > 20 > 60 （ > 100 ）排列而成的 PPP 與準 PPP 順序之所以會崩壞並形成純 NON ，可能是因為之後將朝向反 PPP
    或準反 PPP 趨勢轉換，因而出現這樣的過渡時期；也有可能是5日線往上穿破20日線、回歸上漲趨勢前的暫時休息（暫時性下跌）。


