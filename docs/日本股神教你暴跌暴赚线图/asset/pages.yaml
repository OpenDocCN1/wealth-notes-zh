  md: '也不對，行情就會隨著這樣的心理狀態，在小小的變動中上升。相反的，賣股票時，多數投資者看到下跌就會產生危機感，趕緊拋售，其他人看到有人拋售，也會慌慌張張急著賣出。如此一來，就較容易產生「賣出連鎖反應」，因此很容易直線下跌。這一點我已經反覆強調很多次了。


    在上漲行情跟下跌行情中，投資者考慮的事情也不一樣，因此事先預測的劇本情節也會有若干不同之處。


    我們不妨這樣設想：下跌行情中，投資者很容易感到不安與恐懼，因此走勢的「下下下步」也很容易發生一面倒的現象。


    # ### 利用 7 日法則掌握漲跌的強弱


    股價會反覆上下變動，但是在變動的時候，除了 5 日線高低價的走勢之外，另一個必須注意的重點，是「 7 日法則」。


    股票價格無論怎麼變動，大抵都是持續七根 K 線就結束。平均來說，持續四根之後就隨時都有可能告終。這就是 7 日法則。


    下頁的圖 3-13 是圖 3-7 曾看過的線圖，也就是 2015 年夏天，人民幣震盪造成日經平均股票指數從暴跌到止跌→反彈上升的變動情形。在 5 日線低價不斷往下走的局面中，依然會有反彈上漲的時候。不妨試著數數看，圖中的反彈上漲期間連續出現了幾根
    K 線？


    看圖就會發現，持續下跌的局面中，上漲的 K 線大概是兩～三根左右，很少出現上漲至平均數（四根 K 線）的情形。'
