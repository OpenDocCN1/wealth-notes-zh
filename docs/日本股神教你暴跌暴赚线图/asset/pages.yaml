  md: '# 推薦序


    # 磨練、反思與紀律，

    方能成就一代股神


    謝佳穎（專業操盤手）


    日文「相場師」代表的是交易高手或投機家，二十世紀曾有多位投資家被譽為日本股神，其中一位是誕生於1897年的是川銀藏，曾經三戰「住友礦業」，大賺200億日元。當然也因為貪婪，他曾經在「同和礦業」一度獲利300億，卻又因為錯過賣出時機，成為紙上富貴的最佳代言人。他的名言是：「不可太過於樂觀，不要以為股市會永遠漲個不停，而且要以自有資金操作股票為投資原則。」


    近年來股市名師的代表就是相場師朗，他與是川銀藏的操作手法存在很大的差異。是川銀藏專注於基本面的發掘與探討，而且不做融資融券交易。相場師朗以技術面為主，專注於
    K 線的研究，並利用關鍵的均線與單純的 KD 指標作為趨勢的研判。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '簡單純粹，才能在關鍵時刻當斷則斷，並且絕不加入個人情緒。不論多空，都可利用融資融券交易擴大戰果。


    究竟是聚焦基本面較能獲利，還是不受消息影響的技術面才是正途？市場有句名言：「只要能夠獲利，都是對的！」


    相場師朗提過：「峰峰高、底底高」的上升趨勢，加上均線多頭排列，則做多；反之，呈現「頭頭低、腰創低」的下降軌道，加上均線空頭排列，則做空。


    這樣以「趨勢」為主軸的導引是多麼簡單而純粹。因為多頭特性是緩漲急跌，多頭上漲時往往股價形成盤堅，緩步上升，即便突破前期高點也是陷入震盪。遇到利空消息襲擊時，反而會以急跌呈現快速反映，因為跌勢容易擴大群眾心理效應，例如中美貿易戰突發的消息、武漢肺炎的爆發，都造成多頭股市的情緒快速反映。因此，相場師朗提到「做空比做多容易」，背後緣由即是如此。


    投資朋友們往往最難掌握趨勢，相場師朗掌握了簡單的「均線由上至下呈現5日、20日均線及60日季線」為多頭排列，也就'
  merge: -1
  img_proc: true
- pgno: 8
  md: '是上漲趨勢的判斷原則，反之，「均線由上至下呈現 60 日季線、20 日線及 5 日線」，就是空頭排列，而股價與均線的突破與跌破買賣原則，都必須以趨勢為依歸。這已經點出一般投資人往往犯下「把股價與均線的突破當賣點；跌破當買點」的缺失。


    相場師朗在本書中將 5 日線與 20 日線的型態進行統計與分類，讓投資人更容易對照線圖，做出交易決策。此外，他更提供了自己用 3、5、10 日均線進行短線操作的經驗。


    談到股價研判，相場師朗指出必須透過均線的排列、股價關卡、下半身與反下半身等 K 線的訊號。其 PPP 法則便是以短、中、長、較長均線排列為主要趨勢。使用股價關卡、K
    線，並進一步搭配 7 日法則、9 日法則來獲利了結。


    他甚至提出反手做空的原則，亦即讓「右手買股與左手賣股，兩者可以完全一致地運作」。無論如何，多空的研判都是所有買賣前必做的功課。


    另外，週線是研判日線的關鍵，本書提出上漲只是空頭趨勢中的反彈，因為週線的趨勢仍維持向下，週線的反彈往往讓投資'
