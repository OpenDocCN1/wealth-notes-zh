  md: '投入許多熱情，我的學生也很快就會愛上「賣空」。而他們也很扎實  地以「賣空」賺取了可觀獲利。


    實際上，股價並非只有上漲，也會下跌。我想，應該很多人心裡  其實默默地認為：「光靠買股來賺錢，實在太浪費了。」


    我將傳授長年培養出來的「賣空」技術，獻給所有閱讀本書的投  資者，包含初學者 trong。我會幫助你們成為「買」「賣」都能賺的股  市專業投資人！


    # 「賣空」到底是什麼？


    所謂賣空，並不是「買股」，而是從證券公司借來股票，從「賣  股」開始做起的交易。


    賣空之後的股票，一旦跌到比賣出更低的價格，就再買回來，股  價下跌的跌幅就成為利潤。最重要的是，「賣空」是趁股價下跌時賺  錢。「手上沒有的股票卻可以賣出？股價跌了就會賺錢？究竟是怎麼  回事？」初學者在這個階段想必會一頭霧水吧？


    用股票來說明的話，或許有些難以理解，這時候請你用「香蕉」  來思考。A 猩猩從 B 猩猩手上借來十根香蕉，以市價 1000 日圓販售出  去。這項交易使 A
    猩猩得到了 1000 日圓的現金。


    之後十根香蕉的價錢跌到了 900 日圓，因此 A 猩猩支付了 900 日  圓買到十根香蕉，把這十根香蕉還給了借給牠香蕉的 B 猩猩。


    於是，神奇的事情發生了——A 猩猩手上留下了 100 日圓，並且  沒有任何負債（參照圖 0-1）。'
