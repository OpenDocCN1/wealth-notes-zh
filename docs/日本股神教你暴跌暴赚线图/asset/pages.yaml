  md: '# 推薦序


    # 學會放空，就多了 50% 的賺錢機會


    獨孤求敗(暢銷財經書作家)


    行情不是上漲就是下跌，然而大多數的股市投資人習慣做多，不熟悉放空。股價有跌有漲，如果只選擇做多，等於放棄一半的獲利機會，為何不嘗試呢？而且下跌往往比上漲乾脆，速度來得更快，賣出會引發更多賣出，靠下跌獲利可以說是賺快錢。如果害怕股價下跌，就該學會如何放空。將害怕的事情變成賺錢的工具，這才是正面的態度。熟記下跌線圖的模式，下跌前、下跌時，下跌後各別呈現的態勢，將線圖牢記在心，姑且不說靠放空賺錢，至少能趨吉避凶。


    相場表示他的六成獲利來自於放空，而這本書即是分享他的放空技巧。包括「嘗試攻頂失敗」的交易訊號、利用「整數關卡」進行交易、「賣出引發更多賣出」的恐慌性下跌暴利、「7日法則」「9日法則」以均線培養大局觀，透過K線尋找買賣點⋯⋯本書'
  merge: -1
  img_proc: true
- pgno: 5
  md: '列舉了很多技術分析上的交易技巧。


    任何技術都一樣，只要熟練就能成為職人，這本書發揮了工匠精神，耐心解說經常出現的圖形，幫助讀者熟記，包括「股價下跌的模式只有這五種」「熟記均線的多空排列與變化」，以及大量的案例，進而讓讀者看圖練習。相場式交易的基本模式，就是清楚確認四個項目：①均線的排列方式②整數股價③前一波高價、低價④
    K 線數量（9 日法則），才好掌握行情的轉換點。請將本書內容應用於自己操作的股票，先用歷史行情來模擬練習，便能取得很大的進步。我自己也是透過大量的模擬練習，大幅提升功力。


    最後鼓勵讀者：勤於練習，熟練方法，你會在市場上得到回報。'
