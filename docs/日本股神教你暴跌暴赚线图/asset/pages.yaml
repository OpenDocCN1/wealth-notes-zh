- pgno: 166
  md: '# 09 利用 20 日線與 60 日線的交叉建立部位


    股票投資，是對抗自身欲望與情感的戰鬥。


    我們每天都是一邊與「想賺更多」的欲望，以及「絕對不想賠錢」的恐懼搏鬥，一邊進行股票投資。


    買進股票之後就開始擔心「不知道會不會跌」，賣空之後又會懷疑「是不是要漲上去了」而坐立不安。


    一旦陷入這樣的思維模式，就會害怕到無法再進行交易。


    為此，我想出一門防範之道：只要完全遵循某個既定的規則，當趨勢發生轉換的時候，就深信「這一波上漲趨勢會持續 6 億年」、「這個下跌局面也會持續 6 億年，所以不用擔心」。如此一來，即可強化信心。


    如果是以做多取勝，那麼就堅信上漲趨勢將會持續 6 億年；以賣空取勝，就相信下跌趨勢會持續 6 億年。若能這樣想，那還有什麼好怕的呢？不安與恐懼都會消失無蹤。


    請不要取笑我：「相場師是在開什麼玩笑？」我當然也不認為股價的上漲真能持續 6 億年。只是，抱持這樣的信心來交易，才能夠抹去不安與恐懼。如此一來，你的交易技術與投資成績自然也能提升。'
  merge: -1
  img_proc: true
- pgno: 167
  md: '其實，你根本不需要真的能持續6億年的趨勢。只要設定幾個嚴格又可靠的規則，讓自己能夠放寬心判斷：「這次只是剛好沒持續6 億年罷了。」並且嚴格遵守這些規則即可。


    # ◎ 20日線與60日線交叉的重要理由


    「只要出現這個訊號，漲降就會持續6億年！」


    雖然世界上不存在這種訊號，不過確實有一種很接近的訊號，我 希望你能好好注意。那就是20日線與60日線的交叉。


    在補強 PPP 與 NON 這種狀態分析的意義上來說，20日線與60日線的交叉非常重要。


    PPP 的定義中，若無視100日線，當均線形成5＞20＞60 的排列時即是準 PPP，60＞20＞5的話就是反準 PPP。


    然而，5日線會拚命跟著股價激烈波動，那副模樣就像心電圖一 般，呈現非常激烈的上上下下。


    這麼一想就會發現，雖然不知道其中是否會夾著純 NON，但從準 PPP 過渡到準反 PPP——也就是從上漲趨勢轉換到下跌趨勢的開 端——便是從20＞60的排列變成60＞20的時候，即為20日線與60
    日線交叉之處（雖說實際的股價會比這時候更早開始漲跌）。


    兩者交叉之前，5日線會先動，這時應該已經先跟20日線、60日 線交叉了。也就是說，20日線與60日線的交叉，大多等同於宣告5＞ 20＞60的準 PPP 或
    60＞20＞5的準反 PPP 已經完成。'
  merge: -1
  img_proc: true
- pgno: 168
  md: '查看各式各樣的個股線圖，會發現20日線與60日線的交叉情形，其實並不那麼頻繁。


    頻率大約是2年中發生七次左右。


    總之，一邊認知到PPP與NON訊號，一邊注意20日線與60日線的交叉，以此進行交易，就能確實跟上長期的趨勢轉換。當然，讀到這裡，可能有人會批評：「這不就跟經常發生的黃金交叉沒什麼兩樣嗎？」


    確實，我完全明白這樣的想法。


    不過，不妨先就來看看20日線與60日線交叉的具體線圖吧。


    # ⑩ 觀察日經平均股價指數的20日、60日線交叉


    圖4-13是2014年底到2016年9月為止，約2年半期間內，將日經指數日線圖的K線去除之後，只顯示20日線與60日線的結果。


    圖中把兩者交叉的地方都圈起來了，總共有七個。其中也有幾個與其說是交叉，不如說是在糾纏的地方，這種情況下，我們就只圈出它開始跟結束的地方。


    A 的上漲局面，是在20日線與60日線的黃金交叉處買進。這波漲勢雖然不會持續6億年，不過已經夠讓人賺進可觀獲利了。


    在B與D的死交叉處放空的情況亦然。趨勢將會由此急速下跌，因此也能賺到不少。然而，就算在C的交叉點買進，等到在D交叉點賣出時，趨勢幾乎仍位在同一个價格區間，因此結果不是打平，'
