  md: '更進一步將K線組合起來看，就能看出價格變動的強弱狀況。在這裡就來看看下跌訊號「弱勢波動」的組合吧。


    # 圖 2-2 K線的組合與價格變動的強弱


    # 「弱勢變動」的K線組合


    【覆蓋線】

    此變動抵消了前一天的漲幅 | 【孕線】

    前一天的上漲變鈍 | 【空頭吞噬】

    加速下跌，跌破前一天的低點 | 【夜星】

