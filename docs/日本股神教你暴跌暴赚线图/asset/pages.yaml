- pgno: 215
  md: '# 12 融資融券交易的

    基礎操作


    想進行本書介紹的相場式交易，首先必須到證券公司開設「信用帳戶」。


    如果不這麼做，就無法進行最重要的「賣空」了。


    「想透過相場式交易法賺錢！但是對融資融券和賣空一無所知。」我相信一定也有這樣貪心的初學者。


    因此，為了幫助初學者從零開始學習，以下將解說融資融券交易與賣空的制度、規則及專有名詞。


    # ❶一般證券交易（現貨交易）與融資融券交易的差異


    在證券公司開設信用帳戶後，把錢匯到戶頭裡，就能在這些金額的範圍內購買股票。


    實際上把錢匯進去，然後在資金範圍內購買股票的交易，就是「現貨交易」，而進行這種交易的戶頭就稱為「現貨帳戶」。


    現貨交易中，在買進股票後，也可以自己的名義賣出股票。


    不過，你不能賣出並未持有的股票。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '因此，使用現貨帳戶時，就只能以「低價買進股票，股價上漲之後以高價賣出，藉此獲利」這種單向的交易方式，作為靠股票賺錢的唯一方法。如果實際情況與你預期的相反，股價下跌的話，就只能「用比買價還低的價格賠錢賣掉」了。


    相對於此，如果你開設信用帳戶，就不只可以買股票，也可以一開始就先賣出原本並無持有的股票。


    在融資融券交易中，交易後的持有額度就稱為「建立部位」，賣空的時侯則稱為「建立空頭部位」或是「空頭部位」。


    賣空的「空」就是跟空房間、空頭支票一樣的「空」。也就是說，這個名詞的由來是「手裡空空如也，卻可以借股票來賣」。換言之，所謂的信用交易，其實等於證券公司這樣告訴你：「好的，我知道了，我相信你。我把錢或股票借給你，所以你可以用借來的錢買股票，也可以把借來的股票賣掉換成錢。不過借給你的錢和股票，你一定要原原本本的還給我！」融資融券交易，便是以這樣的規則來進行。


    # 「制度信用」必須在 6 個月以內交割


    融資融券交易分兩種，一是受到證券交易規範管制下進行交易的「制度信用」；二是證券公司自己制定規則、進行交易的「一般信用」。


    「制度信用」的規則如下：


    +   - 可以買賣證券交易所規定的個股。可融資買進的個股叫做「貸借融資股票」；可進行融資買進，也可以做融券賣空的個股就叫做'
  merge: -1
  img_proc: true
- pgno: 217
  md: '「貸借股票」。


    +   - 必須在**6個月**以內交割。


    這兩個規則很重要。


    另一方面，「一般信用」則沒有**6個月**交割的期限，可以一直繼續交易。


    不過，大多數的情況下，「制度信用」的手續費較為便宜。


    交易「一般信用」時，證券公司會以自己獨有的管道去調配借券，因此非「制度信用」的「貸借股票」也可以賣空。


    尤其是買賣 MOTHERS（Market of the high-growth and emerging stocks）、JASDAQ 等新興市場股票時，在「制度信用」中，它們未被指定為貸借股票，因此有很多股票是就算想賣空也無法這麼做。關於這一點，若是「一般信用」的情況，只要證券公司有辦法自行調度，即便是新興股票或新上市的
    IPO 股票，有時也能在一定的條件下進行賣空交易。


    不過，相場式交易中會鎖定的個股，都是符合下列條件的大型股：一天成交量最少要有**100萬股**，可以的話最好**200萬股**以上，且買賣成交金額一天最少是**10億～20億日圓**以上，在每天大量的買賣進行中，市值達**5000億日圓**以上。新興市場的小型股票則完全不會碰。


    此外，倘若在進行融資融券交易時，為了借到融資融券而每天都利息成本追殺，抱著一堆未實現損失持續交易**6個月**，這也真的是蠢到家了。'
  merge: -1
  img_proc: true
