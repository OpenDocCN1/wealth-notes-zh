- pgno: 163
  md: '# 圖 4-12（再次顯示） 根據週線俯瞰圖來活用日線，趁行情反彈就脫手


    ![](img/995fe8c16a19f37c02681d08b0e34a73_163_0.png)


    考慮這些因素的話，就應該在大紅線①對5日線出現下半身的局面買進才對。


    更有甚者，你也可以在對20日線出現下半身的大紅線②之處追加買單。


    不過，由於次日的黑線③撞上了60日線，在這裡不妨先暫時清掉買單，觀察狀況。


    接著，在5日線出現下半身的紅線④之處，可以再下單買入。如此一來，就成功抓住了後續的三根紅線了。


    最後的紅線⑤的長上影線剛好撞到5000日圓這個整數關卡，隨即失速下墜，因此，此處端看你要選擇在這根紅線處結清，還是在第二'
