  md: '# > 自序

    # 相場式技術，讓你多空都能賺！


    本書是擁有37年以上股票投資經歷的我──相場師朗，第一本專

    門集中解說「賣空」的書籍。


    說到「賣空」，各位想到的是什麼？


    想到「麥當勞」的人，我猜應該都餓了吧？


    ⊙ 首先，打破「賣空＝可怕、困難」的成見吧！


    稍微接觸過股票投資的人，一聽到「賣空」，大多會覺得「好可

    怕、很困難」。


    甚至時有耳聞「朋友的朋友賣空股票後，賠光所有財產」，或是

    「要是賣空的虧損大過原有保證金，三天內就會被迫繳保證金」，這

    種近乎「怪談」的可怕故事。


    即使是在股票投資上累積了相當經驗的人，也通常覺得「賣空」

    很不主流，甚至會武斷地認定自己不擅長處理賣空。


