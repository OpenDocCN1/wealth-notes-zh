    # 以個股確認「均線來回閱讀」的威力


    操作個股時，均線閱讀法也能夠發揮威力。這項方法畢竟是在本書中首次介紹的嶄新手法，因此以下先用做多的案例來說明吧。


    圖5-4是軟體銀行集團的日線圖。A 區的3、5、10、20日線在60日線之上，因此可判斷為上漲趨勢，但是跨過20日線的3、5、10日線正在上下震盪，呈現「激烈纏鬥」的狀態，因此我認為上漲的態勢正在失速當中。在這之後，3、5、10、20日線跌破60日線，轉移到下跌走勢B。


    接下來，在C 點打底的3、5日線以極陡的角度上漲，越過10日線，因此建議在此試探性做多。20日線也就這樣直接越過，而5日線與20日線在同樣位置形成烏嘴，因此可以增加多方部位。3日線進一步越過60日線後暫時下跌，接著再轉為上漲，點亮「N
    大」訊號，即為 D 點。此處10日線與20日線也出現了烏嘴，因此這種可以正式開始做多。


    3、5日線就此保持彼此未相交的狀態、持續上漲。這段期間可以繼續買，直到3日線跌破5日線（E 點）再獲利了結。不過，拿掉3日線會發現，均線排列呈現5＞10＞20＞60，是非常整齊的
    PPP 狀態，由此可擬定這樣的買賣計畫：股價接近10日線之後，表示可能會再次上漲，便可以準備做多。'
