  md: '# 01 為何股價會反覆上下變動


    再怎麼朝氣蓬勃的年輕人，要是持續打兩小時左右的拳擊，一定也會筋疲力竭地倒下。


    同樣的，再怎麼優秀、具有成長力與高收益性、股價一飛沖天的企業，總有一天股價也會一樣會跌下來，因為買了這檔股票後賺到錢的人，總有一天會獲利了結。


    雖說像美國的股價指數——紐約道瓊工業指數或標普500指數，即使偶有下跌，整體而言還是長期持續往上上升，但是那畢竟是美國的情況，而我則身處在「驕奢不能長久」的國家——日本。


    日本古典文學巨著《平家物語》開頭即寫道：「祇園精舍之鐘，敲響諸行無常。沙羅雙樹之花色，訴說盛極必衰之理。」


    「盛極必衰之理」，真是值得拿到國文考試出題的名言佳句。這句話意味著「泡沫終究會破滅」。遠在800年前，就已經有日本人提出這樣的洞見了，真是非常了不起。


    不過，深愛著股票的我，絕對不會告誡你「因為泡沫終究會破，所以不要買股票」。


