    | 3週 | | 2015年8月～10月 | 2914點 | 14% | 7週 | (包含中途的反彈上升) | | 2015年12月～2016年2月 | 5146點
    | 25.7% | 11週 | | 2017年3月～4月 | 1235點 | 6.3% | 5週 | | 2018年1月～3月 | 2629點 | 10.8%
    | 9週 |


    以上顯示的數字，是從當初的高價開始急跌，直到跌至最低價為止的價格幅度與期間。


