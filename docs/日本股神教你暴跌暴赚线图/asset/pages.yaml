- pgno: 44
  md: '在圖2-2中，包含從2018年的日經平均股價指數在急跌之前等實際股價波動中，所選出的較弱K線組合。


    賣空時，必須察覺股價到達高點之後轉為下跌時的「弱勢波動」。此時，你有可能碰上「雖然開盤時比前一天的紅線僅高，但大幅下滑，以黑線告終的價格波動」，或是「無法更新高點，反而跌破低點」的狀況等等，這些就是讓人感覺到「轉弱」，因而開始賣出的重要判斷依據。


    K線圖最有效的學習方法，莫過於實際觀看看眾多線圖的各種組合。在腦海中描繪當時的價格波動，將「這很強」「這很弱」等型態及組合烙印於身心之中。唯一的學習祕訣，就是拚命練習、練習、練習，鍛鍊、鍛鍊、鍛鍊！


    # 相場式中最重要的「均線」


    如果說K線能讓人感受價格波動的新鮮度、氣勢的話，均線就是用來看價格波動的走向、方向性，也就是對股價來說最重要的「趨勢」。


    誠如其名，均線是某個期間內股價變動的收盤價格相加，除以該期間內，以平均值連結起來的線。若是5日線，就是將當日再加上一天前＋兩天前＋三天前＋四天前的股價收盤價，加起來除以5後，得到一個五天的平均值，每天都依此計算出一個平均價格，再連起來的線。'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'K 線每天都會上下跳動，如果過度聚焦於 K 線，就會變得過於短視，一一追隨每一刻的價格變動，反而會陷入混亂。


    在這一點上，均線最棒的地方就在於，只要觀看股價、短期均線、長期均線的排列和傾斜度，就能很快明白價格變動的方向性，也就是趨勢。


    若是一個完全不懂均線的人，或許會把它看成是一條「蠕動的、糾纏在一起的蚯蚓」。


    然而，這樣的「蠕動」，正是價格波動的精華，也就是從某個期間的股票平均值中提煉而成的東西。


    上漲趨勢持續時，由上到下的順序排列就是「股價>短期線>長期線」；相反的，下跌趨勢的排列順序則是「長期線>短期線>股價」。


    總之，將不同期間的均線顯示出來後，從排列方式的變化就可以察覺股價的趨勢變化。


    圖 2-3 網羅了股價與短期線、長期線排列中所有可能發生的模式。在均線彎彎曲曲的蠕動與排列順序的變化中，趨勢的持續或是停歇、再加速或是轉換等，每一個都具有非常重要的意義！（順便一提，圖中的
    K 線形狀完全只是舉例。）


    當然，不只是排列方式，傾斜度也很重要。只要看均線的傾斜度，就能立刻看出股價平均是往上還是往下。傾斜度的陡峭或平緩，也能用來判斷價格波動的態勢。


    並且，均線在計算性質上，期間短的能更快速反映股價的動向，就像是追著股票跑一樣，非常容易變動。可說是名副其實的「牆頭'
  merge: -1
