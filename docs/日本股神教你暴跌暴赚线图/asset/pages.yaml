  md: '# 05 從過去的線圖看出

    下跌行情的「習性」


    想靠「放空」來賺錢，最大的前提當然就是「股票下跌」。


    那麼，股票下跌有哪些模式呢？


    想成為賣空達人，你應該立志成為下跌行情的專家。


    為此，就一定要把股票所有的下跌模式深深記在腦子裡，在變動發生前，即可擬定「賣空的情節走向」。


    # 股價下跌的模式只有這五種


    圖 3-1 將股價演變至下跌為止的所有可能情況，以概念圖方式呈現出來。我在第 1 章說過，股價波動的基本款是「上漲→盤整→下跌」。在相場式投資法中，下跌就是
    A，盤整就叫 B，上漲就叫 C。也就是說，雖然股價上漲了（C），但想買的人已經都買完了（利多出盡），不會再上漲，轉而以盤整（B）的方式推移。之後，當股票開始下跌，準備要過渡到
    A 的時候，即可開始放空——這就是股價下跌的基本模式。


    這樣的模式最為常見，可說是下跌的王道。


    當然，股市中還是存在著幾乎毫無盤整，直接「上漲→下跌」的'
