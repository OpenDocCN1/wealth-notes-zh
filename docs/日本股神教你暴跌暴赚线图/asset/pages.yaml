- pgno: 164
  md: '天的黑線清掉。


    此外，在5000日圖的高點可以看到壓力線，以週線為基準來看，目前20週線仍然向下，在它上方的60週線也向下，把這種下跌趨勢的俯瞰圖謹記在心的話，就會知道當上漲到頂之時，也就是要準備考慮如何下空單的時期了。


    圖4-12的情況下，形成反下半身的黑線⑥以「騙線」作終，5日線與20日線變成「蠟筆」，兩者平行繼續往走，因此可以再度在⑦的紅線下單買進，利用7日法則，在第七根紅線⑧的地方獲利了結。


    話雖如此，如週線圖所示，從底部低點開始算起的上漲根數（上漲的K線根數）與20週、60週線顯示的下跌趨勢依然持續，雖然最終以騙線結束，但是如果一併考慮日線圖中出現的⑥的反下半身等情況，就會發現，週線圖中的暫時性上漲結束後，很可能再次回歸下跌行情。


    在那之後出現了反下半身⑨，在此試探性賣出後，即可信任週線圖中顯示的下跌方向加速現象，在⑩、⑪的反下半身之處也能成功追加買單。因此，以週為基準來看，從純NON過渡到反PPP的趨勢中，使用賣空的方式，即可換取可觀的獲利。


    人果然終還是需要長遠的大局觀。談到股票投資上的大局觀，毫無疑問的就是月線、週線等長期線圖了。


    首先，最重要的是以週線掌握大趨勢。若把週線圖比喻成「釋迦牟尼佛」，那麼日線圖就像是在佛祖手掌心跳來跳去的小人兒。


    以週線為基準，確認了反PPP、準反PPP這種強烈下跌訊號之'
