  md: '# 附錄


    # 台股的融資融券與借券相關規定


    唐祖貽


    第6章提到日本股市關於融資融券交易的相關規定，日股的融資融券交易分為「制度信用」與「一般信用」兩類。前者相當於台股的「融券交易」，是受到證券交易的管制才能進行的交易。


    台股有關「融資融券交易」的規定其實和日股的「制度信用」大同小異，同樣要先開立「信用交易帳戶」。至於開立信用交易帳戶，需要具备的條件有：已開立普通買賣帳戶滿3個月，且最近一年買賣成交10筆以上，累積成交金額達所申請融資額度之50%，另外申請時需附相關的財力證明。


    目前台股的信用交易額度共分15級，從最低額度50萬到最高6000萬元。投資人可以視自己的財力狀況與交易記錄，決定申請哪一級。


    另外，以台股來說，要成為融券交易的標的，需符合以下三個條件之一：


    +   ·上市、櫃滿6個月且每股淨值在票面（10元）以上的普通股股票。若無面額或每股面額非屬10元者，為上市滿6個月且財務報告顯示無累積虧損


    +   ·上市、櫃滿6個月且財務報告顯示無累積虧損的臺灣存託憑證'
  merge: -1
  img_proc: true
- pgno: 236
  md: '+   · 上市、擱滿6個月且非外幣買賣的受益憑證


    至於融資融券的成數，在一般情況下，上市股票融資成數為60%（上檔50%）、融券需繳的保證金為90%（上檔100%），也就是說，融資的自備款是40%或50%，融券則需準備保證金90%或100%。另外，融券賣出時還要繳「借券費」，是成交金額的萬分之八。


    以融券賣出為例：


    # 買賣計算題


    阿明融券賣出聯電股票五張，成交價15元，融券成數90%，借券費萬分之八


    ```

    融券借券費=15× 5,000×0.08%=60

    融券保證金=15×5,000×90%=67,500

    手續費+交易稅=75,000×0.1425%×0.3%=332

    交易成本=67,500+60+332=67,892

    ```


    另外，融資是券商借錢，融券是支付保證金借股票賣出，兩者都需計算利息，不過融資是投資人需要支付利息給券商，融券則相反，券商需付你利息。計算方式分別是：


    ```

    融資利息支出=融資金額 × 融資利率 × 天數 ÷365

    融券利息收入=支付保證金 × 融券利率 × 天數÷365

    ```


    目前各券商的平均融資貸告利率約5～6%，融券利率則很低，通常不到1%。'
