  md: '接下來如果又要開始下跌，只要再度下單賣出即可。


    於是，在⑬的黑線之後，對 3 日線形成下半身的大紅線⑲出現了。


    此處我建議以 0—2 左右的部位進行嘗試性買入。


    之後，A 區的 3 日線與 5 日線都持平，但是你再仔細一看會發現，因為在⑳的紅線上，10 日線由向下轉為上升；在㉑的紅線位置，3 日線、5 日線、10 日線雖然持平，但是都密集聚攏在同一個地方，所以要追加買單到
