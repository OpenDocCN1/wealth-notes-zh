- pgno: 111
  md: '然而，也有像圖③所示，5日線跌破前一個高價的情況。③在那之後又跌到前一個低價的位置，隨即止跌轉為上升，接著出現下半身。這時的訊號比②的情況還要更弱一點，因此即便同樣是下半身，買進的數量也要控制在少量為佳。


    ③的情況是，5日線更進一步回升至前一波高點。在暫時下跌後，再度往上漲形成強勁的動能時，此時下半身若登場，就是真正的買進訊號。


    不只是上漲模式，在①的階段也至少要想好一個下跌的模式。


    那就是④的模式。不只是前一個高點，5日線更進一步跌破前一個低點後，雖然暫時反轉上揚，但是前一個低點成為阻擋上升的壓力，導致再次下跌。到這裡為止都能理解的話，就應該能預測接下來的發展：反下半身訊號將會以穿破反轉向下的5日線形式亮燈。


    ④的模式又是如何呢？在反轉上揚的局面中，你應該能夠想像這樣的劇情：首先會出現黑線**A**，接著會出現像是跨過5日線似的下半身的紅線**B**。黑線**A**會成為止跌的前一步，因此也可以在此妄想出一根帶有長下影線的黑線。


    不過，④的模式中，5日線不只穿破了前一個高價，連前一個低價也突破，可見股票價格的變動非常弱。


    因此，即便在紅線 **B** 時試探性買進，上升也不會持續太久。一定會在碰到5日線的前一個低價線後，再次反轉下跌。7日法則的平均數是4，因此只要再出現一根小小的方格型小紅線，接下來肯定會以黑線形式再度下跌——如果連這麼細微的變動都能夠想像出來，就可說是'
