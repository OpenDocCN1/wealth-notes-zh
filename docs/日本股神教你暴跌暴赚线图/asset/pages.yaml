- pgno: 9
  md: '人在日線誤以為股價跌一段時間後要大漲，而此時往往又是空方的最佳出手時機。


    人類在四百年的股票歷史中，每個時期出現過無數位超級作手甚至股神。毫無例外地，這些人都在心中堅持一套操作的邏輯。同時，他們在在提醒我們反思與紀律的重要性。跌宕起伏的K
    線讓無數人趨之若鶩，股價的漲跌都是常態。正因為預測漲跌的魅力無窮，這種投機性讓人深受吸引。


    相場飾朗告訴我們，成功的交易者除了具備技術分析的本領，還必須透過不斷的練習，找出缺點並且反思錯誤，關鍵就在於不斷地磨練技術，只要願意去做，就會有成果。


    我在操作與教學中也提過：理解眾多技術分析方法後，最後就必須透過實戰來整合理論。如同一刀一式，實戰經驗就是把零散的每一招式彼此銜接，從而實現戰法整合，才能夠享受協同作戰的樂趣。'
