- pgno: 159
  md: '到，以融資融券交易制度來融資買進或是融券賣出的情況下，按規定必須在6個月以內對沖清算（註：台股規定期限亦為6個月，但可視交易者信用狀況延長6個月，並以二次為限），因此以股價的波動來說，6個月是一個非常重大的時間關卡。


    站在高處綜觀週線圖的股價變動時，一定要留意3個月、6個月這些日期，這就是圖 4-10帶給我們的啟示。


    除了週線的 PPP 之外，接下來也看看週線的反 PPP 吧！


    圖4-11年代相當久遠，是 1996年～1997年之間，亞洲金融危機時的日本郵船週線圖。


    粗框內顯示了準反 PPP 暫時夾著純 NON，形成反 PPP 的過程。


    # 圖 4-11 週線反 PPP 的賣空技巧與「為跌而漲」的行情


    ![](img/995fe8c16a19f37c02681d08b0e34a73_159_0.png)'
