    為了進行股票的「賣空」，你必須先向證券公司開設「信用交易帳戶」。這時就會冒出一堆像是「標借費」或「融券券償」之類獨特又古怪的用語，確實有其難懂、難以親近之處。


    如果本書一開始就仔細說明這些制度與架構，恐怕會變成一本頭重腳輕的書，因此，我會將這些有點難懂的融資融券交易制度放到最後才彙整，用淺顯易懂的方式解說。'
