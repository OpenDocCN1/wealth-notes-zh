  md: '相場式交易法中，還有一種訊號叫做預測「下下一步」。


    請看線圖，A 點是 5 日線突破了前前一個低點的時間點，接下來 5 日線再越過迫在眉睫的前一個高點線 B，接下來就算下跌，若能在不跌破 A 的低點線前提下，再度轉為上揚的話，就可以考量「打底的狀況已經相當鮮明，當下半身訊號出現時，即可正式的做多取勝」的可能性。這就叫做預測「下下一步」。


    總之，看圖的第一步就是尋找「5 日線的前一個低點、前一個高點」，以及股價的「關卡」。


    之後，你可能會想：「若是越過了 5 日線的低點 A，接下來希望能越過前一個高點 B。」但實際上，要是越過的話並不應該就此買進（買下去的話就表示你還是初學者），而是想到：「既然行情跌到這個地步了，5
    日線越過前一個高點 B 之後，雖然一定會暫時下跌，但是這個下跌若沒有跌破低點線 A，又再度越過高點線 B 並轉為上揚的話，應該要瞄準這時候再買進。」


    如果你能夠以 5 日線的高低點為題材，妄想出這麼長的劇情，就可以說是獨當一面的股票賺人了。


    圖 3-9 的情況，其實也正符合上述「妄想」的結果：5 日線雖然只突破了高點 B 線一點點，隨即暫時下跌。但總算還是沒有跌破 A 的低點線，再度上升。這時候形成的
    5 日線新低點 C 已經遠遠超過前一個低點，因此已經達成了「向上突破 5 日線低點」。此現象的原動力，就是大幅向上穿越 5 日線的半身紅線⑩。


    紅線⑩才是真正的底部上漲的訊號。實際上，股價也從紅線⑩開'
