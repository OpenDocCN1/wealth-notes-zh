    最近雖然已經比較克制了，但是我說的話有時聽起來有點「色」，完全是因為我希望大家用盡全力去幻想「股價如果那樣的話，嘻嘻嘻♡，就會變這樣」「股價如果這樣的話，嘿嘿嘿♡，就會變那樣」，就像青春期思春的高中生在妄想一樣。


    「如果那樣的話，就會變這樣。」「如果這樣的話，就會變那樣。」想要讓價格波動的「迴路」清楚地浮現在腦袋裡，就得把每檔個股過去30年的線圖 × 日經平均股價指數採用的225檔個股（又或者是
