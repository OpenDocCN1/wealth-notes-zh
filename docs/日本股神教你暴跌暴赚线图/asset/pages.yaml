  md: '# 圖 5-14 東洋水產進入下降趨勢的放大圖


    ![](img/995fe8c16a19f37c02681d08b0e34a73_212_0.png)


    再隔一天雖然出現了紅線④，但是在其局面中，3日線與5日線都是朝下的，且兩條線間隔變寬。更有甚者，均線的排列從上到下是20 > 10 > 7 > 5 > 3，短期來看是反
    PPP 狀態，也就是下跌正在加速的狀況。


    在這個狀況下，即便出現紅線，也還是要以均線的方向為重，才能避免過早停利。


    隔天的 K 線⑤雖然開始越過5日線，但是又再度出現黑線，研判下跌的趨勢越來越強，便追加買單。之後就如圖所示，急遽的下跌趨勢加速進行，均線在維持 10 > 7
    > 5 > 3 的期間，即便出現紅線也是繼續賣。'
