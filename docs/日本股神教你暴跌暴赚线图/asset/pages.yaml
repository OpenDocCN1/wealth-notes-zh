    低點緩緩往下走 | 【並列黑】

    天花板一帶有實體，黑線並列 | 【吊人線】

    在高價圈中將發生混亂的前兆 | 【相場的收盤價巴爾坦】

    一出天花板圈就變弱 | 【上漲後下跌】

    再上漲後又會再下跌 | 【高價形成後下跌】

    黑線也站不穩 | 在高價圈中兩根大黑線包來一根紅線，會進一步下跌 | 上漲後高點與低點都在下跌，出現連續的黑線 | 連續出現大紅線，最終仍出現破紅線的黒線
    | 雖然持續短線震盪，但下行力道強


    高價圈、底部圈出現在趨勢的初期、中期、末期、轉換期的任何地方都很重要'
