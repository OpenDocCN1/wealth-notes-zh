    也就是说，如果晋升太少，那么就算信息的获取系统完美，让所有单个信息成本保持永久不变，增量信息的边际效益会还是 would 继续降低，照样要亏。


    因此，晋升层级太高或者太低都不好——但是随着信息系统的时间推移，同时为了补偿不可能完美的信息获取系统，晋升依然会是总体趋向“越来越多”的，信息要求也越来越高。


    而清除晋升系统的成本是需要新晋升系统带来的效率给付的，可是新晋升系统的动力并不大，而且也绝对不会很大（旧系统还能给新系统提供额外的好处，那就更不会有动力了——如果采取新系统有更大权力的做法，那么下一个组织权力要更大，但是权力不可能无限大的，因为相对值最大只有
