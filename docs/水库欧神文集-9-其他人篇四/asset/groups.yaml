    这是一个两难的问题——或者说，它本身就是一个系统在不断运行过程中，为了修复核心系统的 BUG 而出现的阶段性补丁而已。


    注重“企业家的社会责任感”，是观察自己的系统的“现况”。


    而观察现况的最好办法是“诱饵”——抛出小小的“奖励”作为诱饵，哪个地方咬饵的“鱼”越多，说明当地现有的 KPI 系统越成问题。


