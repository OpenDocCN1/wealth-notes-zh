    ![](img/2fbf5bb58d4b1c92ed47382a34684a65_274_0.png)


    近来的情况，大家想必也知道，未来的情况，大家想必也有设想——我和大多数人认为的东西不同，我认为下一次人类将会经历一场“人类历史上堪比石器与火焰被发明同等级的史诗级事件”。


    这场史诗级事件，会和第一个石器和第一把火焰一样，彻底的决定整个人类未来的存亡命运。此文便是简要阐述这一史诗级事件的重要意义（详细的不能说），以及史诗级事件后如果人类依旧存续，则理解其价值何在——希望大家能摒弃旧有的价值思路看这篇文章。


