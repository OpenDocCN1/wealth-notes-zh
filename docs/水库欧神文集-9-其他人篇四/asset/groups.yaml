  - '[PAGE 112]


    的坦克的炮弹全给打完。


    而且那个时候这些地方因为拥堵，更不好撤。平时新加坡当局也能用照顾老弱病残的理由，把这些人安排在“方便的地段”，他们到时候绝对逃不出这些地方，而且交通枢纽也是马方抢占的重点，敌人来的还可以更快～怀柔+公信力+战时需求三不误，平时战时双赚爆。


    来来来，我 50 个老头换你丫一发炮弹，嘿嘿~我强买强卖，你不得不打~你是大炮一响黄金万两，而且打一个少一个（马来西亚炮弹不多），而我这边，你反而是帮我缓解人口压力~来来来，你随便炸，能把我炸亏算我输~


    但是如果我们另外算一笔账呢？


    如果要消耗同样多的敌人的弹药，新加坡用轻步兵或者其它方式去抵抗，就算我们假设新加坡有时间展开，但是地块本来就小，密度太高损失就会非常大。


    那新加坡就不得不维持更大的常备军员额，这样烧钱和税收对于新加坡经济的影响，能比组屋小？


    而且在全民兵役的情况下，如果全面依靠正规军来消耗敌人的弹药，那这些被打死的士兵是来自各行各业的，他们是新加坡任意人的后代或者丈夫。


    那样，更高价值的人和低价值的人会混在一起平均的死，组屋就不会了，是精准用没用换有用，而且还不需要额外花多少力气。


    如果新加坡用一根筋的方式进行单纯的军事防御，以随机阶层军人消耗为主体，那样对战后新加坡的恢复，影响不是更大？对于和平时期的新加坡人力资源的浪费不是更严重（因为员额必须更大）？


    如果新加坡的对外核心服务人员死的更多，那对自身在国际分工的主要领域里恢'
  - '[PAGE 113]


    复的不就更慢？


    那么他们以后在对马来西亚基层进行灭绝行为的时候，<u>因为自己的有价值人员死</u>伤过多，有些国家的利益自然难以被满足，他们岂不是会拿新加坡进行种族灭绝来要挟新加坡倾向于给他先恢复？这和讨债是一样的呀，一个催债人如果做的过分了，其它的催债人也会一起来的！


    可是如果新加坡的核心高价值人员基本恢复了，那么国际当然会支持他快点灭完快点好，别耽误大家赚钱，甚至还会出资提供人道主义救援来聚集马来西亚人，方便新加坡批量灭绝。


    —


