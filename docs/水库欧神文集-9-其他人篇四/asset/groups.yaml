    不过，如果真要从“这个人胳膊肘向外”来考虑，钢铁直男却也说不得是真的胳膊肘朝外。


    因为你直接去考察他的话，你会发现涉及“胳膊肘朝外”的事情的时候，只要这个内外区分变得更加明确，特别是“社会上经常说的内外或者忠诚与背叛的区别”的时候，他也很可能是更坚定地站在己方立场上的人。


    这个时候，很多女人或者男人都会说一句话。


    “其实他/她是一个好人，但是我们不合适。”


    然而现实情况却经常是：那个“我们不合适”的弱势一方，更可能“几乎都不合适，只能凑合”。


    一个残酷的事实是：绝大多数人其实是得不到爱情的，大多数还是因为生活需要而凑在了一起，然后顺带的发展了一点亲密和激情（只是为了各种需要，包括生理需要的竞争而提供的增值服务）。


    那么，直男和钢铁直男为什么会有这种差别，或者说为什么会有“明明胳膊肘时应该是没往外拐，但为什么生活中总觉得在往外拐？”


    原因很简单：不是因为钢铁直男真的要胳膊肘往外拐，而是他在绝大多数'
  - '[PAGE 221]


    事情上的时候是采用最简单的社会公认解决方案，而且是纯粹套公式——他想满足公式。


    在这里，钢铁直男和直男是不一样的——直男是觉得公式比较好，所以觉得你应该用一下才是；钢铁直男却是“要满足社会公式”。


    可以当作是日伪军在宣導小鬼子的良民政策——你不是和他关系好了才是关系好了，而是你要符合日本鬼子（外界规则）的行动规律（甚至不一定是结果）才算是关系好。


    你和钢铁直男在一起，感觉就是伪军他要盘剥你，你反抗了，他就叫鬼子兵进来打你。


