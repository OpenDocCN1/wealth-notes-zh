    在考虑具体条件以前，先应该明白这三个问题可能的标准。


    人类普遍认为另一个群体“和我们一样”的认同感需要什么？我想，除了一些最基本的生理和外观方面带来的影响外，最重要的是“社会影响”，也可以说是“人的本质是一切社会关系的总和”——虽然从哲学层面上来说，这个有很多种解释，但在“人认为对方和自己一样”这件事中，对方是否生活在和自己相似的社会下，有最基本的社会关系规则和生活方式的共同点，这些是人类有认同感的基础。

