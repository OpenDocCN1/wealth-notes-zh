    **“神灵再上，法制一切，违者腰斩。”**


    KPI 的特点在于：牵一发动全身的几率很大，渠限必须更多，规定必须更多，但是每一个有用的突变都能造福躯干，躯干又能给手脚更多的营养。整个人比较匀称，耐力好，跑得过我的打不过我，打得过我的跑不过我。万一对面打得过又跑得过，那我就发挥耐力优势给他打工，反正大家不嫌钱多。


    我头悬梁锥刺股，全面学习演化，再大的代价都不怕，卧薪尝胆的道路上手脚永远和躯干在一起。


    **“团结一心，运筹帷幄，决胜千里”**。


    OKR 的特点在于：渠限很少，只是大家均摊了演化次数，核心升级主要靠参考手脚的发展。躯干很瘦，但是胳膊粗的和腿一样，身体壮了就很能打。问题是胳膊和腿其实是在太能吸收营养了，常常是手脚胖了身子瘦了。


    可是身子要是一下子长胖，把大家都拉进来的话……手脚可能粗还是粗的，但是越粗的手脚越需要营养，越需要演化次数——躯干突然这样搞，在粗的手脚也没力气了。


    不过如果躯干生病了，手脚变瘦一点也能提供养分，身体缓过来以后再去把病原体抽死。


