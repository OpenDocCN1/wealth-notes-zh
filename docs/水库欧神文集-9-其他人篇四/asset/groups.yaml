  - '[PAGE 282]


    到部分农业社会的物质成就，却不能够形成和其它农业社会一样的紧密的大社会结构，很容易遇到点问题就鸟兽散了——如果仅仅是因为“抗灾”能力，那么能种酪梨的地方都是一年四季都能产出果实的，根本不用太多担心季节的影响。


