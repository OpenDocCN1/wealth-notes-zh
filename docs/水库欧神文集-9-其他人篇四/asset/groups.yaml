    然而对方的原点的引申出来的生活更美好的方式是：感受更多的心理波动。


    这样他可能会把 “绘画” 的优先顺位排在 “打游戏” 的前面，或者你玩游戏更在乎游戏的游戏性，他更在乎的是游戏的背景故事和矛盾冲突。


    当然，这只是个无伤大雅的局部而已，局部结构不一致总是存在的，可是很多时候却往往会出现大面积的结构不匹配（不是所有细节都这样，所以你需要的是有这个心理准备）。


