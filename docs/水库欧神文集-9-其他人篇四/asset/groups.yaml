    这种变化发生的过程中，我想是必然会产生原有强力集团与仲裁者的强烈冲突的，仲裁者必须自我发展，统一好弱者联合对抗，否则就会在革命的道路上天折。


    当然，在狩猎采集社会中还不可能有专业的历史信息记录人员，所以当时是否发生了激烈的冲突是不得而知的——之后是有的，尽管也不完整。


    # 二：农业社会。


    农业社会变革成功后，并不表示天下太平了，因为随着组织规模的扩大的同时旧有的“时间差管理核心”已经基本失能，所以必须探寻新的管理方式。


    这种新的管理方式至少要能够解决“在能存储物资的情况下，如何能够在各个群体手里保护好物资”，能把这套保全体系统定下来的仲裁者才能从狩猎采集社会的仲裁者变成农业社会的“统治者”。很显然，这就需要一种更加“动态平衡”的管理体系，要靠人的变动代替“时间差”。以我们中国人熟悉的方式，以及在其它不同的文明中以名字不同但原则近似的方式做到的，就是“文官”“武官”“人民”体系。


    ![](img/2fbf5bb58d4b1c92ed47382a34684a65_282_0.png)


    规模越大，文官和武官的差异也就越大，反之也就越小——因为组织规模越大就越不可能是一个个独立的聚落，孤立的抗风险能力和协助能力会更弱，欧洲的骑士城堡只是一个很短期的现象（说白了也就和我们原来偏远山区的“地主土围子”没啥区别）。


    文官掌握的是“社会资源的统计与计算和相应的管理的记录与分析成果”，而武官掌握的是“维系社会资源统计与计算和相应的管理能够在内部推行甚至对外推行的实力”。


    很显然，他们两者虽然在实际组织扩张的功能上都不可或缺，但是它们的利益又是互相'
  - '[PAGE 283]


    矛盾的，双方都是互不信任的。


    仲裁者的任务就是让他们一定程度上互信——注意，狩猎采集社会下必然有的“时间差”已经不复存在，而是以“储备能力”为基础。


    储备能力当然不可能是无限的，也是需要生产的。


    所以可以让某个势力更多的和生产有关，另一个势力更多的和**已有储备**有关。


    中国在大多数历史时期中更多选择的是让武官更多的与生产有关，文官更多的与储备有关。


    需要注意的是：这不是唯一的选择，也可以让武官更多的与储备有关，文官更多的与生产有关。


    **重要的仅仅是仲裁者如何利用社会实际最终生产者的那一大群人的力量和“管理模式宣传”的权力，来影响武官和文官的分配，于是就能够维持一种动态平衡。**


    当然，其中也有**固有矛盾**：由于文官和武官的最根本的矛盾无法解除，双方都不得不尽可能地扩大自己的实力。


    而在这样的技术条件下，实力的根本还是“人类本身”，即便有装备上的差异，其能力差异相对而言依旧是很小的——这种现象绝对不仅仅出现在“一线人员”身上，实际上整个管理链条中的每个人都是一样的，甚至是更加趋向于一样的（就好像欧神说的穷人其实比富人更容易有更快的加速度是一样的，农业社会更单纯，这种趋近速度还会更快且更加个体能力）。


    这个固有矛盾是不可能通过仲裁者进行动态平衡来进行彻底的遏制的，因为这要求其信息搜集和处理能力永远高于文官和武官集团的总和。这显然是不可能的，因为仲裁者也是人——而且所有人都是明白这一点的，中间没有任何“额外的加速度”存在。


    那么，在采取“**武控生产，文控储备**”的社会下，最终就一定会出现“武成为流寇，文腾空国库”的情况——如果再发生一次剧烈的灾害，那么武则不能被仲裁者控制，文则不可能应对灾情，于是就会发生总崩溃。


    如果情况反过来，变成“**武控储备，文控生产**”（欧洲大多数都是如此），那么武力就会挟持库存不断找事，文则会趁着国库空虚漫天要价扩大规模，最终导致文武矛盾不可调和，结果国库烧空了，生产根本没接上——所以说欧洲的“翻天覆地”相对于中国就更是因为偶发的自然灾害，通常是自己挑起的战祸。


    在这样的社会中，它们想达到而且能达到的，最终目的一定是指向“生产安全与储备安全的结合”。


    如果是武控生产文控储备，那么则是武对于生产极度关注，有大范围防御设施；文对于储备极度关注，有极好的过往记录系统。


    如果是武控储备文控生产，那么则是武对于储备极度关注，有小范围防御设施；文对于生产极度关注，有强烈的生产试验倾向。


    **在农业社会下，这些东西发展到各自文明的极致，也会是后世认为很难做到的，毕竟相对于后世的个体来说依然是一项极为困难的工程。**'
