    ## 天启的规律：中国的企业家社会责任


    原创： 肛门里拉出个电锯 水库线下


    ### 开 幕 雷 击


    问：中国要注重“企业家的社会责任感”么？


    答：不要。


    多问一句：中国能不注重“企业家的社会责任感”么？


    答：不能。


    再多问一句：为什么不能？


    答：自古以来。


    以下内容，可能“很简单”——本体真的很简单，但是要“深度发展思考，想出个长期稳定的方案”是最难的。


    注：此文必须结合前些天的《遗产税与演化论，演化论与文明兴衰》结合看，而且必须是看完全文的。


    #### 为什么不要注重“企业家的社会责任感”？


    欧神有说过。


    主要问题是：企业家一旦被要求责任感，那么交易就会发生偏离。“要求责任感”的组织，也必定不会是省油的灯。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……


    #### 那么为什么中国就肯定要注重“企业家的社会责任感”？


    自古以来，就算是不追溯到上古时期，那么至少追溯到“上一步”也要说一说啊，凭什么就一定要（会）呢？


    （是一定会，不是一定要。要是主观的，会是客观的）


    原因很简单：中国历来是 KPI 考核系统（至少到现在为止最稳定的是 KPI 社会模式）。


    KPI 系统重要的是“考核等级和考核类型”。


    越往上，KPI 考核内容就越是综合一个“公司”的方方面，这就必然包含“有关商人的 KPI”。（这就是必须要“商人纪晓岚系统”来进行体制激励，而 KPI 系统激励的核心是“等级提升”）


    作为社会从基层开始的商人，他的上升过程也会越来越多的面对这些“考核等级和类型”都又高又多的人。


    在满足这些要求以后，那么商人也是满足了更高的 KPI 考核等级和类型。


    这样的商人，特别是对内部的商人，那就一定带有“高级 KPI 系统服务属性，不管他是做什么的，他都已经服务了，最多加个词缀来精确表示分工属性。”


    用我们一个最熟悉的词汇来表示，这个词就是“红顶商人”。


    红顶——服务与层级，你是管理者，你不是“官”但你为其服务，等级还不低。


    商人——你的分工类别。


    所以“红顶商人”不是“拿着权力干活的商人”，而是“红顶/商人”。同理还有“劳动模范”，意思应该是“模范（红顶特批奖金）/劳动（职工）”


    对了，指出前面那篇《遗产税和演化论，演化论和文明兴衰》的一个错误（其实有好几个错误）。


    OKR 系统才叫“君授神权”——虽然他们的“君”经常选不出来，但是他们那样的分散解释升级，才能叫“君授神权”。


    KPI 系统或者说“奉天承运”系统，虽然皇帝是裁判长，但是本质上裁判长和神仙是平级的，他们遵循的都是“天道”。


    因此中国应该是“君神平权——君主和神仙只有职能不同，没有等级高低”。


    （当然了，职能部门是低于君主的，而职能部门代表的那个“神”并不是实际存在的——神更类似于“市场局部规律”这样的东西，而职能部门是“现在这一局部的代表群体和工作者”。）


    在这样的体系下的时候，KPI 是什么样的呢？


    我相信各位都在 KPI 系统的公司里做过事，或者自己的公司也用 KPI。我们都可以发觉，其实 KPI 系统里面的工作者都持有这样一种态度。


    “哼！我考了 100 分，可是爸爸反水了，他答应我买了游戏机，但是却没给我买游戏光盘！”


    正是因为 KPI 不能也绝不必要无限细致，所以才导致了这一点（但是呢……无限规则=现实规律=管理成本等于现实的一切=那我要“规则”这个简化高效模型还有层用？）


    在之前的文章我说过，KPI 本质上，特别是“满足工作人员需求”上它是“按需分配”的，考核“按劳分配和按功分配”只是一个愿望，而且这个愿望本身也是基于“更好的按需分配”的。


    KPI 系统的竞争力，就是考核本身更加“符合需求”，大家都舒服——但是，这个需求不光包括“我已经说了”的需求，你得和乔布斯超前考虑用户习惯那样去满足。


    （所以中国的乔布斯爱好者惊叹于“卧槽乔布斯神机妙算，神仙皇帝”，而外国人更多的是感慨“这样的人也能活”。因为中国人是 KPI 系统，欧美人是 BSC 系统，我们更在乎的是算到未来需求，欧美人更多的感慨于奇怪但有效的斗争方式）


    但是因为必然的不完备，所以也肯定会有“我做到了，但是我没达到我的需求”的存在，KPI 也就低于劳动者预期啦。


    因为你考了 100 分，你想要个游戏机。你的目的当然不是“我家里摆个游戏机”，而是可以打游戏。


    但是爸爸没给你买游戏光盘，那你就打不成游戏，所以你觉得努力考 100 分亏了。


    你和爸爸抗议，**有时管用**，这是因为爸爸也明白“游戏机要光盘，而且我要的是你听话继续读书，我是奖励你，所以我不能让奖励白费”。


    > 这个前提，是基于“爸爸比孩子懂全局，但是爸爸也能理解孩子对游戏的局部”。


    如果爸爸不懂这个局部，那么 KPI 就可能要出问题。


    比如说这样的情况。


    “爸爸，我这次考了 100 分，我想买一台打游戏的电脑！”


    “乖娃，多少钱啊？”


    “不多，我玩的游戏不需要很好的性能，3000 的电脑就够了。”


    “行，爸爸答应你。”


    期末考试过后。


    “爸爸！我考了 100 分！”


    “好的乖娃，爸爸给你买电脑！”


    买了电脑。


    “爸爸……电脑里没有游戏，我要买游戏！”


    “行行行，游戏能多贵？”（爸爸小时候游戏是 5 块钱一张光盘）。


    “好的爸爸，那我要买《模拟人生 4》，全套 DLC；我还要《P 社四萌》和全套 DLC。”


    “就两个游戏，行！”


    “爸爸，是五个游戏，《P 社四萌》指的是四个游戏……”


    “好吧，多少钱啊？不过也无所谓，3000 块钱都花了。五张游戏光盘，二十五块……哎？儿子你在算什么？”


    “爸爸，我算好了，五个游戏+游戏 DLC，一共 8700 块。”


    “卧槽！? 我丢你大爷!!!!! 你个臭鳖犊子! 我已经给你买了电脑了，不算食言！”


    假期结束，孩子回到学校了。


    “欸？小明，听说你爸爸终于给你买了游戏电脑？”


    “不要叫我小明，叫我小萌。”


    “为啥？”


    “因为我草他大爷，放假只能玩扫雷。”


    “那你好好读书的动力都没有了吧……”


    “不，我要更好好读书，不过我不会和我老爸要求的那样，我以后不会去考商学院了。”


    “那你要干嘛？”


    “我要去军校。”


    “去军校干嘛？”


    “到缅甸扫雷。”


    在这个时候，爸爸正确的做法是什么？


    当然是事先就知道孩子的游戏是什么，一共多少钱，这样才能心里有底——可是爸爸到底不是孩子，不可能 100%知道孩子的需要的，所以他还停留在 5 块钱一张游戏光盘上，结果没能起到激励效果。


    但是如果爸爸做的好呢？那么在孩子的眼里，爸爸就是一个“无所不能无所不知的神人，但要求很多”的家伙。


    这也是主要的中国家庭中家长对孩子树立起“权威”的核心。


    当然了，其它文明的教育这里也有用到，只是中国的时间会更长一些，通常到青春期以后才减弱。而西方文明在童年期过后就不再要求；阿拉伯则在童年后就开始有复杂的“孩子如何表达需求和自行权衡是否提出方案”的教育。


    中国家长在青春期以后才减弱的主要原因，还是因为近些年中国发展快速，大多数 KPI 变化超过了父母原有系统的想象——农业时代是“有生之年”。


    也就是“太多游戏都 TM 要 8700 块”了，老爸没想到。


    所以我们的“子女教育”这一块妖孽很多，因为大家都在病急乱投医——方法最多的是 OKR 系统，所以虽然现代教育模式是西方思路（BSC），但是中国人用起来对孩子的要求却更多的是“阿拉伯
    OKR”的方式，要求孩子自己成为一个部份领域独立考虑的人。


    中国家长对于孩子的“独立性”的要求，和西方的独立性意思差距很大——所以中国家长如果把孩子变成了西方式的独立性，他们会很不习惯（事实上极少数把孩子带到阿拉伯世界读书的反向好得多，但是他会觉得我们不公平）。


    这样的情况出现在社会上，等于是“最好的 KPI 设定是超前设定”。


    虽然实际上这是不可能的，KPI 不可能总体永远超前（那只是运气好或神人），所以说只能是“更快的跟进”——信息传递速度和可靠性所决定的。老毛不可能每年都有，乔布斯也只能用库克。（库克已经算极度牛逼了，想想麦考利夫？）


    但是无论如何，都意味着 KPI 系统中的工作者实际上都是在要求更上层 KPI 制定者是“神”级的。


    那么，如果是直接可以和“神”通信的，可以很大程度上影响“神”的人呢？


    自然是“半仙”——绝大多数人都会天然的这么认为，这是无法变化的，因为教育别人不要那么天然地认为也是需要额外资源的（如果你彻底补上了，你的管理成本优势也就没有了）。


    中国人对于“红顶商人”的要求就是半仙——没有权力，但是带有不证自明的责任。


    红顶商人不是“父母”，但是“年级考试前10名的同学”。


    这个同学在家长会上说的学习技巧，就是“红顶商人”的责任——要说得好，要让自己能做，而且父母能听懂，大家要满意。


    然而问题来了：说的大家能明白，这个本来就挺难的，也不比设定KPI 简单到哪里去——要做一份完美的报告，而且还得有效果。


    光这样还不够，人家还得“满意”——尽量一碗水端平。


    这可就太难了。


    但是难也就罢了，关键是他如果做的坏，他就要承担超额后果。


    他如果做的好，那么 KPI 系统以后找他就更多，成本会更高。


    一笑加一笑（微信名：150500211）邀您加入水库交流群。群内文集每月一更新……


    这是 KPI 系统绕不过去的坎儿，**也就是“工作层”和“管理层”之间的信息隔阂，工作曾要想晋升为管理层，必须在升级前就补偿获取这些信息的成本。**


    但是随着组织的日益复杂，这些信息要求的量会越来越大，最终导致工作层无论如何努力都无法补偿信息成本了。


    此时晋升系统就会从下到上慢慢失能，全社会的激励效果越来越低。


    **而由于 KPI 监察系统的旧规则消灭的总激励程度肯定不大于总新指标设立（否则监察系统没有足够的资源撤走旧系统），所以信息成本一定是处于宏观上升的。**


    公司有时可以彻底改革 KPI，是因为公司有外部社会系统——可以融资，可以借钱等等，实在不行还可以存钱。


    **就算是自己存钱，这个“钱”的作用的保证也来源于外部社会的规则。**


    **但是对于一个“力量主体”来说，它并没有“外部”可言——它是无法存钱，无法融资，无法借钱的。它的“生存能力”永远是“实时”的，一旦暂时失去，就会遭到不可挽回的袭击。**


    举个例子：小国家可以靠“国家发展银行”来融资，如果出问题了最差也有联合国维和部队。**它们哪怕是全面改变的风险，实际上都一定程度上可以用外部世界的固定机器来处理。**


    **这也就是国家存在的必要性，世界永远也不可能是放任的资本主义自由经济，因为必然会有个力量顶点是无法通过“外部资本交易”存在的，它的存在无法靠资本市场维系，因为它才是维系资本市场的——因此国家存在的最核心任务就是保持稳定和保持安全。**


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……


    可是如果是联合国五大常任理事国面对同样的情况呢？


    那肯定没有任何一个组织，任何一种方式，可以让它们“全面凭借外界的规则”来恢复自己。


    因为对这五个国家来说，哪怕一年没有军队，一年失去经济稳定，一年造成巨大动荡。


    那么敌国就会来犯，无论是真的军事来犯还是全力下绊子。


    所以对于这五个国家来说，他们的实力其实是不能“存钱”的，更别提融资了——它们的存在决定了其他国家能否融资，但是他们五个不能期望自己也有同样的待遇。


    这也就导致五常里面任何一个国家，管理层都不可能主动发起对自己的核心管理模式更新——事实上即便是被迫的，后续的人大体上也会接过前人的接力棒。


    这是因为核心不是从属地位的东西，它不可能靠别的东西支撑或者缓解。


    这意味着核心的变化必然会有个“核心功能存在的间断”。


    对于小国而言，如果外部还在，那么这就相当于自己主动学习游泳——就算溺水快被淹死了，还有机会被人捞上来抢救。


    抢救一遭，“心脏重新开始跳动”，等于是“生命间断，但是死而复生”。

