    > （瞧瞧这性价比，我真感动的快要哭了。马来西亚可没什么重装弹药生产和储备能力，打破原始的堡垒防御却又需要消耗最多的炮弹，新加坡却依旧能精打细算。）


    大家想想，50 个无所谓的人换一发炮弹啊……他们加起来都不一定有这栋房子值钱，而同样换取那么多炮弹的轻步兵，比这 5 个房子还贵多了，更别说其它重装备（考虑到新加坡没有机会组织后备力量的有组织反抗，直接轻步兵混乱抵抗的损失还会更大）。


    这笔买卖可不是谁都能做的，地形狭小是新加坡的劣势，但是他们也可以尽量缩小这个劣势，在这个过程中能做很多特别划算的军事买卖。


    要是所有敌人都能做这个买卖，那大家都把老弱病残绑起来往前推就好啦。别说用炮弹了，让敌人开车排队碾肉饼都划算，碾人至少都得烧汽油是不是？


    反正怎么都是赚——可惜其他国家没这个条件啊，毕竟敌人不是为了杀人而来的。


    现代兵器，哪怕是弹药都需要很多劳动力及工时的，非被迫条件下谁拿这些好东西换那种垃圾人头啊，脑子里有坑？


    所以，在这样的条件下，新加坡多建造组屋真的有什么不妥么？


    如果光算经济账，那组屋当然拉高了新加坡的房价，组屋甚至经常建立在一些交通枢纽上——十字路口，几个角各几栋，好位置让给了组屋。


    虽然平时更好的地段亏了，但是战时呢？这 4 个各占一角的房子，可以把头打降'
  md: '

    但是新加坡越来越需要多元化发展。


    马来西亚农业很重要，水源消耗大，时常发生水源短缺甚至干旱。


    ## 4: 新加坡军事部署困境


    新加坡很小，新加坡的主要武器装备和战备士兵在澳大利亚——如果新加坡被马来西亚突袭，那么即便在有一定军事准备的情况下，由于部队无法在如此小的新加坡良好展开（而且基地很容易遭到突袭，新加坡没有纵深提供反应时间）。新加坡本土驻守的部队，主要目的就是尽量的拖一会儿，哪怕是在被突袭分散的情况下，也要想办法让守军“不得不”抵抗。


    ## 5: 新加坡反击策略


    如果新加坡遭到攻击，新加坡在澳大利亚的驻军+装备+雇佣军，将会使用各国可雇佣舰艇进行投放（到马来西亚本土，从背后攻击马来西亚，也就是所谓的“翻边（挨家）战术”）。


    马来西亚虽然大，但相对于新加坡而言不富有，所以常备军力依然有限。他们最好的胜利方式，就是突袭新加坡，拿下新加坡全境解除武装后，立即回防本土。


    因为马来的海军是不可能阻挡雇佣舰队的（欧洲的很多军舰是可以租借的，交了保险就能打仗，沉了抖可以）。


    只有快速回防，在地面战中获胜——获胜的主要方式还不是正面击溃，而是消耗对方的补给。


    毕竟敌人是登陆部队，而且需要快速推进，其油弹补给是极为困难的。只要马来西亚方面能够快速回防，那么就有很大可能在消耗掉对方大量初期油弹以后，趁着补给短缺的全歼敌军——新加坡的所有力量，包括后备力量。


    新加坡就算相对富有，但是如果想进行大规模而且补给顺畅的登陆作战，他们的钱还是不够的。


    更关键的是，大规模登陆作战如果被提前准备，马来西亚势必会有所警觉。


    如果准备了一半，马来西亚就发动军事突袭，那么到时候新加坡准备一半的大规模登陆行动根本来不及转化为更小但立即可用的登陆力量。


    ### 上述内容的注意事项


    1. 新加坡对马来也是有同等威胁的，未必马来西亚一定是主动方。马来西亚面临的突袭威胁也是一样大的。


    如果马来西亚大规模突袭准备被察觉，那么它也会面对“准备了一半的大部队”VS“准备妥当的新加坡小一些的部队”。


    现代战争下，准备一半的部队的战斗力远不如完全准备的强，是发挥不出一半的战斗力的，可能五分之一都不到。


    如此一来，准备不妥规模大VS准备妥当规模小，反而是准备妥当的容易取胜——更重要的是，就算马方能够利用数量优势稳定战线，其有生力量在战斗中的损失也会很大。


    以马来西亚的军事体量，必定会失去持续作战能力，只能静待第二波新加坡的补给和后备力量到来。


    此时他们既打不下新加坡本土，也守不住本土。


    这样看起来是平衡的，但是新加坡的回防计划极易受国际关系波动的影响；马来西亚的突袭计划则因为军队整体素质不高而需要更大的突袭规模，机动难度和隐藏突袭意图的难度更大。


    所以双方虽然是采取平衡手段，但是双方的体量都不算是“单挑级对手”，外部扰动相对来说就特别大，直接导致平衡较脆弱。同时，由于最根本的矛盾，新马全面军事冲突的可能是可预见的提高的，是必定爆发的。


    **注意事项 2：** 一方是资本优势家长制社会，要多元化，需要大量廉价水源。另一方是农业社会，大量人口的基本生产和生存就高度依赖农业，是利润微薄的基础产业。


    新加坡有地缘优势，马来西亚如果能掌握新加坡，新加坡的资本优势并不会全部失去——虽然有损失，但是对于马来西亚而言依旧是赚的。


    如果新加坡战败，那么马方本身意图就是对新加坡家长体系控制的当局进行毁灭性打击，是彻底地打击；而且马来西亚领土比新加坡大得多，这就意味着如果留着马方的人，危险对新加坡人也很大。


    最佳策略自然是“让马来西亚的人生活水平低到无法有效反抗，摧毁马来西亚经济，把那些高利润产业全部纳入新加坡体系内”；对马来西亚人来说，也要对新加坡的所有高级力量做同样的事情。


    这对于马来西亚当局和老百姓（特别是农民），也会是一场实际结果类似种族灭绝的战争。


    **注意事项 3：** 无论谁拿下谁，外部其它力量的首要需求就是“新加坡或马来对外功能的恢复”。


    很显然，这个时候马来西亚平民和新加坡平民不重要，因为对于它国来说，这两个国家的对外功能都不是下层平民主为重的。


    但是在恢复过程中，任何胜利一方隔绝对方的下层平民都有利于对它国服务的核心功能的恢复。


    这两个国家处于国际平衡状态，如果外部干涉过多，不利于核心功能恢复。


    简单来说，就是：胜利的一方无论造成多大的人道主义灾难，只要不造成核心功能恢复异常，那么就不会有外部力量加以实质的干涉。根本不会有外力在乎失败一方老百姓的死活，甚至还会暗中帮助胜利者。


    然后，加上一个现象。


    新加坡的各项社会福利，尤其是组屋，其增长和加强执行，是随着他们和马来西亚的军事升温而波动的。


    军事一旦升温，新加坡的社会福利，尤其是对于穷苦阶层的社会福利就会提高。


    这并不是个例。


    只要是陆权国家及主要威胁来源于陆地进攻的都是如此。


    当然那些非常弱的国家就根本没这方面打算了，他们的军事系统几乎可以说是前现代的，根本没有“总体战”的能力。


    社会福利（刚需类型的，比如说住房、粮食或医疗等，有的时候拆迁也算）对于陆权国家来说，是一种非常有利于进行总体战的基础体系。


    （注意：现在能叫完全的海权国家的只有美国，英国的海权已经完蛋了。自殖民地独立运动以来，英国就越来越“陆权”，虽然它只是个岛国）


    （注意：有些国家总体来看是海上贸易为生，而且可能有一定的海军。但是如果它有面对高危陆上进攻的可能，或者它无法在海上击败敌人，必须内陆抗战，那么它很可能也是需要更多的社会“刚需”福利的。）


    社会“刚需”方面的社会保障，为什么和军事密切相关呢？


    主要是以下几条。


    1. 社会保障，是国家可以迅速切换和控制的“经济系统”，是掌握在国家手里的。它的效率也许很低，也会干扰正常的国家发展，但是它却是最高度可控的。


    2. 社会保障，是抽取社会高效率部份去过度损耗的补贴低效率部份。低效率部份会得到额外补贴，让其生活更好，甚至直接把他从死亡线上拉回来。


    3. 第一条和第二条结合，意味着国家可以直接控制非常非常大一群人的生活状态，甚至生死（短期内）。


    这三点结合，就是现代战争得以实现“总体战”的根本原因，也是现代动员机制的基础。


    《动员学》中有阐述。当然，一般外部可找到的教材，它们大都没有说的那么直接。


    ### 近代战争为何算不上“总体战”？


    原因很简单：执行力不够，组织能力太低，事先投入太少。


    如果一个国家要去通过“刺刀逼迫人去打仗”或者“抓壮丁”，那么它就不得不在战时分配很多力量去执行这一任务。


    在战时本来就已经动摇的社会经济系统里，再用当时的资源去进行此类行动是很难有足够效率的。


    最关键的是，如果采用这种方式，那么这些人是“可以跑”的，毕竟在这种时候，很多人已经一无所有，要么就是事先有所准备（毕竟钱拿到哪都是钱）——这就让“人力资源获取”变得很困难。


    也就是说，如果没有事先进行正确的准备，那么这些人是可以利用自己手头的资源或者能力逃窜的，硬抓进来，其战斗意愿也是很低的——因为从个人层面上来说，他们没什么可以保护的，而且也没什么战胜后的承诺（人家都把你抓来了，人家再给你承诺，你信么？）


    因此，我们需要一个社会福利系统。


    因为社会福利系统是当局“构建”下才能运营的，只要当局停止某些条件下的运营，一部分人就直接可以活不下去或者低人一等等——主动权在当局手中。


    这些人就更有参军或者支持军事行动的动力，而且周围获取额外好处的人，也会支持他们去参军，军人的荣誉会被社会氛围所鼓舞。


    在这个时候，给军人战胜许诺，就显得非常可信了。


    因为你是“在主动运营”才能获得好处的，并不是别人抓你去当兵的——关闭运营是绝对可控的，抓人去当兵却是有很大执行风险的。


    这就好比：一大群人被困在深水，大家都在用氧气瓶。


    你要抓人去和鲨鱼搏斗，你说赢了就给你一罐氧气——这个时候一罐氧气能吸引人去和鲨鱼搏斗么？可能不行，你说不定要告诉人家“包你一辈子氧气”，可是别人能信么？


    你抓人去和鲨鱼搏斗，甩给他一瓶氧气作为持续搏斗资源，那些人会心甘情愿地和鲨鱼拼死搏斗么？


    显然，都不能，至少风险很大——而你还得立即给付这些氧气。


    但是如果你平时就这么做：氧气多的人给氧气少的人分氧气吧，不分就打死。


    氧气分了，控制份额外氧气的人是你，你做了一套很复杂的输氧管道——这套系统虽然白白浪费了很多氧气，但是这个过程中“管道维持队”是紧密的利益集团，而反对者只是松散集团，紧密集团可以打败松散的反对集团。


    后来，鲨鱼来了。


    “因为有鲨鱼，所以氧气供应不得不减少，可能要有人憋死。只要有人和鲨鱼搏斗成功，我们就不憋死。”


    由于输氧管道是你控制的，是你给气才能让一些人活下去，你根本不需要一对一的威胁别人去和鲨鱼搏斗，你只需要“关闭一部分人的氧气通道”就行了。他平时获取氧气的能力的高低，大致上和他与鲨鱼搏斗的技巧无关——这些氧气本来就不是以他们知晓的方式输送的，也不是他们自己获取的，他们一旦失去了你的氧气就只能憋死。


    你也能更让自己说的“活下来的人以后都有更多氧气”更真实（因为你确实有能力，大不了让别人少吸氧气去补偿他）。


    这就是“公信力”。


    这个时候会发生什么呢？那些受到断氧威胁的人，将不得不率先进入对抗鲨鱼小分队，而周围的人也知道自己的利益何在，自然会给战斗组加油鼓劲——这个过程中又避免了“鲨鱼小分队被迫参战”的表现。


    对抗鲨鱼小队面子上有光，进入小队后立马有更多的氧气，那些外面还有氧气但已经有减少倾向的人寄希望于他们能够快点杀掉鲨鱼——**其实进入小队后那些人更多的氧气，也是从那些外面还有氧气，但还不至于赶紧参军的人的手里获取的。**


    而且由于自身的会影响以后的氧气供给，所以这些拿到了鱼镖的武装小队也会更加服从纪律，**尽量不成为兵油子，更不会趁机烧杀抢掠**——这进一步有利于争取人民群众对于灭鲨行动的支持，而且战斗力更强。


    **这个过程可以循环持续，可以打到整个“深海被困”群体近乎于灭绝。**


    比如说福利挂靠军事动员做的最好的就是德国普鲁士模式，到了柏林没剩多少人的时候，盟军还是得打到希特勒自杀以后，德国才投降。


    要是在近代和以前，要么早就讲和了，要么弱势方早就打崩了——这个时候投降都不可能，因为在这样的情况下，**优势方最可能做的事情就是“不接受对方的投降请求”**。


    **接受无条件投降，本身就是担心对方还有一定实力，还是能维持很多局部的对抗系统，战争因此还会持续很久。**


    有条件投降之所以不容易被接受，是担心它会成为缓兵计——**因为在现代动员系统下，喘息一小会儿给弱势方所带来的收益是非常大的，远比优势方大得多。** 如果优势方选择有条件投降谈判，那么它面对的风险会远比弱势方大，一旦中了弱势方的圈套，自己将被内部的人千夫所指。


    因此在现代，有条件投降还不如“和平谈判”，毕竟有条件投降谈判开始时需要停火，而和平谈判可以边打边谈，至少不给对方有一个能放心喘息的时机。


    当然了，如果弱国被强国胁迫延长战争（通常是削弱区域强国或者扶持己方弱小势力），那么大国就会按着弱国的脑袋要求他们“谈判的时候停火”。


    比如说当年第一次中东战争的时候就是这样，西方给以色列争取时间，让其成功抵抗并且在未来一直牵制阿拉伯世界。


    如果弱国不接受“按着脑袋”，那么强国就要去联合国组建“多国部队”，亲自下场完全消灭不听话的国家。


    所以，只有平时付出一定代价准备，让很多很多人不同程度的依附于体系建立好的工具生存，才能快速的把和平年代所有积攒下来的东西，所有残存的资源，有条不紊的全部投入到作战行动中去，可以彻底的从社会中榨取更大比例的战争资源，更有可能获得军事胜利（当然这里的资源包括人和物）。


    近代和以前的国家，自然是做不到这一点的，他们还得分出很多资源来用于维持员额，根本不能直接把和平年代积累下来的东西全部投入到战争中去——所以他们被现代国家击败了。


    军事威胁等级越高，福利体系的针对性也会越来越明显。


    比如说新加坡的组屋，以及原来东北地区的“筒子楼”分配房都是如此。


    新加坡的组屋，大都在各个稍微远一些的“周边”。


    虽然它本身算不上很好的“堡垒”，但是那并不要紧，甚至可能这样会更好一些。


    新加坡虽然是全民兵役的国家，但是新加坡在战时，每个人被动员的程度是不同的——这不需明文条例的不同（因为明文条例谁都会看，你不能显得不公平）。


    那些用不着进入组屋的人，他们会更多的在中心地带。


    新加坡被直接袭击的时候，其本地动员系统是没多少时间的——**在军营的现役军人可以进行第一波抵抗，但是这些人手根本不够坚持 5~10 个小时**，最多只能在关键投送道路上争取时间。


    真正的重头戏，在于新加坡的紧急动员机制。


    在一线部队被消耗殆尽以前，赶紧分发轻武器——新加坡的动员系统和以色列有类似，有分散的武器装备库，但是新加坡比以色列时间更紧。


    在这个情况下，大家都忙于自保，任何人都想拿到武器弹药，毕竟青壮年也都服过兵役。


    当然了，周边地区至少价格便宜点，设置武器库的成本也低，组屋附近当然是最佳地段。


    新加坡时间比以色列更紧，实际上分发武器（大家抢）就差不多已经要被打进来了，这个时候是没办法和以色列一样把武装起来的人有组织的形成一个个战斗单位来抵抗的。


    因此新加坡的本地驻防系统更加的考虑“自（被）发（迫）抵抗”。


    想一想那些拿到武器的人，如果没有很高效的指挥，他们会干嘛？


    当然是先去处救自己的家人啊。


    组屋的人口密度如何呢？新加坡的私家车组屋的人买得起吗？


    当然搞不起。


    所以他们就算见到家人又怎样呢？到时候根本没办法在拥挤的街道上用高效交通工具撤退的——他们能赶到，但无法离开。


    很好，那就就地抵抗吧——马来西亚军队突然出现在视野中，而人员密集的组屋必定是已经武装起来的人员最多的地方。


    周围都是这些新加坡士兵的亲人。


    马来西亚人当然也是草木皆兵了，自然是看到武装人员就开火。


    新加坡士兵怎么办？当然是撤退到组屋，依托建筑物就地抵抗。


    组屋是很好的抵抗平台——窗口小但密集，隔墙多容易衰减冲击波，政府建设全部是钢架结构而且结构强度质量上乘，但是入户户口很不方便，楼梯都是简易砖混，电梯也容易破坏。这样的质量，一直被国内的福利爱好者作为“良心工程”的典范。


    入户开口一旦被火力封锁或者楼梯被炸（这些楼梯只要被冲击波震到就会垮塌，新加坡的组屋的墙体和结构很结实，但是楼梯非常薄弱），那么里面的人只能顽抗到底——不得不这么做，因为自己就算挂出白旗，其它楼层因为有意的窗户设计的视野问题也根本看不到别人在投降（类似于碉堡的凹陷窗口或者外侧有玻璃房，你不可能站在玻璃房里的，还是碉堡窗，所以你根本没办法看到其他窗户在升起白旗）。


    所以，新加坡组屋里的人只要有一个房间还在抵抗，那么马来西亚人的炮火就不会停止，无法一起投降=你投降没用。


    新加坡的组屋都是多单元分体式钢架结构，根本不会和砖混结构那样在底层挨上一两发炮弹就垮掉。就算是老式组屋，它的结构质量也比常规建筑要好（支撑梁特别多）。


    稍微懂一点建筑+军事的人，是很容易看出新加坡的组屋的军事意图的——它就是高级的街垒，组屋区就是要塞区。


    ![](img/2fbf5bb58d4b1c92ed47382a34684a65_109_0.png)


    马来西亚军队必须用炮弹一个一个“抽积木”一样“抽”掉整个组屋的每个楼层，炸的只剩一个钢架子才能瓦解抵抗。


    更难能可贵的是，这些房子里有很多老弱病残，到时候他们肯定最来不及撤出房子，出楼通道又被炸没了，他们也不可能和年轻人一样爬废墟逃出去。


    可是在远处的马来西亚人能分辨老弱病残吗?


    只要有抵抗的房子的任何一扇窗户人影一晃，马来西亚人就必须用坦克发射高爆弹清理掉那个房子。


    只要这个建筑物里面有几个拿到武器的士兵在撤退家人，然而敌人已经进犯并且发现他的情况下，整个楼房里无论是武装人员还是平民，都会被马方认为是战斗人员。


    这是非常好的，因为那些老弱病残既不能为当下的斗争出力，未来恢复过程中也是累赘（国际势力可不在乎他们，国际势力要的是新加坡的贸易系统的运行）。


    可是，新加坡的这一机制，就能让这些免费人和高价值军人具有同样的目标价值至，都有消耗马方一颗炮弹的价值，这简直是划算到让人可以笑一年的买卖。


    老人本来就缺少未来价值，不能行动的儿童和婴儿本来就没投入多少资源，孕妇什么的更不用说了（她肚子里的那个东西还要 18 年才能用呢，而且都不知道能有多大用）。


    用这些东西去换敌人有价值的炮弹，这当然是求之不得的。


    大家可以算一下，用 T72 坦克（马方主要坦克）的 125MM 高爆弹，要清掉一栋组屋（不大的），那至少需要 10~15 发炮弹。


    组屋里面能有几个有较高价值的军人？到时候在房子里的多了也就七八个。哪怕是正规驻防也不会太多（高价值军人密度太高，一下子死很多会非常可惜，但是人越多确实能消耗敌人越多炮弹，只是边际效益会越来越低而已——因此，你需要降低边际成本）。


    这个时候要清掉他们，马方只需要 3~6 发炮弹——现代高爆弹威力很大，非堡垒级建筑根本来不及“跑到下个房间就能不被炸死”，所以那些只要开了火的新加坡士兵根本没办法换人家超过
    1 发炮弹，而且组屋的建筑方式下本来就很难机动。


    人家炮弹本来就有限，放你进去就是为了消耗敌人的弹药。那我让你能跑？那我辛辛苦苦花大钱造这个房子干什么吃的？我缺心眼啊？


    但是，如果他们能让整个屋子的几百号老弱病残都成为无法识别的需要消灭的人员，马方就不得不发射 10~15 发炮弹摧毁整栋楼。


    也就是说，这在良好的情况下，用 200 或者稍微多一点的无用底层平民，可以换到马方多多发射 4~12 发炮弹。


    也就是说在最倒霉的情况下，也只要 50 个平民就能换一发炮弹了，而且是对未来影响最小的人换的。


    > （瞧瞧这性价比，我真感动的快要哭了。马来西亚可没什么重装弹药生产和储备能力，打破原始的堡垒防御却又需要消耗最多的炮弹，新加坡却依旧能精打细算。）


    大家想想，50 个无所谓的人换一发炮弹啊……他们加起来都不一定有这栋房子值钱，而同样换取那么多炮弹的轻步兵，比这 5 个房子还贵多了，更别说其它重装备（考虑到新加坡没有机会组织后备力量的有组织反抗，直接轻步兵混乱抵抗的损失还会更大）。


    这笔买卖可不是谁都能做的，地形狭小是新加坡的劣势，但是他们也可以尽量缩小这个劣势，在这个过程中能做很多特别划算的军事买卖。


    要是所有敌人都能做这个买卖，那大家都把老弱病残绑起来往前推就好啦。别说用炮弹了，让敌人开车排队碾肉饼都划算，碾人至少都得烧汽油是不是？


    反正怎么都是赚——可惜其他国家没这个条件啊，毕竟敌人不是为了杀人而来的。


    现代兵器，哪怕是弹药都需要很多劳动力及工时的，非被迫条件下谁拿这些好东西换那种垃圾人头啊，脑子里有坑？


    所以，在这样的条件下，新加坡多建造组屋真的有什么不妥么？


    如果光算经济账，那组屋当然拉高了新加坡的房价，组屋甚至经常建立在一些交通枢纽上——十字路口，几个角各几栋，好位置让给了组屋。


    虽然平时更好的地段亏了，但是战时呢？这 4 个各占一角的房子，可以把头打降

