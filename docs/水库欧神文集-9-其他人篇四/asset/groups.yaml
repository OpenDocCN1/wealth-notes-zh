    可是如果是联合国五大常任理事国面对同样的情况呢？


    那肯定没有任何一个组织，任何一种方式，可以让它们“全面凭借外界的规则”来恢复自己。


    因为对这五个国家来说，哪怕一年没有军队，一年失去经济稳定，一年造成巨大动荡。


    那么敌国就会来犯，无论是真的军事来犯还是全力下绊子。


    所以对于这五个国家来说，他们的实力其实是不能“存钱”的，更别提融资了——它们的存在决定了其他国家能否融资，但是他们五个不能期望自己也有同样的待遇。


    这也就导致五常里面任何一个国家，管理层都不可能主动发起对自己的核心管理模式更新——事实上即便是被迫的，后续的人大体上也会接过前人的接力棒。


    这是因为核心不是从属地位的东西，它不可能靠别的东西支撑或者缓解。


    这意味着核心的变化必然会有个“核心功能存在的间断”。


    对于小国而言，如果外部还在，那么这就相当于自己主动学习游泳——就算溺水快被淹死了，还有机会被人捞上来抢救。


    抢救一遭，“心脏重新开始跳动”，等于是“生命间断，但是死而复生”。

