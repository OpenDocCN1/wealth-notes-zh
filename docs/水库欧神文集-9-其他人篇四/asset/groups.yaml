    的坦克的炮弹全给打完。


    而且那个时候这些地方因为拥堵，更不好撤。平时新加坡当局也能用照顾老弱病残的理由，把这些人安排在“方便的地段”，他们到时候绝对逃不出这些地方，而且交通枢纽也是马方抢占的重点，敌人来的还可以更快～怀柔+公信力+战时需求三不误，平时战时双赚爆。


    来来来，我 50 个老头换你丫一发炮弹，嘿嘿~我强买强卖，你不得不打~你是大炮一响黄金万两，而且打一个少一个（马来西亚炮弹不多），而我这边，你反而是帮我缓解人口压力~来来来，你随便炸，能把我炸亏算我输~


    但是如果我们另外算一笔账呢？


    如果要消耗同样多的敌人的弹药，新加坡用轻步兵或者其它方式去抵抗，就算我们假设新加坡有时间展开，但是地块本来就小，密度太高损失就会非常大。


    那新加坡就不得不维持更大的常备军员额，这样烧钱和税收对于新加坡经济的影响，能比组屋小？


    而且在全民兵役的情况下，如果全面依靠正规军来消耗敌人的弹药，那这些被打死的士兵是来自各行各业的，他们是新加坡任意人的后代或者丈夫。


    那样，更高价值的人和低价值的人会混在一起平均的死，组屋就不会了，是精准用没用换有用，而且还不需要额外花多少力气。


    如果新加坡用一根筋的方式进行单纯的军事防御，以随机阶层军人消耗为主体，那样对战后新加坡的恢复，影响不是更大？对于和平时期的新加坡人力资源的浪费不是更严重（因为员额必须更大）？


    如果新加坡的对外核心服务人员死的更多，那自身在国际分工的主要领域里恢复的不就更慢？


    那么他们以后在对马来西亚基层进行灭绝行为的时候，因为自己的有价值人员死伤过多，有些国家的利益自然难以被满足，他们岂不是会拿新加坡进行种族灭绝来要挟新加坡倾向于给他先恢复？这和讨债是一样的呀，一个催债人如果做的过分了，其它的催债人也会一起来的！


    可是如果新加坡的核心高价值人员基本恢复了，那么国际当然会支持他快点灭完快点好，别耽误大家赚钱，甚至还会出资提供人道主义救援来聚集马来西亚人，方便新加坡批量灭绝。


    所以，要我说组屋就是最划算的，新加坡不用组屋这种福利模式，那就是给自己找罪受。


    组屋让新加坡人是没别墅住了，但是也让新加坡当局把人给限制住了，更综合和更高效的权衡了“生产价值”与“死亡价值”。


    人类的进步，是组织度的进步为主的，所以这当然是好的。


    老百姓住上别墅，过上好日子，虽然能够提升“经济能力”——如果不设敌人和时间段的话，那么当然是这样的组织最牛逼。


    可是如果加上敌人和限制时间段的话，那么人住上别墅的新加坡，他们和马来西亚打起来，那就要有价值的人和没价值的人一起死了，那么多浪费？


    更别提想浪费都不一定有这个条件，还没弄到人呢，新加坡就没了。


    “好日子”是为了“在长期更好的活下去”，但是如果短期都有危险，那么一味地考虑长期没什么意义。


    就算一个发展更不好的组织，如果它的军事瞬间动员能力比你强，那么在你能够把经济实力转化为对抗能力以前，你已经没有了。


    当然了，不是所有国家的福利提高都是直接对接有计划的军事目的的。


    新加坡这样的可以，是因为新加坡的管理高度的一体化，高度的统一和集中，所以他们才能用最划算的方式，兼顾经济发展和军事安全。


    但是对于一些国家，他们内部就没这么统一，比如说欧洲国家。


    那么他们为什么也选高福利模式呢？哪怕是在军事压力不大的时候。


    这一方面是因为政体内部有问题，大家都不敢降福利。


    但是不敢降福利还有另一个原因——不患寡而患不均。


    如果真有人降了福利，其实那些不得不提高福利的人也未必开心，只有那些效率高的才开心——如果一个社会整体发展速度降低了，那么低效率的人更多，不开心的人也更多。


    但是如果提高福利呢？那么至少大家是平均的，而且高福利至少最终能服务于大家走向“最终解决方案”。


    就算是最后战败了其实问题也不大。


    因为三点。


    1. 只要你福利安排的是平均提高的，那么大家优先死的都是各自管理区域内的低价值人口。各个系统损失都是最小哒，没啥好不乐意的。


    2. 总体战可以用很小的代价，让很多人投入到绞肉机中，这意味着各个派别以很小的代价就能“重启”整个系统。


    比如说埃及好啦，埃及人那么多但是产能那么低，如果他们靠战时来“抓壮丁”，那么他们连抓壮丁的资源都没有。


    但是哪怕是尽可能的提高福利，那么就有更多的人能够更低成本的征召——原来 10 块钱才能一个壮丁，现在通过每年花 1 块钱，战时就能 1 分钱一个壮丁。


    福利系统就相当于“壮丁花呗”“壮丁分期付款”~


    商业上要是不形成大规模信用系统，那融资借贷自然麻烦，商业发展受限。


    社会上要是不形成同样的系统，到时候要买人命的时候，人命可就贵了。


    那么对于人口扩增已经造成问题的埃及来说，埃及提高社会福利水平有问题么？没问题。


    毕竟，要是总体战打赢了，那么自己的人口就有地方去；如果总体战打输了，那么死掉一半人，那剩下的一半人又回归到自己可以高效管理的规模下了。


    稳赚不赔……虽然最高层要下台吧，但是至少大部分利益组织留下来了，要不是他们的支持，那些高层都别想上台。


    3. 就算最后被打的无条件投降，那也没有关系啊，至少原来支持高福利的利益实体，他们是更多控制着这个国家“战或者降”的人——“无条件投降”的最后一的好处，不给发动战争的最高层也会给这些人的，这实际上反而更容易导致战败方出现一个统一度升级的管理系统。


    不然？就要变成“不接受投降”了。


    没必要闹得大家都那么不愉快不是么？为什么不快快乐乐的把需要死的人杀掉，然后大家各自握手言和呢？


    所以从博弈角度来看，一个非统一非高效的组织，更有必要拉高社会福利。


    毕竟都这样了，一直拖着也是浪费生命浪费时间，不如重盘一下，搞不好就进步了呢？这方面的进步也是大规模组织管理进步的主要动力之一，这些知识以后也可以运用在商业中（比如说统计学就是很明显的例子）。


    把肥的拖瘦，瘦的拖死没有任何意义，反而让系统容易倒退。


    不如总体战，输赢早好，该死的死，该活的活，免得大家百无聊赖等内爆。


    当然，这些内部不统一互相抬福利的国家，他们的“福利人命融资”自然没有新加坡那么划算——他们要花费更多的“老百姓住别墅”去换到同样的人命，效率比新加坡低得多。


    就比如那些欧洲国家好了，他们那种“互相抬”的结果就是——打起来虽然一样可以相对低成本的用人，但是死的人就更是随机价值的人，买卖不划算，不能像新加坡一样更加针对性的用废人换炮弹，军事成本更高。社会代价更大。


    如果一仗以后他们能有所长进，那么他们还有救。


    要是没得长进，那就当仆从咯。


    军事这个东西怎么讲呢。


    能控制暴力的东西只有暴力。


    发展主要靠人民，安全主要靠军队。


    军队人数永远比人民少，只占人口的极小一部分，那为什么这么点军队却能服众？


    因为军队的组织度更高，能对不能有效组织的平民进行各个击破。


    士兵听从军官，是因为生存资源被军官掌握。


    军官则是因为有其他军队的存在，别的军队联合起来就能消灭军官的存在。


    所有军队的资源均不为军队自己所掌握，是由社会最高层掌握，所以社会最高层的组织能力超越某一军官和他的军队。


    民众的组织能力是最差的，所以就能接受最高层组织的大管理，而一支军队却不能管理这么多地方，试图升级的军队将会被高层组织提前联合其它军队所消灭。


    战争和暴力怎么产生的呢？能消除吗？


    私以为不能。


    第一支长矛造出来的时候，它是工具，就算用来逼迫别人，那也是一种稳定。


    第二支长矛造出来的时候，它也是工具，另外一根长矛和它形成稳定的双寡头平衡。


    第三支长矛造出来的时候，它们的性质都发生了变化——军事之间是互相竞争的，但竞争意味着他们是有利益争夺的，所以也是互相吸引的。


    那么这三支长矛会怎样呢？这三个对同类利益互相吸引的又想避免自己被吞掉的长矛，就构成了人类永久的暴力不稳定。


    这就好比“三体问题”。


    三个质量，初始位置和初始速度都是任意的视为质点的天体，在万有引力定律下，三体问题不能精确求解，无法预测所有三体问题的数学情景，只有一些特殊情况能彻底研究。


    而现在的地球，有数千万的“长矛”。


    永恒的战争与暴力，从第三支长矛诞生的那一天起，就永远成为了人类这个物种生存背景的一部分（没有长矛也有战争，但是长矛意味着技术，技术意味着生产，生产意味着人类长期经济效率和短期军事效率权衡的出现）——长矛的诞生，并不会仅局限在“特殊可彻底研究”的情况里。


    完美的暴力平衡不可能存在，精确的计算暴力的变动永远不可能，所以一切组织都必须在这个问题上持续升级管理能力，否则就会被消灭。


    那么，我们看一下邓老师文章下的回复吧。


    这些评论里，谁优先作为“人命融资”或者谁更晚，这是一目了然的——但是问题的关键就是，这些反对评论里的人，他们支持“组建”与“福利”的人自然是优先在总体战中消耗的人，是不是“更划算”。


    越有价值的人如果越出现在反对邓老师的评论中，支持强度如果不能随着社会潜在贡献进行反向分布，也就是如果本该越有贡献的人如果越不反对，越没有贡献的人如果越没有狂热的支持，那么就说明组织能力出了问题。


    各等级人群支持度差距越小，那么就说明整体组织度越差，浪费越多——这意味着总体战中的不必要消耗，或者总体战需求程度上升（虽然这方面无论效率多高都会造成浪费，但要比谁无谓损失小）


    在同等问题上，我们如果去看新加坡的同类文章评论，我们会发现新加坡对比我们的确“更划算”一些。


    如果我们去看欧洲同类文章的评论，那么我们会发现欧洲评论的“优先级”不如我们和新加坡划算。


    这就说明，我们能用更少的发展代价换取更多的安全，也说明欧洲高层预期在总体战中需要消耗更多人来维持自己的地位，这又说明了我们的有效组织度比欧洲人高。


    现代国家的社会福利。


    核心就是“总体战”时的组织人员消耗的优先级——设置的越好，同等条件下，经济增速相对于对手越快，因为平时损失更小。


    这样，对方即便发动总体战也不能赢，而你迟早可以发动总体战消灭对方（如果你需要的话）。


    但是这里“为了经济发展”有个底线。


    那就是：至少能扛过敌人主动发起的总体战，在这个前提上效率损失越小越好。


    那么新加坡的“组屋”好不好呢？


    非常好，甚至可以说是世界最好的。


    房价高又怎样？只是老百姓日子相对过不好了而已，但是如果被打下来，那么新加坡高层就不复存在了。


    如果高层都不能不顾一切的去维持自己的存在，那么人类组织度提高又从何谈起呢？


    这个时候，新加坡人住不得别墅又能怎样呢？


    组织是为了存在而活下去的，平民过的好不好只是一个指标而已，服务于这个指标的东西只是管理工具。


    新加坡人住不住得起别墅，都是要看新加坡最高组织者服务于生存的结果的。


    辛瀚林之所以能够让那个女人去死，本质上就是“先给予”让对方陷入了“必须的，被无条件赐予的稳定”，在女的习惯以后，辛瀚林后进行了“快速的剥夺”。而女人因为突然被剥夺，希望能够快速争取回来——她选择了去死，就和普鲁士的士兵一样（现代福利配合军事动员体系的源头，是普鲁士社会）


    如果马来或者新加坡任何一方能取胜，那么在它们的环境下，确实可以缩小这方面的支出，更大程度的达到“人人住得起别墅”的程度。


    但是，那是要有一方近乎于被种族灭绝的情况下才可能达到的。双方都不希望自己是那个被灭绝的一方。


    当然，我们可以发觉，新加坡的效率其实高于马来西亚，但是马来西亚可以凭借更大的土地来让纵深更小的新加坡付出更大的成本，压制新加坡的效率提升，逼迫新加坡建设更多的“组屋”，进一步长期降低新加坡的社会效率。


    在水平没有绝对代差的情况下，国土面积大就是有这个好处，因此大国在军事影响经济方面的效率损失往往有更多宽容度，更容易抵抗风险，长久地生存下去。


    大国的效率优势，很大程度上就建立在“军事自由权”上——没有军事自由就没有经济安全，但缺少经济建设就没有军事资本。


    哦对了，最后大家肯定还有一个问题“为什么陆权国家是这样，那海权国家呢？”


    海权国家，它在历史上主要依靠控制航运路线来获取贸易优势，其本土往往比较安全——要么是本土距离敌人很远，要么是海军力量可以让敌人根本无法大规模登陆。


    这个情况下，海权国家对于内部自然不需要采取高福利政策，这样效率才是最高的。


    他们的士兵也只需要募兵制，因为愿意参军的是社会底层人，损失了也不那么可惜。


    海上载具的单个成本不会很低（大多数情况下军舰一般是越大经济性越好，但是这就注定很贵），不需要“全民生命融资”，也就不需要采取那种针对“刚需”的福利体系，主要的福利会集中在“生产与交易过程”上，比如说提供更多破产保护等。


    这就会成为一个很大的优势，也是三个世纪以来海权国家往往具有最好的发展条件的原因为什么，因为它有更小的“内部福利（军事动员准备）损失”。


    但是，海上航运利润更高，很大情况下是受限于运输技术的局限，以及陆地组织长距离运输时的不安全性（区域不稳定性，以及没能形成国际公约，每个地方都能擅自克扣运输者的利润，本质上就是“地球人组织度不足”）。


    如果安全性问题和基本技术解决，陆地运输在整体上效率更高，因为平均来看陆地运输有分销成本优势，时效性也更好。


    所以在大宗物资交易为主，但是生产合作和成品贸易属于次要的时代，海权就很好，反之海权的收益就没那么大——越不在乎时效性和分销成本，海权优势就越大（当然，也包括组织能力，毕竟跨国多元贸易也是需要更多的组织能力的）。


    如果大家更好的处于相持状态，比拼的更多的是经济而不是着眼于打仗——大家越来越多的能总体战的时候，大家反而都会优化结构，因为谁先动手谁更可能先死，而优化结构就能进一步降低此类成本，让成本累积速度太慢，延缓“不得不打”的时间。


    如果同时运输技术基本面解决的时候，陆权的优势会越来越大。


    人类主要群体毕竟是生活在大型陆地上的，虽然技术的开发会有波动性和偶然性，但是在历史上的绝大多数时期，陆地运载载具的开发优先级总是超过海上载具。


    这就意味着在宏观层面上，陆地载具的开发是总体牛逼的。


    有一天，陆地系统同样会被某种低成本的空运取代，但不会是现在。低成本的空运可能要在核聚变解决能源成本问题后才能出现，可能会出现全电动飞机，那个时候就有可能完成“全球大统一”了，因为成品运输成本终于被均摊到了大家都差不多的程度，大多数组织都无法再利用地缘优势来“钳制”对手的经济效益，全球所有高层组织的主要竞争会更多的转向长期经济效率与管理模式的竞争，擅自发动总体战的组织将会被更快扑灭。


    （注意，这里不是说海上贸易和陆地贸易不存在了，而是指高利润高组织的贸易侧重点改变了。海上和陆上将会成为“基本”，但不能成为“优势”，那些空中贸易策略很好的国家就有机会抹平海上和陆上传统贸易强国的优势——不过，就可预见的未来，海权带来的贸易利润优势将会缩小，越大的海权大国越受影响，它将最终养不起自己原来为维持高利润海权所建立起的巨型舰队）


    当然，就目前来看因为技术的局限性，所以在很大一段历史时期，水上运输工具的运输成本和速度都比陆上高。


    但是这个时期不是永久的，它一直是在来回波动的，21世纪以后，更多的成品交易让时效性产品更多，分销重要性上升。


    从现在开始，到21世纪后半页，超大型陆权应该又会重新回到高峰。


    此时，谁成为新的罗马，谁就能成为新的霸主。


    最后，给那些以为“社会福利”是因为“人民群众力量大，发福利是为了安抚”的人提个醒。


    组织只要还存在，人民的组织度就一定更低，更别说一个还能“发福利”的组织了。它从整体而言是绝对不可能需要“安抚人民”的。


    组织是不可能有“怀柔”的，也不可能是“仁慈”的，因为组织不是人类个体。它没有爱好，没有性格，只有现实——只有生存和灭亡，没有其它的东西是会让它关注的。


    如果有，这个组织就更容易死。


    任何平白无故从别人手里抢来给你的东西，这都是有代价的——如果没有代价，那么组织早就不存在了。


    如果你没有创造什么东西去满足这个代价，那么组织也可以得到一个东西。


    这个东西就是你的命——用你的命，去换取更有经济价值的命。


    战争所需要的技能，和日常技能基本是无关的。


    如果商业和社会日常不能逼你有效率，那就让头顶飞过的子弹来逼你。


    组织给的福利就是超级牟瀚林给的“爱情”，谁需要，就说明谁比较笨，谁比较笨，就先送谁去死。


    为什么要这么做？


    因为其它组织也是这么想的。


    所以为什么一个国家“奋斗精神”一定要有啊？


    因为如果一个国家洋溢着“小确幸”，就意味着组织正希望“一口气排除掉更多无法管理利用的人”。


    所以，世界上最现实的一件事，就是“如果你不奋斗或不正确的奋斗，那你就要为保护奋斗和更正确奋斗的人去死" 。


    当然，由于水库是"经济发展"核心的，所以自然也就更反对"蛆屋"这样的——这是社会不同分工组织的必要，社会总是在不同群体间平衡的。


    我支持蛆屋，不是因为和邓老师下面的那些愚蠢的评论那样的理由。


    只是因为我就是另外一个社会分工的人而已——经济学者和投资者，更多的是属于"让人永远更好的活下去"那一边的；而我是属于"把人在特定时刻更划算的送去死"那一边的。


    经济学者和投资者，他们本质在社会里都是属于善良阵营的，是"活"的一端。


    不过分为守序善良（计划性相对较高）和混乱善良（市场度自由度更大）。


    （中立善良不存在）。


    我的话，是"邪恶"，是"死"的那一端。


    我本人自然是守序邪恶阵营（以群体的必要安全底线作为重点），当然有些人是混乱邪恶（以无限提高安全来从别人手里获取经济资源，也就是军国）。


    守序邪恶，就是更多的制造"尽可能由廉价者组成的福利爱好者"人群作为总体战资源，但不会无限制要求福利增高，不希望把所有人都扯进来，不单纯的依靠军事解决一切问题。


    哦对了：马来西亚也学新加坡搞组屋，套路和新加坡一样（但是它们更注重面积防御，楼层底部机动性更好，这是因为马来经济比较差，常备兵素质比较低）。


    当然，对于各位看到这里的人，大概也感受到了“现代总体战”的残酷性——在一些国家责骂各种游击队拿零星老百姓作为掩护的时候，国家自己却拿所有人作为城墙。而且正是因为这个差别，所以国家才是国家，游击队才是游击队。


    不过，这只是现代“总体战”里面相对很温和的部分而已——想要进一步了解的，可以翻阅一下《动员学》丛书。


    动员学，就是守序邪恶阵营的精神内核。


    哦对了，顺带一提。


    新加坡的大部分人口都是在组屋区的。


    新加坡要恢复核心功能，只需要上层的一部分人，大约占总人口的 15%（当然剩下的多一点会更好）。


    新加坡 80%的人口，原则上都是值得做“困兽之斗”中消耗掉的（为澳大利亚投递兵团争取时间）——在开战伊始，新加坡本土的高级机构就会立即撤退，核心撤走，摧毁大部份民用航班和民用船只。


    马来西亚方面也是类似的，只是马来西亚方面动员能力差，不和能新加坡一样充分使用 80%的人口，他们不到一半。


    但是双方制胜的关键之一都是使用特种部队占领对方关键机厂和保护民用船只，给对方老百姓一条生路。


    只要对方老百姓感觉自己能跑，那么己方就更有迅速破城之机——当然了，双方

