    质资源来进行遗传，这样后代的繁殖效率会更高。”


    可以这么说：人类和大多数动物最不一样的地方，就是遗传更加不依赖于细胞核内的 基因，不完全依赖生物性状的竞争，物质也能提高“基因的再次复制效率”（其他动物当然
    不'
