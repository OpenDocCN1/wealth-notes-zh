    \n爱是“结构性”的。\n\n喜欢是“解构性”的。\n\n（注意，我对这些词汇的含义并不了解，理解也就名词解释的程度，但是因为看起来像是这样，所以我就用了）\n\
    \n首先，一个人一定会有一些心理和认知上的“结构”存在，这可能可以叫做“生活哲学”“判断方式”等等。\n\n在判断上，大多数人应该都有一个模糊的“逻辑原点”的存在——无论本人是否能意识到（实际上自己也很难非常明确的知道），但是一个人在做出推测和各种判断的时候，他都会更多的用这个“原点”来作为某种通用的单位或者标准来衡量事情。\n\
    \n哪怕原点和这个东西不直接相关也是一样，就好像一个企业的运行单位很多东西本身不和钱直接有关系，但是最终还是可以或直接或间续的用“能不能更好的赚钱中的钱”来衡量一样。\n\
    \n一个人的逻辑原点可能不止一个，也不可能只有一个，其实会非常多——啥都想要，直接要。\n\n但是，因为教育或者生活的种种原因，获取这些东西的手段会被整合起来，一个行为往往会同时达到更多的需求——可靠性，经济性，有效性都会增强。\n\
    \n可靠性是指这个行动可以稳定多次执行，经济性是指综合成本小收益大，有效性是指执行行动确实不是无用功——由于人类运算能力的限制以及信息获取的不完整性，这就要求人要想完成三者在大多数事情上的有机结合，是需要区分更少数几类的情境，然后使用相对更少的几套通用的机制的。\n\
    \n这些机制里面的衡量基础标准会发生近似，否则就没法想问题啦。\n\n在这个过程中，一个逻辑原点会针对不同的环境，形成不同的模型。\n\n比如说生活模型，工作模型，社会交往模型等等——当然，个人认为这不是按照功能分工区分的，而是按照“情境”区分的，习惯大于理智。\n\
