    人类与其它社会动物最大不同的地方，就在于人类有智慧，智慧是一种比本能更加具有通用性的适应工具——但它对于能源消耗以及稳定环境的要求更高，人类不可能在草地上随便啃啃就能活下去。


    # ### 人类的革命，往往是由工具推动的，即便是文化上的革命，本质也是因为工具改变了生产模式和生产关系。


