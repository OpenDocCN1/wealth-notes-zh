    此时，个体生命的有限又会造成限制——如果学习方向错误，那就直接浪费了生命，至 少机会成本是很高的。


    所以，人类个体必须在有限的生命中不断的权衡时间，风险与收益，去尽量有效率的完 成三件事。


    +   1: 生存。


    +   2: 繁殖。


    +   3: 确保繁殖成果。


