    （是一定会，不是一定要。要是主观的，会是客观的）


    原因很简单：中国历来是 KPI 考核系统（至少到现在为止最稳定的是 KPI 社会模式）。


    KPI 系统重要的是“考核等级和考核类型”。


    越往上，KPI 考核内容就越是综合一个“公司”的方方面，这就必然包含“有关商人的 KPI”。（这就是必须要“商人纪晓岚系统”来进行体制激励，而 KPI 系统激励的核心是“等级提升”）


    作为社会从基层开始的商人，他的上升过程也会越来越多的面对这些“考核等级和类型”都又高又多的人。


    在满足这些要求以后，那么商人也是满足了更高的 KPI 考核等级和类型。


    这样的商人，特别是对内部的商人，那就一定带有“高级 KPI 系统服务属性，不管他是做什么的，他都已经服务了，最多加个词缀来精确表示分工属性。”'
