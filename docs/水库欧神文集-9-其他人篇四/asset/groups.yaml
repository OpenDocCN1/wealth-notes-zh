    # 柬埔寨，沙县小吃，刨冰，欧神的“阴谋”


    原创： 肛门里拉出个电锯


    嗯，因为最近想什么都敏感，不能写，所以从大事情转移到小事情上面。


    既然大事不让讲，那我就讲讲来钱的小事儿好了。


    当然我肯定不能和各位在座的大佬比，我就说说一些小一点的事情。


    这次写的内容，广义上和市场信息有关，是一篇市场分析文。


    主题是：如何简单又可靠的考察一个地区的经济的稳定性与经济基本盘。


    副篇：发展底过程中，该如何挑选一个低成本可观察的指标。


    我们开始吧。


    先说重点。


    有沙县小吃的地方，沙县小吃多的地方，经济基本盘一定不算坏。沙县小吃再增加的地方，一定有很多生意可以做。


    这也是我认为柬埔寨那边有发展前景的一个重要原因（欧神那些东西太复杂，我 TM 不懂——因为知道问了也不懂所以我就没问，我信我自己的分析）。


    原因么，也很简单。


    无非几个。


    第一个最关键的：沙县小吃是小成本投入的项目，大多数加入进去的人并没有经过很复杂的计划。


    下面几个是沙县小吃有几个特点。


    - 1: “长时间营业，早中晚都能吃”。

    - 2: “之所以牛逼能铺开，是因为成本控制得好，主要是流程控制得好（菜品之间的协调很好，选材搭配符合成本和效益的较优配置，综合运营成本低）”

    - 3: “对本地化的大宗物资的要求相对较低，哪怕是食材也一样”——沙县小吃的食材，杂的都是耐储存好运输的，比如说各种党参汤里面的党参。主材是多元化的，不太受单一材料的影响而受到全局影响，而那些必须要的材料是

    '
  merge: 0
- raw:
  - '[PAGE 53]


    很常见的（比如说瘦肉和面粉，这些东西是个地方就有，只要这个地方的基础物资供应稳定，这些东西的成本就不会比对手高）。


    4：这个东西便宜，但是又不是最便宜的。


    5：都叫沙县小吃，容易识别。


    我们先从特点入手


    1：长时间营业，早中晚都能吃——越是劳动时间不稳定的，对沙县小吃越有利；因为快餐属性，消费者越是事情干的急越对沙县越有利。


    所以说，沙县小吃的密度可以反映出“这一区域内，不稳定劳动时间者和急迫者的密度”。


    2：成本控制得好主要得益于搭配和流程：这个东西适的生产适应性强，不容易受到限制——这意味着沙县小吃在不同的地方，其“指标意义”比较一样，不容易出岔子。


    比如说黄焖鸡米饭主要是酱料控制，这个时候物流系统和本地的分销系统'
  - '[PAGE 54]


    就会造成很大影响——黄焖鸡米饭的口味差距远远比沙县小吃要大，这就让“失败和成功”更具有偶然性，这里面的影响因素就不是我们轻易可以找到的了，不容易观测。


    上隆猪脚饭和黄焖鸡米饭也有同样的问题，它们都不如沙县小吃的流程的适应性强。


    国内的“超级小吃四天王”之所以能分庭抗礼，是因为中国的这些物流系统已经足够成熟——至少在大城市是这样。


    但是如果你到不太发达的县城里去看，你也很可能发现“沙县小吃”平均来看确实明显更有优势——同价位下也有优势（主要是经营优势）。


    3：本地化大宗物资要求较低——这个和第二条有关系，但是不完全一样。大宗物资要求较高或者原料较多并且“临时需要”多的话，它对于当地的物流系统考验就更大。


    可是在很多时候，并不是物流发展是大区域等速的，但是物流发展和一个地区的发展稳定性和潜力并不必然相关，重要的还是人。


    所以说如果一个产业如果“临时需求很多”，我们拿它来当风向标的话就会错过很多好地方。'
  - '[PAGE 55]


