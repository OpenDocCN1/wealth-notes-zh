    同感的极为重要的部分。


    ![](img/2fbf5bb58d4b1c92ed47382a34684a65_275_0.png)


    当然，我们现在看到一个原始部落的人类也会认为“他们是人类”，但是我们并不见得和他们是有基本的认同感的。


    很大程度上，我们认为“原始部落的人也是人类”是因为我们大多数工业者或者已经广泛使用工业品的社会内的人都有一种“生理上是人则为人”的倾向。


    这应该是由工业生产中的“大分工”需求所逐步推动的“个人原子化”所造成的——原子化，以后如果要通过一个“包括大分工内所有人的特点又能容纳更多新的具有生产力的特点经常发生变化的个体的简易且符合直觉的判断标准”是非常困难的。


    即使这个标准在投入一定的资源下可以得出，但这在社会大部分群体中的普及难度就会很大，普及收益不见得够，而且随着分工和活动的丰富度的逐渐提高，复杂规则在适应新条件下反而更麻烦且容易出现分歧——所以干嘛这么麻烦呢？直接


    **“生理上看起来就是人，人人平等”**


    挺方便的，对于社会中大部分原子化的个体来说也是足够执行自身社会机器所需要的大部分任务的。


    由于现在世界上的主要强国大体还是工业化国家，所以就以“地球上的人类社会”而言，还是“拳头大就是硬实力”，所以什么“人是和我们差不多的”定义权也就由这些工业化国家占据主导。从这一点来说，认为“什么人是谁”，在工业化时代的大部分人中，最大的影响要素还是由生产关系所驱动的。


    生产关系也和时代的技术和社会背景互相影响，最后由相对稳定下来的社会文化背景里的内容产生“什么人是谁”的直观认识。


    因此，如果“什么人是人”要发生改变，应该是新的生产关系为驱动力并最终改变了社会文化背景。


    而如果要产生一种大不相同的生产关系，也就是在自然发展迭代到几乎最优的情况下也会大不相同的生产关系（比如说农业社会的最优和工业社会最优是不同的），最大推动不同生产关系发生根本改变的，还是要由科学技术与行之有效的基础理性工具作为基础。


    那么，按照上述推测来看，要让“太阳系人类有认同感”的话就需要至少三点。


    - 1：有某个特殊的科学技术或理性工具作为基础。

    - 2：这个特殊的科学技术或者理性工具的发展已经突破了原有生产方式的界限。

    - 3：在突破原有生产方式的界限后的它已经对生产关系和社会背景文化产生了塑造作用。


    当这三点齐备了以后，“认同感”就会出现——除非是敌对状态搞宣传，否则就容易产生认同感（从某种意义上来说，这种感觉更类似于“旗鼓相当”）。


    在确定了这三点以后，其后世认同的时刻，也就是这三个条件有关的且关键的东西被正式承认以及大规模使用的时候——在人类更早的时代标准可能不同，因为当时人类的社会组织度不高，所以我们会根据组织度来对“承认”以及“大规模使用”的客观标准进行“符合那一时代的组织能力”的修改。


    一般来说，这种修改通常的标准是“那个时代下旧有最大组织承认和使用并且发生了全面转变的趋势”或“新体系直接击败或者间接渗透，致使旧组织形态的下滑的趋势不可逆转时”。


    从这两个“修改标准”中，我们就能得出“这是什么时候出现的？”这一问题的标准——至少是大致标准。


    在确认了“三点齐备”＋“时间修正”后，被其重要生产方式所改变生产关系，使之内核与未来接近的决定性时刻，就是承认“哦，我们是一样的。”的历史时刻。这三点越是基础和强力，其被认为是“时代不同”的划分的程度就越高，比如说工业革命的差异就比朝代变更差异更大，但是大约不比“人类发明火”要大。


    只要通过了这个“历史时刻”的人，就会被认为是“和以往不同的新的人类”，而且越是基础和强力，认同的规模和程度也不同——我们最基本的认为“人类”的标准就比“我感觉我们是一样的”要更加深度一些，就好像“会砸出石器，制造工具的人就是人类”与“他们也是要每天上班领工资，也有领导”的差异是一样的。


    而我认为的“下一次历史时刻”所代表的东西，至少是接近于“工业革命”的。这还不算很大，关键是它与“工业革命”叠加的时候，其深度和广度就会近乎于“人类发明了火”。


    因此，在至少是“人类”这个分类上，下一次历史时刻以后的人类被叫做“太阳系人类”也仅仅是基于现有我们知道物理法则限制下的一种推测。


    在更远的未来中，即便人类突破了光速限制，那么“我们的下一次历史时刻”也许不能支持起“我们是一样的上班族”，但是它至少能支持起类似于我们当今的“我们是一样的动物”或者“它是我们直接祖辈（不是祖先）”的概念。


    我们其实经常谈起一个关于“历史时刻”的事情，这也很有可能是因为 我们确实是属于这个历史的交界处，但是这个时刻还没到来。这个历史时刻大家早就听的耳朵都长了茧子，就是“信息革命”。


    ![](img/2fbf5bb58d4b1c92ed47382a34684a65_277_0.png)


    这里，我也试图说一下“信息革命”对于未来人类的重要意义，以及“具体 会怎么改变”，以及“这种改变的过程中会带来什么好的坏的幸福的恐怖的 现象”。


    在大多数时候中，“信息革命”通常被理解成某种“普通工具”，这种工具虽然非常强大，非常划时代，但是最重要的特点依然还是“增加生产力”，即便是针对“需求发现”，更多的也是“工业需求发现”等。


    正是因为如此，所以我们把“信息化”要么理解成“超快超高效率的电话机”，要么理解成“超高速的生产协调服务器”——更奇怪的是，作为信息化一部分的“大数据”出现后，又有人要么想着是疯狂促使人消费的“美丽新世界”，要么稍微一个社会旧体制制度的变化就可以把“美丽新世界”变成“1984”，然而如果是一场“生产关系与生产关系组织控制革命”，那么一个旧体系的一点儿欲望和控制，又怎么能改变那么多呢，逆潮流而动是注定失败的，仅是失败方式不同罢了。


    那么，要说明革命为何是革命，就必须想一下革命前和革命后有何变化，这就意味着我们必须了解“革命前的世界”。


    这种了解最重要的部分会根据史诗革命事件的重大程度而改变，但是它们都必然是人类这一物种的根本特性所衍生的。


    人类这一物种，我这里分为三大“需求”。

    - 1：个人生存与发展的需求——获得吃喝用以及繁殖。

    - 2：个人在社会中定位的需求——加固吃喝用以及繁殖的保供稳定性。

    - 3：社会对于个人在生存与发展中对个体之间的稳定作用——个体之间如何衡量吃喝用以及繁殖交易的各种通用标准以及标准的扩散。


    这三种需求，是作为一个**社会性动物必然拥有的（非真社会性动物），** 即便主体不是人。


    人类与其它社会动物最大不同的地方，就在于人类有智慧，智慧是一种比本能更加具有通用性的适应工具——但它对于能源消耗以及稳定环境的要求更高，人类不可能在草地上随便啃啃就能活下去。


    ### 人类的革命，往往是由工具推动的，即便是文化上的革命，本质也是因为工具改变了生产模式和生产关系。


    例如说，工业革命解决的是什么问题？也就是对哪种“需求”发动了革命？主要还是个人生存与发展的需求，然后个人生存和发展的需求被大幅度满足后就带动了定位需求和社会稳定方式的革新。


    工业革命为何能够是人类历史上最伟大的革命呢？究其本质是工业革命的成果为“**机器造机器**”。


    机器造机器对于人类智慧是有“**终极意义与决定性指标**”的——人类终于在创造生存与发展需求的物件上，用自己的智慧产生的工具占据了主要生产地位，**突破了原有的生物局限性。**
    真正的让人类智慧大于了人类本能简单工具下的满足能力，人类的这一产能不再完全依赖于人口的增长，在产能上出现加速度。


    从这一点来看，工业革命的成果，就是人类用了与其它动物截然不同（至少程度天差地别）的本能工具，也就是“**智慧**”完成了满足自身各种需要的工具，而且这个工具还可以自己加速生产自己——从某种意义上来说，对于农业社会里的个体人来看，这就相当于“农业社会里有户人家可以自动生孩子养孩子”。


    当然，我们都清楚“自动生孩子和养孩子”的难度可比我们现在的工业化成果要大得多了，这可不是一般的难度啊！


    但对于旧世界的人来来说，他们能想到的能接近这个目标的方式，大多数人还是只能理解为“**自动生孩子和养孩子**”，**这就是历史局限性。**


    这个局限性也会在当前发生，比如说当前绝大多数人会想“如果计算机技术真的能彻底改变人类社会，那么一定是比人类还要强的人工智能出现了”——和上面的“自动生孩子”是一个道理。


    （未完待续）


    ## 从野兽到人类——我们即将成为太阳系人类的初代（二）


    ![](img/2fbf5bb58d4b1c92ed47382a34684a65_279_0.png)


    农业社会转向工业化社会，不用“自动生孩子”那么复杂就能达到，信息化社会的全面变革也不需要。


    工业化社会，就完成了第一条“个人生存与发展的需求，也就是获得吃喝与繁殖（需要争取）”。


    由于在这一点上发展是最快的，那么为了让其发挥最大作用，因此社会自然会越来越追求个人化和个人自由（**主要是生产与交易的自由**）——无论这种个人化和个人自由是以什么手段达成的。


    如果我们仔细思考一下就不难想到：最终一个革命成果，哪怕是技术成果，它本身一定会最终改变整个社会的组织形态。


    这种改变会一直继续下去，直到这一革命成果的核心部分出现了某个东西。如果这个东西能够发展到“工具/管理”的极限，那么它就会成为一种人类社会中的*新生力量*，这种新生力量与之前所有用于社会内部平衡的组织或者技术有非常不同的区别。


    那么，我们只需要看一下“社会管理中基本力量的构成与基本动态平衡方式”，就至少可以分辨出“**什么是旧力量达到顶峰的标志**”。


    ### 一：采集狩猎社会


    采集狩猎社会的群体平衡主要有以下三个：


    - 1. 强**力**个人或**小**团体。

    - 2. 仲裁者本身。

    - 3. 弱势个体的需求。


    它们的背景：狩猎和采集过程中，强力个人或者小团体经常外出的收益更大/仲裁者停留在聚落里面统一弱势个体的收益更大/强力个人或者小团体的力量依附于本人的身体，但是他们想要获取的价值来源于其它东西或者人（比如说女人或者孩子，他们本身可能也是弱者）。


    在这个三方平衡中，强力个人或者团体需要仲裁者，没有了仲裁者，弱势个体就很容易在他们外出的时候做点什么。


    仲裁者需要弱势个体，因为没有他们，他们就不得不从强力个人或者小团体上获取额外资源（其它人剩余资源太少）。


    弱势者同时需要仲裁者和强力者，因为如果没有仲裁者，那么强力者就无法信任绝大部分弱势者没有干什么坏事；如果没有强力者，那么弱势者本身就很可能无法填饱肚子或者对敌对同类具有优势或至少进行报复性打击。


    那么，这其中“仲裁者”能够仲裁的核心是什么呢？


    答案只有一个：时间差。


    如果不是因为强力者在狩猎或采集过程中有更高的收益，那就不会有狩猎和采集的时间差的存在。


    正是因为时间差的存在，弱者可以对强者拥有的缺乏保护的东西发起攻击的能力，所以就需要有“公信力”。


    而最有公信力的人，应该是最没有独立生存能力的人，这样才能够让其它双方都认可其并不能成为一个独立势力，不能成为“力量实体”。


    正是因为如此，就算是一个稍大的狩猎采集社会，也一定会有一些老人存在，而且是“备受尊敬”的。


    那么，在这一思路下，我们不难理解一个狩猎采集社会能发展出的“最高稳定形态中最可能有的稳定产品”。


    这个产品自然是为全体社会的“最高效仲裁”所服务的。


    通常情况下，这个东西到达“需要长时间加工的饰品”以及“更舒适的特殊居所结构”的程度就足够了。


    简单点来说，就是“这个不从事生产活动的仲裁者能够恒常的表现出自己被公认的仲裁公平性”——饰品和居所的寿命可比老人的剩余寿命长太太多了。


    对于一次革命来说，自然是対上一个社会的根本管理要素进行颠覆——对于狩猎采集社会就是“出门时间差”。


    ![](img/2fbf5bb58d4b1c92ed47382a34684a65_281_0.png)


    大家不难想到，农业革命就是基本上消灭了这一时间差——尽管农业人群还是要出门，但是出门距离不用那么远，而且时间不用那么的固定。


    此时，个体对个体“趁虚而入”式侵害风险就也大幅度提高了，更何况人类还是一个会用武器的物种，武器大大的拉平人与人之间短时间内的体能差距对于暴力活动胜负的影响（在缺乏有效医药的年代尤其如此）。


    ### 农业革命


    的意义自然不完全在于“我会种地，我有稳定产能”，如果说仅仅是种地和稳定产能，那么在农业生产间歇期间还是需要别的食物，还是有很大的稳定的时间差——如果农业生产时间长了导致狩猎技术下降了，那么还很容易有其它不可测的风险。


    同时，如果农活的周期一旦被彻底掌握，那么固定时间差的风险还是马上就提高了，不能起到长期效果。所以，要想让农业革命能够继续下去，让其真正的改变狩猎采集社会结构，需要的并不仅仅是土地产出能相比自然采集有多高的产能。


    真正重要的是：这种农作物要有“存储能力”。


    因为，只有农作物有了存储能力，那才能够让一个农业生产者个体的个人“在家”时间变长而且具有不可确定性，才能满足上述所有变革的条件——同时，也意味着“弱者”也可以积累一部分产能供养仲裁者，仲裁者收益加大，原本的弱势者一定程度上拉平了差距；同时，仲裁者也有了稳定的供养（还是可以储存的）生存物资来源，对于强者的依赖性也可以降低；同时，强者可以找到更多的任务，无论是开辟土地，入侵其它部落还是从事更消耗体力的“技术性”工作（缺乏专业高硬度工具的情况下打磨是很累人的，那会儿可没有什么电动打磨机。现代狩猎采集部落里面做饰品的人都膀大腰圆的，绝不是什么博物馆复原场景里面心灵手巧的女性）。


    ### 事实上，发明了“种植”的狩猎采集部落并不少，但是那些偶尔可以种植产量很高的作物的部落并不一定能形成具有农业社会的组织结构。


    酪梨的产量比绝大多数古代种子作物的产量大得多，可是种植酪梨的热带文明却只能做到部分农业社会的物质成就，却不能够形成和其它农业社会一样的紧密的大社会结构，很容易遇到点问题就鸟兽散了——如果仅仅是因为“抗灾”能力，那么能种酪梨的地方都是一年四季都能产出果实的，根本不用太多担心季节的影响。


    能产生紧密农业社会的，基本都是发现了“容易干燥保存的种子作物”的社会——那些做不到的“种植”文明，其首脑与其说是“封建领袖”，不如说是“大众娱乐产品供应商”，成天想着怎么让大家开心点。


    这种变化发生的过程中，我想是必然会产生原有强力集团与仲裁者的强烈冲突的，仲裁者必须自我发展，统一好弱者联合对抗，否则就会在革命的道路上天折。


    当然，在狩猎采集社会中还不可能有专业的历史信息记录人员，所以当时是否发生了激烈的冲突是不得而知的——之后是有的，尽管也不完整。


    ### 二：农业社会。


    农业社会变革成功后，并不表示天下太平了，因为随着组织规模的扩大的同时旧有的“时间差管理核心”已经基本失能，所以必须探寻新的管理方式。


    这种新的管理方式至少要能够解决“在能存储物资的情况下，如何能够在各个群体手里保护好物资”，能把这套保全体系统定下来的仲裁者才能从狩猎采集社会的仲裁者变成农业社会的“统治者”。很显然，这就需要一种更加“动态平衡”的管理体系，要靠人的变动代替“时间差”。以我们中国人熟悉的方式，以及在其它不同的文明中以名字不同但原则近似的方式做到的，就是“文官”“武官”“人民”体系。


    ![](img/2fbf5bb58d4b1c92ed47382a34684a65_282_0.png)


    规模越大，文官和武官的差异也就越大，反之也就越小——因为组织规模越大就越不可能是一个个独立的聚落，孤立的抗风险能力和协助能力会更弱，欧洲的骑士城堡只是一个很短期的现象（说白了也就和我们原来偏远山区的“地主土围子”没啥区别）。


    文官掌握的是“社会资源的统计与计算和相应的管理的记录与分析成果”，而武官掌握的是“维系社会资源统计与计算和相应的管理能够在内部推行甚至对外推行的实力”。


    很显然，他们两者虽然在实际组织扩张的功能上都不可或缺，但是它们的利益又是互相矛盾的，双方都是互不信任的。


    仲裁者的任务就是让他们一定程度上互信——注意，狩猎采集社会下必然有的“时间差”已经不复存在，而是以“储备能力”为基础。


    储备能力当然不可能是无限的，也是需要生产的。


    所以可以让某个势力更多的和生产有关，另一个势力更多的和**已有储备**有关。


    中国在大多数历史时期中更多选择的是让武官更多的与生产有关，文官更多的与储备有关。


    需要注意的是：这不是唯一的选择，也可以让武官更多的与储备有关，文官更多的与生产有关。


    **重要的仅仅是仲裁者如何利用社会实际最终生产者的那一大群人的力量和“管理模式宣传”的权力，来影响武官和文官的分配，于是就能够维持一种动态平衡。**


    当然，其中也有**固有矛盾**：由于文官和武官的最根本的矛盾无法解除，双方都不得不尽可能地扩大自己的实力。


    而在这样的技术条件下，实力的根本还是“人类本身”，即便有装备上的差异，其能力差异相对而言依旧是很小的——这种现象绝对不仅仅出现在“一线人员”身上，实际上整个管理链条中的每个人都是一样的，甚至是更加趋向于一样的（就好像欧神说的穷人其实比富人更容易有更快的加速度是一样的，农业社会更单纯，这种趋近速度还会更快且更加个体能力）。


    这个固有矛盾是不可能通过仲裁者进行动态平衡来进行彻底的遏制的，因为这要求其信息搜集和处理能力永远高于文官和武官集团的总和。这显然是不可能的，因为仲裁者也是人——而且所有人都是明白这一点的，中间没有任何“额外的加速度”存在。


    那么，在采取“**武控生产，文控储备**”的社会下，最终就一定会出现“武成为流寇，文腾空国库”的情况——如果再发生一次剧烈的灾害，那么武则不能被仲裁者控制，文则不可能应对灾情，于是就会发生总崩溃。


    如果情况反过来，变成“**武控储备，文控生产**”（欧洲大多数都是如此），那么武力就会挟持库存不断找事，文则会趁着国库空虚漫天要价扩大规模，最终导致文武矛盾不可调和，结果国库烧空了，生产根本没接上——所以说欧洲的“翻天覆地”相对于中国就更是因为偶发的自然灾害，通常是自己挑起的战祸。


    在这样的社会中，它们想达到而且能达到的，最终目的一定是指向“生产安全与储备安全的结合”。


    如果是武控生产文控储备，那么则是武对于生产极度关注，有大范围防御设施；文对于储备极度关注，有极好的过往记录系统。


    如果是武控储备文控生产，那么则是武对于储备极度关注，有小范围防御设施；文对于生产极度关注，有强烈的生产试验倾向。


    **在农业社会下，这些东西发展到各自文明的极致，也会是后世认为很难做到的，毕竟相对于后世的个体来说依然是一项极为困难的工程。**


    ### 我们管这样的工程一般叫做“奇观”。


    上一次狩猎采集社会的最根本改变原因是“基本生存物资可存储”的特性，存储和记录相关性更大——需求叠加，但是颠覆性需求往往不是在上一次的需求上“锦上添花”，而是“雪中送炭”。


    因此农业社会的下一次的革命，更可能来源于“强烈的生产试验倾向”的从属性内容在特定技术发展后的反客为主，而非“过往记录系统”的同等相关联事件。


