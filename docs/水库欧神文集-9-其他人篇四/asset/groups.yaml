  - '[PAGE 114]


    “好日子”是为了“在长期更好的活下去”，但是如果短期都有危险，那么一味地考虑长期没什么意义。


    就算一个发展更不好的组织，如果它的军事瞬间动员能力比你强，<u>那么在你能够把经济实力转化为对抗能力以前，你已经没有了</u>。


    当然了，不是所有国家的福利提高都是直接对接有计划的军事目的的。


    新加坡这样的可以，是因为新加坡的管理高度的一体化，高度的统一和集中，<u>所以他们才能用最划算的方式，兼顾经济发展和军事安全</u>。


    但是对于一些国家，他们内部就没这么统一，比如说欧洲国家。


    那么他们为什么也选高福利模式呢？哪怕是在军事压力不大的时候。


    这一方面是因为政体内部有问题，大家都不敢降福利。


    但是不敢降福利还有另一个原因——不患寡而患不均。


    如果真有人降了福利，其实那些不得不提高福利的人也未必开心，只有那些效率高的才开心——如果一个社会整体发展速度降低了，那么低效率的人更多，不开心的人也更多。


    但是如果提高福利呢？那么至少大家是平均的，而且高福利至少最终能服务于大家走向<u>“最终解决方案”</u>。


    就算是最后战败了其实问题也不大。


    因为三点。'
  - '[PAGE 115]


    1：只要你福利安排的是平均提高的，那么大家优先死的都是各自管理区域内的低价值人口。各个系统损失都是最小哒，没啥好不乐意的。


