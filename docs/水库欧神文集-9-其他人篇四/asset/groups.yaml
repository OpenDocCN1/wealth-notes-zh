    ## 从遗产税到演化论，从演化论到文明兴衰


    遗产税与演化？这两件事八竿子打不到关系？能，尤其是人类社会。


    （提醒，文章不短，而且要一直抓着“演化的最基本要素的传播”也就是“基因视角看人类”才能顺畅的理解，不要被次级的道德观念和经验束缚，因为这篇文章一大部分就是“道德”为何延续和存在，是高于道德的更基础的东西，所以不能用道德好恶来判断它）


    首先先明确一个概念：种群的延续，不是个体的永生或者具体的某个指标，而是“基因”继续复制，承载基因的生物体也能在外部环境的变化下活下来——由于世界无限复杂，对演化的故意定向是费力甚至不太必要的，对于无限复杂，使用随机试错，适者生存即可。


    生存，它是一个在无限复杂的环境下，偶然组合而成的一个系统，系统的存在是既定事实，所有的理智，工具，手段和生物特点，都是因为“正确的偶然”才能在“生存这一既成事实之中的”——这是非常反日常逻辑的，各位往后的时候要特别注意。


    如果上面那个太长，那记住一句话就可以了：人，只是一个受精卵到下一个受精卵之间的载体而已。


    之后会把这个演化概念用于文化层面上，原则一样。不牢记这个原则，文章就会非常绕，牢记这个原则，文章就特别简单。


    试想一个问题：如果从 0 开始起步，那么除了打工以外的时间该干什么。


    最好的选择，当然是做“风险收益比”最划算的事情。可是，这些事情往往会是风险很大收益也非常大，需要的时间周期也不短。


    但是，很多人不这么做，或者说几乎所有人都不会这么做。害怕？是的。可是为何害怕？


    本质还是一个原因：个体生命有限（问题是：我们为什么会注意个体生命有限这件事？）。


    做风险很大的事情，无论收益多大，如果个体生命受到威胁或者时间周期超过个体生命限制，那我们会非常难受。


    人类只有在非常特殊的情况下才会主动抛弃自己的个体生命，通常我们会称呼它为：牺牲（极少数人是自杀，那更可能是演化不完全的结果，可能是因为影响太小，所以不会优先演化掉而已）。


    如果做风险较小但是收益也较小的事情，那么个体生命的有限程度就会妨碍这一个体累积足够的“等级突破”资源，而且等级高的人也更容易保持位置（这也不是坏事）。


    虽然有同等收益缩小风险的办法，但是这些办法是需要很长的学习过程的（大多数人学习的所有东西就是为了达成这一点）。


    此时，个体生命的有限又会造成限制——如果学习方向错误，那就直接浪费了生命，至少机会成本是很高的。


    所以，人类个体必须在有限的生命中不断的权衡时间，风险与收益，去尽量有效率的完成三件事。


    - 1: 生存。

    - 2: 繁殖。

    - 3: 确保繁殖成果。


    生存自不必说，繁殖也是——这两个当然也极度复杂，但不是本文重点，不赘述。


    确保繁殖成果——必须要让自己的基因载体继续存活下去并且尽可能在他的个体竞争中占据优势。


    很显然，在人类社会中，物质积累是很重要的。


    为何重要？


    归根结底，就是人类的经验和各种记忆是无法生理遗传的，而任何通过教育等方式进行复制的行为都有极大的偏差，效果是极为不稳定的（可以理解成：遗传时突变太多了）。


    所以，为了“保底”，就必须把经验和其他成果转化为能更可靠进行传递的东西。


    这是很合理的: 如果我们遗传记忆和经验，我们一直使用更接近“最佳风险收益比”的选项才是最合理的——我们担心“死亡”，演化出“有限生命内不断权衡获取最大变现成果”的一系列心理特征和文化特征，肯定是因为我们在传递过程中会额外损失掉什么优势。


    “物质财富”就是其中的一种“遗传优势变现”。


    从某种程度上来说“物质财富”的遗传在人类社会中，是和后代的繁殖效率直接挂钩的，而且有时可以横跨很多代人。


    相当于“是孩子中的孩子”“基因中的基因”“优势中的优势”。


    正是因为这样子繁殖加成效果，所以上面的“现实中的人往往不能只会用风险收益比考虑问题”就非常合理了。


    不仅从“个人生活享受”这一层面上合理（否则早就被淘汰了），而是从“基因”层面来说都没有任何问题——或者说“需要个人生活享受”也是促进人从感性上以恰好完成这一点（不需要完成复杂计算，否则风险太大，直接预制到本能系统里去）。


    完成的这一点，就是“有限的人生是一个项目周期，超过项目周期的方案将被舍弃，最终的目的是在项目周期结束以前就要变现一部分经验价值，将其变成遗传效率更稳定的物质资源来进行遗传，这样后代的繁殖效率会更高。”


    可以这么说：人类和大多数动物最不一样的地方，就是遗传更加不依赖于细胞核内的基因，不完全依赖生物性状的竞争，物质也能提高“基因的再次复制效率”（其他动物当然不都是如此，广义的来说，哺乳和蛋黄也和人类的物质财富类似，只是时间更短）。


    尽管在极长的周期来看，生物性状可能依然是主要的——但是在一个时期中如果能突然快速升高几代人的繁殖能力，那么这个基因就会在整个种群中打下“长久的烙印”（因为突变优势太大了，后代就慢慢变成只有普通竞争力的人也可以把种群内的基因占比给维持住）。


    这就好比成吉思汗的基因至今也能在亚洲被广泛检测到一样。


    这些基因并不是毫无意义的，因为性状确实能一定程度上影响人的行为——也就是说，它几乎可以肯定以相对个体而言更强的作用更多的改变了历史，只是这个扰动太难以区分，所以我们还无法下达一个有意义的结论而已。


    > 简单来说：“物质财富”也是人类遗传的一部分（其实叫亲代投资更合适，但作用方式和动物圈的单纯针对子女生存的亲代投资有区别），它对种群内得基因分布有举足轻重的作用。


    而且由于“物质基因”在数代内一般可以较为稳定的遗传，而且“显性”时间可以跨代际，这相比一般动物只能透过一代的显性优势更有效率，因为复制基因的不再是只有“原始优势体”一个的繁殖能力，而是增殖多此后的数代人——相当于后辈几代人就算完全吃“蛋黄”也能生存，一心一意谋繁殖，男性在这儿更多选择的是生殖繁殖，而女性更多的是文化传递，“相夫教子”的过程中传递了“文化基因”。


    > 这就导致无法传递物质财富的人，在个体的“本回合”较量中将会处于更加巨大的绝对不利地位。


    那么？遗产税又是怎么回事呢？

    如果用上面的例子解释，那“遗产税”可以等同于“遗传税”。


    > 不过，如果直接默认“遗产税”＝“降低富人遗传率”的想法是图样图森破的，就和所谓的“阶梯税率”能够惩罚富人一样的拿衣服。


    遗产税的征收，自然有着各色各样的说辞和原因——但是，任何人都不会选择对自己不利的规则，所以我们只要研究一下“遗产税”支持者的实际效果即可。


    我们都知道，在很多西方国家遗产税是很高的。


    但我们也都知道，在那些国家，大富豪规避遗产税的方法是很多的，基本上算是一毛钱都不用出。


    真正无法避开的，是那些高等中产阶级和新晋小富人，这些人都无法加入“避开遗产税”的大门——所以他们的繁殖优势，只能局限在一代人身上，后代则只能通过“突变率”极高的教育系统来试图维持一下繁殖优势（然而，高突变基础要想降低突变率，在原有工具基础上降低，这些手段的边际效益都会快速降低——所以中产阶级就算把所有钱都烧在教育上，它也是入不敷出的。而这也就意味着，中产阶级的“权力”增高在跨代的时候就受到了一个很大的减值，甚至重新归零了。这意味着着社会管理机关收回了某种“权力”，再次发给其他人，但是社会等级却是实际法理固化的，是封建的）。


    那么这会形成怎样的一种格局呢？


    > 很简单：政策的制定者集团人工制造了一个“演化堰限”——跨越这个限制的成本极高，以至于几乎无人能跨越。


    演化渠限在这儿需要通俗的解释一下。


    简单的来说：一个演化到一定程度，如果复杂化了就必定有更复杂的分形，然后强化其中某些主要结构。但是主要结构加强了以后，你还想改变就很困难了。


    比如说陆地盘脊椎动物都演化出了四肢和尾巴，这是他们的主要运动和平衡器官。


    这几个器官都和其他器官有着深刻的联系，如果要想重新长出另外一对手脚，那就要其它器官一起滑翔了。


    但是器官的改变是很复杂而综合的，可是演化都是渐进的（否则风险太大），所以说四肢和尾巴必将带着躯干一起，它们之间的组合很难发生根本性的变化。


    这个时候如果还想继续竞争，比起多长出一堆手脚这样高危的举动，更好的方法是加强已有设备的细节功能。


    比如说把前肢进化的更灵活，把后肢进化的更强劲；把尾巴变得更粗更长或更细更短。


    甚至可以把一部分胸腹部外皮肤扩展并连接到手脚之间，形成一张薄皮，这样就可以在树林之间滑翔了。


    这个放在遗产税上是什么意思呢？


    就是制定遗产税的利益群体，获得了指定其他人在社会领域“必须长手脚”的干预权——低于这个渠限门槛的人，将只能在“手指头”“脚趾头”上进行更细微的改动。


    比如说“怎么好好打工，只做一个狭窄的事儿，怎么更效率的复制别人告诉你的操作技术而非思考”。


    而这些细节，都是服务于“固化手脚集团”的，服务于一切在演化渠限以上的组织的。


    说到这儿，各位肯定已经理解了——遗产税实际上是一种极为阴险的“封建社会等级划分”方式。


    掌握了“渠限设定权”的人实际上变成了“世袭贵族”，只是比封建贵族更加隐蔽但也更加高效罢了——不仅保证了自己的繁殖特权地位，而且还能“激励手指头更好的做手指头”，而“更好的手指头就更能维持手的特权地位”。


    但是注意了：我并没有说“渠限必然有害的”。


    生物产生渠限确实有一定时候是有害的，但是有的时候又是有利的——尤其是在环境波动并不算很大，并且是试图往生物链顶端移动的物种。


    道理很简单：环境如果不发生巨大波动，渠限的影响是很小的。只要陆地没有被海水淹了，手脚在陆地上胸腹很管用。


    如果陆地上有各种食物而且树林茂密，但是食物的采摘或捕获的方法各不相同，那么灵活的手就很有用。


    这个时候，如果一个物种产生了更细的渠限，那么在同样的自然选择压力下，物种内将更容易产生演化更加完全的器官——因为不能大改，所以强化。


    一个强化后的器官，很有可能会产生极大的收益，远远比演化它的成本大得多——超过某个临界值了。


    此时这一物种将会完成巨大的跃升。


    比如说有颌鱼类的跃升就是如此——鱼类一开始没有下巴，有了下巴以后吃东西变快了点。


    吃东西变快了是好一点，不容易被人抢吃的，但是也不过如此。


    大家都想吃的快一点，所以就强化了下巴的肌肉——每次强化，吃东西都稍微快了点，在内部繁殖中占据了小小的优势。


    直到有一天：卧槽？兄弟们，不得了，我发现了为吃东西快一点而长出来的下巴肌肉，已经能让我们咬穿角石的外壳了！而且我们的游泳速度也恰好在以前抢夺残羹剩饭的时候练好啦！


    角石：远古时期一种巨大的，长得像会游泳的尖海螺的东西，是鸟贼的远亲。当时是近海霸主，大的能长到三米甚至更长，曾经是海洋里位居食物链顶端的物种。


    大家应该明白发生了什么——能杀角石的有颌鱼类从之前仅限于当今四川的海域，全面杀向全球的海洋，角石从食物链顶端的掠食者瞬间变成了超大号海鲜自助餐（连同一大堆巨大的软体和节肢动物一道）。


    生物的演化是几乎完全随机的（偶然演化的渠限，能够让这种随机在更小的范围内展开，强化某一特定器官，有机会超越临界），但是社会的演化并不是完全随机的，有人可以直接有意识地加以干涉。


    但是这也只能是有意识地干涉，管理者自己也不知道具体会出现什么，所以需要有一个“舞台”来让各个不同的个体进行演化，在这个渠限中演化出更高效的东西来。


    这个“有颌鱼类”的故事，特别像“工业化”的故事。


    这个有颌鱼类为了快点吃残渣而发展下颌肌肉的过程，就是“产业化”的初期。


    而工业化国家突然猛吃包括中国在内的农业化国家，就是“产业工人和产业体系发展大型化以后，全国工业系统突破了临界点，发生全国组网，规模经济效应暴增，交易成本暴跌，并且形成了可以被主权国家系统可以控制的关键节点，于是转化为了国家级的统一对外军事输出的力量。”——工业化初期，就是一些产业结构方式产生了渠限制，所以后来工业科技树就只能一路点上去（已经从重工业生意的人无法退回到农村了，因为农田里到处都是人）


    这就有颌鱼类突然发现自己“我的下巴有一天居然可以咬穿角石”是一样的——英国当局也是在事后才发现工业的威力的（发现税收暴增）。


    因此“渠限”本身就和它所有有意义的演化一样，它本身并没有“好坏”一说，它只是一种特性和现象而已。


    一种特性和现象，要放到特定的环境和时间段里，你才能得出它的“好坏”。


    所以，我们就要客观的分析一下“遗产税”到底是要干什么？有什么用？它想做什么？它会带来哪种结果？


    而这一系列问题，也要区分“环境”和“时间”——它们两个加在一起就是一个东西，“变化幅度”。


    - 渠限加在一起就是“适应宽度”。

    - 渠限基础上演化出来的细节性状，就是“演化深度”。

    - 如果细看上文的话，各位就明白：这三者常常会互相影响。

    - 更大的适应宽度可以应对更大的变化幅度；更大的演化深度通常可以获得种群内的优势，甚至让种群居于更高和更广的生态位（上下通吃）。


    同时，更大的适应宽度经常以演化深度作为代价——因为宽度更大的物种，更容易“变来变去的凑合着适应”，而且在专项器官的深度演化上基础就比较落后。


    这就好像棘皮动物（比如海参和海星之类的一大堆奇怪动物）那样，虽然几乎算得上是有史以来一直活着的家伙，但是几乎所有种群都占不上高位——现在活的最好的，是分化相对更明确的海星。


    原因很简单：富的时候吃多一点，但也吃不了太多；穷的时候回家吃土也可以。


    问题是：稍微有点风吹草动，棘皮动物立马回家吃土。


    棘皮动物从细胞到结构层面上分化都比较低，巢限自然很少，适应宽度很大，但是因此也就更容易选择“眼前的苟且”——晚上想想千条路，早上起来走老路。


    当然了，如果深度很大，但是限制也很多，那么在环境变化达到了巢限的极限程度，那么整个物种就很可能灭绝。


    我举个简单的“巢限”的例子。


    欧神很会投资对吧？那么他的巢限核心是什么呢？


    当然是“个体与超大型经济利益组织的关系”，核心本体是“个体与超大型社会组织的生产整合链条”的关系。


    那么，在很多时候，反过来说欧神针对性适应的环境核心要素就是“超大型社会组织生产整合链条的存在”。


    要想让欧神的巢限对其生存和复制产生决定性影响，那必然是“超大型社会组织生产整合链条”发生了变化。


    比如说蘑菇云升起来了。


    欧神：卧槽，药丸。在这凄美的一幕下，我只能在这即将贫瘠的山顶上吟诗一首，纪念逝去的现代文明……


    一位身着民工迷彩服，端着 95 步枪的电锯狂魔从山下经过。


    他就很奇怪：耶？都这个时候了，为什么有个人还在山顶念诗啊？不管了，枪枪，今晚有肉吃喽！


    蘑菇云升起前吃电烤炉做出来的烧烤，蘑菇云起来后吃篝火烤欧神，只要椒盐下的对，味道都喷香。


    欧神快速打出 GG，变成腊肉。


    当然，如果在蘑菇云升起来以前，欧神进化深度匹配的环境就是这样一种情况。


    电锯：我跟你讲啊，我会开枪，我会基础爆破，我有末日地堡，像我这样的人我有好几个！


    欧神：哦，我一个电话叫来十几辆坦克。

