    \ 985 文凭，所以我理应在 500 强企业有大发展，最后做到 CEO”。\n\n所以，你要判断你是不是“爱”对方，从关系很早就判断，而且还能判断其是否会延续很久的（至少感情可以延续很久的），就是要依靠分析对方的“结构”是否存在以及合适。\n\
