  md: '

    它具体问题直接走章程商量，大家虽然不一定知道商量的内容，但至少都知道互相同有商量。掩盖商量内容不是大忌，商量这件事都被掩盖了就令人不齿——可以有秘密，不能有密谋。


    ### BSC 的寺庙


    营销公司开大会，乌泱乌泱的人越多越好。小领导上来一大通叽里呱啦，指责谁谁谁事情没搞好。


    讲完了以后再谈什么公司愿景，伟大计划，完事儿了一起高唱司歌司训。


    最后拉出上个月的业绩冠军跟大家讲话，打鸡血。


    下面的人一起要喊“我要当冠军我要当冠军”，哇啦哇啦。


    谁要是嘀咕几下，就要被领导人抽出来一顿批。


    如果传教困难了，说开心话的受到表扬：说丧气话的被一通批评；不知可否的告知他“不买我们的东西是他的损失”。


    （看，神授君权。是个啥玩意我不知道，但是我骂你就是骂你，哪怕把你给开了都是对你的“教育”。老板是天，老板是地，老板是所有小领导的空气——不是管天地管空气，是他就是天就是地就是空气，没他你们就没天没地没空气，领导说有光，世界就有了光。）


    ### KPI 的寺庙


    今年政策不错，市场蛮好的，这得多谢谢我们老大，咱给他送点东西去，希望明年也能多关照和栽培咱。


    哎呀，今个儿考核不怎么样啊，但是事情好像没什么做错的，我去找老师傅问一下吧，说不准老师傅手气能给我一点呢？


    （看，君神平权。虽然说考核是一定要过的，不过考核是没有借口的。领导是管天管地管空气的，但是你可以私下里发表意见，提出要求，不要当面怼。领导什么世面没见过？私下里说就是了，不是原则问题都好商量——确实管天管地管空气，但是你只要做得好了，做的有道理，天地可鉴。只有你说了你做了天地可鉴的事情，领导和全体才能管天管地管空气，忠言逆耳是大义，风骨永存才正义，死谏的内容不一定正确，但精神值得肯定。）


    所以说到这儿也就能理解为什么“大善人”不会太多的去帮那些本来很好帮的穷人——那是因为他们业务没做好，但是技能还是在的，你不能趁着人家业务没做好的时候就收来当小弟，你得走公司流程，不能违背企业文化。


    这也就解释了为什么没深入了解过的中国人对于那些地方的“百姓生活程度”往往有错误认识。


    因为我们是 KPI 模式的，如果领导过得很好，至少业务做得不错。


    如果业务做的不错，那么大家也有竞争的，如果工资发太多大家会不满意——而大家有基本都是职工而不是“管培生”。


    但是 KPI 模式意味着“身份等级”很重要。


    领导如果出去是一个金杯面包车，那是不行的——其他人也不敢用好车了，虽然也买得起。


    这样一来，不同等级之间就在一个很重要的地方失去了合理的享受，那么同样的金钱下激励效果就很差了。


    因此在 KPI 系统里，老板的个人生活可以不是很奢华，但是绝不能简朴过头——特别是“示人”的地方是一定要有排场的，如果领导没有排场，下级也不敢搞排场，那赚来钱不能享受又有何用呢？


    当然了，也不是没有办法避免，比如说宣扬“老板没有把所有钱都用来奢侈，是因为他想要做好人好事，所以捐款捐出去了一部分”。


    这很多时候也是必要的，尤其是钱很多又是传统产业的时候——如果老板自己排场拉的太高，那么每个晋升等级的生活标准也不好安排了，会出现太大的断层。传统产业又不是那种晋升可以有很大机会性的，这样会让大家都很不舒服。


    官大一级压死人也就算了，还过的好那么多，心里不平衡，而且玩弄诡计会更多（这对于 KPI 系统的稳定和信息搜集都是不利的）。


    从这一点来看，也可以说中国的“企业家社会责任感”是有双重土壤的——制度进程时需要，一部分企业在发展中自己也需要。


    （对于那些传统行业的捐款企业，我们就会在“慈善家”的头上给企业本身增加一个附带属性——“惠民企业”。）


    因为这些人和钱捐出去如果和西方一样“绕回来”，那会让猜忌变得很大，所以不如干脆把这些钱真的捐出去算球，还能换来一些关系。


    所以说中国在发展那么点时间以后就开始说“企业家的社会责任感”是很正常的的事情，虽然不是什么好事（只是因为没有系统局限）。


    回过头来，我们就能理解为为什么国内大多数人对于 OKR 国家的生活估计往往是错误的。


    因为 OKR 系统一个国家内是不同的项目组，是不同的工作室，工作室是不能随便的挪用管培生的。


    所以贫富差距就会“马赛克”分布——那些高级工作室都是石油大亨，系统不一样，不能随便挪用管培生，挪用了就是对其它大亨工作室造成了威胁。


    KPI 系统是要求财富是金字塔分布的，但是尽量要有延展性，所以是天然的“先富带动后富”的——贫富差距是整个组织内都明确有据可循的，因此老板过的不太差，下层一般至少也不过，最差中层过的肯定不惨，否则就会被同样的对手吃掉！


    因此用 KPI 模式的想法去硬套 OKR 系统的人群分类与生活标准，那就会出错——因为 KPI 系统的人习惯性的用大亨数量来评价整体生活水平。


    那么，BSC 组织是怎么搞的？


    那就要从“很久很久以前”说起了。


    从整体上来看，大家都从原始部落到氏族的过程，这个时候本身变数很大，会很多的“偶然”——大家都没演化出什么高级的东西，随便选一个重点的淹没成本基本没有。


    如果第一个出现的中心式结构的，那就很容易发展成 KPI 系统——中国就是中心式结构，而且非常的彻底。中国也是“中心之国”，甚至可以说根本不是“国”，中国更接近于“主城区，繁华核心区”的意思。


    如果第一个出现的是可稳定的去中心化的交易规则限制系统，那么就很容易发展成 OKR 系统。


    商业市场上之所以很难选择，是因为大家的竞争平均水平就很高，所以管理方式的发展成熟度是最主要的考虑——就算另一个体系能更适应下一个阶段的环境，但是发展成熟度不足效率还是比成熟的手段效率低，还是没作用。


    但是如果都是草创，那么大家水平是差不多的，这个时候无论是 KPI 还是 OKR 都能接受更低的初始效率，同时也能够继续深入发展，成熟度越来越高的同时就产生了不可替换的文化核心。


    可是，如果我们仔细想：如果是这样的话，那么 KPI 和 OKR 诞生都很合理，可是 BSC 并不是啊。


    因为 KPI 和 OKR 都可以“一条路走到黑”，都可以很成熟才是，中间怎么会分化出 BSC 呢？小规模还好说，大规模怎么会？


    BSC 这样的上下族群分层，但是上层还出现广泛内斗，这是“很不自然的”——如果走 KPI，就算是闹分家了，他们也是两个互相吃的 KPI，根本没有融合的可能；如果是
    OKR，他们分家本来就很正常嘛。


    但是我们又可以看到 BSC 系统是长期存在的。


    那就奇怪了不是么？


    不过想一下也就不奇怪了，如果我们考虑到“人”这个东西的话——如果人本身应对环境出现了不平衡，那么原有的不适应特征将会放大到组织结构上去。


    不准确的比喻：如果人类在一个环境中不适应，相当于环境给这些人类增加了**“税收”，扭曲了市场。**


    这里面的人类为了适应扭曲后的市场，管理发生了模式性变化。


    我想，道理很简单：人类是一种在稀树大草原生存为最适宜的动物。


    所以人类最合适分布的地方，是热带和亚热带地区——在其它恶劣的地方生存，就必须需要更多的额外资源来维持一个人和一个组织的存续，而这会带来更大的波动。


    而 BSC 系统的锥形，基本都是在寒带地区——其他文明也出现了贵族，但是这种贵族和我们熟悉的西方贵族很不一样，内斗明显相对于西方贵族系缓解和得多。


    也就是说在亚热带和热带的贵族，更多的是“以下明显差异的两套 KPI 考核标准”，并不是“BSC 平衡计分”——因为在适应地区，人类机体本身效率容易最大化获取资源，差异容易拉开，很难形成有权力高低差但斗争能力相似的情况。


    我自己猜想，原因可能非常简单。


    因为寒带地区的野生区域的物产相对贫乏，必须以更大区域游猎的方式来生存（无论是食物还是衣服，衣服作为高价值生存产品就尤其有掠夺价值）。


    即便是农业发展后，由于单位面积下产出相对更低，所以每个人必须要有极大的种植面积。


    这意味着什么呢？意味着“单位面积下，人口更少，但土地生产依然需要人来照顾”。


    这就让暴力活动变得很划算，因为难守易攻。


    对于攻击者来说，这些辛苦了一年的人只是一种不会大规模迁徙的动物而已。抢劫一个农夫，收益当然远远比打死一头鹿大多了。


    但是即便在这样的环境中，使用农业生产的效率还是比野生物产高多了（高更多），所以谁先能掌握相对安全的农业生产，谁就能获得更大的利益，更多的安全保障。


    很显然，在这样的低生产效率环境中，全面的筑墙和大规模防御以及较高的兵民比例是绝无可能的（全民皆兵就更别想了）。


    唯一可行的方法就是使用小规模高机动部队——能跑或者有马都可以，但是马明显更贵一些。


    我们顺着想下去的话，就不难发现高机动兵力部队需要居住在这些农夫的中心地点，因为这样驰援任何一个地方的速度都是差不多的，能覆盖最大一片区域，而且农民自己也会这么做。


    不过这样的物产条件下，为了取得最大的效益，那么高机动部队的“官兵比”会很低——大部份人都要出战，而且是一线作战，并没有差别极大的指挥人员和作战人员的分工区别。


    两者没能拉开，就形成了不明确的分工差异——防御面积大，出产率低，难以拉开作战人员内部的等级差异。


    客观的需求又需要实际的指挥能力，但是大家基本上是处于一种“你会的我也不是完全不会，谁都不服谁”（到了中世纪，许多城主也是文盲，技能专业差异是比较小的）。


    但是这些人身经百战，他们和农夫在分工上却又截然不同。


    他们又不能随便的走掉，因为地广人稀，而且限制其他群体的主要限制并不是专业能力而是粮食——依靠战斗员的子嗣就足够维护战斗员员额，根本没有多少外招动力，形成子嗣传承特权反而更有利于抵抗行动。


    （分工优势在这么小的战斗员组织里不明显，各个分工群体没有很强的规模经济性）


    因此，BSC 的上层等级差异效果不明显，依靠持续对抗维持基本稳定的系统的基础就会很自然的诞生出来。


    战斗员和农民的差异太大了，可是战斗员自己没多大差异，但是走出去他们也一文不值（雇佣兵是很后来的事情了，毕竟能雇佣雇佣兵的组织自己肯定不会小。而且单个雇佣兵有什么用，客户都找不到的，必须要有规模，有办事处和独立的营销人员才行。）。


    在这样的情况下，他们的战斗员不得不“有缝隙但必须一起活着”，所以得使用“战斗员单独内部平衡系统”，以确保对农民的控制和对军事威胁的抵抗能力（军事威胁只是说得好听点，其实就是强盗侵袭罢了，他们自己有时也出去当强盗）。


    如果真的打不过了，战斗员也能比农夫跑得快，到另一个地方也能招揽本地离散的农夫。


    招揽本地农夫是很容易的，因为战斗员能管理的土地有限，就算周围有很多土地也无法防御——如果分成好几个战斗小组驻扎，那样大家都有分裂的危险。


    那些处于“无法被防御”区域的农夫就会很危险，他们流浪中就能碰上被打散的战斗员群落——战斗员逃难的时候当然有条件带上一大堆东西，毕竟敌人那时还在搜刮农民呢。


    因此这些逃难的战斗员是有概率扛更久的——实在不行还能最后一波莽，去打劫。对手夺的毕竟是农民的东西，抢掉一小块不碍自己吃饭，但是离散的最后一波莽的人是要命命的。


    所以离散农民跟着他们是大概率有饭吃的，而之后这些离散农民又可以和战斗员一起形成新的聚落。


    那些拿着东西赶紧逃难的战斗员，他们的队伍就是“方舟”——那些送上方舟活命的动物和牲口，就是书记员与农夫（对于战斗员来说，他们接受的是不同的文化考核，不单纯的是等级差异，贵族和农民就不是一个物种——在
    BSC 模式下，是没有我们熟知的人民群众概念的，只能说是“公民”）。


    这种平衡系统一旦发展，就直接是现代 BSC 的雏形了。


    在 BSC 系统在现代管理中大行其道的时候，其应用场景大多数也是产品链很宽，而且是特别容易“外行管理人员管理内行技术人员”的行业中的。


    因为在上个世纪 70 年代到 90 年代，正好是科技消费品大爆发，并且各种高科技产品（不一定是电子产品）迅速廉价化的时代，同时还是西方婴儿潮大规模进入工作的时代。


    此时社会上具有管理水平的人少，但是喜欢技术的执行人员很多。


    二战后又迎来了战后企业大兼并时代，西方的技术优势也极大化的体现在了消费产品中。


    技术优势在消费产品中是因为贸易全球化进展迅速，这导致一个公司内工作人员的数量暴增——**事实上，这也是一种“人员单产低”的模式，只是因为科技优势而比对手单产高而已，管理上并不是。**


    简单来说，BSC 管理方法最合适的人员结构就是 “一小撮有管理能力的人，去管理超大一堆完全没管理能力的基层工作人员，而且也不考虑多少内部培养，就算是内部有人上去了，偶尔的基础人员开窍也基本满足竞争需要”。


    BSC 在中国也流行过，但是很快就削弱了。“保守的”马上回去用 KPI，“激进的”很快接上了 OKR。


    因为在中国市场上，竞争对手太多了，市场很快就会饱和。


    在这样的情况下，游动抢劫，对手不好等于我很好的市场环境会很快的过去——除非在很小的地级市或者县城市场。


    在这些地方有很多本地经营组织就是原生的粗糙 BSC 系统，即便他们可能根本就没听过什么“BSC 管理”。


    只有“区域绝对统治”或同质化竞争高但市场饱和度偏低的时候，BSC 才有生存空间。


    两者都有的时候，BSC 才有最大的生存空间，反之就会被 KPI 或者 OKR 所吞噬。


    所以 BSC 一直都不是人类强势文明的主流，它的客观条件限制最多——偶尔牛逼一次就得瑟到 “终结历史” 的程度。


    甚至连宣扬 BSC 管理法的机构也是一样，各种 “BSC 是 xx 年来最伟大的” “史无前例的 xxx” “牢不可破的 xxx” “适合一切 xxx”。


    简直就是苏联内部派来肃反的蓝帽子，你反对一句就要被枪毙，你不说话就送去古拉格挖土豆，你夸奖就送你去惩戒营用步枪戳坦克。


    各种管理咨询公司推荐咨询服务或者培训服务的时候，说 BSC 的人员都和传教疯子差不多（虽然专业水平高了在直观感受上不会这样，但是你回头品一下还是这样）。


    就好像 BSC 的推荐人员不是来跟你讲 “生存工具” 的，而是在跟你讲什么宇宙奥秘，终极物理规律之类的东西。


    BSC 就是好，BSC 就是牛逼，你死了是你心不诚！


    中国和 OKR 那些人，虽然对自己的文明自信度也不低，各种笃定甚至部份极端，但是欧美人那是疯，连自己都打的那种疯，所以我们看欧美的对外政策，经常是“削足适履”
    的——他们本能的不觉得有错，是 “赎罪” 不够才没做好（用欧神的话来说：科学尚未普及）


    OKR 的老化，主要体现在 “正统领袖消失” ——这意味着扩张的廉价劳动力不好控制，核心区缺乏廉价劳动力，可是核心区的管理人员的 “干涉范围” 不够大。


    这个时候核心区对周遭 OKR 组织的 “存在必要性” 会降低，组织将会趋向于解体，而且其他组织，尤其是 BSC 组织可以用集中资源的方式对 OKR 的周边群体进行收买。


    但是核心区域到底是战斗核心，一旦周围的人被大量收买，其实光靠周边区域的人是守不住地盘的——但是暂时还没有凝聚能力让他们一致对外，必须经过核心重整以后才有机会。


    所以 OKR 老化的最直观证据，就是“各个 OKR 都选出了所谓的正统领袖”，但是互相都不承认并且打起来了——这个时候说明 OKR 的核心交易规则已经不稳定了，大家都想重塑。


    可是原有规则本来就不是很大，别人想重塑其实是为了“蝇头小利”——如果不是外部有人提供额外的好处（外部势力干涉），他们争取这些蝇头小利的意愿是很难保持的。


    —


    （OKR 系统天生不容易反外来干涉；不像 KPI 特别能够阻挡，但代价是 KPI 系统很多时候也会阻挡有利的信息流入。）


    那么 OKR 重整的迹象也容易观测了——大家（尤其是主要强势方）同时放弃“正统领袖的认领权”，这个时候等于大家公认了一件事。


    “大家注意了!! 我们需要重整，我可以接受 OKR 整体系统内的能人提出的额外条款并且愿意主动给予资源来购买其股份，也可提供风险投资资金。方案试行公司在我处为有限责任制。即便创始人失败了也不会开除出组织，仍然可获得五险一金。”


    这就相当于 OKR 组织内部的现有强势方给了一份“创业基金+创业者基本生活保障”，为创业者进行兜底，共同促进内部创新，发现新的团结方式。


    这就说明 OKR 系统的内部统合成本降低了，外部干涉被默认需要在几乎所有 OKR 子系统和项目中被排除。


    简单点说，就是大家一致同意：各退一步，和平海阔天空；更进一步，平摊研发风险。


    此时，OKR 系统内的交易成本将会空前的低，管理成本也会快速下降，整体革新效率会大幅度增加。


    在这样的情况下，OKR 的复兴就不仅仅是“微光已现”这么点希望，它是艰苦卓绝又十拿九稳的。


    因为它在社会效率上会很快的重回高点，而这是一切文明系统复兴和强盛的关键。


    至于 KPI 系统的复兴，大家正在经历，所以不必赘述。


    BSC 系统大家也看出来了，这东西的周期性不是很强的，所以在社会竞争法昂面，它很难称得上“兴衰周期”，叫做“黑天鹅事件”还差不多——但是时不时出个黑天鹅，它本身也很正常。


    很多人喜欢西方文明，这很正常。


    但是很多人又把短暂的优势想得太大了——动不动说“几百年的优势 xxxxx”


    然而他们可能没想过一个问题：我们本来在大多数人类文明历史里都是长期隔离的，哪怕是交流也只是很少的。


    可是人类有最初文明是苏美尔人，公元前 3500 年，也就是 5500 多年前。


    也就是说在几乎隔离了 5500 年的情况下（最近 100 年才有了紧密的文化与贸易交流）。


    200 年的差距只差了 3.6% 而已（这还是假设全方位绝对差距，然而实际上没有那么 大）。


    如果就“复杂技术”而言（有些人最喜欢谈的），那么就要从人类第一次制造弓箭时候算起了——2.8 万年前。


    200 年，那就只有 0.7% 的差距。


    这个 2.8 万年里，绝大部分时期分隔两地的人类群体连互相存在都不知道。


    可是过了 2.8 万年以后，他们在后人眼中的“绝对优势”才领先了 0.7%——如果 这是“加速度”领先 0.7%，就好像很多人所谓的“文明优势”那样。


    那么地球人中有一个文明不仅别说控制全球了，早就应该已满银河系殖民了才是。


    所以说人类的差距，特别是生存优势的差距，包括发展出来的生存工具的差距是很小的。


    尤其是组织规模没有百倍以上代差的情况下——超过百倍，意味着社会之间的差 距已经超过了“又一个 150 人亲密关系门槛”，是出现了代差（每个层级都多增加一个
    150 人社会层级，意味着社会管理的最基础构成的效率产生了代差，而管理成本的降低不会是平白无故的，是需要大量实验的，而大量的实验是需要成本的，能付出降低管理成本的组织一定是极度富有的——什么人最有钱？有书读的人最有钱。什么人比读书人更有钱？穷文富武了解下。）


    但是即便如此，这样强烈的，几乎是本质的代差依然可以在条件允许的情况下生存下来。


    要知道每隔 150 个人的代差，可至少是上千年的差距——在人类有复杂技术弓箭的时候，人类组织就还那么点。


    光是这么一个差距，就算用 2.8 万年来计算，两个等级的文明至少也相差了 10%——这么大的差距，绝大多数代差文明和族群依然在优势族群面前生存下来了（大部分彻底消灭的往往是自然环境剧烈波动，并非人力所为）。


    人类的历史还没有长到可以确定文明最基本的适应策略模式来“预测”非常长期的程度，因为人类历史一共也就这么点时间。


    而人类社会极度复杂，是人类所能面对的最复杂的事情（超过宇宙本身，就好像大脑的复杂度超过已知宇宙宏观天体一样）。


    这就意味着，即便我们是考虑“最基本的策略相对优势”就已经是上限了，即便在地球那么小个竞争平台上，以我们现在的实践和技术水平，也基本上不可能从客观上对“文明的永恒优势”做出准确的判断。


    因为“社会组织”是一切复杂的整合。

