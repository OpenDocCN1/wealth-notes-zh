    ## 电锯：卧槽，快跑！坦克来之前我能跑出 100 里地！


    欧神：喂？我问下，那家伙跑出了 100 里地，你说咋办？什么？远程火箭炮？你说最好用集束杀伤弹头？好的，那就用那个吧。


    电锯快速 R.I.P，变成分散在半径 100 米范围内的肉馅。


    欧神：哦对了，他还有个末日地堡，找个挖掘机把他坟也给拆了。


    为什么欧神可以叫坦克？因为他在自己的渠限内做到了极大的演化深度，成为了高效物种，食物链等级高。


    只要“超大型社会组织生产整合链条”存在，欧神就能拿炮因子轰，因为这些系统也是需要这个链条才能发挥作用的。


    需要注意的是：演化深度很高的时候，往往也能拓宽适应范围，它的投入产出比也比较高，但不能过度超出范围，否则整个系统就会失能（就类似于如果氧气含量降低，那么一大票演化程度很高，效率极高的顶级掠食者反而容易死）。


    只有在全局都完全超出原有生物适应范围的时候，渠限越多的物种越难存活下去，渠限越少一般更容易找到办法（改变代价很小）。


    也就是说，足够强大的演化深度还是能在“既定的核心环境背景里获得最大的生态位，照样可以避免在严重灾害中灭绝的能力，适应能力依然很强”。


    这就好像 100 万的人不可能用暴力对我有多大威胁（特别是国内），因为我亲自亲自助能对付 100 万的人分出的资源派来的攻击者。


    1000 万就有危险了，更多的就要死。


    但是欧神就能抵挡住远远更强的同类攻击——只要人类大规模社会生产系统还存在。


    那么，当一个社会管理系统选择“遗产税”的时候，这至少说明或者说反映了什么呢？


    - 1：税收拿的是金钱，金钱在现代社会里是无孔不入的，是存在于方方面面的。

    这意味着一个社会管理系统，它已经觉得“我们当前的情况，已经可以给据大部分人的几乎所有方面都加上新的渠限”。这是“全局一刀切”。

    - 2：一旦形成了限制，那么我在“渠限”层面和它的更上层部份，就固定下来了。

    这意味着：现在这个模式我已经设定为“从今到以后的较优模式”，这时参与“纠缠演化实验”的人员会减少，变得只有很小一撮。

    这一块的演化速度随之减慢——赌的就是“假设环境核心不改变，我要争取的是这个环境下更多的生态位和更高的食物链等级”。

    整体而言，也是这个社会选择了“以现在已有的主要核心系统，赌它能硬抗所有环境变化，演化带来的进步被严格区分为两个阶层”。


    是不是有“内味儿”了？


    对，这就是“贵族”系统——确切的说，是西方贵族系统（中国很久以前就不再使用这样的贵族模式了）。


    只不过旧时代的贵族是制定了一整套的贵族继承方法，并以法理确定在系统内整个贵族圈子的“基准法”。


    现代的西方遗产税体制下的贵族，是换了张皮，但是达成的结果并没有本质变化，只能说是优化了。


    **优化主要在于：初始设定的贵族圈子可以更大，血缘关系更具有筛选性，可以排除不必要的血缘关系者，延长贵族的产权稀释的周期。**


    **但是要想稳定它，就必须让被排除掉的“不再被贵族需要的贵族孩子”能够在被抛弃后加上“渠限键锁”，让他变得和草民差不多，那就必须采取另一重法律保障——让老百姓去把这个人强行拖下水，让老百姓具有一部分权力，这样老百姓就乐于限制或者处决这些被抛弃的贵族。**


    这套办法发展到现在，就是“一人一票，权力等同”的票选体系。


    但是，这个系统的根本矛盾之一虽然被缓解，但是却带来新的发展矛盾（尤其是在科技合作扩张的情况下）：这些依然位在的贵族，内部会争取自身贵族的上位，**而他们的所“分包”的贵族资产是会在现代经济系统中发生波动的——暂时获得优势者会快速的试图制造新的限制条件，阻止其它对手再次获得优势。**


    **这就是“现代西方社会福利系统”的来源——为了在自己占优的时候给对手的“教区”内的产业增加成本。**


    **在一人一票的“落魄贵族杀戮系统”之下，谁去掉福利谁就需要有更多的“繁殖后代”受到影响，所以福利无法降低。**


    **这两个加起来，就是现在的欧美“民主封建贵族系统闭环”。**


    一人一票，发动群众杀戮落魄贵族——刺激草民阶层的“细节工作能力的深度强化”。


    但是这个强化更多用于极度细节的分工，草民阶层并没有真正意义上的拓展生存能力，而且还会因为贵族内斗而被限制在更狭小的领域，整个社会中所有人的适应性都会逐步降低。


    贵族内部设卡，提高对手辖区及产业的社会福利——刺激贵族阶层的“渠限设置能力的演化强化”。


    **也就是社会两个阶层都受到了“演化激励”，保持了演化升级。但演化副产品是大量无用的累赘器官，而且这些器官绑定了渠限以上的身体基本结构，很难退化——这种事情在生物演化上也经常发生。**


    这样的系统的坏处，大家都能想出来。


    **1: 贵族的实际组成会因为渠限新设内斗而越来越少，产业结构会产生不稳定并最终减少，越少的贵族的随机演化次数也会减少，社会管理创新能力在越过发展中点位以后会快速下滑，而且在收缩期间设立新的渠限的作用会越来越大，这又导致贵族的进一步减少，演化速度更快落后，遇是整体的衰退速度是“加速”下行的。**


    而由于现代产业体系的相关性，现代资本的预见性，所以加速下行会更快的影响预期——加速下行成为公认后，社会立即陷入崩溃前兆，因为社会管理贵族体系会先行“撤资”。


    一个池塘，它在下雨超过蒸发的时候，大家都还在求雨。可是突然发现蒸发超过下雨了，大家很快散伙不说，还把池塘的水快点往水车里面抽。


    **2：社会福利会无限增加，剔除的唯一方法是一小撮贵族突然牛逼。**


    但这样往往是“其它竞争对手行业被大范围的增加福利要求”，而自己的部份则吃的是财政或者干脆没有。如果社会福利系统被全局高层制定，那么“自己的那部分”更容易完全吃财政，那样损耗更大。


    这样一来就形成了恶性循环——最终导致全局产业链竞争力崩溃，即便是那些新兴行业也会很快被盯上作为“应急口粮”（比如说金融业和高科技产业）。


    这个时候，整个社会已经“停止从外部进食”，开始“内部消耗脂肪和肌肉”了——而且由于第一条，逆转或者暂停这个趋势是几乎不可能的。


    **3：由于贵族系统最终还是控制了所有管理方面，但是此时不太可能只剩一个管理者。**


    如果只剩一个或两个同等级贵族（两个可以形成稳定寡头对立系统），它只能变成法西斯军阀。


    如果还剩几个，那么它将会爆发极其惨烈且往往目的是大规模消灭对方贵族人口的内战（不是摧毁贵族本体，是摧毁全部。因为贵族系统下的其它运行系统很难纳入自己的管理模式下，越是之前发展的精巧的贵族系统越是如此）。


    这样一来，那些发展的相对比较有效的管理模式（尤其是细节模式），会大量的损失于冲突之中。


    新建立起来的同类系统又具有很强差异性，所以前朝的经验并不是那么容易传承和使用。


    如果新建立起来的社会依然需要大规模的旧产业旧体系，那么新建的社会系统就更多的需要“从0开始”，内斗损失极大化。


    很显然，这样的系统虽然在非常长期的时间段内考量，它的“继承”少也意味着“继承的瓶颈比较少”——严重出乎意料恶劣环境变化的抗性比较强，随时都有可能重新开始这种模式，因为初始成本不高（设定贵族不算很复杂的技能）。


    但是它的管控核心就难以以足够高的效率深度进步，新瓶装完全旧的酒的可能性特别大——社会核心管理能力和模式演化深度比较慢（基数太小）。


    这个系统其实我们今日很熟悉，因为已经变相用在了企业中。


    超大型社会组织系统的核心决策层考核与协调方法只有三种主要模式：“KPI/BSC/OKR”，其它系统大都过于狭窄或者中间信息过于模糊，以至于无法大规模使用。


    那个 KSF 成功因子看起来吊炸天，实际搞起来根本就是一地鸡毛，只能在比较狭窄的分工领域用，采取技术核心整合难度门槛来强行限制，而国家不可能是很狭窄的东西——因为企业越来越大和复杂，所以一些企管开始用社会管理的方法，但并不是所有东西都能套的，毕竟企业只是社会分工的一部分。


    西方这个管理模式就是类似于 BSC——平衡计分卡考核标准。


    如果有人还不了解 BSC，那么详细情况请自己搜索一下，这个东西三言两语说不清楚。


    只要记得 3 点。


    - 1: 全面采用 BSC 管理模式的公司，那些早年被作为 BSC 模范企业的公司。除了那些“产品线很广”，生产流程很多（初始贵族很多）”的公司以外基本都死了，而且几乎都是瞬间暴毙。

    - 2: 美国联邦当局全面采用了 BSC 管理模式（军方优先）。

    - 3: BSC 只能用于管理层。


    通过之前的内容，大家不难知道为什么 BSC 管理只能应用于管理层，因为它本身是上层切分多个层级的战略组成后，在每个层级的决策利益群体中进行平衡计分。


    如果要对更多人计分，那么其管理成本会暴增，根本不可能可以承受——每个决策层之间是靠博弈平衡的，在任何时候都有固定的浪费，消耗的管理资源无论在任何时候都很大。如果每层都这么用，管理也就不复存在了。


    所以 BSC 只能是“贵族式”的。


    而暴毙的原因也很简单：内部失衡失稳定可能性很大，而且会从下到上失衡——连锁反应。


    同时 BSC 的更上级也会受到下层斗争的影响，他们会更多的考虑在下层中获得更大利益的单元——直属上级永远可以跳过“规章制度”和直属下级产生额外合作，你不可能
    100% 的监管它。


    最后这些“唯一赢家”的要求会自下而上的要求“全体二级头目”对老大连加压力，而此时老大已经没有全局信息了，想强行干预都基本不可能做到。


    于是就发生这样一个情况。


    > “老大傻了，老二疯了，老三老四在干死亲兄弟了。”


    这一切的全面开始，是突然的，是从“全体老二头目发飙”才能真正的被老大发现的，是“被发现的同时全面爆发的”。


    这就是因为 BSC 系统就是个“民主封建贵族”系统。


    它自然而然会发生“管理层合谋，直接通过自己的管理积极性和手头的资源（信息也在资源的范畴内）去影响决策，而且信息沿着层级上行几乎完全取决于层级内的平衡，不能直接观测”。


    虽然 BSC 系统里面有大量的章程和技巧试图避免这个问题的出现，但是基础信息系统的瓦解往往是体系核心问题，无法依靠依附体系存在的内部章程和技巧加以避免——甚至在事情发生后，加上这些章程和技巧反可能是信息扭曲集团的目的，增加了死的更快。


    这就好像保时捷和梅塞施密特一天到晚上，希特勒说一些有的没的“超级无敌扭转败局的神奇新式武器”一样。


    希特勒一个人当然不能懂得这些东西，但是这些“老二系统”已经完全扭曲了讯息，希特勒甚至直接下工厂都没办法听到其它信息。


    当然，听到了也没用，因为没有这些老二，他现在就会死——他也许可以想办法做掉几个小头头，可是接替上来的人又能有什么变化呢？只能是更加贪得无厌的内斗胜利者罢了。


    这个过程就是“渠限”上层人数越来越少，演化速度越来越慢——最后老大变成“活化石”。


    “遗产税”大幅度增加，或者连商人都都在鼓吹遗产税，这说明了什么呢？


    无利不起早——当然是因为作为社会生产者的商人也变成了贵族，他们因为下级平衡系统的失灵，所以不得不亲自上场，用更一刀切的方法给自己续命。


    但是这个过程中，这些商人也 就失去了演化空间，他手下的演化和他不再是一个层面的东西。


    他不得不慢慢的变成活化石——静待外部环境变化到彻底打破所有渠限的软肋，到那时，他们就都是真正的化石了。


    如果他们拒绝成为活化石，他们就会成为被排挤的贵族，立即被别的原来是同行的贵族搞成烂肉。


    所以说西方的资本家之所以会变的“吃人不吐骨头”，其实是他们自己的骨头也要被吃了，是整个社会管理系统就已经缺乏核心演化能力——管理层发生了物种单一化，管理层先于基层开始灭绝（就好像陨石落下后，大型食肉恐龙死的更快一样，食物链越高，死的越快）。


    由于资本家是临近最后才不得不下场救火的，此时也只能一刀切，所以资本家就只能戴上高帽，成为工业时代剥削罪行靶子——多米诺骨牌倒下的第一块很少有人察觉，但是最后一块却总是倒在所有人头上。


    综上所述：遗产税根本就不是打击贵族的，遗产税是“贵族化程度实在是太高了，不得不收缩防线，稳固现有贵族平衡”的策略。


    也就是说，遗产税和“封建时代立法保护贵族的基本利益和特权”没有任何的本质区别，只是包装变了一下而已。


    这种变化包装太容易了，无论是避免宙斯的残暴还是上帝意志的代行者，亦或是天赋人权等博爱反蓄奴。


    因为要给这种平衡一个理由，一个低成本的理由。


    所以在 BSC 管理下，企业文化会有一个“神化”的东西，会有一系列“不需要考核且必须被认为是不证自明的万精油价值观”。


    因为 BSC 系统，必须明确确定一个 BSC 层和草民层（草民层可以混合 KPI 或者 OKR），大量的平衡资源被 BSC 占用，所以对付草民层就得节约成本，用一种更加“低成本价值观迷信”的东西去填充因为“挖走利益蛋糕”而形成的逻辑合法性漏洞。


    也就是说，BSC 连接管理层和草民的核心，本质是“神授君权”——这个体系就是好的，就是对的，说 不对的都是异端，异端就要烧死。烧死你，炸你，给你普及我们的管理系统，都是神给你们的恩惠。


    我们给了你们这么好的东西，废了半天劲烧你炸你，你过不好日子是因为神仙很忙，他还来不及看你，这和我有什么关系？所以我从你这儿拿好处怎么了？你还不让我拿？靠，那我要拯救你们，东西我先抢过来，我帮你求神仙早点看到你们，我自己先被费继续帮你们把你们都烧光炸光，不用谢我，这都是应该的。


    要是后来没成功。


    他们的低级“神仙爱好者”自然会流下痛苦的眼泪：我们都把神仙给你们了，这么贵重的东西都给你们了，可是你们只是死了爹妈和儿女而已啊。这么划算的生意不做，还说我们强买强卖。宝宝太委屈了，哭哭。


    （所以牧师在房间里给小男孩“开光”也没什么不对的）


    神授君权的最终结局，当然就是“有神无君”。


    但是神是不会真的下来管理社会的，神也从未把水变成酒，更没有在饿呼遍野之时变出过神奇的大饼。


    为什么神在这个时候也不把水变成酒？为什么不变出大饼？


    那当然是因为对面有人触怒了上帝，不把他们杀个精光，上帝就会惩罚我们。


    神是完美的，所以神自然不需要演化。


    BSC 的难点，也就永远在这儿——不可能完美解决，而且进步还会相对较慢（除了刚开始）。


    好，主要问题讲完了，大家应该明白了标题为什么是《遗产税与演化论》。


    但是我知道大家肯定还想问一个问题。


    “除了 BSC 以外，不是还有两个么？KPI 和 OKR，它们分别是谁呢？”


    KPI 是中国，OKR 是另一个现在还在复兴期的古文明（既然那几个字敏感，我就不说了，各位也都知道是哪个，是一个经常被看不起和敌视的那个——他们就是 OKR，仔细想想就知道了，这里不深究）。


    KPI 恐怕是大家最熟悉的绩效考核模式——关键业绩指标考核。


    中国也有平衡系统，但是建立方式并不是欧美系统那样的“分层，层内内斗平衡”系统，而是“等级+绩效评比=平衡通用依据，平衡基准法规定的平衡依据”。


    KPI 的核心组织，最关键的也是两个系统（还是寡头平衡），但不是欧美的“上下分层”，更多的是“对半分 层”。


    也就是“监察系统” + “发展系统”。


    你可以理解为“圣经书记晓胤系统”和“权衡稳定发展和琨系统”。


    纪晓胤系统——利益从皇上这儿往下发放为主，而且绝不能乱拿。他们负责监控和琨系统，并且给琨系统下达指标，把和琨系统里的一部分钱集中起来交给皇上，这样皇上才有能力给纪晓胤系统发工资。


    这个过程即是“政绩系统”。


    纪晓岚系统对和珅系统下达的指标，以及与和珅系统的接触过程，就是搜集需要制定来年 KPI 标准的参考数据。


    大家都清楚，KPI 最困难的就是制定合理的考核指标与考核逻辑——要依靠真实的信息和可靠的分析，缺一不可。


    圣贤书是政绩系统的核心学习标准——在这样的系统中，这就是“圣限”之一，我们的细节演化在这一限制中加强。


    最具有代表性的，就是中国非常具有效率的公文书写系统——标准化，大多数核心信息上传五层都基本不会被扭曲（看看西方的扭曲程度，就可以知道中国的演化路线的不同）


    权衡稳定发展和珅系统——利益主要从辖区或和辖区有关的所有利益交互过程中获得，本职工作是用一切手段发展经济，维持经济稳定健康，这里当然也包括基础的安全保障，辖区环境等。几乎都是实操性的组织管理任务，发展经济和维护民生。


    KPI 系统大家都明白：起步比较困难，信息缺乏的情况下需要很高的水平才能建立，需要很强的业务底蕴。


    KPI 系统还需要畅通的标准制定信息渠道，也就是监察系统必须足够高效——需要激励。


    不可调和的矛盾：KPI 监察系统会不断设立越来越多的标准，这些标准是没有动力撤销的，但是为了维护他们的激励程度，不得不在原则上放任这种现象的累积。


    当累积到一定程度，和珅系统将会被实际卡死，再次发现新的民生经营模式的难度越来越高，最终导致成本已经超出了收益——和珅的活儿，没人干了。


    此时和珅系统会失能，并且越来越多的转向到纪晓岚系统。


    在这样的情况下，纪晓岚系统就不得不在经济和发展问题上“亲自下场”。


    可是这套系统是不可能维持社会发展的，原因主要有以下 3 个。


    - 1：他们业务本来就不熟练。

    - 2：他们周围的人更多的也是监察系统的，很危险。

    - 3：他们更熟悉监察系统的工作，使用监察系统知识去对付其它监察系统的人很容易，所以谁先亲自下场谁就越危险。


    这三者合并，就会导致 5 个循序渐进的结果。


    - 1：只能使用最保险，宁可使用对社会有损失也不能被动直接处罚的策略。

    - 2：越来越多的已经有崩溃倾向的地方会迫不得已展开“合作”，互相约定“不对付对方，现在规则已经累积到啥都是死的地步了，谁说谁都没好处”。

    - 3：为了保持存在，监察系统必须自己想办法制造和保存自己内部的和珅系统，并且保护他们——在这一过程中，这一地区的暴力保护+等级秩序+经济发展已经开始脱离原有的
    KPI 系统，发生了内部繁殖。山头形成。

    - 4：内部繁盛成功的系统，将会被残存的旧整体监察系统所重视，因为他可以给予新的资金。

    - 5：旧监察系统会快速的因为资源短缺而开始对最早给予资金的山头系统提出更多的要求，此时山头系统也能对旧监察系统提出要求——此时旧 KPI 制定人员已经完全失效，只是一个空壳。


    至于 5 以后是什么情况，那就要看当时有多少发展程度和实力没有代差的山头了——如果区区几个，那就奉天子之命镇压叛乱（镇压后对天子怎样，那就要看那个山头的意愿了）。如果是多个山头，那就会进入争雄模式。


    KPI 系统更新时的特点：


    - 1、大家互斗的时候只有最上层一小撮人是根本矛盾，其他人的系统本质是类似的，只要是同类型系统就几乎没有灭绝性打击的必要。

    - 2、KPI 设置经验继承性较好，再重盘局面后，能较快地实现新 KPI 系统建设，并且每次都升级一些功能进行深度演化，增强 KPI 系统在其演化渠限内的能力——远期来看可能会降低适应宽度。但是只要底蕴足够厚，其深度带来的抗打击能力也会越来越强，而且是一次比一次强。一旦熟悉了新环境下所需要的东西后，制定出的
    KPI 将会比 BSC 系统更加高效，管理成本可控性更好，形成反超局面。

    - 3、新 KPI 建设后，旧 KPI 系统最后的监察人员的行为早就超过了现有系统需要的程度，所以任何一个旧 KPI 系统的末期监察人员几乎都会被认定是“和珅”，反倒是“以前的和珅”可能在新
    KPI 制定里发挥重要的指标制定依据提供者作用——他们反倒更有背能成为新的“圣贤监察系统”的一部分。


    正因如此，所以中国历来改朝换代，对于前朝的末期的毁灭结局的原因里，才永远有“敲骨吸髓，民不聊生”这一项。


    就好像任何一个以 KPI 考核为主的企业，在盘点为什么破产时，场面上永远会说是“有人造假”的原因一样。


    （儒家文明圈就是 KPI 文明圈）


    > 这个系统中，KPI 最终制定的裁决者必须被假设具有“终极能力”——名义上低于神，但却是天道大会中，融合各路神仙意见的裁判长。

    > 皇帝对单个神仙是需要保持谦逊，但是真正做决定是看“天道代表大会”，不是某个万能的个体神。

    > — 政行个体神的意见的权力在皇上手手里，当然是“君授神权”——神是参加“天道大会”的“群众需求代表，各级管理部门代表，各类外部人士代表等”。

    > — 因此我国无论是圣贤体系还是其他管理系统人员（至少是中高层），无论是属于监察系统还是发展系统，老百姓对于这些人的本质要求只有一个——神性。


    哪怕是个社区管理员，我们也觉得他要么像个“土地公”，不然就是不称职。


