    然而我们都明白，大多数人的初恋结束后都会有一个感觉：哎……为什么呢？为什么他会是这样的呢？


    嗯，大家都意识到了：这是因为这些零件“拼装”后的结构不一样——你'
  - '[PAGE 229]


    想要的其实是个电风扇，然而他这螺旋桨和电动机和一坨塑料拼在一起……卧槽？咋就是个遥控飞机啊？！


    这里面是涉及到对方的各种逻辑原点和优先顺位的。


    我们就拿上面的那些 “喜欢的点” 来举例好了。


    你觉得对方和你一样喜欢绘画，这很好。


    同时他也和你一样喜欢这个游戏，这也很好。


