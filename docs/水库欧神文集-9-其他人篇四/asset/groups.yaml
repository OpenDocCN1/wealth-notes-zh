    \n为什么会有这个区别？\n\n其实我们想一下就明白了，其实“直男”的逻辑原点是综合的比较好的（很多事情其实有一个逻辑中心，比如说欧神就是“奥派理论”)，他提出的那些要求和对待方式，其实是可预测的，就算别人不懂，只要态度良好也能感受到某种稳定性。\n\
