    而且由于“物质基因”在数代内一般可以较为稳定的遗传，而且“显性”时间可以跨代际，这相比一般动物只能透过一代的显性优势更有效率，因为复制基因的不再是只有“原始优势体”一个的繁殖能力，而是增殖多此后的数代人——相当于后辈几代人就算完全吃“蛋黄”也能生存，一心一意谋繁殖，男性在这儿更多选择的是生殖繁殖，而女性更多的是文化传递，“相夫教子”的过程中传递了“文化基因”。


