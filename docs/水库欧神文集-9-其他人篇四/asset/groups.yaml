    比如说有颌鱼类的跃升就是如此——鱼类一开始没有下巴，有了下巴以后吃东西变快了 点。


    吃东西变快了是好一点，不容易被人抢吃的，但是也不过如此。


    大家都想吃的快一点，所以就强化了下巴的肌肉——每次强化，吃东西都稍微快了 点，在内部繁殖中占据了小小的优势。


    直到有一天：卧槽？兄弟们，不得了，我发现了为吃东西快一点而长出来的下巴肌肉， 已经能让我们咬穿角石的外壳了！而且我们的游泳速度也恰好在以前抢夺残羹剩饭的时候练好
    啦！


    角石：远古时期一种巨大的，长得像会游泳的尖海螺的东西，是鸟贼的远亲。当时是近 海霸主，大的能长到三米甚至更长，曾经是海洋里位居食物链顶端的物种。


    大家应该明白发生了什么——能杀角石的有颌鱼类从之前仅限于当今四川的海域，全面 杀向全球的海洋，角石从食物链顶端的掠食者瞬间变成了超大号海鲜自助餐（连同一大堆
    巨大的软体和节肢动物一道）。


    生物的演化是几乎完全随机的（偶然演化的渠限，能够让这种随机在更小的范围内展 开，强化某一特定器官，有机会超越临界），但是社会的演化并不是完全随机的，有人可以
    直接有意识地加以干涉。


    但是这也只能是有意识地干涉，管理者自己也不知道具体会出现什么，所以需要一个 “舞台”来让各个不同的个体进行演化，在这个渠限中演化出更高效的东西来。


    这个“有颌鱼类”的故事，特别像“工业化”的故事。


    这个有颌鱼类为了快点吃残渣而发展下颌肌肉的过程，就是“产业化”的初期。


    而工业化国家突然猛吃包括中国在内的农业化国家，就是“产业工人和产业体系发展 大型化以后，全国工业系统突破了临界点，发生全国组网，规模经济效应暴增，交易成本
    暴跌，并且形成了可以被主权国家系统可以控制的关键节点，于是转化为了国家级的统一 对外军事输出的力量。”——工业化初期，就是一些产业结构方式产生了渠限制，所以后来
    工业科技树就只能一路点上去（已经从重工业生意的人无法退回到农村了，因为农田里到处 都是人）


    这就有颌鱼类突然发现自己“我的下巴有一天居然可以咬穿角石”是一样的——英国 当局也是在事后才发现工业的威力的（发现税收暴增）。


    因此“渠限”本身就和它所有有意义的演化一样，它本身并没有“好坏”一说， 它只是一种特性和现象而已。


    一种特性和现象，要放到特定的环境和时间段里，你才能得出它的“好坏”。


    所以，我们就要客观的分析一下“遗产税”到底是要干什么？有什么用？它想做 什么？它会带来哪种结果？


    而这一系列问题，也要区分“环境”和“时间”——它们两个加在一起就是一个 东西，“变化幅度”。


    +   - 渠限加在一起就是“适应宽度”。


    +   - 渠限基础上演化出来的细节性状，就是“演化深度”。'
