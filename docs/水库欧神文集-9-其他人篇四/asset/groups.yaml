    不仅从“个人生活享受”这一层面上合理（否则早就被淘汰了），而是从“基因”层面 上来说都没有任何问题——或者说“需要个人生活享受”也是促进人从感性上以恰好完成这一
    点（不需要完成复杂计算，否则风险太大，直接预制到本能系统里去）。


