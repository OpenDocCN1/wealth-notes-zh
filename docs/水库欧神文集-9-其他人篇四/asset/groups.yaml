    这个问题就有点类似于供应链，要是人家某个产品产量就是不够，你强行要人家扩大生产某个单一产品，那么人家就很难受，除非你给人家更多的钱抵消增产风险，但是这样你可能也会不开心。所以，你可能还不如采购他的两种产品，后一种可能稍微不太符合你的需要，不过也确实能够填满你的感情货架，也能让对方继续以最划算的成本生产你最需要的产品。


    经济上的相对优势不代表绝对产能无限嘛，你让人家超量生产，人家也可能会规模不经济的。


