  - '[PAGE 152]


    KPI 这样的科学管理系统虽然目的是按功分配，然而因为需要统一标准，在面对大多数人员的时候，它为了维持公平的感觉执行的是按劳分配。


    而对于最关键的“维护整个系统依然存在”的过程中，由于管理成本不能无限提高，所以不能“完全监督”，它是需要一种“统一的基础服务和规矩”的——因为理论上就不可能完全干涉到（否则全社会就没有自主演化激励了，成本也吃不消），所以
    KPI 系统必然对于大多数基层人来说，它都有“大锅饭”倾向，尽管吃这个大锅饭也挺累的。


    所以呢？


    KPI 运行的根基，或者说操作中永远会产生一个“背景”，它是“按需分配”的。就算物质没有极大化的时候也是在基本层面上用“按需分配”来达到稳定组织的目的。


    按功分配和按劳分配是 KPI 的追求，但并不是它的“基本面”。


    所以……KPI 模式自带两个字主义属性，所有最终制定 KPI 的人，本质上是两个字主义的实践者（即便他们嗤之以鼻）。


    BSC 的话，实际上并不适合资本主义，它最合适的是贵族买办系统。因为整个社会的决策层必然会在“基本可交易的权力单位”上，比如说“一块一块钱”上有越来越大的“单一特权”干涉空间。


    所以在 BSC 系统里，最终大多数人的权力和权力单元都会被控制——终产者就会出现。当然，以前的 BSC 贵族到底没那么强，他们进化也一直狭窄，所以大概不可能形成“终产者”，因为老百姓加起来还是比他们聪明。


    虽然终产者也许不会出现，但是资本主义经济危机可能爆发。终产者的出现主要不是因为资本主义本身的问题，而是因为一套贵族制系统再越来越独断专行的掠夺市场。


    贵族才是终产者，资本家并不是，只是这个贵族披上了资本的外皮而已，而且还是抢过来的。


    抢劫无法永久持续，系统没有足够多的余量可以填充贵族，所以才会出现终产者。


    原因很简单：因为渠假设立本质上是基于“上下”——分成了两个决策升级系统（变成了两个物种，演化路线都不一样了），KPI 虽然也等级森严，但是它要求的是“一个决策演化升级系统，分开演化就是违反，大家都为更好的
    KPI 付出演化成本”。


    也就是说：KPI 的核心是“大家养小家，虽然家长蛮凶的，而且越来越多”，BSC 的核心是“大家养小家，一开始家长多了还能服务，后来家长自己死的太多了，最后剩下神经病一样的疯子爷爷，这家没法呆了”。


    OKR……大家想一下。


    这样的组织，不是恰好适合资本主义么？


    因为并没有一个绝对的“家长”，内部也没有全局性的“上下贵族”，不是二分法而是一群“实际利益组成的集群”。


    在这样的系统中，绝大多数时刻都需要一种“通用一般权力等价物”进行交易，能够最大程度的影响内部权力构成——当然完全没有特权机关不可能，因为军队肯定是要的，不然要被打死。


    所以……人家 OKR 才是真的适合“资本主义”的，虽然他们现在还披着“神权”的外衣——问题是，如果神权机构并不是一家独大，一伙人完全控制会怎样？


    对吧？神权作为管理文化基础和资本主义并不绝对冲突啊！（有神而神无权）'
  md: "\n会觉得“为什么他们anja日子不过呢？我们帮他们把领导变成神仙有什么不对的，我们这样要求有错吗？怎么都救不会的呢？”\n\n略微说一下啊 OKR\
    \ 系统（目标和关键成果考核）。\n\n简单来说，OKR 系统是“纯平衡非考核系统”，也就是重团队管理轻指标考核。\n\n此时核心目标和绝大多数利益团体目标被要求公开展示，非公开展示会被认为是恶劣和危险的行为。\n\
    \n整个系统只有少数几项绝对的规定，这些规定往往也不一定和目标必须直接相关，很多时候只是一些操作习惯的基本规则（一些生活方式也可以）。\n\n这几项绝对规定的道理也很简单：你们目标我知道了，但是你们之间要想融合目标，那么大家就必须要有一些共同语言和共同标准，否则大家和外界怎么搞“敌我识别”呢？而且没有这样的“执行过程中的共同路径”，那么大家之间的熟悉程度也就太低了，交易成本就要提高。\n\
    \n所以从本质上来说，OKR 系统凝聚人的方法是“降低同类独立组织间的交易成本（不是邦联那样的白纸黑字开大会模式，而是不断各自探索如何降低成本，约定俗成）”——其实其他管理方式原则上也是一样降低交易成本，方法不同而已。\n\
    \nKPI 是等级之间有交易成本补贴（报销销量和话费差不多的意思），BSC 是让大家陷入同层之间的囚徒困境但上下之间必须合作。\n\nOKR 这样的特点大家一眼就能看出来。\n\
    \n- 1: 这样的管理模式，各个组织之间对于“适应宽度”的提升很大，很能对抗环境的超级出乎意料地变化，在很恶劣的情况下也能繁殖或者守住最基本的盘。\n-\
    \ 2: 组织管理的数据经验类型最多，但是整合较为困难，需要巨大的信息记录/综合与检索机构，这样才比较方便总结归类。\n- 3: 组织结构较为松散，在大多数时候整合度都不太高，大组织之间的交易成本还是偏高。在竞争系统成熟+稳定的环境中效率比\
    \ KPI 低——难以发动快速的，准确的，一体化的，全面动员的对外攻防和防御行动（本质上 OKR 是以守为攻的系统，尽管看上去有时它的行为会很激进——但是那都是局部行为，是项目组行为）。\n\
    - 4: 传承性在信息处理能力相当的情况下，高于 BSC，低于 KPI。\n- 5: 更新后恢复发展的速度，也是高于 BSC，低于 KPI。\n- 6: 旧有的不同的细节管理模式的残留较多，容易造成较多而且较久且可能有时比较隐蔽的内部矛盾——管理交易成本的效率高成本低，但是波动较大（相对放任）。\n\
    \n最后，我有一个思路。\n\n在企业界的一个分类内，看上去有这样一现象。\n\n这三种管理系统的流行是循环的（在同一个行业大类里面，互为竞争者的时候）。\n\
    \nBSC 唱罢 KPI 登场，KPI 唱罢 OKR 流行。\n\n道理非常简单。\n\nBSC 唱起来了，KPI 自然能知道 BSC 的套路，自己有经验+了解经营链条后，直接上\
    \ KPI。\n\nKPI 直接用生产效率和有序性击溃 BSC。\n\nKPI 渠限越来越高的时候，环境变化会堆积，超过 KPI 的渠限。\n\n此时 BSC\
    \ 往往还没有很大的优势，因为 KPI 的既有系统依然强大，BSC 初期建立过程中大多数人还是 KPI 考核的，没有竞争优势。\n\n但是 OKR 此时占据了更多\
    \ KPI 系统无法得到的新兴市场，普及率很大，在产品线上有优势，设计响应的也更快，产品可以贵又好——在取得了份额优势后，就能用更高的研发成本和更低的市场推广成本，更高的市场人员激励（利润没有用来补贴内部交易成本，市场拓展人员得到了更多提成点）。\n\
    \n当然了，BSC 和 OKR 是相对比较新的企业管理理念（尽管 BSC 也有几十年历史了），所以严格定义下的 KPI，BSC，OKR 循环还没有完整的出现过——但是严格定义归严格定义，尝试和流行是早就有了的，而且一直都在用，只不过现在\
    \ BSC 和 OKR 已经有了“线装本”了而已。\n\nOKR 喝罢，BSC 为什么又登场了呢？\n\n原因很简单：OKR 发展速度很快，很容易就超出高度综合的管理范围，此时大量的资源和知识都会外流，外沿的“市场控制者”也会开始寻求新的外部交易伙伴。\n\
    \n此时 KPI 已经必须重整（被 OKR 挤压市场以后，大量 KPI 系统需要转换），BSC 能更快速的拉拢这些外流的人员，让其为自己服务或成为自身贵族的盟友。\n\
    \nOKR 此时内部的交易成本和不信任感会被 BSC 组织的行为迅速抬高，BSC 系统就能获得更多的资源和知识。\n\nOKR 需要创新的时候，内部组织之间通过压低交易成本的潜力，完成分散但高效的合作，相当于分布式办公。\n\
    \n但是这样就特别怕 BSC 利用“直接掠夺手下的资源（哪怕是廉价的）”，给付给那些己方分布式办公的小而重要的组织。\n\n所以这时，OKR 的“创新成本”会首先被拉高——核心优势遭到持续蚕食。\n\
    \n市场适应，产品设计，信息合作的优势，这些都会被 BSC 组织给捣毁了——他们又没有 KPI 优势，初期是压不住 BSC 的。如果等 BSC 过了草创时期，集中资源又能招摹\
    \ OKR 的分散团队，对 OKR 的破坏远超 BSC 付出的成本（而且越破坏好处越多），OKR 被各个击破。\n\n不过……我们如果仔细想一下的话，大家就不难发现一个可能性。\n\
    \n企业里之所以以三大类循环，是因为企业之间的控制区域相对很窄，只是很小一块。因此企业之间是不可能在整体组织上“你死我活”的。\n\n而且因为分工窄，所以新进入者可以从四面八方进来，因此不可能也没办法阻挡“最合适”的竞争者。\n\
    \n但是……如果是国家或者文明呢？\n\n首先它宽度足够大，其次它经常是你死我活的。\n\n所以……OKR 和 KPI 本身就是“混乱创新”和“有序组合”的互补，所以实际上是可以形成“双寡头”循环的。\n\
    \nBSC 其实是“夹在中间，不上不下”的那个。\n\n在你死我活，可以“一次灭杀”的情况下，BSC 其实并没有存在的必然性——如果 OKR 一时间打败 KPI，那么\
    \ KPI 多学习一会儿，KPI 直接就可以打败 OKR；反过来也是一样。\n\n因为他们两个各自在“两极”上都占据优势。\n\nKPI 掐 BSC 的头，OKR\
    \ 杀 BSC 的尾，BSC 里外不是人（BSC 的公司也特别怕复杂竞争环境，所以 BSC 公司总是更加“扎堆”出现）。\n\n当然，这只是一个假设。\n\n\
    原因很简单：OKR 的核心区域和 KPI 区域历史上并没有直接打照面，原来的投送成本太高了，最多只能是远距离低效率贸易往来。\n\nOKR 在上一次超大循环中占据了优势，后来因为\
    \ BSC 系统的多局部发展而被快速蚕食。KPI 系统也占据了优势，但是自己碰不到 BSC 系统的核心。\n\n然后 BSC 系统在中间期有一个最好的整合+创新（本系统内）的时间窗口，爆发了工业革命，打开了投送渠道。\n\
    \nBSC 成功后，第一选择是把 OKR 和 KPI 都打了一顿，但是因为技术条件和内部社会管理的效率问题，都没把两个给打死（就算把国家打掉了，OKR 和\
    \ KPI 依然能占据局部优势，所以“他们在西方意义的主权国家概念里被消灭以后”其文明残余系统也大概率可以反杀……哦对了，“主权国家”概念本身就非常的具有\
    \ BSC 特色——国家级贵族认证）。\n\n但是现在，BSC 的那套时间窗口中的东西,KPI 已经基本学会，OKR 也找到了抗蚕食的阶段性对策。\n\n\
    OKR 系统吃透 BSC 的很大原因，也是 BSC 自己的贵族体系为了维护自己的利益所以大规模加以制裁——本来 OKR 最怕的就是 BSC 系统的各个击破式拉拢渗透，但是现在\
    \ BSC 自己把渠道关上了。\n\n当然，这也有 OKR 系统的努力——OKR 中的一部分小但最走核心标准的组织对 BSC 发动了一系列的攻击，BSC 的贵族系统因此发现了给其它贵族设卡的机会，于是更方便的利用民意来主动关团对\
    \ OKR 系统的各个击破，打击自己内部的竞争对手。\n\n这些击破行动对于 BSC 系统中的一部分贵族很有利，但是 OKR 系统袭击的是平民，而 BSC\
    \ 系统为了清理落魄贵族的方式为一人一票，所以封锁 OKR 在一人一票系统中占据上风——OKR 等于是拉拢对方的内卷势力，让内卷势力限制对手的对外获利和攻击集群。\n\
    \n这里需要注意的是：OKR 系统中发现这样可以“限制对手，凝聚己方”的策略并不是“自上而下，一同计划”。\n\n它是：不同的一撮撮人发现了这个办法，发现自己力所能及，投资这个可以在后续的凝聚过程中掌握很多“公司资源”——它们自己执行了这个项目，利用阶段性成果“招商引资”“说服同事”。\n\
    \n其他的同僚在察觉有效的情况下，为了占据“预期中的凝聚中和凝聚后的地位”，就也会纷纷展开合作——甚至原来的敌对者也有可能（至少会削减打击力度）。\n\n\
    因此……OKR 系统中即便是亲 BSC 的组织，也是在暗中支持袭击者 OKR 的，因为这些 OKR 的分组织也明白：这样做才有最大的好处，而且我甚至可以利用和\
    \ BSC 封锁系统和 BSC 内部的依然交易的系统之间的矛盾，完成我对他们整体的“交易途径垄断”。\n\n因为斗争中，只有我还算是“可以凑合”的对象了（沙特）。\n\
    \n这样一个模式中，OKR 不是“神授君权”，但也不是“君授神权”。\n\n人家是“我们要展开一场永久性的神到底说了啥的大讨论，谁讨论的牛逼和谁更能创造既成事实，谁就是老大，谁不接受现在最好的讨论成果就分家”。\n\
    \n他们普及的时候主要的障碍来自于对方的一个问题：“我说，你们到底在说啥？你们昨天来的人怎么和你说的不一样啊？我到底听哪个的……要不你们先打一架，谁赢我听谁的？”\n\
    \n题外话一小段：大家其实可以想一想。\n\n按照这些社会各自的演化模式……\n\n这些社会的基本层对于“演化论”本身的态度会怎样？\n\n很显然 BSC\
    \ 更难接受演化论，因为“神”这个东西是他们“减少对基层管理成本”的一个固定套路，它和很多“实用的”管理系统是挂钩的——因为一直在用这个办法，所以这个办法实际上时带有一个“渠眼”的，所以在限制内演化了很久，强化程度很高。如果新建立一个系统的成本太高，都不知道啥时候能用。\n\
    \n所以他们即便先发现了演化，他们也很难在教育中全面普及（当然也没必要）。\n\n而 KPI 系统最需要的就是更好的演化，特别是中层和高层都特别需要，因此非常容易普及演化论。同时中国的古典神仙，本质上是“父母与家长长”，那些凶神恶煞只是家长手中的教育工具而已（和戒尺差不多），所以这也算是一种“朴素的演化观”——而且我们也不是很强调人类凌驾一切，不急于做出区分（干啥啊？主动设立无用\
    \ KPI 给自己找罪受？）。\n\n所以 KPI 社会系统特别能接收演化论，大家直觉上就觉得“嗯，没啥不可能的，虽然猴子变人一开始听起来有点怪怪的。反正又不是什么大逆不道的东西，听起来蛮有趣的，你跟我们讲讲？”\n\
    \nOKR 系统他就不在乎演化论，学术归学术，实用归实用，说辞归说辞。大家觉得能用了自己用，搞出成果以后来总结下经验就给你多打广告宣传。\n\n这三个体系在“企业扩张”时，分别有其独特的普及方式和普及困难，成本方向各不同。\n\
    \n- 1: BSC 必须一次侵占足够多的地方，靠掠夺外沿来补贴内沿——如果不能快速扩大份额，就不能把新拿到的地方转化为自己人。也就是：抢到 3 块新地，必须靠掠夺\
    \ 2 块补贴一块，才能让一块地稳定下来（如果停止扩张，他们原有的地块就会内裂，所以即使 BSC 能够完美避免内部问题，理论上面对同级竞争对手，依然需要“低成本到达的无限市场”才能维持特色优势）。\n\
    \  好处是：老板管理不费事，BSC 管理层的人在有低成本市场的时候都能一门心思工作，积极性高，生产数据乐于上报（融资与合作需要）。\n  BSC 的扩张核心：寻找蓝海市场，设立竞品进入门槛的机动游戏队伍（所以他们特别喜欢玩弄文明规则和逻辑游戏，搞颠覆——蓝海公司颠覆式创新也是颠覆，BSC\
    \ 文明颠覆……）。\n  文化总是不断地重复兴衰，所有人对于兴衰虽然不能完全理解，但是一定会有文化表达。BSC 的“神授君权”下，这样模式在扩张不得不停滞（各种原因）的表达是什么呢？\n\
    \  当然是神罚文化——审判文化与方舟文化（大家去死，贵族带着家产逃难，鸡鸭鹅狗猫都比老百姓重要）。\n\n- 2: KPI 必须强调建设和教化，扩张时要投入较高的前期成本——资源和资金成本不算太高，因为生产效率上去了，赚多赚少的问题。但是开发一块地上的人时间成本很高，所以一个朝代一般只能扩大一两圈，毕竟要形成稳定的可继承的教化群体，至少需要\
    \ 3 代人。\n  而且 KPI 随着组织扩大，需要教化的内容也会增大——而且这还与 KPI 标准的“冗杂”部分的多少有关。冗杂部份越多，开发新地块的前期收益越低，额外教化时间越多。\n\
    \  好处是这些扩展的地区会保留 KPI 传统，大家都很熟悉而且有体系信任度，团队比较容易融入到同类 KPI 标准的新公司中去，而且快速发挥极大的生产与管理协同的效率优势，而且旧老板死了，新老板去掉冗杂部份特别能够提升员工幸福度（不切实际的业绩提升率要求被取消，不达标惩罚转为达标奖励，年终奖考核更加人性化）。\n\
    \  KPI 的扩张核心：长期投入的深度市场教育，培养忠诚的市场总监与经理队伍，内部由大客户经理集群稳定红海市场中的份额。\n  它也会产生自己的末日文化，这个末日是“苍天有眼”，“规律重整”文化。如果在呼唤“人定胜天”失败后，大家就呼唤圣贤来解决问题。但是圣贤不是很容易找到的，不是谁说一两句话就行的，不试试看就知道自己是不是奉天承运的。\n\
    \  于是中国的末日文化就是“王侯将相宁有种乎”。\n  简单来说意思就是：上上我也行，同行衬托得好，不就是设个 KPI 么！俺没吃过猪肉也见过猪跑，我只要设置好\
    \ KPI，大家就都跟着我！存地失人，人地皆失；存人失地，人地结存！鸡鸭鹅狗猫都可以先不要，我要老（打）百（工）姓（仔）！严格来说：KPI 系统没有末日文化，只有“咱跪槽吧？”文化，但是很有深度。\n\
    \n- 3: OKR 必须选出一个内部的核心传道者，但是他们选出这个传道者的成本特别高，维持时间短——就好像南斯拉夫分散族群集合起来是因为铁托的号召力，但是铁托不是随时能出来的（OKR\
    \ 系统就是永久性的南斯拉夫）。\n  因此 OKR 的扩张特别讲究时机，不容易协调硬实力和软实力，因为硬实力强的时候往往内部项目组事情多，软实力影响能力有限。软实力强的时候，往往处于外部压力状态，这个时候硬实力往往不强。\n\
    \  所以 OKR 的扩张必须要“天时地利人和”，其余时候都是守势，但是如果三者齐备，由于组织管理层扩张的管理成本增幅较小（相对于管理人员的增加来看），所以一次能扩的非常多而且能快速扎根稳定——关键是还能吃“飞地”这个是比较少见的情况，大多数时候\
    \ OKR 系统擅长深挖“二级市场与开拓新需求”与“各种长尾市场”——特别是在他们“比上不足比下有余，但已经开始一条心的情况下”。\n  OKR 的扩张核心：多元广告战与加盟店的店长指导团队，寻找或大或小的新绿洲。\n\
    \  OKR 是没有 BSC 和 KPI 系统那样特别明确和深度的“末日文化”的。他们在面对巨大压力的时候，他们都会说“神”给我们一大群各级组织“传授秘籍”，大家都说自己要试试看。\n\
    \  所以 OKR 系统的末日文化是“游戏后台说要给你作弊码”，是“开挂救世”。\n  鸡鸭鹅狗猫和老百姓我看着她先救啥！到时候吃饱喝足大家一起开挂，弄死他妈的龟孙（但是在他们天时地利人和齐备，强势扩张的时候，他们对被占土地上的原住民又是最仁慈的。要求比\
    \ KPI 系统自由，毕竟他们的核心指标考核少，进贡就行啦。BSC 么……基本就是强盗和奴隶贩子……）。\n\n但是无论如何，一旦 OKR 和 KPI 彻底核心接头了以后，无论胜负如何轮转。\n\
    \n国家级 BSC 系统都很可能会彻底成为历史，或者边缘化——因为地球就这么大。\n\n到了那个时候，人类也就真正的结束了大型组织内部一刀切式区分贵族和平民集团的封建时代——西方文明在地球文明圏永久落幕，走向边缘化，直到星际大航海时代才有可能复苏。\n\
    \n很多人问过我一个问题。\n\n我，我们，会怎么死？\n\n我现在想到了回答。\n\n**“我们如何活着，我们就会如何死去。”**\n\n成也萧何，败也萧何\n\
    \n也许，衰老死亡本身也是一种“渠限”——它的作用和上文所说的“渠限”，是本质相同的。\n\n世上确实有永生不死的动物，最古老的动物大概率也是永生不死的。\n\
    \n但是后来绝大多数动物，都放弃了这一条件。\n\n为了更强悍的演化器官，自然规律让大多数动植物舍弃了“永生不死”（不再作为优势，因为要保持永生不死，那就会造成巨大的渠限，每个器官分化中都必须让细胞永远更新，但又不癌变）。\n\
    \n绝大多数动物，包括人类，都不同程度的选择了“有限的时间内”更快的复制自己，占据更多的位置的策略。\n\n我们会死，不是因为我们不能永生——而是因为我们想赢。不赢，就会被其它动物占据位置或者吃掉！为了活下去，放弃永生，给予孙万代创造更多机会！\n\
    \n个体，组织，国家，一切的“规章与套路，真理与箴言”，它们皆是流星过客。\n\n唯有文明，星火传递。\n\n后记补充\n\n对了……我想了下实际情况啊——下面内容有点脏，我随便说的。\n\
    \nKPI 这样的科学管理系统虽然目的是按功分配，然而因为需要统一标准，在面对大多数人员的时候，它为了维持公平的感觉执行的是按劳分配。\n\n而对于最关键的“维护整个系统依然存在”的过程中，由于管理成本不能无限提高，所以不能“完全监督”，它是需要一种“统一的基础服务和规矩”的——因为理论上就不可能完全干涉到（否则全社会就没有自主演化激励了，成本也吃不消），所以\
    \ KPI 系统必然对于大多数基层人来说，它都有“大锅饭”倾向，尽管吃这个大锅饭也挺累的。\n\n所以呢？\n\nKPI 运行的根基，或者说操作中永远会产生一个“背景”，它是“按需分配”的。就算物质没有极大化的时候也是在基本层面上用“按需分配”来达到稳定组织的目的。\n\
    \n按功分配和按劳分配是 KPI 的追求，但并不是它的“基本面”。\n\n所以……KPI 模式自带两个字主义属性，所有最终制定 KPI 的人，本质上是两个字主义的实践者（即便他们嗤之以鼻）。\n\
    \nBSC 的话，实际上并不适合资本主义，它最合适的是贵族买办系统。因为整个社会的决策层必然会在“基本可交易的权力单位”上，比如说“一块一块钱”上有越来越大的“单一特权”干涉空间。\n\
    \n所以在 BSC 系统里，最终大多数人的权力和权力单元都会被控制——终产者就会出现。当然，以前的 BSC 贵族到底没那么强，他们进化也一直狭窄，所以大概不可能形成“终产者”，因为老百姓加起来还是比他们聪明。\n\
    \n虽然终产者也许不会出现，但是资本主义经济危机可能爆发。终产者的出现主要不是因为资本主义本身的问题，而是因为一套贵族制系统再越来越独断专行的掠夺市场。\n\
    \n贵族才是终产者，资本家并不是，只是这个贵族披上了资本的外皮而已，而且还是抢过来的。\n\n抢劫无法永久持续，系统没有足够多的余量可以填充贵族，所以才会出现终产者。\n\
    \n原因很简单：因为渠假设立本质上是基于“上下”——分成了两个决策升级系统（变成了两个物种，演化路线都不一样了），KPI 虽然也等级森严，但是它要求的是“一个决策演化升级系统，分开演化就是违反，大家都为更好的\
    \ KPI 付出演化成本”。\n\n也就是说：KPI 的核心是“大家养小家，虽然家长蛮凶的，而且越来越多”，BSC 的核心是“大家养小家，一开始家长多了还能服务，后来家长自己死的太多了，最后剩下神经病一样的疯子爷爷，这家没法呆了”。\n\
    \nOKR……大家想一下。\n\n这样的组织，不是恰好适合资本主义么？\n\n因为并没有一个绝对的“家长”，内部也没有全局性的“上下贵族”，不是二分法而是一群“实际利益组成的集群”。\n\
    \n在这样的系统中，绝大多数时刻都需要一种“通用一般权力等价物”进行交易，能够最大程度的影响内部权力构成——当然完全没有特权机关不可能，因为军队肯定是要的，不然要被打死。\n\
    \n所以……人家 OKR 才是真的适合“资本主义”的，虽然他们现在还披着“神权”的外衣——问题是，如果神权机构并不是一家独大，一伙人完全控制会怎样？\n\n\
    对吧？神权作为管理文化基础和资本主义并不绝对冲突啊！（有神而神无权）\n"
  mdcn: "\n会觉得“为什么他们anja日子不过呢？我们帮他们把领导变成神仙有什么不对的，我们这样要求有错吗？怎么都救不会的呢？”\n\n略微说一下啊 OKR\
    \ 系统（目标和关键成果考核）。\n\n简单来说，OKR 系统是“纯平衡非考核系统”，也就是重团队管理轻指标考核。\n\n此时核心目标和绝大多数利益团体目标被要求公开展示，非公开展示会被认为是恶劣和危险的行为。\n\
    \n整个系统只有少数几项绝对的规定，这些规定往往也不一定和目标必须直接相关，很多时候只是一些操作习惯的基本规则（一些生活方式也可以）。\n\n这几项绝对规定的道理也很简单：你们目标我知道了，但是你们之间要想融合目标，那么大家就必须要有一些共同语言和共同标准，否则大家和外界怎么搞“敌我识别”呢？而且没有这样的“执行过程中的共同路径”，那么大家之间的熟悉程度也就太低了，交易成本就要提高。\n\
    \n所以从本质上来说，OKR 系统凝聚人的方法是“降低同类独立组织间的交易成本（不是邦联那样的白纸黑字开大会模式，而是不断各自探索如何降低成本，约定俗成）”——其实其他管理方式原则上也是一样降低交易成本，方法不同而已。\n\
    \nKPI 是等级之间有交易成本补贴（报销销量和话费差不多的意思），BSC 是让大家陷入同层之间的囚徒困境但上下之间必须合作。\n\nOKR 这样的特点大家一眼就能看出来。\n\
    \n- 1: 这样的管理模式，各个组织之间对于“适应宽度”的提升很大，很能对抗环境的超级出乎意料地变化，在很恶劣的情况下也能繁殖或者守住最基本的盘。\n-\
    \ 2: 组织管理的数据经验类型最多，但是整合较为困难，需要巨大的信息记录/综合与检索机构，这样才比较方便总结归类。\n- 3: 组织结构较为松散，在大多数时候整合度都不太高，大组织之间的交易成本还是偏高。在竞争系统成熟+稳定的环境中效率比\
    \ KPI 低——难以发动快速的，准确的，一体化的，全面动员的对外攻防和防御行动（本质上 OKR 是以守为攻的系统，尽管看上去有时它的行为会很激进——但是那都是局部行为，是项目组行为）。\n\
    - 4: 传承性在信息处理能力相当的情况下，高于 BSC，低于 KPI。\n- 5: 更新后恢复发展的速度，也是高于 BSC，低于 KPI。\n- 6: 旧有的不同的细节管理模式的残留较多，容易造成较多而且较久且可能有时比较隐蔽的内部矛盾——管理交易成本的效率高成本低，但是波动较大（相对放任）。\n\
    \n最后，我有一个思路。\n\n在企业界的一个分类内，看上去有这样一现象。\n\n这三种管理系统的流行是循环的（在同一个行业大类里面，互为竞争者的时候）。\n\
    \nBSC 唱罢 KPI 登场，KPI 唱罢 OKR 流行。\n\n道理非常简单。\n\nBSC 唱起来了，KPI 自然能知道 BSC 的套路，自己有经验+了解经营链条后，直接上\
    \ KPI。\n\nKPI 直接用生产效率和有序性击溃 BSC。\n\nKPI 渠限越来越高的时候，环境变化会堆积，超过 KPI 的渠限。\n\n此时 BSC\
    \ 往往还没有很大的优势，因为 KPI 的既有系统依然强大，BSC 初期建立过程中大多数人还是 KPI 考核的，没有竞争优势。\n\n但是 OKR 此时占据了更多\
    \ KPI 系统无法得到的新兴市场，普及率很大，在产品线上有优势，设计响应的也更快，产品可以贵又好——在取得了份额优势后，就能用更高的研发成本和更低的市场推广成本，更高的市场人员激励（利润没有用来补贴内部交易成本，市场拓展人员得到了更多提成点）。\n\
    \n当然了，BSC 和 OKR 是相对比较新的企业管理理念（尽管 BSC 也有几十年历史了），所以严格定义下的 KPI，BSC，OKR 循环还没有完整的出现过——但是严格定义归严格定义，尝试和流行是早就有了的，而且一直都在用，只不过现在\
    \ BSC 和 OKR 已经有了“线装本”了而已。\n\nOKR 喝罢，BSC 为什么又登场了呢？\n\n原因很简单：OKR 发展速度很快，很容易就超出高度综合的管理范围，此时大量的资源和知识都会外流，外沿的“市场控制者”也会开始寻求新的外部交易伙伴。\n\
    \n此时 KPI 已经必须重整（被 OKR 挤压市场以后，大量 KPI 系统需要转换），BSC 能更快速的拉拢这些外流的人员，让其为自己服务或成为自身贵族的盟友。\n\
    \nOKR 此时内部的交易成本和不信任感会被 BSC 组织的行为迅速抬高，BSC 系统就能获得更多的资源和知识。\n\nOKR 需要创新的时候，内部组织之间通过压低交易成本的潜力，完成分散但高效的合作，相当于分布式办公。\n\
    \n但是这样就特别怕 BSC 利用“直接掠夺手下的资源（哪怕是廉价的）”，给付给那些己方分布式办公的小而重要的组织。\n\n所以这时，OKR 的“创新成本”会首先被拉高——核心优势遭到持续蚕食。\n\
    \n市场适应，产品设计，信息合作的优势，这些都会被 BSC 组织给捣毁了——他们又没有 KPI 优势，初期是压不住 BSC 的。如果等 BSC 过了草创时期，集中资源又能招摹\
    \ OKR 的分散团队，对 OKR 的破坏远超 BSC 付出的成本（而且越破坏好处越多），OKR 被各个击破。\n\n不过……我们如果仔细想一下的话，大家就不难发现一个可能性。\n\
    \n企业里之所以以三大类循环，是因为企业之间的控制区域相对很窄，只是很小一块。因此企业之间是不可能在整体组织上“你死我活”的。\n\n而且因为分工窄，所以新进入者可以从四面八方进来，因此不可能也没办法阻挡“最合适”的竞争者。\n\
    \n但是……如果是国家或者文明呢？\n\n首先它宽度足够大，其次它经常是你死我活的。\n\n所以……OKR 和 KPI 本身就是“混乱创新”和“有序组合”的互补，所以实际上是可以形成“双寡头”循环的。\n\
    \nBSC 其实是“夹在中间，不上不下”的那个。\n\n在你死我活，可以“一次灭杀”的情况下，BSC 其实并没有存在的必然性——如果 OKR 一时间打败 KPI，那么\
    \ KPI 多学习一会儿，KPI 直接就可以打败 OKR；反过来也是一样。\n\n因为他们两个各自在“两极”上都占据优势。\n\nKPI 掐 BSC 的头，OKR\
    \ 杀 BSC 的尾，BSC 里外不是人（BSC 的公司也特别怕复杂竞争环境，所以 BSC 公司总是更加“扎堆”出现）。\n\n当然，这只是一个假设。\n\n\
    原因很简单：OKR 的核心区域和 KPI 区域历史上并没有直接打照面，原来的投送成本太高了，最多只能是远距离低效率贸易往来。\n\nOKR 在上一次超大循环中占据了优势，后来因为\
    \ BSC 系统的多局部发展而被快速蚕食。KPI 系统也占据了优势，但是自己碰不到 BSC 系统的核心。\n\n然后 BSC 系统在中间期有一个最好的整合+创新（本系统内）的时间窗口，爆发了工业革命，打开了投送渠道。\n\
    \nBSC 成功后，第一选择是把 OKR 和 KPI 都打了一顿，但是因为技术条件和内部社会管理的效率问题，都没把两个给打死（就算把国家打掉了，OKR 和\
    \ KPI 依然能占据局部优势，所以“他们在西方意义的主权国家概念里被消灭以后”其文明残余系统也大概率可以反杀……哦对了，“主权国家”概念本身就非常的具有\
    \ BSC 特色——国家级贵族认证）。\n\n但是现在，BSC 的那套时间窗口中的东西,KPI 已经基本学会，OKR 也找到了抗蚕食的阶段性对策。\n\n\
    OKR 系统吃透 BSC 的很大原因，也是 BSC 自己的贵族体系为了维护自己的利益所以大规模加以制裁——本来 OKR 最怕的就是 BSC 系统的各个击破式拉拢渗透，但是现在\
    \ BSC 自己把渠道关上了。\n\n当然，这也有 OKR 系统的努力——OKR 中的一部分小但最走核心标准的组织对 BSC 发动了一系列的攻击，BSC 的贵族系统因此发现了给其它贵族设卡的机会，于是更方便的利用民意来主动关团对\
    \ OKR 系统的各个击破，打击自己内部的竞争对手。\n\n这些击破行动对于 BSC 系统中的一部分贵族很有利，但是 OKR 系统袭击的是平民，而 BSC\
    \ 系统为了清理落魄贵族的方式为一人一票，所以封锁 OKR 在一人一票系统中占据上风——OKR 等于是拉拢对方的内卷势力，让内卷势力限制对手的对外获利和攻击集群。\n\
    \n这里需要注意的是：OKR 系统中发现这样可以“限制对手，凝聚己方”的策略并不是“自上而下，一同计划”。\n\n它是：不同的一撮撮人发现了这个办法，发现自己力所能及，投资这个可以在后续的凝聚过程中掌握很多“公司资源”——它们自己执行了这个项目，利用阶段性成果“招商引资”“说服同事”。\n\
    \n其他的同僚在察觉有效的情况下，为了占据“预期中的凝聚中和凝聚后的地位”，就也会纷纷展开合作——甚至原来的敌对者也有可能（至少会削减打击力度）。\n\n\
    因此……OKR 系统中即便是亲 BSC 的组织，也是在暗中支持袭击者 OKR 的，因为这些 OKR 的分组织也明白：这样做才有最大的好处，而且我甚至可以利用和\
    \ BSC 封锁系统和 BSC 内部的依然交易的系统之间的矛盾，完成我对他们整体的“交易途径垄断”。\n\n因为斗争中，只有我还算是“可以凑合”的对象了（沙特）。\n\
    \n这样一个模式中，OKR 不是“神授君权”，但也不是“君授神权”。\n\n人家是“我们要展开一场永久性的神到底说了啥的大讨论，谁讨论的牛逼和谁更能创造既成事实，谁就是老大，谁不接受现在最好的讨论成果就分家”。\n\
    \n他们普及的时候主要的障碍来自于对方的一个问题：“我说，你们到底在说啥？你们昨天来的人怎么和你说的不一样啊？我到底听哪个的……要不你们先打一架，谁赢我听谁的？”\n\
    \n题外话一小段：大家其实可以想一想。\n\n按照这些社会各自的演化模式……\n\n这些社会的基本层对于“演化论”本身的态度会怎样？\n\n很显然 BSC\
    \ 更难接受演化论，因为“神”这个东西是他们“减少对基层管理成本”的一个固定套路，它和很多“实用的”管理系统是挂钩的——因为一直在用这个办法，所以这个办法实际上时带有一个“渠眼”的，所以在限制内演化了很久，强化程度很高。如果新建立一个系统的成本太高，都不知道啥时候能用。\n\
    \n所以他们即便先发现了演化，他们也很难在教育中全面普及（当然也没必要）。\n\n而 KPI 系统最需要的就是更好的演化，特别是中层和高层都特别需要，因此非常容易普及演化论。同时中国的古典神仙，本质上是“父母与家长长”，那些凶神恶煞只是家长手中的教育工具而已（和戒尺差不多），所以这也算是一种“朴素的演化观”——而且我们也不是很强调人类凌驾一切，不急于做出区分（干啥啊？主动设立无用\
    \ KPI 给自己找罪受？）。\n\n所以 KPI 社会系统特别能接收演化论，大家直觉上就觉得“嗯，没啥不可能的，虽然猴子变人一开始听起来有点怪怪的。反正又不是什么大逆不道的东西，听起来蛮有趣的，你跟我们讲讲？”\n\
    \nOKR 系统他就不在乎演化论，学术归学术，实用归实用，说辞归说辞。大家觉得能用了自己用，搞出成果以后来总结下经验就给你多打广告宣传。\n\n这三个体系在“企业扩张”时，分别有其独特的普及方式和普及困难，成本方向各不同。\n\
    \n- 1: BSC 必须一次侵占足够多的地方，靠掠夺外沿来补贴内沿——如果不能快速扩大份额，就不能把新拿到的地方转化为自己人。也就是：抢到 3 块新地，必须靠掠夺\
    \ 2 块补贴一块，才能让一块地稳定下来（如果停止扩张，他们原有的地块就会内裂，所以即使 BSC 能够完美避免内部问题，理论上面对同级竞争对手，依然需要“低成本到达的无限市场”才能维持特色优势）。\n\
    \  好处是：老板管理不费事，BSC 管理层的人在有低成本市场的时候都能一门心思工作，积极性高，生产数据乐于上报（融资与合作需要）。\n  BSC 的扩张核心：寻找蓝海市场，设立竞品进入门槛的机动游戏队伍（所以他们特别喜欢玩弄文明规则和逻辑游戏，搞颠覆——蓝海公司颠覆式创新也是颠覆，BSC\
    \ 文明颠覆……）。\n  文化总是不断地重复兴衰，所有人对于兴衰虽然不能完全理解，但是一定会有文化表达。BSC 的“神授君权”下，这样模式在扩张不得不停滞（各种原因）的表达是什么呢？\n\
    \  当然是神罚文化——审判文化与方舟文化（大家去死，贵族带着家产逃难，鸡鸭鹅狗猫都比老百姓重要）。\n\n- 2: KPI 必须强调建设和教化，扩张时要投入较高的前期成本——资源和资金成本不算太高，因为生产效率上去了，赚多赚少的问题。但是开发一块地上的人时间成本很高，所以一个朝代一般只能扩大一两圈，毕竟要形成稳定的可继承的教化群体，至少需要\
    \ 3 代人。\n  而且 KPI 随着组织扩大，需要教化的内容也会增大——而且这还与 KPI 标准的“冗杂”部分的多少有关。冗杂部份越多，开发新地块的前期收益越低，额外教化时间越多。\n\
    \  好处是这些扩展的地区会保留 KPI 传统，大家都很熟悉而且有体系信任度，团队比较容易融入到同类 KPI 标准的新公司中去，而且快速发挥极大的生产与管理协同的效率优势，而且旧老板死了，新老板去掉冗杂部份特别能够提升员工幸福度（不切实际的业绩提升率要求被取消，不达标惩罚转为达标奖励，年终奖考核更加人性化）。\n\
    \  KPI 的扩张核心：长期投入的深度市场教育，培养忠诚的市场总监与经理队伍，内部由大客户经理集群稳定红海市场中的份额。\n  它也会产生自己的末日文化，这个末日是“苍天有眼”，“规律重整”文化。如果在呼唤“人定胜天”失败后，大家就呼唤圣贤来解决问题。但是圣贤不是很容易找到的，不是谁说一两句话就行的，不试试看就知道自己是不是奉天承运的。\n\
    \  于是中国的末日文化就是“王侯将相宁有种乎”。\n  简单来说意思就是：上上我也行，同行衬托得好，不就是设个 KPI 么！俺没吃过猪肉也见过猪跑，我只要设置好\
    \ KPI，大家就都跟着我！存地失人，人地皆失；存人失地，人地结存！鸡鸭鹅狗猫都可以先不要，我要老（打）百（工）姓（仔）！严格来说：KPI 系统没有末日文化，只有“咱跪槽吧？”文化，但是很有深度。\n\
    \n- 3: OKR 必须选出一个内部的核心传道者，但是他们选出这个传道者的成本特别高，维持时间短——就好像南斯拉夫分散族群集合起来是因为铁托的号召力，但是铁托不是随时能出来的（OKR\
    \ 系统就是永久性的南斯拉夫）。\n  因此 OKR 的扩张特别讲究时机，不容易协调硬实力和软实力，因为硬实力强的时候往往内部项目组事情多，软实力影响能力有限。软实力强的时候，往往处于外部压力状态，这个时候硬实力往往不强。\n\
    \  所以 OKR 的扩张必须要“天时地利人和”，其余时候都是守势，但是如果三者齐备，由于组织管理层扩张的管理成本增幅较小（相对于管理人员的增加来看），所以一次能扩的非常多而且能快速扎根稳定——关键是还能吃“飞地”这个是比较少见的情况，大多数时候\
    \ OKR 系统擅长深挖“二级市场与开拓新需求”与“各种长尾市场”——特别是在他们“比上不足比下有余，但已经开始一条心的情况下”。\n  OKR 的扩张核心：多元广告战与加盟店的店长指导团队，寻找或大或小的新绿洲。\n\
    \  OKR 是没有 BSC 和 KPI 系统那样特别明确和深度的“末日文化”的。他们在面对巨大压力的时候，他们都会说“神”给我们一大群各级组织“传授秘籍”，大家都说自己要试试看。\n\
    \  所以 OKR 系统的末日文化是“游戏后台说要给你作弊码”，是“开挂救世”。\n  鸡鸭鹅狗猫和老百姓我看着她先救啥！到时候吃饱喝足大家一起开挂，弄死他妈的龟孙（但是在他们天时地利人和齐备，强势扩张的时候，他们对被占土地上的原住民又是最仁慈的。要求比\
    \ KPI 系统自由，毕竟他们的核心指标考核少，进贡就行啦。BSC 么……基本就是强盗和奴隶贩子……）。\n\n但是无论如何，一旦 OKR 和 KPI 彻底核心接头了以后，无论胜负如何轮转。\n\
    \n国家级 BSC 系统都很可能会彻底成为历史，或者边缘化——因为地球就这么大。\n\n到了那个时候，人类也就真正的结束了大型组织内部一刀切式区分贵族和平民集团的封建时代——西方文明在地球文明圏永久落幕，走向边缘化，直到星际大航海时代才有可能复苏。\n\
    \n很多人问过我一个问题。\n\n我，我们，会怎么死？\n\n我现在想到了回答。\n\n**“我们如何活着，我们就会如何死去。”**\n\n成也萧何，败也萧何\n\
    \n也许，衰老死亡本身也是一种“渠限”——它的作用和上文所说的“渠限”，是本质相同的。\n\n世上确实有永生不死的动物，最古老的动物大概率也是永生不死的。\n\
    \n但是后来绝大多数动物，都放弃了这一条件。\n\n为了更强悍的演化器官，自然规律让大多数动植物舍弃了“永生不死”（不再作为优势，因为要保持永生不死，那就会造成巨大的渠限，每个器官分化中都必须让细胞永远更新，但又不癌变）。\n\
    \n绝大多数动物，包括人类，都不同程度的选择了“有限的时间内”更快的复制自己，占据更多的位置的策略。\n\n我们会死，不是因为我们不能永生——而是因为我们想赢。不赢，就会被其它动物占据位置或者吃掉！为了活下去，放弃永生，给予孙万代创造更多机会！\n\
    \n个体，组织，国家，一切的“规章与套路，真理与箴言”，它们皆是流星过客。\n\n唯有文明，星火传递。\n\n后记补充\n\n对了……我想了下实际情况啊——下面内容有点脏，我随便说的。\n\
    \nKPI 这样的科学管理系统虽然目的是按功分配，然而因为需要统一标准，在面对大多数人员的时候，它为了维持公平的感觉执行的是按劳分配。\n\n而对于最关键的“维护整个系统依然存在”的过程中，由于管理成本不能无限提高，所以不能“完全监督”，它是需要一种“统一的基础服务和规矩”的——因为理论上就不可能完全干涉到（否则全社会就没有自主演化激励了，成本也吃不消），所以\
    \ KPI 系统必然对于大多数基层人来说，它都有“大锅饭”倾向，尽管吃这个大锅饭也挺累的。\n\n所以呢？\n\nKPI 运行的根基，或者说操作中永远会产生一个“背景”，它是“按需分配”的。就算物质没有极大化的时候也是在基本层面上用“按需分配”来达到稳定组织的目的。\n\
    \n按功分配和按劳分配是 KPI 的追求，但并不是它的“基本面”。\n\n所以……KPI 模式自带两个字主义属性，所有最终制定 KPI 的人，本质上是两个字主义的实践者（即便他们嗤之以鼻）。\n\
    \nBSC 的话，实际上并不适合资本主义，它最合适的是贵族买办系统。因为整个社会的决策层必然会在“基本可交易的权力单位”上，比如说“一块一块钱”上有越来越大的“单一特权”干涉空间。\n\
    \n所以在 BSC 系统里，最终大多数人的权力和权力单元都会被控制——终产者就会出现。当然，以前的 BSC 贵族到底没那么强，他们进化也一直狭窄，所以大概不可能形成“终产者”，因为老百姓加起来还是比他们聪明。\n\
    \n虽然终产者也许不会出现，但是资本主义经济危机可能爆发。终产者的出现主要不是因为资本主义本身的问题，而是因为一套贵族制系统再越来越独断专行的掠夺市场。\n\
    \n贵族才是终产者，资本家并不是，只是这个贵族披上了资本的外皮而已，而且还是抢过来的。\n\n抢劫无法永久持续，系统没有足够多的余量可以填充贵族，所以才会出现终产者。\n\
    \n原因很简单：因为渠假设立本质上是基于“上下”——分成了两个决策升级系统（变成了两个物种，演化路线都不一样了），KPI 虽然也等级森严，但是它要求的是“一个决策演化升级系统，分开演化就是违反，大家都为更好的\
    \ KPI 付出演化成本”。\n\n也就是说：KPI 的核心是“大家养小家，虽然家长蛮凶的，而且越来越多”，BSC 的核心是“大家养小家，一开始家长多了还能服务，后来家长自己死的太多了，最后剩下神经病一样的疯子爷爷，这家没法呆了”。\n\
    \nOKR……大家想一下。\n\n这样的组织，不是恰好适合资本主义么？\n\n因为并没有一个绝对的“家长”，内部也没有全局性的“上下贵族”，不是二分法而是一群“实际利益组成的集群”。\n\
    \n在这样的系统中，绝大多数时刻都需要一种“通用一般权力等价物”进行交易，能够最大程度的影响内部权力构成——当然完全没有特权机关不可能，因为军队肯定是要的，不然要被打死。\n\
    \n所以……人家 OKR 才是真的适合“资本主义”的，虽然他们现在还披着“神权”的外衣——问题是，如果神权机构并不是一家独大，一伙人完全控制会怎样？\n\n\
    对吧？神权作为管理文化基础和资本主义并不绝对冲突啊！（有神而神无权）\n"
