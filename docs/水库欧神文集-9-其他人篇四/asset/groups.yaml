    为什么欧神可以叫坦克？因为他在自己的渠限内做到了极大的演化深度，成为了高效物种，食物链等级高。


    只要“超大型社会组织生产整合链条”存在，欧神就能拿炮因子轰，因为这些系统也是需要这个链条才能发挥作用的。


