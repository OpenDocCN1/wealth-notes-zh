    归根结底，就是人类的经验和各种记忆是无法生理遗传的，而任何通过教育等方式 进行复制的行为都有极大的偏差，效果是极为不稳定的（可以理解成：遗传时突变太多了）。


    所以，为了“保底”，就必须把经验和其他成果转化为能更可靠进行传递的东西。


    这是很合理的:如果我们遗传记忆和经验，我们一直使用更接近“最佳风险收益 比”的选项才是最合理的——我们担心“死亡”，演化出“有限生命内不断权衡获取最大变现
    成果”的一系列心理特征和文化特征，肯定是因为我们在传递过程中会额外损失掉什么优势。


