    当然了，BSC 和 OKR 是相对比较新的企业管理理念（尽管 BSC 也有几十年历史了），所以严格定义下的 KPI，BSC，OKR 循环还没有完整的出现过——但是严格定义归严格定义，尝试和流行是早就有了的，而且一直都在用，只不过现在
