    那么，我们要相信自己的体系么？


    当然，而且每一个体系，所有人相信自己的体系是天下第一都是应该的。


    这不是因为每个体系的人都“骄傲自大”，这是客观的——因为社会是一切实复杂总和，那么应对其中的所有问题自然是最复杂的过程。


    这个过程包含了一切已知的和未知的主客观因素，所以“你所在的，能活下来的那个体系”，必然是你最熟知的，它其中的一切是对当下环境的最高适应。


    所有人在社会方面的“最高点”都是如此。


    比如说一个族群内的最高的“政治实践经验”、“经济实践经验”或“军事实践经验”，这些都是“最高的复杂”。


    改进只能在实践中试验，成功了以后才能叫改进——本质上来说是可能做出超过它的预测的，你也没办法说“谁能彻底吃掉谁”，只有实际情况发生的时候才算盖棺定论。


    这也就说明，任何一个细节指标都是一个局部判断——但是最高指标，每个文明所倾向的判断都是不同的。


    而这些文明又用这些指标发展出了越来越复杂的系统，是已知最复杂的东西，文明间的差异也就是人类最复杂的东西——但是研究差异本身的群体不会是一个社会，不会有一个社会的所有资源，不可能同等复杂。


    这也表示我们能找出的任何区别指标，优势指标，它都是无限复杂下的一个点。


    ——无论这个点在我们眼里有多大，对我们当下的生活影响有多深，**它在无限巨大的复杂下，依然是相对无限小的。**


    这就好像有人以上一次战争中，中国的伪军数量居然比正规军还要多的情况，证明当时中国会死。


    **然而在更后来的回顾，我们能真正了解滞后的历史的时候，我们大多数人才能明白当时敌人的必败——尽管已经有先知先觉的人，明白了中国胜利的道理和路径，但那是少数中的少数。**


    后来，我们大多数人才明白，软弱的伪军无论数量多少也并不能代表一个文明被击败，因为真正的战斗力永远来源于一个文明所能凝结的核心战斗力是否占据优势，是否持续抵抗。


    这些凝聚的战斗力，不是凭借单纯看人数就能对比的。


    **松散软弱见利忘义的伪军无论多少，都无法和凝聚在一起的队伍抗衡。这些软弱的队伍只能成为被蚕食的对象，成为运输队，反击力量会因此继续壮大。**


    **这样的事情，还有很多，或者说历史就一直是这么一个过程。**


    **这不是因为成王败寇，而是王成寇败。**


    正因为如此，光是从逻辑上说，所有的判断“文明永久优劣”列举出的指标是不可能成功的，谁列出来并且笃信了，那么谁就离自己的死期不远了——**因为了解和更新停滞了，无论是对于自己还是对于他人的。**


    所以“历史的终结”这样的话是绝对不能说出口的，这比说泰坦尼克号是不沉之船可严重的多。


    **认为可以“我的文明可以永久占优，因为我们有 xxx 之力”等，这些都是危险的**


    因为历史的终结，就说明自身的系统也不变了，如果世界还在前进，那么历史不会终结别人，只会把口出狂言的人给终结了。


    认为别人系统就是更具有永恒优势的人，它也一样——它只是表面立场翻过来了而已，但是错误核心是没有区别的。


    所以我说“xx 能赢”，也只是在说周期而已——大多数时候我也不敢说周期，我只是从现状推测“下一个点，我们会怎样”。


    那些以为我在说“中华文明世界第一永远胜利站在巅峰”的人，是根本没明白我在说什么。


    不过，最后有一件事情。


    大家可能意识到了。


    KPI，BSC，OKR，无论是任何一种方式，似乎他们避免内部系统老化，或者说让系统能够生存的更久一点的方法，都是需要对外扩张的——虽然指数型增长的老化成本，迟早会让线性增长的扩张无法跟上（增长虽然也可以指数型提高，但是不合理的复杂度的增加，必然会拖慢节奏。然而设置合理的复杂是需要同等资源的，那么实际增长行为就会被拖垮——因为这和追求永生无异）。


    是的，没错。


    那么这个是坏事么？


    也许是，至少对于“个体”或者“集群”本身来说，当然是坏事，因为它死了。


    但是正如我上一篇文章中说过的的那样。


    “我们为了能够将将自己的一部分更多更好的延续下去，被迫放弃了长生不死。”


    很显然，选择长生不死会造成很多限制，每一次改变时，如果想保持长生不死就都必须多过很多的步骤——而选择放弃长生不死的群体，他们就能更多的用于演化自己有限时间内的竞争力，击败那些试图单纯依靠个体寿命来苟且偷生的对手。


    即便在地球上，那些明显特别长寿的动物，大致上也是“龟缩防御”的——比如说龟。


    虽然他们个体很长寿，但那往往换来的是极低的繁殖率——大多数时候，都是因为他们幼年期死的很多。


    人类也是一种相对长寿的动物，那是因为我们演化中也受到了不少的限制，我们没有利齿爪牙，我们没有极度健硕的身体，我们的肥肉也不能多的让我们度过寒冬；我们的繁殖效率不高，智力带来的巨大头围也让生产过程变得极为痛苦又危险；我们的幼年期很长以至于大多数历史时期中，大多数孩子活不过
    3 岁，而其他很多动物生下来没多久就能跑能跳了。


    在艰苦卓绝的生存竞争中，我们花费了百万年，我们的智慧演化路线才让我们抚摸到了暂时的顶点。


    我们依然是扩张的——但是，一切的东西之所以能被有意识地推进，那必然是需求。


    而你有了一个需求，就必然要承受相应的代价。


    不必说社会，我们个体也是一样。


    男性为了争夺交配权，需要强壮的体魄和更大的斗志，因此雄性人类需要分泌大量的睾丸酮和一系列雄性激素。


    这些激素不是没有代价的，雄性激素大都会冲击免疫系统，破坏人体抗衰老系统——雄激素除了对暴力和组织暴力有关的系统有用以外，几乎对其它一切维护个体生存的设施造成伤害。


    即便是没有意外发生的情况下，男性的寿命最终还是比女人的短。


    但是如果男人不能在有限的时间里击溃繁殖竞争对手，那么这个男人就算活到200岁，他死的时候一切也都结束了——就算生理寿命无限，他也迟早会意外死掉，而他的寿命对于整个种群来说必然是短暂的。


    人类以外，也类似。


    大多数动物甚至微生物，它们大多数都是喜欢氧气的。


    这不是因为大气中氧气比较多，因为原来大气是没有氧气的，是藻类慢慢制造了氧气，并且造成了“氧气大灭绝”。


    因为氧气是一种活跃度非常高的气体，是破坏性极强的，几乎对任何一个生命体而言都是有害的。


    为了适应，一部分生物造就了耐氧的特性。


    直到有一天，氧喜的生命诞生了，它们利用了氧气极高的活跃度，让生化反应加速，效率提高——这是核心基础效率的提高。


    厌氧生物和只是单纯耐氧的生物被挤出了主流地位，那些最落后的只能残存在封闭的边边角角。


    但是氧的破坏力依然很强，可是竞争平台上去了，大家是下不来的。


    氧气的破坏力有多强呢？想想各个爱美怕老的女士特别害怕的“自由基”就知道了——但是，为了活下去，为了继续竞争，美女还是哈赤哈赤的呼吸，哪怕是在繁殖过程中也不例外（甚至加速了）。


    我们有了新的竞争需求，我们就必须承受相应的代价，这个代价往往意味着“个体死亡周期”。


    让自己不要过快死掉，仅仅是因为太快死掉对扩张也是不利的而已，我们只是在找扩张效率的折中，绝不是为了在规避永恒的死亡。


    “社会体系的不完备性”本身就是正常的，它不一定是因为我们真的不能理解当前的社会，而是为了生存，我们必须让我们的社会更具竞争力，更向前进。


    为此我们不得不抛弃一部分的“寿命”，也不得不抛弃一部分的了解——在这样的环境下，我们的实际进步速度永远比我们了解的速度更快，进步性永远大于稳定性。


    偶然的停下，只是个体的死亡；如果慢了，就是全体的灭绝，永远成为历史。


    在生死竞赛中，死中求生永远是常态——我们之所以能够开始，就是因为我们的先辈选择了必然的死亡的生存路线。


    无数先辈通过直面死亡，换来了我们的存在。


    所以客观上，宏观的周期一定存在，但我们一定无法精确的从一开始就预估周期的开始与结束——因为那是无限复杂的，而且需求推动下，变化的速度会永远比了解的速度快。


    一次文明的胜利，大都只是站上了恰到好处好的周期，次等的文明则往往是因为“生态位刚好出现”。


    没有永久的胜利，无论是过去，现在，还是我们能想象的将来，它都不可能存在。


    如果它真的出现了，那么它就代表停滞，停滞带来傲慢，傲慢走向毁灭。


    局部的傲慢，局部的毁灭；全部的傲慢，全部的毁灭。


    但是对于“工具”，比如说我们整个社会的实践经验，那依然是客观上最优秀的一这是客观实践的成果，是最高的总结，是当前自身已知的最好方案。


    对于每个文明而言都是如此，这并不是一种傲慢，这只是无法选择的道路而已，就好像你无法选择自己的出生那样。


    因此不管您愿意还是不愿意，只要你想保存自己，你想延续自己，那么你实际上


    只有一个选择——哪怕你逃到外国去也是一样，你只是用更多的“不扣少保存”去试图换取“自以为更好也更稳定但少量保存”而已，本质上是不变的。


    这种做法，就和所有不入流，已经基本可以确定落败的文明系统是一样的——很显然，现在没人能够断定任何一个主要大型文明系统中的人需要采取这样的做法。


    因为这就相当于一个虽然不是当前最壮硕，但身体健康的人，去选择阉割自己并且进宫当一个小太监那样。


    这大约是不划算的，而且大多数时候，太监大多数也是没有繁殖能力的——他和他以后的存在，将会被彻底吞没。


    至少在大多数人眼里，和“剁鸡鸡”等价的努力，在自己的体系内活得并不会比太监差。


    所以，只能说是部分人没种，觉得自己的鸡鸡不值钱而已。


    叛逃者，怯战者，都是不同程度的太监罢了——而且很多人，是仅仅因为 0.7% 的劣势，选择了交出 JJ。


    为了区区 100 块钱里的 7 毛钱而卖掉自己的鸡巴——别人可能也觉得这七毛钱也挺重要的，但是对于那些人来说，拔一根毛去换还差不多。


    作为一个主流文明，我们的压力远比那些小文明要小得多，持续不间断存活的可能性大得多——我们只是差了远远不到 7 毛钱，而别人可能是差了 1 块钱。


    因此对于所有正常的个体来说，不论是否愿意，我们本身只能这么做。


    我们会献上所有的生命与力量，在最困难的时候保卫华夏种群的星火，在强盛时记录中华文明的精髓，并**让这些标准成为地球上所有智慧生命的公义**。从黄河的浅滩，直到星辰的尽头。  今曰为始，至死方休。


    太远的，我是说不了。


    但是我们现在最大的对手，正在衰落的 BSC 文明——但是注意了，最大的对手只是对手，眼前的对手只不过是生存的一个小小考验，要想发展，我们其实也需要着重“下一个对手”。


    看过上文的人，一定看到过“他们的末日文化”，他们的方舟文化。


    而它们是“神授君权”——这里得用“它”，因为“他们”针对的是与我们没有本质区别的人，剩下的都是“它们”。


    大家也一定记得中国是“天道”，是“君神平权”。


    那么，当我们强盛了，它们来招惹我们。


    它们面对的是什么？它们害怕的是什么？


    它们对我们的害怕不是对人类种的害怕，它们也并不害怕自己神明。


    那它们害怕的是什么？


    它们，害怕的是：“天启”。


    我们对于它们来说，就是“天启”的出现，它不是上帝之鞭，不是其它任何的惩罚，我们是天启——我们每个人，都是天启骑士。


    只不过，我们不止是4个天启骑士，我们是1400000000 天启骑士。


    传说中的天启骑士，在中国人身上，从神话中再次具象化的出现在了现实世界——它们有理由害怕。我们，生来就是它们的恶魔，它们的梦魇，它们恐惧的源泉。


    看看《圣经》中对“天启”的描述吧，它们看我们的样子，它们的担忧和恐惧，它们抹黑我们的套路。


    不正像它们面对天启骑士时候的表现么？


