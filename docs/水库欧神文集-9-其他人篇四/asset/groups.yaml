    # 新加坡组屋提高了房价，新加坡神经病？


    本文写作原因，是因为看到水库论坛微信号邓老师的文章《为什么会被牟林瀚操纵？》一文中的一个 “新加坡组屋拉高商品房价格”，和下面一大堆评论的反对此观点的人。


    首先我个人是支持组屋的，而且我是非常支持新加坡当局更多建立组屋，并且加强一些社会福利的（他们也确实在加强）。


    其次我同时明白新加坡组屋是拉高商品房价格且不利于经济的，是让新加坡老百姓不能过上更好的日子的。


    当然，也许有人会觉得 “哦，那你的意思是，组屋就是个样子工程，是图虚名而已，你这是阴谋论”。


    如果有这样的感觉的，哪怕一点点。


    请做好心理准备，我下面要讲的东西 “全部是阳谋，根本不图虚名，比买不起房子惨无数倍”——如果心理承受能力差，那么说 “组屋拉高房价” 会让你想骂，但这一篇可能会让你绝望的想死。


    因为如果您有这样一点点感觉的话，那么说明接下来的内容，是你曾经完全没有接触过的。


    放心吧，我不是胡说，你可以在相关教学书籍上找到，是现代社会的根基之一——尽管它们往往说的没有这么直接。


    关于新加坡组屋会不会拉高房价价格，我觉得这个问题不用讨论，稍有常识的人都知道这玩意儿拉高房价的效果很不一般（这不光是供求影响，而且还是官方拉高许'
