- raw:
  - '[PAGE 153]


    因为资本主义最需要的是自由市场，西方之所以神权太大就会和世俗资本冲突，是因为他们本身就是集中性的 BSC 贵族体系，每个贵族靠的是特权斗争而且越来越大，这对市场破坏是不得不持续加深的。


    正因为如此，所以西方才会 “打破神权才能搞资本”，因为神权当时是最大的单一贵族，最破坏市场——全面世俗才能搞资本的结论，那是基于 BSC 模式社会结构的。


    可是在 OKR 系统中，神权只是一个“基础敌我识别标准”，只是一个相对固定支出而已，真正的竞争实际上是发生在“内部组织性交易”中的。


    既然 OKR 系统中的神权不是一家独大集中化的用特权越来越多干预市场的主儿，那么神权的组织当然可以有效运行资本市场——而且因为 “神权外索固定支出” 有限，资本容易预期会给付给上层特权的
    “贡品”，所以反而比看上去 “斗来斗去求团结” 的 BSC 系统更稳定。


    所以 OKR 系统是天生活适合资本的，只是它现在还没发展到这一步——我相信时间不会太久，我们有生之年应该能看到。


    如果人类的生物碱基对是：生物性状传递在于碱基对（也就是 DNA 图画上的那一道道“杠杆”），优势性状如果适应环境，这个碱基对就能继续存在于种群之中。


    那么 “物质遗产” 的这一过程，有可能就是 “每个不同的人略带特殊的决策经验” 的“交配”过程（交配才会形成基因交换和突变，是繁殖）。


    这些决策经验包含道德，博弈思路等等，它也是一定程度上能代际遗传的。


    由于单个人用口头或者书面的“经验”传达是差不多的，除了极少数大家名作以外，大多数社会个体 “会提高经验的传播率” 的传统方法，就是“遗产传递过程”。


    （回头再想遗产税？不能规避遗产税的小优势人群无法提高“文化传播率”，而底层人本身传播率就比较低，遗产税就是 “文化阉割”）


    对孩子，家长教了一辈子，说了一辈子，说的最多，深度最大，目标最明确。


    如果子女比父母多，他们继续传递至少部份“经验”——子女越多越成功，“经验”也


    就扩散的更大。


    （注意，是“会提高”而不是“想要提高”，这对于大多数人来说这件事是无意识完成的。就好像我们想要的可能是性，而不是孩子，但是性就会带来孩子，至少在可靠的避孕工具发明前是这样——基因不在乎你怎么想，你只要做得对就行了。）


    我们可以想到：一部分经验会更具优势，虽然会有波动，但是一些 “经验基本单元” 的组合会形成一个比较稳固的性状优势——这些经验大多数可能是“一个小小的博弈方法和做人做事准则”。


    所以，这个 “经验=碱基对”，它的传播优势也不是当事人可以预料的（尽管大家都认为自己的基因不错），也是 “适者生存”的。


    那么，经验碱基对在 “交互” 过程中是否会组合融合呢？


