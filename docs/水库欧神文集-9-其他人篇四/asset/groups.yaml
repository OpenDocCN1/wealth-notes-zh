    可是等一个地方连行业整体统计数据都出现了，那么这个地方其他行业也早就填满的差不多啦。


    搞一个复杂的统计是需要很大的资源的，你要统计个珠三角地区的“2019年在经营的中型企业”都难上加难，那更别说其它的事情啦。


    所以找到一个方便统计的标记是很重要的，沙县小吃就特别方便，你路上扫一眼都能知道大概的情况。


    哦对了，还有一点——就算你不是本地人也可以预估“新开店”的数量，而且这还只有沙县小吃这类店才能办到。


    为啥？


    因为这些店比较穷，而且做的也是周边生意，所以？


    所以，他们不在乎招牌，用的招牌质量都比较差。


    差的招牌，它太阳晒久了会怎样？


    对，会掉色儿！


    半新招牌的颜色会变得不均匀，有些颜色特别突出有些颜色先不行了。


    时间再长，底色都掉的白花了。


    而且由于柬埔寨是热带，太阳比较稳定，侧射阳光时间固定，最大的紫外线（光分解主力）都是在中午——所以更好观察：招牌上面被晒得最厉害，掉色最严重；下面被地面反射紫外线晒得更多，也掉色比较严重；中间和有点遮挡的地方掉色最慢。


    （不像国内有季节性导致的光照方向变化。如果你仔细观察就会发现，海南的招牌掉色和东北的招牌掉色是不一样的，海南的掉色是上下褪色再到中间，和柬埔寨一样，但是东北的掉色是从侧面边角到另一个侧面边角）


    因为这个原因，你只要开着小车在街上走一遭，你通过看人家沙县小吃招牌就是知道什么是“老店”什么是“开了有一段时间过得下去的店”，哪些又是“新店”。


    大家看出来了。


    老店：基本盘与基本盘的延续情况。


    半新不旧的店：表示的是近期内的发展现状，照样活的好好的，生意不错。


    新店：新来的觉得这里的客户还会增加的，值得继续开店。


    所以柬埔寨的沙县小吃的招牌的褪色情况，是可以反映出“柬埔寨华人基层工作人员的消费能力和人数的趋势的”。


    好，这五点掌握了


    让我们回到最关键的第一大点。


    “沙县小吃是小成本投入的项目，大多数加入进去的人并没有经过很复杂的计划。”


    这个结合到上述五点就奠定了“沙县小吃对于经济基本盘的可靠指导意义”的核心。


    这个核心就是：更频繁的市场选择，更多的市场参与者，更充分的竞争。


    我们以前都听过一个故事。


    KFC，麦当劳，必胜客开到哪儿，哪块地方的房价就有保障。


    这本质上是一个“地段”的故事——KFC，麦当劳，必胜客因为有很强的选址系统所以大多数时候选的很正确。


    也就是它们预判的很准。


    世界上有什么比 “超级组织预判” 更加准的呢？那当然就是现实本身 ——越贴近 “实时” 情况的事情就越准。


    沙县小吃因为投入小，大多数人计划不周，所以反而更加的 “实时”。


    可是沙县小吃又是流程制胜，可复制性强，操作难度低，所以偶然因素影响生死的概率就比较小——更多的门店数量又进一步抚平了偶然影响。


    这就好像我和网友聊天时，网友说的一个例子一样。


    “我家楼下来有个 KFC，后来因为在十字路口，可是没有停车位置而最终失败，但是周围沙县小吃越开越好了。”


    这个例子就说明了 KFC 本身选址虽然专业和倍加注意，但是由于它可观测的门店少，偶然和考虑不周（也是一种偶然）带来的个体偏差就会在你的整体取值上出现更大的偏差。


    如果这个 KFC 没了，你观察的是 KFC，那么你不就更可能误判了么？如果你要拿麦当劳和必胜客来做横向对比，那你的统计工作量不是增大了么？


    如果是刻意统计还算好，但是很多商机和现象不是刻意发现的，如果是各种因素混杂在一起，你就很可能难以发现或者出现误判——这也是属于你对于世界观察的“偶然”。


    沙县就不会有这个问题


    因为它的经营者的盈利周期更短，如果做不下去很快就会死。


    沙县又比较多，偶然因素死掉几个不太影响你的观测结果，而且如果情况真的出现大问题，它们也是一片片的倒闭的，这甚至比偶尔倒闭一两 家 KFC 还容易观察。


    同时它还属于先对薄利多销的，这些行业对于社会的现时变化和预期变化整体上更加敏感，不像那些大店一样可以靠高利润率和资金池撑更久——撑得越久意味着你被干扰的越大，你总不可能拖着小本本每天去无数家
    KFC 里面看消费者人数的。


    沙县小吃还是 个社会基本经营单元，优势也比较大，所以受到竞争的影响也是相对有限的——KFC 受到的中式快餐和其他本土快餐的影响，远远比沙县小吃受到黄焖鸡米饭的影响大。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新......


    就沙县小吃的优势来说，可预见的未来应该没有什么其他竞争对手能能在这一分类中快速的撼动它的基本盘优势，这也减小了意外因素对于我们的观测的影响。


    所以沙县小吃代表的是什么呢？


    归根结底就两句话。


    1：基础劳动力是充沛的，是在增长的。


    2：基础劳动力需求，它也是充沛的，也是在增长的。


    这两个都是充沛的和增长的，这说明了什么呢？


    当然是说明：这个地方是良性发展的。


    一些局外人么，想到柬埔寨就是“种菜”“种尼玛个大菠菜”，好像只有这些事情一样了。


    但是实际上呢，光是这些产业，是不需要额外的那么庞大的劳动力的——特别是劳动力本身的充沛和增长是不可能的，劳动力需求倒不一定。


    维持“双增长”必然是多行业多元发展的，只不过柬埔寨不大可能走那种“工业立国”的路子——但是也没人能说服务业是单一化的（而且还有明显的复杂化和多元化的趋势）。


    有了基础劳动力，对于我们（至少是我这样的）意味着有比较好的，维持基本核心的招聘来源。


    有充沛的劳动力需求的增长，则意味着整个社会的平均收益率是良好的。


    也就是说从基本盘来说：公司组织门槛和经营环境的好坏，它都是比较好的；它是“有底”的，不是完全靠单一产业看天吃饭的。


    如果要简化成一句话。


    那当然是：“社会的基础结构和社会进步的 energies 是已经构建而且是有内力的。”


    但是呢，我们也知道：沙县小吃毕竟是对基层人的，它在一个区域内发展到一定程度就会稳定下来，稳定区域内就不能再依靠沙县小吃来判断发展 了（毕竟一个区域内的基层人员数量也是有限的）。


    如果要抓住后续机会，我们还是应该预判一些“下一步”可能会立起来的东西。


    这个东西最好也要和“沙县小吃”尽量接近，但是比沙县小吃更高级，但是也要符合当地的客观条件，还是要从发展的眼光看问题。


    有很多东西是符合“更高级”的条件的。


    但是这里往往有个问题：有些东西太高级了。


    我们要看社会从基础走向高端，我们要判断这个“高端”是不是有底气，看的是这里面的人口结构——基层人口之上是中层，本地长期居留或者经常往来的中层人。


    这些人消费不会太高。


    你如果要找那些容易观察的显眼的东西，豪华大酒店大饭店肯定是不合适的，这些人哪会没事儿跑这种地方呢？


    小餐馆呢？人太混杂，哪怕是好一点的餐馆也混杂——只有经济下行的时候中低档餐馆才会有明显的消费区分，经济好的时候就算是穷人也经常会舍得“搓一顿好点的”。


    你又不可能抱着小本本去里面数人家消费者（好像这话之前说过？）。


    所以前两天在讨论的时候，想来想去，想到了一个比较合适的东西。


    刨冰店。


    我相信大家一定明白个中道理。


    但是会有一个问題：为什么是刨冰呢？冰饮料不行么？冰激淋也可以啊，为什么就要是刨冰呢？


    我是这么考虑的。


    冰饮料这个东西销售方式变化太大，而且往往不需要单独设备（投入小），所以你观察起来波动比较大——每个新生市场的发展的路子都可能会走的奇形怪状的，越是有替代性的东西越是奇形怪状，所以通过冷饮店来观察就不大合适。


    咱不能选择可替代性太强的，不能拿我们国内的经验生搬硬套，也不能拿其他国家的经验生搬硬套，一定要从最基础的经营者优先才出才对。


    那么冰激凌呢？


    讨论过，这个确实也可以，但一部分毛病和饮料一样。


    不过更重要的是：柬埔寨就算有冰激淋，它也很容易更多的跳过“中间群体”。


    为什么呢？原因很简单。


    冰激凌这个东西，看上去简单和便宜，但是原料复杂很多。


    就算原料我们浓缩了，比如说搞成奶粉运过去，冰激凌要廉价的生产出来也是需要很多工业实力的。


    比如说冰激凌要松软，那就要把奶油变得蓬松，这虽然有很多方法，但是都需要比较好的工业水平和较大的能源供应。


    冰激凌如果直接运输进来，其成本也不低。


    如果有什么东西能提供类似的效用，但是成本更低而且更符合当地，那么它就可以在“中档副食品”领域挤出冰激凌。


    而剩下的冰淇淋要么是做工很差的小甜筒（用替代品而且做工差），要么就是更贵的，比如说哈根达斯这样的，至少也是和路雪什么的（当然比国内贵）。


    大家想一想：一个普通的非底层苦力上班族，他会经常选择高档的么？不会，毕竟价格还是有点的。


    低档的呢？相比于国内更难吃，不是迫不得已也就不吃了。


    所以冰激凌这个东西，它的“全方位竞争优势或者至少是等式”，至少取决于两个因素。


    - 1：工业化水平。

    - 2：物流水平。


    很显然，柬埔寨可预见的是未来是不会会有这样的工业化水平的（达到以前肯定有东西已经抢占了冰激淋的市场）。


    物流水平就算是提高也需要时日。


    中国之所以冰激淋占据了绝对优势，很大程度就在于“我们工业品直接面向消费市场以后，很多工业基础产能是过剩的”。


    这个时候作为大批量生产更方便的冰激凌就快速的抢占了市场（包括雪糕）。


    而刨冰这样的东西主要考验的是小规模的店家仓储计算和小物流，而且需要多一点的设备成本——这对于社会基础的经营者要求更高，也需要社会基础经营者有更多的原始资产积累。


    这一路市场化发展的国家里自然不成问题，但是对于变化巨大的中国就成了问题。


    哪怕在 20 世纪末时，对于基础经营者来说，这些设备和技能对于他们来说也是不小的负担与风险，可是此时雪糕却已经普及啦。


    我们可以发现，那些市场化时间长的，之前有一定消费工业品的（比如说廉价的商用冰箱），其刨冰店就远远比国内多，还有各种冰块制品的吃法也比较多——广义的来说，沙冰也是刨冰的延伸品。


    尽管刨冰后来受到了冰激凌的挤压，但依然是广泛存在的。


    刨冰的优势和特点在哪呢？


    1：刨冰廉价化不需要冰激凌那么强的工业基础，能商业制冰最为关键。


    2：就算不能本地生产出那么多刨冰糖浆，那么用水果鲜浆也可以——当然了，工业和物流系统一般的情况下，水果也不会多便宜，而且热带新鲜水果容易坏。


    不过这没有关系，因为直接靠进口糖浆也没什么问题，糖浆是非常方便运输的，而且很经用。这可比弄冰激凌材料或者直接进口冰激凌划算多了。


    3：刨冰这个东西最好是门店销售，虽然也有包装刨冰，但那一般是冰粒子贼大喊硬，糖浆也冷的太粘稠，不大好吃（而且万一运输过程中化掉一点，那客户就得吃大冰坨子啦）。


    4：制冰最好还是成批量比较划算，店家自己冻也可以但是投入就有点大了。


    除非是那种运输困难但是工业品比较便宜的位置（比如说景区），否则店家自己搞个刨冰用的制冰机就不一定划算——如果是市区里，那还不如买冰块或者几家店里才有一个大一点的制冰机就好啦。


    5：刨冰店有机器设备，样子很显眼，而且刨冰店都需要把产品面板展示出来，招牌写的非常显眼而且消费层次很容易辨别（单独卖刨冰的店也不会特别便宜），所以对我们而言是和“沙县小吃”一样很容易观察的目标——还是开车溜达几圈就行啦。


    这几个合在一起，那柬埔寨的刨冰显然会在“柬埔寨本地产业已经发展多元”的时期对常规冰激凌占据优势地位，而且这个时间很可能是非常久的——事实上我怀疑是“几乎永久”。


    现在柬埔寨刨冰门店显然就不错，但是却没有那么大优势，这是为什么呢？


    依我之见，只有一个原因：制冰成本。


    柬埔寨电费是贵一点，但那 个不是主要的（虽然也比较重要）。


    另一点才是真正致命的。


    水：柬埔寨没有水。


    你也许会奇怪：柬埔寨怎么可能没有水？金边总有自来水吧？


    问题就出在自来水上：柬埔寨的自来水不是很好，颗粒物比较多（这和水厂以及水管都有关系）。


    这个对于一般的家用过滤器或者烧开了喝当然没什么影响，但是对于商业过滤器的影响就很大了——商用过滤器可不便宜，而且体积也不小，运输也需要小心。


    所以市政用水的颗粒物含量对于商用过滤器的成本有直接影响。


    由于其他冷饮产品也都是大量生产的，所以刨冰的优势从绝对值上看是很小的（虽然这一领域中达成了优势就会比较持久）。


    电能的消耗各个冷饮相对近似，但是对于刨冰来说“水”是额外更重要的影响因素（冷饮料也有影响，但是冷饮料的销售对于我们要不易观测。冷饮分销更加简单可以瓶装之类的，本来就是更大的工厂生产比较划算，这些工厂本身自己大批量净化水也是可以压缩成本的。）


    所以柬埔寨的刨冰要想取得优势，那么最有可能就是在“新建立的人类聚集区的供水系统范围内”。


    这个系统要是新的，这样无论是水厂还是管线（管线更重要）也是新的，那么小规模批量制冰的成本也就大大降低了——考虑到柬埔寨本土没有工业，所以小型分散的商业用的工业耗材的成本控制当然更加重要，毕竟运输和服务成本都更高，过滤器单价自然高了。


    当然了，也有古典的做法——烧开水。


    可是现代还要有平起平坐的优势，那烧开水也必须更有规模。


    先不谈“把水放凉”的问题，光是大批量加热水到沸腾就很困难啦。


    大容器可不比小容器，小容器把水烧开真的能一起把水烧开，大容器烧水的时候经常温度低的水还没被加热就沉到底下去了——温控可能会觉得“哦，温度到了，不烧了”，但是实际上这个水并没有完全被烧开。


    这种情况时有发生，哪怕就连美国也发生过暖水器（可以泡咖啡的）没烧开，结果水箱底下沉积物里的奇怪细菌弄死了楼里一票老人的事情。


    因此在大容器里烧水，其温度控制会更困难，设计更麻烦（而且要尽量隔热以确保受热均匀，但这样一来烧开以后散热就更麻烦了）。


    如果不想搞就得加减压——可是加减压更贵啊，大型耐压容器可贵了，而且万一出问题……你可想看到一家创冰店炸飞半条街的伟大剧情。


    所以烧开还不如过滤器呢。


    但是，如果一旦供水系统成型，那么刨冰店哪怕是自发发展也会具有优势——而且会随着能源供应的增加而愈发明显。


    同时刨冰也并不是产品本身无法和冰激凌对抗，主要是发展时间错过了。


    绵密厚重口感的冰激凌，刨冰也一样能做到。


    十年前国内曾经流行过一阵子“绵刨冰”，现在这个产品也有，但是因为市场已经被冰激凌占据，所以绵刨冰并没有挽回刨冰的颓势——而且在工业系统本地成熟的情况下，刨冰对于冰激凌是没有成本优势的，还会因为当场加工的限制而受到更多人力成本与单位时间内的生产效率的制约（绵刨冰无法储存），因此综合成本反倒是可以集中生产和仓储的冰激凌比较低。


    而由于缺少了发展必要性，所以中国的刨冰就没有深度发展相关技术与商业结构，成本就进一步下不来了。

    '
