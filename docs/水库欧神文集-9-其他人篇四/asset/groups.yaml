    在这个系统里，大多数“物质遗传”过程都绕不开它，而且它本身确实也很有效率，只是偶尔失灵或者效率低于对手。


    所以大家依然基本上都在这个“文化躯干”的其他部分动动脑筋，升级下手指脚趾，奶子长大一点什么的。


    就好像西方已经是常年成熟的 BSC 系统了，他们无法从根本解决贵族产权稀释问题，也无法缓解“同层内斗导致人员类型减少”的毛病，但是他们依然发明了“票选制”来给自己拓宽了“进化深度”，把贵族系统给撑的更久了。


    就好像生理上的“中国人因为基因限制，没办法把奶子快速变大”，所以中国人选择了“蛇精脸”进行强化。


    我们是否是一个“文化躯干”中的朋友，取决于我们的“手脚道德”是不是相似，有没有冲突。


    但是在面对另一个“躯干”的时候，一只手或者一根手指是否有矛盾就不重要了，握紧拳头一致对外，因为没了躯干大家都会死。


    每个文明的“躯干”都有所区别，但是它们都有遗传许久的“曾被证明可靠的性状”，都是非常有力的竞争对手——只要不被上下夹击，长期复杂演化的文明就很难灭绝。


    现在地球“越来越小”，其中的“人类文化种群”对于地球这个大家的生存环境的影响越来越大。


    进化是随机的，它虽然能被渠限强化出“深度演化”，那只是因为“这个渠限内，能演化的部分比较少，同样的试验次数被局限在了一个更小的器官中，让这个器官变更大”。


