    这是 KPI 系统绕不过去的坎儿，**也就是“工作层”和“管理层”之间的信息隔阂，工作曾要想晋升为管理层，必须在升级前就补偿获取这些信息的成本。**


    但是随着组织的日益复杂，这些信息要求的量会越来越大，最终导致工作层无论如何努力都无法补偿信息成本了。


    此时晋升系统就会从下到上慢慢失能，全社会的激励效果越来越低。


    **而由于 KPI 监察系统的旧规则消灭的总激励程度肯定不大于总新指标设立（否则监察系统没有足够的资源撤走旧系统），所以信息成本一定是处于宏观上升的。**


    公司有时可以彻底改革 KPI，是因为公司有外部社会系统——可以融资，可以借钱等等，实在不行还可以存钱。


    **就算是自己存钱，这个“钱”的作用的保证也来源于外部社会的规则。**


    **但是对于一个“力量主体”来说，它并没有“外部”可言——它是无法存钱，无法融资，无法借钱的。它的“生存能力”永远是“实时”的，一旦暂时失去，就会遭到不可挽回的袭击。**


    举个例子：小国家可以靠“国家发展银行”来融资，如果出问题了最差也有联合国维和部队。**它们哪怕是全面改变的风险，实际上都一定程度上可以用外部世界的固定机器来处理。**


    **这也就是国家存在的必要性，世界永远也不可能是放任的资本主义自由经济，因为必然会有个力量顶点是无法通过“外部资本交易”存在的，它的存在无法靠资本市场维系，因为它才是维系资本市场的——因此国家存在的最核心任务就是保持稳定和保持安全。**


