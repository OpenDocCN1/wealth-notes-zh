    这一块的演化速度随之减慢——赌的就是“假设环境核心不改变，我要争取的是这个环境下更多的生态位和更高的食物链等级”。


    整体而言，也是这个社会选择了“以现在已有的主要核心系统，赌它能硬抗所有环境变化，演化带来的进步被严格区分为两个阶层”。


    是不是有“内味儿”了？


    对，这就是“贵族”系统——确切的说，是西方贵族系统（中国很久以前就不再使用这'
  - '[PAGE 139]


    样的贵族模式了)。


    只不过旧时代的贵族是制定了一整套的贵族继承方法，并以法理确定在系统内整个贵族圈子的“基准法”。


    现代的西方遗产税体制下的贵族，是换了张皮，但是达成的结果并没有本质变化，只能说是优化了。


    **_优化主要在于：初始设定的贵族圈子可以更大，血缘关系更具有筛选性，可以排除不必要的血缘关系者，延长贵族的产权稀释的周期。_**


    **_但是要想稳定它，就必须让被排除掉的“不再被贵族需要的贵族孩子”能够在被抛弃后加上“渠限键锁”，让他变得和草民差不多，那就必须采取另一重法律保障——让老百姓去把这个人强行拖下水，让老百姓具有一部分权力，这样老百姓就乐于限制或者处决这些被抛弃的贵族。_**


    这套办法发展到现在，就是“一人一票，权力等同”的票选体系。


    但是，这个系统的根本矛盾之一虽然被缓解，但是却带来新的发展矛盾（尤其是在科技合作扩张的情况下）：这些依然位在的贵族，内部会争取自身贵族的上位，**_而他们的所“分包”的贵族资产是会在现代经济系统中发生波动的——暂时获得优势者会快速的试图制造新的限制条件，阻止其它对手再次获得优势。_**


    **_这就是“现代西方社会福利系统”的来源——为了在自己占优的时候给对手的“教区”内的产业增加成本。_**


    **_在一人一票的“落魄贵族杀戮系统”之下，谁去掉福利谁就需要有更多的“繁殖后代”受到影响，所以福利无法降低。_**


    **_这两个加起来，就是现在的欧美“民主封建贵族系统闭环”。_**


