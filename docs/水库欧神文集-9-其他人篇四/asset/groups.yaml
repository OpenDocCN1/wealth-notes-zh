    # 欧成效简介：


    水库教主，中国房产投资体系开山鼻祖，人称欧神。博览群书，通晓古今。网络常用名 yevon_ou。


    # 一笑加一笑简介：


    自由意志主义者，奥地利经济学爱好者，自由市场经济支持者。2013 年，加入水库。


    爱好：房地产投资和证券低风险投资。


    微信号 (同 QQ 号)：150500211，邮箱：Shuikuver@qq.com，此文集每月一更新。联系一笑加一笑，获取最新版文集。


    以文会友，加微信，入水库微信群，共同学习房产投资知识。验证语：水库群。


    如果哪天水库失联，请联系 QQ 或邮箱，告诉大家大部队在哪儿。


    水库论坛公众号自 2015 年 2 月 18 首发文章，至 2020 年 9 月 25 日关闭。此电子文集为终极版，包含所有这段时间内：不外卖文、隐匿文、被删除文


