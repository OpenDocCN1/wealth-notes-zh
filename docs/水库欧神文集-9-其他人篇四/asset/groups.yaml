    但是对于五常而言，这就不成立了。不可能得到“抢救”。


    有能力的人没有意愿，因为是敌人；有意愿的人没能力，因为小弟救不动。


    ### 综上所述


    那么“企业家的社会责任”在中国能不存在吗？


    不可能，因为 KPI 的核心过程，必然包含更多的人，更多的“晋升者”去补齐发展过程中的 KPI 设置信息的缺失。


    而 KPI 的核心规则是不可能变动的——核心规则无法变动，意味着核心本身也会逐渐老化，它也需要新鲜信息来抗衡老化。


    但是这个过程中，新鲜信息不是白来的，它需要更多的“晋升”。


    注意：更多的晋升不一定是原有的人更多的晋升了，也可以通过设置更多的“激励点”来一定程度上的达到。


    也就是说在一定程度下，你只要多设“等级”称号，多设置领导层级，这样就会有更多的人获得晋升，你也更有更多的信息。


    不过呢，这样会导致信息复杂度加大，每一个层级的晋升者都需要花费自己的资源去预支“晋升要求的信息成本”。


    一笑加一笑（微信号：150500211）邀您加入水库交流群。群内文集每月一更新……


    大家都看出问题了。


    “如果晋升等级设定的很细，那么每次晋升的利益在同等资源总量下必然更少——那么，晋升者普遍预支的信息成本都大于每次晋升的收益时，KPI 系统的管理信息上行就会实际结束。”——这也就是目前很多企业开始抱怨起
    KPI 系统毛病的核心原因。


    但是反过来说，如果你设的少，那么每个 KPI 考核制定者的任务都会很重，需要很多的信息。


    可是同等信息处理能力下，信息量越多，深度分析的能力就越差——爸爸如果什么都要管，那么实在是没时间知道自家小孩想玩的游戏这么败家。


    也就是说，如果晋升太少，那么就算信息的获取系统完美，让所有单个信息成本保持永久不变，增量信息的边际效益还是会继续降低，照样要亏。


    因此，晋升层级太高或者太低都不好——但是随着信息系统的时间推移，同时为了补偿不可能完美的信息获取系统，晋升依然会是总体趋向“越来越多”的，信息要求也越来越高。


    而清除晋升系统的成本是需要新晋升系统带来的效率给付的，可是新晋升系统的动力并不大，而且也绝对不会很大（旧系统还能给新系统提供额外的好处，那就更不会有动力了——如果采取新系统有更大权力的做法，那么下一个组织权力要更大，但是权力不可能无限大的，因为相对值最大只有
    100%）。


    这就好比：如果小明家已经有一台 2000 的电脑，那么他爸爸就更不想买一台 3000 的电脑，最多花个 300 块钱升级下。


    那么小明就只能在很卡的情况下勉强打这个游戏，激励效果还是降低了。


    这是使用 KPI 逻辑的组织常态，无论是一个家庭还是一家公司，甚至是一个大型社会，它们都逃不开这最基本的规律。


    所以，中国要注重“企业家的社会责任感”么？


    这是一个两难的问题——或者说，它本身就是一个系统在不断运行过程中，为了修复核心系统的 BUG 而出现的阶段性补丁而已。


    注重“企业家的社会责任感”，是观察自己的系统的“现况”。


    而观察现况的最好办法是“诱饵”——抛出小小的“奖励”作为诱饵，哪个地方咬饵的“鱼”越多，说明当地现有的 KPI 系统越成问题。


    （附注：鱼饵就是“优秀企业评比”“企业惠民工程”之类的，鱼就是企业。抛下鱼饵后，咬钩的企业越多，就说明当地的 KPI 系统出现了问题——有钱没处花，无法用于直接的生产激励，这不是问题，什么是问题？这说明当地没能很好的开展生产，产业升级落后，钱没能拿来解决就业问题——这就好比“财政盈余过多也不是好现象”的道理是一样的。）


    可是，这个过程本来就会加大损耗，**因为鱼饵毕竟也不是白来的**。


    但是这却也非常有必要——**因为如果一个地方的KPI不平衡越来越严重，那么这个地方如果提前出现重大问题，很可能会给周遭其它KPI造成巨大影响**。


    因此两害相煎取其轻，还是丢饵比较好——**欧神说的不要企业家责任感，我觉得并不是说“这个方式绝对有问题”而是“大家不要以为鱼儿上钩的多是好事”**。


    这就是我对“企业家的社会责任惑”的态度。


    这是“鱼饵”——有这个“鱼饵”就说明我们的系统不是完美的。


    这个鱼饵能不丢当然就不丢，所以这是不好的。


    但是任何情况下，不好就不该做么？当然也不是。


    **只不过，丢的更恰到好处，并不等于是“妙手回春”。**


    “凑合活”总是人间常态。


    有些东西，本身就没有“绝对好与绝对坏”。


    选择做更好的，也避不开最后结局；做的坏会来的早一些。


    因此“中国是否要注重企业家的社会责任惑”，它只是一个手段选择与做事方法而已——由于商业在现代社会里越来越重要，所以明智的来看，**用这个东西当鱼饵必须更慎重，不到万不得已不要丢。**


    但是考虑到我们的现状，各地的对商业的 KPI 考核方式大不一样，我们又需要丢。


    这是一个很危险很危险的事情，必须非常小心。


    看，这就是我说的“中国要注重企业家的社会责任感”的原因。


    是“中国要”，不是指老百姓要叫，也不是指谁要推进这个东西——注重现象，注重观测，这件事情只是个可以观测的现象，但本身没有任何的正面意义。


    它只是“两害相煎取其轻”而已，相当于你去医院抽血，好确定自己得的病有多重是一个道理。


    就算你最终发现你没病，抽血本身也是疼的，是不好的，你要是弄出个淤青晚上睡不着也是不利病情的。


    但是你还是需要它来确认问题。


    好了，主要内容说完了。


    但是能看到这里的，肯定还想看看其他人是怎么样的？


    在这样最基础的层面上，以“国家”作为单位显然是不够的，所以只能以“文明”


    这里我说的“KPI”文明也不光是中国，我只是用了中国的现象作为例子而已。


    它是包含整个“儒家文化圈”的，东南亚国家，还有日朝韩等，还有三代以内的海外华人，这些都包含在内。


    所以我说的不是“中国的问题”，而是“使用KPI系统的任意大小的组织”的共 通问题。


    那么既然看过上一篇文章，各位对BSC和OKR系统的一些实际细节肯定感兴趣，尤其是OKR。


    这其中的有意思程度完全可以另开一篇文章来讲，但是为了内容的衔接性，我还是一起写吧。


    我先给大家说一个现象。


    你们去周围问问，问一下别人觉得OKR文化圈哪些国家的日子过得好，哪些国家老百姓过的差。


    你会发现只要是没去过多个OKR文化圈国家的人，他们的回答和现实中的实际情况往往是反过来的。


    比如说，他们会觉得“沙特老百姓过的不错”，觉得“伊朗过的远不如沙特”。他们会觉得“迪拜老百姓也不差”，“黎巴嫩惨得很”。


    然而事实上，从平均来看，伊朗老百姓远远过的比沙特好得多。黎巴嫩平民的平均生活水平也不比迪拜差（大部分地方好得多）。


    事实上沙特除了一些大亨以外，老百姓的日子过的相当的凄惨，根本不比印度贫民窟好哪里去——印度贫民窟看起来更脏是因为气候相对潮湿。


    迪拜附近有大批大批的贫民窟，他们的生活水平甚至还一定比印度的贫民窟好。


    至少印度贫民窟还能找到最低等的工作，还有基本的宗教福利机关（至少吃点秋葵饭还是可以的）。


    迪拜附近的贫民窟呢？那是叫天天不应叫地地不灵——印度脏是脏，但是至少大多数地方喝水不愁，迪拜贫民窟都会渴死人。


    但是我们又看过一个新闻：一个贫穷小伙住院，但是很穷，他发了个推说自己很穷也没人来看他。他发出去没多久，一大群大佬来看他，给他送礼物。


    难道这个新闻是假的么？


    不是，这个新闻是真的——而且这种事情是经常发生的，甚至每年还有专门的节日来做这件事。


    那么，这么一个有爱心的国家，为什么不能拿一点东西来让老百姓过得好一点呢？


    因为不能，如果里面有个大亨敢这么做，他就是谍反，是敌人。


    到这一点，大家也很容易理解“哦，拉拢别人，拥兵自重嘛！”


    但是这里有个问题：OKR 系统不是 KPI 系统，OKR 系统是相对分散的，那么如果有人拥兵自重而且效率不低的话，别的 OKR 系统还不如去依附这个优势系统。


    就算这个 OKR 系统周围的 OKR 系统率先发起了反对，被反对的 OKR 系统也没有多大劣势，迟早会有人成功的——毕竟成本不高。


    也就是说，虽然大家都有避免谋反的需求，但是 OKR 系统反对谋反的方式和 KPI 不可能一样。


    这样一来，如果循环一下，OKR 系统应该会逐渐变成 KPI 系统啊？怎么可能还会存续几千年呢？就算变化不完全，也会变成 BSC 系统吧？


    没有错，所以我们只能做出一个合理假设：OKR 系统找到了办法，他们在这个博弈模型外部加上了一个更大的环境模型，让 OKR 系统能联合起来不和先这么做的 OKR
    系统组织合作，甚至反对。


    在面对文化差异（核心博弈平衡模型）的时候，我们最好的办法当然不是直接逻辑推理，因为这样量太大。


    当然，也不能直接拿我们的观念硬套，这样肯定套不上去。


    最方便的办法是“事出反常必有妖”——靠对比来解决问题。


    那些迪拜看望小伙子的富豪那么有爱心，但是他们却不帮那么多穷人——他们光是送的那些小礼物，都可以让一个街区的贫苦老百姓看一年的病了。


    那么为什么他们一直不这么做呢？


    他们送的那些东西，对他们自己而言都不是很差的，他们自己都可能在用的东西。


    好，然后你深入了解就发现：是的，大型 OKR 集群系统里的人，他们“献爱心”都必须送“我也会用的东西”，不能是送稀饭送大饼，必须送好东西。


    这不可能是因为面子，因为如果是面子，他们应该至少会偶尔送一些“我都舍不得用的东西”。


    这样“反常”的行为中，就一定有个补偿机制。


    这个机制要么是“送高或者送低”都有惩罚，要么就是“送的合适有奖励”。


    奖励是需要更多的“精准定位”的，否则人人都可以装逼来获取好处——所以针对这样的大范围事件，它的“惩罚”属性一般会大于奖励属性。


    因为好处再小，没有成本也有人贪；坏处再小，没特殊情况也会避开。


    我们追查一下就不难发现：哦，是“道德”。


    除了特殊的节日以外，施舍其实是在“请客”，是一种“礼数”。


    简单的来说，那些去看望穷小伙的富豪，是在“请客”而不是“施舍”——除了斋月以外，施舍行为如果用中国近似意思来理解的话，就是这样的“如果你用 1000 块钱买了
    1000 个饼子给 1000 个穷人，那你就是对 1000 个穷人搞嗟来之食。你必须把他请到自己的餐桌上一起吃饭才行。”


    这是他们文化中必须这么做的——所以如果你们去他们家里做客，他们在非特殊时刻都会准备“比他们日常略丰盛的菜肴”来招待你（当然一部分不了解的国内朋友可能会认为这是“盛情款待”，但是其实他们本来吃饭盘子就蛮大的）。


    当然，如果你去穷人的这儿，穷人的食物如果你觉得太差，你说对方东西不好吃，这里的侮辱意味会远大于中国——在中国，这更类似于“没有教养，你这个人不好”，而在他们那儿就是“看他们这一群人都顺不顺眼”的意思。他们当然明面上不一定会说什么，但这就算一个“梁子”。


    这个“梁子”的意思有点类似于什么呢？类似于我们被“地域黑”的感觉，就好像你在一个河南人面前指责“你们河南人都是偷井盖的诈骗犯”是一样的。


    因为 OKR 组织本质上就类似于“一个个小而紧密的工作室”，各个同事之间感情就算不好也尽量融洽。


    所以对他们来说，这个工作室里面的东西都是“家的一部分”，你说人家全家不好，人家当然不开心——你不应该说人家“哪个不好”，但是他们很欢迎你说“我是怎么做的，我觉得这样做更好”，OKR
    系统对于“你行你上”是最欢迎和最包容的。


    不过，从这一点我们再想下去就明白了。


    OKR 系统是类似于一个个工作室组成的超大型集团，整个集团更多的像是一个“平台”。


    各个工作室就好比“起点小说写手”，整个平台就是“起点网”。


    各个写手的上级当然也不可能直接是“起点网”，或者说他们的“上级”的意思就和我们不一样。


    我们的上级是“说一不二”，而他们的“上级”不如说是“上家或者建议人”，是起点网的投稿规矩（比如五常不能成建制穿越到古代）。


    就好比“起点写手和起点 QQ 群管理员”差不多，而且还不一定是起点的官方群，大多数是起点写手自己组的写作群。


    这些人松散，但是并不是说没有潜在危险性，而且越是高级越危险。


    比如说一个高级一些的群，如果起点网的人员不给他们限制，他们如果可以随便吸纳不同等级的写手……


    那么如果腾讯来挖人，那岂不是有机会一整个群带走？因为群主控制了太多不同等级的写手。


    这还是起点网本身是发工资主力而且层级差别不太多的情况下。


    那么对于更复杂的组织来说，OKR 系统就需要一套完整的“敌我识别+行为忠诚”系统。


    也就是他们需要“保密口令规范化+下级人员要主动在日常行为中就融入集体”。


    这个保密口令规范=经。


    但这个东西本身是不保密的，保密的部份是不同层级的 OKR 组织不同的执行侧重和解释方法。


    行为忠诚系统=日常习惯——不是令行禁止，而是要有“尽量遵守规则”的行为模式。


    口令+习惯表达=经书变成了日常行为作息规则表。


    在明确了这些东西以后，我们就只有一个问题要解决。


    “为什么 OKR 会需要这样的规章制度，让富人不能随时施舍给穷人东西呢？”


    我们这里就可以明白——这里的“穷人”指的不是生物学意义上的人，不是只要穷的人类就等于穷人的。


    这里的穷人，指的是“有同样的保密规则，有同样的遵循忠诚系统意愿”但又没钱的人。


    这些人用我们熟悉的话来说，就是“公司培养过的潜在新工作室的“管培生””——这些人是真的“管培生”，不是那种扯由头的。


    因为只要接受了这套保密规则+生活习惯系统，那么 OKR 系统最基本的抱团规律就有了，也就是说他们日常生活中已经把本组织内基本管理工具给普及了（经过了企业文化和管理工具培训，签了保密协议）——不管有文化没文化都得知道的嘛。


    所以如果你用“1000 块钱换 1000 个大饼给 1000 个自己的穷人”，那就不光是在拉队伍了，而且还是在“侵害公司财产，没走审批”。


    而且这块财产在必要可用的时候，大家用起来的难度是差不多的。


    所以你用一块钱一张饼就把人给收买了，李云龙把楚云飞的东西抢了，还不还给 别人，这哪个行啊？


    这个时候其它的 OKR 小组马上就要起来反对——只要足够多的 OKR 集团表示反 对，哪怕不是非常反对，这个先开头的 OKR 小组在组织内的交易成本立马就会提高，
    因为它是个吃里扒外的家伙，凭的还不是本事而是祸害大家。


    大多数时候都不用升级到冲突阶段，这个交易成本损失就让开头的人自然失败 了。


    光这样还不够——如果一个大饼就能收买的人，他一定以后也不靠谱，所以他以 后肯定也别考虑了，包括你们那帮穷鬼 OKR 自己的小组也要晓得。


    在平级有“我要看你是否倾吞公司共有财产”的监督下，在“跳槽者”原单位的 注意下，OKR 系统内的“低成本拉拢管培生，以求快速从整体组织中割裂甚至造反” 的组织就很难存在——至少水平一样的情况下就说服不了其它
    OKR 小组，如果水平好 的话，那是你的本事。


    OKR 系统和 KPI 系统的本质区别，就在于 OKR 系统核心就是“按功分配，多劳多 得”，这时“按需分配”才是“制度目标”，和 KPI 系统正好反过来。


    当然这不是说不可能存在，只不过有代价：如果要让别人把公共预算交给你，那么你必须把这套东西也讲给大家听，如果很多人觉得确实有好处，那么项目预算就给你啦。


    虽然几乎不可能会有“大家都同意”的情况出现，但是“很多人都同意”就足够了——交易成本没有明显提高，但是组织规模变大了，可以统一控制组织内的绝对利润增加了。


    这个时候人力便宜，而且交易成本上升不多，那么这个项目组的扩大就很快。


    当然了，这套系统还有个好处——如果你想要廉价劳动力，你可以随便想办法，奴隶制或者雇佣都可以（很快他们就使用了以雇佣为主要的高价值员工办法，因为奴隶有点麻烦了，只能干最基本的差事）。


    既然内部同样信奉而且已经行动证明的人你不能随便用于消耗性的生产目的，那么你就只能用外来人——所以OKR文化对于外来人一向都是很仁慈的，毕竟没人会屠自己的劳工不是么？缺的可就是这啊。（但是反过来说，如果欧洲人重新打回来了，他们是要屠城的）。


    这相当于什么呢？这相当于OKR组织设立了一个很高的“劳动保护标准”，而且这个劳动保护标准还不是绝对值，是一个“相对值”。


    也就是一个OKR小组的“工作室领导”越有钱，他就必须对自己人更好，还得是成比例增加的——不管干什么都得增加。


    这样一来，就限制住了“没有管理效率优势的OKR项目组的无限扩张，也遏制了乱拿预算的企图”，因为你拿的越多，你没能力的情况下付出的比拿到的还要多。


    说白了，整个 OKR 进入的最重要规矩就是“接受工会的薪资福利待遇条款”，不接受就不能加入 OKR 工会。


    （所以在有的时候，OKR 可以快速的在可行的传教线上攻城略地，因为大家认可后就可以集资给这块地方“管培生培训补贴”，新地区的人自然更想成为待遇更好的管培生而不是普通员工。而集资补贴额度=股份占比——当然一个地方最终还是要一个项目组拿下的，但是得给有股份的人一定时间内的分红。事实上几乎所有
    OKR 组织都很有广泛的股份制传统，这些文明也不例外——而且如果是高危项目，如果失败了赔钱了是不需要掉脑袋的，所以 OKR 的试错组织大都是“有限责任公司”，因此你才会发现
    OKR 文明里的项目组经常会干一些和自己规模不符的大事，风险很高。于是很多人就不能理解，但是实际上这些行为的主体是“有限责任制”的。）


    那些生活在有钱人周围又不能得到施舍的人，就是“被高福利给挤压的失业人群”。


    正因为如此，实际上 OKR 组织的“传教”动力远不如 BSC 或者 KPI 强——KPI 是最强的，BSC 很多时候只是个借口。


    每个文化扩张动力都很大，但是 OKR 传教动力比不上 BSC 和 KPI——BSC 是超额传教，KPI 是等额教育，OKR 是限额培训。


    因为 OKR 如果快速传教，那么自由使用的劳工就没没了——因此他们在古代打下一个地方，大多是接受被占区保留自己的信仰的（除非是战略要地）。


    如果对方发现了信自己的好处，那就说明市场系统已经普及到那儿去了，有人想跳槽加入公司——行，你加入，然后管好，以后跟我们一起打其他市场。


    所以说 OKR 系统的寺庙更像是一种社会服务机构和高级会议中心，并不是以 BSC 系同样的以“营销为导向”的市场机构。


    KPI 的寺庙更接近于“我的指标已经完成了，我想主动加班，或者祈求下一个项目写程序时不要出那么多 BUG”，是一种祈福机构。


    如果我举个形像的例子，大家就直观的感觉到区别了。


    OKR 的寺庙：大家都是跑市场的区域经理，在开辟二级地区新市场的时候，大家一起和总经理下军令状。


    表现为：总经理讲话的时候大家很安静，总经理说目标的时候大家认真看，总经理鼓励的时候大家一起称赞。


    事情搞完了以后，总经理回到旁边的办公室，有其他事情的区域经理可以在会议室组队磋商，有什么需要总经理协调的就到办公室找他。


    每天要对总公司的方向看一下，想一想公司文化，想一想公司是不是对自己不错？


    如果觉得公司对你不好，那你是不是觉得公司文化没有被执行好？是不是不为客户着想？没错没错，你没错的，可能是你领导错了，但是还是要服从指挥顾全大局，要是你领导不遵守文化，不为客户着想，他一定会被其他领导打败的，市场会教育他的。


    （看？是不是君授神权？虽然说最高级的东西在人的方面是“企业文化”，但是并不是“企业文化”能直接认定一个事情的对错，除非人家摆明了是原则性问题，其

    '
  mdcn: '

    但是对于五常而言，这就不成立了。不可能得到“抢救”。


    有能力的人没有意愿，因为是敌人；有意愿的人没能力，因为小弟救不动。


    ### 综上所述


    那么“企业家的社会责任”在中国能不存在吗？


    不可能，因为 KPI 的核心过程，必然包含更多的人，更多的“晋升者”去补齐发展过程中的 KPI 设置信息的缺失。


    而 KPI 的核心规则是不可能变动的——核心规则无法变动，意味着核心本身也会逐渐老化，它也需要新鲜信息来抗衡老化。


    但是这个过程中，新鲜信息不是白来的，它需要更多的“晋升”。


    注意：更多的晋升不一定是原有的人更多的晋升了，也可以通过设置更多的“激励点”来一定程度上的达到。


    也就是说在一定程度下，你只要多设“等级”称号，多设置领导层级，这样就会有更多的人获得晋升，你也更有更多的信息。


    不过呢，这样会导致信息复杂度加大，每一个层级的晋升者都需要花费自己的资源去预支“晋升要求的信息成本”。


