    但是我知道大家肯定还想问一个问题。


    “除了 BSC 以外，不是还有两个么？KPI 和 OKR，它们分别是谁呢？”


    KPI 是中国，OKR 是另一个现在还在复兴期的古文明（既然那几个字敏感，我就不说了，各位也都知道是哪个，是一个经常被看不起和敌视的那个——他们就是 OKR，仔细想想就知道了，这里不深究）。


    KPI 恐怕是大家最熟悉的绩效考核模式——关键业绩指标考核。


    中国也有平衡系统，但是建立方式并不是欧美系统那样的“分层，层内内斗平衡”系统，而是“等级+绩效评比=平衡通用依据，平衡基准法规定的平衡依据”。


