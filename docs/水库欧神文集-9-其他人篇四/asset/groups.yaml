    \n- 比如说\n  - “他长得很帅。”\n  - “他很温柔。”\n  - “他和我一样热爱绘画。”\n  - “他也喜欢玩这个游戏。”\n  - 等等等等\n\
    \n这些都属于解构后的内容。\n\n但是正如那个“电风扇”一样——如果你真正需要的东西是电风扇，那么你要的不光是电风扇零件，你还需要电风扇的结构。\n\n\
    很多时候，你其实要的是吹风凉快，所以真正重要的核心是能不能吹凉风而不是它是不是个电风扇。\n\n很多人之所以本来喜欢，后来不行了，是因为他/她原来的喜欢是一种“期待”——啊，这些零件做电风扇肯定质量很好，结果人家就不是个电风扇，其实是个热吹风机。\n\
