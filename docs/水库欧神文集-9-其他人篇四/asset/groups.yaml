    机器造机器对于人类智慧是有“**终极意义与决定性指标**”的——人类终于在创造生存与发展需求的物件上，用自己的智慧产生的工具占据了主要生产地位，**突破了原有的生物局限性。**真正的让人类智慧大于了人类本能简单工具下的满足能力，人类的这一产能不再完全依赖于人口的增长，在产能上出现加速度。


