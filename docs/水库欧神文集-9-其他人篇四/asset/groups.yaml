    但是在其他地区，比如说日韩或中国福建省台湾村，他们的刨冰还是广泛存在的（国内有地方也保持着吃刨冰的传统，叫“chua（第四声拖长音）冰”，不过单纯是指大颗粒刨冰）。


    很显然，如果在水源问题解决的情况下，绵刨冰在柬埔寨的成本会比同等好吃的冰激凌便宜——就算它还是会比国内的同等冰淇淋贵，但是在柬埔寨，这些想要吃好一点的冷饮的中层工作人员没得选。


    所以如果我们要看柬埔寨的“特区”是不是发展到了综合而且“基层开始升级到中层”，我们就只要看有大区域新型供水系统范围内的“刨冰店”就行了。


    这还不用针对某个品牌，不用和“沙县小吃”一样还要看招牌上的字儿，因为主要的制约因素是刨冰店设备的高效使用。


    因此所有刨冰店对应中层职工，都等于沙县小吃对应基层劳工。


    通过这一点，我们就还是可以通过“刨冰店数量趋势”以及“刨冰店招牌老化趋势”来判断这一区域中中层职工的趋势。


    对应上基层劳工和沙县小吃的趋势，我们就可以从相对值上估算基层人员和中层的变化和发展，甚至可以预测地方经济构架。


    比如说一个新区域，沙县小吃店和刨冰店同时出现，那么代表的是整体产业一起扩张——这对其中的人来说可能是好的，但并不是效率最大化了，因为这说明“新区域需求”被发现的太晚了。


    如果是沙县小吃明显出现的早很多，那就说明是新的基础人员地区，是新的机会（那儿肯定可以发展，但是竞争还比较小，你有机会立足并且阻击其他成熟区域进来的对手，就算打不过也可以全身而退）。


    如果是刨冰店更加密集，甚至挤占了一部分沙县小吃之类的店，那么就说明这里已经形成了事实上的“CBD”或者“办公人员居住区”，后者离“CBD”不会太远——即便附近还没有
    CBD 也一样，肯定会有人开始在周围建设真正的 CBD。


    考虑到柬埔寨对于商业经营建筑和居住建筑管理不会和国内那么严格，所以这种“CBD”甚至可能是隐性的，但是那个地方的实际商业投资价值会实打实的增高（这对于早去早了解的人是一个极大的先发优势）。


    这一点是很重要的。


    我敢说欧神他们设定的办公区绝对不够用，关键是区域设置不会满足大量后续群体的实际需求。


    欧洲取消柬埔寨贸易最惠国的威胁，带来了中国和柬埔寨的新贸易协定（中国当然得给予补偿）。


    这一部分多元化的商业需求和附属的办公需求，就算欧神是半仙也没办法完全算到，肯定会有一大半的人开辟和进入一个实质上是“自我生长”的“办公与企业集群建筑群落”。


    就像是我国一个小区里面自己变成了全部都是公司租用的情况——如果你能更早发现这些苗头，你就能占据先机。


    无论这个先机是你改进建筑还是抢租以后当二房东，或者就是为了更好的做生意提早把公司搬到未来目标合作伙伴更可能会自发集中的地方去。


    当然了，反过来说如果形成自己一撮人的“联合发展小联盟”，那么通过操作这些服务设施，也可以诱导这个地方更容易成为实质上的CBD。


    也就是“自己的土地，自己加点便宜但好用的配套设施”——反正只要做的不太烂，这个店还能赚钱呢。


    事实上我会更加激进——盖好房子，空出一些建筑面积，免费让沙县小吃或者刨冰店使用一段时间，只要水电成本费，不要租金（甚至水电成本也不收全部的，我自己贴一半，不出全部是为了他认真经营）。


    也就是 0 成本吸引其他资金投入到你的地方来，为你提供了吸引别人所需要的社会服务（如果你自己不想投入或者没工夫管的话）——这等于变相给自己的地块融资了（免费使用了劳动力）。


    （这就像欧神卖给你这块地一样，你把这件事的核心规律在你自己这块地里面小规模的重演了一遍。）


    早发现对于“小成本大收益”及“小成本和如果失败后的低损失”都有关系，所以找到这些具有特异性的小指标还是很有用的。


    当然了，这些都是我作为一个“小生意人”的经验与直觉的混合物。


    欧神说的很多东西我恐怕这辈子也没法搞明白，但是这些小事情，我还是能开动脑筋的。


    鸡毛换糖的精神不能丢（虽然我不是义乌人）。


    此外，我认为这套“沙县小吃”+“刨冰升级”对于一带一路近端且华人较多的非工业节点国家很可能在可预见的未来也是适用的。只不过由于柬埔寨华人特别多，这个现象特别容易观察，相对来说容易“新手上路”吧。


    哦对了，西哈努克机场最晚完工时间是 2022 年以前？（我认为按照当前情况应该会加快）


    当完工的时候，无论是过滤器的空运（平复需求波动）还是饮水设施建设，应该都已经完工了。


    旁边又是柬埔寨国家公园。


    同时中柬之间的贸易关系肯定要敲很多锤子，达成很多协议（和西哈努克港有关），这个时候应该会有很大一批先遣常驻办公人员进入。


    这个时候冷饮需求会提高，他们也不是每天去酒店或者高级餐厅的人。


    那个时候最初的刨冰爆发就可能出现——柬埔寨本地已经有人做了，但是我不觉得他们的思路一定能对上，就算能对上也不太可能一下子吃光市场，而刨冰市场又有区域特性，所以还是有得玩的。


    虽然这个生意也许微不足道，但是正是这些微不足道的生意汇聚在一起，才能形成一个人类聚集区和人类组织的繁荣与活跃。


    所以我知道参加欧神推广会的人是“神马三教九流都有”，我就觉得放心多了。因为只有这样，一个社会组织才能够快速成形，这光靠钱是买不来的。


    不过么……


    该死的是，因为我进行工作交接的原因，2020 年全年我都不太可能可以出国了，至少要到 2021 年初……时间真紧啊。我倒是很想托人在西哈努克的一些街头地方安装一些带有供电的网络摄像头——我发现东西并不是那种事先就想好了的，是不断观察之下发现了一些可能的点，然后再进行论证……所以我也说不出“此行具体要去观察什么”，我至少得看到，如果能多逛几圈更好了。


    ## 最后


    我知道的人买的是小地块，我觉得买小地块的人应该联合起来进行建设协同，区分好各自的功能优势区——如果说欧神和其他大户的优势在于集中，那么小地块的优势就在于灵活，可是灵活不能变成乱来嘛。


    我也似乎发现小地块的业主有很多并没有认真的互相联系磋商以后各自的项目合作？我觉得应该快点开始了（越早谈，后续建设成本徒劳消耗越少，而且小地块的人平均面积下人群更复杂，实际上更有利于各种实际生意经验的磋商，更容易得出新发展区域的可能的新需求，这也是一种优势）。


    事实上我去年看到小地块的位置我就有一种感觉（现在看到二期和三期后就几乎完全确定了）。


    这些小地块的位置完全就是“生意可以更复杂，但是普通规模生意更容易做的地方”。


    这些生意虽然可能或者肯定不是最大的，但是却极为重要——多样性。


    （所以欧神他们会把小地块放在那些地方，因为那些地方是最需要多样性的）


    如果没有这些小地块，那么没人愿意去做这样的普通规模甚至初始时极小规模的生意，那样的话对于整体发展是不利因素——也会给对手可乘之机，尽管现在他们的对手就算得到了这个机会也基本是死蟹一只了（欧神这帮人形成了通吃闭环，别人还玩个鸡巴），但是如果这些必要的多元化小服务如果没有被填充，那么就会给对手一个缓冲的机会，拖延欧神这些人闭环的升级速度，可能还要更多的劳心费力后来再提振这些多元服务。


    欧神的“收回土地”策略，大家稍微想想也明白了。


    因为这些小地块，其中很多人必然是抱着“我就投机个土地”的态度过去，然后等地升值就卖了。


    但是其中很多人是真的有想要做的和考察的项目。


    那么我想问一下：对于小地块这样的地方，这类的发展模式。


    一块小地够用吗？


    其实是不够的，因为在新发展时期，你不可能一下子就出现高楼大厦，而且游客也不想看到高楼大厦。


    所以对于国内的大多数小地块投资者来说，我觉得似乎他们错误估计了自己项目所需要的土地大小（用国内的仓储等计算方式来计算柬埔寨——这是错误的，但也是没办法的，因为小地块的大多数业主可能没有丰富的此类经验，而懂的人又是做大地块的，经验不通用）。


    因此真正的项目稍微扩张……那这些多元化服务的初始地块会成为“综合性总部”（虽然看上去可能就是后院棚子里的一大堆奇怪的东西）。


    结果就是地块很快就直接制约那些能运行项目的人的发展了。


    欧神收回土地的时机这样看起来就贼明显：在地块价值明显直观的会升值和保值以前，把土地收回去。


    这个时候已经有建设计划和初步项目的人是不会被收回的，但是那些没有的人很可能就会直接收回（之前他们抛售起来还没这么方便的买家资源呢）。


    然后？对于“项目总部可用面积不足及预期扩大”的“地主”来说，他们就有“土地兼并”的必要性。


    而此时如果和那些卖地的人谈，势必要让那些反应没那么快的地主警觉——这个时候他们会坐地起价，反而不利于交易（更不利于欧神的快速拓展多元化的目的）。


    但是欧神对他们收回土地只是“兑现承诺”，这是“应该的”，所以这些人根本就不会想什么，直接就兴高采烈的把土地送回去了。


    也就是说欧神是在法律框架内，利用预期周期（欧神更长更大），完成了一次实质的“有限产权”——收回土地，避免交易成本累积提高。


    这对于那些有项目的人来说极为重要，因为当时的钱也投在项目上了，钱变得更加紧缺。如果这样被拖住了，这些人的小项目被拖著，对欧神和所有大业主那也是有些不利的。


    当然欧神肯定也不是“省油的灯”。


    因为这个时候初步服务已经有了，一旦西哈努克机场开通+中柬国家级贸易磋商进一步增加，那么在这些小地块上肯定会更早地出现“复合办公需要”。


    也就是自发形成的 CBD——因为这块地块上的服务最先满足基础的办公和生活需要，西哈努克市装不下。


    然后欧神留几块小地盖大房子，便宜好用的办公小楼，直接“席卷额外溢出的小地块社会服务成果”……


    （这里的溢出的价值，就好比“公地悲剧”——大家都往公共的地方排污，结果大家都受害。但是这是一个反着的公地悲剧，是公地福利——大家各自建造这些东西，结果其服务互相重叠后产生了加成，只等着有人来收割这个加成）


    尼玛一本万利（真的是蚊子再小也是肉啊）——这些聚落对于小户来说不容易观察，但是对于全面零碎信息搜集的欧神那帮人来说几乎是单向透明的。


    所以如果小户不能综合各自的经验，分析出更有效率的“统计指标项目”来对抗欧神的“全局观察”，那么在这场战斗中必然会被欧神吃掉一大块。


    而且对于那些已经有项目的人，如果欧神把土地降价卖给他们，那个时候甚至可以优惠的提供某种贷款服务。


    甚至可以是“经营成功后”再给钱，很长的贷款周期。


    这样已经做项目的人不仅获利，而且还是得了很大的人情，欧神在这些“小而绝对必要甚至以后可能会变大的人”中间的名声就超好了。


    甚至为了避免显得“CBD 都被我吃了”，说不定还可以给“啊，大家辛苦了，xxx 到 xxx 的办公室大家可以优惠购买，或者低价使用 xxx 个月”。


    这样一来欧神可以借助 CBD 完成一次对小地块的实质权力集中（因为有干涉力了），那就可以减小“多元服务”和“主营业务”之间的协调成本和避免建设波动。


    （可恶，利用手中的大筹码来进行干涉，这是修正主义！）


    我丢，一本万利+名利双收？？？？


    民族资本家欧神？？？？？


    （虽然那些被收回土地的人可能一开始挺开心，然而后来可能骂起来……不过这似乎没什么关系了……）


    所以我要说，如果联合起来需要时间，那至少也应该做两手准备。


    1. 自己在小地块盖房子的时候，地基搞得严实一点，让自己的房子以后有可以方便升级的基础。

    2. 入户水电要留有够大冗余，也是方便扩展。这两个多花不了几个钱。

    3. 事先规划好够大的停车面积，留出来。

    4. 协调好各自的“允许小商家优惠入驻建筑和分工”，形成区域服务聚落，阻止欧神的“自盖 CBD 企图”（而且那几块没说太明白的“商业用地”说不定就是备份！隔离它！）


    这样一来，到时候欧神就算收回一部分人土地，他搞小 CBD，我们加盖的工期就比他的快（这些 CBD 都是原来就自发形成的，办公需要是经营者的连续需求，所以我们只要抢到欧神前面
    3 个月完工，我们就可以喂欧神吃屎），可以堵死欧神介入的必要性。


    一旦 CBD 没有必要，对欧神也许这只是 “蚊子肉”，但它的潜力是巨大的——越发展，这些个 CBD 和办公聚落的价值越高。


    甚至可能高到对欧神来说都不一定算是 “蚊子肉” 的地步（我是指对于现在的欧神来说）。


    我不知道各位怎么看，我反正觉得能吃的肉是坚决不让的——就算欧神是天王老子，也要搂下他两根金胡子来。


    （既然欧神要建城，那就要做好面对刁民的计划~木哈哈哈哈哈哈~这是游戏的一部分嘛~木哈哈哈哈哈哈）


    而且这样做了以后，欧神自然可能会采取 B 计划——更加优惠的（当时的价格）把土地卖给小地块的项目经营者。


    毕竟这个时候欧神这些大佬集团对于小地块的主要目的还是达到的，他们也是速度和稳定性第一位，不会真的在乎这些蚊子肉（但是这些蚊子翅膀蚊子腿，对于咱们这些人来说就是鸡腿肉）。


    这样以后欧神要协调区域发展，咱手里也有更多的筹码，可以获得一个更好的条件。


    我看下了小块，按照初期的基础多元化服务的内容，个人毛估 20~30 个真的做项目的人就能吃得下大部份（为了保险起见，可能会多留一点）。


    也就是说很可能未来小地块的最大收益人群就被设定为 20~30 个（最理想数字）——因为到后来欧神肯定会想方设法的收回土地，大部份没有项目的人会被说动（而且欧神这帮人实际上是可以很大程度上的干预市场背景信息的，对小地块蓄意散布一些针对性不利消息的话，应该能让大部份还没做项目的人跑掉。我怀疑现在有些价格异常的地块就是他们搞得铺垫，因为我感觉这些人中的一部分人有点奇怪，而且欧神的反应似乎也不符合通常的商业营销逻辑，所以我觉得这要么是蓄意的，要么就是顺水推舟）。


    剩下的事情就是欧神一边数钱，一边“让利”给这些人群加速发展即可。


    （“让利”之所以加引号，并不是说这不是让利，这确实是让利……但是想来想去又好气哦。）


    小地块的地主们站起来！


    此战史称：小地块独立战争！rua！


