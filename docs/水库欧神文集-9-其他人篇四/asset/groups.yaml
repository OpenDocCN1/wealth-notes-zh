    一个要看，一个要跳过，一直玩下去就双方都不爽。


    但是如果他们不是一直打游戏，断断续续的一起玩，那么女的陪人家看一遍剧情也没什么，男的可能对剧情了解已经不止一次了，反而能帮女人概括游戏的精彩部分和后续打怪线索。


    属于一个打怪为剧情，另一个是剧透更方便打怪。


    这样两个人一起玩游戏就很有乐趣啦。


    如果说这个例子还不够明显，因为很多人不打游戏，我就找一个更简单的例子。


    一个爱玩的男人和另一个也爱玩的女人，就拿“喝一杯”来说好了。


