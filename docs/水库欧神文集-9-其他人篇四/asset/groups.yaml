    \n  - 2：这个世界会有很多股这样的力量，在成为丛林世界的环境下，在各个地方打起限战。毕竟如果按照一般的商业贸易利润，打这样的战斗还是费劲，赚回来的周期太长——可是如果拿自己国家老百姓的钱去给自己的人打，那就不用白不用了。哪怕用残存的福利系统逼自己的老百姓变成奴工，也要给自己的派系争利益——大家都不会反对的。\n\
