    如果有人还不了解 BSC，那么详细情况请自己搜索一下，这个东西三言两语说不清楚。


    只要记得 3 点。


    +   1: 全面采用 BSC 管理模式的公司，那些早年被作为 BSC 模范企业的公司。

    除了那些“产品线很广”，生产流程很多（初始贵族很多）”的公司以外基本都死了，而且几乎都是瞬间暴毙。

    2: 美国联邦当局全面采用了 BSC 管理模式（军方优先）。

    3: BSC 只能用于管理层。


    通过之前的内容，大家不难知道为什么 BSC 管理只能应用于管理层，因为它本身是上层切分多个层级的战略组成后，在每个层级的决策利益群体中进行平衡计分。


    如果要对更多人计分，那么其管理成本会暴增，根本不可能可以承受——每个决策层之间是靠博弈平衡的，在任何时候都有固定的浪费，消耗的管理资源无论在任何时候都很大。如果每层都这么用，管理也就不复存在了。


    所以 BSC 只能是“贵族式”的。


    而暴毙的原因也很简单：内部失衡失稳定可能性很大，而且会从下到上失衡——连锁反应。


    同时 BSC 的更上级也会受到下层斗争的影响，他们会更多的考虑在下层中获得更大利益的单元——直属上级永远可以跳过“规章制度”和直属下级产生额外合作，你不可能
    100% 的监管它。


    最后这些“唯一赢家”的要求会自下而上的要求“全体二级头目”对老大连加压力，而此时老大已经没有全局信息了，想强行干预都基本不可能做到。


    于是就发生这样一个情况。


    > “老大傻了，老二疯了，老三老四在干死亲兄弟了。”


    这一切的全面开始，是突然的，是从“全体老二头目发飙”才能真正的被老大发现的，是“被发现的同时全面爆发的”。


    这就是因为 BSC 系统就是个“民主封建贵族”系统。


    它自然而然会发生“管理层合谋，直接通过自己的管理积极性和手头的资源（信息也在资源的范畴内）去影响决策，而且信息沿着层级上行几乎完全取决于层级内的平衡，不能直接观测”。


    虽然 BSC 系统里面有大量的章程和技巧试图避免这个问题的出现，但是基础信息系统的瓦解往往是体系核心问题，无法依靠依附体系存在的内部章程和技巧加以避免——甚至在事情发生后，加上这些章程和技巧反可能是信息扭曲集团的目的，增加了死的更快。


    这就好像保时捷和梅塞施密特一天到晚上，希特勒说一些有的没的“超级无敌扭转败局的神奇新式武器”一样。


