    \n这样一来，受教育程度较高的群体就更容易减少逻辑原点的数量——但是，一部分教育程度高了以后也可能恰好相反，有些人会把受教育的部分直接完全封装，绝不将这些逻辑和知识触类旁通的用在别的地方，就好像是守着什么秘密宝藏一样。\n\
