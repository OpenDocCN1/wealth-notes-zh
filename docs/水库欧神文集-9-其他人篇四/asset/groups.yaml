    只有在全局都完全超出原有生物适应范围的时候，渠限越多的物种越难存活下去，渠限越少一般更容易找到办法（改变代价很小）。


    也就是说，足够强大的演化深度还是能在“既定的核心环境背景里获得最大的生态位，照样可以避免在严重灾害中灭绝的能力，适应能力依然很强”。


