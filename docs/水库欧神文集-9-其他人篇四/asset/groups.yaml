    +   - 如果细看上文的话，各位就明白：这三者常常会互相影响。


    +   - 更大的适应宽度可以应对更大的变化幅度；更大的演化深度通常可以获得种群内的优势，甚至让种群居于更高和更广的生态位（上下通吃）。


    同时，更大的适应宽度经常以演化深度作为代价——因为宽度更大的物种，更容易“变来变去的凑合着适应”，而且在专项器官的深度演化上基础就比较落后。


    这就好像棘皮动物（比如海参和海星之类的一大堆奇怪动物）那样，虽然几乎算得上是有史以来一直活着的家伙，但是几乎所有种群都占不上高位——现在活的最好的，是分化相对更明确的海星。


    原因很简单：富的时候吃多一点，但也吃不了太多；穷的时候回家吃土也可以。


    问题是：稍微有点风吹草动，棘皮动物立马回家吃土。


    棘皮动物从细胞到结构层面上分化都比较低，巢限自然很少，适应宽度很大，但是因此也就更容易选择“眼前的苟且”——晚上想想千条路，早上起来走老路。


    当然了，如果深度很大，但是限制也很多，那么在环境变化达到了巢限的极限程度，那么整个物种就很可能灭绝。


    我举个简单的“巢限”的例子。


    欧神很会投资对吧？那么他的巢限核心是什么呢？


    当然是“个体与超大型经济利益组织的关系”，核心本体是“个体与超大型社会组织的生产整合链条”的关系。


    那么，在很多时候，反过来说欧神针对性适应的环境核心要素就是“超大型社会组织生产整合链条的存在”。


    要想让欧神的巢限对其生存和复制产生决定性影响，那必然是“超大型社会组织生产整合链条”发生了变化。


    比如说蘑菇云升起来了。


    欧神：卧槽，药丸。在这凄美的一幕下，我只能在这即将贫瘠的山顶上吟诗一首，纪念逝去的现代文明……


    一位身着民工迷彩服，端着 95 步枪的电锯狂魔从山下经过。


    他就很奇怪：耶？都这个时候了，为什么有个人还在山顶念诗啊？不管了，枪枪，今晚有肉吃喽！


    蘑菇云升起前吃电烤炉做出来的烧烤，蘑菇云起来后吃篝火烤欧神，只要椒盐下的对，味道都喷香。


    欧神快速打出 GG，变成腊肉。


