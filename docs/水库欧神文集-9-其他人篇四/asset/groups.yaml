    更关键的是，大规模登陆作战如果被提前准备，马来西亚势必会有所警觉。


    如果准备了一半，马来西亚就发动军事突袭，那么到时候新加坡准备一半的大规模登陆行动根本来不及转化为更小但立即可用的登陆力量。


