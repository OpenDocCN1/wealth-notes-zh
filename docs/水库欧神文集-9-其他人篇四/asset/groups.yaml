    这意味着一个社会管理系统，它已经觉得“我们当前的情况，已经可以给据大部分人的几乎所有方面都加上新的渠限”。


    这是“全局一刀切”。


    +   2：一旦形成了限制，那么我在“渠限”层面和它的更上层部份，就固定下来了。


