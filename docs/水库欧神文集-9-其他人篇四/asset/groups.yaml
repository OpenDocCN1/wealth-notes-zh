    局部的傲慢，局部的毁灭；全部的傲慢，全部的毁灭。


    但是对于“工具”，比如说我们整个社会的实践经验，那依然是客观上最优秀的一这是客观实践的成果，是最高的总结，是当前自身已知的最好方案。


    对于每个文明而言都是如此，这并不是一种傲慢，这只是无法选择的道路而已，就好像你无法选择自己的出生那样。


    因此不管您愿意还是不愿意，只要你想保存自己，你想延续自己，那么你实际上


    只有一个选择——哪怕你逃到外国去也是一样，你只是用更多的“不扣少保存”去试图换取“自以为更好也更稳定但少量保存”而已，本质上是不变的。


    这种做法，就和所有不入流，已经基本可以确定落败的文明系统是一样的——很显然，现在没人能够断定任何一个主要大型文明系统中的人需要采取这样的做法。


    因为这就相当于一个虽然不是当前最壮硕，但身体健康的人，去选择阉割自己并且进宫当一个小太监那样。


    这大约是不划算的，而且大多数时候，太监大多数也是没有繁殖能力的——他和他以后的存在，将会被彻底吞没。


    至少在大多数人眼里，和“剁鸡鸡”等价的努力，在自己的体系内活得并不会比太监差。


    所以，只能说是部分人没种，觉得自己的鸡鸡不值钱而已。


    叛逃者，怯战者，都是不同程度的太监罢了——而且很多人，是仅仅因为 0.7% 的劣势，选择了交出 JJ。


    为了区区 100 块钱里的 7 毛钱而卖掉自己的鸡巴——别人可能也觉得这七毛钱也挺重要的，但是对于那些人来说，拔一根毛去换还差不多。


    作为一个主流文明，我们的压力远比那些小文明要小得多，持续不间断存活的可能性大得多——我们只是差了远远不到 7 毛钱，而别人可能是差了 1 块钱。


    因此对于所有正常的个体来说，不论是否愿意，我们本身只能这么做。


    我们会献上所有的生命与力量，在最困难的时候保卫华夏种群的星火，在强盛时记录中华文明的精髓，并**让这些标准成为地球上所有智慧生命的公义**。从黄河的浅滩，直到星辰的尽头。  今曰为始，至死方休。


    太远的，我是说不了。


    但是我们现在最大的对手，正在衰落的 BSC 文明——但是注意了，最大的对手只是对手，眼前的对手只不过是生存的一个小小考验，要想发展，我们其实也需要着重“下一个对手”。


    看过上文的人，一定看到过“他们的末日文化”，他们的方舟文化。


    而它们是“神授君权”——这里得用“它”，因为“他们”针对的是与我们没有本质区别的人，剩下的都是“它们”。


    大家也一定记得中国是“天道”，是“君神平权”。


    那么，当我们强盛了，它们来招惹我们。


    它们面对的是什么？它们害怕的是什么？


    它们对我们的害怕不是对人类种的害怕，它们也并不害怕自己神明。


    那它们害怕的是什么？


    它们，害怕的是：“天启”。


    我们对于它们来说，就是“天启”的出现，它不是上帝之鞭，不是其它任何的惩罚，我们是天启——我们每个人，都是天启骑士。


    只不过，我们不止是4个天启骑士，我们是1400000000 天启骑士。


    传说中的天启骑士，在中国人身上，从神话中再次具象化的出现在了现实世界——它们有理由害怕。我们，生来就是它们的恶魔，它们的梦魇，它们恐惧的源泉。


    看看《圣经》中对“天启”的描述吧，它们看我们的样子，它们的担忧和恐惧，它们抹黑我们的套路。


    不正像它们面对天启骑士时候的表现么？


    （位于《圣经新约》末篇，一切之始，一切之末）


    天启之后呢？


    我不知道，但是终有一天，我们会暂时被OKR 击败。


    但那不会是永远的，只要在地球上，只要还有人类，KPI 系统就不会被OKR 系统彻底击败，也绝对不会长期边缘化。


    因为我们的优势，是“两极”——永远不能独存，只会此消彼长。


    金字塔结构和网络结构，永远生生不息——连同选择了两者，并且极力在这一路线上发展的文明一起。


    这个过程一定会在这个星球上持续下去，无论它有多么的残酷与血腥，无论它要付出多么大的代价和牺牲。


    > 一个文明长期的生存经验，总会留下文化烙印——总结自己的死亡，也是一种经验，每个文化都有独特的总结。


    但是每个文化，又总是能总结到所有不同的部份，只是深度的差异而已。


    末日一章中。


    - 白马为瘟疫骑士，代表着可以扩散和渗透的痛苦，痛苦源自于无法捉摸的侵蚀。

    - 红马为战争骑士，代表的是席卷而来的滚滚铁流，痛苦源自于无法阻挡的力量。

    - 黑马为饥荒骑士，代表着无法忍受的无穷之匮乏，痛苦源自于无法满足的欲望。

    - 灰马为死亡骑士，代表的是难以逾越的永恒障碍，痛苦源自于无法超越的智慧。


    欧美面对白马时，它们无力抵抗，便想像生物和病毒共存一样，希望通过包容妥协来解决问题。


    欧美面对红马时，它们无力抵抗，便想像困兽和猎人搏斗一样，希望通过游走遏制来规避锋芒。


    因为它们本能的知道，它们已经对付不了了，他们在两级上都没有优势——既没有很强的免疫力，也没有很强的凝聚力。


    在上甘岭的时候，它们见到了红马的奔腾。


    在阿富汗的时候，它们见到了白马的跃动。


    这两匹马及两位骑士，是文明更迭的最基本方法和步骤，任何更迭的本质都离不开它们。


    而黑马和灰马是永恒的难题，所有的文明对于他们的态度，都引导文明走向了不同的方向。


    黑马和灰马，它们血腥无比，却并不是罪恶。*自然很严酷，但自然并不邪恶。*这两位骑士就是文明生命的原动力。


    我们为了胜利，为了更多的延续和我们更相似的个体。


    *现在，是我们“走出去”的时候了——无论是任何方式。*


    无论是商业投资，无论是工作娱乐，或者是将来必然到来的，更直接的方式。


    天启是什么样呢？我不知道。


    不过一些内容和直观感受，可以用两个视频表达。


    https://www.bilibili.com/video/av18742266/?spm_id_from=333.788.videocard.1


    https://www.bilibili.com/video/av19923689/?spm_id_from=333.788.videocard.1


    看第一个视频的时候。


    这位为了保护孩子而进入战机参战的母亲是谁呢？孩子又是谁呢？


    对于一个文明和生活于其中的人来说。


    文明既是每个人的生母与养母，又都是所有人的孩子。


    # **因为文明，它是我们所有人的过去，所有人的现在和所有人的未来。**


    对于它来说，我们每个人的生命都很短暂，只是光阴一瞬，成为历史。


    对于我们来说，它对于我们每个人来说都很漫长，横跨我们所有的时间，以及我们不能以个体经历的一切。


    **_生命万物皆有始有终，任何的肚败荣辱都不过是刹那之间，但是只有那些面死而生，不断前行的事物才能既变化又永恒。_**


    哦对了，在天启骑士再临的时候，有一个 BSC 国家应该能保存自己。


    不是美国，不是英国，不是俄国。


    这个“保存 BSC 火种的国家”，必定是髮国。


    因为没有人在髮国投降前占领巴黎。


    （这虽然确实是网络上的“乳法”段子，但是……仔细想想还确实可能这样：因为那个时候它的文化受害其实是最小的，完全可以收拢到时候残存的 BSC 系统下的其它同类资源继续好好的过自己的小日子啊，虽然髮国自己内部经常乱糟糟的就是了……不过他们活得好
    的时候，不也经常是因为趁机捡了一大堆破烂发财么？真是髮国传统。）


    （妈的，企业家的社会责任髮国也老喊，而且还是西方世界里最要求去做的，但做的又贼稀烂，这些也就算了，还特别喜欢带头搞革新，搞得还往往比别人稀烂。对于这样的国家，我真不知道该说什么好。）


    不过说真的……髮国这玩意儿确实混杂的厉害，基本上它哪个管理模式都搞过，而且尝试发展过，不同的社会局部的大系统还用过（甚至是同时的）。


    **我觉得丫就是个打着“带头革新”但实际上是借题发挥后走老路，靠打着革新带头人的旗号蹭百家饭的家伙。**


    硬是通过脸皮厚就功成名就的国家，这还真是稀奇。


    （KPI，BSC，OKR 之外如果还要分一类，那髮国就是单独一类，它的管理方法是“不管什么模式，反正能要钱不要脸就对了”）


    **等到 BSC 系统失去优势甚至基本完结，KPI 和 OKR 之间，大概还会有个吃残余市场而且不太弱的髮国来回当搅屎棍。**


    这下好嘛，髮国终于接过了英国的欧洲搅屎棍，还发扬光大了——哈哈，终于把英国打趴下了呢？我法兰西天下无敌啊！


    这样一篇先详细说明，后理性鼓劲的文章，最后居然以乳法收场……


    这我在开始写文的时候还真是没万万想到啊。


    （不要问为什么没想到，问就是历史的进程，再问就是人的生命真是不可预料，还要问就是爱的供养，再问自杀）


    # 爱情和喜欢有什么区别——工业化大规模生产时代的爱情与信息化服务业时代的爱情的变化（系列文 1）


    emmmmm……其实在年前，我就准备了很多想好的内容，包括以前说过要写的内容。


    但是因为各种情况，一方面不该把这些东西现在写出来啦，另一方面也有个人原因。


    因为不能推辞的年底聚会活动，又因为狡猾狡猾的朋友以及同事，我在24号早上一顿宿醉蒙头觉以后……常规航班已经无法飞往南京了，机场封了。然后我就在疫情的正中心咯~现在还在。


    不过各位不用担心我这边的问题， because我有应对各种情况的准备。


    哦……当然了，在面对某些情况下……我的对“各种情况”的准备的涵盖面“可能”会“大一点点”。


    当然有时候我的“一点点”可能也会比很多人大那么“一点点”。


    对于那些说我“你TM是在准备打核大战吗？”


    那完全是毫无根据的污蔑，纯属胡说。


    我所做的一切都是常规操作！


    (注：“常规”的最终解释权归我所有)。


    为了响应要求，我当然也要留在当地，不做私自逃离的自私鬼。


    （“等等？你之前不是说 是为了不离开观赏社会行动的前排特等座么？”；


    “我根本听不懂你在说什么。”）


    当然，也为了这些“一点点”，我才是现在才能闲下来。


    “等等，你之前说过好几次会闲下来的啊，你说当你准备好了那个就闲下来啊！”


    “计划要根据实际需要改变！增加准备是很正常的！”


    “可是你之前那个准备已经到……”


    “你好烦啊！”


    （然后这篇文章又被拖了一周以上，因为我又开始干“一点点”事情。）


    现在别说自制口罩滤材生产线，自制次氯酸钠消毒水反应器也在楼顶成功运作，只不过好像正规消毒水都已经足够使用了（就当有备无患啦）。


    连紧急时期的临时女朋友都搞上了——我觉得，我应该停手，事情确实有点搞得有那么一点点过头（求求我自己，不要再搞了，我怎么就这么管不住自己的手呢）。


    不说这些了，大过年的时候聊开心的（嗯……我在大年三十写的，到了2月15才写到这儿——嗯……我又来了，现在是3月9日。因为到后来水库公众号疯狂原地爆炸……）。


    所以我也一边做东西一边思考人生，思考社会，思考宇宙，思考做菜方法。


    （“你这样边做边想事情，就不会分心，然后切到手指头吗？”；“会啊。”）

