    ### 定義


    十字線：開盤價與收盤價相同，沒有實體棒，上影線與下影線幾乎等長。


    一字線：當天開盤價、收盤價、最高價、最低價都是同一價，表示當天是漲停板或是跌停板。


    ### 解說


    1. 十字線表示，當天多方與空方力量相當。上漲到高檔，出現空方相抗衡的力量，是轉向下的訊號。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_139_0.png)


    2. 下跌到低檔，出現十字線，表示當天多方與空方力量相當，下跌出現多方抵抗的力量，是轉折向上的訊號。


    3. 十字線出現在上漲或下跌行進中，可視為多空當天的休戰，多頭次日可能繼續上漲，空頭次日可能繼續下跌。


    4. 出現十字線時，要注意第二天K線的走勢，以確定是休戰還是變盤。


    5. 當天開盤漲停板的一字線，如果位於多頭走勢的起漲位置、盤整的突破位置、突破壓力的位置，是強勢上漲的表現。這是主力刻意造勢的結果，因為一開盤就漲停板，一般人根本買不到，所以不一定有大成交量。有經驗的投資人，會保留該股繼續觀察，如果是強勢股或飆股，是做多的好標的，可以鎖股操作。


    6. 在空頭下跌走勢中，如果出現漲停板的一字線，是強力反彈的現象，後續可能止跌回升或打底。


    7. 當天開盤跌停板的一字線，如果位於空頭走勢的起跌位置、盤整的跌破位置、跌破支撐的位置，是強勢下跌的表現。這是主力刻意造勢的結果，因為一開盤就跌停板，一般人根本賣不掉，所以沒有大成交量。要謹防次日恐慌性大量下殺，如果是頭部剛開始，是做空的好標的，可以鎖股操作。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_140_0.png)


    資料來源：富邦e01電子交易系統


    ① 下跌低檔出現放量變盤的蜻蜓線，注意次日走勢。

    ② 次日開高走高，出現帶大量長紅K線，轉折向上。

    ③ 高檔出現變盤十字線，注意次日走勢。

    ④ 連續5日沒有突破變盤十字線，然後出現變盤倒鉤線。

    ⑤ 股價漸漸下跌，出現大量和變盤天劍線，轉折向下訊號。次日長黑K跌破變盤天劍線，呈現轉折向下的空頭走勢。


