    ### 一日封口：高檔「邂逅」雙K線


    #### 定義


    2根K線構成上漲高點或頭部反轉向下的組合，這2根K線為中長紅及中長黑的實體，可以有小的上下影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_158_0.png)


    #### 解說


    1. 上漲走勢到明顯高檔，出現中長紅K線，第2天出現中長黑K線，黑K開高出現賣壓走低，收盤接近中長紅K線的收盤價，是一組上漲遇壓力的止漲K線訊號。

    2. 這組雙K線也可視為「一日缺口封閉」，當天向上跳空開高，但收盤回到昨日紅K線的收盤，把開盤的缺口給封閉，是弱勢的表現。


    #### 精通


    1. 遭遇組合是5組反轉訊號中最弱的，只能視為止漲，多頭可能還會續漲，最好再觀察一天確認是否反轉。

    2. 多頭上漲中出現遭遇組合，如果爆大量，轉折機率大增，做多要小心，不可追多。

    3. 空頭反彈出現遭遇組合，是反彈結束的訊號，要把握做空的機會。


