    ### 高檔 3 根 K 線轉折向下的變化組合


    #### 組合 2：孤島夜星


    1. 上漲高檔或空頭反彈出現中長紅 K 線，次日出現向上跳空的變盤線，如果第 3 天出現往下跳空下跌的中長黑 K 線，稱為「孤島夜星」組合。

    2. 出現「孤島夜星」組合，是強烈向下反轉的訊號，如果同時出現大量或爆大量，反轉更確認。

    3. 變盤線越多，反轉下跌後力道越強。

    4. 出現「孤島夜星」組合，在多頭上漲趨勢中表示將強力回檔，多單要出場。在空頭反彈時，將繼續下跌，要把握做空。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_205_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_205_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_206_0.png)


    上漲到高檔，出現帶大量的長紅 K 線。之後出現跳空向上的 3 根變盤線，接著出現向下跳空跌停板，這是「孤島夜星」的訊號（跌停為長黑）。


    #### 組合 3：母子變盤


    1. 上漲高檔或空頭反彈出現中長紅 K 線，次日出現懷抱變盤線，第 3 天出現往下中長黑 K 線下跌，稱為「母子變盤」組合。

    2. 出現「母子變盤」組合，中長紅 K 線的最低點被跌破，向下反轉更加確認，如果同時出現大量或爆大量，反轉更明顯。

    3. 出現「母子變盤」組合，在多頭上漲趨勢中即將強力回檔，多單要出場。在空頭反彈時，將繼續下跌，要把握做空。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_206_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_207_0.png)


    資料來源：富邦 eQ 電子交易系統


    上漲到高檔，出現帶大量長紅 K 線。次日出現母子懷抱十字線，然後長黑下跌，這是「母子變盤」的訊號。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_208_0.png)


    資料來源：富邦 eQ 電子交易系統


    - 上漲到高檔，出現帶大量的十字變盤線。次日出現跳空長黑下跌，這是「孤島夜星」的訊號。

    - 上漲到高檔，出現帶大量長紅 K 線。次日出現母子懷抱十字線，然後長黑下跌，這是「母子變盤」的訊號。


    #### 組合 4：雙星變盤


    - 上漲高檔或空頭反彈出現中長紅 K 線，之後連續在高檔出現 2 根變盤線，第 4 天出現往下的中長黑 K 線，稱為「雙星變盤」。

    - 出現「雙星變盤」組合，雙星呈現「孤島轉折」，向下反轉訊號更強，如果高檔同時出現大量或爆大量，反轉更明顯，多單要出場。在空頭反彈時出現「雙星變盤」組合，將繼續下跌，要把握做空。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_208_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_209_0.png)


    資料來源：富邦 eQ 電子交易系統


    - 上漲到高檔，出現帶大量的長紅 K 線。

    - 出現連續 2 天雙盤線。

    - 右邊出現對稱下跌的中黑 K 線，高檔出現雙星雙盤組合，股價反轉。


    #### 組合 5：雙鴉變盤


    1. 上漲高檔或空頭反彈出現長紅 K 線，之後連續在高檔出現 2 根中長黑 K 線，第 4 天出現往下長黑 K 線下跌，稱為「雙鴉變盤」。

    2. 出現「雙鴉變盤」組合，向下反轉訊號強烈，如果高檔同時出現大量或爆大量，反轉更明顯，多單要出場。在空頭反彈時出現「雙鴉變盤」組合，將繼續下跌，要把握做空。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_210_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_210_1.png)


    上漲到高檔，出現帶大量長紅 K 線，之後出現 2 根中黑 K 線，接著長黑下跌，跌破帶大量長紅 K 線的最低點，形成「雙鴉變盤」訊號，多頭反轉。


    #### 組合 6：群星變盤


    1. 上漲高檔出現中長紅 K 線，之後在高檔連續出現 2 根以上的變盤線，再出現往下中長黑 K 線下跌，稱為「群星變盤」。

    2. 出現「群星變盤」組合，群星數量越多，向下反轉訊號越明確，同時下跌的時間越長，短期不容易上漲，多單要出場，也可以做空。


