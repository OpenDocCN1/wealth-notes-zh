  md: "\n## 第二篇 第5章 錘子線、吊人線、倒錘線\n\n倒鏈線實體突破，必須有大量；無量的倒鏈線，即使實體突破，也容易拉回。\n\n未突破壓力前的K線出現爆大量的長紅K線，突破當天如出現倒鏈線，要注意股價容易回檔。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_110_0.png)\n\n高檔出現爆量吊人線，注意行情轉折。\n\n\
    高檔出現2次倒鏈線，是轉折向下訊號，次日跌破倒鏈線實體下沿，多頭架構破壞，確定轉折向下。\n\n在空頭下跌出現倒鏈線：\n\n- 次日開高向上，收盤高於倒鏈線實體上沿，可確認為轉折向上，如果倒鏈線當天或前1、2日出現大量或窒息量，更可確認為反轉。\n\
    - 連續出現2根倒錘線，或者第2根倒錘線是跳空向上，更能確定走勢是反轉向上。\n- 出現2根倒錘線，即使次日再下跌，要注意低點也不會太多，謹防假跌破、真向上。\n\
    - 出現2根倒錘線，第2根倒錘線最高點被突破時，空單要出。\n- 空頭低檔時，K線頻頻出現倒錘線，表示多方屢次試圖反攻，要注意股價不跌或回升。\n- 下跌遇到重要支撐位置，出現倒錘線，表示支撐力道出現，要注意次日股價開高上漲訊號。\n\
    - 空頭下跌時，倒錘線跌破前面低點、盤整末端跌破下頸線，要確認下跌是否跌破重要支撐，觀察重點如下：\n  - 只要倒錘線的實體跌破，即使上影線沒有跌破，仍為有效跌破，但要注意後面幾天的走勢。\n\
    \  - 倒錘線跌破，不一定有大量，有量和無量的倒錘線實體跌破，都會造成下跌。\n  - 未跌破支撐前的K線出現爆大量的長黑K線，或窒息量的黑K線，接著出現倒錘線，可視為止跌訊號，後續要注意是否反轉。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_112_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n\
    - 高檔出現並排雙倒錘線，同時爆大量，注意行情轉折，次日長黑K跌破倒錘線實體下沿，轉折向下。\n- 反彈出現倒錘線，是轉折向下訊號。\n- 倒錘線跌破前面倒錘線實體下沿，同時波浪型態出現頭頭低，多頭架構破壞，確定轉折向下。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_113_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n\
    - 高檔爆大量的中紅K，次日開盤向下，出現股價不漲，此時要注意轉折訊號。\n- 出現倒錘線，跌破前3日K線低檔是轉折向下。\n- 低檔出現倒錘線，但是次日股價開低，持續下跌。\n\
    - 低檔再次出現放量倒錘線。\n- 次日股價開高走高，收盤突破前一日倒錘線的實體上沿，股價易反彈。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_114_0.png)\n\
    \n高檔爆大量的紅K倒鉤線，次日開高走低，出現股價不漲，要注意轉折回檔訊號。\n\n連續3天出現帶大量倒鉤線，雖然上影線過前面高點，但收盤價一直没突破前面高點，均為假突破。\n\
    \n再出現大量後的轉折向下黑K線，頭部形成三尊頭，空頭即將完成。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_115_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 下跌到低檔出現大量後的倒錘線，是轉折向上訊號。\n- 次日跳空向上，確認轉折向上。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_116_0.png)\n\
    \n- 下跌到低檔出現窒息大量後的倒鏈線，是轉折向上訊號。\n- 次日跳空向上，確認轉折向上。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_117_0.png)\n\
    \n上漲到高檔出現大量長紅，接著出現小十字線及中黑的倒錘線，次日開低走低，跌破倒錘線實體，股價轉折向下。\n\n低檔出現大量長黑，次日出現倒錘線，第三天開高走高，長紅突破倒錘線實體，確認轉折向上。\n\
    \n多頭回檔接近月線，出現帶大量錘子線，表示下檔有支撐，後續股價不跌，股價容易繼續上漲。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_118_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 上漲到高檔出現帶大量倒鍵線，收盤沒有突破前面高點A，接著3天的股價都無法過高，股價容易拉回。\n- 觀察之後的盤整走勢，每次放大量的倒鍵線之次日走低，都會造成股價拉回。\n\
    \n## 第6章 短紡錘線、長紡錘線、天劍線、蜻蜓線\n\n### 短紡錘線：會上升出現下影線的帶量突破K線\n\n#### 定義\n實體是中長紅或是中長黑，含有上影線及下影線。\n\
    \n#### 解說\n當天無論是紅K線多方強，或是黑K線空方強，都出現上下的拉鋸，換句話說，當天不是一面倒的強多或強空。\n\n#### 精通\n- 在一般位置的判斷上，與中長紅K線及中長黑K線差不多。\n\
    - 在關鍵位置表示，上方出現一些壓力，下方出現一些支撐。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_120_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n上漲到高檔，陸續出現含上影線及下影線的K線，多空開始拉鋸，注意股價的轉折下跌。\n\n### 長紡錘線：會呈上影線及長下影線的實體K線\n\
    \n#### 定義\n上下影線很長，至少是實體的2倍以上。小的實體在中間，實體可以是紅K或黑K。相同的線型，不分紅K或黑K，實體在上漲的頂端或下跌的低點，都稱為長紡錘線。\n\
    \n#### 解說\n這種K線表示當天多空雙方拉鋸激烈，最後收盤接近開盤，呈現多空平手的格局。在高檔，表示多方上漲已經遭到很大的壓力，股價變動劇烈，盤中一度向上，但是漲勢受阻，最後回到接近原點。在低檔，表示下跌遭遇很大的抵抗，有止跌現象，盤中下跌到最低點後出現買盤向上拉的多方力量，最後的收盤拉到接近開盤價。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_121_0.png)\n\n#### 精通\n- 強勢上漲到高點，出現長紡錘線，表示當天出現多空激戰。必須觀察次日的走勢，才能夠確認多空交戰結果是多方或空方勝。\n\
    \  - 次日開盤向下跳空大跌，多頭上漲架構瓦解的可能性大大提高，如果有大量，容易一日反轉或做頭。\n  - 次日開低向下或開高走低，收盤跌破長紡錘線的實體下沿，轉折向下的可能性大增，多單要考慮準備出場。\n\
    - 在高檔，長紡錘線當天或前1、2天爆出大量，次日開低向下或開高走低，幾乎可以確定是昨日主力出貨。\n- 高檔出現連續2～3根的長紡錘線，或搭配其他下殺的K線訊號（如高檔長黑、變盤線、大量開高走低下跌黑K等），轉折向下的機率越高。\n\
    - 上漲到壓力位置前出現大量長紡錘線，轉折回跌的機率很高，要注意次日走勢。\n- 強勢下跌到低點，出現長紡錘線，表示原先空頭走勢的下跌之後，有多方買進，同時盤中多方曾經上攻到高點，是止跌的訊號。次日出現以下情況，下跌走勢可能改變，甚至是空頭架構被破壞而轉折回升。\n\
    \  - 次日開盤向上跳空大漲，空頭結構瓦解的可能性大大提高，容易一日反轉或打底。\n  - 次日開高走高或開低向上，收盤突破長紡錘線實體的上沿，轉折向上的可能性大增，空單要考慮回補。\n\
    - 在低檔，長紡錘線當天或前1、2天爆出大量，次日開低向上或開低走高，幾乎可以確定是昨日主力吸貨。\n- 下跌到低檔出現連續2～3根的長紡錘線，或搭配其他止跌的K線訊號（如大量長紅、變盤線、大量開低走高上漲紅K吞噬等），轉折向上的機率越高。\n\
    - 下跌到支撐位置前出現大量長紡錘線，轉折上漲的機率很高，要注意次日走勢。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_123_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 上漲到高檔，出現帶大量含上影線長紅，後續股價要續漲。\n- 連續3日出現長紡錘線橫盤，注意可能轉折向下的變盤，股價不可以下跌。\n\
