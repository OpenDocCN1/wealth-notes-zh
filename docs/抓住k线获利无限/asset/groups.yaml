    \n- 上漲中出現2根長紡錘K線，稱為雙星變盤，次日股價如下跌將回撤。\n- 高檔出現1根倒鉤K線、2根長紡錘K線，次日股價如下跌將回撤。\n- 上漲中出現2根長紡錘K線，次日股價如下跌將回撤。\n\
    - 上漲中出現2根長紡錘K線，次日股價如下跌將回撤。\n- 股價回撤跌破前面低點，趨勢改變。\n- 反彈中出現2根長紡錘K線，次日股價如下跌空頭完成。\n\n\
    ### 定義\n天劍線：上影線很長，至少是實體的2倍以上，實體很小甚至沒有實體，下影線很短。實體不分紅K或黑K，在上漲的頂端或在下跌的低點，都稱為天劍線。\n\
    \n蜻蜓線：下影線很長，至少是實體的2倍以上，實體很小甚至沒有實體，上影線很短。實體不分紅K或黑K，在上漲的頂端或在下跌的低點，都稱為蜻蜓線。\n\n###\
    \ 解說\n- 在高档，天劍線及蜻蜓線都是轉折向下的重要訊號。在高档的天劍線，代表多方上漲已經遭到的壓力，當天股價變動劇烈，盤中一度向上，但漲勢受阻，最後回到接近開盤或開盤價。在高档的蜻蜓線，代表多方開盤後，空方盤中下跌到最低點，雖然最後拉回到接近開盤或開盤價，表示多頭上漲已經出現空方下跌的力量，盤中多方的力量很小。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_127_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_127_1.png)\n\
    \n- 在低檔，天劍線及蜻蜓線都是轉折向上的重要訊號。在低檔的天劍線，代表空方開盤後，多方盤中上漲到最高點，雖然最後拉回到接近開盤或開盤價，表示空頭下跌已經出現多方上漲的力量，盤中空方的力量很小。在低檔的蜻蜓線，代表空方下跌已經遭到很大的抵抗，當天股價變動劇烈，盤中一度向下到最低點，但是遭到多方力量的上漲，最後拉回到接近開盤或開盤價。\n\
    \n### 精通\n- 強勢上漲到高點，出現天劍線或蜻蜓線，是上漲的重要變盤線。要密切注意次日走勢，確認是否變盤，尤其是當天或前一日如出現大量，變盤的機率更高。\n\
    \  - 次日開盤向下跌空大跌，多頭上漲架構瓦解的可能性大大提高，如果有大量，容易一日反轉或做頭。\n  - 出現帶大量的天劍線或蜻蜓線之後回跌，日後股價即使再上漲，往往都無法突破天劍線或蜻蜓線的最高點，波浪型態容易出現頭頭低的做頭。\n\
    - 多頭上漲的途中，如出現天劍線或蜻蜓線，次日走勢非常重要，換句話說，次日如果下跌，則容易回檔，若是連續2天或3天都出現天劍線或蜻蜓線，變盤機率更高。\n\
    - 強勢下跌到低點如出現天劍線或蜻蜓線，是重要變盤線訊號。要密切注意次日走勢，確認是否變盤，尤其當天或前一日出現大量或窒息量，變盤的機率更高。\n  - 次日開盤向上跳空大漲，空頭下跌架構瓦解的可能性大大提高，如果有大量或窒息量，容易一日反轉或打底。\n\
    \  - 下跌的天劍線或蜻蜓線如果轉折上漲之後，股價即使再下跌，往往不容易跌破天劍線或蜻蜓線的最低點，波浪型態容易出現底底高的打底。\n- 空頭下跌的途中，如出現T字線與墓碑線，次日走勢非常重要，換句話說，次日如果上漲，則容易反彈，若是連續2天或3天都出現天劍線或蜻蜓線，變盤機率更高。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_129_0.png)\n\n- 上漲行進中出現蜻蜓線，次日股價如果不跌，將會續漲。\n\
