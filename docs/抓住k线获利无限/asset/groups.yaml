  - '[PAGE 273]


    # 定義


    在上漲或反彈行進中，長紅K線之後出現「母子懷抱」黑K線，再出現跌破前面長紅K線最低點的長黑K線，稱為「內困三黑」組合。「母子懷抱」是變盤訊號，「內困三黑」是變盤反轉確認的訊號，空頭進場做空，多頭可搶短線回跌。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_273_0.png)


    # 解說


    在上漲高檔出現長紅K線，次日出現1根黑K線，被長紅K線包起成「母子懷抱」表示多方力道被空方開低走低黑K線奪回，空方再1根下跌長黑K線，跌破長紅K線的最低點，就完成「內困三黑」組合，成為空方強力下跌或回檔的訊號。


    # 精通


