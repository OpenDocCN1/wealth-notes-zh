    \    - 缺口操作5大秘訣 ……… 300\n\n### K線交易法 ……… 308\n\n使用K線交易法，只要嚴守紀律執行，很容易買到短線相對高點，輕鬆獲利入袋。\n\
    \n- 第1章：K線交易法的操作訣竅 ……… 310\n- 第2章：V形反轉的K線交易法 ……… 316\n    - V形反轉：如何搶空頭急跌的反彈？………\
    \ 316\n    - 倒V形反轉：如何搶多頭急漲的回檔？……… 324\n\n---\n\n## 不要看新聞買股票：K線能讓你逃過一劫，也能讓你精準獲利\n\
    \n2012年3月28日經濟日報頭版標題：「鴻海473億入股夏普。」許多投資人看到這則新聞後都認為，鴻海跨出了「聯日抗韓」的第一步，前途一片看好。\n\n\
    當天鴻海（2317）開盤跳空大漲3.7%，股價上漲4元，收盤113元，上漲5元，漲幅高達4.6%，同時爆出10萬張的大量。\n\n次日盤中高點117元，收盤116元再上漲3元，同時再爆量12萬張大量，從此以後，股價都沒有再回到117元的高點，2013年10月1日的收盤價是75.5元。換句話說，當天看到消息去買股票的投資人，不僅被套牢1年7個月，而且還賠了30%的本金，真是情何以堪。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_10_0.png)\n\n資料來源：富邦eGi 電子交易系統\n\n\
    ### 看懂K線 趨吉避凶\n\n以技術分析的K線訊號來看鴻海的圖形走勢，可以分為下列幾點來討論：\n\n- 這一波多頭正確的進場位置在3月22日，當天回檔到月線有支撐，而且放量紅K上漲，突破前一日的最高點，收盤105元買進。持股到3月28日利多的跳空大漲，以多頭上漲特性，過高容易拉回，正是準備獲利出場時機。\n\
    - 再看3月28日利多爆量的跳空大漲，K線收盤呈現的是有上下影線的紡錘線，表示當天多空激戰，有人利用利多機會在出貨，也就是說，當天爆量，價漲，但是K線不好，即使看報利多買進，也要注意不能出現跌破紡錘線轉折向下的黑K線反轉訊號。同時注意大量向上跳空缺口是重要支撐，近期不能回補，否則會成為竭盡缺口。\n\
    - 次日再爆大量，紅K上漲，持股續抱，當然沒有問題。\n- 3月30日，收盤K線出現雙盤的十字線，這時手中有持股的投資人，要特別小心股價反轉，因為出現「高檔爆量，股價不漲」、「大量紅K，股價該攻不攻」、「高檔紅K母子懷抱」的K線三大警訊，必須密切注意第二天的開盤走勢。\n\
    - 4月2日，開低走低，黑K收盤跌破最大量紅K的低點，三日K線形成內因三黑的下跌組合，轉折向下確認。3月28日利多大漲搶進的多單，此時應該迅速出場。\n-\
    \ 4月17日再出現下跌長黑K，5天的K線組合是夜星反轉訊號，同時波瀾型態已經呈現頭頭低，頭部即將成形，看消息於3月28日利多大漲搶進的多單，是最後的逃命機會，當天收盤價110元，投資人大約賠損3~5元。\n\
    - 如果看不懂K線變化，沒有即時處理股票，後來一路下跌到80.9元才初步止跌反彈、下跌28%，而且到現在一年多還沒有解套。\n\n### 彰銀併台新銀股民慘遭套牢\n\
    \n2013年2月20日工商時報頭版斗大標題：「彰銀擬併台新銀。」這對於台新金（2887）是個大利多，許多投資人在當天早上開盤時就搶買台新金。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_12_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n當天台新金（2887）開盤跳空大漲，沒一會兒就漲停板，股價上漲13.1元，同時爆出16萬張的大量。比鴻海還慘的是，當天漲停板打開，一下跌，收盤12.7元，當天賠錢套牢，次日直接下殺。\n\
    \n### K線領先反應原因隨後才到\n\nK線永遠領先反應市場的基本面、消息面和心理面。在股票市場，散戶最弱勢，不可能先知道股票漲跌的原因，但是知道原因的人必然會做出買或賣的動作，只要有動作，就會反應在當天的K線及成交量。所以，只要能夠精準研判K線及成交量的變化，一樣可以精準獲利或避開風險、逢凶化吉。\n\
    \n我們來看晶豪科（3006），這檔股票在2月25日出現放量長紅K線，突破高點多頭確認，從收盤價25.25元開始上漲，之後一直維持多頭趨勢，一直漲到約40元開始橫向整理。一般散戶並不知道這檔股票為何會上漲那麼多，到了5月13日工商時報的頭版出現「晶豪科MCP接單滿到Q3」的標題，散戶才知道原因。當天股價衝到42.3元，但多頭已經上漲了67%，所以技術面永遠領先消息面。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_13_0.png)\n\n資料來源：富邦e01 電子交易系統\n\n\
    ### 精通K線 精準獲利\n\n俗話說：「在股票市場，會買只是徒弟，會賣才是師傅。」「買對位置成功一半，賣對位置才是全部成功。」一般投資人之所以無法精準掌握進出位置，主要還是無法正確解讀K線透露的語言。本書的目的是，幫助讀者提升判讀K線的功力，掌握K線訊號，買在最佳進場點，賣在相對高點，成為股市獲利的大贏家。\n\
    \n---\n\n## 談自助、人助、天助：所有成功的緣分，都起源於自己\n\n教學3年多以來，每次有學生告訴我關於股票賠錢的經歷時，總是讓我很難過。在這段教學時光，看到學生從開始學習，到看懂股票而賺錢，是我最開心的事。\n\
    \n其實，他們的成功不是沒有原因，每次他們謝謝我的時候，我都告訴他們，應該要「感謝自己」，因為我只能告訴他們一些專業知識和操作 方法，但下決心學習、用功做功課、堅持努力，得靠他們「自己」。\n\
    \n每個來上課的同學都有感人的故事，謝謝他們願意分享給我，雖然他們來學習的背景不同，但是目標都一樣：希望在股市賺錢。\n\n下面舉幾個同學的例子，每個都是「因緣」、「行動」、「努力」、「堅持」串連的真實成功故事，希望能夠啟發「想要努力」或「正在努力」的投資朋友，只要你「願意」，一定可以像他們一樣「成功」。\n\
    \n### 誠品書店巧遇的蔡先生\n\n2011年7月的一個週日晚上，我循例到敦化南路的誠品書店，這是我一星期最放鬆的時間，我會一個人慢慢翻閱自己喜歡的書。當天，我的心情有點不同，因為《Money錢》剛出版了我的第一本新書《抓住飆股輕鬆賺》，這本書放在進門處的新書平台上，擺放了一整落約\
    \ 20本，所以，我除了抱著原本逛書店的心情之外，還格外注意自己的 新書。\n\n在新書區駐是一會兒後，我順著右邊長書廊走向財經書架區，突然 有位先生走到我面前，帶點興奮語氣問我說：「您是不是前面新書\
    \ 的作者朱家泓老師？」\n\n我說：「是啊！您怎麼知道？」\n\n他說：「我剛剛在前面看到您的新書，封面上有您的照片，所以認 出來了。」\n\n我說：「哇！您好厲害，封面照片出版社有用電腦修過，看上去很\
    \ 年輕，跟我本人差很多，您還能認出來。」\n\n就這樣打開了彼此的話匣子，在書店中聊了起來。他姓蔡，曾經拿 了1千萬元給一位蠻有名的老師代操股票，起初幾個月，平均都能拿\
    \ 到20萬～30萬的獲利，當時日子過得很悠閒，經常到國外旅遊。大約 半年之後，拿到的獲利每況愈下，一年不到，不但沒有獲利可拿，連 本金1千萬元也賠得只剩下不到1百萬元。這個打擊太大，他下決心要\
    \ 自己學、自己做。\n\n他的故事可說是股市中很平凡的遭遇，很多投資人都是太相信所謂 的「專家」、「高手」，輕易就把手給對方，以為這樣就可以坐享獲 利，其實大多數都是賠錢下場。\n\
    \n我建議蔡先生，從最基礎的技術分析開始，做好一年的學習計畫， 按部就班地邊學邊用小資金練習操作，同時要體悟紀律操作的重要。 蔡先生後來陸續上完我所開的課，同時不斷檢討改進，找出適合\
    \ 自己的方法。2012年9月，我在「期指當沖」的課堂上看到他，他很 興奮地告訴我獲利績效，那天正好是教師節，他還代表全班把一張寫滿同學祝福的卡片送給我。我當下雖然沒有流眼淚，但那份感動久久不散。\n\
    \n兩年前的那天，如果我沒有去逛誠品書局，如果他沒有認出我，如果他不願意從基礎學習，他就不會像今天這樣，成為充滿信心的股市高手了。這個緣分，是蔡先生自己開啓的。\n\
    \n### 馬來西亞飛來的邱同學\n\n2012年初某一天上課時，課堂助理告訴我，班上有位遠從馬來西亞來上課的學生，我有些訝異，難道他要坐飛機來上課？課堂上我看到這位學生，年紀看上去應該40歲左右，很斯文的一位男士。\n\
    \n課間休息的時候，我特別去認識他。他是邱先生，馬來西亞人，是位精神科醫生，在香港執業。我很好奇，我並不是什麼出名的老師，更沒有財經界頭銜或者是顯赫的學位背景，他為什麼願意到臺灣來上我的課？\n\
    \n邱先生告訴我，他對股票很有興趣，他在香港買了一些港股和大陸上海股票，可是一直做不好而賠錢。有一天，他的朋友在台灣的書店買了一本我的書帶回香港，借給他看。他看完之後才知道，做股票要具備一些專業知識，於是他上網用書名及作者名搜尋，找到我開課的資訊，並且報名了假日班，每次上課就坐飛機來臺灣，住在飯店3、4天。\n\
    \n後來他陸續上完基礎班、進階班和專修班的課程，前前後後也飛了快半年的時間。2013年農曆年前，我接到邱先生寄來的電子郵件，全文如下：\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_18_0.png)\n\
    \n> 朱老師，您好！\n>\n> 好久沒寫郵件給您，近來好嗎？新年快樂！恭喜發財！\n>\n> 最近港股操作都還好，部分股票有賺超過50%、停損次數少很多了。\n\
    >\n> 我看到您最近開了新課程「技術分析高階班」，內容和過去不一樣嗎？如果有很多新資訊，我等您開假日班，就飛來上。\n>\n> 下半年我會找時間來上您的「期指當沖」假日班。\n\
    >\n> 祝新年快樂！蛇年行大運！\n\n接到他的電子郵件，我很高興，現在他能穩健獲利。這個「緣分」是因為他不只是看看書，而是下決心坐飛機來上課，我們才能認識。他付出了金錢、時間及努力，才有今天的成果，這一切都是起因於「他自己」。\n\
    \n### 台東搭火車來的趙小姐\n\n「老師您好！我又來上課了！」每次她在教室看到我就跟我說這句話。她是趙小姐、個子高挑，總是面帶微笑，住在台東，她是老師，先生在前東開精品咖啡屋。\n\
    \n她學股票是為了以後退休做好準備，但是在東部，股票學習的課程很少，也沒有老師到台東開課，所以就不辭辛苦地到台北學習，每次假日班下午5點下課後，她都搭乘稍晚6點多的火車回台東，到家已經是凌晨。\n\
    \n台東的火車票很難買，有時為了上課，必須在一個星期前去搶票，她的好學精神令人感佩。她抱著先做好百萬準據才買股票的想法，在 台東與台北來回跑的一年多學習期間都沒進場。她為「自己」定好目標，並有不畏艱辛、堅持學習的精神，將來一定是個成功的操盤手。\n\
    \n### 自助、人助、天助\n\n學習股票操作，想成為長期的贏家，必須要有下面3個助力：\n\n1. **自助**\n   首先必須自己付出血力，有計劃地學習，除了充實專業知識，也要花時間做功課，這些一定得靠自己下定決心去完成。從起心動念到計畫行動，這是自助的功力。\n\
    \n2. **人助**\n   在努力學習的過程中，要有好老師指導、好朋友支持鼓勵和相互切磋，許多事都需要他人的幫助，所以建立良好的人際關係非常重要。吸取別人的經驗，可以縮短自己摸索的時間。只要你展現誠心、熱誠和企圖心去請教別人，自然就會出現貴人相助。\n\
    \n3. **天助**\n   人人都想發財，到財神廟拜拜，無非是想得到財神爺的眷顧。問題是，拜的人有沒有想過，財神爺為什麼要眷顧你呢？是因為你平日行善積德，還是努力付出呢？只拜財神爺絕對不夠，要自己付出，才可能達成目標。俗話說得好：「天下沒有白吃的午餐。」經過自助的努力，別人的相助，存善心、做善事，自然會出現神助的力量。只有從自己改變，一切才可能改變。\n\
    \n每個來課堂學習的同學，都跨出了自助的第一步。在課堂結識同好，向高手請教，就能獲得人助。堅持目標，努力學習，自得神助。祝福所有投資人，都能心想事成，美夢成真。\n\
    \n---\n\n## 第 1 篇 學習K線基本功\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_22_0.png)\n\
    \n### 第1章 如何畫出K線？\n\nK線是技術分析之母，當天所有交易人對股市的看法，無論是對基本面、消息面、籌碼面還是心理面的反應，都會表現在當天的K線，由於每天的反應狀況不同，表現出的K線長相也就不一樣了。\n\
    \n例如去年11月13日，一大早報紙上斗大的標題說要查內線交易以及基金代操的操盤經紀人，結果當天大盤一路下殺 131 點，出現跌破反彈7天的長黑K，因此可以知道，K線對市場的敏感度反應最快，如果能夠精通K線變化的意義，自然能夠買在低點，賣在高點。\n\
    \n#### K線的由來\n\n17世紀時，「稻米交易所」在日本大阪成立，從1710年開始發行稻米的「榖票」，這些「榖票」稱為「米票」，也是最早的期貨合約。\n\
    \n1750年江戶時代，「本間家族」是當時很富有的家族；排行最小的本間宗久，在他父親過逝之後，開始掌管家族生意。\n\n他帶著資金到大阪的「堂島交易所」，開始從事稻米的期貨交易，他每天記錄氣候狀況和交易價格的漲跌，並繪製圖表，經過分析後，他發現稻米價格變化的相關性，於是運用這套方法，賺到龐大的財富。\n\
    \n本間宗久晚年擔任政府的財政顧問，並被封為武士。1803年逝世前，出版了《阪田戰法》及《行情分析》兩本著作，他在稻米交易上使用的一些戰法，在日本逐漸發展成「陰陽線分析方法」，後來有人把這套方法應用到股票交易市場，成為重要的理論。\n\
    \n#### 從交易記錄畫出K線圖\n\n- 一、怎麼畫出當天的紅K線（陽線）\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_23_0.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_23_1.png)\n\n- 當收盤價比開盤價高，則畫成紅色K線。\n\
    - 收盤價與開盤價有價差，畫成實體的紅柱狀，其餘部分畫成影線。\n\n註：日本的技術分析圈稱圓形線為“写扇表”（發音為kei-sen-hyou），引入國內後，就以日本發音稱為“K線”。\n\
    \n019\n"
