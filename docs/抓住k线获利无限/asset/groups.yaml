    **解說**


    下跌走勢到明顯低檔，出現轉折向上的吞噬紅K線，表示當日開低走高，收盤突破前一日最高點，多方買盤出籠，多空主控制產生易位。長紅吞噬是5組向上雙K線轉折訊號最強的組合，空單要立刻回補。


    +   **精通**


    1. 被吞噬的黑K線越小，吞噬的紅K線越長，轉折的力道越強。

    2. 吞噬當日或前一日出現大量或窒息量，反轉訊號越強，轉折向上機率越高。要分辨走勢是多頭的回檔再上漲，還是空頭跌深的反彈。

