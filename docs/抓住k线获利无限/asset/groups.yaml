    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_0.png)


    # 第 2 章  下跌中的K線組合


    下跌中的K線有7種組合，詳細研讀，就可以正確判斷行情的變化。


    # 定義


    1根下跌的中長黑K線，次日1根十字或紡鎚變盤線，第3日1根低於第1日中長黑K線最低點的中長黑K線，這樣的3根K線下跌構成的組合，稱為「一星二陰」。通常中間的「星」，可以是紅K或黑K，可以有實體，但實體要很小。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_2.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_3.png)'
  - '[PAGE 262]


    # 解說


    +   1. 在走勢下跌中經常可以看到「一星二陰」的組合，是下跌中繼的訊號，表示往下趨勢沒有改變，通常還會有更低價，仍為空方主控向下的格局。


    +   2. 夾在中間的「星」，可以2根以上，重點是「星」的K線收盤，不能突破前一天K線的最高點。後面要有1根向下的中長黑K線，幅度與前面中長黑K線略同或更大。


    # 精通


    +   1. 空頭下跌1根中長黑K線，當天跌幅太大，次日很容易出現休息狀態，然後再下跌，容易出現「一星二陰」的組合。


    +   2. 「一星二陰」組合出現後還有低點，因此空頭起跌出現第1根中長黑K線後，次日出現休息的變盤線，可以大膽推測後面容易再下跌1根中長黑K線，形成「一星二陰」組合而做空。這裡特別強調，是在空頭起跌的位置，如果下跌到低檔，當然不能這樣推測，因為低檔長黑再出現變盤十字線，容易出現「晨星」向上轉折。


    +   3. 空頭下跌1根中長黑K線之後，連續出現1根以上的小紅、小黑或變盤線，如果橫盤維持在中長黑K線收盤之下，是弱勢整理的型態，隨時可能繼續下跌，把上面的中長黑K線搬到下面，面對這樣弱勢整理的型態，一定要把握下跌的機會做空。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_262_0.png)'
  - '[PAGE 263]


    +   4. 空頭下墜1根中長黑K線之後，連續出現1根以上的小紅、小黑或變盤線，如果維持小幅下跌，是碎步走跌型態，隨時都可能發動大跌，出現中長黑K線的走勢。

    5. 出現「一星二陰」的組合後，後面的中長黑K線的最高點不能被突破，否則會破壞「一星二陰」的架構。

