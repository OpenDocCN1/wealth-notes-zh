    \n資料來源：富邦eO1電子交易系統\n\n- 上漲到高檔出現帶大量倒鍵線，收盤沒有突破前面高點A，接著3天的股價都無法過高，股價容易拉回。\n- 觀察之後的盤整走勢，每次放大量的倒鍵線之次日走低，都會造成股價拉回。\n\
    \n## 第6章 短紡錘線、長紡錘線、天劍線、蜻蜓線\n\n### 短紡錘線：會上升出現下影線的帶量突破K線\n\n#### 定義\n實體是中長紅或是中長黑，含有上影線及下影線。\n\
    \n#### 解說\n當天無論是紅K線多方強，或是黑K線空方強，都出現上下的拉鋸，換句話說，當天不是一面倒的強多或強空。\n\n#### 精通\n- 在一般位置的判斷上，與中長紅K線及中長黑K線差不多。\n\
    - 在關鍵位置表示，上方出現一些壓力，下方出現一些支撐。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_120_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n上漲到高檔，陸續出現含上影線及下影線的K線，多空開始拉鋸，注意股價的轉折下跌。\n\n### 長紡錘線：會呈上影線及長下影線的實體K線\n\
    \n#### 定義\n上下影線很長，至少是實體的2倍以上。小的實體在中間，實體可以是紅K或黑K。相同的線型，不分紅K或黑K，實體在上漲的頂端或下跌的低點，都稱為長紡錘線。\n\
    \n#### 解說\n這種K線表示當天多空雙方拉鋸激烈，最後收盤接近開盤，呈現多空平手的格局。在高檔，表示多方上漲已經遭到很大的壓力，股價變動劇烈，盤中一度向上，但是漲勢受阻，最後回到接近原點。在低檔，表示下跌遭遇很大的抵抗，有止跌現象，盤中下跌到最低點後出現買盤向上拉的多方力量，最後的收盤拉到接近開盤價。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_121_0.png)\n\n#### 精通\n- 強勢上漲到高點，出現長紡錘線，表示當天出現多空激戰。必須觀察次日的走勢，才能夠確認多空交戰結果是多方或空方勝。\n\
    \  - 次日開盤向下跳空大跌，多頭上漲架構瓦解的可能性大大提高，如果有大量，容易一日反轉或做頭。\n  - 次日開低向下或開高走低，收盤跌破長紡錘線的實體下沿，轉折向下的可能性大增，多單要考慮準備出場。\n\
    - 在高檔，長紡錘線當天或前1、2天爆出大量，次日開低向下或開高走低，幾乎可以確定是昨日主力出貨。\n- 高檔出現連續2～3根的長紡錘線，或搭配其他下殺的K線訊號（如高檔長黑、變盤線、大量開高走低下跌黑K等），轉折向下的機率越高。\n\
    - 上漲到壓力位置前出現大量長紡錘線，轉折回跌的機率很高，要注意次日走勢。\n- 強勢下跌到低點，出現長紡錘線，表示原先空頭走勢的下跌之後，有多方買進，同時盤中多方曾經上攻到高點，是止跌的訊號。次日出現以下情況，下跌走勢可能改變，甚至是空頭架構被破壞而轉折回升。\n\
    \  - 次日開盤向上跳空大漲，空頭結構瓦解的可能性大大提高，容易一日反轉或打底。\n  - 次日開高走高或開低向上，收盤突破長紡錘線實體的上沿，轉折向上的可能性大增，空單要考慮回補。\n\
    - 在低檔，長紡錘線當天或前1、2天爆出大量，次日開低向上或開低走高，幾乎可以確定是昨日主力吸貨。\n- 下跌到低檔出現連續2～3根的長紡錘線，或搭配其他止跌的K線訊號（如大量長紅、變盤線、大量開低走高上漲紅K吞噬等），轉折向上的機率越高。\n\
    - 下跌到支撐位置前出現大量長紡錘線，轉折上漲的機率很高，要注意次日走勢。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_123_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 上漲到高檔，出現帶大量含上影線長紅，後續股價要續漲。\n- 連續3日出現長紡錘線橫盤，注意可能轉折向下的變盤，股價不可以下跌。\n\
    - 再出現高檔天劍（見下節說明），也是變盤訊號。\n- 黑K跌破天劍線，且連續4天變盤線橫盤，注意股價下跌。\n- 中黑跌破頭部10天橫盤K線的低點，股價快速反轉下跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_124_0.png)\n\n- 上漲到高檔，出現帶大量的天劍線，注意後續股價不漲要回檔。\n\
    - 高檔長紡錘線及後續3天股價橫盤不漲，注意轉折向下的可能性很高。\n- 長黑K跌破連續4天橫盤變盤K線，股價反轉下跌。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_125_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 下跌到低檔，出現帶大量的長黑K線。\n- 出現止跌的長紡錘線，是否止跌回升，次日走勢很重要。\n- 次日向上跳空上漲，長紅K突破黑K線最高點，股價止跌回升。\n\
    \n#### 勤益(1437) 日股圖 2013/06/14 開 16.70 高 16.70 低 16.15 收 16.30 成交量 230 跌 -0.20\
    \ (-1.21%)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_126_0.png)\n\n資料來源：富邦eO1電子交易系統\n\
    \n- 上漲中出現2根長紡錘K線，稱為雙星變盤，次日股價如下跌將回撤。\n- 高檔出現1根倒鉤K線、2根長紡錘K線，次日股價如下跌將回撤。\n- 上漲中出現2根長紡錘K線，次日股價如下跌將回撤。\n\
    - 上漲中出現2根長紡錘K線，次日股價如下跌將回撤。\n- 股價回撤跌破前面低點，趨勢改變。\n- 反彈中出現2根長紡錘K線，次日股價如下跌空頭完成。\n\n\
    ### 定義\n天劍線：上影線很長，至少是實體的2倍以上，實體很小甚至沒有實體，下影線很短。實體不分紅K或黑K，在上漲的頂端或在下跌的低點，都稱為天劍線。\n\
    \n蜻蜓線：下影線很長，至少是實體的2倍以上，實體很小甚至沒有實體，上影線很短。實體不分紅K或黑K，在上漲的頂端或在下跌的低點，都稱為蜻蜓線。\n\n###\
    \ 解說\n- 在高档，天劍線及蜻蜓線都是轉折向下的重要訊號。在高档的天劍線，代表多方上漲已經遭到的壓力，當天股價變動劇烈，盤中一度向上，但漲勢受阻，最後回到接近開盤或開盤價。在高档的蜻蜓線，代表多方開盤後，空方盤中下跌到最低點，雖然最後拉回到接近開盤或開盤價，表示多頭上漲已經出現空方下跌的力量，盤中多方的力量很小。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_127_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_127_1.png)\n\
    \n- 在低檔，天劍線及蜻蜓線都是轉折向上的重要訊號。在低檔的天劍線，代表空方開盤後，多方盤中上漲到最高點，雖然最後拉回到接近開盤或開盤價，表示空頭下跌已經出現多方上漲的力量，盤中空方的力量很小。在低檔的蜻蜓線，代表空方下跌已經遭到很大的抵抗，當天股價變動劇烈，盤中一度向下到最低點，但是遭到多方力量的上漲，最後拉回到接近開盤或開盤價。\n\
    \n### 精通\n- 強勢上漲到高點，出現天劍線或蜻蜓線，是上漲的重要變盤線。要密切注意次日走勢，確認是否變盤，尤其是當天或前一日如出現大量，變盤的機率更高。\n\
    \  - 次日開盤向下跌空大跌，多頭上漲架構瓦解的可能性大大提高，如果有大量，容易一日反轉或做頭。\n  - 出現帶大量的天劍線或蜻蜓線之後回跌，日後股價即使再上漲，往往都無法突破天劍線或蜻蜓線的最高點，波浪型態容易出現頭頭低的做頭。\n\
    - 多頭上漲的途中，如出現天劍線或蜻蜓線，次日走勢非常重要，換句話說，次日如果下跌，則容易回檔，若是連續2天或3天都出現天劍線或蜻蜓線，變盤機率更高。\n\
    - 強勢下跌到低點如出現天劍線或蜻蜓線，是重要變盤線訊號。要密切注意次日走勢，確認是否變盤，尤其當天或前一日出現大量或窒息量，變盤的機率更高。\n  - 次日開盤向上跳空大漲，空頭下跌架構瓦解的可能性大大提高，如果有大量或窒息量，容易一日反轉或打底。\n\
    \  - 下跌的天劍線或蜻蜓線如果轉折上漲之後，股價即使再下跌，往往不容易跌破天劍線或蜻蜓線的最低點，波浪型態容易出現底底高的打底。\n- 空頭下跌的途中，如出現T字線與墓碑線，次日走勢非常重要，換句話說，次日如果上漲，則容易反彈，若是連續2天或3天都出現天劍線或蜻蜓線，變盤機率更高。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_129_0.png)\n\n- 上漲行進中出現蜻蜓線，次日股價如果不跌，將會續漲。\n\
    - 高檔出現大量天劍線，次日股價下跌將回檔。\n- 下跌行進中出現蜻蜓線，次日股價如果不漲，將會續跌。\n\n#### 新復興(4909) 日線圖 2013/07/04\
    \ 開 31.70 高 31.70 低 31.10 收 31.30↑元 量 281 張 -0.25 (-0.79%)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_130_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 高檔連續出現2根帶大量的天劍線，注意股價不能下跌。\n- 股價長黑，收盤跌破2根帶大量的天劍線實體下沿，出現一日反轉下跌的走勢。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_131_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n\
    - 下跌低點出現錘子線。\n- 次日出現止跌的蜻蜓線訊號。\n- 出現放量長紅K，收盤突破蜻蜓線，股價轉折上漲。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_132_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 下跌低點出現蜻蜓線。\n- 底部打底再次出現蜻蜓線訊號，呈現雙腳打樁訊號。\n- 出現放量長紅K，收盤突破前高，多頭確認，股價上漲。\n\
    - 高檔出現蜻蜓線，次日開高走低：化解下跌疑慮。\n\n## 第8章 T字線、墓碑線、十字線、一字線\n\n### 定義\nT字線：開盤價與收盤價相同，沒有實體棒，盤中下跌到最低點，最後收盤拉到開盤價。\n\
    \n墓碑線：也稱為倒T字線，開盤價與收盤價相同，沒有實體棒，盤中上漲到最高點，最後收盤拉回到開盤價。\n\n### 解說\n在高檔，T字線與墓碑線都是轉折向下的重要訊號。T字線代表多方開盤後就一路下跌，雖然收盤時拉回到開盤價，顯示多方已經無法上漲，盤中出現空方下殺的力量。墓碑線代表開盤多方一度上漲，但是遭到很大的壓力，當天股價漲勢受阻，最後回到開盤價。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_133_0.png)\n\n在低檔，T字線與墓碑線都是轉折向上的重要訊號。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_134_0.png)\n\n表示空方開盤後就一路下跌，但是出現多方向上的力量，收盤時拉回到開盤價。墓碑線代表開盤多方一度上漲到最高點，雖然最後回到開盤價，顯示空方已經無法再下跌，盤中出現多方上漲的力量。\n\
    \n### 精通\n- 強勢上漲到高點，如出現T字線或墓碑線，是上漲的重要變盤線。要密切注意次日走勢，確認是否變盤，尤其當天或前一天如出現大量，變盤的機率更高。\n\
    \  - 次日開盤向下跳空大跌，多頭上漲架構瓦解的可能性大大提高，如果有大量，容易一日反轉或做頭。\n  - 出現大量的T字線或墓碑線回落之後，股價即使再上漲，往往都無法再突破T字線或墓碑線的最高點，再轉折向下就容易出现波浪型態頭頭低的改變。\n\
    - 多頭上漲的途中，如出現T字線或墓碑線，次日走勢非常重要，換句話說，次日如果下跌，容易回檔，若是連續2天或3天都出現T字線或墓碑線，變盤機率更高。\n-\
    \ 強勢下跌到低點，如出現T字線或墓碑線，是重要變盤線訊號。要密切注意次日走勢，確認是否變盤，尤其當天如出現大量或窒息量的T字線或墓碑線，變盤的機率更高。\n\
    \  - 次日開盤向上跳空大漲，空頭下跌架構瓦解的可能性大大提高，如果有大量或窒息量，容易一日反轉或打底。\n  - 下跌的T字線或墓碑線反彈之後，股價即使再下跌，往往不容易再跌破T字線或墓碑線的低點，波浪型態容易出現底底高的打底。\n\
    - 空頭下跌的途中，如出現T字線或墓碑線，次日走勢非常重要，換句話說，次日如果上漲，容易反彈，若是連續2天或3天都出現T字線或墓碑線，變盤機率更高。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_135_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n- 上漲高檔出現爆大量的T字線，次日如開低下跌容易回檔。\n\
    - 高檔再次出現長黑，跌破4天的變盤線訊號，高檔容易盤頭。\n- 高檔再次出現長黑，跌破反彈錘子線的實體下沿，盤頭出現3次長黑的下跌轉折，頭部空頭架構即將完成。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_136_0.png)\n\n- 上漲高檔出現爆大量的長紅線。\n- 高檔出現變盤的T字線，次日開平走低，股價轉折向下。\n\
    - 高檔上漲出現黑K吞噬，注意次日只能向上，否則容易盤頭出現頭頭低的趨勢改變。\n- 長黑跌破吞噬黑K低點及前面低點，高檔出現兩次轉折向下的K線組合，空頭趨勢確認。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_137_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n\
    - 上漲高檔出現爆大量的天劍線，次日開低走低，股價轉折向下。\n- 下跌行進出現變盤的地劍線，次日開平走低，繼續下跌。\n- 下跌行進出現變盤的墓碑線，次日開高走低，繼續下跌。\n\
    - 開高走低大量長黑K，繼續下跌。\n- 下跌到低檔，出現帶大量的墓碑線要注意次日是否變盤。\n- 向上跳空長紅，突破墓碑線最高點，轉折向上反彈。\n"
