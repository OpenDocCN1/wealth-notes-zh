    ### 第 3 篇


    ### 第2章 高檔2根K線轉折向下的變化組合


    #### 解說


    上漲走勢到明顯高檔，出現中長紅K線，第2天出現中長黑K線（烏雲罩頂），當天開高盤創新高，但賣壓出籠，收盤跌破前一日中長紅K線的收盤價做收，可以確認當天是空方力道強，多方無法控制上漲，同時有出貨的現象。這是一組上漲過壓力的止漲K線訊號，要注意是否會轉折向下。


    #### 精通


    1. 覆蓋（烏雲罩頂）的黑K線越長，轉折的力道越強。


    2. 黑K線收盤雖然跌入紅K線實體，但沒有達紅K線的二分之一，反轉訊號力道較弱，最好再觀察一天確認是否反轉。


    3. 黑K線收盤如果跌破紅K線的二分之一，可視為反轉的訊號。


    4. 黑K線收盤越向下深入紅K線實體，反轉向下的可能性越高。如果跌破紅K線實體的最低點，就形成長黑吞噬。


    5. 出現覆蓋的2根K線時，最高點H和最低點L是重要的壓力或支撐觀察點，收盤突破最高點H，會出現一波上漲；反之，如跌破最低點L，容易出現一波下跌。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_161_0.png)


    6. 出現覆蓋後，走勢出現在L與H之間的橫向盤整，通常多為做頭的訊號，盤整再次出現轉折向下訊號，頭部形成機率大增，要特別注意，甚至可以做空。


    7. 覆蓋的2根K線如果又有爆大量情形，更加容易反轉向下。

