    走勢的關鍵


    # 定義


    開盤與收盤上下幅度達4.5%以上，開低走高的實體紅K線，而且是没有上下影線的實體K棒，即使有，也只能有很小的影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_48_1.png)


    # 解說


    在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到長紅K線。就單一K線而言，當天開盤是最低價，然後買盤積極，最後上漲到最高價收盤，所以當天是多方強。


    # 精通


    +   1. 當天買盤雖積極，仍要分辨是主力大戶買進，還是散戶的追逐，不同的交易人買進，造成的結果就不同。換句話說，出現長紅K線，並不表示日後一定會繼續上漲。

    2. 長紅K線出現在不同趨勢、不同位置，代表的意義就不同，'
  - '[PAGE 49]


    # 第 1 章 長紅和長黑K線：走勢的關鍵


    甚至完全相反，股友不可不察。要精準判讀長紅K線，必須先區分不同趨勢中的不同位置。


    # 多頭上漲趨勢中的長紅K線


    在多頭上漲趨勢中，長紅K線會出現在以下6個位置。


    # 位置1：出現在多頭底部打底期間


    代表底部有主力在吸貨，通常會出現一些量增的現象，由於主力尚未佈局完成，所以沒有發動向上上漲的攻勢。


    # 位置2：出現在底部打底完成時


    通常都會配合攻擊量，可視為主力宣示多頭的開始，要把握機會買進做多。這根宣示上漲的長紅K，要突破底部盤整或型態的最高點才算確認。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_49_0.png)


    +   1. 在底部盤整時陸續出現帶大量的長紅K線，但是都沒有上攻，代表主力分批吸貨。

    2. 盤整的突破，是多頭確認的關鍵K棒，出現帶大量的長紅K線，確認多頭打底完成，開始多頭上漲走勢。'
  md: "\n## 一、怎麼畫出當天的紅K線（陽線）\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_24_0.png)\n\
    \n這是2013/5/24 華上（6289）的線圖，上圖是當天交易的走勢圖，下圖是交易結束後出現的紅色K線。\n\n- ① 上圖是當天9:00開盤的價格4.53，接著開始交易。\n\
    \  下圖是開盤4.53的位置。\n- ② 上圖是當天13:30收盤的價格4.67，結束交易。\n  下圖是收盤4.67的位置。\n- ③ 上圖是當天盤中交易出現的最高價格4.78。\n\
    \  下圖是最高價格4.78的位置。\n- ④ 上圖是當天盤中交易出現的最低價格4.44。\n  下圖是最低價格4.44的位置。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_24_1.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n## 一、怎麼畫出當天的黑K線（陰線）\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_25_0.png)\n\
    \n這是2013/5/24日晶豪科（3006）的圖，上圖是當天交易的走勢圖，下圖是交易結束後出現的黑色K線。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_25_1.png)\n\
    \n- 上圖是當天9:00開盤的價格46.9，接著開始交易。\n  下圖是開盤46.9的位置。\n- 上圖是當天13:30收盤的價格45.1，結束交易。\n\
    \  下圖是收盤45.1的位置。\n- 上圖是當天盤中交易出現的最高價格47.6。\n  下圖是最高價格47.6的位置。\n- 上圖是當天盤中交易出現的最低價格44。\n\
    \  下圖是最低價格44的位置。\n\n資料來源：富邦e01電子交易系統\n\n### 黑K線的對應圖法\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_26_0.png)\n\
    \n- 當收盤價比開盤價低，畫成黑色K線。\n  收盤價與開盤價有價差，畫成實體的黑柱狀，其餘部分畫成影線。\n\n### K線的觀察原則\n\n對於K線，要先了解幾個基本概念：\n\
    \n- 組成K線的4個元素是：開盤價、收盤價、盤中最高價、盤中最低價。\n  收盤價高於開盤價是紅K線，收盤價低於開盤價是黑K線。\n  日線圖的一根K線，是當日交易的紀錄。\n\
    \  週線圖的一根K線，是一週（5天）交易的紀錄。\n  月線圖的一根K線，是一個月（月初第一天到月底最後一天）交易的紀錄。\n\n# 第1篇 如何畫出K線？\n\
    \n### K線各部分的名稱：\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_27_0.png)\n\n紅K線或黑K線並不代表當天股價是上漲還是下跌，開低收高就是紅K線，開高收低就是黑K線，千萬不要誤以為紅K線就是上漲，黑K線就是下跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_27_1.png)\n\n# 解讀K線密碼\n\n解讀單一K線或數根K線組合型態之前，要先認識K線的重要觀念，並學會判讀整體走勢，如此才能完整解讀並應用各種收盤K線。\n\
    \n## 認識K線基本元素\n\n組成K線的基本元素有4個，分別是開盤價、收盤價、最高價、最低價，電腦K線圖上都會標明這4個元素，這裡再加上另外一個重要數據，我稱為第5元素，就是½成本價。以上4+1元素代表不同的意義，在短線操作的判斷上很重要，分別說明如下。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_28_0.png)\n\n# 第一編 解讀K線密碼\n\n## 元素1：開盤價\n\
    \n每天股價開盤的位置，通常都是由控盤主力開出，因為很少散戶會在開盤前就掛一個價格去買或賣，而這個價格又剛好是開盤價。開盤價一般反應了以下幾個原因：\n\n\
    1. 反應開盤前利多或利空的消息面，尤其是國際股市如美國、韓國、大陸股市的表現。例如美國股市大漲2%以上，韓國股市也往上開高，台股大盤也會反應開高。另外，例如2013年5月31日媒體報導，證所稅當天有可能過關，結果開盤大漲75點，這是反應利多消息。\n\
    \n2. 主力大戶的企圖，例如今日開盤跳空上漲，顯示主力拉抬企圖明顯，股票強勢續多。如果昨日長紅K棒上漲，今日開在平盤或盤下，表示多方今日向上企圖不強。\n\
    \n3. 變盤的先期徵兆，例如多頭高檔昨日收十字線、墓碑線、吊人線等變盤K線，今日開盤價就很重要，如果開高，便能化解疑慮；開低，多頭就要小心，可能要變盤了。同樣的，股價下跌一段，昨日出現止跌的變盤線訊號，今天如果開盤向上，自然容易轉折向上。\n\
    \n4. 開盤漲停板或跌停板，是主力強力表態做多或下殺的企圖，不可輕忽後續的走勢。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_30_0.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_30_1.png)\n\n資料來源：富邦e01電子交易系統\n\n-\
    \ 當日股價B，遇到前面A點頭部壓力，出現黑K上影線的變盤線，次日開盤開低，主力沒有企圖要攻過高點B。\n- 當日股價D，遇到前面C點頭部壓力，出現小紅K十字線的變盤線，次日開低盤，主力沒有企圖要攻過高點C。\n\
    - 當日股價E，遇到前面C、D點頭部壓力，出現小黑K十字線的變盤線，次日主力企圖很強，開盤跳空上漲，並且放量攻過A、B、C、D、E所有的高點。\n\n##\
    \ 元素2：收盤價\n\n1. 當日多空雙方經過一天的決戰後，最後的結果價格。\n\n2. 以收盤價為界線，收盤價的上方視為空方力量的範圍，收盤價的下方視為多方力量的範圍，依此可看出當日多空勢力的強弱，並可預測明日開高或開底的意圖。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_31_0.png)\n\n3. 收盤價與昨日K線比較，從收盤價是否突破昨日K線最高點，或跌破昨日K線最低點，可觀察股價將會轉強或轉弱。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_31_1.png)\n\n## 元素3：最高價\n\n1. 當日多方力量所能攻到的最高價位。\n\
    \n2. 空頭抵擋反擊的價位，或是多頭開始撤退的位置。\n\n3. 與昨日最高價相比，從是否突破昨日最高價，或未突破昨日高價即壓回，可看出主力是否有續多的企圖。\n\
    \n4. 最高價來到前面壓力位置，如果沒過，或者是過了又拉回，留下長的上影線，表示該位置出現壓力訊號，次日要特別注意是否將遇壓回檔或拉回下跌。\n\n##\
    \ 元素4：最低價\n\n1. 當日空方力量到達的最低價位。\n\n2. 多頭抵擋開始反擊，或是空頭回補的位置。\n\n3. 與昨日最低價相比，是否跌破昨日最低點是重要觀察指標，如果今日最低價跌破昨日最低點，表示多空激戰，要密切注意收盤價位置。\n\
    \n4. 最低價來到前面的支撐位置，如果沒跌破，或者是跌破又拉上來，留下長的下影線，表示該位置出現支撐訊號，次日要特別注意是否將遇撐反彈或上漲。\n\n#\
    \ 第 1 篇\n## 第 2 章 解讀K線密碼\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_33_0.png)\n\
    \n當天股價C的黑K最低點，遇到前面A點支撐，出現下影線的止跌訊號，次日開高向上，表示股價要上漲。\n\n當天股價D的紅K最高點，遇到前面B點大量長紅K線壓力，出現上影線的止漲訊號，次日開低向下，表示後續股價持續下跌。\n\
    \n## 元素5：½ 價\n\n指當日（最高價＋最低價）÷2的價格\n\n1. ½ 價代表當日多空交易平均成本。\n2. 大量長紅K線，日後回檔跌破½ 價，表示多方氣勢轉弱。大量長黑K線，日後反彈突破½\
    \ 價，表示空方力道轉弱。\n3. 股價漲到高檔，出現大量長紅K線，如跌破長紅K線的½ 價，高檔做頭的機率大增，要小心反轉。\n4. 股價跌到低檔，出現大量長黑K線，如突破長黑K線的½\
    \ 價，低檔止跌回升的機率大增，要注意反彈。\n5. 因此，走勢中只要出現大量的長紅K線或長黑K線，都要特別注意½ 價的位置，看是處於相對高檔或低檔。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_34_0.png)\n\n資料來源：富邦e01電子交易系統\n\n###\
    \ 股票走勢圖是K線的延伸\n\n- 價格：交易進行中隨時變化\n- 1根K線：收盤後完成，但是下一根K線會有不同變化\n- 2根K線組合：完成次日的K線，形成連續2日的K線變化\n\
    - 3根K線組合：再完成1日的K線，形成連續3日的K線變化\n- 均線：數日K線的收盤價產生不同週期的均線\n- 波浪形態：股價在均線上下波動，產生轉折波的高低點\n\
    - 多空市場：依據轉折波的高低點判別多頭或空頭\n- 趨勢：多頭上漲行進或空頭下跌行進所產生的趨勢\n\n1. 從上面的前後關係可以看出，一個趨勢是由價格形成K線，然後再一步一步往下發展而成，所以從K線可最快看出轉折訊號，但是決定方向的力量，趨勢最大。\n\
    \n2. 學習K線，要從單日K線開始，根據單日K線的意義，研判後續走勢，再逐步學習2日K線、3日K線、多日K線的意義，循序漸進到波浪型態的結構，並掌握趨勢。\n\
    \n3. K線只是趨勢結構的一分子，波浪型態一旦完成確立，趨勢的反轉需要時間因素及條件因素的配合，也就是說，趨勢的反轉，必須等到頭部或底部型態完全確立，才有轉向的能力。因此，在多頭格局中，「上漲K線」會加分，「下跌K線」則會減分。\n\
    \n4. 對K線的解讀，不能單以一天來判斷，一天的K線容易受到突發事件的影響，產生無法預期的狀況，因此，一天的K線只能看當天的交易狀況，兩天的K線可以看出多空力道是否延續或出現變化，連續三天K線的變化，則可以看出方向轉折。再觀察多幾天K線的連續變化，可以判斷短線的走勢方向、型態的變化及波浪的型態。\n\
    \n1日K線：看當天多空強弱。\n\n2日K線：看次日多空是否延續或出現變化。\n\n3日K線：看是否出現轉折。\n\n5日K線：看短期的方向。\n\n#\
    \ 從K線橫盤確認突破或跌破\n\n在走勢圖當中，我們常常看到K線橫向走勢，股價一直沒有突破前一根K線的最高點，也沒有跌破最低點，這樣的橫向K線超過3根以上，可以視為K線的橫盤或盤整。\n\
    \n出現K線的橫盤或盤整，要如何確認盤整結束呢？如果出現一根中長紅K線，收盤突破所有橫盤的K線最高點，這樣就能確認往上突破，以及上漲的方向，在多頭趨勢中，這是進場做多的買進位置。\n\
    \n或者出現一根中長黑K線，收盤跌破所有橫盤的K線最低點，這樣就能確認往下跌破，以及下跌的方向，在空頭趨勢中，這是進場放空的位置。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_37_0.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_38_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_38_1.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_38_2.png)\n\n資料來源：富邦e01電子交易系統\n\
    \n# K線內涵為什麼很重要？\n\nK線內涵指的是K線當天的走勢圖，也就是當天K線是怎麼走出來的。相同的單一K線，當天的實際走勢不會相同，可用來判斷多空角力的情形，例如是主力強勢拉漲停板，還是經過多空廝殺後，多方戰勝而上漲到漲停板，這對明天或以後的走勢會有不同影響。\n\
    \n同樣是長紅K線漲停板，盤中分時K線完全不同：\n\n1. 開盤2分鐘拉到漲停板。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_39_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n2. 開盤先下跌，再向上拉到漲停板。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_40_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n3. 開盤漲停，下跌到平盤，再向上拉到漲停板。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_40_1.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n# 第2章 解讀K線密碼\n\n4. 平盤附近盤整再上漲，盤整後尾盤向上拉到漲停板。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_41_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n第1圖是主力一開盤就急拉到漲停板鎖住，第4圖是主力在接近收盤時急拉到漲停板鎖住。從這兩檔股票的K線，可看出主力的企圖是於開盤時或收盤前急拉，目的都是不希望有太多散戶跟進，如果當天是多頭起漲的進場位置，要立刻買進。\n\
    \n第2圖是主力先下殺，散戶看下跌而不敢進場，同時洗出一些不安心的籌碼，再快速拉漲停板，這也是主力強勢的表態。\n\n第3圖表示籌碼不安定，開盤漲停板後立刻打開，再迅速下跌到平盤，上下拉鋸，出現的是長上影線的K線，要看位置及成交量，才可確定可否介入。\n\
    \n## K線的3個環境條件\n\n研判K線代表的意義之前，要先確認3個環境條件：\n\n- 條件1：先確認行情趨勢是在多頭、空頭或盤整。\n- 條件2：K線在走勢中的相關位置，是低檔、高檔、行進中、接近壓力或支撐，還是關鍵突破或跌破。\n\
    - 條件3：成交量的變化可以幫助確認，K線的能量大小及籌碼的變化。\n\n## 看K線 要结合趨勢概念\n\n許多投資人在看K線時，往往只顧到K線本身的變化，而忽略了趨勢的方向，造成一些錯誤的解讀。結合趨勢的方向看K線時，應注意以下幾點：\n\
    \n1. 趨勢多頭時，K線開低走高或開高走高是正常，不必做太多解讀。K線開高走低或開低走低，才是不正常的訊號，此時根據位置可解讀為：可能是要休息、漲多要回檔，或者是波浪型態改變，可能要開始盤整。\n\
    \n2. 趨勢多頭時，K線開平盤後往上走是正常，跌破平盤往下則顯示出現空方力道，是轉弱的訊號，此時根據位置可解讀為：可能是要休息，或是漲多要變盤。\n\n\
    3. 趨勢多頭時，K線開平盤後往上是正常，但漲到高點後股價回跌，則顯示出現上檔賣壓，是轉弱的訊號，此時根據位置可解讀為：可能是要休息，或是漲多要變盤。\n\n\
    4. 趨勢空頭時，K線開高走低或開低走低是正常，不必做太多解讀。K線開低走高或開高走高，才是不正常的訊號，此時根據位置可解讀為：可能是要止跌、跌深要反彈，或者是波浪型態改變，可能要開始盤整。\n\
    \n5. 趨勢空頭時，K線開平盤後往下是正常，突破平盤往上則顯示出現多方力道，是轉強的訊號，此時根據位置可解讀為：可能是要止跌，或是跌深要變盤。\n\n6.\
    \ 趨勢空頭時，K線開平盤後往下是正常，但跌到低點後股價上拉，則顯示出現下檔有支撐買盤，是轉強的訊號，此時根據位置可解讀為：可能是要止跌，或是跌深要變盤。\n\
    \n## 2根K線的合併應用\n\nK線是每天盤勢的連續發展，所以有延伸性，例如連續兩天的K線，可以視為昨天開盤交易延續到今天的收盤結果，兩天的K線可合併成一根K線，看出兩天的多空強弱。\n\
    \n2根K線的合併方法，取第一天開盤價、第二天收盤價、這兩天交易的最高價和最低價，用這4個元素畫出一根K線。\n\n1. 連續兩天中紅K線，合併看是一根長紅K線，其作用與長紅K線一樣，1/2價是兩天的交易平均成本，在高檔時不能跌破，跌破氣勢轉弱。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_43_0.png)\n\n2. 一天長紅K線，一天長黑K線，合併是一根長上影線小黑K線，表示上面賣壓很重，上漲在高檔時，要小心是否會變盤轉折向下。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_44_0.png)\n\n3. 一天長黑K線，一天小紅K線，合併是一根長下影線的小紅K線，在高檔是反轉訊號吊人線，在低檔時是止跌訊號的錨子。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_44_1.png)\n\n4. 一根長黑K，吞噬前一天的紅K，合併是長上影線的小黑K線，在高檔時是多方遇強大壓力，是反轉訊號。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_44_2.png)\n\n5. 2天K線合併是長上影線的十字K線（天劍），是變盤的訊號，要注意次日的開盤走勢。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_44_3.png)\n\n# 第 1 篇\n# 第2章 解讀K線密碼\n\
    \n6. 2天K線合併看是長下影線的小黑K線的紡錘線，同樣是變盤的訊號，要注意次日的開盤走勢。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_45_0.png)\n\
    \n## 3根K線的合併應用\n\n3根K線的合併方法是，取第一天的開盤價、第三天的收盤價、這三天交易的最高價，以及這三天交易的最低價，畫出一根K線。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_45_1.png)\n\n右圖的3條K線，一般稱為夜星，是高點轉折向下的訊號，如果把它組成一條K線來看，就是單一K線高檔出現長上影線的變盤訊號。\n\
    \n# 第2篇\n\n# 第 1 章\n## 長紅和長黑K線走勢的關鍵\n\n### 定義\n\n開盤與收盤上下幅度達4.5%以上，開低走高的實體紅K線，而且是沒有上下影線的實體K棒，即使有，也只能有很小的影線。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_48_1.png)\n\n### 解說\n\n在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到長紅K線。就單一K線而言，當天開盤是最低價，然後買盤積極，最後上漲到最高價收盤，所以當天是多方強。\n\
    \n### 精通\n\n1. 當天買盤雖積極，仍要分辨是主力大戶買進，還是散戶的追逐，不同的交易人買進，造成的結果就不同。換句話說，出現長紅K線，並不表示日後一定會繼續上漲。\n\
    2. 長紅K線出現在不同趨勢、不同位置，代表的意義就不同，甚至完全相反，股友不可不察。要精準判讀長紅K線，必須先區分不同趨勢中的不同位置。\n\n## 多頭上漲趨勢中的長紅K線\n\
    \n在多頭上漲趨勢中，長紅K線會出現在以下6個位置。\n\n### 位置1：出現在多頭底部打底期間\n\n代表底部有主力在吸貨，通常會出現一些量增的現象，由於主力尚未佈局完成，所以沒有發動向上上漲的攻勢。\n\
    \n### 位置2：出現在底部打底完成時\n\n通常都會配合攻擊量，可視為主力宣示多頭的開始，要把握機會買進做多。這根宣示上漲的長紅K，要突破底部盤整或型態的最高點才算確認。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_49_0.png)\n\n1. 在底部盤整時陸續出現帶大量的長紅K線，但是都沒有上攻，代表主力分批吸貨。\n\
    2. 盤整的突破，是多頭確認的關鍵K棒，出現帶大量的長紅K線，確認多頭打底完成，開始多頭上漲走勢。\n"
  mdcn: "\n## 一、怎麼畫出當天的紅K線（陽線）\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_24_0.png)\n\
    \n這是2013/5/24 華上（6289）的線圖，上圖是當天交易的走勢圖，下圖是交易結束後出現的紅色K線。\n\n- ① 上圖是當天9:00開盤的價格4.53，接著開始交易。\n\
    \  下圖是開盤4.53的位置。\n- ② 上圖是當天13:30收盤的價格4.67，結束交易。\n  下圖是收盤4.67的位置。\n- ③ 上圖是當天盤中交易出現的最高價格4.78。\n\
    \  下圖是最高價格4.78的位置。\n- ④ 上圖是當天盤中交易出現的最低價格4.44。\n  下圖是最低價格4.44的位置。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_24_1.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n## 一、怎麼畫出當天的黑K線（陰線）\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_25_0.png)\n\
    \n這是2013/5/24日晶豪科（3006）的圖，上圖是當天交易的走勢圖，下圖是交易結束後出現的黑色K線。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_25_1.png)\n\
    \n- 上圖是當天9:00開盤的價格46.9，接著開始交易。\n  下圖是開盤46.9的位置。\n- 上圖是當天13:30收盤的價格45.1，結束交易。\n\
    \  下圖是收盤45.1的位置。\n- 上圖是當天盤中交易出現的最高價格47.6。\n  下圖是最高價格47.6的位置。\n- 上圖是當天盤中交易出現的最低價格44。\n\
    \  下圖是最低價格44的位置。\n\n資料來源：富邦e01電子交易系統\n\n### 黑K線的對應圖法\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_26_0.png)\n\
    \n- 當收盤價比開盤價低，畫成黑色K線。\n  收盤價與開盤價有價差，畫成實體的黑柱狀，其餘部分畫成影線。\n\n### K線的觀察原則\n\n對於K線，要先了解幾個基本概念：\n\
    \n- 組成K線的4個元素是：開盤價、收盤價、盤中最高價、盤中最低價。\n  收盤價高於開盤價是紅K線，收盤價低於開盤價是黑K線。\n  日線圖的一根K線，是當日交易的紀錄。\n\
    \  週線圖的一根K線，是一週（5天）交易的紀錄。\n  月線圖的一根K線，是一個月（月初第一天到月底最後一天）交易的紀錄。\n\n# 第1篇 如何畫出K線？\n\
    \n### K線各部分的名稱：\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_27_0.png)\n\n紅K線或黑K線並不代表當天股價是上漲還是下跌，開低收高就是紅K線，開高收低就是黑K線，千萬不要誤以為紅K線就是上漲，黑K線就是下跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_27_1.png)\n\n# 解讀K線密碼\n\n解讀單一K線或數根K線組合型態之前，要先認識K線的重要觀念，並學會判讀整體走勢，如此才能完整解讀並應用各種收盤K線。\n\
    \n## 認識K線基本元素\n\n組成K線的基本元素有4個，分別是開盤價、收盤價、最高價、最低價，電腦K線圖上都會標明這4個元素，這裡再加上另外一個重要數據，我稱為第5元素，就是½成本價。以上4+1元素代表不同的意義，在短線操作的判斷上很重要，分別說明如下。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_28_0.png)\n\n# 第一編 解讀K線密碼\n\n## 元素1：開盤價\n\
    \n每天股價開盤的位置，通常都是由控盤主力開出，因為很少散戶會在開盤前就掛一個價格去買或賣，而這個價格又剛好是開盤價。開盤價一般反應了以下幾個原因：\n\n\
    1. 反應開盤前利多或利空的消息面，尤其是國際股市如美國、韓國、大陸股市的表現。例如美國股市大漲2%以上，韓國股市也往上開高，台股大盤也會反應開高。另外，例如2013年5月31日媒體報導，證所稅當天有可能過關，結果開盤大漲75點，這是反應利多消息。\n\
    \n2. 主力大戶的企圖，例如今日開盤跳空上漲，顯示主力拉抬企圖明顯，股票強勢續多。如果昨日長紅K棒上漲，今日開在平盤或盤下，表示多方今日向上企圖不強。\n\
    \n3. 變盤的先期徵兆，例如多頭高檔昨日收十字線、墓碑線、吊人線等變盤K線，今日開盤價就很重要，如果開高，便能化解疑慮；開低，多頭就要小心，可能要變盤了。同樣的，股價下跌一段，昨日出現止跌的變盤線訊號，今天如果開盤向上，自然容易轉折向上。\n\
    \n4. 開盤漲停板或跌停板，是主力強力表態做多或下殺的企圖，不可輕忽後續的走勢。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_30_0.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_30_1.png)\n\n資料來源：富邦e01電子交易系統\n\n-\
    \ 當日股價B，遇到前面A點頭部壓力，出現黑K上影線的變盤線，次日開盤開低，主力沒有企圖要攻過高點B。\n- 當日股價D，遇到前面C點頭部壓力，出現小紅K十字線的變盤線，次日開低盤，主力沒有企圖要攻過高點C。\n\
    - 當日股價E，遇到前面C、D點頭部壓力，出現小黑K十字線的變盤線，次日主力企圖很強，開盤跳空上漲，並且放量攻過A、B、C、D、E所有的高點。\n\n##\
    \ 元素2：收盤價\n\n1. 當日多空雙方經過一天的決戰後，最後的結果價格。\n\n2. 以收盤價為界線，收盤價的上方視為空方力量的範圍，收盤價的下方視為多方力量的範圍，依此可看出當日多空勢力的強弱，並可預測明日開高或開底的意圖。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_31_0.png)\n\n3. 收盤價與昨日K線比較，從收盤價是否突破昨日K線最高點，或跌破昨日K線最低點，可觀察股價將會轉強或轉弱。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_31_1.png)\n\n## 元素3：最高價\n\n1. 當日多方力量所能攻到的最高價位。\n\
    \n2. 空頭抵擋反擊的價位，或是多頭開始撤退的位置。\n\n3. 與昨日最高價相比，從是否突破昨日最高價，或未突破昨日高價即壓回，可看出主力是否有續多的企圖。\n\
    \n4. 最高價來到前面壓力位置，如果沒過，或者是過了又拉回，留下長的上影線，表示該位置出現壓力訊號，次日要特別注意是否將遇壓回檔或拉回下跌。\n\n##\
    \ 元素4：最低價\n\n1. 當日空方力量到達的最低價位。\n\n2. 多頭抵擋開始反擊，或是空頭回補的位置。\n\n3. 與昨日最低價相比，是否跌破昨日最低點是重要觀察指標，如果今日最低價跌破昨日最低點，表示多空激戰，要密切注意收盤價位置。\n\
    \n4. 最低價來到前面的支撐位置，如果沒跌破，或者是跌破又拉上來，留下長的下影線，表示該位置出現支撐訊號，次日要特別注意是否將遇撐反彈或上漲。\n\n#\
    \ 第 1 篇\n## 第 2 章 解讀K線密碼\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_33_0.png)\n\
    \n當天股價C的黑K最低點，遇到前面A點支撐，出現下影線的止跌訊號，次日開高向上，表示股價要上漲。\n\n當天股價D的紅K最高點，遇到前面B點大量長紅K線壓力，出現上影線的止漲訊號，次日開低向下，表示後續股價持續下跌。\n\
    \n## 元素5：½ 價\n\n指當日（最高價＋最低價）÷2的價格\n\n1. ½ 價代表當日多空交易平均成本。\n2. 大量長紅K線，日後回檔跌破½ 價，表示多方氣勢轉弱。大量長黑K線，日後反彈突破½\
    \ 價，表示空方力道轉弱。\n3. 股價漲到高檔，出現大量長紅K線，如跌破長紅K線的½ 價，高檔做頭的機率大增，要小心反轉。\n4. 股價跌到低檔，出現大量長黑K線，如突破長黑K線的½\
    \ 價，低檔止跌回升的機率大增，要注意反彈。\n5. 因此，走勢中只要出現大量的長紅K線或長黑K線，都要特別注意½ 價的位置，看是處於相對高檔或低檔。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_34_0.png)\n\n資料來源：富邦e01電子交易系統\n\n###\
    \ 股票走勢圖是K線的延伸\n\n- 價格：交易進行中隨時變化\n- 1根K線：收盤後完成，但是下一根K線會有不同變化\n- 2根K線組合：完成次日的K線，形成連續2日的K線變化\n\
    - 3根K線組合：再完成1日的K線，形成連續3日的K線變化\n- 均線：數日K線的收盤價產生不同週期的均線\n- 波浪形態：股價在均線上下波動，產生轉折波的高低點\n\
    - 多空市場：依據轉折波的高低點判別多頭或空頭\n- 趨勢：多頭上漲行進或空頭下跌行進所產生的趨勢\n\n1. 從上面的前後關係可以看出，一個趨勢是由價格形成K線，然後再一步一步往下發展而成，所以從K線可最快看出轉折訊號，但是決定方向的力量，趨勢最大。\n\
    \n2. 學習K線，要從單日K線開始，根據單日K線的意義，研判後續走勢，再逐步學習2日K線、3日K線、多日K線的意義，循序漸進到波浪型態的結構，並掌握趨勢。\n\
    \n3. K線只是趨勢結構的一分子，波浪型態一旦完成確立，趨勢的反轉需要時間因素及條件因素的配合，也就是說，趨勢的反轉，必須等到頭部或底部型態完全確立，才有轉向的能力。因此，在多頭格局中，「上漲K線」會加分，「下跌K線」則會減分。\n\
    \n4. 對K線的解讀，不能單以一天來判斷，一天的K線容易受到突發事件的影響，產生無法預期的狀況，因此，一天的K線只能看當天的交易狀況，兩天的K線可以看出多空力道是否延續或出現變化，連續三天K線的變化，則可以看出方向轉折。再觀察多幾天K線的連續變化，可以判斷短線的走勢方向、型態的變化及波浪的型態。\n\
    \n1日K線：看當天多空強弱。\n\n2日K線：看次日多空是否延續或出現變化。\n\n3日K線：看是否出現轉折。\n\n5日K線：看短期的方向。\n\n#\
    \ 從K線橫盤確認突破或跌破\n\n在走勢圖當中，我們常常看到K線橫向走勢，股價一直沒有突破前一根K線的最高點，也沒有跌破最低點，這樣的橫向K線超過3根以上，可以視為K線的橫盤或盤整。\n\
    \n出現K線的橫盤或盤整，要如何確認盤整結束呢？如果出現一根中長紅K線，收盤突破所有橫盤的K線最高點，這樣就能確認往上突破，以及上漲的方向，在多頭趨勢中，這是進場做多的買進位置。\n\
    \n或者出現一根中長黑K線，收盤跌破所有橫盤的K線最低點，這樣就能確認往下跌破，以及下跌的方向，在空頭趨勢中，這是進場放空的位置。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_37_0.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_38_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_38_1.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_38_2.png)\n\n資料來源：富邦e01電子交易系統\n\
    \n# K線內涵為什麼很重要？\n\nK線內涵指的是K線當天的走勢圖，也就是當天K線是怎麼走出來的。相同的單一K線，當天的實際走勢不會相同，可用來判斷多空角力的情形，例如是主力強勢拉漲停板，還是經過多空廝殺後，多方戰勝而上漲到漲停板，這對明天或以後的走勢會有不同影響。\n\
    \n同樣是長紅K線漲停板，盤中分時K線完全不同：\n\n1. 開盤2分鐘拉到漲停板。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_39_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n2. 開盤先下跌，再向上拉到漲停板。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_40_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n3. 開盤漲停，下跌到平盤，再向上拉到漲停板。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_40_1.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n# 第2章 解讀K線密碼\n\n4. 平盤附近盤整再上漲，盤整後尾盤向上拉到漲停板。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_41_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n第1圖是主力一開盤就急拉到漲停板鎖住，第4圖是主力在接近收盤時急拉到漲停板鎖住。從這兩檔股票的K線，可看出主力的企圖是於開盤時或收盤前急拉，目的都是不希望有太多散戶跟進，如果當天是多頭起漲的進場位置，要立刻買進。\n\
    \n第2圖是主力先下殺，散戶看下跌而不敢進場，同時洗出一些不安心的籌碼，再快速拉漲停板，這也是主力強勢的表態。\n\n第3圖表示籌碼不安定，開盤漲停板後立刻打開，再迅速下跌到平盤，上下拉鋸，出現的是長上影線的K線，要看位置及成交量，才可確定可否介入。\n\
    \n## K線的3個環境條件\n\n研判K線代表的意義之前，要先確認3個環境條件：\n\n- 條件1：先確認行情趨勢是在多頭、空頭或盤整。\n- 條件2：K線在走勢中的相關位置，是低檔、高檔、行進中、接近壓力或支撐，還是關鍵突破或跌破。\n\
    - 條件3：成交量的變化可以幫助確認，K線的能量大小及籌碼的變化。\n\n## 看K線 要结合趨勢概念\n\n許多投資人在看K線時，往往只顧到K線本身的變化，而忽略了趨勢的方向，造成一些錯誤的解讀。結合趨勢的方向看K線時，應注意以下幾點：\n\
    \n1. 趨勢多頭時，K線開低走高或開高走高是正常，不必做太多解讀。K線開高走低或開低走低，才是不正常的訊號，此時根據位置可解讀為：可能是要休息、漲多要回檔，或者是波浪型態改變，可能要開始盤整。\n\
    \n2. 趨勢多頭時，K線開平盤後往上走是正常，跌破平盤往下則顯示出現空方力道，是轉弱的訊號，此時根據位置可解讀為：可能是要休息，或是漲多要變盤。\n\n\
    3. 趨勢多頭時，K線開平盤後往上是正常，但漲到高點後股價回跌，則顯示出現上檔賣壓，是轉弱的訊號，此時根據位置可解讀為：可能是要休息，或是漲多要變盤。\n\n\
    4. 趨勢空頭時，K線開高走低或開低走低是正常，不必做太多解讀。K線開低走高或開高走高，才是不正常的訊號，此時根據位置可解讀為：可能是要止跌、跌深要反彈，或者是波浪型態改變，可能要開始盤整。\n\
    \n5. 趨勢空頭時，K線開平盤後往下是正常，突破平盤往上則顯示出現多方力道，是轉強的訊號，此時根據位置可解讀為：可能是要止跌，或是跌深要變盤。\n\n6.\
    \ 趨勢空頭時，K線開平盤後往下是正常，但跌到低點後股價上拉，則顯示出現下檔有支撐買盤，是轉強的訊號，此時根據位置可解讀為：可能是要止跌，或是跌深要變盤。\n\
    \n## 2根K線的合併應用\n\nK線是每天盤勢的連續發展，所以有延伸性，例如連續兩天的K線，可以視為昨天開盤交易延續到今天的收盤結果，兩天的K線可合併成一根K線，看出兩天的多空強弱。\n\
    \n2根K線的合併方法，取第一天開盤價、第二天收盤價、這兩天交易的最高價和最低價，用這4個元素畫出一根K線。\n\n1. 連續兩天中紅K線，合併看是一根長紅K線，其作用與長紅K線一樣，1/2價是兩天的交易平均成本，在高檔時不能跌破，跌破氣勢轉弱。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_43_0.png)\n\n2. 一天長紅K線，一天長黑K線，合併是一根長上影線小黑K線，表示上面賣壓很重，上漲在高檔時，要小心是否會變盤轉折向下。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_44_0.png)\n\n3. 一天長黑K線，一天小紅K線，合併是一根長下影線的小紅K線，在高檔是反轉訊號吊人線，在低檔時是止跌訊號的錨子。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_44_1.png)\n\n4. 一根長黑K，吞噬前一天的紅K，合併是長上影線的小黑K線，在高檔時是多方遇強大壓力，是反轉訊號。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_44_2.png)\n\n5. 2天K線合併是長上影線的十字K線（天劍），是變盤的訊號，要注意次日的開盤走勢。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_44_3.png)\n\n# 第 1 篇\n# 第2章 解讀K線密碼\n\
    \n6. 2天K線合併看是長下影線的小黑K線的紡錘線，同樣是變盤的訊號，要注意次日的開盤走勢。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_45_0.png)\n\
    \n## 3根K線的合併應用\n\n3根K線的合併方法是，取第一天的開盤價、第三天的收盤價、這三天交易的最高價，以及這三天交易的最低價，畫出一根K線。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_45_1.png)\n\n右圖的3條K線，一般稱為夜星，是高點轉折向下的訊號，如果把它組成一條K線來看，就是單一K線高檔出現長上影線的變盤訊號。\n\
    \n# 第2篇\n\n# 第 1 章\n## 長紅和長黑K線走勢的關鍵\n\n### 定義\n\n開盤與收盤上下幅度達4.5%以上，開低走高的實體紅K線，而且是沒有上下影線的實體K棒，即使有，也只能有很小的影線。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_48_1.png)\n\n### 解說\n\n在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到長紅K線。就單一K線而言，當天開盤是最低價，然後買盤積極，最後上漲到最高價收盤，所以當天是多方強。\n\
    \n### 精通\n\n1. 當天買盤雖積極，仍要分辨是主力大戶買進，還是散戶的追逐，不同的交易人買進，造成的結果就不同。換句話說，出現長紅K線，並不表示日後一定會繼續上漲。\n\
    2. 長紅K線出現在不同趨勢、不同位置，代表的意義就不同，甚至完全相反，股友不可不察。要精準判讀長紅K線，必須先區分不同趨勢中的不同位置。\n\n## 多頭上漲趨勢中的長紅K線\n\
    \n在多頭上漲趨勢中，長紅K線會出現在以下6個位置。\n\n### 位置1：出現在多頭底部打底期間\n\n代表底部有主力在吸貨，通常會出現一些量增的現象，由於主力尚未佈局完成，所以沒有發動向上上漲的攻勢。\n\
    \n### 位置2：出現在底部打底完成時\n\n通常都會配合攻擊量，可視為主力宣示多頭的開始，要把握機會買進做多。這根宣示上漲的長紅K，要突破底部盤整或型態的最高點才算確認。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_49_0.png)\n\n1. 在底部盤整時陸續出現帶大量的長紅K線，但是都沒有上攻，代表主力分批吸貨。\n\
    2. 盤整的突破，是多頭確認的關鍵K棒，出現帶大量的長紅K線，確認多頭打底完成，開始多頭上漲走勢。\n"
