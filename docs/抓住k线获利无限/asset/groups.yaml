    ### 2 根K線看轉折


    ### 1. 左長紅右長黑


    #### 定義


    左邊上漲幅度達2.5%以上的中長紅K線，右邊下跌幅度達2.5%以上的中長黑K線，2根K線構成上漲高點或頭部反轉向下的型態，2根K線必須是中長實體，可以有小的上下影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_154_0.png)


    #### 解說


    在走勢上漲中，昨天是長紅K線，但今天收盤卻是一根並肩的黑長K線，很明顯的，昨天多方強力上漲的力量，今天被空方完全克服。這是股價上漲轉折向下的K線基本型態。


    #### 精通


    1. 上漲在高檔，是一組轉折向下的訊號（次頁圖1）。

    2. 在空頭起跌的位置，要提高警覺，小心是騙線，主力假攻、真下跌，投資人不可不察（圖 2 ）。


    3. 在空頭走勢中，是反彈結束訊號（圖 3 ）。


