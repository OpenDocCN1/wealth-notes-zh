    - 漲到高檔，出現爆量，次日出現並肩長黑，是轉折向下訊號，要注意次日走勢，跌破黑K最低點，行情反轉。

    - 下跌後反彈，再次出現並肩紅黑K線，次日向下跳空，空頭確認。


