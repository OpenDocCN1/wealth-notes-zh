    # 第1章 K線交易法的操作訣竅


    學習K線交易法，利用K線的收盤價變化，當成進出的依據，並且輕鬆獲利。


    訣竅1：何時適合使用K線交易法？


    +   - 多頭上漲的強勢股：上升角度45度以上走勢。

    - 多頭上漲的飆股。

    - 急漲後搶倒V形回檔的急跌行情。

    - 空頭下跌的弱勢股：下降角度45度以上走勢。

    - 急跌後搶V形反彈的急漲行情。


    訣竅2：執行K線交易法，要注意哪些事項？


    +   - K線交易法屬於短線交易。

    - K線交易法用日線操作。

    - 無論進出都以收盤價確認。

    - K線交易法不能用在緩漲或盤整走勢。'
