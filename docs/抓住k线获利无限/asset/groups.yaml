  - '[PAGE 62]


    # 定義


    開盤與收盤上下幅度達4.5%以上，開高走低的實體黑K線，而且是沒有上下影線的實體K棒，即使有，也只能有很小的影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_62_0.png)


    # 解說


    在行情走勢圖中不論多頭上漲、空頭下跌或盤整，都可以看到長黑K線。就單一K線而言，當天開盤是最高價，然後實壓積極，最後下跌到最低價收盤，所以當天是空方強。


    # 精通


    +   1. 當天實壓雖積極，仍要分辨是主力大戶賣出，還是散戶的追殺，不同交易人的賣出，造成的結果就不同。換句話說，出現長黑K線，並不表示日後一定會繼續下跌。

    2. 長黑K線出現在不同趨勢、不同位置，代表的意義就不同，甚至完全相反，股友不可不察。要精準的判讀長黑K線，必須先區分不同趨勢中的不同位置。


    在多頭上漲趨勢中，長黑K線會出現在以下5個位置。'
