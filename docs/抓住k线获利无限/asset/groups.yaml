    # 低檔3根K線轉折向上的基本型態


    **定義**

    左邊1根下跌的中長黑K線，中間1根變盤線，右邊1根上漲的中長紅K線。由3根K線構成下跌到低點的反轉向上的基本型態，通常中間的變盤線稱為「星」，轉折向上的組合型態稱為「晨星」。


    **解說**

    走勢下跌到低檔的長黑K線，次日收盤出現多空對決的變盤線，再出現一根上漲的長紅K線，很明顯的，昨天對決之後，多方戰勝，原來向下方空方的主控，現在轉為向上多方的主控。晨星轉折是股價下跌轉折向上的一組K線基本型態。


    +   **精通**

    1. 空頭下跌在低檔，是一組轉折向上的訊號，股價要反彈。

    2. 多頭回檔出現「晨星」，回檔結束，股價繼續上漲。


