  md: "\n# 第6篇\n\n## 第2章 缺口的支撐與壓力\n\n### 祕訣3：何謂真封口和假封口？\n\n- 向上跳空缺口，如果股價在近日內拉回，出現帶大量的實體黑K線，收盤到缺口下沿或跌破缺口下沿，稱為「真封口」（回補）。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_307_0.png)\n\n- 向下跳空缺口，如果在近日內，股價回升出現帶大量的實體紅K線，收盤到缺口上沿或突破缺口上沿，稱為「真封口」（回補）。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_307_1.png)\n\n- 向上跳空缺口，回補缺口的黑K線，留有長下影線，或者回補缺口呈現帶大量紅K或量縮，容易是假封口（回補）。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_307_2.png)\n\n- 向下跳空缺口，回補缺口的紅K線，留有長上影線，或者回補缺口呈現帶大量黑K或量縮，容易是假封口（回補）。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_307_3.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_308_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 高檔大量長紅，股價不漲，第2天向下跳空缺口見長黑。\n- 近日反彈，出現量縮長黑K線，封閉缺口，這是假封口，後續股價繼續下跌。\n\
    \n### 缺4：上有缺、下有口 多空交鋒走區間\n\n上漲走勢出現向上跳空缺口，之後上漲一段，回跌出現向下跳空缺口，股價處在有缺口壓力，下有缺口支撐的區間震盪，必須有一方的缺口被回補突破或跌破，多空才明朗。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_308_1.png)\n\n下跌走勢出現向下跳空缺口，之後下跌一段，反彈出現向上跳空缺口，股價處在有缺口壓力，下有缺口支撐的區間震盪，必須有一方的缺口被回補突破或跌破，多空才明瞭。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_309_0.png)\n\n### 缺5：3日2缺口 向上要大漲、向下要大跌\n\
    \n- 多頭打底時無論是第1支腳或第2支腳，出現上漲連3紅K，而且是2日2缺口，當底部完成，是一支強勢多頭股票，要鎖股做多。\n- 多頭上漲的關鍵起漲位置，連續3日向上出現2個跳空缺口，是主力強力做多的宣示，只要缺口沒有被回補，股價容易大漲。\n\
    - 多頭上漲到高檔，出現3日2缺口，同時爆大量，要特別注意股價不漲或下跌，以及向上缺口是否被回補。\n- 空頭做頭時無論是第1個頭或第2個頭，出現下跌連3黑K，而且是3日2缺口，當頭部完成，是一支弱勢空頭股票，要鎖股做空。\n\
    - 空頭下跌起跌的位置，連續3日向下出現2個跳空缺口，是主力強力做空的宣示，只要缺口沒有被回補，股價容易大跌。\n- 空頭下跌到低檔，出現3日2缺口，同時爆大量，要特別注意股價容易反彈。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_310_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_310_1.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n底部打底第2支撐出現3天2缺口帶大量長紅，後續是支撐勢上漲的股票。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_310_2.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n高檔出現3天2缺口帶大量長紅，次日帶大量吊人線是變盤訊號，注意轉折向下。\n\n高檔出現3天2缺口長黑下跌，後續容易大跌。\n\
    \n## 第2章 缺口的支撐與壓力\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_311_0.png)\n\n資料來源：富邦eO1電子交易系統\n\
    \n- 高檔頭低低的第2個頭出現3天2缺口長黑下跌，後續容易大跌。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_311_1.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n- 低檔出現3天2缺口長黑急跌，爆大量後容易反彈。\n- 反轉向向上出現向上跳空缺口，底部形成左有缺、右有口的「島狀反轉」，後續多頭上漲。\n\
    \n# 第7篇\n\n## 第1章 K線交易法的操作訣竅\n\n學習K線交易法，利用K線的收盤價變化，當成進出的依據，並且輕鬆獲利。\n\n### 訣竅1：何時適合使用K線交易法？\n\
    \n- 多頭上漲的強勢股：上升角度45度以上走勢。\n- 多頭上漲的飆股。\n- 急漲後搶倒V形回檔的急跌行情。\n- 空頭下跌的弱勢股：下降角度45度以上走勢。\n\
    - 急跌後搶V形反彈的急漲行情。\n\n### 訣竅2：執行K線交易法，要注意哪些事項？\n\n- K線交易法屬於短線交易。\n- K線交易法用日線操作。\n\
    - 無論進出都以收盤價確認。\n- K線交易法不能用在緩漲或盤整走勢。\n\n### 訣竅3：何時是多頭走勢的進場做多時機？\n\n- 低檔打底完成的帶大量上漲紅K線，股價收盤突破底部盤整上頸線時。\n\
    - 上漲途中回檔後再上漲的紅K線，股價突破前一日的高點時。\n- 續勢盤整完畢，股價向上突破盤整的大量長紅K線時。\n\n### 訣竅4：多頭交易的規則\n\
    \n- 進場：收盤前確認股價，突破前一日最高點時買進。\n- 停損：進場當日K線股價的最低點（不能超過7%）。\n- 續抱：每天收盤前檢視股價，沒跌破前一日最低點時續抱。\n\
    - 出場：收盤前確認股價跌破前一日最低點時出場。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_316_0.png)\n\
    \n1. 大量上漲紅K線，收盤突破前高，符合多頭進場位置，做多買進。\n2. 停損設定進場紅K線的最低點。\n3. 上漲中收盤沒跌破前一日K線的最低點，多單續抱，一直到收盤跌破前一日K線的最低點，多單出場。\n\
    4. 多頭回檔之後再上漲，收盤突破前一日最高點，符合多頭進場位置，做多買進。\n5. 上漲中收盤沒有跌破前一日K線的最低點，多單續抱，一直到收盤跌破前一日K線的最低點，多單出場。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_317_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n\
    1. 大量上漲紅K線，收盤突破前高，符合多頭進場位置，做多買進。停損設定進場紅K線的最低點。\n2. 收盤跌破前一日K線的最低點，多單出場。\n3. 多頭回檔之後再上漲，收盤突破前一日最高點，符合多頭進場位置，做多買進。\n\
    4. 上漲中收盤都沒跌破前一日K線的最低點，多單續抱，等到收盤跌破前一日K線的最低點，多單出場。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_318_0.png)\n\
    \n### 訣竅 5：何時是空頭走勢的進場做空時機？\n\n- 高檔出現頸部完成確認的下跌黑 K 線，股價收盤跌破頸部盤整下頸線時。\n- 下跌途中，反彈後再下跌的黑\
    \ K 線，股價跌破前一日最低點時。\n- 下跌中續勢盤整完畢，股價收盤向下跌破盤整區時。\n\n### 訣竅 6：空頭交易的規則\n\n- 進場：收盤前確認股價跌破前一日最低點時放空。\n\
    - 停損：進場當日 K 線股價的最高點（不能超過 7%）。\n- 續抱：每天收盤前檢視股價，沒突破前一日的最高點時續抱。\n- 出場（回補）：收盤前確認股價，突破前一日最高點時出場（回補）。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_319_0.png)\n\n1. 大量下跌黑K線，收盤跌破頭部盤整，符合空頭進場位置，做空。\n\
    2. 停損設定進場黑K線的最高點。\n3. 下跌中收盤都沒突破前一日K線的最高點，空單續抱，一直到收盤突破前一日K線的最高點，空單回補。\n\n## 第2章\
    \ V形反轉的K線交易法\n\nV形及倒V形反轉多因急跌或急漲，造成股價急速一日反轉，每次出現，都會在短時間上漲或下跌很大幅度，如果能夠掌握這種機會立刻進場，就能在短時間內賺到不錯的利潤。\n\
    \nV形及倒V形反轉的速度很快，許多投資人無法在第一時間發現而介入，錯失賺錢的機會，事實上只要了解它的特性，遵守操作紀律，大膽進場、果斷出場，要賺這種小飆一段的利潤，實非難事。\n\
    \n至於交易條件，則是完全以技術面操作，屬於逆勢交易，必須嚴守停損及停利紀律，出現任何危險訊號都要立刻出場，不可拗單。另外，採用日線操作，專門鎖定急跌、急漲或乖離過大的股票。\n\
    \n- 買進：符合下列4條件可以買進搶反彈\n    1. 急殺：連續重挫急殺3天或3天以上的長黑K線或跳空跌停，跌幅超過15%以上。\n    2. 爆量：下殺低檔出現爆大量。\n\
    \    3. 止跌：急殺後出現下列止跌訊號\n        - 開低走高中長紅K線。\n        - 長下影線的K線。\n        - 長下影線的十字線、紡錘線、鎗子線等變盤線。\n\
    \        - 股價先跌破昨日最低點，再上漲突破昨日最高點的吞噬紅K線。\n    4. 過高：止跌當天或次日收盤突破前一日K線的最高點，為反彈確認的進場位置。因為屬於逆勢交易，要設好停損。\n\
    \    5. 停損：停損設進場K線的最低點，最多不超過7%。\n    6. 續抱：股價未跌破上升急切線續抱，股價未跌破前一日K線最低點續抱。\n   \
    \ 7. 出場：可用下列3種方式停利出場\n        - 收盤跌破上升急切線的黑K。\n        - 收盤跌破前日K線最低點的黑K。\n   \
    \     - 收盤跌破3日均線的黑K。\n\n### V形反轉的目標位置\n\n空頭急跌後V形反彈，目標到開始急跌的起跌點，當然這只是目標價，並非絕對會到達，因此要嚴守出場紀律，即使沒到目標價，也一定要出場。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_321_0.png)\n\n### V形反轉反彈後的可能走勢\n\n\
    空頭急跌後V形反彈是強力反彈，造成股價急速上漲，當反彈結束，後續走勢容易打底，要密切觀察打底的型態，可以鎖住下次做多的好機會。\n\n1. 反彈結束後，回跌到打第\
    \ 2 支腳不破前面最低點，出現底底高，回跌幅度越小，底部就越強，越容易完成多頭架構的頭頭高。回到 A 點上漲最強，B 點次之，C 點最弱。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_322_0.png)\n\
    \n2. 反彈結束後，維持在高檔出現橫向盤整，出現「頭肩底」型態，要密切鎖股，當橫向盤整結束，出現向上突破的中長紅 K 線（A），是做多位置，要把握機會立刻進場做多。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_322_1.png)\n\n3. 強力反彈突破前高後才回跌，沒有跌破前高的支撐，就做第\
    \ 2 支腳中長紅 K 線（A）上漲，確認多頭，要把握機會立刻進場做多。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_322_2.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_323_0.png)\n\n1. 連續3天以上的急跌黑K線。\n2.\
    \ 出現止跌的紅K變盤線。\n3. 同時出現大量。\n4. 收盤突破前一日K線的最高點進場搶反彈。\n5. 反彈目標價到起跌點。\n6. 黑K線跌破上升急切線，同時跌破前一日K線最低點及3日均線，搶反彈多單出場。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_324_0.png)\n\n1. 連續4天以上的急跌黑K線跌停板。\n\
    2. 出現止跌的長紅K雙盤線。\n3. 同時出現大量。\n4. 收盤突破前一日紅K線的最高點，進場搶反彈做多。\n5. 目標價到起跌點。\n6. 收盤跌破上升急切線，同時也跌破前一日K線最低點及3日均線，搶反彈多單出場。\n\
    7. 強勢反彈之後回測約1/3，出現帶大量長紅K線上漲，開始底底高打底，鎖股做多。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_325_0.png)\n\
    \n1. 連續3天以上的急跌黑K線。\n2. 出現上漲的紅K線。\n3. 同時出現大量。\n4. 收盤突破前一日K線的最高點進場搶反彈。\n5. 反彈目標價到起跌點。\n\
    6. 黑K線跌破上升急切線，同時也跌破前一日K線最低點及3日均線，搶反彈多單出場。\n7. 反彈後回跌一天，次日紅K線收盤過前一日最高點，多單進場做多。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_326_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n\
    1. 連續3天以上的急跌黑K線。\n2. 同時出現大量。\n3. 出現止跌的紅K線。\n4. 連續3日收盤都沒有突破前一日K線的最高點，第4個過高的條件沒出現，不能進場搶反彈，後續繼續下跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_327_0.png)\n\n資料來源：富邦eCI 電子交易系統\n\n\
    1. 連續3天以上的急跌黑K線。\n2. 出現止跌的紅K線。\n3. 同時出現大量。\n4. 連續3日收盤都沒有突破前一日K線的最高點，第4個過高的條件沒出現，不能進場搶反彈，後續繼續下跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_328_0.png)\n\n買進：符合下列4條件可以做空搶回檔\n\n\
    1. 急漲：連續急漲3天或3天以上的長紅K線或跳空漲停，漲幅超過15%以上。\n2. 爆量：急拉高檔出現爆大量。\n3. 止漲：急漲後出現下列止漲訊號\n\
    \    - 開高走低中長黑K線。\n    - 長上影線的K線。\n    - 長上影線的十字線、紡錘線、鎺子線等變盤線。\n    - 股價開高走低後出現長黑吞噬K線。\n\
    4. 破低：止漲當天或次日收盤跌破前一日K線的最低點，為回檔確認的做空位置。因為屬於逆勢交易，要設好停損。\n\n停損：停損設進場K線的最高點，最多不超過7%。\n\
    \n續抱：股價未突破下降急切線時續抱，股價未突破前日K線高點續抱。\n\n出場：可用下列3種方式停利出場\n\n1. 收盤突破下降急切線的紅K。\n2. 收盤突破前日K線最高點的紅K。\n\
    3. 收盤突破3日均線的紅K。\n\n### 倒V形目標價的兩標位置\n\n多頭急漲後倒V形回檔，目標到開始急漲的起漲點，當然這只是目標價，並非絕對會到達，因此要嚴守出場紀律，即使沒到目標價，也一定要出場。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_329_0.png)\n\n### 倒V形急漲後倒V形的可能趨勢\n\n\
    多頭急漲後倒V形是急速回檔，造成股價下跌，當回檔結束，後續走勢容易做頭，要密切觀察做頭的型態，可以鎖住下次做空的好機會。\n\n1. 回檔結束後上漲打第2個頭，沒突破前面最高點，出現頭頭低，上漲幅度越小，頭部就越強，越容易完成空頭架構的底底低。回到A點下跌最強，B點次之，C點最弱。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_329_1.png)\n\n2. 回檔結束後，維持在低檔出現橫向盤整，出現「頭肩頂」的型態，要密切鎖股，當橫向盤整結束，出現向下跌破的中長黑K線（A），是做空位置，要把握機會立刻進場做空。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_329_2.png)\n\n3. 強力回檔跌破前低後才上漲，回升沒有突破前低的壓力，就做第2個頭中長黑K線（A）下跌，確認空頭，要把握機會立刻進場做空。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_330_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_331_0.png)\n\
    \n1. 連續3天以上的急漲紅K線。\n2. 同時出現大量。\n3. 出現止漲的黑K線，同時跌破前一日紅K線的最低點，做空搶回檔。\n4. 倒V形反轉回檔的目標價為前面的起漲點。\n\
    5. 長紅K線突破下降急切線，突破前一日K線最高點及3日均線，空單回補。\n6. 急跌回檔後在低檔右邊盤整做右肩，黑K跌破，頭肩頂型態完成，做空。\n\n\
