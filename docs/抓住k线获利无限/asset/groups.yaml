    ## 第5篇 血管中的长线组合


    ### 第 1 章 上漲中的K線組合


    上漲中的K線有8種組合，詳細研讀，就可以正確判斷行情的變化。


    #### 定義


    1根上漲的中長紅K線，次日1根十字或紡錘變盤線，第3日1根高於第1日中長紅K線最高點的中長紅K線，這3根K線上漲構成的組合，稱為「一星二陽」。通常中間的「星」可以是紅K或黑K，也能是實體，但實體要很小。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_234_0.png)


    #### 解說


    - 1. 在走勢上漲中經常可以看到「一星二陽」的組合，這是上漲中繼的訊號，表示往上趨勢沒有改變，通常還有更高價，仍為多方主控向上的格局。

    - 2. 夾在中間的「星」可以有2根以上，重點是，「星」的K線收盤不能跌破前一天K線的最低點，其後要有1根向上的中長紅K線，幅度與之前的中長紅K線略同或更大。


    #### 精通


    - 1. 多頭上漲1根中長紅K線，當天漲幅太大，次日很容易出現買壓而呈休息狀態，然後再上攻，所以上漲時容易出現「一星二陽」的組合。

    - 2. 「一星二陽」的組合後續還有高點，當多頭起漲第1根中長紅K線，次日出現休息的變盤線，可以大膽推測，後面容易再出現上漲1根中長紅K線，形成「一星二陽」的組合而買進。要特別強調的是，這是指多頭起攻的位置，如果上漲到高檔，就不能這樣推測，因為高檔長紅再出現變盤十字線，容易出現「夜星」向下轉折。

    - 3. 多頭上漲1根中長紅K線之後，連續出現1根以上的小紅、小黑或變盤線，如果都橫盤維持在中長紅K線收盤之上，是強勢整理的型態，隨時都可能發動上漲，把之前位於下面的中長紅K線搬到上面，面臨這樣的強勢整理型態，要把握上攻的機會進場。

    - 4. 多頭上漲1根中長紅K線之後，連續出現1根以上的小紅、小黑或變盤線，如果維持小幅上漲，是碎步上漲型態，隨時都可能發動大漲，出現中長紅K線的走勢。

    - 5. 出現「一星二陽」的組合後，其後的中長紅K線最低點不能被跌破，否則會破壞「一星二陽」的架構。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_235_0.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_236_0.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_236_1.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_236_2.png)


    > 資料來源：富邦e01電子交易系統


    - 下跌到低檔出現「一星二陽」，後面還有高點，容易繼續反彈。

    - 下跌到低檔再次出現「一星二陽」，同時沒有跌破前面低點，容易打底反轉。


    ### 第 5 章 上漲中的K線組合


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_237_0.png)


    - 1. 底部盤整突破，起攻位置出現「一星二陽」組合，後面還有高點，容易繼續上漲，要鎖股繼續做多操作。

    - 2. 休息盤整維持在高檔，呈現碎步上漲。

    - 3. 碎步上漲11天，第12天出現大漲。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_238_0.png)


    > 資料來源：富邦eO!電子交易系統


    - ① 底部盤整跌破後反彈，出現爆大量長紅K線的「一星二陽」組合，後面還有高點，波浪型態為「假跌破真上漲」型態。

    - ② 上漲行進再出現「一星二陽」組合，後面還有高點。

    - ③ 上漲行進再出現「一星二陽」組合，後面還有高點。

    - ④ 上漲行進再出現「一星二陽」組合，後面還有高點。連續出現「一星二陽」組合，走勢呈現強勢上漲。


    #### 定義


    1根上漲的中長紅K線，次日出現回跌1到數日的小紅、小黑或變盤線，但收盤價始終沒有跌破中長紅K線最低點，再出現往上的中長紅K線，吞噬回跌的小紅、小黑或變盤線。「上升三法」在上漲趨勢中時常見到，表示後續還有高點，為上漲的中繼組合。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_239_0.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_239_1.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_239_2.png)


    #### 解說


    在走勢上漲出現中長紅K線，次日回跌，大多是主力洗盤清籌碼，下跌的力度都不強，而且沒跌破中長紅K線最低點，再1根中長紅K線上漲，回跌的壓力全部化解，次日只要開高往上，將繼續多頭。


    #### 精通


    - 1. 空頭下跌到低點，出現「上升三法」的組合，之後不再跌破第二根中長紅K線最低點，可視為止跌回升的訊號。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_240_0.png)


    - 2. 多頭上漲1根中長紅K線之後，回跌的小紅、小黑或變盤線，如果都維持在中長紅K線的1/2之上，是強勢整理的型態，在多頭走勢中隨時都可能發動上漲，要把握上攻的機會進場。

    - 3. 出現「上升三法」的組合後，其後的中長紅K線的低點不能被跌破，否則會破壞「上升三法」的架構。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_240_1.png)


    > 資料來源：富邦e01電子交易系統


    - 1. 空頭到低檔出現「晨星」轉折後反彈。

    - 2. 反彈回跌後再長紅上漲，出現「上升三法」組合，後面還有高點。

    - 3. 上漲行進出現「一星二陽」組合，後面還有高點。

    - 4. 上漲行進再出現「上升三法」組合，後面還有高點，呈現強勢上漲。


    ### 第1章 上漲中的K線組合


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_241_0.png)


    > 資料來源：富邦e01電子交易系統


    - ① 空頭到低檔出現長紅吞噬後反彈。

    - ② 多頭確認後再上漲出現「上升三法」組合，後面還有高點。

    - ③ 上漲行進出現「一星二陽」組合，後面還有高點。

    - ④ 上漲行進再出現「上升三法」組合，後面還有高點，呈現強勢上漲。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_242_0.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_242_1.png)


    #### 定義


    上漲行進中連續三根小紅黑K線下跌回檔或橫盤，然後出現一根長紅K線，把前面三根小紅黑K線均包含在長紅K線之內，這根長紅K線呈現吞噬的組合，稱為「三線反紅」，為回檔後的續攻訊號。在下跌行進中出現「三線反紅」的組合，為跌多的空頭回補或多方反攻的訊號。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_242_2.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_242_3.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_242_4.png)


    #### 解說


    在下跌或橫盤連續出現小紅K線或小黑K線，表示空方下跌力道弱，多方1根上漲攻擊長紅K線就吞噬全部下跌或橫盤的小紅K線或小黑K線，為多方強力上漲或反彈的訊號。


    #### 精通


    - 1. 「三線反紅」組合必須符合2個條件才成立：(1) 長紅K線收盤突破前面3根小紅K線或小黑K線的最高點；(2) 上漲長紅K線的成交量大於前面3根小紅K線或小黑K線的最高量。

    - 2. 「三線反紅」組合是多方強力表態，在多頭趨勢，短線拉回沒有跌破長紅K線的最低點，要找買點進場。在空頭走勢，可以搶短線反彈。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_243_0.png)


    - 多頭回檔出現4根小跌或橫盤小紅、小黑K線，1根長紅K線吞噬前面4根K線，同時成交量也大於前面4根K線的最大成交量，「三線反紅」組合確認，後續多頭繼續上漲。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_244_0.png)


    - 空頭下跌到低檔，出現 1 根長紅K線吞噬前面 3 根黑K線，同時成交量也大於前面 3 根K線的最大成交量，「三線反紅」組合確認，後續強力反彈。

    - 多頭回檔 3 天，沒有跌破上漲紅K線的低點，再1 根放量長紅K線突破高點，呈現「上升三法」的組合，後續還有高點。

    - 多頭回檔出現連續小跌黑K線， 1 根大量長紅K線吞噬前面 3 根K線，同時成交量也大於前面 3 根K線的成交量，「三線反紅」組合確認，後續多頭繼續上漲。


    #### 定義


    在下跌或回檔行進中，長黑K線之後出現「母子懷抱」紅K線，再出現突破前面長黑K線最高點的長紅K線，稱為「內困三紅」組合。「母子懷抱」是變盤訊號，「內困三紅」則是變盤反轉確認的訊號，多頭進場做多，空頭可搶短線反彈。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_245_0.png)


    #### 解說


    在下跌低檔出現長黑K線，次日出現1根紅K線，被長黑K線包起成「母子懷抱」表示空方下跌力道被多方開高走高紅K線奪回，當多方再1根上漲長紅K線突破長黑K線的最高點，就完成「內困三紅」組合，為多方強力上漲或反彈的訊號。


    #### 精通


    - 1. 下跌低檔長黑K線如果出現大量或爆量，次日形成「母子懷抱」，後續形成「內困三紅」組合的機率很高。

    - 2. 「內困三紅」的長紅K線突破長黑K線的最高點，同時放大量，後續容易急漲或急彈，要把握機會立刻進場做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_246_0.png)


    - 1. 空頭下跌到低檔，出現1根長黑K，同時爆大量。

    - 2. 次日1根長紅K線開高走高，形成「母子懷抱」的轉折向上組合訊號。

    - 3. 再出現1根長紅K線突破長黑K線的最高點，「內困三紅」組合確認，後續強力反彈成多頭。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_247_0.png)


    - 1. 空頭下跌到低檔盤整打底，出現大量1根長黑K線。

    - 2. 次日1根紅K線開高走高，形成「母子懷抱」的轉折向上組合訊號。

    - 3. 再出現1根跳空大量長紅K線突破長黑K線的最高點，「內困三紅」組合確認，後續強力反彈。


    #### 定義


    上漲行進中出現紅K線、黑K線、紅K線，連續呈階梯式的上漲，稱為「上漲紅黑紅」組合，是繼續上漲的中繼走勢，為多方強勢的訊號，宜找買點進場。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_248_0.png)

    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_248_1.png)


    > 資料來源：富邦e01電子交易系統


    多頭上漲行進中，出現「上漲紅黑紅」組合，多頭繼續上漲。


    #### 精通


    上漲行進出現紅K線、黑K線、紅K線，這3根K線呈現頭頭高、底底高的上漲階梯走勢，多頭仍在繼續掌控上漲中，不要因為中間的1根黑K線而被誤導，認為行情不好。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_249_0.png)


    > 資料來源：富邦e01電子交易系統


    - 多頭上漲行進中，出現「上漲紅黑紅」組合，多頭繼續上漲。


    #### 定義


    3根連續底底高、頭頭高的向上紅K線，沒有上影線，即使有也很短。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_250_0.png)


    #### 解說


    3根連續向上的紅K線，代表多方向上的企圖強，是多方力量的聚集，同時在短時間內改變空方的掌控，多空易位明顯。


    #### 精通


    - 1. 連續紅K線數量越多，代表力量越大，影響時間越長。

    - 2. 連續紅K線呈現跳空上漲，威力更大。

    - 3. 連續紅K線如果出現在低檔的反彈，再下跌，打底的可能性很高。

    - 4. 空頭下跌到低檔，反彈出現「連三紅」組合，是具有上漲潛力的黑馬股，要鎖股。

    - 5. 底部打底的第二支腳出現「連三紅」組合，為強勢多頭的起動訊號。

    - 6. 「連三紅」組合出現在多頭行進間，代表多方氣勢強，後續看漲，還有高點可期。

    - 7. 多頭行進到高點，出現「連三紅」組合，要注意：(1) 連續紅K都出現長的上影線，為大敵當前，高點不多，要留意變盤。

    '
