  md: "\n### 連三黑的訊號\n(1) 低檔連三黑，出現爆量或KD指標背離，要特別注意股價不跌或上漲的反轉變盤訊號；(2) 低檔連三黑，出現爆量或KD指標背離，要特別注意股價不跌或上漲的反轉變盤訊號。\n\
