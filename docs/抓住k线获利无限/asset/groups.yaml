    - ① 上漲到高檔，出現爆大量的長紅 K 線。

    - ② 連續 3 天變盤線。

    - ③ 右邊出現對稱下跌的長黑 K 線，高檔出現 3 星變盤的組合，股價反轉。3 星變盤，最少 3 天是空方主控。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_212_0.png)


    - ① 上漲到高檔，出現爆大量的長紅 K 線。

    - ② 連續 5 天變盤線。

    - ③ 右邊出現對稱下跌的長黑 K 線，高檔出現 5 星變盤的組合，股價反轉。5 星變盤，最少 5 天是空方主控。變盤線越多，下跌力道越強。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_213_0.png)


    資料來源：富邦 eQ 電子交易系統


    - 上漲到高檔，出現連 2 日帶大量的長紅 K 線。

    - 連續 5 天變盤線。

    - 右邊出現對稱下跌的長黑 K 線，高檔出現 5 星變盤的組合，股價反轉。5 星變盤，最少 5 天是空方主控，變盤線越多，下跌力道越強。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_214_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_214_1.png)


    資料來源：富邦 eQ 電子交易系統


    - 上漲到高檔，出現爆大量的長紅 K 線。

    - 連續 20 天變盤線的橫向盤整。

    - 右邊出現對稱下跌爆大量的長黑 K 線，高檔出現 20 星變盤的組合，股價反轉。20 星變盤，最少 20 天是空方主控。變盤線越多，下跌力道越強。


    ### 「夜星」變盤重點盤


    1. 上漲高檔出現的「夜星」組合，中間夾著「1 顆星」（1 根變盤線），轉折的力道比較弱。

    2. 上漲高檔出現的「夜星」組合，同時爆大量，轉折向下的機率大大提高，而且下跌的力道也比較強。

    3. 上漲高檔出現的「夜星」組合，中間夾著的變盤線越多，對稱中長黑 K 線下跌時，空方控盤的時間也越長。例如上漲高檔出現中長紅 K 線，之後出現 5 根橫盤的變盤線，然後再出現
    1 根中長黑 K 線下跌，完成「群星變盤」組合，空方有約 5 天時間主控，至少 5 天時間在中長黑 K 線的高點之下。

    4. 上漲高檔出現中長紅 K 線，之後如隨即出現變盤線，就要觀察位置和成交量，評估出現「夜星」轉折的可能性，運用「費波南係數」，注意變盤線第 1、3、5、8、13、21
    日的 K 線轉折走勢。

    5. 「夜星」轉折的組合，如下跌中長黑 K 線的最高點，被上漲的紅 K 線突破，那麼轉折向下的結構就會被破壞，向下空方的力道轉為由向上多方主控。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_216_0.png)


    資料來源：富邦 eQ 電子交易系統


    1. 上漲出現爆大量的跳空長紅 K 線。

    2. 連續 5 天變盤線的橫向盤整。

    3. 右邊出現對稱下跌的長黑 K 線，空方主控，應會繼續下跌。

    4. 長黑 K 線次日出現帶大量長紅 K 線，收盤突破長黑 K 線的最高點，「群星變盤」組合架構被破壞，轉為多方主控，再 1 根帶大量長紅 K 線往上，行情反轉成多頭。


    ## 低檔 3 根 K 線轉折向上的基本型態


    **定義**


    左邊 1 根下跌的中長黑 K 線，中間 1 根變盤線，右邊 1 根上漲的中長紅 K 線。由 3 根 K 線構成下跌到低點的反轉向上的基本型態，通常中間的變盤線稱為「星」，轉折向上的組合型態稱為「晨星」。


    **解說**


    走勢下跌到低檔的長黑 K 線，次日收盤出現多空對決的變盤線，再出現一根上漲的長紅 K 線，很明顯的，昨天對決之後，多方戰勝，原來向下方空方的主控，現在轉為向上多方的主控。晨星轉折是股價下跌轉折向上的一組
    K 線基本型態。


    **精通**


    1. 空頭下跌在低檔，是一組轉折向上的訊號，股價要反彈。

    2. 多頭回檔出現「晨星」，回檔結束，股價繼續上漲。


