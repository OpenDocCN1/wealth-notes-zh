    - 1. 上漲到高檔，出現並肩左長紅右長黑的2根K線轉折組合，容易回檔。

    - 2. 回檔到低檔，出現左長黑右長紅的2根K線轉折組合，容易止跌，繼續多頭走勢。


    # 第4章 低檔2根K線轉折向上的變化組合


    低檔左中長黑、右中長紅的2根K線轉折向上的基本型態，可以分為下面5組變化，每組代表的意義及轉折的強弱不相同。


    - 基本型態：長黑長紅

    - 長紅遭遇：一日封口

    - 長紅覆蓋：旭日東升

    - 袋子懷抱：光明在望

    - 長紅吞噬：主力吸貨

    - 穿頭貫腳：一路向上


    ## 二日封口：低檔「遭遇」雙K線


    ### 定義


    2根K線構成下跌低點或底部反轉向上組合，這2根K線為中長黑及中長紅的實體，可以有小的上下影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_181_0.png)


    ### 解說


    - 1. 下跌走勢到明顯低檔，出現中長黑K線，第2天出現中長紅K線，當日開低出現買盤上漲，收盤接近中長黑K線的收盤價，是一組下跌遇支撐的止跌K線訊號。

    - 2. 遭遇組合是5個組合中反轉最弱的訊號，只能視為止跌，可能還會續跌，最好再觀察一天確認是否反轉。


    ### 精通


    - 1. 空頭下跌中出現遭遇型態，如果無量，次日向上，是弱勢反彈。如果急跌爆量，次日向上，則是強勢反彈，都是逆勢反彈，搶反彈買進都要小心。

    - 2. 空頭下跌中出現遭遇組合，如果爆大量，轉折機率大增，做空要小心，不可追空。

    - 3. 多頭回檔出現遭遇組合，是回檔結束的訊號，如果次日出量上漲，是多頭續漲的訊號，要把握做多的機會買進。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_182_0.png)


    - ① 空頭下跌中出現遭遇紅K，為一日開低走高封口，量縮的止跌，但是不可搶進做多。

    - ② 次日不過前高，無法反彈，後面繼續下跌。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_183_0.png)


    - ① 空頭急跌出現遭遇組合，為一日開低走高封口的止跌，要看次日。

    - ② 出現帶大量上漲紅K線，並且突破遭遇黑K線的最高點，容易反彈到前波下跌的起跌點A。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_184_0.png)


    ## 旭日東升：低檔「覆蓋」雙K線


    ### 定義


    2根K線構成下跌低點或底部反轉向上組合，這2根K線為中長黑及中長紅的實體，可有小的上下影線。在下跌的低檔，出現下跌中長黑K線，次日開低盤，盤中破新低價，可是收盤突破平盤，紅K實體進入黑K線的實體內，但沒突破黑K實體的最高點。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_184_1.png)


    ### 解說


    下跌走勢到明顯低檔，出現中長黑K線，第2天出現中長紅K線（旭日東升），當天開低盤破新低價，但買盤進入，收盤突破前一日長黑K線的收盤價收，可確認當天是多方力道強，已經出現空方無法控制下跌，同時有進貨的現象，是一組下跌遇支撐的上漲K線訊號，要注意是否會轉折向上。


    ### 精通


    - 1. 覆蓋（旭日東升）的紅K線越長，轉折的力道越強。

    - 2. 紅K線收盤如果漲進黑K線實體，但是沒有達到黑K線的1/2，反轉訊號力道較弱，最好再觀察一天確認是否反轉。

    - 3. 紅K線收盤如果突破黑K線的1/2以上，可視為反轉的訊號。

    - 4. 紅K線收盤越向上深入黑K線實體，反轉向上的可能性越高。如果突破黑K線實體的高點，就形成長紅吞噬。

    - 5. 出現覆蓋的2根K線時，這2根K線的最高點H和最低點L是重要的壓力或支撐觀察點。收盤突破最高點H，會出現一波上漲；如跌破最低點L，容易出現一波下跌。

    - 6. 出現覆蓋後，走勢出現在H與L之間的橫向盤整，通常多為打底的訊號，盤整再次出現轉折向上訊號，底部形成機率大增。

    - 7. 覆蓋的2根K線如有爆大量情形，更容易反轉向上。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_185_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_186_0.png)


    資料來源：富邦e01電子交易系統


    - ① 下跌到低檔，量縮紅K覆蓋，弱勢反彈。

    - ② 多頭回檔，出現量增紅K覆蓋，多頭轉折向上訊號，次日上漲是買點。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_187_0.png)


    - ⑬ 下跌到低檔，放量紅K覆蓋，次日過高反彈。

    - ⑭ 下跌不破前低71.9，出現量增紅K上漲，突破前面高點，打底完成，是買點。


    ## 母子懷抱：低檔「懷抱」雙K線


    ### 定義


    由2根K線構成，下跌低檔出現中長黑，次日出現不過高也不破低的紅K線，中長黑K線稱為母線，次日紅K線稱為子線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_188_0.png)


    ### 解說


    下跌到明顯低檔，出現母子懷抱的K線組合，代表下跌走勢突然變得不確定，以兩天的情況來看，多空雙方的力量突然呈現拉鋸，空頭下跌力道減弱，方向可能要轉折向上，是一組下跌的止跌K線訊號，要注意次日是否會轉折向上。


    ### 精通


    - 1. 母子懷抱是以K線實體來觀察，與子線長短、有否上下影線或紅黑都沒關係。

    - 2. 出現母子懷抱，多空開始不安定，容易上下震盪幾天，母線黑K線的最高點是重要觀察位置，突破將反轉確認。

    - 3. 母子懷抱的成交量要注意觀察，母量大於子量，出現價漲量縮的背離，次日要放量上漲化解背離，否則不易反轉成功，次日容易下跌。

    - 4. 母子懷抱的成交量，子量大於母量，則是價漲量增，次日容易上漲反轉。

    - 5. 出現母子懷抱，長黑K線的最高點與最低點是重要觀察點，向上突破最高點，多空易位，多方反轉掌控主動權。反之，向下跌破最低點，空方繼續主導下跌。

    - 6. 出現母子懷抱，次日開盤位置很重要：開高容易向上反轉，開低容易下跌。

    - 7. 母子懷抱第2日仍然沒有突破或跌破，要注意可能形成下降三法型態（見第4篇）。

    - 8. 母子懷抱的子線如果是十字線，反轉力道大於一般的母子懷抱，是強力反轉的訊號，出現這雙K線組合，投資人要特別警覺，不可輕忽，因為會很容易形成低檔晨星轉折的3根K線組合。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_189_0.png)

