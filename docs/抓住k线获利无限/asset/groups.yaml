    # 解說


    在下跌低檔出現長黑K線，次日出現1根紅K線，被長黑K線包起成「母子懷抱」表示空方下跌力道被多方開高走高紅K線奪回，當多方再1根上漲長紅K線突破長黑K線的最高點，就完成「內困三紅」組合，為多方強力上漲或反彈的訊號。


    # 精通


    +   1. 下跌低檔長黑K線如果出現大量或爆量，次日形成「母子懷抱」，後續形成「內困三紅」組合的機率很高。

