    # 第 1 章


    # 高檔3根K線轉折向下的基本型態


    # 定義


    左邊1根上漲的中長紅K線，中間1根變盤線，右邊1根下跌的中長黑K線，由3根K線構成上漲到高點的反轉向下基本型態。通常中間的變盤線稱為「星」，轉折向下的組合型態稱為「夜星」。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_202_0.png)


    # 解說


    走勢上漲到高檔的長紅K線，次日收盤出現多空對決的變盤線，再出現一根下跌的長黑K線，很明顯的，昨天對決之後，空方戰勝，原來向上的多方主控，現在轉為向下的空方主控。夜星轉折是股價上漲轉折向下的K線基本型態。


    # 精通


