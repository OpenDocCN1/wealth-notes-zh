    2. 出現「雙鴉變盤」組合，向下反轉訊號強烈，如果高檔同時出現大量或爆大量，反轉更明顯，多單要出場。在空頭反彈時出現「雙鴉變盤」組合，將繼續下跌，要把握做空。


