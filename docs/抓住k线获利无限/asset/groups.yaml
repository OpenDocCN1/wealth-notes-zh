    # 第 2 篇

    ## 長紅和長黑K線：走勢的關鍵


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_51_0.png)


    1. 空頭跌到低點，出現放量長紅K線的一日向上反轉。

    2. 多頭回檔後放量長紅K線的再上漲，收盤突破前一日的最高點，把握進場買進。

    3. 多頭行進中的長紅K線，繼續上漲，出現惜售的量縮。


    # 位置5：多頭上漲一段後的盤整末端


    當盤整末端出現帶大量的長紅K線，是多頭上漲的攻擊訊號，當然要把握機會買進做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_52_0.png)


    資料來源：富邦e01電子交易系統


    - ① 出現放量長紅K線的突破，完成底部確認，把握進場買進。

    - ② 上漲行進中放量的長紅K線，繼續再上漲。

    - ③ 多頭行進中的盤整結束，出現放量長紅K線，是繼續上漲的攻擊訊號，把握進場買進。


    # 位置6：多頭上漲到高檔或連續急漲


    此時要特別注意成交量與股價的變化。出現成交量爆增，股價不漲或下跌，通常是主力在高檔利用散戶追高時趁機大量出貨，造成當日長紅大量，次日股價無法再上漲的原因。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_53_0.png)


    資料來源：富邦e01電子交易系統


    - 多頭行進中的盤整結束，出現放量長紅K線，是繼續上漲的攻擊訊號，把握進場買進。

    - 高檔出現連續跳空急漲，同時爆出大量的長紅K線，要特別小心，次日出現股價不漲或下跌，都是危險訊號。之前連續出大量的跳空上漲紅K線，是主力邊拉邊出貨，後面即使有反彈，股價仍然無法突破大量長紅K線的最高點。


    在空頭下跌趨勢中，長紅K線會出現在以下4個位置。


    # 位置1：在高檔盤頭時


    要注意多頭最高點頭部如果沒有突破，容易形成做頭，此時的長紅K線反而是逃命波，同時要密切注意該大量的長紅K線最低點不能被跌破，如果被收盤價跌破，頭部即將完成。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_54_0.png)


    資料來源：富邦e01電子交易系統


    1. 多頭的最高點。

    2. 高檔盤整，連續出現帶大量的長紅K線，要特別注意，多頭的最高點沒有突破，這些長紅K線是逃命波。

    3. 長黑K線跌破帶大量的長紅K線最低點，頭部即將完成。


    # 第 2 篇

    ## 長紅和長黑K線：走勢的關鍵


    # 位置2：空頭下跌行進中出現反彈時


    代表主力誘多，通常會出現量增的現象，要注意不可搶反彈，容易被套牢。如果無量反彈，通常是弱勢反彈。此時應該把握反彈不過前高後再下跌的做空機會。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_55_0.png)


    - ① 出現在空頭下跌行進中的反彈長紅K，是主力在誘多，不能買進。

    - ② 量縮的反彈，很快就下跌，繼續做空。


    # 位置3：在空頭下跌一段的盤整末端


    如果出現攻擊量，可視為轉折向上，可以把握機會買進做多。

    但是要看整個盤整的型態是反彈或回升，決定做長還是做短。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_56_0.png)


    資料來源：富邦eO1電子交易系統


    1. 空頭下跌中的無量長紅K反彈，是準備做空的機會。

    2. 空頭下跌中的盤整長紅K突破，後續無量，只是反彈，容易拉回。


    # 第 2 章

    ## 第1套 長紅和長黑K線：走勢的關鍵


    # 位置4：空頭跌到低點或急跌一段後出現大量長紅K線


    可視為止跌的訊號，後面出現收盤價突破這根大量長紅K線最高點的K線，則容易止跌回升。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_57_0.png)


    資料來源：富邦e01電子交易系統


    空頭急跌一段後，出現放量長紅K線的止跌訊號，次日向上突破放量長紅K線的最高點，一日向上反轉向上，止跌回升。


    # 觀察點區出現大量長紅K線


    在盤整區也會出現帶大量的長紅K線，原則上，在盤整區我們不操作股票，盤整後，突破或跌破時再做多或做空。盤整後往上突破，在盤整區的帶大量長紅K線，視為進貨量。盤整後往下跌破，在盤整區的帶大量長紅K線，視為出貨量。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_58_0.png)


    資料來源：富邦e01電子交易系統


    1. 盤整區，在盤整區中陸續出現放量長紅K線。

    2. 跌破盤整區，在盤整區放量長紅K線為主力誘多的出貨量。


    # 第2篇

    ## 長紅和長黑K線：走勢的關鍵


    ### 長黑K線的支撐和壓力


    多頭上漲的長紅K線，在攻擊的關鍵位置，通常伴隨大量，當股價往上發展，這些量視為進貨量、攻擊量或換手量。換句話說，在多頭走勢是重要的價量配合的攻勢，如果出現股價該攻不攻，甚至下跌，都是重大警訊，一定要設好停損，做好風險控制。


    出現帶大量的長紅K線，股價上漲之後的回測，該長紅K線是重要的支撐，支撐分為3個重要觀察價位，分別是長紅K線的最高點、長紅K線的½價位（最高價+最低價，然後除以2），以及長紅K線的最低點。


    1. 跌破長紅K線的最高點：

    代表向上攻擊減弱，必須在3~5日之內站回長紅K線的最高點之上，否則要注意是否轉折向下。


    2. 跌破長紅K線的2分之1價位：

    代表跌破長紅K線當天交易的平均成本，容易產生大量的賣壓，長紅K線的多方氣勢已經破壞。


    3. 跌破長紅K線的最低點：

    代表多空盈位，轉為空方主導，同時該長紅K線反而變成日後股價上漲的壓力。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_60_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_60_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_60_2.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_61_0.png)


    資料來源：富邦e01電子交易系統


    1. 多頭行進中，出現放量長紅K線，突破前面最高點，是繼續上漲的攻擊訊號，應該繼續上漲。

    2. 次日出現股價該攻不攻，而且爆出大量的十字K線，要特別小心，這是危險警訊。

    3. 股價向下跌破長紅K線1/2平均成本價，多頭攻勢反轉。

    4. 股價向下跌破長紅K線最低點，多空易位，由多轉空。高檔主力出貨明顯。股價急速下殺。


    # 定義


    開盤與收盤上下幅度達4.5%以上，開高走低的實體黑K線，而且是沒有上下影線的實體K棒，即使有，也只能有很小的影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_62_0.png)


    # 解說


    在行情走勢圖中不論多頭上漲、空頭下跌或盤整，都可以看到長黑K線。就單一K線而言，當天開盤是最高價，然後實壓積極，最後下跌到最低價收盤，所以當天是空方強。


    # 精通


    1. 當天實壓雖積極，仍要分辨是主力大戶賣出，還是散戶的追殺，不同交易人的賣出，造成的結果就不同。換句話說，出現長黑K線，並不表示日後一定會繼續下跌。

    2. 長黑K線出現在不同趨勢、不同位置，代表的意義就不同，甚至完全相反，股友不可不察。要精準的判讀長黑K線，必須先區分不同趨勢中的不同位置。


    在多頭上漲趨勢中，長黑K線會出現在以下5個位置。


    # 位置1：空頭低檔打底盤整期間


    代表底部尚未確認，可能是主力再次洗盤的現象，同時仍然沒有止跌的訊號，表示空頭趨勢仍然沒有結束，所以不可以認為股價跌深而去做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_63_0.png)


    出現在空頭低檔打底盤整中的長黑K，是主力在洗盤。


    # 位置2：多頭向上行進中


    通常都是漲多的急速回檔，如果多頭趨勢未變，長黑K繼續下跌的力道會減弱，配合量縮，是多頭回檔的正常走勢。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_64_0.png)


    資料來源：富邦e01電子交易系統


    - ① 出現在多頭上漲的長黑K，是漲多的回檔。

    - ② 在高檔出現爆量的長黑K，是止漲的訊號，次日股價出現下殺，要立刻出場。

    - ③ 多頭回檔的長黑K，雖然量縮，但是沒有止跌的訊號，不可隨便認為股價跌的很多，就去買進。


    # 第 2 章

    ## 長紅和長黑K線：走勢的關鍵


    # 位置3：多頭回檔中


    表示回檔尚未結束，還會繼續下跌，無論有量或無量，都不能認為大跌價低而做多買進。必須等到止跌，沒有跌破前面的最低點，股價再上漲收盤過前一日最高點時才考慮進場做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_65_0.png)


    資料來源：富邦e01電子交易系統


    - 多頭回檔的大量長黑K，後面還可能下跌。

    - 多頭回檔的長黑K，雖然量縮，但是沒有止跌的訊號，不可隨便認為股價跌的很多，就去買進。


    # 位置 4：多頭上漲到高點


    這是止漲的訊號，如果出現大量或者爆天量，主力出貨的可能性很大，要密切注意次日股價的走勢，出現下殺，要立刻出場。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_66_0.png)


    資料來源：富邦 e01 電子交易系統


    - ① 出現在多頭上漲中的長黑K，呈現量縮，是漲多的回檔。

    - ② 在高檔爆量的長黑K，是止漲的訊號，次日股價出現下殺，同時波浪型態呈現頭頭低的走勢，要立刻出場。


    位置5：多頭行進中的盤整區


    這是整理區間的洗盤或出貨，要看盤整完後是繼續向上突破，或是向下跌破來決定，所以在盤整區不要操作，靜待突破或跌破再依方向確認。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_67_0.png)


    資料來源：富邦e01電子交易系統


    ① 出現在盤整區的長黑K，雖然呈現量縮，但不是買點，觀察即可。

    ② 帶大量的長紅K，確認突破盤整區，是多單進場買點，股價開始上漲。


    # 空頭下跌趨勢中長黑K線出線


    在空頭下跌趨勢中，長黑K線會出現在以下6個位置。


    # 位置1：高檔出現頭頭低 第二個頭出現下跌時


    一般來說，空頭都會成立，有量的下跌威力比較大，無量也一樣會下跌。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_68_0.png)


    ① 頭部第二個頭出現頭頭低的長黑K線下跌，空頭都會成立。

    ② 有量或無量的長黑K下跌，都會繼續下跌，不可隨便接股票。


    # 位置2：空頭初跌段


    通常都會出量，這是代表散戶恐慌性地賣出，行情還會繼續下跌。


    # 位置3：空頭下跌行進中


    股價繼續下跌，沒有止跌的訊號出現，無論是否有量，都不能低接。


    # 位置4：空頭反彈結束時


    反彈結束，股價繼續下跌，可以順勢做空。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_69_0.png)


    空頭下跌中的長黑K線下跌，行情繼續下跌。

    空頭反彈出現長黑K下跌，反彈結束，順勢繼續做空。


    # 位置5：出現連續急跌時


    同時出現爆量或窒息量，股價容易反彈，當有上漲的紅K，收盤突破前一日的最高點，可以做短線的搶反彈。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_70_0.png)


    資料來源：富邦eO1 電子交易系統


    ⑳ 空頭連續急跌長黑K，同時出現窒息量。

    ㉑ 放量紅K，出現止跌訊號。

    ㉒ 放量紅K收盤突破前一日最高點才確認反彈，可以做短線的搶反彈。


    # 第1節 長紅和長黑K線：走勢的關鍵


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_71_0.png)


    資料來源：富邦e01電子交易系統


    ⑩ 空頭連續急跌長黑K，同時出現爆大量。

    ⑪ 出現放量長紅K，是止跌訊號，同時收盤突破前一日最高點，確認反彈，可以做短線的搶反彈。


    # 位置6：空頭下跌中的盤整跌破


    跌破盤整，股價將繼續下跌一段，是做空的機會。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_72_0.png)


    資料來源：富邦eO1電子交易系統


    - ⑥ 空頭下跌趨勢的盤整，出現大量長黑K線的跌破，是做空的機會，還會繼續下跌一段。

    - ⑦ 空頭下跌行進中出現大量長黑K線，不可隨便接股票。

    - ⑧ 空頭下跌反彈出現長黑K線，反彈結束，可以準備做空。


    # 大量長黑K線的支撐與壓力


    出現大量長黑K線，股價下跌之後，該長黑K線是重要的壓力，壓力分為3個重要觀察價位，分別是長黑K線的最低點、長黑K線的(1/2)價位（最高價+最低價，然後除以2），以及長黑K線的最高點。


    1. 長黑K線的最低點被突破：

    代表向下力道減弱，必須在3~5日之內再跌到長黑K線的最低點之下，否則要注意是否轉折向上反彈。


    2. 長黑K線的(1/2)價位被突破：

    代表長黑K線當天空方交易的平均成本被突破，容易產生大量的回補買單，這時長黑K線的空方氣勢已經出現向上的變化。


    3. 長黑K線的最高點被突破

    代表多空易位，轉為多方主導的態勢，同時該長黑K線反而變成日後股價上漲的重要支撐觀察點。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_73_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_74_0.png)


    最高價：股價在上方，是最強支撐點。

    ½價：股價在上方，是平均成本支撐點。

    最低價：股價在上方，是最弱支撐點。

    跌破最低價：多空易位。

    大量長黑K線


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_74_1.png)


    突破最高價、多空易位。

    最高價：股價在下方，是最弱壓力點。

    ½價：股價在下方，是平均成本壓力點。

    最低價：股價在下方，是最強壓力點。

    大量長黑K線


    # 第2章 長紅和長黑K線：走勢的關鍵


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_75_0.png)


    資料來源：富邦eO1電子交易系統


    ① 下跌低檔出現大量長黑K線。

    ② 後2日股價站上大量長黑K的最低點。

    ③ 後3日股價站上大量長黑K的 1/2。

    ④ 股價站上大量長黑K的最高點，反轉成多頭走勢。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_76_0.png)


    資料來源：富邦eO1電子交易系統


    - ① 出現大量長黑K線的位置

    - ② 大量長黑K線的最高點被突破，多空易位，反彈或反轉向上。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_77_0.png)


    研讀完本章內容後，請試著回答以下問題：


    1 何時出現大量長紅K，表示可以買進？

    2 何時出現大量長紅K，表示不能買進？

    （答案見次頁）


    # 小測驗解答


    1. 何時出現大量長紅K，表示可以買進？


    - (1) 空頭急跌、爆量之後的收盤過昨日最高點的大量長紅K。

    - (2) 空頭轉多頭打底期間的底底高的大量長紅K。

    - (3) 空頭轉多頭第一次過前高，多頭確認的大量長紅K。

    - (4) 多頭回檔沒有跌破前面最低點，止跌回升的大量長紅K。

    - (5) 走勢當中盤整完成向上突破的大量長紅K。


    2. 何時出現大量長紅K，表示不能買進？


    - (1) 日線高檔的大量長紅K。

    - (2) 連續三根長紅K的位置。

    - (3) 接近前高壓力位置的大量長紅K。

    - (4) 盤整區中的大量長紅K。

    - (5) 空頭反彈的大量長紅K。

    - (6) 多頭出大量後回檔，跌破前低之後的反彈長紅K。


    行情走勢中，關鍵位置的突破或跌破、多頭的做多位置、空頭做空的位置，大多會出現長紅K線或長黑K線，我們稱為關鍵K棒，讀者要特別關注，別錯失重要的進出場機會。

    了解長紅、長黑單一K棒在不同位置的意義，看圖時即能一目了然。


    # 第2篇 中紅和中黑、小紅和小黑K線


    ### 認識中紅K線


    #### 定義


    開盤與收盤上下幅度達2.5～4.5%、開低走高的實體紅K線，而且是不含上下影線的實體K棒，即使有，也只能有很小的影線。


    #### 解說


    中紅K線，當天開盤是最低價，然後買盤拉抬，最後上漲約2.5～4.5%，到當天最高價收盤，所以當天是多方中強。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_79_0.png)


    #### 精通


    1. 中紅當天的實體要比長紅略短，觀察的重點與長紅K線相同，出現在不同趨勢、不同位置，代表的意義也不同，詳見第2篇第1章。

    2. 中紅K線可以合併觀察，例如連續2天或3天的中紅上漲，出現大量，可視為長紅K線爆大量；如果出現在底部或多頭關鍵上攻的位置，當然很好，但是出現在高檔，日後股價不漲或下跌，可就大大不好了。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_80_0.png)


    資料來源：富邦eO1電子交易系統


    ⓶ 空頭低檔連續出現反彈的帶大量中紅K線，合併看就是一根低檔大量長紅K線的吞噬，是轉折向上的訊號。


    # 中紅和中黑、小紅和小黑K線


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_81_0.png)


    #### 定義


    開盤與收盤上下幅度達2.5～4.5%以內，開高走低的實體黑K線，而且是沒有上下影線的實體K棒，即使有，也只能有很小的影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_81_1.png)


    #### 解說


    中黑K線，當天開盤是最高價，然後賣盤出籠，最後下跌約2.5～4.5%，到當天最低價收盤，所以當天是空方中強。


    #### 精通


    1. 中黑當天的實體要比長黑略短，觀察的重點與長黑K線相同，出現在不同趨勢、不同位置，代表的意義也不同，詳見第2篇第1章。

    2. 中黑K線可以合併觀察，例如連續2天或3天的中黑下跌，出現大量，可以視為長黑K線爆大量下跌；如果出現在頭部或空頭關鍵下跌位置，自然可以做空，但是出現在低檔，日後股價不跌或上漲，就要注意是否要打底。

    '
  mdcn: '


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_50_0.png)


    資料來源：富邦e01 電子交易系統


    底部打底完成的向上長紅K線，配合攻擊量，可以視為主力宣示多頭開始。


    意3：多頭上漲行進中的長紅K線。

    代表多方氣勢續強，仍然繼續上漲。通常出現惜售的量縮。


    意4：上漲一段後回檔修正結束

    當修正完成，修正的低點沒有跌破前面低點，當再出現上漲長紅K，表示修正結束，多頭要繼續上漲，自然要把握機會買進做多。配合大量攻擊力道強，如果量不大，後面一、二日要補量上攻。


    # 第 2 篇

    ## 長紅和長黑K線：走勢的關鍵


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_51_0.png)


    1. 空頭跌到低點，出現放量長紅K線的一日向上反轉。

    2. 多頭回檔後放量長紅K線的再上漲，收盤突破前一日的最高點，把握進場買進。

    3. 多頭行進中的長紅K線，繼續上漲，出現惜售的量縮。


    # 位置5：多頭上漲一段後的盤整末端


    當盤整末端出現帶大量的長紅K線，是多頭上漲的攻擊訊號，當然要把握機會買進做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_52_0.png)


    資料來源：富邦e01電子交易系統


    - ① 出現放量長紅K線的突破，完成底部確認，把握進場買進。

    - ② 上漲行進中放量的長紅K線，繼續再上漲。

    - ③ 多頭行進中的盤整結束，出現放量長紅K線，是繼續上漲的攻擊訊號，把握進場買進。


    # 位置6：多頭上漲到高檔或連續急漲


    此時要特別注意成交量與股價的變化。出現成交量爆增，股價不漲或下跌，通常是主力在高檔利用散戶追高時趁機大量出貨，造成當日長紅大量，次日股價無法再上漲的原因。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_53_0.png)


    資料來源：富邦e01電子交易系統


    - 多頭行進中的盤整結束，出現放量長紅K線，是繼續上漲的攻擊訊號，把握進場買進。

    - 高檔出現連續跳空急漲，同時爆出大量的長紅K線，要特別小心，次日出現股價不漲或下跌，都是危險訊號。之前連續出大量的跳空上漲紅K線，是主力邊拉邊出貨，後面即使有反彈，股價仍然無法突破大量長紅K線的最高點。


    在空頭下跌趨勢中，長紅K線會出現在以下4個位置。


    # 位置1：在高檔盤頭時


    要注意多頭最高點頭部如果沒有突破，容易形成做頭，此時的長紅K線反而是逃命波，同時要密切注意該大量的長紅K線最低點不能被跌破，如果被收盤價跌破，頭部即將完成。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_54_0.png)


    資料來源：富邦e01電子交易系統


    1. 多頭的最高點。

    2. 高檔盤整，連續出現帶大量的長紅K線，要特別注意，多頭的最高點沒有突破，這些長紅K線是逃命波。

    3. 長黑K線跌破帶大量的長紅K線最低點，頭部即將完成。


    # 第 2 篇

    ## 長紅和長黑K線：走勢的關鍵


    # 位置2：空頭下跌行進中出現反彈時


    代表主力誘多，通常會出現量增的現象，要注意不可搶反彈，容易被套牢。如果無量反彈，通常是弱勢反彈。此時應該把握反彈不過前高後再下跌的做空機會。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_55_0.png)


    - ① 出現在空頭下跌行進中的反彈長紅K，是主力在誘多，不能買進。

    - ② 量縮的反彈，很快就下跌，繼續做空。


    # 位置3：在空頭下跌一段的盤整末端


    如果出現攻擊量，可視為轉折向上，可以把握機會買進做多。

    但是要看整個盤整的型態是反彈或回升，決定做長還是做短。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_56_0.png)


    資料來源：富邦eO1電子交易系統


    1. 空頭下跌中的無量長紅K反彈，是準備做空的機會。

    2. 空頭下跌中的盤整長紅K突破，後續無量，只是反彈，容易拉回。


    # 第 2 章

    ## 第1套 長紅和長黑K線：走勢的關鍵


    # 位置4：空頭跌到低點或急跌一段後出現大量長紅K線


    可視為止跌的訊號，後面出現收盤價突破這根大量長紅K線最高點的K線，則容易止跌回升。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_57_0.png)


    資料來源：富邦e01電子交易系統


    空頭急跌一段後，出現放量長紅K線的止跌訊號，次日向上突破放量長紅K線的最高點，一日向上反轉向上，止跌回升。


    # 觀察點區出現大量長紅K線


    在盤整區也會出現帶大量的長紅K線，原則上，在盤整區我們不操作股票，盤整後，突破或跌破時再做多或做空。盤整後往上突破，在盤整區的帶大量長紅K線，視為進貨量。盤整後往下跌破，在盤整區的帶大量長紅K線，視為出貨量。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_58_0.png)


    資料來源：富邦e01電子交易系統


    1. 盤整區，在盤整區中陸續出現放量長紅K線。

    2. 跌破盤整區，在盤整區放量長紅K線為主力誘多的出貨量。


    # 第2篇

    ## 長紅和長黑K線：走勢的關鍵


    ### 長黑K線的支撐和壓力


    多頭上漲的長紅K線，在攻擊的關鍵位置，通常伴隨大量，當股價往上發展，這些量視為進貨量、攻擊量或換手量。換句話說，在多頭走勢是重要的價量配合的攻勢，如果出現股價該攻不攻，甚至下跌，都是重大警訊，一定要設好停損，做好風險控制。


    出現帶大量的長紅K線，股價上漲之後的回測，該長紅K線是重要的支撐，支撐分為3個重要觀察價位，分別是長紅K線的最高點、長紅K線的½價位（最高價+最低價，然後除以2），以及長紅K線的最低點。


    1. 跌破長紅K線的最高點：

    代表向上攻擊減弱，必須在3~5日之內站回長紅K線的最高點之上，否則要注意是否轉折向下。


    2. 跌破長紅K線的2分之1價位：

    代表跌破長紅K線當天交易的平均成本，容易產生大量的賣壓，長紅K線的多方氣勢已經破壞。


    3. 跌破長紅K線的最低點：

    代表多空盈位，轉為空方主導，同時該長紅K線反而變成日後股價上漲的壓力。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_60_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_60_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_60_2.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_61_0.png)


    資料來源：富邦e01電子交易系統


    1. 多頭行進中，出現放量長紅K線，突破前面最高點，是繼續上漲的攻擊訊號，應該繼續上漲。

    2. 次日出現股價該攻不攻，而且爆出大量的十字K線，要特別小心，這是危險警訊。

    3. 股價向下跌破長紅K線1/2平均成本價，多頭攻勢反轉。

    4. 股價向下跌破長紅K線最低點，多空易位，由多轉空。高檔主力出貨明顯。股價急速下殺。


    # 定義


    開盤與收盤上下幅度達4.5%以上，開高走低的實體黑K線，而且是沒有上下影線的實體K棒，即使有，也只能有很小的影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_62_0.png)


    # 解說


    在行情走勢圖中不論多頭上漲、空頭下跌或盤整，都可以看到長黑K線。就單一K線而言，當天開盤是最高價，然後實壓積極，最後下跌到最低價收盤，所以當天是空方強。


    # 精通


    1. 當天實壓雖積極，仍要分辨是主力大戶賣出，還是散戶的追殺，不同交易人的賣出，造成的結果就不同。換句話說，出現長黑K線，並不表示日後一定會繼續下跌。

    2. 長黑K線出現在不同趨勢、不同位置，代表的意義就不同，甚至完全相反，股友不可不察。要精準的判讀長黑K線，必須先區分不同趨勢中的不同位置。


    在多頭上漲趨勢中，長黑K線會出現在以下5個位置。


    # 位置1：空頭低檔打底盤整期間


    代表底部尚未確認，可能是主力再次洗盤的現象，同時仍然沒有止跌的訊號，表示空頭趨勢仍然沒有結束，所以不可以認為股價跌深而去做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_63_0.png)


    出現在空頭低檔打底盤整中的長黑K，是主力在洗盤。


    # 位置2：多頭向上行進中


    通常都是漲多的急速回檔，如果多頭趨勢未變，長黑K繼續下跌的力道會減弱，配合量縮，是多頭回檔的正常走勢。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_64_0.png)


    資料來源：富邦e01電子交易系統


    - ① 出現在多頭上漲的長黑K，是漲多的回檔。

    - ② 在高檔出現爆量的長黑K，是止漲的訊號，次日股價出現下殺，要立刻出場。

    - ③ 多頭回檔的長黑K，雖然量縮，但是沒有止跌的訊號，不可隨便認為股價跌的很多，就去買進。


    # 第 2 章

    ## 長紅和長黑K線：走勢的關鍵


    # 位置3：多頭回檔中


    表示回檔尚未結束，還會繼續下跌，無論有量或無量，都不能認為大跌價低而做多買進。必須等到止跌，沒有跌破前面的最低點，股價再上漲收盤過前一日最高點時才考慮進場做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_65_0.png)


    資料來源：富邦e01電子交易系統


    - 多頭回檔的大量長黑K，後面還可能下跌。

    - 多頭回檔的長黑K，雖然量縮，但是沒有止跌的訊號，不可隨便認為股價跌的很多，就去買進。


    # 位置 4：多頭上漲到高點


    這是止漲的訊號，如果出現大量或者爆天量，主力出貨的可能性很大，要密切注意次日股價的走勢，出現下殺，要立刻出場。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_66_0.png)


    資料來源：富邦 e01 電子交易系統


    - ① 出現在多頭上漲中的長黑K，呈現量縮，是漲多的回檔。

    - ② 在高檔爆量的長黑K，是止漲的訊號，次日股價出現下殺，同時波浪型態呈現頭頭低的走勢，要立刻出場。


    位置5：多頭行進中的盤整區


    這是整理區間的洗盤或出貨，要看盤整完後是繼續向上突破，或是向下跌破來決定，所以在盤整區不要操作，靜待突破或跌破再依方向確認。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_67_0.png)


    資料來源：富邦e01電子交易系統


    ① 出現在盤整區的長黑K，雖然呈現量縮，但不是買點，觀察即可。

    ② 帶大量的長紅K，確認突破盤整區，是多單進場買點，股價開始上漲。


    # 空頭下跌趨勢中長黑K線出線


    在空頭下跌趨勢中，長黑K線會出現在以下6個位置。


    # 位置1：高檔出現頭頭低 第二個頭出現下跌時


    一般來說，空頭都會成立，有量的下跌威力比較大，無量也一樣會下跌。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_68_0.png)


    ① 頭部第二個頭出現頭頭低的長黑K線下跌，空頭都會成立。

    ② 有量或無量的長黑K下跌，都會繼續下跌，不可隨便接股票。


    # 位置2：空頭初跌段


    通常都會出量，這是代表散戶恐慌性地賣出，行情還會繼續下跌。


    # 位置3：空頭下跌行進中


    股價繼續下跌，沒有止跌的訊號出現，無論是否有量，都不能低接。


    # 位置4：空頭反彈結束時


    反彈結束，股價繼續下跌，可以順勢做空。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_69_0.png)


    空頭下跌中的長黑K線下跌，行情繼續下跌。

    空頭反彈出現長黑K下跌，反彈結束，順勢繼續做空。


    # 位置5：出現連續急跌時


    同時出現爆量或窒息量，股價容易反彈，當有上漲的紅K，收盤突破前一日的最高點，可以做短線的搶反彈。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_70_0.png)


    資料來源：富邦eO1 電子交易系統


    ⑳ 空頭連續急跌長黑K，同時出現窒息量。

    ㉑ 放量紅K，出現止跌訊號。

    ㉒ 放量紅K收盤突破前一日最高點才確認反彈，可以做短線的搶反彈。


    # 第1節 長紅和長黑K線：走勢的關鍵


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_71_0.png)


    資料來源：富邦e01電子交易系統


    ⑩ 空頭連續急跌長黑K，同時出現爆大量。

    ⑪ 出現放量長紅K，是止跌訊號，同時收盤突破前一日最高點，確認反彈，可以做短線的搶反彈。


    # 位置6：空頭下跌中的盤整跌破


    跌破盤整，股價將繼續下跌一段，是做空的機會。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_72_0.png)


    資料來源：富邦eO1電子交易系統


    - ⑥ 空頭下跌趨勢的盤整，出現大量長黑K線的跌破，是做空的機會，還會繼續下跌一段。

    - ⑦ 空頭下跌行進中出現大量長黑K線，不可隨便接股票。

    - ⑧ 空頭下跌反彈出現長黑K線，反彈結束，可以準備做空。


    # 大量長黑K線的支撐與壓力


    出現大量長黑K線，股價下跌之後，該長黑K線是重要的壓力，壓力分為3個重要觀察價位，分別是長黑K線的最低點、長黑K線的(1/2)價位（最高價+最低價，然後除以2），以及長黑K線的最高點。


    1. 長黑K線的最低點被突破：

    代表向下力道減弱，必須在3~5日之內再跌到長黑K線的最低點之下，否則要注意是否轉折向上反彈。


    2. 長黑K線的(1/2)價位被突破：

    代表長黑K線當天空方交易的平均成本被突破，容易產生大量的回補買單，這時長黑K線的空方氣勢已經出現向上的變化。


    3. 長黑K線的最高點被突破

    代表多空易位，轉為多方主導的態勢，同時該長黑K線反而變成日後股價上漲的重要支撐觀察點。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_73_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_74_0.png)


    最高價：股價在上方，是最強支撐點。

    ½價：股價在上方，是平均成本支撐點。

    最低價：股價在上方，是最弱支撐點。

    跌破最低價：多空易位。

    大量長黑K線


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_74_1.png)


    突破最高價、多空易位。

    最高價：股價在下方，是最弱壓力點。

    ½價：股價在下方，是平均成本壓力點。

    最低價：股價在下方，是最強壓力點。

    大量長黑K線


    # 第2章 長紅和長黑K線：走勢的關鍵


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_75_0.png)


    資料來源：富邦eO1電子交易系統


    ① 下跌低檔出現大量長黑K線。

    ② 後2日股價站上大量長黑K的最低點。

    ③ 後3日股價站上大量長黑K的 1/2。

    ④ 股價站上大量長黑K的最高點，反轉成多頭走勢。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_76_0.png)


    資料來源：富邦eO1電子交易系統


    - ① 出現大量長黑K線的位置

    - ② 大量長黑K線的最高點被突破，多空易位，反彈或反轉向上。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_77_0.png)


    研讀完本章內容後，請試著回答以下問題：


    1 何時出現大量長紅K，表示可以買進？

    2 何時出現大量長紅K，表示不能買進？

    （答案見次頁）


    # 小測驗解答


    1. 何時出現大量長紅K，表示可以買進？


    - (1) 空頭急跌、爆量之後的收盤過昨日最高點的大量長紅K。

    - (2) 空頭轉多頭打底期間的底底高的大量長紅K。

    - (3) 空頭轉多頭第一次過前高，多頭確認的大量長紅K。

    - (4) 多頭回檔沒有跌破前面最低點，止跌回升的大量長紅K。

    - (5) 走勢當中盤整完成向上突破的大量長紅K。


    2. 何時出現大量長紅K，表示不能買進？


    - (1) 日線高檔的大量長紅K。

    - (2) 連續三根長紅K的位置。

    - (3) 接近前高壓力位置的大量長紅K。

    - (4) 盤整區中的大量長紅K。

    - (5) 空頭反彈的大量長紅K。

    - (6) 多頭出大量後回檔，跌破前低之後的反彈長紅K。


    行情走勢中，關鍵位置的突破或跌破、多頭的做多位置、空頭做空的位置，大多會出現長紅K線或長黑K線，我們稱為關鍵K棒，讀者要特別關注，別錯失重要的進出場機會。

    了解長紅、長黑單一K棒在不同位置的意義，看圖時即能一目了然。


    # 第2篇 中紅和中黑、小紅和小黑K線


    ### 認識中紅K線


    #### 定義


    開盤與收盤上下幅度達2.5～4.5%、開低走高的實體紅K線，而且是不含上下影線的實體K棒，即使有，也只能有很小的影線。


    #### 解說


    中紅K線，當天開盤是最低價，然後買盤拉抬，最後上漲約2.5～4.5%，到當天最高價收盤，所以當天是多方中強。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_79_0.png)


    #### 精通


    1. 中紅當天的實體要比長紅略短，觀察的重點與長紅K線相同，出現在不同趨勢、不同位置，代表的意義也不同，詳見第2篇第1章。

    2. 中紅K線可以合併觀察，例如連續2天或3天的中紅上漲，出現大量，可視為長紅K線爆大量；如果出現在底部或多頭關鍵上攻的位置，當然很好，但是出現在高檔，日後股價不漲或下跌，可就大大不好了。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_80_0.png)


    資料來源：富邦eO1電子交易系統


    ⓶ 空頭低檔連續出現反彈的帶大量中紅K線，合併看就是一根低檔大量長紅K線的吞噬，是轉折向上的訊號。


    # 中紅和中黑、小紅和小黑K線


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_81_0.png)


    #### 定義


    開盤與收盤上下幅度達2.5～4.5%以內，開高走低的實體黑K線，而且是沒有上下影線的實體K棒，即使有，也只能有很小的影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_81_1.png)


    #### 解說


    中黑K線，當天開盤是最高價，然後賣盤出籠，最後下跌約2.5～4.5%，到當天最低價收盤，所以當天是空方中強。


    #### 精通


    1. 中黑當天的實體要比長黑略短，觀察的重點與長黑K線相同，出現在不同趨勢、不同位置，代表的意義也不同，詳見第2篇第1章。

    2. 中黑K線可以合併觀察，例如連續2天或3天的中黑下跌，出現大量，可以視為長黑K線爆大量下跌；如果出現在頭部或空頭關鍵下跌位置，自然可以做空，但是出現在低檔，日後股價不跌或上漲，就要注意是否要打底。

    '
