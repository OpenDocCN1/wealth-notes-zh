  - '[PAGE 279]


    # 定義


    3根連續頭頭低、底底低的向下黑K線，沒有上下影線，即使有，也是很短。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_279_0.png)


    # 解說


    3根連續的向下黑K線，代表空方向下的企圖強，是空方力量的聚集，在短時間內會改變多方的掌控，多空易位明顯。


    # 精通


    +   1. 連續黑K線數量越多，代表下跌力量越大，影響時間越長。

    2. 連續黑K線呈現跳空下跌，威力更大。

    3. 連續黑K線如果出現在高檔的回檔，如再上漲，做頭的可能性很高。

    4. 多頭上漲到高檔，回檔出現「連三黑」組合，具有下跌潛力的黑馬股，要鎖股做空。

    5. 頭部做頭的第2個頭出現「連三黑」組合，為強勢空頭起的起跌訊號。

    6. 「連三黑」組合出現在空頭行進間，代表空方氣勢強，後續看跌，還有低點可期。

    7. 空頭行進到低點，出現「連三黑」組合，要注意以下訊號：

    　　(1) 連續黑K如出現長的下影線，為打樁探底訊號，注意低點'
  md: "\n線的訊號。(2) 高檔連三紅，出現爆量或價量背離，要留意股價不漲或下跌的反轉變盤訊號。\n\n- 8. 空頭行進出現連三紅，視為強勢反彈，容易反彈到前面的壓力位置。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_251_0.png)\n\n> 資料來源：富邦e01 電子交易系統\n\
    \n- ☉ 空頭下跌到低檔，出現「上漲連三紅」組合，強勢反彈。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_252_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 1. 空頭下跌到低檔，打底上漲出現「連三紅」組合，強勢完成多頭架構。\n- 2. 多頭行進中再出現「連三紅」組合，繼續強勢多頭格局。\n\
    \n## 第 5 篇 上漲中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_253_0.png)\n\n\
    資料來源：富邦e01電子交易系統\n\n- ① 打底上漲出現「連三紅」組合，強勢完成多頭架構。\n- ② 多頭行進中再出現「連三紅」組合，繼續強勢多頭格局。\n\
    \n### 定義\n\n上漲到高檔，連續數日紅K線上漲，但都出現明顯的上影線，這樣的組合稱為「大敵當前」。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_254_0.png)\n\
    \n### 解說\n\n連續上漲紅K線，看起來好像是「連三紅」的組合，可是紅K線都出現長上影線，雖然上漲，一直遇壓拉回，顯示有人一邊拉高、一邊出貨，其中若再出現爆量或價量背離，是變盤訊號，要特別注意高檔反轉向下的K線訊號。\n\
    \n### 精通\n\n- 1. 「大敵當前」組合出現在波段高檔，通常在末升段，連續紅K線的的上影線越長，拉高出貨越明顯，要特別注意後續股價不漲或回跌的K線變盤訊號。\n\
    - 2. 末升段的急漲，出現爆大量或價量背離，出現「大敵當前」組合，高點不多，千萬不要追高。\n- 3. 高檔出現「大敵當前」組合之後，走勢再出現「頭頭低」的波浪型態，趨勢轉成空頭的機率很高。\n\
    - 4. 在底部起漲位置出現的「連三紅帶上影線」的組合，是主力向上探頭測壓力的表現，不要誤認是出貨。\n\n## 第 5 章 上漲中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_255_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 1. 上漲高檔出現「大敵當前」組合，且出大量，主力一邊拉高、一邊出貨。\n- 2. 「大敵當前」組合之後，股價沒有再過前波高點，出現「頭頭低」，形成空頭。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_256_0.png)\n\n低檔底部出現「連三紅帶上影線」的組合，是主力測試前面高點的壓力，不是出貨，不要誤認是「大敵當前」組合。\n\
    \n### 定義\n\n出現向上跳空缺口，次日再出現不過紅K線的向下黑K線回補缺口。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_257_0.png)\n\
    \n### 解說\n\n上漲高檔或空頭的反彈走勢中，長紅K線後出現向上跳空缺口，但第3天開低向下黑K線回補缺口，轉折向下訊號強烈，再出現黑K線跌破第1根長紅K線最低點，多空易位，容易反轉直下。\n\
    \n### 精通\n\n- 1. 多頭趨勢高檔，向上跳空缺口附近出現爆大量，出現「上缺回補」組合，該缺口成為「竭盡缺口」，趨勢反轉可能性越大。\n- 2.\
    \ 多頭趨勢高檔，盤整結束，出現爆大量向上跳空缺口，突破盤整，接著出現「上缺回補」組合，視為假突破、真拉回，反轉可能性大。\n- 3. 空頭反彈出現「上缺回補」組合，反彈結束，繼續下跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_258_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_258_1.png)\n\
    \n- 多頭高檔出現帶大量跳空向上。\n- 次日長黑K線回補缺口，出現「上缺回補」，行情反轉。\n\n## 第 5 章 上漲中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_259_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 盤整的突破位置，出現帶大量跳空向上紅K線。\n- 次2日長黑K線回補缺口，出現「上缺回補」，是假突破。\n\
    - 長黑K線跌破盤整，是真跌破，行情反轉成空頭。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_260_0.png)\n\
    \n- 1. 低檔「連三紅」起漲，同時連續出現帶大量向上跳空的紅K線，強勢多頭型態。\n- 2. 上漲「一星二陽」中繼上漲，後續還有高點。\n- 3. 「三線反紅」起漲開始。\n\
    - 4. 上漲行進「連三紅」，後續還有高點。\n- 5. 上漲紅黑紅，中繼上漲，後續還有高點。\n- 6. 高檔連續大量，出現「上缺回補」，行情反轉。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_0.png)\n\n## 第 2 章 下跌中的K線組合\n\n下跌中的K線有7種組合，詳細研讀，就可以正確判斷行情的變化。\n\
    \n### 定義\n\n1根下跌的中長黑K線，次日1根十字或紡鎚變盤線，第3日1根低於第1日中長黑K線最低點的中長黑K線，這樣的3根K線下跌構成的組合，稱為「一星二陰」。通常中間的「星」，可以是紅K或黑K，可以有實體，但實體要很小。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_1.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_2.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_3.png)\n\n### 解說\n\n- 1. 在走勢下跌中經常可以看到「一星二陰」的組合，是下跌中繼的訊號，表示往下趨勢沒有改變，通常還會有更低價，仍為空方主控向下的格局。\n\
    - 2. 夾在中間的「星」，可以2根以上，重點是「星」的K線收盤，不能突破前一天K線的最高點。後面要有1根向下的中長黑K線，幅度與前面中長黑K線略同或更大。\n\
    \n### 精通\n\n- 1. 空頭下跌1根中長黑K線，當天跌幅太大，次日很容易出現休息狀態，然後再下跌，容易出現「一星二陰」的組合。\n- 2. 「一星二陰」組合出現後還有低點，因此空頭起跌出現第1根中長黑K線後，次日出現休息的變盤線，可以大膽推測後面容易再下跌1根中長黑K線，形成「一星二陰」組合而做空。這裡特別強調，是在空頭起跌的位置，如果下跌到低檔，當然不能這樣推測，因為低檔長黑再出現變盤十字線，容易出現「晨星」向上轉折。\n\
    - 3. 空頭下跌1根中長黑K線之後，連續出現1根以上的小紅、小黑或變盤線，如果橫盤維持在中長黑K線收盤之下，是弱勢整理的型態，隨時可能繼續下跌，把上面的中長黑K線搬到下面，面對這樣弱勢整理的型態，一定要把握下跌的機會做空。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_262_0.png)\n\n- 4. 空頭下墜1根中長黑K線之後，連續出現1根以上的小紅、小黑或變盤線，如果維持小幅下跌，是碎步走跌型態，隨時都可能發動大跌，出現中長黑K線的走勢。\n\
    - 5. 出現「一星二陰」的組合後，後面的中長黑K線的最高點不能被突破，否則會破壞「一星二陰」的架構。\n- 6. 「一星二陰」是往下走勢的組合，因此第1根K線可以是紅K線，次日出現往下的變盤線，再出現下跌的長黑K線。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_263_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_263_1.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_263_2.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_264_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n頭部完成，大量長黑K線下跌，次日出現十字線，再下跌長黑K線，下跌中出現「一星二陰」的組合，走勢還要下跌，不可低接股票。\n\
    \n## 第1章 下跌中的K線組合\n\n台塑（3110）日線圖 2013/07/17 開 17.05 高 18.25 低 17.05 收 18.10 元\
    \ 歷 15179 張 +1.10 (+6.47%)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_265_0.png)\n\
    \n資料來源：富邦e01 電子交易系統\n\n- ① 下跌出現紅K線反彈，是主力誘多，不可做多，後面連續4天碎步走跌，近日要大跌。\n- ② 大量長黑K線下跌，下跌中出現「一星二陰」的組合，走勢還要下跌，反彈不可做多股票。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_266_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    - 1. 空頭盤整末端，大量長黑K線下跌，容易跌破盤整。\n- 2. 連續4天出現小黑變盤線，都在大量長黑K線下面，為弱勢整理，隨時都會下跌。\n- 3.\
    \ 出現大量長黑K線下跌，出現「一星二陰」的組合，走勢還要下跌，後面還有低點，可以掌握做空。\n\n## 第五篇 下跌中的K線組合\n\n### 定義\n\n\
    1根下跌的中長黑K線，次日出現反彈1到數日的小紅、小黑或變盤線，但是收盤價始終沒有突破中長黑K線最高點，再出現往下的中長黑K線吞噬反彈的小紅、小黑或變盤線，這樣的組合稱為「下降三法」。在下跌趨勢中時常見到，表示後續還有低點，為下跌的中繼組合。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_267_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_267_1.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_267_2.png)\n\n### 解說\n\n走勢下跌出現中長黑K線，次日反彈，大多是散戶低接，反彈的力度都不強，而且都沒有突破中長黑K線最高點，之後出現1根中長黑K線下跌，反彈力道全部消失，次二日只要開低往下，將繼續空頭。\n\
    \n### 精通\n\n- 1. 多頭上漲到高點，出現「下降三法」的組合，後面不再突破中長黑K線最高點，可視為止漲反轉的訊號。\n- 2. 空頭下跌 1 根中長黑\
    \ K 線之後，出現反彈的小紅、小黑或變盤線，如果都維持在中長黑 K 線的 $\\frac{1}{2}$ 之下，是弱勢整理的型態，在空頭走勢中隨時都可能繼續大跌，要把握下跌的機會做空。\n\
    - 3. 出現「下跌三法」組合後，後面的中長黑 K 線的最高點不能被突破；否則會破壞「下降三法」的架構。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_268_0.png)\n\
    \n- ① 空頭行進，長黑K線下跌。\n- ② 連續3天小變盤線反彈，收盤都沒有突破長黑K線最高點。\n- ③ 再1根大量長黑K線下跌，出現「下降三法」的組合，走勢還要下跌，後面還有低點，可以掌握做空。\n\
    - ④ 再1根大量長黑K線下跌，出現「一星二陰」的組合，走勢還要下跌，後面還有低點。\n\n## 第五章 下跌中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_269_0.png)\n\
    \n- ① 高檔出現大量長黑K線下跌。\n- ② 連續5天小變盤線反彈，收盤都沒有突破長黑K線最高點。\n- ③ 再1根大量長黑K線下跌，出現「下降三法」的組合，同時完成空頭架構，走勢還要下跌，後面還有低點，可以掌握做空。\n\
    \n### 定義\n\n上漲行走中連續3根小紅K線，然後出現1根長黑K線，把前面3根小紅K線均包含在長黑K線之內，這根長黑K線呈現吞噬的組合，稱為「三線反黑」，為漲多的獲利賣壓，或拉高出貨。在下跌反彈中出現「三線反黑」組合，為反彈結束的訊號，可以順勢做空。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_270_0.png)\n\n### 解說\n\n在上漲或橫盤連續出現小紅K線或小黑K線，表示多方上漲力道減弱，空方1根下跌長黑K線就吞噬全部上漲或橫盤的小紅K線或小黑K線，為空方強力下跌或反轉的訊號。\n\
    \n### 精通\n\n- 1. 「三線反黑」組合必須符合2個條件才成立：(1) 長黑K線收盤要跌破前面3根小紅K線或小黑K線的最重點；(2) 下跌長黑K線的成交量要大於前面3根小紅K線或小黑K線的最高量，反轉或下跌的威力比較大。如果沒有大量，在多頭時下跌力道弱，在空頭反彈結束則繼續下跌。\n\
    - 2. 「三線反黑」組合是空方強力表態，在多頭趨勢中，短線反彈沒有突破長黑K線的最高點，很容易形成頭部，可以搶短線做空。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_271_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n多頭高檔上漲，出現大量長黑K線，跌破3根K線的最低點，出現「三線反黑」組合，是空方強力表態，同時出現「頭頭低，底底低」，多頭架構遭破壞，反轉為空頭。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_272_0.png)\n\n- 1. 多頭上漲到高檔，出現大量長黑K線跌破3根K線的最低點，出現「三線反黑」組合，是空方強力表態。\n\
    - 2. 再次黑K下跌，出現「頭頸低」，多頭架構改變。\n- 3. 高檔「連三黑」，跌破前面的最低點，反轉為空頭。\n- 4. 下跌中連續出現「一星二陰」組合，行情繼續下跌。\n\
    \n### 定義\n\n在上漲或反彈行進中，長紅K線之後出現「母子懷抱」黑K線，再出現跌破前面長紅K線最低點的長黑K線，稱為「內困三黑」組合。「母子懷抱」是變盤訊號，「內困三黑」是變盤反轉確認的訊號，空頭進場做空，多頭可搶短線回跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_273_0.png)\n\n### 解說\n\n在上漲高檔出現長紅K線，次日出現1根黑K線，被長紅K線包起成「母子懷抱」表示多方力道被空方開低走低黑K線奪回，空方再1根下跌長黑K線，跌破長紅K線的最低點，就完成「內困三黑」組合，成為空方強力下跌或回檔的訊號。\n\
    \n### 精通\n\n- 1. 上漲高檔長紅K線如果出現大量或爆量，次日形成「母子懷抱」，後續形成「內困三黑」組合的機率很高。\n- 2. 「內困三黑」的長黑K線跌破長紅K線的最低點，同時放大量，後續容易急跌，要把握機會立刻進場做空。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_274_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    - 多頭上漲到高檔，出現大量長紅K線。\n- 次日黑K下跌，出現「母子懷抱」組合的變盤訊號。\n- 長黑K線跌破前面大量長紅K線的低點，出現「內困三黑」組合。\n\
    - 上漲不過前高，出現「夜星」轉折向下組合，行情反轉下跌。\n\n## 第 5 篇 下跌中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_275_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 多頭上漲到高檔，出現大量長紅K線。\n- 次日黑K下跌，出現「母子懷抱」組合的變盤訊號。\n- 長黑K線跌破前面大量長紅K線的低點，出現「內困三黑」組合。\n\
    - 長黑K線跌破前面最低點，空頭架構完成。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_276_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 1. 多頭上漲到高檔，出現大量長紅K線。\n- 2. 次日黑K下跌，出現「母子懷抱」組合的變盤訊號。\n-\
    \ 3. 長黑K線跌破前面大量長紅K線的最低點，出現「內困三黑」組合。\n- 4. 向下跌空黑K線，頭肩頂型態被跌破，空頭架構完成。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_276_1.png)\n\
    \n### 定義\n\n下跌行進中出現黑K線、紅K線、黑K線，連續呈階梯式的下跌，稱為「下跌黑紅黑」組合，是繼續下跌的中繼走勢，為空方強勢的訊號，宜找空點進場。\n\
    \n### 解說\n\n下跌行進中出現黑K線、紅K線、黑K線，只看這3根K線，是頭頭低、底底低的下跌階梯走勢，可見空頭仍然在繼續掌控下跌中，不要因為中間的1根紅K線而被誤導，小心是誘多。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_277_0.png)\n\n下跌行進中，出現「下跌黑紅黑」組合，是繼續下跌的中繼走勢，紅K不可做多，後續還有低點。\n\
    \n台指權(2330) 日線圖 2013/07/18 開 107.50 高 108.00 低 107.00 收 107.00 元 盤 14364 張 -2.00\
    \ (-1.83%)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_278_0.png)\n\n收夾盤 34773\
    \ 張\n\nMA5 0.02 + 9 + %\n\nMA10 27821 張\n\n2002/02 03/01 04/01\n\n100K 50K\n\n\
    資料來源：富邦e01電子交易系統\n\n空頭下跌行情中，出現「下跌黑紅黑」組合，是繼續下跌的中繼走勢，紅K不可做多，後續還有低點。\n\n### 定義\n\n\
    3根連續頭頭低、底底低的向下黑K線，沒有上下影線，即使有，也是很短。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_279_0.png)\n\
    \n### 解說\n\n3根連續的向下黑K線，代表空方向下的企圖強，是空方力量的聚集，在短時間內會改變多方的掌控，多空易位明顯。\n\n### 精通\n\n\
    - 1. 連續黑K線數量越多，代表下跌力量越大，影響時間越長。\n- 2. 連續黑K線呈現跳空下跌，威力更大。\n- 3. 連續黑K線如果出現在高檔的回檔，如再上漲，做頭的可能性很高。\n\
    - 4. 多頭上漲到高檔，回檔出現「連三黑」組合，具有下跌潛力的黑馬股，要鎖股做空。\n- 5. 頭部做頭的第2個頭出現「連三黑」組合，為強勢空頭起的起跌訊號。\n\
    - 6. 「連三黑」組合出現在空頭行進間，代表空方氣勢強，後續看跌，還有低點可期。\n- 7. 空頭行進到低點，出現「連三黑」組合，要注意以下訊號：\n \
    \   - (1) 連續黑K如出現長的下影線，為打樁探底訊號，注意低點\n"
  mdcn: "\n線的訊號。(2) 高檔連三紅，出現爆量或價量背離，要留意股價不漲或下跌的反轉變盤訊號。\n\n- 8. 空頭行進出現連三紅，視為強勢反彈，容易反彈到前面的壓力位置。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_251_0.png)\n\n> 資料來源：富邦e01 電子交易系統\n\
    \n- ☉ 空頭下跌到低檔，出現「上漲連三紅」組合，強勢反彈。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_252_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 1. 空頭下跌到低檔，打底上漲出現「連三紅」組合，強勢完成多頭架構。\n- 2. 多頭行進中再出現「連三紅」組合，繼續強勢多頭格局。\n\
    \n## 第 5 篇 上漲中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_253_0.png)\n\n\
    資料來源：富邦e01電子交易系統\n\n- ① 打底上漲出現「連三紅」組合，強勢完成多頭架構。\n- ② 多頭行進中再出現「連三紅」組合，繼續強勢多頭格局。\n\
    \n### 定義\n\n上漲到高檔，連續數日紅K線上漲，但都出現明顯的上影線，這樣的組合稱為「大敵當前」。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_254_0.png)\n\
    \n### 解說\n\n連續上漲紅K線，看起來好像是「連三紅」的組合，可是紅K線都出現長上影線，雖然上漲，一直遇壓拉回，顯示有人一邊拉高、一邊出貨，其中若再出現爆量或價量背離，是變盤訊號，要特別注意高檔反轉向下的K線訊號。\n\
    \n### 精通\n\n- 1. 「大敵當前」組合出現在波段高檔，通常在末升段，連續紅K線的的上影線越長，拉高出貨越明顯，要特別注意後續股價不漲或回跌的K線變盤訊號。\n\
    - 2. 末升段的急漲，出現爆大量或價量背離，出現「大敵當前」組合，高點不多，千萬不要追高。\n- 3. 高檔出現「大敵當前」組合之後，走勢再出現「頭頭低」的波浪型態，趨勢轉成空頭的機率很高。\n\
    - 4. 在底部起漲位置出現的「連三紅帶上影線」的組合，是主力向上探頭測壓力的表現，不要誤認是出貨。\n\n## 第 5 章 上漲中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_255_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 1. 上漲高檔出現「大敵當前」組合，且出大量，主力一邊拉高、一邊出貨。\n- 2. 「大敵當前」組合之後，股價沒有再過前波高點，出現「頭頭低」，形成空頭。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_256_0.png)\n\n低檔底部出現「連三紅帶上影線」的組合，是主力測試前面高點的壓力，不是出貨，不要誤認是「大敵當前」組合。\n\
    \n### 定義\n\n出現向上跳空缺口，次日再出現不過紅K線的向下黑K線回補缺口。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_257_0.png)\n\
    \n### 解說\n\n上漲高檔或空頭的反彈走勢中，長紅K線後出現向上跳空缺口，但第3天開低向下黑K線回補缺口，轉折向下訊號強烈，再出現黑K線跌破第1根長紅K線最低點，多空易位，容易反轉直下。\n\
    \n### 精通\n\n- 1. 多頭趨勢高檔，向上跳空缺口附近出現爆大量，出現「上缺回補」組合，該缺口成為「竭盡缺口」，趨勢反轉可能性越大。\n- 2.\
    \ 多頭趨勢高檔，盤整結束，出現爆大量向上跳空缺口，突破盤整，接著出現「上缺回補」組合，視為假突破、真拉回，反轉可能性大。\n- 3. 空頭反彈出現「上缺回補」組合，反彈結束，繼續下跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_258_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_258_1.png)\n\
    \n- 多頭高檔出現帶大量跳空向上。\n- 次日長黑K線回補缺口，出現「上缺回補」，行情反轉。\n\n## 第 5 章 上漲中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_259_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 盤整的突破位置，出現帶大量跳空向上紅K線。\n- 次2日長黑K線回補缺口，出現「上缺回補」，是假突破。\n\
    - 長黑K線跌破盤整，是真跌破，行情反轉成空頭。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_260_0.png)\n\
    \n- 1. 低檔「連三紅」起漲，同時連續出現帶大量向上跳空的紅K線，強勢多頭型態。\n- 2. 上漲「一星二陽」中繼上漲，後續還有高點。\n- 3. 「三線反紅」起漲開始。\n\
    - 4. 上漲行進「連三紅」，後續還有高點。\n- 5. 上漲紅黑紅，中繼上漲，後續還有高點。\n- 6. 高檔連續大量，出現「上缺回補」，行情反轉。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_0.png)\n\n## 第 2 章 下跌中的K線組合\n\n下跌中的K線有7種組合，詳細研讀，就可以正確判斷行情的變化。\n\
    \n### 定義\n\n1根下跌的中長黑K線，次日1根十字或紡鎚變盤線，第3日1根低於第1日中長黑K線最低點的中長黑K線，這樣的3根K線下跌構成的組合，稱為「一星二陰」。通常中間的「星」，可以是紅K或黑K，可以有實體，但實體要很小。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_1.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_2.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_261_3.png)\n\n### 解說\n\n- 1. 在走勢下跌中經常可以看到「一星二陰」的組合，是下跌中繼的訊號，表示往下趨勢沒有改變，通常還會有更低價，仍為空方主控向下的格局。\n\
    - 2. 夾在中間的「星」，可以2根以上，重點是「星」的K線收盤，不能突破前一天K線的最高點。後面要有1根向下的中長黑K線，幅度與前面中長黑K線略同或更大。\n\
    \n### 精通\n\n- 1. 空頭下跌1根中長黑K線，當天跌幅太大，次日很容易出現休息狀態，然後再下跌，容易出現「一星二陰」的組合。\n- 2. 「一星二陰」組合出現後還有低點，因此空頭起跌出現第1根中長黑K線後，次日出現休息的變盤線，可以大膽推測後面容易再下跌1根中長黑K線，形成「一星二陰」組合而做空。這裡特別強調，是在空頭起跌的位置，如果下跌到低檔，當然不能這樣推測，因為低檔長黑再出現變盤十字線，容易出現「晨星」向上轉折。\n\
    - 3. 空頭下跌1根中長黑K線之後，連續出現1根以上的小紅、小黑或變盤線，如果橫盤維持在中長黑K線收盤之下，是弱勢整理的型態，隨時可能繼續下跌，把上面的中長黑K線搬到下面，面對這樣弱勢整理的型態，一定要把握下跌的機會做空。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_262_0.png)\n\n- 4. 空頭下墜1根中長黑K線之後，連續出現1根以上的小紅、小黑或變盤線，如果維持小幅下跌，是碎步走跌型態，隨時都可能發動大跌，出現中長黑K線的走勢。\n\
    - 5. 出現「一星二陰」的組合後，後面的中長黑K線的最高點不能被突破，否則會破壞「一星二陰」的架構。\n- 6. 「一星二陰」是往下走勢的組合，因此第1根K線可以是紅K線，次日出現往下的變盤線，再出現下跌的長黑K線。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_263_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_263_1.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_263_2.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_264_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n頭部完成，大量長黑K線下跌，次日出現十字線，再下跌長黑K線，下跌中出現「一星二陰」的組合，走勢還要下跌，不可低接股票。\n\
    \n## 第1章 下跌中的K線組合\n\n台塑（3110）日線圖 2013/07/17 開 17.05 高 18.25 低 17.05 收 18.10 元\
    \ 歷 15179 張 +1.10 (+6.47%)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_265_0.png)\n\
    \n資料來源：富邦e01 電子交易系統\n\n- ① 下跌出現紅K線反彈，是主力誘多，不可做多，後面連續4天碎步走跌，近日要大跌。\n- ② 大量長黑K線下跌，下跌中出現「一星二陰」的組合，走勢還要下跌，反彈不可做多股票。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_266_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    - 1. 空頭盤整末端，大量長黑K線下跌，容易跌破盤整。\n- 2. 連續4天出現小黑變盤線，都在大量長黑K線下面，為弱勢整理，隨時都會下跌。\n- 3.\
    \ 出現大量長黑K線下跌，出現「一星二陰」的組合，走勢還要下跌，後面還有低點，可以掌握做空。\n\n## 第五篇 下跌中的K線組合\n\n### 定義\n\n\
    1根下跌的中長黑K線，次日出現反彈1到數日的小紅、小黑或變盤線，但是收盤價始終沒有突破中長黑K線最高點，再出現往下的中長黑K線吞噬反彈的小紅、小黑或變盤線，這樣的組合稱為「下降三法」。在下跌趨勢中時常見到，表示後續還有低點，為下跌的中繼組合。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_267_0.png)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_267_1.png)\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_267_2.png)\n\n### 解說\n\n走勢下跌出現中長黑K線，次日反彈，大多是散戶低接，反彈的力度都不強，而且都沒有突破中長黑K線最高點，之後出現1根中長黑K線下跌，反彈力道全部消失，次二日只要開低往下，將繼續空頭。\n\
    \n### 精通\n\n- 1. 多頭上漲到高點，出現「下降三法」的組合，後面不再突破中長黑K線最高點，可視為止漲反轉的訊號。\n- 2. 空頭下跌 1 根中長黑\
    \ K 線之後，出現反彈的小紅、小黑或變盤線，如果都維持在中長黑 K 線的 $\\frac{1}{2}$ 之下，是弱勢整理的型態，在空頭走勢中隨時都可能繼續大跌，要把握下跌的機會做空。\n\
    - 3. 出現「下跌三法」組合後，後面的中長黑 K 線的最高點不能被突破；否則會破壞「下降三法」的架構。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_268_0.png)\n\
    \n- ① 空頭行進，長黑K線下跌。\n- ② 連續3天小變盤線反彈，收盤都沒有突破長黑K線最高點。\n- ③ 再1根大量長黑K線下跌，出現「下降三法」的組合，走勢還要下跌，後面還有低點，可以掌握做空。\n\
    - ④ 再1根大量長黑K線下跌，出現「一星二陰」的組合，走勢還要下跌，後面還有低點。\n\n## 第五章 下跌中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_269_0.png)\n\
    \n- ① 高檔出現大量長黑K線下跌。\n- ② 連續5天小變盤線反彈，收盤都沒有突破長黑K線最高點。\n- ③ 再1根大量長黑K線下跌，出現「下降三法」的組合，同時完成空頭架構，走勢還要下跌，後面還有低點，可以掌握做空。\n\
    \n### 定義\n\n上漲行走中連續3根小紅K線，然後出現1根長黑K線，把前面3根小紅K線均包含在長黑K線之內，這根長黑K線呈現吞噬的組合，稱為「三線反黑」，為漲多的獲利賣壓，或拉高出貨。在下跌反彈中出現「三線反黑」組合，為反彈結束的訊號，可以順勢做空。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_270_0.png)\n\n### 解說\n\n在上漲或橫盤連續出現小紅K線或小黑K線，表示多方上漲力道減弱，空方1根下跌長黑K線就吞噬全部上漲或橫盤的小紅K線或小黑K線，為空方強力下跌或反轉的訊號。\n\
    \n### 精通\n\n- 1. 「三線反黑」組合必須符合2個條件才成立：(1) 長黑K線收盤要跌破前面3根小紅K線或小黑K線的最重點；(2) 下跌長黑K線的成交量要大於前面3根小紅K線或小黑K線的最高量，反轉或下跌的威力比較大。如果沒有大量，在多頭時下跌力道弱，在空頭反彈結束則繼續下跌。\n\
    - 2. 「三線反黑」組合是空方強力表態，在多頭趨勢中，短線反彈沒有突破長黑K線的最高點，很容易形成頭部，可以搶短線做空。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_271_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n多頭高檔上漲，出現大量長黑K線，跌破3根K線的最低點，出現「三線反黑」組合，是空方強力表態，同時出現「頭頭低，底底低」，多頭架構遭破壞，反轉為空頭。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_272_0.png)\n\n- 1. 多頭上漲到高檔，出現大量長黑K線跌破3根K線的最低點，出現「三線反黑」組合，是空方強力表態。\n\
    - 2. 再次黑K下跌，出現「頭頸低」，多頭架構改變。\n- 3. 高檔「連三黑」，跌破前面的最低點，反轉為空頭。\n- 4. 下跌中連續出現「一星二陰」組合，行情繼續下跌。\n\
    \n### 定義\n\n在上漲或反彈行進中，長紅K線之後出現「母子懷抱」黑K線，再出現跌破前面長紅K線最低點的長黑K線，稱為「內困三黑」組合。「母子懷抱」是變盤訊號，「內困三黑」是變盤反轉確認的訊號，空頭進場做空，多頭可搶短線回跌。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_273_0.png)\n\n### 解說\n\n在上漲高檔出現長紅K線，次日出現1根黑K線，被長紅K線包起成「母子懷抱」表示多方力道被空方開低走低黑K線奪回，空方再1根下跌長黑K線，跌破長紅K線的最低點，就完成「內困三黑」組合，成為空方強力下跌或回檔的訊號。\n\
    \n### 精通\n\n- 1. 上漲高檔長紅K線如果出現大量或爆量，次日形成「母子懷抱」，後續形成「內困三黑」組合的機率很高。\n- 2. 「內困三黑」的長黑K線跌破長紅K線的最低點，同時放大量，後續容易急跌，要把握機會立刻進場做空。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_274_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    - 多頭上漲到高檔，出現大量長紅K線。\n- 次日黑K下跌，出現「母子懷抱」組合的變盤訊號。\n- 長黑K線跌破前面大量長紅K線的低點，出現「內困三黑」組合。\n\
    - 上漲不過前高，出現「夜星」轉折向下組合，行情反轉下跌。\n\n## 第 5 篇 下跌中的K線組合\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_275_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 多頭上漲到高檔，出現大量長紅K線。\n- 次日黑K下跌，出現「母子懷抱」組合的變盤訊號。\n- 長黑K線跌破前面大量長紅K線的低點，出現「內困三黑」組合。\n\
    - 長黑K線跌破前面最低點，空頭架構完成。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_276_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 1. 多頭上漲到高檔，出現大量長紅K線。\n- 2. 次日黑K下跌，出現「母子懷抱」組合的變盤訊號。\n-\
    \ 3. 長黑K線跌破前面大量長紅K線的最低點，出現「內困三黑」組合。\n- 4. 向下跌空黑K線，頭肩頂型態被跌破，空頭架構完成。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_276_1.png)\n\
    \n### 定義\n\n下跌行進中出現黑K線、紅K線、黑K線，連續呈階梯式的下跌，稱為「下跌黑紅黑」組合，是繼續下跌的中繼走勢，為空方強勢的訊號，宜找空點進場。\n\
    \n### 解說\n\n下跌行進中出現黑K線、紅K線、黑K線，只看這3根K線，是頭頭低、底底低的下跌階梯走勢，可見空頭仍然在繼續掌控下跌中，不要因為中間的1根紅K線而被誤導，小心是誘多。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_277_0.png)\n\n下跌行進中，出現「下跌黑紅黑」組合，是繼續下跌的中繼走勢，紅K不可做多，後續還有低點。\n\
    \n台指權(2330) 日線圖 2013/07/18 開 107.50 高 108.00 低 107.00 收 107.00 元 盤 14364 張 -2.00\
    \ (-1.83%)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_278_0.png)\n\n收夾盤 34773\
    \ 張\n\nMA5 0.02 + 9 + %\n\nMA10 27821 張\n\n2002/02 03/01 04/01\n\n100K 50K\n\n\
    資料來源：富邦e01電子交易系統\n\n空頭下跌行情中，出現「下跌黑紅黑」組合，是繼續下跌的中繼走勢，紅K不可做多，後續還有低點。\n\n### 定義\n\n\
