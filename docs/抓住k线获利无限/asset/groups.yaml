    - 多頭回檔出現「連三黑」組合，下跌到前面低點。可以鎖股，往後下跌為強勢的空頭。\n- 回檔後再反彈是逃命波，如果多單不立刻出場，後續下跌會被套慘賠。\n\n\
    ### 日月光(2311)日線圖\n2013/07/19 開 24.75 高 24.75 低 23.80 收 24.40 元 盤 15080 張 -0.60\
    \ (-2.40%)\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_282_0.png)\n\n資料來源：富邦eO1\
    \ 電子交易系統\n\n空頭低檔出現「連三黑」組合，同時出現爆大量。容易止跌反彈，次日開高盤則反彈。\n\n### 下缺回補\n#### 定義\n出現向下跳空缺口，次日出現不破黑K線的向上紅K線回補缺口。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_283_0.png)\n\n#### 解說\n下跌低檔或多頭的回檔走勢中，長黑K線後出現向下跳空缺口，但第3天的開高向上紅K線回補缺口，轉折向上訊號強烈，再出現紅K線突破第1根長黑K線最高點，多空易位，容易反轉上漲。\n\
    \n#### 精通\n1. 空頭趨勢低檔，向下跳空缺口附近爆大量，出現「下缺回補」組合，該缺口成為「竭盡缺口」，趨勢反轉可能性大。\n2. 空頭趨勢低檔，盤整結束，出現爆大量向下跳空缺口，跌破盤整，接著出現「下缺回補」組合，視為假跌破、真上漲，反轉可能性大。\n\
