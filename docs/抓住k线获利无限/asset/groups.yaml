    # 定義


    1根上漲的中長紅K線，次日出現回跌1到數日的小紅、小黑或變盤線，但收盤價始終沒有跌破中長紅K線最低點，再出現往上的中長紅K線，吞噬回跌的小紅、小黑或變盤線。「上升三法」在上漲趨勢中時常見到，表示後續還有高點，為上漲的中繼組合。


