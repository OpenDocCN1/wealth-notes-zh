    +   1. 強勢上漲到高點，出現長紡錘線，表示當天出現多空激戰。必須觀察次日的走勢，才能夠確認多空交戰結果是多方或空方勝。


    +   * 次日開盤向下跳空大跌，多頭上漲架構瓦解的可能性大大提高，如果有大量，容易一日反轉或做頭。


    +   * 次日開低向下或開高走低，收盤跌破長紡錘線的實體下'
