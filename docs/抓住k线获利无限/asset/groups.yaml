  - '[PAGE 10]


    # 不要看新聞買股票

    K線能讓你逃過一劫

    也能讓你精準獲利


    2012年3月28日經濟日報頭版標題：「鴻海473億入股夏普。」許多投資人看到這則新聞後都認為，鴻海跨出了「聯日抗韓」的第一步，前途一片看好。


    當天鴻海（2317）開盤跳空大漲3.7%，股價上漲4元，收盤113元，上漲5元，漲幅高達4.6%，同時爆出10萬張的大量。


    次日盤中高點117元，收盤116元再上漲3元，同時再爆量12萬張大


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_10_0.png)


    資料來源：富邦eGi 電子交易系統'
  - '[PAGE 11]


    量，從此以後，股價都沒有再回到117元的高點，2013年10月1日的收盤價是75.5元。換句話說，當天看到消息去買股票的投資人，不僅被套牢1年7個月，而且還賠了30%的本金，真是情何以堪。


    # 看懂K線 趨吉避凶


    以技術分析的K線訊號來看鴻海的圖形走勢，可以分為下列幾點來討論：


    +   這一波多頭正確的進場位置在3月22日，當天回檔到月線有支撐，而且放量紅K上漲，突破前一日的最高點，收盤105元買進。持股到3月28日利多的跳空大漲，以多頭上漲特性，過高容易拉回，正是準備獲利出場時機。


    +   再看3月28日利多爆量的跳空大漲，K線收盤呈現的是有上下影線的紡錘線，表示當天多空激戰，有人利用利多機會在出貨，也就是說，當天爆量，價漲，但是K線不好，即使看報利多買進，也要注意不能出現跌破紡錘線轉折向下的黑K線反轉訊號。同時注意大量向上跳空缺口是重要支撐，近內不能回補，否則會成為竭盡缺口。


    +   次日再爆大量，紅K上漲，持股續抱，當然沒有問題。


    +   3月30日，收盤K線出現雙盤的十字線，這時手中有持股的投資人，要特別小心股價反轉，因為出現「高檔爆量，股價不漲」、「大量紅K，股價該攻不攻」、「高檔紅K母子懷抱」的K線三大警訊，必須密切注意第二天的開盤走勢。


    +   4月2日，開低走低，黑K收盤跌破最大量紅K的低點，三日K線形成內因三黑的下跌組合，轉折向下確認。3月28日利多大漲搶進的多單，此時應該迅速出場。'
  - '[PAGE 12]


    +   ⚫ 4月17日再出現下跌長黑K，5天的K線組合是夜星反轉訊號，同時波瀾型態已經呈現頭頭低，頭部即將成形，看消息於3月28日利多大漲搶進的多單，是最後的逃命機會，當天收盤價110元，投資人大約賠損3~5元。


    +   ⚫ 如果看不懂K線變化，沒有即時處理股票，後來一路下跌到80.9元才初步止跌反彈、下跌28%，而且到現在一年多還沒有解套。


    # 彰銀併台新銀股民慘遭套牢


    2013年2月20日工商時報頭版斗大標題：「彰銀擬併台新銀。」這對於台新金（2887）是個大利多，許多投資人在當天早上開盤時就搶買台新金。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_12_0.png)


    資料來源：富邦e01電子交易系統'
  - '[PAGE 13]


    當天台新金（2887）開盤跳空大漲，沒一會兒就漲停板，股價上漲13.1元，同時爆出16萬張的大量。比鴻海還慘的是，當天漲停板打開，一下跌，收盤12.7元，當天賠錢套牢，次日直接下殺。


    # K線領先反應原因隨後才到


    K線永遠領先反應市場的基本面、消息面和心理面。在股票市場，散戶最弱勢，不可能先知道股票漲跌的原因，但是知道原因的人必然會做出買或賣的動作，只要有動作，就會反應在當天的K線及成交量。所以，只要能夠精準研判K線及成交量的變化，一樣可以精準獲利或避開風險、逢凶化吉。


    我們來看晶豪科（3006），這檔股票在2月25日出現放量長紅K


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_13_0.png)


    資料來源：富邦e01 電子交易系統'
  - '[PAGE 14]


    線，突破高點多頭確認，從收盤價25.25元開始上漲，之後一直維持多頭趨勢，一直漲到約40元開始橫向整理。一般散戶並不知道這檔股票為何會上漲那麼多，到了5月13日工商時報的頭版出現「晶豪科MCP接單滿到Q3」的標題，散戶才知道原因。當天股價衝到42.3元，但多頭已經上漲了67%，所以技術面永遠領先消息面。


    # 精通K線 精準獲利


    俗話說：「在股票市場，會買只是徒弟，會賣才是師傅。」「買對位置成功一半，賣對位置才是全部成功。」一般投資人之所以無法精準掌握進出位置，主要還是無法正確解讀K線透露的語言。本書的目的是，幫助讀者提升判讀K線的功力，掌握K線訊號，買在最佳進場點，賣在相對高點，成為股市獲利的大贏家。'
  - '[PAGE 15]


    # 談自助、人助、天助

    所有成功的緣分

    都起源於自己


    教學3年多以來，每次有學生告訴我關於股票賠錢的經歷時，總是讓我很難過。在這段教學時光，看到學生從開始學習，到看懂股票而賺錢，是我最開心的事。


    其實，他們的成功不是沒有原因，每次他們謝謝我的時候，我都告訴他們，應該要「感謝自己」，因為我只能告訴他們一些專業知識和操作 方法，但下決心學習、用功做功課、堅持努力，得靠他們「自己」。


    每個來上課的同學都有感人的故事，謝謝他們願意分享給我，雖然他們來學習的背景不同，但是目標都一樣：希望在股市賺錢。


    下面舉幾個同學的例子，每個都是「因緣」、「行動」、「努力」、「堅持」串連的真實成功故事，希望能夠啟發「想要努力」或「正在努力」的投資朋友，只要你「願意」，一定可以像他們一樣「成功」。


    # 誠品書店巧遇的蔡先生


    2011年7月的一個週日晚上，我循例到敦化南路的誠品書店，這是我一星期最放鬆的時間，我會一個人慢慢翻閱自己喜歡的書。當天，我的心情有點不同，因為《Money錢》剛出版了我的第一本新書《抓'
  - '[PAGE 16]


    住飆股輕鬆賺》，這本書放在進門處的新書平台上，擺放了一整落約 20本，所以，我除了抱著原本逛書店的心情之外，還格外注意自己的 新書。


    在新書區駐是一會兒後，我順著右邊長書廊走向財經書架區，突然 有位先生走到我面前，帶點興奮語氣問我說：「您是不是前面新書 的作者朱家泓老師？」


    我說：「是啊！您怎麼知道？」


    他說：「我剛剛在前面看到您的新書，封面上有您的照片，所以認 出來了。」


    我說：「哇！您好厲害，封面照片出版社有用電腦修過，看上去很 年輕，跟我本人差很多，您還能認出來。」


    就這樣打開了彼此的話匣子，在書店中聊了起來。他姓蔡，曾經拿 了1千萬元給一位蠻有名的老師代操股票，起初幾個月，平均都能拿 到20萬～30萬的獲利，當時日子過得很悠閒，經常到國外旅遊。大約
    半年之後，拿到的獲利每況愈下，一年不到，不但沒有獲利可拿，連 本金1千萬元也賠得只剩下不到1百萬元。這個打擊太大，他下決心要 自己學、自己做。


    他的故事可說是股市中很平凡的遭遇，很多投資人都是太相信所謂 的「專家」、「高手」，輕易就把手給對方，以為這樣就可以坐享獲 利，其實大多數都是賠錢下場。


    我建議蔡先生，從最基礎的技術分析開始，做好一年的學習計畫， 按部就班地邊學邊用小資金練習操作，同時要體悟紀律操作的重要。 蔡先生後來陸續上完我所開的課，同時不斷檢討改進，找出適合
    自己的方法。2012年9月，我在「期指當沖」的課堂上看到他，他很'
  - '[PAGE 17]


    興奮地告訴我獲利績效，那天正好是教師節，他還代表全班把一張寫滿同學祝福的卡片送給我。我當下雖然沒有流眼淚，但那份感動久久不散。


    兩年前的那天，如果我沒有去逛誠品書局，如果他没有認出我，如果他不願意從基礎學習，他就不會像今天這樣，成為充滿信心的股市高手了。這個緣分，是蔡先生自己開啓的。


    # 馬來西亞飛來的邱同學


    2012年初某一天上課時，課堂助理告訴我，班上有位遠從馬來西亞來上課的學生，我有些訝異，難道他要坐飛機來上課？課堂上我看到這位學生，年紀看上去應該40歲左右，很斯文的一位男士。


    課間休息的時候，我特別去認識他。他是邱先生，馬來西亞人，是位精神科醫生，在香港執業。我很好奇，我並不是什麼出名的老師，更沒有財經界頭銜或者是顯赫的學位背景，他為什麼願意到臺灣來上我的課？


    邱先生告訴我，他對股票很有興趣，他在香港買了一些港股和大陸上海股票，可是一直做不好而賠錢。有一天，他的朋友在台灣的書店買了一本我的書帶回香港，借給他看。他看完之後才知道，做股票要具備一些專業知識，於是他上網用書名及作者名搜尋，找到我開課的資訊，並且報名了假日班，每次上課就坐飛機來臺灣，住在飯店3、4天。


    後來他陸續上完基礎班、進階班和專修班的課程，前前後後也飛了快半年的時間。2013年農曆年前，我接到邱先生寄來的電子郵件，全文如下：'
  - '[PAGE 18]


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_18_0.png)


    > 朱老師，您好！


    好久沒寫郵件給您，近來好嗎？新年快樂！恭喜發財！


    最近港股操作都還好，部分股票有賺超過50%、停損次數少很多了。


    我看到您最近開了新課程「技術分析高階班」，內容和過去不一樣嗎？如果有很多新資訊，我等您開假日班，就飛來上。


    下半年我會找時間來上您的「期指當沖」假日班。


    祝新年快樂！蛇年行大運！


    接到他的電子郵件，我很高興，現在他能穩健獲利。這個「緣分」是因為他不只是看看書，而是下決心坐飛機來上課，我們才能認識。他付出了金錢、時間及努力，才有今天的成果，這一切都是起因於「他自己」。


    # 台東搭火車來的趙小姐


    「老師您好！我又來上課了！」每次她在教室看到我就跟我說這句話。她是趙小姐、個子高挑，總是面帶微笑，住在台東，她是老師，先生在前東開精品咖啡屋。


    她學股票是為了以後退休做好準備，但是在東部，股票學習的課程很少，也沒有老師到台東開課，所以就不辭辛苦地到台北學習，每次假日班下午5點下課後，她都搭乘稍晚6點多的火車回台東，到家已經是凌晨。


    台東的火車票很難買，有時為了上課，必須在一個星期前去搶票，她的好學精神令人感佩。她抱著先做好百萬準據才買股票的想法，在'
