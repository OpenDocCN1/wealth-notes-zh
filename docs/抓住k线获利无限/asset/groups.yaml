    ## 第4篇 低檔3根K線轉折向上的變化組合


    ### 第4章 低檔3根K線轉折向上的變化組合


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_221_0.png)


    > 資料來源：富邦e01電子交易系統


    下跌到低檔，出現帶大量長黑K線。次日跳空向下的1根變盤線，再向上跳空長紅K線，出現「孤島晨星」的訊號，空頭反彈。


    ### 組合2：母子變盤


    1. 下跌低檔或多頭回檔出現中長黑K線，次日出現懷抱變盤線，如果第3天出現往上中長紅K線上漲，稱為「母子變盤」組合。

    2. 出現「母子變盤」組合，中長黑K線的最高點被突破，向上反轉更加確認，如果同時出現大量或爆大量，反轉更明顯。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_221_1.png)


    3. 出現「母子變盤」組合，在空頭下跌趨勢中即將強力反彈，空單要回補。在多頭回檔時，將繼續上漲，要把握做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_222_0.png)


    > 資料來源：富邦eQ！電子交易系統


    5. 下跌到低檔，出現放量長黑K線。次日母子懷抱十字線，再長紅上漲，突破長黑最高點，「母子變盤」強力反彈。


    ### 低檔3根K線轉折向上的變化組合


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_223_0.png)


    > 資料來源：富邦eO1電子交易系統


    - 下跌出現「母子變盤」組合，空頭反彈。

    - 下跌出現「雙肩變盤」組合，空頭反彈成底底高，空頭趨勢改變。

    - 多頭回檔，出現「母子變盤」組合，多頭繼續上漲。


    ### 組合3：雙星變盤


    1. 下跌低檔或多頭回檔出現中長黑K線，之後連續在低檔出現2根變盤線，第4天出現往上中長紅K線上漲，稱為「雙星變盤」。

    2. 出現「雙星變盤」組合，雙星呈現「孤島轉折」，向上反轉訊號更強，如果低檔同時出現大量或爆大量，反轉更明顯，空單要回補。在多頭回檔時出現「雙星變盤」組合，將繼續上漲，要把握做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_223_1.png)


    - 下跌至低檔，出現長黑K線。

    - 連續2天變盤線。

    - 右邊出現對稱帶大量上漲的紅K線，低檔出現「雙星變盤」的組合，股價將會反轉。


    ### 第 4 篇 第4章 低檔3根K線轉折向上的變化組合


    ### 組合4：雙肩變盤


    1. 下跌低檔或多頭回檔出現長黑K線，之後連續在低檔出現2根中長紅K線，第4天出現往上長紅K線上漲，稱為「雙肩變盤」。

    2. 出現「雙肩變盤」組合，向上反轉訊號強烈，如果低檔同時出現大量或爆大量，反轉更明顯，空單要回補。在多頭回檔時出現「雙肩變盤」組合，將繼續上漲，要把握做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_225_0.png)


    > 資料來源：富邦e01電子交易系統


    跌到低檔出現長黑K線，之後出現2根懷抱變盤線，然後再出現2根中紅K線，接著出現向上的長紅K線，突破長黑K線最高點，形成「雙肩變盤」的訊號，空頭反轉。


    ### 組合6：群星變盤


    1. 下跌到低檔出現中長黑K線，之後在低檔連續出現2根以上的變盤線，再出現往上中長紅K線上漲，這種組合稱為「群星變盤」。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_226_0.png)


    2. 「群星變盤」組合的群星數量越多，向上反轉訊號越明確，同時上漲的時間也會越長，短期不容易下跌，空單要回補，也可以做多。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_226_1.png)


    > 資料來源：富邦eO1電子交易系統


    - ① 下跌到低檔，出現長黑K線。

    - ② 連續6天變盤線的橫盤。

    - ③ 右邊出現對稱上漲的帶大量長紅K線，低檔出現6星變盤的組合，股價反轉。6星變盤，最少6天是多方主控上漲。


    ### 第4篇 低檔3根K線轉折向上的變化組合


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_227_0.png)


    > 資料來源：富邦eO1電子交易系統


    1. 下跌到低檔，出現帶大量的長黑K線。

    2. 連續5天變盤線的橫盤盤整。

    3. 右邊出現對稱的帶大量長紅K線，低檔出現5星變盤的組合，股價反轉。5星變盤，最少有5天多方主控上漲。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_228_0.png)


    - 下跌到低檔，出現帶大量的長黑K線。

    - 連續19天變盤線的橫向盤整。

    - 右邊出現對稱上漲帶大量的長紅K線，低檔出現19星變盤的組合，股價反轉。19星變盤，最少有19天是多方主控上漲。變盤線越多，上漲的力道就越強。


    ### 低檔3根K線轉折向上的變化組合


    - 「晨星」變盤重點整理

    - 1. 下跌低檔出現的「晨星」組合，中間夾著「1顆星」（1根變盤線），轉折力道比較弱。

    - 2. 下跌低檔出現的「晨星」組合，同時爆大量，轉折的向上的機率大大提高，而且上漲的力道強。

    - 3. 下跌低檔出現的「晨星」組合，中間夾著的變盤線越多，對稱中長紅K線上漲時，多方控盤的時間也越長。例如下跌低檔出現中長黑K線，之後出現5根橫盤的變盤線，然後再出現1根對稱的中長紅K線上漲，完成「群星變盤」。多方有約5天時間主控，有至少5天時間在中長紅K線的低點之上。

    - 4. 下跌低檔出現中長黑K線，之後如隨即出現變盤線，就要觀察位置和成交量，評估出現「晨星」轉折的可能性，運用「費波係數」，注意變盤線第1、3、5、8、13、21日的K線轉折走勢。

    - 5. 「晨星」轉折的組合，如果上漲中長紅K線的最低點，被下跌的黑K線跌破，轉折向上的結構就會被破壞，向上多方的力道轉為向下由空方主控。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_230_0.png)


    > 資料來源：富邦e01電子交易系統


    - 1. 下跌出現帶大量的長黑K線。

    - 2. 連續3天變盤線的橫向盤整。

    - 3. 右邊出現對稱帶大量上漲的長紅K線，晨星變盤，多方主控，應該會反轉上漲。

    - 4. 長紅K線後股價該反彈而沒有反彈，第8天收盤跌破長紅K線的低點，「群星變盤」組合架構被破壞，轉為空方主控，行情反轉繼續空頭。


