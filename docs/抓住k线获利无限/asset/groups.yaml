    # 定義


    上漲行進中連續三根小紅黑K線下跌回檔或橫盤，然後出現一根長紅K線，把前面三根小紅黑K線均包含在長紅K線之內，這根長紅K線呈現吞噬的組合，稱為「三線反紅」，為回檔後的續攻訊號。在下跌行進中出現「三線反紅」的組合，為跌多的空頭回補或多方反攻的訊號。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_242_2.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_242_3.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_242_4.png)


    # 解說


    在下跌或橫盤連續出現小紅K線或小黑K線，表示空方下跌力道弱，多方1根上漲攻擊長紅K線就吞噬全部下跌或橫盤的小紅K線或小黑K線，為多方強力上漲或反彈的訊號。


    # 精通


    +   1. 「三線反紅」組合必須符合2個條件才成立：(1) 長紅K線收盤突破前面3根小紅K線或小黑K線的最高點；(2) 上漲長紅K線的成交量大於前面3根小紅K線或小黑K線的最高量。


