    2. 出現「母子變盤」組合，中長紅 K 線的最低點被跌破，向下反轉更加確認，如果同時出現大量或爆大量，反轉更明顯。

    3. 出現「母子變盤」組合，在多頭上漲趨勢中即將強力回檔，多單要出場。在空頭反彈時，將繼續下跌，要把握做空。


