    ### 第 6 篇 閃 光\n他想起那個雨夜，他記得，他記得，他記得，他記得。\n\n他想起那個雨夜，他記得，他記得，他記得，他記得。\n\n### 第 1\
    \ 章 為何會出現跳空缺口？\n一般來說，產生跳空缺口有以下5個原因：\n\n#### 原因1：反應國際盤的大漲或大跌\n例如2013年6月20日，美國聯準會（Fed）透露，要逐步讓量化寬鬆（QE）退場，結果第二天開盤出現跳空大跌120點的缺口（見下圖）。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_288_0.png)\n\n資料來源：富邦eO1 電子交易系統\n\n\
    #### 原因2：反應國家重大財經政策\n例如2013年6月26日，立法院三讀通過證所稅修正案，取消大盤8500點的課稅門檻，以及歇戶免徵的重大財經政策，這項利多，使得次日台股大盤上漲121點，出現向上的跳空缺口（見左頁圖）。\n\
    \n#### 原因3：個股突發的利多或利空\n例如2013年7月19日，國內財經報紙頭條新聞報導，台積電董事長張忠謀在法說會中，發表對2013年下半年展望保守的看法，而且還表態，2014年將會交棒執行長。結果台積電當天開盤就向下跳空，收盤跌停板，出現下殺的缺口（見下圖）。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_289_0.png)\n\n資料來源：富邦eO1 電子交易系統\n\n\
    #### 原因4：市場主力發動上攻或下殺\n由多方或空方主導的走勢，造成跳空。多頭或空頭確立之後的跳空缺口，往往是加速方向的訊息，在技術分析中很重要的是，要認識主力發動的缺口（見下圖）。\n\
    \n#### 原因5：個股除權息\n公司發放股息、股利當天造成的缺口是可預知的，不會影響技術分析，因此不列入討論範圍。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_290_0.png)\n\
    \n資料來源：富邦eO1 電子交易系統\n\n- 主力下殺的跳空缺口。\n- 主力向上做多的跳空缺口。\n\n### 多頭上漲的跳空缺口\n多頭由底部打底開始，一路往上到趨勢結束，行進中不同位置出現的向上跳空缺口，意義都不相同，藉著以下走勢圖分別說明多頭上漲的缺口。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_291_0.png)\n\n資料來源：富邦eO1 電子交易系統\n\n\
    1. 底部向上「突破缺口」：股價在低檔打底時，以強力往上跳空的方式直接突破前面高點，完成多頭架構，這種「突破缺口」意義重大：是主力宣告啟動強勢多頭。在底部連續5天上漲，出現3個向上缺口，也是上漲「連三紅」的攻擊型態，可以推測這是強勢多頭股票，此處屬於強力買進的訊號。\n\
    \n2. 盤整向上「突破缺口」：多頭起漲一段後盤整，股價以強力往上跳空的方式直接突破13天的K線盤整區，同時出現攻擊量，主力表態繼續上攻，要立刻買進做多。\n\
    \n3. 中繼「逃逸缺口」（測量缺口）：股價經過一段上升之後，在中途發生的跳空缺口稱為「逃逸缺口」或「測量缺口」。此處發生的向上缺口代表行情尚未結束，可粗略預測未來還會上漲約一倍距離，因此又稱為測量缺口。此處為多頭回檔後再上漲的第2天，主力再用放量缺口上攻，可見主力強力做多的企圖，股價還有一段漲幅。\n\
    \n4. 上漲到高檔，主力利用強力往上跳空的方式，讓股價繼續上攻。\n\n5. 多頭高檔「竭盡缺口」：股價經過大漲到達波段高點時出現跳空缺口，此時資金後續動能逐漸耗盡，是上漲行情將結束的訊號，此缺口稱為「向上竭盡缺口」，特徵是：\n\
    \   - 股價位於高檔的往上跳空缺口。\n   - 出現大量。\n   - 後續股價不漲或下跌，而且3天內向下回補缺口。上圖該位置出現股價連續急漲，3天2缺口，由於位置上漲到高檔，要特別注意爆大量、股價不漲或下跌的訊號。次日出現大量長黑K吞噬，這是轉折下跌的訊號，做多要出場。\n\
    \n6. 頭部向下「突破缺口」：股價在高檔反轉向下時，以強力往下跳空的方式直接跌破前面低點，這種向下「突破缺口」意義重大，是主力強力下殺的表態。\n\n7.\
    \ 左邊是上漲的「竭盡缺口」，右邊是向下的「突破缺口」，這樣的轉折組合型態稱為「島狀反轉」，反轉力道很強。\n\n### 空頭下跌的缺口\n空頭由頭部開始，一路往下到趨勢結束，行進中不同位置出現的向下跳空缺口，意義都不相同。藉著以下走勢圖分別說明空頭下跌的缺口。\n\
    \n### 第 6 章 為何會出現跳空缺口？\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_293_0.png)\n\n\
    資料來源：富邦eO1 電子交易系統\n\n- 頭部向下「突破缺口」：股價在高檔反轉向下時，以強力往下跳空的方式直接跌破前面低點，這種向下「突破缺口」意義重大，是主力強力下殺的表態。\n\
    - 左邊是上漲的「竭盡缺口」，右邊是向下的「突破缺口」，這樣的轉折組合型態稱為「島狀反轉」，反轉力道很強。\n- 空頭向下「突破缺口」，為強勢空頭。\n-\
    \ 中繼「逃逸缺口」（測量缺口）：股價經過一段下跌之後，在中途發生的「跳空缺口」稱為「逃逸缺口」或「測量缺口」。此處發生的向下缺口代表行情尚未結束，可粗略預測未來還會下跌約一倍距離，因此又稱為「測量缺口」。此處為空頭繼續下跌，主力再用下跌缺口下殺，可見主力強力做空的企圖，股價還有一段跌幅。\n\
    - 下跌到低檔，主力利用強力往下跳空的方式，讓股價繼續下跌。\n\n### 空頭低檔「竭盡缺口」\n股價經過大跌到達波段低點時出現跳空缺口，此時出現底部爆大量和買盤動能，是下跌行情將結束的訊號，所以此缺口稱為「向下竭盡缺口」，其特徵是：\n\
    - 股價在低檔的往下跳空缺口。\n- 出現大量。\n- 後續股價不跌或上漲，而且3天內向上回補缺口。上圖該位置出現股價連續急跌，3天2缺口，由於位置下跌到低檔，要特別注意爆大量股價不跌或上漲的訊號。次日出現止跌十字變盤線，這是轉折反彈的訊號，做空要回補。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_294_0.png)\n\n- 向下突破缺口\n- 向下突破缺口\n\
    - 向下逃逸缺口\n- 向上突破缺口\n- 向上逃逸缺口\n- 向上竭盡缺口\n\n### 第 1 章 為何會出現跳空缺口？\n#### 跳空缺口的觀察重點\n\
    想要了解跳空缺口，要注意以下幾個重點。\n\n#### 重點1：普通缺口\n又稱為「區域缺口」，經常出現在盤整區域，多因消息面影響或短期買賣不平衡而出現，很容易在一兩天就封閉，無法產生突破或助漲力道，對技術分析意義不大。\n\
    \n#### 重點2：突破缺口\n- 「向上突破」需要明顯的大量配合，而且成交量要持續增加，配合帶大量的向上跳空，通常不會回補。\n- 如果缺口在3天內跌回起漲點，是「假突破」。\n\
    - 突破開口越大，漲勢力道越強。\n- 「向下突破」不一定要有大成交量，無論有量或沒量都會下跌，此時要當機立斷，立刻退出股市或反手放空。\n\n#### 重點3：逃逸缺口\n\
    - 逃逸缺口的成交量不必然特別大，出現的次數比「普通缺口」和「突破缺口」少得多。\n- 在上升趨勢中出現「逃逸缺口」，這是市場強勢的表態，如果收盤價跌破缺口的下緣，代表上升趨勢轉弱；在下跌趨勢中，如出現往下的「逃逸缺口」，代表市場弱勢。\n\
    \n#### 重點4：竭盡缺口\n「竭盡缺口」代表狂升或狂跌的後段，此時投資人一窩風追高搶買，或極度悲觀殺出持股，造成的跳空情形，表示多或空的力道都剩下最後一口氣，此時靜待行情轉折，是另一波段的好機會。\n\
    \n#### 重點5：島狀反轉\n股價跳空向上後，股價表現出高檔無力現象，接著立即以向下跳空的方式下跌，圖形看上去左右各有缺口，中間高出的股價形成海上島嶼狀，故名「島狀反轉」。\n\
    \n一般而言，「島狀反轉」不常出現，一旦出現，在高檔會是大跌走勢的前兆，也是「必殺做空」的好機會。\n\n如果出現在底部的反轉，股價跳空向下後，接著在右邊出現向上跳空的缺口，圖形看上去左右都有缺口，是大漲的訊號，應把握「做多」的好機會。「島狀反轉」的結構可能只有一根K線就反轉，可能2、3天後反轉，也可能較多天的盤整後反轉，盤整日期越多，日後的行情越大。\n\
    \n### 第 6 章 為何會出現跳空缺口？\n### 第 1 章 為何會出現跳空缺口？\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_297_0.png)\n\
    \n1. 左邊下跌的跳空缺口，同時連續2日爆大量。\n2. 底部經過19天打底成底底高，右邊出現爆大量上漲的跳空缺口，底部形成「島狀反轉」的多頭結構，收盤21.1元，底部盤整日期越久，日後的行情越大。該股票之後的多頭趨勢上漲到48元才結束。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_298_0.png)\n\n缺口是強力向上或向下的表現，經常在關鍵位置出現，因此也是重要支撐或壓力的位置，同時可以觀察多空力道的變化。\n\
    \n#### 向上跳空缺口的支撐\n放量的向上跳空缺口是強力上漲的表現，因此日後回跌時是重要支撐。上漲時，出現放量的向上缺口，股價繼續上漲是正常走勢，當股價回跌時，要觀察形成缺口的幾個重要支撐位置，研判走勢的強弱是否改變。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_298_1.png)\n\n1. 「上高價」（缺口上漲後的紅K線最高點）是最強的支撐位置，收盤如跌破上高價（A），多頭氣勢轉弱。\n\
    2. 「上沿價」（缺口上漲後的紅K線最低點）是次強的支撐位置，收盤如跌破上沿價（B），股價跌入缺口，在缺口區間（C）容易形成多空拉鋸、上下震盪，如果缺口被空方回補，多頭向上缺口的強力上漲氣勢，會轉變成為一般的多頭。\n\
    \n### 第 2 章 缺口的支撐與壓力\n3. 「下沿價」（缺口上漲前的紅K線最高點）是較弱的支撐位置，收盤如跌破下沿價（D），股價跌破缺口，而且伸入缺口上漲前的紅K線的實體，多頭上漲的氣勢完全轉弱，要特別注意，「下底價」不能被跌破。\n\
    4. 「下底價」（缺口上漲前的紅K線最低點）是最弱的支撐位置，收盤如跌破下底價（E），股價跌破上漲前的紅K線實體最低點，多空易位，行情轉由空方主導。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_299_0.png)\n\n- ① 大量向上跳空缺口后，股价原本要上攻，但当日股价跌破上高价，多头转弱。\n\
    - ② 当日股价跌破上沿线，进入缺口，多空拉锯了3天，缺口已经被回补，不再是强势多头。\n- ③ 当日长黑K跌破下沿线，多头成为弱势。\n- ④ 当日大量长黑K，直接跌破下底线，多空易位，趋势反转成为空头。\n\
    \n### 向下跳空缺口的壓力\n放量的向下跳空缺口是強力下跌的表現，因此是日後反彈的重要壓力位置。下跌時，出現放量的向下缺口，股價繼續下跌是正常走勢，當股價回升時，要觀察形成缺口的幾個重要壓力位置，研判走勢的強弱是否改變。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_300_0.png)\n\n1. 「下底價」（缺口下跌後的黑K線最低點）是最強的壓力位置，收盤如突破下底價（A），空頭氣勢轉弱。\n\
    2. 「下沿價」（缺口下跌後的黑K線最高點）是次強的壓力位置，收盤如突破下沿價（B），股價進入缺口，在缺口的區間（C）容易多空拉鋸、上下震盪，如果缺口被多方回補，空頭向下缺口的強力下跌氣勢，會轉變成為一般的空頭走勢。\n\
    3. 「上沿價」（缺口下跌前的黑K線最低點）是較弱的壓力位置，收盤如突破上沿價（D），股價突破缺口，而且進入缺口上漲前的黑K線的實體，空頭下跌的氣勢完全轉弱，要特別注意，「上高價」不能被突破。\n\
    4. 「上高價」（缺口下跌前的黑K線最高點）是最弱的壓力位置，收盤如突破上高價（E），股價突破下跌前的黑K線實體的最高點，空多易位，行情轉由多方主導。\n\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_301_0.png)\n\n1. 向下跳空缺口後，股價原本要下跌，但是當日的股價突破底價，空頭轉弱。\n\
    2. 當天股價突破下沿價，進入缺口，多空拉鋸了3天，缺口已經被回補，不再是強勢空頭。\n3. 當天長紅K突破上沿價，成為弱勢空頭。\n4. 當天大量長紅K，直接突破上高價，空多易位，趨勢反轉成為多頭。\n\
    \n### 缺口的觀察指標\n觀察缺口時，應注意以下幾個現象：\n\n1. 缺口向上或向下的力量大於K線，所以缺口是強力向上或向下的表現，經常出現在關鍵位置，要特別注意之後的走勢。\n\
    2. 多方出現的缺口如有大量，而且是位於關鍵突破位置，特別重要，這是主力強力向上的表態。\n3. 無量向上的缺口，日後回測時支撐弱，因此無量的漲停板缺口，日後反轉下跌時，多無支撐，很容易跌停板下殺。\n\
    4. 空方缺口不一定有大量，缺口越大，下跌訊號越明顯，向下突破缺口如很大，經常就是多頭的結束。\n5. 股價進入有量的缺口時會多空交戰，股價容易忽漲忽跌及振幅加大。\n\
    6. 高檔出現的缺口越大，越要小心是竭盡缺口。竭盡缺口形成的前後幾天會出現大量，後續出現量縮的小幅價漲、價平或價跌，都顯示後繼無力。\n7. 向上或向下出現缺口，次日股價不續攻或續跌，要小心觀察，3日內是否回補缺口，造成多空反轉。\n\
    8. 行情持續中有時會出現許多缺口，並非一定按照突破缺口、逃逸缺口、竭盡缺口的順序發生，通常要觀察價量的發展。\n9. 由缺口的位置、成交量及次日表現，可以判斷股票的強弱。\n\
    \n### 第 2 章 缺口的支撐與壓力\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_303_0.png)\n\n\
    無量上漲的連續跳空漲停板。\n股價在高檔爆出大量之後，股價反轉下跌時多無支撐，千萬不能逢低接股票。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_304_0.png)\n\
    \n### 缺口操作5大秘訣\n熟悉以下操作秘訣，就能懂得運用缺口，正確掌握多空趨勢。\n\n#### 秘訣1：缺口之上見長紅\n- 缺口之上見長紅，必有漲幅，拉回做多。向上跳空缺口出現長紅，是多頭強力的表現，股價只要回跌破不缺口「上沿價」，以做多方向為主，拉回做多。\n\
    - 缺口之上見長紅，後續在長紅½價之上、收盤價之下高處橫盤，是強勢整理，隨時都會上漲。\n- 缺口之上見長紅，後續在長紅收盤價之上橫盤，是強勢整理，注意發動上漲時可以追進。\n\
    - 高處強勢橫盤整理時，最容易發動的時間在橫盤的第1、3、5、8、13日的當日或次日。\n\n### 第 2 章 缺口的支撐與壓力\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_305_0.png)\n\
    \n- ③ 主力打底完成當天，用大量向上跳空長紅，突破前面最高點。\n- ④ 後續股價維持在長紅收盤價之上，橫盤8天，為強勢整理。\n- ⑤ 整理完成，第9天，主力再以大量長紅K線，突破盤整，股價繼續上漲。\n\
    \n#### 秘訣2：缺口之下見長黑\n- ⑥ 缺口之下見長黑，必有跌幅，反彈做空。向下跳空缺口出現長黑，是空頭強力的表現，股價只要反彈不破缺口「下沿價」，以做空方向為主，反彈做空。\n\
    - ⑦ 缺口之下見長黑，後續在長黑½價之下、收盤價之上低處橫盤，是弱勢整理，隨時都會下跌。\n- ⑧ 缺口之下見長黑，後續在長黑收盤價之下橫盤，是弱勢整理，注意發動下跌時可以追空。\n\
    \n低處弱勢橫盤整理時，最容易發動的時間在橫盤的第1、3、5、8、13日的當日或次日。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_306_0.png)\n\
    \n1. 高檔大量向上跳空缺口。\n2. 第2日缺口回補，多頭轉弱。\n3. 大量長黑K線，跌破上漲長紅K線最低點，多空易位。\n4. 向下跳空缺口見長黑。\n\
    5. 連續3日在長黑收盤下面盤整，隨時都會下跌。\n6. 大量長黑K線，跌破橫盤，股價繼續下跌。\n7. 向下跳空缺口見長黑。\n8. 連續7日在長黑收盤下面盤整，隨時都會下跌。\n\
    9. 大量長黑K線，跌破橫盤，股價繼續下跌。\n"
