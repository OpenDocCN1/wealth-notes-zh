    - 高檔出現蜻蜓線，次日開高走低：化解下跌疑慮。\n\n## 第8章 T字線、墓碑線、十字線、一字線\n\n### 定義\nT字線：開盤價與收盤價相同，沒有實體棒，盤中下跌到最低點，最後收盤拉到開盤價。\n\
    \n墓碑線：也稱為倒T字線，開盤價與收盤價相同，沒有實體棒，盤中上漲到最高點，最後收盤拉回到開盤價。\n\n### 解說\n在高檔，T字線與墓碑線都是轉折向下的重要訊號。T字線代表多方開盤後就一路下跌，雖然收盤時拉回到開盤價，顯示多方已經無法上漲，盤中出現空方下殺的力量。墓碑線代表開盤多方一度上漲，但是遭到很大的壓力，當天股價漲勢受阻，最後回到開盤價。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_133_0.png)\n\n在低檔，T字線與墓碑線都是轉折向上的重要訊號。\n\
