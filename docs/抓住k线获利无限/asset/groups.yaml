    # 第4章 K線的基礎理論


    ## 低檔2根K線轉折向上的基本型態


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_177_0.png)


    ## 左長黑右長紅


    ### 定義


    左邊下跌幅度達2.5%以上中長黑K線，右邊上漲幅度達2.5%以上中長紅K線，2根K線構成下跌低點或底部反轉向上型態，2根K線必須為中長的實體，可以有小的上下影線。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_177_1.png)


    ### 解說


    走勢下跌中，昨天是長黑K線，但今天收盤卻是一根並肩的長紅K線，很明顯的，昨天空方強力下跌的力量，今天被多方完全克服。這是股價下跌轉折向上的一組K線基本型態。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_177_2.png)


    ### 精通


    - 1. 下跌在低檔，是一組轉折向上的訊號（次頁圖1）。

    - 2. 在多頭起攻的位置，要提高警覺，小心是騙線，主力假下跌，真上漲，投資人不可不察（圖2）。

    - 3. 在多頭走勢中，是回撤結束訊號（圖3）。

    - 4. 出現在盤整區，表示主力還沒有下殺的企圖。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_178_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_178_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_178_2.png)


    - 1. 下跌到低檔，爆大量後出現長黑，再出現並肩長紅K線，是轉向向上訊號。

    - 2. 次日上漲，收盤突破並肩2根K線最高點，行情反轉。


