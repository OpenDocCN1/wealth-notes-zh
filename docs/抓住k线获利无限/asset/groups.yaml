    台東與台北來回跑的一年多學習期間都沒進場。她為「自己」定好目標，並有不畏艱辛、堅持學習的精神，將來一定是個成功的操盤手。


    # 自助、人助、天助


    學習股票操作，想成為長期的贏家，必須要有下面3個助力：


    # 1. 自助


    首先必須自己付出血力，有計劃地學習，除了充實專業知識，也要花時間做功課，這些一定得靠自己下定決心去完成。從起心動念到計畫行動，這是自助的功力。


    # 2. 人助


    在努力學習的過程中，要有好老師指導、好朋友支持鼓勵和相互切磋，許多事都需要他人的幫助，所以建立良好的人際關係非常重要。吸取別人的經驗，可以縮短自己摸索的時間。只要你展現誠心、熱誠和企圖心去請教別人，自然就會出現貴人相助。


    # 3. 天助


    人人都想發財，到財神廟拜拜，無非是想得到財神爺的眷顧。問題是，拜的人有沒有想過，財神爺為什麼要眷顧你呢？是因為你平日行善積德，還是努力付出呢？只拜財神爺絕對不夠，要自己付出，才可能達成目標。俗話說得好：「天下沒有白吃的午餐。」經過自助的努力，別人的相助，存善心、做善事，自然會出現神助的力量。只有從自己改變，一切才可能改變。


    每個來課堂學習的同學，都跨出了自助的第一步。在課堂結識同好，向高手請教，就能獲得人助。堅持目標，努力學習，自得神助。祝福所有投資人，都能心想事成，美夢成真。'
