    # 第3章 高檔2根K線轉折向下的變化組合


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_167_0.png)


    快速上漲到高檔，前一日出現帶大量長紅K線，當天出現母子價抱十字線，是強烈轉折向下訊號，次日開高走低，行情快速反轉。


    ## 主力出貨：高檔「負黑吞噬」雙K線


    ### 定義


    上漲走勢到高檔，出現長黑K線，把前一日上漲的紅K完全包覆。黑K線的實體完全吞噬前一根紅K線的實體。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_167_1.png)


    ### 解說


    上漲走勢到明顯高檔，出現轉折向下的吞噬黑K線，表示當日開高走低，收盤跌破前一日最低點，賣壓出籠，多空主控權產生易位，是雙K線轉折向下5個組合中反轉最強的訊號。


    ### 精通


    - 1. 被吞噬的紅K線越小，吞噬的黑K線越長，轉折的力道越強。

    - 2. 吞噬當日或前一日出現大量，反轉訊號越強，轉折向下機率越高。

    - 3. 短線連續上漲或急漲，獲利達15%以上，出現長黑吞噬的K線，一日反轉的機率很高，持有多單應該出場或者減碼一半賣出。

    - 4. 一根黑K線，一次吞噬就跌破前面2~3根K線的最低點，反轉越強（也稱為3線反黑）。

    - 5. 高檔出現爆量長黑吞噬K線後下跌，要特別注意，日後再上漲到長黑吞噬的K線，會形成重大的壓力。換句話說，再上漲是多單逃命波，不可追多，這時容易形成「頭頭低」的頭部型態。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_168_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_168_1.png)


