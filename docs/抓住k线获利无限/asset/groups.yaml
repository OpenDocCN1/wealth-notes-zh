    # 第 3 篇


    ## 第 4 章 低檔 2 根 K 線轉折向上的變化組合


    ### 低檔 2 根 K 線轉折向上的變化組合


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_190_0.png)


    - 下跌到低檔，長黑後的母子懷抱，為反彈訊號。

    - 開盤跳空向上，突破長黑 K 線最高點，反轉確認。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_191_0.png)


    資料來源：富邦 eQ 電子交易系統


    - 下跌到低檔，長黑後的母子懷抱，為反彈訊號。

    - 次日開盤向上，突破長黑 K 線最高點，反轉確認。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_192_0.png)


    資料來源：富邦 eQ 電子交易系統


    - 下跌到低檔，長黑後的母子懷抱十字，為強力反彈訊號。

    - 次日開盤向上跳空漲停板，量縮惜售，反轉確認。


    ### 主力的吸貨：低檔「長紅吞噬」雙 K 線


    **定義**


    下跌走勢到低檔，出現長紅 K 線，把前一日下跌的黑 K 完全包覆，紅 K 線的實體完全吞噬前一根黑 K 線的實體。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_193_0.png)


    **解說**


    下跌走勢到明顯低檔，出現轉折向上的吞噬紅 K 線，表示當日開低走高，收盤突破前一日最高點，多方買盤出籠，多空主控制產生易位。長紅吞噬是 5 組向上雙 K 線轉折訊號最強的組合，空單要立刻回補。


    **精通**


    1. 被吞噬的黑 K 線越小，吞噬的紅 K 線越長，轉折的力道越強。

    2. 吞噬當日或前一日出現大量或窒息量，反轉訊號越強，轉折向上機率越高。要分辨走勢是多頭的回檔再上漲，還是空頭跌深的反彈。

    3. 一根紅 K 線，一次吞噬就突破前面下跌的 2~3 根黑 K 線的最高點，反轉越強（也稱為 3 線反紅）。

    4. 長期下跌的低檔或急跌的下方出現爆量，長紅吞噬 K 線，一日反轉機率很高，持有空單應立刻回補。

    5. 低檔出現爆量長紅吞噬 K 線後上漲反彈一段，要特別注意，日後再下跌，長紅吞噬的 K 線會形成重大的支撐。換句話說，再下跌是空單的逃命波，不可追空，這時容易形成「底底高」的底部型態。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_193_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_194_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_194_1.png)


    - 空頭下跌出現放量長紅 K 線吞噬，為止跌向上反彈的 K 線訊號。

    - 出現放量長紅 K 線吞噬反彈後，容易做底底高的多頭底部。

    - 要掌握多頭確認的向上攻擊紅 K 做多買進。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_195_0.png)


    資料來源：富邦 eQ 電子交易系統


    - ① 空頭下跌出現放量長紅 K 線吞噬，一根長紅 K 線吞噬 10 根下跌 K 線，是強力止跌向上反彈的訊號。

    - ② 再次出現放量長紅 K 線的多頭確認向上攻擊紅 K，做多買進。


    步瀛 (6282) 日線圖 2013/10/09 開 29.60 高 31.00 低 29.60 收 30.20 元 益 7814 張 0.00 (0.00%)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_196_0.png)


    資料來源：富邦 eGO 電子交易系統


    - 下跌到低檔，出現長紅吞噬，沒有攻擊量，為弱勢反彈訊號。

    - 再次出現長紅吞噬，量未放大，仍為弱勢反彈訊號。

    - 開盤向上突破吞噬長紅 K 線最高點，同時出現明顯攻擊大量，反轉確認。


    ### 一路向上：低檔「長紅貫穿」雙 K 線


    **定義**


    下跌走勢到低檔，出現長紅 K 線，開盤即上漲，收盤突破前一日中長黑 K 的實體高點。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_197_0.png)


    **解說**


    下跌走勢到明顯低檔，出現轉折向上的貫穿紅 K 線，表示當日開高走高，收盤突破前一日黑 K 最高點，多方當天向上貫穿，多空主控權產生易位，如果配合大量，容易一日反轉。


    **精通**


    1. 貫穿的紅 K 線越長，轉折的力度越強。

    2. 貫穿當日或前一日出現大量，反轉訊號越強，轉折向上機率越高。

    3. 短線連續下跌或急跌，幅度達 15% 以上，出現長紅貫穿的 K 線，一日反轉的機率很高，持有空單應該立刻回補。

    4. 一根紅 K 線，一次貫穿就突破前面 2~3 根 K 線的最高點（也稱為 3 線反紅），反轉越強。

    5. 低檔出現爆量長紅貫穿 K 線後反彈，要特別注意，日後再下跌到長紅貫穿的 K 線，會形成重大的支撐。換句話說，再下跌是空軍逃命波，不可追空，這時容易形成「底底高」的底部型態。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_197_1.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_198_0.png)


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_198_1.png)


    - 下跌到低檔，出現長紅貫穿，同時出現攻擊量，為反彈訊號。

    - 再次出現大量長紅上攻，反轉確認。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_199_0.png)


    資料來源：富邦 eQ 電子交易系統


    - 下跌到低檔，出現長紅貫穿，爆大量，收盤突破前 3 根黑 K 線最高點，形成 3 線反紅的強力反彈訊號。

    - 反彈再下跌是空頭逃命波，出現大量長紅的底底高，容易盤整打底。


    # 第 4 篇


    ## 第 1 章 高檔 3 根 K 線轉折向下的基本型態


    **定義**


    左邊 1 根上漲的中長紅 K 線，中間 1 根變盤線，右邊 1 根下跌的中長黑 K 線，由 3 根 K 線構成上漲到高點的反轉向下基本型態。通常中間的變盤線稱為「星」，轉折向下的組合型態稱為「夜星」。


    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_202_0.png)


    **解說**


    走勢上漲到高檔的長紅 K 線，次日收盤出現多空對決的變盤線，再出現一根下跌的長黑 K 線，很明顯的，昨天對決之後，空方戰勝，原來向上的多方主控，現在轉為向下的空方主控。夜星轉折是股價上漲轉折向下的
    K 線基本型態。


    **精通**


    1. 多頭上漲在高檔，是轉折向下的訊號，股價要回檔。

    2. 空頭反彈出現「夜星」，反彈結束，股價繼續下跌。


