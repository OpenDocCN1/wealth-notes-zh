  md: "\n## 定義\n開盤與收盤上下幅度在2.5%以下的實體小紅K線和小黑K線。\n\n## 解說\n小紅K線表示當天多頭略強，小黑K線表示當天空頭略強。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_82_0.png)\n\n## 精通\n- 在多頭上漲行進中，小紅K線或小黑K線可以視為行進的休息，當天多空雙方都沒有太大的企圖拉或殺股票。\n\
    \n在底部打底、頭部盤頭或一般盤整時的小紅K線或小黑K線，表示沒有什麼波動，股價還要盤整，觀察即可。\n\n多頭連續小紅K線上漲，稱為「碎步上漲」，股價看漲，近日容易出現一根中長紅K線。\n\
    \n空頭連續小黑K線下跌，稱為「碎步下跌」，股價看跌，近日容易出現一根中長黑K線。\n\nK線橫盤時也經常出現小紅K線或小黑K線，應靜待橫盤結束後的突破或跌破再動作。\n\
    \n在關鍵位置，例如盤整結束後的突破或跌破、壓力的突破或支撐的跌破、多頭回檔後再上漲、空頭反彈後再下跌，如果出現小紅K線或小黑K線，力道不足，需要再確認較佳。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_82_1.png)\n\n### 中紅和中黑、小紅和小黑K線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_83_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 空頭下跌連續出現小黑K線，稱為「碎步下跌」。\n- 「碎步下跌」容易出現大跌。\n\n## 第3章 含上影線的中長紅和中長黑K線\n\
    \n### 定義\n紅K線實體達2.5%以上，上方留有上影線，但上影線不能大於實體。\n\n### 解說\n在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到含上影線的長紅K線或中紅K線。就單一K線而言，當天是多方強，在多方向上時遇到了賣壓，股價會由最高點拉回。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_84_0.png)\n\n### 精通\n1. 含上影線的長紅K線或中紅K線，即所謂的「線不實」，多方無法把股價收在最高點，被空方壓回而留上影線。\n\
    2. 在盤整區出現含上影線的長紅K線或中紅K線，表示向上有壓力，可能還要整理。\n3. 在多頭走勢的關鍵位置，例如盤整突破、壓力突破、多頭回檔後再上漲，如果出現含上影線的長紅K或中紅K線，要看紅K收盤的股價有否突破，如果只是上影線突破，收盤價沒有突破，容易是假突破，次日股價必須開高往上，否則容易遇壓拉回。\n\
    4. 多頭上漲的第2或第3根K線，如果出現含上影線的長紅K線或中紅K線，表示漲多後出現獲利賣壓，操作應以個人紀律執行。\n5. 多頭上漲到高檔，出現含上影線的長紅K線或中紅K線，如果爆大量，表示主力拉高出貨，日後股價如不漲或下跌，是回檔的訊號。\n\
    6. 空頭走勢下跌時，反彈出現含上影線的長紅K線或中紅K線，表示反彈遇到賣壓，容易反彈結束。\n7. 空頭走勢下跌到低檔，出現含上影線的長紅K或中紅K線，代表止跌訊號，注意次日的K線發展。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_86_0.png)\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_86_1.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n1. 當天出現帶大量及含上影線中紅K線，主力拉高出貨。\n2. 高檔再出現帶大量及含上影線中紅K線，主力拉高出貨。\n\
    3. 股價不漲，跌破盤整，行情走空。\n\n## 第 2 篇\n### 第 3 章 含上影線的中長紅和中長黑K線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_87_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n1. 底部打底完成放量上漲。\n2. 遇到前面高點A的壓力，當天出現含上影線中紅K線，表示有賣壓。上影線最高點雖然突破前面高點A，但收盤價沒有突破前面高點A，同時量縮，後面還要再回檔整理。\n\
    \n### 含上影線的長黑K線或中黑K線\n#### 定義\n黑K線實體達2.5%以上，上方留有上影線，但上影線不能大於實體。\n\n#### 解說\n在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到含上影線的長黑K線或中黑K線。就單一K線而言，當天是空方強，開盤後股價一度上漲，但空方力道強，股價一路下跌到最低點收盤。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_88_0.png)\n\n#### 精通\n1. 含上影線的長黑K線或中黑K線，無論在多頭或空頭，都是相當弱勢的表現，要注意多頭可能止漲，空頭還會續跌。\n\
    2. 在盤整區出現含上影線的長黑K線或中黑K線，表示向上有壓力，可能還要整理。\n3. 在空頭走勢的關鍵位置，例如盤整跌破、支撐的跌破、空頭反彈後再下跌，如果出現含上影線的長黑K線或中黑K線，只要收盤價跌破，即可確認。\n\
    4. 連續下跌時，出現含上影線的長黑K線或中黑K線，之後股價不跌或向上，配合大量過黑K線上影線最高點，行情變成反轉向。\n\n## 第 2 篇\n### 第\
    \ 3 章 含上影線的中長紅和中長黑K線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_89_0.png)\n\n1.\
    \ 連續下跌出現放量的含上影線的長黑K線，次2日出現小十字變盤線，股價不再下跌。\n2. 放量的長紅K線，收盤突破含上影線長黑K線的最高點，行情反轉，由空轉多。\n\
    3. 高檔爆量長紅K線，次日股價不漲，次二日出現含上影線的長黑K線。\n4. 含上影線的中黑K線，跌破含上影線長黑K線的低點，行情反轉，由多轉空。\n\n\
    ## 第4章 含下影線的中長紅和中長黑K線\n\n### 定義\n紅K線實體達2.5%以上，下方留有下影線，但下影線不能大於實體。\n\n### 解說\n\
    在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到含下影線的長紅K線或中紅K線。就單一K線而言，當天是多方強，開盤後曾經跌破平盤下殺，但多方最後拉升到最高點收盤。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_90_0.png)\n\n### 精通\n1. 含下影線的長紅K線或中紅K線，在多頭表示繼續上漲，但在高檔，要注意爆大量股價不漲或下跌的訊號。\n\
    2. 在多頭走勢的關鍵位置，例如盤整突破、壓力的突破、多頭回檔後再上漲，如果出现大量及含下影線的長紅K線或中紅K線，是上漲攻擊的訊號。\n3. 空頭走勢中，出現帶大量及含下影線的長紅K線或中紅K線，可能只是止跌或反彈的訊號，小心是誘多的紅K，不是做多的買點。\n\
    4. 連續下跌中遇到支撐，出現含下影線的長紅K線或中紅K線，是有支撐的訊號，注意次日開盤的走勢，如果開高向上，則支撐確認。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_91_0.png)\n\
    \n資料來源：富邦GOI電子交易系統\n\n連續下跌到低檔，出現放量及含下影線的中紅K線，是有支撐的訊號，注意後續走勢，如果向上，則支撐確認。\n\n###\
    \ 含下影線的長黑K線或中黑K線\n#### 定義\n黑K線實體達2.5%以上，下方留有下影線，但下影線不能大於實體。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_92_0.png)\n\
    \n#### 解說\n在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可看到含下影線的長黑K線或中黑K線。就單一K線而言，當天是空方強，開盤就是最高點，一路下跌，但下面有多方抵抗的力量，拉升到收盤價，留下了下影線。\n\
    \n#### 精通\n1. 含下影線的長黑K線或中黑K線，在多頭是止漲的訊號，在高檔爆大量，股價容易出現一日反轉。\n2. 在空頭走勢的關鍵位置，例如盤整跌破、支撐的跌破、空頭反彈後再下跌，如果出現帶大量及含下影線的長黑K線或中黑K線，是繼續下跌的訊號。\n\
    3. 下跌到支撐位置或空頭低檔，出現帶大量及含下影線的長黑K線或中黑K線，表示當天跌深後有多單進場拉抬，注意次日股價是否止跌或回升。\n4. 下跌中遇到支撐，出現含下影線的長黑K線或中黑K線，如果收盤價沒有跌破支撐，只是下影線跌破，不是真跌破，次日要再確認。\n\
    5. 下跌中連續出現含下影線的紅K或黑K線，表示主力殺低吸貨，要注意後面止跌反轉的訊號。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_93_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n多頭回檔出現含下影線的中黑K線，盤中最低點跌破前面K線的橫盤下頸線，但收盤價格沒有跌破，不是真跌破。後續股價一直没跌破前面K線的橫盤下頸線，多頭維持繼續上漲。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_94_0.png)\n\n資料來源：富邦e01電子交易系統\n\n-\
    \ 下跌中連續出現含下影線的中黑K線，同時出大量，主力殺低吸貨，容易止跌回升。\n- 多頭回檔遇到支撐，接近月線出現含下影線的中黑K線，同時爆出大量，是止跌訊號，次日開高走高，多頭繼續上漲。\n\
    \n## 第 2 篇\n### 第5章 錘子線、吊人線、倒錘線\n#### 錘子線、吊人線、倒錘線\n##### 錘子線和吊人線：錘子不能掛在小圓圈K線\n\
    \n###### 定義\n下影線很長，至少是實體2倍以上。小的實體在上方，實體是紅K或黑K。相同的線型，不分紅K或黑K，實體在上漲走勢的頂端稱為「吊人線」，在下跌走勢的低點稱為「錘子線」。\n\
    \n###### 解說\n沒有上影線，如有必須很小。在高檔，代表多方向上漲勢受阻，盤中跌破開盤，最後的收盤接近開盤價。在低檔，代表空方有止跌現象，下跌到最低點出現向上拉的多方力量，最後收盤拉到接近開盤價。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_95_0.png)\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_96_0.png)\n\
    \n###### 精通\n1. 強勢上漲到高點，出現吊人線，以當天情況來看，開盤在高點，接著出現賣壓，最後再拉到最接近最高價做收，可確認當天經過下殺的洗盤換手或者是主力出貨後再往上拉來誘多。要確認主力是否出貨，次日的走勢非常重要。次日出現以下情況，都是主力出貨，這樣的上漲走勢就會改變，甚至變成上漲架構的瓦解。\n\
    \   - 次日開盤向下跌空大跌，多頭上漲架構瓦解的可能性大大提高，容易一日反轉或做頭。\n   - 次日開低向下，或開高走低，收盤跌破吊人線的實體下沿，轉折向下的可能性大增，多單要考慮準備出場。\n\
    \   - 在高檔，吊人線當天或前一兩天爆出大量，次日開低向下，或開高走低，幾乎可以確定昨日是主力出貨。\n   - 高檔連續出現2～3根吊人線或搭配其他下殺的K線訊號（如高檔長黑、變盤線、出大量開高走低下跌黑K等），轉折向下的機率高。\n\
    \n2. 強勢下跌到低點，出現錘子線，以当天的情況來看，開盤在高點，接著出現賣壓，盤中到達最低點後，多頭反攻，往上再拉到最高價或接近開盤價做收，可以確認當天經過原先空頭走勢的下跌，然後有一些多方力量介入，要確認多頭是否反攻成功，次日的走勢非常重要。次日出現以下情況，都是先下跌後多方反攻，下跌走勢可能改變，甚至是空頭架構被破壞，成為向上回升的訊號。\n\
    \   - 次日開盤向上跳空大漲，空頭結構瓦解的可能性大大提高，容易一日反轉或打底。\n   - 次日開高走高或開低向上，收盤突破錘子線實體的上沿，轉折向上的可能性大增，空單要考慮出場。\n\
    \   - 在低檔，錘子線當天或前一兩天爆出大量，或者當天出現窒息量，次日開高向上，幾乎可以確定是轉折向上反彈。\n   - 下跌到低檔或重要支撐位置，出現錘子線，也可視為向下打樁的長釘，如果連續出現2～3根的錘子，打樁的型態越加明顯，容易形成止跌回升或強力反彈。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_97_0.png)\n\n資料來源：富邦e01電子交易系統\n\n-\
    \ 高檔帶大量吊人線，次日向下跳空下跌，整個多頭架構改變。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_98_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n1. 前一日高檔大量長紅，當日該上攻沒有上漲，出現吊人線，要特別注意不能跌破吊人線實體下沿，否則可能是假突破、真下跌。次日跳空下跌長黑，轉成空頭。\n\
    2. 低點出現鉗子，實體上沿被突破，整個空頭架構改變。\n\n## 第 2 章 鏈子線、吊人線、倒鏈線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_99_0.png)\n\
    \n1. 上漲到高檔，連續出現2天的吊人線，是主力在誘多，不能買進，要特別注意次日不能開低盤。\n2. 連續上漲出現價量背離，隨時都會轉折下跌。\n3. 次日跳空下跌，不僅會下跌，而且整個多頭架構都會改變。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_100_0.png)\n\n1. 上漲到高檔，連續出現3天的吊人線，是主力在誘多，不能買進，要特別注意次日不能開低盤。\n\
    2. 開低盤，收盤跌破吊人線的實體下沿，轉折下跌。\n3. 跳空下跌，不僅會下跌，而且整個多頭架構都會被破壞。\n\n## 第 2 篇 鉗子線、吊人線、倒鉗線\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_101_0.png)\n\n資料來源：富邦e01電子交易系統\n\n1.\
    \ 上漲到高檔，前一日為大量長紅，今日沒有繼續上攻，出現黑K吊人線，是轉折向下訊號，要特別注意次日不能開低盤，或者收盤跌破吊人線的實體下沿。\n2. 連續3天都在吊人線的實體下方收變盤線，第4天往下跌，整個多頭架構都容易改變。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_102_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    1. 高檔連續出現吊人線，是轉折向下訊號，要特別注意。\n2. 長黑K跌破吊人線的實體下方，開始做頭。\n3. 高檔再次出現吊人線，次日向下跌空，形成三尊頭，而且頭頭低，空頭架構即將形成。\n\
    \n## 第 2 篇 鎧子線、吊人線、倒鎧線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_103_0.png)\n\n\
    資料來源：富邦e01電子交易系統\n\n1. 下跌到低檔，出現鎧子線，前一日為大量中紅止跌，是轉折向上訊號，要特別注意次日，如果開高盤向上，確定轉折向上。\n\
    2. 次日開高走，整個空頭架構改變。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_104_0.png)\n\n\
    資料來源：富邦Q1電子交易系統\n\n1. 下跌到低檔盤整，出現錘子線，是轉折向上訊號，要特別注意次日，如果開高盤向上，確定轉折向上。\n2. 次日開高走高，整個空頭架構改變。\n\
    \n## 第2篇 繩子線、吊人線、倒鉗線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_105_0.png)\n\n\
    1. 下跌到低檔，出現繩子線，是轉折向上訊號，次日再出現小十字線的變盤線，注意轉折向上的訊號。\n2. 當天開高走高，長紅突破前3日K線最高點，整個空頭架構改變。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_106_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n\
    - 上漲到高檔，出現爆量含下影線長黑K線，是轉折向下訊號，次日若開低股價，容易一日轉折向下。\n- 高檔出現帶大量吊人線，要注意次日開盤走勢。\n- 當天出現開低走低長黑K線，股價將反轉。\n\
    - 低檔連續兩天出現錘子線，注意股價是否止跌回升。\n- 股價止跌，再出現錘子線。\n- 連續3天股價都突破錘子線實體上沿，空頭反轉確認。\n\n## 第\
    \ 2 章\n### 鏈子線、吊子線、倒鏈線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_107_0.png)\n\n\
    資料來源：富邦e01電子交易系統\n\n1. 下跌到低檔出現鏈子線，是轉折向上訊號。\n2. 低檔第2次出現鏈子線，注意可能是雙腳打樁，後續股價向上，空頭底部呈現底底高，容易反轉成為多頭。\n\
    3. 大量突破前面最高點，多頭確認。\n\n## 定義\n上影線很長，至少是實體的2倍以上。小的實體在下方，實體可以是紅K或黑K。\n\n## 解說\n在多頭上漲或反彈走勢中出現倒錘線，是容易轉折向下變盤的訊號。在下跌走勢或多頭回檔出現倒錘線，是容易轉折向上變盤的訊號。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_108_0.png)\n\n## 精通\n出現倒錘線，一定要用第二天的K線來確認，否則在上漲中只能解讀為遇到大壓力，在下跌中只能解讀為出現上攻力量。從次日開盤走勢，可以看出是往上還是往下轉折。\n\
    \n在多頭上漲出現倒錘線：\n1. 次日開低向下，收盤低於倒錘線實體下沿，可確認為轉折向下。如倒錘線當天或前1、2日出現大量，更可確認為反轉。\n2. 連續出現2根倒錘線，其中出現爆大量，或者第2根倒錘線跳空向下，更能確定走勢是反轉走跌。\n\
    3. 出現2根倒錘線，即使次日再上漲，高點也不會太多，謹放假過高、真拉回。\n4. 出現2根倒錘線，第2根倒錘線最低點被跌破時，多單要出。\n5. 多頭高檔時，K線頻頻出現倒錘線，表示上檔買壓重，要注意股價不漲或回跌。\n\
    6. 上漲遇到重要壓力位置，出現倒錘線，表示賣壓出現，要注意次日股價開低容易折返。\n7. 多頭上漲時，倒錘線突破前面高點、盤整末端突破上顯線，要確認上漲是否衝破重要壓力，觀察重點如下：\n\
    \   - 只有倒錘線上影線突破，但實體沒有突破，不能視為有效突破，容易成為假突破，要注意後面幾天走勢。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_109_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 高檔出現2次倒錘線，這是轉折向下訊號，次日跌破倒錘線實體下沿，確定轉折向下。\n"
  mdcn: "\n## 定義\n開盤與收盤上下幅度在2.5%以下的實體小紅K線和小黑K線。\n\n## 解說\n小紅K線表示當天多頭略強，小黑K線表示當天空頭略強。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_82_0.png)\n\n## 精通\n- 在多頭上漲行進中，小紅K線或小黑K線可以視為行進的休息，當天多空雙方都沒有太大的企圖拉或殺股票。\n\
    \n在底部打底、頭部盤頭或一般盤整時的小紅K線或小黑K線，表示沒有什麼波動，股價還要盤整，觀察即可。\n\n多頭連續小紅K線上漲，稱為「碎步上漲」，股價看漲，近日容易出現一根中長紅K線。\n\
    \n空頭連續小黑K線下跌，稱為「碎步下跌」，股價看跌，近日容易出現一根中長黑K線。\n\nK線橫盤時也經常出現小紅K線或小黑K線，應靜待橫盤結束後的突破或跌破再動作。\n\
    \n在關鍵位置，例如盤整結束後的突破或跌破、壓力的突破或支撐的跌破、多頭回檔後再上漲、空頭反彈後再下跌，如果出現小紅K線或小黑K線，力道不足，需要再確認較佳。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_82_1.png)\n\n### 中紅和中黑、小紅和小黑K線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_83_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 空頭下跌連續出現小黑K線，稱為「碎步下跌」。\n- 「碎步下跌」容易出現大跌。\n\n## 第3章 含上影線的中長紅和中長黑K線\n\
    \n### 定義\n紅K線實體達2.5%以上，上方留有上影線，但上影線不能大於實體。\n\n### 解說\n在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到含上影線的長紅K線或中紅K線。就單一K線而言，當天是多方強，在多方向上時遇到了賣壓，股價會由最高點拉回。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_84_0.png)\n\n### 精通\n1. 含上影線的長紅K線或中紅K線，即所謂的「線不實」，多方無法把股價收在最高點，被空方壓回而留上影線。\n\
    2. 在盤整區出現含上影線的長紅K線或中紅K線，表示向上有壓力，可能還要整理。\n3. 在多頭走勢的關鍵位置，例如盤整突破、壓力突破、多頭回檔後再上漲，如果出現含上影線的長紅K或中紅K線，要看紅K收盤的股價有否突破，如果只是上影線突破，收盤價沒有突破，容易是假突破，次日股價必須開高往上，否則容易遇壓拉回。\n\
    4. 多頭上漲的第2或第3根K線，如果出現含上影線的長紅K線或中紅K線，表示漲多後出現獲利賣壓，操作應以個人紀律執行。\n5. 多頭上漲到高檔，出現含上影線的長紅K線或中紅K線，如果爆大量，表示主力拉高出貨，日後股價如不漲或下跌，是回檔的訊號。\n\
    6. 空頭走勢下跌時，反彈出現含上影線的長紅K線或中紅K線，表示反彈遇到賣壓，容易反彈結束。\n7. 空頭走勢下跌到低檔，出現含上影線的長紅K或中紅K線，代表止跌訊號，注意次日的K線發展。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_86_0.png)\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_86_1.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n1. 當天出現帶大量及含上影線中紅K線，主力拉高出貨。\n2. 高檔再出現帶大量及含上影線中紅K線，主力拉高出貨。\n\
    3. 股價不漲，跌破盤整，行情走空。\n\n## 第 2 篇\n### 第 3 章 含上影線的中長紅和中長黑K線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_87_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n1. 底部打底完成放量上漲。\n2. 遇到前面高點A的壓力，當天出現含上影線中紅K線，表示有賣壓。上影線最高點雖然突破前面高點A，但收盤價沒有突破前面高點A，同時量縮，後面還要再回檔整理。\n\
    \n### 含上影線的長黑K線或中黑K線\n#### 定義\n黑K線實體達2.5%以上，上方留有上影線，但上影線不能大於實體。\n\n#### 解說\n在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到含上影線的長黑K線或中黑K線。就單一K線而言，當天是空方強，開盤後股價一度上漲，但空方力道強，股價一路下跌到最低點收盤。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_88_0.png)\n\n#### 精通\n1. 含上影線的長黑K線或中黑K線，無論在多頭或空頭，都是相當弱勢的表現，要注意多頭可能止漲，空頭還會續跌。\n\
    2. 在盤整區出現含上影線的長黑K線或中黑K線，表示向上有壓力，可能還要整理。\n3. 在空頭走勢的關鍵位置，例如盤整跌破、支撐的跌破、空頭反彈後再下跌，如果出現含上影線的長黑K線或中黑K線，只要收盤價跌破，即可確認。\n\
    4. 連續下跌時，出現含上影線的長黑K線或中黑K線，之後股價不跌或向上，配合大量過黑K線上影線最高點，行情變成反轉向。\n\n## 第 2 篇\n### 第\
    \ 3 章 含上影線的中長紅和中長黑K線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_89_0.png)\n\n1.\
    \ 連續下跌出現放量的含上影線的長黑K線，次2日出現小十字變盤線，股價不再下跌。\n2. 放量的長紅K線，收盤突破含上影線長黑K線的最高點，行情反轉，由空轉多。\n\
    3. 高檔爆量長紅K線，次日股價不漲，次二日出現含上影線的長黑K線。\n4. 含上影線的中黑K線，跌破含上影線長黑K線的低點，行情反轉，由多轉空。\n\n\
    ## 第4章 含下影線的中長紅和中長黑K線\n\n### 定義\n紅K線實體達2.5%以上，下方留有下影線，但下影線不能大於實體。\n\n### 解說\n\
    在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可以看到含下影線的長紅K線或中紅K線。就單一K線而言，當天是多方強，開盤後曾經跌破平盤下殺，但多方最後拉升到最高點收盤。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_90_0.png)\n\n### 精通\n1. 含下影線的長紅K線或中紅K線，在多頭表示繼續上漲，但在高檔，要注意爆大量股價不漲或下跌的訊號。\n\
    2. 在多頭走勢的關鍵位置，例如盤整突破、壓力的突破、多頭回檔後再上漲，如果出现大量及含下影線的長紅K線或中紅K線，是上漲攻擊的訊號。\n3. 空頭走勢中，出現帶大量及含下影線的長紅K線或中紅K線，可能只是止跌或反彈的訊號，小心是誘多的紅K，不是做多的買點。\n\
    4. 連續下跌中遇到支撐，出現含下影線的長紅K線或中紅K線，是有支撐的訊號，注意次日開盤的走勢，如果開高向上，則支撐確認。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_91_0.png)\n\
    \n資料來源：富邦GOI電子交易系統\n\n連續下跌到低檔，出現放量及含下影線的中紅K線，是有支撐的訊號，注意後續走勢，如果向上，則支撐確認。\n\n###\
    \ 含下影線的長黑K線或中黑K線\n#### 定義\n黑K線實體達2.5%以上，下方留有下影線，但下影線不能大於實體。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_92_0.png)\n\
    \n#### 解說\n在行情走勢圖中，不論多頭上漲、空頭下跌或盤整，都可看到含下影線的長黑K線或中黑K線。就單一K線而言，當天是空方強，開盤就是最高點，一路下跌，但下面有多方抵抗的力量，拉升到收盤價，留下了下影線。\n\
    \n#### 精通\n1. 含下影線的長黑K線或中黑K線，在多頭是止漲的訊號，在高檔爆大量，股價容易出現一日反轉。\n2. 在空頭走勢的關鍵位置，例如盤整跌破、支撐的跌破、空頭反彈後再下跌，如果出現帶大量及含下影線的長黑K線或中黑K線，是繼續下跌的訊號。\n\
    3. 下跌到支撐位置或空頭低檔，出現帶大量及含下影線的長黑K線或中黑K線，表示當天跌深後有多單進場拉抬，注意次日股價是否止跌或回升。\n4. 下跌中遇到支撐，出現含下影線的長黑K線或中黑K線，如果收盤價沒有跌破支撐，只是下影線跌破，不是真跌破，次日要再確認。\n\
    5. 下跌中連續出現含下影線的紅K或黑K線，表示主力殺低吸貨，要注意後面止跌反轉的訊號。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_93_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n多頭回檔出現含下影線的中黑K線，盤中最低點跌破前面K線的橫盤下頸線，但收盤價格沒有跌破，不是真跌破。後續股價一直没跌破前面K線的橫盤下頸線，多頭維持繼續上漲。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_94_0.png)\n\n資料來源：富邦e01電子交易系統\n\n-\
    \ 下跌中連續出現含下影線的中黑K線，同時出大量，主力殺低吸貨，容易止跌回升。\n- 多頭回檔遇到支撐，接近月線出現含下影線的中黑K線，同時爆出大量，是止跌訊號，次日開高走高，多頭繼續上漲。\n\
    \n## 第 2 篇\n### 第5章 錘子線、吊人線、倒錘線\n#### 錘子線、吊人線、倒錘線\n##### 錘子線和吊人線：錘子不能掛在小圓圈K線\n\
    \n###### 定義\n下影線很長，至少是實體2倍以上。小的實體在上方，實體是紅K或黑K。相同的線型，不分紅K或黑K，實體在上漲走勢的頂端稱為「吊人線」，在下跌走勢的低點稱為「錘子線」。\n\
    \n###### 解說\n沒有上影線，如有必須很小。在高檔，代表多方向上漲勢受阻，盤中跌破開盤，最後的收盤接近開盤價。在低檔，代表空方有止跌現象，下跌到最低點出現向上拉的多方力量，最後收盤拉到接近開盤價。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_95_0.png)\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_96_0.png)\n\
    \n###### 精通\n1. 強勢上漲到高點，出現吊人線，以當天情況來看，開盤在高點，接著出現賣壓，最後再拉到最接近最高價做收，可確認當天經過下殺的洗盤換手或者是主力出貨後再往上拉來誘多。要確認主力是否出貨，次日的走勢非常重要。次日出現以下情況，都是主力出貨，這樣的上漲走勢就會改變，甚至變成上漲架構的瓦解。\n\
    \   - 次日開盤向下跌空大跌，多頭上漲架構瓦解的可能性大大提高，容易一日反轉或做頭。\n   - 次日開低向下，或開高走低，收盤跌破吊人線的實體下沿，轉折向下的可能性大增，多單要考慮準備出場。\n\
    \   - 在高檔，吊人線當天或前一兩天爆出大量，次日開低向下，或開高走低，幾乎可以確定昨日是主力出貨。\n   - 高檔連續出現2～3根吊人線或搭配其他下殺的K線訊號（如高檔長黑、變盤線、出大量開高走低下跌黑K等），轉折向下的機率高。\n\
    \n2. 強勢下跌到低點，出現錘子線，以当天的情況來看，開盤在高點，接著出現賣壓，盤中到達最低點後，多頭反攻，往上再拉到最高價或接近開盤價做收，可以確認當天經過原先空頭走勢的下跌，然後有一些多方力量介入，要確認多頭是否反攻成功，次日的走勢非常重要。次日出現以下情況，都是先下跌後多方反攻，下跌走勢可能改變，甚至是空頭架構被破壞，成為向上回升的訊號。\n\
    \   - 次日開盤向上跳空大漲，空頭結構瓦解的可能性大大提高，容易一日反轉或打底。\n   - 次日開高走高或開低向上，收盤突破錘子線實體的上沿，轉折向上的可能性大增，空單要考慮出場。\n\
    \   - 在低檔，錘子線當天或前一兩天爆出大量，或者當天出現窒息量，次日開高向上，幾乎可以確定是轉折向上反彈。\n   - 下跌到低檔或重要支撐位置，出現錘子線，也可視為向下打樁的長釘，如果連續出現2～3根的錘子，打樁的型態越加明顯，容易形成止跌回升或強力反彈。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_97_0.png)\n\n資料來源：富邦e01電子交易系統\n\n-\
    \ 高檔帶大量吊人線，次日向下跳空下跌，整個多頭架構改變。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_98_0.png)\n\
    \n資料來源：富邦eO1電子交易系統\n\n1. 前一日高檔大量長紅，當日該上攻沒有上漲，出現吊人線，要特別注意不能跌破吊人線實體下沿，否則可能是假突破、真下跌。次日跳空下跌長黑，轉成空頭。\n\
    2. 低點出現鉗子，實體上沿被突破，整個空頭架構改變。\n\n## 第 2 章 鏈子線、吊人線、倒鏈線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_99_0.png)\n\
    \n1. 上漲到高檔，連續出現2天的吊人線，是主力在誘多，不能買進，要特別注意次日不能開低盤。\n2. 連續上漲出現價量背離，隨時都會轉折下跌。\n3. 次日跳空下跌，不僅會下跌，而且整個多頭架構都會改變。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_100_0.png)\n\n1. 上漲到高檔，連續出現3天的吊人線，是主力在誘多，不能買進，要特別注意次日不能開低盤。\n\
    2. 開低盤，收盤跌破吊人線的實體下沿，轉折下跌。\n3. 跳空下跌，不僅會下跌，而且整個多頭架構都會被破壞。\n\n## 第 2 篇 鉗子線、吊人線、倒鉗線\n\
    ![](img/1e894204ae46fe158e1fccb5ec5a0bf3_101_0.png)\n\n資料來源：富邦e01電子交易系統\n\n1.\
    \ 上漲到高檔，前一日為大量長紅，今日沒有繼續上攻，出現黑K吊人線，是轉折向下訊號，要特別注意次日不能開低盤，或者收盤跌破吊人線的實體下沿。\n2. 連續3天都在吊人線的實體下方收變盤線，第4天往下跌，整個多頭架構都容易改變。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_102_0.png)\n\n資料來源：富邦e01電子交易系統\n\n\
    1. 高檔連續出現吊人線，是轉折向下訊號，要特別注意。\n2. 長黑K跌破吊人線的實體下方，開始做頭。\n3. 高檔再次出現吊人線，次日向下跌空，形成三尊頭，而且頭頭低，空頭架構即將形成。\n\
    \n## 第 2 篇 鎧子線、吊人線、倒鎧線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_103_0.png)\n\n\
    資料來源：富邦e01電子交易系統\n\n1. 下跌到低檔，出現鎧子線，前一日為大量中紅止跌，是轉折向上訊號，要特別注意次日，如果開高盤向上，確定轉折向上。\n\
    2. 次日開高走，整個空頭架構改變。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_104_0.png)\n\n\
    資料來源：富邦Q1電子交易系統\n\n1. 下跌到低檔盤整，出現錘子線，是轉折向上訊號，要特別注意次日，如果開高盤向上，確定轉折向上。\n2. 次日開高走高，整個空頭架構改變。\n\
    \n## 第2篇 繩子線、吊人線、倒鉗線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_105_0.png)\n\n\
    1. 下跌到低檔，出現繩子線，是轉折向上訊號，次日再出現小十字線的變盤線，注意轉折向上的訊號。\n2. 當天開高走高，長紅突破前3日K線最高點，整個空頭架構改變。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_106_0.png)\n\n資料來源：富邦eO1電子交易系統\n\n\
    - 上漲到高檔，出現爆量含下影線長黑K線，是轉折向下訊號，次日若開低股價，容易一日轉折向下。\n- 高檔出現帶大量吊人線，要注意次日開盤走勢。\n- 當天出現開低走低長黑K線，股價將反轉。\n\
    - 低檔連續兩天出現錘子線，注意股價是否止跌回升。\n- 股價止跌，再出現錘子線。\n- 連續3天股價都突破錘子線實體上沿，空頭反轉確認。\n\n## 第\
    \ 2 章\n### 鏈子線、吊子線、倒鏈線\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_107_0.png)\n\n\
    資料來源：富邦e01電子交易系統\n\n1. 下跌到低檔出現鏈子線，是轉折向上訊號。\n2. 低檔第2次出現鏈子線，注意可能是雙腳打樁，後續股價向上，空頭底部呈現底底高，容易反轉成為多頭。\n\
    3. 大量突破前面最高點，多頭確認。\n\n## 定義\n上影線很長，至少是實體的2倍以上。小的實體在下方，實體可以是紅K或黑K。\n\n## 解說\n在多頭上漲或反彈走勢中出現倒錘線，是容易轉折向下變盤的訊號。在下跌走勢或多頭回檔出現倒錘線，是容易轉折向上變盤的訊號。\n\
    \n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_108_0.png)\n\n## 精通\n出現倒錘線，一定要用第二天的K線來確認，否則在上漲中只能解讀為遇到大壓力，在下跌中只能解讀為出現上攻力量。從次日開盤走勢，可以看出是往上還是往下轉折。\n\
    \n在多頭上漲出現倒錘線：\n1. 次日開低向下，收盤低於倒錘線實體下沿，可確認為轉折向下。如倒錘線當天或前1、2日出現大量，更可確認為反轉。\n2. 連續出現2根倒錘線，其中出現爆大量，或者第2根倒錘線跳空向下，更能確定走勢是反轉走跌。\n\
    3. 出現2根倒錘線，即使次日再上漲，高點也不會太多，謹放假過高、真拉回。\n4. 出現2根倒錘線，第2根倒錘線最低點被跌破時，多單要出。\n5. 多頭高檔時，K線頻頻出現倒錘線，表示上檔買壓重，要注意股價不漲或回跌。\n\
    6. 上漲遇到重要壓力位置，出現倒錘線，表示賣壓出現，要注意次日股價開低容易折返。\n7. 多頭上漲時，倒錘線突破前面高點、盤整末端突破上顯線，要確認上漲是否衝破重要壓力，觀察重點如下：\n\
    \   - 只有倒錘線上影線突破，但實體沒有突破，不能視為有效突破，容易成為假突破，要注意後面幾天走勢。\n\n![](img/1e894204ae46fe158e1fccb5ec5a0bf3_109_0.png)\n\
    \n資料來源：富邦e01電子交易系統\n\n- 高檔出現2次倒錘線，這是轉折向下訊號，次日跌破倒錘線實體下沿，確定轉折向下。\n"
