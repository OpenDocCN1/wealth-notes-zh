  md: '# 224｜复盘：把所有的经验教训，都变成组织能力


    224｜复盘：把所有的经验教训... ↓


    你和团队为了争取一个大客户，专门成立了项目组，分工协作，死磕半年，各种挫折、各种狗血，当然也有各种鼓励、各种改进，终于得到了客户的通知：恭喜，贵公司中标了。


    这时候你应该干什么？去普陀山还愿吗？把自己锁在房间里抱头痛哭吗？


    千万别。这时候你应该做两件事：第一，带着团队去狂欢：胡吃海喝，酗酌大醉，彻夜麦霸，倒地不起；第二，等大家睡清醒过来后，坐进办公室，来一次leurs的“复盘”。


    # 概念：复盘


    什么叫复盘？哈佛大学的大卫·加尔文教授认为：“学习型组织”的诊断标准之一，就是“不犯曾犯过的错误”。从即将结束的项目中，总结成功经验，吸取失败教训，这就是：复盘。


    联想公司应该是把“复盘”这个管理工具执行得最好的代表。


    他们从实际经验中，把“复盘”归纳为四个步骤：回顾目标，评估结果，分析原因，总结规律。


    # 运用：“复盘”的四个步骤


    回到最开始的案例。按照联想的复盘流程，你可以这么做：


    # 第一，回顾目标


    回顾目标，就是要准确、客观地回答两个问题：我们的目标是什么？我们的里程碑有哪些？


    “我们的目标是不顾一切拿下这个项目。”这准确、客观吗？


    # 第二，评估结果


    # 第三，分析原因


    +   1. 第一次使用了作为指挥室（War Room）的管理方式，团队合作的效果和效率都大大提升，导致项目方案极具说服力；

    2. 销售严格执行“销售漏斗”流程，发现了客户对上线日期的担忧，从而说服了他提前招标。


    +   1. 项目方案内容变化太快，导致成本估算表更新速度跟不上；

    2. 最终一轮谈判时，在谈判技巧上，表现严重不足。


    # 第四，总结规律


    +   1. 作战指挥室，是在重大战役中建立快速反应部队的好方法；

    2. 销售漏斗培训，对提高销售能力值，提高项目成功率很有帮助；

    3. 项目方案快速调整时，成本预算表是容易滞后的模块；

    4. 谈判能力，在大项目的最后环节，作用明显。


    # 小结：认识复盘


    复盘，就是从即将结束的项目中，总结成功经验，吸取失败教训。复盘具体可以有四步：回顾目标，评估结果，分析原因，总结规律。


