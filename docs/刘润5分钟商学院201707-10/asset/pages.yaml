  md: '度。狠一点的话，每年强制取缔评价倒数10%的商家，更换新鲜血液，刺激提升。


    反过来説，如果你是個消费者， goto 一家明显打算和你“一次博弈”的饭店、商铺，怎么和店员讨价还价呢？对餐厅，你的基本策略是告诉对方：我是本地人；对商铺呢？你的基本策略是说：我家就住在旁边；对品牌呢？你的基本策略是说：我是你们的老客户。这都是通过把一次博弈，变成重复博弈，来激励唤商家诚信。


    很有趣吧。但要提醒你一点，千万不要说：我明天就要搬家了。你这么说就是告诉对方：这是我们之间重复博弈的最后一次，那对方的心态，很可能立刻从“重复博弈”变成“一次博弈”，放弃诚信。


    这就是为什么，每次盛传末日谣言，就会有地方出现打砸抢。文明的商业社会，就是建立在“无限次重复博弈”的假设前提上的。一旦末日论盛行，就意味着所有的重复博弈，马上都要变回到一次博弈。有些人立刻会撕下文明，社会立刻会恢复野蛮。这也是为什么，官场上ms“59岁现象”。明年就要退休了，“无限重复博弈”于是就变成“一次博弈”，那不如赶紧捞这一把，反正也没有以后了。


    # 小结：认识重复博弈


    什么是重复博弈？当博弈双方是“一锤子买卖”的时候，大家很可能会选择“损人未必利己”的“坏的纳什均衡”。但如果博弈双方都知道，同样的博弈，会无限次重复下去，他们就会把重复博弈的总体利益作为更重要的衡量标准，克服短期损人未必利己的诱惑。


    诚信，就是把一次博弈，变成重复博弈；文明的商业社会，就是把有限次重复博弈，变成无限次重复博弈；而重复博弈，是治疗“坏的纳什均衡”的终极解药。


