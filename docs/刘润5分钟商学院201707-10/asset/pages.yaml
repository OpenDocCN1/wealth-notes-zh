  md: '# 225 | MBTI: MBTI是算命，娱乐，还是性格测试？


    你要在夏威夷旅行，非常难得的机会，你会怎么安排在目的地的五天呢？有两个选择：


    +   A、定一个详细的日程表，每天早上去哪里、中午在哪里吃饭、下午去哪里。仔细审视，保证不会漏掉任何一个重要的景点。然后才会出发。


    +   B、不定任何日程表，只管带足存储卡，五天随性游玩，在喜欢的地方就多待甚至住下来，不喜欢的地方立刻就走。


    你会怎么选？A还是B？这还用说？当然是……。别急，问问你身边的其他五位朋友。哟？天啊！他居然会喜欢那样的方式？太奇葩了吧！


    是的，人与人之间，就是这么不同。这种内心底层的差异，倾向，或者说偏好，就叫“性格”。性格比习惯更底层，更顽固。研究性格差异，是一件很有趣的事情。但是，心理学还是一门发展中的学科。性格分类，并不是基于公理缜密“演绎”出来的定理，而是基于生活统计“归纳”出来的猜想。


    从1920年开始，无数研究者，包括著名的心理学家荣格在内，就开始“猜想”性格到底是什么，有没有确定的分类。这些猜想，有些几等于算命，比如星座；有些猜想，只是饭后娱乐，比如血型；但确实出现了一些，基于统计学，相对比较靠谱的猜想，比如DISC，九型人格，Big
    Five，和MBTI。


    《刘润·5分钟商学院》不是心理学院，今天我不谈“性格分类是否足够可靠”这个话题。我们只谈，如何利用这些“比较可靠”的“性格分类”工具，做好与人相关的管理；我们只谈，被世界500强公司用得最多的：MBTI。


    # 概念：MBTI


    什么是MBTI？MBTI中的M是美国心理学家Myers（迈尔斯），B是她母亲Briggs（布里格斯），TI就是Type Indicator（类型指标）。MB这对母女，在1940年代根据荣格的理论提出，人的性格有4个基本维度：


    +   第一，心理能量：外向的人代号E，从人际交往中获得能量；内向的人代号I，从安静独处中获得能量；


    +   第二，信息获取：实感的人代号S，用五感理解真实的世界；直觉的人代号N，用第六感理解抽象世界；


    +   第三，决策方式：思考的人代号T，用逻辑客观地方式决策；情感的人代号F，用情感和价值观来决策。


    +   第四：生活态度：判断的人代号J，结构化组织化喜欢控制；知觉的人代号P，弹性化自发化开放探索。


    4个维度，每个维度2种倾向，构成ชั่น16种“性格类别”，比如：ESTJ。别问我为什么这么分，而不那么分。这是個好问题，但我们今天不讨论。了解的同学可以在留言区分享它的理论来源、逻辑和演变。


    回到最开始的案例。为什么有人一定要做好计划才出行？因为在生活态度维度上，他和我一样，是“J-判断型”的人，结构化组织化喜欢控制；而另一些人走到哪里玩到哪里，随心所欲，是因为他们是“P-知觉型”的人，弹性化自发化开放探索。


    # 运用：MBTI的参考意义


    那么，MBTI对管理到底有什么用呢？


    你可以寻找一些专业的机构，在他们的指导下，给自己和员工做MBTI测试。不要随便在网上找题做，MBTI是“自述式答题”，没有经过指导，你很可能会按照“理想的自己”，而不是“真实的自己”答题，结果不具参考意义。在最终得到类似ESTJ，或者INFP之类的测评结果之后，你可以：


    +   第一，了解自我。


    一位沃顿商学院的同学发现，沃顿的人很多都是ISTJ，或者ISFJ。SJ（用五感理解真实的世界 + 结构化组织化喜欢控制）的人，适合做金融和会计；而一位斯坦福的中国学生声称，这里无论是硕士、博士还是MBA，很多都是N（第六感理解抽象世界），很少S（用五感理解真实的世界），所以成为梦想的摇篮也就iano奇了。


    了解自我，做最自然而然的事情，更容易在前进的道路上，一路狂奔。


    +   第二，知人善用。


    IBM和微软一样，是成功运用MBTI的公司。他们早期开拓印度市场业务时，没人愿意前往。后来，他们针对不同MBTI性格的人，采取不同的动员策略。比如对IF、SE（内向情感、外向实感）型的人，就渲染印度璀璨的文明，和自由发挥空间；对ET、NI（外向思考、内向直觉）型的人，就强调升职加薪，和能力提升。最终，IBM完成了这项工作。


    知人善用，是用合适的方式，和合适的人沟通，做合适的事，事半功倍。


    # 小结：认识MBTI


    MBTI是迈尔斯和她母亲布里格斯创立的一套性格分类工具。它把人的性格分为：外向E-内向I，实感S-直觉N，思考T-情感F，和判断J-知觉P这4个维度，以及衍生出来的16类性格。


    在管理上，MBTI被非常广泛地用于了解自我，知人善用。


    但是，我们还是要记住，MBTI不是演绎，是归纳，我们对性格的探索还很浅薄，用MBTI作为参考，但不要迷信。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_92_0.png)


    MBTI的性格测评工具被广泛用在了解自我、知人善用上。用合适的方式和合适的人沟通，做自己适合的事，会加事半功倍。


