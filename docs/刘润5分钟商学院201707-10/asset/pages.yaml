  md: '# 小结：认识罗伯特议事规则


    为了最高效地获取会议的结论价值，你可以试试罗伯特议事规则。这套规则非常详细，但我希望你记住最精华的十二原则六步法。


    十二原则是：动议中心，主持中立，机会均等，立场明确，发言完整，面对主持，限时限次，一时一件，遵守裁判，文明表达，充分辩论，和多数裁决。


