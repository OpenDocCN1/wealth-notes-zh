    # —— 本周留言精选 ——


    从四个方面分析要不要开第二季：订阅数，满意度，有无竞争对手，得到的用户会不会增长。


    +   1、第一季的订阅数，到目前为止的订阅数已经超过12万，订阅数算高的。2、满意度，从留言和微信群的反馈来看，专栏满意度很高。3、有无竞争对手，从几个大的付费平台来看，目前还看不到竞争对手。4、得到的用户数。如果得到的用户还会不断增长的话，第二季就能够吸引更多新用户订阅，这也是很关键的。


    综合来看，肯定可以继续第二学年。


    几年前，一个朋友想开一家饭店，但是不知道如何选菜单。我就建议他多找几个人，帮他去打算是饭馆的周边，选择饭店去收集数据，比如不同时间段的客流量、客人点的菜和其他饭店的菜单。条件允许的话，还可以问一下居委会负责外地登记的工作人员，周边居住的都是哪里的人？最后再利用一些手段，和其他饭馆的厨师套上近乎，了解他们各自饭馆的特色菜。把所有的销售额统一分析，然后再根据分析得来的数据，选择性地去招厨师、定菜单、定特色菜。在拿不到专业数据之前，也许这就是所谓的大脑云计算吧。


    之前在公司推行项目合伙人制度的时候极大受阻，看完文章按照KT方法分析，知道问题出在哪里了。


    首先时机上，亏损后告知研发，研发会想合伙人显然是要收拾我的，要我承担亏损的风险。而项目延期原因方方面面，为什么只针对研发采取合伙人制度？本来是以合伙方式激励大家想为大家多争取奖金，结果适得其反。至于那80%抵触的人，恰巧是所在项目有延期的，甚至亏损的。10%观望状态的，是项目基本正常进行的。另外10%欣然接受的，是项目一直做得比较好的。


    所以，想要大家都能接受合伙人制度，第一、要在制度颁布时要和研发做一次彻底的沟通，把为什么要做这件事说透，让大家了解目的在共赢而不是惩罚。第二、对于在各种状态的研发人员，制度要考虑全面，正常组的成员、亏损组的成员和盈利组的成员要有针对性的条款，在制度推行前期能让大家无后顾之忧。等到制度顺利推行，初见成效，再根据实际情况作调整。要避免“大锅饭”制度。第三、在制定制度的初期，要提前预测到可能会发生的情况，以便更深入以及更加多角度去考虑问题，从而使制度更加“接地气”。


    五商恋爱手册：1、用麦穗理论找到优选对象。2、找到你的心仪对象后，和她接触时，按照“锚点”策略找个比你稍差的朋友和你一起去，以增大成功率。3、相处的时候本着“一报还一报”博弈策略，开始与人为善，保持克制也不忍气吞声，也要保持宽容，才能建立更久的关系。4、通过五商不断优化套路，提升对方新鲜刺激激素对多巴胺分泌，度过七年之痒。但凡选择就意味着是概率问题，那就一定有对应的策略。


    我们有大大小小100多个客户，有些客户综合水平高，就按约定的好流程操作，很少出问题，就显得很安静，不太引人注意；但另外有些客户货量不大，但总是出问题，就显得很热闹。作为经理，我照顾不过来这么多客户，如果单纯凭印象或感觉，可能根本分不清哪些是重点客户，哪些客户声音很大，但利润很少。


    于是我们就做了一些表格，同时也利用自己的操作系统，来提取客户的货量、单位利润、总利润、付费情况等数据，同时观察上述数据的变化。刚开始的时候还真是挺吃惊的，一些我们没有太重视的客户实际贡献很大，而如上文所说花费了我们很多精力去处理问题的客户，其实收益很小。这样我们就把上面的数据加权计算出总分，依此把客户分成了ABCD四个等级，在报价、沟通、拜访、答谢、跟踪服务等方面有所区别，提高效率的同时，增加了效益。


    过了一段时间，客户的情况渐渐摸清了，我们就把统计工作缩小了范围，只关注前10位大客户，其它客户都是正常操作，以减小统计的工作量。在此多说一句，我们的情况基本符合二八法则：少数客户贡献了绝大部分的利润。坚持做好统计分析，那是客户分析的好工具和风险评估的晴雨表。


