    \n# 留言精选\n\n刘润 122 九寒沁、成都、四川的同学们，你们都还好吗？注意安全，祝平安！ 08-08 22:33:01\n\n青岛罗刚 31 昨天还嘀咕着要用SMART刀法搞定OKR+360度环评，今天早上就被泼了一大盆冷水。学习了OKR+360度环评后，周一早会布置经理们都去看看这一课的内容（我们在骨干范围内推广学习五分钟商学院，每天有专人分享到骨干群）和我的留言，告诉大家考虑在报关现场部试试，如果可行就推广，还对360度环评进行了简单的讲解，大家纷纷点头散去。今天早上我去检查大家都看了没有，结果非常失望，报关经理倒是看了，但其它经理大多数都没看。我在骨干群里发了一通火，此处略去1500字。火发完了，我也很困惑，为什么大家会这样呢？我们的团队总体来说非常好，是业内的佼佼者，业绩也很不错，为什么经理们不看明确要求他们学习的文章呢？是哪里出了问题呢？是我的要求太高了吗？1.\
