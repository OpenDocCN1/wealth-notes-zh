  md: '其实做内容本质上是什么呢？每一家做内容产品的本质都不一样，比如说迪士尼所有的内容其实贩卖的是快乐。早期我们是从一个叫“凯叔讲故事”的微信公众号做起，去年年底有了“凯叔讲故事”的APP，从一个一个绘本故事到成系列的内容，从版权合作到大量的生产原创，从免费内容到现在近两个亿的收入。其实越来越觉得故事只是产品的外壳，不过是交互方式，而真正产品的核心是什么呢？其实是教育。


    从我们的第一个爆款产品《凯叔西游记》来举例子，这个产品到现在已经创造了3000多万的收入，这也是我个人完全独立写作录制的产品。总共创作量有60多万字，中间不断地删改，交付给用户的时候精简到了40多万字，137集，一共40多个小时的音频产品，整个制作耗时整整三年。


    一开始我写《西游记》给自己的女儿听基本讲不下去，孩子会不断地用各种问题把你打断，我就发现平时成人认为是常识的东西对于孩子来说却是第一次认知。于是我就尝试着把每一集孩子提出的问题写出答案，然后再揉在情节里，不等孩子问，答案其实已经讲出来了。随着《凯叔西游记第一部》的推出，让3岁以上的孩子提不出情节上的问题，就成为了我们的创作金线，这样就能让孩子全盘接收你的内容，爱上你的内容。到这个时候你才有资格带着他往上成长，给他更难的东西，带着他迈台阶。


    所以一个好的儿童内容，实际是在内容内部已经给孩子打造了一个成长的阶梯，什么时候加入成语？什么成语凯叔要解释它的典故？什么成语让他去猜大概的意思？什么时候揉入唐诗？到了第三部、第四部开始和孩子去探讨哲思，把很多中国历史里著名的场景揉到西游的情节当中去。一直到第五部其实已经完全像给成人讲《西游记》一样了，因为之前有了这么长时间的积累和磨合，孩子对中国古典文化常识的了解，对于越来越成熟语言的捕捉能力也就越来越强。


    从第一部到第五部听下来，其实一个孩子对于中文的理解力已经发生了非常大的变化。比如说讲成语故事，原来的成语故事不过是三五百字，讲一个历史典故，但是很少见有孩子爱听成语故事。为什么呢？这对于孩子来说是一门课程，可是我们讲的成语故事是别人容量的5~7倍，这里有历史纵深的挖掘、人物性格的塑造、细节的刻画等等，它首先要做到孩子易接受、爱听、很有愉悦感，然后你才有资格带着孩子去学习成长。


    胸有成竹，我能不能除了文与可的胸有成竹，再给孩子去讲讲胸无成竹的郑板桥，毕竟创作不只是一套方法论。能不能通过守株待兔给孩子讲清楚什么是概率，什么是沉没成本，我们如何看待沉没成本等等。所以你会发现你做的还是故事吗？是内容吗？不，核心是教育，是儿童的非课堂教学。非课堂不是课堂之外的教育，而是没有让孩子产生课堂感、产生压力的教育内容，这里边的底层代码或者第一性原理是，没有人会拒绝快乐的成长。所以当我们思考清楚，我们所做的内容产品之于用户的核心价值的时候，那再也不摇摆、再也不妥协，所有的产品都要围绕这一点去发力。


    # 2、一个能够穿越时间的产品才可能是经典产品


    再说第二个分享，这一点其实刘润老师在《5分钟商学院》里边讲过一个概念叫做时间率，我说的也是一样的，无法跨越的内容生产成本线其实就是时间成本。比如我们的《凯叔·声律启蒙》，每一个3分钟，我算过工作量，大概是五个人连续工作24小时才可以打造出第一个版本。那整个产品一共有90个3分钟，而这个产品的每一个表达环节其实我们都力图做到极致，包括APP的头图，每一个3分钟的图不一样，而这个图都是著名画家潘川用手绘出来的漫画式的结构，包括配乐都是顶'
  merge: -1
  img_proc: true
- pgno: 147
  md: '绘出来的漫画式的结构，包括配乐都是顶级的作曲家进行的配乐。


    那我想说的是什么呢？其实在打造内容的时间成本当中，花费最多的不是打造的过程，而是寻找的过程，所有的内容都会有一个最恰切的表达方式在等着它，每一个时代这种表达方式会不一样。而这种表达方式就像是数学中的一个点，你知道这个点在哪里，你可以精准地计算出来，但是你永远无法精准地达到、触摸，而我们要做的是用尽全力去接近那个最恰切的点，只要是你在这个时代离它最近，那这个产品就赢了。


    我经常问我们内容创作的小伙伴、我们的产品经理，我们现在做的这个产品放在这里能不能卖10年以上？能不能卖20年？一个能够穿越时间的产品就是一个经典的产品。


    # 3、内容经过深加工才能称之为产品


    第三项想分享的就是，其实内容已经不只是文字、音频、视频、图画，内容的体验方式、产品的交付方式本身，甚至运营方式都是内容。现在把声音、把文字直接放在网上就进行售卖，其实我觉得这是卖内容的原材料，而现在的内容生产者要做好准备了，我们产品化的服务其实根本逃不开了。内容经过深加工它才称之为产品，才能拥有健康的产品结构。


    我打个比方，比如说像《凯叔西游记》、《凯叔·声律启蒙》、《凯叔讲历史》等等这些产品，它不但可以在手机里、在APP里去买它的音频，还可以买到它的硬件，就是我们的凯叔随手听，甚至可以买到它的书、买到它的服裳，当然了有一些产品我还没有开发，但是是一定你会买到的。当你认为它是一个极致产品的时候，把这个产品放在不同的场景里，它就产生了不一样的产品表达方式，你这个产品的成本结构就会得到极度的优化。我们甚至为《凯叔声律启蒙》做了一款伴读游戏，大家可以在“凯叔讲故事”的APP里体验。


    时间占用很多了，我再说最后一agnet，内容产品的营销应该前置，因为营销本身也是内容产品的一部分。我们这个团队在打造任何产品，思考它的营销方案的时候，往往是在打造产品的初期。我们有两块黑板：一块黑板会写用户使用这个产品的场景，一块黑板会写用户使用这个产品能够解决什么痛点，然后把两块黑板的内容不断地删减、合并同类项，最终把我们留下的最集中的痛点和场景合并在一起，就变成了这个产品的营销话术或者方案。这只是营销点吗？不，这是这个产品的战略，那后面所有打造产品的动作都要围绕这个营销点，也就是它的战略进行，绝对不许走样。什么样的产品是好的产品？就是名副其实的产品，就是你的广告和产品本身完全可以划等号的产品，我们力图做到这一点。


    好了，今天和大家分享到这儿，感谢刘润老师，也希望我的分享能给您带来启发，希望更多的孩子能够拥有幸福的童年，含德之厚，比于赤子。


