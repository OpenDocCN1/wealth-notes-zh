- pgno: 191
  md: '卖鞋的代理店，无法卖到1200，是因为它有租金、水电、人工的成本，而网上未必有。


    理解了传递价值的本质，你可能就会推测，未来越来越多少线下店，将不再是代理商开的，而会是品牌商开的。你觉得贵？没关系，上网买啊。反正在线下买，网上买，都是我这个品牌的。


    再看看现在最火的“无人超市”。无人超市用同样高的成本展示商品，提供信息流；东西还是要用户自己拿回家，物流也没变；只是没有了收银员。似乎提高了效率，但因为无人，可能会增加货物重新摆放、损耗、丢失的成本。它并没有明显提高信息流、资金流和物流的效率。所以，无人超市，只是一种有趣的零售，并不是更高效率的零售。


    理解了“传递价值，就是利用效率的手段，降低定倍率”后，我希望你能理解，新零售，就是更高效率的零售。


    # 第二，创造价值，就是用创新的方法，提高定价权。


    那定倍率一定要很低吗？我100元成本的东西，就一定不能卖10000元吗？可以，那你必须有“创新”。所谓创新，就是“人无我有，人有我优”。我就是要做一个你做不出来的东西。你做不出来？那我就卖10000元，你一点办法都没有。


    人无我有，就是科技创新。今天的人工智能，就属于此类。过去美国摩根、大通银行，每年要购买30万小时的律师服务，来审核贷款合同，这需要150个律师干一年。现在有家叫做COIN的公司提供人工智能的“文书律师”服务，几秒钟就能完成原来律师要花30万小时做的事情。那我该怎么定价呢？你只要比150个律师一年的费用便宜，理论上就可以。这相对于人工智能的计算成本来说，定倍率，可能是几万倍。但是，我就能这么卖，因为你做不出来。


    人有我优，就是工匠精神。过去几年中国商业界流行一个词：工匠精神。我说，在经济高速发展时，基本没有工匠精神。为什么？因为你抢钱还来不及呢，哪有时间反复打磨？工匠精神，不符合高效的商业逻辑。为什么美国、日本、德国有工匠精神？人家的GDP每年只增长1%~2%，竞争极其惨烈，顺势成长已经没有机会了，只有把东西做好，才有一席之地。现在中国的GDP回落到6%~7%，真正的工匠精神，终于要被逼出来了。


    创造价值，过去是把东西做出来，现在是把东西做好。创造价值，就是用创新的方法，提高定价权。


    # 小结：回顾整个商业篇


    回顾整个商业篇，用一句话总结就是：创造价值，是用创新的方法，提高定价权；传递价值，是用效率的手段，降低定倍率。创造价值和传递价值，就是商业世界的左脚和右脚。一步一步，永不踏空。


