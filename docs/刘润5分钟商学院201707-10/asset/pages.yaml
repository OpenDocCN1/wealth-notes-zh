  md: '# 254 | 奇点临近：据说2045年，“奇点”将要临近？


    既然本周，是要帮助你脑洞大开，思考未来，那么今天，我就努力带大家看看，现有科学家们眼中人类最远的未来是什么样。谈“人类最远的未来”，就不得不提一个人：雷·
    Kurzweil。这个最远的未来有多远呢？库兹韦尔说：大概就在28年后，也就是2045年。


    库兹韦尔是谁？他可不是一个神棍。库兹韦尔是Google公司的工程总监，美国国家科学院奖章获得者、世界上最重要的发明奖Lemelson-MIT获得者，被《Inc.》杂志称为“爱迪生的法定继承人”，被《福布斯》杂志称为“最终的思考机器”，拥有13项荣誉博士头衔。他的声音，不管多么貌似离间，我们还是要坐下来仔细听听。


    那么，库兹韦尔到底说了什么呢？


    # 概念：奇点临近


    我们昨天讲了人工智能。业界把人工智能按照先进程度，分为三种：弱人工智能，强人工智能，和超级人工智能。


    你猜，下赢李世石和柯洁的AlphaGo，算是哪种？AlphaGo是弱人工智能。虽然你觉得它很强大，但它其实只能在特定领域、既定规则中，表现出强大的智能。你让它预测股市，就不行了。如果AlphaGo都算弱人工智能，那么什么是强人工智能呢？强人工智能，不受领域、规则限制，只要是人能干的事情，它都能干。也就是说，强人工智能，才是真正的人工智能。那么超级人工智能呢？就是远远超越人类的智能。


    科学家们其实对弱人工智能多强大，毫无争议。大家有争议的地方在于：强人工智能，到底会不会出现。


    库兹韦尔，因此提出了著名的“奇点理论”(Singularity)。什么是奇点理论？简单来说，他认为，科技的发展是符合幂律分布的。前期发展缓慢，后面越来越快，直到爆发。


