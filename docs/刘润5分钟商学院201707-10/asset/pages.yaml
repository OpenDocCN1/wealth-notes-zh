  md: '频里就有了温暖的光和色彩，柔和的声音或音乐，菜谱步骤里有人也有故事；再比如当你心碎欲绝，短视频里泪流满面喊麦一曲《死在江南烟雨中》；再比如你想表达：“当然选择原谅她啊”，用表情包可以抛出“绿帽侠”系列，短视频就会用一个小段子剧演绎。总的来说，是把内容视频化。


    人类一直在用尽一切可能的方式表达自己的情感、思考，先后有图腾、壁画、音乐、语言、文字、影像等等各种传播手段。目前在互联网上，我们也会通过文字、图片、GIF、影像等各种方式进行表达。只要技术有任何进展，人的创造力都如无孔不入的水一般，抢占新的旧技术推动的表达方式。从这个意义上讲，目前短视频的数量远远不算庞大，我相信短视频的数量未来还会源源不断地增加。


    当新的形式出现后，影像的制造者不再是电影电视从业者的专利，影像的消费场景也不再是端坐在大屏幕前。如今你用手机的各类APP也能实现用影像的自我表达。很自然，如此逐渐也分流出质量分差，而此时，好”这个标准被重新定义。


    ——大屏就比小屏好吗？横屏就比竖屏好吗？


    ——内容“好”这个标准，是谁来定义的？是通过什么维度来定义的？


    ——重播次数最多是好吗？传播量最大就是好吗？阳春白雪就是比下里巴人好吗？工序复杂就一定比工序简单好吗？


    文学里“好”这个概念在不同的历史阶段，被无数次定义。而在当下，星站认为短视频的好，即让需求得到满足就是好。需求来自大众，也来自不同垂直的细分人群。当然这些需求的满足前提是可以引导人们朝正向发展的。（网络时代的媒体，依然需要责任和自律。）


    举个例子，一些朋友熟悉我们的足球类短视频，在2016年欧洲杯期间取得了很好的数据：19集播放量5000万，远超类似黄健翔和微博独家合作的球坛名人类节目。我们的内容满足了B端和C端的需求。B端品牌方百度贴吧希望通过调性和梗，实现贴吧文化的传播，提升贴吧的流量和活跃度；C端也就是贴吧为主的年轻球迷们，节目在险冤人口的幽默梗中穿插深入浅出的足球战术知识，满足大家有所乐也有所得的内容消费需求。但对于严肃球迷而言，这档节目就显得比较寡淡浅薄、不是很好看了，而这部分的人群并不是我们针对的受众。


    如何定位“星站TV”这个产品，以及它是如何促使优秀的内容不断供给？如果是平台自制内容，怎么保证产品的质量不下跌，从而保证流量上涨？您觉得是服务好老用户重要一点，也就是专注；还是发展多元化重要一些？


    通过策划+制作+推广三个部分，用流水线的方式生产优质内容。


    +   1. 第一步，通过大量的数据分析和调研选择预判好的方向，从而策划节目格调、定位。


    +   2. 第二步，仿照HBO的模式，先流水化投入生产，过程中出现市场反馈不好的节目就砍掉，从而筛选出市场反馈好的节目，持续生产。这个过程的反复，让我们积累了宝贵的经验和对市场与平台的了解。


    +   3. 第三步，把推广单独列为一条重要业务，有专职同事负责每一个平台的规律和受众定位，制定包括上传时间、标题党创作、推荐位排期等推广细则，让每一个视频投放到不同的平台上都能“入乡随俗”，让内容可以最大概率地“火”起来。


    流水化的生产让我们在两年内生产了1600期视频作品，全网累计播放量16亿次。业务涵盖网络节目、创意广告片、企业宣传片、网络剧、视频发行推广等32条产品线。通过优质稳定的内容，我们获得各类推荐资源，包括60多个视频网站、短视频平台、自媒体平台、垂直类APP、综合资讯平台及OTT端、电视端、机场地铁等线上线下渠道的长期推荐位。


    这也形成了：好内容加速传播、受众各取所需、平台获得好内容、品牌方满意之间的正向反馈。比如LG公司，在尝试了国内不同机构做推广后，选择与我们长期合作，在全平台推广他们参与的偶像剧。'
