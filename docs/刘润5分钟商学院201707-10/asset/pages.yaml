    每过一段时间，企业界就会流行一种管理方法论，比如微软的三驾马车，惠普的惠普之道，IBM的IPD，和今天谷歌的OKR。不要忽视它，更不要神话它。你还听过或者用过哪个流行的管理方法论吗？你能讲讲，你认为这个管理方法论的本质是什么吗？来和我一起过招吧。


