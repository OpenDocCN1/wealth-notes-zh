    # ——◆ 思考题 ◆——


    最后，我想给你留一道思考题，前段时间，网上很多人在讨论，京东的市值有可能在短期之内超过百度，关于这件事情，你怎么看？你会更看好京东的未来，还是更看好百度的未来，为什么？


    好了，今天就复盘到这里。下周，我们将进入也是为期两周的一个大专题“博弈论”。终于要讲博弈论了。这是Got非常想与大家分享的话题。到底是谁，敢说经济学家之父“亚当·斯密”错了，说得大家哑口无言？下周，我将与你慢慢道来。


    另外，我还为你准备了个人篇的目录，把65个“让你更值钱”的习惯养成方法都汇总起来，方便你复习回顾。正在补课的同学们，加紧跟上来。


    # ——◆ 本周留言精选 ◆——


    我还要提醒你，咱们的同学中间藏龙卧虎，每天的留言区有非常多来自各个行业的优秀经验分享，千万别错过。我还精选了这个礼拜最精彩的5位同学的留言，给每位同学都准备了一份价值300元的小礼物，希望下次也能在每周优秀学员这儿看到你的名字。


    内容付费肯定属于幂律分布，因为边际交付时间几乎为0，就好比5分钟商学院，用户是10万，还是100万，老师的付出是差不多的。相比之下，刘润老师本身所处的咨询行业，应该属于正态分布，咨询业是个性化服务，老师精力有限的，边际交付时间很长，如果有很多企业同时找上门来，刘润老师也只能有条件的选择几家客户提供服务。


    回复：5分钟商学院，在品类内，有机会实现幂律分布，咨询则一定是正态分布。


    2016在国外出货量最大的手机品牌，不是华为，不是小米，是深圳一家叫传音科技的公司。这家公司的产品在非洲的市场占有率为40%，2016年出货量达到了8000万台。它没准就用了PEST分析：


    +   1、political 非洲很多国家的政局不稳定，而且工商、税收、专利等相关政策都不完善，投资风险高。加上经济发展滞后，消费能力有限，所以国际大品牌在这边布局晚，属于力量薄弱的蓝海地带。传音在公司成立2年后的2008年，即确立聚焦非洲市场。


    +   2、economic 非洲经济增长缓慢，失业率高。因此传音在当地投资建厂受到了政府的欢迎。在产品上，推出多品牌战略，产品涵盖高中低档，满足非洲用户不同需求。


    +   3、Social 这是传音在非洲真正出彩的地方，将当地消费者的需求研究透了。考虑到非洲用户的肤色，传音搜集当地人的大量照片，通过曝光补偿发展出适合非洲人的美肤模式。据说黑人兄弟用此手机晚上拍照效果比苹果还要好。而且，当地人有用多张卡的习惯，却没有钱买多部手机。因此传音果断推出双卡手机，现在已更新至四卡手机。另外，针对非洲人能歌善舞的习惯，传音开发出针对非洲用户的音乐手机，并且买音乐手机赠送定制的头戴或耳机。


    +   4、technical 为了满足本地用户的需求，传音在非洲本地成立了多个研发中心，由本地的工程师设计个完善APP来实现良好的用户体验。专利政策的缺失在早期有利于国产手机在非洲的开发和销售。


    分享下所在企业的一些做法：


    设置客户的满意度、重复购买率、退货率、争议纠纷比例等“共赢”指标，来平衡内部和外部；与同行业先进企业的生产工艺流程的各项指标进行对标，通过不断“缩差”，达到过程控制的不断优化，从而保证生产出有竞争力的产品；需要注意的是，比如六西格玛、6s管理等质量控制工具，需要上下齐心、从思想认识上统一，否则容易流于形式；通过增加产线投资，扩大产能和调整产品结构，适应市场需求，从而实现长期收益目标；此外，还设定每年的发明专利数量、合理化建议数量、员工培训教育时长等指标，考核创新与学习效果。不过，有时候员工培训的学习效果不好，指标难派明显，学用不统一，又占用员工休息时间，影响员工积极性。


    假设我是ofo一方，面对摩拜，要怎么才能打败它，成为行业第一。


    S：单车数量多，车身轻，生产成本低，押金低，地推速度快于对手。W：单车质量差，科技含量低，颜值低。O：政府支持共享单车事业。T：摩拜单车质量高，科技含量高。


    +   1、SO，采用增长型战略，和政府部门合作，在学校门口，各政府部门门口，公交车站投放大量单车，在数量上取得对摩拜单车的压倒性优势。


    +   2、WO，采用扭转型战略，提高单车的质量和科技含量。


    +   3、ST，采用防御型战略，对政府进行公关，要求摩拜提高单车的投放量以方便市民出行，还要注意用户数据安全。


    +   4、WT，采取充值多少送多少的活动，以低价吸引客户，以账户里的金额留住用户，同时以摩拜单车的车身重不好骑，来强调自己单车的轻便。


