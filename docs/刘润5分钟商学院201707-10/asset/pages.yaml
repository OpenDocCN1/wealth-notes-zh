    从产品生命周期的角度看：


    # 起步期：


    技术或新的模式刚开始应用，可以吸引部分早期“创新者”用户。小瘦狗呱呱坠地，希望能向上跃，变成“问题”少年；


    # 成长期：


    技术或新模式开始吸引早期采用者，市场容量急剧扩大，这时江湖险恶，能否投入资源帮问题少年跨过死亡之井，在此一战。成则进化为明星，败则退为瘦狗；


    # 成熟期：


    后期大众大量涌入，市场相对成熟，少数存活下来的明星开始产奶，很多免费的开始收费，带来充沛的现金流：


    # 衰退期：


    新技术或新模式出现，市场开始缩减，奶牛逐渐消瘦成狗。与此同时，新的瘦狗品种正在酝酿。循环往复，周而复始。


