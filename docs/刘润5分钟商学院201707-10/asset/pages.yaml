  md: '我先用这个小的例子，希望大家理解我们到底在商业篇讲了什么，我们到底怎么去理解所有这些事情背后的本质。我一直在说一句话叫每一件事情背后都有其商业逻辑。你现在理解了信息流、资金流和物流，那么我们怎么用这个商业的本质来理解今天的很多变化？


    # 无人超市在解决什么问题？


    我举个例子，比如说今天有一个非常非常火的概念，无人超市。无人超市是一个趋势吗？今天有人来撩你，说我要请你加入我的无人超市，或者有人说我去创业做个无人超市，你要想我今天是不是真的愿意把我的时间、把我的一生、把我所有的积累，把我的这些东西投资到这家公司里面去，或者干脆去创业来做这个，你要有你商业的判断。如果理解商业的本质，信息流和资金流、物流，请你想一想，无人超市到底解决了信息流、资金流和物流中间的哪一个问题呢？


    想想看，无人超市，你还是要到那个地方去买东西，你还是需要自己去取货，还是亲自把它带回家，它并没有解决任何跟物流相关的问题。第二，你还是要在琳琅满目的商品里面去挑选，你还是要摸一摸，看看介绍等等，还是用同样的方式获得信息流，所以无人超市解决的最核心问题就是在付资金流的时候，通过扫码、通过网上来完成。它并没有解决信息流的效率，也没有解决物流的效率，而是FPX11。


    # 阿里3·8扫码购到底干了一件什么事？


    我再举个例子，比如说阿里去年3月8号做了一个活动，叫做3·8扫码购，就是你去沃尔玛、家乐福这些超市，看到了一些想买的东西，这个饮料3.5一听，先别买，拿出手机去扫一下这个商品的条形码，扫完之后发现，天猫超市居然只卖2.8，便宜了7毛钱，你可能就会把这个商品放到天猫超市的购物篮，逛完了整个超市之后，你把所有那些更便宜的、被放到天猫超市购物篮里面的东西一键下单，就在网上完成了购物的行为，最后快递把东西再送上门。


    你想想这个3·8扫码购物干了什么？它其实干了一件事情，就是做了信息流这个工作，把你比较商品这个工作让沃尔玛、让超市去完成了，然后天猫超市来完成你的资金流和物流。这就相当于天猫超市把线下所有的沃尔玛一瞬间之内全都变成了它的体验店。


    # 2、创造价值：最重要的是用创新的方法不断去提高定价权。


    商业篇回顾的第二个话题，传递价值的对立面就是创造价值。


    谈创造价值这个话题的时候，我想先与大家分享一组数据，有一次我跟一个著名的地产商同台演讲，地产界非常关注人口数据，因为买房子最重要的年龄是适婚的年龄，他说根据我们的研究，90后的总人口比80后的总人口下降了44.2%，00后的总人口比90后又下降了33.7%，这是什么概念？给大家一个形象的感知，如果说80后的总人口是100个人的话，那就意味着90后的总人口是56个人，00后就是37个人，也就意味着中国的劳动力人口正从80后的100个人降为90后的56个人、降为00后的37个人，中国劳动力的人口正在剧烈下降。'
