    # 小结：认识SCQA架构


    麦肯锡咨询顾问芭芭拉·明托是一位神人。她在《金字塔原理》这本书中，除了提出MECE法则之外，还提出了一个“结构化表达”工具：SCQA架构，用标准式（SCA）,开门见山式（ASC），突出忧虑式（CSA）和突出信心式（QSCA），提高表达的结构性，突出重点。


