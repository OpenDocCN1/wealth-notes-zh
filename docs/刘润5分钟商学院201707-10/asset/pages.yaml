    CEO要求厂部每月研发款新品，于是产品专员疯狂联系供应商，有样就收，超额完成目标，厂部因此焦头烂额。究其原因，产品专员有目标却没有设定关键结果，朝着目标十分卖力，没有顾及衔接部门是否能够落地。如果设立产品专员的OKR，就应该考虑供应商的筛选，产品定位的准确度，厂部可落地的可能性及市调结果分析。这样哪怕没有新品推出，也能够把公司推新品的目的有效转化，而不是盲目出新。


    从不断创新的角度来看，Specific:我们要在哪一项新功能实现创新？是用户体验？用户界面？还是提升缺陷数；Measurable:怎样才算目标达到了呢？是评分提升？还是用户数增加？Attainable:我们可以实现从0到1的完全创新吗？如果不能，我们应该创新到什么程度？怎样的创新是团队现有资源跳一跳就能实现的呢；Relevant:这个小创新目标真的和我们最终产品质量的提升有关系吗？这个目标是现阶段最需要解决的吗；Time-Based:我们可以在30天内，拿出内测版吗？可以在收集用户意见15天以内，推出正式版吗？


    从提升满意度的角度来看，Specific:用户满意度提升到几分，是真正的满意；Measurable:怎样我们就知道用户的满意度提升了呢？是评分提高？还是用户愿意给我们宣传；Attainable:实现完全满意不可能，那能不能实现百分之九十的满意度吗；Relevant:用户满意度的提升，真的和我们正在进行的创新有联系吗？我们的行为真的是为了听取意见提升满意度服务的吗；Time-Based:我们可以在15天内尽可能多地收集意见吗？可以在30天内推出正式版进行新一轮的检测吗？


    SMART原则的重点在于，我们要真正站在目标实现的角度看问题，而不是在自己的想象中猜测实现问题。


    无印良品有一本员工业务操作手册 MUJIGRAM，2000多页，十几册，目前还在增加和完善。手册的目的是为了“将依赖个人经验和直觉的服务进行‘机制整合’，使它作为规范延续下去”。以后即使员工走了，经验和规范还在。


    手册做的非常细致，包括衣服怎么叠成三角形，应该怎么搭配衣架，甚至是怎么迎宾打招呼都有记录，通过这样的何时、何地、何谓、何人等方方面面的记录，使得任何一个新人都可以
    bestuur短时间内习得工作内容。MUJIGRAM就是通过PDCA将员工的经验总结提炼出来，成为规范后再运用到经营服务当中。通过多个大大小小的循环，使得该手册日益完善。PDCA的一个要点就是形成闭环，有始有终，这也是最近罗振宇老师节目中说到的靠谱：事事有着落，件件有回应。这样的成才才是可预测的，靠谱的。如果企业的员工都能通过PDCA成为一个可预测的靠谱员工，那么企业整体效率将大为提高。


