  md: '# 客座教授 | 未来，什么样的新物种能获得机会？


    第42周客座教授 | 未来，...


    前人的思考，我们的阶梯，欢迎收听“刘润·5分钟商学院”。


    《5分钟商学院》的同学们，


    大家周末好！


    这周的客座教授，我们请到了场景实验室创始人吴声老师。他是京东集团终身顾问、吴晓波频道战略顾问，还曾作为联合创始人参与创办罗辑思维。近两年，随着他的两本书，《场景革命》和《超级IP》相继问世，吴声老师的很多商业观点开始在中国互联网领域风靡开来，刷新了很多业界领袖的商业思考。


    这一周，他和我们分享了如何才能养成一个类似papi酱的超级大IP，以及在飞速发展的未来，什么样的商业物种会被淘汰？什么样的能够获得机会？


    ![](img/67d8d5e736c7e9ca429132df17016a0e_54_0.png)


    IP现在是个特别热的词，影视界都在抢文学IP，但是改编出来的作品口碑却不一定好，有的火了，有的扑街。您对这种现象怎么看？您眼里的“超级IP”是什么样的？有些明星也把自己叫IP，这种IP怎么发展才能保持热度？


    IP已无疑已成为娱乐圈、文化圈、投资圈提及的高频热词，被资本疯狂追逐。目前关于IP的热议基本存在于影视剧、游戏、漫画、图书等泛娱乐领域，谈的是热门剧集，是小说天价改编权，是影视周边衍生产品的开发。


    然而，IP的商业价值绝不仅于此，之所以首先在泛娱乐领域受到追捧，正是因为泛娱乐离内容很近。但当万物皆媒的时代来临，IP不只代表一种新的话语体系和故事叙述方式，更需要从泛娱乐形态快速渗透到新商业生态全维度，进阶为超级IP。


    # 什么是超级IP？就是有内容力和自流量的魅力人格。IP唤醒对群体的尊重，超级内容共建人格，也众筹态度。超级IP有如下关键词：内容、原创、人格、流量、商业化。具体表现为：


    +   1. 内容能主动发酵，比如“局部气候”一镜到底的完成度是通过高标准的社会化内容体系来保证的。


    +   2. 原创但可衍生和再创作，比如《西游记》从经典文本到反复解构、恶搞和各类创作过程中，衍生出了大量类似《大话西游》、《悟空传》的全新IP。


    +   3. 足够差异化的人格，意味着真实可信赖，特别不普通，比如岳云鹏不是优秀的相声演员，却仅仅因为萌贱而饱受欢迎，这就是魅力人格体。


    +   4. 可期待的订阅机制，意味着以季为周期的周期足够维系用户刚刚好的关注热度，比如花点时间和知乎的邀请回答，这体 meine 就是信任代理。


    +   5. 离交易很近、有变现能力的流量，也就是说无论自营还是代理，都能有较高的转化率和重复购买率。如和刘润去北极，和吴晓波去南极旅行就是典型的IP旅行，这些IP自带内容流量。


    +   6. 以信用的代表的社交货币，如Airbnb的Belong Anywhere、神州专车用户体验的安全感等，这些都意味着IP居于重塑信任的社交链条节点，担负着新信用体系的形成中枢。


    +   7. 崛起于特定平台而超越单一平台，也就是说真正的超级IP将拥有跨越特定平台的爆发力，papi酱在微信公众号红利下半场进入仍能吸聚千万量的用户，完成自身的IP化。咪蒙禁言和毒舌电影封号后依然以新姿态或新马甲广受追捧就因为好内容有用户一路追随。


    现实生活中符合我们标准的超级IP有很多，漫威、Apple、乌镇、supreme这些自带内容流量的产品形态都属于超级IP。


    最后一个问题，在明星演艺、代言经济向明星IP经济进化过程中，新网红可以不是明星，但明星必须是新网红。明星IP到新网红的成长需要注意以下几点：


    持续稳定的内容输出；稳定的情绪表达；产品或服务匹配网红特质；基于前端网红个体和后端商业结构，形成网红的品牌化构建；网红本人以“我”为中心，商业端以“用户”为中心。


    另外，决定能否成为超级IP的要素，是有没有人格化的内容表达体系，有没有深层次创造流量、形成新连接机会的内容体系。


    吴声老师在新书里说到，每一次新的更迭与爆发，一定会随着大部分商业物种的灭绝。想请问下，未来什么样的商业物种会被淘汰？什么样的能够获得机会？个人如何进化适应？


    细数人类发展史，从电气时代、信息时代，再到移动互联、物联网、智能设备重构的人机互联时代，每一次更迭，都能引发商业效率的逻辑转变、社会阶层与文化的秩序重置、观念与创造力意义的变化，以及新的商业物种爆发。


    大数据与人工智能等技术正在引领第四新物种爆炸，商业规则正在快速发生变化，新的产品和服务、新的模式与业态层出不穷。


    针对这一轮新的变化，我们提出了打造新物种的8大核心要素，分别是：意义覆盖、反经验、更细节、场景流、在在线信用、设计力、混合内容和人格化。它们共同构成了新物种的造物逻辑，也是新物种构建独特性方法支撑。


    什么样的新物种会被淘汰？什么的能够获得机会？这个两个问题本质上是一个问题。岛屿书店创始人增田宗昭说：“在任何行业做，第一就是生存。”这不仅是说我们要做最重要的事情，更重要的是要做那些独一无二和不可替代的，并且能够形成唯一性的识别特征。新物种最大的价值就在于用独特性定义唯一性。这一点无论对于公司和个人都同样适用。'
