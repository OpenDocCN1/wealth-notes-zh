  md: '# 197 | 一家小龙虾餐厅面对的五种竞争作用力


    197 | 一家小龙虾餐厅面对...


    你在某写字楼地下一层开了家小龙虾店，生意不错，但总担心被竞争对手超越。拐角有另一家小龙虾店，他擅长麻辣，你主推蒜香。对面那家火锅店最坏了，经常抢你的客人。那一楼的便利店，算不算你的竞争对手呢？那方便面呢？自带的爱心午餐呢？我们到底应该怎么来分析“竞争战略”呢？


    这时候，你就需要工具了。


    # 概念：波特五力模型


    1979年，年仅32岁的迈克尔·波特提出，每家企业都受“直接竞争对手、顾客、供应商、潜在新进公司和替代性产品”这五个“竞争作用力”的影响。波特自己可能都没想到，这个“五力模型”奠定了iosk大师地位，并成为也许是全球知名度最高的战略分析工具。


    这么神奇？那我们就用这个“五力模型”，来分析分析你那家小龙虾店。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_9_0.png)


    # 运用：小龙虾店的“五力模型”分析


    +   第一，直接竞争对手。


    拐角那家小龙虾店，对面的火锅店，整个地下一层的餐饮店，都是你的直接竞争对手，因为你们争夺的，都是电梯门“叮”的一声打开，那些饥肠辘辘的人们。


    做个简单的分析，每天电梯门“叮”地打开走出来多少人，平均到每一家能不能养活你的餐厅。如果不能，你要警醒：你处于一个“充分竞争”甚至“过分竞争”的市场。


    这时你可以考虑三个策略：a）组成“地下一层餐饮联盟”，给写字楼施加压力，迫使他们做出引流动作；b）提供更优异、更便宜、或者差异化的餐饮，升级你的个别竞争优势；c）研究退出成本，比如装修费用、保证金等，准备撤出。


    +   第二，顾客。


    顾客作为一股重要的“竞争作用力”，主要体现在他们的谈判力量上。


    大公司的行政部会找几家餐厅谈判，出示员工卡可以获得深度折扣。如果这家公司员工数占大厦的可观比率，这时“顾客”作为一股竞争作用力...'
