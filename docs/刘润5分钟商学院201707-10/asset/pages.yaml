    # —— 下周内容预告 ——


    不知不觉中，《刘润·5分钟商学院》已经讲完三个季度了，时间过得好快。咱们的学习队伍每天都在壮大，对于新加入的同学，建议大家每天跟一篇新的，追两篇旧的，听音频、看文章、看精选留言。《5分钟商学院》的同学们藏龙卧虎，一定不要忽略了留言区，那里有大量的各个行业的经验分享。


    对于持续跟随的同学们，我也非常地敬佩你们，一个人能“逼迫”自己坚持学习，这种能量，是非常可贵的。假以时日，你和那些“生命如此不易，何必自己难为自己”的人，会有巨大的差异。


    接下来，5分钟商学院将进入第四季度工具篇。君子性非异也，善假于物也。我将用一个季度的时间与你讨论，如何利用“工具”来提升商业、管理和个人的效率。下周开始，我会和你分享一些非常有用的战略分析工具：


    +   MECE法则：透过结构看世界

    波特五力模型：一家小龙虾餐厅面对的五种竞争作用力

    波士顿矩阵：你的公司有现金牛，明星，问题，和瘦狗吗？

    SCQA架构：你不是没有重点，你是没有结构

    通用电气矩阵：打不赢你，那我就躲死你


    刘润


    很多人occan写文章、做PPT以及汇报工作时，常被挑病说只是单纯的观点罗列、逻辑混乱，下周的这些内容可以帮你提升思考和表述的结构性。


    每家全球知名的咨询公司，都有自己的看家本领和“黑话”，听完这些内容，你就可以听懂咨询顾问在说什么，甚至和他们对答如流。


    更重要的是，学会了这些工具，你就能分析自己的业务组合，制定相应的竞争策略，这个对于公司发展非常重要。


    # —— 本周留言精选 ——


    我精选了这个礼拜最精彩的5位同学的留言，给每个同学都准备了一份小礼物。欢迎同学们踊跃留言，写留言的过程，是你整理思路、强化理解的过程。写下来自己感悟的学习效果，会远远好于只听一遍。


    在当下这样一个时间碎片化程度高、人人随时在线的时代，专注就显得尤为重要。结合之前润总的课程还有隔壁古典老师专栏里教过的时间管理的方法，我想可以利用几个工具来保持专注：GTD、番茄钟、每天三件事。


    利用GTD的时间管理手段，把每项工作都分解到具体的任务，并设定一个完成的期限，给自己增强紧迫感，好好利用威胁的正面作用。利用番茄钟，设定三十分钟不受打搅的番茄时间，集中完成任务，做到只专注于此刻。利用隔壁古典老师专栏里介绍的每天三件事小工具，每天只列出最重要的三件事，努力完成它，并定期进行复盘，可以保证把稀缺的注意力都放在重要的事情上。


    来自个人篇191 | 藏在“威胁、此刻、重要”后的大猩猩


    我是做美发行业的，以前开一家店，经营项目要从洗剪吹、烫染护、造型打理产品等各个方面去入手，还要配备各个岗位的人员。但是培养一个优秀的发型师至少要三年，市场竞争又太厉害，人员越来越难找，成本也在上升，生意越来越难做。


    听完上半年的课，我决定砍掉其他所有项目，只做染发（头发色彩）这一块，为此我专门去广州一家色彩学院进修怎么做颜色，还把店铺搬到了写字楼，和各大团购合作，还使用了定价策略在社群里拍卖、提前预约，这样就能只专注于操作颜色，把其他全甩给其他人。现在开业十天了，正在按5分钟商学院的商业组合拳在市场拼杀。


    来自个人篇192 | 你是小公司里的胖子，还是大公司里的瘦子？


    又到了高考收获季，许多望子成龙的家长们都期望给孩子选一个一蹴而就的好专业，但其实在这个快速迭代的互联网时代，以确定的好坏选专业是不太可能的事，抱着看一步、走一步、精益创业的思维，加上时间轴的阶段性调整，在学习中不断摸索前行，才可能取得好的成果，而不是单纯依靠最初的确定性方案。


