  md: '思维可视化，到底有什么用？看上去如此简单（其实也并不简单）的方法，可以增加与会者的参与感，更重要的是，让一群人能用全景画面同步思考，甚至共同创作，最终极大增强群体记忆，帮助跟进落实。


