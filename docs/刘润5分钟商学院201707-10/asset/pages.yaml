  md: '我那个时候在高中的学习成绩还可以，于是被邀请去参加了学校的辩论会，我作为四辩站在场上，但让我非常屈辱的是，整场辩论会结束之后，我们队伍赢了，但我居然一个字都没有讲。因为辩论会这件事情需要急智，快速的智慧，你刚刚犹豫几秒钟已经有人站起来了，所以整场辩论会结束我一句话都没有讲，我只说了两个字，结束时和对方辩友说谢谢。当时特别屈辱，我知道这种能力不是你看着书就可以具备的，它必须要练习、练习、练习。于是我就做了一件事，我去找到了狮城辩论会的录像带，找到很多这种资料，每天每天都在练，参加各种各样的辩论会，参加各种各样的演讲比赛。一直到1994年我读了大学之后，因为练了很长时间，所以说我在大学一年级和二年级拿到了全校最佳辩手。所以不管你用什么样的方式来学习《5分钟商学院》第三季度个人篇的内容，我们学的很多内容都是技能，技能一定要靠练习才能变成你自己的。


    我再举个例子，我自己一直在写作，今年《5分钟商学院》要出版的四本书加起来一共100万字，这个文字量是怎么写出来的？我Prim追溯到我自己第一篇文章的时候，23年前我写过一篇文字发表在《中学生报》上面，就讲我要去读大学，当时引用了一句诗叫做“酒卧沙场君莫笑，古来征战几人回”，非常豪气冲天。这篇文章寄出去后刊登了，出版社还给我寄来了一张5块钱的汇款单，那件事给了我很大的激励。从此后我就不断地写东西，到今天写《5分钟商学院》的专栏之前，我已经出过一本诗集，写过若干本小说，并且已经写过五本畅销书。所以所有这些积累都是导致今天《5分钟商学院》能在一年之内写出100万字，最终交付你，让你能够今天拿回去的一个重要原因，就是持续写，持续地公开写，持续坚持不断地往下写。


    所以我给大家两个建议：训练这两种技能，这两种技能特别重要。第一个建议大家能够回去成立一个演讲俱乐部，就是在你的同学中间，在你的周围同事中间成立演讲俱乐部，从现在开始每周去练习演讲。第二个建议大家可以申请一个自己的微信公众号，或者简书上的一个号，或者说其他微博、博客的方式，持续公开地写，坚持写下去，我相信你写三年、五年、七年一定会获得非凡的成就。所有个人篇我们讲的能力都要通过练习，最终才能内化成你自己的。


    # 2、人与人最大的差异是认知的差异。


    在个人篇我还想与大家分享一个话题，就是个人与个人最大的差别是在于认知的差异。如果有一件事情你认知的级别和维度不够，你怎么修炼都到不了下一个层次。


    我举几个例子来说明下这件事，比如关于演讲有一个基本认知，演讲到底是你在讲还是别人在听？我曾经说过这么一句话，有强烈表达欲的人是做不好演讲的。不少人觉得费解，为什么？因为你有表达欲，你想把自己表达出来，你想按照自己的逻辑、思路，淋漓畅快地把自己想讲的东西讲出来，这是不对的。一个真正的演讲最终是要关注听众的逻辑，要非常克制地像拿刀一样在自己身上去雕琢，把自己演讲的方式雕琢成用户能够接受的方式。只有以听众的逻辑去讲，而不是以自己的表达去讲，才能做好一个演讲。这就是我说的第二点认知的差异，你如果连这一点都没有一个正确的认知，你可能永远都没有办法达到一个很高的演讲水平。


    我再举个例子，关于学习也有一个巨大的认知差异。我曾经说过我一年可能至少读100本，甚至有时候会读到两三百本书，有同学可能觉得特别说异，你哪来的时间读这么多书？我是作咨询行业的，有些读书的方法可以和大家分享下：我读很多书，我自己又写过书，所以我特别清楚，书里面是有其一个核心的逻辑主线，很多案例是来证明这个主线的，所以要想真的快速获得一个行业的知识，我基本的读书方法不是精读，不是一个字一个字地读，对一个作者最大的尊重是理解他的核心逻辑。怎么办呢？比如说区块链，我就把区块链领域最畅销的、最完整的、最有价值感的十本书全部都买回来，翻这十本书的目录，把十本书的目录之间建立对应关系、建立关联，然后我找一张大白纸，在大白纸上画好一个逻辑架构，当我终于把这个领域所有的逻辑全部都梳理清楚了，再把这本书里面一章一章的内容对应上，把许多问题补充进去，这样大概一两天我就能把这十本书全部都翻完了。翻完之后一定还有些不懂的，我再去请教这个行业的大拿，投资区块链的投资人或者区块链中间的从业者等等，因为你带着问题、带着框架去请教，非常有的放矢，最后你就可以在很短时间之内读十本书，甚至读二十本书，并且快速获得这个领域真正的干货。所以我们说读书也是有方法论的，你要把认知提高到这个水平上面。


    第三个我再举个例子，创新。很多人认为创新不就是天上掉下来一个苹果砸中你吗？或者说一拍脑袋能做出一个绝妙的想法吗？我们认为这个认知就是不对的，创新是有套路的。我在第三个季度的个人篇里面专门介绍过一个叫做系统创新理论，系统创新理论中间有一个方法叫做减法原则。举个例子，比如说有一家公司过去是做洗涤液的，洗涤液是两种主要成分：一种主要成分叫做活性成分，就是专门来洗干净衣服的，另外一个就是溶液，溶液和活性成分溶在一起，加上一点香精香料就做成一个东西叫洗涤液，然后卖给你。有天你说我要创新了，怎么做呢？如果你认为创新就是苹果砸中你的脑袋，你就坐在那里，未必能想出好的办法，如果你用系统创新理论，就是所谓的套路创新，你可能会说我们试试减法策略，什么叫减法策略？把洗涤液里面那两个核心成分活性成分和溶液拿掉一个，我们不拿掉溶液，拿掉活性成分，把能洗干净衣服的东西拿掉，很多人觉得很可笑，说你是洗液、洗涤液，把活性成分拿掉了，你有溶液还能干什么呀？不要着急，这就是所谓的系统创新。这时候接着想，光有溶液的洗涤液，也就是说洗不干净衣服的洗涤液有什么价值？不要着急否定它，你想想看，今天有很多女人洗衣衣服，衣服其实并不脏，他其实只是想把衣服做出一种焕然一新的感觉，所以说活性成分虽然能洗干净衣服，但是对织物的衣服还是有一点伤害的。如果我们能够把洗涤液里面的活性成分给拿掉，只剩溶液你去洗洗看，你发现只是把并不脏的衣服洗得更新了，所以它不过它不能叫洗涤液了，叫衣物清新剂。


    你今天买到的衣物清新剂就是没有活性成分的洗涤液，衣物清新剂今天在中国、在全世界卖得非常好，它的创新并不是从天上掉下来苹果砸中你的脑袋，而是用一套系统创新的方法论，也就是所谓的套路。要记住创新也是有套路的，当你有这样认知的时候，你才会有源源不断创新的主意。'
