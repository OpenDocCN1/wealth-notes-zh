    ![](img/67d8d5e736c7e9ca429132df17016a0e_119_1.png)


    分布图，是把数据放在图表中，寻找它们的关系；


    ![](img/67d8d5e736c7e9ca429132df17016a0e_119_2.png)


    系统图，是画出要素间的相互作用，寻找规律。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_119_3.png)


    时间顺序视觉图


    当你想表达的概念，有先后顺序，与时间相关，就ct图，流程图，历史图。


