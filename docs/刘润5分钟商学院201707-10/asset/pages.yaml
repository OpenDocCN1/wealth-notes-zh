  md: '例如在做小米手环一代的时候，很多人都纳闷为什么我们不做显示屏。在当时，市场上的智能手环普遍还是四位数的价格，并且由于续航太短，用户新鲜几个月甚至几周就懒得充电，将其束之高阁。所以我们的第一要务是要让用户“习惯于佩戴”这件事。如何做到让用户习惯于佩戴手环呢？那就是长续航。只有不用取下来充电，一口气能戴到一个月以上，用户才会习惯于这个东西在手腕上的存在。众所周知，长续航的最大杀手就是显示屏，这是一个高耗能的部件，因此，我们干掉了显示屏，在续航上做到了极致。最后的结果大家也都知道，“长续航”直到今天，都是华米科技旗下所有产品的共同特点，也是我们独有的优势。


    第二个例子是我们自有品牌的华米运动手表。去年夏末，我们推出了华米 AMAZFIT运动手表。这款产品我们一直在强调它不是一块智能手表，而是运动手表。跟市场上已有的智能手表相比，华米运动手表的几个重头的功能——不论是内置GPS、蓝牙听歌还是超长续航，所有的功能参数和工业设计都是为了更好地为运动服务，所以那会儿我们为这个产品想出的一
    slogan 是“扔掉手机去跑步”。有了GPS运动轨迹，可以直接连接蓝牙耳机'
