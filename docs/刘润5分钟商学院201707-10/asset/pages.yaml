    君子性非异也，善假于物也。我们在这部分讲了咨询公司都在用的战略工具、博弈论工具、决策工具、思考工具……只有工具才能帮你充分利用好每一分钟时间，高效解决问题。


    # 5商说明书第2项：学习方法：怎么学更高效


    5商的兵器库已经完整交付了。对于刚刚加入的新同学，怎么学会这260件兵器会更有效？我们来谈谈学习方法。


    首先，全年4个体系的内容，学习方法其实有很大区别。


    商业篇的内容，在英文中叫做 Business knowledge，学习方法主要靠记忆。这个东西我以前不知道，现在知道了，记住就行了。


    管理篇的内容，在英文中被称为 management skill，它是一种技能，没有办法仅仅通过记忆学会，必须通过在日常工作中练习才能习得。这就好比，你光知道抛球的4个步骤还不够，必须通过练习才能抛好球。


    而个人篇，更多是态度 Attitude 层面，它的学习方法主要是感悟，在人生经历中间被点醒、被触动，它更加难学，是用心来学习的。建议结合文中 how（如何实现）的部分，有意识地提醒自己，把这些态度层面的东西变成习惯。


    学会一个知识可能需要4天时间，习得一项技能可能要4个月，改变一个态度却可能需要4年、40年，确实不容易。我们一起加油。


    留出学习时间追赶进度。


    每天固定留出一段学习时间，听音频、看文章、看精选留言，日拱一卒、持之以恒。学习专栏时，一定不要错过的就是每天的留言部分。13万来自不同行业的同学们贡献了很多有价值的思考、分享了很多精彩案例，相信可以加深你对每天话题的理解。


    输出是最好的训练。


    试着养成一个习惯，把你觉得有收获的内容分享给同事、身边朋友，试试在3分钟之内，用你的语言，把你学到的知识讲给别人听，那些你讲不明白的地方，或者别人听不懂的地方，就是你理解的薄弱点。记下来，重新理解后，再复述。'
