  md: '# 211 | 不完全信息博弈：你有你的“空城计”，我有我的“木马计”


    听完第210课的“重复博弈”后，你是不是觉得，诚信，也就是愿意与这个世界“无限度重复博弈”的心态，终于给了这个尔虞我诈的世界一个终极解，给博弈论画上句号了呢？


    其实并没有。到目前为止，我们讨论的博弈论，都基于一个假设：信息，对博弈双方是完全对称的。但在现实生活中，大部分博弈的信息是不完全对称的。


    # 概念：不完全信息博弈


    我们再次回到第207课讲的“囚徒困境”。作为一个囚徒，你知道都不坦白，会各判1年；谁独自坦白，谁立即释放，另一人判15年；都坦白，各判8年。先不管你怎么决策，但这些信息，至少你们双方都是完全知道的。这叫“完全信息博弈”。


    但是，万一警察给他坦白条件，和给你坦白条件不一样，而你却不知道？万一你的仇家给了另一个囚徒好处，他宁愿自已重判，也要让你多坐牢呢？万一另一个囚徒得了重病，一心想多坐牢，让监狱养着他呢？这些信息，也许你就不知道了，但它们会严重影响你的博弈策略。这就叫“不完全信息博弈”。


    在现实生活中，“不完全信息博弈”是远远多于“完全信息博弈”的。我举个例子。


    A公司通过长期耕耘，占据了支配性的市场地位和丰厚的利润。另一家B公司非常眼红，也想进入市场分一杯羹。这时，A公司就面临一个艰难的选择：是通过第42课讲的“撇脂定价法”，降低售价，让B公司觉得无利可图，从而阻止其进入市场呢？还是不降价，默许B公司进入市场呢？


    阻止，当然会带来利润损失，但保住了市场份额；默许，虽然没降价，但B公司进入后会分掉市场份额，也会带来利润损失。显然，A公司的博弈策略是：比较阻止成本，和默许成本，看谁更高。


    同样，对于B公司，要不要大举投入、拼死进入呢？如果A公司阻止成本更高，它很可能会默许自己进入，自己就有利可图；但如果阻止成本不高，A公司一定会降价求生，自己就会血本无归。所以，B公司的博弈策略也是：比较A公司的阻止成本，和默许成本，看谁更高。


    现在，有趣的问题来了。“阻止成本高不高”这个信息，A公司自己很清楚，但B公司却不知道。这就是“不完全信息博弈”。


    不完全信息博弈，就是指在不充分了解其他参与人的特征，策略空间，以及收益函数等情况下的博弈。这个话题涉及到太多的数学知识，比如“贝叶斯纳什均衡”，“海萨尼转换”等等你听得懂，或者听不懂的概念。我们今天不说这些让你头疼的事。我们说普通话。


    商业篇042 | 撇脂定价法：为什么手机越卖越便宜


    # 运用：博弈智慧《36计》


    我们假设A公司的阻止成本很高。在“完全信息博弈”中，也就是这个信息两家公司都知道，那么，不加阻止，默许B公司进入市场，是对双方最有利的“纳什均衡”，虽然因此A公司会有所损失。


    但是，现在不是“不完全信息博弈”嘛，我的阻止成本高，只有我知道，你不知道啊！那你就有一个特殊的博弈策略：空城计。你可以对着媒体哈哈大笑，说：欢迎友商加入市场，等你进入了，我会关门打狗，让你25年都赚不到钱。


    那B公司呢？他既然可以用“空城计”，你就可以用“木马计”。你派人假装面试A公司的各个高级职位，和副总们深入交流他们的真实运营情况。如果发现A公司在虚张声势，就可以乘虚而入。


    在“不完全信息博弈”下，维护和打破信息不对称，成为双方最重要的策略。理解了这一点，你再看看我们传统的博弈智慧《36计》，什么瞒天过海，围魏救赵，声东击西，暗渡陈仓，混水摸鱼，当然还有空城计等等，本质上都是一回事：通过制造信息不对称，获得策略优势。


    “空城计”，在博弈论中有一个类似的策略，叫做“斗鸡博弈”：两只公鸡狭路相逢，谁张牙舞爪、看上去更凶，就会吓退另一方，不战而屈人之兵。这个“斗鸡博弈”，在大国之间的政治博弈中，经常使用。都是故意制造信息不对称，模糊你对他博弈策略的预测性，吓退对手，不战而胜。


    # 小结：认识不完全信息博弈


    不完全信息博弈，就是指在不充分了解其他参与人的特征，策略空间，以及收益函数的情况下的博弈。


    在信息不完全对称的情况下，你可以用“空城计”虚张声势，他可以用“木马计”刺探军情。整个商业篇，我们都在讲，互联网最大的作用之一就是：消灭信息不对称。


    终于学到了博弈论，你现在知道，消灭信息不对称是商业模式，制造信息不对称，其实也是商业模式。


    你有你的“空城计”，我有我的“木马计”


