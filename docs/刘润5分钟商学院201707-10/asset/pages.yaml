  md: '# 220 | 基于数据决策：

    决策，就是与这个世界的博弈


    听完四课决策工具，你是不是也觉得：决策，就是一门手艺啊。尤其德尔菲法这种古老的手艺，简直就是组织专家集体、轮流、多次拍脑袋啊！难道就没有更先进的决策工具吗？一定要把这种说不清、道不明的steam，
    “刻意练习” 成艺术，才能提高决策水平吗？


    不一定。


    # 概念：基于数据决策


    你有没有注意到，前几课讲的，都是 “信息匮乏” 时的决策。比如，你不知道麦田里，最大的麦穗在哪里，只好前三分之一观察，中三分之一验证，后三分之一选择。但如果你知道最大的那
    “一群” 在哪里？有了这个信息，你的决策方法，可能会完全不一样。


    你可以把 “决策”，理解为与这个世界的博弈。如果你能知道这个世界的底牌，就更有可能赢得比赛。这个世界的底牌，就是信息。更准确地说，是信息的载体：数据。


    我举个例子。


    你在避暑胜地丽江拿了块地，打算开发旅游项目。立刻，你面临一个重要决策：客源是定位于本地呢，还是外市、外省？


    本地和外省客源需求大不相同，比如需不需要住宿，要不要民俗表演。一旦大举投资，但主流客源不喜欢，所有投入都会打水漂。


    怎么办呢？别急着拍脑袋，看看这个世界的底牌吧。


    你请专业咨询公司帮你做调查。调查数据表明，丽江的客源54%来自广东。你大吃一惊。为什么是广东呢？但不管为什么，这就是这个世界的底牌。你决定针对广东人的喜好设计丽江的避暑产品。


    这就是 “基于数据的决策”。


    # 运用：“看清世界的底牌”的三种方法


    听上去很高大上，那我怎样也能 “看清世界的底牌”，基于数据决策呢？你要掌握，或者至少了解这三种方法。


    +   第一，对显性数据的统计。


    比如，《5分钟商学院》十几万用户，有多少是男同学，多少是女同学？这会决定我主要靠才华，还是靠颜值；用户最多在哪些城市？这会决定线下大课在哪儿举办；你们集中在几点收听？这会决定我发布音频、回复留言的关键时间。


    关于自身运营的显性数据，可以建立IT系统；关于行业趋势的显性数据，可以购买统计报告。


    +   第二，对隐性数据的调查。


    但对于一些隐性数据，比如用户希望交通工具有什么创新？这是用户内心的偏好。要掌握它们，你可以用 “调查” 的方法。


    调查不是找100个人问：你希望马车怎么改进？福特说，如果你这么问，用户会说，我需要一匹更快的马，他们想不出汽车的。


    用户不知道自己可以要什么，这是调查的难度所在。怎么办呢？你可以试试 “焦点小组”。


    微软在产品发布前，常会邀请典型用户，比如办公室文员，家庭妇女到装有单向玻璃的观察室，请他们独立完成一项任务，比如网上下购物，并用摄像头发记录他们的所有行为。工程师们站在玻璃的另一边，看着用户
    “居然” 这都不会，那都不会，捶胸顿足。但，这才是真实的用户，大家坐下来研究所有细节，一条一条改。


    这就是焦点小组。看他怎么做，而不是怎么说。


    +   第三，对全体数据的分析。


    过去，与这个世界博弈，你看不到他的底牌。但到了互联网时代，这个世界突然把底牌一堆，都给你看。你发现他前面摊开10万张牌，但只有14张有用的。你突然明白，我们与这个世界的博弈，从信息匮乏时代，走向了信息泛滥时代。


    那怎么办？要从信息匮乏时代的 “增加数据”，变为信息泛滥时代的 “减少数据”。这就是现在如日中天的大数据。


    怎么利用大数据帮助决策？


    在第35课 “互联网金融” 我们讲到，凭什么我的车几乎不开，要和你每天开30公里，交一样 Vázquez？这是因为没有个体数据。所以开车少的人，必须为开车多的人承担保费。但现在有些车企，在汽车出厂时安装了数据设备，监测你开了多少公里，会不会打着左转向灯向右转，会不会踩着刹车转弯，然后为每个人的保费单独定价。这样，我就可以少交保费了。这就是利用精准到个体的大数据，帮助决策。


    那你拥有庞大的数据，我能不能用呢？试着和拥有数据的机构合作。酒店为什么要收押金？因为不知道谁诚信，谁不诚信，怕你住完不给钱就走。阿里用它的大数据，做了 “芝麻信用分”，把数据变成信用产品。作为酒店，你可以说：芝麻信用分750以上，不用交押金了。这样，你的酒店体验，也会大大提升。


    # 小结：认识基于数据决策


    决策，就是与这个世界的博弈。如果你知道这个世界的底牌，也就是数据，你的决策质量将大大提高。


    在信息匮乏时代，你可以用统计的方式，获得显性数据，用调查的方式，获得隐性数据；在信息泛滥时代，你可以用分析的方式，从大数据中获得决策支持。


    这就是 “基于数据的决策”。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_79_0.png)


    决策是与这个世界的博弈。如果你能知道这个世界的底牌，也就是得到更多数据、分析数据传递的信息，决策精确度就会大大提升。


