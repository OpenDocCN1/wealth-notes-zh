    ![](img/67d8d5e736c7e9ca429132df17016a0e_17_1.png)


    # 留言精选


    大客创新互联网咨询-Jacks… 28

    当年eBay大举进入中国市场时，对入驻商家收费。淘宝就采取了临时性的“恐死你”战略，坚持免费三年。使得对互联网电子商务可行性还存疑的中国商家，一边倒地加入了阿里巴巴的淘宝网。

    之后，把eBay打出中国市场后，淘宝玩起了天猫业务，改为收费。虽然商家很不情愿，但以无路可退了。

    但这是面对市场吸引力高，但竞争实力弱的情况。'
