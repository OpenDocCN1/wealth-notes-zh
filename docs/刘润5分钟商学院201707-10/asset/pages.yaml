  md: '这种“公地悲剧”其实随处可见，比如过度海洋捕捞，偷偷污染排放等等，都是因为海洋、天空是“公地”，“我不捕捞，你也会捕捞”的这种“捞一把心态”，把保护环境变成了“公地悲剧”。


    # 运用：解决“公地悲剧”的两种方法


    那怎么克服，或者利用“公地悲剧”呢？解决“公地悲剧”问题，一般有两种方法。


    第一，私有化。


    比如刚才的牧场。把牧场切割为10份，分给10个家族。牧场一旦私有化后，牧民的捞一把心态就会消失了，他们会有内生的动力，在放牧和保护牧场之间找到平衡。


    比如刚才的预算制。把所有的预算，分到部门。当“这笔钱是我的”的时候，管理层就不会有“不花白不花”的心态了。


    比如三根救命毫毛，不能给唐僧师徒四人。不然早用完了。观世音很聪明，都给了孙悟空，这就是公共资源私有化。


    通过私有化，公地悲剧中的“坏的纳什均衡”就被破坏了。


    第二，强管制。


    思想教育是重要的，但却未必能从根本上解决“公地悲剧”这个特殊的“坏的纳什均衡”。如果有些公共资源没有办法私有化，比如海洋，空气，可以用收费，发放许可证等制度，来实现强管制。


    比如刚才的牧场。可以把牧场围起来，每头牛收100元的放牧费，发放养殖许可证。这实际上是对公共资源的定价，和管制。


    比如刚才的预算制。“公共预算池”的使用，必须CEO单独特批，并考核其单独的投资收益率。


    比如海洋，天空。国家会强制规定禁捕期，网眼大小等等。


    那如果我们反过来，能不能通过“设计”公地悲剧，反向获得利益呢？过去的皇帝很讲究“御臣之术”。他们会故意设计一块公共权力，就是不讲清楚这归谁管，让大臣们在公地上打得你死我活，彼此争斗制衡，消耗内力，同时还对君王死心塌地。


    御臣之术的本质，就是故意制造“公地悲剧”。


    # 小结：认识公地悲剧


    公地悲剧就是，虽然善用公共资源，可以为集体，和每个个体带来长远的收益，但是个体总会受到“何不捞一把”的诱惑，采用自私的短期策略，导致公共资源走向耗尽。


    公地悲剧，是一个典型的“坏的纳什均衡”。'
