    # 5商说明书第9项：第二季归来


    有了这260个前人的智慧，和这一年扎实的商业基本功，大家在商业世界里就不再只是摸索、试错，而是能够站在一个更高的阶梯上，直接避过雷区、看明白很多事情背后的商业逻辑。这些，都让你蜕变成一个更强大的自己。


    但这还不够，作为自己的CEO，你一定不会满足于只知道越来越多的“是什么”，而是希望能够回答，真实世界里遇到的每一个“怎么办”。


    在5分钟商学院第二季（实战篇）里，我会带领大家从基本功的修行，进阶到格斗术的练习，全面升级你的商业战斗力。让你不仅了解每件事情背后的商业逻辑，看懂“是什么”；更重要的是，学会运用这些概念和知识，解决真实世界中的每一个“怎么办”。


    但是现在，让我们先一起放个暑假，此刻，我已经开启匆峰的徒步之旅，接下里还要去德国游学7天，大家也可以趁着十一长假好好休息一下，调整到最好的状态。半个月后，10月16日，5分钟商学院第二季（实战篇）将正式上线。心急的同学们，现在可以去淘宝搜索罗辑思维，进入罗辑思维旗舰店，即可提前锁定第二季。期待在第二季实战篇里，和大家继续相伴前行。


    历经一整年的时间，5商武器库终于完整交付给你了。不管你是今天刚加入的新学员，还是已经陪随学习了一年的老学员，经过认真地学习和实践，一定会有巨大收获。未来的你，会感谢今天你的努力。


    再次感谢你加入《刘润·5分钟商学院》，并祝愿所有5商的学员都能成为商业世界的巨人。'
