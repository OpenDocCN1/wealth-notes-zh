  md: '# 231｜1:1会议：请把和下属的1:1会议，放入日程表


    231｜1：1会议：请把和下...


    你一直非常器重李雷，给他最好的待遇，给他最大的责任。你期待着有一天他能成长起来，独挡一面，甚至成为你的合伙人。但突然有一天他对你说：老板，我考虑了很久很久，决定暂时离开大家，去尝试一些新的机会。虽然非常不舍，但希望老板批准。


    你五雷轰顶。为什么呢？我们这里有什么不好吗？他说，没有，这里非常好，但去做那件事情，是我的梦想。你立刻不知道说什么了，梦想最大哪。怎么办？按照第99课讲述的，安排一次“离职面试”吧。但同时，除了离职面试你还必须反思一件事情：为什么他“考虑了很久很久”，你居然一直不知道！


    这是因为：你们严重缺乏沟通。


    啊？我们平时沟通的不少啊，经常开会，甚至还半夜通话讨论项目呢。没错，但这些沟通，都是“按你的需求发起，被你的目标主导，用你的逻辑进行”的沟通。那 些沟通的关键/javasc词是“你”。你们缺乏的是“按他的需求发起，被他的目标主导，用他的逻辑进行”的沟通。这些沟通的关键?词是“他”。在以“你”为核心的沟通中，是听不到“他”的心声的。


    那怎么办呢？你可以试试一种以“他”为核心的沟通工具：1:1会议。


    # 概念：1:1会议


    什么叫“1:1会议”？


    我在微软时，公司要求管理者，每两周，至少每个月，要与每个直接下属开一次1小时的，单独的“1:1会议”。那时我有29个直接下属，分布在上海、香港、台北、首尔，和班加罗尔。就算每个月和每个人花1小时，那也意味着21个工作日中，有3.5天都在开“1:1会议”。这效率也太低了吧！我把29人召集在一起，1个小时搞定，就不行吗？


    真不行。


    有一次，我和一位直接下属开“1:1会议”。我问：今天你想和我聊点什么？她有点犹豫，但还是终于开口说：“我知道以客户为中心很重要，我知道客户永远是对的，但有个客户实在太不讲理了。”“哦？他怎么不讲理了？”于是，她控制住自己，讲述了客户如何居高临下，反复无常。


    我知道，这是一个“沟通技巧”的问题，于是说：“来，我们一起回这封邮件。”我们一边回邮件，一边逐字逐句地讨论为什么这么写。邮件发出去后，她非常高兴。


    这件事我很快就忘了。一个偶然的机会，我通过第三方之口知道，她常和别人说起这件事，很感激。我那一刻突然意识到，原来一个有效的“1:1会议”，是如此重要。如果迟缓、无助积累下来，她会不会某天对我说“我考虑了很久很久，决定暂时离开大家”呢？


    到底什么是“1:1会议”？1:1会议，是管理人员定期与每位下属进行的，以对方为中心的一对一谈话。公司里绝大多数沟通，都是从你到他，从上到下；而1:1会议，是难得的从他到你，从下到上的沟通工具。你用“1:1会议”的方式，把时间投资给他，可以收获更好的业绩，更高的效率，和更大的忠诚度。


    # 运用：有效进行“1:1会议”的几个建议


    第一，严格定期沟通。


    在你的日程表上，早早锁定未来1年的与每个员工的“1:1会议”。开会时，主动合上电脑，把手机调到震动状态。千万不要迟到，更不要最后一分钟取消会议。会议时间可以是1小时，但最少30分钟。总之，认真对待，而不是有空就聊。


    第二，少说少问多听。


    这不是你的演讲会，要尽量遵守“25/25/50”原则：25%问，25%说，50%听；这不是项目回顾会，不要上来就问：你手上的几个项目，进展怎样？“1:1会议”的核心是“他”，请“他”事先准备好讨论清单，让他拥有这个会议，而不是被你“叫来谈话”。


    第三，主动帮助员工。


    1:1会议的最终目的，是解决问题。遇到什么困难吗？我如何帮助你？有没有不开心？我如何帮助你？团队合作愉快吗？我如何帮助你？最近学到了什么新东西？还想学什么？我如何帮助你？每一个问题背后的终极问题都是：我如何帮助你？


    第四，及时表达感谢。


    关心员工职业发展，询问最近情绪变化。但最重要的是，要对他做得正确的事情，表达感谢。面对员工，缓慢而坚定地，用5秒钟说：谢谢。试一试，非常有用。


    # 小结：认识1:1会议


    1:1会议，是管理人员定期与每位下属进行的，以对方为中心的一对一谈话。公司里绝大多数沟通，都是从你到他，从上到下；而1:1会议，是难得的从他到你，从下到上的沟通工具。你用“1:1会议”的方式，把时间投资给他，可以收获更好的业绩，更高的效率，和更大的忠诚度。


    进行有效的“1:1会议”，建议：严格定期沟通，少说少问多听，主动帮助员工，及时表达感谢。


