  md: '# 196 | 透过结构看世界


    从今天开始，5分钟商学院将进入工具篇。君子性非异也，善假于物也。我将用一个季度的时间与你讨论，如何利用“工具”来提升商业、管理，和个人的效率。接下来两周学习各种战略分析工具，今天，我们先从MECE法则开始。


    某公司将2017年定为品牌战略年，小王接到领导安排的写作任务，要求充分阐述公司的品牌主张。小王有了灵感，半天就把稿子交上去了。领导浏览一分钟后就指出稿子的思路太狭隘，我想要一栋房子你却只打了一堵墙。小王回去之后加班加点，查阅了几十万字的资料，从十几个角度解读了公司品牌，但领导又给小王泼了冷水，所有的观点都并列在一起，逻辑层次很混乱，就像是把砖头、瓦片和墙壁、屋顶相提并论。


    在写文章、做PPT以及汇报工作时，很多人都有过与小王类似的经历，总被人挑毛病，说逻辑混乱。要避免这样的悲剧，你务必要记住MECE法则。


    # 概念：MECE法则


    MECE法则，是麦肯锡咨询顾问芭芭拉·明托在《金字塔原理》中提出的一个思考工具，它是 Mutually Exclusive Collectively Exhaustive
    的缩写，意思是“相互独立，完全穷尽”，也常被称为“不重复，不遗漏”。


    听上去很玄乎，但其实很简单。MECE法则，就像是拼图游戏。你用一张张碎片拼出完整的图，如果拼得正确，最后一定是一张不多，一张不少。


    我们开会讨论新游戏的目标用户定位问题。我们打算为哪个群体，开发下一款游戏呢？先把所有可能的用户定位都列一列吧。大家集思广益，摆出了一些拼图碎片：男人，小孩，成年人，老人，女白领，宅男，二次元少女。


    看上去很丰富。但是，这些拼图碎片，明显地违反了MECE法则，是不可能一张不多、一张不少地拼出完整的用户画像的。


    首先，这些碎片里有大量的重叠：男人，和小孩有重叠，叫小男孩；宅男，和老人有重叠，叫孤僻的老头。其次，这些碎片还有遗漏，它漏掉了那些不是二次元、也不是白领的年轻女性，比如：文艺女青年。


    那应该怎么列呢？你可以在第一层，从性别的角度把用户分为：男人，女人；再在第二层，从年龄的角度把用户分为：小孩，年轻人，中年人，老年人。在每一层，这些拼图碎片都符合“不重叠，不遗漏”的MECE法则。


    回到最开始的案例。为什么小王被批评逻辑混乱？第一次，领导说“我想要一栋房子你却只打了一堵墙”，是因为报告违反了MBCE法则的“不遗漏”原则；第二次，领导说“把砖头、瓦片和墙壁、屋顶相提并论”，是因为报告违反了MECE法则的“不重叠”原则。


    MECE法则，是一种简洁有力的、透过结构看世界的思考工具。这两周，我们将分享很多著名的基于“结构化思维”的战略分析工具，比如SWOT分析、五力模型、波士顿矩阵、平衡计分表等等，它们宏伟的殿堂，都是建立在MECE法则的基础之上。


    # 运用：锤炼“MECE法则”的三个心法


    锤炼“MECE法则”这个结构化思维的马步和梅花桩时，需要注意哪些心法呢？


    第一，谨记分解目的。


    把整体层层结构化分解为要素时，要谨记分解目的，找到最佳分解角度。


    对于同一个项目，如果目标是分析进度，那就按照过程阶段来分解；如果目标是分析成本，那就按照工作项来分解；如果目标是分析客户消费特征，那就按照性别、年龄、学历、职业、收入等来分解。


    第二，避免层次混淆。


    你和团队一起头脑风暴，探讨一个问题：如何卖出更多的衣服。大家提出了很多想法：一、开拓电商渠道；二、开展网络营销；三、减少服装的成本以降低价格；四、改进服装生产流程，提高生产效率。


    这些想法中的第四项“改进服装生产流程，提高生产效率”，是第三项“减少服装的成本以降低价格”的具体方法之一，把它和前三项列在一起，会造成逻辑层次的不清晰，会给思维带来混乱。


    用MECE法则做层层分解时，要确保每一层都不能与其他层次混淆。


    第三，借鉴成熟模型。


    前人已经对商业、管理、个人做过大量研究，并形成了许多结构分解模型，除了我在这两周会讲到的之外，还有PEST分析、营销4P、战略分析3C、麦肯锡7S分析等等等等。大家可以直接拿来用，不要重新发明轮子。


    # 小结：认识MECE法则


    MECE法则是指我们在分析问题时，把整体层层分解为要素的过程中，要遵循“相互独立，完全穷尽”的基本法则，确保每一层的要素之间“不重复，不遗漏”。


    MECE法则是“结构化思维”的基本功。锤炼MECE法则时，要注意三个心法：谨记分解目的、避免层次混淆、和借鉴成熟模型。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_7_0.png)


    做PPT、汇报工作时，很可能因逻辑层次不清断，带来思维混乱，你可以借助已有的结构化思维模型帮你分析问题，确保每一层的要素之间“不重复，不遗漏”。


