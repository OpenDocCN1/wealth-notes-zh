    # 第一部分：商业篇


    商业篇我们一共讲了65天的课程，我想用两个大逻辑帮助大家重新提炼一下。


    # 1、传递价值：通过提高信息流、资金流和物流的效率，降低定倍率


    第一个大逻辑，我们一直在讲的其实就是传递价值。什么叫传递价值？我用三个关键词来与大家做一个整体的梳理，叫做信息流、资金流和物流。'
