    ![](img/67d8d5e736c7e9ca429132df17016a0e_119_6.png)


    发散思维视觉图


    当你的思维没有逻辑结构，没有时间顺序，而比较发散时，可以试试：思维导图，鱼骨图，曼陀罗图。


    第227课讲的思维导图，帮助你从一点出发，发散性地拓展思维；


