    不管是阅读，还是通过专栏学习，或者拜访牛人。要想有收获，就要将学到的知识拆解，和自己知识库中的旧有知识连接，形成一张网。然后通过写作、实践、以教为学输出。最后你得到的，还是一些鸡毛的零碎观点。

    不要将信息当做知识，不要以为听到，看到就是得到。唯有正确的思考，才能铸造价值。

