  md: '# 239 | 知识管理：用软件帮助收集篮“大肚能容”，吃尽知识


    概念：知识管理


    在142课“让大脑用来思考，而不是用来记事”中，我给你介绍了一套“收集，处理，回────────────────”的方法论：GTD（Get Things Done）。在“收集”这一步，我把“印象笔记”当成“大脑的外接移动硬盘”，把什么都往里装，从而做到清空大脑，再忙也不焦虑，专注于思考。


    但是，你是不是也有一个疑问：你这个“收集篮”听上去很好，可是怎么才能做到“什么都往里装”呢？一份“真实”的打印文件，怎么才能放到“虚拟”的印象笔记里呢？名片呢？白板笔记呢？就算是电子邮件、微信文章、网页新闻，又怎么放到印象笔记里呢？


    想要用好GTD，“收集”是第一步，也是整个GTD的基础。如果不能把“什么”（也就是“一切”）都装进收集篮，GTD会逐渐失去价值和意义。可怎样才能把“什么”都装进篮子呢？今天，我就给你介绍一些工具。


    142 | GTD：让大脑用来思考，而不是用来记事


    # 运用：几种信息收集工具


    第一，手机扫描仪。


    你想把供应商的提案扫描进电脑，在出差途中看，怎么办？用扫描仪？别了。大部分中小公司，基本可以告别扫描仪了。你可以试试用手机扫描。


    我常用一款微软出的手机扫描软件，叫Office Lens。打开Office Lens，对准文档，手机会自动识别文件边界。点击拍照，就会自动把文件从背景中抓取出来。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_141_0.png)


    国内也有是一款非常优秀的手机扫描软件，叫“扫描全能王”。


    在236课“白板”，我讲到在办公室、在家、在机场休息室，我都会在白板上记录思考，那怎样才能把这些白板笔记，放进收集篮呢？可以试试“扫描全能王”。


    用“扫描全能王”对准白板，它会自动识别白板边界。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_141_1.png)


    点击“拍照”，你就能看到把角度摆正、拉平、做过增强和锐化的白板图。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_141_2.png)


    Office Lens会把所有扫描文件，自动同步到微软的笔记软件OneNote；扫描全能王会把所有扫描文件，自动同步到你的印象笔记。


    你打开印象笔记，就能看到刚才的扫描文件了。值得一提的是，印象笔记支持在图片里搜索文字。


    比如我在印象笔记里搜索“创新”这两个字，刚刚从“扫描全能王”同步过来的这张白板图，就会被显示出来。而且，图片中我手写的简直到不忍睬的“创新”字样，都会被高亮标记。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_141_3.png)


    第二，名片识别软件。


    如果你是印象笔记的高级用户，可以直接把印象笔记当成名片识别软件，把名片扫描进手机，同时存在印象笔记，和手机联系人中。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_141_4.png)


    更神奇的是，如果这张名片的主人有领英（Linked-in）账号，它会自动从领英账户获取这个人的最新信息，让你甚至可以扫描旧名片，获得新信息。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_141_5.png)'
  merge: -1
