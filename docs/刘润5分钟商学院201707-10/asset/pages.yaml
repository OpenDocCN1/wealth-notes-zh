  md: '# 205 | 商业模式画布：商业模式就是“你怎么挣钱”吗？


    你某天突然被灵感砸中脑袋，有了个创业想法：我能不能做个人脸识别系统，帮助服装店用智能摄像头识别顾客，再自动匹配她们在社交账户里的文字、照片、视频等等，识别出顾客的性格、爱好、婚否、消费能力等，让店员有针对性地推荐销售，提高成交率呢？


    你一激动没忍住，立马拉了几个好朋友揭竿而起，做了个原型，开始到处见投资人。投资人听你嗓里咕咕说了45分钟之后，点了点头，冷静地问：


    你的商业模式是什么？


    这是几乎每个投资人都会问的问题，但你觉得很无语：刚才我讲的，难道不是商业模式吗？


    # 概念：商业模式画布


    商业模式，和战略一样，是一个被广泛使用，但没有官方定义的概念。很多人问商业模式，其实就是问：你怎么挣钱。但《商业模式新生代》的作者，亚历山大·奥斯特瓦德认为，一个完整的商业模式，应该包括4个视角，9个模块。他提出了著名的：商业模式画布（Business
    Model Canvas，BMC）。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_34_0.png)


    # 运用：商业模式画布的4个视角和9个模块


    我们试着用商业模式画布，来回答一下这位投资人的问题。


    “很好的问题。关于‘熟悉的陌生人’这个项目的商业模式，我们是从4个视角“为谁提供，提供什么，如何提供，和如何赚钱”来考虑的。我将基于这4个视角，从9个方面，详细回答您的问题。”


