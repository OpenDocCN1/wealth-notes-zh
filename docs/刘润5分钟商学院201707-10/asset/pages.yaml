  md: '来不好说，一旦把品牌定位成了韩风，将来韩流不流行了，再改定位会非常麻烦。我们内部也很激烈地讨论过这个问题，我的观点是：


    韩国政府自1997年，定下了韩国经济发展的三个主力产业：电子、互联网、时尚娱乐，经过近10年的持续投入和发展，这三个方向相辅相成，发展顺利，今后会在相当长的时间，保持相对的竞争优势；中韩之间的文化认同感很强；而且“韩风”作为一个大的服装品类，目前还没有代表性品牌，正是非常好的机会。


    经过讨论后，大家认同了我的观点，在起名字时直接就叫“韩都衣舍”，英文名“HSTYLE”，H就是韩国这个单词在中文和韩文中的发音的第一个字母，也是“韩风”的意思。品牌定位就是“韩风快时尚”，口号就是“没空去韩国，就来韩都衣舍”，目标就是成为“韩风”的代表品牌，希望有一天能做到“韩都衣舍”
    = “韩风”，以此占领消费者心智。


    所以说，我们不是逐步找到自己品牌定位的，是从一开始就有非常明确的定位，只是在此后的具体业务实践中，如何进行产品开发、如何跟韩国的时尚界进行合作、如何进行品牌建设等方面，是一个长期的、逐步探索和试错的过程，这中间经历的坎坷和挫折，实在是太多了，这个不作为今天的重点，今后有机会再交流。


    我的第二个问题是，目前电商流量越来越集中到分类的前三位，如果重新开始做一个电商服装品牌，您会提供什么建议与经验？如何实现差异化生存？


    提到新做一个电商服装品牌的建议，首先我个人是持非常正面和积极的态度的，只是需要把握三个基本原则：


    # 1、聚焦小众


    不是说人数少才叫小众，而是一定要有非常明确的目标用户，有清晰的品牌定位，一个品牌不可能为所有人服务。作为新品牌，切记定位模糊，一定andel“谋定而后动”。


    起名字要有足够的“锐度”，要好听好记好传播。互联网时代，品牌名称的重要性要远大于传统线下市场，前期一定不要太急，要花大力气，把品牌名字、slogan（口号，最好不要超过8个字）都想好，相关的商标，微博，公众号等等知识产权都要保护好。


    # 2、产品为王


    品牌定位确定好以后，如何紧紧围绕品牌定位把产品做好，是重中之重。做产品时，很多时候是需要做取舍的。比如韩都衣舍的产品要求是“款式多、更新快、性价比高”，对于一个快时尚品牌来说，这三个方面的排序是：款式数量、更新速度、产品品质，不是说产品质量不重要，而是说要在保证款式数量和开发速度前提下，做到最好的品质，如果把这个优先级顺序颠倒过来，那就是完全不同的另一个...'
