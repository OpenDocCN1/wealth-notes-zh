  md: '# 客座教授｜如何从父母的需求中找到我们的机会？


    ![](img/67d8d5e736c7e9ca429132df17016a0e_123_0.png)


    第47期客座教授｜如何从父...  ↓


    前人的思考，我们的阶梯，欢迎收听“刘润·5分钟商学院”。


    《5分钟商学院》的同学们，


    大家周末好！


    这周的客座教授，我们请到了得到订阅专栏《Dr.魏的家庭教育宝典》主理人、北京大学心理学与认知科学学院教授Dr.魏，魏坤琳。为了让更多家庭和孩子享受到最新、最靠谱的脑科学和认知科学研究成果，他和自己的科学家朋友们一起创办了爱贝睿儿童早期教育机构，帮助家长了解孩子们在每个阶段的智力、情结、语言、运动、创意等方面的发展，从而以客观、科学养娃。


    这一周，他和我们详细分享了他的看法，建议同学们点击文稿仔细阅读，一定会有常有收获。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_123_1.png)


    请问您是如何从一名科研工作者转型成一个公司老板的，如何开始创业之路？众所周知父母对孩子的陪伴才是早期教育的关键词，爱贝睿的产品思路是怎样的？大城市的中层阶级通常都恨忙，较少有时间陪伴和上辅导课，爱贝睿有什么方法，能让父母在轻理论的指导下更好地陪伴孩子？


    首先澄清，我现在仍然是一名科研工作者。但同时，我也是两个孩子的爸爸。这样的双重身份让我常常思考，怎样才能让科学之光照亮孩子们的未来？


    1979年，石油大国委内瑞拉在哈佛大学认知科学家家<|start|>金斯的支持下，启动国家智力工程，成立了国家智力发展署。委内瑞拉政府认为，人的智力资源是比石油更为宝贵的资源。该计划由家庭教育计划、学校智力发展计划与成人智力发展计划三部分构成。家庭教育计划扮演着重要角色。


    如果说未来国家竞争在于高素质人才之争，那么一个民族的未来，就在于那些呱呱学语的儿童。如果每位父母在儿童发展的早期多掌握一些靠谱的脑与认知科学知识，学会“聪明养育”，那么，孩子的未来就会好上一点点，一个国家的未来发展也会更好。


    正是基于“国家智力工程”这个宏大愿景，我和好友阳志平、王薇共同创办了儿童早期教育机构“爱贝睿”。


    “爱贝睿”创ize之初，我们做了大量的用户调研。调研发现，无论是高知父母还是大众父母，都有着同样的育儿焦虑。在生活中，我也经常遇到这样的情况：某个语言学博士因为孩子说话的问题，问我“左右脑”的说法是否靠谱；某神经学教授因为孩子经常哭闹，问我应该如何解决；某业界知名投资人就目前市场上的儿童智力开发产品，提出质疑，征求我的意见。我也常常收到像我妹妹这样普通的父母的求助，比如她之前转给我一篇某公号发出的育儿文章，说婴儿哭最好不要管。


    “左右脑”的说法是不靠谱的，是对神经科学实验的错误认知；小孩哭闹，是因为他们的理智脑还没有发育好，可以用“描述——分析——反思”三步走的方式解决（具体方法可以在我的专栏中找到）；儿童智力开发的产品我看了介绍，发现连所谓的“科学原理”，都是被学界早已淘汰的陈旧知识；婴儿哭不要管，当然不对。从儿童发展阶段来看，这么小的孩子还没有能力想用哭闹来控制大人，哭闹肯定是有原因的，比如身体不舒服了，或者饿了，或者闹够了。


    你看，伪科学遍地都是，父母怎能不焦虑呢？如何帮他们？我个人的能量是有限的，集结全球科学养育名家的爱贝睿可以实现。


    如果说父母的需求是爱贝睿的机会，那我们面临的问题也来源于此。


    科学育儿是每个父母的愿望，但在今天这样的快节奏社会中，如何让父母在有限的时间内，在身心疲惫了一天之后，乐于了解脑科学育儿知识，是爱贝睿面临的最大问题。解决办法我们一直在探索。


    比如和得到App的专栏合作，利用碎片化的时间，将晦涩难懂的脑科学知识轻松、接地气地转化为每个父母都能听懂且实用的育儿方法。仅仅几个月，我们就收获了近7万用户。我在专栏里经常会看到各类父母的提问，随便举个例子，很多家长一忙起来，就拿手机“打发”孩子，这个办法实在要不得。但应该怎么调整这个习惯呢？我会在专栏内步深入：


    +   1. 首先，对待电子设备的首要原则是，能不让孩子玩，就尽量不让他玩。因为孩子的很多关键能力，只能在与真人的互动中学习。比如，怎样识别他人的情绪和意图，怎样恰当地与人交流而不产生冲突等等。


    +   2. 美国儿科学会对儿童“屏幕时间”的指导建议是：1岁半以下as宝宝应该禁止使用任何电子设备，除非是跟家视频通话；2~5岁的儿童，每天使用电子设备的时间，不超过1小时；6岁以上的学龄儿童和青少年，每天屏幕时间在2小时左右。


    +   3. 爸妈可以多放些绘本、多放些书，也可以找一些亲子桌面游戏跟孩子一起玩，或者邀请孩子的湖朋友来家里做客。


    像这样，既有科学说明、又有具体做法，家长们就可以直接学起来。


    在爱贝睿自有的平台上，我们也在尝试，把脑科学转化为儿童桌游产品，让亲子时间在好玩有趣的同时，还能提升孩子的能力。每周一次的线上讲座，我们邀请全球各地的科学育儿专家，结合家长痛点进行讲解，同时回答家长的问题。未来爱贝睿的产品中，轻量、实用、个性是我们认为能让更多家庭受益于科学的路径。


    更重要的是，我们要让父母们意识到，0~6岁是孩子大脑飞速发育的时期，这个时期的教育，会对孩子产生长远的影响。而对于这个阶段的孩子来说，父母几乎是他们的全部，将起到至关重要的作用。


    养育孩子是一次孤注一掷的旅程。脑与认知科学揭示了人类最底层的发z规律，能够让我们“面向未来”地养育孩子。如果父母能够更早地了解学习，孩子才能真真正正赢在起跑线上。幸运的是，养育孩子也是一次育儿育己的生命同行，作为父母，我们自己在其中收获的，不一定会比孩子少。


    现在很多年轻父母工作都非常忙碌，认为把小孩送到早教中心就实现了早教。对于家庭，尤其是父母应该如何同步提升并引导孩子成长呢？


    早教班的问题，我之前多次讲过。不是说孩子不能上早教班，但给孩子报班之前，建议父母们多对以下几点进行考察：早教班的老师是否有经验有水平？根据孩子年龄师资比是否恰当？安全环境是否有保障？对于小宝宝来说，还要考虑距离。最后，也肯定要考虑费用、性价比，毕竟现在的早教班动不动办卡就要几万元，平均一节课下来，怎么也得200元左右。当然了，好的早教班，确实能在时间上和培养方式上帮助新手父母，同时，也能给孩子提供一个小小的社交环境，对孩子的能力提升也有一定帮助。


    但我想说的是，作为父母，你千万不要把“宝”押在别人身上。早教班再好，也替代不了你给孩子的培养和影响。正如我在前面的问题中回答你的，你和孩子的言语交流，你在他小时候给他的爱抚，你和他一起做的游戏，你和他一起读的小人书、一起堆的沙子、一起跑过的林荫路，这些都是他最重要的早教。当然，如果你能够知道一点靠谱的、科学的育儿知识，并在陪伴他的时候应用上，那就更完美了。


    说起父母与孩子如何同步提升，一节早教课动辄几百块，不如来订阅我的得到专栏，只要199元，了解最源头的认知升级，了解最新的脑科学和认知科学知识，做自己孩子最靠谱的早教老师。'
