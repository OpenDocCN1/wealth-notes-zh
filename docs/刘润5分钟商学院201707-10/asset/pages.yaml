  md: '# 238 | 电子书：你每年读的书，有100本书吗？


    238 | 电子书：你每年读的...


    # 概念：电子书


    在《5分钟商学院》的商业篇、管理篇、个人篇的6场线下大课，我向在现场听课的学员们推荐了一张我精挑细选的书单，包含了20本我认为非常值得阅读的，有助于对变化的商业世界认识升级的书籍，并希望大家如果没有读过的话，1年之内尽量读完。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_139_0.png)


    推荐完之后，很多同学“哇”地一声惊叹，一年之内读完，也就是两周一本。我这么忙，哪有时间啊。


    其实我也很忙，很忙很忙。但是，我一年用各种方式读的书，可能至少不下一百本。在碎片化信息、标题党文章泛滥的时代，读书，反而显得越来越重要。当你试着把一篇1500字的标题党文章，写成一本15万字的书的时候，很多人写着写着就放弃了，因为自己就能把自己批评得体无完肤，实在写不下去。所以，能正规出版的书籍里的知识，相对来说是更经得起推敲，更体系化的。


    那么，怎样才能高效地读书呢？在第155课，我介绍过我快速读书的“方法”。今天，我给你介绍我快速读书的“工具”：电子书。


    155 | 快速学习：如何用20小时，快速学习？


    # 运用：阅读电子书的两点建议


    +   第一，能读电子书，不读纸质书。


    读电子书好，还是纸质书好？我同意这是非常个人的“习惯”。我常听有人说：


    > “电子书不符合我的习惯，没有了拿在手里的那种质感，闻不到墨香，没有翻书的过程，听不到翻书的声音，不能在上面圈圈点点，实在是很别扭。而且，看电子书万一没电了咋办？”


    这就是习惯。习惯，是多年形成的让自己舒适的行为。如果以“享受阅读体验”为目的，你当然可以在一个阳光明媚的下午，墨香和花香交融的后花园，捧一本小说，品一口咖啡，读一段人生。


    但是，如果你以“高效获取知识”为目的，我个人会建议你改掉读纸质书的习惯。读电子书，至少给我带来了很多明显的好处。


    首先，阅读量提升。以前出差时，我会带一、两本书放在李箱里。很重，也不方便随时阅读。现在出差，我读电子书，随买随看几本，充分利用碎片时间。


    其次，笔记可搜索。你在纸质书上做了很多笔记，然后很满意地把书往架子上放......这些笔记你就再也找不到。你用荧光笔、马克笔、记号笔，不管什么笔做的笔记，都是“易存不易取”。但电子书，用手指一划，就做了笔记；用手机一搜，就历历在目。


    再次，互动性加强。你可以看到一句话，被323人标记过；你可以看到一本书，别人的评论；你还可以把你摘录的金句，随手分享到朋友圈，和大家讨论。互动，有助于更深刻地理解这本书。


    如果你读书的目的“高效获取知识”，那就把纸质书当成人机癖好去享受，把电子书当成效率工具去掌握吧。


    +   第二，选择好的电子书阅读器。


    我推荐三个电子书阅读器：得到，多看阅读，和Kindle。这三个阅读器各有特色，彼此补充，可结合使用。


    # 小结：认识电子书


    越是在碎片化时代，越是要系统性读书。怎样从书中“高效获取知识”？


    我建议：能读电子书，不读纸质书，结合使用多种电子阅读器，在得到上“每天听本书”，在多看阅读上“语音朗读全书，笔记自动同步，分享到朋友圈”，以及用Kindle在飞机上享受读书乐趣。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_139_1.png)'
