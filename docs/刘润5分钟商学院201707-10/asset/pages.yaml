    2、最有效的激励原则，是要满足对方的需求。对大多数职场人士，最简单粗暴的方式是给钱；工作过程中受到尊重、宽松的工作氛围等，是更高一级的激励；而对于自身期许较高的智力劳动者，自我实现的机会，更能抓住他们的心。


