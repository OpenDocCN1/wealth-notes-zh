    # —— 本周留言精选 ——


    搜索引擎的使用还是有很多技巧的，不 会用技巧，会使效率降低很多。分享几 个技巧：


    +   1、除了-号，还可以用+号，限定搜索 结果中必须包含的元素。不管加号还是 减号，前面都必须加空格。


    +   2、搜索pdf文件，我通常是用文件 名.pdf，比如宇宙大爆炸.pdf，同样有 效。


    +   3、通过空格加多个关键词，逐渐缩小 搜索范围。这里和润总搜索沙发茶垫一 样，需要在结果中得到反馈，修正关键 词重新搜索。


    苹果自带“通讯录”APP，除了常规的电 话、电子邮件、生日等常规字段以外， 还可以把联系人放入建立的各种群组， 方便发信息和发邮件。自带“提醒事 项”APP，除了可以设置时间提醒外，还
    可以根据地点设定提醒，比如设置来到 或者离开某地就触发提醒，还可以任意 定义是否重复提醒以及重复提醒的频 次。自带“日历”APP，除设定日程和时间 提醒外，还可以设置出发时间提醒，录
    入出发地、目的地及出行方式，即可按 照自带地图的功能为你计算花费时间从 而倒推出出发时间。


    另外，“时间块”的APP，设计的颗粒度刚 好和润总的一致，也是半小时，可以按 照个人需求设置事项分类，以半小时颗 粒记录时间开销，然后可以生成统计和 趋势，自己就可以针对改进调整。


    钉钉也是个不错的工具，里面有一个“星 任任务”功能，可以发起新任务，涉及到哪 些人、任务截止时间等，推荐。


    我从小就梦想当一名人民教师，最后选 择了自己喜欢的科目，也很幸运的当上 了一名光荣的人民教师，所以整个工作 过程中特别享受。我对这份职业的理 解，不是从赚钱出发的，大家都知道教
    师的工资很低，特别像我们这种小城 市。我更多的是因为，


    +   1、在这份工作能够获得成就感，当你 看到坐在台下那么多双期待的眼神，而 且当他们听懂了你讲的内容，变成喜悦 的眼神的时候，幸福感爆棚。


    +   2、作为一名教师，工作对象是学生， 学生一批又一批，都是鲜活的个体，他 们每个人就是一个有趣的故事，一点 儿都不枯燥。可能说出来会让大家觉得 我有点变态了，周六日的老师是放假
    的，而我却还偶尔自发的去学校备课啊 之类的。家里毕竟是舒适区，坐在办公 室里，更有老师的味道，让我能够更加 专注去做。


    这或许就是润总说的，这世上的事情， 不分工作还是生活，只分喜欢做还是不 喜欢做，值得做还是不值得做，有能力 做还是没能力做。把喜欢做的、值得做 的、有能力做的事情当成目标，把赚钱当
    成结果，你会发现工作甜似生活。


    提高效率最重要就是：形成习惯，持续 改进。每件事情，都尽可能固化成习 惯，不要消耗脑力去思考。然后，每天 去优化，每个环节去改进，逐渐成为高 效能人士。


