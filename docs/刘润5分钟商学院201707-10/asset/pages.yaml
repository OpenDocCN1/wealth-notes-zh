  md: '# 258 | 个人篇总结：所有问题，最终的最终都是个人的问题


    ![](img/67d8d5e736c7e9ca429132df17016a0e_195_0.png)


    258 | 个人篇总结：所有问...


    商业，是我们与外部的关系；管理，是我们与内部的关系；个人，是我们与自己的关系。我特别喜欢一句话：仁者如射，射者正己而后发，发而不中，不怨胜己者，反求诸己而已矣。简单来说，就是：不管什么问题，最终的最终，都是自己的问题，都要从个人身上找原因。


    在整个个人篇，我给了你65个威力强大的兵器，提升你的“战斗值”，有时间管理能力、谈判能力、沟通能力、写作能力、学习能力、思考能力、逻辑推理能力等等等等。但今天，我想把所有的内容，升华为两个核心。


    # 概念：个人篇总结


    第一，最可怕的能力，是获得能力的能力。


    是不是听完个人篇的65课，你就把这些能力，自动复制到自己体内了呢？这并不现实。


    我在153课“知识技能态度”里讲过，知识（Knowledge），比如数学知识，商业知识，是靠大脑来学的，学习的方法是“记忆”；技能（Skill），比如演讲能力、写作能力，是要靠手来学的，学习的方法是“练习”。能力的获得，符合我在第139课“不断更新”里讲到的“时间律”：能力这东西，偷不来、抢不来、要不来、买不来，获得它的唯一方法，就是用时间换来。


    用高效而可怕的勤奋，把时间换成能力，就是获得能力的能力。


    1993年，复旦大学在新加坡狮城舌战辩论赛上为中国赢得冠军，蒋昌建引用了一句“黑夜给了我黑色的眼睛，我却用它来寻找光明”，掀起了那一代学子的辩论热潮。我当时在读高中，被学校抓去参加辩论赛。我平常也主持不少活动，但辩论和主持不同，需要急智。稍微犹豫1秒，别...整场辩论会结束，我只在最后致谢的时候，站起来对对方说了两个字：谢谢。这成了我的奇耻大辱。我意识到，没有什么能力，是可以不通过练习就能获得的。于是我专门找来各种各样的辩论会视频学习，并找一切机会练习。读大学时，我最终获得了南京大学的最佳辩手。我知道，这个称号，是用“高效而可怕的勤奋”换来的。


    很多人说，润总你演讲很棒。我在2015年，讲了126天课，每天6小时；2016年因为开始做《5分钟商学院》，减少了，但也讲了93天。很多人说，润总你文章写得真好。我第一篇公开发表并拿到稿费的文章，发表于23年前。之后，我坚持写作20年，期间写过1本诗集、2本小说、出过5本书，写出《出租车司机给我上的MBA课》那篇脍炙人口的文章时，我已经坚持写作12年。因此今天，才能不断更的每天给大家输出《刘润5分钟商学院》。


    所以，我建议你，从现在开始，和其他《5商》同学一起，组织演讲俱乐部，开始讲，公开地讲，持续公开地讲；从现在开始，在微信公众号，或者简书上开始写作，公开地写，持续公开地写。从现在开始，用“高效而可怕的勤奋”，把时间换成能力。


    第二，人与人最大的差别，是认知的差别。


    人最大的悲哀是在低层次上早早形成了自己的逻辑闭环。


    比如，提到演讲时，我讲到一个认知，“表达欲很强的人，是做不好演讲的”。为什么？因为演讲不是让自己酣畅淋漓地表达，而是让听众酣畅淋漓地吸收。所以，演讲的中心，不是你，而是听众。你需要克制自己的表达欲，让听众舒服。如果这个认知改不过来，你也能讲话，但很难成为一个真正的演讲高手。


    比如，提到阅读时，我讲到一个认知，“把书从头读到尾的人，是不懂学习的”。为什么？因为作者也不是从头到尾写一本书的。他是先定主题，再画结构，再做目录，然后一章一章地写。你读书也应该一样。目录，其实是这本书的骨架，章节是这本书的血肉。作为咨询顾问，我必须高效、快速地学习，每年至少读100本书。我的读书方法是，买10本同类书籍，对着目录画出结构图，然后快速阅读补充，再请教业内专家。一个字一个字地读，是把学科书籍当小说。


    再比如，提到创新时，我讲到一个认知，“创新未必是被苹果砸中脑袋，而可能恰恰是用流水线生产出来的”。我讲到过把洗衣液里的活性成分拿掉，变成“洗不干净衣服的洗衣液”，最后创新出“衣物清新剂”的案例。


    你可以回到个人篇，在每一篇寻找这些认知，让自己真正获得巨大的升级。


    # 小结：回复整个个人篇


    个人篇是我非常喜欢的一组兵器，因为我相信，所有的問題，最终的最终，都是自己的问题，都要从个人身上找原因。


    今天，回顾个人篇，我特别希望你能记住两件事：1）最可怕的能力，是获得能力的能力；2）人与人最大的差别，是认知的差别。


