    价）的效果会更好。为啥？比如，在一个收购工厂的实验里，如果买工厂的人先出价，最后成交的价格是1937万；如果是卖工厂的人先出价呢，成交价格就变成了2460万，明显要更高。为啥会这样呢？心理学有个概念，叫锚定！意思是当人们做判断的时候，容易受到第一印象支配，思想就被固定了。不管谁先开价，这个价格就成了“锚点”，对方再怎么砍价，基本上都会围着这个价格转。因此，尽管对方的理性做法是不受这个数字的影响，但他们往往做不到。再说个栗子：有两个人交易二手车，卖方先开出了一个比较高的价格，买家肯定会向自己“为什么他要价这么高？”然后会下意识地去看这辆车的优点。比如看起来还很新啊，牌子我也很喜欢，又是低耗油车之类的。最后这个价格就抬高了。但是如果是买家先出价呢，价格肯定比较低，那卖家也会问自己“为什么他出价这么低”，他就会自动关注车上不好的地方，比如有划痕啊，里程数跑得太多，有股旧车的味道等等。价格就被压低了，所以，只要是需要谈判的场合，都可以先下手，千万别客气。


