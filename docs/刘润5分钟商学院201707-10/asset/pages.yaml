  md: '# 客座教授｜韩都衣舍赵迎光：电商新品牌如何快速突围？


    ![](img/67d8d5e736c7e9ca429132df17016a0e_18_0.png)


    客座教授｜韩都衣舍赵迎光...


    前人的思考，我们的阶梯，欢迎收听“刘润·5分钟商学院”。


    《5分钟商学院》的同学们，


    大家周末好！


    这周的客座教授，我们请到了大名鼎鼎的、韩都衣舍电商集团创始人赵迎光。


    2008年，韩都衣舍品牌成立，赵迎光把成为“韩国风”的代表品牌作为了自己的品牌目标。发展到现在，韩都衣舍已经成为了目前中国最大的互联网品牌生态运营集团。他独创的一套内部运营体系，也已经被清华大学、长江商学院等作为MBA和EMBA的教学案例收录。我们也在《5分钟商学院》的课程中间多次提到了他们的小组织。


    这一周，他和我们分享了几个话题：


    +   第一，韩都衣舍在当时是如何找到自己独特的定位的？


    +   第二，如果现在新做一个电商品牌，怎么才能够迅速突出重围、站稳脚跟？如何实现差异化生存？


    +   第三，目前，线上运营成本不断提高的情况下，纯电商品牌未来的路应该怎么走？


    其中有非常多可操作的细节分享，如果你在做的事情和电商运营相关，请你仔细阅读，一定会很有收获。


    另外，因为咱们同学的提问非常精彩，赵总的回复也非常细致深入，所以我把问题拆分呈现，方便大家阅读。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_18_1.png)


    我有两个问题，第一个是韩都衣舍是如何逐步找到自己的服装定位的？


    我在2000年初接触了易趣网，当时很认同电子商务的未来，就开始积极参与。我经营过化妆品、母婴用品、汽车用品，做过独立的B2C官网、做过网店加实体店的“全渠道”模式，但都做的不顺利。


    2007年，我遇到韩国的电商朋友，发现在济南这个地方，想要做一个电商行业的平台，太难了，要突破的话，只能做自有品牌。我当时分析了自己的资源：在韩国工作了10年、从事的是服装贸易；济南是山东的教育中心，每年有大量的大学生毕业，人才资源充沛；同时2008年的时候，“韩版”成为网上女装一个流量非常大的关键词，很多商品都有“韩版”这个关键词，但还没有哪个品牌，明确宣布自己的定位是“韩风快时尚”。


    一些服装同行的说法是：韩风只是女装众多风格中的一种，虽然现在很流行，但未来不好说，一旦把品牌定位成了韩风，将来韩流不流行了，再改定位会非常麻烦。'
