  md: "下，做到最好的品质，如果把这个优先级顺序颠倒过来，那就是完全不同的另一个定位，针对的人群诉求也就完全不同了。\n\n# 3、经营粉丝\n\n这是一个人人都是自媒体，人人都是传播者的时代，所以一个新品牌的建立模式，要充分利用这个新市场的特点。用户和粉丝最大的不同是：用户只是基于产品来了解品牌，对于品牌后面的人、物、事基本上是上不Adapun的，而粉丝则不同，他们不仅仅是对于产品有所了解，更是对于品牌背后的\
    \ 人、物、事都有比较全面的了解。也就是说，作为用户，产品=品牌，作为粉丝，产品=品牌=IP，所以如果想让一个新品牌更快的进入消费者认知，创始人营销是非常有效的一个方法。\n\
    \n创始人直接站到前台，跟大家分享品牌的理念，经营的故事等等，如果创始人在这方面不是特别强，那就尽可能组建一个比较强的公关团队，打造属于品牌自己的IP，多方位、全角度地制作相关的内容。\n\
    \n传统的品牌营销，20%的资源用在制作传播内容，80%的资源用在支付传播渠道的费用，而在互联网时代，应该倒过来，要把80%的资源用在制作传播内容，20%的资源选择一个点来引爆，然后利用人人都是自媒体的特点，让内容进行二次，三次甚至多次传播。\n\
    \n比如，做为一个服装品牌的创始人，在各种会议上，我从来不讲我们用的面料和工艺有什么不同，我们的设计风格等等，而是跟大家分享我们小组制的组织模式创新，跟大家分享关于二级生态的商业模式创新，表面原因是\
    \ 我不懂服装，讲不出关于服装专业性的东西，但其实更重要的原因是，如果我到处讲如何设计服装，服装工艺的话，我跟其他的服装品牌的创始人有什么不一样吗？\n\n\
    前一段时间我参加了一个“互联网品牌营销创新”的论坛，我就问了一个大家一个问题：作为一个服装品牌，韩都衣舍最有名的是“小组制的组织创新”，是不是可以跟其他服装品牌形成足够的差异化？在大家认知\
    \ 的组织创新之外，这算不算是一个营销创新？\n\n韩都衣舍的小组运营制是在一个什么样的背景或者是什么样的原因下被制定出来的？\n\n关于小组制诞生的背景，当时是考虑这么几个因素：\n\
    \n+   1. 在济南，服装行业可以说是“一穷二白”，产业资源和人才资源都不充足，而电子商务是全国市场竞争，如何在激烈的市场竞争中取得优势？\n2. 我们的品牌定位是“韩风快时尚”，“款式多，更新快，性价比高”是一个快时尚品牌在产品端的核心能力，通过什么方法可以做到？\n\
    3. 电子商务是个新兴产业，普遍面临人才不足的情况，什么制度可以让年轻人快速成长，同时有效避免人才流失？\n\n我们在创业之初经过多次讨论，认为如果想要创业成功，就需要有不走寻常路的决心和方法。我们几个合伙人把讨论的重点从如何做一个服装品牌，慢慢转向了如何提供一个平台，通过“联产承包责任制”的架构，让有服装设计基础的年轻人可以快速成长，后来又进一步参考了稻盛和夫的“阿米巴模式”，让大家成为品牌的“主人”，充分发挥主观能动性，为每一个员工提供足够的发展空间，这样就可以有效的解决上面的三个问题了。\n\
    \n具体来说，韩都小组制“从0到1，从1到10”的实施步骤是这样的：\n\n+   1. 2008年逐步招聘40名服装专业的学生，挑选1000个韩国线上品牌，每人负责25个品牌，做了1年时间的韩国服装代购。每个学生每天的工作是从25个品牌中，选择8款商品，重新制作商品详情页，包括重新写商品文案，上传到淘宝店铺，对于销售出去的商品，每天要做分析，从而思考1年以后，如果自己做设计，应该从中鉴证什么。\
    \ \n2. 2009年，从做代购逐步转向自主设计（包括买手模式下的二次改版）和自主生产，正式组成三人小组（产品设计开发+销售运营维护+订单库存管理），每天进行业绩通报和排名，鼓励小组分裂和重组，基于小组的业务需求，逐步组建摄影团队，供应链团队，IT团队等。\
    \ \n3. 2012年，根据小组业绩的表现，鼓励和扶持优秀的小组创立新的子品牌，并制定了“成人礼”以及对应的净利润分配制度，建立起内部孵化平台。 \n4.\
    \ 2015年，将韩都的9大服务系统全面开放，构建“互联网品牌二级生态”，“韩都智荟”成为整个生态的核心，通过对接天猫，京东，唯品会等“一级生态”，提高生态内品牌的运营效率，进一步践行创业时的使命：“成就有梦想的团队”。\n\
    \n随着线上运营成本的不断提高，新零售的概念不断被行业所共识，一些线上品牌纷纷开始线下布局。请问韩都衣舍有没有考虑过开设实体？如果有，您最担心的问题是什么？如果没有，您认为一个纯电商品牌的可持续发展力在哪里？\n\
    \n关于线上运营成本不断提高，其实是线上逐步走向主流市场和成熟市场的重要标志，同时也是长期趋势。对于具体的品牌来说，要通过客单价（注意：不是件单价）和转化率的提升来解决这个问题。\n\
    \n这里要跟大家讨论一个误区，马云讲的“纯电商是没有未来的”，在我看来真正意思其实是“纯电商（平台）是没有未来的”，因为从一个零售平台来说，包含了“场景零售（线上引导+线下成交）”和“提袋零售（线上成交+线下配送）”，比如去饭店吃堂食就是场景零售，通过“饿了么”叫外卖就是提袋零售，这两种零售的数据，未来的零售平台一定都要拿到，这样才可以得到消费者最全面的数据，从而通过算法，实现“一\
    \ Plots”的精准匹配。所以从零售平台的角度来说，必须是通过互联网打通，线上线下结合。\n\n但是，马云从来没有说过，纯电商品牌是没有未来的，具体到不同的行业，不同的品类，每一个品牌选择的方式都可以是不同的，既可以是纯线上开店，也可以是线上下都开店。\n\
    \n一个品牌如果选择纯线上模式，就要走相对的“薄利多销”的模式，如果选择线上线下都开店的模式（这里的线下店不是营销意义上的店铺，而是正常的以盈利为目的的店铺）的话，就要走相对的“厚利少销”的模式。"
