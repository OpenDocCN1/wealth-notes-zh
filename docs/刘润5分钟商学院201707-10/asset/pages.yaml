  md: '比，它就能迅速发出通知：在某个地铁站有某个罪犯，这样就可以大量替代守在监控室里的员工。这家公司就是你值得去的，因为它对人的使用效率是更高的。


    我再举个例子，美国有家银行摩根大通，它过去要把钱贷给一家企业，需要先签署贷款合同，这就需要专门有人去审合同，条款合不合理？有没有风险？会不会欠的一些钱有问题？在中国有些银行是通过信贷部的员工去审合同，在美国的摩根大通银行，是通过付费购买律师服务的方式去获得审合同的这种能力，每年大概要买30万小时的律师服务来审合同。


    但是今天有一家创业公司叫做Coin，它做了一个基于人工智能的合同审阅服务，对合同风险判断的水准比人还要高，过去你请律师、花30万小时审完这个服务，现在Coin的人工智能服务花几秒钟就全部完成了，所以如果这家公司要招人你应该去这家公司，要创业的话，你应该做类似的事情。


    在商业篇，我们讲了65个特别有趣、特别有获得感的课程，最后提炼出来其实讲了两件事情：创造价值和传递价值。传递价值最重要的逻辑是用提高效率的方法降低定价率，就是降低产品从出厂到消费者手上的那个链条。创造价值领域的核心逻辑，是用创新的方法不断去提高定价权，我就是能做出你做不出的东西，我就可以卖得很贵。记住，创新和效率是商业世界的两个基本逻辑，创新提高定价权，效率降低定价率。


    # 第二部分：管理篇


    管理篇我们也讲了65个非常重要的管理概念，我们讲了从个人如何变成一个一线经理，一线经理怎么变成总监，总监怎么变成CEO，我们讲了选育用留，讲了很多一些管理的手段。但是如果让我来总结，我希望总结为两个核心的要点。


    # 1、所有企业与人都是合伙关系


    这个世界上从来没有一种关系叫做雇佣关系，所有的都是资本与人才之间的合伙关系。只不过在不同年代，资本与人才之间的合伙关系，会此起彼伏、此消彼涨。当你从这个角度去理解所有管理问题的时候，你会豁然开朗。


    很久之前，挪威人要出海捕鱼，但是能买得起渔船的有钱人，很多已经很大岁数了，出不了海了，能出海捕鱼的年轻人又大多没有钱，买不起渔船，怎么办呢？于是，在那个时代就产生了一种非常特殊的合伙关系。老年人出渔船99%的钱，年轻人出1%，也要承担风险。然后出海捕鱼卖了钱，80%的利润归老年人，20%归出了体力的年轻人。出体力的钱价值19%，这部分就是资本跟人之间一个博弈结构或者一种合伙关系。


    这个例子的目的是想告诉大家，人类历史上自从有了商业，人与资本之间就一直是这么一个合伙的关系。对应到今天的商业世界，对应到管理结构，我们怎么去激励员工呢？无外乎这么四种方法：


    工资，工资是我给你一个固定的价格，把你的时间全部卖走，你不要跟我谈万一赚了钱之后分多少，我一次性全买断了，这就叫工资。如果你去激励员工的时候，记住工资是付给责任的，承担越大责任的人应该拿到最多的工资，千万不要用提高工资的方式去奖励一些个别的阶段性的行为，工资是奖励给责任的。


    奖金，奖金激励的方法是，你今年业绩特别好，我本来预计你能卖100万的，结果卖了120万、卖了130万，你就应该拿到额外的奖金，奖金是激励超额业绩的。因为超额业绩在这一年有，下一年未必会有，你发现奖金就有一点点类似于合伙的制度了，但是奖金是一个比较确定的份额，在早期已经约定好的。


    股票，股票有很多的衍生，比如说分红权、期权，或者股票本身，它其实是一种叫利润分成制。这个公司怎么干我们都不知道，你也不知道，我也不知道，我们都在创业，我发你这么高的工资，亏了我都走不下去，那怎么办呢？你拿低一点的工资，奖金也不一定有，但未来如果有天赚大钱了，你占15%的股份，我占40%的股份，这样赚的所有钱你拿15%，我拿40%，这叫做利润分成制。所有的股权机制、所有的合伙制到顶级都是利润分成制。


    价值观。所谓的价值观就是，我今天就是要做一件团队里都特别向往的事情，你不给我钱，你拦着我都要去做的事情，这种事情叫价值观。价值观是可以去覆盖前面三个奖励的，当你正在做的事情是能够打心眼里激励每一个员工的时候，钱可能就不是唯一重要的了。


    所以记住，所有的关系都是一种合伙关系，雇佣只不过是合伙关系的一个小小体现，未来你要去调公司的激励，就是围绕这四点不断地调整相互的比重。


    我举个例子，如果你今天是一家超市门店的店长，你想跟老板谈一下，刘润老师说了，我们的关系不是雇佣制，是合伙制，咱俩之间怎么来合伙呢？比如说这家超市门店过去一年的收入是100万人民币，利润连续三年平均都在20万左右，怎么都涨不上去，为什么？因为你和你的老板都发现这个店的员工，觉得赚多少钱跟我没关系，我只要按时上下班就好了，于是你作为店长就可以跟老板商量，我承诺你20万利润明年一定做到，这20万的利润我交给你之后，如果我们的利润到了25万、到了30万，20万到30万之间的利润我们俩分好不好，这样就会给我们所有的员工很大激励。至于该分多少呢？我分60%，你分40%。你不要觉得这是狮子大张口，老板多半会答应，因为额外的利润是他没有预期到的，这样你就可以告诉你的团队，超过20万我们能赚更多的钱。这就导致一个结果，本来员工是随便放鸡蛋的，但现在他舍弃轻放了，因为他知道所有赚的钱自己也能分一些，这个时候员工跟老板之间的关系就变成了一种合伙制，或者说是某种形式的利润分成制。


    # 2、公司管理的排序应该是，战略、组织、人。


    我在帮很多企业做战略顾问的时候，经常会说三个词：战略、组织、人，这是我来梳理一个公司管理架构的基本方法论。所有的管理问题一定要从战略开始，然后是组织，最后才是人。记住最后才是人，不是唯一是人，也不是第一是人，最后才是人。


    什么叫战略、组织、人？当我们看到一个人不努力工作的时候，我们很容易去指责这个人，怎么这么没有责任心，怎么这么不上进之类。但其实这是不对的，所有人的问题，本质上都是组织的问题。举个例子，一个人在你这不努力工作，但他换去了别的公司，结果如狼似虎，到底是那个人不努力还是你有问题呢？很有可能是你有问题，你的组织结构有问题。'
