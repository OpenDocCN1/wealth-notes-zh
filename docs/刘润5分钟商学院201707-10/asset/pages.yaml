    这周的客座教授，我们请到了中国比特币首富，得到专栏《通往财富自由之路》主理人李笑来。他曾经是新东方名师，做过销售、教书、写书、开公司，成为若干创业公司的创始人合伙人，现在致力于比特币相关联合创业和天使投资，是习惯性跨界者。


