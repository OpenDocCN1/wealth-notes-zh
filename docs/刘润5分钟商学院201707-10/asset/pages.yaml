- pgno: 142
  md: '刘润 Run Liu 创始人/董事长 上海润米管理咨询有限公司


    第三，其他各种收集器。


    那电子邮件怎么收集呢？每个印象笔记账户，都有一个对应的邮件地址。你收到电子邮件，把它转发给这个邮件地址，这封邮件就被放入“收集篮”了。不过，这个地址不好记，我建立了一个名为“我的印象笔记”的联系人，把地址存进去，转发时抄送这个名字，就行了。


    那微信文章怎么收集呢？在微信里，搜索并关注“我的印象笔记”这个公众号，按照提示把微信账户，和印象笔记账户关联。以后看到值得收藏的文章，千万不要再收藏到微信了，你可以一键放进你的印象笔记。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_142_0.png)


    那微博文章怎么收集呢？你也可以在微博上，把你的账号，和印象笔记关联。看到任何好微博，在下面留言“@我的印象笔记”，这条微博，就会自动同步到你的印象笔记里。神奇吧？


    # 微博正文


    那网页新闻怎么收集呢？你可以在浏览器上装一个叫做“印象笔记·剪藏”的插件，浏览网页时，看到任何有价值的文章，一点图标，就可以把这个网页的内容，“剪藏”到印象笔记。


    说了这么多信息收集工具，都是为了让你的“收集篮”开口足够大，让你的印象笔记（或者其他类似软件）作为唯一的中心，管理所有的知识。“完全收集”之后，你才能“完善处理”，和“完整回顾”。


    # 小结：认识知识管理


    怎样才能把印象笔记变为你真正的知识管理工具？在“收集、处理、回顾”三步中，你的“收集篮”开口要足够大，真正做到大肚能容，吃尽线上线下的所有知识。


    怎么做呢？你可以用手机扫描软件，扫描文件；用名片识别软件，识别名片；用各种支持印象笔记的插件，从电子邮件、微信文章、微博文章、网页新闻等一切地方，收集知识。


    # 用软件帮助收集篮“大肚能容”，吃尽知识


    陪你成长的第239天


    ![](img/67d8d5e736c7e9ca429132df17016a0e_142_1.png)


    你可以借助工具，从电子邮件、微信微博文章、网页新闻等一切地方收集有价值的知识，完全收集之后才能完善处理和完整回顾。


    # 得到专栏·5分钟商学院 主讲人：刘润


    刘润 除了我今天介绍的印象笔记，和相关软件、插件，你还用过哪种知识管理软件吗？它们有哪些更方便的地方呢？来和我一起过招吧。


    昨天我介绍了自己是“每天听本书”的vip会员，每天可以利用20~30分钟的零散时间，听完一本书的解读，非常高效。有不少同学留言，希望分享一下我的书单。这里，我特别请得到的同学们做了一个一键直达的链接，供大家查看。


    著名商业顾问 刘润 在『得到』听什么？


    # 留言精选'
