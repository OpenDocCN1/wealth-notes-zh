    之前有点为读而读，一定要认真读完才有成就感，结果一年没能读几本。后来，觉得要快速阅读，先求量再求质，结果发现读下来什么也没记住。直到最近一两年，才发现阅读是一个从量变到质变的过程。


    原来我以为没用的，忽然在某一天打通了任督二脉，很多知识开始串联碰撞。我才开始意识到，凡经历过的，必留下痕迹。只是这个过程很长，谁也不能跨越。知识积累到一定程度，是会发生化学反应的，怎么反应，谁也不知道。以前是因为知识存量太少，没法产生链接，没法起化学反应而已。好比一个运动员，让他按教练的方法练100米，可能这个方法现阶段看来是有局限的，他到了某个速度成绩就再也提不高于了，可是一旦他到了那个成绩，也许他的潜力被激发又能上一个新台阶，所谓的该花板也不存在了。


    在这个过程中，我对阅读也有了新的认知。首先，除了阅读知识之外，我也开始关注作者思维的结构、语言表达的逻辑，论证的方法，从中受到启发。其次，注重记录心得、思考知识的运用环境，使知识变得更有价值。


