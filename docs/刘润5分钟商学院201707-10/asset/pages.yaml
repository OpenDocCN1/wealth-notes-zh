    # 青岛罗刚


    入选本周精选留言特别高兴，因为奖品是润总的签名书，感觉和润总有一个链接，是一件很幸运的事情。

    关于演讲，我有过很多失败的经历，主要分以下三种类型：

    1、上台后完全不能开口；

    2、把演讲搞成朗读；

    3、自己很嗨观众很困。

    痛定思痛后的改进方法如下：

    1、万一上了台很豪、很紧张，就从提前准备好的一笑话开始，笑话最好假说一个大家熟悉的人，或是就在现场的人，当然前提是关系好，对方不会怯。观众一齐笑，基本上就不紧张了。要是连笑话都忘了，就直接说下面这句话：“我今天特别紧张，紧张得连上台来干什么都忘了，大家谁能提醒我一下？

    2、之前把恨不得把演讲稿全部放在PPT里，然后就被框在里面，讲得干巴巴。现在的方法是PPT上就是几句话，基本就是题目，内容可以借助手卡或是“演讲者视图”，但其实只要准备得足够充分，最好就是脱稿讲。不要怕漏内容，只要最关键的几点出来就行了，对于听众来说，有一处内容受益就是有价值的。

    3、如润总说的第一条，同理心最重要，演讲不是吹牛，也不是个人作品展示，是为了让对方有所收获。从准备稿子开始就从听众视角想问题，对听众有帮助的地方重点讲，讲透彻，对听众没有帮助的地方再精彩也要咬牙删掉。

