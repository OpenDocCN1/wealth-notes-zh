  md: '# 236 | 白板：如何随时随地、无边无际地思考？


    你有没有发现，目前我们讲的所有工具，比如 “SWOT 分析”，“一报还一报”，“案例复盘”，其实都是流程，步骤，甚至表格，而不是真的锤子，或斧子。很多时候我们讲“工具”，并不是指实体物品，而是指方法，这些是花钱买不来的，只能花时间去学来。


    但从今天开始，我决定用两周，给你介绍一些花钱就能买来的工具。给商业、管理、个人篇的心法配上它们，就像给关羽配上青龙偃月刀，必定如虎添翼。


    今天，就从一个我最常用的工具说起：白板。


    # 概念：白板


    还记得155课“快速学习”中的建立模型吗？还记得205课“商业模式画布”中的9大战略模块吗？还记得227课“思维导图”，230课“二维四象限”，233课“Scrum”流程，和234课“视觉会议”吗？其中提到的心法、工具，最终都要在同样东西上展现，那就是：白板。


    我最经常的工作状态，就是站在巨大的白板前，把想法像小石头一样，扔到知识储备的湖面上，迅速激起的浪花、漪荡记录在白板上。然后，我会退后半米，静静地看着这些想法舒展、连接、形成结构，感受创造带来的喜悦和成就感。


    但除了喜悦和成就感，白板还解决了我思考过程中，三个非常实际的问题：


    +   1. 相对于Word, Excel, PPT，它能把我从“结构化的思维”里解放出来，随心所欲地思考；

    2. 相对于A4纸，它能把我从“有边界的思维”里解放出来，在广阔的空间里舒展、连接；

    3. 相对于翻页纸（Flipboard），它能把我从“不能错的思维”里解放出来，想到就写，写错就擦，擦了再来。


    # 运用：正确使用白板进行思考、发散、创新的几个建议


    那么，怎么利用这个“看上去平淡无奇，其实不断创造神奇”的白板，让自己走到哪，思考到哪，发散到哪，创新到哪呢？我给你几个建议。


    最简单的方式，是买一个可移动的白板架，或者买一块白板挂在会议室墙上。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_133_0.png)


    但是，对于需要大量思考和协作的团队来说，这远远不够。你可以试着用白板装修你的办公室。


    如果你的办公室较小，那最适合变成白板的，是柜门。用白色毛玻璃包边做成书柜、办公柜的门，就能大大增加你的思考空间。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_133_1.png)


    如果你的办公室很大，那最好的办法，是把所有结构立柱，四面包上白色毛玻璃，做成白板。坐在旁边的小组，不用预定会议室，随时就能开始讨论。这将极大提高沟通效率。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_133_2.png)


    如果你的办公室再大点，有专门的“创意空间”，可以把所有没有窗户的墙，都做成白板。当团队走进这个空间，一定能释放无边无际的创造力，沉浸在创意的海洋里。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_133_3.png)


    没有专门的“创意空间”也没关系，你至少可以在办公室留白墙，把所有挂画的地方，都变成从头到尾、顶天立地的白板墙，变成“创意空间”。


    如果你像我一样，对白板思考有重度依赖，你可以在家里也装上白板。如果你觉得办公室白板太冷硬，可以试试用“黑色烤漆玻璃”做的黑板。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_133_4.png)


    或者，还有一种叫“白板漆”的神奇产品，刷在任何物体表面，就能自由作画、擦洗。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_133_5.png)


    ![](img/67d8d5e736c7e9ca429132df17016a0e_133_6.png)


    ![](img/67d8d5e736c7e9ca429132df17016a0e_133_7.png)'
