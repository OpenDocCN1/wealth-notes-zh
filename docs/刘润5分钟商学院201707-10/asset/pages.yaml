  md: '# 246 | 商业书籍：商业不是一蹴而就，商业是一路走来


    《5分钟商学院》开课近一年来，很多同学都在问我：润总，你能推荐一些延伸阅读的书吗？这种求知好学的热情很令人感动。其实，我在课程中已经提及了很多书，但本周我还是专门在“商业、管理、个人、工具”这四个领域中，各挑选了5本，不敢说最好，但确实深深打动我的书，与你分享。希望通过阅读这些书籍，你能收获更多高手的思维和思维方式。


    今天，我们从5本商业书籍开始。


    # 概念：商业书籍


    第一本，克莱顿·克里斯坦森的《创新者的窘境》。


    这本书的中文版问世时，封面上赫然印着一句话：完美的管理，导致大企业走向衰败。我冷冷一笑：哗众取宠，但还是买回来看了。看完后就不是冷笑了，而是冷汗。它说得如此有道理，我竟然无力反驳。


    书中给出了一个大企业的“失败框架”：1）你很难通过改善“胶卷相机”打败柯达，只有“数码相机”才能通过截然不同的价值主张，颠覆柯达的商业模式根基；2）胶卷相机一定会发展到“过度满足”市场的需求，从而饱和，发展停滞；3）但同时，“数码相机”初期并不“诱人”，价格便宜、利润率低，也不被柯达的主要客户接受，所以很难被柯达投资；4）数码相机成长起来，胶卷相机衰败下去，柯达的衰败必将到来，与谁是领导几乎无关。


    我强烈建议你，这本书一定要读，深刻理解企业生命周期。


    第二本，杰里米·里夫金的《第三次工业革命》。


    蒸汽机开启了第一次工业革命，但是真正把第一次工业革命推到巅峰的，并不是蒸汽机，而是印刷术。煤炭-蒸汽机-火车的创造价值进步，是通过印刷术这个传递价值进步，推向了全世界。


    内燃机开启了第二次工业革命，但是真正把第二次工业革命推到巅峰的，并不是内燃机，而是电信技术。石油-内燃机-汽车的创造价值进步，是通过电信技术这个传递价值进步，推向了全世界。


    那么第三次工业革命呢？可再生能源是新的创造价值的基础，但真正点燃第三次工业革命的，是互联网这个划时代的传递价值技术。


    你可以通过读这本书，理解产业变革，远大于个人意志的宏观规律。'
