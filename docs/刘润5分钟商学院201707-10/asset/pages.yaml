    # 第三本，彼得·圣吉《第5项修炼》


    彼得·圣吉这本旷世巨著，在1992年荣获世界企业学会最高荣誉的开拓者奖，是管理者必读的经典之一。


    什么叫第五项修炼？那前四项修炼是什么？它们是：自我超越、心智模式、共同愿景和团队学习。彼得·圣吉对这些概念的描述，成就了“心智模式”，“学习型组织”等谈管理几乎必提的概念。这么牛，那看上去可能更牛的第五项修炼是什么呢？是系统思考。


    关于系统思考，可以参考158课讲的“全局之眼”。这种最高级的修炼，可以让领导者从看片段，变为看整体；从被动反应，变为创造未来。


    另外多说一句。我非常建议所有家长，不管文理科，考虑让小孩子从幼儿园、最晚小学开始，学习围棋，以及编程。学围棋，可以训练面对未来的博弈思维，这是一种加上时间轴的战略思考能力；学编程，可以训练搭建系统架构的能力，这是一种基于信仰规律的系统思考能力。


    # 第四本，戈文达拉扬 / 特林布尔《战略创新者的十大法则》


    作为一名商业顾问，我最主要的研究方向之一，是战略转型。在这个领域，我自己写了几本书，拜读过更多的研究成果和书籍。在我读过所有和战略转型相关的书籍中，这本《战略创新者的十大法则》是最好，至少是最好的之一。


    我在246课推荐的《创新者的窘境》里提出的“完美的管理导致大企业走向衰败”的问题，今天这本《战略创新者的十大法则》，作出了漂亮的回答。企业为什么像大象一样不肯忘记？如何更新组织的DNA？企业如何和人类一样，通过叫“忘记、借用和学习”的方法，完成迭代？


    强烈建议正处于转型期的企业，认真阅读。


