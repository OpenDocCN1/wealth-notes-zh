  md: '# 周末小结 | 专业化还是多元化，该怎么选？


    前人的思考，我们的阶级。欢迎收听《刘润·5分钟商学院》。


    《5分钟商学院》的同学们，大家周末好！


    从本周开始，我们会把周六的《客座教授》和周末的小结都加入语音部分，把一周5天语音变为7天，更方便大家学习。


    周末小结 | 专业化还是多...


    # 1. 专业化还是多元化，到底怎么选？


    这一周，我们讲了互联网时代领导力的五个方面。


    周一和周二的课程，我们讲到了专注的重要性。


    对于个人而言，要善于利用“威胁、此刻、重要”，这是人类专注力来源的这个机制，让自己专注于正确的事。对于企业而言，每个组织都有天生的自我膨胀的原动力，但《创新者的解答》这本书里有句话值得你反复琢磨，“你对资源的投入，决定了你要走的道路”，要尽可能地保持对核心能力的专注。


    其中，同学旋仔问了一个很好的问题，“为什么中国格力、恒大、万达等顶级企业都在走多元化的道路呢？包括阿里巴巴、腾讯等互联网企业都在加快扩张收购的步伐？”到底是走多元化还是专业化，应该怎么选？


    我看到过一份报告，美国从1980年到1990年到2000年，它的多元化企业的占比，从35%下降到20%下降到10%，欧洲从52%下降到35%下降到18%，日本在26%、38%和30%之间徘徊。


    而反过来来说，集中化经营的企业的比例，也在同样时间之内，美国从46%上涨到了68%上涨到了84%，而欧洲从36%到41%到67%。这意味着，这个世界上，永远都有多元化经营的企业，也永远都有专注化经营的企业。当我们举任何一个个例来看的时候，它总有它选择这个方向的道理，但是如果你看大的趋势，从80年到90年到2000年到2010年来看的话，总体来说，专注化经营的企业会越来越多，去多元化是一个时代总的趋势。


    你依然可以把“科斯定理”，就是比较企业管理成本和交易成本之间谁高谁低，作为判断你这个个体企业，多元化经营还是专业化经营的一个重要标准。当你发现这件事你找别人做不如你自己做的时候，你当然可以多元化，你可以把你的核心能力拓展到更广的区域去，但是随着交易成本的越来越低，我们到外部寻找到合作伙伴的代价会越来越小，需要多元化经营的机会相对来说会越来越少。


    # 2. VUCA的时代如何应对？


    后面三天，我们提到了一个概念，VUCA，我们生活的这个时代，局面变化多端（Volatile）、充满不确定（Uncertain）、复杂（Complex）、信息模糊（Ambiguous），过去的经验累积已经赶不上社会变化，只有保持一颗变革之心，不断成长，保持个人能力的持续增值，遇到值得干的机会就快速行动，才能立于不败之地。


    这里我想多说一句，我们要不断训练自己的大脑，让它能够慢慢学会用时间轴、概率轴和博弈轴分析和考虑问题，理解各种方法论之下的底层逻辑，这个非常重要。


    除了咱们的专栏，张潇雨老师的专栏《商业经典案例课》里也有大量顶尖公司的真实案例分析，比如上周他分析出品了《纸牌屋》《女子监狱》这些精彩美剧的'
