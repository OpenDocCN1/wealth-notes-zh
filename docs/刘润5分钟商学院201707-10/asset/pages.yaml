  md: '人，是一切管理问题的根本。但恰恰因为此，在思考管理问题时，人，通常是最后才应该考虑的因素。一切管理问题的思考顺序都是：战略，组织，人。


    常有人提到管理难题，说：这个人没有责任心，没有主人翁意识，没有创业精神，没有梦想。但是，他真的没有吗？


    我们在第77课讲了韩都衣舍。衣服不好卖，原来的三个部门，互相推诿。现在，从设计、生产、电商部中，各抽出一人，组成“三人小组”，用“联帮分权制”让小组对“最终结果”负责。三大职能部门，被拆分为280多个联邦。这些小组按利润与公司分配利益，所有人立刻和打了鸡血一样。同样的
    人，放在不同的组织结构之下，行为可能会完全不一样。组织，大于人。


    但是好的组织形式，就一定能获得巨大成功吗？


    我们在第12课讲到“零时尚”这家服装新零售公司。他们本来是在各地开加盟店，组织设计已经很精良了，但发展速度还是不够快。后来，他们调整战略，关闭加盟店，只和美容院合作，为常客根据身材、喜好，搭配好衣服，送到美容院，让顾客试穿。没想到效果奇得好。所有的组织形态，立刻随之调整，发展突飞猛进。战略，大于组织。


    战略大于组织，组织大于人。但是哪一个错了，都会全错。


    # 小结：回顾整个管理篇


    在管理篇我与你聊了管理的五个基本理论，聊了选育用留，聊了激励，聊了从员工到经理，从经理到总监，从总监到CEO，聊了很多很多。


    如果要从中升华出两个核心的话，我认为 是：1）所有企业与员工，本质上都是合伙关系。注意：工资、奖金、股权、价值观的不同用法；2）一切管理问题的思考顺序都是：战略，组织，人。但是哪一个错了，都会全错。


