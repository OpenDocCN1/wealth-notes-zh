  md: '你想搜减肥。但每个人提法不同，有人叫瘦身，有人叫减重。怎么办？搜索“减肥 | 瘦身 | 减重”，包含这三个词之一的文章，就都被找出来了。


    但这也太多了吧？大量文章提到这些词不稀奇，在标题中提到，比如“瘦身的25个方法”，才是我想看的。怎么办？搜索“减肥 | 瘦身 | 减重 intitle”。“intitle”的意思是，这些关键字出现在标题中才算数。出现在文章中的不要。


    比如你想搜有关宇宙大爆炸的学术文献。你搜“宇宙大爆炸”，各种八卦、新闻充斥屏幕。怎么办？很多学术文章，都是PDF格式，你可以搜“宇宙大爆炸 filetype:PDF”。这样，只有包含“宇宙大爆炸”的PDF文件才会出现。


    有趣吗？还有更多技巧，我就不一一介绍了。你可以测试一下自己，能否用30秒，搜出最全的搜索技巧。


    # 第二，善用关键字。


    掌握搜索工具的技巧，还是不够。真正“自己拿”的核心，是选对搜索的“关键字”。


    有一次，我坐在布艺沙发上看书，喝茶，突然觉得，茶杯放在桌上好不方便，要是能放在沙发扶手上就好了。可扶手是布，如果有个托盘就好了。但各家扶手的宽度不同，托盘如果能抱住扶手就好了。我不知道这个世界上，有没有这样的产品。怎么办？搜啊。


    我打开淘宝，先搜了“沙发扶手托架”。找到了这样的产品。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_152_0.png)


    这不是我要的。我希望材质是木头，于是我把关键字改为“沙发扶手托架木”，找到了这样的产品。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_152_1.png)


    这还不是我要的。沙发扶手大小不同，这个太笨重了。但我因此知道了“沙发扶手”，是淘宝卖家们对这一类产品的通称。我继续修改关键字为“沙发扶手木框”


    一下子，我在脑海中设计的東西，一模一樣地出現在我眼前。太神奇了。我立刻下单了。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_152_2.png)


    从不知道这世界上有没有，到最后找到、买回办公室，这完全依靠选择、修改关键字。


    # 小结：策略（方法）


    搜索能力，是我们从传统世界的“别人给”，进化到互联网世界的“自己拿”，找到这世界80%已知答案的必修技能。


    那怎么提高搜索能力呢？第一，熟练使用搜索技巧，比如“ - ”，“| ”，“intitle”，和“filetype”等；第二，巧妙选择、修改关键字，不断接近答案。


