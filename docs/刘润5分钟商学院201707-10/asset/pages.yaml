  md: '可以占据70%。说明餐饮行业还有巨大的机会啊。


    真的是这样吗？


    餐饮业是服务业，它和理发一样，“边际交付时间”不为零。什么叫“边际交付时间”？就是我给你做饭时，就不能给他做饭。我每做一顿饭的时间，是刚性的。我做得再好吃，一天最多做3~5顿，服务不过来的客人，只能交给别人。“边际交付时间”越高的行业，越是分散市场，符合正态分布：赚大钱的人少，亏大钱的也少，大部分人都趋向赚取平均利润。


    而互联网行业呢？它的“边际交付时间”为零，因为第12课讲的“网络效应”，用户越多，就会被此正向激励，用户就更多。领先者一旦过了引爆点，就会赢家通吃，产生垄断。这个行业，注定是头部市场，符合幂律分布：不管曾经百团大战、千团大战，最后都会趋向集中在少数几家手中。


    商业篇014 | 长尾理论：商业的未来是小众市场

    商业篇012 | 网络效应：互联网与生俱来的洪荒之力


    # 运用：现实中的商业现象


    还有哪些商业现象，符合正态分布呢？


    比如产品质量。大部分产品的质量，都是平庸的，真正的好产品非常少，但烂到骨子里的产品也不多见。这就是为什么质量管理领域，会有第117课讲的“六西格玛”管理。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_26_0.png)


    # 小结：认识正态分布&幂律分布


    什么是正态分布？在商业世界中，正态分布，就是因为“边际交付时间”等等因素导致的，好的少，差的也少，大部分企业趋向中间的一种“倒钟型”分布；


    什么叫幂律分布？在商业世界中，幂律分布，就是因为“网络效应”等等因素导致的，强者越强，弱者越弱，大部分企业走向极端的一种“尖刀型”分布。


    掌握正态分布，和幂律分布这两种工具，有助于我们理解商业世界的基本生态，并能够在不同的业态分布中，用不同的商业逻辑，顺势而为，寻求成功。


