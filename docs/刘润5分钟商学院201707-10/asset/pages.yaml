  md: '# 第一，自由思考。


    权力 和 威望，会影响自由思考。一旦有人 的观点，被认为比另外一些人的更有价值， 有些大脑就会被关闭。


    怎么办？圆桌讨论，不要打印头衔，不要 座位主次。不要自谦地说：“ 我提一个不 成熟的看法”、“ 我有一个不一定行得通 的想法”。


    # 第二，延迟判断。


    禁止批评，甚至禁止评论别人的想法。不 要说：“这想法太离谱了！”、“这想法 太陈旧了”、“这是不可能的”、“这不 符合某定律”。


    批评，和评论，是扼杀更多想法的<|start|>子 手。


    # 第三，以量求质。


    刚开始大家的想法，就像刚打开热水龙头 后的第一段冷水。前30个想法常常很容 易，真正的创造力很多都出现在第50个想 法之后。所以，整场头脑风暴要争取产生 至少100个新想法。数量，在这里比质量
    更重要。


    一家公司头脑风暴新产品名称。经过2小 时“不自谦、不批评”的激烈讨论，大家 提出了300多个新名字。数量比质量重 要，主持人没做任何评价。3天后，他请 大家写还记得住的名字。大家只写出来
    20多个。他们从这20多个中挑了3个，再 让用户从3个中挑了1个。


    # 第四，结合改善。


    回到最开始的案例。从带着扫把坐上直升 机扫雪，到用直升飞机螺旋桨扇雪，就 是“结合改善”。这也是头脑风暴真正的 魅力所在，是一群人分别独自苦思冥想， 不具备的值。


    怎么做？讨论尽量要小范围（10～20人 左右）；任何时候只能有一个人发言；不 可以交头接耳开小会；把前面的想法都贴 在大白板上，激发更多新想法。


    # 小结：认识头脑风暴


    什么是“头脑风暴”法？个体大脑，是知 识的子集。子集坐在一起，并不会自动拼 成全集。


    头脑风暴法，就是用严谨的流程，“自由 思考、延迟批判、以量求质、结合改 善”，把所有智慧的子集“连接”起 来，“激发”新的想法，产生一群人独自 苦思冥想无法产生的创新。


