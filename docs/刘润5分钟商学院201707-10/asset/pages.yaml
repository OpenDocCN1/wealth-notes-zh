  md: '# 概念：一报还一报


    什么叫“一报还一报”？


    还记得第207课讲的“囚徒困境”吗？虽然“合作”对双方都是最有利的，但囚徒往往会因为自私和不信任，选择彼此“背叛”，两败俱伤。这种“坏的纳什均衡”令人沮丧：难道人的天性就不适合合作？为此，美国密歇根大学教授，《合作的进化》的作者，罗伯特·阿克塞尔罗德决定做个实验。


    罗伯特写信给不同背景的学者们，请他们把自己应对“囚徒困境”的博弈策略，写成电脑程序。罗伯特收到了14个程序。然后他让这些程序捉对厮杀，最后按总得分排名。


    这时，著名的“一报还一报”终于出场了。这个策略，是由加拿大博弈论心理学家，拉波波特教授提出。它的基本逻辑是：第一回合采取合作策略，然后每一回合都采取上一回合对手的策略。这也就是所谓的：人不犯我，我不犯人；人若犯我，我必犯人。


    简单吧？但就是这么简单的“一报还一报”，居然在后来十几万次“重复博弈”的“囚徒困境”中，获得了冠军！


    为了验证“一报还一报”的威力，罗伯特很快又组织了第二场比赛。这次他收到了62个程序，其中有不少还专门针对“一报还一报”做了改进，其中包括多次合作后突然背叛的“狡猾策略”，总是选择合作的“老好人策略”等等。但最后，依然是原生的“一报还一报”获胜。罗伯特继续公开征集能打败“一报还一报”的程序，'
