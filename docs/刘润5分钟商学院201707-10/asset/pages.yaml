  md: '# 家长分享｜玩具角布置篇


    Dr.魏


    对于每个有宝宝的家庭来讲，“玩具角” 是整个房间的一道特殊风景线，怎么摆放玩具，能让孩子玩得更开心，家长看着不心焦？


    接下来，我邀请到两位专栏的金牌家长 @麻麻爸爸 和 @毛毛，看看他们如何安排自家的玩具角。除此之外，我在学习小组，发现一篇关于宝宝阅读的家长分享，这位宝爸叫
    @以梦为马，他把亲子阅读经验，总结成一个个关键词，很有创意，是家至名归的金牌家长。


    # | 第11期金牌家长-麻麻爸爸


    每个孩子都有玩具，玩具是孩子童年的重要陪伴。


    孩子的玩具从经历单一到多样、简单到复杂、量少量多的过程。如何帮助孩子更有效地管理自己的玩具呢？设置玩具摆放区域，让孩子参与“管理”玩具，是很有必要的。我分享三点体会：


    # （1）分类摆放


    孩子的玩具，可谓是种类繁多，简单来说，主要是有三类，即拼装类，如各类积木；电子类，需要装电池使用的，比如遥控车，玩具琴；小件类的，比如各种小车、人偶等等。


    # （2）收拾玩具


    # （3）经常清理


    # （4）“藏匿”玩具


    # | 第015期金牌家长-毛毛


    很高兴加入叨叨魏专栏，学做聪明家长。更荣幸能将我的育儿经验分享给大家，希望有帮助。


    昨天叨叨魏分享了《如何布置玩具角》，其实在一个月之前，我家大部分玩具都是堆在收纳箱里，然后把箱子置在爬行垫旁边，让宝宝想玩的时候就去拿。


    # （1）拎不常用、过时的玩具，譬如0-6月玩的咬胶、握铃、摇铃等放到一个箱子里；把所有球类玩具放到另一箱子（我家玩具不多，两个小箱子就解决了）。


    # （2）根据目前12月龄常玩的玩具，放到最容易拿到的地方：爬行垫和茶几。


    # （3）总共分四个区域


    +   1.爬行垫和茶几上：放着最喜欢的，或者希望宝宝关注的玩具，不超过3件。\n2.毛绒类的玩具，一部分放在床边窗台上，方便宝宝在床上玩；另外放2-3个在沙发边，既是装饰，也是玩具。\n3.不常用的玩具放在收纳箱里，宝宝有需求也可以拿得到。\n4.专属书架，放着宝宝的绘本。


    # | 金牌家长-以梦为马


    这是一次我们陪伴豆丁将近20个月的阅读小结，豆丁即将满20个月，这20个月与我来说，最重要的亲子时光就是陪豆丁阅读。


    从某种角度说，阅读只是陪伴中的媒介，'
