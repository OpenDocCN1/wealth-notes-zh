  md: '再举个例子，有一家很著名的公司韩都衣舍，在天猫、淘宝上都开了自己的衣服店。卖衣服这件事情过去有三个主要部门：一个部门叫做设计部，设计师全世界去采风，看这个衣服好不好，这个衣服能不能卖得出去，这个款式特别新鲜，我拿到中国我做个类似的款。第二个部门叫做供应链，拿设计师设计的衣服到工厂里面去下单生产，做出一件一件的衣服，然后放到电商平台上卖。第三个部门叫电商，电商小二就是设计各种各样的图片、各种各样销售的活动、各种各样的促销，然后把衣服卖给需要的人。所以有三个部门，叫做设计部门、供应链部门和电商部门。


    今天有个问题，这件衣服设计出来了不好卖，你说怪谁？你怪设计部门，设计部门跟你说，这个衣服我设计得这么好，你们做出什么烂衣服，线头都在里面，这个布料不行，你们选的供应商不对，你怪供应商？怪供应链部门？供应链部门会说，这是在这个价格之内能做的最好品质了，是电商小二不会卖，你怎么能用这种促销政策呢？你去怪电商小二？电商小二会跟你说那都是设计部门，这种衣服去年就不流行了，你今年拿来让我卖，我怎么能卖得出去，你来卖卖看。所以一旦组织上遇到这样问题的时候就互相推诿，你怪谁？你跟他谈价值观，你谈人的责任心，没用，这个时候你应该怎么办呢？


    韩都衣舍做了一件事儿叫战略、组织、人，用组织的方式来解决人的问题。怎么做呢？把三个大部门全部拆散，打散成了280多个三人小组，每个小组里面有一个设计师、一个供应链，一个电商小二，你们三人组成一个小的团队，给5万块钱的启动资金，你们拿着钱去设计，设计完自己下单，下单完之后去上线。你想想看，如果有了5万块钱自己设计、自己生产、自己上线之后就会卖得特别好，这个衣服卖的很多人喜欢，这时候怎么办？5万块变成8万、变成10万、变成20万，我也赚钱了，公司也赚钱了，特别高兴，然后拿着赚的钱再投下去，然后15万变成30万、变成40万，这个时候他们也赚了很多钱，公司也赚了很多钱。这就叫激励相融，这是用组织的方式来解决了个人的问题。


    反过来，如果有个小组设计东西不行呢？卖不好呢？不管谁的问题，卖得不好，5万块变成了衣服，衣服滞销变成库存，赶快销库存，销完库存之后打折卖掉变成2万块，赶快再去颤颤巍巍地设计一个新款衣服，再上线2万块发现还是没人买，最后全都没了，这个时候这个团队怎么办？解散。所以你会发现这些团队已经不跟你谈谁的问题了，没有了，本来说你能不能加个班，明天帮我设计个新款，他说对不起，我回家还有事儿。现在你问他，你怎么还在公司里面？他说我还有点事儿要忙，明天我有新产品上线。这个时候，用组织的结构就能解决人的动力问题，记住组织大于人。


    再说战略，我自己工作了那么多年，最长一次是连续55个小时没有合眼，连着干了三天两夜。为什么要干三天两夜的活？动力哪来的？又不是你在创业，动力哪来的？动力是来自于战略。


    我当时在微软公司，那个时候我们那么努力工作，是因为我们相信自己在做的事情是真的能改变全人类的。记得在2000年的那一晚，很多人可能都在狂欢庆祝，但那一刻我正在微软的办公室里面加班。当时我们知道有一个叫千年虫的电脑bug有可能会要出现，因为微软是全世界用得最多的操作系统，所以我们派了7000个人在全世界24个时区守着，就像守护全人类进入下一个世纪的幕后英雄一样，当时我觉得特别激动，我们在办公室里面守护着，第一个进入21世纪时区的国家有没有问题？没有，太好了，第二个时区、第三个时区……，我一共在办公室里面庆祝了六次进入21世纪，当时真的感觉是在守护全世界，微软用这样的方式在保护它的客户。工作加班又算什么呢？


    总结一下，我希望在管理篇大家能记住两件事情：


    +   1、第一件事情，所有的关系都是一种合伙关系，都是资本与人之间的合伙，记住工资、奖金、股权和价值观。


    +   2、第二个，所有的管理问题分析起来，顺序都应该是战略、组织、人，仅仅从人出发是解决不了问题的。


    我最后想用亚当·斯密的一句话来结束这一部分的分享，亚当·斯密说之所以面包师和屠夫他愿意给你做面包，愿意把肉卖给你，并不是因为他希望你长得更健康，并不是希望他希望让你获得更大的利益，他之所以愿意把面包和肉卖给你，是因为他能获得更大的利益，让对方获得更大的利益就是所谓的组织结构。所以不要期待着用最基本的逻辑，用基本的人向善的一面来解决所有的管理问题，一定要记住让所有人获利，这是管理的基本架构。


    # 第三部分：个人篇


    在个人篇，我们谈了65个个人能力的提升，其实就是在谈三件事：第一是知识，第二叫技能，第三叫态度。


    # 1、你学的所有东西，都可以归结为知识、技能、态度这三件事


    什么叫知识、技能、态度？举个例子，数学就是知识，我记住了1+1=2，这个东西我就学会了，用你的大脑来记住的事情叫做知识。第二件事情叫技能，比如以前有人教我抛ウン子，他告诉了我一套方法，我听了觉得挺简单的，但到今天为止我都不会抛这个筷子。为什么？因为抛筷子是一种技能，你能够学到的只是抛筷子的流程和方法，但是把流程和方法内化成自己的技能还需要一个练习的过程。第三个叫态度，态度是什么？你是不是一个有同理心的人，你懂不懂从别人的角度出发考虑事情，这叫态度。学习一个知识，说不定4天你就记得了，要学习技能可能要练习4个月，要学习态度，要用心学，很可能需要4年或者更长时间。


    今天，我以演讲和写作为例，着重来讲讲个人篇里提到的技能部分，这也是实战意义特别大的一种能力，但所有的方法论，到最后都要靠不断练习来内化到你身上的。


    以我自己为例，我记得我在读高中的时候，我的偶像是蒋昌建，他当时代表复旦大学参加新加坡组织的狮城舌战辩论会，说了一句特别著名的话，黑夜给了我黑色的眼睛，我却用它来寻找光明，那句话轰动了全中国，蒋昌建被评为最佳辩手。结果导致所有的高中、所有的大学都在搞辩论会。


    我那个时候在高中的学习成绩还可以，于是被邀请去参加了学校的辩论会，我作为四辩站在场上，但让我非常屈辱的是，整'
