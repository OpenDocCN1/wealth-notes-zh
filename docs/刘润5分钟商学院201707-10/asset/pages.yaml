    怎么会有这样生活不能自理的人？这样的人，大多是互联网时代的移民。在传统时代，他们的信息是通过“别人给”的方式获得，比如读报纸，看电视。但到了互联网时代，面对海量的信息，他们还没有进化出“自己拿”的能力。


