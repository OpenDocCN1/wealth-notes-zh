    Tony to ni 14

    SMART方法还有一种表述，后面三个单词不一样。分别是achievable realistic timeline

    其中realistic是有现实意义的，和润总这个版本的relevant类似，但还是有些区别。

    SMART作为一种目标制定的方法，不可避免的有些缺陷。比如员工用SMART法制定目标，为了获得成就感，往往制定比较容易的目标。

    为了解决这个问题，木克韦尔奇提出了stretch goal 拓展性目标。韦尔奇说，做事不能光考虑可见的具体目标，更要有那种现在根本无法清晰描述的长远目标，不管怎么说先定下来，再往这个方向尝试。

    而OKR+SMART也能有限避免目标设置过于简单的问题，因为OKR是从上到下的目标分解，这样从公司的战略目标开始，环环相扣往下分解，就能得到一个逐层传导，互相关联的目标链条。

    OKR的另外一个优点是，将目标公布在公司内部，可以让其他人看到并监督，能让目标制定者产生压力，有效的朝着目标前进，毕竟人都是要面子的，自己吹的牛，含着泪也得吹完啊！

    当然，这样也会牺牲底层员工制定目标的机动性。但是，既然在企业，一切以企业的发展和利益为重，我觉得这是可接受的。

