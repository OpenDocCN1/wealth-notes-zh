  md: '# 237 | 移动办公：整个世界都是你的办公室


    # 概念：移动办公


    飞机又晚点了。你傻傻地坐在候机大厅，越想越气，忍不住和地勤大吵一架；飞机终于起飞，两小时，你百无聊赖，把机上杂志翻了又翻，然后，就不知道做什么好了。


    如果这些时候，你有更重要的事情可做，充分利用旅途中的碎片时间，可能就不会这么焦躁和无聊了。不经常出差、旅行的人，对如何在旅途中充分利用时间，没有概念。


    从06年开始，我每年要飞100多次，甚至将近200天不在上海。所以，如何利用工具在碎片时间移动办公，对我来说特别重要。


    # 运用：我常用的“移动办公”工具


    今天，我就与你分享几个我常用的“移动办公”工具。


    # 第一、带手写笔的平板电脑


    在236课，我讲到白板能克服“结构化的思维，有边界的思维，不能错的思维”，释放创造力。但是，在机场休息室你可以用“静电白板贴”，那在飞机上呢？


    你可以用“带手写笔的平板电脑”，在上面写写画画，创作思考。


    我在用微软的Surface Pro 4平板电脑，借助OneNote软件构造白板环境。当然，如果你是苹果粉，可以考虑iPad Pro，也能实现类似效果。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_136_0.png)


    ![](img/67d8d5e736c7e9ca429132df17016a0e_136_1.png)


    其他优秀的平板、笔记本电脑也有不少，但因为不能手写，对我来说没有明显吸引力。


    # 第二、大屏手机＋蓝牙键盘＋手机支架


    有时，我要当天来回一个城市，或在本市参加重要会议，连平板电脑都不想带，太重了，那怎么办呢？


    对于用微信语音，就能运筹帷幄的学员，没什么关系。但对于像我这样，有大量文字工作，比如要在等候时，写一段文字素材；在论坛上，奋笔疾书会议要点的，就可以试试“大屏手机＋蓝牙键盘＋手机支架”的组合。


    首先，讲讲大屏手机。对于什么叫“大”，每个人的感觉完全不同。但无论是大是小，最重要的是，你把手机立在桌上，能不能舒服有效地代替电脑。对我来说，5.5寸（也就是iPhone
    Plus的尺寸）以上，才更适合长时间工作。


    其次，讲讲蓝牙键盘。只回几条微信，发几条朋友圈，没有实体键盘，你也许不会有不顺手的感觉，甚至觉得科大讯飞的语音输入已经足够好了。但当你把大屏手机当电脑用，开始整段输入时，就会感受到，一个全尺寸的键盘有多重要。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '到，一个全尺寸的键盘有多重要。


    我会随身携带一个可折叠的全尺寸蓝牙键盘。往往会议室一坐，把大屏手机竖立在手机支架上，像变形金刚一样咔咔地打开折叠键盘，开始记录，又方便又酷。这能极大增加你的输入效率。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_0.png)


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_1.png)


    最后，讲讲手机支架。为了把手机当电脑用，你需要一个手机支架。很多同学喜欢指环式支架（你可以看到一张图示），但我并不推荐。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_2.png)


    指环式支架，只能让手机横立。横屏，只适合看视频。这个支架是娱乐用的。工作用的支架，必须让手机竖立在桌上。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_3.png)


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_4.png)


    我的手机支架，不用时就像一张信用卡，可以收在钱包里。坐下来后，从钱包里拿出手机支架，口袋里拿出蓝牙键盘，瞬间就能组装一个办公环境。很多《5分钟商学院》的留言，我就是这样回复的。这套移动办公系统，帮助我把回复留言的时间，从2小时缩短为1小时。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_5.png)


    # 第三、蓝牙耳机手环 + 电话会议音响 + 主动降噪耳机


    我每天要打很多电话。为了健康，离手机远一点，我通常用蓝牙耳机。可我常常在吃饭时，接完电话把蓝牙耳机往桌上一放，就忘拿了。所以我的蓝牙耳机，是一打一打买的。


    后来华为出了款可以当蓝牙耳机的智能手环Talkband。我从第一代用到第三代。接听电话，从手腕上取下耳机；接完电话，再放回手腕上。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_6.png)


    有时除了打电话，我还要在酒店开电话会议。过去在微软，会议室有Polycom，或Cisco电话会议系统，在很大的会议室中，即使不直接对着麦克风说话，电话那头都能听得很清楚。我一直希望能把这套会议系统随身携带。


    后来有了BeoPlay A1蓝牙音箱，这个问题就解决了。把手机接上蓝牙音箱，就 небольшую对着空气轻松开会，不需要对着音箱方向大声叫喊。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_7.png)


    我的行程一直非常满，飞机、高铁，汽车上的时间，是我非常重要的休息时间，我希望下了飞机就能精力充沛，可是飞机的轰鸣声很大。后来我开始用BOSE的QC30主动降噪耳机。它不是把耳朵塞得更紧，而是利用科技，对冲掉外面的声音，营造几乎完全安静的环境。用BOSE
    QC30播放一段小桥流水，就可以在飞机上安心睡着了。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_8.png)


    # 小结：认识移动办公


    关于移动办公，我给你介绍了三种工具：


    +   1）带手写笔的平板电脑，把创造性思维，拓展到旅途中；


    +   2）“大屏手机 + 蓝牙键盘 + 手机支架”，营造类电脑的办公环境；


    +   3）“蓝牙耳机手环 + 电话会议音响 + 主动降噪耳机”，营造更健康、轻松、有效的音频环境。


    # 整个世界都是你的办公室


    # 陪你成长的第237天


    ![](img/67d8d5e736c7e9ca429132df17016a0e_137_9.png)


    对于常出差的人来说，借助有效工具在碎片时间移动办公非常重要。大屏手机、蓝牙键盘、手机支架，能营造类电脑的办公环境。'
