  md: '# 232｜罗伯特议事规则：如何用“十二原则六步法”开好一个会


    你召开会议，讨论要做独立的APP，还是继续依托在原来的微信运营。


    有人说：必须做APP，用户是自己的命，始终要独立。有人说：你真是智商堪忧，在微信，至少还有命；自己做，连命都没有。有人说：你才智商堪忧呢，看到那些一言不合就被封的大号了吗？眼看板砖已经拿起来了，袖子已经撸起来了，你打断他们：都别说了，先讨论点有意义的…


    不文明，跑题，打断，一言堂，让这场讨论没有任何结论。在184课我们讲，开会，是用时间换结论的商业模式。可为什么投入同样的时间，有人能赚取极高的结论价值，有人却血本无归呢？


    # 概念：罗伯特议事规则


    因为你用的“开会商业模式”不对。今天，我给你介绍美国国会在使用的开会商业模式《罗伯特议事规则》。这本书被称为开会规则的圣经，可它实在太厚，有人把其中的精华总结为“十二原则六步法”。


    回到刚才的案例，如果运用十二原则六步法，这个会应该怎么开呢？


    第一步，动议。


    动议，就是行动的建议，必须包括时间、地点、人员、资源、行动、结果。比如：

    我动议：投入50万，调拨12人，3个月内做出独立APP。建议在上海开展，由开发总监牵头。


    这涉及到动议中心原则。先动议后讨论，无动议不讨论。


    第二步，附议。


    只要有一个人说：我附议。就可以进入议事流程。


    那如果没有人附议，主持人可以附议吗？不可以。这涉及到主持中立原则。主持人有控场权，必须从讨论中APE...不得发表意见，不得总结别人发言。即便你是领导。


    第三步，陈述议题。


    主持人清楚陈述一遍议题，让大家明确到底讨论的靶子是什么。


    第四步，辩论。


    主持人宣布，开始。


    第五步，表决。


    第六步，宣布结果。


