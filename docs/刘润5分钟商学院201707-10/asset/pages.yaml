  md: '# 第50期客座教授 | 为什么我会看好小米模式？


    第50周客座教授 | 为什么我会看好小米模式... ↓


    前人的思考，我们的阶梯，欢迎收听“刘润·5分钟商学院”。


    《5分钟商学院》的同学们，


    大家周末好！


    这周的客座教授，我为你邀请到了大名鼎鼎的晨兴资本董事总经理，刘芹。他拥有超过18年以上丰富的风险投资经验，专长于媒体，娱乐和服务业等，精通于计算和互联网相关技术。


    在晨兴的早期互联网行业风险投资中，刘芹经常扮演重要角色，他通常都是创业公司的第一轮投资着，目前他主导成功投资的项目有，YY（纳斯达克上市），凤凰新媒体（纽交所上市），迅雷（纳斯达克上市），小米科技，爱屋吉屋，UCWEB（阿里巴巴收购），聚众传媒（分众传媒收购），康盛创想（腾讯收购）等。


    这一周，他和我们深入分享了很多专业的投资经验，干货满满，感兴趣的同学建议点开文稿仔细阅读，一定会对你非常有启发。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_174_0.png)


    刘总投资了小米科技，我们知道，小米的打法是硬件成本价出售，靠软件服务盈利。我个人觉得雷军是目前中国互联网思想实践和探索的第一人。想问刘总，2010年最初雷军和你沟通小米模式时，是怎么说服你的，你对小米模式又是如何理解的？小米模式在未来会有那些挑战？


    决心投资小米，首先是我对雷军有巨大的信心。我认为尽管在2010年，雷军已经被称成为成功的企业家和成功的超级天使投资人，但是大家还是极大低估了雷军的能力。


    由于我和雷军合作投资多个早期项目，有机会非常紧密地一起工作，我得以看到雷军对于自身多年创业过程的反思与复盘，他在通过帮助被投资的公司发展业务的同时，不断提炼并升华出一个整套的创业价值观念、互联网创新思想、产品观、人才管理观、资本关系等体系化的方法论。这些方法论背后既继承了他7在金山创业过程的宝贵经验，又体现了他在金山创业过程诸多不顺背后的反思。


    另外，2010年的雷军是站在PC互联网巨人肩膀上的雷军，他没有沉溺于PC互联网的当时，而是站在整个行业发展的视野里，用体系化的方法论重新思考未来，移动互联网绝不是在2010年才进入他的视野，2006年我们已经多次讨论移动互联网的机会，我们还一起投资了UCWEB；我的第一部苹果一代手机，也是雷军送给我的礼物。


    因此，早在雷军给我打电话那天晚上之前，我们就已经建立了对移动互联网发展前景的高度共识。当天晚上，雷军告诉我小米的想法时，我们是在探讨这是多大的一个事情，值不值得做，有没有可行性，以及他准备怎么去，会有什么人可能加入，需要多少钱启动。我们沉浸在讨论中，以至于完全忘记了时间。因此，基于我对雷军的熟悉和了解，以及对移动互联网方向的高度认可，我是不需要被说服的。更准确地说，我一直在等待雷军做一件100亿美金的大事。事后，我们才明白，我们都低估了小米的价值。


    在我看来，小米公司代表了移动互联网里面一种全新的发展趋势，它最大的突破在于，它是第一个敢于用生态系统的方法，把硬件、操作系统、应用程序、生态系统全部串在一起，用软硬兼施的方式来做用户体验。这样做的难度很大、门槛很高，但跨过去，就能保持较高的壁垒，实现弯道超车的效应，如果继续用传统的打法，就不能和传统大公司竞争。


    更具体地讲，只要能保持创新力度，能不断给用户提供最优的性价比和最好的用户体验，就能长期拥有这些用户，获得他们支持，就能通过向他们提供丰富的应用和服务，获得多元的收入来源。这是它的机会，也是风险所在。


    过去两年，小米公司经历了它的第一次低谷，并从低谷中走出了出来，今天小米刚刚发布完mix2，我依然坚持自己的看法，而且，对它的昨天、今天和未来更加有信心。这更大的信心，来自于在过去外界唱衰小米的两年里，小米取得了重要的突破，


    +   1) 小米不仅在中国站稳脚跟，它已经证明自己将是一家互联网行业的跨国公司；

    2) 小米把自己的产品边界定义从智能手机扩展成物联网智能终端，它还会不断扩展自己的边界；

    3) 小米利用互联网重构了整个价值链条，创造了高效的线上线下新零售模式；

    4) 小米引领了融合硬件、软件、数据、内容与服务的新一代数字生活方式，并定义了一种全新的软硬合体的商业模式。


    小米跑得太快，以至于难以避免地需要慢下来，完成补课，否则你拿不出真正激动人心的优质产品。但即使是补课的时候，它创新的步伐也没有减慢，以至于你无法用既有的框架去定义它。它的创新有时会超出我们当下的认知，时间会沉淀出真正超越周期的价值。借用一个句号，就让子弹再飞一会儿吧。


    过去您有过非常多投资成功的案例，有哪些重要的投资原则，您是如何进行风险把控的？


    早期投资，由于巨大的信息不对称，无法完全依赖定量分析，而更多依赖定性分析做出投资决定。这个特点使得大家普遍对早期投资决策产生好奇心，并容易产生一些典型的误读：比如投资决策好像是艺术，只能意会而无法言传；或者投资有个公式，套上去就能做出决定。或者，早期什么都看不清，就靠判断.....这些解读有一些道理，但很容易失于片面。


    晨兴的投资方法，有点类似于一个企业家的创业决策。优秀的企业家一定是个visionary（预言家），他的战略视野高度、对行业趋势判断的敏感度，都是建立显赫的根本。在这点上，投资人必须培养出与企业家可匹敌的、甚至更宽跨领域的洞察力。反过来，晨兴团队努力构建深入的行研认知，通过与创业者近距离高强度的互动，互相印证感悟行业变革之道，体会创业者的思考深度，才得以接近并辨识优秀的潜力创业者。


    其次，创业者本人的能力成长与业务成长息息相关，而创业过程本质是试错过程。我们对创业者犯错甚至失败有高度免疫能力，甚至可以说，我们会耐心地等待创业者经历一系列的错误，因为我们相信，犯错误是创业者的宝贵财富，也是他得以快速成长的最大助力。同时，我们也异常珍惜与创业者共同面对困境的机会，帮助创业者控制风险，力所能及地用各种工具延长创业者的试错时间与空间。创业者与投资人，每个人能力特点千差万别，这种深度互动没有一个标准姿势，不过投资人要有自知之明，学会帮忙不添乱；创业者要有开放心态，快速吸收。


    限于篇幅，我在此无法详述投资决策的方面面。但基于上述类比，你基本可以体会出来，我们喜欢与创业者深度沟通，喜欢在思考上被高于我们认知的创业者所俯服，创业者的创业愿景、以及他背后的思考过程是我们衡量创业者极为重要的一把尺子。


    另外，我们如宗教信徒般相信，创业者是决定我们投资成败的第一性要素，我们会试图走入你的内心，理解你的内核和源代码。同时，我们承认人是世间上最复杂的进化体，蕴含了巨大的潜力和变异能力，我们乐观地相信巨大的外在危机将锤炼出极少数的胜出者，他们优胜的唯一原因，是他们成功应对了常人故意躲避的风险，并升华了自己的内核与源代码。'
