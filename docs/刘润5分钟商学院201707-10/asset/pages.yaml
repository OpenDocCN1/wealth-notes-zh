  md: '# 243 | 协同软件：如何避免与懒惰握手言和？


    243 | 协同软件：如何避免与..


    今天，我们先来做个小小的复盘。


    你在某个会上，给负责产品的副总交代了一个任务：去德国考察。某天你问他进展如何，他说：“啊？我正忙着质量改进，还没想起这件事，真要去考察吗？”交代的事情，没有下文，怎么办？


    我在第223课教你一个“方法”：PDCA循环，可以避免石沉大海，和拳头打在棉花上的无力感。


    你把目标分解成任务，把任务分配给员工。任务结束后，你对结果不满意。你说打个分吧。满分1分，你只打了0.3分，但员工给自己打了0.9分。为甚么会这样？这是大家对任务，和完成任务的标准认识不统一。怎么办？


    223 | PDCA循环：交代给你的事办完了，就不能回个话么？


    # 概念：协同软件


    我在第222课教你一个“方法”：SMART原则，可以砍掉模棱两可，砍掉标准争议，砍掉不切实际，砍掉无关目标，砍掉无限拖延，让“一千个人心中的一千个哈姆雷特”，变成同一个。


    你特别想自律，也特别想借助“他律”的方法，把最后期限作为第一生产力，一段一段地冲刺马拉松，但你和你的团队，总是与自己的懒惰握手言和。怎么办？


    我在第233课教你一个“方法”：Scrum方法，可以把一次漫长的长跑，分割成一段段全力以赴的冲刺，通过流程提高效率。死磕自已，不仅是一种精神，更需要一套方法论。


    怎么样？PDCA循环，SMART原则，Scrum方法，是不是简直就是神器？但你听完这三课，深刻触动之后，是不是到今天都没有行动呢？


    为什么会这样？


    这世上的工具，分为两种，一种是想用就用“主动工具”，比如螺丝刀。想用就拿出来，不想用，也可以不用。另一种是不用不行的“被动工具”，比如流水线。配件在传送带上一直往前走，你无法叫停整体进度，唯有配合。


    PDCA循环，SMART原则，Scrum方法，都是主动工具。只有把这些主动工具，放到“协同软件”这样流水线一样的“被动工具”上，才能让所有人的个体进度，服从整体进度，高效向前。


    222 | SMART原则：有“OKR”这把刀，更要有“SMART原则”这套方法

    233 | Scrum：‘死磕自己’是种精神，但更是种方法


    # 运用：使用协同软件提高团队的协作效率


    今天，我就给你介绍一款我正在使用的协同软件：Teambition。


    首先，还是要声明，我在介绍这款工具前，并不认识Teambition团队，介绍后，也不会获得任何广告费。我只是以它为例，介绍“协同软件”的价值。


    +   第一、自动化的PDCA循环。


    你突然有个想法，想安排同事去做，你当然可以用微信，说一段语音，或写两句话。但是，这样会有两个风险。第一：你会忘记；第二：他会忘记。你们很可能都不会“主动”想起来。


    那怎么办？在Teambition中，创建一个“任务”，设好3W（Who do What by When），也就是：任务内容，执行者，和截止时间。


    你的同事收到“新任务提醒”后，还可以把它从“待处理”泳道，拖到“进行中”泳道。“泳道”，是协同软件中的黑话，意味着一个个步骤，就像泳池的一条条独立泳道。所有任务，最终只能被完成，或者被取消，不能被忘记。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_155_0.png)


    +   第二、强制化的SMART原则。


    在Teambition或者类似的协同软件中，你都可以设定每个任务的“截止时间”，这就强制设定了SMART原则中的T：Time-Based（有时间限制的）。


    你还可以在任务模板里，专门定义S-M-A-R四种字段，要求每一项任务，都强制符合SMART原则，否则无法创建。


    +   第三、可视化的Scrum方法。


    还记得在Scrum这一课，我提到的“看板”吗？我把办公室的一面白板，做成了Scrum冲刺看板，团队每天站在看板前，开15分钟的“每日站会”。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_155_1.png)


    但是，今天我们讲到“协同软件”，你可以选择不用白板做看板了，你可以用软件。用软件替代白板最大的好处，是把Scrum的冲刺看板，从人情便签的“主动工具”，变成了软件提醒的“被动工具”。可视化，效率，都有极大提高。


    当然，除了Teambition，还有很多不错的“协同软件”，比如Trello，Worktile，Tower，都各有特色。比如Tower在与微信的结合上做得更好。你可以根据自己的情况，选择使用。


    但是，不管用哪个，使用“协同软件”的目的，始终是提高团队的协作效率。慢慢探索，它们可以帮助你解决至少5个问题：


    +   1) 人工管理成本高，工作反馈有延迟

    2) 口头布置工作，理解不透彻，容易遗漏，无据可依，无法问责

    3) 工作分解，多人执行，无法追踪

    4) 无法了解间接下属的工作情况

    5) 计划赶不上变化，过程不可控


    # 小结：认识协同软件


    PDCA循环，SMART原则，Scrum方法，这些工具都很用用。但是，只有把这些主动工具，放到“协同软件”这样流水线一样的“被动工具”上，才能让所有人的个体进度，服从整体进度，高效向前。


    我强烈建议你在公司尝试Teambition，Trello，Worktile，或者Tower，提升团队的协作效率。


