    # 宝宝，你好！


    前人的思考，我们的阶梯。欢迎收听刘润·5分钟商学院。


    到本周为止，《5分钟商学院》第一季260期的全部内容，终于完整彻底地交付给你了。这不是一个结束，这是一个开始，是你可以使用强大的商业兵器库，而再也不是肉搏的开始；也是你把别人的顿悟，变成自己的基本功的开始。


    如果你是刚刚加入的新学员，或者是复习第二遍、第三遍老学员，今天我特别为你制作了咱们这个商业兵器库的使用说明书，把所有的兵器都集合、整理好、放到你面前，方便你更好地调配使用。


    这份《5分钟商学院》的使用说明书，一共包括下面这几项内容，请查收。


    # 5商说明书第1项：全年课表


    这是一份修改了24版、不断升级，最终版的《5商》课表。你可以把它打印出来贴在书桌前，或者办公室，方便后续的查找学习。


    全年课表


    在这份课表里，我把全年260期内容分成了4大体系：


    第一季度商业篇，教你最经典的商业概念；第二季度管理篇，教你最有效的实战管理方法；第三季度个人篇，教你怎样让自己变得更值钱；第四季度工具篇，告诉你如何借助外力、提升前三者。这其实也涵盖了一个现代人和企业外部、企业内部，和自己沟通交流的几个不同维度，希望大家能够不偏废地全面训练自己。


    这260期内容，我按照4个体系都帮你整理汇总好了，你可以直接点击标题、一键直达原文。


    商业篇目录 | 65个即学即用的商业套路


    在商业篇里，我们谈了消费心理学和行为经济学，谈了商业世界的5大基本逻辑和互联网的5大基本定律，了解了微观经济学和宏观经济学，还学习了从产品、定价、营销、渠道四个角度，系统性地解构一家企业的具体商业行为。所有的这些，都是为了不断提升大家的高度和见识，看清商业的本质，找到自己的机会。


    管理篇总结 | 65个最有效的实战管理方法


    其实，很多管理者遇到的问题都是类似的，我们在管理篇里讲了如何招人、如何培养优秀员工、如何有效激励、如何把业绩目标拆成可执行的任务分配下去……希望这些前人的经验和方法能帮你少走弯路、迅速成长。而且，管理里面很多关于人性和心理的分析，完全可以用在管理孩子、另一半、合作伙伴等协作关系中。


    个人篇总结 | 65个“让你更值钱”的习惯养成方法，都在这儿了


