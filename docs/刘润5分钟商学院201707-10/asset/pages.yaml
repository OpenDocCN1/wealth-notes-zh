    《5分钟商学院》的同学们，大家周末好！


    本周我们讲了5个管理工具：进行目标管理的工具OKR、把所有人的目标真正统一起来的SMART原则、保证问题一旦出现一定会被解决的PDCA循环、把所有的经验教训都变成组织能力的复盘工具，以及被广泛用在了解自我、知人善用上的MBTI性格测评工具。希望这些工具能够帮你有效提升公司内部的工作效率、带领团队朝一个方向积极努力。同样，你也可以用这些工具来管理自己的个人成长，也会很有帮助。


    本周的复习串讲，我们来聊一聊管理上特别重要的一个话题：如何有效激励你的协作对象。


    这几乎是所有领导最关心的话题，但其实我们每个人也应该多了解一些，以便在平时与人协作时，充分调动对方的积极性，让对方自觉自愿为你卖力。我总结了11条建议，希望对你有所帮助。


    +   1、有效激励，不仅存在于老板和员工之间，你和孩子之间、和父母之间、和保姆之间、甚至和装修队之间，都需要一些有效激励的方法，激发对方的积极性和主动性，以便发挥出最好能力。哈佛大学心理学家威廉·詹姆士研究表明，同一个个人，受到激励后发挥的能力水平相当于受激励前的3～4倍。'
