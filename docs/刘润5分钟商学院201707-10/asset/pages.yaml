  md: '# 249 | 工具书籍：刻意练习，人人都可以是自己的CEO


    在今天正式推荐工具书籍之前，请大家做好心理准备。工具篇的书，都比较难，都是硬骨头。这5本书不是听完就可以的，甚至不是看完就可以的。它们需要你坐下来，用刀叉切割，咀嚼，下咽，消化，才会变为自己的。但是如果你真能花足够的时间消化完这5本书，一定会能量倍增。


    好，现在开始。


    # 概念：工具书籍


    第一本，埃森·M·拉塞尔的《麦肯锡方法》


    还记得第196课的MECE法则吗？芭芭拉·明托在《金字塔原理》这本书里提到了MECE法则，意思是“相互独立，完全穷尽”。我讲到，MECE法则是很多工具，比如SWOT分析、五力模型、波士顿矩阵、平衡计分表等等的底层逻辑。


    但是，如果你以为麦肯锡只有MECE这一招，那你就太小看这家全世界最知名的咨询公司了。《麦肯锡方法》这本书，就是把包括MECE法则在内的，麦肯锡做咨询时最常用的工具，如数家珍地排了一桌。比如80/20法则，电梯测验，不要重新发明轮子，图表法，头脑风暴等等。


    我15年前读这本书时，大开眼界。从此之后我养成了一个习惯，表态意见时我会说：关于这件事，我有三个观点……即使说这句话时，我暂且只想到一点。


    强烈推荐，看看读完后，你能拿走哪些趁手的宝贝。


    第二本，张维迎的《博弈论与信息经济学》


    “博弈论”是一门极其精深、甚至深不见底的学问。在《5分钟商学院 | 工具篇》2周10篇的“博弈论”课程中，我花了尤其多的时间整理、写作，把树状知识结构，用线性逻辑表达，在博弈论的海洋中，为大家设计了一条“游览路线”，从“纳什均衡”，到“一报还一报”，带领大家领略“博弈论”的美妙。但是，千万不要以为这就是整个海洋。


    博弈论的海洋再往下，都是数学。张维迎老师在这本书里，从7个基本概念（参与人、行动、信息、战略、支付、结果、均衡），4个均衡（纳什均衡，子博弈精炼纳什均衡，贝叶斯纳什均衡，精炼贝叶斯纳什均衡）开始，给你抽丝剥茧地讲述如何求解4大博弈（完全信息静态博弈、完全信息动态博弈、不完全信息静态博弈、不完全信息动态博弈）。


    建议对这个话题特别有兴趣，数学功底好的同学，阅读此书，打通任督二脉。


    第三本，吴军的《数学之美》


    既然谈到了数学，那索性就来讲数学。我知道，我知道，一提数学，很多同学立刻口吐白沫，倒地不起。但是，数学，的确是理解万物的秘密。经济学的最后，是数学；物理的最后，是数学；万物理论的最后，都是数学。数学，是理解这个世界的终极学科。


    我的本科是数学系毕业的。数学系是不学“高等数学”这门变态的课程的……我们学习更变态的数学分析，复变方程，实变函数，常微分方程，泛函分析，拓扑学等等。高等数学，只是数学系的课表。


    但是，只教理论，却不教可以用这些理论干什么的教学体系，让很多人对数学产生心理阴影，比死还恐惧，没有感受到数学的美。数学是这个世界上最美的东西。如果你不信，一定要阅读吴军老师的《数学之美》，好好感受一下。


    读这本书，能让你重建对数学的兴趣，进而拿起数学的武器，很多问题都会迎刃而解。


    第四本，弗雷德里克·S·希利尔《数据、模型与决策:运用电子表格建模与案例研究》


    这本书，是所有商学院的必修课，但可能也是商学院所有课程中，最难的一门课。其实……好吧……它还是数学。


    我在第114课“决策理论”里说到“完全理性决策”时，提到了“运筹学”。数据、模型与决策（DMD），就是专门为MBA写的、简化了的运筹学，教大家如何用Excel，做一些简单的“完全理性决策”。这对补全大家的决策理论，非常重要。


    别害怕，数学是很美的，而且这是MBA的必修课，静下心来，挑战一下吧。


    第五本，安德斯·艾利克森《刻意练习》


    好了，好了，醒过来吧，同学们，我不再提数学了。在工具篇，我想推荐给大家的最后一本书，叫《刻意练习》。


    大家熟知10000小时定律。但是一个动作“自动完成”10000次，10000小时，你也不会成为高手。很多人号称自己有10年工作经验，其实，他只是把1年的工作经验，重复了10次而已。重复，不带来进步。真正的进步，来自“刻意练习”。所谓的“刻意练习”，是因为不断反思、调整，每一次都比上一次有进步。


    本书的作者描述了刻意练习的音乐模式、国际象棋模式和体育模式，很值得真正愿意不断提高自己，最后成为专家的同学们细细琢磨。商业天才不是天生的，刻意练习，人人都可以是自己的CEO。


