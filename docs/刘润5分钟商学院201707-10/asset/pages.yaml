  md: '# 第49期客座教授 | 未来，中国企业最需要突破的地方在哪里？


    ![](img/67d8d5e736c7e9ca429132df17016a0e_160_0.png)


    第49周客座教授 | 未来，中...


    前人的思考，我们的阶梯，欢迎收听“刘润·5分钟商学院”。


    《5分钟商学院》的同学们，


    大家周末好！


    这周的客座教授，我为你邀请到了著名财经作家，巴九灵新媒体、蓝狮子财经出版创始人吴晓波。


    他常年从事中国企业史和公司案例研究，被誉为中国最好的财经作家，著有《大败局》和II、《激荡三十年》等广具影响力的财经书籍，著作两次入选《亚洲周刊》年度最佳图书。2014年，他在微信、爱奇艺等内容平台开设自媒体“吴晓波频道”，微信公众号订阅用户超过300万，是国内最大的个人财经类自媒体。


    这一周，他和我们分享了他的很多商业思考，感兴趣的同学建议点开文章仔细阅读，一定会对你有所启发。


    下面有请本周的客座教授，吴晓波老师。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_160_1.png)


    在《激荡三十年》里有很多公司成长的故事，这些公司在哪些方面，与那些引领世界潮流的优秀企业还有差距，需要如何改进？


    明年是中国改革开放的40周年，所以我写《激荡三十年》是十年前的 Gregorian 工作。40年来，中国由一个没有一家民营企业的计划经济国家，到今天变成全球第二大经济体，这个过程中诞生了一千两百多万家民营企业，这已经成为了中国改革开放以后最重要的一股商业力量。


    如果跟30多年前相比，中国公司和所有欧美发达国家的公司相比，还是有很大的差距。但是在今天，我觉得这个距离已经越来越小了。


    在微观层面上，中国公司在现场管理、生产线管理以及公司治理结构等等方面，跟欧美国家几乎已经没有什么大的差距了。相反，中国公司在员工激励、公司管理制度组织架构中的创新，比欧美国家有更激进的一面，比如我们在华为、阿里巴巴、腾讯这些公司所看到的，公司管理制度、组织架构方面，都有自己相当独特的经验。


    在产业层面上，中国也出现了一些利润、规模都排在全球第一的公司，中国有全球最大的白电企业海尔，有全球最大的房地产公司，有全球最大的电子商务公司、社交公司，甚至包括家电连锁公司等等。


    如果说还有什么差距的话，那么这个差距可能还是几十年来中国公司的一个老毛病：核心技术能力的缺失。在很长时间里面，中国作为一个后发展中国家，进行的是跟进式的战略，我们引进国际核心技术，在中国通过市场和消费者的空间来进行消化。到今天，在很多领域里面，无论是规模还是利润，我们都已经排在了全球靠前的位置，但是核心技术能力缺失的问题还是没有得到完全解决。


    我记得几年前硅谷的一个创业家叫做彼得·蒂尔，出过一本书《从0到1》，说在硅谷最大的创新能力，是把一个从来没有的技术从0变成可以应用的技术和商品，所以所有的创新都是从0到1。在中国地区，几乎所有的创新都属于应用型创新，而不是发明型创新，是从一到一百、到一千、到N的过程，在这个方面中国和发达国家公司之间的距离还是比较大的。


    但是我们也能发现一些追赶的迹象，这个距离在某些领域中正在缩小。比如在过去的两年里，全球发明性专利申请第一名的公司是华为，替代了美国高通成为了全球发明专利最多的企业。


    另外一个未来几年有可能被改进的部分，是对本土市场消费者的研究，特别是对中产阶级消费者研究，这就是中国公司在文化审美和工业设计上跟欧美发达国家公司之间还存在很大差距的一个方面。


    所以我们最后来总结一下这个回答：如果从硬件角度来讲，那就是核心技术能力；从软件角度来讲，就是文化审美和设计能力。这两个部分能力的短缺，是中国公司在未来需要突破，也是有可能得到突破的重要空间。


