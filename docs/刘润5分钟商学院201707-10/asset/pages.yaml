    除了自己多注意发现隐含在环境变化中的机会以外，还要注意盯住大块头，因为大公司通常都会有专门的人员去研判趋势，比如要是国家出台一个政策，最先抓到政策信息，解读趋势的一般都是大公司，大公司会先知先觉，先动作，先受益。把两位老师的内容串在一起对智猪博弈和借势又有了更深的体会。作为小猪就要当一只智猪，懂得审时度势，主动找机会。不能当一只趴起双手等机会的笨猪。作为大猪也要有海纳百川的胸怀，修缮大格局，不怕吃亏被别人占便宜，这样才会有更多的追随者，更多别人看不到的大机会。


