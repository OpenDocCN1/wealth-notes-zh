  md: '# 个人篇线下大课来了：如何用同样时间，换取更多价值？


    个人篇线下大课来了：如何...


    前人的思考，我们的阶梯，欢迎收听“刘润·5分钟商学院”。


    每个人都是自己的CEO。过去，我们服务于一家“有限责任”公司，未来我们都要经营“自己”这家无限责任公司。在未来的世界，我们与整个世界只有一种关系：合作关系。与老板合作，与下属合作，与客户合作，与整个世界合作。可是，我们拿什么来与他们合作呢？我们拿什么给这个世界，才能从这个世界换回我们想要的价值呢？


    是体力吗？是努力吗？还是智力呢？都不是。“自己”这家无限责任公司拥有的唯一资产，我们能用来与这个世界交换的唯一的东西，就是“时间”。人与人的差别，就在于同样给你一生的时间，你能换回什么。有人什么都没换回，有人换回了几乎整个世界。


    那怎样才能用一样的时间，谁也不比谁长？的每一秒，每一分钟，每一小时，每一天，换回更多的价值呢？


    《刘润·5分钟商学院》第三季度个人篇已经结束了。我和得到团队商议，正式选定8月5日在成都，8月12日在深圳，举办两场，也是唯一的两场“个人篇线下大课”，分享“自己”这家无限责任公司，“用时间换世界”的商业模式。用一个简单的公式表示，就是：时间价值
    = 专业 x 效率 x 杠杆。


    什么意思？我将在大课上，分为三个部分，与你分享它这个“个人商业模式”背后的逻辑。


    第一，专业。如果你是个裁缝，你一小时的价格是200元；你是好裁缝，你更专业，你的价格是2000元；你是全球顶级裁缝，比尔·盖茨找你做衣服，你的价格是2万元，或者20万元。让自己变得更“值钱”，也就是更专业，是“个人商业模式”的基础。但是怎么才能做到呢？拥有什么样的精神力量，才能让自己比别人更专业？拥有什么样的学习方法，才能让自己比别人更快地变专业？拥有什么样的心理素质，才能让别人感受到你的专业？


    第二，效率。让自己变得更值钱，是不够的，因为你再值钱，你能与这个世界交换的资本，时间，总是有013的。怎么管理好你的时间资产？从17分钟里省出17秒来，叫做时间管理吗？大量浪费掉的碎片时间，就像乱花的钱，怎么利用起来？如何通过方法、工具，提升自己时间效率？如何通过演讲、写作，提升自己沟通效率？如何把17分钟，用出17小时的气势？


    第三，杠杆。让自己变得更值钱，并让每一分钟都用来赚钱，还是不够的。想用自己的底牌，和这个世界换取最大的价值，你还需要和其他选手打好配合，用好“杠杆”。如何利用“团队”杠杆，突破“你的时间终究有限”这个魔咒？如何利用“产品”这个杠杆，让你的时间，和你的团队时间，可以无限复制？如何利用“资本”这个杠杆，让你的产品价值飞跃式提升，并且提前提升？


    时间价值 = 专业 x 效率 x 杠杆。用好这三个乘数，同样的 一生，也许你也能换回你的全世界。


    这次的大课，我们还做了一个全新的尝试。为了能帮助每个人成长，在讲完三部分的内容之后，个人篇线下大课的第四部分，我将用来回答你们这些CEO现实世界中的真实问题。报名参加大课的同学，可以按照固定格式，提交你们遇到的商业困惑、管理烦恼和个人挑战，我将挑选一些具有共性的问题，在第四部分回答，帮助你解决具体的问题。参加大课的同学，千万不要错过这次宝贵的“微咨询机会”。希望你是被选中问题的幸运儿。


    点击下图！即可直接报名参加此次大课，我们的同学们将依然享受购买7折优惠。


    这是“刘润·5分钟商学院”在线下陪你成长的第五课和第六课，个人篇的唯一的两课，期待你的参与。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_22_0.png)


    # —— 本周留言精选 ——


    最后，我还要提醒你，我精选了这个礼拜最精彩的5位同学的留言，给每个同学都准备了一份小礼物，欢迎同学们踊跃留言，写留言的过程，是你整理思路、强化理解的过程。写下来自己感悟的学习效果，会远远好于只听一遍。


    曾经在团队里讲过MECE法则，举了该不该辞职跳槽的例子。可以从老板、同事、环境、薪资、福利，甚至是不是离家近，把能够列出来的影响你愿不愿意再继续呆在这家企业的因素穷尽，然后换个分析评分，总分及格以上，就不应该跳槽。MECE法则用来评估很多犹豫不决的事情，可以解惑不纠结。


    来自工具篇196 | 透过结构看世界


    我们公司的主要产品是发往中亚五国的铁路运输代理服务，公司类型为国有控股的合资公司，我们的五力模型和对策如下：


    +   1. 直接竞争对手：提供同样服务公司。对策：差异化服务，利用公司的好平台和队伍的稳定性，坚持抓操作水平，让客户放心省心。一句话，就是做操作型货代，不做销售型货代。

    2. 供应商：中国铁路总公司，唯一一家。对策：既然供应商处于垄断地位，那需要的就是和他搞好关系，方法若干。

    3. 顾客：韩、日、东南亚公司为主，国内公司为辅。对策：做了十年中亚市场，在顾客中有一定影响，竞争虽然激烈，但是价格战。我们主抓技术，就是将中国铁路和海关的政策研究透，同时保持非常低的操作失误率，让客户放心、知道虽然价格高些、但不会出问题。'
