    206 | 纳什均衡：明明可...


    这周开始，终于要讲博弈论了。


    两家人人工智能公司，“熟悉的陌生人”和“看透人心”，都在耕耘人脸识别市场，但这项技术还处于第48课讲的“技术采用生命周期”的早期，用户接受起来困难。于是两位创始人见面，商量共同投入，培育市场。你们立下君子协定：各投入1亿，大举宣传人脸识别技术。你们预计，这将给各自带来2亿收入，减去投入，各赚1亿；但如果只有一家投，效果差很多，可能会投入1亿赚5000万，等于赔5000万，不过未投入者会搭便车赚到2000万；如果都不投入呢？不赚不赔。


    显然，共同投入，是最优策略。


    你可以直接点击，回看第48期的课程

    048 | 技术采用生命周期：跨越死亡之井


    | 联合宣传策略 | 熟悉的陌生人 |

    |---|---|

    | 看透人心 | 投入1亿 | 熟悉的陌生人：赚1亿 看透人心：赚1亿 | 熟悉的陌生人：赚2000万 看透人心：赔5000万 |

    |  | 不投入 | 熟悉的陌生人：赔5000万 看透人心：赚2000万 | 熟悉的陌生人：不赚不赔 看透人心：不赚不赔 |


    回来后，你立刻召集团队开会，部署1亿的营销计划。这时，你的营销总监对你说：


    老板，1个亿不是小数目。如果他们投了，我们不投，就可以白赚2000万，让他们 seemed倒亏5000万。那时我们再继续乘胜追击，扩大战果，顺便干掉元气大伤的对方，不是更好吗？而且，假如我们真投了1亿，对方狡猾不投，我们不是死得很难看？


    你一听，有道理啊！那我先看看他们的动作。


