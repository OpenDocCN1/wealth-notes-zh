  md: "未来的消费者，在“虚拟世界”里面消费的时间必然会越来越多，大家有时间可以查一下关于5G的一些资料，5G时代的虚拟世界，比现在的“王者荣耀”对于成年人的吸引力“有过之而无不及”，所以消费者去实体店购买服装等大部分可以通过“提袋零售”完成的交易的比例，一定会越来越低。所以，对于绝大多数服装品牌以及类似品类，未来基本都是纯电商品牌，通过提袋零售（线上成交+线下配送）来完成，不断优化客单价和转化率，走相对的“薄利多销”（“薄利”是性价比，不是绝对低价）的模式。韩都衣舍一直\
    \ 在提倡的“大品牌做成二级生态，中小品牌融入二级生态”的理念也是基于这个观点。\n\n而线上引导+线下成交的模式适合于商品价格带里头部和底部的产品，就是“必须去实体店”和“没必要在网上买”的商品，它们一样有生存和发展的空间。对于前一种头部产品而言，只有提供了更多附加值（包括更好的体验感），才可能在线下生存下去，但这个更多更好的体验成本，必然会体现在价格上，一定会远远高于线上。\n\
