    # 打不赢你，那我就恐死你


    # 陪你成长的第200天


    ![](img/67d8d5e736c7e9ca429132df17016a0e_17_0.png)


    有些免费不完全是“情怀”，而是竞争策略。试着从竞争实力和行业吸引力两个维度分析业务，看懂复杂环境的组合决策。


