  md: '# 208 | 智猪博弈：不懂搭便车，你连小猪都不如


    第207课，我介绍了基于纳什均衡的一个非常著名的案例：囚徒困境。今天，我再介绍同样基于纳什均衡的一个同样著名的案例：智猪博弈。


    # 概念：智猪博弈


    这是一个博弈论界非常知名的猪圈。猪圈很长，它的一头是一个踏板，另一头是一个食槽。如果在这头踩下踏板，那一头的食槽就会掉下10份食物。猪圈里面，有一只大猪，一只小猪。不管谁去踩踏板，都要消耗相当于2份食物的能量。那问题来了，谁去踩踏板呢？这就有四种情况：


    +   第一，大猪小猪都守在食槽边，等着对方去踩踏板。这样，谁也没吃到。

    第二，大猪小猪同时踩踏板，然后同时跑向食槽，同时吃。大猪比较能吃，吃了7份食物，减去跑步消耗了2份体能，实得5份；小猪则只吃了3份，实得1份；

    第三，大猪很懒，守在食槽边不动，小猪跑去踩踏板。这时大猪就能吃得更多，独得9份，而且因为没有运动，实得9份；小猪踩完踏板跑到食槽边，就只能吃到1份，减去跑步消耗了2份体能，实得-1份。

    第四，反过来，小猪不动，守在食槽边，大猪跑去踩踏板。这时小猪抢先了，能吃到4份，实得4份；大猪跑回来，还能抢到6份，实得4份；


    根据第206课学到“纳什均衡”想一想，大猪小猪的最佳策略是什么？


    | | | 大猪 | |

    |---|---|---|---|---|

    | 智猪博弈 | | 踩踏板 | 不踩踏板 | |

    | 小猪 | 踩踏板 | 大猪：5，小猪：1 | 大猪：9，小猪：-1 | |

    |  | 不踩踏板 | 大猪：4，小猪：4 | 大猪：0，小猪：0 | |


    欢迎回来。大猪小猪的“纳什均衡”是：大猪踩板，小猪不动。为什么？


    如果大猪单方面改变策略，不去踩踏板，策略集合将变为“大猪不动，小猪不动”，他的收益将从4会减为0，猪都不会傻到这么做。如果小猪单方面改变策略去踩踏板，策略集合将变为“大猪踩板，小猪踩板”，他的收益将从4减为1。小猪也不会做。所以，“大猪踩板，小猪不动”，各自收益4份食物，是一个稳定的纳什均衡。


    这就很有意思了。你想想，“囚徒困境”中，虽然两名囚徒各自心怀鬼胎，但是一荣俱荣、一损俱损。最后的“纳什均衡”是“一损俱损”的彼此背叛。但是在“智猪博弈”中，居然出现了小猪明显占优的现象，最后的“纳什均衡”是“大猪踩板，小猪不动”下小猪的“搭便车”。


    这就是著名的“智猪博弈”。在这个博弈中，对小猪来说，其实没什么好博弈的：不管大猪是踩还是不踩，不踩都是我更好的选择。小猪明显占有优势。不踩，在博弈论的术语中，是小猪的“占优策略”。


    # 运用：商业中的启示


    这个有趣的“智猪博弈”，对我们在商业世界中，有哪些启示呢？


    +   第一，小企业，要懂得合理“搭便车”。

    搭便车，听上去和“价格歧视”一样，让人有些不舒服。但是在法律允许的范围内搭便车，是小企业重要的“占优策略”，应该毫不手软。

    其实，你不知不觉中，可能已经在使用这个策略。

    比如，你是小的房地产商，可以在万达或者万科项目的附近拿地，然后“等待”他们把生地炒熟，“搭便车”获利；

    比如，你是小的制造企业，可以“等待”大公司投入巨资，推出被验证能赢利的新产品，然后“搭便车”切入市场分蛋糕；

    比如，你是小的证券公司，你可以“等待”大的证券公司不断试错，找到金融科技的基本玩法后，“搭便车”实施最优方案，分得市场；

    比如，你是小的国家总统，可以把“跟随型战略”作为国家战略，不断在科技、产业、创新上“搭便车”，“等待”成为大猪，再讲“大国心态”。

    第二，大企业，要懂得制约“小猪心态”。

    如果便宜都给小企业占了，那大企业怎么办呢？这对社会资源的分配，会不会不公，甚至降低效率呢？会不会导致大家都不创新呢？

    专利保护，就是防止“小猪心态”的制度设计。国家，也就是养猪的人规定，在食槽里锁定一块区域，给踩到踏板的猪独享。这样，大猪就不用担心，自己跑去创新，结果回来发现，食物都被小猪分光了。小猪发现等待不是“占优策略”了，就会去创新，去踩踏板。

    在管理中也一样。如果懒人存在“占优策略”，就会劣币驱逐良币，导致肯干的人受挫，陆续离开。怎么办？记住一个原则：踩踏板，一定要比不踩踏板吃得多。激励到个人，不能到团队，否则团队中就会出现小猪。


    # 小结：认识智猪博弈


    什么是智猪博弈？这是一种特殊的“纳什均衡”，搭便车的小猪，拥有不管大猪怎么办，我都不得动的“占优策略”。

    商业世界中，除了Pages一荣俱荣、一损俱损的“囚徒困境”，还有大量的“智猪博弈”。小企业要懂得合理搭便车，大企业要懂得制约小猪心态。


    ![](img/67d8d5e736c7e9ca429132df17016a0e_46_0.png)


    小企业要懂得合理搭便车，实施“占优策略”分得市场。大企业要懂得利用专利保护等制度设计，制约小企业占尽便宜。'
