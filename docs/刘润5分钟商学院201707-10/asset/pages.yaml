  md: '# 214 | 零和博弈：吃着碗里的，看着锅里的，想着田里的


    你和老婆大人商量，为了健康，两人要坚持每天跑步。你甚至参考第61课讲的“对赌基金”法，设计了一个规则：每天不管谁偷懒，都要输给对方100元。在这件事情上，老婆犯法，也要与庶民同罪。但是执行了几个月后，你发现你老婆的动力明显不足。


