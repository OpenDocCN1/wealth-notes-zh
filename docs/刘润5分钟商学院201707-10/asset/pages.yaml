  md: '# 248 | 个人书籍：个人升级，最重要还是认知升级


    关于个人成长的书籍，我真是思考了很久，到底要推荐什么给大家。演讲技巧吗？写作技巧吗？谈判技巧吗？时间管理技巧吗？都很好，但是是技能层面的知识，是无穷无尽的。在没有上限的个人成长中，如果只能推荐5本书，我决定，还是推荐5本能帮助大家“认知升级”的书。


    # 概念：个人书籍


    第一本，刘慈欣的《三体》


    《三体》是一本讲宇宙的科幻小说。但是这本科幻小说不仅轰动了科幻界，更轰动了中国的互联网界。在某一时间，互联网言必提大刘的《三体》，尤其是“黑暗森林”，“降维打击”等概念，以及很多金句，比如“无知和弱小不是生存的障碍，傲慢才是”。


    为什么这本书能受到一个行业的热捧？因为它作为一部“硬科幻”作品，其逻辑严谨的想象力，让即使是科技行业的同学们都脑洞大开，叹为观止；其深刻的哲学思想，比如高维对低维碾压的“二向箔”，暴露即灭绝的“黑暗森林法则”，让大家对互联网世界的残酷竞争，照镜子一般唏嘘不已。


    雷军要求他投过的公司高管，都要阅读《三体》；我也推荐每一位《5商》学员阅读《三体》，拓展无边无际、但又符合宇宙规律的想象力，窥探互联网世界的竞争哲学。


    第二本，凯文·凯利的《失控》


    凯文·凯利的火爆，不是依靠当下的呓世成就，或者惊天言论，而是依靠一本20年前的预言书：《失控》。这本书在1994年对未来的预测，比如“连接一切”，“赢家通吃”，“去中心化”等等，在20年后的今天正在逐一实现，让大家惊为天人。


