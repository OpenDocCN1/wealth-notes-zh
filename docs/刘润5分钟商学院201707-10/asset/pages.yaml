    # 小结：认识白板


    为什么要用白板思考？白板这个“看上去平淡无奇，其实不断创造神奇”的工具，可以把我们从“结构化的思维，有边界的思维，不能错的思维”中解放出来，帮助我们随时随地，无边无际地思考。


    怎么使用呢？小办公室把柜门做成白板；中办公室把立柱做成白板；大办公室把墙面做成白板，甚至装修一个用白板做的“创意空间”。如果你觉得还是不够随时随地、无边无际，可以在家里面用有装饰效果的“黑色烤漆玻璃”，在物体表面刷上“白板漆”，甚至在旅途中用“静电白板贴”，放飞你的思考。


