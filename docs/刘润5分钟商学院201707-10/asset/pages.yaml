    # 陪你成长的第203天


    ![](img/67d8d5e736c7e9ca429132df17016a0e_31_0.png)


    收入、成本和利润这些传统指标，只能衡量过去发生的事，无法评估当季性的投资。可以借助“平衡积分卡”来管理公司的短期和长期利益。


    # 得到专栏·5分钟商学院

