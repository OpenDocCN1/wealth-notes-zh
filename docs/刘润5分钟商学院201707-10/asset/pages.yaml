  md: '插一句，我们在《刘润·5分钟商学院》中，已经讲述了很多基于“二维四象限矩阵图” 的方法论，比如第88课的“情境管理矩阵”，第119课的“风险管理矩阵”，第135课的“时间管理矩阵”等等。“二维四象限矩阵图”，作为这些方法论的基础思维工具，这个季度我还会专门讲。


    管理篇088期 | 情境管理：他是钉子你用锤子，他是螺丝你用改锥

    管理篇119期 | 风险管理：悲剧里挖出来的学问

    个人篇135期 | 要事第一：我不忙，我只是时间不够


    # 波士顿矩阵的二维四象限：


    ![](img/67d8d5e736c7e9ca429132df17016a0e_12_0.png)


    # 第一，现金牛业务（Cash Cows）


    现金牛业务，也被戏称为“印钞机”，它通常有很高的相对市场份额，但也因此市场增长率就显得低了，比如微软的Windows和Office，谷歌的搜索业务，都是现金牛，印钞机。


    # 第二，明星业务（Stars）


    明星业务，通常是很有前景的新兴业务，在一个快速增长的市场中，占据了相对高的市场份额。比如从卖书起家的亚马逊，进入了高速发展的云计算业务，并占据领先地位。虽然开始不赚钱，甚至需要大量资金的投入，但它是未来。一旦明星业务成为现金牛，公司就进入下一个爆发期。


    # 第三，问题业务（Question Marks）


    问题业务，是一些相对市场份额还不高，但市场增长率提高很快的业务。比如谷歌在人工智能、机器人、无人驾驶等业务的投入之所以叫“问题业务”，是因为它们最终会成为明星业务，甚至现金牛业务，还是会死掉，是不确定的问题。


    # 第四，瘦狗业务（Dogs）


    相对市场份额很低，也看不到什么增长机会的，食之无味弃之可惜的业务，被称为瘦狗业务，比如微软的智能手机，腾讯的微博，百度的电商。


    # 运用：波士顿矩阵的四种战略建议


    现在你再回过头来听那位咨询顾问的话，就会明白他说的明星、瘦狗什么的，到底是什么意思了。甚至，你都可以预测他会给你什么战略建议。


    他的建议可能是这四个：


    +   - 第一，发展战略。就是不惜用“现金牛业务”的收益，大举投入到“问题业务”中，以提高相对市场份额，尽快成为“明星业务”的战略；

    - 第二，保持战略。就是不轻易投资新方向，好好养牛，维持市场份额，让“现金牛业务”产生更多的收益。

    - 第三，收获战略。对强大的替代产品已经出现的“现金牛业务”，比如柯达的胶卷相机，和发展前景不佳的“问题业务”和“瘦狗业务”，可以考虑尽可能快速收获短期利益，然后准备放弃。

    - 第四，放弃战略。对于无利可图的“瘦狗业务”，果断清理、撤销、出售，把资源用在其他有前景的业务上。


    每家全球知名的咨询公司，都有自己的看家本领和“黑话”，比如麦肯锡的金字塔原理，波特的五力模型，特劳特的定位理论，和布鲁斯的波士顿矩阵。


    听完这一课，我希望你不仅可以用波士顿矩阵的术语，和咨询专家对答如流，更重要的是，你可以自己分析业务组合，并且思考战略问题。


    # 小结：认识波士顿矩阵


