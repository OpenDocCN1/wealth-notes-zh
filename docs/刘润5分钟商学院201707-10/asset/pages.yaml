    \n邮件、日历、联系人，是互联网时代商务人士的战马、盔甲，和长矛，一样都不能丢。\n\n我拿起手机，能立刻查到过去20年每个人发给我的邮件，看到5761个联系人的联系信息，以及在16年前的某个下午，几点几分，谁曾和我在哪个开过多久的会，讨论了什么。\n\
    \n手机丢了？没关系。买个新的，花两分钟设置，5761人，就全部回到了手机里。一切信息，在任何时间，任何地点，通过任何设备，都唾手可得。\n\n# 概念：邮件、日历、联系人\n\
    \n怎么做到的？今天我给你讲讲，我是怎么用“邮件、日历、联系人”的。\n\n# 第一，邮件。\n\n我希望你记住两点。\n\n+   1. 作为商务人士，千万不要用免费邮箱。\n\
    \   掏出名片，留的是QQ邮箱，非常不职业化。你应该申请专门的公司邮件后缀（比如，润米咨询的邮件后缀是：run2me.com），表明你创业是认真的，企业是正规的。谷歌的邮箱后缀是google.com，腾讯的邮箱后缀是tencent.com，都不是自己的免费邮箱。\n\
    \n+   2. 保留所有历史邮件。美国的《萨班斯法案》要求在美上市公司保留电子邮件至少5年。我用它要求自己，保留了过去近20年的邮件。这给我带来了极大好处，通过搜索，可以随时、瞬间调取历史邮件，提高沟通效率。\n\
    \n# 第二，日历。\n\n很多人都理解，邮件是存在“邮件服务器”上，但未必清楚：日历、联系人也应该存在邮件服务器。用不提供云端存储的日历、联系人工具，是一个必须去掉的坏习惯。打电话给你的邮件服务商，问他怎么把手机，与日历系统相连。\n\
    \n然后，把一切事情，都放进日历。\n\n有同事邀请你开会？请他用邮件发“会议邀请”，你在手机上一點“接受”，日历中就会多出一条日程。\n\n定了航班，收到短信、邮件确认？聪明的手机，都会把航班、酒店、信用卡还款信息，变成一条条日程，放进你的日历。\n\
    \n你想在周五下午独占2小时，专心思考？也加一条到日历中。\n\n我的时间颗粒度是30分钟，我会把所有对时间有占用的事，都放进日历。当有人问你：周三下午有半小时开会吗？你可以立刻打开邮件客户端，查看日历。然后回答：2点-3点可以，发个会议邀请给我吧。收到邀请，我会把日程标为红色。\n\
    \n我用红色表示重要且紧急的事，蓝色表示重要不紧急的事。\n\n![](img/67d8d5e736c7e9ca429132df17016a0e_153_0.png)\n\
    \n周三下午2点快到了。提前15分钟，我的手机提醒我：15分钟后，在三楼会议室开会。\n\n提醒非常重要。约了会议，把提醒设为提前15分钟；约了晚饭，设为提前1小时；定了航班，设为提前2个小时；朋友生日，设为当天早上10点。\n\
    \n如果你用微软的Office 365，还可以请助理帮你安排行程。清晨，我的手机响起，一则行程跳出：1.5小时后，司机来酒店接我去客户办公室。之前，我需要吃早餐、退房。退房时需要的发票抬头、税号，司机电话，客户联系人姓名、职位，都在ските日程中。\n\
    \n这就是日程管理，这就是效率。\n\n# 第三，联系人。\n\n从98年开始，我坚持把联系人信息，都存在云端。现在已经有5761人了。坦白说，我记不住每个人，但是“联系人”工具可以。常常很久没联系的人给我打电话，我拿起手机就说：“xxx，好久不见啊”。他非常惊讶，“哇，这么久没联系，你还记得我啊”。\n\
    \n使用联系人工具也要注意几点。\n\n输入电话，一定要点加上国别、区号。比如上海的固定电话：61888888。别人在名片上这么印电话，你要知道，他没有国际视野，但你不能没有。你要存为“+86(21)61888888”。因为如果你在美国，拨打61888888，是接不到上海的。\n\
    \n有时，你看到名字也想不起来是谁怎么办？认识新朋友，你可以和他合张影。回去后，把他的头像存入联系人。这样，当他的电话响起，手机屏幕上就会出现大头像。\n\n\
    如果你正好知道朋友生日，也把它记入联系人。输入到“生日”条目，每年这天，就会有条“日程”，是他的生日。再把提醒设为当天早上10点。提醒响起，你就可以微信他四个字：生日快乐。\n\
    \n如果你碰巧知道了他的结婚纪念日，儿子生日，或者爱吃什么，一切有关信息，都可以存在联系人里。下次约火锅，在联系人里一搜“火锅”，狐朋狗友就都出现了。\n\n\
    把最基础的“邮件、日历、联系人”用到极致，你会拥有神奇的效率。\n\n# 小结：如何使用“邮件、日历、联系人”\n\n+   1）商业邮件，不用免费邮箱；\n\
    \n+   2）保留所有电子邮件，随时可查；"
