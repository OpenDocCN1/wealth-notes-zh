  md: '我举一个例子，我自己是一个其实除了对商业在研究，我自己有自己的管理咨询公司在帮助很多大型企业做战略顾问之外，我是一个特别爱旅行的人。我去过不少地方，我去过南极、去过北极，2015年的时侯我还跟我的10位朋友，一起去了非洲爬乞力马扎罗。爬乞力马扎罗是要爬七天的，近山是在海拔1800米，第二天到了2800，第三天到了3800，第四天先冲到4600，中午，然后到晚上再下来，为什么要下来？就是适应一下4600的高度，然后再3900，第四天3900，第五天3900，横切两天让你适应海拔，到第六天的时侯早上冲到4600的冲锋营，中午就开始睡觉，到晚上11点半开始冲顶，冲那个5895米，将近6000米。我记得我在那个晚上心率已经到了140，我觉得我要死在山上了，那个时候我说我要下去，不行，我一定要下去。我的向导跟我说，对不起，乞力马扎罗只能往前不能往后，只有到最后一天，到冲锋营才能下去，可是你只要到了冲锋营你还会想下去吗？都到最后一天了，到冲锋营咬着牙都得向上，最后好不容易登了顶到了5895，我真是泪如雨下，觉得真是太不容易了。当时我们11个人10个人登顶了，这10个人全部都泪如雨下。但是我们的旁边还站了62个黑人，他们是<|start|>着我们爬山的，每天早上我们背着自己的包袱装上阵，那些黑人就把帐篷一收，厨具一收，桌子一收，把所有东西一收，往头上一顶，然后就走到第二天的营地了。等到我们到下午都快不行了，到营地的时候他们连饭都做好了，所以到了我们最后登顶的时候那些黑人就跟玩一样的，他们一年登二三十次，每次登山看着我们在那哭得一塌糊涂，他们就看着很好笑。当时我也特别感触，哭完之后我的感受是什么呢？就是所有的那些悲情叙事，最后都是因为你的基础体能不够。


    所以不管你是创业还是说你去做管理，还是你自己去做一个个人的职业，能把自己感动的悲情叙事，很有可能只是因为你的基础体能不够，你受的那些挫折在有些人看来根本就不值一提。我希望能够通过这260期的课程，能够训练你的商业基本功，记住你以为的顿悟很有可能只是别人的基本功。


    # —— 本周留言精选 ——


    另外我还要提醒你，咱们的同学中间藏龙卧虎，每天的留言区有非常多来自各个行业的优秀经验分享，千万别错过。我还精选了这个礼拜最精彩的5位同学的留言，给每个同学都准备了一份小礼物，希望下次也能够在“每周优秀学员”这里看到你的名字。


    下级如果被上级叫去谈话，会立即启动迎合模式，是是是，对对对，领导爽了，下属也解脱了。结果还是依然故我。启动1对1会议，关键是要让对方愿意敞开心扉，就要按住好为人师的冲动，很多时候下级真的鼓足勇气表达自己的意见，会被连珠炮地质疑回去，或者被苦口婆心地教育回去，很多真实的一线的反馈就此被人
    Gover 截断。


    最近的工具篇信息量太大，总结下：讨论一个问题如何解决用头脑风暴法，交待一个任务用5W2H法，找到根本原因用5WHY法，分析问题用二维四象限法，充分沟通用一对一会议，讨论一个决议用罗伯特议事规则，分析决议的状况用六顶思考帽……想灵活运用必须吃透，举一反三，不断练习。


    我们公司最近一直在推广看板，以及每日站会。经典三段式：我昨天做了什么，今天要做什么，有什么问题？我们发明了看板三字诗：

    明需求，确任务，有工期，看进度；用流动，细拆分，各阶段，条件明；项目卡，板上贴，看信息，更直接；开站会，围半圆，汇报人，站中间；从组长，到组员，再组长，做总结；右到左，三段讲，一分钟，讲要点；精神好，声音响，手机藏，认真听。


    最近赶上一个契机，我从普通职员转变成了经理，一个初级的管理者，本来我害怕自己暂时还不能达到这样一个职位要求，但是是学了您的课之后，我真的学到了太多的知识干货，视野也开拓了很多。今天我就利用您教的一些东西，给全部门的人进行了一个培训课，让正在读在职MBA的领导都对我刮目相看，夸我知识渊博，很多部门同事都对我非常崇拜。我真的非常感谢您，提前储备很重要。


    我亲自经历的一个作战指挥室案例。06年，学校一个女生被害，县里刑警几乎全部抽调到学校勘察现场，分析案情。3天过去了，毫无进展。无奈之下，请市公安局副局长出马。

    副局长到了，立刻在校长室成立了指挥室。把刑警分成四组，各去负责一个村子调查15--20岁无业人员，名单上报（专设的快速作战组）。锁定600名嫌疑名单，然后采集血液样本。血液比对，用了大约1小时，找到了犯罪分子。回忆起来，还是依然佩服这么专业的局长。


