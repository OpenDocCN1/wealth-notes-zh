  md: '# 222 | SMART原则：有 “OKR” 这把刀，更要有 “SMART原则” 这套刀法


    听完第221课的OKR之后，你深受启发，决定在销售部门依然沿用基于销售业绩的绩效考核，但在研发部门全面推行 “OKR的目标管理之刃 + 360度环评的绩效考核之剑”，刀剑合璧。


    很快，你收到研发总监的OKR如下：


    O（目标）：打造业内最好的产品


    +   ├─ KR1（关键结果1）：持续提高产品质量

    ├─ KR2（关键结果2）：不断创新，增加新功能

    ├─ KR3（关键结果3）：听取最终用户意见，提升满意度


    一个季度结束了，大家开始打分。你对研发部门的OKR结果不满意，满分1分，你只打了0.3分，但你研发总监给自己打了0.9分。


    你非常惊讶。进一步调查，发现员工的自评和他评的分数，普遍非常大。为什么会这样？因为OKR是一个花架子？或者这么高级的东西，不适合你的公司？


    都不是。这是因为你心中的那个 “目标”，和研发总监心中的那个 “目标”，不是同一个目标。OKR是把好刀，但你要学习一种叫做 “SMART原则” 的刀法，真正统一目标，才能驾驭OKR。


    # 概念：SMART原则


    什么叫 “SMART原则”？SMART原则，源自美国马里兰大学管理学及心理学教授洛克。


    S-M-A-R-T 这 5 个字母，代表 Specific（具体的），Measurable（可衡量的），Attainable（可实现的），Relevant（相关的），和
    Time-Based（有时限制的）。


    SMART原则最大的作用，就是让 “一千个人心中的一千个哈姆雷特”，必须变成同一个。


    今天，我们就来拆解一下 “SMART原则” 刀法的五个招式。


    # 运用：“SMART原则” 刀法五式


    # 第一招：Specific（具体的）


    具体的，就是一刀砍掉模棱两可。比如 “KR1：持续提高产品质量”，什么叫产品质量？没有具体的界定，就无法评判、衡量与执行。你可以试着把它修改为：


    如果是示例改写：

    消除致命的产品缺陷数；降低严重的产品缺陷数；提高应用商店中APP的评分。

    这就变得非常具体了。


    # 第二招：Measurable（可衡量的）


    可衡量的，就是一刀砍掉标准争议。降低多少严重的产品缺陷数，算是降低？提高多少质量评分，算是提高？

    我们进一步修改这条KR为：

    致命产品的缺陷数保持为零；严重的产品缺陷数减少50%；应用商店中APP的评分从4.1分提升到5分。

    这样，你和研发总监就不会争论，什么才算0.9分，什么只有0.3分。


    # 第三招：Attainable（可实现的）


    可实现的，就是一刀砍掉不切实际。应用商店中APP的评分，从4.1分提升到5分，这可能吗？你看了一下应用商店排名前100个APP，发现没有一个能到达满分5分。这是一个不可实现的目标。

    我们还要接着修改，这条KR可能应该是这样：

    致命的产品缺陷数保持为零；严重的产品缺陷数减少50%；应用商店中APP的评分从4.1分提升到4.5分。

    跳一跳，够得着，你的团队才会有斗志。


    # 第四招：Relevant（相关的）


    相关的意思，就是一刀砍掉无关目标。应用商店中APP的评分，从4.1分提升到4.5分，真的和产品质量有关吗？分数提升，会不会是新功能导致的呢？或者是因用户太喜欢新界面了？应用评分和产品质量有相关性，但还不足够强。我们可以进一步改为：

    致命的产品缺陷数保持为零；严重产品缺陷数减少50%；应用商店中APP的差评中，汇报错产品缺陷的比率减少50%。

    这样，质量问题，就不会被设计问题所掩盖。


    # 第五招：Time-Based（有时限制的）


    有时限制的意思，就是一刀砍掉无限拖延。产品缺陷数减少50%，很好；差评中汇报缺陷的比率减少50%，也很好。但是，多长时间呢？1年之后实现，还有意义吗？如果没有时间限制，这个目标设置就无意义。于是，我们接着修改这条KR，加上时间限制：

    致命的产品缺陷数保持为零；严重产品缺陷数在3个月内减少50%；应用商店中APP的差评中，汇报产品缺陷的比率，在3个月内减少50%。

    至此，我们终于手持 “OKR” 这把宝刀，挥舞 “SMART原则” 这套刀法，把 “持续提高产品质量” 这个千面哈姆雷特，变为一个真正目标一致的KR。你和你的研发总监再次坐在一起，就不会再为
    “啊？你居然是那么理解的？” “啊？这也算是完成了啊？” 而消耗内部资源了。


    # 小结：认识SMART原则


    什么是 “SMART原则”？大部分目标管理工具，无论是谷歌的OKR，还是微软的CBI，Oracle的MOKR，都只是形状不同的刀。

    要做好任何一把刀，都必须学会一套叫做SMART原则的刀法。'
