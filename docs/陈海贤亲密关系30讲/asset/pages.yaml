  md: '# 27 | 家庭角色：如何从固化到流动？


    欢迎回来，《亲密关系》了，你好，我是陈海贤。上节课，我们学习了三角关系。三角关系是家庭系统衍生的动力，它运转于，每一个家庭成员都有相对固定的角色和位置。矛盾越大，这些角色越容易固化；无法改变，怎么打破这种固化的模式呢？这节课，我就来告诉大家怎么让家庭角色流动起来。


    什么是固化呢？在这一部里，有好人、坏人、有英雄、有反派，这些就剧中的角色。在现实生活中，角色的概念可以用来理解人与人之间。


    判断别人的角色，也决定了你自己的角色 毛主席说："敌人的敌人就是我们的朋友，敌人的朋友就是我们的敌人"，什么意思呢？如果把这个放到人际关系中，就是根据来决定。


    角色的判断不仅决定你会站哪一边，还决定了你对别人的态度、态度和情感。你对敌人的同情、亲近和好感会被压抑，而你会被敌对的亲密和亲密会被放大，而你会被压抑。久而久之，副作
    用 就是对你某个人的情感和感受被你的角色固定了，很难改变。


    # 固化的角色影响家庭成员互动


    我曾咨询过一个家庭，父母之间有深深的矛盾。妈妈总是感觉女儿对妈妈的忠诚，女儿和妈妈在一起的时候，总是很不耐烦。时间久了，妈妈和女儿之间的结盟就很牢固。


    女儿是典型的 孩子 和 三角的关系。在这种关系中，女儿的角色是护着爸爸，变成了对妈妈的敌意。女儿，这个角色很复杂，父母的关系是对立的，这种对立的角度也许是对爸爸太有
    感情。 在长久的敌对和疏远当中逐渐巩固下来了。女儿的角色是"妈妈盟友"和"爸爸的敌人"，直到长大以后，女儿回忆起自己的童年，才说：


    > "现在想起来，其实爸爸对我也不错。每次他回来都带着月饼，比如带牛奶送到 给 我，爸爸 是会 到 我 的。 比如送 好吃的，他 也 会 省下来 给我吃。我想，他
    是想 给 我 的。 很 长 时间 我都 不 能 接 受 这 点 。我 没 法 感 受 到 的， 我 一 直 看 到 的是 负 面 的。 如 果 他 一 天
    不 跟 我 说话 ， 我 就 很 伤 心 ， 甚 至 认 为 他 不 爱 我 了 。"


    为什么女儿小时候看不到爸爸的好呢？因为她一直是妈妈 盟友， 这 个 角 色 让 她 只能 看到 爸爸 的 坏 一 面 ， 而 忽 略 了 爸 爸 的 好 。
    角色 强 化 了 她 的 认 知 和 记 忆 ， 让 她 没 法 对 爸 爸 有 好 感 。


    这种角色，不仅让女儿很难靠近爸爸，也让妈妈爸爸的亲近变得困难。妈妈也不是没有感觉到这一点，女儿又在激烈对抗爸爸，并有了类似"小时候，妈妈 站 在 爸爸 这边
    ， 爸爸 就 指 责 女 儿 不 像 样 子 ， 不 知道 尊 重 长 辈 " 的 表 现 。


    对于夫妻俩来说，这是正常的。就像他们有矛盾，他们也需要一起出来来救孩子。在这个三角 中 引 起 了 孩 子 的 反 抗 ， 她 觉 得 自 己 被 妈 妈
    带 坏 了 ， 似 乎 无 奈 的 女 儿 说 ：


    > " 就 像 她 都 说 觉 得 爸 爸 对 我 好 ， 明 明 是 帮 她 ， 就 像 她 自 己 却 像 害 人 一 样 ， 跟 着 爸 爸 一 起
    来 害 我 爸 爸 。"


    为什么女儿 会有 被 背叛 的 感觉 呢 ？ 因 为 在 这 个 矛 盾 里 的 重 要 原 因 ， 是 谁 和 谁 站 在 一 边 ， 就 变 成 了 一
    件 很 不 平 常 的 事 。 如 果 一 个 站 到 了 另 一 边 ， 这 就 是 被 背 叛 。


    所 以 ， 成 熟 之 间 就 形 成 了 一 种 固 定 的 交 往 模 式 ， 久 而 久 之 ， 这 种 固 定 的 交 往 模 式 ， 也 固 化
    了 每 个 人 的 家 庭 角 色 ， 影 响 每 个 人 对 其 他 家 庭 成 员 的 判 断 。 就 像 让 每 个 人 都 痛 苦 ， 也 很 难
