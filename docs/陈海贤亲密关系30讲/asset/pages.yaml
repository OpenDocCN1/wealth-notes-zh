  md: '# 08 | 关系语言：如何听懂伴侣的“话外音”？


    陈海贤·亲密关系30讲


    欢迎来到《亲密关系》。你好，我是陈海贤。


    如果说关系的视角是“看”，是帮助你看到事情背后的例子，那关系的语言就是“听”，是帮助你“听到”人们在沟通中，是怎么传递关系的信息的。


    这一讲，我就来讲讲关系的语言。可以说，掌握了关系的语言，也就掌握了亲密关系的沟通密码。否则，你会遇到沟通的障碍。


    # 关系的信息隐藏在谈话内容中


    有一次，我在女儿的学校门口，看到一对父母在争论孩子的教育问题。妈妈说：“我觉得女儿应该去上奥数班，别人家都在学了。”爸爸说：我觉得孩子这么小再太在意学习，应该让他多锻炼、踢足球。


    一般人会说，这对父母是在讨论孩子要不要奥数，他们对孩子的课外教育有分歧。可是，如果我们能从关系的语言上听这对对话，就会知道，他们其实是在跟对方说：


    > 我比你更懂我们的孩子，所以在这件事上，我比你更有发言权。


    这就是关系的语言。如果这个关系的矛盾没有解决，不只是争论该不该孩子学什么，在很多场景，比如买车该听谁的，买两件衣服好看不，能不能跟同学玩，两个人都会有争论。


    上一讲我们学习过，在亲密关系中，所有发生的事情都有两层含义：这件事的事实是什么，以及它在关系中意味着什么。


    同样，在亲密关系的沟通中，人们也一直传递两个层面的信息：内容 和 关系。


    所谓内容的信息，是人们表面上所说的话，也就是上面的例子里，孩子是奥数还是踢足球。而关系的 信息，是些内容背后所反映的两人之间的关系。也就是谁比谁更懂孩子，谁更有话语权。


    所以，关系的语言不是表达谈话的内容，而是表达彼此的关系。


    熟悉关系的语言，就能从两个人的只言片语中读出“谁在支持谁”、“谁在对谁”、“谁在贬低谁”、“谁在逗谁的气”。


    关系的沟通是无处不在的，而亲密关系的沟通又 有 它 的特 殊性。亲密关系的核心是依恋，在亲密关系中，人们会交感信息的 敏感探测器。人们反复在和寻找 表达 的，其实就是这些信
    息：


    > 你关注我吗？

    我对 你重要吗？

    如果有需要，你会回应我的需要吗？

    你认可我吗？欣赏我吗？包容我吗？接纳我吗？


    如果 接收到 关 系 的 信息 是 肯定 的，那 人 们 就 会很安心，会很心 平气 和 地 说 话。 如果 关 系 的 信息 是 否定 的，那 人 们 就会
    感 到 失 落 和 忧 伤，就会 感 到 很 容 易 与 对 方 爆发 争 吵。


    这也 是 为 什 么 人们 对 爱 人 总是 比 对 别人 更 苛刻， 因为在亲密 关系 中， 人们 对 依 恋 相关 的 信息 更 加 敏 感。


    # 亲密关系沟通的核心信息是“依恋”


    关 系 的 语 言 有 什 么 用 呢 ？ 它 会 让 你 学 会 听 和 说。


    首 先 ， 了 解 关 系 的 语 言， 你 就 能 听 懂 争 吵 背 后 的 故事 ， 远 比 争 吵 的 内 容 丰 富 多 得 多。


    举 个 例 子。


    我 曾 经 遇 到 一 对 中 年 夫 妻， 夫 很 负 责 务， 他 发 现 自 己 在 工 作 发 展 上 已 经 遇 到 了 头， 就 把 精 力 用
    到 了 各 种 学 习 上。 他 经 常 看 书、听 课， 去 参 加 各 种 研 修 营。 这 本 来 是 件 好 事， 可 是 这 却 成 了 他 们
    家 里 的 矛 盾。 说 起 家 里 的 矛 盾 时， 丈夫 说：'
