  md: "# # 02 | 爱：什么让我们在一起？\n\n欢迎来到《亲密关系》，你好，我是陈海贤。\n\n我曾经去参观过一个失恋博物馆，里面陈列了很多人写的一些纪念品。有相互滴落的日历礼物，有因为失恋给恋人产生的满满一筐的火车票和飞机票，有写给彼此的一些悄悄话……很多纪念里都写满了对爱的渴望、对恋人的思念和对于伴侣分离之后的悲痛。\n\
    \n为什么在分离以后，人们对恋人有这么强烈的思念和渴望？是什么力量把两个人牢牢绑在一起？\n\n这一讲，我们就来讨论亲密关系背后的动力：爱。\n\n亲密关系是以爱为核心的，没有爱，两个人就会疏远和决绝日子。爱能给人带来最大的喜悦和痛苦。它是什么？\n\
    \n千百年来，无数人曾发出过这样的疑问，也有无数人给出了各种各样的答案：诗人可能会觉得，爱是浪漫的符号；生物学家可能会觉得，爱是冲动的衍生品；是吸引人繁衍后代的“手段”；经济学家可能会觉得，爱是一种情感的“交换”。\n\
    \n这些说法都有道理。但爱，在心理学里有一个专门的描述，叫做依恋（attachment）。亲密关系中的爱，是人类的一种依恋本能。\n\n# ## 爱是依恋本能\n\
    \n什么是依恋呢？让我们从鲍尔比（John Bowlby）的依恋理论说起。很久以前，英国心理学家约翰·鲍尔比就发现，孩子和父母之间，尤其是孩子和妈妈之间，有一种非常亲密的情感联系：叫依恋。\n\
    \n你是否还记得在妈妈怀里睡觉的场景？两个人呼吸跟着呼吸，心跳连着心跳，好像两个人变成了不可分离的一个人。\n\n在孩子很小的时候，只要不在妈妈身边，就会非常担心。如果妈妈不见了，他们就会非常不安，就像生病了。不会不停地哭，喊“我要妈妈我要妈妈”。这种依恋，对于孩子的生存和成长至关重要。\n\
    \n### 母亲和孩子的之间的依恋有四个特征：\n\n+   - **第一：强烈的回应。**在很多作品当中，我们看到过孩子和妈妈之间分离，孩子会拼命去寻找妈妈。而与妈妈的离别会带来巨大的悲伤感。\n\
    - **第二：彼此的关注。**我们都看到过这样的画面：妈妈看着孩子，用温柔的目光看着她。而孩子也会报以同样温柔的目光。如果妈妈离开了，孩子会很失望，甚至觉得妈妈不再爱自己了。好像妈妈和妈妈之间的联系又断了。\n\
    - **第三：关系的唯一性。**一旦依恋关系建立起来，别的照料者就很难取代妈妈的角色。没有哪个照料者会像妈妈一样，妈妈会很清楚地知道孩子需要这个孩子。\n\
    - **第四：依恋关系是最纯粹的亲密关系，而不是利益关系。**虽然会有利他关系的说法，但是在依恋关系里，父母是孩子的“主人”和“孩子”是父母的“主人”，不是孩子需要父母的照顾，也不是父母需要孩子照顾，而纯粹是因为情感上的联结。\n\
    \n# ## 真挚的四个特征\n\n你可能没有想过，成年人亲密关系中的爱，也来源于人类同样的依恋本能。\n\n为什么这么说呢？因为这种情感，和母子之间的依恋不仅有着相似的生理基础（多巴胺和内啡肽），还有相似的特质和机制。\n\
    \n为了说明这种相似的特质和机制，我们先来看看依恋关系的四个特征。\n\n+   - **第一：你们之间是否有很强的回应。**\n\n  你会想知道，对方是不是会回应你，是不是也会关心你。比如，你生病了，他会主动关心你，问你要不要去医院。你心情不好，他会主动问你发生了什么，并安慰你。这种回应，是爱的基石。\n\
    \n- **第二：当你们在一起的时候，对方是真正的在回应你，还是在进行自我表现。**\n\n  你会想，对方是在真正听你说话，还是在他自己的想法里？比如，你在跟他说你想吃火锅，但他一直在那里说他今天遇到了什么麻烦。如果他不能真正回应你，你会觉得你们之间没有真正的联结。\n\
    \n- **第三：在对方心里里是不是特别的。**\n\n  他对你和对别人有没有什么不同？比如，他对别人都很客气，但对你很温柔，或者对你有一些特殊的待遇。这种特殊感，是爱的重要来源。\n\
    \n- **第四：对方爱的究竟是这个人，还是你给他带来的好处。**\n\n  如果他爱你的时候，总是附带条件，比如你给他钱，你给他什么好处，他就会爱你；如果不给，他就会离开，那就不是真的爱。真的爱，是不附带条件的。\n\
    \n### 真挚的四个特征，既是亲密关系的基础，也是维系亲密关系的重要纽带。\n\n孩子会跨越千山万水去寻找妈妈，恋人也会因为思念对方而飞越千山万水。这种真挚的情感，让彼此之间的联结非常牢固。因为，你心里有对方，对方心里也有你。\n\
    \n当人们的情感足够强列，有回应，两个人就把这种情感叫做真挚。有回应，两个人就在一起。如果缺少这种情感联系，两个人就会分开。\n\n# ## 爱让人在一起\n\
    \n为什么爱会让人在一起？答案是“为了我们的关系”。\n\n如果从关系的角度来思考，有什么力量能让两个人维系在一起？\n\n**首先，这个力量一定要足够强大。**大到能够让人们在关系中保持联结。就像引力一样，把两个人拉在一起。\n\
    \n**其次，为了让关系有效运作，这个力量要覆盖到关系的方方面面。**两个人要对彼此的信息流动，情感需求，以及身体舒适等都有反应。"
  merge: -1
