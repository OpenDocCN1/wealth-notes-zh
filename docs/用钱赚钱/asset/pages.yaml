  md: '股東權益或股票淨值、資本淨值，是公司股本、公積金、留存收益等等的總和。股東權益報酬率表明普通股投資者委託公司管理人員應用其資金的總和。股東權益報酬率越高表示公司管理人員應用其資金所獲得的投資報酬，所以數值愈大愈好。


    +   每股盈利：指扣除優先股股息後的稅後利潤與普通股股數的比率。每股盈利=(稅後淨利−優先股股息)÷(普通股總股數)


    這個指標表明公司獲利能力和每股普通股投資的回報水準，數值當然愈大愈好。


    +   每股淨資產額：也稱為每股賬面價值，計算公式如下：

    每股淨資產額=(股東權益)÷(股本總數)


    這個指標反映每一普通股所含的資產價值，即股票市價中有實物作為支撐部分。一般經營業績較好的公司的股票，每股淨資產額必然高於其票面價值。


    +   營業利潤率：指公司稅後利潤與營業收入的比值，表明每百元營業收入獲得的收益。


    +   營業利潤率=(稅後淨利÷營業收入)×100%


    數值愈大，說明公司獲利的能力愈強。


    # 償還能力比率指標分析


    對於投資者來說，公司的債還能力指標是判定投資安全性的重要依據。


    +   短期債務清償能力比率：短期債務清償能力比率又稱為流動性比率，主要有下列幾種：


    +   流動比率＝(流動資產總額)÷(流動負債總額)


    流動比率表明公司每一元流動負債有多少流動資產作為償付保證。比率較大，說明公司對短期債務的償付能力愈強。


    +   速動比率＝(速動資產)÷(流動負債)


    速動比率也是衡量公司短期債務清償能力的資料。速動資產是指那些'
