  md: '王永慶很有錢，李誼誠很有錢，但為什麼他們都買了大量的人壽保險呢？他們不需要用保險來解決醫療、養老之類的事情，他們完全可以透過別的方式做出安排，因為他們需要風險轉移、資產保全。


    風險轉移需要技巧。雙親已經退休，不再是家中的經濟支柱，子女有必要為他們投保嗎？如果你喜雙親買人身保險，投保人是你，受益人是你的雙親，其實是很不償失的。因為他們既親已經不是經濟支柱，加上年紀大、保險費昂貴，你另外付這種保險費，是沒有必要的。最好的選擇就是給父母買醫療保險，這樣一來在他們有重大疾病時可以由保險公司來承擔一定的費用。


