- pgno: 21
  md: '# 家庭形成期的理財


    家庭形成期1~5年，結婚生子，收入增加，生活穩定，重點在於合理安排家庭建設支出。


    # 理財建議


    50%用於股票或成長型基金；35%用於債券、保險；15%用於活期儲蓄，保險可選繳費少的定期險、意外險、健康險。


    我們把家庭形成期和單身期進行比較，發現我們的定期儲蓄減少了5%，這部分資金用於為我們留下一些保險。活期儲蓄的資金比單身期多了15%，這是因為夫妻雙方的花費更多，手邊需要更多的活錢。這樣可以做到應付日常開支，也可以保證定期投資的資金在投資期間不至於短期撤出，造成損失。


    # 子女教育期的理財


    子女教育期20年，孩子教育、生活費用猛增。


    # 理財建議


    40%資金用於股票或成長型基金，但需更加規避風險；40%用於存款或國債，儲備為教育費用；10%用於保險；10%為家庭緊急儲備金。


    隨著年齡的增長，家庭的逐步穩定，家庭人口的增加，投資出現了這樣的變化：高風險、高收益品項投資比例是愈來愈少的。單身期：如果股票投資失敗了，因為年輕，我們還有時間再賺到錢。在進入家庭形成期和子女教育期，我們就需要規避風險。'
