  md: '按規定，上市公司必須把中期（上半年）財務報表和年度財務報表公開發表，投資者可從有關報刊上獲得上市公司的中期和年度財務報表。


    閱讀和分析財務報表雖然是瞭解上市公司業績和前景最可靠的手段，但對於一般投資者來說，又是一件非常枯槁繁雜的工作。比較實用的分析法，是查閱和比較下列幾項指標。


    # 財務報表簡要閱讀法


    # 主要財務資料


    主營業務同比指標：主營業務是公司的支柱，是一項重要指標。上升幅度超過 20% 的，表明成長性良好，下降幅度超過 20% 的，說明主營業務滑坡。


    淨利潤同比指標：這項指標也是重點查看對象。此項指標超過 20%，一般是成長性好的公司，可作為重點觀察對象。


    查售合併利潤及利潤分配表：凡是淨利潤與主盈利潤同步增長的，可視為好公司。如果淨利潤同比增長 20%，而主營業務收入出現滑坡，說明利潤增長主要依靠主營業務以外的收入，應查明收入來源，確認其是否形成了新的利潤增長點，以判斷公司未來的發展前景。


    主營業務利潤率：

    主營業務利潤率 = （主營業務利潤 ÷ 主營業務收入）× 100%


    主要反映公司在該主營業務領域的獲利能力，必要時可用這項指標作同行業中不同公司間獲利率比較。


    以上指標可以在同行業、同類型企業間進行對比，選擇實力更強的作爲投資對象。


    # 「重大事件說明」和「業務回顧」


    這些欄目中經常有一些資訊，預示公司在建專案及其利潤估算的利潤'
