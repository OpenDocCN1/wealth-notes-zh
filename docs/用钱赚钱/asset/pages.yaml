- pgno: 29
  md: '# 理財不能等。現在就行動


    「我還年輕，不需要理財。」或是「等我賺了大錢再說。」等等，一般人都有這樣的觀點，很多人都認為理財不急著，我有得是時間，等有時間的時候再說，其實這是錯誤的。


    馬先生在一家外企上班，屬於白領一族，可都上班幾年了，還沒有存款，更別說房子、車子。一次馬先生的父母生病，需要大筆的錢，可是他一分錢都拿不出來，家裡人都很奇怪，畢竟他工作這麼多年了。還好馬先生的人緣好，就借了些錢。事情總算過去了，親戚朋友都勸他，你應該學著理財了，但他卻理直氣壯地說：「不急，我還年輕，等以後再說吧！」


    孫先生在外工作好幾年了，今年結婚時，結婚的錢都是雙方父母拿的，就連買房子的首付都是父母給的，那剩下的錢就應該自己付了，小倆口收入還可以，可是過慣了有多少花多少生活的他們，一到月底還貸，就抓瞎了，剛開始父母給墊上，可也不能總這樣呀！後來他們乾脆一簽工資就還貸，這樣幾年下來，他們除了按時還貸，手頭還是一分錢都沒有，父母勸說他們該學著理財，不然以後有了孩子怎麼辦，他們總說：「不急，慢慢來，等我們賺了大錢再學理財，現在沒有錢，怎麼理呢？」


    中國有句老話說：「吃不窮，喝不窮，算計不到就受窮。」怎樣理財，怎樣理好財，是每個人都應關心的話題，更是現今投資者需要學會的。理財應該做到二忌：


    一忌攀比揮霍，宜未雨綢繆，居安思危。有些投資者對理財缺乏足'
