  md: '買方期權（指看漲期權）或出售（指看跌期權）一定數量的特定標的物的權力，但不負有必須買進或賣出的義務。黃金期權就是以黃金為載體做這種期權。在中國，中行首家推出了黃金期權交易，其他的銀行也陸續開辦，居民投資理財又多了一個交易工具。


    黃金期權也有槓桿作用，金價下跌，投資者也有賺錢機會，期權期限有1週、2週、1個月、3個月和6個月5種，每份期權最少交易量為10盎司。客戶需先到中行網點簽訂黃金期權交易協定後才可投資，目前該業務只能在工作日期間在櫃檯進行交易。


    據瞭解，支付相應的期權費（根據期權時間長短和金價變動情況而不同）後，投資者就能得到一個權利，即有權在期權到期日執行該期權（買入或賣出對應數量的黃金）或放棄執行（放棄買入或賣出）。


    如何用黃金期權來獲利或者避險？舉一個例子：李先生預計國際金價會下跌，他花1200美元買入100盎司（面值1月）的A款黃金看跌期權（執行價650美元/盎司，假設期權費1盎司12美元）。假設國際金價像李先生預期的一樣持續下跌至615美元/盎司時平倉，則李先生的收益為（650－615）×100＝3500美元，扣除1200美元的期權費，淨收益為2300美元。如果金價不跌反漲至700美元，投資者可放棄行權，損失1200美元期權費。


    這就是期權的好處。風險可以鎖定，而名義上獲利可以無限。期權投資是以小博大，可以用很少的錢，只要看對了遠期的方向，就可以獲利，如果看錯了方向，無非就是不執行，損失期權費。


    在中國投資黃金中，如果紙黃金投資和期權做一個雙保險掛鉤的投資，就可以避免紙黃金單邊下跌被套牢。因為紙黃金只能是買多，不能買空。如果在行情下跌的時候，買入紙黃金被套，又不願意割肉，可以做一事看跌的期權。


    例如：320美元買入紙黃金，同時做一事看跌期權，當黃金價格跌到260美元，紙黃金價格就虧損，但是在看跌期權補回來。整體可能是平


