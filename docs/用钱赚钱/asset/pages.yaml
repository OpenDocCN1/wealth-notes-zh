  md: '權的銀行進行交易。這種交易途徑的時間為週一至週五。交易方式為實盤買賣和電話交易，也可掛單買賣。


    # 透過境外金融機構在境外銀行交易


    這種交易途徑的時間為週一至週六上午，每天 24 小時。交易方式為保證金制交易，透過電話進行交易（免費國際長途），可掛單買賣。


    # 透過互聯網交易


    這種交易途徑的時間為週一至週六上午，每天 24 小時。交易方式為保證金制交易，透過互聯網進行交易，可掛單買賣。


    需要注意的是，網上外匯交易平台上的交易都是利用外匯保證金的制度進行投資的，也是絕大多數匯民採取的交易途徑。在外匯保證金交易中，集團或是交易商會提供一定程度的信貸額給客戶進行投資。如客戶要買一手
    10 萬歐元，他只要給 1 萬歐元的押金就可以進行這項交易了。當然，客戶願意多投入資金也可以，集團和交易商只是要求客戶做這項投資時，把帳戶內的資金維持在 1
    萬歐元這個下限之上，這個最少的維持交易的押金就是保證金。在保證金的制度下，相同的資金可以比傳統投資獲得相對多的投資機會，獲利和虧損的金額也相對擴大。如果利用這種槓桿式的操作，更要靈活地運用各種投資策略，可以以小搏大、四兩撥千斤。


    在保證金制度下，因為資金少於投資總值，所以不會積壓資金、不怕套牢、可買升或跌相向獲利。除了週六、週日外，外匯市場一個時間接著另一個時間，全天候 24 小時運作。另外手續費低，少於五千分之一的手續費，使獲利機會更高。'
