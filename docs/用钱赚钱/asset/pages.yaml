    理財方面絕不能偷懶！有一個比喻說：錢就像你的員工，你是老闆，只有想辦法讓你的員工不停地忙碌，才會給老闆帶來更多收益。作為收入穩定的受薪階級，更應該多學習理財知識，比如，每年透過理財多收益5000
