  md: '# 白領階層：選擇風險適中理財產品


    中等收入人群的理財目標，是在風險適中的情況下，最大限度地實現家庭增值。該類家庭風險承受能力較高，可以選擇風險適中、收益較高的產品，以風險換取收益。


    如，請教專業人士購買保本型基金，購買中長期的分紅型年金類保險產品，或存款各銀行推出的外匯理財產品，挑選期限、利率合適的產品適度購買。


    王丹，28 歲，工作三年，目前單身，在一家出版社做編輯，每月收入 4000 元，由於沒有家庭負擔，除去基本生活費用，他每月可剩餘 1500 元，並將其全部用作投資。這些資金中，80%
    用於股票市場，20% 用於現金存款。王丹一直認為，正是在這個開始的階段，面臨著更多的賺錢或升職的機會，因此可以在投資方面積極進取一點。


    理財專家認為，年輕的白領一族尚處於人生的起步階段，必須在資金上盡量多做積累。應選擇的投資組合方式是：在投資股票時，可以在入市之初稍作觀望，即先積累幾個月資金，再行入市。入市後，可以考慮將不同時間的資金投資在不同的市場上。股票的組合變化可以有很多，可以將
    40% 的資金投向那些業績相對穩定的股票，取其相對穩健的優點；30% 的資金投向一些新的上市公司，取其有更大的升值空間的特點；30% 投向中小企業板塊。在做以上選擇時，還應該考慮其股票的行業構造，如相對來說業務穩定的傳統工業企業、發展潛力巨大的高科技企業、風險和回報率大的服務行業等，注意各行業之間的投資比例的平衡。'
