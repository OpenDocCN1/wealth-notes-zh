  md: '# 妥善控制股市風險


    「股市有風險，入市須慎重。」對於股票投資者來講，風險控制永遠比獲取利潤更為重要。而對於某些投資者來講，卻沒有任何風險控制的意識，他們永遠關心的只是「該股能漲多少」，卻從來不關心「該股會跌多少」。可見，這種沒有任何風險控制的投資，往往最終使得自己損失慘重。


    這種不再矚目什麼市場風險（又稱系統風險）、非市場風險（又稱非系統風險）之類的話。只是簡單說一句「收益有多高，風險就有多大」，絕對是投資中的至理名言。希望能夠引起大家重視，在真正投資之前，認清風險，正视風險，樹立風險意識，做好規避股票交易風險的準備工作。


    2007年5月30日，狂跌的股市給那些充滿著期待的股民們上了一堂精彩的風險課。由於政策的變動，證券交易印花稅稅率由0.1%上調至0.3%，這使得過深股指一瀉千里。在這種背景下，那些心中毫無風險意識的股民在還沒有來得及分享牛市的成長，就慘遭了狠狠的一記閃棍，只能欒欒地流著淚自己承受。


    可見，作爲投資者股民必須要對股票的投資有一定的風險控制策略，也只有這樣才可能避免股市的殘酷和無情。對於個體投資者而言，成功的風險控制主要分爲以下幾點：'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 掌握必要的證券專業知識


    炒股不是一門科學，而是一門藝術。但藝術同樣需要扎實的專業知識和基本技能。你能想像一位音樂大師不懂五線譜嗎？所以，花些時間和精力學習一些基本的證券知識和股票交易策略，才有可能成長為一名穩健而成功的股票投資人。否則，只想靠運氣賺大錢，即使運氣好誤打誤撞勝了一筆，你也不可能期望著好運氣永遠伴隨著你。


    # 認清投資環境，把握投資時機


    在股市中常聽到這樣一句格言：「選擇買賣時機比選擇股票更重要。」所以，在投資股市之前，應該首先認清投資的環境，避免逆勢買賣。否則，在沒有做空機制的前提下，你選擇買進的時候大舉進攻，而在牛市的時候卻喝金收兵，休養生息，不能不說是一種遺憾。


    # 宏觀環境


    股市與經濟環境、政治環境息息相關。當經濟衰退時，股市萎縮，股價下跌；反之，當經濟復甦時，股市繁榮，股價上漲。


    政治環境亦是如此。當政治安定、社會進步、外交順暢、人心踏實時，股市繁榮，股價上漲；反之，當人心慌亂時，股市蕭條，股價下跌。


    # 微觀環境


    假設宏觀環境非常樂觀，股市進入牛市行情，那是否意味著隨便建倉就可以賺錢了呢？也不盡然。儘管牛市中確實可能會出現雞犬升天的局面，但是牛市也有波動。如果你入場時機把握不好，為利益引誘盲目進入建倉，卻不正好趕上了一波漲勢的尾部，那麼牛市你也會虧錢，甚至虧更多。'
  merge: -1
  img_proc: true
- pgno: 118
  md: '握得十分嚴重。

    所以，在研究宏觀環境的同時，還要仔細研究所市場的微觀環境。


    # 確定合適的投資方式


    股票投資採用何種方式因人而異。一般而言，不以賺取差價為主要目的的，而是想獲得公司股利的多採用長線交易方式。平日有工作，沒有太多時間關注股票市場，但有相當的積蓄及投資經驗，多適合採用中線交易方式。閒置時間較多，有豐富的股票交易經驗，反應靈活，採用長中短線交易均可。如果喜歡刺激、經驗豐富、時間充裕，反應快，則可以進行日內交易。

    理論上，短線交易利潤最高，中線交易次之，長期交易再次。


    # 制定周詳的資金管理方案


    俗話說：「巧婦難為無米之炊。」股票交易中的資金，就如同我們赖以生存、解決溫飽的大米一樣。「大米」有限，不可以任意浪費和揮霍。因此，「巧婦」如何將有限的「米」用於「炒」一鍋好飯，便成為極重要的課題。

    股票投資人一般都將注意力集中在市場價格的漲跌之上，願意花很多時間去探索各種利多利空消息，研究基本因素對價格的影響，研究技術指標作技術分析，希望能做出最標準的價格預測，但卻常常忽略了本身資金的調度和計算。

    其實，在弱肉強食的股市中，必須首先制訂周詳的資金管理方案，對自己的資金進行最妥善的安排，並切實實施，才能確保資金的風險最小。只有保證了資金風險最小，才能使投資者進退自如，輕鬆面對股市的漲跌變化。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 正確選擇股票


    選擇適當的股票亦為投資前應考慮的重要工作。股票選擇正確，則可能會在短期內獲得贏利；而如果選擇錯誤，則可能天天看著其他股票節節攀升，而自己的股票卻如老牛拖車，甚至狂跌不止。


    # 要控制資金投入比例


    在行情初期，不宜重倉操作。在漲勢初期，最適合的資金投入比例為30%。這種資金投入比例適合於空倉或者淺套的投資者採用，對於重倉套牢的投資者而言，應該放棄短線機會，將有限的剩餘資金用於長遠規劃。


    # 要懂得適可而止


    股市風險不僅存在於熊市，在牛市行情中也一樣有風險。在股市脫離其內在價值時，股民應執行投資紀律，堅決離開。'
