- pgno: 319
  md: '# 好房子一輩子。精挑細選買房子


    擁有物美價廉的房子無疑是實現很多人的最大理想，但是對於購房者而言，挑選房子不是尋找最好的樓盤、最好的戶型，而是在自己的承受能力範圍之內尋找最具性價比和投資價值的房子。那麼，在愈來愈多的新推出的樓盤中，如何尋覓自己如意的樓盤之所需？根據理財專家的經驗，可以從下面幾個地方著手並予以考察：


    # 位置要有升值潛力


    房產作為不可動的資產，所處位置對其使用和保值、增值起著決定性的作用。房產作為一種最實用的財產形式，即使買房的首要目的是為了居住，購買房產仍然是一種較經濟的、具有較高預期潛力的投資。房產能否升值，所在的座位是一個非常重要的因素。


    看一個區位的潛力不僅要看現狀，還要看看發展，如果購房者在一個區域各項市政、交通設施不完善的時候以低價位購房，待規劃中的各項設施完善之後，則房產大幅升值很有希望。區域環境的改善會提高房產的價值。


    # 配套要方便快捷


    居住區內配套公建是否方便快捷，是衡量居住區品質的重要標準之一。稍大的居住社區內應設有小學，以排除城市交通對小學生上學路上的威脅，且住宅離小學校的距離應在 300
    米左右（近則擾民，遠則不便）。'
  merge: -1
  img_proc: true
- pgno: 320
  md: '菜店、食品店、小型超市等居民每天都要光顧的基層商店配套，服務半徑最好不要超過150米。


    目前在購樓書上經常見到的會所，指的就是住區居民的公共活動空間。大多包括社區餐廳、茶館、游泳池、健身房等體育設施。由於經濟條件所限，普通民眾購買的房子面積不會太大，購房者買的是80平方米的住宅，有了會所，他所享受的生活空間就會遠遠大於80平方米。


    隨著居住意識越來越偏重私密性，休閒、社交的需求越來越大，會所將成為住區中不可缺少的配套設施。會所都有哪些設施，收費標準如何，是否對外營業，預計今後能否維持正常運轉和持續發展等問題，也是購房者應當瞭解的內容。


    # 環境要優美


    現在住宅項目的園林設計風格多樣的，有的異國風光可能是真正翻譯移植，有的歐陸風情不過是虛見幾招，這就需要購房者自己用心觀察、琢磨了。但是居住環境有一個重要的硬性指標——綠地率，是居住區用地範圍內，各類綠地的總和占居住區總用地面積的百分比。


    值得注意是，「綠地率」與「綠化覆蓋率」是兩個不同的概念，綠地不包括陽臺和屋面綠化，有些開發商會故意混淆這兩個概念。由於居住區綠地在遮陽、防風防塵、殺菌消毒等方面起著重要作用，所以有關規範規定：新建居住區綠地率不應低於30%。


    # 容積率要適宜


    建築容積率是居住區規劃設計方案中主要的技術經濟指標之一。這個指標在預售房銷售廣告中經常見到，購房者應該瞭解。


    一般來講，規劃建設用地範圍內的總建築面積乘以建築容積率等於'
  merge: -1
  img_proc: true
- pgno: 321
  md: '# 區內交通要安全通暢


    居住區內的交通分為人車分流和人車混行兩類。目前作為樓盤賣點的人車分流，是指汽車在社區外直接進入社區地下車庫，車行與步行互不干擾。社區內沒有汽車穿行、停放、噪音的干擾，社區內的步行道兼有休閒功能，可大大提高社區環境品質，但這種方式造價較高。


    人車混行的社區要考察區內主路是否設計得通而不暢，以防過境車流對社區的干擾。是否留夠了汽車的車位，停車位的位置是否合理，停車場若不得不靠近住宅，應盡量靠近山牆而不是住宅正面。


    另外，汽車單位還分為租賃和購買兩種情況，購房者有必要搞清楚：單位的月租金是多少？如果購買，今後月管理費是多少？然後仔細算一筆帳：再決定是租還是買。


    # 價格要弄清楚


    看價格時，首先要弄清每個項目的價格到底是什麼價，有的是開發


    規劃建設用地面積。規劃建設用地面積指允許建築的用地範圍，其住區周邊的城市道路、公共綠地、城市停車場等均不包括在內。建築容積率和居住建築容積率的概念不同，前者包括了用地範圍內的建築面積，和總用地一樣，因此在指標中，前者高於後者。


    容積率高，說明居住區用地內房子建的多，人口密度大。一般來說，居住區內的樓層愈高，容積率也愈高。以多層住宅（6層以下）為主的住宅容積率一般在1.2至1.5，高層高密度的住宅容積率往往大於2。


    在房地產開發中為了取得更高的經濟效益，一些開發商千方百計地要求提高建築高度，爭取更高的容積率。但容積率過高，會出現樓房高、道路窄、綠地少的情形，將極大地影響著住區的生活環境。


    321'
  merge: -1
