- pgno: 38
  md: '# 理財貴在持之以恆


    理財不應是一時的衝動，而是一個中長期的規劃。需要的是正確的心態和理性的選擇。然後就是堅持，再堅持。


    劉先生是一名政府公務員，收入雖然不高但很穩定，每天過著有多花多少的生活，「理財，收益太慢了，我以前好不容易攬了一點錢，拿去投資基金，可是收益太低了，一年拿的利率還不夠我換手機的。」


    王先生自家庭條件比較好，一直沒有理財的觀念。但是自從參加工作遭遇了幾次財務危機之後，現在也開始學著理財了，首先他從儲蓄開始，每月的工資不再有多少花多少了，他在留夠生活費的基礎上，把一部份錢存在銀行。過慣了「月光族」的王先生，忽然開始了自己的理財，他有點兒不習慣，不過想想以後為了自己的家，也就沒什麼了。可是沒過多久王先生就急了，「怎麼收益這麼慢？我什麼時候才能夠買房、結婚的呢啊！還是幸福了自己再說吧！」他實在不能堅持了，又開始了他的「月光族」生活。


    這就是現在很多上班族的真實寫照，因為他們的生活都是靠那點微薄的工作，本來收入就不高，還要拿出一部分去理財，所以他們拿出來理財的那部分是非常少的，就是因為少，所以見效就慢。但是，如果你用很少的那部分錢長期堅持理財，效果就不一樣了。比如，一年因為理財多收益2萬元，20年下來就是40萬元，加上利息，收益就更大。所以，理財貴在堅持和持之以恆，日積月累就是很大一筆財富。


    你必須要明確地知道，理財絕不是一夜暴富。理財之所以不同於賭'
  merge: -1
  img_proc: true
- pgno: 39
  md: '博、投機，甚至不完全等於投資，就是因為它極具理性。理財是細水長流，是把握生活中的點滴，是將理財的觀念滲透於生活中的每一個細胞，是透過建立財務安全的健康生活體系，從而實現人生各階段的目標和理想，最終實現人生財務的自由。


    例如你的投資目標是在退休時積攢 20 萬，現在離退休還有 20 年，按照一年期銀行存款利率，你需要每個月存 800 元；如果投資收益率是 5%，每個月只要投資
    600 元。如果是 8%，每個月存 440 元；這個數字對上班族來說不是很多。如果一下讓你拿出 20 萬，這可能會很困難。所以理財貴在持之以恆，只有長期的堅持才會有更多的利益。


    而且，現在市場上可供選擇的理財產品越來越多，我們要做的，就是堅持風險和收益相對應的理財原則，去選擇相應的理財產品或者組合，不斷地重複和堅持，讓理財成為生活中必不可少的一部分。只有長期的堅持，才會讓你的資本不斷增多。


    李先生每月收入 3000 元，每月支出 1000 元，沒有住房支出。李先生沒有保險，他要先考慮給自己買一份保險。他為自己買了醫療保險，最低的保額金額只需 320
    元左右。


    李先生每月節餘 1600 元左右，堅持理財，考慮到其投資風險承能力不高，他購買兩支債券基金作定期定額。他選一支華夏債券基金*，每月定期定額 800 元，另外選擇了個大成債券基金，每月也投入
    800 元，預期每年會有 5% 左右的收益。


    超過多年的堅持，他現有存款 10 萬元，而且還購買了一輛新車，他打算再過兩年，再重新換間大點的房子。


    ＊本書所提投資檔的，只為敘述方便使用，並非實際建議。'
  merge: -1
  img_proc: true
- pgno: 40
  md: '李先生透過長期的投資理財，使自己的資產成倍增長，還為自己帶來了無窮無盡的好處。因此長期堅持投資理財對上班族有很多的好處，主要有兩個，一是投資者的收入會有一部分節餘，要把這部分錢投入在增值比較快的項目，讓閒錢也增值。另外，長期投資還可以抵禦風險，比如通貨膨脹的風險。如果你不能很好的堅持，你就永遠不會使你的資產倍增，也不會變成富裕的上班族，因此，要想變得更有錢，你必須堅持長期理財。


    首先，堅持每天記賬，每月花銷多少，花在哪裡。每個月可以根據各方面的花銷做出分析，瞭解哪些支出是必需的，哪些支出是可有可無的。從而調整支出的分配比例，把錢用在該花的地方。其次要堅持儲蓄，儲蓄是投資理財的資本，沒有一定的儲蓄，就無法去投資。最後是堅持投資，錢是在不斷的投資中增多的，這就像滾雪球一樣，滾得愈多它會愈大。


    理財需要時間，財富的積累也需要時間。改善家庭資產的結構需要時間，資產增值需要時間。而且，理財的時間愈長，愈容易尋求較佳的理財工具，取得長期的、穩定的較高收益的可能性愈大。'
  merge: -1
  img_proc: true
