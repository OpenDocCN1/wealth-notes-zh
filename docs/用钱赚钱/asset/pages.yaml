  md: '# 有錢別亂放，存款到銀行


    理財的第一步就是儲蓄，儲蓄未必能成富翁，但不儲蓄一定成不了富翁。許多人忽視了合理儲蓄在投資中的重要性，錯誤地認為只要做好投資，儲蓄與否並不重要。其實，儲蓄是投資之本，尤其是對於一個30歲左右的人來說更是如此，房租、水電費、買衣服、交際費用……不知不覺中你的錢就都溜走了。


    此外，還有很多人不喜歡儲蓄，他們有很多理由：有的人認為以後可以賺到很多的錢，所以现在不需要儲蓄；有的人認為應該享受當下，而且認為儲蓄很難，要受到限制；有的人會認為儲蓄的利息沒有通貨膨脹的速度快，儲蓄不合適。


    然而，讓我們檢驗這些拒絕儲蓄的理由，就會發現與原先想的不一樣。


    首先，不能只透過收入致富，而是要借儲蓄致富。有些人往往錯誤地希望「等我收入夠多，一切便能改善」。事實上，我們的生活品質是和收入同步提高的。你賺得多，需要也愈多，花費也相應地愈多。不儲蓄的人，即使收入很高，也很難擁有一筆屬於自己的財富。


    其次，儲蓄就是付錢給自己。有一些人會付錢給別人，卻不會付錢給自己。買了麵包，會付錢給麵包店老闆，貸款有利息，會付錢給銀行，卻很難會付錢給自己。賺錢是為了今天的生存，儲蓄卻是為了明天的生活和創業。


    我們可以將每個月月收入的10%撥到另一個帳戶上，把這筆錢當作自己的投資資金，然後利用這10%達到致富的目標，利用其他90%來支付其他的費用。也許，你會認為自己每月收入的10%是一個很小的數目，'
