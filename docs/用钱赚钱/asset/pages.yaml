  md: '時間交割，是一個非常標準的合約。


    黃金期貨具有槓桿作用，能做多做空雙向交易，金價下跌也能賺錢，滿足市場參與主體對黃金保值、套利及投機等方面的需求。


    從目前適試的黃金期貨合約來看，交易單位從原來的每手300克提高到了1000克，最小變動價位為0.01元／克，最小交割單位為3000克。期貨公司認為，這可能是黃金期貨合約最後的交易模式。


    以中國現黃金價200元／克粗略估算，黃金期貨每手合約價值約從6萬元上升到了20萬元，按照最低交易保證金為合約價值的7%來計算，每手合約至少需要繳納保證金1.4萬元，合約即將到期，黃金期貨保證金率提高到20%，每手的保證金將增至4萬元。如果從倉位管理的角度計算，以後做一手黃金差不多需要5萬元左右。


    如果投資者看多黃金，某一分合約價格對應的是每克190元，此時買人需要繳納的保證金是1.33萬元，如果金價漲到了210元，投資者獲利退出，可獲利2萬元（1000克×（210-190）元／克），投資收益為150%（2÷1.33）；但是如果金價下跌，投資者需要不斷追加保證金，一旦沒有資金追加，投資就會被強制平倉，比如金價跌到了180元／克，投資損失為1萬元【1000克×（190-180）元／克】，虧損率高達75.188%。黃金期貨風險較大，普通投資者參與要謹慎。


    黃金期貨推出後，投資者可到期貨公司買賣。期貨開戶只需要帶上身份證和銀行卡就可以辦理，與證券開戶類似，只是將「銀證對應」換成了「銀期對應」，一個期貨帳戶還可以同時對應多個銀行帳戶。


    # 黃金期權


    期權是指在未來一定時期可以買賣的權力，是買方向賣方支付一定數量的金額（指權利金）後，擁有的在未來一定時間內（指美式期權）或未來某一特定日期（指歐式期權），以事先規定好的價格（指履約價格）向'
