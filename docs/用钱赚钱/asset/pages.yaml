  md: '說，既能保證資金隨時所需，又能享受定期存款利率；再稍微複雜一點點，簽署個固定收益的人民幣理財協定，就可以透過「天理財或者 7 天理財」的方式實現收益翻倍或者翻兩倍，而且権利計算收益還會有所增長；而如果你是銀行的貴賓理財客戶，還可以起超過固定金額的部分自動購買基金產品，從而實現更高收益。


    在股市上也同樣存在著這樣的種種「撇招」，實施上也是透過事先的設定來省去你每日盯盤的麻煩，透過跟證交所提供的「掛籃子」服務，一旦股票波動到你想要的價位，系統自動幫你買進或者賣出。基金方面的操作就更便捷了。基金本身就是「懶人」投資的最佳方式，交給專家理財自然可以省心不少。定期定額就是最简便的辦法，簽一份協議後就能每月定時自動扣款，保證你能享受到平均的收益，此外，一些指數基金，只要設置好點位，如上證指數
    1200 點時申購，1300 點時贖回，系統可以幫你自動進行操作，一年中指數上下上下，你只要設定一次就相當於操作了很多回，而且特別適合於波段操作。


    網上基金也是上班族一個好的選擇。因為，一方面基金定期定額就是固定時間買入固定金額的基金，對於沒有時間打理財務的人士來說，這是一種不錯的選擇。當基金價格走高時，買進的份額較少；基金價格走低則買進的份額多。累積時間愈長，愈能分散投資風險，也愈能獲取較高收益。另一方面網上銀行又提供了一站式的基金定期定額服務，對於事務繁忙的您，大可不必跑到銀行網點辦理這種業務。所以，網上基金定期定額，是「忙人」投資不錯的選擇。


    還需要提醒上班族的是，要想做個聰明的理財「忙人」，要堅持兩個準則：


    # 切忌盲目追求高收益


    很多「忙人」要顧對投資毫無計畫，本來打算用於投資的錢卻臨時用'
  merge: -1
  img_proc: true
- pgno: 37
  md: '作他途：要膽則是選擇方向全額投入，一次性投資放大風險。其實對這部分人群來說，不要盲目地追求高收益，「平均成本法」是最佳「良方」。


    採用「平均成本法」將資金進行分段投資，可以最低限度地降低投資成本，分散投資風險，從而提高整體投資回報。


    # 切忌投資過於分散


    不加選擇、不加規劃往往是「忙」的表現。沒有計畫的投資，只能讓自己的資金更加處於無序的狀態。最終忙是忙得足夠，錢也是亂得可以。


    其實時間就像海绵裡的水，只要願擠，總會有的。所以，忙不是藉口，忙照樣可以理財。'
