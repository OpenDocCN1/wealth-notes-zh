  md: '# 市場訊息上的準備


    ：在期貨市場這個完全由供求法則決定的自由競爭市場上，資訊顯得更常重要。誰能及時、準確、全面地掌握市場訊息，誰就能在競爭激烈的期貨交易中獲勝。


    # 擬定交易計畫


    ：為了將損失控制到最小，使贏利更大，就要有節制地進行交易。入市前有必要擬定一個交易計畫，作為參加交易的行為準則。'
