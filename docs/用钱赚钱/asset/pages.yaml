  md: '月 20 日達到 45.24 元。在這期間，有好幾次朋友對她說該獲利出局了。可夏雨薇基於良好的分红預期，大唐發電還將繼續住上漲，她要等到最高點再賣出股票。然而，她的預想落空了，之後大唐發電一路走低。雖然後來大唐電在分紅之前又一次達到
    39 元的高點。但夏雨還夢想著它能流到 40 多元，並沒有趁著這次反彈賣出，結果到 9 月 15 日 的時 候，在受不了它的不斷陰跌，20 元清倉了結。


    夏雨感覺自己好像坐了一趟雲霄飛車，從頭來又回到了哪裡。在這次博弈中，她抓住了飆升的大黑馬，可是她也並沒有獲得相應的回報，其原因就在於她沒有把握住賣出股票的時機。


    其實，在新股民中犯這種錯誤的人不在少數，他們沒有經過股市的洗禮，風險意識淡薄，對股票的期望值太高，總想短期內在一檔股票上大賺特賺。結果到嘴的肥肉沒有吃到，甚至還虧了本。


    可見，把握股票賣出時機如此重要，那麼對投資者來說，該如何找到賣出股票的關鍵時機呢？


    # 大盤行情形成大頭部時，堅決清倉全部賣出


    上證指數或深圳綜合指數大滬上漲後，形成中期大頭部時，是賣出股票的關鍵時刻。不少市場評論認為拋開指數炒個股，這種提法不科學。只關注個股走勢是只見樹木不見森林。根據歷史統計資料顯示：大盤形成大頭部下跌，竟有
    90% 至 95% 以上的個股形成大頭部下跌。大盤形成大底時，有 80% 至 90% 以上的個股形成大底部。大盤與個股的聯動性相當強，少數個股在主力介入操縱下逆市上揚，這僅僅是少數、個別現象。要達到這種逆市上揚的「莊股」概率極低。因此，大盤一旦形成大頭部區，是果斷分鈦賣出股票的關鍵時刻。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '114


    # 大幅上升後，成交量大幅放大，是賣出股票的時候


    當股價大幅上揚之後，持股者普遍獲利，一旦某天該股大幅上揚過程中出現賣單很大、很多，特別是主動性拋盤很大，反映主力、大戶紛紛拋售，這是賣出的強烈信號。儘管此時買入的投資者仍多，買入仍明顯，迷惑了不少看盤經驗差的投資者，有時甚至做出追殺的誤判，其實主力是把籌碼集中拋出，沒有大主力願在高價區來蒐集籌碼，來實現少數投資者期間的「換莊」目的。


    成交量創下近數個月甚至數年的最大值，是主力賣出的有力信號，是持股者賣出的關鍵，沒有主力拉抬的股票難以上榜，僅靠廣大中小散戶很難推高股價的。上揚末期成交量創下天量，90%
    以上形成大頭部區。


    # 股價大幅上揚後，除權日前後是賣股票的關鍵時機


    上市公司年終或中期實施送配方案，股價大幅上揚後，股東登記日後或除權日前後，往往形成衝高出賣的行情，一旦該日拋售股票連續出現十幾萬股的情況，應果斷賣出，反映主力出貨，不宜久持該股。


    # 上升較大空間後，日 K 線出現十字星或長上影線的


    上升一段時間後，日 K 線出現十字星，反映買方與賣方力量相當，局面將由買方市場轉為賣方市場，高位出現十字星猶如開車遇到十字路口。紅盤，反映市場將發生轉折。股價大幅上升後，出現帶長上影線的倒錘形陰線，反映當日拋售者多，若當日成交量很大，更是見頂信號。許多個股形成高位十字星或倒錘形長上影陰線時，80%
    至 90% 的機會形成大頭部，應果斷賣出股票。


    # 倒錘形陽線或陰線時，是賣出股票的時候'
