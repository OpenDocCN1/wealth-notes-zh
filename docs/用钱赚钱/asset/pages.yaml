    # 投資規劃


    章先生每月收入扣除日常支出和房貸還款外尚有少量結餘，所購議房屋若能及時出租，可帶來每月 1000 元左右的收入。建議這些資金每月定期定額投資指數型基金。年終獎金如果未有其他用途，同樣可以選擇優質基金進行投資。


    長期固定投資加上不斷追加的小額投資兩三年後應有理想回報，預計可達 18 萬到 20 萬元，屆時可作爲買車及新房裝修之用。


