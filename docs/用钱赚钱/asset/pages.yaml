  md: '# 積聚財富不能靠工資，而是靠投資理財


    財富積累必須靠資本的積累，要靠資本運作。對普通人來講，靠工資永遠富不起來，只有透過有效的投資，讓自己的錢流動起來，才能較快地積累起可觀的財富。


    一般來說，創造財富的途徑有兩種主要模式：第一種是打工*，目前靠打工獲取工資的人占90%左右；第二種是投資，目前這類群體占總人數的10%左右。


    一些專業人士對創造財富的兩種主要途徑進行了分析，發現了一個普遍的結果：如果靠投資致富，財富目標比打工要高得多。例如：具有「投資第一人」之稱的億萬富豪華倫·巴菲特就是透過投資致富，財富達到440億美元。還有沙烏地阿拉伯的瓦利德王子也透過投資致富，他才50歲，但早在2005年，他的財富就已達到237億美元，名列世界富豪榜前五名。


    一般來說，在個人創造財富方面，比起投資，打工能夠達到的財富級別十分有限。但打工所要求的條件和「技術含量」較低，而投資創業需要一定的特質和條件，因此絕大多數人還是選擇打工並獲取有限的回報。但事實上，投資是我們每一個人都可做、都要做的事。從世界財富積累與創造的現象分析來看，真正決定我們財富水準的關鍵，不是你選擇打工還是創業，而是你選擇了投資致富，並進行了有效的投資。


    +   * 打工：泛指從事受僱於雇主的工作。'
  merge: -1
  img_proc: true
- pgno: 24
  md: '奇異公司（General Electric Company）*前總裁傑克·威爾許（Jack Welch）年薪超過千萬美元，以打工致富，而巴菲特是世界「投資第一人」。我們可以透過這兩個典型人物的財富對比，來揭示打工致富與投資致富的區別。巴菲特
    40 多年前創建波克夏·海瑟威公司（Berkshire Hathaway）*的時候，僅投入 1500 萬美元，後來透過全球多樣性的投資，成為世界上最有錢的人之一。威爾許擁有超過
    4 億美元的身價，與巴菲特的 440 億美元財富相比，就顯得太少了。可見致富方式選擇的差別，最終決定了威爾許與巴菲特之間存在著那麼遙遠的財富距離。


    致富的關鍵在於如何投資理財。巴菲特說過：「一生能積累多少財富，不取決於你能夠賺多少錢，而取決於你如何投資理財。」亞洲首富李嘉誠也主張：20 歲以前，所有的錢都是靠雙手勤勞換來的，20
    歲至 30 歲之間是努力賺錢和存錢的時候，30 歲以後，投資理財的重要性逐漸提高。李嘉誠有一句名言：「30 歲以前人要靠體力、智力賺錢，30 歲之後要靠錢賺錢（即投資）。」錢找錢勝過人找錢，要懂得讓錢為你工作，而不是你為錢工作。


    當然，投資有風險，投資未必能致富，但是如果你不投資，則致富的機會為零。投資理財最重要的觀念、最有價值的認識是告訴你：「投資理财可以致富。」


    有了這種觀念和認識至少可以讓你有信心、有決心、充滿希望。不管你現在擁有多少財富，也不管你一年能省下多少錢，投資理財的能力如何，只要你願意，你都能利用投資理財來致富。


