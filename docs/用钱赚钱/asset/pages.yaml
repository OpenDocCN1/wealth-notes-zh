  md: '“足的人壽保險。」


    由此可見，保險不是一種普通的投資，而是一種風險轉移的方式，即由保險公司承擔一部分風險，所需代價就是支付保險費。如何選擇應對方式，可以因人而異。


    生活中，還有很多人認為：富人是不會買保險的，因為他的錢花不完。這種思想是錯誤的。富人都買有保險，保費對他來說相當於零花錢。一位買保險的富人說：「我考慮更多的是風險投資，一旦發生風險，家人、事業怎麼安排？還包括一些未來的事情，我必須有一大筆錢做安排。不出意外一定可以賺錢。這是一種自信；但是一旦出了人身風險，必須把風險變成收益。所以我實際上把買保險當成一種被動的風險投資，用風險來賺錢。」


    保險可以規避未來不可預測的風險。當他一旦有債務而被追債的時候，他的錢將被拿走，並不能起到為家庭保本財產的作用。而你用這些錢去買保險，即使你家的房屋、汽車都被追債，這張保單是可以保留的。因為在法律上規定，保險單是以人的生命、器官和壽命為代價換來的將來收益的期權，不作為追債對象。


    # 保險是很好的理財工具


    首先，保險是一種資產保全工具。什麼叫資產保全工具？黃金、房地產等。黃金10年後能增值多少，誰也不敢說，但有黃金在手，心裡就會比較踏實。再比如房地產，有房子也讓人心裡踏實，儘管現在不是一筆錢，但那是一項資產。保險也一樣，是資產保全的工具。有了這些東西，面對未來的不可預測，就不會感到惶惑不安，心裡就會踏實一些。


    其次，保險是應對風險的投資。對於保險而言，要對我們自己不願意承擔的風險去投資，這類風險一旦來臨，首先，不能讓風險對自己形成沉重的打擊，其次，不能讓財富損失，而最好還要能將風險變成賺錢的事'
