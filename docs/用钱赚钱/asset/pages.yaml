  md: '期熊市*的情況下，趨勢跟蹤不是好辦法。


    # 分配資產份額並設計投資組合


    當你做好前面的準備之後，接下來就是具體實施了。與使用資產類別較少的傳統方法相比，廣泛分散的複合等級資產投資能夠產生更高的長期波動調整後收益。一旦你決定採用廣泛分散的投資組合，那麼就開始著手設計適合自己的投資組合吧！


    # 控制投資規模


    確定投資規模在任何投資系統中都是最重要的部分，但是絕大多數投資專業指導書籍和課程中都忽略了這一節，而往往以資產配置和資產組合管理來代替。其實，資金管理和資產組合管理絕對不能相互替代。特別是在經濟不穩定的情況下，控制好投資規模才能確保你的資金安全。


    總之，處於30幾歲的年齡階段，人生的道路還很漫長，充滿著太多的變數和風險，你需要足夠多的錢來保障你的未來。所以，為了你的生活幸福，從現在開始制定你的投資計畫吧！合理分配你的資金，利用各種投資工具去闖蕩一番，並為自己博取一個幸福美好的未來。


    * 熊市：又稱為空頭市場，指證券市場上，價格走低的市场。'
