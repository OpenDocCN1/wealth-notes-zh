- pgno: 32
  md: '# 會掙錢不如會理財


    生活中，有很多人會有這樣的想法：我的收入高，理財對於我來說是無所謂的事情。當然，如果你有足夠高的收入，而且你的花銷不是很大的話，那麼你確實不用擔心沒錢買房、結婚、買車，因為你有足夠的錢來解決這些問題。但是僅僅這樣你就真的不需要理財了嗎？要知道理財能力與掙錢能力往往是相輔相成的，一個有高高收入的人應該有更好的理財方法來打理自己的財達，爲進一步提高你的生活水準，或者說爲了你的下一個「挑戰目標」而积蓄力量。


    趙小姐在一家私企工作，經過幾年的拼搏，手上纔算攢了些錢，可是要想買車、買房子就明顯不夠了。看著身邊的人都在用自己空餘的時間開始理財，趙小姐卻這樣想：「會理財不如會掙錢，那也捨不得吃、這也捨不得穿的日子過得有什麼意思。」可是隨著時間的推移，她的同事都有車有房了，但是她卻還是什麼也沒有。


    余先生在一家房產公司搞設計，平均月收入5000元。和多數人精打細算花錢不同，余先生掙錢不少，花錢更多，有錢時儼然是奢侈的富豪，什麼都敢玩，什麼都敢買；沒錢時則一貧如洗，借債度日——拿著豐厚的薪水，卻打起貧窮的旗號。在别人眼裡，余先生他們可能是一些低收入者或攢錢一族們羨慕的對象，可實際上，他們的日子由於缺乏計畫，實際過得並不怎麼「瀟灑」。他們「不敢」生病，害怕每月還款的來臨，更不敢與大家一起談論自己的「家庭資產」，遇到滲透、漏燒等需要花大錢的時候，他們往往會急得背上起泡，進而捶胸嘆足，痛哭流涕：天呀！我的錢都上哪兒去了？'
  merge: -1
  img_proc: true
- pgno: 33
  md: '從上面兩個例子可以看出，生活中有些人掙的錢也不少，可一談起自己的家庭資產的時候，卻發現自己掙的那麼多的錢都不知去向。可見，會掙錢不如會理財，一個人再能掙錢，如果他不會理財，那他掙的錢，就只能是他人的。因為他總是掙多少，花多少，那他永遠不會有屬於自己的錢。


    其實在生活中，如果你並不打算有更具挑戰性的生活，那麼你確實可以「養尊處優」了。但是假如你在工作到一定程度的時候，想要開一家屬於自己的公司，或者想做一些投資，那麼你就仍然需要理財，你也會感受到理財對你的重要性。因為你想要進行創業、投資，這些經濟行爲意味著你面臨的經濟風險又加大了，你必須透過合理的理財手段增強自己的風險抵禦能力。在達成目的的同時，又保證自己的經濟安全。


    那麼，怎樣才能改變這種毫無儲蓄的處境呢？針對這種現實情況，會理財的人總結出了以下經驗：


    # 量入為出，掌握資金狀況


    俗話說：「錢是人的膽。」沒有錢或掙錢少，各種消費的慾望自然就小，手裡有了錢，消費的慾望立刻就會膨脹。所以，這類人要想控制消費慾望，特別要逐月減少「可有可無」以及「不該有」的消費，然後對開銷情況進行分析。


    # 強制儲蓄，逐漸積果


    發了工資以後，可以先到銀行開立一個零存整取帳戶，每月發了工資，首先要考慮到銀行存錢。如果存儲金額較大，也可以每月存入一張一年的定期存單，一年下來可積攢 12
    張存單，需要用錢時可以非常方便地支取。'
  merge: -1
  img_proc: true
- pgno: 34
  md: '# 主動投資，一舉三得


    如果當地的住房價格適中，房屋具有一定增值潛力，可以辦理購屋貸款，購買預售房或成房，這樣每月的工資首先要償還貸款本息，減少了可支配資金，不但能改變亂花錢的壞習慣，節省了租房的開支，還可以享受房屋升值帶來的收益，可謂一舉三得。另外，每月拿出一定數額的资金進行國債、開放式基金等投資的辦法也值得上班族採用。


    # 別盲目趕時髦


    追求時髦、趕潮流是現代年輕人特點，當然這也是需要付出代價的。你的手提電腦是奔4，我非弄個無線上網的；你的手機剛換成CDMA，我明天就換個3G……很顯然，你辛辛苦苦賺來的工資就在追求時髦中打了水漂。其實，高科技產品更新換代的速度很快，這種時尚你永遠也追不上。


    作為新時代的年輕一代，更好地享受生活本無可厚非，但凡事講究適度，講究科學，只有會理財才會掙錢，不要讓「掙錢就是為了花」的觀點蒙蔽了你的眼睛。否則如果沒有好的理財觀念，就算你累死了，到頭來你的財富也不會獲得更大的增長。'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# 工作再忙也要記得理財


    「有時間賺錢、沒時間打理」，已經成為現代很多年輕人的通病。「忙人」們為數衆多，他們因為「忙」而帶來的財富損失，尤其是機會成本也是不可小覷的。儘管「你不理財，財不理你」的理念早已深入人心，可在現實生活中，有錢無間的理財「忙人」依然為數衆多。


    黃先生是一家房地產公司的業務員，不僅工作忙碌，又是公司的業務主管，每天工作都很忙。於是工資便往由會計打進銀行卡裡，最多買東西時刷刷卡，多餘的錢就在卡裡放著。當理財專家對他提出理財建議時，黃先生卻抱怨說：「我哪有時間打理錢財呀？朝九晚五地上班，加註是家常便飯，難得有個空間的時間，也只能躺在床上看看電視或者是睡個懶覺，逢上週末，還需要進行自我充電，生活中邊培養自己愛好情趣的時間都沒有，更別說每天看看股市行情，或者研究市場上新出什麼理財產品了。」


    這或許就是大多數上班族的真實際現吧，這一類人多因為工作的原因而沒有時間對投資市場做更多的研究，因此他們並不適合一些技術性很強的投資品項，如匯市、期市等。對於這一類人而言，來自銀行的理財產品或許更為適合他們，因為無需大量資金的頻繁轉移，譬如基金等相對於較普及的投資品項就非常適合他們，因為他們可以適當承擔一些風險，也期待更高一點的收益。


    但，很多上班族往往對儲蓄帳戶有著天然的偏愛，然而讓資金長期按照定存利率存結果，不免顯得過於「低廉」。如果動用約定自動轉存，可以多得一些定期利息，如果利用定活兩度，則可以實現定期活期兩不'
