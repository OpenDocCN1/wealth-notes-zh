  md: '興沖沖地給兒子辦了兩份保險，一份是健康醫療險，一份是教育儲蓄險，一年共需交保費 4000 多元。但由於小王府婦的家庭經濟情況比較拮据，這筆保費對夫妻二人來說是個不小的數目。小王認為，自己和妻子都沒辦保險，但日子再苦不能委屈了孩子，所以要先給孩子把保險買上。


    其實，孩子當然重要，但小王的做法並不科學，這實際上是個誤區。現在每家就一個寶貝兒，很怕委屈了孩子，所以孩子剛一出生，就急著給孩子辦這個保險那個保險。給孩子辦保險當然是好事，但據瞭解，因為經濟條件或觀念原因，現在很多家長自己都沒有保險，心裡卻想著先給孩子辦好保險，這就走誤區了。


