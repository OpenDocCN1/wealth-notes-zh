  md: '當股價突破 60 日均線後，需滿足其均線斜率頭上行的條件才可買入。若該股跌破均線後其 60 日均線未能拐頭上行，而是繼續走下行趨勢時，則表明此次突破只是反彈行情，投資者宜買入。


    如果換手率高，30 日均線就是股價中期強弱的分界線。


    # 根據過線與日線的共振、二次金叉等幾個現象尋找買點


    # 過線與日線共振


    過線反映的是股價的中期趨勢，而日線反映的是股價的日常波動，若過線指標與日線指標同時發出買入信號，信號的可靠性便會大增。如過線 KD] 與日線 KD] 共振，常是一個較佳的買點。日線
    KD] 是一個敏感指標，變化快，隨機性強，經常發生虛假的買、賣信號，使投資者無所適從。運用過線 KD] 與日線 KD] 共同金叉（從而出現「共振」），就可以過濾掉虛假的買入信號，找到高品質的買入信號。不過，在實際操作時往往會碰到這樣的問題：由於日線
    KD] 的變化速度比過線 KD] 快，當過線 KD] 金叉時，日線 KD] 已提前金叉幾天，股價也上升了一段，買入成本已抬高。為此，激進型的投資者可在過線
    K、] 兩線勾頭、將要形成金叉時提前買入，以求降低成本。


    # 過線二次金叉


    當股價經歷了一段下跌後反彈起來突破 30 過線位時，我們稱為「過線一次金叉」。不過，此時往往只是莊家在建倉而已，我們不應參與，而應保持觀望。當股價再次突破
    30 過線時，我們稱為「過線二次金叉」，這意味者莊家先盤結束，即將進入拉升期，後市將有較大的升幅。此時可密切注意該股的動向，一旦其日線系統發出買入信號，即可大膽跟進。'
