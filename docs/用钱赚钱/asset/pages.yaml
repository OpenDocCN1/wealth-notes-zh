  img_proc: true
- pgno: 13
  md: '小劉離月收入不高，但一切從簡，基本消費只有800元，又沒有抽菸喝酒等其他嗜好。加上其他消費，小劉每個月的開銷大概在900元左右，半年能節餘3600元，除去其他的開銷，小劉半年下來存了3300元。

    也許有人會認為小劉這樣做只是節約而已，只要小王也能節約一點，半年下來存款一定會比小劉多。有人甚至會不認可小劉的做法，認為他太小氣、太無趣了！這樣根本不叫生活，而認為小王的做法更為瀟灑。如果你也有這樣的想法，那麼你需要改變一下思維。


    很多人認為「錢是賺出來的，而不是省出來的。」其實這是一種不切實際的想法，為自己的浪費找一個合理的藉口而已。年輕人在收入不高的階段，就應該養成節約的習慣，最好能養成儲蓄的習慣，只有在腳踏實地慢慢地積累和投資的過程中，不斷提高自己的理財能力，才是正確的觀念。從現在開始理財，別拿沒錢當藉口！其實你可以理財；這是你人生中最不該迷的一課。'
