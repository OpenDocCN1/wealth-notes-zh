  md: '# 主動型基金


    主動型基金一般以尋求取得超越市場的業績表現為目標，哪個板塊賺錢，基金就買哪個板塊，可以主動地去選擇股票的配置。股票型基金、偏股型基金、偏債型基金，都是主動型基金。


    # 被動型的基金


    被動型基金一般選取特定的指數成份股作為投資的對象，不主動尋求超越市場的表情，而是試圖複製指數。所以，被動型的基金也叫做指數型基金，以每個指數為模仿對象，買這些成份指數，如滬深300，上證50，滬深100。融通深證100基金，就買深證100這100支成份股，之後可以不再看它的收益了，只要股指漲多少，它就基本上漲多少。


    # ETF


    ETF（Exchange Traded Fund）中文翻譯成「指數股票型基金」，是像股票一樣能在證券交易所交易的指數基金。這種基金不僅具有股票基金和指數基金的特點，同時還有開放式和封閉式基金的特點。


    投資者一方面可以向基金管理公司申購或者贖回基金份額，同時，又可以像封閉式基金一樣在證券市場上按市場價格買賣 ETF 份額。不同的是，它的申購是用一攬子股票換取
    ETF 份額，贖回時也是還回一攬子股票而不是現金。由於同時存在證券市場交易和申購贖回機制，投資者可以在 ETF 市場價格與基金單位淨值之間存在差價時進行套利交易。由於套利市場機制存在，也使得
    ETF 避免了封閉式基金普遍存在的折溢問題。


    目前，市場上的 ETF 有易方達滬深 100ETF、交科华泰上證紅利 ETF、華夏中小板股票 ETF、華安上證 180ETF 和華夏上證 50ETF，5 支'
  merge: -1
  img_proc: true
- pgno: 132
  md: '# LOF


    LOF（Listed Open-Ended Fund）中文翻譯成「上市型開放式基金」，指基金發行結束後，投資者既可以在指定網點申購與贖回基金份額，也可以在交易所買賣的基金。


    LOF 打破了封閉式基金和開放式基金的鴻溝，改變了目前封閉式基金只能在二級市場交易，開放式基金只能在一級市場贖回的局面。其帶來的套利機制使 LOF 在二級市場上的價格和基金淨值非常接近，不僅彌補了封閉式基金大幅折價的缺憾，同時也解決了開放式基金銷售成本高的問題。LOF
    主要是面對中小投資者，在股票行情看好的時刻，投資者可以利用其更快的交易制度，從基金投資轉到股票投資，提高資金使用效率；在行情難以把握的情況下，投資者可以返回投資基金。


    LOF 有很多，如南方高增（160106）、嘉實 300（160706）、荷銀效率（162207）、萬家公用（161902）、融通巨潮（161607）、廣發小盤（162703）、南方積配（160105）、中銀收益（163804）、中銀增長（163803）、贛南價值（160607）、招商成長（161706）、博時主題（160505）、興業趨勢（163402）、景順資源（162607）等。


    投資者如果是在指定網點申購的基金份額，要想在網上拋出，須辦理轉託管手續；同樣，如果是在交易所網上買進的基金份額，想要在網點贖回，也要辦理一定的託管手續。LOF
    申購和贖回均可以現金方式進行。'
  merge: -1
