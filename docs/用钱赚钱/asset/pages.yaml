  md: '# 退保縮水


    買保險容易，如果沒有到期要退保，則可能要遭受巨大損失。保險不像儲蓄，存錢進銀行後可以本息兼收。要瞭解退保時到底能拿回多少錢並不難：每份保險合約中都會附帶一份現金價值表，對照這份表格可以清楚知道自己退保時能拿回多少錢。總而言之，投保人已繳費的保費－（保險公司的管理費用開支在該保單上分攤的金額）－（保險公司因为该保單向推銷人員支付的佣金）－（保險公司已承擔該保單保單責任所需要的紓保費）－（剩餘保費所生利息）＝現金價值。買保險之前一定要仔細考慮是否買，自己是否可以承受，以免日後損失。


    # 無效簽名


    按照中國《保險法》規定，以死亡為給付保險金條件的保險合約，未經被保險人書面同意並認可保險金額的，合約無效。保險公司稱，保單代簽名之所以不被承認，很重要的是為了防範道德風險。不要自作聰明，買這樣的保險一定要被保險人簽字。


    # 定損分歧


    定損主要發生在車險裡。保險公司在理賠定損時與車主發生糾紛的現象並不少見。主要原因是保險公司既當「運動員」又當「裁判員」的做法讓人無法信任。一旦當事雙方各执一詞，可以嘗試透過調解委員會重新查勘定損。此外，當事人也可向保險評估公司求助。


    # 投保人要獲得合法的支持


