  md: '儘管項建庭與他的同齡人有著相同的起點，但他們在財富上的差距卻在拉大，今後還會愈來愈大。按照項建庭自己的說法，差距不在於面對金錢的態度，理財可以改變人生。


    項建庭的致富故事，有一定的運氣成分，因為他正好趕上房價的大漲，但主要的原因還是他的理財意識和對機遇的把握。不少人也遇到了同樣的機會，但是卻沒有像項建庭一樣富裕起來，這就是理財意識和觀念的差距使然。'
