- pgno: 285
  md: '# 收藏投資的操作要點和原則


    在收藏市場上，一般會把其行情劃分為牛市、熊市和牛皮市。牛市和熊市與股票市場相似，牛市市則是指收藏品的價格沒有大的波動，只有小的起伏、介於中間的市場狀況。因此，說到收藏投資操作策略，需要按照市場的具體情況而論。


    # 處於牛市狀況時的操作策略


    在收藏品市場行情對投資收藏者十分有利，且收藏者的資金相對充裕的情況下，投資收藏者就應採取利上加利的策略，大舉入市，以期獲得更大的收益。


    收藏者如果預期某種收藏品會繼續上漲的話，可以適當買入這種收藏品，當這種收藏品的價格上漲時，收藏投資者可以適時將收藏品賣出。不過，如果仍然預期這種收藏品會繼續上漲的話，他還可以繼續買入這種收藏品。當這種收藏品的價格依然繼續上漲時，收藏者既可以繼續買入，也可以相繼出貨，這就是利上加利的策略。這種操作技巧，雖然不一定保證買入的所有收藏品都能夠獲利，但是，只要適時平倉出局，那麼，投資收藏者仍然可以獲利不少。當然，利上加利法需要投資收藏者準備足夠多的備用資金，以便隨時出擊。利上加利法的關鍵，在於把握好出貨時機，只要不做過頭，就僅僅是賺多賺少的問題。'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# 處於熊市時的操作技巧


    # 積極求和法


    當收藏者預期某種收藏品的市場行情會上漲時，可以買入這種收藏品。但是，如果市場行情創出人意料地反向跌了，收藏者該如何做出一決無呢？如果收藏者預期市場行情依舊會反彈，那麼，為了挽回大勢，他就應該下定決心，在市場行情一跌再跌時，不斷買入這種收藏品，以壓不斷分擔自己的總投資成本。在收藏者處於不利的情況下，如果採取消極的方式買草收兵，將會造成或多或少損失。但是，如果將積極求和法運用得當的話，那麼，收藏者不但可以部分甚至全部地挽回損失，有時候甚至還可以獲利不少。


    如收藏者預期某種收藏品的價格會上漲，因此，買入了這種收藏品，但沒料到的是，收藏者的預期並不正確，這種收藏品的價格不漲反跌了。那麼，他實際上還可以在這種收藏品的價格不斷下跌的過程中，分別以更低的價格繼續買入這種收藏品，從而降低平均買入成本。等到這種收藏品的價格開始反彈後，再尋找有利時機，例如：等價格上漲後再將這這收藏品一次性脫手，或者分批賣出。對於收藏者而言，積極求和法的關鍵在於資金占用的時間通常會比較長。因此，收藏者必須考慮到資金占用的機會成本。此外，收藏者還應該選擇恰當的出手時機，以免错失良機而被再度「套牢」。


    # 捨小求大


    如果收藏者預期行情將上漲，買入了某種收藏品，但是，市場行情卻反向跌了，而且，似乎還有一跌再跌的趨勢。此時，收藏者就應該在損失還不是太大時先行將收藏品賣出。在這種收藏品繼續下跌的過程中，再伺機買入，從而挽回過去的損失。這就是捨小求大法。


    從某種角度來看，捨小求大法與積極求和法，似乎有幾分相似之處。'
  merge: -1
  img_proc: true
- pgno: 287
  md: '不過，二者的主要區別在於，積極求和法需要不斷注入新的資金，而搶小求大法則無須不斷投入新的資金。捨小求大法的目的，主要是降低收購投資成本。


    # 處於牛皮市時的操作技巧


    在行情平穩且未見到任何能夠使收購市場大起大落的因素，即出現牛皮市時，通用橫少成多法最為合適。每逢行情上漲就賣，行情下跌就買。這種方法在表面上看來似乎有悖於一般原理，而且有幾分類似於「投機」行為。儘管每次所獲收益不大，然而，如果反覆多次，總收益還是相當可觀的，所以，將這種方法稱為橫少成多法。


    處於牛皮市時，要學會等待，以期捕獲市場大的走向，有時會獲得意想不到的機會。當市場逐漸走強時，特別是呈現向上突破的走勢時，應保持冷靜和謹慎，當市場出現短時期下跌時，應當注意捕獲機會。'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# 瓷器的收藏


    瓷器一直是收藏品市場上的熱點，也是眾多收藏品類中增值較快的一種。近年來，瓷器收藏市場逐年看好。


    相對於書畫等其他收藏品來說，瓷器的選擇性較寬。從明清官窯作品到民窯精品，從價格較高的古瓷到工藝精美的現代作品，都能從中挑選出值得投資的精品。而且，不同瓷器的投資額也相差很大，無論是財大氣粗的大收藏家，還是資金有限的中小投資者，都可以進入。


    在市場上海得瓷器，價格最高的都不超過千元，其中很多都在三百、五百元上下。但只要是看準了「下手」，即便是兩三百元買進的貨品，也有不小的利潤空間。一般的民窯瓷器在市場上往往百餘元就能買到，門檻並不高，投資風險相對較低，而且目前正處於上升期，非常適合廣大中小投資者進入。


    在瓷器收藏市場上，古代瓷器是收藏的一大亮點，那麼一般人在收藏中應注意哪些問題呢：


    # 應看作品的造型


    造型往往被陶瓷藝人和收藏家忽視。因為人們最易被色彩打動，而輕視造型本身。作為一種三維空間的藝術形式，造型的本身就能體現出一種精神：或圓潤、或挺拔、或纖秀、或雄強、或文懦、或豪放。造型雖是由簡單的線條組成，但提供給人們的想像力卻是無窮無盡的。'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 看裝飾的效果


    既要看裝飾是否與造型統一，更要看裝飾本身是否新穎和有創造性。瓷質材料的精美決定了裝飾也應是唯美的。有些陶瓷藝人，簡單地將國畫面移入瓷器裝飾，效果未必很好。除少數作品外，兩維空間的國畫移入三維空間並不適合瓷器裝飾。


    # 看色泽


    青花是否純淨幽遠、豐富潤澤，釉裡紅是否紅而不俗、層次多變，釉色是否亮麗豔透、無斑點瑕疵。如果以上三點都比較符合要求，至少具備了收藏的基本條件。接下來要瞭解作者的自身條件，是新新人新作，價位偏低，就大膽買下；如果是名人名字作，還需考察作者的年作品量。同樣作品（瓷器作品由於製作燒成過程的特殊性，一般慣例是允許有幾件同樣作品類似），如果量少，價格自然要高；如果量多，特別是重複作品多，建議要謹慎購買。從國際收藏慣例來看，收藏中青年藝術家的作品，看似有一定的風險，實際上卻是最具價值回報的一項投資。'
  merge: -1
  img_proc: true
- pgno: 290
  md: '# 郵票的收藏


    郵票投資具有資金多少皆宜、市場操作簡單及投資獲利相對穩定等多優點。郵票作為收藏投資，在收藏的同時，還能開闊你的眼界，使你從中學到很多東西，而且隨著郵票市場的便捷，其投資前景無疑非常樂觀。


    集郵的範圍是很廣泛的，除郵票之外，與「郵」字有關的封、簡、片、戳、卡及集郵文獻、郵政用品等，都可列為集藏的範圍，特別是各種實客封要注意蒐集，它是組織郵集不可缺少的到品。


    郵票市場和其他市場一樣，同樣具有很大的風險性。而且郵票市場上存在著很多大戶，大戶吃小戶的現象可謂非常普通。如果你作為一個小戶、剛剛涉入郵票市場或正在萌市中倒騰，並藉此希望從中獲取高額利潤，那麼觀察市場動向，並掌握郵票投資的策略和技巧，是至關重要的。那麼，投資者究竟應該如何投資郵票呢？


    # 要樹立正確的投資理念


    投資邮票不同於投資其他的项目，郵票是具有貨幣功能的特殊商品，郵票價值的高低受題材、發行時間、發行量、存世量、群票喜愛程度等諸多因素的影響，同時也受市場投機炒作的影響。因此，郵票價格的浮動受各種因素的制約，某一時間的價格並不代表其實質價值，對郵票本身價值的認定必須得到社會的認可，這之間要扣除炒作的泡沫成分。'
  merge: -1
  img_proc: true
- pgno: 291
  md: '# 投資郵票要量力而行


    對廣大中小投資者而言，投資收藏郵票的基本要素有兩條：一是要判斷郵票保值、增值的條件要素是否具備；二是在決定投資前一定要根據自己的經濟條件量力而行，在沒有絕對把握獲利的情況下，切忌負債或超負債投資郵票。雖然郵政改制後的政策面對市場有利，但也要有預防突發性事件發生的心理準備。


    # 把握建倉時機至關重要


    中國各省郵政改制掛牌在2007年9月初正式拉開序幕，設立省級郵政監管機構，標誌著郵改政企分離邁出了關鍵一步。此後開始，郵市做出了積極的配合，市場成交活躍，成交量有效放大，熱點逐漸擴散，社會主力大資金已經進場。趁市場行情還沒有達到一定熱點前，择機建倉不失為明智之舉。


    # 還要認真選擇投資品項


    在決定投資郵票後，挑選好郵票品項也是一門學問。一般來講，1991年之前的老紀特郵票存世量少、消耗量大，基本上都沉藏在社會。因此，老紀特郵票的價格都較高，保值、增值比較穩定，受市場波動的影響較小，是長期收藏投資群的首選。


    # 郵票的收藏與保管是十分重要的


    一張郵票有纖細的齒孔，有怕受潮的背膠，如不注意保管，就會發生變形、撕裂、破齒、粘齒及出現黴點，從而影響郵票的品質與外觀。'
  merge: -1
  img_proc: true
- pgno: 292
  md: '郵票最好放入郵冊內收藏，不要把郵票隨便放入信封或夾到書中收藏，這樣很容易發生黏連。新買到的郵冊，往往紙張有些潮，因而需要用乾燥劑乾燥一下，再把郵票插進郵冊。郵冊不用時，應放在乾燥且通風的地方，並且要保持直立狀態。郵票整理擺放時，一定要用鑷子，切記不可直接用手去擺弄郵票，因為手上汗肖，會留下手印或汗染郵票。


    郵票的背膠在收藏保管中是一件煩懶人傷腦筋的事情。郵票背面塗上膠水，是爲了方便人貼用郵票，但是膠水受潮就會軟化、溶解、黏連在郵冊上。有人爲了保存方便，把郵票的背膠用水洗掉，使郵票失去了原有的光澤和條樣，且容易損傷齒尖、齒孔。用水洗掉背膠會損壞郵票的品質與外觀，這種收藏方法是不可取的。一般來講，郵票最好保留原膠，爲了防止背膠出問題，應該經常檢查背膠情況，及時地處理好背膠在保存中出現的問題。


    收藏者在選擇收藏品項的時候，最好選擇的週期一般應該在1年以內，以防範某些不確定性因素變化所帶來的風險。市場是動態的，而不是靜態的，這就要求收藏者一定要隨時隨地改變自己的策略，以適應市場的千變萬化。'
  merge: -1
  img_proc: true
- pgno: 293
  md: '# 石頭的收藏


    奇石乃天地間最古老的藝術品（天爲藝術品或稱類藝術品），其生成年代以百萬年、千萬年甚至億年計數，加上其造型、結構、色彩、圖案、線條等，有時美得讓人眩目和驚嘆。於是從古到今，愛石者甚多。


    如果你沒有加入石頭收藏的行列，你就很難想像到一塊石頭能賣上幾十萬甚至上百萬元。對一些上班族收藏愛好者來說，可多關注奇石收藏。奇石作爲一種大眾藏品，起步並不高，有的甚至低至幾十元，很容易被普通人所接受。


    但是，一般投資者在市場上購買石頭時，要冷靜對待自己已見到的觀賞石，一開始玩石先不要購置價格很貴的奇石，不要爲其高價值迷惑，並非高價就是好石。什麼石頭值得收藏？首先看石品，有最常見、最受歡迎的中國四大名石——太湖石、英石、靈璧石、昆石，還有戈壁石、陽春孔雀石、潮州蠟石、廣西大化石等；其次看色泽，石頭是否對光的反應強，是否有自然威、威重感、本色感或奇異感，石頭經過千萬年的沉澱通常呈現古樸穩定的色泽，很有質感；再看石頭的觸感，是否滑潤、是否有手感，如廣東的黃蠟石，不是蠟卻有蠟的光澤，滑潤可愛；然後才講究石頭之勢，是秀美還是峻立，是富貴還是文雅。


    當然，一些具有特殊意義的，石頭，如名人收藏過的石頭、來源特殊的石頭，如隕石、恐龍蛋化石等，也常常被石頭愛好者作爲收藏對象。


    另外，石頭這個水準如今愈來愈高，尤其是造型的造俱買家很可能透過機器打磨等方法，把原本平淡無奇的石塊鑿造成似人、似物的獨特形狀，一定要仔細辨別。


    因此，一般收藏者必須明斷，不同的石頭，其概念和價值的體現有著'
  merge: -1
  img_proc: true
- pgno: 294
  md: '根本的區別。


    # # 奇石


    它與工藝石的最大區別：一方面它是經過大自然磨礪而形成的，形態、材質、色泽、紋理等元素獨特而自然，且缺一不可，又無人為雕琢或打磨的痕跡；另一方面，它還具有較高的觀賞價值或收藏價值，其價值重點體現五大要素上：形、色、質、紋、韻，天然形成，更重要的是「韻味」無窮，文化內涵豐富。


    # # 觀賞石


    顧名思義，它是指具有一定觀賞價值的石頭，既包含了奇石，又包含了工藝石。在日常賞石活動中出現的經拋光、開片、去底等方式改變石頭形態後的石頭藏品，是為了突出石頭的「紋」、增強石頭的「韻味」、拓展石頭的文化內涵、提高石頭的觀賞價值。如：雨花石、草花石、大理石等。它的價值主要體現在石頭的質、色、形、紋及其所包含的文化氛圍。


    # # 工藝石


    它是透過人工和物理的方法將原始自然的石頭和岩石打磨成某一狀態的物品，或在石頭上人工雕刻、拼繪成某一圖案，或黏接組合成某一主題的作品等，形成可觀賞或收藏的石頭商品。這種透過人工或物理作用，將石頭變成一種具觀賞性和收藏性為一體的石頭，稱之為工藝石。如：石雕、石刻、石畫等。工藝石的價值主要體現在石質自身和雕刻、繪畫工藝上或作品的巧妙構思上。


    綜上所述，人們在收藏石頭的過程中，透過對石頭認識的意識昇華和'
