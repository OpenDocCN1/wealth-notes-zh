- pgno: 185
  md: '# 及時向保險公司報案


    報案是保險索賠的第一個環節。一般情況下，投保人應在保險事故發生10日內通知保險公司，由於各個險種的理賠時效不完全相同，所以一定要根據保險合約的規定及時報案，將保險事故發生的性質、原因和程度報告給保險公司。報案的方式有電話報案、上門報案、傳真式委託報案等。


    # 符合責任範圍


    報案之後，保險公司或業務員會告知客戶發生的事故是否在保險責任範圍之內。客戶也可以透過閱讀保險條款、向代理人諮詢或撥打保險公司的熱線電話進行確認。保險公司只是對被保險人確實因責任範圍的風險引起的損失進行賠償，對於保險條款中的除外責任，如自殺、犯罪和投保人和被保險人的故意行為，保險公司並不提供保障。


    # 提供索賠資料


    索賠資料是保險公司理賠的依據，大致有以下三類：一是事故類證明，如意外事故證明、傷殘證明、死亡證明、銷戶證明；二是醫療類證明，包括診斷證明、手術證明及處方、病理科血液檢驗報告、醫療費用收據及清單等；三是受益人身份證明及與被保險人關係證明。'
