  md: '增長潛力，值得分析驗證。


    # 股東分布情況


    從公司公布的十大股東所持股份數，可以粗略判斷股票有沒有大戶操作。如果股東中有不少個大戶，這檔股票的炒作氣氛將會較濃。


    # 董事會的持股數量


    董事長和總經理持股較多的股票，股價直接牽扯他們的個人利益，公司的業績一般都比較好；相反，如果董事長和總經理幾乎沒有持股，很可能是行政指派上任，就應慎重考慮是否投資這家公司，以免造成損失。


    # 投資收益和營業外收入


    一般來說，投資利潤來源單一的公司比較可信，多元化經營未必產生多元化的利潤。'
