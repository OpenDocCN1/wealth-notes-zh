  img_proc: true
- pgno: 278
  md: '# 投資風險存在的客觀性


    投資風險是由不確定的因素作用而形成的，而這些不確定因素是客觀存在的，之所以說其具有客觀性，是因為它不受主觀的控制，不會因為投資者的主觀意願而消逝。單獨投資者不控制所有投資環節，更無法預料到未來影響黃金價格因素的變化，因此投資的風險性客觀存在。


    # 投資風險的可變性


    投資風險具有很強的可變性。由於影響黃金價格的因素在發生變化的過程中，會對投資者的資金造成獲利或虧損的影響，並且有可能出現獲利和虧損的反覆變化。投資風險會根據客戶資金的盈虧增大或減小，但這種風險不會完全消失。和其他投資市場一樣，在黃金投資市場，如果沒有風險管理意識，就會使資金處於危險的境地，甚至失去贏利的機會。合理的風險管理方式，可以合理有效地調配資金，把損失降到最低限度，將風險最小化，創造更多的獲利機會。


    # 投資風險的相對性


    黃金投資的風險相對於投資者選擇的投資品項，投資黃金現貨和期貨的結果是截然不同的。前者風險小，但收益低；而後者風險大，但收益很高。所以風險不可一概而論，它有很強的相對性。


    黃金價格的劇烈波動，也使一些投資者開始考慮如何能既不承擔虧損的風險，又能分享黃金市場的高收益。最低限度地說，投資者投資與黃金掛鉤的理財產品，不失為一種較理想的選擇。這些產品一般有保本承諾，投資者購買這樣的理財產品，既可實現保本，又可根據自己對黃金市場的判斷進行選擇，獲得預期收益。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 要有投資風險的意識


    對於收益和風險並存這一點，多數人首先是從一種負面的角度來考慮風險，甚至認為有風險就會發生虧損。正是由於風險具有消極的、負面的不確定因素，使得許多人不敢正視，無法客觀地看待和面對投資市場，所以裹足不前。


    投資者在交易中要知道自己願意承擔多少風險，能夠承擔多少風險，以及每筆交易應有的回撤。


    投資者參與黃金市場的過程，就是正確認識風險，學會承擔風險，然後對風險進行規避的過程。在投資市場如果沒有規避風險的意識，就會使資金出現危機，失去贏利的機會。那麼，怎樣做才能真正地降低黃金投資的風險？以下幾種方式非常值得借鑑。


    # 多元化投資


    從市場的角度來看，任何資產或者投資的風險都由兩部分組成，一是系統性風險，指宏觀的、外部的、不可控制的風險，如利率、現行匯率、通貨膨脹、戰爭衝突等，這些是投資者無法回避的因素，是所有投資者共同面臨的風險，這是單獨主體無法透過分散化投資消除的。另外一個是非系統風險，是投資者自身產生的風險，有個別差異。多元化投資可以在一定程度上降低非系統化風險，從而降低組合的整體風險水準。新手炒股由於缺乏經驗，剛開始時投入資金不宜全倉進入，因為市場是雙刃劍的，這樣做風險往往很大，即使有再準確的判斷力也容易出錯。炒「紙黃金」的話，投資專家建議採取短期小額交易的方式分批介入，每次買進10克，只要有一點利差就出手，這種方法雖然有些保守，卻很適合新手操作。


    一般在黃金投資市場，如果投資者對未來金價走勢抱有信心，可以隨'
  merge: -1
  img_proc: true
- pgno: 280
  md: '著金價的下跌而採用愈跌愈買的方法，不斷降低黃金的買入成本，等金價上升後再獲利賣出。


    # 採用套期保值進行對沖


    套期保值是指：購買兩種收益率波動的相關係數為負的資產的投資行為。


    例如：投資者買入（或賣出）與現貨市場交易方向相反、數量相等的同種商品的期貨合約，進而無論現貨應市場價格怎麼波動，最終都能取得在一個市場上虧損的同時在另一個市場贏利的目的。而且，套期保值可以規避包括系統風險在內的全部風險。


    # 建立風險控制制度和流程


    投資者自身因素產生的如經營風險、內部控制風險、財務風險等往往是由於人員和制度管理不完善引起的，建立系統的風險控制制度和完善管理流程，對於防範人為的道德風險和操作風險有著重要的意義。


    # 樹立良好的投資心態


    理性操作是投資中的關鍵。做任何事情都必須擁有一個良好的心態，投資也不例外。心態平和，思路才會比較清晰，面對行情的波動才能夠客觀地看待和分析，減少情緒慌亂中的盲目操作，降低投資的風險率。並且由於黃金價格波動較小，投資者在投資黃金產品時切忌急功近利，建議培養長期投資的理念。'
  merge: -1
  img_proc: true
