- pgno: 71
  md: '# 投資股票


    股市是冒險者的天堂，當然也是高收入者的首選。不過，由於其高風險性，在投資時還是要謹慎一些。一開始，可以將少數資金注入股市，隨著炒股經驗的增加，再逐漸加大資金投入量。


    # 購買基金產品


    投資基金是一個不錯的選擇，基金產品的類型較多，有的適於機構投資者，有的適於中小投資者。那麼，什麼樣的基金產品適用於中小投資者呢?按照收益憑證的變現方式劃分，可分為封閉型與開放型；按投資對象劃分，可分為證券投資基金與實業基金。一般開放型基金中的證券投資基金比較適合於中小投資者投資。


    一般來說，貨幣市場基金首次認購的數額不少於5000元，此後可按1000元的整數倍追加認購，基金管理公司會每天公布每萬份基金單位收益，月月獲利，月月返還收益，根據客戶的實際需求隨時兌付。與股票型基金相比，基金管理公司一般會將此基金投資於央行票據、短期債券等安全係數較高的資金市場，所以安全性方面是有保障的。


    收益方面，由於基金管理公司運作的方式各異，以及收益直接與公司的管理運作水準、市場的綜合情況掛鉤，所以具體到每一檔基金收益是不同的。


    # 購買人民幣理財產品


    人民幣理財產品的收益，雖然比不上股票基金，但比同期存款稅後收益還是強得多。而且，人民幣理財產品的特點是一般沒有認購手續費、管理費、無存款配比，是儲蓄類產品的替代品。可以說，兼具安全性與高收益性於一身。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 投資於國債


    國債向來被譽為「金邊債券」，當然也是不錯的投資工具。國債的投資風險幾乎為零，不用交納利息稅，還可以拿到債券市場去交易，流動性也不錯。


    # 調整收支，以適應購房支出


    購買房產，永遠是人生的一件大事。按照北京的標準，在 2009 年購買面積在 100 平方米左右的一兩室一厅，大概需要 96 萬元，加上稅費，共 98 萬元左右（假設購房已經裝修）。結婚一般還有必要的花費，包括家具電器、婚禮費用等，根據個人的需要和興趣不同而有所區別，一般至少也要在
    8 萬元以上。如果實現以上的目標，還會帶來生活收支的變化。購房之後，除了每月的生活消費，還會增加不少支出：


    +   ○ 物業費支出：按照 2.5 元的標準，每月 300 元左右。

    ○ 採暖費：按照 30 元的價格，均攤到每月，300 元左右。

    ○ 每個月住房貸款支出：3000 元左右。


    一般投資者的財富主要是現有的存款，以及每月的收入。而存款不可能穩定增加，幾年內最可能大幅度增加的就是每月的盈餘。所謂盈餘是指收入減去支出，結果還是赤字。盈餘增加的途徑有兩個：加大收入或者減少支出。


    在收入方面，一般情況下不會出現近期有著飛躍增長的跡象，因此，減少支出就成了最主要的手段。合理地進行調整收支往往可以增加盈餘，同時這部省下來的資金還不受稅收的影響，其額度一般也比較可觀，有時可以降低
    50% 以上。'
