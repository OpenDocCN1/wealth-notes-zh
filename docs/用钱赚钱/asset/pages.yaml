  md: '# 跳出保險理財的常見誤區


    很多人都會把保險當成收益性金融產品，在購買保險之前，都喜歡算算是否划算。如果自己沒有出現意外，沒得到理賠，就認為自己賠了，買保險就不划算了。


    事實上，從保險生效那一刻開始到保險責任終止，這期間，作為被保險人一直在使用著保險，只是因為保險是一種無形商品，被保險人沒有感受到。


    產生這樣的誤區的根本原因，是人們還沒有真正樹立正確的風險觀念，或者說對風險的認識還不夠。有些錯誤還是非常普遍的、有代表性的。對於這些典型的認識誤區，我們要學會甄別並盡量避免。


    # 買保險不如儲蓄和投資


    鄭先生是一家外企的行政總監，年薪20多萬元，還房貸、養車、養孩子……月支出近萬元。妻子是全職太太。據鄭先生說，他現在有點存款，都用來投資了，他、妻子、孩子都沒辦保險：「我主要是覺得保險沒有太大的實際意義，純消費型的，出事的機率畢竟很小，應該不會發生在我們身上；養老的、教育的，覺得就類似儲蓄，又沒多大意思。我的原則就是年輕時拼命賺錢存錢，到老了就是我的『保險』。」


    鄭先生的想法代表了很多人的看法，但這是一個很典型的錯誤認識。其實，保險最重要的作用是保障功能；對於經濟不很寬裕的人來說，保險解決萬一發生不幸、收入突然中斷時的經濟來源問題；而對於有錢的人，'
