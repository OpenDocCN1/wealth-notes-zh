- pgno: 101
  md: '# 股票投資的關鍵在於選股


    股神巴菲特以 100 美元起家，透過投資而成為擁有數百億美元財富的世界級大富豪。縱觀巴菲特 40 多年的股壇生涯，其選股共有 22 支，投資 61 億美元，贏利
    318 億美元；平均每檔股票的投資收益率高達 5.2 倍以上，創造了有史以來最為驚人的股壇神話。其實，巴菲特發跡的祕密就在於：選擇好股票，然後長期擁有。


    由此可以看出，從某種意義上來講，股票投資的關鍵就在選擇股票上，在於會挑選好企業的股票。如果我們想選擇可以贏利的股票，首先要學會選擇有盈利的上市公司，然後持有其股票。


    巴菲特曾說過，優秀企業的標準：業務清晰易懂，業績持續優異，由能力非凡且為股東著想的管理層來經營的大公司。凡是遵循以上所說的標準去選股，就一定能夠找到好的股票。


    # 企業管理者的素質


    企業的競爭其實就是人才的競爭，企業的發展、管理水平十分重要，特別是在企業迅速發展的時期，企業規模的急劇擴張，需要有高素質的管理者和良好的管理制度來掌好企業發展的舵。管理者素質不夠，企業管理水平跟不上企業發展的需要時，企業經營很容易偏離發展的軌道而陷入泥潭。


    同樣條件下，同樣的企業，有一個優秀的管理團隊的企業可以使企業發展更快，利潤增長更多。優秀的管理者和管理團隊不僅讓企業眼前發展迅速，也會創造企業文化，提高企業的競爭力，並且從戰略高度為企業未'
  merge: -1
  img_proc: true
- pgno: 102
  md: '來發展指引方向。我們買股票，就是買上市公司的未來。一個優秀的管理團隊必帶出一個高成長性的上市公司。


    投資者可以從網路、報紙和一些財經週刊上瞭解上市公司的管理者的情況，定期參加一些企業的訪談節目，或者從電視等媒體收看企業老總訪談。從對他們的訪談中瞭解這個企業的經營、領導者的素質。有可能的話最好實地考察這個企業的人事制度、決策機構。


    # 企業產品週期和新產品情況


    瞭解一個企業的產品的銷售情況、研發支出和投入的比例，和同行業的銷售比較；新產品的開發程度和核心競爭力、日後產品的價格、這個產品的市場壟斷程度。


    還要關注行業的生存前景。因一項新的技術發明所推出的新產品可能成為現有產品的替代品，淘汰現有產品，進而使生產這類產品的行業或企業的生存受到威脅。例如，當市場引入CD
    機後，這一新的產品會使愈來愈多的人放棄使用答案機，而使答案機行業逐步衰蕭。又如，無線通訊技術的快速發展和行動電話的普及，使傳呼機生產和經營及無線傳呼行業日益萎縮。


    技術因素的另一面就是它能增強某一行業的競爭力和擴展發展空間。例如生物技術領域的一些成果在農作物育種方面的應用，就可以直接提高農作物的產量和加工的增值幅度，進而提高整個農業的產出效率。民用航空技術就可促進（旅客）運輸業的繁榮，進而帶動旅遊業收入的增加。


    # 企業的財務報表分析


    企業的財務報表是我們得到上市公司資訊的主要來源，很多股東投資者喜歡聽一些小道消息，或者專家推薦的股票，而不去自己研究上市公司'
  merge: -1
  img_proc: true
- pgno: 103
  md: '司。其實我們讀懂上市公司的財務報表，其中的利潤、資產、負債表是投資者決策的重要依據。我們看企業財務報表，其實只需要瞭解幾個關鍵的分析資料就可以了。


    上市公司的財務報表是公司的財務狀況、經營業績和發展趨勢的综合反映，是投資者瞭解公司、決定投資行為的最全面、最可靠的第一手資料。


    在對一個公司進行投資之前，首先要瞭解該公司的下列情況：公司所屬行業及其所處的位置、經營範圍、產品及市場前景；公司股本結構和流通股的數量；公司的經營狀況，尤其是每股的市盈率和淨資產；公司股票的優惠史及目前價格的橫向、縱向比較情況等。財務報表各項指標如下：


    # 盈利能力比率指標分析


    盈利能力比率主要衡量盈利能力對指標主要有：


    盈利能力是公司經營的主要目的，盈利能力比率是對投資者最重要的指標。


    資產報酬率：也叫投資收益率，表明公司資產總額中平均每百元所能獲得的純利潤，可以用以衡量投資資源所獲得的經營成效。原則上比率越大愈好。


    +   - 資產報酬率 = (稅後淨利 ÷ 平均資產總額) × 100%


    +   - 平均資產總額 = (期初資產總額 + 期末資產總額) ÷ 2


    +   - 股本報酬率：指公司稅後利潤與其股本的比率，表明公司股本總額中平均每百元股本所獲得的純利潤。


    +   - 股本報酬率 = (稅後淨利 ÷ 股本) × 100%


    +   - 公式中股本指公司股票面值計算的總金額，股本報酬率能夠體現公司股本盈利能力的大小。原則上數值愈大愈好。


    +   - 股東權益報酬率：又稱為淨值報酬率，指普通股投資者獲得的投資報酬率。


    +   - 股東權益報酬率 = (稅後淨利 - 優先股股息) ÷ (股東權益) × 100%'
