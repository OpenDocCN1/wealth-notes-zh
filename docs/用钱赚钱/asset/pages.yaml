- pgno: 90
  md: '# 第 9 招


    使用銀聯網路及時到信用卡跨行還款，免去利息費用。只要持有已開通跨行還款的人網機構的銀行卡，便可隨時在具有銀聯網路的 ATM 機進行自動操作，輕鬆完成銀行卡跨行轉帳，交易資金瞬間從一張銀行卡帳戶劃入另一張銀行卡帳戶，即時到帳，方便快捷。


