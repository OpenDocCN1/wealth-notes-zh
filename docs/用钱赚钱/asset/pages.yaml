- pgno: 26
  md: '# 理財愈早愈好


    生活告訴我們應該及早認識世俗。


    實際上，世俗就是現實，就是凡事都要從實際出發去思考問題。你應該及早認識到一份穩定且收入不菲的工作、一間屬於自己的房子、一輛自己的車等，這些才不是你追求安定幸福生活必備的基礎條件。


    認識世俗就是要你自己變得現實起來，充分認識錢在人生中的意義，與金錢交朋友。


    在日常生活當中，做好家庭收入預算能保證你的錢能夠得到合理使用，使家人滿意地分享這筆收入。預算不應限制你的行動，也不是讓你毫無目的地記錄開銷，它是讓你經過精心的計畫，幫助你物有所值，把錢花在刀刃上。比如你想置一個新家，繳孩子們上大學的費用、家人的養老保險金，想實現盼望已久的度假。合理的預算會讓你夢想成真，它會告訴你，怎樣節省不必要的花銷，以應付必要的大筆投資。


    如果你想成為家庭預算高手，就應該多看看那些生活類雜誌，那裡面有許多相關的經濟知識。它會告訴你，怎樣利用舊衣服，怎樣製作出物美價廉的點心；怎樣製作家具等。另外，附近的銀行開設了一種免費預言語詢服務，他們會根據你家庭的需要，告訴你如何做出符合自己實際情況的預算。預算計量是專門為你訂製的，對其他家庭並不適合。因為，你的財務問題就像你的身材和面孔一樣，是獨一家的。其他家庭的情況和你的情況是不一樣的。所以，這種預算的計量價值也就更高。


    下面的一些建議將幫助你更好地做家庭預算。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# 記錄每筆開支


    對支出的情形有個徹底的了解，這是十分有用的。因為我們必須知道

    自己踏在哪裡，否則，就不能改進自己的計畫。如果我們不知道困境

    出應該當減少，以及為何要減少開支，節約就是毫無意義的。所以，必

    須在某一時期（至少三個月）把所有的家庭開支都記錄下來。

    我們應該做的是：列出家裡一年的固定開銷，比如房租、生活費、

    水電費和保險金等，然後列出其他方面的必要開支，如：買衣服的用費、

    交通費、醫藥費、教育費、糧金等。一定要切實地根據家庭的需求進行預

    算。有時候，預算是要有嚴格的自制力的，誰都知道，這是一件很難做到

    的事，因為我們買不下所有的東西。但是，我們至少應該明白，有些東

    西是必需的，然後捨棄那些不是很需要的東西。你是否能為擁有一個溫馨

    的家而放棄購買昂貴的的衣服呢？你願意自己做衣服以省下錢來買一臺電視

    機嗎？很明顯地，是否要這樣做都需要你和你的家人來決定。


    # 每年儲蓄 10% 的收入


    理財專家建議我們，儘管物價持續上漲，但是，如果你能節省十分之

    一的收入，幾年之後，你就能過上比較寬鬆的經濟生活了。所以，把你自

    己的固定開銷的十分之一存起來，或者投資在別的地方，還可以想辦法儲

    存一筆用來買車子或房子的資金。


    # 準備一筆資金應急


    很多財務專家都開始警告年輕的家庭：至少要存下三個月的收入才能

    應付緊急突發的事件。但是，要一次存很多錢是不太容易的。如果一次存

    200元，然後幾個月以後再存錢，那樣根本就存不了多少錢；與其偶爾存'
  merge: -1
  img_proc: true
- pgno: 28
  md: '錢，倒不如每月固定存下50元或100元的效果來得明顯。


    # 經過家庭討論之後再進行預算


    理財專家認為，只有全家人支援的預算計畫才真正有效。由於每個人都對金錢持有不同的態度，還往往會受到教育程度、氣質和經驗的影響，所以，預算應該經過家人的集體討論才行，以消除每個人與他人在意見上的不同之處。


    # 壽險至關重要


    你知道人壽保險可以為你的家人提供哪些基本需要嗎？你知道變額和分期繳款有哪些不同之處嗎？它們都有什麼好處呢？你知道有哪些不同的付款方式嗎？你知道現代人壽保險有哪兩個意義嗎？這些和許多其他的問題對於你的家庭都十分重要，不光是你的配偶應該知道這些答案，你也應該知道這些答案。如果一位男生意外身亡，他的家庭可以得到人壽保險提供的最低生活保障；如果他还活著，人壽保險可以給他提供能頭餬養天年的特別資金。如果有一天，你的配偶不幸去世，你的難題就會由你所瞭解的人壽保險知識去幫助解決。'
