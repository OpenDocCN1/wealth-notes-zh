- pgno: 188
  md: '# 債券：家庭投資的首選


    債券投資的風險較小，收益穩定，具有較好的流動性，通常被視為無風險證券。特別是在投資風險日益加大的今天，投資債券有著非常重要的現實意義。


    債券是政府、金融機構、工商企業等機構直接向社會借債籌措資金時，向投資者發行，並且承諾按一定利率支付利息並按約定條件償還本金的債權憑證憑證。由於債券的利息通常是事先確定的，所以，債券又被稱為固定利息證券。


    與股票投資相比，債券投資具有風險低、收益穩定、利息免稅、回購方便等特點，使債券投資工具受到機構和個人投資者的喜愛。相應地，投資相對穩健的債券基金也成了投資者的投資首選。


    2007 年以來，股市的震盪給股民們上了一堂生動的風險教育課，不少人開始考慮將前期投到股市裡的資金分流出來，投入到更為安全的領域，於是國債銷售又重溫了久違的火爆場面。


    國債的收益率一般高於銀行存款，而且又有國家信用作擔保，可以說是零風險投資品項。如果是規避風險的穩健型投資者，購買國債是一個不錯的選擇。即使是債極型投資者，也應當考慮在理財籃子中適當配置類似產品。


    除了國債，企業債也是穩妥理財的優選品項。能在交易所交易的可轉債，一直是機構投資者所鍾愛的品項。個人如果想要投資，不妨考慮透過購買可轉債基金間接分享其中的收益，這樣可以讓專業機構代你分析和把握瞬息萬變的市場波動，又能坐享其成並穩健收穫回報。


    投資國債首先要對國債門類有所瞭解。現在，隨著社會經濟的發展，'
  merge: -1
  img_proc: true
- pgno: 189
  md: '債券融資方式日談豐富，範圍不斷擴展。為滿足不同的融資需要，並更好地吸引投資者，債券發行者在此券的形式上不斷創新，新的債券品項層出不窮。如今，債券已經發展成為一個龐大的「家族」。


    我們投資債券，首先必須深入瞭解債券，瞭解各種債券的類型、性質和特徵，然後才能根據自己投資的金額和目的正確地選擇債券。


    # ### 債券按是否有財產擔保，分為


    # ### 抵押債券和信用債券


    抵押債券是以企業財產作為擔保的債券，按抵押品的不同又可以分為一般抵押債券、不動產抵押債券、動產抵押債券和證券信用抵押債券。抵押債券可以分為封閉式和開放式兩種。封閉式債券發行額會受到限制，即不能超過其抵押資產的價值；開放式債券發行額則不受限制。抵押債券的價值取決於擔保資產的價值。抵押品的價值一般超過它所提供的債券價值的
    25%～35%。


    信用債券是不以任何公司財產作為擔保，完全憑信用發行的債券。其持有人只對公司的非抵押資產具有追索權，企業的盈利能力是這些債券投資人的主要擔保。因為信用債券沒有財產擔保，所以在債券契約中都要加入保護性條款，如不能將資產抵押其他債權人、不能兼併其他企業、未經債權人同意不能出售資產、不能發行其他長期債券等。


    # ### 債券按是否能轉換為公司股票，分為


    # ### 可轉換債券和不可轉換債券


    可轉換債券是在特定時期內可以按某一固定的比例轉換成普通股的債券。由於可轉換債券賦予債券持有人將來成為公司股東的權利，因此其利'
  merge: -1
  img_proc: true
- pgno: 190
  md: '# 債券按利率是否固定，分為


    # 固定利率債券和浮動利率債券


    固定利率債券是將利率印在票面上，並按其向債券持有人支付利息的債券。該利率不隨市場利率的變化而調整，因而固定利率債券可以較好地抗制通貨緊縮風險。


    浮動利率債券的息票率*是隨市場利率變動而調整的利率。因為浮動利率債券的利率同當前市場利率掛鉤，而當前市場利率又考慮到了通貨膨脹率的影響，所以浮動利率債券可以較好地抵禦通貨膨脹風險。


    # 債券按是否能夠提前償還，分為


    # 可贖回債券和不可贖回債券


    可贖回債券是指在債券到期前，發行人可以以事先約定的贖回價格收回的債券。公司發行可贖回債券主要是考慮到公司未來的投資機會和迴避利率風險等問題，以增加公司資本結構調整的靈活性。發行可贖回債券最關鍵的問題是贖回期限和贖回價格的制定。


    不可贖回債券是指不能在債券到期前收回的債券。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '# 債券按償還方式不同，分爲


    # 一次到期債券和分期到期債券


    一次到期債券是發行公司於債券到期日一次償還全部債券本金的債券，分期到期債券是指在債券發行的當時就規定有不同到期日的債券，即分批償還本金的債券。


    分期到期債券可以減輕發行公司集中還本的財務負擔。


    # 債券按是否可流通，分爲可流通債券和不可流通債券，或者上市債券或非上市債券等


    發行結束後可在深、滬證券交易所*，即二級市場上上市流通轉讓的債券為上市債券，包括上市國債、上市企業債券和上市可轉讓債券等。上市債券的流通性好，變現容易，適於需隨時變現的閒置資金的投資需要。


    # 債券按發行主體不同，分爲國債、金融債和企業債等


    國債也叫國券，是中央政府根據信用原則，以承擔還本付息責任為前提而籌借資金的債務憑證。金融債是由銀行和非銀行金融機構發行的債券，金融債券現在大多是由政策性銀行發行與承銷，如國家開發銀行，通常不是為個人投資的。企業債就是企業債券，是公司依照法定程式發行、約定在一定期限還本付息的有價證券，通常泛指企業發行的債券。


    +   * 息票率：印製在債券票面上的固定利率。

    * 深、滬證券交易所：同臺灣證券交易所 (TWSE)。'
