  md: '# 有了社保就不需要商業保險


    宋先生是一位典型的年輕白領，收入不錯，公司提供的福利也不錯，生活看起來很有保障了。他對朋友說：「我們單位已經給我交了『四險一金』，保障很全面的，我自己就不用再掏錢買商業保險了。」


    宋先生其實踏入了一個認識上的誤區。商業保險與各類國家強制性的社會保險功能是不一樣的，商業保險可以作為國家社保的一種補充保障，兩者之間不存在互相替代的作用。


    商業保險的保障範圍由投保人、被保險人與保險公司協商確定，不同的保險合約下，不同的險種、被保險人所受的保障範圍和水準是不同的；而社會保險的保障範圍一般由國家事先規定，風險保障範圍比較窄，保障的水準也較低。這是由它的社會保障性質所決定的。透過二者之間的比較可以發現，社保通常是保障一個人的最低生活水準和醫療保障需要


    保險的作用主要是保全其已擁有的財產。假如一次重病花掉你 10 萬元，就算你的助力沒有問題，但是如果你投保了重疾險，可能只需花費幾千元就可以解決這個問題了，這無疑就幫你解決了非常大的經濟問題。


    特別是一些純保障的險，如意外險和定期寿险等，都是「花小錢，辦大事」，每年幾百或是千元左右的保費投入，就能換來幾十萬元的保險額度。而且，現在不少儲蓄型的險種，都沒有保費豁免條款，也就是說，當投保人因意外傷害事故身故或全殘時，可以不再繼續交納保費，仍可享受保障。如含保險公司的少兒教育保險等，一旦投保的父母發生意外事故，無力繼續保費，但孩子的那份保險可以繼續有效；這就體現了保險獨一無二的保障作用，其他的教育儲蓄、基金投資都無法達到這樣一種功能。


    記住一點，相對儲蓄而言，保險能以較小的費用換取較大的保障，一旦保險事故發生時，保險可提供的保障，是遠遠超過你的保費投入的。'
