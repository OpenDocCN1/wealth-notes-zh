    # 上市


    若創業公司開辦五六年後，獲得成功，風險資本家就會幫助它「走向社會」，辦法是將它的股票賣為銷售。這時，風險資本家往往收起裝滿了賺錢回家，到另一個有風險的新創企業去投資。大多數風險資本家都希望
    5 年內能得到相當於初始投資的 10 倍收益。當然，這種希望並不總是能夠實現的。在新創辦的企業中，大約有 30% 至 30% 會夭折，60% 至 70% 會獲得一定程度的成功，只有
    5% 的新企業大發其財。'
