  md: '# 投資陷阱不可不防


    投資是通往財富殿堂的必經之路。在這條路上有數不清的寶藏，但也有令人防不勝防的一個又一個陷阱。這些陷阱隨時都有可能爆開血盆大口吞噬投資者的資本，使投資者血本無歸。


    2008 年底，那斯達克前主席伯納德．馬多夫因涉嫌設下投資騙局被捕，涉及款項高達 500 億美元，詐騙影響已經超出美國本土，波及世界主要銀行和對沖基金，英國皇家蘇格蘭銀行、滙豐控股等企業都成為其受害者。


    曾經有人開玩笑地說，如果以投資工具來比喻馬多夫，他也被視為是最安全的「國庫券」。現在，這個號稱「最安全」的人開遍了世界一個最大的玩笑，多國金融機構、富豪名流紛紛掉入馬多夫的陷阱。最慘的是那些血本無歸的個人投資者，他們中有些人把自己的全部積蓄或者養老的錢投了進去，現在卻損失殆盡，真是欲哭無淚。


    其實，馬多夫的投資詐騙手段並不高明，他採用的是「龐氏騙局」的手法，即用新投資者的錢支付老客戶的利息，只要投資源源不斷被吸引過來，詐騙倫敦就可以被發現。但是，由於金融危機的爆發，很多客戶大批支取現金，促使馬多夫的騙局最終曝光。


    馬多夫詐騙案給所有投資者敲響了警鐘——投資陷阱無處不在，投資必須慎之又慎。除了這種金融騙外，還有多種投資陷阱，需要投資者注意。例如，2007 年的「韋氏招商加盟集團」騙局，使全國有
    2 萬名投資者上當受騙，被騙資金總額高達 30 億元。韋氏招商加盟集團「總部」的規模並不大，旗下卻有十多個同時在全國招商的服裝品牌，其中一個品牌的省級獨家代理商，全國竟有
    300 多個……如此多的破綻，卻屢屢混淆'
