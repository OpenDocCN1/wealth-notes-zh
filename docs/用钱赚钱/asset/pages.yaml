- pgno: 45
  md: '# 制定自己的投資計畫


    在生活中，緣何有些有才華的人沒有取得人生的成功呢？這主要是因為他們做事缺乏計畫性，他們的投資行為都發生在一瞬間，或是一個似是而非的消息，或是心血來潮的衝動，幾十萬、上百萬的資金就在很短的時間內投入進去。沒有理由，更沒有計畫，對於投入後，市場將可能發生的變化沒有任何準備。如此的投資行爲本身在開始前就已經埋下了失敗的種子！


    投資市場是複雜多變的，充滿了風險。這就需要投資者進行必要的謀畫。有了投資計畫，我們才能有條不紊地實施自己的投資步驟，才不會方寸大亂，手足無措。要制訂自己的投資計畫，可以透過如下六個步驟來完成：


    # 對自己有一個清楚的瞭解，認清自己的實際情況


    # 資金因素


    投資者有一定數量、來源可靠而合法的資金，是制訂投資計畫的前提。


    # 對資金投資收益的依賴程度


    所謂依賴程度，也就是投資者承擔投資風險的能力。如果對投資收益的依賴很大，就應該選擇債券、績優股等安全可靠、有穩定收益的證券投資專案或者把握比較大的實業專案；如果對投資收益的依賴較小，則可以選擇收益可能較大，但風險程度也高的項目進行投資。'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# 時間信息因素


    投資者應該考慮能夠投放在某項投資上的時間和精力有多少，以及獲得資訊的管道、手段和時效等因素。如果條件都不充裕，就不應該選擇價格波動較大的短線投資*專案作為投資對象，而應以投資收益穩定的長線投資*專案為對象。


    # 心理因素


    在投資過程中，投資者的心理素質有時比資金的多寡更為重要。優柔寡斷、多愁善感性 格類型的投資者應該避免進行風險較大、起伏跌宕的短線投資項目。


    # 知識和經驗因素


    投資者的知識結構中對哪種投資方法更為瞭解和信賴，以及人生經驗中對哪種投資的操作更為擅長，都會對制訂投資計畫有幫助。相對來說，選擇自己熟悉瞭解的投資項目，充分利用自己已有的專業知識和成熟經驗，是投資穩定成功、安全獲益的有利因素。


    # 多元化投資方案


    投資的風險與收益並存，收益愈高往往風險也愈大。好的投資方案可以使投資者較大限度地提高收益、躲避風險。例如，在股票市場上，投資


    +   * 短線投資：股票交易的方法之一（另有中線、長線）。指的是籌汁到持有數天的投資，短線投資通常指買賣在1週以內發生、最遲1天以內沖，更長時間的，可能在1、2個月也稱為短線。當沖，就是在幾小時、幾分鐘、甚至幾秒鐘內完成買進和賣出，不持有部位過夜。


    +   * 長線投資：指的是長達15年以上的投資。是一種貸款或金融規範，可幫助你支付物業買價。'
  merge: -1
  img_proc: true
- pgno: 47
  md: '者很難準確預測出每一種股票價格的走勢。假設貿然把全部資金投入於一種股票，一旦判斷有誤，將造成較大損失。如果選擇不同公司、不同行業性質、不同地域、不同循環週期的股票，也會相應降低投資風險。


    # 設定合理的收益預期


    很多人沒有合理的收益預期，他們覺得「錢賺得愈多愈好」，這是非常錯誤的想法。其實，不管是投資房產、黃金等實物，還是股票、債券、基金等金融產品，或者是店鋪、工廠等實體，都不能抱著一夜暴富的心理，設定不合理的收益預期。因為不合理的收益預期往往會促使投資者做出不理智的決定，帶來巨大的風險。


    # 判斷大環境


    對大環境有一個清晰的判斷很重要，除非是頂尖的短線資本運作高手，絕大部分人還是靠把握趨勢來積累財富的。一個人必須要學會根據外界的環境來調整自己，這是一種原始的動物本能。對市場環境有一個大致的判斷，是制定投資計畫的關鍵步驟。


    # 堅定投資理念


    投資理念是指用什麼樣的原則和方法來指導投資。趨勢跟蹤、波段操作、價值挖掘等都是投資理念。選擇什麼樣的投資理念跟自己的能力與性格有很大關係，如果你對數字不敏感，技術分析能力很差，那就不要考慮波段操作。如果你缺乏足夠的耐心，價值挖掘就不適合你。投資理念的選擇也和市場環境有關：如股價普遍高估的情況下，價值挖掘會很難；長'
