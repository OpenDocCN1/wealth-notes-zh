  md: '# 選擇合適的貸款方式


    買房的人愈來愈多，選擇貸款買房的人也愈來愈多，不管是對於個人，還是對於很多家庭來說，貸款買房都是一筆較大的投資。因此，怎樣申貸還更經濟、更合理，如何選擇貸款年限、貸款金額以及還貸方式就顯得尤為重要。


    選擇合理的貸款之前要對自己的購房能力進行一次綜合評估，首先要看自己是否有不低於所購房價30%的首期付款，幾乎所有的房產商都有這個硬性要求；其次要評估自己每月償還住房貸款所能承受的能力，即每月家庭收入及其他變現強的金融資產，以及每月必需支出與備用資金的差額，是否大於住房貸款每月所需償還的貸款本息。這點可以參考一些銀行設計的「家庭月收入與個人住房商業性貸款對照參考表」，讓你心中有數。


    對自己的綜合購房能力進行評估以後，就可根據自己的能力選擇適合自己的房貸。目前的貸款品種主要有「個人住房公積金貸款」、「個人住房商業性貸款」、「個人住房裝修貸款」三大類。貸款利率「個人住房公積金貸款」利率最優惠，1年至5年期年利率為4.14%，6年至30年期4.59%；「個人住房商業性貸款」利率次之，1年至5年期5.31%，6年至30年期5.58%；「個人住房裝修貸款」利率最高，1年期5.85%，2年至3年期5.94%，4年至5年期6.03%。


    從資料顯示可以看出，貸款年限愈長，每月供款就愈少，所要還的貸款利息也就愈多。一般的貸款年限都在20年以下，銀行很少批出長達30年的供樓貸款。貸款條件中有一條不成文的規定，就是貸款者的當前年齡加上所申请的貸款年限不能超過60歲。大多數購房者平均年齡普通都在'
  merge: -1
  img_proc: true
- pgno: 317
  md: '年的貸款。


    選擇了適合自己的貸款方式以後，還要根據自身情況靈活地選擇還款方式。不少人認為，供樓期間前幾年所還的款項只是利息，等利息全部清還後的供款才是所借的本金。事實並非如此，銀行推行的還貸方式主要有兩種：第一種是等額本息還款，它的最大特點是消費者每月供款金額都是一樣的，這種月供款中包含本金和利息，但每個月本金和利息所佔的比例卻不一樣，利息所佔的部分是根據當月的供款餘額所計算出來的。如果有一筆較大的資金可以提前還款，則月供款將根據新的供款餘額重新計算。購房者也可以根據自己的經濟實力到銀行縮短還貸年限，例如從
    20 年修改為 10 年，從修改的那個月開始，月供款會按照供款餘額和新的還貸年限重新計算。


    還有一種還款方式是等額本金還款：這種方式每月的供款中所佔的本金是一樣的，月利息也是按當月供款餘額計算，不同的是是每月月供款額選擇等額本息還款還是等額本金還款要根據預計還款時間而定，因為其中的利息是不一樣的。例如貸款期限為
    20 年，貸款額為 30 萬，以等額本息的還款方式，月均還款約為 2297 元，20 年共需還款約 55 萬元，利息約 25 萬元；如果選擇等額本金的還款方式，貸款期限
    20 年，首月還款額約為 2960 元，20 年共需還款約為 50 萬元，其中利息約 20 萬元。而對於一筆金額相同的貸款，縮短貸款年限或選擇合適的還款方式都可以達到減少利息的目的。


    總而言之，買房的時候能用公積金貸款就一定要用公積金，然後結合自己的情況選擇還貸方式。在選擇貸款方式的時候，購房者一定要考慮以下幾個問題：


    +   銀行貸款利率執行的是一年調整一次的政策，如果預期存貸款利率上調，應該提早辦理貸款，從而貸款利率相應較低。


    +   購房者首先應考慮自籌資金，不足部分辦理公積金與商業性貸款的'
