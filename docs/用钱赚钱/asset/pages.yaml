  md: '解的。可是如果收入已經漸趨穩定，依然保持著零儲蓄的生活，你就該好好反省一下自己的生活的。


    對於致富而言，重要的不是你賺了多少钱，而是你實際上手存了多少錢。縱觀那些成功人士，他們幾乎部有一個習慣，即從薪水中拿出一部分用於長期投資。有很多種儲蓄和投資的方法可供人們選擇，儲蓄額將隨著本金和利息的增長而不斷增長。這樣，在退休的時候你就能夠實現所有經濟方面的目標了。


    那麼，對於一個普通的人來說，該如何建立合理的儲蓄規劃呢？


    # 改變儲蓄習慣


    可以從一個基礎的算式開始，很多人的儲蓄習慣是：收入－支出＝儲蓄。可是由於支出的隨意性，往往會導致儲蓄結果與預期背道而馳。對於這些人而言，應當把算式換作：支出＝收入－儲蓄，用強迫儲蓄的方式，將一部分的資金先存儲起來，為將來的投資準備好糧草。


    花錢很痛快，而存錢有時卻是很痛苦的。以下是幾種有效的強迫自己存錢的方法，可以幫助個人改變愛花錢的小毛病：


    # 寫出你的目標


    是想換一所大點兒的房子？買車？為了孩子的教育費用？或去投資？總之，把目標寫下來，然後貼在水箱上、廚房門上、餐桌上等你會經常看到的地方，提醒你時常想起你的目標，增加你存錢的動力。


    # 強迫自己存定期儲蓄


    活期儲蓄尤其是存在借记卡*內的錢不經意間就會花掉，因而不如


    > ＊借记卡：又稱為簽帳金融卡，或是Visa金融卡，除了可以提款之外也有刷卡消費的功能，在歐、美等國家普遍使用。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '把自己手中富餘的現金存成定期，只留夠基本生活需要的現金就可以。


    # 盡早還清你的銀行貸款，盡早投資


    當然如果投資收益能高過貸款利息就另當別論了。總之，選擇一種或幾種適合你的投資方式是很重要的。


    # 核查信用卡的對帳單，看看你每月用信用卡支付了多少钱


    如果有可能是，減少你每月從信用卡中支取的金额，或者不到萬不得已不用信用卡。


    # 定期工資存款


    定期從你的工資帳戶（或錢包）中取出 100 元、200 元或是 500 元存入你新開立的存款帳戶中。3 個月之後，增加每次取出額。


    # 選擇儲蓄的方式也很重要


    相比超活期存款的易支取性來說，開放式基金、投連險這些可以定期定額投資的工具更適合作爲儲蓄的工具。一是這些工具可以幫助你及早進行投資，二是收取相對麻煩些，這倒是有可能阻礙你提前支取存款的隨意性。


    日本有這樣一句諺語：「積累財富就像用大頭針挖沙子，而財富流失就像將水灑在沙子上。」由此可見，財富的流失是一件最容易不過的事情了。可見，學會儲蓄，並制定合理的儲蓄規劃才是財富積累的良好開端，每一個人都應該養成良好的儲蓄習慣。'
