- pgno: 8
  md: '這是一問題，不是嗎？那麼，你會如何回答呢？是買房還是買股票？創業還是做點別的事？當然，首先要明確一點，那就是之所以提出這個命題，絕非是為單純的調侃，也並非是望梅止渴、畫餅充飢的百無聊賴，而是透過分析不同人對這筆錢的處理方式，就可以瞭解一個人的理財觀唸。在此，我們可以從幾個具有代表性的答案中看出一些門道來：


    # 生活型：先買房，再買車


    上海王小姐，今年28歲，她是一位房地產公司的經紀人，年收入可達6萬元。雖然收入不算大低，可是王小姐是一個人不難出的「月光族」。主要是由於平時喜歡購物以及工作应酬較多，所以工作兩年，幾乎沒有存下什麼錢。


    王小姐的「百萬計畫」如下：先将45萬元用於房子的首付，然後用10萬元左右購車，再拿10萬元給父母，讓他們去旅遊或運用在其它地方，好好孝順一番。她還給自己留了5萬元，準備出國旅遊一次。剩下的30萬元用於投資一買股票或買基金。


    理財專家認為王小姐的百萬計畫具有一定的理財意義，而且考慮到王小姐還很年輕的情況，可以適當參與高風險的投資，因此股票與基金應該


    * 本書未標註的幣別，皆為人民幣。


    # 給你 100 萬*，你會怎麼花？'
