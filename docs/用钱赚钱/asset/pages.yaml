  md: '204


    # 如何避免債券風險


    目前，股票市場震盪，權衡風險和收益的平衡，讓很多投資者都把目光投向了相對穩定的債券。可是債券作為一種理財產品，它同樣是有風險的，只是相對小一些而已。因此，正確評估債券投資風險，明確未來可能遭受的損失，是投資者在投資決策之前必須要做好的工作。具體來說，投資債券存在以下幾方面的風險：


    # 購買力風險


    是指由於通貨膨脹而使貨幣購買力下降的風險。通貨膨脹期間，投資者實際利率應該是票面利率扣除通貨膨脹率。


    # 利率風險


    利率是影響債券價格的重要因素之一，當利率提高時，債券的價格就降低，此時便存在風險。


    # 經營風險


    經營風險是指發行債券的單位管理與決策人員在其經營管理過程中發生失誤，導致資產減少而使債券投資者遭受損失。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 變現能力風險


    是指投資者在短期內無法以合理的價格賣掉債券的風險。


    # 再投資風險


    購買短期債券，而沒有購買長期債券，會有再投資風險。例如，長期債券利率為14%，短期債券利率13%，為減少利率風險而購買短期債券。但在短期債券到期收回現金時，如果利率降低到10%，就不容易找到高於10%的投資機會，還不如當初投資於長期債券，仍可以獲得14%的收益，歸根到底，再投資風險還是一個利率風險問題。


    # 違約風險


    發行債券的公司不能按時支付債券利息或償還本金，而給債券投資者帶來的損失。


    因此，債券投資存在的這些風險，會直接影響到我們的收益，為了能很好地增加收益，避免風險，上班族應該做到以下幾點：


    # 記帳式國債求收益


    首先對銀行存款和國債的收益率做個比較：目前商業銀行的儲蓄利率5年期的為3.6%，扣除15%的利息稅，實際為3.06%，同期限的記帳式國債收益率為4.16%，2009年發行的第六期漲點式國債5年期利率為4%，記帳式國債收益率的優勢相當明顯。即使未來升息，存款利率也要加不小的幅度才可以趕上目前記帳式國債收益率的水準，這還不包括由於加息，記帳式國債收益率也會相應上浮的部分。未來幾年加息大幅度增長'
  merge: -1
  img_proc: true
- pgno: 206
  md: '的機會很小，所以比較之下，記帳式國債即使持有到期也是一個很好的投資品項，而且記帳式國債可以在交易所交易，投資者可以利用其價格的波動獲利，所以對於收益的要求較高的投資者，投資記帳式國債比較合適。


    # 中短期券回避風險


    儘管目前長期債券的收益率高於中短期債券，但如果自己不能持有長期債券到期，那這種對於未來利率走高的補償也就不能享受了，所以對於風險承受能力小的投資者，目前長期債券基本沒有投資價值。


    相對來說，短期債券由於存續期短，受以後加息的不確定因素的影響比較小，而且期限短，資金占用時間不長，再投資風險比較小。中期債券品項中，目前7年期國債與10年期、15年期國債的利率水準已經基本接近，但由於期限短，因此風險也相對較小，而且對於同期限的國債來說，當收益率變動相同幅度的時候，票面利率愈高，價格波動愈小。可以適當選擇期限在7年期左右的票面利率比較高的券種。


    # 浮息債券也獲利


    顧名思義，浮息債券就是票面利率是浮動的。目前交易所的兩支浮息債券都是以銀行1年定期存款的利率作爲基準利率再加上一個利差作爲要面利率，而一旦銀行1年期存款利率提高，浮息債券的票面利率就會在下一個起息日起相應地提高，這在一定的程度上減少了加息帶來的風險。在加息的週期中，這類品項應該值得關注。市場上出現升息預期的初期，浮息債券漲勢比較好，但是一旦加息成爲事實，浮息債券並不比固息債券有優勢。投資者在投資浮息債券的時候，一定要注意時點的把握，特別要密切注意國家的宏觀經濟形勢。'
  merge: -1
  img_proc: true
- pgno: 207
  md: '# 可轉債機會多


    對於習慣炒股，能承受股票市場的超大跌的投資者，在目前股票市場持續低迷的情況下，可轉債將是很好的替代品項。可轉債的價格由純債券價值和轉換期權價值組成，具有「進可攻，退可守」的特點。在大盤不好的時候，可轉債由於有其債券價值作爲支撐，跌幅小於對應的股票；而一旦對應股票上漲，可轉債的價值也會跟著上漲。目前很多可轉債的票面利率是浮動的，即使加息也不會對其債券價值有很大的影響。


    總之，債券投資是一種風險投資，那麼，投資者在進行投資時，必須對各類風險有比較全面的認識，並對其加以測算和衡量，同時，採取多種方式規避風險，力求在一定的風險水準下使投資收益最大化。'
