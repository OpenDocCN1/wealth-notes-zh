- pgno: 182
  md: '# ## 理賠基本要素


    # ### 理賠種類


    理賠分為兩種，賠償和給付。賠償與財產保險相對應，而由於人壽保險是以人的生命或身體作為保險標的的，生命和身體是無法用金錢衡量的，故在出險時，保險公司只能在保單約定的額度內對受益人或被保險人給付保險金。


    # ### 理賠程式


    立案檢險——審查單證、審核責任——核損覈算——損失處理——保險公司支付賠款——保險公司行使代位求償權利。


    # ### 理賠時效


    保險索賠必須在索賠時效內提出，超過時效，被保險人或受益人不向保險公司提出索賠，不提供必要單證和不領取保險金，視為放棄權利。保險不同，時效也不同，人壽保險的索賠時效一般為
    5 年，其他保險的索賠時效一般為 2 年。索賠時效應從被保險人或受益人知道事故發生之日起，事故發生後，投保人、被保險人、受益人應當先止險報案，然後提出索賠請求。


    # ### 理賠原則


    重合約，守信用；堅持實事求是：主動、迅速、準確、合理。


    # ### 理賠申請


    索賠時應提供的單證主要包括：保險單或保險憑證的正本、已繳納保險費的憑證、有關能證明保險標的或當事人身分的原始文本、索賠清單、出險檢驗證明、其他根據保險合約規定應當提供的文件。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 糾紛處理


    保險合約在履行過程中，雙方當事人因保險責任歸屬、賠償金額的多少發生爭議，應採用適當方式，公平合理地處理。按照慣例，對保險業務中發生的爭議，可採用協商和解、仲裁和司法訴訟三種方式來處理。


    協商和解一般有自行和解和第三者主持和解決兩種方法。仲裁是由合約雙方當事人在爭議發生之前或之後達成書面協議，願意把他們之間的爭議交給雙方都同意的第三者進行裁決，仲裁員以裁決者的身分而不是以調解員的身分對雙方爭議做出裁決。


    # 如何應對理賠難


    事實上，保險公司在進行理賠事宜時，以下四點主要成為糾紛的熱點問題：隱瞞病史、退保縮水、無效簽名及定損分歧。


    # 隱瞞病史


    病史糾紛在保險理赔糾紛中較為常見。隱瞞病史主要在兩種情況下發生：一、代理人誤導；二、被保險人主觀隱瞞。保險公司指出，對於第一種情況，保險公司一般要承擔全部責任。不過，在如何界定代理人「誤導」上，一直存在舉證困難。而對於第二種情況，保險公司則可明確拒絕。不是所有患過病的人都不能投保，消費者如實告知病史後，可以以亞健康的標準投保，保險公司一般會酌情提高保費或者降低保額，或詳細注明哪些情況發生後不屬於保險公司賠付的範圍。買保險一定要覆看好免責條款，並不能聽保險人一面之詞。


    * 亞健康：人體處於健康與疾病之間的過渡期。


