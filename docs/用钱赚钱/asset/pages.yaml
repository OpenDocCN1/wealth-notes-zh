- pgno: 80
  md: '# 儲蓄也要講方法


    有人說：儲蓄，不就是在銀行存錢嗎？還有技巧可言嗎？是的，往銀行存錢真的很簡單，但是，不知道你是否計算過沒有，請如每個月的工資，零存整取與活期儲蓄，一年下來利息相差
    2.375 倍。而且，現在的儲蓄品項門類繁多，有活期儲蓄、整存整取、零存整取、整存零取、存本取息、活兩便和通知存款等。那麼，如何利用好不同的儲蓄方法，從而得到更多的儲蓄「實惠」呢？


    # 金字塔儲蓄法


    如果你持有 1 萬元，可以分別存成 4 張定期存單，存單的金額呈金字塔狀，以適應急需時不同的數額。可以將 1 萬元分別存成 1000 元、2000 元、3000
    元、4000 元 4 張 1 年期定期存單。這樣可以在急需用錢時，根據實際需用金額領取相應額度的存單，可避免需取小數額卻不得不動用大存單的弊端，以減少不必要的利息損失。


    # 12 張存單法


    12 張存單法又稱月月儲蓄法，即每月存入一定的錢款，所有存單年期限相同，但到期日期分別相差一個月。這種方法，不僅能夠很好地聚集資金，又能最大程度地發揮儲蓄的靈活性，即便急需用錢，也不會有太大的利息損失。這種方法非常適合忙碌而無時間顧及理財的受薪階級，月月發，月月存。但在儲蓄的過程中，一定要注意：當利率上行情時，存款期限'
  merge: -1
  img_proc: true
- pgno: 81
  md: '愈短愈好；而當利率下行時，存款期限愈長愈好。


    每月定期存款單期限可以設為一年，每月都還做，一年下來你就會有 12 張一年期的定期存款單。當從第二年 起，每個月都會有一張存單到期，如果有急用，就可以使用，也不會損失存款利息；當然如果沒有急用的話這些存單可以自動續存，而且從第二年
    起可以把每 月要存的钱添加到當月到期的這張存單中，繼續滾動存款，每到一個月就當 月要存的钱加入到當月到期的存款單中，重新做一張存款單。


    當然，如果你有更好的耐性的話，還可以嘗試「24 存單法」、「36 存單法」，原理與「12 存單法」完全相同，不過每張存單的週期變成了兩（三）年。當然這樣做的好處是，你能得到每張存單兩（三）年定期的存款利率，這樣可以獲得較多的利息，但
    也可能在沒完成一個存款週期時出現資金周轉困難，這需要根據自己的資金狀況調整。


    # 階梯儲蓄法


    每次加息都會引起銀行儲戶儲存行儲戶存款的波瀾，但是這種臨時轉存不一定划算，那麼用什麼方法能避免這種儲存利率的調整呢？階梯存儲法能使年度的儲蓄到期額保持等量平衡，既能應對儲蓄利率的調整，又可獲取定期存款的高利率。這種方法比較適合與
    12 存單法配合使用，尤其適合年終獎金或其他項目大筆收入。


    階梯儲蓄是將儲蓄的資金分成若干份，分別存在不同的帳戶裡，或在同一帳戶裡，設定不同存期的儲蓄方法，而且存款期限最好是逐年遞增的。


    階梯儲蓄有個好處就是可以跟 上利率調整，是一種中長期儲蓄的方式。而且萬一中途出現急需 用錢的情況，也可以只動用一個帳戶，避免提前支取帶來的利息損失。'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# 利滾利儲蓄法


    要使存款息息定期儲蓄生息效果最好，就得與零存整取儲蓄結合使用，產生「利滾利」的效果，這就是利滾利儲蓄法，又稱「躍存儲蓄法」。這是存本取息儲蓄和零存整取儲蓄有機結合的一種儲蓄方法。利滾利儲蓄法先將固定的資金以存本取息形式定期下來，然後將每月的利息以零存整取的形式儲蓄起來，這樣就獲得了二次利息。


    雖然這種方法能獲得比較高的存款利息，但很多人以前不大願意採用，因為這要求大家經常跑銀行。不過現在很多銀行都有「自動轉息」業務，市民可與銀行約定「自動轉息」業務，免除每月跑銀行存款的麻煩。這種「躍存」的儲蓄方法，讓家庭的一筆錢取得了兩份利息，只要長期堅持，便會帶來豐厚回報。對雙薪家庭為未來生活積累資金和生活保障有著相當的優越性。


    # 儲蓄約定自動轉存


    現在銀行基本都有自動轉存服務。在儲蓄時，應與銀行的約定進行自動轉存。這樣做一方面是避免了存款到期後不及時轉存，逾期部分按活期計息的損失；另一方面是存款到期後不久，如遇利率下調，未約定自動轉存的，再存時就要按下調後利率計息，而自動轉存的，就能按下調前較高的利息計息。如到期後遇利率上調，也可取出後再存。


    活期和定期利率相差較大的情況下，利用好儲蓄的技巧是很重要的。對投資風險承受能力較弱的人群來說，提高「零風險儲蓄」的回報率不失為開源的一種簡便方法。'
  merge: -1
  img_proc: true
- pgno: 83
  md: '# 定期存款提前支取的選擇


    如果儲戶的定期存款尚未到期，但急需用款，一般情況下，如果沒有其他資金來源，儲戶有兩種選擇，即提前支取定期存款或以定期存單向銀行申請質押貸款。


    按照中國人民銀行的規定，定期存款提前支取時，將按照支取日的活期存款利率計算，這樣，儲戶要承受一定的利息損失。如果這種損失超過了向銀行做質押借款的利息支出，儲戶可以用定期存單作質押品，向銀行申請短期質押貸款。否則宜提前支取。


    # 巧用通知存款


    通知存款低適合手頭有大筆資金準備用於近期（3個月以內）開支的。假如你有10萬元現金，擬於近期首付住房貸款，存款打算行情時投入股市，這時就可以存7天通知存款。


    如果投資者購買的是7天通知存款，若投資者在向銀行發出支取通知後，未滿7天即前往支取，則支取金額的利息按照活期存款利率計算。此外，辦理通知手續後通期支取的，支取部分也要按活期存款利率計息；支取金額不足或超過約定金額的，不足或超過部分按活期存款利率計息；支取金額不足最低支取金額的，按活期存款利率計息；辦理通知手續而不支取或在通知期限內取消通知的，通知期限內不計息。關鍵是存款的支取時間、方式和金額都要與事先的約定一致，才能保證預期利息不會遭到損失。


    總之，儲蓄是一種最普通和最常用的理財工具，幾乎每個家庭都在使用，我們要利用儲蓄的方法獲得較高的收益。不同的家庭財務狀況各不相同，選擇儲蓄的方式也不盡相同，但只要根據自己家庭的實際需求，進行合理配置，儲蓄也能為你的家庭收穫一份財富。當然，錢必定是用來花'
  merge: -1
  img_proc: true
- pgno: 84
  md: 的，所以應根據每個家庭收入和消費結構等安排一定的存款比例。對於一般人而言，存款的原則是：以定期爲主，通知存款爲輔，少量的活期儲蓄和定活兩便。
