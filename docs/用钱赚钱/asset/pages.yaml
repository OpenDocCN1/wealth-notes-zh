  md: '中行、建行和工行都已推出「紙黃金」業務。紙黃金是僅透過賬面記錄黃金買賣狀況的一種買賣方式，就像炒股一樣。本幣金用「人民幣／克」標價，以人民幣資金投資。中行和工行還推出有「外幣金」，以「美元／盎司」標價，投資者只能用美元購買。


    交易紙黃金也無需向銀行交管理費用，更適合普通投資者。紙黃金的交易門檻是 10 克，投資者可先用兩千元試試。


    買賣紙黃金只需到銀行櫃檯開立活期賬戶，並開通電話銀行和網上的銀行，存入資金，低買高賣賺取價差。開戶成本是辦理銀行卡的成本費 5 元。紙黃金的交易管道包括櫃檯交易、自助銀行交易、電話銀行交易和網上銀行交易四種。


    與股票不同的是，紙黃金一天之內可交易多次（T＋0 交易），賣出即可提現。興業銀行一天內可交易多次，實行 T＋0 交易，T＋1 清償。


    此外，中國紙黃金的交易時段是週一 7：30 至週六凌晨 4：00（其中每天 4：00 至 7：30，交易系統關閉）。興業銀行個人實物黃金的交易時間較少，為每週一到週五的上午
    10：00 至 11：30，下午 1：30 至 3：30，同時，週一至週四增加晚上 9：00 至凌晨 2：30 的交易時間。


    紙黃金的手續費體現在買賣差價上，比如單邊手續費是 0.5 元／克，金價是 190 元／克，投資 10 克需要 1900 元，但是如果當場賣掉，只能按 189
    元買，被減掉約 1 元就是手續費，銀行不再收別的費用。


    雖然手續費不高，但如果投資者還習慣於投資股票的快速進出的方式，想透過頻繁操作來賺取買賣價差是不可取的，投資黃金應者取於資產的穩定性和保值、增值功能。


