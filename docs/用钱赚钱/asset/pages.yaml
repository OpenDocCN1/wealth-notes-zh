- pgno: 148
  md: '# 投資基金不可忽視風險


    現在，投資者選取基金的比重愈來愈多，但有些投資者對基金產品的風險和收益沒有一個正確的認識，認為投資基金會穩賺不賠。對此，理財專家提醒投資者不可對基金抱有不切實際的期望，更不可把基金當作無風險投資。投資者應當清楚，只賺不賠那只是人們期望中的神話而已，現實的存在則絕對是有賠有賺。基金作為投資的一種方式，必然也是存在風險的。


    歷史告訴我們，沒有只漲不跌的股票市場，也沒有只賺不賠的金融產品。認識到基金的風險，投資者就要採取必要的措施以減少風險。因此，投資者應根據基金的風險大小以及投資者自身的風險承受能力不同，把基金的業績和風險與投資者的風險收益偏好特徵相匹配。賺取了基金投資的風險，就要想方設法防範這種風險，避免給自己造成投資的損失。


    對於投資者來說，可以運用下面的幾種方法來規避基金投資的風險。


    # 進行試探性投資


    「投石問路」是投資者降低投資風險的好辦法。新上市的投資者在基金投資中，常常把握不住最適當的買進時機。如果在沒有太大的獲利把握時將全部資金都投入基市，就有可能遭受嚴重損失。如果投資者先將少量資金作為購買基金的投資試探，以此作為是否大量購買的依據，可以減少基金買進中的盲目性和失誤率，從而減少投資者買進基金後被套牢的風險。


    對於很多沒有基金投資經歷的人來說，不妨採取「試探性投資」的方'
  merge: -1
  img_proc: true
- pgno: 149
  md: '法，可以從小額單筆投資基金或每月幾百元定期定額投資基金開始。那麼，投資者如何進行試探性的投資呢？


    +   • 根據風險接受程度選擇。如較積極或風險承受力較高，以偏股型為佳，反之則以混合型為好。

    • 選擇 2 至 3 家基金管理公司的 3 至 5 檔基金，以分散投資風險。

    • 選出好公司中表現優秀的基金。如果過去 3 個至 12 個月的基金業績表現比指數好，應該不會太差。但不論資金多寡，同時追蹤的基金不應超過 5 支，否則就不易深入瞭解每檔基金。何況基金本身持股就很分散，已在很大程度上降低了風險。

    • 買基金後還需要堅持做功課，關注基金的漲跌，並與指數變動做比較，由此提高對基金業績的研判能力。此外還可登錄基金公司網站，蒐集基金持股資料及基金經理的觀點，提升對基金業的認識，幾個月後你對投資基金就會有一定的瞭解。


    # # 進行分散投資


    投資者宜進行基金的組合投資。開放式基金組合投資的好處首先在於可以分散市場風險，避免因單檔基金選擇不當而造成較大的投資損失。其在於可以較好地控制流動性風險，即開放式基金的贖回風險，如果投資過分集中於某一支開放式基金，就有可能在需要贖回時因為流動性問題無法及時變現。一般來說，大規模的機構投資者適宜投資的基金數量應在
    10 支左右。資金規模較小的個人投資者適宜投資的基金數量應在 2 支到 3 支。如果數量太多則會增加投資成本，降低預期收益。而太少則無法分散風險，贖回變現時則會遇到困難。


    # # 分散投資標的，建立投資組合


    降低風險最有效同時也是最廣泛地被採用的方法，就是分散投資，即'
  merge: -1
  img_proc: true
- pgno: 150
  md: '馬克·吐溫所說的：「不要將所有的雞蛋放在同一個籃子裡。」這種方法之所以具有降低風險的效果，是由於各投資標的間具有不會齊漲齊跌的特性，即使齊漲共跌，其幅度也不會相同。所以，當幾種投資組成一個投資組合時，其組合的投資報酬是個別投資的加權平均，其中漲跌的作用會相互抵消，從而降低風險。


    如果投資者對大部分的基金投資技巧都不是很精通，同時對大多數基金都不是十分熟悉，分散投資將是一個不錯的選擇。只要投資者能長期持有，靠平均報酬便是以獲得豐厚的回報。


    # 選擇分散投資時機


    分散投資時機也是降低投資風險的好方法。在時機的選擇上，通常採用的方法是：預期市場反轉走強或基金基本面向轉好時，進行申購；預期市場持續轉好或基金基本面改善時，進一步增持；預期市場維持現狀或基金基本面維持現狀，可繼續持有；預期市場持續下跌或基金基本面惡化時進行減持；預期市場大幅下跌或基金基本面持續惡化時贖回。


    # 長期持有


    基金是長期理財的有效工具。長期持有也可以降低基金投資的風險，因為市場的大勢是走高的。有位證券分析師說：「根據統計，股市有 55% 的日子是上漲的，有 45%
    的日子是下跌的。糟糕的是，我們不知道哪些天會上漲。」


    因此，若你不知道明天是漲還是跌，最聰明的辦法就是猜明天會漲；因為猜的次數越多，猜對的機率就愈高。既然每天都猜股市會漲，那最佳的投資策略就是：有錢就買，買了就不要賣。這種辦法看起來非常笨，卻是最管用的投資方法。


    有人透過對股市的長期跟踪發現，過去投資股市，以持有一個完全分'
  merge: -1
  img_proc: true
- pgno: 151
  md: '散風險的投資組合而言，持有時間愈長，發生損失的機率就越小：持有一年下跌的可能性是 45%，持有一個月下下跌的可能性是 40%，持有一年下跌的可能性是
    34%。持有 5 年下跌的可能性已降為 1%，若持有 10 年以上，則完全沒有發生損失的可能性。因此，長期持有是降低選贖售出時機之風險的重要手段。


    # 基金定期定額，平攤成本


    基金定期定額也是降低投資風險的有效方法。目前，很多基金都開通了基金定期定額業務。投資者只需選擇一種基金，向代銷該基金的銀行或券商提出申請，選擇設定每月投資金額和扣款時間以及投資期限，辦完有關手續後就可以坐等基金公司自動劃帳。目前，好多基金都可以透過網上銀行和基金公司的網上直銷系統設置基金定期定額，投資者若是足不出户，輕點滑鼠，就可以完成所有操作。


    基金定期定額的最主要優點是起點低，成本平攤，風險降低。不少基金一次性申購的起點金額為 5000 元，如果做基金定期定額，每月只需幾百元。工行的基金定期定額業務的每月最低申購額僅為
    200 元，投資金額差為 100 元。招行的最低門檻也只有 500 元。


    此外，基金定期定額不必籌借大筆資金，每月運用生活必要支出外的閒置金錢來投資即可，不會造成經濟上額外的負擔，長期堅持會積少成多使小錢變大錢，以應對未來對大額資金的需求。而且長期的獲利將遠超過存利息所得。並且投資期間愈長，相應的風險就越低。


    這種「每個月扣款買基金」的方式也兼具強迫儲蓄的功能，比起自己投資股票或整筆購買基金的投資方式，更能讓花錢如流水的人在不知不覺中每月存下一筆固定的資金。讓你在三五年之後，發現自己竟然還有一筆不小的「外快」。


    需要注意的是，投資者必須要指定一個資金帳戶作為每月固定扣款帳號'
  merge: -1
