  md: '低。對於已成家庭的，建議保險支出約占家庭收入 10% 左右，可考慮購買養老保險、重大疾病險以及意外傷害險等。


    薛燕，環衛工人，今年 43 歲，她的丈夫是一家國有企業的技能人員，還有一個 7 歲的女兒在讀高中。夫妻二人月收入近 4000 元，家裡每個月日常基本生活開支大約
    1500 元，其中孩子住校每月吃住要花 500 元。每月銀行貸款 2000 元，其他方面花費大約 300、400 元。


    4 年前薛燕愛人單位搞房改，分期付款買了一間一室一廳住房，房款總共 7 萬元，分 5 年付清，首期付款 2 萬元後，每年大約要 1 萬多一點，今年是最後一年了。薛燕打算等房子錢付清以後，正好孩子面臨高考和上大學，就要在孩子身上多準備一些錢了。因為愛人對股票知識有一點瞭解，今後條件允許的話，她也想炒炒股票。但是目前這一兩年還不行，一是沒有錢，二是要照顧孩子準備高考，沒有時間盯著股票。


    薛燕一家平時生活也是極為節儉，日用品、蔬菜、水果和肉類一般到自由市場購買，在那裡可以做到物美價廉。全家人的衣服基本都在打折和優惠時才買，那時可以便宜一些。她想等明年付清了房錢，生活就會寬裕一些了。


    理財專家認為，就薛燕目前的生活狀況而言是有一定的緊張、應該合理安排現有的收入。比如，給小孩買衣服不一定要父母親爲其代辦，可以定期給小孩適度的零花錢，讓其自行安排，這樣既可以使衣服符合小孩的心意，又可以使小孩子從小就形成良好的用錢習慣，知道量入爲出。對於投資於股票，同樣也是可以投資於藍籌股，進行長線投資，不用花太多的精力。'
