  md: '可以立即轉換為現金來偿付流動負債的流動資產，所以這個數字比流動比率更能夠表明公司的短期負債付能力。


    流動資產構成比率=（每一項流動資產額）÷（流動資產總額）


    流動資產由多部分組成，只有變現能力強的流動資產占有較大比例時企業的債能力才更強，否則即使流動比率較高也未必有較強的債能力。


    長期債務償能力比率：長期債務是指一年期以上的債務。長期債務能力不僅關係到投資者的安全，還反映公司擴展經營能力的強弱。


    股東權益對負債比率=（股東權益總額 ÷ 負債總額）×100%


    股東權益對負債比率表明每百元負債中，有多少自有資本作爲償付保證。數值大，表明公司有足夠的資本以保證償還債務。


    負債比率=（負債總額 ÷ 總資產淨額）×100%


    負債比率又叫舉債經營比率，顯示債權人的權益占總資產的比例，數值較大，說明公司擴展經營的能力較強，股東權益的運用充分，但債務太多，會影響債務的償還能力。


    # 比率效率指標分析


    比率效率是用來考察公司運用其資產的有效性及經營效率的指標。


    存貨周轉率=（營業成本）÷（平均存貨額）


    存貨周轉率高，說明存貨周轉快，公司控制存貨的能力強，存貨成本低，經營效率高。


    應收帳款周轉率=（營業收入）÷（應收帳款平均餘額）


    應收帳款周轉率表明公司收帳款效率。數值大，說明資通運和管理效率高。


