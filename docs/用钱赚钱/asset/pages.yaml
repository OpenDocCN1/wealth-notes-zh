  md: '# 家庭成熟期的理財


    家庭成熟期15年，子女開始工作至本人退休，人生、收入高峰期，適合儲蓄、擴大投資。


    # 投資策略


    可以把家庭30%資金用來作為高風險投資，比如：股票、外匯、期貨。股票類的基金：將40%的資金用作儲蓄、債券和保險，20%的資金用於養老投資：買養老保險、儲備退休金。當然，還有10%的資金是應急備用金。


    到了成熟期的最後幾年，投資的風險比例應該會逐年減少，請為你最後的退休期來作規劃。


    # 退休期的理財


    退休期投資和消費都較保守，理財原則是身體健康第一、財富第二，主要以穩健、安全、保值為目的。


    # 理財建議


    10%的資金用於股票或股票類基金；50%用於定期儲蓄、債券；40%用於活期儲蓄。資產較多者可合法避稅，將資產轉移至下一代。


    以上是我們一生的理財思路。這個思路是指導投資者未來投資的基本準則，遵循這個基本準則，我們就能找到財富的源頭。'
