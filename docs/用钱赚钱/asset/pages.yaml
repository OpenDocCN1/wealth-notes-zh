- pgno: 154
  md: '# 保險理財早知道


    對於絕大多數人來說，保險是一項最重要的人生規劃。就中國目前的

    情況來看，個人穩定保險計畫很大程度上必須依賴在各行階段所做的儲

    蓄、投資及收入等經濟狀況。因此，在購買保險理財產品時要量力而行，

    根據自己的能力進行嚴活的自主規劃。

    買保險要綜合考慮個人的保障需求、保險公司的經營業績以及保險代

    理人的服務品質等。下面介紹一些保險常識。


    # 保險是什麼


    從廣義上說，保險包括有社會保障部門所提供的社會保險，比如社會

    養老保險、社會醫療保險等。除此之外，還包括專業的保險公司按照市場

    規則所提供的商業保險。

    狹義上說，保險是投保人根據合約約定，向保險人支付保險費，保險

    人對於合約約定可能發生的事故，因其發生所造成的財產損失承擔賠償保

    險金的責任。或者當被保險人死亡的時候、傷殘的時候或者達到合約約定

    的年齡、期限的時候承擔給付保險金責任的商業保險行為。這裡主要講的

    是商業保險，而不是我們說的社會保險。


    # 保險有哪些類


    # 按保險標的或保險對象劃分


    按保險標的或保險對象劃分，保險主要分為財產保險和人身保險兩大'
  merge: -1
  img_proc: true
- pgno: 155
  md: '類。這是最常見的一種分類方法。


    財產保險：財產保險以物質財產及其有關利益、責任和信用為保險標的，當保險財產遭受保險責任範圍內的損失時，由保險人提供經濟補償。財產分為有形財產和無形財產。廠房、機械設備、運輸工具、產品等為有形財產；預期利益、權益、責任、信用等為無形財產。與此相對應，財產保險有廣義和狹義之分。廣義的財產保險是指以物質財富以及與之相關的利益作為保險標的的保險，包括財產損失保險、責任保險和信用（保證）保險。狹義的財產保險是指以有形的物質財富以及與此相關的利益作為保險標的的保險，主要包括火災保險、海上保險、貨物運輸保險、汽車保險、航空保險、工程保險和農業保險等。


    人身保險：人身保險以人的壽命和身體為保險標的，並以其生存、年老、傷殘、疾病、死亡等人身風險為保險事故。在保險有效期內，被保險人因意外事故而遭受人身傷亡，或在保險期滿後仍然生存，保險人都要按約給付保險金。人身保險包括人壽保險、人身意外傷害保險和健康保險等。


    # 按承保的風險劃分


    根據承保風險的不同，保險可劃分為單一風險保險和綜合風險保險。


    單一風險保險：是指僅對某一可保風險提供保險保障的保險。例如，水災保險僅對待大洪水事故承擔損失賠償責任。


    綜合風險保險：是指對兩種或兩種以上的可保風險提供保險保障的保險。綜合保險通常是以基本險加附加險的方式出現的。當前的保險品項基本上都具有綜合保險性質。例如，企業財產保險的保險責任包括火災、爆炸、洪水等。


    # 按保險的實施方式劃分


    按保險的實施方式劃分，可分為強制保險與自願保險，或者商業保險'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 與社會保險。


    +   強制保險與自願保險

    *   **強制保險**：是國家透過立法規定強制實行的保險。強制保險的範疇大於法定保險。法定保險是強制保險的主要形式。

    *   **自願保險**：是投保人根據自身需要自主決定是否投保、投保什麼以及保險保障範圍。


    +   商業保險與社會保險

    *   **商業保險**：又稱金融保險，是指按商業原則所進行的保險，以盈利為目的。具體而言，是指投保人根據合同约定，向保險人支付保險費，保險人對於合同约定的因可能發生的事故而造成的財產損失承擔賠償保險金責任，或者當被保險人死亡、傷殘、疾病或者達到合同约定的年齡、期限時承擔給付保險金責任的保險行為。


    +   社會保險：是指國家透過立法強制實行的，由個人、單位、國家三方共同籌資，建立保險基金，對個人因年老、工傷、疾病、生育、殘廢、失業、死亡等原因喪失勞動能力或暫時失去工作時，給予本人或其供養直系親屬物費幫助的一種社會保障制度。社會保險具有法制性、強制性、固定性等特點，每個在職職工都必須實行，所以，社會保險又稱為（社會）基本保險，或者簡稱為社保。'
