- pgno: 142
  md: '142


    # 優化基金投資組合


    在基金的投資過程中，有很多投資者雖然付出了很多時間和精力，但是收益情況卻並不是非常理想，其中一個非常重要的原因就是沒有建立合理的基金組合，從而使自己徒勞無功。俗話說得好，不要把所有的雞蛋放在同一個籃子裡。在投資基金上，就是要求要做好基金的有效組合工作，尤其是在股市動盪的今天，科學合理的基金組合顯得尤為重要。


    那麼，投資者應該如何選擇資金組合呢？


    # 多種形態需要不同的投資組合


    我們投資基金，就是為了避免風險，作一個基金投資組合可以有效地避免非系統性風險。


    但是投資基金如果盲目組合也不行，不同的時期需要不同基金組合，不同時期的基金組合可以使我们避免風險、賺取利潤。


    市場可以分下面幾種形態：


    # 漫漫熊市


    從2001年到2005年9月之前中國股市就經歷了漫長的熊市。


    # 長期大牛市


    2005～2007年，就是一個跨年度的牛市。2005年9月股改之後，到2006年中期是個漫漫的長牛市。長牛市是什麼？雖然中間有很大的波動，比如一千點、兩千點的波動，但是牛市的基礎穩定，可以持續5年、'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 盤整行情


    10年的繁榮，稱作一個長牛市。


    盤整行情是行情在一定時期內，在一個狹窄區間內波動，波動區間很小。盤整想賺到錢，也有不同投資基金的組合。


    # 中級調整


    最難把握的就是長牛市中的中級調整。什麼是中級調整？有兩個層次


    的概念，一是中級調整的時間可能比較長，二是調整的點位比較大，不好把捉。在中級調整之後，市場會出現兩種情況。第一，繼續走大牛市，應


    該持有；第二，可能還要下跌，這個時候需要觀望。熊市的中級調整，就是難得的反彈機會，反彈之後行情會繼續走熊市，所以操作起來是採取反彈為主。


    既然市場有多種形態，我們投資基金，一定要做不同的投資組合，才能規避風險達到利潤最大化。最必須判斷行情是熊市、牛市，還是長熊市、長牛市，之後根據市場不同作不同市場基金組合。


    市場有多種形態，我們投資基金要以理性投資應對市場的不確定性。投資者可採取不同的策略應對市場的變化。


    # 漫漫熊市時的應對策略


    熊市的時候，市場交易清淡，門可羅雀，成交量明顯減少。熊市中投資組合應該本著避免風險，保證本金安全來組合。


    因為任何逆勢行為，都是相當危險的。行情在下跌，人場搶反彈，往往90%都是虧損的。這時應該做這樣的組合，即時有貨幣債券基金的比較在90%以上。在漫漫熊市中，偏股型的、指數型的和股票型的基金的淨值都是跌破面值的。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '債券型基金包括一些保本基金，收益雖然很低，但是在熊市投資中卻有優勢。債券基金投資國債、投資政府債券、投資一些企業債券，比較安全。在熊市中持有貨幣和債券型基金，是我們最好的選擇。


    在漫漫熊市，會偶爾出現一些反漲，可以持有10%的股票型基金，或者指數型基金，來進行搶反彈操作。為什麼要持有10%？在逆勢操作中90%要虧損，只能持有最少的資金、最少倉位去做一做，你持有股票基金跌破10%的時候，適當止損，不會虧損太多。


    在漫漫熊市中，我們的投資基金組合應該是以保本為主，持有貨幣和債券基金為主。本金可以保住，還有超過銀行存款的一些收益，何樂而不為呢？


    # 長期大牛市的投資組合


    大盤牛市的時候買4檔基金足夠，買多了雖然分散風險，但是收益也不會太大。


    投資組合第一檔基金，一定要買被動型基金。因為被動型基金，它是模仿指數，指數如果在上漲，指數型基金就會跟隨大盤漲動。我們可以猜到今天這個基金的淨值多少。上證50、深創100、滬深300、基金名字中有這些數字的基金都是指數基金。往往在大盤牛市的時候，指數基金的上涨的幅度要超過很多股票型的開放型基金。


    第二檔基金，成長型基金。成長型基金是追求一個長期穩定的收益，選擇的股票是長期持有的潛力股，如中國平安、中國人壽、工商銀行，這些都是大盤股藍籌股*。市值穩定，可以慢持有追求長期投資收益。像


    *藍籌股（Blue chip）：又稱績優股、權值股，指在某一行業中處于重要支配地位、業績優良、交易活躍、公司知名度高、市值大、公司經營者可信任、營收獲利穩定、每年固定分配股利、紅利優厚、市場認同度高的大公司的股票。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '這種成長型基金，也是我們必挑的一檔基金。成長型基金中可以選擇股票型基金，或者偏股型的基金。


    第三檔基金，中小盤基金。深圳股票市場有一個中小板，股票代碼都是 002 打頭。何為中小板？就是企業規模小，規模可能沒有超過 5000 萬股本，8000 萬股本在中小板就算大的。但是股價並不低，例如，蘇寧電器，股價一直在
    60 元之上，中小盤企業有一個高成長性。中小企業雖小，但是往往一些技術在行業中處於领先地位。中小盤基金漲勢在牛市中也非常好，尤其是在中國漫漫的牛市揭開大幕的時候。也就是在這種形勢下，包括美國，股市成長的時候，都是由占絕對多數的中小企業支撐美國的繁榮。所以中小盤基金也是我們應該必須持有的。


    第四檔基金，債券型基金。為什麼要給大家推薦債券型基金呢？因為市場難料。比如说「5.30」大跌，就令市場措手不及，甚至基金都被套。在 2007 年的交易中，很多債券型基金整體收益並不低於成長型基金和偏股型基金，而且還可以在股票大牛市中超過股票型基金。


    持有這 4 檔基金，優點明顯。分析基金收益情況，指數基金收益高，可能明年基金投資追求成長性，成長型基金收益更高。在調整時刻，持有債券型基金一部分，可以令整體收益不會調整過多。這樣的組合是非常安全的。


    長牛市投資組合的資金比例，例如：10 萬元錢投資基金，長牛市中指數基金的成本低，漲幅應該超過一般主動型基金，所以指數型基金的投資比例應該在 40% 左右。股票型基金（成長型）配置
    20%～25% 之間，偏股型基金（平衡型基金）在 20%～25% 之間，買的債券型基金投資比例在 10%～15% 之間波動。這樣的配置可以說是很好的投資組合。


    # ## 盤整行情時的投資組合策略


    如果到了行情盤整的時候，我們怎麼做？行情波動很小，應該以防票'
  merge: -1
  img_proc: true
- pgno: 146
  md: '性配置爲主，多是觀望爲主，盡量少去操作，整髒的行情是考驗耐性，波動的幅度也不會很大。在這種情況下，應該買一些大盤藍籌基金和一些貨幣型基金，盡量少買指數型基金。


    在行情整髒的時候，基金走勢跟股市的走勢相一致。股市中，受到政策面的影響，很多沒有投資價值的垃圾股票都下跌50%，而很多藍籌股票在逆勢而上，創造新高。這時可以買一些大盤藍籌基金，因為基金會投資選擇市值被低估的股票或者有成長性的股票，如果基金持有這樣的股票比較集中，往往這些股票基金下跌幅度小。這就是在整髒市場行情中買基金的一個組合策略。


    # 中級調整時基金組合策略


    行情出現牛市中級調整的時候，最難判斷行情究竟要調整多久，調整到什麼點位。慢漲快跌，是大牛市的特徵。


    在牛市中級調整的時候，行情從大幅上漲變成大幅下跌，成交量萎縮，股票基金也不能獨善其身，淨值也會縮水。


    在大盤牛市中級調整的時候，股票基金走勢跟隨股市的走勢，中級調整的特徵是，藍籌股票也會出現一定的下跌，如果持有藍籌股票，可能下跌40%，損失慘重。市場需要擠壓泡沫，這個時候基金也會持有大量現金，以觀望爲主，市場缺乏交易量。


    大盤牛市中級調整的時候，可以持有一些貨幣型基金和債券型基金，這種投資組合出於風險考慮，因爲大牛市中級調整也是很可怕的。股市調整，指數型基金和股市同向運動，下跌幅度和股市跌幅基本一致。股票型基金也是一樣，所以最好不配置。


    在熊市中級調整中，和牛市中級調整正好相反，可能有一輪上漲行情，但是這樣的上漲僅僅限於反彈，可能曇花一現，所以投資中還是以債券和貨幣基金爲主。因爲在熊市中，雖然可以把握行情的波動，但是'
  merge: -1
  img_proc: true
- pgno: 147
  md: '操作中可能就會存在困難，比如反彈時間很短，基金操作有時間遲緩性。反彈是火中取栗，一旦博取反彈錯誤，反而能引起更大損失。如果想博取反彈，買股票型基金可以，但是配置比例不能超過
    30%。這就是在大牛市的中级調整市場行情中，我們買基金的一個組合型策略。


    # 依靠專業化操作保證贏利


    基金投資雖然有專家理財幫忙，但是沒有有一定的基金投資知識也是不行。如果沒有專業知識，可以借助銷售基金的理財人員的一些建議。'
