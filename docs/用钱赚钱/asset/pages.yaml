  md: '戶，並且這個帳戶是進行基金交易時的指定資金帳戶。如果到了扣款日因投資者帳戶內資金餘額不足則會導致該月扣款不成功，因此投資者需要在每月扣款日前在帳戶內按約定存足資金。


    每個人都想在最低點買入基金，但低點買入是可遇不可求的。定額投資，基金淨值下降時，所申購的份額就會較多；基金淨值上升，所購買到的份額就變少，但長期下來，會產生平攤投資成本的結果，也降低了投資風險。'
