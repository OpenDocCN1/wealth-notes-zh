  md: '資金用於基金定期定額投資計畫。目前她已經將現有儲蓄資金根據市場情況，分別投放在安全性較好的銀行人民幣、外匯理財產品、開放式基金或理財型保險產品中，為今後的婚姻生活和子女教育儲備一定的資產。根據夏利的個人情況，除了以組合投資獲得持續穩健的回報外，理財專家認為她還應購買健康保險，以解除後顧之憂。


