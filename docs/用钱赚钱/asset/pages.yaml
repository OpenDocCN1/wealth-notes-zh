  md: '# 理財改變人生


    在目前的階段，儲蓄仍然是大部分人傳統的理財方式。但是將錢存入銀行，在短期內雖然是最安全的，但是從長期來看卻是一種非常危險的理財方式。你或許會對這種說法感到很疑問吧？其實存款到銀行最大的弊端就在於利率太低，非常不適合個人作長期投資工具使用。我們假設一個人每年存入銀行
    1.4 萬元，享受平均 3% 的利率，40 年之後他就可以累積 169 萬元。但是這個結果與投資報酬率為 20% 的項目相比較，兩者收益相差達到 70 多倍。更何況，貨幣價值還有一個隱形殺手——通貨膨脹。在通貨膨脹
    5% 之下，將錢存在名義上利率約為 5% 的銀行，那麼實際報酬等於零，這樣也就是說，你的錢實際上已經貶值了。


    《聖經》上有一則勸人善加投資理財的故事：猶太大地主馬太有一天要外出遠遊，便將他的財產託付給三位僕人保管。他給了第一位僕人 5000 金幣，第二位僕人 2000
    金幣，第三位僕人 1000 金幣。馬太告訴他們，要好好珍惜並善加管理自己的財富，等到一年後他將會回來。馬太走後，第一位僕人將這筆錢作了各種投資；第二位僕人則買下原料，製造商品出售；第三位僕人為了安全起見，將錢埋在樹下。


    一年後，馬太約回來了，第一位僕人手中的金幣增加了一倍，第二位僕人的金幣增加了三倍，第三位僕人的金幣絲毫未增加，他向馬太解釋說：「唯恐運用失當而遭到損失，所以將錢存在安全的地方，今天將它原封不動奉還。」馬太聽了大怒，並罵道：「你這麼蠢的傢伙，竟不好好利用你的財富。」馬太拿回了金幣，交給了第一位僕人。'
