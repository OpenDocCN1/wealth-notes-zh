  md: '長期投資一支個股，要看它的基本面情況，根據基本面，業績屬於持續穩定增長的態勢，那完全可以大膽介入；如果個股有突發實質性的重大利好，也可擇機介入，等待別人來抬轎。


    # 根據行業政策判斷買入時機


    根據國家對某行業的政策，以及行業特點、行業公司等的情況，買入看好的上市公司；比如國家重點扶持的農業領域，在政策的影響下，農業類是具有代表性的上市公司就是買入的群落。


    # 根據趨勢線判斷短線買入時機


    中期上升趨勢中，股價回檔不破上升趨勢線又止跌回升時是買入時機；股價向上突破下降趨勢線後回檔至該趨勢線上是買入時機；股價向上突破上升通道的上軌線是買入時機；股價向上突破水準趨勢線時是買入時機。


    # 根據成交量判斷短線買入時機


    # 股價上升且成交量穩步放大時


    底部量增，價格穩步攀升，主力吸足籌碼後，配合大勢稍加拉抬，投資者即會加入追漲行列，放量突破後即是一段彌漲期，所以第一根巨量長陽宜大膽買進，可有收穫。


    # 縮量整理時


    久跌後價穩量縮。在空頭市場，媒體上都非常看壞後市，但一旦價格'
