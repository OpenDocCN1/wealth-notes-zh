  md: '企穩，量也縮小時，可買入。


    # 根據 K 線形態確定向入時機


    # 底部明顯突破時為買入時機


    比如：W 底、頭肩底等，在股價突破頭線點，為買點；在相對高位的時候，無論什麼形態，也要小心為妙；另外，當確定为孤形底，形成 10% 的突破，為大膽買入時機。


    # 低價區小十字星連續出現時


    底部連續出現小十字星，表示股價已經止跌企穩，有主力介入痕跡，若有意長下影線更好，說明多頭位居有利地位，是買入的較好時機。重要的是：價格波動要趨於收斂，形態必須面臨向上突破。


    # 根據移動平均線判斷買入時機


    # 上升趨勢中股價回檔不破 10 日均線是短線買入時機


    上升趨勢中，股價回檔至 10 日均線附近時成交量應明顯萎縮，而再度上漲時成交量應放大，這樣後市上漲的空間才會更大。


    # 股價有效突破 60 日平均線時是中線 * 買入時機


    當股價突破 60 日均線前，該股下跌的幅度愈大、時間愈長愈好，一旦突破之後其反轉的可能性也愈大。


    * 中線：交易時間通常在 6 個月到 1、2 年的時間，很多人會採取波段操作的方式來做。'
