  md: '有一個北大畢業的學生到英國留學，讀完博士在英國就業，後來把夫人也接到了英國，並養育了３個兒女。他愛他的孩子，給孩子們都買了保險，給自己的夫人也買了，唯獨沒有給自己買。


    有一天他上街，遇到了車禍，這位年輕的父親，英年早逝。由於他沒有給自己買保險，就沒有得到任何的補償。這個時候，他的太太已經在家裡做了一個全職太太，他的３個孩子正在上高中。


    家庭突然失去收入來源，不懂無法再進行教育投資，連日常生活都出現困難。這個年輕的母親，一直記得她的丈夫死的時候說的一句話，一定要讓３個孩子上到大學。為了實現丈夫的遺願，她每天打３份工給人做保姆，就這樣苦熬了５年，供著自己的３個孩子上了英國數一数二的名校。


    如果要買保險，大多數人肯定希望把保險買給自己的孩子，之後是自己的配偶，唯獨忘記了他自己。這個就是買保險的誤區。


    在上面的例子中，那個年輕的父親就犯了嚴重的錯誤，沒有給自己買保險。其實，他是家庭收入的主要來源，他的夫人不上班，他有３個孩子上學，家庭所有的收入都是靠他來取得。依照他當時的條件，他應該完全有能力先給自己買一份保險，這樣即使出現意外，這份保險足以供應他的孩子和他的夫人生活２０年以上，這樣他的夫人也不用在他出現意外後每天早起貪黑地去打３份工來維持家計了。


    # 買保險是一種風險管理


    很多人沒有買保險，是覺得保險沒有意義。近代國學大師胡適先生這樣詮釋保險：「保險的意義，只是今天作明天的準備，生前作死時的準備，父母作兒女的準備，兒女幼小時作兒女長太時的準備，如此而已。今天預備明天，這是真穩健；生前預備死時，這是真贛達；父母預備兒女，這是真慈愛。能做到這三步的人，才能算是現代的人。」所以保險是表現'
