- pgno: 326
  md: '# 巧買二手房，勝過存銀行


    現如今，股市、保險、期貨等理財管道可以說愈來愈多，但是真正適合受薪階級的投資方式卻少得可憐。隨著房地產發展的擴大，二手房交易也愈來愈火爆。因二手房交易引發的糾紛較多，所以交易二手房有很多細節需要注意：


    # 對中介全面審查


    根據統計資料顯示，中國二手房交易中，經過中介成交的已經占到80%。然而如果在交易過程中，遇到資質差或者根本沒有資質的中介公司，則後果不堪設想。所以下面先教教大家如何辨別中介公司的等級和真偽。


    +   一看中介公司是否有明確的公司名稱、長期經營的地址。這可以透過看中介公司的招牌、詢問周圍人該公司成立情況及經營情況來確定，以防皮包公司詐騙。


    +   二看中介公司營業執照以確定該公司的營業資質。看是否可以進行二手房中介業務，辦理經營二手房仲介的中介公司的營業執照需要衆多的條件，包括相關的有仲介資質從業人員等條件。


    +   三看中介公司營業執照確定它的註冊資金，中介公司註冊資金不能低於買賣一間房子的價格。客戶透過中介來交易房屋最主要的原因就是不希望直接交房屋款，希望在整個交易過程中有一個協力廠商來維護雙方的利益，所以一定要找到一家公司的風險承受能力，即該公司的註冊資金能大於該房屋的廠價或該中介公司為品牌公司，擁有良好的信譽，一旦發生糾'
  merge: -1
  img_proc: true
- pgno: 327
  md: '紛，作為消費者的客戶能得到妥善解決。


    四看仲介公司是否擁有合法的土地產經紀人資質的從業人員，是否有房地產經紀人資格的業務員在為你提供仲介服務。擁有資質的從業人員，在從事二手房交易過程中如對有任何違法或對客戶不利的情況發生，有關部門將透過相關政府行政措施，會對其進行相應懲處。


    五看仲介公司與你簽訂的居間合約的是否經過備案。由於二手房交易中有很多專業術語和一些行規慣例，對於合約的使用要求就是格式合約，在使用區的工商局進行備案，而凡是在工商局備案的格式合約在備案時工商局已經就相關的條款進行審核了，就有關消費者的權益進行了相關的調控，基本能保障消費者的權益。


    六看仲介公司是否有專業的從業人員負責簽約並辦理相關的後續服務。大公司和小公司之間的區別也比較明顯，小仲介公司一般由業務員全程處理所有事項，大的品牌公司一般分工較細，會將房屋交易的前端和後端分開，由房產業務員從事前端的房屋開發、帶看、收意向金、輪旋、交屋等工作，另外再設立專門部門從事簽訂房地產買賣合約、辦理過戶、貸款、領證等手續。這樣既有利於資源優化，又可以確保交易的真實性，防止為利走臉，能盡最大可能保障交易安全。


    從上面幾條，我們可以看到房屋仲介公司的情況，所以如果我們要買買二手房，尋找仲介來交易房屋最主要的原因就是不希望置現金交易，希望整個交易過程中有一個磁力廠商來維護雙方的利益，但是一旦找到一個黑仲介，可能適得其反。所以二手房交易一定先看好一家可靠的仲介機構。'
  merge: -1
  img_proc: true
- pgno: 328
  md: '# 關注細節不吃虧


    # 訂金


    在二手屋交易中，因為訂金的問題經常發生買賣雙方衝突。訂金是對買方的約束，如果賣方收取了訂金而違約，就要雙倍返還訂金。


    收訂金後，如果買方沒有按時履行約定，賣方將房轉賣他人應該手握對方退房申請，最好讓買方寫書面申請退房，否則將要雙倍返回訂金。


    購房合約對雙方當事人都具有法律約束力，任何一方不得擅自變更或解除合約。如果買房人違約在先，買房人可不退訂金。買房人沒有以書面方式明確表態不履行，則房主在未解除合約也不退訂金的情形下將房子賣給他人的行為就違反了合約。


    對於房主而言，若買房人提出退房或解除合約，應要求買房人提出書面解約的申請或證明，以保全對方違約在先的證據，然後才可以將房子賣給協方贖商。


    # 付款方式


    房款如何支付，必須在合約中詳細寫清楚。買買房子屬於大宗交易，所以交易如何付款，如何收款一定要詳細說明，而最好找到合適銀行託管，以防止生變。


    雙方簽訂買賣合約時，應對付款流程、方式和時間做出明確、具體的約定。買房人如果將購房款交給中介公司再轉交賣方，應先審查中介公司的資質狀況。特別是能不能將購房款交給中介公司的個別職員，防止他們卷款潛逃。


    目前有的仲介公司已經與國內銀行共同開發了二手屋交易資金託管業務，由銀行作爲擔保人。買房人先在銀行開設一個經營帳戶，並將房屋首付款或者全部貸款存入該帳戶。當買房人確定已經安全辦理了房屋過戶手續後，就可通知銀行將該筆存入的房款轉給賣房人。這樣可以保證資金安'
  merge: -1
  img_proc: true
- pgno: 329
  md: '# ### 房齡


    一樣的房子，建造年代不同，房子的價格肯定不同。


    透過仲介公司買買二手房，應審查兩方面內容：一是上家的委託價與下家的買價是否一致；二是仲介公司收取的傭金數額不得超過國家規定上限比例，即不超過全部購房款的3%。審查的依據是下家與仲介公司簽訂的居間合約和上下家簽訂的買賣合約。這樣的審查能有效防止少數仲介從業人員違反規定，賺取差價或謀取不當利益。


    # ### 產權


    買二手房一定要過戶，手裡沒房產證隱患多。房產證是證明房主對房屋享有所有權的唯一憑證，沒有辦理房產證對買房人來說有得不到房屋的極大風險，因此引發的糾紛也較多，所以買房必須要及時辦理房屋過戶手續。


    如果買賣雙方同意，最好到公證處去辦個提存公證，即買方將購房款存放到公證處，在條件符合約定的情況下，由公證處將該筆款項支付給賣方。也可到律師事務所辦理提存見證，由具有專業資質的律師事務所來充當「公證人」的角色。申請了公證或見證後，如產權證辦不出來，那麼賣方是收不到錢的。


    除了要看房屋是否有房產證外，還要查清房屋的以下幾點情況：


    +   要點一：房屋產權是否明晰。有些房屋有好多個共有人，如有繼承人共有的、家庭共有的，還有夫妻共有的。對此買房人應當和全部共有人簽訂房屋買賣合約，否則無效。


    +   要點二：交易房屋是否被租賃。買二手房時，應注意該房屋是否已被出租。中國法律有「買賣不破租賃」的原則。也就是說，如果購買房屋時該房屋已被租賃，則該租賃合約對於新的房主而言依然有效。'
  merge: -1
  img_proc: true
- pgno: 330
  md: '**要點三：**土地情況是否清晰。買二手房時買房人應注意土地使用性質，看是劃撥還是出讓。劃撥土地一般是無償使用，政府可無償收回。同時，應注意土地使用年限。


    **要點四：**福利房屋交易是否受限制。房改房、經濟適用房本身是福利性質的政策性住房，轉讓時有一定限制，買房人購買時要避免買受合同與國家法律衝突。例如，經濟適用房的交易是有一定限制的，購買5年以上才可進入市場並按市場價進行轉讓，5年以內則只能以原價轉讓，而且購買方還必須符合購買經濟適用房的條件。


    在實際看房時，最好要實地調查，明確房屋的具體情況，簽訂合約一定要弄清房屋的具體情況，如位址、面積、樓層等。對於房屋實際面積與產權證上注明的面積不符的（如測驗的誤差、某些牆面面積等），應在合約中約定：是以產權證上注明的為準，還是雙方重新測繪面積、必須予以明確。


    # 公證


    買賣雙方大部分是不熟悉的雙方進行交易，不可能對房子的各種狀態瞭解透徹，這樣可以讓房屋中介進行一些問題的磋商之後做一些公證。花費不大，但是具有法律效力，一旦出现糾紛，可以按照公證內容做裁決。


    **買賣合約公證：**主要針對房屋買賣當中，有一方當事人為境外人的情況。在房屋買賣過程中，如一方為境外人則買賣合約必須經過公證後方可生效，否則無法送交易中心交易，所以境外人辦理相關房屋買賣，必須辦理買賣合約公證手續。


    **委託公證：**主要指房東或客戶無法親自辦理相關房產過戶手續，只能委託其他人或中介公司辦理相關手續，由於交易中心無法確認手寫委託書的真實性，交易中心一般会要求無法親自到場的事實人出具公證後的委託書，方為其辦理相關的過戶手續。


    **貸款合約公證：**境外人購房如需貸款，則其貸款合約必須經過公證處'
  merge: -1
  img_proc: true
- pgno: 331
  md: '公證生效。只有公證處公證後的貸款合約，交易中心才會受理並讓他項權利證。


    **贈與公證：**在二手房交易中還有一種方式即贈與，原房主自願將房屋贈與給他人，並要求將房屋產權人名字進行更改。


    **影本與原件相符公證：**以前政策允許轉讓期房時，由於可以不經開發商同意進行交易，而客戶不經開發商同意進行交易，開發商也不願提供相關的預售合約，但交易中心交易必須提供足夠的預售合約方能交易，因此必須拿著房東手中的預售合約辦理影本與原件相符的公證，拿出6本以上的合約前往交易中心辦理購購手續。


    # 證件


    二手房交易辦證所涉及的資料與證件：**《房屋轉讓合約》**原件；收款憑證；買賣雙方個人身分證、戶口名簿及私章；轉讓前房屋所有權證、契證、土地使用權證；**《具結書》**。這些證件都是必須的，一個也不能少，否則你的二手房買賣就存在一定的斑斑，為日後留下後患。


    # 明確房屋的具體情況


    買房子是人生大事，二手房交易要在購房合約中明確房屋的具體情況。


    # 寫清房屋的具體情況


    如地址、面積、樓層等。對於房屋實際面積與產權證上注明的面積不符的（如潮漫的誤差、某些贈送面積等），應在合約中約定清楚是以產權證上注明的為準，還是雙方重新測繪面積。'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 明磚房價具體包括哪些設施


    在規定中註明，屋內哪些設施是在房價之內，哪些是要另外計算費用的。如房屋的裝修、家具、煤氣、維修基金等是否包括在房價之內。


    注意要把口頭的各種許諾，變成白紙黑字的書面約定。


    總之，房屋投資永遠是比股票投資穩健的項目，而二手房投資更是穩健投資中的首選對象。另外需要提醒大家注意的是，雖然購買二手房出租的收益會高於銀行儲蓄，但是也並非買了二手房就高枕無憂了，在購房時只有注意以上的因素，精挑細選，才可有效避免將來房屋的貶值影響收益。'
  merge: -1
  img_proc: true
- pgno: 333
  md: '# Chapter 15


    # 信託：一種特殊的財產管理制度和法律行為'
  merge: -1
  img_proc: true
- pgno: 334
  md: '# 信託理財知識入門


    信託的定義依照中國信託法第二條的規定，是指委託人基於對受托人的信任，將其財產權委託給受托人，由受托人按委託人的意願以自己的名義，為受益人的利益或者特定目的，進行管理或者處分的行為。簡而言之，信託為一種財富管理制度，是由財產所有人將財產移轉或設定於管理人，使管理人為一定之人之利益或目的，為之管理或處分財產。


    信託這種理財方式和眾多信託品種的接連出現，為廣大投資者提供了一條生財之路。如何選擇信託新產品，投資者需要瞭解信託理財的基本知識。只有真正瞭解信託，才能生財不斷。


    # 受人之托代人理財


    信託產品的預計收益率往往高於同期其他固定收益類投資產品，這是為什麼信託產品銷售非常火爆的原因。投資者要選擇信託產品，首先要瞭解什麼是信託理財。


    許多投資者可能對「信託」這兩個字眼還比較陌生，對「信託投資公司」在做什麼、能做什麼還不太瞭解。實際上，信託作為法律上的一種財產管理制度，在發達的市場經濟國家，已經與「銀行、保險、證券」並稱為現代金融業的四大支柱產業。


    信託是信用、委託的意思。根據中國 2001 年 10 月 1 日正式施行的《中華人民共和國信託法》，信託是指委託人基於對受托人的信任，將其財產權委託給受托人，由受托人按委託人的意願以自己的名義，為受益人的利益或者特定目的進行管理或者處分的行為。上述財產權，是指以財'
  merge: -1
  img_proc: true
- pgno: 335
  md: '產上的利益為標的的權利，包括物權、債權、智慧財產權，以及其他身分分權、名譽權、姓名權以外的無形財產權。簡單地說，信託就是「受人之託，代人理財」。


    信託制度作為一種財產管理方式，它的一個重要特點是信託財產是區別於委託人、受託人和受益人其他財產的獨立財產，不受委託人、受託人和受益人的債務糾紛的影響，因此受託人必須設立獨立的帳戶來管理信託財產，保證了信託財產的獨立性和安全性。


    # ## 信託的優越性


    與類似的法律制度相比較，信託是一項更為有效的進行財產轉移與管理的制度設計。在國外的實踐中，信託顯示了自己獨特的優越性，主要表現在以下幾個方面：


    # ### 家族保障


    信託可對家族提供保障，並保護資產不受侵害，使資產不會被為了財產而與家族成員結婚之人有機可乘，使資產不會落入可能將家庭財富揮霍殆盡之後嗣之手。


    # ### 繼承安排


    信託是安排財產繼承的有效方法，讓你可依照心願，預先安排資產分配與各家族成員、親友、慈善團體及其他機構。在一些有繼承限制的国家，信託可助你彈性安排資產繼承，你的財富更毋須受到複雜冗長的遺囑認證程式影響，讓你指定的受益人能盡快繼承獲得資產。


    # ### 絕對保密


    由於你的資產已轉移至受託人名下，大多數的法定管轄區域均無關於'
  merge: -1
  img_proc: true
- pgno: 336
  md: '公開披露的規定，而且信託契約無須向任何政府機構登記，亦不公開供公眾人士查詢，因此受益人的個人資料及利益均絕對保密，直至信託終止為止。此外，信託通常具有可充當公司股東之用，更可進一步隱藏公司實際擁有人的身分。


    # 資產保障


    在法律許可的情況下，成立信託可使你的資產獲得長期保障，此資產在法律上登記於受託人或指定人名下，而非你居住或致籍的國家，因此亦可保障你的資產免受債權人索償。


    # 資產統籌及管理


    信託可助你將遍布全球的資產歸納入同一個架構之下，簡化資產管理及統一財務舉報。


    # 稅務規劃


    成立信託可減輕甚至豁免所得稅、資本利得稅、贈予稅、財產稅、遺產稅等稅務負擔。


    # 靈活運用


    信託契約中可保有適度的彈性（尤其是全權委託信託），以確保委託人隨外在環境的變遷，仍能為受益人謀求最佳的福利。


    信託本身具有相當的靈活度：信託是可被撤銷的，受託人可以辭職（或被撤換）；若基於政治或其他情勢之考量，而有較為謹慎之必要，信託設立及執行的地點可以移轉至其他法定管轄區域；信託財產的行政管理及操作、分配可隨時更改。契約中與你切身相關的條款，常會受不同因素影響，其中包括你財產規劃的目標、你所選擇的信託法定管轄區域居住地國家之法律，以及你所要求的信託靈活度等。'
