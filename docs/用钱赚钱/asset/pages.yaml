  md: '# 影響黃金價格的因素


    黃金具有作爲貨幣的悠久歷史，其本身具有雙重屬性，一個是其本身作爲貴重金屬的商品屬性，二是有著世界貨幣功能的貨幣屬性。在市場上，黃金價格的波動，絕大多數原因是受到黃金本身供求關係的影響。除此之外，由於黃金的特殊屬性，以及宏觀經濟、國際政治、投機活動和國際遊資等因素，黃金價格變化變得更为複雜，更加難以預料。影響黃金價格變化的基本因素主要包括以下幾個方面：


    # 供求關係


    眾所周知，商品價格的波動主要受市場供需等基本因素的影響。黃金交易是市場經濟的產物。地球上的黃金存量，年供應量，新的金礦開採成本等都會對供給方面產生影響。黃金的需求與黃金的用途有著直接的關係。


    # 美元走勢


    美元雖然沒有黃金那樣的穩定，但是它比黃金的流動性要好得多。因此，美元被認爲是第一類的錢，黃金是第二類。一般在黃金市場上有美元漲則金價跌，美元降則金價揚的規律。通常投資人土在儲蓄保本時，取黃金就會捨美元，取美元就會捨黃金。黃金雖然本身不是法定貨幣，但始終有其價值，不會貶值成廢鐵。若美元走勢強勁，投資美元升值機會大，人們自然會追逐美元。相反，當美元在外匯市場上走勢弱時，黃金價格就會走強。'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 利率


    利率調整是政府緊縮或擴張經濟的宏觀調控手段。利率對金融衍生品的交易影響較大，而對商品期貨的影響較小。投資黃金不會獲得利息，黃金投資的獲利全憑價格上升。對於投機性黃金交易者而言，保證金利息是其交易過程中的主要成本。在利率偏低時，黃金投資交易成本降低，投資黃金會有一定的益處；但是利率升高時，黃金投資的成本上升，投資若風險增大，相對而言，收取利息會更加吸引人，無利息黃金的投資價值因此下降。特別是美國的利息升高時，美元會被大量的吸納，金價勢必受挫。


    # 經濟景氣狀況


    世界經濟是否景氣直接影響投資者對黃金的需求。通常，經濟欣欣向榮，人们生活寬綽，自然會增強人們投資的欲望，黃金需求上升，金價也會得到一定的支持。相反之下，民不聊生，經濟蕭條時期，人們連基本的物質基礎保障都得不到滿足時，黃金投資自然不提，金價必然會下跌。因此，預測金價（特別是短期金價），要關注各國政府或機構公布的各項經濟資料，如
    GDP、失業率等。


    # 通貨膨脹對黃金價格的影響


    從長期來看，每年的通貨膨脹若是在正常範圍內變化，物價相對穩定時，其貨幣的購買能力就愈穩定。那麼其對金價的波動影響並不大，只有在短期內，物價大幅上升，引起人們的恐慌，貨幣的單位購買能力下降，持有現金根本沒有保障，收取利息也赶不上物價的暴升，金價才會明顯上升。總而言之，黃金不夫為對付通貨膨脹的重要手段之一。'
  merge: -1
  img_proc: true
