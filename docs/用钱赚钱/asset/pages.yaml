  md: '匯民做外匯買賣的最大心理企盼就是準確地預測匯率，以保證自己獲利。而基本面向分析可以令我們把握外匯市場的國家的經濟基本面，從而決定其匯價的長期趨勢。


    炒匯的難點，一是分辨行情是多頭、空頭或盤整形態；二是克服逆市操作的人性弱點，為此既要不斷積累經驗、增加認知，又要對基本面、技術面勤加研判，對此並無捷徑可走。


    # 經濟增長速度


    各國經濟的增長速度，是影響匯價的最基本因素。一個國家的經濟加速增長會形成利好，這個國家的貨幣就會升值。在匯市，美元占據主導地位。美國的經濟增長速度影響著匯市，有著舉足輕重的作用，一定要關心美國的經濟資料。如果美國公布的經濟資料普遍不好，會造成美元大幅下挫。


    例如：2009 年 12 月 18 日週五凌晨，因失業率上升、製造業趨弱以及消費者信心下降，美聯準宣布維持當前基準等於 0∼0.25% 水準不變，便利率降至
    1961 年 7 月以來的最低水準。美聯準同時還承認，近期跡象顯示，美國經濟恢復能力正在不斷增強。


    # 國際收支


    國際收支也是影響匯市的基本因素之一。國際收支是指商品和勞務的……'
  merge: -1
