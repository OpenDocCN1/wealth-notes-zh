- pgno: 18
  md: '# 一生的理財規劃


    香港首富李嘉誠在 30 歲時，其資產已經突破了千萬元；盛大網路創辦人陳天橋 30 歲時，其個人資產達到了 40 億！


    無數富人的成功事實證明，創造財富的能力是贏得未來的最重要的手段。李嘉誠曾經對長江商學院的學生們這樣說：「自己之所以成為富人，不是因為有錢，而是因為擁有生錢的頭腦。」他所指的「生錢的頭腦」，就是指創造財富的理財規劃。


    洛克斐勒*也曾經說過，即使不讓他帶一分錢，把他放進沙漠裡，他依舊會成為富翁，因為他擁有創造財富的本領：「只要有一列商旅過來，我就會和他們做生意。」


    可見，對於 30 幾歲的年輕人而言，你即將進入人生的黃金時期，必須要學會積累財富，學會靠錢賺錢。收入及資產狀況有所不同，理財的需求也是不同的，而理財實踐也呈現出四個不同的層次。


    第一個層次可稱為「隨意理財」，即通常個人或家庭都會有一個大致的資金計畫，如一個月至一年中，會有哪些數額較大的開銷。這幾筆資金又可以從哪些管道籌集到。這是人們憑著日常生活的經驗，都會做出的潛意識的理財方式。


    * 洛克斐勒：全名約翰·戴維森·洛克斐勒（John Davison Rockfeller，1839 年 7 月 8 日～1937 年 5 月 23 日），美國實業家、慈善家，因革新了石油工業和製造了慈善事業現代化結構而聞名。1870
    年成為歷史上第一位億萬富翁與全球首富。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '第二個層次是「專業理財」，主要是指各大金融機構推出的理財產品，這些金融機構同時還提供一些專業性的諮詢及銷售服務，人們可以此做一些專項的投資理財。業內人士認為，專業理財的內容仍不夠全面，比如：保險公司推出的理財計畫，主要針對健康、疾病、財產、教育等方面，對於個人或家庭的收支平衡，以及風險規避方面關注不多。然而，由於這一層次的理財活動的推廣比較迅速，因此也更容易受到人們的關注和參與。


    第三個層次是「相對全面的理財」，即一些金融機構在設計某一款理財產品的時候，也會考量一些相關的功能。比如說，某一種保險產品主要在關注個人的健康、安全之外，也可能會考慮人們投資收益方面的需求。然而，對於人們多種理財需求而言，這一層次的理財還不夠全面。


    第四個層次就是「理財規劃」，即個人或家庭的財務安排是從收入、支出，以及理財目標、家庭的風險承受度等方面統籌地考慮。其着眼點是個人或家庭財務運行的健康和安全，涉及到人生目標方面，構成了個理財規劃體系。


    正確的理財觀念既是要考慮財富的積累，也要考慮財富的保障；要為獲利而投資，也要對風險進行管理和控制；包括投資理財，也包括生活理財。因此，個人理財首先要保證滿足自己正常的生活需要，其次是對剩餘財產進行合理安排，合理劃分生活開支與投資資產。


    當然，絕大多數的上班族，主要透過家庭財富的積累，實現人生各階段的如：購房、育兒、養老等理財目標，在安排好家庭的各項開支，進行必要的「節流」的同時，透過合理的投資理財「開源」也同樣重要。


    進行理財規劃的第一步，就是要正確認識自己的風險承受能力，將收支比例控制在合適的範圍內。對於上班族而言，工作是收入的主要管道，因此認真積極地工作，不斷學習各項技能，不斷提高個人的工作能力，是保證工作穩定、收入增長的有效途徑。另一方面，透過購買相應的人身及財產保險，也可以避免意外事故對家庭經濟產生不利的影響。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '第二步，合理規劃支出，留足應付日常開支或意外事件的應急資金。因為，我們應切合實際地計算每月的水電費、衣食的費用、孩子固定的學費等支出，並在收入中先扣除，以備支付。同時，在身體健康、業餘休閒等方面，每月也應有固定的支出費用，數額主要根據個人情況而定，但要與收入保持在合理的比例。


    對於每月結餘的資金，可以進行合理投資。當然，投資理財應以穩健為基本原則，不宜盲目追求高收益、高回報。由於時間、精力、相關知識掌握及資金等方面的限制，上班族在購買相關金融產品進行間接投資時，不宜涉足高風險的投資領域，可選擇一些相對穩健的投資產品，如基金、國債或一些銀行理財產品。


    此外，定期定額投資可以有效地降低投資風險，更適合財富處於積累階段的普通上班族，同時還可以培養起良好的投資習慣。


    在人生不同的階段，人們所承受的風險和壓力是不同的，你應該去選擇適合你這個年齡段的投資理財產品。


    # 單身期的理財


    單身期2～5年，開始工作至結婚前，收入較低、開銷大。這時的理財重點不在獲利而在積累經驗。


    # 理財建議


    60%用於購買風險大、長期回報較高的股票，或是股票型基金、外匯、期貨等金融品項；30%用於定期儲蓄、債券或債券型基金等較安全的投資工具；10%用於活期儲蓄，以備不時之需。'
