  md: '度都在5000元左右，心中颇有几分「驚喜」之意，心想透過保險理賠銷醫療費用，這次意外事故反而可以令自己「賺筆小錢」，倒也是個意外的收獲。


    不過，鄭先生的「小算盤」卻失算了，因為在辦理理賠的時候，三家保險公司都要求他出具醫療費用憑證原件。


    其實，出現這種情況的根源在於鄭先生沒有瞭解清楚各類保險的理賠原則是有差異的。如果發生意外殘疾或死亡，如果有多份相應的保險，保險理賠上是不會衝突的。但醫療費用保險作為一種補償型保險，適用補償原則，即在保險金額的限額內，保險公司按被保險人實際支出的醫療費給付保險金。換而言之，不論你在多少家保險公司投保了多少份醫療費用保險，最終的保險金總額不能超過實際支出的醫療費用。


    但投保者總是存在一種誤解，認為如果在多家保險公司投保醫療費用保險，出險後，各家保險公司均應在其保險額度內給付保險金。


    果真如此，勢必就會出現這樣的情況：被保險人因為擁有多家保險而更熱衷於過度治療，其住院時間愈長，醫療費花費愈多，意味著獲利將愈多。事實上，也的確存在這種道德風險，因此，在各家保險公司條款中，均明確要求提供醫療費原始憑證作為獲取醫療費賠償的先決條件，影本或其他收費憑證均不被受理。


