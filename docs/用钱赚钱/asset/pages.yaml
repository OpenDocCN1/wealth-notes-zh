    +   。以聯合養殖、種植、合作造林名義進行「聯營入股返利」、養、代養、託管、代管等非法吸收公衆存款、集資詐騙犯罪活動。


    +   。以投資展位、鋪位、公�公會式酒店經營權為名進行「購後返租」、「奎權式商鋪」等非法吸收公衆存款、集資詐騙犯罪活動。


    +   。以專賣、代理、加盟連鎖、流動促銷等作誘餌發展下線的傳銷活動，以及利用互聯網為中介進行的「網絡傳銷」活動。


    +   。以「證券投資諮詢公司」、「產權經紀公司」的名義推銷所謂即將在境內外證券市場上市的股票。


