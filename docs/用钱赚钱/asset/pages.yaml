- pgno: 42
  md: '# 明白自己為什麼要投資


    窮人和富人最大的不同之處就是，富人允許自己的口袋空，但不允許自己的腦袋空；而窮人允許自己的腦袋空，而不允許自己的口袋空。窮人只擁有裝錢的口袋，富人卻擁有賺錢的頭腦。


    由此可見，投資理財是人生之計，但在真正開始投資前耍明白自己投資的目的。有了明確的投資目的，才能有計畫地開始投資，因為目的清楚明白，纔有利於投資計畫的實施。一般而苴，人們的主要投資理財目的不外乎以下幾點：


    # 獲得資產增值


    資產增值是每個投資者共同的目標，理財就是將資產合理分配，並努力使財富不斷累積的過程。


    但是我們也應該明白，投資增值並不是最終的理財目標，而是我們達成人生目標的手段。理財分為財富的積累、財富的保障、財富的增值、財富的分配四個階段，不同的年齡段有不同階段的理財需求。比如剛剛畢業的年輕人，處於財務積累階段，他們最大的投資應該是自身投資，比如參加一些培訓，擁有更多的本領以便於掙更多的錢。而對於一些有經濟實力和投資能力的人來說，則應對資產的增加值一個量上的目標。


    # 保證老有所養


    隨著老齡化社會的到來，及早制訂適宜的投資理財計畫，保證自己晚...'
  merge: -1
  img_proc: true
- pgno: 43
  md: '年生活獨立、富足，是現代人將面對的共同問題。養老計畫中要考慮退休的年齡、預計退休後每年的生活費用、預計通貨膨脹率、預計退休後每年的投資回報率等問題。


    # 保證資金安全


    資金的安全包括兩個方面的含義：一是保證資金數額完整；二是保證資金價值不減少，即保證資金不會因虧損和貶值而遭受損失。


    真正的投資者，是要有一種節制態度的，不是賺得愈多愈好，而是要清楚產品的風險和收益情況。比如投資股票和基金，好的情況可能有40%、50%的收益等，但壞的情況可能會虧掉20%、30%，上下限是很寬的。而後銀行理財產品，最好的收益可能並不高，只有3%、3.5%，但最壞的情況也沒有多壞，本金不會損失，它的上下限就很窄。但好與壞發生的概率是有時周性的，可能一段時間很多人去買基金，就是人們普遍認為它發生壞情況的概率比較低，或者說一到兩年之間發生壞情況的概率比較低，但兩年之後，可能出現壞情況的概率就比較高了，所以我們不但要對概率的風險性有很好的把握，對概率的時間性也要有一定的認識和把握。


    # 提供贍養父母及撫養教育子女的基金


    「老有所養」、「幼有所依」是中國自古以來的傳統，現代社會這兩方面的成本都很高，對我們每個人來說都是不小的挑戰。


    父母的年齡、父母什麼時候退休、子女目前的年齡、預計上大學的年齡、有無學費計畫、去哪個國家讀書、大概需要多少錢，這些都是投資目標。比如说要做一個教育基金規劃，小孩今年3歲，18歲上大學，現在大學一年的費用是2萬，並預計以每年5%的比率上漲。而投資收益率也是5%，從現在起每月投入298元；如果投資收益率只是1.8%，從現在起'
  merge: -1
  img_proc: true
