- pgno: 315
  md: '到之前，以優惠條件採取以房換房的方式獲取房產，待時機成熟再予以轉售或出租中謀利。


    # 以租代購


    開發商將空置待售的預售房出租並與租戶簽訂購租合約。若租戶在合約約定的期限內購買該房，開發商即以出租時所定的房價將該房出售給租戶者，所付租金可充抵部分購房款，待租戶交足餘額後，即可獲得該房的完全產權。


    # 到拍賣會上淘房


    許多拍賣公司都會拍賣各類房產。這類房產一般由法院、資產公司或銀行等委託拍賣。基於變現的需要，其價格往往只有市場價格的70%左右，且權屬一般都比較清晰。'
