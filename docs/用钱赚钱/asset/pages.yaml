  md: '每月投入 589 元。


    低。


    正確的理財計畫能幫助我們在風險到來的時候，將損失最大可能地降


    # 防禦意外事故


    所謂意外傷害是指非本意的、外來的、不可預料的原因造成的身體嚴


    重創傷的事件。由於意外風險不可預料，使得它對家庭的傷害也愈大，讓


    人備感生命的脆弱。所以理財的過程中應該考證意外的事故，如大病、自


    然災害等。


    # 提高生活品質


    經濟狀況的逐漸改善，是提高生活品質和增加生活樂趣的基本保證。


    投資理財的目標就是使我們的財務狀況處於最佳狀態，滿足各階次的


    需求，從而擁有一個幸福的人生，這也是我們投資理財的最終目標。


    事實證明，資本也並非是獲取成功的唯一條件。人的貧窮的根源，歸


    根結底是由於思想的貧窮。所以，要想富起來，首先就要讓你的頭腦豐富


    起來，弄清楚自己理財的真正目的是什麼。'
