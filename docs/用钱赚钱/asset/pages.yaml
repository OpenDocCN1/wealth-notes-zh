- pgno: 343
  md: 此類產品投資的信託計畫由政策性銀行或國有商業銀行提供連帶責任保證，並且信託公司資金帳戶由銀行進行帳戶嚴密監控，確保資金專款專用，收益相對穩妥。銀行作為投資者的信託代理人，為投資者選擇優質的信託計畫專家和信託公司，並代理投資者與信託公司間的簽約和追償事宜。
