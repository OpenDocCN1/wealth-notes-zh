  md: '饭店属于客户经常性消费的行业，光临次数多，许多隐藏的资源没有发挥出来，以下介绍几种简单增加收入的


    方法，以供参考：


    # 方法1：通过产品的转介绍收取佣金


    这种方法许多饭店都在用，如许多饭店通过向顾客们，提供饮食所相关联的产品来赚取佣金。啤酒，饮料，餐巾纸等附带 큢其它产品，来赚取额外的利润。虽然利润小但是数量多，积累下来收入也是相当大。


    除此之外，还可以通过推荐其它产品和服务，如***公司产品消费券，打折券等。当消费者持此卡券消费时，你将获得佣金提成。也可以将此类信息，印成小册子或消费积分卡等，在店里免费发放赠送给顾客。其实，很多客人对打折类的信息很感兴趣的，关键在于你的想象力。


    # 方法2：闲置多余空间的充分利用


    饭店是人流量非常大的场所，可以将店内的广告位整体出售或出租。如希尔顿大酒店曾经将一家旅馆内，没有起承重的大柱子拆除，设计成漂亮的广告橱窗，出售里面的广告位，每年赚取大量的额外利润。国外有家饭店在餐桌上设计名片展示位，向名片提供者收取展位费。


    你还可以在店内，采用设置广告牌，海报，冠名权等多种手段，展示企业或产品的相关信息，将饭店的额外空'
  merge: -1
  img_proc: true
- pgno: 40
  md: '间充值利用起来。


    或据上自动售卖机等自动服务mittance的产品等的方法，终您带来可的额外利润来源。


    # 方法 3：使用消费充值卡，赢得新客户


    通过办理会员制的方法，将新客户发展成为老客户。如果你的店里老客户多，消费次数多，你可以推荐其办一张会员卡。凭借此卡来消费时可以享打折的优惠。初次消费后由于卡内有余额，下次他还会来消费。你便有一群稳定的客户，新客户也变成回头客，甚至为你带来他们大量新的同事或朋友来消费。


    国外有家某氏餐厅，就是采用会员制的方法。当客户首次消费完结账时，服务生会询问顾客，如果办理一张会员卡的话，（当然要充入一定金额的现金），就可以不用支付这顿饭的饭钱，结果生意发展很兴隆。


    其实，这样做，首次消费的费用，可以在以后的消费中冲抵。重要的是，你有一批稳定的客户。


    也可以采取消费优惠卡，可以流通转借的方式。如果持卡人的亲戚或朋友持卡也可以享受优惠，并可以获得一定的积分。积分一定时，还可以冲抵消费现金。'
