- pgno: 27
  md: '卷心菜（叶菜） 1斤 鳕圆型


    盐 少许 食用盐


    （注：比例不变，一般一天煲一次，括号中菜名为各地别名。）


    # 【做 法：】


    +   1、洋葱去皮，用水冲洗干净，切成角形。

    2、青辣椒用水洗净，切成小型块状，去除籽。（注：辣椒茎不去）

    3、芹菜用水洗净，切成斜段。将以上5种菜放入大袋内，注满清水，翻滚后，慢火煲3小时左右，余下汤水即可，汤水可浓可淡，你可以用盐调制你喜欢的味道，但不能放入动物油类。

    4、番茄用水洗净，切成小块状

    5、卷心菜洗净，切成三角形小块状。


    # 【服用方法：】


    +   第 1 天只吃香蕉以外的水果配瘦身汤

    第 2 天吃水果和豆类以玉米以外的生菜配瘦身汤

    第 3 天除马铃薯外，生菜水果皆可随意吃，配瘦身汤

    第 4 天吃香蕉（最多三根）和脱脂奶配瘦身汤

    第 5 天吃 3 百至 7 百克牛肉加 6 个西红柿，多喝水和至少一次瘦身汤

    第 6 天牛肉蔬菜随意吃配瘦身汤，不可吃马铃薯

