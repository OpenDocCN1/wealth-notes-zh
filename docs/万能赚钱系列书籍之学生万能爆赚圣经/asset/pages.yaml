  md: '刚制作完成的产品，可能看起来比较粗糙和原始。可以找个这方面的高手，将你制作的作品完善，美术加工等，这样就可以让你的产品，更大的吸引人，令人产生好感！


    如果是份策划，营销报告或##资料，做个好的封面，或者是正式的文本，可以很大程度增加产品可信度和正式性，另外还包括加些图片和文字说明，引用客户见证，结果报告等内容。


    此外，为了让你的产品看起来更加吸引人和有价值，附加一些免费的赠品必不可少。可以是一个或者是多个赠品。因为不排除有些购买者，可能出于对你的赠品感兴趣，激发起购买欲的。


    # 第六步：电话/短信推销你的作品


    产品包装后，就该让你的产品和客户见面了。可以通过很多方式如电话，短信同你的潜在客户


    天使策划版权所有


    联系推荐。让客户了解产品的功能，作用好处，继而对其产生兴趣。你要把客户认为对自己帮助最大的地方，着重说给他听，讲解清楚。当客户愿意了解更多的时候，你可以通过邮件，说明手册之类的方式，更详细介绍你的产品，有必要时加上图片，使用例证和报道引用等方法。


