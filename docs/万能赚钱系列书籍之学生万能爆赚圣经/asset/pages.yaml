- pgno: 10
  md: '# 第七步：实施零风险承诺


    当你的产品作用或效果，客户已经产生好感，或者已经充分认可的时候，你要做的重要一件事情，就是帮助他们下决定。激发其马上行动并付款购买。当客户并没有马上行动时，就表示他还有顾虑，可能是对你的诚信，对产品质量，以及售后服务等还放不下心。你要做的就是一个个解决这些问题。


    解除客户的购买顾虑，很好的一個办法，就是把这些客户认为潜在的风险给消除掉，可以实行不满意 退货退款的方法。期限可以是15天，一个月或更长时间。


    结果表明，随着时间延长，退货率会降低，因为很多人已经淡忘掉这些事情。产品销售实施零风险承诺，对客户来讲这样做自己的风险很低，没有太大的损失。对你来讲如果质量真的很好，退货也自然会很低。否则就是你的产品质量太差劲，趁早更换你的产品。


    客户既然要购买就是很需要，如果有效果高兴还来不及；即使没有说的那么好，很多 还是可以接受的。因为真的要去退款退货，毕竟是觉得很别扭的事。只有迫不得已，极度生气，产品实在太差了才会来退。


    # 第八步：成交


    当客户决定购买时，就要确定采用什么付款和支付方式等细节的工作。确保要做到发货及时，保质保量，快速的将客户的产品，按日期送达到他们的手中。如果中间需要很长的时间，比如一个星期左右'
  merge: -1
  img_proc: true
- pgno: 11
  md: '才可以收货，一定要发货后，及时电话或其它快捷的方式，送达给客户您的发货单据等信息。因为客户付款后都非常希望快点看到商品，及时联系他们可以让客户放心，也是对你自己诚信的一种表现。不要让他们感到不安，失落，或产生后悔购买等心理，因为有时由此产生毁约的情况也是有的。


    # 第九步：向你的客户销售更高价值的产品


    客户的需求是多方面的，生理上，心理上，物质上等。只要你了解了这些需求，你就可以向他们兜售他们所真正需要的东西。如果他从你这里第一次的购买经历是成功，愉快和满意的，便会对你产生信赖感。你就会更容易的向他们推销其它产品。因为人们往往喜欢在他们觉得信赖的人，或者地方去购买消费。有这样的机会，你可以向你的客户推荐，和出售更多有价值的，更高价钱的产品。


    当你首次向客户销售的是 10 元的产品，接着你可以向其推荐 20 元，50 元甚至更贵，更有价值的东西。因为你比别人更加了解这些人的真实需要。


