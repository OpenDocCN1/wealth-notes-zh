    # 【3 神奇瘦身汤】


    咨询 QQ： 945854598


    这是一种在美国及世界各地都十分风行的减肥办法。其理论基础是国际上许多专家提出的“喝


    汤所吸收的热量极少”，和“喝汤有利于营养物质的吸收，可以保持


    身体所需营养的平衡”。


    > 【98年香港翡翠电台曾以“香港艺人绝密减肥餐单”做过此快速瘦身汤减肥法的专题报道。】


    # 【配方：】


    +   - 洋葱 2-2.5 斤 圆型

    - 青辣椒 0.5-1 斤 辣或微辣

    - 芹菜 1斤 正品

    - 番茄(西红柿) 2.5-3 斤 正品'
