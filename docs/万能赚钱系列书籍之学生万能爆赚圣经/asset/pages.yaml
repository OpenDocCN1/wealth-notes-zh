  md: '括很多的成年人内，他们的思维都被限制了，大脑中有太多的不可能，阻碍了他们发挥出自己的潜能，有时候可能仅仅是换种思维和方式，就可以找到答案，但事实上，这样去做的人，实在太少了！


    通过本书的一些内容，我想让你明白一个道理，不管你做什么事，方法很重要，这种方法是可以模仿的。对任何行业，任何产品来说，这些方法都是可以通用的。如果方法有了，缺少的就只有行动了；没有行动的支持，一切都是空谈。当你购买并开始阅读这本小册子的时候，已经证明了这些方法产生效果了，因为我本人这些方法的效仿者。不过，每个人的基础不同，条件不同，所适用所产生的结果，使用的方式也会有所差异，但原理是一样的。


    你可以吸收并运用这些方法，在你的身边；也可以让这些知识变成你的收藏品，完全取决于你自己。我相信，没有无用的信息，只有无用的人。相信我，学习并运用这些，你将会变成一个不可思议的人。


    我并不是来给你讲故事的，动辄成千上万字的厚厚书稿拿给你，那样只会浪费你的时间和精力。如果有厚实的家庭可以依赖的话，也许犯不上费心的阅读这些；如果不是，我希望这本册子成为你日行伴你的朋友，学习，练习，运用它。把简单的事情做到伟大的人，才称得上是聪明的智者。


    很多人认为，学生谈钱是件坏事情，学习才是主业。在这样的氛围之下，任何将二者联系在一起的人和思想都将会受到排挤和攻'
