  md: '击。但是，我们也应该看到，我们当中有一部分学生，尤其是一些来自经济比较不富裕家庭的学生，来自金钱方面的压力，已经不能忽视，有的还很严重影响到学生的心理。于是为了缓解这种压力，出现很多学习之余去兼职，做家教，促销等现象，不乏有些可能是为了锻炼自己。过早的了解一些有关财务方面的东西，有时也是很有必要的。遗憾的是，而这些却是学校不能提供给我们的。


    我只是希望通过书中一些知识和技巧的学习，可以让您在学习之余，对于自己的未来和就业，尤其是一些即将走出校门，面对就业的学生朋友，实现多接触和了解些有关金钱和财务方面的知识，如果你真的认真的去做的话，你绝不会在毕业后就业的道路上无所适从的。


    无论什么时候，什么情况下，无数次的实践经验告诉我们，掌握一门好的技巧，正确的方法，要比你百般辛苦更轻松，更容易地适应这个社会。当这些方法逐渐为你积累知识和财富的时候，你会比你身边的人更快的行走。学习很重要，早先掌握一些财务销售方面的技巧更重要。要知道很多美国学生在中学，大学时已经是一名很精明的财富高手了，比尔盖茨就是很好的例子。在美国一次商业调查中，16岁以下完全靠自己挣到百万财富的孩子上百位之多，不要以为这只是国外的奇迹。


    不管你承认不承认，我们已经步入了一个离不开金钱的时代，无论是好事，还是坏事，多学习一些这些方面的知识，没有坏处！'
