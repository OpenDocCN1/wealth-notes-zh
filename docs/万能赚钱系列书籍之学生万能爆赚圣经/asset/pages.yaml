- pgno: 7
  md: '通过一部手机就可以轻松地完成上面这些工作。


    # 第一步：寻找特定的对象（即确定你要赚谁的钱？）


    你可以通过报纸，如 DM 直邮广告；流行杂志，电视直销节目，互联网网络，广播电台等诸多 的媒体上面，获得众多商家的具体信息。


    有些包括广告发布单位的地址，电话，联系人等详细

    信息资料。特别是一些分类板块，已经将各类信息分成很多类别，更容易你去整理和寻找。


    比如招聘类，售房类，家电类，征友类等，你可以将此类的信息多收集几期，或者是找些合订本，这样下来，你的手中就掌握了大量的客户信息，这些将是为你带来财富的源泉。


    # 第二步：锁定你的目标个体且细化


    目标细化更容易帮助你迅速找到利润点。如当你从报纸中整理出的客户资料中，分出减肥美的客户名单，这就是细化。好处是可以将你的精力，财力做到专注到很小的范围。


    # 第三步：找出其最迫切的需求


    锁定你的目标之后，找出这些客户最迫切的需求。他们最想要什么？

    最关心什么？最怕什么？


    天使策划版权所有


    最气什么？最喜欢什么等问题。如果你不知道，那就去做一份这方面的调查，如果调查真实，结果将会告诉你这些答案。然后将这些需求大概的描述出来，最好是'
  merge: -1
  img_proc: true
- pgno: 8
  md: '用笔写出来，逐步的将它具体化，明确化。比如想赚钱，要具体到赚谁的钱？赚多少钱？要在多长时间内完成等等。


    编著：天使策划咨询有限公司《学生万能爆赚圣经》


    # 第四步：在威客网完成产品的制作。


    将你想要的答案和结果，发布到威客网任务上面。如猪八戒网，威客中国等；在威客网上，合理设定你的价格，将有成千上万有才识的人，等着为你出谋献策。你所做的只是将他们，在所递交上来的无数作品当中，将最佳的答案或产品定下来。而这些很棒的产品和创意，你只需要付出一丁点钱就可以办到。


    你也可以在威客网站上，查询已转完成的稿件和方案。有些已经完稿的作品会留有记录，


    如有一个威客任务标题就是：


    如何增加出租的客源？


    任务标题下面就有很的应稿作品，可以直接查阅内容，多为Word或表格文件。你需要将这些投标的稿件收集整理。有些应稿作品由于为了保密，加了密码，就看不到了。不过，每个任务最好都会有中标的稿件。那么这个中标的稿件内容，一定会受发稿者中意和接受。


    而你只只要同这个个人联系一下，告诉他可以共同的开发这个内容，共同运作分享利润的办法，来解决和共享这些资源。


