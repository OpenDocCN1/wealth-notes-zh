    ## 8. 例会閉幕詞


    社長

    澄川小百合


    所有的朗讀都已經結束了。


    怎麼樣？各位是否樂在其中？


    火鍋料剛好全部吃完，最後的鹹粥成為今天火鍋的結尾。


    啊啊，你們怎麼了？怎麼都不說話？雖然光線太暗，我看不太清楚……你們該不會都在發抖？我聽到玻璃杯都發出嘎答嘎答的聲音。


    什麼？逸美剛才的小說？


    對，那真的是逸美交給我的，的的確確是逸美所寫的。


    沒錯，逸美全都知道，她早就識破你們骯髒的企圖，識破了你們姑息、愚蠢而膚淺的陰謀。


    你們這幾個愚蠢的女孩，你們為什麼不乖乖讓她照顧你們？為什麼不乖巧順從，讓她好好疼愛你們呢？我知道你們整天提心吊膽，因為只要逸美的一句話，就可以摧毀你們的人生。一旦逸美說出了秘密，你們就徹底完蛋了——你們每天的生活都承受著這樣的威脅。但是，這不正是所謂的謀略嗎？逸美很擅長謀略，所以，她很懂得隨心所欲地操控別人，充滿令人難以抵抗的魅力。


    沒錯，逸美是天生的蛇蠍美人，她毫不掩飾自己的強勢，把妳們的秘密握在手里，利用這些祕密，讓自己成為中心人物。所以，妳們也應該在她面前完全示弱，假裝緊抱她的大腿，鑽進她的懷裡，徹底扮演好配角的角色。如此一來，彼此都可以相安無事……


    啊啊，各位為什麼哭啊？妳們到底在害怕什麼？——喔，是為了火鍋裡加的鈴蘭嗎？沙龍內伸手不見五指，不知道火鍋裡到底放了什麼，即使有奇怪的味道和香味，也不會有人覺得奇怪。正因為這樣，逸美才選擇今天做為復仇的日子。對，沒錯……我的確親手加了鈴蘭。


    啊嗷啊嗷，即使現在衝去門口也沒用，因為門已經從外面鎖住了，窗戶也一樣——沒錯，妳們無法離開這裡，無法離開逸美設定的復仇舞台。這個沙龍是舞臺，妳們是演員，逸美是導演。在導演喊卡之前，妳們無法離開舞台。什麼？突然冒汗？眼冒金星？胃痛不已？渾身發抖？想嘔吐？


    妳們不要責怪我。沒錯，妳們說對了，我是這項計畫的首謀。逸美對我說，她想要復仇時，我仔細地思考，預測了所有的情況後，建立了縝密的計畫，讓妳們心生畏懼，同時能夠讓逸美和北條老師幸福快樂的方法。但是，歸根究柢，不是因為愚蠢的妳們設下了圈套嗎？


    不要太大喊大叫，因為不會有人聽到妳們的叫聲，這樣也很失態。我們無論在任何情況下，都不能忘記自己是值得驕傲的、聖母女子學院的學生，不是嗎？


    先喝一口雞尾酒，讓心情平靜一下吧，然後繼續聽我說下去。


    請妳們冷靜之後好好想一想，為什麼由我代為朗讀逸美的小說？


    逸美在小說中提到，她會趁著漆黑來參加今天的例會，但她並沒有現身。難道逸美放棄了親手復仇的機會嗎？不，不是這樣的。逸美是一個有仇必報的人，而且，她今天的確來到了沙龍，雙手抱著一大束鈴蘭花向妳們復仇。


    今天中午，逸美和我一起例會做完準備工作後，一起喝著伯爵茶，朗读了剛才的小說給我聽。她的雙眼發亮，聲音因為歡喜而微微顫抖。


    「妳覺得怎麼樣？」逸美問我。


    「我覺得很棒。」我坦誠地表達了自己的感想，也發自內心覺得她的作品很出色。充滿花香的美麗復仇，這是建立在女生對美的意識基礎上的完美復仇，我由衷地為自己參與了其中一部分感到高興。


    「能夠安排這麼完美的計畫，全都是妳的功勞。」逸美這麼對我說。


    逸美聰明又美麗，能夠隨心所欲地利用所有的人和事，實現自己的慾望。她無情而冷酷，激烈而堅強，不屈不撓，自私自利──但這正是逸美的魅力所在，也正因为此，才充滿刺激。


    在初中部第一次遇見逸美時，她就是這樣的人。我很崇拜和我個性完全相反的她，卻絕對不主動接近她。那時候我經常生病，每次請假就會被同學嘲笑，在學校很不起眼。


    有一次，我又向學校請了一個星期的假。當我想到又要被同學欺負，忍不住帶著憂鬱的心情回去學校上課時，發現那些惡作劇的學生全都被學校退學了。放在教堂的聖杯和修女的經珠，以及學生的貴重物品多次在學校失竊，結果都在她們的書包和置物櫃裡找到了。我驚訝不已，逸美偷偷對我露出微笑，向我點了點頭。我立刻知道，一切都是逸美安排的。


    我不知道逸美為什麼為我做這些事，就像我在逸美身上看到了自己所沒有的東西，進而被她吸引，也許逸美也和我有相同的感覺。我們在那個時候強烈地、強烈地結合在一起，我決心成為和逸美個性相反的好夥伴。


    如同全心全意把克莉絲汀培養成明星的魅影，讓福爾摩斯的推理更出色的華生，在背後默默支持郝思嘉的韓美蘭——為了讓自己的夥伴綻放光芒，他們都不遺餘力地付出。雖然彼此個性相反，卻相互依賴——沒錯，他們兩個人合為了一體，夥伴綻放出光芒，他們的生命才有意義。


    所以，只要逸美願意，我會為她實現所有的願望。我為她投入了所有的身心，就是為了讓她能夠持續綻放燦爛的光芒。


    逸美陷入了老師和女學生之間這份禁忌的愛後，為她增添了宛如燃燒般的美麗。雖然她的言行舉止看似冷靜，但內心燃燒著熱情之火，這把火也照亮了她自己——看著她因為這份激烈的愛而散發出帶著性感的妖豔，我感到驕傲和滿足。


    所以，當我得知的背叛時，也許我比逸美更加生氣。我絕對不允許妳們破壞，我絞盡腦汁想出了把妳們徹底逼入絕境的方法。揚言自殺、私奔、在例會上展開復仇——為了心愛的逸美，為了保護我的作品白石逸美，我綿密地研擬了所有的計畫。


    想到今天晚上，所有的計畫都將在這個沙龍開花結果，我感動得忍不住發抖。


    「今天的例會結束後，我再也也不會回來這裡了。」


    逸美說。


    「是啊……雖然有點難過，但這也是無可奈何的事。」


    「鄉下的生活很不錯，小百合，妳有機會來找我玩。」


    「謝謝。」


    「我以後的生活只要有老師就滿足了，我要生可愛的孩子，生很多孩子，成為一個好媽媽。這是我現在唯一的夢想。」


    逸美笑得很甜美，我從她的笑容中看到了平凡母親的表情。雖然只是短暫的剎那，但我觉得得一清二楚。


    逸美喝著伯爵茶，興奮地談論著和老師共同展開的新生活、未來的事和兩個人平靜的生活，談論著日常生活中的微不足道的喜悅。她那雙富有攻擊性的眼睛越來越溫和，線條俐落的嘴脣也越來越柔和。


    逸美竟然會露出這麼庸俗、平凡的表情。我不禁愕然。諷刺的是，我的努力和貢獻竟然奪走了逸美身上難以抗拒的魅力。老師和學生戀愛這種禁忌的狀況磨練了逸美的魔力，所以我協助他們這場戀愛，沒想到逸美竟然從中找到了安定。


    我著急起來。我至今為止的努力，不是為了看到逸美變成這樣。我做了無可挽回的事——看著一臉幸福的逸美，我茫然地呆立在原地。


    但是，就在這時：……一個念頭掠過我的腦海，腦袋中響起一個聲音，好像有人在耳朵邊呢喃。


    比起眼前的逸美，我更适合當主角。


    啊，在我耳朵邊呢喃這句話的是天使？還是惡魔？我愛上了這個想法。


    如果克莉絲汀、福爾摩斯和郝思嘉失去了身為主角的光芒，魅影、華生和韓美蘭很自然地想要成為新的主角，把故事延續下去。


    主角交換。


    主角從逸美變成我。


    沒錯——從那個瞬間開始，這個沙龍就從逸美的復仇舞臺，變成了主角交換劇的舞台。


    主角換人做……這是一件大事，也是新的高潮。為了襯托出新的主角，前任主角必須華麗地殞落，而且，這場交換劇需要觀眾。我迅速思考，很快想到可以利用逸美準備的復仇小道具。


    > 沒錯，我把鈴蘭加進了伯爵茶的茶壺中。


    正如逸美在小說中提到的，即使她消失，她的家人也以為她私奔了，老師以為逸美被她的家人帶回了家，我可以用自己的雙手，讓逸美以最美麗的姿態離開這個世界。炫目的水晶燈下，逸美緩緩倒在被滿鈴蘭花的地上——啊，這是多麼唯美的景象，也許那一剎那的白石逸美，才是我打造的完美作品。


    基督把自己的聖體和聖血分給祂的門徒和信眾得到了永生，同樣地，妳們在未來的人生中，必須和逸美一心同體，銘記著她的美丽——妳們背叛了逸美，這是妳們的義務，因為逸美那美麗、高貴、驕傲和高潔的靈魂已經進入了妳們的身體。


    請妳們記住，從今天開始，澄川小百合的故事翻開了第一頁，妳們以後要為我的故事增色，但請妳們充分注意自己的言行，因為如今是我掌握了妳們所有人的秘密，而且，妳們今晚所吃的――是分給妳們，妳們一輩子也無法抹去的新罪證。


    差不多該打開水晶燈了，我為各位送上最後的甜點，那是我從一大早開始為各位精心烤出來的「維納斯的手臂」。哪一位――高岡同學，可不可以請妳幫忙切一下？啊喲，各位怎麼在發抖啊？而且臉色蒼白。小南同學，妳從鍋子裡拿出來的手錶，是和去年一樣的香奈兒限量款吧？逸美很喜歡，每天都戴著，現在終於屬於妳了，太好了。


    啊，話說回來，當主角的感覺太愉快了。請各位為我乾杯。


    本學期的朗讀會也非常出色，雖然逸美已經不在了，但我們要充分利用她留下的沙龍和藏書，我相信這是對她最好的憑弔。


    外面仍然狂風暴雨，請各位回家時小心。今天感謝各位的蒞臨。


    本學期最後一次例會到此結束。


    各位請多保重。


