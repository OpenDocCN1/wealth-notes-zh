    ## 读书方法的革新


    在这厚厚的书中整理出 5W1H 或是 6W1H，或是 6W2H，再与现代的情势、风潮进行比较检讨。一旦掌握了诀窍，读书会不再成为我的痛苦。


    以司汤达的《红与黑》为例。


    -   **WHEN**… 十九世纪，王朝复辟时代

    -   **WHERE**… 法国

    -   **WHO**… 出身贫穷的朱利安·索雷尔

    -   **WHAT**… 二十三岁被判死刑

    -   **WHY**… 觉得遭到以前偷情的有夫之妇背叛，试图枪杀对方

    -   **HOW**… 充满野心，想要同时得到权力和爱，却不幸失败而身败名裂


    即使到了现代，被权力和财力玩弄于股掌的人类本质仍然没有改变，但当今的日本人却缺乏像朱利安那样的毅然和高贵，为了追求纯粹的爱，甚至愿意接受死刑。


    再以菲茨杰罗的《大亨小传》为例。


    -   **WHEN**… 一九二〇年代，第一次世界大战后

    -   **WHERE**… 纽约郊区长岛

    -   **WHO**… 神秘的富翁杰·盖茨比

    -   **WHAT**… 遭人嫁祸，遭到枪杀

    -   **WHY**… 为了得到前女友的爱，试图从她现任丈夫手上把她夺回来

    -   **HOW**… 在他上战场期间，女友嫁给了富翁。为了抢回女友，拼命追求不符合他身份的财富和成功


    人总是在追求自己得不到的东西，像是爱情，像是权力，像是社会地位，但是，不顾一切地追求这些的身影很愚蠢，也很悲哀。我们不断追求着像盖茨比那样纯粹而华丽的男人——因为我们知道，世界上并不存在像他那样的人，他只是梦幻。


    我开始在读书会上积极发言，逸美为我感到高兴。有一天，她问我：「你的着眼点都很有趣，你是怎么理解这些作品的？」我拿出写了 5W1H 的纸给她看，她忍不住大笑起来：


    > 「园子，这太像你的作风了。你不是用感性，而是用理性在阅读。」


    虽然我无法正确理解文学，但我加入文学社是正确的决定。首先，增加阅读能力有益无害，其次，可以经常吃到小南亲手制作的绝佳甜点。最后，文学社举办独特的暗锅朗读会。


    ### 暗锅朗读会


    这个文学社已经有好几年没有招募成员，休社了好几年，白石逸美上高中后，让这个社团重新复活了。当时，担任社团顾问的北条老师把代代相传的“文学社规则”传承给逸美。这份规则上写了如何在读书会分享心得，如何举行讨论会，以及暗锅朗读会及其规则。


    -   阖上所有的灯，必须在黑暗中进行。

    -   必须由社长担任主持工作，也就是“锅管事”。

    -   参加的成员不得公布带来的火锅料内容。

    -   火锅料不是食物也无妨，但仅限干净的东西。

    -   由社长亲自制作甜点，必须提供美味甜点供成员餐后享用。

    -   朗读小说者须在另设的朗读区朗读。

    -   在黑暗中听他人朗读的同时吃暗锅。


    虽然很惊讶到底是多么标新立异的人，才会想出这种朗读会的方式，但实际参加后，发现非常有趣。吃暗锅时，会战战兢兢地把筷子夹到的东西送进嘴里，嘴唇碰到时的感觉很可怕。发现和自己原本想象的味道不同时，浑身都会起鸡皮疙瘩。原本以为在这样的状况下，根本不可能听别人朗读小说，令人意外的是，别人朗读的内容比起在明亮的房间内，比自己用眼睛看更能够进入脑袋。朗读激发了想象力，宛如一本书摊在面前，所有的情景都会浮现在眼前。黑暗可以活化大脑，让情节更鲜明地视觉化。


    同时，也可以刺激参加者恶作剧的心理。虽然文学社规定不得公布每个人带来的火锅料内容，不瞒各位，我去年带了草莓大福、榛果和香奈儿手表。草莓大福都溶化在汤里，鱼、肉和蔬菜都变得甜甜的，整锅食物都变得很难吃。在其他人边吃边忍不住发出惨叫时，我独自偷笑着。榛果的口感很硬，有人惊叫：“里面放了石头！”再度让我露出得意的笑。之所以会带香奈儿手表，是想要把谁都想不到的东西放进锅里，让所有人大吃一惊。逸美拿到手表时很高兴，其他人都很羡慕，我很想炫耀说：“那是我带来的！”但因为文学社规定必须保密，所以只好忍住了，不过还是觉得有点可惜，直到今天还在为这件事后悔。


    ## 复活节与圣灵降临节游园会


    文学社的活动并非只有读书会和暗锅朗读会而已，复活节＆圣灵降临节游园会也是一项重要的工作，因为我在今年的复活节活动中担任执行委员长，所以很少参加社团为游园会做的准备工作。


    去年我担任执行委员，在帮忙的时候，看到委员长整天忙得不可开交，觉得她“太辛苦了”，忍不住有点同情她，但今年我担任了委员长的工作。


    执行委员长要为海报设计的事和美术社的人讨论，制作发给左邻右舍的宣传单，和合唱团讨论音乐的事，还要订购找彩蛋活动所用的鸡蛋，整天都有忙不完的事。宣传单上必须用简单的方式介绍复活节的由来，让即使对天主教很陌生的大人和小孩也能够了解。绞尽脑汁之后，最后写出了以下内容。


    ### －复活节（主复活日）


    是庆祝基督耶稣死后复活的节日，从复活节开始的五十天期间，称为复活节期，五十天后称为圣灵降临日，也就是圣灵降临的日子。为了庆祝这些重要节日，本校每年六月都会举行慈善游园会。


    游园会时会举办找彩蛋活动。在象征生命的鸡蛋上涂上颜色后，藏在学校内，然后请参与活动的朋友找出这些彩蛋。


    同时举办慈善拍卖，设有咖啡区，请各位务必光临。


    校内还设置了捐款箱，事后会将募集到的款项捐给红十字会和老人院等相关机构。


    基督耶稣至今仍然活着。


    基督永生。


    除此以外，还要寄发电子邮件请家长捐款和帮忙，或是联系業者在校园搭建舞台，有一大堆辛苦的事情要做，但我之所以愿意担任委员长的工作是有原因的，因为我想回报这所学院的董事长白石先生。


    白石先生是逸美的父亲，除了本学院以外，还多元化经营综合医院和商业设施。一般说来，学生根本不可能见到学校的董事长，但白石先生与众不同，他经常来到学校，和学生相互沟通，听说还会确认所有学生每个学期的成绩。看到学生成绩不佳时，就会安排特别辅导，同时会参观老师的授课，了解老师的教法是否有问题。


    白石先生向来以“学校经营是极致的服务业”为原则，认为提升学生的学力和道德意识是学校的绝对义务。


    他也积极参加学校的各项活动，尤其对复活节活动投入了很大的心力，他认为“这是让学校附近的民众了解基督的爱和精神，同时回馈他们的最佳机会”，所以亲自参与企划的细节问题。


    我个人曾经受过白石先生的恩惠。我以前就很想参观人体解剖，但我父亲开的是小诊所，和手术或是解剖无缘，但我一直认为既然立志成医，就必须找机会参观一下。所以，去年担任执行委员时，我主动要求担任有更多机会和白先生接触的报告员，在第一次见到他时，就拜托他是否可以安排我去医院参观，原以为他会说：“这不是小孩子的游戏”，当场拒绝我，没想到他欣然应允。


    「好，我会向外科主任打招呼，你可以随时打电话去医院。」


    隔周，我就和解剖学的教授和实习生一起站手术台前。我当然没有拿手术刀，只是在旁边看而已，但不是从图片或照片上，而是亲眼看到人体的器官让我获益无穷。解剖时，肃然地取出大脑、心脏、肺脏、肝脏、肾脏和血管等器官，切成薄片。原先以为自己会想要呕吐，或是受到很大的冲击，没想到心情格外平静。


    也许是因为我无法把死亡和眼前的尸体连结在一起的关系，对我来说，在我眼前切成片状的器官并不是什么怪异的东西，而是促进医学发展的宝贵资料。


    解剖结束后，我确认了一件事。


    人体内并没有灵魂。


    我亲眼目睹了脑细胞的每一个角落，心脏的每一个部分，以及从头顶到脚底的一切，确认完全没有容纳灵魂的空间。喜悦、悲伤、愤怒、嫉妒都是在脑浆这个极小的器官中发生的，扁桃核、大脑边缘系和大脑新皮质掌控了人类的情感。人并不是因为有灵魂而活在世上，而是呼吸将氧气带到全身，身体分泌了生理活性物质，随着血液循环进行代谢，使人能够存活。在参观解剖之后，我深深了解到，活着只是一件生理的事。


    虽然我读的是教会学校，但我并不是天主教徒，并不相信上帝这种不科学的存在，也不了解圣灵和永生有什么意义。因为我只相信自己亲眼看到的事，但是，如果上帝和灵魂可以成为人的精神支柱——尤其如果可以成为病患的希望——身为医生，为了能够使病人保持心灵宁静，就必须深入了解，并且面对这个问题。


    参观解剖之后，我有了很大的改变。生存是什么？如何死亡？上帝是什么？医生该做什么？——我深入思考了这些问题，再度下定了决心，要带着真挚的心立志成医。


    所以，在今年的复活节游园会时，我主动争取当执行委员长，努力回报在前一年给了我宝贵机会的白石先生的恩情。


    在新学期开始的同时，就开始着手进行复活节游园会的相关准备工作。


    复活节是在四月，很多教会和教会学校都在那个时候举办活动，但我们学院通常在六月中旬举行，一方面可以避开刚开学后的仓卒，另一方面可以同时庆祝圣灵降临日。


    我在去年担任报告员时，只去过白石家几次而已，但在担任执行委员长之后，经常上门和白石先生讨论事情。每个星期都会和白石先生见面数次，请他对海报的草图发表意见，或是把各摊位的最终名单和预算报告交给他。


    ## 白石先生的信任


    白石先生的事业很忙，时间当然很宝贵，但他没有把这些宝贵的时间用于休息和个人兴趣爱好，而是用在学生身上，让我感激不已，所以我也利用读书以外的所有时间，努力希望把游园会办得更热闹。因此，我们经常热烈交换意见，有时候回过神时，发现已经不知不觉在白石先生的书房内讨论了三个小时。


    我主要在放学后投入游园会的准备工作和讨论事宜上，所以那段时间几乎没有参加文学社的聚会。文学社的成员应该也每天为复活节游园会的准备工作开会讨论，去年做了两百条蛋糕在游园会上义卖，今年我无法帮忙，准备材料和工具和预算管理等工作应该比去年更加忙碌。所以，我每次去白石家时，都没有遇到逸美，逸美八成也忙得不可开交，因为她很像她的父亲白石先生，都很热心，而且是完美主义者。


    「你觉得兔子、兔子跳舞怎么样？」


    有一次，白石先生双眼发亮地提议道。


    「兔子……吗？」


    「复活节兔啊，请学生穿上复活节兔的衣服，在校园内边走边舞，就像是童话世界，光是想象一下，就觉得很开心，你不觉得吗？」


    学院的校舍具有欧洲中世纪的风格，在日本很难看到这样的建筑，复活节兔在校园内跳舞，真的会有童话世界的感觉。难以想象积极并购企业，不断拓展事业版图，被视为冷静的合理主义者而令人畏惧的白石先生，居然会有这么可爱的想法。我差点笑了出来，好不容易才忍住，向他表达了赞同的意见，“我觉得很棒。”白石先生经常提出各种建议，和他聊天是一件快乐的事。


    我立刻借用了他书房的电脑，搜索出租兔子装的公司。


    白石先生允许我使用他的电脑是有原因的。去年的某一天，我去白石家报告进度时，他正在和秘书打电话。他刚完成要寄给分公司的紧急指示，电脑突然当机，无法再启动。我还在读小学时，就开始自己组装电脑玩要，所以对电脑很在行。白石先生请秘书派的人来修理后，心浮气躁地挂上了电话，我主动提出可以帮忙。因为我即使无法把电脑修好，至少可以存取所需的资料。


    我的预料完全正确，在负责修理的工程师带着替代电脑赶到之前，我用安全模式启动了电脑，把必要资料储存在随身碟中。在替代品送到后，立刻插上随身碟，把资料拷了出去，完全没有浪费任何时间。白石先生连声道谢，说多亏有我帮忙，说得我有一点不好意思了。那件事之后，白石先生就很信任我。


    我除了精通电脑，做事情也很迅速俐落。


    白石先生工作很忙，在和他讨论游园会的事时，也不断有工作上的电话找他，我尽可能在他通电话时处理完各种琐事。那天，白石先生挂上电话时，我已经和服装出租公司谈好价钱，预租了十套粉红色兔子服。


    「古贺，你太能干了你毕业后愿不愿意来我公司上班，当我的得力助手？」


    白石先生的称赞让我乐不可支。如果父亲还活着，如果我也这样的父亲，这种时候，我总是忍不住羡慕逸美。


    「太荣幸了。」


    「我是认真的。你比我的秘书更优秀，我向来讨厌别人动我的东西，就连秘书也从来没有进过我的书房，只有你可以进我的书房、动我的电脑。」


    白石先生眯起了眼睛。


    「但是，你以后想当医生，等你当上医生后，一定要来我的医院工作。好，我很乐意效劳。这个送给你，算是微不足道的订金……开玩笑的。」白石先生从办公桌的抽屉里拿出一个包装纸包着的盒子。“我上个星期去巴黎出差，这是送你的礼物。这……你不必客气，这是答谢你愿意担任执行长。真的可以吗？”“当然，你打开看看。打开精美的包装，发现里面是一盒香水。那是我最喜欢的娇兰香水，而且是每年春天限量发行的限量版香水。太高兴了！我每年都会买。太好了，但这件事不能告诉逸美，因为我只买了一瓶。白石先生抓了抓头。”


    「谢谢。」


    死去的父亲再也无法送我礼物，白石先生一定知道这件事，所以不经意地扮演了父亲的角色。


    「我一定会很珍惜，」


    我差点接着脱口叫他“爸爸”，但慌忙吞了下来。


    ## 医院巡礼与邂逅


    学校上课、考试、复活节的准备、文学社、自习。


    我快忙翻了，渐渐有点缺乏动力，即使在家看参考书，也完全看不进去。


    「啊，不行不行。」


    我收起参考书，展开了医院巡礼。星期六上午，应该很多人，但也无可奈何。


    我转了几班电车，来到郊外的一家综合医院。


    果然不出所料，到处都挤满了人。大厅、服务台、急诊出入口、食堂、咖啡店、内科、放射科……我参观了这些地方，看到医生和护理师为了深受病痛折磨，内心恐惧不已的病人奔走。没错，我也要为了这些病人更加努力，有朝一日，我也要投入救治的行列。


    我再度激发了内心的斗志，巡礼结束了。充电结束后，我再度回到了大厅，竟然在那里看到了稀客。


    白石逸美。


    即使在拥挤不堪的医院内，她的美丽依然鹤立鸡群。她也来这里转换心情吗？她的父亲开了一家很有气派的医院，她居然特地来到这家郊区的医院，难道她也在课业上遇到了瓶颈吗？


    「逸美——」


    我想要叫她，但随即改变了心意。因为她脸上的表情很空洞，完全感受不到丝毫的生气。她双眼无神，皮肤苍白得有点病态，好像梦游者，摇摇晃晃地走在大厅。


    星期一上学校后，逸美的样子明显和平时不一样。


    向来积极活泼、快活开朗的她郁郁寡欢，几乎没有笑容。


    ## 蒂安娜·德秋贝的到来


    「逸美？」课间休息时，我叫了她一声。


    「什么事？」


    她的视线很慵懒


    「……没事。」


    「园子，你真奇怪。」


    她淡淡地笑了笑，但笑容很无力。想要立志成医的逸美自己根本像个病人，我原本想告诉她星期六曾经看到她，但最后还是作罢。


    去文学沙龙时，逸美也懒洋洋地躺在沙发上。平时她总是书不离手，如今却听着肖邦的组曲闭目养神。


    「逸美，你不舒服吗？」


    留学生蒂安娜担心地问。


    「对，有一点，身体懒洋洋的。」


    「你太累了，我用玫瑰精油帮你按摩，你去换睡袍。」


    蒂安娜让我换上蚕丝睡袍的逸美趴在沙发上，把芳香浓郁的保加利亚玫瑰精油滴在她的手臂和后背，开始为她按摩。


    「怎么样？」


    「很舒服。」


    逸美开始昏昏欲睡。也许她只是睡眠不足。理科班每天都有很多功课，再加上逸美是学院董事长的女儿，所以应该压力特别大吧。


    但是


    我有一种预感，好像事情并不是这么单纯。


    我看着蒂安娜温柔地持续为逸美按摩放松，忍不住思考起来。回想起来，逸美从今年春天开始，就有点不对劲。


    春天——没错，就是留学生蒂安娜·德秋贝来到这所学校的时候。


    这个学期的第一次全校朝会时，校长在台上介绍蒂安娜时，礼堂内顿时陷入一片骚动。蒂安娜一身白皙的肌肤晶莹剔透，一头漆黑的长发，一双黑色大眼宛如她祖国的黑海般深沉滋润，漂亮的双唇，挺拔的鼻梁透露她的坚强意志。


    蒂安娜的容貌出众，不同于金发碧眼的西方人，也和黑发黑眼的东方人不一样，浑身散发出南斯拉夫人的神秘美丽，制服穿在她身上也很漂亮。以前我一直以为这个世界上不可能有像白石逸美这么漂亮的人，但蒂安娜独特的美丽完全不亚于白石逸美。


    但是，礼堂内的骚动不光是感叹蒂安娜的美丽，她和挂在新教堂的绘画中的女人长一模一样。那幅画的名字叫作“耶稣基督和畏惧基督的恶魔，及其仆人”，恶魔的仆人是女人，竟然和蒂安娜长一模一样。


    > 「我叫蒂安娜·德秋贝，来自保加利亚的雷巴格拉德村，请多关照。」


    留学生用流利的日语向大家打招呼，微微拉起裙摆，单腿伸向后方，低头鞠了一躬。她的动作并不优雅，有点像村姑在跳土风舞，却很惹人喜爱。或许因为这个举止的关系，立刻消除了全校女学生对蒂安娜的黑暗印象，响起了热烈的欢迎掌声，但掌声仍然无法消除我在她身上感受到的阴郁。


    我知道这不像我的作风，但我无法不把蒂安娜和绘画中的女人重叠在一起，内心倍感不安。看到她走下讲台时一瘸一拐的样子，这种感觉更加强烈了。因为那幅画以前挂在其他修道院时，因为发生了火灾，把恶魔的仆人的一只脚烧掉了。


    蒂安娜到这所学校的第一天，就和逸美情投意合。一问之下，才知道逸美之前去短期留学时，曾经寄宿在蒂安娜的家中。既然逸美喜欢蒂安娜，那她一定是好人。我终于松了一口气。


    和蒂安娜交谈后，的确对她产生了好感，也为之前莫名其妙觉得她不吉利感到很惭愧。而且，她的日语很好，对日本文化也有相当的知识。听说原本是她双胞胎的姐姐要来日本留学，但我觉得蒂安娜应该比她姐姐更能够享受充实的留学生活。


    她告诉我们，她住的村庄到处绽满了鲜花，有“花村”的美名。


    「所以，我很喜欢花。」


    蒂安娜在教内各处都种了花。除了教室以外，走廊的景观窗、教师办公室、日光室、更衣室、玄关——无论走到哪里，都可以看到娇艳动人的鲜花，被芬芳的香气包围。一旦适应了被鲜花包围的景象，就觉得以前在充满杀气的环境中度过的学生活太单调了。


    蒂安娜说：“为了感谢这所学院邀请我来留学，我要致赠家乡的花做为纪念。”于是在校舍新馆旁的花圃种了花苗。原以为她家乡的花必定是蔷薇，没想到并不是。


    「提到保加利亚，大家都会想到蔷薇，但我们村庄的铃兰花很有名，初夏时分，整个村庄都陷入一片白色的海洋，美不胜收。」


    「这些花苗是从你家乡带来的吗？」逸美问。


    「对，我请家人寄来，花了一点时间，但幸好还赶得上种植的时间。」


    蒂安娜种了很多花苗，然后用土埋了起来。


    「什么时候开花？」


    「差不多五月中旬左右，这种品种很耐热，花圃刚好位在校舍后方，这里很阴凉，或许可以撑过夏天。」


    「是吗？真让人期待。」


    蒂安娜在逸美的邀请下，理所当然地加入了文学社。


    ## 拉弥亚之宴


    我以为她无法看日文小说，没想到她第一次读书会时，她就看完了《假面的告白》，而且还流利地发表了感想，令我惊讶不已。虽然她一直谦虚地说自己“日语很不灵光”，但只学了一、两年，就可以有这么大的进步吗？


    蒂安娜也认识高冈，经常在沙龙聊起之前在保加利亚时的往事。高冈可能对那段寄宿生活也留下了美好的回忆，经常秀出她引以为傲的单眼相机拍的照片，谈论那些观光地的历史和传说。


    露出纯朴可爱表情的野生狐狸和兔子、山顶的白雪还未融化的山脉，和大自然景色丰富的湖畔——高冈拍的每一张照片都充满生命力，看着这些照片，心灵就得到了滋润。在这些色彩鲜艳的照片中，出现了一张涂成黑色的照片。


    我心头一惊。


    简直就像通知讣闻的明信片般，有一种不吉利的感觉。


    「这张照片怎么了？」


    小百合随手拿起了照片。


    「哦，这张照片啊，」高冈开了口，「是在《拉弥亚之宴》上拍的。」蒂安娜接着说道。


    仔细一看，那张照片并不是涂黑，而是因为在光线很暗的地方拍摄，所以产生了这样的错觉。


    「给我看。」


    小南从小百合手上接过照片端详着。


    「原来大家都穿着黑衣服。」


    照片也传到了我的手上。照片中，逸美站在中间，两侧站着蒂安娜、和蒂安娜长得很像的女人——应该是她的双胞胎姐姐。三个人都穿着黑色羽毛衣，长发披肩，嘴唇擦着红色口红。


    「拉弥亚是什么？」


    小百合问。


    「是巫婆，会吸血的巫婆，保加利亚有很多关于吸血鬼的传说。」


    逸美回答。


    「拉弥亚之宴就是吸血鬼的节日，有点像美国的万圣节。」

