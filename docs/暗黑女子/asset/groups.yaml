    小茜聽了應該很高興，但同時也為我解了圍。因為多虧了逸美學姊這麼說，才不至於讓我顯得很失禮。逸美學姊是一個具有細膩感性的人，能夠在轉眼之間就察覺現場的氣氛，讓在場的所有人都不会感到尷尬。我再度感動不已，逸美學姊果然是一個出色的女生。


    我很喜歡小茜——但有件事一直讓我耿耿於懷。'
  - '[PAGE 205]


    我忘了什麼時候……有一次聽逸美學姊說：「等我畢業後，打算關閉文學社。」我猜想這句話成為一切的起源。逸美學姊畢業就要關閉文學社，也就是只剩兩學期了。


    文學社本來就是為了逸美學姊而存在，因為有她，才會有文學沙龍。社團的成員都隱約猜到逸美學姊畢業後，文學社也會跟著關閉，但還是忍不住有點難過。聽說沙龍可能會捐給孤兒院，或是移建他處。


    沒想到向來溫柔乖巧的小茜突然站了起來，強烈反對關閉沙龍。她咄咄逼人的態度讓在場的所有人都目瞪口呆。


    「你要把這個沙龍從我們手上奪走嗎！」


    「捐贈其他的東西給孤兒院不是就好了嗎！」


    「我絕對不允許這種蠻橫的行為發生！」


    對她來說，這個廚房是她心靈的寄託。她家開的料亭因為一場火災付之一炬，原本順利進行的西餐廳計畫也因此擱置，對她來說，可以自由製作甜點和料理的這個廚房，幾乎變成了她生命的意義。這種說法絲毫沒有誇張。'
  - '[PAGE 206]


    但是，逸美學姊的意志也很堅定，責備小茜說：「基督耶穌不是要求我們，愛鄰人如同愛自己嗎？』最後，沒有聽取小茜的意見，決定要關閉沙龍，並將沙龍移建他處。


    差不多就是從那個時候開始，逸美學姊每次茶會之後，都會說「身體不太舒服」。


    逸美學姊平時在沙龍總是很快活，不時隨著音樂唱歌，或是踩著舞步，這一陣子經常無力地躺在沙龍的沙發上。她說看書會頭痛，所以不再看書，在讀書會上也不再發言。小茜很勤快地為她製作有助於刺激食慾的義式燉飯和三明治——但是，逸美學姊非但沒有好起來，反而越來越憔悴。


    我越來越受不了眼前這種情況。我崇拜的逸美學姊整天委靡不振，整個校園都好像蒙上了一層灰色，一點都開心不起來，我希望逸美學姊趕快振作起來。我唯一的能力就是寫作，為了讓她心情開朗，寫了鼓勵她的詩，朗讀給她聽，但是，這種事根本無濟於事。我內心焦急不已，卻只能眼睜睜看著逸美學姊一天比'
  - '[PAGE 207]


    一天更蒼白。


    我絞盡腦汁，最後想起逸美學姊喜歡莫札特的音樂。之前曾經在讀書會上介紹過彼得·謝弗的戲劇《阿瑪迪斯（Amadeus）》，也曾經在沙龍舉辦「特別鑑賞會」，看了這部作品改編的電影。我相信莫札特相關的音樂應該可以讓她開心起來，所以從家裡帶了卡拉揚的CD，但逸美學姊婉拒說：「不好意思，現在聽音樂也覺得很累。『


    我沒有輕言放棄，想到製作和《阿瑪迪斯》有關的甜點，或許可以讓她心情變好。那種甜點名叫「維納斯的乳頭」，莫札特的太太康斯坦茨在電影中吃這種甜點。雖然只是用白巧克力裹住白蘭地酒漬的栗子後，在頂端放一小塊巧克力片，但因為外形很可愛，曾經在法國風靡一時。


    逸美學姊雖然看起來懶洋洋的，但食慾似乎不錯，一定可以吃甜點。我覺得自己想到了好主意，忍不住興奮起來。只不過我不太會做甜點，當然要拜託小茜。


    雖然沙龍的廚房內沒有栗子，但小茜很有把握地說：「我記得有另一種用松露巧克力製作的方法，我來試看看。交給我吧！」她沒有看食譜，就俐落地動手做了'
  - '[PAGE 208]


    起來。我佩服地在一旁看了一會兒，但我笨手笨腳，完全幫不上忙，最後決定交給甜點師，自己回去客廳等待。


    走回客廳時，看到園子學姊正在為逸美學姊量血壓。我看著逸美學姊白皙的手臂，又想到了一個很棒的主點。法國的古典甜點中，有一種加了水果乾，名叫「維納斯的手臂」的蛋糕捲。如果同時端出「維納斯的乳頭」巧克力和「維納斯的手臂」蛋糕捲，一定很別致，逸美學姊一定更高興。因為這完全是為我們的女神——逸美學姊量身製作的。


    我搞不好是天才。我暗自得意起來，立刻上網查了食譜，列印出來後，衝進了食堂。


    「小茜，廚房裡有水果乾嗎？」


    或許是因為我突然推開了廚房的門，小茜嚇得渾身發抖。然後……立刻把什麼東西藏在身後。


    「志夜，妳不要嚇我好嗎？」


    小茜轉過頭時，臉上雖然帶著笑容，但她的笑容很僵硬。'
  - '[PAGE 209]


    「那是什麼？」

    「啊？」

    「妳把什麼藏起來了？」

    「啊噲，妳在說什麼啊？」

    「沒有……希望是我誤會。」

    「對啊，是妳誤會了，我快做好了，妳不要打擾我，好嗎？」

    工作台上已經排放著已經成形的生巧克力。

    「好吧，那我去外面等。」

    在我走出廚房之前，小茜始終沒有把雙手從背後拿出來。我覺得有點不太對勁，不像是小茜的一貫作風。最後，我沒有把「維納斯的手臂」的食譜交給她，那天只吃了「維納斯的乳頭」。圓形的白巧克力上擠了一滴粉紅色的巧克力，看起來真的像可愛的乳房，大家都讚不絕口。逸美學姊也一如我的期待，高興地吃了起來。

    「好像只有逸美的乳頭特別大。」'
  - '[PAGE 210]


    園子學姊笑著說。我之前並沒有特別注意，聽到園子學姊這麼說，發現只有逸美學姊盤子裡的巧克力上的粉紅色部分比別人小，好像是特別做了記號……


    這時，我終於發現一件事。以前都是吃蛋糕或是派這種大家一起分食的甜點，最近經常吃馬卡龍、布丁這種每人一份的甜點。也就是說——如果要在逸美學姊的甜點裡「加料」，並不是一件困難的事。


    最近逸美姊在沙龍時，經常在吃了甜點或輕食後，說身體不太舒服。而且……


    今年的新成員二谷第一次來沙龍的那天，小茜做了瑪德蓮，第二天，二谷很不好意思地說：「因為平時很少吃這些美食，昨天回家後來不舒服，全都吐了出來。」


    我記得那天逸美學姊問二谷：「我肚子好脹，妳要不要吃？」把自己的瑪德蓮給了二谷，當時我還有點吃醋，所以記得很清楚。


    這到底是怎麼回事？——難道小茜給逸美學姊吃的東西裡加了什麼嗎？


    之後，我開始仔細觀察，結果發現小茜給逸美學姊的甜點中，都會有一些不起眼的記號，而且每次都是小茜親自裝在盤子中交給逸美學姊，逸美學姊吃了之後，'
  md: '

    我在沙龍結交了很多朋友，也拉近了和內心崇拜的逸美學姊之間的距離。


    今年春天，一起去保加利亞短期留學後，我們的關係更密切了。雖然只有短短兩個星期，但實在太開心了，我們整天興奮不已，連帶隊的小條老師都有點受不了我們。


    對日本學生來說，保加利亞是一個未知的國度，學校內之前也沒有人想去那裡短期留學，但逸美學姊前一年提出了申請，成為全校第一個去那裡的學生。通常短期留學時，大家都會申請去美國和英國，所以起初聽到逸美學姊去保加利亞時，我感到不解，為什麼要去那種（我知道不應該這麼說）非主流國家？而且當時只有一个人參加，我覺得逸美學姊真有勇氣，所以，第二年時，我也報名參加了保加利亞的短期留學，因為我暗自期待，如果運氣好的話，也許只有我和逸美學姊兩個人參加。沒想到我的願望成真了！學姊也很高興地說：「太高興了，去年只有我一個人參加，好無聊喔。」我們到處觀光，度過了快樂的時光。


    這趟短期留學，也讓我對逸美學姊有了很多新發現。


    我們沒有住在都市，而是寄宿在小村莊的家庭，是一次非常良好的經驗，而且也結交了蒂安娜和艾瑪這兩位好朋友，是非常寶貴的經驗。


    我原本住在貝西太太家，照理說應該安排我有自己的房間，沒想到貝西太太叫我睡在客廳。說白了，那是艾瑪安排的疏失，但她臉色鐵青地說，一時無法找到其他家庭安排我寄宿，所以我對她說，住飯店也沒有關係。學院方面要求，一定要寄宿在當地家庭，這也是短期留學的精隨，但最後我还是被迫住去了飯店。照理說，我應該向學校方面報告這件事，看到艾瑪這麼努力工作，我為她隱瞞了這件事。蒂安娜一再向我道謝：「志夜，妳真好，如果艾瑪失去世份工作，我們一家人的生活就會有問題。」「我們是朋友，幫忙這點小事當然不足掛齒。


    說到朋友這件事，我們一起去里拉修道院時，逸美學姊為我們每個人買了一條相同的幸運手環。把幸運手環綁在手上時要許願，右手是戀愛，左手是功課，右腳是友情，左腳是財運。我希望和逸美學姊變成更好的朋友，所以立刻綁在右腳上。不過我不好意思當著逸美學姊的面綁，所以偷偷地、很快綁好了。艾瑪和蒂安娜都綁在右手。艾瑪有男朋友，所以許願可以趕快結婚。蒂安娜什麼都沒說，可能有喜歡的人吧。


    我一心祈禱，希望幸運手環趕快斷掉，希望願望很快實現，沒想到隔天竟然真的斷了。通常幸運手環不會那麼容易斷，所以我很驚訝，但的確為我實現了願望。


    我在留學期間和逸美學姊迅速拉近了距離，好像親姊妹一樣。


    在日本，說到保加利亞，大家都會想到優格，在那裡，不管吃什麼東西都會淋上優格。日本人通常覺得優格是甜點，但那裡的人無論在蔬菜、魚肉上都會加優格。除此以外，保加利亞還有玫瑰！玫瑰精油、玫瑰水、玫瑰果醬……我買了很多伴手禮。女生都喜歡玫瑰，所以無論去哪裡都開心，但最令人難忘的就是那天去村莊附近的湖畔野餐。


    早春的樹林中綻滿了含羞草和木蘭花，湖水寧靜清澈，小鳥歡啼……簡直就像是走進了童話的世界。我們坐在草皮上，用鼻子汁乾杯後，吃著三明治。保加利亞有很多世界遺產和遺跡，艾瑪帶我們去參觀了不少名勝古蹟，但我喜歡那次純樸的野餐，更何況只有我和學姊兩個人而已。艾瑪她們那天剛好有事，所以我們決定找一個地方悠閒放鬆一下。


    因為湖水太美了，我們沒帶泳衣，所以脫下衣服在湖裡裸泳。雖然水有點冷，那天剛好是五月的晴朗天氣，所以很爽快。逸美學姊的身材真是太棒了，當她從水裡走上來時，一頭長髮貼在她性感的身體上，水瀉反射著樹葉縫隙灑下的陽光……宛如威廉·阿道夫·布格羅的「維納斯的誕生」。恕我聲明，我看過真跡，以前我在法國時，就住在奧塞美術館附近，我覺得學姊的裸體比布格羅的畫更性感。


    對了，妳們知道維納斯是來自男人的生殖器嗎？天神烏拉諾斯厭惡自己醜陋的孩子，讓孩子回到妻子蓋婭的胎內。蓋婭盛怒之下，命令兒子用鐮刀割下烏拉諾斯的生殖器做為懲罰。生殖器丟進海裡後，精液變成了泡沫，維納斯就誕生了。


    以下是安德羅·波利齊亞諾²根據這個神話所寫的詩。


    在波濤洶湧的愛琴海，

    迎接了忒提斯臂腕中的生命根源，

    星空運轉，

    於海浪間漂浮，白色的泡沫包覆，其間诞生了舉止優美歡快、容顏神聖的少女。放縱的西風神一路吹送，她乘著貝殼漂到海岸，天神也為她感到歡愉。


    說到以維納斯誕生為題材的繪畫，桑德羅．波提切利也很有名，聽說他是受到這首詩的啟發，畫出了維納斯。


    話說回來，居然割下生殖器，丟進大海……太可怕了。但是，天神的去勢造就了維納斯的美麗，這一點我完全認同。仔細想一想，就覺得一男人的去勢所創造的美一完全符合逸美學姊的感覺。完全排除男人的世界……原來是女子學校才有的神圣美麗。極致的美，果然必須在特殊的環境下才能誕生吧。


    > 2. 編註：安德羅·波利齊亞諾，一四九四年，佛羅倫斯文藝復興時期重要的人文主義詩人。


    學姊的裸體絲毫沒有猳穢感覺，而是清純神祕，充滿生命的光芒。背景的空中吹著輕風，花草在綠色的大地萌芽，湖面泛著漣漪，宛如在讚頌逸美學姊是女神。如此的肢體，竟然露出聖母般柔和的眼神，簡直太犯規了！如果我是男人，會被她出眾的美麗迷惑，神志不清地直接跳進湖裡。啊，這個點子搞不好可以用在一部作品，嗯。


    野餐後，原本要跟著北條老師一起去美術館，但游泳之後，我不太想去美術館，就謊稱身體不舒服，和他們分頭行動。我一個人悠閒地四處拍照，真的拍了不少照片。


    因為曾經在國外生活多年，所以即使在第一次造訪的國家，一個人四處走也不怕。也許是早就習慣了這種生活。因為爸爸公司外派的關係，我從小一年級到六年級都住在法國，爸爸媽媽曾經帶我去過歐盟的很多國家。義大利、西班牙、德國、瑞士、比利時、英國……當時覺得沒什麼，現在回想起來，發現自己很幸運。


    法國是我的第一故鄉，我希望有機會再去那裡生活。我覺得比起狹小的日本，

    我更适合國外的生活，國外更能夠讓我有心情平靜的感覺，難道因為是歸國子女的關係？


    正因為我小時候曾經住過國外，在小說的創作時，要比別人對日文更加執著的想法才會這麼強烈。嗯嗯，一定是這樣。在法國那六年的生活已經內化成我的血肉，對我的創作也有幫助。


    短期留學結束後回到日本，我和逸美學姊相處時，仍然無法擺脫和情同姊妹的感覺，有時候在文學沙龍時，也常常和她打鬧，或是故意和她鬥嘴，想要吸引她的注意力，逸美學姊似乎也樂在其中，接受我對她撒嬌。


    蒂安娜來日本之後，我們三個人經常聚在一起聊保加利亞的事。其他都不太瞭解，所以對其他人有點不好意思，但我們總是忍不住聊得很投入。園子學姊明顯露出不耐煩的表情，這也沒辦法，因為那是一段很特別的回憶。


    復活節園遊會時，我仍然完全沉浸在姊妹模式中。


    我被分配去當復活節兔子（聽說是學院的董事長，也就是逸美爸爸的主意）。


    我去執行委員會室拿兔子裝時，發現地上放了一整排頭部和身體分開的兔子。雖然復活節兔象徵著生命的繁榮和復活，但和身體分開的頭部，和白色塑膠圓形中塗上藍色顏料的雙眼令人聯想到殘酷的死亡，讓我感到超害怕。


    穿上兔子裝後，發現又重又悶熱。想到要連續好幾個小時穿著兔子裝，心情就很憂鬱，忍不住詛咒自己的抽籤運太差了。穿上兔子裝，請人幫我拉好背後的拉鍊，再戴上頭套，最後才戴上胖鼓鼓的手套。啊，我難得擦了指甲油。平時學校禁止學生擦指甲油，但用塗復活節彩蛋剩下的油漆擦在手指上不會挨罵，所以大家這麼做。我擦了可愛的淺綠色，結果穿上這身兔子裝，根本白擦了，虧我還戴了假睫毛。


    扮成復活節兔的我快樂地邊走邊舞，有時候向小朋友打招呼，陪他們一起找復活蛋。兔子裝穿在身上超重，肩膀都痙了，但我盡可能用力揮手，用力抬腿、扭腰擺臀。


    > 「啊呀，該不會是志夜？


    不知道哪裡傳來叫聲。兔子裝的耳朵部分是網狀，雖然可以聽到聲音，但聲音很不清楚，所以無法分辨是哪裡傳來的聲音。我在原地團團打轉，尋找到底誰在叫我。


    「這裡啦。」

    有人伸出雙手摸著我胖鼓鼓的手臂，隔著頭套的小洞，只能看到制服裙子。

    「誰？」

    「逸美啦。」

    「啊，逸美學姊。大家穿的都一樣，妳怎麼知道是我？」

    「一眼就認出來了。」

    「為什麼？」

    「因為妳跳的舞最難看啊。」逸美學姊發出嗤嗤的笑容。

    「學姊，妳好過分。我這麼賣力跳舞，渾身都是汗。」

    「很熱嗎？」

    「熱死人了。」

    「是嗎？真可憐，妳跟我來。」


    學姊挽著我的手臂，假裝和復活節兔一起跳舞，把我帶去體育館後方。


    「這裡不會有人來，妳脫下來休息一下。」


    太感謝了。我脫下滿是汗水的手套，把頭套往上拔，但頭套太緊了，怎麼拔都拔不出來。


    「學姊，拔不出來。」


    「啊！」


    逸美學姊也幫忙我一起拔，但頭套卡在下巴，遲遲拔不出來。


    「好痛好痛，學姊，痛死我了。」


    「這點小痛忍耐一下，再來一次。」


    她用力拉扯著，我的脖子都快被她扯斷了。


    「好痛好痛，真的好痛。逸美學姊，妳好過分，我絕對不會原諒妳。」


    我們大聲吵鬧著，這時聽到了腳步聲。慘了！如果被人發現復活節兔在偷懶，會被逸美的爸爸罵。


    「學姊，怎麼辦？」


    「妳從另一側逃走，我掩護妳。」

    「但是……」

    「廢話少說，快走吧！」

    逸美學姊拍我的屁股，我慌忙跑走了。唉，逸美的爸爸為什麼會想到兔子舞這麼奇怪的主意，笨死了，笨死了。我在逃走時忍不住在心裡咒罵。之後，我跑去中庭和其他人一起跳舞，陪小朋友一起玩。

    那個腳步聲到底是誰？

    當時真的慌了手腳，但學姊死了之後，這件事也成為美好的回憶。當時，我作夢都沒有想到，逸美學姊會在幾個星期後離開人世。


    復活節活動的最後一個節日是領聖餐。

    送走來自校外的客人和家長，清掃完畢後，在新教堂領聖餐。雖然全校的學生都集中在新教堂，但只有受過洗禮的學生才能實際參加。牧師站在耶穌受難像下方，學生聚集在牧師周圍，領取麵包和葡萄酒。


    「這是耶穌捨給妳的身體。」

    「阿門。」

    「這是耶穌捨給妳的血。」

    「阿門。」


    每次把麵包放在舌頭上，用小杯子喝酒時，我都充滿嚴肅的心情。這個儀式從最後的晚餐流傳至今，代表已經持續了兩千年，就連我也能充分理解其中的份量，不由得肅然起敬。兩千年的歲月幾乎是永遠。


    平時總是由逸美學姊在這個時候朗讀聖經，但那天由小百合學姊代替她走上講台。我巡視了教堂內，沒有看到逸美學姊的身影。難道是因為我剛才偷懶被人發現，害她挨罵了嗎？


    我不禁擔心起來，解散後，立刻四處尋找她。沒想到逸美學姊在沙龍，呆呆地站在窗邊。


    「學姊，太好了，原來妳在這裡。」

    我叫了一聲，逸美學姊回頭看著我。


    「咦？彌撒已經結束了嗎？」

    「結束了，剛才沒有看到妳，我很擔心呢。」

    「我有點累了，對不起，讓你擔心了。」

    「請問，之後……沒問題嗎？」

    「沒事，完全沒問題。」

    學姊笑了笑，對我敞開衣領，裡面有一條紅色絲巾。

    「怎麼會有這條絲巾？」

    「那是找彩蛋前五名才能拿到的絲巾，我立刻繫上絲巾，假裝頒獎已經結束，所以在體育館後方休息。其實這是去年的，每年都有小孩子因為領不到獎品而哭鬧，所以我帶在身上，可以隨時拿來安撫他們。」

    學姊像調皮的小孩般吐了吐舌頭。

    「太好了。」

    我鬆了一口氣，這時，沙龍的門打開了，其他成員走了進來。逸美學姊向我使了一個眼色說：「這件事是我們兩個人的祕密。」然後把手指放在嘴唇前，我忍不住高興起來，大聲地說：「好！是祕密！」結果逸美學姊輕輕瞪了我一眼。


    文學社在復活節園遊會義賣磅蛋糕和餅乾（當然如數售罄）的總金額竟然高達四十二萬！扣除材料費十八萬，還有二十四萬，即使再扣除社團營運費十萬圓（學姊雖然是千金小姐，但很精明！），還可以捐十四萬。


    每個社團可以自由決定捐給任何一個弱勢團體，校方不會特別指定，因為基於自己的信念決定捐款對象也是一種學習。文學社每次都會請每個人提出建議，最後投票表決決定。大家對這次的復活節義賣的善款捐贈對象也有不同的意見，園子學姊說要捐給鄉村的醫院，二谷說要捐給老人院，逸美學姊說要捐給孤兒院。


    > 「我希望可以爲那些不幸的孩子做點事。」


    逸美學姊說。


    「有很多小孩子因爲各種原因沒有父母，我希望能夠幫助這些孩子，讓他們的日子過得稍微好一點。妳們看，有些孩子才剛出生。」「逸美學姊看著可愛的嬰兒照片，忍不住流下了眼淚。其他人都跟著流淚了，最後大家一致同意：「好啊，好啊，這次就捐給孤兒院。」「我對逸美學姊又有了新的認識，她真的是充滿愛心的人。


    蛋糕和餅乾賣得這麼好，小南茜當然功不可沒。


    即使使用相同的工具、相同的材料和相同的份量，我們做的和小茜做的味道完全不一樣，她一定具有這方面的天分，很懂得把握適當的時機。


    我有時候會偷偷叫小茜「愛麗絲」。因為穿著荷葉邊圍裙的童話少女──簡直就像是夢遊仙境的愛麗絲。


    對了，讀書會的課題圖畫書是《愛麗絲夢遊仙境》時，小茜舉辦了一場別出心裁的茶會，她做了奶油麵包和糖漿派，重現了瘋狂帽匠茶會的情景。而且，她還細心地不知道從哪裡張羅了道具，「來，妳們把這個戴起來。」一二谷戴著有紙牌圖案的士兵帽，蒂安娜戴著貓耳朵的髮箍，我戴著老鼠面具，園子學姊戴著奇怪的帽子，小百合學姊戴著兔子耳朵，逸美學姊戴著紅心皇冠。沒錯，我們分別扮成紙牌兵、柴郡貓、睡鼠、瘋狂的帽匠、白兔和紅心皇后。小茜當然是愛麗絲。


    逸美學姊故意使壞，三不五時叫著：「砍下妳的頭！」大家都大笑不已。那次茶會玩得很開心。


    對了，在那天的茶會上，我第一次看到小茜的左手腕上有一個差不多像手掌般大的紅疤。穿冬季制服時看不到，即使換夏季制服後，小茜很怕冷，總是在制服外披一件開襟衫，那天的茶會上，她穿了一件像愛麗絲的短袖洋裝。我並沒有故意盯著她手上的疤痕，但小茜慌忙把手臂藏了起來。我內心慌張起來，覺得自己做了不禮貌的事，不知如何是好。逸美學姊溫柔地撫摸著小茜的手臂，語帶憐惜地為她解圍說：「妳不必覺得丟臉，很可愛啊，看起來很像鈴蘭花，這是妳的魅力所在啊。『


    小茜聽了應該很高興，但同時也為我解了圍。因為多虧了逸美學姊這麼說，才不至於讓我顯得很失禮。逸美學姊是一個具有細膩感性的人，能夠在轉眼之間就察覺現場的氣氛，讓在場的所有人都不会感到尷尬。我再度感動不已，逸美學姊果然是一個出色的女生。


    我很喜歡小茜——但有件事一直讓我耿耿於懷。


    我忘了什麼時候……有一次聽逸美學姊說：「等我畢業後，打算關閉文學社。」我猜想這句話成為一切的起源。逸美學姊畢業就要關閉文學社，也就是只剩兩學期了。


    文學社本來就是為了逸美學姊而存在，因為有她，才會有文學沙龍。社團的成員都隱約猜到逸美學姊畢業後，文學社也會跟著關閉，但還是忍不住有點難過。聽說沙龍可能會捐給孤兒院，或是移建他處。


    沒想到向來溫柔乖巧的小茜突然站了起來，強烈反對關閉沙龍。她咄咄逼人的態度讓在場的所有人都目瞪口呆。


    「你要把這個沙龍從我們手上奪走嗎！」


    「捐贈其他的東西給孤兒院不是就好了嗎！」


    「我絕對不允許這種蠻橫的行為發生！」


    對她來說，這個廚房是她心靈的寄託。她家開的料亭因為一場火災付之一炬，原本順利進行的西餐廳計畫也因此擱置，對她來說，可以自由製作甜點和料理的這個廚房，幾乎變成了她生命的意義。這種說法絲毫沒有誇張。


    但是，逸美學姊的意志也很堅定，責備小茜說：「基督耶穌不是要求我們，愛鄰人如同愛自己嗎？』最後，沒有聽取小茜的意見，決定要關閉沙龍，並將沙龍移建他處。


    差不多就是從那個時候開始，逸美學姊每次茶會之後，都會說「身體不太舒服」。


    逸美學姊平時在沙龍總是很快活，不時隨著音樂唱歌，或是踩著舞步，這一陣子經常無力地躺在沙龍的沙發上。她說看書會頭痛，所以不再看書，在讀書會上也不再發言。小茜很勤快地為她製作有助於刺激食慾的義式燉飯和三明治——但是，逸美學姊非但沒有好起來，反而越來越憔悴。


    我越來越受不了眼前這種情況。我崇拜的逸美學姊整天委靡不振，整個校園都好像蒙上了一層灰色，一點都開心不起來，我希望逸美學姊趕快振作起來。我唯一的能力就是寫作，為了讓她心情開朗，寫了鼓勵她的詩，朗讀給她聽，但是，這種事根本無濟於事。我內心焦急不已，卻只能眼睜睜看著逸美學姊一天比一天更蒼白。


    我絞盡腦汁，最後想起逸美學姊喜歡莫札特的音樂。之前曾經在讀書會上介紹過彼得·謝弗的戲劇《阿瑪迪斯（Amadeus）》，也曾經在沙龍舉辦「特別鑑賞會」，看了這部作品改編的電影。我相信莫札特相關的音樂應該可以讓她開心起來，所以從家裡帶了卡拉揚的CD，但逸美學姊婉拒說：「不好意思，現在聽音樂也覺得很累。『


    我沒有輕言放棄，想到製作和《阿瑪迪斯》有關的甜點，或許可以讓她心情變好。那種甜點名叫「維納斯的乳頭」，莫札特的太太康斯坦茨在電影中吃這種甜點。雖然只是用白巧克力裹住白蘭地酒漬的栗子後，在頂端放一小塊巧克力片，但因為外形很可愛，曾經在法國風靡一時。


    逸美學姊雖然看起來懶洋洋的，但食慾似乎不錯，一定可以吃甜點。我覺得自己想到了好主意，忍不住興奮起來。只不過我不太會做甜點，當然要拜託小茜。


    雖然沙龍的廚房內沒有栗子，但小茜很有把握地說：「我記得有另一種用松露巧克力製作的方法，我來試看看。交給我吧！」她沒有看食譜，就俐落地動手做了起來。我佩服地在一旁看了一會兒，但我笨手笨腳，完全幫不上忙，最後決定交給甜點師，自己回去客廳等待。


    走回客廳時，看到園子學姊正在為逸美學姊量血壓。我看著逸美學姊白皙的手臂，又想到了一個很棒的主點。法國的古典甜點中，有一種加了水果乾，名叫「維納斯的手臂」的蛋糕捲。如果同時端出「維納斯的乳頭」巧克力和「維納斯的手臂」蛋糕捲，一定很別致，逸美學姊一定更高興。因為這完全是為我們的女神——逸美學姊量身製作的。


    我搞不好是天才。我暗自得意起來，立刻上網查了食譜，列印出來後，衝進了食堂。


    「小茜，廚房裡有水果乾嗎？」


    或許是因為我突然推開了廚房的門，小茜嚇得渾身發抖。然後……立刻把什麼東西藏在身後。


    「志夜，妳不要嚇我好嗎？」


    小茜轉過頭時，臉上雖然帶著笑容，但她的笑容很僵硬。


    「那是什麼？」

    「啊？」

    「妳把什麼藏起來了？」

    「啊噲，妳在說什麼啊？」

    「沒有……希望是我誤會。」

    「對啊，是妳誤會了，我快做好了，妳不要打擾我，好嗎？」

    工作台上已經排放著已經成形的生巧克力。

    「好吧，那我去外面等。」

    在我走出廚房之前，小茜始終沒有把雙手從背後拿出來。我覺得有點不太對勁，不像是小茜的一貫作風。最後，我沒有把「維納斯的手臂」的食譜交給她，那天只吃了「維納斯的乳頭」。圓形的白巧克力上擠了一滴粉紅色的巧克力，看起來真的像可愛的乳房，大家都讚不絕口。逸美學姊也一如我的期待，高興地吃了起來。

    「好像只有逸美的乳頭特別大。」


    園子學姊笑著說。我之前並沒有特別注意，聽到園子學姊這麼說，發現只有逸美學姊盤子裡的巧克力上的粉紅色部分比別人小，好像是特別做了記號……


    這時，我終於發現一件事。以前都是吃蛋糕或是派這種大家一起分食的甜點，最近經常吃馬卡龍、布丁這種每人一份的甜點。也就是說——如果要在逸美學姊的甜點裡「加料」，並不是一件困難的事。


    最近逸美姊在沙龍時，經常在吃了甜點或輕食後，說身體不太舒服。而且……


    今年的新成員二谷第一次來沙龍的那天，小茜做了瑪德蓮，第二天，二谷很不好意思地說：「因為平時很少吃這些美食，昨天回家後來不舒服，全都吐了出來。」


    我記得那天逸美學姊問二谷：「我肚子好脹，妳要不要吃？」把自己的瑪德蓮給了二谷，當時我還有點吃醋，所以記得很清楚。


    這到底是怎麼回事？——難道小茜給逸美學姊吃的東西裡加了什麼嗎？


    之後，我開始仔細觀察，結果發現小茜給逸美學姊的甜點中，都會有一些不起眼的記號，而且每次都是小茜親自裝在盤子中交給逸美學姊，逸美學姊吃了之後，

