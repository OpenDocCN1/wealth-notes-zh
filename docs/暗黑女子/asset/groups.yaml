    「小學部、中學部和高中部分別從合格者中挑選一名成績優秀，且因為經濟因素導致升學困難者，免除其學費，並支付交通費、教科書費等其他學校生活所需一切費用，並無還款義務。」

    我以前就很嚮往這所女子學院，我喜歡搭電車時會看到的清爽又可愛的制服，還有以天主教為主軸的嚴謹校風，最吸引我的就是每個學生的臉上都閃耀著光芒。

    如果能去這種學校讀書，不知道該有多好。只要我能考取那所學校，被選為獎學金學生，就可以去那裡讀書──我一心朝著這個目標努力，從小學高年級就開始用功讀書。我家沒錢讓我去補習或請家庭教師，所以只買了參考書，我做了一遍又一遍，幾乎把整本參考書都寫滿了。

    收到和高中部的合格通知同時寄來的獎學金學生獲選通知時，我不知道有多高'
