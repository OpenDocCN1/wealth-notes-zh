  - '[PAGE 234]


    也讓我產生了好奇。


    如果可以讓像她那樣楚楚可憐的美少女聽我的使喚，心情一定會暢快。而且，以女生為主角的故事中，當然少不了美味的甜點。我想知道小南茜的秘密。她的外貌越可愛，我希望她的秘密越醜惡。


    我開始調查她的情況，也曾經在她放學回家時一路跟蹤。


    她家位在料亭後方，散發出靜謐的感覺，但她總是用忿恨的眼神看向料亭，嘆氣之後，才走進家門。


    那天晚上。


    放學後，向來直接回家的小茜難得去雜貨店和咖啡店消磨時間，最後在公園的長椅上坐到深夜。我很納悶，所以一直在不遠處看著她。


    坐在長椅上的她手中突然亮了起來。


    是打火機。打火機在她手上一亮一滅，她用認真眼神看著自己的手。


    不知道把玩了多少次後，她猛然站了起來，好像下定了決心，腳步十分堅定。


    她沒有走回家中，而是走向早就已經打烊的料亭。不一會兒，漆黑的料亭窗戶'
  - '[PAGE 235]


    微微亮了起來。亮光越來越大，扭動著擴散到整家店。火越燒越旺，小茜衝出店外，火燒到了她穿著制服上衣的左手臂上。她慌忙拍熄了火，跑進了黑暗中。建於大正元年的木造建築被熊熊大火包圍，在天亮之前，染紅了天空。


    隔天的早報報導了這起火災。


    # 老鋪料亭燒毀 人為縱火？ 創業百年的料亭「小南」失火


    X日深夜十一點左右，位在XX市XX町的料亭「小南」發生火災，約三百平方公尺的木造兩層樓店鋪付之一炬。當時店內無人，並沒有用火，起火點也並非來自廚房，XX分局懷疑有人為縱火的可能，正進一步展開調查。


    所幸這場火災並無造成任何人員受傷，也未延燒至鄰居家，位在店鋪北側的店主住家也平安無事。經營者小南辰夫（五十五歲）、妻（五十三歲）和長子（二十一歲）在家中，順利逃了出來，長女（十六歲）尚未回家，所以全家人都平安無事。


    小南辰夫先生表示：「很抱歉給大家添了麻煩，讓大家擔心了，本店暫時休業整理。」'
  - '[PAGE 236]


    附近居民為失去喜愛多年的寶貴建築物，和在店鋪重新開張之前，都無法嚐到「小南」的料理深感惋惜。


    學校的同學也都紛紛討論火災的事，大家都很同情小茜。


    「謝謝大家的關心。」


    小茜臉色蒼白而憔悴，讓人看了於心不忍的被害人，但是，我——只有我知道那起火災的真相。


