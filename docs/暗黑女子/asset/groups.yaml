    我對和服的智慧驚訝不已，感動不已，雖然我對日本很不瞭解，但我直覺地認為，這是日本文化的最佳代表。


    實際來日本留學幾個月後的今天，這種印象仍然沒有改變。來到日本後，我有機會瞭解茶道、花道和歌舞伎等各種具代表性的日本文化，但我認識所有的日本文化後，仍然認為摺成扁長方形形的和服是登峰造極的傑作。


