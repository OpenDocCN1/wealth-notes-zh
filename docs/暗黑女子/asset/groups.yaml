    # 4. 朗讀小說〈春天的巴爾幹〉


    留學生 蒂安娜·德秋貝'
  - '[PAGE 96]


    我的祖國保加利亞自古以來，就有關於吸血鬼的傳說。


    說到吸血鬼，羅馬尼亞特蘭西瓦尼亞地區的德古拉伯爵很有名，但保加利亞也有許多嫁給了吸血鬼之類的民間傳說。


    我居住的雷巴格拉德村位在巴爾幹山脈的山麓，聽說有一個吸血鬼以年輕女孩的外貌現身。大家都叫那個吸血鬼「拉彌亞」，因為她會使用巫術，所以更像是巫婆。


    每到春天，村莊內就會舉行拉彌亞之宴。入夜之後，大家聚集在一起，點燃堆得像山一樣高的枯枝，在熊熊燃燒的篝火旁跳舞狂歡。年輕女生穿上黑色洋裝，接二连三地撲向別人，假裝吸別人的血。巨大的火圍在村莊內宛如發笑般搖曳擺動，村民們焚香喝酒，輪流吸著水菸草。篝火的熱氣把每個人的臉都熏紅了，映照了火光的眼晴宛如在燃燒。


    吸血鬼是活著的死人。盛宴的夜晚，死人和活人之間的界線消失，死人的靈魂會四處遊蕩。正在唱著、跳著的人越歡樂，越可能是早就已經死去的人。


    其中有一個人穿黑色烏鴉羽毛洋裝，渾身散發出妖氣和晦氣的女人。一雙濕潤


    暗黑女子 098'
  - '[PAGE 97]


    的漆黑眼眸，光澤如蠟般的白色肌膚。每當她在篝火周圍舞動，汗水四散，長髮撫動周圍的空氣，人們暫時忘記了歌唱，出神地看著她舞動。


    每個人都喃喃說著：「她是拉彌亞。」那個女人就是如此美麗，如此神秘。那個女人就是逸美。


    我姊姊艾瑪帶她來參加祭典。


    雖然我叫她姊姊，其實我們是雙胞胎，兩個人的年紀相同。我家很窮，勉強能夠讓我們姊妹兩人一起上高中。我小時候因為車禍受傷後，左腳不方便，所以無法外出打工，但村莊裡其他孩子都會靠採花或送蔬菜打工賺錢。艾瑪從小就幫忙農園幹活或是照顧牛隻，上高中後，去了從村莊搭車要一個小時的鎮上一家旅行社打工，幫助家計。艾瑪健康開朗又活潑，在學校也很受歡迎，她的夢想是希望有朝一日去各國旅行，所以才會選擇這個工作。


    雷巴格拉德村是距離首都索菲亞很遠的一個小村莊，在著名的薔薇谷所在地卡贊勒克的近郊，村莊本身並沒有任何值得觀光的特色，除了有有人在去薔薇谷的途中'
  - '[PAGE 98]


    短暫停留以外，並沒有太多人造訪，但自從姊姊艾瑪去旅行社上班後，積極帶觀光客來雷巴格拉德村，村莊也漸漸繁榮起來。


    艾瑪之後又在雷巴格拉德村推動了讓外國遊客住宿在普通家庭的服務，沒想到大受好評。那些觀光客不是去美國或英國，而是特地來到保加利亞，代表他們很想瞭解這片土地的日常生活，也希望有機會親身體驗。讓遊客住在村民家中，吃村民做的菜，帶他們去附近參觀的企畫大獲成功。由於不是住在飯店，而是住在村民家中，所以遊客和村民之間偶爾會發生糾紛。有時候遊客會弄髒村民家裡，或是大聲喧嘩，也有人很沒禮貌，但在各國遊客中，日本的遊客個性溫和，愛乾淨，很受村民的喜愛。之後，我們都愛上了日本和日本人。


    不久之後，日方面向旅行社洽詢，是否可以讓日本的高中生寄宿兩個星期？只有一名學生，那個學生和我們同年，我們在討論後決定讓那個學生寄宿在我家。於是，逸美來到了我家。


    和逸美同行的北條老師忙於參加國際進修和參觀學校，基本上由我和艾瑪照顧'
  md: '

    錯，應該說，在這樣的廚房，用這些材料，用這些設備，無論誰做的蛋糕都會好吃。


    我們越聊越開心，忘記了時間的存在。


    「啊呀，已經這麼晚了！」


    逸美一看手錶，驚訝地叫了起來。不知不覺已經十點多了。


    「對不起，把你留到這麼晚，我請司機送你回去。」


    「沒關係，我搭電車回家。」


    「不行，天色已經暗了，我知道『小南』料亭在哪裡。」


    於是，那天由逸美送我回家。


    我們在車上也聊了很多，那時候我已經放鬆，和一向不怎麼喜歡的逸美聊得很輕鬆自在。逸美很開朗直爽，我終於知道為什麼會有那麼多人喜歡她。


    車子穿越鬧區，前方就是我家的料亭。


    前方的夜空閃著通紅的光。


    一種不祥的預感爬過背脊。消防車的警笛聲越來越近，周圍聚集了很多圍觀的人潮，警官正在指揮交通，要求車輛繞道行駛。


    「發生什麼事了？」


    名叫室生的司機打開窗戶，問正在指揮交通的警官。


    「前方的料亭失火了。」


    聽到警官的回答，我立刻跳下車，撥開圍觀的人群奔跑。當我好不容易擠到宅門前，發現「小南」已經被熊熊大火吞噬了。


    那是父親的一切。父親的人生在眼前化為灰燼。我巡視四周，發現父母和哥哥正茫然地看著眼前狂舞的火焰。通紅的火焰照亮了父親臉上的皺紋、黑斑和黑眼圈，在吞噬了整家店的火焰前，父親的身影顯得渺小而無力。我不敢叫他，只能擠在人群中默默看著他。


    火勢連續延燒了好幾個小時，燒毀了父親的一切。


    「小南」發生火災的新聞也上了報。


    創立於大正元年的料亭付之一炬，所幸是在打烊之後，並未造成任何人員傷亡。起火點並非廚房，疑似人為縱火。


    隔天到學校後，大家都得知了這個消息，紛紛來安慰我。白石逸美更感同身受地為我感到難過。


    「我昨天是不是不該留妳？」


    「沒這回事，如果昨天妳沒找我，或許我會被捲入火災。」


    「但如果妳直接回家，或許可以看到縱火犯，那個人或許就會改變心意。我覺得很對不起妳。」


    「昨天的事和妳無關，請妳不要放在心上。」


    「如果有什麼我可以幫忙的地方，請儘管說。」


    「別——」說了一半，我突然想到一件事，「那個……」


    「怎麼了？」


    「可以讓我加入文學社嗎？」


    逸美露出極其柔和的微笑，充滿關懷地握住我的雙手。


    「當然啊，竭誠歡迎妳的加入。」


    文學沙龍的廚房果然非常好用。


    我隨心所欲地做了各種甜點。無論任何材料、任何工具，只要央求逸美，她就會去張羅全世界的頂級品。對文學社的其他成員來說，沙龍是她們的城堡，但對我來說，這個廚房才是夢想中的城堡。


    逸美和百合以前心血來潮時，會在廚房烤餅乾，但自從我加入之後，甜點完全由我全權負責。看到有人吃我做的甜點，我就感到幸福不已。


    我並不是整天在廚房和麵粉、雞蛋打交道，也會積極參加社團的文學活動，國文的成績也不錯。


    加入文學社之後，我才發現以料理為主題的文學作品很豐富。像是蘿拉·英格·懷德的《大草原之家》、赫爾曼·梅爾維爾的《白鯨記》，《清秀佳人》中更有許許多多令人垂涎的餅乾。當讀書會的主題是討論克莉絲蒂的珍馬波小姐系列時，我做了書中經常出現的司康餅和罌粟派，很受大家的好評。


    我漸漸感受到文學的趣味，也開始在討論會上發表自己的意見。拜白石逸美所賜，我才能藉由料理瞭解文學，所以，我對她充滿感謝。


    在我加入文學社後，又有三名新成員加入，分別是比我大一屆的學姊、以醫學系為第一志願的古賀圓子，來自保加利亞的留學生蒂安娜·德秋貝，以及今年的獎學金新生二谷美禮。有更多人品嘗我的甜點，讓我更覺得下廚是一件快樂的事。讀書會和討論會拖延時，我會為大家做麵包飯、三明治、濃湯和義大利麵等輕食。


    那起火災發生後，開西餐廳的計畫落空了。父親整天為了重新開店四處奔波，新店的資金籌措也更加困難。所以，也許我只是想在這個廚房實現我落空的夢想。


    在文學社度過的時光很快樂，正因為人數不多，所以大家的關係都很親密，彼此也很團結。為復活節＆聖霊降臨節製作三百個磅蛋糕時，大家分工合作，負責準備材料、計量、攪拌和清洗工作，花了三天三夜，才終於完成。


    看著整齊排在冷凍庫裡的三百條蛋糕，我備感充實。把剛烤好的磅蛋糕急速冷凍，可以鎖住風味和香氣。雖然只是學校的園遊會義賣活動，但既然收錢，就要呈現完美的作品。在製作甜點這件事上，我的自尊心很強，這個廚房滿足了我的自尊，白石逸美讓我實現了夢想。


    聽著自己喜歡的音乐，在愉快地聊天的同時做蛋糕，是女生極致的美夢。而且，多虧副社長澄川小百合設定了時間表，讓我們不至於因為聊天誤了正事，完成了每天一百條蛋糕的目標。在拿工具的同時讓奶油融化，攪拌食材時將烤箱預熱，烤蛋糕時開始為之後做的蛋糕篩粉，蛋糕烤好後，立刻在表面塗上蘭姆酒，包上保鮮膜……因為小百合適時下達各種指示，一切才得以順利進行。就連自詡為甜點高手的我，聽到每天要做一百條蛋糕，也忍不住慌了手腳，不知道什麼時候該做什麼事。逸美很有魅力，也具有領導力，但缺乏像小百合那樣的細膩和計畫性。正因為有小百合的支持，逸美才能夠自在地做自己。這也是白石逸美和澄川小百合這對理想的BFF——Best
    Friend Forever，成為大家崇拜對象的原因。有朝一日，如果我開蛋糕店，也希望小百合學姊可以來幫我。


    澄川小百合總是默默支持這個文學社。進入文學社之後，我有時候仍然不怎麼喜歡逸美。讀書會時，她常常表達大膽誇張的見解，但一下子又會說出前後矛盾的意見。只要別人稍微表達反對意見，她就窮追猛打地試圖駁倒對方。小百合總是委婉地勸說她：「逸美，每個人對文學有不同的見解才有趣啊。」


    如果說，逸美屬於華美絢麗的人，小百合就是具有低調內斂世界觀的人，具備了柔和的感性，身段柔軟，卻不失內在的強韌。雖然總是在逸美身旁露出寧靜的笑容，當逸美快要失控時，巧妙地加以控制。雖然學校的女生和文學社的成員都很崇拜逸美，但我暗自希望自己能夠成為像小百合一樣的人。


    我以爲文學社的成員以逸美和小百合為中心，大家都相處和睦。我加入文學社一年多，大家對每週的活動、學院的節慶和闇鍋朗讀會都樂在其中，所以，我完全沒有想到會在最近發生問題。


    那天我正在廚房把細砂糖和杏仁粉混合後過篩，逸美愁眉不展地走了過來。


    「學姊，發生什麼事了嗎？」


    「嗯，是啊，」逸美嘆著氣，「我被人糾纏，很傷腦筋。」


    「啊？」


    我想起那些學妹總是在走廊上或是上中學的路上埋伏，想要見逸美一面，甚至有人主動送禮物或送信給她，也曾經有學妹來打聽逸美的電子郵件。逸美總是笑臉以對，但內心果然感到很累。


    「學姊，妳很引人注目，這也是沒辦法的事，大家都崇拜妳啊。」


    「不是妳想的那樣，她跑去我家了。」


    「什麼？去妳家？」


    「對，她說想當我弟弟的家教，硬是闖進我家。」


    家教。所以——


    「沒辦法拒絕嗎？」


    「已經拒絕了好幾次，但她說，可以當義工，我們當然不可能不付錢給她，所以還是照付給她錢……但真的很那個。」


    「這樣太奇怪了，要不要找校長談一談？」


    「不知道該說她狡猾還是奸詐……學校不是禁止我們打工嗎？但她直接找校長談判，說不打工無法維持家計。校長說，如果當我弟弟的家教，就可以接受。所以，她算是有校長撐腰。」


    「怎麼會這樣……」


    我手上拿著玻璃碗中裝了冷凍之後，自然解凍的蛋白，正把細糖慢慢加入後打泡。


    「妳在做什麼？」


    「馬卡龍。」


    「那不是很難做嗎？」


    逸美像小孩子一樣把食指伸進玻璃碗，舔了舔甜甜的蛋白霜。我把已經過篩的可可粉倒了進去，用橡膠抹刀直向攪拌著。


    「該怎麼說呢？她有點可憐，或者說有點於心不忍。她家很窮，根本不可能融入這個學院的生活，但她很努力地想要融入。因為沒有錢去髮廊，所以就用保健室的雙氧水把頭髮脫色，在廉價手帕上繡上名牌的標誌。即使這麼做，也不可能和他同學一樣，但她以為自己融入了大家，完全不知道別人都在背後笑她。」


    「真可憐。」


    馬卡龍麵糰完成了。馬卡龍的失敗完全取決於這個步驟。我把橡膠抹刀壓向玻璃碗的邊緣，把麵糰裡的氣泡壓出來。


    「咦？好不容易發泡，為什麼又要把氣泡壓掉？」


    逸美驚訝地問。


    「這是在壓拌馬卡龍麵糰。」


    「壓拌馬卡龍麵糰？」


    「為了避免麵糰太蓬鬆，必須把氣泡壓掉。過度蓬鬆，會導致馬卡龍表面裂開，但如果把氣泡完全壓光，烤出來的馬卡龍就會塌掉，所以壓得恰如其分是一門工夫。」


    「這是製作馬卡龍時最重要的步驟？」


    逸美靜靜地看著我很有耐心地把麵糰裡的氣泡壓出來，麵糰漸漸泛出光澤。


    「我也想試試。」


    「好啊。」


    如果是平時，這個重要的步驟絕對不可能假手他人，但逸美很有慧根，所以我把手上的玻璃碗交給了她，這代表我信賴她的直覺。


    「總之就是這樣，很難拒絕她。」


    逸美緩緩轉動著玻璃碗，均勻地把麵糊裡的气泡壓了出來。持續了幾分鐘後，她放下玻璃碗，拿起橡膠抹刀，可亞色的麵糊滴了下來。


    「怎麼樣？還不夠嗎？」


    「還不夠，用抹刀再擠掉一些氣泡。」


    逸美繼續低頭作業，光滑的額頭上微微滲著汗珠。


    「而且，還不光是這樣而已。」


    「不光是糾纏而已嗎？閻去妳家就已經夠厚臉皮了。」


    「不瞞妳說：…我家少了很多東西。」


    「什麼！」


    「起初只是手帕、化妝包之類的小東西，但之後變本加厲，利摩日瓷鐘和雕花玻璃杯也不見了，後來還從皮夾裡偷錢。」


    「那根本就是小偷啊。」


    「妳也覺得是這樣吧？」


    逸美停下了手，我把抹刀拿了起來，麵糊宛如綾帶般滴落玻璃碗中。


    「有沒有報警？」


    「怎麼可能報警？這個學院的學生都像是自己的家人。」


    我把麵糰分裝進兩個擠袋，把其中一個交給逸美，分頭在烤箱紙上擠出一個一個圓形。


    「我擠不出像妳一樣漂亮的圓形。」


    逸美嘟著嘴說。


    「多練習就習慣了。」


    烤箱紙上有超過一百個圓形。擠完之後，放進烤箱之前，還必須乾燥片刻。


    「在等待的時候，要不要來喝茶？」


    逸美燒了水，把茶葉放進茶壺。


    「今天是什麼紅茶？」


    「我想喝伯爵茶。有壓力的時候，喝香氣足的茶心情比較容易放鬆。」


    她把熱水倒進茶壺後泡了一會兒，倒進了英國名瓷明頓的馬克杯。我們沒有端去沙龍，而是在廚房的工作台旁喝茶，我也很喜歡這種隨意的喝茶時光。


    「妳爸媽知道這件事嗎？」


    「當然知道，因為客廳和我弟弟房間的東西和錢也都不見了。我父母和弟弟都不希望她再來當家教了，但她完全不理會我們，我行我素，還在我們家留下來吃晚餐呢。」


    「呃……如果妳不嫌棄，要不要我出面趕走她？」


    「啊？」


    逸美瞪大了眼睛，然後呵呵笑了起來。


    「小茜，妳真有趣。妳個子這麼嬌小，好像洋娃娃一樣，到底要怎麼趕她？」


    她笑了一陣子，突然露出平靜的微笑。


    「我心情輕鬆多了。」


    「如果妳不嫌棄，可以隨時找我聊天。」


    「好啊，只要來廚房，就可以找到妳。」


    那次之後，只要那個家教有什麼狀況，逸美就會來廚房找我聊天。我總是忙碌地在廚房內走來走去，逸美也跟著我走去流理台、冰箱和烤箱。只有這種時候，學姊和學妹的立場似乎顛倒了，白石學姊有這麼依賴他人的一面，也讓我感到有點意外。


    即使再怎麼不願意，也會在沙龍遇見那個家教。


    逸美表面上裝得若無其事，親切地對待她，但內心一定累積了極大的壓力。逸美越來越沉默，整天心事重重的樣子。


    「妳怎麼了？」


    即使我問她，她也總是搖搖頭。不知道是否因為太煩惱了，她看起來越來越憔悴。如果是我，一定會要求對方別再當家教，也不讓她來參加文學社，但逸美無法這麼冷酷絕情。就好像我因為家裡的料理發生了火災，想要開西餐廳和蛋糕店的夢想破滅，失去了一切後，她向我張開了溫暖的雙手一樣，她也無法對那個貧窮卑鄙的獎助生不睬不睬。


    認識逸美之後，完全改變了我以前對她的看法。她是能夠巧妙『壓拌』人際關係的人，能夠在擠壓不滿和擔憂這些氣泡的同時，充滿快樂地和其他成員混合在一起，建立恰如其分的關係。既不會過度壓抑自己而塌掉，也不會過度表現自己，導致彼此的關係出現裂痕。我以前一直以為小百合發揮了這樣的作用，沒想到逸美也扮演著緩衝的角色。也許正因爲她能夠掌握分寸，才能夠勝任社長的職務。


    某天放學後，我正在埋頭製作隔天討論會時要給大家吃的芭芭樂慕斯，所以最後才離開沙龍。在我清洗完畢，擦完工作臺，正準備離開時，發現沙發上有一本記事本。一看鱷魚的封面，我就知道是逸美的。我正想打她的手機，門打開了，逸美走了進來。


    「啊，太好了，原來在這裡。」


    她從我手上接過記事本，如獲至寶似地緊緊抱在懷裡。


    「幸好是你發現的，如果是她，搞不好又會被偷了。」


    「她還沒有收手嗎？」


    我問逸美，逸美立刻愁容滿面，淚水在眼眶中打轉。


    「學姊？」


    「不瞞妳說……昨天她偷了我心愛的東西。」


    「怎麼會這樣！她偷了什麼？」


    「髮夾，上面有鈴蘭的圖案。」


    「會不會是妳媽……或是管家收起來了？」


    「我問了她們，沒有人動過，我特地收在梳妆台裡。」


    「好過分……」


    「如果只是偷其他東西也就罷了，只有那個髮夾不行。那是已經死去的奶奶特別為我訂製的。」


    「應該去報警，這根本是犯罪行為。」


    「不行。耶穌不是說，要寬恕對自己犯罪的人嗎？」


    逸美露出慈愛的微笑。


    「她很可憐，因為經濟的貧窮導致心靈的貧窮，我相信她也有自己的苦衷，改天會和她談一談，我相信她人不壞，所以，妳也不要責怪她。」


    幾天后，逸美開心地對我說：


    「我決定和她談一談，明天放學後，會去露台和她談話。那裡是她喜歡的地方，也不必擔心會被別人聽到，她一定會向我敞開心扉。」


    雖然那個人在我心中，只是卑劣的小偷，但逸美仍然想要維護她的隱私。我相信她遇見逸美這麼善良的人，一定會自我反省。


    沒想到 ─


    為什麼會變成這樣的結局？我看到逸美躺在花圃的屍體時呆若木雞。她們鬧翻了？她以為逸美要責備她，所以惱羞成怒？還是……一開始就打算把逸美推下去，所以特地約在露台？


    我高估了她，以為她會反省，停止偷竊行為。我真是太天真了。逸美的屍體在圍觀的同學的慘叫和啜泣聲中被抬走，我呆然地看著眼前的一切。這時，我發現逸美沾滿了血的手上握了一枝鈴蘭花。


    鈴蘭花。


    我立刻意識到，那是逸美留給我的死前訊息。那枝花告訴我凶手是誰，而且那枝花中凝聚了逸美高貴的靈魂，她直到最後一刻，都想要寬恕那個罪人。


    逸美死去的這一個星期，學院方面、白石家和警方都想要瞭解逸美的死亡真相，為了瞭解她死亡的真相，努力思考鈴蘭花所代表的意義。但是，我對此三緘其口，因為我知道，一旦說出凶手，就違背了逸美的本意，沒想到此舉反而引起各種臆測，文學社的成員都遭到了懷疑，各式各樣的傳聞不斷。


    所以，我覺得差不多該說出真相了。雖然這麼做很對不起慈悲為懷的逸美，但我個人無法原諒凶手。我在這件事上背叛了逸美，有朝一日去天堂見到她時，我會向她道歉。


    # 小南茜同學，非常感謝。


    （全文完）


    妳平時總是面帶溫和的笑容，爲大家製作各式甜點，難以想像妳會寫出充滿諷刺的犀利小說。這正是小說這種手法的美妙之處。客觀認識事實，然後用文章加以表達，就會發現自己之前也不曾發現的真實想法。


    小南同學，也許在妳寫這篇小說之前，並沒有發現自己不喜歡逸美……啊，妳明確寫了自己討厭她……妳之前是不是並沒有發現？是不是開始動筆之後，才察覺到自己以前的感情？


    ——啊，果然是這樣，這也許是這次主題真正的意義，我們要用真實想法緬懷故人。


    話說回來……妳寫的內容真耐人尋味。妳想要告訴我們，妳知道誰是凶手。但是，這和剛才的朗讀作品相互矛盾。真相到底是什麼……？身處黑暗中，總覺得甚至無法分辨真相和虛構，讓人腦筋錯亂。


    真期待其他各位接下來的朗讀內容，但也忍不住有點害怕。不知道每個人到底帶來了怎樣的故事？


    啊，對不起，小南同學，請先回覆。雖然妳說自己國文不好，對寫作完全沒有興趣，但妳的文章寫得很不錯，充滿了少女的辛辣。


    各位請給小南茜同學熱烈的掌聲。


    啊，好大的雷聲。暴風雨似乎沒有停止的跡象，雨也越下越大了，大得有點嚇人。


    對了，各位的飲料夠嗎？接下來會給各位送上雪酪雞尾酒。因為室內光線太暗，在送雞尾酒時，暫時用一下蠟燭。各位不要客氣，換上新的雞尾酒吧。


    ————啊喲，二谷同學，妳的臉色怎麼這麼蒼白？而且為什麼急著把髮夾拿下來？妳剛才不是說，那是逸美的遺物？……逸美送給妳的嗎？


    各位同學，食材已經煮太久了，我知道各位聽朗讀出了神，但也不要忘了吃東西。


    接下來——輪到哪一位了呢？啊，是留學生的蒂安娜·德秋貝同學。不必這麼匆忙，等妳吃完之後再朗讀。


    # 4. 朗讀小說〈春天的巴爾幹〉


    留學生 蒂安娜·德秋貝


    我的祖國保加利亞自古以來，就有關於吸血鬼的傳說。


    說到吸血鬼，羅馬尼亞特蘭西瓦尼亞地區的德古拉伯爵很有名，但保加利亞也有許多嫁給了吸血鬼之類的民間傳說。


    我居住的雷巴格拉德村位在巴爾幹山脈的山麓，聽說有一個吸血鬼以年輕女孩的外貌現身。大家都叫那個吸血鬼「拉彌亞」，因為她會使用巫術，所以更像是巫婆。


    每到春天，村莊內就會舉行拉彌亞之宴。入夜之後，大家聚集在一起，點燃堆得像山一樣高的枯枝，在熊熊燃燒的篝火旁跳舞狂歡。年輕女生穿上黑色洋裝，接二连三地撲向別人，假裝吸別人的血。巨大的火圍在村莊內宛如發笑般搖曳擺動，村民們焚香喝酒，輪流吸著水菸草。篝火的熱氣把每個人的臉都熏紅了，映照了火光的眼晴宛如在燃燒。


    吸血鬼是活著的死人。盛宴的夜晚，死人和活人之間的界線消失，死人的靈魂會四處遊蕩。正在唱著、跳著的人越歡樂，越可能是早就已經死去的人。


    其中有一個人穿黑色烏鴉羽毛洋裝，渾身散發出妖氣和晦氣的女人。一雙濕潤的漆黑眼眸，光澤如蠟般的白色肌膚。每當她在篝火周圍舞動，汗水四散，長髮撫動周圍的空氣，人們暫時忘記了歌唱，出神地看著她舞動。


    每個人都喃喃說著：「她是拉彌亞。」那個女人就是如此美麗，如此神秘。那個女人就是逸美。


    我姊姊艾瑪帶她來參加祭典。


    雖然我叫她姊姊，其實我們是雙胞胎，兩個人的年紀相同。我家很窮，勉強能夠讓我們姊妹兩人一起上高中。我小時候因為車禍受傷後，左腳不方便，所以無法外出打工，但村莊裡其他孩子都會靠採花或送蔬菜打工賺錢。艾瑪從小就幫忙農園幹活或是照顧牛隻，上高中後，去了從村莊搭車要一個小時的鎮上一家旅行社打工，幫助家計。艾瑪健康開朗又活潑，在學校也很受歡迎，她的夢想是希望有朝一日去各國旅行，所以才會選擇這個工作。


    雷巴格拉德村是距離首都索菲亞很遠的一個小村莊，在著名的薔薇谷所在地卡贊勒克的近郊，村莊本身並沒有任何值得觀光的特色，除了有有人在去薔薇谷的途中短暫停留以外，並沒有太多人造訪，但自從姊姊艾瑪去旅行社上班後，積極帶觀光客來雷巴格拉德村，村莊也漸漸繁榮起來。


    艾瑪之後又在雷巴格拉德村推動了讓外國遊客住宿在普通家庭的服務，沒想到大受好評。那些觀光客不是去美國或英國，而是特地來到保加利亞，代表他們很想瞭解這片土地的日常生活，也希望有機會親身體驗。讓遊客住在村民家中，吃村民做的菜，帶他們去附近參觀的企畫大獲成功。由於不是住在飯店，而是住在村民家中，所以遊客和村民之間偶爾會發生糾紛。有時候遊客會弄髒村民家裡，或是大聲喧嘩，也有人很沒禮貌，但在各國遊客中，日本的遊客個性溫和，愛乾淨，很受村民的喜愛。之後，我們都愛上了日本和日本人。


    不久之後，日方面向旅行社洽詢，是否可以讓日本的高中生寄宿兩個星期？只有一名學生，那個學生和我們同年，我們在討論後決定讓那個學生寄宿在我家。於是，逸美來到了我家。


    和逸美同行的北條老師忙於參加國際進修和參觀學校，基本上由我和艾瑪照顧

