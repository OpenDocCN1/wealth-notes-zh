    聽說日本是一個小國家，所有的一切都是小而美，和服應該如實表現了日本人在這種空間狹小的生活中醞釀出來的智慧。放在行李箱底的和服比逸美穿在身上時更美，日本人應該自古以來，就是富有自尊和獨創性的民族。


