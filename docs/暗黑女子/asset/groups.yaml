    媽媽滿臉不悅，接二連三地把松露巧克力放進嘴裡。


    「不行。學校禁止學生打工，所以才會叫我辭去超市的工作，讓我去當家教。這次再違反規定，搞不好會被退學。」


    「要隱瞞還不容易？」


    「即使我拿不到獎學金也沒問題嗎？」


    「我一開始就反對妳讀私立學校，即使被退學也沒關係啊。」


    弟弟吃了滿嘴的巧克力，媽媽爲弟弟擦拭嘴巴時說。


    「而且，妳並不是每天都去家教，但每天都很晚回家。」


    「因爲……我參加了社團。」


    「社團？」


    「對，文學社。」


    「喔，妳原本就喜歡看書。真好命啊。」


    「請妳不要用這種方式說話。如果妳不喜歡這種生活，當初不要離婚不就好了嗎？」'
