    我在沙龍結交了很多朋友，也拉近了和內心崇拜的逸美學姊之間的距離。


    今年春天，一起去保加利亞短期留學後，我們的關係更密切了。雖然只有短短兩個星期，但實在太開心了，我們整天興奮不已，連帶隊的小條老師都有點受不了我們。


    對日本學生來說，保加利亞是一個未知的國度，學校內之前也沒有人想去那裡短期留學，但逸美學姊前一年提出了申請，成為全校第一個去那裡的學生。通常短期留學時，大家都會申請去美國和英國，所以起初聽到逸美學姊去保加利亞時，我感到不解，為什麼要去那種（我知道不應該這麼說）非主流國家？而且當時只有一个人參加，我覺得逸美學姊真有勇氣，所以，第二年時，我也報名參加了保加利亞的短期留學，因為我暗自期待，如果運氣好的話，也許只有我和逸美學姊兩個人參加。沒想到我的願望成真了！學姊也很高興地說：「太高興了，去年只有我一個人參加，好無聊喔。」我們到處觀光，度過了快樂的時光。


    這趟短期留學，也讓我對逸美學姊有了很多新發現。


    我們沒有住在都市，而是寄宿在小村莊的家庭，是一次非常良好的經驗，而且也結交了蒂安娜和艾瑪這兩位好朋友，是非常寶貴的經驗。


    我原本住在貝西太太家，照理說應該安排我有自己的房間，沒想到貝西太太叫我睡在客廳。說白了，那是艾瑪安排的疏失，但她臉色鐵青地說，一時無法找到其他家庭安排我寄宿，所以我對她說，住飯店也沒有關係。學院方面要求，一定要寄宿在當地家庭，這也是短期留學的精隨，但最後我还是被迫住去了飯店。照理說，我應該向學校方面報告這件事，看到艾瑪這麼努力工作，我為她隱瞞了這件事。蒂安娜一再向我道謝：「志夜，妳真好，如果艾瑪失去世份工作，我們一家人的生活就會有問題。」「我們是朋友，幫忙這點小事當然不足掛齒。


    說到朋友這件事，我們一起去里拉修道院時，逸美學姊為我們每個人買了一條相同的幸運手環。把幸運手環綁在手上時要許願，右手是戀愛，左手是功課，右腳是友情，左腳是財運。我希望和逸美學姊變成更好的朋友，所以立刻綁在右腳上。不過我不好意思當著逸美學姊的面綁，所以偷偷地、很快綁好了。艾瑪和蒂安娜都綁在右手。艾瑪有男朋友，所以許願可以趕快結婚。蒂安娜什麼都沒說，可能有喜歡的人吧。


    我一心祈禱，希望幸運手環趕快斷掉，希望願望很快實現，沒想到隔天竟然真的斷了。通常幸運手環不會那麼容易斷，所以我很驚訝，但的確為我實現了願望。


    我在留學期間和逸美學姊迅速拉近了距離，好像親姊妹一樣。


    在日本，說到保加利亞，大家都會想到優格，在那裡，不管吃什麼東西都會淋上優格。日本人通常覺得優格是甜點，但那裡的人無論在蔬菜、魚肉上都會加優格。除此以外，保加利亞還有玫瑰！玫瑰精油、玫瑰水、玫瑰果醬……我買了很多伴手禮。女生都喜歡玫瑰，所以無論去哪裡都開心，但最令人難忘的就是那天去村莊附近的湖畔野餐。


    早春的樹林中綻滿了含羞草和木蘭花，湖水寧靜清澈，小鳥歡啼……簡直就像是走進了童話的世界。我們坐在草皮上，用鼻子汁乾杯後，吃著三明治。保加利亞有很多世界遺產和遺跡，艾瑪帶我們去參觀了不少名勝古蹟，但我喜歡那次純樸的野餐，更何況只有我和學姊兩個人而已。艾瑪她們那天剛好有事，所以我們決定找一個地方悠閒放鬆一下。


    因為湖水太美了，我們沒帶泳衣，所以脫下衣服在湖裡裸泳。雖然水有點冷，那天剛好是五月的晴朗天氣，所以很爽快。逸美學姊的身材真是太棒了，當她從水裡走上來時，一頭長髮貼在她性感的身體上，水瀉反射著樹葉縫隙灑下的陽光……宛如威廉·阿道夫·布格羅的「維納斯的誕生」。恕我聲明，我看過真跡，以前我在法國時，就住在奧塞美術館附近，我覺得學姊的裸體比布格羅的畫更性感。


    對了，妳們知道維納斯是來自男人的生殖器嗎？天神烏拉諾斯厭惡自己醜陋的孩子，讓孩子回到妻子蓋婭的胎內。蓋婭盛怒之下，命令兒子用鐮刀割下烏拉諾斯的生殖器做為懲罰。生殖器丟進海裡後，精液變成了泡沫，維納斯就誕生了。


    以下是安德羅·波利齊亞諾²根據這個神話所寫的詩。


    在波濤洶湧的愛琴海，

    迎接了忒提斯臂腕中的生命根源，

    星空運轉，

    於海浪間漂浮，白色的泡沫包覆，其間诞生了舉止優美歡快、容顏神聖的少女。放縱的西風神一路吹送，她乘著貝殼漂到海岸，天神也為她感到歡愉。


    說到以維納斯誕生為題材的繪畫，桑德羅．波提切利也很有名，聽說他是受到這首詩的啟發，畫出了維納斯。


    話說回來，居然割下生殖器，丟進大海……太可怕了。但是，天神的去勢造就了維納斯的美麗，這一點我完全認同。仔細想一想，就覺得一男人的去勢所創造的美一完全符合逸美學姊的感覺。完全排除男人的世界……原來是女子學校才有的神圣美麗。極致的美，果然必須在特殊的環境下才能誕生吧。


    > 2. 編註：安德羅·波利齊亞諾，一四九四年，佛羅倫斯文藝復興時期重要的人文主義詩人。


    學姊的裸體絲毫沒有猳穢感覺，而是清純神祕，充滿生命的光芒。背景的空中吹著輕風，花草在綠色的大地萌芽，湖面泛著漣漪，宛如在讚頌逸美學姊是女神。如此的肢體，竟然露出聖母般柔和的眼神，簡直太犯規了！如果我是男人，會被她出眾的美麗迷惑，神志不清地直接跳進湖裡。啊，這個點子搞不好可以用在一部作品，嗯。


    野餐後，原本要跟著北條老師一起去美術館，但游泳之後，我不太想去美術館，就謊稱身體不舒服，和他們分頭行動。我一個人悠閒地四處拍照，真的拍了不少照片。


    因為曾經在國外生活多年，所以即使在第一次造訪的國家，一個人四處走也不怕。也許是早就習慣了這種生活。因為爸爸公司外派的關係，我從小一年級到六年級都住在法國，爸爸媽媽曾經帶我去過歐盟的很多國家。義大利、西班牙、德國、瑞士、比利時、英國……當時覺得沒什麼，現在回想起來，發現自己很幸運。


    法國是我的第一故鄉，我希望有機會再去那裡生活。我覺得比起狹小的日本，

    我更适合國外的生活，國外更能夠讓我有心情平靜的感覺，難道因為是歸國子女的關係？


    正因為我小時候曾經住過國外，在小說的創作時，要比別人對日文更加執著的想法才會這麼強烈。嗯嗯，一定是這樣。在法國那六年的生活已經內化成我的血肉，對我的創作也有幫助。


    短期留學結束後回到日本，我和逸美學姊相處時，仍然無法擺脫和情同姊妹的感覺，有時候在文學沙龍時，也常常和她打鬧，或是故意和她鬥嘴，想要吸引她的注意力，逸美學姊似乎也樂在其中，接受我對她撒嬌。


    蒂安娜來日本之後，我們三個人經常聚在一起聊保加利亞的事。其他都不太瞭解，所以對其他人有點不好意思，但我們總是忍不住聊得很投入。園子學姊明顯露出不耐煩的表情，這也沒辦法，因為那是一段很特別的回憶。


    復活節園遊會時，我仍然完全沉浸在姊妹模式中。


    我被分配去當復活節兔子（聽說是學院的董事長，也就是逸美爸爸的主意）。


    我去執行委員會室拿兔子裝時，發現地上放了一整排頭部和身體分開的兔子。雖然復活節兔象徵著生命的繁榮和復活，但和身體分開的頭部，和白色塑膠圓形中塗上藍色顏料的雙眼令人聯想到殘酷的死亡，讓我感到超害怕。


    穿上兔子裝後，發現又重又悶熱。想到要連續好幾個小時穿著兔子裝，心情就很憂鬱，忍不住詛咒自己的抽籤運太差了。穿上兔子裝，請人幫我拉好背後的拉鍊，再戴上頭套，最後才戴上胖鼓鼓的手套。啊，我難得擦了指甲油。平時學校禁止學生擦指甲油，但用塗復活節彩蛋剩下的油漆擦在手指上不會挨罵，所以大家這麼做。我擦了可愛的淺綠色，結果穿上這身兔子裝，根本白擦了，虧我還戴了假睫毛。


    扮成復活節兔的我快樂地邊走邊舞，有時候向小朋友打招呼，陪他們一起找復活蛋。兔子裝穿在身上超重，肩膀都痙了，但我盡可能用力揮手，用力抬腿、扭腰擺臀。


    > 「啊呀，該不會是志夜？


    不知道哪裡傳來叫聲。兔子裝的耳朵部分是網狀，雖然可以聽到聲音，但聲音很不清楚，所以無法分辨是哪裡傳來的聲音。我在原地團團打轉，尋找到底誰在叫我。


    「這裡啦。」

    有人伸出雙手摸著我胖鼓鼓的手臂，隔著頭套的小洞，只能看到制服裙子。

    「誰？」

    「逸美啦。」

    「啊，逸美學姊。大家穿的都一樣，妳怎麼知道是我？」

    「一眼就認出來了。」

    「為什麼？」

    「因為妳跳的舞最難看啊。」逸美學姊發出嗤嗤的笑容。

    「學姊，妳好過分。我這麼賣力跳舞，渾身都是汗。」

    「很熱嗎？」

    「熱死人了。」

    「是嗎？真可憐，妳跟我來。」


    學姊挽著我的手臂，假裝和復活節兔一起跳舞，把我帶去體育館後方。


    「這裡不會有人來，妳脫下來休息一下。」


    太感謝了。我脫下滿是汗水的手套，把頭套往上拔，但頭套太緊了，怎麼拔都拔不出來。


    「學姊，拔不出來。」


    「啊！」


    逸美學姊也幫忙我一起拔，但頭套卡在下巴，遲遲拔不出來。


    「好痛好痛，學姊，痛死我了。」


    「這點小痛忍耐一下，再來一次。」


    她用力拉扯著，我的脖子都快被她扯斷了。


    「好痛好痛，真的好痛。逸美學姊，妳好過分，我絕對不會原諒妳。」


    我們大聲吵鬧著，這時聽到了腳步聲。慘了！如果被人發現復活節兔在偷懶，會被逸美的爸爸罵。


    「學姊，怎麼辦？」


    「妳從另一側逃走，我掩護妳。」

    「但是……」

    「廢話少說，快走吧！」

