    而且，這次留學有著重大意義。我是聖母女子學院的首位留學生，也就是說，如果我能夠為學院帶來良性刺激，明年之後，每年都將從雷巴格拉德村的高中招待一名學生來日本留學。一旦實現這個計畫，將是村莊的極大榮譽，屆時將由艾瑪的旅行社居中斡旋，艾瑪也可以因此領到獎金。所有這一切都取決於我的留學生活，所以，我除了用功讀書以外，還積極參加復活節、音樂節等活動，希望這個制度能夠持續下去。


    剛來日本留學時，對日本這個國家，以及只有女生的學校感到有點無所適從。


