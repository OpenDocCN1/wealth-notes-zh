    ### 2. 朗讀小說〈某位同學的朗讀後台〉


    （註：此處為轉場，根據原文順序，接下來是第三章內容）


    ## 3. 朗讀小說〈馬卡龍麵糊〉


    二年B班


    小南茜


    說句心裡話，起初我不怎麼喜歡白石逸美這個人。


    不，我討厭她。


    我和比我大一屆的學姊白石逸美彼此不認識，當然也沒有說過話，但逸美不光是董事長的女兒，而且容貌出眾，穎悟絕倫，在學校內是無人不知的名人，所以我很久以前就知道她了。不光是高中部，就連小學部和中學部都有她的粉絲，經常擠在她的教室前看她，我總是冷眼旁觀這些事。


    她身材高挑，手腳修長，笑容很燦爛，無論走在哪裡，她優美的身影都可以吸引眾人的目光。她是理想的八頭身，五官很漂亮，一雙迷人的雙眼令每個學妹豔羨不已，像花蕾般的雙唇兼具氣質和性感，還具備了與生俱來的良好家世造就的高雅氣質。


    「美女」這種陳腔濫調的字眼不足以形容她。沒錯，麗人。她是一個所有方面都很端麗的人，這正是我不覺得她美麗的原因。


    白石逸美太完美了。通常在做蛋糕裱花，或是和菓子裝飾時，為了增添趣味，會故意讓左右不對稱，因為這才是深奧的魅力。但逸美的容貌未免太端正了，好像經過了綿密的計算，完全找不到任何缺陷。完美的東西毫無美感，反而很低俗。所以，我輕視那些感應逸美美貌的同學，覺得她們絕對不瞭解什麼是真正的美。


    聽說白石逸美讓已經停擺了數年的高中部文學社復活時，我也覺得只是有錢有心血來潮而已，而且，文學社的成員只有社長白石逸美和副社長澄川小百合兩個人，更讓我覺得是這麼一回事。但是，隨著修道院的改建，建造了豪華的文學沙龍，簡直就是少女的夢幻城堡，這件事成為全校學生討論的話題，而且，聽說只有白石逸美親自邀請的人才能成為社團成員，白石逸美和文學沙龍越发成為全校學生嚮往的對象。當時，我還是中學部三年級的學生，周圍的同學都以一年年升上高中部，一定要受邀參加文學社為目標。


    所以，升上高中部之後，獲得輕小說文學獎的同學高岡志夜受邀逸美的邀請，成為文學社頭號會員時，大家不知道有多羨慕。當輾轉聽到志夜談論茶會——英國或法國的頂級茶葉、德國麥森瓷器的茶具、比利時皇室御用的Wetters
    薩赫蛋糕的情況時，每個人都忍不住驚嘆。也許是因為沙龍太舒服了，志夜不慌婉拒上電視和雜誌的採訪，放學後就整天泡在沙龍。她興奮地告訴大家，在巴卡拉的水晶燈下寫作時下筆如有神助。


    但是：⋯⋯我忍不住暗自皺眉。


    文學沙龍需要巴卡拉水晶燈和麥森瓷器的茶具嗎？


    我家經營老鋪料亭，從小大人就教導我，華美過度就變成了低俗。品味不是追求華麗，而是簡外慧中，舊外慧中的深沉，和歷經歲月的沉靜，低調不經意的高雅才是真正的品味。


    傳聞中光鮮亮麗的文學沙龍根本毫無品味可言，所以我總是在心裡數落沙龍的低俗，這和我不喜歡逸美的理由是一樣的。


    我父親是那種傳統低調而又頑固的老派主廚，連續多年拒絕了百貨公司請他去開店的邀約，也拒絕了上電視的邀請。雖然也有不少人上門拜託他出版料理的相關書籍，但他一貫堅持廚師只要做美味佳餚的態度，也不開分店。基於希望客人品嚐他當場現做的料理，所以也堅持不賣便當或不做外送，唯一可以在店外嚐到父親手藝的，只有代替歲末賀禮，送給極少一部分老主顧的年菜，但年菜並不是訂購制，也不是隨便送給所有的客人，所以被視為夢幻絕品的年菜。


    母親是和菓子店的獨生女，多年來，都是她在頑固的父親背後默默地支持。數十年來，都是由母親親手製作在懷石料理的最後，發揮畫龍點睛效果的當季和果子，為父親的料理增色。每個月、每一季，他們都會在討論後決定主題，父親根據主題精心製作每一道懷石料理，母親除了做和菓子，還會準備店裡的插花和掛軸。


    或許是因為繼承了父母的基因，我從小就喜歡往廚房跑。


    我家的廚房是傳統的水泥地廚房，用的是父親特別打造的爐灶。我從小看著母親清晨五點在廚房，用柴魚片、昆布放在深鍋內，熬一家四口三餐所用的高湯。經過細心過濾的液體，變成早餐的味噌湯，午餐的厚煎蛋，和晚餐的燉菜或茶碗蒸，味道和外形都有各種不同的變化。我很自然地深受吸引，也因此產生了興趣。我在三歲時第一次拿菜刀，四歲時有了自己專用的菜刀，上面還刻了我的名字。那時候，我已經很會用菜刀了。


    或許是因為我從降臨人世之後，就沉浸在日本料理以及和菓子的世界，所以長大之後，對西餐和甜點覺得很新鮮，在那個世界越陷越深。父親和母親對此沒有任何意見，因為家裡早就決定，料亭將由還在讀大學的哥哥繼承，只有哥哥要學習從清晨打掃店裡，到去市場進貨，以及根據食材做準備工作，接受這些斯巴達式的教育。我總是帶著羨慕的心情看著哥哥學習手藝，因為父親甚至禁止我出入料亭的廚房。哥哥才是大正元年（一九一九年）創立的料亭「小南」的第四代，即使我拿菜刀，學廚藝，或是學做西點，對父母來說，都是為日後出嫁做準備而已。


    哥哥學藝很不認真，對料理和餐廳都毫無興趣，整天丟下工作溜出去玩，打烊之後，也不幫忙打掃，三更半夜去飆車，但「小南」還是得由哥哥繼承。我很不甘心，所以更積極投入西餐和西點的世界，只是在我家的老舊廚房內，無法隨心所欲地烤各種蛋糕。


    這時，我聽說文學沙龍內附設了廚房這件事。


    聽說沙龍附設的廚房十分寬敞，各種設備一應俱全，使用很方便，文學社的成員有時候會在那裡烤蛋糕，或是做慕斯，享受下廚的樂趣。


    我和其他同學不一樣，對水晶燈、大理石桌子、暖爐或是下午茶完全沒有興趣，但得知那裡有廚房後，第一次被文學社吸引了。


    我之所以能夠參加這個必須被社長逸美相中，才能加入的文學社是有原因的。在說這個原因之前，不得不先提起那件可怕的事。


    事情的起源是我父親年輕時當學徒的料亭老闆打算退休，問父親可不可以由「小南」接收他的店。


    雖然是恩人上門拜託，但父親意興闌珊。不光是因為開店需要資金，更因為一旦開了分店，在管理上必定會出現疏失。我父親深信，除非親自掌廚，否則就不該開分店，卻又不能輕易拒絕恩人的拜託。父親為此煩惱不已，我提出了一個建議。


    不如把那家店改成做西餐。


    既然是「小南」西餐廳，即使不是由父親掌廚，客人也會接受，又可以不辜負師父的心意。父親很贊同我的提議，讓我參與餐廳的內部裝潢和菜單的設計，而且還決定把我登記為餐廳的老闆，日後由我掌管那家餐廳。


    我終於比哥哥更受到父親的認同，我對此感到樂不可支。


    無論在搭電車上下學時，還是課間休息時，我滿腦子都想著新餐廳的事。父親的朋友將在西餐廳擔任主廚，我把自已絞盡腦汁想出來的菜單拿給你看，請他挑選搭配的餐具。我希望餐廳能夠提供豐富的甜點。蛋糕、布丁、慕斯、芭芭樂慕斯、冰淇淋、甜塔。對了，要讓客人可以外帶甜點——我每天都在想這些事，天天都沉浸在幸福之中。


    完全沒有想到，那個夢很快就破碎了。


    那天放學後，白石逸美在鞋櫃前叫住了我。


    「妳是小南茜吧？」


    我個子矮小，必須抬頭看她。近距離觀察時，發現她的肌膚宛如細心發泡的鮮奶油般光滑，嘴唇像浸了糖漿的櫻桃般鮮紅滋潤，無懈可擊的美貌令人驚嘆。學妹們經過時，都忍不住頻頻瞄她。


    「是啊。」


    其他學生被逸美主動打招呼，或許會感到高興，但我並不是她的粉絲，事後想起來，當時的回答真的很冷淡。


    「我看了妳寫的《斜陽》的感想，很有意思。」


    我並沒有看很多書，但班導師北條老師覺得我在現代國文的課堂上寫的閱讀感想很不錯，刊登在校刊上。因為我只是隨便寫一寫，如果是年長的老師，一定會罵我：「要認真寫。」二十多歲的北條老師可能和我們的感受相近，所以對這篇文章讚不絕口。


    「妳把女主角和子與現代單親媽媽進行分析比較很獨特，我希望有機會聽妳聊聊進一步的想法。如果妳時間方便，要不要來文學沙龍喝荼？」


    我突然想到有關廚房的傳聞，很想去親眼目睹一下，但又不太想和逸美聊天。


    「不……不用了。」


    「沒關係，來坐一下嘛。我烤了磅蛋糕，才剛出爐。」


    「妳們也會自己做甜點嗎？」


    她的這句話不由得激起了我的競爭意識，很想讓她們見識一下我做的蛋糕。


    「對啊，讀書會當然少不了甜點。而且，在學校舉辦活動時，我們也會大量製作後販賣，做為社團運作的基金。」


    廚房。而且是可製作大量甜點的廚房。


    「請問……是用瓦斯還是電力？」


    「妳指什麼？」


    「烤箱。」


    逸美露出驚訝之色，隨即大笑起來。


    「瓦斯啊。妳真有意思，第一次有人問我這個問題。」


    於是，我受邀去了文學沙龍。


    那完全是我夢想中的廚房。寬敞又清潔，同時有L形和島形工作台，還有三個附花灑的大水槽、銀色的營業用冰箱、直立式攪拌器、麵包發酵箱。


    「太讚了……」


    我忍不住驚嘆，撫著擦得一乾二淨的工作台。在工作台冰涼涼的大理石上揉派皮應該很方便，巧克力的調溫時也可以使用。這裡的設備太奢華了。


    「這就是烤箱，符合妳的期待嗎？」


    逸美手指的牆邊有三台瓦斯烤箱，一台可以烤兩、三個八吋的蛋糕。


    ［好棒喔。］


    打開烤箱旁的門，那裡是一間人可以走進去的食物儲藏室，裡面有高筋麵粉、低筋麵粉、細砂糖、銀珠、核果類、香草棒、可可粉、瓶裝水果、果醬、蜂蜜、各彩繽紛的辛香料……到底可以做多少種類的甜點？很多材料都是進口的，光是那些漂亮的包裝就令人目不暇給，很想坐在這裡看一整天。


    玻璃碗、抹刀和刷子這些廚房工具也都排得整整齊齊。因為自己即將開餐廳，我去逛了很多店，所以對這些東西很內行，而且發現所有的工具都是超一流的。


    ［好棒喔，比我的餐廳更出色。］


