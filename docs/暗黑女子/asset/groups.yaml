    7. 朗讀小說〈死者的呢喃〉


    前社長 白石逸美


    代理朗讀 澄川小百合'
  - '[PAGE 218]


    自己不是主角的人生，到底有沒有意義？


    即便是再優質的故事，即使充滿了濃密的伏筆，如果不是為自己所準備的，就太無趣了。


    而且，既然要成為主角，當然要選人生最燦爛的時期——比方說，高中時代的三年期間，年輕而婀娜，是充滿生命力的季節。


    想要當主角，就必須有配角，而且必須是願意襯托主角的出色配角。只有出色的配角才能襯托主角的魅力，但又不能搶了主角的風頭。


    配角的水準決定了故事的好壞，怎樣的配角決定了主角的等級。配角的水準越高，主角的表現就越活躍出色。


    但最傷腦筋的是，配角也對主角的寶座虎視眈眈，稍不留神，就會被篡位。


    想要成為主角，而且持續成為主角，需要努力和工夫，必須隨時站在配角之上。


    如何才能做到這一點？


    那就是掌握秘密。


    如果說，他人的不幸甘如蜜，那他人的秘密就是極致的調味料。一旦掌握了他'
  - '[PAGE 219]


    人的秘密，人生的芳香就更加豐富多彩，滋味更加刺激。一個人越美麗，越優秀，秘密往往越醜惡，發現他人秘密的愉快感覺簡直妙不可言！


    掌握秘密後，就搶走對方的地盤，把對方逼入絕境。掌握他人的秘密，就是掌握了那個人的靈魂，這無疑是世界上最大的快樂。


    所以，當掌握他人秘密時，自己的故事就誕生了。


    # 比方說——


    舞台設定在聖母女子學院高中部的文學社。主角是我。


    # 1


    山間的朝陽莊嚴地照在窗外，淡淡的薰衣草色天空變成了透明的橘色。我半夢半醒地躺在床上，看著眼前的變化。'
  - '[PAGE 220]


    「逸美，妳醒了嗎？」


    他在我耳邊呢喃。從昨晚開始，他的手臂一直從背後摟著我。


    「對，但我還想繼續躺一下。」


    聽到我這麼說，他吻著我的肩膀，把臉埋進我的頭髮。在東歐這個美得令人嘆息的美麗早晨，享受這片刻的甜蜜時光。我們感受著彼此肌膚的溫度，珍惜每一個瞬間。因為我們知道，宛如被繭保護起來的甜蜜時光無法持續。


    一旦回到日本，我們又會被迫分離。


    教會女子高中的教師和學生之間的禁忌關係，雖然我們已經對彼此瞭解得十分透彻，但在大家面前，我還是得叫他「老師」，和他保持距離，天知道這有多麼折磨人。心愛的人就在眼前，他卻無法觸摸我，也無法對我甜言蜜語，這是多麼痛苦的事。在我瞭解這份痛苦後，覺得班上的每個同學都很幼稚。


    「慎二。」我叫著他的名字，那個我深愛的名字。


    「什麼事？妳想喝咖啡嗎？」


    「對。」'
  - '[PAGE 221]


    他的雙手輕輕鬆開我的身體，翻身下了床。在他磨咖啡豆，煮開水的時候，我再度昏昏沉沉地看著窗外的美景。

    我忍不住想，如果此刻可以變成永遠，不知道有多幸福


    春假的短期留學結束後回到日本，立刻進入了新學年。

    無聊的日常生活，不得不恢復「老師」和「學生」關係的生活。


    我升上了三年級，高中生活只剩下最後一年了。

    我在教室內茫然地看著窗外。那不是東歐的美麗景色，而是學院的校園，而且今天沒有他的課。如果不是幸運地和他在走廊上擦身而過，就不可能見到他。雖然我之前的偶爾會沒事找事去教師辦公室，但雙方的眼中只有對方，很擔心其他的人會察覺到我們之間交流的溫度，所以除非有特別的事，否則我不再去教師辦公室。


    但是，放學後就可以見到他。想到這裡，內心雀躍不已。放學後，可以在文學沙龍見到他。當初讓文學社復活，就是為了創造和他在一起的時間。


    > 「逸美，保加利亞怎麼樣？」'
  - '[PAGE 222]


    當我陷入甜蜜的回憶時，有人問我。是小百合。和我從小一起長大的閨蜜澄川小百合目前擔任文學社的副社長。


    聖母女子學院高中部創立超過六十年，很久之前就有文學社，但在我進入高中的幾年前，文學社處於休社的狀態。在這所每個年級只有一百二十名學生的小規模女子高中內，英語會話社、戲劇社、音樂社、舞蹈社這些時下熱門的社團通常比較受歡迎，閱讀、寫感想這種一個人也可以做的事，似乎無法吸引時下的女學生，所以社團成員一個接著一個退社，最後文學社變成了空殼子。曾經擔任文學社顧問的北條老師告訴我這些事時，忍不住苦笑起來。


    北條老師是曾經立志成為小說家的文學青年，在我進入高中部後第一次上國文課，見到這位二十四、五歲的老師，立刻對他一見鍾情。他有著一頭柔順的頭髮，憂鬱的雙眼和嘲諷的態度，彷彿閱讀小說，只是為了確認現實有多麼醜陋。但他的笑容親切爽朗，讓人情不自禁地被牠吸引。我無法自拔地愛上了他。


    我徹底調查了他的一切。他出生在寒冷的地區，有一個姊姊和一個弟弟。卡夫卡深深感動了他。喜歡聽舒伯特的音樂，以及是已經停擺的文學社名義上的顧問。'
  - '[PAGE 223]


    # 小說。


    為了接近老師，我決定讓文學社復活。社團必須至少有兩名成員，學院方面才會核准，所以我讓小百合也提出了入社申請。


    雖然現在文學社的成員增加了，但起初只有我們兩個人而已。文學社剛復活時，老師為了我和小百合兩個人熟切地談論文學，並要求我們寫散文、詩和短篇小說。


    我寫了熱情洋溢的情詩在老師面前朗讀，在讀書會時，挑選了杜拉斯的《情人》等情慾小說做為主題。他漸漸發現了我對他的感情，最後，我終於不是以學生的身分，而是做為一個女人和老師結合了。


    「這次真的很開心，太好玩了。」


    「妳和老師有時間相處嗎？」


    小百合當然知道所有的事。


    「嗯，我有時候會從寄宿家庭溜出來，去他住的飯店。」


    「太好了。」


    短期留學可以挑選自己喜歡的國家，無論想去哪一個國家，學校方面都會安排'
  - '[PAGE 224]


    寄宿家庭。美國、澳洲、德國、韓國和中國都是熱門的國家，但我選擇了沒有人選的保加利亞。因為如果由北條老師帶隊同行，我們就可以單獨相處。在提出申请時，必須用小論文的方式詳述選擇那個國家的理由，但我對保加利亞一無所知，當我一籌莫展時，小百合為我出了主意。


    「保加利亞有伊萬·瓦梭夫這位文學史上重要的作家，你可以寫對這位作家很有趣，想要瞭解他在怎樣的環境下創作出他的作品。」


    小百合幫我調查了作家和作品的相關資料，還為我修改了小論文。多虧有她的幫忙，校方同意我去保加利亞短期留學，並決定由教國文的班導師北條老師同行。


    於是，我在那一年春天，終於可以不必在意任何人的眼光，和北條老師盡情享受假期。今年沒想到高岡志夜也參加了，所以無法一直和北條老師單獨相處。


    每當我站在十字路口時，小百合就會向我提供適當的建議。雖然我們同年，但她的思想很成熟，深思熟慮後的決定不會受到他人的影響，和我完全相反，正因如此，她才是能夠提供我良好建議的好夥伴。當我愛上老師時，也是小百合在背後推了我一把，才讓文學社順利復活；當我在校外和老師約會時，也是小百合為我製'
  - '[PAGE 225]


    造不在場證明。如果沒有小百合，我根本無法談這場戀愛。


    「今天有社團的聚會嗎？」小百合問。


    「聚會」是我和老師幽會的暗號，都固定安排在每個星期三，沒有教職員會議的日子。


    「對啊，有聚會。小百合，到時候再拜託妳囉。」


    交給學校的活動報告上，寫著星期三聚會的目的是为了整理藏書。小百合負責熱有其事地寫下每週的活動內容，並交給校方，其他成員當然不知道我和老師偷偷幽會，她們只知道星期三要整理藏書，所以沙龍不開放。


    所以，我總是翹首盼望星期三的到來。北條老師每週三次上課時，我們只能視線交會，只有星期三放學後的幾個小時，是屬於我們的時間。


    和老師單獨相處的地方。


    我認為必須很浪漫乾淨、豪華而完美。


    所以，文學社在兩年前復活後，我立刻央求爸爸為我建了沙龍。沙龍內有我喜'
  - '[PAGE 226]


    歡的古董家具，窗簾和地毯都是我喜歡的顏色，有可以保守祕密的隔音窗和隔音牆。為了能夠享受正統的午茶時間，還有一個設備齊全的廚房，當然更少不了反映老師興趣愛好、包括珍藏版書籍在內的各類藏書。


    我們可以在沙龍盡情聊天，相互疼惜，贪婪地感受對方的身體。


    對我來說，文學社只是幌子，除了小百合以外，我無意增加其他成員。沙龍只要能夠提供一個不受任何人影響，可以讓我和老師培養感情的空間就夠了。


    但是，我感到不滿足，總覺得好像缺了什麼。


    這裡是我的新城堡，一應俱全，只屬於我的空間，但是，到底缺了什麼呢？


    那時候，我每次和老師幽會結束，關上沙龍的大門時，都在考慮這個問題。


    我和老師孕育著我們的愛情，季節持續變幻，我升上了二年級。


    令人炫目的春天。我倚靠在露台的柵欄旁眺望著中庭，這裡是除了沙龍以外，整個校園中我最喜歡的地方。從這裡可以看到各式各樣不同的學生。有人在草地上看書，有人在吃便當，有人躺著聊天，有人在打羽毛球。校園內傳來可愛的笑聲，'
  - '[PAGE 227]


    放眼望去，都是嬌豔欲滴的飽滿肉體，年輕閃耀著光芒。

    我們是美麗的一群。

    一切只因我們是女高中生，就是那麼美麗而美好。

    無論是一縷頭髮、光滑的肌膚、發亮的雙眸、柔軟的嘴唇、纖瘦的肩膀，還是即將成熟，卻還沒有完全成熟的惱人肢體，或是像柔風般甜美的聲音，一切都是如此美好。

    我很清楚，在這一群中，我的美麗出類拔萃，因為父親是這所學校的董事長，所以無論學生和老師都對我另眼相看。

    身為女高中生的特權只能享受短暫的三年，那是在校園和制服保護下的魔法時光。一旦畢業了，就不再是特別的存在。一旦走出這所女子高中的聖域，魔法立刻就失靈了。

    升上高中部的第一年在轉眼之間就過去了，如今只剩下兩年的時間。焦躁宛如一個小氣泡，從我的內心深處湧現。

    至少在這所學院期間，我要當主角。'
  - '[PAGE 228]


    我必須是唯一的主角。只有我才能在這所學校綻放最閃耀的光芒。這時，我突然恍然大悟。沙龍缺少的是在我的故事中發揮陪襯作用的配角。配角。必須慎選配角。讓美麗和才華足以成為主角的人淪為配角，才是身為主角的美妙滋味。所以，並不是阿狗阿貓都可以當我的配角。誰有資格當我的配角？堅強、聰明而美麗的女生——我的腦海中浮現一個學妹的身影。高岡志夜。自從獲得輕小說的文學新人獎後，無論在校內和社會上都引起了很大的關注。她才貌兼具，有著一身細膩的皮膚和脫俗的美貌。修女校長禁止媒體踏入校園，但經常有拿著攝影機和麥克風的媒體在校門口等待高岡志夜的出現。我決定接近高岡志夜。'
  - '[PAGE 229]


    想要他人聽從指揮，就必須掌握那個人的秘密


    這是我從小到大，見識到爸爸一貫使用的手法。爸爸在生意上和人際關係中都要使用這種手法，掌握對方的秘密，不讓對方有任何活路。爸爸憑著這項不可動搖的原則，將事業拓展到今天的規模。


    我想知道高岡的秘密。


    沒想到在一個偶然的機會，這個願望竟然成真了。


    我在高岡的身邊展開調查，無論學校和家庭，都沒什麼問題。高岡在這段期間持續發表了《君影草》的系列作品，引起了更加廣泛的討論。


    也許高岡並沒有秘密——我幾乎快要放棄了。


    有一次，我在寫給位在法國的姊妹校筆友的電子郵件中，提到了《君影草》這部作品。我們學校要求我們和世界各地的姊妹校學生用電子郵件進行交流，這位筆友問我最近在看什麼書，我提到了《君影草》。


    她在回信中說，她看過一本故事情節很相似的書，並將幾年前發表的那篇短篇'
  - '[PAGE 230]


    小說翻譯成英文後寄給我。我看了之後驚訝不已，因為不只是和高岡志夜的小說很相似而已，內容根本一模一樣。


    我找到了。我找到了高岡志夜的秘密，而且是這麼卑劣的秘密。


    # 高岡


    某天放學後，我叫住了正在收拾東西準備回家的高岡。教室內沒有其他人，只有夕陽從窗戶照進教室，在塑膠地板上灑下我們兩個人和課桌的影子。我第一次主動叫高岡，她似乎有點驚訝。


    「妳看過這篇小說嗎？」


    我把列印出來的法文地方報紙的一篇書評報導放在她面前，夕陽中，我發現她的臉色漸漸蒼白。


    「這是──」她的聲音有點分岔。


    「我太驚訝了，竟然和妳的作品一模一樣。難道妳以為只要妳的作品不翻譯成外文，就不會有人發現嗎？」'
  - '[PAGE 231]


    「我……沒想到會得獎。這是我以前住在法國時，稍微耳聞過的故事。在寫投稿作品時，想起這件事，所以……得獎之後，媒體大肆報導，我不敢說出來。」


    「但是，不是不可以抄襲嗎？」


    「拜託妳，千萬別告訴任何人，」她的聲音顫抖，「我願意為妳做任何事。」


    高岡緊張地拜託著，對我露出求助的眼神。可以左右她命運的快感籠罩了我的全身。


    奉獻、忠誠和完全的隸屬。這些是花再多錢也買不到的東西。只要我掌握這個秘密，就可以從她身上取之不盡，用之不完。


    「好啊，那就當作是妳我之間的秘密。」


    高岡雙眼發亮地抬起頭，她紅著眼，淚水在眼眶中打轉。快感再度貫穿我的背脊。


    「我是文學社的社長，妳要不要加入？」


    「啊？」高岡露出不知所措的表情，「好啊，我當然很樂意加入。但是為什麼邀我加入？」'
  - '[PAGE 232]


    「我希望妳在我身旁為我奉獻，怎麼樣？」

    高岡拚命點頭。也許她認為只要這樣就可以隱瞞抄襲的事，簡直是小事一樁。

    高岡一定不知道，徹底扮演配角的角色有多麼屈辱和鬱悶，也不知道將會多麼耗損自己的靈魂。

    從今以後，這個才華洋溢的學生將聽我的使喚，在我的身旁，為我的一個眼神一喜一憂。從今以後，她只說我滿意的台詞，只做我要她做的事。

    如此這般，我找到了第一個配角。


    在文學社復活的第二年，隨著作家高岡志夜的加入，文學社的活動也漸漸正常化，擔任顧問的北條老師、學院方面和背後的贊助人爸爸都對高岡加入後，文社開始積極活動感到心滿意足。而且，我也漸漸體會到文學的趣味，無法和老師見面時，就看一些老師喜歡的書籍，接觸文學的世界；想著老師，寫一些詩和小說。然後請小百合和志夜朗讀我創作的小說，聽取她們的感想，的確很有意思，也很開心。'
  - '[PAGE 233]


    但是，受到世人矚目的志夜隨時對我察言觀色，戰戰兢兢地取悅我，拒絕上電視和雜誌的採訪，整天在沙龍圍著我打轉，唯命是從地服侍我，才是真正我發自內心感到高興的事。


    這和在家裡被爸爸花錢僱用的傭人照顧的感覺完全不同，在這所女子學校的特殊環境中，在自己親手打造的城堡中，只為我存在的僕人。


    配角豐富了我的故事，所以，我很自然地想要得到第二個配角。


    # 小南茜。


    像古董洋娃娃般可愛的她，在中學部時就十分引人注目。她的一雙清澈透明的大眼睛宛如玻璃珠子，一頭蓬鬆可愛的鬈髮，臉頰總是泛著紅暈。她的興趣是製作甜點，情人節前夕，有許多女生都希望收到她的友情巧克力。雖然她的外表看起來像是童話世界中的人物，但我喜歡她的眼睛炯炯有神，透露出內心的野心勃勃。


    小茜是爸爸招待客人和家庭聚餐時常去的老舗料亭「小南」家的長女，她看起來宛如從西洋童話中走出來的人物，很難想像她在充滿高湯和醬油的環境下長大，'
