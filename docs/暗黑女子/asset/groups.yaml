    「之前的家教也是每次都付一萬圓。「我不是職業家教，也不是知名大學的學生，只是普通的高中生，而且是妳的學妹，如果有時薪一千圓，我就很高興了。」我們爭執了半天後，逸美終於答應了。「於是，我經常以家教的身份出入白石家。逸美的母親很親切，經常送我很多東西。有時候送我漂亮的利摩日瓷鐘說：「妳可以放在房間裡」；有時候送我蕾絲的杯墊說：「帶回去給妳媽媽用」；有時候又會送我雕花玻璃的杯子說：「不小心買了一樣的。」這些東西和我家格格不入，她的好意反而讓我有點傷腦筋，但當我帶著她送我的GODIVA巧克力回家時，弟妹們都樂得手舞足蹈。「這種東西就讓妳這麼高興，妳變得真快啊。」媽媽和大家一起吃巧克力時挖苦我，她對我辭去超市收銀工作很不高興。「唉，如果妳不去家教的日子可以排班，就可以賺更多錢。」


