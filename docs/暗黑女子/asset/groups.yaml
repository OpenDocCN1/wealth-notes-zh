    早知道逸美會被人用這種方式奪走生命，不如我牽著逸美，一起從露台跳下。只要我們把頭髮綁在一起，手牽著手，把自己的身體交給上帝，上帝一定會把我們變成岩石，我們就可以像要塞的那對少女一樣，永遠在一起了。啊啊，心愛的、心愛的逸美．．．．


    我無法原諒高岡志夜。我也無法原諒自己，無法原諒沒能保護逸美的愚蠢自己。我這輩子將永遠活在悔恨中，為自己無法保護有生以來第一次愛上的人而悔恨。雖然我就在她身邊，卻只能矇矇矓矓地看著她的生命隕落。


