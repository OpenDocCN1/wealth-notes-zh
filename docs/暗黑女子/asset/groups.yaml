    也讓我產生了好奇。


    如果可以讓像她那樣楚楚可憐的美少女聽我的使喚，心情一定會暢快。而且，以女生為主角的故事中，當然少不了美味的甜點。我想知道小南茜的秘密。她的外貌越可愛，我希望她的秘密越醜惡。


    我開始調查她的情況，也曾經在她放學回家時一路跟蹤。


    她家位在料亭後方，散發出靜謐的感覺，但她總是用忿恨的眼神看向料亭，嘆氣之後，才走進家門。


    那天晚上。


    放學後，向來直接回家的小茜難得去雜貨店和咖啡店消磨時間，最後在公園的長椅上坐到深夜。我很納悶，所以一直在不遠處看著她。


    坐在長椅上的她手中突然亮了起來。


    是打火機。打火機在她手上一亮一滅，她用認真眼神看著自己的手。


    不知道把玩了多少次後，她猛然站了起來，好像下定了決心，腳步十分堅定。


    她沒有走回家中，而是走向早就已經打烊的料亭。不一會兒，漆黑的料亭窗戶微微亮了起來。亮光越來越大，扭動著擴散到整家店。火越燒越旺，小茜衝出店外，火燒到了她穿著制服上衣的左手臂上。她慌忙拍熄了火，跑進了黑暗中。建於大正元年的木造建築被熊熊大火包圍，在天亮之前，染紅了天空。


    隔天的早報報導了這起火災。


    ## 老鋪料亭燒毀 人為縱火？ 創業百年的料亭「小南」失火


    X日深夜十一點左右，位在XX市XX町的料亭「小南」發生火災，約三百平方公尺的木造兩層樓店鋪付之一炬。當時店內無人，並沒有用火，起火點也並非來自廚房，XX分局懷疑有人為縱火的可能，正進一步展開調查。


    所幸這場火災並無造成任何人員受傷，也未延燒至鄰居家，位在店鋪北側的店主住家也平安無事。經營者小南辰夫（五十五歲）、妻（五十三歲）和長子（二十一歲）在家中，順利逃了出來，長女（十六歲）尚未回家，所以全家人都平安無事。


    小南辰夫先生表示：「很抱歉給大家添了麻煩，讓大家擔心了，本店暫時休業整理。」


    附近居民為失去喜愛多年的寶貴建築物，和在店鋪重新開張之前，都無法嚐到「小南」的料理深感惋惜。


    學校的同學也都紛紛討論火災的事，大家都很同情小茜。


    「謝謝大家的關心。」


    小茜臉色蒼白而憔悴，讓人看了於心不忍的被害人，但是，我——只有我知道那起火災的真相。


    午餐時間，我叫住了走出教室的小茜。


    「真可憐。」


    「是，啊，但幸好我不在家。我完全不知道發生了什麼事，一回到家，發現店舖燒了起來，不知道有多驚訝和難過……」


    「是，啊，報紙上也說妳剛好外出，妳平安無事，真是太好了。」


    「是，啊……」小茜難過地垂下睫毛。


    「但是，我對一件事感到不解。」


    我拉起小茜的左手臂，挽起她的制服袖子。她怕痛地扭著身體，但她的手臂上包著白色繃帶。


    「真可憐，燒傷會留下痕跡。」


    小茜驚訝地甩開了我的手，把袖口拉下來。


    「為什麼……」


    「我昨天晚上看到了，從妳在公園的時候開始，統統都看到了。」


    小茜的雙眼越張越大。


    「——妳看到了嗎？」


    「對，從頭到尾。」


    「這……」小茜苗條的身體顫抖起來，「怎麼會？」


    「到底發生了什麼事？」


    「……我已經忍無可忍了。」


    小茜流著淚告訴我，她的父親終止了原本打算讓她參與經營的西餐廳計畫，決定變成「小南」的分店，而且要交由她哥哥負責。


    「我爸爸每次只想到哥哥，他從來不救我料理，也不讓我踏進店裡的廚房一步，所以，我一直用西餐和他們對抗，以為終於得到了認同，沒想到，最後還是被哥哥搶走了。我太不甘心，對我來說，那家西餐廳就是我的人生，所以，我也要奪走爸爸、媽媽和我哥哥的人生。」


    她流著無助的淚水，情緒激動地訴說著。她覺得自己所做的事是對的，也沒有任何後悔。我更加欣賞她了。


    「是嗎？原來曾經發生過這種事。」


    「我做了傻事，我知道早晚會被逮到。爸爸向來不把鑰匙交給廚師，所以，只有家人可以自由出入料亭，全家人中，只有我不在家裡，而且我手上又有燒傷的痕跡……」


    「小南，妳不要哭。」


    我溫柔地對她說。


    「我非常瞭解妳的心情。」


    「……啊？」


    「我非常瞭解妳想要實現夢想的心情，也瞭解妳為了達到目的不擇手段的野心——小南，我可以為你提供不在場證明。」


    小茜驚訝地抬頭看著我。


    「妳和我在文學沙龍討論到深夜，因為太晚了很危險，所以請室生……喔，他是我家的司機……請室生開車送妳回家。」


    「白石學姊……」


    「妳有沒有喜歡的作家？」


    「我很少看書。」


    「但多少有看過吧？」


    「……太宰治的話，曾經在教科書上看過。」


    「那就太宰治吧。那天晚上，我和妳在沙龍聊太宰治到晚上十點左右。」


    之後，我們討論了詳細的內容，最後根據小茜以前寫的閱讀感想為基礎，決定說我們當時討論了《斜陽》的主人翁和子的事。雖然警方以重要證人的身分請小茜去警局瞭解了情況，但因為我和室生提供了她的不在場證明，所以排除了她的嫌疑。


    小南茜就這樣落入了我的手心。


    我沒有看錯人，小茜做的每一樣甜點都堪稱絕品，漂亮的盤飾也摻撥著少女的心。而且，嬌小的小茜站在廚房內為鮮奶油發泡，或是用模型壓出星形或心形的餅乾時，好像在玩洋娃娃。雖然小茜對這個閃著銀光的最新型廚房讚不絕口，但我忍不住後悔，早知道應該打造一個更適合小茜感覺的鄉村風格廚房。


    我順利地、嚴謹地建立自己的世界，之後，又順利招募了三名女學生進入文學沙龍。


    - 古賀園子。園子精明能幹，如果沒有特別的目的，不可能自告奮勇地擔任復活節園遊會的執行委員長。調查之後果然發現她為了得到校方推薦，進入一流私立大學的醫學院，偷偷使用爸爸書房內的電腦，潛入學校的電腦主機，篡改自己的成績和評定值。

    - 二谷美禮。聽說她利用網路做陪人聊天的義工時我太驚訝了，她根本是在和不特定多數的男人從事援交。

    - 蒂安娜·德秋貝。在她辦理入學手續時，我發現她申請護照的日期剛好在艾瑪發生意外的前夕，讓我嗅到了計畫犯罪的味道。在質問之下，她哭著坦承自己想要來日本留學，所以在要塞遺跡把姊姊推了下來。


    這些年輕而美麗的罪人。


    邀她們加入文學社後，我的世界終於完美。


    這些配角按照我的意願行動、說話，建立世界觀。這些罪人尊敬我，對我心生畏懼，屏氣斂息地注意我的一舉一動，在絕妙的時機上場、退場。


    有了這些出色的配角，我這個主角更加充滿自信，綻放出更燦爛的光芒。


    除了沙龍以外，我和老師還有另一個秘密基地，但必須經過地下停車場才能去那裡。


    沒有駕照的女高中生不會去停車場，而且，為了預防意外發生，校方禁止學生進入停車場，我無法光明正大地去那裡，所以每次總是先走去第二校舍，經過理科實驗室和家庭科室前，在走廊上轉彎。走廊盡頭有一面佔據了整面牆的大鏡子，映照着漸漸走近的我。這不是一面普通的鏡子，當這所學院在戰後剛創立時，英國的姊妹修道院贈送了這面鏡子，上面用蝕刻的方式刻了新約哥林多前書的十三章十二節的內容。


    因為巨大的鏡子古色古香的設計，和上面蝕刻的神秘聖句，很多學生都很害怕這面鏡子，但對我來說，這面鏡子很特別的原因和别人不一樣。


    我打開牆上的排煙啟動裝置的盒子，把排煙開關用力向下壓，然後推動鏡子，牆壁和鏡子之間就出現了可以讓一個人通過的縫隙。


    鑽過縫隙，從另一側推動鏡子，就可以把鏡子推回原位。全校只有我一個人才知道這個機關。


    走進去後，立刻看到一個通往地下室的木樓梯。以前校舍是修道院時，這裡是從地下倉庫通往三樓的樓梯，但在改建時打掉了地上的樓梯，變成了理科實驗室，只剩通往地下的樓梯。由於木頭老化腐朽的情況很嚴重，為了防止發生意外，所以將樓梯封鎖了，這面大鏡子就代替了牆壁的功能。之所以會採用這種設計，是考慮到將來有可能會拆除鏡子，而且只有工程相關人員知道。當初爸爸經營的公司承包了學校的改建工程，我很自然地知道了這個秘密。


    我小心翼翼地在大鏡子移回原位，踩著吱吱作響的樓梯走去地下室。來到地下室時，旁邊有一扇小門，小門外就是停車場。老師總是把車子停在門旁，當我溜進老師的愛車時，不會被任何人看到。


    老師總是坐在駕駛座上等我，然後謎眼看著我，親吻我之後，才發動車子。這是我們的另一個秘密基地。我們開車去兜風，欣賞夜景，因為擔心被別人看到，所以絕對不會走出車外。如果說，沙龍是我打造的秘密基地，車子就是老師掌握主權的秘密空間，對我來說，是充滿野性、刺激的空間。


    在沙龍、在車上孕育的秘密戀情。


    和老師在一起的時候，我經常想，希望我們的關係可以永遠持續下去。我希望我們可以相愛到未來。


    不知道是不是因為我一直這麼祈願，所以，我的體內孕育了一個新生命。


    「真的嗎？」


    當我告訴老師懷孕時，他滿臉驚訝。


    「對啊，該怎麼辦？」


    「沒沒辦法啊，」老師深呼吸後，對我露出笑容，「那还用問嗎？我們結婚吧。」


    「啊？」


    「我會去和你父親談。妳還有一年就畢業了，他一定會同意的。」


    「真的嗎？」


    「為什麼？妳不想和我在一起嗎？」


    「不是，因為太幸福了。」


    「妳真是個小傻瓜。」老師緊緊抱著我，親吻了我。


    「啊，我等不及了，我沒想到我們可以建立家庭。」


    「我爸爸是死腦筋，他不會同意我們結婚的。」


    「不同意妳嫁給我這種老師嗎？」


    「對。」


    我明確地回答，老師笑著撥了撥頭髮。


    「只要你還愛我，我會持續展現誠意，直到他同意為止。」


    「啊呦，我這輩子永遠都會愛你。」


    「哈哈，妳真年輕，但是這樣很好，年輕才會有這麼專一的美麗，這也是我最喜歡妳的地方。」


    老師說完，開心地笑了起來。他這種愛挖苦人的地方，正是我被他深深吸引的重要原因。


    「什麼時候去拜訪妳父親，我覺得越快越好。」


    老師伸手準備去拿記事本，我吻著他，制止了他。


    「等一下，最好不要現在去。」


    「啊？」


    「再等三個月……等到八月再說。那時候已經錯過了人工流產的時期，我爸爸就沒辦法反對了。」


    只要熬到八月就好。我們一心想著這個目標，行事越來越低調。不再偷偷在沙龍見面，也不再開車出去兜風，甚至不再打電話，只通電子郵件。


    「是兒子還是女兒？」


    「我覺得可能是女兒。」


    「如果是女兒，希望像妳。」


    「要取什麼名字？」


    「妳覺得鈴蘭怎麼樣？我希望她就像花語說的那樣，單純而幸福。」


    「太棒了，好可愛的名字。」


    我的身體不斷變化，時常想要嘔吐，整天懶洋洋，頭痛不已。我整天無力地躺在沙龍的沙發上，以前那麼喜歡吃小茜的甜點，如今只要一聞到味道就想吐，吐得整個胃都空了。


    雖然身體越來越不舒服，代謝卻很旺盛，指甲和頭髮長得特別快，皮膚變得很光滑。因為吃不下，又整天嘔吐，臉色變得憔悴蒼白，雙眼卻因為荷爾蒙分泌的關係，比以前更加明亮。


    如今，我是鈴蘭的母親。人生在世，還有比這個更幸福的時刻嗎？


    我的故事完美無缺了。


    沒想到配角竟然開始失控。


    「逸美。」


    那天是學力測驗的最後一天，我和小白合一起走出校門時被叫住了。是爸爸。


    爸爸坐在室生駕駛的車上。


    「爸爸，你今天來學校嗎？」


    「上車，現在馬上回家。」


    「今天剛考完學力測驗，我想和小白合一起——」


    「上車。」


    爸爸嚴厲的聲音讓我有一種不祥的預感，我和小百合互看了一眼。不知道是否察覺了我的不安，小百合試探地問爸爸：


    「伯父，好久不見，我可以一起去嗎？」


    「不，今天不太方便。」


    這句話讓我的不祥預感更強烈了。


    「知道了，爸爸。小百合，我們再聯絡。」


    一回到家，爸爸立刻帶我去了書房。二谷的鞋子脫在玄關，我太慌張了，不小心踩到了她的鞋子。


    「妳和那個叫北條的老師是什麼關係？」


    爸爸劈頭質問我時，我驚訝得好像心臟被揪緊了。


    「爸爸，你在說什麼啊。」


    我故作冷靜地回答，但聲音微微發抖。為什麼爸爸會問我老師的事？


    「你們真的在交往嗎？」


    爸爸一臉可怕的表情逼近我，他的眼中佈滿血絲。「怎麼可能？」即使我否認，爸爸也沒有放鬆臉上的凝重表情。有人把我和老師的事向爸爸告了密。該不會——該不會是小百合？但下一剎那，我立刻知道懷疑小百合完全搞錯了方向。


    爸爸把放在書桌上的一疊照片丟了過來。我和老師在巴爾幹山脈前相互凝視。


    「妳還想抵賴嗎？」


    我和老師在里拉修道院滿臉笑容。我和老師在蔷薇谷卡贊勒克接吻。


    為什麼？什麼時候拍了這些照片？


    我用顫抖的手，撿起地上的一張張照片。


    「不要臉的東西，我沒想到妳這麼愚蠢。」


    爸爸用冰冷的聲音說道。


    「但是……但是我愛老師。」


    我抬起頭，正視著爸爸。


    「荒唐。總之，我絕對不允許妳把孩子生下來。」


    我嚇了一跳。我聽錯了嗎？


    「你剛才說什麼？」


    爸爸不發一語地從書桌的抽屜中拿出一張紙遞到我面前，當我看清楚紙上印的東西時，立刻全身發冷。


    那是超音波照片的影本，上面清楚寫著產檢日期和我名字的羅馬拼音。為了避免被人發現，我沒有用健保卡，還特地去了郊區的醫院。


    「我絕對不會允許妳生下來，知道了嗎？」


    爸爸生氣地把紙撕碎，黑色的紙片在我面前飄落。我肚子裡的可愛孩子宛如天使，有朝一日，將會長大成名叫鈴蘭的孩子。


    我覺得自己的腳下的地面好像應聲崩潰了。這是任何人都不知道祕密，我絕對想要守到最後的祕密。


    「那個王八蛋老師，還說什麼真心相愛。」


    「你已經見過他了嗎？」


    「剛才去把他開除了，也把他趕出這個城市，不許他再度出現在妳面前。」


    「爸爸，你太殘忍了！」


    「殘忍？留給他一條活路，他就應該對我感激不盡了。」


    「沒錯，爸爸回來不給別人留活路，他用這種方式建立了目前的地位，如果我繼續懲罰爸爸，老師搞不好真的性命不保。」


    我大哭大叫，爸爸甩我巴掌。之後的事我記不太清楚了。只知道立刻被帶去爸爸經營的醫院，在床上躺了一個星期，摸著扁扁的肚子哭泣不已。


    我不想做任何事，一切都變得空虛而空洞。


    出院之後，我才終於能夠冷靜下來思考。這一連串發生的事到底是怎麼回事？只有高岡或蒂安娜能夠在保加利亞拍下北條老師和我的照片，或是這兩個人聯手。只有出入我家二哥或古賀有機會向爸爸告密，但也可能是這兩個人聯手。察覺我胃口變化的小南，或是發現我身體變化的蒂安娜有可能知道懷孕的事，也可能這兩個人都有參與。能夠拿到超音波照片的只有和醫院很熟的古賀，或是撿到記事本的小南，也可能這兩個人都有份。


    也就是說……這是文學社所有成員對我的背叛？


    向來順從的配角突然亮出了最後通牒，告訴我她們不甘於被我單方面掌握秘密，如今，她們也掌握了我的靈魂。


    沒錯──這是她們的宣戰佈告。


    出院後回到學校後，我聲稱是因為肺炎長期住院，老師則說因為母親重病，不得不緊急離職，所以沒有人瞭解真相──除了我和社團的成員以外。


    老師的手機和電子郵件信箱都不通，寄去的信也被蓋上「搬遷地址不詳」後退了回來。我再也見不到老師了。我帶著絕望的心情去學校，只有小百合溫暖地迎接我。


    「恭喜妳出院了。」小百合輕輕抱著我。


    「小百合，我好想妳，但妳一次也沒來醫院看我。」


    「我去了好幾次，但每次都被妳爸爸趕出來。」


    「啊？」


    「因為這次的事，我以前掩護你們的事也全都曝光，所以妳爸爸很生氣。」


    「原來是這樣，給妳添麻煩了。」


    「妳不必放在心上。」


    「我很想一死了之。」


    「不可以說這種話，聖經上不是說『不可殺生』嗎？其中也包括自己。」


    「聖經！」我氣鼓鼓地說，「我再也來看聖經了，也不想再靠近教堂和十字架，因為我已經殺了我的孩子。」


    「妳不要自暴自棄，要向前看。」


    「不要，活著根本沒意思。」


    「當然有意思，一切都可以重來，這是我慶祝妳出院的禮物。」


    小百合說完，把一張畫著可愛小貓圖案的紙片塞進我手裡。


    「啊……」看到那張紙，我忍不住叫了起來。


    「怎麼樣？」小百合自信滿滿地點了點頭。


    紙上寫著老師的新手機號碼和電子郵件信箱，和外縣市的地址。


    「我幫妳向老師打聽到了，他在等妳的聯絡。」


    「小百合⋯⋯」


    「小寶寶的事真的很遺憾，但妳可以和老师重新开始，所以拜託妳，一定要振作，以後我也會盡力協助妳。」


    如果當時沒有小百合，我絕對不可能重新站起來。


    老師是我生命的意義，我找回了活力，再度感受到生命的喜悅。


    但是，還有一件事為我帶來活下去的喜悅。


    那就是復仇。


    我要向背叛我，殺了鈴蘭的妳們五個人復仇。


    ### 3


    我的復仇計畫就是把妳們五個人叫到露台上，在妳們面前跳下露台，手上拿著鈴蘭花，代替我的遺書。


    ### 暗黑女子


    妳們一定會手忙腳亂，絕對不會想到白石逸美竟然會選擇走上絕路。一旦不瞭解自殺的原因，就會徹底猜測鈴蘭花所代表的意義。一旦知道代表了我失去的孩子，就會知道妳們陷害了我，也造成了我自殺的原因──也就是妳們犯下的罪。


    沒錯，鈴蘭花是我給妳們的恐嚇信。


    在我死後，妳們一定會被追究，於是就會絞盡腦汁，想出一個計謀。


    如果不是自殺，而是他殺就解決問題了。只要讓有某個人帶著明顯的殺意殺了我，然後賦予鈴蘭花完全不同的意義，就可以解決問題。於是，妳們開始散播「文學社的成員之一殺了白石逸美」的流言，讓每個成員都承受懷疑的眼光──因為所有成員都遭到懷疑，就代表無法特定是某一個人。


    預測了這些情況後，一個星期前，我當著妳們五個人的面，從露臺跳了下去，渾身是血地被救護車抬走。


    但是，我並沒有死。我從露臺跳到一樓和二樓之間的石頭拱頂上，然後再跳到花圃──小百合事先在花圃內的花草之間鋪了大量鬆軟的腐葉土做為緩衝，再把事先準備的血倒在身上。


    我被送去爸爸的醫院。我無法毫髮無傷地躲過這一劫，一隻手扭到了，渾身都是挫傷，接受治療後，我留下一張紙條，說要去找北條老師，就從醫院逃走了。爸爸不願將女兒和人私奔的醜聞公開，這是一個星期以來，都暗中尋找我的下落。校長也向全校學生隱瞞了董事長白石家的醜聞，所以沒有人更正我已經死了的傳聞，而且這個傳聞不斷擴散。


    之後，小百合帶著一束白花來到學校，流著眼淚，放在我的課桌上——這麼一來，等於證實了「白石逸美已經死了」的傳聞。在女校裡，富戲劇性的妄想往往更勝於真相。我以此把妳們逼到今天的地步，妳們一定整天惶恐、痛苦，擔心鈴蘭的秘密被人發現吧？


    我完成了讓妳們陷入恐懼的復仇，同時能夠和北條老師過著幸福快樂的生活。


    沒有澄川小百合的大力協助，我無法獨自策劃、執行這個完美計畫。小百合預料到所有的事——爸爸和校方都不會公佈我私奔的事，妳們誤以為我已經死了，就會相互指責，努力保守秘密——想出了這個方案。


    啊，我美麗的參謀，我由衷地佩服她細膩的洞察力，因為她竟然如此徹底地完成了我原本只有模糊概念的復仇計畫。


    我在和北條老師的新家寫這篇小說，我們的生活恬淡而平靜，雖然不富有，卻擁有一份溫暖的幸福。從某種意義上來說，因為妳們的計謀，我才能擁有這份幸福。如果妳們沒有告密，我也許至今仍然必須偷偷摸摸地和老師約會。


    寫完這篇小說，我會偷偷回去沙龍，然後趁著黑暗參加例會，在妳們不知情的情況下，笑著聆聽妳們的閱讀。


    然後——我當然不可以忘記寫最後的結局。


    為了今晚的例會，我也提供了一項火鍋料，藉此表達我小小的心意。


    今晚的開鍋是花鍋。妳們有沒有聞到鈴蘭強烈的芳香？


    鈴蘭的花朵和花根都有劇毒，含有強心苷的鈴蘭毒苷、鈴蘭苦苷和鈴蘭糖苷……立志當醫生的園子應該知道得很清楚。


    想要欺騙主角的膚淺配角必須退場，妳們今天自願聚集在這裡集體自殺。

