    直到我遇見了白石逸美。


    我至今仍然清楚地記得第一次遇見白石逸美時的情況。


    我越來越懂得假裝自己適應了學校生活，但並沒有真心樂在其中。所以，每次休息時間，我都會去校舍三樓的屋頂露台，隔著柵欄眺望校園。'
