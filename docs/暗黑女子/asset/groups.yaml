    我比逸美高十公分，而且骨骼粗大，身材也很結實，體型和苗條的逸美相差太大了，根本不可能穿得下。


    「妳穿一定很好看，先要穿這個。」


    逸美要求我脫下洋裝，然後把自己身上的長襦袴[1]脫了下來，披在我的肩上，俐落地為我穿上，在胸前拉好衣襟。長襦袴上還殘留著逸美些許的體溫和香氣，逸美為我穿上和服時，自己只穿了一件簡單的白色棉布內衣。我再度驚訝地發現，和服的長度和寬度都可以自由調節，即使是和逸美體型完全不同的我，穿同一件和服也很合身。逸美把腰帶在我腰間繞來繞去，綁了一個複雜的結，看起來就像是一隻隨時準備起飛的鳥。


    > 「很好看，妳照一下鏡子。」


    老舊的鏡子映照著我穿和服的身影，沒想到我穿和服竟然一點都不奇怪，甚至覺得穿起來很好看。和服不僅賞心悅目，自己穿在身上時，更有不同的樂趣，彷彿全身綻放了花朵，鳥兒在歇息，河水靜靜地流。


    > 「妳和我的身材完全不一樣，竟然不用修改，就可以直接穿。」


    > 「不瞞妳說，這件和服是我曾外祖母的。」


    > 「天啊！」


    「我的曾外祖母傳給我的外祖母，外祖母又傳給我媽媽，現在交到了我的手上，而且從頭到尾都沒有修改過，因為即使身高和體型稍有不同，和服也可以在某種程度上加以修飾，我打算以後再傳給我女兒。」


    太妙了。禮服根本不可能做到這一點，西方也有像和服那樣凝聚了智慧文化的服裝嗎？原來在高樓大廈的最新科技的背後，日本這個國家還蘊藏了如此崇高的文化，這正是這個小國家內在的強大力量吧？


    我對和服的智慧驚訝不已，感動不已，雖然我對日本很不瞭解，但我直覺地認為，這是日本文化的最佳代表。


    實際來日本留學幾個月後的今天，這種印象仍然沒有改變。來到日本後，我有機會瞭解茶道、花道和歌舞伎等各種具代表性的日本文化，但我認識所有的日本文化後，仍然認為摺成扁長方形形的和服是登峰造極的傑作。


    「快脫下來，萬一弄髒了就慘了。」


    聽我這麼說，逸美溫柔地點點頭，開始為我解開腰帶。


    1. 譯註：長襦袢是穿和服時，襯在裡面的那件白色長衣。


    我發現穿脫和服時，彼此貼得很近。我和逸美好幾次手臂交錯時，幾乎抱在了一起，臉和臉之間的距離近得好像在接吻。我感到有點窒息。原本以為是因為腰帶勒得太緊的關係，後來才發現是因為近距離看著逸美的長睫毛、臉頰上柔軟的寒毛，和白皙脖頸的關係。


    逸美為我脫下和服時，我突然爲自己只穿了內衣和內褲感到不好意思，慌忙穿上了洋裝。逸美再度把長襦袴、和服摺好，用疊紙包起後，收進了行李箱。


    「逸美，妳要回去了，我很難過。」


    我忍不住嘆著氣說，逸美也露出難過的眼神看著我。


    「我也一樣，但是，我還會再來，我向妳保證。」


    逸美說完，輕輕抱緊了我。我們的臉頰貼在一起，我的體溫突然上升。逸美的身體很柔軟，從緊貼著的胸部，可以感受到宛如蝴蝶拍翅般的顫動。


    啊，我不知道後悔了多少次，為什麼當時沒有親吻逸美。只要頭稍微一偏，只要稍微鼓起勇氣……就可以觸碰到她甜美的雙脣，但是，那時候我只能在逸美的臂腕中屏住呼吸，因爲只要稍微動一下，內心的情感就會滿溢出來。


    隔天早晨，我和艾瑪一起去索菲亞機場為她送行時，我已經哭成了淚人兒。北條老師等在機場，我難過地看著他們在櫃檯辦理登機手續。


    「多比吉達內。」


    逸美用保加利亞文向我說「再見」，緊緊擁抱我和艾瑪。也許是因為我哭得太傷心了，逸美撫摸著我的後背很久。我捨不得她離開。我不想放開她。即使我內心這麼希望，時間仍然無情地流逝，離別的時間終於到了。


    「我們一定會再見面，好不好？」


    逸美的雙眼也泛著淚光。


    「什麼時候？」我立刻追問，逸美想了想，回答說：「明年。」


    「真的嗎？」


    「對。」逸美對我露出微笑，似乎在鼓勵我，然後對北條老師說：「老師，我明年也要來保加利亞寄宿留學。」她一定是看到我這麼難過，想要向我證明，她並不是說說而已。老師似乎察覺了她的想法，對我露出安慰的笑容說：「好，回國之後立刻開始交涉明年的事。」


    這段期間，我和北條老師之間並沒有什麼交流，即使偶爾一起出門，只要一有時間，他就會看書。雖然他很年輕，但有一種厭世的、嚴肅的感覺，好像隨時都在沉思，讓人不敢輕易和他說話，我一直以為他是一個嚴格的老師，但經過這番對話，我知道他內心很溫暖。


    他們消失在登機門外。逸美的背影越來越小，直到她的身影完全消失，愚蠢的我才發現自己愛上了逸美。


    明年。那是讓人等不及的未來。


    我幾乎每天都傳電子郵件給她，逸美也盡可能及時回信給我。為了填補見不到她這段日子的空白，我開始學日語。我請艾瑪去索菲亞市區時，幫我買了附有CD的日語參考書，每天聽著CD學日語。艾瑪每次帶日本遊客觀光時，我就要求同行，用剛學會的日語和他們練習會話。雖然漢字很難，但我每天練習兩個小時的聽寫，抄寫芥川龍之介和三島由紀夫等作家的作品，增加自己的語彙。和見不到逸美的痛苦相比，這些努力根本算不了什麼。


    我在月曆上做記號，一天一天熬日子。重逢的日子終於到了。我和艾瑪一起去索菲亞機場迎接，當逸美熟悉的身影出現在大廳時，我頓時激動不已。


    「妳又來了，太高興了。這一年來，我一直期待和妳見面。」


    當我用日語說這些話時，逸美滿臉驚訝。


    「蒂安娜，妳剛才是用日語說話？」


    「對啊，因爲我希望更拉近和妳之間的距離。」


    「啊，太高興了！」


    逸美和前一年一樣，用柔軟的雙臂抱住了我。我看到北條老師面帶微笑，站在她的身後。


    「北條老師，好久不見。」


    「太驚訝了，妳的發音也很棒。」


    「老師，你在教國語嗎？你在這裡的這段時間，可不可以教我敬語？」


    「小事一樁。」


    「啊？」


    「喔，就是OK的意思。」


    我們聊了幾句之後，我才發現還有另一名少女站在北條老師的身後。她沒有自我介紹，也沒有加入我們的談話，一臉無趣地站在那裡。


    「高岡，這是從去年開始負責短期留學的艾瑪和她的妹妹蒂安娜。」


    北條老師向少女介紹，她瞥了我和艾瑪一眼，微微挪了挪下巴，似乎在向我們打招呼。


    「這位是高岡志夜，今年春天升上高中部二年級。」


    北條老師代替一臉冷漠的少女介紹道。


    「高岡是目前很受歡迎的作家，也是文學社的頭號成員。」


    逸美興奮地告訴我們，高岡的《君影草》在以青少年為對象的文學獎中得獎，似乎也覺得與有榮焉。


    我很失望。既然還有其他學生一起來，就代表她整天會跟進跟出，我無法只和逸美一個人說話，還要花心思招呼這個新學生，而且，我對她的印象並不好。


    「歡迎來到保加利亞。」


    艾瑪親切地伸出右手。對艾瑪來說，這個冷漠的學生也是她的客人。


    「哈囉。」


    高岡握著艾瑪的右手時，臉上完全沒有笑容，但她的視線越過我和艾瑪，直視著逸美。


    冰冷的銳利視線——現在回想起來，高岡也許在那個時候就想殺了逸美。


    果然不出所料，我們無論去哪裡，高岡都和我们形影不離。


    我原本想把高岡塞給北條老師，但北條老師和前一年一樣，整天忙著參觀教育設施和進修，不和我們一起行動，所以，由艾瑪負責安排所有的觀光行程。艾瑪熬夜規劃了可以高效率參觀更多名勝的行程。


    里拉修道院。薔薇谷。歷史博物館——雖然參觀行程難免和去年雷同，但今年又新增加了一亞德米爾要塞—。那是十四世紀的統治者亞德米爾為了防止土耳其人的攻擊而建造的要塞，去年因為行程無法調整，所以來不及參觀。


    亞德米爾要塞有一個悲傷的傳說。當土耳其軍隊進攻時，兩個美麗的女孩不願落入敵人的手中，就決定跳河自盡。為了避免有人臨陣脫逃，她們把頭髮緊緊綁在一起，就在她們準備從要塞上跳下去時，兩個人變成了岩石。兩名年輕少女化身的兩塊岩石至今仍然佇立在要塞遺址，為流的血，失去的靈魂嘆息。聽說兩名少女的亡靈會不時出現，所以是很受觀光客喜愛的地點。


    逸美很喜歡這個傳說，看到兩塊依偎在一起的岩石時，眼中泛著淚光，專心聽著艾瑪介紹鄂圖曼侵略的歷史。逸美無論去哪裡，眼中都閃著好奇的光芒，經常提出許多疑問，就連已經算是職業導遊艾瑪也常常被她問倒。


    但高岡無論去哪裡都興趣缺缺，就連前往規模足以容納五千人觀光客，美輪美奐的亞歷山大·涅夫斯基基大教堂時，她也只是瞥了一眼，就開始玩手機和照相機。她帶了一個很棒的單眼相機，卻很少主動拍照，每次都是在逸美的催促下，才勉強拍幾張而已。她顯然對保加利亞這個國家的歷史、文化和語言沒有興趣。既然這樣，為什麼要來這裡短期留學？我忍不住有點生氣。我好幾次都想捉弄她，把她的相機藏起來，只是她雖然很少使用，卻把相機背帶纏在手上，整天都不離手。如果對如此美麗的大自然和歷史悠久的建築物都沒有興趣，高岡到底想拍什麼？


    高岡是個任性的人，艾瑪當初為她安排寄宿在鄰居貝西太太家，但她抱怨說貝西太太做的菜很難吃，硬是要換地方。換了地方後，又很生氣地說，那裡的房間很髒，結果堅持要艾瑪為她安排住在卡贊勒克的飯店。


    艾瑪的公司和聖母女子學院當初約定，短期留學必須寄宿在當地居民家中，這是首要條件。因為短期留學的目的是國際交流，所以理所當然會這麼安排。艾瑪向高岡說明了好幾次，她都不願接受，最後甚至威脅艾瑪，要向聖母女子學院告狀，說艾瑪的服務很差。一旦這麼做，艾瑪就會失去目前的工作。艾瑪在無可奈何之下，只好瞞著逸美和北條老師，為高岡安排去住飯店。我雖然不想和逸美分離，卻希望高岡早日回國，期待著短期留學最後一天的到來。


    高岡雖然對我和艾瑪態度很惡劣，但總是對逸美笑臉相迎，熱絡地和她聊天。只不過我發現了一件事，高岡在逸美面前露出的笑容很僵硬，總是皮笑肉不笑。起初一以為逸美是學姊，她會緊張的關係，但隨即發現高岡的態度中總是帶著冷漠。而且，高岡經常對逸美做一些很幼稚的惡作劇。逸美的耳環不小心掉在遊覽車上時，高岡立刻撿了起來，藏在自己的皮包裡，然後若無其事地和逸美一起找。


    另外，還曾經發生過這樣一件事。去里拉修道院時，逸美為大家買了相同的幸運手環做爲紀念。我和艾瑪都很高興，立刻戴在手腕上，但高岡面帶微笑地說：「逸美學姊，謝謝妳」之後，就把那條以粉紅色為基調的可愛幸運手環塞進了口袋。第二天，艾瑪像往常一樣去高岡的房間找她時，發現粉紅色的幸運手環被扯斷了，丟在垃圾桶裡。艾瑪和我都不感到驚訝，只覺得「不意外」。


    雖然旁人一眼就能看出高岡的心術不正，但逸美可能是當事人，所以沒有察覺，仍然經常買東西送給高岡，關心她的身體，像姊姊一樣照顧她。逸美太天真爛漫了。我心愛的逸美。逸美無論在任何時候都是完美的女人，我完全無法理解居然有人會像高岡那樣，會討厭這麼優秀的人。


    相處了幾天之後，我漸漸瞭解了其中的原因。逸美畢竟是文學社的社長，所以對文學有著獨特的審美觀。在去觀光的途中，她也經常談論對文學的見解，任何受歡迎的作品，她都會明確指出「我不喜歡這個部分」。雖然她平時溫文儒雅，但談到文學時，說話就很激動。她也曾經直言不諱地指出了高岡的出道作品《君影草》的缺點。


    「我覺得主人翁在那個場面發怒很不自然，日本人的話，遇到這種情況應該會哭。」


    「我覺得以親子的關係描寫得太膚淺了，外國的小孩早就獨立了，但在日本，兒童長大以後，仍然會相互依賴。我認為你在創作的時候，應該考慮到這個問題。」


    無論逸美說什麼，高岡都不反駁，只是委婉地擠出笑容。久而久之，逸美無論批評什麼，最後都用「高岡，妳是歸國子女，所以這也無可奈何」這句話做為總結。高岡小時候住在法國，她也知道只要點頭附和，逸美就不會再繼續批評，所以總是不發一語地露出笑容。只不過，雖然高岡表面似乎很平靜，但背地裡針對逸美的惡作劇，我覺得她很膚淺、陰險，所以越來越不喜歡她。


    最後一天要去美術館，但我和艾瑪學校都有事，無法帶她們去。逸美說：「不用擔心，我和高岡自己去就好。」我暗自覺得「絕對不可以這樣！」高岡即使在我和艾瑪面前，都會捉弄逸美，如果沒有第三者，一定會做出更惡劣的事。我拜託北條老師取消學會的行程，帶她們一起去美術館。


    當天，我和艾瑪一放學，立刻趕回家中，確認逸美已經平安到家，才終於鬆了一口氣。


    「美術館怎麼樣？一路上順利嗎？好玩嗎？高岡有沒有對妳做什麼？」


    我一打開門，立刻問道，逸美笑著說：


    「妳怎麼一下子問這麼多問題。嗯，我一個一個回答。首先，多虧妳告訴北條老師搭乘公車的方法，我們很順利地到了美術館。其次，美術館很棒，最後，高岡並沒有對我做什麼，應該說，她並沒有和我們一起去。」


    「她沒有去？」


    「對，她說身體不太舒服。」


    「是嗎？太好了。」


    「啊？」


    「不，沒事。總之，妳沒有遇到不開心的事，這樣就好了。」


    高岡沒有去美術館，我的心情也輕鬆了不少。她在最後一天身體不舒服，一定是惡有惡報。


    那天晚上，和去年一樣，在我家舉行了小規模的歡送派對。逸美再度穿上和服，讓我和其他保加利亞人大飽眼福。高岡因為身體不舒服，當然沒有來參加。


    派對上，我不由得難過起來。雖然逸美說，明年進大學前的春假還會再來，但有一年的時間都見不到她。為了不讓逸美擔心，我努力擠出笑容，但最終還是忍不住流了淚。


    > 「蒂安娜，妳不要哭，我準備了禮物送妳。」


    逸美讓我坐在沙發上。她總是很關心我，避免對我的腳造成負擔。


    > 「這個送你，希望妳會喜歡。」


    藍色的包裝紙內是一個盒子，打開一看，裡面端端正正地放了一個可愛的洋娃娃。


    > 「啊喲！」


    > 「這是我今天在市場看到的，妳不覺得很像我嗎？」


    > 「很像，簡直一模一樣。」


    「是不是？我也嚇了一跳。」


    「太開心了，我會好好珍惜。謝謝妳。」


