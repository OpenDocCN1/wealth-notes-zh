    ## 第二章 文學沙龍與歸宿


    露台上沒有人，總是靜悄悄的。以前曾經很熱鬧，但自從第一校舍建了日光室後，大家都聚在那裡。裝了防紫外線玻璃天花板的日光室不受天氣影響，也不怕被曬黑，當然更受女生的歡迎。


    我總是眺望校園旁的小教堂。那是一座老舊的木造教堂，三角形的屋頂上豎著十字架。可以容納全校學生的大教堂稱為新教堂，那裡稱為舊教堂。每天早上和放學前班會時，大家都在教室內唸〈主禱文〉，但上宗教課時，就會去舊教堂聽修女傳教，唱聖歌。舊教堂內只有粗糙的木頭長椅、走音的風琴，和掛在祭壇上，油漆已經剝落的耶穌基督受難像。


    每次走進舊教堂，就覺得心情格外平靜。當初是天主教的修女在戰後來到日本，希望在天主教精神的基礎上推廣女子教育，所以創立了這所學校。聖母女子學院實施從小學到短期大學的一貫教育，校舍和附設的修道院都已建造多年，但很難想像在日本可以看到這麼漂亮的建築。十年前新建的新教堂的入口有一座優美的聖母瑪利亞像，祭壇背後是著名的天主教徒藝術家設計的花窗玻璃，在校園內也呈現出傲視群倫的美麗，令人刮目相看。相較之下，舊教堂沒有任何華麗的裝飾，整體的樸素感宛如是我自身的寫照。


    我在露台上席地而坐看著埃茲拉·龐德（Ezra Weston Pound）的詩集，不時眺望著舊教堂。那是我度過休息時間最自在的方式。


    「妳常常來這裡。」


    突然聽到有人說話，猛一抬頭，發現白石逸美探頭看著我。


    「妳喜歡看書嗎？經常看到妳在看書。」


    「嗯，是啊……」


    白石逸美竟然會主動和我打招呼！


    我剛入學時就認識她了。這所學校每個學年只有三個班，是小班制的女子學校，而且，女子學校的特性，就是容貌出眾的學姊會成為學妹崇拜的對象，更何況她的父親是這所學校的董事長，在都是有錢人家女兒就讀的這所學校中，她家也特別有錢。我領取的「白石紀念獎學金」就是由她父親設立的，也就是說，我是沾她父親的光，才能就讀這所學校。


    我認識她並不是因為我是獎助生，這所學院的學生應該沒有人不認識白石逸美。小學部、中學部和高中部的所有學生都很崇拜這位聰明美麗的學姊，在學校時都會隨時注意、模仿她的一舉一動。


    我第一次近距離看到逸美，忍不住看著她出了神，逸美對我說：


    > 「我在高中部主持了文學社，妳這麼喜歡看書，要不要來參加？」


    我當然也知道文學社的事，而且全校所有的學生都希望成為文學社的一份子。校舍別館有特別為文學社設置的沙龍，之前聽說傳聞後，就知道那完全是女生嚮往的社團，所有的女生都夢想有機會在那裡喝杯紅茶，哪怕只有一次機會也好。


    雖然名為文學社，但並不是只要對文學有興趣的人都可以參加。如果沒有白石逸美的親自邀請，就無法加入文學社。反過來說，即使對文學毫無興趣，即使不會寫小說，即使無法評論小說，即使不喜歡閱讀，只要能夠讓白石逸美中意，就可以加入。所以，目前文學社的五名成員都是逸美親自挑選的特別學生，大家都對她們另眼相看。換句話說，文學社就像是社交俱樂部，只要能夠加入，就是一種身分的象徵。


    > 「像我這種人也可以參加嗎？」


    我戰戰兢兢地問。


    「當然啊，為什麼會這麼問？」


    「因為……」我遲疑了一下，但還是說了實話，「因為我聽說只有特別的人能參加。」


    逸美放聲大笑起來，完全顛覆了我以前對她的印象。我覺得她很爽朗，頓時產生了親切感。


    「才不是呢，我們很歡迎每一個人，只是傳聞滿天飛，沒有人主動上門而已。走吧，我們一起去。」


    「不，我……」


    「妳不必客氣——妳是不是叫二谷美禮？」


    我驚訝地看著逸美。我知道她的名字很正常，但作夢都沒有想到她竟然認識我這個剛入學不久，而且很不起眼的學妹。逸美似乎察覺了我的驚訝，爽朗地笑了起來。


    「因為妳是今年高中部的獎助生，當然很引人注目啊。」


    原來是這樣。


    我很怕其他同學知道我是獎助生，因為覺得很丟臉，等於在向別人宣告家庭的狀況，所以，我從來不會主動向班上的同學提起，也從來沒有聽到老師告訴其他學生，但畢竟這是一所不大的女子學校，消息很快就傳開了。我頓時為自己打腫臉充胖子，試圖假裝和其他同學一樣感到羞恥。


    「妳先來沙龍看看，之後再決定要不要加入，沙龍內還有我們引以為傲的藏書。」


    「有哪些書？」我不禁產生了興趣。


    「嗯……妳可能會喜歡的有 T．S．艾略特（Thomas Stearns Eliot）、葉慈，當然也有埃茲拉·龐德。」


    我好想看。這些精裝本的書都很昂貴，我根本買不起。


    於是，我就在她的邀請之下，造訪了文學沙龍。


    我該怎麼描述第一次踏進沙龍時的感動？挑高的天花板垂著發出黑色光芒的水晶燈，地毯柔軟蓬鬆，進口的大古董沙發，餐櫃裡放著理查·基諾里和薇薇安·馮特堡（Vivienne
    Fontaine）的高級餐具。紅磚暖爐，以及放滿一整面牆的藏書，裡面還有不少外文書籍，簡直就像是裝飾牆壁的藝術。


    我被眼前的景象震懾了，逸美從書架上抽出一本書。


    「這是埃茲拉·龐德的《休·塞爾溫·毛伯利（Hugh Selwyn Mauberley）》，是限量珍藏版，而且還有作者的親筆簽名，如果你喜歡，可以看。」


    我難掩驚訝地把那本褐色封面的書拿在手上。我之前曾經聽過這本書，是一九二〇年出版的奇書，目前拍賣價已經超過一百萬圓。這麼貴重的書竟然拿在我手上，我用顫抖的手指翻開封面，發現埃茲拉·龐德的親筆簽名出現在書名頁的左側。


    「好厲害！怎麼會有這本書？」


    「我爸爸託人買的。這個沙龍有很多珍藏本，妳可以隨便拿來看。」


    能夠來這裡真是太好了。我發自內心這麼想，仔細打量每一層書架。


    「先別參觀藏書了，要不要來喝茶？」


    另一個女生從裡面走了出來，手上端著托盤。


    「新來的吧？我是副社長澄川小百合，請多关照。小百合把茶杯和蛋糕盤從托盤上拿下來後放在桌上，對我微微點頭。我剛入學時就認識了小百合，她和白石逸美從小學時代就是好朋友，不同於明豔動人的逸美，具備了另一種美麗。她一頭烏溜溜的長髮，皮膚白皙柔嫩，連脣蜜都不擦，全身唯一的裝飾就是一條十字架的項鍊，整個人散發出宛如朝露般滋潤的美麗。當她們站在一起時，周圍的空氣立刻變得不一樣了，就像大銀幕世界中的超級明星。


    「逸美，這位是今年度的獎助生吧？」小百合問逸美。


    「對，我發現她很喜歡看書，所以邀請她來參加。」


    「獎助生的考試也有閱讀論文吧？妳一定具備了敏銳的觀點，真期待，請妳一定要加入我們。」


    小百合露出溫和的笑容，請我吃點心。那天的點心是草莓塔，很有春天的味道。


    「真好吃！」我忍不住驚嘆，「澄川學姊，這是妳做的嗎？」


    「我很想回答『是』，但可惜不是，我們社團有一個人很會做甜點，甜點是她的專長。我來為妳們介紹，小南，妳來客廳一下。」


    小百合對著裡面叫了一聲。我被這裡的裝潢和藏書所吸引，完全沒有發現原來這裡還有廚房。


    「瑪德蓮剛烤好，要不要試試？」


    一個雙手戴著粉紅色隔熱手套，繫著白色荷葉邊圍裙的女生，端著裝了甜點烤盤從廚房走了出來。她一頭鬈髮及腰，一張娃娃臉十分可愛，我突然又感到不安，覺得自己似乎不應該出現在這種地方。


    「小南茜是二年級生，她喜歡這裡的廚房，比起看書，她更喜歡在廚房挑戰新花樣的甜點。」


    逸美笑了起來，似乎覺得很滑稽。


    「啊呦，白石學姊真是的，我明明也有看書啊。」


    小南嘟著可愛的臉，生氣地說。


    這時，門打開了，三個女生一起走了進來。


    「哇，好香喔！」


    「今天的甜點是什麼？」


    她們沒有打招呼，就直接低頭聞了起來。


    「啊喲啊喲，幾位大小姐，妳們在新成員面前也太放肆了。」


    小百合笑著數落她們，她們才發現了我，像調皮的小孩一樣吐了吐舌頭互看著。


    「我是二年級的高岡志夜，自從白石學姊讓這個社團復活後，我很荣幸成為最初的社團成員，目前也從事創作工作，姑且算是作家。」


    說話的是一位綁著馬尾，看起來很豪爽的少少女。


    「我是三年級的吉賀園子，和逸美、小百合同班，諸多關照。」


    她是看起來很有理智的鐵娘子，造型俐落的眼鏡後方一雙細長眼睛很明亮。


    「我是留學生蒂安娜·德秋貝，來自保加利亞。」


    她的五官輪廓很深，宛如充滿神秘色彩的東歐精靈。


    每個月具有富有個性的美麗和氣質，為什麼只有我……我又忍不住自卑，想要退縮，但幸好拚命忍住了。


    「所有人都到齊了，那就來喝茶吧。」


    小百合開始準備皇家哥本哈根的茶具，小茜為每個人準備了瑪德蓮，裝在盤子上。


    我竟然受邀來到全校女生都夢寐以求的沙龍，和這些出色的成員一起喝茶，這一切簡直就像在作夢。她們談笑風生，我無法加入她們，只能默默吃著瑪德蓮。


    「二谷，妳平時都看什麼書？」


    古賀園子主動問我。


    「呃，我目前在挑戰山繆·貝克特（Samuel Beckett）的作品。」


    「是喔，妳的興趣真獨特，那種書對我來說太艱澀了。」


    「古賀學姊都看哪方面的作品？」


    「嗯，理科方面的，像是醫療方面，不會特別追哪一位作家的作品，隨便亂看。」


    古賀撥了撥一頭清爽的短髮笑了起來，這時，她光滑的脖頸飄出宜人的芳香。


    「哇……這是什麼香水？」


    「這個嗎？嬌蘭的鈴蘭（Magnolia）。」


    「啊，」聽到香水名，逸美加入了談話，「園子，妳已經有鈴蘭香水了嗎？今年的不是還沒有正式上市嗎？」


    「這是特別請人去法國帶回來的。」


    那是我從來沒有聽過的香水名字，聽說是每年春季推出的限量版香水，香氣令人沉醉，聞了之後就很難忘記。


    「所以，妳可以暫時獨佔這種香氣。」


    古賀和逸美之間的談話聽在我耳朵裡，也覺得充滿優雅。


    「我吃太多草莓塔了，肚子好脹喔，可不可以請妳幫我吃這塊？」


    逸美很自然地把她的瑪德蓮遞到我面前。我早就把自己的瑪德蓮吃完了，一定露出了貪吃表情。雖然我覺得難為情，但還是毫不猶豫地伸出手，因為比外面賣的瑪德蓮好吃太多了。


    瑪德蓮的甜度適中，飄著淡淡的蘭姆酒香味，我幾乎有點醉意了。不，我真的醉了。我沉醉在這個豪華的沙龍、美麗的社長和副社長，還有出色而富有個性的文學社成員，以及這些愉快的交談中。


    不知道是因為吃了平時根本吃不到的東西，還是被華麗的沙龍嚇到了……那天晚上回到家後，我把胃裡的食物全都吐了出來。


    那天是我入學以來，第一次開懷地笑。不是家人，不是班上的同學，也不是老師，而是白石逸美提供了一個屬於我的歸宿。


    ### 社團生活與家教


    社團活動很開心。


    - 星期一：讀書會，看完一本書後，大家交流讀後感。

    - 星期二：討論會……聽起來好像很嚴肅，但其實只是隨心所欲地聊一些關於文學的事。

    - 星期三：理藏書日，社團活動休息。

    - 星期四和星期五：自由活動，想要創作的人可以在沙龍創作，也可以看書櫃裡的書。


    基本上是自由參加，但大家的出席率很高，我們的甜點師小南茜的甜點應該對大家的出席率有很大的貢獻。


    我還是學生，放學後是我唯一可以賺錢的時間。雖然我如願加入了夢寐以求的社團，但接下來的一个星期，我幾乎無法參加社團的活動。


    「妳加入了社團，但妳很少來沙龍，每天都很忙嗎？」有一天，我和逸美在走廊上擦身而過時，她叫住了我。


    「不，不瞞妳說……我在打工。」


    「——打工？」


    逸美皺起眉頭。校規禁止學生打工，獎助生也一樣，因為獎學金制度原本就是為了讓學生專心讀書而設計的，但以我家的經濟狀況，即使不需要負擔我的教育費，日子仍然過得捉襟見肘，如果不打工幫忙家計，就無法支付生活開支。


    逸美的爸爸發給我獎學金，一旦逸美知道打工的事，也許會停止我的獎學金資格，但是，我不想對真誠美麗的雪姊說謊。


    「妳打什麼工？」


    「超市的收銀員，和我媽媽一起。」


    「喔，原來是這樣……」


    逸美瞇起眼睛想了一會兒。


    「我有一個提議，希望妳不要誤會，」逸美對我說：「如果妳想打工，我覺得有更適合妳的工作。我並不是看不起超市的收銀工作，但要適才適所，妳很聰明，想不要靈活運用妳的聰明？」


    「靈活運用？」


    「我弟弟正在找家教，他目前讀小學四年級，數學和國文很差，妳這兩科的功課都很好吧？」


    「但是，我怎麼……」


    「如果當我弟弟的家教，學校方面也沒什麼好挑剔的，我爸爸也會很高興，妳可以大大方方打工。」


    逸美露出溫柔的笑容。


    我忍不住高興起來，逸美察覺了我的狀況，很快為我想出了對我、對學校和對獎學金制度都不會造成任何影響的方法。她的這份心意對我校義重大。


    「那我就欣然接受了。」


    那件事之後，我越來越尊敬、崇拜逸美。


    ### 白石家的生活


    逸美的家——不，應該說是豪宅——坐落在山上。


    我坐在逸美家的黑色轎車後車座，看著車窗外和緩的坡道和鬱鬱蔥蔥的綠意。年紀超過六十，連眉毛都是白色的司機穿著深藍色西裝，戴著白手套，對我說話的態度也很恭敬。


    > 「美禮小姐，冷氣會不會太強？」

    >

    > 「美禮小姐，您會不會暈車？」

    >

    > 「美禮小姐，逸美小姐在學校怎麼樣？」


    我長這麼大，從來沒有人叫我小姐，我覺得有點心癢癢的，只能小聲地回答。


    > 「室生先生，」逸美對司機說：「美禮從今天開始要當和樹的家教。」


    > 「那真是太好了，又多了一個姊姊，和樹少爺一定會很高興。」


    我在照後鏡中和司機四目相接，從他平靜的眼神中可以發現，他熱愛這份為白石家奉獻多年的工作。我暗自覺得，逸美的家庭真幸福。


    逸美家一如傳聞，有一個游泳池，還有一個鯉魚悠游的水池和一個人工小瀑布，以及漂亮的石燈籠，還有一棟很沉穩的偏屋，感覺像是茶道專用的茶室。整棟房子的佔地面積很大，脫俗的近代房子很有戰前歐式建築的味道。


    最重要的是，我被逸美的家人深深地吸引。她的母親溫柔婉約，她的父親除了學校以外，還多元化經營綜合醫院和營造公司，具有可以看透人心的威嚴（逸美的優雅應該來自她的母親，敏銳的感覺應該像她父親）。她的弟弟舉止和言談都彬彬有禮，卻不失小學生的調皮。他們全家人無論做什麼，言談舉止中都散發出高雅的氣質。這才是真正的上流社會。就連才十六歲的我對此深有觸感。


    那天晚上，我教了和樹數學和國文各一個小時，他們請我吃了晚餐，臨走時，還交給我一個信封。我在回家的車上偷偷打開信封一看，發現裡面裝了一萬圓。這是月結的家教費？該不會是今天兩個小時的家教費吧？就連續業家教恐怕也沒有一個小時五千圓的高薪。


    但是，隔天在學校向逸美確認後，她說是日薪。


    「太多了，我不能收。」


    我想要還給她，但她堅決不肯收。


    「之前的家教也是每次都付一萬圓。「我不是職業家教，也不是知名大學的學生，只是普通的高中生，而且是妳的學妹，如果有時薪一千圓，我就很高興了。」我們爭執了半天後，逸美終於答應了。


    於是，我經常以家教的身份出入白石家。逸美的母親很親切，經常送我很多東西。有時候送我漂亮的利摩日瓷鐘說：「妳可以放在房間裡」；有時候送我蕾絲的杯墊說：「帶回去給妳媽媽用」；有時候又會送我雕花玻璃的杯子說：「不小心買了一樣的。」這些東西和我家格格不入，她的好意反而讓我有點傷腦筋，但當我帶著她送我的
    GODIVA 巧克力回家時，弟妹們都樂得手舞足蹈。


    「這種東西就讓妳這麼高興，妳變得真快啊。」媽媽和大家一起吃巧克力時挖苦我，她對我辭去超市收銀工作很不高興。「唉，如果妳不去家教的日子可以排班，就可以賺更多錢。」


    媽媽滿臉不悅，接二連三地把松露巧克力放進嘴裡。


    「不行。學校禁止學生打工，所以才會叫我辭去超市的工作，讓我去當家教。這次再違反規定，搞不好會被退學。」


    「要隱瞞還不容易？」


    「即使我拿不到獎學金也沒問題嗎？」


    「我一開始就反對妳讀私立學校，即使被退學也沒關係啊。」


    弟弟吃了滿嘴的巧克力，媽媽爲弟弟擦拭嘴巴時說。


    「而且，妳並不是每天都去家教，但每天都很晚回家。」


    「因爲……我參加了社團。」


    「社團？」


    「對，文學社。」


    「喔，妳原本就喜歡看書。真好命啊。」


    「請妳不要用這種方式說話。如果妳不喜歡這種生活，當初不要離婚不就好了嗎？」


    媽媽不發一語。以前我從來沒有用這種語氣對她說話，但也許是因為在一流的私立學校，和一流的人交流的自負，讓我有點看不起她，才會提到離婚的事。


    「妳說話真是沒大沒小。」


    但是，媽媽沒有生氣，苦笑著低聲說道：


    「是啊…… 可能是因為歸宿吧。」


    「—— 啊？」


    「和他結婚的時候，我覺得沒有屬於自己的歸宿，我相信他也一樣。」


    看到我滿臉驚訝，媽媽慌忙說：


    「我說的不是物理上的歸宿，該怎麼說，好像是缺少心靈的依靠—— 」


    「我能理解。」


    當我打斷媽媽的話回答時，她露出了驚訝的表情。


    「我能理解，因爲我也一樣。」


    媽媽聽我這麼說，露出了溫和的表情。母女兩人面對面坐在桌前，默默地喝著茶。我們畢竟是母女。


    對媽媽來說，離婚是創造屬於自己的歸宿，對我來說，文學社和文學沙龍就是屬於我的歸宿。我對帶給我這一切的逸美深表感謝。


    「學姊，我希望有機會回報妳。」


    我曾經這麼對逸美說，不光是逸美，我接受了白石家所有人的恩惠。但逸美面帶微笑地說：


    「如果你真的想要回報，就不要回報給我們，回饋給不幸的人吧。」


    我立刻開始認真投入義工活動。雖然我在中學時曾經做過義工，但在參加高中加入學考試之後，就很少有有機會參加。我在網路上找到了招募義工的消息，專門陪獨居老人或是從外地來這裡，卻沒有朋友的人聊天。我之所以會選擇這個義工，是因為在他們身上看到了自己的影子，他們也一直在尋找屬於自己的歸宿。和陌生人見面當然需要勇氣，但微不足道的我也能夠消除別人的孤獨。這種義工的工作雖然不起眼，卻很適合我，正因為我曾經體會過苦澀的孤獨感，所以才能夠瞭解他們的寂寞。


    中學時，因為要準備考高中，所以只能在有空的時候參加，但我決定向逸美學習，再度充滿熱情地加入義工活動。雖然之前都是一昧接受別人的恩惠，但在做義工後，第一次發現自己也可以付出很多，我終於體會到，透過做義工，我也獲得了成長。


    我之所以能夠擴大視野，完全是拜大方的白石家所賜。白石家成為我心目中的理想家庭，如果有朝一日結婚成家，我希望能也能建立這樣的家庭。


    白石家在我眼中完美無缺，他們具備了我們家人永遠都得不到的東西——高雅的舉止、對家人的關心、自然流露的教養——具備了所有理想家庭的要素。


    人只有在自以為也能像對方一樣時，才會產生嫉妒的感情。白石家和我所處的世界有著天壤之別，所以我对逸美和她的家人完全不會有這種感情。


    進入初夏季節，周圍一片綠意盎然，向來活潑開朗的逸美突然變得鬱鬱寡歡。


    以前她在沙龍時，總是積極發言，是社團活動的中心人物，但那時候經常心不在焉地聽別人發言而已。


    看到逸美一天比一天沒精神，大家都很擔心。小百合說，蜂蜜和生薑有助於恢復體力，所以加在紅茶中讓她喝，小南也做了營養滿分的蔬菜鹹派；蒂安娜用保加利亞玫瑰精油為逸美全身按摩，古賀也為她查了醫學書，高岡不斷激勵她。


    到底發生了什麼事？每次去白石家為她弟弟做家教時，我都很想問她。


    結果，有一天晚上


    我意外看到了那一幕。我看到了曾經以為是完美家庭的白石家的裂縫。


    那天是學力測驗的最後一天，我比平時更早去白石家當家教，為和樹上完課後，走出房間後下了樓。就在這時，聽到白石先生的書房傳來激烈的爭吵聲。在「不要臉！」的怒罵聲後，傳來有人撞擊的聲音，接著，白石先生抓著又哭又喊的逸美的手臂，從書房裡走了出來。逸美散亂著頭髮，哭著反抗。我慌忙躲到柱子後方。白石先生雙眼通紅，平時總是梳得很有品味的頭髮也亂了，襯衫的胸前也敞開著。白石先生把逸美拉到門外，坐上室先生先開的車子離開了。


    那麼幸福和睦的家庭，到底發生了什麼事？

