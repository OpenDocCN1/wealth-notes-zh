    興。我充滿期待，始終沒有放棄希望，但作夢都沒有想到，竟然可以如願成為唯一的獎助生。


    參加入學典禮之前，我曾經因為量制服尺寸、拿學校指定的書包和參加校方說明會多次踏進校園。第一次踏進學校時，我心情激動得胸口發痛，看到身穿制服的學姊優雅的舉止，也忍不住心跳加速，覺得自己以後也可以像她們一樣。


    但是入學後兩個星期，我發現這裡也沒有屬於我的歸宿。


    我交到了朋友，也有一起吃便當的朋友，但我始終覺得，自己和這裡的環境格格不入。無論在上課時，或是早上和放學前在班上祈禱時，我都覺得自己不該出現在這裡。


    我一直以為自己覺得不領獎學金就無法讀這所學校的彆扭想法，是出於對生活無憂無慮的同學的嫉妒，但在我開始打工之後，才發現似乎並不是這麼一回事。


    我和媽媽在同一家超市當收銀員打工（其實學校嚴格禁止學生打工），但在那裡，也和同齡的其他工讀生合不來，整天默默地完成自己的工作。起初在休息時間，'
  - '[PAGE 26]


    還有人和我聊天，但她們得知我在讀聖母女子學院後，只是驚嘆了一聲「是喔」，隔天之後，就和我保持距離。


    ——為什麼讀聖母女子學院的人會來超市打工？


    ——她媽媽也在這裡上班。


    ——是喔！所以不是有錢人喔。那她說她讀聖母女子學院絕對是唬人的。


