- raw:
  - '[PAGE 143]


    本厚厚的書中整理出5W1H或是6W1H，或是6W2H，再與現代的情勢、風潮進行比較檢討。一旦掌握了訣竅，讀書會不再成為我的痛苦。


    以斯湯達爾的《紅與黑》為例。


    +   WHEN…十九世紀，王朝復辟時代

    WHERE…法國

    WHO…出身貧窮的朱利安·索雷爾

    WHAT…二十三歲被判死刑

    WHY…覺得遭到以前偷情的有夫之婦背叛，試圖槍殺對方

    HOW…充滿野心，想要同時得到權力和愛，卻不幸失敗而身敗名裂


    即使到了現代，被權力和財力玩弄於股掌的人類本質仍然沒有改變，但當今的日本人卻缺乏像朱利安那樣的毅然和高貴，為了追求純粹的愛，甚至願意接受死刑。


    再以費茲傑羅的《大亨小傳》為例。


    +   WHEN…一九二〇年代，第一次世界大戰後

    WHERE…紐約郊區長島'
  - '[PAGE 144]


    WHO：神祕的富翁傑·蓋茨比


    WHAT：遭人嫁禍，遭到槍殺


    WHY：為了得到前女友的愛，試圖從她現任丈夫手上把她奪回來


    HOW：在他上戰場期間，女友嫁給了富翁。為了搶回女友，拚命追求不符合他身分的財富和成功


    人總是在追求自己得不到的東西，像是愛情，像是權力，像是社會地位，但是，不顧一切地追求這些的身影很愚蠢，也很悲哀。我們不斷追求著像蓋茨比那樣純粹而華麗的男人——因為我們知道，世界上並不存在像他那樣的人，他只是夢幻。


    我開始在讀書會上積極發言，逸美為我感到高興。有一天，她問我：「妳的著眼點都很有趣，妳是怎麼理解這些作品的？」我拿出寫了5W1H的紙給她看，她忍不住大笑起來：


    > 「園子，這太像妳的作風了。妳不是用感性，而是用理性在閱讀。」


    雖然我無法正確理解文學，但我加入文學社是正確的決定。首先，增加閱讀能'
  - '[PAGE 145]


    力有益無害，其次，可以經常吃到小南親手製作的絕佳甜點。最後，文學社會舉辦獨特的闇鍋朗讀會。


    這個文學社已經有好幾年沒有招募成員，休社了好幾年，白石逸美上高中後，讓這個社團重新復活了。當時，擔任社團顧問的北條老師把代代相傳的「文學社規則」傳承給逸美。這份規則上寫了如何在讀書會分享心得，如何舉行討論會，以及闇鍋朗讀會及其規則。


    闔上所有的燈，必須在黑暗中進行。


    必須由社長擔任主持工作，也就是「鍋管事」。


    參加的成員不得公佈帶來的火鍋料內容。


    火鍋料不是食物也無妨，但僅限乾淨的東西。


    由社長親自製作甜點，必須提供美味甜點供成員餐後享用。


    朗讀小說者須在另設的朗讀區朗讀。


    在黑暗中聽他人朗讀的同時吃闇鍋。


    雖然很驚訝到底是多麼標新立異的人，才會想出這種朗讀會的方式，但實際參'
  - '[PAGE 146]


    加後，發現非常有趣。吃闖鍋時，會戰戰兢兢地把筷子夾到的東西送進嘴裡，嘴唇碰到時的感覺很可怕。發現和自己原本想像的味道不同时，渾身都會起雞皮疙瘩。原本以為在這樣的狀況下，根本不可能聽別人朗讀小說，令人意外的是，別人朗讀的內容比起在明亮的房間內，比自已用眼睛看更能夠進入腦袋。朗讀激發了想像力，宛如一本書攤在面前，所有的情景都會浮現在眼前。黑暗可以活化大腦，讓情節更鮮明地視覺化。


    同時，也可以刺激參加者惡作劇的心理。雖然文學社規定不得公佈每個人帶來的火鍋料內容，不瞞各位，我去年帶了草莓大福、榛果和香奈兒手錶。草莓大福都溶化在湯裡，魚、肉和蔬菜都變得甜甜的，整鍋食物都變得很難吃。在其他人邊吃邊忍不住發出慘叫聲時，我獨自偷笑著。榛果的口感很硬，有人驚叫：「裡面放了石頭！」再度讓我露出得意的笑。之所以會帶香奈兒手錶，是想要把誰都想不到的東西放進鍋裡，讓所有人大吃一驚。逸美拿到手錶時很高興，其他人都很羨慕，我很想炫耀說：「那是我帶來的！」但因爲文學社規定必須保密，所以只好忍住了，不過還是覺得有點可惜，直到今天還在為這件事後悔。'
  - '[PAGE 147]


    文學社的活動並非只有讀書會和闤闠朗讀會而已，復活節＆聖靈降臨節園遊會也是一項重要的工作，因為我在今年的復活節活動中擔任執行委員長，所以很少參加社團為園遊會做的準備工作。


    去年我擔任執行委員，在幫忙的時候，看到委員長整天忙得不可開交，覺得她「太辛苦了一，忍不住有點同情她，但今年我擔任了委員長的工作。


    執行委員長要為海報設計的事和美術社的人討論，製作發給左鄰右舍的宣傳單，和合唱團討論音樂的事，還要訂購找彩蛋活動所用的雞蛋，整天都有忙不完的事。宣傳單上必須用簡單的方式介紹復活節的由來，讓即使對天主教很陌生的大人和小孩也能夠瞭解。絞盡腦汁之後，最後寫出了以下的內容。


    # －復活節（主復活日）


    是慶祝基督耶穌死後復活的節日，從復活節開始的五十天期間，稱為復活節期，五十天後稱為聖靈降臨日，也就是聖靈降臨的日子。為了慶祝這些重要節日，本校每年六月都會舉行慈善園遊會。


    園遊會時會舉辦找彩蛋活動。在象徵生命的雞蛋上塗上顏色後，藏在校園內，'
  - '[PAGE 148]


    然後請參與活動的朋友找出這些彩蛋。

    同時舉辦慈善拍賣，設有咖啡區，請各位務必光臨。

    校內還設置了捐款箱，事後會將募集到的款項捐給紅十字會和老人院等相關機構。

    基督耶穌至今仍然活著。

    基督永生。一

    除此以外，還要寄發電子郵件請家長捐款和幫忙，或是聯繫業者在校園搭建舞 台，有一大堆辛苦的事情要做，但我之所以願意擔任委員長的工作是有原因的，因 為我想要回報這所學院的董事長白石先生。

    白石先生是逸美的父親，除了本學院以外，還多元化經營綜合醫院和商業設 施。一般來說，學生根本不可能見到學校的董事長，但白石先生與眾不同，他經 常來到學校，和學生相互溝通，聽說還會確認所有學生每個學期的成績。看到學
    生成績不佳時，就會安排特別輔導，同時會參觀老師的授課，瞭解老師的教法是 否有問題。'
  - '[PAGE 149]


    白石先生向來以「學校經營是極致的服務業」為原則，認為提升學生的學力和道德意識是學校的絕對義務。


    他也積極參加學校的各項活動，尤其對復活節活動投入了很大的心力，他認為「這是讓學校附近的民眾瞭解基督的愛和精神，同時回饋他們的最佳機會」，所以親自參與企畫的細節問題。


    我個人曾經受過白石先生的恩惠。我以前就很想參觀人體解剖，但我父親開的是小診所，和手術或是解剖無緣，但我一直認為既然立志成為醫生，就必須找機會參觀一下。所以，去年擔任執行委員時，我主動要求擔任有更多機會和白先生接觸的報告員，在第一次見到他時，就拜託他是否可以安排我去醫院參觀，原以為他會說：「這不是小孩子的遊戲」，當場拒絕我，沒想到他欣然應允。


    「好，我會向外科主任打招呼，妳可以隨時打電話去醫院。」


    隔週，我就和解剖學的教授和實習生一起站手術台前。我當然沒有拿手術刀，只是在旁邊看而已，但不是從圖片或照片上，而是親眼看到人體的器官讓我獲益無窮。 解剖時，肅然地取出大腦、心臟、肺臟、肝臟、腎臟和血管等器官，切'
  - '[PAGE 150]


    成薄片。原先以為自己會想要嘔吐，或是受到很大的衝擊，沒想到心情格外平靜。

    也許是因為我無法把死亡和眼前的屍體連結在一起的關係，對我來說，在我眼前切成片狀的器官並不是什麼怪異的東西，而是促進醫學發展的寶貴資料。

    解剖結束後，我確認了一件事。

    人體內並沒有靈魂。

    我親眼目睹了腦細胞的每一個角落，心臟的每一個部分，以及從頭頂到腳底的一切，確認完全沒有任何容納靈魂的空間。喜悅、悲傷、憤怒、嫉妒都是在腦漿這個極小的器官中發生的，扁桃核、大腦邊緣系和大腦新皮質掌控了人類的感情。人並不是因為有靈魂而活在世上，而是呼吸將氧氣帶到全身，身體分泌了生理活性物質，隨著血液循環進行代謝，使人能夠存活。在參觀解剖之後，我深深瞭解到，活著只是一件生理的事。

    雖然我讀的是教會學校，但我並不是天主教徒，並不相信上帝這種不科學的存在，也不瞭解聖靈和永生有什麼意義。因為我只相信自己親眼看到的事，但是，如果上帝和靈魂可以成為人的精神支柱——尤其如果可以成為病患的希望——身為醫'
  - '[PAGE 151]


    生，為了能夠使病人保持心靈寧靜，就必須深入瞭解，並且面對這個問題。


    參觀解剖之後，我有了很大的改變。生存是什麼？如何死亡？上帝是什麼？醫生該做什麼？——我深入思考了這些問題，再度下定了決心，要帶著真摯的心立志成為醫生。


    所以，在今年的復活節園遊會時，我主動爭取當執行委員長，努力回報在前一年給了我寶貴機會的白石先生的恩情。


    在新學期開始的同時，就開始著手進行復活節園遊會的相关準備工作。


    復活節是在四月，很多教會和教會學校都在那個時候舉辦活動，但我們學院通常在六月中旬舉行，一方面可以避開剛開學後的倉卒，另一方面可以同時慶祝聖靈降臨日。


    我在去年擔任報告員時，只去過白石家幾次而已，但在擔任執行委員長之後，經常上門和白石先生討論事情。每個星期都會和白石先生見面數次，請他對海報的草圖發表意見，或是把各攤位的最終名單和預算報告交給他。


    153'
  - '[PAGE 152]


    白石先生的事業很忙，時間當然很寶貴，但他沒有把這些寶貴的時間用於休息和個人興趣愛好，而是用在學生身上，讓我感激不已，所以我也利用讀書以外的所有時間，努力希望把園遊會辦得更熱鬧。因此，我們經常熱烈交換意見，有時候回過神時，發現已經不知不覺在白石先生的書房內討論了三個時間。


    我主要在放學後投入園遊會的準備工作和討論事宜上，所以那段時間幾乎沒有參加文學社的聚會。文學社的成員應該也每天都為復活節園遊會的準備工作開會討論，去年做了兩百條蛋糕在園遊會上義賣，今年我無法幫忙，準備材料和工具和預算管理等工作應該比去年更加忙碌。所以，我每次去白石家時，都沒有遇到逸美，逸美八成也忙得不可開交，因為她很像她的父親白石先生，都很熱心，而且是完美主義者。


    「妳覺得兔子、兔子跳舞怎麼樣？」


    有一次，白石先生雙眼發亮地提議道。


    「兔子……嗎？」'
  - '[PAGE 153]


    「復活節節兔啊，請學生穿上復活節兔的衣服，在校園內邊走邊舞，就像是童話世界，光是想像一下，就覺得很開心，妳不覺得嗎？」


