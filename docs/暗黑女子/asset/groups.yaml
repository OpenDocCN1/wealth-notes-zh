    「咦？彌撒已經結束了嗎？」

    「結束了，剛才沒有看到妳，我很擔心呢。」

    「我有點累了，對不起，讓你擔心了。」

    「請問，之後……沒問題嗎？」

    「沒事，完全沒問題。」

