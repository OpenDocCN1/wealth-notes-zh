    我悄悄穿上鞋子，正在考慮是不是不告而別，發現有人突然從昏暗的走廊現身。


    「啊！」


    我忍不住叫了起來，但對方並沒有驚訝，只是呆然地站在那裡。


    「……伯母？」


    她是逸美的母親。


    「啊喲，是美禮啊……」


    逸美的母親臉色鐵青，完全看不到平時開朗的表情。


    「剛才上完課了，我正想回家。」


    「是喔……」


    她的眼神空洞，雙眼無法聚焦。也許她也聽到了剛才的爭執。


    我突然害怕起來，急急忙忙離開了白石家。


    之後，逸美向學校請假了幾天，據說是因為肺炎住院了。


    一個星期後，聽說逸美出院了，我興奮地去文學沙龍找她，卻不見逸美的身影。我靈機一動，急忙走去露台，發現逸美果然在那裡，懶洋洋地倚著欄杆站著。


    「白石學姊......」


    逸美轉過頭時，我覺得和平時的她判若兩人。她的臉色蒼白，眼皮微紅浮腫，臉頰看起來也很憔悴。


    「妳的身體已經好了嗎？」


    「對，託妳的福，我的呼吸系統向來都很弱。」


    她勉強擠出的笑容讓人看了心痛。


    「是不是發生什麼事了？」


    「什麼事？」


    「不，我是說妳家裡──」


    「妳為什麼這麼問？」她的語氣突然惱怒起來，我不敢說，那天在她家看到了爭執。


    「不，如果沒事就好，我只是想，會不會有什麼煩惱。」


    「煩惱......」


    逸美呆呆地看着教堂。


    「二谷：……妳是否有過曾經想要殺了誰的念頭？」


    我大驚失色。雖然每個人都應該有過這種黑色的感情，但沒想到逸美會說出口。


    逸美看到我沒說話，又繼續說：


    「我有，我想要殺了一個人。」


    她用空洞而黑暗的聲音嘟囔著，我驚訝地看著她的臉，以為自己聽錯了。風很大，呼呼地吹著。


    「只要殺了那個人，我同歸於盡也無所謂。我對那個人恨之入骨。」


    「學姊：：：感覺不像妳說的話，到底發生了什麼————


    我回想起白石先生和她之間的爭執，當時，逸美哭著被白石先生帶走——


    「我爸爸，」逸美看著遠方，喃喃地說：「有人勾引我爸爸，那個人是文學社的成員。」


    「——啊？」


    「我覺得爸爸最近很奇怪，所以就去他的書房找線索，發現了學校指定使用的手帕，當然不是我的。」


    「是喔………」


    「而且，手帕上有鈴蘭的香味。嬤蘭的鈴蘭香水——用這種香水的……不是只有一個人嗎？」


    「怎麼會？所以是——」


    「是不是很過分？我們是數理組的同班同學，我一直把她當作可敬的對手，沒想到……不知道什麼時候和我爸爸………」


    逸美用力咬著嘴脣，我第一次看到她臉上露出這樣的表情。


    「白石學姊……」


    她用可以瞬間化為凶器的銳利眼神看著前方，我有點害怕地叫了她一聲。逸美好像突然回過了神，放鬆了肩膀，轉向我的方向，露出溫和的微笑。


    「我們去沙龍吧，我泡可可亞給你喝。」


    說完，逸美抓著我的手叮嚀說：


    「這件事，妳不要告訴任何人。這是我們之間的秘密。」


    之後，我們在沙龍討論了要在六月舉行的復活節＆聖靈降臨節上賣甜點的事。


    這是同時慶祝春天的復活節和五十天後的聖靈降臨節的慈善園遊會。逸美坐在那裡發呆，由澁川小百合主持了會議。


    - 「我們每年都會賣兔兔餅乾，今年希望可以有新的創意。各位有沒有什麼好點子？」

    - 「蛋形的餅乾呢？可以在餅乾表面用糖霜畫各種圖案。」


    聽到小南的提議，高岡舉起了手。


    - 「好主意，絕對超可愛的，我來負責畫圖案。」


    - 「那今年的餅乾就這樣決定了。另外，今年要做幾條磅蛋糕？」

    - 「去年好像是兩百條。」

    - 「但一下子就賣完了。」

    - 「那今年就努力做三百條。」


    大家討論時，逸美始終看著某一點發呆，她的視線——看向了古賀園子。


    她真的和白石學姊的父親……？


    - 「那就原味、抹茶和可可亞各一百條。」


    古賀說。她在逸美的面前表現得很自然。難道她不會受到良心的譴責嗎？


    - 「好主意，那就這麼辦。對了，保加利亞也會慶祝復活節嗎？」


    小百合問蒂安娜。


    - 「會啊，我們村裡會做一個巨大的復活蛋，差不多像大人一樣高，然後塗上顏色，裝飾在村莊的中心。」

    - 「太有趣了！我也想玩，我去向執行委員會建議看看。」


    古賀說話時，逸美還是呆呆地看著她。


    - 「呃，我有一個建議，」小南舉起手，「我打算在抹茶磅蛋糕裡加大納言，妳們覺得怎麼樣？」

    - 「大納言？大納言紅豆嗎？」

    - 「對。北海道產的大納言紅豆皮太厚，我想用丹波出產的。」

    - 「聽起來很好吃。逸美，妳覺得呢？抹茶磅蛋糕的價格稍微設定得貴一點，應該沒問題吧？」


    即使小百合問她，她的視線仍然飄忽不定。


    『逸美？』


    小百合又叫了一聲，逸美突然回過神，立刻用笑容掩飾。


    『嗯，對啊……這樣很好。』


    之後，大家又興奮地討論包裝、緞帶的顏色和價格的設定問題，只有逸美露出陰鬱的眼神看向窗外。


    逸美最近悶悶不樂是有原因的，我想像自己如果身處逸美的立場，一定會受到極大的打擊。雖然每天都會見面，但她努力維持表面的平靜，內心一定很痛苦，而且，對方並不知道逸美已經察覺了這件事。


    我曾經好幾次想告訴小百合，但最後還是作罷了。有時候正因為是好朋友，反而說不出口，所以逸美叮囑我不要告訴別人。我內心很焦急，卻還是決定為她保密。


    幾天後，逸美在放學時找我去沙龍。當時只有逸美一個人在沙龍，她躺在暖爐旁，一看到我，就像迷路的小孩終於見到了母親一樣，露出鬆了一口氣的表情。


    「謝謝妳來了，請坐。我幫妳包紅茶，要不要喝洋甘菊紅茶？我想讓心情平靜一下。」


    「好啊。」


    逸美走去廚房，然後用托盤端著基諾里的茶具走了出來。蛋糕盤上放著蘋果派和香草冰淇淋。


    「這是茜教我做的，但還是無法做得像她一樣好吃。」


    逸美讓茶葉在茶壺中泡開後，倒進了茶杯。『昨天……園子好像又來我家了。』逸美果然想和我聊這件事。昨天，古賀沒有參加讀書會，我還在猜想，會不會是這樣。


    「我媽媽去做義工，弟弟參加社團活動不在家。我在讀書會結束後，急急忙忙回家了，剛好撞見園子從大門出來。」


    逸美咬牙切齒地說。


    「妳有問妳爸爸嗎？」


    「我原本想質問他，但後來想想算了，我打算找到證據後再說。上次我在書房找證據時被我爸爸發現了，他罵我不要臉。」


    「但妳要怎麼找證據？」


    「不瞞妳說，我已經裝了監視攝影機，真期待不知道會拍到什麼。」


    逸美憔悴的臉上露出笑容，但她的微笑很快就消失，哭喪著臉說：


    「我恨死園子了……」


    大滴的淚水從她的眼中流了出來。對逸美來說，那個幸福的家庭是她的歸宿，所以必定對侵門踏戶，想要破壞他們家庭的古賀恨之入骨。


    「學姊……有什麼需要我幫忙的嗎？」


    我輕輕把手放在逸美的肩膀上，她用纖細的手指擦了擦眼睛。


    「妳在為我擔心嗎？妳真善良，也許正是因為這個原因，在妳面前，我可以說出一切。我很慶幸找你傾訴。」


    然後，她目不轉睛地看著我，突然想到了什麼，拿下了戴在頭髮上的髮夾。那是一條黑色髮夾，上面鑲了五彩水晶，洛可可藝術風格的脫俗款式戴在她一頭栗色頭髮上很好看。


    「這個送你，妳戴一定很好看。」


    「啊？」


    我不敢收下，逸美把髮夾硬塞在我的手上。那個髮夾一定很昂貴。


    「我不能收下。」


    「我希望妳可以收下，紀念我們的友誼。」


    比起收到這個我根本買不起的髮飾，逸美認為我們不是學姊和學妹，而是平等的友情這件事更令我感動不已。


    「真的……要送我嗎？」


    「對啊，妳戴看看。」


    我把頭髮束在耳邊，戴上髮夾。


    「妳戴果然很好看，妳就把它當作是我，隨時戴著吧。」


    現在回想起來，這句話真的很不吉利，簡直就好像要我把這個髮夾當成遺物。而且，逸美在不久之後真的死了。


    我至今仍然懊惱不已。


    為什麼當時沒有制止逸美。古賀是一個會偷偷勾引同學父親的卑鄙小人，不難想像，一旦逸美掌握證據逼問她，她一定會不惜使用任何手段殺人滅口。


    逸美離開人世至今一個星期了。到底誰殺了她——誰都想要瞭解真相。但是我瞭解真相，把逸美從露台上推落的不是別人，就是古賀園子。


    我至今仍然可以清楚想起白石逸美的屍體橫在花圃的樣子，想起她被擔架抬走時蒼白的手，以及想起她手上握著的鈴蘭花。


    逸美一定在最後一刻，從花圃裡抓了鈴蘭的花。


    這是逸美為了告訴我誰是凶手，為了告訴我，殺害她的就是渾身散發鈴蘭香味的那個女人。


    （完）


    ## 1. 朗讀小說〈白薔薇與鈴蘭〉


    二谷美禮同學，謝謝妳的朗讀。


    第一個朗讀一定很緊張吧？而且，妳是新生，第一次參加例會。但是，我覺得妳很有膽量，很適合最先為大家朗讀，所以才安排了這樣的朗讀順序。


    直率的小說很有妳的風格。是啊，這幾個月來，逸美的確看起來心事重重。每次見到她，她都面色凝重，好像在想什麼事……來沙龍時，也經常發呆。到底發生了什麼事？我曾經多次不經意地向她打聽，她每次都露出哀傷的微笑，卻從來沒有告訴我。雖然我一直為自己是逸美的好朋友感到驕傲。


    我第一次聽說她爸爸的事，逸美從來不在我面前談論她家人。尤其她很尊敬她爸爸，她經常說，如果以後結婚，一定要嫁給像她爸爸那樣的人。在座的各位應該也曾經過多次聽到她說這句話吧？她有戀父情結，逸美的爸爸也對她疼愛不已。


    沒想到竟然會發生這種事。啊，早知道應該多關心逸美，我真的很後悔，也對自己很生氣。


    …………什麼？也許正因為是好朋友，所以反而無法聊這種事？謝謝妳這麼安慰我。是啊，也許吧。正因為是好朋友，才可能不願涉入對方的私領域。聽妳這麼說，我的心情稍微輕鬆了一點。


    不過……沒想到妳竟然對凶手指名道姓，太令人驚訝了。我知道在座的其他人一定有很多疑問，也想問很多問題，但還是先聽所有人朗讀完後再一起討論。


    妳目前戴的黑色髮夾，就是剛才提到的、逸美送給妳的髮夾吧？很漂亮，妳戴著很好看，我能夠瞭解逸美送妳禮物的心情。這個髮夾戴在妳的淺色頭髮上很好看。


    朗讀用的燭光下，可以隱約看到妳的髮夾，可不可以再讓我們多看一眼？──啊啊，是用水晶做成花卉的圖案？真漂亮。謝謝妳。


    請妳先回座。光線很暗，走路時請小心。各位用熱烈的掌聲感謝二谷美禮同學。


    各位，不知道闍鍋的味道如何？如果覺得很難吃，建議大家可以加咖喱粉或是豆瓣醬調味。很奇怪吧，在黑暗中吃東西，味覺會特別敏銳，難吃的東西變得更難吃，好吃的東西也會覺得更好吃。所以，如果闍鍋一開始的調味很難吃，那麼從頭到尾都會很慘。來，各位請多吃點。


    接下來有請第二位同學朗讀。


    第二位輪到小南茜同學。請移駕到朗讀區。


    ### 2. 朗讀小說〈某位同學的朗讀後台〉


    （註：此處為轉場，根據原文順序，接下來是第三章內容）


    ## 3. 朗讀小說〈馬卡龍麵糊〉


    二年B班


    小南茜


    說句心裡話，起初我不怎麼喜歡白石逸美這個人。


    不，我討厭她。


    我和比我大一屆的學姊白石逸美彼此不認識，當然也沒有說過話，但逸美不光是董事長的女兒，而且容貌出眾，穎悟絕倫，在學校內是無人不知的名人，所以我很久以前就知道她了。不光是高中部，就連小學部和中學部都有她的粉絲，經常擠在她的教室前看她，我總是冷眼旁觀這些事。


    她身材高挑，手腳修長，笑容很燦爛，無論走在哪裡，她優美的身影都可以吸引眾人的目光。她是理想的八頭身，五官很漂亮，一雙迷人的雙眼令每個學妹豔羨不已，像花蕾般的雙唇兼具氣質和性感，還具備了與生俱來的良好家世造就的高雅氣質。


    「美女」這種陳腔濫調的字眼不足以形容她。沒錯，麗人。她是一個所有方面都很端麗的人，這正是我不覺得她美麗的原因。


    白石逸美太完美了。通常在做蛋糕裱花，或是和菓子裝飾時，為了增添趣味，會故意讓左右不對稱，因為這才是深奧的魅力。但逸美的容貌未免太端正了，好像經過了綿密的計算，完全找不到任何缺陷。完美的東西毫無美感，反而很低俗。所以，我輕視那些感應逸美美貌的同學，覺得她們絕對不瞭解什麼是真正的美。


    聽說白石逸美讓已經停擺了數年的高中部文學社復活時，我也覺得只是有錢有心血來潮而已，而且，文學社的成員只有社長白石逸美和副社長澄川小百合兩個人，更讓我覺得是這麼一回事。但是，隨著修道院的改建，建造了豪華的文學沙龍，簡直就是少女的夢幻城堡，這件事成為全校學生討論的話題，而且，聽說只有白石逸美親自邀請的人才能成為社團成員，白石逸美和文學沙龍越发成為全校學生嚮往的對象。當時，我還是中學部三年級的學生，周圍的同學都以一年年升上高中部，一定要受邀參加文學社為目標。


    所以，升上高中部之後，獲得輕小說文學獎的同學高岡志夜受邀逸美的邀請，成為文學社頭號會員時，大家不知道有多羨慕。當輾轉聽到志夜談論茶會——英國或法國的頂級茶葉、德國麥森瓷器的茶具、比利時皇室御用的Wetters
    薩赫蛋糕的情況時，每個人都忍不住驚嘆。也許是因為沙龍太舒服了，志夜不慌婉拒上電視和雜誌的採訪，放學後就整天泡在沙龍。她興奮地告訴大家，在巴卡拉的水晶燈下寫作時下筆如有神助。


    但是：⋯⋯我忍不住暗自皺眉。


    文學沙龍需要巴卡拉水晶燈和麥森瓷器的茶具嗎？


    我家經營老鋪料亭，從小大人就教導我，華美過度就變成了低俗。品味不是追求華麗，而是簡外慧中，舊外慧中的深沉，和歷經歲月的沉靜，低調不經意的高雅才是真正的品味。


    傳聞中光鮮亮麗的文學沙龍根本毫無品味可言，所以我總是在心裡數落沙龍的低俗，這和我不喜歡逸美的理由是一樣的。


    我父親是那種傳統低調而又頑固的老派主廚，連續多年拒絕了百貨公司請他去開店的邀約，也拒絕了上電視的邀請。雖然也有不少人上門拜託他出版料理的相關書籍，但他一貫堅持廚師只要做美味佳餚的態度，也不開分店。基於希望客人品嚐他當場現做的料理，所以也堅持不賣便當或不做外送，唯一可以在店外嚐到父親手藝的，只有代替歲末賀禮，送給極少一部分老主顧的年菜，但年菜並不是訂購制，也不是隨便送給所有的客人，所以被視為夢幻絕品的年菜。


    母親是和菓子店的獨生女，多年來，都是她在頑固的父親背後默默地支持。數十年來，都是由母親親手製作在懷石料理的最後，發揮畫龍點睛效果的當季和果子，為父親的料理增色。每個月、每一季，他們都會在討論後決定主題，父親根據主題精心製作每一道懷石料理，母親除了做和菓子，還會準備店裡的插花和掛軸。


    或許是因為繼承了父母的基因，我從小就喜歡往廚房跑。


    我家的廚房是傳統的水泥地廚房，用的是父親特別打造的爐灶。我從小看著母親清晨五點在廚房，用柴魚片、昆布放在深鍋內，熬一家四口三餐所用的高湯。經過細心過濾的液體，變成早餐的味噌湯，午餐的厚煎蛋，和晚餐的燉菜或茶碗蒸，味道和外形都有各種不同的變化。我很自然地深受吸引，也因此產生了興趣。我在三歲時第一次拿菜刀，四歲時有了自己專用的菜刀，上面還刻了我的名字。那時候，我已經很會用菜刀了。


    或許是因為我從降臨人世之後，就沉浸在日本料理以及和菓子的世界，所以長大之後，對西餐和甜點覺得很新鮮，在那個世界越陷越深。父親和母親對此沒有任何意見，因為家裡早就決定，料亭將由還在讀大學的哥哥繼承，只有哥哥要學習從清晨打掃店裡，到去市場進貨，以及根據食材做準備工作，接受這些斯巴達式的教育。我總是帶著羨慕的心情看著哥哥學習手藝，因為父親甚至禁止我出入料亭的廚房。哥哥才是大正元年（一九一九年）創立的料亭「小南」的第四代，即使我拿菜刀，學廚藝，或是學做西點，對父母來說，都是為日後出嫁做準備而已。


    哥哥學藝很不認真，對料理和餐廳都毫無興趣，整天丟下工作溜出去玩，打烊之後，也不幫忙打掃，三更半夜去飆車，但「小南」還是得由哥哥繼承。我很不甘心，所以更積極投入西餐和西點的世界，只是在我家的老舊廚房內，無法隨心所欲地烤各種蛋糕。


    這時，我聽說文學沙龍內附設了廚房這件事。


    聽說沙龍附設的廚房十分寬敞，各種設備一應俱全，使用很方便，文學社的成員有時候會在那裡烤蛋糕，或是做慕斯，享受下廚的樂趣。


    我和其他同學不一樣，對水晶燈、大理石桌子、暖爐或是下午茶完全沒有興趣，但得知那裡有廚房後，第一次被文學社吸引了。


    我之所以能夠參加這個必須被社長逸美相中，才能加入的文學社是有原因的。在說這個原因之前，不得不先提起那件可怕的事。


    事情的起源是我父親年輕時當學徒的料亭老闆打算退休，問父親可不可以由「小南」接收他的店。


    雖然是恩人上門拜託，但父親意興闌珊。不光是因為開店需要資金，更因為一旦開了分店，在管理上必定會出現疏失。我父親深信，除非親自掌廚，否則就不該開分店，卻又不能輕易拒絕恩人的拜託。父親為此煩惱不已，我提出了一個建議。


    不如把那家店改成做西餐。


    既然是「小南」西餐廳，即使不是由父親掌廚，客人也會接受，又可以不辜負師父的心意。父親很贊同我的提議，讓我參與餐廳的內部裝潢和菜單的設計，而且還決定把我登記為餐廳的老闆，日後由我掌管那家餐廳。


    我終於比哥哥更受到父親的認同，我對此感到樂不可支。


    無論在搭電車上下學時，還是課間休息時，我滿腦子都想著新餐廳的事。父親的朋友將在西餐廳擔任主廚，我把自已絞盡腦汁想出來的菜單拿給你看，請他挑選搭配的餐具。我希望餐廳能夠提供豐富的甜點。蛋糕、布丁、慕斯、芭芭樂慕斯、冰淇淋、甜塔。對了，要讓客人可以外帶甜點——我每天都在想這些事，天天都沉浸在幸福之中。


    完全沒有想到，那個夢很快就破碎了。


    那天放學後，白石逸美在鞋櫃前叫住了我。


    「妳是小南茜吧？」


    我個子矮小，必須抬頭看她。近距離觀察時，發現她的肌膚宛如細心發泡的鮮奶油般光滑，嘴唇像浸了糖漿的櫻桃般鮮紅滋潤，無懈可擊的美貌令人驚嘆。學妹們經過時，都忍不住頻頻瞄她。


    「是啊。」


    其他學生被逸美主動打招呼，或許會感到高興，但我並不是她的粉絲，事後想起來，當時的回答真的很冷淡。


    「我看了妳寫的《斜陽》的感想，很有意思。」


    我並沒有看很多書，但班導師北條老師覺得我在現代國文的課堂上寫的閱讀感想很不錯，刊登在校刊上。因為我只是隨便寫一寫，如果是年長的老師，一定會罵我：「要認真寫。」二十多歲的北條老師可能和我們的感受相近，所以對這篇文章讚不絕口。


    「妳把女主角和子與現代單親媽媽進行分析比較很獨特，我希望有機會聽妳聊聊進一步的想法。如果妳時間方便，要不要來文學沙龍喝荼？」


    我突然想到有關廚房的傳聞，很想去親眼目睹一下，但又不太想和逸美聊天。


    「不……不用了。」


    「沒關係，來坐一下嘛。我烤了磅蛋糕，才剛出爐。」


    「妳們也會自己做甜點嗎？」


    她的這句話不由得激起了我的競爭意識，很想讓她們見識一下我做的蛋糕。


    「對啊，讀書會當然少不了甜點。而且，在學校舉辦活動時，我們也會大量製作後販賣，做為社團運作的基金。」


    廚房。而且是可製作大量甜點的廚房。


    「請問……是用瓦斯還是電力？」


    「妳指什麼？」


    「烤箱。」


    逸美露出驚訝之色，隨即大笑起來。


    「瓦斯啊。妳真有意思，第一次有人問我這個問題。」


    於是，我受邀去了文學沙龍。


    那完全是我夢想中的廚房。寬敞又清潔，同時有L形和島形工作台，還有三個附花灑的大水槽、銀色的營業用冰箱、直立式攪拌器、麵包發酵箱。


    「太讚了……」


    我忍不住驚嘆，撫著擦得一乾二淨的工作台。在工作台冰涼涼的大理石上揉派皮應該很方便，巧克力的調溫時也可以使用。這裡的設備太奢華了。


    「這就是烤箱，符合妳的期待嗎？」


    逸美手指的牆邊有三台瓦斯烤箱，一台可以烤兩、三個八吋的蛋糕。


    ［好棒喔。］


    打開烤箱旁的門，那裡是一間人可以走進去的食物儲藏室，裡面有高筋麵粉、低筋麵粉、細砂糖、銀珠、核果類、香草棒、可可粉、瓶裝水果、果醬、蜂蜜、各彩繽紛的辛香料……到底可以做多少種類的甜點？很多材料都是進口的，光是那些漂亮的包裝就令人目不暇給，很想坐在這裡看一整天。


