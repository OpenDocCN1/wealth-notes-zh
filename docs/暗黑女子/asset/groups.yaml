    基督把自己的聖體和聖血分給祂的門徒和信眾得到了永生，同樣地，妳們在未來的人生中，必須和逸美一心同體，銘記著她的美丽——妳們背叛了逸美，這是妳們的義務，因為逸美那美麗、高貴、驕傲和高潔的靈魂已經進入了妳們的身體。


    請妳們記住，從今天開始，澄川小百合的故事翻開了第一頁，妳們以後要為我的故事增色，但請妳們充分注意自己的言行，因為如今是我掌握了妳們所有人的秘


    269'
  - '[PAGE 268]


    密，而且，妳們今晚所吃的――是分給妳們，妳們一輩子也無法抹去的新罪證。


    差不多該打開水晶燈了，我為各位送上最後的甜點，那是我從一大早開始為各位精心烤出來的「維納斯的手臂」。哪一位――高岡同學，可不可以請妳幫忙切一下？啊喲，各位怎麼在發抖啊？而且臉色蒼白。小南同學，妳從鍋子裡拿出來的手錶，是和去年一樣的香奈兒限量款吧？逸美很喜歡，每天都戴著，現在終於屬於妳了，太好了。


    啊，話說回來，當主角的感覺太愉快了。請各位為我乾杯。


    本學期的朗讀會也非常出色，雖然逸美已經不在了，但我們要充分利用她留下的沙龍和藏書，我相信這是對她最好的憑弔。


    外面仍然狂風暴雨，請各位回家時小心。今天感謝各位的蒞臨。


    本學期最後一次例會到此結束。


    各位請多保重。'
