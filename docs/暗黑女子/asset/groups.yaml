    逸美。在此之前，我對日本一無所知，但透過逸美口中得知的東洋小島國家的情況，讓我和艾瑪都深受吸引。全國各地都有高樓聳立的都市，又同時有大海和豐富的自然環境，還可以吃到世界各地的料理，我衷心希望這輩子有機會造訪日本。我們愛上了逸美的國家，也希望逸美同樣喜歡保加利亞。


    我們帶逸美去了很多風景優美的地方，雄偉的維托沙山上殘雪還未融化，黑海的沙灘閃著黃色光芒，多瑙河宛如母親般滋潤了保加利亞的國土，還帶她去參觀了莊嚴的里拉修道院內的濕壁畫，以及活力旺盛地在皮林山脈的廣大國家公園內生息的野生動物。


    保加利亞在經濟上並不富足，這個貧窮的國家算是歐盟內最貧窮的國家，卻擁有全歐洲最秀麗的風景，我為此感到驕傲。


    逸美個性開朗，對所有的事都充滿好奇，外出觀光時，也會和很多人打招呼、聊天，就連一般遊客敬而遠之的當地料理，她也都搶先嘗試。她天真爛漫，熱情奔放，心胸開闊，但在小事上也很體貼，看到我的腿不方便，總是不經意地配合我的步調。


    我和逸美用英語聊了很多事。我們曾經聚在艾瑪的臥室，一直聊到天亮。雖然她只寄宿了短短兩個星期，但我們之間建立了可以稱為朋友關係。


    快樂的時光總是過得特別快，這一點在世界各地都一樣。轉眼之間，就到了她寄宿在我家的最後一天。最後一天的晚上，我們邀請了左鄰右舍一起在我家為她舉行了歡送會，桌上放著加了大量羊酪的蔬菜沙拉和烤羊肉，還拿出自家釀製的茴香酒招待她，北條老師和逸美都樂不可支。


