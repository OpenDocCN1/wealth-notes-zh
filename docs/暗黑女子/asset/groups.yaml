    露台上沒有人，總是靜悄悄的。以前曾經很熱鬧，但自從第一校舍建了日光室後，大家都聚在那裡。裝了防紫外線玻璃天花板的日光室不受天氣影響，也不怕被曬黑，當然更受女生的歡迎。


    我總是眺望校園旁的小教堂。那是一座老舊的木造教堂，三角形的屋頂上豎著十字架。可以容納全校學生的大教堂稱為新教堂，那裡稱為舊教堂。每天早上和放學前班會時，大家都在教室內唸〈主禱文〉，但上宗教課時，就會去舊教堂聽修女傳教，唱聖歌。舊教堂內只有粗糙的木頭長椅、走音的風琴，和掛在祭壇上，油漆已經剝落的耶穌基督受難像。


    每次走進舊教堂，就覺得心情格外平靜。當初是天主教的修女在戰後來到日本，希望在天主教精神的基礎上推廣女子教育，所以創立了這所學校。聖母女子學院實施從小學到短期大學的一貫教育，校舍和附設的修道院都已建造多年，但很難想像在日本可以看到這麼漂亮的建築。十年前新建的新教堂的入口有一座優美的聖母瑪利亞像，祭壇背後是著名的天主教徒藝術家設計的花窗玻璃，在校園內也呈現出傲視群倫的美麗，令人刮目相看。相較之下，舊教堂沒有任何華麗的裝飾，整體'
