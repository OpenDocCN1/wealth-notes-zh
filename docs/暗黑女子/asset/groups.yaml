    那個腳步聲到底是誰？

    當時真的慌了手腳，但學姊死了之後，這件事也成為美好的回憶。當時，我作夢都沒有想到，逸美學姊會在幾個星期後離開人世。


    復活節活動的最後一個節日是領聖餐。

    送走來自校外的客人和家長，清掃完畢後，在新教堂領聖餐。雖然全校的學生都集中在新教堂，但只有受過洗禮的學生才能實際參加。牧師站在耶穌受難像下方，學生聚集在牧師周圍，領取麵包和葡萄酒。


    「這是耶穌捨給妳的身體。」

    「阿門。」

    「這是耶穌捨給妳的血。」

    「阿門。」


    每次把麵包放在舌頭上，用小杯子喝酒時，我都充滿嚴肅的心情。這個儀式從最後的晚餐流傳至今，代表已經持續了兩千年，就連我也能充分理解其中的份量，不由得肅然起敬。兩千年的歲月幾乎是永遠。


    平時總是由逸美學姊在這個時候朗讀聖經，但那天由小百合學姊代替她走上講台。我巡視了教堂內，沒有看到逸美學姊的身影。難道是因為我剛才偷懶被人發現，害她挨罵了嗎？


