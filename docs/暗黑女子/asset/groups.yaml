    我向來對占卜或是魔咒之類的事嗤之以鼻，卻始終很在意蒂安娜的洋娃娃。我在調查之後發現，那是黑巫術中使用的巫毒洋娃娃，只要把巫毒洋娃娃當成是自己痛恨的對象加以傷害，那個人身上就會發生同樣的事，洋娃娃和當事人越像，效果'
