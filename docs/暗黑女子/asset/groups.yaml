    逸美學姊很喜歡「君影草」，自己說有點不好意思，她對這部作品讀不絕口。在沙龍舉行的讀書會上，也討論了這部作品，而且把單行本加入了沙龍的藏書中。


    在放進藏書架前，學姊對我說：「簽個名吧。」我太得意了，沒有簽在扉頁，而是在封面上簽了名，還矯情地寫上「獻給我深愛的文學社和華麗的白石逸美學姊」幾個字。


    逸美還對我說，可以隨時來沙龍寫作，令我感激不已。寫作需要任何書籍，不管是國內還是海外的書籍，逸美學姊都會立刻請人張羅；只要是採訪需要，相關費用都由社團營運費全額支出。可能有點像以前歐洲藝術家背後的贊助人角色，雖然我這麼說，可能會有的人覺得太誇張，但請各位想像一下，在哥德式建築的文學沙龍內，聽著古典音樂，用筆電寫作，不經意地抬頭時，看到右側放著熟紅茶和剛出爐的蛋糕，左側不知道什麼時候出現了請逸美學姊幫忙張羅的資料……這是多麼理想的寫作環境，讓我忍不住想起「贊助人」這個字眼。'
  md: '

    ## 黑巫術與鏡子


    我一看到照片，立刻感到不寒而慄。蒂安娜對著鏡頭微笑，熊熊燃燒的火焰映照在她的眼眸中，有一種令人生畏的氣勢。雖然她和雙胞胎的姊姊長得很像，但和她姊姊的溫和感覺完全不同。這種感覺，這種帶著妖氣的可怕感覺到底是怎麼回事？沒錯，簡直——不像是人類的感覺。


    我猛然抬起頭，和蒂安娜四目相接。蒂安娜用不同於平時的銳利眼神看著我，簡直就像被識破真相的人在威脅識破真相的人，似乎想要牽制我、捕食我。


    我們互看了很久，誰都沒有移開視線。


    我先聲明，我不相信所有不科學的事，所以，在寫以下的內容之前，我曾經猶豫到底該不該寫下去。因為我至今仍然無法相信自己親眼目睹的事，那真的是在現實中發生的？那時候，我是不是在作夢？……其實我最清楚地知道，那不是夢幻，而是真實發生的事。


    所以，我還是無法不寫下來，我親自經歷了那件不可思議的事。


    蒂安娜總是隨身攜帶一個用布包起的東西，她總是抱在胸前，連上課時也不例外，絕對不讓別人看裡面到底是什麼。她的舉動理所當然地引起了其他女生強烈的好奇心，紛紛問她裡面到底是什麼，蒂安娜總是笑而不答，不久之後，有人說：「應該是她從故鄉帶來的護身符之類的。」大家也覺得很合理，就不再關心這件事。


    我卻因為一個偶然的機會知道了裡面到底包了什麼。


    有一天，我太專心讀書，當我回過神時，發現已經天亮了。如果上床睡覺，絕對會遲到，乾脆搭頭班車去學校，在朝會之前，去保健室睡一下。請工友幫我打開校門，我走進學校時，在中庭的樹後看到一個黑色的人影。


    這麼大清早，誰在那裡？


    晨靄中，我悄悄走向那個人影。人影緩緩地、很費力地——沒錯，一瘸一拐地走着。原來是她。住在修道院內的蒂安娜這麼早出現在校園並不奇怪，於是我打算轉身走向保健室。


    就在這時，蒂安娜打開了布，從裡面拿出了不知道什麼東西。我定睛一看，是


    洋娃娃。


    原來她隨身攜帶的是洋娃娃。我對這件事產生了好奇，躡手躡腳地走去可以看清楚的位置。


    蒂安娜把洋娃娃放在樹幹上，拿出刀子，用力刺進洋娃娃的胸口。


    我驚訝不已，忍不住踮起腳想要看清楚——立刻倒吸了一口氣。


    那個洋娃娃和白石逸美長得一模一樣。


    蒂安娜對著釘在樹上的洋娃娃喃喃自語，似乎是用她的母語。昏暗的，陰鬱的聲調震饑了空氣。她一直重複相同的話，雖然我聽不懂，但語尾變得尖銳的語氣令人有一種心被撕裂般的不舒服感覺。在蒂安娜唸著咒語時，我屏息斂氣地站在那裡。不知道過了多久，蒂安娜露出了心滿意足的微笑，把刀子緩緩從洋娃娃的胸口拔了出來，再度用布包起洋娃娃，抱在胸前，一瘸一拐地走回了修道院。


    蒂安娜離開後，我仍然呆若木雞地站在原地，無法理解剛才看到的那一幕到底是怎麼一回事。


    幾個小時後，朝會開始後才姗姗來遲的白石逸美一臉蒼白。


    「妳難得遲到，怎麼了？」我問逸美。


    「我很不舒服，」逸美回答，「今天早上，胸口突然不舒服。」


    「「啊？」我懷疑自己聽錯了。


    「我慌忙去爸爸的醫院看病，醫生說沒有異狀。」


    我的腦海中浮現刺進洋娃娃胸口的刀尖，我回頭看著蒂安娜的座位，她隔著布撫摸著洋娃娃，臉上露出詭異的微笑。


    蒂安娜不知道嘀咕了什麼，就是那句語尾的聲音很尖的句子。


    我和蒂安娜四目相接。她精神抖擻，美得讓人心裡發毛，和逸美形成明顯的對比。


    好像從那次之後，逸美的身體就越來越差。


    我向來對占卜或是魔咒之類的事嗤之以鼻，卻始終很在意蒂安娜的洋娃娃。我在調查之後發現，那是黑巫術中使用的巫毒洋娃娃，只要把巫毒洋娃娃當成是自己痛恨的對象加以傷害，那個人身上就會發生同樣的事，洋娃娃和當事人越像，效果就越理想。


    蒂安娜和逸美關係很好，為什麼要做這種事？我左思右想，終於發現了其中的原因。


    因為逸美向校長和她父親建議，下次不要再邀請雷巴格拉德村的學生來日本留學了。


    這次邀請蒂安娜來留學，為學院帶來了很大的助益。學生可以直接進行國際交流，學習到媒體也很少介紹的保加利亞這個國家的生活和文化是很有意義的事，正是為此，逸美希望不要只局限於保加利亞，每年輪流邀請其他小國家的學生來日本留學。


    在這件事上，校長和白石先生全權交由逸美處理，逸美開始調查亞洲、中東和非洲的國家，正在向這些國家的大使館請教，如何才能實現邀請學生來日留學的計畫。如果這件事推動順利，蒂安娜將成為第一個，也是最後一個來自保加利亞的留學生。


    怎麼可能為了這種事——養尊處優的日本人可能會這麼想。


    保加利亞是東歐的小國家，蒂安娜住在那裡的一個貧窮小村莊，沒有大型產業，也沒有值得觀光的景點，生活水準很低。在那種環境下，受邀到日本留學有著重大的意義。蒂安娜的姊姊在旅行社打工幫助家計，之前都由她負責輪旋本學院短期留學的事宜。蒂安娜曾經滿臉喜色地告訴我，雖然她姊姊目前因為受傷正在療養，但旅行社認為日本方面日後將繼續資助當地學生到日本留學，已經決定長期雇用她，也會支付她高額的獎金。所以，留學這件事是蒂安娜一家的生命線，一旦停止邀請學生，就等於將他們推向死亡。


    蒂安娜是一個認真的少女，她一直很努力，以為只要自己在這個學院做出成果，留學制度就會持續下去，所以，在她的眼中，逸美的提議是不可原諒的背叛行為。只要逸美身體變差，和其他國家之間的交涉就會中斷，這個學院和雷巴拉德村之間的關係就會繼續──我猜想她應該這麼想。


    新綠越來越富有生命力，逸美的身體卻越來越差。


    曾經是薔薇色的臉頰日益憔悴，經常感到呼吸困難，在沙龍時，也常常躺在沙發上。她漸漸失去了生命力——這種形容完全符合逸美的狀況。我很擔心，每天為逸美把脈、量體溫，也為她測量血壓。


    有一天，我像往常一樣為逸美把脈，拿起她的手腕時，她的指甲刮到了我的手臂。


    「好痛！」


    我鬆開逸美的手，看著自己的手臂，發現有一道血痕。


    「啊喲！園子，對不起。」


    逸美滿臉歉意地撫摸著我的手臂。


    「指甲不知道什麼時候變長了，真奇怪，我前幾天才剛剪。」


    逸美的指甲的確很長很尖，她經常修剪指甲，很少會留這麼長的指甲。


    「今天又要去美甲沙龍了，真的很對不起。」


    但是，幾天後，我們又重複了相同的對話。


    「怎麼會這樣？我才去過美甲沙龍。」


    逸美不解地看著自己的指甲，嘆著氣說。


    「好奇怪，為什麼？園子，對不起。」


    「妳不必放在心上。」


    我以為逸美忘了去美甲沙龍，但不知道為什麼，我一直對這件事耿耿於懷，仔細觀察後，發現逸美的指甲真的很快就長了。


    ——不可能，一定是我想太多了。


    但是，逸美的指甲才剛修剪完沒幾天就變長了，被她刮到時很痛。我進一步仔細觀察後，發現她的頭髮也長得很快。不久之前才到肩膀的頭髮，如今已經快到腰了。


    有問題。逸美身上是不是發生了什麼不同尋常的事……


    就在我產生這個疑問的不久之後，我目擊了決定性的場景。


    那天放學後，復活節園遊會的雜務提前結束，社團也沒有開會。我收拾完東西後走出玄關，剛好看到逸美從文學沙龍走了出來。


    「逸美，我們一起回家。」


    我大聲叫著，但逸美沒有反應。難道是因為校園傳來社團活動的聲音，淹沒了我的叫聲？逸美頭也不回地走進了第二校舍。


    > 「逸美？」


    逸美沒有回頭，筆直走向那裡。我追了上去，也走進了第二校舍。


    第二校舍的光線不佳，傍晚時，走廊已經有點昏暗，只有逃生門的綠燈亮著。這裡只有理科實驗室和家庭科室等使用頻率很低的教室，平時就沒什麼人，整天靜悄悄的，但其實是因為有關鏡子的傳聞，所以學生都不太敢來第二校舍。


    鏡子──就是位在走廊盡頭的大鏡子，那不是普通的鏡子。這所學院在戰後不久創立時，英國的姊妹修道院贈送了這面高兩點五公尺，寬一點五公尺的巨大鏡子，上面用蝕刻的方式刻了新約哥林多前書的十三章十二節的內容。


    「我們如今彷彿對著鏡子觀看，模糊不清。

    但是到那時就要面對面了。

    我如今所知道的有限，

    但是到那時就全知道，如同主知道我一樣。」


    每一所學校都有所謂的「七大不可思議」靈異傳聞，這個學院的很多靈異傳聞，都是關於這面神秘的大鏡子。因為這句聖句的關係，所以流傳著「晚上站在鏡子前，就可以看到前世」，或是「可以看到自己真實的樣子」和「可以看到自己的臨終」之類的傳聞。


    雖然有些學生害怕，但也有不少學生站在鏡子前，想要占卜一下，曾經有學生得意地吹噓：「我的前世是戰國時代的尼僧。」也許逸美也對占卜有興趣，所以去看鏡子嗎？


    逸美在走廊上轉了彎，她穿著室內鞋走在塑膠地板上發出的嘰、嘰聲漸漸遠去。我也跟著在走廊轉了彎。


    沒想到——


    逸美竟然不見了。


    眼前的大鏡子中，只有一臉茫然的我而已。那裡是死角，除了從我剛才走來的方向往回走以外，根本出不去，但逸美竟然不見了，簡直就像被鏡子吸了進去。


    我絕對沒有看錯，也不是在作夢。我親眼看見逸美的身影，也聽到了她的腳步聲，所以才會追到這裡。


    我向來不相信非科學或是超自然的現象，但是，逸美消失了，這是不容爭辯的事實。


    我只能承認，逸美身上的確發生了什麼事，而且一定和蒂安娜有關，蒂安娜身上的那股黑暗的妖氣……


    不久之後，逸美住院了。肺炎——是胸腔出了毛病。


    出院之後，逸美的身體似乎恢復了，但會突然露出陰鬱的表情，感覺好像渾身帶刺。


    果然已經不是以前的逸美了──


    直到復活節園遊會當天，都始終無法抹去這種感覺。我從一大早就開始在校園內奔波，忙著最後的準備工作。好不容易藏好了所有的彩蛋，讓小孩子都拿著籃子開始找彩蛋，看到客人紛紛走進校門，才終於有時間停下來喘氣。


    到目前為止，算是成功了。我鬆了一口氣，開始尋找逸美的身影，因為逸美將在晚一點舉行的彌撒中，去教堂讀聖經。


    「逸美，可不可以請妳跟我一起去測試麥克風？」


    我看到逸美坐在花園旁發呆，立刻問她這件事。花園內，鈴蘭在五彩繽紛的花草中搖曳著。


    「測試麥克風？為什麼？」


    「朗讀聖經，不是每年都由妳負責嗎？」


    「喔……對喔。」


    逸美搖搖晃晃地站了起來，但是向教堂時，她的表情越來越緊張，腳步也越來越沉重。


    「……我還是做不到。」逸美的聲音發抖。


    「啊？」


    「我不去教堂，很可怕。」


    「逸美，妳在說什麼啊。」


    我以爲她在開玩笑，所以拉住她的手。


    「不要！」


    她用﹏，扭彎身體，甩開了我的手，然後抱著頭，渾身發抖。


    「我真的是不能去，我不想讀聖經。」


    「為什麼？妳不是每次都﹏，十字架前為大家朗讀嗎？」


    「十字架！」


    逸美頓時臉色發白。


    「我不想看到十字架，不好意思，請妳找別人代替。」


    我來不及制止，逸美就跑走了。


    為什麼她害怕教堂、聖經和十字架？我百思不解，獨自走進了教堂，看到眼前的掛畫。畏懼上帝的惡魔及其僕人。惡魔的僕人……和蒂安娜長得一模一樣的美麗女人。


    我有一種不祥的預感，衝出了教堂，不見逸美的身影。我在學校內四處尋找逸美，這時，中庭的舞臺上正在宣佈找彩蛋遊戲的冠軍，擠滿了很多人。我撥開人群，在教室、文學沙龍和校園內四處尋找，到處不見她的蹤影，只剩下──體育館。我準備跑向體育館時，剛好看到蒂安娜抱著逸美從體育館後方走了出來。


    「逸美！」


    我慌忙跑過去，逸美顯得渾身無力。


    「妳對逸美做了什麼？！」


    「我？我什麼都沒做。」蒂安娜冷靜地回答。


    「那為什麼——


    我的話還沒說完，就發現逸美的脖子下有淡淡的紅色痕跡。


    ——血？拉彌亞。巫婆。吸血鬼。惡魔的僕人……這些可怕的字眼在腦海中盤旋，蒂安娜用自己的開襟衫披在逸美身上，似乎想要擋住我的視線。


    「逸美好像不太舒服，我帶她去沙龍休息。逸美，現在沒事了。」


    蒂安娜輕聲細語地說完，扶著逸美走向沙龍。


    我覺得當時的情景簡直就像是惡魔的僕人把屍體搬去冥府。


    幾個星期後，逸美死了。


    當我在慘叫聲中看到逸美的屍體時，除了感到極大的震撼，更感到一切都有了合理的解釋。原來是這麼一回事。蒂安娜用自己的魔力控制了逸美，随心所欲地操控她，最終讓她自殺身亡。我看著逸美手上的鈴蘭花，看著來自鈴蘭花綻放村莊的東歐美少女。周圍的學生都哭成了淚人兒，只有她露出心滿意足的微笑。


    以上就是我目擊的一連串情況，我知道這些事聽起來很不真實，但是，我可以發誓，這是我親眼目睹的事實。


    所以，將這些事實歸納後如下。


    - **WHEN**：七月X日放學後

    - **WHO**：留學生蒂安娜・德秋貝

    - **WHOM**：白石逸美

    - **WHERE**：聖母女學院高中部 新館校舍的露台

    - **HOW**：使用魔力

    - **WHAT**：讓逸美跳樓

    - **WHY**：為了保護家鄉和家人


    也許妳們難以相信，但是，以上就是這起事件的真相，千真萬確。


    以上


    ![](img/fc9134ef7a363a71943cf087a8f5aed8_180_0.png)


    園子，謝謝妳的朗讀。


    之前，妳在社團活動中都只有閱讀和評論而已，從來沒有自己寫過詩或是小說。這是值得紀念的、古賀園子的處女作嗎？不愧是讀理科的學生，條理很清晰。對，這當然是稱讚。


    但是——太驚訝了。


    妳剛才說，逸美的頭髮和指甲長得很快嗎？她在走廊上消失是真的嗎？妳沒有看錯嗎？


    對，我也發現逸美經常站在那面鏡子前。那面鏡子很大，而且聽說是半個世紀前，英國修道院贈送的，所以當然會出現類似『學校的七大不可思議』之類的靈異傳聞——但逸美竟然被吸入進鏡子，消失無蹤了？現實生活中，真的會有這種事嗎？讀理科的妳竟然會說出這麼不科學的話，我真的嚇了一大跳。


    圈子，我想向妳確認一件事，這次我雖然要求大家寫小說，但並不是寫幻想的內容。妳是否在瞭解這一點的基礎上寫了這篇小說？


    ——是嗎？所以，她的頭髮和指甲長得特別快，她害怕十字架和聖經，以及她消失都是妳親眼目睹……妳這麼主張嗎？向來對星座占卜嗤之以鼻的妳這麼主張嗎？


    真是耐人尋味。


    不，我並沒有懷疑，只是有點混亂而已，但既然妳說看到了……應該是真的。


    雷聲越來越近了，真可怕。希望我們不會被豪雨困在這裡……接下來是除了我以外的最後一位同學朗讀，高岡志夜同學，請到前面來。


    ## 6. 朗讀小說〈天空神的去勢〉


    ### 二年C班 高岡志夜


    我向來習慣用比較輕快的文體寫作，所以今天原本想用深沉的方式回憶，但重寫了好幾次，還無法消除自己獨特的風格，所以，最後還是決定用高中女生成小說作家高岡志夜的身分來寫。


    我是在中學部三年級的時候正式成為作家，至今已經整整两年了。十五歲成為作家，應該算很早吧，其實當初我只是從自己的角度，樂在其中地寫下自己想看的小說，然後投稿而已，沒想到作品出乎意料地得了獎，人生從此發生了變化。


    不是我在吹噓，我已經接到不少想要把我的作品拍成電影，以及翻譯成其他語言的洽詢，但是，我一概拒絕了。因為我深信，我的作品只有日本人看了能夠充分瞭解其中的樂趣，我也不是草草率率地用這種文體寫作，而是反映了時下女高中生的流行、特色和說話的語氣，所以，身為一個高中生，我希望同年代的人在日內國，而且是用日語閱讀我的小說，理解我的小說，拍成電影或是翻譯成其他語言都稱不上是正道！以後我也無意授權，我認為這是冒瀆我的作品。這是我身為作家的堅持。


    在獲得文學獎之前，我在這個學院也不怎麼起眼。因為我既沒有特殊專長，功課也不是很好，沒想到我以《君影草》這部作品踏入文壇後，立刻引起了廣泛的討論，我也成為矚目的焦點。


    關於《君影草》這個名字，經常有人說，乍聽之下，會以為是艱澀的文學作品，但實際看了之後，發現一點都不艱澀，閱讀順暢，我在創作的時候，就不時提醒自己，要讓和我同齡的十幾歲的青少年很容易閱讀理解。


    故事描寫一個十五歲的女生在偶然的機會下，得知自己是養女後，找到了親生父親，進而偷偷地和父親通信。作品以父女兩人通信的形式描寫，但父親最後一封信中沒有任何文字，只有一朵壓花。因為她父親罹患重病，已經無法說話，也無法寫字，那朵壓花是他用盡最後的力氣，最後想要對女兒說的話：：：故事就此結束。


    有一次我突發奇想，假設我是養女：：：這個幻想起為我寫這個故事的契機。每個人都曾經有過這種念頭吧？於是，我決定將主人翁設定為和我一樣的、時下的年輕女生，故事自然而然地發展，一口氣寫到了最後。


    我想要透過這作品傳達家人的感情，和這份感情的重要性。現代社會中，人際關係漸漸淡薄，我希望讀者能夠藉由這部作品，瞭解人與人之間的關係多麼寶貴……好像我說得太誇張了。


    當我的作品入選輕小說業界最大的出版社主辦的文學獎時，我受寵若驚，得獎時也完全沒有真實感，只有一種心癢癢的感覺。但是，有人接收到我所傳達的訊息這件事，讓我備感驕傲。我原本就喜歡看書，只是作夢都沒有想到，自己竟然會成為作家。


    我得獎後，在學院引起了很大的轟動。校長表揚了我，電視和雜誌也都介紹了我，我很快就出名了。因為這個關係，所以我升上高中部後，白石逸美就來邀請我加入。


    逸美學姊讓高中部的文學社獲得了重生，文學社是一個封閉制的社團，只有逸美學姊認同的人才能加入。因為始終沒有逸美學姊看得上眼的學生，所以當時文學社已經復活了一年，仍然只有逸美學姊和小白學習兩個人而已。


    位在校舍別館角落的特別沙龍豪華程度無法用言語形容！我在中學部時就曾經聽說過，也是所有同學的嚮往，大家都說，即使無法加入文學社也無妨，希望有機會受邀參加那裡的茶會；也有人偷偷地從窗戶向沙龍內張望，那是一般學生可望而不可即的優雅世界。


    得到文學獎後，我暗自期待，也許有機會可以加入文學社。沒想到參加高中部的入學典禮後不久，逸美學姊和小百合前輩就親自出現在我的教室，簡直就像在作夢。


    「我看了妳的小說，太出色了，我們有沒有榮幸邀請妳加入我們的文學社？」


    當逸美學姊這麼對我說時，周圍的同學都興奮極了。白石逸美和澄川小百合的搭檔總是散發出一種讓人難以靠近的氣氛，學妹們都只敢遠遠地看著她們，因為她們太耀眼了，很怕靠得太近，眼睛會被她們灼傷。如今，她們就出現在我眼前，而且是她們主動來找我，邀請我參加文學社！我興奮不已，在班上同學的喧嘩聲中回答說：「請多關照。」和逸美學姊握手時故作鎮定，但其實我的雙腳都在發抖。而且，我雖不才，但竟然是第一個受邀加入文學社的成員，太榮幸了。


    逸美學姊當時的手很溫暖，那天直到半夜，我的心仍噗噗通通跳。


    逸美學姊很喜歡「君影草」，自己說有點不好意思，她對這部作品讀不絕口。在沙龍舉行的讀書會上，也討論了這部作品，而且把單行本加入了沙龍的藏書中。


    在放進藏書架前，學姊對我說：「簽個名吧。」我太得意了，沒有簽在扉頁，而是在封面上簽了名，還矯情地寫上「獻給我深愛的文學社和華麗的白石逸美學姊」幾個字。


    逸美還對我說，可以隨時來沙龍寫作，令我感激不已。寫作需要任何書籍，不管是國內還是海外的書籍，逸美學姊都會立刻請人張羅；只要是採訪需要，相關費用都由社團營運費全額支出。可能有點像以前歐洲藝術家背後的贊助人角色，雖然我這麼說，可能會有的人覺得太誇張，但請各位想像一下，在哥德式建築的文學沙龍內，聽著古典音樂，用筆電寫作，不經意地抬頭時，看到右側放著熟紅茶和剛出爐的蛋糕，左側不知道什麼時候出現了請逸美學姊幫忙張羅的資料……這是多麼理想的寫作環境，讓我忍不住想起「贊助人」這個字眼。

