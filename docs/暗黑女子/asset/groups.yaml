    「怎麼會有這條絲巾？」

    「那是找彩蛋前五名才能拿到的絲巾，我立刻繫上絲巾，假裝頒獎已經結束，所以在體育館後方休息。其實這是去年的，每年都有小孩子因為領不到獎品而哭鬧，所以我帶在身上，可以隨時拿來安撫他們。」

    學姊像調皮的小孩般吐了吐舌頭。

    「太好了。」

    我鬆了一口氣，這時，沙龍的門打開了，其他成員走了進來。逸美學姊向我使了一個眼色說：「這件事是我們兩個人的祕密。」然後把手指放在嘴唇前，我忍不住高興起來，大聲地說：「好！是祕密！」結果逸美學姊輕輕瞪了我一眼。


    文學社在復活節園遊會義賣磅蛋糕和餅乾（當然如數售罄）的總金額竟然高達四十二萬！扣除材料費十八萬，還有二十四萬，即使再扣除社團營運費十萬圓（學姊雖然是千金小姐，但很精明！），還可以捐十四萬。


    每個社團可以自由決定捐給任何一個弱勢團體，校方不會特別指定，因為基於自己的信念決定捐款對象也是一種學習。文學社每次都會請每個人提出建議，最後投票表決決定。大家對這次的復活節義賣的善款捐贈對象也有不同的意見，園子學姊說要捐給鄉村的醫院，二谷說要捐給老人院，逸美學姊說要捐給孤兒院。


    > 「我希望可以爲那些不幸的孩子做點事。」


    逸美學姊說。


    「有很多小孩子因爲各種原因沒有父母，我希望能夠幫助這些孩子，讓他們的日子過得稍微好一點。妳們看，有些孩子才剛出生。」「逸美學姊看著可愛的嬰兒照片，忍不住流下了眼淚。其他人都跟著流淚了，最後大家一致同意：「好啊，好啊，這次就捐給孤兒院。」「我對逸美學姊又有了新的認識，她真的是充滿愛心的人。


    蛋糕和餅乾賣得這麼好，小南茜當然功不可沒。


    即使使用相同的工具、相同的材料和相同的份量，我們做的和小茜做的味道完全不一樣，她一定具有這方面的天分，很懂得把握適當的時機。


    我有時候會偷偷叫小茜「愛麗絲」。因為穿著荷葉邊圍裙的童話少女──簡直就像是夢遊仙境的愛麗絲。


    對了，讀書會的課題圖畫書是《愛麗絲夢遊仙境》時，小茜舉辦了一場別出心裁的茶會，她做了奶油麵包和糖漿派，重現了瘋狂帽匠茶會的情景。而且，她還細心地不知道從哪裡張羅了道具，「來，妳們把這個戴起來。」一二谷戴著有紙牌圖案的士兵帽，蒂安娜戴著貓耳朵的髮箍，我戴著老鼠面具，園子學姊戴著奇怪的帽子，小百合學姊戴著兔子耳朵，逸美學姊戴著紅心皇冠。沒錯，我們分別扮成紙牌兵、柴郡貓、睡鼠、瘋狂的帽匠、白兔和紅心皇后。小茜當然是愛麗絲。


    逸美學姊故意使壞，三不五時叫著：「砍下妳的頭！」大家都大笑不已。那次茶會玩得很開心。


    對了，在那天的茶會上，我第一次看到小茜的左手腕上有一個差不多像手掌般大的紅疤。穿冬季制服時看不到，即使換夏季制服後，小茜很怕冷，總是在制服外披一件開襟衫，那天的茶會上，她穿了一件像愛麗絲的短袖洋裝。我並沒有故意盯著她手上的疤痕，但小茜慌忙把手臂藏了起來。我內心慌張起來，覺得自己做了不禮貌的事，不知如何是好。逸美學姊溫柔地撫摸著小茜的手臂，語帶憐惜地為她解圍說：「妳不必覺得丟臉，很可愛啊，看起來很像鈴蘭花，這是妳的魅力所在啊。『


    小茜聽了應該很高興，但同時也為我解了圍。因為多虧了逸美學姊這麼說，才不至於讓我顯得很失禮。逸美學姊是一個具有細膩感性的人，能夠在轉眼之間就察覺現場的氣氛，讓在場的所有人都不会感到尷尬。我再度感動不已，逸美學姊果然是一個出色的女生。


    我很喜歡小茜——但有件事一直讓我耿耿於懷。


    我忘了什麼時候……有一次聽逸美學姊說：「等我畢業後，打算關閉文學社。」我猜想這句話成為一切的起源。逸美學姊畢業就要關閉文學社，也就是只剩兩學期了。


    文學社本來就是為了逸美學姊而存在，因為有她，才會有文學沙龍。社團的成員都隱約猜到逸美學姊畢業後，文學社也會跟著關閉，但還是忍不住有點難過。聽說沙龍可能會捐給孤兒院，或是移建他處。


    沒想到向來溫柔乖巧的小茜突然站了起來，強烈反對關閉沙龍。她咄咄逼人的態度讓在場的所有人都目瞪口呆。


    「你要把這個沙龍從我們手上奪走嗎！」


    「捐贈其他的東西給孤兒院不是就好了嗎！」


    「我絕對不允許這種蠻橫的行為發生！」


    對她來說，這個廚房是她心靈的寄託。她家開的料亭因為一場火災付之一炬，原本順利進行的西餐廳計畫也因此擱置，對她來說，可以自由製作甜點和料理的這個廚房，幾乎變成了她生命的意義。這種說法絲毫沒有誇張。


    但是，逸美學姊的意志也很堅定，責備小茜說：「基督耶穌不是要求我們，愛鄰人如同愛自己嗎？』最後，沒有聽取小茜的意見，決定要關閉沙龍，並將沙龍移建他處。


    差不多就是從那個時候開始，逸美學姊每次茶會之後，都會說「身體不太舒服」。


    逸美學姊平時在沙龍總是很快活，不時隨著音樂唱歌，或是踩著舞步，這一陣子經常無力地躺在沙龍的沙發上。她說看書會頭痛，所以不再看書，在讀書會上也不再發言。小茜很勤快地為她製作有助於刺激食慾的義式燉飯和三明治——但是，逸美學姊非但沒有好起來，反而越來越憔悴。


    我越來越受不了眼前這種情況。我崇拜的逸美學姊整天委靡不振，整個校園都好像蒙上了一層灰色，一點都開心不起來，我希望逸美學姊趕快振作起來。我唯一的能力就是寫作，為了讓她心情開朗，寫了鼓勵她的詩，朗讀給她聽，但是，這種事根本無濟於事。我內心焦急不已，卻只能眼睜睜看著逸美學姊一天比一天更蒼白。


    我絞盡腦汁，最後想起逸美學姊喜歡莫札特的音樂。之前曾經在讀書會上介紹過彼得·謝弗的戲劇《阿瑪迪斯（Amadeus）》，也曾經在沙龍舉辦「特別鑑賞會」，看了這部作品改編的電影。我相信莫札特相關的音樂應該可以讓她開心起來，所以從家裡帶了卡拉揚的CD，但逸美學姊婉拒說：「不好意思，現在聽音樂也覺得很累。『


    我沒有輕言放棄，想到製作和《阿瑪迪斯》有關的甜點，或許可以讓她心情變好。那種甜點名叫「維納斯的乳頭」，莫札特的太太康斯坦茨在電影中吃這種甜點。雖然只是用白巧克力裹住白蘭地酒漬的栗子後，在頂端放一小塊巧克力片，但因為外形很可愛，曾經在法國風靡一時。


    逸美學姊雖然看起來懶洋洋的，但食慾似乎不錯，一定可以吃甜點。我覺得自己想到了好主意，忍不住興奮起來。只不過我不太會做甜點，當然要拜託小茜。


    雖然沙龍的廚房內沒有栗子，但小茜很有把握地說：「我記得有另一種用松露巧克力製作的方法，我來試看看。交給我吧！」她沒有看食譜，就俐落地動手做了起來。我佩服地在一旁看了一會兒，但我笨手笨腳，完全幫不上忙，最後決定交給甜點師，自己回去客廳等待。


    走回客廳時，看到園子學姊正在為逸美學姊量血壓。我看著逸美學姊白皙的手臂，又想到了一個很棒的主點。法國的古典甜點中，有一種加了水果乾，名叫「維納斯的手臂」的蛋糕捲。如果同時端出「維納斯的乳頭」巧克力和「維納斯的手臂」蛋糕捲，一定很別致，逸美學姊一定更高興。因為這完全是為我們的女神——逸美學姊量身製作的。


    我搞不好是天才。我暗自得意起來，立刻上網查了食譜，列印出來後，衝進了食堂。


    「小茜，廚房裡有水果乾嗎？」


    或許是因為我突然推開了廚房的門，小茜嚇得渾身發抖。然後……立刻把什麼東西藏在身後。


    「志夜，妳不要嚇我好嗎？」


    小茜轉過頭時，臉上雖然帶著笑容，但她的笑容很僵硬。


    「那是什麼？」

    「啊？」

    「妳把什麼藏起來了？」

    「啊噲，妳在說什麼啊？」

    「沒有……希望是我誤會。」

    「對啊，是妳誤會了，我快做好了，妳不要打擾我，好嗎？」

    工作台上已經排放著已經成形的生巧克力。

    「好吧，那我去外面等。」

    在我走出廚房之前，小茜始終沒有把雙手從背後拿出來。我覺得有點不太對勁，不像是小茜的一貫作風。最後，我沒有把「維納斯的手臂」的食譜交給她，那天只吃了「維納斯的乳頭」。圓形的白巧克力上擠了一滴粉紅色的巧克力，看起來真的像可愛的乳房，大家都讚不絕口。逸美學姊也一如我的期待，高興地吃了起來。

    「好像只有逸美的乳頭特別大。」


    園子學姊笑著說。我之前並沒有特別注意，聽到園子學姊這麼說，發現只有逸美學姊盤子裡的巧克力上的粉紅色部分比別人小，好像是特別做了記號……


    這時，我終於發現一件事。以前都是吃蛋糕或是派這種大家一起分食的甜點，最近經常吃馬卡龍、布丁這種每人一份的甜點。也就是說——如果要在逸美學姊的甜點裡「加料」，並不是一件困難的事。


    最近逸美姊在沙龍時，經常在吃了甜點或輕食後，說身體不太舒服。而且……


    今年的新成員二谷第一次來沙龍的那天，小茜做了瑪德蓮，第二天，二谷很不好意思地說：「因為平時很少吃這些美食，昨天回家後來不舒服，全都吐了出來。」


    我記得那天逸美學姊問二谷：「我肚子好脹，妳要不要吃？」把自己的瑪德蓮給了二谷，當時我還有點吃醋，所以記得很清楚。


    這到底是怎麼回事？——難道小茜給逸美學姊吃的東西裡加了什麼嗎？


    之後，我開始仔細觀察，結果發現小茜給逸美學姊的甜點中，都會有一些不起眼的記號，而且每次都是小茜親自裝在盤子中交給逸美學姊，逸美學姊吃了之後，

