    我並沒有親眼見到逸美死亡的瞬間，我只看到她的屍體躺在花園，以及手上握著鈴蘭花，所以，我知道不能隨便說自己的臆測，但是，逸美顯然是被人殺害，我也知道是誰殺了她。


    ——我絕對不會原諒妳，我要殺了妳。


    復活節那天聽到的叫聲至今仍然縈繞在我耳邊。


    高岡對逸美的憎惡很強烈。作家的工作很辛苦，必須從零開始，用一句一句的話語編織，建立世界觀，為紙上的人物帶來生命，安排他們戀愛、絕望、憎恨，應'
