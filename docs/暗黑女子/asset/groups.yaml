  - '[PAGE 139]


    在記錄白石逸美和她的死之前，先說明一下我和她之間的關係。


    我和白石逸美是同學，讀同一個理科班。她和我夢想都是以後想當醫生，我們相互鼓勵，有時候會競爭，希望可以考取一流大學的醫學院──白石逸美是我們的競爭對手。


    我因為兩年前去世的父親的關係，所以立志要當醫生。


    父親生前是一位優秀的醫生，以前在大學醫院工作，但他希望成為一個為社區民眾服務的家庭醫生，所以開了一家小診所。雖然小診所內並沒有最新型的醫療儀器，但父親都會閱讀每個月的學術雜誌，積極參加學會和交流會，努力不懈，隨時掌握最新的知識和技術。在行醫時，會仔細傾聽病人說話，他認為病人自己最瞭解疾病的症狀，父親會從病人的談話中發現疾病的原因，尋找治療方法。父親隨時保持「向病患學習」的態度。


    許多人趕來參加父親的葬禮。有從診所開業時，就上門就醫的爺爺，也有從讀幼稚園時第一次踏進診所，如今也會帶著讀幼稚園的兒子來看病的媽媽，還有一家'
  - '[PAGE 140]


    三代一起趕來參加——我坐在家屬席上看著長長的上香隊伍，驚訝地發現，原來父親曾經和這麼多人產生交集，也曾經治好了這麼多人的疾病。每次聽到隊伍中響起嗷泣聲，聽到他們說：「醫生，謝謝你」時，我就為父親感到驕傲。


    ——我一定要成為像父親一樣的醫生，有朝一日，我要親手打開隨著父親的去世而關閉的診所大門。


    我調整心情，在內心如此發誓。


    父親去世之後，留給我的是放滿整個書架的百科全書、各期的美國醫學雜誌，和一個舊聽診器。因為太有父親的風格，我忍不住對著這些遺物流下了淚水。


    那天之後，我開始用功讀書。雖然好幾次都想要放棄，但每次想要放棄時，就逼迫自己去醫院。我隨便找公車和電車，看到醫院就走進去參觀。看到那些為疾病所苦的人、用真摯的態度對待病患的醫療工作者，和笑著出院的病人，再度激發了我的動力。雖然靠參觀醫院來激勵自己的方法可能有點奇怪，但搞不好讀理科的女生本來就是怪胎。


    白石逸美就是一個很均衡的女生，因為她主持文學社，我以為她會讀文科，沒'
  - '[PAGE 141]


    想到升上高二後，驚訝地發現她和我讀同一個理科班。我的數學和化學不輸給任何人，古文、漢文和英語就很差，但白石逸美的這些科目也很強，可見她的右腦和左腦都很發達，真是個討厭的人。


    當然，學校還有其他優秀的學生，只不過我眼中只有白石逸美這一個競爭對手。我不想輸給她，所以每天有一大半的時間都在用功讀書，但又覺得整天讀書太無趣了，所以就在升上二年級的春天，受白石逸美之邀，參加了文學社。


    同班的澄川小百合也是這個社團的成員，也為我的加入感到高興。當時，還有一年級的高岡志夜（^），聽說她是當紅的高中生小說家，但我看了她的小說第一頁，就覺得頭痛，所以至今沒有看過她的作品。現在流行那種文體嗎？老實說，我有點無法適應。雖然我騙她說，我看了她的書），和小南茜是這個社團的成員。


    剛加入時，讀書會成為我莫大的痛苦。看書也就算了，居然要思考「主題是什麼？」、「有什麼感想？」、「作品對現代社會發出什麼呼籲？」之類的问题，而且還要在大家面前表達自己的意見，令我頭痛不已。


    「圈子，不能只說『很好看』而已。」'
  - '[PAGE 142]


    逸美經常這麼指正我。

    「但是，除了覺得很好看以外，我沒有任何感想啊。」

    我忍不住反駁。

    「不可能，任何故事都一定有主題，也一定會提出問題。」

    聽到冠冕堂皇的回答，我忍不住開玩笑問：

    「那桃太郎呢？」

    沒想到逸美竟然頭頭是道地說起「暗示了目前的現代高齡化社會、高齡分娩和少子化」、「驅鬼這種暴力解決方式的不合理」之類的論點。

    最後她終於同意，在讀書會時挑選我也看得懂的課題圖書，像是羅賓·庫克（Robin Cook）和麥可·克萊頓的醫療系文學作品，這些描寫器官移植和罕見細菌的故事很有趣，我經常熬夜看到天亮，但高岡和小南對此很有意見（尤其是小南，氣憤地說：「看這種小說，毀了讀書會之後的下午茶時間。」）。

    人類是懂得學習的動物，即使是不太感興趣的課題圖案，在看了幾本，也聽了大家的感想和分析之後，我漸漸摸索出「用這種方式看書就好」的方法。只要從一'
