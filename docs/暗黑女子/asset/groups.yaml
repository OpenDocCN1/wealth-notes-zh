    「所以，每個月一領到薪水，就有十萬圓一下子蒸發了。」


    爸爸每次在家庭餐廳的包廂席，和我們四個孩子一起吃巧克力聖代時，他都會說這句話。他說這句話時很得意，但不會擺出一副天大恩惠的樣子，也不會表現出不捨得這筆錢的態度，而是發自內心地期待不定期的親子聚會，有時候——像是賽馬贏了錢的時候——他會帶我們去高級的中餐廳，或是去吃烤肉，毫不在意兩個正在發育的弟弟食慾多麼旺盛。


    媽媽從來不在我們小孩子面前抱怨爸爸給的養育費太少，或是應該多給一點之類的話，只是默默去上班，默默照顧我們的生活起居，不上班的日子，就去接一些零工或是在家做家庭代工，日復一日地這樣過日子。'
