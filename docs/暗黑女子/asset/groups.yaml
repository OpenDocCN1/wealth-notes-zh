    的獎助生不睬不睬。


    認識逸美之後，完全改變了我以前對她的看法。她是能夠巧妙『壓拌』人際關係的人，能夠在擠壓不滿和擔憂這些氣泡的同時，充滿快樂地和其他成員混合在一起，建立恰如其分的關係。既不會過度壓抑自己而塌掉，也不會過度表現自己，導致彼此的關係出現裂痕。我以前一直以為小百合發揮了這樣的作用，沒想到逸美也扮演著緩衝的角色。也許正因爲她能夠掌握分寸，才能夠勝任社長的職務。


    某天放學後，我正在埋頭製作隔天討論會時要給大家吃的芭芭樂慕斯，所以最後才離開沙龍。在我清洗完畢，擦完工作臺，正準備離開時，發現沙發上有一本記事本。一看鱷魚的封面，我就知道是逸美的。我正想打她的手機，門打開了，逸美走了進來。


    「啊，太好了，原來在這裡。」


    她從我手上接過記事本，如獲至寶似地緊緊抱在懷裡。


    「幸好是你發現的，如果是她，搞不好又會被偷了。」'
