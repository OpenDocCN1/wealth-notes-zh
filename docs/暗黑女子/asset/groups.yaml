    # 1. 例会開幕詞及闇鍋規則説明


    社長・澄川小百合'
  - '[PAGE 6]


    歡迎各位在今晚的暴風雨前前來參加，在此表達衷心的感謝。


    這是聖母女子學院高中部文學社第一學期的最後一次例會，由社團現任社長的澄川小百合致開幕詞。請各位一邊品嚐剛才端給大家的歡迎飲料，一邊慢慢聽我說。


    雖然這是不到十名成員的小社團，沒想到今天大家都到齊了。因為燈光太暗，所以無法清楚看到各位的臉，但我知道所有的座位都坐滿了。


    ——這樣的事才剛發生不久，各位就願意來參加例會，真是萬分感謝。


    為什麼沙龍今天的燈光這麼暗？第一次參加的同學，可能會感到手足無措。不知道有沒有人事先從學姊那裡打聽了相關消息，所以帶著滿心的期待來參加？光線昏暗時，無法看到平時可以看見的東西，有一種身處另一個世界的感覺。


    我們聚集在這張黑色大理石橢圓桌旁，正上方的巴卡拉黑水晶燈平時總是燈火輝煌，今天已經把水晶燈的燈光調到最暗。在例會正式開始後，就會把水晶燈完全關掉，我手上的這根蠟燭將成為唯一的光源。


    暗黑女子————————008'
  - '[PAGE 7]


    我們的、只屬於我們的文學沙龍位在校舍別館的一樓，地毯和壁紙都是薰衣草色，對開的落地窗前垂著黑色天鵝絨厚窗簾，還有古董貓腳餐櫃，高布林織錦布沙發。因為校舍原本就是在哥德式修道院的基礎上改建的，所以和這些家具相得益彰。不知道是哪一位成員第一次受邀來這裡時，忍不住驚嘆一簡直就像走進安娜蘇的精品店！，但是，這裡不光是優美而已，佔據一整片牆的書櫃中，放滿了經過精心挑選的書籍。因為這裡是教會女子學校，只要去學校的圖書館，就可以借到很多天主教相關書籍和嚴肅題材的書，所以，這裡專門蒐集了學校圖書館所沒有的、各種領域的書籍和資料，有點像私人圖書館的感覺。光是這些書，就是我們文學社的重要財產。


    同時，這裡裝了隔音牆和隔音窗，有效隔絕來自校園的喧囂聲，讓社員可以專心閱讀和創作。所有成員可以在這裡閱讀每次的指定書籍，舉辦發表讀後感的讀書會，或是關於作家的研究發表會、自創小說的朗讀會，以及有關文學方面的討論會，我們可以在這個沙龍舉辦各種文學活動，不會受任何干擾。


    我們能夠擁有如此完美的文學沙龍，全拜前社長長白石逸美的父親所賜。兩年'
  - '[PAGE 8]


    前，修道院改建成校舍別館——剛好是逸美升上高中部的時候，他捐了一大筆款項，在一樓光線最充足的東南方位建造了這個沙龍。相信各位已經知道，白石先生是本校的董事長，對我來說，這個沙龍是無可取代的空間，我相信各位也一定和我有相同的感受。只要來到這裡，比在任何一間教室更加安心，即使在家裡看不下去的書，在這裡卻可以安心閱讀。創作的小說遲遲沒有進展時，在這裡就會文思泉湧，下筆如有神助。寒冷的季節，把沙發放在暖爐前，大家躺在沙發上，一隻手拿著熱可可，相互批評各自的創作小說；夏天時，喝著手工調製的蜂蜜檸檬汁討論文學。沒錯，這裡是屬於我們這些成員的夢想城堡。


    把燈光調暗後，整個沙龍感覺和平時很不一樣，是不是很不錯？這支蠟燭淡淡的燭光、天花板上的水晶燈，和相同造型的壁燈隱約勾勒出席位的輪廓，充滿神密莊嚴的氣氛。


    以前這張光可鑑人的桌子上，都會放著璋緻活的茶杯、剛出爐的司康餅，和散發出甜蜜芬芳的果醬，但是這些東西今天晚上都收起來了，妳們有沒有發現，黑色大理石上──放著和這個沙龍不太相稱的東西？'
  - '[PAGE 9]


    沒錯，是鍋子。是擦得一塵不染的黃褐色銅鍋。這是法國品牌S.S.F.的銅鍋。因為有新進的學生和留學生，所以容我在此詳細介紹一下今天的例會。今天的例會將以「閤鍋」的方式進行。沒錯，就是在漆黑的空間，把各自帶來的奇妙鍋料放進鍋子裡，大家一起享用。女生——尤其是本校的女學生可能不太熟悉這種方式，總之，每年在放假之前的例會時一起吃閤鍋是文學社傳承多年的傳統。


    什麼？


    當初為什麼會開始舉辦閤鍋會？


    嗯……因為這個社團歷史悠久，所以關於這個傳統有多種不同的說法。有人說，起初只是因為好玩，久而久之就固定了下來。也有的人說，因為平時整天吃一些高價位的美食，所以基於好奇心，想試試奇特的東西——但我認為培養敏銳的感覺是最可信、也最讓人認同的說法。


    身處黑暗中，不是會讓五感變得更敏銳嗎？


    燈光理所當然地存在於現代生活中，在消除燈光後，做平常的事……於是，就可以從普通的行為中，體會到不同的味道。不要只仰賴視覺——對有志於文學的人'
  - '[PAGE 10]


    來說，這是非常重要的事。各位是不是也有同感？所以，我最喜歡這種說法。


    比方說，各位目前品嘗的雞尾酒，在光線這麼昏暗的地方喝，是不是有一種奇妙的感覺？不知道雞尾酒的顏色是紅是綠，不知道加了什麼做爲點綴，是苦是甜？是很濃醇，還是很清爽？在不瞭解這些資訊的情況下喝這杯雞尾酒，不是需要很大的勇氣嗎？啊啊，各位不用擔心，遊戲規則規定，飲料中只能加飲料中所使用的材料，因爲這畢竟是女生的聚會，飲料當然要好喝才行啊。但如果換成不知道加了什麼東西的火鍋……吃起來就有點恐怖吧？


    當視覺被剝奪後，嗅覺、味覺、聽覺和觸覺會有什麼反應？磨練五感、背叛五感，然後釋放五感，我認爲這才是這場闖鍋會的目的。


    接下來，由我來說明一下闖鍋的規則。


    首先，各位帶來了各自喜歡的火鍋料了吧？雖然基本上規定必須是食物，但我們的闖鍋會取消了這項規定，即使不是食物也沒有關係。啊哈哈，這也是我們的闖鍋與眾不同的地方，但不可以是鞋子或是昆蟲這種不衛生的東西，希望各位牢記這'
  - '[PAGE 11]


    是女生的聚會。

    無論是哪裡的鬧鍋會都嚴格規定「嚴禁爆雷」。各位帶來的東西應該都放在不被其他人看到的容器中，放進沙龍附屬的廚房冰箱內了吧？只有身為「鍋管事」的我才能把火鍋料放進鍋內，大家只能帶著緊張的心情品嘗鍋子裡煮出來的東西。


    我忘了是哪一次鬧鍋會……真的被草莓大福害慘了。從頭到尾都甜死人了，進去之後，整鍋都黏糊糊的，連豆沙都溶化在湯裡，撈都撈不出來……今天該不會也有人帶來？沒關係，因為我們規定任何火鍋料都不拘。


    我還想起有一次在鍋子裡撈到了香奈兒手錶。因為在黑暗中，一開始只知道是手錶，而且遊戲規則規定，在吃完自己撈到的東西之前，不可以再撈其他東西，所以，那個人完全沒辦法吃其他東西，一直抱怨連連。吃完鬧鍋後，又吃了烏龍麵和鹹粥，打開燈之後……發現竟然是香奈兒手錶，而且是限量款，引起一陣喧嘩。在吃火鍋時一直偷笑，還說那個人很可憐的其他女生紛紛露出羨慕的眼神。那只手錶有防水設計，卻被高溫燒壞了，所以花了不少錢去修理，但畢竟是很難買到的限量款，只要花點修理費就可以得到，算是很便宜啦。'
  - '[PAGE 12]


    # 不可支


    那個幸運的女生是誰……啊，我想起來了，沒錯，我記得是逸美。逸美當時


    ——對不起，我又不知不覺聊到她了。我無意讓各位難過……真的很抱歉。


    下一項規則——啊啾啊啾，第一次來參加的同學請不要害怕。雖然也曾經有超難吃的時候，但最後都會為大家準備美味的甜點。既然是女生的聚會，當然需要有


    好喝的飲料和美味的甜點啊，對不對？


    闇鍋會的甜點必須由社長親自製作，這是多年來的規定。我從今天早上就開始卯足全力，使出了我的拿手絕活。去年是法式焦糖布丁、蜂蜜烤布丁和草莓芭芭樂


    慕斯。至於今天……呵呵，謎底要等最後才揭曉。


    雖然草莓大福很讓人傷腦筋，但哈密瓜口味的澀冰糖漿更慘。整鍋湯都變得黏糊糊的，散發出化學香精的味道，結束之後，打開燈一看，發現舌頭都被染綠了


    ……啊，只要回想起當時的味道，全身都會起雞皮疙瘩。我每年都會提心吊膽，不知道今年會不會有人帶這類東西。


    沒錯，還有另一項規定。即使在今天的闇鍋會結束之後，也絕對不能向別人透


    暗黑女子 014'
  - '[PAGE 13]


    露各自帶了什麼東西，更不可以相互試探，不然會知道每次的花樣，就失去了這個遊戲的樂趣。


    也曾經有人帶來很棒的東西，至今為止，最受歡迎的就是燕窩。燕窩有美容效果，富含礦物質，口感也很棒，是很受女生歡迎的食材，應該是歷屆闖鍋會中最受歡迎的。魚翅也因爲富含膠原蛋白而受到大家的喜愛，真希望今年也有人帶來有益美容的食材。


    對了


    今晚大家應該沒忘記帶來另一樣重要的東西吧？


    沒錯，就是短篇小說。


    闖鍋會是我們文學社的主要活動，請每位會員在參加之前寫一篇小說，在享受火鍋的同時，傾聽每個人朗讀各自的小說。各位應該都寫好了吧？


    黑暗中，只聽到別人朗讀的故事。在視覺被剝奪，被五感背叛的同時，用心感受各自創作的小說，這不是最理想的舞台設定嗎？這正是每次例會的精髓，所以，'
  - '[PAGE 14]


    這項傳統才會持續這麼多年。


    之前的小說題目都請各自任意發揮，但這次因為發生了那件事，所以由我決定主題。因為要寫規定的主題，而且這次還有時間的限制，我知道的確有相當的難度，但這在創作上也是很重要的訓練，希望各位用積極的態度看待這件事。


    ——沒錯，這次的主題就是前社長白石逸美的死。


    我和逸美從讀小學時就認識了，我們是好朋友，每天形影不離，我至今仍然難以相信她已經離開了人世。


    別人經常說，我和逸美的個性完全相反。逸美個性積極，對所有的事都黑白分明。我天生體質很弱，所以總是躲在逸美的背後，也很不起眼。


    各位不覺得我們這種年紀的人，在結交朋友時很兩極化嗎？不是個性相似的人強烈地相互吸引或是相互痛恨，要不然就是完全相反的人強烈地相互吸引或相互痛恨，並不存在中間的灰色地帶。長大以後，或許可以巧妙地控制這種想法，培養所謂的處世技巧，不管彼此是否相似，不管彼此是否合得來，都可以聰明地在社會上生存。'
  - '[PAGE 15]


    但是，我們這個年紀的人無法這樣聰明处世，因為對我們而言，自己的感性和感情是世界上最重要的事，必須不惜一切代價加以維護。所以，不是抹殺自我，就是自我遭刳殺——女生的友情總是拚得妳死我活，是賭上性命的生存戰。尤其在女子學校更是如此，各位同意嗎？


    從這個角度來說，逸美是我的最佳良伴。她彌補了我所有不擅長的部分，我們不需要抹殺彼此的自我，能夠建立一種相輔相成的關係。當我說很想去當義工，但不敢一個人去參加時，她就和我一起報名參加；當我猶豫該不該去參加短期留學時，她在背後推了我一把；當我說很怕課堂上的辯論時，她就自願陪我練習。當然，我也可以驕傲地說，我是逸美的最佳良伴。逸美不擅長的瑣碎事——像是這個社團舉辦活動的企畫、住宿的聯絡工作或是場地的實地勘察，或是志願校友的調查，都是由我幫她完成的……我們兩個人真的好像一個人。逸美經常對我說：「小百合，如果沒有妳，我不知道該怎麼辦才好。」「我也有同感，如果沒有逸美，我恐怕會錯過很多事。


    社團指導老師北條老師曾經說，逸美和我的關係「簡直就像太陽和月亮」。最'
  - '[PAGE 16]


    初聽到時，我覺得北條老師是堂堂的國語老師，竟然只能說出這麼乏善可陳的比喻，但失去逸美之後，我終於發現，逸美的確是我的太陽，沒有逸美，我無法發光。正因為有逸美，才會有我的存在。


    所以，失去逸美之後……我覺得好像失去了一半的身體……就連走路時都很難保持平衡。如今，我每天都過著這種生活。


    逸美為什麼會死……？


    我至今仍然無法瞭解其中的原因。


    她去世才一個星期，至今仍然難以相信。我相信妳們也一樣吧？這也難怪，個性那麼開朗的逸美……最後竟然會那樣……


    ——對不起，我不該流淚。


    什麼？


    嗯，我當然知道，外面議論紛紛，說我們文學社的某個成員殺了逸美。問我相不相信？嗯……怎麼說呢……'
  - '[PAGE 17]


    到底是自殺還是他殺——至今連這件事都還沒有釐清啊。


    沒錯，逸美的死充滿疑問。各位應該也知道吧？我們無法參加她的葬禮，也不知道她到底發生了什麼事。逸美的父親、母親，跟她的弟弟和樹都三緘其口……


    她滿身是血倒地的樣子至今仍然會出現在我的夢中——


    各位都在當時的現場看到了逸美的屍體吧？逸美為什麼會死在校園內？為什麼會倒在露台下方的花園？為什麼死的時候會握著那樣東西？逸美到底想要傳達什麼……？


    這一個星期以來，我每天都在思考這些問題。


    所以，我希望今天晚上在她所愛的這個沙龍，和在座的各位一起盡情地緬懷她。


    雖然由我主持今晚的例會，但今晚的主角當然是我們深愛的亡友，白石逸美。


    不瞞各位，我很猶豫今晚的例會到底要如期舉行還是終止，但是，這個文學社在逸美的高中生活中佔據了重要的位置，可以說，她把所有的青春都投入了這個文學社。她真心希望以後可以成為作家或是文學評論家，放學後，幾乎每天都在這個沙龍閱讀不同作家的作品，然後和其他人熱烈討論。她的父親被她對文學的熱情打'
  - '[PAGE 18]


    動，才捐贈了這個沙龍，所以，我認為與其我們各自懷念她，不如在這個沙龍，大家共同悼念她，這種悼念方式更有我們文學社的風格……相信各位也這麼認為吧？正因為你們不認為這樣的做去輕率，贊同我的做法，今天才會來參加，不是嗎？逸美也會感到高興。我對此深信不疑。


    但是，我無論如何……無論如何都想知道。


    那到底是怎麼一回事？


    所以，我才會要求這次的小說主題是各位從各自的角度來寫這件事。以逸美的死為主題的小說，是奉獻給逸美的小說。希望各位盡可能仔細回想那件不幸的事，並如實地記錄下來，和其他人分享。我相信把逸美的死昇華成小說後，就可以瞭解逸美為什麼會死，以及——凶手是否真的在其中……


    啊哦，剛才的雷聲真大。雨越下越大了，但夏天的暴風雨夜晚，不是很適合今天晚上這個活動的氣氛嗎？'
