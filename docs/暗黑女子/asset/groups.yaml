    「……伯母？」


    她是逸美的母親。


    「啊喲，是美禮啊……」


    逸美的母親臉色鐵青，完全看不到平時開朗的表情。


    「剛才上完課了，我正想回家。」


    「是喔……」


    她的眼神空洞，雙眼無法聚焦。也許她也聽到了剛才的爭執。


    我突然害怕起來，急急忙忙離開了白石家。


    之後，逸美向學校請假了幾天，據說是因為肺炎住院了。


    一個星期後，聽說逸美出院了，我興奮地去文學沙龍找她，卻不見逸美的身影。我靈機一動，急忙走去露台，發現逸美果然在那裡，懶洋洋地倚著欄杆站著。


    「白石學姊......」


    逸美轉過頭時，我覺得和平時的她判若兩人。她的臉色蒼白，眼皮微紅浮腫，臉頰看起來也很憔悴。


    「妳的身體已經好了嗎？」


    「對，託妳的福，我的呼吸系統向來都很弱。」


    她勉強擠出的笑容讓人看了心痛。


    「是不是發生什麼事了？」


    「什麼事？」


    「不，我是說妳家裡──」


    「妳為什麼這麼問？」她的語氣突然惱怒起來，我不敢說，那天在她家看到了爭執。


    「不，如果沒事就好，我只是想，會不會有什麼煩惱。」


    「煩惱......」


    逸美呆呆地看着教堂。


    「二谷：……妳是否有過曾經想要殺了誰的念頭？」


    我大驚失色。雖然每個人都應該有過這種黑色的感情，但沒想到逸美會說出口。


    逸美看到我沒說話，又繼續說：


    「我有，我想要殺了一個人。」


    她用空洞而黑暗的聲音嘟囔著，我驚訝地看著她的臉，以為自己聽錯了。風很大，呼呼地吹著。


    「只要殺了那個人，我同歸於盡也無所謂。我對那個人恨之入骨。」


    「學姊：：：感覺不像妳說的話，到底發生了什麼————


    我回想起白石先生和她之間的爭執，當時，逸美哭著被白石先生帶走——


    「我爸爸，」逸美看著遠方，喃喃地說：「有人勾引我爸爸，那個人是文學社的成員。」


    「——啊？」


    「我覺得爸爸最近很奇怪，所以就去他的書房找線索，發現了學校指定使用的手帕，當然不是我的。」


    「是喔………」


    「而且，手帕上有鈴蘭的香味。嬤蘭的鈴蘭香水——用這種香水的……不是只有一個人嗎？」


    「怎麼會？所以是——」


    「是不是很過分？我們是數理組的同班同學，我一直把她當作可敬的對手，沒想到……不知道什麼時候和我爸爸………」


    逸美用力咬著嘴脣，我第一次看到她臉上露出這樣的表情。


    「白石學姊……」


    她用可以瞬間化為凶器的銳利眼神看著前方，我有點害怕地叫了她一聲。逸美好像突然回過了神，放鬆了肩膀，轉向我的方向，露出溫和的微笑。


    「我們去沙龍吧，我泡可可亞給你喝。」


    說完，逸美抓著我的手叮嚀說：


    「這件事，妳不要告訴任何人。這是我們之間的秘密。」


    之後，我們在沙龍討論了要在六月舉行的復活節＆聖靈降臨節上賣甜點的事。


    這是同時慶祝春天的復活節和五十天後的聖靈降臨節的慈善園遊會。逸美坐在那裡發呆，由澁川小百合主持了會議。


    - 「我們每年都會賣兔兔餅乾，今年希望可以有新的創意。各位有沒有什麼好點子？」

    - 「蛋形的餅乾呢？可以在餅乾表面用糖霜畫各種圖案。」


    聽到小南的提議，高岡舉起了手。


    - 「好主意，絕對超可愛的，我來負責畫圖案。」


    - 「那今年的餅乾就這樣決定了。另外，今年要做幾條磅蛋糕？」

    - 「去年好像是兩百條。」

    - 「但一下子就賣完了。」

    - 「那今年就努力做三百條。」


    大家討論時，逸美始終看著某一點發呆，她的視線——看向了古賀園子。


    她真的和白石學姊的父親……？


    - 「那就原味、抹茶和可可亞各一百條。」


    古賀說。她在逸美的面前表現得很自然。難道她不會受到良心的譴責嗎？


    - 「好主意，那就這麼辦。對了，保加利亞也會慶祝復活節嗎？」


    小百合問蒂安娜。


    - 「會啊，我們村裡會做一個巨大的復活蛋，差不多像大人一樣高，然後塗上顏色，裝飾在村莊的中心。」

    - 「太有趣了！我也想玩，我去向執行委員會建議看看。」


    古賀說話時，逸美還是呆呆地看著她。


    - 「呃，我有一個建議，」小南舉起手，「我打算在抹茶磅蛋糕裡加大納言，妳們覺得怎麼樣？」

    - 「大納言？大納言紅豆嗎？」

    - 「對。北海道產的大納言紅豆皮太厚，我想用丹波出產的。」

    - 「聽起來很好吃。逸美，妳覺得呢？抹茶磅蛋糕的價格稍微設定得貴一點，應該沒問題吧？」


    即使小百合問她，她的視線仍然飄忽不定。


    『逸美？』


    小百合又叫了一聲，逸美突然回過神，立刻用笑容掩飾。


    『嗯，對啊……這樣很好。』


    之後，大家又興奮地討論包裝、緞帶的顏色和價格的設定問題，只有逸美露出陰鬱的眼神看向窗外。


    逸美最近悶悶不樂是有原因的，我想像自己如果身處逸美的立場，一定會受到極大的打擊。雖然每天都會見面，但她努力維持表面的平靜，內心一定很痛苦，而且，對方並不知道逸美已經察覺了這件事。


    我曾經好幾次想告訴小百合，但最後還是作罷了。有時候正因為是好朋友，反而說不出口，所以逸美叮囑我不要告訴別人。我內心很焦急，卻還是決定為她保密。


    幾天後，逸美在放學時找我去沙龍。當時只有逸美一個人在沙龍，她躺在暖爐旁，一看到我，就像迷路的小孩終於見到了母親一樣，露出鬆了一口氣的表情。


    「謝謝妳來了，請坐。我幫妳包紅茶，要不要喝洋甘菊紅茶？我想讓心情平靜一下。」


    「好啊。」


    逸美走去廚房，然後用托盤端著基諾里的茶具走了出來。蛋糕盤上放著蘋果派和香草冰淇淋。


    「這是茜教我做的，但還是無法做得像她一樣好吃。」


    逸美讓茶葉在茶壺中泡開後，倒進了茶杯。『昨天……園子好像又來我家了。』逸美果然想和我聊這件事。昨天，古賀沒有參加讀書會，我還在猜想，會不會是這樣。


    「我媽媽去做義工，弟弟參加社團活動不在家。我在讀書會結束後，急急忙忙回家了，剛好撞見園子從大門出來。」


    逸美咬牙切齒地說。


    「妳有問妳爸爸嗎？」


    「我原本想質問他，但後來想想算了，我打算找到證據後再說。上次我在書房找證據時被我爸爸發現了，他罵我不要臉。」


    「但妳要怎麼找證據？」


    「不瞞妳說，我已經裝了監視攝影機，真期待不知道會拍到什麼。」


    逸美憔悴的臉上露出笑容，但她的微笑很快就消失，哭喪著臉說：


    「我恨死園子了……」


    大滴的淚水從她的眼中流了出來。對逸美來說，那個幸福的家庭是她的歸宿，所以必定對侵門踏戶，想要破壞他們家庭的古賀恨之入骨。


    「學姊……有什麼需要我幫忙的嗎？」


    我輕輕把手放在逸美的肩膀上，她用纖細的手指擦了擦眼睛。


    「妳在為我擔心嗎？妳真善良，也許正是因為這個原因，在妳面前，我可以說出一切。我很慶幸找你傾訴。」


    然後，她目不轉睛地看著我，突然想到了什麼，拿下了戴在頭髮上的髮夾。那是一條黑色髮夾，上面鑲了五彩水晶，洛可可藝術風格的脫俗款式戴在她一頭栗色頭髮上很好看。


    「這個送你，妳戴一定很好看。」


    「啊？」


    我不敢收下，逸美把髮夾硬塞在我的手上。那個髮夾一定很昂貴。


    「我不能收下。」


    「我希望妳可以收下，紀念我們的友誼。」


    比起收到這個我根本買不起的髮飾，逸美認為我們不是學姊和學妹，而是平等的友情這件事更令我感動不已。


    「真的……要送我嗎？」


    「對啊，妳戴看看。」


    我把頭髮束在耳邊，戴上髮夾。


    「妳戴果然很好看，妳就把它當作是我，隨時戴著吧。」


    現在回想起來，這句話真的很不吉利，簡直就好像要我把這個髮夾當成遺物。而且，逸美在不久之後真的死了。


    我至今仍然懊惱不已。


    為什麼當時沒有制止逸美。古賀是一個會偷偷勾引同學父親的卑鄙小人，不難想像，一旦逸美掌握證據逼問她，她一定會不惜使用任何手段殺人滅口。


    逸美離開人世至今一個星期了。到底誰殺了她——誰都想要瞭解真相。但是我瞭解真相，把逸美從露台上推落的不是別人，就是古賀園子。


    我至今仍然可以清楚想起白石逸美的屍體橫在花圃的樣子，想起她被擔架抬走時蒼白的手，以及想起她手上握著的鈴蘭花。


    逸美一定在最後一刻，從花圃裡抓了鈴蘭的花。


    這是逸美為了告訴我誰是凶手，為了告訴我，殺害她的就是渾身散發鈴蘭香味的那個女人。


    （完）


    ## 1. 朗讀小說〈白薔薇與鈴蘭〉


    二谷美禮同學，謝謝妳的朗讀。


    第一個朗讀一定很緊張吧？而且，妳是新生，第一次參加例會。但是，我覺得妳很有膽量，很適合最先為大家朗讀，所以才安排了這樣的朗讀順序。


    直率的小說很有妳的風格。是啊，這幾個月來，逸美的確看起來心事重重。每次見到她，她都面色凝重，好像在想什麼事……來沙龍時，也經常發呆。到底發生了什麼事？我曾經多次不經意地向她打聽，她每次都露出哀傷的微笑，卻從來沒有告訴我。雖然我一直為自己是逸美的好朋友感到驕傲。


    我第一次聽說她爸爸的事，逸美從來不在我面前談論她家人。尤其她很尊敬她爸爸，她經常說，如果以後結婚，一定要嫁給像她爸爸那樣的人。在座的各位應該也曾經過多次聽到她說這句話吧？她有戀父情結，逸美的爸爸也對她疼愛不已。


    沒想到竟然會發生這種事。啊，早知道應該多關心逸美，我真的很後悔，也對自己很生氣。


    …………什麼？也許正因為是好朋友，所以反而無法聊這種事？謝謝妳這麼安慰我。是啊，也許吧。正因為是好朋友，才可能不願涉入對方的私領域。聽妳這麼說，我的心情稍微輕鬆了一點。


    不過……沒想到妳竟然對凶手指名道姓，太令人驚訝了。我知道在座的其他人一定有很多疑問，也想問很多問題，但還是先聽所有人朗讀完後再一起討論。


    妳目前戴的黑色髮夾，就是剛才提到的、逸美送給妳的髮夾吧？很漂亮，妳戴著很好看，我能夠瞭解逸美送妳禮物的心情。這個髮夾戴在妳的淺色頭髮上很好看。


    朗讀用的燭光下，可以隱約看到妳的髮夾，可不可以再讓我們多看一眼？──啊啊，是用水晶做成花卉的圖案？真漂亮。謝謝妳。


    請妳先回座。光線很暗，走路時請小心。各位用熱烈的掌聲感謝二谷美禮同學。


    各位，不知道闍鍋的味道如何？如果覺得很難吃，建議大家可以加咖喱粉或是豆瓣醬調味。很奇怪吧，在黑暗中吃東西，味覺會特別敏銳，難吃的東西變得更難吃，好吃的東西也會覺得更好吃。所以，如果闍鍋一開始的調味很難吃，那麼從頭到尾都會很慘。來，各位請多吃點。


