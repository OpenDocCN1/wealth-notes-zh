    艾瑪的留學準備工作很順利，她原本就夢想可以去世界各地旅行。申請簽證這些煩雜的手續，她也都樂在其中。「去了日本之後，我要去富士山，要親眼比較一下，是不是和維托沙山一樣漂亮。」「雖然外國人都喜歡去京都和奈良，但我對青森縣很有興趣，總覺得那裏和保加利亞很像。」她幾乎每天都在談這些事。雖然一年見不到艾瑪很難過，但是，當我想像一年之後，她會和日本之間建立更緊密的關係，就忍不住感到高興。


    但是，上天真的很會捉弄人。艾瑪帶旅行團去亞德米爾要塞時，不慎從石階上跌落下來，撞到了頭，手腳都發生了複雜性骨折。幸好沒有生命危險，只是需要住'
