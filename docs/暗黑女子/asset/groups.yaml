    在文學社度過的時光很快樂，正因為人數不多，所以大家的關係都很親密，彼此也很團結。為復活節＆聖霊降臨節製作三百個磅蛋糕時，大家分工合作，負責準備材料、計量、攪拌和清洗工作，花了三天三夜，才終於完成。


    看著整齊排在冷凍庫裡的三百條蛋糕，我備感充實。把剛烤好的磅蛋糕急速冷凍，可以鎖住風味和香氣。雖然只是學校的園遊會義賣活動，但既然收錢，就要呈現完美的作品。在製作甜點這件事上，我的自尊心很強，這個廚房滿足了我的自'
  - '[PAGE 79]


    尊，白石逸美讓我實現了夢想。


    聽著自己喜歡的音乐，在愉快地聊天的同時做蛋糕，是女生極致的美夢。而且，多虧副社長澄川小百合設定了時間表，讓我們不至於因為聊天誤了正事，完成了每天一百條蛋糕的目標。在拿工具的同時讓奶油融化，攪拌食材時將烤箱預熱，烤蛋糕時開始為之後做的蛋糕篩粉，蛋糕烤好後，立刻在表面塗上蘭姆酒，包上保鮮膜……因為小百合適時下達各種指示，一切才得以順利進行。就連自詡為甜點高手的我，聽到每天要做一百條蛋糕，也忍不住慌了手腳，不知道什麼時候該做什麼事。逸美很有魅力，也具有領導力，但缺乏像小百合那樣的細膩和計畫性。正因為有小百合的支持，逸美才能夠自在地做自己。這也是白石逸美和澄川小百合這對理想的BFF——Best
