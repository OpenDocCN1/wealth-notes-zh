    3、**当你学会了销售和收钱，不想成功都难。**刚开始，老板第一要学会的就是销售与收钱。马云最开始都是亲自一家一家的去敲企业的门做销售的。拒绝做销售的人，很难做好老板。


    4、**拒绝是成交的开始。**被 99% 的顾客拒绝都很正常，100 家里面有 1 家买你的产品，你就富可敌国了。很多人被拒绝 10 次就受不了了。销售就是零存整取的游戏，顾客每一次的拒绝都是在为你存钱，并不是说，顾客拒绝你，你的工作等于零，而是你放弃了，就等于零。


    5、**要从赢得客户信任、改变客户观点、用故事、讲利益、讲他不买会有什么损失等方面，对客户进行一个十面埋伏的营销体系。创造让顾客不可思议、不可抗拒的营销方案。**


    6、**销售是把你对产品的信心传递给顾客的一个过程**。所以，你自己必须得相信你的产品或服务值钱，用情绪去感染顾客，锻炼好身体，持续不断的说服顾客。谈判是决心的较量，你必须相信他就是会买。成交是意志力的体现。'
