    ## 1、领导者与管理者的区别


    怎么选合伙人？为什么需要选择合伙人？什么样的关系最适合做合伙人？我们可以参考一下很多优秀的大公司最初创业的时候，如微软的盖茨与艾伦、后来的鲍尔默、苹果的乔布斯与沃兹。这些人都是很早年的朋友，甚至是同学。


    中国的很多大企业都是家族血缘关系。


    为什么是这样的关系？因为做项目初期并不容易，这个过程中会遇到很多挫折与磨难，一般人不具备大的格局，很容易因为小的利益而争吵。而血缘关系即使再吵，甚至是打架，过后也多半能原谅。这样凝聚力就不会出问题，容易成功些。不过也有例外，不能原谅的就夫妻反目、兄弟成仇了。现代社会，很多人神经敏感脆弱，一点点小事都能大动肝火。如果没有什么相当长的了解，合伙人很容易散伙。


    我曾经有个合伙人，他一分钱不出，也不怎么做事，我又供他吃，又供他住，他还借我的钱花。可是居然因为一个业务出卖我，自己拿去赚钱了。说是我不为他着想，他家里逼着要钱呢，我狂犟，就这格局还能做事？事后我总结，合伙人宁愿挑不到，也绝对不乱挑，宁缺勿烂。后来，这个家伙发消息给我，有回来的意思。在外面混了一圈，发现我对他最好，并且我的事业也有了起色，还假装给我建议来指导我，我就回他两个字“谢谢”，就再也不理他了。


    我认为合伙人的性格、格局最重要。人一定要有大格局，才会做大事业，为了几个小钱能出卖兄弟的人很难混好。小肚鸡肠的人也很难混好。平常多注意一个人的细节，细节最能反映一个人的真实内心。我们为什么要寻找合作伙伴呢？因为每个人都是有限的，非常难得一个人既有领袖能力，也有管理能力，就连皇帝都要整个宰相。你可能善于谈业务，但不善于技术，或者善于设计，但不善于实现。所以要有人来做你不会的那一部分，这就是合伙人的意义。


    比如戴尔公司是两个人干起来的，戴尔与他的伙伴罗拉斯。索尼是盛田绍夫与井深大干起来的。很多公司都是两个人干起来的。如此厉害的人为什么还要整个搭档？你就不需要？因为这涉及到公司两个最重要的方面，领导者和管理者。


    领导者与管理者需要的能力是完全相反的。领导者需要一种把任何复杂问题都能极致简化的能力，而管理者恰好是要把任何简单的问题分析得透彻，且仔仔细细的人，即是管理者需要把任何简单的问题复杂化。仔细辨别自己的天性是领导者还是管理者，然后发挥自己的特长最重要。


    领导者的作用就是考察市场，看着企业内外各种复杂的情况，国际形势、行业形势，然后从复杂的各种事物中找到哪些是将来要做的，哪些事情是重点，哪些事情是马上要做的，哪些事情可以放一放。轻重缓急，在领导者这里就安得非常清晰简单。


    而管理是个实际的工作，管理者实际上做的是鸡毛蒜皮的事情，需要把各种细节运营好，才能让项目正常运转起来。战略这种事，对企业来说非常重要，但是你可能天天做吧。领导者是总设计师，管理者是建造这个企业的执行人。我们看华为，大家都知道任正非与孙亚芳，任正非管理内部事物，孙亚芳管理公关、销售等外部事物，这就是能力互补。人必须要有一个合作者，才能成大事，刘备就知道这点，到处找文臣，找到诸葛亮，武找到关张赵。


    我一般喜欢两个人合伙做事。中国人有个毛病，一上三个人，就开始三国演义，明争暗斗，很是不利于做事。仔细分析下矛盾，其实一般的矛盾，我们都可以通过双方的相互忍让得到解决。除非是那种原则性的错误，比如出卖公司利益。我建议两个人合伙的时候，无论遇到什么事情，都及时沟通，千万不要闷在心里，不闹就不闹，一闹就翻掉了。


    ## 2、合伙人应该具备哪些品质


    合伙人的选择是个非常重要的问题，虽然合伙人非常不好找，但并不意味着是个人就行。这种奠定企业文化基础的事情，还是要慎之又慎。其实开公司、做企业，对人的素质要求是相当高的。


    - 1、真诚、坦率的人。如果这个人喜欢惹是生非，喜欢搬弄是非，不管这种人能力有多强，也别让他加入。

    - 2、合伙人最好来自于同学、同事。尽要是了解的时间相当长的人，大家知根知底的。这就要求有个准备工作，也许你提前好几年，就在寻觅合适的人了。比如马云，他很多合伙人都来自于他的学生。

    - 3、相互之间有包容心。别为了些鸡毛蒜皮的事情成天斗争，小肚鸡肠是成不了大事的，走不长久。

    - 4、既然是做企业，就不在一起吹牛扯淡的。平常除了沟通工作，谈项目，还是沟通工作，谈项目。总之，只做与工作有关的事情。除非不得已联络下感情。老板的时间与精力都异常宝贵，容不得浪费。

    - 5、亲兄弟，明算账。既然在一起做事，就必须共同出资，心往一处想，劲往一处使。杜绝一个人出资，另一个人找任何借口不出资的情况。他不出钱，他就会有投机心理。看到好了，就跟你一起做下去。稍微感觉没前途，就立马开溜。其实这还不是危害最大的地方，最可恶的地方是，这种合伙人不出钱，他就不会上心，还会严重响团队的战斗力，使团队经受不住一点困难的考验。


    我刚创业的时候，由于没有经验，其中有个合伙人就是不出房租，不出饭钱。看到团队没有收人，居然跑出去找个兼职来干，而当初我居然能容忍这样脑子混乱的人跟我们一起。结果是我们出房租、饭钱，养了一个给团队增加负担的废物，这废物还不很高兴。


    既然选择当老板了，就要把各种简单的道理搞清楚。坚决不能感情用事。否则，市场会毫不留情的教育我们，不管是人际关系还是带团队，都跟打工的时候有本质区别，因为这个时候是老板了，角度不一样了，每件着不管好的坏的，你都要承担责任。


    - 6、合伙人必须是打工的时候就素质高的人。你不能期望一个打工失败者可以直接当老板。创业要求比打工更加任劳任怨，工作要求更高，活得要做更加漂亮。只有这样，才能在激烈的竞争中共出。优秀是一种习惯，失败也是一种习惯。优秀的打工者在创业的活动中，会保持优秀的习惯。失败的打工者有可能在创业的过程中睡到自然醒。这种整体素质差的人改变起来非常困难。找合伙人是找到与自己素质相当，甚至比自己素质更高的人合作，而不是找到一个低素质的人来教育培训，一般你尝试教育培养别人，最后都会成为仇人。


    ## 3、如何把人凝聚在你身边


    很多老板不知道如何才能把人团结在自己的周围，没有凝聚力，下面给出我的操作方案。


    - 1、拉高跟你一起创业人的梦想。比如他的梦想就是在上海有车有房，你要把他的梦想变成有一个亿。

    - 2、自己的梦想要包含你的伙伴的梦想。也就是说，只要你的梦想实现了，他们的梦想就能实现，这样，他们就愿意跟随你。同时，不断的强化自己的梦想，并让他们都知道，这样，还可以获得更多的人追随。

    - 3、不断的强化自己的梦想、伙伴的梦想。如果你停止强化梦想，那么大家的梦想都会消失；梦想消失，团队就要解散。

    - 4、要讲有梦想有什么好处。比如你赚到 100 个亿，可以有社会地位，可以有游艇、豪宅，可以买自己想要的任何书籍，可以让子女去读地球上最好的大学，可以让父母去新西兰生活，每个伙伴都有自己的团队，灵魂得到升华等等。也就是说，你需要把梦想实现后能得到什么好处，描绘得越具体越好，这样，大家就会铁心的跟随你。

    - 5、把自己拉到最历史上的牛人、行业里牛人的高度，甚至对团队讲，我们要一起超过这些历史上的牛人、行业里的牛人。这样能增强团队的战斗力。所以，我们经常看到牛
    B 的大富豪，都喜欢吹一个大牛，动不动就超越马云，干掉腾讯，这是有道理的，并不是别人乱讲。

    - 6、你的梦想必须明确、简单，一句话可以描述，善于记忆。比如，我对团队讲，赚一千个亿只是起步，把这个印象深深的印在团队成员的脑袋里。他们在其他地方不可能听到如此牛掰的话，他们就只能呆在我们这个团队中了。

    - 7、讲一个实的来支撑上面的精神体系，就是你必须非常拼、非常刻苦。比如我早上 5 点就起床工作到晚上 10 点，甚至 12 点，无节假日，无任何娱乐。这样，团队成员一看，慢慢的他们就真信我说的了。只要信了，你叫他们去做事，他们就会上心了。


    大家可以把我这 7 条拿去实践一下，一定会有效果的。


    ## 4、老板如何选择企业核心层


    如何选人，是所有老板最核心的工作之一。企业就是由人组成的，优秀的人多了，企业当然就厉害，一群蠢人集中在一起，也别指望做出什么好成绩。


    我选人的第一个标准是这个人有状态。积极向上，非常有活力。因为没有哪个员工喜欢死气沉沉的领导，也没有哪个顾客喜欢死气沉沉的员工。所以，死气沉沉的领导只能带来死气沉沉的员工，最后整个公司就死气沉沉的，没有活力。所以，选人第一个看人的状态是不是积极向上，非常有活力。


    老板的本领不是盯着事情做，而是调整自己的状态，把控管理层的状态。企业管理层的状态好了，业绩自然就好。


    选人的第二个标准是与这个人聊天，看这个人是喜欢讲理论，还是喜欢讲简单干脆实用的话。能做事的人说话是直接奔着具体操作、执行的方向去的。越是不中用的人，越喜欢谈论理论，半天都落不到实处。为什么他落不到实处呢？就是因为不会，会的人只需要简单讲两句，大家就知道怎么做了。不会的人才扯出来很多理论，掩饰他的无知。


    选人第三个标准是看个人是关注企业的优点，还是关注企业的缺点。选关注优点的人，因为一个企业能够发展好，不是因为他天天都在修正自己的缺点，讨论自己的缺点，而是他在不断的优化自己的优点，琢磨自己的优势。


    企业的利润是优势发挥的结果。我的优势就是读书加改变人的思想，所以，我天天就读书，然后找几个人来改变他们的思想。我甚至连团队管理都不做，因为我脾气暴躁，动不动就骂人，普通人根本受不了我这样，所以，我就培养几个人跟着我挨骂，让这些受得了我的人去做团队管理。我只管整体企业的方向与团队人员的思想问题。因为这是我的特长，所以我只是把我自己的优势发挥到极致，我做不好的地方，我压根就不去碰。结果，越做越顺手、顺心。


    ### 选人的误区。


    我问过很多老板，他们都说选人要忠诚，要有道德素质，要有能力。其实，这都是误区。


    首先讲忠诚，一个人是不可能对你的企业忠诚的。他凭啥要忠诚于你？我们可以扪心自问一下，你会忠诚于谁？人不都是为了自己，钱多就跟你混，钱少就闪人。


    要有道德？其实很多人压根没搞清楚什么是道德。我以前给一个全国最大的建材公司打工的时候，我就是经常出去给客户吹，我们的质量是全国第一，真的是第一吗？其实我自己都不清楚到底是第几。我甚至跑业务的时候，偷偷的把竞争对手的宣传册拿出去扔了，只留下我的宣传册。结果，就是我这种不道德的人，业绩最好。当老板的，你们扪心自问，业绩到底是不是靠道德做出来的？那么你为什么要求你的核心层是有道德的人？曹操、刘邦的选人标准是有道德的人吗？


    喜欢历史的可以去看一下这些成功者的选人方式。其实，最有争议的就是有能力的人。我记得马云说过，企业就是带着一帮普通人干成了一件不普通的事。他为什么不说有能力的人？其实，每个老板开始对自己做的那件事情根本就不具备什么能力，但是为什么最后能做出来？不是因为有能力，而是因为做事非常用心，天天都去想，都去琢磨，这个事情慢慢就成了，所以，也不是选有能力的人，而是选上心的人，选用心的人。


    ## 5、老板要让 自己的伙伴知道为什么这么做


    老板要习惯性的分享自己的观点、经验、知识给员工，这样，员工就知道老板想什么，方向是什么。现在的人文化水平越来越高 了，要让员工知道为什么干，而不仅仅是简单的工作。这样，员工才有主人翁精神，工作效率与质量才能提升。


    找到一件值得去做的小事，越小越好，然后坚持到底，很多人成功，靠的就是坚持！如果你有拖延的毛病，你就把事情全推给员工，规定他们多长ime完成。当然，你自己能改正这些毛病最好。很多老板喜欢与自己性格、经验，甚至行为模式相同的员工，这其实是错误的，应该雇佣能力与行为模式、性格都和自己互补的人为企业工作。


    做企业并非都要做大事，人们需要解决的小事很多，你就选择一件小事来解决。很多时候，我们认为的小事，对人们来说非常重要，是大事。而且做小事成功几率大很多。


    老板要不断地学习，你才能知道该干什么，该让团队的人干什么。能把企业做大的人，都是活到老，学到老的人，现代社会发展日新月异，学习新知识就更加重要了。多读科普杂志，多了解世界的发展方向，对抓住新趋势有好处。


    ## 6、如何建设公司的干部队伍


    与企业文化不合适，与老板思想背道而驰，牢骚多，这样的干部要下台。老板与干部接触，自己别多说话，经常让干部宣誓，比如酒桌上、平时公司的活动场所等等。让干部经常讲，为了公司拼了，愿意为老板效忠，讲得多了，他们自己就相信了。人都是活在语言系统里的。词语就是命运。


    把公司里每个干部的业绩都挂出来，每个干部的贡献都公布出来。一来是表扬做得好的干部，二来是敲打做得不好的干部。干部的权力、责任一定是一体化的，有责任必须给权利，有权利必须让他负责任。干部应该都是从优秀的一线员工里挑选出来的，拒绝凭自己的喜好弄一些没有真才实学，没有在一线干过的人来当管理者。


    一个企业的管理者，应该是具有自我培训的意识的人。一个企业的管理者不求上进，不喜欢学习，那么这个企业就会在激烈的竞争中落伍。当老板的，重要的是给干部传达一种精神，理顺干部们的逻辑思维，而不是教他们具体的业务知识，具体的业务知识是管理者们自己应该主动去强化的。


    要经常组织管理者学习公司的文件，以制度去治理公司，而不是人治。培养干部要按部就班、循序渐进，不可操之过急，十年树木，百年树人。在一个企业里，一般一个优秀的管理者，都需要老板培养三年。企业的竞争，实质上就是管理的竞争，谁的企业拥有的优秀管理者越多，谁的企业就越具有竞争力。老板就是研究人、研究干部的。而干部研究的是具体的业务，如果错位了，大家都会很痛苦。


    老板要做好自己的本职工作，就是培养干部、培养人、使用人。


    ## 7、老板要学会卸磨杀驴


    老板要学会卸磨杀驴、过河拆桥、六亲不认。所有最成功的老板都是这样玩的，而且，必须这样玩，为什么呢？因为一般人能拼命干五年，这五年，他有激情，为了买房买车、吃饱穿暖、讨老婆，很拼，但五六年过后，大部分人就干不动了。所以，成功的老板怎么搞？一旦看到第一批跟自己打江山的人状态不行了，赶紧物色新人选顶替他们，而这些新人一旦上来，为了证明自己不是个废物，就会开始拼，很有激情，也要为自己买房买车而奋斗。


    老人一看到新人业绩起来了，受到重用，他们怕自己的利益受到威胁，也会再一次鼓劲动起来拼，要不立马就会被淘汰。历史上成功的皇帝都是这个玩法，所以，宰相啦、高官啦、将军啦，几年就会换一波新人上来。想发展好，永远不能用一批人跟皇帝走20年，不同的时期必须用不同的人。员工不可能跟老板一样非常有激情，还能持续30年。所以，最厉害的公司，一定是天天招聘的，铁打的营盘流水的兵，不断淘汰激情不在的员工，把他们放到社会上去。不断吸收那些初生牛犊不怕虎的人来打江山，来开拓市场。


    除非真正核心的几个人非常有激情，不用换掉以外，其他的人，都要三五年一换。阿里巴巴就是换人非常频繁的一个企业，不管多大的官，包括 CEO 几年就换掉。华为呢，是用轮值
    CEO 的策略在做。基层就是不断放弃老人，逐步吸收新人，把新人放到重要位置上面去。这其实跟烧柴火一样，燃烧掉的木头就成了灰，需要不断的添加新的木头，火焰才会越来越旺盛，把燃烧掉的木头扔掉。


    李世民、康熙皇帝，都是用的这个策略。刘邦、朱元璋，也是用的这个策略。飞鸟尽，良弓藏，狡兔死，走狗死，敌国破，谋臣亡。不是当老板的狠心，而是你没用了，就必须把你干掉，换有用的上来。不同时期，有不同的任务，就必须上不同的人，只有这样，企业才能健康，持续的发展。尤其是高速发展的创业公司，每个人的梦想大小都不一样，但创业的时候大家走到一起了，有的伙伴就是为了买房买车、有些存款就行了。这个目标，稍微发展快点的公司，一年就实现了。没实现目标前，伙伴们很拼，一旦实现了目标，他的心思就不在工作上了，就要去吃喝玩乐了。比如，我就有个伙伴，才赚了几个小钱，但心思已经不在工作上了，到处吃喝玩乐去了，这种人必须坚决换下来，让没吃饱的饿狼顶上，企业才有发展的新动力。


    所以，我的观点是老板要一心为了企业的发展来做事，就必须要替换掉没激情的人、不能够继续拼搏的人。不管他以前功劳多大，也必须卸磨杀驴、过河拆桥、六亲不认！换上新的有激情的人、有拼搏精神的小鲜肉，否则，企业就不能发展了。


    # 第六章 人才的招用


    > 主孰有道？将孰有能？天地孰得？法令孰行？兵众孰强？士卒孰练？赏罚孰明？吾以此知胜负矣。——《孙子兵法》


    > 现在互联网经济，根本不是人越多越好，而是人越精越好。——陈昌文


    ## 1、老板必须亲自抓招聘


    很多实体小老板抱怨，现在找员工，很多人都是眼高手低，什么都不会，要手把手的教，还要发工资，感觉非常憋屈。我说，“这是你当孙子当习惯了的结果，在谁面前都喜欢当孙子！”员工不会，直接让他走人就是了，只找会的。找不到人也别急，慢慢找，有些事情急不得。


    另外，这只能说明你洗脑水平太低，所以要好好读书，学习文化知识。其实人习惯了当爷，在什么位置上都是爷；习惯了当孙子的人，当了老板也是孙子。我提倡站着挣钱，绝不跪着挣钱，跪着挣钱，钱挣到了，这个人活得也没意思。


    我们只做高利润、零成本项目，而且是引流过后，你爱买单不买单，我继续引流。我从来不当顾客是上帝，顾客只是我的服务对象罢了，你交钱，我服务你；你不买我的服务，你走你的独木桥，我过我的阳关道。这就是社群营销思维的魅力，来买单的都已经过滤好了。


    我们应该招聘什么样的人到公司里？


    ### 老板必须亲自抓招聘。


    乔布斯一辈子面试了至少 5000 人。曹操查老板也是到处招聘人才，多次发生绑架人才的父母的情况。刘备也是到处面试人。企业的竞争，本质上是人才的竞争。企业老板在每天面试的过程中是否有清晰的套路？还是大家坐到那里随便聊，聊了半天，最后对方说我考虑考虑，老板也说我考虑考虑？


    毫无章法的招聘，注定你这个企业也是毫无章法的，自己的企业也好不到哪里去！


    如果你不能用一句话清晰的总结出你要招聘的岗位需要的人才具备哪几个重要特征的，那就说明你根本不懂招聘。最厉害的老板是，跟这个人聊上两三分种，就知道结果了。就是因为讲话稳准狠，快速的获得了自己想要的信息，没有废话。


    我们招聘人，要找到真正合适的人最重要。我看在很多老板都喜欢谈高待遇，或者企业有发展前景，或者说福利好，通过这种手段把自己的企业销售给应聘者，把人先骗进企业。这就是典型的正事不谈，谈邪事，做事抓不住重点。我们千万别把人骗进企业，因为他如果不合适，干上一周，或者一个月就走了，这期间，我们做的培训、他占用公司的位置，都是对企业的损失，也耽误了应聘者的前途。


    那么怎么搞清楚企业具体岗位的工作职责、特征呢？我的做法是买一个白板，每天开会 10 分钟，把相关岗位的人组织起来，让他们讲他们的具体工作，总结他们每天的工作成果。然后把这些东西写到白板上，每天都不断的讲，不断的修改，包括他们岗位的具体工作内容，也写上去，不断的修改。基本一个月时间，就清楚这个岗位的主要特征。选三、五条重要的特征，形成文件，然后就拿着这三五条特征去面试。这样的话，就算刚进公司1天的人事主管也能清晰的知道公司要招聘什么样的人。


    不过，随着公司的发展，你这三、五条特征也要不断的更新换代。


    我们有了这些具体的东西，在面试过程中就能清楚的知道，哪些人能够很好的完成工作，哪些人只能做得一般，哪些人是不合格的。


    **其次，还要看重一个人的潜力。**


    一个人的内在品质反应一个人的潜力，具体来说，就是这个人是是否积极的。按照中国五行学说，就是这个人属是火命人，总是充满正能量。比如，你给他安排一个他没干过的事情，只要你给他方法，他就会不停的想办法，最终干好，这就是人才。而如果一个人，你一说让他去干一件他没干过的事，他就惊恐，甚至抱怨，这样的人，就是废物，别招聘到公司里。


    **再看一个人的形象。**


    我在招聘的过程中，碰到些衣服凌乱、头发凌乱，甚至脸都没洗干净的人，是直接pass掉的。一个自信、有能力的人，是非常重视自己的形象的。那种形象差，还喜欢说人不可貌相的人，简直是有病。社会中有的文化就是麻痹这些笨蛋的。让他们给自己找个别理由，他们还真上

    '
