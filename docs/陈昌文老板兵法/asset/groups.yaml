    ## 8、卖用户能获得什么利益，而不是卖你产品的特点


    很多销售员根本不知道面对客户应该讲些啥，把自己产品的一大堆特点、好处告诉客户，这种行为其实是在浪费自己的时间，也是在占用客户的时间。讲自己产品的特点与好处，全部都是废话，而且你讲得越多，用户越是迷茫，不知道你重点要讲什么。你不要讲你的价格便宜，其实用户根本不关心你便宜不便宜，他只关心能获得什么利益。便宜不便宜根本不是他购买的直接原因。


    卖一个产品，最好是告诉用户，买了这个产品，会给他带去什么改变。让他有已经买了这个产品的感觉。所以，我在很多场合讲过，卖产品是卖一种感觉给用户，但很多人听不懂这句话。我们做销售，永远要用肯定、清晰、充满朝气、充满信心的声音，将产品的好处传达给用户。


    我看到很多销售人员讲，我这个产品里含有多少维生素，是经过了多少道工序才做出来的，有什么植物精华、保湿因子。想想这些没有经过系统训练的销售员就好笑。客户根本不关心你说的这些；客户只关心你这个产品能给他带去什么利益。所以，不管我们做广告，还是面对客户讲话，我们的重心永远是客户能获得什么利益，而不是你产品怎么样。


    卖什么东西，切忌用专业术语。很多销售为了显示自己，还专门去背那些说明书上的专业术语。你讲的话客户听不懂，他肯定就不买。高手是把复杂的事情讲简单，通俗易懂；傻子是把简单的事情搞复杂。


