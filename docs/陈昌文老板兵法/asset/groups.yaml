    因为你拿得多，他拿得少（他们丝毫不考虑你的投资风险和机会成本），总认为自己多偷懒才是赚了。这种前提下，你得培养你自己的人、亲情，这些人组成了企业基本的骨架，也就是企业结构的雏形。


    做企业的过程中，你就可以向这个方向去建立你的企业结构，实践这种用人策略。


    # 8、奖励小功，则大功立；小功不奖，大功不立


    先讲一个故事，就是孔子的弟子子路在一个地方当市长。一天，天下大雨，有个小女孩落水了，子路二话不说，就跳进水里把这个小女孩救起来了。小女孩的父母知道后非常的感动，就把自己家的牛送给了子路。子路毫不客气的把牛收下了，并且杀了，把肉拿去跟着孔子一起吃。孔子一见有肉吃，边吃肉，边表扬子路干得好。这个时候，孔子的另一个弟子子贡来了，子贡是个有钱的大商人，就对孔子说，老师，你这样表扬子路是不对的，我们应该做好事不留名，怎么还要拿别人家的东西呢？子路这个道德境界太低了。


    孔子就说，你懂什么懂？如果子路拒绝别人的牛，那么以后谁还愿'
  - '[PAGE 222]


    意见又勇为，救人于危难？道德境界高的人自然是要救人的。如果有好处，那么道德境界低的人也会去救人。子路的做法，会让道德境界高的与道德境界低的人都去救人。而子贡你的做法，恐怕弄到最后，都没人去救人了。


    由此可见孔夫子是非常高明的。我想为什么现代社会，大家都怕扶老奶奶？因为有可能被老奶奶敲诈，所以出现了老奶奶摔倒，大家都上前围观也不愿意扶她起来的现象。甚至更加严重的是，现在很多人见到老奶奶，都离得远远的，就怕万一倒了，说不清楚。其实出现这种问题，就是因为榜样没有树立好。当初有几个案子，都判了扶老奶奶的人赔偿老奶奶，所以造成了现在一个社会恶果。


    这些案例跟我们做企业的关系实际是非常大的。比如，**我们在企业里，一定要对一些立小功的人奖励，那么才有人愿意不断的立功来争取更多的奖励。如果我们对小功不奖励，那么最后就没有人积极的争取立功了**。我们不但要奖励立小功的，还要宣传立小功的，让企业团队里的每一个人都有这个意识，只要我做出了成绩，就一定会受到奖励。企图靠员工境界高、不给利益也干活的老板是糊涂老板。员工立功，给了奖励，升了官，不宣传的老板是管理能力有缺陷的老板。只有告诉大家，干得好的，立了功的，都有奖励，都能升官，大家才会热火朝天的干。


    有一种老板，只知道对员工提道德境界的要求，不给员工实际奖励，企图让员工拼命给他干，这样的老板，就是脑子进水了的老板，是违背人性的。这样的老板在这个社会还不少。'
  - '[PAGE 223]


    所以大家记住：奖励小功，则大功立，小功不奖，大功不立。


    # ## 9、哪些员工是合格的，哪些员工是不合格的


    其实当员工也必须与时俱进，老思想的员工应该被淘汰。如果不淘汰这些员工，那么企业就会被社会淘汰。每一个历史时期，所用员工的标准，都有所变化。


    公司里总有一些人经常闲着无事可干，老板走过去询问原因，他就说：“您安排的事情做完了，没事啦。”这样的人每个公司都存在。他们认为，做完老板安排的事情就很不错了。然而，在现代企业里，虽然听命行事相当重要，但是个人主动进取的精神更重要。


    因为在市场经济时代，昔日那种听命行事的员工已经失去竞争优势了，你不努力工作，而有的是人没日没夜的干活，比如阿里巴巴、腾讯这些公司，真的就是晚上也在工作。这些企业非常优秀，是因为有一帮拼命的员工。当老板的，必须把员工调教到这种程度，如果一个员工不能为企业带来利益，那么必须开除。'
  - '[PAGE 224]


    今天企业需要的是那种不必老板交代，就自动自发去工作的人。


    有两种人注定一事无成，一种是除非别人要他去做，否则绝不会主动做事的人。这种员工招聘进公司了，经过一段时间的培训与改造，依旧不改变，应该开除。其实真正聪明的老板是直接不招聘这样的人进公司，不培训，因为培训也是成本。


    另外一种人则是即使别人要他做，他也做不好事情的人。这种人通常是做事不上心的人。那些不需要别人催促，就会主动去做应该做的事，而且不会半途而废的人必定成功。这种人懂得要求自己多努力一点，多付出一点，而且比别人预期的还要多，这是我们要的员工。很多老板讲，这样的员工难找，确实是我刚开始创业的时候，因为员工不好找，我的高标准就降低了，招聘了很多我不喜欢的员工。后来呢，我实在受不了他们，就一个一个的把这样的人开除了，只留下符合我心意的员工。我发现，这样公司的利润反而更高，大家在一起工作更开心。


    特别是现在互联网经济，根本不是人越多越好，而是人越精越好。曹操讲了，兵不在多而在精，将不在勇而在谋！


    曾有一段佳话，1992年，当卫哲还在上海外国语大学就读的时候，他曾到万国证券勤工俭学。他翻译的一份年报得到了万国总裁管金生的肯定，管金生表示一定要见见这个年轻人。就是这次见面，让卫哲成为了中国证券之父管金生的秘书。


    与一般秘书不同的是，卫哲工作时非常主动积极，想老板之所想，急老板之所急。刚开始管金生只是让卫哲翻译年报，剪剪报纸，这些事'
  - '[PAGE 225]


    情对于一般人来说是小事，但是卫哲却把它当成大事，做足了工夫。卫哲十分留 心在那么多的剪报中哪些是老板看过的，然后进行引导。这些 事情，老板没有要求他这么做，到后来，管金生不看剪报，中午就吃不
    下饭。


    作为秘书，卫哲要做给老板端茶倒水这样的小事，他也琢磨出很多 技巧。比如开会时，什么时候去倒茶水，才不会打断老板讲话的激情； 什么时候倒水不加茶叶，什么时候该带着茶叶进去；老板有抽烟的习
    惯，什么时候打火机里的油没了该换个打火机，卫哲都把握得很有分寸。 经过一段时间的观察，管金生认识到，如果再让卫哲做复印、倒水、剪 报等事情，就是屈才。于是，24岁的卫哲出任上海万国证券公司资产管
    理总部的副总经理，成为当时国内证券界最年轻的副总。


    如果从普通员工的角度来讲，他们喜欢说，这个世界缺乏机会，其实， 世界从来不缺乏机会。每个老板手里、银行卡里、支付宝上都有大量现金， 就是想给这些人人才，可惜很难找到这样上心的人才来赚我们的钱。从老
    板的角度来说，我们必须找到这样的人才，必须培养这样的人才。'
