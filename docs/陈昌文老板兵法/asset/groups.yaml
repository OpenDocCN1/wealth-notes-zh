    牛人，就是为了现实利益忍辱偷生的人，非常有耐心。讲到这个地方，先讲一下齐桓公为什么霸业只有 40 年，他死了齐国就没称霸了？原因很简单，齐桓公没有培养人才，只有一个管仲，还比他先死。而晋文公流浪的时候，就带着六大家臣，他当国君了，这六大家臣就成了六卿。所以，晋国后来跌倒多次，这六卿把这个国家给扶起来了。大厦将倾，独木难支。


    刘备培养了很多人才，诸葛亮只顾自己演戏，是个大蠢，所以，蜀国衰落。看曹操，文武大臣各列一俳，当然实力就最强大，可以多称霸几十年。所以，老板做企业，最应该干的是把你企业里的人才给培养出来，而不是玩独资、当戏精。玩不长久，因为你总是要死的。大凡厉害的企业家，都喜欢教育儿子，李嘉诚休假的时间，基本都带着儿子教育。国势衰退，好多都是后继无人造成的。比如秦始皇的儿子，就是傻不拉几的把江山送给项羽、刘邦了。


    《孙子兵法》这个名字，我来调侃下，实际上，一个人只要学会了该当孙子的时候当孙子，都不会混得差。刘备能起来当皇帝，也多亏前面这么多年孙子装得好，后来想装大爷，为关二哥报仇，结果自己都报销了。木秀于林，风必摧之，出头的椽子先烂。


    当老板就是要员工面前装好孙子，员工心里面就暖暖的，认为你尊敬他，给你使劲干；你要是员工面前装大爷，员工就在心里骂你是龟孙子。


    会装孙子与尊敬他人，不是素质问题，而是必须具备的能力。总而言之，打不赢就跑，识时务者为俊杰。


    ## 14、避免把最好的自己，押给最不值的对象


    人走在路上，不可避免要撞上墙。因为，有时候，墙是活的。公元前一百年，韩信撞上了一面墙。一位杀猪的堵住了韩信，提出一个小小的要求：“请钻我的裤裆。”那时的韩信穷困潦倒，穿着麻布衣服，吃饭基本靠蹭，唯一能让他挺起腰杆走路的就是他有把剑。剑是士的标志，就像马车是土大夫的标志，苹果手机曾经是小资的标配。韩信有一把剑，挂在腰上，寻找士的感觉，却没有士的钱包，很丢人。屠夫拦住他，“我看你长得高高大大，又拿着把剑，挺得瑟啊。但我看你是个胆小鬼，有本事，你抽出剑，刺我，不敢的话，就从我的裤下钻过去。”其实不只韩信遇到过这样的挑战，过了一千年，有一个叫郭威的人也被一个屠夫堵住，屠夫拉开衣服，露出肚皮：“有本事，你就捅一刀。”


    再往回倒退五百年，李渊跟表弟陪汤帝杨广吃饭，杨广说你这个阿婆面，脸怎么长得像睾丸袋。李渊去了趟洗手间，拉开裤子看了看，差点哭晕在厕所里。回到家，李渊告诉老婆窦氏，皇帝说我是阿婆面。一般的老婆有两种反应，一种是劝：忍了吧，皇帝是什么，我们惹不起。另一种是激：哎呀，他杨广就长得好看啦，弄不死他丫的。窦氏选择了第三条：恭喜啊，老公，阿婆面在我们那是皇上的意思，堂就是唐，你辈封唐国公，说明你的位置很稳啊。这么远的飞鱼，都被窦氏叼了回来。有时候，我们确实需要一点阿
    Q 精神，或者叫唾面自干。


    当屠夫堵住郭威时，郭威真的拿起杀猪刀，然后一刀捅死了杀猪的。所以，当自己是白痴时，千万不要再去刺激另一个白痴。韩信选择了弯腰，他从屠夫的胯下爬过，然后起来拍拍身上的灰，在众人的嘲笑声中走了，一路走远。当这个集市再次听到他的名字的时候，他已然成了刘邦的大将军、西汉的齐王。而郭威被抓了起来，打进了死牢。军头李继韬欣赏他，将他从牢里私放了出来。数十年后，郭威成了后周的开国皇帝，不同的应对，似乎并没有影响他们的结局。


    但真的如此吗？区别还是有的，区别是郭威把自己放到了一个巨大的不确定上，如果不是碰上伯乐李继韬，他可能早已经被处死，而韩信避免了在最无聊的事情上把自己置身于最大的不确定。如果有平行世界，我相信会有这样的场景，郭威被砍杀在菜市口。韩信同样有个版本，他刺死了屠夫，然后被抓住砍掉了脑袋。


    每一个选择都会决定我们的未来，我们要避免把最好的自己押给最不值的对象。很多年以后，韩信找到那个屠夫，屠夫提心吊胆了很久。结果韩信把他提为护军卫，还告诉他：当年，我不是怕你，而是我没有道理去杀你。如果杀了你，我不会有自己的今天。我可以把我的命押给项羽，押给刘邦，甚至是吕后，但不会押给你。


    同样，不要挥霍我们的愤怒。天下可以愤怒的东西有很多。


    社会的不公，你不愤怒；你自己没钱，你不愤怒。别人说你两句，你就愤怒了？


    同样，不要忽略每一个迎面而来的微笑。那么，当韩信愿意从屠夫胯下钻过时，他靠的是什么？是尿不湿还是护舒宝？我想应该是理智与心态。如果碰到墙，绕开就是了，不要忘了，你是有脑袋的，你知道孰轻孰重，不要跟白痴死磕。


    ## 15、老板如何管理自己的时间


    很多初刨老板，甚至稍微大一点规模的老板，成天忙得不得了，但没干几件有用的事情。干了好几年，企业依然没有发展壮大，大部分原因是没有分析自己的时间都用到哪里去了，所以，你问他要成绩，他是拿不出来的。


    那么，老板如何管理自己的时间呢？


    - 第一，只开有效的会议。


    因为开会就不能工作，工作就不能开会。同时，拒绝无关的人参加会议。部分企业老板、管理者动不动就开整体部门会议、全员会议，这绝对是浪费大家的时间。浪费时间就是浪费钱。我们开会，必须言之有物，针对特定的事、特定的人，解决具体的问题。杜绝把不相关的人也弄来开会。


    适当的会议非常必要，因为相关的人与事要彼此合作，就要彼此沟通。一个人的头脑不能解决所有问题，适当的会议作用就是集思广益。


    - 第二，老板只抓公司一个主要业务。


    其他业务全部交给公司的能人打理，老板只看结果。同时不参与其他业务的会议，让相关人员全面负责你丢给他们的业务。老板亲自抓公司的主要业务，如果主要业务盈利能力强，企业的能人自然有样学样，不差到哪里去。


    - 第三，把业务流程化、精简 化、标准化。


    让每一个新人都能看得懂，减少重复解释的时间、会议时间，内容相同的沟通尽量流程化。


    - 第四，拒绝参加不一定非要自己参加的任何形式的讨论与会议，拒绝批阅不必由自己批阅的公文。


    比如，我们公司要买一个杂物柜、一些电脑，由其他同事决定就行了，我是拒绝参与这些事情的。


    - 第五，不要把自己的时间分割成很多小段。


    分割开了的时间，等于没有时间，很难处理好一件事。我在公司里是最讨厌被琐事打扰的。一个上午有几个人找我，就会发现什么事情也没做。没人找我的话，就明显感觉主要的事情推进了很多。最好有一间自己的办公室，谁也不让他进来，你一个人在那里思考问题，拒绝被中断打扰。


    - 第六，如果你的企业里有一些人是偶尔才用一下，那么就把他解雇，通过外包的形式来做这个人的工作。因为企业有多余的人，他成天不做事，会对整个企业产生不良的影响。员工没事干，他就要去干扰其他人，无事就生非，所以，要给员工安排满事情做。


    - 第七，养成早睡早起的习惯。


    不要有晚上可以加班的思想，因为这会让你觉得白天不抓紧时间工作，晚上能补救。


    总结一下，时间是最宝贵的资源，不能利用好时间，而想做好事业就是空谈。老板就是会利用时间发财的人，同时用钱买到别人生命的人，生命就是由时间组成的。


    ## 16、如何成为一名成功的投资人


    很多老板跟我说，想成为一个投资人，却不知道该怎么办。如果你想直接成为一名投资人，除非你有足够多的空闲时间、有足够多的金钱让你去投资，吸取失败的教训，失败多了就成功了。显然，具备足够的时间与金钱的条件很难达到，除非你爹妈是超级富翁。


    一般的人要想成为一名投资人，必须先成为一名企业家。什么叫企业家？企业家与小老板的区别在什么地方？小老板就是自己带团队、做业务赚钱的人，自己离开企业，企业基本不能运作的人，叫做小老板。而企业家就是请了CEO、总裁为自己打理公司的人，企业家离开了企业，企业照样运转，而且运转得越来越好。比如，马云、史玉柱，就算离开一年以上，公司依然不会倒闭，这样的人才能叫企业家，否则，只能叫小老板。


    要想成为一个成功的投资人，你必须先成为一个企业家，企业家就是能打造一个自动运转的、盈利系统的人。在这个过程中，你实践了如何打造企业。你成为投资人的时候，你才能慧眼识珠，分辨出谁可能成为企业家而投资他，不会被一些只有激情与梦想，而没有能力的脑残欺骗了金钱。


    永远不要直接投资一个小老板与普通员工，风险太大。因为这样的人根本不能理解系统与产品之间的关系。投资这样的人回报率极低，他们很难把企业做大。很多小老板与普通员工认为自己能制作好产品就足够了，岂不知能炒好菜的厨师很多，但俏江南、海底捞只有一个。


    所以，一个成功的投资人必须先成为一个成功的企业家。成为一个企业家还有一个好处，就是你的企业不断地在给你提供现金，你可以拿这些现金不断地去投资。


    我的做法很简单，我是把钱拿来投资我的员工，我的员工当中有特别优秀的人，我就会辅助他做一个小业务，我出30%的钱，他出70%的钱，我占10%到20%的股份，并且给他一些做企业的建议，帮助他做成功。再者，我只投资我熟悉的领域，基本就是我们企业业务的上下游延伸，这样成功几率高很多。


    如果各位有心玩投资，你就会慢慢爱上这个行当，因为，这是一个钱赚钱的行当，你终于不用自己起早贪黑的操心企业里的事情，而是每年等着分红。然后游山玩水，有钱有闲，终于可以天天陪老婆孩子了，前提是你看准了人。


    投资本质上拼的是看人的眼光。


    ## 第四章 成功者的素质


    > 知彼知己者，百战不殆。——《孙子兵法》


    > 企业要想发展，很简单，要人民拥护，就必须为人民办事。——陈昌文


    ## 1、老板到底是种什么人


    老板就是喜欢折腾的人，是个拥有勤劳的双手，并且拥有活跃脑袋的人。想发挥自己的才华，不愿意甘居人下，想获得财富自由与精神自由的人。最重要的一点，他行动了。而打工仔，怕这怕那的，混点日子，在别人的企业里得过且过就行了。他们获得了暂时的安稳，牺牲掉了自己的自由意志，自己的特长也很难充分发挥，基本上也就牺牲了财富自由与精神自由的可能。


    老板是喜欢解决问题的人，是碰到问题就兴奋的人，而打工仔碰到问题就头疼，喜欢推卸责任。老板也是解决问题的人，你总是喜欢解决各种各样的问题，然后让业务正常化，让企业盈利正常化。老板也是没事找事的人，当业务都正常了，我们总是要折腾点新业务出来让大家干。


    做企业的过程中，有的人可能会失眠、迷茫，甚至想老子不干了，但却都需要咬牙坚持下去。因为创业成功的喜悦是发自内心的，会让人心灵发颤，感觉棒极了。事业成功的男人，就算你长得不很强帅，都有女人把你当男神。有狼一样的女人会喜欢你，而绵羊一样的女人跟你没有共同语言，会早早的离开你。老板的心理承受能力都很强，抹一抹眼泪，继续赶路。


    我经常见到 60、70 岁的大老板，依然精神矍铄的工作，依然没有周末，还在努力拼搏。我也见过很多穷人的孩子，他们上班的时候想着下班，想着放假，一天八小时，有四个小时拼命干活的人，都能成为企业管理级别的人物。这些打工的人，都不是发自肺腑的工作，效率极其低下，心不在焉。当老板的人，如果算出来太亏了，就让他走人。


    老板会自己给自己找工作干，而且是拼命的干，我们会发现很多老板 60、70 岁了，依旧很健康。虽然我没到那个年纪，但我成天见到 60、70 岁的老板，他们很健康，而普通人就健康不起来。我想一个是经济条件差，住房、医疗、食物都差，另一个，老板们思维活跃，普通人思维僵化。因为老板们一直在用脑，李嘉诚八九十岁了依然健步如飞，依然每天早上六点就起来工作了。


    老板追求完美的人生，想要努力去做成一件事情。实际上我经常给我的伙伴们讲的就是，如果你能把一件事做到极致，你就能发大财。而打工信，基本没机会做好一件事，因为打工信的时间是老板安排的，他的时间是碎片化的。


    ## 2、老板就是想得与普通人不一样的人


    老板是那些能够比普通人见识深的人，《孙子兵法》讲：见日月不为明目，闻雷霆不为聪耳。意思是说，你看到了太阳月亮，没什么了不起，因为普通人也能看到。你听到了打雷，不能说明你耳朵灵敏，因为大家都能听到。


    普通人开公司，或者是当领导，招聘员工，总是招聘一些不如自己的人进来，以为这样好管理。我碰到有些老板还告诉我说，怕秘密让员工知道了，他会了，就自己去干，不跟我做了。这都是小肚鸡肠的人，没有大格局，成不了大气候。比如微软公司的比尔盖茨说：“我只招比我聪明的人！”比尔盖茨经常开除一些别人看来非常优秀的人，原因就是比尔盖茨认为这个人没他聪明。所以微软把环境、文化、氛围搞得好好的！让众多比比尔盖茨还聪明的人毫无后顾之忧的在微软拼命的干，微软公司想不发迹都不行！


    这也是我现在的招聘策略，我竭尽全力 的去选择优秀的人跟我们混。


    优秀的人不需要教他，他自己会教自己，自己就能把工作做好。如果你招聘到了不优秀的人，看似节约了底薪，其实，这个人进来，你需要培训他，这就是成本。他工作也不够努力，做得也不好，这又是成本。所以，花1万块招聘一个优秀的员工，好过花5000块招聘两个差的员工。


    如果你不是开公司，而是在别人公司里打工，你吸收我的思想，对你也有好处。比如你在别人公司里做领导，心态一定要摆正，在给上级汇报工作的时候，要多提部下的功绩，要让你的上级觉得你手下的人个个都能干，随时都能接替你的工作，那么你离升职的时候就不远了。如果一个领导总说下属不如自己，其实上级就会想，是你领导无方，没有能力。那么你的位置永远都没人可以填补，你自己怎么能够晋升呢？


    所以这个世界很神奇，你给别人机会，上帝就给你机会；你断了别人的机会，上帝也不会给你机会。老板要明白企业是个生态系统，要能容纳得下各种各样的人才。不管是正规军，还是偷鸡摸狗的人，只要是能为企业创造效益，不违法的，我们都可以笼络到自己手下。其实大凡干大事的人，手下的人才总是多种多样，比如宋江手下的人才，战国四君子手下的人才，都是如此。


    企业文化兼容性越好的公司，笼络的人才越多，发展潜力就越大。


    像谷歌这样的公司，为了挖掘不同人才的潜力，会让他们在工作时间中有20%的时间是自由支配的。所以，谷歌公司发明了很多非常具有潜力的新玩意，比如无人驾驶汽车、无人直升机快递。这都是企业文化兼容好的成果。老板绝对不能小肚鸡肠，容不得沙子，只要达到企业发展、赚钱的目的就好，至于方法，完全不要去约束你的员工。


    另外，经常有老板问我学习的方法论问题，以及看什么书？我的经验是，越多越杂越好，诸葛亮经常说“观其大略”是最好的，这样就不容易陷入到死角，不容易走极端。而且最好是两种意见截然相反的书同时读！


    一个人聪明不聪明，就是看你的脑袋里能不能容纳下两种截然相反的观点，还能够正常运转。等你学会把意见完全不同的书中的内容找到相同点，并且试着从中归纳自己的判断，并形成自己的系统的时候，那就有所小成了。


    此外，我认为并非非要看书才是学习，看报、看电视剧、看广告、看世界万物，都是学习，人情练达即文章，世事洞明皆学问。学习是一个随人、随地、随时的事情，任何时候都能学习！比如去餐馆吃饭，就留意一下服务员的工作方法，看看怎么样的上菜方式是最好的，你会发现不同的服务员差别简直太大了，其实端盘子真的是有很大学问的。别人看电视都很烦广告，而我是经常看广告，有些比较好的广告真的值得好好推敲，你把那些好的广告修改修改，换成你的产品卖，你就相当于请了一个厉害的广告策划，还不花钱。

    '
  merge: 0
- raw:
  - '[PAGE 147]


    # 3、老板心态不好，就注定是个弱者


    心态决定人生。


    一位哲人说过：“你的心态就是你的主人。”在现实生活中，我们不能控制自己的遭遇，却可以控制自己的心态；我们不能改变别人，却可以改变自己。其实，人与人之间并无太大的区别，真正的区别在于心态。所以，一个人成功与否，主要取决于他的心态。社会上有很多在逆境中拼搏起来的人，都是因为心态好，心强大。弱者主要是弱在他的心态。


    生气不如争气。


    人生有顺境也有逆境，不可能处处是逆境；人生有巅峰也有谷底，不可能处处是谷底。因为顺境或巅峰而趾高气扬，因为逆境或低谷而垂头丧气，都是浅薄的人生。面对挫折，如果只是一味地抱怨、生气，那么你注定永远是个弱者。其实人生大部分都是失败，但只要抓住一次机会成功了就行了。


    有自信才能赢。'
  - '[PAGE 148]


    古往今来，许多人之所以失败，究其原因不是因为无能，而是因为不自信。自信是一种力量，更是一种动力。当你不自信的时候，你难于做好事情；当你什么也做不好时，你就更加不自信。这是一种恶性循环。若想从这种恶性循环中解脱出来，就得与失败作斗争，就得树立牢固的自信心。


    # 心动更要行动。


    生活不会因为你想做什么而给你报酬，也不会因为你知道了什么而给你报酬，而是因为你做了什么才会给你报酬。一个人的目标是从梦想开始的，一个人的幸福是从心态上把握的，而一个人的成功则是在行动中实现的。因为只有行动，才能赚回滋润你成功的食物和泉水。


    # 平常心不可少。


    人生不可能一帆风顺，有成功，也有失败；有开心，也有失落。如果我们把生活中的这些起起落落看得太重，那么生活对于我们来说永远都不会坦然，永远都没有欢笑。人生应该有所追求，但暂时得不到并不会阻碍日常生活的幸福，因此，拥有一颗平常心，是人生必不可少的润滑剂。


    # 宽容是一种智慧。


    俗话说得好：“退一步海阔天空，让几分心平气和。”这就是说人与人之间需要宽容。别人来找你这个当老板的麻烦了，你后退一步，可能付出很小的代价就解决了，而你前进一步，可能流血五步！没必要跟'
  - '[PAGE 149]


    屌丝血流五步。


    # 学会给心灵松绑。


    人的心灵是脆弱的，需要经常激励与抚慰。常常自我激励，自我表扬，会使心灵快乐无比。学会给心灵松绑，就是要给自己营造一个温馨的港湾，常常走进去为自己忙碌疲惫的心灵做做按摩，使心灵的各个零件经常得到维护和保养。


    # 别把挫折当失败。


    每个人的一生，难免都会遭受挫折和失败。所不同的是失败者总是把挫折当失败，从而使每次挫折都能够深深打击他取胜的勇气。成功者则是从不言败，在一次又一次的挫折面前，总是对自己说：“我不是失败了，而是还没有成功。”一个暂时失利的人，如果继续努力，打算赢回来，那么他今天的失利，就不是真正的失败。相反，如果他失去了再战斗的勇气，那就是真输了。


    # 避免烦恼成心病。


    在现实生活中，终日烦恼的人实际上并不是遭遇了太多的不幸，而是根源于烦恼者的内心世界。因此，当烦恼降临的时候，我们既不要怨天尤人，也不要自暴自弃，要学会给心灵松绑，从心理上调适自己，避免烦恼变成心病。


    快乐其实很简单。'
  - '[PAGE 150]


    一个会心的微笑，一次真诚的握手，一次倾心的交谈，就是一些快乐无比的事情。一切财富、名誉、地位，都是外在表象。心态才是根本，马云不是现在才成功的，他几十年前就成功了，因为他心态好。


    很多老板并不是日进斗金的时候才成功的，而是刚开始的心态就决定了他已经是个成功者了。为什么学习中国传统文化之后能够轻松获得财富？因为心态好了，人际关系就好了，也能够团结人了，也能静下心来把具体的事情干好了，想不成功都难。


    # 4、老板需要哪些技能


    首先，那些声称自己讨厌销售或者不能做好销售的老板必定失败。销售能力，是做老板的第一能力。


    如果仅仅会销售，有一个产品，勤勤恳恳的干下去，可以干成一个小老板。很多老板都停留在小老板的角色而不能前进一步成为企业家，原因是赚到钱后，不懂得培养新人，接替自己的位置。自己一直在当销售经理，而不是老板。销售产品开始要老板抓，发展到一定时候，就应该放手。放手干什么呢？开始学习运营、财务、员工管理、法律，以及薪酬管理，这是走向企业家之路。别以为企业家很悠闲，企业家实际上'
  - '[PAGE 151]


    非常辛苦，如果你想随心所欲的做事情，最好别把企业做大。


    如果你是个工作狂、学习狂、享受工作，犹如李嘉诚、比尔盖茨这样的工作狂人，那么成为一个企业家是一件美事。


    当你把我提到的这些基本能力都学会了后，注意，不 是叫你学精通，而是基本会了就行了，关键 点你能掌握，你的员工就欺骗不了你，你就可以根据市场来制定公司战略。这些都完成了，还想壮大，就开始疯狂的专研交际能力。人的本质是一切社会关系的总和。马克思讲的真理，你现在开始用得上了。


    还有最重要的一点，就是必须大方慷慨，你若只是想打工或者当个小老板，你无需大方慷慨的对待你的员工、核心成员。而如果你想做大做强，你必须让跟着你混的人一起分享你的财富，他们才会与你一起为公司着想、拼命。


    # 5、老板们要刻在脑子里的思想


    一个人要想做大事，要么把所有的心思花在组建团队身上，成为一'
  - '[PAGE 152]


    个企业的组织者；要么成为一个研究者，做自己已特别喜欢做的事情。如爱因斯坦研究物理学一样。我想对于大多数人来说，组建团队是一条容易走的路。


    人应该经常去看看那些比自己富的人住的房子、开的车子、拥有的地位，通过见识去唤起自己的野心。如果你的环境都是些很差劲的人，我建议你经常去那些富豪集中的小区里转转。大着胆子走进去，保安有时候搞不清楚你是不是业主，不会拦你，不过有些高端小区要打卡才让进，你也可以找房产中介说要买房子，然后就很进去了。


    做项目，我是不建议一开始就创新的，先找到一个你认同、又能模仿的产品或者服务，他怎么干，你就怎么干；他怎么卖，你就怎么卖，先赚到钱再说，有了钱再去想创新的事情。永远不要怕出丑，永远不要怕失败，其实每一个成功的人都经过一而再、再而三的失败才成功的，失败与出丑是必经之路。


    做为老板，想要员工听话，你自己必须先要做到。你自己没结果，说再多，大家最多表面上服从你，私下里其实觉得你没什么本事。老板必须做到让员工心服口服，这个企业才有发展前途，这就要求老板必须以身作则。你必须不断的行动，而不是只知道在那里做计划或者纸上谈兵。只要你行动，你就会感觉到快乐。不行动，慢慢的，你的项目没有推进，你的钱快要用完了，你就会感到很痛苦。'
  - '[PAGE 153]


    梦想、理想要天天讲给员工听的，听多了，员工就深信不疑了，“谎言”说一千遍就成了真理。要明白新员工不是一次就能教会的，你妈妈教你走路还教了无数次呢。多点耐心去培养员工，对于实在不能上道的员工，采取立刻开除的态度。老板在公司里姿态越低，越有影响力，大家越愿意帮你做事；姿态越高，别人越不愿意跟你混。要尊重员工。


    老板的工作能力加上工作态度，决定你的企业在市场上的竞争力。老板的工作态度更加重要，员工的工作能力更加重要。


    # 6、老板最大的财富是激情


    这个时代，有无数的传统企业家年纪 40 多了，不思进取，依然活在互联网之前的时代，依然自恋自己曾经很厉害，依然陶醉在互联网之前的成就感里，这是很危险的。我希望他们尽快进入到互联网的时代，进入到数字时代、智能时代，但这样老企业家，很难从以前熟悉的世界进入新时代。


    老企业家们不管柯达是怎么死的，也不管爱多是怎么死的，谈到微信、'
  - '[PAGE 154]


    移动互联网、互联网金融、社群营销，他们还完全处在排斥中，这是最可怕的。是抗拒时代的发展，是逆潮流的，硬生生把自己定格在落伍者的行列里。这些人为什么会这么保守？我的理解就是缺少激情。


    一个人有激情，才愿意跟着时代跑，3D打印机来了，了解3D打印机；微信来了，玩微信营销；机器人来了，玩机器人；淘宝来了，玩淘宝；智能时代来了，玩智能时代。凡是跟着时代的潮流能赚到钱的，都是非常积极的人，在大家还没感觉的时候，就投入时间、精力去研究。等到大家有感觉、醒来的时候，就抢占先机，就有钱赚。实际上，这个社会每3到5年，都有一个大机会可以让入发财。但是很少有人可以拥有激情不断的去探索。老板最最需要的就是要跟上时代，保持激情，我想，那些老企业家年轻的时候，肯定也是很有激情的年轻人，才会去创业的，结果老了，把激情弄丢了。


    一个人要想持续成功，就要保持激情，就必须跟上时代的发展，否则，就会成为柯达、爱多的下场。'
  - '[PAGE 155]


    # 7、老板最重要的能力不是做产品的能力


    很多老板喜欢讲，我有一个非常好的产品创意，我有一个很好的想法，然后就把自已全部的精カ、时间、金钱、团队，都投入到让产品落地，或者改善产品的性能与质量上去了。这个过程非常耗时间耗力，最后经过半年，甚至一年时间，做出来个产品，还没有打开市场，钱就花光了，团队也没有信心了，就散伙了。问题出在哪里？就是因为市场上最不缺的就是产品，到处都有优秀的产品，而市场上最缺的是具有推广能力、营销能力的人。只要有了推广能力、营销能力，随便找个好产品，就能卖起来。其实微软公司的windows操作系统，也不是比尔盖茨做出来的，而是比尔盖茨推广到全世界的；QQ也不是马化腾做出来的，而是马化腾把QQ推广到全中国的；华为公司的任正非，开始也是背着包去卖交换机的一个代理商，而不是交换机的生产者。


    拥有一个好产品，是做项目过程中最不重要的事情，老板最好一开始就打造一个好的营销推广团队，把营销推广团队当成重点，企业成功的几率就大多。'
  - '[PAGE 156]


    大家都知道马云是个英语老师，不懂数据库，也不懂网站建设。但这没关系，马云是一个好的营销推广人员。老板的方向对了，就容易成功；方向错了，不管你多努力，成功也很难。


    # 8、老板只做自己能力范围内的事


    你去大街上转一圈，可以说在任何失败的、奄奄一息、半死不活的生意上，都可以看见“做了能力以外的事”的影子。我经常碰到一些老板，只有100万，却以为自己很聪明，做了需要500万才能干的生意，最后资金链断裂、人才匮乏，往往是倒闭了事。虽然他们各有各的问题，具体到各自的问题上，他们遇到的问题不一样，但是我们从战略高度来看，他们的成败与他们遇到的问题、与他们的能力是无关的。能力再小的人，比如一个两岁大的孩子，你让他用手去抓薯条，他会遇到什么问题？又怎么可能失败？他一定搞得定。什么意思呢？就是老板必须做自己能搞得定的事。能力再大的人，比如马云、李小龙、爱因斯坦……全部召集起来，给他们双筷子，让他们去把没有剥壳的鸡蛋剥起来，他们怎么可能不遇到问题？又怎么可能成功？'
  - '[PAGE 157]


    如果我们去深究他们每个人失败的原因，比如爱因斯坦不善于用筷子，他应该多加练习；李小龙力气太大，把鸡蛋夹破了；马云会取巧，他把筷子反过来用方头去夹，值得学习，可惜手劲不足，功败垂成……这样去分析，从战术层面有意义，但不是我们要说的重点。因为，他们都做了他们能力以外的事情，从战略层面毫无意义。你看李小龙能碾碎2米5高的灯泡，那2米6的又如何呢？就算我们把他的能力放大十倍、一百倍，他能碾碎250米高的灯泡，那251米的又如何呢？就算我们的能力被放大十倍、一百倍，如果我们老是设立过高的目标，做自己能力以外的事，铁定是要失败的。


    严格来说，只做自己能搞定的事并不是保守，是因为很多人尤其是初次选手，都容易过高估计自己或团队的资源和能力，低估项目和市场的复杂性，寄希望于不遇到问题、不发生意外，寄希望于对手不回应、不反击……这怎么可能呢？成功的唯一可能是运气实在太好，好比横渡太平洋没遇到任何风浪。而保守一点，正好留出处理各种不可控因素的余力求。


    如果这个余力足够大，你可以迅速提高自己的目标，但是如果一开始就把自己的目标定得很高，往往耗尽自己的资源、现金。最可怕的是把自己与团队累得精疲力尽，信心也搞没了，成功就基本不可能了。


    我做企业有一个重点，就是不断招聘人才。我招聘人才并不是用他们来完成高难度的项目，而是做非常非常简单的事情。高手做简单的事情，并不是屈才与浪费。高手做简单的事情，会把简单的事情做到更加的极致，'
  - '[PAGE 158]


    直接对这个行业的其他竞争对手形成屠杀级的优势。


    就如同我以前玩《魔兽世界》一样，我喜欢杀人。我才不去杀大号呢，就算我技术好，也要经常被骗。我是组织一伙人，一起去小号练级的地方屠杀小号，这样既安全又快乐。很多人对我这种行为不耻，无所谓了，我要的是胜利，而你要的是让我去送死。其实《孙子兵法》讲过这个哲理，伟人毛泽东也讲过只打有把握的战争，这就是老板应该吸收的思想。


    # ## 9、人治还是法治


    刚开始创业的时候，肯定是人治，但是随着业务的繁忙，如果企业忙不过来了，就要招兵买马。人多了，你一个人管不过来，就要委任管理者，而要使管理者的工作有法可依，不至于按他们自己想的胡来，不至于大家心不朝一处想，力不往一处使，自然就要开始订立目标与规章制度，自然就过渡到法治了。


    水到自然渠成，企业的成长和生物的成长一样，是个过程。只要有利润，创业初期先不要考虑人治还是法治的问题。法治是规模发展起来了，'
  - '[PAGE 159]


    可以采用的手段。如果初级阶段硬要去决定人治还是法治，可能都会适得其反。


    从企业发展的角度，你需要招人；从法治的角度，你仍然需要招人。因为你 要分工的话，就得权责分明，权力和责任是同时放下去的。比如你叫我负责办公室的卫生，表面只是责任，其实权力也一块放下去了。我有什么权力？打扫办公室的权力。这意味着任何人插手我的工作的话，最后你都无法追究我的责任。所以当你把权责放下去之后，就意味着在那一块，你只剩下最牛
    X、最无奈的撇换负责人的权力，而不能轻易插手别人的工作。牛 X 在哪里？生杀大权嘛！无奈在哪里？如果你没有后备人才，你敢撤换他吗？不撤，他做不好本职工作，影响大局。撤了，得你自己去顶上，顶张三、顶李四……最后累成狗。所以说，发展到分工合作阶段，就要求你必须得有替补，而且替补的存在会让在位者有种无形的压力。也就是，内部竞争机制是由替补建立起来的。


    无论从哪个角度讲，当你有钱闲多养几个人的时候，你才能建立法治。然后，即便这样，也不是人治、法治的分割点。规则化、制度化是结果，既非目的，更不是必然手段。反正兵来将挡，遇到问题解决问题，企业发展到自己实在没有精力去管的时候，就只能借助一些规章制度。这样一天一天过去，有天你回头一看：噢！自己的企业变得像台机器一样，员工们按照规章制度和惯例工作，做得好，得到奖励；做不好，受到处罚。你不去管，他们也照常工作，这就法治了。'
  - '[PAGE 160]


    所以，创业初期是人治，随着企业发展到分工合作阶段，人数增加到你一个人管理不过来的时候，发展到法治是水到渠成的事情。不可生搬硬套的决定人治还是法治，也没有法治比人治好的说法，而是不同阶段，用不同的手段。


    # 10、皇帝的管理哲学


    许攸献计，助曹操打败袁绍。曹操统领众将入冀州，许攸纵马近前，高叫：“阿瞒，如果不是我，你能够入这个城门吗？”曹操听罢大笑。许攸又指诸将说：“你们没有我，能这样出入此城门吗？“诸将忿忿不平。许褚斥道：“我们千生万死，身冒血战，才夺取胜利。你怎么胆敢这样夸口呢！”许攸说：“你们不过是匹夫之勇，没有什么了不起。”许褚大怒，拔剑把许攸杀死了。曹操为此深责许褚，不过马上就提拔为征南将军，晋车乡侯，宠遇优渥，邑七百户，赐子孙二人为关内侯。


    这就是曹操混社会的哲学，只要是忠诚于我的，我就不会亏待你。


    曹操的孙子曹髦 “才同陈思，武类太祖。”不甘当傀儡皇帝，说：“司马昭之心，路人皆知也，我要去讨伐他。”率领宫女僮仆数百人，鼓起战鼓，'
  - '[PAGE 161]


    出云龙门而去。小皇帝身披新甲，坐在车驾之上，手持宝剑，大呼杀贼，激励士气。司马昭的亲信贾充率军迎战，列阵于司马昭府前。曹髦亦腾上阵，高喊：“我是天子，谁敢拦我！”士兵们慑于皇威，无人敢挡。贾充急了，说：“皮之不存，毛将焉附。司马若败，我等必死！”校尉成济是个头脑简单的家伙，听了说：“没错！”拍马上前，手中长矛从曹髦胸中进去，于背郭出来。小皇帝血溅长街，当场身亡，年仅二十岁。这个皇帝真幼稚，丝毫没有谋略！没谋略的人在高位，迟早也是死，大家可以参考康熙帝是怎么干死鳌拜的。


    司马昭听到消息后大惊失色，跑过去，抱着曹髦的尸体放声大哭了一场，明白人都知道是作戏，然后召集百官，商量对策。有个大臣说：“斩贾充，以谢天下。”司马昭不答，沉吟再三，不得已杀成济以抵罪。贾充此后一路升官，累迁车骑将军、散骑常侍、行太子太保、录尚书事，很黄铄拜大都督，封鲁郡公，增邑八千户。


    司马昭的哲学就是谁帮我，我肯定保他荣华富贵。所以贾充荣华富贵，我建议击杀贾充那个家伙会很惨。


    一个管理者永远要搞清楚的是，谁真正在帮你，不要让真正帮你的人寒心。'
  - '[PAGE 162]


    # 11、看起来越傻的人越有出路，大智若愚


    越真诚，越赚钱，因为大家都愿意跟真诚的人玩。初看起来，真诚的人是很傻的，时间长了，你就会觉得真诚的人很聪明。那些看起来越狡猾、越聪明的人，越没什么出路，大家表面夸你，实际上都不想跟你共事。你太聪明了，想要少干活，分钱要多分，就没人愿意与你合作，你只有去当孤家寡人。凡是当老大的，普通人看起来就是有点傻的。宋江叫及时雨，别人需要女人他就送女人，别人需要钱他就送钱，他把自己的都送出去了，所以别人都叫他大哥。刘备宁愿不逃命，也要老百姓跟着，所以大家都觉得刘皇叔仁义。吕布聪明吧，谁牛B叫谁爹，谁给粮吃，谁就是娘，最后被曹操抓住，本来曹操爱其武勇，想接纳他的，结果想想吕布以前的行为，还是算了。


    什么样的人才能成功呢？很多人都关心这个问题。人活着总是有欲望的，欲望越少的人越厉害，无欲则刚。通常成功的老板，他的爱好是极其专一的，甚至他只爱他的生意。而贫穷的人，爱电视剧、爱麻将、爱喝酒、爱游戏、爱逛街。人的各种缺点都是建立在欲望的基础上，比'
  - '[PAGE 163]


    如爱睡懒觉。要想有成绩，你必须只爱上一件有益的事。其他的，你就别爱了，因为人没那么多时间与精力。


    佛祖的八万四千法门，你不能都爱，只能爱一种法门、爱一本书、爱一门学问。你若都爱，后果就是不精通。比如，我们读佛经，你休想把所有的经典都搞懂，你就读一本《金刚经》，读完一遍，再读一遍，不断循环往复，几十年如一日。你就能搞懂这本经，成为这一本经的专家，你就会有名声，然后想学这本经的人就会来找你。你就成了这本经的权威。实际上，我们历史上那些高僧大德就是这样干的。


    做项目，也是如此，只做一个项目，不断的专研一个项目，数十年如一日，不断的迭代升级，你就能在这个行业成为权威。凡是没耐心，几个月不赚钱就换项目的人，都赚不到什么钱，甚至只有倒闭了事。


    这世界就这样：当你要得很少的时候，你就会得到很多；当你要得很多，你将一无所有。


    比如，又怕风险，又要创业。又想跟着学知识，又舍不得花钱。又想跟美女认识，又怕拒绝。又想赚大钱，又不愿意牺牲休息时间，又不愿意早起。又想身体好、有肌肉，又不愿意锻炼身体。一个人，你只能要一样，想要的多了，就什么也得不到。这种道理，只有比较傻的人才能明白，聪明的人总是认为鱼和熊掌可兼得！然而，我们都想做这种聪明人，但是我们都讨厌这样的聪明人跟我们做朋友。我们只喜欢傻一点的人，既然傻一点的人大家喜欢，所以，傻一点的人成功了。'
  - '[PAGE 164]


    # 12、领导者是自然选择的结果


    最优秀的领导者，应该是从一个生态系统中自然产生的。正常的生态环境，会有人从中脱颖而出。或者说，大家都觉得他厉害，众望所归，他就是领导了。


    有一个例子，大家可以参考下：东北的鄂伦春族原来是养鹿的。但是，近年来，鹿的种群质量下降得厉害，鹿的个头越来越小，还经常生病。大家不断的寻找原因，最后终于找到原因了，是人为造成的。因为鹿茸很值钱，人们就把鹿角锯下来拿去卖钱了。到后来鹿都没有角了，这样带来了一个严重的问题。


    本来每年春天，鹿群需要用角斗来决出鹿王，而鹿王享有交配权，一般鹿王就是最雄壮、个头最大、体质最优的。这样才能保证种群中最优秀的基因传下去。现在呢，人们把它们的角锯下来卖钱了。鹿没有角，角斗时大家谁也搞不过谁了，就鹿鹿平等了，每个鹿都自由交配。延续下去就不是最优秀的基因了，所以种群的质量越来越差。'
  md: '

    ## 3、老板心态不好，就注定是个弱者


    心态决定人生。


    一位哲人说过：“你的心态就是你的主人。”在现实生活中，我们不能控制自己的遭遇，却可以控制自己的心态；我们不能改变别人，却可以改变自己。其实，人与人之间并无太大的区别，真正的区别在于心态。所以，一个人成功与否，主要取决于他的心态。社会上有很多在逆境中拼搏起来的人，都是因为心态好，心强大。弱者主要是弱在他的心态。


    生气不如争气。


    人生有顺境也有逆境，不可能处处是逆境；人生有巅峰也有谷底，不可能处处是谷底。因为顺境或巅峰而趾高气扬，因为逆境或低谷而垂头丧气，都是浅薄的人生。面对挫折，如果只是一味地抱怨、生气，那么你注定永远是个弱者。其实人生大部分都是失败，但只要抓住一次机会成功了就行了。


    有自信才能赢。


    古往今来，许多人之所以失败，究其原因不是因为无能，而是因为不自信。自信是一种力量，更是一种动力。当你不自信的时候，你难于做好事情；当你什么也做不好时，你就更加不自信。这是一种恶性循环。若想从这种恶性循环中解脱出来，就得与失败作斗争，就得树立牢固的自信心。


    ### 心动更要行动。


    生活不会因为你想做什么而给你报酬，也不会因为你知道了什么而给你报酬，而是因为你做了什么才会给你报酬。一个人的目标是从梦想开始的，一个人的幸福是从心态上把握的，而一个人的成功则是在行动中实现的。因为只有行动，才能赚回滋润你成功的食物和泉水。


    ### 平常心不可少。


    人生不可能一帆风顺，有成功，也有失败；有开心，也有失落。如果我们把生活中的这些起起落落看得太重，那么生活对于我们来说永远都不会坦然，永远都没有欢笑。人生应该有所追求，但暂时得不到并不会阻碍日常生活的幸福，因此，拥有一颗平常心，是人生必不可少的润滑剂。


    ### 宽容是一种智慧。


    俗话说得好：“退一步海阔天空，让几分心平气和。”这就是说人与人之间需要宽容。别人来找你这个当老板的麻烦了，你后退一步，可能付出很小的代价就解决了，而你前进一步，可能流血五步！没必要跟屌丝血流五步。


    ### 学会给心灵松绑。


    人的心灵是脆弱的，需要经常激励与抚慰。常常自我激励，自我表扬，会使心灵快乐无比。学会给心灵松绑，就是要给自己营造一个温馨的港湾，常常走进去为自己忙碌疲惫的心灵做做按摩，使心灵的各个零件经常得到维护和保养。


    ### 别把挫折当失败。


    每个人的一生，难免都会遭受挫折和失败。所不同的是失败者总是把挫折当失败，从而使每次挫折都能够深深打击他取胜的勇气。成功者则是从不言败，在一次又一次的挫折面前，总是对自己说：“我不是失败了，而是还没有成功。”一个暂时失利的人，如果继续努力，打算赢回来，那么他今天的失利，就不是真正的失败。相反，如果他失去了再战斗的勇气，那就是真输了。


    ### 避免烦恼成心病。


    在现实生活中，终日烦恼的人实际上并不是遭遇了太多的不幸，而是根源于烦恼者的内心世界。因此，当烦恼降临的时候，我们既不要怨天尤人，也不要自暴自弃，要学会给心灵松绑，从心理上调适自己，避免烦恼变成心病。


    ### 快乐其实很简单。


    一个会心的微笑，一次真诚的握手，一次倾心的交谈，就是一些快乐无比的事情。一切财富、名誉、地位，都是外在表象。心态才是根本，马云不是现在才成功的，他几十年前就成功了，因为他心态好。


    很多老板并不是日进斗金的时候才成功的，而是刚开始的心态就决定了他已经是个成功者了。为什么学习中国传统文化之后能够轻松获得财富？因为心态好了，人际关系就好了，也能够团结人了，也能静下心来把具体的事情干好了，想不成功都难。


    ## 4、老板需要哪些技能


    首先，那些声称自己讨厌销售或者不能做好销售的老板必定失败。销售能力，是做老板的第一能力。


    如果仅仅会销售，有一个产品，勤勤恳恳的干下去，可以干成一个小老板。很多老板都停留在小老板的角色而不能前进一步成为企业家，原因是赚到钱后，不懂得培养新人，接替自己的位置。自己一直在当销售经理，而不是老板。销售产品开始要老板抓，发展到一定时候，就应该放手。放手干什么呢？开始学习运营、财务、员工管理、法律，以及薪酬管理，这是走向企业家之路。别以为企业家很悠闲，企业家实际上非常辛苦，如果你想随心所欲的做事情，最好别把企业做大。


    如果你是个工作狂、学习狂、享受工作，犹如李嘉诚、比尔盖茨这样的工作狂人，那么成为一个企业家是一件美事。


    当你把我提到的这些基本能力都学会了后，注意，不是叫你学精通，而是基本会了就行了，关键点你能掌握，你的员工就欺骗不了你，你就可以根据市场来制定公司战略。这些都完成了，还想壮大，就开始疯狂的专研交际能力。人的本质是一切社会关系的总和。马克思讲的真理，你现在开始用得上了。


    还有最重要的一点，就是必须大方慷慨，你若只是想打工或者当个小老板，你无需大方慷慨的对待你的员工、核心成员。而如果你想做大做强，你必须让跟着你混的人一起分享你的财富，他们才会与你一起为公司着想、拼命。


    ## 5、老板们要刻在脑子里的思想


    一个人要想做大事，要么把所有的心思花在组建团队身上，成为一个企业的组织者；要么成为一个研究者，做自己已特别喜欢做的事情。如爱因斯坦研究物理学一样。我想对于大多数人来说，组建团队是一条容易走的路。


    人应该经常去看看那些比自己富的人住的房子、开的车子、拥有的地位，通过见识去唤起自己的野心。如果你的环境都是些很差劲的人，我建议你经常去那些富豪集中的小区里转转。大着胆子走进去，保安有时候搞不清楚你是不是业主，不会拦你，不过有些高端小区要打卡才让进，你也可以找房产中介说要买房子，然后就很进去了。


    做项目，我是不建议一开始就创新的，先找到一个你认同、又能模仿的产品或者服务，他怎么干，你就怎么干；他怎么卖，你就怎么卖，先赚到钱再说，有了钱再去想创新的事情。永远不要怕出丑，永远不要怕失败，其实每一个成功的人都经过一而再、再而三的失败才成功的，失败与出丑是必经之路。


    做为老板，想要员工听话，你自己必须先要做到。你自己没结果，说再多，大家最多表面上服从你，私下里其实觉得你没什么本事。老板必须做到让员工心服口服，这个企业才有发展前途，这就要求老板必须以身作则。你必须不断的行动，而不是只知道在那里做计划或者纸上谈兵。只要你行动，你就会感觉到快乐。不行动，慢慢的，你的项目没有推进，你的钱快要用完了，你就会感到很痛苦。


    梦想、理想要天天讲给员工听的，听多了，员工就深信不疑了，“谎言”说一千遍就成了真理。要明白新员工不是一次就能教会的，你妈妈教你走路还教了无数次呢。多点耐心去培养员工，对于实在不能上道的员工，采取立刻开除的态度。老板在公司里姿态越低，越有影响力，大家越愿意帮你做事；姿态越高，别人越不愿意跟你混。要尊重员工。


    老板的工作能力加上工作态度，决定你的企业在市场上的竞争力。老板的工作态度更加重要，员工的工作能力更加重要。


    ## 6、老板最大的财富是激情


    这个时代，有无数的传统企业家年纪 40 多了，不思进取，依然活在互联网之前的时代，依然自恋自己曾经很厉害，依然陶醉在互联网之前的成就感里，这是很危险的。我希望他们尽快进入到互联网的时代，进入到数字时代、智能时代，但这样老企业家，很难从以前熟悉的世界进入新时代。


    老企业家们不管柯达是怎么死的，也不管爱多是怎么死的，谈到微信、移动互联网、互联网金融、社群营销，他们还完全处在排斥中，这是最可怕的。是抗拒时代的发展，是逆潮流的，硬生生把自己定格在落伍者的行列里。这些人为什么会这么保守？我的理解就是缺少激情。


    一个人有激情，才愿意跟着时代跑，3D打印机来了，了解3D打印机；微信来了，玩微信营销；机器人来了，玩机器人；淘宝来了，玩淘宝；智能时代来了，玩智能时代。凡是跟着时代的潮流能赚到钱的，都是非常积极的人，在大家还没感觉的时候，就投入时间、精力去研究。等到大家有感觉、醒来的时候，就抢占先机，就有钱赚。实际上，这个社会每3到5年，都有一个大机会可以让入发财。但是很少有人可以拥有激情不断的去探索。老板最最需要的就是要跟上时代，保持激情，我想，那些老企业家年轻的时候，肯定也是很有激情的年轻人，才会去创业的，结果老了，把激情弄丢了。


    一个人要想持续成功，就要保持激情，就必须跟上时代的发展，否则，就会成为柯达、爱多的下场。


    ## 7、老板最重要的能力不是做产品的能力


    很多老板喜欢讲，我有一个非常好的产品创意，我有一个很好的想法，然后就把自已全部的精カ、时间、金钱、团队，都投入到让产品落地，或者改善产品的性能与质量上去了。这个过程非常耗时间耗力，最后经过半年，甚至一年时间，做出来个产品，还没有打开市场，钱就花光了，团队也没有信心了，就散伙了。问题出在哪里？就是因为市场上最不缺的就是产品，到处都有优秀的产品，而市场上最缺的是具有推广能力、营销能力的人。只要有了推广能力、营销能力，随便找个好产品，就能卖起来。其实微软公司的windows操作系统，也不是比尔盖茨做出来的，而是比尔盖茨推广到全世界的；QQ也不是马化腾做出来的，而是马化腾把QQ推广到全中国的；华为公司的任正非，开始也是背着包去卖交换机的一个代理商，而不是交换机的生产者。


    拥有一个好产品，是做项目过程中最不重要的事情，老板最好一开始就打造一个好的营销推广团队，把营销推广团队当成重点，企业成功的几率就大多。


    大家都知道马云是个英语老师，不懂数据库，也不懂网站建设。但这没关系，马云是一个好的营销推广人员。老板的方向对了，就容易成功；方向错了，不管你多努力，成功也很难。


    ## 8、老板只做自己能力范围内的事


    你去大街上转一圈，可以说在任何失败的、奄奄一息、半死不活的生意上，都可以看见“做了能力以外的事”的影子。我经常碰到一些老板，只有100万，却以为自己很聪明，做了需要500万才能干的生意，最后资金链断裂、人才匮乏，往往是倒闭了事。虽然他们各有各的问题，具体到各自的问题上，他们遇到的问题不一样，但是我们从战略高度来看，他们的成败与他们遇到的问题、与他们的能力是无关的。能力再小的人，比如一个两岁大的孩子，你让他用手去抓薯条，他会遇到什么问题？又怎么可能失败？他一定搞得定。什么意思呢？就是老板必须做自己能搞得定的事。能力再大的人，比如马云、李小龙、爱因斯坦……全部召集起来，给他们双筷子，让他们去把没有剥壳的鸡蛋剥起来，他们怎么可能不遇到问题？又怎么可能成功？


    如果我们去深究他们每个人失败的原因，比如爱因斯坦不善于用筷子，他应该多加练习；李小龙力气太大，把鸡蛋夹破了；马云会取巧，他把筷子反过来用方头去夹，值得学习，可惜手劲不足，功败垂成……这样去分析，从战术层面有意义，但不是我们要说的重点。因为，他们都做了他们能力以外的事情，从战略层面毫无意义。你看李小龙能碾碎2米5高的灯泡，那2米6的又如何呢？就算我们把他的能力放大十倍、一百倍，他能碾碎250米高的灯泡，那251米的又如何呢？就算我们的能力被放大十倍、一百倍，如果我们老是设立过高的目标，做自己能力以外的事，铁定是要失败的。


    严格来说，只做自己能搞定的事并不是保守，是因为很多人尤其是初次选手，都容易过高估计自己或团队的资源和能力，低估项目和市场的复杂性，寄希望于不遇到问题、不发生意外，寄希望于对手不回应、不反击……这怎么可能呢？成功的唯一可能是运气实在太好，好比横渡太平洋没遇到任何风浪。而保守一点，正好留出处理各种不可控因素的余力求。


    如果这个余力足够大，你可以迅速提高自己的目标，但是如果一开始就把自己的目标定得很高，往往耗尽自己的资源、现金。最可怕的是把自己与团队累得精疲力尽，信心也搞没了，成功就基本不可能了。


    我做企业有一个重点，就是不断招聘人才。我招聘人才并不是用他们来完成高难度的项目，而是做非常非常简单的事情。高手做简单的事情，并不是屈才与浪费。高手做简单的事情，会把简单的事情做到更加的极致，直接对这个行业的其他竞争对手形成屠杀级的优势。


    就如同我以前玩《魔兽世界》一样，我喜欢杀人。我才不去杀大号呢，就算我技术好，也要经常被骗。我是组织一伙人，一起去小号练级的地方屠杀小号，这样既安全又快乐。很多人对我这种行为不耻，无所谓了，我要的是胜利，而你要的是让我去送死。其实《孙子兵法》讲过这个哲理，伟人毛泽东也讲过只打有把握的战争，这就是老板应该吸收的思想。


    ## 9、人治还是法治


    刚开始创业的时候，肯定是人治，但是随着业务的繁忙，如果企业忙不过来了，就要招兵买马。人多了，你一个人管不过来，就要委任管理者，而要使管理者的工作有法可依，不至于按他们自己想的胡来，不至于大家心不朝一处想，力不往一处使，自然就要开始订立目标与规章制度，自然就过渡到法治了。


    水到自然渠成，企业的成长和生物的成长一样，是个过程。只要有利润，创业初期先不要考虑人治还是法治的问题。法治是规模发展起来了，可以采用的手段。如果初级阶段硬要去决定人治还是法治，可能都会适得其反。


    从企业发展的角度，你需要招人；从法治的角度，你仍然需要招人。因为你 要分工的话，就得权责分明，权力和责任是同时放下去的。比如你叫我负责办公室的卫生，表面只是责任，其实权力也一块放下去了。我有什么权力？打扫办公室的权力。这意味着任何人插手我的工作的话，最后你都无法追究我的责任。所以当你把权责放下去之后，就意味着在那一块，你只剩下最牛
    X、最无奈的撇换负责人的权力，而不能轻易插手别人的工作。牛 X 在哪里？生杀大权嘛！无奈在哪里？如果你没有后备人才，你敢撤换他吗？不撤，他做不好本职工作，影响大局。撤了，得你自己去顶上，顶张三、顶李四……最后累成狗。所以说，发展到分工合作阶段，就要求你必须得有替补，而且替补的存在会让在位者有种无形的压力。也就是，内部竞争机制是由替补建立起来的。


    无论从哪个角度讲，当你有钱闲多养几个人的时候，你才能建立法治。然后，即便这样，也不是人治、法治的分割点。规则化、制度化是结果，既非目的，更不是必然手段。反正兵来将挡，遇到问题解决问题，企业发展到自己实在没有精力去管的时候，就只能借助一些规章制度。这样一天一天过去，有天你回头一看：噢！自己的企业变得像台机器一样，员工们按照规章制度和惯例工作，做得好，得到奖励；做不好，受到处罚。你不去管，他们也照常工作，这就法治了。


    所以，创业初期是人治，随着企业发展到分工合作阶段，人数增加到你一个人管理不过来的时候，发展到法治是水到渠成的事情。不可生搬硬套的决定人治还是法治，也没有法治比人治好的说法，而是不同阶段，用不同的手段。


    ## 10、皇帝的管理哲学


    许攸献计，助曹操打败袁绍。曹操统领众将入冀州，许攸纵马近前，高叫：“阿瞒，如果不是我，你能够入这个城门吗？”曹操听罢大笑。许攸又指诸将说：“你们没有我，能这样出入此城门吗？“诸将忿忿不平。许褚斥道：“我们千生万死，身冒血战，才夺取胜利。你怎么胆敢这样夸口呢！”许攸说：“你们不过是匹夫之勇，没有什么了不起。”许褚大怒，拔剑把许攸杀死了。曹操为此深责许褚，不过马上就提拔为征南将军，晋车乡侯，宠遇优渥，邑七百户，赐子孙二人为关内侯。


    这就是曹操混社会的哲学，只要是忠诚于我的，我就不会亏待你。


    曹操的孙子曹髦 “才同陈思，武类太祖。”不甘当傀儡皇帝，说：“司马昭之心，路人皆知也，我要去讨伐他。”率领宫女僮仆数百人，鼓起战鼓，出云龙门而去。小皇帝身披新甲，坐在车驾之上，手持宝剑，大呼杀贼，激励士气。司马昭的亲信贾充率军迎战，列阵于司马昭府前。曹髦亦腾上阵，高喊：“我是天子，谁敢拦我！”士兵们慑于皇威，无人敢挡。贾充急了，说：“皮之不存，毛将焉附。司马若败，我等必死！”校尉成济是个头脑简单的家伙，听了说：“没错！”拍马上前，手中长矛从曹髦胸中进去，于背郭出来。小皇帝血溅长街，当场身亡，年仅二十岁。这个皇帝真幼稚，丝毫没有谋略！没谋略的人在高位，迟早也是死，大家可以参考康熙帝是怎么干死鳌拜的。


    司马昭听到消息后大惊失色，跑过去，抱着曹髦的尸体放声大哭了一场，明白人都知道是作戏，然后召集百官，商量对策。有个大臣说：“斩贾充，以谢天下。”司马昭不答，沉吟再三，不得已杀成济以抵罪。贾充此后一路升官，累迁车骑将军、散骑常侍、行太子太保、录尚书事，很黄铄拜大都督，封鲁郡公，增邑八千户。


    司马昭的哲学就是谁帮我，我肯定保他荣华富贵。所以贾充荣华富贵，我建议击杀贾充那个家伙会很惨。


    一个管理者永远要搞清楚的是，谁真正在帮你，不要让真正帮你的人寒心。


    ## 11、看起来越傻的人越有出路，大智若愚


    越真诚，越赚钱，因为大家都愿意跟真诚的人玩。初看起来，真诚的人是很傻的，时间长了，你就会觉得真诚的人很聪明。那些看起来越狡猾、越聪明的人，越没什么出路，大家表面夸你，实际上都不想跟你共事。你太聪明了，想要少干活，分钱要多分，就没人愿意与你合作，你只有去当孤家寡人。凡是当老大的，普通人看起来就是有点傻的。宋江叫及时雨，别人需要女人他就送女人，别人需要钱他就送钱，他把自己的都送出去了，所以别人都叫他大哥。刘备宁愿不逃命，也要老百姓跟着，所以大家都觉得刘皇叔仁义。吕布聪明吧，谁牛B叫谁爹，谁给粮吃，谁就是娘，最后被曹操抓住，本来曹操爱其武勇，想接纳他的，结果想想吕布以前的行为，还是算了。


    什么样的人才能成功呢？很多人都关心这个问题。人活着总是有欲望的，欲望越少的人越厉害，无欲则刚。通常成功的老板，他的爱好是极其专一的，甚至他只爱他的生意。而贫穷的人，爱电视剧、爱麻将、爱喝酒、爱游戏、爱逛街。人的各种缺点都是建立在欲望的基础上，比如爱睡懒觉。要想有成绩，你必须只爱上一件有益的事。其他的，你就别爱了，因为人没那么多时间与精力。


    佛祖的八万四千法门，你不能都爱，只能爱一种法门、爱一本书、爱一门学问。你若都爱，后果就是不精通。比如，我们读佛经，你休想把所有的经典都搞懂，你就读一本《金刚经》，读完一遍，再读一遍，不断循环往复，几十年如一日。你就能搞懂这本经，成为这一本经的专家，你就会有名声，然后想学这本经的人就会来找你。你就成了这本经的权威。实际上，我们历史上那些高僧大德就是这样干的。


    做项目，也是如此，只做一个项目，不断的专研一个项目，数十年如一日，不断的迭代升级，你就能在这个行业成为权威。凡是没耐心，几个月不赚钱就换项目的人，都赚不到什么钱，甚至只有倒闭了事。


    这世界就这样：当你要得很少的时候，你就会得到很多；当你要得很多，你将一无所有。


    比如，又怕风险，又要创业。又想跟着学知识，又舍不得花钱。又想跟美女认识，又怕拒绝。又想赚大钱，又不愿意牺牲休息时间，又不愿意早起。又想身体好、有肌肉，又不愿意锻炼身体。一个人，你只能要一样，想要的多了，就什么也得不到。这种道理，只有比较傻的人才能明白，聪明的人总是认为鱼和熊掌可兼得！然而，我们都想做这种聪明人，但是我们都讨厌这样的聪明人跟我们做朋友。我们只喜欢傻一点的人，既然傻一点的人大家喜欢，所以，傻一点的人成功了。


    ## 12、领导者是自然选择的结果


    最优秀的领导者，应该是从一个生态系统中自然产生的。正常的生态环境，会有人从中脱颖而出。或者说，大家都觉得他厉害，众望所归，他就是领导了。


    有一个例子，大家可以参考下：东北的鄂伦春族原来是养鹿的。但是，近年来，鹿的种群质量下降得厉害，鹿的个头越来越小，还经常生病。大家不断的寻找原因，最后终于找到原因了，是人为造成的。因为鹿茸很值钱，人们就把鹿角锯下来拿去卖钱了。到后来鹿都没有角了，这样带来了一个严重的问题。


    本来每年春天，鹿群需要用角斗来决出鹿王，而鹿王享有交配权，一般鹿王就是最雄壮、个头最大、体质最优的。这样才能保证种群中最优秀的基因传下去。现在呢，人们把它们的角锯下来卖钱了。鹿没有角，角斗时大家谁也搞不过谁了，就鹿鹿平等了，每个鹿都自由交配。延续下去就不是最优秀的基因了，所以种群的质量越来越差。

