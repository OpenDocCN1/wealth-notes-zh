    # 后记


    学生在网吧、球场，或者看小说。有的孩子只能努力一个月，然后就坚持不下去了，这样的人就是成绩波动比较大的人。


    读书毕业后，我经历过很多工作，特别是在两个公司做过销售员，我们的销售员有几百人之多。哪些销售员的业绩最好呢？毫无疑问，我的结论是：最努力的那个人。最努力的那个销售员，他在办公室就是从早到晚打电话，他出了办公室就是一直在拜访客户。他真的在做事。一年下来，他自然是业绩最好的。我离开那个公司一年后，再回到那个公司去看他，他已经升级为经理了，而同期不努力的人要么离开了，要么还是个跑腿的。


    我从来不相信天赋，我认为任何人的智力基本一样，甚至如果你疯狂的努力工作，实际上你的智力会因为你的努力而改变，其实不是智力改变了，而是熟能生巧。我以前讲过一期节目叫卖油翁，说的就是熟能生巧。所以我只相信努力，我要成为最努力的那个人，什么叫努力呢？就是坚持对长远目标的激情，对手上的工作日复一日的干，而不是仅仅坚持一个星期或者几个月。我创业最初三年，都没赚到什么钱的，不过坚持过来了，收入就越来越高了。我经常对创业者讲的话是，如果你不能做好两年不赚钱的准备，就别来创业。


    真正有成就的人，都是几年、几十年如一日的努力奋斗着，生活是一场马拉松而不是一次短跑。我相信在这个社会上收入高的人，都是长期艰苦奋斗的结果。我说的艰苦奋斗包括体力与脑力的艰苦奋斗。有这种一个人，他们只会体力奋斗，不会脑力奋斗，脑力上非常的懒惰，就别来跟我解释了。


    长期努力是成功的唯一原因。


    不断的写文章，会让人变得聪明。不断的阅读，人就越来越有料。要强迫自己独处，在一间办公室里，静静的看书，然后总结。思考的范围就是商业，就是管理，就是如何降低成本，提高利润。公司的经营重点就是提高效率。思想越简单，越单纯，越有前途。永远积极向上，把失望、悲伤、沮丧的力量都转化成奋斗的力量。


    一个人可怜，其实是因为没有钱，没有事业，没有地位。而地位、事业、金钱都是靠工作获得的。别说你是富二代、官二代，你若自己不奋斗，没有积累到经验，其实你的社会地位、金钱都非常不靠谱。靠山一侧，一不小心就回到解放前了。每个人想成功，都要经历痛苦，没有人例外。我当年做业务员，也非常不习惯去递名片，我痛苦，我销售的对象也很痛苦。但是因为我不断的锻炼，现在被我销售的对象也都心服口服，也很开心。


    我写文章也是如此，开始的时候，哪里写得出来嘛，但是我相信马云先生的那句话，永不放弃。写着写着就找到感觉了。


    一个人迷茫，其实就是不知道怎么解决问题，甚至都不知道问题在哪里，那就应该不断的学习。人只可以学习改变命运。学习其实就像是人的第二生命。我的语音课讲不好的时候，就是我没有备课的时候，或者是当天阅读量不够的时候。所以，人必须时时刻刻准备着，做事业的人，一刻也不能松懈。


    多找导师帮助你，当然没有多少导师会免费帮助你，你应该付出金钱，天经地义。笨蛋总是以为导师不重要，岂不知专业的运动员都是有导师的，而业余的人是没有导师的。别人给你摸索好的东西，你为什么不多点钱弄到手呢？非要自己钻木取火？


    社会竞争激烈，那些松懈的人、不能坚持下去的人，永远也不能成功。我指导了很多学员，其中有一个本打算放弃了，不过他经常听我的录音，又坚持了下去，现在收入起来了。我看到很多其他的学员问他要方法，其实，方法我都讲过。那个成功的学员说，我就算给你们方法又怎样？只有坚持不下去才有意义。


    经历的事情多了，我不怎么相信一个人说话了，我知道，大部分人说话都是随便说说，因为他执行不下去。我也不太喜欢看似脑袋很灵活的人了。毕竟，讲一个理论与方法很容易，做起来就不是那么回事了。


    当我了解的金融知识、企业家知识、投资知识越多的时候，我越来越喜欢那些贫穷的懒惰者，为什么呢？其实，正因为他们的懒惰，成全了勤奋的人。懒惰的人一辈子都只能为勤奋的人工作，并且世界上好的东西先由勤奋的人挑。挑完了，才由懒惰的人挑，其实也没什么可挑的了。


    雷军是个工作狂，比尔盖茨也是。只有工作狂，才能成功。没有人可以逃避责任，生活就是天网恢恢，疏而不漏。

