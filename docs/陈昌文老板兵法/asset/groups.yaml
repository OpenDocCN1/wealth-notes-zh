    8、一定要给顾客讲有含金量的东西，一定要学会创造价值，为顾客创造他需要的价值。客户认为值了，自然就买单了。


    9、所有的事物，都要学会去链接。情感的关系大于利益关系和合作关系，要与顾客有深层次的情感交流。把一切美好事物都链接到你的产品与服务上去。


