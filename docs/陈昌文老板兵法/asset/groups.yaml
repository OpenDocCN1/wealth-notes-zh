    ## 7、把定义卖给对的人


    一切事物都是相互依存的，没有任何一样东西能独立存在。有穷人就必须有富人；有男人就必须有女人；有老板就必须有员工。更深入地讲，老板必须得员工好，你的企业才能发展壮大，老板本身才会好。企图只让自己好的老板，员工是不会让你得逞的。


    一切事物都是相互依存的，没有真正的独立。三鹿奶粉用了三聚氰胺害了很多婴儿，所以三鹿就倒闭了。凡是伟大的企业，都是真心实意帮助顾客。凡是圣人都是殚心尽力为人类造福的。整个宇宙都是无常变幻的，王座不可能永恒。道德的定义也随着时代的精神一直在变幻。


    古代一个男人可以娶好几个老婆，现在中国实行的是“一夫一妻制”。做为商人，必须与时俱进，跟着新科技奔跑，方能赚取巨额财富。


    蛋如果煮熟，你就不能改变什么了。任何事情都有个时间限制，人生最要紧的是踏准节拍，该结婚必须结婚，该恋爱必须恋爱。每段关系最终都会结束，天下没有不散的筵席。但我们在有关系的时候，要尽情去演戏。没有天长地久，只有尽情演戏的人才不会留下遗憾。人生就是演戏，如果你想活得久一点，你可以选择不抽烟、多运动。如果你想多赚钱，你就开始学习财务知识、创业知识、企业管理知识，并且去实践。赶在蛋已煮熟之前行动。


    对某些人痛苦的定义，对其他人却是快乐的。商人就是能靠概念赚钱的人，靠定义赚钱的人。送礼就送脑白金，对有些人来讲是弱智的；对有些人来讲，却是救命稻草。你没发财，只是你没把定义卖给对的人。


    ## 8、卖用户能获得什么利益，而不是卖你产品的特点


    很多销售员根本不知道面对客户应该讲些啥，把自己产品的一大堆特点、好处告诉客户，这种行为其实是在浪费自己的时间，也是在占用客户的时间。讲自己产品的特点与好处，全部都是废话，而且你讲得越多，用户越是迷茫，不知道你重点要讲什么。你不要讲你的价格便宜，其实用户根本不关心你便宜不便宜，他只关心能获得什么利益。便宜不便宜根本不是他购买的直接原因。


    卖一个产品，最好是告诉用户，买了这个产品，会给他带去什么改变。让他有已经买了这个产品的感觉。所以，我在很多场合讲过，卖产品是卖一种感觉给用户，但很多人听不懂这句话。我们做销售，永远要用肯定、清晰、充满朝气、充满信心的声音，将产品的好处传达给用户。


    我看到很多销售人员讲，我这个产品里含有多少维生素，是经过了多少道工序才做出来的，有什么植物精华、保湿因子。想想这些没有经过系统训练的销售员就好笑。客户根本不关心你说的这些；客户只关心你这个产品能给他带去什么利益。所以，不管我们做广告，还是面对客户讲话，我们的重心永远是客户能获得什么利益，而不是你产品怎么样。


    卖什么东西，切忌用专业术语。很多销售为了显示自己，还专门去背那些说明书上的专业术语。你讲的话客户听不懂，他肯定就不买。高手是把复杂的事情讲简单，通俗易懂；傻子是把简单的事情搞复杂。


    同样，竞争的本质是要盯着顾客，不是盯着对手。


    你说要打败谁，就等于说，你现在比别人差。你每喊一句口号，就相当于在给竞争对手做广告。并且说明了你很崇拜这个竞争对手。诺基亚的 CEO 说要打败苹果，就只能证明诺基亚的
    CEO 崇拜苹果公司。脑袋里想着竞争对手，嘴巴里念着竞争对手，等于在给竞争对手免费做广告。


    最有效的手段，是盯着顾客，不要盯着竞争对手。就跟谈恋爱是一个道理，你的脑袋里、眼睛里要盯着对象，而不是盯着你的情敌。就算你能搞定一个情敌，还有无数个情敌等着你搞，累死你，你也不能获得成功。你应该想伴侣之所想，急伴侣之所急，这才是谈恋爱的正确做法。


    人性有一个弱点，总是盯着谁抢了他的饭碗，不盯着谁给了他的饭碗。人们总是忽略给他吃饭的人，而跟那些抢他吃饭的人竞争。我们要完全改变这种思维，我们要讨好给我们吃饭的顾客，那些抢我们吃饭的竞争对手自然就饿死了。


    ## 9、卖产品就是给用户找购买理由


    现代社会，生产力空前发展，做好商品等着顾客来买的时代已经一去不复返了。卖产品，必须卖到心理学层面。卖产品已经不是卖产品了，而是给用户找购买理由，找行动理由。产品的名字，都要体现出来购买指令。广告就是货架，产品就是媒体。其作用是告诉顾客为什么要买你的产品，而不是介绍产品。


    如何才能做出一款好产品，其根本不是有一个好想法，而是去观察人们的行为特征、心理活动。经济学其实是心理学的延伸，做生意其实是心理游戏。人类的每一个动作，都是心理的延伸。价格只是一种感觉，付款只是一种期待。自己在说什么，其实都搞不清楚，但就是这种搞不清楚的东西在支配着这个世界。一般的产品只能解决人们显性的问题，高级的产品、利润高的产品，解决的是人们心理的问题。没有多少人能达到这个高度，所以，高级只对少数商业、心理学家开放。


    人们需要的是理由，不管做什么，你只要有足够的理由，人们就会支持你。送礼就送脑白金，就是一个理由；收礼只收脑白金，也是一个理由。你嫁给我，衣食无忧，也是一个理由。来陈昌文老板读书会，提升智慧，也是一个理由。其实，打土豪，分田地，也是一个理由。给其一个理由，可以让其粉身碎骨浑不怕。张仪、苏秦，靠理由混社会，话语就是圈棋！


    要想选择一个长盛不衰的项目，能赚大钱的项目，还是得利用人性。你要思考，你这个项目能不能让用户一直想起你。营销的本质是消费者头脑中的战争，只有刚性需求的产品或服务，才能让用户随时都想起。再者，你这个项目提供的产品、服务，是不是用户的迫切需求。只有迫切的需求，用户才容易掏钱。要不然，用户就拖啊拖啊，最后你没钱了，就倒闭了，用户还不消费。


    ## 10、仪式化营销的最高境界


    这个仪式化，其实生活中随处可见。比如苹果手机的发布会，新品发布大家去排队。小米手机发布会，华为手机饥渴营销，大家在电脑上抢手机，都是仪式化的变种而已。海底捞火锅，你去吃火锅，还有美甲师给你美甲。去吃日本料理、韩国料理，去吃牛排，对中国人来讲特殊的吃法，都是仪式化的东西。只要去了几次，就会在你的脑袋里打下烙印，你老是会想起这些东西，就会勾引你继续去买单。这就是营销的最高境界，在消费者脑袋里面种下了种子，随时都会发芽。我们做营销的，就是要做到这个境界。


    我们请一尊财神，要开光，这个老道就会神神叨叨，东搞搞，西搞搞，就开了光了，就收了好大一笔钱。他玩的就是仪式化，我们为啥需要这个仪式化呢？其实是因为有人在我们脑袋里种了一颗种子，他在我们买财神的时候发芽了。这就是最厉害的营销。


    下面我给大家一个种种子的案例，大家好好悟一悟。睡觉之前，拖鞋怎么摆？这就是一个仪式。老人们说，不能把鞋尖冲外摆！因为会离魂。三魂七魄穿上了你的鞋，去东游找乐子去了。完了完了，你醒不来了，英年早逝，骨灰盒还没来得及买呢。那我冲里面摆！老人又告诉你，也不能这样摆，因为半夜里哪个“好朋友”路过，一看：这里有双鞋，穿上试试。再一看，咦！床上还有个人，等我玩个附身，完了完了，你又被鬼压身了。


    那该这么摆？我告诉你：一只冲左，一只冲右。这是什么意思？我们的目的，就是要让半夜路过的那个朋友，不知道这是什么意思。也让你的三魂七魄没鞋可穿，这样你就安全了。对了，这个睡觉之前鞋怎么摆就是一个仪式化。


    大家这下被我种下了这个种子，以后睡觉就得把鞋子一只冲左，一只冲右。否则，鞋尖外摆，晚上三魂七魄就穿上你的鞋子跑出去了，你小心他不回来了。大家鞋尖向里面摆，后果就是：“半夜路过的朋友”一看这里有双鞋，穿上，然后看床上有个人，就会上来玩个附身。完了，这下就会被鬼压身。


    你的鞋子没摆好的话，赶快下床去摆好。我已经告诉了你，要一只冲左，一只冲右。你会说，我很牛×，人挡杀人，佛挡杀佛，怎么还会信这个？我才不会被你吓到呢！我是无神论者！听我细细道来，你就明白你必须信了。


    你不信，但是你的潜意识会信。当这套丢魂和鬼压身的歪理邪说感染了你的意识之后，在你清醒的时候你不怕，因为你的意识可以凌驾在你的潜意识之上。但是，当你睡着以后，潜意识就会活跃起来。你的潜意识是不具备分辨能力的。如果睡觉之前没有按照这套仪式来摆放拖鞋，那么你的意识就会组织起很多素材来让你睡不安稳。


    所以，仪式化这个东西，虽然看起来很简单，甚至很白痴，但其实很管用。你听了我这套说法，你也就被这种病毒感染了，即使今天它还无法影响你，但是它在你的意识里埋下了一颗种子，总有一天你睡觉之前，肯定会想起我的话，把鞋一左一右的摆，要不你就睡不安稳。大家已经被我种下了仪式化的种子，就被我营销了。


    ## 11、目标太多，没有执行力


    为什么很多人碌碌无为？就是因为**目标太多**，想太多。一个人想太多，就没有执行力。而一个人如果只想一件事，只做一件事，他必定能行动起来，做得好的可能性就增加很多。一个老板，必须以结果为导向。结果导向就是赚到钱，有纯利润。我们不是搞科研的，**我们做企业的目的是希望获得商业成功**。


    赚钱就是要不断的探索新的赚钱方法，因为一定有更加优秀、更加简单、更加快速的赚钱方法。卖水果的赚钱方法与搞金融的赚钱方法差别太大，搞金融的一天就可以赚卖水果的一年的收入。那么同样水平的人，为什么不去搞金融呢？


    老板就是找到当下最赚钱的事情去干，把不重要而非做不可的事情交给助理做！**不重要，可做可不做的事情，就不做了。**让公司所有的资金、人才帮你做第一重要的事情。不管你的公司是10个人，还是100个人，甚至1000个人，都只管一个最赚钱的业务。坚决不管理两个以上的业务。


    一个目标很容易就实现了，5个目标实现起来就有难度，10个目标能实现简直就是天才级的人物。我们大多数老板都是普通人，所以，找一个最有价值的目标干就行了。


    老板就是要有取舍的能力，抓住主要矛盾，就如同田忌赛马一样。田忌之所以能打败齐王，就是因为田忌懂得取舍，懂得把自己的优势排序。


    老板把什么人放在什么位置，把资金放在什么地方，把自己的精力放在什么地方，就决定了企业的整体效益。所以，老板就是一个理论功底特别强的人，逻辑能力也特别强的人。如果一个人没有理论功底，没有逻辑能力，是做好老板的，是一个糊涂蛋。


    总结一句，老板不是首先做最重要的事情，然后去做第二重要的事情，而是只做最重要的事情，不做第二重要的事情。这样才能迅速赚钱，赚到最多的钱。


    ## 12、我的网络营销态度


    穷人做事，多而杂；富人做事，少而专且精。穷人贪心，因为穷人啥都干。越干越穷，看起来很忙，实际是因为舍不得钱休闲，所以一直忙着节约钱。我见过一些人，很早起床要自己做饭，做好了好，自己吃了，还要带一份到公司当午饭吃，以便节约钱。他还要送小孩上学，然后自己挤地铁上班。穷人不舍得打车，因为他要节约钱。在我看来，这是一种贪心。穷人下班还要去市场买菜、烧饭。忙完了，他还要忙着看电视刷、看新闻，时间表排得满满的。而富有的人，只做一件事，把一件事做到极致，就赚到了钱。赚到钱了，啥都不用忙了。当然喜欢工作的，可以继续把这件事做到大师级。史玉柱东山再起，就只做了两个产品“脑白金”和“征途”。真是聚焦到极致。


    对于普通人来讲，成功之道无他：聚焦、聚焦、再聚焦。把所有精力都投入到一件事情上面，那么自然就可以比那些分散精力的人走得远得多。


    谈完这些，我们再谈来谈我们的营销策略，就清晰了。营销的具体方式有很多，我们谈主要的三类：软文营销、语言营销、视频营销。我们就单说软文营销。按我的方式又分为：自己写的、抄的、改编的。


    再细分这个改编的软文题材，又分为小说题材、故事形式题材、说理形式题材。这里面的故事形式题材又分为，他人的故事、自己的故事。分到这个份上，其实还可以继续分下去。这种分析的目的在于找到适合自己的软文形式。


    我们测试的结果是，自己的故事题材是最有效果的。那我们就重点做自己的故事形式的软文改编。我们的引流方式是软文引流。我们在做这种具体的事情的时候，出现了其他非常多的诱惑，我们必须抵御这种诱惑，不能分散精力。必须一心一意的做改编自己故事题材的软文营销。


    网赚的道路，必须聚焦、聚焦、再聚焦。从生活态度到工作的内容细分，都必须做到这一点。然后还要抵御住其他诱惑。其实方法对了，做啥都能成功。再然后是要坚持，持续在一个项目上死磕三个月。你不能期待今天发一篇软文，明天就能收入几千，那这个钱也太好赚了。最后，在没有出成绩的时候，要加大量，不停的做，不能灰心，但要总结，相信一分耕耘一分收获。


    ## 13、我的 27 条营销心得


    - 1、顾客是最好的老师，时时刻刻研究顾客。同行是最好的榜样，谁赚到钱了，你就抄袭他。他怎么做营销，你就怎么做；他怎么做广告，你就怎么做，但要注意法律风险（详细内容见《陈昌文方法
    72 大营销系统》）。市场是最好的学堂，关注市场，少听学院派纸上谈兵。

    - 2、信赖感大于实力。销售的 97% 都建立在信赖感，3% 在成交。我卖出去很多不是行业第一的产品，而价格却能卖得很高。有时候连我自己都不相信这是真的，但因为与客户建立了信任感，客户就买单了。技术派、学院派的人认为产品好才是硬道理，我认为多与客户接触才是硬道理。就如同你吃你妈妈做的饭很放心，而你吃那个五星级大饭店里大厨烧的饭菜，总是会怀疑素菜是不是打了农药，肉类是不是有很多激素，卫生吗？这些问题。所以，顾客买单，信赖感第一。

    - 3、**当你学会了销售和收钱，不想成功都难。**刚开始，老板第一要学会的就是销售与收钱。马云最开始都是亲自一家一家的去敲企业的门做销售的。拒绝做销售的人，很难做好老板。

    - 4、**拒绝是成交的开始。**被 99% 的顾客拒绝都很正常，100 家里面有 1 家买你的产品，你就富可敌国了。很多人被拒绝 10 次就受不了了。销售就是零存整取的游戏，顾客每一次的拒绝都是在为你存钱，并不是说，顾客拒绝你，你的工作等于零，而是你放弃了，就等于零。

    - 5、**要从赢得客户信任、改变客户观点、用故事、讲利益、讲他不买会有什么损失等方面，对客户进行一个十面埋伏的营销体系。创造让顾客不可思议、不可抗拒的营销方案。**

    - 6、**销售是把你对产品的信心传递给顾客的一个过程**。所以，你自己必须得相信你的产品或服务值钱，用情绪去感染顾客，锻炼好身体，持续不断的说服顾客。谈判是决心的较量，你必须相信他就是会买。成交是意志力的体现。

    - 7、仅仅是把货物卖出去不算完成销售，必须把钱收回来，才算销售完成。收不回来钱，一切等于零。

    - 8、一定要给顾客讲有含金量的东西，一定要学会创造价值，为顾客创造他需要的价值。客户认为值了，自然就买单了。

    - 9、所有的事物，都要学会去链接。情感的关系大于利益关系和合作关系，要与顾客有深层次的情感交流。把一切美好事物都链接到你的产品与服务上去。

    - 10、顾客买的不仅是产品本身，更买产品相应的及额外的服务，多宣传宣传你会提供什么额外服务。

    - 11、不要得罪人，只管赚钱。做销售不要与客户发生矛盾，就算你碰到很不礼貌的顾客，也不要与其发生矛盾。

    - 12、你永远没有第二次机会给顾客建立自己的第一印象。所以，随时随地保持好自己的好形象。顾客不会在一个看起来很讨厌的人那里买单的。

