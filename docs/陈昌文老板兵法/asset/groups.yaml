    你之所以能盈利，是因为你看准了人民需求的脉搏、人民欲望的脉搏。一切不研究人民心理真实需求的人，都不能做大做强企业。


    性是人民所需求的东西，所以，黄色文化屡禁不止。淘宝网、饿了么、滴滴打车，是人民方便的工具，也可以说是人民懒惰的工具。人类的欲望还有很多，你做的产品必须符合人民的欲望。


    凡是大大上、超越人类世俗需求的创新与创业都是逆人类的，都是自取灭亡。老百姓吃喝拉撒玩乐睡就是消费社会、市民社会的特征，是推动历史进步的力量，也是最赚钱的几个点。忽然想起了一条毛主席语录：马克思主义的道理，千头万绪归根结底，就是一句话，“造反有理。”有了这个道理，于是就革命、就造反、就干社会主义。


    创业也有理，发财也有理，做营销也是这个理：乱搞乱发财。不要怕乱，怕不搞。动力是一切的根本，一个人就怕没动力。我以前跟一个营销经理聊天谈到一个问题，什么样的销售员才是好的销售员？不是技巧好，也不是会讲话，也不是经验丰富，而是其动力十足，一直都是打电话，跑业务，只要他不停下来，他的业绩必然是最好的。我经历了好几个公司，不管是卖建筑材料的，还是做网络营销的，那些业绩最好的营销人员，都是动力十足的人，没有例外。


