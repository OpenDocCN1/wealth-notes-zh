    # 10、如何骂了人，还要让他接受


    假如你的老婆某一天回家很晚，比如晚上12点回家的。你非常生气，觉得她太过分了。于是，你早上说，“老婆，我是很爱你的，但是我非

    常生气，你为什么昨天那么晚才回家，你又没打电话，你去了哪里？”

    那么这种讲话方式通常会让你的老婆把前面那句，“老婆，我是很爱你的”忽略。而后面那句“我非常生气”，她就听得很清楚。还有那句：“你去哪里了？”她则认为你在审问她！所以，马上，你老婆就会变成会

    计师，清算你以前回家晚的罪过，甚至，还会翻出来很多其他的旧账。或者，

    她会变身成律师，对你说“你要相信我啊，两个人在一起就是要相互信

    赖。”结果就是你有罪，她反而是对的了。你的本意是想让你老婆早

    回家，让她理解你的感受，但由于你讲话的方式不对，反而起了反作用。

    正确的沟通方式是你应该把那一句话的前半部与后半部对调。你应该说，

    “老婆，我很生气，你昨天晚上那么晚才回家，你又没有打电话回来，

    但是我还是很爱你！”这种讲话方式会让老婆听了后觉得你很爱她。


    语言就是魔鬼的工具，谁完全理解了讲话的艺术，谁就能操纵世界。'
  - '[PAGE 227]


    开始讲的这个方法叫做糖衣效应。把苦的药藏在糖衣里面，好让她容易吞下去。就好像我们小时候，妈妈为了让我们吃苦的药，就用糖果来诱惑我们，一样的道理。你认为妈妈会不会叫你先吃了糖果，再吃苦药？除非妈妈傻。人类的记忆往往是记住最新鲜的，最近的事情与感受。因此，我们做人做事、讲话、好的东西，都要留在最后才拿出来。


    所以，作为老板，要清楚骂人的目的是什么？不要纯粹是为了骂而骂，要为了对方改变而讲话。这些先批评，后表扬与肯定的方法，也是我经常拿来教育员工的。当然在营销的过程中，我也会先给客户介绍产品的缺点，然后再介绍产品的优点。


    # 11、如何管理自己的核心谋士


    凡是成大事者，都必须找到自己的核心谋士。领导者的本事，是发现问题、提出问题、指出大方向。但解决问题是要留给他核心谋士的。比如，刘备提出兴复汉室的大方向，找诸葛亮来想方案，给答案。宋江要聚天行道，由吴用来想方案，想答案。朱元璋找到了刘伯温，曹操找到了郭嘉、司马懿。孙权找到了周瑜、陆逊。各位当老板的，你们可找到了自己的'
  - '[PAGE 228]


    核心谋士？


    有了核心谋士，如何管理核心谋士更加重要。下过象棋的人都知道，象棋里面的老将边上有个士，那这个士就是谋士的意思。象棋是非常有智慧的。这个士呢，只能在老将周围的九宫格走，不能跑出去。也就是说，做老板的，要随时随地地把谋士带在身边。


    刘备当年为了给关羽报仇，想灭了孙权，就犯了这个大忌。我搞不懂他为什么那一次没有带诸葛亮，看来刘备不会下象棋。象棋中的士是走斜线，按照我们的说法，就是侧着走，不露正脸，为什么呢？因为谋士很聪明，很有才华，他应该在幕后做策划。如果让他露了正脸，底下员工一看，哇，我们老板原来是个白痴，聪明的原来是那个谋士，这就影响老板的权威性，毁坏老板的形象。所以，谋士只能支招，只能提方案，不可以当着大家拍板。拍板的事情只能由老板亲自做。


    永远不要让谋士去基层搞执行。搞好了，谋士信心膨胀，恐怕有自立门户或者取而代之的思想。这还算好的，大多数情况下是谋士经常用脑，只是理论水平高，没有实际工作经验，这样的人是不能到基层去搞执行的。历史上有两个著名的例子，是谋士搞了执行，一个是领导赵国与秦国打长平之战的赵括，惨败后被秦国坑了40万士兵，留下了一个著名的成语，纸上谈兵。另一个是诸葛亮的谋士马谡著名的空城计，就是因为马谡失街亭才唱的。


    总结一下，管理核心谋士要注意的三点。'
  - '[PAGE 229]


    第一，永远把谋士带在身边，让他了解事实，出谋划策。


    第二，不给谋士拍板的权利，不可让谋士露正脸，拍板的权利永远在老板手里。


    第三，不可以让谋士到基层去搞执行，谋士的理论水平高，就利用好谋士的理论水平就行了。


    # 12、老板的三种管理风格，造就三种企业


    不同水平的老板，基本上决定了企业的规模、企业的未来。到底是混尸饭吃呢？还是从优秀到卓越？亦或是基业长青？


    先说第一种老板，靠自己性格管理企业的。想干啥就干啥，想讲啥话就讲啥话。认为自己对了，大家都必须听。完全凭喜怒哀乐拍桌子、瞪眼睛的方法来管理团队。


    我们中国的大多数小企业、小老板，几乎都是这种模式。这样的老板，除非老板本人英明得不得了，个人魅力强到爆炸，能把企业做大。否则，优秀的人才才不愿意跟这样的老板混下去，只能留下一帮混饭吃的跟随者。这种企业呢，几乎就是老板是个强人！与其说是个老板，不如说是'
  - '[PAGE 230]


    个勉强能混饭吃的项目经理，或者说是个小包工头。这种企业也没什么未来。


    第二种老板，知道建设企业制度、定流程、定政策、找管理方法，也知道出一些吸引人才的政策，也有能力引导家人行动。知道做绩效考核，知道给员工定目标，做结果管理、目标管理。这种老板追求的是制度化。西方企业大多都是这样的企业，目前很多中国企业引进的管理模式基本都是这种模式。其实这种企业有很大的毛病，就是越考核，人心越散；指标越精确，员工的满意度越低。这种企业的老板喜欢说，我的目的就是要打造一个自动运转的机器，就算我离开了企业，企业照常运转。岂不知永动机从来没有造成过。


    第三种老板，会做文化的老板。世界上真正的大品牌无一例外都是走文化路线的。走文化路线不是说一开始做规模，后来有钱了才做文化，而是一开始就是做文化起家。这完全是创始人世界观、价值观、人生观的展现。一般就是一句口号就体现了他们企业的宗旨。比如，华为的狼性文化；微软的失败是成功之母！这种文化不断的滋润着每一个进入这个企业里的员工，认同的留下，不认同的走掉，最终形成一种特殊的人群。这种人群就是有这种文化的人的集合。


    只有学会做文化，才能影响到员工的头脑，也能影响到客户的头脑。这就是老板的最高境界，让别人从内心彻底屈服。在这个层次的企业，才能基业长青。在建设制度、定指标、讲绩效这样的境界上，只能做到'
  - '[PAGE 231]


    优秀，最多能做到卓越。靠拍桌子、瞪眼睛、老板牵头做项目的境界上，只能做到混饭吃。


    各位想成为什么样的老板，就选择什么样的手法去经营自己的企业吧。


    # 13、不要跟员工讲道理，只向员工要结果


    凡是想把公司所有事情解决完的老板，都是赚不到钱的老板。把心思只放在公司最赚钱的核心业务上的老板，就是赚大钱的老板。无时无刻的保持研究市场、研究产品、学习知识。


    如果你拒绝这样做，你的竞争对手不会拒绝这样做，你就被淘汰了。


    老板不要太在意小钱，要想如何才能赚到更多的大钱，见小利则大事不成。要让公司的员工有给自己干的感觉。所以，我给公司的每一个员工做市场的机会，每个人都有提成拿，只要你有本事。要为员工考虑未来，如果只考虑自己的未来，那么员工就不会跟你了，特别是优秀的员工。'
  - '[PAGE 232]


    不要以为自己是老板，就可以不上进；不上进就会被社会淘汰，不管你是谁。怎么才叫有胸怀的老板？就是敢把钱与权力分配给优秀的员工的老板。想尽办法让员工开心，奶牛听音乐开心了产奶量、质量都高，人也一样。不要跟员工讲道理，只向员工要结果。越讲道理，越没道理，一要结果，啥都对了，大家都没话说。


    # 14、如何解雇员工


    一般小老板没经验解雇员工，甚至不知道哪些员工应该解雇。由于刚开始，别人都瞧不上你的小公司，招人本来就很难，所以很多老板招聘到了一些本来就找不到工作的人。这些人呢，就在你这个公司混日子。


    老板要明确一件事，只要这个人在一定的时间内不能给公司带来利益，就应该立马解雇。


    解雇任何人都不要闹僵，要好言好语，说明公司的情况，为什么他需要离开，都可以告诉他。也切忌不发员工工资，会导致员工去劳动局告你，甚至在网上散播你们公司的负面信息，导致影响你的业务。'
  - '[PAGE 233]


    每个与你接触的人都是你的活体广告，尽量别给他们做负面广告的理由。老板永远要保持头脑清晰，公司资金紧张了，该裁减员工就迅速做出决断，别拖。越拖钱越少。也别走漏风声，要当机立断。走漏消息的后果往往是节外生枝，麻烦不断。解雇一个人，要讲清楚是公司经营不善造成的，不要怪罪员工无能。告诉员工可以在其他行业找到合适他们的工作，会有前途。


    如果你实在不擅长做解雇的事情，可以培养一个心腹。可以是你的 人事，可以是你们公司的二把手，重要的是要确保他们不会破坏公司的 形象，采取粗暴的解雇员工的方式，他们爽了，背黑锅的是你。对于让
    你背黑锅的团队成员，理应开除，不能让一个坑我们的人留在身边。


    # 15、末位淘汰制的实施策略


    企业必须实行末位淘汰制，就如同古代军队打仗失败，有的人必须 受到斩头的处罚一样。作用之一是激励将士们在战场上拼命杀敌，作用 之二是震慑还没有上战场的人，让他们做好心理准备，必须拼命。很多'
  - '[PAGE 234]


    老板虽然知道这个制度，但不知道怎么用，以下我讲三条实施策略。


    # 第一，分层次淘汰。


    对做得好的人理应给予鼓励，做得不好就必须适当淘汰。但在实际操作中绝不能搞“一刀切”，否则倒霉的一定是基层员工。因此，淘汰应在企业的各个层次展开。经理、主管等各个层次都应有人进行合理流动，这样才能体现末位淘汰制的公平性，不能一淘汰人就只淘汰最基层员工。


    # 第二，合理安排被淘汰人员。


    推行末位淘汰制不能对“末位员工”一栽了事，这样会极大地伤害被淘汰员工的自尊心，也会打击那些仍然在企业内工作的员工的情绪。对于“末位员工”，企业不应从一开始就放弃对他们的帮助和培训，只有当确定他们最终无法实现快速转变或是不能领悟、认同企业的价值观时，才让其转岗、降职，或者走人。


    # 第三，明确末位淘汰的界限，避免形式化，注重实用。


    竞争、淘汰是必须的，但淘汰周期应主要依据企业的人力资源的质量水平而定。当目标已经达到的时候，末位淘汰制就应该缓行，不能为了淘汰而淘汰。通常来说，末位淘汰的周期是最多一年一次，不可太频繁，否则就会出现人人自危的状况。末位淘汰的范围一般以小于5%的比例为宜，即100人的企业，一次淘汰5人。当然，这5个人并不是均匀分布的，有些部门可能一个也没有，而有些部门可能有多个，应视具体情况而定。'
  - '[PAGE 235]


    如果企业能够招聘到非常优秀的人才，那么可以加大淘汰力度。有些老板狠不下来看心，这是不对的。企业不是养老院，不是慈善机构。能者上，庸者下。企业必须要有人员流动，有新来的人刺激公司的老员工。有差的人离开，这样留下来的人才会警惕。铁打的营盘，流水的兵，只要保证公司的核心骨干在，并且不断培养核心骨干的后备队伍，企业就能健康发展。


    # 16、哪几种员工必须裁掉


    现在这个社会，赚钱再也不是靠人多，而是要靠精英。所以各位老板不能再以前面 10 年的思想来经营自己的企业。现在很多人好像是读了大学，但实际上他们的意识形态却是把自己当成一个工厂工人。目前社会竞争激烈，要想公司发展得好、利润高，在这个互联网社会立于不败之地，几种跟不上时代的员工必须开除或者不要招聘进公司。


    第一，想过朝九晚五的安逸生活，还想要双休的人，还要高薪水的人，不要招聘进公司。其实算算他要底薪，要双休，要朝九晚五都不要招聘'
  - '[PAGE 236]


    进公司。因为会影响一个不断奋进的团队，给团队树立不好的榜样。


    第二，想靠高低薪生活的人。特别是销售岗位、推广岗位，居然有的人要求高薪水，很是搞笑，这些岗位就是靠能力吃饭的，靠提成吃饭的。能零底薪就零底薪，尽量高提成就行了。


    第三，来公司图稳定，没有企图心，不想赚大钱的人。这样的人呢，典型的想找个公司混日子。这样的人适合当门卫，千万别招聘到公司里。


    第四，不能与时俱进学习的人，不善于主动学习新东西的人，不要招聘进公司。


    第五，做事马马虎虎，得过且过，没有精益求精的精神的人，也不要招聘进公司。


    第六，老是给公司找毛病。比如，你让他卖一个产品，他就说这个产品太贵，客户不买；你让他去做一件事情，他就说这件事情有难度，不好做。他不会主动想办法。直接开除。


    现代企业，绝不是拼人多的，而是看哪个企业里精英多。与其招聘一群能把人气死的人，不如招聘一个优秀的人才。特别是互联网行业，一个优秀的人能顶不优秀的10几个人。以前的社会是把企业做大，比规模。以后的企业是把企业做精、做小，比利润。'
  - '[PAGE 237]


    # 17、老板如何处理手握重权的害群之马


    齐景公当年问晏子，就是晏子使楚的那个晏子。说，晏子丞相：你看当国王最怕什么？晏子说：当国王最怕老鼠与狗。齐景公哈哈大笑，我会怕老鼠与狗，你倒是说说。晏子说，我们老家拜祭祖先的时候，上了很多贡品在祖先的牌位面前，但是看到一只大肥老鼠，在上面吃贡品，我又不敢打，不是不敢打老鼠啊，是怕打老鼠，老鼠在祖先的牌位台子上乱跑，我跟着打，把祖先的牌位都给打倒了，这可不得了。这就叫投鼠忌器啊。


    齐景公问，那如何是好？晏子说，好办啊，用其他食物把老鼠诱惑到更加空旷的地方，或者等到它到空旷的地方了，再下手，把老鼠打死。齐景公说，这样讲起来，还真是怕在祖先牌位面前的老鼠啊。


    最近，我有个学员问了我一个问题，说他有个游戏公司，创业的时候呢，这个游戏公司的核心程序被一个程序员拿在手里，而这个家伙老是不听指挥，不服从管理，动不动就以销毁核心程序威胁公司，问我怎么办？'
  - '[PAGE 238]


    我开始的策略就是这种人坚决要杀掉，不管付出多大代价。后来知道投鼠忌器这回事了，就出一个方案，先不动声色的给这个坏蛋程序员招聘一个副手。这个副手的目的就是要拿到这个核心程序，拿到这个核心程序了，就可以直接把这个坏蛋程序员干掉了。


    做大事的人，一定不要冲动，不要感情用事，要用温和的手段处理这些矛盾的事情，把损失降到最小，最大限度的保证自己的利益。要把老鼠引诱到空旷、冷静的地方，一次性就要了它的小命。千万不要与其发生直接冲突，造成自己承担不起的损失。


    # 18、不站在老板立场的员工没前途，没有员工思维的老板做不大


    每个人都想要别人顺从自己的欲望，特别是当老板的，总是希望员工顺从自己的欲望，但很少有员工从内心里顺从老板的欲望。做老板的其实是可以利用这一点的，不要让员工都有非常高的觉悟，要顺从自己的欲望。老板可以顺从员工的欲望，以帮助员工完成心愿的姿态来经'
  md: '

    因为你拿得多，他拿得少（他们丝毫不考虑你的投资风险和机会成本），总认为自己多偷懒才是赚了。这种前提下，你得培养你自己的人、亲情，这些人组成了企业基本的骨架，也就是企业结构的雏形。


    做企业的过程中，你就可以向这个方向去建立你的企业结构，实践这种用人策略。


    ## 8、奖励小功，则大功立；小功不奖，大功不立


    先讲一个故事，就是孔子的弟子子路在一个地方当市长。一天，天下大雨，有个小女孩落水了，子路二话不说，就跳进水里把这个小女孩救起来了。小女孩的父母知道后非常的感动，就把自己家的牛送给了子路。子路毫不客气的把牛收下了，并且杀了，把肉拿去跟着孔子一起吃。孔子一见有肉吃，边吃肉，边表扬子路干得好。这个时候，孔子的另一个弟子子贡来了，子贡是个有钱的大商人，就对孔子说，老师，你这样表扬子路是不对的，我们应该做好事不留名，怎么还要拿别人家的东西呢？子路这个道德境界太低了。


    孔子就说，你懂什么懂？如果子路拒绝别人的牛，那么以后谁又愿意见义勇为，救人于危难？道德境界高的人自然是要救人的。如果有好处，那么道德境界低的人也会去救人。子路的做法，会让道德境界高的与道德境界低的人都去救人。而子贡你的做法，恐怕弄到最后，都没人去救人了。


    由此可见孔夫子是非常高明的。我想为什么现代社会，大家都怕扶老奶奶？因为有可能被老奶奶敲诈，所以出现了老奶奶摔倒，大家都上前围观也不愿意扶她起来的现象。甚至更加严重的是，现在很多人见到老奶奶，都离得远远的，就怕万一倒了，说不清楚。其实出现这种问题，就是因为榜样没有树立好。当初有几个案子，都判了扶老奶奶的人赔偿老奶奶，所以造成了现在一个社会恶果。


    这些案例跟我们做企业的关系实际是非常大的。比如，我们在企业里，一定要对一些立小功的人奖励，那么才有人愿意不断的立功来争取更多的奖励。如果我们对小功不奖励，那么最后就没有人积极的争取立功了。我们不但要奖励立小功的，还要宣传立小功的，让企业团队里的每一个人都有这个意识，只要我做出了成绩，就一定会受到奖励。企图靠员工境界高、不给利益也干活的老板是糊涂老板。员工立功，给了奖励，升了官，不宣传的老板是管理能力有缺陷的老板。只有告诉大家，干得好的，立了功的，都有奖励，都能升官，大家才会热火朝天的干。


    有一种老板，只知道对员工提道德境界的要求，不给员工实际奖励，企图让员工拼命给他干，这样的老板，就是脑子进水了的老板，是违背人性的。这样的老板在这个社会还不少。


    所以大家记住：奖励小功，则大功立，小功不奖，大功不立。


    ## 9、哪些员工是合格的，哪些员工是不合格的


    其实当员工也必须与时俱进，老思想的员工应该被淘汰。如果不淘汰这些员工，那么企业就会被社会淘汰。每一个历史时期，所用员工的标准，都有所变化。


    公司里总有一些人经常闲着无事可干，老板走过去询问原因，他就说：“您安排的事情做完了，没事啦。”这样的人每个公司都存在。他们认为，做完老板安排的事情就很不错了。然而，在现代企业里，虽然听命行事相当重要，但是个人主动进取的精神更重要。


    因为在市场经济时代，昔日那种听命行事的员工已经失去竞争优势了，你不努力工作，而有的是人没日没夜的干活，比如阿里巴巴、腾讯这些公司，真的就是晚上也在工作。这些企业非常优秀，是因为有一帮拼命的员工。当老板的，必须把员工调教到这种程度，如果一个员工不能为企业带来利益，那么必须开除。


    今天企业需要的是那种不必老板交代，就自动自发去工作的人。


    有两种人注定一事无成，一种是除非别人要他去做，否则绝不会主动做事的人。这种员工招聘进公司了，经过一段时间的培训与改造，依旧不改变，应该开除。其实真正聪明的老板是直接不招聘这样的人进公司，不培训，因为培训也是成本。


    另外一种人则是即使别人要他做，他也做不好事情的人。这种人通常是做事不上心的人。那些不需要别人催促，就会主动去做应该做的事，而且不会半途而废的人必定成功。这种人懂得要求自己多努力一点，多付出一点，而且比别人预期的还要多，这是我们要的员工。很多老板讲，这样的员工难找，确实是我刚开始创业的时候，因为员工不好找，我的高标准就降低了，招聘了很多我不喜欢的员工。后来呢，我实在受不了他们，就一个一个的把这样的人开除了，只留下符合我心意的员工。我发现，这样公司的利润反而更高，大家在一起工作更开心。


    特别是现在互联网经济，根本不是人越多越好，而是人越精越好。曹操讲了，兵不在多而在精，将不在勇而在谋！


    曾有一段佳话，1992年，当卫哲还在上海外国语大学就读的时候，他曾到万国证券勤工俭学。他翻译的一份年报得到了万国总裁管金生的肯定，管金生表示一定要见见这个年轻人。就是这次见面，让卫哲成为了中国证券之父管金生的秘书。


    与一般秘书不同的是，卫哲工作时非常主动积极，想老板之所想，急老板之所急。刚开始管金生只是让卫哲翻译年报，剪剪报纸，这些事情对于一般人来说是小事，但是卫哲却把它当成大事，做足了工夫。卫哲十分留心在那么多的剪报中哪些是老板看过的，然后进行引导。这些事情，老板没有要求他这么做，到后来，管金生不看剪报，中午就吃不下饭。


    作为秘书，卫哲要做给老板端茶倒水这样的小事，他也琢磨出很多技巧。比如开会时，什么时候去倒茶水，才不会打断老板讲话的激情；什么时候倒水不加茶叶，什么时候该带着茶叶进去；老板有抽烟的习惯，什么时候打火机里的油没了该换个打火机，卫哲都把握得很有分寸。经过一段时间的观察，管金生认识到，如果再让卫哲做复印、倒水、剪报等事情，就是屈才。于是，24岁的卫哲出任上海万国证券公司资产管理总部的副总经理，成为当时国内证券界最年轻的副总。


    如果从普通员工的角度来讲，他们喜欢说，这个世界缺乏机会，其实，世界从来不缺乏机会。每个老板手里、银行卡里、支付宝上都有大量现金，就是想给这些人人才，可惜很难找到这样上心的人才来赚我们的钱。从老板的角度来说，我们必须找到这样的人才，必须培养这样的人才。


    ## 10、如何骂了人，还要让他接受


    假如你的老婆某一天回家很晚，比如晚上12点回家的。你非常生气，觉得她太过分了。于是，你早上说，“老婆，我是很爱你的，但是我非常生气，你为什么昨天那么晚才回家，你又没打电话，你去了哪里？”那么这种讲话方式通常会让你的老婆把前面那句，“老婆，我是很爱你的”忽略。而后面那句“我非常生气”，她就听得很清楚。还有那句：“你去哪里了？”她则认为你在审问她！所以，马上，你老婆就会变成会计师，清算你以前回家晚的罪过，甚至，还会翻出来很多其他的旧账。或者，她会变身成律师，对你说“你要相信我啊，两个人在一起就是要相互信赖。”结果就是你有罪，她反而是对的了。你的本意是想让你老婆早回家，让她理解你的感受，但由于你讲话的方式不对，反而起了反作用。


    正确的沟通方式是你应该把那一句话的前半部与后半部对调。你应该说，“老婆，我很生气，你昨天晚上那么晚才回家，你又没有打电话回来，但是我还是很爱你！”这种讲话方式会让老婆听了后觉得你很爱她。


    语言就是魔鬼的工具，谁完全理解了讲话的艺术，谁就能操纵世界。


    开始讲的这个方法叫做糖衣效应。把苦的药藏在糖衣里面，好让她容易吞下去。就好像我们小时候，妈妈为了让我们吃苦的药，就用糖果来诱惑我们，一样的道理。你认为妈妈会不会叫你先吃了糖果，再吃苦药？除非妈妈傻。人类的记忆往往是记住最新鲜的，最近的事情与感受。因此，我们做人做事、讲话、好的东西，都要留在最后才拿出来。


    所以，作为老板，要清楚骂人的目的是什么？不要纯粹是为了骂而骂，要为了对方改变而讲话。这些先批评，后表扬与肯定的方法，也是我经常拿来教育员工的。当然在营销的过程中，我也会先给客户介绍产品的缺点，然后再介绍产品的优点。


    ## 11、如何管理自己的核心谋士


    凡是成大事者，都必须找到自己的核心谋士。领导者的本事，是发现问题、提出问题、指出大方向。但解决问题是要留给他核心谋士的。比如，刘备提出兴复汉室的大方向，找诸葛亮来想方案，给答案。宋江要聚义天行道，由吴用来想方案，想答案。朱元璋找到了刘伯温，曹操找到了郭嘉、司马懿。孙权找到了周瑜、陆逊。各位当老板的，你们可找到了自己的核心谋士？


    有了核心谋士，如何管理核心谋士更加重要。下过象棋的人都知道，象棋里面的老将边上有个士，那这个士就是谋士的意思。象棋是非常有智慧的。这个士呢，只能在老将周围的九宫格走，不能跑出去。也就是说，做老板的，要随时随地地把谋士带在身边。


    刘备当年为了给关羽报仇，想灭了孙权，就犯了这个大忌。我搞不懂他为什么那一次没有带诸葛亮，看来刘备不会下象棋。象棋中的士是走斜线，按照我们的说法，就是侧着走，不露正脸，为什么呢？因为谋士很聪明，很有才华，他应该在幕后做策划。如果让他露了正脸，底下员工一看，哇，我们老板原来是个白痴，聪明的原来是那个谋士，这就影响老板的权威性，毁坏老板的形象。所以，谋士只能支招，只能提方案，不可以当着大家拍板。拍板的事情只能由老板亲自做。


    永远不要让谋士去基层搞执行。搞好了，谋士信心膨胀，恐怕有自立门户或者取而代之的思想。这还算好的，大多数情况下是谋士经常用脑，只是理论水平高，没有实际工作经验，这样的人是不能到基层去搞执行的。历史上有两个著名的例子，是谋士搞了执行，一个是领导赵国与秦国打长平之战的赵括，惨败后被秦国坑了40万士兵，留下了一个著名的成语，纸上谈兵。另一个是诸葛亮的谋士马谡著名的空城计，就是因为马谡失街亭才唱的。


    总结一下，管理核心谋士要注意的三点。


    - 第一，永远把谋士带在身边，让他了解事实，出谋划策。

    - 第二，不给谋士拍板的权利，不可让谋士露正脸，拍板的权利永远在老板手里。

    - 第三，不可以让谋士到基层去搞执行，谋士的理论水平高，就利用好谋士的理论水平就行了。


    ## 12、老板的三种管理风格，造就三种企业


    不同水平的老板，基本上决定了企业的规模、企业的未来。到底是混尸饭吃呢？还是从优秀到卓越？亦或是基业长青？


    先说第一种老板，靠自己性格管理企业的。想干啥就干啥，想讲啥话就讲啥话。认为自己对了，大家都必须听。完全凭喜怒哀乐拍桌子、瞪眼睛的方法来管理团队。


    我们中国的大多数小企业、小老板，几乎都是这种模式。这样的老板，除非老板本人英明得不得了，个人魅力强到爆炸，能把企业做大。否则，优秀的人才才不愿意跟这样的老板混下去，只能留下一帮混饭吃的跟随者。这种企业呢，几乎就是老板是个强人！与其说是个老板，不如说是个勉强能混饭吃的项目经理，或者说是个小包工头。这种企业也没什么未来。


    第二种老板，知道建设企业制度、定流程、定政策、找管理方法，也知道出一些吸引人才的政策，也有能力引导家人行动。知道做绩效考核，知道给员工定目标，做结果管理、目标管理。这种老板追求的是制度化。西方企业大多都是这样的企业，目前很多中国企业引进的管理模式基本都是这种模式。其实这种企业有很大的毛病，就是越考核，人心越散；指标越精确，员工的满意度越低。这种企业的老板喜欢说，我的目的就是要打造一个自动运转的机器，就算我离开了企业，企业照常运转。岂不知永动机从来没有造成过。


    第三种老板，会做文化的老板。世界上真正的大品牌无一例外都是走文化路线的。走文化路线不是说一开始做规模，后来有钱了才做文化，而是一开始就是做文化起家。这完全是创始人世界观、价值观、人生观的展现。一般就是一句口号就体现了他们企业的宗旨。比如，华为的狼性文化；微软的失败是成功之母！这种文化不断的滋润着每一个进入这个企业里的员工，认同的留下，不认同的走掉，最终形成一种特殊的人群。这种人群就是有这种文化的人的集合。


    只有学会做文化，才能影响到员工的头脑，也能影响到客户的头脑。这就是老板的最高境界，让别人从内心彻底屈服。在这个层次的企业，才能基业长青。在建设制度、定指标、讲绩效这样的境界上，只能做到优秀，最多能做到卓越。靠拍桌子、瞪眼睛、老板牵头做项目的境界上，只能做到混饭吃。


    各位想成为什么样的老板，就选择什么样的手法去经营自己的企业吧。


    ## 13、不要跟员工讲道理，只向员工要结果


    凡是想把公司所有事情解决完的老板，都是赚不到钱的老板。把心思只放在公司最赚钱的核心业务上的老板，就是赚大钱的老板。无时无刻的保持研究市场、研究产品、学习知识。


    如果你拒绝这样做，你的竞争对手不会拒绝这样做，你就被淘汰了。


    老板不要太在意小钱，要想如何才能赚到更多的大钱，见小利则大事不成。要让公司的员工有给自己干的感觉。所以，我给公司的每一个员工做市场的机会，每个人都有提成拿，只要你有本事。要为员工考虑未来，如果只考虑自己的未来，那么员工就不会跟你了，特别是优秀的员工。


    不要以为自己是老板，就可以不上进；不上进就会被社会淘汰，不管你是谁。怎么才叫有胸怀的老板？就是敢把钱与权力分配给优秀的员工的老板。想尽办法让员工开心，奶牛听音乐开心了产奶量、质量都高，人也一样。不要跟员工讲道理，只向员工要结果。越讲道理，越没道理，一要结果，啥都对了，大家都没话说。


    ## 14、如何解雇员工


    一般小老板没经验解雇员工，甚至不知道哪些员工应该解雇。由于刚开始，别人都瞧不上你的小公司，招人本来就很难，所以很多老板招聘到了一些本来就找不到工作的人。这些人呢，就在你这个公司混日子。


    老板要明确一件事，只要这个人在一定的时间内不能给公司带来利益，就应该立马解雇。


    解雇任何人都不要闹僵，要好言好语，说明公司的情况，为什么他需要离开，都可以告诉他。也切忌不发员工工资，会导致员工去劳动局告你，甚至在网上散播你们公司的负面信息，导致影响你的业务。


    每个与你接触的人都是你的活体广告，尽量别给他们做负面广告的理由。老板永远要保持头脑清晰，公司资金紧张了，该裁减员工就迅速做出决断，别拖。越拖钱越少。也别走漏风声，要当机立断。走漏消息的后果往往是节外生枝，麻烦不断。解雇一个人，要讲清楚是公司经营不善造成的，不要怪罪员工无能。告诉员工可以在其他行业找到合适他们的工作，会有前途。


    如果你实在不擅长做解雇的事情，可以培养一个心腹。可以是你的行事，可以是你们公司的二把手，重要的是要确保他们不会破坏公司的形象，采取粗暴的解雇员工的方式，他们爽了，背黑锅的是你。对于让你背黑锅的团队成员，理应开除，不能让一个坑我们的人留在身边。


    ## 15、末位淘汰制的实施策略


    企业必须实行末位淘汰制，就如同古代军队打仗失败，有的人必须受到斩头的处罚一样。作用之一是激励将士们在战场上拼命杀敌，作用之二是震慑还没有上战场的人，让他们做好心理准备，必须拼命。很多老板虽然知道这个制度，但不知道怎么用，以下我讲三条实施策略。


    ### 第一，分层次淘汰。


    对做得好的人理应给予鼓励，做得不好就必须适当淘汰。但在实际操作中绝不能搞“一刀切”，否则倒霉的一定是基层员工。因此，淘汰应在企业的各个层次展开。经理、主管等各个层次都应有人进行合理流动，这样才能体现末位淘汰制的公平性，不能一淘汰人就只淘汰最基层员工。


    ### 第二，合理安排被淘汰人员。


    推行末位淘汰制不能对“末位员工”一栽了事，这样会极大地伤害被淘汰员工的自尊心，也会打击那些仍然在企业内工作的员工的情绪。对于“末位员工”，企业不应从一开始就放弃对他们的帮助和培训，只有当确定他们最终无法实现快速转变或是不能领悟、认同企业的价值观时，才让其转岗、降职，或者走人。


    ### 第三，明确末位淘汰的界限，避免形式化，注重实用。


    竞争、淘汰是必须的，但淘汰周期应主要依据企业的人力资源的质量水平而定。当目标已经达到的时候，末位淘汰制就应该缓行，不能为了淘汰而淘汰。通常来说，末位淘汰的周期是最多一年一次，不可太频繁，否则就会出现人人自危的状况。末位淘汰的范围一般以小于5%的比例为宜，即100人的企业，一次淘汰5人。当然，这5个人并不是均匀分布的，有些部门可能一个也没有，而有些部门可能有多个，应视具体情况而定。


    如果企业能够招聘到非常优秀的人才，那么可以加大淘汰力度。有些老板狠不下来看心，这是不对的。企业不是养老院，不是慈善机构。能者上，庸者下。企业必须要有人员流动，有新来的人刺激公司的老员工。有差的人离开，这样留下来的人才会警惕。铁打的营盘，流水的兵，只要保证公司的核心骨干在，并且不断培养核心骨干的后备队伍，企业就能健康发展。


    ## 16、哪几种员工必须裁掉


    现在这个社会，赚钱再也不是靠人多，而是要靠精英。所以各位老板不能再以前面10年的思想来经营自己的企业。现在很多人好像是读了大学，但实际上他们的意识形态却是把自己当成一个工厂工人。目前社会竞争激烈，要想公司发展得好、利润高，在这个互联网社会立于不败之地，几种跟不上时代的员工必须开除或者不要招聘进公司。


    - 第一，想过朝九晚五的安逸生活，还想要双休的人，还要高薪水的人，不要招聘进公司。其实算算他要底薪，要双休，要朝九晚五都不要招聘进公司。因为会影响一个不断奋进的团队，给团队树立不好的榜样。

    - 第二，想靠高低薪生活的人。特别是销售岗位、推广岗位，居然有的人要求高薪水，很是搞笑，这些岗位就是靠能力吃饭的，靠提成吃饭的。能零底薪就零底薪，尽量高提成就行了。

    - 第三，来公司图稳定，没有企图心，不想赚大钱的人。这样的人呢，典型的想找个公司混日子。这样的人适合当门卫，千万别招聘到公司里。

    - 第四，不能与时俱进学习的人，不善于主动学习新东西的人，不要招聘进公司。

    - 第五，做事马马虎虎，得过且过，没有精益求精的精神的人，也不要招聘进公司。

    - 第六，老是给公司找毛病。比如，你让他卖一个产品，他就说这个产品太贵，客户不买；你让他去做一件事情，他就说这件事情有难度，不好做。他不会主动想办法。直接开除。


    现代企业，绝不是拼人多的，而是看哪个企业里精英多。与其招聘一群能把人气死的人，不如招聘一个优秀的人才。特别是互联网行业，一个优秀的人能顶不优秀的10几个人。以前的社会是把企业做大，比规模。以后的企业是把企业做精、做小，比利润。


    ## 17、老板如何处理手握重权的害群之马


    齐景公当年问晏子，就是晏子使楚的那个晏子。说，晏子丞相：你看当国王最怕什么？晏子说：当国王最怕老鼠与狗。齐景公哈哈大笑，我会怕老鼠与狗，你倒是说说。晏子说，我们老家拜祭祖先的时候，上了很多贡品在祖先的牌位面前，但是看到一只大肥老鼠，在上面吃贡品，我又不敢打，不是不敢打老鼠啊，是怕打老鼠，老鼠在祖先的牌位台子上乱跑，我跟着打，把祖先的牌位都给打倒了，这可不得了。这就叫投鼠忌器啊。


    齐景公问，那如何是好？晏子说，好办啊，用其他食物把老鼠诱惑到更加空旷的地方，或者等到它到空旷的地方了，再下手，把老鼠打死。齐景公说，这样讲起来，还真是怕在祖先牌位面前的老鼠啊。


    最近，我有个学员问了我一个问题，说他有个游戏公司，创业的时候呢，这个游戏公司的核心程序被一个程序员拿在手里，而这个家伙老是不听指挥，不服从管理，动不动就以销毁核心程序威胁公司，问我怎么办？


    我开始的策略就是这种人坚决要杀掉，不管付出多大代价。后来知道投鼠忌器这回事了，就出一个方案，先不动声色的给这个坏蛋程序员招聘一个副手。这个副手的目的就是要拿到这个核心程序，拿到这个核心程序了，就可以直接把这个坏蛋程序员干掉了。


    做大事的人，一定不要冲动，不要感情用事，要用温和的手段处理这些矛盾的事情，把损失降到最小，最大限度的保证自己的利益。要把老鼠引诱到空旷、冷静的地方，一次性就要了它的小命。千万不要与其发生直接冲突，造成自己承担不起的损失。


