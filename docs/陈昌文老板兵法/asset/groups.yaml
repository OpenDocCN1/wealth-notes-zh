    # 1、现代营销学的方向是什么


    现代营销越来越向心理学靠拢，追其原因，一方面是因为社会生产力的发展，人们的基本需求已经得到满足；另一方面是竞争激烈，导致卖方不得已，要玩出许多花样来，不再是那个以产品为导向，“便宜量又足”就能立足的时代了！不过这话得有所保留，便宜量又足在任何时代都是有竞争力的，因为穷人总是很多。但聪明的老板不赚穷人的钱，因为穷人的钱要拿去生存。这个时代你要赚取高利润，就要研究现代营销学的方向，那就是心理学，要满足的是富人的精神需求。


    这就要说象征性消费。是人，就有自然属性，有社会属性。自然属性顾名思义，就是自然赋予的属性，比如食色性也，比如对安全的需要，比如保暖的需要……简单解释，一个婴儿被丢到一个孤岛上，从小别让他接触任何人，脱离人类社会，这种情况下他的需求就对应着他的自然属性。


    社会属性，就是人类社会，其他人赋予的属性。比如穿衣服。原始目的只是为了保暖，那你为什么不披一床棉被呢？你知道什么是美，什'
  md: '

    ## 9、如何带出虎狼之师、有竞争力的团队


    中国古代练武，有一句话，叫“练武不练功，到老一场空”。这是什么意思呢？就是说，你练武，不要只学一个样子，而是要扎扎实实地下的真功夫，不然只是个花架子，没啥用处。


    打个比喻，很多家长都希望自己的孩子有活力，勤奋学习。他就到处去请教方法、别人的经验，回到家，就用到孩子身上，希望孩子改变。而他自己呢，却是个死气沉沉的人，一转身，就去打麻将、看电视剧、吹牛去了。这个孩子怎么会变得有活力还勤奋好学呢？而如果家长自己是个有活力，并且一回到家里就勤奋学习、看书、每时每刻都在拼搏的人，那么这个孩子不需要方法、技巧、别人的经验来让他变得有活力，他自然就会有样学样。


    带团队也是这样，团队领导本身违反自己制定的规章制度，实际上大多数规章制度都是领导先带头违反的。工作又不上心，不努力，而企图让团队成员发自内心的遵守规章制度，工作拼命，显然是不现实的。


    我们要想尽办法去感染团队成员，这就需要内功，而不是表面的技巧、方法、规章制度。


    我读历史，发现那些创造了战争奇迹的将军往往都是身先士卒、披坚执锐，与士兵同甘共苦，比士兵做得更好。比如，战国初期的军事家吴起，带头与士兵一起吃饭，穿一样的衣服，睡在一起，行军不骑马而与士兵一起走路，打仗与士兵一起背粮食。这样的将军，就是有内功的将军，是有领导力的将军。他要求下属做到的，他做得更好，这样带出来的军队就士气高涨。所以，吴起在魏国带兵时，用
    5 万军队就能干翻秦国 50 万军队。大家有兴趣可以关注一下吴起这段历史，学学牛人是怎么带团队的。


    在西方战争史上，也有一位战争天才，叫汉尼拔·巴卡，也是一个身先士卒的人。行军的时候步行在军队前面，最苦最累的活抢着干。每个士兵都希望跟着这样的将军，汉尼拔的对手是强大的罗马军团！汉尼拔同样取得过非常多的以少胜多的战争奇迹。


    举这些例子，我的意思是我们要想尽办法去感染团队成员，而不是用打卡机、企业规章制度去限制团队成员，强迫他们多早来，多晚走。比如，我每天就是 5 点起床，基本的吃饭、洗脸完毕就开始工作，一直忙到晚上
    11 点的样子。团队成员看到我这样拼，自己也就不好意思拖拖拉拉的了，再差，他们也做到我 80% 的样子。这 80% 可是发自内心的工作，比那些只是表面敷衍完成工作的人效率高，效果好，自然工作成绩也越来越好。这其实是感染力、领导力。英雄所见略同，英雄所干的事情也略同！


    发财是极其容易的一件事，为什么？因为大部分人都喜欢做表面功夫，能把功夫落到实处的人很少。因为要落到实处，得靠自己真刀真枪地上去干，这会很累、很苦。所以大部分人都希望追求到一个技巧、方法，来快速让自己发财。岂不知，这是缘木求鱼。我很早就明白了一个道理，只要稍微上心，稍微舍得吃苦，自己做好表率，用这种精神去感染团队，在中国是很容易混出人头地的。


    凡是在这个社会上有成就的人，不是比你有多聪明，有多会耍花招，也不是比你学历高，不是你技术好，都是比的领导力、感染力。你必须要让团队成员发自内心的跟着你拼，愿意为你的梦想买单。而要做到这点，就是你必须身体力行，别无他法。


    大道至简，道理讲透彻了就是这么无聊，但这就是绝招。


    ## 10、什么样的团队才能稳定发展


    很多老板拥有一个小团队之后，就再也发展不起来了，不管是企业利润，还是企业规模，都碰到瓶颈，搞不清楚为什么。


    这个世界上最稳定的结构不是上海的金茂大厦，也不是美国的五角大楼，而是埃及的金字塔，到现在已经 4500 年了。如果用少量的炸药炸金茂大厦或者五角大楼的某些局部，那么这些大厦都会倒塌。但如果你用同样的炸药去炸埃及金字塔，你放到任意位置，都不会对金字塔的稳定有任何影响。


    金字塔这种四面体是宇宙中最稳定的结构，它有四个面相互支撑，各司其职。


    我本人做过很长时间的业务员，所以，心里面就认为业务员非常重要，甚至认为公司只要有业务员就够了。能拉来单子就有饭吃，所以我刚做企业的时候，跟着我的全部是业务员，公司也能有盈利。打电话招聘也是业务员去搞，交社保，办理各种证件，也是业务员代劳。认为除了业务员，其他人员都没什么用。可以想象公司的管理混乱，制度建设什么的根本就没有。


    后来狠心花了大价钱找来一个懂制度建设的人事经理。经过他的努力，公司的人不迟到，不早退，偶尔还有活动举办，其乐融融，并且发现公司的运营效率比以前高了。忽然之间我明白了点什么，就又招聘来一个运营经理、一个策划经理，公司的运作效率与广告效果都有显著提升。整体来讲，公司是由两个重要部分组成的，一个是前面打仗的业务员，一个是后面搞后勤的运营、策划、人事、财务等。必须要大家技能互补、性格互补，公司才能发展壮大，实现高盈利，企业也才会越来越稳定。就如同我前面讲的金字塔是由四个面组成的一样，一个团队也至少由四个面组成。


    如果你的团队全部是业务员，就意味着你只有一个面，你这个企业就很不稳定，就别谈发展壮大的问题了。所以，我现在做任何一个项目，都会尽快给这个项目团队配上四个面的人才。需要说明的是，配齐四个面可能需要一两年，因为招聘到合适的人靠我们努力，也靠缘分。有的人不合格也是要换下来的。


    总结一下，团队想要发展壮大，就需要多方面人才的配合，而不是单一方面的人才。很多老板只喜欢跟自己一样的人，这是发展的大忌，企业是一个生态系统，尽快让技能互补、性格互补的人相互配合，才能发展壮大。


    ## 11、为什么你定的方案执行不下去


    很多老板喜欢讲执行力、企业文化、企业利益。不管你讲什么，你的目的，员工心里跟明镜似的，就是想让大多数多干少拿钱，只有极度愚蠢的人才能被你洗脑，把你的方案执行好。但这本身就是个悖论，极度愚蠢的人是不会把事情干好的。他们能干好的事情，也就赚不了几个钱。这种老板就叫小聪明，就是聪明反被聪明误。


    真正聪明的人，是不会多干活，少拿钱的。聪明的人要的是真金白银的利益。当老板的都是聪明人，就是希望低投入，高产出。如果你不是这样的心智模式，你就不是一个正常的商人。说白了，我们只是定制好一个方案了，这个方案是满足老板本人的利益了，可你有没有考虑过执行人的利益？反正做得好，做不好，都是那么多工资的话，我保证，你这个企业就快朝不保夕了。


    一项重要的工作，必定是要执行者与这件事情的成败利益相关，最重要的工作，当然只有股东层面的人才能做好。这是机制决定的，不是什么执行力、企业文化所能扭转的。次一点重要的工作，比如要公司的总经理去执行，他执行不好，就要下课，这是威胁；执行好了就要奖励，这是利诱。他很在意这些东西，他才能执行好。


    其实就是你必须考虑到执行人的利益。当老板，千万别用架子去压人。别讲些冠冕堂皇的话，真正大师级的老板，就是句句讲真话，句句关心每个人的利益。绝不浮夸，忽悠别人干活。没有人能被你忽悠，最终你只能忽悠你自己。每个人都是为了自己，没有人会为了公司，包括老板自己，都是为了自己才建立公司的。不敢承认这点的，讲得冠冕堂皇的人，你们自己去想。


    很多打工的，在企业里面为老板出谋划策，出了很多好方案，结果事情不仅没办好，还弄得到处树敌，混得越来越惨。为什么？就是因为，很多高级知识分子只知道一心为老板考虑，为企业考虑，为了把事情做好考虑，他不知道企业利益与公司管理人员的利益是不是重合的。企业利益与老板的利益其实也不是重合的，管理人员的利益与老板的利益也不是重合的。你每出一个方案，其实都是牵一发而动全身，影响到很多人的利益，你这个方案损害了别人的利益，别人就要反对，能执行得好吗？你这个方案让有实权的人获益了，那么就执行顺利。如果仅仅是让没实权的人获益，讲得再好，估计也难以奏效，执行力就差。必须理清企业的利益脉络，才能做好企业。


    所以，做方案、做管理，最最重要的还是要分清楚那些核心人物的个人利益。谁去执行，执行什么，对谁有益处，只有把这几点搞清楚，不管是自己当老板，还是在别人的企业做高管，都会如鱼得水。如果能明白这些，立马在你公司里找一个问题，写个方案，照顾到实权人物的利益，这种方案多出几个，告诉你，你马上就平步青云，就怕你不理解。


    ## 12、想当好老大，就要拿自己开刀


    如果你只知道对自己的队员很好，而不能指使他们做事，或者只知道溺爱而不能对他们下命令，大家经常违反你定的规章制度，也不能治理，那么你这支团队就成了骄兵，就没法用了。当老大，可以平易近人，可以礼贤下士，但不可骄纵下属。对人有恩惠、谦和，但必须让他们遵守企业的规章制度。


    我们很多人，往往对一个人太好，结果是害人害己，为什么呢？因为一味的只有恩，只有爱，却没有规矩，他就会习惯，并且骄纵，认为理所当然。如果你哪天因为公司的发展要把关系调整过来，他就要跟你闹，不听你的。这时候，你就只好放弃他了，你放弃他，他没了机会，你自己也白培养他了。


    人性就是这样，一旦习惯了恩情没有了，就必然成为仇人。你会说，怎么会有仇啊？我又没伤害他，只是停止了恩情而已。是的，对你来说，是只停止了恩情，可对他来说，却是夺走了既得利益。所以叫恩怨、恩仇。


    没有恩，就没有怨；没有恩，就没有仇，曾经你给了他多大的恩，就有多大的怨，就有多大的仇。


    古代那些成大事的将军，就深知这个道理。所以，李靖说：“畏我者不畏敌，畏敌者不畏我。”也就是说，怕我的，才会不怕敌人。不怕我的，就怕敌人。所以，当将军，一定要比敌人更加可怕，才能指挥军队。吹了号角，冲锋陷阵的，不一定会死；吹了号角，不冲锋的，马上砍死，这样大家才听话。所以，要经常拉一个不听话的人来开刀。


    秦朝末年，陈胜、吴广起义，项梁、项羽也起兵了。天下有野心的年轻人个个蠢蠢欲动。彭越的一些小兄弟找到他，说，你带我们起兵吧，他们行，我们也一定行。彭越不同意，说，现在两虎相争，形势如何发展不清楚，我不想参与你们的事。


    年轻人不依不饶，纠集了 100 多人，一定要让彭大哥打下天下。彭越被逼得没办法，说，好吧，既然大家要干，就明天日出时候，开第一次军事会议，既然要成军，就要立军法，迟到的斩首。第二天中午，彭越等着，小伙子们稀稀拉拉地来了，迟到了十几个人。彭越说，军法是迟到的斩首，可是迟到的太多了，也不能把你们都杀了，就杀最后一个人吧。大家嘻嘻哈哈的说，有这个必要吗？下次知道了。彭越不说话，一个箭步上前，瞬间就杀了最后一个人。众人一看，玩真的啊，吓得都发呆。从此过后，彭越说啥大家就听啥了，最后彭越成为一代豪杰：投靠刘邦后，成为开国公臣。


    再讲斯大林在 1937 年到 1938 年的内部清洗，斯大林本人签署了 681692 人的处决命令。有人说，斯大林把能打仗的将领都杀完了，以至于希特勒打进来时，红军没有能指挥的将领。这个说法不对，斯大林并没有输掉第二次世界大战，恰恰相反，他是二战的大赢家。


    内部清洗，在理论上是保持组织强大的手段。因为这能让队员怕我，不怕敌人。所以，一个组织有必要隔一段时间，就要清洗一回那些不称职的人。今天都在讲反腐，有的人讲：“不反腐要亡国，反腐要亡党。”这是不想反腐的人说的，不反腐才会亡党。把贪官都清洗了，党不会没有用，只会更加强大，更加有生命力。


    总的来说，驾驭组织、驾驭团队的功夫就是恩威并施。这个威，就是要做到让大家怕我，比如带销售团队，必须让业务员怕你，而不是怕客户。如果不怕你，业务员就会不做事，阳奉阴违。出去了也不敢上门拜访客户。这就是为什么很多企业表面一团和气，而业绩很差的原因，是因为带着一帮不做事的业务员。


    狠下心来清洗这些不做事的人，组织与团队的生命力才会越来越强大。


    ## 13、要打破大锅饭，把资源向优秀的人倾斜


    公司要在待遇与报酬上坚定不移地往优秀的员工倾斜，优秀的人存在的目的就是比普通人强。如果不管怎么努力，大家待遇都一样，那么优秀的人就不会行动了，企业就变成平庸，平庸就要倒闭。


    世界上如果没有电位差就没有电力，没有水位差就没有水力。没有温差就没有风，地球就不会有生命。企业里的人都是平等的，就意味着企业死亡。正是因为企业对优秀的员工与普通员工有差异，才启发优秀的员工努力去攀登。优秀的员工努力攀登，企业就有了自动发展的能力。


    公司本来就应该不停的剥离那些不优秀的庸人，把位置、机会、钱都倾斜给那些优秀的冲锋陷阵的人。分几个等级发放年终奖，最差的没有奖金，中间的给少量奖金，对于优秀的员工给大量奖金。要打破每个人的奖金都一样的做法，以能力定奖金，而不是以岗位定奖金。


    奖金平衡的后果就是聪明人都跑了，聪明人最讨厌跟草包拿得一样多。优秀的人最怕你说他跟平庸的人是一样的，他会认为你在侮辱他。


    老板必须让公司里干得好的人明显钱多起来，大家都会努力干了。优秀的人就觉得不用跑了。如此，优秀的人就增加了，企业就发展了。


    用感情、感觉来分配利益的老板是幼稚的老板。慈不掌兵，情不立事，义不理财，善不为官！


    ## 14、员工管理的 4 个层次


    员工管理有 4 个层次。


    **第一个层次：打骂式管理。**


    最初级旳管理者，员工犯错了就骂、就打。当然现在社会，打的情况很少了，但是还是存在。如果是这种管理者，那么他的工作是做不了多好的。还采取这种管理手段的管理者要注意了。员工在这种管理者手下，是非常难过的。能在这种管理者手下工作的人，要么是自己水平实在太差，没办法跑；要么就是在等机会，只要找到个其他工作，立马就跑路了，这样的企业有倒闭的危险。


    **第二个层次：金钱式管理。**


    用奖惩制度来管理员工，这样的管理者，只能算是入门的管理者。如今，大多数中小企业还在采用这种入门级的手段，这种管理，员工对企业没有向心力，就是为了挣个饭钱而已，就是各人自扫门前雪的心态，把自己的事情做完了，就算了。这样的企业在顺境当中尚可生存，一旦遇到逆境，很难度过。


    **第三个层次：愿景式管理。**


    要想成为一个大老板，必须是愿景式管理。愿景管理，也可以称作画饼管理，厉害的管理者必然都是画饼高手。历史上的曹操“望梅止渴”，就是画饼式管理。让人对未来充满希望。愿景管理，就是给人以未来的管理方式。Facebook
    初创期的期权、股票，属于愿景管理。马云经常鼓励创业者要有希望，明天是美好的，属于愿景管理。柳传志也是典型的愿景管理高手。会利用愿景来管理员工的人，基本上不会差太远。愿景能调动人的激情，能激发人的想象力，能让人有使不完的劲，这都是一个赚大钱企业的员工必备的素质。建议各位老板好好琢磨下愿景管理。愿景管理，能让你的企业在逆境中生存，度过困难期。但大家要注意的是，画饼不等于不圆饼。


    **第四个层次：宗教式管理。**


    这是信仰层面的管理，文化层面上的管理，当然也是最高境界了。可琢磨孔子怎么带领 3000 弟子，周游列国 14 年的。身边都有好几十人一直跟着孔圣人风餐露宿，当然也有杀鸡宰羊的时候。如佛主不管走哪里
    1200 比丘都是一直跟着佛主的，这就是文化级别的管理者、信仰级别的管理者才能达到的水平。但凡国家的建立，基本上都是入门级别的宗教式管理，如普京是东正教的，我们伟大的共产党人都是信仰共产党的，可以去查下百科，看看信仰那一栏。但凡历史上搞了点动作的革命人物，无不是宗教管理、文化管理、信仰管理层面的人。如“拜上帝教”的洪秀全、“苍天已死，黄天当立”的张角、“替天行道”的宋江、“驱逐鞑虏，恢复中华，陈纲立纪，救济斯民”的复国主义者朱元璋等等。


    如果想做名垂千古的企业，那么可以琢磨下信仰层面的管理。他是在人的心中植入使命感，大家好好体会下使命感的植入。


    ## 15、如何把自己宣传出去


    每个老板，都要宣传自己到底能为用户提供什么服务或产品。也要宣传自己的理念、价值观、思想给自己的团队，甚至给用户。


    把要推销这个概念从自己的头脑中拿掉，要把说服人这个概念从自己的头脑中拿掉。不管是企业内部，还是外部，人们都自然而然的抗拒推销。要用分享你的观点，分享你的服务理念去做事，目的是帮助对方改善生活。以帮助对方的出发点去宣传你的理念、你的企业文化和你提供的服务。


    - **永远把他人的利益考虑在第一位。**


    习惯性的宣传自己的理念，比如，我经常在公司里面宣传我的理念：努力工作是一种修行。我只是分享我的观点，并没有推销，但这给其他员工树立了榜样，表明自己是一个斗志昂扬、全神贯注的老板，直接增加自己的领导力。


    - **直接增加自己的领导力。**


    经常与员工闲聊，或者在 QQ 上发表说说，在微信上发表动态，这样员工知道我的心理状态，也就知道我的理念，潜移默化地影响员工。


    - **积极工作，拼命奋斗。**


    比如与同事一起出去用餐的时候，我也会分享一些心得理念，有助于修正团队的理念，虽然不讲工作上的事情，但都是积极正面的东西。从侧面也调整了同事的心理状态，工作状态自然就好了。所以，我经常说，老板必须是一个社会学家，也必须是一个心理学家。


    - **讲有价值的话。**


    可以组织共同的读书会，一起读一本书，然后分享观点，在分享的时候，就可以免费散给员工。要有习惯写日记、写演讲稿、写材料，这样，自己的条理就会越来越清晰，讲话也越来越有深度，更加有利于宣传你的理念给员工或者客户。只讲对人有帮助的话，你的话对人没帮助，宁愿闭嘴。没有什么有价值的话要讲的时候，就算大家请你讲话，你也要委婉的推掉。所以，平时的积累很重要。


    多读故事书、历史书，或者提炼总结自己碰到的有趣的故事，讲给大家听。优秀的宣传者是一个优秀的“说书人”，人们最喜欢听故事。你可以通过故事把你想传达给员工的思想传达出去。你可以专门挑选特定的故事、特定的人物给大家共享。


    - **洗脑是在无形之中完成的。**


    宣传思想的时候，要注意跟你的听众互动、沟通，别只会闷着头自己讲。与大家不断的互动，大家才感兴趣，而且会迅速提高认同度。每次要宣传一个理念的时候，记得自己在办公室演练
    20 次，自己又当听众，又当宣传者，来回切换角色体会，务必一次性把理念灌输到听众脑袋里，对他们产生根本性的影响。


    - **宣传必须有娱乐性、有趣味性。**


    别板着脸，谁也不喜欢看到板着脸的老板。如果你板着脸，你讲得再有理，听众也听不进去。但如果你能让大家笑，他们就会侧着耳朵，集中精力听你讲，生怕没听清楚或者是错过了什么，所以，多培养自己的幽默感。


    - **必须讲真话。**


    现在很多人有个毛病，说话都躲躲闪闪的，不敢讲真话心话，讲话讲不到实质上，是没有人感兴趣的。


