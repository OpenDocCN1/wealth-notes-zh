    ## 15、中国市场环境的变化以及趋势


    目前，在国家政策以及社会意识形态的发展，实体经济衰落，互联网、移动互联网的崛起，金融体系的开放，房地产的瓶颈等等多种社会因素的共同作用下，中国市场环境已经发生了翻天覆地的变化。这些因素不仅仅塑造了新的行为、生活方式，而且也提供了不少新的机会与挑战。


    主要的市场环境变化，以及趋势体现在如下八点。


    第一，网络信息技术的发展。


    互联网，特别是现在的移动互联网创造了崭新的信息时代。我们能够更加精确的为用户生产产品，甚至定制产品。社交网络的发展能够定向传播广告。


    第二，物流行业的发展，使我们的产品可以成本很低的卖到全国，甚至全球。运输、交通的发展，也使得很多人都可以远离家乡工作或者出游。旅游业以及相关产业在未来10年会越来越火。


    第三，产业之间交集越来越多。新的机会往往孕育在两个或者多个产品的交融处，很多产业之间的界限越来越模糊，大部分生意与互联网结合将是一个强劲的趋势。


    第四，硬广告、传统媒体的衰落，互联网、微型媒体的崛起，社交媒体的崛起，很多借助社交媒体、互联网的企业都有较大的利润，较好的发展。小视频的崛起，直播时代的到来，微信、微博的进一步崛起，5G时代的到来，互联网的迅速发展、升级、变革使得很多企业不再依靠传统分销渠道就可以直接与客户沟通，中介、中间商的日子越来越不好过。个体经济已经到来，企业的传统营销模式、管理模式都将被更迭。


    第五，由于很多企业采取了互联网的营销手段，自己给自己做广告，结束了以前的电视、广播、报纸、杂志等媒体的广告时代，使得产品的成本迅速降低，变相的提高消费者的购买力。并且消费者可以在网络上24小时在线浏览企业的产品，购买企业的产品，打破了地域限制与时间限制。团购网站的出现，进一步增加了消费者的议价能力，并让消费者享受到了打折的优惠。


    第六，企业可以借助云计算、大数据等进一步搜集用户信息、消费者关注的焦点，甚至可以精确的推断出自己的产品、服务方向有没有市场。企业可以进行有针对性的生产，比如大家可以用百度指数去查找自己想做的产品，看看每个城市以及全国，有多少人在关注你要做的这个产品，都能够推导出市场容量大概有多大，这是史无前例的进步。


    第七，消费者越来越想参与到企业的生产过程中来，消费者越来越有主人翁精神，比如小米的成功，就是因为开始小米有一个论坛，大家都在里面讨论这个手机要怎么设计，要有什么功能，用什么材料，最后产品出来了，大家就对这个产品有感情，自然就卖得好，因为有参与感嘛。


    第八，以前是没有办法，只有电视、报纸等媒体，大家被迫接受广告信息，媒体很强势。现在大家在互联网上只要感觉不爽就换，就关掉网页了，人们会越来越理智，避免购买进行过度营销的产品。所以，我们要做小而美、精细化的产品给用户，粗放型到集约型的转变是必然趋势。


    ## 16、互联网在线教育必定是一个趋势


    互联网的发展，让每一人都有机会靠一台电脑就致富，如果你有特长，有经验，愿意在互联网上分享你的特长、你的经验，不管是什么东西，只要对人有幫助，总是会有人跟你学的。有学生，有老师，就是教育，然后你可以酌情收点学费，这样一个非常棒的商业模式，你没什么成本，赚到手的都是纯利润。而且，互联网在线教育必定是一个趋势，你可以做得非常大。


    第一，以前学生想学习，只有学校，这是一个垄断资源，你只有到学校里学才行，而且学校基本是以老师为中心的，谈不上什么服务态度。他们根本就没认识到教育实际上是一个服务业。而互联网的出现，你可以在互联网上服务好学员，以学生为中心，这就极具竞争力。由于学校是政府性质的，没什么营销能力，慢慢的，民营的互联网教育必定啃掉传统教育很大一块肉，就如同民营快递啃掉了邮政快递很大一块肉一样，也如同互联网金融啃掉银行很大一块肉一样。互联网教育也必然会啃掉国家教育很大一块肉，接下来，这一幕必将发生。


    第二，互联网上的学生们可以通过手机QQ、YY语音、视频直播聚集在一起，随时随地以任何方式进行交流。这会非常具有用户粘贴度，而且很有趣味性。


    第三，互联网教育的成本很低，你可以通过互联网QQ群、YY语音、视频直播把你的观念、思维、经验传播到全国的每一个地方，使得每一个人可以接触到。同时也说明了市场是无限大的，也推里出来财富是无限大的。


    第四，目前竞争不是很激烈，就几个大平台在做，你完全可以通 过微博、微信、QQ群、YY语音、视频直播等工具做起来，连网站都可以不做。


    第五，教育的重要核心，就是分享知识与信息。而互联网的本质就是信息的传递和交换，这样高度相关性，使互联网和教育结合起来顺理成章，互联网教育也理所当然的会是接下来一个极具爆发潜力的市场。老板们可以把握一下互联网教育这次机会。


    # 第三章 思想致富


    多算胜，少算不胜，而况于无算乎？——《孙子兵法》


    商人应该记住这句话，不断地投资时间与金钱在学习上面。——陈昌文


    ## 1、学习就是生产力，不停的学习自然会富有


    先跟大家谈谈这个世界最富有的民族：犹太人。我们经商的人，都应该对这个民族进行一个透彻的了解。犹太人自公元一世纪被罗马人奴役，开始流离失所，流浪全世界。直至二战结束的
    1947 年才回到现在的家园，就是现在的以色列。影响世界的犹太人很多，比如：马克思、爱因斯坦、弗洛伊德、控制欧洲金融命脉的罗斯柴尔德家族、华尔街的超级富豪摩根、第一个亿万巨富洛克菲勒、股神巴菲特等。


    犹太民族是一个有强烈宗教信仰的民族，犹太 人将学习视为信仰的一部分，学习是向上帝表示敬意。每一个犹太人都必须要读书，《塔木德》就是犹太智慧的基因库，《塔木德》本身的含义就是“钻研”或“研习”。《塔木德》认为：“学习是至善行为，是美德的本源，一个人的虔诚、至善、平和、优雅都是靠后天教育的结果。”


    有一本书叫《虔诚者的书》。说到古时，墓园全要放书，在夜深人静的时候，死者要从坟墓中爬起来看书。书是一生中的宝贝，书柜必须设在床头，不能设在床尾，否则被视为对书不敬。犹太人认为：教师比国王更伟大。犹太人对教师高度尊敬。学校在、知识在、书在，犹太民族无论流浪在何处，都能生存下来，而且更为强盛。


    智慧比知识更重要。何为知识？知识就是万事万物的真相和客观存在，而智慧就是将万事万物的真相与客观存在进行无限联接，综合总结出来的解决问题的最佳方案。对人最重要的是什么？智慧，而智慧来自于知识。读书的目的，就是拓展知识。具备了丰富的知识以后，你学会了思考，你就会明白做人的道理或找到解决问题的方法。这就是智慧！因此，智慧来自于知识，比知识更重要！


    犹太人崇尚创新，认为创新是一种智慧，要敢于怀疑，随时发问，知道的越多，越会产生怀疑。中国的家长对放学回家的孩子问的一句话是：“你考得怎样？”而犹太人家长会长问：“今天你又提问了吗？今天与往日比有何不同？”犹太人认为创新是滚动的智慧、开放的智慧、灵活的智慧。人通过学习可以认识自我，超越自我。


    犹太人教育既封闭又开放。对犹太人内部是开放的，对外是封闭的，以保持犹太民族的生存竞争力。《塔木德》是准圣经，在公元 2 世纪到 6 世纪之间，犹太人用了 500
    年，两千多个拉比和科学家合作编写出了这本犹太人的生存宝典。犹太人认为，教育等于财富，等于个人感动，教育改变人生、命运，改变一切。在 2000 多年的流浪历史中，一切都被掠夺了，只有书和知识是夺不走的财富。由于犹太人对教育极为重视，对知识、对书无比重视，什么都可以不要，只有知识是最重要的财富，是可以随身携带而且终身享用的财产！因此，犹太人是全世界最早消灭文盲的民族。在1947年以前，犹太人连一片固定的国土都没有，可是在中世纪时期，犹太人就消灭了文盲。因此，这个民族的整体素质比其他民族要高一等，因此全世界的富人恨他们太聪明，穷人恨他们太有钱！就是这些因素使得犹太民族在全世界流浪了两千年，却是全世界独一无二没有乞丐的民族！


    > 总结一句：学习就是生产力，不停的学习自然会富有！商人更加应该记住这句话，不断地投资时间与金钱在学习上面。


    ## 2、如何增加自己的竞争力


    人与人之间的竞争，说到底就是思维模式的竞争。大部分普通家庭都只是生育了孩子，并没有教育好孩子，或者说教育的层次不一样吧，这就直接导致了孩子在社会上的竞争力千差万别。


    孙中山闹革命的时候，曾经把民众做过分类。大概的意思就是，这个社会是由少数精英领导大部分芸芸众生的。精英阶层负责制定规则和在某些时候打破规则，芸芸众生就只要在规则内活动就行了，如果违背了规则，就会受到严厉的惩罚。


    家庭教育并不是百米冲刺似的短跑，而是一代代的接力赛跑。每一代人积累到的经验，都会对他的后代有影响。孔夫子的后代就一直很厉害，可以说原因就是孔夫子很厉害。


    如果你生在了普通家庭，你的父母其实不能教会你什么有竞争力的东西，这不怪他们，因为他们也不懂啊。要求他们做到他们不懂的事情，岂不是太不讲道理了？但是当我们明白这些道理的时候，我们想要在这个社会上有竞争力，就要自己教育自己，想办法多看书，多学习，多交有能力、有前途、学习能力强的朋友。尽全力的去改变自己，争取给自己的下一代“传道授业解惑”，做一个有竞争力的父母。


    自己的起点不公平，没什么好抱怨的，这个世界本来就是不公平的，而且从来就没有公平过。《易经》中有句话“天行健，君子以自强不息。”说的是要靠我们自己自强，我想，这才是我们每个有志青年应该做的。


    如今的互联网恰好给了我们一个睁眼看世界的机会，我们可以利用互联网，看到大部分我们能寻找到的有用的知识、思想，来武装我们自己，增加我们的竞争力。通过互联网，也可以结交一些有能力的人。可别去看电视剧，玩游戏，让互联网成了削弱自己竞争力的武器。


    互联网才刚刚开始，你也可以进入互联网行业来赚钱。看当今中外富豪，多少人都是跟互联网挂上钩的啊，百度李彦宏、阿里巴巴马云、腾讯马化腾、Facebook 马克扎克伯格、谷歌拉里佩奇等等。还有很多上市公司，58、赶集、京东、百姓网，哪个不是互联网出来的巨富。就我


    自己去过的一些证券公司、黄金公司、公家装璜公司、医疗集团，以前都是靠电话销售，现在都转向了互联网营销。


    ## 3、不断地学习赚钱的思想，你自然就富了


    华人首富李嘉诚常打一个比方：一个人从现在开始，每年存 1.4 万元，并都能投资到股票或房地产，获得每年平均 20% 的投资回报率，40 年后财富会增长为 1
    亿零 281 万元。如果我们细算账会发现，按这种方式操作，第十年仅能攒 36 万元，在很多大城市还不够买一个卫生间。但坚持下去，到了第 20 年，这笔资产就积累到了
    261 万元，如果你能坚持 40 年，财富就会到达 1 亿零 281 万元的惊人厚度，这就是神奇的复利投资。


    爱因斯坦说：复利的威力比原子弹还可怕。是不是有人要抱怨四十年时间太长？没办法，基数有限，只能靠更多的时间去弥补，想要更早实现财富目标，需要先完成一定的财富基础。对普通人来说，人生积累财富过程中的分水岭应该不低于
    100 万元。而在这个移动互联网时代，靠自己积累到 100 万元，可以说已经是轻而易举的事情，找到一个好老师、一个好项目，听话照做执行，就行了（可以参考我的另一本书《陈昌文方法
    72 大营销系统》）。可以无脑复制。而在以前，你需要很多的综合能力和一定的实力基础。


    李嘉诚说过，赚第二个 100 万时要比赚第一个 100 万简单容易得多，简直就是顺手就赚来了。李嘉诚在不到 30 岁的时候，就完成了这个跨越，回顾一些知名富豪的经历，他们也大多在
    30 岁左右就完成了这笔积累。放到当下，如果你还没有跨过 100 万门槛，在应付完各种高昂的生活成本之后，其实能用于投资的资金非常有限。越早完成靠勤劳存钱的阶段，你才能越早进入以钱赚钱的阶段。所以你积累第一个
    100 万元所用的时间长短，基本能够决定你一生的财富厚度。在这个时代，有意思的是，有的人用一个月就可以赚到 100 万，有的人用一年，有的人还是一辈子也赚不到。时代不同了，你的观念转变得有多快，你赚钱的速度就有多快。这个世界最美妙的就是用钱买时间，买经验，我就特别喜欢买书，买知识，因为如此，就相当于买到了时间，买到了未来。


    所以，开辟人生新道路重要的是不论钱多钱少，从一开始就养成投资的习惯。


    每个致富的人，只不过是养成了一般人不喜欢，且无法做到的习惯而已，即学习投资理财的知识。你可以完全不会，只要你现在开始学投资的知识就行。只有掌握穷致富的知识，才能变富。我本人买了很多书，买了很多讲座，买了很多培训，我把这些东西糅合起来，然后运用在自己的企业经营上，做出服务与产品卖给了别人，我就盈利了。买一本书只要
    50 块，给我带来的效益是几十万，甚至更多。贫穷者的可悲就在于，他的钱很难由生活费用变成知识，更加不会去买那些值钱的经验。所以，贫穷者就只能一直穷下去。


    牛人的想法、观念、思想都是能变成钱的知识，只是穷人对这些东西笑一笑就走开了，从来不去深入专研，所以只能穷下去。贫穷者的财富只有大脑！不武装自己的大脑，简直就是放弃财富。贫穷者最宝贵的资源是什么？不是有限的那一点点存款，也不是身强力壮，而是大脑。以前总说思想是一笔宝贵的精神财富，其实在这个时代，思想不仅仅是精神财富，还可以是物质化的有形财富。一个思想可能催生一个产业，也可能让一种经营活动产生前所未有的变化。


    教育是最大、最划得来的投资，想富就换脑，想富就学知识。

    学历只是一般教育的证明，学校里学到的只是一些综合性的基础知识，人一辈子都需要不断地学习。对很多贫穷者来说，他们的命运是和教育程度密切相关的。不断地学习赚钱的思想，自然就富了。


    ## 4、学错知识，比吃错药还倒霉


    “回”字有四种写法，是当年孔乙己先生用以炫耀的知识。只是可惜，这知识于贪茴香豆吃的孩子们无益，于他自己也无益，即便是我这个跟文字打了 30 年交道的文化人，至今尚不清楚那四种写法，却也并不觉得怎样遗憾。而且，我也不会去研究如何写。


    在我的世界里，只有两件事，读书与赚钱，赚钱是为了读书，读书是为了更好的赚钱。如果要活生生的加上其他事情，大概就是有了足够的财富过后，带着家人欣赏世界吧。我目前的一切精力都集中在做企业上面，我认为做企业简直极度好玩。


    我们经常在电视上看到这种识考题，“世界环境日是哪一天？”这是中央电视台全国青年歌手电视大赛上的一道“文化考核”题，要参赛歌手解答，由某学者讲评。以前读小学的时候，总是觉得能回答上这些问题的人很牛逼，现在，我却觉得这样的人是白痴，而且，这种问题能回答出来，根本不能说明这个人就是优秀的人，反而误导了我们这些小学生，认为该去死记硬背这些知识。有时候还打击了我们小学生幼小的心灵，认为自己很无能，怎么什么都不知道。


    不知某学者作何感想，反正我看了这题，只是感到哭也不是，笑也不是。至于讲评，我想倘若换了我，我会告诉那位歌手：这个问题，只需从事环境工作的专业人士知道即可，而且也算不上什么文化考核。因此，你作为歌手，不知道也罢，是不应该扣分的。至于这个大赛的其他“文化考核”题，如“世界三大短篇小说家都是谁”“人生自古谁无死”是谁的诗句”“莘莘学子是什么意思”“某某节何时在巴黎确定”一类，虽然不能说与文化无关，但对于歌手来说，不知道这些，也没什么了不起的。那些已经成了名的大歌唱家，请他们来也答答试试？你总不能因此而指责他们没文化吧。


    不客气地说，倘若让我来出题，就出这类题，来考考这个大赛的出题人，我要是不把他们个个考得汗流浃背，恨无地缝可钻，就算我小时候那几天书白念了。因为：


    - 一、这种题的偶然性太大了，回答正确的几率本来就不高；

    - 二、这种题，对于许多从事其他特定专业的人们来说，他们平时根本就没有必要注意；

    - 三、最重要的是：这种题的答对与否，并不能反映答题人的文化素质。


    由此，我便想到了这样的一个问题：在知识爆炸的当今社会，我们有没有必要、有没有可能，把人类创造的全部知识，统统地塞进自己的大脑？如没必要、无可能，那么，我们应该进行怎样的取舍或选择？


    一般而论，人们认为我们的知识结构应该是由下面两个部分组成：


    - 一、一般基础知识；

    - 二、混饭吃的特定专业知识。


    但我，却以为还有一个第三，而且这个第三还要比前面的两个部分更加重要，那就是对于一般基础知识和特定专业知识的理解、把握和创造的能力，以及区分出来哪些知识是对自己没有什么用处的知识，我们就不要去学它了。为什么有的人看起来什么都知道，却很不好社会，高分低能？就是因为他们满脑子学的都是不能赚钱的知识，就是不能拿来生存的知识，让生活变得更好的知识。


    这里，我想特别强调的是，在中国，自古以来咱们就特别重视对知识的记忆，同时却忽视对知识的理解和运用。回到那个大赛的话题，我以为倘若把考题出在对知识的理解和运用上来，那就好多
    了。歌手的回答倘若还有创新，那就应该给予高分了。


    据中美两国学生的学习成绩，中小学阶段是中国学生优秀，因为这个时候靠死记硬背，到了大学以及大学以后，就是美国学生优秀了，因为这个时候靠对知识的运用。这个现象，说明了两国教育思想与教育方式的差异。而美国科学家、发明家远远多于中国，就又印证了美国重视的是创造能力的教育思想与教育方式。


    我中学的学习成绩是很优秀的，高中毕业时，包括数理化都是高分。可惜，这么多年以来，我当年记忆并运用得滚瓜烂熟的许多知识，特别是理科部分，就几乎从未应用过。至于当年费时最多的数理化，现在至少已经忘记了
    99% ！相反，我在业余时间里，凭着兴趣和自身需要而自学的知识，现在看来倒很有用，比方说哲学、社会学、心理学、宗教、中国通史、世界通史、中外文化史、中外艺术史、营销、管理、互联网、人际沟通……甚至包括服装、建筑、卫生、军事、谋略、兵法等等，都令我受益良多，特别是对我的生意有很大的好处。


    而且，发生在我身上的这个现象，我相信绝非个例，相反，却是极其普遍的，即我们每一个受过那种教育的人，都会出现这样的现象。那就是说，我们的教育存在巨大的浪费！浪费且不说，简直是对我这种人的一种巨大误导，相当于我花了极大的精力白学了20年！倘若一开始，我学的就是我现在能用得上的营销、管理、人际沟通、历史、哲学、心理学知识等，我相信，我现在赚的钱肯定会更多。所以，我有个结论，读书的时候，喜欢看业余书籍的孩子混社会，都差不多到哪里去。


    为此，我常常这样想：倘若我们的学习内容不那么盲目，不那么虚荣，能够在知识的广度方面有所拓展，特别是能够在素质教育方面多加注意，那么，不只是我们的学生，全体中国人的文化素质都将得到很大的提高。遗憾的是，关于教育，特别是素质教育，我们已经讨论了许多年，却至今不见起色。


    我们都学了些什么？我做过一个奇怪的梦，梦中有人问我一道初中数学题，这道题我不会做，一着急，急醒了。醒来后，好半天睡不着。我想，这个梦肯定是属于“日有所思，夜有所梦”，因为很长时间以来，我就疑惑我们的学习内容，究竟能有多少意义？


    我读中学的时候，学习是很认真的，数理化几个主要理科的考试，每次都能得到高分。这几个理科的学习，也是占用时间最多的学科。相反，我所喜欢的语文啊、历史啊、地理啊什么的，倒是给点时间就完了，仿佛成了业余。问题是，我曾经不得不花费了那么多的时间、精力去学

