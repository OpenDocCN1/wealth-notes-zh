    我个人喜欢佛学。什么是敲木鱼呢？


    - 1、鱼是昼夜睁着眼睛的，鱼睡觉就是停在那里不动了，休息一下就算睡觉了。

    - 2、庙里敲这个木鱼，是要我们精进，修道要效法鱼的精神，昼夜努力不停。

    - 3、步步前进，日日不止，自有到期，不必计算远近而徒长吁短叹。


    成功在于持续的重复一件小事。


    # 13、赚钱，必须了解钱的性格


    为什么要这么看重钱？答案非常简单，因为有了钱，你才能去旅游，才能去买房子，买车子，才能保证60到120岁还有活头。敢活到120岁，是因为准备好了足够的物质条件。而赚不到钱，是活不到120岁的，因为物质条件不允许你的生命力这么坚强。


    一个人的财富不自由，**人格就很难独立**。不能够做到为自己的老婆、孩子提供一个良好的生活环境，也不能够为父母提供一个有保障的晚年。甚至他们晚年疾病缠身的时候，你也只有在旁边看着！不是你不孝顺，而是你没有资本孝顺。这其实是大多数中国人的写实，与道德无关，现实如此。所以，为了获得有尊严的生活，在我们年轻的时候必须学会赚钱，必须清楚每个人都有这样一笔账，你必须要算清楚。


    赚钱，必须了解钱的性格。地球上从来不缺钱，当今社会，电子货币满卫星飞，满互联网飞。支付宝、微信、财付通、各种网银、各种资本、投资人、基金，这些钱24小时不停地在寻找着需要它的人。然而奇怪的是，大部分人是穷人，努力找钱却找不到。


    现在，我就来谈谈钱到底在找什么样的人？而你只需要成为这样的人，钱就会向你飞奔而来。


    司马迁讲，天下熙熙，皆为利来；天下攘攘，皆为利往。司马大爷的意思是，所有的人都是为了钱。我先讲我们如何待员工，我们才能成为厉害的老板？


    - 1、你必须给员工高额的回报。比如公司一年赚了100万，你拿30万分给你的两个骨干，一个人20万，一个人10万，如此，这两个骨干就会在来年更加拼命地干。于是你来年就可以赚到200万，你就可以拿出60万来分给骨干，一个25万，一个20万，一个10万，一个5万。如此，你又多了两个愿意跟着你拼命的人。你就如此周而复始地干下去，跟着你的优秀员工就会越来越多。

    - 2、你必须让员工有安全感。承诺给员工的钱必须兑现，你也不能去要求员工干违法的事情，否则，员工不安全，就要辞职。

    - 3、你必须让员工想走就走，不能强留。如果你用各种手段强留，就会出现身在曹营心在汉的情况，留下来的人不尽心尽力，你也赚不了几个钱。


    假如你做到了这三点，那么就有非常多的员工愿意死心塌地地跟着你。


    其实，钱也如同人一样，是有性格的。


    第一，你如果能让跟着你的钱变得越来越多，交给你的钱继续能获得高额回报，周而复始地干下去，就会有更多的钱跟着你；


    第二，你不要用钱去干违法的事情，否则钱就怕你；


    第三，别人来拿回属于自己的钱的时候，你能毫不犹豫的给别人，那么，就会有很多人愿意把钱给你。


    如果你能做到这三点，地球上飞的那数万亿电子货币就会来找你，你自然就富了。其实，钱就是人性，钱就是人心而已。只要你真能做到用心待钱，钱就会找你做朋友。有的人不喜欢钱，消灭钱，比如他拿着钱去嫖娼，买奢侈品，或者赌博，或者是满足自己的欲望，这种人就是钱的仇人，自然不会有钱。


    各位反思一下，你到底是钱的仇人呢？还是钱的亲人？如果你是钱的仇人，你穷，就在所难免了。很多事情啊，其实本来很简单，就是现在大多数人把这种简单的道理忘记了。只要你返璞归真，道法自然，自然就有钱了。


    # 14、做到这10条，就会赚钱，而且一定有钱赚


    怎么算是会做人呢？做到哪几点就会赚钱呢？


    - 1、尊重身边的每一个人，没事就多烧香，天天平安。给多少人烧香，就有多少人帮助你，保佑你，人都是礼尚往来的。

    - 2、能送礼的时候，就送礼，送礼多的人，就很容易成就大事。甚至在你无路可走的时候，会有你送过礼的人帮助你，让你绝处逢生。

    - 3、养成背后从来不说人坏话的习惯，也不听别人说坏话，别人来找你说坏话，你就找借口走开。因为坏话是一种负能量，会感染你的精神。让你丢失财运，况且，社会本来就是个好事不出门，坏事传千里的社会。你只要一说坏话，要不了多久，大家都知道是你说的了，没人愿意与你相处，大家心里对你有芥蒂，你就混不好了。

    - 4、养成做好事的习惯，并且做好事绝不留名，这样你的人缘就会越来越好。如果你做了好事，到处宣传，好事就会变成祸害。因为那些接受你恩惠的人脸上无光，成了你炫耀的工具了，你就开始积累怨恨。而如果你不宣传，有部分受你恩惠的人就一直铭记在心，总是感激你，你积累的就是福德。怨恨与福德都会在条件成熟的时候转化到现实生活中。养成做好事不留名的习惯，必成大业。

    - 5、调理好家庭关系，家和万事兴。家和，你家里的父母、老婆都鼓励你做事业，鼓励你奋斗，一家人都支持你，那么你做事就有如神助，成功几率就大很多。如果家庭关系处理不好，那么你做什么事情，父母反对，老婆反对，负能量都集中到你身上，阻碍太多，你就相当于小鬼缠身。事业就显出衰败之象，赚钱就很难。

    - 6、不要抱怨环境不好，找客观原因，这样大家只会认为你无能。其实很多事情，都是人为因素占的多。人为因素大概占70%，环境因素占30%。所以，你只要你把你能改变的事情做好了，基本这个事情就算成功了。

    - 7、我们工作的时候，总会遇到些压力，不顺利，甚至是痛苦。不要把这种压力发泄到伙伴身上，不要把这种压力带到家里，让家里人跟你一起痛苦。这一点，我是跟李嘉诚学的。李嘉诚回家绝对不谈工作，家庭就是家庭，工作就是工作。李嘉诚先生事业如此之大，能做到井水不犯河水，真是了不起。我现在都是家庭与工作分不开了，但我还能做到不把痛苦发泄到伙伴与家人身上。男人有什么事情就自己承担，挺一挺就过去了，这样你会跟大家关系融洽。

    - 8、要有城府，别人骂你，做错了什么事情，不要把情绪挂在脸上。什么心情都挂在脸上的人，成不了大人物，成不了大商人。

    - 9、永远不空手吃任何人的饭，永远不空着手到任何人家里去。你永远都要送点礼物，这样，别人就感觉到你这个人尊重他们。以后，你想做点什么事，他们也愿意帮忙。平时就要学会烧香，临时才有佛脚抱。礼尚往来，天长地久。我最佩服的送礼人，第一个是毛泽东，他送给老百姓的礼物，是解放全中国。所以毛泽东能当主席。第二个厉害的送礼人是邓小平，他送给全国人民的礼物是改革开放。所以他能名垂青史。


    送的礼物有多大，就有多大的回报，就有多大的钱赚。当你不能送大礼的时候，就养成送小礼物的习惯。比如我以前刚打工的时候，就没本事买水果给大家吃，结果我的关系与大家最好，干了半年不到，就升为主管了。这一条，我以前是定了标准的，工资的八分之一到处送。看似吃亏，其实我占了大便宜。


    - 10、与人合作，永远让别人赚大头，自己赚小头。这样干的目的有两个，第一，对方会开心，会操心；第二，对方会讲你好话，会有更多的人与你合作。


    会做人，就一定会赚钱而且有赚。


    # 15、企业讲利润，员工讲收入，这才是天道


    员工只想给自己干；不想给别人干。老板要做的事情，就是根据人自私的本性去引导员工。


    比如，您是一个私营大学的老板，您就不应该让每个老师用心教也是那么多收入，不用心教也是那么多收入。您可以用卖老师门票的方式来经营学校。不用心的老师就只能吃稀饭，用心的老师就能吃肉，而很用心的老师就能吃山珍海味，这就是根据人性来驱使员工自动自发的工作，自我挖掘潜能，这才叫真正的公道。


    什么样的员工是合格的员工？能干，能做出贡献，就合格，而不是学历高。实用的才是最好的，能盈利才是最重要的。有想法、没办法的人很多，社会大学是最好的大学。我们每个人一定要持续进步，持续学习。拒绝招聘只有想法、不干活的人进公司。


    所以，真正想推动一个社会进步，要从利益的角度去考虑。真正想干好一个企业，同样要考虑到优秀员工的利益。企业讲利润，员工讲收入，这才是天道。

