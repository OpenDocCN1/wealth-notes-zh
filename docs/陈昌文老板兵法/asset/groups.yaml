    # 写在前面


    # 陈昌文读书会和老板社群


    我唯一的任务，就是带着大家搞儒家思想、陈昌文方法传播，让大家获得利益。——陈昌文


    > 法不轻传，

    道不贱卖，

    医不叩门，

    师不顺路，

    千金不传无义子，

    万财不渡忘恩人。


    ——这就是陈昌文读书会和老板社群的立场，收人标准。'
  - '[PAGE 3]


    万事随缘，随遇而安。


    诸恶莫作，众善奉行。


    时时刻刻琢磨做点好事，不做恶。


    时时刻刻准备隔离一些人。


    我唯一要做的，只有一个任务：道德+智慧。除了这个，其他的事情，对我毫无意义。


    我的唯一目的，呕心沥血提升大家的道德素质＋赚钱能力。我就干这件事，我日日循环的文章、文字、授课，都是这个目的，疯狂提升大家的道德＋智力＋赚钱能力。


    陈昌文老板读书会和老板社群是精神财富、智慧财富的聚集地。大家来这里，也是老老实实的学习精神财富、智慧财富，都谦虚虚虚诚诚，才来；觉得自己牛叉的，千万不要来，这是我们老师日日要讲的。述而不作，信而好古，不要瞎搞。


    凡所有相，皆是虚妄，若见诸相非相，即见如来。要管理好几万人、几十万人，靠的是大爱，靠的是德行、境界、智慧，跟能力无关。唯独无性格、无脾气、无喜好的人能干。这种人，也不是人了。


    本社群的读书会，以及陈昌文老板社群，这是个做圈子的项目。传播儒家思想、陈昌文方法的项目，这是个品牌营销的项目，这就是我们一辈子的伟大事业了，而且流量会持续攀升，会有精神和物质境界的复'
  - '[PAGE 4]


    利效益。大家可以获得巨大的双利益，无论是讲师，还是粉丝。老老实实干到底就行了，这件事，利他利己。


    陈昌文老板读书会老板社群传播的是陈昌文方法，传播的是儒家思想，只有这个，没有其他任何东西。我的目的，是带着大家变得优秀，不断的成长，不断的辐射，精耕细作。我们只干细分市场。社群绝对不多元化，只搞读书会+陈昌文老板社群。


    我个人，做到早起早睡、锻炼身体、尊师重道。我的尊师重道，就是只抄袭大师、天才，我只请教高人，按照高人的套路做一切，我不自作聪明，不原创。我只用天才、大师的头脑，搞传播、变现；搞基因繁殖、裂变；搞流量、变现。


    社群的一切讲课内容，源自于我们的教程，每一本书，讲师和学员、粉丝，学的是一模一样的知识、智慧。不允许不负责任的胡乱讲，走偏。记住，因果不虚。勿造业。


    读书会+陈昌文老板社群，反复循环售卖。一再强调，社群的核心思想，就是儒家思想、陈昌文方法。我的写作范围广一些，但是会回来，但都是以儒家思想去解读各种经典的，儒家思想是我们的法器。我们用我们的法器，去正各种经典，也就是以经解经。


    美人卖笑千金易，壮士穷途一顿难。我日日打造讲师团队，给群员讲课，给粉丝讲课，带领讲师不只是发家致富，更要利益他人，无限的去利益他人，不要做一个龌蹉小人、宵小之徒。我本人没那么多功利，并'
  - '[PAGE 5]


    非唯利是图。我们的使命是把儒家思想和陈昌文方法传播给十亿人，十亿人就会让我们衣食无忧。


    我的一切目的，都是打造讲师团队、管理团队、领导层、领袖。不赚钱是做人问题，我以后只讲做人问题，讲人情世故问题，不再大块时间叙述商业。讲人情世故、做人、态度、虔诚、感恩、尊师重道是我的核心。


    凡事故发生必有期于我，绝不要抱怨，绝不要有受害者思维。一切错误都是我的，行有不得，反求诸己。我只思考我自己哪里错了，绝不对不责怪任何人。我尽可能的帮助牛人。


    我们的任务，就是让所有人都成为讲师，当讲师。打造至少百万个讲师，在外部讲课，在内部讲课，日日不断的讲课。给粉丝讲课，给学员讲课，给客户讲课。


    我们努力奋斗，寻找的只是可爱的人，共度余生，或者携手事业，我希望各位都能幸福吧。


    我建立这个社群的目的，是提升大家的智慧＋财富。就这点事情。我们社群，只锁定功成名就的人，也只给这些人传播文化。我希望各位理解我讲的儒家思想、陈昌文方法，不要乱学、乱传，您们没您们想象的那么聪明，传偏了，传错了，害人害己。


    陈昌文


    2020.8.1'
