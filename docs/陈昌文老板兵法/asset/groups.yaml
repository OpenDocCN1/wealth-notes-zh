    敌人有生力数量放在第一位，把夺取城池地方放在第二位。这就是事物的本质。比如我们经营企业，最终目的是要收回来到钱，这是本质。有个公司做建材生意，生意很好，干得热火朝天、精神抖擞，那个时候算下来一年赚几百万，可惜都是欠账、烂账，这就叫做企业没有抓住本质，输得很惨。


