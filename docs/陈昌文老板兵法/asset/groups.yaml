    ## 13、毛伟人对我们的启示


    真正推动社会进步的力量是世俗的力量，而不是超世俗的力量。世俗力量是什么？毛伟人说：人民，只有人民才是推动历史前进的真正动力。只有人民的想法、人民的欲望、人民的需求，才能推动历史的进步。


    你之所以能盈利，是因为你看准了人民需求的脉搏、人民欲望的脉搏。一切不研究人民心理真实需求的人，都不能做大做强企业。


    性是人民所需求的东西，所以，黄色文化屡禁不止。淘宝网、饿了么、滴滴打车，是人民方便的工具，也可以说是人民懒惰的工具。人类的欲望还有很多，你做的产品必须符合人民的欲望。


    凡是大大上、超越人类世俗需求的创新与创业都是逆人类的，都是自取灭亡。老百姓吃喝拉撒玩乐睡就是消费社会、市民社会的特征，是推动历史进步的力量，也是最赚钱的几个点。忽然想起了一条毛主席语录：马克思主义的道理，千头万绪归根结底，就是一句话，“造反有理。”有了这个道理，于是就革命、就造反、就干社会主义。


    创业也有理，发财也有理，做营销也是这个理：乱搞乱发财。不要怕乱，怕不搞。动力是一切的根本，一个人就怕没动力。我以前跟一个营销经理聊天谈到一个问题，什么样的销售员才是好的销售员？不是技巧好，也不是会讲话，也不是经验丰富，而是其动力十足，一直都是打电话，跑业务，只要他不停下来，他的业绩必然是最好的。我经历了好几个公司，不管是卖建筑材料的，还是做网络营销的，那些业绩最好的营销人员，都是动力十足的人，没有例外。


    文武分家是中国文化的一个悲剧，是赵匡胤干出来的，他当年造反，怕他的将军们照样画葫芦，所以搞了个杯酒释兵权，这个规矩遗传千年呢。一定要文武合流，这才是中国的强处。我们带员工也是如此，必须不断的强调体育锻炼、吃好、喝好、睡好。身体不好，工作就没激情；萎靡不振，业绩是好不起来的。


    毛伟人的第一篇论文，讨论的不是什么社会制度，也不是战略、战术，而是体育之研究。他年轻的时候，是一个学校的老师，最后带兵打仗。毛伟人的战略思想是：初战的计划必须是全战役计划的有机的序幕。第一步很重要，也就是我们经常讲的，选择非常重要，选择就是战略。就是说，即便初战打了一个胜仗，若这个仗不但不于全战役有利，反而有害时，则这个仗虽胜也只算败了（例如第五次“围剿”时的洵口战斗）。比如，我们有的人5月份就想创业，结果因为公司还没发年终奖，就拖到了年底。虽然拿到了年终奖，这个意义上胜利了，但是整体来讲，这是非常失败的，因为浪费了时间，也磨灭了斗志。


    因此在打第一仗之前，必须想到第二、第三、第四以至最后一仗大体上如何打法，每次的一仗胜了，敌军全局将起如何变化；假若败了，又将起如何变化。虽然结果不见得乃至决不会尽如所期，然而必须依据双方全局，仔细地、切实地想明白。没有全局在胸，是不会真的投下一着好棋子的。古话讲，不谋全局者，不足谋一域。


    要知道连锁反应，才能明白战略的意义。


    看毛选，毛伟人指挥战争最大的特点，是始终盯着对手的人，消灭敌人有生力数量放在第一位，把夺取城池地方放在第二位。这就是事物的本质。比如我们经营企业，最终目的是要收回来到钱，这是本质。有个公司做建材生意，生意很好，干得热火朝天、精神抖擞，那个时候算下来一年赚几百万，可惜都是欠账、烂账，这就叫做企业没有抓住本质，输得很惨。


    再比如，时下很多企业老板，认为自己企业人数少了，没面子，要一定的规模。自己手里有钱，或者是有风投，就不按公司实际效益的猛招人、凑人数。我见到好几个互联网企业都是这样，最后的结局当然是倒闭了事，这些都是没抓住本质的结局。


    毛伟人的做法是：计算对手共有近二百多个旅，精密计算消灭和补充的速度，将攻城作为杀敌的手段，下达命令都是歼灭敌人几个旅。这是驾驭战争的不二法门，凡是违背了这个原则一定要失败。做任何事情，都有一个本质，结婚、离婚、经营企业、招聘人才，都有一个本质问题，各位自己去思考。


    当年刘伯承问毛泽东：我们到底去哪儿？毛：还是要往北，共产党要想发展，就必须得到民众的拥护，你要想得到民众的拥护，就得抗日，你要是不去贴近抗日前线，不去发动群众，不去老百姓办事，共产党怎么发展？老百姓怎么会拥护你？


    企业要想发展很简单，要人民拥护，就必须为人民办事。你为人民办了个什么事？张国焘就显得魄力不足，他想在荒凉的川西北藏区建立一个苏维埃。刘伯承说：这样一比，就看出两个人思路的差别了。所以毛伟人后来总结长征的时候说：方向、路线是至关重要的。


    方向、路线对了头，没有人可以有人，没有枪可以有枪；如果方向、路线错误了，你有再大的力量也会失败。


    ## 14、如何让自己成为一个博大精深的人


    有些人说现在没人读书了，其实是他不读书，他自己认为读书没用了。如果你读书，你会发现周围好多人在读书。如同有些人说赚钱难，其实是你赚钱难，如果你进入一个赚钱的圈子，你会发现，赚钱的人很多而且也不难。


    学习，是一种拼图游戏，是一种心理学现象。首先，你得找到一门有用的学问、知识，我说的有用就是能赚钱的学问知识，然后去模仿，去记忆。模仿多了，记忆多了，就产生是一种“孕妇效应”，就是肚子会越来越大。处处留心皆学问，搜尽奇峰打草稿，就是看到一山一水、一鸟一草、一本书、一个理论，都想着把它卖出去，变成钱，都想知道如何做市场推广？哪里有客户？怎么做包装？无时无刻不是学问，无时无刻不在想变现，我脑袋里随时随地都是金钱、都是投资、都是管理、都是琢磨员工，如何让员工产生利润。


    无人无物不是我师，比如你新招聘一个员工，你不要以为他没本事，你跟他交流，就算他真没本事，他也会启发你的思维。你心里有一个赚钱的理念、投资的理念，有一个主线，有纲有目，有一张吸取知识的大网，你遇到的所有相关的信息，都会往你这张网上撞，全部一网打尽！时间长了，自然比普通人厉害，自然博大精深。


    卫国大夫公孙朝问子贡：“你的老师孔子对于天下事理，无论大小，无不周知，如此博大精深，他的学问从哪里学来的啊？”这个问题，我们现在也常有，看一个高人，学问太大！懂得太多！真不知道他在哪儿学来的！我怎么就没学到呢？跟我透露透露在哪儿有得学，学费多少？我也去学学啊！


    就如同我跟有的老板交流，他赚钱的手段我真是闻所未闻，他赚钱的思路简直多得如沙漠里的沙子，他到底是哪里学来的？子贡对这个问题的回答是：“文王武王之道，并没有掉地里不见了，全都还在人间，只是散落
    了，成了碎片。有贤德出众的人，识见宏远，能记得一些大的纲领。那不平的平常的人呢，识见浅近，但他却记得一些小的末节。不管识见大小，根本纲领还是细枝末节，其中都有文武之道，无处不在。
    夫子的学问呢，就是到处访求，就像舜听到一句有益的话，就能豁然开朗，打开一个新世界。颜回呢，能闻一知十。夫子也是一样，处处留心，无论遇到什么，都是学习，文武大道，随时就在眼前！为何一定要有固定的师承呢？”


    子贡是大商人，实际上不是孔子的得意门生。孔子有很多时候都认为子贡还差得远，但做生意子贡是一把好手，甚至中国的财神也有子贡的名分。子贡此言，把学习的本质讲透了！


    三人同行有我师，人情练达即文章。心事浩茫连广宇，于无声处听惊雷。你只要真正想赚钱啊，你就能找到很多赚钱的人，比如，你若是把知道的全国乃至全球前100名的商人故事、书籍、互联网上的知识都找来看，找我学，研究三年，其实不要三年，研究半年，你就能找到无数多的赚钱方法，你必然会成为一个高手。


    微博、微信、QQ群、网站上，你其实都能找到很多千万富翁、亿万富翁的想法、项目，你同样也能找到在你能力范围内你能操作的项目。无时无刻不是学问，无人无物不是我师。举一反三，切己体察，闻一知十，知行合一。这就是拼图游戏，你能把所有的碎片拼起来，这就是孕妇效应。所谓孕妇效应，就是你平时没注意有多少人怀孕，但是当你怀孕了，或者你太太怀孕了，你一上街，就会发现满大街都是孕妇！你的眼睛自动把她们筛查出来了。


    当你要学习某一样学问，比如要学习文武之道，你就会豁然开了天眼，发现文武百官、贩夫走卒身上，全是文武之道！时时留心，处处访求，你就能把文武之道全拼接完整！别设在孔子的时代能拼接出来，在今天的时代，我们照样能拼接出来。正所谓生活中并不缺少美，只是你有没有一双发现美的眼睛。生活就是我们的老师，教会我们接地气的学问，也教会我们赚钱，生活也教会我们博大精深。


    ## 15、如何修炼专注力


    任何人想要成功，必须是一个具有专注力的人。不能够专心致志的投入到工作中，是没有办法取得任何成就的。我告诉大家一个方法，你按着这个做，就能提高你的专注力。


    首先，你要习惯你关注的东西范围越来越窄，与你事业无关的东西，尽量少去关注。


    其次，做具体事情的时候，不要计划未来，也不要回忆过去。不要与让你不开心、让你分心的人待在一起。如果你有狂躁不安的朋友，那么离开他。大部分刚开始修炼专注力的人都需要给自己寻找到一个安静的地方。并且你需要找一个温度宜人、整洁的环境工作。


    对于专注力非常差的人，可以找些好看的物体，比如一朵美丽的花、一部手机、一副美丽的画，盯着这个东西看，你的心便会自然的受到这个物体的吸引。时间长了，你的专注力自然提高。一段时间后，你会获得心的宁静，这个时候，如果你喜欢音乐，可以考虑专注沉醉在音乐中。如果你不喜欢音乐，可以开始数自己的出入息，就是自己的呼吸。1、2、3、4……4、3、2、1……这样随着自己的呼吸，缓慢的数，人就会平静下来，并且专注力会飞速提升。


    在训练自己的专注力的时候，开始要想象自己喜悦与热忱的心理状态。就是你非常喜悦宁静的沉醉在这件事情上，慢慢的就会形成习惯，真的感受到喜悦与热忱。我在写文章的时候，如果心不专注，我就会在心里默念：我正在写文章。那些多余的念头自然就退散了。我在读书的时候，如果心猿意马，我心里也会默念：我在读书。其他没用的念头也会退散。这样人就能专注在当下所做的事情上面。


    专注力修炼好了，人会达到什么境界呢？就是你做任何事情都会立刻投入，忘记时间，忘记烦恼。甚至，你吃以前觉得恶心的东西，也感觉不到恶心，毫无问题的吃起来。原来影响你的东西，也会变得毫无力量，你会变得更加平衡，更加有气质。你不再被某些强烈的东西吸引，你的心可以随着你的喜欢，自由的投入到任何事物上面。你也可以由自由的收回对任何事物的爱好，你会进入到情绪与感觉都停下来的世界，会升起一种发自内心的喜悦。有人骂你，你会感觉到这根本与你无关。专注力修炼好了，还有很多神奇的效果，大家自己去感受吧。


    ## 16、失败者与成功者最核心的区别


    成功者会失败吗？答案是：会。但成功者会为自己的失败负责。典型的例子，就是史玉柱，他因为修巨人大厦欠下了 2.5 亿元的债务，没有灰心丧气或逃之夭夭，啥也不管了，而是带着团队又一次做起来，并且把债务还多了。


    成功者都是一样的性格，再比如爱迪生，发明电灯，实验了 1000 多次。1000 多次都失败了，但他依然在追求成功。在 1600 多次后，成功发明了电灯。其实周鸿祎也是失败过很多次。所有的成功者，都具有填坑精神，他们会不断的填坑，直到无坑可填。失败者最怕填坑，有的失败者最多填两个坑，就再也不愿意填下去了。


    成功者之所以会成功，是因为他们肯失败，不怕失败，甚至可以失败的次数比任何人都多。社会的真实情况，显然是成功的人是极少数的，想成功而又不成功的占大多数。由于生产力的发展，看起来现在的普通人都比以前的普通人过得好了，10
    年以前的普通人可能都没有自己的手机，没有自己的电脑，而现在的普通人，人人都有自己的手机、自己的电脑。


    看起来，现在的普通人要比 10 年以前的普通人过得更加富裕。但真实的情况却是现在的普通人比以前更加辛苦、更加失败。因为这个社会是个 M 型社会，古往今来，都是成功的人越来越成功，失败的人越来越失败。以前的大学生少，毕业后能找到一份好工作，日子相对好过些。现在满大街都是大学生，虽然都能找到工作，但基本上都是月光族，处在一个不饱不饿的阶段。大家要快速改变自己的观念，否则，时间越往后走，失败者与成功者的鸿沟会越来越大，向社会上层爬更加难。


    失败的人，总是以为自己很聪明，聪明人的想法很简单，付出最少，而得到最多，而且要求在短时间内就得到回报。这种思维，就直接导致一个人变成社会上的失败者。失败者是羊的性格，怕付出过多，怕上当受骗。所以，万事都跟大家一样，就是羊群中的一只羊。只要是大家要的，就是失败者要的；只要是大家做的，失败者也跟着做。既然大家都做，失败者就想：自己跟着做，也没错。基本上失败者就是跟着大众的想法走。


    谈完这些，我要给出我的观点了。


    - 你按照我下面给出的观点来做，定然很快就能进入成功者的行列：


    第一、变成一个喜欢付出很多，没啥收获也继续付出的人。其实呢，只要你付出很多，总会有收获的。


    第二、不要怕上当、吃亏。因为你本来就很穷，你也上不啥大当，但是呢，你却可以不断的积累经验。经验多了，就成老手了，练就一双火眼金睛，离成功也就更近一步了。其实成功就是失败浇灌出来的。妄想没有失败的经验教训而直接成功，本来就是极愚蠢的想法。


    第三、凡是大部分人的想法、做法，自己尽量不要去做。不要征求大部分人的意见，不要跟着大伙伍走，真理与财富一直掌握在少数人手里。如果你的想法、做法跟大部分人一样，你就是典型的失败者。


    要刻意练习一个能赚钱的一技之长才容易服众。我从前认为劳心者治人，劳力者治于人。这世界上有两种功夫，一种是劳心，一种是劳力。我一直认为只有劳心才是最牛的，所以我就无师自通的去学习“劳心之道”。我从很擅长组织、策划、监督、领导、运筹帷幄、察言观色、猜度别人的心思等等功夫。在这条路上，我比大家走得都远，但是这没有用。


    怎么会没用？我花了无数时间终于明白了：其实劳心功夫就是我们说的管理、领导。劳力的功夫就是技术，一技之长。而管理和领导的价值是很难体现出来的，哪怕你在这方面强到了无以复加，别人也不会服你。越是低素质的人群就越是服是因为你管理领导有方，才做出成绩的。


    比如，你组织十个人去做某事，在你的策划下事情做成了，假设就是赚了100万，在分钱的时候，他们会认为你为什么都没有做，这100万是他们的劳动成果。实际上没有你，他们一分钱都赚不到，但你无法证明这点，因为他们会说，既然你说你的价值大，那行，你一个人去做做看。


    你一个人做，需要什么？答案是：一技之长，技术能力。所以一技之长的人，反而容易成为领导者。因为技术这个东西，一伸手就知道有没有，厉害的人就是比普通人强。大家都看得见，就容易服你。所以，我们要刻意练习一个能赚钱的一技之长，用这个来震慑团队里的人。


    ## 17、做企业可以借鉴佛教三条长盛不衰的核心


    第一条，普度众生。


    就是要有帮助人的习惯，而且这个帮助人是不求回报的，所以就会吸引一大批特别的信众愿意施舍财物供养佛教。我做互联网项目也一样，就比如我每天录音给大家讲点做企业的经验、企业管理知识，也吸引了一大批铁杆粉丝，然后我建立了老板社群，就有人付费进我的老板社群。也就是说，想赚钱，必须先免费付出很多。


    第二条，无欲无求。


    佛教的一个核心理念，你不能帮助了别人就天天挂到嘴巴上，你一说，别人就心里就恨你，连朋友都做不了了。也就是说施恩不图报，反而可以长久的做朋友。做老板也是这样，要把心态换过来，有的老板比较傻，他天天说他帮了这个员工，帮了那个员工，结果员工心里很抵触，很反感。你要反过来讲，公司的一切都是员工努力与付出的结果，没有员工，我就啥也不是，这样，员工有归属感，就有成就感，也会更加努力工作，企业就更加有发展前途。


    第三条，只渡有缘人。


    强扭的瓜不甜。有缘千里来相会，无缘对面不相逢。当老板，只提拔那些企图心强的人，他愿意改变，你才给他机会；他不愿意改变，不愿意上进，你就别强行让他上。如果公司缺人，他赚的钱能养活他自己，就留他在公司；如果他赚的钱，当老板的亏本了，就迅速开除。


    这三条能让佛教几千年不倒，用来做企业，也能让企业生存得很好。


    ## 18、中国古代文化对老板的启示


    一粥一饭，当思来之不易。


    一口饭不容易吃，钱不要乱花，业务员跑业务也是很辛苦的，要晓得节约。比如，我们公司装固定电话，我就要求不装了，为什么呢？因为现在大家都用手机，包括人事经理，也是用手机打电话来招聘。用了多少钱实报实销。比如，有人申请买复印机，我开始答应了，后来一想，这东西我们要来也没啥用啊！员工复印一下身份证入档案，我们是互联网公司，我们不如直接做成电子档。所以这个钱又节约下来了。还节约了一个空地，还节约了电费、维修费用等等。


    三姑六婆，实淫盗之媒。


    像尼姑、道姑、修女、什么做媒婆的、算命旳、走街窜巷卖药的，不要多来往。


    大概意思是，做人呢，要专注自己的事业，不要被无关紧要的人打扰。比如，你的同事又说看到什么稀奇古怪的事情，看到什么好看的衣服、电视剧，你不要凑过去聊。因为这对你的事业没帮助。


    经书不可不读，教子要有义方。


    多读经书呢，会明白很多做人做事的道理。多读管理学、经济学的书籍呢，会明白做企业的规律。教育自己的员工呢，要从道义上去教育，不可有私心，否则，员工的眼睛是火眼金睛，当面不说，背后铁定骂娘。对公司的发展没什么好处。


    世界上最伟大的人，一定是人格高尚的人，一定是一个大公无私的人，这就是道。


    勿贪意外之财。


    是谁做的贡献，谁就拿钱，别用自己的权力去压榨那些做出贡献的人。如果你非常贪财，那些做出贡献的人以后就不愿意给你做出贡献了。因为拼命给你干，他自己也拿不到几个钱，他为什么要干？谁给你拼命干，谁是傻子。对职员不要太刻薄，比如给公司打扫卫生的，我就多给了她100
    块工资。因为她挣点钱也不容易，多给点工资以外的钱财，她会更加负责任，努力把公司的卫生搞好，这样，我与同事们上班的心情也好，自然是会把这 100 块的几百倍都赚回来的。


    我非常喜欢品味这些中国文化，里面有大智慧，对我们做企业是非常有好处的。


