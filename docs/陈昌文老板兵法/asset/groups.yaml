    大家这下被我种下了这个种子，以后睡觉就得把鞋子一只冲左，一 只冲右。否则，鞋尖外摆，晚上三魂七魄就穿上你的鞋子跑出去了，你 小心他不回来了。大家鞋尖向里面摆，后果就是：“半夜路过的朋友”
    一看这里有双鞋，穿上，然后看床上有个人，就会上来玩个附身。完了， 这下就会被鬼压身。


