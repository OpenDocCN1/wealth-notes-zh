    隆昌文方法之老板兵法


    # 2、心智能决定人的贫穷与富有


    一个人到底是贫穷还是富有，除了跟外在的环境有关，还与自己内心的**心智能**是什么样子有关。学过物理的人都知道，钻石与煤炭都是碳原子组成的，但钻石坚硬无比，煤炭就没那么坚硬的了。钻石晶莹剔透，煤炭乌漆墨黑，仅仅是因为它们的碳原子的排列方式不同。美国有一个跟踪那些中了大奖的贫穷普通人的调查，发现过
    5 到 10 年，这些人又贫穷了。


    以前我有个经验，我读小学的时候，是班里的第二名，读初中依然是班里的第二名，读高中依然是班里的第二名。当初不明白是怎么回事，现在明白了，其实我当初的心智能式就是第二名，放到任何一群人中，我都会去找准这个位置，与能力无关。


    这个概念往后面讲，大家就会越来越明白，比如很早以前，我有个同事，他与老板吵架了，拍桌子说：“老子就甭当乞丐，也是一流的乞丐，到哪儿都赚钱！”看到了吗？这个人虽然想出人头地，也想混好，但他


    6'
  - '[PAGE 22]


    的心智模式是当乞丐，所以，注定他混不好，他自己还不知道。


    很多人不注意，现在我提出来这个东西，大家要对照自己好好检查一下。一个人为什么有钱？就是因为他的心智模式一直在发现价值，发现可以换成钱的东西。我与老板聊天，老板们永远在聊商业模式，聊赚钱，聊用人，聊未来做什么可以赚钱。他们的心智模式一直集中在发现价值的东西上，其心智模式指向赚钱。


    与普通员工聊天，他们聊的永远是人生理想、惆怅的东西、电影、电视剧，有点品位的也最多聊聊文化。更多的人是抱怨生活，唉声叹气，认为社会对自己不公平，他们的心智模式显然是指向了贫穷。这些人也想发大财，可惜他们不改变这种心智模式永远也赚不到钱，因为他们心智模式指向的不是金钱。我现在已经基本拒绝跟人聊与发现价值与赚钱无关的东西了。


    赚钱的人永远能在别人的抱怨声中发现赚钱的机会，而普通人却能在发财的机会中发现抱怨，这就是两种不同的人的心智模式。


    普通人永远在给自己与自己的孩子灌输钱难赚，创业难，有钱人没几个好东西，男人养小三，女人是小三，这样的观念。自己呢，却又想很有钱，可是天天都在说有钱人的负面信息，在那里纠结，不敢行动，心智模式非常混乱。


    还有一点就是，穷人从深层次讲，他们的心智模式是根本不想有钱'
  - '[PAGE 23]


    的，因为他们不会付出行 动，只会左思右想，有好奇心，仅此而已。而真正的富人是立马行动的。举个例子：一个人要做死了，那么给他一块面包，他肯定是抱着就啃，不会考虑干净不干净。而穷人没这种行动力，他们还没穷够，所以要继续穷下去。我创业的时候，找过很多人跟我一起。有这样一种人，他们说：“试试看”。我一听，顿时就吓坏了。其实几个字，就能了解到一个人的心智模式，也就能看到一个人未来的成败。


    讲试试看的人，注定是失败的，这种人一事无成是必然的。试试看，纯粹是一种借口，还没开始，就给自己找好了退路。碰到这种合伙人，明智的办法是不与他合作。这样的人只适合做普通员工，不适合风雨同舟。


    大家可以静下心来观察一下自己的心智模式，看看自己是穷人的心智模式，还是富人的心智模式？观察清楚了，就进行有针对性的心智建设。


    # 3、物质上的富裕，本源自 于思想上的深刻、精神上的丰富和意志的坚定


    即便是收入较高的职业，比如律师、医生、投行，他们获得更高收入是因为他们具备一些难于获得的知识和技能，但是相对于他们创造的'
  - '[PAGE 24]


    价值，也是较低的。


    因此，如何对自己劳动正确定价，获取自己全部付出的应有回报，是想成为富人的必须考虑的。富人投入精力做有利于自己财富增长的事情，比如开公司、做实业、投资金融等。打工会让人陷入收入只够养家糊口的循环，而且你会没有时间去学习，没有金钱去探索如何挣更多的钱。


    富人拥有正确的消费观。人都是有欲望的，因为贪婪，所以要工作，满足物欲，但是物质满足只能是暂时的，胃口会越来越大，所以想要更多。这是对人性 的精准阐述。问题是，穷人和富人的消费有什么区别呢？


    我以前有个同事，他出国旅游一趟，花费了四十多万在购物上面，这在北京已经足够三到四个普通家庭一年的开销了，但是对于他来说并无负担。他的房租以及购买金融资产带来的收益，可比这多多了，于是在同一年，他又张罗着给自己换了一辆豪车。


    我还认识一些刚毕业一两年的姑娘，省吃俭用两三个月，就是为了给自己买一个LV的包，然后过地铁都不愿放在安检的机器上，怕弄脏了。


    这就是富人和穷人消费的区别：富人不用考虑对自己财务状况造成的影响，穷人反而反其道行之，购买奢侈品等来营造自己购买力的假象，从而给自己造成财务困境。再换一个角度想想，不是富二代的话，谁都有穷的时候，这个时候，多积攒一些金钱，用于投资，或者投资大脑，提高自己的综合能力，或者购买房产或金融产品，而不是用于消费。十年之后，结果完全是两样。消费的产品在物理上可能早就消失了，带来'
  - '[PAGE 25]


    的愉悦感早已过去；如果投资，这时候可能就是一笔不大不小的财富了。


    如果你不懂如何投资，那么，我告诉你一个最保险又肯定快速增值的方法，就是投资学习。不管是看书也好，还是进入富人经常参加的培训圈子也好，都能快速带你致富。你的所见所闻，决定了你的收入。


    想发财，要放弃寻找安全职业的错觉。没有哪个公司能万古长青，基业长存，也没有哪个公司能保证哪天不让你走人，这个社会没有安全的职业。也许在一个企业里奉献了青春，不再年轻，某天发现从事的职业变成了夕阳行业，没了饭碗，这个时候不得不从头做起，和
    20 岁毕业的毛头小子们一起竞争。


    在中国，当然有特殊情况，公务员和国企有编制的员工目前看来还是很安全的。但是，安全感永远不能让别人给，在干事业和读感情上这点是共通的。别人给的安全感，永远只能是自我欺骗的假象。因为别人的想法、环境等因素不是不变化的。


    中国古话讲：富冒险中求，年轻的时候，有冒险的精神非常重要。人富钱生钱。在中国，资本的回报率可比人“贵”多了。一个受过良好教育、工作勤奋的年轻人的，在一线城市一年能有几十万的收入，算得上是不错了。如果考虑一下家庭为了养育这个年轻人所花费的巨额金钱，这个收入的回报真不高。但是金融资产，一年取得
    10% 的回报只能算稀松平常。富人的资产量大，也可以接触到很多普通人接触不到或不着意的渠道，为自己的资本寻找到迅速增值的通道。举个例子来说，上海的一些双语幼儿园，毛利可以达到
    50% 以上。所以，做生意，做老板是一'
  - '[PAGE 26]


    件极其划得来的事情。


    人穷是一种观念，时刻想的是“我不能做这个”“我不能做那个”，正是这些自我施加的桎梏，彻底束缚了一个人追求财富的能力。在中国这个社会，唯独对追求财富，真的没有那么多“不能”的限制，把这些“不能”替换掉，时刻想想“我怎么能做成这个”、“我怎么能做成那个”。我怎么能成为一个亿万富翁，一个10亿级的富豪？做一个积极的思考者和行动者。


    物质上的富裕，本来自于思想上的深刻、精神上的丰富和意志的坚定。


    # 4、没钱的人智商会变低


    没钱的人智商会越来越低，进而越来越没钱；而有钱的人，会变得越来聪明，越来越有钱；所以我们必须赚钱，以防止我们变得越来越笨。


    为什么呢？答案其实很简单。因为人一旦贫穷，就会有很多琐碎的事情要去做，会去担心很多简单的问题，比如你成天得担忧吃饭价钱太贵，'
  - '[PAGE 27]


    买几斤水果也嫌贵。得早早起来去上班，赶公交车，坐地铁，都很浪费

    时间。你遇到的朋友都是和你一样没有未来的人，谈论着对大家前途毫

    无帮助的人物、事情。等到年纪大了，要结婚，又开始担心对象不好找，

    找到了也不满意，接下来要开始担心买房子没钱，好不容易父母帮着付

    了个首付，又要每月还贷。结婚后养了小孩了，成天纠结给孩子的奶粉钱、

    尿布钱，随着孩子长大，教育的花费，早晚接送小孩上学，都是非常浪

    费人力精力的事情，各种各样的琐事多得不得了。


    一个人的琐事多了，就没办法专心提高自己的竞争力。不能专心提

    高自己竞争力，就会终身贫穷。而人穷了，就必须面对这些琐事。


    我以前打工的时候，认识好几个人，他们中午都带饭到公司吃，公

    司还给他们准备了微波炉。他们晚上回家要做菜做饭，准备好第二天的

    饭菜。这就是穷人，为了节约20块钱，浪费至少一个小时去做饭，做菜。

    不会算账，认为自己的一个小时就只值20块钱。而我当年打工的时候，

    赚的钱全部花掉，一分不剩，本来就没几个钱，当然我从来不乱花钱，

    我不会去浪费一个小时买菜做饭，我都是直接到餐厅吃饭。其实当一

    个人贫穷的时候，根本省不下来几个钱，但时间却是异常宝贵的，我用节

    约下来的时间，全部投入到学习与工作中，非常快的就拉开了与普通同

    事的差距，很快就能比这些人多挣几千块了，我过得就越来越潇洒。普

    通人还在在为自己能节约几十块钱沾沾自喜，认为自己会过生活。我在挣

    4000块一个月的时候，就经常打车，一给就是100块钱的出租车费用。

    坐公交，等公交，非常浪费时间，可能要多付出30分钟到一个小时不等。

    我节约了时间就投入到工作与学习中。当年的那些同事认为我这个人很'
  - '[PAGE 28]


    奢侈，实际上奢侈的是他们，他们愿意用自己一个小时的生命来交换100块钱。我只用了半年时间都做不到，很多同事就成了我的下属。


    很多事情其实就是个简单的思想问题，大家想通了就会非常简单，想不通就苦逼一辈子。


    富人聪明在什么地方呢？这些穷人看来天大的事情，其实只需要一笔钱，就能完全解决掉。甚至是每月多赚一万块，穷人的所有问题，都变得不是问题了，问题可以找其他人代劳，而自己就专心赚钱。当钱赚得越来越多的时候，这些烦事就越来越不是问题。那些聪明人花3000、4000块钱请个保姆，洗衣、做饭、拖地，甚至叠被子，都不用自己做了，每天至少节约3到5个小时，而且保姆很专业，做得比自己好得多。每天都可以穿洗过的衣服，吃香喷喷的饭菜。聪明人用所有的时间来看书与工作，参加提高自己的培训。这样，聪明人会越来越聪明，工作做得越来越好。而笨蛋从来不舍得投资自己，从来不参加培训提高自己，也不喜欢看书，更加不拼命工作，相反工作时还偷奸耍滑。


    所谓术业有专攻，穷人就是会得太多了，会得多，就不专业，每一项都做得普普通通，在社会上毫无竞争力。所以我建议现在贫穷的人，把你的钱都花出去，用来买时间，用来学习和工作。越是贫穷，越不要看重钱，你能节约几个钱？能赚钱才是王道，你一年本来就赚不到20万块钱，节约起来有意思吗？毫无意义啊。'
  - '[PAGE 29]


    # 5、弱肉强食是天道


    弱肉强食，物竞天择，适者生存，这些都是天道，生意人必须深刻认识到这个观念，才有助于赚更多的钱，把企业经营得更好，企业有利润才能生生不息，才能为社会做贡献。比如，有些人认为战争是丑恶行为，看到战争死亡的人数就觉得残忍，却不知道我们人类每天杀的生物比战争死亡的人数不知道要多出多少倍。难道那些就不是生命了吗？


    可能有的人说，这些畜生是没有思想的低等生物，死不足惜，那么等到有一天，比我们人类智慧高万倍的外星人来到地球的时候，外星人看到我们就好像我们看到老鼠一样，并决定要将我们变成他们的家畜的时候，我们就可以回想一下我们自己的立场——死不足惜。


    大自然也会推动一些东西的进化来抗衡人类的迅速繁衍，比如各种不同的新病菌或者不能治疗的疾病，就夺走了许多人的生命。


    吃素的人也别以为自己不杀生，因为你吃的那碗饭与蔬菜，也是要用很多农药，杀死很多虫子，你才能吃得到的。并且你吃了，其他生物就吃不了一，他们就少了一口粮食，就得挨饿或者饿死。'
  - '[PAGE 30]


    大自然的进化和平衡规律就是弱肉强食，竞争的本质就是一消一长，一存一亡。大家看看互联网行业的兼并成多么激烈，就应该明白这个道理。这种定律也是源自于我们的基因，就算刚出生的婴儿也是弱肉强食才诞生下来的，因为他需要击败众多的竞争者，上亿的精子要壮烈牺牲，才会有一个小孩生下来。


    假如你去很多动物园看，活鸡喂老虎和狮子的表演，你就可以体会一下老虎“气吞天下”的强者霸气与血腥残忍的场景，然后临走的时候，回头凝望老虎，与它惺惺相惜，与它议英雄、重英雄的喃喃自语：“这就是强者的天下，也是大自然的游戏规则，成王败寇，弱者不应该有任何怨言。”因为老虎与狮子贵为百兽之王，也被我们人类征服，成为盘中餐或者玩物。


    我知道京东商城的刘强东、雅虎的杨致远、微软的比尔盖茨都不约而同的说过，“我不喜欢输的感觉，我喜欢竞争，我喜欢在竞争中获得胜利。”这句话语气似乎狂妄自大，但流露出狮子、老虎的霸气，道出了每一个强者的心态。一个强者必须做强者的心态，必须理解这个世界就是弱肉强食，永远都是强者制订游戏规则，你弱，你就没有说话的权力。所以，每一个人都强大自己吧，因为输了、落后了，轻则挨打，重则灭亡！一个国家，是这样。做企业，做人都是这样的。你弱，你还拥有美好的生活，这可能吗？'
  - '[PAGE 31]


    # 6、社会本来就是一个交易系统，

    别指望优秀的人做亏本生意


    部分人总觉得老天不公平，自己孤独，说那些优秀的人都有自己牛B的圈子，如果他们没有那个圈子就什么也不是。看起来好像很正确无比。比如俞敏洪进了北京大学，有了徐小平、王强这些同学，才有了后来的新东方。但我想说，首先俞敏洪能从农村考进北大，能和优秀的人成为朋友，这本来就证明了俞敏洪是一个优秀的人。


    只有你是一个优秀的人，其他优秀的人才愿意和你交朋友。如果你不优秀，那么挖空心思混迹各种牛B的圈子，实际上意义不大。越是优秀的圈子，大家越是精明。表面看起来优秀圈子的人好接触，平易近人、彬彬有礼，实际上并非如此，而是因为他们不得不这样，以免得罪人。真正要与优秀的人有所深交，你必须也是
    很优秀 的人，必须能和他们交易。不管是精神上的，还是物质上的。社会本来就是一个交易系统，别指望优秀的人做亏本生意。大家在一起，就是互利互惠，这从另一个角度也能说明，如果你价值不大，不愿意或者不能做出对应的贡献，那么你也'
  - '[PAGE 32]


    是交不到对应层次的朋友。


    所以我不建议老板出于结交人脉发财的目的，去外面混什么老板圈子、商业圈子，因为这毫无意义，简直就是浪费时间，大家都精明得跟鬼一样。而自己专心去拓展自己的业务，做好自己的事情，才是正事。等自己把业务做好了，把自己的事情做好了，你会惊讶的发现，你的圈子也随着你的事业水涨船高了。你周围自然就聚集起来优秀的人，那些不优秀的人就会自动远离你，就算开始大家在一起，不优秀的人也会自动掉队。而如果你一心想着靠别人发财，想去混个什么圈子企图改变自己的社会地位、经济地位，其结果只能是徒劳。就算侥幸被你混进某个高端圈子，你也只能是那个圈子里的可怜虫。当然如果你纯粹是为了进入高端圈子学点经验，我觉得还是有必要的。但是如果你想结交高端圈子的老板，做对自己有利的事，那么你要拿出交易思维，你能给别人什么。


    一句话总结，就是物以类聚，人以群分。老板更加要踏实，有梦想，但是要按照计划，一步一步的去实现。'
  - '[PAGE 33]


    # 7、观察、理解，然后改变这个世界


    我一直在思考，我们人来到这个世界上首先应该该干嘛？明显是观察这个世界，享受这个世界，只有你细心的观察这个世界，你才会发现些什么，然后你要试着理解这个世界。很多人找不到赚钱的门道，辛辛苦苦一辈子，依然贫穷，而有的人呢，轻轻松松就赚到钱了。就是理解世界的程度不一样，角度不一样。


    农民工对自己的孩子讲，学个电焊，学个挖掘机，学个厨尉就能有口饭吃，这是农民工对世界的理解。这种理解，自然是很难赚到钱的。很多工人对自己的子女讲，好好学习，考一个好大学，将来能找到一份好工作。这种理解呢，只会成为一个房贷式的工薪阶层，自然也是难以赚到钱的。而老板，既不学技术，也不好好找一份工作，一心只为当老板，只为做企业，其他的事情绝不干，这种理解世界的方式，比前面两种人要多赚点，但还不够牛B。


    我当年写程序，做网站，开公司，也赚了几个小钱。我们有一个投资人，年初投了几十万，年末就直接赚了几十万，回本了，后来他就一'
  - '[PAGE 34]


    直拿这个企业的分红。这个投资人，一年到头都不来公司看看，而且他投资了好几十个这样的小企业。他赚得是最多的。为什么他赚了这么多？就是因为他的理解世界的方式不一样。


    在赚钱与做事业这条路上，怎么知道自己理解世界的方式错了？答案很简单，就是你干了半年或者一年，依旧很贫穷，没有赚到钱，就说明你理解世界的方式有问题。你就要迅速学习新的理解世界的方式。结果是最好的检验你的思维是否有效的工具。时代不一样了，有人仅用三年、五年，就成为百亿级别的富豪了。


    我现在的重点工作就是全面、充分、精准的理解这个世界，这能让我的决策更加的正确。只有理解了这个世界，我们才能改变这个世界，创造一些市场上真正需要的产品与服务。只有理解了这个世界，我们才能明白这个世界需要我们为他做些什么。比如，某打车的创始人为什么要做打车这款软件？就是因为他自己打车的时候不方便，他认为如果我们做一个软件，能点一下，就把车叫过来，这样不就更加有效率？于是，他就做了这样一个改变世界的软件。


    只要你理解了这个世界，你就会找到很多可以改变这个世界的机会，比如传统行业都需要用新技术去提升他们的效率，都可以借助互联网工具进一步升级，这里面就有很多改变世界的机会。所以，只要你选择一个领域，用一些新技术、新工具去改变你理解的这个世界，那么赚上几个亿都是容易的事情。'
  - '[PAGE 35]


    # 8、穷人与富人之间的 6 条区别


    穷人和富人是有不少区别的。


    第一，富人思维就是要有很强的资源整合能力，而不是自己去干苦力，富人要知道别人在乎什么，不在乎什么。往往穷人当做垃圾看待的东西，在富人的眼里就是宝贝和黄金，而这一切都会体现在一个统一化标准的载体上，那就是“货币”。富人就是有本事把垃圾卖成高价的人，把垃圾卖成高价，是通过资源整合能力，而不是体力。


    第二，凡是富有的人，总是选好好一个方向，就算没有收入也能保持激情，保持疯狂的投入时间与精力，目的就是要1 块钱变成一千万、一个亿，相信自己能办到。而穷人，总是不断的否定别人提出来的任何一个致富方案。


    第三，富人喜欢学金融、管理、人文、历史。穷人喜欢学电视剧、鸡毛蒜皮、家长里短、各种八卦。'
  - '[PAGE 36]


    第四，穷人是想要把什么条件都准备好了才行动，穷人认为做什么都时机未成熟，穷人喜欢找借口，喜欢等，这一等就是几年、几十年、一辈子。而富人思维是，想到一个大目标，立马开始行动，边行动边完善，结果还真给他做成了。


    第五，能不能主动做事是一种天赋，凡是富人，都是主动去把事情完善好的人。而穷人，你需要去指挥他，更有甚者，你就算扣他钱，他也不努力，表现得无所谓的样子。穷人好像对什么都没兴趣，死猪不怕开水烫，也不怕社会的惩罚，穷就穷，他们总能找到之所以穷的理由。


    第六，富人会找很多方法，去达到那些看似很困难的目标。穷人一听到一个稍微超出自己能力的目标，就说“做不到”。我现在的做法就是不给这样的穷人提供工作机会，既然他做不到，我就不让他做了。公司是在找方法克服困难的过程中成长的，而不是大声疾呼“做不到”的过程中成长的。


    其实公司就是靠20%的人养活的，甚至，公司就是靠两三个人养活的。甚至，一个国家的命运，也是由小部分人决定的，如果你能找到这两三个人，把这少数人经营好，你就能经营好一个机构，不管这个机构有多大。


    当你成年了，你的家庭若是很贫穷，很多时候，命运已经注定。如果你过了25岁，此刻，你应该放弃那些对你收入提高无意义的事情，全身心的找到一个项目，一直努力下去，改变在此一举。时间已经不允许'
  md: '

    ## 2、心智能决定人的贫穷与富有


    一个人到底是贫穷还是富有，除了跟外在的环境有关，还与自己内心的**心智能**是什么样子有关。学过物理的人都知道，钻石与煤炭都是碳原子组成的，但钻石坚硬无比，煤炭就没那么坚硬的了。钻石晶莹剔透，煤炭乌漆墨黑，仅仅是因为它们的碳原子的排列方式不同。美国有一个跟踪那些中了大奖的贫穷普通人的调查，发现过
    5 到 10 年，这些人又贫穷了。


    以前我有个经验，我读小学的时候，是班里的第二名，读初中依然是班里的第二名，读高中依然是班里的第二名。当初不明白是怎么回事，现在明白了，其实我当初的心智能式就是第二名，放到任何一群人中，我都会去找准这个位置，与能力无关。


    这个概念往后面讲，大家就会越来越明白，比如很早以前，我有个同事，他与老板吵架了，拍桌子说：“老子就甭当乞丐，也是一流的乞丐，到哪儿都赚钱！”看到了吗？这个人虽然想出人头地，也想混好，但他的心智模式是当乞丐，所以，注定他混不好，他自己还不知道。


    很多人不注意，现在我提出来这个东西，大家要对照自己好好检查一下。一个人为什么有钱？就是因为他的心智模式一直在发现价值，发现可以换成钱的东西。我与老板聊天，老板们永远在聊商业模式，聊赚钱，聊用人，聊未来做什么可以赚钱。他们的心智模式一直集中在发现价值的东西上，其心智模式指向赚钱。


    与普通员工聊天，他们聊的永远是人生理想、惆怅的东西、电影、电视剧，有点品位的也最多聊聊文化。更多的人是抱怨生活，唉声叹气，认为社会对自己不公平，他们的心智模式显然是指向了贫穷。这些人也想发大财，可惜他们不改变这种心智模式永远也赚不到钱，因为他们心智模式指向的不是金钱。我现在已经基本拒绝跟人聊与发现价值与赚钱无关的东西了。


    赚钱的人永远能在别人的抱怨声中发现赚钱的机会，而普通人却能在发财的机会中发现抱怨，这就是两种不同的人的心智模式。


    普通人永远在给自己与自己的孩子灌输钱难赚，创业难，有钱人没几个好东西，男人养小三，女人是小三，这样的观念。自己呢，却又想很有钱，可是天天都在说有钱人的负面信息，在那里纠结，不敢行动，心智模式非常混乱。


    还有一点就是，穷人从深层次讲，他们的心智模式是根本不想有钱的，因为他们不会付出行 动，只会左思右想，有好奇心，仅此而已。而真正的富人是立马行动的。举个例子：一个人要做死了，那么给他一块面包，他肯定是抱着就啃，不会考虑干净不干净。而穷人没这种行动力，他们还没穷够，所以要继续穷下去。我创业的时候，找过很多人跟我一起。有这样一种人，他们说：“试试看”。我一听，顿时就吓坏了。其实几个字，就能了解到一个人的心智模式，也就能看到一个人未来的成败。


    讲试试看的人，注定是失败的，这种人一事无成是必然的。试试看，纯粹是一种借口，还没开始，就给自己找好了退路。碰到这种合伙人，明智的办法是不与他合作。这样的人只适合做普通员工，不适合风雨同舟。


    大家可以静下心来观察一下自己的心智模式，看看自己是穷人的心智模式，还是富人的心智模式？观察清楚了，就进行有针对性的心智建设。


    ## 3、物质上的富裕，本源自 于思想上的深刻、精神上的丰富和意志的坚定


    即便是收入较高的职业，比如律师、医生、投行，他们获得更高收入是因为他们具备一些难于获得的知识和技能，但是相对于他们创造的价值，也是较低的。


    因此，如何对自己劳动正确定价，获取自己全部付出的应有回报，是想成为富人的必须考虑的。富人投入精力做有利于自己财富增长的事情，比如开公司、做实业、投资金融等。打工会让人陷入收入只够养家糊口的循环，而且你会没有时间去学习，没有金钱去探索如何挣更多的钱。


    富人拥有正确的消费观。人都是有欲望的，因为贪婪，所以要工作，满足物欲，但是物质满足只能是暂时的，胃口会越来越大，所以想要更多。这是对人性 的精准阐述。问题是，穷人和富人的消费有什么区别呢？


    我以前有个同事，他出国旅游一趟，花费了四十多万在购物上面，这在北京已经足够三到四个普通家庭一年的开销了，但是对于他来说并无负担。他的房租以及购买金融资产带来的收益，可比这多多了，于是在同一年，他又张罗着给自己换了一辆豪车。


    我还认识一些刚毕业一两年的姑娘，省吃俭用两三个月，就是为了给自己买一个LV的包，然后过地铁都不愿放在安检的机器上，怕弄脏了。


    这就是富人和穷人消费的区别：富人不用考虑对自己财务状况造成的影响，穷人反而反其道行之，购买奢侈品等来营造自己购买力的假象，从而给自己造成财务困境。再换一个角度想想，不是富二代的话，谁都有穷的时候，这个时候，多积攒一些金钱，用于投资，或者投资大脑，提高自己的综合能力，或者购买房产或金融产品，而不是用于消费。十年之后，结果完全是两样。消费的产品在物理上可能早就消失了，带来的愉悦感早已过去；如果投资，这时候可能就是一笔不大不小的财富了。


    如果你不懂如何投资，那么，我告诉你一个最保险又肯定快速增值的方法，就是投资学习。不管是看书也好，还是进入富人经常参加的培训圈子也好，都能快速带你致富。你的所见所闻，决定了你的收入。


    想发财，要放弃寻找安全职业的错觉。没有哪个公司能万古长青，基业长存，也没有哪个公司能保证哪天不让你走人，这个社会没有安全的职业。也许在一个企业里奉献了青春，不再年轻，某天发现从事的职业变成了夕阳行业，没了饭碗，这个时候不得不从头做起，和
    20 岁毕业的毛头小子们一起竞争。


    在中国，当然有特殊情况，公务员和国企有编制的员工目前看来还是很安全的。但是，安全感永远不能让别人给，在干事业和读感情上这点是共通的。别人给的安全感，永远只能是自我欺骗的假象。因为别人的想法、环境等因素不是不变化的。


    中国古话讲：富冒险中求，年轻的时候，有冒险的精神非常重要。人富钱生钱。在中国，资本的回报率可比人“贵”多了。一个受过良好教育、工作勤奋的年轻人的，在一线城市一年能有几十万的收入，算得上是不错了。如果考虑一下家庭为了养育这个年轻人所花费的巨额金钱，这个收入的回报真不高。但是金融资产，一年取得
    10% 的回报只能算稀松平常。富人的资产量大，也可以接触到很多普通人接触不到或不着意的渠道，为自己的资本寻找到迅速增值的通道。举个例子来说，上海的一些双语幼儿园，毛利可以达到
    50% 以上。所以，做生意，做老板是一件极其划得来的事情。


    人穷是一种观念，时刻想的是“我不能做这个”“我不能做那个”，正是这些自我施加的桎梏，彻底束缚了一个人追求财富的能力。在中国这个社会，唯独对追求财富，真的没有那么多“不能”的限制，把这些“不能”替换掉，时刻想想“我怎么能做成这个”、“我怎么能做成那个”。我怎么能成为一个亿万富翁，一个10亿级的富豪？做一个积极的思考者和行动者。


    物质上的富裕，本来自于思想上的深刻、精神上的丰富和意志的坚定。


    ## 4、没钱的人智商会变低


    没钱的人智商会越来越低，进而越来越没钱；而有钱的人，会变得越来聪明，越来越有钱；所以我们必须赚钱，以防止我们变得越来越笨。


    为什么呢？答案其实很简单。因为人一旦贫穷，就会有很多琐碎的事情要去做，会去担心很多简单的问题，比如你成天得担忧吃饭价钱太贵，买几斤水果也嫌贵。得早早起来去上班，赶公交车，坐地铁，都很浪费时间。你遇到的朋友都是和你一样没有未来的人，谈论着对大家前途毫无帮助的人物、事情。等到年纪大了，要结婚，又开始担心对象不好找，找到了也不满意，接下来要开始担心买房子没钱，好不容易父母帮着付了个首付，又要每月还贷。结婚后养了小孩了，成天纠结给孩子的奶粉钱、尿布钱，随着孩子长大，教育的花费，早晚接送小孩上学，都是非常浪费人力精力的事情，各种各样的琐事多得不得了。


    一个人的琐事多了，就没办法专心提高自己的竞争力。不能专心提高自己竞争力，就会终身贫穷。而人穷了，就必须面对这些琐事。


    我以前打工的时候，认识好几个人，他们中午都带饭到公司吃，公司还给他们准备了微波炉。他们晚上回家要做菜做饭，准备好第二天的饭菜。这就是穷人，为了节约20块钱，浪费至少一个小时去做饭，做菜。不会算账，认为自己的一个小时就只值20块钱。而我当年打工的时候，赚的钱全部花掉，一分不剩，本来就没几个钱，当然我从来不乱花钱，我不会去浪费一个小时买菜做饭，我都是直接到餐厅吃饭。其实当一个人贫穷的时候，根本省不下来几个钱，但时间却是异常宝贵的，我用节约下来的时间，全部投入到学习与工作中，非常快的就拉开了与普通同事的差距，很快就能比这些人多挣几千块了，我过得就越来越潇洒。普通人还在在为自己能节约几十块钱沾沾自喜，认为自己会过生活。我在挣
    4000 块一个月的时候，就经常打车，一给就是100块钱的出租车费用。坐公交，等公交，非常浪费时间，可能要多付出30分钟到一个小时不等。我节约了时间就投入到工作与学习中。当年的那些同事认为我这个人很奢侈，实际上奢侈的是他们，他们愿意用自己一个小时的生命来交换100块钱。我只用了半年时间都做不到，很多同事就成了我的下属。


    很多事情其实就是个简单的思想问题，大家想通了就会非常简单，想不通就苦逼一辈子。


    富人聪明在什么地方呢？这些穷人看来天大的事情，其实只需要一笔钱，就能完全解决掉。甚至是每月多赚一万块，穷人的所有问题，都变得不是问题了，问题可以找其他人代劳，而自己就专心赚钱。当钱赚得越来越多的时候，这些烦事就越来越不是问题。那些聪明人花3000、4000块钱请个保姆，洗衣、做饭、拖地，甚至叠被子，都不用自己做了，每天至少节约3到5个小时，而且保姆很专业，做得比自己好得多。每天都可以穿洗过的衣服，吃香喷喷的饭菜。聪明人用所有的时间来看书与工作，参加提高自己的培训。这样，聪明人会越来越聪明，工作做得越来越好。而笨蛋从来不舍得投资自己，从来不参加培训提高自己，也不喜欢看书，更加不拼命工作，相反工作时还偷奸耍滑。


    所谓术业有专攻，穷人就是会得太多了，会得多，就不专业，每一项都做得普普通通，在社会上毫无竞争力。所以我建议现在贫穷的人，把你的钱都花出去，用来买时间，用来学习和工作。越是贫穷，越不要看重钱，你能节约几个钱？能赚钱才是王道，你一年本来就赚不到20万块钱，节约起来有意思吗？毫无意义啊。


    ## 5、弱肉强食是天道


    弱肉强食，物竞天择，适者生存，这些都是天道，生意人必须深刻认识到这个观念，才有助于赚更多的钱，把企业经营得更好，企业有利润才能生生不息，才能为社会做贡献。比如，有些人认为战争是丑恶行为，看到战争死亡的人数就觉得残忍，却不知道我们人类每天杀的生物比战争死亡的人数不知道要多出多少倍。难道那些就不是生命了吗？


    可能有的人说，这些畜生是没有思想的低等生物，死不足惜，那么等到有一天，比我们人类智慧高万倍的外星人来到地球的时候，外星人看到我们就好像我们看到老鼠一样，并决定要将我们变成他们的家畜的时候，我们就可以回想一下我们自己的立场——死不足惜。


    大自然也会推动一些东西的进化来抗衡人类的迅速繁衍，比如各种不同的新病菌或者不能治疗的疾病，就夺走了许多人的生命。


    吃素的人也别以为自己不杀生，因为你吃的那碗饭与蔬菜，也是要用很多农药，杀死很多虫子，你才能吃得到的。并且你吃了，其他生物就吃不了一，他们就少了一口粮食，就得挨饿或者饿死。


    大自然的进化和平衡规律就是弱肉强食，竞争的本质就是一消一长，一存一亡。大家看看互联网行业的兼并成多么激烈，就应该明白这个道理。这种定律也是源自于我们的基因，就算刚出生的婴儿也是弱肉强食才诞生下来的，因为他需要击败众多的竞争者，上亿的精子要壮烈牺牲，才会有一个小孩生下来。


    假如你去很多动物园看，活鸡喂老虎和狮子的表演，你就可以体会一下老虎“气吞天下”的强者霸气与血腥残忍的场景，然后临走的时候，回头凝望老虎，与它惺惺相惜，与它议英雄、重英雄的喃喃自语：“这就是强者的天下，也是大自然的游戏规则，成王败寇，弱者不应该有任何怨言。”因为老虎与狮子贵为百兽之王，也被我们人类征服，成为盘中餐或者玩物。


    我知道京东商城的刘强东、雅虎的杨致远、微软的比尔盖茨都不约而同的说过，“我不喜欢输的感觉，我喜欢竞争，我喜欢在竞争中获得胜利。”这句话语气似乎狂妄自大，但流露出狮子、老虎的霸气，道出了每一个强者的心态。一个强者必须做强者的心态，必须理解这个世界就是弱肉强食，永远都是强者制订游戏规则，你弱，你就没有说话的权力。所以，每一个人都强大自己吧，因为输了、落后了，轻则挨打，重则灭亡！一个国家，是这样。做企业，做人都是这样的。你弱，你还拥有美好的生活，这可能吗？


    ## 6、社会本来就是一个交易系统，别指望优秀的人做亏本生意


    部分人总觉得老天不公平，自己孤独，说那些优秀的人都有自己牛B的圈子，如果他们没有那个圈子就什么也不是。看起来好像很正确无比。比如俞敏洪进了北京大学，有了徐小平、王强这些同学，才有了后来的新东方。但我想说，首先俞敏洪能从农村考进北大，能和优秀的人成为朋友，这本来就证明了俞敏洪是一个优秀的人。


    只有你是一个优秀的人，其他优秀的人才愿意和你交朋友。如果你不优秀，那么挖空心思混迹各种牛B的圈子，实际上意义不大。越是优秀的圈子，大家越是精明。表面看起来优秀圈子的人好接触，平易近人、彬彬有礼，实际上并非如此，而是因为他们不得不这样，以免得罪人。真正要与优秀的人有所深交，你必须也是
    很优秀 的人，必须能和他们交易。不管是精神上的，还是物质上的。社会本来就是一个交易系统，别指望优秀的人做亏本生意。大家在一起，就是互利互惠，这从另一个角度也能说明，如果你价值不大，不愿意或者不能做出对应的贡献，那么你也是交不到对应层次的朋友。


    所以我不建议老板出于结交人脉发财的目的，去外面混什么老板圈子、商业圈子，因为这毫无意义，简直就是浪费时间，大家都精明得跟鬼一样。而自己专心去拓展自己的业务，做好自己的事情，才是正事。等自己把业务做好了，把自己的事情做好了，你会惊讶的发现，你的圈子也随着你的事业水涨船高了。你周围自然就聚集起来优秀的人，那些不优秀的人就会自动远离你，就算开始大家在一起，不优秀的人也会自动掉队。而如果你一心想着靠别人发财，想去混个什么圈子企图改变自己的社会地位、经济地位，其结果只能是徒劳。就算侥幸被你混进某个高端圈子，你也只能是那个圈子里的可怜虫。当然如果你纯粹是为了进入高端圈子学点经验，我觉得还是有必要的。但是如果你想结交高端圈子的老板，做对自己有利的事，那么你要拿出交易思维，你能给别人什么。


    一句话总结，就是物以类聚，人以群分。老板更加要踏实，有梦想，但是要按照计划，一步一步的去实现。


    ## 7、观察、理解，然后改变这个世界


    我一直在思考，我们人来到这个世界上首先应该该干嘛？明显是观察这个世界，享受这个世界，只有你细心的观察这个世界，你才会发现些什么，然后你要试着理解这个世界。很多人找不到赚钱的门道，辛辛苦苦一辈子，依然贫穷，而有的人呢，轻轻松松就赚到钱了。就是理解世界的程度不一样，角度不一样。


    农民工对自己的孩子讲，学个电焊，学个挖掘机，学个厨尉就能有口饭吃，这是农民工对世界的理解。这种理解，自然是很难赚到钱的。很多工人对自己的子女讲，好好学习，考一个好大学，将来能找到一份好工作。这种理解呢，只会成为一个房贷式的工薪阶层，自然也是难以赚到钱的。而老板，既不学技术，也不好好找一份工作，一心只为当老板，只为做企业，其他的事情绝不干，这种理解世界的方式，比前面两种人要多赚点，但还不够牛B。


    我当年写程序，做网站，开公司，也赚了几个小钱。我们有一个投资人，年初投了几十万，年末就直接赚了几十万，回本了，后来他就一直拿这个企业的分红。这个投资人，一年到头都不来公司看看，而且他投资了好几十个这样的小企业。他赚得是最多的。为什么他赚了这么多？就是因为他的理解世界的方式不一样。


    在赚钱与做事业这条路上，怎么知道自己理解世界的方式错了？答案很简单，就是你干了半年或者一年，依旧很贫穷，没有赚到钱，就说明你理解世界的方式有问题。你就要迅速学习新的理解世界的方式。结果是最好的检验你的思维是否有效的工具。时代不一样了，有人仅用三年、五年，就成为百亿级别的富豪了。


    我现在的重点工作就是全面、充分、精准的理解这个世界，这能让我的决策更加的正确。只有理解了这个世界，我们才能改变这个世界，创造一些市场上真正需要的产品与服务。只有理解了这个世界，我们才能明白这个世界需要我们为他做些什么。比如，某打车的创始人为什么要做打车这款软件？就是因为他自己打车的时候不方便，他认为如果我们做一个软件，能点一下，就把车叫过来，这样不就更加有效率？于是，他就做了这样一个改变世界的软件。


    只要你理解了这个世界，你就会找到很多可以改变这个世界的机会，比如传统行业都需要用新技术去提升他们的效率，都可以借助互联网工具进一步升级，这里面就有很多改变世界的机会。所以，只要你选择一个领域，用一些新技术、新工具去改变你理解的这个世界，那么赚上几个亿都是容易的事情。


    ## 8、穷人与富人之间的 6 条区别


    穷人和富人是有不少区别的。


    - 第一，富人思维就是要有很强的资源整合能力，而不是自己去干苦力，富人要知道别人在乎什么，不在乎什么。往往穷人当做垃圾看待的东西，在富人的眼里就是宝贝和黄金，而这一切都会体现在一个统一化标准的载体上，那就是“货币”。富人就是有本事把垃圾卖成高价的人，把垃圾卖成高价，是通过资源整合能力，而不是体力。

    - 第二，凡是富有的人，总是选好好一个方向，就算没有收入也能保持激情，保持疯狂的投入时间与精力，目的就是要1 块钱变成一千万、一个亿，相信自己能办到。而穷人，总是不断的否定别人提出来的任何一个致富方案。

    - 第三，富人喜欢学金融、管理、人文、历史。穷人喜欢学电视剧、鸡毛蒜皮、家长里短、各种八卦。

    - 第四，穷人是想要把什么条件都准备好了才行动，穷人认为做什么都时机未成熟，穷人喜欢找借口，喜欢等，这一等就是几年、几十年、一辈子。而富人思维是，想到一个大目标，立马开始行动，边行动边完善，结果还真给他做成了。

    - 第五，能不能主动做事是一种天赋，凡是富人，都是主动去把事情完善好的人。而穷人，你需要去指挥他，更有甚者，你就算扣他钱，他也不努力，表现得无所谓的样子。穷人好像对什么都没兴趣，死猪不怕开水烫，也不怕社会的惩罚，穷就穷，他们总能找到之所以穷的理由。

    - 第六，富人会找很多方法，去达到那些看似很困难的目标。穷人一听到一个稍微超出自己能力的目标，就说“做不到”。我现在的做法就是不给这样的穷人提供工作机会，既然他做不到，我就不让他做了。公司是在找方法克服困难的过程中成长的，而不是大声疾呼“做不到”的过程中成长的。


    其实公司就是靠20%的人养活的，甚至，公司就是靠两三个人养活的。甚至，一个国家的命运，也是由小部分人决定的，如果你能找到这两三个人，把这少数人经营好，你就能经营好一个机构，不管这个机构有多大。


    当你成年了，你的家庭若是很贫穷，很多时候，命运已经注定。如果你过了25岁，此刻，你应该放弃那些对你收入提高无意义的事情，全身心的找到一个项目，一直努力下去，改变在此一举。时间已经不允许

