    为皇太后临终之前留下一句话，说她的丧事只能让和珅来办。这就是皇太后对他形成了成瘾性依赖，连死了都对他有依赖。撇开所有的封建余孽不讲，我们以上讲的是服务的精抻，是老板应该好好琢磨琢磨的东西。


    我们要讲的是，打造优质的服务品质，为客户制造最好的服务体验，这当中一定要有真正的服务精神。只有这样才不仅能制造客户满意度，而且能制造客户尖叫度；不仅能够让客户在接受服务的时候满意，而且能对你形成一种成瘾性的依赖。


    我一直强调，做事就是要做到极致，先把自己感动了，才能感动顾客。感动了顾客，带着这种精抻去做项目，去做服务，不赚钱是没有天理的！


    # 13、做一个认栽的高手


    历史上的牛人，都是肯等待的人。等待并不是玩蟹，而是默默的储存实力，找到机会。遇到危险了就开始逃跑、装死，也是大人物的作风。装死这招，都是牛人喜欢干的。比如，齐桓公当年跟他兄弟争国王的位置，被管仲射了一箭，齐桓公赶忙滚下马，口吐鲜血，死了。其实是装死。管仲大喜，骑着马就逃命了。齐桓公等管仲走了，又爬起来，倍道兼行'
  - '[PAGE 130]


    跑回齐国首都当国王去了。


    认栽比较出名的韩信，甘愿受胯下之辱，钻一个妇人的裤裆，后来当了大将军。可以这样说，凡是成大事的大将军、王爷、皇太子、皇帝、老板，都是认栽高手。老子讲，弱胜强。坚强者，死之徒。比较硬气的，不是死了，就是上了梁山了。比如林冲、杨志，就是骨头特别硬，说白了，这些人就是不懂社会规则，不知道如何混社会，最后走投无路，只能上山落草为寇。


    其实，任何一个大人物必须分清利利害，而不是脑子一热，想怎么干就这么干。普通人是控制不了自己的情绪的。人的懒惰，也是因为控制不了自己的情绪。一个人刻苦工作、刻苦读书，也是能控制自己的典型。


    司马懿当然也是认栽高手，面对曹操、曹丕、曹睿爷孙三人，这三人很牛B，司马懿就规规矩矩的装好孙子。等到这三个牛人死了，就老子天下第一了。司马懿面对多智近妖的诸葛亮，方法也很简单，承认你厉害，你就是送女人衣服来侮辱我，我也不跟你打。司马懿的口头禅就是诸葛亮真神人也，等你死了，就是我的天下了。


    日本的德川家康也是如此一个牛人，织田信长、丰臣秀吉牛B的时候，德川家康就装好孙子。等你们死了，我再来。传说有个故事，德川家康、丰臣秀吉、织田信长一起遛鸟，有人问，这个鸟不叫怎么办？织田信长说，杀了。丰臣秀吉说，绑起来，德川家康说，我啥也不干，就等着，是鸟嘛，他总会叫。德川家康有耐心，后来牛人都死了，天下就剩德川家康最有'
  - '[PAGE 131]


    能力了，然后德川幕府统治了日本 265 年。


    房地产大佬冯仑有一句话：伟大是熬出来的。你必须要有耐心。其实马云干阿里巴巴 10 多年没盈利，还在干。


    很多大企业家能成功创业皆如此，前面三年赔裤子、赔房子，甚至赔老婆，都很正常。赔钱本来就是赚钱的一部分。普通人只想赚，不想赔，所以永远也赚不了钱。


    我国春秋时期的第一霸是齐桓公，大概只持续了 40 多年霸业。第二霸是姬重耳，也就是晋文公，其霸业持续了 160 年。晋文公的兄弟当国君的时候，就想要他的命，晋文公带着六大家臣到处逃亡。为了活命，扩大自己的实力，娶了被他侄子抛弃的媳妇，他侄子的媳妇是秦王的女儿。后来他借助秦王的势力登上了国君的地位，这个时候他已经
    62 岁了，逃亡了 20 年！


    牛人，就是为了现实利益忍辱偷生的人，非常有耐心。讲到这个地方，先讲一下齐桓公为什么霸业只有 40 年，他死了齐国就没称霸了？原因很简单，齐桓公没有培养人才，只有一个管仲，还比他先死。而晋文公流浪的时候，就带着六大家臣，他当国君了，这六大家臣就成了六卿。所以，晋国后来跌倒多次，这六卿把这个国家给扶起来了。大厦将倾，独木难支。


    刘备培养了很多人才，诸葛亮只顾自己演戏，是个大蠢，所以，蜀国衰落。看曹操，文武大臣各列一俳，当然实力就最强大，可以多称霸。'
  - '[PAGE 132]


    几十年。所以，老板做企业，最应该干的是把你企业里的人才给培养出来，而不是玩独资、当戏精。玩不长久，因为你总是要死的。大凡厉害的企业家，都喜欢教育儿子，李嘉诚休假的时间，基本都带着儿子教育。国势衰退，好多都是后继无人造成的。比如秦始皇的儿子，就是傻不拉几的把江山送给项羽、刘邦了。


    《孙子兵法》这个名字，我来调侃下，实际上，一个人只要学会了该当孙子的时候当孙子，都不会混得差。刘备能起来当皇帝，也多亏前面这么多年孙子装得好，后来想装大爷，为关二哥报仇，结果自己都报销了。木秀于林，风必摧之，出头的椽子先烂。


    当老板就是要员工面前装好孙子，员工心里面就暖暖的，认为你尊敬他，给你使劲干；你要是员工面前装大爷，员工就在心里骂你是龟孙子。


    会装孙子与尊敬他人，不是素质问题，而是必须具备的能力。总而言之，打不赢就跑，识时务者为俊杰。


    # 14、避免把最好的自己，押给最不值的对象


    人走在路上，不可避免要撞上墙。因为，有时候，墙是活的。公元'
  - '[PAGE 133]


    前二百年，韩信撞上了一面墙。一位杀猪的堵住了韩信，提出一个小小的要求：“请钻我的裤裆。”那时的韩信穷困潦倒，穿着麻布衣服，吃饭基本靠蹭，唯一能让他挺起腰杆走路的就是他有把剑。剑是士的标志，就像马车是土大夫的标志，苹果手机曾经是小资的标配。韩信有一把剑，挂在腰上，寻找士的感觉，却没有士的钱包，很丢人。屠夫拦住他，“我看你长得高高大大，又拿着把剑，挺得瑟啊。但我看你是个胆小鬼，有本事，你抽出剑，刺我，不敢的话，就从我的裤下钻过去。”其实不只韩信遇到过这样的挑战，过了一千年，有一个叫郭威的人也被一个屠夫堵住，屠夫拉开衣服，露出肚皮：“有本事，你就捅一刀。”


    再往回倒退五百年，李渊跟表弟陪汤帝杨广吃饭，杨广说你这个阿婆面，脸怎么长得像睾丸袋。李渊去了趟洗手间，拉开裤子看了看，差点哭晕在厕所里。回到家，李渊告诉老婆窦氏，皇帝说我是阿婆面。一般的老婆有两种反应，一种是劝：忍了吧，皇帝是什么，我们惹不起。另一种是激：哎呀，他杨广就长得好看啦，弄不死他丫的。窦氏选择了第三条：恭喜啊，老公，阿婆面在我们那是皇上的意思，堂就是唐，你辈封唐国公，说明你的位置很稳啊。这么远的飞鱼，都被窦氏叼了回来。有时候，我们确实需要一点阿
    Q 精神，或者叫唾面自干。


    当屠夫堵住郭威时，郭威真的拿起杀猪刀，然后一刀捅死了杀猪的。所以，当自己是白痴时，千万不要再去刺激另一个白痴。韩信选择了弯腰，他从屠夫的胯下爬过，然后起来拍拍身上的灰，在众人的嘲笑声中走了，一路走远。当这个集市再次听到他的名字的时候，他已然成了刘邦的大'
  - '[PAGE 134]


    将军、西汉的齐王。而郭威被抓了起来，打进了死牢。军头李继韬欣赏他，将他从牢里私放了出来。数十年后，郭威成了后周的开国皇帝，不同的应对，似乎并没有影响他们的结局。


    但真的如此吗？区别还是有的，区别是郭威把自己放到了一个巨大的不确定上，如果不是碰上伯乐李继韬，他可能早已经被处死，而韩信避免了在最无聊的事情上把自己置身于最大的不确定。如果有平行世界，我相信会有这样的场景，郭威被砍杀在菜市口。韩信同样有个版本，他刺死了屠夫，然后被抓住砍掉了脑袋。


    每一个选择都会决定我们的未来，我们要避免把最好的自己押给最不值的对象。很多年以后，韩信找到那个屠夫，屠夫提心吊胆了很久。结果韩信把他提为护军卫，还告诉他：当年，我不是怕你，而是我没有道理去杀你。如果杀了你，我不会有自己的今天。我可以把我的命押给项羽，押给刘邦，甚至是吕后，但不会押给你。


    同样，不要挥霍我们的愤怒。天下可以愤怒的东西有很多。


    社会的不公，你不愤怒；你自己没钱，你不愤怒。别人说你两句，你就愤怒了？


    同样，不要忽略每一个迎面而来的微笑。那么，当韩信愿意从屠夫胯下钻过时，他靠的是什么？是尿不湿还是护舒宝？我想应该是理智与心态。如果碰到墙，绕开就是了，不要忘了，你是有脑袋的，你知道孰轻孰重，不要跟白痴死磕。'
  - '[PAGE 135]


    # 15、老板如何管理自己的时间


    很多初刨老板，甚至稍微大一点规模的老板，成天忙得不得了，但没干几件有用的事情。干了好几年，企业依然没有发展壮大，大部分原因是没有分析自己的时间都用到哪里去了，所以，你问他要成绩，他是拿不出来的。


    那么，老板如何管理自己的时间呢？


    +   第一，只开有效的会议。


    因为开会就不能工作，工作就不能开会。同时，拒绝无关的人参加会议。部分企业老板、管理者动不动就开整体部门会议、全员会议，这绝对是浪费大家的时间。浪费时间就是浪费钱。我们开会，必须言之有物，针对特定的事、特定的人，解决具体的问题。杜绝把不相关的人也弄来开会。


    适当的会议非常必要，因为相关的人与事要彼此合作，就要彼此沟通。一个人的头脑不能解决所有问题，适当的会议作用就是集思广益。'
  - '[PAGE 136]


    第二，老板只抓公司一个主要业务。


    其他业务全部交给公司的能人打理，老板只看结果。同时不参与其他业务的会议，让相关人员全面负责你丢给他们的业务。老板亲自抓公司的主要业务，如果主要业务盈利能力强，企业的能人自然有样学样，不差到哪里去。


    第三，把业务流程化、精简 化、标准化。


    让每一个新人都能看得懂，减少重复解释的时间、会议时间，内容相同的沟通尽量流程化。


    第四，拒绝参加不一定非要自己参加的任何形式的讨论与会议，拒绝批阅不必由自己批阅的公文。


    比如，我们公司要买一个杂物柜、一些电脑，由其他同事决定就行了，我是拒绝参与这些事情的。


    第五，不要把自己的时间分割成很多小段。


    分割开了的时间，等于没有时间，很难处理好一件事。我在公司里是最讨厌被琐事打扰的。一个上午有几个人找我，就会发现什么事情也没做。没人找我的话，就明显感觉主要的事情推进了很多。最好有一间自己的办公室，谁也不让他进来，你一个人在那里思考问题，拒绝被中断打扰。


    第六，如果你的企业里有一些人是偶尔才用一下，那么就把他解雇，'
  - '[PAGE 137]


    通过外包的形式来做这个人的工作。因为企业有多余的人，他成天不做事，会对整个企业产生不良的影响。员工没事干，他就要去干扰其他人，无事就生非，所以，要给员工安排满事情做。


    **第七，养成早睡早起的习惯。**


    不要有晚上可以加班的思想，因为这会让你觉得白天不抓紧时间工作，晚上能补救。


    总结一下，时间是最宝贵的资源，不能利用好时间，而想做好事业就是空谈。老板就是会利用时间发财的人，同时用钱买到别人生命的人，生命就是由时间组成的。


    # 16、如何成为一名成功的投资人


    很多老板跟我说，想成为一个投资人，却不知道该怎么办。如果你想直接成为一名投资人，除非你有足够多的空闲时间、有足够多的金钱让你去投资，吸取失败的教训，失败多了就成功了。显然，具备足够的时间与金钱的条件很难达到，除非你爹妈是超级富翁。'
  - '[PAGE 138]


    一般的人要想成为一名投资人，必须先成为一名企业家。什么叫企业家？企业家与小老板的区别在什么地方？小老板就是自己带团队、做业务赚钱的人，自己离开企业，企业基本不能运作的人，叫做小老板。而企业家就是请了CEO、总裁为自己打理公司的人，企业家离开了企业，企业照样运转，而且运转得越来越好。比如，马云、史玉柱，就算离开一年以上，公司依然不会倒闭，这样的人才能叫企业家，否则，只能叫小老板。


    要想成为一个成功的投资人，你必须先成为一个企业家，企业家就是能打造一个自动运转的、盈利系统的人。在这个过程中，你实践了如何打造企业。你成为投资人的时候，你才能慧眼识珠，分辨出谁可能成为企业家而投资他，不会被一些只有激情与梦想，而没有能力的脑残欺骗了金钱。


    永远不要直接投资一个小老板与普通员工，风险太大。因为这样的人根本不能理解系统与产品之间的关系。投资这样的人回报率极低，他们很难把企业做大。很多小老板与普通员工认为自己能制作好产品就足够了，岂不知能炒好菜的厨师很多，但俏江南、海底捞只有一个。


    所以，一个成功的投资人必须先成为一个成功的企业家。成为一个企业家还有一个好处，就是你的企业不断地在给你提供现金，你可以拿这些现金不断地去投资。'
  - '[PAGE 139]


    我的做法很简单，我是把钱拿来投资我的员工，我的员工当中有特别优秀的人，我就会辅助他做一个小业务，我出30%的钱，他出70%的钱，我占10%到20%的股份，并且给他一些做企业的建议，帮助他做成功。再者，我只投资我熟悉的领域，基本就是我们企业业务的上下游延伸，这样成功几率高很多。


    如果各位有心玩投资，你就会慢慢爱上这个行当，因为，这是一个钱赚钱的行当，你终于不用自己起早贪黑的操心企业里的事情，而是每年等着分红。然后游山玩水，有钱有闲，终于可以天天陪老婆孩子了，前提是你看准了人。


    投资本质上拼的是看人的眼光。'
  - '[PAGE 140]


