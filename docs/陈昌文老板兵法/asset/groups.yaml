    所以这个世界很神奇，你给别人机会，上帝就给你机会；你断了别人的机会，上帝也不会给你机会。老板要明白企业是个生态系统，要能容纳得下各种各样的人才。不管是正规军，还是偷鸡摸狗的人，只要是能为企业创造效益，不违法的，我们都可以笼络到自己手下。其实大凡干大事的人，手下的人才总是多种多样，比如宋江手下的人才，战国四君子手下的人才，都是如此。


    企业文化兼容性越好的公司，笼络的人才越多，发展潜力就越大。


