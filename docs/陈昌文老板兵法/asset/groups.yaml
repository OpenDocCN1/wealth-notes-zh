    理能力、领导力、商业敏感度。打江山和坐江山的能力，不一样。所以， 老板是学习的产物，实干的产物。


    # 17、人类文化是如何形成的


    人类文化是如何形成的？这件事情搞清楚了，对做企业是非常有好 处的。通过一个外国人对猴子的实验来说明。


    把五只猴子关在一个笼子里，上头有一串香蕉。实验人员装了一个 自动装置，一旦侦测到有猴子要去拿香蕉，马上就会有水喷向笼子，而 这五只猴子都会淋一身湿。


    首先有只猴子想去拿香蕉，当然，结果就是每只猴子都淋湿了。之 后每只猴子在几次尝试后，发现莫不如此。于是猴子们达成一个共识： 不要去拿香蕉，以避免被水喷到。后来实验人员把其中的一只猴子释放，
    换进去一只新猴子A。这只猴子A看到香蕉，马上想要去拿。结果，被'
  - '[PAGE 57]


    其它四只猴子揍了一顿。因为其它四只猴子认为猴子 A 会害它们被淋水，所以制止它去拿香蕉。


    A 猴子尝试了几次，虽被打得满头包，依然没有拿到香蕉。当然，这五只猴子就没有再被水淋。后来实验人员再把一只旧猴子释放，换上另外一只新猴子 B。这猴子 B 看到香蕉，也是迫不及待要去拿。当然，一如此前所发生的情形，B
    猴子也被其它四只猴子海扁了一顿。特别有意思的是，那只 A 猴子打得特别用力（这叫老兵欺负新兵，或是媳妇熬成婆，因为自己被莫名其妙的欺负过，所以必须找到发泄的地方）。


    B 猴子试了几次总是被打得很惨，只好作罢。后来慢慢的一只一只的，所有的旧猴子都换成新猴子了，大家都不敢去动那香蕉。但是它们都不知道为什么，只知道去动香蕉会被群体群殴，这就是文化的建立。


    我们人类社会中的任何文化，基本上都是这样建立的，你不这样做，后果就很严重。你这样做了，就有奖励，大家都赞同你，无关对错。


    其实刚开始创业，建立企业文化就特别重要。因为一个企业前两年文化是什么样子，后面 5 年，甚至 10 年，他的文化基因基本不会改变了。比如我们企业，我一开始就是工作狂、加班狂，根本就没有下班的概念。新来的员工，只要是待在我们公司的人，他不加班就莫名其妙的受到一种无形的压力，他只好不断的加班了。又因为加班获得了额外的收入，然后我天天骂不加班的都是傻子，有什么好玩的呃？赚到钱才是正事。然后他们也开始喜欢加班，然后跟着我一起骂不加班的都是傻子，有什'
