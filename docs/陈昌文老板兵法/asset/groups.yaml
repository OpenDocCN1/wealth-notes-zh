    # 8、卖用户能获得什么利益，

    而不是卖你产品的特点


    很多销售员根本不知道面对客户应该讲些啥，把自己产品的一大堆特点、好处告诉客户，这种行为其实是在浪费自己的时间，也是在占用客户的时间。讲自己产品的特点与好处，全部都是废话，而且你讲得越多，用户越是迷茫，不知道你重点要讲什么。你不要讲你的价格便宜，其实用户根本不关心你便宜不便宜，他只关心能获得什么利益。便宜不便宜根本不是他购买的直接原因。


    卖一个产品，最好是告诉用户，买了这个产品，会给他带去什么改变。让他有已经买了这个产品的感觉。所以，我在很多场合讲过，卖产品是卖一种感觉给用户，但很多人听不懂这句话。我们做销售，永远要用肯定、清晰、充满朝气、充满信心的声音，将产品的好处传达给用户。


    我看到很多销售人员讲，我这个产品里含有多少维生素，是经过了多少道工序才做出来的，有什么植物精华、保湿因子。想想这些没有经过系统训练的销售员就好笑。客户根本不关心你说的这些；客户只关心'
  - '[PAGE 297]


    你这个产品能给他带去什么利益。所以，不管我们做广告，还是面对客户讲话，我们的重心永远是客户能获得什么利益，而不是你产品怎么样。


    卖什么东西，切忌用专业术语。很多销售为了显示自己，还专门去背那些说明书上的专业术语。你讲的话客户听不懂，他肯定就不买。高手是把复杂的事情讲简单，通俗易懂，傻子是把简单的事情搞复杂。


    同样，竞争的本质是要盯着顾客，不是盯着对手。


    你说要打败谁，就等于说，你现在比别人差。你每喊一句口号，就相当于在给竞争对手做广告。并且说明了你很崇拜这个竞争对手。诺基亚的 CEO 说要打败苹果，就只能证明诺基亚的
    CEO 崇拜苹果公司。脑袋里想着竞争对手，嘴巴里念着竞争对手，等于在给竞争对手免费做广告。


    最有效的手段，是盯着顾客，不要盯着竞争对手。就跟谈恋爱是一个道理，你的脑袋里、眼睛里要盯着对象，而不是盯着你的情敌。就算你能搞定一个情敌，还有无数个情敌等着你搞，累死你，你也不能获得成功。你应该想伴侣之所想，急伴侣之所急，这才是谈恋爱的正确做法。


    人性有一个弱点，总是盯着谁抢了他的饭碗，不盯着谁给了他的饭碗。人们总是忽略给他吃饭的人，而跟那些抢他吃饭的人竞争。我们要完全改变这种思维，我们要讨好给我们吃饭的顾客，那些抢我们吃饭的竞争对手自然就饿死了。'
  - '[PAGE 298]


    # 9、卖产品就是给用户找购买理由


    现代社会，生产力空前发展，做好商品等着顾客来买的时代已经一去不复返了。卖产品，必须卖到心理学层面。卖产品已经不是卖产品了，而是给用户找购买理由，找行动理由。产品的名字，都要体现出来购买指令。广告就是货架，产品就是媒体。其作用是告诉顾客为什么要买你的产品，而不是介绍产品。


    如何才能做出一款好产品，其根本不是有一个好想法，而是去观察人们的行为特征、心理活动。经济学其实是心理学的延伸，做生意其实是心理游戏。人类的每一个动作，都是心理的延伸。价格只是一种感觉，付款只是一种期待。自己在说什么，其实都搞不清楚，但就是这种搞不清楚的东西在支配着这个世界。一般的产品只能解决人们显性的问题，高级的产品、利润高的产品，解决的是人们心理的问题。没有多少人能达到这个高度，所以，高级只对少数商业、心理学家开放。


