    非常感恩老大，昨天老大在 yy 讲课的一句话，让我持续涨粉，浏览量达到 16.4 万。我是如此幸运能在有生之年找到灵魂的港湾。您的每一篇文章都直达心灵，让我醍醐灌顶，同样感恩我的恩师**
    从不放弃对我这个老女人的指引！再次感恩！


    陈昌文：


    我讲的课程里，都有爆粉的金句，自己去琢磨，去找，做到几百万粉丝都正常。


    # 46、日日循环读书会


    学员：


    我还没做直播，我发的朋友圈《陈昌文方法72大营销系统》，有个客户就买了。


    陈昌文：


    非常好做，读书会一定要做。做到几万个、几十万个客户，维护好客户，日日循环读书会。


    # 47、儒家思想是我们社群的根


    学员：


    在群里和微博、微信学习儒家思想，对我最有感悟的六句《论语》箴言，分享给大家。希望对大家有帮助。


    1. 学而时习之。


    学而时习，知行合一，天道酬勤。行动是一切的根基，行动是成功之母。


    学习是偶尔的，练习是时时的。学一招，用一招，练到极致，再进行下一招，行有余力，则以学文。贪恋沉溺学习是玩物丧志和逃避现实。学时而习，劳而无怠，生生不息。


    2. 述而不作。


    述而不作，信而好古，一切成功来自复制。述而不作，信而好古，愚而好自用，贱而好自专。聪明人复制改编优化，听话照做执行，直接复制牛人、强者、成功者，并且虔诚，持之以恒。述而不作，上上之策。


    3. 近悦远来。


    近悦远来，内生力量，德不孤必有邻，远人不服普修文德以来之，修内安外，近悦远来，内生力量，已所不欲，勿施于人。交于道，结于礼，近者悦，远者来。你让心享受，心让你事有成，心享事成，近悦远来。近悦远来是一种战略思维，是成就大事业的策略，如同兵法战略远交近攻一般。


    4. 贤贤易色。


    贤贤易色为善去恶，万恶淫为首，色心不去，善法难存，正心必从我色始。色食，人之大欲，只有提高境界，唯有跨越才能戒，树立圣贤之追求，超越低俗之欲念，此为治本。人无远虑，必有近忧，贤贤易色，好德替代好色，更高追求。


    5. 克己复礼。


    克己复礼，仁者爱人，上善若水，无欲则刚，嗜欲深者天机浅，无欲则善，存天理灭人欲，致良知，克己存真，真善是信。克己复礼为仁，一日克己复礼，天下归仁。诸恶莫做，众善奉行，行有不得，反求诸己，克己复礼，向上向善。


    6. 君子不器。


    君子不器，商者无域，破圈思维，取势顺势。大象无行，百变万能，兵无常势，水无常形，能因敌致胜谓之神。君子不器，不限于稀缺思维，不固执于现有成就，善于打破常规圈层，再创新高，创新发展，生生不息。


    学而时习（态度），述而不作（方法），近悦远来（策略），贤贤易色（德行），克己复礼（自律），君子不器（格局），有态度、有方法、有策略、有德行、有自律、有格局，这六句《论语》把这几个点都能讲的通透至极，《论语》微言大义，往往只言片语，却内涵无穷高远。一个人，其实一生能深入读懂一句《论语》，就足可以有一般成就了。


    陈昌文：


    儒家思想是我们社群的根，《陈昌文解读《论语》》是我们社群的根。


    日日要在直播间循环一篇《论语》，后面我写的《陈昌文解读（增广贤文）》，日日循环，这是最重要的根。后面写的《陈昌文解读（道德经）》，也要日日循环。也就是要下播的时候，就讲我每天弄的国学一篇，日日循环。反复循环。


    # 48、搞品牌营销最赚钱


    学员：


    老大，我终于恢复正常工作了，前段时间爷爷生病，我在医院照顾了十几天，现在出院了，我就赶紧回来了。您刚发群里的小黄车这个模式我感觉是我的爆发点。


    自从上次搞通了点点您讲的营销逻辑过后，我就一直兴奋，一直在琢磨这个事，我的矩阵账号也能派上用场了。无奈家里有事，在医院压了二十天。今天我去改编您书里的文案，磨了一天，磨出来了
    7 个文案，从前后逻辑，营销关系上一个字一个字的推敲，越搞越激动，感觉每个字丢出去都可以变成钱。我先搞起来，应该会很快见到效果，然后再来给您报喜。


    陈昌文：


    搞品牌营销最赚钱，要把我讲的品牌营销课程所明白。


    # 49、一手拿书，一手拿剑，各位走上正规就行


    学员：


    我经历了很多，能碰到您和万行法师，我很感恩。师父，我想您应

    该和他一样，高手总归是高手。修道人或多或少都有障碍，因此，未入圣流之前，难能对付魔事。这时，韦驮菩萨就会出现，护持四位弟子修行。很多人由于过去业力的原因，出现了贫穷残疾、诸多不顺，礼拜供奉韦驮菩萨，一瞻一礼，就能得到韦驮菩萨加持。


    陈昌文：


    总而言之，诸恶莫作，众善奉行，一手拿书，一手拿剑，各位走上正观就行。


    # 50、不允许讲脏话、骂人、低俗化、污名化


    学员：


    老大好，刚才抽出一点点时间在群里看到了今天可以下单《陈昌文方法之老板心法》书籍了，我订购一本。真心感谢缘分能够结缘老大和您建立的社群，通过社群您每天释放的文字，真心感觉到您就是在呕心沥血帮助大家提升智慧和不被坑……您就是带着责任和使命来的……您就是老天派下来拯救人类的天使……


    由于有自己的工作，有时晚上看您的文字看到12点，越看越感觉解读人性解读得淋漓尽致。


    能结缘老大是祖坟冒青烟了，虽然我没有做咱们项目组，但是超级喜欢群里一切文化。回来我自己事情处理一下以后，也要做咱们项目组，

    永远爱您，像爱自己父母一样。


    陈昌文：


    日日循环《陈昌文解读〈论语〉》《陈昌文方法72大营销系统》是我们社群的使命。


    我们社群只卖品牌，卖儒家思想。


    所有老师，都要绝对正能量。不允许讲脏话、骂人、低俗化、污名化。


    # 后记


    # 长期努力是成功的唯一方法


    ——陈昌文


    我认为，长期努力是成功的唯一方法，很多人听我这样讲，就认为很极端，不科学。我想说的是，我谈的都是我的经验而已，我从来不想证明我科学，我甚至讨厌那些看起来、听起来很严密的理论。在我们公司里，只要谁说，什么事情都有两面性，一件事情总是有好有坏。我总是想辱骂他，我会让他离开，甚至开除这样的人。我最讨厌这些正确的废话，完全没有立场，简直就是孔夫子讲的乡愿。


    我们当老板的，不是理论家。我们是在打仗，我们只能选择一个判断，然后执行下去。你不能告诉我这也行，那也行，我们的选择是唯一的。


    在读高中的时候，我就发现了一个现象，成绩好的孩子总是一直在读书，做作业，从来感觉不到烦，就算周六、周日也在学习。成绩差的

    '
