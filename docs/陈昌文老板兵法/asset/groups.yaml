    # 6、做互联网项目，想法一定要大，做法一定要小


    没有想法的人，很难有成就。中国 PC 互联网加移动互联网人口数量极其庞大，任何一个细小的分枝都蕴藏着巨大的商机。


    一个滴滴打车，就是把一个打车软件给做到极致了。而在中国，这样的机会在未来 10 年会在各个领域出现很多。我们选好一个行业的细分领域，就要想，我要把这个点吃透彻，做到全国去，做到几百亿去。有了这个理想过后，我们从一个细节入手，把这个细节做到极致，做到全国。要在一个关键问题上赚到钱，再去想扩张的事。千万不要一上去，就做很多功能，很多服务；战线拉得太长，人的精力就跟不上，就很难做起来。


    我们要选好一个具体的点，尽到最大的努力，把这个点做到极致。占据了全国市场过后，再去想扩张的事情，比如，滴滴打车占据了整个出租车市场过后，就扩张到了代驾业务，吃掉了代驾市场这块肥肉。


    互联网行业，真的是机会非常多。而且目前是异常容易把一个草根变成一个富豪的行业。想在这个行业发展事业的人，要多跟这个行业的人接触，进入这个行业的圈子去讨论、探索、学习。你现在与什么样的'
  - '[PAGE 75]


    人讨论、探索、学习，决定着三五年后从事的事业。想要快速成就事业，完全靠自己探索，基本是不可能的，要学会去借鉴行业里优秀人的思维、做法。然后去实践，变成自己的思维、做法。


    我之前选项目的方法是，先选择消费群体，看谁有钱，然后就找相关行业的人开始设计产品，或者设计一个营销套路，开始赚他们的钱，这叫做按市场需求、市场趋势做项目。而很多没玩过项目的人，是先考虑自己对什么感兴趣，就直接开始干了，这样的态度还想发财，我认为这叫本末倒置、闭门造车，还是计划经济的思维，社会上大多数老板都是这样的思维，非常可怕。那么现在，我只做陈昌文方法这个品牌，陈昌文老板读书会、陈昌文老板社群。把我的方法和经验传播给大家。


    这个社会，很多人认为发财的机会少，其实发财的机会非常多，因为人们有千奇百怪的欲望，只要你能够解决一个欲望，一类人的一个问题，你就能赚大钱。思维放开一点想想，特别是互联网时代，互联网这个工具是最适合解决人们的精神问题的。


    由于生产力的迅速发展，物质相当丰富的今天，做实体产品当然竞争激烈、利润稀薄。可惜大部分人的思维僵化，一说做生意，只会想到实体产品，这就导致少部分做互联网虚拟项目的人很赚钱。这些项目几乎没什么成本，但利润很高。


    只要人们发自内心地需要一个产品，那么这个产品就一定有市场，根据这个思路，实际上大家可以挖掘出来很多虚拟的项目。'
  - '[PAGE 76]


    # 7、赚钱的创意从哪里来


    知识就是生产力，财务知识、企业知识、投资知识，合起来就是致富知识。一个人头脑里有什么知识，就会影响其思想，进而影响其行为，再进一步就会影响其事业，最后就会影响其生活品质。


    比如当年我脑袋里拥有的是战士、法师、术士、盗贼的关键词，我明显是个游戏脑。我的脑子都用来打游戏了，所以生活过得很惨。后来脑中拥有的是 MFC、SQL、C++、JAVA、PHP，明显是个程序员脑子，只能领一份薪水度日。再后来脑中拥有的是绩效考核、目标管理、公司的财务报表、资产负债表，明显是老板的脑袋，收入就有所提高。再后来拥有资产收益率、资产回报率这些概念，这些明显就是投资人的脑袋，生活水平进一步提高！


    富人是靠知识与概念赚钱的，普通人是靠体力赚钱的。从现在起，若想富有，你就可以改造自己的脑袋了。比如，财务知识认识得越深刻，你越能注意到你眼睛看不见的东西。你可以选择变成债务人，也可以选择变成债权人。而如果你不懂这些知识，你就没有能力做出对的选择。'
  - '[PAGE 77]


    赚钱的创意从哪里来？一靠积累，二靠套路，三靠抄袭。营销思想、赚钱的手法、项目，都是靠积累，靠固定的商业套路，靠抄袭已经赚钱的人的模式。请大家注意“已经赚钱”这几个字。积累是每时每刻的生活积累，你随时随地都在向你的收藏夹里面添加东西，当然也随时随地删除那些质量不好的东西，随时你都在打草稿。


    套路就是好方法用100遍，有用的招数100年不变。


    抄袭就是耍明白，你想干的事，别人早都干过了。这个世界上最发财的套路已经有人在用，你需要的就是把别人发财的套路、原理都看懂，你把它变成你能驾驭的模式就行了。


    人的成功，不是找到新奇的方法，是找到老的方法，旧的、能用的方法。聪明的老板不是喜欢新创意，而是要阻止其他聪明的人扯出来一个新创意、一个新业务、新项目，只走自己熟悉的路。


    很多人以为别人的行当好赚钱，实际上要赚到真金白银，只能在自己熟悉的行当升级、变通。渠道可以变到互联网上来，或者你想方设法如何变成互联网企业就行了。


    大量的传统企业老板不懂得互联网营销，不重视互联网与传统生意结合，其实，这就是愿意学习的人的机会。甚至，很多身无分文的人愿意学习互联网，在互联网上做起了生意，也有钱赚。'
  - '[PAGE 78]


    8、九个步骤搞清楚自己怎么才能赚钱


    这个世界上最大部分人都搞不清楚自己怎么才能赚到钱，脑子里是模糊的，看不清自己的真实情况。


    对于每个老板来说，你的核心资源就是自己，包括自己的兴趣、技能、个性，以及你所掌握的资源。比如你银行里的存款、你的房子。如果你有团队，那么也可以算是你的资源。


    我们通过九个步骤搞清楚自己怎么可以成功赚到钱。


    第一，问自己，可以与谁合作。首先是团队成员，其次是家人、朋友、同学、公司同事，还有客户。


    第二，问自己，可以发展什么样的关键业务，自己要做什么？比如是要做互联网营销呢？还是做产品代理呢？还是自己去炒菜、卖菜，还是开个广告设计公司？这完全取决于你会什么，你的兴趣点在什么地方，还有你的志向是什么！'
  - '[PAGE 79]


    第三，自己的核心资源是什么？你干什么？拥有什么？比如你做

    了5年网站程序员，你会编程，会做网站，这是你的优势。比如你家里有钱，

    你老子给了你50万，这也是你的资源。比如你在学校里谈恋爱无数，一

    毕业有无数个女生愿意跟你浪迹天涯，你可以教人如何谈恋爱。


    第四，价值服务。你到底要提供一个什么价值去帮助你的客户？这

    取决于你的核心资源和你干什么，会什么。


    第五，与客人的关系。你打算怎么和客人沟通、交流。以什么形式

    沟通交流？是一对一呢？还是会议营销一对多？


    第六，怎么宣传自己，怎么把服务提供给用户。比如，你通过快递

    把包裹送上门，还是开个店等用户主动来找你？通过百度推广、QQ群推

    广、直播、视频推广，或者报纸做广告宣传自己，还是自己请几个人做

    地面推广？


    第七，你的用户群体定位。你到底为老年人服务，还是为大学生服务，

    为家庭妇女服务，还是为写字楼里的白领服务，或是为老板服务？


    第八，你想要做的事情。你要付出什么？你的成本包括什么？成本

    多高以内你能接受？超过了多少，有没有把握能融到资金？


    第九，收入。做完这一切，你能得到什么？你的收入是多少？划算'
  - '[PAGE 80]


    不划算？如果最后算到收入这一步，不划算，那么前面八个步骤都没意义！


    大家根据我这九条，一条一条的去套自己，就能把自己给分析得一清二楚。


    # 9、打游击战的过程中，

    要注意建立自己的根据地


    老板需要有激情，有干劲，但也必须得有计划，有谋略。你做公司，是认准一个项目死磕出利润呢？还是见什么做什么，有奶便是娘？假如我们认准一个项目死磕，其实非常犀利的战略眼光很难形成，很难在开始的时候，就知道做什么一定能成功。相反，我们经常是眼中明明要做成
    A 项目，结果开干的时候，干成了 B，干着干着，项目变形成了 C，结果最后赚钱却是在 D 上面。


    这个世界确实有很多牛人，一干就干成了大事。比如马云，确定干阿里巴巴电子商务，他就干成了；刘强东确定干京东，他也干成了。但是别忘了，这些人条件很好，有强大的风投在后面支持他们烧钱，他'
  - '[PAGE 81]


    们有资本犯错。但我们大多数老板囊中羞涩，都是小本生意，从头开始。如果死磕一个项目，会发现还没开张呢，口袋里的钱已经所剩无几了。我们没有实力去一年、两年的试错。有强大资金实力的人，可以认准一个项目不断地做探索市场，反正失败了再来就是了，钱花不完，所以我建议小资金老板还是选择打游击战。


    游击战是怎么打得呢？就是一开始直接奔着利润去的，什么活赚钱，我们有能力干，我们就干什么。先保证能活下去，活下去才有希望。在打游击战中，最重要的一点是什么呢？就是要不断地去寻找自己那块“根据地”。这块根据地就是在打游击战的过程中，发现的可以盈利的商业模式。找到了这个能盈利的根据地过后，就要开始根据这个特定的商业模式打造团队、定战略、做运营。一般情况下，一个企业取胜是因为团队、战略、运营都非常强。那么到底突出哪一块，要根据老板们自己的特长，着重培养自己的长处。


    比如，你就是擅长团队管理，那么你你就可以在这个根据地上培养出自己的王牌团队；比如你就是擅长项目运营，那你也可以重点培养自己运营的本领。这其实就是在商业世界中构建壁垒，我们在打游击的过程中，发现了一块根据地，然后我们根据地理位置，根据我们自己的能力，开始构筑自己的防御壁垒，开始练兵，以便于保住老巢，扩大战果。


    打游击的过程中，切忌打成了流窜犯，就是喜欢上了打游击，从来没建立自己根据地的意识。我们伟大领袖毛主席，有一句话“革命要有'
  - '[PAGE 82]


    根据地，就像人要有屁股！”我们党有很多敌后抗日根据地，井冈山、延安等等，就说明了打游击战的过程中，要注意建立自己的根据地。


    # 10、做生意，做项目，

    一定要找到自己的“第一滴血”


    做公司，最难的不是以后的管理、战略，以及公司各种杂七杂八的事。实际上刚开始做公司的时候，我也没有经验，老是跟人谈论战略、未来、管理、股权分配等没有意义的事情，甚至可以这样说，刚开始做生意连租办公室都没啥意义。


    我刚开始做公司的时候，也鼓动我的合伙人一起租了一个豪华写字楼，最后发现，晕大了，根本就没有客户来看我的写字楼。但写字楼却天天在烧钱，后来实在坚持不下去了，就把一切用钱的地方几乎是砍了个精光，只留下吃饭的工具，然后我忽然发现，豁然开朗了。现在我只需要谈业务，什么都不用管啦，把自己当个业务员就行啦。结果就是由于精力相当集中，完全集中到找业务这个点上，很快就谈了一笔业务。而我什么也没有，就直接把这个业务顺给同样产品的其他公司，我就拿了个提成。然后继续谈业务，拿提成，联系的公司越来越多，我的业务'
  - '[PAGE 83]


    也越来越好，水到渠成的自己就组建了一个团队。


    所以，我发现，做公司，做生意，是个水到渠成的事情，就像栽树苗一样，从一颗种子开始培养起来的，而不是直接长成大树 的。也就是说，我认为直接做个豪华写字楼，相当于直接成长为成熟的公司了。


    开始的时候，招聘一个人力资源主管部门都是没必要的，当业务成长到一定的时候，不得不招聘行政部门才招聘。就是我认的水到渠成的做项目，做生意。当然如果你背后有足够的养料，你可以直接成长为大公司，每个辅助部门都配备起来。比如有风险投资，否则，还是不要违背规律的好，按部就班的找到你的第一单，慢慢做大，不要急，也不要放弃。


    最难的是第一单，也就是从 0 到 1。从 0 到 1 意味着，你开始有业务了，也就是说，你终于迈进商业的大门了。你为自己赢得了肯定，同时不再怀疑未来。能够坚定的付出劳动而不会去怀疑这样干下去会不会成功，这是非常重要的。


    第一单的付出是巨大的，因为做项目刚开始，我们都不知道怎么赚钱，我们需要探索，需要实验。需要掏自己的钱出来支付房租、水电、饭钱。其实我一般建议大家开始做点非常小的生意，找找经商的感觉，就算摆个地摊也好。其实我认识很多老板，最开始都摆过地摊，因为摆地摊成本极低，而赚到几十块钱会给自己极大的信心，就是说，你看商业书籍，或者听我讲课，不能给你商业的感觉。摆地摊能让你快速的找到商业的感觉。'
  - '[PAGE 84]


    我的第一笔生意是读高三的时候，卖传奇这个游戏里面的一个手镯， 给一个网吧里的小孩子。我记得，我是60块钱买过来的，转手就卖85块， 还记得那个网吧叫“红洞网吧”。那时候，一个农民工一天的工资也才
    50块呢，而我只用了10分钟，就赚到了25块，这种感觉，就爽到爆。 从此我就爱上了倒卖这门艺术。


    做生意，做项目，一定要找到自己的“第一滴血”，后面做生意， 就有底了。如果跨不过第一道坎，那么就会一直很痛苦，如果跨过去了， 你就再也不会去打工了，因为自己给自己赚钱这种感觉非常爽啊。所以，
    竭尽全力的去挖掘自己的第一个单子吧。永不言弃，前途光明，一旦放弃， 堕入地狱。


    # 11、把精力用在实现短期目标上


    战略是干出来的，不是想出来的。


    所谓战略，是走一步看一步，一步一步干出来的。所以邓伟人讲：“摸 着石头过河！”就是这个道理。哪里有什么先见之明？哪里能算到后面 几十年的事情？伟人再厉害，他也不是上帝。'
  - '[PAGE 85]


    那么老板到底该用什么样的理论指导自己呢？就是把精力用在实现短期目标上。邓伟人的另一个理论：“不管白猫黑猫，抓住老鼠就是好猫！”一切为了生存，先生存再求规范化，再求战略，再谈制度。先制定一个目标，无论如何，半年要搞到多少钱，比如说
    100 万！然后想尽办法去达成。柳传志、王石这些人创业初期，都是这套打法。我自己也是这套做法，根本不是想好了再做，是边做边想，走一步看一步，赚到钱，先生存下来再说。


    为了实现初期阶段性的目标，宁可在混乱与不规范中前进，不可在制度与规范当中死亡。当然，不可违法乱纪。大家有饭吃，有衣服穿，不至于饿死才是关键。为了快速实现阶段性的目标，老板一定要拼尽全力，以身作则，做好表率。就算你能力不强，但你在努力干活，整个团队也会在你的带动下去找方法，想策略，实现阶段性目标的。切忌认为自己是老板了，就啥也不干了。当老板不是比打工的时候轻松了，而是比打工的时候更加勤奋了。


    # 12、企业打造核心竞争力的六个方向


    用户到底为什么选择你这个企业提供的产品或者服务，是我们每个'
  - '[PAGE 86]


    企业老板都要思考的问题。换个说法，也就是我们企业靠什么核心竞争力赢得用户，我大概归纳了六点，供大家參考。


    1、便利性。就是你这个产品或者服务帮助用户节约了时间，减少了麻烦，你就可以赢得用户。比如余额宝为什么成了最大的基金，就是因为用户把钱转到余额宝太方便了，淘宝的花呗，又会抢占非常大的信用卡市场，因为这又是具备非常大的便利性的工具。


    能为用户提供便利，是打造核心竞争力的第一个方向。


    2、价格，省钱。这也是吸引用户非常重要的一个原因。你能做出一个比市场上的产品更加便宜的产品，你就能胜利。比如360做了个免费杀毒，就把金山毒霸、瑞星杀毒的收费市场干掉了。微信的语音干掉了部分电话业务，干掉了部分短信业务。


    你能卖得便宜，是打造核心竞争力的第二个方向。


    3、设计。随着人们生活水平的提高，有品位的产品或服务会越来越有市场，尽管价格比普通商品高很多，还是有用户为设计好的产品买单。比如，很多人会为苹果手机买单，就是因为苹果手机设计得好，不但有逼格感，而且播放音乐比很多普通的音箱都好。很多设计好的家具也很有市场。


    打造核心竞争力的第三个方向，修炼自己的设计能力。


    4、品牌或者市场地位。这是什么东西呢？就是让用户感觉到不同，'
  - '[PAGE 87]


    有身份，有地位。很多奢侈品就是走这个路线。比如，有的人不借花重金买几百万的法拉利跑车、手表。或者买有特殊意义的东西，比如脑白金，这个产品卖的是孝敬爸爸妈妈脑白金，卖的是品牌与孝敬文化。


    突出自己的市场定位与品牌，是打造核心竞争力的第四个方向。


    +   5、帮助企业或者个人进行成本削减。就是你能提供一个产品或者服务，让企业或个人以前的运营成本减小，你也会有市场。比如自动化、机械化替代工人。信息化、无纸化办公，让企业节约了办公成本。


    帮助企业或者个人进行成本削减，是打造自己核心竞争力的第五个方向。


    +   6、帮助企业或者个人降低风险。这种服务一般出现在保险业、调查取证行业、咨询顾问行业等，是打造自己核心竞争力的第六个方向。


    做企业，做项目都需要根据自己的特长与资源来打造相对应的核心竞争力，你有哪个优势，就用哪个优势。


    # 13、做老板的心法 11 条


    +   1、做互联网生意，自己就是上游是顶点。做传统生意，你很容易在'
  - '[PAGE 88]


    别人的下游。有货款、欠账、烂账，上游企业一倒闭，就砸死一群下游企业。所以，有智慧的老板都应该转型互联网。


    2、找人合作，先搞清楚这个人的状态是正在走上坡路吗？如果是上坡路，跟他合作就很容易成功。如果是走下坡路或者维持现状呢？大势已去的人，不跟他玩。


    3、员工所关心的问题不是公司的问题，而是自己的问题。所以管理员工，就是给他定具体目标。别扯他希望什么什么的，因为不管你怎么说，他都不关心，他只关心自己的利益。


    4、公司能培养多少把心放在公司的人，公司就有多稳定。公司的稳定不是靠技术强悍，不是靠有能力的人支撑的，而是靠心在公司的人支撑。


    5、项目经理是用自己的智慧解决问题，老板是用所有员工的智慧解决问题，不会使用员工脑袋的老板，仅仅是一个项目经理而已，有将才，没有帅才。


    6、遇到问题就说是别人问题的老板，永远也不会进步，一个人能进步就是喜欢反思，然后解决问题。


    7、老板创建企业的目的是为了自己的梦想，但是不为员工实现梦想，员工是不会拼命帮你赚钱的。所以，企业的玩法是要帮员工实现梦想，'
  - '[PAGE 89]


    员工的梦想实现了，老板的梦想也就顺便实现了。


    +   8、很多公司拼命教员工方法，而不是激发员工的内在动力，员工软绵绵的，老板天天激发员工的内在动力，员工自己就会去找方法。员工泄气了，激动不起来了，就换新人，这就是为什么很多企业喜欢招聘刚出社会的学生的原因。


    +   9、只要有员工私下里说公司不好，就把这个员工开除，然后想想公司是不是哪里没做好？提倡找到公司问题直接向老板反应，反应的问题好就奖励，不好就鼓励下次找个好问题来反应，广开言路。


    +   10、企业能存在是因为你对市场持续释放价值，对市场有帮助。如果你算计客户，欺骗客户，很快你的企业就消失了。


    +   11、公司必须拜业绩好的人为师，尊重业绩好的人。如果老板维护业绩不好的人，打击业绩好的人，就是昏君，公司就等着倒闭。做企业不是当皇帝，市场才是皇帝，企业是奴仆。'
  - '[PAGE 90]


    # 14、新时代的市场经济管理模式


    看到很多老板还在用几千年前秦始皇创造的管理模式，即中央集权的管理模式，这种管理模式就是老板自己当头。老板下面设几个部门，比如，营销部、市场部、生产部、人事部。每个部门都有自己的经理，然后老板就带领这几个部门打仗、赚钱、指挥这几个部门行动。这种模式在现代社会，只会把老板累死，因为大家都越来越聪明，市场竞争越来越激烈，分工越来越精细，老板不可能又懂市场，又懂顾客，又懂生产，又懂财务，还懂人事。而且，人的自由意志在不断的觉醒，特别是90后参与到社会中来的时候，特别是玩知识经济的企业，很多人都是本科毕业，大家都不愿意听老板指挥。老板又不是皇帝，又没有军队，就发点工资，只有没什么用的入、找不到工作的人，跟着你混，没有办法了才听你的。这种中央集权的管理模式吸收不到优秀的人才。


    现代人都不服管，不喜欢被管。那么，我的市场经济管理模式是怎么做的呢？在企业，所有员工不必要听我的指挥，你为谁工作，你就听谁的指挥，你服务哪个部门，哪些员工，你就听谁的指挥。在这个过程中，'
