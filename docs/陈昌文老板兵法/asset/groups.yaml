  - '[PAGE 205]


    了。很难相信一个形象差的人能把工作做好，就算他真能做好，也不要他，因为会影响公司其他同事的心情。


    # 然后是职业认同感。


    就是这个人是否是真喜欢这个职业，比如我们招聘销售，有的人说，我干过5年销售了，有丰富的经验，但不是太喜欢这个职业。还有的人跑过来，很老道的说：“销售就是忽悠，就是欺骗！”这两种人呢，都是对自己的职业不认同的人，这样的人不要招聘到企业。


    我曾經碰到一个销售经理，有经验，也能做出成绩，但是天天讲销售这个职业不是人干的，很苦，没意思，很无聊，就是骗人。新的销售人员听他这样讲，都愁眉苦脸，工作都没积极性了。当初没有经验，让他干了一段时间，后来明白了这种人没有职业认同感，直接把他开除了。扶上去一个正面、积极阳光的人做经理，非常有职业认同感，虽然这个经理业务能力没他强，但整个团队的业绩比以前翻了3倍。


    # 2、团队里只要靠谱的人


    我们做老板的由于经常招聘，根据自己做企业的经验，慢慢地对做'
  - '[PAGE 206]


    企业有了自己一套课本上没有的看法。


    很长一段时间由于销售的压力，我一直在努力的招聘优秀的业务员，选择那些聪明的人、有头脑的人、愿意挣钱的人去合作。但经过了大起大落的跌荡起伏之后，心沉淀下来，道理也清楚了很多，总觉得一个靠谱的人，才是你值得珍惜的人，值得用时光陪着一起做事情的人。靠谱的人，必须是勤动手的人。现在社会，由于读大学很容易了，从大学里出来的孩子，每个人都显得能说会道。招聘的时候，也很有技巧，表现得什么都会一样，但是一进企业，缺陷就暴露出来了，他们并不会努力做事，甚至是成天抱着电脑聊QQ、逛淘宝。


    一个会说话的人，讲了一大堆理论，弄了一个大饼给你看，你收留了他，他并不卖力的去工作，最终只留下失望和双方的不欢而散。


    什么样的人靠谱呢？一是 一，二是二，能办就能办，不能办就是不能办，实实在在，踏踏实实。比如一个业务员，他天天就是勤勤恳恳的卖产品，卖服务，有困难、有问题，自己想办法克服，但还是要坚持做下去。不想卖就不接这个业务，更不会做“一单求利润，产品生死与我不相干”的事。


    有的业务员只为了自己赚钱，给客户承诺公司办不到的事情，或者直接欺骗客户，造成公司损失。这样的人要尽量开除掉。跟靠谱的人合作干的是事业，跟聪明的人只能空闲时才可以坐在一起聊聊天。这么多年接触了很多聪明人，的确通过聊天满受益的，无论他们现在是否与我合作，当初有些观点是对我们有帮助的。但是合作以后发现，太聪明的'
  - '[PAGE 207]


    人想的是自己的利益大于一切，特别自私自利，久而久之，很难长久共事。心中有一种困惑，为什么我们比其他人给予他的更多，但总是不能满足他们的需求。聪明人算计心都特别强，躲着粗活、重活，只想指手画脚，只想锦上添花。我们经商久了，深深的明白，功劳应该记在那些踏踏实实做事的人的身上。


    不讲漂亮话、踏实做事的人很重要，无论跟他们共事，还是交朋友（当然也包括男女朋友），是诚实的，一是一、二是二的做事！他不会有意外让你措手不及。而很多聪明人总是先答应得好好的，结果等你问他要结果的时候，他就会给你一个意料之中的失望。以至于现在我都盼着这些一开始接触就表现得伶牙俐齿、很聪明的人了。现在很多人，在一起谈论最多的话题，是我们很“聊得来”。其实年头久了才发现，很“聊得来”只是一种心理满足感，而靠谱才能给予双方安全感。


    当一个靠谱的人承诺你事情的时候，他在心里已经有了把握，这件事情该怎么办？而伶牙俐齿的人，他承诺你的事情多半是察言观色，发现你的心理需求，用语言满足你，能不能办他根本就没有想过。因为他的聪明，所以他总会有办法让你觉得他尽力了，其实他连想都没有想一下，他连心都没用一下，只是空气在口腔中穿堂过而已。靠谱的人，他会体察对方的困难，而后从自身的角度尽可能的为你办实事，虽然可能存在局限性，可能存在意见上的分歧，可能在一段时间之内不统一，也可能是拒绝，但是是高效的，是意图明显的，是真诚与信任的。这样的人才是要与其合作的人。'
  - '[PAGE 208]


    现实生活中，人们喜欢聪明的人，当属正常心理。人们可以保持联系，但不一定会愿意推心置腹的相处，主要是变数太大，不托底。而人品好、靠谱的人，自然会有靠谱的人与之相处交往。这样的人在一个团队里，团队相对稳定很多。也就是企业中我们强调的忠诚大于能力。


    有的人在跟你合作的时候，尾巴夹得很紧的，一旦不合作了，什么恶劣的手段都会使用出来。招聘了这么多年，我仔细回忆起来，其实就发现，这是一帮一开始就表现得很聪明的人。由于聪明，穿上了一件善良、实的外衣，让人觉得这个人很实在。但对靠谱的人伤害就太大了，他们大多不善言辞，只会用心与人相处，吃亏了，大不了讲了当面。也就是人们常说的，好欺负、好人。结果委屈受大了，泪水咽到肚子里，擦干了，还是阳光一片。而聪明人，往往在背后使坏，恶毒至极。


    在当前这个社会，遇到靠谱的人是求之不得的宝贵资源。在社会的各个领域，如果能遇到他们，是企业的万幸之事，固然要倍加珍惜。自己是踏实做事的人，一直走下去，渐渐的会有很多踏实做事的人和你交往！如果要小聪明，实际上靠谱的人都会离你而去。路遥知马力，日久见人心。


    这些年体会最深的是，一个靠谱的人给你介绍的朋友，合作起来就是人品好、办事靠谱的人。而一个不靠谱的人给你介绍一个朋友或者一个同事，也能碰到靠谱的，但需要你有意愿，否则就只能碰运气。'
  - '[PAGE 209]


    我们做事选择靠谱，是选择一种优秀的品质。一旦你靠谱的对待事情，你可能暂时受到伤害，但是你也 能检验身边的朋友或者合作伙伴，筛选掉最不靠谱的人，最后在你身边会凝聚一团正气。这团正气可以使彼此化险为夷，使你坦坦荡荡的走下去，没有相互的猜疑，只有全部智慧叠加在一起，一定是
    1+1>2 的最好结局。所以一直靠谱下去，你的运气一定不会差！我现在的选人策略不再看这个人会不会说了，而是看他做事是否踏实靠谱。


    # 3、如何抢占应聘者心智


    初创公司招人难，是一个很严重的问题。


    我们在招聘的时候，如果有规模，就直接告诉员工规模，很多人都喜欢规模大的公司，认为这样的公司好。如果有可观的营业额，就给员工报上营业额，抢占心智，不要废话，直接给具体的结果。来应聘的人一旦听到了结果，他就立即记住了，并且会有一个判断到底加入不加入。其实对公司的历史、公司的未来都没有必要谈，因为这些总是有忽悠人的感觉。现在的人都认为自己很聪明，对这些比较抗拒，谈得越多，加入的可能性越小。'
  - '[PAGE 210]


    如果企业还在初期，人非常少，招聘员工的时候，可以告诉他发展速度，最好有数据直接告诉他，比如每个月的营业额都以 30% 的速度增加。大部分人都想找个有前途的公司，加入到这个团队跟着抢钱。就是强调发展速度。


    其实我们招聘的时候，只要透露几个关键点，说这几个关键点就行了，其他的不用讲。每个老板都应该找几个你能够表达的关键点。你还可以告诉应聘者，你是这个行业里的一个新模式，强调新；或者是这个行业里的第一品牌，就算不是第一品牌，你也可以随便制造一个细分领域的第一品牌。比如，你本来是卖减肥茶的，卖减肥茶的人多得很，你不是第一品牌，但你可以给自己封一个，我是做性感瘦体减肥茶的第一品牌。这也容易让应聘者直接记住你，认为有前途。你不需要多花一分钱，只需要智慧，招聘效果就会变好很多！


    # 4、公司招聘原则


    公司招聘，宁可漏过千个合适的人，也不可错招一个不合适的人。错招一个人损失太大了，时间损失、精力损失、金钱损失、公司项目进'
  - '[PAGE 211]


    度损失，满满都是泪。


    这些年没少招聘，我基本上每天面试 1 到 10 个人。刚开始没有经验，每回招人我都找最好的，什么新加坡理工大学的、英国留学生。售后服务岗位经常招名牌大学本科生，英语过八级。后来发现，招来的人根本留不住。本来简单工作的岗位，大专生完全能够胜任，找个本科生双方都不合适，只是在写公司简介时方便吹牛。员工对自己的工资期望高，但这个岗位上也发挥不出来他英语八级的能力，时间长了还要脾气。后来招聘一个大专业，大专生就老老实实的在这个岗位上干得很开心。


    所以，找人不是越优秀越好，公司是一个生态系统，需要优秀的人的岗位放优秀的人，需要普通人的岗位放普通人，主要是能力与岗位匹配最好。


    另外面试时应聘人说的话不可全信，本来就是一面之词，基本是只会挑好的说，你要学会从他的表情、话语中旁敲侧击的去推测一些东西。有时对方刚失去工作后比较失落，为得到新工作，他们什么都敢承诺。有时候有的人是刚到上海来，想迅速找个工作混工资、吃饭，然后利用你公司的电脑继续上网投递简历、打电话、找工作。碰到这样的奇葩，直接开除。


    某次公司招聘人事，岗位工资定为 5000 左右，一个女孩投简历面试，本科学历，3 年工作经验，上份工作工资在 5500，我问她这次工资比上份工作工资低，能否接受，她毫不犹豫表示没问题。由于她比较适合人事职位，我就录用了她。半个月后，前任人事和她交接完离职后，第二天她也离职了，理由居然是工资低，搞得公司非常被动，要给她发工资'
  - '[PAGE 212]


    不说，还耽误了公司招聘合适的人。再次招聘我招了个原工资 4500 的女孩，现在还在该岗位，不但干得好，而且对工资也很满意。大部分人对对待新工作职位及待遇都是只能上不能下，能上能下的人太少了，邓小平是能三下三上的人，所以他伟大。


    招人最重要的经验是：宁可漏过一千，不可招错一个。招错人了，浪费钱财对我不在乎，主要是拖累公司项目进度，直接减缓公司 development 速度。据我的经验，公司招聘：低一档用人，高一档发工资，效果比较好。也就是招三流的人才，干二流的工作，发一流的工资。当然，以上一流、二流、三流都是相对的，这样公司能稳定发展。三流的人才内心积极性被调动起来，出的成绩也不会差到哪里去。一流的人才如果不满意公司，基本上也就是个庸才。


    招聘时应不嫌麻烦，仔细核对应聘人员身份，手脚不干净的人偷了你的东西，几千块钱警察都不管。


    对岁数稍大、半骚满腹、觉得社会对他不公的，统统不要招聘到公司里来。对于批评抱怨原公司的人，也别招聘进公司。他能抱怨以前的单位，就能抱怨你的单位。觉得公司给他什么福利都是应该的，什么都说干，斤斤计较的要这要那的，一定不要招进来。这种人最会找事，并且会不断传播他的思想给其他团队成员。此外亲戚朋友能少用就少用吧，打不得，骂不得，开除不得，总是认为你当老板在剥削他，而不是给了他一份工作。他有本事他就去找好工作嘛，可惜他不去。他还要说，你以为我想呆在你公司啊，我要有本事，会什么，我早走了。'
  - '[PAGE 213]


    慢点，也不要急急忙忙的招不合适的人。


    # 5、做企业就是有用的人就好吃好喝的待着，没用就让他走


    用人：有用，就好吃好喝的待着，没用就让他走。


    中国社会，有很多有才华的人，一辈子郁郁不得志，就是因为分不清楚感情与利益。总是把这些东西纠结在一起。比如，两个人开始合伙做生意，一个人明明跟不上时代，还不愿意努力学习，而你以为他开始的时候与自己同甘共苦，不想叫他走，结果是生意继续没有起色。其实反过来想想，有用的时候，可以当他是宝，没用了，你还当他是宝贝，就证明你脑子有问题了。


    总有一些人脑子有问题，他认为你付出一次，你就永远要对他负责。就好像一个员工因为今年做出了好成绩，以后成绩都很差，你还要给他高薪水一样不合理。老板一定要学会过河拆桥，企业是物竞天择，适者生存的地方，不是公益慈善机构。只有笨蛋才老实注意恩情。把恩情放在第一位，企业死得非常快。有本事的人强一定是关注利益的。企业本来是'
  - '[PAGE 214]


    # 第六章 人才的招用


    靠利益生存的，有钱，企业才能活下去；无钱，企业只能倒闭。所以开除不合格的员工，股东要毫无内疚之感，并且要迅速。公司越大，越是只看成绩不看恩情，一切按照天道来。中国人喜欢讲一句话，“饮水要思源”。其实这个思，就是记住就行了。不是说一个人对你有恩，你发达了，就必须无条件的提拔他。就算你给他机会，他自己没本事，你还是应该放弃他。道理很简单，假如你曾经掉下山崖，被一个农夫救了，你以后奋斗成皇帝了，不是说就得把这个农夫弄来当宰相。老板呢，必须分清是感情与利益，不可混为一谈。


    做企业就是有用的人就好吃好喝的待着，没用就让他走！


    那么，员工应该如何培养成有用的人？


    +   1、让每个部门的老员工写业务操作手册。新员工进来先学习老员工的经验。


    +   2、讲清楚哪些应该干，如何干最有效率，哪些不应该干。


    +   3、公司的领导必须给员工洗脑，树立正确的世界观，讲清楚公司的企业文化，认可公司企业文化的人留下，不认可的立刻请他走。


    +   4、满足员工的短期期望。比如员工想来赚钱，我们就告诉他，公司会对优秀的人分红，给予高待遇。员工想升官，我们就告诉他，有能力的人，业绩好的人，我们就给予升官的机会。总之要看人下菜碟，满足不同员'
  - '[PAGE 215]


    工的需求。


    5、公司有长期目标，也有短期目标。只有长期目标与短期目标相互配合，公司才能发展得更好。


    6、公司欢迎优秀的人加入，如果优秀的员工想换公司，我们也表示欢迎，希望他职业发展得更好。但我们公司不愿意接受一个平庸、负面的人加入。这个在新员工进公司的时候，就要讲清楚。


    7、对于不想进步、不愿意学习的人，我们直接开除。


    8、老板要经常与同行的老板相互交流，学到更高明的盈利手段。


    # ## 6、对员工管理的无为而治


    我最喜欢无为而治，我不喜欢对员工做什么规定。不管做什么，我都喜欢让员工自己出方案、定策略、搞执行。因为是他们自己出的方案，定的策略，所以他们执行得也比较到位。'
  - '[PAGE 216]


    我的策略是告诉员工公司的整体目标，然后让员工自己去做计划、执行。我是不管他们如何完成目标的，我只要结果。与员工讨论制定整体目标有什么好处？就是让员工清楚的知道我们公司要干什么。这样做，能让员工理解自己工作的意义，他们会主动用自己的大脑想问题，根据目标调整自己的动作，最终提高自己的工作效率。


    如果不告诉员工我们的目标，那么员工就很难理解自己工作的真正意义，就会很难管，没有向心力，没有热情，不主动。最高境界的管理，一定是理顺逻辑，让员工发自内心的思考并且主动工作。


    有很多老板喜欢自己做一个计划，然后让员工去执行，或者自己不做计划，找一个能力强的总经理来做计划。这种模式，是典型的计划经济模式。如果老板自己的能力与总经理的能力都超级强悍，那么这个公司会有一些竞争力。当这位厉害的总经理离职或者是老板自己因为年纪的增加，精力有限的时候，企业就会走下坡路。


    那么有没有办法在没有强悍的总经理或者老板的情况下，企业的业绩依然很好呢？答案是有的：就是市场经济的管理模式。调动每一个员工的头脑，而不是老板自己的头脑。老板再牛
    ×，也只有一个脑袋，就比如像项羽一样牛 ×，也是无济于事的。而老板如果善于调动所有员工的脑袋，那么就算老板不牛 ×，团队也会很牛 ×，如同刘邦调动了张良、萧何、韩信脑袋一样。'
  - '[PAGE 217]


    任何一个聪明人都是没办法管理足够多的事情的，现代企业最大的资产，其实就是你那几十个或者几百个员工的脑袋。没有人愿意被执行计划，而如果是他们自己制定的计划，他们执行的愿望就会强烈些，工作也会主动些。所以，现代企业的管理思路应该是想尽办法让每一个员工自己动脑去制定一个计划来完成公司的目标，而不是让一个牛人人物来制定一个整体计划，让员工执行。


    老板的主要任务就是给出清晰的战略方向，确定要做什么。尽量让更多的人负起他们手上工作的全部责任，重要的是他们自己的计划责任，而不仅仅是执行责任。老板不要变成一个计划者，更加不要变成一个统一的指挥，而是做一个方向指引者、协调者、激励者就行了。


    我曾经见过一个与我想法类似的公司。他们公司的走廊墙壁上张贴着十几条格言，“没有付出，就没有收获。”“完成工作很难，但有意义；失去工作很容易，但没有价值。”“多一个微笑，少一点矛盾；多一份责任，少一些隐患。”这些格言平实但意义深刻。看署名才知道，格言作者都是该公司的员工。


    不张贴名人名言，而张贴员工自己的格言，不仅是对员工格言给予的肯定，对员工价值观表示很尊重，而且也是对员工的一种鼓舞。员工每天看着自己的人生格言，就会以此对照检查自己的工作，可以常常鞭策自己，鼓舞自己，这是个好方法，为企业带来生机活力。'
  - '[PAGE 218]


    美的创始人方洪波谈起动创始人最重要的优点时，说：“永远都开心满足得到了自己应得的那一份，绝不眼红其他人得到什么。”修养就是财富，见到别人得到更多，心中总是有些不平的人，很难把企业做大，也很难聚集能力强的人跟自己混，其实这样的人得到的反而少。


    用亚当斯密观点补充一下，奴隶比自由人更贵！奴隶难道不是只要不饿死就行了吗？是啊。但是，对于奴隶来说，由于没有任何收益，偷懒就成了他唯一的利益。如果你手下全是不拿工资的奴隶，你的成本会达到最高，因为他们会想尽一切办法偷懒。要想降低成本，就要懂得把利益给别人，如此他们就自己去干活了。


    这就要求老板必须把利益分享给团队成员。所以美的的创始人最聪明，他分享了利益。很多领导人在追求无为而治，学了很多管理学，请教了很多高人，也去读了MBA，但只要你不分配利益给下属，你的无为而治都无从谈起。


    总结一句：如果你善于利用每一个人的脑袋去做计划、做执行，是一定会打败利用一己之力做一个统一的大计划，然后让员工去执行的聪明老板的。'
  - '[PAGE 219]


    # 7、老板不培养人，只选合适的人来用


    学习和进步确实是自己的事，一个底子优良的人不需要你监督，只要提供良好的环境、一定的压力，比如他身边全是积极向上的人，老板给出合理的奖惩，他自己会学习进步。但是有很多员工，确实就是死猪不怕开水烫，牵着不走推着倒退的。我们是做企业的，不是学前班，如果一个人连努力都不知道，我认为这是他父母和启蒙老师的责任，不应该由我们来承担。


    培养一个人的自觉性和主动性是超级累的，付出的代价可能远超过他贡献的价值，更可悲的是，很多人到了十八岁（甚至十六岁）就定型了，再无改变的可能。从心理学上说，人的基本性格形成是在三岁之前，所以除非时间倒流，否则我们是一点办法也没有。你心里要有可选和不可选的概念，遇到后者，暂时能用就用，不能用直接开除。


    做老板，不计小节，抓大放小非常重要。


    抓大放小意味着决断力，是一种取舍，所以也可以说果断迅速的放'
  - '[PAGE 220]


    弃一些东西。比如说培养员工这事，如果是我就，我就会非常迅速放弃这种想法，虽然这事看起来是可行的，但如果你站在全局和长远上来看，退一万步，假设我们花一年时间把他们培养起来，而我们的利润和待遇却没有跟上。（显然跟不上，我们的精力都放在他们身上去了，而不是做业务、赚钱上去了。）一转眼他们就会被人挖走，我们是为什么人作嫁衣的吗？难道我们是来做慈善的吗？


    当你看到一年以后，看到几年以后，你的企业整体盈利水平会发生什么变化（因为这些人不顶用，所以不太乐观），你知道了事情会怎么发展，你当然也就能决定现在该怎幺办。所以牛人企业家都是站在未来看现在的人。站在未来看现在，很多问题都不是问题了。


    但倘若你纠结于如何把人培养好，你显然就会忽略培养好了又怎样？你能看多远就能走多远，因为你看到什么，就会把精力投入什么上。所以如果你看得太远，看得太军太具体，赢得一场战役反而会输掉整个战争。做企业耍分清核心团队和普通员工，你提拔任用的是你的人，也就是核心团队，他们和你生死与共的。而其他被监督管理的是普通员工，属于可以被替换的一部分。


    类似部队，提干的就是自己人了，可以长期留下来任职；其他的就只是炮灰。人为的制造等级差距是管理中很重要的一环，要按照人人平等的梦想，这企业没法管理。因为人与人的利益立场是不同的，不是谁都会自覚自愿的工作。其实大多数员工会把自己和企业看成是对立的，就'
  md: '


    # 然后是职业认同感。


    就是这个人是否是真喜欢这个职业。比如我们招聘销售，有的人说：“我干过5年销售了，有丰富的经验，但不是太喜欢这个职业。”还有的人跑过来，很老道地说：“销售就是忽悠，就是欺骗！”这两种人呢，都是对自己的职业不认同的人，这样的人不要招聘到企业。


    我曾經碰到一个销售经理，有经验，也能做出成绩，但是天天讲销售这个职业不是人干的，很苦，没意思，很无聊，就是骗人。新的销售人员听他这样讲，都愁眉苦脸，工作都没积极性了。当初没有经验，让他干了一段时间，后来明白了这种人没有职业认同感，直接把他开除了。扶上去一个正面、积极阳光的人做经理，非常有职业认同感，虽然这个经理业务能力没他强，但整个团队的业绩比以前翻了3倍。


    ## 2、团队里只要靠谱的人


    我们做老板的由于经常招聘，根据自己做企业的经验，慢慢地对做企业有了自己一套课本上没有的看法。


    很长一段时间由于销售的压力，我一直在努力地招聘优秀的业务员，选择那些聪明的人、有头脑的人、愿意挣钱的人去合作。但经过了大起大落的跌荡起伏之后，心沉淀下来，道理也清楚了很多，总觉得一个靠谱的人，才是你值得珍惜的人，值得用时光陪着一起做事情的人。靠谱的人，必须是勤动手的人。现在社会，由于读大学很容易了，从大学里出来的孩子，每个人都显得能说会道。招聘的时候，也很有技巧，表现得什么都会一样，但是一进企业，缺陷就暴露出来了，他们并不会努力做事，甚至是成天抱着电脑聊QQ、逛淘宝。


    一个会说话的人，讲了一大堆理论，弄了一个大饼给你看，你收留了他，他并不卖力地去工作，最终只留下失望和双方的不欢而散。


    什么样的人靠谱呢？一是一，二是二，能办就能办，不能办就是不能办，实实在在，踏踏实实。比如一个业务员，他天天就是勤勤恳恳地卖产品，卖服务，有困难、有问题，自己想办法克服，但还是要坚持做下去。不想卖就不接这个业务，更不会做“一单求利润，产品生死与我不相干”的事。


    有的业务员只为了自己赚钱，给客户承诺公司办不到的事情，或者直接欺骗客户，造成公司损失。这样的人要尽量开除掉。跟靠谱的人合作干的是事业，跟聪明的人只能空闲时才可以坐在一起聊聊天。这么多年接触了很多聪明人，的确通过聊天满受益的，无论他们现在是否与我合作，当初有些观点是对我们有帮助的。但是合作以后发现，太聪明的人想的是自己的利益大于一切，特别自私自利，久而久之，很难长久共事。心中有一种困惑，为什么我们比其他人给予他的更多，但总是不能满足他们的需求。聪明人算计心都特别强，躲着粗活、重活，只想指手画脚，只想锦上添花。我们经商久了，深深的明白，功劳应该记在那些踏踏实实做事的人的身上。


    不讲漂亮话、踏实做事的人很重要，无论跟他们共事，还是交朋友（当然也包括男女朋友），是诚实的，一是一、二是二的做事！他不会有意外让你措手不及。而很多聪明人总是先答应得好好的，结果等你问他要结果的时候，他就会给你一个意料之中的失望。以至于现在我都盼着这些一开始接触就表现得伶牙俐齿、很聪明的人了。现在很多人，在一起谈论最多的话题，是我们很“聊得来”。其实年头久了才发现，很“聊得来”只是一种心理满足感，而靠谱才能给予双方安全感。


    当一个靠谱的人承诺你事情的时候，他在心里已经有了把握，这件事情该怎么办？而伶牙俐齿的人，他承诺你的事情多半是察言观色，发现你的心理需求，用语言满足你，能不能办他根本就没有想过。因为他的聪明，所以他总会有办法让你觉得他尽力了，其实他连想都没有想一下，他连心都没用一下，只是空气在口腔中穿堂过而已。靠谱的人，他会体察对方的困难，而后从自身的角度尽可能地为你办实事，虽然可能存在局限性，可能存在意见上的分歧，可能在一段时间之内不统一，也可能是拒绝，但是是高效的，是意图明显的，是真诚与信任的。这样的人才是要与其合作的人。


    现实生活中，人们喜欢聪明的人，当属正常心理。人们可以保持联系，但不一定会愿意推心置腹地相处，主要是变数太大，不托底。而人品好、靠谱的人，自然会有靠谱的人与之相处交往。这样的人在一个团队里，团队相对稳定很多。也就是企业中我们强调的忠诚大于能力。


    有的人在跟你合作的时候，尾巴夹得很紧的，一旦不合作了，什么恶劣的手段都会使用出来。招聘了这么多年，我仔细回忆起来，其实就发现，这是一帮一开始就表现得很聪明的人。由于聪明，穿上了一件善良、实的外衣，让人觉得这个人很实在。但对靠谱的人伤害就太大了，他们大多不善言辞，只会用心与人相处，吃亏了，大不了讲了当面。也就是人们常说的，好欺负、好人。结果委屈受大了，泪水咽到肚子里，擦干了，还是阳光一片。而聪明人，往往在背后使坏，恶毒至极。


    在当前这个社会，遇到靠谱的人是求之不得的宝贵资源。在社会的各个领域，如果能遇到他们，是企业的万幸之事，固然要倍加珍惜。自己是踏实做事的人，一直走下去，渐渐地会有很多踏实做事的人和你交往！如果要小聪明，实际上靠谱的人都会离你而去。路遥知马力，日久见人心。


    这些年体会最深的是，一个靠谱的人给你介绍的朋友，合作起来就是人品好、办事靠谱的人。而一个不靠谱的人给你介绍一个朋友或者一个同事，也能碰到靠谱的，但需要你有意愿，否则就只能碰运气。


    我们做事选择靠谱，是选择一种优秀的品质。一旦你靠谱地对待事情，你可能暂时受到伤害，但是你也 能检验身边的朋友或者合作伙伴，筛选掉最不靠谱的人，最后在你身边会凝聚一团正气。这团正气可以使彼此化险为夷，使你坦坦荡荡地走下去，没有相互的猜疑，只有全部智慧叠加在一起，一定是
    1+1>2 的最好结局。所以一直靠谱下去，你的运气一定不会差！我现在的选人策略不再看这个人会不会说了，而是看他做事是否踏实靠谱。


    ## 3、如何抢占应聘者心智


    初创公司招人难，是一个很严重的问题。


    我们在招聘的时候，如果有规模，就直接告诉员工规模，很多人都喜欢规模大的公司，认为这样的公司好。如果有可观的营业额，就给员工报上营业额，抢占心智，不要废话，直接给具体的结果。来应聘的人一旦听到了结果，他就立即记住了，并且会有一个判断到底加入不加入。其实对公司的历史、公司的未来都没有必要谈，因为这些总是有忽悠人的感觉。现在的人都认为自己很聪明，对这些比较抗拒，谈得越多，加入的可能性越小。


    如果企业还在初期，人非常少，招聘员工的时候，可以告诉他发展速度，最好有数据直接告诉他，比如每个月的营业额都以 30% 的速度增加。大部分人都想找个有前途的公司，加入到这个团队跟着抢钱。就是强调发展速度。


    其实我们招聘的时候，只要透露几个关键点，说这几个关键点就行了，其他的不用讲。每个老板都应该找几个你能够表达的关键点。你还可以告诉应聘者，你是这个行业里的一个新模式，强调新；或者是这个行业里的第一品牌，就算不是第一品牌，你也可以随便制造一个细分领域的第一品牌。比如，你本来是卖减肥茶的，卖减肥茶的人多得很，你不是第一品牌，但你可以给自己封一个，我是做性感瘦体减肥茶的第一品牌。这也容易让应聘者直接记住你，认为有前途。你不需要多花一分钱，只需要智慧，招聘效果就会变好很多！


    ## 4、公司招聘原则


    公司招聘，宁可漏过千个合适的人，也不可错招一个不合适的人。错招一个人损失太大了，时间损失、精力损失、金钱损失、公司项目进度损失，满满都是泪。


    这些年没少招聘，我基本上每天面试 1 到 10 个人。刚开始没有经验，每回招人我都找最好的，什么新加坡理工大学的、英国留学生。售后服务岗位经常招名牌大学本科生，英语过八级。后来发现，招来的人根本留不住。本来简单工作的岗位，大专生完全能够胜任，找个本科生双方都不合适，只是在写公司简介时方便吹牛。员工对自己的工资期望高，但这个岗位上也发挥不出来他英语八级的能力，时间长了还要脾气。后来招聘一个大专业，大专生就老老实实得在这个岗位上干得很开心。


    所以，找人不是越优秀越好，公司是一个生态系统，需要优秀的人的岗位放优秀的人，需要普通人的岗位放普通人，主要是能力与岗位匹配最好。


    另外面试时应聘人说的话不可全信，本来就是一面之词，基本是只会挑好的说，你要学会从他的表情、话语中旁敲侧击地去推测一些东西。有时对方刚失去工作后比较失落，为得到新工作，他们什么都敢承诺。有时候有的人是刚到上海来，想迅速找个工作混工资、吃饭，然后利用你公司的电脑继续上网投递简历、打电话、找工作。碰到这样的奇葩，直接开除。


    某次公司招聘人事，岗位工资定为 5000 左右，一个女孩投简历面试，本科学历，3 年工作经验，上份工作工资在 5500，我问她这次工资比上份工作工资低，能否接受，她毫不犹豫表示没问题。由于她比较适合人事职位，我就录用了她。半个月后，前任人事和她交接完离职后，第二天她也离职了，理由居然是工资低，搞得公司非常被动，要给她发工资不说，还耽误了公司招聘合适的人。再次招聘我招了个原工资
    4500 的女孩，现在还在该岗位，不但干得好，而且对工资也很满意。大部分人对对待新工作职位及待遇都是只能上不能下，能上能下的人太少了，邓小平是能三下三上的人，所以他伟大。


    招人最重要的经验是：宁可漏过一千，不可招错一个。招错人了，浪费钱财对我不在乎，主要是拖累公司项目进度，直接减缓公司 development 速度。据我的经验，公司招聘：低一档用人，高一档发工资，效果比较好。也就是招三流的人才，干二流的工作，发一流的工资。当然，以上一流、二流、三流都是相对的，这样公司能稳定发展。三流的人才内心积极性被调动起来，出的成绩也不会差到哪里去。一流的人才如果不满意公司，基本上也就是个庸才。


    招聘时应不嫌麻烦，仔细核对应聘人员身份，手脚不干净的人偷了你的东西，几千块钱警察都不管。


    对岁数稍大、半骚满腹、觉得社会对他不公的，统统不要招聘到公司里来。对于批评抱怨原公司的人，也别招聘进公司。他能抱怨以前的单位，就能抱怨你的单位。觉得公司给他什么福利都是应该的，什么都说干，斤斤计较的要这要那的，一定不要招进来。这种人最会找事，并且会不断传播他的思想给其他团队成员。此外亲戚朋友能少用就少用吧，打不得，骂不得，开除不得，总是认为你当老板在剥削他，而不是给了他一份工作。他有本事他就去找好工作嘛，可惜他不去。他还要说，你以为我想呆在你公司啊，我要有本事，会什么，我早走了。


    慢点，也不要急急忙忙地招不合适的人。


    ## 5、做企业就是有用的人就好吃好喝的待着，没用就让他走


    用人：有用，就好吃好喝的待着，没用就让他走。


    中国社会，有很多有才华的人，一辈子郁郁不得志，就是因为分不清楚感情与利益。总是把这些东西纠结在一起。比如，两个人开始合伙做生意，一个人明明跟不上时代，还不愿意努力学习，而你以为他开始的时候与自己同甘共苦，不想叫他走，结果是生意继续没有起色。其实反过来想想，有用的时候，可以当他是宝，没用了，你还当他是宝贝，就证明你脑子有问题了。


    总有一些人脑子有问题，他认为你付出一次，你就永远要对他负责。就好像一个员工因为今年做出了好成绩，以后成绩都很差，你还要给他高薪水一样不合理。老板一定要学会过河拆桥，企业是物竞天择，适者生存的地方，不是公益慈善机构。只有笨蛋才老实注意恩情。把恩情放在第一位，企业死得非常快。有本事的人强一定是关注利益的。企业本来是


    # 第六章 人才的招用


    靠利益生存的，有钱，企业才能活下去；无钱，企业只能倒闭。所以开除不合格的员工，股东要毫无内疚之感，并且要迅速。公司越大，越是只看成绩不看恩情，一切按照天道来。中国人喜欢讲一句话，“饮水要思源”。其实这个思，就是记住就行了。不是说一个人对你有恩，你发达了，就必须无条件的提拔他。就算你给他机会，他自己没本事，你还是应该放弃他。道理很简单，假如你曾经掉下山崖，被一个农夫救了，你以后奋斗成皇帝了，不是说就得把这个农夫弄来当宰相。老板呢，必须分清是感情与利益，不可混为一谈。


    做企业就是有用的人就好吃好喝的待着，没用就让他走！


    那么，员工应该如何培养成有用的人？


    - 1、让每个部门的老员工写业务操作手册。新员工进来先学习老员工的经验。

    - 2、讲清楚哪些应该干，如何干最有效率，哪些不应该干。

    - 3、公司的领导必须给员工洗脑，树立正确的世界观，讲清楚公司的企业文化，认可公司企业文化的人留下，不认可的立刻请他走。

    - 4、满足员工的短期期望。比如员工想来赚钱，我们就告诉他，公司会对优秀的人分红，给予高待遇。员工想升官，我们就告诉他，有能力的人，业绩好的人，我们就给予升官的机会。总之要看人下菜碟，满足不同员工的需求。

    - 5、公司有长期目标，也有短期目标。只有长期目标与短期目标相互配合，公司才能发展得更好。

    - 6、公司欢迎优秀的人加入，如果优秀的员工想换公司，我们也表示欢迎，希望他职业发展得更好。但我们公司不愿意接受一个平庸、负面的人加入。这个在新员工进公司的时候，就要讲清楚。

    - 7、对于不想进步、不愿意学习的人，我们直接开除。

    - 8、老板要经常与同行的老板相互交流，学到更高明的盈利手段。


    ## 6、对员工管理的无为而治


    我最喜欢无为而治，我不喜欢对员工做什么规定。不管做什么，我都喜欢让员工自己出方案、定策略、搞执行。因为是他们自己出的方案，定的策略，所以他们执行得也比较到位。


    我的策略是告诉员工公司的整体目标，然后让员工自己去做计划、执行。我是不管他们如何完成目标的，我只要结果。与员工讨论制定整体目标有什么好处？就是让员工清楚的知道我们公司要干什么。这样做，能让员工理解自己工作的意义，他们会主动用自己的大脑想问题，根据目标调整自己的动作，最终提高自己的工作效率。


    如果不告诉员工我们的目标，那么员工就很难理解自己工作的真正意义，就会很难管，没有向心力，没有热情，不主动。最高境界的管理，一定是理顺逻辑，让员工发自内心的思考并且主动工作。


    有很多老板喜欢自己做一个计划，然后让员工去执行，或者自己不做计划，找一个能力强的总经理来做计划。这种模式，是典型的计划经济模式。如果老板自己的能力与总经理的能力都超级强悍，那么这个公司会有一些竞争力。当这位厉害的总经理离职或者是老板自己因为年纪的增加，精力有限的时候，企业就会走下坡路。


    那么有没有办法在没有强悍的总经理或者老板的情况下，企业的业绩依然很好呢？答案是有的：就是市场经济的管理模式。调动每一个员工的头脑，而不是老板自己的头脑。老板再牛
    ×，也只有一个脑袋，就比如像项羽一样牛 ×，也是无济于事的。而老板如果善于调动所有员工的脑袋，那么就算老板不牛 ×，团队也会很牛 ×，如同刘邦调动了张良、萧何、韩信脑袋一样。


    任何一个聪明人都是没办法管理足够多的事情的，现代企业最大的资产，其实就是你那几十个或者几百个员工的脑袋。没有人愿意被执行计划，而如果是他们自己制定的计划，他们执行的愿望就会强烈些，工作也会主动些。所以，现代企业的管理思路应该是想尽办法让每一个员工自己动脑去制定一个计划来完成公司的目标，而不是让一个牛人人物来制定一个整体计划，让员工执行。


    老板的主要任务就是给出清晰的战略方向，确定要做什么。尽量让更多的人负起他们手上工作的全部责任，重要的是他们自己的计划责任，而不仅仅是执行责任。老板不要变成一个计划者，更加不要变成一个统一的指挥，而是做一个方向指引者、协调者、激励者就行了。


    我曾经见过一个与我想法类似的公司。他们公司的走廊墙壁上张贴着十几条格言，“没有付出，就没有收获。”“完成工作很难，但有意义；失去工作很容易，但没有价值。”“多一个微笑，少一点矛盾；多一份责任，少一些隐患。”这些格言平实但意义深刻。看署名才知道，格言作者都是该公司的员工。


    不张贴名人名言，而张贴员工自己的格言，不仅是对员工格言给予的肯定，对员工价值观表示很尊重，而且也是对员工的一种鼓舞。员工每天看着自己的人生格言，就会以此对照检查自己的工作，可以常常鞭策自己，鼓舞自己，这是个好方法，为企业带来生机活力。


    美的创始人方洪波谈起动创始人最重要的优点时，说：“永远都开心满足得到了自己应得的那一份，绝不眼红其他人得到什么。”修养就是财富，见到别人得到更多，心中总是有些不平的人，很难把企业做大，也很难聚集能力强的人跟自己混，其实这样的人得到的反而少。


    用亚当·斯密观点补充一下，奴隶比自由人更贵！奴隶难道不是只要不饿死就行了吗？是啊。但是，对于奴隶来说，由于没有任何收益，偷懒就成了他唯一的利益。如果你手下全是不拿工资的奴隶，你的成本会达到最高，因为他们会想尽一切办法偷懒。要想降低成本，就要懂得把利益给别人，如此他们就自己去干活了。


    这就要求老板必须把利益分享给团队成员。所以美的的创始人最聪明，他分享了利益。很多领导人在追求无为而治，学了很多管理学，请教了很多高人，也去读了MBA，但只要你不分配利益给下属，你的无为而治都无从谈起。


    总结一句：如果你善于利用每一个人的脑袋去做计划、做执行，是一定会打败利用一己之力做一个统一的大计划，然后让员工去执行的聪明老板的。


    ## 7、老板不培养人，只选合适的人来用


    学习和进步确实是自己的事，一个底子优良的人不需要你监督，只要提供良好的环境、一定的压力，比如他身边全是积极向上的人，老板给出合理的奖惩，他自己会学习进步。但是有很多员工，确实就是死猪不怕开水烫，牵着不走推着倒退的。我们是做企业的，不是学前班，如果一个人连努力都不知道，我认为这是他父母和启蒙老师的责任，不应该由我们来承担。


    培养一个人的自觉性和主动性是超级累的，付出的代价可能远超过他贡献的价值，更可悲的是，很多人到了十八岁（甚至十六岁）就定型了，再无改变的可能。从心理学上说，人的基本性格形成是在三岁之前，所以除非时间倒流，否则我们是一点办法也没有。你心里要有可选和不可选的概念，遇到后者，暂时能用就用，不能用直接开除。


    做老板，不计小节，抓大放小非常重要。


    抓大放小意味着决断力，是一种取舍，所以也可以说果断迅速的放弃一些东西。比如说培养员工这事，如果是我就，我就会非常迅速放弃这种想法，虽然这事看起来是可行的，但如果你站在全局和长远上来看，退一万步，假设我们花一年时间把他们培养起来，而我们的利润和待遇却没有跟上。（显然跟不上，我们的精力都放在他们身上去了，而不是做业务、赚钱上去了。）一转眼他们就会被人挖走，我们是为什么人作嫁衣的吗？难道我们是来做慈善的吗？


    当你看到一年以后，看到几年以后，你的企业整体盈利水平会发生什么变化（因为这些人不顶用，所以不太乐观），你知道了事情会怎么发展，你当然也就能决定现在该怎幺办。所以牛人企业家都是站在未来看现在的人。站在未来看现在，很多问题都不是问题了。


    但倘若你纠结于如何把人培养好，你显然就会忽略培养好了又怎样？你能看多远就能走多远，因为你看到什么，就会把精力投入什么上。所以如果你看得太远，看得太军太具体，赢得一场战役反而会输掉整个战争。做企业耍分清核心团队和普通员工，你提拔任用的是你的人，也就是核心团队，他们和你生死与共的。而其他被监督管理的是普通员工，属于可以被替换的一部分。


