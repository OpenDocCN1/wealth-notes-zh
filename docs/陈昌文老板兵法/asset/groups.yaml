    ## 5、道学会了，术就无师自通


    做事的方法很重要，但其实一个人真正能成功往往不是方法所决定的，而是那些优秀的品质所决定的。当一个人具备了我下面谈的这些优秀品质，很多东西都可以无师自通。


    第一个品质，耐力。


    很多人做事有爆发力已经很不错了，他能持续拼搏一小段时间，但是不能长久的拼，这样的人注定只能给别人打工。


    我本人非常喜欢长跑，一般早上跑一万米以上，因为长跑最考验一个人的耐力。很多跑步的人跟我一起跑步，开始的时候，他们能跑上三四千米，可是他们很难继续下去了。如果你想锻炼自己的耐力，可以开始学习长跑。


    人活在这个世界上，要做事业，要赚钱。你需要选定一个领域：首先，你需要往前跑，不一定是这个领域里跑得最快的，但是要跑得久！大部分人都跑不久，他们迟早换行业，而如果你跑得久，那么优势会积累下来，最终成为行业王者。需要注意的是，跑得不快不是你说在这个行业混着，不能三天打鱼，两天晒网，你需要持之以恒的跑，只要跑，早晚都会达到目标。


    ### 第二个品质，懂得分享和吃苦。


    人是群体性动物，要赚到钱，就必须学会在群体中获得支持。大家都帮你，不是因为大家是雷锋，而是大家知道你成功了，他们也能获得果实，他们才愿意帮你，所以必须要懂得分享。人际关系的好坏，决定了你的地位与荣耀，进而决定你的钱袋子。如果你想让一帮人死心塌地的支持你，你必须让他们分享你的物质财富、精神财富，分享你的痛苦与快乐，让大家感觉到你可靠真实。帮助你就等于帮助他们自己，这是你能够坐着数钱的条件之一。


    吃苦精神也很重要，做任何事情如果不付出艰辛的劳动而想做好是不行的，很多伟大的事情都是由单调而乏味的小事情构成的。这个世界上，除了你的父母会无私的给予你钞票外，大概就只能靠自己获取了。说句很多人接受不了的话，包括你的老婆或者老公，都做不到无私的给予你钞票。我们要清醒的认识到这个社会现实，所以我们要锻炼自己的吃苦能力，因为你不吃苦不行了。


    ### 第三个品质，果断与坚持。


    果断，为什么要提出来呢？因为人的一辈子不断的面临着选择。有了果断的精神，能让我们节约不少犹豫的时间。我也碰到很多反复思考决定不了的事情，索性抛硬币决定，因为犹豫太浪费时间了。很多事情只有在做的过程中，才能具体的了解。在选择上浪费很多时间，是极其划不来的事情。


    与果断配合起来的一个品质就是坚持，当你选择好了一件事情的时候，动手去做了，就别老是想其他的事情，你必须坚持去做。只有坚持去做，你才能在这个领域获取更多的经验、更多的资源、积累人脉、积累知识。而如果你经常换，那么是很难成长的。深入一个行业，才能挖掘到巨大的利润。我们选择好了，就要准备做到别人永远也达不到的高度，走出别人走不出的距离。即便是很多人说，马上就到尽头了，也别停下，继续走，走到尽头，往往又会有新的路。


    ### 第四个品质，专注。


    我们每一个人，其实一生能做好一件事，就能荣华富贵。现代人看似懂得很多，其实呢，没多大用处。一个人不要炫耀你懂得多，只要有一门拿得出手的本事就算你厉害。如果你把钻研很多东西的时间都专注到一件事情上来，可能你的生活品质早就提升了好几个档次了。


    我以前喜欢读很多书，好像什么都知道点一样，但是呢，自己也能感觉到，自己是个啥都不会的人。后来，我每天早上必读《道德经》，由于持续不断的读，我几乎没有用心去背，就发现我也已经会背了，并且这部书融入了我的潜意识。我做什么都会想起这本书上的句子，这种感觉就很好。这或许就是专注所带来的力量。所以在读书这件事情上，我也建议大家不是广泛阅读，而是精读一、两本好书。


    ### 第五个品质，奋斗。


    为什么要奋斗？因为对于普通人来说，只有奋斗能改变你的生活品质，能改变命运。人有可能靠一段时间的运气好而赚到钱，但不可能一直运气好。而如果有一个人有奋斗精神，就算在逆境中，他也会过得越来越好。很多成功的人，实际上都把成功归结为持续不断的努力奋斗，可见这种品质是多么的重要。


    以上这五个品质非常重要，是道的层面。


    老板学的就是道，员工学的是术。道的层面的事情做好了，术的层面的事情就水到渠成，自然就好了。


    ## 6、做互联网赚钱必须意志力坚强


    **赚钱这条道路上，没有坚强的意志力将永远活在地狱中。**


    其实在任何道路上行走，想要搞到钱，没有坚强的意志力都注定走不远。你走不远的后果就是，总有人走得更远。那么走得更远的人就赚到了钱，而走不远的人就成了相关领域的失败者。虽然赖在这个领域不走，但是会一直痛苦，痛苦一辈子。人身上的缺点，**只有用坚强的意志力去改变，才能彻底改变。否则这个缺点就会终身成为你的短板，**
    一直拉着下地狱，在社会中过得不如意。


    对自己不要太温柔。对自己温柔的人，一辈子都不能进步。人真的是逼出来的，成佛成道，在此一逼，逼自己过这道坎，过了就吃肉，不过就不知道吃什么了。我们做互联网项目、做网赚，对此体会是深入骨髓的。很多零基础项目，说白了，讲透彻了，就是文案加推广、加售后服务。死磕两周就懂了，可是就是有很多兄弟，舍不得自己那身肉，狠不下心来苦学、苦干。这些项目一点就透，缺少的就是具体化去落实的精神。每天去优化自己的文案，优化自己的项目，每天都参考
    10 几个同行的推广渠道、操作手法，每天做记录，每天做售后，做反馈。你只要拼三个月，人生就是另一番风景了。至少从员工蜕变成个体户或者说小老板了。可是很多人就是不能坚持拼搏。


    你拼不拼，其实跟我没关系。我只是觉得我应该再讲讲这些简单的道理，万一哪个做项目的兄弟听明白了，就改变了人生观，我也算是功德一件吧。任何成就都是建立在坚持不懈的精神上，道理简单，必须做到，做不到的人，还是去打工吧。赚钱，不适合一点自律性都没有的人。


    ## 7、复制已经成功的业务，少创新


    很多企业的大成功其实不是创新的成功，而是复制的成功，例如大部分连锁企业。有一些企业的做法甚至不是复制自己的成功，而是复制别人的成功。复制与创新，就像自然界的阴与阳，谁也离不开谁。


    很多企业的问题不是缺少创新，而是缺少复制已经成功的业务。最近碰到一个老板在做明年公司的战略，请我帮他把关，出出主意。在他的计划中，我看到非常多新奇的创意和想法，在现有的3个产品之外，他还想再做两个新产品。在现有的渠道之外，他还要添加3个新渠道。在现有的客户群之外，他还想增加两个新客户群。在现有的几个销售模式之外，他还想再尝试一个新模式。


    当他描述他对未来创意的时候，我看到他陶醉在自己的梦想中，他的眼神里充满了对新年无限的期待。这是很多老板常常犯的毛病，稍微有几个小钱或者是原业务稳定盈利后，总是好大喜功，想要发展几个新业务。我感觉到，他希望从我这里得到对他一个人花费了大量心血做出来的计划的肯定和赞许。但我给他说明，非常抱歉，在你的计划里，我看到的是创新、创新、再创新，却没有看到一点点更现实的复制。


    一个真正聪明的老板，是只要找到一个赚钱的业务了，就会在这个业务上不断地深挖。


    其实一个年度计划里 80% 应该是复制，20% 才是创新。我问他：你总结过没有，在过去的一年里，你们什么地方是做得好的？在你的计划里，有没有把已经经过验证过的、赚钱的业务不断的复制、复制、再复制？他说这些他没有多想，因为感觉那些事情大家都已经知道，重复一个已经会做的事情对他来说没有什么挑战性，他作为老板首要任务是带领大家创新。


    不要图新鲜。把老业务做到极致，做到行业老大，做到垄断，就有足够多的利润让你爽了。创新的确重要的，没有创新，没有独一无二的追求，一个企业不可能走远。但只知道创新，不知道把成功的业务通过复制放大到无法再放大，这也是错的，而且这个错误可能是老板最容易犯的，同时也是最愚蠢的错误。


    为什么说这个错误愚蠢？我们都知道老熊掰棒子的故事，我们都在嘲笑老熊的愚蠢，但很多公司众多创新的命运不是和老熊掌中的棒子一样，被拿起又被扔掉了吗？


    一个企业只要有一个赚钱的主营业务就行了。把自己的人才、资源都投入到这个主营业务，经营好它。有一些企业的做法是复制别人的成功，你也可以骂他不道德，是抄袭，但别人依然是成功者。应不应该复制别人的成功是另外一个问题，但复制自己的成功是没有任何道德问题的。


    年底计划或预算的基础不应该是天马行空的创新，创新不是目的，复制成功才是目的。总结让复制成为可能，带领大家做好一年的总结，是年底时候比创新更重要的任务。只有总结好了，才能把过往大家费了九牛二虎之力取得的经验发扬光大，才能取得事半功倍的结果。


    - 对盈利模式的总结，会让你的企业有更强的核心竞争力；

    - 对组织方式的总结，会让你的员工更有战斗力；

    - 对产品的总结，会让你的销售大大提高成功率；

    - 对人事的总结，会帮助你大大提高员工的积极性；

    - 对客户关系的总结，会让你的经营更长久稳定。


    ## 8、不要被所谓的道德绑架


    每个人的潜意识都带有目的，区别在于目的是否清晰，实现目的的手段是否有效果。但是很多人羞于承认自己做事带有目的，比如交朋友这件事，大多数人交朋友的规则是，这个人和我聊得来，我们彼此相处也融洽，大家又是低头不见抬头见的，有时候也相互帮个忙，很多观点都差不多，于是就成朋友了。


    自己就以为自己交朋友是单纯的，是无目的的，然而事实上呢？你是希望闲的时候有人陪你聊天，希望做一辈子朋友，希望有个人能在你需要的时候借钱给你，希望……反正多了去了。但是，我们很多人不敢深思，不敢承认自己的目的，仿佛这是很不光彩的事情，就不道德了。再者，如果与一个人交朋友，目的没有达到，人的潜意识就会有很强烈的挫败感，自尊与自信都会受到沉重的打击。再一个，不愿意承认自己有目的，与自己的教育程度有关，同时也说明了自己迂腐。


    中国文化鼓励我们讲道德，但没有不允许我们带着目的做事，好像有目的性就不道德，就良心不安、人不单纯。其实，这跟道德无关。例如，如果在大街上碰到一个美女，你想要认识，但是人家“哼”了一声就走了，你就会难受，心里估计还能骂上几句脏话。仔细想想，如果你没有目的，你为啥会难受呢？我们说没有目的，不过是在自欺欺人，但这个道德的陷阱，只能骗骗自己，而美女是不相信的。美女其实知道你想干啥。这个时候，如果你想进步，那么就需要剖析下自己，到底是怎么回事？自己的目的是什么？不要活在与道德无关的陷阱中了。其实大家都是男人，目的是什么还用问吗？其实呢，有目的是很正常的，但是部分被道德局限了的人就是不屑于承认，或者说承认了就觉得自己是小人了，非要自己骗自己这样做才是个正人君子，从而失去很多机会。


    退一步讲，即便你是不想与交往的人发生深度关系，你依然是有目的，比如认识了某位美女，可以提高社会地位，你可以借助她的关系办成很多事情，可以认识某位名医，可以认识一些商人。事实上，无论你怎么辩解说“我是很单纯的，我是没目的的”，你都是有目的的。你不承认，但你的潜意识是承认的。因为一旦这个重要的目的没有达到，你的潜意识就会让你感到难过。


    其实，我们做的每件事都是有目的的。越是受教育程度高、越是有素质的人，越会把自己绑架到道德制高点上面，越是不肯承认自己做事有目的，不能直面自己的目的。相反，那些没受过教育的，没被洗过脑的人，保持了动物的本能，做事就懂得趋利避害。大街上拦着一个美女要电话号码的事情，受过高等教育的很多人都做不出来，但是染着黄毛的瘪皮们做得出来，为什么？因为他们有非常清晰的目的。于是，受到高等教育的人，与这些没被洗脑的人竞争，任何方面都会吃亏，因为他们总是给自己找不自在，做任何事情都被所谓的道德绑架，像有一只无形的手卡着他们的脖子，永远也不能用尽全力。


    《亮剑》里为什么楚云飞干不过李云龙？答案非常简单，楚云飞是科班出身，书读多了，被所谓的道德绑架了。而李云龙同志是本能性的竞争，楚云飞赖不过李云龙，就这么简单。


    书，我们必须读，但是要把自己的目的剖析清楚，不然后果是，小到交不到女朋友，大到亡国灭种。


    ## 9、生意人，守住法律底线去赚钱


    企业存在的基础与目的是什么？答案非常简单，企业存在的基础就是钱没花完，哪怕是风投或者是借来的钱。那么风投投给你钱，或者你借来的钱，是用来做慈善的吗？肯定不是，而是用来赚钱的。企业的目的必然是赚钱。现在有些成功的企业家，还有一些写书的人，喜欢误导大家，说企业的存在是为了解决就业问题，为社会做出贡献等等，这都是戴高帽的事情，或者说，企业的存在必然会解决部分就业问题，必然为社会做出贡献，但这不是目的，这仅仅是顺带的事情。


    如果企业不赚钱，没有利润，企业必死无疑，只是早死、晚死的问题。所以老板头脑要清醒，不可以被有些成功的企业家、写书的人带偏了，一开始，就定出了一个错误的目标。


    我以前有一个朋友，开了一个电脑店，就是闹不清楚做企业的目的，而把有些成功的人拿到嘴上说的做企业高大上的方针当成了真理，搞得自己狼狈不堪。这个家伙呢，人品很好，做朋友也够哥们，结果就是，我们这些好朋友找他买电脑，他从来都是一毛钱不赚。他那个电脑店，生意本来就不好，朋友介绍过来的朋友，他也不好意思赚钱，结果大家猜到了吧，他倒闭了。我一直劝他，朋友的钱为何不赚？生意就是生意，做企业必须赚钱，凡是偏离了这个目的，不管你的理由多么高大上，都只能说误而已。不可把高大上的理由当成生意的指导方针。


    其实，我再深入一点讲，做生意，连诚信都是伪装的，连对人们有好处都是伪装的。因为你不诚信，你对人们没好处，你就没钱赚。另外，网络游戏对青少年到底起到了正面作用，还是负面作用呢？聪明人已经知道答案了，我就不多说了，但这些企业都活得非常滋润，赚取了大量的暴利。


    所以我这里，只给出一个结论，企业存在的基础目的就是守住法律的底线，去盈利。凡是扯其他目的的人，都是做企业还没入门的人，或者是口是心非的人，或者是脑袋糊涂的人，这样的人来做企业，就会倒闭。


    ## 10、适应社会，而不是改变社会


    我们要适应社会而不是改变社会。如果李嘉诚也身无分文了，我们与他有什么区别呢？我想，李嘉诚一定会找出好的方法重新发展，其实李嘉诚本身也是从一个非常穷的人爬起来的。人与人的区别在于思维方式和内涵的不同，一个问题你想不通，解决不了，而别人跟你一样的资源，但是别人换一种思维方式，或者是有经验，就能想通，想透彻，解决问题。


    从这个角度讲，人只要不断的学习成功人士的思维方式、经验、精神，就会变得越来越成功。人在社会首先要了解自己，了解社会，适者生存就是自己要适应社会，而不是社会适应自己。因为，一个人要改变社会太难，就是光绪皇帝也没做到，社会是许多人用一段时间改变的。改变可以是好的方向，也可能是坏的方向。


    聪明的人从来不试图去改变社会，所以取势、明道、优术。取势，排在第一位，就是要顺应时代的发展。看现在社会上呼风唤雨的大企业，陈天桥顺应了游戏，马云顺应了电子商务。该下海经商当倒爷的时候，就去倒；该做房地产的那几年，就去干建材；该做网商的，就去做网商。现在我认为是到了玩垂直电商、社群电商，和传统企业互联网化的时代了。取好这个势，自然就发家致富。


    还有一个势是文化产业、精神产业也马上就蓬勃发展了，大家也可以参与进来。


    ## 11、赚钱这件事根本不是计划出来的


    为什么很多读书成绩好的人都去打工了？


    为什么一直在思考人生方向的人，基本上都没啥出息？


    而那些街头混混却成了老板，那些看似没什么远见的人，却拥有不错的事业？其实道理很简单，因为街头混混的口号就是：先干一票，弄点吃的再说。典型的先生存下来，然后再做打算的理念。


    其实有经验的人明白，我们做计划，想策略，然后拿到市场上去用，根本就行不通，因为市场变化太快。经常出现计划的是A，做着做着就变成了B，以为能在C处赚钱，结果是在D处发家。所以，赚钱这件事根本不是计划出来的，而读书成绩优异的人、成天思考人生方向的人，总是想有一个完美的计划策略去做事，这就导致这些人做不了老板。


    我招聘的时候，想选一些优秀的人来带领项目组工作，最怕碰到一些高材生问计划，问策略。因为赚钱这个事情，就没有具体的套路，我要的是给他一个大方向，他就直接去干且能赚钱的人才。我不需要一个只会按照计划书照本宣科的执行者来带领团队。我发现很多高端的人才根本就理解不了创业精神。


    老板只想解决眼前的生存问题，没有功夫去想人生方向，也没有时间去做什么计划，通常更没有时间去思考：谁对不起谁，工作有没有不愉快，累不累等问题。我只有一个想法，赚到钱，活下去。走一步，看一步。后来当我读邓小平文选的时候，我忽然发现，伟大的邓公也是这样一个思路，就是摸着石头过河。做创造性的工作，是根本不用计划的，就是走一步，才看下一步，看到了一步，再走一步。


    这是成功创业的思维模式，希望大家能理解。


    ## 12、和珅的服务精神


    其实，做企业就是做服务，你能不能服务好你的“主子”，也就是你的顾客，如果你能完完全全的服务好你的“主子”，那么，你就能得到“主子”的奖励，在市场上生存下去。


    和珅这个人，在历史上是被批判的，但他能做到乾隆皇帝的心腹，绝非等闲之辈。他从 26 岁发迹，到 32 岁，居吏部尚书，历任几十年部门一把手。靠的是什么？首先，和珅是一个非常有学问的人，懂蒙古语、藏语，但是没有考上科举，靠着一个机会，当了皇家仪仗队的一个队员。有一天，乾隆皇帝坐在车中，在外面游览春光，有个侍卫急匆匆的跑到轿子前，说云南急报，一个罪犯越境跑到缅甸去了。当时乾隆很生气，就说了《论语》中的一句话：“虎兕出于柙，龟玉毁于椟中，是谁之过欤？”这话是什么意思呢？就是问这个事情，该谁负责任。由于周围都是粗人，没人听得懂，而和珅非常好学，听懂了，就回了一句：“典守者不能辞其责耳！”意思是说，是守卫的责任！乾隆就回过头看了这个仪仗队员和珅一眼，这就是和珅发迹的开始。


    这说明什么？说明和珅虽然地位低下，但一直在准备，逮着机会就能上，而其他人由于没有准备，机会放到面前，也抓不住。这就是一种创业精神，一直默默的在准备。中国正在从制造业大国转型向服务业大国，要在这个时代获得成功，就要成为一个服务型人才，就不仅仅是满足顾客需求这么简单，而是要超额完成顾客的需求。用苹果公司的话说，就是苹果公司不是在追求客户的满意度，而是在追求客户的尖叫度，打造自己感动顾客的能力。


    说回和珅，乾隆皇帝下江南，他不告诉和珅是走水路，还是走旱路，和珅就得猜测乾隆的喜好。他知道乾隆喜欢写诗，和珅就跟公主说：皇上现在的诗写得越来越好了，我特别喜欢看，以后皇上写了什么诗，您给我拿过来，我好好学学。

