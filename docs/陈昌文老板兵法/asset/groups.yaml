    ## 第七章 团队的管理


    故善战者，求之于势，不责于人，故能择人而任势。——《孙子兵法》


    企业是一个生态系统，尽快让技能互补、性格互补的人相互配合，才能发展壮大。——陈昌文


    ### 1、做自己喜欢的事情，找员工干自己不喜欢的事情


    我们要做一个事业，总是会有很多事情要去做。总有些事情，我们不愿意做，或者说不喜欢，但因为责任、工作的需要不得不做。这样的话，人就会心力交瘁。所以，我的策略是只要是自己不愿意做的事情，我统统交给员工做，我自己呢，只做自己喜欢做的事情。为什么？因为，人做自己喜欢做的事情感觉不到累。比如，你喜欢唱歌，那你在KTV里面唱一个下午，吃了晚饭，还能继续唱到半夜。比如有些人喜欢打麻将，2天2夜不下麻将桌，还想继续。但是如果碰到不喜欢做的事情，2个小时，人就受不了了。


    在工作中也是这样。工作中，有些事情我们非常喜欢，做起来也得心应手。那么喜欢干的工作，我们就亲自动手去干，干起来不会疲惫，而且还会让自己进一步的喜欢上这个工作，练习好这方面的技能。最终可以把这个自己喜欢的工作，做到极致，做到别人难以达到的高度。长此以往，我们喜欢的工作就会成为我们的核心竞争力。一旦工作的时候，发现我们不喜欢手上的工作，千万别坚持做下去，也不用说什么责任心之类的，赶快把这个工作交给员工做，不断的给自己做减法。《道德经》上有句话：为道日损，损之又损，以至于无为。我想，用来解释为什么这个套路可以让人越来越优秀，就是因为我们做事近道了。


    一个人靠坚持、靠责任心来跟我竞争，而我是靠快乐、靠兴趣、靠喜欢，显然，他是竞争不过我的。这完全不是一个重量级的比拼。这一招，当你的企业人数增加的时候，你可以把这个观念教给你的核心领导层，让你的核心领导层都去发挥自己的兴趣特长。当然，人数少的时候，你一个人用就行了。


    一个人的竞争力，取决于这个人脑袋里学了什么先进的观念。如同一个电脑可以玩什么游戏，取决于电脑里装了什么游戏程序一样，各位可以思考一下是不是这样。


    ### 2、老板需要多关注企业内部还是外部


    经验不足的老板，总是以为组织内部的事情才是与他关系最密切的。就算他要关注企业外部的事情，也是通过下属给的材料、报告之类的东西来认识企业外部。而不幸的是，报告都是经过下属的主观加工、高度抽象的材料，所以，如果老板不亲自到市场一线去走动，仅仅靠在网上搜索、靠同事给的报告、材料，其实其很难得到真实的市场情况。


    马云刚创业的视频资料不知道大家有没有人看过，马云同志是坐着公交车，亲自去跑市场的；我们大家熟悉的做脑白金的史玉柱，自己专门到农村去调研，找农民聊天，揣摩他们的心思；华为的任正非创业初期，也是自己背着交换机会去敲客户的门；顺丰快递的王卫也是自己去送快递。


    为什么成功的老板都到市场一线去干活，不坐在家里遥控下属？因为，企业内部是不会产生利润的。所有的利润来自于市场，利润来自于顾客，企业付出的一切成本与努力都必须通过顾客购买你的产品与服务，才能转化成利润与收入。在企业内部，只有人工与成本。一个企业，不是人越多越好，不是工作量越大越好，而是要工作量、人数越少、利润越高才好。人数越少，规模越小，内部工作越轻松，企业存在的理由就越充足。而企业存在的唯一理由，就是为市场提供良好的产品或者服务。


    现代社会，企业的竞争异常激烈，公司的每个人都应该关注市场，要不然，随着时间拉长，企业内会出现不懂市场的管理人员做决策、做业务，就会出现闭门造车的现象。有部分人，把自己大量的精力都投入到企业的内部，这是一个误区。企业的所有成就，来自于能对市场提供什么贡献。如果天天在企业内部做得很努力，也做得很好，但发现自己的企业生存得越来越吃力，利润越来越少，基本上就是犯了没有努力去观察市场，而只顾埋头在企业内部干活的错。


    我曾去过几个建材企业，这些企业还在用业务员跑业务，还在用电话营销的方式，努力的在线下跑业务和打电话，岂不知，现代社会已经是网络营销了。他们没有努力的盯着市场变化，只顾自己很努力的在企业内部干活，他们当然生存得越来越困难。


    ### 3、老板如何提高员工的士气


    一个团队的士气低落，没有精气神，是很难打胜仗的。如何提高团队的士气呢？在《孙子兵法》里，这叫“治气”，不仅要能治自己的气，还要能治敌人的气。把我们的士气搞得高高的，把敌人的士气搞得低低的。


    中国历史上，治气第一高手，是李世民。与窦建德之战，他3500人，窦建德十几万人，他生擒了窦建德，就完全是靠治气。


    李世民包围了王世充，窦建德来救。李世民收到消息，留4万人围王世充，自己带3500人来战窦建德，他飞马先抢占了她牢关，把窦建德挡在了关外。这时候呢，李世民的士兵们内心是恐惧的，再什么关也是3500人要打人家十几万人啊。李世民前脚占了虎牢关，窦建德大军后脚就到了。李世民衣不解甲，马不知鞍，即刻亲自带500兵马出战，趁窦建德立足未稳，先打一仗。当然是打胜了，占了便宜就走，回虎牢关，关门！那么打一仗干什么呢，就是治气。在我，士气大振，敌人没那么可怕；在敌，士气受挫，哎呀秦王真是战神啊，咱还真不一定赢得了他。李世民当然是聪明神武之人。


    我们老板能学到什么呢？就是要学会找机会赚小钱，赚点小钱虽然解决不了大问题，但是能提升团队的士气。大家有盼头，认为我们干得起来。假如你只知道谋划大钱，结果几个月都没赚到，团队成员必定士气低落，认为成功遥遥无期。李世民亲自带500兵马出战，打一个小胜仗，就是为了赚小钱，提升团队士气。


    西方将军中，最能治气的是拿破仑。我读《拿破仑》文集，文集中收录了他每一场战斗开始前，在战阵前的演说：“士兵们！”他一开始讲话，那一字一句，能让每一个士兵气血充盈、血脉贲张、气势如虹、遇神杀神、遇佛杀佛！儒家讲治气，是要控制自己；兵家讲治气，是要鼓舞他人。一个是自我修养，另一个是领导力。


    如果不能理解上面的，我再给大家一个简单的提升士气的方法，你作为领导者，如果不会演讲，不会谈梦想、谈战略，你就在日常生活工作中，表现得热火朝天、干劲十足，用手和脚去感染跟着你的人。


    大家看那些最牛的领导者的，往往都是身先士卒的，比如李世民，比如项羽皆是这样的人。


    ### 4、注意效率陷阱，忙碌却没有效果


    为什么现在很多人干活好像都很忙，而且效率很高的样子，但是却没效果。现代社会，竞争压力非常大，很多人看似拼命的赶时间，很忙碌的样子，几乎是抽不出来时间陪小孩、陪家人、散步。可是，他却没有什幺成绩，说直白一点，就是他赚到钱。也就是说，虽然忙碌，但却没有效果。现代社会，有很多技术的发明，都是为了节约时间。比如电话、电梯、电脑、火车、飞机，甚至是电动剃须刀、拉链。现代人虽然拥有很多节约时间的工具，可大家依然觉得时间不够用。理论上，拥有如此先进的技术，又如此的忙碌，大家应该都能干成很多事情。结果，我经常问那些20到30岁的人，说，你干了些什幺事情啊？往往他们茫然不知道怎幺回答我。好像根本就没有干什幺有用的事情一样，浑浑噩噩的就过去了。


    如果我们每天都记录一下，每个小时都干了什幺，晚上翻一翻，就会惊讶的发现，实际上很多人8小时的工作，拼命干2小时就干完了。


    每个人都在电脑上噼里啪啦的打字，拿起电话就打，但是一天过去了，好像又白忙了。没有什么效果。虽然所有的技术都让人们提高了办事的效率，但很少有人停下来想一想自己到底要去哪儿，到底要做什么。只是看着别人忙，也觉得自己该忙。为了比速度而比速度，为了效率而效率，最后，干了很多完全没必要干的事情。真正能产生生产力的事情反而没有干，这就是很多人碌碌无为的原因。


    我们在现实生活中，总能听到有人说自己很忙，很用心，见了客户，打了电话。可就是没看到效果，也没赚到啥钱。老板必须要避免这种情况的发生。这种情况的发生，一般是因为目标不清晰。目标不清晰的人看上去很忙，却像迷宫里的老鼠一样，窜来窜去，却永远也找不到出路。很多人在公司里忙，如果一考核，其实你会发现他真正做的有用的事情非常少。


    我们要做到有效果，而不是有效率。


    给大家四个建议：


    - 1、重视对别人的贡献，而不是自己做了什么。因为只要你真正意义上对别人做出了贡献。别人才会回馈你金钱，而你自己做了什么，其实跟别人无关。这一点区别非常重要，关系到我们能不能赚到钱。

    - 2、善于借用别人的长处来实现自己的目标，而不是自己去忙碌做事，这样既节约时间又有效果。

    - 3、每天都集中精力干少数重要的事情，也就是能产生效果的事情。

    - 4、必须时刻明白自己的目标，不做与目标无关的事情。


    其实，我们大多数人都以为时间是取之不尽，用之不竭的。今天过去了还有明天，明天过去了还有后天。但真实的情况是，对于大部分人来说，时间只有2万多天而已。如果一天是一块钱，你只有2万多块钱而已。所以我见到很多忙碌的人做事没有效果，就感觉很心疼。


    如果你不能区分效率与效果的关系，很快你就会发现，一辈子过完了，你干成的事情少得可怜。真正的幸福感，其实来自于你做成了几件事，这几件事对社会产生了什么样的贡献，最终反映出来的，就是社会回馈了你多少钱钱。回馈的钱钱越多，就代表你做的事情越有效果。你就会有幸福感，否则你就是忙碌而没有效果的，你不会感觉到幸福。


    一个人如果做了有效果的事情，那么他的记忆就会丰富多彩。如果没有效果，那么他的记忆就会单调、乏味，甚至记不清干了什么。所以我们不要弄得看似每天都很忙，很有效率，但不知道自己到底干了什么，成了一个做事没效果的人。这个非常重要，大家自己想想你做的事情是不是有效果，而不是一味的忙碌、提高效率。


    做公司以来，我最大的感悟就是坚持，然后不断地学习和读书，给团队成员做思想工作。坚持，这件事老生常谈，但还是很少有人做到。


    第一，你要坚持只做一个项目，一年不赚钱都不换，那么你就肯定能赚钱。可惜的是大部分人不赚钱，能坚持一个月就不错了。


    第二，你要敢于对任何新的方法进行尝试，也就是我们经常讲的战略上坚定，战术上灵活。某个方法会让你发财的，只要不断地尝试就能碰到，山重水复疑无路，柳暗花明又一村。你必须从一开始就告诉你的团队成员，有苦日子要过，让大家做好充分的心理准备，才能走得长远。


    作为团队老大，你将会在逆境当中安慰人，不过对于确实心理素质太差的人，就直接让他去打工吧。从某种角度来说，金钱只属于心理素质好的人。一个老板，必须善于学习，而且是疯狂的学习。我发现企业家、投资人，都是学习狂。其实赚钱就是你拥有了赚钱的知识与方法，你照着做就赚钱了。而这些知识并不是秘密，是可以通过不断学习，从书本上、从别的企业家、老板嘴里听到的。可以说，世界上最有价值的信息99%都是公开的，你要的答案，甚至都在网络上。可惜的是，只有极少的人能保持终身学习的态度。团队的成员也需要学习，最主要的学习是，老板每天给团队成员上的思想课。


    伟大的党最重视思想工作了。从小米步枪到建立新中国，我想做思想工作的政委书记们要记头等功。马云、任正非、柳传志都是做思想工作的高手。各位老板也学学。


    总结一下，我认为当老板，最主要的就是，


    - 第一，坚持下去，永不放弃。

    - 第二，不断地学习，知识就是力量。

    - 第三，天天都要给团队成员做思想工作。


    ### 6、高明的管理一定是用企业文化管理


    什么是高明的管理？索尼公司前常务董事天外何朗认为绩效主义毁了索尼公司。自 2008 财年起，索尼的业绩几乎连续 7 年亏损。而 2014 财年预亏损额 2300
    亿日元（约合 131 亿元人民币），比 2013 年度足足翻了一番。索尼 CEO 平井一夫极力推行转型调整，但成绩单不足人意。索尼在 2003 年一个季度就出现约
    1000 亿日元的亏损，从此走向滑坡。


    天外同期认为，首先，激情集团不存在了，而只有不知疲倦、全身心投入开发的集体，才能接连不断地开发出具有独创性的产品。其次，挑战精神消失了，从 1995 年左右开始，索尼公司逐渐实行绩效主义，成立了专门机构，制定非常详细的评价标准，并根据对每个人的评价确定报酬。索尼职工好像没有了自发的动机。而索尼在井深时代的口头禅是：工作的报酬是工作。最后，团队精神消失了。干别人不干的事情，这种追求独立开发的精神，给索尼员工带来荣誉感，他们都为自已是尖端企业的一员而感到骄傲。绩效主义让索尼员工失去了这一团队精神。


    索尼从创新先锋沦为落伍者，绩效主义的问题在于过度追求量化。比如把各种工作要素量化，也企图把人的能力量化，以此做出客观、公正的评价。但组织的管理目标总不会那么简单。有人认为绩效主义毁了索尼，但却造就了三星，所以绩效主义关键看怎么用。但从
    2014 年度的电子消费目品市场看，三星也出现类似的问题。绩效主义对从来不做绩效考核的企业是必要的，完全绩效导向在长期状况下则一定存在问题。我的经验是对每个人的严格绩效考核，会让员工只为了完成绩效努力，至于公司的创新精神、团队精神和工作激情都会忘得干干净净，这样的企业必将落伍。


    当然企业有底线！就是必须完成一定的绩效，企业才能存活下去。


    我的做法是，不断的给员工强调价值观、梦想、责任，当员工认同企业的价值观，有梦想、有责任的时候，业绩也差不到哪里去。


    从某种意义上来讲，我认为伟大的共产党就是价值观、梦想、责任做得好；而蒋介石搞的是绩效考核，所以会落伍，会失败。


    一个企业的管理理念太现实了，是做不好的。必须要用企业文化去管理企业。所以，高明的管理一定是用企业文化管理，绩效考核只是辅助手段，把实在不合格的开除掉就行了。


    ### 7、老板不操心了，企业就赚钱了


    做老板，不操心了，企业就赚钱了！


    我们这个世界很有意思，你追钱，是追不到钱的；你不追钱，只须把事情做好，反而赚钱会很容易。举个例子，一个医生给自己的孩子动手术，他非常想做好这个手术，可惜他越是想做好，越操心。他就越不敢下手，药也配不好。但是他敢给别的孩子做手术，就算看到别的孩子哭着挣扎，他也敢下手，而自己的孩子一哭、一闹，他的手就要打颤。


    这是为什么呢？就是因为医生操心自己的孩子，不操心别人的孩子。


    我们做企业也一样，如果你操心自己的企业，那么你就不知道如何下手了。最明显的就是如果你要做一个广告，要花500万的预算，你自己动手，就是怎么也舍不得花这个钱，怎么花都别扭，而你把这笔钱交给职业经理人，他怎么花都能花完，心理一点负担都没有。为什么？还是因为你操心自己的企业，而职业经理人不操心你的企业。其实，操心自己的企业，只是小智慧，最多能做中小型规模的企业。


    真正的大企业家，是不操心自己的企业的，是设计一个制度，让别人来操心自己的企业。想做大，你要告诉团队，这个企业不是你一个人的，不应该由你一个人操心。让所有的人来操心，那么你就不用操心了，企业就做得大了。


    我们看到马云、任正非这些大企业家，经常都是在全球各地到处跑，没有多少时间在公司，可是公司做得非常大，就是由于自己不操心企业，用一套机制让企业里的人操心。


    我认识的一个老板，这个老板做得非常小，我给他分析了一下，就是因为他 在企业里面什么都管。心都操碎了，结果下面的人都成了执行人，不动脑子了，团队智慧根本没有发挥出来。而他自己呢？由于陷在了具体的业务中，没时间去见多识广。但如果他不是这样激进的操心这个企业，而是放松的经营自己的企业，经常出去看看，出去与同行交流一下经验，毫无悬念，他的企业会发展得更好。


    所以，老板不操心企业了，企业就赚钱了。当然还有后半句，老板要设计一个制度来让大家操心，而不是自己在那里操心，团队完全成了执行人了。一个人操心，肯定没有一群人操心厉害。老板操心了，团队就不操心。团队操心了，老板就不用操心了。


    怎么选择？大家自己看着办。


    ### 8、公司里的人力资源管理


    任何公司都应该有考评制度，让 20% 的优秀者得到物资奖励与精神奖励，最差的 10% 应该被淘汰掉，并且不断的招聘新的优秀的人才加盟公司。公司的奖励，不能只有精神奖励，没有金钱奖励。任何人都是喜欢钱的，不给钱，只谈理想，只能说明老板幼稚。不给金钱奖励，最优秀的人就会离开你的公司，最后，你的公司只能剩下一帮平庸的人。


    公司要鼓励员工加班加点的工作，优秀的人是没有终点的，也没有下班时间的，他们都是一直在工作。优秀的人，是不需要休息的。那些工作不出色的人，成天都想着下班，想着放假，就如同我们读书的时候，成绩差的人，一直在想什么时候放学，什么时候放假。成绩好的，放学的时候也在学习，放假的时候也在学习。


    老板对任何人的考核都应该简单明了；不可采用耗费时间、言之无物的会议、文件来对公司的人员进行评价。虚伪的老板，是经营不好人心的。优秀的人不喜欢跟虚伪的老板在一起，只有那些平庸的人，才跟这种老板一起虚伪。因为，他们在其他地方也找不到好工作，就在你这里混工资吧。


    虚伪的老板，以为自己照顾到了大多数人，实则是害人害己。评价员工的标准应该做到最大程度的量化。公司的规章制度也应该有个基本的标准。只有这样，你才知道到底谁做得好，不可以完全凭感觉管理公司。每天应该让员工交需要完成的工作计划，每天也要做出总结。必须采用目标管理，必须完成一定的任务，杜绝滥竽充数的人。


    关心公司的人事工作，可以说公司的人力资源部门应该是公司最重要的部门，人的问题解决不好，其他的问题就解决不好。中国很多企业都不怎么重视人力资源部门，这是一个误区。做为老板，我们要雇佣那些我们喜欢的人，毕竟，我们每天都要与这些人一起工作。如果不开心，工作就干不好。当然，相应的人员必须具备相应的工作经历，能够保质保量完成工作任务。如果工作做不好，你再喜欢他，也要解雇。

    '
