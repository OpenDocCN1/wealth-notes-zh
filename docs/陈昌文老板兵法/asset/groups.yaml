    # 7、把定义卖給对的人


    一切事物都是相互依存的，没有任何一样东西能独立存在。有穷人就必须有富人；有男人就必须有女人；有老板就必须有员工。更深人的讲，老板必须得员工好，你的企业才能发展壮大，老板本身才会好。企图只让自己好的老板，员工是不会让你得逞的。


    一切事物都是相互依存的，没有真正的独立。三鹿奶粉用了三聚氰胺害了很多婴儿，所以三鹿就倒闭了。凡是伟大的企业，都是真心实意帮助顾客。凡是圣人都是殚心尽力为人类造福的。整个宇宙都是无常变幻的，王座不可能永恒。道德的定义也随着时代的精神一直在变幻。'
