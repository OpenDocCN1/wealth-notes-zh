    ## 后记


    ## 第一章 社会的本质


    孙子曰: 兵者, 国之大事, 死生之地, 存亡之道, 不可不察也。——《孙子兵法》


    大自然的进化和平衡规律就是弱肉强食，竞争的本质就是一消一长，一存一亡。只要你理解了这个世界，你就会找到很多可以改变这个机会。——陈昌文


    ### 1、人就是个生物机器，输入什么，就输出什么


    人就是个生物机器，输入什么，就输出什么。我们眼睛里看到的，都是贫穷的人、贫穷的房子，那么这些信息输入到我们的脑袋里，我们就自然变得贫穷了。


    人一辈子没有出息，往往是因为身边成功的朋友太少。而成功的人，都在环境好的地方。如果你的命不好，改变命运的唯一办法是“找命好的人和他交朋友”，跟着他们，他们说话、行为的方式就会自动被你收录，潜移默化地影响着你，你的命就会好。加入他从事的事业，同流才能交流，交流才能交心，交心才能交易，交易才会改变命运。


    社会出现阶层的原因是人的智力、观念、思想造成的，只要人的智力、观念、思想不同，就会产生不同的阶层。地位不平等、收入不平等的根本原因，是因为人的智力不平等，人的智力不一样。而智力是由遗传和环境造成的。遗传基因我们无法控制，管不了，没办法，就不管这个遗传了，因为你想管也没用，医学手段目前还做不到。但我们可以控制自己所处的环境。


    万丈红尘三杯酒，千秋大业一壶茶。这壶茶该和谁喝？这杯酒该让谁喝？跟着领导混，当官是迟早的事情；跟着富翁混，发财是迟早的事情；进入老板的圈子，慢慢自己也会变成老板。如果进入穷人的圈子，慢慢自己也会贫穷。


    不同的社会阶层，从自身所处的不同阶层接受的环境信息刺激是不同的。


    举个例子，老总每天上班遇到的事情，跟清洁工每天上班遇到的事情，是完全不同的。不同的环境决定了你会遇到不同的事情和问题，最终训练了不同的人出来。所以我们的工作会决定我们未来的前途，每个人只是受环境信息刺激的产物，我们每个人的意识和观念，都是自身所处的环境的产物。站在这个角度说，你坚持自己的观点毫无价值，因为你的观念只是你的环境的产物。


    上海滩大亨杜月笙能发迹，他不进入黄家大院的厨房去烧火，他不跟着黄金荣混就不可能。所以，一生中选择与谁合作，怎么合作，需要技巧和方法。见高人不交，见高师不拜，人生遗憾也。


    乞丐和富豪的观念不同、想法不同，仅仅是因为乞丐和富豪生活、工作环境的不同造成的。如果你把一个乞丐放到富豪的位置上，一开始乞丐狗屁不通，可能造成很多损失，但不需要多久，比如十年八年，这个乞丐就会被富豪的环境训练成一个合格的富豪。因为成功就是学习间接经验，并且直接去试错的过程。试错过程中的成败得失，就是直接经验的来源，这个环节是省略不掉的。没有直接试错的经验，没有亏损、失败过，全靠学习书本知识和别人的经验，这样的人就是赵括，必败无疑。


    再比如说，为什么社会高等阶层，就好比戏文里讲的，皇帝都是金口玉言，一言既出，驷马难追？因为一个人讲信用，遵守诺言，言而有信，并不是这个人的道德品质很好，不是皇帝人品好，原因是信用、遵守诺言是社会上层统治阶级统治和管理用的工具，也就是说，言而有信是当皇帝的工具和手段。


    如果当官的、当皇帝的、当老大的说话不算数，随便反悔，部下就散伙了，到时候皇帝也当不成了，这是利害关系决定的，可不是皇帝人品好。当老大的说什么就是什么，说到做到，言行一致，别人才会服从他的指挥，他才能当老大。随便撒谎骗人，说话不算数，耍无赖的人，没有信用。他说什么，没人听，所以干什么都会失败。


    社会底层老百姓认识不到这一点，所以随便为了一点小利益，就可以不讲信用。既然认识不到信用的价值，随意违背承诺，他们也就不会有信用。没有信用就无法获得别人的支持和合作，也指挥不动别人。指挥不动别人的人就没有权力，没权的人当然无法调动社会资源，让别人支持自己，最后就会干什么都没没人支持。缺乏别人的合作，导致失败，成为社会竞争的失败者。


    为什么有的人穷？有的人富？这就是原因之一，人的命运就是这样决定的。所以，成为富有的人，首先要有诚信，成为一个讲信用的人，你才会有调动资源或者与人合作的信用资本。

