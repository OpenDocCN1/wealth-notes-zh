    古代一个男人可以娶好几个老婆，现在中国实行的是一夫一妻制。做为商人，必须与时俱进，跟着新科技奔跑，方能赚取巨额财富。


    蛋如果煮熟，你就不能改变什么了，任何事情都有个时间限制，人生最要紧的是踏准节拍，该结婚必须结婚，该恋爱必须恋爱。每段关系最终都会结束，天下没有不散的筵席。但我们在有关系的时候，要尽情去演戏。没有天长地久，只有尽情演戏的人才不会留下遗憾。人生就是演戏，如果你想活得久一点，你可以选择不抽烟、多运动。如果你想多赚钱，你就开始学习财务知识、创业知识、企业管理知识，并且去实践。赶在蛋已煮熟之前行动。


    对某些人痛苦的定义，对其他人却是快乐的，商人就是能靠概念赚钱的人，靠定义赚钱的人。送礼就送脑白金，对有些人来讲是弱智的；对有些人来讲，却是救命稻草。你没发财，只是你没把定义卖给对的人。'
