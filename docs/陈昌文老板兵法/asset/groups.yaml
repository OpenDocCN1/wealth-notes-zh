    # 14、如何让自己成为一个博大精深的人


    有些人说现在没人读书了，其实是他不读书，他自己认为读书没用了。如果你读书，你会发现周围好多人在读书。如同有些人说赚钱难，其实是你赚钱难，如果你进入一个赚钱的圈子，你会发现，赚钱的人很多而且也不难。


    学习，是一种拼图游戏，是一种心理学现象。首先，你得找到一门有用的学问、知识，我说的有用就是能赚钱的学问知识，然后去模仿，去记忆。模仿多了，记忆多了，就产生是一种“孕妇效应”，就是肚子会越来越大。处处留心皆学问，搜尽奇峰打草稿，就是看到一山一水、一鸟一草、一本书、一个理论，都想着把它卖出去，变成钱，都想知道如何'
  - '[PAGE 170]


    做市场推广？哪里有客户？怎么做包装？无时无刻不是学问，无时无刻不在想变现，我脑袋里随时随地都是金钱、都是投资、都是管理、都是琢磨员工，如何让员工产生利润。


    无人无物不是我师，比如你新招聘一个员工，你不要以为他没本事，你跟他交流，就算他真没本事，他也会启发你的思维。你心里有一个赚钱的理念、投资的理念，有一个主线，有纲有目，有一张吸取知识的大网，你遇到的所有相关的信息，都会往你这张网上撞，全部一网打尽！时间长了，自然比普通人厉害，自然博大精深。


