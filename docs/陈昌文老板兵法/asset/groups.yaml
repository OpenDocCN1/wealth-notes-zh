    这种做生意的逻辑是大部分人的逻辑，也是非常错误的逻辑。正确的逻辑是：先搞广告创意，再根据广告创意做产品包装，也就是先找到顾客购买你这个产品的理由，找到客户购买理由后，再根据客户购买理由去开发产品、制造产品。这样搞出来的产品，水到渠成就能卖出去。表面上看，顾客是买产品的，真实的情况是，顾客是看到广告才决定买你的产品的。广告是顾客购买你产品的理由。也就是说，做一个业务，广告是核心，研发是为了广告服务，产品也是为了广告服务，包装也是为了广告服务。


    # 什么决定需求？


    老板要找到我们卖的东西有什么价值。价值是由人们的需求决定的。道理很简单，人们不需要你这个东西，你这个东西就毫无价值；人们非非常非常急切的需要你这个东西，你这个东西就非常有价值。我们应该卖什么产品？做什么服务？明显是人们非常非常需求的东西！


    那么，什么决定需求呢？思想、观念决定需求！


    通俗点讲就是人的想法决定需求，人的想法千奇百怪，所以世界上的商品千奇百怪。连火星上的土地都卖出去了。那么，又是什么决定你的观念呢？又是什么决定你的想法呢？你接受的信息，决定你的观念。'
  - '[PAGE 289]


    社会环境，决定你的观念。如果你生在温州商人家里，你就自然而然想要当老板。你只是父母遗传基因和自身环境的综合产物，你的观念来自你所处的环境，一定要清醒的认识到这一点。你自己是没有观念的。你只是一个机器人而已。你的想法与观念，甚至心理需求，仅仅是你的基因与你的社会环境编写的程序而已。


    遗传基因的核心是遗传信息，它决定你的硬件组成部分是什么，它决定组成你躯体的硬件性能如何。比如，有科学研究表明，人的智商跟遗传有很强的关系。环境的作用，主要价值也是信息，因为我们每个人接受的信息都是从自身环境来的。所以身处什么环境，往往决定你的命运。


    一个聪明人，必须付出代价，把自己所处的环境打造好。打造自己所处的环境，就是打造自己的命运。当然了，遗传信息很重要，比如那些天生智力残疾的痴呆症、傻子、疯子之类的，就是遗传基因出了问题，好比电脑某个电路板或者
    CPU 损坏了，导致根本无法使用。


    人们有什么观念，完全来自自身所处的环境，人们就是自身所处环境的产物。所以，你只要天天盯著一群人做营销，灌输给他们需求你产品的观念，塑造消费环境，或者帮他们找消费环境，他们必定会买单。人本来就是环境的产物，环境塑造人。如果你把人假设成一台高性能的电脑，那么，人就是获取信息和处理信息，并输出信息的机器。这台机器做什么动作，就在于你给他什么信息。也就是说，一个人认为什么有价值，跟他的价值观，也就是我们通常所说的观念密不可分。


    有什么观念，就有什么需求。有什么需求，什么就是有价值的。理'
  - '[PAGE 290]


    解了这个东西，你应该就明白了，只要你能塑造人的观念，改变人的思想，那么你就能卖出去一切。那些时尚代言人，其实就是在塑造人们的观念、思想，比如什么韩流、日流穿衣风。


    营销，最重要的是塑造人们的观念。品牌营销、奢侈品营销都是从这一点着手的。其实最早的时候，经济学是心理学家业余的时候专研的，后来就有了经济学这门课程。


    # ## 6、给产品取名字的重要性，做好标题党


    利用产品名字，把营销玩到人们的潜意识里去。


    我们大家使用的词语本身是没有任何含义的，含义不是在词语本身，而在于使用这些词语的主体。文字本身仅仅是个符号而已。打个比喻，糖罐在放糖之前，是个空罐。同理，词语在人们使用并赋予它含义之前，是没有含义的。你如果在一只漏斗里倒糖，糖是存不住的。同理，给一个靠不住的词语添加含义，结果也是存不住的。要明确表达你的含义，你最好换一个靠得住的词语。


    比如：大众汽车，这个词语包含不了高档豪华汽车的概念。如果你想卖高价，那么你就必须得换个糖罐。保时捷这个词更适合高档车这'
  - '[PAGE 291]


    个概念。这个地方，就有一个赚钱的密码。其实，大众汽车的工厂不见得就比保时捷的工厂落后，所以，你在大众汽车工厂里生产的汽车，也可以叫保时捷，从而卖到高价。


    这个概念变通一下，大家就可以拿去卖自己的产品或者服务了。我们要善于利用历史上已经被塑造好了的词语、文字，借力打入人们的潜意识中去。中国古代有汗血宝马，宝马这个词语就被宝马汽车公司利用了。在历史上已经被塑造好了的词语、文字可以快速打入人们的潜意识中。


    阿里巴巴、淘宝网，都是利用人们心中已经塑造好的词语来做营销的典型代表。选择好了词语、文字、名字，连广告费都能节约很多。每一项产品或者服务，都是带着包装的商品。概念就是产品、服务的包装，也就是说，你必须得先把概念卖出去。人们通过你的词语、文字，感性的认识到你的商品，进而在他心中留下印象，然后他才会购买。这个概念玩好了，你就能赚大钱。


    词语、文字是触发器，他能触发人类心智中的含义。当然一个精明的人，你是营销不了他的，因为你说这是悍马，他就不认为你这个车是悍马，他能区别出来概念与真实的情况。这种人不管你怎么给他概念，他心里都跟明镜似的，不会上你的当。但是恭喜大家，这种人毕竟是少数，大部分人都是可以被销售的。我称精明的人为正常人，称可以被销售的人为不正常的人，这两种人有什么区别呢？可以被销售的人是企图让现实世界适应自己心智想法的人；不可被销售的人，则不断的分析现实世界，使自己的想法去适应现实世界。但这样做很累，让现实去适应自己的观'
  - '[PAGE 292]


    点要轻松得多。所以，可以被营销的人总是接受与自己观点相近的专家的意见，他们不会去关心事实的真相。这就是为什么很多广告里都有专家形象的人出现，都有明星代言的情况。这样做，销量就会上升，因为不思考的人多，概念就被卖出去了。


    能被营销的人，潜意识认为一辆车叫做悍马汽车，比它叫乌龟汽车更加的帅气、脾气野性、跑得更快。所以，如果你卖汽车，你的汽车叫大众汽车，你想要卖高价就不可能。凡是能卖高价的汽车，总是要弄一个高贵的词语、名字，先把概念卖出去。**真正的赚钱利器，就是利用文字、词语，卖概念。**


    在这个注意力稀缺的年代，我们要做好标题党。取名字非常重要，好的名字能直接刻入消费者的脑袋里去。一个名字如果不上口，不容易记忆，往往要花费几十倍的广告力度，才能达到让人记得住的效果。虽然，不是取好了名字，产品就成功了，但是这是核心的一环。


    凡是做得好的产品，大多数名字都取得不错。我讲每一节课的时候，其实每一小节，都是花了点心思去取名字的。我看到有些人的节目的名字真是惨不忍睹，更有的人就是用第一集、第二集这样的方式来取名字，显然是不能吸引人的眼球的。在这个注意力非常稀缺的年代，好的名字、好的标题都是非常重要的。但是也有部分名字取不好的产品，也做得很好。基本就是靠时间长、做品牌，靠广告狂轰滥炸了。'
  - '[PAGE 293]


    产品定位很重要。


    有人讲，产品的名字就像钩子，把品牌挂在潜在客户心智中的产品阶梯上。因此，在给产品取名时，一定要先给产品做好定位，明确产品消费目标群体，才能取一个更有利、更有效的名字。


    卖给儿童与卖给成年人的东西，名字命名肯定是有区别的。比如你把成年人的服装命个名 Hello kitty，我估计这个销量就要下跌。


    巧妙利用产品本质或性能。


    有些产品，其本身的性能或材料就是卖点。就拿食品来说，如果是用玉米提炼的成分做的糖，尽管就叫玉米糖，也要比取什么花里胡哨、故弄玄虚、让人摸不着头脑的诸如右旋糖、高果糖等名字更加吸引人。


    针对中国人的产品，要注意文化差异和民族习俗。针对不同的消费群体，在为产品取名时，就要注意充分考察消费人群的文化背景、宗教信仰和民族习俗。比如高端汽车品牌宝马、奔驰等，其中文译名就充分考虑了中国人的文化背景和吉祥追求理念，并将中国古典文化和中国人追求吉祥的信仰巧妙地融合，不可不说绝妙。


    我们给产品或给文章命名，都要求力抓住人的眼球，把产品、标题刻进人的脑子里。一个名字要融入你的产品定位，针对的是什么用户群，要表达出你的行业本质。只有消费者记住你了，买单的几率才会增加。产品名字要易于传播，我们的思想宣传必须是人民群众喜欢的。


    凡是标新立异、凸显自己创意的人，都没什么前途，而且还要能让最无知的人也能一听就明白。做任何事，都要大众化。大众化，才有群'
  md: '

    ## 1、什么是象征性消费


    什么是丑，知道什么是高大上，什么是矮低俗……这些观念，它不是你生下来就具有的，不是你的生物属性，它实际上是你身边的人灌输给你的。我们就可以看出，买一件衣服，生物需求只占很小的比重，社会需求占大头。以一件售价1000元的衣服来说，它满足你生物需求的那一部分价值，可能还不到50元。这个社会需求，本质是要得到他人的认可。衣服穿给谁看？穿给别人看。


    有人说，我是穿给自己看的！其实啊，你生在人类社会，你还有自己吗？你的观念、你的想法，都是自然属性和社会属性共同作用的结果。你看见老太太摔倒，你就去扶，你以为那是你本能的想法？社会需求的本身，就带着一种象征性的意义和价值；就是一种符号、标签。标示着你的立场，标示着你属于不同阵营。人活在社会中，必须有立场，必然有立场，除非你脱离社会。但今天谁能脱离社会？谁能不和其他人接触？不能，谁都不能。就算去当和尚，你得下山来买米买盐啊。更何况出家人本身就是一种立场。


    只要你处于某个立场，你就得象征性的消费。绝大多数情况，你感觉不到被迫，会以为这是自己自然的选择，也分不清楚哪些消费是象征性的，但是极端情况，你可以察觉到。比如买车，日本车有什么不好？没什么不好。你本身不讨厌日本车，也很清楚两国贸易对大家都有好处，也很清楚“敌人和朋友”是一枚硬币的两面。某些人和你是敌人，但是某些方面同时是你的朋友；某些人和你是朋友，但在某些方面却又是你的敌人。道理都懂，但是，你身边的朋友都不买日本车，你为了避免和他们发生争执和矛盾，也为了避免他们疏远你，你也只好跟着不买。


    这种情况下，你会感觉到有一点被强迫。但是大多数情况下，你察觉不到，比如什么是美，什么是高大上，什么是有气质，什么是范儿。你有你的一套理解，但是你的这一套理解，不是天上掉下来的，它是你身边的人、社会灌输给你的。这些东西决定着你的选择，让你自觉自愿的选择了某种象征性消费，让你隶属于某个立场。当然应当指出，这种社会需求不是没有现实意义的，比如你开辆好车，出去交际、谈业务容易些。这种标签（高富帅，成功人士），让你更容易获得和你处于同一个立场的人的认可，更容易获得社会资源（例如人脉关系）。


    但是整个决策过程，都在你的潜意识中完成了，很少有人会认识到：自己喜欢宝马、奔驰、奥迪，不喜欢本田、丰田、马自达是为什么。他们不知道不要紧，我们做为商人知道就行了，就像病人不知道药物原理不要紧，医生知道就行了。


    现代营销走向了潜营销（《陈昌文方法 72 大营销系统》中的一个营销系统）之路，所以我们选择一个群体，通过宣传潜移默化的影响他们，让他们认为某种东西具有“标签”的意义。典型的
    60,70 年代的毛主席像章，你能不买吗？这个东西，象征性太强，一眼就能看出来。其他产品的象征性不强，但并不表示没有。


    任何产品，都必然有社会价值，对应着一种社会属性，一种立场。现代营销学就是要研究如何卖社会属性，研究卖立场，这也是为什么自媒体可以赚钱，社交网络营销为什么可以赚钱的原因。


    随着时代的发展，人们的社会需求会远远大于生物需求，而赚钱，就要满足人的社会需求，所以，现代营销学要研究人的心，也就走向了心理学之路。


    ## 2、生意人是见啥卖啥，普通人是见啥买啥


    在现代社会经济，我们活一辈子到底是为了啥呢？我总结了，第一，是金钱；第二，是感情。而金钱能解决99%的问题。就算是感情问题，金钱也能解决大部分。


    那么我们到底怎么赚钱？其实我们身边充满了商机，只是很多人视而不见。处处留心皆学问，人情练达即文章，绝非虚言。每个人都有些与众不同的地方。比如有人唱歌唱得好，有人是教书先生，有人热爱打篮球，有人热爱看电视剧。聪明的人呢，把自己的爱好变成了财富。而笨蛋把爱好变成了负资产。打篮球的，可以教别人打篮球；教书的，可以在外面办补习班；热爱看电视剧的，比如美剧的，可以尝试着写影评、做字幕翻译等等。出路其实都很多，也都很赚钱。到处都是赚钱的机会。如果你留意了，你就会发现，如今的互联网时代，机会真是太多了。


    普通人与生意人的最大区别，我以为就是一个“卖”字。我脑袋里天天就是这个“卖”字！什么时候，我养成了这样一个习惯呢？就是我高三的时候，在一个网吧里打传奇网游戏的时候，只用了
    10 分钟，就赚了 25 元。我忽然感觉到从头到脚的爽，估计武侠小说里面的打通任督二脉也不过如此。


    我感觉我发现了一个天大的秘密。这个秘密就是“卖”。我这一生，啥都不用研究了，就是卖就行了。东西有人生产，技术有人学，我只负责卖。在那以后的人生当中，不管是在游戏中，比如魔兽世界，还是现实中，我都重点研究这个“卖”字。所以，我这个个人不太喜欢与人聊技术、聊生产，因为我感觉这个发不了财。我的脑子里只有一件事，就是把见到的任何东西卖出去。


    我觉得最好的生意就是自己啥也不会，挪腾几下就赚钱的生意。很多时候，并不是我们不吃苦，不努力，而是脑子有没有开窍。做生意，纯粹是个思维问题。很多人不愿意探索，不喜欢新事物，别人都玩烂的东西，他也不去接触下，就这样，自己把自己隔离起来，找借口说，必须要有资金才能创业，简直就是在侮辱互联网时代。


    有一技之长好不好？当大多数人都认为好的东西，我一般都持否定的态度。我最喜欢的状态就是啥也不会，也能混得风生水起，这才好玩呢。有一技之长的人，老是想用他的技术养活自己，就懒惰得不会思考了。当然，如果你脑子开窍了，又有一技之长，那么你赚钱的速度立马会水涨船高。别人买你的技术，这就是一颗树，你抱住它。你别去抱着这颗树，其实能逼着自己看见一片森林。先做好一个具体产品，然后依托这个产品进一步扩张自己的业务。


    做互联网项目，我建议大家单点切入，也就是做得越精越细越好。只选择一个具体的产品或者一个具体的服务来做。互联网的好处就是如果你把一个产品做得好，就会有海量的用户关注你，根本不愁没有客户，因为任何一个平台都可以面向全国。举个例子，在线下你开个包子店，你很难说就卖豆沙包，其他包子我不卖，馒头我也不卖，一般，你的品类要齐全。或者说你开个培训公司，你不可能只培训
    PS，其他的技术你不培训。但在互联网上，我们可以这样干，只做一个产品。


    当我们驾驭一个产品或者服务，驾驭得很好的情况下，我们才去扩展其他的产品与服务。当然，我私下里是不喜欢扩张新业务的，因为一个业务就完全够你赚大钱了。网上有几亿用户，你能圈上一万人，你就已经发大财了，为什么要去扩展其他业务呢？


    当然，我自己之前确实也扩展了好几个业务，但都不是主动扩展的。扩展自己的产品与服务也是个水到渠成的事情，就是当你把第一个产品或者服务做好了的时候，用户自然会有与你这个产品相关的需求。这个时候，你仅仅需要开始提供与第一个产品相关的服务，慢慢的扩展你的业务，这样的客户熟悉你，你扩展的业务与你以前的业务也是相辅相成的。


    我们部分人在这个社会上混不好，初级的人是靠出卖体力，入门级的是靠出卖技术。要登堂入室，我们玩的是一套思维，有了这套思维，很多东西都会变得很简单。


    ## 3、老板必须是一个心理学高手


    什么产品可以赚取高利润？如何做一个直指人心的产品？


    根据马斯洛需求层次理论，人类的需求依次是先满足生理需求，再满足安全需求，再满足社交需求，再满足尊重需求，最后满足自我实现需求！


    马斯诺的理论是，前一级需求被满足，人们才会诞生下一级的需求。意思就是，你饭都吃不饱，肯定是找饭吃，不会想到找女人。所以中国古话讲，饱暖思淫欲，先有饭吃，能穿得好，才想找配偶。所以，人类的基本需求就是生存加繁殖。这个理论，我们可以运用到商业上，到底做什么样的产品最有市场。读懂这个理论，你就能设计好你的产品，赚取利润。


    首先把这个理论进一步进化，需求并不代表市场，有购买力才能形成市场，有需求只是会让人产生购买冲动。如果目标的购买力已经满足了上一级需求，那么我们就可以认为目标已经产生了一下一级需求。相反，如果目标的购买力只足以满足基本需求，即便他有更高的需求，我们也不认为更高的需求已经诞生了。因为更高的需求他买不起，就像一般的打工仔也想要跑车，可是他没有购买力一样。另一个方面，将需求对应欲望更容易理解判断。


    人的需要都诞生于基本欲望，而所有的欲望都追溯到生存和繁殖上，这两个欲望衍生出了其他一切欲望。


    比如我们追求被别人肯定，被认可，这是一种社会需求。但这种社会需求，表面看来是因为我们的生理需求和安全需求已经被满足了，实际上，它反应出来的恰恰是希望得到更多的生存和繁殖资源。因为社交需求让你想去认识漂亮的异性，这是人的潜意识。


    因此我们可以看出，整个需求的过程其实是由少到多，由浅显到复杂，由直接到引申。但是，这些高级需求的根本都是从生存与繁殖需求上延伸出来的，而且其他高级需求又反过来进一步帮助你更好的实现生存与繁殖。故此我们的产品必须千方百计地和基本需求挂上勾才会有前途。也就是我们打磨的产品，必须与生存和繁殖挂钩，才能直击人心。


    ## 4、如何建立品牌，如何把一个东西卖到高价


    建立品牌，就是要让用户的脑袋里烙印上正面的印象。需要卖到高价的产品，你就不能只卖实用性，而要卖内涵，再卖个外延。


    中国人的消费不像西方人那样理性，西方人是什么收入阶层，就有什么样的消费，阶层感比较强。而中国的普通小白领挤着公交车上班，就敢买 LV 的包包。两个月工资的结余，去买个
    7000 块的苹果手机，这种极其离谱的事情在中国却极其正常，人们喜欢炫耀性消费。你有，我也要买，价格低了还不行，贷款都要买。


    有了市场，接下来我们就要让他们买我们的产品了。我仔细研究过一些品牌，他们就是靠讲故事的能力把产品卖到高价的。比如瑞士军刀，怎么讲故事？有架飞机坠毁了，一位乘客拿着随身的瑞士军刀在飞机上刻出一个小洞，钻了出来，刚爬出来，飞机就爆炸了，结果飞机上就他一个人还活。这种故事极具传播性，听了的人终身难忘，就会以为瑞士军刀的价值很高，所以瑞士军刀就算比其他同样品质的军刀高几百块，听了这个故事的人也会毫不犹豫地买瑞士军刀。


    再比如 LV 是怎么讲故事的？话说 1912 年泰坦尼克号沉船后，到了 1996 年，有人打捞上来一个旅行箱，是 LV 的，一打开，里面的衣服还是干的。你说，LV
    是什么质量？什么质量我先不管，我专门去 LV 官网看了下，他卖的苹果 6 的手机套子是 3400 人民币。暴利不暴利？靠什么暴利？就靠讲故事的能力暴利。故事能够传递感觉，能够传递价值。其实卖东西，就是卖的感觉，顾客愿意掏高价买，也是因为他感觉值。


    大家可以构思一个故事，然后套到自己的产品上去卖！


    总的来说，讲故事的原则：

    - 1、短小精悍，

    - 2、曲折动人，

    - 3、易于记忆，

    - 4、没有废话。


    ## 5、先搞广告创意，再搞包装，最后落实做产品开发


    很多老板，想做一个生意，就开始在那里研究产品。研究好产品就做出来，做出来了就开始卖，自己没本事卖出去，就企图招聘一个牛 X 的营销经理来卖产品。卖不出去就破产，卖得出去就开心。很多时候，都是自己做了一个根本没市场需求的产品。


    这种做生意的逻辑是大部分人的逻辑，也是非常错误的逻辑。正确的逻辑是：先搞广告创意，再根据广告创意做产品包装，也就是先找到顾客购买你这个产品的理由，找到客户购买理由后，再根据客户购买理由去开发产品、制造产品。这样搞出来的产品，水到渠成就能卖出去。表面上看，顾客是买产品的，真实的情况是，顾客是看到广告才决定买你的产品的。广告是顾客购买你产品的理由。也就是说，做一个业务，广告是核心，研发是为了广告服务，产品也是为了广告服务，包装也是为了广告服务。


    ### 什么决定需求？


    老板要找到我们卖的东西有什么价值。价值是由人们的需求决定的。道理很简单，人们不需要你这个东西，你这个东西就毫无价值；人们非非常非常急切的需要你这个东西，你这个东西就非常有价值。我们应该卖什么产品？做什么服务？明显是人们非常非常需求的东西！


    那么，什么决定需求呢？思想、观念决定需求！


    通俗点讲就是人的想法决定需求，人的想法千奇百怪，所以世界上的商品千奇百怪。连火星上的土地都卖出去了。那么，又是什么决定你的观念呢？又是什么决定你的想法呢？你接受的信息，决定你的观念。


    社会环境，决定你的观念。如果你生在温州商人家里，你就自然而然想要当老板。你只是父母遗传基因和自身环境的综合产物，你的观念来自你所处的环境，一定要清醒的认识到这一点。你自己是没有观念的。你只是一个机器人而已。你的想法与观念，甚至心理需求，仅仅是你的基因与你的社会环境编写的程序而已。


    遗传基因的核心是遗传信息，它决定你的硬件组成部分是什么，它决定组成你躯体的硬件性能如何。比如，有科学研究表明，人的智商跟遗传有很强的关系。环境的作用，主要价值也是信息，因为我们每个人接受的信息都是从自身环境来的。所以身处什么环境，往往决定你的命运。


    一个聪明人，必须付出代价，把自己所处的环境打造好。打造自己所处的环境，就是打造自己的命运。当然了，遗传信息很重要，比如那些天生智力残疾的痴呆症、傻子、疯子之类的，就是遗传基因出了问题，好比电脑某个电路板或者
    CPU 损坏了，导致根本无法使用。


    人们有什么观念，完全来自自身所处的环境，人们就是自身所处环境的产物。所以，你只要天天盯著一群人做营销，灌输给他们需求你产品的观念，塑造消费环境，或者帮他们找消费环境，他们必定会买单。人本来就是环境的产物，环境塑造人。如果你把人假设成一台高性能的电脑，那么，人就是获取信息和处理信息，并输出信息的机器。这台机器做什么动作，就在于你给他什么信息。也就是说，一个人认为什么有价值，跟他的价值观，也就是我们通常所说的观念密不可分。


    有什么观念，就有什么需求。有什么需求，什么就是有价值的。理解了这个东西，你应该就明白了，只要你能塑造人的观念，改变人的思想，那么你就能卖出去一切。那些时尚代言人，其实就是在塑造人们的观念、思想，比如什么韩流、日流穿衣风。


    营销，最重要的是塑造人们的观念。品牌营销、奢侈品营销都是从这一点着手的。其实最早的时候，经济学是心理学家业余的时候专研的，后来就有了经济学这门课程。


    ## 6、给产品取名字的重要性，做好标题党


    利用产品名字，把营销玩到人们的潜意识里去。


    我们大家使用的词语本身是没有任何含义的，含义不是在词语本身，而在于使用这些词语的主体。文字本身仅仅是个符号而已。打个比喻，糖罐在放糖之前，是个空罐。同理，词语在人们使用并赋予它含义之前，是没有含义的。你如果在一只漏斗里倒糖，糖是存不住的。同理，给一个靠不住的词语添加含义，结果也是存不住的。要明确表达你的含义，你最好换一个靠得住的词语。


    比如：大众汽车，这个词语包含不了高档豪华汽车的概念。如果你想卖高价，那么你就必须得换个糖罐。保时捷这个词更适合高档车这个概念。这个地方，就有一个赚钱的密码。其实，大众汽车的工厂不见得就比保时捷的工厂落后，所以，你在大众汽车工厂里生产的汽车，也可以叫保时捷，从而卖到高价。


    这个概念变通一下，大家就可以拿去卖自己的产品或者服务了。我们要善于利用历史上已经被塑造好了的词语、文字，借力打入人们的潜意识中去。中国古代有汗血宝马，宝马这个词语就被宝马汽车公司利用了。在历史上已经被塑造好了的词语、文字可以快速打入人们的潜意识中。


    阿里巴巴、淘宝网，都是利用人们心中已经塑造好的词语来做营销的典型代表。选择好了词语、文字、名字，连广告费都能节约很多。每一项产品或者服务，都是带着包装的商品。概念就是产品、服务的包装，也就是说，你必须得先把概念卖出去。人们通过你的词语、文字，感性的认识到你的商品，进而在他心中留下印象，然后他才会购买。这个概念玩好了，你就能赚大钱。


    词语、文字是触发器，它能触发人类心智中的含义。当然一个精明的人，你是营销不了他的，因为你说这是悍马，他就不认为你这个车是悍马，他能区别出来概念与真实的情况。这种人不管你怎么给他概念，他心里都跟明镜似的，不会上你的当。但是恭喜大家，这种人毕竟是少数，大部分人都是可以被销售的。我称精明的人为正常人，称可以被销售的人为不正常的人，这两种人有什么区别呢？可以被销售的人是企图让现实世界适应自己心智想法的人；不可被销售的人，则不断的分析现实世界，使自己的想法去适应现实世界。但这样做很累，让现实去适应自己的观点要轻松得多。所以，可以被营销的人总是接受与自己观点相近的专家的意见，他们不会去关心事实的真相。这就是为什么很多广告里都有专家形象的人出现，都有明星代言的情况。这样做，销量就会上升，因为不思考的人多，概念就被卖出去了。


    能被营销的人，潜意识认为一辆车叫做悍马汽车，比它叫乌龟汽车更加的帅气、脾气野性、跑得更快。所以，如果你卖汽车，你的汽车叫大众汽车，你想要卖高价就不可能。凡是能卖高价的汽车，总是要弄一个高贵的词语、名字，先把概念卖出去。**真正的赚钱利器，就是利用文字、词语，卖概念。**


    在这个注意力稀缺的年代，我们要做好标题党。取名字非常重要，好的名字能直接刻入消费者的脑袋里去。一个名字如果不上口，不容易记忆，往往要花费几十倍的广告力度，才能达到让人记得住的效果。虽然，不是取好了名字，产品就成功了，但是这是核心的一环。


    凡是做得好的产品，大多数名字都取得不错。我讲每一节课的时候，其实每一小节，都是花了点心思去取名字的。我看到有些人的节目的名字真是惨不忍睹，更有的人就是用第一集、第二集这样的方式来取名字，显然是不能吸引人的眼球的。在这个注意力非常稀缺的年代，好的名字、好的标题都是非常重要的。但是也有部分名字取不好的产品，也做得很好。基本就是靠时间长、做品牌，靠广告狂轰滥炸了。


    产品定位很重要。


    有人讲，产品的名字就像钩子，把品牌挂在潜在客户心智中的产品阶梯上。因此，在给产品取名时，一定要先给产品做好定位，明确产品消费目标群体，才能取一个更有利、更有效的名字。


    卖给儿童与卖给成年人的东西，名字命名肯定是有区别的。比如你把成年人的服装命个名 Hello kitty，我估计这个销量就要下跌。


    巧妙利用产品本质或性能。


    有些产品，其本身的性能或材料就是卖点。就拿食品来说，如果是用玉米提炼的成分做的糖，尽管就叫玉米糖，也要比取什么花里胡哨、故弄玄虚、让人摸不着头脑的诸如右旋糖、高果糖等名字更加吸引人。


    针对中国人的产品，要注意文化差异和民族习俗。针对不同的消费群体，在为产品取名时，就要注意充分考察消费人群的文化背景、宗教信仰和民族习俗。比如高端汽车品牌宝马、奔驰等，其中文译名就充分考虑了中国人的文化背景和吉祥追求理念，并将中国古典文化和中国人追求吉祥的信仰巧妙地融合，不可不说绝妙。


    我们给产品或给文章命名，都要求力抓住人的眼球，把产品、标题刻进人的脑子里。一个名字要融入你的产品定位，针对的是什么用户群，要表达出你的行业本质。只有消费者记住你了，买单的几率才会增加。产品名字要易于传播，我们的思想宣传必须是人民群众喜欢的。


    凡是标新立异、凸显自己创意的人，都没什么前途，而且还要能让最无知的人也能一听就明白。做任何事，都要大众化。大众化，才有群

