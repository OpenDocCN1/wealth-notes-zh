    你浪费了，人生很快就会结束。富人知道时间珍贵，穷人到了白发苍苍，还嫌命长。


    # 9、人类社会从来不是单打独斗，比的就是谁的团队牛B，谁的朋友牛B


    怎么交朋友？有人说了，交朋友谁不会？你混得不怎么样，很大程度上就是由于你根本不会交朋友，或者说是交了一帮没什么用的朋友。首先要明白，交朋友实际上是一种投资。既然是投资，自然就必须得有回报，那么接下来的问题是交哪些朋友，才会有回报呢？


    第一种朋友，必须明事理，懂得互利共赢的朋友。


    这一条看起来简单，好像每个人都懂，实则明白的人很少。很多人的意识形态不是自己能为朋友提供些什么，而是想着朋友比我有钱，有能力，就应该分我些。这是一种平均主义思想，是零和博弈。假如你有100万，你想创业，找了一帮朋友来帮忙，这帮朋友只想着你很有钱，咱们都是穷人，你把这100万分给我们吧。如果你交的是这样的朋友，那么你再有能力，也混不好。'
  - '[PAGE 38]


    # 第一章 社会的本质


    我们选朋友，就是为了组成一个战斗力强的组织，群策群力，一起去寻找更大的财富，而不是脑子里都是平均主义的人。这些平均主义者，只会让他们自己赢，让你输。跟这种平均主义者交朋友，结果是你输，这种朋友会削弱老大的竞争力。


    只有老大混得好，才能让大家一起发财。要是老大竞争力被削弱，越混越惨，这个组织就会完蛋。如果你交平均思维的朋友，那么结局就是大家一起完蛋。


    只有选择懂得互利共赢、明事理的朋友，大家在一起才能越混越好。如果选择平均思维的人做朋友，这些人都有红眼病，老是算计你比他多了多少钱，车子又比他的高档，那么最后只能“同归于尽”。


    # 第二种朋友，有前途的朋友。


    什么样的朋友有前途？一个人要有前途，需具备如下几个特征：


    +   1、学习能力强，特别好学。


    天才其实根本不是天生的，而是后天不断地勤加练习，努力学习加实践的结果。一个人的种种能力都源于后天的学习，没有人生下来就是赛车手，就是足球健将。学习能力要排在所有能力的首位，只要有很强的学习能力，慢慢的很多能力都会强起来。如果学习能力弱的话，注定是个废物。


    +   2、勤奋努力干活的人。'
  - '[PAGE 39]


    这个其实非常好判断，一个人如果勤奋努力干活，必然会在某个方面越来越强。如果你发现一个人没什么特别之处，其实就可以判断，这个人根本不勤奋，因为只要是勤奋的人，都会有某些方面比一般人强些。一个没什么特别的人，可以说他一辈子都不会有什么机会。人是很难改变的，不要相信他会变得勤奋，这是性格问题。而性格，一般都是小时候就形成的根深蒂固的习性。不勤奋的人，直接隔离，不交往。


    # 3、精力过剩、积极乐观，而且喜欢折腾的人。


    一个人的事业跟一个人的精力关系非常之大。什么事情都萎靡不振的那种人，别交往，因为跟萎靡不振的人在一起，你也会变得萎靡不振，30 活活得跟 80 岁一样，还谈什么前途？交往积极乐观的人，情绪是会被传染的。交往积极乐观的人，你就会越来越乐观。而那种悲观主义者，会让你越来越绝望，觉得干什么事情都干不成。最后索性什么也别干了，这样当然也就没有前途了。


    喜欢折腾是一种非常优秀的品质，只要这家伙永不停息的折腾，他总会折腾出经验来，总会越折腾越会折腾，最终获得成功。


    # 第三种朋友，家庭教育好的朋友。


    家庭教育对一个人影响非常大，素质低的家庭很难教育出来素质高的孩子，别谈特例，我不喜欢谈特例，我只谈一般情况。


    性格决定命运。家庭教育好的孩子，性格里有更多的优秀品质，这些品质都会在以后的激烈竞争中发挥竞争优势。'
  - '[PAGE 40]


    第四种朋友，帅哥、美女。


    人的外貌很重要，外貌对人生的影响具有极大的不确定性。特别是美女，哪天她嫁给位高权重的官老爷或者是富商，几句话就能让你飞黄腾达。当然如果你得罪了她，几句话也能让你完蛋。所以，但凡是漂亮的妹子，多给点面子，多结交，因为这也是一种优质资源，千万别瞧不起，女人的美丽就是一种能力。


    最后强调一下，别由着自己的性子乱交朋友，咱们是来学习怎么生存的，怎么赚更多的钱，生活得更好，照顾好家人、父母。大家都是成年人了，做事不成熟，后果很严重。


    我以前就是由着自己的性子乱交朋友，特别是读书的时候，那个时候打传奇、魔兽，交了个朋友，由于游戏里玩得好，这家伙总是找我借钱。结果有一次，我让他帮我顺带本书都不愿意，还不如一个宿舍的普通室友好使，你说这种朋友交来做什么？后来，这家伙还来找我借钱，在游戏里问我要优秀装备，我真是对这种朋友非常无语。


    如果我们在读小学的时候，就明白了这些交朋友的道理，选择性的交朋友，而不是胡乱交朋友，我相信再差也差不到哪里去。人类社会从来不是单打独斗，比的就是谁的团队牛B，谁的朋友牛B。'
  - '[PAGE 41]


    # 10、尊重身边地位低的人，别阴沟里翻了船


    当老板的，大多数都比身边的人经济条件好些，社会地位高些。容易有意、无意之间刺激到了身边地位低的人。心胸开阔的人可能就原谅你了，但如果碰到心胸狭窄的人，就要倒霉了，犯这种小错误非常划不来。


    一个保姆被这个家庭女主人无意间伤害到自尊了，这个保姆就在这家人都外出工作的时候，对小孩子进行了殴打。当然被视频拍了下来。这就是不尊重、重视身边地位低的人的后果。


    其实这都还是小事。历史上，有因为不重视、尊重身边地位低的人打了败仗，而差点丢掉性命的人。春秋时期的宋国大臣华元领军与郑国开战，华元准备与郑军开战的前一天晚上，杀羊煮羊肉汤给士兵喝。华元同志与士兵们开开心心的喝羊肉汤，华元同志的车夫没有吃到羊肉汤，所以就怨恨华元。当天晚上在床上翻来覆去的睡不着，感觉华元太不是东西了，有羊肉汤都不给自己喝。等到两军交战的时候，还没喊开打。车夫就对华元说：“昨天地上的羊肉汤，是你作主；今天的打仗驾车，是我作主。”就驱车冲进郑军军中，宋军将士看得目瞪口呆，郑军活捉'
  - '[PAGE 42]


    了对方主将华元，因此宋军战败。这就是不尊重和重视身边地位低下的人的严重后果。


    我喜欢研究李嘉诚。当年读到一篇报道，李嘉诚在宴请长江商学院的各位企业家的时候，吃完饭，与每个大企业家握手道别。最后李嘉诚看到离他有 10 几米远，站在门边的一个服务员，李嘉诚同志居然跑上去，主动跟这个服务员握手，表示感谢。我当年读不懂这是为什么，这不是浪费时间吗？这不是多此一举吗？李嘉诚的身价多高，时间多宝贵呢？


    后来我才明白，李嘉诚不是在浪费时间，而是他看透了人间的规则，做事已经是滴水不漏了。这不是孤例，因为我看过一个李嘉诚的传记视频，李嘉诚去打高尔夫球，进门第一时间也是跟工作人员打招呼，问好。不像我们现在有些人，刚刚事业有点起色，就对人颐指气使，高高在上的感觉就出来了。实际上，身边地位低的人，都在后面骂你呢，指不定哪天就坏你大事。


    所以，大家一定要尊重、重视身边地位低的人，别阴沟里翻了船。


    # 11、致富，就是想的很简单，做的也很简单


    很多人都想变富，苦苦钻营，绞尽脑汁找方法，买股票，卖股票，'
  - '[PAGE 43]


    起早贪黑的经营公司。可是几十年干下来，发现自己的财富并没有增加多少？百思不得其解。当然，有一部分打工族也以为自己付出了很多，为什么就是不能变富呢？答案很简单，穷人是靠感觉活着的人，而富人靠的是数据。


    比如，一个穷老板经营公司的方法是，这个哥们对我很尊重，跟我关系也很好，以前是一起跟我打天下的，所以提拔他当经理。而另一个能力很强的人，却只能给他当手下。公司没有考核制度，全凭感觉经营。


    再比如，穷人有几十万、几百万闲钱，看着别人去炒股，他也去炒股，他根本就不懂股票是什么，也从来没有上过一堂投资课程，就凭着另一个邻居的介绍，他就投资去炒股。可笑的是他的邻居也是邻居介绍的，他们一起把钱买了股票后，又一起商量着去菜市场买菜，去跳广场舞。


    有人说中国大妈抄了黄金的底，后来我们都知道，黄金大跌。其实中国大妈抄底黄金，跟有些人在日本核泄漏的时候把超市里的盐抢光了一样，根本就是凭着感觉瞎跟风。


    而富人，只玩自己懂的东西，十拿九稳赚钱的东西。其实这个社会上发明了很多坑人的投资组合，投资产品出一些不懂得投资的专科生、中专生，领着几千块钱的工资打着电话，推荐给那些有闲钱的人买。那些有闲钱的人也不懂自己买的是什么，反正白纸黑字有合同，反正有人推荐，又被说得心就就买了。大多数人重视经验，而不注重基础事实、科学调研出来的数据，并且自作聪明的否定事实。总以为有捷径可走，总以为自己能捡到底价。其实大部分人的致富套路是投资，然后祈祷。'
  - '[PAGE 44]


    根本就不是有计划，有规则的去致富，这就是大多数人终其一生都不能致富的原因。


    大多数人偏爱复杂的致富套路，而轻视简单的、大家都懂的致富套路，比如说，你从现在开始钻研网络营销，只要天天钻研5个小时以上，就算你现在身无分文，只要智力正常，两年后，你必然有几十万现金在身上，多了我就不说了。我说的是钻研，不是你打了一份网络营销的工，如果你智力正常，就能明白我的意思。但100个人当中，只有一两个人会坚持这种简单的致富套路。其他的人都会嘲笑或者说坚持几个月就放弃了，因为他们又想去寻找其他的致富套路了，显然，当他们找到后，他们稍微坚持一下，又会放弃，然后又再一次次去找新的致富套路。


    这个世界最有意思的是，穷人想的跟做的总是有着天壤之别。而致富，就是想的很简单，做的也很简单。


    国外有一个统计，以100年来看，大部分基金经理绞尽脑汁都没跑赢标准普尔500。也就是说，如果投资，你根本不需要思考，只买标准普尔500的企业就行了。同样的道理，在中国，你只需要买大城市的地产就行了，你就赚钱了，根本就不需要动脑。


    致富，只需要想得极其简单，做得极其简单。通过整个社会的统计数据去干就行了。同样的道理，你管理一个企业，你不知道怎么管，你压根就不需要绞尽脑汁，费尽心思去想方设法，搞政策，甚至玩企业内部的政治斗争，你只需要找到中国最牛B的企业，比如阿里巴巴、腾讯、'
  - '[PAGE 45]


    华为、万科，看看他们各个模块的管理制度，根据自己企业的情况稍稍变通下，用起来就行了。


    # 12、成功在于持续的重复一件小事


    如果我认为自己还取得过一点点成绩的话，那只是因为我不断地重复：重复读同一本图书，重复做同一件小事。不断地重复，你就会发现很多秘密，所谓书读百遍，其义自现，做项目也是如此。


    我总是努力的在重复中去发现不同，重复、重复再重复，重复的价值今天无限放大。现在社会节奏太快，新鲜事物冲击大，很难静下心来长时间对一个项目投资精力。大部分人都没耐心，只要你有耐心重复于一个小项目，你非常容易就出类拔萃。坚持就是胜利，坚持体现力量。


    厄普代克写了一本兔子快跑，就是一本书。但等他再写出兔子归来和兔子富了，就是人物了。之后再出几本关于兔子的书：兔子嫁人，兔子伤心，兔子老了，是垃圾还是珠玉不论，厄普代克就逼近不朽了。


    有个叫罗伯特清崎的人写了20几本书，全都是穷爸爸，富爸爸，所以，他也出名了，也财富自由了。世界级的营销专家，一辈子都在研'
  - '[PAGE 46]


    究营销，比如科特勒。李阳则一辈子研究英语，李嘉诚一辈子研究企业。


    很多超级大企业的 CEO 都是几十年如一日的重复。很多人羡慕这些大企业家，可是这些平凡的人根本不知道，这些人都是早上六点到晚上 10 点的，一直在重复那些工作。


    我看到美团王兴在网上发表过的一句话：“今天决定 12 点之前下班。”各位听懂了吗？也就是说，他以前都没有 12 点之前下班，而你，已经回家，已经在梦里了。


    **亿万富翁都是规律的重复他的工作。**


    用鲍鱼、人参做出来的菜，通常不会好吃。愈珍贵的食材，练习的机会愈少，如何可以熟练？只有最平凡的鸡、牛、猪，才会产生千变万化的厨艺。比如辣椒炒肉、小炒肉、回锅肉，这才是硬菜。**熟练才有出路，也就是不断重复才能有出路。一招鲜，吃遍天的秘诀是精通。精通来自于重复，只有精通的应用才能成为专业人士。专业人士，一生的辉煌只需要一次，但这一次就是传奇。活在人们的传说之中，活在人们的想象之外。**


    我个人喜欢佛学。什么是敲木鱼呢？


    +   1、鱼是昼夜睁着眼睛的，鱼睡觉就是停在那里不动了，休息一下就算睡觉了。


    +   2、庙里敲这个木鱼，是要我们精进，修道要效法鱼的精神，昼夜努力不停。


    +   3、步步前进，日日不止，自有到期，不必计算远近而徒长吁短叹。'
  - '[PAGE 47]


    成功在于持续的重复一件小事。


    # 13、赚钱，必须了解钱的性格


    为什么要这么看重钱？答案非常简单，因为有了钱，你才能去旅游，才能去买房子，买车子，才能保证 60 到 120 岁还有活头。敢活到 120 岁，是因为准备好了足够的物质条件。而赚不到钱，是活不到
    120 岁的，因为物质条件不允许你的生命力这么坚强。


    一个人的财富不自由，**人格就很难独立**。不能够做到为自己的老婆、孩子提供一个良好的生活环境，也不能够为父母提供一个有保障的晚年。甚至他们晚年疾病缠身的时候，你也只有在旁边看着！不是你不孝顺，而是你没有资本孝顺。这其实是大多数中国人的写实，与道德无关，现实如此。所以，为了获得有尊严的生活，在我们年轻的时候必须学会赚钱，必须清楚每个人都有这样一笔账，你必须要算清楚。


    赚钱，必须了解钱的性格。地球上从来不缺钱，当今社会，电子货币满卫星飞，满互联网飞。支付宝、微信、财付通、各种网银、各种资本、'
  - '[PAGE 48]


    投资人、基金，这些钱24小时不停地在寻找着需要它的人。然而奇怪的是，大部分人是穷人，努力找钱却找不到。


    现在，我就来谈谈钱到底在找什么样的人？而你只需要成为这样的人，钱就会向你飞奔而来。


    司马迁讲，天下熙熙，皆为利来；天下攘攘，皆为利往。司马大爷的意思是，所有的人都是为了钱。我先讲我们如何待员工，我们才能成为厉害的老板？


    +   1、你必须给员工高额的回报。比如公司一年赚了100万，你拿30万分给你的两个骨干，一个人20万，一个人10万，如此，这两个骨干就会在来年更加拼命地干。于是你来年就可以赚到200万，你就可以拿出60万来分给骨干，一个25万，一个20万，一个10万，一个5万。如此，你又多了两个愿意跟着你拼命的人。你就如此周而复始地干下去，跟着你的优秀员工就会越来越多。


    +   2、你必须让员工有安全感。承诺给员工的钱必须兑现，你也不能去要求员工干违法的事情，否则，员工不安全，就要辞职。


    +   3、你必须让员工想走就走，不能强留。如果你用各种手段强留，就会出现身在曹营心在汉的情况，留下来的人不尽心尽力，你也赚不了几个钱。


    假如你做到了这三点，那么就有非常多的员工愿意死心塌地地跟着你。'
  - '[PAGE 49]


    其实，钱也如同人一样，是有性格的。


    第一，你如果能让跟着你的钱变得越来越多，交给你的钱继续能获得高额回报，周而复始地干下去，就会有更多的钱跟着你；


    第二，你不要用钱去干违法的事情，否则钱就怕你；


    第三，别人来拿回属于自己的钱的时候，你能毫不犹豫的给别人，那么，就会有很多人愿意把钱给你。


    如果你能做到这三点，地球上飞的那数万亿电子货币就会来找你，你自然就富了。其实，钱就是人性，钱就是人心而已。只要你真能做到用心待钱，钱就会找你做朋友。有的人不喜欢钱，消灭钱，比如他拿着钱去嫖娼，买奢侈品，或者赌博，或者是满足自己的欲望，这种人就是钱的仇人，自然不会有钱。


    各位反思一下，你到底是钱的仇人呢？还是钱的亲人？如果你是钱的仇人，你穷，就在所难免了。很多事情啊，其实本来很简单，就是现在大多数人把这种简单的道理忘记了。只要你返璞归真，道法自然，自然就有钱了。'
  - '[PAGE 50]


    # 14、做到这10条，就会赚钱，而且一定有钱赚


    怎么算是会做人呢？做到哪几点就会赚钱呢？


    +   1、尊重身边的每一个人，没事就多烧香，天天平安。给多少人烧香，就有多少人帮助你，保佑你，人都是礼尚往来的。


    +   2、能送礼的时候，就送礼，送礼多的人，就很容易成就大事。甚至在你无路可走的时候，会有你送过礼的人帮助你，让你绝处逢生。


    +   3、养成背后从来不说人坏话的习惯，也不听别人说坏话，别人来找你说坏话，你就找借口走开。因为坏话是一种负能量，会感染你的精神。让你丢失财运，况且，社会本来就是个好事不出门，坏事传千里的社会。你只要一说坏话，要不了多久，大家都知道是你说的了，没人愿意与你相处，大家心里对你有芥蒂，你就混不好了。


    +   4、养成做好事的习惯，并且做好事绝不留名，这样你的人缘就会越'
  - '[PAGE 51]


    来越好。如果你做了好事，到处宣传，好事就会变成祸害。因为那些接受你恩惠的人脸上无光，成了你炫耀的工具了，你就开始积累怨恨。而如果你不宣传，有部分受你恩惠的人就一直铭记在心，总是感激你，你积累的就是福德。怨恨与福德都会在条件成熟的时候转化到现实生活中。养成做好事不留名的习惯，必成大业。


    5、调理好家庭关系，家和万事兴。家和，你家里的父母、老婆都鼓励你做事业，鼓励你奋斗，一家人都支持你，那么你做事就有如神助，成功几率就大很多。如果家庭关系处理不好，那么你做什u么事情，父母反对，老婆反对，负能量都集中到你身上，阻碍太多，你就相当于小鬼缠身。事业就显出衰败之象，赚钱就很难。


    6、不要抱怨环境不好，找客观原因，这样大家只会认为你无能。其实很多事情，都是人为因素占的多。人为因素大概占70%，环境因素占30%。所以，你只要你把你能改变的事情做好了，基本这个事情就算成功了。


    7、我们工作的时候，总会遇到些压力，不顺利，甚至是痛苦。不要把这种压力发泄到伙伴身上，不要把这种压力带到家里，让家里人跟你一起痛苦。这一点，我是跟李嘉诚学的。李嘉诚回家绝对不谈工作，家庭就是家庭，工作就是工作。李嘉诚先生事业如此之大，能做到井水不犯河水，真是不了起。我现在都是家庭与工作分不开了，但我还能做到不把痛苦发泄到伙伴与家人身上。男人有什么事情就自己承担，挺一挺就过去了，这样你会跟大家关系融洽。'
  - '[PAGE 52]


    8、要有城府，别人骂你，做错了什么事情，不要把情绪挂在脸上。什么心情都挂在脸上的人，成不了大人物，成不了大商人。


    9、永远不空手吃任何人的饭，永远不空着手到任何人家里去。你永远都要送点礼物，这样，别人就感觉到你这个人尊重他们。以后，你想做点什么事，他们也愿意帮忙。平时就要学会烧香，临时才有佛脚抱。礼尚往来，天长地久。我最佩服的送礼人，第一个是毛泽东，他送给老百姓的礼物，是解放全中国。所以毛泽东能当主席。第二个厉害的送礼人是邓小平，他送给全国人民的礼物是改革开放。所以他能名垂青史。


    送的礼物有多大，就有多大的回报，就有多大的钱赚。当你不能送大礼的时候，就养成送小礼物的习惯。比如我以前刚打工的时候，就没本事买水果给大家吃，结果我的关系与大家最好，干了半年不到，就升为主管了。这一条，我以前是定了标准的，工资的八分之一到处送。看似吃亏，其实我占了大便宜。


    10、与人合作，永远让别人赚大头，自己赚小头。这样干的目的有两个，第一，对方会开心，会操心；第二，对方会讲你好话，会有更多的人与你合作。


    会做人，就一定会赚钱而且有赚。'
  - '[PAGE 53]


    # 15、企业讲利润，员工讲收入，这才是天道


    员工只想给自己干；不想给别人干。老板要做的事情，就是根据人自私的本性去引导员工。


    比如，您是一个私营大学的老板，您就不应该让每个老师用心教也是那么多收入，不用心教也是那么多收入。您可以用卖老师门票的方式来经营学校。不用心的老师就只能吃稀饭，用心的老师就能吃肉，而很用心的老师就能吃山珍海味，这就是根据人性来驱使员工自动自发的工作，自我挖掘潜能，这才叫真正的公道。


    什么样的员工是合格的员工？能干，能做出贡献，就合格，而不是学历高。实用的才是最好的，能盈利才是最重要的。有想法、没办法的人很多，社会大学是最好的大学。我们每个人一定要持续进步，持续学习。拒绝招聘只有想法、不干活的人进公司。


    所以，真正想推动一个社会进步，要从利益的角度去考虑。真正想干好一个企业，同样要考虑到优秀员工的利益。企业讲利润，员工讲收入，这才是天道。'
  md: '

    # 9、人类社会从来不是单打独斗，比的就是谁的团队牛B，谁的朋友牛B


    你浪费了，人生很快就会结束。富人知道时间珍贵，穷人到了白发苍苍，还嫌命长。


    怎么交朋友？有人说了，交朋友谁不会？你混得不怎么样，很大程度上就是由于你根本不会交朋友，或者说是交了一帮没什么用的朋友。首先要明白，交朋友实际上是一种投资。既然是投资，自然就必须得有回报，那么接下来的问题是交哪些朋友，才会有回报呢？


    **第一种朋友，必须明事理，懂得互利共赢的朋友。**


    这一条看起来简单，好像每个人都懂，实则明白的人很少。很多人的意识形态不是自己能为朋友提供些什么，而是想着朋友比我有钱，有能力，就应该分我些。这是一种平均主义思想，是零和博弈。假如你有100万，你想创业，找了一帮朋友来帮忙，这帮朋友只想着你很有钱，咱们都是穷人，你把这100万分给我们吧。如果你交的是这样的朋友，那么你再有能力，也混不好。


    我们选朋友，就是为了组成一个战斗力强的组织，群策群力，一起去寻找更大的财富，而不是脑子里都是平均主义的人。这些平均主义者，只会让他们自己赢，让你输。跟这种平均主义者交朋友，结果是你输，这种朋友会削弱老大的竞争力。


    只有老大混得好，才能让大家一起发财。要是老大竞争力被削弱，越混越惨，这个组织就会完蛋。如果你交平均思维的朋友，那么结局就是大家一起完蛋。


    只有选择懂得互利共赢、明事理的朋友，大家在一起才能越混越好。如果选择平均思维的人做朋友，这些人都有红眼病，老是算计你比他多了多少钱，车子又比他的高档，那么最后只能“同归于尽”。


    **第二种朋友，有前途的朋友。**


    什么样的朋友有前途？一个人要有前途，需具备如下几个特征：


    - 1、学习能力强，特别好学。


    天才其实根本不是天生的，而是后天不断地勤加练习，努力学习加实践的结果。一个人的种种能力都源于后天的学习，没有人生下来就是赛车手，就是足球健将。学习能力要排在所有能力的首位，只要有很强的学习能力，慢慢的很多能力都会强起来。如果学习能力弱的话，注定是个废物。


    - 2、勤奋努力干活的人。


    这个其实非常好判断，一个人如果勤奋努力干活，必然会在某个方面越来越强。如果你发现一个人没什么特别之处，其实就可以判断，这个人根本不勤奋，因为只要是勤奋的人，都会有某些方面比一般人强些。一个没什么特别的人，可以说他一辈子都不会有什么机会。人是很难改变的，不要相信他会变得勤奋，这是性格问题。而性格，一般都是小时候就形成的根深蒂固的习性。不勤奋的人，直接隔离，不交往。


    - 3、精力过剩、积极乐观，而且喜欢折腾的人。


