    比如员工想买房子，买车子，那么好，我来帮你们完成这个心愿，你们把工作做好，我来辅助你们把工作做好，这就是让自己的欲望顺从员工的欲望。这样的思路来经营员工，就会顺畅得多。成就了员工，也就成就了自己，顺便自己就赚钱了。


