    我是如何解决这个问题的？

    之前生成图片，老是很不稳定，一会一个样，而且人脸都变现严重，通过不断的调整和生成图片，发现了，原来如果描述语是高清的图片，而生成的是512*512尺寸的时候，人就会变成很怪，当我把分辨率调成576*1024时，就可以稳定生成想要的图片了，然后我通过高清修复，把重绘幅度调成0.72，提示词相关性调成0.8时，就能够批量生成一堆人物一样，但是衣服一直在发生变换的高质量图片，我就实现了批量生图了，现在大概半小时能生成80张图片，而且质量有保证，我准备先生成10000张，后面作为小说推文的素材


    又一次让我意识到，在航海的每一天，积极去行动，努力解决问题，遇到困难在群里寻求帮助，不仅能提升自己的能力。也能帮助到其他圈友，得到大家的认可。


    因此接下来的每一天，我都在不断钻研并且把这个问题分享到群里，以及记录到作业里，因此大部分航海日志都是精选，得到了更多圈友的称赞。


    再次让我体会到越分享越幸运，越分享越有收获。在利他的过程中，我成就了自己的 AI 绘画技术和人脉。


    时间来到航海的第七天，我在抖音和小红书，同步更新了我的第一个作品，顺利完成了第一个七天目标。


