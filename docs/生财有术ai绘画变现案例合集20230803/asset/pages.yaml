    # (35赞)妄图耍小聪明利用 AI 绘画制作 NFT 出售的人要注意了


    作者： Jimmy Chen


    日期：2023-03-21


    妄图耍小聪明利用Al绘画制作nft出售的人要注意了。很多时候，你以为自己拥有了强大的技术，可以 为所欲为，以为别人都想不到的时候，往往很容易掉到坑里。


    今天，我就有一个朋友被骗了，我从骗子的角度，理了一遍思路：


    顺一遍思路：


    +   1. 推特找韭菜，高价求购nft，降低心理界限，让人变得兴奋

    2. 事先通过让人点击自己的链接，或登陆自己的网站，获取对象的小狐狸钱包密码

    3. 说账号出现问题，并且提出是正常情况，并展示opensea与自己之前的沟通截图，要求往里面充值 0.2ETH做一个保证，自己才能转账过去

    4. 受害着往里面充值了0.2ETH，立马被转走（账号已被盗）

    5. 再次说明这是正常情况，打感情牌，并保证承诺，再给0.2ETH就可以成功解决问题了（实现二次变现）


    nft的意义很大程度上并不取决于图像的样子而更多是背后的一些东西。比如项目方，模式，信任机制，热度……


    你本丝毫无名气，别人为什么要来买你的画呢？


    AI绘画虽然说的很厉害，但说到底，他是一个门槛极低的事情，写点prompt，大部分只要研究一下都能做。


    所以在这件事情就不存在稀缺性了'
