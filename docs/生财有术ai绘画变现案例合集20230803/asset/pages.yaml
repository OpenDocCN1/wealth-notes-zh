- pgno: 18
  md: '权重的控制，这关系到你想要的东西是否获得了AI足够的重视，根据基础AI的基础逻辑，越靠前的词汇越受到重视。同时还可以通过其他形式来调整权重。


    在这里用Midjourney举例，根据官方的使用指南。


    在一段词之后加上"：：数字"即可调整权重，基础权重是1。


    经询问天辉教练，给出的答案是：


    数字的取值范围一般是在0~5之间，0~1之间（如0.5）会降低权重，1~5之间（如2.5）的会增加词语的权重，超过5依旧会显示5的效果。


    对了，官方给出的解释中，当你使用"--no farms"和"farms:：-.0.5"会让这词语不出现在画面中。运用这个可以控制你不想出东西的。


    # **Advanced Text Weights**


    You can suffix any part of the prompt with :0.5 to give that part a weight of
    0.5. If the weight is not specified, it defaults to 1. See also Text Prompt Questions.


    Some examples:


    +   - /imagine hot dog:1.5 food: -1 — This sends a text prompt of hot dog with
    the weight 1.5 and food of weight -1

    - /imagine hot dog:1.25 animal: -0.75 — Sends hot dog of weight 1.25 and animal
    of negative 0.75

    - /imagine hot dog:3 food: -1 animal: — Sends hot dog of weight 3 food of weight
    -1 and animal of weight 1


    Prompts with a negative total weight are not allowed.


    > The --no command is equivalent to using a text weight of "-.0.5". For instance,
    --no farms means don''t include farms in the output, same as "farms: -0.5"'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 高级文本粗细


    您可以使用 `text 0.5` 为提示的任何部分添加后缀，以使该部分的权重为 0.5。如果未指定权重，则默认为 1。参见文本提示问题。


    一些例子：


    +   - `/想象热狗:8:1.5 食物:8:-1` —这将发送重量为 1.5 的热狗和重量为 -1 的食物的文本提示

    - `/想象热狗:8:1.25 动物:8:-0.75` —发送重量为 1.25 的热狗和负 0.75 的动物

    - `/想象热狗:8 食物:8:-1 动物` —发送重量为 1 的热狗、重量为 -1 的食物和重量为 1 的动物


    不允许使用总权重为负的提示。


    > “-no”命令等效于使用文本粗细“0.5”。例如，“-no farms”表示不要在输出中包含服务市场，与 `farms:8=-0.5` 相同


