    # ## 关于运营


    小伙伴说我运营做的很好，其实没有任何运营的技巧，我只是想着能不能让大家尽量麻烦节省时间，能不能体验再多一点，能不能再超值一点。


    我把自己想象成一个从来没接触过AI绘画的小白，甚至是从来都没有看过外面网站的小白


    **我在遇到问题时，最困惑我的是什么，** 什么能够第一时间解决问题先让我能走起来，然后在走起来之后，能不能想着走快一点，走的远一点


    +   喜欢自己钻研的小伙伴，我提供一份可以钻研的资料；

    喜欢与人交流的小伙伴，我也积极参与探讨；

    喜欢信息繁多刷屏的伙伴，我们一起刷屏体验氛围感；

    不喜欢刷屏想安静的伙伴，只需要保存一份文档链接；


    这一段时间，我帮助很多伙伴解决了很多的卡点。


    有的是一点就透，有的是一步一步带着走，有些不熟悉的地方我也会慢慢地等，因为我知道这就是两个月前什么都不懂的我。'
