  md: '这个方法适合无法出镜，还有对着镜头话说不利索的人。比如我。。。


    看到最近有个爆款。一个品有大量的达人带货。文案也是相同的。


    说明，第一这个产品厂家在有意的做推广投放。第二产品是这个品在旧基础上做了一些微调整，平台对这样的新品有流量倾斜。


    分析看目标人群都是一致的。是不是我们想办法往这个流量红利的品上去靠呢。


    那用什么形式呢？口播的话，很多人无法出镜，对镜头说话都不利索。


    那这个问题就变成了如何找到一个能够口播的人或者形象。


    有一个解法是利用现在的AI技术。


    首先，用AI绘画做一个人物的形象。


    其次，用智能配音。配一段口播的文案。


    最后，用AI自动视频网站生成人物的视频口播。


    同样的素材，不要浪费。把人物抠像，找一些相关内容的视频作为背景。又可以制作一批新的视频。还可以继续复用。


    +   ①口播视频可以把声音去掉，只留下画面。

    ②找爆款口播文案利用AI自动配音。

    ③再把视频和语音结合起来。就变成了一个的爆款视频。


    这种方式可以播无数的口播文案。


