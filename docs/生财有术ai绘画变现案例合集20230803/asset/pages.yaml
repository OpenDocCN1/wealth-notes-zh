    # (35赞)小红书 AI 头像账号很火


    作者： 海迪


    日期：2023-03-13


    小红书现在做Ai绘画账号的，最火的就是头像类账号。


    数据最高的点赞上限在五万，加上评论收藏数据，一条笔记互动量基本能到十万了。


    头像类AI账号的用户需求分为三类。


    1.第一类


    集中在帮助用户表达自身性格或积极情绪的内容，比如：元气少女头像、甜妹头像、高冷美女头像、清冷美女头像、御姐头像、甜酷女孩、时尚女孩、婚纱头像。


    这类内容是稳定高频需求，用户范围广。


    2.第二类


    在少女头像的基础上加上差异化的形象需求，来筛选更加精准的用户。'
