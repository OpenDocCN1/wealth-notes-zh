  md: '一般是形象词+少女头像的组合。


    比如白发清冷美女、黑色短发女生头像、金发黑色毛衣女孩、麻花辫女孩。


    # 3.文化元素


    除了上面的两类内容之外，一些结合了文化元素的头像也备受青睐。


    比如博主“爱是与世界平行”的四方神少女系列头像，印象很深，打出了差异化的卖点，另外还有十二星座少女系列。


    三类笔记转粉率没有数据，但我个人感觉第三类转粉会高一点。


    这类笔记受众基本都是18-25岁的女性，一篇笔记80-90%都是女生在消费。


    带的标签大多是Ai绘画、二次元头像、二次元少女相关。


