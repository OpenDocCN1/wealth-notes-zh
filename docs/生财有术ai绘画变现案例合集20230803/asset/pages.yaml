- pgno: 94
  md: '拓展方式1: 搞很多号是第一思路, 但据我观察, AI图文内容对新号不怎么友好, 出来的极少数幸存者偏差。


    拓展方式2: 找人代发, 找各种宝妈小红书老号发, 做提成。核心是投产, 我考虑到客单价低, 没敢这么做。小红书站内投放没测试。


    拓展方式3: 拓产品端。这应该是重点。头像定制生意在整个淘宝一个月的成交额大概在180万左右, 主类风格实际上是日漫风, 我说的这个迪士尼风格反而是少数。从风格、人群、场景出发,
    还是能衍变出很多的, 情侣头像是个大头。以及, 比如给胎儿做头像, 第一次做这个人的人真是个天才, 如图2


    拓展方式4: 也许, 线下摆摊有惊喜。


    拓展方式5: 抖音我看到有人在做转迪士尼风格头像的直播, 当然收徒变现的也必然会有, 不知道数据反馈怎么样, 圈友交流下。


    # 3) 注意事项


    引流用群或私信或小号, 反正生财里有一套完整的针对小红书的引流方式, 不赘述。


    因为AI图的成本极低, 你会的别人也会, 所以一旦大爆, 图片曝光之后, 竞对就迅速上来, 价格就下去了。然后流量红利会缩短比较快, 小红书用户的新鲜度也就会下去。


    但是, 但是, 但是。


    这个项目对一个兼职在家的人非常好, 你一天发一条也不费时间, 坚持发总会好的, 降低期待用时间来耗, 出个几百赞的笔记, 每天能多赚个两三百是没问题的。这种需求比较稳也长期。与把这个生意当做一个模式且想半年1年以上的持续,
    挑战是不同的。'
