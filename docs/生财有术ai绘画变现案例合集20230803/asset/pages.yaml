    # (65赞)(ChatGPT + Al + 绘画 + 设计公司)GPT+ MJ 结合，帮设计公司出方案图


    作者： Sunday


    日期：2023-03-16


    今天我要给大家分享一个我在Chatgpt和Ai绘画航海中学到的一个小技能，就是用gpt+ mj结合，这种帮设计公司出方案图，给甲方爸爸无限选择，接着定稿了，就给设计师出图，大大减少设计师的工作量。👍


    我这段时间就是这样帮朋友接单。费用还不低，而且时间成本相对来讲比较低。😋


    gpt+ mj是什么呢？其实就是两个人工智能软件的缩写。gpt是一个可以生成各种文本的软件，比如说标题、简介、文章等等。mj是一个可以生成各种图片的软件，比如说logo、海报、插画等等。🌟


    这两个软件结合起来就可以做到很多神奇的事情。比如说你想给一个品牌做一个logo，你只需要输入品牌名称和一些关键词，gpt就会给你生成一些logo的描述和建议，然后你再把这些描述输入到mj里面，mj就会给你生成一些logo的图片供你选择。


    同理，如果你想给一个项目做一个方案图，你只需要输入项目名称和一些要求，gpt就会给你生成一些方案图的描述和建议，然后你再把这些描述输入到mj里面，mj就会给你生成一些方案图的图片供你选择。👍


    这样一来，你就不用自己花费很多时间和精力去思考和创作了。而且gpt+ mj生成的内容都很有创意和质量，让甲方爸爸看了都觉得满意和惊艳。


    当然，并不是说用了gpt+ mj就可以完全替代人类设计师了。毕竟人工智能也有它的局限性和缺陷。所以在最后定稿之前还是要请专业的 设计师进行修改和优化才行。但是用了gpt+
    mj之后可以大'
