- pgno: 219
  md: '要出什么攻略我自己都不知道，但就是硬着头皮上了，因为需要交付，所以每天逼迫自己想内容、搜内容，结果扩充了知识库，发现了 Midjourney（MJ）网站。那个时候
    Stable diffusion 网站还没有出现，MJ就是最大的王者，因为它出图速度太快了，出图质量太高了。


    可能因为朋友圈美图重复触达真的很有效果，到临近开营那几天，一下子涨到了二十几人左右，这个时候我才知道之前发的内容都是有用的。


    真正让人数爆发的，是我受邀作商业大课分享，分享了自己产品的制作过程与价值观


    《项目从开始到落地——AI绘圈体验营》（链接）


    我秉持的核心原则是，**宣传不是为了吸引人加入，而是尽可能地阻挡人加入**。我特别担心的是宣传中产生了不恰当的误解，让人误以为可以通过训练营达成，从而付费进来了，之后因为没达成期望，走了。这对用户，对我们都是极差的体验。


    所以我在宣传上，尽可能地降低大家的期望值，把之前列了很多的关于福利的宣传统统删掉（入营后再公布），把大家能在体验营做的事情在宣传上无限地拔低。我们将训练营，改成了体验营，重在体验。


    我在朋友圈宣传用的图，**不是网络大神产生的极其漂亮精美的图片，而是实实实在在的我能做到的图片**。我们将交付，定在了可以辅助学员生成你的第一张图，并且可以让学员生成7种不同风格的图，并告诉你哪些参数可以修改以及修改后的效果，到此，就算交付结束。


    这是我们能提供的价值，我们寻找愿意为我们提供的保底价值支付29.9元的用户，那么除保底价值之外的每一项价值都是超额交付，这是我们宣传的逻辑。我们自信可以做到超额交付，这样对用户，对我们都是一次极佳的体验。


    一些实用总结：


    +   1. 所有帮助他人的事情都是在给自己投资，真正的利己主义者所做的事情都是极致利他。我能落地训练营，几乎都是来自于伙伴们的助推。


    +   2. 想办法创造价值而非创造金钱，金钱只是随价值必然到来的副产品。多想一想法他人提供的价值，是节省了金钱，还是节省了精力时间，还是提供了情绪价值或者其他。


    +   3. 走出开始的那一步最难，中间难，最后也难。


    +   4. 超额交付就是，当无论如何你都能保底交付的价值，别人也愿意为之付费时，此时除了保底，其他都是超额。'
