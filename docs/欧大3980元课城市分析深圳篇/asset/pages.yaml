  md: '# ## 到底谁才是深圳CBD老大？


    # ### 深圳各CBD写字楼热度排序


    ![](img/d7bf174a1304042c515604ac7b70a81f_12_0.png)


    # ### 深圳各CBD写字楼单价租金排序


    ![](img/d7bf174a1304042c515604ac7b70a81f_12_1.png)


    +   - **科技园**的热度高，但单价租金低：以小规模科创公司为主

    - **后海**的热度不高，但单价租金很高：以少数大企业总部为主

    - **前海**的热度不错，单价租金稍低，但空置率一直是各CBD中最高：之前以P2P小公司为主，目前各类小公司都有

    - **福田**中心区热度很高，租户承受单价租金也高：综合实力最好，内力相对深厚


    ![](img/d7bf174a1304042c515604ac7b70a81f_12_2.png)'
