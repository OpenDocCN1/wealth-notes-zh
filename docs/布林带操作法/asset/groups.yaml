    的驅動力量與結構背景。如同表 18.2 顯示的，成交量技術指標根據計算方法可以劃分爲四大類。我們首先簡單介紹這些指標，然的運用，提出一般性評論。


    第一類成交量指標包括能量潮（OBV）與成交量-價格趨勢（V-PT），它們是根據每期價格變動來計算。OBV 考慮收盤價上漲或下跌，V-PT 考慮價格變動%。第二類包括正值成交量指數（PVI）與負值成交量指數（NVI），其計算公式的邏輯結構剛好與第一類相反。這類指標是以成交量變動程度來分析價格，不是以價格變動程度來分析成交量。舉例來說，唯有在成交量下降的期間，NVI
    才會變動。第三類指標考慮期間內的資料，這類指標包括盤中強度與承接／出貨，前者考慮收盤價在價格交易區間的相對位置，後者考慮最高價與收盤價在價格交易區間內的相對位置。這些指標沒有考慮先前期間的資料。第四類指標是把成交量資料運用到其他既有的指標。這類指標包括資金流量指數（MFI）與成交量加權
    MACD（VWMACD），前者屬於韋達（Welles Wilder）的相對強弱指數（RSI）的變形，後者屬於吉拉・亞伯（Gerald Appel）之 MACD
    的變形。換言之，既有的價格技術指標納入成交量資料，結果變爲經過成交量加權的價格指標，分析功能更強（表 18.3）。


    在目前的市場環境中，第三類盤中結構指標與第四類成交量加權指標的用途似乎最廣，也是我們準備討論的主題（但 PVI 也頗値得留意）。首先，讓我們考慮盤中強度指標。'
