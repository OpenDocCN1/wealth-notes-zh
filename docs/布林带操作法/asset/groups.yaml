    # 第 20 章


    # 交易方法 III：反轉系統


    方法 III：當價格觸及包寧傑帶狀邊緣，藉由技術指標的行為，預測趨勢反轉的可能性。首先考慮兩種情況，第一，價格重複觸及帶狀上限而技術指標惡化；第二，價格重複觸及帶狀下限而技術指標轉強。其次，我們單獨觀察價格觸及帶狀邊緣的現象，技術指標當時呈現相反狀況——技術指標在帶狀下限顯示強勁表現，在帶狀上限顯示疲弱表現。


    大約從 1970 年代初期的某段期間開始，我們看到一種流行的技術交易方法，這是把價格均線分別向上與向下平行移動特定百分率，形成價格包絡。換言之，你只要把價格移動平均乘以
    1 加上某特定百分率，就可以繪製帶狀上限，再把價格移動平均乘以 1 減去某特定百分率，就可以繪製帶狀下限。當時個人電腦尚未普及，只能仰賴算盤、鉛筆、草稿紙或計算機，前述這種簡單的計算程序比較適合人工處理。


    由於這套方法能清楚界定高點與低點的意義，所以很快就被短線交易者與選股專家普遍採用。在當時擺盪指標也很流行，很多交易系統採用價格百分率包絡來提供訊號，然後'
  - '[PAGE 232]


    藉由擺盪指標進行確認。當時最著名的一套系統（甚至目前還普遍採用）運用於道瓊工業指數，價格帶狀是以 21 天均線為準，然後上、下取 4%的帶寬，至於擺盪指標則是取兩種大盤統計數據之一。第一項數據是紐約證交所（NYSE）每天上漲家數減去下跌家數的
    21 天總和，第二項數據是 NYSE 上漲交易日成交量減去下跌交易日成交量的 21 天總和。價格觸及帶狀上限，同時兩項擺盪指標之一出現負值讀數，代表賣出訊號；同理，如果價格觸及帶狀下限，而且兩項擺盪指標之一出現正值讀數，代表買進訊號。擺盪指標呈現配合的讀數，可以增進交易信心。對於個別股票來說，大盤統計數據顯然不適用，所以成交量技術指標採用
