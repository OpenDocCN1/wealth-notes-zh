    York Times —Annalist）雜誌的文章②。根據平方根處


    ② 麥奧雷的平方根處理方法文章，根據推算應該刊登在 1930 年代初期，但我翻閱這段期間內的雜誌，卻找不到相關的資料。這個麥奧雷也是就是針對債券存續期間（duration）提出麥奧雷修正存續期間（Mauauley''s
    modified duration）方法的茶位，這也是衡量債券價格波動程度的標準。有關平方根方法的進一步資料，請參考Norm Fosback 的Stock
    Market Logic（參考書目）。


    理方法，價格波動率是價格平方根的函數；對於特定行情變動，不同股票按照各自之起始價格平方根計算的漲幅應該類似。若是如此，低價股的價格變動百分比較大，高價股的價格變動點數較大。依此觀之，相對於高價股來說，低價股的價格波動率較大。這是正確的直覺判斷。根據我們的正常預期，低價股的價格變動百分率應該超過高價股。


    關於過去方法的繪製圖形，以及平方根套入方法的結果，兩者之間沒有顯著的變異。


    利用布林傑方格繪製圈叉圖，可以避免邊際價位造成方格大小突然發生變動的障礙。這種方法顯然需要透過電腦計算，但技術分析目前已經普遍運用電腦③。


    找到理想的股價濾網之後，接下來需要處理股價型態的分類問題。1971 年，羅伯·李維（Robert Levy）首先嘗試針對價格型態進行系統性分類。他採用五點型態的價格擺動圖觀察個別股票的價格波動性，藉以進行分類，並且檢定這些型態的統計顯著程度。雖然李維沒有發現任何具有顯著預測


    ③ RTR 的 TechFilter Plus 可以直接支援布林傑方格。在這套軟體上運用布林傑方格，可以採用 nnmm%的格式設定方格大小，其中 nn 代表乘數，mm
    代表 0.nn*最近價格^0.mm 的次方。就最基本の運用來說，可以把「方格大小」（Boxsize）設定為 1750%，「反轉格數」（Reversal）設定為
    3，「採用」（Use，評估方法）設定為最高價：最低價。我們希望感謝克萊·伯區區（Clay Burch）在這方面提供的協助（http://www.rtrsoftware.com）。


    功能的型態④ ，但留給我們一項有用的工具——五點分類。


    這套方法沉寂了十年，直到亞瑟·美林（Arthur A. Merrill）才重新啟用，並且在 1980 年代初期公佈一系列正面的結果。他同樣採用五點方法，但把李維的價格波動率濾網取代為
    8% 濾網。他把價格型態分為兩大類，16 種屬於 M 頭一般分類，另外 16 種屬於 W 底一般分類⑤ 。


    美林按照由高到低的五點順序分類，並依此序號設定名稱。M1 是強烈的下跌型態，中間的 M8 與 M9 屬於平緩型態，M16 則是強烈的上升型態（圖 11.10）。同理，W1
    是下降型態，中間序號的 W 型態屬於平坦狀，M16 是上升型態（圖 11.11）。


    我們把這些型態整理、列示在本書最後封面的內頁，方便讀者查閱。美林認為，某些型態本身具有預測功能。關於進一步資料，請參考他的著作《M 頭 & W 底波浪型態》（M&W
    Wave Patterns）。美林另外也按照市場技術分析者習慣使用的傳統名稱，來把這些型態加以分類（表 11.3）。


    ④ 他所進行的檢定之所以失敗，主要是因為採用個別股票的價格波動率做為濾網，除了雜音之外，很多訊號也被過濾。當法人機構交易平台 www.Pattern Power.com
    採用相同的型態，但利用布林傑方格取代價格波動率做為濾網，就發現顯著意義的結果。


    ⑤ 不論 M 頭或 W 底，都是由四個擺動銜接的五點型態。五點總共有 32 種（2^5）不同的可能組合型態。


