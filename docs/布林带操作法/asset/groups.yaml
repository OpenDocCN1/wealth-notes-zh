    移動平均顯然需要利用第一年的價格資料，「擠壓」也需要運用第一年的資料，所以第一年至少有某段期間不適合提供交易訊號）。三個不同的三年期為 1990 年～1992
    年、1992 年～1994 年與 1994 年～1996 年。在這三個不同期間分別完成最佳化程序之後，可以決定三組最佳參數值，然後利用 1996 年～1999
    年的歷史資料，測試相關交易系統的績效；同樣的，1996 年只做為助跑期，實際測試則利用 1997 年～1999 年的資料（請注意，實際測試進行的 1997
    年、1998 年與 1999 年，完全沒有與最佳化期間重疊）。如果交易系統確實有效的話，三組參數值的測試結果應該很類似；類似的程度愈高，意味著把這套系統運用到將來的成功機率也較高，這也就是所謂的交易系統「穩健性」（robustness）。


    另一個辦法是把測試對象劃分為幾種性質不同的組別，例如：績優股／投機股、成長導向／價值導向、小型股／大型股、低價股／高價股……等。然後觀察測試結果是否具備一致性。總之，我們希望交易系統與參數值具備預測或分析能力，不是單純根據已經發生的資料所歸納結果；此外，也希望它們能普遍試用，不是只適用於少數股票。最後，我們必須測試參數值是否禁得起考驗，是否具備穩健性：變更參數值，幅度不要太大，但必須足夠明顯，然後重新測試。如果交易系統夠穩健，測試結果也應該差不多。舉例來說，如果
    20 期的結果最理想，那麼 18 期與 22 期的結果也不應該太差。


    下一章將討論成交量指標，然後考慮兩種藉由技術指標


    在包寧傑帶狀內或附近確認價格行為的兩種方法。


    ## 本章內容重點


    - 利用技術指標確認價格觸及包寧傑帶狀的訊號。

    - 優先考慮成交量技術指標。

    - 避開共線性的問題。

    - 實際進行交易之前就挑選所需要的技術指標。

    - 藉由預先建立的樣板進行分析。

    - 如果你決定採用最佳化程序，務必小心謹慎。


    ## 第 18 章


    ## 成交量技術指標


    關於我們建議的方法或你所採用的方法，如果希望稍作調整，本節的資料非常實用。如果讀者患有數學恐懼症，可以考慮省略本章的後半部分，但至少應該閱讀隨後幾段。


    對於技術分析來說，成交量指標屬於最重要的指標類別之一。它們在分析架構內引進一項新的自變數——成交量——直指供、需方程式的核心。在某種程度內，所有的成交量指標都反映一個根本觀念：「量」是「價」的先行指標。舉例來說，在股票打底過程，精明的投資人會慢慢承接；在漲勢的末期階段，精明資金會在頭部發生之前出場。


    成交量指標在運用術語方面遭遇很大的困擾。對於任何兩套交易軟體，相同名稱通常都不代表相同東西。為了避免誤解，表 18.1 列舉一些成交量指標名稱與發明人，至於相關計算公式，請參考表
    18.3。如此一來，讀者就可以確定交易套裝軟體與我們討論的成交量指標是否相同。


    ## 表 18.1 成交量指標與發明人


    | 指 標 | 發明人 |

    |---|---|

    | 能量潮<br>(On Balance Volume) | 法蘭克．維格諾拉（Frank Vignola）<br>喬．葛蘭威爾（Joe Granville）
    |

    | 成交量-價格趨勢<br>(Volume-Price Trend) | 大衛．馬克史坦（David Markstein） |

    | 負值／正值成交量指數<br>(Negative and Positive Volume Indices) | 保羅．狄沙特（Paul Dysart）<br>理查．狄沙特（Richard
    Dysart） |

    | 盤中強度<br>(Intraday Intensity) | 大衛．波斯提安（David Bostian） |

    | 承接／出貨<br>(Accumulation Distribution) | 拉利．威廉斯（Larry Williams） |

    | 資金流量指數<br>(Money Flow Index) | 吉尼．匡恩（Gene Quong）<br>艾佛蘭．舒代克（Avram Soudek） |

