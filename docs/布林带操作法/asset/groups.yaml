    類似如雙重底（W 底）的排列中，結構內通常會出現更小型的排列，尤其是觀察時間架構較短的走勢圖。舉例來說，如果你在日線圖上看到某個底部排列，那麼可以仔細分析小時走勢圖，觀察其中是否存在形態底部，藉以確認日線圖上的排列。


    現在，假定你已經找到某個符合條件的 W 底，而且你對於自己的判斷相當有把握，接下來應該怎麼做呢？在價格出現強勢表現的時候，進場買進。等待價格出現彈升走勢，價格交易區間明顯擴大而超過平均水準，而且成交量顯著放大，然後進場買進（圖
    12.8）。這種彈升走勢可以視為確認訊號，顯示漲勢已經正式展開。


    ![](img/94739d716a8c23abc5f5258874db296f_150_0.png)


    圖 12.8 Chevron：W 底，長紅線買進，150 天資料。當天價格開低走高，拉出長紅走勢，而且成交量顯著放大，這代表 W 底完成之後的買進訊號。


    初步的停損點應該設定在最近低點——第二個底部——的稍下方，並透過合理方式持續向上調整。你可以採用韋達（Welles Wilders）的拋物線系統（Parabolic
    System）設定停損點（停止點），每天向上調整停損，或者可以根據肉眼判斷，把停損設定在最近拉回或整理走勢的最低點稍下方。


    市場價格難免發生波動；在結束部位之前，你所允許價格出現的波動程度，將顯著影響你的操作績效。停損設得太緊，將導致太多過早出場的交易；停損設得太鬆，又會讓你流失大部分已經到手的獲利。我們認為，部位建立當初，最好採用相對較寬的停損，然後逐漸調緊，直到你找到符合自己風險／報酬偏好的停損設定方法為止。


    當我們進行價格型態的研究時，發現各種排列經常呈現類似的基本面與心理面因素。這讓我們想起技術分析的目標與宗旨：辨識行情的重要關鍵，使得交易部位能夠掌握明確的勝算。為了達到這個目的，必須能相信自己看見的型態；另外，為了取得前述信念，必須瞭解導致價格型態之所以發生的因素。技術分析不是一種可以孤立存在的科學；這是反映投資人受到基本面與心理面因素驅動——更恰當來說，受到預期事實驅動——而產生的行為系統性描述。


    技術分析經常利用一些術語描述各種狀況，某些非常明確，有些很模糊，更有一些相當晦澀。除非這些術語能精確反映根本事實，否則就沒有什麼用途。舉例來說，如果 W 底的第二個底部價位較低，結果經常演變為頭肩底排列（圖


    12.9）——換言之，多出兩波價格擺動之後，W8 演變為 W14 或 W16。簡單來說，上升趨勢剛開始時，投資人普遍懷疑價格漲勢，獲利回吐的壓力導致走勢拉回而形成右肩。可是，頭肩排列比較容易發生在頭部，這也是下一章準備討論的主題。


    ![](img/94739d716a8c23abc5f5258874db296f_152_0.png)


    圖 12.9 NPC：頭肩底，W8 與 W10，300 天資料。複雜的 W 底演變為頭肩底。


    ## 本章內容重點


    - ■ W 底的各種變形，是最常見的底部型態。

    - ■ 突兀狀底部排列偶爾會發生，但非常罕見。

    - ■ W 排列可能演變為橫向盤整的底部，不一定出現趨勢反轉。

    - ■ 包寧傑帶狀有助於判斷 W 排列。


    - - W 底完成之後，在強勁表現中進場買進。

    - - 設定追蹤性停損點（停止點），藉以控制風險

    - - www.BollingeronBollingerBands.com 每個交易日都會列出 潛在的 W 底排列。


    ## 第13章


    ## M頭型態


    頭部排列與底部排列之間存在重大差異，M 頭顯然不同於 W 底。速度、價格波動、成交量與定義——這一切都有頗大差異。所以，具備類似重要性的頭部與底部，結構未必彼此對應。價格型態只不過是投資人心理狀態的反映。「恐懼」的情緒強度遠超過「貪婪」，所以「恐懼」遺留在價格走勢圖上的痕跡更清晰。絕大部分底部排列都屬於某種
    W 底的變形，但頭部型態就顯得更複雜，大多是三重頂（triple top）的某種變形。就如同恐慌性殺盤造成的 V 形底部一樣，上升趨勢偶爾也會出現突兀狀頭部，導致漲勢突然反轉。這類
    V 形反轉走勢的發生機率都很低；M 頭（雙重頂）較為常見：在正常的上漲過程中，價格拉回整理，整理完成之後，價格繼續向上攀升，但不能有效突破前一個高點的壓力，結果價格再度下滑，從此展開下降趨勢（譯按：根據一般定義，第二個峰位出現之後，一旦價格跌破兩個峰位所夾的谷底位置，M
    頭即告完成）。三重頂應該是最常見的頭部型態，頭肩頂——這可能是投資人最耳熟能詳的技術分析術語——就是屬於三重頂的變形。


    讓我們詳細說明頭肩頂排列的演變過程（圖 13.1）。在上漲趨勢中，價格小幅拉回，這個峰位稱為「左肩」。隨後，價格恢復漲勢，並且穿越左肩而創新高價，然後出現一波較深的下跌，這個峰位也就是「頭」。頭部完成之後的回檔低點，通常對應左肩的回檔低點位置。這時，最典型的價格排列是
    M15。最後，價格再度上漲，但漲勢難以為繼（無法創新高）而下滑，這個峰位稱為「右肩」。右肩的價位經常對應左肩。請注意，左肩、頭與右肩之間夾著兩個谷底，如果利用一條直線銜接這兩個谷底，該直線稱為「頸線」（neckline）。右肩之後的價格跌勢一旦向下穿越頸線，頭肩頂排列即告完成；換言之，多經過兩波價格擺動之後，M15
    演變為 M12 或 M7。排列完成之後，價格經常會回升測試頸線壓力。右肩與反彈測試頸線的走勢，這兩個價格擺動構成 M1 或 M3 型態，


    ![](img/94739d716a8c23abc5f5258874db296f_156_0.png)


    圖 13.1 典型的頭肩頂排列。這是最常見的頭部型態。


    之後的跌勢就會趨於明顯。在頭肩頂排列的上漲過程，成交量經常呈現典型反應——左肩的成交量最大，頭與右肩的成交量萎縮，跌勢正式展開之後，成交量再度放大。


    價格排列與成交量型態都反映出市場的根本心理狀態。

    陶醉與貪婪是「左肩」形成的心理背景，消息面（謠言）經常是驅動行情發展的主要因素。這段期間的成交量很大，交投熱絡。「頭」部通常都發生在消息正式公佈或謠言成真時。雖然價格創新高，但成交量並沒有配合創新高；換言之，「價」與「量」之間發生背離現象。市場中有一句至理名言：「消息成真則賣出」；那些預先得知內線消息或預期利多消息即將公佈的短線交易者，這時都開始獲利了結，這是「頭」部發生的重要因素。這些獲利回吐的賣壓，配合悲觀者的拋空擠壓，「右肩」的走勢顯得有氣無力，成交量萎縮，交投相對冷清。一旦右肩形成之後，真正的跌勢開始浮現；隨著「頸線」被賣穿，成交量又放大，恐懼瀰漫市場。最後，空頭回補力道促使價格回升到頸線附近。（為了結束空頭部位，放空者必須回補或買回股票。）對於持股者來說，價格回升測試頸線的走勢，是最後的出場機會。請參考圖
    13.2 的實際案例。


    非常幸運的，包寧傑帶狀可以協助釐清前述一系列行情判斷。處理頭部排列的最簡單辦法，是把「整體」拆散為一系列 M 頭與 W 底的「個別成分」。相對於大型排列來說，這些較小的成分型態比較容易處理。可是，首先還是讓我們來觀察標準的大型頭肩頂排列。


    ![](img/94739d716a8c23abc5f5258874db296f_158_0.png)


    圖 13.2 Vishay：頭肩頂排列實例，250 天資料。絕對完美的排列很少見，留意關鍵因子。


    就典型的發展來說，「左肩」通常會穿越包寧傑帶狀上限，「頭」則會觸及帶狀上限，「右肩」通常無法到達帶狀上限（圖 13.3）。在最理想的情況下，右肩發生當時的頸線應該位在帶狀中心點附近，貫穿頸線的第一波跌勢應該在帶狀下限停頓。折返漲勢通常都會停止在帶狀中心線，這波漲勢在頸線附近被壓回之後，第一波跌勢通常會穿越帶狀下限。當然，上述發展只代表最理想的頭肩頂排列，實際見到這種走勢的機會不大。總之，市場上看到的實際頭肩頂排列大體上會順著理想狀況發展，但難免穿插著一些不甚標準的變形。


    頭肩頂型態有一種相當常見的變形：三波段衝刺創高點（three pushes to a high，圖 13.4）。這種走勢通常屬於另一個


    ![](img/94739d716a8c23abc5f5258874db296f_159_0.png)


    圖 13.3 S1：頭肩頂排列與包寧傑帶狀，300 天資料。結構相當混亂，但「五臘俱全」。


    ![](img/94739d716a8c23abc5f5258874db296f_159_1.png)


    圖 13.4 Juniper：三波段衝刺創高點，200 天資料。請注意，最後高點出現之後，線形基本上都是陰線。


    更大 型頭部排列的初期發展。就最典型的型態來說，第一波段衝刺高點會穿越包寧傑帶狀上限，第二波段衝刺會觸及帶狀上限，並且創新高價。第三波段衝刺可能會勉強創新高（但經常不會），但不能到達帶狀上限。隨著排列的發展，成交量會持續萎縮。整個型態透露出動能不斷消失，也是很多股票在頭部的典型表現。這種排列的最標準建構積木則是
    M15s 與 M16s。


    頭肩頂排列的第一部分是由 M 頭構成，包括「左肩」與「頭」。這部分的標準型態是 M14 與 M15，或兩者的混合。接著是包括「頭」與「右肩」的另一個 M 頭，這部分的標準建構積木則是
    M3 與 M4，或 M7 與 M8。至於「右肩」與折返測試頸線的漲勢，兩者也構成 M 頭，通常屬於 M1 或 M3。可是，當「頭」與「右肩」所夾的第一個谷底出現後，也可以整個發展視為一系列的
    W 底，當時的趨勢已經朝下偏頗，每波段價格峰位持續下滑，甚至谷底位置也不斷下降。在這種情況下，折返測試頸線的漲勢可以視為 W1 或 W2 ①。


    當然，你還可以做更細節的分析，考慮頭肩頂排列內的每個 M 頭與 W 底——總共有 5 個（譯按：3 個 M 頭，2 個 W 底）——檢視每個型態的相關性。可是，實務上並沒有必要這麼做，除非是短線交易者準備在
    M 頭或 W 底的型態內進行操作。對於部位交易者來說，觀察整個排列的演變，留意


    ① 就我個人來說，分析頭部排列的過程中，我還是習慣繼續採用 M 頭的觀點，就像底部型態適合採用 W 底的觀點一樣。


    趨勢發展的大方向，就已經足夠了。


    就如同底部排列一樣，頭肩頂之類的頭部排列也可能包含一些較小的型態，尤其是在更短的時間架構上。所以，如果我們在日線圖上看到頭肩頂排列，往往可以在小時走勢圖上也看到足以提供確認的頭部型態。


    一旦察覺某個符合條件的頭部型態，務必等待走勢明顯轉弱的確認訊號，然後才可以採取行動。所謂的走勢明顯轉弱訊號，可能是成交量或價格交易區間遠超過平均水準。這是前幾章沒有提到的成功關鍵：耐心。在走勢轉弱的徵兆發生之後，通常會出現逆勢的上漲行情，這就是理想的進場點。舉例來說，當價格跌破頸線而重新折返測試頸線，這是空頭部位的最佳進場點（圖
    13.5）。當然，底部排列的情況也是如此，但這類機會在頭部排列內更清楚。很多專業交易者都試圖在這種節骨眼上建立部位，因為這類走勢可以界定明確的風險／報酬關係，停損點可以設定在折返走勢高點的稍上方。總之，關鍵是理想的風險／報酬比率。


    頭部排列與底部排列的情況一樣，相對高點或相對低點才是關鍵所在。很多情況下，即使價格繼續創絕對新高，你的看法仍然應該轉趨謹慎。根據我們所瞭解，包寧傑帶狀是判斷相對位置的唯一適當工具。如果價格繼續創新高，但前一個高點穿越包寧傑帶狀上限，最近高點卻沒有穿越帶狀上限（尤其是與帶狀上限還有一段距離的話），情況就非常可疑。這套系統是唯一能在價格創新高或新低的過程中，穩定


    提供警訊的方法。最典型的走勢為：價格穿越帶狀上限而創新高，拉回整理，重新走高而觸及帶狀上限，再拉回，最後一波漲勢根本不能到達帶狀上限。我們稍後將在第 IV
    篇詳細說明，如何結合這方面的訊號與技術指標，使你在關鍵時刻能夠更精確的判斷行情發展。


    ![](img/94739d716a8c23abc5f5258874db296f_162_0.png)


    圖 13.5 Integrated Device，價格折返頸線的放空機會，150 天資料。這究竟代表「右肩」的一部分？或折返頸線的漲勢？答案並不重要；重點是它提供低風險的進場機會。


    ## 本章內容重點


    - □ 頭部排列的複雜程度超過底部排列，行情判斷比較困難。

    - □ 頭肩頂排列是最著名的頭部型態。


    - - 三波段衝刺創高點，是一種相當常見的頭部型態。

    - - 動能持續消失，是頭部排列的特性。

    - - 等待弱勢表現的訊號。

    - - 尋找逆勢上漲的放空機會。

    - - www.BollingeronBollingerBands.com 每個交易日都會列出潛在的 M 頭排列。


    ## 第 14 章


    ## 漫步帶狀邊緣


    我們已經談論了頭部與底部排列，但持續發展的走勢又如何呢？當趨勢持續朝某個方向發展，這可能是最難以處理的困境。關於帶狀、包絡或通道，一旦價格觸及帶狀上限或帶狀下限，很多人就盲目的賣出或買進，這或許是運用上最嚴重的錯誤之一。如果這類觸及帶狀邊緣的現象，屬於更大反轉型態的一部分，或不能得到技術指標的確認，也許真的代表賣出或買進訊號——但也可能不是。當價格走勢觸及帶狀邊緣，這個現象本身絕對不足以代表交易訊號。


    讓我們引用美國股票市場做為例子，說明股價觸及包寧傑帶狀上限的現象未必代表賣出訊號。1998 年 6 月，美國股票市場出現嚴重的修正走勢。請觀察 1998 年
    10 月份的情況（圖 14.1）；當時，修正走勢已經結束，W8 底部排列已經完成，S&P 500 指數展開一段延伸性漲勢，持續到隔年的整個上半 年。在這段上漲過程中，價格多次觸及包寧傑帶狀上限——當價格由
    W8 底部開始上漲的第 8 天，就首度觸及帶狀上限。所有這些觸及現象，都不代表賣出訊號——至少對於中期玩家而言是如此。這一系列的觸及走勢，稱爲「漫步帶狀邊緣」(walking
    the band)，在延伸性走勢中經常出現。


    ![](img/94739d716a8c23abc5f5258874db296f_166_0.png)


    圖 14.1 S&P 500 股價指數，包寧傑帶狀，由 1998 年秋天到 1999 年春天。價格持續沿著帶狀上限發展，始終沒有觸及帶狀下限。


    就上升趨勢的發展過程來說，價格往往多次觸及包寧傑帶狀上限，甚至有幾天的收盤價會穿越到帶狀之外（圖 14.2）。同理，在下跌走勢內，包寧傑帶狀下限經常被觸及或穿越。請注意，收盤價穿越帶狀，這個現象是連續訊號，不代表反轉訊號。當然，這可能屬於某個反轉訊號的初期構成部分，但其本身絕對不足以被視爲反轉訊號。一般來說，價格型態會因爲帶狀內部出現一個不能得到確認的峰位或谷底而發出反轉訊號，但在反轉訊號發出之前，該型態可能會發出許多連續訊號。


    ![](img/94739d716a8c23abc5f5258874db296f_167_0.png)


    圖 14.2 Vishay，漫步帶狀上緣，以及隨後發生的 M 頭排列，350 天資料。收盤價穿越帶狀上限，這是上升趨勢持續發展的訊號。


    在價格漫步帶狀邊緣的期間，很多開放型的成交量指標①——尤其是盤中強度指標（Intraday Intensity，簡稱 II）或承接／出貨指標（Accumulation
    Distribution，簡稱 AD）——有助於釐清當時的狀況（圖 14.3）。當行情趨勢發展非常明確時，因為這類開放型指標經常可以扮演趨勢闡釋者的角色，能與價格走勢直接對照，所以較一般的擺盪指標更適用。為了方便與價格走勢對照，可以把
    II 或 AD 走勢圖與價格走勢圖並列，但採用不同座標刻度。


    ① 成交量指標之類的技術指標，經常都有兩種不同形式，包括開放型與封閉型。開放型指標通常都是計算某個起始日期以來的累積總和。封閉型指標也是計算加總和，但加總期間只有固定期數，例如：10
    期或 20 期。開放型指標的走勢圖通常都與價格走勢圖並列，方便於直接比較；封閉型指標的走勢圖通常另外繪製，往往也稱爲擺盪指標（oscillators）。

