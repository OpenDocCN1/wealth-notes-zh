    型態辨識是技術性操作是否能夠成功的關鍵。布林傑帶狀則是型態辨識是否能夠成功的關鍵，尤其是配合其他指標運用。下一章將介紹一種判別型態的方法，讓你能夠在各種市況下都大有斬獲。


    ## 本章內容重點


    - M 頭與 W 底是最常見的價格型態。

    - 價格型態經常存在碎形現象。

    - 布林傑帶狀有助於釐清價格型態。

    - 在典型的反轉型態內，第一個低點（高點）經常落在布林傑帶狀下限（上限）之外，但第二個低點（高點）則會留在帶狀下限（上限）之內，即使第二個低點（高點）可能創絕對新低（新高）。

    - 成交量與動能指標都有助於診斷頭部與底部排列。


    ## 第 11 章


    ## 五點型態


    運用一項簡單的工具——價格濾網——幾乎就可以把所有的股價型態清楚分類。這是利用線段持續銜接走勢圖上的高點與低點，只要高、低點之間的擺動距離超過特定點數或百分率（後者似乎更有用）。


    不同分析對象的價格濾網大小顯然應該不同，道瓊工業指數可能採用 100 點，IBM 可能採用 2 點。隨著絕對價格的演變，特定點數所代表的百分率水準也不同。一般來說，百分率濾網比較合理，因為這對於任何價格而言都代表相同經濟價值。對於股票來說，固定點數的價格濾網實在沒有太大意義①。如果採用
    8％的濾網，價格 10 點的 8％是 0.8 點，價格 100 點的 8％是 8 點；反之，如果採用 8 點的濾網，濾網大小相當於是價格 100 的 8％或價格
    10 的 80％。由於股票的交


    ① 對於期貨契約來說，固定點數的價格濾網或許恰當，這主要是因為保證金運作制度的緣故。交易者建立期貨部位，並不需要支付全額的契約價值，只需要存入部分款項而足以代表履約承諾即可，保證金額度基本上不會因為價格水準變動而調整。所以，不論期貨價格水準如何，1
    點走勢對於交易者的經濟價值都相同。


    易價格水準差異頗大，點數濾網顯然不適合用來比較不同的股票。


    股票運用 2%~10%的濾網，結果通常不錯，而且適合不同股票之間的比較。關於百分率濾網的實際運用情況，請參考圖 11.1 到圖 11.6。每個圖形都顯示相同的價格走勢圖，但價格濾網的百分率陸續提高。我們發現，曲折的擺動線過濾不少雜音，而且網目隨著百分率提高而放大，最後的圖
    11.6 只顯示單一擺動。擺動圖的功能是充分過濾雜音，藉以凸顯價格型態，但不應該讓重要資訊因此而流失。


