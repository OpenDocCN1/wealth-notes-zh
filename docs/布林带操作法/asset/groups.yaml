    ## 包寧傑帶狀數學公式


    ## 20 天移動平均


    c̄ = Σ₁²⁰ cᵢ / 20


    ## 20 天標準差


    s = √[ Σ₁²⁰ (cᵢ - c̄)² / 20 ]


    ## 包寧傑帶狀上限


    c̄ + 2 * s


    ## 包寧傑帶狀中心線


