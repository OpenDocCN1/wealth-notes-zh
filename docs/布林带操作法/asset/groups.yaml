    我們的價格波動率突破系統採用帶寬指標設定前提條件，然後等待突破發生當時建立部位。關於部位的停損或出場，可以採用兩種方法。第一是韋達的拋物線系統③，觀念非常簡單而有效。就買進部位來說，起始停損設定在突破排列的稍下方，然後每天向上調整。至於空頭部位，停損設定方法的觀念也相同，但位置剛好相反。拋物線是一套相對保守的系統，如果使用者願意承擔更大風險，嘗試掌握更大的獲利潛能，「價格觸及帶狀對邊」可以做爲理想的出場訊號。


    ② 1980 年代中期，史提夫·諾提斯（Steve Notis）在專業突破系統（Professional Breakout System）整理很多這類技巧。


