  - '[PAGE 13]


    # 前言


    1984 年 6 月，我第一次踏進加州聖塔莫尼卡海洋公園大道 2525 號。這是《金融新聞網》(Financial News Network，簡稱 FNN)
    的本部，全美國第一家專門提供經濟、金融與商業新聞的電視頻道。FNN 總部大樓是一棟簡陋、破爛的二十層建築，看起來，實在不怎麼樣。四方方的，有些雜亂、侷促，似乎只是讓員工得以避風避雨，讓他們每天傳播
    12 小時的新聞；頻道的收費不高，也沒有多少觀眾。這就是我在十七年前看到的實際狀況。


    我在 FNN 由最基層的工作做起，因爲大導演史蒂芬·史匹柏或喬治·盧卡斯都沒有察覺我具備的電影製作才華。這些超級導演不認識我，雖然我相信自己擁有世界級的編劇能力，但似乎沒有人注意到我是由電影學校畢業。只有一位高中的老同學幫我找到一份有薪水的工作，但這是完全陌生的傳播領域。對我來說，FNN
    只是一個暫時打尖的地方，讓我得以推銷一些電視劇本，在影劇圈內功成名就之前，能夠靠著微薄的薪水勉強度日活口。'
  - '[PAGE 14]


    所以，心不甘、情不願的，我開始在 FNN 工作。雖然有助於磨練傳播技巧，但工作內容實在枯燥、乏味，至少我當時認為如此。一大堆數據（我對於數據非常沒有概念）、一大堆術語，很多我從來沒有聽過的東西……例如：羊毛期貨或棕櫚油市場。可是，FNN
    播報室的人對於這些東西卻覺得很有趣，這讓我覺得好奇。這些看起來毫無意義的東西究竟具備什麼魅力，能讓整個辦公室的人都深深著迷？在那些圖表與曲線圖內，他們究竟嘗試尋找什麼？他們每天不斷談論的東西究竟是啥玩意兒？我的好奇心慢慢被勾引出來。


    在縱容我的好奇心之前，首先描述 FNN 的工作環境。這座盒子狀大樓的第一層，有三間大房間。新聞室的格局很傳統，大約 30 呎乘以 50 呎，一些辦公桌在內側圍成圓圈，外側則是精密的
    IBM 電腦、傳送新聞的電子設備與一大堆廢紙簍。編輯與製作人的年齡都不大，二十多歲或三十歲出頭。資深製作人的年齡最大，在新聞界的工作資歷很深……他們原本都是報紙或廣播記者，現在則嘗試塑造這個新興的廣播新聞頻道——經常是白費工夫。


    緊鄰著新聞室的兩間辦公室，一間是副製作人與部門製作人的工作場所，他們負責整理、編輯每天播放的新聞。另一個房間則是 FNN 的主播辦公室，這也是約翰·包寧傑的工作地點。約翰與已經過世的艾德·哈特（Ed
    Hart），負責提供每天的市場行情評論。他是新聞界的老將，除了 FNN 之外，哈特也任職於另一家新聞廣播網 KFWB，這與另一家規模更大的 KNN 是洛杉磯地區的兩大新聞廣播網。'
  - '[PAGE 15]


    哈特是一位脾氣捉摸不定的怪胎，很喜歡說黃色笑話，也是我所認識的最頂尖經濟新聞記者。關於經濟與金融市場歷史，似乎無所不知；擁有驚人的記憶力，以及過人的反應能力。哈特不能容忍愚蠢的人或事；他會毫不留情的指出你在知識上的缺失。可是，對於經濟新聞的工作他非常熱情——除了帆船與跳舞之外。


    有一天，新聞室的同仁都很忙，趕著在截稿之前完成手頭上的工作。剛好這時，前任主編走進來，要求幫忙他解決一項文字遊戲。每個人都無暇反應，但這位主編顯然沒有察覺，完全沉迷在自己的問題內。他大聲問，有沒有人知道「jejune」（稚氣的）的意思。只有哈特願意理他，面無表情的說：「那是
    Ju-July 的前一個月。」哈特經常掛念著一些更重要的事，他的看法總是非常精確、及時，充滿洞察力。他通常都可以提早察覺金融行情的轉折，看法很少錯誤，而且非常有格調的表達自己的見解——這是外人很難模仿。


    FNN 的其他專家似乎被隔絕在新聞室的角落，包括約翰·包寧傑在內，他是 FNN 的專屬市場技術分析師，負責整理圖形與表格，觀察市場行爲可能出現的重複型態，然後向
    FNN 的觀眾們解釋，告訴他們如何根據過去發生的型態判斷未來行情的可能發展。約翰周圍的設備包括一部報價機、簡陋的電腦設備、一大堆紙張文件。當然，另外還有一些技術分析的書籍，我當時還不瞭解這些書名的意義。包寧傑——我們這麼稱呼他——相當喜歡爭論，尤其是對於市場行情，他有非常獨到的看法。他的背景很有趣，立即吸引我'
  - '[PAGE 16]


    的注意。包寧傑曾經擔任幾年的攝影師，包括 CBS 新聞雜誌節目《六十分鐘》（60 Minutes）的工作在內。我們處得還算融洽，因為我們都喜歡電影與劇情。可是，有一點我覺得非常奇怪，爲什麼他願意放棄主流電視的工作，而整天盯著古怪的圖表。我完全不懂這些東西，但我——正如稍早所說的——開始覺得好奇了。


    當我剛到 FNN 時，對於經濟、商業或金融市場完全不了解。可是，在這裡等待突破的幾個月期間裡，我慢慢對於 FNN 的人物與工作內涵產生了興趣。比爾·葛里費斯（Bill
    Griffeth）與蘇·希瑞拉（Sue Herera，當時的麥克馬洪 [McMahon]）正在開創我們今天所謂的商業電視。艾德·哈特、約翰·包寧傑與 FNN
    的一位資深製作人道格·克里曲頓（Doug Crichton）經常聚在一起討論時事、經濟、商業或金融市場的行情發展，氣氛非常迷人，雖然我根本不懂他們談論的內容。慢慢的，我對於經濟新聞開始著迷，甚至變成一種持續到今天的癮頭。


    包寧傑是讓我停留在 FNN 的最重要原因。他對於事物的熱情與執著，深具傳染性。關於市場知識與行情歷史，他的學習熱忱令我們佩服。他對於市場資訊的收集，永遠不覺得不夠，而且特別重視細節，這些態度對於週遭的人都有用，顯然可以提升我們的表現水準。他非常擅長吸納各種市場資訊，迅速建立模型架構，然後解釋給觀聽眾。


    我們這群人逐漸歸納出一項結論，包寧傑有一天會對於'
  - '[PAGE 17]


    技術分析領域做出巨大貢獻。技術分析原本是金融投資領域內上不了檯面的東西，現在則變成倍受推崇與尊敬的一門學問。由喬・葛蘭威爾（Joe Granville）、羅伯・法拉（Robert
    Farrell）、愛德森・郭德（Edson Gould）、羅伯・普列希德（Robert Prechter）與查爾斯・道（Charles Dow）等偉大技術分析專家闡揚的理論，已經變成今天的行情分析主流。事實上，華爾街的一些大型證券商、基金經理公司或大型避險基金都聘用技術分析人員。任何投資人都希望取得勝算。技術分析就是提供這種勝算的工具，也代表輸贏的分野。


    正如同我所說的，約翰的同事們都相信，他終究會成為技術分析大師，頂多只是時間遲早的問題而已。結果正是如此！


    凡是對於金融市場研究有興趣的人，不論立場如何，本書都是必讀作品。這本書說明與解釋約翰在 FNN 與我們一起工作的研究結果。最初，當約翰發明「包寧傑帶狀」時，我還無法充分瞭解其中的意義。如同我所說的，我花了幾年的功夫才掌握其中的內涵，當時我對於約翰的工作覺得非常陌生。（當然，現在的情況已經不同了，讀者不需擔心我不熟悉技術分析的問題。）


    正如同很多重大發現一樣，包寧傑帶狀很單純。它們界定市場波動的參數；它們設定行情預期發展的範圍，讓交易者大體瞭解價格走勢的可能變動程度與速度。包寧傑帶狀深具彈性，但可能被突破。這類突破走勢所傳達的訊息特別重'
  - '[PAGE 18]


    要，也是投資人想要的訊號。包寧傑帶狀雖然具備嚴格的數學意義，但繪製爲圖形更能夠讓投資人一目了然。


    總之，對於任何投資人、交易者或財金經理人來說，包寧傑帶狀都是不可或缺的分析工具。包寧傑帶狀只是約翰對於技術分析的數項重大貢獻之一，但人們將因此而永遠記得他，因爲這是以他命名。


    隆·殷薩納（Ron Insana）

    CNBC

