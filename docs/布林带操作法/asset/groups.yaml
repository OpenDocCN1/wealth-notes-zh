    deviation）。計算價格波動率的資料與計算移動平均的資料相同。根據預設參數值，移動平均±2 個標準差，分別代表帶狀上限與帶狀下限。


    現在，我們已經知道包寧傑帶狀的定義，接下來將學習它的運用方法。


    約翰·包寧傑


    ## 謝 辭


    任何事物都不能單獨完成。


    首先是我的父母——父親讓我瞭解數學的樂趣，教我如何飛揚；母親信賴我，把她的生活憑藉完全交由我決定。


    如果沒有我的妻子桃莉，這一切都不可能；我的女兒卓爾則是太陽能夠升起的動力。


    我剛認識瓊·瑞納（Jon Ratner）時，他是貝克公司（AG Becker）的經紀人，現在則是一位好朋友。他促成很多事情，尤其是透過他的介紹，我認識了查爾斯·史佩思（Charles
    Speth）與霍利·漢德立克（Holly Hendricks），讓我有機會學習交易。後來，瑞納又說服公司經理，提供給我一套報價機與櫃檯，使我能夠進行操作。


    厄爾·布萊恩（Earl Brian）是金融新聞網的董事長，感謝他信賴我與電腦化技術分析。


    我希望藉此機會感謝馬克·柴京（Marc Chaikin）、史提夫·路索（Steve Leuthold）、唐·沃登（Don Worden）與吉姆·葉慈（Jim
    Yates），他們讓我瞭解很多技巧與概念，尤其是亞瑟·美林（Arthur Merrill）所設定的超高標準。


    本書走勢圖與測試程序所採用的資料，都由布里集公司（Bridge）透過布里集網站（Bridge Station）http://www.bridge.com 提供。大部分測試都採用微軟的
    Excel 軟體進行。本書的走勢圖大多透過一種公開的科學繪圖軟體 gnuplot 繪製。我利用微軟的 Visual BASIC 語言編寫 gnuplot 處理軟體，然後透過
    DDE 下載布里集的資料，最後編寫走勢圖的資料檔。


    公用軟體讓我可以活躍於電腦領域，我由衷感謝很多傑出的程式設計師，他們無私地貢獻自己所研究的作業軟體，例如：Linux 與 gnuplot。如果讀者需要 gnuplot
    的進一步資料，請上網查詢（http://www.gnuplot.org）。如果讀者希望查詢公用軟體，下列兩個網站是很好的起點：The Open Source
    Initiative（http://www.opensource.org），Free Software Foundation（http:// www.fsf.org，自由軟體運動的創始者）。


    ## 第Ⅰ篇


    ## 序曲


    第Ⅰ篇介紹包寧傑帶狀（Bollinger Bands）技術分析方法的建構積木，討論一些重要的定義，說明三種不同的操作時間架構，解釋這套方法的根本哲學概念。


    ## 第 1 章


    ## 導 論


    八十多年前，天文物理學家愛因斯坦首先提出相對論的觀念。根據相對論的說法，所有事物只因為彼此之間的關係而存在。換言之，沒有任何事物能獨自存在，也沒有所謂絕對的東西，這是相對論不可避免的結論。「黑色」必須依存於「白色」；「快」是相對於「慢」的概念；「高」必須有「低」做爲參考基準……等。愛因斯坦把這套理論運用到天文物理學上，因此讓很多讀者陷入五里迷霧。可是，例如羅素（Bertrand
    Russel）之類的哲學家，則把相同的觀念引用到物理學的領域之外。


    1925 年，《相對論簡介》（*The ABC of Relativity*）分期刊登於《國家》（*The Nation*）雜誌，其中提到羅素的看法。羅素相信人們一旦熟悉相對的觀念之後，就會改變思考邏輯：思考模式將變得更抽象，相對的概念將取代舊有的絕對法則。在科學領域內，情況的發展確實是如此，但通俗文化似乎沒有因爲相對論而產生重大變化，這是因爲一般人對於相對論的瞭解有限或覺得陌生①。


    > ① 資料來源：Michael White and John Gribbin, *Einstein: A Life in Science*, New York:
    Dutton Books, 1994.


    大約在愛因斯坦從事相對論研究的同时，美國高等法院法官奧力佛·溫戴爾·福爾摩斯（Oliver Wendell Holmes, Jr.）也帶動美國司法體系朝相對方向發展。他認為：法院不能判斷絕對眞理。法院只能針對各種不同陳述提出功過得失；司法體系不是絕對的架構，而是一種依存於社會的相對架構。福爾摩斯曾經提到：


    > 法律蘊含著整個國家在幾世紀以來的發展過程，法律不能像數學教科書一樣的推演定理。如果想知道法律的眞正意涵，就必須瞭解過去的演變歷程與將來的可能發展②。


    愛因斯坦與福爾摩斯的理論或主張，顯然不是孤立的事實。他們的工作反映出人類社會的某種發展趨勢。隨著十九世紀即將告一段落，整個世界變得愈來愈複雜，大家普遍瞭解人類事物再也不能由絕對眞理來統轄；如果文化要繼續演進——或金融市場要繼續發展——就必須建立相對架構。


    這些觀念的起源相當卑微，凸顯我們的能力極限，所反映的是東方而不是西方哲學。完美投資方法的目標，名副其實的只代表一個目標。我們可以朝目標前進，但永遠不能眞正到達目標。事實上，投資領域內並沒有所謂的完美方法。我們只能在能力所及的範圍內儘量施展。


    ② 資料來源：Oliver Wendell Holmes, Jr., The Common Law, Boston: Little Brown & Co.,
    1881; reprinted by Dover Publications, Boston, 1991.

