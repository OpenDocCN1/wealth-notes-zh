    某些案例中，第二個低點可能跌破包寧傑帶狀下限，甚至創相對新低（圖 12.6）。這種走勢不符合我們的分類定義，不得視為有效的 W 底。如果排列無法判斷的情況讓你覺得焦慮不安，請閱讀第
    4 章。


    對於典型而有效的 W 底，第一個低點並不需要跌破帶狀下限（圖 12.7）。事實上，我們只要求重新測試底部支撐的過程中，低點必須處於相對較高價位；換言之，低點價格接近而沒有觸及帶狀下限，或者只停留在帶狀下限與中心線之間。關於這方面的判斷，%b
    指標很有用，我們稍後會討論。


