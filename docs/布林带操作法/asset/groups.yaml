    期移動平均，繪製為曲線圖。其次，計算每天的價格區間（最高價與最低價之間的差值）的 10 天期移動平均。對於下降趨勢，把代表性價格的 10 天期移動平均，加上價格區間的
    10 天期移動平均，將此定義為買線（buying line）；一旦價格向上穿越買線，就應該翻空為多（回補空頭部位，同時建立多頭部位）。反之，對於上升趨勢，把代表性價格的
    10 天期移動平均，減去價格區間的 10 天期移動平均，將此定義為賣線（selling line）；一旦價格跌破賣線，就應該翻多為空（結束多頭部位，同時建立空頭部位）。表
    6.1 列示凱納的簡要計算公式。


    # 表 6.1 凱納帶狀的計算公式


    凱納的買線：


    代表性價格的 10 天移動平均 + 高低差價的 10 天移動平均


    凱納的賣線：


    代表性價格的 10 天移動平均 - 高低差價的 10 天移動平均


    由幾個方面來看，凱納的方法具有重大意義：


    第一 採用代表性價格，是相當明智的決定。代表性價格更能反映真正的交易狀況，「代表性」應該超過我們通常採用的收盤價。納入開盤價之後，代表性價格也可以反映非交易時段內發生的事件。這對於目前的交易非常重要，因爲你所運用的價格資料可能沒有涵蓋全部重要的交易活動。舉例來說，紐約證交所（NYSE）提供的報價資料，通常只反映紐約證交所交易時段內的事
    件，可能包含或不包含場外或盤後'
  - '[PAGE 74]


    交易發生的事件。 kës外，重大事件經常發生在海外，你所採用的報價資料的交易時段可能包含或是不包含這些海外事件。為了單純起見，本書一律採用收盤價，但在實際運用上應該考慮採用代表性價格。


    第二   凱納運用每天的高、低價差計算平均價與帶狀之間的寬度，這是一項創舉，使得後來能夠發展出更具調整能力的方法。這也把價格波動程度考慮在內，我們認為這是該系統得以成功的重大關鍵。


    第三   凱納只交替使用買線或賣線，如果我們持續而同時繪製買線與賣線，顯然就成為交易帶狀的第一個例子（圖 6.3）。


    ![](img/94739d716a8c23abc5f5258874db296f_74_0.png)


    圖 6.3 IBM 的 150 天凱納通道：利用買、賣線可以建構交易帶狀。'
  - '[PAGE 75]


    1960 年代，理查·董鉉（Richard Donchian）設計一套簡單、漂亮的方法，透過四週法則而讓市場決定交易包絡。觀念本身非常單純：價格穿越四週高價，則買進；價格跌破四週低價，則賣出。後來，一家著名的商品交易與分析機構唐恩&哈吉特（Dunn
    & Hargitt）測試各種電腦化交易系統，結果顯示董鉉的法則績效最佳。


    根據前述的說明，四週法則可以演化為包絡，換言之，包絡上限設定為最近四週最高價，下限為最近四週最低價。結果，凡是把最近 n 期最高價設定為通道高限，最近 n
    期最低價設定為通道低限的方法，統稱為董鉉通道（Donchian Channel，圖 6.4）。據說，這是目前一種更成功方法——龜族（Turtles）所運用的系統——的核心技巧③。


