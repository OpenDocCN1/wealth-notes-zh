    MACD 線設定為 100，然後取兩者差值的 9 天移動平均。換言之，此處的短期均線為 21 天均線，長期均線為 100 天均線，訊號線則是取前述兩者差值的
    9 天移動平均。擺盪指標的計算資料為上漲／下跌家數，以及上漲／下跌交易日成交量。如果希望採用百分率資料②，則第一個參數值為 9%（=2／21＋1），第二個為
    2%（2／100＋1），第三個為 20%（2／9＋1）。現在，我們可以把價格百分率帶狀取代為包寧傑帶狀③，這就是一套非常有用的反轉時效系統。


    ② MACD 採用指數平均（exponential averages），通常表示為百分率，不是天數。我們可以藉由下列公式，把天數換算為百分率。（2／n＋1），其中
    n 代表天數。


    ③ 就個人的交易風格來說，如果你覺得訊號太多，可以把計算期間延長為 30 期。


    同樣的，也可以利用技術指標釐清頭部或底部排列，確認價格反轉趨勢。例如，假定價格呈現 W2 底部排列，%b 指標在第二個谷底的讀數高於第一個谷底（亦即是相對的
    W4 排列，圖 20.3），觀察 MFI 或 VWMACD 成交量擺盪指標是否出現對應的確認型態④。若是如此，就可以在第一個強勢上漲日買進；否則就應該繼續等待其他機會。


    ![](img/94739d716a8c23abc5f5258874db296f_235_0.png)


    圖 20.3 Dow Chemical：W2（W4）排列與承接／出貨指標，150 天資料。AD 指標與 %b 指標確認價格型態。


    ④ 此處也可以採用 21 天盤中強度指標或承接／出貨百分率指標。


    ![](img/94739d716a8c23abc5f5258874db296f_236_0.png)


    圖 20.4 Lyondell：M16（M12）排列與承接／出貨指標，150 天資料。%b 與 AD 指標高點的讀數持續下滑，這是頭部排列的徵兆。


    頭部排列的情況也是如此，但需要更有耐心。一般而言，頭部排列耗費的時間更久，頭部型態本身往往由三個或更多上升波構成。對於標準的排列結構，在每個上升波的高點，%b
    指標的對應讀數都會持續下滑，成交量指標（例如：承接／出貨指標）也是如此，請參考圖 20.4。面對這種架構，當成交量或價格交易區間明顯放大，就代表進場拋空的機會。


    方法 I、II 在分析程序內引進一項新的自變數——成交量——藉以釐清頭部與底部排列；換言之，藉由成交量指標協助判斷市場供、需狀況的變化。在 W 底排列過程中，需求力量是否逐漸增強？若是如此，應該準備買進。在頭部排列的每個上升波，是否不斷湧出供給籌碼？若是如此，應該改採守勢，甚至準備放空。


    方法 III 很容易簡化或系統化。我們沒有必要觀察整個價格型態，只需要留意明確的機會。換言之，價格觸及包寧傑帶狀邊緣就代表潛在的交易訊號，然後觀察 21 天
    II% 或 20 天 AD% 擺盪指標是否出現對應的確認訊號——價格觸及帶狀上限而擺盪指標出現負值讀數，或者價格觸及帶狀下限而擺盪指標出現正值讀數。另外，這套方法也可以系統化。舉例來說，如果
    %b 指標讀數小於 0.05 而 II% 指標讀數大於 0，代表買進訊號；反之，如果 %b 指標讀數大於 0.95 而 AD% 指標讀數小於 0，代表賣出訊號。


    事實上，這種「觸及上限／負值指標」與「觸及下限／正值指標」的結構就是我個人最初採用的方法，而且目前仍非常珍惜。我曾經利用方法 III 的結構建立多頭部位，當時的收盤價跌破帶狀下限，位在長期支撐附近，這個買進機會顯然是其他方法所不會建議的。價格走勢圖看起來非常險惡，很可能跌破三重底排列。可是，II%
    指標的讀數非常不錯，而且價格創新低之後強勁反彈，意味著底部排列已經完成。更重要者，當時的進場點距離新低點只有 2½ 點，風險很有限，距離帶狀上限（合理的出場價位）為
    10 點；所以，風險／報酬比率大約是 1：4，相當不錯！


    正因為方法 III 能夠提供風險／報酬關係非常理想的結構，所以我們建議採用。總之，當價格型態深具潛力的時候，你未必敢冒險進場，但方法 III 可以協助釐清當時的狀況。


    ## 本章內容重點

    - 買進結構：價格觸及帶狀下限，擺盪指標呈現正面訊號。

    - 賣出結構：價格觸及帶狀上限，擺盪指標呈現負面訊號。

    - 利用 MACD 計算寬度（breadth）指標。

    - www.BollingeronBollingerBands.com 列舉方法 III 建議的所有交易機會。


    ## 第 V 篇

    ## 進階議題


    第 V 篇討論一些進階議題，包括當日沖銷的交易，以及利用包寧傑帶狀進行指標常態化程序。換言之，我們準備討論當日沖銷所需要運用的走勢圖型態、技術指標與相關技巧，同時探討如何運用包寧傑帶狀進行技術指標常態化的程序。


    ## 第 21 章

    ## 常態化技術指標


    包寧傑帶狀的運用，沒有必要侷限在證券或價格指數的範疇內。讓我們點出幾個可能的對象：比率、經濟統計資料、基本面數據、成交量或技術指標。不論這些數列屬於擺盪指標的性質，或者完全沒有上、下限。每種情況下，包寧傑帶狀提供的功能都相同——界定相對高點與低點。這種處理方式具備的洞察力，經常是那些傳統絕對標準或法則所不能比擬的。


    讓我們以相對強弱指數（RSI）為例做說明。根據傳統解釋，每當 RSI 讀數超過 70，屬於超買狀態；RSI 讀數低於 30，屬於超賣狀態。關於這項指標，最普遍的運用法則可能是：每當
    RSI 由下往上穿越 30，視為買進訊號；每當 RSI 由上往下跌破 70，視為賣出訊號。這種處理方式顯然有些問題——70 與 30 有時候可以精準界定超買與超賣，有時候則很離譜。


    相對於前述運用法則，讓我們考慮一種比較穩健的方法。在延伸性多頭走勢中，70-30 的界線需要向上提高，有些分析家建議提高到 80-40；同理，在延伸性空頭走勢中，超賣-超買界線可以考慮降低到
    60-20。事實上，如果 RSI 出現 80 或以上的讀數，就可以把當時行情定義為上升趨勢，並且把超賣界線調整到 40，直到 RSI 讀數出現 20 或以下的水準，才認定行情反轉為下降趨勢，這個時候的超買水準也向下調整為
    60。所以，RSI 指標可以用來界定行情的主要趨勢方向，同時也可以根據當時的趨勢設定對應的超買／超賣水準，擬定對應的決策架構①。


    以一些題外話為例。過去所謂的「超買」與「超賣」是指極端嚴重的市況。舉例來說，在 1974 年秋天，當時處在大空頭市場的末期，股票市場嚴重超賣；反之，在 1962
    年春天，保齡球股票幾乎處於白熱化狀態，顯然嚴重超買。證券分析家認為，這類超買或超賣狀況屬於非常罕見的現象，代表市場的長期轉折點。可惜，過去幾年來，證券市場的時間架構明顯縮短，一般投資人未必認同前述的定義。現在，超買與超賣被運用在非常短的時間架構上，早期的證券分析家恐怕會認為不可思議。可是，我們認為基本定義應該適用於每種時間架構。相對於僵硬的
    70-30 法則，根據市況調整 RSI 的決策架構，顯然是一項進步，但我們還可以更進一步改善。把包寧傑帶狀運用到 RSI 指標，利用帶狀界線來定義超買與超賣水準。藉由這種方式，可以讓決策架構完全根據行情發展來調整。


    相較於股票來說，技術指標的個別狀況顯得比較分歧，需要分別考慮。對於大多數股票而言，最初可以考慮 20 期的計算期間與 2 個標準差的帶寬，但技術指標似乎都有自己適用的參數（表
    21.1）。一般來說，技術指標的移動平均計算期間都較長，前文有關成交量的討論就已經反映這項事實（成交量的移動平均期間採用 50 天）。除此之外，技術指標的參數設定就沒有什麼準則可供遵循。可是，我們希望指出
    14 天期 RSI 特別適用的包寧傑帶狀參數：50 天期均線與 2.1 個標準差帶寬。運用這個參數組合，很容易界定個別股票的超買／超賣水準，而且在重要行情轉折點經常可以見到背離現象。


    ### 表 21.1 技術指標的包寧傑帶狀參數


    | 技術指標 | 期間長度 | 帶狀寬度 |

    |---|---|---|

    | 9 期 RSI | 40 | 2.0 |

    | 14 期 RSI | 50 | 2.1 |

    | 10 期 MFI | 40 | 2.0 |

    | 21 期 II | 40 | 2.0 |


    對於感覺敏銳的分析家可以很快就可以找到包寧傑帶狀適用的參數值。首先，可以運用我們就個別股票討論的程序來挑選移動平均計算期間。在上升趨勢中，你希望見到指標均線偶爾逼近帶狀上緣，然後出現緩慢的轉折；同理，在下降趨勢中，指標均線應該偶爾逼近帶狀下緣。可是，均線基本上應該停留在指標走勢圖的中間區域——MFI
    應該停留在 25 到 75 之間，RSI 稍緊，應該停留在 30 到 70 之間。如果均線跑到帶狀上緣的四分之一處，或帶狀下緣的四分之一處，意味著移動平均的計算期間可能太短。反之，如果均線始終停留在中心點附近，意味著計算期間可能太長。至於帶寬的標準差個數，不妨由
    2 個標準差著手，帶狀寬度原則上需要涵蓋 85% 到 90% 的指標數值。


    我們有理由相信，不同技術指標的適當參數值差異很大；技術指標讀數的統計分配顯然不同於股票。事實上，很多技術指標的分配絕對不屬於常態分配。隨機指標（stochastics）次數分配的尾部很厚，甚至可能是
    U 型；換言之，尾部的發生機率超過中間（圖 21.1）。RSI 分配的尾部通常較薄。雖說如此，讀者也不需太在意技術指標的統計分配，只要遵循前述建議的程序，就可以找到適當的方法。


    現在，你可以把帶狀上限視為超買水準（例如：RSI 的 70），把帶狀下限視為超賣水準（例如：MFI 的 20）。如果參數設定恰當，所有的決策法則就繼續適用，例如：指標由下往上穿越帶狀下限，代表超賣的買進訊號；指標由上往下跌破帶狀上線，代表超買的賣出訊號。你再也不需擔心絕對的數據，這些門檻數據將依照市況調整。順著當時的行情發展，利用技術指標的包寧傑帶狀來指引交易機會。


    接著，讓我們討論一項巧妙的技術，甚至帶著些許魔術意味：%b 指標通常用來顯示資料點——大多是收盤價或最近成交價——在包寧傑帶狀內的位置。%b 讀數等於 1.0，資料點位在包寧傑帶狀上限；讀數等於
    0.5，資料點位在帶狀中心點；讀數等於 0.0，資料點位在帶狀下限。請注意，%b 讀數並不侷限在 0 與 1 之間。讀數 1.1 代表資料點位在帶狀上限之上
    10%，讀數 -0.15 代表資料點位在帶狀下限之下 15%。首先，計算技術指標的讀數，繪製指標走勢圖。其次，利用前述介紹的方法設定包寧傑帶狀參數，繪製帶狀圖形。然後，計算技術指標的
    %b（表 21.2）。最後，繪製 %b 的走勢圖，視其為常態化版本的指標。就是這樣。圖 21.2 與 21.3 利用 MFI 做為例子說明。


