    ## 本章內容重點


    - 包寧傑帶狀也大體適用統計法則，雖然不是完全適用。

    - 回歸均數的傾向確實存在，但這種傾向的強烈程度或許低於預期。

    - 價格觸及帶狀邊緣的現象，需要經過技術指標確認。

