    包寧傑帶狀發明之後的幾年內，人們嘗試透過其他方法建立帶狀寬度具備調適能力的通道，但結果並不理想，顯然缺乏包寧傑帶狀所引起的迴響。這種以我的名字命名的東西之受到普遍認同，我當然覺得非常高興。另外，包寧傑帶狀之所以很快被接受，一方面是因為《金融新聞網》（Financial
    News Network）的緣故，由 1983 年到 1990 年之間，我在這個電台擔任首席市場分析師。包寧傑帶狀可以說「適逢其時」，因為這項工具剛好得以迎合當時的需要，而這些需要又沒有辦法透過其他管道得到滿足。


    如果你想知道包寧傑帶狀如何被命名的話，那麼讓我述說這段過程。在很長一段期間內，我所運用的這項工具始終沒有正式名稱。有一天，在比爾·葛利福斯（Bill Griffeth）主持的節目中，我利用一份圖形說明帶狀走勢。就在解釋這項工具的用途時，比爾很自然的詢問這項工具的名稱。就是這樣，在完全沒有準備的情況下，「包寧傑帶狀」的名稱就誕生了。


    ## 本章內容重點


    - ■ 交易帶狀的運用歷史非常悠久。

    - ■ 很多分析師的貢獻都很大。

    - - 百分率帶狀的運用最普遍。

    - - 包寧傑帶狀誕生於 1983 年。

    - - 價格波動率是包寧傑帶狀的最關鍵成分。

    - - 按照實際市況進行調整，這種功能很重要。


    ## 第 7 章


    ## 建 構


    交易帶狀的建構程序，實際上很簡單。首先需要找到某種衡量向心趨勢（central tendency）的方法，然後以中心趨勢為基準而建立帶狀上限與下限。問題是：究竟應該採用哪種方法來衡量向心趨勢，如何決定帶狀區間寬度？就包寧傑帶狀來說，衡量向心趨勢的指標是移動平均，帶狀寬度則取決於價格波動率（volatility）——移動的標準差（moving
    standard deviation）。


    此處所謂的移動是什麼意思？對於每個期間，相關的計算都必須重新進行。就移動平均而言，每個期間的平均值都是按照最近某特定期間的數值計算。舉例來說，20 天收盤價移動平均的每天讀數，是以該天為準而計算最近
    20 天收盤價的平均值；隔天，剔除最早一天的收盤價，納入最近一天的收盤價，重新計算最近 20 天收盤價的平均值。價格波動率的計算也是如此；對於每個期間，都是按照最近某特定期間的數值計算。


    關於向心趨勢與帶狀寬度的計算，它們與交易區間或價格包絡之間有什麼關聯呢？根據我個人的看法，交易帶狀是建立在某中心點（通常採用平均數做為代表）之上與之下的帶狀結構。包絡則沒有採用中心點做為參考基準，例如：利用盤中最高價移動平均代表區間上限，利用盤中最低價移動平均代表區間下限（譯按：這類區間只有上限與下限，但沒有中心點），或（如同賀斯特的做法）利用曲線分別套取關鍵最高價與關鍵最低價而界定的區間。


    關於交易帶狀，問題的核心所在，應該很清楚。如果透過百分率方法決定帶狀寬度，那麼每個分析對象都應該有自己適用的百分率；然而，即使就相同的分析對象來說，隨著時間經過，所採用的百分率通常也需要調整——換言之，某個期間適用的帶狀寬度，未必適用於其他期間。馬克·柴京就告訴我們一種估計帶狀寬度的適當方法；他所發明的波馬帶狀（Bomar
    Bands）採用 21 天移動平均為中心基準，然後把 21 天均線分別向上與向下平移，使得最近一年內發生的價格有 85%涵蓋在帶狀內。對於柴京來說，這種方法或許適用，但我們認為，目前金融市場的價格結構更具動態性，不再適用波馬帶狀所採用的偏長回溯期間（換言之，最近一年）。某些人曾經嘗試縮短波馬帶狀的回溯期間長度，結果顯示這種方法似乎不適用於短期時間架構。柴京讓市場本身決定帶狀寬度，顯然已經掌握問題的核心所在，但仍然需要設計一套方法，使得帶狀寬度更能隨市場行情發展而自動進行調整。


    關於證券交易，我最初的興趣是選擇權。不論是可轉換債券或認股權證嵌入的選擇權，或是正式掛牌交易的選擇權，分析重心都相同，都是價格波動率，尤其是價格波動率的未來估計值。這場遊戲的致勝關鍵很清楚，但實際運用卻很困難；你對於價格波動率的瞭解，必須超過你的對手。事實上，很多交易工具的關鍵所在，看起來都是價格波動率，所以我研究各種型態的價格波動率：歷史估計值、未來估計值、統計衡量值……等。至於交易區間，如果眞想有效運用的話，顯然也必須納入價格波動率。


    一旦認定價格波動率是設定交易區間寬度的基準，仍然有很多選擇的餘地。價格波動率存在很多不同估計方法：它是衡量期間長度的函數，可以衡量價格偏離趨勢線的離差程度（deviation），能計算價格距離某期望值的離差程度——計算方法幾乎有無限多種①。經過初步的篩選之後，我們總共歸納出七個可能的衡量方法。在最初的決策過程中，特定計算方法愈能夠根據實際市場狀況進行自動調整，結果就愈理想。就我們考慮的所有可能對象來說，標準差（σ）的這方面潛力顯然最凸出。


    關於標準差的計算程序，首先計算資料點的平均值，然後計算每個資料點與平均值之間的差值。結果就是每個資料點偏離平均數的離差——某些爲正數，某些爲負數。資料數列的波動程度愈劇烈，離差就愈大。其次，這些離差必須加總。可
    是，離差的加總和顯然是零，因爲離差有正、有負，而且正、負値必定剛好相互抵銷。所以，如果真的想衡量資料點偏離平均數的程度，必須避免負值的離差。最簡單的辦法，是直接取消負號，結果就是絕對離差（absolute
    deviation），這也是我們最初考慮採用的計算方法。取前述離差的平方，也可以避免負號——負數乘以負數，結果是正數——這就是標準差採用的計算方法。


    最後步驟很簡單：計算離差平方的加總和②，然後計算這個加總和的平均數，最後再取平方根（表 7.1）。


    ## 表 7.1 標準差計算公式


    ```

    σ = √[ Σ(xᵢ − μ)² / N ]

    ```


    其中

    x=資料點

    μ=平均數

    N=資料點的數量


    取離差的平方值，讓後續計算得以順利進行，但也產生一項副作用：離差被放大。事實上，離差愈大，放大效果也愈顯著。這是關鍵所在。如果價格飆漲或暴跌，價格距離平均值的離差也會增加，標準差計算公式內的平方運算使得離差放大，所以帶狀可以非常有效率的反映新價格（換言之，帶狀寬度將隨著新價格而自動進行調整）。結果，帶狀似乎會自動追蹤價格。不要低估這項性質。這正是交易帶狀之所以有效的關鍵：能釐清價格型態，並且能有效界定何謂偏高或偏低的價位。


    關於包寧傑帶狀的預設參數值，我採用 20 天的計算期間，大約對應一個月的交易天數，帶狀寬度則採用±2 個標準差。如果縮短計算期間，設定帶狀寬度的標準差個數通常也需要減少；反之，如果延長計算期間，代表帶狀寬度的標準差個數就需要增加（請參考下文討論，或參考第
    I 篇第 4 章介紹的傳統方法）。


    標準差個數需要調整，理由在於標準差計算本身。如果樣本資料點個數爲 30 個或以上，±2 個標準差應該可以涵蓋95%的資料點。如果樣本大小少於 30 個，理論上根本不該採用標準差，但實務運用畢竟還是有可能。事實上，即使樣本數量減少到
    10 個，帶狀涵蓋的資料點個數還是相當正常。可 是，由於計算期間縮短，爲了讓帶狀涵蓋的資料點個數維持正常，帶狀寬度的參數設定仍然需要調整。


    ③ 另外一個理由，雖然已經超出本書準備討論的範圍，但我還是稍做說明。證券價格並不呈現「常態分配」，它們的波動程度較預期嚴重。相對於常態分配來說，證券價格分配的「尾端較肥厚」。所以，很多統計推論不能成立。舉例來說，30
    期的計算，±2 個標準差只能涵蓋 89%的股價資料點，不是常態分配的 95.4%（統計學的相關資料，請參考第 9 章）。


    這方面的帶狀寬度調整，通常採用表 3.2 列示的數據，計算期間由 10 期增加到 50 期，標準差個數由 1.5 個增加到 2.5 個。可是，在本書的編寫過程中，我們針對幾個市場進行測試，嘗試瞭解表
    3.2 的調整是否仍然適用。結果發現目前所需的調整程度更小。我們測試六個市場：IBM、S&P 500 指數、日經 225 種股價指數、金塊、德國馬克／美元交叉匯率與那斯達克綜合指數。除了馬克匯率採用八年資料外，其餘五個市場都採用十年資料。我們分別計算
    10 期、20 期、30 期、50 期的包寧傑帶狀。關於帶狀寬度的設定，則以涵蓋 89%的資料點為準，這也是六個市場的 20 天期帶狀的平均涵蓋程度④。


    六個不同市場的測試結果都相當吻合。根據這些測試資料，我建議一項普遍法則：如果 20 期計算的帶狀寬度採用 2 個標準差，那麼 10 期計算的帶狀寬度可以減少為
    1.9 個標準差，50 期計算的帶狀寬度則增加為 2.1 個標準差（表 7.2）。


    ## 表 7.2 寧傑帶狀寬度參數：建議採用的標準差個數


    | 期間 | 標準差個數 |

    | --- | --- |

    | 10 | 1.9 |

    | 20 | 2.0 |

    | 50 | 2.1 |


    表 7.2 建議的調整程度，遠小於表 3.2。造成這些變動的因素很多，舉例來說，樣本較大、測試方法或平台較理想，這都是可能的原因。可是，最重要一點顯然是市場的演變。最初設定包寧傑帶狀參數的時間，大約是在二十多年前；這段期間內，金融市場的變化很大。例如，股價指數期貨是嶄新的產品，當時完全沒有經過測試。毫無疑問的，市場不斷演變，我們的方法也需要隨之演變。


    讓我們總結前述的討論：採用 20 期計算期間，對於大多數市場來說，2 個標準差的帶狀寬度大約可以涵蓋 88%或 89% 的資料點。如果資料點的涵蓋百分率維持不變，把計算期間縮短為
    10 期，帶狀寬度需要由 2 個標準差減少為 1.9 個；反之，如果計算期間延長為 50 期，帶狀寬度需要由 2 個標準差增加為 2.1 個。


    如果計算期間不足 10 期或超過 50 期，最好調整每支線形的涵蓋期間。舉例來說，如果計算期間少於 10 天，最好採用小時走勢圖，不要繼續採用日線圖而嘗試縮短計算期間。紐約證交所每天有
    7 個交易小時；早晨 9:30 到 10:00 的半小時應該視為 1 個交易小時，所以每星期的 5 個交易日總共有 35 個交易小時。原則上，計算期間儘可能保持為
    20 期或 30 期，因為這些期間有很多經驗可供運用，最好不要過度延伸或壓縮包絡計算期間，否則很容易出現意外情況。


    為什麼採用簡單移動平均（simple moving average）？幾年來，一對父子檔持續在《投資人經濟日報》（Investor''s Business
    Daily）刊登廣告，推銷一種「較佳的包寧傑帶狀」。這帖膏藥的「秘方」是什麼？他們採用指數移動平均（exponential moving average）來衡量向心趨勢可是，本書仍然建議採用簡單移動平均。理由呢？因為我們採用簡單移動平均方法計算價格波動率，藉以設定帶狀寬度，所以採用相同的方法來設定中心點，似乎比較具備內在一致性。是否可以採用指數移動平均來設定中心趨勢呢？當然可以！任何移動平均方法都可以考慮可是，如果採用指數移動平均，就會增添一項你可能考慮在內或沒有考慮的外部因素（extraneous
    factor）。根據我們的測試資料，沒有任何證據顯示指數或加權移動平均能夠提供較佳的結果，讀者可以自行比較圖 7.1～圖 7.3。所以，如果沒有迫切理由的話，最好還是採用最簡單、最合理的方法。


    ![](img/94739d716a8c23abc5f5258874db296f_96_0.png)


    圖 7.1 Deere & Co.：採用 20 天簡單移動平均的傳統包寧傑帶狀，資料期間 150 天。


    ![](img/94739d716a8c23abc5f5258874db296f_97_0.png)


    圖 7.2 Deere & Co.：採用 20 天指數移動平均的包寧傑帶狀，資料期間 150 天。指數移動平均的變動速度更快（相對於簡單移動平均而言）——所以必須增添計算期間才能產生對等結果。


    ![](img/94739d716a8c23abc5f5258874db296f_97_1.png)


    圖 7.3 Deere & Co.：採用 20 天加權移動平均的包寧傑帶狀，資料期間 150 天。近期資料的權數較大，這種均線的變度速度更快，能夠更迅速反映當前的行情變動。


    衡量中心趨勢與帶狀寬度的計算期間是否可以不同？價格波動率採用較長的計算期間，移動平均採用較短的計算期間，這種方法相當流行。如此處理的理由，是希望利用價格波動率的主要循環長度來設定帶狀寬度，同時利用趨勢的最佳衡量來設定帶狀中心——舉例來說，利用
    50 期移動平均設定中心點，利用 20 期資料計算價格波動率來設定帶狀寬度（圖 7.4）。根據我們的經驗顯示，採用不同計算期間的案例少於採用不同的移動平均計算方法，不過還是有些案例使用。坦白說，我看不出有任何理由需要在這套已經非常複雜的系統內引進一項新變數，但如果讀者覺得有幫助的話，那就請便。


    ![](img/94739d716a8c23abc5f5258874db296f_98_0.png)


    圖 7.4 Deere & Co.的包寧傑帶狀：移動平均採用 50 天計算期間，標準差採用 20 天計算期間，資料涵蓋 150 天。結果較好嗎？或更不好？


    最後一種非常流行的衍生運用，是同時採用數個帶狀。這有兩種可能性。第一，採用相同的計算期間，但由不同寬度設定多條帶狀，例如：計算期間為 20 天，但分別按照
    1 個標準差與 2 個標準差的寬度繪製兩條帶狀（圖 7.5）。第二，採用完全不同的參數繪製多條帶狀，例如：20 期／2 個標準差與 50 期／2.1 個標準差，兩條帶狀繪製在同一份走勢圖上（圖
    7.6）。


    ![](img/94739d716a8c23abc5f5258874db296f_99_0.png)


    圖 7.5 Deere & Co.：多條包寧傑帶狀：相同計算期間，採用多種帶狀寬度，資料涵蓋 150 天。某些狂熱分子認為，這種表示方法有助於判斷行情。


    ![](img/94739d716a8c23abc5f5258874db296f_100_0.png)


    圖 7.6 Deere & Co.：多條包寧傑帶狀：不同計算期間，分別採用正常帶狀寬度，資料涵蓋 150 天。如果兩條帶狀提供的訊號相同，或許特別值得留意。


    ## 本章內容重點


    - - 採用簡單移動平均做為基準。

    - - 利用標準差來設定帶狀寬度。

    - - 包寧傑帶狀的參數預設值為：計算期間 20 天，帶狀寬度 2 個標準差。

    - - 帶狀寬度需要隨著計算期間變動而調整。

    - - 儘量保持單純。


    ## 第 8 章


    ## 包寧傑帶狀指標


    包寧傑帶狀可以直接衍生兩種指標：%b 與帶寬（BandWidth）。%b 指標顯示目前價格與包寧傑帶狀之間的位置關係，這是透過價格與指標關聯而發展交易系統的關鍵所在。至於帶寬指標，它告訴我們帶狀的寬度資訊。帶寬是辨識擠壓（The
    Squeeze；譯按：這是指價格波動率處在歷史偏高或偏低狀態，即將呈現「物極必反」的發展）的重要依據，有助於判斷趨勢的開始與結束。我們首先討論%b，其次再討論帶寬。


    表 8.1 列示%b 的計算公式。請注意，如果最近價格剛好位在帶狀上限，%b 的讀數為 1.0；如果最近價格等於中心價，%b 的讀數為 0.5；如果最近價格位在帶狀下限，%b
    的讀數為 0.0。由計算公式可以發現，%b 的數值並不受限在特定範圍內；如果最近價格高於帶狀上限，%b 的讀數大於 1.0，如采最近價格低於帶狀下限，%b
    的讀數為負數。舉例來說，如果 %b 讀數為 1.1，意味著價格位在帶狀上方，與上限之間的距離為帶狀寬度的 10%；如果%b 讀數為-0.15，意味著價格位在帶狀下方，與下限之間的距離為帶狀寬度的
    15%（圖 8.1）。


    ## 表 8.1 %b 計算公式®


    （最近價格−帶狀下限）／（帶狀上限−帶狀下限）


    ![](img/94739d716a8c23abc5f5258874db296f_102_0.png)


    圖 8.1 Nokia：包寧傑帶狀與%b 指標，250 天資料。%b 指標顯示目前價位與帶狀的關係。


    ① 如果讀者熟悉技術分析，應該發現這個公式與喬治·雷恩（George Lane）的隨機指標（stochastics）公式很類似。隨機指標的基本公式為（最近價格−n
    期最低價）／（n 期最高價−n 期最低價）。雷恩稱這些指標為%d、%k 或其他類似名稱。所以，依據他的系統，以及我的系統緣由，我也採用他的命名系統，稱這項指標為%b（經過查證，雷恩並沒有使用相同名稱）。雷恩來自於美國中西部，多年來都在
    Cessna 210 傳授商品交易技巧，對象主要是農民。他帶著濃厚的宗教色彩，演講內容也非常強調信仰。我永遠會記得他！他讓我瞭解，價格經過三次衝刺而創高點的觀念，整個過程令人懷念。這是一種隨著時間經過而歷久彌新的觀念。他利用隨機指標來診斷三次衝刺而創新高的現象；我則運用包寧傑帶狀與成交量指標。如果雷恩比較重視股票而不是商品的話——前者可以立即觀察成交量，後者的成交量資料落後一天，而且只有總量——我懷疑結果是否還是如此。


    %b 可以配合其他指標運用於包寧傑帶狀，例如：成交量擺盪指標（圖 8.2）。舉例來說，假定你決定採用下列系統：價格向上穿越包寧傑帶狀上限，21 天盤中強度指標（Intraday
    Intensity，II）為負數，採取賣出動作。把這個系統設定為電腦程式：如果%b 大於 1.0，21 天 II 小於 0，則賣出。關於這套系統的其他內容，請參考第
