    圖 16.6 PPL Corp：方法 I 案例，120 天資料。第一波走勢的讀數介於 5%到 40%之間，第二波走勢超過 40%。請注意箭頭標示的峰位。


    ## 本章內容重點


    - 利用擠壓狀況做為操作架構。

    - 然後趁著價格波動率擴張而操作。

    - 留意假動作（假突破）。

    - 觀察成交量技術指標評估可能的突破方向。

    - 根據自己的偏好調整參數值。

