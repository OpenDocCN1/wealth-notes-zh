    ## 表 2.2 技術分析者可以運用的其他原始資料


    - 心理指標：人氣統計調查、選擇權交易相關指標、期貨溢價……等。

    - 比較指標：相對於 S&P 指數的相對強度指標與動能排序。

    - 跨市資料：反映相關對象之間的關係。

    - 交易資料：買價與賣價、每筆交易成交量、相關交易所的資料。

    - 結構性資料：包括不同產業與經濟部門的資料。

    - 資本規模資料：例如小型股與大型股的資料。

    - 隱含價格波動率

    - 價值評估分類：例如成長型與價值型。

