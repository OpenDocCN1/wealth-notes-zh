    時的交易取向顯然傾向於長期。當時，所謂的超買與超賣，絕對都是針對長期重大頭部或底部而言，這也是月線圖比較容易顯示的事件。反之，就目前的情況來說，超買與超賣都是就最短的時間架構而言，兩者之間的對照相當有趣。


    大約在拉杜克出版雙線走勢圖方法的相同期間，查斯特·凱納（Chester W. Keltner）也在 1960 年的著述《如何透過商品交易賺錢》（How to
    Make Money in Commodities）提到 10 天平均移動法則（Ten-Day Moving Average Rule，圖 6.2）。凱納首先計算代表性價格——特定期間內的最高價、最低價與收盤價總和，結果除以3
    ②。然後，計算代表性價格的 10 天


    ![](img/94739d716a8c23abc5f5258874db296f_72_0.png)


    圖 6.2 凱納的買／賣線：運用買、賣價格可以建構交易帶狀。


    （資料來源：Chester W. Kelter 的 How to Make Money in Commodities, Kansas City, Mo.:
    The Keltner Statistical Service, 1960）


    ② 代表性價格是很古老的觀念，通常定義為（最高價+最低價+收盤價）÷3。這個定義也可以納入開盤價，換言之，代表性價格=（開盤價+最高價+最低價+收盤價）÷4。我很早就建議包寧傑帶狀採用代表性價格，這項技巧目前仍然很有用。採用代表性價格建構的包寧傑帶狀，形狀比較平滑一些，提供訊號也稍遲，但對於某些運用則是優點。'
