    # 第 10 章


    # 型態辨識


    型態辨識是指我們辨識某類重複性事件的程序。一般來說，這類事件是由一系列個別成分按照特定順序而發生，讓我們可以辨識其型態，並且採取行動。價格型態幾乎不可能絕對精準的重複發生，通常只具有大體相同的性質，顯現某種特定軌跡。為了有效辨識型態，我們需要借重某種架構，在該架構內分析價格型態。包寧傑帶狀就能提供這類的分析架構。


    技術分析文獻存在很多價格型態的描述。雙重頂與雙重底、頭肩頂與頭肩底、上升三角形與下降三角形，都是一些常見的價格型態。某些型態意味著趨勢即將反轉，另一些型態則預測既定趨勢將繼續發展①。


    關於型態辨識，包寧傑帶狀提供的功能之一是「定義」——何謂高價或低價？何謂波動劇烈或平靜？行情是否具備


    ① 詳細的技術分析討論已經超出本書的內容範圍，有興趣的讀者可以瀏覽參考書目內 Schabacker 或 Edwards & Magee 的著作。'
  - '[PAGE 122]


    明確的趨勢？——藉以比較不同期間、不同股票或不同市場之間的走勢。隨著價格型態的演變，包寧傑帶狀也隨之演變，提供一個相對而具有彈性的架構，不同於圖形座標刻度的絕對、僵化架構或死板的趨勢線。


    股票很少突然由多頭走勢演變為空頭走勢，反之亦然。過渡期間通常都會出現一系列的價格行為，一度或數度測試支撐或壓力。M 頭與 W 底就是發生在行情轉折點的常見價格型態，顯示先前的趨勢即將告一段落，同時預示著新趨勢誕生。新趨勢可能是由先前的上升趨勢反轉為下降趨勢，或由先前的下降趨勢反轉為上升趨勢，也可能源自於毫無趨勢的狀態，當然也可能由先前的明確趨勢演變為橫向盤整走勢。雙重底與頭肩頂屬於最常見的反轉型態。可是，並不是所有的反轉型態都是三次「衝刺」（pushes）的
    W 底或 M 頭變形，它們只不過代表最常見的型態罷了（圖 10.1 與 10.2）。


    突兀頭部與 V 形底部相對少見，但仍然可能發生，使得上升趨勢突然反轉為下降趨勢，反之亦然。同理，反轉型態往往沒有實際造成反轉；它們只代表既有趨勢的結束，隨後出現的是橫向盤整，並不是相反方向的明確趨勢。另外還有一些更長期、更複雜的型態，例如：慢慢由下降趨勢演變為上升趨勢的碗形底，或密集盤整型態與複雜頭部型態。


    某些價格型態經常是另一些更大型態的構成部分，後者往往只能採用更長期的走勢圖才能看見，例如：小時走勢圖與日線圖、週線圖與月線圖之間的關係。1980 年代末期曾經'
