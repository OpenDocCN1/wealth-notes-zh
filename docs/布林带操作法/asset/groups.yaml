    不論所處的層次架構如何，技術型態是指走勢圖上出現可資辨識的特定型態價格發展——這種特殊型態可以由包寧傑帶狀來說明。舉例來說：讓我們考慮典型的 W 底（雙重底）結構，第一波跌勢之後緊跟著出現價格反彈，然後發生第二波跌勢，其後的彈升則啟動上升趨勢。至於第二波跌勢是否創新低，這點並不重要——至少就價格本身而言是如此。W
