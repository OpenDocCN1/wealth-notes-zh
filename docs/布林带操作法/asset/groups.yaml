    一般而言，W 底的第一個低點會觸及或跌破包寧傑帶狀下限（圖 12.5）。反彈過程中，價格通常會回到帶狀區間，正常情況下還會觸及或穿越帶狀中心線。接著，在價格拉回而重新測試先前底部的過程，低點大多不會跌破帶狀下限。請記住，根據我們的定義，所謂的走勢創新低，判斷基準是包寧傑帶狀下限。所以，如果第一個底部跌破帶狀下限，但第二個底部留在帶狀區間內，那麼——即使第二個底部的絕對價位較低，但就相對角度而言，第二個底部仍然視為較高。因此，絕對的
    W8，可能是相對的 W10，後者顯然比較容易處理。依據前述的說明，我們發現包寧傑帶狀可以協助判斷型態，增進投資者處理棘手排列的能力，避免交易者在潛力十足的走勢中被提早震盪出場。


