    舉例來說，美國股票市場就存在顯著的季節性趨勢。不論是每年或四年期的循環都很明顯，而且可以被用來協助交易。事實上，四年期循環可以解釋每年循環的大部分變動性。由非常不同的角度觀察，約翰·厄勒斯（John
