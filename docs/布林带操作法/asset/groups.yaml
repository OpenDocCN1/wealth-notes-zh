    目前採用的圈叉圖很簡單，非常方便透過手工繪圖（圖 11.8）。O 欄位代表價格上漲，如果價格繼續上漲，就繼續在適當價位往上標示×；如果價格下跌，而且下跌超過特定程度，則換到右側欄位標示O。請注意，唯有當價格下跌超過特定程度，才換欄繪圖，所謂「特定程度」是由繪圖者預先設定的格數，最常見者為
    3 格，稱為 3 格反轉圈叉圖。接著，如果價格上漲，而且上漲超過特定程度，則換至右側欄位繪製×。


    如何決定方格大小與反轉格數，這是圈叉圖長久以來的問題。一般來說，分析者都是按照股價高低來決定這些參數。如果股價偏低，那麼每個方格可能代表 0.25 點或 0.5
    點。高價股的每個方格可能代表 0.5 點或 1 點。$10 的股票，每格可能代表 1 點；$80 的股票，每格可能代表 1.5 點。目前，市場普遍認同繪圖公司（ChartCraft）採用的方法（最初由柯恩[Abe
    Cohen]設計），請參考表 11.1 的相關設據。


