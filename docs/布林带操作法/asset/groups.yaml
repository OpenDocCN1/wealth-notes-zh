    # 第 6 章


    # 歷史緣由


    交易帶狀（或包絡、通道……等名稱）的運用已經有很長一段歷史，發展過程很有趣。本章只準備討論一些重點，讓讀者大致明白這項技巧的起源背景，瞭解它在整個技術分析架構上的地位①。


    我們或許應該由名詞定義著手。交易帶狀（trading bands）是沿著某中心趨勢之上、下建構的帶狀，例如：以某移動平均線爲中心，分別乘以某百分比而向上與向下平移（譯按：界定交易帶狀、包絡或通道之上、下兩個端點，譯文分別稱爲「上限」與「下限」）。交易帶狀的上限與下限不一定對稱，但是兩者必須以某中心點做爲基準。包絡（envelopes）是建立在某價格結構的上、下兩側，例如：包絡上限定義爲每天盤中最高價的移動平均，下限定義爲每天盤中


    ① 技術分析的歷史發展過程模糊不清。我已經儘量嘗試把一切解釋明白。很多原始資料最初刊載於通訊刊物或輔助論文。眾多文獻已經遺失或被故意毀損。這方面的知識與技巧很多都密而不宣，實際瞭解這些技巧的鑑賞家在過世之後也經常把「密技」帶入地下。各方面的說法往往相互衝突，那些能夠統合各種說法的人，又經常別有意圖。如果任何人能夠就帶狀、包絡，以及相關指標或系統提供額外的資料，我們將非常感激。'
  - '[PAGE 70]


    低價的移動平均，這兩條移動平均所界定的帶狀區間就是一種包絡。包絡的上限與下限可能彼此對稱，但通常不對稱，而且兩者並不反映某中心基準。通道（channels）是沿著價格上、下兩側繪製的平行線，使得通道觸及價格結構的關鍵點。


    關於這方面的引用，我們能找到的最早資料是魏爾佛利·拉杜克（Wilfrid LeDoux）在 1960 年取得版權的雙線走勢圖（Twin-Line Chart，圖
    6.1）。這是一種簡單、漂亮的方法，圖形部分是利用黑線與紅線分別把每個月份的高價與低價銜接為曲線。採取行動的相關法則有幾項，其中最清楚者為：每當紅線（月份低價）超越黑線（月份高價）的谷底兩點或以上就買進。這個技巧的基本動機，是釐清重大行情擺動的走勢型態，使得個股操作能夠取得最大效率。我們沒有針對這個方法進行檢定，但根據資料所提供的一些案例顯示，績效似乎不錯。


    拉杜克在 1918 年開始從事交易，1921 年就宣告破產，這個慘痛經驗促使他深入研究技術分析。大約在 1930 年，他採用第一項工具，稱爲「偵測圖」（Detectographs）的
    ROBOT 走勢圖。雖然這項工具的細節內容已經不可考，但我們知道這也是強調最高價與最低價相對關係的走勢圖。不幸的，我們不知道他開始採用通道工具的精確時間，但顯然是在
    1960 年出版雙線走勢圖之前。


    非常令人訝異的，拉杜克竟然採用月線圖，這反映出當時'
