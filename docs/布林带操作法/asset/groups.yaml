    外，我們還需要根據分析對象的個別性質調整輸入變數，使得整個系統具備更大的彈性。


    方法 II 可能發生的最大缺失，就是進場過遲；換言之，一旦訊號確認之後，行情或許已經完成大部分。方法 II 的風險／報酬性質很難被量化，因為訊號發生當時，根本趨勢可能已經發展一段時間了。為了避免前述陷阱，或許應該等待行情回檔的機會。舉例來說，對於上升趨勢，不妨等待拉回走勢之後的第一個上漲日才進場。透過這種方式進場，可能會錯過一些機會，但對於所掌握的機會，至少會有較佳的風險／報酬關係。


    對於實際或打算交易的對象，最好根據股票性質與個人的風險／報酬偏好，透過測試程序決定方法 II 的參數設定。舉例來說，如果打算交易的對象是價格波動非常劇烈的成長型股票，%b、MFI
    與拋物線系統參數值可以考慮設定得高一點。這三項指標的參數定偏高（%b 超過 1.0），可以篩選最強勁的股票，停損價位也會加速接近當時的價格①。如果投資人非常嫌惡風險，出場機制的拋物線系統參數值可以設定得大一點；比較具有耐心的投資人，或許希望給交易部位多一點醞釀時間，拋物線系統可以採用小一點的參數值，讓停損點


    ① 章達的拋物線系統，朝趨勢發展方向調整停損。根據章達的建議，停損速度因子最初設定為 0.02，然後逐漸調高，上限為 0.2。如果速度因子的起始數據較高，或加快後續調整速度，停損位置會更快迫近當時的價格。在這種情況下，一旦趨勢反轉，你可以很快出場，但允許行情整理的空間也相對有限，交易系統比較可能出現反覆訊號。

