    多年來的研究資料顯示，20天期移動平均是很好的著手點（對於大多數金融產品都是如此）。包寧傑帶狀之所以適用，主要是來自於價格波動率，不是來自於精確挑戰移動平均長度；所以，我們希望移動平均期間必須長到足以反映中期趨勢與價格波動訊息①。


    實際結果顯示，如果你變更移動平均長度，代表帶狀寬度的標準差個數也需要調整。對於大多數運用來說，20天都是不錯的平均期間，但少數價格序列需要採用較長或較短的期間。±2個標準差的帶狀寬度，屬於不錯的著手起點，但仍經常需要調整。某些調整取決於平均期間長度或帶狀寬度。表3.2
    根據多年經驗列舉一些日線圖的相關參數，很多交易者發現這些數據都很適用。


