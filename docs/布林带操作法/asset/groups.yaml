    ## 本章內容重點


    - 漫步帶狀上限或下限的現象很普遍。

    - 價格走勢觸及包寧傑帶狀上限或下限，其本身並不代表任何交易訊號。

    - 當價格觸及帶狀邊緣，技術指標可以用來協助辨識該觸及現象屬於確認或未經確認的觸及。

    - 在持續性走勢過程內，均線可以提供支撐或壓力，適合做為進場點。


    ## 第 15 章


    ## 擠壓


    前文已經討論如何運用包寧傑帶狀來協助診斷頭部與底部排列，並且觀察漫步帶狀邊緣的動態走勢。第 IV 篇還會提供一些技術指標，藉以擴充我們的決策矩陣，但首先希望在此討論一項重要的包寧傑帶狀單獨運用——擠壓（The
    Squeeze）。


    在包寧傑帶狀的內容範圍內，「擠壓」引起的爭議最大，也是最值得重視的論點之一。包寧傑帶狀往往會出現一段延伸性的緊縮走勢；換言之，帶狀寬度變得非常窄，經過相當期間之後，行情又突然變得劇烈，帶狀寬度也隨之放大。本章準備先探討「擠壓」現象的意義，提供某種衡量工具。其後，我們準備討論價格波動率的一些背景資料，並考慮如何針對擠壓現象進行交易。


    包寧傑帶狀是由價格波動程度決定，擠壓現象則是純粹反映價格波動。一旦價格波動率下降到歷史最低水準，就進入擠壓狀況。帶寬指標（表 15.1 的定義）可以衡量擠壓現象①。就


    > ① 對於數學比較敏感的讀者可能發現，帶寬指標等於 4 倍標準差除以平均數。具備統計學背景的讀者可能也會發現，帶寬指標等於 4 倍的變異係數（coefficient
    of variation）。


    帶寬指標觀察，帶狀寬度的衡量可以運用到不同證券、不同期間或不同市場之間的比較（圖 15.1）。如同前文提到的，價格波動率可能因為時間不同而出現重大差異。正因為價格波動率的時間變異性，所以「擠壓」現象才變得重要。


    ## 表 15.1 帶寬指標計算公式


    (帶狀上限 - 帶狀下限) ／帶狀中心價位


    ![](img/94739d716a8c23abc5f5258874db296f_176_0.png)


    圖 15.1 IBM：包寧傑帶狀與帶寬指標，250 天資料。在 20 天期間內，帶寬指標讀數由 40% 以上縮小到不足 10%。


    擠壓有幾種不同定義。我們可以採用最簡單的定義：當帶寬下降到六個月以來的最低水準，擠壓狀況就視為產生²。


    > ② 在包寧傑帶狀與價格波動率的相關講習會中，我們提到另一種稍複雜的擠壓定義。首先繪製收盤價（或代表性價格）的 20 天期標準差曲線，其次繪製 125 天期的
    1.5 個標準差包寧傑帶狀；一旦前者觸及後者的下限，擠壓狀況就視為產生。


    幾年來，學術界流傳一種說法，認為價格本身沒有循環傾向，也不能被預測，但價格波動率則存在循環，而且能夠被預測。（讀者或許應該重新溫習第 9 章的內容。）這部分關於價格波動率的說法完全正確，雖然價格本身也存在循環傾向，而且也能夠被預測。


    舉例來說，美國股票市場就存在顯著的季節性趨勢。不論是每年或四年期的循環都很明顯，而且可以被用來協助交易。事實上，四年期循環可以解釋每年循環的大部分變動性。由非常不同的角度觀察，約翰·厄勒斯（John
    Ehlers）顯示商品價格蘊含有用的短期循環資料。


    關於價格不存在循環與不可預測的說法，雖然有些武斷，但有相當充分的證據顯示價格波動率存在循環，而且可以預測。舉例來說，請參考圖 15.2，這是美國長期公債期貨的價格與帶寬指標走勢。這份圖形清楚顯示
    19 天期的價格波動率循環，這個循環反映重要的行情轉折。另外，我們也可以看見一種「物極必反」的現象：偏低價格波動孕育著價格波動轉強的契機，偏高價格波動顯示價格波動趨穩的徵兆。風平浪靜的日子裡，應該預期暴風雨即將來臨；反之亦然。


    我們經常見到擠壓現象的運作。一旦行情進入整理，價格交易區間明顯縮小，價格移動平均線的走勢明顯趨於平緩，包寧傑帶狀寬度也緊縮，緊靠著價格均線波動（圖 15.3）。舞台已經搭建妥當。讓我們看看其他技術指標的狀況。行情上漲的日子裡，成交量是否配合放大？承接／出貨


    ![](img/94739d716a8c23abc5f5258874db296f_178_0.png)


    圖 15.2 美國長期公債的帶寬指標，250 天資料。價格波動率循環在債券市場中很明顯。


    ![](img/94739d716a8c23abc5f5258874db296f_178_1.png)


    圖 15.3 PPL：擠壓與突破，150 天資料。偏低價格波動率孕育著偏高價格波動率。


    指標是否向上反轉？價格下跌的日子裡，交易區間是否更縮小？開盤價與收盤價之間的關係如何？每種現象都有助於我們判斷隨後的行情發展方向。務必特別注意消息面，消息面經常是行情的催化劑。


    交易者小心了！千萬留意擠壓巨輪的真正轉動方向，因為行情啟動之前經常出現假動作（圖 15.4）。在擠壓階段即將結束時，價格經常朝某個方向進行假突破，然後突然反轉，朝另一個方向展開真正的走勢。這種假突破的走勢，最初發生在多年之前的
    S&P 500 指數期貨，從此日益普遍。


    ![](img/94739d716a8c23abc5f5258874db296f_179_0.png)


    圖 15.4 Adobe：擠壓，假動作與向上突破，100 天資料。先朝某個方向進行假突破，然後朝另一個方向發展。


    關於這類的假突破，如何處理呢？你可以等待狀況明朗化，或價格發展方向非常明確之後才進場。或者你也可以針對擠壓的突破走勢進行交易；一旦察覺突破，立即建立起始部位。然後，藉由停損策略繼續操作（例如：韋達的拋物線停損系統），如果起始部位被停損（顯示當初的突破為假突破），立即建立反向部位。這類操作需要採用追蹤性停損。拋物線之類的系統比較適用於期貨交易者，因為他們大多永遠停留在市場內，根據行情演變而反轉部位（多頭部位反轉為空頭部位，或空頭部位反轉為多頭部位）。


    如果擠壓狀況所反映的是價格波動縮小，而且價格波動縮小將孕育偏高的價格波動，那也應該有反向的擠壓。換言之，這是一種價格波動變大的對應現象——「擴張」（Expansion）。可是，就如同價格底部排列的明確程度總是超過頭部排列一樣，「擠壓」的明確程度也超過「擴張」。


    「擴張」有一項重要法則：在非常強勁的趨勢驅動下，價格波動率擴張到某種程度之後，價格上升趨勢的包寧傑帶狀下限將朝下發展，價格下降趨勢的包寧傑帶狀上限將朝上發展。一旦察覺到這種現象，就知道「擴張」已經發生，每當「擴張」現象反轉，很可能就代表價格趨勢反轉（圖
    15.5）。這並不意味著整個走勢已經結束；既有趨勢稍作整理之後，很可能會出現另一隻腳。可是，「擴張反轉」意味著既有趨勢的當前波段走勢已經結束了。接下來應該會出現整理或反轉行情，既有趨勢通常不會立即繼續發展。就策略角度思考，可以針對既有部位銷售選擇權，因為當時的權利金收入很高。


    ![](img/94739d716a8c23abc5f5258874db296f_181_0.png)


    圖 15.5 American Financial Group：擴張反轉，趨勢結束，100 天資料。價格發展到最高峰位，價格波動程度也最大。


    下一章將討論擠壓的因應策略，這也是我們提出的第一套方法：價格波動率突破系統。


