    透過這種方法設定參數，最大的問題在於——如果股票處在過渡性價位的——突然發生變動。假設，如果股價為 $19，每格大小為 0.5 點，3 格反轉為 1½點；但股價上漲到
    $20 之後，每格大小突然增加為 1 點，3 格反轉也突然增加為 3 點。正常情況下，價格愈高，反轉格數所代表的價格百分率愈小，但在過渡價位可能因為每格大小突然放大，結果導致價格愈高而反轉格數代表的價格百分率愈大。讓我們繼續採用前述的例子來說明，$19
    價位股票的 3 格反轉百分率幅度為 7.9%（1½÷19），$20 價位的 3 格反轉百分率幅度為 15%（3÷20），唯有當價格上漲到$40，反轉百分率才會下降到
    7.5%（3÷40）。


    為了避免發生這類突然變動，可以採用布林傑方格（Bollinger Boxes），運用平滑方法設定方格大小。我們利用表格列舉過去由惠仁到柯恩所採用的方格大小設定方法，然後分別繪製為圖形，橫軸代表價格，縱軸代表方格大小佔價格的百分率。圖
