    # 第 IV 篇


    # 包寧傑帶狀與


    # 其他技術指標


    第IV篇額外提供一些技術分析指標，主要是成交量方面的技術指標。此處希望建立一種嚴格的技術方法，使得交易的風險／報酬天秤顯然偏向我們。第IV篇也討論最後兩種交易方法，一種處理反轉型態，另一種屬於順勢交易方法。


    # 第 17 章


    # 包寧傑帶狀與


    # 其他技術指標


    一旦與其他技術指標配合運用，包寧傑帶狀的真正功能才會顯現出來。我們在此討論成交量技術指標，比較價格在帶狀內的走勢與指標行為（圖 17.1）。


    ![](img/94739d716a8c23abc5f5258874db296f_195_0.png)


    圖 17.1 Healthcare Realty，BB，MFI 與常態化成交量，150 天資料。價格重新測試先前低點的支撐力道，但對應的 MFI 底部顯然墊高——標準的多頭訊號。


    價格／技術指標之間的比較，或許可以提供經過確認或不能確認的結論。舉例來說，假定價格走勢漫步包寧傑帶狀上限，技術指標同時顯示強勢表現，這是上升趨勢將繼續發展的確認訊號（圖
    17.2）。假定你持有多頭部位，如果價格觸及包寧傑帶狀上限——這是需要考慮賣出的可能情況——應該參考技術指標。如果技術指標的表現足夠強勁，價格觸及帶狀上限的現象，可以用來做為多頭部位繼續持有的確認訊號。（反之，如果技術指標的表現強度較弱——相對於價格前次觸及帶狀上限的對應情況——可以視為早期警訊。）


    ![](img/94739d716a8c23abc5f5258874db296f_196_0.png)


    圖 17.2 Pfizer：BB，AD%與常態化成交量，120 天資料。當價格趨勢由上升過渡到下降，請留意擺盪指標的性質變動。


    如果價格觸及帶狀下限，但技術指標呈現強勢，前述的觸及走勢顯然得不到確認，反而代表典型的買進機會（圖 17.3）。舉例來說，你打算買進某支股票，在所追蹤的股票當中，你發現某支股票觸及帶狀下限，但對應的成交量擺盪指標顯示正值，這就是可能發生趨勢反轉的買進對象。如果這是第二度觸及帶狀下限，就可能形成
    W 底排列，你應該尋找足夠的證據顯示反轉型態已經完成。在這種情況下，你只需要等待盤勢轉強、確認反轉的訊號。


    ![](img/94739d716a8c23abc5f5258874db296f_197_0.png)


    圖 17.3 Ashland Oil：BB，盤中強度%，150 天資料。價格觸及帶狀下限而創新低，II%指標呈現正值讀數，並顯現多頭背離。


    如果價格觸及帶狀邊緣，但技術指標呈現中性，那就沒有明確意義（圖 17.4）。假定你持有多頭部位，價格觸及帶狀上限，技術指標顯示中性讀數，不妨把當時的狀況視為警訊，調緊停損，提高戒備。一旦技術指標呈現負值，那就是明白的賣出訊號。


    ![](img/94739d716a8c23abc5f5258874db296f_198_0.png)


    圖 17.4 Marsh & McLennan：BB，MFI與AD%，150 天資料。價格數度觸及帶狀上限，技術指標雖然呈現弱勢，但只有警告意味，直到後來才出現明確的賣出訊號。


    某些情況下，價格漫步帶狀上限，但技術指標呈現強勢。圖 17.5 就是一個典型的例子，在延伸性的漲勢中，價格數度觸及帶狀上限，每次觸及所伴隨的技術指標都顯現強勢。在趨勢發展接近頭部的階段，價格每次觸及帶狀上限，技術指標都持續轉弱，這代表一系列的警訊，直到你最後真正賣出為止。


    強勢股通常很難繼續持有。當強勢股不斷觸及包寧傑帶狀上限，繼續保有多頭部位實在是一種精神折磨。可是，如果技術指標能夠提供強勢的確認，那麼股票表現可能因為懷疑而受惠。


    ![](img/94739d716a8c23abc5f5258874db296f_199_0.png)


    圖 17.5 Sabre Holdings：BB，II%與常態化成交量，150 天資料。漫步帶狀上限，持續受到技術指標確認。


    前文曾經討論如何運用包寧傑帶狀來釐清 M 頭與 W 底排列。透過這種相對架構，你能夠在 M 頭或 W 底的後半階段採取逆勢行動，即使 M 頭的第二個峰位創絕對新高，或
    W 底的第二個谷底創絕對新低。關鍵在於相對高點或相對低點；換言之，高點或低點是根據包寧傑帶狀來決定，並不考慮絕對價格水準。現在，我們準備提出第二個濾網，一種能提升行動信心的技術指標。


    讓我們利用 W2 底部排列來說明。假設第二隻腳創價格新低，但當時沒有如同第一隻腳一樣跌破對應的包寧傑帶狀下限。就相對意義來說，這相當於 W4 底部排列，應該準備在第一個強勁走勢中買進（圖
    17.6）。當價格創新低之後不久，


    ![](img/94739d716a8c23abc5f5258874db296f_200_0.png)


    圖 17.6 Dow Chemical：絕對的 W2 排列，相對的 W4 排列，II%提供確認，150 天資料。價格創絕對新低，但沒有創相對新低，技術指標讀數反轉為正值。


    買進股票需要很大的勇氣；可是，如果提供確認的技術指標當時沒有創新低，應該可以加強買進的信心。在這種情況下，我們有兩項正面訊號：第一，相對於包寧傑帶狀來說，價格沒有創新低；第二，技術指標提供確認。第三項確認訊號可能是：價格上漲而成交量超過平均水準，或價格交易區間超過平均程度。


    這自然引起一個疑問：如果兩個確認指標優於一個指標，為什麼不採用三個或四個確認指標？當然沒有什麼理由不行。事實上，採用多個確認指標，絕對可以提高成功機率。可是，如果這些指標屬於共線性（collinear）指標，那就有問題了；換言之，如果技術指標都唱相同調子（譯按：這是說技術指標的性質非常類似，在特定情況下原本就會提供類似訊號，但使用者誤以為相同結論意味著結論非常可靠。舉例來說，在特定情況下，動能指標基本上都會提供類似的訊號；所以，如果你看見五種動能指標都出現類似訊號，這並不代表五種相同訊號就比較可靠。）。多重共線性（multi-collinearity）是一種可怕的陷阱——多種技術指標，它們實際上包含很多共通要素，卻被視為可以提供獨立訊號的指標。很多倒楣的交易者被這種陷阱吞噬，有些人甚至不知道自己怎麼死的。


    我們很容易避開多重共線性的陷阱，只需要發揮一點自律精神。每個類別內只挑選一種技術指標；例如，一種動能指標，一種趨勢指標，一種成交量指標，以及其他等等（表 17.1）——有點像美國境內的中國餐廳，點菜單只能由第
    a 欄選一項、由第 b 欄選一項……不可以彼此互換。如果採用三種動能指標，就會遭遇多重共線性的問題；它們都根據共同的資料來源，歸納出共同的結論。在中國餐廳裡，如果服務人員盡職的話，就不會接受這種點菜單，但電腦交易軟體恐怕沒有那麼聰明。當然，同一類指標之間如果不存在顯著的相關性，因此就不至於構成多重共線性的陷阱。但是，指標之間是否存在顯著相關性的問題，需要經由統計檢定嚴格分析；所以，除非有絕對的必要性——例如：不能取得其他類別的指標（這種情況下允許取代，但必須付出代價）——否則儘量不要這麼做。


    成交量指標與人氣指標特別值得考慮，能夠提供額外的資訊，而且不容易造成多重共線性的問題。為什麼？因為這些指標經常會引進新的自變數；換言之，這些變數沒有出現在其他指標內，所以發生多重共線性問題的可能性很低。動能指標與趨勢指標都是直接根據價格資料計算，多少已經反映出我們觀察價格走勢圖的結論，所以它們提供的幫助往往不如成交量指標或人氣指標。


    技術指標還存在另一種危險性質，那就是拍馬屁的狗腿傾向——根據 dictionary.com 的解釋① ——「個性卑鄙、自私自利，習慣奉承有權勢的人，藉以某取自己的利益」。關於技術指標，你最不希望的就是拍馬、奉承的個性，只曉得迎合你的意見，說一些你已經知道、甚至你希望聽到的話。在什麼情況下，這類指標最容易造成傷害呢？使用者瀏覽一堆技術指標，直至找到某個能夠確認其看法的指標為止。心裡已經打定主意進行某筆交易，然後才到處尋找支持的證據——態度顯然不正確——這正是狗腿子鋪下的天羅地網。為了避免這類陷阱，應該預先決定所採用的方法或工具，絕不因特定交易機會而改變。當然，某些情況下，或許可以參考其他適當的技術指標，但不應該幫「結論」找「證據」。


    尋找交易對象之前，就應該決定你準備採用的指標，並且完成測試，這點非常重要。決定分析工具之後，應該建立一套分析樣板，圖 17.7 就是基本樣版的範例，由三個部分圖形構成。最上端圖形包括價格
    K 線圖，以及包寧傑帶狀與 50 天移動平均，縱軸採用對數刻度。對數刻度使得走勢圖上任何位置的相同垂直距離，都代表相同的百分率變動，方便於比較。K 線圖強調開盤價與收盤價之間的關係，包寧傑帶狀


    ![](img/94739d716a8c23abc5f5258874db296f_203_0.png)


    圖 17.7 CVS：分析樣板 I，150 天資料。採用價格觸及帶狀邊緣的結構。納入相對強度指標，顯然有助於判斷行情。


    可以界定高點與低點的相對意義，50 天期移動平均可以反映趨勢。最上端圖形另外還繪製相對強度指標（relative strength）——股價相對於 S&P
    500 的走勢（譯按：「股價」除以「S&P 500」）——但採用的座標刻度不同。相對強度指標顯示個別股票相對於大盤的表現。圖 17.7 的中間圖形，是繪製為攤盪指標格式的
    21 天承接／出貨指標（Accumulation Distribution），我們藉由這項指標來確認價格走勢。最下側的圖形，則把成交量表示為 50 天均量的函數，有助於釐清價格型態。


    圖 17.8 是另一個分析樣本範例，也是由三部分圖形構成。最上端是採用對數刻度的價格 K 線圖，另外還有算術刻度的承接／出貨指標；中間是「移動平均收斂／發散指標」（moving
    average convergence / divergence，簡稱為 MACD）；最下端是常態化成交量（normalized volume）。


    根據自己的分析方法建立操作樣板之後，就開始尋找符合根本條件的交易對象。擬定決策的過程中，絕對不該考慮外部或未經測試的因素。如果不能遵循預先設定的操作樣板或某種嚴格方法，就可能被情緒左右而失敗。進行交易之前，預先決定你準備採用的技術指標，並且建立分析樣板。


    關於如何挑選技術指標、設定操作樣本，以及如何嚴格執行，有一點非常值得注意，那就是技術指標的挑選必須遵守第一原理——瞭解技術指標為何有效，並且在測試之前就


    ![](img/94739d716a8c23abc5f5258874db296f_205_0.png)


    圖 17.8 AT&T：分析樣板 II，150 天資料。特別強調成交量技術指標，此處顯然有助於判斷底部。


    已經對於測試結果有所預期②。對於所採用的技術指標，如果不太熟悉或不太瞭解的話，一旦遭遇困境或行情過度炙熱，很可能就會喪失信心。在情緒緊繃的情況下，我們的行為經常會失控。除非你對於自己使用的方法具備最高信心，否則情緒一旦激盪，就不可能繼續把持應有立場。


    本書討論的所有工具與技巧，都完全依據第一原理。換言之，它們都建立在市場的根本事實基礎之上，而且它們的


    ② 舉例來說，盤中強度指標是用來反映機構交易者的操作，顯示他們如何運用公司基金買進與賣出。只要觀察收盤價位在當天交易區間的位置，就可以解讀指標意義，因為在每天交易接近結束時，機構交易者通常會驅使價格朝下單方向移動。


    驅動力量完全被瞭解。讓我們觀察一個例子，這套技巧就是源自於第一原理，基本概念為：「價」是「量」的先行指標。在價格盤底期間，可以根據前述概念來比較成交量與 50
    天均量，在底部完成、價格突破之前，按照道理說，應該有「價」漲「量」增的現象。所以，可以根據這套推理設計一種技術指標，然後進行測試，觀察我們的理論是否正確。如果我們的看法沒錯，技術指標確實呈現預期行為，就可以採用這個概念。某些第一原理的忠誠信徒認為，絕對不該修改最初的格式，但我認為沒有必要這麼頑固。測試過程中，在某種程度內從事最佳化（optimization），然後抱著謹慎的態度進行調整，避開一些可能的陷阱，那就不應該沒問題。


    最佳化的相關議題，顯然已經超過本書準備處理的範圍，但任何有關技術指標與交易系統的討論，都不可能完全避開這個主題。最佳化程序佈滿可怕的陷阱，即使是最精明的投資人也難免受害。最佳化是一種有用的工具，但經常被濫用，而且是不知不覺的濫用。濫用的結果，使得最佳化程序只不過變成過去資料的精確陳述，不再是預測未來的有用工具。這也是前文討論的一種拍馬、奉承陷阱。


    所謂最佳化程序，就是尋找某特定方法的「最佳」參數值。現在，最佳化程序都由電腦執行，但在個人電腦普及化之前，這種程序是透過手工計算。最單純、最常見的最佳化程序，發生在移動平均穿越系統（moving-average
    crossover）。此處，我們希望最佳化的參數是移動平均長度。首先，設定一個較短的均線長度，根據過去某段期間的歷史價格資料，標示移動平均穿越系統在該期間內提供的所有買進與賣出訊號，計算這些訊號的獲利能力、交易筆數、最大損失、最大獲利……等評估因子。然後，採用一個稍長的均線長度，再計算買、賣訊號的獲利能力、交易筆數……等。總之，繼續調整均線長度，重複計算買、賣訊號的交易結果。然後，把所有的結果編列為表格，尋找獲利能力最高的移動平均長度參數值。


    對於一般實務運用的交易系統，最佳化程序都非常複雜。舉例來說，假定某套系統採用包寧傑帶狀與一項技術指標。如果我們按照 2 的倍數來設定移動平均長度，那麼 10
    期到 50 期之間總共有 21 種可能長度；同樣的，如果按照 2 的倍數來設定技術指標計算期間，4 期到 20 期之間總共有 9 種可能性——於是就產生 21×9=189
    種不同參數組合。接著還必須考慮帶狀寬度與技術指標門檻，假定各為 3 種，總共就有 189×3×3=1701 種不同參數組合。所以，我們瞭解實際測試的複雜程度。


    分段（sectioning）可以避免最佳化程序的常見錯誤：套入曲線；換言之，所設定的最佳參數值只適用於測試資料。把準備測試的歷史期間劃分為幾段，每段都進行獨立的測試。舉例來說，假定我們準備測試的歷史期間為十年，由
    1990 年到 1999 年，最佳化程序可以分別在三個不同的三年期內進行，每期的第一年做為助跑期，最佳化程序執行於第二年與第三年（譯按：交易訊號完全來自第二年與第三年，第一年助跑期只提供資料——舉例來說——在第二年初，計算


    # 表 17.1 類別指標範例：每種兩個


    | 類別 | 指標範例 |

    |---|---|

    | 動能 | 變動率（rate of change），隨機（stochastics） |

    | 趨勢 | 線性迴歸（linear regression），MACD |

    | 人氣 | 統計調查，賣權-買權比率（put-call ratio） |

    | 成交量（開放式） | 盤中強勢（II），承接／出貨（AD） |

    | 成交量（封閉式） | 資金流量指數（MFI），成交量加權 MACD |

    | 超買／超賣 | 商品通道指數（commodity channel index），相對強弱指數（RSI） |


