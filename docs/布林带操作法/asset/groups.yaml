    你所找到的線形涵蓋時段如果能夠恰當反映市況，對於交易絕對有所助益。日線圖、週線圖、月線圖或季線圖實在太過渺茫，完全超出掌控範圍，但如何適當劃分一天的時段呢？先把每個小時當做一個時段開始，最初半小時視為一小時。所以，走勢圖上每天有七個小時。還可以考慮把盤前時'
