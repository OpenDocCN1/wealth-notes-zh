    # 第 II 篇


    ## 基本觀念


    第 II 篇提供包寧傑帶狀的基本觀念。第 6 章、第 7 章與第 8 章討論交易帶狀或包絡（envelopes）的歷史緣由，解釋包寧傑帶狀的建構，並且分別列舉這些工具所推演出来的指標。對於統計學資料有興趣的讀者，可以參考第
    9 章的一些說明。


    ## 第 6 章


    ## 歷史緣由


    交易帶狀（或包絡、通道……等名稱）的運用已經有很長一段歷史，發展過程很有趣。本章只準備討論一些重點，讓讀者大致明白這項技巧的起源背景，瞭解它在整個技術分析架構上的地位①。


    我們或許應該由名詞定義著手。交易帶狀（trading bands）是沿著某中心趨勢之上、下建構的帶狀，例如：以某移動平均線爲中心，分別乘以某百分比而向上與向下平移（譯按：界定交易帶狀、包絡或通道之上、下兩個端點，譯文分別稱爲「上限」與「下限」）。交易帶狀的上限與下限不一定對稱，但是兩者必須以某中心點做爲基準。包絡（envelopes）是建立在某價格結構的上、下兩側，例如：包絡上限定義爲每天盤中最高價的移動平均，下限定義爲每天盤中低價的移動平均，這兩條移動平均所界定的帶狀區間就是一種包絡。包絡的上限與下限可能彼此對稱，但通常不對稱，而且兩者並不反映某中心基準。通道（channels）是沿著價格上、下兩側繪製的平行線，使得通道觸及價格結構的關鍵點。


    關於這方面的引用，我們能找到的最早資料是魏爾佛利·拉杜克（Wilfrid LeDoux）在 1960 年取得版權的雙線走勢圖（Twin-Line Chart，圖
    6.1）。這是一種簡單、漂亮的方法，圖形部分是利用黑線與紅線分別把每個月份的高價與低價銜接為曲線。採取行動的相關法則有幾項，其中最清楚者為：每當紅線（月份低價）超越黑線（月份高價）的谷底兩點或以上就買進。這個技巧的基本動機，是釐清重大行情擺動的走勢型態，使得個股操作能夠取得最大效率。我們沒有針對這個方法進行檢定，但根據資料所提供的一些案例顯示，績效似乎不錯。


    拉杜克在 1918 年開始從事交易，1921 年就宣告破產，這個慘痛經驗促使他深入研究技術分析。大約在 1930 年，他採用第一項工具，稱爲「偵測圖」（Detectographs）的
    ROBOT 走勢圖。雖然這項工具的細節內容已經不可考，但我們知道這也是強調最高價與最低價相對關係的走勢圖。不幸的，我們不知道他開始採用通道工具的精確時間，但顯然是在
    1960 年出版雙線走勢圖之前。


    非常令人訝異的，拉杜克竟然採用月線圖，這反映出當時的交易取向顯然傾向於長期。當時，所謂的超買與超賣，絕對都是針對長期重大頭部或底部而言，這也是月線圖比較容易顯示的事件。反之，就目前的情況來說，超買與超賣都是就最短的時間架構而言，兩者之間的對照相當有趣。


    ![](img/94739d716a8c23abc5f5258874db296f_71_0.png)


    圖 6.1 雙線走勢圖：交易包絡系統的早期實例。

    （資料來源：The Encyclopedia of Stock Market Techniques, New Rochelle, N.Y.: Investors
    Intelligence, 1985）


    ① 技術分析的歷史發展過程模糊不清。我已經儘量嘗試把一切解釋明白。很多原始資料最初刊載於通訊刊物或輔助論文。眾多文獻已經遺失或被故意毀損。這方面的知識與技巧很多都密而不宣，實際瞭解這些技巧的鑑賞家在過世之後也經常把「密技」帶入地下。各方面的說法往往相互衝突，那些能夠統合各種說法的人，又經常別有意圖。如果任何人能夠就帶狀、包絡，以及相關指標或系統提供額外的資料，我們將非常感激。


    大約在拉杜克出版雙線走勢圖方法的相同期間，查斯特·凱納（Chester W. Keltner）也在 1960 年的著述《如何透過商品交易賺錢》（How to
    Make Money in Commodities）提到 10 天平均移動法則（Ten-Day Moving Average Rule，圖 6.2）。凱納首先計算代表性價格——特定期間內的最高價、最低價與收盤價總和，結果除以3
    ②。然後，計算代表性價格的 10 天期移動平均，繪製為曲線圖。其次，計算每天的價格區間（最高價與最低價之間的差值）的 10 天期移動平均。對於下降趨勢，把代表性價格的
    10 天期移動平均，加上價格區間的 10 天期移動平均，將此定義為買線（buying line）；一旦價格向上穿越買線，就應該翻空為多（回補空頭部位，同時建立多頭部位）。反之，對於上升趨勢，把代表性價格的
    10 天期移動平均，減去價格區間的 10 天期移動平均，將此定義為賣線（selling line）；一旦價格跌破賣線，就應該翻多為空（結束多頭部位，同時建立空頭部位）。表
    6.1 列示凱納的簡要計算公式。


    ![](img/94739d716a8c23abc5f5258874db296f_72_0.png)


    圖 6.2 凱納的買／賣線：運用買、賣價格可以建構交易帶狀。


    （資料來源：Chester W. Kelter 的 How to Make Money in Commodities, Kansas City, Mo.:
    The Keltner Statistical Service, 1960）


    ② 代表性價格是很古老的觀念，通常定義為（最高價+最低價+收盤價）÷3。這個定義也可以納入開盤價，換言之，代表性價格=（開盤價+最高價+最低價+收盤價）÷4。我很早就建議包寧傑帶狀採用代表性價格，這項技巧目前仍然很有用。採用代表性價格建構的包寧傑帶狀，形狀比較平滑一些，提供訊號也稍遲，但對於某些運用則是優點。


    ### 表 6.1 凱納帶狀的計算公式


    凱納的買線：


    代表性價格的 10 天移動平均 + 高低差價的 10 天移動平均


    凱納的賣線：


    代表性價格的 10 天移動平均 - 高低差價的 10 天移動平均


    由幾個方面來看，凱納的方法具有重大意義：


    - 第一 採用代表性價格，是相當明智的決定。代表性價格更能反映真正的交易狀況，「代表性」應該超過我們通常採用的收盤價。納入開盤價之後，代表性價格也可以反映非交易時段內發生的事件。這對於目前的交易非常重要，因爲你所運用的價格資料可能沒有涵蓋全部重要的交易活動。舉例來說，紐約證交所（NYSE）提供的報價資料，通常只反映紐約證交所交易時段內的事
    件，可能包含或不包含場外或盤後交易發生的事件。況外，重大事件經常發生在海外，你所採用的報價資料的交易時段可能包含或是不包含這些海外事件。為了單純起見，本書一律採用收盤價，但在實際運用上應該考慮採用代表性價格。

    - 第二 凱納運用每天的高、低價差計算平均價與帶狀之間的寬度，這是一項創舉，使得後來能夠發展出更具調整能力的方法。這也把價格波動程度考慮在內，我們認為這是該系統得以成功的重大關鍵。

    - 第三 凱納只交替使用買線或賣線，如果我們持續而同時繪製買線與賣線，顯然就成為交易帶狀的第一個例子（圖 6.3）。


    ![](img/94739d716a8c23abc5f5258874db296f_74_0.png)


    圖 6.3 IBM 的 150 天凱納通道：利用買、賣線可以建構交易帶狀。


    1960 年代，理查·董鉉（Richard Donchian）設計一套簡單、漂亮的方法，透過四週法則而讓市場決定交易包絡。觀念本身非常單純：價格穿越四週高價，則買進；價格跌破四週低價，則賣出。後來，一家著名的商品交易與分析機構唐恩&哈吉特（Dunn
    & Hargitt）測試各種電腦化交易系統，結果顯示董鉉的法則績效最佳。


    根據前述的說明，四週法則可以演化為包絡，換言之，包絡上限設定為最近四週最高價，下限為最近四週最低價。結果，凡是把最近 n 期最高價設定為通道高限，最近 n
    期最低價設定為通道低限的方法，統稱為董鉉通道（Donchian Channel，圖 6.4）。據說，這是目前一種更成功方法——龜族（Turtles）所運用的系統——的核心技巧③。


    1966 年，吉拉定·魏絲（Geraldine Weiss）編著的投資通訊刊物《投資素質趨勢》（Investment Quality Trends，IQT）引進一種新型態的包絡——價值評估包絡（valuation
    envelope，圖 6.5）。


    IQT 運用股息殖利率的歷史資料，提供月線走勢圖與價值高估／價值低估曲線。根據我們的瞭解，IQT 採用某種策略性期間內的最低與最高股息殖利率做為基準，然後依照當時的股息殖利率來推測未來的價值高估與價值低估水準。對於一支股息趨於成長的股票，包絡的形狀類似向右開口的喇叭——隨著時間經過而開口持續擴大的錐狀。這是理性分析（Rational
    Analysis）的初期格式，我們把這種概念視為「技術分析與基本分析的關鍵結合」。魏絲確實是一位開疆闢地的先鋒。當時，很少投資通訊刊物採用嚴格的計量方法；由於電腦運用還不算普及，相關的運算恐怕非常繁瑣。


    ③ 一位著名的商品交易者理查·丹尼斯（Richard Dennis）傳授的一套專門技術，使用者稱為「龜族」。


    ![](img/94739d716a8c23abc5f5258874db296f_76_0.png)


    圖 6.4 IBM 的 150 天董鉉通道。這是商品交易領域內非常流行的一種方法。


    1970 年，賀斯特（J. M. Hurst）出版《股票交易時效獲利秘技》（The Profit Magic of Stock Transaction Timing），這又代表一項重大發展。賀斯特的處理重點擺在循環上，採用「固定寬長的線性曲度通道」，藉以顯示股票價格的循環型態。他


    ### 電子資料系統（EDS）


    ![](img/94739d716a8c23abc5f5258874db296f_77_0.png)


    圖 6.5 電子資料系統（EDS）：價值評估包絡是一種結合技術分析與基本分析的方法。（資料來源：Investment Quality Trends, La
    Jolla, California）


    的方法運用多個手繪通道（圖 6.6），分別對應不同的價格循環成分。這些包絡彼此交錯，但在重要轉折點經常相互確認。在該書最後，賀斯特曾經約略說明這套方法的機械化程序（圖
    6.7），但正文提供的範例似乎都採用手繪圖形。我們懷疑，他所提到的機械化程序，可能超越當時普及科技所能處理的範圍。幾年之後，有人嘗試把賀斯特的技巧系統化，但我們沒有看到任何成功的案例④。


    ![](img/94739d716a8c23abc5f5258874db296f_78_0.png)


    圖 6.6 手工繪製的價值評估包絡。

    （資料來源：The Profit Magic of Stock Transaction Timing by J. M. Hurst, 1970，由 Traders
    Press, Greenville, S.C.重新刊印）


    ④ 賀斯特曾經在 1970 年代舉辦一系列的講習會，大力推展自己研究結果，但目前過著隱居生活。這些相關資料大多流失，直到交易者出版社的艾德·朵伯森（Ed Dobson，Trader’s
    Press in Greenville, South Carolina）聯絡賀斯特，重新刊印《循環技巧服務訓練課程》（CycliTec Services Training
    Course）。這些資料最初出版於 1973 年，包括三大冊講義與一套錄音帶。


    ![](img/94739d716a8c23abc5f5258874db296f_79_0.png)


    圖 6.7 繪製包絡所運用的循環。


    （資料來源：The Profit Magic of Stock Transaction Timing by J. M. Hurst, 1970，由 Traders
    Press, Greenville, S.C.重新刊印）


    接下來，交易帶狀的發展開始呈現百花爭鳴的趨勢，很難認定某些技巧的眞正創始者。這個階段內，很多分析家都對這方面的研究產生興趣，採用的技巧有一項共通特色：利用價格移動平均向上與向下平移而建構帶狀（圖
    6.8）。相對於過去的研究，當時發展的最大差異，在於如何按照平均價格爲準，設定某點數或百分點的帶狀寬度。舉例來說，請參考表 6.2。賀斯特在他的著作中，顯然也偏愛採用移動平均，但我們認爲，依據移動平均爲中心而透過某種機械性方法建立帶狀寬度的方法，應該稍後才出現，大約在
    1970 年代初期。這種處理方法立即造成問題。第一，我們必須根據實證資料決定個別對象適用的帶狀寬度。第二，即使能夠辦到第一點，帶狀寬度也需要隨著時間經過而調整。所以，百分率或點數的帶狀雖然有助於界定交易操作的高價與低價，但運用上仍然有困難，很多參數必須由使用者主觀猜測。


    ![](img/94739d716a8c23abc5f5258874db296f_80_0.png)


    圖 6.8 範例：Deere & Co.股票，200 天均線百分率包絡。這是最早期的「現代」帶狀——百分率帶狀。


    ### 表 6.2 百分率帶狀：5%帶狀的計算公式


    |  |  |

    |---|---|

    | 帶狀上限 | 21 天移動平均 × 1.05 |

    | 帶狀中心 | 21 天移動平均 |

    | 帶狀下限 | 21 天移動平均 ÷ 1.05 |


    1980 年代初期，虎標軟體的威廉·史密特（William Schmidt of Tiger Software）出版一套有關市場時效的黑盒子電腦化軟體，稱爲《股票市場頂尖時效系統》（Peerless
    Stock Market Timing)。這套系統提供很多類型的交易訊號，其中之一採用百分率帶狀（圖 6.9）。涉及整體大盤的某些訊號，往往來自於道瓊工業指數與寬度擺盪指標⑤（breadth
    oscillators）；個股的某些訊號則來自成交量擺盪指標（volume oscillators）。這套軟體運用技術分析，就整體市場趨勢提出系統性決策。


    ![](img/94739d716a8c23abc5f5258874db296f_81_0.png)


    圖 6.9 道瓊工業指數 21 天移動平均與 4%帶狀。很多大盤時效指標都是以道瓊工業指數為中心而建立的百分率帶狀。


    ⑤ 股票市場寬度是指涉及整體市場的某些統計數據，例如：漲／跌家數，上漲（下跌）股票成交量，創五十二週新高（新低）家數……等。這些數據可以反映整體大盤的走勢強度——就理論上來說，市場走勢所涉及的參與家數愈多愈好。


    截至目前為止，我們討論的帶狀與包絡，上半部與下半部都彼此對稱。1980 年代初期，馬克·柴京（Marc Chaikin）與波伯·布洛根（Bob Brogan）提出第一套完全具備適應能力（fully
    adaptive）的帶狀，稱爲「波馬帶狀」（Bomar Bands，換言之，Bob 與 Marc）。這個帶狀涵蓋最近一年內 85%的價格區間（表 6.3）。這是一項重大創舉。如果上升趨勢很強勁，波馬帶狀的上半部就會明顯加寬，下半部寬度則會縮小。價格波動愈劇烈，股價帶狀愈寬；反之，價格愈穩定，帶狀愈窄。如果下降趨勢非常顯著，帶狀下半部的寬度會擴大，上半部則縮小（圖
    6.10）。所以，波馬帶狀不只打破帶狀上、下對稱的傳統，而且還會隨著時間經過，就價格結構調整帶狀寬度。


    ### 表 6.3 波馬帶狀計算公式


    帶狀上限：涵蓋最近 250 天內，較 21 天移動平均高的 85%交易價格

    帶狀中心：21 天移動平均

    帶狀下限：涵蓋最近 250 天內，較 21 天移動平均低的 85%交易價格


    波馬帶狀的主要功能，是讓分析者不需要再猜測帶狀寬度。如此一來，分析者可以專注於交易決策，帶狀寬度則由電腦設定。不幸的，波馬帶狀涉及繁瑣的計算，在 1980
    年代初期幾乎屬於不可能的任務，即使是今天，也只適用於網路研究分析平台（Instinet’s research and analytics，R&A）。所以，波馬帶狀的運用並不普及，沒有辦法取得應有的認同。


    ![](img/94739d716a8c23abc5f5258874db296f_83_0.png)


    圖 6.10 波馬帶狀。(資料來源：Instinet''s Research and Analytics)


    1970 年代末期到 1980 年代初期之間，DYR 公司的吉姆·葉慈（Jim Yates）採用選擇權的隱含價格波動率（implied volatility）設定帶狀寬度。他採用一種方法，判斷個別證券相對於整體市場預期的超買或超賣狀況；換言之，利用價格波動率預期做為根據，建立股票或選擇權的理性決策架構。這個架構包含
    6 個區間，每個區間都對應某種適當的選擇權操作策略（圖 6.11）。這也就是葉慈的選擇權策略光譜（Options Strategy Spectrum）；目前，他的兒子仍然運用這套系統。


    事實上，葉慈是採用選擇權的隱含價格波動率建立價格區間（帶狀）。然後，根據當時的市況，他利用這些帶狀決定最適當的操作策略。這些構想非常傑出，也是我所進行的研究工作的基礎。


    ![](img/94739d716a8c23abc5f5258874db296f_84_0.png)


    圖 6.11 隱含風險指標。

    （資料來源：The Options Strategy Spectrum by James Yates, Homewood, Ill.: Dow Jones-Irwin,
    1987）


    隨著時序進入 1980 年代，我開始活躍於選擇權市場，最主要癖藉是對於各種不同型態的價格波動率的瞭解；可是，我沒有榮幸遇到吉姆・葉慈。我對於技術分析也很有興趣，尤其是交易帶狀方面的研究。我認為，價格波動率應該是決定交易帶狀寬度的最重要依據。於是，我開始進行一些測試，透過各種不同方式衡量價格波動率，藉以決定帶狀寬度。不久之後，我發現，標準差（standard
    deviation）的結果非常理想——主要因為這是取讀數偏離平均數之差値的平方⑥。


    ⑥ 因為這是取讀數偏離平均數之差値的平方，所以包寧傑帶狀可以根據價格波動程度調整帶狀寬度，尤其是整個價格結構突然發生變動的話。


    最初，我計算長期的標準差，以此建構百分率帶狀——這基本上是一種具備適應能力的百分率帶狀，但在某些方面的運用仍然很有趣。可是，隨著時間經過，這些設定逐漸脫序，顯然需要重新調整。在這種情況下，我認為標準差的計算或許也可以採用「移動」方式，就像「移動平均」的計算一樣（圖
    6.12）。這個構想確定之後，接下來的發展就很自然了。


    ![](img/94739d716a8c23abc5f5258874db296f_85_0.png)


    圖 6.12 包寧傑帶狀，Deere & Co. 200 天資料。


    包寧傑帶狀的研究工作，採用 S-100 型電腦，記憶容量只有 32,000 bytes。作業系統採用迪吉多研究公司（Digital Research）的 CP/M；程式語言為
    MBASIC，這也是比爾·蓋茲的第一套微軟產品。測試則是在一種稱為 SuperCalc 的試算

