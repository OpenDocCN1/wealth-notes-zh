    如果價格均線挑選恰當的話——換言之，如果均線能充分反映中期趨勢——那麼對於漫步帶狀上緣或下緣的走勢，折返過程可以在均線獲得顯著支撐或遭遇明確壓力（圖 14.5）。一旦折返走勢觸及均線，往往代表介入、加碼或重新進場的機會。這些機會代表很好的風險／報酬關係，如果判斷錯誤，也很快就會知道——但判斷正確帶來的獲利潛能非常可觀。


    漫步帶狀上限或下限的發展，經常由三波段主要走勢構成。很多理論——包括艾略特波浪理論在內——都認為趨勢是由三個主要上升或下降波段構成，中間夾著兩波段的修正


