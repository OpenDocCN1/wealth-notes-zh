    ## 本章內容重點：


    - 基本資料包括：開盤價、最高價、最低價、收盤價與成交量。

    - 不要忽略開盤價。

    - 走勢圖有四種：曲線圖、長條圖、圖叉圖與K線圖。

    - 包寧傑長條圖結合傳統長條圖與K線圖的優點。

    - 對數刻度很重要。

    - 常態化成交量。


    ## 第3章


    ## 時間架構


    本書考慮三種時間架構：短期、中期與長期。這些都是大家非常耳熟的名詞，但實際意義可能因為個人觀點與交易方式而不同。在某個意義層面上，它們對於不同投資人各自代表不同的意義；在另一種意義層面上，它們又蘊含類似的心理概念。每位投資人會根據自己的觀點解釋這些名詞的意義，但仍然依據這些時間架構來組織各種工作與功能。所以，對於某位投資人來說，所謂的「長期」可能代表一年，但對於另一位投資人而言，「長期」很可能代表隔夜的意思。可是，這些投資人對於時間架構的解釋或許截然不同，但還是按照短期、中期與長期的分類來組織投資工作。


    一直到 1970 年代末期之前，短期通常是指日線圖而言，中期則是指週線圖，長期是指月線圖或季線圖。雖然我們依此稱呼走勢圖，但實際上是指每支線形——不是整個走勢圖——涵蓋的期間而言。所以，根據定義短期日線圖的每支線形代表一天的價格交易紀錄。到了
    1980 年代初期，金融市場的步調明顯加快。隨著股票指數期貨的引進，肯薩斯期貨交易所（Kansas City Board of Trade）開始提供價值線


    ValueLine 指數期貨契約。於是，「短期」開始意味著小時走勢圖，日線圖成為「中期」走勢圖，週線圖或月線圖屬於「長期」走勢圖。這些年來，整個時間架構繼續朝更短促的方向發展。有關時間架構的可能組合，請參考表
    3.1。可是，不論時間架構的實際內涵如何變化，根本概念大體上還是相同。


    ### 表 3.1 時間架構的可能組合


    長期 中期 短期

    年 季 週

    季 月 週

    月 週 日

    週 日 小時

    天 小時 10 分鐘

    小時 10 分鐘 跳動檔


    舉例來說，所謂的長期，是指你進行背景分析所考慮的時間架構。長期代表一種大環境，你在這種環境下決定投資計畫的整體展望與基本方向。對於眼光握得比較遠的投資人，貨幣政策與財政政策的相關數據很重要，資金流動、證券價值評估資料、法規管制……等也屬於重要考量因素。如果投資人的眼光比較短視，股票價格的
    200 天移動平均線發展方向與殖利率曲線斜率都屬於重要因素。


    所謂的中期，是指你進行證券分析所考慮的時間架構。這也是選股策略與類股輪動所採用的時間架構。在這種情況下，整體大盤的統計數據可能很重要。長期投資人會考慮大盤相關數據，例如：漲/跌家數，創新高/新低家數、類股輪動、相對強度趨勢，以及每季的供、需因素。短期投資人或許比較關心類股走勢的盤整、反轉與突破。


    所謂的短期，是指你實際執行交易所考慮的時間架構。換言之，你希望交易指令能夠得到最佳的執行效果，這種過程所考慮的時間架構就屬於短期。在這種情況下，你通常最關心一些短期技術指標、價格型態、價格波動率的變動、場內提供的交易資料……等。


    每種時間架構都有其工作性質，對於每位投資人來說，這些工作與完成工作所需要採用的工具都各自不同。重點是明確釐清每種時間架構的工作範圍。讓我們提出一個違反這項法則的最典型例子：當一個部位已經建立後，卻繼續觀察短期走勢圖！交易部位建立之後，焦點應該移回到中期時間架構的相關工具上，這也是你管理交易部位應該使用的工具。唯有當中期工具與指標顯示你應該結束交易部位——不論獲利了結或認賠出場——的時候，才應該重新啟用短期工具來執行既定決策。


    時間架構與工作之間的組合搭配經常模糊不清，使得投資更顯得困難。這會造成決策程序的困擾，清明的思緒也會受到遮蔽。在最關鍵的決策時刻，我們總會受到最強烈的誘惑，徑意放棄紀律規範，採用一些不該運用的工具。這些工具表面上看起來似乎可以提供額外資訊，實際上反而造成資訊更不可靠。由於與當時的工作性質不能協調，新的資料反而讓清水變得渾濁。


    就分析層面來說，這些觀念非常重要。包寧傑帶狀在短、中、長期的時間架構上都可以運用。只要挑選價格走勢圖的適當線形涵蓋期間，以及適當的線形數量做計算，並且挑選適當的帶狀寬度，這項分析工具就可以彈性運用於三個不同的時間架構。原則上，我們必須根據中期時間架構挑選與包寧傑帶狀搭配運用的價格走勢圖，計算過程所依據的時間架構必須是最能夠反映中期趨勢的平均數，至於帶狀寬度則取決於該平均數的長度。讓我們舉出一個典型的例子：日線圖／20
    天計算期間／2 個標準差的帶狀寬度（譯按：在這個例子當中，我們決定日線圖最能夠反映中期趨勢，這個時間架構最適合採用 20 天的期間計算（移動）平均數與標準差，然後採用
    2 個標準差的距離做為包寧傑帶狀的寬度。細節內容請參考第 11 篇）。


    請注意，前一段內，我們提到平均數的計算期間必須最可以反映中期趨勢。不要根據移動平均穿越系統的最佳買／賣訊號來挑選平均期間。事實上，我們希望採用的平均期間長度，應該大於移動平均穿越系統最高獲利的期間長度。為什麼？因為我們的訊號來自於帶狀互動，不是來自於穿越。對於所挑選的平均數，利用它做為基準來建立一套相對架構，然後在此架構內嚴格評估價格行為。這項平均數應該用來界定支撐／壓力，不是提供穿越訊號。


    如何決定正確的移動平均長度呢？最好的移動平均應該能夠讓修正走勢獲得支撐，尤其是趨勢發生反轉之後的第一個修正走勢。舉例來說，假定大盤指數創低價，然後出現 10
    天的彈升，接著向下拉回 5 天，然後又走高，並且向上突破稍早 10 天期漲勢的高點，確認新的上升走勢已經成立。正確的移動平均，應該能提供 5 天回檔走勢最低點的支撐（如同圖
    3.1 的情況）。如果移動平均的期間太長，就不能及時界定支撐，而且均線向上回升的時間也太遲，不能及時反映新趨勢的誕生（如同圖 3.2 的情況）。移動平均的計算期間太短，價格可能來回穿越均線兩、三次，訊號反覆而不能提供有用的支撐或趨勢訊息（圖
    3.3）。


