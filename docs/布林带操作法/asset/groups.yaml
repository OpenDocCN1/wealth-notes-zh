    ## 第 9 章


    ## 統計學背景資料


    首先，提供一些背景資料：


    測量一群人的身高，標示每種身高（165 公分、166 公分……等等）的人數，分別繪製為柱狀圖。如果人數夠多，身高將呈現常態分配（normal distribution，圖
    9.1）；換言之，以平均身高為中心，呈現左、右對稱的鐘鈴狀。大多數人的身高都在平均數附近，平均數也是鐘鈴狀分配的最高點。身高愈遠離平均數，人數愈少。對於非常高或非常低的身高，人數都很少。


    ![](img/94739d716a8c23abc5f5258874db296f_111_0.png)


    圖 9.1 常態分配。(資料來源：The Economist Numbers Guide by Richard Stutely, New York: John
    Wiley & Sons, 1998)。


    如果透過相同方式測量股價變動，將發現股價分配的尾端太肥厚（相對於常態分配而言）。換言之，大漲與大跌的發生頻率超過常態分配的預期，股價小幅變動的發生頻率則低於預期。這意味著股價並不呈現常態分配，所以很多統計法並不適用。


    如果你想精確估計某種東西，可以取樣調查。假定某個箱子裡裝著數百顆紅球與綠球（除了顏色以外，其他條件完全相同），如果你隨機選取 30 個球（樣本大小），這個樣本的紅、綠球比率應該能夠反映母體（整箱）的紅、綠球比率。樣本愈大，估計也愈準。如果這些球的顏色不只兩種，那就需要更大的樣本才能提供理想的估計。


    如果你瞭解前述說明，接下來的內容就很簡單了。


    我們採用標準差來設定包寧傑帶狀寬度，自然也就可以利用（或濫用）統計法則。由於股價分配不屬於常態分配，而且一般抽樣的樣本也不夠大，所以很多推估方法都不甚適用，但某些統計現象似乎還是成立。


    中央極限定理（central limit theorem）告訴我們，即使資料本身——股價——並不呈現常態分配，但隨機抽樣的子集合仍然呈現常態分配，所以仍然適用統計法則。即使樣本不是很大，前述的結論仍然成立。因此，在某種程度上，一般的統計常理還是適用，雖然不甚完美。


    關於包寧傑帶狀，我們最經常考慮的統計性質就是回歸均數（regression to the mean）——每種東西最後都會返回老家。統計學上的老家就是平均數。所以，如果價格偏離平均數，我們應該預期價格會回歸均數。這也是超買（overbought）與超賣（oversold）等技術分析名詞背後的統計觀念。根據回歸均數的原理，如果價格處在分配的邊緣——包寧傑帶狀的上限或下限——將回歸到平均價格（也就是包寧傑帶狀的中心點）。


    金融產品價格雖然存在某種程度的回歸均數傾向，但這種傾向並不十分強烈，當價格觸及帶狀邊緣，並不自動代表買進或賣出的訊號。這也是為什麼我們要透過某些指標確認價格觸及帶狀邊緣的現象。配合運用這些指標，就能夠判斷價格是否回歸均數或繼續展現既有的趨勢。一旦價格觸及帶狀邊緣的現象經過特定指標確認之後，這不代表買進或賣出訊號；所謂的「確認」是確認趨勢將持續進行。如果前述觸及現象沒有經過確認，那就代表價格很可能回歸均數。我們透過這種方式，結合統計學與技術分析的長處，藉以增進決策成功的機會。


    即使樣本大小不能滿足所需要的最低程度，但只要中央極限定理成立，基本的統計程序還是適用。我們的測試結果顯示，包寧傑帶狀的情況正是如此。隨著樣本大小（計算期間天數）的變動，為了讓帶狀涵蓋特定比例的資料點，縱使需要稍微調整，但不論計算期間是
    10 天或 50 天，帶狀的基本行爲仍然相同。這種說法顯然適用於包寧傑帶狀，雖然 2


    個標準差帶狀所涵蓋的資料點比例爲 89%，不是一般所預期的 95%。


    帶狀涵蓋的資料點少於一般預期程度——根據一般預期，2 個標準差的帶狀寬度應該涵蓋 95%左右的資料點——可能的理由有兩點。第一，我們利用母體資料計算，帶狀寬度窄於樣本資料的計算①。第二，股票價格不屬於常態分配——極端觀察值的發生頻率高於一般預期——帶狀所不能涵蓋的資料點相對偏多。實際上可能造成影響的因素無疑更多，但這兩點應該是主要因素。


    「非常態分配」究竟是什麼樣子呢？較肥厚尾部的形狀又如何？請參考圖 9.2。實線繪製的鐘鈴狀較高瘦，代表常態分配，也代表所謂的一般預期。虛線繪製的鐘鈴狀較扁平，這就是股票市場價格的分配形狀；相對於常態分配來說，股票價格發生小幅變動的機率較低，發生大幅變動的機率較高。兩個鐘鈴狀的差異，稱爲「峰度」(kurtosis)，股票價格分配的峰度顯然不同於常態分配。


    包寧傑帶狀呈現規律性的收縮與擴張，讀者可以由走勢圖清楚察覺這種現象。債券市場的情況尤其顯著，19 天期的價格波動率循環非常突顯（圖 9.3）。事實上，學術界針對這種現象提供很多研究資料。有興趣的讀者可以在
    GARCH 與


    ① 標準差可以根據母體或樣本資料計算，兩者的除數（分子）不同，母體爲 n，樣本爲 n-1。樣本的標準差較大，母體的標準差較小（帶狀較窄）。


    ![](img/94739d716a8c23abc5f5258874db296f_115_0.png)


    圖 9.2 峰度：股票市場並不呈現常態分配——股價出現大幅變動的發生頻率相對偏高。


    ![](img/94739d716a8c23abc5f5258874db296f_115_1.png)


    圖 9.3 債券市場價格波動率循環，三十年期政府公債值利率，涵蓋兩年資料。請注意，價格波動率低點之間的距離，呈現顯著的規律性。


    ARCH 找到相關論文②。大體上來說，金融市場價格沒有明顯的循環──就一般意義而言──也不能利用循環來預測價格行為，但價格波動率則存在循環，而且可以透過循環來預測。所以，包寧傑帶狀寬度會呈現規律性的收縮與擴張，這種現象就不足為奇了，因為帶狀寬度所代表的價格波動率存在循環性質，雖然價格本身並不具備這種性質。「規律性」可能是不太正確的用詞。長期利率確實存在相當具有規律性的
    19 天期價格波動率循環，但其他金融工具的價格波動率循環實在稱不上具有規律性。然而，整個重點不在於規律性是否存在。重點是：偏低價格波動率孕育著偏高價格波動率，偏高價格波動率也孕育著偏低價格波動率。這也是擠壓（The
    Squeeze）的基礎所在（請參考第 15 章）。


    總之，包寧傑帶狀大體上也適用統計學理論，因此我們也可以根據統計理論歸納出一些包寧傑帶狀的運用結論。當然，股票不是什麼標新立異的新奇製造品，如此對待它們不免太過愚蠢。反過來說，經過學術界與市場人士的努力，有些統計工具經過調整之後，也適用於投資領域。


    ② GARCH 與 ARCH 分別代表 generalized autoregressive conditional heteroskedasticity
    與 autoregressive conditional heteroskedasticity 的字頭語，這是研究價格波動率循環性質的數學理論。進一步資料，請參考下列網站就
    GARCH 提供的數學教學內容：http://www.mathworks.com/aces s/helpdesk/help/toolbox/garch/charp1_tu.shtml。對於大多數人來說，這些內容雖然有些艱深，但最初的概論部分仍然非常值得參考。


    ## 本章內容重點


    - 包寧傑帶狀也大體適用統計法則，雖然不是完全適用。

    - 回歸均數的傾向確實存在，但這種傾向的強烈程度或許低於預期。

    - 價格觸及帶狀邊緣的現象，需要經過技術指標確認。

    - 雖然價格本身不具備循環性質，但價格波動率則具備。

    - 價格波動率呈現「物極必反」的循環傾向，偏高讀數意味著價格波動即將趨於穩定；偏低讀數意味著價格波動即將轉趨劇烈。


    ## 第 III 篇


    ## 包寧傑帶狀


    第Ⅲ篇準備討論技術分析的最基本功能——型態辨識——並說明包寧傑帶狀如何能夠協助辨識型態。頭部、底部與持續性趨勢，都各有獨立的章節分別討論。最後，我們準備提供三種交易方法的第一種，這種方法建立在擠壓（The
    Squeeze）狀況上。


    ## 第 10 章


    ## 型態辨識


    型態辨識是指我們辨識某類重複性事件的程序。一般來說，這類事件是由一系列個別成分按照特定順序而發生，讓我們可以辨識其型態，並且採取行動。價格型態幾乎不可能絕對精準的重複發生，通常只具有大體相同的性質，顯現某種特定軌跡。為了有效辨識型態，我們需要借重某種架構，在該架構內分析價格型態。包寧傑帶狀就能提供這類的分析架構。


    技術分析文獻存在很多價格型態的描述。雙重頂與雙重底、頭肩頂與頭肩底、上升三角形與下降三角形，都是一些常見的價格型態。某些型態意味著趨勢即將反轉，另一些型態則預測既定趨勢將繼續發展①。


    關於型態辨識，包寧傑帶狀提供的功能之一是「定義」——何謂高價或低價？何謂波動劇烈或平靜？行情是否具備


    ① 詳細的技術分析討論已經超出本書的內容範圍，有興趣的讀者可以瀏覽參考書目內 Schabacker 或 Edwards & Magee 的著作。


    明確的趨勢？——藉以比較不同期間、不同股票或不同市場之間的走勢。隨著價格型態的演變，包寧傑帶狀也隨之演變，提供一個相對而具有彈性的架構，不同於圖形座標刻度的絕對、僵化架構或死板的趨勢線。


    股票很少突然由多頭走勢演變為空頭走勢，反之亦然。過渡期間通常都會出現一系列的價格行為，一度或數度測試支撐或壓力。M 頭與 W 底就是發生在行情轉折點的常見價格型態，顯示先前的趨勢即將告一段落，同時預示著新趨勢誕生。新趨勢可能是由先前的上升趨勢反轉為下降趨勢，或由先前的下降趨勢反轉為上升趨勢，也可能源自於毫無趨勢的狀態，當然也可能由先前的明確趨勢演變為橫向盤整走勢。雙重底與頭肩頂屬於最常見的反轉型態。可是，並不是所有的反轉型態都是三次「衝刺」（pushes）的
    W 底或 M 頭變形，它們只不過代表最常見的型態罷了（圖 10.1 與 10.2）。


    突兀頭部與 V 形底部相對少見，但仍然可能發生，使得上升趨勢突然反轉為下降趨勢，反之亦然。同理，反轉型態往往沒有實際造成反轉；它們只代表既有趨勢的結束，隨後出現的是橫向盤整，並不是相反方向的明確趨勢。另外還有一些更長期、更複雜的型態，例如：慢慢由下降趨勢演變為上升趨勢的碗形底，或密集盤整型態與複雜頭部型態。


    某些價格型態經常是另一些更大型態的構成部分，後者往往只能採用更長期的走勢圖才能看見，例如：小時走勢圖與日線圖、週線圖與月線圖之間的關係。1980 年代末期曾經


    出現一套交易系統，同時採用三個時間架構，唯有三個時間架構都出現類似型態或訊號，使用者才能採取行動②。這屬於「碎形」（fractal）處理方法③，充分突顯時間架構相互重疊的重要性。


    事實上，碎形型態相當常見。舉例來說，如果仔細觀察某長期 W 底，結果可能發現某個低點是由中期 W 底構成；也可以經常發現，W 底兩個低點所夾的高點，是由更低時間架構的
    M 頭形成（圖 10.3）。這類碎形現象很多，雖然很少在兩、三個層次架構上同時產生作用。


    不論所處的層次架構如何，技術型態是指走勢圖上出現可資辨識的特定型態價格發展——這種特殊型態可以由包寧傑帶狀來說明。舉例來說：讓我們考慮典型的 W 底（雙重底）結構，第一波跌勢之後緊跟著出現價格反彈，然後發生第二波跌勢，其後的彈升則啟動上升趨勢。至於第二波跌勢是否創新低，這點並不重要——至少就價格本身而言是如此。W
    底的第一個低點通常會落到包寧傑帶狀的下限之外，但第二個低點通常不會跌破帶狀下限。第一波跌勢的成交量通常大於第二波跌勢（圖 10.4）。


    ② Sam Kash Kachigan 的 Lennox System（這位作者也是 Statistical Analysis 的作者，請參閱參考書目）。


    ③ 碎形是指相同型態出現在所有不同時間架構的走勢圖中。舉例來說，某個頭肩頂型態本身是另一個更大頭肩頂型態的右肩。碎形經常發生在混沌系統（chaotic systems）。關於混沌理論，有一本很不錯的書：James
    Gleick 的 Chaos（New York: Viking, 1987）。


    ![](img/94739d716a8c23abc5f5258874db296f_123_0.png)


    圖 10.1 Pharmacia：三次衝刺創高點，150 天資料。價格走勢出現三次衝刺而創峰位，然後暴跌而趨勢反轉。


    ![](img/94739d716a8c23abc5f5258874db296f_123_1.png)


    圖 10.2 Bear Sterns：W底，100 天資料。典型的 W 底，在價格創低點之後，出現長紅的 K 線。


    ![](img/94739d716a8c23abc5f5258874db296f_125_0.png)


    圖 10.3 Harley Davidson : W 底內的 M 頭，100 天資料。你是否可以察覺 W 底內的 M 頭。


    ![](img/94739d716a8c23abc5f5258874db296f_125_1.png)


    圖 10.4 Art Technology Group : W 底，包寧傑帶狀，成交量確認，100 天資料。第一個低點顯示大量，第二個低點的成交量較小，W
    底完成之後的漲勢夾著大量。


    頭部未必會是底部型態的完美對應；頭部排列通常需要耗費較多的時間，可能由三個或更多衝刺構成整個型態，未必剛好是兩個。這類的頭部經常是頭肩頂排列的變形。


    包寧傑帶狀顯然有助於釐清走勢圖上的價格型態。對於典型的 W 底來說，動能低點（momentum low）通常會穿越包寧傑帶狀下限，隨後的向下修正低點則會停留在帶狀下限之內。即使最後一個底部的價格創絕對新低，通常也不會創相對新低。因此，交易者可以掌握隨後發生的漲勢，不會受到情緒性的干擾，而且通常都在最低價附近進場。


    為了有效判斷價格型態，應該考慮動能高點與低點，以及隨後發生的價格高點與低點。在向下走勢中，導致第一個低點的跌勢通常會加速發展；這是動能達到最高的時候，成交量經常會明顯放大，後者可以做為確認。加速發展的跌勢告一段落之後，價格將反彈，然後再下跌而建立第二個底部，第二個底部的價格雖然可能創新低，但對應的動能將顯著放緩，成交量也明顯縮小。在一般的頭部或底部型態中，動能峰位（谷底）可能穿越到包寧傑帶狀的上限（下限）之外，但隨後發生的第二個峰位（谷底）則會停留在帶狀範圍內。


    我們可以由另一個角度思考，把頭部或底部視為一種消耗動能的程序。所以，除了本書偏好運用的成交量指標之外，也可以透過動能指標來判斷。走勢圖內同時採用成交量指標與動能指標，這是很好的處理方法（圖
    10.5）。兩種指標

