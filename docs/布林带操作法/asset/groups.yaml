    ## 表 18.2 成交量指標類別


    | 指 標 | 發明人 |

    |---|---|

    | 期間價格變動 | 能量潮，成交量-價格趨勢 |

    | 期間成交量變動 | 負值／正值成交量指數 |

    | 期間內結構 | 盤中強度，承接／出貨 |

    | 成交量加權 | 資金流量指數，成交量加權 MACD |


    然後深入探討其中最重要的四種。最後，我們就這些指標 為了有效運用技術指標，顯然必須徹底瞭解技術指標的 內涵。除了明白技術指標的計算方法之外，還必須知道指標


    的驅動力量與結構背景。如同表 18.2 顯示的，成交量技術指標根據計算方法可以劃分爲四大類。我們首先簡單介紹這些指標，然的運用，提出一般性評論。


    第一類成交量指標包括能量潮（OBV）與成交量-價格趨勢（V-PT），它們是根據每期價格變動來計算。OBV 考慮收盤價上漲或下跌，V-PT 考慮價格變動%。第二類包括正值成交量指數（PVI）與負值成交量指數（NVI），其計算公式的邏輯結構剛好與第一類相反。這類指標是以成交量變動程度來分析價格，不是以價格變動程度來分析成交量。舉例來說，唯有在成交量下降的期間，NVI
    才會變動。第三類指標考慮期間內的資料，這類指標包括盤中強度與承接／出貨，前者考慮收盤價在價格交易區間的相對位置，後者考慮最高價與收盤價在價格交易區間內的相對位置。這些指標沒有考慮先前期間的資料。第四類指標是把成交量資料運用到其他既有的指標。這類指標包括資金流量指數（MFI）與成交量加權
    MACD（VWMACD），前者屬於韋達（Welles Wilder）的相對強弱指數（RSI）的變形，後者屬於吉拉・亞伯（Gerald Appel）之 MACD
    的變形。換言之，既有的價格技術指標納入成交量資料，結果變爲經過成交量加權的價格指標，分析功能更強（表 18.3）。


    在目前的市場環境中，第三類盤中結構指標與第四類成交量加權指標的用途似乎最廣，也是我們準備討論的主題（但 PVI 也頗値得留意）。首先，讓我們考慮盤中強度指標。


    ## 表 18.3 成交量指標計算公式


    能量潮 = 成交量×變動符號

    成交量-價格趨勢 = 成交量×變動%

    負値成交量指數 = 如果成交量下降，累積價格變動

    正値成交量指數 = 如果成交量增加，累積價格變動

    盤中強度 = (2×收盤價－最高價－最低價)/(最高價－最低價)×成交量

    承接／出貨 = (收盤價－開盤價)/(最高價－最低價)×成交量

    MFI = 100－100/(1 + 正値價格×成交量總和／負値價格×成交量總和)

    VWMACD = 12 期成交量加權平均收盤價－26 期成交量加權平均收盤價

    VWMACD 訊號線=VWMACD 的 9 期指數平均


    盤中強度指標（圖 18.1）反映交易者臨收盤之前的動作，如果價格收在盤中最高價，指標價格權數爲 1，如果價格收在交


    ![](img/94739d716a8c23abc5f5258874db296f_214_0.png)


    圖 18.1 Hartford Insurance：盤中強度指標，200 天資料。價格上漲過程始終得到指標的確認，但價格頭部對應的指標讀數發生背離（價格創新高而指標沒有出現新高），這正是理想技術指標所應該表現者。


    易區間的中點，指標價格權數爲 0，如果價格收在盤中最低價，指標價格權數爲-1（譯按：請參考表 18.3 的計算公式）。隨著時間愈來愈接近收盤，交易員愈來愈急著想處理手中的委託單，於是朝著特定方向推動價格。假定某交易員握著某基金公司的大筆賣單，如果這些賣單始終無法成交，爲了在臨收盤前拋售持股，自然會擠壓價格，使得當天幾乎以最低價收盤，這些行爲也就會反映在盤中強度指標。


    就如同日本陰陽線一樣，承接／出貨指標特別重視開盤價與收盤價之間的關係① （圖 18.2）。由於這種關係非常重要，所以 EquityTrader.com 網站採用的價格走勢圖採用西方版本的陰陽線：如果收盤價高於開盤價，兩者之間的線形部分繪爲綠色，如果價格開高收低，兩者之間的線形繪爲紅色，其餘部分則繪爲深藍色。


    承接／出貨指標反映一項根觀念。如果股票表現真的非常強勁，即使價格開高，收盤價還是應該繼續走高；價格開高走低，就代表弱勢。同理，價格開低走低，代表持續疲軟；價格開低走高，代表正面意義。


    日本陰陽線已經有數百年的運用歷史，日本交易者非常


    ① 承接／出貨指標的計算需要利用開盤價。多年以前，《華爾街日報》除了提供當天交易的收盤、最高、最低價與成交量資料以外，也提供開盤價數據，但自從 1970 年代初期開始，由於上市公司愈來愈多而報紙的版面有限，所以就剔除開盤價資料。所以，這幾十年來，新世代的分析師與交易者都沒有開盤價可供運用，這種情況一直到最近電子資訊系統普及化之後才改善。


    重視陰陽線型態，尤其是由幾支線形構成的排列。我們發現，西方的價格走勢圖稍作修改之後，線形本身也可以提供一些額外資訊，尤其是在包寧傑帶狀邊緣。舉例來說，在包寧傑帶狀下限附近，如果線形實體由紅翻綠（「紅」代表開盤價高於收盤價，「綠」代表收盤價高於開盤價），往往意味著盤勢已經進入打底階段的後期。這類過渡期間的反轉現象也會發生在承接／出貨指標，尤其是成交量也配合擴大的話。


    盤中強度指標（II）與承接／出貨指標（AD）都可以採用開放型；換言之，由某個期間做為基準開始，每期的計算結果都繼續累積加總，繪製為一條曲線。這些指標也可以採


    用擺盪指標的格式，取特定期間（n 期）的移動加總和，所謂 n 期通常是取 10 期或 20 期。某些人偏好採用讀數沒有上、下限的指標，有些人則偏好採用擺盪指標的格式。針對交易帶狀的比較來說，擺盪指標的格式似乎比較容易解釋。


    不論 II 或 AD 擺盪指標都可以常態化——換言之，除以計算期間的總成交量——使得不同股票之間可以相互比較。表 18.4 顯示 10 天期常態化承接／出貨擺盪指標的計算公式，圖
    18.3 顯示範例走勢。常態化版本經常也表示為%；換言之，21 天期 II% 或 10 天期 AD%。


    ## 表 18.4 常態化成交量擺盪指標計算公式


    [(收盤-開盤)/(最高-最低)×成交量]的 10 天加總和／成交量 10 天加總和


    ![](img/94739d716a8c23abc5f5258874db296f_217_0.png)


    圖 18.3 Hartford Insurance：II%與 AD%，200 天資料。把 II 與 AD 轉換為擺盪指標的格式，經常能夠透露原本難以察覺的資料。


    在第四類指標之中，我們發現資金流量指數（MFI）非常巧妙的把成交量資料納入韋達的 RSI 觀念。在 RSI 的計算過程中，最重要的因子稱爲 RS，它是兩個指數平均數（exponential
    averages）的比率，分子爲特定期間內上漲收盤價的差價平均數，分母則是特定期間內下跌收盤價的差價平均數。MFI 則把這兩個指數平均數分別取代爲價格乘以成交量的移動總和，分子也是考慮收盤價上漲，分母則考慮收盤價下跌。一般採用的加總期間爲
    9 期或 14 期，9 期適用於短期交易，14 期是韋達當初建議的期數。


    透過 MFI 所希望考慮的問題是：是否能藉由上漲期間與下跌期間的成交量差異，確認價格趨勢動能？對於明顯的價格上升趨勢，價漲量增／價跌量縮的現象會造成強勁的
    MFI，這是 RSI 所不能顯示的。


    MFI 的波動劇烈程度稍微超過 RSI。走勢顯然較不平滑，波動區間也較大。所以，我們利用 80 與 20 做爲 MFI 正常讀數的上、下界線，寬度超過 RSI
    的 70 與 30。結果，兩項指標提供的訊號大致對等（圖 18.4）。


    第四大類的第二種指標是成交量加權 MACD。所謂的 MACD 是指吉拉・亞伯發明的移動平均收斂發散指標（Moving Average Convergence
    / Divergence）。對於我們來說，MACD 基本上屬於趨勢指標，由兩條曲線構成，包括 MACD 本身與另一條訊號線（signal line）。MACD
    是兩條移動平均的差值，也是一 般所謂的距離走勢圖（departure chart)。訊號線是前述 MACD 的指數移動平均（EMA）②。


    ![](img/94739d716a8c23abc5f5258874db296f_219_0.png)


    圖 18.4 Hartford Insurance：MFI，200 天資料。隨著漲勢接近尾聲，MFI 的趨勢也逐漸惡化。


    至於成交量加權 MACD，我們把 MACD 計算過程內的指數移動平均取代爲成交量加權移動平均（圖 18.5）③。訊號線仍然採用指數移動平均的格式。就如同 MFI
    一樣，VWMACD 的敏感程度也超過 MACD，但實務運用不需調整參數。


    ② MACD = 最近 12 期指數移動平均－最近 26 期指數移動平均。訊號線＝ MACD 的 9 期指數移動平均。

    ③ 關於成交量加權移動平均的計算公式，把每期價格乘以該期成交量，然後加總計算期間內的各期乘積，最後除以加總期間內的總成交量。舉例來說，10 天成交量加權移動平均＝最近
    10 天（收盤價×成交量）／最近 10 天總成交量。


    ![](img/94739d716a8c23abc5f5258874db296f_220_0.png)


    圖 18.5 Hartford Insurance：成交量加權 MACD，200 天資料。單獨利用成交量加權 MACD 就足以建立一套成功的時效系統。


    關於成交量加權 MACD 的運用，我們考慮的問題是：成交量是否支持價格趨勢的演變？若是如此，VWMACD 應該呈現強勁表現；否則，MACD 應該凸顯根本的弱勢。這種觀念非常重要，尤其是當機構交易者成為行情的主要驅動者。


    本章討論四種成交量技術指標；在某種程度範圍內，它們之間不存在顯著相關性。雖然承接／出貨指標與盤中強度指標都採用單一期間內的資料，但它們的計算公式與自變數都不相同。MFI
    實際上是反映成交量的動能指標（momentum indicator），VWMACD 則是成交量加權的趨勢指標（trend indicator）。如果這些指標提供的訊號彼此一致，可以把它們


    視爲相同指標；如果訊號彼此矛盾，就必須就每種技術指標的觀念架構冷靜思考。


    至於成交量技術指標的更深入討論，請參考我的論文〈成交量指標〉（Volume Indicators，「參考書目」）。


    在接下來的兩章篇幅中，我們準備處理一些實務上的運用。


    ## 本章內容重點


    - 成交量是一種自變數。

    - 成交量技術指標根據計算方式劃分種類。

    - 我們特別強調承接／出貨指標（AD）、盤中強度指標（Ⅱ）、資金流量指標（MFI）與成交量加權 MACD（VWMACD）。

    - 同時觀察開放型與封閉型的 AD 與Ⅱ。


    ## 第 19 章


    ## 交易方法 II ：順勢系統


    方法 II 藉由技術指標的強度確認價格訊號，藉以判斷新趨勢的誕生。舉例來說，如果價格逼近包寧傑帶狀上限，呈現強勁走勢，而且技術指標也顯示對應的強勁表現，這或許預示著一波上升趨勢的開始（圖
    19.1）。前述說法當然也適用


    ![](img/94739d716a8c23abc5f5258874db296f_223_0.png)


    圖 19.1 AG Edwards：方法 II 買進範例，100 天資料。價格表現強勁，技術指標也顯示對應的買進訊號。


    在相反情況（圖 19.2）。原則上，這只不過是方法Ⅰ的變形，藉由 MFI 提供確認訊號，但不需要「擠壓」做為前提條件。這種方法往往能夠預先顯示方法Ⅰ的訊號。


    ![](img/94739d716a8c23abc5f5258874db296f_224_0.png)


    圖 19.2 Micron：方法Ⅱ賣出範例，150 天資料。價格表現疲弱，MFI 也顯示對應的賣出訊號。


    我們也採用方法Ⅰ的相同出場技巧；換言之，拋物線系統的變形，或者價格反向觸及包寧傑帶狀對側。對於買進訊號來說，價格%b 指標與 MFI 都必須上升超過門檻水準；原則上，%b
    讀數應該超過 0.8，10 期 MFI 必須超過 80。


    請記住，%b 告訴我們當時的價格走勢處在帶狀的哪個位置；如果當時的價格處在帶狀上限，%b 讀數為 1，帶狀下限的讀數為 0，0.8 是由帶狀下限朝上限發展的
    80%位置。由另


