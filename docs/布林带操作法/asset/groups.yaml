    ## 包寧傑帶狀數學公式


    ## 20 天移動平均


    c̄ = Σ₁²⁰ cᵢ / 20


    ## 20 天標準差


    s = √[ Σ₁²⁰ (cᵢ - c̄)² / 20 ]


    ## 包寧傑帶狀上限


    c̄ + 2 * s


    ## 包寧傑帶狀中心線


    c̄


    ## 包寧傑帶狀下限


    c̄ - 2 * s


    ## 包寧傑帶狀參數


    | 長度 | 寬度 |

    |---|---|

    | 10 | 1.9 |

    | 20 | 2.0 |

    | 50 | 2.1 |


    %b

    (最近價格 - 帶狀下限) / (帶狀上限 - 帶狀下限)


    (帶狀上限 - 帶狀下限) / 帶狀中心線


    ## 成交量指標數學公式


    ## 50 天成交量移動平均


    v̄ = Σ₁⁵⁰ vᵢ / 50


    ## 常態化成交量


    v / v̄ * 100


    ## 盤中強度


    Σ₁^∞ ((2c - h - l) / (h - l) * v)


    ## 承接出貨


    Σ₁^∞ ((c - o) / (h - l) * v)


    ## 資金流暈


    t = (h + l + c) / 3

    100 - ( 100 / (1 + Σ₁ⁿ (t > t₋₁ * v) / Σ₁ⁿ (t < t₋₁ * v) ) )

    n 預設為 14。


    ## 成交量加權 MACD


    Σ₁ⁿ cᵢ * vᵢ / Σ₁ⁿ vᵢ - Σ₁ᵐ cᵢ * vᵢ / Σ₁ᵐ vᵢ

    其中 n = 短期均線的期數

    m = 長期均線的期數。


    ## 20 天 OBV 擺盪指標


    Σ₁²⁰ (((c > c₋₁) - (c < c₋₁)) * v)


    ## 21 天常態化 II 擺盪指標


    Σ₁²¹ [(2c - h - l) / (h - l) * v] / Σ₁²¹ vᵢ * 100


    其中：

    c = 收盤價

    h = 最高價

    l = 最低價

    o = 開盤價

    v = 成交價

    下標數字 — 1 代表前一天。


