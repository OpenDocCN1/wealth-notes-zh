    # 第 14 章


    # 漫步帶狀邊緣


    我們已經談論了頭部與底部排列，但持續發展的走勢又如何呢？當趨勢持續朝某個方向發展，這可能是最難以處理的困境。關於帶狀、包絡或通道，一旦價格觸及帶狀上限或帶狀下限，很多人就盲目的賣出或買進，這或許是運用上最嚴重的錯誤之一。如果這類觸及帶狀邊緣的現象，屬於更大反轉型態的一部分，或不能得到技術指標的確認，也許真的代表賣出或買進訊號——但也可能不是。當價格走勢觸及帶狀邊緣，這個現象本身絕對不足以代表交易訊號。


    讓我們引用美國股票市場做為例子，說明股價觸及包寧傑帶狀上限的現象未必代表賣出訊號。1998 年 6 月，美國股票市場出現嚴重的修正走勢。請觀察 1998 年
    10 月份的情況（圖 14.1）；當時，修正走勢已經結束，W8 底部排列已經完成，S&P 500 指數展開一段延伸性漲勢，持續到隔年的整個上半 年。在這段上漲過程中，價格多次觸及包寧傑帶狀上限——當價格由
    W8 底部開始上漲的第 8 天，就首度觸及帶狀上限。所有這些觸及現象，都不代表賣出訊號——至少對於中期玩家而言是如此。這一系列的觸及走勢，稱爲「漫步帶'
  - '[PAGE 166]


    狀邊緣」(walking the band)，在延伸性走勢中經常出現。


    ![](img/94739d716a8c23abc5f5258874db296f_166_0.png)


    圖 14.1 S&P 500 股價指數，包寧傑帶狀，由 1998 年秋天到 1999 年春天。價格持續沿著帶狀上限發展，始終沒有觸及帶狀下限。


    就上升趨勢的發展過程來說，價格往往多次觸及包寧傑帶狀上限，甚至有幾天的收盤價會穿越到帶狀之外（圖 14.2）。同理，在下跌走勢內，包寧傑帶狀下限經常被觸及或穿越。請注意，收盤價穿越帶狀，這個現象是連續訊號，不代表反轉訊號。當然，這可能屬於某個反轉訊號的初期構成部分，但其本身絕對不足以被視爲反轉訊號。一般來說，價格型態會因爲帶狀內部出現一個不能得到確認的峰位或谷底而發出反轉訊號，但在反轉訊號發出之前，該型態可能會發出許多連續訊號。'
  - '[PAGE 167]


    ![](img/94739d716a8c23abc5f5258874db296f_167_0.png)


    圖 14.2 Vishay，漫步帶狀上緣，以及隨後發生的 M 頭排列，350 天資料。收盤價穿越帶狀上限，這是上升趨勢持續發展的訊號。


    在價格漫步帶狀邊緣的期間，很多開放型的成交量指標①——尤其是盤中強度指標（Intraday Intensity，簡稱 II）或承接／出貨指標（Accumulation
    Distribution，簡稱 AD）——有助於釐清當時的狀況（圖 14.3）。當行情趨勢發展非常明確時，因為這類開放型指標經常可以扮演趨勢闡釋者的角色，能與價格走勢直接對照，所以較一般的擺盪指標更適用。為了方便與價格走勢對照，可以把
    II 或 AD 走勢圖與價格走勢圖並列，但採用不同座標刻度。


    ① 成交量指標之類的技術指標，經常都有兩種不同形式，包括開放型與封閉型。開放型指標通常都是計算某個起始日期以來的累積總和。封閉型指標也是計算加總和，但加總期間只有固定期數，例如：10
    期或 20 期。開放型指標的走勢圖通常都與價格走勢圖並列，方便於直接比較；封閉型指標的走勢圖通常另外繪製，往往也稱爲擺盪指標（oscillators）。'
