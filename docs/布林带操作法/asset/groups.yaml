    - 偏低價格波動率孕育著偏高價格波動率。

    - 偏高價格波動率孕育著偏低價格波動率。

    - 留意假突破的可能性。

    - 利用技術指標預測行情的可能發展方向。

    - www.BollingeronBollingerBands.com 列舉擠壓現象。


    ## 第 16 章


    ## 交易方法 I：


    ## 價格波動率突破系統


    關於包寧傑帶狀的運用，本書準備提出基本構想完全不同的三套方法。我們不能說哪套方法最好，因為這完全是個人偏好的問題。每種都試試看。不妨根據自己的喜好修改。觀察這些系統提供的交易機會，看看自己是否能夠接受。


    我們將利用日線圖——也是在操作上的主要時間架構——說明相關技巧，但短線交易者也可以把這些技巧運用到小時走勢圖或 5 分鐘走勢圖，投資人則可以考慮採用週線圖。事實上，只要按照使用者的風險／報酬準則進行調整，然後依據使用者的交易方式與交易對象進行測試，不論哪種時間架構都應該不至於造成實質差異。


    我們為什麼不斷重複強調個人化的重要性？為什麼特別注重風險／報酬參數的設定？因為一套系統不論多麼棒，只要使用者覺得不對勁，就不可能成功。所以，只要覺得不對勁，你很快就會發現相關方法不對盤。


    「如果這些方法真的那麼棒，你為什麼要讓別人知道呢？」這是人們最常提出的問題，答案也始終相同。第一，因為我喜歡「教導」的感覺。第二個理由或許更重要，因為我可以透過教導而學習。在本書的資料研究與整理過程中，我學習到很多新東西，實際編寫過程中，學到的東西更多。


    「這些方法一旦公開之後，還會繼續有效嗎？」對於很多人來說，系統是否能繼續有效，始終是難以釋懷的疑惑，實際不然。除非市場結構發生重大改變，否則這些技巧就會繼續有效。不論這些方法流傳得多麼普遍，效力都不會減損，為什麼呢？因為我們都是「個人」。如果把一套交易系統同時傳授給一百個人，一個月後，頂多只有二、三個人——如果有那麼多的話——還會採用當初傳授的系統。人們通常都會根據自己的狀況調整交易系統，納入自己特有的技巧與行事風格。總之，一本書的內容不論多麼明確，每個人閱讀之後的感受通常不同，接納與汲取的部分也各有差異，這顯然是很妍的現象。


    很多人認為，就運用上來說，應該在帶狀上限賣出，在下限買進——這是包寧傑帶狀的最大迷思之一。當然，包寧傑帶狀確實可以如此運用，但未必始終如此。根據我們建議的「方法Ⅰ」交易法則——帶狀上限遭到穿越則買進，價格跌破帶狀下限則放空①——剛好與前述傳統看法相反。依據


    ① 這種方法的邏輯非常類似於凱特納的 10 天移動平均進場方法（Keltner’s Ten-Day Moving Average Rule），但出場方法的根據則不同。凱特納系統始終在市場上持有多頭或空頭部位，但我們唯有在風險／報酬關係有利的情況下才進場。


    「方法 II」的建議，當價格接近帶狀上限，而且上漲力道經過技術指標的確認，我們就順勢買進；當價格接近帶狀下限，而且下跌力道經過技術指標的確認，我們就順勢賣出。只有在「方法
    III」中，才採用逆勢交易的處理原則：當價格處在帶狀下限附近，我們透過 W 底型態與技術指標釐清當時的結構而買進，在價格持續觸及帶狀上限，而且技術指標顯示既有的上升趨勢明顯轉弱才賣出。然後，我們會提出一種變形處理方法，依據沒有經過確認的帶狀觸及走勢辨識買進與賣出機會。


    「方法 I」也就是「擠壓」的運用，藉由價格波動率的循環性質，預期價格波動率將提高；換言之，偏低價格波動率孕育著偏高價格波動率。


    現在，讓我們來談談「方法 I」。《商品交易消費者評論》（Commodity Traders Consumers Review）的布魯士・巴布郭克（Bruce
    Babcock）在過世之前曾經訪問我。正式訪問結束之後，我們又閒聊一會兒，接受訪問的對象慢慢就顛倒過來了；結果，我發現他最喜愛的商品交易方法是價格波動率突破（volatility
    breakout）。我幾乎不敢相信自己的耳朵。這位曾經嚴格測試各種交易系統的大玩家——所涉及的系統數量之多，或許僅次於《期貨真理》（Futures Truth）的約翰・希爾（John
    Hill）——而他所精挑細選的方法竟然是價格波動率突破系統？這也正是我經過多年研究而認定的最佳方法。


    價格波動率突破系統或許是包寧傑帶狀的最有效直接運用。這類系統的發展已經有一段很長歷史，存在多種不同的變形。最早的突破系統經常採用最高價與最低價的移動平均，或許還向上或向下調整一些。隨著時間經過，如何選取真實價格的平均區間，往往成為關鍵因子②。


    我們不知道價格波動率如何開始在系統內扮演關鍵角色，但——根據推想——當人們察覺到移動平均、帶狀、包絡……等變得更緊縮時，突破訊號顯然比較有效，於是價格波動率突破系統就誕生了。(當帶狀寬度變窄，風險／報酬關係顯然也會更有利，後者是任何交易系統所需要具備的關鍵成份。)


    我們的價格波動率突破系統採用帶寬指標設定前提條件，然後等待突破發生當時建立部位。關於部位的停損或出場，可以採用兩種方法。第一是韋達的拋物線系統③，觀念非常簡單而有效。就買進部位來說，起始停損設定在突破排列的稍下方，然後每天向上調整。至於空頭部位，停損設定方法的觀念也相同，但位置剛好相反。拋物線是一套相對保守的系統，如果使用者願意承擔更大風險，嘗試掌握更大的獲利潛能，「價格觸及帶狀對邊」可以做為理想的出場訊號。


    ② 1980 年代中期，史提夫·諾提斯（Steve Notis）在專業突破系統（Professional Breakout System）整理很多這類技巧。


    ③ 請參考韋達（Welles Wilder）的《技術交易系統新觀念》(New Concepts in Technical Trading Systems)，目前的電腦交易軟體大多支援這套拋物線系統，但也可以透過人工計算。這原本是一套完整的系統（譯按：把多頭部位反轉為空頭部位，或把空頭部位反轉為多頭部位，始終停留在市場內），但我們只利用它提供出場訊號。


    後者允許價格出現較大的修正走勢，進行較長期的部位交易。換言之，「價格觸及帶狀下限」可以做為多頭部位的出場訊號；「價格觸及帶狀上限」可以做為空頭部位的出場訊號。


    關於方法 I，成功操作的最大困難在於假動作（head fake，圖 16.1）——這也是前一章的討論主題之一。這個名詞源自於曲棍球，但也出現在其他類似場合。攻擊者帶著球衝向對方球門；過程中，他轉頭假裝要傳球，一旦防守球員認定他要傳球而展現對應動作之後，他又回過頭來射門。盤勢脫離「擠壓」狀況之後，經常也會展現類似的假動作；首先假裝朝某個方向進行突破，然後又擺頭朝另一個方向展開正式攻擊。在典型的狀況下，首先出現擠壓，然後價格朝帶狀


