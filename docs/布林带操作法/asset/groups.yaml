    的某一端逼近，接著就回頭朝另一方向攻擊。一般來說，這類走勢都會侷限在帶狀範圍內，直到真正走勢出現之後，才會產生突破訊號。可是，如果你採用的參數使得帶狀寬度變得相對較窄，在真正的走勢產生之前，可能會出現幾次穿越帶狀的反覆訊號。


    某些股票或股價指數比較容易產生假動作或假突破。對於所操作的對象，觀察過去的擠壓走勢，評估假突破的發生頻率。一旦曾經欺騙，往後就……。


    如果你願意接受非機械性操作方式的話，最簡單的辦法就是等待擠壓狀況發生——前提條件——然後觀察價格突破橫向盤整區間。在走勢轉強的第一天進場建立半數部位，正式突破之後加碼，並且利用拋物線系統或觸及對側帶狀邊緣的停損策略，避免萬一判斷錯誤所造成的傷害太大。


    如果交易對象很少出現假動作，或者帶狀參數的設定不至於造成假動作的問題，就可以用很單純的運用「方法Ⅰ」。等待假壓狀況發生，然後只要看到突破就進場。


    在這些情況下，成交量技術指標確實可以提供協助。在假動作或假突破發生之前，觀察盤中強度指標（Intraday Intensity）或承接／出貨指標（Accumulation
    Distribution），預先判斷可能的突破方向。資金流量指數（Money Flow Index）是另一項值得參考的技術指標，可以提高成功機率，鼓舞交易信心。這些都是成交量指標，屬於第IV篇的討論主題。


    建立在擠壓狀況下的價格波動率突破系統，包寧傑帶狀的標準參數設定為：20 天移動平均±2 個標準差。因為在擠壓的價格盤整期間，帶狀寬度相對很窄，很容易觸發交易訊號，所以不宜採用太敏感的帶狀參數。可是，對於某些短線玩家來說，或許希望縮短移動平均的期間長度（例如：15
    天），或用更窄的帶狀寬度（例如：1.5 個標準差）。


    此處還有另一項參數設定：擠壓的回顧期間。回顧期間愈長——預設值是六個月——壓縮程度愈大，爆炸的潛在威力也愈可觀。可是，擠壓的發生頻率也會相對較少。任何東西都一樣，魚與熊掌不可兼得。


    方法 I 首先透過擠壓來偵測價格壓縮程度，然後等待價格區間擴張，順勢而為。關於這套方法的操作績效，假動作的認知，以及成交量技術指標提供的確認，顯然都有所助益。觀察的潛在交易對象，數量上應該合理——至少要有數百支股票——每天都至少找出幾支可能的候選股票，進行最後評估。謹慎安排方法
    I 的執行步驟，然後按部就班的操作。最好多觀察一些這類案例，尤其是配合成交量技術指標，如此可以訓練你的眼力，有助於未來的篩選。請參考圖 16.2 到圖 16.6，其中顯示你所希望尋找的徵兆。


