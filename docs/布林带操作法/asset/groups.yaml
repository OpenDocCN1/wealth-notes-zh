    美林與李維分別採用不同的濾網，前者採用固定百分率，後者採用價格波動率。我們採用的布林傑方格則是兩者的結合，藉以過濾價格擺動與波動，並且預測未來可能發生的走勢。事實上，這套方法也是我們的交易平台——型態動力（PatternPower,
    www.PatternPower.com）——的核心所在。


    M 頭與 W 底分類有一個重點，可以藉由布林傑帶狀與相關指標來釐清型態。由於性質差異，我們將在隨後兩章內分別討論 M 頭與 W 底，說明這些型態如何與布林傑帶狀結合，提升預測精確性。第
    14 章更納入相關技術指標。


    ## 本章內容重點


    - 價格濾網可以用來過濾雜音，協助辨識型態。

    - 股票最適合採用百分率濾網。

    - 布林傑方格是非常傑出的過濾系統。

    - 所有的價格型態可以分類為一系列不同的 M 頭與 W 底排列。


    ## 第 12 章


    ## W 底型態


    從本章開始，我們將透過 M 頭與 W 底型態討論價格排列。在本書底部封面的內頁（相關數學公式之前），列舉所有的型態圖形，M 頭在左側，W 底在右側。讀者可以把這部分圖形複印一份，方便查閱。


    先從底部型態著手。相對於頭部型態，底部型態比較明確、清楚，容易判斷。兩種排列的根本差異在於心態：底部是發生在恐懼與痛苦的背景中，顯然不同於頭部排列的陶醉氣氛與美好憧憬①。大體上，底部排列的結構比較銳利、緊密，耗費的時間較短暫，走勢比較突兀。相對於「愉悅」來說，「痛苦」畢竟是一種比較強烈的情緒。從另一個角度而言，頭部排列屬於「拖泥帶水」的發展，比較散漫，難以判斷。顯然不同於底部，處於頭部的情境內，交易者沒有採取行動的迫切需要。


    ① 在《紀律交易者》(The Disciplined Trader，參考書目) 一書中，馬克·道格拉斯 (Mark Douglas) 把「恐懼」定義為「唯恐不夠的焦慮心理」。在市場中觀察這些情緒的表現，實在非常有趣；所以，市場分析師可以稱得上是非常有趣的職業。


    在最近的一項研究計畫中，我們測試中期低點與高點的價格型態性質。雙重底與三重頂屬於最常見的排列，我們發現頭部排列所耗費的時間顯然超過底部。這個現象證明華爾街的傳統看法——跌勢的發展較快——沒錯，而且也符合我們對於人類心理反應的預期②。


    股票很少由跌勢突然反轉為漲勢。一般來說，股價跌勢都會先做小幅反彈，然後又下跌，再重新測試先前的低點支撐，最後才正式向上挺進。這種走勢排列稱爲雙重底或 W 底（圖
    12.1）。W 底是最常見的多頭反轉型態，但並不是僅有的一種。


    ![](img/94739d716a8c23abc5f5258874db296f_144_0.png)


    圖 12.1 典型的 W 底型態：均線壓抑第一波反彈，但不能阻止第二波彈升走勢。


    ②「跌勢的發展較快」是一項可以透過實際資料證明的現象。舉例來說，2000 年春天，那斯達克指數突然出現空頭走勢，股價指數在短短三個星期之內暴跌 37%，相當於是過去
    4½月的漲勢總和。


    暴跌的股價走勢也可能突然反轉而向上飆漲，但這類走勢畢竟非常罕見。V 形底部反轉排列，通常都發生在基本面突然好轉的情況下；公司發布重大利多消息，原先的下降趨勢突然終止，股價開始飆漲。還有另一種相對常見的走勢，股價繼續下跌而創新低，然後開始橫向盤整，經過一段期間之後，價格才慢慢回升。這類走勢反映股票發生基本面的問題，需要一段時間整頓、復甦。可是，W
    底終究是最常見的底部型態——價格創低點而反彈，然後拉回重新測試底部支撐，接著展開上升趨勢。在公司基本面沒有發生重大變動的前提下——公司發展也許出現一些波折，但在事態惡化之前已經解決——W
    底是股價完成修正走勢的典型排列。


    W 底是一種基本架構，實際細節走勢可能各自不同，各自反映不同的市場心理。相對於第一個底部，第二個底部的位置可能較高（圖 12.2）、相同（圖 12.3）或較低（圖
    12.4）。根據美林的分類，這三種情況分別屬於不同型態，也會引發不同情緒。如果第二個底部高於第一個底部，那些等待「明確測試」的觀望者會覺得失望，只能望著股價提早上揚。W4、W5
    與 W10 就代表這類的走勢。如果兩個底部的價位相同，那些等待重新測試低點的交易者將覺得心滿意足，很快就可以獲利。如果第二個底部的價位較低，那些過早進場的人將覺得恐懼、倦怠。W2、W3
    與 W8 就是典型的例子。那些在先前低點位置進場的投資人，一旦發現先前低點支撐被貫穿之後，可能立即認賠出場，很少人有勇氣在隨後的漲勢中重新進場；同時，由於股價持續創新低，那些場外觀望者也不敢進場。懷可夫（Richard
    D. Wyckoff）稱此為「彈簧」（spring）。

