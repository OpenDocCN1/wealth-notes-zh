    在混沌理論的早期研究中，伯納．曼德布洛特（Bernard Mandelbrot）發現棉花價格呈現非線性行為。另一些研究者認為，金融市場實際上是一種非常複雜的系統，就如同最著名的氣候系統一樣，很難預測相關行為。一旦系統變得更複雜之後，傳統的線性分析工具就不適用了，整個系統行為也愈來愈難瞭解。如果想要瞭解複雜系統，唯有採用相對的工具。


    本書不打算深入探索這方面的真相，也不想參與這方面的辯論。反之，我們只接受相關事實：市場價格不屬於常態分配，金融市場並不是人們一般認定的單純系統。市場代表一個愈來愈複雜、愈來愈難以瞭解的系統，這是我們的基本假設。


    如果想在市場上賺錢，你必須「買低－賣高」或「賣高－買低」。可是，隨著行情波動愈來愈劇烈，價格行為模式變得愈來愈複雜，前述的傳統智慧也就愈來愈難以實現。全球期貨交易重鎮芝加哥流傳一種說法：「管轄交易的神祇設定兩項法條：第一，你可以買在最低檔，但一輩子只有一次；第二，你可以賣在最高檔，但一輩子也只有一次。」這意味著，你的交易基本上都發生在最低檔與最高檔之間。


    本書的宗旨是協助你避開一些常見的投資陷阱，包括「買低／賣高」的陷阱在內。不幸的，投資人往往只能在「買低」之後看著價格繼續下跌，或「賣高」之後看著價格繼續挺進。我們利用一種相對架構，取代情緒性的傳統方法；此處採用嚴格的方法評估價格，歸納出一系列合乎理性的投資決策，完全不仰賴所謂的絕對真理。我們或許會「買低」，也可能「賣高」；在這些情況下，「高」與「低」都是由相對角度解釋。我們儘量避免訴諸絕對的參考基準。所謂的「高價」，是指價格相對偏高的交易區間；同理，所謂的「低價」：是指價格相對偏低的交易區間。另外，我們還會提供許多建議，讓你根據自己的偏好，調整前述架構，藉以反映個人的風險-報酬準則。


    本書共分為六篇，第 I 篇由本章（第 1 章）開始，內容屬於開場白性質。第 2 章討論一些分析者能直接取得或運用的原始資料。第 3 章討論分析上使用的適當時間架構，說明如何挑選包寧傑帶狀的長度與寬度。第
    4 章由比較抽象的角度分析不同的處理方法，包寧傑帶狀可以持續提供交易建議，不像其他方法嘗試猜測絕佳風險-報酬潛能的特定機會。第 I 篇的第 5 章包括一些討論，讓讀者瞭解如何有效運用本書的觀念。


    第 II 篇探討包寧傑帶狀的技術細節。第 6 章介紹交易帶狀技巧（trading bands）的歷史背景（第IV篇的第 20 章會再提到我們所知道的一種最古老交易帶狀系統）。第
    7 章解釋包寧傑帶狀的結構。第 8 章討論由包寧傑帶狀延伸而來的交易指標：%b 決定我們是否處在高價或低價的一種數學方法；帶寬（BandWidth）則用來衡量價格波動程度。第
    II 篇的最後一章（第 9 章）討論價格波動循環，論述一些支持包寧傑帶狀方法的學術觀念，此外也說明一些與統計有關的議題。


    如果你對於這項交易工具的理論細節沒有興趣，可以跳過第Ⅱ篇，直接閱讀第Ⅲ篇，後者解釋包寧傑帶狀的實務運用。雖然第Ⅲ篇與第Ⅳ篇的內容是建立在第Ⅰ篇與第Ⅱ篇的基礎之上，但讀者仍然可以直接由第Ⅲ篇著手。


    第Ⅲ篇解釋包寧傑帶狀的基本運用。第 10 章與第 11 章說明如何辨識型態，介紹亞瑟·梅林 (Arthur Merrill) 的 M 頭與 W 底型態分類。第
    12 章與第 13 章利用包寧傑帶狀來釐清一些最常見的價格型態，包括第 12 章處理的 W 底與第 13 章的 M 頭。第 14 章討論一個最棘手的議題：漫步帶狀邊緣
    (walking the bands)。最後，我們利用兩章的篇幅探討價格波動。第 15 章討論「擠壓」(Squeeze) 狀況，並且提供一些發生在股票與債券市場的案例。第
    16 章說明包寧傑帶狀的嚴格運用，屬於三種簡單使用方法之一，把價格波動突破系統運用到擠壓狀況。


    第Ⅳ篇在分析架構內引進技術指標。換言之，利用包寧傑帶狀與技術指標建立一個合乎理性的決策平台。第 17 章由一般性角度解釋技術指標與包寧傑帶狀的配合。第 18
    章討論成交量指標，包括那些最適合搭配包寧傑帶狀的指標。第 19 章與 20 章，我們藉由價格走勢與指標行為，運用 %b 與成交量擺盪指標，建立兩個理性決策系統——其中一個屬於順勢操作系統，另一系統則嘗試尋找既有趨勢的高點與低點。


    第Ⅴ篇討論一些進階議題，包括如何運用包寧傑帶狀來把技術指標常態化 (第 21 章)，以及當日沖銷的技巧 (第 22 章，包寧傑帶狀在這方面的運用愈來愈普遍）。


    第VI篇則就包寧傑帶狀的重要觀念做個整理，列舉法則清單，提出一些結論。


    第VI篇之後，是附註（譯按：為了方便讀者查閱，中文譯本把附註打散，直接放在正文的下方）。正文的解說過程中涉及一些重要觀念，但它們與正文沒有直接關聯，所以整理為附註。這些附註都有參考價值，務必查閱。附註也提供一些正文的參考資料。


    第III篇與第IV篇討論的三種交易方法都屬於預測性質。交易方法 I 利用偏低價格波動率，預測價格波動率即將擴大。交易方法 II 採用經過確認的強勢表現，藉以預測價格上升趨勢；或採用經過確認的弱勢表現，藉以預測價格下降趨勢。交易方法
    III 透過兩種方式預測趨勢反轉：價格連續觸及包寧傑帶狀上限，但技術指標出現轉弱走勢；或者價格連續觸及包寧傑帶狀下限，但技術指標出現轉強走勢。更甚者，交易方法
    III 也尋找沒有經過確認的包寧傑帶狀觸及走勢，換言之，價格觸及帶狀下限而成交量指標轉強，或價格觸及帶狀上限而成交量指標轉弱。


    接著，討論一些術語——我們不能全然仰賴術語，但也不能全然沒有術語。幾年前，有一位高級主管型的紅人來到《金融新聞網》(Financial News Network)，他出身廣播界，完全不瞭解金融市場，所以要求每個術語都必須經過定義。


    他的要求也不是全無道理。我們採用的術語經常需要定義，但不應該造成沒有必要的困擾，也不應該妨礙正文解說。某些書籍應該在方便之處設置〈名詞解釋〉。如果你在正文中遇到一些不熟悉、而且又沒有定義的名詞，只需要翻到〈名詞解釋〉，應該就可以找到定義。〈名詞解釋〉還有另一項功能。我們知道，投資領域內的術語經常缺乏清楚的定義。某些名詞同時有很多意義，很容易造成困擾，〈名詞解釋〉會詳細說明我們採用該名詞的意義。


    本書最後列出一份〈參考書目〉——實際上已經超出建議閱讀的範圍，包括一些與本書主題只有間接關聯的資料。這份書目不打算列舉所有的學術文獻；只希望讀者能找到一些有用的相關書籍。這些書大多可以在圖書館或金融專賣書店找到。


    本書底頁的內側提供幾張提要，內容包括：包寧傑帶狀基本法則、M 頭與 W 底型態，以及一些最重要的數學公式。你可以把它們撕下來，做為書籤用，一邊閱讀本書，一邊在卡片上查閱相關資料。


    最後，我們有一個支援本書的網站：http://www.BollingeronBollingerBands.com。這個網站每天都會列舉一些符合本書三種交易方法的股票清單，以及一個過濾區域，你可以根據本書討論的任何準則篩選股票。另外，網站上有許多走勢圖，一個討論區，你可以在此討論任何與包寧傑帶狀有關的問題。我們也提供其他相關網站的網址。


    閱讀本書之後，你將有一套工具與技術，透過嚴格的架構評估潛在與實際的投資或交易部位。這些方法將讓你拋棄一些投資與交易的相關情緒，協助你充分發揮投資人／交易者的真正潛能。


    ## 第 2 章


    ## 原始資料


    金融市場技術分析者只有相對少量的資料可供運用，主要包括**價格與成交量**。這些資料都有特定時間長度，例如：某天的最高價、某週的最低價、某個小時的成交量……等。最常見的資料通常是以「天」為單位，資料包括：開盤價、最低價、收盤價與成交量（表
    2.1）。收盤價最常用，其次是最高價與最低價，然後是成交量，最後才是開盤價。1972 年 6 月開始，道瓊公司決定《華爾街日報》不再刊載開盤價，主要是為了空出版面提供更多上市公司的資料。所以，新生代的交易者經常完全沒有運用開盤價的經驗。非常幸運的，隨著電子傳訊管道的進步，歷經很長一段空白期間之後，交易者又可以輕鬆取得美國掛牌股票的開盤價格資料。


    經由這些基本資料，投資人與交易者可以透過各種組合方式，繪製不同的走勢圖。最常見的走勢圖有四種：曲線圖（line chart）、長條圖（bar chart）、K線圖（candlestick
    chart，又稱為燭形線或陰陽線）與圈叉圖（point-and-figure chart，O×圖）。曲線圖的結構最簡單，只是利用一條曲線銜接價格資料，藉以反映價格行為。長條圖是西方人最慣用的圖形，通常不包括開盤價與成交量資料。K線圖最早起源於日本，目前也逐漸被西方人接受。圈叉圖透過簡單的方法闡述價格行為，這或許是西方技術分析的最古老繪圖方法。


    走勢圖可以採用任何時間單位：10 分鐘走勢圖、日線圖、週線圖……等。就幾年前來說，日線圖、週線圖與月線圖屬於最常用的圖形。可是，從 1980 年代以來，最常用的走勢圖則是小時圖、日線圖與週線圖，而且時間架構有逐漸縮短的趨勢，包括顯示每筆交易資料的跳動圖（tick
    charts）或 5 分鐘走勢圖。


    大部分走勢圖都是以縱軸（y 軸）代表價格，橫軸（x 軸）代表時間。可是，情況也未必始終如此。舉例來說，奎恩（Edwin S. Quinn）發明的等量圖（EquiVolume），以及阿爾斯（Richard
    Arms）的阿爾斯指數（Arms Index），這些圖形的橫軸代表成交量。另外，圈叉圖的橫軸並不代表時間，而是反映價格呈現某特定程度反轉的變動。


    曲線圖的結構很簡單，只是把價格標示在圖形的適當位置上，然後利用一條曲線銜接這些資料點，藉以反映價格行為¹。如果必須呈現的資料很多，採用長條圖或 K 線圖可能太過複雜，容易造成視覺混淆；在那種情況下，通常才會採用曲線圖。另外，如果特定時間單位只有單一資料，當然也會採用曲線圖，例如：每天的騰落線（advance-decline
    line）或特定指標每天只提供一個數值（圖 2.1）。


    ![](img/94739d716a8c23abc5f5258874db296f_39_0.png)


    > ① 利用一條曲線銜接資料點，經常會產生「連續」的幻覺；事實上，這些資料點之間並不存在邏輯關聯。除了價格資料以外，任何指標只要透過曲線圖方式表現，也經常會因為「銜接」而造成「連續」的誤解。


    圖 2.2 是一份傳統的長條日線圖，每個垂直線段代表一天的價格資料，垂直線段的頂端與尾端分別代表當天的最高價與最低價，線段左側的小橫劃代表當天開盤價，右側的小橫劃代表收盤價。如果圖形也提供成交量資料的話，通常都在價格走勢圖下側另外利用柱狀圖顯示。每支柱狀圖的長度，代表特定期間的成交量，該期間與上側對應長條圖的期間相同（成交量座標軸標示的數據，經常省略最後兩位或更多位數的零）。


    ![](img/94739d716a8c23abc5f5258874db296f_40_0.png)


    圖 2.2 Freddie Mac：100 天價格長條圖。這種圖形比較能顯示價格行為。


    相對於長條圖，K 線圖更重視開盤價與收盤價。每個 K 線都由實體與影線部分構成。實體呈現長方形，上、下兩邊分別代表開盤價或收盤價；如果開盤價較低而收盤價較高，則實體留白（台灣本地稱為紅線或陽線）；如果開盤價較高而收盤價較低，實體繪為黑色（稱為黑線或陰線）。由實體頂端向上延伸到最高價或實體尾端向下延伸到最低價的線段，分別稱為上影線與下影線（圖
    2.3）。我個人多年來都採用 K 線圖，它們較長條圖更清楚——至少就我個人認為如此。


    ![](img/94739d716a8c23abc5f5258874db296f_41_0.png)


    包寧傑長條圖（Bollinger Bars）結合了長條圖與 K 線圖的優點（圖 2.4）。每支包寧傑長條圖都繪製為長方形，如果價格開高收低，長方形位在開盤價與收盤價之間的部分繪為紅色；如果價格開低收高，長方形位在開盤價與收盤價之間的部分繪為綠色。剩餘的部分則繪為藍色。


    ![](img/94739d716a8c23abc5f5258874db296f_42_0.png)


    包寧傑長條圖可以強調開盤價與收盤價之間的重要關係，但不需另外繪製影線。關於包寧傑長條圖的運用，請參考：http://www.EquityTrader.com。


    圈叉圖把價格行為壓縮為非常精簡的圖形（圖 2.5），× 欄位代表價格走高，O 欄位代表價格下跌。O × 圖形完全沒有顯示時間觀念②；只利用方格大小與反轉法則來過濾價格走勢。關於
    O × 圖的進一步資料，請參考第 11 章〈五點型態〉。


    ② 實務運用上，某些圈叉圖也會顯示時間參考基準。例如，日線圖在每個月的第一個登錄位指標示月份數據，換言之，1 月份的第一個登錄標示為 1，11 月份的第一個登錄標示為
    11，不論該位置原本應該標示 O 或 ×。


    ![](img/94739d716a8c23abc5f5258874db296f_43_0.png)


    價格軸的刻度有兩種標示方法，最常見的是**算術刻度**（arithmetic scaling）；換言之，價格軸上的每個相等距離都代表相同價格點數（圖 2.6）。可是，**對數刻度**（log
    scales）能夠提供更多的資訊（圖 2.7）。**對數刻度經常又稱為比率刻度或半對數刻度**（semilog scaling，譯按：因為只有縱軸採用對數刻度，橫軸仍然採用算術刻度，所以稱為「半」對數）。價格


    ![](img/94739d716a8c23abc5f5258874db296f_44_0.png)


    圖 2.6  Freddie Mac: 200 天長條圖。採用線性價格刻度。不論價位高低，任何相同的垂直距離都代表相同的價格點數。


    ![](img/94739d716a8c23abc5f5258874db296f_44_1.png)


    圖 2.7  Freddie Mac: 200 天長條圖。採用對數價格刻度。相同的垂直距離，代表相同的價格變動百分點數。


    軸上的任何相同垂直距離（不論價位高低），都代表相同的價格變動百分點數，但不代表相同的價格變動點數。如果縱軸採用對數刻度，對於相同的價格點數，標示在偏高價位，其垂直距離較短，標示在偏低價位，其垂直距離較長。換言之，$90到$91之間的距離較短，$50到$51之間的距離較長，雖然兩者的距離都代表$1。對數刻度有一個重要優點，我們可以根據垂直距離，相當精確的判斷風險-報酬結構，不需特別考慮價位高低。如果採用算術刻度的話，同樣$1的垂直距離，對於價位$10與$100的投資標的，顯然代表不同的風險-報酬意義，$1是$10的10%，但$1卻只是$100的1%。如果採用對數刻度，假定某垂直距離代表$10的10%，該距離也代表$100的10%。因此，根據肉眼觀察，相同垂直距離都代表相同的價值變動百分率，不論該價位處在圖形的哪個高度，我們強烈建議採用對數刻度。


    此處之所以說明長條圖／K線圖與算術／對數刻度，主要目的是讓讀者能挑選自己最喜歡的圖形表示方法。可是，讓我清楚表白個人的立場：大多數情況下，我偏好採用對數刻度與包寧傑長條圖。


    成交量柱狀圖通常都另外標示在價格走勢圖之下；換言之，柱狀圖的高度（由零點起算）代表特定期間的成交量（圖2.8）。這是長久以來的成交量處理方式，頂多只是偶爾繪製趨勢線或移動平均線來凸顯某種觀點。如果沒有重大妨礙，我們可以繼續如此處理成交量圖形，但畢竟還是有改善的餘地。


    ![](img/94739d716a8c23abc5f5258874db296f_46_0.png)


    圖 2.8 Freddie Mac：100 天長條圖與成交量。在價格走勢圖的下側另外繪製成交量圖形，可以額外提供重要資訊。


    首先，繪製成交量的移動平均線（通常都是 50 天均線），可以提供前後一致的參考基準，藉以判斷成交量是否擴大或縮小（圖 2.9）。關於 M 頭與 W 底的判斷（進一步細節請參考第
    III 篇），特別需要瞭解成交量是否在相對基準上擴大或縮小。舉例來說，對於 W 底而言，左側谷底的成交量應該相對大於右側谷底。


    其次，移動平均可以提供參考基準，但如何比較不同的對象或市場呢？我們可以建立一種相對的衡量基準。把每天的成交量除以其 50 天移動平均值，然後乘以 100，把這些結果繪製為柱狀走勢圖，就如同繪製一般的成交量圖形一樣，但基準為
    100（圖 2.10）。就觀念上來說，所謂的 100 基準線，相當於握住移動平均的一端，然後把它拉直。所以，如果成交量向上穿越基準線，代表強勁的大量；如果成交量低於基準線，屬於弱勢的小量。


    ![](img/94739d716a8c23abc5f5258874db296f_47_0.png)


    圖 2.9 Freddie Mac：100 天價格長條圖與成交量移動平均線。在成交量圖形上添加移動平均線，可以用來界定大成交量與小成交量的意義。


    ![](img/94739d716a8c23abc5f5258874db296f_47_1.png)


    圖 2.10 Freddie Mac：100 天價格長條圖與常態化成交量。把成交量除以移動平均，如此更方便於比較。


    現在，我們可以比較不同期間的成交量，甚至比較不同市場的成交量。因此，你可能發現成交量倍增或萎縮。就如同包寧傑帶狀可以提供價格的相對架構一樣，利用50天移動平均常態化的成交量，也可以就成交量提供一種相對架構。


    最後，表2.2列舉技術分析可以運用的一些其他原始資料。這些資料或許非常重要，但不是此處的討論重點；我們的重心放在價格、成交量與價格波動程度上。


    ## 表 2.1 IBM 的典型價格資料*


    | 日 期 | 開 盤 | 最 高 | 最 低 | 收 盤 | 成交量 |

