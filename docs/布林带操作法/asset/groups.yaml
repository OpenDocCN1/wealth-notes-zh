    對於價格漫步帶狀邊緣的現象，如果封閉型 II 或 AD 指標也出現類似行為，也屬於繼續持有部位的確認訊號（圖 14.4）。如果價格觸及帶狀邊緣，同時 21
    天期 II%指標出現反向讀數，這是採取行動的訊號，代表既有趨勢已經結束。如果背離程度不大，解釋上必須特別謹慎。如果技術指標逼近先前的高點或低點附近，那就夠了。舉例來說，假設每波漲勢高點對應的
    21 天 II 指標讀數都在 20%或稍多，如果這波漲勢只讓指標讀數到達 19%至 20%之間，這只代表一項警訊，仍然不能視為賣出訊號——至少暫時還不能。第一次出現的背離，通常只是警訊，隨後還會出現更明確的背離——如果頭部或底部排列真的出現的話。


