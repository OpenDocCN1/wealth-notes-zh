- pgno: 9
  md: 'All of the respondents to the survey were unaware of how much they actually
    spent on subscription services off the top of their heads and most needed more
    than two tries to get close.


    In 2021, 89% underestimated what they spend each month, and in 2018, 84% underestimated
    what they spent each month. Nearly half of those who underestimated were off by
    between $100-$300.


    About 70% of respondents subscribed to mobile phone services and a home WiFi service
    as well as TV and movie providers. Half of all respondents had Amazon Prime accounts.


    The rest of the list varied widely, with respondents reporting a hodgepodge of
    subscriptions ranging from music streaming sites, gaming services, cloud storage
    sites, home security systems, newspapers, fitness apps, dating apps and meal services.


    There was also an increase in the number of people using subscription boxes, which
    now cover a range of industries like beauty, pets, toys and wellness. Services
    like Ipsy and Dollar Shave Club were referenced by respondents.


    Other subscriptions named included book services like Kindle and Audible as well
    as cloud storage tools like Dropbox, iCloud and OneDrive.


    Tinder, Match, eHarmony and other dating sites featured prominently alongside
    fitness apps like MyFitnessPal, Lose It! and Fitbit.


    Respondents also had a number of newspaper or magazine subscriptions as well as
    gaming services like PlayStation Now and Xbox Game Pass.


    ADT, Nest and Ring dominated the home security system subscriptions while identity
    protection services like LifeLock and Identity Guard were popular as well.


    Verizon, Sprint and Boost Mobile were the most popular mobile phone services and
    streaming sites like Spotify, Pandora and XM Radio led the way.


    Netflix, Hulu, cable services and premium packages were cited as well, alongside
    WiFi services like Comcast, AT&T and CenturyLink.


