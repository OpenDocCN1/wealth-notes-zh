  md: '# 一场**1.2**亿美元的豪赌，前景如何？


    CNN+是一次在电视业界史无前例的豪赌。公司为只在网上播出的节目花大价钱挖来了不少来自其竞争对手的主持人，其中包括NBC的亨特（Kasie Hunt）、NPR的康妮什（Audie
    Cornish），而最让人震惊的是曾经为福克斯新闻效力的克里斯·华莱士（Chris Wallace，“谈笑风生”的迈克·华莱士之子）。这也被CNN方面作为一个例子，说明CNN+将尽量摒弃在电视频道上明显的自由主义党派立场。之前，华莱士曾特意感谢老东家慷慨地放行。


    据报道，CNN+的初始投资额已经达到1.2亿美元。除了大笔金钱花到名主持的工资上，还聘请了数百名编辑和技术人员，并扩大了演播室和新闻编辑室的空间。根据《名利场》杂志的说法，这是CNN在其核心产品（即电视频道）之外花钱最多的项目。


    CNN+希望这样的大手笔不仅吸引CNN的“忠实粉丝”，也吸引那些没有有线电视订阅的“拔线族”。这种投资重心的迁移反映了美国有线电视用户数量的锐减，而有线电视新闻观众已经严重老化，年龄中位数处于60-70岁。


    不过，并不是所有人都看好CNN+的前景，从它挖角的成功率上可见一斑。尽管有成功跳槽者，但也有更多的新闻台主播和记者不为所动，比如MSNBC的玛多（Rachel
    Maddow），她拒绝了CNN+每年2000万美元的工资包。人们也猜测曾因报道造假丑闻跌落黄金时间主播神坛的布莱恩·威廉姆斯（Brian Williams）可能转会到CNN+，但目前这也不是事实。MSNBC内部人士指出，CNN+“除了能让心思松动的人跟老板谈涨工资之外，没有真正受到任何人的注意”。


    # 对标Netflix，还是《纽约时报》？


    如果将CNN+定位为一个独家内容构成的视频流媒体服务，就像Netflix那样，那么如上文的价格对照显示的，它确实缺乏一点竞争力。但CNN首席数字官兼CNN+负责人莫尔斯（Andrew
    Morse）拒绝这样的类比。莫尔斯表示，CNN+的商业模式实际上更类似于《纽约时报》——会员通讯此前曾经多次提到过，这份报纸在过去10年中建立了庞大的数字订阅用户群，且得到丰厚的回报。《纽约时报》的数字订阅不仅包含报纸'
