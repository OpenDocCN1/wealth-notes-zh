    # # Average consumer spending $273 per month on subscription services: report


    People are spending 15% more than they did in 2018, equalling an extra $430 spent
    each year.


    Written by Jonathan Greig.


    Staff Writer


    on September 21, 2021 | Topic: E-Commerce


    Consumers are spending more than ever on subscription services, according to a
    new report from West Monroe.


    West Monroe polled 2,500 consumers about how much they spend each month on a variety
    of subscription services, finding that people are spending 15% more than they
    did in 2018. The types of subscriptions have also expanded as more companies create
    digital platforms and offerings to lure in consistent customers.


    The average consumer surveyed said they spend $273 per month on subscription services,
    up from $237 in 2018. This extra 15% equals an additional $430 spent each year.


    The researchers behind the study were also very interested in people''s perception
    of how much they spend each month on subscriptions, finding that most people underestimate
    how much they dole out monthly before sitting down to calculate it.'
