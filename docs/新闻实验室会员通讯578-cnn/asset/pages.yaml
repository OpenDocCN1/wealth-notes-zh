- pgno: 3
  md: '本身，也有菜谱、填字游戏等周边项目。但总体上，新闻服务仍是它提供给用户的最大价值。


    另一方面，尽管Fox Nation已经早早开办，CNN+并不屑于与之相提并论。它声称自己是“全球唯一基于视频的新闻订阅业务”，并且直言不讳地称Fox Nation是“一款专注于娱乐和右翼言论而不是新闻的流媒体”。


    CNN+意在通过更富弹性的节目编排，更精华的访谈节目嘉宾人选，特别是更大牌和多元的主播阵营，来区别于其有线电视频道的自由派节目。由杰夫·扎克（Jeff Zucker）主政的过去8年让CNN的节目风格有了明显的偏移，特别是在2015年特朗普开始竞选总统时起。（会员通讯447期曾介绍过CNN不慎外泄的内部编辑会议如何裁剪与特朗普有关的新闻内容。）


    党同伐异的有线电视新闻频道以日益极化的风格各自拉走观众，也让关心媒体业的人士担忧：长此以往，这可能意味着新闻业整体的公信力下降。在这个阶段，如果能有一个确实做到中立持平的媒体平台出现，自然是非常好的。有不少人怀念上世纪90年代及以前的CNN，那时他们确实能提供简单、纯粹，没有冗长嘉宾连线，也没有明显倾向和偏见的新闻报道。而CNN+的出炉似乎意味着，要再次看到这种质量的报道，起码是得掏点钱才行。


    但是，甚至连CNN这个招牌本身，都有可能构成通往中立持平这一理想的障碍。其直接的竞争对手、刚被挖走一员大将的福克斯新闻对CNN+宣称要做跨党派媒体嗤之以鼻，他们认为有如此多的同时主持电视频道的主播加入CNN+的节目，而且他们无一例外表达了自由主义倾向，是不是能让CNN+真的只有纯新闻，而不夹杂观点与意见的。


    最后，CNN+的前途还很显然受到其母公司和整个行业大势的影响。2021年初，在特朗普总统任期末尾发生冲击国会山事件时，CNN收视率是有线电视业界的榜首。结果到年底，它只能在所有频道排名第17位，黄金时间收视率更掉到第31位。


    一系列不利事件造成了CNN的挫折，其中最大的一起当属知名主播科莫（Chris Cuomo）的丑闻（详见会员通讯546期）。他离职后不久，曾经力保他的杰夫·扎克本人也因为和女下属的地下恋情曝光而不得不辞职。就在这时，CNN母公司华纳媒体（WarnerMedia）被AT&T分拆出来，并完成与探索频道（Discovery）合并。


