    *Source: J.D. Power TMT Insight survey of 1,745 U.S. adults, Dec. 16-19, 2020*


    J.D. Power


    But a sector shakeout could be looming once lockdowns lift and “streaming fatigue”
    sets in.


    > “When we emerge from this pandemic and people have less time to consume content
    at home, it will be intriguing to see how regularity of use factors into streamers’
    decisions to potentially unsubscribe from some of these services,” MoffettNathanson
    analysts led by Michael Nathanson, wrote in their Q4 2020 SVOD tracking report
    released Friday.


    Note that MoffettNathanson’s study found lower average household SVOD penetration
    than J.D. Power’s did. Per MoffettNathanson, whose survey was conducted with HarrisX,
    the average U.S. pay-TV household as of the end of 2020 subscribed to an average
    of 3.33 SVOD services while non-pay-TV homes subscribe to an average of two.


    About 81% of respondents on J.D. Power’s survey said they subscribe to Netflix,
    the No. 1 streamer. Amazon Prime Video ranked second at 65%, followed by Hulu
    at 56%, Disney Plus at 47%, HBO Max at 22%, Peacock at 18%, and Apple TV Plus
    at 14%.


    Meanwhile, J.D. Power’s survey found Disney Plus’ “The Mandalorian” was the most-watched
    TV show on streaming platforms in December 2020. That helped Disney Plus boost
    user time spent on the platform, rising from 4.8 hours per week in April to 5.0
    hours per week in December. Among the services in the survey, Netflix had the
    biggest decline from the spring, dropping from 10.2 hours to 9.5 hours weekly.


    The J.D. Power TMT Insight survey of 1,745 U.S. adults was conducted Dec. 16-19,
    2020. The margin of error for the survey results is +/- 2% at the 90% confidence
    interval, according to the researcher. A copy of the study is available at this
    link.'
