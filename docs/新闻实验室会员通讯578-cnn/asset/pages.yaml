    Parts Unknown）全集，此外也有圣经故事、《70/80/90年代》等剧集。CNN+也将上线一些仅仅在流媒体播出的资讯节目，比如一档墨西哥美食游记。作为对比，Fox
    Nation也主要是提供福克斯新闻频道监制的资讯和娱乐节目，其定价也是每月6美元（并且有一个对退伍军人免费一年的“情怀价”）。


    不过这并非CNN+的主要组成部分，它每天都会8场直播的新闻播报，贯穿全天；此外每周有10个周报的新闻和访谈类节目。


    电视新闻频道需要严格控制时间，并插播广告。所以在CNN电视频道的新闻栏目被切成半小时或一小时时整的方块，其中插播广告至少占据了三分之一的时间。相比之下，流媒体播报的时间限制就要自由得多。以首档节目《今天五件事》（5
    Things）为例，如果今天事情比较少以及比较简单，可能五分钟就完事了；如果需要大篇幅的背景介绍，可能是15分钟或更久。而对于克里斯汀·阿曼普尔（Christiane
    Amanpour）这样的访谈主持人来讲，也不用担心为了卡结束时间而不得不草草收尾，可以聊个痛快。


    因为CNN的三个电视频道--美国版、国际版和HLN--早已在全世界200多个国家和地区签订了复杂的分销协议，所以CNN+订阅内容并不包含电视频道的直播和点播。但原属于CNN
    Go品牌的电视频道网上直播还是将转移到CNN+品牌下面，同时CNN Go品牌将下架。CNN+表示，其付费的新闻节目可以涵盖电视频道播出的内容，且质量更好。


    最后，CNN+还将提供一个互动式的“采访俱乐部”，允许订阅者向专家嘉宾提出问题，经过审核之后，问题将在网上节目中被解答，感觉有点像是视频版的Clubblehouse一样。在CNN+的网站上，显示了其中一些观众已经提出的问题，提问对象包括传染病专家安东尼·福奇等新闻当事人，而对应的答案正是需要付先费再查看。正如CNN一位高管所说的那样，这个互动环节也是产品竞争力的一部分，以使该服务“不仅仅是一个拥有新闻内容的Netflix”。


