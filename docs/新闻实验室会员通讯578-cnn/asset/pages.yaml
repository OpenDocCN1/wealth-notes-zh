  md: '![](img/352f23da7189c573680e93f7602c2bd7_10_0.png)


    # West Monroe


    Dhaval Moogimane, a partner at West Monroe, said it was not surprising to see
    that subscription spend grew over the past three years.


    "It is reflective of the growth of products and services available to us as subscriptions,
    and the buying behavior that has changed, driven by COVID. What was most surprising
    to see was the perception gap between how much respondents thought they spent
    on subscriptions per month versus what they actually spent," Moogimane said.


    "The percentage of respondents who were off by more than $200 grew to 66%, from
    24% in 2018. This increase in perception gap is indicative of how some of the
    subscriptions are now viewed as utilities, particularly cell phones, Wi-Fi, ID
    protection services, cloud storage services, and more."


    Moogimane added that to capture estimates, they asked respondents to think generally
    about "recurring monthly expenses associated with digital services, devices, and
    subscription boxes" -- including prompts of specific examples and service categories.


    Respondents were given 10 seconds to guess how much they spend each month. After
    recording this initial answer, they immediately asked participants to repeat the
    exercise with 30 seconds to think about the question more carefully.


    "This is how we calculated what their initial perceptions were for their monthly
    subscriptions. Then we took them through their subscriptions one by one and tallied
    up their spend per each individual subscription to determine their actual total
    spend," Moogimane said.


    "The idea is that consumers may think they know what they are spending each month,
    but when they are asked what they actually pay for each subscription service and
    the total is added up, it reflects a different story."'
