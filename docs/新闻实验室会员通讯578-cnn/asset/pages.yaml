    # 案例


    # CNN+


    当地时间3月28日晚，美国有线电视新闻网（CNN）在纽约为旗下全新的流媒体服务“CNN+”举办公线上发布会，该服务于29日正式推出。会上，该公司将CNN+的发布形容为与1980年CNN电视台的创立相提并论的大事，并宣布CNN创始人泰德·特纳（Ted
    Turner）成为第一名订户。


    CNN并不是美国第一个进入流媒体领域的主要电视新闻网络——实际上，应该算是最后一个了。在此之前，ABC、CBS和NBC都开设免费的流媒体新闻频道。付费内容方面，NBC将MSNBC内容纳入其全台流媒体服务Peacock旗下。大概三年半以前，福克斯新闻推出了针对“超级粉丝”的增值服务Fox
    Nation。


    本期会员通讯将介绍CNN+包含的所有服务项目，分析其与Netflix这样的流媒体订阅服务、《纽约时报》这样的数字新闻订阅服务的异同，以及在立场公正性及商业前景方面的挑战。


    # 订阅内容：热门原创剧集、独家节目、观众参与


    CNN+的定价是每月6美元或每年60美元，早期注册有50%的终身折扣（即如果中途不退订，可以一直享受这个折扣价）。相对于Netflix、Disney+等月费在8-10美元的服务，乃至月费5美元的Apple
    TV+，可带广告免费观看的Peacock等而言，这个价格并不便宜。那么，人们需要知道这样的价格将会为其订户带来什么。'
