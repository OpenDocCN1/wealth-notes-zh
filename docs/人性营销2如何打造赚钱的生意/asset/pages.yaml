  md: '# 1、为什么要通过当老板和读书去赚钱


    纵观人类社会获取财富的方式，我们会发现赚钱方式有以下几种：


    # 第一种方式是天上掉馅饼。


    比如：中奖、捡到钱等。这种方式获得财物的概率很低很低。


    # 第二种方式是投胎技术好，继承父母的、或者受到富有亲人的馈赠。


    典型案例在这个社会上也有，长辈有钱加自己高智商，那是所向无敌。这种方式概率也很低。


    # 第三种方式是做出售砂票的生意，也就是靠投资挣钱。


    比如，以钱生钱，买房子，投资股票，直接投资一个公司等。

    说白了，是靠自己的眼光和冒险赚钱。这种赚钱方式成功概率是5%。自己没有经营过企业的人很难投资成功，因为你分辨不出来哪个企业好、哪个企业坏。'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# 第四种方式是自己做老板。


    靠操心费力、冒险挣钱，不倒闭能够赚到钱，生意亏损倒闭，就会自动一分钱都没有。这种赚钱方式成功概率是5%。


    # 第五种方式是结婚。


    找有钱人结婚，立刻让自己变成有钱人。这种方式对自身素质和先天资质（漂亮或者长的帅）要求很高。


    # 第六种方式是刻苦读书，把经济规律搞明白，掌握了社会规律，靠智力赚钱，智力也是资源。


    # 第七种方式是上大学。


    学历高了，找个好工作，不过成本比较高。


    # 第八种方式是当牛做马。


    打工族，大多数人是这样赚钱的。


    这八种赚钱方式，我只推荐普通人用第四种，也就是自己创业当老板和第六种刻苦读书，提高自己的智力赚钱。因为这看似有难度，实际上是最简单的，只要你有毅力一直干下去，总会致富的。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 2、创业开公司是赚钱最优的出路


    创业开公司是赚钱最优的出路。以下是你创业初需理清

    楚的几件事。


    # 第一，永不放弃。


    你是一个创业人，你不是打工的，打工的可以说这个问题解决不了了，我们就不能解决了。但创业人必须相信，每一个问题，你都能找到解决的方法，重要的是你要行动。你必须解决问题，不解决问题，公司就会倒闭。


    每解决一个问题，你的赚钱能力就提升。解决问题的概率有多大不重要。大家都知道爱迪生发明电灯，试验了几千次，才成功的。这就是创业者要干的事情。创业成功本来就是小概率事件，而我们就是要把这些小概率事件干好。


    创业人，遇到困难的时候总是有信仰的，我们知道什么是我们必须要干的事情，我们根本不会因为困难就放弃。所以我'
  merge: -1
  img_proc: true
- pgno: 21
  md: '最喜欢马云那句话：“永不放弃！”


    # 第二，抱团取暖。


    一个人上路，你要做的事情实在太多，要习惯性的抱团取暖，多找几个个人陪你一起上路。重要的、最核心的、最赚钱的事情，自已干，把不太重要的事情分配给你的伙伴干。


    如果我们想成就一番事业，赚到很多钱，创业开公司是我们最优的出路。如果我们不想成就一番事业，不想赚到很多钱，或许我们就不应该选择创业。


    既然选择了创业，就是选择了凤凰涅槃，别怕，任正非说的：“烧不死的鸟是凤凰。”当然烧死的鸟就是烤鸡。放弃了就死了，不放弃，就永远有机会。


    # 第三，诚实。


    做为一个打工的，你可能习惯性的说谎、骗领导、骗老板。不管业绩多差，你都可以撒谎。但做为一个老板，你必须非常老实，任何方面都必须非常老实。你以为你在骗别人，实际上你是在骗自己。


    这一点，我特别喜欢史玉柱的做法，他不允许他的下属虚报计划。你能做多少业绩，就说能做多少，别夸海口，到时候又做不到，弄得老板也不知道该如何管理公司了。'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# 第四，圈子。


    如果你有机会加入一个创业者的圈子，这个圈子里的人都是正在创业的人，或者已经成功的老板，你可以向他们一些你碰到的营销上的问题、管理上的问题、招聘人才上的问题，这对你的提升是相当大的。


    一个人是很难以解决他从来没有碰到过的问题的，基本都要向市场交昂贵的学费，但过来人可以很轻松的指导这个人解决这个问题。所以，拜几个老师很重要。


    # 第五，做擅长的事。


    不忘初衷，追随自己的内心，用自己的特长工作，要聚焦在自己擅长的工作上面。你不擅长的工作碰也不要碰。


    没有人是全能的，市场也不需要你满足所有的客户。用你的特长去服务市场，你就会获得极大的回报。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 3、创业成功的三个关键点


    创业成功的三个关键点。

    第一，必须做自己爱做、喜欢做、擅长做的事情。


    并不是说你有一个好点子，或者听到别人说一个好创意，或者在一个好行业，你就能做好企业。而是你是一个做做这件事、爱这个创意、爱这个行业的人。


    创始人必须与公司是深深链接在一起的，创始人认为公司就是自己的生命，他除了做公司，对其他事情不感兴趣了，他才能做好这个企业。


    怎么判断你是不是在做你热爱的事情呢？一提起这个企业、这个创意、这个行业，你会喋喋不休、动力十足。你所有的时间都泡在了这个企业里。你吃饭、洗澡，甚至睡觉都在想这个事情，就如同我以前玩魔兽世界一样，脑子里天天都想游戏里面的技能、人物、装备，不想房屋都难


    但如果你一做这个事情，就走神，就无精打采，那'
  merge: -1
  img_proc: true
- pgno: 24
  md: '你不喜欢这件事。就算是这个创意再好，行业再好，你也难成功。


    所以，每一个创始人，最重要的是思考并且找到你的爱好、你喜欢做的事情。一旦你找到了，你就投入所有精力去做，不要理你周围的人说这个没前途就不要做了，完全尊重自己的内心与爱好。


    # 第二，必须紧跟着时代的脉搏。


    就是要看中国，乃至世界上的趋势是什么，不根据趋势做事的人，纵使本领高天，也难以成事。


    比如，改革开放，国家鼓励大家下海经商。很多下海经商的人发财了，而守旧的人几十年过去了，依旧贫穷。如果你在这之前你经商，就是没有跟著时代的脉搏，会让你投机倒把，甚至会把你抓起来放进监狱。


    比如，90年代到2008年以前，可以说国家在鼓励城镇化建设，房地产是一个重头戏。这个时候，如果参与与建筑行业的创业，很多时候也发财了。但如果你在这几年再去参与与建筑行业的创业，就很难，因为国内知名的几个房地产公司都在转型了。


    那么目前，该在什么行业创业呢？国家在鼓励什么呢？我说的我招聘的事情，我在上海，想招聘一个微信推广'
  merge: -1
  img_proc: true
- pgno: 25
  md: '的普通员工，要6000块的底薪+提成。而房地产业的中介，早上下9点干到晚上10点，其中的优秀者仅仅能够拿到8000到1W的收入，而大部分人的收入在5000左右。到<|message|>


    底哪个行业机会多？毫无疑问是互联网。所以，我们现阶段就是要选择互联网创业。


    # 第三，选择任何好的点子、好的创意、好的行业去创业，都必须要脚踏实地，努力是不可以被任何技巧、方法、手段代替的。


    企业做起来，绝不是一拍脑袋，找到一个好创意就完了。任何一个成功者，都必须在一件事情上练习超过1万小时。迈克尔·杰克逊、比尔·盖茨，都是在其喜欢的事情上超过了1万小时。每天10个小时的话，一年3650小时，3650小时*3年=10950小时。所以，要有耐心拼命三年，基本上做个千万富翁在当今社会还是容易的。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 4、创业中常见的三个误区


    创业是需要研究的，创业也是有方法、有步骤的，并不是乱打一通王八拳，就能成功的。不研究、学习创业，无异于拿着钱往水里扔。当然，有的伙伴扔了几个钱，就学习到了经验，然后边学边扔，他可能有个有钱的爹，扔着扔着，也就成功了。


    但大部分创业者是没有有钱的爹的，他可能是借的钱，可能是父母的棺材本，可能是卖了房子来创业的，这就扔不起适了。创业需要理解的东西很多，我先提三个。


    # 第一，创业是否资金越多越好？


    其实答案可能与很多人想的恰好相反。如果你创业，不卖房子，不借岳母棺材本，甚至不借朋友一分钱，资金少得可怜，假如就是 3000 块钱起家，这样反而容易成功。


    首先，你的精神压力就很小，人一轻松，就容易超常发挥。'
  merge: -1
  img_proc: true
- pgno: 27
  md: '如果你经常读那些商业史、很多大商人的传记，你就会发现非常多的牛人都是几千块起家的，几百块起家的也很多。资金少，恰好是他们成功的重要原因。


    钱少了，你就不会去思考租个办公室了，也不会想着招聘个员工，你更不会直接开始定战略，整些不着调的事情。你也不会盯着成本大的生意了。你的所有力量都会使到最有价值的地方去，你会非常老实的选择一个非常小的生意去练手。而且，你一定是亲自上阵，你不会等待，也不会有依赖谁的心思。因为你是个人贪司令，你不干？谁干？


    亲自上阵，商感就容易练出来。而且，因为资金少，任何一个挫折你都能接受，损失大不了3000块。失败了，总结下宝贵的经验，打一个月工，3000块又回来了，继续干。这样不断的调整，成功的几率就会很大多。


    还有，因为你用非常少的资金在创业，所以你必须疯狂的开动你的脑袋去想问题。人的主观能动性会得到极大的发挥。

    当你挖掘到了一个利润点后，你会非常的珍惜，并且拼命复制，放大。这个时候，假如你赚到钱了，招聘一个员工，你就知道应该让他干什么了。


    如果你的资金大，一开始就招聘员工，你其实不知道什么能赚钱，基本属于瞎指挥。还有，借岳母婚材料创业，或者卖'
  merge: -1
  img_proc: true
- pgno: 28
  md: '房子，借钱等创业，失败一次，因为损失大，人就会非常受伤。

    第一算，要打工很多年才能还得起，有可能导致对创业感到恐怖。


    资金小，我们瞄准的客户群就越窄、越小众，你自然就聚焦了，往往起到一针顶破天的效果，容易获得发展机会。

    钱多呢，人就验得慌，有可能忍不住做几个产品，导致精力分散，一个也做不出来。


    # 第二，创业是否要放亲家族成员、亲戚的加入？


    现在有一个现象，很多年轻人都不太愿意接受家族成员加入，以至于发展到一个观念，连朋友都不能一起创业了。

    这其实是一个误区。


    纵观整个亚洲地区，日本、韩国、泰国，许多的家族企业都发展得很好。我们中国的家族企业也发展得很好。


    创业本来就很难，家族兄弟有个好处就是信任成本低，打断骨头连着筋，吵得再凶，还得和好，遇到困难也会非常有凝聚力。而与外人创业，大吵一架过后，估计就散伙了。会出现打不得，骂不得，说都说不得的情况，交流不能彻底。有点饿了，又老是勾心斗角，争权夺利。而且彼此间经常杯疑。这都是创业的时候的致命问题。可能开始走得顺，有起色了，但也会因为这些问题被搞死。'
  merge: -1
  img_proc: true
- pgno: 29
  md: '第三，有很多专家经常在电视、媒体、书上说经营企业“质量第一”“品牌第一”“研发第一”“价格便宜”，反正就是各种第一。


    其实，这些都是些没有实战经验的人喜欢谈论的。


    书本上那种“各种第一”的知识，读得越多，越反动，越容易失败。因为不同的行业，产品、市场需求、用户质量都是完全不一样的。


    比如一个收入很低的地区，可能对质量的要求就不高，而对价格就要求便宜。而有些地方的人就是要品牌货，有些地方的观念就是能用就行了。


    我们创业的时候，资源有限，一定要弄清楚你正在做的产品与正在开发的市场到底哪方面才是应该重点投入的地方。对症下药，才能获得成功。'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 5、创业需要不是资金，而是资源


    创业需要启动资金吗？我一直强调人要善于思考。以前在深圳，我认识一个朋友，这个朋友也是个穷苦的打工仔，然后他在老家有一个高中同学，跑过来找工作，工作没找到，就住他家里。可是这个同学身无分文，白吃白喝很多天了。这个时候，这个朋友的女友，包括他自己，就不给这个老家来的同学好脸色看。


    然而这位远道而来的高中同学依旧没有找到工作，要么是找到了，看着薪水也不想去干，但是天天白吃白喝，自己脸面也快挂不住了，他就到各个高楼大厦里去晃荡，消磨时光混日子。看到了垃圾桶里有非常多的订餐传单，他就开始收集，只要是这种订餐的传单他就收集，一天下下来，收集了
    400 多张，然后就找把刀，把传单下面的电话给拆了，用笔公正的写上自己的电话。


    第二天，他就选定了几栋楼去发，这小伙子很勤奋，一天'
  merge: -1
  img_proc: true
- pgno: 31
  md: '就发完了 400 张，果不其然，到了饭点，就有几个电话打过来。然后他就按照约定的价钱到快餐店去定餐，自己跑腿送去。


    就这样他一天的生活费就赚到了，当然他继续收集传单，继续发，生意也越来越多。钱赚得有点多的时候，他就开始自己印传单了，不拆别人的传单了。


    在这个过程中也碰到别的送信单、送快餐的打工仔，他就忽略了一个小年轻跟他干。结果，就这样，他慢慢开始发展成了一个小快餐公司。至于后来怎么样，我也没有再关注过。


    但这件事给我了一个启示，非常多的人认为创业是需要投资，需要启动资金的，我曾经漫山遍野找创业合作伙伴的时候，来的一些大学生、工程师，几乎必问我，有没有投资，启动资金多少。


    这就陷入了思维定式，这种思维定式来自于课本，来自于媒体。让很多人不加思索的认为，没钱是一定不能创业的。所以我非常喜欢一句话，一切皆有可能。


    创业不是需要资金，而是资源。什么叫资源呢？我们周围的一切，比如，我们的勤奋程度、我们的思考力、思维深度、我们的坚持、我们的心态、我们把废物利用起来的能力，这些都是我们的资源。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '在这里我并不是强调有启动资金不好，我一贯讲的是有效地利用我们能够使用的东西。其实我的经验是 1 万块与 100 万对很多初期创业者来讲是一样的。


    我见过一群创业者拥有 100 万在小区里做个卖菜的店，要整网络 O2O 卖菜。装修店面花了 15 万，还请了 3 个员工，买了冰箱。各种看起来正常的消费使这几个年轻的创业者没坚持到一年。而我同时发现另一家店啥都没有，就租个门面卖菜，估计流动资金都不足
    1W，生意也不错。


    钱多了，有钱多了的浪费方法。如果钱多的話，创业初期需要专业的财务管理。实际上，当我们凑到第一桶金了，接下来就是考虑钱多的时候怎么创业的问题了。


    对于第一次创业的人，启动资金 5 万元是上限，下不封底。为啥呢？因为一般情况下，第一次追女孩都会失败的，第一次创业也是如此，少拿点血汗钱出来去丢水里，这样小心脏能承受得住，离摩顶的距离与安眠药瓶的距离也就不远些。


    当今社会，很多人都想出来创业，其实我蛮奇怪的，平时打工就不出彩的人，咋就跟打鸡血似的呢？要知道在公司干，只干一个方面的业务，尚且不那么出色，自己创业的话，面对的是方方面面的业务。'
  merge: -1
  img_proc: true
- pgno: 33
  md: '其实如果我们有心创业，就要在公司里面努力的干好，跟著我们天天抱怨的那个boss好好学习，学他是怎么经营企业的。 各方面的活要抢着干，慢慢的，老板会把我们放到核心业务里面，并且告诉我们怎么操作业务，怎么做好客户关系。


    更有意思的是，我们努力学习着他的精髓，他还感谢我们，给我们发工资，这真的比当年在学校读书有意思的多。这个思维是想要创业的人必须要有有的。


    如果我们觉得当前的老板不行，那么我们就换个我们认为行的去学嘛，别整天骂老板心黑，抱怨工资低，搞的跟个怨妇是的。


    # 6、创业者容易踩的几个坑


    创业者容易踩的几个坑。


    第一个坑，被钱困扰。


    创业的本钱根本用不了多少，只要你有一台电脑，有一根'
  merge: -1
  img_proc: true
- pgno: 34
  md: '网线在网络上，就足够找到很多暴利项目。


    # 第二个坑，随便找合伙人。


    开始的时候，你根本不用找合伙人。其实核心合伙是最难找的，这靠缘分，也靠平时积累。如果实在找不到，不要强行找。先自己找个零成本的项目干起来，项目活了，每月的收入突破几万块了，这个时候可以采取招招聘员工的方式来扩大团队。


    甚至，你的项目赚钱了，你也有说服力了，你就可以说服同事、同学、亲戚来给你当助理，一起创业。


    # 第三个坑，股份平分。


    创业的时候，股份不要平分，甚至你可以先谈股份，就是给跟你做事的人高提成就行了。最好采取独裁主义，权力都在你自己手里，好管理，也很灵活。


    什么事情都商品著来看下，就是效率。大多数人都是普通人，他们的头脑里想出来的主义根本就不赚钱。而且想法根本就不值钱，有了想法，能倾而舍的干起来，才值钱。


    # 第四个坑，不出钱，给股份。


    如果你非要找合伙人、记住，凡是不出钱的人，都不给股份，都不算合伙人，只算打工的，只给提成。


    比如，有人说，我给你出力，你给我多少股份？有人说，我有关系、有背景，你给我多少股份？有人说，我有技术，你'
  merge: -1
  img_proc: true
- pgno: 35
  md: '给我多少股份？这些人通通不给股份。


    # 第五个坑，找到的是阻力队友。


    创业最怕找到几个贪得无厌的人跟你做伙伴，他们根本不是驱动力，而是阻力。能创业的人，必须是自我驱动力很强的人。


    什么意思呢？就是不用别人强迫他，他主动找事干，没日没夜的把事情干完美。凡是要别人指挥才会主动做事的人，都是不及格的人。这样的人，连主管也不给他当，何况股东了。


    # 第六个坑，钱最重要。


    创业初期，很多认为金钱很重要，其实，创业初期，金钱反而是最不重要的。重要的是头脑清晰，愿意付出，愿意为了一个项目吃苦的精神。切忌三天打鱼、两天晒网的人参与创业，也切记不可过劳。


    # 第七个坑，过劳。


    创业是持久战，是一辈子的事。创业要成功，就是每天保持一个固定的强度去工作，然后持续的干几个月，先看看效果。赚到钱了，再进入下一阶段。


    # 第八个坑，要熬几年才赚钱。


    现在网络上创业，真正懂网络营销，赚钱也就是三个月的事情。已经不像很多传统行业一样，要熬几年还见不到钱了。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 第九个坑，活在拼人数的年代。


    现在网络创业，也不是拼人数的年代了，一个人就能实现月赚几十万。这一点也不稀奇，很多都做到了，很多网红甚至都年收入几十个亿了。


    # 7、你能分配的利益越多，你的阶层就越高


    很多人赚钱，走入了一个误区，就是喜欢自己搞懂一个东西才去赚钱。而当你搞懂了的时候，你发现比你优秀的人太多。所以你搞懂的这个东西，根本就赚不了什么钱。


    要赚钱，要理解金钱的分配模式。金钱的分配模式是按阶层分配的。所以，你首先要爬到高等阶层去。那么，你不是富二代，不是官二代，如何爬到高等阶层呢？别人为什么给你踩呢？答案就是你必须对别人有益处。你能分配的利益越多，你的阶层就越高。


    # 如何分配利益呢？就是把大部分利益都分给别人，那么你'
