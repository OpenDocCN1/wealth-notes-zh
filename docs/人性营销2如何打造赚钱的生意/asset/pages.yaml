- pgno: 262
  md: '# 1、互联网时代老板经营思维的转变


    如何在互联网时代当老板？


    **第一，无缝连接。**

    建立一个 QQ 群，把所有团队成员都拉进去，老板讲什么，团队成员都知道；团队成员讲什么，老板都知道。互联网时代的企业，必须是无缝连接的。


    **第二，审核工作。**

    互联网时代，老板做好审核工作，包括各个模块的员工做的工作。比如，一篇文章，老板是要去审核的，这代表整个公司的价值观，也代表整个公司的形象。老板去审核，质量就会越来越高，老板不审核，质量就会越来越差。大家也不会重视，团队就赚不了钱。


    **第三，团队模式招聘。**

    招聘模式是团队招聘，不老板一个人说了算。人事面试过后，由相关的用人主管面试，最后老板去面试。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '任何一个加入团队的人，都至少要经过团队里三个人面试。大家都认可这个人可以融入团队，就让他加入；不能融入，就不加入。整体感觉非常重要，这样不容易招聘错员工。公司招聘错一个员工，然后进行解聘，是最浪费时间的时候，金额成本也够大。


    # 第四，制造信息。


    互联网络时代的企业，必须不断在网络上制造信息。信息越多越好，各渠道都去制造信息。信息里加上卖东西的内容，自然有人买单。信息的形式，可以通过文字、语音、视频，各种方式去制造。


    互联网络时代，每一个公司，至少都应该有一个10人的互联网团队不断的发布信息。假如你这个公司实力比较强，建议你做到50到100人的互联网团队。互联网团队带来的利润绝对是非常可观的，只要你这个团队打造得正常。假如你是传统企业，你的效益会指数级提升。


    # 第五，坚持。


    做互联网公司，开始三个月不盈利非常正常，不要慌乱，坚持下去。只要你相信你的理论是正确的，你就应该坚持你的信念一直干下去。


    # 第六，售前就是做资讯。


    外面免费的东西很多，你做了很多免费的信息，就不要做'
  merge: -1
  img_proc: true
- pgno: 264
  md: '售前服务了，也不要猜免费服务。这个社会上不缺免费服务，缺的就是收钱的好服务。只要你的服务质量好，客户就会转介绍，会自动传播，进入了靠服务打天下的模式。收入只会越来越高，生意是越做越容易。进入了靠售前成单的模式，你会越做越心累，生意会越做越差。互联网时代售前就是做资讯。


    # 2、互联网企业招聘什么样的人，

    服务什么样的人


    互联网企业，内部的信息高度对称，老板建立一个QQ群、微信群，有什么样的思想、什么样的文件，直接放到文件夹里面。

    所有员工直接理解老板的思想，用老板所思所想，直接开始变成具体的内容，用这些内容去赚钱。


    老板每天监控每一个员工生产的内容，做的营销是不是到位了。并且建立机制，让每个员工相互监督大家的工作是不是做到位了，是不是理解了老板的思想。


    10个人一个小团队，每周都奖励1000块给最赚钱的人，奖'
  merge: -1
  img_proc: true
- pgno: 265
  md: '励 100 块给第二赚钱的人。


    每个月奖励 3000 块给最赚钱的人，奖励 300 块给第二赚钱的人。


    每季度奖励 1 万块给最赚钱的人，奖励 1000 块给第二赚钱的人。


    末位淘汰制，试用期三个月，最好在 1 个月内，就要开除不合格、不赚钱的人。


    这个模式，能让员工自己拼命的努力工作，有奖金嘛，并且我自己的企业是还分 60% 的利润给员工，大家就更加拼命了。


    互联网企业，是没有办法养普通 的、不赚钱的员工的，这种员工永远也赚不了钱，成本太大了。


    互联网企业，不是传统企业，是脑力劳动企业，大部分大学生是干不了这种需要创新、需要自觉、需要脑力的劳动的。


    对，你们没看错，我说的是大部分人都干不了这种赚钱的工作。


    一定要每天招聘，大量筛选，大量淘汰。社会上只有极少数人可以赚到别人几百倍的收入，只有极少数人可以赚到别人几千倍的收入。


    如果你这一辈子不舍得、不忍心淘汰别人，你就只有被这些不赚钱的普通人搞没掉。你周围聚集了大量这种普通人，你想发财?'
  merge: -1
  img_proc: true
- pgno: 266
  md: '真相很残忍，只有英雄才能接受这个现实。企业家，不是普通人，跟普通人想的完全不一样。比如，普通人想一个月赚2万块不错了。而企业家想的是，一天能不能赚20万纯利润。


    这就是区别，是不可逾越、不可交流、不可沟通的区别。大部分人也不应该学企业家思想，也很少有人能做到。


    所以，我们永远只营销小部分人，我们永远只服务少数人，这些人是人类社会的精英，是懂事的人，是企业家，是伟大的创业者。


    # 3、老板应该参与到企业最重要的业务上


    我好读书，好思考，我企图当然用手掌柜来管理公司。总的来说，我之所以是老板，就在于我比公司的其他人更上心公司的业务，也有更责任心。所以，我不应该把心思大量的花在读历史、哲学，甚至是各种管理理论、各位伟人的讲话与传记上面。


    我真正应该做的是参与到公司的具体业务中，思考公司的'
  merge: -1
  img_proc: true
- pgno: 267
  md: '具体业务。当一个个人真正开始思考一个具体业务与操作一个具体业务的时候，这个人的思想就会越来越深入，对公司的业务理解得越深刻，逻辑越清晰，我们就能赚到更多的钱。


    我本人在营销与设计方面都有特长，我应该亲自去带领公司最重要 的部门做业务，而不应该把最重要、最能产生利润的地方交 给职业经理人去做。


    职业经理人、能力差一点的人可以去管理公司次重要的板 块，但最重要 的板块一定是由我亲自去处理。员工就如同公司 的零件与工具，老板是使用这些零件与工具的人。老板不能企
    图这些零件与工具自动把自己使用好。


    我佩服亨利·福特这个人，他推动了汽车业的发展，推动 了世界的发展，是世界上最伟大的企业家。他如此伟大，我想， 跟他本身是一个工程师有很大的关系。他是一个真正懂公司产
    品的人，他喜欢自己搞鼓汽车，对公司的业务非常熟悉。


    我也要做这样的人，我不做那种对公司业务、产品不熟悉 的甩手掌柜。所以，我的精力应该多花到公司业务上面，而不 是在哲学、艺术、历史故事上。'
  merge: -1
  img_proc: true
- pgno: 268
  md: '# 4、不断的与强者交流


    很多人看不明白为什么社会名流不断的开会，不断的交流。人类能从原始人进化到现代社会，就是因为学会了用语言交流。


    早期的类是不说话的，原始人甲的想法没办法传播给原始人乙。后来，人类逐渐学会了语言，每个人捕猎的心得就可以相互交流了，种植的心得也可以相互交流，并且学会了闲聊。如此，大家思想不断的碰撞，人类就开始了快速进步。


    欧洲社会之所以科技非常发达，就是因为他们有很多国家经常发生各种摩擦与碰撞，思想不固化，故而近代的很多科技都是欧洲人发明的。可以说欧洲人让人类文明前进的脚步加快了。


    谁喜欢不断的交流，不断的吸收新思想，谁就必定变得强大。哪个团队里的沟通顺畅，并且经常沟通，这个团队也会变得异常强大。'
  merge: -1
  img_proc: true
- pgno: 269
  md: '所以，我做团队的方式，就是早上开会，下午培训，然后让人们讲心得，相互交流。时间都不长，10分钟到20分钟而已，但非常重要。


    我不喜欢开长时间的会，就是想起了什么，就聚集几个人讨论5分钟。这样润物细无声，一个问题确定了，就马上执行。长时间开会有个毛病，就是讨论了非常多的问题，散会了，大家精疲力尽，都已经忘记讨论了什么，更别谈什么执行力了。


    很多发财的机会，也是我们跟圈外的人交流得来的。就说读书这件事，我要是没有几个喜欢读书的老板朋友，我都不知道读哪些书籍。


    团队内部的交流，会让员工执行力变强，也会让团队凝聚力加强，提高工作效率，也会提升团队的智慧。


    不断的交流让欧洲的科技进步变快了，同时加快了人类社会的进步。


    所以，我们想变得强大，就是要不断的与强者交流，甚至与弱者交流，他们会提供一些思路给你。不断的交流也会让团队变得更加巨大。


    交流就是致富的途径。'
  merge: -1
  img_proc: true
- pgno: 270
  md: '# 5、尊重商业规则，才能越走越顺


    很多刚创业的人不尊重商业的规则，这个现象在草根阶层非常严重。其实这是害人害己的行为，一旦大家都知道你不遵守商业规则了，就没人找你合作了，你的生意自然也就非常差，甚至只有倒闭了事。


    我讲四条非常重要的商业规则。


    # 第一，不可骗人。


    中国人太多，总有人抱着坑一个是一个的心态，其实一旦你开始骗人，很快就会在圈子内传开，然后你的生意就不好做了。所以承诺给客户的必须做到，不然别承诺。


    # 第二，不可违反与别人约定的合同。


    如果经常违反与合同约定的合同，后果就是你再也得不到别人的支持。信用比金钱更重要。


    # 第三，赚白钱。'
  merge: -1
  img_proc: true
- pgno: 271
  md: '什么叫白钱呢？就是与黑钱对应的钱。也就是说不可违法，必须赚正当的钱。违法了，就算赚到钱了，说不清楚哪天就进去了，显然天赖不来。


    # 第四，做一个正直、善良、智慧、诚信的人。


    如此才能成为领袖，大家才会愿意跟着你。如果你很邪恶，不讲信用，明显有真才实学的人不愿意给你卖命的。


    尊重商业规则，有可能开始的时候走得很艰难，但是长期来看，你是赚的，而且越走越顺利。


    A级的创始人吸引A级的团队成员，一个正直、善良、诚信的人当然也吸引这样的人。一个不讲商业规则的人，当然也只能吸引不讲商业规则的人。如果你不尊重商业规则，那么就只能是个下三滥，发财跟你就没什么关系了。


    # 6、以道自重的经商


    本杰明·富兰克林有一句话：“既要忠心地为公众服务，'
  merge: -1
  img_proc: true
- pgno: 272
  md: '同时又要完全地满足他们的需求，是不可能的。”

    我们对客户也是这样，既要衷心的为他服务，又要服从他的全部指示，是不可能的。


    有的客户要求得很不合理，给的钱又少，我们就不做这种生意。有的客户的要求我们达不到，但客户以为我们能达到他的要求，我们为了赚钱就答应他，这就属于欺骗，就会产生纠纷，甚至打官司。


    更可怕的，现在这个社会上的人，为了做业务，主动去欺骗客户，只要能把钱拿到手里，管他服务是什么样子呢。他们以为这样是做生意的法则，岂不知，这样做生意既害了客户，也害自己成了强盗、骗子，只能骗一票是一票，很难做大，很难做成品牌。


    我们只给客户他需要的，而不是他想要的，只给我们能力范围能做到的事情。实在不能达成一致，只有放弃合同，才是道德的。


    我们做业务，最好的干法就是不断的打广告，把我们能做的如实的阐述出去，客户看懂了，就买单，看不懂，就等他看懂了再买单。


    不要去做什么主动营销，很浪费精力的。就是一心一意的打好广告，等着顾客上门就行了。这个世界上，最优秀的公司'
  merge: -1
  img_proc: true
- pgno: 273
  md: '几乎都是这种模式。


    我描述好我的产品或者服务，我竭尽全力的把我的产品或者服务做好，你愿意买单就买，不愿意买单就算了。我不跟你多啰嗦。这也是我做生意的方式。


    我们做小公司、小业务，也是可以用这个模式的。这就是以道自重的经商，不是为了追逐利润才经商。但按照这种模式来经商，生意必然越做越好，能站着赚钱，也不会招惹很多是非，能有尊严的把钱赚到手里，这是我们读书人梦寐以求的事情。


    # 7、世界上只有最会赚钱的企业，而不会有最赚钱的行业


    很多人经营公司两三年，手上有钱了，就开始厢逦，琢磨再干点别的。很多人都会认为，自己这个行当不如别人的行当赚钱，就开始去搞别的行当的生意。


    一般的结局就是，搞别的生意由于不懂，搞了一、两年，还是赚不到钱，而自己熟悉的行当的业务也受到了拖累，赚的'
  merge: -1
  img_proc: true
- pgno: 274
  md: '也少了。


    有的老板醒悟的比较快，及时的干回了自己原来的行当，企业就稳步发展了。有的糊涂老板，直接就破产了。


    关于哪个行当赚钱的问题，有这样一句话：世界 上只有最会赚钱的企业，而不会有最赚钱的行业。


    想赚大钱，就在自己那个赚到钱的行当努力深挖就是了，或者稍微做上下游延伸。因为你熟悉这个行业，你以前有积累。我们还有一句生意经，不熟不做，隔行如隔山。其实也是这个意思。


    不过这个社会确实有天才，可以做几个不同行当的生意，而且都狠赚钱。这样的老板是百里挑一的老板，我还是劝普通老板做一辈子自己熟悉的生意，在自己熟悉的行当里不断深挖。'
  merge: -1
  img_proc: true
- pgno: 275
  md: '# 8、规模才是真正的优势


    规模才是真正的优势。想要挣大钱，就必须有规模。不管是网络上的规模，还是线下的规模。总之，我们必须想尽办法的做大规模。


    华为、阿里巴巴、京东、腾讯、顺丰，之所以有钱，就是他们的人多，他们的规模大。所以，我们必须想尽办法做大规模。


    我们要把钱分出去，依此吸引更多的人参与到我们的项目中来。我们要包产到户，如此，每个人就会拼命的干活，因为他们都是为了他们自己干活。如果他们不愿意干活了，损失最大的也是他们自己。我们必须设计一个这样的模式来盈利。


    一个企业中，我能拿走10%的利润就就行了，我不企图拿走太多的利润。我的目标是做大规模，我的目标是以剩余的90%去吸引更多的精英跟着我们一起奋斗。'
  merge: -1
  img_proc: true
- pgno: 276
  md: '一个小公司，只有10个人，就算这个公司里的所有人没日没夜的干，并且，这10个人还非常聪明，也是很难胜过一个5万人的公司的。人多力量大，不是虚假的言论。10个人，无论如何，也是不可能建设一座大桥的。只有几千人、几万人，才可能建设一座跨海的大桥。


    我认为规模是真正的优势，所以，我的一切目的，就是在盈利的情况下，不断的设计框架，设计分制制度，招聘更多的线下人员、线上人员加入我的盈利团队。


    # 要把规模做大，我们必须选择能做大规模的项目。


    有些小众项目，我们就不要选择了，因为需求小，就很难养活大的团队。我们尽量去做那种市场非常大的项目，我们尽量去做那种人类普遍需求的项目。


    如果一个项目，你看这个行业同行非常少，很可能就是这个行业的市场太小。建议你不要选择。


    一般情况下，我喜欢那些竞争激烈的行业，也就是本来就有很多人在这个行业吃饭，就说明这个行业的市场大。这种市场，就有机会做出来大规模的团队。


    一般情况下，只有规模大了，才有大钱挣。所以，我的任务，就是尽办法把规模做大。因为规模是真正的优势。'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 9、企业家要学的是帝王术


    一定要把自己的精力放到那些最能产生效益的地方。企业家、老板，是我们最应该关注的人群，他们为这个社会做了非常大的贡献，我们理应帮助他们出谋划策，帮助他们把事业做得更好。他们才能解决更多社会问题，为社会提供更多的工作岗位。


    企业家要学的是帝王术，是法家思想，是儒家思想。只有把中国的文化母体学好了，才能理解中国人，才能把生意做得更好。


    老板的脑子里，永远是团队赚钱模式，永远是打造一个强有力的组织，而不是个人英雄主义。


    现代社会，确实靠个人就能赚到几千万，因为有互联网，有投资，有金融工具，个人发家致富变得更加容易。但想要赚到大钱，还要习惯性团队奋斗，团结一切可以团结的力量，一个人始终是有缺陷的，团队就可以做到没有缺陷。'
  merge: -1
  img_proc: true
- pgno: 278
  md: '企业家要注意的就是花50%的精力招聘到优秀的人才进公司，把所有执行的事情都交给员工干。企业家应该干的就是战略，就是思考。如果习惯性的把大事、小事都自己做，非常辛苦，手底下的
    人却不知道干什么，这样的企业家就永远做不大。


    企业家最应该干的就是用人、抓住矛盾的主要方面，妥善安排大家的工作，充分发挥员工的力量，发挥职业经理人的力量，则赚钱更多，大家也更开心，大家的能力也提升了，企业也更有前途。


    # 10、没有创新，就没有经济发展


    什么是企业？企业就是社会的一个器官，企业的目的就是解决一个社会问题。你把这个社会问题解决得越好，社会就越需要你。如果有人比你解决得好，你就被淘汰了，或者，你就只能偷他解决不过来的问题去解决，或者解决他不想解决的问题。你就是一个跟随者。


    一般情况下，跟随者获得的利润都比较低。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '什么是企业家？这个问题是企业家安身立命的本职问题。搞清楚了企业家到底是什么，才知道你每天的日常工作是什么。


    为什么一个人一辈子当农民？难道他愿意当农民？为什么一个人一辈子当一个员工，难道他愿意当员工？大部分人都有梦想，但为什么梦想一直没有实现？就是因为他根本没有搞清楚他的梦想到底是什么，所以，他实际上上的工作不能帮助他实现梦想。


    1912年，也就是一百多年前，熊彼特出版了他的经济学巨著《经济发展理论》。在这本书里，他提出了“创新”和“企业家”这两个词。所以我们要谈创新，或者要谈企业家，首先要回到熊彼特。


    简单的说，企业家 = 创新，也就是说，只要你在创新，而且你的创新对社会有益，你就是一个有价值的企业家，你就必须将获得利润。如果你没有创新，你只是一个跟随者，那么，你就是一个苦力工。苦力工赚的就是苦力工人应该获得的金钱。没有创新，就没有经济发展，就不可能获得高额利润。


    比如农业社会，几千年经济也不发展，经济就是“循环流转”，刚好能循环生存就是了，形成一种不断重复的“经济均衡”。到了工业革命，创新了，就带来了经济飞速发展，一轮创新红利结束了，经济就停滞了，达到均衡；循环流转，等待下一轮'
  merge: -1
  img_proc: true
- pgno: 280
  md: '创新。


    这和我们企业经营的感受是一致的，所谓“年年难过年年过”，也没破玩，就是刚好能饱，继续过。很多企业主活得很艰辛，不是大家想象的那样，老板多么有钱。如果说企业还有一点可以投入再生产的资金，老板还能得到一点“利润”赚钱养家，那钱不是“利润”，是“管理工资”而已。


    意思就是说，你的企业赚不到钱，很简单，你没有创新，你落伍了，你跟大多数人一样，你是普通企业，所以你就赚不到钱。


    想想看还真是，一个年年难过年年过的企业，老板的收入，比大公司高管的年薪少多了，就是个管理小企业的管理工资。


    大公司的 ''${\text{高管}}$ 为什么工资高？为什么利润多？一般情况下，都是因为创新的红利。滴滴打车是创新，Facebook 是创新，饿了么是创新，微信是创新。只有创新能获得暴利。


    我们经营任何一个项目，都想尽办法做到创新。做不到全面的创新，就要做微创新，小改进。小改进多了，自然集腋成裘，积土成山，变成了大的改进，就赚大钱了。


    # 如何创新呢？


    +   一、采用一种新的产品。


    也就是说消费者还不熟悉的产品，或着一种产品的一种新的'
  merge: -1
  img_proc: true
- pgno: 281
  md: '特性。新产品就是纯粹颠覆以前的产品，比如电动剃须刀颠覆手动剃须刀。比如我们的互联网服装店颠覆线下的实体店。


    新特性，同样是杀毒软件，360免费就是价格特性的创新。


    # 二、采用一种新的生产方法。


    规模化生产相对以前的小作坊式生产、机械化生产，相对以前的人工生产，都是新的生产方式。


    # 三、开辟一个新市场。


    比如本来是夏天的菜，我们用大棚技术养到冬天来卖。


    # 四、用新材料替代旧材料，能够降低成本，甚至质量更好，也是创新。


    我觉得对于85后、90后最容易发财的，就是我们用新的科技、新的技术去做传统行业的生意。这种创新，很容易就让我们赚到钱。现在这个时间点上，只要懂得利用互联网的人，都能够赚到钱。'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# 11、移动互联网时代的经商理念


    移动互联网时代的经商理念。


    首先，你天天出现在客户面前的次数越多，占用客户的时间越长，客户的买单几率就越大。


    第二，习惯性的搞朋友圈，习惯性的发图片，习惯性的搞微博，习惯性的搞QQ空间、搞自媒体、搞视频，是新一代商人必须学会的。


    只要你每天都把我说这些玩起来，不断的去释放你的价值，你的收入就会越来越高。所有付费营销都不搞，只搞免费营销。


    第三，不仅要想尽办法去了解客户，还要想办法把自己展示在客户面前。


    把自己的所思所想、自己的一切都展示给客户，客户越了解你，买单的可能性就越大。小米，就是这个营销模式。'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# 第四，互联网时代，把中间商都砍掉就行了。


    老板亲自服务客户，老板只带领服务团队就行了。把服务做到极致，不断释放价值，形成口碑效应。只要我们把服务做到极致，我们的生意自然会越来越好。


    # 第五，现代社会，已经进入了一个价值贩销的时代，我们只贩销跟我们价值观一样的客户。


    我们一句话都不想多说，不做售前服务。售前服务好，吸引的都是屁丝，都是麻烦人，公司的成本会非常大。


    把所有精力都用来做售后服务，然后打好广告，不断的释放价值就行了。长期这样干，自然有认可你的人买单，然后你把这个客户服务好就行了。


    # 第六，不要给客户承诺什么，没什么好承诺的。


    很多人还在上一个世纪活着，他们以为他们给了几个钱，就是上帝。实际上根本不是这样的。你出钱，我出服务，大家是平等的，你想当上帝？回家去当吧。没有人搭理你的。搭理你的，也是不怎么赚钱的企业。'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# 12、不做潜力低于10个亿的生意


    一个公司做好一个业务已经不容易，做好三个业务就十分困难了，做好十个业务根本就不可能。所以我们要学会选择，学会放弃，学会集中，这其实就是企业战略的真谛。


    理解了这一点，我们就很容易给自己定下类似这样的战略原则：不做潜力低于10个亿的生意。


    我曾参加一位客户的年终战略研讨会，大家碰到这样一个问题：这位客户做的是一个行业性服务生意，已经有了上亿元的营业规模，而且在未来3～5年里，可以相对肯定地预计，这个业务每年还会30%～80%的增长空间。


    有基数较大，并且高速增长经验的经营者都知道，管理这样高速成长的企业本身就是非常具有挑战性的事情，因为你要不断地增加新人，不断地培养新人，与这些新人磨合。这个时候，企业一年内增加的新人往往是过去4～5年内招聘新人的总和。


    而相关的管理工作也比业务本身更复杂，经营者和公司其他管'
  merge: -1
  img_proc: true
- pgno: 285
  md: '理者也往往缺少应付这些事情的经验。


    在主营业务之外，这个公司还有一个软件公司。软件公司已经做了7～8年，一直是半死不活。好的年景有500万左右的收入，差的时候只有200～300万的营业额。即使是好的时候，软件公司也没有赚多少钱，当然坏的时候绝对是一个赔钱买卖。


    每个季度公司的股东和高层都要花时间讨论这个公司的业务，当然也会不断地要求兄弟公司帮助这个软件公司。例如帮助推广软件公司的产品和服务。但这些看上去应该很有效的措施一直没有奏效，软件公司一直是一个长不大软肋。现在又到了做明年战略规划的时候了。大家的问题年复一年，还是同一个：这个业务如何才能做起来？


    我给他们的建议是，不要再想这个业务如何做起来，而应想办法放弃这个业务。我的建议背后的战略原则是：不要做潜力低于10个亿的生意。


    这不是个案，而是一个非常普通的企业现象。一方面企业有很大的主营业务要经营者全力以赴，另一方面公司还有很多历史上形成的小业务要经营者操心。这样公司的经营者很容易掉入一些看上去很对，但对公司却十分有害的种种思维陷阱中。


    例如：

    这个行业是一个朝阳行业，所以我要坚持做下去。'
  merge: -1
  img_proc: true
- pgno: 286
  md: '公司其他部门挣钱很多，我们可以养活这个部门。

    这些人都是跟我一起创业的，我不能抛弃他们。

    这个部门和主营业务可以有协同效应，说不定能给我们的主营业务帮大忙。

    换个人主管，肯定能做起来。

    反正放在那里也不会牵扯多少精力。


    与这些思维陷阱相对应的事实是：


    +   1、朝阳行业未必是你应该做的，夕阳行业也未必不是你不能做的，关键在于你是否适合这件事。

    2、一个公司里的每个业务部门都应该挣钱，一个不能独立存在的业务部门是不应该存在的。

    3、经营者可以用更有效和更负责的方式帮助他们。

    4、协同效应出现的概率和沙漠中下雨的概率差不多。

    5、换一个人永远是说起来容易做起来难的事情。你又挣钱、又有发展潜力的主营业务都缺人，把有能力的人放到看不到前景的小业务里不是一种报复的想法吗？把经营者自己放过去，就是更傻的想法了。

    6、一个垄断性依存的公司高层的精力 and 注意力，永远比我们想象的要大得多，只不过我们从来真计算过而已。


    我曾看到一篇文章，它讲述了京东商城快速发展的故事。

    这个公司历史上根本性的一次转折点就是它的经营者在2006年做的一个决定：放弃当年已经有9000万元的门店业务，专做当'
  merge: -1
  img_proc: true
- pgno: 287
  md: '年仅有 2000 万元的网上商城业务。为什么选择做小的业务，不做大的业务？因为经营者看到的是三年后网上业务可以达到几个亿的规模，而门店业务不可能有这么快的增长。


    看到这个故事，以及这家企业以后的发展，我们会<|start|>叹这

    位经营者的眼光。但在我看来，至少同样重要，甚至更重要的是这个经营者的决断：只做网上业务，放弃已经规模不小的门店业务。就是这样的决断力才让这个公司有可能在短短的
    3 年多时间里，成为营业额超过 10 亿元的企业。


    一个人做好一件事已经很难容易，做好三件事就十分困难，做好十件事根本不可能。同样，一个公司做好一个业务也不容易，做好三个业务就十分困难了，做好十个业务根本不可能。所以我们要学会选择，学会放弃，学会集中精力干好一个业务。选择、放弃、集中，这其实就是企业战略的真谛。


    理解了这一点，我们就很容易给自己定下类似这样的战略原则：不做潜力低于 10 个亿的生意。如果你是小老板，你的规则可能是“不做潜力低于一百万元的生意”；如果你已经有了一些业务积累，那么我的忠告是“不做潜力低于一千万元的生意”；如果你已经是一个中型企业，切记“不要做潜力低于一个亿的生意”。当你的企业上了一个更高的台阶，你的原则可能是“不做潜力低于
    10 个亿的生意。”'
  merge: -1
  img_proc: true
- pgno: 288
  md: '只有这样不断地放弃小生意，才能不分散你的精力和注意力，你才能做大生意。战略的任务是确定什么被看做是公司的资源。什么是企业里的资源？原材料是资源，人力是资源，资金是资源，关系是资源，知识是资源，技术是资源，位置可能是资源，空间也可能是资源，管理能力、学习能力都可以是资源。对资源的认识越深，一个企业的竞争力就越强。


    从资源的角度看，老板的任务就是三个：


    +   一是确定在自己公司什么是资源；

    二是把现有的资源充分利用好；

    三是不断的为公司寻找新的资源。


    在不同的时间，这三件事的优先级是不一样的。


    总结一句，把公司的所有资源都投入到最赚钱的一个业务上，只做潜力不低于10个亿的生意。


    # 13、基业长青的方法


    企业如何基业长青？'
  merge: -1
  img_proc: true
- pgno: 289
  md: '# 首先，任何企业都是时代的企业，有些产品与服务确实会过时，但这个本质不会过时。


    比如马车虽然被汽车取代了，但出行仍然是人们的基本需求。也说说我们的企业要解决的是人类的基本需求。从这个角度出发，你的企业就会基业长青。


    你要选择一个社会问题，一个问题就是一个商业机会。这个社会问题永远也不会过时，永远都解决不完。假如这个问题解决了，那么你的企业也就没有必要存在了。


    # 第二，你必须学会用新工具去解决老问题。


    比如，要学会用互联网这个工具去解决传统企业的问题。以前我做装修的时候就用竟价去接业务，结果公司的业务就比纯电话销售时代多得多。现代社会又出现了各种手机端的渠道，也就是所谓的移动互联网，那么各位又要用这个新工具去解决以前的老问题。


    只要养成了用新工具去解决老问题的习惯，你的企业就永远不会过时。你选择为社会解决的这个问题，必须是人类永恒存在的问题。


    # 只要你问一问人类是不是永远都有这个问题，如果是永远都有，那么你就参与到这个业务中来，企业就会基业长青。


    我从来不做那些短命的项目，就算这个项目再暴利我也不'
  merge: -1
  img_proc: true
- pgno: 290
  md: '做。因为如果过几年这个社会就不需要这个项目的存在，那么我的精力就白投入了，钱可以再挣，但精力太宝贵。


    总结下来，一个企业要基业长青就需要两点，


    第一，看透了问题的本质，你解决的问题是人类永恒的需求，永远也解决不完。


    第二，紧跟时代发展的趋势，习惯性用新技术解决老问题，你就不会被时代淘汰。


    做到这两条，企业就会基业长青。我本人只做这种能永远做下去的项目，比如陈昌文读书会、陈昌文老板社群。


    # 14、干出一个强大企业的三个关键点


    干出一个强大企业的三个关键点。


    第一，精神使命。


    很多创业者创立企业的目的就是为了钱。为钱固然无可厚非，但这很难感动真正有才华的人为你卖命，就算你真正感动了几个人为你卖命，也很难持久。因为一旦赚不到钱了，大家就会觉得索然无味，就没干劲了。'
  merge: -1
  img_proc: true
- pgno: 291
  md: '刚开始创业的时候，本来就很难见到现金，如果你不宣传精神使命，只宣传赚钱的话，你这个团队很容易土崩瓦解。


    如果你运气好，能力强，一开始就赚到钱了，也会出现一个严重的问题，就是有钱了，再讲为钱奋斗，很难给团队提供足够的热情、动力与期望，甚至，你自己都没有足够的动力干下去了。


    所以，凡是高明的领导者，必须提出精神使命。

    马云讲让天下没有难做的生意，建立新商业文明，把企业干 101 年，都是这种精神使命。

    乔布斯的非凡响、与众不同、改变世界，都是这种没有钱，也要干活的精神使命。

    马化腾的连接一切，也是一种精神使命。


    精神使命能让企业的人有神圣感，能聚集真正有才华的人才在一起，也能让企业保持专注，让人保持干劲。所以，各位创业者，赶快为你的企业找一个精神使命来宣传。


    # 第二，商业使命。


    如今这个社会，是全民创业。很多人为了创业而创业，却不知道企业必须实现商业成功，才能活下去。


    企业必须推销出去一种产品或者服务，然后把钱赚回来养自己，养员工。对于广大创业者来说，推出去产品是第一要务。'
  merge: -1
  img_proc: true
- pgno: 292
  md: '就算你有风险投资，你也应该把推销出去产品、先赚到钱养活自己放到首位。最强大的企业，当然是精神使命与商业使命相结合的企业。


    # 第三，团队建设。


    我见过很多创业者，能赚钱了，但公司做了好几年也不见壮大，创始人自已带着几个人在那里干活，活生的把自己干成了一个项目经理。这样的干法又累，又赚不了多少钱。


    企业家的目标是，企业越大、团队越多，赚钱越多，工作越少。这就必须要搞团队建设，把自己解放出来。不搞团队建设的老板，是一个人在一群人竞争，百分之百会输，不输也累死。


    如果你想干出一个强大的企业，抓这三个点就行了。第一，精神使命。第二，商业使命。第三，团队建设。


    # 15、创业是一种信仰


    很多人都想成为影响世界的人，他们拼命的卖产品，卖解'
  merge: -1
  img_proc: true
- pgno: 293
  md: '解决方案，打造品牌，最后，不过是一个老板、一个企业家而已，能赚钱，但是对那些胸怀大志的人来说，远远不够，可以说壮志未酬。


    我本是想成为领袖级人物的人，所以我不断的研究、找方法。我佩服的人包括佛祖、孔子、穆罕默德、乔布斯等等。这些人明显是卖思想、卖文化、卖信仰的。


    孔子卖的是，明知其不可为而为之；佛祖卖的是信仰，信我就会到西方极乐世界；乔布斯呢？如果乔布斯把自己定位成卖电脑的，“苹果”本来也就是个电脑公司，大不如微软跟戴尔电脑一样，但为什么乔布斯改变了这个世界，让很多人为其疯狂？


    人们不会为戴尔电脑排着长队通宵达旦的等，人们也不会为了惠普电脑通宵达旦的等，人们不会为了三星手机通宵达旦的等，但人们会为了苹果的产品通宵达旦的等！


    这个地方有一个本质的区别，这些通宵达旦等的人，一定不是为了买电脑、手机，而是为信仰、理念、理念，为乔布斯的精神买单。


    所以，我认为乔布斯也如同孔子、佛祖一样，他卖的不是产品，不是解决方案，而是信仰、理念、信念，比如那句广告词，'
  merge: -1
  img_proc: true
- pgno: 294
  md: '做你从未做过的事。


    向那些疯狂的人致敬，他们特立独行，他们桀骜不驯，他们“惹是生非”，他们格格不入，他们用与众不同的眼光看待事物，他们不喜欢墨守成规，他们也不愿安于现状。


    你可以赞美他们、引用他们、反对他们、质疑他们，颂扬或是诋毁他们，但唯独不能漠视他们，因为他们改变了事物。他们发明、他们想象、他们治愈、他们探索、他们创造、他们启迪，他们推动人类向前发展。也许，他们必需变疯狂。


    你能盯着白纸，就看到美妙的画作吗？你能静静坐着，就能听见美妙的歌曲吗？你能凝视火星，就想到神奇的太空轮吗？我们为这些人制造良机。或许他们是别人眼里的疯子，但他们却是我们眼中的天才。因为只有那些疯狂到以为自己能够改变世界的人，才能真正地改变世界。


    乔布斯卖的是改变世界，卖的是非同凡响，与众不同。他是一个疯子，所以，他是伟大的企业领袖。


    由此，我得出结论，我们如果仅仅是卖产品，是不可能成为伟大的企业家领袖的。


    我们若是想成为领袖级别的人物，从今过后，别卖产品，别卖技术了，甚至别卖解决方案，因为解决方案，大不了塑造'
  merge: -1
  img_proc: true
- pgno: 295
  md: '一个品牌，多赚点钱而已。


    要卖信仰，卖信心，卖理想，卖希望，卖未来。然后，产品的事、技术的事，交给你的下属、同事去完成就行了。你若是有理想，有信仰，有希望，那么技术的事、产品的事自然有人给你做好，这其实是唐僧的玩法，也是荣荣江宋公明的玩法，也是刘备的玩法。


    对于我来说，创业是一种信仰。


    # 16、如何获得长期收益


    这个世界赚钱的模式千奇百怪。有的人用体力，有的人用技术，有的人用企业，有的人用头脑赚钱。而有的人，直接用资本赚钱，也就是钱赚钱。


    最高级的模式，当然是钱赚钱。比如把钱贷出去，然后收利息。银行就是这种模式。


    稍微低级一点的人，比如，在上海这种大城市投资房地产的人，这样的人不必工作，因为钱在为其工作。'
  merge: -1
  img_proc: true
- pgno: 296
  md: '每个在财富路上狂奔的人，最终目标都是赚钱钱，然后成立基金公司、投资公司。所以，我建议有志于成为富豪的人要学习投资学的內容。


    大部分小老板只是为自己工作而已，招聘过来的员工只能算是帮手。如果自己不在公司工作，那么公司就很难保持持续盈利。而真正赚钱的老板就算自己离开了企业，企业也会盈利，甚至盈利能力更强。


    因为真正的老板是建立一个系统，让别人为自己工作。真正的老板要习惯雇佣比自己厉害的人，到自己的企业工作。甚至最优秀的企业家是雇佣投资人的。


    我以前的思想比较狭隘，总是看不起普通员工，看不起项目经理、小老板。今天，我知道这种思想是错误的，一个真正的老板，必须要会雇佣所有层次的人，就是能让普通员工、小老板、项目经理、企业家、投资人，都为你服务，为你工作。你必须要爱护地大妈、前台、你的项目经理、CEO、你的银行服务人员、你的客户。


    获取财富的秘诀就是获取别人的时间 + 别人的金钱。免费游戏、免费聊微信，就是通过获取人们的时间来赚钱的。比如，你免费看电视，那么别人就通过卖广告赚钱。互联网公司赚钱的不二法宝就是免费
    + 补贴。'
  merge: -1
  img_proc: true
- pgno: 297
  md: '能利用别人时间与金钱的人，就是富人。创业者要建立一个能利用别人时间的企业，而不是只知道自己在那里死磕的企业。自己死磕确实能赚钱，但有限制。比如，不工作了，就没钱赚了。


    使用别人的才能与时间，才能获得长期收益。专家的下场是工作得越出色，越需要长时间的工作与奋斗。比如，一个医术高明的医生，可能会更加辛累，因为需要他的人越来越多。


    聪明的企业家，要习惯性的扩大企业系统，并雇用更多的人。要让自己的工作越来越少，挣的钱越来越多，享受的时间越来越自由。


    我本人只管我想上的事情，方法论的事情也只管一点点，其他的由我的兄弟姐妹们搞定。所以，我有更多的时间做其他的事情。


    改变思维方式，赚钱会变得非常容易，特别是对很多优秀的职业经理人与小老板来说，唯一要做的就是改变思维方式。为什么有些人很少工作，却能挣很多钱？而且时间自由？思维方式不同而已。


    大部分富人的收入来自投资与企业系统。工作的目标显然是为了自由，而不是被工作捆绑一辈子。'
  merge: -1
  img_proc: true
- pgno: 298
  md: '# 17、不要让投资变成亏钱的游戏


    对于大多数人来讲，是没有办法进入专业的投资机构去训练自己的投资头脑的，也没有办法接触到很多可以投资的项目、投资的企业，或者可以投资的创始人。


    投资这个游戏，是最高端的赚钱游戏。于是，这个游戏也是最赚钱的游戏。对于不理解投资这门商业活动的人，就成为亏钱最厉害的游戏了。


    有些拆迁户，或者是某些原因获得一大笔钱的人，想进入投资这个领域，想靠投资赚钱，于是去买了各种股票、债券。这无疑是最愚蠢的投资。为什么这么说？因为这些东西都是高手玩的，甚至是内部人玩的，不是一般人可以玩得的。智力不够、财力也不够，故而叫做散户，说白了，就是让人宰的。


    假如你真有雄心进入投资这个领域，你是要经过很多困难的，也是要磨炼一番的。'
  merge: -1
  img_proc: true
- pgno: 299
  md: '我给大家最快捷的投资路线，这条路线就是创业，就是打造团队，随着你把企业做起来了，你招聘了一些员工，你有一些合伙人，你能把一个企业经营好，你自然就知道哪些人是可用之人，哪些人只能打工，只能当职业经理人，哪些人有创业的才华。


    当我们的公司里有创业才华的人的时候，我们就可以在我们的业务周边找一个项目，就是上下游业务，把这个业务挑选一个出来，大家对这个项目熟悉，你对这个项目熟悉，你又对你带的人有信心，这时候，你就可以投资一个新公司了。


    甚至，你不愿意找上下游业务，就直接开个分公司，只不过，这时候，你要把这个有创业才华的人弄成法人代表，让他去创业就行了。你提供资金、智力上的支持就行了，看他能把公司做成什么样。


    这种模式，一般都不会亏，都会做起来。慢慢的，把自己的股份减持到一个普通财务投资人的份额就行了。这种做投资的方法看似慢，实际上是最快的。


    世界上没有捷径，想走捷径的人都会竹篮打水一场空。只有踏踏实实的一步一个脚印，才能真正做好投资。


    一个投资人，必须对你投的人了解，你投的项目了解，你投的团队了解。假如你都不了解，你就跟着感觉投资，有没有'
  merge: -1
  img_proc: true
- pgno: 300
  md: '赚钱的可能？不错，是有，但是我只能说，这种事情只能发生在别人身上，很难发生在你身上。


    现在有很多人非常奇怪，投资这种事，他们居然委托外面那些大学刚毕业、啥都不懂的人来帮他们做决定。那些抠地铁、挤公交、吃盒饭，完全是非常穷的阶层，他们哪里懂得什么叫投资。


    一个人能帮你做投资决策，这个人必须是企业家。其他任何人，都没有资格帮你做投资决策。


    还在犯这种傻的人，赶快停下来。


    # 18、我的投资策略


    我虽然喜欢创业，我也舍得吃苦，但我更喜欢投资。毕竟，创业是自己千辛万苦挣钱，而投资是出智慧，通过各种手段驱动别人帮我们赚钱，属于赚钱钱、心赚钱的境界，且能同时操作很多个自己喜欢的项目。


    我做投资，只投资自己熟悉的人、熟悉的项目。一般情况'
  merge: -1
  img_proc: true
- pgno: 301
  md: '下，是在公司内部裂变。我会找我们公司内部想创业的人，或者我认识的想创业的人，然后鼓动其中我认为有能力的人创业。聚集 10 个想创业的人，然后开始凑钱。


    比如，这个项目要投资 200 万。那么，我出 100 万占 50% 的股份，通常我参与董事会，参与指导与顾问的作用。他们几个人要出 100W 占 50% 的股份。


    由于现在是他们自己创业了，不再是我的员工，我跟他们平起平坐，所以，我也不用给他们发工资了，而且他们自己拿钱出来占股份，晚上我也不用求他们加班了，他们自己主动就加班了，周六周日也来办公室工作了，花钱也知道节约了。


    本来他们是我的员工的时候，就能为公司赚钱，现在分出去一个项目，还是他们这帮人，并且比以前努力了，项目 100% 更赚钱。我这种投资方法是稳赚不赔的。


    我从来不选择不愿意出钱的人做项目带头人。只要不愿意出钱，就是骗子。只有出钱的带头人，才会尽心尽力。

    在项目分红的时候，分红最多的是项目带头人，我只做分红第二多的人，就算是我投的钱最多，我也做分红第二多的人，把分红让一部分给带头人。如此，项目带头人就会全把自己当老板了，我就跟着捡钱。这就是我的投资策略。'
