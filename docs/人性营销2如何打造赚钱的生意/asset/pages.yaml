  md: '我认为，这才是创业，做企业的最佳路径。啥也别想，把一个小问题解决到了极致，然后根据自己的实力去整合上下游，我们自然就成功了。若是一开始就想玩把大的，这个人基本就是中了某些毒，等待他的只有失败。


    # 11、我的创业赚钱逻辑


