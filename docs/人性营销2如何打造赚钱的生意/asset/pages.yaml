  img_proc: true
- pgno: 135
  md: '你会爱上学习的，因为你会发现知识真的是可以变成现金的。你会成为一个行业的专家，成为一个行业的权威，到这一步，你就能够赚很多钱了。


    第五，传承。

    等你成了权威，成了专家，有产品、有服务卖的时候，你慢慢的就会积累很大的数据库，就会有重复消费。如果你的服务做得好，你的客户就会传播你，就会有更多的人来买单。我做生意，就经常有客户介绍客户给我，然后我就能够赚到更多的钱。


    第六，耐心。

    持续不断的对一个项目深入研究，做得时间越长，你就会发现这个行业里客户的优势。慢慢的，你就会筛选客户了，只做优质客户，你就更能赚钱了。


    很多赚钱的秘密，是你需要在这个行业待上两、三年才能发现的。如果你没有什么耐心，是很难在一个行业里生根发芽的。当你在一个行业里生根发芽了，就有了门槛，别人就是看到你赚钱也学不去了。


    第七，带着经验。

    你在一个行业久了，才能带出来团队，才能带出来组织。每个经商的人都明白，每个项目，都有每个项目的特殊性，隔行如隔山，说的就是这个意思。'
  merge: -1
  img_proc: true
- pgno: 136
  md: '你从其他地方招聘过来的高管为什么不好使？就是因为这个高管没有跟著你从开始经历过这个行业，他在这个行业的时间沉淀不够，他就只能是一个摆设，没有多大用处。


    真正的人才，还必须得在这个项目上，从小做到大，因为人才也是环境的产物。你从外面招聘过来的高管，做其他项目是人才，做这个项目未必是人才，所以，人才一般都要我们自己培养。


    # 第八，形成品牌。


    时间长了，有了团队，你服务又做得好，就会形成一个品牌。

    有了品牌，那么你收入就会更高了。这个阶段，一般要在网络上混上3到5年，才会有个初级的效果。


    这八个步骤，你都按部就班的完成了，那么你也就财务自由了。这个时间也不会太长，只要项目选对了，就是三、五年，足够了。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '# 2、赚钱的思维习惯


    第一，要敢于消费。


    没错，赚钱首先要敢于消费，比如，你想报某个学习班，你直接付钱就行了。比如，你想买个苹果手机，你直接付钱就行了。


    你习惯了消费，你就想，没钱了怎么办？这就会不断的刺激你赚更多的钱。不敢消费，把钱存银行，钱只会贬值，而且不能刺激你必须赚钱的欲望。


    第二，要控制自己不要乱花钱。


    敢于消费，并不是让你乱花钱。投资大脑的钱不是乱花钱，投资自己必须要穿的衣服不是乱花钱。必需品买的比较贵没关系，但千万不要花钱买一些非必需品。穷人有一个毛病，就是该花大价钱买的东西，不买；不该花大价钱买的便宜货，却买了很多。'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 第三，要习惯性的找一帮人来帮你干活。


    别人能干的话，自己不要去干。把时间、精力投入到别人不能替代你的工作上面。只做关键性的工作，你的收入就会越来越高。


    # 第四，在一个地方赚到钱了，就一直用老方法、老套路在这个地方赚钱。


    不要认为还有其他更好的方法、更好的项目。换来换去，你就会发现你把自己弄得不赚钱了。


    # 第五，永远不要去仇恨你的竞争对手，甚至永远不要去报复任何人。


    因为这除了浪费时间以外，你什么也得不到。现代社会是有法律的，如果你控制不了自己，出现了一些过激行为，你是会受到法律制裁的。我们的做法很简单，就是把所有的精力投入到自己的业务上，让自己赚到更多的钱。


    # 第六，投资大脑。


    你能赚到钱，不是因为你有钱，而是因为你的头脑越来越聪明，这就需要你不断的投资自己的大脑。钱是不会赚钱的，只有有本事的人才会赚钱。


    # 第七，习惯性的小笔投资，甚至找零成本的项目来做。


    其实这个社会上有很多小投入、高产出的生意，只要你找，'
  merge: -1
  img_proc: true
- pgno: 139
  md: '你就能找到这样的生意。小笔投资，亏了也亏得起，而且东山再起比较容易，还可以积累到很多赚钱的经验。而没有什么生意经验的人，只要是大额投资，基本都会亏本的。


    # 3、赚钱心法六条


    赚钱心法六条。


    # 第一，找圈子，长见识。


    假如你非常穷，不知道怎么赚钱，这个时候，你就必须到处找那些能赚钱的人，花钱也要进入那些能赚钱的圈子，去看，去思考，去想。这个时候增长见识非常重要的。


    人首先要有见识，才能有方向，有了正确的方向，果断的、持续不断的干，才能有钱。


    # 第二，加大做流量的力度。


    假如你已经找到一个项目，这个项目能赚钱，这个时候，你就要加大推广，加大引流，继续做好软文，搞好成交，一心一意的做业务，砍掉其他跟做业务无关的事情。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# 第三，养团队。


    只要能养得起人了，就招聘养人，人是慢慢养出来的。时间长了，也就能养出来一个赚钱的团队了。


    # 第四，不建议刚上赚钱道路的人搞付费推广。


    付费推广水很深，要有老手带才能赚钱。需要有责任的人，要有会计算投入产出比的人，才能带着你赚钱。


    # 第五，建议老板天天都要研究免费推广模式。


    把自己打造成免费推广的专家，每天都在出单，每天都在赚钱。就算招聘过来的员工都不给你赚钱，你也养得起，那么你开公司、做团队就没有什么压力，玩上一年，你也就知道如何做公司了。


    # 第六，做文化项目，做人的精神类项目、娱乐项目。这些项目，才是最赚钱的。


    物质性的项目，在当前的社会环境下，都很难赚大钱。利润太低的生意碰也不要碰。薄利多销基本是一个陷阱，不要听信。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# 4、在互联网上“收钱”的九个步骤


    如何在互联网上收钱？


    大家看我的用词，我们不说赚钱，而是用收钱，意思就是钱是收来的，不是想尽办法挣来的，甚至是别人主动送我们的。我们的所有动作都是让别人主动送钱给我们，然后我们直接收钱就<|message|>了。


    这一点要大家领悟了才能明白其中的奥妙。


    # 一、每天大量释放有价值的软文、视频。


    自媒体平台都去做起来，要原创。你原创的内容越多，你越赚钱。


    一个习惯性写作的人，只要写得够多，你的营销理念自然会寻找很多愿意付费给你的这一点。


    每天五万字，是一个互联网写手的起码修养。


    # 二、复制编辑优化。


    假如你的写作能力太差，你可以去稿贴吧等这些地方的软'
  merge: -1
  img_proc: true
- pgno: 142
  md: '文，只需要复制或者杂交改编一下，变成你自己的，到处去扔就就行了。


    # 三、引流到微信成交。


    吸引到流量多了，你就有机会收到钱。建议大家把流量都引到微信上面，微信上面成交率非常高。很多人都在用微信付费，也非常方便。


    # 四、微信上每天要更新一百条朋友圈。


    建议你多拍生活照片、视频，建议你多发与客户的聊天截图，还有你的服务截图，后面植入广告，植入客户想要知道的信息。释放的多了，客户就自动付款了。


    # 五、永远不要给客户承诺什么，永远不要陪客户聊天。


    一则是我们的时间宝贵；二则是承诺的多了，就成了骗人的。社会上的人多得不得了，养成习惯；永远是找下一个一个人。


    放心吧，只要你每天工作十六个小时，搞网络营销、搞文化营销、搞虚拟化的项目营销，你的月收入非常容易突破20W+，这是个人搞微信营销的情况。


    # 六、你若是有能力，手上也有钱，就立刻组织十个人，这十个人都是你的员工。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '# 七、做自媒体，只摘手机端的流量。


    可以出书，可以搞网络直播营销，这个模式搞起来，赚钱不是什么难事。移动互联网是我们的福利，所有人都要注意了，都来玩内容营销赚钱流行了。


    # 八、永远不违法，只收客户主动给的钱。自己是做什么的，就说自己是做什么的，就行了。


    # 九、竭尽全力营销富人，做老板的生意，不要做没有钱的人的生意。


    # 5、做网络项目初期把握好这六个方面


    # 第一，选一个市场非常大的项目。


    我选项目的方法，就是这个项目有人能赚到10个亿，我才去做。市场容量小，就说明这个项目天花板低，就算你再努力也赚不了大钱，小河里永远捞不出大螃蟹。


    # 第二，这个项目必须具有文化附加值，必须有高溢价。我'
  merge: -1
  img_proc: true
- pgno: 144
  md: '最喜欢做文化项目。


    第三，起手都搞免费推广，不搞付费推广。

    等到赚了非常多的钱，再来养付费推广团队。免费推广的模式特别是手机端的直播平台，大家一定要重视，流量非常大。


    第四，只做富人的生意，只做中产阶级以上的生意，只做先收钱的生意，淘通过成本太大的生意我们都不碰。我们最看重的是时间成本与精力成本。


    第五，不要招聘员工来创业、来做一个新项目。一个员工之所以是员工，就是他没有这么能力，他根本不可能从零到一。

    从零到一这个过程，只有合伙人、只有创业者能完成。本质上，一个公司优秀，就是老板优秀，项目能成功，几乎 80% 靠老板本人。所以，凡是有退缩心理的人，不管是在网络上，还是在现实中，都不适合创业。


    第六，找到 100 个同行，在里面挑出来 5 个同行，直接复制、抄袭他们的文案、图片，推广起来赚钱就行了。千万别去花大量 的精力做网站。


    我有个学员，打造了一个 20 人的团队，做了一个相关网站，几百万元花光了，一分钱没赚。这就属于搞错方向了。创业最重要的方向是推广 + 收钱 + 做服务。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '做一个漂亮的网站，甚至打造团队，在初期都是没意义，而且消费非常大的事情。现代社会，做企业根本不需要网站了，用QQ、微信、微店、微博就可以赚大钱了。利用直播平台、自媒体，年赚千万的人非常多。


    # 6、网络营销八大要素


    如何搞网络营销？


    +   一、我们做任何项目都必须以一句话表达出来我们到底是卖什么的。


    二、我们必须通过一篇 fuel文章、一个广告，表达出来客户购买这个产品或服务的理由，这个理由必须具有说服力，就是客户想要的东西。


    三、确保我们讲话、写文章谁都听得懂，语义要简洁，不要以为自己有文化就弄很多成语，这是愚蠢的行为。实际上社会上很多人是听不懂成语的，就算你有博士生的水平，发挥出来初中生的水平就行了。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 四、现代社会要重视移动端 App 的流量。


    我的业务在移动端赚的钱都比 PC 端多。


    # 五、能赚钱的渠道很多，挑出来 5 个最赚钱的渠道，多招聘一点人去搞流量，搞成交。


    # 六、现代社会就是一篇文章、一个视频、一个语音就能赚钱。


    现在很多 95 后、00 后，因为紧跟时代的步伐，一个月都能赚到 50 万以上。其实这样的人不在少数，只是传统企业的人认为这不可能，认为这太夸张了。其实是这些人落后了而已。


    # 七、养成为零成本项目，玩轻资产的习惯。


    现代社会是用智慧赚钱的时代，是用互联网思维赚钱的时代。赚钱已经不需要资本了，有一个手机就行了，赚线已经不需要经验，甚至技术了。这些基础的设施早就有人帮我们做好了。也就是说互联网营销已经进入了一个纯粹靠思维就能赚钱的时代了。


    # 八、一定要团队作战，一个人的力量是有限的，所做的事 情也是有限的，多些人分工合作，既能锻炼自己带团队的能力，也能紧跟时代的步伐。过了从零到一的摸索阶段，就要组建团队。


    以后的社会就是快鱼吃慢鱼的社会，就看谁的速度快，谁就能在互联网上赚到钱。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# 7、做自媒体的六条注意事项


    如何做自媒体爆营销？


    第一，自己的品牌名一定要是简单好记的中文。


    不要用英文，也不要用数字，因为大家记不住。我们知道的非常好的品牌名，比如苹果、比如老干妈、比如巨人集团，都是非常好用的中文短语。只有当别人记住我们的时候，人们才会买我们的产品。


    第二，在互联网上发文章、视频，引导别人如何找到我们，引导别人如何注意我们，引导别人搜索我们，加我们的微信。


    你不引导你的粉丝，你的粉丝永远不会加你的微信与QQ号。你的每个发声渠道都要加上自己的姓名。最大的品牌，就是你的名字。


    第三，做电商、做微商，都是做搜索，所以，你最好学习一下 seo 的基本概念，知道什么叫长尾关键词，什么是转化关键词，什么是泛词。搞清楚什么叫全网营销。'
  merge: -1
  img_proc: true
- pgno: 148
  md: '如果你连这些概念都搞不懂，那么想在互联网上赚钱，也就难了。赚钱首先要学习，对广大普通老百姓来说，学习是我们致富的唯一出路。


    # 第四，做电商、做微商、不要怕别人骂。


    很多人非常怕别人骂传销、骂骗子，其实，你去查一查，那些名人，天天都有人骂，各种难听的词语都在他们头上。


    一般情况下，喜欢骂人的都是非常穷的人。我们不要在意他们，我们赚我们的钱，努力干我们自己的业务就行了。不要活在别人的意志里，只管自己的工作。


    # 第五，凡是在朋友圈黑你的，凡是不断抨击你麻烦的人、浪费你时间的人，直接拉黑就是行了。


    啥也不管，直接拉黑，拒绝掉98%的人，赢得2%的人，我们就成功了。想要赢得大多数人都喜欢你的后果，就是没有任何人喜欢你。


    # 第六，每天都要写一篇文章发出去，每天都要搞很多文字与粉丝互动。


    文章里一定要用你的真名。如果你不担心粉丝乱评论的话，一定要开评论。很多明星被粉丝骂，他们依然开评论，因为你越骂他，他越火。普通人怕别人骂，而有钱人，根本不在乎被骂，甚至喜欢被骂。因为骂他，也是在传播他的名声。名声大了，自然就赚钱了。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# 8、微微商、电商的四个法则


    做微商、电商的四个法则。


    1、必须把自己打造成为正能量的人。


    为什么？大家都看过电影吗？你是喜欢里面最好的人？还是喜欢里面最坏的人？答案不言而喻。大多数人都是喜欢里面最好的人。


    现实生活中也一样，你把自己打造成为最有正能量的人，并且把自己销售出去，你就是最受欢迎的人。既然你最受欢迎，你卖产品、卖服务，买单的人自然就多了。


    我们搞网络营销，做微商、做电商，也必须聪明的把自己打造成为这样的人。不是你愿意不愿意，而是为了生意好，你必须这样。


    2、赚钱就是简单的事情重复做，这是天道。


    水滴石穿，就是一滴水对着一块石头重复的做。我们卖'
  merge: -1
  img_proc: true
- pgno: 150
  md: '何一个产品，都是如此，你必须天天卖。用微信卖、用微博卖、用抖音卖、用QQ空间，千万不要几个月不赚钱就放弃了。一

    直于，干两年，你就算再白痴，也总结了一些经验，积累了一些客户，你也就慢慢的开始赚钱了。


    可惜水滴石穿的道理很简单，能做到的没几个。


    # 3、先让别人信任我们，再卖东西。


    如何让别人信任我们呢？在微信、QQ空间、微博里上自己真实的头像，上自己真实的视频，也可以写一些人生感悟，也可以发表一些参加活动的照片。


    你这个人要立体丰富的表现在朋友圈与QQ空间，大家才信任你。有精力与大家互动，就要经常互动，所以我现在非常推荐大家做网络直播。先交朋友，再卖产品，就容易多了。如果

    你不跟大家交朋友，只想卖自己的产品，那么你这个产品可能就不好卖了。


    其实直卖产品，最不重要。最重要的就是你天天都在与大家交朋友，你天天都在与大家互动。然后你只需要不经意的推一推你的产品，自然就有人买单了，而且成交率还蛮高。

    有的笨蛋，见谁都是直接发广告，别人就把他拉黑了，鬼才愿意买他的产品。这就是先做人，再赚钱的道理。


