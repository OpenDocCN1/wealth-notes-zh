- pgno: 78
  md: '建立人与人之间的连接是自媒体人每天都应该做的事情，也是互联网的本质。而建立人与人之间连接的成本，已经降到了历史最低。不断的分享、不断的聚粉丝、不断的做营销，就能挣钱。这就是这个伟大的互联网时代的挣钱逻辑。


    # 2、我对这个时代的认识


