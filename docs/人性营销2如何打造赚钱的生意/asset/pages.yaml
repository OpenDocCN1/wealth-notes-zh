    其实微信刚出来的时候，我就知道了。我也知道有老板靠微信赚钱。但当时我不够主动，甚至还骂别人是骗子。现在我也靠个微信赚钱的时候，我想想都脸红，都后悔，就因为当初不主动，错过的财富何止几百万，简直就是活谥了人生。


    **我们把知识分享给别人，也是一个主动的过程。如果我们不分享，那么我们的名气就不会越来越大。分享的人，看似没什么收获，其实收获了名气，而名气与金钱是可以相互转化的。**


    学习也是这样，你不主动去学习，没有人对你有办法，也没有人有闲心来教你。只有你自己愿意主动去学习的时候，你的智力才会增加，你的财商才会增加。这些东西增加了，你才能有事业。


    **如果你不主动，社会的精彩跟你就没有关系。如果你非常主动，那么你就绝不可能混得很差。**


    我们公司一个小伙子，本来没什么能力，我做了一个新项目，开会的时候，在公司里面，谁愿意来当负责人？很多人都不敢说话，因为怕亏损，怕老板我麻烦。但有一个刚毕业的小伙子说他来负责。'
  merge: -1
  img_proc: true
- pgno: 167
  md: '我明显知道他的能力是不够的，但还是任命了他，因为他主动。他为自己争取到了一个锻炼的机会，他比那些工作了几年的intro人跑得更快，晋升得更快。


    大家好好想想，淘宝来的时候，你主动玩淘宝了吗？微信来的时候，你主动玩微商了吗？手机上，其实还有很多可以赚钱的 APP，你主动利用哪些自媒体赚钱了？你主动利用微博赚钱了吗？


    如果这些你都认为跟你无关，那么不是这个时代淘汰了你，而是你选择了被这个时代淘汰。


    记住，只有主动才能创造一切，没有人会逼迫你富起来，主动的人只顾自己赚钱而已。你不主动，剩下的只有贫穷与孤独。

    或许你叫这个是孤芳自赏，但这毫无意义。


    # 18、公司以商业为导向，而不是以技术为导向


    以前有段时间，我一直在强调我们公司要以技术为驱动，'
  merge: -1
  img_proc: true
- pgno: 168
  md: '要有好的推广技术、好的软件技术、好的 seo、sem 技术，后来，我发现技术是一个重要手段，但不应该是我们公司的核心追求。


    公司的核心追求应该是满足客户需求。不管是人事部、后勤部，还是销售部、推广部，还是客服部门，都要完全以商业为导向，而不能以技术为导向。


    我们给员工发奖金，评判他的工资等级，也应该按技术，而应该该他为公司赚了多少钱，为客户做出了多大的贡献。


    你的技术再好，网页做得再漂亮，但是没有营销思路，没有策划思维，做出来的东西没人买，公司就是死路一条。假如你根本没什么技术，你做的网页也不好看，甚至不太美观，但是你直接满足了客户的需求，为客户做出了贡献，客户买单了，就算你为公司做出贡献了，我们就给予加薪、奖励。


    # 互联网时代，精英主义已经不适用了。


    什么叫精英主义？比如，微软编辑的那个帮助文档，就是精英主义，普通人很难看懂。而 360 杀毒软件就是两个三个很简单的杀毒按钮，用户很容易就能看懂了，这就是互联网思维，这就是纯粹按用户需求做事。


    什么叫按用户需求？假如你是做新闻发布的，用户几点有时时间，你就应该几点发布新闻，让用户去看。比如，早上下饭的时候、中午吃饭的时候、晚上休息的时候，你就应该发布新'
  merge: -1
  img_proc: true
- pgno: 169
  md: '闻给用户看。


    什么叫自以为是？就是用户已经睡着了，你还在那里试图跟用户沟通，这就是盲目的工作。


    什么叫精英主义？就是习惯性的去教育用户，想让用户按照自己的套路来行动。传统企业最喜欢这样子，他们现在在我这一代互联网人的面前衰落了。


    什么叫以客户为中心？就是天天去调查客户，然后完全根据客户的需求制定产品与服务。史玉柱卖脑白金的时候，就完全体现了这种思想。先是不断的与老头、老太太聊天，知道他们是需要保健品的，就是自己不舍得花钱买。不舍得花钱买，史玉柱就托他们的子女买。这就是完全从客户需求的角度出发，自然就很成功。


    我想，有一定阅历的商人，都iaux过以自我为中心的岁月，也经历过完全以客户为中心的岁月。如果你不以客户为中心，你创业就不会成功，根本就成不了个商人。但成功后后，可能自我膨胀，以为自己可以主导客户，生意就会陷入衰落。有人及时调整过来了，又开始走上坡路；有的人没有调整过来，就继续衰败或者死亡。


    福特先生非常喜欢自己的 T 型车，以至于这种车根本就卖'
  merge: -1
  img_proc: true
- pgno: 170
  md: '不出去，他还在生产，后果就是10亿美元几乎花光了。后来他的接班人又按照市场需求去生产汽车，福特汽车又迎来了辉煌。


    几乎可以肯定的说，你的生意惨淡，就是因为你没有按照顾客需求做事。你只要真正按照顾客需求做了，你的生意必定红红火火，所以请完全按照客户的需求行动!


    # 19、一切想法以客户的需求为基础


    出单，就是满足客户的需求。怎么才能出单呢？这是很多人日日夜想的问题。很多人都以为自己竭尽全力的做到足够好，把自己想做的事情做到极致了就行了。很多人也是这么做的，他们说，这就是求道。


    有的人求道，获得了富贵，那是因为他们的道，跟客户的需求是重合的。有的人求道，清淡了一辈子，甚至饿死了。这样的人不在少数，比如颜回，就是饿死的。历史上、商业场上，有很多人都是这个死法。他们觉得社会不公平，自己做了这么大的努力，居然不能出单，挣的钱也很少，甚至越来越少，他'
  merge: -1
  img_proc: true
- pgno: 171
  md: '们觉得这个社会对他们不公平。


    一个人做出来的产品有人买单，就说明他抓住了社会需求，这就是对的。


    如果满足别人需求是错的，难道不满足别人的需求是对的？你有什么义务教育顾客？你凭什么让顾客尊重你的道德？满足别人的的人性，别人就愿意付费，我们就能出单。其实是皆大喜欢的事情。很多人喜欢讲道德，其实道德本身就是利益分配方案罢了。


    你想通过讲道德让别人放弃利益？首先，你自己就不道德，因为你的道德是牺牲别人真金白银的利益获取的。我们这里只讲商业，只讲出单，所谓出单，就是踏踏实实的满足客户想要的，只要不违法犯罪就行了。客户要什么，我们给他什么，就对了。


    很多人不能出单，就是因为他内心给自己设定了一个莫名其妙的道德，必须按照自己的想法来做产品，还希望顾客为他的情怀、为他的想法买单，这简直就是愚蠢。


    出单，就是研究顾客的真实需求，然后直接告诉顾客，你的产品能满足他的真实需求就完成了。不要有自己的想法，一切想法以客户的需求为基端。那么，你的生意就会越做越好。'
  merge: -1
  img_proc: true
- pgno: 172
  md: '# 20、客户的需求才是我们的指南针


    对于很多企业家或者是初级创业者来说，都想知道策略是什么？要么买了很多书籍，要么在网络上搜索高人的视频，要么进入 MBA 里去学什么 Debugging。学来学去，以为自己懂了很多，其实啥也没懂。可以说，大部分人理解的策略，只是自娱自乐，自己有点优越感而已。


    策略并非神祕。策略就是做好一件小事，而这件小事顾客需要。把这一件小事做到极致，用自己的资源把这一件小事做好过后，客户选择我们的服务与产品。


    你只需要做好现在手上的工作，能赚到钱，然后把这个工作不断的优化，赚到更多的钱，把生意做得更大，随着客户的需求跑就行了。根本不需要谈什么策略。


    客户的需求才是我们的指南针。只要大方向没错，顾客永远有需求，我们又有能力去满足他，我们就能对症需求的产品或'
  merge: -1
  img_proc: true
- pgno: 173
  md: '者服务做好就就行了。这就是战略。


    买几本书，到大学里去学什么战略学，简直就是纸上谈兵，娱乐自己。


    我以前是什么书都看，什么人的课都听。自从自己干了企业过后，我发现理论派讲的理论推起来真是完美，可惜在现实社会中，根本就不能用。所以，现在，只要发现对方不是实战派，我就不听他的任何东西了。


    实战派与理论派有一个明显的区别，就是实战派的东西特别浅显易懂，以至于根本就不登大雅之堂，没办法写成书，也没办法搞演讲。因为大家会认为实战派没知识，没文化，甚至没智商。


    而没有实战经验的人，搞的理论，那听起来，就天花乱坠，引人入胜，高深莫测。一般人的智力听不悟，必须要不断的做笔记，课后还要复习这个笔记，要没日没夜的研究他的这个理论，才能让人一知半解。


    战略不过是你选择一个具体的产品或者服务，然后把这个产品或者服务做到极致，把顾客服务好，赚到钱。'
  merge: -1
  img_proc: true
- pgno: 174
  md: '# 21、商人的天职就是赚钱


    经商时间长了，起起落落，收入有高有低。讲过情怀，也讲过现实。刚创业的时候，非常痛苦，感觉挣钱遥遥无期，钱太难赚了。所以，给别人修过电脑、贩卖过二手电脑、镣由器、二手家具，搞过装修，搞过心理咨询，弄过弱电装修，搞过培训。


    总之，只要感觉有希望挣钱的法子，我都去试了，还是苦于挣不到钱，但路却越走越顺利。后来，有的项目就开始赚钱了，而且越来越多，甚至是大赚特赚。人也比较开心，比较兴奋，认为自己无所不能了，讲话也比较<|start|>癫狂了。


    有一次，我去见一个亿万富翁，我非常憨张地告诉他，没有1万块钱一小时，根本请不动我。我为什么这样讲话呢？因为我以前是一个非常普通的打工仔，突然有了点小钱，就不知道自己是谁什么了。当我讲完这句话的时候，这个亿万富翁完全不理我了，处于无视我的状态。我忽然感觉到我有点
    brag 衡量不清楚自己的轻重了。'
  merge: -1
  img_proc: true
- pgno: 175
  md: '后来我依然做着我自己的业务，也有钱赚。再往后走，我谋求转型，为什么要转型呢？因为我最赚钱的业务根本不是我喜欢的业务。那我为什么当初要做这个业务呢？是因为我自己没有饭吃了，不这样做，我就要饿死了。所以当有一点钱、一点经济基础的时候，我就再也不想干那个我不喜欢的业务了。


    我的团队越来越大，人数越来越多，大家跟着我做我喜欢的业务。做了一年多时间，悲哀的发现，根本没有以前赚钱。后来我就想，为什么创业初期能赚钱，当有钱、有团队、有经验过后反而
    chính 不赚钱了呢？


    答案其实非常简单，因为以前我是从客户需求的角度出发做事的，而有钱过后，我是按照我的喜好做事的。严格来说，我这已经不是创业了，而是享受了。享受自然是一种消耗，是应该去赔钱才对。


    所以，理顺了这个逻辑过后，我就开始回到我创业初期的逻辑。客户喜欢什么我就干什么，不问对错，不在意自己的喜好。果不其然，我这样一干，金钱又开始哗啦啦的流到我的腰包里来了。


    人有时候就是这么悲哀。我们认为不好的，恰好是客户喜欢的，而且客户愿意掏钱的。让客户享受去吧，永远不要去教育客户。'
  merge: -1
  img_proc: true
- pgno: 176
  md: '我们要有服务精神，而不是教育客户的精神。我们是商人，怎么能让客户掏钱，我们就怎么做。我们认为为客户好，客户也许会骂我们傻。何必自取其辱呢？


    经商的时间长了，我们就越来越会做人了。我们卖客户喜欢的东西，而不是我们喜欢的东西，我们永远不要去教育客户，客户教育我们才对。我们是商人，我们的天职就是挣钱。


    # 22、只有顾客买了过后，才叫商品，否则就是废品


    我们的业绩差，只有一个原因，就是我们并没有生产顾客需要的产品。


    我们很多不会做生意的伙伴与老板虽然没日没夜的加班，生产出来的却是顾客不需要的产品，因此货物滞销，然后就怪中国经济不行。其实，中国的经济一直都很行，消费者消费的东西每年都在增加，而不是减少。


    如果你的业绩在萎缩，只能证明你退步了，或者搞不懂商'
  merge: -1
  img_proc: true
- pgno: 177
  md: '业社会。还有些朋友不会做生意，以为做生意就是买一堆货物卖出去就行了，于是就买了很多货，准备去卖，结果发现货物在手里根本卖不出去。


    做生意，最重要的功夫是卖货，而不是买货。如果你有很强的卖货能力，你根本不需要先花真金白银来买货，到处都有供应商愿意免费供货。


    如果你非得先买一点货物来卖，那么你完全没有必要花几万块钱，甚至更多来买货。你先花几百块钱，买点货，试一试自己能否卖出去，这样，就算卖不出去，损失也很小。


    商品，只有顾客买了过后，才叫商品，否则就是废品。如果自己在家里面努力生产产品，没有搞好营销，从很大程度上就是在生产废品。


    假如我们是卖鞋子的，我们首先应该询问，顾客是否需要我们手上的鞋子，我们是否有能力卖出去我们手上的鞋子，最后才考虑我们是否要自己来生产这个鞋子。


    切忌没搞清楚市场，就从市场上进回来一堆鞋子，以为自己有能力卖出去。'
  merge: -1
  img_proc: true
- pgno: 178
  md: '# 23、企业 的命脉


    创业者刚开始做一个业务做不起来，一般情况下就是营销不到位。营销是企业的命脉，如果你完全不会做营销，你就直接叫卖你是什么产品或者服务的就行了。天天叫，总是有
    人买的。


    小企业刚开始的时候，必须专心致志的为客户服务，不需要复杂的 管理，不用思考战略，甚至未来，就真诚的为客户创造具 体的价值就行了。战略、未来这些东西，是当你公司盈利了、稳定了，再思考的问题。


    **聚焦到极致，只做一件事，这样的成功几率就大点。**现在互联网的出现，让一个企业只做一件小事变得更加现实，而且通过互联网可做全国的生意，也就是说，虽然你聚焦了一件小事，但你有海量的客户，也能支撑你做强做大。


    一个企业要走得远，有质量还是根本，基本功扎实才有未来。'
  merge: -1
  img_proc: true
- pgno: 179
  md: '企业的竞争，本质上就是成本的竞争。想尽办法降低销售成本、管理成本、生产成本、服务成本，不断的优化流程，能整合的流程就整合，能借助科技手段的就借助科技手段优化流程，能裁员就裁员。


    我们公司就放掉了线下的业务员，我们所有的业务都通过互联网来开展，这样，营销成本就降低了很多。


    # 24、所有的大商人必须是搞营销的


    很多人不赚钱，就是去学了一门技术，他想靠一门技术赚钱。这是不能的。技术只能拿到一个技术工人应该拿的工资，很难拿到溢价，因为总是有别人会这门技术。


    有些人喜欢做产品，认为我生产一个产品出来就能赚钱。然后把自己的智力都投入到这个产品上面，这其实是农民思维，你生产的产品很有价值，但是你不会卖出去就赚不到钱。而你把精力都用来思考生产产品了，你自然很难卖好这个产品。


    赚钱，其实只需做营销这一件事，你要会搞营销，会卖产品，'
  merge: -1
  img_proc: true
- pgno: 180
  md: '总是有人不断的生产产品，我们拿来卖就行了。我们不懂技术，我们招聘一个技术员工就行了。只要我们有营销能力，我们就能获得高溢价，自然就能赚钱。


    乔布斯、比尔·盖茨，本质上都是营销大师，就算他们开始是做产品的，后来也转向了搞营销。所有的大商人必须是搞营销的，不然你很难赚到大钱。不是说做其他的事情不能赚钱，至少是做技术、做产品，没有做营销赚钱的几率大。


    希望老板们都把心思投入到营销上来，靠营销打天下。


    互联网营销有三个方向，一个是软文营销，二是音频营销，三是视频营销。你随便选一个做到极致，一年赚上千万都容易。


    # 25、为什么建议大家都做免费的流量


    我不喜欢做付费流量。做付费流量我们自己很难建立品牌，都给平台商打工了。


    比如，你做竞价，就不断给百度打工；你搞淘宝，就不断给淘宝打工。'
  merge: -1
  img_proc: true
- pgno: 181
  md: '对于初级创业者，根本就没有这个资金负担得起。如果你想尽办法用软件、用软文做一些免费流量，拍一些短视频，搞微博、搞微信、搞Q Q空间，到一些自媒体上面去圈免费流量，你会发现越来越多的圈流量知识。


    **做免费流量，我们的智力在不断增长，很容易就做出来一个品牌，而且这个品牌会自动传播。**而一旦我们习惯了做付费流量，我们的头脑就停止了思考，就只学会了花更多的钱，买更多的流量，到最后，你发现你根本不赚钱，还得赔员工的工资。因为你的钱，都给了卖流量的商人。


    **做免费流量，能赚到的钱，基本都是纯利润。**你会越做越有激情，你会做出自己的品牌，你会对互联网理解得越来越深刻。慢慢的，你会碰见很多高手，你也会把自己逼成高手。


    **做付费流量，你总是发现自己的钱不够，而不是反思自己的能力不够。而我们习惯了做免费流量，我们总是发现自己的能力不够，而不是钱不够，我们会发现在处处都是赚钱的机会。**'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 26、商业上最重要的两条游戏规则


    首先来讲，你会为了自己的利益着想，别人也一样。很多人讲贡献，讲雷锋精神，实际上真让他让出利益来，是不现实的。


    每个人，都想以最小的成本获取最大的利益。每个人都有一个可以收购的价格，如果价格足够高。


    当今社会，做企业、创业，如果你不想以悲惨的结局收场，你必须想通和看透，并且接受与面对市场上的游戏规则。我总结了两条最重要的游戏规则。


    第一，市场上的运作，根本就没有所谓的道德与不道德，只有合法与不合法。不要被道德绑架，凡是从道德层面去攻击竞争对手的人，都是极其幼稚与无聊的弱者。


    在商业上，如果对方使用手段赢了你，但只要他不犯法，他赢了你，你就是输家，你就必须出局。简单来说，商业上只有赢家与输家，没有道德与不道德。'
  merge: -1
  img_proc: true
- pgno: 183
  md: '第二，既然只有输与赢，所以强者必胜，弱者必败。这也 就推导出，你必须与强者合作，然后不要招惹强者。只有愚蠢的人，才与强者作对。


    换句话说，在商业上，谁的智力与财力高人一等，谁就占领了先机；谁能在第一时间看透并且利用人性的弱点，并给予对方狠狠一击，谁就是赢家。假如你想做强者，但目前你并没有很大的财力，你唯一的办法就是从智力上超过大多数人，增强自己的竞争力。


    看不透这些东西的人，成天被人口仁义道德糊弄，就不要来参与商业竞争，否则都会以血与泪换取惨痛的教训。


    # 27、赚钱的三个重要态度


    第一，永远不做违法项目，三观越正越有前途。


    第二，做人越谦虚，越少是非。


    因为你不谦虚，你就会得罪非常非常多平庸的人。这些平'
  merge: -1
  img_proc: true
- pgno: 184
  md: '庸的人之所以平庸，就是自己的正事不做，天天找人麻烦，看人热闹。


    好了，你不谦虚，他们正好专门找你麻烦，你就惨了。虽然影响不到什么，但总是不太舒服嘛。为什么你很难得罪特别优秀的人？因为特别优秀的人只关心自己的事业，根本不会关注你谦虚不谦虚。但平庸的人不关注自己的事业，专门关注你谦虚不谦虚。


    # 第三，学会只赚富人的钱、中产阶级的钱，千万别赚穷人的钱。


    你只要开始赚穷人的钱，你的企业就开始走下坡路，而且黑你的人会越来越多。穷人对他们的生活不满意，对自己不满意，他们就会爱屋及乌切入到你身上，让你伤心欲绝。


    富人是有正能量的，中产阶级也有正能量，你为他们付出了价值，富人总是很感恩的，而穷人只会认为你收了钱，你做得还不够好。


    富人是花钱买服务，富人乐于花钱买服务。穷人不是这样，穷人非常讨厌花钱买了你的服务，穷人要求你免费服务于他们。


    穷人认为天下间所有的服务都应该让他们先免费试一次，试完了，穷人是不会买单的，因为他已经尝过试过了。穷人还会得'
  merge: -1
  img_proc: true
- pgno: 185
  md: '出结论，你的服务太差，其实仅仅是因为他自己没钱买。


    苹果公司做得好，是因为苹果公司只做富人的生意，走高价路线。


    # 28、做为企业家服务的生意有什么好处


    为什么要为企业家服务？因为企业家是这个世界上最有钱的人。他们是对社会最有贡献的人，我们应该多帮助企业家，让他们更加有钱。有了钱，他们就更加有力量，他们就会为社会做出更加巨大的贡献。


    # 为企业家服务，企业家有购买力。


    他们买了我们的智力，买了我们的课程，买了我们的服务，我们才有钱。我们不可能去服务没有买单能力的人。服务没有买单能力的人，对我们一点好处也没有，只会浪费我们的时间。大多数都知道时间就是金钱，所以如果我们的时间不能换来金钱，就说明我们浪费了钱。


    你服务谁，就会研究谁，最后你就会成为谁。'
  merge: -1
  img_proc: true
- pgno: 186
  md: '我们想成为一个企业家，我们最好天天研究企业家的言行、思想，而服务企业家就是把工作与我们想要成为的人，完全完全结合起来的工作。企业家的素质高，好交流、脑袋灵活、知思图报。我们真正帮助企业家，企业家会对我们非常好，这样我们就有前途了。


    # 企业家这个市场够大，中国有几百万个企业家。


    能把这个市场做透彻，一年就能赚到几百个亿，所以这个市场是可以里面干一辈子的。而且我们把中国这个市场干透彻了，还可以干全球市场。总之这个市场特别肥美，是可以干一辈子的事。


    # 29、不赚磨叽、麻烦的客户的钱


    在网络上做生意，特别是卖精神产品、文化产品、咨询服务、培训业务，会有很多人不勒的来烦你。有新手刚到这个行业，想挣钱，就与每一个来找他的网络客户聊天，回答这些客户的问题。聊了半天后，这些客户并没有选择付费，这些新手就很生气，很苦恼。我也有一些学员来找我诉苦。'
  merge: -1
  img_proc: true
- pgno: 187
  md: '其实在网络上做生意，你完全不用解答用户的问题，你只要把你的事情做好，不断的释放价值就行了。来找你问问题的客户，你就直接要求他付费就行了。他若不付费，还找你聊天，你就不要搭理他。


    真正能付费的人、有钱的人是不会磨叽的，而磨叽的基本就是打算不付费的人。所以你以为你服务态度好，恰好吸引了很多根本不是客户的人。


    那么有的兄弟又问我，如果这个客户就是想付费购买服务，他就是想了解得仔细点才买单呢？我如果不搭理他，岂不是丢了一单？


    我的答案是，磨叽、麻烦的客户，他们的钱我们不挣。因为你把这种人的钱收过来了，他会不断的麻烦你。你的精力也是金钱，你会亏本的。


    有的人的钱，我们应该放弃，放弃点什么，我们才能得到点什么。好在中国这个市场足够大，你只需要不断的去找下一个客户就行了。这就是在网络上对待客户的方法。'
  merge: -1
  img_proc: true
- pgno: 188
  md: '# 30、为什么不要收客户的红包


    我们在经营自己的业务、事业的时候，由于干得太好，总是有会人给我们红包。现代社会，发红包非常方便，要么 QQ 发，要么微信发，要么支付宝发。养成熟习惯，不要收任何人的红包。为什么呢？


    1、我们要养成习惯，只靠自己的业务、服务、产品赚钱，利出一孔。


    如此，我们才会专心致志地做服务。服务好了，我们自然能赚到更多的钱。收红包，把人收 reconfig 懈了，收小气了。


    2、我们要赚的是大钱，不是这种红包式的小钱。


    几十块钱、几百块钱，只是浪费我们的时间而已，并不能让我富贵。所以，有人发给你红包，一律不收，一律拒绝。


    3、收红包，会把人养成索取型的人格。


    我们要养成付出的习惯，养成发红包的习惯，而不是养成'
  merge: -1
  img_proc: true
- pgno: 189
  md: '收红包的习惯。人跟人的志向不一样，地位不一样，想法就不一样。既然想做一个企业家，就要有企业家的样子与格调，也要有企业家的觉悟。


    # 4、其实拒绝红包可以让我们的成交率更高。


    红包本来是一种贿赂，你不接受贿赂了，你这个人更加的廉洁，也就更加值得客户信任。优质的客户，就 Blvd？就会进一步跟我们做买卖，如此我们的生意只会越来越好。


    # 5、只拿该拿的钱。


    要真正的对客户好，对大家好，要养成只拿自己该拿的钱的习惯，无功不受禄。大家赚到钱了，进步了，成为一个企业家，成为一个人格高尚的人了，才是我们最大的红包。要有这个心态来做人做事。


    # 31、你不可能一次就把事情做好


    经商先求数量，再求质量，最后差异化。

    实际上，先求数量，再求质量，最后差异化的套路，适合'
  merge: -1
  img_proc: true
- pgno: 190
  md: '任何领域。比如，你交女朋友，你一定要交非常多的女性朋友，才能了解到谁的质量好，最后才能选择自己中意的那个。要是你不追求数量，想直接求质量，你就没有什么经验。没有经验，你就注定要在情场上败给有很多经验的、质量高的女性。


    再比如，读书，其实如果你没有读过大量的书，你根本就不能判断哪些书是有质量的。只有大量的阅读过后，你才具有选择的能力，最后找到一个自己喜欢又能赚钱的领域研究下去。广度是决定一个人的高度的，没有大面积的地基，金字塔是要倒掉的，甚至，都修不起来。


    做生意也是这样，你一开始要全面的去结交客户，不管是好客户，还是烂客户，先把他们的钱都赚进来。等到你有资金，也有一定的经验了，你就要开始筛选客户了。因为有的客户，他付费给你，会非常的麻烦，你为了服务他，甚至把本钱都亏进去了，或者时间成本太高，我们以后就做这种客户的生意了。而且，当你的面积非常广的时候，你才知道哪些客户是非常适合你的，到了这一步，你才有机会注重质量。


    大部分初级选手不成功，就是因为一上来就要求质量，而初级选手是没有能力做高质量的事情的，只有先做数量。就如同我们玩游戏一样，开始的时候，只能打低级别的怪升级，打到一定的数量，才能打高级别的怪，才能拿到好宝物。'
  merge: -1
  img_proc: true
- pgno: 191
  md: '这个社会上有很多伪理论，听起来都非常正确，实际上误导了很多新人一辈子。比如，一次就把事情做好。比如，只做有质量的事情。比如，写文章要写得漂亮才能赚钱。


    真相是，你没有大量的失败，没有经验，是不可能一次就把事情做好的。你没有做过没有质量的事情，根本搞不懂质量是怎么回事，也自然是做不了有质量的事情。你想靠写文章赚钱，你就得写大量的文章，千锤百炼过后，你才能写得出有质量、对别人有帮助的文章。


    所以，经商也是这个规律，先求数量，再求质量，最后差异化！凡是想绕过这个定律的，都是要流产。创业也是如此，一次成功不太现实，很多老板都是创了好几次业，积累到了足够的经验，然后在一个项目上水到渠成，成功了。你没有成功是因为你还没有失败的足够多。


    # 32、创业最难的是第二个阶段


    我有很多创业的学员，他们有的人很急躁，比如有一个学员，他说他前几个月很赚钱，不过现在有两周没赚钱了，心理很慌。'
  merge: -1
  img_proc: true
- pgno: 192
  md: '所以我给大家讲讲创业的三个阶段。


    # 第一个阶段是学习。


    很多人都知道，我们想要开车，首先要学车。如果你不学车，直接开车，你就一定要出车祸。万事万物皆是如此，可在创业这件事情上，很多人却不愿意为学习付出时间与金钱的代价，就直接开干，结果当然是赔钱、赔时间，搞不好还弄得一身的欠债。


    所以，我建议各位创业者，你想做什么生意，你可以先到一个同行那里去打工，疯狂的学习他的运营经验。觉得你都搞懂了，你就可以开始了。


    如果你真搞懂了，你就会进入创业的第二个阶段，糊口阶段。


    这个阶段就是你拼尽全力，也只能勉强保证不亏。有时候，你运气好会多赚点钱；有时候，你运气差，就会少赚钱，甚至不赚钱。


    最危险的就是这个阶段，很多人一不赚钱就慌了，有的人甚至就转行或者放弃了。这就非常可惜。你这个时候应该做的是更加努力的去工作，去思考，甚至去请教同行，或者请专业的人给你出出主意。总之，就是不要放弃。


    一般情况下，你以前能赚钱，以后就能赚钱。只要挺过了'
  merge: -1
  img_proc: true
- pgno: 193
  md: '这个阶段，坚持一段时间，这段时间可能短，也可能长，但只要你挺过去了，你的收入就会稳定，更可能的就是你的收入会比以前多。


    第三个阶段，当你的生意稳定了，你就可以开始着手稳定

    的扩犬团队，规模化，招聘更加优秀的人来帮你运作这个已经

    稳定的生意。一般情况下，你只要不自给自己找麻烦，你都

    会进入一个赚大钱的阶段。


    创业的这三个过程，学习不难，赚大钱这个阶段也不难，最难就是在中间树口这个阶段，希望大家都理智而勤勉的挺过这个阶段。


    # 33、越朴素的人越能落地，就越能赚钱


    关于赚钱这件事的几点心得：

    第一，赚钱不要吹牛，不要给我讲什么梦想，你的梦想毫无意义。

    赚钱就是找一个你自己能看得懂的简单项目做起来，先养'
  merge: -1
  img_proc: true
- pgno: 194
  md: '活自己。越朴素的人越能落地，就越能赚钱。我看到讲梦想的人，直接就 pass 了。


    # 第二，养活自己过后，竭尽全力把这个项目做到极致。


    坚持在这个项目上持续投入，并且不断按人来跟你做这个项目。


    # 第三，独裁、偏执。


    别人让你去干其他更赚钱的项目，你别搭理他们。不忘初心，方得始终。永远在自己选定的这个项目上不断的投入。


    # 第四，赚钱的本质，就是你给你的客户群体释放价值。


    你的客户群体觉得你有用、有大用、不可替代，他们就会出钱让你继续为他们服务。


    # 第五，这个社会上，只有工作最靠得住，工作的回报最大。


    凡是想赚钱的人，必须成为一个工作狂。如果你很懒散，凭什么你有钱呢？


    # 第六，持久战，是每一个创业者必须拿的战争。


    选择了创业，就只有开始，没有结束。结束就是你死了。你还没死，就没有结束。


    # 第七，不要有靠别人的心理。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '赚钱、创业这种事，只有靠自己，完全靠自己。你成功了，才有人跟着你玩。你是个普通人，真优秀的人看见你就躲开了，根本不可能跟你混。


    我有一个经验，就是我很差劲的时候，我当老板，拿着钱都分辨不出来谁是优秀的人。只有当我自己不断进步，有了经验过后，我才能分辨出来谁是优秀的人，谁是差劲的人。也就是说，当你很差劲的时候，你公司里绝对都是一帮差劲的员工；当你很厉害的时候，你公司里就全部是厉害的员工了，这个时候，你赚钱就凶猛了。


    # 34、自己摸索的人是极其愚蠢的


    致富是一件不太难的事情，最难的地方在于你舍不得花钱去买经验。穷人把钱看得太重，所以终身没有多少钱。


    这个世界很有意思，比如你追求一个女人，你特别在意她，基本就很难追上。你若是根本不怎么在意她，你就会发现特别好追。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '金钱也是如此，你越是不看重金钱，玩着玩着就有钱了。


    其实很多人都能拿出来 100 万，但是他们的现金通van一辈子的努力，也很难超过 500 万。那么要超过 500 万容易吗？非常容易，只要你舍得花这 100
    万来买经验。


    我给出一个方案，你在网络上随便找一个成本非常低的产品，其实可以到淘宝上去搜索那些成本低，你又能拿到获得了的产品。你看他卖得很好，你就可以通过网易、搜狐、新浪，包括搜索引擎营销、微信营销、视频直播等方式来推广这个产品。


    买产品的成本控制在 1W 块钱以内，花 1.5W 左右招聘两个有三年经验的营销推广，再招聘一个做网站的程序员，一个做营销策划的，一个做美工的人。每个人平均工资是
    1.5W，一共 5 个人的团队，加上你 6 个人。每个月的消耗控制在 10W 元。100W 是可以花 10 个月的，至少有 7 个月可以拿来犯错。你在这 7
    个月内可以吸收到大量的经验。而且你招聘的都是有经验的人。只要你不是特别蠢，愿意专研，也虚心学习，这个每人有 3 年互联网营销经验的团队一定是可以实现盈利的。你花掉这
    100W，就keras打造一个成功的、能盈利的团队，几百万都能赚回来。


    我内部课程上讲过很多发财的套路，这个套路也给了很多有钱人讲过。有的人问我，如果 100W 花完了，我并不能赚回钱来'
  merge: -1
  img_proc: true
- pgno: 197
  md: '怎么办？我的答案很简单，别太在意钱。很多成功的创业者，都是第一次失败了，继续实验下一次，失败了，再继续，失败下一次，直到成功。


    # 致富，重要的是增长期见与经验，而不是看重这几个小钱。


    有这个实力的人，有晚力玩起来，玩着玩着，财富就迅速增加了。当然，如果你没有 100 万，你有几万块钱，你只不过玩的是一个缩小版的致富路径罢了。你招聘的人才要低级一些，玩起来要困难些，不过去学到的经验反而更多一些。


    # 你只要肯花钱买经验，你就能迅速成功。


    完全不喜欢出钱去探索的人，其实成本是最大的。自己摸索的人是极其愚蠢的。人<|start|>类之所以成功，是因为后人可以借鉴前人的经验。如果抛弃前人的经验，自己摸索，人类现在还在原始社会。


    # 35、赚钱的真理就是跟牛人合作


    人到底是怎么成功的？

    第一，你首先要认为自己不是最优秀的。'
  merge: -1
  img_proc: true
- pgno: 198
  md: '一个人如果认为自己是最优秀的，一般这是一个假象，其实自己只是一个普通人，很难成功。


    但若这是一个真相呢？你最多成为吕布或者项羽，这两位爷够厉害了吧？最后一定会栽倒在蚂蚁战术下，栽倒在自己看不起的人手里，或者直接把自己累死。现代社会很多过劳死就是这种情况。


    # 第二，人的成功，拼命努力是少不了的，但这不是必要条件，干得更加聪明是更好的办法。


    不要认为自己很拼命，就能解决一切问题，要看你能跟谁合作，一般情况下，借势非常重要。有些明星，我认为都是劳模，明显不懂我讲的这个道理，而有些明星懂，他们跟商业大佬合作，就这一点，他们的身价，那些明星劳模一辈子都追不上了。


    那那么些明星劳模有商业大佬这种资源可以利用吗？是有 的，但只是他们 的心思不在这里。


    任何情况下，我们都要借用身边的牛人去赚钱，一定要跟牛人合作，且必须千方百计找到牛人。


    # 第三，只有跟牛人合作的情况下，拼命工作才会事半功倍，而且牛人也非常喜欢拼命工作的人。你笨是笨了点，但跟牛人'
  merge: -1
  img_proc: true
- pgno: 199
  md: '合作，你拼命，牛人也用得上你，你自然会发财。记住，没有篮板是打不成篮球的。你必须找到牛人跟你合作。


    # 第四，这个世界上大部分人都不懂得跟牛人合作，大部分人都以为成就是自己的，实际上他们自己一文不值。记住，赚钱的真理就是跟牛人合作。


    好消息是牛人周围也非常缺乏拼命三郎，也就是说只要你是一个拼命三郎，你在牛人面前就有市场，他叫你干啥，你就干啥，听话照做执行，你就能发财。


    # 第五，成功者必须具备感恩之心，这会让牛人不断的帮你，也会让牛人周围的牛人也帮你，你就会更加的成功。


    凡是白眼狼，就算侥幸成功，失败也是早晚的事。有感恩之心，不是一种道德，而是混社会的一种规则。你不懂，你就要被社会淘汰了。


    # 36、是非越少，盈利越多


    一个创业者，只应该关注自己的项目，其他事情，我们就'
  merge: -1
  img_proc: true
- pgno: 200
  md: '不关了。除了销售我们的产品与服务以外，其他的事情，都是是非。


    我们从来不参与讨论是非，我们应该不断的销售产品与服务，不断的收钱。在商言商，时时刻刻提醒自己是一个商人。当然，你也可以说，你是一个有责任心的商人。随使你怎么说，但是，你一定要只关心自己的事业。


    人生，最宝贵的是自己的注意力。穷人最倒霉的是控制不了自己的注意力，他们从早到晚，被各种各样的媒介偷走了自己的注意力。只要你被别人偷走了你的注意力，你就没有时间去挣钱了，同样，你仅仅有的一点钱，也会不受控制的花出去。于是，你只能陷入贫穷。而智慧的人知道自己的注意力非常宝贵，于是，只关心自己的事业，自己的事业就会茁壮成长。


    创业者，要知道把自己的时间放在自己的事业上，绝对不去关注别人的是非。创业者，还要学会用钱买时间，能用钱节约自己的时间的事情，就多干。


    **穷人习惯性的用时间换钱，富人习惯性的用钱换时间。**你必须顿转这个思维。开始的时候，你会觉得这个思维非常反理性，当你习惯了这个思维过后，你就知道，这个思维会给自己带来非常多的好处。于是，你就乐于自己比其他人早早的形成这个思维。'
  merge: -1
  img_proc: true
