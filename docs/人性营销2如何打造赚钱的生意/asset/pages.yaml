  md: '任何事情都是有代价的，我们需要准备好牺牲我们拥有的东西，比如陪老婆的时间、看美国大片的爱好。其实1000万并不多，方法正确只需要一两年，只要我们运气不是很背，我们还是能完成这个任务的，也许还能更快。


