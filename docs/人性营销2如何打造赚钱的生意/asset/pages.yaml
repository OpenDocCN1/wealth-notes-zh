- pgno: 155
  md: '4、约很贵。

    赃艮，挣钱的逻辑就这么简单。


    你干的任何事都是这4个步骤的丰满。赚钱其实只有两件事，一是大题小做，二是小题大做。卖出东西的关键是提好的问题，打好的广告，问得自然又急切，那么用户就会很快进入状态。

    问之有物，故而答之有物，交钱就很痛快了。


    从事销售工作多年，难免要做承诺，怎么办？我的办法是，我们从来只承诺那些已经发生了的事情，也就是举例子，已经发生过的事情，客户就容易被说服。


    任何生意都是以挣到钱论成败的。一定要在自己能力范围内做最高价，这样用户才会真的重视你，你自己也能赚到更多的钱。薄利多销是竞争手段，不是目的，更不是追求。


    # 12、把握好这四点，做任何项目都能得心应手


    最正确的营销理论，就是4p理论。'
  merge: -1
  img_proc: true
- pgno: 156
  md: '哪4P呢？1、产品。2、定价。3、渠道。4、推广。


    # 1、产品——产品还是废品


    产品，不仅仅是你会制造什么，比如，你是做饭的，可是你的饭做得很难吃，甚至不能吃，这就是制造废品，而不是产品了。你必须开发出来一个客户需要的东西，只有客户真正需要的东西，才是产品。


    # 2、定价——短期待是长期


    公司卖的东西，不是定价越低越好。低了没利润，没利润影响公司发展。也不是越高越好，高了即使是客户买了，基本也就一锤子买卖，以后客户再也不找你了。


    定价是要客户能占便宜，什么意思呢？就是要让客户长期跟你合作，他觉得划得来。不要图短期的利益。如果一个客户能跟你终生合作，那么你少收一点钱，也是赚的，因为你赚了他一辈子。


    占了客户的便宜是最差的营销，因为客户会醒悟的，客户一醒悟，你以后的生借就没了。当然，如果你真打算做一锤子买卖，那么收多高的价钱，就收多高的价钱。


    # 3、渠道——最好的渠道是口碑


    最好的渠道肯定是口碑传播。某种意义上，老干妈、苹果'
  merge: -1
  img_proc: true
- pgno: 157
  md: '# 4. 推广——推广团队


    都是口碑传播。任何一个行业，总有一个企业是做到了口碑传播的，这其实就是要求你的产品与服务真的是好到家。我们现在做互联网生意，口碑传播更加是重中之重。


    我做任何项目的推广策略都是花钱，花钱请人或者花钱砸广告。我的逻辑是，能上钱的不上人，能用别人的事情，自己就别上。


    钱不值钱，别人的不值钱，最值钱的是自己的人与自己的时间。老板不要亲自去推广产品，老板要经常培养公司的推广团队。


    经常有老板想来拜访我，或者想请我去给他们公司团队做培训，我从来都是拒绝的。因为我有功夫给他们员工讲课，还不如培养自己公司的员工。我有闲情去跟这些老板聊天，还不如看几页书，或者花时间跟公司的核心员工聊天。


    总之，推广就是能花钱就花钱，不能花钱就用别人，别人才行再上自己的人。我的任务就是培养公司内部员工。


    把握好这四点，做任何项目都能得心应手。'
  merge: -1
  img_proc: true
