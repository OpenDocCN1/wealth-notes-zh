  md: '# 27、搞原创赚钱的六个原则


    搞原创如何才能赚到钱？


    首先，搞原创，必须发表在大流量平台，赚到流量才能赚钱。


    二、我们搞的原创的主题，必须是对社会有用的，必须是有价值的。


    三、关注我们这些主题的人，要有消费的需求，他们要有购买力。


    最好瞄准中国的中产阶级、老板阶级、创业者。这些人有钱。


