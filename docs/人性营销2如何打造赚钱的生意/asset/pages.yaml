- pgno: 93
  md: '# 9、有本事的人不断的追求简单


    我们能创业成功，一般都是九死一生，失败过好几次，不断总结经验。终于，我们在某个领域、某个具体的产品上赚到了钱。


    有了钱，我们当然开始招兵买马，扩大团队，研究新产品，挑战新的难题，想赚到更多的钱。这就是大部分老板的思路。可大部分老板夜以继日的干，发现他们非常努力，公司并没有扩大，甚至有走下坡路的趋势，自己赚来的现金不但没有增长，反而有耗光的危险。很多老板百思不得其解。


    为什么自己努力了，尽力了，反而公司干不大？其实是方向错了。用钱招聘优秀的人才肯定没错，夜以继日的疯狂工作也没有错，错在哪里呢？错在研究新的产品、挑战更难的项目。


    我们实力强大了，并不是说我们就要去挑战难题，我们应该去挑战更加简单的产品，去找那些白痴都搞得定的产品。这样，'
  merge: -1
  img_proc: true
- pgno: 94
  md: '我们的团队就能轻轻松熟。成本低，效率高，才能赚到更多的钱。


    不要把自己的时间耗在挑战难题上面，不要把时间耗在开发新产品上面。要去干自己已经非常熟悉的产品，要去干更加简单的产品。巴菲特就只投资自己明白又熟悉的领域，故而很少失败。


    等到我们实力越来越强大，我们就能找到越来越简单的项目干。注意这句话，我建议大家把我这句话琢磨 10 次以上。也就是，人 的能力强大了，不是因为挑战了难题，而是去干了非常简单的事情。


    大道至简。我们的能力增强了，并不是去解决难题的，而是去解决更加简单的问题。越有能力，我们才能发现越简单的 事情。越没有能力，我们做的都是相对难的事情。爱因斯坦能写出质能方程式，老子能写出《道德经》，都是把复杂的东西简化。


    有本事的人不断的追求简单，故而成就了大事。没有本事的人总是去挑战难题，故而粉身碎骨。这就是把公司干大、干强的真经。'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# 10、只有业务极其简单了，员工才能干得好


    我们要竭尽全力的把公司的业务变得极其简单。每一个来应聘的人，我们只需要一句话，就表达出来我们是干什么的了。我们卖的具体产品是什么？让应聘者马上就认识到我们的产品。然后告诉应聘者，我们如何干，可以把这个东西卖出去。


    比如在网络上发帖子，可以卖出去，操作要极其简单。然后再告诉应聘者，你卖出去一个产品，可以获得多少提成。让应聘者心满意足，知道自己卖出去了，有提成，而且是高提成。让应聘者自己去盘算自己一天能够多少提成。


    只有我们公司的业务极其简单了，员工才能干得好，才愿意干。如果公司的业务太复杂，愿意干的人就特别少，能干好的人也特别少。


    公司的业务只能有一个，永远要聚焦到极致，越聚焦，越盈利。不聚焦，不盈利。公司永远不扩张第二个项目，就在一'
  merge: -1
  img_proc: true
- pgno: 96
  md: '个地方做到极致，追求专业主义，并且大量招聘业务员来把这个业务做到极致。


    相信规模是最大的优势，相信人多力量大，相信简单的力量，相信持续对一个项目做下去，产生复利的力量，如此，我们就能成为亿万富翁。


    # 11、搞网络生意，其实很简单


    如何搞网络生意？这是大家特别关心的。


    搞网络生意，其实很简单，最笨的人直接靠复制别人的文字加图片就行了。复制完了，当然是到处发，吸引流量就行。


    聪明点的人可以复制别人的视频+语音。网络上有很多复制我的语音，也可以一年搞上百万的。不过复制的人越来越多了，我也没有调查他们的收入怎么样，想来不会低，因为市场确实是太大了。


    有钱的，可以玩付费推广。付费推广渠道自己在网络上一'
  merge: -1
  img_proc: true
- pgno: 97
  md: '搜索就搜索得到。


    你没什么文化不要紧，直接卖一些产品就行了，要把自己的产品品牌化，或者自己找文化产品。


    我有的学员在做药类的生意，有的学员在做培训类的生意，情感培训、心理咨询、销售培训。我自己这个项目可以说是创业培训，也可以说是项目培训，也可以说是思维培训。


    如果你没有口才，可以做培训生意吗？也是可以的，你可以请一个人来讲，你也可以只用文字，甚至，你可以找本书给大家读。


    照本宣科在这个社会上也是可以赚钱的。中国这个社会很有意思，市场太大，所以你乱搞也有粉丝，就是乱搞乱发财了。中国这个社会，赚钱真不难，特别是reo


    做为一个老板，不要把自己干成员工了，要经常看战略上的东西。公司里面少一个员工，只少一个好老板。老板的任务就是当好老板，不是做一个员工，不是去干活。凡是抢员工活干的老板，都是不合格的老板。


    有钱了，别没事就出去玩，玩多了伤神，精力跟不上了，事业就滑坡。当然你天天锻炼身体，天天进补，对身体是有一点好处的。'
  merge: -1
  img_proc: true
- pgno: 98
  md: '多读商业类的书，特别是商业模式类的书，你懂了很多商业模式，自然就不缺项目了。其实任何项目，就是发广告收钱而已。你有本事了，就是请一大帮人帮你发广告收钱而已。公司的任务就是营销
    + 创新就完了。


    老板是以利润为中心的，只要员工没犯原则性的错误，能带就带。为公司创造效益，为股东创造效益，让员工活得有尊严，这就是我的价值观。


    # 12、创业人怎样去挣得第一桶金


    创业企业挣到第一桶金是非常重要的，而且也是迫切的，但是我们要根据自己的特长与现实环境理出一个最好的方法来。下面给大家 3个方向。


    # 第一个方向，瞄准一个行业后，直接复制。


    比如你正在打工的这个企业所在的行业，我们可以直接复制企业的产品、服务，甚至客户，然后以更加勤快与便宜的价'
  merge: -1
  img_proc: true
- pgno: 99
  md: '格去赢得客户。这个方向会直接面对竞争，好处是，我们熟悉这个行业。如果本身在打工的时候，基本功扎实，成功的几率还是比较大的。


    # 第二个方向，打侧翼战。


    总结市场上海大部分人都看不起，或者是不情愿去做的事情，寻找商业机会，去研究能不能进一步专业化，成本降低。如同最早做电子商务的那批人一样，很多人都不看起，认为在网上搞不出什么来。也如同最早做易车拉赚回的那个人一样，别
    人认为是捡破烂的，没什么钱赚，结果却成了百万富翁。这个方向有可能一鸣惊人，适合什么也不懂、没有什么资源的人，完全靠智慧与眼光的人玩。


    # 第三个方向，营销代理型起家。


    这其实是我比较赞同的方向。我们看中了哪个行业或者产品，可以直接去给别人做代理。如果做代理有门槛，那么可以先去给别人当业务员，摸清市场、产品等基本特征，还有工资拿。


    我最初就这样考察过好几个公司的产品，我们的华为就是这样干的，先是代理国外一个品牌的交换机，后来赚到钱了，就开始自己研发，最后卖自己的产品。这个模式有益的地方是，在代理别人的产品的时候，市场、营销、渠道、客户，我们都摸熟练了，然后有实力了，就自己做自己的产品。我们的联想也是这么玩的，先代理别人的电脑，最后自己生产组装。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '# 13、最快赚钱的逻辑


    赚钱的逻辑理论，搞透彻了，就赚钱；没搞透彻，就不赚钱。

    先有理论后有钱，没有理论的军队是愚蠢的军队，没有理论的赚钱人，在那里按照自己的思路瞎干，可能一辈子都不赚钱。


    赚钱的思路很简单，别人有什么赚钱的项目，直接复制过来，不要不好意思。但是复制完了，并不是工作就结束了，我们还要持续的优化，持续的改进，最终做到青出于蓝而胜于蓝。


    复制别人的东西一定要仔细，别人的原创，你要多研究研究，找出这个项目为什么能赚钱。不要只能复制表面，不能复制其精华。要抄一个非常简单的项目，这个项目，就一个步骤，或者最多两个步骤就能赚钱，我们才抄。凡是复杂的项目，我们看都不多看一眼。


    抄别人的项目，一定要做得比别人好。为什么呢？因为你抄的东西别人原创好，别人就说你抄袭他、恶心他。假如你不断'
  merge: -1
  img_proc: true
- pgno: 101
  md: '的优化发展，你超过他了。他就不会说你恶心他了。因为成王败寇，现在你是领头羊了。


    这就是最快做项目、赚钱的逻辑。


    # 14、模仿是最快的赚钱方式


    很多人认为创业很难，其实可以非常容易，就是你找到一个你看得上的项目，然后你又能看懂，他又在赚钱的项目。这个项目，最好成本非常低，你就直接抄袭就是了。


    在做这个项目的时候，比竞争对手下手更多力去满足顾客，或者，你可以调查一下市场，比如，你的竞争对手满足的是5000块钱月薪这个阶层的客户，那么你可以去满足3000块月薪这个阶层的客户。


    一种是完全全全模仿。


    他怎么做产品，你就怎么做产品；他怎么做营销，你就怎么做营销。他能赚钱，你就能赚钱。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 第二种模式，就是侧重点不一样。


    比如，他重视产品和营销，你就只重视营销，把营销做到极致，产品甚至可以外包。从营销上甚至可以击败你模仿的对象。


    # 第三种就是不跟你模仿的对象发生冲突，做他不做的客户，就是客户人群定位。


    比如他刚才讲的，他做 5000 块月薪这个阶层的生意，你就做 3000 块月薪这个阶层的生意。


    模仿是最保险的创业模式，当然也有风险。不逞创业呢，总是要遇到一些困难的，当然越过了这些困难，你就成长了。


    # 15、人生的就是复制


    太多的人都在追求成功，却不知道如何成功，认为这很难，认为这几乎不可能。其实成功很简单，就是找一个成功的人，复制他。


    有人要跑出来讲了：“成功不可复制！” 讲这句话的，'
  merge: -1
  img_proc: true
- pgno: 103
  md: '都是鸢鹄学舌的家伙。其实，人类的一切行为都是复制别人的。创新其实也是在复制的基础上干出来的，这是哲学问题。如果你的知识比较丰富，你甚至知道这是哪个西方哲学家提出来。我们不探讨哲学问题，所以我就提这个哲学家了。


    你走路、吃饭、说话都是复制的。其实，走路、说话这些事情，比创业致富难多了，但你却学会了。为什么要说做生意难呢？因为你只是复制了几天，就不愿意复制了。


    你首先应该找到一个简单的生意，你确信你做得了，然后他做什么，你就去做什么；他怎么营销，你就怎么营销。你很快就会学会的。你不要一开始就找一个大公司复制，找一个大老板复制，毕业太大了，有团队了，里面千丝万缕，你已经看不懂了。什么时候你能看懂呢？就是你复制了很多小生意，你能通过小生意赚钱的时候，你自然就开始有智慧复制稍微大一点的生意了。


    人生就是复制。复制别人的态度，复制别人的言论，复制别人的生意。


    历史总是惊人的相似，太阳底下没有新鲜事。表面千变万化，内部逻辑基本没什么变化。


    中国人是不会造钢结构、混泥土房子的，这些都是复制过来的。连打字这么高大上的行为，都是复制过来的。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '成功就是复制。做生意非常简单，就是复制，复制，复制。

    这是不是很讨厌啊？不会很讨厌的。因为每个人的智力不一样，复制的过程中，他们就会自然创新，世间百态就形成了。


    你自己给自己整个名字，整个品牌，你自己给自己建立一套符合法律规范的制度。你的生意就建立起来了。天底事，都很简单，没有什么难的。很多人之所以认为难，就是不懂“复制”这两个字而已。


    # 16、如何复制别人的项目


    很多人创业不知道怎么开始，而且就算开始了，风险也很大，因为这是一个探索型的过程，不知道到底能不能赚钱。


    所以，我就提出了一个理论，你根据自己的经验、自己擅长的特长找一个熟悉的、别人正在赚钱的项目。这个项目可以通过网络上找，也可以在线下找到，最好是没有什么成本的服务性项目。然后你就完全全的复制他，做一个微小的创新，这个创新是从用户的角度出发，更加的贴近用户体验。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '# 如何复制别人的项目呢？


    一定是找 seekers 他最赚钱的那个点去复制。如果他经营的业务比较多，都在赚钱，你不要全部复制，只复制其中一个最有前途的业务就行了，然后把这个业务做精、做深。赚钱不在于做得多，而在于与精、深。


    很多人创业之所以难，就在于想自己搞一个新东西出来，或者想颠覆别人。其实新东西都有老东西作为原型，而颠覆都来自于微小的创新。你在一个点上探索，改进的时间长了，自然就变成了新东西，也能颠覆原本那个项目了。


    # 17、如何复制改编优化同行


    盈利手段都在同行那里，各位不要只懂得自己在那里死磕，不要关起门来做项目。要记住每天都寻找 10 个同行。


    # 找同行的途径在哪里？


    +   1、百度搜索项目关键词。\n2、淘宝搜索项目关键词。\n3、搜索对应的微信公众号、微信号。'
  merge: -1
  img_proc: true
- pgno: 106
  md: '4、搜索对应的 QQ 群。


    # 那么你找到同行后干什么？


    +   1. 看同行的收费情况，同行什么样的收费卖的好，我们就弄什么样的收费。

    2. 复制同行的广告，哪个广告写得好，直接改成自己的。

    3. 与同行交流一下，把他们的话术都复制过来，改一改，就成了自己的成交话术。

    4. 看同行是怎么分钱的，我们觉得可取，也学他们那样分钱。

    5. 看同行在哪里推广，我们也到哪里去推广。

    6. 看同行是怎么服务的，我们也如何服务。


    不过，复制同行，不要什么都复制，只复制最盈利的点，在哪里发广告、话术、大单系统等等。利薄薄的点，全部外包。养成分钱的习惯，养成用小钱驱动别人给我们干活的习惯。


    **一个人不需要太聪明，只需要找到一个项目，找到同行，这个人也就财富自由了。**'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 18、你收集的案例，就是你的生意


    人是环境的产物，我们脑袋里的思想是我们接触到的信息的产物。


    我们天天收集佛珠、佛牌的 QQ广告、微信广告，我们就会去搜索这种生意。搜索半个月下来，我们就收集了这个行业上百个文案、上百个竞价单页。我们对这一个行业熟悉了，我们就可能去进货，然后通过各个自媒体平台卖起来。


    我们收集股票软文、股票培训、股票书籍，淘宝上所有的股票视频资料，我们都买来看。我们就可能开始卖股票软件、搞股票培训，我们也可能投资股票。


    人就是环境的产物。人脑摄取什么信息，就有什么样的人生。我是看了一本书，讲销售可以赚大钱的，我才走上了业务员之路。我是与很多老板接触过后，他们悠悠我创业，我才开始创业的。

    接触什么样的人，什么样的信息，成就什么样的 人生。'
  merge: -1
  img_proc: true
- pgno: 108
  md: '很多人之所以不成功，就是接触的信息太垃圾了，一辈子又舍不得换这些圈子，故而一事无成。你的圈子就跟你读过的书一样，如果这本书对你没有什么帮助，你就应该换一本书；如果这个圈子不能让你发财，你就应该换一个圈子。


    想日赚1000元就收集日赚1000元的案例，想日赚5000元就收集日赚5000元的案例，想日赚3W元，日发货300件，就去收集日赚3W的案例！


    如何收集？你总有渠道去了解到，某某公司日发货1000件，你去看看；某某公司日发货300件，你去了解一下，他们是干啥的。


    我就跑到网络上去搜索他公司的名字，我甚至跑到他们公司去应聘，这些公司的一切信息我就知道了。回到公司，我就让人事主管招聘10个人，开始抄刀他们的项目了，不过现在变成我自己的项目了。以前，我就是这样不断孵化新项目的。


    当然，我现在只做自己的项目了，就是陈昌文读书会和老板社群，这个项目我会做一辈子，不换。


    所以，即使创业初期，我也从来不觉得赚点小钱难，我最怕的是我的时间流逝而已。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '# 19、初级创业者赚钱法


    我谈这些，主要是为了给一些初级创业者建议，少走弯路。


    第一，你要找一个项目，这个项目不可以太复杂，太复杂了你驾驭不了。


    第二，不要去做需要创作、创新的非标准化产品。你还没有干出来，你的现金流就耗光了，三个月赚不到现金，你的团队就士气低落，打散伙的几率就大增了。


    第三，去找一个极其简单、傻瓜的项目，先干起来，去抄袭别人已经赚钱的项目干起来。一定要是自己的人都能搞得懂的项目，先干起来。


    开始创业的时候，尽量做那种不用怎么需要思考就能赚钱的项目。等到你有钱了，团队也磨合好了，可以在这个项目的基础上不断的延伸，找到这个产业链上最赚钱的点去做。'
  merge: -1
  img_proc: true
- pgno: 110
  md: '# 第四，最好是代理别人的项目，直接于推广与营销，这是见到钱最快的环节。


    不要看不起代理，非要自己研发。商业世界以赚到钱为准则，赚到钱就有荣誉，有面子。赚不到钱，说什么，干什么，都无意义。


    # 第五，找一个能够干一辈子的项目，这种项目有积累，不要干那些一阵风的项目，不要做投机者。


    # 第六，从一开始，就要有打造团队的意识。


    马云如果只是一个人创业，他混不了多大的，他有18个人，这个就大猛了。


    随着我们企业慢慢做大，我们就会深深地体会到创始人的多 的好处，因为你可信任的人比较多，你的筹码就多。如果你 富有了，你就搞不清楚哪些人是真心待你，哪些人是图你的钱了。


    # 第七，现在互联网上有非常多的卖知识、卖文化、卖培训、卖资料、卖精神的项目。这些项目，都是成本低的项目，可以干起来。'
  merge: -1
  img_proc: true
- pgno: 111
  md: '# 20、创业最容易犯的两个错误


    创业中容易犯的两个错误：


    第一，低价。


    很多创业新手看到大公司生产一个产品卖得很好，自己也想生产一个产品去卖，怎么卖呢？低价格。很不幸的是，就算你赔本卖也很難撼动行业老大的优势。因为大公司有品牌，有保障，人们已经习惯性的选择大公司的产品了。


    第二，多产品。


    企图靠多个产品测试市场，万一哪个产品卖得好，就卖哪个，卖不好的就放弃。东边不亮西边亮，总有一个产品赚钱。


    实际上就算你有一款产品赚钱，也会被你如此测试搞的没有利润。最重要的是由于你的精力分散，你很难做好一款产品，结果就是都做不好。最好的办法是投入所有资源，做一款最有希望的产品。'
  merge: -1
  img_proc: true
- pgno: 112
  md: '创业最容易成功的路是：选择一个非常小众的市场，避开行业大佬们的锋芒，从边缘介入，并且快速聚焦，单品制胜。

    先赚小钱，再赚大钱，采取农村包围城市的策略。


    # 21、最容易成功的创业套路


    做项目，就是要找一个极小的项目，这个项目提供的服务或者产品，大多数中国人都需要最好。然后我们在这个项目中，找到一个极小的最重要的关键点，把这个关键点做到极致。赚到钱，花钱请人来辅助我们，这个创业的套路最容易成功。


    创业一定要选择一个极其简单的项目、极其简单的赚钱模式。只要一复杂，成功的几率就几何倍数的降低。创业，一开始，就要竭尽全力的做减法。少就是多。做的事情极少，要竭尽全力的把这个事情做深。


    要理性，开始的时候，务实，比如，该推广就直接去推广，自己动手去推广，去熟悉业务，千万不要把希望寄托到别人身上。你把希望寄托到别人身上，一般给你带来的都是失望。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '不要想到去挑战什么，你一开始创业的时候，根本没有资源与能力去挑战什么。


    你就务实一点，我找看，别人做什么项目赚钱了，你就复制过来，推广赚钱就行了。做得过程中，你就会积累到一些经验，然后根据你的经验快速的优化。


    刚开始的时候，自己没多少钱，少些理想主义，少些情怀。很多人刚开始创业，是被情怀打动去创业的，这样的人，一般死的很惨。市场是残酷的，必须要有进账。为情怀买单的人，最后迎来的大都都是悲惨的结局。


    # 不要根据自己的爱好来创业。你的爱好没什么了不起，客户的需求才是重中之重。


    客户需求什么，我们就卖什么，一开始就必须坚持有奶便是娘。卖着卖着，你赚到钱了，你会发现，你以前喜欢的也不是那么喜欢。现在这个赚钱的业务，才是你的最爱。


    或者说，你实在是受不了这个赚钱的业务，那么也等你有了足够的钱，再去“消费”你的爱好。注意我用了“消费爱好”这个短语，大家好好品味一下。


    李嘉诚有一个生意经，有人曾经问李嘉诚：“你为什么做了那么多生意，都很成功，我们中国很多多元化的企业都失败了。你到底有什么秘密？”'
  merge: -1
  img_proc: true
- pgno: 114
  md: '李嘉诚就讲了：“我的秘密就是永远有一个生意，天塌下来也能够赚钱。”


    也就是说，如果我们想去开发新的项目，我们下金蛋的鸡一定要有。大本营在，才有赢的机会。


    # 22、把一个创业公司做好的五个关键点


    第一，你要选择一个能持续赚钱的产品。


    这个产品不管是经济好的时候，还是经济坏的时候，都有人买，甚至不受时代的局限性。比如，农食住行、教育、医疗行业存在着大量的好项目。这些项目，你可以做一辈子。


    最讨厌的生意，就是只能做很短的时间，这段时间过了，这个生意就没有了。你积累的经验、团队甚至都没有用了，又得从头再来。这样的生意我是不可靠的。


    第二，能赚到更多的钱的一个重要特征就是你这个生意容易规模化。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '比如，你是一个医生，你只能看病赚钱。就算你医术非常高明，你每天接待的病人都是有限的，这样是赚不了多少钱的。


    而如果你把你的科研成果变成一种药品，这种药品可以治一种病，然后建立一个团队不断推广你的药品，这样，你睡觉的时候，都可以赚钱了。


    所以，我只做能够快速复制、能够规模化的生意。互联网上，很多生意都特别容易规模化，这也是我建议大家来做互联网生意的原因。


    # 第三，我不做不能预测收入的生意。


    你不要告诉我这个生意做了一年过后，有可能不赚钱了，或者生意行情波动很大。我拒绝把我的钱与精力放到不确定的事物上面去。我是一个追求稳定的商人。


    # 第四，我拒绝初期投资非常大的生意。


    现代社会，已经是知识经济社会了，我们靠知识完全可以赚钱，靠技术也能赚钱。而知识与技术不会有非常大的成本投入，最多就是人员的工资。只要你招聘的确是有工作经验的员工，知识与技术变现是非常容易的。


    # 第五，重视打造团队。


    必须用团队赚钱，而不是靠老板自己赚钱。老板再牛，也'
  merge: -1
  img_proc: true
- pgno: 116
  md: '只能成为小富翁。一旦团队做起来了，在中国这个社会，随便玩点有技术的生意，有10几个大学学历的员工的团队，一年做到上千万的营业额都很正常。而不重视团队，想赚更多的钱，就特别困难。


    # 23、没经验的创业者容易犯的五个错误


    创业者容易犯的五个错误。


    第一，有激情创业，但不懂公司法、劳动法。


    哥们义气用事，把员工当成哥们了，以为员工跟自己一起创业呢。其实员工就是员工，员工是来打工的，不是来跟你创业的。你跟员工之间，必须签订保护公司的法律合同，严格按照合同来执行他们的雇佣关系，否则，你就会陷入劳动仲裁，陷入打官司。


    员工是不会同情任何一个老板的，切记切记。我自己是吃过这个亏的，比如我创业初期，员工的试用期都是给100%的工资，给高工资。但是有的员工不合格，我最后要开除他，他就会'
  merge: -1
  img_proc: true
- pgno: 117
  md: '威胁我，要去告我，要让我赔偿。其实之所以开除他，是因为我招聘他非常亏本，他什么也做不好。要是招聘他不亏本，我当然不会开除他。但员工不会管这些，他只知道让你赔偿他。


    所以，我们必须先与员工签订保护公司的劳动合同，才会雇佣员工，实际上，很多公司都是这样做的。


    # 第二，不要跟员工谈理想，谈未来，谈梦想。


    这些东西跟员工无关。员工是来挣工资的，他们根本不是来谈理想、未来、梦想的。你要求他们按质按量完成工作就行了。不能按质按量完成工作就辞退。


    你如果跟员工谈梦想、未来，你就会进入人梦游状态，以为员工会跟你一起实现梦想，其实你最后会发现，大多数员工都会私下里嘲笑你。


    梦想谈得多了，他们也就不再努力工作了，天天跟你梦游，天天在公司里浪费你的钱而不努力工作。


    对待员工，就是绩效考核，有业绩就奖励，没业绩就辞退。梦想、未来，我们只跟核心层、创业合伙人谈，不跟员工谈。


    # 第三，营销最重要，先拿别人的产品代理，别自己搞生产，搞研发。'
