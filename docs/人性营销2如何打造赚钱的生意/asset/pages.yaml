    如果你制作内容，你会发现你可以用抖音、快手、喜马拉雅FM、今日头条等去发布。各种智能手机美拍、秒拍实际上都是帮你做内容的，也是帮你传播内容的。


    如果你走搭建平台，做互联网技术的路子，实际上代价非常大，竞争压力也非常大，甚至这个路子已经是实力强大的企业的路子了，已经不适合初级创业者了。


    这个时代只要你会做好内容，然后通过这些大流量平台不'
