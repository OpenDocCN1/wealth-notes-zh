  md: '传播信息。你可以选择一个领域，比如，你天天释放文字信息，自然有人阅读。如果你这个信息正好满足了人们的需求，而你长期释放，又有一些收费信息，你正好积累了大量的粉丝，那么自然有人买单的。同理，图片信息、声音信息、视频信息，也是如此。


