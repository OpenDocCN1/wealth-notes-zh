- pgno: 88
  md: '赚到钱，就把自己饿死了。


    三、开始的时候，心不要大，小一些，先赚点小钱，养活自己或者团队，然后再谋划大的。


    四、不要 Zou 父母的钱，也不要借朋友的钱，更加不要借银行、高利贷。


