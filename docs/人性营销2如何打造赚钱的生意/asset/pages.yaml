  md: '# 1、互联网时代最赚钱的就是社群营销


    互联网不不仅仅是一个行业，互联网明显已经颠覆了很多行业。比如传统的报纸行业、媒体行业，比如服装店，比如饭店、外卖，甚至出租车行业。


    互联网行业到底是什么？

    为什么可以影响所有的行业？

    互联网行业本来就是把同类聚集成来相互影响的行业。现在的智能手机基本上普及了，做各个行业的自媒体就是各位发财的机会。


    以前你想做企业宣传、做广告，如果资金充足，你肯定选择中央电视台这种具备话语权的媒体。脑白金、王老吉，这些企业都是靠电视台做起来的。以前的大明星，也是靠电视台捧起来的。


    但现在，这种模式明显行不通了。现在大家都看手机，甚'
