  md: '# 25、1000 个故事足够让你混到财富自由


    人接受信息无外乎六根，眼、耳、鼻、舌、身、意。我们传递信息最有效的方式，也不过乎文字、声音和视频。把这三种做好其中任一个，我们都能够赚到大钱。那么网络时代，如何利用文字赚钱？


    在这个社会上，依靠文字赚到大钱的人有很多人，比如唐家三少，比如金庸，比如古龙。比如说你做网络培训，不管你是搞网红培训，还是做家教培训，或者是在网络上搞金融培训。你到网络上去搜索
    1000 个软文文章，改编成自己的，你让十个人去疯狂推广，一个月内招到 100 个学生，培训班定价 5000 块一个人，那么，利润就是 50 万人民币。


    如果你在行业内真正收集到了 1000 篇软文、1000 个招生文案，那么你对这个行业已经彻底熟悉，你自然就知道如何去操作，如何去吸粉，如何去赚钱了。'
