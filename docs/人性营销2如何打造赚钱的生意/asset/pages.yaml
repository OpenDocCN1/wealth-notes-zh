    # 9、微商营销的 5 点经验


    微商营销的 5 点经验。


    第一，想要持续性的吸粉，你必须要有个特长，这个特长要持续性地对别人有帮助。


    比如，你会讲如何混社会，你会讲如何赚钱，你会讲如何创业，你会讲如何做微商。反正，就是必须对大家有好处，大家才会持续性的关注你。


    商业的本质是交换，我们必须拿出我们有的与客户换钱。


    如果你没什么特别的，你要想尽办法弄一个特别的技能出来。你甚至可以分享你的成长经历，如果能激励到别人，也是有用的。


    第二，脑袋里必须有货。


    想要做好吸粉，你脑袋里必须要有货，这就要不断的学习。自己脑袋里的东西迟早会转化成金钱，永远不要怕白学了。'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 第三，要有助人心态。


    要想吸粉，还必须要有利他心态，就是你一直在帮助你的粉丝。你不要只会推广你的广告。你只要不断的帮助粉丝，总是有一些粉丝会为了获得服务而付费的。


    很多人非常急躁，不愿意付出，直接发广告，就想让粉丝买单，这基本上是不可能的。朋友圈没有利他心态，你一定是玩不起来的。


    # 第四，亲民。


    吸粉的东西不一定要求高大上，亲民最重要，一定要让你的粉丝懂你在说什么。千万别让粉丝来理解你，粉丝没有心情，也没有义务来理解你。他们理解不了你，只会拉黑你。


    # 第五，打造信任感。


    如果粉丝问你的产品或者服务多少钱，怎么卖的时候，尽量用语音回答，千万不要只会打字，打字没有什么信任感的，而语音有信任感。


    如果可能的话，养成打电话的习惯，养成接粉丝电话的习惯，这样成交率就会高很多。当然要注意有些人是故意来搞乱的，他们不会买单，他们是来浪费你的时间的。所以，要严格控制与陌生人的通话时间，比如3分钟就必须挂电话。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '# 10、做微商的三点心得


    做微商的三点心得。


    第一，养成品牌化的习惯。


    你别只顾卖你的产品，只卖产品，你就很难卖到高价。你必须告诉别人，为什么你的产品与别人的不一样，你这个是牌子货，有品牌的，有质量保证的，与众不同，故而贵一些。如此做生意才有溢价。


    有的人会讲我这个并没有什么特别的，跟别人的东西一样，如何品牌化？没有关系，你写几条与众不同之处施行就行了，重要的是这个仪式，品牌就是一个仪式。


    第二，天天都要学习销售话术。


    销售话术是在别人的竞价页面、别人的公众号、同行的微信上面学到的，而不是在书本上学到的。我们从同行那里学到了话术过后，就马上要改成自己的，马上去实验。'
  merge: -1
  img_proc: true
- pgno: 154
  md: '老板千万不要指望招聘几个做微商的员工，就能把微商做起来。他们要是有本事做微商，他们自己就去干了，也不会来给你打工了。只有老板自己会销售话术，才能卖产品，才能带团队，否则招跨过来的都是赔本货。一般情况下，你从市场上招跨过来的人只能做些辅助工作。


    # 第三，不断优化自己的营销软文、营销视频、营销网站、营销微信号。


    如果你不优化，你的营销能力就不能提升，你的赚钱能力就不能提升。


    要相信永远有提升的空间。


    # 11、赚钱的逻辑


    其实天下下赚钱的逻辑都是一样的，和医生见客户说的都是一套话语。


