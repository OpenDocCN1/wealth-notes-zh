- pgno: 123
  md: '第三，你必须养成收集同行优秀软文的习惯，甚至把这些文章都收集藏起来，日日夜夜的去看。


    读多了就写，写累了要继续读。建议大家去买一些有益的书籍和一些专业的教程去看一看。这些文字都非常好，也很有威力。读多了，你的文章自然也就所向无敌了。


