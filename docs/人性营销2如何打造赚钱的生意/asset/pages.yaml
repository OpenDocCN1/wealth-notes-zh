    中国这个社会，想创业的人很多，但有想法能踏踏实实去落落实的人并不多，所以中国社会看似竞争激烈，实际上根本不激烈。


    我创业成功，根本不是我太强，而是对手太弱。比如，坚持做好一件小事，每天写一篇关于创业的文章，就很少有人能做到。而你只需要做到这一件事，你就能成为千万富翁。当然，你这篇文章最好是解决了一个具体的社会问题，在一个具体的'
