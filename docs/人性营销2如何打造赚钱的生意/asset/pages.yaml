  md: '# 只探讨赚钱的真理，不参与无谓的争论


    赚钱的人，都想做很多常人想象不到的工作，做很多常人

    想象不到的项目。


    如何成为一个赚钱的达人？就是不停的优化项目。如果你

    没有项目，就是不停的找赚钱的门路，永不停歇，一直找，一

    直找。找到了过后，就一直优化这个项目。我一直强调死磕精神，

    逮住一个项目，死磕 3 个月，拼一把先看一看情况。


    赚钱，就是选定一个极其小的细分领域，而这个细分领域

    又可以交给任意一个人。任何一个互联网项目，只要我给出了

    方向与大框架之后，你都可以通过自学获取利润。大家之所以

    赚不到钱，就是因为没有赚钱的方向与框架。


    赚钱就是你喜欢干什么，然后你就赌一把的时间与精力

    去干，别换。为什么有些人不赚钱？就是一会儿喜欢这个，一'
  merge: -1
  img_proc: true
- pgno: 3
  md: '会儿喜欢那个，到头来自己都把自己搞糊涂了，搞不清楚自己喜欢哪个了，自然就不赚钱了。


    人还是现实的动物，你必须真正做有益于大家的事情，大家能感受到，才愿意与你交往，与你做朋友，客户才愿意买单。别玩手段技巧，虽然我也讲手段技巧，但最厉害的人是踏踏实实做事的人，是一心一意修炼内功的人！


    最厉害的人是不用技巧的，他用一颗诚心做事，就是我真诚的为大家做出有价值的贡献。我不用说怎么，自然有识货的交钱，这就是营销的最高境界，无营销。大家也可以尝试这种玩法来赚钱。


    格物致知诚意正心，修身齐家治国平天下！

    其实，商业的精髓被我们古代这些思想家讲透彻了，跟著做，赚钱都是易如反掌。


    赚钱吧，人要现实点，才能品味人生，活的有尊严。轰轰烈烈干几年，积累到一定的财富，然后再想其他的。只探讨赚钱的真理，不参与无谓的争论！


    陈昌文

    2021 年 5 月 28 日于上海浦东'
