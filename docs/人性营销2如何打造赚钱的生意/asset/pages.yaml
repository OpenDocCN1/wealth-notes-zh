- pgno: 80
  md: '# 3、你所看到的一切，本质上都是广告，都是消费信息


    很多人找不到项目，我告诉大家找项目的方法。


    举例：我们打开天涯任意一个板块，我们都能看到热帖。

    你耐心的读一读这个热贴，找一找发布起来的联系方式、资料什么的，你或许就发现了他的QQ、微信，然后你加过去，一般情况下你都可以看到对方的身份信息。没错，这就是一个项目。


    同样的方法，可以在当下火热的小视频平台，比如，抖音、快手，甚至音频平台，如喜马拉雅FM，找到项目。

    天下熙熙皆为利来，天下攘攘皆为利往。你所看到的一切，本质上都是广告，都是消费信息。无利不起早，没有人会干不赚钱的事情，特别是高人。


    能把一个帖子或者视频炒热的人，其实都是做项目赚钱的，也就是说凡是在网络上入我们眼的帖子或者视频，十有八九就是一个项目。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '你找到这个项目的同时，也就找到这个软文，然后你就可以复制这个软文，你也可以复制他的朋友圈、他的 qq 空间、他的微博。同时你也可以再通过百度下拉关键词找到一些同行，然后就可以复制这些同行的软文、视频，你也可以推广这个业务，开始赚钱了。


    开始赚钱的时候，不要把自己的服务做的很多，只选一个搜索量大、指数高的服务来做。把这一个服务做到极致，你就能赚大钱。


    开始做项目的时候，一定要找一个极其简单的项目来做。凡是复杂的项目我们都不要碰。所以我一般都推荐新手玩虚拟服务，因为虚拟服务没有任何成本，不需要资金，只要努力做，出单了都是纯利润。而实体产品一般垫资都非常大，会给新手造成非常大的心理压力、创业成功的可能性变小。


    开始做项目的时候不要养员工，发工资。因为你没有养员工的经验，你甚至连什么样的员工是合格的，都不能区分出来。

    这个社会上有很多人在找工作，然而很多人根本不是一个合格的员工。由于你没有经验，可能招到很多混饭吃的员工，那么你的失败几率就变得更大了。


    开始做网络项目，一个人上路反而更容易成功。如果实在'
  merge: -1
  img_proc: true
- pgno: 82
  md: '孤独，你可以招聘一些创业合伙人。这些人是不发工资的，只给高提成，这样可以调动他们工作的激情，成功的几率就大一些。


    # 4、发家致富的关键指标——增长率


    谈创业，必须谈项目的选择。我有很多方法可以选择项目，不过那太复杂了，给大家最简单的，就三个字——增长率。这几乎决定我们是穷一辈子，还是有机会富有的根本。


    现在很多家伙一谈创业，都在想，我去开个饭馆吧，我去卖奶茶？这些项目就是没有增长率的项目的典型代表。


    比如开个饭店，这个地区附近的人稳定在这里吃饭的，永远有一个很快就会到达的天花板。这是一个眼望望到头的生意，赚不了大钱。


    有人说连锁饭店，对！连锁饭店确实有赚大钱的，但是开连锁是需要极大的管理能力的。


    其实我们重新选择一个地方开饭店，就又相当于开始在一'
  merge: -1
  img_proc: true
- pgno: 83
  md: '个新地方创业了。这个增长率同样非常小。


    什么叫增长率呢？比如，我开个网店，或者微商，我推广两个月，有5个客户，我推广4个月，有8个客户，推广1年，有20个客户，再过一年，我有40个客户，再过一年我有150个客户，这就叫增长率。


    也就是说，只要一直干这个项目，客户的增加速度非常快，并且没上限。虽然会有流失顾客，但是一般顾客总量会稳定增加。


    投资界的高人们都是非常注意这个指标的，如果一个企业没有增长率，就经营的再好，也没有投资价值。


    开饭馆还不如到小区里搞垃圾回收呢！虽然臭，没啥面子，但是只要我愿意，在我的能力范围内，我可以找几个业务员不停的拜访各大小区的物业，可以非常迅速的扩张。


    有非常多的没有增长率的项目，干起来的话，赚到的钱只能往银行里放，或者买房子。而有增长率的项目，摸索出了好模式，只要想借钱，而更好玩的是，银行也非常愿意借给我们。这样你就明白了，为啥很多大企业老是有银行借钱给他。


    互联网行业在当今社会就完全符合增长率这个概念，所以互联网行业出现了非常多的新贵，很多人不知不觉的选择了具'
  merge: -1
  img_proc: true
- pgno: 84
  md: '备“增长率”的行业，但是也有人就是拼命的去干那些没有增长率的行业。


    生意最有意思的地方就在增长率，我给出几个数字大家就明白了。


    假如每月赚 100 万，也就是每个月要赚 8 万多，很多人觉得这个数字很高，实际上很多纯粹在企业里打工的人都能做到。


    如果做项目每月 8 万，那我们保守假设 40 万，也才 20% 的利润，而每月到 40 万流水的项目，实际上一抓一大把。当然这都不是我想说的，我想说的是增长率为
    0 的话，赚够 1000 万，需要 10 年。而如果增长率为 30% 呢？只需要用五年时间，就超过了 1000W，而年增长率 30% 根本算不得什么！


    很多初创企业开始的时候都是达到百之几百的增长率。我希望大家明白选择有增长率的项目是多么重要，要不然，你累死也不知道你啥时候就是不能富。这就是发家致富的关键。


    其实大家如果会变通的话，连打工也都知道选择什么样的 工作干了。如果大家打工的那份工作，没有增长率，如果你不换， 注定屈居一辈子。


    选择有增长率的项目，大家体会到什么叫做爆炸式增长。


    假如哪个项目没增长嘛，斩立决，果断放弃。'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# 5、赚不到钱的三个主要原因


    # 第一，你没有自己做一个具体的项目。


    你没有做一个具体项目的概念，你只会打工，只会被动的让别人指挥你。改变很简单，找一个具体的、简单的项目做起来。网络上有很多这种项目，自己去找。


    # 第二，找到项目以后，无执行力。


    就是看着项目发呆，手上不愿意动起来，不愿意做推广，老是说自己的营销能力不行。这个问题，对不起，办不了，钱就是靠推广赚来的，就是靠营销赚来的。如同你要脸上干净，就得经常洗脸一样。你说，我就不洗脸，我就要脸干净，这是不可能的。也就是说，你做不到天天推广，天天搞营销，你就不能赚到钱。


    # 第三，你不够专注，你没有在你的特长上专注。


    这两个问题，其实是一回事。只要你专注了，才会有特长，才会有擅长的地方。而人呢，总是习惯性的在自己擅长的地方'
  merge: -1
  img_proc: true
- pgno: 86
  md: '非常专注。只有专注了，才能超越竞争对手，才能在激烈的竞争中获胜。


    你很难做很多事，然后把很多事都做好。真正的高手，就是把自己的精力专注在一件极小的事情上，然后把这一件事情做到极致，然后把这件事情营销出去，就赚到钱了。


    老干妈、苹果公司，都是典型的例子。华为公司也是这个哲学。我们做互联网营销也要用这个哲学。


    # 6、普通人创业，一开始最好不冒险，做点有保障的事情


    普通人跟富二代、官二代不一样。因为自己家里穷，没什么底子，也没什么关系。所以，创业富二代可以做实验，可以失败几个项目，可以几年不赚钱，也不着急。而普通人，本来就没钱，又找人不起。所以，必须做零成本、低成本的项目。


    如此，我就推荐普通人做中间服务，或者卖技术，卖智慧，'
  merge: -1
  img_proc: true
- pgno: 87
  md: '或者卖互联网上的虚拟产品。先集中精力赚小钱，钱赚到手了，能养活自己，就koliko可以赚大点的钱，或者开始养团队。

    如果一开始就瞄准大钱去赚，没有赚到，自己就饿死了。


    选项目，要看看自己的人生经历。哪一块自己最熟悉，有把握，就干哪一块。自己有上百万的积蓄了，也有团队了，就可以做一些其他项目的尝试，万万不可以刚创业就到处试错。所以普通人一开始最好不冒险，做点有保障的事情。


    我还建议普通人不要为难自己的父母、朋友，让他们借钱给你，或者支援你。你想一想，你是普通人，你能有创业的雄心，其实已经比他们优秀了，而他们，情况可能比你还糟糕。

    你创业失败了，找他们还有一口饭吃。若是你把他们的钱也透光了，你失败的时候，可能就意味着看没脸见人，你的压力会非常大，经济压力、心理压力。


    现在到处都在鼓励你借贷，有的创业者就去借银行，或者别人公司放出来的钱。这是非常危险的。你自己本来就没有什么是创业经验，马上就背这么大一笔债，简直就是找死。


    所以，普通人创业要注意，

    一、做零成本、低成本项目，自己能负担得起投资。


    二、做回 报快的项目，别做那种很长时 间 的项目，还没'
  merge: -1
