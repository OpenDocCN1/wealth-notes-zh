- pgno: 240
  md: '# 18、商人的世界，就是故事的世界


    人们喜欢听故事，你要是讲理论，只有极少部分精英喜欢听。

    有阅历、有能力的人，他们更喜欢听纯粹的理论，直接理解这个事物的规律就行了，因为他们要节约时间。但是我们搞营销，卖东西，不是要卖给这部分精英。很多时候，我们的受众都是那些普普通通。


    普通人最喜欢听绘声绘色的故事，特别是各种屌丝逆袭、各种励志故事，他们喜欢听。于是，我们卖一个东西，就要给人各种各样这种他们喜欢听的故事。卖产品最好的方法，就是卖情感链接，有了情感链接，我们才能卖高价。这就是为什么有人说，树立品牌，就是讲故事的原因。


    社会上一切出名的人、一切出名的公司、一切出名的产品，几乎都伴随着非常动人的故事，而这些故事，都是故意包装出来的。不管是企业家的创业故事，还是明星的成名故事，还是爱迪生发明电灯的故事，他们都是经过精心策划包装的。就算'
  merge: -1
  img_proc: true
- pgno: 241
  md: '你说这个故事是真的，也只能说明故事营销大法非常好用。因为人们就喜欢听这样的故事，而且只能记住故事，很难记住纯粹的理论。


    娱乐圈这些明星，不管是正面的，还是负面的，从某种程度上来说，都是善于讲故事的高手策划出来的。你这个故事跟人类的情绪链接越强，人类越容易记住，只要记住你，就有买单的可能，于是，这些主角也就富了。


    所以，如果你想发财，你就要善于用故事包装你这个人，用故事包装你的品牌。那么，你在网络上做生意，我告诉你一招，其实很多人都在用这招，只是大家没有说破而已。就是你在百度里去搜索你这个行业的故事，每天收集
    20 个，看着那些故事自己用得上，就把这个故事根据自己的实际情况，改编成自己的。然后到处去宣传。你就会发现，效果特别好，特别是做互联网生意，这一招特别好用，肯定会给你带来极大的名声。只要有了名声，就有了销量。


    所有的炒作大王，几乎都会用这一招。故事好，名声就大，销量就高。一个不会讲故事的人，不是一个好商人，也不可能做好营销。商人的世界，就是故事的世界。'
  merge: -1
  img_proc: true
- pgno: 242
  md: '# 19、按照这 4 个策略做一个品牌，其实很容易


    很多人都想做一个品牌，苦于不知道如何做一个品牌。我给大家讲 4 点做品牌的策略。


    1、你要不断的宣传你的名字，让人记住你的品牌名字。


    一个名字重复的次数越多，持续的时间越久，人们就不会忘记。只要人们不会忘记，你就可以形成一个品牌。


    2、虽然人们记住了你的名字，但是不知道你的商品的功效，是不行的。第二步，就是天天宣传你的商品的功效。不要宣传非常多的功效，只宣传一个点。只宣传一个点的商品，容易让顾客记住，这就是聚焦战略，这就是集中力量做好一个点的思想。


    比如，格力空调宣传掌握核心科技。比如，海底捞就聚焦它的服务。只做好一个点，这个点就能形成自动传播，大家口口相传。


    3、不断的找购买理由，不断的告诉顾客买你这个品牌的好'
  merge: -1
  img_proc: true
- pgno: 243
  md: '处，诱惑你的顾客冲动消费。只要一个买了你的产品，他就会成为你的活广告，这样，你的品牌建立就会事半功倍。


    # 4、结合传统文化宣传你的品牌


    一个品牌，最好不是孤立的，一定要有历史原型。有原型的品牌更容易让人们记住、接受并且买单。


    例如，猪八戒网站、苹果公司。猪八戒，与苹果这两个词， 都是有历史原型的。阿里巴巴也是有历史原型的。


    这些品牌的建立，不是孤立在历史文化中的，而是很有深厚的历史文化背景。如此，人们就更加容易信任与买单。并且，有深厚的历史文化，也会节约非常多的广告费，企业家不用再去开发人们的大脑接受这个品牌名字，只需要做好嫁接与转移历史财产就行了。


    # 20、在网络上获得用户信任 13 条


    如何在网络上获得用户的信任？

    很多兄弟都在问我，在网络上别人不信任我，很难成交，'
  merge: -1
  img_proc: true
- pgno: 244
  md: '如何办？我就来给大家讲一下如何获取网络客户的信任。


    首先，你要买一个7位、或者6位的QQ号，Q龄10年以上。


    二、你的QQ号要充上年费会员，要买黄钻。当然充的年费越多越好。


    三、要有自己的微信号，头像与QQ号一样，并且常年更新。不能让用户进来一看，你这个QQ、微信是刚刚打造好的，至少要让他看到两年以上的信息。


    四、打造一个微博，能开会员就开会员。所有的地方，都用同一个头像。


    五、做一个自己的官方网站，所有的信息都要真实。你的真名、你的电话号码都必须统一，而且真实。如果你有条件，就装一个固定电话。


    六、如果你有钱，就买一个手机靓号，这也能提高你的成交率，让用户知道你有实力。


    七、在淘宝上找人帮你做一下互动百科、搜狗百科、360百科，百度百科能做也做了。这些东西能提高权威性。'
  merge: -1
  img_proc: true
- pgno: 245
  md: '八、百度知道，你是一定要抽精力去做一些问答的。筛选一些对你有利的问题答上去。


    九、每天都要不断更新成功的案例，让用户能看到你的成功案例。


    十、每天做一些视频，上传到流量大的小视频 App 上，或者土豆、爱奇艺、优酷、腾讯视频上面。


    十一、在淘宝上找一些新闻源推广。花钱做一些新闻源推广，你的信任度就更高了。


    十二、任何渠道，都要用统一的名字、统一的收款方式、统一的价格、统一的头像。


    十三、支付宝、微信支付、财付通、建设银行、农业银行、工商银行都要开通，整齐的放在你的广告后面。这也能提高信任。


    把上面这 13 个步骤都做好了，你做任何一个网络项目，成交率都会提高好几倍。'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 21、一个成熟的人讲的每一句话，都是对自己有好处的


    你想在网络上形成品牌，你骂人也可以，炒作也可以，但我建议你只宜传正能量。只帮助人，不要与人结仇，不要说别人坏话。一个种什么因，就得什么果。


    比如，别人错了，你就骂别人，别人不舒服，也会让你不舒服。而且脏脏的词语会进入你的记忆，会污染你的头脑。


    我以前就喜欢骂人，结果，别人就想尽办法骂我，我的生活也就会被这些骂我的人影响。所以，以后，别人错了，我是不会指出来的，我只讲好话，只讲正能量的话，只讲对别人、对自己都有好处的话。这样，所有的人都会说你好。


    做慈善的、做公益的，都是这种套路。这种套路，对自己非常有利。一个成熟的人，讲的每一句话，都是对自己有好处的，都是增加自己收入的，绝对不会快意恩仇，去得罪人。'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# 22、做项目的过程，也是谈恋爱的过程


    不管是谈恋爱，还是做生意，还是生活中大大小小的事，都离不开个人营销。谈恋爱，就如同做项目。

    我们每个人都在营销自己。在社交中，我们做的就是这件事，无非就是获得别人的认可。


    世界上，所有的事业、生意、创业、社交，都跑不下下面的五个点。


    +   第一、要有流量；

    第二、要有产品；

    第三、要做好营销；

    第四、跟踪销售；

    第五、维护顾客关系或者说是售后服务。


    比如，我们要开一家店，首先得有门面吧，门口来来往往的人有多少，这叫流量。流量的意思就是有多少人能看到你、关注你，在互联网上叫做你能吸引多少粉丝！'
  merge: -1
  img_proc: true
- pgno: 248
  md: '开店总得有产品吧，没有产品你卖啥？产品就是你能给看到你的人提供什么。现代社会竞争激烈，酒香还怕巷子深呢，东西再好，门口走过的人看不到，不想进来，也没用，所以要做营销。营销就是吸引在门口走过的人，进来看看。广告的目的就是营销。进来看看之后呢，得有人接待啊，这就是销售，不然怎么成交？


    互联网的销售，包括了如何做客户服务以及聊天的话术。销售不必多说，让顾客认可你的产品，并为之付费。付费之后呢，当然还得有售后维护。售后服务就是和成交的顾客维持一个关系、人脉，也是钱脉。


    为什么要做售后维护，因为这会产生口碑效应，你做得好，别人就会一传十、十传百，就有更多的人买单。你做的差，当然买单的人就少了，甚至要求你退款。当然，你努力地做好售后服务，顾客还会重复消费。


    这五点做好，生意绝对不会失败。失败就是其中的一个或几个做得不好。下面我来讲讲谈恋爱的理论，也和做生意、做项目一样。可能你觉得明明自己挺优秀，怎么就没有女朋友呢？并且感觉老天真不公平！


    发现问题了吧，你再好，没有女生看到也没有什么用。也'
  merge: -1
  img_proc: true
- pgno: 249
  md: '就是第一步，没有流量。所以，我经常教育我的学员不管你想什么办法，都必须解决流量问题，没人看到你，你如何让别人买单？所以你会看到工科学校的女生比较高不可攀，虽然工科的女生一搬情况长得不怎么好。而文科学校搭讪男孩都能追到美女，就是因为工科学校男生流量大，文科学校女生流量大。所以，你去文科学校找女朋友，不仅仪长相好，选择面大，而且成交率高。


    流量问题该完了，我就谈产品与服务问题。对于男生来说，你是谁，你能提供什么，和你在一起体验如何，这些都是决定你能和什么样的女生在一起的重要因素。男人重要的是生存价值，也就是说你能不能给女人，还有孩子，一个安稳的家、良好的生活。所以男人，你必须得有事业，说不好听的，就是钱啊，没钱谁和你玩？好好赚钱吧。


    但光有钱还不行，还得有形象。形象是最容易改变的，也是不容易改变的，没有审美的话，自己找个有审美的朋友帮你挑几件衣服，到理发店去做个发型。然后就是练习气场，气场这东西，躲不了的。要去练习，练习演讲，练习和陌生人讲话。当然，期间必须经历被嘲笑、紧张带来的焦虑，这些也是躲不掉的。就如同我们刚开始做销售的时候，打电话，又紧张又焦虑，但是经过刻苦的训练，到后来上台演讲面对几百人，也气定神闲了。'
  merge: -1
  img_proc: true
- pgno: 250
  md: '然后就是内在，至于内在，也就是情商，更是需要去经历才能学到。需要你多交朋友，经常与人互动，才能感受到情商到底是什么东西。


    接下来要干的事情就是找你心仪的女生聊天。聊天就是把你销售出去的一个过程。人家不搭理你，可能是因为你微信头像、朋友圈没有一点能吸引到她的地方！稍微好看点的女生，后面一堆男的围绕着，每天都有很多男的经常问她的，干嘛呢？在么？这样的聊天方式烦不烦？没有一点新意，一看就是混社会失败者的聊天方式。


    很多男人喜欢装坚强，其实男人最好不要装，在男人面前坚强就好，在喜欢的女生那里，适当的展示脆弱，反而能激发她们的母性。女人内心里是想要我得到一个她想照顾一辈子的男人。


    认识的时间越久，在一起的几率就越小。聊得越多，死得越快。快速推向成交，快速让客户买单就是销售的目的。

    女生不想买单很简单，冷冷的对待她，然后展示自己有价值的地方。成交这个步骤，能搞定你的客户，你就能搞定女人。成交过后的维护其实是最考验你的实力的。


    你没有钱，没有事业，没有价值，你是赘进那个圈子的。

    男人要有价值，要努力提升价值，去赚钱，去做事，去提升气场，不找借口，去积极面对。所以谈恋爱就如同我们生意人做项目'
  merge: -1
  img_proc: true
- pgno: 251
  md: '一样，会做项目的人就会谈恋爱。


    # 23、如何理解九零后的消费特征和理念


    九零后不是一代人，而是一类人。要想打动九零后，需要深刻的理解他们，洞察他们的潜在心理需求，从他们的价值观、情感需求、消费观念、对品牌和产品的偏好入手，制定完善的沟通机制、定价策略、内容与渠道，而不是简单的排斥他们是
    不是新潮，追求酷和时尚，就贸然地去迎合这些表象。这样一 来不成功是必然的。


    九零后群体崛起绝不是简单的又一代人的成长，九零后与 八零后、七零后有本质的区别。九零后是真正互联网一代对这 个社会的全面接管，九零后有别于以往年轻人，有以下四个特点。


    第一，他们不是统一型号的社会产品，拒绝被标签化。


    想用统一的标签定义九零后群体是一件非常困难的事情。 某种单一的社会评价对于定义鲜活生动的九零后显得非常的无 力。拒绝标签化是九零后最大的共性，他们每个人鲜活的个性'
  merge: -1
  img_proc: true
- pgno: 252
  md: '都是无法复制的。与其他的几代人相比，九零后的个性是突出的、鲜活的。而从每个个体去看，九零后的个性是多元化的、差异化的，在群体内部处处彰显着不同的个性，不同的张力。


    有的人是杀马特，有的人是非主流，有的人又很规矩，这就是九零后最大的个性。因此找一个具有普世价值观的标签来概括这个九零后群体的难度系数极高。更复杂的是，九零后甚至对个性的认识也存在差异。


    # 第二，九零后是指尖上的一代。九零后是互联网的一代，他们从出生就开始接触到互联网。


    在对待互联网的态度上，九零后群体普遍对于互联网产生了新的依赖。同时随着年纪的增加，九零后对网络作为工具的应用也越来越娴熟。九零后群体正在过着一种链接的生活，即随时随地的上网生活，高度的依赖网络。他们中有四分之三的人，网龄超过五年，平均每天花费百分之十八的时间上网，而一般中国城市居民平均只花费百分之十三的时间在网上。而且这个数字会逐年增高。


    对于他们来讲，互联网已经不仅仅是一个工具，而是一种生活方式。九零后群体将会是移动互联网发展的关键人群。据九零后的数字生活研究报告显示，受访的百分之八十六的九零后都是通过手机上网。'
  merge: -1
  img_proc: true
- pgno: 253
  md: '九零后大学生更易接受移动互联网这样的新事物，所以我们做互联网生意的，要特别注重移动互联网。不做互联网生意的，也要开始关注移动互联网，这是一个趋势，不可抗拒。


    # 第三，九零后的消费观是只要我喜欢，九零后有鲜明的自我意识，他们坚持自我，在认定的事情上不会轻易的妥协。


    在日常的消费生活中，“我”是最优先考虑的因素，我想要，我喜欢，适合我。他们在消费上强调自我的重要性，同时也通过消费来满足自我。


    但是他们当中很少有人会进行冲动消费，在大多数消费环境当中，他们都表现出颇为理智，而且他们喜欢新鲜事物，会做一些低成本的尝鲜消费。


    品质是九零后最看重的商品价值，要特别指出的是九零后群体对品质的认知是通过品牌和价格来完成的。


    品质可以从品牌当中体现出来，包含两层意思，首先，买品牌更有质量保证。其次，名牌比普通品牌更有品质保证。品质可以从价钱中体现，一分钱一分货，这种传统的消费观念仍得到不少九零后的认可。


    # 第四，自我的觉醒。


    九零后的自我意识开始觉醒，由此带来的一neal直接的效应就是人的思想不再拘泥于传统的责任意识，而是更多的从自我'
  merge: -1
  img_proc: true
- pgno: 254
  md: '出发，以个人价值权衡。另外，九零后一代代表自我的意愿更 为强烈，一方面他们借助互联网工具上传照片、视频、日志来 展现自己的生活，另一方面九零后日常的学习和生活也更具表
    现力。


    虽然九零后比较关注自我，但是他们更加尊重人的个性和 自由，对于不同的观念和行为表现出更多的包容。同时也是富 有创新精神的一批人，也是富有创造精神的一批人。他们对新
    鲜事物充满好奇心，他们也有能力去创新。对新事物、新思想 的接受程度及开阔的视野，也使他们有能力提出正确的见解， 参加家庭消费决策。


    也就是说，九零后善于利用互联网，以至于他们很多决策 都比八零后、七零后正确，这个是时代的进步，是科技的进步。 而很多八零后、七零后、六零后还认为九零后是落伍的，是没
    有竞争力的。真怡恰好与这些八零后、七零后的认识相反。


    那么如何营销九零后？我认为主要战场是移动互联网。九 零后不是另一代人，而是另一类人，他们生长在互联网，对他 们进行营销必须有所创新。


    在生活和消费层面，九零后更在意“圈”和“群”这类网 络群体的意见。所谓圈群不是传统营销传播中对消费者细分 的用语。'
  merge: -1
  img_proc: true
- pgno: 255
  md: '在现如今的数字生活空间，不注重这些变化，就意味着不能真正了解目标消费者的需求。网络传播形成的超越时空的虚拟小群体，在某种意义上比现实的消费者细分得更为聚焦和纯粹，对品牌传播的直达非常有利。解决问题的关键还在于找到与九零后的沟通方式，与他们建立紧密的情感链接。


    针对极度推崇个性与自我的九零后群体，传统的媒介已经逐渐丧失了话语权。怎样的营销方式才能打动他们呢？九零后群体喜欢标榜个性，重视原创，乐于跟随潮流，敢于接受新的事物，欣赏具有文化内涵的产品，热衷网络文化，特别是移动互联网、手机、运动、竞技，重视同学、朋友的情谊，参与体验的过程和乐趣。


    在面对九零后群体时，过去那种只是投放几招幽默风趣或是狂轰滥炸的明星代言广告已经行不通了。要想打动九零后，最好的办法就是与九零后零距离的接触，让他们体验产品，体验品牌、企业文化。他们需要获得亲身体验后的快感，才考虑是否跟你成交。


    总结一下，想要营销九零后，以及找到营销九零后的密码已经近在眉睫。九零后的崛起将影响中国未来十年的消费市场，这是无法避免的。创业者或者是企业不在今天培养用户，明天就要花大价钱去抢用户，今天不打品牌战，明天就要打价格战。'
  merge: -1
  img_proc: true
- pgno: 256
  md: '九零后正是消费者由产品消费向品牌消费转化的阶段，面向九零后的消费体验会影响九零后群体日后人生的消费选择。因此这个时期也是培养消费者品牌忠诚度的重要阶段，企业如果忽视这个阶段培养潜在用户，很大程度上就意味着企业将丧失未来市场的话语权。


    **成功的品牌与失败的品牌的区别，就在于这个企业是否有良好的心态，舍得在研究与理解未来的市场，也就是九零后群体身上花时间开给他能们喜欢的产品。**


    # 24、如何经营一个社群


    如何经营一个社群？


    **第一，制造话题性事件才有营销性，才能让人记住。**


    比如，你与一个圈子里的人互动，然后把这件事情用文字记录下来，用图片记录下来，传播出去，大家对你的记忆力就够深刻。


    **第二，要在大庭广众之下点名表扬人。**'
  merge: -1
  img_proc: true
- pgno: 257
  md: '你经常点名表扬这个人，这个人就会记住你，才有营销效果，其他人也会记住你，也会记住你表扬的那个人。


    # 第三，要叙述为什么表扬这个人，为什么讲这件事？


    习惯性地讲因果关系，讲原因，更能让人记住你。

    人们总是希望知道一件事的原因，人生就喜欢八卦。


    # 第四，持续性地讲故事。


    讲发生在自己边上的故事，讲你圈子里的人的故事，要把所有人链接在一起。如果你能跟你的粉丝用故事链接在一起，那么你们这个社群就会越来越有前途。明星就经常用这一招，我们一定要用起来。


    # 第五，一定要有个共同的主题，而且只能有一个共同的主题。


    你千万要经得起诱惑，不要觉得其他主题好，你就去讲，就去引导粉丝。做两个或者两个以上主题的后果就是，粉丝对你的关注度降低，粉丝不知道你是什么的了，你自己也会分散你自己的精力，最终一个都做不好。太阳光只有经过聚焦才能点燃木头，没有聚焦的太阳光，毫无威慑力。


    # 第六，制造让你的粉丝付费的话题。


    只有付费的爱才是真爱，毕竟我们都要养家糊口。赚钱天经地义，没什么不好意思的，只要我们不断的释放价值，对得'
  merge: -1
  img_proc: true
- pgno: 258
  md: 起粉丝就行了。
  merge: -1
