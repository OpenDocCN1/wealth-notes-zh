  md: '# ／

    人性营销

    ／

    第四章


    现代企业的营销很大程度上涉及了心理学、行为学，特别是是互联网，简直就是深入的研究了人的心理学与人性。

    ——陈昌文'
  merge: -1
  img_proc: true
- pgno: 203
  md: <!-- no content -->
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 1、我们打磨的产品必须与人们的生存和交配欲望挂钩


    根据马斯诺需求层次理论，人类的需求依次是先满足生理需求，再满足安全需求，再满足社交需求，再满足尊重需求，最后满足自我实现需求。


    马斯诺的理论是，前一微需求被满足，人们才会诞生下一级的需求。意思就是，你饭都吃不饱，肯定是找饭吃，不会想到找女人，所以中国古话讲，饱暖思淫欲。先有饭吃，能穿的好，才想我配偶交配。


    所以，人类的基本需求，就是吃饭 + 交配。


    这个理论，我们可以运用到商业上，到底做什么样的产品最有市场。读懂这个理论，你就能设计好你的产品，赚取利润。


    首先把这个理论进一步优化，需求，并不代表市场，有购买力才能形成市场，有需求只是会让人产生购买冲动。如果目标的购买力已经满足了上一级需求，那么我们就可以认为目标已经产生了下一级需求。相反，如果目标的购买力只足以满足'
  merge: -1
  img_proc: true
- pgno: 205
  md: '基本需求，即便他有更高的需求，我们也不认为更高的需求已经诞生了。因为更高的需求，他买不起，就像一般的打工仔也想要跑车，可是他没有购买力一样。


    另一个方面，将需求对应欲望更容易理解和判断。我发现，人的需要都诞生于基本欲望，而所有的欲望都追溯到“生存和交配”上，这两个欲望衍生出了其他的一切欲望。


    举个极端的例子，一个人追求超脱、无欲、修道，其实也是正因为有欲望得不到满足，所以他才去追求和化解这种欲望。这样的话，我们就不能说因为生理需求被满足，人才追求更高级的欲望。


    再比如，我们追求被别人肯定，被认可，这是一种社会需求。但这种社会需求表面看起来是因为我们的生理需求和安全需求已经被满足了，实际上，它反应出来的，恰恰是我们希望得到更多的生存和交配资源。因为社交需求让你想去认识好看的异性，这是人的潜意识决定的。


    因此我们可以看出，整个需求的过程，其实是由少到多、由浅显到复杂、由直接到引申。但是，这些高层需求基本都是从生存与交配需求上延伸出来的，而且其他高层需求又反过来，进一步帮助你更好的实现生存与交配的需求。因此我们的产品必须万百计和基本需求挂上钩才会有前途，也就是我们打磨的产品必须与生存和交配挂钩，才能直击人心。'
  merge: -1
  img_proc: true
- pgno: 206
  md: '举例说明，你的产品如何能卖出高利润？比如，衣服对应穿着需求，穿着是因为要装扮自己，而装扮是要吸引异性的注意力，繁衍后代的目的。如果我去做衣服的生意，我的产品设计方向一定要是满足交配这个基本需求的，那么，我就可以获取高利润，要不然，我的产品就卖不上高价。具体一点，我会去做女士内衣，显然是具有诱惑男人功能的内衣，女士们就愿意花高价去买。所以要和基本欲望“生存、交配”挂钩，因为性感，所以交配，其它设计、包装、营销等等环节也要围绕这个来。


    # 2、如何让顾客对你的产品上瘾


    如何让顾客上瘾，以及让顾客上瘾的代价。


    上瘾，其实是个心理学概念，需要心理上的手段而不是生理上的手段。如果做一件事不能对人的心理产生冲击，就一点用处也没有，还白白增加了成本与风险。


    举个例子，天天吸二手烟的人不在少数，为什么这些人没有对尼古丁上瘾呢？而赌博和网游对身体完全没有影响，为什么'
  merge: -1
  img_proc: true
- pgno: 207
  md: '么就是戒不掉呢？


    答案很简单，吸二手烟虽然有害，但大部分人的心理是不会受到快乐冲击的。而赌博与网游，不会给一个人的身体带来好处，但是对心理刺激是巨大的。所以，赌博与网游会让人上瘾，而吸二手烟不会让人上瘾。


    这里就隐藏了一个营销顾客的核心秘诀，大家可以好好领悟下。要明白上瘾的机制，当我们的某种行为为刺激大脑分泌多巴胺之后，这种行为就被我们的脑记住，下一次再碰到这种刺激，大脑就会习惯性的分泌多巴胺，人就会越来越想接受这种刺激。而这一套从刺激到快乐的循环，也就是上瘾。


    所有与众不同的东西都会对人产生冲击，这也就是为什么明星总是想标新立异，为啥各种大品牌总是要弄点和普通东西不同的地方，其目的就是为了刺激消费者的大脑分泌多巴胺，然后，消费者就会上瘾。


    其实这个思维变通一下，大家是可以把这个上瘾机制拿来谈恋爱的，拿来管理员工的。就是给出了一个刺激，让大家感到上瘾。


    现代企业的营销很大程度上涉及了心理学、行为学，特别是互联网，简而言之是深入的研究了人的心理学与人性。


    凡是不理解人性、心理学的互联网企业，一定会倒闭，其'
  merge: -1
  img_proc: true
- pgno: 208
  md: '实连倒闭都没机会，他们根本就干不起来。比如我们说的品牌忠诚度、粉丝等等，其实就是运用种种手段让顾客对我们的产品产生依赖，也就是上瘾。


    创业者要把这些东西弄明白，且能运用自如，比把产品做好费时费力，这绝不是看一下《迷恋》《愉悦回路》《瘾传》等等浅白的入门书籍就能解决的。要认真学习这套魔化武功，得老老实实去学点儿本心心理学，还需要对历史、宗教和哲学有所涉及，还得慢慢的在现实生活中实践。


    **如果是创业初期，我建议先把产品研究好，把服务研究好，比得过最差的同行，先做到这一步。有活下去的资本了，我们再来研究让人上瘾的魔化武功。**


    其实让人上瘾需要你有一定 的物质基础，能够做一个仪式化的东西，讲通俗点，就是你得要让有人有高大上感。很多做得好的生意都必须要求给顾客有高大上感。


    顾客为什么买跑车？为什么去住5星级饭店？为什么去那个高端 的美容店？他们能赚到暴利，很大程度上，就是这个高大上感让人上瘾。


    **这种让人有高大上感的东西，其实就是营销的最高境界。**


    大家去看看很多名牌服装、鞋子的广告就明白了，不管是商务男装，还是运动鞋，这个营销必须得给人仪式化，给人高'
  merge: -1
  img_proc: true
- pgno: 209
  md: '大上感。只有高大上感与仪式化，才能让消费者上瘾，才能在消费者脑子里打上一个记忆的铁桩，让他一有需要就想起你的形象。


    假如你让别人吸二手烟，却没有明确的告诉他其实正在抽烟，他就不会上瘾。理解了这个，你就应该能明白，如果我们想让一个人吸烟上瘾，不仅需要明确的告诉对方，还需要有一个催眠仪式——在抽烟这事上就是要递一支烟给他，然后给他点着火！表现得你抽了烟，就是我们自己人了。慢慢的培养他不抽烟就没有愉悦的感觉，抽了就愉悦，就是上瘾了。其实很多人都被“如果你抽烟了，就是我们自己人了”这种感觉给套进来的。


    实际上，对某种物品或者行为产生依赖和上瘾，很大程度上就取决于这个仪式化。而我们做生意要设计出这样一套仪式来，除了对心理学有所研究，还不得不去在历史、哲学、宗教、艺术领域借鉴经验，因为后三者就是一种仪式。


    但假如我们摆个小摊，卖个花根鸡，费这么大的劲，就是杀鸡用牛刀了，比杀牛还费劲，就在我们谈笑口水这功夫，你有把握在形象各方面都超越对手就行了。


    小本生意在初期阶段，只要舍得精力研究，都能做得好。小本生意在初期，苦干、蛮干、实干要比什么黑科技都有效，比研究营销有效多了。'
  merge: -1
  img_proc: true
- pgno: 210
  md: '我做生意时间长了，得到一个体会：对于任何生意来说，提高宣传的力度都会提高销量。但是对于太小的生意来说，提高营销力度未必合算，因为宣传不是免费的，你在宣传上所花的钱，未必比你因此获得的利润更多。


    具体来说，如果你这个生意每个月本来就能只赚几千块，如果你去做宣传，销量翻一倍，也不过是让你多赚几千块。无论你采取哪一种方法去宣传，都会产生成本。


    通过宣传方法，是会提高你的销量，但是营销这事，需要专人去弄，这就会产生成本。就比如，我讲语音，上传语音就得有专人负责去上传，微博、微信得有专人去弄，要不然我做这些事情，又得浪费几个小时。


    营销都**需要专门有一个人去负责，你无法又专注生产，又专注销售。如果 你一定要都做，结果就是两边都搞砸了。**


    显然，我们做小生意，如果既重视产品，又重视营销，要么我们聘请一个人来做营销，负责外围的工作；要么我们聘请一个师傅来做产品，我们来做市场。这就得花钱。因为宣传，你每个月多赚了几千块，但是因为聘请了这个人和宣传产生的各种费用，你这几千块又贴出去了，等于零。


    不仅如此，一旦雇佣员工，就牵扯到了管理，人人就会生'
  merge: -1
  img_proc: true
- pgno: 211
  md: '是非，就对你的管理能力有了要求，而你的管理能力本来就很弱，因为管理是一门更大的学问。不仅如此，因为我们生意小，门槛低，你请外人进来，人家三、两天就把手艺学会了，干嘛还要给你打工，而是自己也去开个摊位？


    所以好多小生意，最终能做大，其实都是因为产品硬，靠口碑相传。比如老干妈。如果你对自己的产品有信心，可以去找当地专门做平台、做营销策划的人合作。不过你还得设计个仪式化的东西，这样才能让人上瘾。


    # 3、最强大的营销术、洗脑术


    “洗脑”这个词很多人都不喜欢。管你喜欢不喜欢，很多营销大师都在用。


    我介绍几种常见的洗脑方式，这些洗脑方式用起来可以提高你的品牌知名度，也可以提高你的销量，甚至可以让你的企业活得更长一点。'
  merge: -1
  img_proc: true
- pgno: 212
  md: '# 第一，从娃娃抓起的洗脑术。


    日本人做了一些广告，比如早期的松下电器广告，都是几个小孩子的声音在叫“松下电器”。有人就觉得奇怪，小孩子又买不起这么贵的产品，为什么要用小孩子的声音来做广告、搞营销呢？


    答案很简单，从娃娃抓起，娃娃总是要长大的，总是会有消费能力的。等这些娃娃长大了，松下电器的销量就会提升，松下电器的寿命就会增加。


    我觉得迪士尼会永垂不朽，就是因为它从娃娃抓起。我们中国也有用儿童做营销的案例，大家自己找，我就不举例了。


    # 第二，恐惧营销。


    你不买我这个产品会失去什么，会产生什么什么样的后果，你早晚会后悔的，早买早解脱。用户为了摆脱这种恐惧心理，就可能买单。


    很多保健品就是这个套路，很多医院也是这个套路。


    # 第三，认同营销。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '健身房的营销就是这样，让你看图片上的模特的肌肉，你特别想拥有，然后你就买单了。你以为你买单了，你也能有肌肉。减肥吧、美容院的营销也是这样。让你以为喝几个疗程，就能瘦，让你以为去了美容院就能够变得非常漂亮。


    # 第五，熟人推荐营销、名人推荐营销。


    这就是为什么要请大明星打广告。那些明星代言一样东西，其他人看到他的偶像买了，他就会控制不住自己去买那个产品。这就是利用熟人，利用偶像洗脑、做营销。


    我讲的这5点，可以同时利用起来，这就是最强大的营销术，也是洗脑术。任何生意都可以用得上我讲的这5点，你去落实好了，销量自然见涨。不管你是谈恋爱也好，卖产品也好，管理员工也好，变通变通，效果都好得不得了。


    # 4、如何做有效的营销


    第一，你外面的软广告需要释放价值，而不是直接打硬广告。要让别人看你的软广告上瘾，进行长期的洗脑与知识服务。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '硬广告在网络上起了不了什么作用。比如，你做什么行业的，就介绍什么行业的知识，对大众有益的知识。有多少人认可你的权威性，你就有多少忠实的客户。


    # 第二，大面积的做软广告，多渠道的做广告。


    有些时候，广告的投入，比做产品还重要。老板应该亲自抓广告，公司必须有广告专业的人才，而且不只是一个。老板还应该组织大家每天学习10分钟到20分钟广告学、营销学的内容。水滴石穿，这个团队的营销能力一定会与日俱增。


    # 第三，重视客户服务，必须要亲自去看顾客与营销人员的对话交流。


    要教大家如何做客服。营销人员接电话的时候要听，要思考，甚至要做好笔记。接下来与营销人员沟通如何能让客户买单。话术是在实战中天天优化的。


    # 第四，我们做网络营销的，要通过与客户的对话迅速判断出来这个人是真要买单，还是来搞乱的，发现其根本不可能买单，就不要与其浪费时间了。


    若是被对方辱骂了，不要纠缠。我们不是来跟人生气的，我们是求财的，时刻记住自己的目标。

    我们用的与客户聊天的软件是可以记录客户的IP地址的，他下一次来了，我们也知道，他来了几次我们也知道。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '第五，每天必须参考做得好的同行，看看他们发布了什么新的广告、软文、图片。把他们的资料都研究透彻，取长补短，用到自己的营销上面。


    第六，持续性的营销非常重要，谎言说一千次就成了真理，想尽办法每天都出现在顾客的面前。


    # 第七，移动端转化率远远高于 pc 端。


    更加有意思的是，大部分商家并不重视移动端，所以导致很多小产品移动端基本没多少人竞争。但移动端流量大，也有钱赚。


    追逐新的趋势做营销事半功倍。


    # 5、做网络营销，如何提高成交率


    第一，你一定要有特色。


    比如你可以拍一个短视频放到网络上，经常拍。就如同魔兽世界里的苍天哥一样，如同某姐一样奇葩。他们并不比你优秀多少，你只要如他们这样做，你的传播性与营销性也会大增。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '只要有了知名度，关注你的粉丝多了，卖什么都能赚钱。


    # 第二，你可以找一个对手，跟你唱对台戏。


    比如你的同学、你的同事、或者你的员工，让他们跟你唱对手戏。你天天跟他对扯，中国人都喜欢看热闹，只要你们对扯，就一定有人来看，有人会自动站队。你推出一个产品或者服务，也自然有支持你的人买单。


    # 第三，多做一些小品、短视频上传到微博、QQ 空间、微信，和公司的网站上面。


    其实两、三个人就可以抄刀一个团队，年赚几百万，不管卖什么产品差不了都能够做到。原理就如同电视广告上卖优乐美、益达一样。现在利用互联网，传播成本非常低，互联网上赚钱，就是引流
    + 收钱，非常简单。


    # 第四，你卖什么产品，就找一个使用这种产品的生活片段的生活场景，不断的变换花样用幽默的元素把这些东西拍成视频或者图片上传到网络上。


    每天都要上传至少 10 张生活场景照片。网络上的成交，之所以低，就是因为你不能让别人信任你。别人只看到你的文字，或者听到你的声音是很难以成交的，你必须上图片、视频。必须连续不断的上，娱乐化、幽默化的上。


    我们有些学员，自己长得很漂亮，但只拍了一些照片，这明'
  merge: -1
  img_proc: true
- pgno: 217
  md: '显然是不够的。你必须上专业的视频，连续上，不管你卖什么产品，你的销量都会大增。


    # 第五，如果你可以搞网络直播，那么你的销量会进一步大增。


    也就是弄个摄像头直播你的公司在干什么，你在干什么。

    现在大部分网红都是这样干起来的，没什么技术含量。


    不管你是传统老板，还是互联网的老鸟，你只要按照我这5点去执行，你的生意一定会好起来。


    # 6、越俗气，越有传播力，赚钱就越多


    你做微商或者写广告，最好把所有的细节都写出来，都晒给顾客看。


    比如，你是怎么包装你的产品的，你用的是顺丰快递，还是中通快递，你都可以拍个照片上传到自己的微信、QQ空间。


    你这个产品是怎么制作的，你的产品重量是多少克，你都把它表达出来。这些东西看起来没用，但是苹果手机就会把这些'
  merge: -1
  img_proc: true
- pgno: 218
  md: '细节写出来。细节写出来，大家就更加信任你。这样就会有更多的客户对你的产品感兴趣，买单的欲望更加强烈。


    人们最讨厌模糊性的回答。模糊性的回答，让人不信任你，客户的脑子也记不住模糊性的东西。记不住，买单的几率就小。


    写软文、做广告，要用人们常用的词语、话语去写。淘宝的“亲”，我很早就非常恶心了，但是告诉你，这个字非常有效果。我建议大家也经常用“亲爱的”“朋友”“兄弟”“姐妹”“老乡”这样的词、字来做广告，写软文，效果就会非常好。


    表达一个东西，要具体，要直白。千万不要复杂、微妙、用双关语，不要表现得艺术气息浓厚。大多数人都不喜欢艺术，越俗气越有传播力，越有效果，赚的钱就越多。


    现代社会利用互联网赚钱，能上视频就上视频，能上图片就上图片，然后才考虑文字。你的信息越立体，你的成交率就越高。


    虽然现在大家都用手机了，但是你做互联网生意，我还是建议你安装一个固定电话，用固定电话与顾客交流，信任度更高，成交率更高。我有一个小生意，用手机的成交率不到用固定电话的一半。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 7、知名度就是金钱


    互联网上可以用软文、视频、图片、语音去推广。推广是有技巧的，你不要讲些与产品无关的事情。你要做的一切，就是让用户记住你的产品名字，记住你是卖什么的。


    看看脑白金的广告，你肯定能记住这是脑白金。这就是成功的广告。蚂蚁金服在北京地铁打广告，什么内容也没有，就是让大家记住“蚂蚁金服”这个名字，这就是高手的招式。


    # 知名度就是金钱。


    我们平民百姓做自媒体，也要用这一招，不断强调自己的产品或者服务，不断宣传自己的名字。在客户的脑袋里形成了烙印，客户需要的时候，自然就买单了。我自己就是实践者，这一招非常好用。


    每一个创业人选项目的时候，最好选择自己喜欢的项目来做。然而，这个项目必须接地气，要赚钱。你不能因为自己喜欢，'
  merge: -1
  img_proc: true
- pgno: 220
  md: '就脱离了市场。


    人不喜欢一个项目，是很难全身心投入的，我们只有喜欢一件事情，才可能从早到晚干也不嫌累。如果你没有爱好，那么你必须强迫自己喜欢上客户需求的项目，直到形成一种习惯。


    我们推销一个产品或者服务的时候，不要去贬毁竞争对手，也不要去证明自己的产品比竞争对手优秀。你这样讲，客户会认为你人品低劣，客户会想，你当然会这样说了，你就是为了卖自己的产品嘛。


    而且你讲竞争对手的坏话，也会造成间接收性的帮助竞争对手宣传。他的名声扩大了，其实更加不利于你卖自己的产品或者服务。


    真正高明的做法，就是只宣传自己的产品与服务。把自己的产品与服务描述到顾客的心里去，顾客需要这个产品或者服务，自然就买了。


    告诉大家一个秘密，我们天天猛宣传自己的产品名字，顾客就会遗忘竞争对手的产品名字。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# 8、什么才是好广告


    无论是任何时代，只要经商，广告都是重中之重。现在尤为重要，是因为物质极大的丰富，竞争极其激烈，你的广告更加要像一把狙击枪，必须在顾客脑中留下一个记忆点，让顾客购买产品。


    广告的目的不是写得多优雅，不是让别人称赞这个广告有多好。广告的目的ā是让大家听完、看完之后，愿意去买广告的产品来一试。


    雅典时期，有两个著名的政治家。一个政治家演讲完了，大家都大呼，讲得真好。另一个政治家讲完了，没有人说这个政治家讲得好，但所有的人都开始群情激奋，准备好要去战斗了。显然，我赞同演讲完就让人去战斗的演说家。


    做为老板也是这样，你讲话不是要讲的大家都认为你学识渊博，很有道理。你讲话的目的，是驱动员工把工作做得更好，'
  merge: -1
  img_proc: true
- pgno: 222
  md: '是驱动顾客买单。就算是你释放价值，也是为了让大家知道你有更有料的东西，让顾客买单。


    我做一个项目，做广告的方法是，招聘3个广告策划，用同样的团队去推广这3个广告策划的广告。当然推广的费用都是那么多，同样的时间，谁的广告成交率高，就用谁的广告。然后不断的优化测试新广告，如此循环下去，产品就卖得越来越好了。


    卖得出产的产品的广告，才是好广告。


    # 9、广告只有一个目的，就是让顾客掏钱


    广告不是解释自己做什么的，广告不是说自己的东西有多好。广告只有一个目的，就是让顾客掏钱。


    其实，做生意，卖什么不重要，重要的是顾客会掏钱。怎么让顾客掏钱呢？你要命令顾客掏钱。


    广告语是叫顾客行动，而不是解释，而是让顾客知道你'
  merge: -1
  img_proc: true
- pgno: 223
  md: '这是什么东西。产品是为说动顾客掏钱服务的，产品是为广告服务的。而广告不是为产品服务的。所以，生产产品的人都比较穷，而卖产品卖得厉害的人比较富。


    社会本来就是广告的社会，谁的广告打得好，谁讲的话能让顾客掏钱，谁就能赚钱。


    我们知道的很多电视台就是靠广告赚钱的，我们知道的互联网大公司，都是靠帮人卖广告赚钱的。


    以前是电视时代，你的广告只要经常出现在报纸、电视上，你就会发现赚钱的秘密。现在是互联网时代，你的广告只要不断的出现在各大网站、流量高的手机 App 上，你就能赚到暴利。


    大家根本不知道你的产品是什么样子的，大家首先接触到的是网络上的广告，所以，谁的广告具有杀伤力、更能让人掏钱，谁就能赚钱。


    有些人可能会说，你的产品不好，下一次顾客就不买你的产品了。我告诉你，首先，中国人很多，一般都是一次性生意，其实，在互联网时代，一次性生意，已经可以让你赚到很多钱了，因为市场足够大。但我并不让你去做假劣产品，这个你必须理解。


    其次，就算你经常做回头客的生意，也是因为你第一次广告就打得好，客户才选择了你而不是选择了别人。而你的广告'
  merge: -1
  img_proc: true
- pgno: 224
  md: '打得好，顾客掏了很多钱给你，你才有实力把产品做得比别人更好。


    也就是说，只要你的广告做不到让顾客掏钱，你就等着渡")

    """


    你让顾客清楚你是做什么的，没有意义，你让顾客服气也没有意义。顾客可以不清楚你是干什么的，也可以不服气你，但是顾客会买单。这其实是最深层次的商业内功。当然，这个内功也被一些坏人利用了。比如电信诈骗，就是坏人用了这个商业秘密。


    假如你堂堂正正的经商，做的是合法的事情，理解了我讲的这个，你就能赚到更多的、合法的钱。


    # 10、产品是对广告与包装的承诺


    我们很多生意人，拿到一个产品过后，才来问如何让顾客买单。其实顾客根本不喜欢这个产品，也不需要这个产品。如'
  merge: -1
  img_proc: true
- pgno: 225
  md: '果你把这个产品通过高超的营销手段卖出去了，基本相当于诈骗。


    很多公司都认为他们缺好的销售，其实，他们缺的是好的产品设计者、优秀的产品设计者。设计对路了，就算在红海中，也不需要销售。比如苹果手机，在手机这个红海中，做到了顾客主动去买单。


    那么，产品、包装、广告，它们之间到底是什么关系呢？我们应该重视产品？还是广告？或者包装？我们又如何堂堂正正的卖一个产品呢？


    这要先从广告、包装、产品描述说起。广告、包装、产品描述，其实是为顾客服务的，不是为产品服务的。产品本身，也是为顾客服务的，不是为制造这个产品的人服务的。制造这个产品的人就是想赚钱，但制造这个产品的人本质上也是为消费者服务的。


    我们的广告，应该叙述消费者脑海里需要解决的问题；我们的包装，应该叙述消费者想要知道的信息；我们的产品，是对我们广告与包装的承诺。


    很多生意人都干反了。他广告是为了卖产品，包装也是为了吸引顾客买产品。他做产品的目标就是为了把产品卖出去'
  merge: -1
  img_proc: true
- pgno: 226
  md: '赚钱，而没有服务顾客的心。


    广告、包装、产品三者，如果我们只做一锤子买卖，产品是最不重要的，广告最重要，其次是包装最重要。凡是颠倒了这个次序的，生意就做得特别艰难。


    广告决定产品，而不是产品决定广告。产品是对广告的承诺。


    # 11、自媒体广告的打法


    在媒体稀缺的情况下，比如电台、电视称雄的时候，用户没有自主选择的权利，别人播放什么广告，我们就得看什么广告。


    现在的85后、90后、00后，再也不吃这一套了，因为他们几乎不看电视，就是在互联网上。他们也是只要见到广告，都是瞬间关闭的。


    所以，你如果在纯粹的打硬广告，效果肯定会差。除非，你能找到一个地方，用户没有任何办法，只能被你强行营销。这些地方，要么就是花高价的地方，要么你根本就找不到。'
  merge: -1
  img_proc: true
- pgno: 227
  md: '所以现在我们的广告一般都要弄点干货出来，顺便夹带自己的广告。其实，微信和QQ，就是腾讯游戏的广告。360安全卫士就是360搜索引擎、360手机、360安全浏览器的广告。


    新一代的广告，已经是通过做影响力，来做营销了。广告本身已经演化成了一个非非常有价值的产品或者是服务了。


    我们在网络上发广告，也都必须要发对用户有用的文章、视频。用户看了过后确实认可你了，你有名声了，大家崇拜你了，自然就买你的单。这其实就是粉丝经济、网红经济。


    王石去爬山、游学，把万科的名声做出来了，只要万科的房子质量过关，自然万科的房子就好卖了。


    自媒体上面不应该有太多的广告。你的有用信息多了，在末尾随便推送广告就赚钱。你没有什么是有用信息，就不可能赚到钱。


    我从来不认为赚钱难。赚钱难只有一种可能，就是你没有干对，你干错了方向。


    用户早上6点起床了，他会非常自然的看微信、看QQ空间，现在是刷抖音，这个时候，你就应该写好信息、拍好视频，'
  merge: -1
  img_proc: true
- pgno: 228
  md: '让他们看。或者直接直播，给他们看。


    他们上厕所坐马桶的时候会看手机，看朋友圈，刷抖音，你又应该发内容给他们看。


    如果你的客户是上班族，他们在7点半到9点可能挤公交、挤地铁，这个时候，又是发朋友圈，发各种有价值信息的好时间。而如果你9点钟才上班，才开始发信息，你的客户已经在处理工作了。你发的信息再好，看的人没空看，你就没价值。


    客户中午12:00吃饭，又是一个刷手机的高峰，而你也去吃饭，那么这段黄金时间又被你错过。晚饭时间同理。


    晚上8点到10点，又是营销客户的好时间，你是否已经下班？而晚上12点，客户已经睡觉，你还在那里做营销，就证明你根本不了解你的客户。


    你还要思考你的顾客的购买力如何，这些人消费得起吗？你去吸引大学生，那么大学生消费能力如何呢？


    你的卖点必须是用户的买点，只要你思考用户的买点是什么，根据用户的买点来写广告，你就必须赚钱。当然，你必须根据用户的买点来做服务，否则你就是诈骗。'
  merge: -1
  img_proc: true
- pgno: 229
  md: '# 12、战略与产品的关系


    赚钱，最主要的是要具体的出招。


    任何一个赚钱的人，必须做具体的事情。只要这个人不做具体的事情，任他再聪明，都是狂妄。


    战略、定位、具体的产品与服务，是一回事。具体的产品与服务，是战略的落地，是定位的体现。假如一个公司把搞战略的、搞定位的、搞产品的、搞服务的人分开，那么这个公司就是瞎搞。


    不存在一个人懂战略，不懂服务，另一个人懂服务，不懂战略。懂战略的人，必须提出具体赚钱的产品和具体赚钱的服务。要提出具体产品与服务的人，必须提出战略。


    我讨厌一个人说大方向定了，就好办了，还以为自己为公司做了很大的贡献一样。为什么？因为大方向定了，其实什么都不是，因为知道这个方向的人非常多，只有提出具体的产品'
  merge: -1
  img_proc: true
- pgno: 230
  md: '与服务，并且用这个产品与服务赚回来利润的人，才算人才。没有赚回来利润的服务与产品，就什么都不是。


    这也就解释了为什么很多人高分低能。其实啊，他并不是高分，他其实是低分，只是给他打分的人没水平，判断不了他是低分。真正高分的人就是高能，低分的人就是低能。这就是战略与产品的关系。


    # 13、营销的六脉神剑


    第一，你必须知道产品广告最重要。


    你必须卖一个具体的东西，顾客就是要买一个具体的东西。如果说不清楚你卖的具体产品是什么，你就没有客户。你必须精通“卖”字决营销。（见《陈昌文方法72大营销系统》）


    第二，你想要做好生意，需要做好服务。


    也就是说，你只卖产品，不做服务，你肯定竞争不过同行。我想，没有几个企业敢不做服务，不管是售前服务、还是售后服务。售前服务，能提高成交率；售后服务，能形成口碑，也'
  merge: -1
  img_proc: true
- pgno: 231
  md: '能形成二次转化，甚至用户会不断的传播你的服务内容，让你赚到更多的钱。


    # 第三，服务当中，最重要的就是售前服务。


    售前服务，最好以资讯的形式传播出去。资讯就是你这个东西对顾客有什么具体的好处，有什么具体的创新，顾客买了你这个值不值等等。我做陈昌文读书会和老板社群看起来没有售前服务，其实，社群内外几百名讲师的视频、直播，我微博上的文章，都算是售前服务。也看似没有售后服务，其实，陈昌文读书会每天讲师授课，陈昌文老板社群每天内部授课，我的公开课，都算是售后服务。只是我不以“售前、售后”的概念出现，这是我做社群营销的方式。（学习我是如何做社群营销的，见《陈昌文方法之一个社群人的自白》）


    # 第四，如果你财大气粗，你还可以制造一些简单的体验，让顾客终身难忘。


    比如，某化妆品品牌就有产品体验。你从他的门店边上过，他会发非常常的一瓶你喜欢的化妆品给你，让你用。你用好了，就会成为他的忠实顾客，这就是先让你体验一把他真正的好，再让你买单。我做陈昌文读书会，我们的讲师在外部拿着书，照本宣科讲解，还有我的公开课，都是用户体验的一种方式。


    # 第五，最高境界的做企业，当然就是做梦想了。


    手机行业，创新的梦想，就是苹果公司。所以苹果出了一个'
  merge: -1
  img_proc: true
- pgno: 232
  md: '新品，根本就不需要自己疯狂的打广告，各大电视台、互联网网站主动播放它。能成为人类的梦想，大家都想拥有你，你自然也就发财了。


    # 第六、深化服务资讯。


    你能每天都产生大量专业又通俗易懂的文章、视频、广告，不断的对用户解释、宣传你这个产品对社会有什么贡献，你要解决什么问题，甚至指导用户如何做对自己有好处，让用户对你的资讯形成依赖，那么用户一旦需要你们公司的产品了，自然就想起你了，也就自然买单了。


    # 14、营销的四个套路


    营销首先要针对目标客户打造价值。每一个群体对价值的认识都是不一样的，你塑造的价值必须具有针对性。能把东西卖出去，实际上是一种交换关系，而交换取决于客户认为那个产品有什么样的价值。


    人的需求是时刻变化的，渴的时候想喝水，饿的时候想吃饭，'
  merge: -1
  img_proc: true
- pgno: 233
  md: '只要目标群体选对了，持续对他做营销，就算现在不买，他总有一个时候想通了就会买。


    想要赚到更多的钱，你必须要​有价值，而价值只是交换的基础。交换更重要的一点是接触点，顾客认知到你有价值，这个认知度就靠你的宣传推广。


    好酒也怕巷子深，你必须得宣传推广。人家不知道你的存在，自然就没有办法买单。


    举一个简单的例子，你很有本事，工作能力很强，人又长得帅，但是你社交圈狭窄，没有什么女人你能接触到，当然你就找不到女朋友。


    也就是说，虽然你有价值，但女性市场对你没有认知，没有接触，你就不能把自己卖出去。怎么办呢？如果你能宣传推广自己到更多的女性圈子里，比如去做公益活动，去参加交友活动，那美女订单就会雪片般飞来。


    所以，营销的第一个套路，不管三七二十一，先上广告，做推广、做宣传，不出意外，销量都会显著增加。


    讲宣传推广，就要讲宣传推广的渠道。这是营销的第二个重点，你得疯狂建立渠道。


    很多人做生意，推广渠道很单一，这肯定是不对的，因为'
  merge: -1
  img_proc: true
- pgno: 234
  md: '你的客户在每一个渠道里都有。比如，网站推广、App、微信、微博、QQ空间、线下渠道，各种渠道都去尝试，自然能带来更多的销量。


    # 第三个就是降低用户的购买成本。


    并不是让你降价，而是降低用户获得性，也就是我们经常讲的用户体验。


    不要让用户感觉跟你交流太困难。比如，用户给你打款，却找不到你的付款信息；用户想跟你们的客服交流，却找不到客服交流的渠道。这些都会导致用户购买成本增加，也会导致销量减小。


    # 第四，做大做强市场的认知度。


    一样的产品与服务，如果你的名声响，用户对你这个产品更加了解，认知度高，你的成交率自然比别人高。


    这就是营销的四个核心思想！'
  merge: -1
  img_proc: true
- pgno: 235
  md: '# 15、改变人们对你的产品价值的认识

    是最盈利的地方


    想要富，就必须挣超级高的利润。不要挣社会平均利润，更加不要去做劳神劳力的低利润的事情。


    不要相信薄利多销，大资本集团挣的其实还是暴利。薄利多销，你看看哪家挣到大钱了，人还累成狗。


    做连锁餐饮就是一个很好的例子。单多，不挣钱，利润太低，员工一累就各种要求。一旦做你的那个同行多了，市场也就那么大，价格往往上涨基本不可能，一家分掉一杯羹，你很快就挂了。所以，要相信只有暴利才能让我们致富。


    我们现在做的社群营销本质上是卖知识，卖思维，定价是我们自己说的算的，而且未来这个市场会越来越大。抖音上一个讲师有 20 万粉丝，可以变现 1000 万，她做的也全部是虚拟服务项目。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '精神类、泛娱乐类都是超级抢手的项目。线下我们接触到的投资机构也是把这种项目视为香饽饽，也一定是他们优先投资的对象。因为利润高，回收见效又快。


    那么怎么做到超级高利润呢？我们首先要做一个拳头产品，把这个产品做到极致。这样还不行，我们要通过广告宣传，要通过知识宣传，给这个产品附加一个重要的、值钱的概念。最暴利的部分，就是这个附加上去的概念，就是你广告的打法。


    改变人们对你的产品价值的认识是最盈利的地方。其实，你怎么样干活不重要，你怎么表达你的产品的附加值才重要。只要你能宣传到客户心里去，客户自然愿意出高价。本质上，暴利就是对客户心理进行按摩。营销，是心理学、广告学、传播学的综合体。


    # 16、产品和服务的名 字就是购买理由


    如何给产品与服务命名？

    一个好名字能够起用户的购买欲望，能传达出你到底卖的'
  merge: -1
  img_proc: true
- pgno: 237
  md: '是什么。而一个差的名字让客户不知所云。


    命名，最好具象化。比如叫，孔雀、苹果、小米之类。别人一听你的名字，头脑里就有画面感，就能联系到美好的事物，有亲切感，甚至有需求感的名字是最好的名字。顾客感受到熟悉，就会感觉到安全、信任，营销成本就低。相反，陌生的名字、不常用的名字，就不要用。


    # 拒绝用抽象的术语命名，甚至用形容词命名。比如美丽。


    什么叫美丽呢？客户根本搞不懂你在说什么。


    产品的名字就是价值，名字给人联系美好事物的想象力，名字就是购买理由。


    选择名字，要选择大家都知道的名字。


    # 所以大家给自己产品与服务命名的時候，最好能借用在历史文化中本来就有，而且广为人知的词语。


    假如你要生产第二个产品或者提供第二个服务，你最好也沿用以前的名字。别换名字，换名字跟离婚差不多，你的销售成本会提高很多。就像苹果一样，手机叫苹果手机，电脑就叫苹果电脑。如此，你每推广一次你的品牌，都在销售你所有的产品与服务。


    # 赚钱这件事，本质上是看老板的软实力，也就是智力高不高，'
  merge: -1
  img_proc: true
- pgno: 238
  md: '有没有知识，所以，每一个想赚大钱的老板，只有疯狂学习这一条路。


    # 17、想要打好广告，就必须做一个标题党


    当今社会，想要打好广告，就必须做一个标题党。标题好 不好，是读者会不会读正文的关键。


    读标题的人数，平均为读正文的人数的 5 倍。换句话说， 你写好了标题，就可以超过 80% 的竞争对手。所以，标题才 是你最应该下功夫的地方，而不是正文。不同的标题销售能力完
    全不一样。


    下面是我写标题的方法：


    +   第一，标题要清楚的写上你要解决的问题，你要卖的是什么东西。拒绝模棱两可。顾客没有耐心去猜测你要卖的是什么东西。


    +   第二，每个标题要有给客户带去利益的感觉，要有帮助顾'
  merge: -1
  img_proc: true
- pgno: 239
  md: '客的感觉，人都是趋利避害的，每个人总想得到点利益。


    第三，能用“免费”这个词，就加上“免费”，这个词很吸引人。不能用“免费”，就用“新”这个词。比如，新一代、新产品、新方法、新技术。


    这两个词很抓人眼球。


    第四，如果标题里能写上你产品或公司的品牌最好，因为读标题的人很多，可以起到品牌宣传的效果。


    第五，标题要尽量引起人的好奇心。比如，多用“如何”，令人惊奇的，你不得不知道的，什么什么的秘密。引诱用户读下去。


    第六，不要在标题里加入否定词，人类最讨厌否定。


    这就是我做营销、写标题的准则。'
  merge: -1
