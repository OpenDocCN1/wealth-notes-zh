- pgno: 79
  md: '# 断的传播，你的日收破千破万都不是问题。


    这个时代就是打造一个团队，大家共同来做内容的时候。这个时代是一个品牌人的时代，这个时代是人格化的时代，是IP化的时代，是每一个人都可以当明星，都可以自由报道自己的时代。


    你只要愿意把你自己打造成网红，你就会是一个网红，不管是小网红，还是大网红。只要你去吸引流量，你总是有能养活自己。


