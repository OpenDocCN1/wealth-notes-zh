    只有正能量的人、能正面应用书籍里的内容的人，才有资格学习。我们在直播、讲课、讲视频，以及做读书会的时候，都要反复强调这点。我们自己的遣词造句，必须是正能量的，以免被扣上负面的帽子。


    书籍营销系统，会让社群的影响力与日俱增。我们要实现的目的，就是传播给十亿人，只要认识汉字的人，都是我们的客户。这个东西影响力极大，传播速度极快，我们真能比《富爸爸，穷爸爸》的影响力，以及《定位》丛书的影响力大。


    您看着，我们的影响力会比他们更大。我们能改变太多的人了，几千万万、十亿人会受到我们的影响。以후若有机会，我们也请专人来改编成英文，传播给几十亿英文市场。'
