  img_proc: true
- pgno: 77
  md: '至不看电视了。电视的传播是单向的，是他想放什么就放什么，他想放广告你也得看。自从我们有了网络，有了互联网，有了智能手机，如果你的广告、你的内容不好，我们就不再关注你了。我们可以主动选择内容，选择广告了。


    同时，我们自己可以通过一个微信、一个QQ、一个微博、一个网站发声了。而且你根本不需要什么技术，技术工作都由腾讯、新浪等这些大公司帮我们做好了。


    所以，这是一个大众创业、万众创新的时代，你可以没有资金，你也可以不是企业家，但只要你的某个声音受到了，你就可以聚集很多粉丝，你就可以影响很多人，也可以挣到很多财富。


    自媒体时代，人人都是明星，人人都可以报道自己，人人都可以是电视台，都可以带着智能手机、拿报道自己发财。靠做自媒体营销卖产品卖成亿万富翁的有，靠做自媒体成为亿万富翁、千万富翁，靠网络直播、手机直播卖车买房的人就更多了。


    如果这个时代，你都很难挣到钱，那么我觉得对你真的无话可说。现在最挣钱的模式，就是社群营销、粉丝经济、粉丝营销。10年前，你想做社群营销、粉丝经济、粉丝营销都不可能，或者是成本太高。现在，你只要不断的与人建立连接，你就可以影响很多人，你就可以挣到钱。'
  merge: -1
