- pgno: 68
  md: '一般情况下，成功者都是逆反常人的，如果大家都理解你干的这个项目，你其实应该放弃了。大家不理解，或者理解的人很少，赶紧敲，这就是机会。


    # 25、互联网创造了非常多的商业机会


    当今社会，你只需要一台电脑、一个手机、一个QQ、一个微信、一个网站，你就能在互联网上获得海量的客户。互联网创造了非常多的商业机会。


    在中国，你可以通过互联网接触到几亿人，你每天可以轻松轻松的通过文字、视频、语音吸引到成千上万的消费者。过去，只有富人才能控制传媒，而随着互联网的发展，我们每一个人都可以成为一个广播电台或者是电视台。只要你能生产优质的内容，就有人看，就有人付费。


    互联网让我们做一个生意的成本极低，而成本低是变富最重要的条件。


    互联网击败了很多传统店铺型的商铺。互联网是一个低成'
  merge: -1
  img_proc: true
- pgno: 69
  md: '本高产出的工具，使一个人可以在成本越来越低的同时服务于越来越多的人。


    现在，我们每个人只需要用极少的时间与精力，就可以通过互联网赚到非常多的钱。而不懂得互联网的人花费了大量的精力与时间获取的，却是越来越少的客户。他们的成本越来越高，收入却越来越少。


    未来的世界，只要不懂利用互联网的人，就根本没生意可做。时代变了，要想过得好，必须跟随着时代跑。这就是互联网时代带来的变化，我鼓励年轻人利用互联网创业。


    # 26、永远不要背负不良债务


    这个社会有很多聪明人挖的陷阱，普通人会不知不觉的掉进去。


    你手机里就有大量的 App 在收你的智商税，如果你的智力不够的话，就会交税。可以说，社会上大部分人都在交智商税，因为他们不懂有非常多的人会设计不良债务，让他们变得更加'
  merge: -1
  img_proc: true
- pgno: 70
  md: '贫穷。


    比如，一个人如果养成了分期付款的习惯，养成了借信用卡的习惯，养成了用某些金融产品里面的钱的习惯，就是为自己建立了不良债务。


    这个人每个月都在工作，都在挣钱，可是他挣的钱除了养活自己以及自己的父母以外，还要养活那些给他建立不良债务的人。他欠的债务多了，势必击跨自己健康的经济状况。这样的人，就变成了别人的奴仆。


    社会就是一个游戏，极少部分聪明人，特别是那些搞金融的人，不断的设计套路，让社会上大多数人陷入这种不良债务。

    其实，你完全可以不用陷入这种不良债务，你只要控制好自己的欲望，或者不被那些人勾引就行了。


    我建议普通人不要接触任何一个让你借贷的机构或者产品，不要享受他们提供的金融服务，因为普通人根本不需要。我们完全有能力自给自足，完全有能力让自己富贵起来。


    所以，我从来没有办过一张信用卡，也从来没有用过任何公司的金融产品。我买任何东西都是全款，就当这笔钱扔了一样。当然最聪明的人就是设计一个游戏，让别人都欠自己的钱，然后定期还。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '只买自己买得起的东西，永远不要背负不良债务。养成存钱的习惯，追求自己想办法赚更多的钱，这样，你就能更加富有。挑战自己的贫穷，而不是通过建立不良债务来让自己更加贫穷。不要再被某些机构收智商税了。金融思维很可怕，可以让自己迅速致富，也可让很多人迅速贫穷。


    # 27、从创业到资本运作


    从创业到资本运作。


    第一，找方向，就是一个企业到底做什么产品。


    这个阶段我认为需要 2 ~ 3 年，早期的公司，我认为至少有 80% 是没有找到方向的，就是你的大方向肯定对，你的产品方向肯定对，但是你还没有把你的产品打磨成可以爆款、可以爆炸的点，这就是没有找到方向。


    找方向的方法也很简单，就是你看哪个领域有前途，你就去调查这个领域的哪个产品的成本低、利润高。有人在这个领域赚了大钱，你就去复制他的模式就行了。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '找方向的时候，切忌花钱去探索新市场，搞研发搞创新。找方向的时候，就是用营销入手。华为公司的任正非，开始也是代理交换机起家的，说白了，就是营销入手。


    # 第二，聚焦。


    等到你找到这个方向、这个产品过后，其他的事情就应该砍掉了，聚焦这个产品或者服务，争取在这个产品的销量上做到行业第一，这个时候，你就应该开始赚钱了，而且开始赚到了第一桶金。


    # 第三，第二产品。


    赚到了第一桶金，也做到了这个行业第一的时候，就再找一个相关产品，能利用以前渠道、利用以前的优势，然后把第二、第三个产品也做到行业第一。这两、三个产品，能相互提高各自的销量。这个时候，你大概就是企业家了。


    # 第四，资本运作。


    开始借钱，开始融资，让资本家，让更有经验的企业家占有公司的股份，当然控制权还是在你手里，开始资本运作。谋划上市，打造生态链，这样，你就可以赚到更多的钱。


    借钱融资的目的，不是要钱，而是要那些更优秀企业家、投资人的经验，先进入这个圈子，向他们学习。你的内功经过这些大神的调教，你的下一次就会熠熠无双。其实，大多数人'
  merge: -1
  img_proc: true
- pgno: 73
  md: 只需要把第一步做好，这一辈子就衣食无忧了。后面三步，看自己的志向与缘分。
