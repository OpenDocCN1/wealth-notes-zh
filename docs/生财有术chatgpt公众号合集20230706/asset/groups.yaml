    \n# 【精华帖】(92赞) 普通人在公众号细分市场找到机会，实现月收入过万\n\n作者：渔火\n\n日期：2022-04-06\n\n大家好，我是渔火，一名在路上的创业者，目前在搞新消费领域的创业，欢迎有经验的圈友链接。今天和大家聊聊我是如何在公众号细分市场找到机会，并且得以验证的。说实话，这个是之前无意识的一个测试，目前每个号每个月稳定在500-1000的流量主收入（而且我只开了底部广告），这样的帐号，我有10个，然后加上每个月自然到店购买书法国画课程能产生5000左右的收入（纯自然），月被动收入15000左右。1个号的代运营成本，每天4篇非原创文章，160/月，10个号总成本是1600/月。\n\
    \n公众号懒人找资源，懒人专属群分享\n\n我完全没有想到竟然还有这样的效果，所以正如生财的实战理念，不做永远没结果，做了就有希望！\n\n| 投放周期 |\
    \ 2022-03-01 - 2022-03-31 | 花费 | 曝光量 | 点击量 | eCPM | 收入 |\n| :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- |\n| | | 27,011 | 830 | 22.25 | 600.98 | |\n\n![](img/37941fd94ce334e82cf16e7f1842c860_100_0.png)\n\
    \n（这个中间值的一个号，目前**3900**粉丝量，3月收入**600**元）\n\n接下来我从这几个方向给大家分享一下：\n\n- 这个项目的起始复盘？\n\
    - 这种类型的项目还能做什么？\n- 想赚钱最重要的是什么？\n\n## 1、这个项目的起始复盘\n\n先说下我要分享的躺赚来源，就是很多人熟知的公众号流量主收入，但是我的号粉丝量都不多，最多的一万粉丝，最少的三千粉丝，内容领域属于是公众号里面的细分市场，不是主流的市场。\n\
    \n公众号懒人找资源，懒人专属群分享\n\n先说一下开始的情况，我在去年5月批量投了一批广点通，做了十个帐号，主做书法国画领域的内容分享，当时的启动成本是每个号投1000元，作为启动量。我的本意是做流量，然后导流到私域转化书法国画课程的。有了解我的圈友应该知道去年闲暇搞过的副业，在线的书画院，累计也变现了三百万（之前有分享过文章）。\n\
    \n![](img/37941fd94ce334e82cf16e7f1842c860_101_0.png)\n\n这是其中一个帐号截图，当时对广点通也很不熟悉，加上投的费用太多，所以成本都参差不齐。这是其中成本较高的一个号，相当于1000元换了369个粉丝。\n\
    \n后来就找代运营持续发文章，淘宝很多160/月，每天4篇，然后发现引流到私域转化高客单效果一般，后来就放弃了，没有在上面花过心思。但是隔了一个月后，有一天登录后台，发现帐号开始每天十几个关注的新增，而且几百粉丝的号，还出了几个几千阅读量的文章，而且不是一个号，是几个号都有过千阅读量的文章。我才意识到可能是人群的问题，结合我之前的用户调研，中老年兴趣群体天然地爱分享爱浏览，那么这是有流量生意的啊。于是在后面我就把所有号的流量主都打开了（流量主的开通挺容易的），然后就开始产生了被动收入。\n\
    \n收入的话是从去年9月开始每个月就已经和代运营费用打平了，然后到现在每天很稳定的新增关注，和几百的阅读量。\n\n| 日期 | 新增关注 | 取关 | 净增\
