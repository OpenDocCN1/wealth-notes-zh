    ## 5、随意分享，没想到安利了一个小姐姐加入生财有术


    最后，来说说安利一个小姐姐加入生财有术的故事，她是我社群的一个小伙伴，之前通过写作营认识的，很年轻，很漂亮，搞钱也很积极，但最近项目遇到一些瓶颈，我就安利她说，去生财看看世界吧。


