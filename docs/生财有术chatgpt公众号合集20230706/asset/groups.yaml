    - 赞赏建议有就开启吧，毕竟就是为了给自己增加收入的，增加正反馈的。增加了一种途径是好事。


    #### 发布时间安排


    - 如果是一个新的公众号，也没有大号作为引流，这个阅读量大概率就是来自推荐里面，或者是搜索推荐。

