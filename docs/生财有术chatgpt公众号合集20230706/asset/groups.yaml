    ## 3、用 GPT 19 天挣 9800


    这位朋友是写公众号流量文的，最近公众号流量文很猛，只要你会写，拿到 10w+ 很轻松，他写了 5 篇 10w+ 文章，收益就 9800 了，当然，还有大大小小、5w、6w
    小爆文了，他没有分享自己的账号，因为担心被举报，但分享了他的做法，就是写情感领域，他搭建了一个人工+智能爆文的框架，分为 3 步：

    - 1、选题+标题，占 50%，做内容就是做选题

    - 2、正文，就是基本的行文结构了

    - 3、情绪价值，情感文容易爆，就是提供了情绪价值，激发了用户转账戳。


