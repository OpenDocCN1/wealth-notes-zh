    - 清欢：柯总牛逼[强]\n- 亦仁：领先半年以上，不是吹的。\n- 亦仁：不过这个机会很多人仍然没意识到。\n- 云珞YunL：柯总牛逼\n- 周彦充：问一问，一天可以回答100个，我去试试看能不能引流\n\
    \n---\n\n### (精华帖)(62赞)ChatGPT 问世135天，一篇公众号爆文 10 分钟搞定千元收益\n\n作者： 兵王袁宇宙\n日期： 2023-04-12\n\
    \nHi，圈友们，大家好。我是袁永兵，3 万小时电商创业者，山西省商务厅电子商务实操专家。第一次在生财写分享帖，让毙掉了，有很多圈友联系我，感谢大家的认可。\n\
    \n为了验证稳定性，这次文章重新发布，我专门更新了收益截图以及花费时间，对文章又进行了必要的优化。\n\n今天我想分享的不是电商领域，而是想聊聊我是如何把最近大热的\
    \ ChatGPT 应用在自媒体公众号爆文上的事情。\n\n我认为它们两个是有相当大结合的空间的，是有相当大商业想象的，这样的红利，至少有5年，别看国内大厂纷纷入局，没个三年五载，真心赶不上，何况，\
    \ ChatGPT 还在迅速迭代。\n\n很幸运，多次尝试之后，我通过 ChatGPT 的协助写出了多篇 10W+的公众号爆文，且平均爆一篇十万加的文章，就是千元级别的收益，真香。\n\
    \n现在这些号跑通了，趁此机会，我也想回顾一下自己的公众号运营之路，和大家分享一下这篇 10W+背后的故事......\n\n#### 一、为什么想做公众号？\n\
    \n从我和圈友的聊天截图说起：\n\n![](img/37941fd94ce334e82cf16e7f1842c860_25_0.png)\n\n“我是之前看不起这些仨瓜俩枣，但真能落了口袋里。”对，这就是我在五年前的真实想法。\n\
    \n简单总结来说，2021 年上半年结束搞短视频、直播，赔完 300 万，还负债 300 万后，彻底重新审视自己，所有的变化都来源于这次经历，因为残酷的现实不允许再去玩情怀。\n\
    \n没有那些经历，也就谈不上开搞公众号。\n\n2021 年后半，通过朋友、自己寻找，加大了付费社群的入圈，市面上主流的付费社群大部分都加入了，累计超过十万元。这个投入的回报是显而易见的，除了极大地弥补了自己在认知差、信息差上面的差距，对于对齐认知差、信息差，再也不是那种“一说都会，一做都错”的“假知道”层面了。\n\
    \n以及凡是没有经过自己亲自跑通的项目，再也不敢放手去让所谓的“雇佣军”去做主了，真是怕了，市场上能雇到的员工，真的别寄希望什么，尤其是山西，能出来打工就已经说明一切了。\n\
    \n认知差、信息差，这两点的“伪认知”“伪信息”，之前我是盲目自大的，当然教训也是深刻的，人教人，学不会，事教人，一次会。\n\n经历不可跨越，经历的都是财富哈，自助。\n\
    \n当然了，对于执行，这是这么多年来，仅剩的闪光点。\n\n所以，正面回复“为什么想做公众号？”\n\n对于我等 P 民，赚大钱都是从小钱开始的，小钱也赚不了，大钱更无从谈起。\n\
    \n嗯，就是这么个意思，听懂掌声。\n\n#### 二、十年公众号拿起又放下，我终于看到了属于自己的发展路径\n\n回顾我做公众号，有三个阶段：\n\n1.\
    \ 第一个阶段是十年前\n\n2013 年，我跟着大哥和兄弟们注册过十几个公众号，让其中的一个员工去兄弟那里学习了一个星期，那时候发文章发了两年，粉丝最多的一个号，都不到一万，当时连流量主都开通不了。\n\
    \n当然了，当时我们的电商生意很好，根本看不上这点钱。\n\n但也就是这个看不起，后面的公众号也就放下了，彻底地掉队了，而我们大哥、兄弟们干的公众号矩阵在\
    \ 2016 年开始全面进入丰收季，基本上人人都是千万级别收入，真金白银啊！甚至有几位过亿的营收，单单就是公众号哈，赚得盆满钵满，与之对应的是我们在 2018\
    \ 年电商遇到滑铁卢，断崖式下跌，两者一比，天上地下。\n\n这一次，是身边人的爆发，太刺激了。\n\n这里插一小段，2018年，我还注册过一批头条号，捋过一波小收益，就是纯搬运，我自己身份证注册的账号被永久封禁。上个月才找到办法把身份证救出来了，又能使用了。\n\
    \n这预示着2023年，一起搞钱，就是这么顺！\n\n2. 第二个阶段是 2021 年\n\n短视频和直播败完以后，我们注册了百十个公众号，这是第一次批量注册，零星地跑出来几个账号，有粉丝\
    \ 7 万多的、3 万多的、1 万多的，流量主收益几千、几百不等，多数都是搬运内容。我看没有太大的起色，之后又不管了。\n\n直到 2021 年最后一天，我看到公号引流卖虚拟资料的项目，紧急切换引流，当天净赚\
    \ 5K。然后在 2022 年的上半年和下半年，被封在家的那些日子里又打起了公众号的主意，重新开始经营。\n\n这期间，之前跑得最好的一个号，一个月收益 16W，其中有单日过万的记录。要不是被封，哈哈……这就是第三阶段。\n\
    \n经历这么三个阶段下来，给我最大的教训，就是上一篇中提到的“凡是没有经过自己亲自跑通的项目，……”也就是必须躬身入局。\n\n第二个教训就是在入局晚的当下，账号没有粉丝积淀，纯搬运肯定不行。即使单纯靠堆人，遇上\
    \ 00 后整顿职场的这批人，也是天天一地鸡毛，以及行业门槛低、新人培养周期长、老人熟练后走人单干导致培养了竞对等等问题，让我发现维持现状不是一个长久之计。\n\
    \n至于其中的困难，就是上文提到的认知差和信息差，我通过付费来解决。\n\n> 花钱能解决的事，这是最简单的事。\n\n至于自己的执行力。即使自己笨一点，时间不够一点，别人三天，咱三十天、三个月、三年，只要是好内容，任何时候都需要。你看我，十年后再入公众号，依然可以。\n\
    \n这是我2023年公司化入局公众号的第一年，但今年我有了更好的工具，不管是效率还是文章数据效果，都得到了验证，有了明显的提升。\n\n先来看看用 ChatGPT\
    \ 写文以来，其中一个新号到目前为止的数据情况。\n\n![](img/37941fd94ce334e82cf16e7f1842c860_29_0.png)\n\
    \n![](img/37941fd94ce334e82cf16e7f1842c860_29_1.png)\n\n（最新4月11日数据）\n\n#### 三、工欲善其事必先利其器\n\
    \n这个工具就是 ChatGPT 的问世，我最早关注到 ChatGPT 是在 2022 年 12 月初，在 12 月 8 日，在我个人公众号：兵王袁宇宙，就发布了一篇文章。\n\
    \n![](img/37941fd94ce334e82cf16e7f1842c860_30_0.png)\n\n（12 月关注到 ChatGPT 后写的文章）\n\
    \n我预感到了新时代的来临。\n\n这个工具，完全能够解决我上一篇中提到的两个问题——原创度低、效率不高，这不就是内容行业的大杀器嘛！\n\n有了这样的认知，我就开始鼓捣，平生第一次魔法、注册\
    \ ChatGPT。\n\n- 1. 自己注了 1 个，废掉；\n- 2. 某宝买了 1 个，出来的结果断断续续，不好用；\n- 3. 让国外的朋友注了 2\
    \ 个，一个是只关注，我们来使用，效果不佳；\n- 4. 还有一个让她来输出，输出是稳定了，但她自己只是机械地输出，可以说没有灵魂，再加上时差不同，交流起来非常不方便。\n\
    \n尽管磕磕绊绊，但 ChatGPT 生成的顺滑答案，艳羡我等，于是整个春节期间，我都泡在这样 的氛围里，去学习、探索、琢磨，以期得到更直接、更稳定的原创文章解决方案，否则放大操作还是有BUG。\n\
    \n直到 3 月 1 日，官方公布 Openai 开放接口，感觉这下稳了。\n\n这时，在社群里看到一位朋友发的链接，不用魔法，就能使用，它就是我要找的解决方\
    \ 案。\n\n之后通过朋友联系到开发朋友，也就有了属于我们自己的 ChatGPT 链接。\n\n![](img/37941fd94ce334e82cf16e7f1842c860_31_0.png)\n\
    \n当天拿到，开始炮制文章，三天后3月8日的文章就爆了，说是巧合也好，说是运气也罢，就是这么玄学。\n\n经此一番，解决了项目放大这条路上的工具问题。这期间，正好赶上航海，报了AI绘画&ChatGPT以及公众号爆文写作，每天看实战手册去学习，去实践。\n\
    \n总之，现在有了不懂的问题，去看看精华帖、群里问问就是了，它和ChatGPT一样，我有问题，它就有答案，这也是我在加入生财快到一年时，才越发会用它了，因为前提是有落地的、具体的项目，这很关键。\n\
    \n现在这个号的文章篇篇都是ChatGPT写的，目前有20多篇文章的阅读量10w+了。\n\n#### 四、关于这些10W+爆文出炉的复盘\n\n因为有之前的积淀，关于这些十万加的爆文，整体复盘如下。我们主做情感领域，情绪价值更加凸显，所以搭了一个人工+智能（ChatGPT）爆文框架，总共3步：\n\
    \n1. 选题+标题，占50%，做内容就是做选题，选题大于内容\n2. 正文\n3. 情绪价值\n\n这就是我这边的人工+智能（ChatGPT）爆文框架，人工来做\
    \ 1 和 3；ChatGPT 写 2。\n\n这样的一篇文章，很快就能出来，我自己测试的时间，最多 10 分钟就可以全部搞定。\n\n其中，选题、标题用时\
    \ 1 分钟左右，各种爆文库、榜单，都可以看到这些火爆的选题，起标题用时 1 分钟左右，经过 ChatGPT 1 分钟左右输出，也就是说 3 分钟一篇机器文章就能出来，这时候原创度大概在\
    \ 60% 左右。\n\n再用 5 分钟，必须经过第 3 步的调整、优化，加引文、段与段之间的起承转合、文章结尾的升华等方面的情绪价值，这样加起来总共用时不超过\
    \ 10 分钟，就能得到一篇千字原创文章，妥妥地就出来了，且这时候再测原创度，已经高达 70%以上，主流平台都能轻松过关。\n\n##### 为什么加了第\
    \ 3 点情绪价值？\n\n大家都知道，ChatGPT 出来的文章都有相当程度的范式，不是【1，2，3】，就是【首先，其次，然后】，很机械化，也很程序化。\n\
    \n这个我们要表示理解，毕竟是程序员开发出来的，它帮我们整理的回答更加条顺，甚至逻辑自洽。因为它最大的价值就是输入即输出，问就是答案。\n\nChatGPT\
    \ 出来的都是标准答案，我自己评估 ChatGPT 的智商，远胜国内 211 的本科生，但它就是冷冰冰，而这样的文章，之前也测试的发过，数据很一般，就是缺少了人情味，缺少了情绪价值，这个就是加第\
    \ 3 点的根本原因所在。不过现在的GTP4，也有了更多的人情味，相当于又帮我们多走了一步。\n\n这就是人工 + 智能（ChatGPT）爆文框架的全部内容。\n\
    \n之后，发出去，交给系统，交给用户。\n\n这里有必要提的一点是，2021 年以来，公众号也加入了系统推荐，这也是近几年公众号与时俱进、长盛不衰的根本原因，如果没有这个平台的变化，根本没有新进入者的更多机会，尤其是一分钱都不花的前提下做账号，更是如此。\n\
    \n在这样的平台下做内容，非常的友好，如果没有系统推荐，在公众号诞生 10 年后再次入局公众号，且没有深厚内容功底，基本没有任何可能拿到好的结果，这一点，要深刻明白，这是平台给予的红利，这是2023年，公众号10年之后再入局的最大运气。\n\
    \n另外，2022 年上半年之前，发布视频在视频号给公众号导流，也让部分人抢到了红利，我也有些号是在这个时间内成长起来的。刚刚视频号增加了分成计划，如果在图文基础上，再加做个视频，公众号+视频号，一文两吃，稳得一批，相信是更大的红利。\n\
    \n#### 五、最后来和想做自媒体的朋友们，聊聊我的心里话\n\n台上一分钟，台下十年功。一点不假。\n\n很多人上来就想的是自己一写，发出去就是 10W+，恨不得篇篇都是\
    \ 10W+，兄弟姐妹们，清醒一下哈！\n\n这是做自媒体最要命的心态，更是绝大部分人三天打鱼两天晒网，坚持不下来的崩溃现状，这样的心态，仍然需要再次锤炼，因为大家都必须深刻了解的一点现实是，公众号爆文写作，这个事情，其实是一个长期累积的事情，就先从持续做这件事一百天开始，一年开始，能不能有这样的恒心，才是这个事情是否取得结果的前提。\n\
    \n就拿我来说，你看到的是 10W+，看不到的是前后折腾十余年，更看不到的是前后十年三次起号铩羽而归的不甘心，以及账号违规、被封……这些无法与人述说的坑，所有这些避坑规则都是路走多了、学费教多了以后蹚出来的。\n\
    \n这里有必要提一下我 2022 年的航海，一次航海报 3 个左右的项目，就是犯了“贪多嚼不烂”这个错误；再看看我之前的陋习，爱看各种报告，这样的报告在各大社群满天飞，非常热爱看、转、收藏，浪费了大量时间，因为那些报告都是坐在办公室的实习生写出来的，都是水货，再说，老看这些所谓高大上的报告，没有一点干货，会让人飘飘然，这就是本文我自己反复提及的“一说都会，一做都错”，这个毛病的根源之一就是报告看多了。\n\
    \n所以，2022 年开始，我不再看高大上的报告，只着眼于细微的文章写作，就拿练习起标题来说，曾经连抄了一个月的标题，每天到公司第一件事就是打开爆文榜，抄一页\
    \ A4 纸的三段式标题，之后再总结它们的共性，类似于这些熟能生巧的办法，信手拈来的好词，融入 seo 的关键词布局，人性的拿捏……太多需要掌握的技能，才能千锤百炼出爆文。\n\
    \n当然了，这里最难的是思维的调整，太难了，这就仍然属于认知的范畴，你得认识到并做调整，因为认知太难调整了，以至于我在 40 岁的当下，我仍然在调整，因为认知不调整，结果很难看，想一想我经常自勉的这句“如果我是对的，早就不是现在这样了。”\n\
    \n话说回来，虽然有了 10W+的文章，但总感觉，这样编出来的故事，容易让人举报，即使不被举报，限流、违规、封号出现的概率太大太大了。\n\n如果是几年前的我，肯定就不干这事了；现在的我，号封就封了，只要产出大于投入，就能接着干。\n\
    \n当然了，还是要尽量避免封号，做得稳一些，学会保护自己，不在朋友圈、交流中，透露账号名称等，这都是不得已的好办法。\n\n下图是另一个 10W+文章的收入截图：\n\
    \n![](img/37941fd94ce334e82cf16e7f1842c860_36_0.png)\n\n最后，有圈友加我，部分圈友提出让我给转发这些爆文的链接，出于自我保护，还请各位谅解，这里一并表达歉意，如果你们不理解，将来也会理解的，哈哈。\n\
    \n### 评论区：\n\n周彦充：哈哈，我也在做公众号，向大佬学习，目前只有500多粉丝，估计很快破1000\n\n兵王袁宇宙：2023年，一起搞钱，GPT是咱们普通创业者最大最好最友好的机会[拳头]\n\
    \n周彦充：不仅GPT，AI时代科技时代机会多多，共勉\n\n兵王袁宇宙：共勉\n\n风轻云淡：太厉害[强]\n\n程为自己：可以交流一下吗？\n\n希声：厉害\
