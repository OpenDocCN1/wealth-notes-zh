    根据这篇文章的写作风格，我将其命名为“客观报道风格”。这种写作风格的特征有：


    - 文章采用第三人称冷静的口吻叙述事件，避免使用第一人称“我”。

    - 文章重点是呈现事实和证据，而非个人观点和评价。报道的语气理性客观，没有夸大其词。

    - 文章提供多个角度的信息，包括受害人家属，警方，学校等方面的回应，让读者全面了解事件。

    - 文章采用典型的新闻报道结构：导语段落交代事件概述，后续段落按时间顺序和事件逻辑展开叙述细节。

    - 文章用词简洁明了，避免修辞和感情色彩，力求精准立体地再现事件经过。


    ### 角色 B


    再用提示词得到一个点评热点事件的角色 B，主要是点评和分析热点事件，以及了解背后的逻辑和其他问题。


    我们不是专业的点评人，反正我不是，所有一点点考虑不全面，那么ChatGPT可以给我一个相对全面的思路和角度。


    这里利用 aicospaly 来写一个提示词。https://role.aicospaly.com.cn/zh/?


    输入的关键字是：热门事件点评人


    下面是具体的提示词信息：


    > 我希望你扮演热门事件点评人。你是一位专业的新闻评论人士，经常在媒体平台上发表评论和分析，深度解读热门事件，对各种社会现象和政治事件都有着独到的见解和分析能力。你的语气沉着冷静，思路清晰，善于用生动的语言将深奥的问题讲解得易于理解。你的职责是通过你的点评和分析，帮助观众了解热门事件的本质和背后的深层次问题，引导公众的舆论方向，对社会进步和民生福祉发挥着积极的作用。


    ![](img/37941fd94ce334e82cf16e7f1842c860_55_0.png)


    ## 开始写文章


    - 注意：重点是字数 1200 字左右，不要太多，完读率不高。

    - 直接上提示词，参考如下（可以复制粘贴那种）：


    > 用“客观报道风格”来扩写一篇文章，并点评和分析，帮助观众应该注意什么，不少于 1200 字：（xxx）


    括号里面的为具体的事件内容，把角色 A 和角色 B 的分析结合起来，下面详细的样例。


    > 用“客观报道风格”来扩写一篇文章，并点评和分析，帮助观众应该注意什么，不少于 1200 字：

    > （2023 年 3 月 1 日 18 时 30 分许，违法人陈东在杭州地铁 2 号线至的地铁列车上，以手碰、生殖器贴蹭李某某臀部的方式，对李某某实施猥亵。陈东的行为已经构成猥亵他人的违法行为，且在公共场所以猥亵他人，属严重情节。行政处罚的种类和依据：根据《中华人民共和国治安管理处罚法》第四十四条之规定，决定给予陈东行政拘留十二日的行政处罚。）


    ![](img/37941fd94ce334e82cf16e7f1842c860_56_0.png)


    Bingo，文章就出来了。别急还没完，也快完了。


    建议跟着下面的Tips过一遍，补充和完善。


    ### Tips:


    - 如果在生成的过程中，中断了，或者是字数不够，可以输入「继续」来继续写文章，一般继续的次数在1～3次左右就够了，过犹不及。

    - 自己在通过生成的全文来适当的修改，并做一些删减的动作，或者加一个钩子之类的、加几句金句，亦或是引导用户关注和评论。

    - 粥左罗老师说的：ChatGPT 写得快，我们思考文章的框架好，那么一个快、一个好，结合起来是不是就超过了不少人了。

    - 字数控制在 1200 左右为佳，多了完读率不高，然后用户点赞后，在底部的推荐就会减少。


    ### 4. 配图，封面和标题


    #### 配图


    对于配图，如果是**事实热点**，就去小红书、抖音找对应的视频，然后下载下来自己截图放到文章里面。


    - 这里用一个抖音的举例的视频来举例：

    - 打开抖音搜索关键词，转发复制链接

    - 打开微信搜索抖音去水印-> 随便选一个-> 粘贴，并处理-> 下载

    - 有了本地视频，想怎么操作就怎么操作，如果是 iPhone，直接在图片里面拖拽，找到合适的帧，然后截屏并修改大小即可，不需要任何其他软件就能完成。


    如果是情感、搞笑之类的文章，可以用第三方的编辑器来编辑文章，插入无版权的图片等等，文章的头和尾签名，非常的方便，以及自动导入公众号的文章。


    #### 封面


    关于封面，前不久看了 B 站何同学的测评，普通人的封面影响不大。感兴趣可以在 B 站查看详情，我个人建议如下。


    - 如果是情感类的文章，封面最好选 自带流量那种图片，比如美女、帅哥之类的，你懂的。

    - 如果是实时热点，建议用热门小红书、抖音热门的 视频或笔记的封面。别人验证过的，靠谱，记得不要带上别人的个人信息了，免得被举报了。


    #### 标题


    标题是重点，因为是大数据推送，没有好的标题，没有人会点击进来看的。


    热门标题的模板，大概是下面这样的（来自航海手册的截图）。比如我最近写的一篇就是「万万没想到，xxxx」，阅读量比之前翻了 10 几倍。


    | 疑问体 | 恐吓体 | 诱惑体 | 拒绝体 | 惊叹体 | 其它体 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | 你知道***吗? | 千万***! | 1分钟学会** | 99%的人不知道** | 我有一个朋友*** | 具体看 |

    | 你见过***吗? | 绝对不要你能** | 3秒看住** | 这视频可能会拍到 | 很火的人说一尾怎么回应的? | 不得了! |

    | ***值不值? | 一定要知道*** | 一招解决** | 这个视频可能会拍到很多同行*** | 很多人问我“**这么自然的? | 太可怕 |

    | 为什么***? | ***快没了! | 牢记5点** | 不的了，今天必须说 | 你们还知道吗? | 竟然! |

    | ***怎么办? | 赶快***扔了吧! | 6种技巧*** | 再也忍不住了** | 挑战***100天 | 万万没想到 |

    | ***好不好? | ***到底有多难? | ***学会能省100万 | 注意** | 10年来我***的事 天网, 居然 | |

    | ***如何***? | 再不***就晚了! | 收藏这5招 | 最新消息! | 我投了***了 | 炸锅 |


    同时这里结合 ChatGPT，来生成标题，用提示词是：


    并给上面的文章，给出 20 个可能火爆的标题，让读者看了标题就忍不住想点进来看，字数在 30 字以内这里可以结合


    ![](img/37941fd94ce334e82cf16e7f1842c860_58_0.png)


    关于文章标题生成 也可以参考这篇文章： https://t.zsxq.com/0e4uFjKmv


    直接简单粗暴的把你们的小红书改为「公众号」即可，并且我在最后关键点为改成了这样，更适合公众号的口味：


    你写得很不错，但有一点要求需要给你做到补充，请按照下面的要求修改：


    第一、控制字数在 30 字以内，更简短


    第二、选取下面 36 个爆款关键词的 1-2 个，穿插到标题之中。


    把下面的*号需要换的内容


    - 你知道**吗？

    - 你见过**吗？

    - **值不值？

    - 为什么***？

    - ***怎么办？

    - **好不好？

    - ***如何***？


    ……（太多了，直接看上面那张来自航海手册的截图）


    来看看生成的标题，是不是有那种味道了。


    ### 这里是修改后的 20 个新闻标题：


    1. 12 天就出狱？地铁‘魔手’10 可值不值？

    2. 警方通报地铁猥亵案 监控录像 3 秒看真相！

    3. 地铁‘魔手’认罪了，法院判决原因震撼

    4. 地铁‘魔手’出狱后消失，警方通报很多，问难

    5. 地铁‘魔手’父亲道歉？儿子心理扭曲，招解读

    6. 地铁‘魔手’再犯，警方紧急通缉，天啊

    7. 地铁‘魔手’家庭背景让人震惊，绝对不要相信！

    8. 记者探访地铁‘魔手’家属，又得 7 天

    9. 魔手？变？突手？新证据颠覆定局，一定要知道

    10. 地铁性强扰案，警方通报透露真相，不管了，今天必须说！

    11. 地铁‘魔手’竟然是女警？！警方通报漏网白出！

    12. 魔手”事件，一波三折，公众要求重新通报，你愿意吗？


    到这里，文章就全部完成了，还差一步就OK。如果是经常发公众号的，下面的流程都比较熟悉，都是一些小Tips。


    ### 5. 文章发布


    #### 文章属性设置


    - 原创，这个原创会增加自己的推荐率，必须勾选。

    - 里面的分类选择对应的分类：社会->热点情感等等，如果是人群画像是喜欢这类文章的，同时增加打开率和完读率。

    - 赞赏建议有就开启吧，毕竟就是为了给自己增加收入的，增加正反馈的。增加了一种途径是好事。


    #### 发布时间安排


    - 如果是一个新的公众号，也没有大号作为引流，这个阅读量大概率就是来自推荐里面，或者是搜索推荐。

    - 发布的时间我还没试出来。不过看了热点的文章都是 00 就更新了，热点就是需要热，越早越好；情感的饭后时间点发布比较好

    - 文章在发布的可以定时「群发」，这个一定要选群发，不要选「发布」，


    ### 推广


    - 如果有大号或者其他推广的资源，这个时候可以利用起来。

    - 如果没有，也不要担心，我发现还有免费的流量，实时热点、情感类的文章，大家觉得哪里是最好的途径喃？欢迎交流。目前我发现有微博流量，带热点的标签，这样就自然的流量，虽然这个流量没有变现，但是可以给文章增加阅读
    +1，就可以带来流量效应，增加文章的推荐率。

    - 如果时间充足，可以考虑知乎、百家号、头条，都来一波，并且用关键字带上自己的公众号标签来引流。


    大家好，我是叉叉敌，叫我小叉就可以，希望大家多多交流，如果有用记得点个赞呀，谢谢~


