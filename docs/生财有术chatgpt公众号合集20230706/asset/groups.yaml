    **事件开端（30%篇幅）：**

    主人在一个市场偶然遇见了当年的暗恋对象。两人开始重逢，畅谈过去，回忆年轻时的点滴。主人公得知对方当年也喜欢自己，但因为双方都没有勇气表白，错过了美好的时光。


    写出这部分故事，限400字以内，要求：

    1.在风格A的基础上，采用第一人称口述的风格，语言平实

    2.语言平实、生动，易于引起读者的共鸣。

    3.内容要多描写行为、动作、语言，不要过多描写内心想法。

    4.不要扩展其它内容。


    # 5 合并内容，人工润色


    人工修改润色必不可少，ChatGPT不能保证每个部分衔接的非常好，经常会有多余的内容。


    # 6 写标题


    人工起一个吸引人的标题。尝试过ChatGPT直接生成标题，但不是太满意。可以让ChatGPT起几个提供灵感。


    如何让ChatGPT生成一个好标题，我还在调教中。


    # # ChatGPT写作心得


    公众号懒人找资源，懒人专调群分享'
  - '[PAGE 46]


    +   1. 一定要用GPT-4。相比3.5提升很多，除了速度。

    2. 不要想文章全部由ChatGPT自动写，或批量生成，那样质量不会太高。

    3. 一篇文章从构思到发布，耗时约1~2小时。主要是因为GPT-4速度太慢，我本人长时间处于待机状态。最好不要晚上写，速度比白天慢很多，还经常出现网络问题。

    4. 一篇文章人工占40%，ChatGPT占60%。人工包括：选题、设定情节、调整润色ChatGPT生成的文章，写标题，上传发布。

    5. 具体到文字部分，ChatGPT可以完成80%以上，人工主要是删除多余的内容。


    以上是最近使用ChatGPT的实战结果和心得，全部奉上，毫无保留。如何让ChatGPT写得更好，以及ChatGPT的其它应用，我也在学习中，欢迎交流。


    最后，这篇文章是我自己写的，没用ChatGPT。


