    \n这老先生的水墨画，寥寥几笔，非常有味\n\n1300 11 23\n\n## 用户分析\n\n![](img/37941fd94ce334e82cf16e7f1842c860_103_0.png)\n\
    \n# 常读用户指标\n\n- 常读用户月净增: +433\n- 常读用户数: 1514\n- 常读用户比例: 38%\n\n到今年的2月份的时候，是所有的号加一起月利润过万的，我其实蛮意外的，但是我没有选择去放大这件事，一是我目前在全力做新消费的创业没有多余的时间，二是我本来也不是很熟悉广点通的投放，三是可能广告费多了之后，单位用户成本上升，又会有个回本周期，所以没去搞它（目测放大个几倍应该没啥问题）。\n\
    \n## 2、这种类型的项目还能做么？\n\n我说下我的观点，能做！（个人感觉这个真的很容易，适合很多普通人）。公众号流量主虽然很红海，但是细分市场依然是存在很大机会的。\n\
    \n但是有个前提，你要结合你对目标用户群体的理解，理解用户的行为习惯、聚集地、需求等，很容易判断出你的领域适不适合做，以及能不能放大。还是之前那句话，要构建自己的底层逻辑，然后去判断！\n\
    \n比如我觉得，要是做宝妈类用户方向、副业类方向、文艺类方向等的流量主帐号，那么不适合。要么单位用户获取成本太高，要么用户是重度互联网用户，很优质内容，要么用户没有微信内热更分享的习惯，那么结果就是，流量主点击率低、要么是你靠前期广告或者其他方式得到一个基础启动量，但是根本得不到任何粉丝的增长的。\n\
    \n比如中老年市场或者说中老年兴趣市场，我认为是存在各种形式的流量生意的，中老年在整个微信体系的量是很庞大的，而且她们真的很热衷分享，这里简单分享之前看的一组数据。\n\
    \n- 腾讯曾在2015年的业绩报告里提到：截止2015年第一季度，微信每月活跃用户达5.49亿，其中50岁以上的用户占比约为2.3%，也即1263万中老年用户。\n\
    - 然而，到了2018年，微信中老年用户数量陡增。微信数据显示，截至2018年9月，微信55岁至70岁用户达到6100万。三年增长了接近4倍。\n- 如今，尽管微信并没有公布老年用户数量，但其在国内月活已经超过11亿，是公认拥有最多中老年用户的平台。\n\
    \n体量有个数之后，再看下中老年群体的线上用户特征。\n\n中老年用户是极其没有被互联网满足的一波人，目前大部分适老化产品只是一些功能和使用上的提升，从深层次的用户需求来讲，可能并不多。这里有一点，中老年爱分享，大家可能了解美篇，美篇最开始也是满足了用户爱分享和自我表达的需求，就好比大多数父母喜欢给子女转发文章是一样的，她们是很需要自我表达以及社交满足的需求的。\n\
    \n之前看过的美篇的一个数据，累计注册用户2亿，累计创作用户4000万，累计作品数3亿，累计上传图片60亿张，APP月活跃用户1200万，日访客数2000万。这里已经成为很多中老年项目创业者获取流量的阵地了。\n\
    \n这也是为什么我之前觉得能做，然后很快就产生被动收入的原因，靠几百的基础粉丝量产生过很多次几千阅读量的文章，本质不是内容的问题，而且这个群体用户习惯的问题，所以能靠很少的基础粉丝量启动。\n\
    \n还有很多垂直的细分市场，如果大家对该用户群体有理解，比如用户行为为热衷分享，有浏览文章的习惯，都可以去小范围测试一下，至于具体的开通公众号、流量主等操作方法这里不多讲了，都很简单。\n\
    \n## 3、想赚钱最重要的是什么？\n\n我觉得还是之前分享过的一个点，就是对自己有个清晰的定位，找到自己擅长的点，且用自己做起来不痛苦的方式，然后找到一拨人群，挖掘他们的用户需求，带着流量端、产品端、变现端的底层逻辑去找，是很容易找到一小块细分市场，然后在结合用户需求打造MVP冷启动尝试，剩下的就是用心提供价值，等着收获就可以了。\n\
    \n但是结合最近的一些思考，在这里说一下，我觉得有必要加个用户端，就是用户端、流量端、产品端、变现端。\n\n发现很多人对用户的思考或者说理解是不够的，比如前段听的一个消费品的案例，很多人做消费品，上来就说自己的受众用户是25-35的宝妈，注意，是25-35的**宝妈**，所以从消费品角度来说，这已经是两代人了，很多消费习惯和消费行为是完完全全不一样的，如果归为一类，很容易出现定价失误以及营销错位的。\n\
    \n还有比如开创外卖CPS业务、表情包引流小程序变现业务等的人，从底层逻辑来看，都是很类似的，但是业务形态却不同，她们一定是对用户的需求和行为有深度理解的，然后才能谈，怎么搞流量、产品以什么形态做，然后去变现的。\n\
    \n包括前段亦仁分享的第六期的一些改变，有个很重要的就是实战，出结果等，这就是对用户理解的很透彻，很清楚我们想要什么。\n\n只有对用户的理解足够深，才能不断的做出超预期，以及找到流量洼地和适合这波人的营销方式。\n\
    \n今天分享这么多，希望大家能多多在这个方向上思考一下~~~\n\n评论区：\n\n- **超级奶爸Rock**：很棒的分享 [强]\n  - 渔火：感谢圈友认可[抱拳]\n\
