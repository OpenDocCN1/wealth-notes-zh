    ### 1、 从生财的GPT风向标，看到时代红利


    最近ChatGPT很火，地球人都知道，本来我没怎么关注的，但看到周围人都在研究，讨论得热火朝天，又刷到不少短视频，都是讲ChatGPT，于是，我就研究了一番，先是加入了一个知识星球，但折腾好几天，都不懂得怎么使用。


    最后，花钱去请教了几个业内人士，才学会如何登陆，但还是不懂如何使用。刚好，我想到最近加入的生财有术，我就去搜索相关内容查看，看到风向标，关于ChatGPT的内容非常多：ChatGPT是什么，如何使用、怎么用它来提高工作效率等等，琳琅满目。


