    # ## 四、关于这些10W+爆文出炉的复盘


    因为有之前的积淀，关于这些十万加的爆文，整体复盘如下。我们主做情感领域，情绪价值更加凸显，所以搭了一个人工+智能（ChatGPT）爆文框架，总共3步：


    +   1、选题+标题，占50%，做内容就是做选题，选题大于内容

    2、正文

    3、情绪价值'
  - '[PAGE 33]


    这就是我这边的人工+智能（ChatGPT）爆文框架，人工来做 1 和 3；ChatGPT 写 2。


    这样的一篇文章，很快就能出来，我自己测试的时间，最多 10 分钟就可以全部搞定。


    其中，选题、标题用时 1 分钟左右，各种爆文库、榜单，都可以看到这些火爆的选题，起标题用时 1 分钟左右，经过 ChatGPT 1 分钟左右输出，也就是说
    3 分钟一篇机器文章就能出来，这时候原创度大概在 60% 左右。


    再用 5 分钟，必须经过第 3 步的调整、优化，加引文、段与段之间的起承转合、文章结尾的升华等方面的情绪价值，这样加起来总共用时不超过 10 分钟，就能得到一篇千字原创文章，妥妥地就出来了，且这时候再测原创度，已经高达
    70%以上，主流平台都能轻松过关。


    # 为什么加了第 3 点情绪价值？


    大家都知道，ChatGPT 出来的文章都有相当程度的范式，不是【1，2，3】，就是【首先，其次，然后】，很机械化，也很程序化。


    这个我们要表示理解，毕竟是程序员开发出来的，它帮我们整理的回答更加条顺，甚至逻辑自洽。因为它最大的价值就是输入即输出，问就是答案。


    ChatGPT 出来的都是标准答案，我自己评估 ChatGPT 的智商，远胜国内 211 的本科生，但它就是冷冰冰，而这样的文章，之前也测试的发过，数据很一般，就是缺少了人情味，缺少了情绪价值，这个就是加第
    3 点的根本原因所在。不过现在的GTP4，也有了更多的人情味，相当于又帮我们多走了一步。'
