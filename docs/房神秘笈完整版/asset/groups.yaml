    \ = (P_2 - L) / 2$，作为交易期权费。然后安排房东与买家签订真正的买房合同，同时新买家支付另一半，即 $M$。\n\n上面的步骤环环紧扣，层层推进，导演了一幕典型的“空手道”大戏。\n\
    \n### 投资者的核心收益来源——租金\n\n要想了解“以租代买”的收益来源，必须通过实例讲解。\n\n### “以租代买”操作示例\n\n记住，一定要分别签订“租赁协议”和“期权协议”，后文会详细介绍这两种协议。\n\
    \n你找到房东张某，签订“以租代买”合同包（即一份“租赁”合同，一份“期权”合同），规定三年内每月于 7 号前交租金 2000 元，锁定买价 250,000\
    \ 元。然后你转租出去，要求租客每月 2 号前交租金 2200 元。三年后房东未卖，你找到买家李某，愿意出价 240,000 元买房，低于市场价格 10,000\
    \ 元。\n\n你的资金流转将按如下进行：\n\n- (1) 签订合同取到钥匙时，交给房东张某 4000 元（一押一租）；\n- (2) 添置简单家具用 400\
    \ 元；找到租客时，收取 4400 元，立即弥补了所有支出；\n- (3) 每月于 2 号向租客收 2200 元，于 7 号交 2000 元给房东，每月收益\
    \ 200 元；\n- (4) 三年后，该房产的购买净价为：\n  $250000 - (2000 \\times 36) = 178000$\n  \n\
    \  则你向李某收取应得收益的一半，即：\n  $\\frac{(240000 - 178000)}{2} = \\frac{62000}{2} = 31000$\n\
    \n当你安排李某与张某签订新的房产购买合同后，收取另一半 31000 元。\n\n整个过程中，你总收益为：\n$200 \\times 36 + 62000\
    \ = 69200$\n\n仔细分析这个过程，你会发现，实际上“房东”张某是赢家，因为他在三年时间里减免了租房的麻烦，并顺利获取房屋销售收入。\n\n“新买家”李某也是赢家，因为他用比市面便宜\
    \ 1 万元的价格买到了房产。\n\n投资者当然也是赢家，因为实际投资为零，却获得了近 7 万的收入。\n\n租客也以市场平均租金，得到了自己需要的居住空间。\n\
    \n所以，整个交易的全过程中，没有输家——投资者通过“以租代买”合同，成功地实现了“四家全赢”的皆大欢喜结局。\n\n![](img/acb46489adfd772451884bb9efeed060_68_0.png)\n\
    \n请仔细查看上图，可知道实际上投资者获取的收益基本上都是由“租客”提供的，租金是投资收益的主要构成。\n\n租客实际共支付了 79200 元（即 $2200\
    \ \\times 36$），其中 1 万元用于“代”买家支付了购房价，其余的 69200 元支付给了投资者。\n\n而投资者所获得的 69200 元“支付”，是通过两种渠道完成的：\n\
    \n- 一种为“直接支付”：你可以通过每个月的租金差额产生正现金流；\n- 另一种为“间接支付”：你通过“转让期权合同”，将房产按“原市场价值”出售给“新买家”。而期权合同价与市场价之间的差价，是由租金产生的，却是通过“买家”来支付的——即你把租金交给房东，买家又把“租金”支付给了你。这样就成功地把前面已交给原房东的租金又赚回来了。\n\
    \n综上可知，“以租代买”最神奇的地方在于：投资者虽然并不拥有房产，却可以借别人的房子来赚取 100% 的全额租金，而不仅是“转租”的价差。更关键的是，这一切都是“免费”的“午餐”。\n\
    \n### “以租代买”的三大利润源泉\n\n虽然说“租金”是我们的主要收益来源，但实际上我们的利润源不仅限于“租金”。除“租金”外，还有三大潜在利润来源：\n\
    \n#### （1）低价买入\n\n房产一般存在“市场价”与“合同价”两个价，当你与房东商定“以租代买”的“买价”时，如果可以通过谈判技巧压低“买价”，那么你实际上就已经实现了一种利润——低价买入差价。这种利润最后将通过“买家”支付的“合同转让费”来实现。\n\
    \n比如，你找到一处市场价值 30 万的房产，与房东签订“以租代买”协议，运用谈判技巧，合同定为 28 万。当三年后转让合同时，你以市场价出售该“房产”，即\
    \ 30 万。那么，你就实际上赚到了通过谈判实现的 2 万差价。\n\n所以，你要记住，最“暴利”的房地产投资环节就是“谈判”，几分钟也许就可以实现几万的收益。\n\
    \n#### （2）地段升值\n\n一般情况下，房产都会随着城市建设发展而升值。由于我们“以租代买”模式的年限较短，如果选择老城区的话，升值空间将较小；所以，聪明的投资者，一般会选择城乡结合部的地域投资——这也是万科集团的投资智慧。因为这类地区升值空间最大，一般房产开发周期为\
    \ 2~3 年（从地区买入到出售），3 年后就可以实现投资回报。\n\n你也可以借鉴这种投资思路，在升值空间较大的地区采取“以租代买”来锁定房价，并以“零成本”持有\
    \ 3~5 年（因为一般“以租代买”的房东不愿意接受超过 5 年的期限），等待升值后，通过“转让合同”实现“地段升值”收益。\n\n#### （3）高价转让\n\
    \n高于市场价格卖房是完全可能的。只要你能实现两个增值：“房产增值”和“交易增值”。\n\n导致房产增值的最直接的因素还是外在的：即前面介绍的地段升值；另外，还有一些方法可以人为地快速增加房产价值：\n\
    \n##### 装修增值\n\n找到好的装修专家，帮你设计并改造房产，往往可以实现“麻雀变凤凰”的效果。只是这种方法投资较高，存在一定风险。\n\n#####\
    \ 内涵增值\n\n如果你可以为该房产找到一个比较独特的卖点，使其具备了不一样的内涵，那也可以实现增值；而且一文不出，坐地起价。比如：风水好。\n\n我们投资过的一处房产，处于顶楼，价格又较高，正常来说比较难卖（60%\
    \ 的人不愿选择顶楼）。我们听房东提起，他买入这处房产后，不到两年就生了个儿子（他以前只有一个女儿），于是大受启发。我们立刻查找相关的风水书籍，提炼了一个“得子宝宅”的卖点。\n\
    \n一经推出，大受欢迎。很快就以高于市场价 10% 的价格出售了，买家也不介意什么“顶楼”了。\n\n“卖点”一定要具备“与众不同”的特色，与同地段房产相比，对买家的吸引力才能十足，才能“包装”升值。\n\
    \n##### 融资增值\n\n如果你可以帮助现金不足的买家买入房产，那么你就可以按高于市场价值的价格出售“房产”——因为你通过“帮助融资”，而使房产实现了“增值”。\n\
    \n比如，你找到一处市场价值 30 万的房产，通过“以租代买”持有三年。当转让合同时，你可以市价出售该“房产”，即 30 万。而买家最多一次性拿出 20 万，还差\
    \ 10 万元。你为买家提供“过桥”担保，通过融资公司向买家提供 12 万元贷款，并要求把房价提高到 32 万。等房产过户完成了，将该贷款的担保转为“房产担保”。\n\
    \n这样，实际上你只不过是作了一个“过渡”作用：买家拥有房产前，是无法提供担保物的，所以无法贷款。买入房产后，就可以把该房产作为担保物来贷款。你就充当这个“过渡”性的担保职责，从而帮助买家得到贷款，支付购房款，购入房产后转由“房产担保”，买家承担日后的还款工作。然后你就可以抽身出来。\n\
    \n整个操作过程中，你可以完全操控房产的交接过程，可以直接控制风险。其收益却是非常直接。基本上 2-3 个月内就可以赚到几万元，而且买家会心甘情愿。\n\n\
    此外，后文将介绍其他一些“融资技巧”，都会帮助你轻松赚钱。\n\n这里我们介绍了“装修”、“内涵”、“融资”三种增值方式。三种方式比较，我们更推荐“融资增值”。因为这种方式几乎不需要额外投资（相比于“装修增值”），适应面广（相对于“卖点增值”），价值明显（可以立竿见影地解决买房人的经济障碍）。\n\
    \n房地产投资本质上是一种“资本游戏”，懂得“融资”操作的人可以获得更大的收益。\n\n### 其他利润源\n\n除了以上所介绍的三大利润源外，“以租代买”还具备其他潜在利润点：\n\
    \n- “税收减免”：由于房产证上写的不是你的名字，所以税务机关无法查实你的出租收益；\n- 租金预交：你可以通过低租金策略，吸引租客一次性交纳较长时间租金，以方便资金流转进而获利；\n\
    - 直接转让“以租代买”合同：如果房东坚持索要较高定金，而你又不想放弃这处房产，你可以直接将该“以租代买”合同转让给别人，由别人接手完成合同。\n\n只要你付诸大量实践，不断思考创造性的解决方案，就可以从“以租代买”挖掘出更多的利润点，从而加快自己的投资脚步。\n\
    \n### “以租代买”的暗礁\n\n通过前面的反复讲解，相信你已经开始对“以租代买”初具信心。但“以租代买”也存在一些“暗礁”，几个要点一定要谨记；否则“以租代买”将带给你的不是财富，而是噩运。\n\
    \n#### 收益的核心源是“转让机会”\n\n无论你如何努力地“把房屋升值”，以便出租个更好的价钱，都请不要忘了——只有“转让期权合同”才能让你真正致富。\n\
    \n![](img/acb46489adfd772451884bb9efeed060_74_0.png)\n\n让我们再重温上面示例中的“收益分配图”。你辛辛苦苦地作“三明治式出租”（即转租）三年，所得的租金差价不过是：\n\
    \n$$200 \\times 36 = 7200$$\n\n而“转让期权合同”可以一个月内就收入 62000 元。与租金收益相比，有将近 8 倍的增幅。\n\
    \n所以，当你获得“以租代买”合同后，第一件事是找到租客来承担前面的租房成本；第二件事，就是去寻找可能的“买房人”。\n\n找“承租人”是立即减少你的房产持有风险，使自己稳立于“不败之地”，长期持有也不怕，可以克服多种潜在的困难。但“不败”的背面却是“不胜”——靠转租差价是不能帮你赚到钱的。\n\
    \n最主要的收益实际上是找到买房人，以吸引人的卖点（如价格、融资方案等）尽快转让那期权合同，让买家掏钱出来购买，并支付给你应得的“价差”——就可以尽快实现大额现金流入。\n\
    \n根据我们的经验，最可行而且最容易的方案就是设计一套融资方案，帮助不够钱买房的人买房——不需等到地段升值，不需装修增值，不需设计独特“卖点”。只要买房人支付一部分房款，甚至只需\
    \ 10% 的首期款就可以了（后文会详细介绍如何设计融资方案）。\n\n我们只要找到一处吸引买家的房产，通过设计一套好的融资方案实现房产交易增值，把合同转让给买家，帮助买家与房东签订购房合同，然后就可以提取你的“报酬”了——就是“期权房价”与“增值后房价”的差价：这个差价收益其实是远远高于转租差价的。\n\
    \n因此，你寻找并锁定的房产最主要的特征就是“吸引买房人”。如果你找到的房产只适合于出租，年限已长，地段治安较乱——那你获得的收益将微乎其微，甚至把你的时间与精力都耗费在“与租客斗牛”上面了；那你就不会在用脑去投资，而是在用体力。\n\
    \n所以，寻找有“转让机会”的房产，并增值化转让才是“以租代买”获利的根本所在。\n\n#### 多赢才能久赢\n\n正因为你更多地借助“融资方案”的设计来使房产升值，而不是侵蚀房东的卖房收益；既帮助了买家，更帮助了卖家，真正的多赢设计。因而可以在交易整个过程里，始终保持顺利实施。\n\
    \n正所谓：“大家好，才是真的好；‘以租代买’真好！”\n\n![](img/acb46489adfd772451884bb9efeed060_76_0.png)\n\
    \n只要房产状况及地段不错，根据市场价格与房东签订“以租代买”协议就可以了。从而不必太在意“议价技巧”。\n\n因为谈判技巧好的投资人虽然可以在“交易价上”获胜，但是当转让期权合同后，需要新买家与房东签订购房合同时，却很容易引起房东的不满，从而影响交易实现。\n\
    \n我们的目标是“多赢”——这种多赢不是建立在“短期小利”上，而是表现为：交易最终结束时，每个参与者都会发自内心的感谢投资者。\n\n补充一句，如果你是转让房东，最后得到期权转让收益后，一定要给房东一点“惊喜”——比如，多给房东一些钱。因为房东看到你利用它的房产获利，多少会心中不快。这些“意外”的收益，即使不多也会让房东“心理平衡”一下，甚至有助于帮你找到新的投资机会。\n\
    \n> **多赢的表现之二，就是签订合同时，明白告诉房东未来可能的交易安排。**\n\n——房东论道\n\n很多投资新手常常忌讳告诉房东自己的投资意图。想用其他的“借口”来事前搪塞询问。\n\
    \n这是新手最容易犯的错误之一。记住：你可能一时欺骗一个人，但不可能一世欺骗所有人。面对买房方面的询问时，当你堂堂正正表明你的投资意向后，房东常常会在其他方面提出自己的“要价”，而很少会明确拒绝。因为房东的目的是“卖个好价钱”，而不是纠缠你买房的真正打算——每个人都最关心自己的利益得失。\n\
    \n所以，当被问起这个“地雷”般的问题时，你一定要立即踩磨到房东真正的“关注焦点”——大部分是怕自己的卖房收益受损，还有的是因为其他原因；找到“焦点”后，通过问句转移话题到房东的“焦点”上去，寻求共赢方案。\n\
    \n当被问：“你买房是自己住吗？”（99% 的房东会问起这个问题。）\n\n如果该房产没出租过，而且布置得比较精心，那么你可以尝试的回答方法是：\n\n![](img/acb46489adfd772451884bb9efeed060_77_0.png)\n\
    \n“您这样说，是担心别人破坏您精心布置的家吧？你放心，我一定会保养好的。如果未来我转让的话，也一定会找到爱护它的人。你认为房产哪里最需要细心关照呢？”\n\
    \n如果该房产本身就正在出租，那就更容易回答：“我可能自己住，也希望有机会用于出租；那么，您有什么好建议？”\n\n如果房东明确提出：忌讳“中介牟利”（90%\
    \ 的房东不希望中介从交易中赚钱）。\n\n你可以补充一句：“我也不喜欢中介，除非他让我赚更多的钱；如果我转让这份协议给别人，把转让费的一半无偿送给您，做为您的额外收益，您感觉怎样？”\n\
    \n这时候，千万不能说称：“自己不会动脑筋”。否则你会后患无穷。\n\n#### 首付千万不能超过 2 倍租金\n\n我们的“零首付”其实并不是真的“一分钱”都不需出，只是出钱之后很快会获得“补偿”——一般不超过\
    \ 1 个月就会由“租客”补偿。\n\n大量的实践经验告诉自己，投入的钱越多，越可能出错——因为用你自己的钱投入得过多，就容易失去判断理性。而且钱越多，风险越高。\n\
    \n当你投入的钱多到促使自己成为“狂热”推销员时，结果就往往相反——因为房产交易是一个很耗时的工作，一个小细节出差错都会使正常的程序拖上几天。\n\n记住，租房永远比买房快。只有当通过租房使自己立于不败之地后，你才会平心静气、稳扎稳打地推进“期权转让”交易。\n\
    \n“租金差价”收益低，但启动快——是“不亏”的保障；“转让期权合同”收益高，但耗时长——是“获利”的核心。\n\n房地产投资最忌讳“铤而走险”“破釜沉舟”的投机主义行为。\n\
    \n“太极拳”运作思路的“完美”，就在于巧妙地结合“出租”的稳健与“转让”的厚利。承担最小化风险，靠“智慧”投资，而非靠“现金”投机。\n\n你首付给房东\
    \ 2 倍月租作为“一押一租”后，可以通过租客快速周转资金。但是如果超过这个“首付”限额，风险就产生了。\n\n我们明确告诉房东是“以租代买”而非“直接购买”，其中一个目的，就是不给房东多要“首付”的借口。既然是“以租代买”那么日常支付就是以“租金”为标准，超出这个“标准”的“索取”都是不合理的。\n\
    \n“先租后转，稳中求胜”——要始终铭记“以租代买”的指导原则。\n\n### 小结\n\n本课介绍了“太极拳”的入门“招术：“以租代买”的基本操作思路。\n\
    \n首先，要通过“以租代买”合同锁定房产；\n其次，通过“转租”实现“零成本、零风险”地长期持有。\n第三，寻找买家，通过多种方法实现“房产增值”后转售——转售的手段即“转让期权合同”。\n\
    \n了解“以租代买”的基本思路后，后文开始详细分解介绍每一个环节的操作。下一课就教你去寻找符合投资标准的房产。\n\n## 第五课 “黄金屋”—简单 3 步筛选房产\n\
    \n决定房地产投资成败的 95% 的因素，取决于整个房地产操作的最初——找到超值的房地产。所以，你也要将 95% 的精力放到获得房地产筛选上面。\n\n对于投资新手来讲，这部“过滤”的工作量很大。你也不可能一间房、一间房的去找，一个房东、一个房东的去谈。聪明人总有捷径走，在这里我们推荐使用如下的“寻宝”方法：\n\
    \n### 第一步： 网站过滤房源\n\n> 这一步的主要任务，就是找到基本满足出租要求的出售房源，并初步确定其市场价格。\n> —— “网站寻宝” 使命\n\
    \n打开本地二手房产交易网站，进入“房屋出售”这类的版区，里面应该有大量的房主出售信息，而且基本上是每天都更新很快。\n\n#### （一）找房源\n\n\
    你要仔细查阅，注意“配套设施”及“房源描述”信息栏。如果描述比较清晰，内容较全面，则 70% 的情况下该信息不是中介发出来的——如果有中介参与，会对我们后期与房东谈判、签约造成不利影响，而且要交纳一定的中介费。所以，首先要学会过滤中介。\n\
    \n而中介由于每天都要发布大量信息，所以很难在每条信息中详细描述房产具体情况。因此，我们借助这种方法首先寻找房主自售的房子。\n\n如果你对该房产所在区域的交通、生活配套情况比较了解，只是不清楚房产的具体位置及所在楼盘新旧，就可以通过\
    \ E都市 ( http://www. edushi. com/ ) 等电子地图网站了解（具体的使用方法在本书的第十四章有介绍）。\n\n注意，我们此时筛选的房产主要用于“转租”，所以要求不必太高，只要满足以下两个条件就可以通过“过滤”：\n\
    \n- ● 地段因素：交通、生活比较便利，出租需求稳定，治安不算太差。\n- ● 房产因素：有基本装修及水电设施，便于入住。\n- ● 公开出售价格属于该地段同类房产的中下水平。\n\
    \n这里要再次强调一下，你不可能把所在城市各区县全都调查清楚。尤其对于投资新手来说，最适宜的起步工作，就是先利用业余时间本地老城区转转，因为这些地方往\n\n\
    > 12 房地产的一大特色就是：什么阶层的人都有需求。所以，即使你以“租代买”得到的房产再破、再旧，只要价格够低，都会有人愿意出价购买。当然，也要考虑未来“转售”、选房产时，以“转租”为标准过滤房产即可。\n"
  mdcn: "\n## 第四课 以租代买——“借房赚钱”绝技\n\n（1）找到房产，与房东签订“以租代买”协议$^{[1]}$，规定月租为 $R_1$ 元，并在3年内锁定房价为\
    \ $P_1$。\n（2）领取房产钥匙的同时支付押金和首月月租，共计 $2R_1$ 元，并规定每月 S 日前交月租；\n（3）购置必要家具及简单装修后，尽快锁定租客，签订租赁协议，租金为\
    \ $R_2$；\n（4）收取租客押金及月租，每月获取租金差价为投资者收益：$R_2 - R_1$；\n（5）要求租客在 S 日前提前交房租，以利用时间差获利；\n\
    （6）寻找到新的房产买家后，商定买价为 $P_2$。此时投资者购买该房产所需支付的净价仅为：$L = P_1 - (R_1 \\times 36)$；则要求新买家支付转让价差价的一半，即：$M\
    \ = (P_2 - L) / 2$，作为交易期权费。然后安排房东与买家签订真正的买房合同，同时新买家支付另一半，即 $M$。\n\n上面的步骤环环紧扣，层层推进，导演了一幕典型的“空手道”大戏。\n\
    \n### 投资者的核心收益来源——租金\n\n要想了解“以租代买”的收益来源，必须通过实例讲解。\n\n### “以租代买”操作示例\n\n记住，一定要分别签订“租赁协议”和“期权协议”，后文会详细介绍这两种协议。\n\
    \n你找到房东张某，签订“以租代买”合同包（即一份“租赁”合同，一份“期权”合同），规定三年内每月于 7 号前交租金 2000 元，锁定买价 250,000\
    \ 元。然后你转租出去，要求租客每月 2 号前交租金 2200 元。三年后房东未卖，你找到买家李某，愿意出价 240,000 元买房，低于市场价格 10,000\
    \ 元。\n\n你的资金流转将按如下进行：\n\n- (1) 签订合同取到钥匙时，交给房东张某 4000 元（一押一租）；\n- (2) 添置简单家具用 400\
    \ 元；找到租客时，收取 4400 元，立即弥补了所有支出；\n- (3) 每月于 2 号向租客收 2200 元，于 7 号交 2000 元给房东，每月收益\
    \ 200 元；\n- (4) 三年后，该房产的购买净价为：\n  $250000 - (2000 \\times 36) = 178000$\n  \n\
    \  则你向李某收取应得收益的一半，即：\n  $\\frac{(240000 - 178000)}{2} = \\frac{62000}{2} = 31000$\n\
    \n当你安排李某与张某签订新的房产购买合同后，收取另一半 31000 元。\n\n整个过程中，你总收益为：\n$200 \\times 36 + 62000\
    \ = 69200$\n\n仔细分析这个过程，你会发现，实际上“房东”张某是赢家，因为他在三年时间里减免了租房的麻烦，并顺利获取房屋销售收入。\n\n“新买家”李某也是赢家，因为他用比市面便宜\
    \ 1 万元的价格买到了房产。\n\n投资者当然也是赢家，因为实际投资为零，却获得了近 7 万的收入。\n\n租客也以市场平均租金，得到了自己需要的居住空间。\n\
    \n所以，整个交易的全过程中，没有输家——投资者通过“以租代买”合同，成功地实现了“四家全赢”的皆大欢喜结局。\n\n![](img/acb46489adfd772451884bb9efeed060_68_0.png)\n\
    \n请仔细查看上图，可知道实际上投资者获取的收益基本上都是由“租客”提供的，租金是投资收益的主要构成。\n\n租客实际共支付了 79200 元（即 $2200\
    \ \\times 36$），其中 1 万元用于“代”买家支付了购房价，其余的 69200 元支付给了投资者。\n\n而投资者所获得的 69200 元“支付”，是通过两种渠道完成的：\n\
    \n- 一种为“直接支付”：你可以通过每个月的租金差额产生正现金流；\n- 另一种为“间接支付”：你通过“转让期权合同”，将房产按“原市场价值”出售给“新买家”。而期权合同价与市场价之间的差价，是由租金产生的，却是通过“买家”来支付的——即你把租金交给房东，买家又把“租金”支付给了你。这样就成功地把前面已交给原房东的租金又赚回来了。\n\
    \n综上可知，“以租代买”最神奇的地方在于：投资者虽然并不拥有房产，却可以借别人的房子来赚取 100% 的全额租金，而不仅是“转租”的价差。更关键的是，这一切都是“免费”的“午餐”。\n\
    \n### “以租代买”的三大利润源泉\n\n虽然说“租金”是我们的主要收益来源，但实际上我们的利润源不仅限于“租金”。除“租金”外，还有三大潜在利润来源：\n\
    \n#### （1）低价买入\n\n房产一般存在“市场价”与“合同价”两个价，当你与房东商定“以租代买”的“买价”时，如果可以通过谈判技巧压低“买价”，那么你实际上就已经实现了一种利润——低价买入差价。这种利润最后将通过“买家”支付的“合同转让费”来实现。\n\
    \n比如，你找到一处市场价值 30 万的房产，与房东签订“以租代买”协议，运用谈判技巧，合同定为 28 万。当三年后转让合同时，你以市场价出售该“房产”，即\
    \ 30 万。那么，你就实际上赚到了通过谈判实现的 2 万差价。\n\n所以，你要记住，最“暴利”的房地产投资环节就是“谈判”，几分钟也许就可以实现几万的收益。\n\
    \n#### （2）地段升值\n\n一般情况下，房产都会随着城市建设发展而升值。由于我们“以租代买”模式的年限较短，如果选择老城区的话，升值空间将较小；所以，聪明的投资者，一般会选择城乡结合部的地域投资——这也是万科集团的投资智慧。因为这类地区升值空间最大，一般房产开发周期为\
    \ 2~3 年（从地区买入到出售），3 年后就可以实现投资回报。\n\n你也可以借鉴这种投资思路，在升值空间较大的地区采取“以租代买”来锁定房价，并以“零成本”持有\
    \ 3~5 年（因为一般“以租代买”的房东不愿意接受超过 5 年的期限），等待升值后，通过“转让合同”实现“地段升值”收益。\n\n#### （3）高价转让\n\
    \n高于市场价格卖房是完全可能的。只要你能实现两个增值：“房产增值”和“交易增值”。\n\n导致房产增值的最直接的因素还是外在的：即前面介绍的地段升值；另外，还有一些方法可以人为地快速增加房产价值：\n\
    \n##### 装修增值\n\n找到好的装修专家，帮你设计并改造房产，往往可以实现“麻雀变凤凰”的效果。只是这种方法投资较高，存在一定风险。\n\n#####\
    \ 内涵增值\n\n如果你可以为该房产找到一个比较独特的卖点，使其具备了不一样的内涵，那也可以实现增值；而且一文不出，坐地起价。比如：风水好。\n\n我们投资过的一处房产，处于顶楼，价格又较高，正常来说比较难卖（60%\
    \ 的人不愿选择顶楼）。我们听房东提起，他买入这处房产后，不到两年就生了个儿子（他以前只有一个女儿），于是大受启发。我们立刻查找相关的风水书籍，提炼了一个“得子宝宅”的卖点。\n\
    \n一经推出，大受欢迎。很快就以高于市场价 10% 的价格出售了，买家也不介意什么“顶楼”了。\n\n“卖点”一定要具备“与众不同”的特色，与同地段房产相比，对买家的吸引力才能十足，才能“包装”升值。\n\
    \n##### 融资增值\n\n如果你可以帮助现金不足的买家买入房产，那么你就可以按高于市场价值的价格出售“房产”——因为你通过“帮助融资”，而使房产实现了“增值”。\n\
    \n比如，你找到一处市场价值 30 万的房产，通过“以租代买”持有三年。当转让合同时，你可以市价出售该“房产”，即 30 万。而买家最多一次性拿出 20 万，还差\
    \ 10 万元。你为买家提供“过桥”担保，通过融资公司向买家提供 12 万元贷款，并要求把房价提高到 32 万。等房产过户完成了，将该贷款的担保转为“房产担保”。\n\
    \n这样，实际上你只不过是作了一个“过渡”作用：买家拥有房产前，是无法提供担保物的，所以无法贷款。买入房产后，就可以把该房产作为担保物来贷款。你就充当这个“过渡”性的担保职责，从而帮助买家得到贷款，支付购房款，购入房产后转由“房产担保”，买家承担日后的还款工作。然后你就可以抽身出来。\n\
    \n整个操作过程中，你可以完全操控房产的交接过程，可以直接控制风险。其收益却是非常直接。基本上 2-3 个月内就可以赚到几万元，而且买家会心甘情愿。\n\n\
    此外，后文将介绍其他一些“融资技巧”，都会帮助你轻松赚钱。\n\n这里我们介绍了“装修”、“内涵”、“融资”三种增值方式。三种方式比较，我们更推荐“融资增值”。因为这种方式几乎不需要额外投资（相比于“装修增值”），适应面广（相对于“卖点增值”），价值明显（可以立竿见影地解决买房人的经济障碍）。\n\
    \n房地产投资本质上是一种“资本游戏”，懂得“融资”操作的人可以获得更大的收益。\n\n### 其他利润源\n\n除了以上所介绍的三大利润源外，“以租代买”还具备其他潜在利润点：\n\
    \n- “税收减免”：由于房产证上写的不是你的名字，所以税务机关无法查实你的出租收益；\n- 租金预交：你可以通过低租金策略，吸引租客一次性交纳较长时间租金，以方便资金流转进而获利；\n\
    - 直接转让“以租代买”合同：如果房东坚持索要较高定金，而你又不想放弃这处房产，你可以直接将该“以租代买”合同转让给别人，由别人接手完成合同。\n\n只要你付诸大量实践，不断思考创造性的解决方案，就可以从“以租代买”挖掘出更多的利润点，从而加快自己的投资脚步。\n\
    \n### “以租代买”的暗礁\n\n通过前面的反复讲解，相信你已经开始对“以租代买”初具信心。但“以租代买”也存在一些“暗礁”，几个要点一定要谨记；否则“以租代买”将带给你的不是财富，而是噩运。\n\
    \n#### 收益的核心源是“转让机会”\n\n无论你如何努力地“把房屋升值”，以便出租个更好的价钱，都请不要忘了——只有“转让期权合同”才能让你真正致富。\n\
    \n![](img/acb46489adfd772451884bb9efeed060_74_0.png)\n\n让我们再重温上面示例中的“收益分配图”。你辛辛苦苦地作“三明治式出租”（即转租）三年，所得的租金差价不过是：\n\
    \n$$200 \\times 36 = 7200$$\n\n而“转让期权合同”可以一个月内就收入 62000 元。与租金收益相比，有将近 8 倍的增幅。\n\
    \n所以，当你获得“以租代买”合同后，第一件事是找到租客来承担前面的租房成本；第二件事，就是去寻找可能的“买房人”。\n\n找“承租人”是立即减少你的房产持有风险，使自己稳立于“不败之地”，长期持有也不怕，可以克服多种潜在的困难。但“不败”的背面却是“不胜”——靠转租差价是不能帮你赚到钱的。\n\
    \n最主要的收益实际上是找到买房人，以吸引人的卖点（如价格、融资方案等）尽快转让那期权合同，让买家掏钱出来购买，并支付给你应得的“价差”——就可以尽快实现大额现金流入。\n\
    \n根据我们的经验，最可行而且最容易的方案就是设计一套融资方案，帮助不够钱买房的人买房——不需等到地段升值，不需装修增值，不需设计独特“卖点”。只要买房人支付一部分房款，甚至只需\
    \ 10% 的首期款就可以了（后文会详细介绍如何设计融资方案）。\n\n我们只要找到一处吸引买家的房产，通过设计一套好的融资方案实现房产交易增值，把合同转让给买家，帮助买家与房东签订购房合同，然后就可以提取你的“报酬”了——就是“期权房价”与“增值后房价”的差价：这个差价收益其实是远远高于转租差价的。\n\
    \n因此，你寻找并锁定的房产最主要的特征就是“吸引买房人”。如果你找到的房产只适合于出租，年限已长，地段治安较乱——那你获得的收益将微乎其微，甚至把你的时间与精力都耗费在“与租客斗牛”上面了；那你就不会在用脑去投资，而是在用体力。\n\
    \n所以，寻找有“转让机会”的房产，并增值化转让才是“以租代买”获利的根本所在。\n\n#### 多赢才能久赢\n\n正因为你更多地借助“融资方案”的设计来使房产升值，而不是侵蚀房东的卖房收益；既帮助了买家，更帮助了卖家，真正的多赢设计。因而可以在交易整个过程里，始终保持顺利实施。\n\
    \n正所谓：“大家好，才是真的好；‘以租代买’真好！”\n\n![](img/acb46489adfd772451884bb9efeed060_76_0.png)\n\
    \n只要房产状况及地段不错，根据市场价格与房东签订“以租代买”协议就可以了。从而不必太在意“议价技巧”。\n\n因为谈判技巧好的投资人虽然可以在“交易价上”获胜，但是当转让期权合同后，需要新买家与房东签订购房合同时，却很容易引起房东的不满，从而影响交易实现。\n\
    \n我们的目标是“多赢”——这种多赢不是建立在“短期小利”上，而是表现为：交易最终结束时，每个参与者都会发自内心的感谢投资者。\n\n补充一句，如果你是转让房东，最后得到期权转让收益后，一定要给房东一点“惊喜”——比如，多给房东一些钱。因为房东看到你利用它的房产获利，多少会心中不快。这些“意外”的收益，即使不多也会让房东“心理平衡”一下，甚至有助于帮你找到新的投资机会。\n\
    \n> **多赢的表现之二，就是签订合同时，明白告诉房东未来可能的交易安排。**\n\n——房东论道\n\n很多投资新手常常忌讳告诉房东自己的投资意图。想用其他的“借口”来事前搪塞询问。\n\
    \n这是新手最容易犯的错误之一。记住：你可能一时欺骗一个人，但不可能一世欺骗所有人。面对买房方面的询问时，当你堂堂正正表明你的投资意向后，房东常常会在其他方面提出自己的“要价”，而很少会明确拒绝。因为房东的目的是“卖个好价钱”，而不是纠缠你买房的真正打算——每个人都最关心自己的利益得失。\n\
    \n所以，当被问起这个“地雷”般的问题时，你一定要立即踩磨到房东真正的“关注焦点”——大部分是怕自己的卖房收益受损，还有的是因为其他原因；找到“焦点”后，通过问句转移话题到房东的“焦点”上去，寻求共赢方案。\n\
    \n当被问：“你买房是自己住吗？”（99% 的房东会问起这个问题。）\n\n如果该房产没出租过，而且布置得比较精心，那么你可以尝试的回答方法是：\n\n![](img/acb46489adfd772451884bb9efeed060_77_0.png)\n\
    \n“您这样说，是担心别人破坏您精心布置的家吧？你放心，我一定会保养好的。如果未来我转让的话，也一定会找到爱护它的人。你认为房产哪里最需要细心关照呢？”\n\
    \n如果该房产本身就正在出租，那就更容易回答：“我可能自己住，也希望有机会用于出租；那么，您有什么好建议？”\n\n如果房东明确提出：忌讳“中介牟利”（90%\
    \ 的房东不希望中介从交易中赚钱）。\n\n你可以补充一句：“我也不喜欢中介，除非他让我赚更多的钱；如果我转让这份协议给别人，把转让费的一半无偿送给您，做为您的额外收益，您感觉怎样？”\n\
    \n这时候，千万不能说称：“自己不会动脑筋”。否则你会后患无穷。\n\n#### 首付千万不能超过 2 倍租金\n\n我们的“零首付”其实并不是真的“一分钱”都不需出，只是出钱之后很快会获得“补偿”——一般不超过\
    \ 1 个月就会由“租客”补偿。\n\n大量的实践经验告诉自己，投入的钱越多，越可能出错——因为用你自己的钱投入得过多，就容易失去判断理性。而且钱越多，风险越高。\n\
    \n当你投入的钱多到促使自己成为“狂热”推销员时，结果就往往相反——因为房产交易是一个很耗时的工作，一个小细节出差错都会使正常的程序拖上几天。\n\n记住，租房永远比买房快。只有当通过租房使自己立于不败之地后，你才会平心静气、稳扎稳打地推进“期权转让”交易。\n\
    \n“租金差价”收益低，但启动快——是“不亏”的保障；“转让期权合同”收益高，但耗时长——是“获利”的核心。\n\n房地产投资最忌讳“铤而走险”“破釜沉舟”的投机主义行为。\n\
    \n“太极拳”运作思路的“完美”，就在于巧妙地结合“出租”的稳健与“转让”的厚利。承担最小化风险，靠“智慧”投资，而非靠“现金”投机。\n\n你首付给房东\
    \ 2 倍月租作为“一押一租”后，可以通过租客快速周转资金。但是如果超过这个“首付”限额，风险就产生了。\n\n我们明确告诉房东是“以租代买”而非“直接购买”，其中一个目的，就是不给房东多要“首付”的借口。既然是“以租代买”那么日常支付就是以“租金”为标准，超出这个“标准”的“索取”都是不合理的。\n\
    \n“先租后转，稳中求胜”——要始终铭记“以租代买”的指导原则。\n\n### 小结\n\n本课介绍了“太极拳”的入门“招术：“以租代买”的基本操作思路。\n\
    \n首先，要通过“以租代买”合同锁定房产；\n其次，通过“转租”实现“零成本、零风险”地长期持有。\n第三，寻找买家，通过多种方法实现“房产增值”后转售——转售的手段即“转让期权合同”。\n\
    \n了解“以租代买”的基本思路后，后文开始详细分解介绍每一个环节的操作。下一课就教你去寻找符合投资标准的房产。\n\n## 第五课 “黄金屋”—简单 3 步筛选房产\n\
    \n决定房地产投资成败的 95% 的因素，取决于整个房地产操作的最初——找到超值的房地产。所以，你也要将 95% 的精力放到获得房地产筛选上面。\n\n对于投资新手来讲，这部“过滤”的工作量很大。你也不可能一间房、一间房的去找，一个房东、一个房东的去谈。聪明人总有捷径走，在这里我们推荐使用如下的“寻宝”方法：\n\
    \n### 第一步： 网站过滤房源\n\n> 这一步的主要任务，就是找到基本满足出租要求的出售房源，并初步确定其市场价格。\n> —— “网站寻宝” 使命\n\
    \n打开本地二手房产交易网站，进入“房屋出售”这类的版区，里面应该有大量的房主出售信息，而且基本上是每天都更新很快。\n\n#### （一）找房源\n\n\
    你要仔细查阅，注意“配套设施”及“房源描述”信息栏。如果描述比较清晰，内容较全面，则 70% 的情况下该信息不是中介发出来的——如果有中介参与，会对我们后期与房东谈判、签约造成不利影响，而且要交纳一定的中介费。所以，首先要学会过滤中介。\n\
    \n而中介由于每天都要发布大量信息，所以很难在每条信息中详细描述房产具体情况。因此，我们借助这种方法首先寻找房主自售的房子。\n\n如果你对该房产所在区域的交通、生活配套情况比较了解，只是不清楚房产的具体位置及所在楼盘新旧，就可以通过\
    \ E都市 ( http://www. edushi. com/ ) 等电子地图网站了解（具体的使用方法在本书的第十四章有介绍）。\n\n注意，我们此时筛选的房产主要用于“转租”，所以要求不必太高，只要满足以下两个条件就可以通过“过滤”：\n\
    \n- ● 地段因素：交通、生活比较便利，出租需求稳定，治安不算太差。\n- ● 房产因素：有基本装修及水电设施，便于入住。\n- ● 公开出售价格属于该地段同类房产的中下水平。\n\
    \n这里要再次强调一下，你不可能把所在城市各区县全都调查清楚。尤其对于投资新手来说，最适宜的起步工作，就是先利用业余时间本地老城区转转，因为这些地方往\n\n\
    > 12 房地产的一大特色就是：什么阶层的人都有需求。所以，即使你以“租代买”得到的房产再破、再旧，只要价格够低，都会有人愿意出价购买。当然，也要考虑未来“转售”、选房产时，以“转租”为标准过滤房产即可。\n"
