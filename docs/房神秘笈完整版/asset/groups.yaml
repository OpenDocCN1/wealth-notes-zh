    \ Excel 的各个单页里。就相当于为每个房源建立了一个电子档案，便于后期的跟踪与记录。当然，更便于对此房产的一些数据分析计算工作。\n\n与房东进行电话沟通，是一个很有讲究技巧的工作，既不能太含蓄，又不能太直接；而且要做到言简意赅，节省时间。建议在晚上7点至9点间打电话，否则很可能会影响别人的正常工作。\n\
    \n### 8个简单而高效的问询\n\n以下的8个问题是基本的问话，请面带微笑地打电话，以便营造良好的沟通气氛，在做基本的问候之后，就可以开始提问了（方框里面的内容为该问话的辅助说明）：\n\
    \n1. 您的房子入住几年了？\n    > 说明：通过简单而无压力的问题，帮大家进入主题，同时也了解房产的使用年限。尤其注意，是否超过5年。\n2. 装修怎么样？\n\
    \    > 说明：装修会影响房产的出售情况，我们要求只具备基本的装修即可，家电及家具配备问题不大。\n3. 每月的物业管理费是多少呀？\n    > 说明：物业管理费决定了该房产是否有小区，是否有保安值守等配套问题，直接影响将来的出售情况。\n\
    4. 有没有出租给别人？\n    > 说明：如果房东出租过该房产，则其出售动机很可能跟以前的出租管理太繁琐有关，直接影响与其交易方案的拟定。\n5. 房产有按揭吗？供几年了，平均每个月多少呢？\n\
    \    > 说明：按揭情况会决定交易的执行细节，所以这个问题很重要。如果房东不愿回答，可以在面谈环节中再问。\n6. 您为什么要卖房？\n    > 说明：这个问题是整个交谈的核心，一定要通过前面问题的预热后再来询问，否则容易引起房东不快。\n\
    7. 您希望最快什么时候搬走呢？（如果此房已经用于出租了，就改成：您希望最快什么时候出售呢？）\n    > 说明：此问题实质是确认房东是否急于出售，是对于其交易动机的深入探询，也有助于理解其交易灵活性。\n\
    8. 如果可以尽快成交，是否愿意价格上便宜点？\n    > 说明：由动机出发，就可以通过此问题来确认交易的灵活性问题。而价格的灵活是一切成交条件的开端。\n\
    \n我们的问题是逐渐深入的，对房东的压力也依次增强，如果缺乏前面的铺垫与情绪放松的过程，一些“冒昧”的问题可能引起房东的反感。所以你实际使用中最好不要打乱这种提问的顺序。\n\
    \n经过以上8个问题的确认，你基本上就可以明白房东的出售动机了。\n\n### 探询动机\n\n最常见的动机有以下四种，按比例由高到低排列为：\n\n1.\
    \ 卖旧房以便买本地新房；\n2. 厌倦了出租管理，想一卖了之；\n3. 工作调动或者搬迁异地；\n4. 经济需要。\n\n由于在这里我们选的是“以租代买”的合适对象，我们无法一次性交完所有房款并完成房屋过户，所以，我们最可能的合作对象就是符合（1）、（2）原因的房东。\n\
    \n幸运的是，这两种情况的房东占了总数的60%以上，所以我们的投资机会是大量存在的。\n\n对于出售动机比较明确的房东而言，问题7和问题8常会引出他们的一大套“倾诉”——这时，你要表现出足够的耐心与热情，因为这时将决定他们交易的灵活性。人们都是感性的动物嘛。你需要及时就他们讲出的线索，提一些关联性的问题，来进一步确认他们的交易灵活性。\n\
    \n如果经过一番沟通，你发现房东动机合适，而且表现出了交易方式的灵活性倾向，那么就可以把这类房产送入下一步了。否则就无情的删除这条信息。\n\n记住，一定要边听边记录下来他们答问的要点，事后整理到你的房产电子档案中；以便及时的分析、总结及跟进。\n\
    \n## 第三步：面试房产\n\n一般情况下，如果你在网上查看了20条房产信息，可能只有3条值得打电话确认。而3次电话后，只有1条线索值得继续跟进，去亲自看房。\n\
    \n为保险起见，不要只打电话，要多去实地看房。这样可以验证之前电话里的信息是否准确，也可以发现电话里没提到，但在实地看到的细节。\n\n所以经过前面大量的筛选之后，我们就可以找到符合自己条件的房产了。\n\
    \n### （一）事先准备\n\n看房前一定要做的两点准备：\n\n1. 找一个搞装修的人做朋友，请他同去；\n2. 事前打电话要求房东准备好房产证原件及复印件，并随身带来房产所有者的身份证；\n\
    \n之所以要带一个搞装修的朋友，是因为他会帮你检查房屋的质量并估计可能的装修成本——这一点对于投资新手尤其重要。\n\n所以，事先通过各种渠道或者转介绍，一定要认识一个有丰富装修经验的人，他将成为你重要的合作伙伴。\n\
    \n同时，要求房东准备好房产证及其身份证，是便于核对房产的交房时间、户型面积等；如果房东推脱说，不方便提供这些证件，你就直接说：\"等您愿意提供时，再面谈。\"\
    很多骗局及风险即可避过。\n\n由于现在的房产证基本都是\"房产+地产\"的双证合一证书，所以你可以看到的往往是《房地产产权证》。该证书最后会有该房产的平面图，最新的平面图都是电脑图，标注有详细的长宽尺寸，房东不易在面积上造假。\n\
    \n具体的房产证观察细节，请查看本书第十五课相关内容。\n\n## 第五课 “黄金屋”——简单3步筛选房产\n\n### （二）看房细节\n\n看房是一个非常重要的环节，决定了未来投资成败，所以要细心加细心。\n\
    \n结合以前的大量经验，我们将其总结为下表，建议你将其打印一份，每次看房时都一一核对。\n\n#### 表 5-1 房屋检查核对表\n\n| 项目 | 条目\
    \ | 得分 |\n| :--- | :--- | :--- |\n| 周边环境 | 楼下可否有停车位（摩托车/小汽车） | 1 / 0 |\n| | 是否有保安值勤\
    \ | 1 / 0 |\n| | 是否有人负责楼道定期清扫 | 1 / 0 |\n| | 该楼盘本地住户多不多 | 1 / 0 |\n| | 周围是否噪音较小\
    \ | 1 / 0 |\n| 房产情况 | 门口是否有装防盗门 | 1 / 0 |\n| | 是否有两个卫生间 | 1 / 0 |\n| | 主客厅是否通风便利\
    \ | 1 / 0 |\n| | 主客厅是否采光较好（以东、南朝向为佳） | 1 / 0 |\n| | 承重墙有无裂缝 | 1 / 0 |\n| | 浴室、马桶漏水是否使用正常、地漏不堵塞\
    \ | 1 / 0 |\n| | 房屋墙面有无变色、起泡、胶皮、拉架的现象 | 1 / 0 |\n| | 供水、供电、煤气、电话线、闭路电视线是否畅通到位\
    \ | 1 / 0 |\n| | 暖气供、回水主管有无斜坡现象 | 1 / 0 |\n| | 门窗开启是否灵活，门窗的密封性能好坏 | 1 / 0 |\n\
    | | 屋顶有无渗漏的痕迹 | 1 / 0 |\n| | 阳台玻璃有无裂缝 | 1 / 0 |\n| | 地板有无不平、松动或者颜色不一现象 | 1 / 0\
    \ |\n\n其中重要的地方一定不能马虎：\n\n### （1）检查房屋有无裂缝\n\n首先要仔细查看房屋主脉及客厅靠近露台的地面和顶上有无裂缝，没有裂缝最好，如有裂缝，要看是什么样的裂缝。一般来说，与房间横梁平行的裂缝，虽属质量问题，但基本不存在危险，修补后不会妨碍使用。若裂缝与墙角呈45度斜角或与横梁垂直，说明该房屋沉降严重，存在结构性质量问题。\n\
    \n其次要看露台处的两侧墙面是否有裂缝，若有裂缝也属严重的质量问题。最后看承重墙是否有裂缝，若裂缝贯穿整个墙面且穿到背后，表示该房存在危险隐患，对这类房屋，一定不能抱侥幸心理。\n\
    \n### （2）检查房屋有无渗漏\n\n要注意察看房屋的地面和顶层渗水情况，要仔细检查房屋墙面是否有变色、起泡、鼓皮、掉灰的现象，这些都是渗漏的迹象。还应察看厨房、卫生间、阳台的顶部和管道接口是否渗漏。把厨房、卫生间的水放一放，察看是否会渗漏。\n\
    \n### （3）检查房屋内开关、插座及总电闸有无问题\n\n各种电路、回路电视、电话插座的位置等，也应仔细了解。30%的火灾是由于电气事故引起的，这与电气线路的设置有相当的关系。为了用电的安全和方便，国家出台了《住宅设计规范》，规定每套住宅回路数不宜少于5个：为房间照明设1个回路，以墙内局部开关控制客房局部照明；为动力用插座设1个回路；为客厅及餐厅设1个回路；厨房设1个回路，其开关可放在厨房外面；为卫生间设1个回路；为分户式空调设1-3个回路；另外还可为电热水器、微波炉、洗碗机、抽油烟机等大功率电器设1个回路。\n\
    \n增加回路可以保证电线的使用寿命，减少短路火灾事故的发生。\n\n此外，我们找房的目的是\"转租以快速获得正现金流\"，所以，房屋检查还要关注\"未来的租客是否方便\"\
    。因此应该在“卫生间、电源、噪音、通风、采光”五个方面重点考察。而其他方面，或者可以忽略，或者可以通过低成本的装修来弥补，因此不用太过斤斤计较——当然，房屋的不足可以成为与房东谈判的筹码。\n\
    \n### 小结\n\n本课介绍了快速寻找并筛选房源的方法，归纳起来主要包括以下步骤：\n\n1. 通过网站快速寻找房源信息；\n2. 向中介打电话估计该房源市场价格；\n\
    3. 与房东通电话，确认其出售动机；\n4. 上门检查房产。\n\n如果房屋在这些方面基本都过关的话，那就可以考虑与房东进行谈判并签订合同了——而下面部分正是“以租代买”的核心环节。\n\
    \n# 第六课 双重合同——99%的人不懂的法律武器\n\n“以租代买”是一种特殊的“组合式交易”，它包括了“房产租赁”与“购买期权”的双重属性——而这两种属性在法律上具备较大差异。\n\
    \n作为投资者，一定要明白“租赁关系”与“买卖关系”的差别，应该采取不同的法律文书形式分而治之。合同的标题必须注明该合同的“属性”，而这对于合同内容的法律关系界定具有重大意义。标题为“房屋租赁契约”的合同，与标题为“购买期权契约”的合同，在争议处理时会有较大差别。\n\
    \n因此，为同时表述清楚“租赁”与“期权”两种交易性质，你必须与房东分别签订“租赁协议”与“购买期权协议”两份合同，这两份合同共同组成“以租代买”的交易协议。\n\
    \n采取两份合同的组合，还有个更大的好处隐含其中，请仔细学习这课内容。\n\n## “租赁契约”——“零成本”的保险单\n\n巧妙的“租赁契约”，可以减少“入住风险”，保证我们的“转租”权益，进而“以租养租”的“零成本”持有期。\n\
    \n因此，“租赁合同”的核心条款是为保证投资者可以合法利用该房产获得转租收益。故条款所涉及的内容基本上都要围绕“费用结算”、“房屋入住”展开。\n\n下面让我们逐条分析（方框里的内容为条款示例）：\n\
    \n### 交租及入住规定\n\n#### 第**条 费用结算\n\n甲方保证有关本房产的燃气费、煤气费、水电费、电话费、有线电视费、网络使用费、物业管理费、环境卫生费、保安费及生活费，均在本合同生效前结算清楚。\n\
    \n所有费用不能让房东留尾巴，一定要在入住前让他结算清楚。\n\n#### 第**条 租金交纳\n\n乙方每月应付租金为--------元（大写：----------元整），乙方每次于当月----------号前交本月租金；乙方如拖欠房屋每月应付款------天以上的，甲方可以按月应还款金额1%向乙方每天加收滞纳金。如果乙方未能在第二个月的----日前按期付款，甲方可以要求解除本协议。\n\
    \n与房东约定租金交纳的具体日期时，一定要预留下述至少三天的时间缓冲，以便于首先索取租客的房门，再转而向房东交租。\n\n#### 第**条 房屋入住\n\n\
    在本合同签订后7日内，甲方保证乙方可以入住使用本房产，乙方对房屋附属设施、家电、家具、房屋物件（钥匙、电卡、燃气卡、交费卡等）进行交接验收。如需维修，甲方在交房给乙方入住前应根据乙方要求维修完毕。甲方应保证在本合同签订时，本房产本身及附属设施（包括水、电等设备）处于能够正常使用状态，无大的质量问题并在约定期限内交房给乙方，否则乙方有权要求甲方退还定金，解除合同。\n\
    \n对于一般租赁而言，基本上很快就可以入住；但对于很多以卖房为目的的房东而言，他们往往还没有做到立即搬出去的准备。所以，你在合同条款里，要跟他们约定好，签订合同时，交一半定金；当他们搬走并将钥匙交给你时，你才交另一半定金，以促使他们尽快把房产空出来，达到自己希望的出租状态。\n\
    \n同时，投资者应该在取到钥匙此时对房产进行仔细检查，确保房产状况不影响正常生活。否则应立即要求房东维护。而不能把这种维修责任转嫁给自己。\n\n### 使用权利\n\
    \n#### 第**条 使用权利\n\n乙方入住后可以善意的改善房屋装修，但需事前取得甲方书面同意；费用由乙方自理。\n\n关于房屋的“装修条款”是较容易引起争议的地方。因为“租赁期间”的房产产权并没有转移给投资者，所以房东往往不愿意别人随意改动自己房屋的装修。\n\
    \n因此，建议你在做一些装修改动前，要征求房东的同意。当然一些简单家用设施的添置并不需要通知房东。但是“粉刷墙面”、“吊顶”、“加隔间”等工作就需要与房东达成一致。\n\
    \n只要你的装修是增加房产价值，而且对于房屋结构没有太大影响的，一般房东不会拒绝——反正对他也是好事一件。\n\n而且做为投资者，你也没必要对房产进行大规模的装修投资；这种工作往往费时费力，而且风险较高。不推荐新手从事这种投资。\n\
    \n### 转租权利\n\n#### 第**条 转租权利\n\n乙方在占有使用权期间有权对房屋出租。对乙方经营房屋利益甲方无权主张。\n\n此外，“转租权利”是一定要求取到的，这一点不容争议。如果房东要求必须经过他同意才能转租，那你就需要使用其他“更好的建议”来解除房东的疑虑。\n\
    \n最简单的“建议”就是提高“房租”，让“金钱”说服房东。所以，“以租代买”的方案中，往往需要投资者为房东支付比正常价格高一点的租金来获得“转租”权利。\n\
    \n如果房东已经将该房产出租过，那他就比较容易接受这种方案。如果房东没有出租过，那你就需要花点耐心。不要试图绕开这个问题，因为房东迟早会知道你是“租养租”的投资者。如果他事后搞破坏，你会麻烦不断。\n\
    \n如果房东完全不容商量，那你直接走开好了，没必要因为一棵树木放弃整个森林——愿意接受方案的房东要多得多。\n\n其他的要点就与普通“租赁合同”一样了，你可以很容易找到大量的“合同范本”参照，在此不必多述。\n\
    \n## “期权协议”——赢利的魔术盒\n\n通过前面的学习，相信你已经认识到了“转让期权合同”是“以租代买”交易的“利润之源”。那么你一定很希望了解“期权”是什么，以及“期权协议”的秘密。下面我们就一起探索这个99%的人都不了解的法律武器。\n\
    \n由于这里涉及了一些法律专业术语，所以你一定要认真的阅读，最好可以参考合同法文本。法律是房地产知识体系的重要环节，值得你花费巨大的时间与精力去研究、学习。\n\
    \n我们下文将做简单的“期权”解释，如果你想了解更多，就请查阅相关资料。\n\n### “期权”简析\n\n“期权买卖”本质上是“购买了一种权利”；交易双方签署期权合同以表达这种交易“有效”。\n\
    \n就好像车票一样，买家购了车票，该车票所标注的座位就“唯一性”它属于买家，或者说是持票人；持票人出示该车票，就可以占用这个位置。车站不能把“占有”这个座位的票再卖给别人。但是，这个票是有限制的，超出这个时间范围，这个票就作废了。\n\
    \n期权与车票的原理一样，但是期权是不能“退票”的，而且过期立即失效。\n\n假定房东为 $G$ ，投资者为 $F$ 。则期权合同的甲方为 $G$ ，乙方为\
    \ $F$ 。$G$ 就是期权卖家，$F$ 即为期权的买家。搞清楚这两个角色，会对后面的理解有很大帮助。\n\n$F$ 向 $G$ 支付期权费，用于购买“买房的权利”；$G$\
    \ 收取期权费，把这种“买房的权利”卖给 $F$ ，这种权利是“独占性”的，即在约定的时间范围内，$G$ 不能再将该房出售给别人，因为“购买权利”已经出售给\
    \ $F$ 了。同时，这种“权利”是有时间限制的，过期不“行权”（即“不买房”）即失效。\n\n所以，$F$ 与 $G$ 双方构成债权债务关系，而这种“权”即“在指定的时间范围内，以指定的价格及付款方式，购买指定的房产”的“权利”；$F$\
    \ 即“债主”（债权人），$G$ 即“欠债者”（债务人）。\n\n### “期权合同”的突出优点\n\n为什么要使用“购买期权合同”呢？因为它具备无可比拟的好处，是衡量一个投资者水平高低的重要标尺。\n\
    \n简单来讲，它有3大好处：\n"
  mdcn: "\n往建设较早，交通及生活配套不错，出租房较多。想出售房产的也较多。\n\n这类地域还有一个非常容易识别的特色——就是“房产中介”的店铺特别多。你只要根据“中介”找房产就可以了，呵呵，也算他们的一大“贡献”了。\n\
    \n而第一步的主要工作就是初步圈定这类房产即可。\n\n### （二）定价格\n\n如何知道某房产的要价是高还是低呢？这对投资新手是一个较大的挑战。我们也曾长时间被此困扰，经过反复摸索，终于发现了一种特别简单而高效的办法，就是：“给中介打电话”。\n\
    \n感谢中介，他们总是“免费”而“热心”地帮助我们。由于前面讲过了，这类地段往往分布着大量的房产中介，所以，你只要记下他们的联系电话，一边看着网站上的房产描述信息，一边给他们打电话询问就行。\n\
