    # 次序讲解


    如果在期权协议规定的时间内，你无法找到新买家，你也可以找个“挑毛病的合作者”，帮你把“期权费”要回来。


    当然，如果你使用的是“以租代买”的模式的话，那些所谓的“期权费”（即定金）其实是“已交租金里可用于抵扣房款的部分”。


    也就是说，“期权费”本来是“羊毛出在租客身上”，并不是投资者的“羊毛”。所以，即使房东最后不同意加上这条，也不会对投资者造成较大的风险。


    # （3）协议展期


    支付追加期权费______元后，期权权主在此赋予期权买主将上述期权展期______的权利。


    谁也不能保证你可以在期权期内一定能找到买家，所以，在期权合同中给自己留个“续期”的条款，就至关重要。


    # （4）用租金支付购买款项


    双方均同意承租人按照此处所附租赁合同支付的租金中的百分之____的部分可以用来支付购房款项。


    这是期权合同的“中央芯片”，因为它规定了你每月所交款中，有多少可以作为房价的“预扣”部分。由于你未来通过转让期权时，“预扣”部分可以从买家的出价中“赚回来”，可以它实际上就是你的未来转让收益。


    一般操作中，如果房东急於转手房产，你可以与他商量“房租全部用于抵扣房价”；但是这种情况时，房东往往


    为适应整个木结构体系，房神作是特别免漆碧丽砖或点载点为自动调节轴头，保证房神作出 1 由流行强到、具有点动到到碧丽技术头'
