    # 前言——房神是谁


    人们提供了价格适宜、品质合适的房产，解决了人们的居住难题——最起码，他们是正大光明的挣钱！


    现实生活中的“房神”为数众多，可谓八仙过海、各显神通。但出于“保护财富隐秘”、“表达能力不足”、“缺乏专人整理”等原因，他们的投资绝技一直都“深藏地下”、“秘而不宣”。


    就像魔术一样，你看到很奇幻的结果，却猜不到背后的隐秘逻辑：


    +   - 为什么不用自己的钱也可以投资房地产？

    - 为什么可以保证交易各方都是“赢家”？

    - 为什么具备小学文化就可以即学即用？

    - 为什么不管房价涨跌，都能立于不败之地？

    ......


    他们的秘密说穿了，其实并不神奇；但最让人郁闷的是：解决的方法常常很简单，只是你想不到罢了。


    > “解决问题的最佳方案，几乎总是最简单的方案。”

    ——“奥卡姆剃刀”原则


    如果这些“隐秘”可以编辑成书、公诸于众的话，我们相信受益者将不仅有千万的房款，更有亿万分的平民。

    而先赌为快的你，无意就是其中最“幸运”的人：因为你即将触摸的“绝技”，就源于房神组成的精英团队。他们中间有律师、银行信贷经理、理财师、大学教授……

    本书就是要揭开他们创造财富的内幕：'
