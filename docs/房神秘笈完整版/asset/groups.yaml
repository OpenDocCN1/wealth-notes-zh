    《理想的生意》为我们的“房地产行业”倾注了那么多的“赞美”之词，但可惜的是，该文件作者理查德·科克一辈子却摘的都是股票：所以，他忽视了房地产行业所具备的另一种独特的魅力——而这些才是“房地产投资领域”核心价值！


    ## （1） 优良的资本杠杆


    财富到底从哪里来？无数人都在穷其一生苦苦思索，甚至在不断地实践中探寻。经过不住的“捐献”与“布施”（让我们换个词汇来形容“失败”），房神们终于明白：财富的创造实质上就是一种“不对等交换”的行为，简而言之就是“低买高卖”。


    之所以会有买卖的差价，是因为借助了美妙的工具，或称之为“杠杆”！金融系统就是世界上最大的杠杆系统，而银行就是最大的“玩家”！他们借助存贷利差率，做事世界上最简单却又最安全的“不对等交换”。


    罗伯特·清崎在“富爸爸”系列书中，提出“要做银行，而不做银行家”的观点。落实在房地产上，就是以低利率借入资本购入房地产，然后以较高利差向他人放贷，那么投资者就相当于“银行”一样，借助“房地产”实现了“增值”。


    最可爱的一点是，银行最偏爱“房产”，以房产为抵押，是最容易借出钱来的，你看看各大银行的最新宣传就明白了。当然，你可能还是很难理解，本书会在后面详细讲解如何“借钱生财”以及“借房生财”。


    ## （2） 严重的信息不对称


    你知道“房地产交易”所依赖的最大法宝是什么吗？


    信息！买家信息、房产信息、融资信息、政府信息……从某种意义上说，投资者就是一个“信息贩子”！但这种信息是极为有价值的！正因为这种信息的稀缺性，才为我们创造了大量的投资空间——这就导致了信息不对称。


    所谓“信息不对称理论”，说起来也并不复杂，就是经济关系中的一方知情(私有信息)、另一方不知情，而知情的一方有着利用信息优势去不正当获利的动机。


    大多数购房者，或者卖房者，一生一世只能接触很少的买卖机会，而且，这么重大的交易行为，却充斥着大量的“冲动”与“蛮干”等非理性行为。人云亦云，随波逐流。


    你观察一下身边的同事或朋友，有多少家庭，购入房产后就后悔不迭，却徒呼奈何！而这背后，又有多少开发商的黑手行为！


    信息不对称，才导致了暴利；信息不对称，才产生了机遇！而且，由于房产价值的独特性（很难找出价格、地段完全一致的两处房产），所以信息的获取过滤就显得非常专业，而普通的老百姓，又有几个能真正玩转的呢？


    ## （3） 轻松分享经济发展成果


    你知道为什么会有几千万人为股票市场痴迷吗？为什么痴迷者99%是普通的老百姓？


    因为人人向往财富，而且绝大多数人都知道把钱存银行里是会贬值的。但是，普通老百姓怎么懂企业经营、项目运作、商业投资呢？所以，他们只好选择股票这种投资产品，以期望从那些“绩优股”公司的经营成果中分一杯羹。


    在欧美健康的股票市场中，其长期收益都是与国家经济发展同步的，所以普通投资人可以借之分享经济发展成果；但是，中国的股票市场是个不健康的怪胎，甚至是个“大赌场”，众多公司都以上市做为“圈钱”的工具，骗取老百姓的血汗钱，从没想过要与老百姓分享成果；所以，在很长一段时间里，造成了股票市场与中国经济发展大势相背离的怪现象。


    而不动产则刚好相反，世界范围内，房地产的长期趋势都是稳健升值的（当然在每一轮经济周期中，房价都会有起伏波动）。其收益状况与国家经济发展、地区市政建设紧密相关。更重要的，不动产的特性是“不动”——它的保值与增值功能是以几十年为单位的。


    所以，很多地方流行“一铺养三代”的说法：就是说，在不需要人为过多经营的情况下，可以获得长期的稳定收益。


    普通老百姓可能不懂具体的经营与投资技巧，但只要持有一处好房产，就可以坐收渔利——经济发展会反映在房地产上，城市建设会反映在房地产上，工资收入增加会反映在房地产上……


    > 注：中国近年的平均通胀率为5%左右，而银行的近五年期整存款年利率为4.14%（央行2006年8月19日公告数据；扣除20%的利息税后，实际利率为3.312%。这意味着，存在银行里的钱，将每年贬值1.68%。


