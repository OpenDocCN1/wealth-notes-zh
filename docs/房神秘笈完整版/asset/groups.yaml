    则个人持有出租房产时，税费占收入比例为：

    (241.2+560)÷3600=22.3%


    而以公司为房产所有人时，可以把各种开销都列入成本项目，以减免“所得税”销税。当公司没有“所得”时，税费就仅占6.7%。


    所以，同样的一套房产，当个人为产权所有人时，就要多交约16%的税费（22.3%-6.7%=15.6%）。


    你现在明白为什么说“富人反而少交税”了吧？


    ## （3）隐藏个人房产


    投资者不是要“房产所有权”的“虚名”，而是图“房产收入受益者”的“实利”。把房产转入公司名下，好处很多：


    - ①避免因个人债务纠缠而失去该房产


    投资者W如果欠下巨债，他可以提前将所持有的“X公司”股份转让给他父亲；这样个人债务就不会影响该房产。而“X公司”仅是为持有房产而设立的，所以也不会因为“欠债”而被“破产”；即使真的“破产”，也不会影响投资者W的个人经济状况。


    这样使房产真正成为投资人W的“隐藏”财富：不怕偷、不怕抢、不怕债；可谓是“刀枪不入”。即使公司的另一个股东N想使坏，也可以随时取出事先签订的“协议书”，立即取消他的股东资格。


    - ②可以凭借个人名义持续购入新房产


    如果个人拥有的房产过多，会被金融机构“重点关照”，从而在融资贷款方面受到“不公正对待”。但是，投资者W就没有这种风险。因为房产R在购入时，是由房东直接过户给了“X清洁公司”。


    所以，房产R并不影响W采取“炼金术”等手段以个人名义再去投资各种房产。而且金融机构也很难证实R与W的经济关系。


    - ③便于子女继承房产


    如果你希望子女可以“零成本”继承财产（尤其是房产），就可以直接将公司的股份转让给孩子即可，根本不用办理任何“房产过户手续”。也可以避开可能的“赠予”、“继承”方面的税费（中国大陆还没有开征“遗产税”），但在房产“继承”过程中，有一些税费是要交的。


    ## 注意要点


    当然，通过“法人”来持有房产，也不是轻而易举就可以实现的，需要在很多细节的地方加以注意，否则将隐患丛生：


    - ①公司要求


    应注册成为税率较低的服务类型的公司。这样便于注册、便于计税。当然，作为法人，以“有限责任公司”形式较为理想。根据新公司法，3万块钱可以办公司，而且可以分期缴纳出资。股东只需先把20%的注册资本缴足，剩下的钱在公司成立之日起两年之内缴足。


    - ②股东要求


    股东人数最少可以为一人，但是要求注册资本最低10万。建议设立两人左右，便于未来的“避债”安排。为以防万一，如果引入一些“外人”的话，一定要他签署“股权放弃协议”，或是“无偿转让协议”。同时，这个“外人”的股份一定不能太多。把投资者最信任的人拉进来最好。


    当然，拉老婆“入股”也可以；但是，要注意，夫妻共同财产很容易被牵涉进个人债务纠纷中，所以建议你的“X公司”股东里，最好不要有“配偶”。父、母最安全。


    - ③其他要求


    关于做账、年检等事务，请专业的代理记账公司每个月仅仅花一点钱就可以搞定。既方便又专业。


    同时要注意，让房东“入股”时，也需要他同时签署一份“无偿转让股份”协议，生效日期定为房产过户后。这样也不必担心房东日后找“麻烦”（当然，通过“全权委托书”也可以）。


    ## “做银行”与“做老板”的取舍


    虽然“法人”是非常优秀的“保护人”，但“法人”绝不是“乖乖宝贝”。如果你经营过一家公司就明白，“上级主管机关”总有一大堆的理由让你“交钱”。到处都是“婆婆”，哪里都有“红旗标”出没。


    如果你不是真正地想帮“公司”化经营把你的房地产事业做强、做大，而仅是想借助“公司”来保护房产的话，那我还是建议你“一卖了之”。


    因为房产的正常使用寿命一般是 30 年（实际上不到 30 年就可能“拆”了）。而且房产也不会永远都是“牛市”，香港房地产市场就是一个最好的教训。


    你需要的不是“保护房产”，而是“保护财产”。


    虽然你秉持“公司化持有”的思想，实际管理过程中仍会很快陷入“公司化经营”的泥潭里——租金、房客、税费……会吞噬你大量的时间与精力，使你不得不雇人帮忙。雇人就需要开工资，就需要活动场地，就需要日常管理……于是你又不得不投入更多的钱与时间去维持、不觉之地扩大投资。


    从某种角度来讲，“公司”就是“毒品”——你的“毒瘾”很难越来越小，99%的情况下会“越来越重”。最终把你拖到“筋疲力尽”。


    “归隐术”本质上是一种“做减法”的投资思路，它是帮助你超脱于各种房产烦恼的“丹药”，提前退休、享受人生；但是“公司化持有”本质上却是“做乘法”的途径，可以迅速发展壮大（因为各种因素会迫使你必须做大了否则必死）；“公司化”看似诱人，却很容易使人误入歧途。


    房地产投资与“公司经营”是两类“井水不犯河水”的技能体系；但“公司化持有”就将两者打通，吸引投资者走上“规模化”、“集团化”、“正规化”的经营之路。很多人是“投资天才”，却也是“管理白痴”——如果你真的是想“急流勇退”，而不是“迎难而上”的话：我还是建议你“做银行”，而不是“做老板”。


    “公司化持有”不是房地产投资者的“天堂”，也不是“地狱”。它只是通往另一个世界的走廊。


    ## 第十二课 “归隐术”——反璞归真的投资境界


    万流归宗——构建个人财富堡垒


    本书中介绍了许多投资理念与操作手法，尤其是“太极术”、“炼金术”、“归隐术”三大体系又各自容纳众多细节，很容易将投资新手引入思想混沌。而最难理解的地方，在于这些“术”及其所处于的投资者的进阶状态，并不是“泾渭分明”的；而是互相交叉、逐渐过渡的。


    本节帮助你理清思路，构建一套完整的投资路线图。


    ### 三术比较


    现将他们各自的特性归纳如下：


    - 太极术——稳健起步、避免风险、慢积资金：侧重于无风险地学习投资经验与技巧。

    - 炼金术——快速发展、承担风险、高回报：侧重于财产的迅速增值。

    - 归隐术——无为而治、不担风险：侧重于财富的保障与储存功能。


    所以，这三种方式的基本特性与功能都是不同的，说得直点：


    - 太极术——少出智力、多出体力：赚经验优先。

    - 炼金术——多出智力、少出体力：赚钱优先。

    - 归隐术——少出智力、少出体力，存钱优先。


    所以，你不能把三者截然分开。而应根据你自己所处的阶段、风险偏好、投资目标等因素的考虑，并组合应用。


    ### 三术合一


    ![](img/acb46489adfd772451884bb9efeed060_219_0.png)


    投资讲究的就是“随机应变”、“有的放矢”。根据投资者所处的不同“情境”，应采取不同的投资策略：


    - （1）初期——“太极”为主，尝试“炼金”


    这时，投资者往往没钱，也没有经验。这时必须“稳中求小胜”。不怕多走路，不怕赚小钱。运作“太极术”重点锤炼自己的谈判能力、合同条文辨析能力、房产识别能力：借别人的房子，来打造自己的投资掌控能力。在初期的后一段时间里，可以逐渐尝试“炼金”。


    - （2）中期——“炼金”为主，准备“归隐”


    在初期积累的经验与资金的支持下，可以大规模的投入“炼金”操作。借助多重组合式的融资手段，快速壮大自己的资金实力、房产净值。


    把富余的资金开始投入“归隐”的退休准备。


    - （3）后期——“归隐”为主，少量“炼金”


    把资金大量投入“抵押放贷”业务，不求资金快速增长；以保值为先，减少投入的精力与时间。坐拥稳定的现金流入，享受经济自由的人生。


    三个时期并没有清晰的界限，关键在于个人投入资金及精力的比例。可以同时运用“三术”来投资，既可以分散风险，也可以稳定收益。


    最妙的是，这“三术”都是可以兼职从事的行业：无需经受繁琐的学习与培训，无需你脱离现在的工作环境，无需你改变自己的喜好及追求，无需你周旋于复杂的关系与应酬，无需你透支你的健康与时间。


    你可以：帮助自己尽早实现家国梦，帮助无奈的人拥有房旁帮助，卖房的人顺利解决烦恼，帮助租客找到理想的住房，最重要的是，帮助自己获得经济自由。


    做销售，你可能鉴于不断地拜访与开口；去经商，可能没有资本与渠道；炒股票，你可能没有耐心与分析能力；开公司，你可能不具备管理与产品资源……


    只有房地产：一个人搞，无所谓；业余时间做，无所谓；没经验，无所谓。没有钱，更无所谓。


    因为本书已经把房地产的重点投资技巧都倾囊相赠。你所需要的不再是闭门造车，而是“社会大学”。


    ![](img/acb46489adfd772451884bb9efeed060_220_0.png)


    ## 第十三课 大道至简：房地产投资的普遍规律


    普通的理财投资书籍，要不专注于“How-to”之类的行动细节，要不侧重于抽象理念传播。但人类的学习规律就是“由个性到一般，由感性到理性”，依次贯通“术、法、道”的鸿沟。本课程就是帮你把前面的知识深化，由“术入乎道”，探寻更深层次的投资规律。


    ### “三大定律”解开财富的密码


    房地产投资是一项汇集法律、营销、谈判、资本运营、室内装修等多项知识领域的综合应用型学科，从其衍生出来的投资细分方向数不胜数。


    但是大道至简，万变不离其中。根据长期的投资积累，把众多的投资手段进行剥茧抽丝、缩小聚类，终于由感性经验，提炼出来了有共性的理性逻辑——我们称之为“三流定律”。


    ### 三流定律


    > 三流定律：任何房地产投资交易形式都是“信息流”、“产权流”、“资金流”这三个流程的衍生及组合。


    我们以普通的房产交易为例来理解一下这条定律。买房人 A 首先通过“中介 B”了解到了一处房产（房东为 C）的信息，A 看中了该房产，于是 A 与 C 签订了购房合同；A
    没有足够现金，由是向银行 D 申请二手房按揭贷款，D 审批通过。A 于是向 C 支付首期款，银行向 C 支付按揭贷款，B 帮助买卖双方完成过户。过户给 A
    后，A 定期向 D 还款。


    这个过程可以描述如下图所示。


    ![](img/acb46489adfd772451884bb9efeed060_222_0.png)


    这三种流程贯穿始终，我们可以简单划分如下：


    **表 13-1 三种流程示例说明**


    | 流程分类 | 流向 | 内容 |

    | :--- | :--- | :--- |

    | 信息流 | ① C→B | 房东 C 向中介 B 发布卖房信息 |

    | | ② B→A | 中介 B 将信息传递给买家 A |

    | 产权流 | ③ C→A | 房东 C 将房屋过户给 A |

    | 资金流 | ④ A→C | 买家 A 付首期给房东 C |

    | | ⑤ D→C | 银行 D 付按揭贷款给房东 C |

    | | ⑥ A→D | 买家 A 定期付贷款给银行 D |


    如果 A 与 C 直接洽购房产交易，那么就可以省略中介 B 的角色，即“信息流”是由买卖双方直接接触完成——但在实际交易过程中，往往需要一个“中介”环节，即使不是“房屋中介公司”，也可能变为“互联网网站”、“熟人”、“同事”之类的来充当“中介”。


    如果 A 不需要贷款，那就可以省略“银行 D”的角色。“资金流”由双方直接对接完成。


    这是简单的房产买卖过程，如果中间插入投资者的角色，也可以按“三流定律”来理解。


    普通的“低买高卖”式投资行为中，往往是投资者首先买入房产，然后转售，其交易过程可浓缩为：


    ![](img/acb46489adfd772451884bb9efeed060_223_0.png)


    ### 风险定律


    在这种交易行为中，投资者常用的操作手法就是同时涉及“信息”、“资金”、“所有权”三种流程，相当于三重风险的同时承担。


    > 风险定律：投资风险按“信息流”、“产权流”、“资金流”的顺序依次递增。


    就是说，如果投资者只涉及“信息中介”，即负责买卖双方联系与普通过户手续的办理，那么他的风险就最小。风险随项目本身的复杂程度而增加。房产购买时风险等级较低（通常有“风险等级”的区分），而房屋转手时风险等级较高。


    相反，如果他首用把钱把房产买下来，再转而卖给其他人——如“全权委托书”投资方式——那么他就要面对“资金流动性陷阱”、“房产贬值”等风险，即“资金流”带来的风险最高。


    为什么这样说呢？比如：中介促成双方撮合后，可能遭遇“飞单”的风险（即买卖双方撇开中介，直接交易，以便免去中介费），付出一点“跑腿成本”与“电话费”，赚不到“中介费”罢了，并没有更多的成本风险。


    而“产权流”的风险居中，因为涉及“产权流”的投资方式如“期权合同转让”、“以租代买”等，只是付出“定金”、“租金押金”之类的支出，相对于购房款动辄几十万的资金规模而言，风险小得多。


    对于有经验的“房神”级高手而言，当然可以同时操控好这三种风险；但对于大多数投资新手来说，却是“暗礁处处、风险重生”——这就是常见的“低买高卖”式投资手法的致命之处：即同时承担三重风险，其累加效应远超单一风险；所以投资新手一定要避免这种“叠杠”的投资行为。


    与此同时，房地产投资是否也符合“风险与收益成正比”的规律呢？就是说“资金流”带来的投资收益最高？


    ### 收益定律


    > 收益定律：投资收益与资金投入无关；而是与对增值环节的“控制”程度成正比。


    不是说，你投入的资金越多，在房地产交易中就能获得更高的收益。实际上，投资收益与初始的资金规模并没有必然联系；相反，如果初始投资高，风险却是直线上升。所以，“有钱”反而是房地产投资的“大忌”——这就解释了为什么
    90%的房地产投资者赚不到钱：因为他们用钱“买”风险，却不知道该如何用“智”换“收益”。


    “与房地产投资的增值环节控制程度成正比”是什么意思呢？就是说，房地产投资的环节很多，其中一些是不增值的，而一些是增值的。投资者将那些增值环节控制的程度越深，就越能获利。


    首先，让我们来分析一下房地产投资到底有哪些增值环节。请看下图：


    ![](img/acb46489adfd772451884bb9efeed060_225_0.png)


    我们以纵坐标表示“增值程度”高低，以横坐标表示房地产交易的流程，房地产投资各环节增值效应越强大，其“增值程度”也就越高（见图 13-3）。“时间进程”，即耗时短长。共列了五个增值环节，基本包括了房地产投资的主要切入点。


    从图中所示可以一目了然地看出，最理想的投资环节就是“增值程度高”（纵向较长），而且“时间进程短”（横向较短）的环节。


    那么最理想的无疑就是“谈判签约”与“贷款融资”；而最差就是“产权过户”——这一点很容易理解，因为这一环节耗时长又长，交税又多，手续繁琐。基本只是“成本中心”（总想着怎么省钱），而不是“利润中心”（想着如何赚钱）——这也就解释了“为什么买卖双方不愿意找中介”的原因了。试想，你愿意仅因为为中介帮你找房、帮你办手续而支付高价吗？


    所以，“谈判签约”与“贷款融资”就是“性价比”最高的环节，是投资的“黄金地带”。


    之所以说这两个环节是“黄金地带”，还与“控制力”相关。我们从五个环节分别比较可知，“房源搜索”与“买家匹配”是很难彻底受“控制”的。因为房东既想趁卖房，就会四处发布信息，以便吸引大量的买家竞争，从中取高价获利。所以，他通常不会将信息仅限于告诉少数的投资者。即便投资者优先得到这些信息，也必须尽快将其转变成“合同锁定”（即“谈判签约”环节），才有可能真正的“控制”。


    “买家匹配”更是如此，有潜力买房的人太多了，投资者不可能限定死让谁买。“产权过户”当然也不用多说，既然我们无法“控制政府”，当然也无法控制这个环节。


    所以，“黄金地带”意味着不仅“增值+时间”比例高，更意味着“控制力”容易实现。


    根据“收益定律”可知，我们对“黄金地带”的控制力越强，越就能获得高收益。


    这里很多人可能会疑惑，为什么“贷款融资”会成为“控制力”强的环节呢？可以提供房融融资的银行很多，怎么能谈得上“控制”呢？


    学过前面“以租代售”的融资课程的人，应该可以理解这种“控制力”。


    #### 控制力决定成败


    简单地说，就是当我们获得“期权合同”后，不是简单地找到买家“一卖了之”，而是常常需要提供“融资服务”。这样才能“卖出高价”。而由我们的“融资服务”是与房产挂钩的，即只有买我们的房产才能得到我们提供的“融资服务”——如“过桥担保贷款”、“零首付以租代售”等——这样买家必须支付一定程度的溢价才能获得原本超出其购买力的房产。


    这样，我们就通过“融资”与“买房”的挂钩机制，实现了“谈判签约”与“贷款融资”这两大增值环节的同时控制——这种复合式的“锁定”能力非常强，对于交易双方都是强有力的约束与吸引。


    通过“谈判签约”形成的“期权合同”或“购房合同”保证对房源的锁定，同时通过“房源”及“贷款融资”条款形成对“溢价”的锁定，并最终形成对“收益”的锁定。


    所以，“做得越少，赚得越多”的秘密就是：


    > “谈判”与“融资”是解开房地产快速致富的密码。

    > ——房事财富观


    所以，要想真正快速实现自己的房地产投资宏图，就要从“谈判能力”入手来实现“产权流”的控制，从“融资能力”入手实现“资金流”的锁定。


