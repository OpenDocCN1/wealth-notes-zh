    # “三方融资”技巧示例


    ### “三方融资”案例


    投资者 M 通过“以租代买+期权转让”的技巧，在三年时间里积累了 20 万元现金。他准备开始“快车道”的投资之旅。


    他看中了一处地段不错的二手房 P，房龄 5 年，市价 30 万。他向银行申请二手房按揭贷款，贷到 6.5 成。银行评估房价为 28 万，即发给 M 的按揭款为


