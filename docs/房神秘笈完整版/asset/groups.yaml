    \ 前言——房神是谁\n\n什么是房奴？\n\n顾名思义，就是“房屋的奴隶”；按照国际通行的看法，月收入的1/3是房贷按揭的一条警戒线，越过此警戒线，将出现较大的还贷风险，并可能影响生活质量。\n\
    \n具体在小市民身上就表现为：“不敢轻易换工作，不敢娱乐、旅游，害怕银行涨息，担心生病、失业，更没时间好好享受生活。”\n\n截止2006年底，处于这种“奴隶”状态的青年有近3000万。更可怕的是，随着房价的不断攀升，还将有越来越多的人被迫“卖身为奴”。\n\
    \n那么，奴隶主是谁？\n\n让我们看一套数据：1998年以来，房地产价格持续保持2位数以上增长。从北至南，涨声一片。其中的典型代表，上海房价年涨幅为30%以上，房价两年左右翻一番。虽然经国家强力调控某些地方涨幅趋缓，但房价在未来10年至少再翻一番，平均年增长率达7%左右。\n\
    \n与此同时，1997年中国个人住房按揭贷款金额不到200亿元；到2005年，这一数字已经达到1.6万亿元。8年的时间，增加了近80倍。\n\n但悲惨的是，长期以来我国实行的都是低工资制度，人们的收入增长率长期落后于经济增长率。改革前，由于住房、医疗、教育等由政府和单位统管，低工资的弊端没有显现。随着住房货币化的推进，一方面是快速上涨的房价，另一方面是工资制度改革滞后、住房补贴数额较少，住房市场供需脱节的问题不断凸显。\n\
    \n房价不断升高，人们就只能选择贷款；贷款越多，还贷压力越大。“房奴”正是“银行”与“开发商”合谋的牺牲品。“房屋”已不再这 3000 万人的“财产”，而是他们的被奴役的“皮鞭”。\n\
    \n“人为刀俎 我为鱼肉”——普通的老百姓，如何才能战胜“奴隶主”，从而“翻身做主人”呢？\n\n与之截然相反，中国永远不缺少“世外高人”以及“草莽英雄”。芸芸众生之间，就存着一大群充满睿智与神通的人们提供了价格适宜、品质合适的房产，解决了人们的居住难题——最起码，他们是正大光明的挣钱！\n\
    \n现实生活中的“房神”为数众多，可谓八仙过海、各显神通。但出于“保护财富隐秘”、“表达能力不足”、“缺乏专人整理”等原因，他们的投资绝技一直都“深藏地下”、“秘而不宣”。\n\
    \n就像魔术一样，你看到很奇幻的结果，却猜不到背后的隐秘逻辑：\n\n- 为什么不用自己的钱也可以投资房地产？\n- 为什么可以保证交易各方都是“赢家”？\n\
    - 为什么具备小学文化就可以即学即用？\n- 为什么不管房价涨跌，都能立于不败之地？\n......\n\n他们的秘密说穿了，其实并不神奇；但最让人郁闷的是：解决的方法常常很简单，只是你想不到罢了。\n\
