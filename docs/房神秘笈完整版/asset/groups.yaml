    ## 向买家融资的几个特点：


    ### （1）首付款不能太高


    首付款超过5%，会限制一些潜在买家的购买欲望，降低对买家的吸引力。买家之所以愿意接受“以租代售”，就是因为这种模式具有“低首付”的好处。


    ### （2）月付款不能太高


    一般情况下，每月支付的“名义租金”比普通租金高20%左右；“名义租金”总额的30%可以作为购房定金。这种比例下，不会对买家心理购成较大压力，而且会吸引他们持续交纳高额租金。


    ### （3）年限为3~5年最为理想


    “以租代售”对买家的意义在于，可以使用较低的“首付”就入住，然后每个月支付的租金相当于“强制性储蓄”，用于筹集未来买房首付款，再补充以银行房贷，就可以买下该房产。所以，3~5年就是“首付款”的筹集期。因为正常情况下，二手房贷最高7成，剩余的3成需要买家筹集。而买家预付了5%，还需要利用3~5年的时间去筹集剩下的25%。扣除每个月的预付定金，实际上，买家只需要再筹集2成左右即可。


    ## 第十章 三方融资——巧用杠杆展“借术”


    这对于现金紧缺，但是可以接受细水长流式还款的买家来说，极具诱惑力。


    更重要的是，银行二手房按揭规定：“所购房为二手楼时，该住房的已使用年限不得超过10年。”由于二手房地投资者买入时，房产基本已经建成3-5年了。而再加上买家“以租代售”的3-5年，该房产就已经接近了银行规定的最长使用年限。


    所以，如果买家在3-5年的时间里仍筹集不出剩余的首付（约2成左右），那么就失去了“贷款”的可能，进而也就失去了“购买”的可能。


    结合以上这些特点，我们向买家融资的策略主要为：


    - 向买家收取低首付吸引买家入住；

    - 略高的租金保证“组合贷款”的还款能力；

    - 不能超过5年的“以租代售”期


    ### 三方整合


    我们现在把前面的“三方分析”重新整合为一体，从整体的角度再来分析“融资借术”。


    - （1）首先向银行申请按揭贷款，加上自己的首付款，购入房产。

    - （2）以房产作为“还款能力证明”，向信用贷款机构借款；第一次弥补“首付”。

    - （3）找到“以租代售”的买家，通过其首付来二次弥补自己的“首付”。

    - （4）通过买家的“名义租金”，来承担“银行货款”及“信用贷款”的双重还贷支出。

    - （5）轻松持有房产3~5年后，等待买家申请新的银行货款来支付剩余的房款。


