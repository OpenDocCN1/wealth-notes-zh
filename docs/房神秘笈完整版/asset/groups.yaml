    \n而房产中介给出的“每平方米单价”，都是市场价格的90%左右——这就是为什么很多房东不愿意与中介打交道的原因，因为他们开出的单价往往都与房东的期望价格相\n\
    其远。\n\n最初确定房产市场价格，应向5家以上，才可以通过平均法得出相对公允的价格。随着经验的增加，你很快无须问中介，就可以自行判断出来了。\n\n记住，中介给出的单价只能做参考，而且其往往与房东心理价位有一定差距，你在后面的接触中，不能以此为唯一的根据。\n\
