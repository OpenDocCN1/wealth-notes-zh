    ## 房神的投资习惯——做得越少，赚得越多


    作为投资新手，最容易犯的一个毛病就是“磨拳擦掌”——掰一个，觉得下个更好；扔掉，再掰一个，最后一个无刺。或者叫“见一个爱一个，喜新厌旧”。


    实际上殊途同归，无论哪种投资方法，最后都会有意无意地依照“三大定律”的脉络，发展成为“房神”。


    投资新手需要做的就是“看准一个投资思路，坚持到底，不成功决不放弃。”


    而最充分体现“零首付”思想而且简单易学的，就是“房式零首付”投资路线图，从“以租代买”开始学习投资，理解投资规律，借鉴“太极术”、“炼金术”思路，形成自己的独特投资习惯，最后从“归隐术”中获利。


    而这一切的“个人投资发展路径”，都暗含着“做得越少，赚得越多”的上升阶梯。


    ### 房神投资习惯之一：只对“最增值、最省时、最易控”的环节投资。

    同时满足“最增值、最省时、最易控”这三大条件的投资环节，基本集中在“合同控制”与“买家融资”上面。房神集中精力于“最有生产力的事情”上面，当然“一击即中”、快速获利，并保证获得“多赢局面”。


    不可否认，其他的手法如“地段升值”、“装修升值”等也都可以获得不菲收益，但这些因素受外界影响大，而且周转期长、投资较高，不是“房神级玩家”的优选。


    ### 房神投资习惯之二：成功性“智”，不性“责”。

    任何行业都有这样的特点，即能取得最高成就的，往往是“最有智慧”的“行者”——房地产也不例外。


    房神们无疑都是最肯在“教育”上投资时间与金钱的人——无知才是最昂贵的学费。


    他们会不断地与同行交流，不断地搜索最新的信息，不断地吸收别人的智慧。他们最常参加的就是投资类的课程、购买行业内的最新时事通讯。


    相对于每第5位数以上的收益，那些课程与培训实在是太便宜了。


    ### 房神投资习惯之三：坚持稳健，才能“速成”。

    房神们追求的是“不管风吹浪打，胜似闲庭信步”的从容：而这种气度的后面，就是“未战先胜”的“稳健”。


    即不投入过多资本，以免承担风险；不盲目依赖预测，不奢求靠外界升值；不追求短期暴利，忌过度贪婪。


    理财大师名言：人们常常高估自己一年内的成果，却常常低估自己十年内的成果。


    以三十年为职业生涯的标准年限，房地产投资只需要你集中精力投入五年左右（刚好是中国房地产市场的经济周期）。即六分之一，就可以功成身退——相对于其他事业的动辄数十寒暑的努力，难道还不算是“速成”吗？


    所以，没有必要追求“三月买房”、“一年百万”之类的急功近利心态。房地产投资讲究的是“活久”，“活得好”；房神们树立了长期经营理念，也会长期应用赚钱技术的短视目标。


    我们的很多人，大多是经历了一段较长时期的“不赔不赚”的起步期，然后才“一朝得道”迅速致富。反之，那些总是追求“捷径”的人，往往掉进“投机”的陷阱。把大把钞票砸到房地产市场，最终血本无归。所以，有钱容易使人“急进”，这反成为“无产者”的优势。


    学到这里，你已经洞悉了“房产秘笈”的全部智慧。


    后面的章节不是必需，却可以为你的财富大厦添砖加瓦。


    ## 第十三课 大道至简：房地产投资的普遍规律


    ## 附录：常见问题释疑


    ### 如何对付二次置业税

    **问：** 听说我这边要实行征收买房子二次置业税，象我们这样的新生代，如果要买房的话，如果想去去这笔税就得有结婚证。如果没有的话就要打二次置业税，而且至少打30%，以一间20万的二手房来推算，就要6万的二次置业税，请教有没有其它方法可以合法的避税呢？


    **答：** 其实，“二次置业税”与其他处于“交易环节”的税收一样，都是纸老虎。对付普通的投资者可能有效，可以限制一些大量买入房产炒作的人。但相对于“房产级投资者”根本没有什么影响。


    这里介绍三种对付这类“交易环节”税收的办法，你可以根据自身的情况酌情处理：


    **（1）期权转让法**

    你获得购入房产的期权后，再将该期权转给别人（具体操作请看书中相关课程）；最终是由下家与房东完成交易的，只要下家符合“二次置业税”的免税条件，就可以顺利避开此税种，完成交易。投资者根本不必过户到自己名下，即可完成投资。


    **（2）公司入股法**

    当你要长期持有该房产时，就注册一家公司，让房东签订房产入股协议；根据税法规定，房产入股是不必缴纳交易税费的。当你付完房款后，要求房东签订无偿放弃股权协议。这样，房东收到了钱，你也顺利地通过公司持有该房产——房产处于公司名下。你自己做该公司的法人代表即可。整个过程基本无需交税。


    **（3）全权委托法**

    你一次性支付给房东所有购房款，但不要求房东过户。只是把房产证给你，同时签订全权委托书。这样你找到下家后，可以凭借全权委托书与房产证，直接过户给下家，而无需原房东参与。这种方法中投资老手常用的手法，只是对于资金要求较高。


    除以上三种方法外，还有很多类似的操作手法。但建议投资新手优先考虑第一种，因为操作方便而且资本风险较小。记住，税收只是针对穷人和蠢人的；那些富翁可以结合自己的钱与专家的智去避开种种税赋——我们这些没钱的投资者一样可以“借鉴”，这不是“偷漏税”，而是“合法避税”——应该理真气力壮的把富人的权利取为已用。


    ### 上家与下家合谋，怎么办？

    **问：** 我是初哥，对于如何处理上家与下家合谋造“飞单”（上家通过投资者与下家相识后，想省下中间费用，绕开投资者直接签约）的处理方法，想请教，产权没有过户。户主可以自己就买卖房产，有什么办法制止这种现象？


    **答：** 当投资者与房东签订期权合同时，可以请一位律师作签约见证，在期权协议中明确提出：“违约就起诉”。同时，在合同中规定好相关的违约责任。一般情况下，房东都不敢“上法院”解决。


    即使出现意外，房东真的与下家合谋，绕开投资者直接与下家交易了。你也不用怕，直接起诉就好了。由于你有律师见证，基本都可以轻松“胜诉”，让房东给你相应的赔偿就行了。


    虽然胜诉也要不回房产，但可以获得让房东承受巨大的损失，也算达到目的了！记住，上家卖房的目的是获利，如果他的损失超过可能的获利，他就不会选择“飞单”了。而且在实际操作中，上家即使不太“心甘情愿”，但也不太敢面对“上法院”的风险。


    投资新手不要自己吓自己，积极去实践才明白如何处理这种现象。


    ### 何时才是买房的最佳时机？

    **问：** 房价越来越高，政府调控迟迟不见成效。不知何时才是买房的最佳时机，可以少交税、少交利息，最关键


    **答：** 任何时候都是最佳时机，只要你肯积极实践，去寻找投资的“引爆点”。房神秘笈中所介绍的方法，基本都不是受房价影响的：


    **（1）“以租代买”避了资金风险**

    “租”的过程中，通过租客来支付“给房东的租金”——首先解决了持有房产的日常资金支付风险。“买”的操作，是直接由下家来提供最终的购房款，投资者从中取得“期权转让费”，由于没有一分支出，所以更是没有风险。


    因此，从资金投入角度来看，房价对于“以租代买”的投资模式根本没有什么影响。相反，房价涨得越高，投资者未来的获利更可观。


    **（2）房价波动的现象并不是“全国一盘棋”**

    现在房价虽在上涨，但是全国的不同地区，地区的不同城市，城市的不同镇区，并不是完全同步的。而是形成一个水波扩散式的梯次递延。新城区往往是房地产开发的重点区域，房价上涨一定较快。但与其相邻的地域，或是老城区并不一定会上涨得那么快。


    所以投资者完全可以锁定一片处于“上涨前夜”的地块，在这里深耕细作，集中投资。然后坐等升值收益就好了。


    **（3）实践是最好的老师，拖延永远不会带来成功**

    这一点不必多讲；财富世界是“行者”的天下。任何时机都只有实践才能把握。


    ### 交易合同备案可否阻止房东卖给他人

    **问：** 将与房东签订的合同（包括租契、期权等）到房产交易部门备案，可否起到限制房东将该房产再转售给他人的作用？


    **答：** 备案的效力有限，很难起到“限制性”作用。


    一则，房产交易合同备案的目的是为了约束开发商不能在楼盘建好后，随意损害事先已部分支付房款人的利益，因此主要应用于新商品房预售，二手房不涉及预售，房产部门应该是不会给备案的。


    二则，备案的效力在实践中也是被常常推翻的。新商品预售房备案后，若是开发商私自再行出售，并给新买家办了房产证，实践中仍是按违约处理的，并不会因为“备案过”而改变房产权属。


    “备案”更多地是起到“证据”的作用，即证明该交易是“有效的”。其实，公证是更有效的“证明”办法。而且，公证机构是事业单位，他们的收费是依据合同标的，不同的公证机构的收费标准也不同，完全可以还价。


    为起到“阻止”作用，可以采取“违约金”的办法，合同为一般只支持标的物（即“约定房价”）的 20%。同时，可以要求“赔偿金”（一般等同于“损失”），即付期权费）。如果房东拒绝与新买家签订买卖合同，投资者就可以起诉房东，即使在房东给付了违约金的情况下。因为房东违约了。这类关系很明确，一般
    3~6 个月即可结案。


    虽然投资者要不回房产，但一样可以获得收益。房产是其次的，收益是首要的。


    在 2007 年 10 月 1 日开始实施的《物权法》里，已经有相关规定，可以办理“预告登记”，可以解决此问题。


    详情请查看房神博客。


    ## 尾声：对投资新手的建议


    投资新手最缺的不是“热情”，而是“经验”——“经验”体现在对于细节的把握能力。而弥补这一缺陷的最好的办法就是“举枪、射击、瞄准”。


    ### 举枪——“法律”与“融资”是必修课

    下定决心的投资新手，一定要在理解基本的投资模式与规律的基础上，认真学习具体的投资知识——相比于英语、数学等动辄十几年的学习生涯，房地产投资的学习就要快得多了。


    本书只是一本介绍房地产投资的书籍，要想持续深化掌握更全面的投资相关知识，你必须优先学习两大类课程：法律与融资。


    就“法律”而言，你没有必要从民法、刑法之类的课程开始；房地产投资是一门“应用学科”，你直接学习与“房地产买卖”相关的《合同法》即可。


    要深入掌握“房地产买卖合同”、“分期付款合同”、“抵押担保合同”、“期权合同”这四种合同。明白这些合同众多条款的潜台词与应用价值。


    而与“融资”知识相关的，就是“各大银行最新的贷款政策”、“信用贷款操作”、“利率及还款方式分析”……


    本书介绍了一些基本的“融资”技巧，更多的方式呢须通过你自己的努力来摸索与消化。


    中国人的理财意识刚刚启蒙，“融资创造财富”的观念尚未深入人心——这就是我们的历史机遇，只要你把握住百姓的“知识盲点”，创造性的提供“融资解决方案”，将发现“买家”会朝你涌而来。


    只要成为融汇“法律”与“融资”这两方面知识的“复合型”专家，你就会发现身边的金矿无处不在。


    “知识改变命运”，房地产投资领域更是如此。想改变你现在的状况，就要从这些知识学起。每投入一分努力，都会获得千万倍的回报。


    ### 射击——行动使人完美

    没有完美的计划，只有完美的行动。举起你的枪，射击好了。打中中不要紧，关键是看到了进步。


    “患得患失、停滞不前”是投资新手的通病。财富高手无一例外的提到“坚持行动”是他们成功的要素。


    你需要做的很简单：给自己定一个时间表，坚持去做就好了。一天一小步，很快就能飞跃。


    刚开始的行动，应该包括以下内容——简单易做，又意义深远。


    - 买一张本市地图，选定一块区域，用双脚把它“丈量”几遍——获得直接的房地产体验。

    - 浏览本地房地产交易网站，记录下一些吸引人的信息，比较一下重要的房产评价要素。

    - 选定几个房东，给他们打电话，问问为什么要出售——学会快速分析出售的动机。

    - 看几处房子，跟房东聊聊天，不做任何承诺——学会如何查看房产与谈判。

    - 找到银行的信贷经理，跟他们约时间面谈，问清最新的融资政策。

    - 从报纸上找到“信用贷款”的提供者，了解他们的利率政策及操作手法。

    - 拟一份简单的“以租代售”合同，向房地产专业律师请教。

    - 选定有潜力的房产，开始正式谈判签约。


    你慢慢地开始尝试，从简单的做起，很快就能找到“感觉”，会很愉快、甚至是“迫不及待”地要去跟进。


    “我们不是因为快乐才唱歌，而是因为唱歌才快乐。”


    只要把自己引入“快乐投资者”的心态，你就会发现“房产是你寻觅觅终于发现的理想事业”。


    ### 瞄准——经验上升为智慧

    小学一年级读了 6 回，也不能小学毕业。同理，简单的经验积累并重复，并不会帮你迈上更高台阶。


    失败是成功之母，但反省是成功之父。而反省的价值就在于把感性经验上升为理性智慧。


    为什么中国有为数千万的房地产二级市场相关从业者——比如房地产中介、物业公司、装修公司——却只有不到1%的人可以在房地产领域成功致富？


    他们所缺少的绝对不是经验，而是更高层次的“智慧”——智慧就是对于多方面的知识与经验融会贯通，从而形成的事物本质规律的把握与运用。


    投资新手一忌“邯郸学步”，二忌“浅尝辄止”。打通经验与智慧之间屏障的最好办法，就是“仰止于高山”。


    向比你高明10倍的人学习，向比你厉害10倍的人请教。取乎其上，得乎其中；取乎其中，得乎其下；取其下，则无所得矣。


    “圈子决定高度”——向什么人学习，就决定了你进入了什么样的思维模式，获得取什么样的沟通平台；获得什么样的沟通平台，决定了你可以进入什么样的“人际圈”，也决定了你的“高度”。


    开始“经验→智慧→高度”循环，进而在更高层次上开始“经验→智慧→高度”循环。普通与卓越的区别就在于能否完成每个阶段的“蜕变”与“跨越”。


    进步无止境，智慧无极限。想“从成功走向成功”的投资新手，就必须明白“举鞭、射击、瞄准”的道理。


    可以看到这本书的人何止千万，但是看到之后愿意付诸行动的人绝对凤毛麟角。“坐而论道，还是入世修行”；这是所有投资新手必须解答的疑问。


    “幸好只是看过”——应该引发“行者”的窃笑。


    大道至简，房地产财富之路归根结底就是那“三招两式”，但简单的事情，却不容易。


    “绝不只是看过”——希望成为你的座右铭，与“行者”同勉。


    ## 后记

    经过近半年的讨论与整理，本书终于付梓面世。写作是一次思想的旅行，可以帮助我们完成由“知识”到“智慧”的飞跃。


    这是团队的飞跃，而不仅是个人的成果。所以，我们最终选择了“匿名”——本书将以“房神团队”的名义发表，而不仅是某个人。


    “房神团队”实际上分布于全国各地，有的通过网络交流中结识，有的在交易合作中相知。大家各有知识专长及投资偏好，但都有一个鲜明的特点：愿意开放式的互助与学习。


    读到此书的你，不也是“互助与学习”的获益者吗？所以，如果你在阅读的过程中，发现一些问题与缺漏，欢迎随时与我们联系。当然，如果你愿意分享自己的投资心得，我们更是引颈期盼。


    更加精彩的《超级零首付》及《空手赚技术》等待着你的召唤！


    始终不能忘记，“解放”千万的“穷人”，必先“解放”千万的“大脑”。《房神秘笈》愿为此贡献棉薄之力。


    房神团队，2007年1月

