    （6）交易过程中，对有关“钱”的问题，绝对不能马虎大意，不能相信“个人感觉”，而要相信“严密监控”。


    （7）坚决相信“法律”力量，对于不守信、不履约的行为，第一时间邀请律师介入，快速解决。


    房神教你的“太极拳”，只是完成“原始积累”的方法。拥有了可用于投资的“第一桶金”（包括“现金”与“经验”）之后，睿智的投资者应该尝试更高效的投资手段。


    如果说，房地产投资是一种长距离的赛跑的话，那么你前面所学到的只能算做是“散步”——速度慢、效率低。与之相比，后面将介绍的“炼金术”就是“飞奔”。那才是百万富翁的金矿。


    # 中级篇：“炼金术”


    前面介绍的“太极术”强调一个“借”字，但房产毕竟是别人的，收益的大部分还是落入了房东的口袋。


    本篇介绍的“炼金术”将帮投资者真真正正地成为房东，从而进入“财富快车道”——仅使用很少自己的钱，就可以买入房产，并零成本持有它，直到买家向你支付大笔现金——就好像古代的“炼金术士”，把石头（少量投入）炼成黄金（大笔现金）一样的神奇。


    众所周知，房地产是个典型的“资本密集型”产业，对开发商来说，动辄千万、几个亿的资金；对普通平民家庭而言，几十万的资本也常常是倾其半生所有，甚至还需还贷十、二十载——这么庞大的资金规模是房地产天然的特质，也是不能否认的事实。


    那么，对于很多“一穷二白”的投资新人来讲，彻底该如何下手筹集这么大笔资金呢？即使等筹集到了，又该如何面对资金的流动性风险呢？


    其实，这个问题，恰恰是房地产独具魅力的地方——一般的投资项目，很难顺利融到所需的资金，如果你曾经投资过其他不动产类项目，就会很深刻的明白这点，但是房地产刚好相反，它是天生的“资本金矿”——因为是不动产，所以银行青睐它的保值功能；因为是不动产，所以它可以分享区域经济发展的成果，坐享升值收益；因为不


    动产，所以不担心被盘被抢……


    落实到具体的操作中，没钱的人玩房地产的方法就是一个字：“借”。


    “借”是一个很深的学问，是所有白手起家的人都擅长的技能。也是穷人与富人之间的分水领。


    在投资房地产的操作中，“借”的渠道之多，绝对是普通人想像不到的。


    综合而言，可将“借术”分为以下几种：


    - （1）向银行借——如信用卡、抵押货款、按揭货款等；

    - （2）向投资者借—如亲戚、朋友，担保公司、信用贷款公司等；

    - （3）向房东借—如抵押担保、分期付款、以租代售等；

    - （4）向下家借—如“转让购房合同”、以租养贷等。


    而实际操作中，常常都是以上这些方法的“混合体”。掌握了以上四类“借术”的基本逻辑，就可以把房地产的融资问题轻巧地解决，达到“幻化万千”、“随心所欲”的境界。


    “炼金术”主要内容有：“转按买房”及“以租代售”。其核心就是多种“融资”方式的组合。由于涉及到了大量的数据计算，所以，请你一定要细心观察、耐心分析：从而解开“资本魔方”的秘密。


    # 第九课 “转按买房”——2686% 收益率的秘密


    “你赶快低价买走我的房产吧！”


    有很多房东迫不及待地想向你说这句话！你敢相信吗？而且他们的房产往往质量过硬、装修优良、地段出众，你相信吗？


    说实话，当我们第一次碰到一个房东这样说的时候，简直以为自己在做梦。但是当事实发生之后，你不得不相信这一切——原来可以超低价买入的优良房产到处都是，只是常人不具备识别的慧眼。


    ## “转按买房”操作实例


    100% 的人明白：房地产投资最好的利润点来源于超值的低价房。就是说，房东送你钱——他愿意以很低的价格把房产卖给你。


    为什么会有这样的 “傻房东” 呢？请看以下案例：


    ## “转按买房”操作案例


    房东 Q 于 2000 年某市房产处于泡沫高峰时以 26 万元的价格买入一套黄金地段的小户型住宅商品房；该房产为 2 室 1 厅 1 卫的电梯楼顶层，套内建筑面积
    78 平方米，普遍


    物业管理。位于市中心，附近有大型购物中心、步行街、公园、小学等设施，生活、交通都比较方便。Q向银行申请贷款8成，20年，浮动利率。房东Q月供进1500元。


    至2006年底，离异后经济状态恶化的房东不堪还贷重负，急于低价处理房产。投资者V与房东经协商，达成18万成交价格，V承担所有交易税费。此时，与之相近的3个新开盘楼，均价为3400元/平方米。同类房产每月租金为1100元。


    房东Q还剩下17万的贷款本金未还。所以，V直接通过银行同行转按揭继续房贷，并支给了1万左右现金给房东。由于Q持有房产超过5年，所以免除大部分税费。


    这样的故事每天都在发生，我们经常把这样的房东称为“房奴”。在本书的开篇就已经述览过“房奴”的苦难。而相信很多读者，可能现在就身处这种“水深火热”之中。


    我们运用投资技巧，不要是“盘剥”他们，而是要“解救”他们，解其“燃眉之急”，成就双方的利益。


    ## “转按揭房”基本规则


    “转按揭房”就是说，你与房东一起到银行办理手续，由房东把房产转给你，同时由你接替房东继续向银行每月支付贷款本息——即是“同行转按揭”的操作。


    具体地讲，“同行转按揭”是指双方签订房地产买卖合同之后，共同向房东的原贷款银行申请办理转贷款（转按揭）手续，摇)手续。这种方法的优点是,无须等贴息金提前还贷,没有融资的压力,而是将房东原有的还贷义务转由买方承受,通过变更抵押登记,将抵押人从卖方变更为买方;缺点是:转按揭手续较为复杂,且不是所有的银行都有这项业务——不用担心,现在已经有越来越多的银行支持这项业务了;因为银行房贷竞争激烈嘛!


    下面让我们了解一下“同行转按揭”的官方说明:


    ## 个人住房转按揭贷款说明


    (摘自工商银行网站2006-10-23,有删节)


    - ☆服务简介

    个人住房转按揭贷款,是指已在银行办理个人住房贷款的借款人在还款期间,由于所购房屋出售、赠与、继承等原因,房屋产权和按揭借款需同时转让给他人,并由我行为其做贷款转移手续的业务。


    - ☆贷款额度

    因住房出售申请转按的,贷款额度最高不得超过该房屋交易价格或评估价值(以较小者为准)的70%;商用房最高不超过50%;因房屋赠与、继承等原因申请转按的,转按揭贷款额度不得超过原贷款余额。


    - ☆贷款期限

    个人住房转按揭贷款期限与房龄之和不得超过30年,个人商用房转按揭贷款期限不得超过10年。同时房龄一般不超过15年。


    ## ☆贷款利率


    个人住房转按揭贷款利率最低按中国人民银行相应档次基准利率0.85倍的下浮利率执行;个人商用房转按揭贷款利率按中国人民银行期限利率执行。因房屋赠与、继承等原因申请转按揭的,贷款利率最低按实际贷款期限加转按揭贷款期限对应的档次基准利率的0.85倍下浮利率执行。


    此份文件,一些关键的数据说明,请你一定要注意。后文很多操作都是按此规定执行的。


