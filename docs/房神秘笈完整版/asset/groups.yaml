    我们将上述四种方式，根据其风险及收益划分成四个象限，表示为上图。


    房产处理过程中，主要有以下两种风险：


    +   - 持有风险：每月现金流为负，维护费用过高等。

    - 交易风险：费税过高，房产贬值可能。


    很明显，“IV只售不租”将大量资金压在房产上，而且只靠出售获利，所以交易风险也高；同时，收益却最低，所以是第一个要剔除的对象。


    “I 仅租不售”每月现金流为负，持有风险也属偏高；而且收益偏低。也不是理想的投资方式。


    剩余的两种方法中，“III先租后售”所面临的持有风险与“ I ”类似，交易风险比“II 以租代售”高；但收益也比“ II ”要高。


