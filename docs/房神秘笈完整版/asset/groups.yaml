    # “无风险”获利的秘密


    房地产的“风险”99%产生于“资金流动”过程，而“资金流动”主要涉及的是“金融机构”、“买家”二方，所以，房升级投资高手，就需要借助某些巧妙的工具，实现对各方的掌控，以消除风险——“共同帐户”就是最简单'
  md: "\n是“公安局统一要求”（在联系表中附上这几个字即可）。\n\n如果看房人拒绝，你反而“省心”了——如果一个**人都**不愿意提供这些基本信息给你，本身就说明他的身份有问题。就自动过滤掉他们了。\n\
    \n如果看房人填好了此表，你事后要及时给他们提供的联系人打电话确认。\n\n通过与这些联系人联络，你可以快速确定这些看房人的职业情况、品行素质——因为“物以类聚”，那些同事的沟通表现，与看房人本人应该不会相差太远。\n\
    \n你根据调查情况，要尽快通知看房人交定金——至少找到 3 个“候选人”，明确告诉他们：“先交定金者先得”。\n\n这样你就可以快速将房产出租给合适的人选，而无须耗费太多时间。\n\
    \n当你见过众多租客后，就会渐渐形成一套良好的“直觉”，可以根据其言行举止高效率地判断出其是否“可靠”。\n\n把好了“入口”这一关，后面的租客管理就省心多了。\n\
    \n## 如何省心地管理租客\n\n省心也是遵守 20:80 定律的群体。即其中 80% 会正常按时交纳租金，但会有 20% 给你带来麻烦。\n\n省心与麻烦的最主要区别在于能否“按时交租”。解决这个问题的技巧就是“租金调控”。\n\
    \n### （1）租金调控\n\n比如你索要的正常租金为 580 元，每个月 2 号前交租。那你就规定：凡是 2 号将租金汇入指定账号的，可以只交 580\
    \ 元；超过 2 号后，每天加收 10 元。\n\n人总是“趋利避害”的，通过这种财务杠杆，可以促使租客按时交租金。如果租客拖延了一段时间租金，你就要不客气地按“规矩”赶人了。\n\
    \n在租金的问题上，千万不能“姑息”；否则就会后患无穷。记住，不能按时交租的往往是“房东费坏”的开始。只要在这个问题上咬住不松，其他的就都好商量了。\n\n\
    此外，每年应该根据市场行情进行租金的微调。不必一次性的上调较大幅度，你只需要每次增加一点就好。这样不会引起租客的反感。\n\n### （2）正常沟通\n\n\
    没有人希望房产“苦难度日”——你必须把可能的隐患扼杀在摇篮中。而像“失火”、“漏水”、“被盗”等可能问题，其实都在租客日常生活中“早有苗头”。\n\n应该形成定期检查的习惯。自己去检查并不会花费太多时间，却可以预防很多问题。同时，也可以趁此与租客进行必要的沟通，及时了解他们的所思所想，解决日常的需要。\n\
    \n此外，应该记下租客的重要日子，比如生日（在抄录其身份证号码时就可以知道）。向其打个电话、送个贺卡，哪怕仅是封 Email 都不错。\n\n### （3）租客搬出\n\
    \n如果租客要离开，你必须要求他至少提前一个月给出通知——这一点应该在合同中所体现。这样你就可以尽早安排重新招租。\n\n房产有人住，其维护情况总好过空置。所以，当租客离开前，就尽早安排好下一位租客。\n\
    \n如果方便的话，请那些即将搬走的租客写一封推荐信，表达一下在这段租房期间的感受——如果你与租客的关系不是太差的话，租客都愿意给你写点好话的。\n\n这类的推荐信以后会帮助吸引更多租客，却不必花费更多精力。“顾客见证”永远都是最好的广告。\n\
    \n## 小结\n\n出租管理往往是一项耗时又费力的辛苦活，赚的都是“体力劳动”的钱。所以要更加讲究技巧。综合而言，要从以下方面做好：\n\n- **房产升级**，提高房产的“空间利用率”或改变房产的客户定位，以收益更高租金。主要使用的方法为：\n\
    \  - 空间分隔：一个大户型变多个小户型；需要一定的装修投资；\n  - 寄宿公寓：不改变房屋，而改变租客市场，出租给单身租户。投资很小，但是管理相对繁琐。\n\
    - **吸引租客**，可以利用的方法有：\n  - 增值服务：如提供“租金奖励”、“定期清洗”等。\n  - 量化定价：比市场租金略低一点，最好设置为 5、8\
    \ 尾数。\n  - 加强宣传：利用互联网，尽量多提供一些信息，如上传照片等。\n- 借租客提供的联系人信息来筛选租客，并通过巧妙的方法来激励租客按时交钱。\n\
    \n虽然出租管理是一种“生财之道”，但却只是“羊肠小道”；真正的“阳关大道”在后面的“转售”环节中。\n\n## 第八课 融资转售——“太极术”的钻石矿\n\
    \n我们在介绍“以租代买”的原理时，已经简述过几种将房产卖出高价的办法，如“装修升值”、“地段升值”、“卖点升值”等，但这些都不是很聪明的低风险、高收益的手段。\n\
    \n这一课将是本书中最有价值的部分之一，因为它将介绍一种非常高效且秘而不宣的操作手法，可以让房产拥有者们轻松地将房产卖出高价——而且是房东与买家双赢的“高价”。\n\
    \n如果说“房产”是投资者的“存折”；那么，“卖房环节”就是投资者的“提款机”。这一环节会帮助投资者们快速、高效的“提现”——将房产的利润变成现金。\n\n\
    ### “融资”魔术——速览交易过程\n\n#### 案例中体验“融资神通”\n\n请看如下案例所介绍的操作方法：\n\n| “融资转售”操作案例 |\n\
    |---|\n| 投资者A采取“以租代买”的方式获得了房产Q为期3年的控制权，月租金2500元（正常租金为2200元），约定30%的租金（即750元）可用于抵扣房款。期权合同锁定房价。\
    \ |\n\n价为 40 万，与当时市场价格相同。A 找到租客入居住用以弥补前期的“一押一租”支出后，实现“零成本”持有。\n\n2 年后，A 购买房屋 Q\
    \ 所需补交的资全为 38.2 万（即 400000 - 750×12×2 = 382000）。A 找到了买家 E，协商交易价格为 44 万（此时该房产市场价格为\
    \ 42 万）。这时，E 仅有 10 万现金，距离买房款差距较大。A 帮助 E 向银行申请二房按揭贷款。银行评估价为 40 万（取评估价与交易价的较低者为计算依据），愿意贷款\
    \ 6 成，共计 24 万；年利率为 6.84%，为期 15 年。\n\n这样，E 购房付首期就需要 20 万（440000 - 240000 = 200000），还差\
    \ 10 万。A 再为 E 提供担保，帮助 E 向信用贷款公司 H 申请信用贷款 10 万[^1]，为期 2 年，年利率 8%。\n\n[^1]: 根据信用贷款公司规定，每个自然人的信用贷款(无需任何担保)有一定的上限，比如5万元。而需要贷款额超过这个上限时，比如10万，就要找人担保，或者提供更多的资产证明(不是资产担保)，以表示借款人具备还款能力。\n\
    \n这样 E 在 A 的帮助下，凑足了 44 万购房款。\n\n房产交易完成后，E 再向信用贷款公司 K 申请新的信用贷款，归还 H 的贷款，以免除 A 的担保责任。\n\
    \n最后，房产 Q 的房东既保证了这 2 年的出租收益，又以 40 万卖出了房产（按照 2 年前的市场价值）；买家以 10 万元现金（仅 2.3 成的首付）就买入了价值\
    \ 42 万的房产，低于普通二房按揭贷款首付。银行和信用贷款公司都获得了以房产为保障的贷款收益。\n\n![](img/acb46489adfd772451884bb9efeed060_120_0.png)\n\
    \n> 当然，投资者 A 收获最丰，完全是零首付，最终获利 5.8 万元，并且事后脱离了未来可能的担保隐患。\n\n由于整个过程涉及了较多环节与参与方，所以请你把它再三分析理解。尤其是对于投资新手来说，可能较为复杂。但这是迈入“高手行列”的必经之路。\n\
    \n而这条“融资转售”路径中最关键的要素，就是“资金”的流动——新手一定会认为这里面风险重重，甚至望而却步；而真正的房神却“闲庭信步”。\n\n### 紧控资金命脉——低风险“融资”的奥秘\n\
    \n现在，我们把整个“融资转售”过程的“命脉”抽离出来，单独放大分析，研究里面的“低风险奥秘”：\n\n- ① A 为 E 提供担保，向 H 申请贷款 10\
    \ 万元。\n- ② H 批准后，直接将 10 万打入 A 与 E 的共同账户。\n- ③ 共同账户支付 7.1 万元，E 支付 7.1 万元，凑足 14.2\
    \ 万交给房东作为首期款（即 38.2 - 24 = 14.2）；与此同时，E 汇 2.9 万元进入共同账户。\n- ④ 房东将产权转给 E；同时共同账户转\
    \ 2.9 万给 A。\n- ⑤ E 向银行提出申请。E 同时以房产为资产证明向 K 提出贷款申请。\n- ⑥ 银行直接拨款 24 万给房东；K 批准 E\
    \ 申请，向共同账户拨款 10 万。\n- ⑦ 此时共同账户共有资金：10 - 7.1 + 2.9 - 2.9 + 10 = 12.9（万）。\n\n共同账户还\
    \ H 的贷款 10 万，同时汇给 A 剩余的 2.9 万。刚好该共同账户用尽余额。\n\n我们再把整个过程描述一遍，以便加深理解。请看下图，根据数字标号顺序来解读这种操作流程。\n\
    \n![](img/acb46489adfd772451884bb9efeed060_122_0.png)\n\n以上的这个过程，希望你反复读多次，因为涉及了三个交易方，三个贷款机构，很容易把投资新手搞糊涂。\n\
    \n除了要了解以上的资金流转外，还要了解整个过程的操作顺序，否则你会误入歧途。\n\n### 进退有序的交易顺序\n\n操作过程可以说明如下：\n\n- ①\
    \ 找到有意向的买家；\n- ② 与买家签订“期权转让协议”；协议里规定：如果最终没有签订房产购买合同，则本协议失效。此时，无需买家向卖方支付任何费用。\n\
    - ③ 投资者与买家一起找到房东，安排房东与买家签订房屋购买合同，根据期权约定价格抵扣租金后的房价作为协议价。\n- ④ 买家持相关证件到银行申请按揭贷款，等待审批；\n\
    - ⑤ 银行审批后，买家以投资者为担保申请信用贷款，转而支付首期款给房东。同时支付一半的期权费给投资者。\n- ⑥ 房东办理房产过户给买家。买家申请银行拨款给房东。银行办理房产抵押后将贷款划拨给房东。\n\
    - ⑦ 买家二次申请信用贷款。然后归还第一次信用贷款本金。然后支付另一半的期权费给投资者。整个交易结束。\n\n请看下面的操作流程图：\n\n![](img/acb46489adfd772451884bb9efeed060_123_0.png)\n\
    \n图 8-2 “融资转售”交易操作顺序\n\n整个流程看起来略为复杂，实际操作并不麻烦。只需买家填几张申请表就可以了——因为大部分工作是由投资者主导完成的。\n\
    \n这些环节的设计都“进退有序”、“有章有法”、“前后衔接”，整个交易过程全在投资者的指挥下完成。买卖双方都无需付出太多时间与精力。\n\n投资者“付出的精力多”所以才能赚到远远超过普通中介的收益吗？不是。而是因为投资者为房产买卖双方都提供了增值的服务，并牢牢地掌握了交易过程的主导权；而不仅仅是跑跑腿、打电话、办手续这样简单。\n\
    \n因此，把投资高手看成“中介”，是人们的误解；把投资高手看成“炒楼者”，更是错上加错。投资高手（房神们）投入的是智慧与汗水，收获的是众家皆赢的成功。\n\n\
    ### 玄机何在——“融资转售”的成败关键\n\n从上面的案例可以分析得知，投资者的收益源于三部分：\n\n- ① 租金抵扣的房价 1.8 万（由 40 万变为\
    \ 38.2 万）；\n- ② 房产升值 2 万（由 40 万变为 42 万）；\n- ③ 融资方案设计，使房价增值 2 万（由 42 万变为 44 万）。\n\
    \n而可能的风险主要有：\n\n- ● 房东与买家直接达成交易，绕开投资者；\n- ● 投资者提供担保后，由于买家不还款，而可能造成的负债。\n\n那么，投资者是如何保证以上收益，并控制可能风险的呢？其中关键的要素是什么呢？\n\
    \n#### （1）投资者的收益怎样确定\n\n投资者的收益来源于三部分，其中第②部分“房产升值”是难以保障的，因为影响因素难以控制。\n\n而第①部分是与“房产持有年限”有关的，即持有年限越长，这部分收益越高（因为抵扣的租金积累越多）。这部分是稳定的收益。\n\
    \n而第③部分“融资服务”的价值，则取决于“买家”的现有资金状况。一般来讲，买家的钱越少，融资服务的价值越高。但是为买家“融资”，实际上还是买家“借的钱”，毕竟要连本带利还的，所以，“借的钱”数目绝对不能超过买家的承受能力。\n\
    \n所以投资者不能奢望在买家身上捞到太多“油水”。见好即收。否则不但会“吓跑买家”，更可能引起房东的嫉妒，招来不必要的麻烦。\n\n基本上，投资者赚到原合同房价（即与房东签订的“期权合同”约定的房价）的\
    \ 5%~10% 左右，就可以满意。\n\n因此，根据本课案例数据，投资者 A 最终赚到 2-4 万即可：5.8 万已经略高。\n\n#### （2）买家未来无法还款怎么办?\n\
    \n精明的读者一定会问：交易完成后，买家能负担双重还款压力吗？我们可以快速估算一下买家未来的还款需求。\n\n信用贷款 10 万，8% 的年利率，为期 2\
    \ 年；而 2 年内，每月需还款额为：\n\n100000 × (1 + 8% × 2) ÷ 24 = 4833（元）\n\n银行 24 万，为期 10 年，6.84%\
    \ 的年利率，则每月还款额为（以下为 EXCEL 计算公式）：\n\n`=PMT(6.84%/12,15*12,-240000)`\n\n求得 2135.78\
    \ 元，即约为 2136 元。\n\n这样，买家实际上每月还贷支出共计 6969 元，即约 7000 元。\n\n2 年后还清信用贷款，则还款额将降到 2136\
    \ 元，压力骤减。\n\n所以，当投资者为买家设计这种融资方案进行交易前，一定要清楚地问买家：是否愿意并有能力在 2 年的时间承担这样的压力？如果买家（可能是一个人，但更可能是夫妇两人）真心喜欢该房产，愿意为提前入住而推迟\
    \ 2 年的拮据生活，那么才可以选择该买家。\n\n否则，要不另选买家，要不改变交易方式。如果买家冲动之下接受了这种交易方式，而又超出其正常收入水平；那么买家将会受苦不堪。\n\
    \n当然，还有一种可以减轻买家压力的做法，就是借助银行提供的“循环房贷”的融资产品，把已经还完的贷款本金重新贷出来，归还利息较高的信用贷款。\n\n比如，一年后，买家已经归还银行的贷款本金为\
    \ 9508 元（可以使用本书配套工具里的表（2）计算得出），则可以重新贷出来，补 500 元，变为 1 万元，用于归还信用贷款，以便减轻信用贷款的压力。\n\
