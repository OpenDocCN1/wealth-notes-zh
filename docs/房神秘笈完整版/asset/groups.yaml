    99%的人都不了解的法律武器。


    由于这里涉及了一些法律专业术语，所以你一定要认真的阅读，最好可以参考合同法文本。法律是房地产知识体系的重要环节，值得你花费巨大的时间与精力去研究、学习。


    我们下文将做简单的“期权”解释，如果你想了解更多，就请查阅相关资料。


    # “期权”简析


    “期权买卖”本质上是“购买了一种权利”；交易双方签署期权合同以表达这种交易“有效”。


    就好像车票一样，买家购了车票，该车票所标注的座'
  - '[PAGE 97]


    位就“唯一性”它属于买家，或者说是持票人；持票人出示该车票，就可以占用这个位置。车站不能把“占有”这个座位的票再卖给别人。但是，这个票是有限制的，超出这个时间范围，这个票就作废了。


    期权与车票的原理一样，但是期权是不能“退票”的，而且过期立即失效。


    假定房东为 $G$ ，投资者为 $F$ 。则期权合同的甲方为 $G$ ，乙方为 $F$ 。$G$ 就是期权卖家，$F$ 即为期权的买家。搞清楚这两个角色，会对后面的理解有很大帮助。


    $F$ 向 $G$ 支付期权费，用于购买“买房的权利”；$G$ 收取期权费，把这种“买房的权利”卖给 $F$ ，这种权利是“独占性”的，即在约定的时间范围内，$G$
    不能再将该房出售给别人，因为“购买权利”已经出售给 $F$ 了。同时，这种“权利”是有时间限制的，过期不“行权”（即“不买房”）即失效。


    所以，$F$ 与 $G$ 双方构成债权债务关系，而这种“权”即“在指定的时间范围内，以指定的价格及付款方式，购买指定的房产”的“权利”；$F$ 即“债主”（债权人），$G$
    即“欠债者”（债务人）。


    # “期权合同”的突出优点


    为什么要使用“购买期权合同”呢？因为它具备无可比拟的好处，是衡量一个投资者水平高低的重要标尺。


