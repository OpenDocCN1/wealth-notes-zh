    因为人人向往财富，而且绝大多数人都知道把钱存银行里是会贬值的。但是，普通老百姓怎么懂企业经营、项目运作、商业投资呢？所以，他们只好选择股票这种投资产品，以期望从那些“绩优股”公司的经营成果中分一杯羹。


    在欧美健康的股票市场中，其长期收益都是与国家经济发展同步的，所以普通投资人可以借之分享经济发展成果；但是，中国的股票市场是个不健康的怪胎，甚至是个“大赌场”，众多公司都以上市做为“圈钱”的工具，骗取老百姓的血汗钱，从没想过要与老百姓分享成果；所以，在很长一段时间里，造成了股票市场与中国经济发展大势相背离的怪现象。


