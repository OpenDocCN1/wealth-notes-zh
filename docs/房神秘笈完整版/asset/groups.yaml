    # （1）便于转让


    由于双方是债权债务关系。F是有权利，无义务；G是有义务，没权利。所以，从法律规定来看，F可以不经过G同意，而转让该“期权”（债权）给第三方——有点类似于银行出售“不良资产”的做法。当然，最接近“期货买卖”操作。这就为F后面的“转让期权赚差价”埋下最有利的一笔。


    # （2）简洁易懂


    相对于其他房屋买卖合同，动辄三、四十条，几十页纸的规模：期权协议只要说明关键要点即可，一页纸内 500字左右即可覆盖全部条款。非常便于购房方的交流及协商。可以帮助投资者快速完成谈判、快速锁定房产。


    # （3）投入较低


    房屋买卖合同的规定规模基本都在 5000 以上乃至上万，会对投资者造成较大风险与压力；而期权合同则无此弊端。与“租赁合同”配套，以租金加押金的形式抵扣期权费（相当与定金），一般不会超过租金的
    2 倍。远低于买房定金的投入。低额定金很快又可以 从“租客”身上取回，所以直接降低了投资者的风险，并有效地保障了“零成本”锁定房产的目标实现。


    # 特殊条款——巧拟语言胜在先


    虽然“期权合同”好处明显，但由于在国内房地产投资领域里，很少有人对它熟悉、甚至精通，所以，一定要


    > 为强调期的本次购房，房产转让条款必须送《赢在自动赚钱机》一书的它，该书揭示了由我们首创的、具有独创性的赚钱技术。'
