    # 股神的投资智慧——起点决定高度


    带领日本制造创造奇迹的质量管理大师戴明，经过半个世纪的研究发现：每一个程序都有一个起点、终点，如果你将重点放在该程序前面的 15%，保证程序的正确，那么你就至少能保证获得期望中的
    85% 的产出；只要专注于任何事物的第一个 15% 的部分，剩下的 85% 不费力气。


    > 思路决定出路，起点决定高度。

    > —房神论道


    投资者一定要具备简单而正确的投资战略，才能面对千变万化的房地产机会自如施展、处变不惊。战略决定了自己的行动起点，起点正确，则结果就得到了保证。


    # 凯恩斯也是“股神”


    这里，我与大家分享一下享誉世界投资大师的投资理念。商业世界的规则往往是相通的，他们的成功经验，应该也成为我们的指导思路。


    凯恩斯既是知名的经济学家，实际上也是成功的股票投资者。他的投资理念与股神巴菲特不谋而合。


    # 凯恩斯的投资智慧


    所有的股票都会暴涨暴跌，安全第一的策略实际上是必不可少的，而一旦你实现了安全第一，就能获得资本利润。如何做到这一点呢？他说：我的目标是买卖具有令人满意的资产和获利能力，以及市场价格相对低的证券。如果我做到这一点，我就同时做到了安全第一和资本获利。


    一位严肃的投资者的责任，就是时常平静而自觉地接受手中股票贬值的事实。一个投资的目标，应当是长期收益。正确的投资方法是，将比较大的一把钱投资于自己较为熟悉而前景乐观的股票，而将小股资金投资于其他具有良好发展前途的股票，然后寄希望于自由、自觉、具有全局观点的选股技术。


    > 的、并对其管理完全信任的企业，并不为市场价格的变动所影响，长期持有，才能最终有所获益。耐心是成功投资必不可少的原则。


    凯恩斯的投资智慧使我们受益无穷。无论高手与低手，都有投资失败。房地产像股票一样，具备了投资与投机的双重功能，而房地产积累财富的速度其实远远比普通人想像得慢得多。


    当然，投资高手具备了大量的经验与技能，所以可以较常人为快；但从整体来看，房地产的财富效应更像摆在米格上的大米，未来的巨大收益是前面的点滴投资积累起来的。


    # 战略决定成败


    所以，睿智的投资者要铭记以下三条“不败”的投资理念：


    - (1) 投资交易价格低于其市场价值的房产；这样无论房产未来升值与否，都立即获得了相当的收益。

    - (2) 安全第一：抵抗风险的最好的办法就是以安全为首要考虑因素。成功不是靠运气与勇气，而是通过缜密的构思与详细的准备，从而预控风险。

    - (3) 长期持有才会富有：快速转手的生意，可以让你较快的积累现金，但真正使人一生富足的，却是具备稳定现金流入的长期持有房产。以不变应万变，其实是最大的智慧。


    无论你做任何投资，只是始终以这三条理念作为投资原则，就可以稳立于不败之地。由此出发，我们一起探讨具体的指导策略。


    # 高手的金钥匙——现金流为王


    决定“房地产价值”的三个至关重要的因素是什么？90%的人会告诉你：第一是地段、第二是地段、第三还是地段！


    那决定“房地产投资价值”的三个至关重要的因素是什么呢？请注意（“房地产价值”与“投资价值”的区别）告诉你，第一是“现金流”，第二是“现金流”，第三呢？呵呵，你一定猜出来了——对！还是“现金流”！


    你知道希尔顿是如何开始他的酒店生意的吗？你知道顺驰的孙宏斌是如何实现快速扩张的吗？他们共同的特点，就是“化整为零、分期支付，并最大化降低第一次支付金额，甚至实现零成本收购，然后借钱理事”。


    几乎所有资本玩家都是“现金流”运筹的高手。胡雪岩的投资之术就是：八个锅七个盖，盖来盖去不穿帮！说白点，就是“现金流腾挪术”！


    “现金流为王”的理念到底如何理解呢？它可以化成以下几个观点：


    无论什么房产，无论计划持有有多大，都要在出手之前，**100%的确定有人替自己埋单**，而不需自己的资金！


    比如，做二房东是一种投资思路，但如果不能肯定租金差为正，就绝对不能出手。


    再如，你看中了一套急于出售的房子，开价很低，地段极好，你非常中意，想低价买入后快速转手赚钱。但 在掏钱之前先且慢，你计算过交易费用了吗？计算过买入 之后持有期的现金压力了吗？你计算过出售时买家可能的
    出价了吗？如果你只想长持有靠出租获益，那你计算过 投资年限及回报率了吗？如果你聪明了，想向银行进行抵 押套现，那 你计算过租金与月还款额之间的差额了吗？如
    果你是转按揭得来的，那你问清楚手续费多少了吗？


    呵呵，如果你是新手，可能看到这些问题就已经头晕 了吧？其实不用烦，这些东西都非常容易理解，只需要你 接着往下看！


    所以，一定要记住，最好把它写到书桌前，天天提醒 自己：任何潜在的开销都可能成为“炸弹”，确保安全的唯 一方法，就是“宁可看错一千，也绝不放过一个！”


    # （2）先找人埋单，再投资房产！


    房地产投资最大的风险就是资金风险，即所谓的“流动性陷阱”——资金压在房产上面，无法正常流转。钱要流动起来才能赚钱；但靠自己的钱一点点流动来赚钱，速度当然要比本金啊，靠别人来替你免费投资！资金流动就快，风险就小；本金越多，收益就越大。


    度也太慢了。所以要“借钱生钱”！借别人的钱来进入自己的流动增值河道。


    比如，一栋转租房产，每个月扣除交给上家的钱，还剩 100 元！要不要投资？


    仅 100 元，听起来好像很少；但如果，你给上家是“一押一租，月租 600”；给下家的是“两押一租，月租 700”；那你实际床上是“零成本”换来的 100
    元收入；那你的投资收益率就是 100 ÷ 0 ≈ ∞（“无限大”）；


    你可能还觉得 100 元太少！还不如出售房产来得多，那我们一起算个账：假如你拥有 4 处这样的“无限大”收益率的房产，一个月收益共计 400 元；则一年按
    10 个月出租，收益可以计算为 4000 元。这 4000 元是净收益，而且所需要辅助工作并不多。


    更重要的是，这样的房产为数众多，很容易找到并投资，最适合初学者入门。等你渐渐积累了经验与人脉，自然知道如何去玩收益更大的房产；而所需要的“钱”，当然是向别人“借”来的！


    上面的例子只是告诉你如何借“租客”的钱！在后面的课程里，你还会学到如何借“卖家”的钱、借“银行”的钱、借“买家”的钱、借“信贷贷款公司”的钱…… “借”——是一个非常非常有价值的学问！玩好它，你会发现无穷的投资机会。


    # （3）资金稳健大过天


    任何房产都可能是好的机会，任何房产也都可能是陷阱，机会与陷阱的最大区别就是“融资方式”。假如有一套房子，位置也好、景观也好、交通条件一流，而且价格比同类房便宜
    20%！我问你，要不要出手？


    呵呵，答案很简单！是否出手，取决于“融资结果”！如果房主愿意接受低首付的分期付款，而且月均还款低于出租收益！那就可以考虑，相反，如果只能靠快速转售才能获利，就要加倍小心！


    因为房子平均销售周期是 4 个月，20%的价差也不意味着能吸引其他买家“当场拿钱”！房产销售过程中，永远有意外：想靠“一不怕苦，二不怕死”的革命精神卖房，最终的结果很可能就是“壮烈牺牲”——呵呵，墨菲定律害死人呀！


    > 事情如果有变坏的可能，不管这种可能性有多小，它总会发生。

    > ——墨菲定律


    所以，在投资之前，如果还不能以 95% 的概率肯定现金流是稳健而安全的，就千万不能贸然行动！


    记往一句话——房产们用多少惨痛的教训换来的——富资者口中求！“成功学家”们所宣讲的“超速成功”常常是海市蜃楼，看似美丽却远在天边。


    # 第二课 “黄金护甲”——立于不败之地的投资策略


    # （4）流动速度比利润率更重要


    你一定听过“复利是财富的秘密”的说法吧？“复利”理论常常给我们的结论就是“时间越长，收益越大”！


    这一点，我们绝对同意！但要补充一点，“复利”理论不仅是说“一个月存 1000，十年成百万富翁”之类的内容，还有一个小秘密：就是“缩短滚动周期”会更快见效。


    “复利”理论里有一个“72 法则”，就是以 1% 的复利来计息，经过 72 年以后，你的本金就会变成原来的一倍。这个公式好用的地方在于它以一推十，例如：利用
    5% 年报酬率的投资工具，经过 14.4 年(即 72÷5)本金就会变成一倍；利用 12% 的投资工具，则要六年左右(72÷12)，你才能让一块钱变成二块钱。因此，今天如果你手中有一百万，运用了年报酬率
    15% 的投资工具，你可以很快便知道，经过约 4.8 年，你的 100 万元就会变成 200 万元。


    那么，如果你投资房产 10000 元，三个月的净收益 1000 元，则年收益率为 40%(三个月收益率为 1000÷10000 =10%，则年收益率为 10%×4=40%)，则
    72÷40=1.8 年，就是说 22 个月就翻番。


    如果你将资金由三个月收回 1000 元，变成二个月就收 1000 元，那么你的年收益率就是 60%，则 15 个月就翻番。


    所以，在你的房产投资中，与其追求高额回报，不如追求“快速”回报！使你的钱周转更多次，流动得更快速！

