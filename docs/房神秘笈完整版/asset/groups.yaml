    但如果 3 年后房屋贬值的话，你承受的压力将倍增：因为你很可能等不到弥补这个“负现金流”的一天，就急着出售了。只有每个月的现金流都为正，可以真正实现“以租养贷”时，你才能“稳坐钓鱼台”，平心静气地持有房产直到可以获利的时候。


    任何时候，都不能拿投资当“赌博”。宁可高估风险，也绝不能高估收益。从这种角度来看，投资者选择“以租代售”无疑是非常明智的。


    而且，根据经验统计，有三分之二的“以租代售”的买家最后会因为种种原因（如贷不到款、筹集不到首付、有了更好的选择等）不会补齐差价，购买该房产；这就意味着有很大的可能是，投资者最后既获得了高租金，又保留了房产。


    ### （2）寻找买家更容易，保持资金流动性


    普通的房产，如果不是在价格上有很大的优惠，其销售的速度都不会很快，基本在 3 个月左右。对于投资者而言，时间就是金钱；如果资金积压在某处房产上，那么销售每耽误一个月，就会损失一个月的租金收入，甚至还要白白负担房贷还款支出；此外，还有日常维护等隐性开销。


    总之，普通的销售交易很容易把投资者困入资金流动性陷阱——这不是明智投资者的应该选择。


    反之，“出租比出售容易”——这是尽人皆知的道理。由于无需买家一次性支付太高首付款，虽然月租稍高，但基本都容易被接受。“以租代售”对买家造成的“后悔成本”相当的底，使买家更容易做出“选择”。


    更重要的是，真正理解“以租代售”威力的房东很少；普通的卖房者，只图一次性获得房款的“快捷”，所以 99% 的都选择了直接出售。


    因此，提供“以租代售”模式的房产就显得“凤毛麟角”——想要“少花钱”的买房人多，支持“少花钱”方案的房东少——“资源稀缺性”导致买家之间必然出现竞购现象。


    所以，“以租代售”会帮助投资者快速找到买家，借助买家的资金来还贷，从而保证自有资金的有效流动及潜在风险的规避。


    ### （3）房产管理起来省心省力


    采取“以租代售”要 3~5 年时间才能获利，乍看起来似乎时间过长，不如直接销售快速。实际上这种直接比较“时间长短”的做法，是非常简短的。更有意义的比较标准是“付出的努力”。


    假如你为了快速销售一处房产，花费的时间是：每天 3 个小时，一周工作 5 天，历时 3 个月（12 周）。则你一共为销售而付出的时间成本为：


    $$3 \times 5 \times 12 = 180 \text{（小时）}$$


    而采取“以租代售”，你可能只需要按 3×5（每天 3 小时，每周 5 天）的付出在半个月（即两周）里找到买家，然后每个月交租时联系一下，最后成交时再完成过户手续即可。


    假设每个月花 1 天时间，每天按 3 个小时计算，成交耗时 1 周，则总时间付出为：


    $$3 \times 5 \times 2 + 3 \times 1 \times 12 \times 3 + 3 \times 5 \times 1 =
    153 \text{（小时）}$$


    看到了吧！实际上“以租代售”所花时间并不比直接销售多，甚至很多情况还要短。


    “3 年 ≤ 3 个月”——这个公式成立的秘密在于我们前面的“归尾感”。


    管理出租房产的房东，最头疼的事莫过于“收租”；常常需要打过 N 多次电话，甚至上门催租；而且租客也常常不愿维护房屋内部装修及设施——出租出去就贬值——这是很多房东的另一“痛”；经常是出租一段时间就要重新粉刷维护一次，否则难再招租。


    而“以租代售”就很少存在这样的问题。首先“租客”实际上是“买家”——否则就不会付出更高的“名义租金”来居住；既然是“自己的”，当然要倍加爱护；“未来要买的”——将会极力促使他们爱好护“自己的”房子。


    此外，如果买家不能按时交租，那么根据合同中的违约规定，他们就很可能丧失前面所交纳的所有租金——包括实际租金，也包括预付定金。人们对于将获得的好处常常忽视漠然，却对眼前的损失敏感异常。


    已交纳的预付定金越多，他们就越是受其牵制——所以，“以租代售”存在一个有趣的现象：越到合同后期，“租客”越好相处，越容易“管理”。


    房屋的卫生、装修、墙面等，一般情况下，都无需投资者多加提醒与注意。买家都会自动自觉的维护。甚至，你可以设立一个小小的“维修基金”——即把应缴月租中的一部分做为维修费用，从买家的缴租总额中扣除，借此鼓励他们主动维护房屋。


    所以，如果你的房产有一些缺陷也不要紧，通过“维修基金”的方式，转嫁给买家去搞就好了。


    所以，综上可知，无论从买家来看，还是从卖家角度，“以租代售”都是巧妙而双赢的选择。


    说它是“百万富翁”的印钞机，也并不为过——在欧美地区，“以租代售”是 90% 的房地产投资富翁的共同选择，它的威力由此可见一斑。


    ### 什么样的房产适合“以租代售”


    “以租代售”是一种销售方式与融资技巧的整合，然而这两点却都不是“以租代售”成功的关键——“找到大多数人愿意买的房子”才是硬道理。


    ### 几层的楼受欢迎


    根据某项调查显示：有 65% 受访者底楼、顶楼不考虑；而仅有 13% 的受访者无所谓。


    为什么人们不愿意选择底层和顶层？如果你自己长期住过这两类房子就明白了。底层易潮，光照及通风都不好；顶层易漏水、受曝晒，上下楼不便；虽说顶楼常常有一个天台，但愿意选择人的还是少数。


    一般楼宇中，底层与顶层都是价格相对便宜的。


    ### 多少年内的房产较好


    有 42% 受访者选择 1996-2000 年的二手房，有 34% 受访者选择 2000 年以后的二手房，有 13% 受访者选择 1991-1995 年的二手房，有
    6% 受访者对建筑年代无要求，有 5% 受访者选择 1985-1990 年的二手房。从数据中可以发现，购房者对十年内二手房的需求相对集中。


    如果考虑“以租代售”的合同期为 3-5 年的缘故，5 年内的房产（即 2000 年以后建成的）最为适宜。


    ### 月供款多少才愿意接受


    数据显示：受访者中有 67% 的购房者选择商业按揭还款。


    从按揭月供款的范围来看，1000 元以上，2500 元以下（1000~1500 元占 18.1%，1500~2000 元占 16.4%），是多数人的心理价位；而“1500
    元以下”的比例占 1.8%。


    对于银行而言，3~5 年的按揭还本付息期是比较恰当的期限，超过 3~5 年以上的还本付息期对于贷款人来说，时间越长，贷款风险越大，同时资金周转率也低，因此
    5 年期以上的商业按揭贷款并不多见。


    对于购房者而言，3~5 年的按揭还本付息期既能满足大部分购房者的还贷能力，同时又能使购房者获得较为优惠的贷款利率及银行服务。


    揭，有 25% 的购房者选择一次性付款，有 8% 的购房者选择分期。受访者中最理想的月供是 1500-3000 元占 67%，其次是 1000-1500 元占
    19.4%。月供在 3000 元以上的占 11.8%，月供在 1000 元以下的占 1.8%。


    所以，投资者应该注意要求的月租款不能高过大多数买家的心理极限。而实际操作中 1500-2500 之间的价位既可以吸引大多数买家，又不至于高于月租太多，是个相对比较合适的价位。


    ### 什么样的户型最受欢迎


    数据显示：购房者最需要的面积范围是 50~90 平方米占 65%，其次是 90~110 平方米以下占 15.6%，50 平方米以下占 5.6%，110~130
    平方米占 9.4%，最后 130 平方米以上的占 4.4%。受访者中有 46% 的购房者选择 2 室 1 厅 1 卫，有 23% 的购房者选择 2 室 2
    厅 1 卫，有 16% 的购房者选择 3 室 1 厅 1 卫，有 8% 的购房者选择 3 室 2 厅 2 卫。


    随着二手房市场进入稳定期，购房者选择二手房在面积和户型上也非常务实，面积在 50~90 平方米，2 房 1 厅 1 卫（2 房 2 厅 1 卫）基本满足自用客户的要求。


    相对升级客户大都选择 110~130 平方米，3 房 2 厅 2 卫的二手房。所以不同类型的客户对面积、户型的差距也将进一步拉大。


    ### 受欢迎的房产特性综合


    经过前面的分析，以租代售比较适合定位于中、下等收入家庭，主要应具备的特点列述如下：


    | 项目 | 要求 |

    | :--- | :--- |

    | 层高 | 非顶楼或底楼 |

    | 年代 | 建成 5 年以内 |

    | 月供款 | 1500~3000 |

    | 户型 | 50~90 的小户型 |


    此外，还要考虑小区物业、附近学校、交通状况、生活配套、治安情况等多种因素。


    在本书《配套计算工具》中的“（1）二手房房价计算器”里，可以帮你综合衡量多种房产评价因素。


    ### 以租代售合同分析


    “以租代售”的合同条款（当然也是两份合同“租赁合同”与“期权合同”的组合）是至关重要的一环，它可以帮投资者将很多潜在的问题都事先扼杀。所以请你一定要认真了解下面的合同要点：


    ### 合同期限


    “以租代售”的期限一般在 3~5 年；这个期限主要是根据买家筹集首付款的时间而定的。


    一处二手房产，买家如果不够现金，就必须通过“二手房按揭贷款”；但是这类贷款首付要求比新房高，年限越长，贷款额度越小。所以，必须控制一个合适的年限，既可以帮助买家储蓄首付款，又便于申请银行借款。


    根据规定，银行至多可以为买家提供 7 成贷款；实际上加上手续费等开销，往往在 6 成左右。这样就需要买家筹集至少 4 成的首付款。


    这 4 成的首付款扣除签订合同时预付的 5%，及 3~5 年的月付定金，还需要买家筹集 2 成左右。正常情况下，如果房价大约为买家 10 年的净收入，基本是可以接受的。所以
    3~5 年的净收入支付 2 成的房价，是基本没有问题的。如果买家超过这个期限还没有筹集 2 成首付，那很可能说明买家不具备买房的条件。再拖延期限，错过了房贷申请可能性，就更没有意义了。


    当然，还有一种可备选的方案：就是由买家采取“转按揭”方式“继承”投资者的贷款，然后由买家直接负责还款。但是这种方案存在一些潜在的问题，比如：


    - 很多银行可以“同行转按揭”，而不允许跨行转；

    - 转按揭的手续费等开支往往较高。


    这些都需要买家慎重处理。


    此外，如果年限过长，那么投资者很可能承受较大的房产升值损失。房产周期一般为 5 年左右，3~5 年常常可以跨越一个房价波动周期的波峰与波谷。超过 5 年，房价的波动将比较显著，实际房价将距离协商房价有一个较大的差异。所以，如果超过
    5 年而投资者还延续协商的房价，对于自己的收益也是非常不利的。


    还有，由于协商房价是没有计息的，所以超过 5 年的合同，会对投资者的售房收益造成较大影响——现在中国每年平均通胀率在 5% 左右，5 年后的通胀将达到 25%，就是说，现在的
    20 万元的房产，按 25% 的通胀率计算，应该于 5 年后变为：


    $$20 \times (1 + 25\%) = 25 \text{（万元）}$$


    虽然实际情况中，房价不能如此简单计算；但合同不超过 5 年是一个底线。


    实际操作中，建议以 3 年至 3 年半为宜。到期的具体时间可以选在春节前后，或元旦前后；因为这些节庆前后，是买房的高峰；如果买家放弃购买，可以很容易地找到新的买家。


    ### 签约时的首付比例


    为什么不可以 在签约时“零首付”呢？


    这是很多投资新手容易糊涂的问题。“零首付”是我们向房东“借房”时的技巧，却绝不能随意应用到买家的交易上。


    国家为什么三令五申禁止零首付？就是因为零首付的房产，会过于依赖银行贷款，可能造成较高的房贷风险。


    投资者也应引以为戒：如果买家连 5% 的首付都拿不出来，你相信他会有持续交付租金的保障能力吗？


    > 特别提醒(据不完全统计)：房地产租赁交易安全常识篇（之篇）

    > 1. 交易前务必核实房主身份、产权证原件。对于“二房东”转租，还应查看其与房主的租赁合同及转租授权书。


    以本课前面的案例来看，首付款为 5%，即 11,500 元。每月租金为 1500 元，一般租金开支不能超过正常收入的 30%，才能保证收支平衡。即该买家月收入应该至少
    5000 元。即首款应该为月收入的 2 倍左右。


    如果买家掏不出 11,500 元，说明他很可能没有 5000 元的稳定月收入，或者说其收支失衡。那也就意味着他很可能无法保证未来每个月 1,500 元的租金支付。


    你愿意把房产租给一个租金很可能超越其收入水平的买家吗？明知他可能会“断租”，你还会坚持跟他签“以租代售”协议吗？


    所以，5% 的首付可以有效地过滤一些不合格的买家，可以阻止投资者犯可能的错误。


    5% 的首付不是绝对的数额，你也可以选择 3%，一般不会高过 10%，否则会极大影响买家的接受程度。比如，房价为 40 万，你就可以只收 3% 的首付，计
    1.2 万。房价为 20 万，可以收 5% 的首付，计 1 万元。


    其额须应“让买家掏得容易，却又费思量”——这是一个很考究细节功夫的经验数值。


    当然，5% 的首付款也是投资者向买家融资的一种渠道。可以免费占用 3~5 年，何乐而不为呢？


    ### 合同可否转让


    “以租代售”与前面介绍的“以租代买”一样，应该是“租赁合同”与“期权合同”的合同包（而不是将二个合同变成一个合同）。


    为了避免可能的风险与麻烦，应该在“租赁合同”注明：


    “未经卖方书面同意，买方不得转租房产或转让本合同给任何第三方。”


    即禁止卖家将房产转租出去，也禁止买家转让“租赁合同”。


    同样，在“期权合同”中也应标明“禁止转让”的字样。


    我们在“以租代买”的操作中，曾经明确提出：“期权合同”要加上“允许转让”的字样。那是因为，我们的主要收益就源于“转让费”收益。


    但是，现在调转身份，我们做为明智的投资者，应该禁止这种行为发生在自己的房产上——因为我们希望吸引到的是真正的买家，而不是另一个“投资者”。


    买家会给我们添财，而投资者会给我们“添乱”。


    ### 违约责任


    违约责任是一项重要制约条款，可以有力地保障我们房产的买家对待交易的态度是“认真而负责”的。


    我们规定：“如果买家在合同到期前（包括到期时）放弃购买，则将失去前面已经交纳的所有首付款及月付定金。租金的押金可以酌情考虑部分退还。”


    这一点对买家形成较强的制约。因为“延期不交租”就是一种“违约事件”——其制裁力量是数倍于普通租方的。


    同理，“破坏房屋设施”，“未经纪方可转租”，“擅自转让合同”……都是“违约”的触发扳机。


    买家受到“违约条款”制约，会认真履行其责任与义务，从而保证投资者的利益。


    此外，还有一些条款，如“期权行权应提前 15 日书面通知”、“买家入住后承担正常的维修责任及相应支出”等条款，也都会帮助投资者消除隐患。


    ### 小 结


    本课是“房神秘笈”的核心部分，详细说明了“以租代售”的操作过程及收益计算。是前面课程的内容的深化，尤其强调了“对买家融资”的细节。


    之所以称之为“百万富翁”的印钞机，是因为：


    - 操作简便，双方洽谈并签订协议即可，无需其他交易方参与；

    - 风险较小：“以租代售”期间，可以收取高额租金弥补货贷支出，持有风险小；并且通过合同提前锁定交易价格，保证售房利益，减少房价波动风险。

    - 收益较高：无论是租金收益，还是售房收益，都较其他方式有一定优势。

    - 管理轻松：买家会比普通租客更加爱惜该房产，所以会减轻大量的维护工作。


    当然，满足这种“以租代售”要求的房产，必须是经过“精挑细选”的，要在“户型、年限”等方面提前考虑。


    # “炼金术”综述


    至此，我们已经用三课篇幅全面介绍了“炼金术”的操作过程。做为“快车道”投资技术，“炼金术”以“房产”为“炼金炉”，实现了“石头”（低投入）到“黄金”（高回报）的神奇变化。


    ### “炼金术”速览


    ![](img/acb46489adfd772451884bb9efeed060_196_0.png)


    钱不会从天而降，却实实在在可以从“房子”里面“长”出来。因为我们“播种”（购入）了房产，所以“房东”、“贷款机构”、“买家”就会帮我们收获“黄金”，向我们支付“报酬”。


    ### 转按买房——房东为我们“付酬”


    寻找背负“房债”的房东，是我们的首要责任。因为

    '
