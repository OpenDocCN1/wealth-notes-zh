    这样 M 首付 11.8 万，加上贷款 18.2 万，一次性支付给房 P 的款项共计 30 万。


    银行贷给他 15 年，年利率为 6.84%，则每个月要归还的金额为 1,619.63 元。


    然后 M 以房产 P 做为资信证明，申请信用贷款 5 万，两年期利率共计 15.8%（则年利率为 7.9%），等额本息归还，每个月需还款 2412.50 元。


    则前两年每个月还款合计 4032.13，约计为 4000 元。两年后，每个月还款仅为 1,619.63 元。


    该房产月租金 2400 元，M 采取“以租代售”模式，找到买家 L，约定 5 年后房价为 35 万，并当期向 L 收取 5% 的首付，即为 17,500 元。初期预付
    3000 元租房押金。每个月收租金 3000 元，其中 800 元作为预付数，可用于 5 年后买房。


    这样，M 在这 5 年里的收支情况为：


    表 10-1 M 的 5 年收支情况计算表


    | 项目 | 收入 | 支出 |

    | :--- | :--- | :--- |

    | 初期 | | |

