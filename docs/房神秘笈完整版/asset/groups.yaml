    ## 第十一课 以租代售——百万富翁的印钞机


    在前面的课程里，我们简单介绍了“以租代售”的操作方法。可能看到前面的案例时，你会一面为高额的收益而激动，另一方面也在心中质疑：为什么买家会接受这种“以租代售”的方案，从而将大笔资金付给投资者呢？


    这里就有必要详细介绍一下“以租代售”的原理及操作细节——这一部分非常重要，因为它将是你长期、巨额财富的聚宝盆。


    如果说“慢车道”里的“以租代买”是“现金蓄水池”的话，那么“快车道”里的“以租代售”就是“现金海洋”。这两种投资思路的收益完全不是同一个数量级。


    “以租代售”与“以租代买”只差一个字，它们不仅在理解角度上不同，二者的操作手法也存在较大区别。举例来看这种方式的具体操作原理。


    ### “以租代售”案例


    投资者U以200,000元价格购入一处房产，该房产中等装修，前房东留下了全部家具及家电；U申请的10年按揭贷款为12万、年利率为6.84%（现在大多数银行根据0.85的下限倍数采取5.814%的实际年利率，本案例为简单起见，仍采取6.84%。但道理是一样的）。该房产所在地段同类房屋的


    ![](img/acb46489adfd772451884bb9efeed060_175_0.png)


    平均月租为 1200 元。U 采取 “以租代售” 模式，与买家 T 达成协议：新房租为 1500 元（即名义租金），其中 500 元作为以后购房款的预付定金。协议有效期为
    3 年，约定 3 年后购买房价为 23 万，签订协议时，交纳购房 5% 的首付款，即 11,500 元，外加一个月的租房押金 1500 元。


    并同时约定：不满意可以随时搬走，但所付的 5%首付及名义租金不能退还。


    我们通过下图来观察一下 “以租代售” 操作中，“租金” 的组成变化情况。


    ![](img/acb46489adfd772451884bb9efeed060_176_0.png)


    图 11-1 “以租代售” 租金变化情况


    ### 难以抗拒的诱惑——对买家的 5 大好处


    “以租代售” 对那些现在无法一次性付清全款（或是首付款）、却想 “自有住房” 的买家，具有很强的诱惑力，因为这种灵活的融资方式，可以解决他们很多现存的困难，同时避免了很多其他解决方案的麻烦：


    > 为感谢您的本次购买，房产团队特别免费赠送《超魅力自动赚钱机》一书给您，该书揭示了由我们首创的、具有轰动性的赚钱技术。


    #### （1）无需高额首付，即可立即入住


    “首付”是很多买房人的痛，很多人坚持若干年的“省吃俭用”，就是为了积蓄首付款，以便可以入住自己的家。尤其是很多刚入职3~4年的普通白领，他们可能有稳定的收入，可以支付月供，却由于首付款不够，也无法圆自己的“家园梦”，甚至影响到了结婚生子。


    而这种“以租代售”的方式，虽然暂时挂以“租”的外壳，其实卖却是“买”为导向。一方面，买家可以及时入住；另一方面，却是真正拥有了“家”的归属感。


    这种方式的首付只有5%，即11,500元，相比于普通房贷首付20%来讲（23万的房产，首付20%就需要46,000元），大大降低“买”的门槛，可以吸引大把“无首付、有月供”的年轻人。


    #### （2）月供不高，容易承受


    名义租金1500虽然高于市场租金1200，却往往低于正常货款的月供——23万的房子，即使可以向银行贷到7成10年贷款，按5.814%的贷款利率（6.84%的利率，浮动0.85倍后）计算，每个月也要还款1,772.43元^16。因此，名义租金对买家造成的经济压力要小。


    同时，虽然“以租代售”的名义租金比市场租金要高出25%左右，但由于其中的三分之一可用于最后购买时扣减房价，所以其实际租金 1000 要比市场租金 1200
    要低。所以，实际上买家付出了较少的租金，就住到了喜欢的房产。


    > ⑵可以在EXCEL中使用公式“=PMT(5.814%*1.2/10*12, 230000*0.7)”快速计算器得出。


    为该集团出本本购买，房屋正式购买价格就为“总租金－最后扣减的1/3租金”，该比例显示了购买者购买房产权益，可自动转为购房贷款本


    #### （3）预付定金可以起到“强制储蓄”作用


    很多缺钱付首期款的年轻人往往不是因为月薪太低，而是因为开销太大。不成熟的消费习惯与给付家用等支出，导致了“月光族”的队伍逐渐庞大。


    所以，每个月的“预付定金”500 元的支出，相当于强制这些“月光族”储蓄购房款。500 元对他们的压力不大，却可以在 3 年后购房时积少成多，变为 18000。好像公积金的作用一样，变成对他们未来的一种保障。


    #### （4）免除装修、家具购置等开销，直接进行试住体验


    由于是“二手房”，所以买家往往不必再出钱装修，甚至很多情况下，不必再购置大件的家具、家电。这本身就是一种可观的费用节省。


    同时，由于具有“不满意可以随时搬走”的条款，买家可以抱着“试住”的轻松心情来体验实际的居住效果。不满意就以较低的代价离开——即失去了前面所交纳的所有款项。但这种成本，也远低于真正购入一间不满意的房产所造成的损失。


    “以租代售”相当于“先住后买”，充分保障了买家的自身利益，降低了“后悔成本”。


    #### （5）心理归属感完全不同


    “这房是我租的”和“这房是我自己的”——这代表了两种完全不同的“表达”语境。有过两年以上租房经历的人，绝大部分都对“租房”有苦难言，对于“买房”则热切期待。


    不仅是因为租房的舒适性差，更重要的是没有“归属感，常常“任其破烂”。"反正也是租的"这种心理会导致租房内部环境的恶性循环。


    而“以租代售”则打破了“租”与“买”之间的分水岭，使买家从心理开始“认同”房产——毕竟，这将成为他们未来自己的家。


    所以，“这房是我自己的”将导致买家愿意认真维护房屋，甚至心花思布置、整理。


    此外，家庭生活很大程度上与房产相关；所以，心理有归属感的房产会对家庭和睦产生不可忽视的影响。


    ### 印钞机的威力——对投资者的 3 大益处


    对投资者来说，无论是收益、灵活性、便利几个方面来看，“以租代售”的好处都是显而易见的。


    #### （1）收益高、风险低


