    ### 租金调整


    另一项影响现金流的重要数据就是“名义租金”（即包括实际租金与预付定金的租金）。它与“信用贷款”不同的地方在于：还要受市场租金及买家支付能力影响；而不仅是调整数据的事。


    主要应该通过与买家的谈判达到一致意见才行。对于投资者来说，当然是名义租金越高越好。但一定要以保证买家支付能力为前提。一般以不超过正常租金的1/4为宜。


    ### 总体变化规律


    这里面有几个总体的变化规律，应该引起重视，作为调整数据的重要参考。


    ![](img/acb46489adfd772451884bb9efeed060_171_0.png)


    如上面两图所示，可以得出以下规律：


    - 信用贷款与收益额成反向增长。即信用贷款越多，则它吞蚀的利息越多，所以留给投资者的收益越少。

    - 借有贷款与收益率成同向增长。即信用贷款越多，投资自有资金就越少，所以收益率也相对增加。


    综上，我们可以得出的融资预算总体思路：


    1. 首先要保证每个月现金流状况的稳健：即使可以忍受出现负值，也不能超出太多；

    2. 在满足（1）的前提下，尽量增加信用贷款，减少自有资金，增加收益率。虽然减少自有资金投入会降低最终的收益额；但是在投资中，初始自有资金投入越少，越可以降低风险，增加投资的灵活性。

    3. 把自有资金分散投资于若干不同类型的房产，远比都投于一处安全得多。

    4. 房产“存钱增值”效果虽然好，但一定要注意保留一部分现金的流动性，用于投资中应急；因为房产的变现速度很笨，不能太追求“房产净值”效应。


    ### 小结


    本课为“房神秘笈”的核心章节，充分展示了“融资绝技”的思路与预算过程。涉及了较多的数据分析与报表比较。


    借助“配套计算工具”，你可以完成以下分析：


    - 银行贷款：利率低、周期长。是贷款的首选。

    - 信用贷款：无需担保，但利率高、周期短。

    - 买家借款：金额小，无利率。而且可以转嫁还贷支出。


    所以“三方融资”的重点，就是根据投资者的风险偏好、收益率及投资额度，来预算“三方融资”的比例及金额。


    除本课所介绍的“三方融资”技巧外，还有很多融资渠道可资利用。但无论什么渠道，其基本思路都是类似的，就是“尽量借钱投资”，然后“找人替你还钱”。


    当你明白这种思路后，就可以很容易看懂很多企业的资本运营逻辑——借鸡下蛋，夹蛋养鸡。


