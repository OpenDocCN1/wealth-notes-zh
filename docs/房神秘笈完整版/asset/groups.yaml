    # 向租客要钱——如何筛选并管理租客


    找到合适的租客，是你“顺心、安心、省心”赚租金的关键，它决定了你出租成败的 90%。


    ## 快速筛选好租客


    你发出广告后，会很快有很多人要求看房，此时你一定要安排集中看房，以便突出“抢手”的竞争气氛。并要求看房人当场填一份简单的联系信息表——这里面有一个重要的关键信息栏，即“联系者”及“联系电话”。


    你应该要求看房人填写至少两个联系人：同事或是以前租房的房东。如果他们问起为什么要填这一项，就说这

    '
  mdcn: '

    ## （1）便于转让


    由于双方是债权债务关系。F是有权利，无义务；G是有义务，没权利。所以，从法律规定来看，F可以不经过G同意，而转让该“期权”（债权）给第三方——有点类似于银行出售“不良资产”的做法。当然，最接近“期货买卖”操作。这就为F后面的“转让期权赚差价”埋下最有利的一笔。


    ## （2）简洁易懂


    相对于其他房屋买卖合同，动辄三、四十条，几十页纸的规模：期权协议只要说明关键要点即可，一页纸内 500 字左右即可覆盖全部条款。非常便于购房方的交流及协商。可以帮助投资者快速完成谈判、快速锁定房产。


    ## （3）投入较低


    房屋买卖合同的规定规模基本都在 5000 以上乃至上万，会对投资者造成较大风险与压力；而期权合同则无此弊端。与“租赁合同”配套，以租金加押金的形式抵扣期权费（相当于定金），一般不会超过租金的
    2 倍。远低于买房定金的投入。低额定金很快又可以 从“租客”身上取回，所以直接降低了投资者的风险，并有效地保障了“零成本”锁定房产的目标实现。


    ## 特殊条款——巧拟语言胜在先


    虽然“期权合同”好处明显，但由于在国内房地产投资领域里，很少有人对它熟悉、甚至精通，所以，一定要小心它应用在房地产投资时的特殊条款：


    ### （1）转让条款


    > 任何一方向遗产继承人、私人代理和其他受让人所做的关于本协议的转让，都无需另一方同意而生效，并具有法律效力。


    虽然期权协议在本质上，F是无需G同意即可转让的，但为安全起见，强烈建议加上这句话。这句话从逻辑上讲，G与F都可以转让本协议。但是实际上，由于G是房东（“债务人”），别人是无法以“房东身份”替他履行“期权”义务的，所以G是无法转让协议的；除非G死亡，房产由其他人继承。所以，这句话真正的受益者是F。


    作为聪明的投资者，如果你直接表达出自己的“转让”意愿可能引起不必要的麻烦；更巧妙的解决办法是，你可以这样对房东说：


    “如果可能出现意外，这句话就可以保障本协议由您的继承人承担履行义务。”


    这种解释是合情合理的，房东一般不会提出异议。


    小小一句话，就可以帮你开启财富之门。


    如果事后房东反悔，而不与新买家签订正式购买合同的话，你直接起诉，要求相应的违约金及赔偿金就好了。


    ### （2）逃跑条款


    > 本协议的效力受乙方合作者对房产检查的影响。


    看似简单的一句话，却可以起到巨大的“逃跑”作用。包括购买权、优先权、分期付款、贷款担保、贷款条件、贷款期限等。


    ## 次序讲解


    如果在期权协议规定的时间内，你无法找到新买家，你也可以找个“挑毛病的合作者”，帮你把“期权费”要回来。


    当然，如果你使用的是“以租代买”的模式的话，那些所谓的“期权费”（即定金）其实是“已交租金里可用于抵扣房款的部分”。


    也就是说，“期权费”本来是“羊毛出在租客身上”，并不是投资者的“羊毛”。所以，即使房东最后不同意加上这条，也不会对投资者造成较大的风险。


    ### （3）协议展期


    支付追加期权费______元后，期权权主在此赋予期权买主将上述期权展期______的权利。


    谁也不能保证你可以在期权期内一定能找到买家，所以，在期权合同中给自己留个“续期”的条款，就至关重要。


    ### （4）用租金支付购买款项


    双方均同意承租人按照此处所附租赁合同支付的租金中的百分之____的部分可以用来支付购房款项。


    这是期权合同的“中央芯片”，因为它规定了你每月所交款中，有多少可以作为房价的“预扣”部分。由于你未来通过转让期权时，“预扣”部分可以从买家的出价中“赚回来”，所以它实际上就是你的未来转让收益。


    一般操作中，如果房东急于转手房产，你可以与他商量“房租全部用于抵扣房价”；但是这种情况时，房东往往不愿意跟你签订太长的 “以租代买”的期限（一般不会超过 1
    年）。所以，你为了换取较长的 “期权” 期限，可以在 “抵扣比例” 上做一些让步；将租金的 30%~50%作为未来的房款抵扣，是相对比较合适的。但关键还在于你的谈判策略。


    一般情况下，30%用于抵扣，配合 3 年的期权——是一个大家都可以接受的折衷方案。


    ### （5）期权执行


    > 承租人拥有上述价格及条款优先购买房产的权利，发出书面通知 30 天后，执行期权。


    期权的执行就比较简单了，只要找到买家，协同他一起与房东签订一份 《房屋买卖合同》 即可。


    ## 小结


    本课介绍了 “双重合同” 的主要条款，尤其是 “期权合同” 的要素，以本课为蓝本，你很容易写出自己的 “双重合同”——实际交易前，最好请律师再帮你拟定一份具体的合同，几百元的投资绝对超值。


    最后再强调一下应注意的细节：


    ### ①租赁合同


    -   交租的时间缓冲；

    -   入住前费用结算；

    -   入住后可以装修；

    -   转租权利。


    ### ②期权协议


    -   可自由转让；

    -   逃跑条款；

    -   可展期；

    -   租金支付房款。


    与房东签订合同后，你就要开始了“零成本”持有房产之旅，但“零成本”是靠智慧实现的，因为“出租房产”绝对不简单。


    # 第七课 出租管理——如何既轻松又赚钱


    通过“双重合同”锁定房产，获得收益权利之后，你的“万里长征”不过刚刚 开始，如何巧妙出租，避免麻烦，才是“钱途”大计。


    “房产”是你的“商品”；“租客”是你的消费者；赚取最大利润的方法就是：提升房产价值，吸引优良租客。


    要使房产升值，事先要明确房产的目标消费者定位，然后“量体裁衣”，针对租客来“升级”。然后再有的放矢地吸引并管理租客。


    这是一个讲究技巧的“系统工程”，需要精心的安排与筹划，并不断总结经验——因为“出租管理”将耗费你大量的时间与精力。


    简言之，就是“向房 产要钱”、“好营销”、“向租客要钱”这三个方面。


    ## 向房产要钱——如何升级房产使之增值


    我们与房东签定协议前，一个至关重要的难点必须解决——如何升级房产，使转租后有正现金流。


    因为采取“以租代买”模式时，你所要支付的房租往往比正常价格高出10%~20%，作为吸引房东的“鱼饵”；


    如果你不能使该房升级，通过转租来“以租养租”，那你就无法实现真正的现金流——“升级”决定成败！


    ### 升级大法汇总


    这里列举了一些常见的升级方法：


    #### 出租房升级大法


    ##### 一、装修升级


    装修是最基本的，也是最常见的升级方式。这个大家都知道的，就不多说了。


    ##### 二、空间升级


    就是以大变小，或者以小变大，或者以多变少，或者以少变多。比如说，将厅也改造成房间，或者将一个大房间分割成两个房间。当然，反其道而行之，也可以看看是不是可以拆掉墙，获取更宽大的面积。


    常常有些户型比较奇怪，普通人不喜欢。但是经过升级，却能够增加出租的收益。甚至可以看看是不是可以隔成上下层式的。有些住宅室内净高也是非常高的，隔成上下层的，直接当商铺，也不失为一种升值方式。


    ##### 三、功能升级


    一般人投资房产都是住宅型投资，因为商业地产需要的知识更多，但商业地产能够赚到更多的钱。将房子升级一下，出租给商人、公司或办公，收益肯定比较高。而一些小公司也是喜欢租这样的房子的，办公成本肯定用低。


    ##### 四、规模升级


    一些二线城市通常没有像北京、上海、广州这些大城市所谓的商业区。它们遍地皆商业，遍城皆住宅。高层楼通常是底层做生意，当店铺，商场，第二层以上就开始住人了。如果能够在繁华地段物色这种地产，在第二层一起搞定所有住户，与底层一起出租给比较大的商业公司，比如大的书店、商场等等，那就发大财了。


    ##### 五、房客升级


    有个投资人在海边花大价钱搞了一个别墅，然后私底下将几个房隔成了酒店一样的布置，请了个管理员，然后出租给游客。游客都是想花钱的，钞票有的多。虽然租期短，但租金比住宅高得惊人，却也比正式酒店低很多。这个人还花了很多心思，在晚上搞些什么情趣派对、杀人游戏、恐怖体验之类的，以至于都有点名气了，口碑相传，要租到这个别墅还需要预订。


    ##### 六、服务升级


    对房客提供更高的服务。比如提供洗衣服务、开通宽带、闭路电视等，可以根据租客的需要按项计费。


    ##### 七、时间升级


    把出租的时间单位进行变更，以适合不同的需要。比如在学址附近的房产可以为参加寒、暑假培训的学生，提供“半月租”、“一周五”等。短租公寓与此类似。


    上述介绍了一些升级方法，下面详细介绍最常用而且效果最突出的技巧。


    ## 空间分隔——房产“繁殖”法


    房产要出租到更多的租金，最直接的方法就是“分隔出租”——以大幅提高空间利用率；使房产“繁殖”出更多的可出租空间。


    要始终记住，房产是一个“挡风遮雨、休养生息的空间”——人们是按照其使用空间来主要计费的，所以提高空间利用率是最直接的“升值”手段。


    最容易出租的房产往往是一室一厅一卫，具备基本居住功能的小户型——因为其满足了租客的基本需要，而且经济实惠。


    所以，如果你可以找到“多室多卫”的中、大户型房产，就可以把它分隔成若干个“小户型”，从而实现租金翻倍。


    同地段的房产，“三室两厅两卫”户型的出租价常常仅比“一室一厅一卫”的高出30%~40%；比如，一间50平米的可以租到700元，则100平米的一般只为900元。


    如果你可以将100平米的分离成两户小户型（各带一个卫生间），则每间小户型可以获得700的租金，这样总共为1400元，就比900元升值了55%。


    你每月付给房东1000元租金，则每月可以获得400元的正现金流。


    如果你有一个搞装修的朋友帮忙的话，实际上你并不需要支付太多钱就可以做到这种效果。


    我们通过案例来分析这种“空间分隔”的设计方法。请看下图。该图为某“三房两厅两卫”格局（其中两厅相连成为一个超级大厅）。为简化起见，并没有标注具体的尺寸。


    分隔后的效果图也直接列示后面。（红虚线表示后加上的）


    ![](img/acb46489adfd772451884bb9efeed060_107_0.png)


    图 7-1 某房产平面图


    我们采取的分隔设计为下图所示：


    ![](img/acb46489adfd772451884bb9efeed060_107_1.png)


    图 7-2 分隔设计平面图


    那么我们根据以下原则来设计 “分隔” 方案：


    -   每个 “小单元” 必须有一个卫生间；

    -   每个 “小单元” 必须有一个阳台；

    -   每个 “小单元” 最好有两间房；

    -   每间房必须都有窗；

    -   每个 “小单元” 尽量留出公共活动空间。


    该户型是以 “切割客厅” 为主要思路的：分隔后，由一个单元变成了两个 “小户型”，租金当然有大幅增加了。


    你也可以根据实际情况采取多种分隔方法，前提就是要满足上面的 “分隔” 原则。


    ## 寄宿公寓——租客 “降级” 法


    如果你问： “我一分钱也不想投入，可否空间升级？”


    呵呵，当然可以；要不然，我们怎么称之为 “零成本持有” 呢？想不多花钱，就要在管理房客上多花时间。


    就是指把每间可用厅室都尽量当作 “单间”，分别出租给不同的房客，众多房客共用卫生间、阳台、厨房、客厅等设施。


    这是另一种 “分隔出租”。不想通过 “改动房产” 来吸引普通的租客，就很可能需要 “改变定位” 来吸引不一样的租客，常常是 “单身房客”，最理想的就是学生。


    **“小型型”** 的“多间单位长租、喜欢有一定私密空间与生活配套”的普通租客——这类需求为数众多，时间稳定，素质中等，管理工作中适中。


    而“单间分租”型出租房，面对的主要是“需要基本休息空间，不在意生活私密，最看低租价”的这种层次人群——这类租客为数也多，但时间不稳定，素质偏低。需要投资者付出较多的时间与精力。


    每个单间的基本配备：


    -   一张双人床（包括床架、弹簧床垫和垫子）。单人床一般不太受欢迎，所以除非房间特别小。通常应该选双人床。

    -   窗帘。窗户上必须要窗帘能起到隔离和保护隐私的作用。

    -   床头柜。

    -   带镜子的梳妆台。或者也可以放一个衣橱，再在墙上挂面镜子。

    -   台灯。如果天花板上没有照明设施的话，你必须提供。

    -   坐椅。如果空间允许的话，提供一张舒服的椅子，最好木质，不易损坏。

    -   在公共区准备一些简易的椅子、几个小桌子。或许还需要再准备一台二寸电视。你还应该考虑是否在那里安一部公用电话。当然要打卡的那种。


    寄宿公寓里，较理想的出租对象是：


    -   （1）找到某间公司来承租，然后公司安排员工们统一住到里面。这样付款、管理等相对方便。房客们彼此熟悉也生活方便。

    -   （2）找到一群相识的房客，比如是几个朋友相约合租，这样也可以生活中相互照顾。管理起来也方便许多。

    -   （3）出租给在校学生——尤其是大学生。学生素质较高，便于管理，而且生活要求不高，价格实惠即可。

    -   （4）出租给几个女性房客：当然一定要做正经职业的。


    否则你就会“麻烦不断”啦！


    再强调一点，每个单间一定要有窗——因为通风及采光是非常重要的“卧室”要求，如果空间封闭、空气闭塞，可能会出现一些人身意外，所以千万别因小失大。因杂物间之类的绝不能做单间。


    建议投资者首先尝试“寄宿公寓”的形式，以低成本启动“出租”：既可以降低风险，又可以快速学到大量的经验。更关键的是，“寄宿公寓”的出租率一般比“小型型”的要高，流动性强；整体的租金收益比较有保障。


    当然，“寄宿公寓”也意味着你要付出更多的时间与精力去管理，尤其是“麻烦”也会更多——要想减少麻烦，就要学习如何“吸引并留住好的租客”。


    # 好营销——如何吸引潜在租客


    不同层次的租客对房产有不同的要求，但基本可以定为 “40：30：20：10” 这样的比例：即地段占 40%，租金 高低占 30%，房产配置 20%，与房东关系好坏占
    10%。


    当你选好房产后，地段就已经无法改变；所以重点应 放在定价及房产改善上。


    无论你采取分离出租还是设施增值等策略，快速租出 去的秘诀都是 “价格优势”——由于租客的选择往往是较 多的，所以最核心的比较指标就是 “价格”。


    注意，“价格比较” 的潜台词是：同等条件下，你的 价格一定要 “超值”；而不是 “超低”。


    ### （1）增值化包装


    什么叫 “超值” 呢？就是说你把很多租客在意的利益 点组合起来，使租客感觉所付的租金同所得到的回报相比， 完全是 “物超所值”。


    比如，常用的 “增值方法” 有：


    -   定期清洗服务：雇佣兼职工来定期清洗衣服、被 单等。

    -   租金奖励计划：租满一年，奖励一个月租金等值 的物品、或是退还一个月租金等。


    这些方案并不会耗费多少钱，却可以取得良好增值印 象。此时你再索取市场标准的租金时，租客就会觉得 “物美价廉”。


    ### （2）尾数定价


    经过大量的市场分析与经验总结，我们发现5与8是最好的价格尾数——这一条通行于众多消费领域。如果市场价格是整数的话，建议你把它实际租金减去一些。使之变成5、8为尾数的定价。对租客的影响是立竿见影的。


    比如市场租金为“600元/月”，我们建议你定价为“580元/月”。20元钱并不多，但对于潜在租客的心理吸纳很明显。因为他会认为你的租金是“500元区间”的，而不是“600元区间”的，中间的差距很有诱惑力。


    如果市场租金为“850元/月”，你可以定为“820元/月”——道理是一样的。


    ### （3）宣传到位——利用互联网


    这一点是很多出租方最容易忽略的要素。大部分租客不愿意找中介，就是因为不愿意多给一个月租金。所以他们寻找租房信息就大多只能靠互联网。


    但是房东们提供的出租信息往往都非常简单，只包括了位置、大小、租金、交通等基本信息——这是一个严重的失误。


    要知道，其实租客要找到一处称心满意的出租房是很辛苦又费时的，他们往往要跑很多地方，时间成本与路费累加都不小。


    房东可以提供最简单而且增值的方法就是“宣传增值”——80%的租客并不会在同类地区看过多处房产后才做决定，因此他们对于房产“性价比”的鉴定能力并不强。更多的是靠有限的现场观察来决定是否租房。


    而现场观察的前提是得到房产的初步信息并简单过滤。所以你提供的房产信息越多、越详细，越有可能被潜在租客选中。


    而互联网房产类信息网站无疑是双方信息匹配的最快捷、最便宜的渠道。


    “宣传到位”的做法很多，比如：


    -   卖点组合：提炼房产的几个卖点，提供详细的说明会对租客带来的好处

    -   提供相片：为房产拍照，然后上传免费的网上博客或相关系统中。并把该网址贴到“房产信息发布”中。

    -   “促销”信息：设定一个时限，比如1个星期；在该时段内租房可以享受某某优惠。


    营销学上有一种术语叫“整合营销”，我们吸引租客也要“整合宣传”。把“增值服务”、“尾数定价”、“网络宣传”都组合起来，从而产生“1+1>1.3”的整体效果。


    请看下例，总结一下它的特点及吸引人之处：


