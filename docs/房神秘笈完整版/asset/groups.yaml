    # 融资增值


    如果你可以帮助现金不足的买家买入房产，那么你就可以按高于市场价值的价格出售“房产”——因为你通过“帮助融资”，而使房产实现了“增值”。


    比如，你找到一处市场价值 30 万的房产，通过“以租代售”持有三年。当转让合同时，你可以市价出售该“房产”，即 30 万。而买家最多一次性拿出 20 万，还差
    10 万元。你为买家提供“过桥”担保，通过融资公司向买家提供 12 万元贷款，并要求把房价提高到 32 万。等房产过户完成了，将该贷款的担保转为“房产担保”。


    这样，实际上你只不过是作了一个“过渡”作用：买家拥有房产前，是无法提供担保物的，所以无法贷款。买入房产后，就可以把该房产作为担保物来贷款。你就充当这个“过渡”性的担保职责，从而帮助买入得到贷款，支付购房款，购入房产后转由“房产担保”，买家承担日后的还款工作。然后你就可以抽身出来。


    整个操作过程中，你可以完全操控房产的交接过程，可以直接控制风险。其收益却是非常直接。基本上 2-3 个月内就可以赚到几万元，而且买家会心甘情愿。


