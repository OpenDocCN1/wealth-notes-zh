    \ 248\n  - “超魔力自动赚钱机”就在你面前... 259\n\n## 第一课 别无选择，唯有房地产\n\n### 选择比努力更重要——什么是“理想的生意”\n\
    \n无论你是正从事哪一行，无论你正在起点如何，只要你还敢做梦——梦想自己成为有钱人，希望过上富足生活——那么，你就一定要看看《理想的生意》这篇文章。因为，它是我们这么多年一直调整寻梦脚步的标尺，使我们受益无穷。\n\
    \n作者理查德·罗素是一位著名的股评家，但他写的所有股评文章的影响力都比不过这篇谈论如何判定一门生意是否值得做的短文。如今，这篇文章已经被视为微型经典，在西方商业世界被广为传诵和引用。\n\
    \n在文章中他列出了理想生意（或者称为“完美生意”）的 12 大标准，即：\n\n1. 理想的生意，其销售的努力范围应该是全世界。\n2. 理想的生意能够提供一种迎合无弹性需求的产品。\n\
    3. 理想的生意所销售的产品是难于被取代或仿制的。\n4. 理想的生意对劳动力的需求是最小化的。\n5. 理想的生意追求低廉的运营费用。\n6. 理想的生意不需要大的现金支出或设备投资。\n\
    7. 理想的生意喜欢现金结算的方式。\n8. 理想的生意相对较少地受到各种政府和行业的制约和困难。\n9. 理想的生意应易于迁移。\n10. 理想的生意给你带来心智/情感的满足。\n\
    11. 理想的生意能给你更多的自由时间。\n12. 很重要的一点理想的生意不是以付出来衡量收入的。\n\n这是一篇绝妙的文章，可以帮助你省省其身。如果你尝试做过一些行业，那么与上面的12条相对照，你就可以深切感受到“赚钱”的艰难。“选择比努力更重要”，方向错了，即便走得再积极，其旅途也不过是“踉踉跄跄”。相反，选择正确的方向，即使“泛泛之辈”也能很快步入“阳关大道”。\n\
    \n“努力”只是“锦上添花”，却无法“雪中送炭”；“选择”才是打开事业成功之门的金钥匙。\n\n### 其实你不懂这本“神奇天书”——房地产12条神奇密码\n\
    \n从某种角度而言，《理想的生意》其实就是为“房地产投资领域”度身定制的“广告词”，只是99%的人难以读憧其中的隐喻。\n\n我们不懂魔术盒子的奥秘，但是我们可以看到从盒子跳出的“奇迹”。房地产财富富滋容生存，从这个行业里躺起的富豪不计其数。\n\
    \n不必看欧美港台，就看国内：2006 年胡润百富榜正式揭晓，此次排在胡润百富榜前十名的富豪中，有 6 位旗下企业主营业务为房地产，资产总值占前十富豪总资产的50%以上。\n\
    \n> 富人们不是靠房地产赚钱，就是靠房地产存钱。\n> ——房神论道\n\n世界范围内，房地产历来都是财富的源泉！房地产是当之无愧的“世界富豪的通用语言”。\n\
    只是，这门“通用语言”对亿万平民来讲，却是“难涉难懂”的“天书”。现在根据“理想生意”的 12 条标准，我们把房地产的“神奇”——破译，为大家解读“天书”。\n\
    \n#### （1）销售的势力范围是全世界\n\n房地产是不是“世界性”的黄金领域？这一点毋庸置疑！人都要避风遮雨之地，家禽都需栖身休养之所；商品世界里，房产的消费范围无出其右。而且无论地域、民族、经济状况如何，其运营规律与操作手段，都大同小异。掌握了“房地产投资”的游戏规则，真的就可以“四海为家、吃遍天下”。\n\
    \n#### （2）提供一种迎合无弹性需求的产品\n\n无论穷人、富人，都要“居有定所”，中国人更是讲究“有屋才有家”！它的需求是跨越阶层、时间、空间，它是需求是相对稳定的；任何经济周期性波动，都无法动摇其关乎国计民生的基础性地位。所以，“房地产”这种商品，其需求是“刚性”而“持久”的。\n\
    \n#### (3)产品是难于被取代或仿制的\n\n房地产卖的是房子吗？听起来有点“白痴”，但如果问你：是！那我要反而叫你“白痴”。\n\n房地产投资行业不仅是人们所说的“资本密集型”，更是“智力密集型”！这是个典型的靠“头脑”赚钱的天地。在这里，你销售的其实不是“房子”，而是“智慧产品”，我在后面会详细介绍它的秘密。\n\
    \n“智慧”可以被“取代”或“仿制”吗？\n\n“智慧=知识+经验”。同样的知识用在不同的场合会有不同的结果，其给人带来的体验就是经验，经验反复沉淀与升华，最终才会形成“智慧”。所以，知识可以被“仿制”，但“智慧”绝对不会！\n\
    \n#### (4)对劳动力的需求是最小化的\n\n如果你创过业、开过公司、做过“老板”，就一定会懂得：“老板才是打工仔”——为员工薪水“发愁”，为员工购置办公设备“发愁”，为员工业绩不佳“发愁”……雇员往往是“人力资源”，而“人力陷阱”。\n\
    \n所以，我们喜欢“房地产”们——每一处房产，都是我们的“员工”，这些员工“不吃不喝”、“日夜操劳”、“忠心耿耿”、“几十年如一日”……地为我们打工，可惜我们的语言表达能力有限，除了亲吻它们以外，找不到什么方法最能表达自己的谢意！\n\
    \n房神们都是“一人公司”的典范：智慧才是价值最大的资源；房产才是最无私奉献的雇员。除了“自己”，别无所求！\n\n#### (5)追求低廉的运营费用\n\n\
    房神们提一个皮包，就可以“走遍天下都不怕”——有人戏谑地称之为“皮包公司”。所有的生意，都是通过网络、电话、面谈完成的，简单得让人吃惊！当然，也不用交任何公司才有的税费！\n\
    \n#### (6)不需要大的现金支出或设备投资\n\n理查德的爸爸不推荐他去摘房地产，是这篇文章唯一的缺憾——实际上，房地产最大的优点在于：有钱玩得了，没钱也无所谓。\n\
    \n房神们的投资起步，就是“零首付”玩转房地产的“经典”应用。后面，会教大家如何进行现金流筹划，如何开展真正的“空手套”投资术。\n\n> 记住：房地产靠“智”，而不靠“资”。“没钱”反而是“智慧的发动机”。\n\
    \n方德硬朗的本改吹卖，房神们将特别免费送您《赢发力自动赚钱机》一书给您，该书揭示了由我们独创的、具有独创性的赚钱技术。\n"
