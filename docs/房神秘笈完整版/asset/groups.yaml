    # 单而高效的 “ 避险 ” 工具。


    ## （ 1 ）通过 “ 共同帐户 ” 控制资金流动


    如果买家获得了信用贷款，却不用该贷款用来买房该 怎么办？此时由于投资者身为 “ 担保人 ” ，要承担连带责任， 所以，一定要预防这种现象的发生。


    较合适的一种做法，就是与买家到银行申请一个 “ 共 同帐户 ” 。有的也叫 “ 关联帐户 ” ，或是 “ 联名帐户 ” ：如果 你所在地区的银行没有提供类似的服务，你也可以使用公
    证处的提存公证服务，或是银行的代收代付服务，甚至可 以找一个律师做交易中介 — — 只要满足互相监督与制约的 功能即可。


    “ 共同帐户 ” 的好处就在于双方任何一方只能存款， 不能取款。需要取款时，必须双方同时到场确认。


    买家申请到的以投资者为担保的信用贷款直接由信用 贷款公司存入该帐户，而不经过买家的手。这样，买家只 能在投资者的允许下动用这笔钱。


    而在实际的交易中，是由双方共同出面，将钱转入房 东帐号，或是转入投资者个人帐户作为交易费的缴付。


    ![](img/acb46489adfd772451884bb9efeed060_131_0.png)


    为感谢你的本次购买，房神团队特别免费提供《超额方力赚钱机》 一书给您。该书揭示了各种超方力的赚钱技术。


    我们把与“共同账户”相关的资金流转过程单独抽离出来，仔细观察一下这个帐户的使用情况（如上图）。可以发现：


    - 除银行货款外的所有资金进出，都要经过“共同帐户”；

    - 买家只能向共同帐户里汇钱，却无法取钱。

    - 两次信用贷款的资金流动，以及投资者应获利润的收取，都是由共同帐户来直接完成的。


    所以，“共同帐户”就起到了一个非常关键的“监控者”的角色。没有投资者的指令，买家无法动用该帐户的一分钱，也就相当于买家全程都要受到投资者的指挥与管理。


    一个“共同帐户”就帮助投资者成为整个交易的主导者。


    ## （2）二次信贷摆脱“尾巴”


    一定要“二次申请信用贷款”，这一点是毋庸置疑的。“共同帐户”虽然帮助投资者消除了交易过程中的风险，却不能解决交易后买家不按时还信用贷款的潜在风险。因为投资者还有“担保”这个“尾巴”没有斩断。


    出色的投资者是那些“算无遗漏”的人，绝不能留“祸根”在身边：无论买家表现得多么讲“诚信”，都要把自己的利益放在首位。


    # 第八课 融资转包——“太极拳”的钻石矿


    第一次申请信用贷款时，由于买家没有房产做资产证明，信用贷款公司往往需要投资者来做担保。但是第二次申请信用贷款时，买家已经成为了“房东”，可以证明自己是“可以还款”、“有信用”的人。


    所以，第二次申请信贷时，基本就不再需要“担保”。投资者于是再次借助“共同帐户”，用二次信贷贷款来归还前面的第一次“有担保”的信用贷款。


    由于第一次信用贷款的借期不长，可以用较低的罚息为代价，从容地全额归还。也就相当于“全额地”解决了投资者的隐患。


    投资者从此可以放心地拿到自己的全部获利，而没有半点风险。


    ## （3）先人后己，稳健获利


    投资者应优先帮助买家一步步顺利完成交易，再考虑自己的回报。这样才能赢得买家的信任；因为这类操作，对99%的买家而言，都会一开始就心存疑虑。所以，一定要通过“先干活，后拿钱”的流程安排，来解除买家的担心。


    整个交易过程中，投资者应得报酬的获取，都是在买家真实“获利”之后：


    - 第一次付一半：此时买家对房东支付首期款，表明交易已经顺利开始，投资者已帮助买家取得了买房的权利；所以，卖家应该对投资者付酬。

    - 第二次付一半：此时，买家正式获得卖家转移给他的产权，为贷款成功找到了买家；卖家得到了全款，他自然会支付投资者另一半酬金。

    - 第二次付另一半：此时交易已经完成，买家取得了房产，办理了贷款。当然应该把剩余的报酬支付给投资者，完成与投资者签订的转让协议中的约定责任。


    投资者每一次“领取新水”之前，都让买家看到了实实在在的“好处”。当然可以取得买家的认同，配合“投资者”从共同账户里支取现金。


    # “融资转售”的价值


    99%的房地产投资者不清楚“融资转售”的原理及手法，所以他们只能靠一些既常见、风险又高的方法试图实现“快速高价转售”。


    ## 被人忽视的“蓝海”


    这些常见方法，在兑现的时间及增值幅度上，都不尽如人意：


    - “地段升值”法——需要时间，承担房价波动风险；

    - “装修升值”法——需要资金投入，风险过高。

    - “内涵升值”法——需要房产特色配合，失败率高。


    只有“钱”才是最“诱人”的鱼饵；但是，之所以很少有人会运用，一侧是因为中国人的理财教育刚刚启蒙，缺乏所需的专业知识；二则是因为这种操作过程对于“外行”来讲，涉及资金大、风险高、麻烦多，所以被“吓”退了——机遇于是留给了“智者”。


    “融资转售”是“以租代买”整个流程中，最激动人心的部分，也是最能体现投资者智慧的部分。值得投资者新手花费 80% 的时间去理解与实践。


    # “融资转售”的价值创造


    始终要记住：房地产交易的核心问题永远是“钱”。无论是对买家还是卖家，运用“钱途”的手法，就是最有价值的手法——也就是“买家”愿意为之付高额报酬的“产品”。


    与普通人对于房地产中“钱”的认识不同，“钱”不仅指“价钱”。它实际上包括两个层面的内涵：一个是“总价”；一个是“支付方式”。这两点都需要通过买卖双方的“谈判”来确定。


    如果买卖双方只关注“总价”，那么这种“谈判”就一定是“战争式”的：即有一方获胜，就一定有另一方失败。


    “战争”是残酷的，有时甚至是“同归于尽”的。过于关注价格，就很多房产交易无法“快速完成”的祸首。


    我们不需要这种解决方案。我们需要“合作式”的谈判：双方各取所需，都是“赢家”。即一方是“总价”的胜者，一方是“支付方式”的胜者。双方满足各自利益的基础上完成交易。


    而房产的原来拥有者往往是谈判中的“强势”一方，他们往往更多地选择成为“总价”的维护人；那么做为“弱势”一方的“买家”，就相应地成为“支付方式”的胜利者。


    # 第八章 融资转换——“太极术”的钻石矿


    更重要的是，房东借“房产”之利，常常不会接受“支 付方式”的变通，这时就需要引入“融资机构”作为协调 人。所以，“二方共赢”就演变成了“三方共赢”：房东一
    次性的取得房款；银行“贷款获利”；买家赢得了“支付方 式”的灵活。


    这一切的“导演”就是投资者。所以，投资者通过“融 资转换”充当了三方利益的组织者与协调者。所以，投资 者整合“房东”的“房”、银行的“钱”、买家的“时间”
    （分期还款）三种资源，创造“三方共赢”的局面。


    这么有创造性的工作难道不值得高额的回报吗？

    与此同时，对于那些经济不太宽裕的老百姓来说，好 地段与好融资相比，哪个更重要呢？好装修与好融资相比， 哪个更实际呢？好价格与好融资相比，哪个更有吸引力 呢？


    房神式的投资者，绝不是靠压榨哪方权益而谋利的“魔 鬼”；而是靠智慧为大家创造价值的“天使”。


