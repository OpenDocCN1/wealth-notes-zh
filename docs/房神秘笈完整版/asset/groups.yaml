    \n## 如何省心地管理租客\n\n省心也是遵守 20:80 定律的群体。即其中 80% 会正常按时交纳租金，但会有 20% 给你带来麻烦。\n\n省心与麻烦的最主要区别在于能否“按时交租”。解决这个问题的技巧就是“租金调控”。\n\
    \n### （1）租金调控\n\n比如你索要的正常租金为 580 元，每个月 2 号前交租。那你就规定：凡是 2 号将租金汇入指定账号的，可以只交 580\
    \ 元；超过 2 号后，每天加收 10 元。\n\n人总是“趋利避害”的，通过这种财务杠杆，可以促使租客按时交租金。如果租客拖延了一段时间租金，你就要不客气地按“规矩”赶人了。\n\
