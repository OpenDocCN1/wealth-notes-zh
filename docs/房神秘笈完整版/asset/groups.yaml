    ## 近乎完美的投资思维


    “零首付双循环”体系设计巧妙，其优越的地方实难尽数：


    ### （一）完全“零资金”占用


    回顾“零首付双循环”的资金流转过程：第（1）步的租房，所需的押金及月租，都是由新的租客承担的。而且由于是“升级转租”，所以每个月都可以产生正现金流。而第（4）步买入房产所需的
    3 成首付，实际上由后面的“信用融资”来代交了，并转而由新的买家承担还款。所以前面租房带来的“现金积累”，可以完全抽调出来投资新的房产。


    ### （二）整个过程风险极小


    首先，对于资金风险来说。投资房地产常见的风险就是资金流动性陷阱，而这个投资体系中，由于实现了自有资金的零占用，所以资金风险极小。


    其次，我们设计了巧妙的“以租代买”合同，即使无法通过出租获得较多的正现金流，我们也可以通过“转让合同”实现房产净值的回收（后文会详细介绍这种“净值回收”理念）。


    第三，我们合理的安排了交易的前后次序及步骤（比如，只在找到愿意“以租代售”的买家后，才去申请信用贷款；以确保有人替我们还贷款），将自己的风险大大降低，风险因子在此我们自洽。


    ### （三）房产转租获益有保障


    如何实现转租获益，是积累正现金流的关键。我们的理念就是“升级”变“升值”，而“升级”的关键就是“分隔”——时间的分隔、空间的分隔，尽可能提供房产的时间利用率。当然，还要配合上出众的租客筛选策略。


    ### （四）售房的时间及价格有保障


    在普通的房地产投资环节中，“如何寻找合适的买家接手”是一个很耗时间的难题，二手房平均销售周期都要在 4 个月左右。而这个体系中，为新的买家设计了一种巧妙的“零首付买房方案”——这是一种重要的“融资”增值——所以出售变得简单了，而且基本上可以按“高于市场价值”的价格出售。


    这种模式下，“以租代售”的买家会把“房产”当作自己的房产一样用心照顾，所以作为投资者的我们既省心，又省力。更巧妙的是，这种模式下最后的买家大多数最后并不会买下该房产——这就意味着，我们既赚到了高于普通房租的租金，最后又保留了房产。


    ### （五）可以快速积累房产财富


    如果你买下第一处房产后，相信已经基本摸清了本地的房产特色及适合自己的投资地域——恭喜你，这时就到了你的“Show Time”。你会开始自己


    的收购之旅。反正不需要自己的现金，你所需要做的只是不断的找到好的房产，买入、买入、买入……


    ### （六）有助于巩固长期财富


    记住，房地产与股票的投资秘密都很类似，需要长期持有。所以，“多买少卖”应该让你谨记。


    这里所谓的“少卖”是指，不要图眼前的现金诱惑，而将房产一次性转售给买家；你应当把买入的房产尽量通过“以租代售”的模式变成自己的“金鹅”。持有期越长，其下的“金蛋”就越多。


    当你拥有价值几百万的房产，每个月有 6 位数的现金流入时，你自然而然的就实现了“经济自由”，可以提前退休了。只要你愿意，你可以去做任何自己喜欢的事。


    此外，“房神式零首付”还可以帮你轻松安家置业，帮你合法避税，帮你由内而外地享受“富翁们”的高品质生活……


    该路线图只是我们长期从事房产投资后总结出来的，最适合稳健风格的投资选择。你不一定要生搬硬套，但最好在培养自己的投资风格前，先模仿别人的成功模式：先模仿、再创新，才是快速成长之道。


    ## 第三课 房神式零首付——没钱，该如何开始


    ### 通过例子来学习“房神式零首付”


    相信作为投资新手，此刻你还是一头雾水、似懂非懂。不要紧，把下面这个案例看完，你就会恍然大悟。建议多读几遍，直到精熟。


    ### “房神式零首付”操作示例


    你找到一个厌恶于管理出租房屋的房东 A。A 想出售该房产，价格为 150,000 元，以前出租时月租金为 1000 元。


    你找到 A，跟他达成“以租代售”协议，约定每月租金 1200 元，该租金未来可用于冲减购房款。协议为期 3 年，3 年后一次性补齐剩余房款。


    并且约定，你首先交 1500 元为保证协议生效的定金，可用于冲抵购房款。如果放弃购买则不退还定金。租金方面为一押一租，就是说先交一个月的房租 1200 元，然后每个月的月初交本月的房租
    1200 元。


    这样 3 年后，你决定购买该房产，你此时已经交纳的预付房款为：


    ```

    1200 × 36 = 43,200

    ```


    你所需要补交的房款为：


    ```

    150,000 - 43,200 - 1,500 = 105,300

    ```


    这种方式对房东有什么好处呢？


    - （1）你给的租金比普通市价高 20%，价格吸引人；

    - （2）租赁期间不用过户产权，没有风险；

    - （3）3 年之中获得了稳定的收益保障，对于急于摆脱出租房屋日常烦恼的房东来说，很有价值。


    正是基于以上好处，所以对房东 A 的吸引力很直接。


    那么对投资人的“你”有什么好处呢？


    - （1）由于选定的房产有升级的潜力，所以租金超过 1200 元是完全有保障的。假如你升级后，每个月租金可得 1300 元，则每个月都会有正的 100 元现金流。

    - （2）不用支付任何首付（1500 元保证金可以通过谈判技巧省略掉），交给房东的押金及月租都可以通过新的租客收回来。

    - （3）如果 3 年后你不想购买，还可以把房产以原价 9 折（即 135,000 元）的价格转卖给别人；15 万的房产 3 年之后即使不升值，也不太可能贬值到
    135,000 元，所以你的价格将是非常有吸引力的。这样，你还可以赚取一定的差额，即：


    ```

    135,000 - 105,300 = 29,700

    ```


    这样的话，你实际上三年的收益总计为：


    ```

    100 × 36 + 29,700 = 33,300

    ```


    看起来，用三年的时间好像并没有赚到什么钱呀？每个月的收益才 100 多元。


    的确，一间这样的“以租代买”房产赚钱可能慢点，但是因为你“零首付”，所以是“零成本”取得的 100 元收益。只要你操作上手，可以在短时间内操作大量这样的房产。积少成多，只要掌控
    10 处房产，每个月就可以获得 1000 元净收益——记住，这里的每处 100 元收益是非常保守的估计。


    只要一年就可以获得 1 万元总收益（按 90% 的出租率估计，每年可保证出租 10 个月），三年就是 3 万元。


    而这也只是靠一点出租差价。如果你转让房产，可以获得更多的收益。因为转让一间可以赚 29,700 的差价，转让上 10 间的一半（即 5 间）；呵呵，收益就是：


    ```

    29,700 × 5 = 148,500

    ```


    那你三年的总收益实际上就是：


    ```

    30,000 + 148,500 = 178,500

    ```


    足够买下你最初签约的那处房产。


    当然，以上的估计实际上建立在很多假设的基础上的，比如假设你只找到 10 处房产，假设你每处房产每个月只能获得 100 元净收益，假设你只按 9 折的价格出售房产……


    而实际投资中，你的能力与投资数量会加速发展，根据个人经验，基本上 1 年后就可以买下你最初签约的某处房产；如果你申请按揭贷款的话，不到半年就足够你付首期款买下该房产了。


    介绍到此，你应该开始慢慢明白“解放房奴”的技巧了吧？


    ### 解放房奴的根本之策


    从资本运作角度来看，“房奴”就是典型的“现金流压力过度”造成的。实际上，“房奴”们的房产“净值”（即购入房价减去贷款余额）是不断增加的，但是他们却无法将这些“净值”变现（除非他们出售房产）；反而要不断地为持有房产而付费。所以，房产才“账面上”是“资产”，实际上是“负债”。


    所以，“房奴”的产生原因就在于：


    1. “真正的资产（房产净值）无法变现流通，成为“死钱”；

    2. “日常开销（每月还贷）无法承担，成为“过度负债”。


    而了解了“房奴”产生的原因，就可以对症下药，有的放矢地提出解决方案：


    1. 投资前就要“以卖为导向”锁定房产，解决“净值”变现问题；

    2. 房产“租赁”期间，寻找“新租客”来承担“月供”，转嫁“持有成本”，实现“零风险”锁定房产。


    > 从房奴到房神，只差三个字的距离：“现金流”！

    > ——房神论道


    由此可见，房神与房奴的区别，表现在“资金运筹”中，就是“现金流”的运作智慧。


    所以，“解放房奴”之根本大计，不是让“房奴”们简单地将“房产”当作“难言之隐、一卖了之”；而是要采取“围魏救赵”的思路，开收入之“源”，补“养房”之“缺”。而且不仅帮“房奴”们从“房困”中解救出来，还要帮他们从平民成长为“投资高手”。


    “高手”当然不只“以租代买”这一招：真正的好戏刚刚开场。


    按前面的分析，当你运用“以租代买”筹集的资金，买下第一处房产后，你不必重复简单的“出租”方式来慢慢积累现金了。你只需要通过“信用贷款”及“抵押借款”组合融资，就基本可以把用于买房的投资都抽调出来。


    仍通过上例来看，你补交 105,000 元给 A 买下该房产，然后找到银行申请二手房抵押贷款，评估价为 150,000，由于房产建成年限较长，你只贷出 5
    成贷款，即贷到 75,000 元。


    然后你找到本地的信用贷款公司，他查看了你的房产材料，审批给你 2 年期 30,000 元贷款。


    这样，你刚好获得了 105,000 元贷款。银行贷款加上信用贷款，每月需还贷约 2000 元左右。而这 2000 元的每月支出，你完全可以通过目前的多处房租收入来弥补。


    这样子，买房款是“银行贷款”加“信用贷款”，每月还贷是“租金”代交——你相当于“零成本”买入了一处房产，而只用了三年时间。


    然后你把这处房产使用更巧妙的“以租代售”模式出租（后文会介绍一种可产生更高收益的“以租代售”模式），这样每个月又会产生 1500 的正现金流，外加一份“定金”收益。


    这时，聪明的你可能想到，买入房产后，不算其他房产调整时的未税成本，房产月租特别适合负税逻辑（负税率自动赚钱）。


    产租金收益，实际上每个月就是收入 1500，而支出 2000，那不是亏本 500 的买卖吗？


    其实不能这样算，因为信用贷款一般期限要求较短，常见的为两年，所以 500 的负现金流最多持续 2 年；2 年后还完信用贷款，每月还银行贷款开支应不超过 500
    元，那么正现金流就基本可以达到 1000 元以上——相当于 10 处“以租代买”房产收益。


    此外，更关键的是，你将前面贷出来的 105,000 元现金可以作为首付，利用银行“二手房/三成按揭”的模式，买入新的房产。


    比如，你买入两处价值 12 万的房产，共计价值 24 万；每处支付 5 万元首付，因此需要向银行申请按揭贷款 14 万（即 24 万 - 10 万）；然后再申请信用贷款，把前面的首付款（共计
    10 万）贷出来。同时，汇总多种“以租代买”房产的租金总收益，用来补偿“贷款买入房产”的每月还贷支出。


    现在，你共有 10 万的现金：接着拿这 10 万做首付，再去买 2 间房产，循环同样的过程……惊人的“裂变”扩张。


    当然，在实际投资中，你很难扩张得如此理想，但只要你明白了这个“裂变”原理，就可以根据实际情况去灵活运用、快速发展。


    ## 最简单的百万财富公式


    前面的“裂变”扩张过程看明白了吗？建议你一定要反复琢磨，将这套体系的思维消化透彻。


    “房神式零首付体系”完全是从“一穷二白”起步，通过“房—钱—房”的不断增值循环，实现财富的自我繁殖。投资者有钱无钱，根本就无所谓。只要看透了这套增值魔术，就可以从“一无所有”，到“应有尽有”。


    这套增值体系的核心秘密就是：


    “以租养钱”→“以租养贷”→“以房养老”


    一个简单而威力无穷的百万财富推演公式。其原理其实非常简洁明了。


    ![](img/acb46489adfd772451884bb9efeed060_58_0.png)


    根据上图（箭头代表“现金流向”）所示原理，再次重温一下这套体系的原理：


