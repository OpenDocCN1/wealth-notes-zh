    经过上面的分析计算可知，扣除交易税费，实际上 M 共计获利约 16 万。


    而 M 的实际投资仅为：


    ```

    118000-50000-17500-3000=47500

    ```


    47500 的投资加上税费约计 5 万，即投资收益率：


    ```

    (160000-50000)÷50000=220%

    ```


    而看上去，在这 5 年时间里，好像前 2 年 M 每个月有 1000 元的负现金流，2 年后转为正 1400 元左右。


    ![](img/acb46489adfd772451884bb9efeed060_159_0.png)


    # 第十章 三方融资——巧用杠杆展“借术”


    但实际上M基本上并没有负的现金流，因为L预付的款项共计20500元，平摊到2年内，每个月为854元。则相当于M每个月的负现金流仅为146元。


    而同期银行5年期“整存整取”存款利率为4.14%，5年共计20.7%；就是说，M在5年内，获得了相当于银行存款15倍（即220%÷20.7%≈11）的回报。


    绝对算得上是“收益惊人”了。把钱存在银行里，当然不如把钱存在“房产”上好。


    投资者实际上相当于用5万元，控制了价值为30万的房产。以此类推可以算出，如果他有20万的现金，可以控制多少处这样的房产！


    上面这个示例，就是典型的“房神式融资”技巧。它借助“房产”杠杆，从“银行、信贷贷款机构、买家”三者身上同时融资，并由“买家”承担“融资成本”。从而保证自己实现低成本、高收益的投资过程。


    现在就让我们来仔细分析一下具体的融资实现。


    ### 银行贷款——取之不竭的金矿


    银行是最理想的融资渠道，因为它提供的资金量大，周期长，利率低，稳定性强。所以，是我们借助“房产”杠杆获得贷款的首选。


    银行融资有几个特点与我们的融资模式密切相关，必须关注：


    （1）只能保证一部分资金要求


    二手房按揭贷款最高 7 成，但是扣除税费及评估因素，实际上能得到 6 成左右。这个比例低于新房的按揭成数。


    贷款额度要求¹


    - 1. 住房贷款借款人以所购住房作为贷款抵押物的，必须将住房价值**全部用于贷款抵押**。

    - 2. 所购住房为一手楼时，贷款额度一般不超过购入价格的 80%；

    - 3. 所购房为二手楼时，该住房的已使用年限不得超过 10 年，并且已经办好房产证且房屋结构良好不存在任何纠纷或问题，最高贷款额度不得超过抵押物评估净值或购入价格两者中低者的
    70%。


    所以，银行融资只能保证我们所需的一部分资金要求，必须采取多种融资手段的组合才能实现更高比例的融资。


    （2）必须以房产全额为抵押


    由于银行按揭贷款是以房产价值的“全额”为抵押担保的，所以还贷期间无法办理“二次抵押”或是“房产转让”，这就限制了进一步采取“抵押贷款”的方式来融资的可能。


    这同国外的操作有很大的区别，欧美投资者完全可以采取“多重抵押”的方式来实现高比例房产贷款。在国内受到这样的限制，也就激发我们去寻找其他的融资方式。


    （3）可以采取“循环房贷”的模式滚动贷款


    一些银行（如招商银行）提供了“循环房贷”的产品，就是说，你归还的房贷本金还可以再贷出来，实现滚动贷款。二手楼住房贷款的最长期限不超过 20 年（一手不超过
    30 年）。


    这是一个重要的融资工具。可以帮助我们源源不断地从“房产”中提取“现金”。


    根据以上特点，需要我们在融资过程中做到：


    - 以二手按揭贷款为先；

    - 组合其他非抵押融资方式；

    - 滚动融资保证资金所需。


    建议向一些规模小的商业银行贷款，如深圳发展银行、招商银行等。这些银行办事效率高、服务好，更重要的是他们的贷款政策很灵活，利率相对优惠，便于实现多种“融资”方案。


    # 信用贷款——短期快速融资的渠道


    对于“非银行的信用贷款”机构，相信你一定略有耳闻：在很多地方日报上，都有他们的广告，常常配以“快速放款、无需担保”之类的字样。


    贷款利率


    请不要担心，他们的身份并不都是民间的“高利贷”。根据法律规定：高于同期银行利率4倍的贷款即为“非法”。这类短期贷款一般情况下期限不超过2年，那么最高贷款利率就是：6.30%×4=25.2%，两年期总利率就是50.4%。


    而常见的规范性的信用贷款公司（以下都是指非银行机构），二年期利率都在16%左右，年利率就是8%左右，远低于“高利贷”的最高限额。


    按年利率8%来计算，那么贷款10000元，为期2年，平均每月需归还：


    ```

    10000×（1+16%）÷24=483（元）

    ```


    即近500元。借此可以快速估算出借款2万、3万等金额时，每个月需还贷额。


    信用贷款特点


    - （1）无需抵押担保

    具备信用贷款特点，无需房产担保；但如果借款偏高的话，还是需要其他人来担保才能得出。或者你出具房产证，证明自己财产状况及还款能力。


    - （2）与银行抵押贷款相比，贷款数额较小

    这类信用贷款数额一般不会太高，对于普通百姓的贷款，一般最高限额不会超过 10 万（不同地区、不同机构会有不同）。


    - （3）贷款快速、还款期短

    很多这类公司都会保证“一周放款”，所需手续简便。但是要求即贷即还，贷款下月就必须开始等额本息还款。也可以实现滚动贷款。


    # 融资策略


    结合这类“信用贷款”特点，我们可以制定如下融资策略：


    - 由于无需房产抵押，所以可以在办理银行房贷之后快速申请信用贷款。

    - 由于数额偏小，所以只能作为银行房贷的补充，主要用于把买房的首付款再融通出来。

    - 由于还款期短、月还款额高，应尽量通过“以租代售”的模式由买家承担还款压力。


    # 买家融资——成本最低的渠道


    之所以说“向买家融资的成本最低”，是因为你采取“以租代售”的模式，可以收取 3%~5% 的首付款。同时，每个月还可以收取高于平均租金的“名义租金”。这些所收的款项都是“免息”的，可以作为投资者购房所付首期的“第二重”弥补（“信用贷款”是第一重）；此外，买家还可以


    > ¹摘自“招商银行一网通”主页

    为感谢您的本次购买，房中介将特别免费赠送《点验万行藏银机》（红色，该书揭示了由我们自创的、具有革命性的赚钱技术。

    '
