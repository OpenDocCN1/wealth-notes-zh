    | 不卖时，投资收益率 | 346.86% |


    以此类推，当调整“信用贷款”额为30000时，现金流基本为零。对于偏好“低风险”的投资者，可以调整为这类数字。


    “现金流调整表”仅是数据的显示表，要调整相应的数据，必须到左侧对应的黄色区域标识的方框内调整。


