    ## 借助别人的资源（或自己的非现金资源），获得产权流及资金流的控制权，进而获得低风险收益的保障。

    —— “房神式零首付”实质


    只要不是自己的钱，就可以奉行“借来主义”，用于获得房产交易的控制权，并通过“转让”获利。


    毋庸置疑，“以租代买”就是最好的例子：借助“租客”的钱来完成房产交易权的控制，并积极寻找转让“期权”的机会。


    这里有三个隐含意义：


    - （1）“零首付”是指首付的现金为“零”，尤其是指自己的现金为“零”。使用其他的资源来替代，从而降低自己的风险与投资。

    - （2）交易结果是“获得房产交易的控制权”，而不是“房屋产权”。也就是说，在一定期限内，自己垄断了房产的交易权利，根据某一价格可以转让，也可以自己买入。

    - （3）最重要的是，“零首付”是一种“整合资源”的过程，必须结合实际情况，灵活运用。


    下面，让我们一同快速浏览“零首付”的众多技巧，希望可以启发你的智慧，举一反三，灵活运用。


    ## 零首付的十大技巧

    > 摘自马克·汉森与罗伯特·艾伦合著的《一分钟百万富翁》，有删节（与传统得房成本相吻合，房神组团将特别免费赠送《超预期行动赚钱机》一书，该书揭示了由我们首创的、具有动态性的赚钱技术。


    ### 零首付技巧一 提高价格，降低条件

    房东商定，分期支付房款，同时以某高于银行存款的利率按期等额本息还款。这样房东相当于贷款给买房人，买房人无需支付首期，每个月定期还款即可。


    ### 零首付技巧二 用才能，而不是钱

    买方通常具有专业知识，可以用来“交换”首付资金：承包商、画家、园林学家、保健专家、律师、房地产经纪人、保险代理、汽车经销商、商人——所有这些人都能提供有价值的服务或折扣，可以用来交换首付款。有时，在没有资金的情况下，卖主的人力也能对交易产生决定性影响。


    ### 零首付技巧三 承担卖方的债务，使债权人成为合伙人

    在谈判的时候，你需要问一个敏感的问题：“卖主先生，我知道这事与我无关，但是如果我知道你计划用这笔买卖的收入做什么的话，也许我能帮助你解决你的问题。”你希望听到的是卖主计划用自己从这笔交易中获得的钱支付某种债务。如果你能安排承担这些债务，然后将余款逐步偿还，你就能避免不得不一下子投入首付款。


    ### 零首付技巧四 利用租金和押金

    房东常常会要求承租人支付第一个月和最后一个月房租作为押租。如果房产售出，那么这些押金就一起转给新买主。除非当地的法律有禁止规定，否则买主可以在结案的时候用这些给他的押租冲抵首付款。


    ### 零首付技巧五 以租代售

    本书中已经有详细介绍。


    ### 零首付技巧六 不惜一切代价借钱

    信用卡、短期信用贷款、住房抵押贷款、其他个人财产再融资。你并不在乎借钱的成本。只要你能很快转手出售，要让这种技巧起作用的唯一办法就是要谈成一个超级优惠的买卖。但是，如果你的确找到了这么一个项目，就有必要知道有哪些筹措现金的办法。


    ### 零首付技巧七 折扣致富，按揭持有人成为合伙人

    这里的策略就是要说服某个私人按揭持有人打折出售按揭，提取现金，然后用房产获得新贷款来支付打了折扣的按揭。


    ### 零首付技巧八 运用隐性资产分割致富

    小心谨慎的买主会学习如何认识附属在房产上的额外资产——可以卖出这种额外资产，筹措购房款；这种资产的类型非常多，从固件到部分土地本身，不一而足。


