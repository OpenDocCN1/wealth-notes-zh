    # “炼金术”论述


    “房产净值”对这些“房奴型”房东而言，并不是“财富”，而是无法变现的“空头支票”。他们更需要可以立即拿到手里的现金，并解除还贷重负。


    投资者不是“落井下石”的炒房者，而是帮房东尽快远离痛苦的“天使”。所以，投资者不必靠“挤压”房产交易价格来获利，而是与房东协商一个双方都可以接受的中间价，尽快成交。


    由于房东的特殊情况，即使这样的“中间价”也已经大幅度低于市场价值。所以投资者购入房产（通常需要转按揭）的同时，就已经获得了可观的房产净值收益：当然这些收益现在还无法变现。


    为了将其“变现”，就需要引入其他“贷款人”。


    # 多方融资——银行及信贷公司为我们“服务”


    这些“贷款融资机构”不是我们的上帝，而是我们的“侍者”——因为投资者“购买”了他们的“服务”，并且有“房产”担保。


