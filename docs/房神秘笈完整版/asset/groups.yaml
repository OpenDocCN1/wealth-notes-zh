    我们把与“共同账户”相关的资金流转过程单独抽离出来，仔细观察一下这个帐户的使用情况（如上图）。可以发现：


    +   - 除银行货款外的所有资金进出，都要经过“共同帐户”；

    - 买家只能向共同帐户里汇钱，却无法取钱。

    - 两次信用贷款的资金流动，以及投资者应获利润的收取，都是由共同帐户来直接完成的。


    所以，“共同帐户”就起到了一个非常关键的“监控者”的角色。没有投资者的指令，买家无法动用该帐户的一分钱，也就相当于买家全程都要受到投资者的指挥与管理。


    一个“共同帐户”就帮助投资者成为整个交易的主导者。


    # （2）二次信贷摆脱“尾巴”


    一定要“二次申请信用贷款”，这一点是毋庸置疑的。“共同帐户”虽然帮助投资者消除了交易过程中的风险，却不能解决交易后买家不按时还信用贷款的潜在风险。因为投资者还有“担保”这个“尾巴”没有斩断。


    出色的投资者是那些“算无遗漏”的人，绝不能留“祸根”在身边：无论买家表现得多么讲“诚信”，都要把自己的利益放在首位。'
  - '[PAGE 133]


    # 第八课 融资转包——“太极拳”的钻石矿


    第一次申请信用贷款时，由于买家没有房产做资产证明，信用贷款公司往往需要投资者来做担保。但是第二次申请信用贷款时，买家已经成为了“房东”，可以证明自己是“可以还款”、“有信用”的人。


    所以，第二次申请信贷时，基本就不再需要“担保”。投资者于是再次借助“共同帐户”，用二次信贷贷款来归还前面的第一次“有担保”的信用贷款。


    由于第一次信用贷款的借期不长，可以用较低的罚息为代价，从容地全额归还。也就相当于“全额地”解决了投资者的隐患。


    投资者从此可以放心地拿到自己的全部获利，而没有半点风险。


    # （3）先人后己，稳健获利


    投资者应优先帮助买家一步步顺利完成交易，再考虑自己的回报。这样才能赢得买家的信任；因为这类操作，对99%的买家而言，都会一开始就心存疑虑。所以，一定要通过“先干活，后拿钱”的流程安排，来解除买家的担心。


    整个交易过程中，投资者应得报酬的获取，都是在买家真实“获利”之后：


    第一次付一半：此时买家对房东支付首期款，表明交易已经顺利开始，投资者已帮助买家取得了买房的权利；所以，卖家应该对投资者付酬。


    第二次付一半：此时，买家正式获得卖家转移给他的产权，为贷款成功找到了买家；卖家得到了全款，他自然会支付投资者另一半酬金。'
  - '[PAGE 134]


    第二次付另一半：此时交易已经完成，买家取得了房产，办理了贷款。当然应该把剩余的报酬支付给投资者，完成与投资者签订的转让协议中的约定责任。


    投资者每一次“领取新水”之前，都让买家看到了实实在在的“好处”。当然可以取得买家的认同，配合“投资者”从共同账户里支取现金。


    # “融资转售”的价值


    99%的房地产投资者不清楚“融资转售”的原理及手法，所以他们只能靠一些既常见、风险又高的方法试图实现“快速高价转售”。


    # 被人忽视的“蓝海”


    这些常见方法，在兑现的时间及增值幅度上，都不尽如人意：


    +   * “地段升值”法——需要时间，承担房价波动风险；


