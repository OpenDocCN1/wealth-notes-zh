    \n#### （3）投资者为什么要提供担保？有没有其他的变通方法？\n\n如果投资者只是一名普通的中介，那么你主要的工作就是联系一些银行及信用贷款公司给买家认识，然后帮助买家办手续就可以了——所以，也只能获得一点手续费收入，甚至还要冒“飞单”的风险——因为你并没有为买家提供吸引人的增值服务。\n\
