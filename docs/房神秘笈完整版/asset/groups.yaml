    ### “信用贷款”调整方法


    由于月还款额较低，所以银行贷款是“越多越好”；而信用贷款是造成负现金流的罪魁，所以使现金流为正的方法主要是调整“信用贷款”额度。


    如下图所示，将“信用贷款”调整为40000元后，可以发现负现金流减少了，但是自有资金比例及收益率都下降了。也就是说，这时要求投资者一次性拿出更多的钱，来保证每月现金流的安全。


    **现金流调整表**


    | 项目 | 数值 |

