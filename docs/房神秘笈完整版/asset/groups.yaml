    # 好营销——如何吸引潜在租客


    不同层次的租客对房产有不同的要求，但基本可以定为 “40：30：20：10” 这样的比例：即地段占 40%，租金 高低占 30%，房产配置 20%，与房东关系好坏占
    10%.


    当你选好房产后，地段就已经无法改变；所以重点应 放在定价及房产改善上。


    无论你采取分离出租还是设施增值等策略，快速租出 去的秘诀都是 “价格优势”——由于租客的选择往往是较 多的，所以最核心的比较指标就是 “价格”。


    注意，“价格比较” 的潜台词是：同等条件下，你的 价格一定要 “超值”；而不是 “超低”。


