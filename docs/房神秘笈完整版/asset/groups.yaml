    ## 亘古不变的财富哲学——富贵稳中求


    成功靠运气，还是靠努力？


    这是个让人“初看清楚、再看糊涂”的命题。我们也不敢下一个确切的结论，但我们知道：没有什么成功是来自于侥幸，没有什么财富是因为好运！那成功靠努力就可以吗？


    ### 梦想可以 “速成” 吗？


    我们最初是很受一些 “成功学大师” 所迷惑的！相信 “努力、激情、不断的自我激励”，就是梦想速成的秘密！但是，当我们四处撞壁、伤痕累累后才发现，成功是绝对没有捷径的，任何企图绕过正常渠道取得
    “非凡成功” 的尝试，最后都将付出更惨痛的代价。


    所以，我们知道了，那些 “成功学大师” 其实不过是 “催眠大师”，把听众 “哄” 得把那些违背客观规律的话都奉为至信。“迷惑听众才是大师的成功之路” ！“传销”
    不就是其最极端的产物吗？


    与之相反，你看看中国那些真正人生、事业、品德都非常受人尊敬的企业家们，绝大多数都具备显性的正派风范！为人谦虚，做事务实！“有诸内而形于外”，其人格魅力彰显于动静之间！


    蒙牛的牛根生，18 岁开始烧奶瓶，到了 40 岁才自立创业，仅 6 年间就成就了中国的第一！如果按 “大师” 们的计算，“6 年” 绝对是 “超速” 的了！但从
    18 到 40 之间的 22 年磨炼，才是 “超速” 背后的秘密！


    从 1 层建大楼到 10 层只需要 3 个月，但打地基则需要半年。赚钱从 1 百万到 2 百万很快，但从 0 到 1 百万很慢！这是同样的道理。


    ### “超速”的背后


    如果你还不明白的话，请想一想自己学习游泳的经历（如果你不会游泳，可以想想类似的学打球、学外语的经历）。我们可以以一个朋友的真实经历为例，一起思考：


    > “超速”是怎么炼成的


    我用了两个月时间，从一个纯种的 “旱鸭子” 锻炼成了很多人眼中的 “游泳高手”。


    我的计划很简单，就是平均每 3 天去游一次，每次学会一个新动作。当我学了一个半月的时候（也就是 45 天跨度，第 13 次下水），使用自由泳式，我终于可以从泳池的一头，游到另一头了（就是
    50 米远）！虽然很累，却很开心。自认为这已经是一个天大的进步了——当然，我是一个很乐观的人。


    但更大的惊喜还在后面，当我第 14 次下水的时候，居然可以持续游 300 米——绝对的突飞猛进！


    当我第 20 次下水的时候（也就是开始学游泳的两个月后），连续游 500 米已经很轻松的事了，而且可以保持很标准的泳姿与漂亮的速度！


    从 50 米到 300 米，仅用了“2 次”就实现了（从第 13 次到第 14 次）。如果按“超速思维”，这绝对属于“飞跃”。但是别忘了，这“飞跃”实际上是因为有着“0
    到 50 米”的“13 次”坚持！


    成变成功的逻辑是什么？我们的理解就是“日积月累，等待突变”！“突变”常常被人们误解为“运气”，是偶然事件；实质上“突变”只是“进化”的必然！


    ### 慢就是快，快就是慢


    那么，如何能“日积月累”等到“突变”之时呢？


    “坚持”其实是一件很磨炼人的事。之所以任何一个行业（包括房地产），成功者永远都是少数。因为大多数人都在“马拉松”式的“坚持”中弃权掉队了。而“掉队”的人往往在开始时，都是很“激情四射”、“行动迅猛”的人。


    认识到“积累—突变”原理后，你就会明白，为什么跑马拉松的人都会在起跑后刻意地保持适当的慢速了。因为只有“慢”，才能“坚持”；只有前面“慢”，才有后面的“快”。


    从地质变迁到生物进化，从社会演进到个人成长……

    这个世界无处不在宣示一个简单而深刻的道理：


    > 慢就是快，快就是慢！

    > ——房神论道


    慢的表现就是“稳”！快的外衣就是“险”！


    所以，上面的话，也可以说为“稳后有快”，欲快实验！


    柳传志的实用主义哲学就是：“跨上一步，踩实了，再跨上一步，再踩实，当确认脚下是坚实的黄土地以后，撒腿就跑”。


    这就是“慢就是快”、“稳后有快”的最鲜活的描述。


    说了一大堆看似与“房地产”无关的论调，这些其实都非常重要——房地产投资中，“拖延”往往“是不败”的代名词。


    请在以后的每一笔投资前，都问问自己：可以拖延一下，用于自省，以求稳健吗？


    “稳健”是投资的指导思想，那么体现该思想的实施战术是什么呢？


    ## 第二课 “黄金护甲”——立于不败之地的投资战略


    ### 百战不殆的兵法——逆向思考致胜术


    孙子兵法有云：知己知彼，百战不殆；知己不知彼，一胜一败；不知己不知彼，每战必败。


    如果有人问我们：这个世界是否有百战百胜的投资秘技。我们会说：有！那就是——永远都不去投资！


    不去做就永远不会失败！


    但不去做投资，你的财富人生实际上就是完全失败。不怕失败，才能敢于尝试；而且有一些方法是可以帮助你避免失败的。所谓的“百战百胜”是不可能的，但“百战不殆”是有可能实现的。即是说，你可能赚不到钱，但也有
    99% 的把握不会亏钱！


    “不败”才是“胜利”的先导！


    ——房神论道


    总结这么多年的各项投资经验与教训，我们把所有的“不败”方法，浓缩为一句简明易懂的话。你只要反复读它，融入你自己的潜意识中，并时刻提醒自己——它就一定会在投资之旅上为你“保驾护航”。


    ### “神奇的问句”引导你避开无数的陷阱


    这句话实际上非常简单，只有 5 个字——“如果……怎么办？”


    你只有在每次投资启动前，像做填空题一样把具体的内容填进去，并问问自己，就可以帮你“绕开陷阱”。


    ### 分析举例


    你发现一处位置很好（200 米外有一处超级大卖场将于半年后开业），南北朝向的二手住宅商品房。由于房东急于移民离开本市，因此价格比市价低 10% 以上（市场价
    20 万，与房主还价到 18 万，交易税费各半）。更关键的是，该房产刚刚过 5 年缴税期，可以省下近 2 万的税费。相对而言，该房产很有吸引力！


    你问过了银行，按交易价“可以按揭到 6.8 成”，则该房产只需要你首付 5.76 万即可（18 万的 32%）。


    请问，此时如果你是投资者，而且你完全可以负担这 6 万左右的首付（5.76 万再加上其他交易税费），请问你是否要出手？


    如果你是投资新手，此时很可能被房产的优惠条件吸引，甚至迫不及待地要出手购买。根据你的设想，希望可以买入后转售，或是以租养贷。


    正当你头脑发热，就要冲动出手时……

    且慢。

    请搁置自己兴奋的心情，采取“如果”问句，来自我检讨一下，通过简单的“设问”来检验该投资是否合适，排查所有可能的风险：


    - （1）如果想快速转售，加上多种税费后总价上升，没有新的买家愿意接手怎么办？

    - （2）如果需要装修，则装修费再加上买价，最后的总投资过高怎么办？

    - （3）如果该房产有其他债务纠纷怎么办？

    - （4）如果转为长期持有，月租金不能完全补偿月供怎么办？

    - （5）如果……


    你应该仔细分析一下这些“如果”，因为每一个“如果”都是潜在的地雷。只要忽视其中任何一个，都可能将自己“炸”伤。


    那是否意味着，自己要准备一张包括所有“如果”问题的列表，每次投资都一一判断呢？


    如果你是投资新手，那就一定需要制定这张表，时刻提醒自己所有可能的风险。但真正的高手，根本不需要这张表的。因为只要具备一种“简单的思维”即可快速完成这些“如果”检验。


    因为，这张表背后的逻辑很简单，就是：“逆向思考”是商业世界通行的兵法。


    房地产投资的基本方法就是两种：（1）出租；（2）转售。其他方法基本都是这两者的衍生物或是变体。


    所以，当你判断一下房产是否应投资时，只要从这两个方面出发，把自己当作“下家”（租客或是新的买家）即可。


    还以前面的例子来说明，如果你想快速转售，那么该房产一定要对买家有很突出的吸引力才行。吸引力一般来源于：（1）房价低于市场价较多；（2）融资方式灵活。


    而上例中房价仅比市场价低 10%，如果再经你手转售，那点差价将全被过户税费吃掉。所以，如果你是“新的买家”，其真实的吸引力并不高。所以，你如果真的想购入的话，就可能需要设计出巧妙的“融资”方式来操作（后面会有非常实用的“招数”介绍）。


    此外，“新买家”会在意“楼龄”、“装修”、“车位”……等等一系列的问题，但这些问题，都是“人之常情”。完全可以揣摩得到。


    这样，当你还没有“买”时，就先通过“体验”下家的思考来确认该房产是否能“卖”；当你还没有成为房东时，就先“设想”将来是否能“租”。把自己想像成“新的买家”或是“租客”，来考察房产的现金流通、持有成本等问题，就会使自己的投资“立于不败之地”。


    这种“逆向+换位”的思考模式，既反映了孙子兵法里“未战先胜”的思想，更是商业世界通行的秘诀。


    你听说过“看板管理”吗？听说过“拉动式生产”吗？听说过“客户订制”吗？这些企业运作策略及商业技巧，实际上都是“逆向”思考的产物。


    再举个例子，假如你有一个房产出租，有三个租客表达了入住意向，那该如何快速筛选合适的租客呢？


    最简单而有效的技巧，就是“逆向”法！假如你是租客，那么你的“租赁”情况，谁最清楚呢？毋庸置疑，就是你所在公司的同事及跟你打过交道的“房东”。


    所以，当你筛选租客时，只要让他们提供“所在公司同事”及“以前租房的房东”的联系方式就够了。向这些联系人打几个电话，就可以快速判断出哪个最合适——当然，有经验的投资者，靠多年形成的直觉来挑选，其效果也不错。


    ### 东方不败的秘密——买之前先卖


    我有一个朋友，在圈子里号称“东方不败”——当然不是因为他“自宫”过，而是因为他的投资几乎从未败绩。他只做快速转手生意，每次房产从“买入”到“卖出”，从不超过
    3 个月。那他的秘诀是什么呢？


    他总结为三句话：（1）只在最好的地段投资；（2）只投资白领阶层的房产；（3）投资前，至少确定三个有意向的买家。


    他解释说：最好的地段，其房产的吸引力不会差；白领阶层，其购买力不会差；投资之前，他会在自己的“买家”资料库里筛选出三个，通过电话确定他们的确有意向后，他才会动手。


    如果一处房产，他自己认为很有吸引力，但是手中没有合适的买家的资料，他就会在日报分类广告版或二手房产网站上打出广告，征求买家意向——记住，这一切工作都是在他还没有出资将房产买入的时候完成的。


    如果打电话过来咨询的人特别多，那就意味着该房产是“安全的”投资；否则，他是绝对不会出手的。


    他的“稳健”风格虽然让他错失过不少良机，但带给他的收益更多。


    ### 小结


    房地产投资是其他投资领域的代表，浓缩了大多数投资行业的规律——先打造自己的“黄金护甲”，立于不败之地再“稳健”出击：


    - 现金流为王——现金是投资运转的血液，只有稳健的现金流才能保证“投资项目”的生存。它是体现“稳健风格、不败战略”的出发点。

    - 富贵稳中求——财富的增长逻辑，就是“先慢后快”；突破“临界”之后，才有“突变”效应。坚持“突变”之前的渐进式积累，才是创富者的焦点。

    - 逆向思考术——“先求胜而后求战”之体现，就在于把行动可能带来的结果及风险，预先周全考虑并妥善准备。通过“换位”及“假设”的思考方式，由“结果倒推过程”，无疑是一种巧妙的“致胜术”。


    穿上房神的“黄金护甲”，接下来就要拿起房神的“无坚不摧的长矛”！


    ![](img/acb46489adfd772451884bb9efeed060_43_0.png)


    ## 第三课 房神式零首付——没钱，该如何开始


    你有致富的强烈欲望，却没有钱吗？

    恭喜你，你很适合投资房地产。房地产最适合没有钱的人来起步投资。因为没有钱，所以你不会去冒最大的风险；因为没有钱，所以你会从稳健的地方起步；因为没有钱，所以你不得不动你的大脑去解决问题。


    始终记住，房地产同其他行业类似，成功的永远都是掌握知识并努力实践的人，而不是最初有钱的人。


    终于要开始我们的最激动人心的学习之旅了，从这一课开始，我们将一起探秘那些房地产投资“操盘手”的“百宝箱”，挖出他们经过千辛万苦才百炼成钢的“独门秘技”。

    但是，请记住，这些“秘技”只是帮你少走弯路的指引。只有“实践”才是最好的老师——你不可能奢望看完全书之后就一朝得道，从此“飞黄腾达”；没有长期的行动积累，你是不可能成为“顶尖高手”的。


    > 所谓“高手”就是勇气多一点、耐心多一点、行动多一点、反省多一点的人！

    > ——房神论道


    热诚的你，可能已经等待得太久，那就让我们快速进入正题，讲解“投资功夫”的“入门技术”。


    ### 无处不在的投资宝藏


    本书所介绍的方法，主要是针对住宅用的“二手商品房”进行投资的，相当于房地产交易的“二级市场”。这类房产存量巨大，市场需求庞大，交易活跃，融资方法灵活；适于各个阶层及地区，资金规模跨度大，风险相对容易控制。


    商业房地产投资方法类似，但不在本书的讨论范围内，但其投资道理都是一样的。


    此外，对于“期房”本书也没有涉及。随着中国房地产市场的逐渐成熟，随着国家宏观调控政策的日益紧盯，期房的投资空间越来越小，风险相对较大；并且，期房的投资技巧其实较为简单。所以，也不在本书的讨论范围之内。


    我们可选择二手房只要具备以下二个主要特点即可：


    - （1）地较好，利于出租或出售；

    - （2）房东想尽快摆脱此房，交易方式灵活。


    满足这两个条件的房产几乎在每个城市都有大量供应。我们敢打赌，你现在所居住的地方，就有很多这样的投资机会。绝对不用“千年等一回”。


    使用本书介绍的方法，你立刻就可以找到多处适宜的房产：而且可以快速判断出该房产的实际市场价值及投资价值。同时，后文将教你一套经过反复锤炼的“话术”，你只要上网查到房东资料，拨打电话，问几个问题，就可以快速确定它的投资潜力。


    ![](img/acb46489adfd772451884bb9efeed060_45_0.png)


    ### “房神式零首付”投资路线图


    本书所介绍的投资方法，基本可以概括如下图示的基本路线。


    ![](img/acb46489adfd772451884bb9efeed060_46_0.png)


    当然，这只是通常情况下的合适方案。具体情况当然还要具体分析，尤其不同的人有不同的投资偏好。这套路线图是房神多年投资积累的终极模式，我们将其称之为“房神式零首付”投资路线图。


    ![](img/acb46489adfd772451884bb9efeed060_46_1.png)


    将其根据资金流转，划分为两套循环，左侧循环为“慢车道”，右侧为“快车道”，概括如上图。


    图中的虚线箭头表示两个环节间没有资金流关系，只是代表要形成一套闭环循环，以表示持续不断的行动。


    “资金流转图”实际上揭示了“房神式零首付”投资手法的基本思路。我建议你将此图手绘下来，结合后文的描述反复领悟，下面将整个过程中简述如下：


    - （1）以租代买：找到利出租的房产，与房东签订“以租代买”合同；按月交房租。

    - （2）升级转租：将该房产升级后转租出去，赚取租金差价，积累自己的现金流；

    - （3）现金积累：重复第（1）及（2）步快速积累多套出租房产，储蓄现金。

    - （4）按揭买入：等现金积累到一定程度后，采取“二手房按揭贷款模式”支付 30% 首后期买入某房产，取得产权。（实际操作中，首付一般会比 3 成稍多。）

    - （5）信用融资：通过信用贷款融资，将第（4）步所支付首期贷出来；每月偿还信用贷款和银行二手按揭贷款。

    - （6）以租代售：将第（4）步所买入房产采取“以租代售”模式出售，让新的买家来承担第（5）步的每月还款。

    - （7）融资转投：利用第（5）步所融出来的信用贷款的资金，再去重复第（4）步，购入新的房产，并进入（5）、（6）、（7）步骤，循环往复。


    请你反复遍分析这套“双循环”过程——两套资金流的循环操作，分别为“慢车道”与“快车道”。现在将两者的特色对比如下：


    表 3-1 “慢车道”与“快车道”投资策略对比


    | | 慢车道 | 快车道 |

    | :--- | :--- | :--- |

    | 投资首付 | 零首付 | 低首付 |

    | 收益取点 | 先经验、后资金 | 资金积累 |

    | 风险程度 | 几乎无风险 | 低风险 |

    | 指导思想 | 零风险持有房产、静待赢利时机 | 多重融资、快速扩张 |

    | 适合的投资者 | 投资新手 | 具备“慢车道”基础的老手 |


    “以租代买”为核心的“慢车道”是整个投资体系的基石，为后面“快车道”循环，提供了“操作经验”与“启动资金”。所以，“慢车道”的指导思想就是“零风险持有房产”，以便“静待赢利时机”。


    顺应该指导思想，“慢车道”应该成为新手的“专业基础课”。学会如何不用自己的资金开展投资——这是所有“投资课程”的基本功。


    > 如果你没钱时赚不到钱，那么你有钱时也赚不到钱。

    > ——罗宾·富安德（房地产投资专家）


    “房申秘笈”所揭示的“招术”，都是基于“零首付双循环”体系建立起来的。所以，你一定要把这套体系深印脑海，它将成为你未来投资之路的导航灯。

