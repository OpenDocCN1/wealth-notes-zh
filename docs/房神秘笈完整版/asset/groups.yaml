    由“归隐”再引申一步，升华出“放之四海而皆准”的投资定律，并揭示房神的投资境界。


    ## 第十二课 “归隐术”——反璞归真的投资境界


    “武林高手的至高境界是什么？”


    读过金大侠著作的人，一定知道“无招胜有招”是“至高境界”的标志：从不懂“招式”，到精通“招式”，最后再变成“忘却招术”——武林高手都需要走过“无→有→无”的螺旋式晋升之路。


    房地产投资也存在这样的规律：


    - 不懂“投资术”、也没有钱的老百姓无法拥有房产、也不可能靠房产赚钱。

    - 掌握“太极术”的可以“借房起步、稳健发展”：借别人的房产来赚自己的钱。

    - 精通“炼金术”的就能“买房融资、快速增值”：借别人的钱买入自己的房产，更快地积累资金。


    但这些都算不上房地产投资的至高境界。


    当你熟悉了“炼金术”后，可以在短时间内购入很多房产。但是实际上，当你拥有的房产到达一定数量后，再想申请贷款就会碰到障碍——因为银行会怀疑你的还款能力：他们可不管什么“以租代售”之类的零成本持有方法。他们只会看重自己的“贷款风险”。此外，此地方也有规定，第二套、第三套房产会提高首付比例。


    同时，你拥有的房产越多，你的管理麻烦就会越多；即使“以租代售”也是如此。只要这些房产在你名下，你就不可避免地要“消受”这些麻烦。


    更重要的是，这些房产虽然净值较高，但都是“不动产”——流动变现能力很差。无法让你真正尝到“经济自由”的生活享受。


    这类投资“招术”有如逆水行舟，不进则退；内外交煎，难以“停车止步”。不提升投资模式，就无法真正的“功成身退”。


    那该如何突破“招术”的瓶颈呢？


    解决之道，就在于“忘却招术”，把投资之道回归本源——“有房”的本源就是“无房”；即通过各种方式，把房产转让出去，使自己“无房一身轻”、归隐幕后。


    无为而治的投资方法，方是大成化境。


    ### 做“银行”——“抵押放贷”获得长久保障


    #### 操作方法——整存零取


    “以租代售”是“借买家的钱来还银行的贷”。另一种思维就是“自己做银行，让买家还贷”。


    #### “抵押放贷”操作案例


    投资者Z用全部现金购买，一次性买入某价值35万的房产。然后发布公告“无需银行贷款，仅需10%首付；即付即转产权。低月供，20年还清。”很快吸引到一产买家Y，双方约定房产价格为40万，年利率为9%，月供3300元。签订购买合同，过户转产权；产权办理下来的同时，立即签订抵押贷款合同并办理抵押登记。


    投资者是否犯傻了？把35万现金押在房产上，仅回收4万元首付，就转了产权。


    且慢下结论，我们可以计算一下投资者Z的真正收益。他与Y约定的年利率为9%，则月供为￥3,239.01，即：

    `=PMT(9%/12, 20*12, -400000*0.9)`


    那么，20年后，Z的总收益为：

    `3239.01×12×20=777362.4（元）`


    如果我们把每个月的收益再存入银行，按“零存整取”处理，则总收益变为￥1,009,421.76，即：

    `=FV(2.52%/12, 20*12, -3239.01)`


    20年的投资收益率为：

    `1,009,421.76÷350,000≈288%`


    每个月有3300左右的现金流。

    由于该房产已经不是你的了，所以你再也不必为它花任何心思，安心地每月享受3300元的自动收益即可。


    #### 财富渊源——何为“百万”


    看起来，这种收益率与“炼金术”真的无法相提并论，时间长，收率小；似乎得不偿失。但这正是需要你改变思维的地方。


    记住，真正的财富不是按“元”算的，而是按“年”算的。财富不是指你有多少钱！而是指你去不工作后，保持现在的生活质量的时间。如果你正常消费水平每个月需要 3300
    元的支出，而且你有 33000 元的存款，那么你的财富就是“10 个月”；而你现在拥有了“房产存折”，可以持续 20 年的稳定现金流入；那么，你现在的财富就是“20
    年”。


    因此，你的 35 万的房产已经转化为你“养老 20 年”的保障；财富的形式转化了，所以你的认知也一定要跟着转变。


    当然，你也可以把钱投资到股票、国债上面。但从资产组合角度来看，你必须留一些投资在房地产上；因为长久的趋势就是“房地产是金矿”，不会随着货币通胀而贬值。而且你的收益率为
    9%，已经远超过一些投资项目的回报。


    此外，越大资本的投入，其要求的回报率越低，而其追求的稳定性越强。所以，你也应该适时改变自己的投资思路，在追求稳健与安全的前提下，获得适当的回报。这是典型的银行投资策略。因为你此时就是“银行”的角色。


    根据这种思路，当你操作“抵押贷款”有三处以上时，每个月就会有 1 万多的稳定现金流。现金流的持续性才是财富的标尺。


    百万的现金要转化为“百年的财富”才有意义。


    #### 执行方略——无为而治


    ##### （1）压缩规模、全额投入


    执行这种策略，你首先要压缩投资规模，从以前的靠量取胜，改为靠质取胜。不要追求“低首付”、甚至是“零首付”，而是扎扎实实用真金白银把房子买下来，记住是全额现款，而没有银行贷款。


    为什么不能向银行贷款呢？因为向银行贷款时，银行要求房东把房产全额用于抵押，而且把“典当”、“赠予”等也屏蔽了（当然“转按揭”可以）；所以，在中国不能搞房产的“二次抵押”。因此，如果你自己准备做“银行”时，就只能一个人掏钱“放贷”了。


    如果买家后悔停止还款，你可以根据抵押登记证明，直接取回房产产权即可，一点风险都没有。由于有抵押登记，所以买家也不可能再转让或是再抵押、再贷款等——当然，如果你同意的话，他就可以二次抵押；但银行不会接受充当“第二抵押”人的角色，所以也不会给他放贷。你相当于捏住了买家的房产命脉。他们只有乖乖还款，要不就还房。


    这就叫“与其给银行打工，不如为自己卖力”。


    ##### （2）收益适当、谋取双赢


    这时，要强调一下，你不能向买房人索取过高的首付及利率。因为首付过高，会弱化买家的吸引力——毕竟买家购买更多的是“融资方案”，而不仅是“房产”。你可以把房产价格适当提高，但不应高于10%（跟市场价格相比）。即40万的房产，你可以出售44万；但你如果出售48万，则会大压抑买家的积极性。


    而利率过高，也会增加买家的压力，甚至打消他们持续月供动力。控制在银行同期利率的1.2~1.6倍之间即可；就是说，按现行的5.814%的银行实际贷款利率计算，你应该设计的利率范围为：6.9768%~9.3024%。当然，利率也不能太低，如果低于银行同期利率，就会失去了对投资者的吸引力。


    ##### （4）借“名”抵押、规避风险


    办理抵押时，实际上就是“以房产为担保，买家向投资者贷款买房”。所以，买家就是“借钱人”，或者叫“债务人”；而投资者就是“放贷人”，或者叫“债权人”。


    在抵押角度来看，买家就是“抵押人”；投资者就是“抵押权人”。为保证投资者与该房产无关的债务关系影响，建议投资者在办理抵押时，把“抵押权人”登记为自己的信得过的人的名字（如父母、老婆、儿女等）。


    而且最好是将不同的房产过户抵押后，分别登记在不同人的名下——真正的分散风险。当然，让买家写“名字（实际）”的时候，把“债权人”也要写成“抵押权人”的名字（实际，“抵押”与“借贷”是合在一起的一份合同，即《抵押贷款合同》，贷款额即为房款）。


    这样，即使投资者因其其他债务关系而需要动用个人财产还债时，该房产的收益也将不受影响地持续流入投资者的手中。因为，从法律上讲，这些房产是“的的确确”与投资者“无关”的。


    这是一种很巧妙、且受用无穷的设计，可以使投资者真正做到“无忧无虑、无为而治”。


    ### 做“老板”——“公司化持有”隐藏房产


    如果你还是舍不得房产升值可能带来的巨大收益，并想将房产作为永久的财富赐福子孙，那你就可以考虑本节所介绍的“归隐术”之二——公司化持有。


    #### 操作方法——雇个“法人”当“保镖”


    其原理很简单：就是把房产以“入股”方式转入公司的名下，由公司“法人”作房产“主人”；投资人以“法人代表”的身份来管理该公司即可。


    #### “公司化持有”操作案例


    投资者W花30000元注册成立“X清洁公司”，W为法人代表；共3个股东，其中一个为W的朋友N，名义出资2000元；另两个股东为W及其父亲，各自名义出资14000元；同时N签署一份无时间标注的协议书，声明“无偿转让所拥有的全部股份给W或其父亲”。然后W一次性支付50万现金，买入房产R，要求房东以“入股形式”过户房产到“X清洁公司”名下（同时也签署了“无偿转让股份协议”）；根据税法规定，“房产投资入股”过户时，除契税外免交其他一切税费。


    W将房产R只租不卖，并通过“成本抵减”作账，降低了出租房产的应纳税额，每个月租金为3600元/月。


    聪明的你，是否看出了其中的奥秘？投资者W的这一系列运作，除卖房外的投资极少，顺利地借助“W清洁公司”实现了降低交易税费、减少持有税费、隐藏个人房产的三重目的。


    “公司法人”是法律赐予老百姓的最好的资产保护武器；在中国，为什么有钱的人反而不交税？就是因为他们懂得借助“法人”来隐藏自己的财产。而普通老百姓因为“无知”，反而成了纳税的“主力”。


    而公司（“法人”）纳税，与“老百姓”（自然人）纳税最大的区别是什么呢？前者是“净利润”作为纳税的计算依据，而后者是“总收入”作为纳税的计算依据；所以“法人”就可以“理直气壮”地通过“成本费用”来抵扣应纳税款。


    比如，一个“法人”与一个“自然人”同样赚了20000元，但是“法人”可以扣掉“运营成本”18000元，剩余2000元纳所得税；而“自然人”则必须按20000元来纳税所得；两者的“计税依据”可相差近10倍。所以，借助“法人”的身份，就可以大幅降低税额。


    房地产投资领域也是如此。“法人”就是我们的“亲人”，更是我们的“保护人”。借助法律赋予“法人”的权利，我们要为自己的投资“保驾护航”。


    ##### （1）降低交易环节税费


    ###### 关于“入股”纳税的相关文件摘录


    “纳税人将房地产投资入股，企业之间合并、分立、重组而发生产权转移……不征收（或免征）营业税……以土地（房地产）作价入股进行投资或联营的，不用征税。但如果所投资、联营的企业从事房地产开发的，或者房地产开发企业以其建造的商品房进行投资和联营的，则要征收土地增值税。”


    根据建设部第96号令《建设部关于修改〈城市房地产转让管理规定〉的决定》第三条，以房地产作价入股、与他人成立企业法人，房地产权属发生变更的，属于房地产转让行为。房产作价入股，房产所有权转移给新成立的企业法人，投资者同时取得股权。根据《中华人民共和国城市房地产管理法》的规定，房地产权属转移应办理房地产权属变更登记并领取有关房地产权属证书。因此，《契税暂行条例实施细则》规定，以土地、房屋权属作价投资、入股视同土地使用权转让、房屋买卖或者房屋赠与征收契税。


    “上方就是相关的法律条文的说明，投资者只要“邀请”房东入股，就可以避开“契税”外的一切税费。而普通商品房住宅的契税仅为 1.5%（具体应纳税务请参看本书《超级工具箱》一课），并且没有
    5 年期限。


    而上面案例中，W 购入房产所交的契税仅为 7500 元。

    好处显而易见。


    ##### （2）减少持有环节税费


    中国房地产税务中，比较偏重“交易环节”而忽视了“持有环节”。相信未来会加强“持有环节”的纳税管理。

    那么“出租环节”需要交纳哪些税费呢？


    ###### 个人出租房屋应纳税费


    - 1、房产税。产权所有人在房产税开征范围内出租房屋的，依照房产余值计算缴纳的，税率为 1.2%；依照房产租金收入计算缴纳的，税率为 12%（月税率为 1.2%）。房产税实行按年征收，分期缴纳。

    - 2、城镇土地使用税。拥有房屋产权的个人；出租的房屋坐落在城镇土地使用税开征范围内的，应按房屋占地（含出租的院落占地）面积，依土地等级及适用的土地等级税额，计算缴纳城镇土地使用税。根据建设状况和经济繁荣程度等条件，每平方米征收
    0.2 元—0.5 元。

    - 3、营业税。个人出租（包括转租）房屋应按照租金收入的 5% 缴纳营业税。

    - 4、城市维护建设税。个人在缴纳营业税的同时，应以缴纳的营业税金额为计税依据，按适用税率缴纳维护建设税。其中：纳税人所在地在城区（含郊区）的，税率为7%；纳税人所在地在建制镇的，税率为5%；其余的为1%。

    - 5、印花税。个人出租房屋，应于签订合同时按照双方订立的书面租赁合同所载金额的千分之一贴花。税额不足1元的，按1元贴花。

    - 6、个人所得税。个人出租房屋，月租金在4000元以下的，应按月租金收入扣除800元费用后的应纳税所得额计算缴纳个人所得税；月租金收入在4000元以上的，按月租金收入扣除20%后的应纳税所得额计算缴纳个人所得税。税率均为20%。

    - 7、教育费（地方）附加。个人在缴纳营业税的同时，以缴纳的营业税税额为计税依据，征收率分别为3%和1%。


    以企业作为房产所有人出租经营的，应纳税额基本与个人出租房产的情况一样。只是在“个人所得税”那里，改为“企业所得税”。


    除“所得税”不计算，我们可以估算出“出租房产”应纳税额的总体比例为（以月为纳税的时间单位）：

    `1.2%房产税+5.5%营业税（包括城/教）≈6.7%`


    则上例中，投资者W每个月出租房产所需要交纳的税费为：

    `3600×6.7%=241.2（元）`


    而个人所得税为：

    `(3600－800)×20%=560（元）`

