    # **零首付技巧一 提高价格，降低条件**


    房东商定，分期支付房款，同时以某高于银行存款的利率按期等额本息还款。这样房东相当于贷款给买房人，买房人无需支付首期，每个月定期还款即可。


    # **零首付技巧二 用才能，而不是钱**


    买方通常具有专业知识，可以用来“交换”首付资金：承包商、画家、园林学家、保健专家、律师、房地产经纪人、保险代理、汽车经销商、商人——所行这些人能够都提供有价值的服务或折扣，可以用来交换首付款。有时，在没有资金的情况，卖主苦力也能对交易产生决定性影响。


    # **零首付技巧三 承担卖方的债务，使债权人成为合伙人**


    在谈判的时候，你需要问一个敏感的问题：“卖主先生，我知道这事与我无关，但是如果我知道你计划用这笔买卖的收入做什么的话，也许我能帮助你解决你的问题。”你希望听到的是卖主计划用自己从这笔交易中获得的钱支付某种债务。如果你能安排承担这些债务，然后将
    come 逐步偿还，你就能避免不得不一下子投入首付款。


    # **零首付技巧四 利用租金和押金**


    房东常常会要求承租人支付第一个月和最后一个月房租作为押租。如果房产售出，那么这些押金就一起转给新买主。除非当地的法律有禁止规定，否则买主可以在结案的时候用这些给他的押租冲抵首付款。


