  md: '# 308 | 考古：考古学的终极研究目的


    # —— 概览29：考古学 ——


    考古学的终极目的是：梳理出遗存的古物在时间和空间上的分布，从而理解历史。通过它，不仅能看历史，甚至可以看今日和看未来。


    考古学是怎样一门学科，想必每个人心中都有一个大概的概念。


    但什么是这门学科的终极研究目的，就未必有人了解。


    如果提及前据的话，终极目的，就是梳理出遗存的古物，在时间跟空间上的分布，从而理解历史。


    这句话非常抽象，我们这节课就要一步一步把这个道理说清。


    # ——▶ 冰人奥茨 ◀——


    我们先来看一个例子。


    在1991年的时候，有一对德国的夫妻在登阿尔卑斯山的时候发现了一具死尸，半截身体冻在冰雪下面，露出了上半截身子。


    作为登山爱好者，他们的第一反应就是这是早先登山失事的遇难者，报警之后搜救队赶紧来。但是先经查看，不像是登山者，倒像是一具古尸。


    所以后续的工作就交给考古学家了，他们把这具男性干尸叫做冰人奥茨。


    ![](img/53a7c268f3a15189714e4eef36c78daf_138_0.png)


    接下来的内容，就是公众普遍对考古是什么的认识细节。


    比如首先测定年份。


    我们之前讲过，考古学最重要的那些结论都强烈依赖于现代科学技术。比如说凡是4万5千年以内的历史，都可以用放射性同位素测年法。


    考古学家测定奥茨的死亡时间距今5100年，他活着的时候身高1米59，体重大约50公斤，他在45岁时死亡，留着长长的胡须，头发浓密，身体上有47处纹身。


    ![](img/53a7c268f3a15189714e4eef36c78daf_138_1.png)


    主要吃的是小麦，牙齿磨损严重。


    毛发中钍元素含量非常高，这个特征跟很多旧时代的时候铜矿中的矿工有相同的特征。


    从他的手指甲生长的终止线可以看出，在他死亡之前的第8周，第13周，第16周正在遭受着慢性病的困扰。


    从 DNA 的测序知道他的眼睛是褐色的，而且还有乳糖不耐受，他是 O 型血，还有关节炎。


    从这些身体特征跟干尸的细节，科学家们还原了奥茨的样子。这个还原，也可以说是最接近新石器时代人类似貌特征的一个还原了。


    ![](img/53a7c268f3a15189714e4eef36c78daf_138_2.png)


    到了这里，你说，这就是考古学的研究结论吗？


    这个当然是结论，这些都属于是直接的测量。只不过有些是肉眼可以完成的，有些是必须利用先进的核物理技术才能做到的。


    但把这些直接测量当作是考古的全部，实在是辱没了这门学问。因为，他还有进一步的研究目标。


    关于奥茨最细致的测量，是在他被发现9年之后才陆续完成的。


    测量还包括了他周身携带的物品。


    比如说他的鞋，底是熊皮做的，鞋面是鹿皮做的，绑腿腰带外套都是羊皮做的，而且还是鞣化过的山羊皮。皮带上还挂着石器跟点火用的火绒。


    ![](img/53a7c268f3a15189714e4eef36c78daf_138_3.png)


    他随身带着很多工具跟武器，一把是为了防水，在表面涂了血的杉木长弓，一把石刀插在刀鞘里，箭囊里有14支弓箭，从箭杆上的羽毛的绑扎方式可以看出，有些是右利手的人绑扎的，有些是左撇子绑扎的。他背的两个树皮口袋，一个里面装着柳树叶，一个里面装着木炭，他手里还有一把斧头。斧柄是木制的，但斧头是铜制的。


    ![](img/53a7c268f3a15189714e4eef36c78daf_138_4.png)


    从他带的石器工具的石头成分可以看出，他应该居住在去世地点附近10公里左右的河谷上游。通过对他胃道微生物的分析可以知道，他最后一次喝的是没有发酵的面包、鹿肉、羊肉和一些蔬菜。从他肠中的粪子可以看出，他去世之前12个小时，都还在那个河谷生活着呢。


    从他装树叶的口袋中可以分析粪子跟叶绿素，分析结果就是，他是在当月6月份的时候出发，然后一去不回，死在外面的。


    # ——▶ 还原谋杀现场 ◀——


    奥茨的死因也很明显，因为这是一场谋杀案。


    他背部中箭，头部还遭到了重击。用X光拍到了从后背射入，然后刺穿他的左肩胛骨的大动脉那个箭头。奥茨试图拔过箭，但是只是拔出了箭杆，箭头却留在了体内。而且很可能是拔箭的动作也割了失血。应该是短短几分钟里，他就因为失血过多昏迷过去。他的前额跟手指头都有被钝伤的痕迹。


    依照这所有的细节，考古学家甚至可以作出下面的判断：


    > 就是在5100年前的某一个6月，奥茨离开了那个河谷，带着准备好的食物跟补给出发上山打猎。


    但是有人跟踪，或者是他跟别人失路相逢，双方便就爆发了冲突。奥茨力战不敌，就往山上退。在山顶附近被歹人用弓箭射中了。


    能够做到这一点，这个对手一定是一个善于射杀的高手。


    而且杀手很可能认识奥茨，这不是一场遭遇战，而是一场不能被别人知道的暗杀。因为杀手把奥茨所有的工具都留在地上了，没有抢回去自己用。所以，杀手说不定跟奥茨是一个部落的人，他如果把东西拿回去，肯定会被族人认出来的。'
