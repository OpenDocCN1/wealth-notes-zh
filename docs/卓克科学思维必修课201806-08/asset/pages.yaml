  md: '# 309 | 考古：读心术与语言


    ![](img/53a7c268f3a15189714e4eef36c78daf_140_0.png)


    309 | 考古：读心术与语言


    # —— 概念29：考古学 ——


    考古学的终极目的是：梳理出遗存的古物在时间和空间上的分布，从而理解历史。通过它，不仅仅能看历史，甚至可以看今日和看未来。


    上节课最后我留了一个问题，就是：


    如果以考古学终极目标的角度，向一个没有任何历史知识的孩子介绍20世纪，你会说哪些内容呢？


    我提几点思路：


    比如说，2万年后我们挖出来的最特别的，应该是石油化工产品、电子产品，他们挖出来的可能是塑料的碎片，或者是石油能源使用过的痕迹，电路的痕迹。


    这些东西在19世纪是绝对找不到的，它们的出现，比20世纪的世界大战、登月，或者 DNA 双螺旋的发现重要得多。甚至从某种程度上说，这两大类产品的出现，是导致历史教科书中那些最重大事件发生的原因。


    除此之外，我们还可以找出一些国家出现的证据，证明人类组织形式突破了血缘的关系。


    那延续这样的思路，从人类物种延续的历史看，哪些又属于终极关注的目标呢？


    其实文化就是这个目标。


    是文化的出现，让人类跟黑猩猩，和早期的直立人区分开来。


    # —— 文化能力 ——


    我们这节课就简单说说，文化是怎么出现的。


    文化很难定义，大致来说是一群人共享的一系列观念和信仰。


    比如男人、女人分别应该做什么，祖先是否重要，如何对待年长的人，怎么惩罚犯错的人，这些观念综合在一起，就是文化。


    能读懂文化，是人类特有的一种能力。可是有一些人把听 screws 莫扎特的音乐，看懂莫奈的印象派画当作是文化，那这种理解就太过苛刻了。


    这些只是细枝末节上的不同，就像有些人听不懂法语，但你不能说他不会说话一样。


    对人类学家而言，世界上任何地区的人，都拥有等量齐观的文化能力，不论他是非洲某个部落的土著，还是纽约的政客。


    这样的观点，并不是为了给人人平等的政治正确观点站台，它背后是有着演化的基础的。


    # —— 读心术 ——


    有文化跟没文化的區別，最好的例子就是黑猩猩，它们完全分辨不出新娘的手捧花和一束花这两者之间的区别，就算反复训练也不行。


    因为对黑猩猩来说，手捧花和一束花，两者之间根本就没有任何物理性质的差异。


    差异只存在于象征性，所以黑猩猩没有文化，而人类有文化。


    理解象征性的核心能力，就是认知其他人具有思维的能力。我们如果简称为这种能力为读心术的话，读心术的能力是分层级的。


    这个层级解读起来有一点像绕口令。


    比如说：


    +   第一级，我知道手捧花和一束花的区別。

    第二级，我知道你在想手捧花跟一束花的区別。

    第三级，我知道你想让我知道手捧花跟一束花的区別。

    第四级，我知道你想让我知道，她也知道手捧花和一束花的区別。

    第五级，我知道你想让我知道，她也认为我们知道手捧花跟一束花的区別。


    这样的逻辑还可以继续往下列下去。


    不过，在人类的日常语言交流中，几乎不会用到超过五级来表达什么了。因为表述的太多，短期记忆已经让我们记不住那么多层级的关係了。


    有的同学可能年纪还小，听到第五级的时候已经有点听不懂了，啧，这就是读心术级别还不够的体验。


    对动物来说，也ermarket 可以测量它们所谓的读心术。


    比如说驯化得很到位的动物，像猫跟狗，你下班一推开家门，满地都是撕碎了的卫生纸和一双被啃烂的拖鞋。你虽然生气，但是还没来得及发作，就看见那只把头深深埋在胸前的狗，它根本不敢跟你对视。


    这狗在平时可不是这样的，只要主人一回来，总是殷切地盼着和人有眼神上的交流。


    那为什么现在这样呢？


    就是因为狗知道你对它撕卫生纸跟咬拖鞋的看法，所以狗的读心术至少是可以达到二级的。而我们看到狗这样，就知道它内疚或者是在认错，所以我们就会在用三级的读心术来理解狗。


    对黑猩猩和其它高智能的动物进行测试就能看到，有的时候某些高智商的动物可以表现出三级的读心术，但是四级、五级，这个地球上只有人类达到过。而且很可能早在20万年前，人类就拥有了这样的能力。


    这种能力让我们知道，小团体内部人们也能知道什么才算得体的行为，也让我们知道远方的人们也知道这些规则。


    在这种能力的驱使下，出现了小的部落、城邦，甚至国家。也出现了宗教、法律和道德。


    文化之所以可以出现，第一条基础就是读心术。


    # —— 语言 ——


    那第二条呢？


    就是语言了。


    语言能力对应的生理基础非常牢固，比如说一个孩子，如果在12岁之前还没有接触过语言，那他一辈子都不会学会任何语言。还有，哪怕是一些智力发育有问题的孩子，也能至少熟练掌握一门语言。


    所以语言的生理基础一定是非常牢靠的。


    依据这个去研究喉咙的结构、脑的发育、基因等等，都可以找到语言的生理基础。


    可是语言，并不简简单单指发出声音，动物的叫声尽管可以表达一些情绪跟意愿，但也不能算语言。只要那些包含了逻辑关系的表达，才能算语言。这些逻辑可以很简单，比如说先后、否定、相关或者因果。


    有一种说法是，对石头做精细的加工，制造 complexes 石器工具，语言也就在这个过程中随之产生。因为科学家们仔细对比过脑部的活动，传统上认为对语言关系最紧密的布洛卡区跟维尔尼克区，竟然在加工工具的时候也有同等强度的活跃程度。如果只看功能性核磁共振的这些图像，是很难分出一个人是在演讲，还是在打造一副石斧的。


    对这样的测试结果，科学家们也有解释，那就是：


    +   制造工具跟说话，这两种行为拥有高度类似的逻辑。

    因为制造工具的时候，我们要事先规划好步骤，然后再以严格的规则按照次序执行。如果执行不到位，要反复地尝试。

