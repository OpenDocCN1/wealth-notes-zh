    # 091 | 起源：人类祖先曾经经历过极端气候？（下）


    长达1300年的寒冷气候，让人类祖先不得不越来越依赖农业生产获取食物，这为农业文明的开端打下基础。而美洲的多数大型动物灭绝，后来到达美洲的人类祖先没有了能够驯化为劳动力的牲畜，限制了农业文明的发展。


