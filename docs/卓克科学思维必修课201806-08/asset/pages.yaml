    很多人以为它是一种专门抬杠、反对的技巧，这是对 “critical thinking” 这个词武断地翻译造成的误解，实际上，它体现的是 “带着高级技巧去审视”
    的含义。


    对为什么会出现宗教，我们本节课继续从演化论的角度来讲。


    比如有这样一种说法，说：


    宗教的直接好处，是让人避免心理压力。


    # ——► 智力的副产品 ◄——


    更可信的解释是，对宗教的信仰是智力的副产品。


