  md: '# 254 | 味道：滋味的好坏没有客观标准


    # ——► 概念25: 味道 ◄——


    味道和现代生活里很多文化元素结合在一起，比如美食、烹调、厨艺等等。但实际上，它是真核生物最早进化出的一批感知世界的信号。所以味道既可以用文化视角理解，又可以从进化视角理解。它的改变曾经强烈影响着物种的存灭。


    # ——● 上节思考题解答 ●——


    上节课我留了一个问题：


    你觉得人类凭借技术优势，在地球上已经得到了足够多、足够高的安全保护，这是好事呢，还是坏事呢？


    我觉得以不同的时间范围看，结果是不一样的。


    # ——► 甜味儿与生存 ◄——


    人类在技术上占据优势之后，失衡的发展不只体现在各种资源的开采上，甚至连我们身体上都能够找到这种规律。


    # ——► 科学带来的失衡 ◄——


    但是谁也想不到，科学这支曾经非主流的文化，在后来形成了那么大一段力量，几乎改变了地球表面每一平方公里的陆地，所以食物对现代人来说无时无刻都是富余的。


    # ——► 课程小结 ◄——


    那这些味道中的知识体现什么科学角度的思考呢？


    气味上的差异，客观上更多地体现有和无，并不体现在好和坏。好和坏只是我们凭主观体验跟文化教育得出的一個综合印象，这'
