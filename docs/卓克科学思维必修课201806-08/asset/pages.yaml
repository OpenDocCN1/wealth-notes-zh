  md: '# 264 | 问答：福中生祸，演化角度看基因疾病


    264 | 问答：福中生祸，演化角度。


    有同学对演化角度看问题很感兴趣，想让我再说一个例子。


    那么这次，我们从一个特别确定的疾病说起，这种病叫做亨廷顿病，它跟阿尔兹海默症有点类似，就是神经性退行疾病。


    # ——► 亨廷顿病 ◄——


    通俗地说，就是：


    大脑的神经元由于某些原因开始死亡了，又因为神经细胞跟其它的细胞生命节律是不同的，它不能像皮肤或者消化道上皮细胞那样快快恢复，于是等待到死亡的神经元达到一定的区域，到达一定的程度，一定的数量，这个人的智力、运动、平衡、记忆，甚至最后的呼吸、心跳、血压也没法控制了，脑就失去功能，生命就走向了终结。


    亨廷顿病在30岁到50岁左右发病，开始的时候精神出现异常，记忆力紊乱，之后会出现动作异常，痉挛，就是肌肉会异常地抽搐。


    有的时候看起来好像在跳一种奇怪怪的舞蹈，所以亨廷顿病也叫亨廷顿舞蹈病。


    # ——► 亨廷顿基因的起源 ◄——


    那说完这个病，咱们再说演化的部分在哪儿，就是这个亨廷顿基因。


    # ——► 亨廷顿基因的作用 ◄——


