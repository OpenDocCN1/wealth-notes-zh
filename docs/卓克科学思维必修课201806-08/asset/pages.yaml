    # ——► 概念27: 袁老 ◄——


    袁老，是每个人都会经历的，但它并不是每个生物都会经历的，有些动物就没有明显的老化，甚至越老越强。了解衰老，是科学地树立世界观必要的环节，它可以让我们更坦然地面对生命的最后阶段。


    生命科学中有些几个功臣，没有它们，可能关于细胞、关于基因的很多知识点，都会变得比现在更加错误复杂，没法理出头绪。


    这几个功臣有一个特有的名字，叫做模式生物。


    研究它们，比研究它们同科的其它物种要简单很多，规律也更容易显现出来。


    它们都有什么特点呢？


    比如说，非常有代表性，它一个就能代表一群。


    比如说：


    +   小白鼠就可以代表哺乳类动物；

    拟南芥就能代表植物界；

    果蝇就可以代表昆虫；

    代表原核生物的模式动物，是大肠杆菌；

    代表真核的单细胞生物的模式动物，是酵母菌；

    代表小型脊椎动物的，是斑马鱼；

    专门用来研究遗传跟发育的，是果蝇和线虫。


    还有，用它们做实验，对人、对环境都很安全。


    除此之外，它们必须生育能力强，一代与下一代的时间间隔时间短。


    最最重要的是，它们表达出来的性状非常明显，分析起来非常容易。


