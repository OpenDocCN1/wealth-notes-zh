  md: '# 251 | 问答：如何用科学研究神话传说？


    251 | 问答：如何用科学研究...


    在听过最近一段科学与文化的课之后，很多同学对科学方法可以用來分析那些在传统意义中并不属于科学体系内的东西，很感兴趣。


    那么借这次答疑，我再给大家举一个例子。


    # ——► 系统发生分析 ◄——


    那就是：


    用科学来研究神话故事，使用的科学方法叫做系统发生分析。


    在任何文明的早期，都流传着各种神话故事，如果耐心分析这些故事，就‘会发现它们大都似曾相识。


    # 举一个例子来说：


    希腊神话里，阿尔忒弥斯是月亮和狩猎女神，她手下管着一大群漂亮的侍女。其中有一个叫卡莉丝托，被天神宙斯看上了。宙斯不仅骗走了她的贞操，还让她产下一个儿子，取名叫阿尔卡斯。


    # ——► 文化认同的源头 ◄——


    通过对神话元素的分析，人们也找到了很多文化认同上的源头。


    # 划重点


    +   1.人类社会中的类似文化这种看起来非科学领域的內容，在利用科学方法分析之后，不仅能带来新的视角，也可能让我们更接近真相。2.利用“系统发生分析”这种科学工具，能够分析出不同文明神话故事的演化与生物演化的特征一致，它们都是在缓慢的演化过程
    中得到或者失去一些元素，神话故事甚至也存在生物学上的“间断平衡点”，也就是说它传播到一个新区域后，原本缓慢变化的演化被加速。


