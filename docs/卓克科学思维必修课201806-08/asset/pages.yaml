  md: '# 263 | 问答：如何测量梦境？


    263 | 问答：如何测量梦境？


    很多人都问过我，关于做梦有没有什么科学上的解释。


    这个问题并不好回答，但是我找到一些资料，可以让我们对如何测量一个对象有更深的了解。


    因为，可测量才谈得上深入讨论，如果我们只是模糊糊地感觉到了，虽然这种对象可以讨论，但讨论终究停留在肤浅的表面。


    # ——► 统计上的结论 ◄——


    医学上测量梦，大家能想到的就是通过多导睡眠图、脑电图、功能性核磁共振等等。这些在我们专栏其它的课里头都有介绍过。


    但是作为普通人，不借助医疗器械，能不能测量梦呢？


    # ——► 测量梦境的入口 ◄——


    # ——► 获取稳固答案的门槛 ◄——


    划重点


    +   1. 如果一个测量对象是比较主观或者误差容易比较大的东西，想要取得更有价值的结果，最好的办法就是做统计，获得统计意义上的结论。 2. 在梦境中，有少部分人能意识到自己在做梦，而人在做梦时眼球的现实动作与梦中是一致的，可以利用这一点，在梦境和现实中搭起一座桥梁，这样测量梦境成为可能。'
