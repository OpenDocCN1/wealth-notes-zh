  md: '# 261 | 心理：心理学为什么一定要科学化？


    # ——►概念26：心理◄——


    心理学科学化的时间还非常短，从经验到知识，从看上去包罗万象到满足可验证可复现的理论，观察这种转变，不仅能知道科学思维是什么，更能在研究人的情绪、行为、心理状态时，获得更稳固的答案。


    这节课我们讲心理学科学化的第二部分。


    # ——♦信度♦——


    信度指的是，同一个对象状态不变的情况下，每次测量前后相差的值大不大。如果很小，就是信度高的表现。


    # ——♦效度♦——


    其次，就是要解决好效度的问题。效，就是有效的意思，这一步的难度其实更大。


    # ——♦科学知识的门槛♦——


    满足了可测量，测量的动作清晰规范，测量的方法有比较好的信度跟效度，那么一个心理学的才到了科学化。'
