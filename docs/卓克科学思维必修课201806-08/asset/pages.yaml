    corresponds to each n-tuple of pure strategies, one strategy being taken for each
    player. For mixed strategies, which are probability distributions over the pure
    strategies, the pay-off functions are the expectations of the players, thus becoming
    polylinear forms in the probabilities with which the various players play their
