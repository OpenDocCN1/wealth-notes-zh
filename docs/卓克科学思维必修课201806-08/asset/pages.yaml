    2.科学技术的巨大进步，让人类的食欲得以极大满足，但人的身体还来不及适应这种变化，这种失衡，成了现代人最大的健康困扰。

    3.味道好与坏的评价，很难与文化影响分开，这类主观评价体系，都是很不稳定的。


