  md: '# 304 | 批判性思维：人为什么会信神？


    # ——► 概念28：批判性思维 ◄——


    批判性思维，指的是在人格平等的状况下，对自己和他人观点做谨慎多角度地思考。它讲究逻辑和理性，是一种高效地积累知识的方法。很多人以为它是一种专门抬杠、反对的技巧，这是对"critical
    thinking"这个词武断地翻译造成的误解，实际上，它体现的是"带着高级技巧去审查"含义。


    # ——► 中心法则 ◄——


    这节课，我们从生物的演化角度讲人为什么会信神，宗教为什么会存在。


    宗教是一个庞大的现象，存在了几千年，没有什么人可以说清宗教为什么存在，存在的 препку可能就是宗教的整个历史。


    但我们还是可以从一个狭窄的角度，也就是生物演化的角度来理解人为为什么会信神和宗教为什么存在。


    这个角度的逻辑是这样的：


    一切事物，都是演化的产物，这个东西越复杂，就需要演化越久。


    出现在生物身上的那些特征，都是经过大批的淘汰才存留下来的，大自然是一个苛刻的会计师，严格地控制成本，哪怕是轻微的铺张浪费，都会遭到严厉的惩罚。


    这种惩罚，就是生物在竞争中被淘汰出局。


    如果一个野生动物习惯性地做某些无用的事情，自然选择就会把生存机会让给它的竞争对手，奖励那些把更多精力投入在生存竞争这些实际作用上的个体。


    不过哪种有用，哪种没用，并不是普通人通过观察就能说出来的。对知识细节把握得越准，越能判断哪些有利，哪些无用。


    比如像孔雀巨大的尾巴，让它不但耗费了更多营养物质维持它的体积分跟颜色，也更容易暴露自己的位置。还有雄性凉亭鸟总是把一些亮晶晶的塑料件叼回窝中。


    这些行为，通过仔细的观察，已经找到了合理的解释。


    不过，还是有些没有太好的解释。


    比如，松鸦就不时跳到蚁窝附近，尽量最大可能弄得浑身都是蚂蚁。


    有人说，蚂蚁是能帮它清理寄生虫，但观察了那些浑身没有蚂蚁的松鸦，发现它们身上也没有寄生虫。


    但起码演化这种科学思维的概念让我们知道，松鸦如果不这么做，它的基因传递下去的成功率会大幅降低。


    至于是什么具体机制导致下降的，有些我们已经知道了，像孔雀，像凉亭鸟，但是有些还有待研究。


    所以，在一个演化者看来，宗教仪式跟孔雀那些鲜艳的大尾巴一样，它非常地耗费精力，主要起装饰作用，甚至还在吞噬着大量资源，但它一定有它存在的原因。


    有些中世纪的大教堂，光建立就花费了500年，可建好后，目的又不是改善居住。还有中世纪跟文艺复兴那些艺术家吸心沥血完成的作品，这些资源表面上看，并没有直接用于延续人的基因，但演化论者相信，它是通过其它渠道起的作用。


    作用的方式，如果举例的话就是：


    动物的行为倾向于，使导致那种行为的基因最大化，而无视那些基因是否恰好处于执行这个行为的动物体内。


    这种理解方式，也被称为"中心法则"。


    处于最优势中心的是基因，而且是那些可以导致特定行为的基因，有的时候，那些基因都不在执行这种行为的动物体内。


    中心法则里说到的基因，甚至还会扩大到文化基因这个概念上。


    # ——► 信仰神的等级 ◄——


    宗教的出现，也可以从文化中心法则来理解，那就是智力的快速发展积累了巨大的生存优势。而发达的智力需要有一个出口，但智力积累的文化果实，又没有发达到抛弃宗教那个级别。所以会缠迷跟宗教上盘根很久。


    我们的祖先在耐力、力量、爆发力、牙齿跟爪子上都大幅落后于自然界的其它生物。而一般来说，这么容易受到伤害的动物，要不就生活在浓密的树冠中，要不就生活在地下下。而人类却生活在稀疏的草原上。


    智力的高度发展，弥补了我们各种生理不足。


    人类祖先会打造复杂的工具的能力，只不过是智力喷涌而出的其中一个出口而已。我们不可能一方面在理解其它的动物的生活规律、植物的成长规律、各种生存技能上，达到传奇般的水准。而在除此之外的其它方面，表现得好像跟失去了思考能力一样，麻木不仁。


    所以，当其它出口表现的时候，当祖先看到女人的月经，思考的结果就是不洁，被诅咒了；当祖先看到日出，就会把它理解成这是希望跟生命；看到日食就是天降惩罚；看到河水流动，谷物丰收，也会自发地去思考其中的原因。


    所以，宗教是灵长类动物智力发达之后的副产品。这种副产品的形态也会随智力成果的进步而提升，所以信神是分三六九等的。


    最初的信神，是那种原始部落的万物有灵论。


    原始人见到任何东西，都免不了针对它们的变换作思考：


    它为什么变呢？


    这种思考集合在一起，就是河水有河神、海也有海神、麦子有谷神、太阳有太阳神。


    这些神都是和一个具体的事物绑定在一起的。


    比这种信神高一级别的，就是在早期出现在世界各地的神的世界。比如古希腊的神话、古罗马的神话、北欧神话、印度神话，等等等等。


    高级就高级在，有些神不再年定实物了，而是基于一些新创造出的概念。比如像地狱之神、宇宙之神、智慧之神、爱神、商业之神，等等。


    它高级就高级在，神与神之间有了复杂的关系，人他们现实中人与人的关系改造之后编织在一起。这些内容跟剧情就算是现在说起来，也是非常有意思的。


    甚至到了今天，1月到12月，周一到周日的名称，还依然保留着那个时期人们信仰多神的痕迹。


    如果再高级一些，就是从犹太教起，后续出现的基督教跟伊斯兰教。如果严格地说，不算那些圣母跟天使的话，那么这些宗教都只有一个神。


    这种形式之所以更高级，是因为很多想象跟设都已经被抽象成一个神。而不论是人类文明的发展，还是一个从孩童到成人的发展，思维能力的进步，都是高度一致地体现在抽象能力上的。


    那么比单一的神崇拜更高级的是什么呢？


    有个专有名词，叫做自然神论。


    自然神论者跟有神论者一样都是信仰一个超自然的智能存在。但自然神论中那个神，它的行为只限于在世界之初设定了宇宙至高无上的规则。自此之后，这个神就不再干涉后续事件了。对世间发生的任何事情不再感兴趣，他们也不会回应人们的祷告，对罪恶，对
    το悔毫无兴趣，不在乎人们怎么想。


    经常有人用科学家也信神来试图说明宗教信仰的科学性。实际上，爱因斯坦那里那个“老头子”，还有牛顿心中的那个“上帝”，和亚里士多德等下的那个“第一推动者”都是在自然神论的背景下提出的。


    如果对神的信仰继续升级，那么就必须要走到无神论了。


    因为用假设根据跟逻辑推演的方式导出的观点，这种做法从16世纪之后逐渐成为了最强大的思维工具。


    如果一个人接受演化论的逻辑，那么这个逻辑中心，必须要否定神的存在。


    因为任何创造性的智能存在，也就是神，它如果可以设计万物，那么它本身也要足够的复杂。而一个足够复杂事物的出现，只能是一个逐步进化过程中的末端产物。作演化而来的创造万物的神，那么它必定就是在后期的宇宙才能出现的。


    因此，它一定不可能参与到宇宙开端的设计。


    # ——► 课后思考题 ◄——


    你认为一个对神有信仰的人，会比一个无神论者更幸福吗？'
