  md: '# 306 | 问答：代孕是否可行？


    306 | 问答：代孕是否可行？


    # 问答


    有同学问，代孕是否可行，有没有需要注意的？


    这个问题虽然简短，但其实现在已经超过了科学跟技术细节的范畴。


    如果简单回答：


    就是有可行之处，但还是需要按照当地的法律要求去做。否则，容易出现各种问题。


    # —— 代孕的定义 ——


    我们先定义一下代孕，因为它分很多种，那在这个答疑中所说的代孕，就是指夫妻双方的精子跟卵子经过试管婴儿的技术培养成胚胎之后，再移植到代孕女子的体内。


    也就是，由另外一个女性完成9个多月的怀孕过程，然后生产出来。这个孩子跟代孕母亲没有任何的血缘关系。


    # —— 商业代孕 ——


    但是，从1978年第一例试管婴儿到现在，绝大部分的国家，包括中国都没有开放商业代孕，主要是法律跟伦理上的限制。


    现在允许代孕的国家有俄罗斯、印度、美国的部分州、澳大利亚、加拿大、英国和一些不育不育比较严重的北欧国家。


    # —— 课程小结 ——


    整个社会对商业代孕的服务评价，跟历史上任何一个新技术的出现，公众对它们的态度都是类似的。'
