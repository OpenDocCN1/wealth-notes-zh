  md: '因为只要保留一点点火种，在下一次抗生素出现的时候，那些大肠杆菌并不会说只留下那十万分之一或者百万分之一，就是那些还没有丢弃耐药基因的那一点点成员，它们留下。不是，而是会幸存远多于十万分之一比例的成员。


    原因是什么呢？


    就是因为仅存的那一点点含有耐药基因的成员，会随处随地地把耐药基因通过自身的质粒，散播给这群大肠杆菌。这些片段虽然在没有抗生素的时候，绝大部分细菌不会捡起来给自己装备上，但一旦抗生素出现了，就会被重捡起来。


    所以，在真实的世界里，细菌是很难被环境中出现的化学物质杀灭的。因为它们曾经经历过风风雨雨，总是有些少数派保留着不久前的抗性基因片段。这些片段提供了足够多的解决办法，这些办法平时不用则已，一旦用，就纷纷贡献出来，保证整个群落的数量很快恢复。


    你可能要问，为什么不能一个细菌把多样的生存技巧对应的 DNA 序列都囊括在自己身体里，以备不时之需啊？


    原因还是开头说的那条，因为当多种技能出现之后，DNA 的序列也会变长，这在复制的过程中，身体上其它材料都准备好了，却需要长时间地等待 DNA 复制结束，这种等待对细菌来说是致命的，别的细菌会在几个小时之后以几百倍的优势把这些面面手细菌竞争出局。


    那你说，为什么不能复制得快一些呢？


    这个根源在于，做 DNA 复制工作的这些工人不够多。


    那为什么不够多呢？


    这个就要谈到这个系列的根源了，就是能量不够多。


    那为什么细菌不够用，真核生物的细胞就够用呢？


    这些我们放在下节课说。


    # ——▶ 课程小结 ◀——


    这节课，我们可以从中得到什么关于生命科学的思考呢？


    那就是有很多问题，比如像细菌为什么那么小，细菌的 DNA 数据为什么大多是能派上用场的，为什么细菌的 DNA 序列那么短，这些问题，都是可以从能量的角度得到解释的。


    # ——▶ 课后思考题 ◀——


    为什么耐药菌一旦在人群中出现就很难消除呢？


    如果你想到了，就留在评论中。


    划重点


    1.不同的能量获取方式，演化出了不同的生命形态：有DNA序列短，但能够更快速复制，只保留少数抗性基因片段，但能通过质粒进行基因平移应对危险物质的细菌；还有意外获得线粒体的真核生物，过于充足的能量，演化出了更多的生存策略。


    2.人体总处于能量过于充沛的状态，就会产生更多自由基，造成细胞出现损伤，所以轻断食，或者说适当地保持饥饿状态，对身体是有益的，有助于抵抗衰老。


