  md: '# 246 | 问答：什么是演化的价值观？


    246 | 问答：什么是演化的价...


    上次答疑留了几个问题：


    # —— 幂率分布 ——


    一个就是幂率率，这是说到排在前1%的人用掉了全部教育资源的1%的经费。


    那这是怎么来的呢？


    算一下就可以知道，如果平均分的话，前1%的人应该用掉全部资源的1%才对啊，那么现在用了1%，就说明这部分人拿到资源高于平均值的10倍。


    这种类型的分布在生活中也被称为二八定律，当然，如果说成一九定律也没有什么问题。


    这种分布就叫做幂率分布。


    比如说全年90%的啤酒都被那些最能喝酒的前1/10的人消费掉了。还有公司里，90%的工作都是被那些10%最辛苦的员工做完了。


    幂率的分布还有一个特征，就是不论你在任何尺度下看这个分布，都是呈现出大致类似比例的。


    比如说，虽然全年90%的啤酒都被最能喝酒的那1/10的人消费掉了，你如果去看剩下来10%的啤酒对应的90%的人，也会出现这样的规律。


    这个就是幂率比较有意思的地方。


    那什么情况才能出现幂率呢？


    有两个比较重要的条件：


    一个是样本之间互相不独立，比如需要喝酒的人就越容易凑在一起喝酒，他们如果不互相影响的话，独自饮酒是不会喝那么多酒的。工作中也是这样的，最老实肯干的人是最容易吃亏的，老是被那些偷懒的人使唤。


    第二个条件就是，统计对象对每个样本来说几乎没有上限。


    什么意思呢？


    比如像全年啤酒产量对任何一个单个人来说，就算是他酒量再大，也都可以当作是无限大的供应。那一个公司所有的工作量对于任何一个员工，哪怕他再勤奋，那量都是无穷多的。


    这两个条件同时具备的时候，幂率分布就会出现了。


    相比于身高这种正态分布来说，幂率分布很不一样。为什么？


    因为正态分布里，没有这两个条件。


    比如说每个人身高多少，跟其他样本，跟其他人是没有关系的，而且生理极限可突破的天花板很低，你不可能有很大的空间长高，基因已经把我们限制死了。


    那么这些就是关于幂率的分布。


    # —— 演化的价值观 ——


    上次答疑，还说到了演化的数值分析，这指的是演化算法，也就是利用处理器模拟演化的过程，寻找一个复杂问题的解。虽然这个解找出来不一定是最优解，但起码是一个排在不错位置的解。


    这个算法不是很新，最早是由图灵提出来的，只不过那个时候计算机的运算能力不够，所以图灵当时的想法只停留在纸面上。


    在1970年代，这个演化算法才出现。


    举个简单的例子来说：


    如果让一个机器人走一个迷宫，应该设置什么样的行动规则才能让它最快地走出迷宫呢？


    这就是一个复杂的问题。


    首先，这个迷宫就是随机生成的，所以问题就有无数种。


    如果用传统的数学方法，可能先要把迷宫的情况给分类，再把机器人的初始条件分类，然后把遇到障碍之后的选择再分类，把遇到路口之后的情况再给分一下类，那么想法找到最优的解决证明它。


    这就是一种传统的思维，自上而下的思考方式。它有可能在问题难度不大的时候，最终我们会得到一个非常详细的理论体系，知道一共有多少种解，哪种解最好，每种解将最终导致走迷宫的效率怎么样。


    此后，关于走迷宫这件事情因有了自上而下的体系，所以不会再有任何的疑问了，全部的可能性都已经包含在这个自上而下的规律中，描述完备了。


    但我们也可以自下而上地去找解，比如说我们的机器人从当前状态过渡到下一个状态，一共有15种可能。如果这15种用 ABCDEFG 这么排下去就是 A 到 O。那状态的变化就意味着走了一步。


    我们希望机器人可以在100步之内走出这个迷宫，之后就可以开始运算了，就是每个机器人全部的行动计划就是这100步到底填什么字母，每一步有15种选择。


    所以，对单个机器人来说，它的生存之道就是100个从 A 到 O 的字母排列。'
