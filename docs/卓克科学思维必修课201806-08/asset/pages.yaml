    这是复习手册的第二篇内容，我们回顾“模块二：演化与认知”。我特意为你制作的这份“复习手册”，你可以用来回顾自己是否掌握这些关键知识，如果不是很熟悉的话，可以直接点击“每一节课的标题”进行复习。


    # ——► 模块二：演化与认知 ◄——


    在中国，进化论是一个被误解的概念，它被理解为有目的性、方向性的，甚至自从传入中国的第一天起，就是革命的理论依据，而并不是一个新的生物领域的思想，这是我们接下来的一个星期要破除的。


    除此之外，进化论（演化论）在科学界的讨论已经远不止限于生物领域。可以说，凡是符合下列特征的集合，都可以用演化的角度去理解：


    由许多个个体组成，每个个体随环境的改变而改变/淘汰。


    所以生物、语言、社会、道德，都多少符合这些特征。所以在这个模块的后半部分，我将教你如何用演化的眼光理解人文领域的现象。所以这个模块将是一个跨界的认知升级。


    # 概念09：真理


    科学结论不等于真理，科学中也不存在真理。世界上的事物，人类能用科学进行解释的很少，其中解释水准最好的，也只是尚未被证明存在错误而已。


    # 061 | 真理：达尔文的进化论又被推翻了？（上）


    进化论的许多误读被广为流传，最典型错误：生物进化是从简单到复杂，由低等到高等、优胜劣汰，适者生存。而《物种起源》与宗教的矛盾，本质是权力之争，是争夺对世界解释权。


    # 062 | 真理：达尔文的进化论又被推翻了？（中）


    “适者生存”的真正含义：生物在自然界会自发地出现很多难以预料的性状变化，它随机产生，而环境的变化也是随机的，生物能否适应环境，靠的只是运气，而不是主动去适应变化，进化没有方向，也没有终点。


    # 063 | 真理：达尔文的进化论又被推翻了？（下）


    进化论是一个去寻找生命演化规律的科学理论，它一直在变，一直在更新，每一次更新都比之前更准确，更有依据，更符合观测的结果。


    # 064 | 真理：导致新进化论大幅更新的一基因平移


    科学家在通过“基因树”研究生物的演化历史和规律的基础上，发现了生物间的“基因平移”现象，生物进化不仅源于基因突变，还源自不同物种间的基因交换。人类的基因中，已有8%被确认来自其他物种，还有40%存在嫌疑。


    # 概念10：起源


    一种事物或规律的出现，或者是因为有着强大的需求，或者是因为大面积灭绝后的幸存，或者是因为随机的涌现，这些就是“起源”的主要三种方式。从这三个角度，不但可以看到生命的诞生，一样可以看到物种的灭绝。


    # 079 | 起源：地下4000米居然也有生物


    地下深处依然存在生命，颠覆了人们以往对生命的定义。但生命的存在形式依然有一个主线，那就是“用什么方式获取能量”，因为这个规律的存在，我们就可以顺着它寻找更多生命的可能性，也同时能别除掉那些过分的幻想。'
