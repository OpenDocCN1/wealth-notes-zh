  md: '# 复习+预告 | 心理学的科学化


    复习+预告 | 心理学的科学化


    # ——▶ 下周课程预告 ◀——


    # 关键词：心理


    心理学科学化的时间还非常短，从经验到知识，从看上去包罗万象到满足可验证可复现的理论，观察这种转变，不仅能知道科学思维是什么，更能在研究人的情绪、行为、心理状态时，获得更稳固的答案。


    # ——◄ 本周课程复习 ►——


    # 概念25：味道


    味道和现代生活里很多文化元素结合在一起，比如美食、烹调、厨艺等等。但实际上，它是真核生物最早演化出的一批感知世界的信号。所以味道既可以用文化视角理解，又可以从演化视角理解。它的改变曾经强烈影响着物种的存灭。


    253 | 味道：苦味儿与生存


    +   1. 人类食谱外的苦味儿大都含有毒素，食谱内的带苦味儿的食物都是无害或者毒素含量极低的。 2. 人类对苦味儿比其它4种味道更敏感，是因为口中负责感受苦味儿的受体有25种，其它4种味道的受体只有5种。
    3. 激烈的生存斗争在自然界是普遍存在的，演化出毒素的植物得以生存，演化出识别毒素能力的动物得以繁衍。


    254 | 味道：滋味的好坏没有客观标准


    +   1. 人类热爱“甜味儿”，源于它几乎等同于营养和能量，在漫长的历史中，食物一直是在“充足”与“短缺”之间交替，尽量多地吃“糖”，才能应对食物短缺期，获得生存优势。
    2. 科学技术的巨大进步，让人类的食欲得以极大满足，但人的身体还来不及适应这种变化，这种失衡，成了现代人最大的健康困扰。 3. 味道好与坏的评价，很难与文化影响分开，这类主观评价体系，都是很不稳定的。


    255 | 味道：口味改变命运


    +   1. 口味的评价，太过复杂，无法用科学规范去量化，它不可避免地会因为文化背景或情感倾向形成主观判断，这没有对错可言。 2. 在现代食品工业出现之前，一个地区的食材就是由当地的地理条件和气候决定的，并长期保持稳定，传统的味道也就成了当地人会高度评价的味道，熟悉就是好吃。
    3. 对食物味道的识别能力，决定着一个物种的生存和灭亡。虽然现在我们都用美食文化的角度去理解味道，实际上味道蕴含着和生死紧密相关的内容。


    256 | 味道：抵抗不住的食欲


    +   1. 人类对于好味道的追求，并不是一种高级的文化产物，而是几亿年来生物演化出的生存本能，对于食物的渴望，在身体和心理上同样强烈，这是我们很难抗拒美食的根源。
    2. 食物是一切其它活动的基础，徘徊在饥饿线上的那些人，唯一可做的事情，就是寻找食物，其它所有的思考、娱乐、幻想等高级的心智活动都会暂停。


    # 答疑时间


    257 | 问答：良药苦口利于病吗？


    +   1. 相对“良药苦口利于病”，古人真实想表达的是“忠言逆耳利于行”，实际上，古人对致病的原理根本就不清楚。 2. 在人类的呼吸道、鼻黏膜、肺部都有苦味儿受体，只要与异物结合，纤毛就会马上产生摆动，味觉细胞会释放一氧化氮，通过机械和化学两种手段对异物进行“双杀”，这比免疫系统反应快很多。
    3. 在酸、甜、苦、鲜、咸中，人类感受“苦”的能力最强，在于它不仅用于识别有毒物质，还起到辅助免疫系统的作用。


    258 | 问答：针灸可以治病吗？


    +   1. 现代医学中，针灸疗法的研究只针对“止疼效果”，其它疗效，在主流科学界尚不被认可。 2. 针刺止疼效果，全球水平最高的研究集中在美国各大医疗机构，目前为止，主流结论是“不比安慰剂有更好的效果”。
    3. 针刺止疼的研究，找到了一些有价值的方向，比如针刺会让细胞产生腺苷物质，针对它的产生，也许会有其它药物被研发出来。 4. 古代思辨哲学体系下，结合模糊感受凭空想象的理论，无法测量，永远不会被科学体系接受。


