  md: '# 290 | 衰老：从线粒体角度理解性别的出现


    290 | 衰老：从线粒体角度理...


    # ——概念27：衰老——


    衰老，是每个人都会经历的，但它并不是每个生物都会经历的，有些动物就没有明显的老化，甚至越老越强。了解衰老，是科学地树立世界观必要的环节，它可以让我们更坦然地面对生命的最后阶段。


    上节课，我们讲到线粒体必须跟细胞紧密配合，否则生物就会遭殃了。


    如果具体举些例子呢，比如像呼吸链上，有两种蛋白质需要在结合点上结构高度地匹配才能传递电子，才能维持呼吸。


    这两种蛋白质，就是细胞色素 c 和细胞色素氧化酶。


    前者是由细胞核内的 DNA 图纸制造的，而后者是由线粒体上的图纸制造的，如果不匹配，电子没能传递下去，自由基就会聚集在线粒体膜附近，把线粒体氧化出一个大洞，与此同时，膜上的电势消失，细胞色素
    c 释放出去了，这个信号物质就会导致细胞膜执行凋亡程序，这是很危险的。


    # ——千奇百怪的性别——


    如果单看为什么要出现性别呢？


    这确实也有很多解释，比如说真核生物的 DNA 因为在细胞之内，所以没法像细菌那样精简自己的 DNA，把劣质的、用不上的抛弃掉，劣质基因容易保留在上面。所以如果继续维持细胞那样的1分为2，2分为4的无性繁殖方式，那么由突变而出现的劣质基因就会在细胞核内不断地积累，没有办法优化。


    # ——从线粒体理解性别——


    在各种解释中，有一种是从线粒体来理解性别的。


    这个逻辑是这样的：


    首先一个事实，那就是线粒体这种东西在一个细胞中只能来自一方，而不能是多方的线粒体混在一个细胞里。就算是最初有其它个体的线粒体混入了，也会马上被销毁掉，最终还是只留下一个来源。'
