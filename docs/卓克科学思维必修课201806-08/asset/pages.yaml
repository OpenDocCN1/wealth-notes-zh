  md: '# 298 | 批判性思维：有什么用？


    # ——► 概念28：批判性思维 ◄——


    批判性思维，指的是在人格平等的状况下，对自己和他人观点做谨慎多角度地思考。它讲究逻辑和理性，是一种高效地积累知识的方法。很多人以为它是一种专门抬杠、反对的技巧，这是对
    “critical thinking” 这个词不断地翻译造成的误解，实际上，它体现的是 “带着高级技巧去审视” 的含义。


    这一系列课，我会给大家讲批判性思维。


    这是现代人必备的技能，说得通俗一点，这项技能让你在争论，甚至吵架中占尽优势。


    我们当然要讲求合作共赢，但工作中总是有一些事儿是一定要分出对错的，这时候如果你大脑早已熟悉了批判性思维的套路，很多不合理就会被你抓住，这种能力就就算不专门用来跟人争论，也是构建一个人世夏观的重要工具。


    比如，对欧美人比较敏感的问题，上帝是否存在？


    # ——► 强有力的反驳 ◄——


    上帝不存在这个结论，并不是通过我们自己思考之后得到的结果，只有那些我们完全不熟悉的结论，和我们已经熟悉得不能再熟悉的结论，对它们的反思，才能体现一个批判性思维能力的强弱。


    举一个例子：

    很多人为在争论的过程中，都会说这样的话，说 “存在就是合理的”。


    通过这样的话说出来，是为了堵住对方的嘴。之前对方一定说了一个从道德，甚至在法律上来说都是严重越线的事情，对方认为这样的事不能再出现，不能再容忍了。


    # ——► 思维中的漏网之鱼 ◄——


    有很多结论，在我们还没有建立起批判性思维的时候，就已经被纳入了大脑，于是它们就成了漏网之鱼。


    这方面最典型的例子，就是各种政体形式中，对社会价值导向性的宣传。


    # ——► 批判性思维最强人群 ◄——


    不得不说，批判性思维能力最强的人群是从事科研的那些人，这是因为，他们本身就是一群经过了 N 轮智力、耐力筛选过的人。这些人在今后工作岗位上长年累月都在做的事情，就是给同行挑毛病，用他们经过
    N 轮智力和耐力筛选的大脑，给同样优秀的同行挑毛病。


    # ——► 批判性思维的益处 ◄——


    那如果一定要找出批判性思维有什么益处，我可以给你举个例子。


    比如某一个名人曾经在演讲中说过这样的话：

    我们曾经毫无准备地错过了面临的实际挑战，现在我们应该考虑勇敢地放弃所有的努力。'
