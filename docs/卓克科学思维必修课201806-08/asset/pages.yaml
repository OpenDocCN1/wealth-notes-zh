    # 100 | 起源：全球物种大灭绝为什么会发生？


    物种大灭绝，是地球上最显著的事件，6500万年前是陨石撞击，2亿年前是地壳运动火山喷发，但3.6亿年前没有发生任何大灾难，只是陆地和海洋都被几个少数物种霸占，它们迁徙到哪，其它物种就慢慢灭绝，所以，我们也许正在走3.6亿年前的老路。


    # 103 | 起源：保护动物的意义是什么？


