  md: '# 282 | 问答：“最有效的驱蚊药”是怎么被确认的？


    282 | 问答：“最有效的驱蚊... ↓


    又到了蚊子出没的季节，后台很多留言都是问哪种驱蚊药最管用？


    其实如何防蚊的内容，我曾经仔细说过，答案就是：


    用 DEET 浓度比较高的驱蚊水。


    在一些科学素养不高的地区，卖的驱蚊水有一个怪异的现象，他们统统把驱蚊液中的 DEET 浓度调成5%左右，甚至有些还在宣centes：安全，不含 DEET。


    要知道，真正有效的驱蚊液，DEET 浓度总的要有30%以上才行，这大约能提供4小时有效<|message|>的防护时间。如果追求更好的防护的效果，60%浓度，80%浓度的都是可以选的。


    可能有人会说，不对啊，我用的7%的那种驱蚊水挺管用啊。


    那只能这样理解了，就是你没有用过真正有效的，如果你用过60%浓度的驱蚊水，你就会切身感受到，什么才算真正的“管用”。


    ——什么叫“有效”？——


    面对有没有防蚊效果这类问题，其实也是需要从科学思考来判断的。


    因为蚊子本身就是极其不确定的因素，我们都在室内，飞进屋子里的蚊子本来就不是成千上万，单个一两只，所以没有统计规律，那就一定会有很大的随机起伏。因为我们不知道，这只蚊子之前是不是刚刚饱餐了一顿，它叮了人或者没叮人，自然就不能成为驱蚊液是否有有效的依据。


    那我们来说说科学的思路是怎么找到最有效的驱蚊液的。


    如果这个问题交给普通人，我想，大致的思考就是这样的：


    +   找出 N 种有可能对驱蚊有效果的成分，挨个试，蚊子尽量多准备，用大规模的数量抹平随机起伏。比如像酒精、食醋、辣椒水、肥皂液，等等等等。


    当然，这些想法已经比随口一说，我觉得什么什么可以防蚊，可靠多了。最终得到的结果，也有了不一定程度的可量化，可复现的特征。但这样依然属于相当初级的研究思路。大致是生化学出现之前的模型了，早就被研究驱蚊水的机构抛弃了。


    那么，现在最前沿的方式，寻找驱蚊成分是怎么做的呢？


    其实就是一种自上而下的方法，就是从生理结构找到让蚊子不愿意靠近的原因，然后针对这个原因入手，主动地设计药物分子。这种思路，和现在在世界上各大药厂从发病原理设计药物，是相同的。


    这个研究是这么做的，是从 DEET 入手，因为这东西确实经历了70年的时间，最早是美军为了战士们在丛林作战，避免大面积感染疟疾、登革热、黄热病、乙型脑炎而设计的驱蚊药。


    但是这种药有些缺陷，一个就是会溶解塑料，第二是挥发性强，总需要不断地涂抹。


    当年设计时并没有把起效原理完全搞清，只是可以确定这个效果很好，对人体又足够安全，于是就这么大规模地用起来了。


    现在的思路是：


    起码经过70年时间，证明它足够有效，那可以站在这个结论的巨人肩膀上，继续把从前没有弄清的问题找到根源。找到它的起效原理，看能不能针对性地设计出更好的药物。


    实验用的是果蝇，它和蚊子在嗅觉上大致类似，但因为我们对果蝇的了解几乎渗透到了它体内每个细胞，所以用它更可能找到原因。


    果蝇也是非常讨厌 DEET 的味道。


    一种味道是会吸引昆虫还是驱逐昆虫，是由一套神经反馈系统完成的：


    +   气体分子会和昆虫鼻子上一种或者几种嗅觉受体结合，一旦分子跟受体结合，放出电信号；

    电信号传到触角叶，这里再把信号传到脑部特定的嗅觉中枢；

    嗅觉中枢对这类电信号处理，输出的结果，就是一连串的肌肉动作，这些动作，有可能是扭头就跑，也有可能是被吸引越来。


    果蝇的嗅觉受体很多，到底是哪部分被激发了呢？


    当年研发出 DEET 时就是卡在这里，没有继续下去，只是得到结论，DEET 并没有伤害到蚊子什么，好像蚊子只是单纯地非常厌恶 DEET 的味道。


    这次科学家们使用了转基因和荧光蛋白标记结合的方法，找到了问题的答案。


    简单来说，就是先把果蝇的基因转一下，插入一段新的基因，这段基因在特定条件下会表达出一种蛋白质。这种蛋白质比较特殊，它会发荧光，所以一旦表达出来，就很容易在显微镜下观测到，一旦显微镜里出现了荧光，那就说明，那个特定条件已经被触发了。


    那是什么特定条件呢？


    这个条件就是钙离子浓度大幅提升。


    而这个条件在神经细胞中往往代表着持续的神经元兴奋。


    而且科学家们设计了另外一种小分子，它可以跟钙离子结合，结合之后就会因为结构改变了，就会嵌入细胞核中，一旦它进入细胞核，就会开启 DNA 上那段表达荧光蛋白的基因。


    这个过程有点复杂，但这项研究超乎以往的水平，最核心的部分就是这里，如果简单地说就是，科学家们用精巧的方法，侦测出到底是哪些神经元会对 DEET 这种成分的出现产生格外的反应。


    最终的结果就是，它是果蝇触角上一个叫球囊的部分，这里一共有3个凹陷的空腔，其中一个对 DEET 出现了强烈的反应，这里后来被起名 Ir40a 神经元。


    接下来，就是想法增强 Ir40a 神经的兴奋度了。


    这要怎么做呢？还是用 N 种化学试剂挨个试吗？


    不是的，而是用研发药物大致类似的方式：


    就是用数学模型来运算，作初筛，把现在已知的44万种挥发物质，和当前在用的有效的驱蚊成分作对比，就从这44万种挥发物质中找到100种有可能有驱蚊效果的成分。


    然后给蚊子们试用，看看哪些会让荧光蛋白表达得最多。


    最终从中筛出了4种化学成分。


    这几种效果都至少不比 DEET 差，而且还有 DEET 无法比拟的优点，比如说不会溶解塑料，气味也温和，这4种里还有3种有葡萄的香味儿。而且，这些成分还都是安全记录很不错的。在
    FDA、世界卫生组织、欧盟食品安全局都是被认定为安全的，其中有一种甚至还被允许添加到食品中，这些都是 DEET 比不了的。


    就这样，通过站在巨人肩膀上的递增，科学家又找到了另外4种比 DEET 更好的驱蚊成分。


    而这个时候，我们反现传统略带科学思路的方式，就是那种大规模筛选的方法。


    首先，我们已知已经有44万种挥发物，那么每种都要做大规模的双盲对比实验。


    这实验怎么做呢？


    你可以看我放在资料里的这张图，就是做一个透明的笼子，然后人把手伸进去，上面还有一个摄像机，用来统计单位时间内，落在人手上的蚊子数量，如果这个蚊子停落的时间超过30秒，就代表它吸了一次血了，然后把吸血的数量统计下来，这个就能代表这种挥发性物质驱蚊的性能了。


    ![](img/53a7c268f3a15189714e4eef36c78daf_81_0.png)


    你看，如果按这个过程，44万种化合物，每次实验相隔20分钟的话，每天做12个小时实验'
