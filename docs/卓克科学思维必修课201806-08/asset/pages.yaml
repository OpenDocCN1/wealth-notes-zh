  md: '# 300 | 问答：搜索引擎改变了人的思考习惯？


    同学们在后台经常问我一些关于搜索的问题，比如说，出现一个问题，我是怎么在网上找到靠谱答案的？


    其实这个问题我在之前第22节课答疑的时候已经详细说过了，如果你还不知道，可以翻回去看看。


    还有同学在这基础上问：


    +   - 是不是说有了搜索引擎，我们自己需要记住的东西就更少了呢？

    - 是不是每个人都因为百科网站的存在，而差不多也成了百科了呢？


    这次答疑我们就说说这个话题。


    # —— ◆ 知识替代 ◆ ——


    实际上在搜索引擎出现之前，甚至在文字跟书籍出现之前，我们的大脑就一直在往一个方向发展，就是尽量把专业的信息分递给专业的对象处理。


    比如说我们生活在2万年前，我一样会记住，这个人打兔子有一手，那个人搭帐篷很灵。那当我出去打猎的时候，我会找他同去，当我需要搭帐篷的时候，我也会找对应的%


    这些专业人士的出现，就分摊了我们大脑的负担。我不用太精益求精地掌握守护祭祀的技巧，也不用太心关注帐篷怎么搭才能稳固耐用。


    # —— ◆ 思考资源的重新分配 ◆ ——


    互联网不仅取代了这些专业人士，甚至也一部分取代了我们本身的记忆功能。


    很多从前对个人来说是至关重要的信息，现在已经不再重要了，很难再出现什么事情必须让我们格外提起精神，努力记住的。


    不过，刚才这段话只是思辨式的分析，科学结论是不能这么下的，甚至说，只要是结论，都不能这样说。


    但这些感觉又是很有价值的，它的价值就在于：它触动了我们思考的某一点，激发了人们继续思考下去的兴趣。这时候我们只要抓住这个兴趣点，动用科学手段做实验，看看到底是否存在这样的效果就可以了。


    这样的实验也有很多心理学家在做，比如说哥伦比亚大学跟新斯科舍大学的几位学者，就做了这么一个心理实验，来验证网络的出现，会不会让我们记住信息意愿下降。


    他们找到一批受试者，给他们一份纸质材料，上面写着40条好记的简单事实。


    被试者分成两组：

    一組在他们录入 Word 之前就告诉他们，之后这个 Word 不用保存，因为这些文件会被删除的；

    而另外一组，在他们录入 Word 之前就告诉他们，这些文字会被保存下来的。


    结果等他们录完之后，对他们进行测试，就是让他们回忆，之前录入的到底是哪40个知识点，把它们写下来，看看还能记得几条。


    所以你看，只要有互联网存在，人们总是倾向于不再花成本记住这些信息，哪怕是被强制要求记住，记忆效果也比没有互联网存在的时候更差。


    搜索引擎的出现已经改变了我们的思考习惯。


    而且，搜索引擎甚至都影响到我们的性格了。


    这个实验是哈佛大学做的，被试者分成了两部分，他们都要接受一次问答题的考试，考的都是一些具体的知识细节。比如说尼罗河的长度是多少，阿佛加德罗常数是什么意思，等等等等。


    +   - 其中一组，可以使用搜索引擎；

    - 而另一组不允许用，只能凭借自己的知识储备来回答。


    结果就是：

    之前答题中，可以使用搜索引擎的那组人，拥有更高的自尊，那在外表就是更加自信，更倾向于认为自己之所以能做出那些题，就是因为他们本身能力比较强。


    所以，搜索引擎会改变人类，这话不虚。


    我们从不得不记住大量特定的具体知识慢慢转变到，把注意力和记忆力这些思考资源更多地分配给这样的問題：

    在网上哪裡可以找到更好的答案呢，或者哪些查证的工具比较好用呢？

    哪种云端同步的时候最好用？

    或者哪种笔记软件用来回馈旧知识效率最高？

    或者微信的收藏文章要怎么分类？

    等等这些新类型的知识跟技巧。


    这些内容，也是需要记下来才能熟练应用的。


    好了，这次的答疑就是这样。


