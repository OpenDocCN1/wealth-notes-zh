    312 | 问答：医院自制药是不是...


    # 问答


    有同学问，微信群里头有卖各种大医院自制药的，这些大医院像科研所的，协和的，说这些药都是医院内部研制的，不能外流，效果特别好。他就问，能不能买呢？


    这个问题简单地回答：


    即使真的是这些医院的自制药，也不要买，这些药的效果一定是不同同样功能的正规药厂生产出来的药的效果好的。


    如果细致来说，各国都有医院的自制药，但是中国的情况非常特殊。


    # ——► 国外的自制药 ◄——


    我们先说国外的自制药，它基本都是大包装拆成小包装，比如之前原包装是1000片一瓶的，那给患者不能开那么大的剂量，所以拆分成20瓶，50片一瓶。


    这么一做，因为更改了药品的包装，说明书也得补，所以这就属于医院的自制药了。


    再比如像消毒剂，买回来的时候一定是高浓缩的，要正常使用，比如说稀释100倍。那医院买回来之后，做医疗用的时候，它既不是原包装，也夹了其它的溶剂，所以也属于是医院的自制药。


    但发达国家的自制药，也仅限于刚才说的这些情况，所以并不是什么太大的问题，监管上也只是在流程上把控一下。


    # ——► 自制药的门槛 ◄——


    中国的自制药情况就复杂多了，总体上说，管理的方向是不鼓励医院再做自制药了。


    通过什么手段来不鼓励呢？


    就是逐渐地用卡现在药厂的标准去卡医院的自制药。所以，最终医院的自制药会随时间推移越来越少，甚至在30年后完全消失。


    医院的自制药最早出现是跟当时的医疗条件紧密相关的。上世纪80年代的时候，病患非常多，药非常少。那时候的医院要想批发药，就得像抢宝贝一样去抢。国家为了缓解这种供需不平衡，给一些实力比较强的大医院开放了极限，他们可以根据自己的需求配一些药。那个时候的药几乎全都是中成药。


    可能有些人还喝过，就是医院会把中药方子熬成汤，提出煎好，再去除一部分水分，也就算浓缩了，给它装成袋，这种装袋的药就像装装的奶一样，存好了之后有病人需要，就直接出售。


    到了1985年的时候，国家第一次提高了自制药的标准，在药品管理实施办法里头就要求那些有自制药的医院，必须能够达到一定的生产能力，必须有一定的检验仪器跟卫生条件。这个标准一出，就第一次淘汰了一大批自制药。


    到了1989年的时候，这个标准又一次提升了，凡是那些生产自制药的医院，必须拿到制剂的许可证才能销售。而且销售有限制，利润必须限制在5%之内，而且还不能上市销售，只能在医院内部使用。


    所以，别看在微信群里把这种医院自制药说得特神秘的，说是内部研制，不能外流。其实它不能外流，不是因为它稀有，不愿意把好东西和别人分享。实质原因是国家根本就不允许外流，外流之后的风路太高。


    自制药的标准再次提高，就是2000年了，那个时候对药厂生产的药物有一个标准，简称叫做GMP，对医院的自制药也有一个标准，叫做GPP，GPP其实就是GMP的简化版。


    但其实到了这儿，门槛已经比较高了。对一个普通的医院来说，真想琢磨地一直做自制药的话，它投入的资金跟启动一个新药厂是差不多的，至少得上千万，这个门槛就把90%的自制药全都淘汰掉了。


    这种政策规定倒不是很强硬，就是从某一天开始，大家都不允许什么什么了。它是逐渐地提高标准。从前那些还有利润的药，到现在已经付不起成本了，于是很多医院就纷纷退出了自制药的领域。


    只有个别的医院，因为当年的运气非常好，一些自制的，名气又很大的药，从自制药就变成了正式的药，医院为了盈利又重新规范地成立了一个新的药厂，那种药自此之后就不再属于自制药了，而是正式的可以上市的药物。像三九胃泰，这个药就是这么诞生的。


    # ——► 医院自制药的现状 ◄——


    那么现在医院的自制药都是什么呢？


    其实仍然是99%都是中成药。


    大致的过程就是，中药方子熬成了药汤之后，把它浓缩，去除掉水分分以后，加辅料，让它成型。


    比如说，加淀粉变成药片样的，或者是加蜂蜜，加蜡变成药丸样的，或者是做成粉末装进胶囊里头，或者是做成颗粒装到小袋里头。


    在上世纪90年代的时候，这种加工方法在很多医院里，简单说就是加热，把水熬干，剩下的就是浓缩成份。


    可是实际上，我们退一万步说，我们就认为那种中药在汤药的时候是有效的，可以治病的。那现在通过这种方法，把水份蒸干之后，这种药还有没有疗效，那就真不一定了。


    就是你这个医院怎么保证有效成分没有随着水蒸发出去呢？


    还有，你怎么保证高温持续了那么久，有效成分没有被破坏呢？像我们炒菜的时候，都会讲究不能炒太长的时间，否则营养成分都破坏了。那你熬药1个小时，你怎么能保证这一点了呢？


    其实在上世纪90年代的时候，很多监管根本就忽视了，这个环节根本就没有验证。


    但那会儿留下的自制药，也就是通过这种很不规范的方法做成的。


    到了2000年之后，情况有了些好转。凡是那些还在卖自制药的医院，那些药虽然还是中成药，但经过加工工艺，比如说刚才说的浓缩，就已经不是通过煮干了，而可以通过低温萃取，或者通过真空方式去除水分，等等等等，得到有效成分。


    并且现在，国家是3年一审，对医院内部生产的自制药，工艺过程、设备水平都是有要求的。但是，即使是这样，医院的附属药厂，在加工生产自制药上的能力和那些正规药厂比起来，还是远远不如的。


    如果从统计规律看，平均水平看，药物的安全性跟有效性，从低到高排位是这样的。


    最差的就是各种草药。


    比如说某一味几克，某一味几克，加水熬出的汤药，这个是最差的。


    就拿人参来说吧，有一些结论很弱的证据说，人参皂苷是人参作为药物的有效成分。


    但是人参因为生长的环境不同，药材批发进来，不同批次的人参皂苷的含量相差可能有几十倍呢。那在熬制汤药的时候，人参皂苷有没有跟其它成分发生反应都谁说。


    但因为那会儿病人实在太多了，每个人至少都有心理需求，所以政策上还是鼓励发展传统医学的。尤其是去年，新规定颁布之后，竟然也允许以师父带徒弟的方式给一些从事传统医学的人颁发医师执照。这些人开的药，几乎都是我刚才所说的这种药。


    安全性、有效性再高一层的，就是医院的自制药了。


    虽然也有可能，像协和这种医院，这种最顶级的医院出的自制药，它的药效可能比某些最差的正规药厂出的某些药要好，可是总体情况来看，医院的自制药跟正规药厂的药比起来，根本没法比。


    这样的差距，就有点像业余棋手跟职业棋手那样的水平差距似的。职业选手就算发挥失常一些，打败业余高手也是大概率事件。


    如果安全性、有效性再高一层，那就是正规药厂生产的药了。


    但这里，还可以继续细分：


    比如最顶级的，就是合资药厂按照国外的标准生产的药，这个跟原研药的水平是一样高的。


    比这个差一些的就是国产药，在原研药的专利已经过期之后，持有生效分自己研发辅料，生产出的仿制药。


    第一种合资药厂出的药，它基本上和发达国家正规药企的原研药效区别。


    而第二种药品的水平是参差不齐的，有一些的水平接近第一种，有一些似乎是完全失效的。比如说前一排子的国产白百破，国产的狂犬疫苗就属于这种情景。


    那正规药企生产的第二类的那种药，哪个更好呢？


    简单说，在2007年之前，当然也包含2007'
