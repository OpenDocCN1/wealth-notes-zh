    +   1. 对于宗教信仰，有一种解释是 “信了宗教的人，内心会更平安喜乐、更健康”，但实际上，在大部分历史时期，虔诚的宗教信徒，很多都长期受着罪恶感的折磨，比没有宗教信仰的人更加忐忑不安。
    2. 从演化角度看，用更短时间找出问题中的答案，让人类祖先获得了生存优势，把各种问题归因于一个简单的结论，是大脑演化产生的一种副作用。


    # 概念29：考古学


    考古学的终极目的是：梳理出遗存的古物在时间和空间上的分布，从而理解历史。通过它，不仅能看历史，甚至可以看今日和看未来。


    308 | 考古：考古学的终极研究目的


