    # ——► 课程小结 ◄——


    那么从今天这一节课，你能学到什么科学思维呢？


    你可以深刻地感受到，寻找相关关系是相对轻松的，只要如实地收集数据，并对数据作初步的整理，一定会找到几对高相关的事件。但是要确立因果关系，真的要费劲太多了。


    # ——► 课后思考题 ◄——


    那么，我们还能不能分析出因果关系呢？或者说在一定程度上排除一些非因果关系的因素呢？


    如果你想到了，就把答案留在评论中。


    划重点


    +   1.只要如实地收集数据，并对数据作初步的整理，就一定会找到几对高相关的事件，但是，再高的相关性，也不能确立因果关系。 2.在日常生活中，人人非常容易对高相关性的事件产生共鸣，草率地把“不确定”当作“事实”去对待，强调因果关系，这不仅不利于了解真相，很多时候还会造成恶劣后果。


