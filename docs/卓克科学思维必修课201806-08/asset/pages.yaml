    只有当我们了解了线粒体，之后才有可能从能量的角度看复杂生命的出现，和复杂生命伴随着的繁<|message|> 与死亡的策略。


    # ——衰老不算病。——


    我们先说关于衰老的研究情况，关于为什么会衰老，学术界没有统一的观点，而且研究进展相比医学界的其他进展慢很多，原因在外乎是缺乏经费。


    像其他医学界的领域总会聚焦在一种疾病上，因为如果找到了病因，针对病因研发出来有效的药物，之后所有的患病者和潜在的患者者就都是这种药物的客户了。


    假如这样的人有10几亿，这种病每人每年还要花50美元的话，那么这种病这种药的先期投资，假如有20亿美元之巨，之后只要研发成功了，那么挣的可是好几百亿美元。所以，几十亿美金的投资尽管大，但其实赚的更多。


    那你说衰老不更是如此吗？每个人都会衰老，这可比某些疾病的患病者的基数大太多了。


    但不幸的是，衰老不算病。


    算不算病，这可是一个很严肃的问题，有好几个部门都对疾病有规定：比如像世界卫生组织编订的《国际疾病分类》里，一共有1万多种疾病，连游戏成瘾都已经算入其内了，但是衰老不算疾病。
    还有，各国的医保报销目录也是issant对疾病的界定，糖尿病、心血管疾病，不管是手术还是药品，它总有一部分是报销比例的，但是衰老从来就不是报销目录里的内容。
    所以，抗衰老的药物就算研发出来了，也不能按照当前的药物流程审批、上市、开卖。但药物这种东西可不是法令禁止则非法，自作主张卖是违法行为。精明的投资人对完全不可预知的未来也是不敢轻易下手的。
    那你说，不作为药，作为返老还童的服务，那这样研发出来不行吗？ 其实就算研发出来了，起码最初的N年，普通人是承担不起的，它最初一定只是针对富豪的。所以这样说，还是有市场吧。
    但是无奈的是，富豪分两种：


    +   一种，是没有知识的土豪，这些人都去与克兰打60万块钱一针的干细胞跑去了，被骗得再恨都心甘情愿，他们可不会为什么科学研究掏钱，他们只是吃仙丹。


    另外一种，是真正的精英富豪，他们可是知道衰老研究的情况的，深知现在的人类科学水平离理解衰老和死亡还差得太远，就更别提研制出对抗衰老与死亡的方法，跟制定与之配套的法律规定了。


    于是，衰老研究在医学界并不火热，它为人所知，只不过是化妆品商喊得太频繁了。


    # ——被忽视的线粒体——


    衰老这个词大家都不陌生，但什么是衰老，好像又都说不清。 从照片里我们可以看到一个人20岁跟40岁的区别，但是如果给你看一个单细胞动物，比如说草履虫的话，你能分出一个处于生命初期的草履虫和一个处于生命末期的草履虫之间的区别吗？
    我们不熟悉，当然是不行的。 但其实熟悉草履虫的生物学家也一样做不到这一 点，就像衰老是更明显地表现在复杂生物体上的。 所以，想弄清楚什么是衰老，也许需要追溯到生命史上很早期的阶段，就是当生命还处于单细胞的时候。
    单细胞生物占据了地球生命史5/6的时间，时长大约30亿年。 为什么会这样呢？


    是不是说生命处于单细胞的状态才是大概率事件呢？如果有另外一个存在生命的星球，那上面是不是也很可能只有单细胞生物呢？ 有一种解释，是从能量的角度说的，因为只有距今25亿年之后，地球上才出现了微量的氧气，所以单细胞的生命形态，是一种非常适合无氧跟缺氧环境下的生存策略。
    在无氧的情况下，地球上数量最多的生物就是蓝藻，它们在氧气大量产生之前，已经几乎覆盖了整个地球的液体表面，它们生命中排出出来的废物就是氧气。这种氧气因为化学性质太活跃了，所以对当时大部分的其它生物是有毒的。这种毒，就相当于今天空气中到处都飘浮着硫酸雾那样危险。
    但当时，还是有少数的生物活下来，它们不但没被杀死，还可以把氧气转化成自身的能量。 正应了那句： 杀不死我的，必将使我更加强大。 氧气因为太活跃了，所以当生物可以利用氧气给自身供能的时候，量级就从之前的能量大很多。
    大多少呢？ 现在的测定是这样的，细菌在发酵中通过无氧呼吸，分解1个葡萄糖分子，只能产生2个单位的能量。而在氧气充份的环境下，可以产生36个单位的能量，这中间有18倍的差别。
    这一 下就提供了太多的可能性。 类比一下，比如说你现在的年收入是20万元，但是因为跳槽换了环境，年收入提高到360万元，而且这还不是临时性的，是此后只可能比这个更多的话，那你未来要做的事情一定会很多，想象空间一定很大。
    这也是当时喜氧的单细胞面临的大好局面，有大量的能源供它挥霍。有一些从前靠那零星的能源根本不可能维持的结构，之后就不受约束了，如此说多细胞。再从多细胞发展到有不同功能的多细胞。
    现代科学家主流认同是这样的，远动耗巨额能量的第一步是源于一场浩大的“婚礼”。当然，这个婚礼是要加引号的。 它的夫妻双方分别是：


    +   一个还没有法利用氧气中的能量，但又没有被氧气杀死的块头比较大的细菌；

    另一个，就是能把氧气利用上的细菌，但又不会被那个大块头消 iron掉的小细菌。


    之后，大块头把小块头一口吞下肚，小的非但没死，还在大的体内繁殖起来，并且可以提供大块头能量，而大块头又给它提供庇护。 这种模式在现代显微镜下，那个大块头就是细胞，那个小块头就是里面的线粒体。
    关于这个细节，我们还会细说，我们继续。 中学的生物课，学习细胞的时候我们都听说过线粒体，但肯定是一带而过。就是说线粒体是提供ATP能量的，一切生物，高等低等，它们可以利用的能量都叫做ATP，都是从线粒体产生的。
    比这说的更多一点，就是线粒体复制的故事，那就要告诉你： 虽然每一个细胞里都有DNA，但是这些DNA可不都是在细胞核里的，而是分开了两地保存。 另外一部分是存在线粒体当中的。两地的数据还完全不同。虽说细胞核里的DNA占据绝大
    部位的量，但线粒体的DNA如果出了问题，也一样会造成生物体非死即伤。 线粒体中的DNA是传女不传男，所以人类祖 先到底什么时候走出非洲的，走进亚洲的，或者1918年在柏林外河中救起的那个少女到底是不是沙皇尼古拉二世的女儿，这些都可以通过测定线粒体内的DNA来判断母系氏族的关系。
    但除了这两点知识之外，我们大部分人关于线粒体的知识就没有什么是了。这种情况在学术界也出现了，就是对线粒体的研究一直是热门，一直不是焦点，因为它的尺寸本来就非常小，最初是靠借助在光学显微镜下看到了，有些人就认为这是细胞内部的杂质，还没来得及等电子显微镜出现之后仔细观察它，生物学界更加激动的发现成为主流。


