  md: '# 294｜问答：端粒学说为什么不能解释衰老？


    294｜问答：端粒学说为什么...


    # 问答


    最近的课程都是跟衰老有关的内容，很多同学都问到了端粒酶是不是可以解释衰老？


    先简单回答这个问题：


    端粒在 DNA 复制的时候如何减少，又是怎么通过端粒酶补齐的，针对细胞的研究还在继续，但是对于生物体的衰老研究上，端粒学说已经是非主流了。


