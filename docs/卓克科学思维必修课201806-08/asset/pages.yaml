  md: '# 277 | 袁老：跨越鸿沟，从细菌到真核生物


    ![](img/53a7c268f3a15189714e4eef36c78daf_71_0.png)


    277 | 袁老：跨越鸿沟，从细...


    # ——► 帽念27：袁老 ◄——


    袁老，是每个人都会经历的，但它并不是每个生物都会经历的，有些动物就没有明显的老化，甚至越老越强。了解衰老，是科学地树立世界观必要的环节，它可以让我们更坦然地面对生命的最后阶段。


    这节课，我们来讲一讲，“一个大块头的细菌吞噬一个小块头的细菌”是怎么最终成为真核生物的。


    因为真核生物也是人类的祖先，没有它们出现，地球表面就算生命再茂盛，也不过是一种到处涂满了蓝色绿色粘液的情景，所以了解这一 步的转变，会增进我们对生命的了解。


    # ——► 古细菌 ◄——


    上节课，我们说过，细菌跟真核生物的细胞差异实在太大了，真的很难想象，生命会从细菌一步跨过巨大的鸿沟，从1到100，转变真核生物的细胞。


    科学家也是这样的感觉，所以大家的想法是：


    +   这中间应该有一些过渡的品种，比如说先从1跨到20，然后20、40、60、80，最终到100。


    这个转变，最早发生在1977年，其实已经很晚了，在那一年，另外一种微生物被发现了，它有点像细菌，但其中一些品种更像真核生物的细胞，后来给它定名，叫古细菌。


    虽然名字里带着一个古老的“古”字，但实际从 DNA 分子钟的测序看，并不一定比细菌更古老。之所以这么晚才发现它，有两个因素：


    一个是它们几乎都生存存在极为严酷的环境里，比如不热得滚开，而且还有强酸性的火山口的沸水里，或者是地下几公里已经酸化的油井里。从前的人们不认为这些地方会有生命。


    另一个很晚发现它的原因就是，很多古细菌如果在显微镜下看，它们跟细菌的区别并不大，所以就这么被忽视了，直到1977年才被发现。


    其实1977年它之所以被发现，就是在火山口的热泉里发现它的。


    既然说古细菌是细菌跟真核细胞的中间型，那么我们看看它这两端都有些什么特点：


    +   第一，是细菌有坚固的细胞壁，而真核细胞没有；

    第二，是细菌不可以改变外形，而真核细胞有很多的外形；

    第三，细菌没有细胞核，而真核细胞有；

    第四，细菌没有线粒体，而真核细胞有。


    简单列出这4条，那么只满足其中1条的，或者2条的，3条的，就都算中间型了。


    那么有吗？


    还真的有。


    比如说本身更像真核生物，但却没有线粒体的，而且这样的古细菌还不少，至少有1000种。


    不过，这些过渡型，很多虽然没有线粒体，只不过是原来有过，后来不再需要给丢弃掉了，所以它其实属于晚辈中的晚辈，并不是我们要找的最早期的过渡型。


    科学家们要找的，是那种压根儿就没有拥有过线粒体的品种。


    后来从 DNA 的测定中真的找到了，被命名为古原虫，这种虫除了没有线粒体这一个缺憾之外，就是一个真核生物。


    后来这样的中间型还找到了很多，比如现在还在感染很多昆虫的孢子菌，它们确实实在是生命体，但是又是只能生活在其它动物的细胞体  内。


    根据这些过渡型，也根据 DNA 分子钟，生物学家就对25亿年前发生在地球上的转变作了这样的猜测：


    +   那个时候氧气刚刚微量地产生，有一些生活在淡酸环境下的细菌失去了硬硬的细胞壁的外壳，只留下了膜，所以它们吃起来的样子就像是包裹之后的吞噬。


    在狼吞虎咽中，也吃进了一些类似寄生虫一样的细菌，这些细菌块头比较小，寄生在它们 的肚子里靠吸取营养生存，有相当大批的宿主就是因为这样，营养不良死掉了。


    但是这种寄生或者把它叫做感染的方式，总有一种规律，就是毒性对宿主来说会一代一代地减弱。


    毒性减弱是从两个方向呈现出来的：


    一个方向，是宿主的基因突变会逐渐地筛选出那些不太容易被寄生物杀死的品种出来，那其实客观看，也就是毒性减弱了。


    而另一个毒性减弱的方向，就是凡是那些剧毒的，大毒的，一进入宿主体内就开始大开杀戒的寄生虫，它们虽然暂时吊唁到位了，但是还没有得及繁育更多的后代，连宿主都一命呜呼了，所以它们的后代也很難繁衍下来。毒性太强的寄生物，反而是很難留下很多后代的，只有那些毒性弱一些的才更有可能。


    那这种状况，我们曾经在讲梅毒的进化的时候提到过，现在的梅毒螺旋体的毒性远比300多年前的要求很多很多。而且不只是梅毒螺旋体，甚至有研究，就连出现了仅仅几十年的艾滋病病毒，毒性也再减弱。


    就是靠着这双重的动力，被包裹进古细菌体内的细菌，毒性慢慢地减弱，弱到了跟宿主相安无事的程度。


    这个时候，它们就一起过着勉强强大的生活。寄生虫吃得不太饱，而宿主也有轻微的营养不良，但是他们谁都不会死。就像这样，相伴一生。


    几亿年过后，到了距今20亿年的时候，氧含量出现了一个骤增。如此活跃的氧元素，就像现在空气中飘浮着盐酸一样恐怖，大部分细菌体内渗入了氧气之后，肚子里面就出现了氧化反应，很多细菌从里到外都被漂白了，寿命大减。


    但有那么一批极为幸运的宿主，别的它们体内之前有寄生物，但是这个寄生物居然可以把渗透进来的氧气分解掉，分解成水、二氧化碳和一些 ATP。


    所以，对这种从前是不太幸运的，被寄生了的宿主来说，它现在居然因祸得福，拥有了解毒的能力，并且还因此获得了 ATP 的能量块。它们寄生了几亿年，一直在吃呀，但现在它们也把输油管道插在了寄生物的身上，把源源不断产生的
    ATP 为己所用。


    后来，因为氧的含量持续增加了几十倍，ATP 产生的能量块非常可观了，从前没被这类寄生物感染的细菌，要不就被氧气毒死了，要不就是继续维持着细菌的简单生活模式。连基因都不是很长，否则要保证大批基因的正确复制，在能量上可能都入不敷出了。


    而那些被寄生了的宿主，从寄生物身上得到了更多的好处，它们一起形成了现在拥有线粒体的真核生物的祖先。


    那些寄生物，现在就是线粒体跟叶绿体，那些宿主就是真核细胞。


    # ——► 演化的胜利者 ◄——


    虽然我们现在总结出这段过程，听上去好像是真核生物大获全胜，但实际上没有线粒体的生物体，在地球上到现在占比仍然不少。


    最近的一个研究统计了地球上到底有多少生物，量的多少，是统计它们的碳元素的多少。


    全球生物碳元素的质量加和，一共大约5500亿吨：


    +   其中4500亿吨是植物占据着，植物属于真核生物，排名第一。

    排名第二的就是没有线粒体的细菌了，它们占了700亿吨。

    排名第三的是古细菌，占据着70亿吨的质量，它们大部分也是没有线粒体的。


    所有的动物加在一起，才仅仅20亿吨，这里包括了节肢动物、哺乳动物、爬行动物、鱼类、鸟类、软体动物等等等等。


    而人类，又在这20亿吨里只占0.6吨。


    所以，不算植物的话，77%的生物是没有线粒体的，如果算上植物的话，14%的生物是没有线粒体的。


    那么面对这样的结果，我们如何评价哪种生命形态更有优势呢？


    对于细菌来说，30多亿年前就有的生活方式现在依然存在。


    最近5亿年，出现了一批复杂到无以复加的生物，它们虽然功能多到眼花缭乱，但是我们可以假设，哪天地球的氧含量骤然下降，你觉得是那些细菌活下来的可能性高，还是我们活下来的可能性高呢？'
