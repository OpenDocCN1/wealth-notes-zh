  md: '# 260 | 心理：心理学科学化的第一步


    # ——► 概念26：心理 ◄——


    心理学科学化的时间还非常短，从经验到知识，从看上去包罗万象到满足可验证可复现的理论，观察这种转变，不仅能知道科学思维是什么，更能在研究人的情绪、行为、心理状态时，获得更稳固的答案。


    # ——► 古代的思考习惯 ◄——


    这节课，我来给你讲科学方法是怎么运用到心理学研究中的，这一步非常重要，如果没有这一步，心理学就跟所有古代的思考没有差别了。


    那种古代的思考方式，主要就是3种：


    +   - 高级一些的，比如像哲学沉思式的，像世界上万物，它一共有5种，它如何如何；

    - 还有神学谕告式的，就是上帝说了什么什么；

    - 第三类就是那种世俗式的参悟，就像俗话说三思而后行，但俗话也说，该出手时就出手。


    以上3种古代的思考习惯，都是在科学方法尚未出现之前，人类认识世界的主要方式。但科学思考方式跟它们都不同。


    # ——► 被低估的心理学 ◄——


    现代心理学的科学研究方法扎根于测量，而不是古代思考方式。测量是一项每个细节，每个字都定得清晰后作的估价动作。


    这个动作对一个年轻的，科学化程度还不深的学科来说，尤其重要。反而，像对物理学、化学、生物学这样的学科，就没有那么重要了。


    # ——► 被误解的科学结论 ◄——


    刚刚我们只以智商这个词为例说了一说，其实心理学中还有很多的词都有同样的情况，它们在心理学家之间是一类更具操作性的描述性词汇，而普通人却在日常生活中也接触过这些词，但是他们对这些词的理解跟心理学的
    \).研究是完全不一样的。'
