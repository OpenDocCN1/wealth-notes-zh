  md: '# 285 | 衰老：细胞的死亡与癌症


    # ——► 概念27：衰老 ◄——


    衰老，是每个人都会经历的，但它并不是每个生物都会经历的，有些动物就没有明显的老化，甚至越老越强。了解衰老，是科学地树立世界观必须要的环节，它可以让我们更坦然地面對生命的最后阶段。


    这节课，我们说细胞的死亡。


    在细胞层面上了解死亡，会对“死亡”这两个字带来的情感体验有不同的了解。


    也就是说，听懂了这节课，“死亡”这两个字在你心里头就更倾向于是中性词，而不是贬义词。


    # ——► 癌细胞 ◄——


    人们对细胞是怎么死亡的，尤其是成年个体上的细胞是怎么死亡的，这个具体细节的了解，更多是在研究癌细胞的时候才发现的。


    因为，正常的细胞该死不死，再积累一些突变就会变成为癌细胞。


    +   一种叫做致癌基因；

    一种叫做抑癌基因。


    # ——► 细胞的死亡 ◄——


