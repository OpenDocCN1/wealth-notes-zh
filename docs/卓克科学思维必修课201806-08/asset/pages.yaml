  md: '# 287 | 问答：《最强大脑》里的记忆力狂人是真的吗？


    287 | 问答：《最强大脑》里...


    # 问答


    有很多同学看《最强大脑》，这个也是咱们得到赞助的一档脑力节目，他们都惊讶于里边选手表现出实力。经常就会有人问我，那些超强的记忆力，那些人是真的，还是台下做假，台上演戏呢？


    # 简单地回答：


    超强记忆力的人确实存在，而你我看到的《最强大脑》里的节目，那些惊世骇俗的表现，是一些本来就天赋异禀的人，加上刻意地训练，又经过节目组效果的放大，最终得到的。


    # ——► 超级自传体记忆 ◄——


    那我们就挑超级记忆者来说，在2010年12月19号，有5个人做客了一档哥伦比亚广播公司的新闻节目，叫《60分钟》，这5个人都是拥有超级记忆力的人。他们有一个特别的名字，叫“超级自传体记忆”。


    那为什么是这样一种奇怪名呢？


    就是因为他们的记忆太像自传小说了，表现出来也很另类。


    比如说最早发现的一个女人，叫吉尔·普莱斯，今年38岁了。她从11岁起，任何她曾经听到过，看到过的事情，都牢牢地记得细节。


    她在2000年的时候，曾写信给加州大学欧文分校的神经科学家求助，希望能够她解开记忆力之谜。


    最初科学家们不太相信这是事实，但是经过一系列的初步测试就发现，这种超强的记忆力是真的。吉尔随口就可以说出自从1974年之后，任何一个复活节或者圣诞节是星期几，她并不是通过什么数学技巧算出来的，因为她完全说不出某一天是星期几。


    当时欧文分校的研究员为了测试她的真实性，特地买回来一本《回忆20世纪的每一天》，这本书里记录了20世纪这100年里头，每天发生的较大的新闻。从这里就选了一些事来问吉尔。


    比如说，哪一天加州通过了限制房产税的13号议案呢？


    吉尔竟然毫不犹豫地说出是1979年5月25号，而且还能说出当时她听到这个消息的时候，正坐在妈妈的车里头，去学校的路上。


    除了这些大事件，还有很多达不到写入历史上今天的那些新闻，只要吉尔当年看到听到过，也都记得。研究人员背着她从她身边的朋友那里，了解了她一些过往的私生活，然后测试她的时候就问她，当年跟某人约会的时间、地点，她也都能正确地回答。


    一系列这样的测试完成之后，研究人员确认，吉尔确实记忆力惊人。


    不过她的记忆力也有很多奇怪的特点，比如说：


    +   吉尔只记得她11岁之后的那些事情的细节，11岁之前的记忆虽然也有，但是记忆的模糊程度跟普通人没有什么区别；


    还有，她的记忆力只表现在记住自己经历过的事情上，类似明天要做哪些事，一二三四五六七列出来之后，她的记忆跟普通人是一样的，也会写在小纸条上，贴在笔记本屏幕的空白处，防止忘记。


    而且，如果给她一段陌生的散文让她背诵，她背下来的时间跟普通人也没有什么区别。


    所以，最终才给拥有这种类型的记忆力的人，命名为“超级自传体记忆”。


    那次节目播出之后就引起了轰动，后续有N多人也给欧文分校写信，声称自己是超级自传体记忆者，不过后续就从几百人中筛选，大多是骗子。


    最终，还是确认了11个真正的超级自传体记忆者。


    这个确认过程就是随机的双盲的对照实验，在满分100分的情况下，这11个人对往经历的回忆，平均分是85分，而对照组，普通人平均分才8分。


    初看之下，他们还有一些特质，比如说：


    +   11个里5个是左撇子，这个比例大大高于普通人群；


    还有，他们都有明显的强迫症，比如说个人物品必须放一起，或者有强烈的洁癖。


    更深入的测量，是对大脑做正电子发射计算机断层扫描完成的，结论是这11个人，颞叶跟额叶，也就是从太阳穴到额头，这部分皮质之间传递信息的神经叫做钩束，这之间的连接比普通人要好很多。


    而之前在脑损伤患者的研究案例中已经知道，钩束受损会直接影响自传体类型的记忆。


    现在可以确认的是，他们并不比普通人拥有更高的智商，拥有更好的学习能力，他们只是单纯的不会忘记一些细节。


    比如说普通人，今天也会记得2018年世界杯开幕战，是俄罗斯5：0大胜沙特，那是因为时间刚刚过去不久，但是半年之后，几乎就没有人记得这件事情了。


    但超级自传体记忆者就不会把这些细节忘掉，他们也不会像有些《最强大脑》里的选手那样，把周圆率后5万位都能记住。他们记忆这些毫无意义的数字跟普通人的能力是差不多的。


    那身为一个超级自传体记忆者是什么感觉呢？


    这些人都说，感觉挺不错，觉得挺好玩的。他们也知道，自己这一方面是异于常人的，但记住这些，既不会影响他们的生活跟社交，也一样对他们的工作没有什么帮助。有些人把这种能力就用于消遣，每天回忆一些过往生活中最有意思的细节，然后写成日记。


    # ——► 课程小结 ◄——


    至于为什么会有这样的能力，有些解释听上去很美，比如说：


    其实这类人在人类早期，文字尚未出现的时候，占比比现在要高得多。


    人类文化在早期都是通过口头形式代相传递的，在那些年代里，超级自传体记忆的能力要比现在值钱得多。


    这种能力曾经对人类部族的求生非常重要，而且一旦一个群体一旦拥有一个这样的人，他会受到极高的尊敬。


    文字出现之后，这种能力的重要性就下降了。


    不过这样的解读，严格说只是马后炮，因为并没有证据证明人类早期就是这样的，甚至证据应该是什么样还无从得知呢。


    现在对为什么出现超级自传体记忆者，准确地说，没有科学解释。也就是所谓的“科学无法解释任何事”的一个好例子。


    而科学思考方式最大的优势就体现在这里，如果不能解释，那就下不结论，也不相信，也不否定，只是慢慢地积累素材跟证据。科学案例只要确定下来是真实的，可以反复验证的，那么说不定哪天就能派上用场。


    比如在发现超级自传体记忆者之前，人们也记录过很多因为脑外伤而产生记忆力变化的人，有些为了治疗癫痫，切除了左右大脑前内侧颞叶的病人，这些病人有些就完全丧失了形成新的记忆的能力。但这些人已经形成的记忆毫不
    magnesium 受影响。


    把这些例子总结在一起，我们起码能知道，大脑里不同的部位负责了不同类型的记忆。


    像那些参加《最强大脑》的人，虽然肯定有大比例是刻意通过高强度的训练获得的能力。但普通人如果那么训练，也很难做到那种极致水平。


    所以，针对他们的火脑收集一些测量证据，应该也对脑科学的研究有帮助。


    好了，关于《最强大脑》里超级记忆力的人是不是存在，这个问题就答这么多。


    # 划重点


    +   1.超强记忆力的人确实存在，他们在记忆方面的表现，来自天赋异禀加刻意地训练。2.“超级自传体记忆”者，他们的大脑在颞叶跟额叶之间传递信息的神经连接比普通人要好很多。但他们并不比普通人智商更高，也不拥有更好的学习能力，只是单纯的能记住更多细节。3.面对问题，科学的思考方式，就是如果不能解释，那就下不结论，也不相信，也不否定，只是慢慢地积累素材跟证据。'
