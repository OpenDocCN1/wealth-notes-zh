  md: '# 复习手册 | 全年问答 （二）


    卓克

    你好，我是卓克。

    这是复习手册的第六篇内容，也是最后一篇。

    我们整个课程做了102节的问答，所以我们分成两部分进行复习，这是第二部分。

    我特意为你制作的这份“复习手册”，你可以用来回顾自己是否掌握这个关键知识，如果不是很熟悉的话，可以直接点击“每一节课程的标题”进行复习。你好，我是卓克。


    # ——▸ 大脑与意识 ◂——


    # 冥想和灵修对身体有益吗？


    学术界看待冥想对身体的影响，持一种谨慎、乐观的态度，但还没有稳固的结论。但从感性角度分析，一个人不过是通过药物或者其他设备，能通过冥想完成自我约束、自我情绪管理，是有益处的。


    # 什么是意识？


    通过对脑电图收集到的海量数据进行抽象，经过特殊算法，得到了“劫动复杂指数”，简称PCI，它很有希望继发展成一个意识的量尺。


    # 大脑的可塑性可以调整吗？


    把握住脑发育的关键时期培养孩子，就是让他们在青少年时期多接触新鲜事物。而成年人重启大脑的高可塑性，得到的收益可能远远小于付出的风险。


    # 如何测量梦境？


    在梦境中，有少部分人能意识到自己在做梦，而人在做梦时眼球的现实动作与梦中是一致的，可以利用这一点，在梦境和现实中搭起一座桥梁，这时测量梦境成为可能。


    # 关于潜意识的现代研究


    潜意识几乎会对遇见的所有的事物，进行好坏的简单、快速地评估，会作出亲近或者躲避的判断，对这些结论的调整，只能后绪由意识重新加工。


    # 如何测量大脑？


    人类对大脑的测量，还很初级，既缺少足够好的测量手段，对大脑工作错误的理解更是蒙在鼓里。


    # 《最强大脑》里的记忆力狂人是真的吗？


    超强记忆力的人确实存在，他们在记忆方面的表现，来自天赋异禀与刻意地训练。


    # 抑郁症，如何正确对抗？


    患了抑郁症，不要拒绝吃药，但吃药的同时，主动调整生活环境心境同样重要。


    # ——▸ 科技与生活 ◂——


    # 10亿个晶体管怎么放进指甲盖大小的芯片里？


    实际上半导体芯片的制作并不是先制作10亿个元件，然后再放进芯片中，而是更类似于做生日蛋糕，在一个胚子上不断地加工。


    # 人工智能找到第二太阳系，会有外星人吗？


    人们讨论外星人有两个方向：一个是遵循科学逻辑指导的，一个是小说式漫谈的。开普勒望远镜正是用科学的方法探索宇宙中生命的可能性，这次使用人工智能，是因为这一轮基于机器学习的AI在处理特征数值明显的海量数据时优势非常明显。


    # 苹果有意降低老手机性能吗？


    一个现象或者问题的产生，绝大多数都存在诸多因素，很看似明显因果关系，往往只是相关而已，感觉联系紧密，其实经不过查证和检验。


    # 手机电池用不用维护？


    作为普通用户，对于手机电池无需进行任何维护，各类关于电池保养、充电小技巧等等，不仅几乎没有什么用，反而给自己带来很多麻烦。


    # 换硬盘增加工作效率


    电脑运行慢，影响最大的就是机械硬盘的性能，因为它是靠磁头在盘片上寻找磁区读取数据的，数据越分散，速度就越慢。而固态硬盘SSD是将数据存储在微小的半导体中，没有机械结构，速度比传统的机械硬盘快多了。


    # 什么硬盘用起来最爽？


    SSD硬盘的优点除了快，就是不怕颠簸，也更省电，非常适合笔记本电脑使用。缺点是价格贵，寿命有理论上限，在临近报废的时候会在某一刻突然 dome， 造成数据丢失，而机械硬盘会在寿命末期一点点损坏，有经验的用户能够抓住时间窗口提前导出数据。


    # 充电宝的电为什么那么虚？


    凡是有锂电池的设备，显示电量的功能误差都比较大，而且设备用的越久，误差就越大，温差越大，误差也越大。


    # Wi-Fi网速的“木桶效应”


    在工程领域，处处都体现着“木桶效应”，拿宽带网速为例，从信号的源头到使用终端，如果想要保证足够的信信息流量，就必须做到在任何一个环节都不低于源头的流量才可以。


    # 中国芯片产业如何破局？


    中国芯片产业的出路，是融入全球科技的主流，遵守易经规则，在我们基础薄弱的时候，自然就会被分到测试、封装这些环节。但等积累了足够多的经验，总会有机会往上提升的。


    # 新能源能成为主流吗？


    人类能源结构的改变，几乎等同于整个人类社会的基建设施大升级，新的能源和与其配套的技术，只有成熟到可靠度与现有能源同水平，才有成为主流的可能。


    # 要警惕科技带来的威胁吗？


    一项技术是否被禁止，是依靠当时的情况下，依照“加和”的收益来衡量的。对于广大的人群来说，收益更大，损失更小，几乎必然会允许使用。


    # 搜索引擎改变了人的思考习惯？


    有了互联网和搜索引擎之后，人们需要记住的知识不一定少了，只是思考资源进行了重新分配。


    # ——▸ 思考与行动 ◂——


    # 如何判断刷屏文章的真伪？


    社会热点事件，重要媒体的报道会有很多，几篇看下来，不是专业人士也能了解情况。


    # 家长怎么帮助孩子学习？


    应试教育对两类学生不利，一类是学习能力非常强的，一个是非常差的。强的吃不饱，挫制了他的成长；差的是跟不上节奏，白浪费时间。


    # 狗能不能有人权？


    宠物狗不听话的各种问题，大都源于人对狗的认知偏差，导致了狗的行为模式偏离了驯化的方向。


    # 怎么问出好问题？


    自己找答案的好处，一是可以记得更牢固，二是在找不到答案而有准备地提问时，能够得到被提问者的重视。


    # 怎么找到好答案？


    用好搜索引擎，不仅仅是搜索网页，还有微信，微博，文库，学术，知乎，Quora，视频，论文库等形式的结果，就能够得到绝大多数问题的答案。


    # 怎么给家人科普？


    科普的最终效果，是整社会的文化土壤决定的，包括个人、学校、工作单位、媒体宣传等等。而科学思想固然重要，但极端地走入唯科学论的方向，反而是有害的。


    # ——▸ 社会与价值观 ◂——


    # 地球一小时熄灯活动有什么意义？


    现代电网已经非常完善发达，发电量根据用电需求变化，地球一小时的熄灯活动对电网的影响很小，没有什么害处，这个活动更大的价值是引导节能环保的理念。


    # 佛祖舍利是什么？


    舍利，是修行人的遗骨，成分与普通人的遗骨并没有什么不同。对宗教虔诚地致敬自古有之，但现代的圣物崇拜则更多是背后利益的驱动，也由此出现了人造舍利。


    # 家鸡是怎么被人类驯化出来的？


    鸡是一种智力水平比较高的鸟，它们有时间观念和自控力，也有一些逻辑判断能力。家鸡的野生祖先来自两种原鸡，大部分基因是从一种叫红原鸡那里取得的，少部分基因是从灰原鸡那里得到的。


    # 转基因的危害会被利益团体掩盖吗？


    如果真的有利益团体想要掩盖转基因的危害，就要贿赂全球的几乎所有相关的科学家，以及所有顶级学术期刊，并且持续经达30多年，这个成本会高到不可想象。


    # 巧克力是如何风靡全球的？


    巧克力是阿兹特克语中“苦水”的意思，阿兹特克人在祭祀的时候吃巧克力是把它当作一种致幻剂，一种兴奋剂使用的。而中国第一个吃巧克力的是康熙。


    # 信仰科学的人有多少？


    信仰科学不是把科学知识当宗教，而是坚持使用科学方法得结论的行动风格。所以信仰科学的人，可以看作是科学素养较高的一类人。


