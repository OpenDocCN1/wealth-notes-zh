    # 概念11：发展


    科学是从古代哲学、宗教和艺术中发展出来的，了解科学演化的历程，才更能体会科学的本质。由发展的眼光视察曾经困扰人类的那些疾病，你会发现，现代医学的出现，实际上拓展了生命的范畴，缩小了死亡的边界。


    # 104 | 发展：人人天生都是近视眼？


    人类天生都是近视眼，随着眼球的发育，视力会逐渐恢复正常，但很多人的发育没有停止，继续下去就发展成了近视，目前已经发现了16个近视易感基因，但仍然缺少决定性的证据。


    # 105 | 发展：近视眼的危害只有看不清吗？


    人类身体的“健康”与“不健康”，大多时候并没有清晰的界限，只要不影响寿命，对正常生活影响不大，就不在疾病的范畴之内。


    # 106 | 发展：从统计数据了解最危险的癌症


    统计数据是非常好的分析工具，但分析问题不能只关注统计数据，要先从问题中最主要的原因去考量，在了解了统计数据是怎么生成的之后，才能正确使用，避免发生数据正确，但结论错误的情况。


    # 109 | 发展：啤酒肚是啤酒造成的吗？


    喝啤酒很可能会引发肥胖，因为啤酒是饮料中热量比较高的一种，大约是普通可乐的90%，而且很少有人在喝啤酒的同时不吃其他食物。


    # 110 | 发展：古代人和现代人是怎么看待同一种病的？


    人类对于疾病的认知，建立在不断的真实观测所获取的具体知识之上，随着观测手段的进步，对于同一种疾病的认知逐渐升级，脱离了观测的思维式的抽象化思维，是有害无益的。


    # 111 | 发展：天花，富人比穷人死亡率更高


    天花病毒能广泛的传染人类，在于它能通过空气传播，而且在潜伏期就具有很高的传染性。人类不仅是对治疗天花没有特效药，而且是对针对绝大多数病毒都没有，被病毒感染后的痊愈，几乎都是等待自身免疫系统起作用。


    # 112 | 发展：天花是如何塑造了人类史的？


