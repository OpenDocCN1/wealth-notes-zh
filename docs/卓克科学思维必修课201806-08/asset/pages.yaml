  md: '# 复习+预告 | 不完美的科学


    复习+预告 | 不完美的科学


    # ——► 下周课程预告 ◄——


    # 关键词：不完美的科学


    下周的课里，我们会讲到一些采用了科学工具，但缺少科学方法得出的荒唐的结论，比如“圣经密码”，你会理解科学方法的重要性。我们还会说到当前科学范式中那些像裹脚布一样冗长的规则和废话，它们实际上已经在拖慢科学的脚步了。这些虽然都是科学的不堪和不完美，但也是全面了解科学必须知道的东西。


    247 | 反省：圣经里的密码


    248 | 反省：预测未来的准确率99.74%


    249 | 反省：科学江湖里的潜规则


    250 | 反省：那些真性情的论文


    # ——► 本周课程复习 ◄——


    # 概念24：反省


    科学是有力的，但内部也有各种问题，这些问题往往还是科学家们自我反省时公之于众的，甚至有科学家会把这些问题当做课题来研究。这让科学看上去没有那么完美，但这正是科学不断自我否定与完善的过程。


    241 | 反省：搞笑诺贝尔奖


    科学圈内部有些潜规则也是让科学家们不吐不快的，搞笑诺贝尔奖，就是以一种公开自嘲的方式，反省科学家的__:把发人深省的道理通过搞笑的方式呈现出来。


    242 | 反省：面包抹了黄油那一面更容易着地？


    +   1. 唯科学论，指的是对有些事物，科学界还没有形成很好的理论，或者还没有合适的模型来描述它的时候，却硬要给它套上公式计算，而且还坚信认为，算出来的结果是可靠的。\n2.
    一个好的研究，不但理论要成熟，而且要能全面地描述研究对象，得出的结论要有实验支撑。


    243 | 反省：什么时候需要假设上帝的存在？


    +   1. 200多年前的科学体系，认为世上的一切都包含在牛顿力学公式中，宇宙中的一切都是准确的，这是典型的科学决定论，是一种机械式的科学主义。\n2.
    当今一些人对科学的总印象，依然会抱以负面评价，就是对科学的认知停留在“科学决定论”阶段，对最近200年来的科学体系的发展缺少了解。\n3. 现代科学的发展，会随着观测水平的提升，新的证据的发现，不断地核实与订正。旧的理论会不断被纠偏与完善，甚至被新的理论取代。


    244 | 反省：一个物理学家为何挑衅一群人文学者？


