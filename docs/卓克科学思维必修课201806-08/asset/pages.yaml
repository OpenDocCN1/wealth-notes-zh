  md: '# 245 | 问答：庚子赔款退还算因祸得福吗？


    245 | 问答：庚子赔款退还...


    有同学在听完了中国科学是怎么出现的，一共5节课之后，提了一个问题，就是问：


    庚子赔款的退还，中国算不算是因祸得福呢？


    我想，福算不上，因为赔款的那几年负绩极为沉重，使全国都陷了瘫痪，灾民跟农民起义是不断的，社会秩序打乱，遭殃的总还是这4、5亿老百姓。


    但我觉得，起码可以算作一个很好的契机，就是让当时清政府统治下的中国，从一个各方面都弛死的状态，展现出了多样性。


    # ——多样性——


    如果大家认真听咱们科学思想课的话就知道，多样性是评价一个体系健康度最关键的指标，它比那些强大、优秀、科学、民主都要更重要。


    # ——庚子赔款退还——


    那庚子赔款的退还，确实给了中国人一个非常好的契机，就是大幅提升高等教育的水平。


    庚子赔款连本带息一共是9.82亿两白银，但是因为留美幼童的谈判，到最后各国同意退还的时候，我们一共执行了5.76亿两白银。


    # ——精英式的教育——


    1900年左右，税收之所以有1亿两白银那么高，是因为当时签了各种不平等的条约，打仗太多，支出多，所以清政府也在拼命地搜刮民间财富。


    # ——想不到的契机——


    1900年之后，各种赔款、内乱，外忧内患压垮了腐朽的清政府，但竟然提供了异常充足的经费来培养下一代社会精英，那这个结果是谁都没想到的。


