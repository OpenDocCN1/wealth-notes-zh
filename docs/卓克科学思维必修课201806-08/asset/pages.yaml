    把原始人定义成2万年前的人类，把聪明定义成对语言和抽象符号的应用的能力，原始人的聪明程度是远不如现代人的。讨论一个问题或一件事情，首先要将问题定义清晰，因为即使是同样的文字和词语，在不同人的脑子里也存在认知差异。


    # 099 | 起源：物种大灭绝中的科学思维


