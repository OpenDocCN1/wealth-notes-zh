  md: '其实普通人总愿意尽量地理科学结论，导致最终误读了科学的事情经常发生，甚至对于物理学也有这样的情况。


    比如爱因斯坦的相对论就是非常好的例子。相对论这个“相对性”一出，大家都会感觉，“嗯，相对论说的 wallpaper 绝对的东西是不存在的，任何东西都是相对的嘛。”于是就开始发挥自己的联想，用它来解读各种生活中的事情。


    而事实上，相对论的物理意义正好与之相反，爱因斯坦的相对论思考的初衷是不同运动状态的观察者看到的物理规律。


    它的数学表达形式是否恒定的呢？


    这种物理规律的恒定是否超越于观察者所处的特定的参考系呢？


    后来终于得出了结论，就是那些物理规律的数学表达形式是一致的，是恒定的。


    爱因斯坦在不同的场合也不止一次表达过，如果把现在我们所说的相对论称为恒定论的话，也许会更贴切。


    但是现实生活中，我们只从字面的意思过度解读。


    # —— 课程小结 ——


    那这节课，我们能从中学到什么科学思考呢？


    那就是，普通人用自己的知识存量去理解专业领域的知识的时候，大概率说会出问题。


    在相对论的理解上，我们看到了，这样的事情同样发生在心理学上。


    心理学已经是一个专业的学科分支了，它的科学性，部分体现在对象的可测，跟同行之间可以相互验证，这是心理学科学化过程中的第一步。


    当然，科学化的过程还有其它的部分，我们放在下一节课讲。


    # —— 课后思考题 ——


    你能举出一个学科的专业词被普通人到处误用，到处解读的例子吗？


    如果你想到了，就把它写在评论中。


    # 划重点


    +   1. 现代心理学的科学研究方法，扎根于测量，而不是古代的思辨式的思考方式。测量是一项每个细节、每个字都定义清晰后作的评估动作。 2. 在现代科学类的各个学科领域里，为了保证文字含义的表述足够清晰、足够准确，大量使用了专业的术语与词汇，这让大部分没有相应知识存量的普通人难以理解。
    3. 人们对心理学这个学科的偏见，就是普遍低估了心理学作为一门学科分支的专业度跟复杂度。


    卓克

