    因为西方对小分子的药物研发、生产、审核的管理非常到位，所以中国对这类药物的引进也就直接把管理制度拿来用了。


    而在这种制度下，中国几乎是没有原研药的。

    中国的药企本质都是生产药的工厂，而不做原研药，是因为成本太高。


    像上世纪90年代的时候，一款国际公认的药物研发费用，平均就已经超过10亿美元。据说现在是20亿到30亿美元之间。


