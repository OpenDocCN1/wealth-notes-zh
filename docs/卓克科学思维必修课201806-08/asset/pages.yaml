  md: '# 概念07：证据


    有证据的判断才能得出好结论，好观点基于已知的事实。


    032 | 证据：硬币的边缘为什么都是锯齿？


    牛顿使用科学思维中寻找证据的方法，了解假币的数量、材质、制造方式，系统性地总结假币的历史。不仅治理了假币问题，还发明了防伪工艺，并帮助英国建立了金本位金融系统，由此获得骑士爵位。


    033 | 证据：像追星族一样深挖牛顿身世


    司徒克雷用了20多年，弄清了那些几乎不可能有人能挖到的牛顿的身世资料，得以让今人看到一个更为真实的牛顿。这是科学思维中一个重要的思考方法，要求研究对象是可查证的，便于今后订正与核实，还原事实和真相。


    034 | 证据：侏罗纪白垩纪这些奇怪的名字怎么来的？


    地质年代名称的背后，是考古发现和化石证据。考古学，是先有赞助的证据，才出现理论框架的。就像不知图案的拼图游戏，你不知道图案是什么，只能依据插片特征，用逻辑推理去判断、去拼插。正是这些基于事实的证据碎片，让我们得以窥视世界曾经真实的模样。


    # 概念08：计算


    数学是科学的灵魂，而科学又是技术的源头，技术又是生产力增加、生活条件提升的必要条件。


    043 | 计算：爱因斯坦每天跟谁一起下班？


    爱因斯坦与数学家哥德尔一起散步回家的习惯持续了13年，直到去世。对数学价值理解深刻的人，他们的精神世界是普通人难以理解的。


    044 | 计算：为什么数学家对质数很着迷？


    质数的意义在于，当我们研究透了以后，我们会重新认识数的结构。对于西方的古代先贤来说，重要的元素就是"数"和"几何"，这种价值观沐落千年，直到文艺复兴运动里的科学复兴，才让人类重拾了那份荣耀，也再次获得了打开现代文明大门的钥匙。


    045 | 计算：未知数用XYZ表示，怎么不用其他字母？


    数学从全都是文字表达到使用字母和公式，由法国数学家韦达发起，笛卡尔最早开始用XYZ代表未知数。同时代数学最强的意大利因为宗教束缚逐渐落后，法国成为核心，由数学作为原动力生长出来的文化，正是现代科学。


    046 | 计算：羊皮卷里的微积分


    公元前200多年的古希腊时期，阿基米德对微积分的理解，与1800年后的牛顿、莱布尼茨是差不多的，人类文明在那时曾经非常接近爆发点。因为数学是科学的灵魂，而科学又是技术的源头，技术又是生产力增加、生活条件提升的必要条件。


    049 | 计算：微积分可以解决什么样的问题


    每个学科的发展都是有脉络的，具体知识成果什么时候出现，是存在先后条件的，数学也是如此。现在一个有理工科本科数学基础就能解决的问题，在相应的数学工具诞生之前，纵然是达芬奇、伽利略，也无能为力。


    051 | 计算：最短需要几年才能成为大数学家？


    没有大学学历的伽罗瓦，用6年时间就做出了大数学家级别的成果，但他去世24年后，"大数学家"的身份才被承认。在学术圈之外看，这看起来不公平，但在圈内，鉴别一个人的学术能力，名校高级别的学历，是最高效的证明。


    052 | 计算：最酷的数字是什么？


    现实的自然世界中，绝对的平行是不存在的。只要尺度放得足够大，都会有发散的趋势，形成螺旋，小到DNA的螺旋，大到星系物质的分布，它们的底层规律，都包含自然常数e。


    053 | 计算：计算机可以做证明题吗？


    数学的核心在于数学思维，不在于计算过程。一个命题最重要的意义，不在于是否被证明，而在于求证过程中不断发现的新方法和对抽象思考能力的锻炼。


    055 | 计算：现代数学研究什么（1）


    一个领域的知识如果不断地深入发展，都有一个趋势，那就是从具体化到抽象化。数字的出现，也反映了事物从具体到抽象化的过程，是一种人类文明的升级。


    056 | 计算：现代数学研究什么（2）


    集合论是现代数学的基础，大数学家康托一步一个脚印地定义了集合的各种运算和各个集合之间的关系，甚至将无穷都在逻辑上严格地定义了出来，这是人类纯粹智力活动的最高成就之一。


    057 | 计算：现代数学研究什么（3）


    科学突破越大，遭受的阻力也就越大，它必须能经受住科学家共同体的质疑。希尔伯特肯定了康托的成果，数学界借助集合论打造了数学大厦，但却被罗素指出问题，引发了第三次数学危机，经过30年的修补，又被哥德尔指出新的问题。这就是科学家共同体所共同遵循的世界观和行为方式。


    058 | 计算：现代数学研究什么（4）


    布尔巴基学派的数学研究，让人类智力活动达到了一个巅峰，抽象到了极致。数学对现代人的现实意义，是训练大脑的抽象思维能力，而抽象化思维能力的强弱，很大程度上决定着每个人在现代社会生存，能看得多透，走得多远。


