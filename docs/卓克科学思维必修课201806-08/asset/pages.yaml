  md: '# 复习手册 | 模块一：思维与方法


    卓克


    你好，我是卓克。


    我们的全部课程，一共讲了312节，共分成4大模块，29个概念，为了方便你能及时复习，并迅速找到相关知识点，我特意为你制作了这份“复习手册”，你可以用它来回顾自己是否掌握这个关键知识，如果不是很熟悉的话，可以直接点击“每一节课的标题”进行复习。


    # ——►模块一：思维与方法◄——


    # 概念01：极限


    你会发现，如今的世界，技术的极限不可思议。


    001 | 极限：为什么电价夜间减半？


    1831年法拉第发明了手摇式发电机，这个原理发展出的“发电厂”成为了第二次工业革命的基础。如今，人类已经把发电厂的各个方面的细节应用到了极限，其复杂程度超过了普通人可以理解的程度。


    002 | 极限：太空垃圾会不会越来越多？


    太空技术的激烈竞争，才有了我们日常使用的通信、定位、天气预报等服务，而“副产品”太空垃圾，却可能是人类未来迈向太空的门槛。我们安稳地生活在地球表面，是有无数已经发挥到极限的技术做后勤的，而我们对此知之甚少。


    003 | 极限：硬盘装满电影会变重吗？


    1956年，IBM把世界上第一块硬盘交付使用，容量只有5MB，租金每月大约19万人民币。我们现在使用的数据存储，在50年前是极为奢侈的，之所以发展到今天这个程度，正是工程师们把磁存储技术发挥到了极致。


    # 概念02：务实


    用工程师的视角看世界，只解决迫在眉睫的问题，没有必要的就不去做。


    004 | 务实：手机的屏幕越来越大的真相


    因为手机处理芯片的功能越来越高，从工程师的角度来看，最有效的解决办法就是让屏幕更大，这背后的逻辑是务实的思想，而不是为了满足用户的视觉效果。


    007 | 务实：二维码破损了还能扫出来是怎么回事？


    工程领域的方式是，如非必须使用，就无需发明新的东西。二维码的出现是因为条形码不够用了，而条形码的普及，是因为美国超市手动输入小票信息不如扫条形码快。


    008 | 务实：为什么现在CPU的核心越来越多，8核/10核？


    单核心CPU的速度达到极限，在提升频率的路上撞到了“发热”这面墙，为了提高性能，工程师只好走多核心路线，但上升空间也有极限。


    009 | 务实：为什么没有动物比蓝鲸的体型大？


    从发热散热的角度，以及肢体承受力上看，蓝鲸的体型已经是动物的极限，那种几十米高的怪兽不可能存在。也许第一次明白这个道理，你会觉得这个世界真没意思，但当你成熟之后，心中的世界本应该就是牢固和稳定的。


    # 概念03：数字


    从数字的角度理解世界。


    010 | 数字：如何感受1亿？


    对于“亿”和“纳米”这类巨大或者特别小的数值，绝大多数人都严重缺乏认知。实际上，你只要把这些数字囊括到日常生活可以触及到的范围内，就能够体验数字这种抽象的概念了。


    013 | 数字：发电全都用太阳能，可行吗？


    当我们某个问题的答案很远时，不太可能得到一个可靠的答案，但我们可以抓住几个重要环节做2-3步的估算，与真实情况接近的结果就会浮出水面。


    014 | 数字：别在数量级上犯错误


    每一个站在珠穆朗玛峰脚下的人，都会发出平生最大的感叹。但以比例关系来看，实际上地球表面比篮球还要平滑得多，我们要警惕那些最浅显、最直接的感受，不要被它们遮住判断力，避免在数量级上犯错误。


    015 | 数字：坟墓什么时候占据整个地球？


    墓地在几代人之后就会被遗忘，大部分保存不过百年，所以土地资源不会被无限占用。现实中很多事物都存在类似的“约束条件”，所以不能以不变的规律做近似计算。


    016 | 数字：多少个药物分子才能治疗疾病？


    药物起效，并不是因为它们有能力寻找病灶，而是凭借超大规模的数量，均匀地分布在血液中，让你身体的每个细胞都被数量庞大的药物分子包围，直接针对的微生物。


    # 概念04：复杂


    复杂的技术，也是可以触及的。


    019 | 复杂：空姐为什么总让我们打开遮光板？


    人们坐飞机时会要求打开遮光板，一是让所有乘客帮助观察机身外的情况；二是一旦出现空难，方便救援人员看清机舱内的情况。飞机这么复杂的装置，本以为都是专业仪器和人才能触及到的，但在特殊情况下，普通人也可以用肉眼帮助排查故障。


    020 | 复杂：鸡蛋还能预防流感？


    疫苗用鸡蛋培养，这让我们得以与复杂技术建立了认知上的联系。但是，科学和技术终将发展到外行人很难理解的程度，只有不断地学习，迭代自己的认知，才能在面对复杂事物时，不觉得退却不及，更不会在面对未知时，惊慌失措。


    # 概念05：变量


    变量太多，不要轻易下结论。


    021 | 变量：续航400公里的电动汽车怎么跑了250公里就没电？


    近似计算是在我们手头没条件做实测的情况下，又不得不请个大概率可用的绝招。当面对变量太多的情况时，如果有能力，当天去实测一下会更为有效。科学思维是一种很务实的思考，哪个更有效就选哪个。


    022 | 变量：安全带增加多少安全性？


    安全带增加了司机的安全性，也增加了行人在事故中的死亡率。但行人的死亡率几十年几乎无变化，而随着汽车安全设施的发展，司机的死亡率下降了。安全带的安全性是变量非常多的问题，只有许实地查证才能下结论。


    025 | 变量：飞机上为什么不让用手机？


    飞机上不让用手机，从科学角度看，不能说绝对有信号干扰，也不能证明没干扰，因此只能参考成本和风险这两个变量，干脆禁止使用。但随着人们对手机等设备使用需求的大幅增加，依然是参考成本和风险这两个变量，禁令开始被逐渐解禁。


    026 | 变量：不靠谱的食物热量表


    影响食物能量吸收的因素：食物本身热量、生熟区别、细菌数量、人体吸收率、人体自身 Leslie、肠道微生物……当变量复杂到一定程度，我们只能定性地去把握，比如你要减肥，就少油腻、多蔬菜、多运动。如果还按照
    vague 值计算结果去展开行动，往往会导致偏差，还不如不做。


    # 概念06：模型


    使用模型工具，解决那些复杂的、未知的、难以测量和观察的问题。


    027 | 模型：离得那么近，为什么地球质量是火星10倍？


    火星质量是地球的1/10，而它又是地球的近邻，为什么体重相差如此之大？用模型解释是最合适的。模型是用来描述世界、理解世界的工具，它的优势是比靠解决那些复杂的、未知的、难以测量和观察的问题。


    028 | 模型：怎么判断其他行星上是否有生命？


    高等生命的形成成为复杂，很难理解。但通过建立“持续可栖息带”模型，从最大尺度上规划出生命诞生的必要条件，比如需要什么样的恒星？行星需要离恒星多远？只要大背景条件符合了，那么小因素就可以在大框架下慢慢演绎。


    031 | 模型：天气预报为什么不准？


    天气预报的模型非常复杂，输入值微小的变化，也可能引起后续计算的巨大误差。中国使用天河二号超级计算机，拥有超过3.2万个气象站，依然无法准确认测。科学研究中建立模型，其目的是解决无数同类问题，只要下功夫不断优化，获得的答案也会变得更加准确可靠。'
