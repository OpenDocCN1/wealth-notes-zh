  md: '# 复习+预告 | 一个学科凭什么叫科学？


    ![](img/53a7c268f3a15189714e4eef36c78daf_44_0.png)


    复习+预告 | 一个学科凭什么叫科学… ↓


    # ——► 下周预告 ◄——


    # 关键词：一个学科凭什么叫科学？


    说到科学，大部分人脑中浮现的都是物理、化学的样子，所以会对心理学算不算科学多有质疑，上周的课里，我们把心理学为什么是科学，但又为什么是一门年轻的科学类学科讲清楚了。


    下周的课里，我们继续说心理学，而这次我要介绍一些科学体系内常用的思想武器了，它们是如何确定因果关系的方法，双盲实验，还有如何判断结论可靠度的方法。


    这些方法，都是最近100多年来才形成完善体系的方法论，和以往历史中出现的思考方式相比，它们最大的不同就体现在，抑制住了人们通过思辨式、“拍胸脯”的方式、神谕式的方式，得到结论的冲动，让人们更加谨慎地做判断，是不是能得到更多正确的理论不好说，但至少可以少犯错误。


    # ——► 本周课程复习 ◄——


    # 概念26：心理


    心理学科学化的时间还非常短，从经验到知识，从看上去包罗万象到满足可验证可复现的理论，观察这种转变，不 Ged 知道科学思维是什么，更能在研究人的情绪、行为、心理状态时，获得更稳固的答案。


    259 | 心理：被低估的心理学


    +   1.心理学年轻的表现，是很多普通人都觉得自己对心理学研究能有一定的了解，但实际上，普通人基本没有能力按照心理学的标准来分析陈述问题。 2.一套理论或实验，如果不要求可复现、可验证的话，那任何一个通过思辨方式产生的理论，都可以描述万事万物。


    260 | 心理：心理学科学化的第一步


    +   1.现代心理学的科学研究方法，扎根于测量，而不是古代的思辨式的思考方式。测量是一项每个细节、每个字都定义清晰后作的评估动作。 2.在现代科学类的各个学科领域里，为了保证文字含义的表述足够清晰、足够准确，大量使用了专业的术语与词汇，这让大部分没有相应知识存量的普通人难以理解。
    3.人们对心理学这个学科的偏见，就是普遍低估了心理学作为一门学科分支的专业跟复杂 度。


    261 | 心理：心理学为什么一定要科学化？


    +   1.一个研究对象，满足了可测量，测量的动作清晰规范，测量的方法有比较好的信度和效度，那么就做到了科学化。 2.在现代科学研究的方法论中，思辨的研究之所以被完全抛弃了，是因为一个理论如果不具备可测量的属性，那它就不能被有效验证，而且总能自圆其说。
    3.一个结论或一套理论，在没有交给心理学研究共同体之前，在没有接受心理学同行的苛责之前，在没有受到期刊读者极为严格的审查之前，永远都不能将其为科学知识。


    262 | 心理：被安慰剂效应左右着的思维


    +   1.安慰剂效应普遍存在，无论是否服药，心理上的自我暗示都会让人感觉“好受一些”，但病理上并没有好转。如果是心理疾病，安慰剂疗效会很明显。 2.个案能成为引发研究的入口，但它作为样本成为后续的研究对象，就一定要满足严格的规范、有足够高的一致性、质量和数量。大量低质量的个案推导出的结论，一样不合格。
    3.个人主观感受无法成为合格的参考，通过高质量的、有规范的统计数据，才能获得稳固的结论。


    # 答疑时间


    263 | 问答：如何测量梦境？


    +   1.如果一个测量对象是比较主观或者误差比较大的东西，想要获得更有价值的结果，最好的办法就是做统计，获得统计意义上的结论。 2.在梦境中，有少部分人能意识到自己在做梦，而人在做梦时眼球的现实动作与梦中是一致的，可以利用这一点，在梦境和现实中搭起一座桥梁，这让测量梦境成为可能。
    3.任何一个问题，用科学方法研究，做到可测量、可验证，才能获取更准确的答案，思辨哲学式的解释很难以具有参考性。


    264 | 问答：福中生祸，演化角度看基因疾病


    +   1.在人类中，亨廷顿基因前面的 CAG 片段，正常人的重复次数在8到35次之间，次数越多，智力越发达，但36次和36次以上，100%会发病，并最终死亡。
    2.亨廷顿基因前面的 CAG 片段重复次数越多，神经细胞间会产生更多勾连，神经功能就越发达，在演化的过程中，表现出的是智力的发达。 3.物种演化产生的优势或者劣势，没法提前分析出来，所以在任何情况下，对长远发展最有利的特征，就是保持多样性。


