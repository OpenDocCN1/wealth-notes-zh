  md: '# 284 | 衰老：体温为什么会恒定？


    # ——►概念27：衰老◄——


    衰老，是每个人都会经历的，但它并不是每个生物都会经历的，有些动物就没有明显的老化，甚至越老越强。了解衰老，是科学地树立世界观必须的环节，它可以帮助我们更坦然地面对比生命的最后阶段。


    如果按照体温的类型来分，我们可以把动物分成变温动物和恒温动物：


    +   像青蛙、蜥蜴就是变温的；

    像哺乳类动物跟鸟类就是恒温的。


    那怎么区分变温跟恒温动物呢？

    就是要看它们身上的热量来源自哪。


    +   如果来自环境中，那就是变温的；

    如果来自自己体内，那就是恒温的。


    变温动物只在一天中的某段时间里，能维持35至37℃的体温，一旦太阳光照不到它们的身<|start|>体了，体温就会迅速凉下来。


    # ——►从变温到恒温◄——


    所以你大概也能预感到，像我们这种利用能量的方式，简直是太耗费能量了，就像一辆车，不论行駛还是等红灯，甚至是过夜，发动机都不熄火。


    实际测量，这种浪费确实也是惊人的，两个体型完全相同，体重也相同的动物，一个是恒温的，一个是变温的。


    +   环境温度在20℃的时候，哺乳类动物平均一天的能量耗损是蜥蜴的30倍左右；

    如果温度降低到10℃的时候，哺乳类动物的能耗就是蜥蜴的100倍了。


    # ——►恒定体温的好处◄——


    自身可以发热，可以恒定体温，好处就很多了，比如：


    +   全年的活动时间就可以加倍了，因为夜晚是没有阳光的，对绝大多数动物来说，在夜间活动会造成致命的低温休。但 TX 它不存在这个问题，所以就相当于寿命翻倍了。

    好处还有，比如说活动范围增加了，不再像蜥蜴那样，生活在赤道附近，那些常年温度维持在20℃以上的狭窄区域里，甚至可以生活在半年有阳光，半年都没有阳光的极地附近。

    最明显的就是，因为体温一直保持一个良好的区间，所以各种催化剂常年都处于活性高的状态，所以这种动物的速度、力量、耐力都远高于那些早期的爬行动物。'
