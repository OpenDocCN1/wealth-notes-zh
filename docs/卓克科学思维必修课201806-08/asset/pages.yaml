  md: '# 复习+预告 | 细胞的死亡


    复习+预告 | 细胞的死亡


    # —— 下周课程预告 ——


    下周的课程里，我会讲恒温动物为什么会出现，其实这是自从生物出现后，自然界一直没变的筛选方向，就是：


    把那些可以快速做反映动作的个体筛选出来。


    恒定体温是这个筛选方向带来的副作用。


    这背后都要求生物体是一个耗能高手才可以。而高耗能设备，一般来说都面临更大维护的压力，这种压力就导致，如果生物体所有基因都藏于细胞核内，耗能设备就会来不及调整自己的输出功率。


    对人类来说，核内 DNA 的数据量虽然是线粒体 DNA 数据量的18万倍，但这最后一点点线粒体 DNA，无论如何不能转移到核内去。


    到此为止，活的细胞如何利用能量，你就了解到非常详细了。


    而细胞又是怎么死亡的呢？


    细胞的死亡代表着生物个体的衰老吗？


    我们对细胞各种不同的死亡方式，是怎么了解到呢？


    这些内容，我们会从对线虫这种“模式生物”讲起。


    这就是下周的内容，我是卓克，咱们下周再见。


    # —— 本周课程复习 ——


    # 概念27：衰老


    衰老，是每个人都会经历的，但它并不是每个生物都会经历的，有些动物就没有明显的老化，甚至越老越强。了解衰老，是科学地树立世界观必要的环节，它可以让我们更坦然地面对生命的最后阶段。


    277 | 衰老：跨越鸿沟，从细菌到真核生物


    +   1. 生物在演化中产生了物种的多样性，不同物种间是无法评判谁是胜利者的，一旦地球环境发生变化，优势可能变为劣势，而劣势也可能成为活下去的优势。\n2.
    微生物的寄生或感染，对宿主的毒性呈现出一代代减弱的规律：一方面，是没被杀死的宿主被筛选出来；另一方面，迅速造成宿主死亡的微生物，失去了繁殖基础，也难以留下后代。所以从客观上看，毒性减弱了。


    278 | 衰老：人体细胞燃烧功率，是太阳1万倍


    +   1. 每克人体由燃烧葡萄糖产生的能量，是太阳内部每克物质核聚变产生能量的1万倍。每一个真核生物，其实际都是耗能的高手，也正是因为有充足的能量，让地球上得以出现多样性的生命，而这一切，都源于氧气的出现。\n2.
    站在能量的角度看线粒体之于生命的意义，就会发现，生命的出现存在必然性，也存在偶然性，生命既会按照物理条件出现并演化，而在演化的过程中，偶然的事件也很大程度上奠定了生命演化的路经。


    279 | 衰老：细菌为什么那么小？


    +   1. 不同的能量获取方式，演化出了不同的生命形态：有DNA序列短，但能够更快复制，只保留少数抗性基因片段，但能通过质粒进行基因平移应对危险物质的细菌；还有意外获得线粒体的真核生物，过于充足的能量，演化出了更多的生存策略。\n2.
    人体总处于能量过于充沛的状态，就会产生更多自由基，造成细胞出现损伤，所以轻断食，或者说适当地保持饥饿状态，对身体是有益的，有助于抵抗衰老。


    280 | 衰老：寿命长短有没有意义？


    +   1. 细菌的能量来源，是细胞壁跟膜之间一层薄薄的膜，同比比例放大时，膜上产能单位跟不上体积的增加，所以细菌的尺寸只能很小。\n2. 线粒体可以立体地分布在真核生物的细胞液中，解决了细菌的供能局限在细胞膜表面的问题，只要产能单位的数量能随着细胞体积增大同等程度地增加，能量供给就能做到收支平衡，这为真核生物生存策略的多样性提供了可能。


    # 答疑时间


    281 | 问答：新能源能成为主流吗？


