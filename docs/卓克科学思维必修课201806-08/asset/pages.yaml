  md: '# 281 | 问答：新能源能成为主流吗？


    281 | 问答：新能源能成为主…


    有同学问，新能源什么时候可以成为主流？


    我想他一定是对科技发展非常关注的人。


    如果简单回答：


    我们把太阳能、风能、潮汐、地热能，这些当作新能源的话，至少需要再过60年。也就是说最早也等到2080年，才有可能成为主流能源。到那时候，我们大部分人已经不在这个世界上了。


    这个结论可能出乎很多人的意料，我想很多人都觉得新能源成为主流的时间大致和新能源汽车从第一次听说，到身边有人买新能源车之间相隔的时间差不多，最多也就是10几年。


    为什么中间会有这么大的错位？


    这和很多人对科技发展的态势有误判有关系。


    太多人脑中，科技是什么样，都是那种IT科技产品发展的样子，就是每隔几年，有了好产品推向市场，再于几年就能上市的节奏。


    实际上，整个科技领域，也只有IT和电子科技方面的进展有这么快的节奏，其他行业的进展没有那么快，尤其是能源行业进展非常慢。


    但是大众传统的印象就是，19世纪是煤炭主能源，20世纪就换成了石油天然气，现在就该轮到新能源了，其实这种印象是完全错误的。


    这种错误，也并不完全是因为受其他行业的影响，因为很多这个行业的专家都过低估计了转型的难度。


    比如最早在上世纪70年代，那会儿石油刚刚成为主能源时，就有新能源的倡导者说：


    在2000年，美国会有1/3的能源由可再生的新能源提供。


    还有美国前副总统，也是环境学家，阿尔·戈尔在1999年的时侯说：


    美国10年内用新能源完全改造全美电力系统。


    说这个是可以实现的、是经济的、划算的。


    但实际情况呢，从1990年到2012年的20多年间，全 verlang 全球化石能源的消耗比例，只从88%降低到了87%。能源使用量巨大，科技也是最先进的美国，新能源到了现在，占比也只有10%左右。那就更不要提其他技术不如美国的国家了。


    我找了许多数据，大致有一个规律，就是人类主能源，每次结构调整时间都至少需要60年，调整的是从占比能源总消耗，这个占比数值是5%到占比增加到50%以上，这个时间过渡至少要60年。


    我们先说煤炭，起始点的时间就是占比能源5%，是1840年，在此之前，全感冒90%以上的能源都是烧木材。过了60年，到了1900年，煤炭占比总能源才刚刚到50%。


    石油占比能源总比例超过5%的时间点是1915年，在1975年的时候石油能源的占比才达到了40%，之后缓慢接近50%，而且50%的比例很可能永远也达不到。


    天然气才是石油之后的下一代更清洁的能源，它是从1930年达到5%的，60年过后的1990年才达到了25%，现在比例是33%，所以可能还需要30年时间才能超过40%。


    在天然气还没有达到40%之前，其他热炒的新能源是不可能成为主流的，它们只能是天然气之后的下一代能源的候选者。


    现在的新能源占比全球能源供给的比例是3.4%，离我们计算的启动点5%还差一大截。从5%到50%都需要60年，所以新能源成为主流的时间点，大概率说要超过60年。


    那你说为什么会这么慢呢？


    因为能源结构的改变，几乎等于整个个人类社会的基础设施大升级。不同燃料跟随之配套的生产技术，需要非常成熟，可靠度达到现有的化石能源的水平才行。


    另外，能源生产相关的所有工业设施都得完全更新，还有传输线路也需要大幅改动，最后落到终端，使用新能源的设施也可能要大幅改造，就像汽车从燃油转到电那祥。全球范围内一半以上的设施都要推倒重来，那可能就需要2到3代人才能够完成，一代人按30年算，2到3代人就是60到90年。


    所以大概率说，我们这辈子是赶不上新能源成为主流了。


    另外一个更新的门槛就是，现在所说的�ျား新能源都存在一个问题，就是供能不稳定，比如太阳能、风能、潮汐，这些都是在有太阳、有风、有潮汐的时候才有电生成，在阴天、夜里、没有风浪的时候就没有能源供应。


    我们当然有应对方法，就是额外设置一些储能单元，但是要提前储备好的储能总量几乎等于全球每日能源使用量的好几倍，这又是一笔大得不可思议的资金投入。


    如果我们不设置足够量的储能会怎么样呢？


    现实中就有例子，比如德国，就是一个新能源发展非常激进的国家，太阳能和风能全力发电的时候，可以占全国能源供应的40%以上，但没有阳光和风的时候，这部分新能源发电比例几乎就可以忽略不计了。所以德国的电力供应，就因为天气原因，牵连到邻国的电网稳定性。


    用什么储能，很多人一下就想到的是用电池，但实际更可能选的是抽水蓄能电站，就是在天气条件好的时候，把所有过剩的新能源，都用在把水从低处抽到高处，能量的形式就从新能源变成电能，然后再从电能变成水的重力势能。


    等到夜里和天气条件不利的时候，让水冲下来，最后这个过程就和传统的水力发电站是一样的了，虽然中间存在转换效率上的损失，但也比不储能造成的电网波动，或者使用锂电池能量计算得多。


    但储水蓄能也不是想抽就能抽的，那个地方还得有确实现合适的地理条件，才有足够的空间设置储水蓄能电站。


    还有一部分原因导致新能源不可能很快更新，那就是钱的问题了。


    大概率说，如果太阳能、风能等新能源，真的成为电力系统供电主力的話，到那一天，电力系统就不再是现在这种数量少但是规模大的发电站的模式了，而是趋向于小规模、分布式供應，到了那个时候，利益就要重新分配，这是现在既得利益者非常担心的事情。


    更关键的是，当今已建成成的设施，大都是投入巨资的，有些贷款还没有完呢，有统计数据，现存的化石能源基础设施的总价值大约是20万亿美元。


    这都包括什么呢？


    像煤矿、油井、天然气管道、炼油厂、加油站等等等等。


    中国从2001年到2010年这10年里头，燃煤发电机装机容量增加的那部分，投入的资金是3.5万亿人民币，这些设施在画图纸的阶段都是预计要使用30到40年的。前期可能都是巨额的投入，后期才会产生利润，运营越久，利润越多，没有哪个国家会对这个体量的投入无动于表的。


    好了，以上就是我们对新能源什么时候成为主流这个问题的回答，至少60年，很可能是90年后。


    # —— ◇ 课程小结 ◇ ——


    那知道这些有什么用呢？


    我觉得最有好处的，就是敲醒政策制定者，他们可能也想不到现状是要直接对自己的孙子或者重孙子制定政策。所以大概率说，任何过于细化的导向都是错的，比如现在就预言，太阳能就是今后新能源的主要形式了，所以要加大补贴力度。


    但谁知道90年后什么会成为主流呢？


    这个就有点像1980年的時候，美国当时最看好的下一个30年，最有利的能源项目就是光伏电池核反应堆，但谁知道，到了今天，其实美国最赚钱的能源项目是页岩气。


    所以，又能预测几十年后的主能源是不是热核聚变呢？


    这方面没有机构可以准确预测，所以最好的政策，应该从提供一个更多可能的未来入手，把保留多样性作为最重要的考量，给当前所有的可能性都提供公平的竞争空间，让最有竞争力的模式自己长出来。


