  md: '# 信仰科学的人有多少？


    信仰科学不是把科学知识当宗教，而是坚持使用科学方法得结论的行事风格。所以信仰科学的人，可以看作是科学素养较高的一类人。


    # 杨振宁童年接受的是什么教育？


    在培养孩子过程中，家长要尽量避免拔苗助长，因为孩子的人生还很长，获得全面均衡的发展，对他们的未来更有利。


    # 海洋中的垃圾污染到什么程度了？


    塑料对海洋污染最严重的根源，在于它的化学结构极为稳定，物理尺寸可以缩小，但化学性质不变，不会被海水分解，也无法被海洋生物分解，永远不会成为生物圈的一部分。


    # 什么是演化的价值观？


    演化的价值观，尊重个体的自然生长和淘汰，在一定的框架内经历了自由竞争之后，有竞争力的个体应该具有什么特征，就会自然而然摆在你的面前。


    # 如何用科学研究神话传说？


    人类社会中的类似文化这种看似非科学领域的内容，在利用科学方法分析之后，不仅能带来新的视角，也可能让我们更接近真相。


    # 庚子赔款退还算因祸得福吗？


    演化的规律不只适用于生物，思想文化、文明类型也可以用演化的视角来理解。


    # “最有效的驱蚊药”是怎么被确认的？


    真正有效的驱蚊液，DEET 浓度要在30%以上才行，大约能提供4小时有效的防护时间。号称不含 DEET，或者含量低的，都效果差。


    # 人类13万年前就到达美洲了？


    要从“科学发现”发展到“科学共识”，就必须从各方面都发现强有力的证据，并得到高度一致的结论，结论还要能经受更多次的验证。


    卓克


