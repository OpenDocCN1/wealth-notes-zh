    # 概念28：批判性思维


    批判性思维，指的是在人格平等的状态下，对自己和他人观点做谨慎多角度地思考。它讲究逻辑和理性，是一种高效地积累知识的方法。很多人以为它是一种专门抬杠、反对的技巧，这是对
    “critical thinking” 这个词武断地翻译造成的误解，实际上，它体现的是 “带着高级技巧去审视” 的含义。


