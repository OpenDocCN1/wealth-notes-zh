  md: '心理学研究的主流结论，是针对人这个属性，这个属性在各个年龄阶段都有体现，在各种生活模式下也都有体现。 用实验测的不是自然生活条件下的表现为理由，是无法驳倒心理学主流理论的。


    # ——◆ 课程小结 ◆——


    那这节课我们能收获什么科学思维呢？


    那就是，对心理学的主流理论的看待方法。


    通过前几节课，我们先是知道了什么样的研究才是符合科学标准的。


    今天这节课，我们就应该了解这样的结论是在精心设计的实验过程中得到的，它跟现实生活当然不是严丝合缝地吻合，它必须得把干扰因素排除在外，才能找到几个重要的影响因素。


    这是任何学科作研究的时候，都要搞定的规范化的过程。


    # ——◆ 课后思考题 ◆——


    如果是从未经加工整理自然条件下得到的结论，那得到的会是一种什么水平的理论呢？


    如果你想到了，就把思考留在评论中。


    # 划重点


    +   1. 持相反结论的两个理论，哪个结论的一致性更高，就越可靠。 2. 任何学科研究规范化的过程，都是尽可能在精心设计的实验下排除掉干扰因素，只有变量的数量尽量地控制得少一些，才能更好地找到高的相关因素，甚至找到因果关系。
    3. 用实验测得的心理学主流理论，是不会被“不是在自然生活条件下的表现”驳倒的。


