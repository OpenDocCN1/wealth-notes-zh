    # —— 下周课程预告 ——


    批判性思维是在人格平等的状态下，对自己和他人观点做谨慎多角度的思考。


    很多人听到批判性思维，会以为这是一种专门抬杠、反对的技巧，这只是由于 Critical Thinking 这个单词武断的翻译造成的误解。实际上，它更接近“带着高级技巧去审视”的含义。


    它既包含科学精神，也讲究逻辑和理性。可以避免被人误导，也可持续发现自己的错误，是一种高效的积累知识的方法。


    # —— 本周课程复习 ——


    # 概念27：衰老


    衰老，是每个人都会经历的，但它并非是每个生物都会经历的，有些动物就没有明显的老化，甚至越老越强。了解衰老，是科学地树立世界观必须要的环节，它可以让我们更坦然地面对生命的最后阶段。


