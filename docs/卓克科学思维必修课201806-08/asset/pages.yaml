  md: '# 311 | 问答：从破除误区角度看颈椎病


    311 | 问答：从破除误区角度...


    # 问答


    在后台给我留言的问题里，有人问我，去找盲人按摩，会不会对预防颈椎病有好处呢？

    还有人问，乳胶枕是不是对颈椎有好处？


    那么这些问题，我都通过破除误区这个角度来回答一下。


    # ——► 颈椎病的定义 ◄——


    第一个误区就是：我们以为的颈椎病，其实并不是医生眼中的颈椎病。


    对于35岁以下的年轻人们来说，就算是有人脖子都很难受了，其实也极少是医学标准下的颈椎病。因为这个病症往往需要积累比较久的时间，一般要二三十年不断地地摩擦颈椎，才能出现病变。


    颈椎一共7节，大家现在就可以用手稍微用力按每 informacje 一节，相信有一些人就会感觉到颈椎的某一节沙沙的响，或者有一个小肿块，嘎嘎嘎嘎的声音。甚至有的时候还有点疼。


    其实这些状况如果继续恶化个10年、15年，那真正的颈椎病就来临了。


    之所以会响，是因为在那儿出现了慢性的筋膜炎，也就是肌肉纤维和筋膜产生了粘连，所以，会发炎是因为在这个部位长期受到不均匀的压力，它总是保持一个姿势，这种刺激如果持续了10几年，那颈椎间盘也会响应这种刺激，开始增生。增生就会带来挤压，就就会为真正医生所说的颈椎病了。


    好，那现在你知道，医生所说的颈椎病是什么了。


    那就是颈椎间盘挤压周围的组织。


    医学上按照它挤压的部位不同，主流上把颈椎病分成4类：


    第一类，是挤压了脊髓。

    就是对大神经束的挤压，它会产生各种不同的效果。比如说典型的走路像踩棉花一样。


    第二类，是挤压了椎动脉。


    这会造成脑供血不足，头会非常晕。当然，有N多种病都会造成头晕，不要觉得我是低头一族，我头晕，我就是椎动脉型的颈椎病，那不一定。


    第三类，是神经根型。


    人体从上到下，沿着脊椎，垂直分布着很多神经根，每一段都对应负责身体一部份神经。

    颈椎部分可以覆盖到的神经根就已经涉及到手臂部分了，所以这类颈椎病患者他们小拇指会麻麻的，甚至严重的胳膊都抬不起来。而且这一类的颈椎病是占比最高的，因为它出现的症状跟病对应的非常清晰。一旦出现了这种情况，其实已经说明颈椎问题比较严重了。


    第四类，是压迫交感神经。

    这类占比非常少，但一旦压迫之后就会造成心跳不正常，血压不正常，体温不正常，而这些问题往往又跟很多中老年人的疾病是高度重合的，所以很容易误诊。


    以上就是4类颈椎病，它们的严重程度都远远超过年轻人们所说的，我脖子不舒服，我颈椎不舒服。


    # ——► 治疗方案 ◄——


    那如果真的患了颈椎病，或者说想预防颈椎病的话，那接下来我再说几个误区。


    比如说找人按摩能不能好一些呢？

    其实几乎一点用也没有。


    有的公司每周专门请人给员工提供按摩服务，算是公司的福利。还有的人是自己去按摩店，或者是同事之间相互靠着按摩。但这些按摩对颈椎病，不论是缓解还是预防，都一点用都没有。


    ![](img/53a7c268f3a15189714e4eef36c78daf_144_0.png)


    这个机器的外观就像一个颈椎的托，一端抵在下颌上，一端撑在肩膀上，然后中间有一个气囊，充气之后两端的长度会被拉长，于是颈椎就有了拉伸的效果。


    这个跟在医院里做牵引有那么一点像，所以说上去貌似是有道理的。但其实你如果真的在医院做过一次颈椎的牵引，你就会发现，这个东西是完全没用的。它的力量远远达不到正规牵引的力量。'
