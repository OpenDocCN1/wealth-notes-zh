  md: '# 299 | 问答：要警惕科技带来的威胁吗？


    ![](img/53a7c268f3a15189714e4eef36c78daf_117_0.png)


    299 | 问答：要警惕科技带来...


    # 问答


    有同学听了袁老系列的内容就问，如果今后真的有可能通过科技手段大幅地延长人的寿命，会不会是次难堪？要不要警惕这类技术，甚至禁止这类技术的发展呢？


    我觉得这个问题可能已经超出了我们当前 deduced 道德标准。


    如果站在现状上看，应该是禁止这类技术的应用的，不能让某些人可以永生下去。


    但是一切道德标准都不是孤立存在的，这就像一切法律不是简单的条文那样。


    道德跟法律都是一群人中占大多数的人历史上的认同，把这些概念上的认同通过规则抽象出来，那么法律就是标准比较低的一种抽象，而道德是标准比较高的抽象。


    历史上有很多技术都是从需要人们警惕，发展到人人都在使用。


    比如说试管婴儿，从前就是一件非常不道德的事情，但现在全球已经有几百万的试管婴儿了。


    我们是否禁止某项技术的发展，是依照当时的情况下，“加和”的收益来衡量的。如果对最广大的人群来说，收益更大，损失更小，那么这项技术几乎必然会被允许使用的。


    比如说2012年，一个荷兰的研究小组研究H5N1禽流感，对这种病毒做了一个基因改造，就能让它拥有在空气中传播的特性了。


    但这个研究刚开始，就被禁止了。


    因为这种研究如果最后完成了，发表了论文之后，恐惧绝组织一样会看到技术细节，那只要他们愿意，就可以模仿论文中的基因编辑过程，自己制造大量的，可以在空气中传播的H5N1禽流感病毒。


    近几年，人们一直很关注禽流感，其中一个重要的指标就是这种病毒有没有进化出在空气中传播的能力。


    因为之前它们传播只是通过接触，病毒在空气中是很容易死亡的。而一旦拥有了空气传播的特性，就是一个超级危险的信号了，说不定会导致全球占人口一定规模的人死亡，就像1918年那次大流感。


    你看，最开始的权衡，就是损失大于收益的，但是后来美国的生物安全专家委员会还是允许了他们发表结果。他们这次改主意，也是因为进一步的权衡，发现收益更大。


    为什么呢？


    +   第一，改造后的病毒虽然具有空气传播的特性了，但是毒性却大大降低了；

    第二，关于这个病毒的基因如何编辑，虽然没有公开发表过论文，但实际上在科研圈里头已经是公开的了；

    第三，公开之后，会有更多的科学家参与研究，就会出现更多的诊疗用预防的手段，反而不担心被恐怖组织利用了。


    所以你看，被改造的那个病毒仍然是那个病毒，没有变，但对它的研究到底是造福人类，还是危害人类，这中间的界限就非常模糊了。


    这样模糊的研究还有，比如像铀235分离的技术。


    不论是制造核燃料还是制造核武器，都需要用到铀235。但是天然环境中的铀99.3%都是铀238，要想从中分离出物理性质跟化学性质都非常接近铀238的铀235，才是核技术的关键。


    那怎么分离呢？

    一直以来的方法就是使用大规模的离心机。


    这可不是一台离心机，而是几千台离心机组成的一个多级分离系统，这个系统不但占地面积非常大，而且还非常耗能，每台离心机的制造难度还非常大。


    要制造一批具有实战威力的原子弹，要用到的高浓度的铀235，可能需要这组离心机工作几个月才能收集全，所以这也是全世界绝大部分国家在核条约诞生之前，没能开发出核武器的原因。


    但是现在技术进步了，不用离心机也可以。

    用什么呢？

    就是激光技术。


    激光分离的技术简单说，就是用激光照射在铀蒸气上，把激光的频率调整到位之后，激光会让铀的外层电子处于被激发的 Heck...


    但是我们调整到被激发的只有铀235，而铀238没被激发，被激发的铀235就拥有了不同的电特性。拥有了不同的电特性，那么就方便了，只要想办法用电场或磁场去收集它们，就可以把铀235和铀238彻底地分离。


    这种方法其实韩国已经被发现在使用了，是在2004年的时候，韩国科学家只花了几个星期的时间，就能把少量的铀235浓缩到可以用于制造核武器的那个高浓度。


    也许等到那么一天，激光技术真的发展到很高的阶段，那些可以用于分离重元素的激光器价格就便宜多了。到时候，一个国家是不是在偷偷地提炼铀235，用卫星拍摄地面，是根本监控不了的。这种首先到会几，完全可以在实验室里搞定。


    那这个时候需要衡量的是，因为限制公开激光技术、限制激光技术的发展而带来的损失，和那些一直惦记着拥有核武器后威胁全世界以达到自己自冶目的的国家，他们有多少可能性能自己分离铀235呢？


    那么以现在的情况看，激光技术的普及跟发展是不可阻挡的，所以从前因为技术跟成本门槛过高而出现的核平衡，势必会在今后被打破。


    还有一些会改变整个人类命运的技术。比如像全球变暖，这是一个难以解的问题。但其实现是有冒险的解决方案的。这个叫做“地球工程”。


    这是通过人工手段影响太阳对地球的辐射。比如说把大面积的微小的颗粒散播到平流层里头，让这些颗粒挡一部分阳光照住，这样太阳输入给地球的热量减少了，全球变暖就会缓解。


    不过温度降低并不是阻止全球变暖的终极目的的，全球变暖带来的更大问题是二氧化碳在空气跟海水中的浓度猛增。


    这在“地球工程”里也有方案，就是向海洋投入大量的铁，让藻类疯长。过量的藻类就会吸收过量的二氧化碳，等藻类死亡之后，还会沉到海底，这样二氧化碳就算被封在固体当中了。


    其中这第一个方案，往平流层散播小颗粒的方法，就是英国政府赞助研究的，参与的大学甚至都有牛津、剑桥、爱丁堡这些著名的大学。


    除了这个方案在技术上如何实施，这个方案实施之后还会有某些副作用，也是研究的重点，比如说会不会影响全球降水的分布，还有一些间接的副作用，比如说现在各国已经签署的减排的协议条约怎么办，等等等等。


    # ——▶ 课程小结 ◀——


    我们经常听人说一句话，就是：

    技术是一把双刃剑，看你怎么用了。


    而我觉得，在准备实施某项技术的人的心中，技术不是双刃剑，技术都是好的，它总是可以给他们带来更多益处的。在他们心中，技术是单刃剑，这个双刃剑的效果只出现在他的利益跟别人的利益发生冲突的时候。


    最近几百年以来，全球的价值观都是在向着人是最值得珍贵的，人利益排在第一，这条路上。有些国家走得更远，有些国家刚刚起步，这样的价值观在历史上属于是最新鲜的一种新生价值观。


