    \n柴田先生，\n\n![](img/3969b8e159188951fa62b2b7751397ae_24_7.png)\n\n![](img/3969b8e159188951fa62b2b7751397ae_24_8.png)\n\
    \n點不 小\n\n哈哈。\n\n您好。往後請多指教。\n\n我是朝比奈的教育人員，我叫做真田。\n\n喔……喔。請多指教。\n\n容我再次自我介紹。\n\n\
    精 實 女\n\n今天關於這項方案……\n\n你好……我叫做真田零士。\n\n我想朝比奈已經說明過了。\n\n好，成交一件了。\n\n推銷保險很简单吧？\n\
    \n怎麼了？河豚。\n\n我今天有點受到打擊。\n\n為什麼比起我……第一次見面的真田前輩能成功簽約？\n\n竟能讓柴田先生露出那種笑容，而我卻做不到。\n\
    \n哼。不用腦袋思考，就算拜訪再多客戶也不會有成果。\n\n重點在於如何有效地將印象留給客戶。\n\n![](img/3969b8e159188951fa62b2b7751397ae_27_0.png)\n\
    \n初始效應。人的第一印象在5秒內便會決定。\n\n![](img/3969b8e159188951fa62b2b7751397ae_27_1.png)\n\
    \n「剛才我一見面 5秒內就留下了值得信賴的印象。」\n\n「要怎麼做？」\n\n![](img/3969b8e159188951fa62b2b7751397ae_27_2.png)\n\
    \n這個印象很難推翻。所以第一印象最為重要。\n\n![](img/3969b8e159188951fa62b2b7751397ae_27_3.png)\n\
    \n人的腦袋對於對方顯著的特徵容易留下強烈印象。\n\n你的儀態。好 了 不 錯 。\n\n要隨時保持這種狀態喔！\n\n好 好 …… 費力 ……\n\n\
    抖動 抖動 ……\n\n頭頂感覺被一條綵線吊著！\n\n縮下巴！\n\n撐住\n\n拾 頭 挺 胸 — 身 子 挺 直 — 啪 啊！\n\n如果不能維持，就去買條正皮帶吧！\n\
    \n嗯，總之，想獲得信任就是這麼簡單。\n\n人的心理，很容易掌握。\n\n又是……\n\n可是松田小姐是女性，我還可以理解，連對男性也有效……\n\n「哼……妳忘了嗎？」\n\
    \n奇怪的心理技巧\n\n我的心理技巧是為了建立良好的人際關係。\n\n與性別無關，如果不能獲取人心就沒用了。\n\n可是，我不甘心\n\n比起我這個女孩子，真田前輩給人的感覺更好……\n\
    \n啊！\n\n該不會柴田先生是這型？\n\n你是如假包換的笨蛋嗎？\n\n快步快步快步快步快步\n\n## COLUMN 2 初始效應 / 月暈效應\n\n\
    ### 先從外表操縱⼈。隨⼼所欲地操弄形象\n\n無論在工作或私⽣活，當然在戀愛⽅⾯，任何⼈都希望往來的人覺得⾃⼰是優秀的人，對⾃⼰⼼存善意。不論何種⼈際關係，⽐起被認為「⽣理上⽆法接受」或「工作無能的⼈」，被認為「這個人值得信任」或「是好⼈」會⽐較好，⾃是不⾔⽽⾔。⽽影響這個印象的，坦白說就是\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_32_0.png)\n\n**第一印象。**\n\n人都會憑第一印象判斷對方。雖然多少因人而異，不過大致上見面後3分鐘，一個人的印象就決定了。\n\
    \n可怕的一點是，此時抱持的印象不僅限於當時，之後仍會持續影響印象與評價。換言之，如果給人這種印象：「真是邋遢的人。大概工作也做不好吧？」之後無論工作多認真，也很難推翻新負面形象。\n\
    \n如此，最初獲得的資訊影響之後的印象就稱為「初始效應」。不懂外表、光是詞語的順序也會顯現初始效應。例如指著某人說：「他很聰明，可是愛勾搭女人」，和「雖然他愛勾搭女人，可是他很聰明」，前者比較\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_33_0.png)\n\n容易被理解成是個好人。\n\n如果想自由操控人心，首先一定要徹底改善第一印象。除了健康的外表，髮型、指甲與肌膚等，服裝儀容當然要整理好。衣服要注重清潔，服裝搭配也要適合時間、地點與場合。如果個性內向很容易吃虧，那就不用大聲有朝氣地說話，最好留意「展現「理想的姿態。「假如有學歷、職銜或證照等對自己而言正面的資訊，多多活用也很有幫助。藉著這些正面的資訊，感覺一個人的人格也很出色，這就叫做「月暈效應」。\n\
    \n譬如說，企業的廣告找當紅藝人來拍攝，也是利用了月暈效應。外表出色或擁有人氣的人和產品一起亮相，就能提高產品的品質與魅力。由色的學歷代表聰明、職位代表能力、證照表示具備了豐富的專業知識，這些都能增添你的魅力。配合對方積極活用，在第一次見面時留下良好的印象吧！\n"
