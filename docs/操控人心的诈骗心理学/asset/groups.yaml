    ## 認知失調理論


    ### 讓不喜歡的事對手

    迷失的惡魔理論


    對任何事都充滿攻擊性的人很難駕馭，當他對你露出敵意時更是麻煩。明明技能不足以相提並論，卻擅自把你視為競爭對手，或是扯你後腿，你每每因此感到困擾。


    不過，如果出手反擊，連你都會被當成同樣水準的人。最好用計讓對方迷失，自己喪失鬥志。


    為此必須記住美國心理學家利昂·費斯汀格所提倡的一認知失調理論。這個理論說明了人在遭遇到與自己設想的不同場面時，為了設法消除失調而改變行動與想法的心理。


    伊索寓言中，狐狸找到了看起來很好吃的葡萄，可是果實都結在很高的地方而摘不到（失調），「那些葡萄一定很酸，一定很難吃」。狐狸拋下這句話（消除）的故事十分淺顯易懂。為了消除認知失調，將原本覺得「很好吃」的想法換成「很酸」、「很難吃」。


    卻說，讓我們回到喜歡爭吵，令人感到困擾的競爭對手的話題。當他


    對你造成困擾，說三道四的時候，你要克制怒氣，反過來稱讚他。

    對方本來期待或者預料你會反擊，所以會陷入「情況有異」的失調狀態。以對方的立場，他只料想要被你討厭，不可能被你稱讚。

    就競爭對手而言，這種失調的狀態非常不愉快。因此，他會想要設法逃離。並且以為「也許他真的是好人」。如此一來，主導權就在你的掌握中了。認為對方是好人，就不可能找對方吵架。不但不再敵視，對你所說的話也變得寬容，也會想起應你的要求與期待，之後你就能隨心所欲做自己想做的事。

    或許有人覺得，稱讚不喜歡的人


