    前者是只告知好的一面的「一面提示」，後者是也告知壞的一面的「兩面提示」。推銷洗衣機時，哪種話術才有效呢？


    社會心理學家林理在以大學生為對象的實驗中，得知有8成的大學生對於一併告知壞的一面的廣告有好感。換言之，兩面提示的好感度較高。美國陸軍情報教育部所進行的實驗中報告結果也指出，教育程度愈高的人愈不認同片面提示，反而容易被兩面提示所說服。


