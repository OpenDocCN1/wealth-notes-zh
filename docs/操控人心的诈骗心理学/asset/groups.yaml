    在你身邊是否有被周遭人們仰慕的人呢？下屬尊敬他：「真不愧是前輩」，上級也稱讚：「果然○○君值得信任」，大家都很想像成為這種人。


    其實，獲得自己的「信徒」絕非難事。只要利用心理學的「巴納姆效應」，任何人都能輕易地獲得信徒。


    這個名稱的由來是，在 19 世紀利用巧妙的心理操作，建立起超現實馬戲團基礎的藝人費尼爾司·泰勒·巴納


    ### 讓對方變成你的信徒的方法


    ![](img/3969b8e159188951fa62b2b7751397ae_46_0.png)


    姆的名字。他是知名的騙子，即使告訴交談對象胡扯的個性診斷與占卜結果，對方也會覺得「說得很準」。例如，當你聽到這種話會怎麼想？

    「你有時候會對自已非常悲觀。」

    「你在工作上有煩惱吧？那也許是與人際關係有關吧？」

    列舉之後，你會發覺這些話可以套用在任何人身上，盡是一些理所當然的內容。然而實際上，在對話中聽到時卻感到納悶：「為什麼你會知道!？」有這種想法的人非常多。

    美國心理學家伯特倫·佛瑞證明了這一點。


    ![](img/3969b8e159188951fa62b2b7751397ae_47_0.png)


    他把解說個性的文章「你的心理檢查結果」交給多名大學生，大多數學生都表示「很準」。然而實際上，交給所有學生的文章都是同一篇。而且是把星座占卜結果隨便組合製成的，亂七八糟的個性分析。


    如此毫無根據地說出：「雖然你是○○，但其實是××」，對方也會覺得：「只有他了解真正的我」，自尊心因而受到滿足。

    任何人都疼愛自己。並且對於了解自己的人會無條件地視為夥伴，願意全面地相信他。


    假如想利用巴納姆效應，指出與平常的形象完全相反之處會更有效。


    豪邁的人擁有細膩的感受性、開朗的人具有悲觀的一面，這些都可以指出來。

    對方不知不覺中便會把你當成唯一的知己，也會變成你的信徒。


