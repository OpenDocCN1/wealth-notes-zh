    ## **c o l u m n 9 兩面提示**\n\n1. 刻意告知缺點\n2. 獲得信賴\n3. 產品就會暢銷\n\n假設你是一名家電推銷員。你要推銷一台非常高性能，去汙效果很好，可是聲音有點大的洗衣機，你會想出怎樣的話術呢？\n\
    \n聲音大小的感覺因人而異，有些人或許不會在意。但是只說明優點：「這台洗衣機能非常好，去汙效果也很出色」，或是一併告知缺點：「這台洗衣機能非常好，去汙效果\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_130_0.png)\n\n敵公司的方案有不如虎威人壽的一面。\n\n\
    也無可挑剔，只是有些人會在意它的聲音」、「給對方的印象將大為不同。\n\n前者是只告知好的一面的「一面提示」，後者是也告知壞的一面的「兩面提示」。推銷洗衣機時，哪種話術才有效呢？\n\
    \n社會心理學家林理在以大學生為對象的實驗中，得知有8成的大學生對於一併告知壞的一面的廣告有好感。換言之，兩面提示的好感度較高。美國陸軍情報教育部所進行的實驗中報告結果也指出，教育程度愈高的人愈不認同片面提示，反而容易被兩面提示所說服。\n\
    \n只聽到事情的優點時，人總是會心存質疑：「有這麼好的事嗎？」\n\n![](img/3969b8e159188951fa62b2b7751397ae_131_0.png)\n"
