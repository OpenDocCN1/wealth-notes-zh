    \n沒有放棄真是\n太好了！\n\n哇！\n\n太好了\n\n好好\n\n![](img/3969b8e159188951fa62b2b7751397ae_168_0.png)\n\
    \n可是結果，\n前輩卻直接\n辭職了。\n\n# 辭職\n\n半年後——\n\n是！\n託前輩的福。\n\n山本！\n今天也成功\n簽約了呢！\n\n白象病院\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_169_0.png)\n\n和真田前輩一起度過的 那些日子…\n\n\
    嗯。\n\n有時我會回想起\n\n心理技巧 真是厲害！ \n\n真田前輩，你現在 在哪裡做些什麼呢？\n\n前輩？ 趕緊回公司 整理報告吧！\n\n我先走囉！\
