  - '[PAGE 132]


    可能會猜測是否有別有內情，擔心自己是否上當受騙。像這種情況，兩面提示非常有效。


    兩面提示與片面提示適合的情境並不相同。對任何事都喜歡批評的人、對產品與服務不熟悉的人、想憑自己的意思決定的人，這時兩面提示非常有效。另一方面，從一開始就接受產品與服務的人、或非常熟悉產品的人、討厭麻煩事的人，片面提示則比較合適。另外，兩面提示還有事前預防客訴的效果。


    不只產品，兩面提示對人也有同樣的效果。例如希望客戶或喜歡的人提高對你的好感度時，不只自己好的兩面，缺點也要一併告知對方。


    有個必須掌握的重點是，告知缺點與不好的一面的時機。最好是與對方往來一段時間，他對你有些好感之後。自己提出的優點愈好時，刻意說出缺點反而會令人覺得優點的可靠度愈高，因此十分有效。'
