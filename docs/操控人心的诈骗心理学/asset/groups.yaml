    \n## 7 負面框架\n\n### 煽動整合的恐懼感，就能輕鬆成交\n\n在商場上，每天都進行著各種商業活動。即使再好的產品與服務，如果沒打開知名度，就不會有人購買。正因如此，業務員每天都積極地跑業務。那麼，在心理學上是否有絕對有效的推銷方法呢？\n\
    \n雖然有各種手法，但最有效的是利用「恐懼」的心理。例如不論「改善高血壓就會身體健康」，改成「高血壓會引起動脈硬化，提高死亡率」，這種說服法的效果更佳。\n\
    \n這種從反面提出訴求的方式稱為「負面框架」。\n\n比起正面的內容，人們原本就傾向於關注負面的內容。從大腦的機制來看，接收負面訊息會刺激壓力迴路，於是分泌正腎上腺素。正腎上腺素會喚起興奮狀態，促進集中力，因此更容易吸收負面訊息。而這也是負面訊息具有強烈效果的原因。\n\
    \n為了有效運用「負面框架」，必須利用恐懼感將負面訊息灌輸給對方。以下依序說明：\n\n- ①讓對方感到害怕\n  徹底灌輸對方若不購買產品損失會有多大，將會承擔不利後果，讓對方感到害怕。\n\
    - ②教導逃離恐懼的手段\n  告訴對方有這項產品，可以避免在①灌輸的損失。\n- ③讓對方認清減輕恐懼的效果\n  告訴對方這項產品能帶來哪些效果。不妨舉出具體實例與數據、圖片、「顧客意見」與口碑。\n\
    - ④讓對方相信能夠實行\n  「原本定價〇〇日圓，現在只要××日圓」、「相當於每天 1 罐咖啡的支出」，提出容易被接受的金額，對方便會思考…「那我也負擔得起。」\n\
    \n不順利、痛苦、損失或落後於人……都是害怕不利，會去思考如何避免的動物。若能善用恐懼感，你想推銷的產品一定能順利銷售。\n\n「對啊」\n「對啊」\n「當然對啊」\n\
    \n> 她們當然明白\n> 重新檢視人壽保險\n> 會比較好。\n\n> 重新檢視後\n> 改買我們的保險\n> 也是為了她們好。\n\n![](img/3969b8e159188951fa62b2b7751397ae_103_0.png)\n\
