    # **想販賣產品就穿插賣得離譜的商品**


    有一種類似詐騙的銷售手法，是將老人聚集到會場，向他們推銷很廉價的羽毛被或健康食品。在那種地方5萬日圓、10萬日圓的高價商品會快速賣出，不過，在一般店家即使擺放了相同價格的商品，也很難想像老人會瘋狂搶購。為何會擺脫束縛大肆購買，實在令人覺得不可思議。


    這種疑似詐騙的推銷手段，暗藏了巧妙操控人心的各種企圖，不過最


    ![](img/3969b8e159188951fa62b2b7751397ae_158_0.png)


    > 推銷時就使用了

    本田教授的

    心理技巧——

    對比效應。


    > 「人會在無意識中

    比較多種選擇。」


    > 厉害呢！'
  - '[PAGE 159]


    淺顯易懂的說法是「對比效應」。


    這是指最先看到的與接下來看到的東西有段差距時，感覺差異比實際上更大的心理現象。例如看到一千五百日圓的商品後又看到一千二百日圓的商品時，和只看到一千二百日圓的商品時相比，會覺得更划算。


    同樣的道理，騙子介紹「這條棉被現在只賣三十萬日圓！」之後，再招呼一聲「這一款只要十萬日圓整！」老人就會覺得：「很便宜耶！」


    假如真正想賣的是十萬日圓的商品，不要直接拿出來，要先刻意拿出三十萬日圓的「貴得離譜的商品」。這不只是只有騙子才會使用的手段


    ![](img/3969b8e159188951fa62b2b7751397ae_159_0.png)'
  - '[PAGE 160]


    法，而是習以為常地充斥在我們身邊。

    例如鰻魚飯專門店有「松、竹、梅」的定價。松最貴，竹、梅的價錢依序降低，這是大家熟悉的定價。而統計公布分成3種價格後，有6成的人會選擇中間的竹。而松與梅則各占2成。

    反過來利用這一點，在竹的位置刻意放盈利率高的菜色，有效率地賣完份數的餐飲店並不少見。比起只推出竹，設定高價的松與低價的梅，能發揮對比效應的作用，也就容易銷售主打商品。

    販售汽車與房屋等高價商品時，也經常利用對比效應。顧客買車時也


    會被推銷汽車導航系統或車內設備等選購項目；買房時提出家具、清掃或裝潢服務也是常有的事。這在購買幾百萬、幾千萬的高價物件後，幾萬日圓（幾千萬元圓的金額就會看起來不算什麼，這正是對比效應。

    在你想推銷產品時，不妨採用這項技巧。'
