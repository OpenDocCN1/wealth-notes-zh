    臉紅\n\n謝謝你。\n\n咦！？\n\n你說什麼？\n\n唖~~！？\n什麼也沒說，\n笨蛋！\n\n啪\n\n話說回來，\n巨像保險的\n業績就全看你們\n\
    這些業務員了。\n\n要是業績稍微滑落，\n我絕不會饒了你！\n\n是！\n還請您繼續\n指導鞭策！\n\n# 12 莫斯科維奇的策略\n\n![](img/3969b8e159188951fa62b2b7751397ae_172_0.png)\n\
    \n在會議等許多人聚集的場合主張自己的意見時，無論怎麼看少數派總是形勢不利。會議上洋溢著「好啦，閉嘴」的氣氛，面對多數派的巨大聲音可能會畏縮不前。\n\n\
    不過，如果對自己的意見有絕對的自信和堅持的熱情，這時屈服就太可惜了。即便是少數派也能推翻多數派的方法，在心理學實驗中已經證實。\n\n那就是「持續主張不放棄」。可能因為聽起來很簡單而看不起它。這是由法國心理學家塞奇·莫斯科維奇所提倡，稱為「莫斯科維奇的策略」或「少數人的影響（minority\
    \ influence）」。\n\n所謂minority正如字面意思，就是指少數派。即便是少數派，縱使自己的立場和經歷不如旁人時，只要一貫地重覆自己的主張，絕不改變態度，就能推翻多數派的意見。\n\
    \n莫斯科維奇以6名實驗者為對象，讓他們看幾張藍色幻燈片，然後\n\n請他們回答是什麼顏色，藉由實驗證明這個心理現象。6人之中其實有2位是實驗幫手。其餘4名看到藍色幻燈片並回答「藍色」，2名幫手則是一貫持續回答「綠色」。\n\
    \n當然這是明顯的錯誤，可是2人持續回答綠色，竟然影響了另外4人，實驗結果是他們變成也回答綠色。\n\n因此重點是，貫徹自己主張的態度絕不能改變。你持續說：「絕對是這個比較好！」多數派之中可能有人覺得：「也許我錯了」、「他的意見或許有些道理」，因而內心開始動搖。並且，這種想法的人愈多，推翻局勢的可能性就愈高。\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_173_0.png)\n\n![](img/3969b8e159188951fa62b2b7751397ae_173_1.png)\n\
    \n若是在公司，沉默的人為了保身，可能會使形勢對你有利。\n不過，堅決主張也可能害你被降職，有些情況可能會被迫離職。\n此外，最近企業資訊公開的意識高漲，如果真是正確的行動，即使一時不利，也有可能引發姑且一試的舉動。\n\
    \n如果真的沒有錯，貫徹主張也許能獲得意想不到的贊同與支持。\n\n![](img/3969b8e159188951fa62b2b7751397ae_174_0.png)\n\
