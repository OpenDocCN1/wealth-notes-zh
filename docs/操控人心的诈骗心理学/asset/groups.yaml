    ## Column 10


    ### 比馬龍效應／反比馬龍效應


    ### 讓下屬自己提起幹勁！好主管應該學習的方法


    有了下屬大家都想當『好主管』。然而下屬並非總是如己所願地行動。有不少人對於下屬缺乏幹勁毫無成長感到焦躁。


    當中主管一定要學會培養下屬的技巧「比馬龍效應」。這是由美國心理學家羅森陶所提倡，指的是一個人愈受到他人期待，就會愈提起幹勁，並獲得預期成果的傾向。


    ![](img/3969b8e159188951fa62b2b7751397ae_144_0.png)


    希臘神話中的塞浦路斯國王比馬龍深愛自己雕刻的象牙少女像，後來雕像變成真人，因為這段逸事而如此命名。換句話說，不要叱責下屬：「提起幹勁！」或灌輸恐懼感：「沒達成業績就會降級喔！」期待下屬「你做得到」、「我相信你可以」，才能增加下屬的幹勁，獲得良好的成果。


    「真的會這麼順利嗎？」有這種疑問的人，請看以下兩個心理實驗的介紹。第一個是，在舊金山的小學進行利用智力測驗的實驗。該智力測驗是為了選出智力優秀的學生，在將名簿交給級任導師時，告訴老師「名簿上的學生是學力優秀的孩子」。


    其實測驗本身並沒有特別的意義，但是級任導師滿心期待地對待學生，學生的成績因此提升了。


    美國心理學家赫洛克進行的實驗是以國小5年級學童為對象。在5天的算數測驗期間，將學生分成3組。然後稱讚其中一組、叱責其中一組、剩下一組則沒有任何動作，之後比較成績。結果，受到稱讚的一組成績提升了。


    如此稱讚滿心期待，就能提升下屬的幹勁，不過此時的重點是，要稱讚獲得結果前的努力與過程。這在心理學家卡蘿·德威克的實驗中也揭曉了。假如不誇獎努力，而是稱讚結果與才能，往後過於害怕失敗，面對困難的問題便不會表現出熱情。


    順帶一提，比馬龍效應的相反是「反比馬龍效應」。「你沒朋友」、「沒有人會幫你」，持續說出這種話，下層就會失去希望與幹勁。因此嚴禁濫用。


