    **column**


    ### 先提出不合理的要求，之後你的要求大多會被接受


    向人拜託不易辦的事情時，所需的並非誠意、笑容或跪地請求。當然這些可能也會有效，可是如果想要有效地運用有限的人生，白費力氣被拒絕實在很可惜。讓對方陷於不得不接受請求的狀況，自己的要求就會過關。為此應該有效地利用心理學。提出困難的請求時，稱為「留面子效應」的心理手法非常有效。它另一個名稱是「讓步的請求法」，是業務員的慣用伎倆，相信許多人不止一次聽過這個名稱。


    方法其實很簡單，首先在真正想拜託的事之前，先向對方提出難度更高、非常過分的要求。當然一定會被對方拒絕，這時稍欲降低難度，或是提出難度較低的原本的請求。


