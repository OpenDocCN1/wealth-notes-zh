    # 8 三定理論／反差效應


    ![](img/3969b8e159188951fa62b2b7751397ae_116_0.png)


    雖然有喜歡的人，可是感覺對方

    對你印象不好……

    「反正不可能了」、「在你放棄之

    前，這時有個心理技巧值得一試。那

    就是「反差效應」。如同字面意思，

    要利用意外性，表現出不同於對方對

    你的想法，而且是對方喜歡的樣貌，

    藉此有效地提升好感度。

    因此，必須先分析為何你不受喜

    歡？不妨委婉地詢問身邊的人。


    ![](img/3969b8e159188951fa62b2b7751397ae_116_1.png)'
  - '[PAGE 117]


    假如是「輕浮」、一個性陰沉」, 等可以改善之處就是好機會。如果對方認為你很輕浮，可以在假日用功準備取得證照，或是表現出參與志工活動的一面。


    倘若對方覺得你很陰沉，表現出喜愛運動或戶外活動的一面也是個辦法。當然說謊被拆穿反而會使印象更差，應該避免胡謅毫無根據的事。不過，藉著談戀愛拓展自己的興趣，嘗試新事物也是不錯的經驗。


    即使第一次見面喝得爛醉嘔吐，留下最差勁的第一印象，也有捲土重來的方法。


    英國聖安德魯斯大學進行的實驗導出了「三定理」，以下將為各位介紹。在實驗中，邀請了數名女性分 3 次回答對於某位男性的印象。第 1 次……男性故意採取會被討厭的態度。


    第 2 次……男性自自由於過去的痛苦經驗，所以不善於待人接物。


    第 3 次……對女性採取溫柔的態度，並且為第 1 次的態度道歉。


    當然在第 1 次，男性的印象最差。然而第 3 次結束時，9 成的女性對男性皆回答「頗有好感」。第一印象完全抹去了。


    假如第一印象犯了下致命的錯誤，這時就放棄有點可惜。應該去見第 2、第 3 次面，表現出端正的態度藉此刷新印象。'
