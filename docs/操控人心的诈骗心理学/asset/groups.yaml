    \ 提案也很有 吸引力呢！\n\n自顧自呆\n\n就我而言，我也想和你們公司繼續往來。\n\n不過長久以來都是同一個方案，基於重新檢視的考量，請你們在一週後提出新方案。\n\
    \n我知道了！我們會提出不輸給巨象保險的方案。\n\n之後比較過兩家公司的方案，我們會再做判斷。麻煩你了……\n\n捏爛\n\n嗯，那敬期待一週後囉！\n\n\
    可惡的真田……\n\n![](img/3969b8e159188951fa62b2b7751397ae_115_0.png)\n\n![](img/3969b8e159188951fa62b2b7751397ae_115_1.png)\n\
