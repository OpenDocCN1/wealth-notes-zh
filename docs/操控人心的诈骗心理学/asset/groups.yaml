    \n「要不要投保方案B？買吧！」 這樣能成交就不需要業務員了。\n\n你是徹頭徹尾的笨蛋嗎？\n\n真田前輩，剛才那種說法，\n\n![](img/3969b8e159188951fa62b2b7751397ae_15_1.png)\n\
    \n「要不要買這份保險？」\n\n「不是問「要不要買這份保險？」\n\n「要在簽約的前提下詢問「您想選擇A？還是B？」\n\n這也是希特勤使用的心理技巧，叫做錯誤的前提暗示，算是入門而已。\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_15_2.png)\n\n可是，這樣簡直像詐騙啊！\n\n![](img/3969b8e159188951fa62b2b7751397ae_15_3.png)\n\
    \n所謂推銷，就是運用這些心理技巧成功簽約。\n\n015\n\n你……是不是誤會了？\n\n我的心理技巧是為了與他人建立良好的關係。\n\n那位阿姨也很開心吧？讓客戶滿意，提升業績是哪種不對……\n\
    \n可是，我不喜歡這種做法！\n\n![](img/3969b8e159188951fa62b2b7751397ae_16_0.png)\n\n用對 亮眼業績的背後\
    \ 竟然藏有 這種祕密……\n\n那你就一輩子 業績吊車尾吧！\n\n不過， 我绝不認同 他的做法！\n\n## COLUMN 1 錯誤的前提暗示\n\n\
    ![](img/3969b8e159188951fa62b2b7751397ae_18_0.png)\n\n納粹德國的知名獨裁者阿道夫·希特勒為了增加自己的支持者，運用各種掌握人心的技巧，這件事為人知。例如他對於民眾頻繁地提出二選一的問題：「要戰鬥？或不戰而逃？」「被猶太人支配這樣好嗎？還是殺光他們？」──向人民提出這種極端的二選一問題，似乎沒有除此之外\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_18_1.png)\n\n外的選項。這項技巧是提問者刻意在未獲得應允的前提下發問，因而稱為「錯誤的前提暗示」。\n\
    \n收到問題的一方，明眼除了二選一以外還有別的選項，面對突然提出的二選一，卻會陷入思考，無意識地選擇其中之一。\n\n這項技巧的可怕之處在於，比起二選一的行爲，收到問題的一方感覺上是自主決定，實際上無論選擇哪個選項，都採取了發問者預料之中的行動。\n\
    \n這項技巧在銷售或推銷的現場也經常使用。例如，在鞋子賣場店員會以下列形式推薦產品：「如果要搭配您現在的衣服，這邊褐色或黑色的鞋\n\n![](img/3969b8e159188951fa62b2b7751397ae_19_0.png)\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_19_1.png)\n\n子很合適喔！」倘若是一般雙褐色鞋，您您覺得如何？』這種推薦方式從顧客的立場來看，就是『買』或『不買』褐色鞋子的二選一問題，當問法變成「褐色」或「黑色」的二選一，便已將購買當成前提。\n\
    \n就顧客而言，雖是自主性選擇黑色或褐色，但若是從更宏觀的觀點思考，應該還有「去其他店購買」或「不打算買」這些選項。\n\n聽到這種銷售話術時，暫時打住仔細思考非常重要。\n\
    \n另外，這種心理技巧也能應用在戀愛方面。譬如邀請中人吃飯時，你是否這樣開口：「下次一起吃飯吧？」這種問法是以「是」或「否」來回答問題，所以對方很有可能回答「不要」。\n\
    \n為了不讓對方說「不」，只要在對方已經答應吃飯的前提前提問便可。換句話說，這時應該如此提出邀約：「中華料理和義大利料理，你想吃哪一種？」\n\n無論對方回答何者，「一起吃一飯」這個原本的目的都已經達成。\n\
    \n# 第2章 初始效應／月暈效應\n\n這麼簡單就成功簽約……真厲害。\n\n可是。那種做法我絕不認同！\n\n咳？\n\n你幹嘛臉鼓得像河豚一樣？\n\n\
    你是誰？河豚啊？\n\n別說這個了，其他有可能買保險的客戶有誰？\n\n那個。對不起啦。\n\n另一個叫田中的男性\n\n有間公司做柴田的機會的。保單是\n\
    \n喔？有發現什麼？\n\n？\n\n原來如此。這個保\n\n他似乎對我的頭腦是了 一番...\n\n一提到保單態度就含糊不清……\n\n妳從外表 就不行啊！\n\
    \n蛤？\n\n打量\n\n![](img/3969b8e159188951fa62b2b7751397ae_24_0.png)\n\n![](img/3969b8e159188951fa62b2b7751397ae_24_1.png)\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_24_2.png)\n\n好，去拜訪吧！河豚。\n\n我不是河豚…！…\n\
    \n是！您記得我啊！\n\n![](img/3969b8e159188951fa62b2b7751397ae_24_4.png)\n\n喔，寶保險的，你是朝比奈小姐。\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_24_5.png)\n\n柴田先生！午安！\n\n![](img/3969b8e159188951fa62b2b7751397ae_24_6.png)\n\
    \n柴田先生，\n\n![](img/3969b8e159188951fa62b2b7751397ae_24_7.png)\n\n![](img/3969b8e159188951fa62b2b7751397ae_24_8.png)\n\
    \n點不 小\n\n哈哈。\n\n您好。往後請多指教。\n\n我是朝比奈的教育人員，我叫做真田。\n\n喔……喔。請多指教。\n\n容我再次自我介紹。\n\n\
    精 實 女\n\n今天關於這項方案……\n\n你好……我叫做真田零士。\n\n我想朝比奈已經說明過了。\n\n好，成交一件了。\n\n推銷保險很简单吧？\n\
    \n怎麼了？河豚。\n\n我今天有點受到打擊。\n\n為什麼比起我……第一次見面的真田前輩能成功簽約？\n\n竟能讓柴田先生露出那種笑容，而我卻做不到。\n\
    \n哼。不用腦袋思考，就算拜訪再多客戶也不會有成果。\n\n重點在於如何有效地將印象留給客戶。\n\n![](img/3969b8e159188951fa62b2b7751397ae_27_0.png)\n\
    \n初始效應。人的第一印象在5秒內便會決定。\n\n![](img/3969b8e159188951fa62b2b7751397ae_27_1.png)\n\
    \n「剛才我一見面 5秒內就留下了值得信賴的印象。」\n\n「要怎麼做？」\n\n![](img/3969b8e159188951fa62b2b7751397ae_27_2.png)\n\
    \n這個印象很難推翻。所以第一印象最為重要。\n\n![](img/3969b8e159188951fa62b2b7751397ae_27_3.png)\n\
    \n人的腦袋對於對方顯著的特徵容易留下強烈印象。\n\n你的儀態。好 了 不 錯 。\n\n要隨時保持這種狀態喔！\n\n好 好 …… 費力 ……\n\n\
    抖動 抖動 ……\n\n頭頂感覺被一條綵線吊著！\n\n縮下巴！\n\n撐住\n\n拾 頭 挺 胸 — 身 子 挺 直 — 啪 啊！\n\n如果不能維持，就去買條正皮帶吧！\n\
    \n嗯，總之，想獲得信任就是這麼簡單。\n\n人的心理，很容易掌握。\n\n又是……\n\n可是松田小姐是女性，我還可以理解，連對男性也有效……\n\n「哼……妳忘了嗎？」\n\
    \n奇怪的心理技巧\n\n我的心理技巧是為了建立良好的人際關係。\n\n與性別無關，如果不能獲取人心就沒用了。\n\n可是，我不甘心\n\n比起我這個女孩子，真田前輩給人的感覺更好……\n\
    \n啊！\n\n該不會柴田先生是這型？\n\n你是如假包換的笨蛋嗎？\n\n快步快步快步快步快步\n\n## COLUMN 2 初始效應 / 月暈效應\n\n\
    ### 先從外表操縱⼈。隨⼼所欲地操弄形象\n\n無論在工作或私⽣活，當然在戀愛⽅⾯，任何⼈都希望往來的人覺得⾃⼰是優秀的人，對⾃⼰⼼存善意。不論何種⼈際關係，⽐起被認為「⽣理上⽆法接受」或「工作無能的⼈」，被認為「這個人值得信任」或「是好⼈」會⽐較好，⾃是不⾔⽽⾔。⽽影響這個印象的，坦白說就是\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_32_0.png)\n\n**第一印象。**\n\n人都會憑第一印象判斷對方。雖然多少因人而異，不過大致上見面後3分鐘，一個人的印象就決定了。\n\
    \n可怕的一點是，此時抱持的印象不僅限於當時，之後仍會持續影響印象與評價。換言之，如果給人這種印象：「真是邋遢的人。大概工作也做不好吧？」之後無論工作多認真，也很難推翻新負面形象。\n\
    \n如此，最初獲得的資訊影響之後的印象就稱為「初始效應」。不懂外表、光是詞語的順序也會顯現初始效應。例如指著某人說：「他很聰明，可是愛勾搭女人」，和「雖然他愛勾搭女人，可是他很聰明」，前者比較\n\
    \n![](img/3969b8e159188951fa62b2b7751397ae_33_0.png)\n\n容易被理解成是個好人。\n\n如果想自由操控人心，首先一定要徹底改善第一印象。除了健康的外表，髮型、指甲與肌膚等，服裝儀容當然要整理好。衣服要注重清潔，服裝搭配也要適合時間、地點與場合。如果個性內向很容易吃虧，那就不用大聲有朝氣地說話，最好留意「展現「理想的姿態。「假如有學歷、職銜或證照等對自己而言正面的資訊，多多活用也很有幫助。藉著這些正面的資訊，感覺一個人的人格也很出色，這就叫做「月暈效應」。\n\
    \n譬如說，企業的廣告找當紅藝人來拍攝，也是利用了月暈效應。外表出色或擁有人氣的人和產品一起亮相，就能提高產品的品質與魅力。由色的學歷代表聰明、職位代表能力、證照表示具備了豐富的專業知識，這些都能增添你的魅力。配合對方積極活用，在第一次見面時留下良好的印象吧！\n"
