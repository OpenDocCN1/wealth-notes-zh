    ## 5

    ### 善意的自尊理論

    **column**


    ![](img/3969b8e159188951fa62b2b7751397ae_74_0.png)


    既出外工作，往往會碰上不盡人意的情況。譬如你非常忙碌，每天都被迫加班，這種狀態一直持續。


    然而這時，主管、前輩或討厭的資深女職員卻還把不合理的工作丟給你，這是常有的事。「這件工作要在明天之前完成。在我進公司前做完就可以了。」「順便把這個做好，很快就能完成吧？」有些人的要求就是會


    ![](img/3969b8e159188951fa62b2b7751397ae_74_1.png)


    ![](img/3969b8e159188951fa62b2b7751397ae_74_2.png)


    令人不由得發火。


    度過這種局面的最佳方法，並不是哭泣啼啼勉強為其難地接受。應該毅然決然地拒絕。


    比方說自己的工作量已經得花不少時間，或是正在做很緊急的工作，加上理由會更容易拒絕。


    無論如何，最大原則則是不要絮絮叨叨地舉出各種理由，別讓對方逮到機會。


    再來，這件事還有後續。堅決地拒絕主管無理的要求，可能會對人際關係與工作造成障礙。就算閃過了主管的請求，工作失靈難行就沒有意義了。考慮到往後的事，利用「善意的自尊理論」這種心理現象，順勢掌握對方的心理，提高自己的評價，一舉兩得才是高明的處世之道。


    善意的自尊理論是由美國的實驗心理學家偉茲特所提倡，指的是當自我評價降低時，如果出現一個能幫你恢復的人，比起毫無作為時更能感受到強烈魅力的傾向。


    斷然拒絕主管拜託的工作，會使主管的自我評價跌到谷底。你將自己的工作告一段落後，可以告訴無計可施的主管：「我現在可以做您剛才交代的工作。」這時主管的自我評價恢復，他會覺得你是「為了我而努力的優秀下屬」。


    雖然勉為其難地接下工作結果是一樣的，不過背後的心理有如天壤之別。


    對你有高度評價的主管，下次就會盡可能節制，不再交代不合理的工作。


    順帶一提，真的沒辦法攏下主管的請託時，在拒絕方式得下點工夫。說明理由拒絕後，提出「○○可以勝任」等替代方案才是高明的拒絕方式。


