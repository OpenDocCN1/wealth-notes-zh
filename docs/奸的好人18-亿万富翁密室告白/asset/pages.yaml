    （附注：很多我老板所传来的恶毒简讯，都是在他亲自审核好这本书之后，我请编审员杰克兄再偷偷添加进来的，然后稿子直接排入印刷厂——编排师，请将字体缩小到最小，请务必做到！否则，我会很惨！）'
