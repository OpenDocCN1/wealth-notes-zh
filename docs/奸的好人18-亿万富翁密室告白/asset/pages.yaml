  md: '我觉得他们好像随时拿着拐杖找对方挑衅互相敲打，比划着谁的那根比较「硬」。


    最离谱的是……


    看到老人站着推轮椅，外劳却坐在轮椅上吃着水果，真是颠倒是非！


    「谋略，你看坐在凉亭下石椅上的人是谁？」


    「嗯嗯嗯……是刚刚那位邮差，奇怪他在这里干嘛？」


