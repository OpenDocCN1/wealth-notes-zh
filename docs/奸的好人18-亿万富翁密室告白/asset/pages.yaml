  md: '「不要乱叫，我是国术馆师傅！」师傅穿着紧身黑色皮裤，以及有点皱有点脏的白色汗衫，斜背着山寨版 NIKE 粉红色大包包，大咧咧站在小岩石块上向我们招手示意。


