    先是察貌辨色（胸），从女主人说的话里，用「已知」心理暗中推算到好奇心的「未知」，然后用空话套出对方的实情，再用旁敲侧击询问，引用并挟持对方的话语，使怪猫女主人当下心花怒放，把详情说得更彻底。


    最印象深刻的是，女主人双手捧着厚厚的大红包，展现在我们的眼前，感觉真棒！可惜不是给我。


