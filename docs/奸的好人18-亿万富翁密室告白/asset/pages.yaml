  md: '恍神。


    看到一个歪歪斜斜的熟悉广告牌：「洪兴国术馆」。


    虽然没有开门，里面却传来很有力道的丹田之声：


    「既来之，则安之……」


    两片黑色落地门自动打开。


    「嘿嘿，赶流行，装自动门。」我和龟蛋相视而笑。


    「谋略，你忙你的事，我帮你牵脚踏车去修理。」龟蛋不等我答应，就牵着车子自行离去。


    我看着龟蛋的背影，淫唱着：


    +   * 情与义

    * 刀山来

    * 有何憾

    * 值千金

    * 地狱去

    * 为知心

    * 为谋略，甘心剖寸心

    * 牺牲有何憾……


    龟蛋受到感动，转头走过来了。


    龟蛋把口袋中的皮包打开给我看——空无一物。


