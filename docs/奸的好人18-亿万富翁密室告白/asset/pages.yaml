  md: "「两个臭小子，趁我睡着，还敢把我锁在地下室。」达摩师傅微笑着说：「很好！年轻人就是要调皮捣蛋，这样才活力充沛。」\n\n我和龟蛋早就忘记之前把达摩师傅锁在地下室的事情了，我们最惊讶的是\n\
    \n「你胡须怎不见了？难道森林中的和尚是……你？」龟蛋张大眼睛，看着达摩师傅，自己也摸摸下巴。\n\n「原来你就是……」我慢慢走近茶桌，不禁微笑起来：「你找我们来的方法，不是神经病，就是超级经神病。」\n\
    \n达摩师傅神情很自然：「年轻人，做任何事情要先用脑再用心，不这样出招，你们年轻人怎会心甘情愿意来呢？」\n\n# 「别有用心」抄笔记\n\n「我们从没心甘情愿来过。」我蹲在椅子上。\n\
    \n「哇，桌面上好多书喔，全都是日本顶级AV工作者的奋斗书喔！日本娘化的男优南加也、日本炮弹男优巧克力球、日本金手指男优加藤鹰。」龟蛋看到茶桌上摆满了书籍，他对那些都如数家珍，差一点就可以把男女优的名字给倒背如流。\n\
    \n「我和你们介绍，这位全亚洲首席成功学专家——量大师。」达摩师傅介绍着坐在他身旁，穿着深红色西装的年轻男子。这位成功学老师一头超短的头发，却还强行分边，带着金框眼镜，头上还有一对米老鼠耳朵，西装笔挺的坐在我们面前。\n\
    \n第五位出场的亿万富豪简介：\n\n+   * 成功激励大师，量老板\n  ◎年龄：三十六岁\n  ◎专长：联合国国际诈骗佬，共同引诱学生付钱听课\n \
