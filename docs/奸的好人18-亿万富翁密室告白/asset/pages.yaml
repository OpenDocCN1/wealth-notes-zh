    「我问你喔，你是宠物通灵界的第一把交椅，为何可以厌觉人的灵性，刚刚我的好友在乱晃时，你也能感觉出来？」


    「喔，这件事喔，我不懂啊，我只是看着他在乱动，我就顺其自然配合说话了。」通灵师正在很用力撩这颗球。我看着球上面好像是永久性麦克笔的墨水痕迹。


