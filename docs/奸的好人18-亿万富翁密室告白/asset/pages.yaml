  md: '我趕緊脫下袜子，拿到龟蛋鼻子前晃着。


    「知不知道，学佛悟道时，当眼睛放松闭着，心灵放空，可以深深感受到四周环境的气息，是很奇妙的体验。唔，你静下心来，会像我一样闻到海风飘过大海挟带着咸咸的味道，真是一种人生体悟的味道啊。」


    龟蛋依然闭着眼双手张开，却「体悟」到我袜子的咸鱼味。


    「龟蛋啊！龟蛋，三天前你还想成为武林高手，三天后的今天，你果然不一样……」我吞了口水一下，继续说：「有时候，当你的想法变得不一样时，你的人生『味道』也会不一样，其实啊，我经常看到我老板他乱放臭屁，可是底下盲目崇拜他的信徒，会把臭屁当作香料来闻咧！」


    所以我也用力嗅一下，想闻一闻海风吹来的咸味，接着我将袜子盖着我的鼻子，轻轻闻了一下。


    「妈的！真的有很大的分别！恶！这龟蛋，怎么会分辨不出来？」我内心极度恶心想着。


    「龟蛋，你果然有『潜能』学佛，所以想得和我不一样！」


    但只见龟蛋依然一副很享受的样子，我不知道他看了哪出电影，会出现这样的「体悟」？


    因此我只好继续让他好好享受我袜子的另一种人生味道。


    突然，龟蛋睁开双眼。


    （嘘！还好！我来得及「放下」！）


    「谋略，我们走吧！」


    「你果然吸收了海味人⾝，精⼒超凡！」


    我们俩骑着机车以蜗牛速度前进。


