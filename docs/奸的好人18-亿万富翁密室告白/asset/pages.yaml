    谋略，你虽然已陆陆续续完成工作室一些作品集，但我不知道你是瞎写内容还是胡搞剧情，好在有杰克来帮忙审阅修改。虽然你呆呆的，但还是有点努力的心，不然，我早就学川普名言对你说：“You
    are fired!”


    你是可以自行创作小说，不过……


    你还记得我的冠军书《有钱人的偏方》里面写了一段话：「带你到书店，蒙着双眼，双手在商业或心理励志类的书架乱摸，你也一定会找到一本教你如何成功、教导如何变成有钱人的书」吗？


