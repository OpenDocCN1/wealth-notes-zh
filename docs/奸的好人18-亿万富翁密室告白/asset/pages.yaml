  md: '「阿弥陀佛——」


    『两位施主，你一次可以捕一只蝉，运气好的话，可以捕到里面还有小 baby 的蝉，等于一次抓到两只蝉。』


    森林四周传来宏亮的声音，彷佛天罗地网盖住了整片森林。


    这段话语还夹杂着好像几百人不断念诵佛号的声音。


    阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛


    阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛


    阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛，阿弥陀佛


    我和龟蛋两人站在原地，三百六十度转来转去，抬头看到底是哪个王八蛋拿扩音器在说话。我们忽然有高度的好奇心，想揪出这王八蛋出来，问他如何把扩音器玩到这样出神入化？


    「声音好像在三点钟方向。」我微蹲着，双手推着龟蛋的背，往三点钟方向直走。


    「谋略，你是不是又要保护我了。」龟蛋边走边回头问我。


    我们互相掩护住前进的同时，一路上传来：


    「我只要抓到两个人，抓到这两个人，就可以解救千万只的蝉……」


    「谋略，这个藏镜人是说要抓我们两个吗？」龟蛋整个背往后缩，借由我推他的力量前进。


    「不是！他好像要教我们快速捕蝉的方法。」我手都酸了！干脆用背靠著他的背，由后推著他走。


    反正有什么妖魔鬼怪，龟蛋第一个先看到。


    走著走著，龟蛋还黏著我的身体转一圈，交换位置，换我往前走著。


    「喂喂喂……我看到了！」我停住脚步，对背后的龟蛋喊话。


    龟蛋转过身来。


    有一位穿著有点破烂的黄橘色袈裟的和尚，看来应该是被赶出佛门了吧？


    他戴著一顶斗笠，盘腿坐在泥地上，一根九环锡杖直立插进土里，正面对'
