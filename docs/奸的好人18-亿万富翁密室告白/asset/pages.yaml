    # ## 与大师共享喷饭饭局


    「师傅！你是几天没吃饭了？慢慢吃，但不要吃太多，我每餐都有预算的。」我拿着筷子，看着师傅正在猛虎扑兔吃饭的模样。


    「什么预算？」饭粒沾满了达摩的鼻子。


    「你误会了喔！我没打算请你吃饭。」我看着中餐店人来人往。


    「小伙子，我每天要勤练武术，身体消耗很多能量，肚子很容易饿着……」边吃边说话的师傅还一边喝着热汤：「帮我再盛一碗热汤，要有料喔！」


    我盛汤时，在汤内注入了很多怨念！「我是不是上辈子踢破人家的骨灰坛，这世才碰到他这个怪人？」


    「小子，找个时间，你来我的国术馆，我介绍一些各个领域的有钱人让你认识，连我也在内，是足以让你写好你的小说。」师傅扒完了饭，把碗拿给我：「你知道要干嘛了吧！」


    「嗯！我知道。」我起身准备把他的碗拿去垃圾桶丢掉。'
