    里面有很多含苞待放的小妖精牢笼区，让我方便亲自点选。好有皇上选贵 妃的感觉喔，让我不由自主把椅子往桌前靠拢，整个身体向前倾，眼珠几乎贴 在屏幕前，希望能瞧出个端倪来。


    左眼滑过来，右眼飘过去。


    嘿！好，就钦点这一位啦，因为她身上的布料是少中量少：最得我的青睞！'
