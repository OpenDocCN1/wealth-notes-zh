  md: '（不要问我干嘛指天，我也不知道！）


    怪邮差对我点了点头说：「孺子可教也。」就转身一跨步，飞跃到机车上。


    好熟悉的声音，这声音是一种令人厌恶的语调。


    「少年仔，这种机车要打档，我不太会。」怪邮差坐在机车上转头问我。


    「哇嗰，那你刚刚怎样骑过来的？我可以写信投诉你的愚蠢吗？吼，我打电话叫人来救你啦。」


    我拿起手机，给这位笨邮差一个白眼。


    一边讲着电话，我同时绕着这位怪邮差走上一圈：「你赶快来，现在这个年头，还有人不会骑打档车，是一个死邮差！」


    「不会吧！邮差的交通工具不就是打档机车吗？对了！他现在到底是活的还是死的啊？」


    我很闷的直接挂上电话。


    「就是这位！」我对着龟蛋摆头示意，接着又以不屑的眼神，嘴角一撇，看着笨邮差。


    「废话喔，只有他在你面前不然还有哪位，我救你啦，就是这样……那样……捏一下……踩一下……搓一下……」龟蛋穿着四角裤走过来教笨邮差如何打档。


    看好以下的文字描述：


    「一个小时」过后。


    （真的，是一个小时后）


    「谢谢你了，小胖弟。」邮差感激的拍了龟蛋肩膀一下，对我挥一下手，摇摇晃晃骑机车离去。


    「嘘——」我和龟蛋一起双手举起大拇指，朝下对着离去的呆邮差。


    「奇怪了，谁会寄信给我，这封信还鼓鼓硬硬的。」我好奇着打开信封袋来一探究竟。


    「？」


    「！」


    是一块竹木片。


    尾端还悬挂着红色中国结。'
