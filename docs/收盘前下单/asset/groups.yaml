    ## 推薦序二

    ### 繳學費給市場，不一定是投資股市的必經過程


    最年輕的理財書暢銷作家／劉宇珏


    當沖看 1 分 K、短波段看 30 分 K、大波段看日 K，本書作者在每天尾盤前 30 分鐘檢視持股，正是當日 K 線快要收完之時，不管盤中如何波動，就算有下跌回檔，若個股夠強勢，也會在尾盤之前漲回；反之，則可能收在最低的價格。如果出現這種弱勢
    K 棒，再檢視整體型態是否轉弱，以大波段操作為目標，作者這樣的方式，的確適合許多盤中沒時間看盤的上班族。


    初入股市的新手，往往初生之犢不畏虎，在沒有研究出一套有紀律的策略之前，一下子投入大筆資金，就像在賭博一樣，甚至會賭輸博大，最終繳了許多學費給市場，等到已經把資金賠盡時才恍然大悟、痛定思痛的
    努力研究。很多人都覺得，繳學費給市場是投資股市的必經過程，其實並非如此。本書作者整整研究了半年，不斷模擬交易訓練技術，等到模擬交易有一定的勝率之後，才開始真槍實彈，這個觀念是非常可取的。


    我在 2011 年左右開始接觸股市時，如果有人能夠提點，讓我知道模擬訓練的重要性，或許可以少走很多冤枉路。我接觸過許多交易同好，其中不乏投資新手，然而真正能夠先落實模擬訓練的人非常少，不知道是不是臺、日兩國人的風土民情有所差異，本書作者的謹慎作風值得學習。


    誰能練成分辨趨勢盤與盤整盤的能力，誰就是股市贏家，任何時候的行情都是趨勢與盤整輪流出現，趨勢盤「順勢而為」、盤整盤「區間操作」，其中趨勢盤又分為「空方」與「多方」，空方趨勢在反彈賣出、多方趨勢在回檔買進。K
    線型態上的學習方向，主要目標是先學會分辨行情，再學習找好的位置介入，但要練就此番功夫並不簡單。


    本書作者簡單利用均線找趨勢盤的進場點，對於初學者來說較好判讀，但 K 線型態與均線間的眉角細節很多，有了觀察方向之後，每個人還是要努力找出一套 屬於自己的高勝率策略，畢竟高手只能傳承技術，但經驗的累積還是得靠自己摸索。


    一本好的著作，會教導讀者如何建立正確的交易中心態，並且具體分享操作策略，策略並非只是單純買進與賣出，最重要的是要明確知道哪裡該防守停損、哪裡該獲利了結，尤其是防守方面的功夫非常重要，風險控管有助於在市場長久生存。切記，股票市場並非賭場，不要抱持著賭博的心態投資，在進場之前要先思考停損點，並且想一想，如果碰到停損，會不會造成自己重大損失、是否能夠承受，如果不能承受，就算進場訊號再明確，也該放棄操作。


    股市天天有，一個好的進場點包含可控制的風險！本書作者從心態分享到技術，相信能夠幫助投資人在交易的路上更加進步。


    ---


    ## 推薦序三

    ### 只需要一支手機、3 分鐘，就能決策下單


    主升段飆股學院創辦人／茶米博士


    如果你強烈渴望改變現狀，要從上班人生斜槓讓股票操作達到財富增長，一定要看這本書。想要逃脫生活與工作中的不愉悅，最快就是設法奪回你人生的選擇權，唯有增加收入來源，從時間、金錢與精神層面抽離，才能夠真正的享受人生自由。


    作者的經歷就是現今年輕人的生活縮影，而股票市場是參與財富重新分配最直接的模式，但是這個過程需要「刻意練習」，而成功最快的捷徑，就是先按照已經成功者的方法，去吸收、學習、歸納，並且透過調整細節，打造專屬於你的交易模式，而本書可以達到這樣的效果，是上班族股票交易的入門指引。


