  md: '

    ## 1 幻想一夕成功，差點走投無路！


    全是因為爸媽的無私奉獻。我對自己的無能為力感到羞愧、悔恨。父母恩情難報，我對他們的感謝怎麼樣也說不盡。特別是聽完父親這段話後，我無論在通勤、工作、吃飯、睡覺，腦中時時刻刻都在回想這件事，我滿腦子想的就是自己該怎麼做才好。就在某天晚上，我看到一則充滿吸引力的廣告：「年收
    2 億日圓的六本木新貴，招收嫡傳弟子！」


    我希望自己這一生活得有意義，希望過一個無悔的人生，我想改變，但我真的能做到嗎？我的腦中不斷浮現這些想法，最後決定去應徵。


    ## 2 200 萬日圓一夜成空


    2015 年 9 月，我在臉書上看到有老師招收弟子的廣告後，立刻申請加入，可惜已經額滿了。這個機會好不容易出現在我眼前，我實在不想讓它白白溜走，雖然一開始有些猶豫，最後仍鼓起勇氣，傳送訊息直接聯繫本人，但對方完全沒有回應。日子一天天過去了，我仍單方面不停的傳送訊息給對方，大概是我的堅持打動了他，某天，我居然收到本人的回應了！「如果你是認真的，要不要接受挑戰，看能不能成為我的弟子？」我當下就回答
    Yes。明明連成功的邊都還沾不上，我卻如獲至寶似的，心情非常激動。


    從那天起，我就下決心，一定要成為老師的大弟子，願意為此接受各種挑戰。我知道競爭很激烈，但我自認就這件事絕不能輸給任何人，每天不分日夜的全力行動。


    為了讓他注意到我，我事先做很多功課，像是他在所有社群媒體（Twitter、臉書、YouTube 等）發表過的訊息，我都要看過，每天搞到半夜 2、3 點是常態，因此上班常遲到，或編理由請假，加上我刻意減少和別人交際，什麼喝酒聚會的應酬一概不參加，上班還時常打瞌睡……別人看到我這樣，可能覺得很奇怪，但身為平凡人的我深知，若不比別人加倍努力，絕對贏不了這場競爭，所以做出這些努力只是剛好而已，總之，我的所有行動，都是為了成為老師的大弟子。


    ### 自己的人生，自己當主角！


    在超過千名的參賽者中，只有 1 人能脫穎而出，成為老師的弟子。以機率來說是 0.001%，但我對自己很有信心，自認絕不會輸給任何人。聽到他在播放哪一張 CD
    的哪首曲子，我就會整首歌背下來，在選拔的時候唱給他聽；我有時間就會直接去找他聊天，即使到了三更半夜也會回覆訊息；解決的課題也比別人多，我在短時間內就做了這麼多事情，所以我告訴自己一定沒問題。


    ![](img/554ec54d2eecd32c8037517049342430_67_0.png)


    終於到了最終選拔，我從眾人之中脫穎而出，成功獲選！我被老師選為他的嫡傳弟子。我在心裡大聲歡呼，並高舉雙手擺出勝利姿勢。


    過去的努力終於有了回報，同時我心中的大石終於落下，因為接下來我終於能開始幫到家裡的忙了。要付給老師的顧問費用是 200 萬日圓，雖然心裡有點皮皮挫，但只要能當老師的大弟子，這點錢算什麼，最後還是咬著牙把錢匯過去了。


    事不宜遲，在老師的建議之下，我先去拍了張個人形象照。這就是當時照的照片（見下頁圖表 1-1），現在回頭看，還真有點害羞。


    ![](img/554ec54d2eecd32c8037517049342430_70_0.png)


    **圖表 1-1 個人形象照**


    我的時間感開始模糊，時常搞不清楚今天星期幾、現在幾點。這種生活持續 3、4 個月後，我開始睡眠不足、營養失調，每天精神恍恍惚惚的。我自己覺得沒什麼問題，但周遭的人覺得我變得很奇怪，越來越多人開始擔心我。


    我努力照著老師的話做，卻沒有賺到半毛錢。最後，公司也發現在外面有副業，被主管、人事部的人約談。果不其然，我被逼辭掉工作，加上我的副業接連遭逢幾次挫敗，眼看就快撐不下去了。


    「這樣下去真的不妙……。」我對未來越來越感到不安。一開始以為已經抓住成功的機會，但沒多久才發現自己有多麼少不更事。漸漸的，我的存款見底、身體累垮，女朋友和身邊的人要求我停下來的壓力也越來越大，我只好放棄。勞心勞力好不容易才爭取來的機會，卻因為自己經營不周只好放手，成為六本木新貴的美夢瞬間破碎。200
    萬日圓的投資只換來一場空。


    被孤立在絕望的深淵、沒有工作、一文不值的我，要拿什麼顏面來面對我的家人？「我真的很沒用……果然我只是個平凡人，做什麼都不會成功……。」我絕望的想，但這時，我腦中浮現出家人的臉龐。父母付出的努力和嘗到的辛酸不知道比我多幾百倍。看到他們即使面臨危機，仍不停下腳步、持續努力工作的樣子，就覺得自己怎麼可以如此垂頭喪氣。我告訴自己不應輕言放棄，只要一條命還在，還有什麼風險不能擔。


    ## 3 一本書，開啟我的股票人生


    才剛看到人生的曙光，卻又一口氣墜入深淵。到了這個地步，除了回去當上班族，沒有別條路可走了。為什麼？因為如果自己管理不好自己，那就只好請別人管自己了。當一名上班族，什麼時間要上班？做什麼？領多少薪水？全都被別人管理得好好的，再加上有固定的休假時間，確實可以讓人感到安心和穩定。我打開求職網站，決定去找我人生的第二份工作。


    除了提交履歷表之外，我也找人力仲介公司幫忙，但迎來的卻是不斷的拒絕。我嚴重喪失了自信，「我果然是個沒用的人。」我沮喪的想。漸漸的，我開始足不出戶。


    就在某天，母親用溫柔的聲音，對意志消沉的我說：「在找到下一份工作之前，要不要回家裡幫忙？」


    所以我就以打工的性質，回家幫忙 1 個月，爸媽似乎怕我的心情受影響，很有默契的都沒詳細過問我之前經營失敗，以及找工作不順的事。


    我也曾考慮過乾脆直接繼承家業好了，但畢竟在外面工作的收入較高，又有穩定薪水能幫家裡的忙，所以就放棄這個想法。現在回想起來，其實父親已經做好很多準備，彷彿在暗示我：「就算你想繼承家裡的事業也可以。」想到父親如此為我著想，更讓我下定決心，一定要在外面做出一番成績。


    就這樣，我一天天過著這種不知未來在哪的日子時，忽然接到一通電話。我投履歷的其中一家公司，通知我通過書面資料審查，如果進一步的遴選順利，就能得到這份工作了。


    但光靠這份工作，還是無法解決家裡的債務問題。我在這間公司的年收大約有 360 萬日圓，離財富自由還很遙遠。我雖然轉職成功，卻依舊無法弭平內心的不安。


    我一邊工作，一邊想著接下來要怎麼辦，不斷尋找下一個機會。只要上網查，隨便都找得到一堆網站或文章寫說可以輕鬆賺錢的商品情報，或看起來怪怪的教學課程，但我知道我禁不起犯同樣的錯，所以非常慎重的挑選資訊。


    某天，我在午休時間和往常一樣上網瀏覽訊息，就像命中註定一般，我遇見了某本書。當時的我根本不曉得這本書，會對我往後的人生造成這麼大的改變。


    ## 4 先從本業累積本金


    這本書就是小林老師寫的書，書名是《小林老師教你，如何從年收 350 萬日圓的上班族，變成年收 1 億的財富自由家》，或許是因為我當時的年收，與他書上標題寫的年收數字相近，第一眼看到就特別有親近感。我沒想太多就買下這本書，並很快的讀完。我當時心中第一個想法就是：「我想立刻跟作者見面！」他在書中指出，身為上班族，除了努力工作之外，應該要拓展各種副業，不斷為自己創造額外的收入來源。


    一邊當上班族，一邊靠副業增加收入……我相信這個方法，連我這樣的平凡人也做得到。但之前「六本木新貴」的失敗經驗又浮現在我腦海中。


    我內心越來越不安，擔心見到本人後，會被對方索取高額顧問費，或是成為詐騙案件的受害者。不過對方出過書，應該有一定的可信度。如果什麼都不做就放棄的話，那我就只能繼續當一個普通的上班族。人生似長實短，我不想放棄難得從天而降的機會，所以鼓起勇氣去見他。


    我按圖索驥來到東京都內一間高級的摩天大樓。我很驚訝，沒想到這世上真的有人住在這種地方。這是怎麼辦到的？怎麼樣才能住在這種地方？我內心驚奇連連。我想知道，一個普通的上班族，如何住得起這種高級的摩天大樓，其中到底有什麼祕密。


    我按捺住自己緊張的心情，照約定時間來到他家。終於和他見面了，我把自己過去的人生經歷，以及對未來的徬徨一口氣傾吐而出。他很認真的聽我說完，然後緩緩說出他的建議：「好好珍惜現在本業的收入，然後靠副業多打造幾個收入來源吧！」


    這句話從一個本來年收 350 萬日圓，變成年收 1 億日圓的上班族口中說出來，實在很有說服力，我受到鼓舞，決定要勇往直前，相信自己也一定能做到！


    ![](img/554ec54d2eecd32c8037517049342430_87_0.png)


    雖說如此，但我一開始還是挺忐忑的。幸好小林老師鼓勵我：「你只要努力去做，就會和我一樣成功！」我才鼓起勇氣往前邁出第一步。從那天起，我全心投入副業，正式展開我的副業人生。


    平日我早上 8 點起床到公司上班，工作到晚上 5 點，剩下的時間我去找了時薪 1,000 日圓的副業來做。就這樣，我每個月除了公司的薪水，還增加了 5 萬日圓的收入，光是這樣我就覺得很開心了。


    某天，正當我想要再進一步增加收入時，又有一個機會來了。以前就聽說過億元級股票交易者山下勁老師很厲害，沒想到小林老師要把他介紹給我認識，這次的機會更是大幅改變我的人生。


    很多人經常會把這些話掛在嘴邊：「我都遇不到好機會。」「真不走運。」確實，我們有時都會覺得自己很衰，或是為什麼那個人總可以遇到那麼好的機會等。但是，唯有歷經多次挫敗，仍不斷站起來繼續前進的人，才有辦法在機會來臨時，緊緊抓住。


    「越能夠保持正向思考，並努力行動的人，越容易遇到好機會，運氣也比別人好。」正向思考、努力行動的人，不僅執行力比別人強，對情報的敏銳度也相對較高，更容易迅速獲得各種資訊，並從中選出自己需要的。

