    # 不要只為股息買股票


    日本有一個「股東優待制度」（按：臺灣有股東會紀念品，但不是每檔股票都會送，也不是每年都有，且無論持股多寡都是一份）。簡單來說，就是上市公司會為了感謝股東而發放贈品。


    本來公司配息給股東，就已經達到回饋的目的，但日本的小股東們，除了領錢（股息），還有可能領到贈品（股東優待制度），這形成了一股風潮。正因爲公司想要討好股東，這種股東優待制度才能存續。尤其是經營零售、外食、食品業的公司，會發放禮券讓股東直接成為自己的顧客（購買自家公司产品），可視為宣傳活動的一個環節，所以很多企業都會積極用自家产品作爲贈品。'
