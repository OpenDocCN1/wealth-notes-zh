    ### 收盤前下單，月薪多 50 萬


    2. 暌違 3 個月以上（甚至更久）碰到長期平均線


    接下來我要介紹的是，「暌違 3 個月以上（甚至更久）碰到長期平均線」。


    當股價已經 3 個月以上沒有碰到長期平均線時，一旦碰到就很容易反彈或反壓，請好好活用這個特性。這種狀態不常發生，準確度又高，連初學者也能容易分辨。先記熟以下的參考線圖（見圖表
    4-16），然後實際找找看吧。


    關鍵在於找出股價一直在上漲或一直下跌的線圖，然後仔細觀察。如果股價越久沒有碰到，勝率就越高。


    中期移動平均線轉折之術，是著眼於股價是否有碰到中期移動平均線產生轉折，同樣的道理運用在長期移動平均線也是成立的。


    光是靠第二招結合更多技巧或指標，就能提高勝率。換句話說，當你看到「暌違 3 個月以上（甚至更久）碰到長期平均線」、「中期移動平均線轉折」、「整數關卡」、「股價創新高（低）」等條件都滿足的話，那麼勝率就更高了。


