    - ①股價創新高（低）5 天、沒有過前高、橫盤整理的上方。

    - ②股價創新高（低）5 天、沒有破前低、橫盤整理的下方。

    - ③橫盤整理超過 3 個月，短期線沒有跌破中期線，反而反彈。


    ### A4


    - ①股價創新高（低）5 天、沒有過前高、橫盤整理的上方。

    - ②股價創新高（低）5 天、沒有破前低、橫盤整理的下方。

    - ③橫盤整理超過 3 個月，短期線沒有跌破中期線，反而反彈。

    - ④除了 2、3 點之外，再加上第二次越過 5,800 日圓的前高。


    ![](img/554ec54d2eecd32c8037517049342430_338_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_339_0.png)


    ### Q5 川崎重工（7012）


    假設在 Q4 的 ④ 進場，要在哪裡獲利了結？


    ### A5


    答案有很多種，我介紹其中兩種。


    - a. 在 Q4 的 ③ 買進的 5,600 日圓附近的紅 K 棒算起，股價創新高 5 天後出現黑 K 棒後就獲利了結。

    - b. 抱到短期線跌破中期線（上漲結束）。


    進場的同時先設想好何時出場（獲利了結）是非常重要的事。


    ![](img/554ec54d2eecd32c8037517049342430_340_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_341_0.png)


    ### Q6 軟銀集團（9984）


    看這張技術線圖，若預測股價上漲是否買進？若預測股價下跌是否要賣？


    ![](img/554ec54d2eecd32c8037517049342430_342_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_343_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_343_1.png)


    ### A6


    答案是什麼也不做。這個問題出得有點故意，要引誘你上當。但我們在投資時，空手也是非常重要的操作。


    ![](img/554ec54d2eecd32c8037517049342430_343_2.png)


    如同大家在第三章讀過的，不要抱股抱過結算，因為抱過結算，就跟賭博沒兩樣。交易前一定要確認財報發布日在哪一天。


    ### Q7 貝親（pigeon，7956）


    遇到這種暴跌狀況時，你會怎麼做？


    - 1. 買。

    - 2. 賣。

    - 3. 什麼也不做。


    ![](img/554ec54d2eecd32c8037517049342430_344_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_345_0.png)


    ### A7


    正確答案是買。但此次交易只限定一天。


    隔天早盤一開始就要買，買在便宜的價格，在尾盤時賣掉，獲利了結。這是非常高難度的技巧，對初學者來說有點困難，但只要稍加訓練，你也可以辦到。


    ### Q8 東洋製罐（Toyo Seikan Group，5901）


    2 星期後，它的股價會是上漲或下跌？


    ![](img/554ec54d2eecd32c8037517049342430_346_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_347_0.png)


    ### A8


    正確答案是上漲。


    從條件來看，它有中期移動平均線轉折（做多模式）、股價創新高（低）、整數關卡，還有碰到暌違已久的長期線。當股價超過 3 個月以上沒有碰到長期線，一碰到就容易反彈。


    ![](img/554ec54d2eecd32c8037517049342430_348_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_349_0.png)


