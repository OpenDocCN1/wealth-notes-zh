    50 萬 》中獲得解答！


    開頭的 3 個問題，是近年來經統計，小資讀者最關心的話題。在踏出第一步前，相信你們的心裡肯定有很多的疑問與不安，該如何有效做足功課呢？書中提到許多實戰法則，非常適合初學者。作者透過兩種線圖技巧方法論，帶領股市新手進入投資市場，用最簡單且好理解的方式，幫助新手成功賺到第一筆收入，有效提升自'
  - '[PAGE 14]


    # 收盤前下單，月薪多 50 萬＄


    信心。


    作者也在書中提到「初學者易犯的 3 點錯誤」，我心有戚戚焉。其中一點是：別急著開證券戶，這也是我時常在文章中提醒大家 的。許多股市新手在還沒釐清市場規則前，就花不少時間在比較哪間券商手續費便宜。與其花心思爬文比較券商資料，不如好好拿來研究指標，多研究一檔個股、一個
    KD（隨機指標）、MACD（股價指數平滑移動平均線）指標對你們來說都是賺呀！有效幫助你在正式進場時，握有更多實用指標能參考，進而降低誤判風險、提升獲利機率。


    那肯定會有許多人想說：如果我失敗了，辛辛苦苦存的第一桶金就沒了，該怎麼辦？其實投資本身就是一項百分之百獲利的事情，所以建議大家在初期進入股市階段，可以先分配預算。實際做法是將薪水的
    10% 至 20% 提撥到投資帳戶（比例因人而異），確保就算這筆錢統統拿去市場「繳學費」，也不至於影響生計。同時也鼓勵大家趁年輕多嘗試不同事情、多去小額試錯，就算跌倒了也無妨，因為最寶貴的經驗通常來自親身體驗！


    最後套用作者的一段話：「越能保持正向思考，'
