    ## 收盤前下單，月薪多 50 萬


    有些人聽到單用這招的勝率只有 60%，會覺得「會不會太低了」、「怎麼不是 100%？」但一個招式能讓初學者只要背起來照表操課，勝率就有 60%，想一下其實很厲害不是嗎？勝率只要超過
    50%，理論上來說，你的資金應該不會變成負的，反而會不斷累積資產。如果再努力一點，一年 10% 以上的獲利也不是不可能。對一個才剛跨入股市的新手就能賺那麼多的話，那股市老手就更不用說了。


