    # 收盤前下單，月薪多 50 萬 ¥


    年度財報 1 年發表 1 次。每家公司的財報發表月分不盡相同，唯有銀行等金融機構統一 3 月為年度財報月分（按：臺灣的年度財務報告，則於每會計年度終了後 3
    個月內〔3/31 前〕公布）。


    +   季报


    季報 1 年有 4 次，為每 3 個月發表一次的財報。若一間公司的年度財報為 3 月，那麼 4 到 6 月就是第一季財報，7 到 9 月是第二季財報，10
    到 12 月是第三季財報，1 到 3 月是第四季財報。


    重要的是，我們無法預測當公司發表完財報後，股價會往上或往下，所以在財報發表日的 2 到 3 天前，即使虧損，也要把手上持有的股票清空。在財報公布期間持有股票，和賭博沒什麼兩樣。


    下面，我以軟銀集團（9984）為例解說（2019 年 11 月與 2020 年 2 月）。


    根據軟銀集團發表的 2019 年 7 月到 9 月的合併財報，他們的最終損益是虧損 7,001 億日圓（去年同期是獲利 5,264 億日圓），創下該公司季報睽違
    15 年的虧'
