    我一邊工作，一邊想著接下來要怎麼辦，不斷尋找下一個機會。只要上網查，隨便都找得到一堆網站或文章寫說可以輕鬆賺錢的商品情報，或看起來怪怪的教學課程，但我知道我禁不起犯同樣的錯，所以非常慎重的挑選資訊。


    某天，我在午休時間和往常一樣上網瀏覽訊息，就像命中註定一般，我遇見了某本書。當時的我根本不曉得這本書，會對我往後的人生造成這麼大的改變。


    ## 4 先從本業累積本金


    這本書就是小林老師寫的書，書名是《小林老師教你，如何從年收 350 萬日圓的上班族，變成年收 1 億的財富自由家》，或許是因為我當時的年收，與他書上標題寫的年收數字相近，第一眼看到就特別有親近感。我沒想太多就買下這本書，並很快的讀完。我當時心中第一個想法就是：「我想立刻跟作者見面！」他在書中指出，身為上班族，除了努力工作之外，應該要拓展各種副業，不斷為自己創造額外的收入來源。


    一邊當上班族，一邊靠副業增加收入……我相信這個方法，連我這樣的平凡人也做得到。但之前「六本木新貴」的失敗經驗又浮現在我腦海中。


    我內心越來越不安，擔心見到本人後，會被對方索取高額顧問費，或是成為詐騙案件的受害者。不過對方出過書，應該有一定的可信度。如果什麼都不做就放棄的話，那我就只能繼續當一個普通的上班族。人生似長實短，我不想放棄難得從天而降的機會，所以鼓起勇氣去見他。


    我按圖索驥來到東京都內一間高級的摩天大樓。我很驚訝，沒想到這世上真的有人住在這種地方。這是怎麼辦到的？怎麼樣才能住在這種地方？我內心驚奇連連。我想知道，一個普通的上班族，如何住得起這種高級的摩天大樓，其中到底有什麼祕密。


    我按捺住自己緊張的心情，照約定時間來到他家。終於和他見面了，我把自己過去的人生經歷，以及對未來的徬徨一口氣傾吐而出。他很認真的聽我說完，然後緩緩說出他的建議：「好好珍惜現在本業的收入，然後靠副業多打造幾個收入來源吧！」


    這句話從一個本來年收 350 萬日圓，變成年收 1 億日圓的上班族口中說出來，實在很有說服力，我受到鼓舞，決定要勇往直前，相信自己也一定能做到！


    ![](img/554ec54d2eecd32c8037517049342430_87_0.png)


    雖說如此，但我一開始還是挺忐忑的。幸好小林老師鼓勵我：「你只要努力去做，就會和我一樣成功！」我才鼓起勇氣往前邁出第一步。從那天起，我全心投入副業，正式展開我的副業人生。


    平日我早上 8 點起床到公司上班，工作到晚上 5 點，剩下的時間我去找了時薪 1,000 日圓的副業來做。就這樣，我每個月除了公司的薪水，還增加了 5 萬日圓的收入，光是這樣我就覺得很開心了。


    某天，正當我想要再進一步增加收入時，又有一個機會來了。以前就聽說過億元級股票交易者山下勁老師很厲害，沒想到小林老師要把他介紹給我認識，這次的機會更是大幅改變我的人生。


    很多人經常會把這些話掛在嘴邊：「我都遇不到好機會。」「真不走運。」確實，我們有時都會覺得自己很衰，或是為什麼那個人總可以遇到那麼好的機會等。但是，唯有歷經多次挫敗，仍不斷站起來繼續前進的人，才有辦法在機會來臨時，緊緊抓住。


    「越能夠保持正向思考，並努力行動的人，越容易遇到好機會，運氣也比別人好。」正向思考、努力行動的人，不僅執行力比別人強，對情報的敏銳度也相對較高，更容易迅速獲得各種資訊，並從中選出自己需要的。

    '
