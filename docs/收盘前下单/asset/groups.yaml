    在股價的技術線圖中，除了 K 線圖，還有一種大多會合併顯示、用曲線來表示的線圖，稱作移動平均線。看起來很難理解，不過它是最適合用來尋找股價的變動，與趨勢轉換點的要素，如果想要學習股票，就一定要學會看移動平均線。


    移動平均線可以分成短期、中期、長期。以我自己的設定來說，我設成短期（5 日，即 5 日線）、中期（25 日，即月線）、長期（75 日，即季線）。如果是短期（5
    日）移動平均線的話，就把 5 天的收盤價相加除以 5，便能得出數值，再把連續的數值連成線，就變成移動平均線。


    **5 日移動平均線的算法**


    | | 第 1 天 | 第 2 天 | 第 3 天 | 第 4 天 | 第 5 天 | 第 6 天 | 第 7 天 |

    | :--- | :---: | :---: | :---: | :---: | :---: | :---: | :---: |

    | 股價的收盤價 | 1,570 | 1,510 | 1,532 | 1,575 | 1,500 | 1,435 | 1,458 |

    | 移動平均值 | 第 1 天～第 5 天的平均<br>1,537 | 第 2 天～第 6 天的平均<br>1,510 | 第 3 天～第 7 天的平均<br>1,500
    | | | | |


    這些數值連起來就是移動平均線。


    從移動平均線之間的關係，就能掌握目前行情處於什麼格局。重點在於短期（5 日）移動平均線，與中期（25 日）移動平均線之間的關係。


    - 多頭格局


    短期（5 日）移動平均線位於中期（25 日）移動平均線之上時，就稱作多頭格局（見圖表 4-2）。


