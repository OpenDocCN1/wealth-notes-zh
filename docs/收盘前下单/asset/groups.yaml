    日本國內規模最大的證券交易所是東京證券交易所（簡稱東證），上市的商品數量在 2020 年 7 月 15 日這天來到 3,717 家。東京證券交易所設有 4
    個股票市場，有東證一部、東證二部、Mothers、JASDAQ，每個股票市場都有自己的特色。


    例如，東證一部是提供大企業、中堅企業上市的市場，許多海外投資人都會參與，是國際型的大型股票交易市場；東證二部是提供中堅企業，包括支撐日本經濟支柱的老牌企業上市的市場；Mothers
    市場偏向新創企業，在這裡上市的公司，目標都是進入東證一部上市，屬於登龍門型的舞臺；JASDAQ 市場分成兩個，一個是針對有一定實績的成長型企業所設的 Standard
    市場，一個是針對未來成長性很高的企業所設的 Growth 市場。


    ### 雖然有那麼多市場，但我們要怎麼挑選股票？


    我挑選股票最重要的依據，就是該公司的「市場價格總額」（市值）。所謂市場價格，指的是該檔股票當天在市場的股價，市場價格總額，就代表該股價乘上已發行的股份總數得出來的數字。以市值作為基準的話，我只會挑選市值
    5,000 億日圓以上的股票來交易。


    很多人都喜歡找未來有成長性的股票買，但小型股的市值較小，有時光是一天的股票變動率，就可以破壞掉線圖的型態，讓人很難預測未來走向，交易也就比較難有根據。所以，大家投資的時候一定要注意該檔股票的市值才行。


    ### 市值的計算方法


    怎麼計算上市企業的市值？很簡單，就是股價×已發行股數。如此就可以計算出企業目前的價值。


