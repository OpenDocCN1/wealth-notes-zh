    \ |\n| 布林通道 | 是由均線和標準差組成的指標，總共有 3 條線：中線、上線、下線。<br>通常是用作中線加減 2 個標準差成上下線，而由上下線構成的區域就是布林通道，可用來判斷買賣訊號、進出場時機。\
    \ |\n| MACD | 是使用長期與短期的移動平均線兩者交叉狀態，來判斷股價的趨勢方向，屬於中長期趨勢指標。 |\n\n### 圖表 3-9 布林通道，以台積電（2330）為例\n\
