    要實際進場買賣。」因此，我每天下班回家之後，先吃飯、洗澡，真正開始看上課影片時，通常已經深夜了。一開始，我完全聽不懂他說的內容，所以只能反覆觀看。後來我連通勤時間、午休等空檔，都用來學習投資股票。


    後來，我漸漸的了了解那些專有名詞的意思，還有股票的交易技巧和思考模式。我雖然很想趕快進場，但也只能先按捺住，用模擬交易工具做訓練。現在回想起來，這個順序真的好重要，先利用虛擬方式買進和賣出，試試看自己的實力是不是真的可以獲利。畢竟，如果連練習的時候績效都不好，正式交易一定也好不到哪裡去。我持續努力鍛鍊，不知不覺，模擬交易的勝率變得越來越高，自信心也就培養起來了。


