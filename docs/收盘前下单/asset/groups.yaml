    # 5  技術面分析和基本面分析，各有好壞


    看圖表做投資判斷的技術面分析，常被拿來和基本面分析做比較。所謂基本面分析，簡單來說，就是關注企業真正的價值作為判斷依據的分析手法。另一方面，技術面分析則是關注股票變動的價格、K
    線、移動平均線、投資人的行為模式等。


    價格是出自行於所有投資人的意志決定，記錄價格與買賣高低點的圖表，就等於是所有投資人決策時所留下的足跡。因此只要仔細研究圖表，就能某種程度知道，現在的股價是投資人買過頭或是賣過頭，然後再根據圖表預測未來的價格，了解在什麼樣的時機點買賣最有效，這就是技術面分析。'
