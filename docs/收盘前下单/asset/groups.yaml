    # 推薦序二


    # 繳學費給市場，不一定是

    投資股市的必經過程


    最年輕的理財書暢銷作家／劉宇珏


    當沖看 1 分 K、短波段看 30 分 K、大波段看日 K，本書作者在每天尾盤前 30 分鐘檢視持股，正是當日 K 線快要收完之時，不管盤中如何波動，就算有下
    跌回檔，若個股夠強勢，也會在尾盤之前漲回；反之， 則可能收在最低的價格。如果出現這種弱勢 K 棒，再 檢視整體型態是否轉弱，以大波段操作為目標，作者這 樣的方式，的確適合許多盤中沒時間看盤的上班族。


    初入股市的新手，往往初生之犢不畏虎，在沒有研 究出一套有紀律的策略之前，一下子投入大筆資金，就 像在賭博一樣，甚至會賭輸博大，最終繳了許多學費給 市場，等到已經把資金賠盡時才恍然大悟、痛定思痛的'
  - '[PAGE 21]


