    ### 4 每月增加資產的 5%，50 萬就會變 1 億


    大家聽到買股票賺錢時，覺得會是怎麼樣的賺法？「大賺 100 萬！」、「我買的股票漲 20 倍！」如果是像這種的，那可是天大的誤會。或許這麼說也不對，因為有時候交易確實能帶來這樣的獲利，但這種賺法的可複製性非常低。


    當市場行情整體往下走，股價變得較便宜時，有些人會趁機鎖定小型股、成長股等所謂的飆股抄底，希望可以獲得 10 倍的報酬，但這麼做其實很危險。投資時，必須對該檔股票的市值有概念，這一點非常重要，詳細內容我會在第三章解說。


    ![](img/554ec54d2eecd32c8037517049342430_138_0.png)


    假如有人真的選中未來可以飆漲數倍的小型股、成長股，這樣的人一定是運氣好、來自未來、天才。只要各位讀者自認是這三種人之中的一種，那就盡量鎖定小型股或成長股吧。如果不是，那就千萬別這麼做。


    那麼，要用什麼樣的觀念來增加資產比較正確？其實，投資股票時，最重要的就是面對現實和事實。什麼是股票市場的現實和事實？那就是：「股票買的人多就會上漲，賣的人多就會下跌。」這個觀念非常重要。另一個也很重要的觀念就是：用
    1 個月的時間，把 50 萬日圓變成 52.5 萬日圓。


    每個月增加資產的 5% 很重要。假設你從 50 萬日圓開始投資股票，每個月都有 5% 的獲利，持續 10 年的話，你覺得 50 萬日圓會變成多少？答案是 1
    億 7,000 萬日圓。沒錯，每個月 5% 的威力就是這麼大。一定要先建立這個觀念，千萬別忘了。


    ### 5 我月收 50 萬日圓的交易實績


    人們常說「散戶九成都是輸家」，這代表想要在股票市場賺錢真的很難。大家可以統計一下身邊有多少人投資股票能穩定獲利？恐怕不多吧。也是因為這樣，股票投資經常被認為跟賭博沒兩樣，但完全不是這麼一回事。只要遵守交易紀律，就有可能確實累積獲利。


    我個人是從一張白紙開始投資股票，現在除了原本的工作外，只要用上廁所休息的 3 分鐘，就能達到一個月獲利 50 萬日圓的實績，我是怎麼辦到的？接下來，我將公開我過去的交易紀錄。


    #### 人生第一次的股票交易


    山下勳老師告訴我：「新手剛起步的半年，最好不實際進場買賣。」因此，我每天下班回家之後，先吃飯、洗澡，真正開始看上課影片時，通常已經深夜了。一開始，我完全聽不懂他說的內容，所以只能反覆觀看。後來我連通勤時間、午休等空檔，都用來學習投資股票。


    後來，我漸漸的了解那些專有名詞的意思，還有股票的交易技巧和思考模式。我雖然很想趕快進場，但也只能先按捺住，用模擬交易工具做訓練。現在回想起來，這個順序真的好重要，先利用虛擬方式買進和賣出，試試看自己的實力是不是真的可以獲利。畢竟，如果連練習的時候績效都不好，正式交易一定也好不到哪裡去。我持續努力鍛鍊，不知不覺，模擬交易的勝率變得越來越高，自信心也就培養起來了。


    開始學習做股票 6 個月後，我打開手機中的證券公司 App，開始觀察圖表，沒多久就發現某檔股票出現訊號！以它目前的狀態來看，明天會上漲，我趕緊衝進廁所，時間是下午
    2 點半，我戰戰兢兢的按下買進。我記得很清楚，當天晚上我整夜沒睡，擔心死了，害怕如果自己買的股票明天下跌了怎麼辦……。


    #### 初次交易，結果……


    結果，我買了 200 股，總共獲利 8,573 日圓（見圖表 2-4）。透過這次的成功，我一頭栽入股票投資的世界，更翻轉了我未來的人生（按：以下股票代號皆為日股代號）。


