    ### 10. 看不懂就休息


    在市場不能只有買，如果不操作套利或拋售等賣出的動作，就很難賺大錢。同時，休息也很重要。特別是當行情尚未明朗時，不要勉強自己，就休息一陣子吧。


    有一句下棋的俗語：「笨人想不出好主意」，也和這句格言的意思相近。特別是正在收斂中的行情最難判斷，等到方向真的出來之前，最好先稍作休息。


    ## Chapter 6 男女老幼都能成功複製的操作模式！


    ### 2 常見問題集


    Q 要有多少資金才可以開始投資？

    A 視股票的價格而定，但基本上只要有 50 萬日圓以上的自有資金，就可以開始投資。


    Q 我不太懂電腦，會不會有什麼困難？

    A 完全沒問題。你可以用手機簡單操作買賣，不過還是需要練習一下。


    Q 我對股票的印象就是很困難，完全沒有經驗的人也有辦法交易嗎？

    A 即使完全沒有經驗也可以，只要從技術線圖的型態做判斷即可，很容易懂。不用學習困難的專有名詞或啃讀厚厚的參考書。


    Q 我五十多歲了，現在開始投資會不會太遲？

    A 60 歲都來得及，退休後人生還有很長一段時間。


    Q 我是一名上班族，沒辦法空出太多時間做股票，這樣沒問題嗎？

    A 沒問題。你只要一天花幾分鐘交易就好，上廁所的空檔就夠了，也不用長時間盯著技術線圖看，絕對不會影響到你的本業。


    Q 聽說做空很恐怖…… 。

    A 就我的角度來看，不做空的風險才大。如果學會做空，下跌行情你都能賺錢，股價上上下下你都不用怕。


    ## 結語


    ### 現在開始，活出自己想要的樣子


    感謝你捧著這本書讀到最後。各位讀者覺得如何？希望本書多少能為你帶來幫助。這個時候最重要的一件事就是，想一想從明天開始，你要怎麼做。


    當人生走到終點，你覺得最後悔的事情是什麼？是沒有盡到義務嗎？還是沒有追求夢想？據說人死前最後悔的事，是沒有以自己「最想要的樣子」過活。換句話說，最讓人懊惱的不是犯錯、挑戰失敗，而是無法成為自己真正想成為的人。


    就長期來看，人對沒做過的事感到後悔的程度，遠大於做過的事。決定採取某種行動，即使最後失敗，當下感到很懊悔，也只是暫時的，我們很快就會把它消化成人生教訓。


