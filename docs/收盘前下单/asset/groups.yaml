    股價與已發行股數如下（2020 年 7 月 15 日）：


    - 股票名稱：豐田汽車

    - 股票代號：7203

    - 股價：6,835 日圓

    - 已發行股數：3,262,997,492


    因此，豐田汽車的市值為：


    > **市值計算方式：股價×已發行股數**

    > **豐田汽車市值：**

    > **股價 6,835 日圓×已發行股數 3,262,997,492 = 22 兆 3,025 億日圓**


    毫無疑問的，它滿足我們市值 5,000 億以上的這個交易條件。選擇這類穩定的企業是最重要的投資判斷，大家在交易的時候，請務必意識到該檔股票的市值。


