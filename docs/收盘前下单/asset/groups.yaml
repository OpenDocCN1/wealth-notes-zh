    ### 我最在乎的五項基本指標


    - 1. 最高價與最低價（見下頁圖表 4-5）


    「從收盤價來看近期的高點與低點」，高點就是看近期紅 K 棒的收盤價，低點就是看近期黑 K 棒的收盤價。打開技術線圖來看，過前高就是上漲訊號，破前低就是下跌訊號。


