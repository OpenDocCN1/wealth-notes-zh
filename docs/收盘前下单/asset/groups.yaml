    \n![](img/554ec54d2eecd32c8037517049342430_171_0.png)\n\n對於不習慣激烈行情的人來說，一定會被嚇得不知所措。發生這種狀況時，我們應該如何處理？首先我要告訴大家的是，反應速度很重要。在行情下跌時，我不會買股票而是會持續觀察，而且當股價出現變動時，要立刻判斷該不該停損。當行情暴跌或暴漲時，看似很難處理，其實也沒這麼難。除了第一章我告訴大家的訓練和練習之外，再來就是累積經驗。\n\
    \n股票投資最重要的條件可粗略分為兩項：可運用的資金和操作能力。\n\n這裡我們要談到操作能力。所謂操作能力，第一個要掌握的就是「趨勢」。股價從今天開始是往上還是往下，這一點沒先搞清楚的話，可能都站不上起跑點。了解趨勢後，再來就是判斷會有多少變動的「變動率」（按：由當天的股價與一定的天數之前的某一天股價比較，其變動速度的大小，來反映股票市場變動的快慢程度）。如果無法判斷變動率的人，就找不到出場點。有了進場點和出場點，這時你才能真正抬頭挺胸的說：「我在做股票投資。」\n\
    \n做股票在進場點和出場點都要有依據。所謂進場點，就是要考慮趨勢，出場點要考慮變動率，不是獲利了結，就是停損。如果沒有先在腦中模擬這兩個條件，基本上成不了股市贏家。\n\
    \n8%、16% 的變動率，是我決定進出場的判斷原則。從 2020 年 2 月開始，日經平均指數以驚人的速度下跌。如果用「8%、16% 的變動率」這個概念要怎麼應付？下面我解釋給各位聽。\n\
    \n這種大幅度的下跌，一年之中通常會出現幾次。\n\n2008 年 9 月發生的雷曼事件，日經指數從 13,000 點往下跌落三次 16%，最低甚至來到 7,000\
    \ 點；2020 年 2 月 6 日，日經指數從 24,000 點一口氣下跌 16%（見圖表 3-1），連跌了 5 天左右，之後又跌了一次 16%。\n\n\
    我做的技術面分析投資在觀察日經指數時，最重要的就是 8%、16% 法則。每次面對這種大跌就賠錢的人，我希望你們可以把心思從想要贏的心態，轉變成該怎麼贏、要怎麼做才會贏。請放心，只要好好學習技術面分析的手法，你也可以做進出有據的交易。\n\
    \n### 圖表 3-1 日經平均指數從 2020 年 2 月開始大幅下跌\n\n![](img/554ec54d2eecd32c8037517049342430_172_0.png)\n\
    ![](img/554ec54d2eecd32c8037517049342430_173_0.png)\n\n### 2 我不投資市值少於 5,000 億的公司\n\
    \n股票交易可分為兩種：國內股票交易，以及海外股票交易。\n\n初學者應先從國內股票交易開始。國內的股票，很多都是我們平常生活中聽得到的大公司，你可以透過網路、電視、報紙、雜誌蒐集到許多情報（臺灣也可從報紙、雜誌、網路平臺來蒐集相關資訊）。\n\
    \n在證券公司買得到的股票，就是所謂的上市、上櫃公司，大家下的單子會集中在這裡進行買賣。所謂上市，就是指獲得證券交易所認可、可以進行買賣的商品。日本全國有四間可以申請上市的證券交易所，分別是東京、名古屋、福岡、札幌（按：臺灣可於臺灣證券交易所申請上市）。\n"
