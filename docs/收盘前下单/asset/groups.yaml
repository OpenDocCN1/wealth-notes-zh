    ×100%。例如，帳戶資金有 100 萬日圓，每次的交易容許損失金額為 2 萬日圓，那麼曝險資金比率=2 萬日圓÷100 萬日圓×100%=2%。


    曝險資金比例要押在 2% 以下，才算低風險交易。比例若過高，幾次損失下來，就會賠光所有投資資金，請多加小心。


