    \n在日本有一個根深柢固的觀念，那就是用努力工作換得對等的金錢是一種美德，但在亞洲其他國家、歐美各國，用資產來賺錢提高收入的觀念比我們強太多了，而且是從中小學就把金融素養作為義務教育的一環。\n\
