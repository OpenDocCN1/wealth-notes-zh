    # 雖然有那麼多市場，但我們要怎麼挑選股票？


    我挑選股票最重要的依據，就是該公司的「市場價格總額」（市值）。所謂市場價格，指的是該檔股票當天在市場的股價，市場價格總額，就代表該股價乘上已發行的股份總數得出來的數字。以市值作為基準的話，我只會挑選市值
    5,000 億日圓以上的股票來交易。


    很多人都喜歡找未來有成長性的股票買，但小型股的市值較小，有時光是一天的股票變動率，就可以破壞掉線圖的型態，讓人很難預測未來走向，交易也就比較難有根據。所以，大家投資的時候一定要注意該檔股票的市值才行。


