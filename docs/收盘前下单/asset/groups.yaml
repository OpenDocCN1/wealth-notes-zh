    關鍵在於找出股價一直在上漲或一直下跌的線圖，然後仔細觀察。如果股價越久沒有碰到，勝率就越高。


    中期移動平均線轉折之術，是著眼於股價是否有碰到中期移動平均線產生轉折，同樣的道理運用在長期移動平均線也是成立的。


