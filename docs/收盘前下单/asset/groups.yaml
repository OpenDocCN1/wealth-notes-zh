    ## 提高勝率的兩項技術線型


    有兩個珍藏技巧我一直很猶豫要不要寫進書裡，但既然各位都願意拿起這本書，我就公開教大家吧。


    這兩個技巧就是「中期移動平均線的轉折」、「睽違三個月以上（甚至更久）碰到長期平均線」。


    - 1. 世界最簡單的買賣點——「中期移動平均線的轉折」之術


    中期移動平均線的轉折可分為兩種模式，一個是做多，一個是做空。當然勝率不是 100%，但它會是你跨出技術面分析交易的第一步。


    我人生的第一次交易就是採用中期移動平均線轉折的做多模式。這個技巧很適合初學者，堪稱是必殺技，光學會這招就能做很多種交易。如果你很害怕直接上場的話，可以先用模擬交易嘗試，或是直接上場但投入很小的金額，這麼一來就不會有太大壓力。


    接下來我來說明順序。


    如果你要做多，當股價在中期移動平均線之上，往下穿過移動平均線留下一根黑 K 棒，隔天卻是一根紅 K 棒轉折的話就買進。


    當紅 K 棒轉折時，要確認是否有高過前一天黑 K 棒的開盤價，所以最好在當天接近尾盤的時間下單，然後直到下一根黑 K 棒出現後脫手，就算沒有出現黑 K 棒，也要在三天之內脫手。做空的話就反著做。


