    # # 5


    # ## 我月收 50 萬日圓的

    ## 交易實績


    人們常說「散戶九成都是輸家」，這代表想要在股票市場賺錢真的很難。大家可以統計一下身邊有多少人投資股票能穩定獲利？恐怕不多吧。也是因為這樣，股票投資經常被認為跟賭博沒兩樣，但完全不是這麼一回事。只要遵守交易紀律，就有可能確實累積獲利。


    我個人是從一張白紙開始投資股票，現在除了原本的工作外，只要用上廁所休息的 3 分鐘，就能達到一個月獲利 50 萬日圓的實績，我是怎麼辦到的？接下來，我將公開我過去的交易紀錄。


    # ### 人生第一次的股票交易


    山下勳老師告訴我：「新手剛起步的半年，最好不'
