    |---|---|---|---|---|---|---|---|

    | 2010 | | 758 | 564 | 2016 | | 892 | 732 |

    | 2011 | | 790 | 607 | 2017 | | 907 | 744 |

    | 2012 | | 809 | 638 | 2018 | | 928 | 766 |

