    # 小知識


    資買：和券商借錢買股票，券商借投資人六成，投資人自付四成費用。


    資賣：賣掉和券商借錢所買的股票。


    例如：某股票股價目前100元，你看好這檔會上漲到200元。而你用資買的話，券商會借投資人60元，投資人只要負擔40元即可。


    如果股價真的漲到200元的話，投資人的獲利則為：


    200-跟券商借的60-自己成本40=100元，即獲利10萬元（100元×1,000股）。


