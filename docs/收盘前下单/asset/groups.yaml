    ### 2 常見問題集


    Q 要有多少資金才可以開始投資？

    A 視股票的價格而定，但基本上只要有 50 萬日圓以上的自有資金，就可以開始投資。


    Q 我不太懂電腦，會不會有什麼困難？

    A 完全沒問題。你可以用手機簡單操作買賣，不過還是需要練習一下。


    Q 我對股票的印象就是很困難，完全沒有經驗的人也有辦法交易嗎？

    A 即使完全沒有經驗也可以，只要從技術線圖的型態做判斷即可，很容易懂。不用學習困難的專有名詞或啃讀厚厚的參考書。


    Q 我五十多歲了，現在開始投資會不會太遲？

    A 60 歲都來得及，退休後人生還有很長一段時間。


    Q 我是一名上班族，沒辦法空出太多時間做股票，這樣沒問題嗎？

    A 沒問題。你只要一天花幾分鐘交易就好，上廁所的空檔就夠了，也不用長時間盯著技術線圖看，絕對不會影響到你的本業。


    Q 聽說做空很恐怖…… 。

    A 就我的角度來看，不做空的風險才大。如果學會做空，下跌行情你都能賺錢，股價上上下下你都不用怕。


    ## 結語


    ### 現在開始，活出自己想要的樣子


    感謝你捧著這本書讀到最後。各位讀者覺得如何？希望本書多少能為你帶來幫助。這個時候最重要的一件事就是，想一想從明天開始，你要怎麼做。


    當人生走到終點，你覺得最後悔的事情是什麼？是沒有盡到義務嗎？還是沒有追求夢想？據說人死前最後悔的事，是沒有以自己「最想要的樣子」過活。換句話說，最讓人懊惱的不是犯錯、挑戰失敗，而是無法成為自己真正想成為的人。


    就長期來看，人對沒做過的事感到後悔的程度，遠大於做過的事。決定採取某種行動，即使最後失敗，當下感到很懊悔，也只是暫時的，我們很快就會把它消化成人生教訓。


    這世上大概沒有從未犯過錯的聖人吧？人即使做出某樣錯誤行動，也不會一直苦惱，而是會很快修正自己的軌道。簡單來說，失敗可以重新再來，但沒去做的後悔，卻無法做任何修正。


    ![](img/554ec54d2eecd32c8037517049342430_390_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_390_1.png)


    大家應該都有過這樣的經驗，最讓人在腦中揮之不去的，就是後悔當時沒怎麼做，沒試著去接受某樣挑戰。比方說，寫小說害怕被批評，所以不敢公開發表，或是沒有勇氣向喜歡的人告白，無法讓對方走入自己的人生。許多人都不敢朝目標踏出一步，只是守株待兔、等待機會來臨。很遺憾，機會不會那麼簡單出現。機會不是等來的，為此你要盡量在可行的範圍內採取行動。


    為了不在死前才後悔「當時有做那件事就好了」，從今天就開始展開行動！打開人生的大門，打破你看這個世界的框架。


    我們無法改變過去，但可以改變未來的自己。即使連續挑戰失敗，在過程中有時候會遇到最棒的同伴，還可以看到最棒的風景。相對的，也會有在夜晚暗自流淚，感到受挫或後悔的時候。


    當你想接受新挑戰，不可避免的，會有很多人持否定意見，但沒關係。這些過程沒多久就會隨著時間流逝，我們將超越過去。失敗後如果不想辦法解決，那就真的是失敗，但如果你接受並改善，且再度挑戰，先前的失敗，反而會成為未來成功的靈感。一旦抓住機會就要緊緊不放，持續行動，這麼一來，你的人生一定會不斷提升。若能堅持向前直到成功，你就會了解過去的失敗，都是必要的養分。最後你會發現，這世界上根本沒有失敗這回事。


    ![](img/554ec54d2eecd32c8037517049342430_391_0.png)


    如果你能因為翻閱這本書而開始投資股票，並對你的人生有所改變，那我會很高興。假如各位對股票投資有不懂或煩惱的地方，歡迎隨時和我聯繫，我會盡力支援你。


    感謝大家讀到最後。期待與各位相見的那天到來。


