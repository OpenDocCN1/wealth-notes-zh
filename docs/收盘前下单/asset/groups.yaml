    # 5. 人多的地方不要去，人少的地方才有美麗風景


    大部分的飆股都是從沒有人注意的低價股中誕生。換句話說，寶藏就在成交量少、價位過低的個股之中。這句格言想要教大家，若想要賺錢，就要關注人少的那一條路。


    # 6. 高還有更高，低還有更低


    行情的變動通常有一些關卡，就是大家都知道的天花板和地板。是不是天花板或地板其實都是事後諸葛，在當下變動的時間點，你覺得已經到底了的時候，其實可能還有更深的底。相反的，當你認為還會更低時，可能就反轉了。


    所以，當你認為已經怎樣，其實還沒發生，當你認為還沒發生時，其實已經到了。這句格言是要大家不要太固執己見，應該靈活面對行情。


    # 7. 買賣八分飽


