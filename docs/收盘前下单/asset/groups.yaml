    \ 5 日均線是 598。\n\n註：此為臺版增補資料。\n\n## 6\n### 學會放空，你就多一個武器！\n\n一般人認為，股票就是低買高賣才能賺錢，若股票都不上漲，你就賺不了錢。\n\
    \n股價會不斷變動，有時會大漲，有時也會大跌。特別是當新聞出現新冠肺炎危機或是希臘危機等，有某某危機等字眼出現時，股價特別容易大幅滑落，這些我想大家也很常見。\n\
    \n股價會下跌，雖然很正常，但對買股票的人來說，都不希望看到自己買的股票下跌，更別說看到某某危機等字眼出現。但股票就是有可能暴跌，如果在交易之前沒有建立好這個觀念，總是用「買進」的觀點來看待股票，很難達到好成績。\n\
    \n那麼，當行情下跌時，要怎麼提高獲利？答案是提升放空的技巧。所謂放空，就是在沒有持股的狀態下，先賣股票，之後再便宜買回來的方法，當股價下跌，你就會賺錢。第一次聽到這種做法的人一定一頭霧水，我也一樣。\n\
    \n為什麼股票下跌反而會賺錢？它的原理是這樣：\n\n- 1. 向證券商借股票\n  關鍵就在這，重點在於先跟券商借股票。\n- 2. 把借來的股票賣給市場\n\
    - 3. 約定放空（賣給市場）\n  假設我們要放空豐田的股票，股價是 6,000 日圓，最小單位是 100 股（此為日本情況，臺灣可買零股），所以你賣給市場股票的話，就會擁有\
    \ 60 萬日圓（6,000 日圓×100 股），但這只是形式上，實際上不會拿到錢，只是帳面上的數字而已。\n- 4. 股價下跌\n  結果股價下跌了。4\
    \ 天後豐田股價變成 5,500 日圓，代表股價下跌 500 日圓，$500 \\text{日圓} \\times 100 \\text{股} = 5 \\\
    text{萬日圓}$，就成了你的獲利。\n- 5. 把股票買回來，還給證券商\n  這時你就可以把豐田的股票買回來，就是用你在第三點賣時帳面上的那 60 萬日圓買。現在股價剩\
    \ 5,500 圓，所以買進 100 股的金額是 55 萬日圓（5,500 圓×100 股）。這麼一來，原本有 60 萬日圓，付 55 萬日圓出去，還剩 5\
    \ 萬日圓，這就成了你的獲利。這個 5 萬日圓的差額就會匯進你的戶頭。怎麼樣？這個下跌還能賺錢的原理，各位了解了嗎？股票市場有這個遊戲規則，各位可以好好活用。\n\
    \n有些人怕放空，但對我來說，不放空我才怕。股票市場有一個投資格言：「做多頂多賠一間房子，放空連命都沒了。」但仔細想想，學會放空的話，其實是多一項投資利器。害怕放空的人，很可能會在股價下跌時，因為腳癱跑不動，最慘的狀況當然就是被套牢。\n\
    \n我身邊也有很多人對放空的技巧很有興趣，但總覺得很恐怖而不敢實踐。確實，如果不熟悉怎麼放空的話，一般都會很抗拒。但若不先跨出第一步，永遠只能原地踏步。總比哪天突然想放空，但技巧又不熟練，一次就大出手，結果賠光光還來得好。\n\
    \n如果從小金額開始嘗試，即使失敗也損傷有限，所以我建議大家先從小金額嘗試，然後再慢慢放大。或者先用虛擬交易的方式體驗也是很好的方法。\n\n只要熟練放空技巧，未來你不只能在上漲行情獲利，下跌行情也有機會獲利。能用的武器一定是越多越好，只要學會正確的方法，放空一點也不可怕。讓我們一起認真的接受訓練，挑戰放空吧。\n\
    \n## 7\n### 重點不是盈虧，而是安全比率，我有公式！\n\n所謂「鹽醃」就是為了長期保存，而把蔬菜、魚肉等食物用鹽醃漬的調理方法之一。後來的日本人形容買進後不斷下跌，卻賣不下手的股票稱作「鹽醃股」。這個鹽醃股不知道要醃到什麼時候才可以吃（等股價回升到買進的價格），有時甚至再也回不來（按：等同於臺灣的套牢，住套房）。\n\
    \n有人會希望如果每次股票交易都賺錢就好了，很遺憾，這是不可能的。不管投資經驗再豐富的人，都還是會看錯，這時只要立刻停損，就有可能把損失降到最低。但人們通常會想：「只要再等一下，股價就會回升。」而持續持股的結果就是，股價一點一點往下掉，最後就被套牢了。為了避免股票套牢，你需要嚴格執行停損。\n\
    \n買進股票後，股價卻下跌，這時人們通常會給自己找個理由，「我是看好它長期性的成長」、「我買它的目的是為了它的股息」等，並不認為是自己看錯，我想很多人都有過這種心態。當然，為了長期性的成長或股息而買進的長期持有股，股價也可能會下跌。\n\
    \n假如你買進某檔股票的條件還成立，或者股價變動仍在你之前的預料範圍內，這時說看錯還太早，有時沒多久股價就回升了。相反的，在預料之外的時機點獲利，有時只因為運氣好，這也是一種看錯。這樣的僥倖心態，讓你容易陷入一種惡性循環的交易模式，例如買了某檔股票之後，股價一直回不來，可能是好幾個月、好幾年，當你看到帳面損失不斷擴大，更加欲不下手。\n\
    \n### 抱著套牢股，你的翻本錢也被套牢\n\n抱著套牢股票最大的壞處就是，你連翻本的錢都被套牢了。假如你的投資資金是 100 萬日圓，50 萬日圓拿來買股票全都被套牢，你就只剩下\
    \ 50 萬日圓可以拿來翻本。但 50 萬日圓，大概也買不了幾檔，要是好死不死這個時候出現大行情，你就錯過了賺錢的大好時機，只能在一旁乾瞪眼。股票套牢會讓資金的使用效率惡化，你不只是抱著帳面的損失，還損失了機會成本。\n\
    \n股票套牢不只會壓縮到投資資金，也會造成精神上的壓力。當你抱著套牢的股票，看著股價上上下下，帳面上虧損卻一直無法消除時，內心會長存一種不安全感，害怕會繼續下跌，光是看到那檔股票的名字心情就會憂鬱。這種精神上的壓力，會影響你整體的投資行為，你會為了挽回虧損，而失去冷靜的判斷。\n\
    \n最重要的是，投資之前一定要決定好何時出場。預先決定好遇到什麼情況就獲利了結或停損，之後再照著規則操作即可。再加上第三節提到的，不要抱股抱到財報發表，遵照這樣的規則交易，你就不會被套牢。\n\
    \n### 鮑爾紹拉的破產機率表\n\n下面我想讓大家做一個心理測驗。請看以下兩個選項，選出你覺得比較好的狀況。\n\n- 1. 100% 確定會損失 50\
    \ 萬日圓。\n- 2. 50% 的機率會損失 100 萬日圓，但有 50% 的機率不會損失。\n\n這兩個狀況，你覺得哪一個比較好？\n\n其實這兩個狀況的期望值都是負\
    \ 50%，理論上來說都一樣。但面對這個問題，大多數人都會選 2，根據心理學者分析，是因為人們會無意識的選擇迴避確定的損失。換句話說，面對這兩個狀況，我們內心會下意识想成：\n\
    \n- 1. 100% 確定會損失 50 萬日圓（確定會損失 50 萬日圓）。\n- 2. 50% 的機率會損失 100 萬日圓，但有 50% 的機率不會損失（有可能不會損失，但忽略可能會損失\
    \ 100 萬日圓這件事）。\n\n這種心理又被稱為展望理論（prospect theory）。大家有聽過「鮑爾紹拉的破產機率」嗎？如果你正在投資，卻沒聽過的話，趁這個機會好好學習一下。\n\
    \n鮑爾紹拉的破產機率不只適用於股票投資，而是投資所有商品之前都必須學習的必要知識。\n\n瑙澤·鮑爾紹拉（Nauser Balsaara）是一位數學家，他製作了一張關於破產機率的表，可讓人對自己的交易規則的安全性，與期望值的高低有個底。看起來很難懂，但其實它的規則很簡單就能算出來，大家只要記得三件事：\n\
    \n- 勝率。\n- 盈虧比。\n- 曝險資金比例。\n\n從這三個數值就能導出後續交易的破產機率。勝率則是每次交易獲勝的機率。算法為：勝率（%）＝獲勝交易的次數÷總交易次數×100%。例如，交易成績是\
    \ 10 勝 4 敗，勝率＝$10 \\div 14 \\times 100\\% = 71.4\\%$（A）。\n\n盈虧比，就是獲勝交易的利益額，與失敗交易的損失額的比例，算式為：盈虧比（倍）＝交易的平均利益額÷交易的平均損失額。例如，假設你的平均利益額\
    \ 3,000 日圓，平均損失額是 2,000 日圓，那你的盈虧比就是 $3,000 \\text{日圓} \\div 2,000 \\text{日圓} =\
    \ 1.5 \\text{倍}$（B）。\n\n所謂曝險資金比例是指，每次的交易，你能容許帳戶資金有幾 % 的損失？由以下計算公式求得：曝險資金比率（%）＝每次交易的容許損失額÷帳戶資金×100%。例如，帳戶資金有\
    \ 100 萬日圓，每次的交易容許損失金額為 2 萬日圓，那麼曝險資金比率＝$2 \\text{萬日圓} \\div 100 \\text{萬日圓} \\\
    times 100\\% = 2\\%$。\n\n曝險資金比例要押在 2% 以下，才算低風險交易。比例若過高，幾次損失下來，就會賠光所有投資資金，請多加小心。\n\
    \n以前面舉例的計算結果來說，勝率與盈虧比分別是 71.4% 及 1.5 倍。放進鮑爾紹拉的破產機率表來看，破產機率為 0%（見圖表 3-12）。以此圖表來看，只要破產機率小於\
    \ 1% 都算安全性很高的交易。所以曝險資金比率 2%，勝率 71.4%，盈虧比 1.5 倍，從這些條件來看，這是安全度相當高的交易。\n\n圖表 3-11\
    \ 勝率、盈虧比、曝險資金比例公式\n\n| 指標 | 計算公式 |\n| :--- | :--- |\n| 勝率（%） | 獲勝交易次數 ÷ 總交易次數\
    \ × 100% |\n| 盈虧比（倍） | 交易的平均利益額 ÷ 交易的平均損失額 |\n| 曝險資金比例（%） | 每次交易的容許損失額 ÷ 帳戶資金\
    \ × 100% |\n"
