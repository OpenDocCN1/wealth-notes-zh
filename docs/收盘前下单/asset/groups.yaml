    +   - 勝率。

    - 盈虧比。

    - 曝險資金比例。


    從這三個數值就能導出後續交易的破產機率。勝率則是每次交易獲勝的機率。算法為：勝率（%）＝獲勝交易的次數÷總交易次數×100%。例如，交易成績是10 勝 4
    敗，勝率＝10÷14×100%＝71.4%（A）。


    盈虧比，就是獲勝交易的利益額，與失敗交易的損失額的比例，算式為：盈虧比（倍）＝交易的平均利益額÷交易的平均損失額。例如，假設你的平均利益額 3,000 日圓，平均損失額是
