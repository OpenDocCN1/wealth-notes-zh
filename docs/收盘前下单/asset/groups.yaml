    接下來我要介紹的是，「暌違 3 個月以上（甚至更久）碰到長期平均線」。


    當股價已經 3 個月以上沒有碰到長期平均線時，一旦碰到就很容易反彈或反壓，請好好活用這個特性。這種狀態不常發生，準確度又高，連初學者也能容易分辨。先記熟以下的參考線圖（見圖表
