    技術面分析能分析短期行情，它擁有以下優勢：


    +   可以用視覺判斷投資時機


    要確認某檔股票的價格變動，最好用的就是直接看股價走勢圖。


    股價走勢圖，是把股價變動做成圖表。圖表上還可以看岀移動平均線、布林通道（Bollinger Bands，見圖表 3-8、3-9）、MACD 等數據的變化。這些資料都可以直接判斷，這是技術面分析的最大優點。


    +   只要關注圖表就能做股價分析


    所有要分析的資料都在股價的圖表上，不用再把其他資料拉出來看。換句話說，你只要分析完圖表，就結束分析了。因此，技術面分析算是比較容易入門的行情判別技術。


    +   沒有經濟相關的知識也能預測、分析股價


    只要有顯示股價變動的相關圖表，以及與技術面分析相關的知識，你就可以進行技術面分析。如果你對於海外與國內的經濟狀況有一定的認識，更能增加準確'
