    # 收盤前下單，月薪多 50 萬￥


    這兩個狀況，你覺得哪一個比較好？


    其實這兩個狀況的期望值都是負 50%，理論上來說都一樣。但面對這個問題，大多數人都會選 2，根據心理學者分析，是因為人們會無意識的選擇迴避確定的損失。換句話說，面對這兩個狀況，我們內心會下意識想成：


    +   1. 100% 確定會損失 50 萬日圓（確定會損失 50 萬日圓）。


    +   2. 50% 的機率會損失 100 萬日圓，但有 50% 的機率不會損失（有可能不會損失，但忽略可能會損失 100 萬日圓這件事）。


    這種心理又被稱為展望理論（prospect theory）。大家有聽過「鮑爾紹拉的破產機率」嗎？如果你正在投資，卻沒聽過的話，趁這個機會好好學習一下。


    鮑爾紹拉的破產機率不只適用於股票投資，而是投資所有商品之前都必須學習的必要知識。


