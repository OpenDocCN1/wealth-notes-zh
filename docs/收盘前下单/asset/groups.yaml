    ## Chapter 1 幻想一夕成功，差點走投無路！


    ### 1 夢想破滅的倒數計時


    2014 年，我 22 歲。大學畢業後，我看到朋友們陸續進入大企業工作，好像未來的生活都有了保障，只有我一個人意志消沉，一臉絕望。因為那時的我剛得知一個沉重的事實。


    「有一件事之前沒跟你說，其實，家裡還有很大筆負債，我們為了還錢拚了命的工作……。」剛出社會的某天晚上，父親把我叫去。平常大而化之的他突然正襟危坐的看著我，我開始緊張起來，直覺事情不簡單。


    父親淡淡說出實情。由於無紙化風潮大起，印刷業的經營環境越來越惡劣，和我們配合的印刷公司已經倒掉 3 間，3 名會操作機器的員工也陸續離職，只剩下父親母親兩個人硬撐。父親為了提升營收、開拓新客戶，製作大量傳單，到處寄明信片，出門跑業務，生意卻也未見起色，最後動了要賠上性命領保險金的念頭。


    突然告訴我這麼嚴重的事情，一時之間我也沒有解決方法，不知如何是好，只能不停落淚。因為我是長男，所以也考慮過是否要繼承家業、分擔爸媽的工作量，但考量到在外面工作拿到的薪水可能更高、更能幫到家裡，最後還是決定在外面找工作。大學三年級時，我想去職業訓練補習班上課，媽媽什麼話也沒說，就匯了
    30 萬日圓的補習費給我。那時我滿腦子只有一個想法，就是進入好公司報答父母的恩情。當時我相信只要從好大學畢業，進大公司工作，就可以拯救我的家人，人生就會幸福。


    父親為了度過眼前的難關、補貼家計，無論是深夜或假日都去打工。母親也是，每天半夜 1 點就要起床去送報紙，他們付出的一切我都看在眼裡。幸好我大學拿到獎學金，順利念完。高中時還不知道家裡的狀況，我還說過「想去補習」、「國立的我考不上，可以去念私立的嗎」這類的话，現在想想只覺得很後悔。


    包含我在內，我們家三個小孩完全不知道家裡的經濟狀況如此嚴重。我們從小到大能過著無虞的生活，完

