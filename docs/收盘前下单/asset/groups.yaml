    大家應該都有過這樣的經驗，最讓人在腦中揮之不去的，就是後悔當時沒怎麼做，沒試著去接受某樣挑戰。比方說，寫小說害怕被批評，所以不敢公開發表，或是沒有勇氣向喜歡的人告白，無法讓對方走入自己的人生。許多人都不敢朝目標踏出一步，只是守株待兔、等待機會來臨。很遺憾，機會不會那麼簡單出現。機會不是等來的，為此你要盡量在可行的範圍內採取行動。


    為了不在死前才後悔「當時有做那件事就好了」，從今天就開始展開行動！打開人生的大門，打破你看這個世界的框架。


