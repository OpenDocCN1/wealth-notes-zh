  md: "\n## 不要只為股息買股票\n\n日本有一個「股東優待制度」（按：臺灣有股東會紀念品，但不是每檔股票都會送，也不是每年都有，且無論持股多寡都是一份）。簡單來說，就是上市公司會為了感謝股東而發放贈品。\n\
    \n本來公司配息給股東，就已經達到回饋的目的，但日本的小股東們，除了領錢（股息），還有可能領到贈品（股東優待制度），這形成了一股風潮。正因為公司想要討好股東，這種股東優待制度才能存續。尤其是經營零售、外食、食品業的公司，會發放禮券讓股東直接成為自己的顧客（購買自家公司產品），可視為宣傳活動的一個環節，所以很多企業都會積極用自家公司產品作為贈品。\n\
    \n### 圖表 3-6 如何查詢股東紀念品領取條件（以味全〔1201〕為例）\n\n![](img/554ec54d2eecd32c8037517049342430_211_0.png)\n\
    \n![](img/554ec54d2eecd32c8037517049342430_211_1.png)\n\n![](img/554ec54d2eecd32c8037517049342430_211_2.png)\n\
    \n資料來源：公開資訊觀測站（註：此為臺版增補資料）。\n\n## chapter 3 新手多關心帳面盈虧，高手會先算曝險資金比例\n\n這個制度看似非常有吸引力，但當你選擇接受這樣的優待制度之前，最好先釐清幾個重點。\n\
    \n首先，股票的獲利可分為兩種：收到股息或贈品的獲利、透過股價的價差所賺取的獲利。我的交易主要是透過股價的價差賺取獲利。為什麼我要提醒大家？如果你希望獲得股息，或是獲得贈品，交易就要多加小心，讓我透過具體的圖表來解說。\n\
    \n喜歡用股息、贈品來吸引投資人的人氣股票之一，就是日本菸草產業（簡稱 JT）。JT 是一間非常積極分配利益給股東的公司。到 2019 年 12 月期為止，它連續\
    \ 16 期增加股息（增加每股發放金額）。不僅如此，他們還積極買進自家公司的股票，但請看下頁圖表 3-7。\n\n我們看它過去 1 年半的股價，如圖所示，一路下跌。它的股息率一路上，股價卻持續下跌。當時買在\
    \ 3,200 日圓的人，若一路抱到 2,000 日圓的話，等於跌掉了 37.5%。\n\n如果用 100 萬日圓買，就等於有負 37.5 萬日圓的未實現損益。有多少人可以持續忍受這種帳面上的虧損這麼久？就現狀來看，它的股價可能持續探低，即使有耐心等它上漲，也要承受長時間無法換成現金的風險，並錯失其他更好的投資機會。\n\
    \n對企業來說，股東優待制度有三項好處：可以提高股東的忠誠度（增加死忠粉絲）、確保股東人數的穩定度、增加或維持股東人數。這個制度雖然有很多優點，但相對的要消耗許多成本。\n\
    \n一名股東即使比另一個人擁有兩倍的股份，通常也不會得到兩倍的贈品，因此期待股東優待制度的通常是小股東。換句話說，有多少名股東，公司就要負擔多少贈品與寄送的费用。\n\
    \n### 小知識\n\n- **股利、股息、除權息是什麼？**\n\n股利是公司向股東分配前一年公司營運所得之盈餘，一般來說，股利可以現金（現金股利，常稱股息）或股票（股票股利，常稱股利）的方式發放，而發放股利的時間為除權息時間，其中可再細分出除息、除權，發放現金股利稱為除息，發放股票股利則稱為除權。\n\
    \n註：此為臺版增補資料。\n\n## 5 技術面分析和基本面分析，各有好壞\n\n看圖表做投資判斷的技術面分析，常被拿來和基本面分析做比較。所謂基本面分析，簡單來說，就是關注企業真正的價值作為判斷依據的分析手法。另一方面，技術面分析則是關注股票變動的價格、K\
    \ 線、移動平均線、投資人的行為模式等。\n\n價格是出於所有投資人的意志決定，記錄價格與買賣高低點的圖表，就等於是所有投資人決策時所留下的足跡。因此只要仔細研究圖表，就能某種程度知道，現在的股價是投資人買過頭或是賣過頭，然後再根據圖表預測未來的價格，了解在什麼樣的時機點買賣最有效，這就是技術面分析。\n\
    \n技術面分析能分析短期行情，它擁有以下優勢：\n\n- **可以用視覺判斷投資時機**\n  要確認某檔股票的價格變動，最好用的就是直接看股價走勢圖。\n\
    \n  股價走勢圖，是把股價變動做成圖表。圖表上還可以看到移動平均線、布林通道（Bollinger Bands，見圖表 3-8、3-9）、MACD 等數據的變化。這些資料都可以直接判斷，這是技術面分析的最大優點。\n\
    \n- **只要關注圖表就能做股價分析**\n  所有要分析的資料都在股價的圖表上，不用再把其他資料拉出來看。換句話說，你只要分析完圖表，就結束分析了。因此，技術面分析算是比較容易入門的行情判別技術。\n\
    \n- **沒有經濟相關的知識也能預測、分析股價**\n  只要有顯示股價變動相關的圖表，以及與技術面分析相關的知識，你就可以進行技術面分析。如果你對於海外與國內的經濟狀況有一定的認識，更能增加準確度。但即使沒有，你還是可以做技術面分析，這是它的特點。\n\
    \n- **只要提升分析能力，預測行情的準確度也會提高**\n  在做技術面分析的時候，只要不斷根據結果持續改進，分析能力自然會提高。分析能力提高，預測未來行情的準確度也會提高。\n\
    \n而技術面分析的劣勢是：\n\n- **分析結果並非絕對**\n  沒有人能完美預測股票市場行情。尤其是像機構投資人那樣擁有龐大資金的話，有時反而會在買賣訊號出現時，做出相反的動作，藉此提高獲利。這種情形在技術面分析上就叫「假突破」或「假跌破」。不過，當行情與你分析預測的走向不同時，我建議還是要適時停損，否則可能會不斷擴大損失。雖說如此，大家也不要太恐慌，最重要的是按照規則有紀律的下單。\n\
    \n### 圖表 3-8 移動平均線、布林通道、MACD 是什麼？\n\n| 名詞 | 說明 |\n| :--- | :--- |\n| 移動平均線 | 過去一段時間裡的平均成交價格。\
    \ |\n| 布林通道 | 是由均線和標準差組成的指標，總共有 3 條線：中線、上線、下線。<br>通常是用作中線加減 2 個標準差成上下線，而由上下線構成的區域就是布林通道，可用來判斷買賣訊號、進出場時機。\
    \ |\n| MACD | 是使用長期與短期的移動平均線兩者交叉狀態，來判斷股價的趨勢方向，屬於中長期趨勢指標。 |\n\n### 圖表 3-9 布林通道，以台積電（2330）為例\n\
    \n![](img/554ec54d2eecd32c8037517049342430_224_0.png)\n\n### 圖表 3-7 日本菸草產業（JT）的股價與股息\n\
    \n![](img/554ec54d2eecd32c8037517049342430_214_0.png)\n\n資料來源：日本樂天證券經濟研究所製圖。\n\
    \n### 無法應付突發狀況\n\n股價受到政治、經濟情勢影響甚鉅，當有相關事件或新聞發生時，難免會有波動。當這些突發狀況發生，行情往往會呈現相反的走勢，所以平時就要做好危機的因應訓練，才不會手忙腳亂。\n\
    \n基本面分析就是根據企業的財務狀況或業績，分析企業的真正價值、與市場價格的落差的方法。而基本面分析有兩項優勢：\n\n- **不用擔心短期的價格變動或趨勢**\n\
    \  基本面分析，比較適合長期投資的分析手法。即使股價短期下跌，也因為預期未來會上漲，所以可以耐心等待股價回升。除此之外，做基本面分析的人，比較不會因為短期趨勢的改變，頻繁的被迫停損，投資時心情上比較從容。\n\
    \n- **透過長期投資可以獲取較大的利益**\n  市場的狀況或企業的未來成長，也可以作為分析的材料。例如，眼光精準的鎖定購買某檔新上市企業的股票的，幾年過後，你會發現它的股價和當初相比已經大幅上漲。\n\
    \n而基本面分析的兩項劣勢是：\n\n- **散戶與專業投資人獲取情報的來源與精準度落差太大**\n  前面提到技術面分析的優勢時也說過，一般投資人在蒐集企業的財務狀況等情報時，一定不如機構投資人。因此，散戶們常因為獲取情報的時間太慢，買進自己以為便宜的股票，結果買在高點，最後失敗收場。\n\
    \n- **確認分析結果是否正確，與獲利了結的時間相隔太長**\n  基本面分析適合長期投資。但在預測行情或獲利後，到真正的「結果出爐」要耗費太多時間，當然有時候也會失準，就這點來看，基本面分析，可能比較適合有一定程度的股票投資者。\n\
    \n總而言之，技術面分析與基本面分析各有各的優點與特色，我無法斷定哪一種方法比較優秀，而且我必須承認，如果只仰賴一種方法投資也很危險。因此我認為投資股票時，必須活用這兩項技術的特色。\n\
    \n以我來說，在基本面分析的部分，我最重視政治，畢竟國家政策對股價影響甚鉅。比如，安倍經濟學推出金融寬鬆政策，使得股價大幅攀升，基本上行情處於多頭沒錯，但股價不會永遠往上，而是會上上下下，這時候技術面分析就能派上用場。就政策來說行情往上沒錯，但就技術線圖來看，股價也有往下的時候，同時掌握好這兩個概念，才能做出適切的投資判斷。\n\
    \n### 圖表 3-10 技術面分析與基本面分析的優劣\n\n| | 優勢 | 劣勢 |\n| :--- | :--- | :--- |\n| **技術面分析**\
    \ | 1. 可以用視覺判斷投資時機。<br>2. 只要分析圖表。<br>3. 沒有相關知識也能預測、分析股價。<br>4. 提升分析能力，預測準確度也會提高。\
    \ | 1. 分析結果並非絕對。<br>2. 無法應付突發狀況。 |\n| **基本面分析** | 1. 不用擔心短期的價格變動或趨勢。<br>2. 透過長期投資可獲得較大利益。\
    \ | 1. 散戶與專業人員的情報來源差太多。<br>2. 分析的結果到獲利了結的時間相隔太長。 |\n"
  mdcn: "\n## 不要只為股息買股票\n\n日本有一個「股東優待制度」（按：臺灣有股東會紀念品，但不是每檔股票都會送，也不是每年都有，且無論持股多寡都是一份）。簡單來說，就是上市公司會為了感謝股東而發放贈品。\n\
    \n本來公司配息給股東，就已經達到回饋的目的，但日本的小股東們，除了領錢（股息），還有可能領到贈品（股東優待制度），這形成了一股風潮。正因為公司想要討好股東，這種股東優待制度才能存續。尤其是經營零售、外食、食品業的公司，會發放禮券讓股東直接成為自己的顧客（購買自家公司產品），可視為宣傳活動的一個環節，所以很多企業都會積極用自家公司產品作為贈品。\n\
    \n### 圖表 3-6 如何查詢股東紀念品領取條件（以味全〔1201〕為例）\n\n![](img/554ec54d2eecd32c8037517049342430_211_0.png)\n\
    \n![](img/554ec54d2eecd32c8037517049342430_211_1.png)\n\n![](img/554ec54d2eecd32c8037517049342430_211_2.png)\n\
    \n資料來源：公開資訊觀測站（註：此為臺版增補資料）。\n\n## chapter 3 新手多關心帳面盈虧，高手會先算曝險資金比例\n\n這個制度看似非常有吸引力，但當你選擇接受這樣的優待制度之前，最好先釐清幾個重點。\n\
    \n首先，股票的獲利可分為兩種：收到股息或贈品的獲利、透過股價的價差所賺取的獲利。我的交易主要是透過股價的價差賺取獲利。為什麼我要提醒大家？如果你希望獲得股息，或是獲得贈品，交易就要多加小心，讓我透過具體的圖表來解說。\n\
    \n喜歡用股息、贈品來吸引投資人的人氣股票之一，就是日本菸草產業（簡稱 JT）。JT 是一間非常積極分配利益給股東的公司。到 2019 年 12 月期為止，它連續\
    \ 16 期增加股息（增加每股發放金額）。不僅如此，他們還積極買進自家公司的股票，但請看下頁圖表 3-7。\n\n我們看它過去 1 年半的股價，如圖所示，一路下跌。它的股息率一路上，股價卻持續下跌。當時買在\
    \ 3,200 日圓的人，若一路抱到 2,000 日圓的話，等於跌掉了 37.5%。\n\n如果用 100 萬日圓買，就等於有負 37.5 萬日圓的未實現損益。有多少人可以持續忍受這種帳面上的虧損這麼久？就現狀來看，它的股價可能持續探低，即使有耐心等它上漲，也要承受長時間無法換成現金的風險，並錯失其他更好的投資機會。\n\
    \n對企業來說，股東優待制度有三項好處：可以提高股東的忠誠度（增加死忠粉絲）、確保股東人數的穩定度、增加或維持股東人數。這個制度雖然有很多優點，但相對的要消耗許多成本。\n\
    \n一名股東即使比另一個人擁有兩倍的股份，通常也不會得到兩倍的贈品，因此期待股東優待制度的通常是小股東。換句話說，有多少名股東，公司就要負擔多少贈品與寄送的费用。\n\
    \n### 小知識\n\n- **股利、股息、除權息是什麼？**\n\n股利是公司向股東分配前一年公司營運所得之盈餘，一般來說，股利可以現金（現金股利，常稱股息）或股票（股票股利，常稱股利）的方式發放，而發放股利的時間為除權息時間，其中可再細分出除息、除權，發放現金股利稱為除息，發放股票股利則稱為除權。\n\
    \n註：此為臺版增補資料。\n\n## 5 技術面分析和基本面分析，各有好壞\n\n看圖表做投資判斷的技術面分析，常被拿來和基本面分析做比較。所謂基本面分析，簡單來說，就是關注企業真正的價值作為判斷依據的分析手法。另一方面，技術面分析則是關注股票變動的價格、K\
    \ 線、移動平均線、投資人的行為模式等。\n\n價格是出於所有投資人的意志決定，記錄價格與買賣高低點的圖表，就等於是所有投資人決策時所留下的足跡。因此只要仔細研究圖表，就能某種程度知道，現在的股價是投資人買過頭或是賣過頭，然後再根據圖表預測未來的價格，了解在什麼樣的時機點買賣最有效，這就是技術面分析。\n\
    \n技術面分析能分析短期行情，它擁有以下優勢：\n\n- **可以用視覺判斷投資時機**\n  要確認某檔股票的價格變動，最好用的就是直接看股價走勢圖。\n\
    \n  股價走勢圖，是把股價變動做成圖表。圖表上還可以看到移動平均線、布林通道（Bollinger Bands，見圖表 3-8、3-9）、MACD 等數據的變化。這些資料都可以直接判斷，這是技術面分析的最大優點。\n\
    \n- **只要關注圖表就能做股價分析**\n  所有要分析的資料都在股價的圖表上，不用再把其他資料拉出來看。換句話說，你只要分析完圖表，就結束分析了。因此，技術面分析算是比較容易入門的行情判別技術。\n\
    \n- **沒有經濟相關的知識也能預測、分析股價**\n  只要有顯示股價變動相關的圖表，以及與技術面分析相關的知識，你就可以進行技術面分析。如果你對於海外與國內的經濟狀況有一定的認識，更能增加準確度。但即使沒有，你還是可以做技術面分析，這是它的特點。\n\
    \n- **只要提升分析能力，預測行情的準確度也會提高**\n  在做技術面分析的時候，只要不斷根據結果持續改進，分析能力自然會提高。分析能力提高，預測未來行情的準確度也會提高。\n\
    \n而技術面分析的劣勢是：\n\n- **分析結果並非絕對**\n  沒有人能完美預測股票市場行情。尤其是像機構投資人那樣擁有龐大資金的話，有時反而會在買賣訊號出現時，做出相反的動作，藉此提高獲利。這種情形在技術面分析上就叫「假突破」或「假跌破」。不過，當行情與你分析預測的走向不同時，我建議還是要適時停損，否則可能會不斷擴大損失。雖說如此，大家也不要太恐慌，最重要的是按照規則有紀律的下單。\n\
