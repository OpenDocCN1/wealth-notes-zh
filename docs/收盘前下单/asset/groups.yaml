    ![](img/554ec54d2eecd32c8037517049342430_311_0.png)


    怎麼樣？有找到嗎？


    先找到中期移動平均線，有一個地方紅 K 棒從下面往上穿過，隔天變黑 K 棒就是轉折處。看習慣的話一眼就能找出來，請各位也用同樣的方法尋找各檔股票有沒有出現這樣的訊號吧。


    試著仔細找一找後，是不是發現還滿多股票有這樣的情形？這招的關鍵核心就是，當股價碰到中期移動平均線時，容易發生轉折，知道這個特性之後就能好好運用。


    ### 圖表 4-15 解答


    ![](img/554ec54d2eecd32c8037517049342430_312_0.png)


