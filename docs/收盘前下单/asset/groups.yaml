    我交易的時候，若基本指標沒有湊齊三個以上，就不太會進行買賣。我會從這些條件來預測未來股價是要上漲或下跌。相反的，當不具備這些條件，我就什麼也不做。「等待」，也是一種很了不起的投資判斷。下面我會出八道題目，請大家依照前面所學試著回答。大家可以活用在第四章學到的技巧挑戰看看。那麼，立刻來試一試吧！


    ### Q1 東京海上控股（8766）


    這張技術線圖的中期移動平均線轉折的訊號在哪？


    ![](img/554ec54d2eecd32c8037517049342430_324_0.png)


    ### A1


    股價從下方穿越中期線，隔天出現相反的顏色（黑 K 棒）轉折的地方。再加上股價創新高已經有 5 天了，正好可以鎖定做空模式進場。


    ![](img/554ec54d2eecd32c8037517049342430_326_0.png)


    ### Q2 索尼（6758）


    從這張技術線圖來看，中期移動平均線轉折的訊號在哪？


    ![](img/554ec54d2eecd32c8037517049342430_328_0.png)


    ### A2


    股價從上方穿過中期線，隔天出現相反的顏色（紅 K 棒）轉折。加上前面已經橫盤整理 3 個月以上，接下來可能會出現多頭格局，是進場的好時機點。這種線圖型態最適合用來練習買進模式。


    ![](img/554ec54d2eecd32c8037517049342430_329_0.png)


    ### Q3 東陶機器株式會社（5332）


    請預測 2020 年 2 月 12 日以後，股價會呈現上漲、下跌或橫盤整理？


    ![](img/554ec54d2eecd32c8037517049342430_332_0.png)


    ### A3


    正確答案是下跌。


    它達到的指標已經超過三個，包括股價創新高（低）、橫盤整理的上方、5,000 日圓的整數關卡、沒過前高。果然 2 月中旬之後，再加上新冠肺炎風暴的助力，股價大幅跌落。如果這時懂得放空，可以獲取暴跌的利益。


    ![](img/554ec54d2eecd32c8037517049342430_335_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_335_1.png)


    ### Q4 川崎重工業（7012）


    活用基本指標，猜猜看哪裡是進場點。


    ![](img/554ec54d2eecd32c8037517049342430_336_0.png)


    - ①股價創新高（低）5 天、沒有過前高、橫盤整理的上方。

    - ②股價創新高（低）5 天、沒有破前低、橫盤整理的下方。

    - ③橫盤整理超過 3 個月，短期線沒有跌破中期線，反而反彈。


    ### A4


    - ①股價創新高（低）5 天、沒有過前高、橫盤整理的上方。

    - ②股價創新高（低）5 天、沒有破前低、橫盤整理的下方。

    - ③橫盤整理超過 3 個月，短期線沒有跌破中期線，反而反彈。

    - ④除了 2、3 點之外，再加上第二次越過 5,800 日圓的前高。


    ![](img/554ec54d2eecd32c8037517049342430_338_0.png)


