    - 2. 週期（見圖表 4-6）


    股價脫離不了這樣的週期：橫盤整理→上漲→下跌。當然也有例外，但原則上這樣的循環最多，這點先牢記。而橫盤整理持續 3 個月以上的話，很容易變成一個波段的多頭或空頭行情，所以當你看到橫盤整理時，就可以伺機從之後的多頭或空頭行情獲利。


    任何一檔股票都一樣，在下跌的時候非常急促，上漲的速度較為緩慢。它可能花 2、3 個月上漲，但下跌的時候就像坐雲霄飛車一樣，1 到 2 個月就跌完。


    - 3. 股價創新高（低）


    如何判斷股價來到天花板或地板，要看股價創新高


