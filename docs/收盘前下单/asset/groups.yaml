    \ | 賣出時 |\n| 是否有折扣 | 有 | 無 |\n\n註：此為臺版增補資料。\n\n## 6 遇上股市大暴跌，我照樣賺錢\n\n2020 年爆發新冠肺炎，導致股市大幅下跌，應該有許多投資人在這次的崩跌中虧損吧。這次的暴跌與回升來得如此猛烈，特別對雷曼風暴以後才踏入股市的投資來說，應該是惡夢一場。\n\
    \n新冠肺炎風暴造成的金融混亂，和日本 1990 年代的泡沫經濟崩壞，以及 2008 年的雷曼兄弟事件等，因金融因素對實體經濟造成影響的危機不同，這是一個沒有任何人經歷過的狀況，連市場本身也不太曉得要做往哪裡走。新冠肺炎凍結了人的交際和實體經濟活動，可說是一場前所未有的危機。\n\
    \n有人因為股價大幅下跌造成巨大損失，也有人因此而賺錢，下面我會介紹我當時是怎麼交易的。\n\n### 收盤前下單，月薪多 50 萬日圓\n\n- 見圖表\
