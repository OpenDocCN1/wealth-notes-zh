    ## 第二章 黃金交易時間，在收盤前 30 分鐘！


    ### 3 我只看 K 線和移動平均線


    我常聽到很多人說：「股票聽起來好難。」我猜他們對股票投資的印象，就是要學好多專業術語，還有做企業分析，因為我以前也是這麼想的。


    #### 漲跌訊號就藏在 K 線中


    我一開始也是什麼都不懂，什麼 K 線（見下頁圖表 2-2，按：又稱蠟燭線，是反映價格走勢的一種圖線，廣泛用於股票、期貨、貴金屬、數字貨幣等行情的技術分析）、移動平均線（按：過去一段時間的平均成交價格，最主要目的是用來判斷趨勢，通常是預期市場現在跟未來可能的走勢），完全沒有概念。當時，我身邊並沒有光靠買賣股票就賺大錢的人，賠錢的人倒是不少，這導致我有先入為主的觀念，認為股票很難，但實際操作後，和我想的完全相反。我的方法既不用看企業的財務報表，也不用蒐集市場情報，從結論說，我只要專心觀察由
    K 線和移動平均線所構成的線圖即可。看圖表不只可以追溯某檔股票的過去，也可以抓住它的特徵，預測未來走向，就像是寫考古題和模擬考一樣，從之前的題型中得到靈感，並應用在未來的趨勢。看圖表的型態，然後預測明天之後股票會上漲或下跌，這對沒有投資經驗的我來說，是很好的起點。連在校成績都不上不下、平凡如我都能做到，我相信大家只要透過訓練，一定可以靠股票獲利。


    ![](img/554ec54d2eecd32c8037517049342430_126_0.png)

    ![](img/554ec54d2eecd32c8037517049342430_126_1.png)

    ![](img/554ec54d2eecd32c8037517049342430_126_2.png)

    ![](img/554ec54d2eecd32c8037517049342430_126_3.png)


    **圖表 2-2 K 線圖的基本型態**


    #### 不能只看四季報和財報


    《公司四季報》（按：日文原文為「会社四季報」）會在每一季提供在日本國內證券交易所上市的所有企業的最新情報。裡面刊載的不只是企業過去的業績或股價，還會透過實際的採訪，提供業績預測。該季刊在
    2016 年迎接創刊 80 週年，在企業情報誌領域中，它的銷售量依然穩居龍頭寶座。


    《公司四季報》就如同它的名稱一樣，是 1 年發行 4 次（3 月、6 月、9 月、12 月）的企業情報誌（按：臺灣所出刊的《四季報》分為春季號、夏季號、秋季號、冬季號，分別於農曆年前
    10 天、5 月底、8 月底以及 11 月底出刊。另外《股市總覽》則是每年春、夏、秋、冬四季出刊，分為上市與上櫃兩類）。每一期的發行量約 50 萬冊，在企業情報誌領域的市占率高達八成，而且長年維持不墜，是一本濃縮公司財務分析，與企業未來展望等情報的書。


    公司四季報中塞滿了投資股票時，被認為是必要的資訊，但如果你想藉此來做交易，就代表你必須從三千多間公司（見圖表 2-3，按：據金融監督管理委員會證券期貨局全球資訊網統整，臺灣
    2020 年上市公司有 948 家，上櫃有 782 家）中，一間一間分析應該投資哪一支股票，這對每天忙於工作的人來說是很累人的作業，而且公司的資訊會隨著時間改變，你可能每一段時間就要重新研究一次，會耗費你龐大的時間。


    這種投資方法，是學看公司的財報、季報，然後買進財報數字亮眼的公司的股票，初學者第一個最想學的投資方法就是這個，但老實說我並不推薦。為什麼？因為當你買進的時候，或許時機點不錯，但你沒有決定什麼時候該獲利了結，當你真的忍不住想賣時，報酬可能不盡理想。這種投資手法本身沒有問題，有問題的是你沒有先建立起好股票投資的觀念，也就是這支股票買了之後什麼時候要賣，賣了之後什麼時候買回來，只要沒有這個觀念，你買股票就很難大賺。


    等你研究很多檔股票之後就會發現，業績好的公司，股價不一定會上漲，反過來也一樣。基於這個理由，我強烈建議不要光看公司的財報、季報等訊息作為交易的判斷依據。


