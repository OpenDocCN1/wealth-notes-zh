    # Chapter 6 男女老幼都能成功複製的操作模式！


    ## 1. 真正對投資有用的著名格言十選


    - **1. 5 月賣股票（Sell in May）**


    日本有「5 月賣股票」這樣的說法，而歐美也說 Sell in May（按：因 4 月中下旬起，美國企業會接連公布一年度消費旺季的財報，投資人觀察後可能會獲利了結離場，導致
    5 月美股走勢轉弱）。大家用的語言不一樣，但說的都是同一件事。換句話說，不論哪一國家，股票市場都有同樣的傾向，這句格言的效力似乎超越了語言與文化的隔閡。


    - **2. 每天都有行情**


    股價時時刻刻都在變動，所以會讓人產生一種「錯過這次機會就買不到了」的心理。但即使真的讓某次機會溜走了，也不要在意，因為那不會是最後一次。慌張之下所採取的行動，有很高的機率會失敗，你應該要不慌不忙的照自己的策略行動。就算今天沒買到，明天再買就好了。


    - **3. 靠別人不如靠自己**


    股票投資要完全靠自己的判斷。「跟著別人投資就可以賺錢」這種想法太天真，千萬不要仰賴他人。與股票相關的新聞網站上充斥著許多「他人的意見」，這些意見沒人知道是否正確。試問有誰會特地把能賺錢的情報告訴別人？投資判斷還是靠自己最安全。


    - **4. 有買有賣也要休息**


    股票是靠買賣來獲取利益，因此有些投資人會有一種心態，那就是要經常下單買賣，否則不會賺錢。但是投資不是只有買和賣，休息也很重要。明明還沒出現自己擅長的模式卻硬要交易的話，就很容易失敗，這是交易心理的一大難關。還有一個格言跟這個觀念類似，那就是「休息也是一種行情」。


    - **5. 人多的地方不要去，人少的地方才有美麗風景**


    大部分的飆股都是從沒有人注意的低價股中誕生。換句話說，寶藏就在成交量少、價位過低的個股之中。這句格言想要教大家，若想要賺錢，就要關注人少的那一條路。


    - **6. 高還有更高，低還有更低**


    行情的變動通常有一些關卡，就是大家都知道的天花板和地板。是不是天花板或地板其實都是事後諸葛，在當下變動的時間點，你覺得已經到底了的時候，其實可能還有更深的底。相反的，當你認為還會更低時，可能就反轉了。所以，當你認為已經怎樣，其實還沒發生，當你認為還沒發生時，其實已經到了。這句格言是要大家不要太固執己見，應該靈活面對行情。


    - **7. 買賣八分飽**


    人的慾望是最難處理的東西，當賺了一點錢之後，就會想賺更多。一旦被這種慾望牽引，很可能連本來賺的都回吐光光。「去頭去尾」這句格言也是教我們一樣的道理，什麼事情都是八分飽就好。貪得無厭絕對沒有好事，這個道理也適用在其他地方。


    - **8. 持股五花八門，獲利七零八落**


    有一句話說「樣樣通，樣樣鬆」，指一個人很喜歡學習新事物，但每件事都做不久、半途而廢。在股票界也有類似的說法：「持股五花八門，獲利七零八落。」意思就在警惕投資人，不要只因為有興趣，就一窩蜂的跟著大家投資新上市的股票，或是話題股票，卻沒有自己的根據或策略，通常這樣很容易以失敗收場。投資要在自己熟悉的領域操作，不要只因為有興趣，就投入自己不熟的領域與個股。


    - **9. 立春天花板，春分地板**


    立春是新的一年的開始，春分則是白天和黑夜時間等長的日子，這兩個節氣從以前就被認為是非常重要的節氣。美國的市場似乎也有類似的格言。這句格言的意思是，在股票市場的行情，在
    2 月的立春會來到天花板，到了 3 月後半則會來到地板（按：


