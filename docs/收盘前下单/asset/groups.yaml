    # ## 小知識


    +   股利、股息、除權息是什麼？


    股利是公司向股東分配前一年公司營運所得之盈餘，一般來說，股利可以現金（現金股利，常稱股息）或股票（股票股利，常稱股利）的方式發放，而發放股利的時間為除權息時間，其中可再細分出除息、除權，發放現金股利稱為除息，發放股票股利則稱為除權。


