    ## chapter 4 獲利的訊號，就在 K 線裡


    ### 判讀技術線圖的基本知識


    股票投資最大的魅力在於，無論上漲或下跌都可以獲利。一般來說，大多數的人都是趁股價下跌時買股票，但如果你學會在股價漲多時放空，就能多一倍賺錢的機會。


    #### 如何看 K 線圖，以及應用


    所謂 K 線圖，就是把四種數值（開盤價、最高價、最低價，收價）畫成一根像蠟燭一般的長條圖形。因為一眼就可以輕鬆看出股價一天的變動，受許多投資人的青睞。


    如果收盤價高於開盤價就稱作紅 K 棒，如果收盤價低於開盤價就稱作黑 K 棒。最高價和最低價上下凸出來的部分就稱作上下影線。另外 K 線有很分很多種類，像日
    K 線、週 K 線、月 K 線、年 K 線等。


    ![](img/554ec54d2eecd32c8037517049342430_274_0.png)


