    \n其實真正重要的區間，是下午 2 點半到 3 點的最後 30 分鐘。對我來說，下午 2 點半到 3 點是黃金時段。一到這個時間，我一定拿起手機衝去廁所，檢視之前選定好的標的股價如何變化。如果達到交易條件，我就會下單買進或賣出，如果條件不成立，那就什麼也不做。這當中我只花了\
    \ 3 分鐘。沒錯，這就是我的一日 3 分鐘投資法的全貌。在公司，一到下午 2 點半，我一定會離席去廁所，大家大概覺得我這個人怪怪的，但我不在意，重要的是我能靠這樣增加我的資產。這個經驗讓我學到寶貴的一課，那就是學會讓資產替自己賺錢，是多麼重要的一件事。\n\
    \n**小知識**\n\n- 為什麼要在尾盤交易？\n  開盤後的前 30 分鐘為當沖客買賣時間（9:00 到 9:30），價格容易受影響，而在尾盤交易，可以大概了解產業的走向、資金整體的流動，以及個股走勢。\n\
    \  （註：此為臺版增補資料。）\n\n### 專欄 收入的型態\n\n大家對於收入的型態有概念嗎？\n\n我認為理解這個概念，對思考自己的人生來說非常重要。懂得活用這個概念和不懂得活用的人，他們未來的人生將有如天壤之別。下面我會使用現金流象限（Cashflow\
    \ Quadrant）跟大家說明。\n\n所謂的現金流象限，是美國著名投資人、實業家羅勃特·T·清崎（Robert T. Kiyosaki）在他的著作《富爸爸，窮爸爸》中所提倡的觀念，他把現金流分成四個種類。\n\
    \n一般人不是上班族就是自僱者。E（上班族）與 S（自僱者）大家比較容易理解。但 B（企業主）和 I（投資人）我想對一般人來說，概念比較模糊。自僱者指的是自己成立事業，自己經營公司。企業主的情況則不同，他會尋找優秀人才來幫忙經營公司。投資人則是指新創投資、不動產投資、金融市場投資等，打造一個能靠錢滾錢的模式來賺錢。\n\
    \n**圖表 2-1 現金流四種類**\n\n| E | B |\n| :--- | :--- |\n| **Employee**<br>**上班族** |\
    \ **Business Owner**<br>**企業主** |\n| S | I |\n| **Self-employed**<br>**自僱者** |\
    \ **Investor**<br>**投資人** |\n\n圖表 2-1 可以分左右兩側來看：E（上班族）和 S（自僱者）是靠本人的勞力獲得收入；B（企業主）和\
    \ I（投資人）則是靠資產替他們賺錢來獲得收入。股票投資就是屬於 I（投資人）。\n\n當投資人的好處就是，就算本人因為生病、意外無法工作，只要有一支手機和操作股票投資的能力，並持有投資資金，就不至於生活困頓，還能守護家人。請大家不時的把現金流象限圖放在腦海中，然後再思考自己的選擇，這可是我們活在資本主義社會中最大的特權，也是資本主義最大的魅力所在。\n\
    \n了解它的魅力，你也能找到自己的方法，運用資產賺錢。現金流象限圖告訴我們很重要的一件事：「你想要變成哪一種人？」你過去是在哪一個象限？未來想要跨入到哪一個象限？我認為這張圖可以給你一個很好的思考機會。\n"
  mdcn: "\n## 第一章 幻想一夕成功，差點走投無路！\n\n「功！」我才鼓起勇氣往前邁出第一步。從那天起，我全心投入副業，正式展開我的副業人生。\n\n\
    平日我早上 8 點起床到公司上班，工作到晚上 5 點，剩下的時間我去找了時薪 1,000 日圓的副業來做。就這樣，我每個月除了公司的薪水，還增加了 5 萬日圓的收入，光是這樣我就覺得很開心了。\n\
    \n某天，正當我想要再進一步增加收入時，又有一個機會來了。以前就聽說過億元級股票交易者山下勁老師很厲害，沒想到小林老師要把他介紹給我認識，這次的機會更是大幅改變我的人生。\n\
    \n很多人經常會把這些話掛在嘴邊：「我都遇不到好機會。」「真不走運。」確實，我們有時都會覺得自己很衰，或是為什麼那個人總可以遇到那麼好的機會等。但是，唯有歷經多次挫敗，仍不斷站起來繼續前進的人，才有辦法在機會來臨時，緊緊抓住。\n\
    \n「越能夠保持正向思考，並努力行動的人，越容易遇到好機會，運氣也比別人好。」正向思考、努力行動的人，不僅執行力比別人強，對情報的敏銳度也相對較高，更容易迅速獲得各種資訊，並從中選出自己需要的。\n\
    \n### 5 做股票，需要學習與訓練\n\n老實說，我過去一直認為股票投資就是賭博，真的能從股市勝出的人只有一小部分，其他有九成都是輸家。既然如此，身為平凡人的我，怎麼可能從股票中獲利？\n\
    \n當時，公司的主管或前輩，很多人手中都握有股票，但也沒聽說過誰賺大錢，印象中，絕大部分的人都是被套牢或虧損。因此，我從來沒想過要投資股票，但聽過山下勁老師對於股票交易的想法後，我對股票投資的價值觀與概念，有了\
    \ 180 度的轉變，也解開了我之前的偏見和誤解。\n\n我永遠忘不了他說的第一句話：「如果沒有經過學習和訓練，最好不要碰股票。但如果你好好努力的學習，絕對會為你的人生大大加分。」我之前遇到的六本木新貴都告訴我賺錢很簡單，只有他說的和其他人都不一樣。\n\
    \n聽完他說的這番話，我對股票的印象大改觀，決定要好好努力學習。其實做什麼事情都一樣，在正式上場前都要不斷訓練和練習。比方說，你很想考上某間理想的學校，在這之前，你可能要去補習、寫考古題、參加模擬考等，最後才去正式考試。運動也一樣，像箱根驛傳（按：往返於箱根的大學馬拉松接力賽），或四年一次的奧運等比賽，選手們都必須比別人加倍努力才有資格挑戰。我想表達的是，股票投資也和考試或運動一樣，在正式上場前，必須擁有扎實的訓練。\n\
    \n股票是非常大眾化的投資選項，開證券戶也不用手續費，每個人都可以輕鬆投入。但是，想從股票市場賺錢並不簡單。如果抱著想在其中輕鬆大賺一筆的輕浮心態，完全不曉得這市場中有許多競爭者，包括億元級交易者、海外投資人、避險基金等，你根本毫無勝算，而且實質資金一下子就被吃掉了。\n\
    \n為了避免發生這種慘劇，你必須先學習股票知識和訓練。我感覺很多人對股票投資有錯誤的觀念，最恐怖的是，有些人直接跳過學習過程就開始交易。\n\n如果我沒遇到股票投資（或說山下勁老師），絕對不會有現在的我。如果當時沒有鼓起勇氣往前跨出一步，現在很可能還是一位對現狀以及未來惶恐不安的上班族。\n\
    \n## 第二章 黃金交易時間，在收盤前 30 分鐘！\n\n### 1 一天只花 3 分鐘，月薪多出 50 萬日元\n\n一說到買賣股票的人，大家腦中浮現的是什麼畫面？是坐在連接好幾臺螢幕的電腦前，盯著線圖看這樣嗎？這是許多人的偏見和誤解之一。\n\
    \n電腦只要一臺就夠了，甚至只要身上的那支智慧型手機，隨時隨地都可以交易。有錢買好幾臺螢幕，不如把這些錢拿來當作投資資金。最重要的是，先確立自己的投資方法，提高執行力才是正確的作法。\n\
    \n先說結論，我的交易模式不用花很多時間，卻能累積獲利。我都是利用工作或生活的空檔時間交易，像是上廁所、喝杯茶、排隊結帳、等衣服洗好等。如果投資會影響到日常生活或本業的話，那就是本末倒置，我的投資方法，一天只要花\
    \ 3 分鐘。\n\n有些人認為自己的本業已經相當忙碌，沒有多餘時間投資股票。他們很擔心，就算一開始勉強空出時間來，等到工作繁忙時，可能就無暇顧及，沒辦法長期持續下去。因此在本書中，我會告訴大家，如何用一支手機，在一天當中，找一個空檔投資股票的方法。\n\
    \n以我來說，我在下午 2 點半，一定會處理股票事宜，這已經變成我的例行公事，我會假裝去上廁所，然後進行交易。\n\n某天，我試著把賺到的金額換算成月薪，沒想到居然能讓我賺進\
    \ 50 萬日圓。如果只是靠本業工作來賺這筆錢，一定要付出許多心力。能夠輕鬆達到這樣的成就，也是股票的魅力之一。\n\n股票投資所獲得的收入可以讓生活更寬裕些，因為這些投資不會占用你太多時間，也不會影響原本的工作，但每個月的收入卻可以多一倍。我在公司上班的時候，總是在固定時間離開座位，周遭人一定會起疑，甚至可能認為我身體不好，但我不在意，反正每天就是固定時間去廁所，花\
    \ 3 分鐘的時間按按手機交易，確實累積獲利。\n\n就這樣，一天 3 分鐘，大幅改變了我的人生。和我一樣忙碌的各位，絕對可以用這個方法賺錢，期待看過本書的讀者，從明天開始跑廁所的次數會變多喔。\n\
    \n### 2 黃金交易時間，在收盤前 30 分鐘！\n\n日本股票市場（東京市場）的交易時間為平日日本時間的早上 9 點到 11 點半（前場），與中午 12\
    \ 點半到下午 3 點（後場），各 2 個半小時，總計 5 個小時（按：臺灣的股票市場交易時間為平日早上 9 點至下午 1 點半，中間不休息）。\n\n早上\
    \ 9 點到 9 點半，開始交易的前 30 分鐘（開盤），是一天當中價格波動最大的區間。12 點半到下午 1 點的前 30 分鐘，同樣也是價格易有大波動的時候，特別是當午休時間突然發生影響股價的事件，後場開盤的波動更是劇烈。我交易的原則，就是盡量避開大波動的區間，等到股價收斂的尾盤（收盤）再下單。早上股價下跌，下午就回升，這種狀況可說是家常便飯，這也是為什麼我總是在股價收斂時交易的原因。大家可以觀察一下周遭的人，是不是有些人上班時會不時偷瞄手機，然後一下開心一下擺臭臉。\n\
    \n其實真正重要的區間，是下午 2 點半到 3 點的最後 30 分鐘。對我來說，下午 2 點半到 3 點是黃金時段。一到這個時間，我一定拿起手機衝去廁所，檢視之前選定好的標的股價如何變化。如果達到交易條件，我就會下單買進或賣出，如果條件不成立，那就什麼也不做。這當中我只花了\
    \ 3 分鐘。沒錯，這就是我的一日 3 分鐘投資法的全貌。在公司，一到下午 2 點半，我一定會離席去廁所，大家大概覺得我這個人怪怪的，但我不在意，重要的是我能靠這樣增加我的資產。這個經驗讓我學到寶貴的一課，那就是學會讓資產替自己賺錢，是多麼重要的一件事。\n\
