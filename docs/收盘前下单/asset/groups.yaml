    ## 收盤前下單，月薪多 50 萬$


    以上就是檢視股價技術線圖的基本知識。當你要判斷某檔股票的買進時機或賣出時機時，股價技術線圖非常有幫助。學會怎麼看股價技術線圖，你就可以成為股市的常勝軍。


    ## 2 線圖不用多，只要五項基本指標就夠


    下面我要介紹我所使用的技術面分析中，最重要的五項指標。這五項指標，就是我在星期一到星期五的日本時間下午 2 點半到 3 點的這段時間，衝進廁所時看的，各位讀者從明天就可以開始用，請務必多多參考。


    ### 我最在乎的五項基本指標


    - 1. 最高價與最低價（見下頁圖表 4-5）


    「從收盤價來看近期的高點與低點」，高點就是看近期紅 K 棒的收盤價，低點就是看近期黑 K 棒的收盤價。打開技術線圖來看，過前高就是上漲訊號，破前低就是下跌訊號。


    ### 圖表 4-5 最高價與最低價


    ![](img/554ec54d2eecd32c8037517049342430_286_0.png)


    - 2. 週期（見圖表 4-6）


    股價脫離不了這樣的週期：橫盤整理→上漲→下跌。當然也有例外，但原則上這樣的循環最多，這點先牢記。而橫盤整理持續 3 個月以上的話，很容易變成一個波段的多頭或空頭行情，所以當你看到橫盤整理時，就可以伺機從之後的多頭或空頭行情獲利。


    任何一檔股票都一樣，在下跌的時候非常急促，上漲的速度較為緩慢。它可能花 2、3 個月上漲，但下跌的時候就像坐雲霄飛車一樣，1 到 2 個月就跌完。


    - 3. 股價創新高（低）


    如何判斷股價來到天花板或地板，要看股價創新高


    ### 圖表 4-6 股票週期


    ![](img/554ec54d2eecd32c8037517049342430_288_0.png)


    （低）。這世界上不存在永遠上漲或永遠下跌的股票。


    每個人都想買在便宜的價位，賣在較高的價位，但哪個位置是便宜？哪個位置是較高的價位？必須有一個大致的參考點才好讓人分辨。


    接下來要跟各位介紹股價創新高（低）。


    要怎麼看？紅 K 棒的話，要找收盤價比上一根高的，黑 K 棒的話，要找收盤價比上一根低的（收盤價和前一天相同則不看）。重要的是，當股價創新高（低）的第 5
    天後，若出現相反的 K 棒（紅變黑或黑變紅），就可以判斷是要買或賣（見下頁圖表 4-7）。


    ### 圖表 4-7 5 天後，出現相反 K 棒，判斷買賣


    ![](img/554ec54d2eecd32c8037517049342430_290_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_290_1.png)


    | 紅 K 棒的收盤價 | 黑 K 棒的收盤價 |

    | :---: | :---: |

    | 在這裡 | 在這裡 |


    - 4. 移動平均線


    股價的行情有三種趨勢：上漲、下跌、橫盤。


    如果可以解讀移動平均線的關聯性，就可以順著趨勢交易。關於移動平均線，我在第三章也有談到，各位可以再複習一下短期移動平均線與中期移動平均線之間的關聯。


    ### 圖表 4-8 股價的三個趨勢


    ![](img/554ec54d2eecd32c8037517049342430_292_0.png)


    ![](img/554ec54d2eecd32c8037517049342430_293_1.png)


    上漲趨勢：短期移動平均線在中期移動平均線之上並向上傾斜。


    下跌趨勢：短期移動平均線在中期移動平均線之下並向下傾斜。


    ![](img/554ec54d2eecd32c8037517049342430_293_2.png)


    前高 前低


    ![](img/554ec54d2eecd32c8037517049342430_293_3.png)


    橫盤整理：短期移動平均線一下子往上（往下）穿過中期移動平均線，但都沒有破前高（或前低）的狀態。中期移動平均線的傾斜角度較小，呈較平緩狀態。


    - 5. 關卡


    一般來說，股價出現 500 日圓、1,000 日圓、10,000 日圓等整數就稱作整數關卡（見圖表 4-9）。


    投資人對這些關卡特別敏感。當價格遇到這個關卡時會怎麼變動？股價每遇到整數關卡，買賣就會特別活躍，大概會有這兩種情況：股價一遇到關卡就容易反彈、突破關卡，就會出現較猛的攻勢。從這兩個特性可以歸結出以下四種買賣模式（以下四個例子的前提必須都是空手狀態）。


    - 下跌時遇到股價的關卡就買（逆勢）。

    - 上漲時突破股價的關卡就買（順勢）。

    - 下跌時遇到股價的關卡就賣（順勢）。

    - 上漲時遇到股價的關卡就賣（逆勢）。


    對投資人來說，股價來到整數關卡時，就會做出以上四個判斷。交易時除了確認技術線圖的內容，也要意識到股價的整數關卡。


    以上跟大家介紹了最基本的五項指標，各位覺得如何？光是記住這五項指標並綜合運用，你的投資判斷勝率就會自然提高。以實戰來說，當指標湊齊三項以上就可以考慮買賣。但如果只有一個指標，比如「突破前高就買」，這樣勝率反而會下降，請多加小心。


    其實還有很多指標可以參考，但先理解這五個，然後再來分析技術線圖吧。一開始可能多少會覺得很難，但習慣之後就變得很簡單。活用這些基本指標的交易方法有很強的根據，可複製率非常高，只要好好學習與訓練，每個人都可以在投資判斷的基準與股票投資中，建立起容易獲利的觀念。


