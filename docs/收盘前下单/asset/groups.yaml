    ## 推薦序三 只需要一支手機、3分鐘，就能決策下單


    方法與進場出場時機，在交易中非常關鍵，只有不斷努力研究分析、檢討成果和修正策略的過程，接著加以實踐，才能夠找到好的股市投資方法，獲取穩定的投資績效。


    建議各位股市新鮮人先試著跨出一小步，在可承受範圍內嘗試開始練習，慢慢累積操作信心，相信未來成果會相當豐碩。


    ## 前言 我在馬桶上炒股，月薪多出 50 萬¥


    各位，不好意思，有件事我必須先跟大家道歉。


    我既不是軟銀集團創辦人孫正義，也不是日本 Livedoor 前總經理堀江貴文這種商業天才，更不是股神華倫·巴菲特（Warren Edward Buffett）這種等級的投資者。我只是利用每天蹲馬桶的
    3 分鐘，做了某件事的男人而已。而這短短的 3 分鐘，徹底改變了我的人生。


    我把所有的事情經過都寫進了書裡，這本書，我想獻給 3 年前的我，和拿起這本書的你。


    說實話，我當時還只是個新進員工，雖然年收 340 萬日圓（本書幣值若無特別標註，皆依 2021 年 3 月 15 日當天公告為準，1 日圓約等於新臺幣 0.26
    元），但還是相當憧憬六本木新貴（按：指住在六本木新城的富裕階層或在此工作的人士）的生活。那個時候，電視節目很常介紹，我想任誰都夢想著有 天能像他們一樣，過著財富自由的生活。


    一開始我花了 200 萬日圓，拜一位六本木新貴為師，展開網路事業。那時我簡直興奮到了極點，以為自己就要像電視劇演的那樣，只要和有名的人見面，抓住機會就可以成功賺到
    1 億日圓……但我很快就學到一件事：事情不是憨人想的那麼簡單。我抱著必死的決心投入 200 萬日圓，200 萬耶！結果……別說 1 億了，連 1 塊錢也沒賺到，事業就結束了。


    現在回想起來，雖然那是一次很好的學習經驗，但對剛出社會、對做生意一竅不通的我來說，是一次深感絕望的痛苦經歷。但我有個信念，讓我無法放棄。我們家開製訂廠，想當初爸媽背負巨額貸款，含辛茹苦的把我們三個小孩養大，實在很不容易，我一心想要回報他們。


    在父母的照顧下，我從小生活不虞匱乏。後來妹妹和弟弟出生，母親為了維持家計，還額外出去送報以貼補家用。長大後，聽到父親原本打算自殺領取保險金以還債時，更是讓我淚流不止。每當我決心挑戰某件事時，無論家裡經濟條件如何，父親總是全力支持我去做，所以我絕對不能放棄。


    大學畢業後，我的第一份工作大概只做了 1 年又 8 個月就辭職，只因為我誤信了那位六本木新貴的話。但在體驗到絕望的滋味、當了 3 個月左右的尼特族後，我就找了第二份工作。雖然是固定薪水，但就是一份死薪水，仍無法抹去我對經濟層面的不安。之後，我為了改變現狀，不斷的蒐集情報，但仍沒有頭緒，很多產品表面上看起來，似乎可以透過網路輕鬆大賺一筆，但實際上没有那麼簡單。因為以前的絕望經驗，使我變得更膽怯，即使如此我仍不放棄，四處蒐集情報。


    就這樣持續了 3 個月左右，我遇到了一本改變我人生的書，書名叫《小林老師教你，如何從年收 350 萬日圓的上班族，變成年收 1 億日圓的財富自由家》（按：小林昌裕，也是本書的監修者。26
    歲開始經營副業，2014 年年收入突破 1 億日圓）。我至今難忘當時所受到的衝擊，直覺相信這就是我的命運。


    這本書的作者年收入和我相當，給我一種親切感，讓我迫不及待的想找他聊聊！我想他既然可以出書，應該是個值得信賴的對象，所以立刻透過臉書傳訊息給他，而這正是我展開股票投資人生的第一步。這位作者不只把我當作自家人般給我許多建議，也教導我很多道理，告訴我什麼是人生中重要的事。


    「要怎麼做才會成功？」最讓我印象深刻的是，即使聽到我問這種籠統的問題，他仍願意真誠、仔細的回答我，他告訴我：「努力做好眼前的每一個任務，只要努力持續下去，每年你的人生都會發生改變。」這句話給深陷絕望深淵的我，帶來莫大的勇氣。


    他教我要先珍惜、重視自己的本業，理解為什麼必須拓展其他收入，並介紹了億元級交易者山下勁（按：20 歲至 22 歲研究股票投資法；25 歲完成獨創的技術分析投資法。至
    2016 年為止，股票投資收入已超過 1 億日圓）老師給我認識。但老實說，在此之前，我一直對於靠股票賺錢這檔事充滿懷疑……「這根本是賭博吧？」我覺得這是只有特殊天分的人才能做的事，但我心想：「我歷經那麼多挑戰，堅持下來才走到這裡，就信小林老師一次吧！」結果，這使得我對於股票投資的價值觀與想法有了
    180 度的大轉變。如果不先踏出第一步，就不會改變現狀，於是我決定一邊當上班族，一邊學習投資股票。


    當然，我對股票的知識和經驗，完全是從零開始學起，幸好山下勁老師的課簡明易懂，周遭也有許多同學做出好成績，帶給我很大的刺激。


    上了 6 個月的課之後，我從日本瑞穗銀行提了 50 萬日圓出來，開了人生第一個證券帳戶，戰戰兢兢的進場買賣交易。沒想到我只花了 1 年 6 個月的時間，就把
    50 萬日圓翻了 6 倍，甚至曾在某個月賺到 50 萬日圓。這是 6 個月前、身為平凡上班族的我無法想像的世界，畢竟以一般上班族的薪水來說，要賺到這筆數目可不容易。


    世界上玩股票的人多如牛毛，但山下勁老師的交易方式，對把投資當副業的上班族來說再適合不過了。他的方法，不用你整天黏在電腦或螢幕前，而是一天只要花幾分鐘交易即可。你不用一整天盯著電腦螢幕擔心股價的漲跌，也不用一天到晚買進賣出。


    我靠每天上廁所的時間買賣股票，漸漸的，我變成了一名「廁所投資達人」。


    我一天只檢視一次股價。我會在接近日本股票市場的收盤時間，也就是日本時間下午 2 點半到 3 點之間（按：若無放假，臺灣的股票市場交易時間為星期一至星期五早上
    9 點至下午 1 點半），判斷要買進還是賣出，過程只需要 3 分鐘，剛好可以趕上廁所的時間買賣。其實也就是拿起智慧型手機點一點。


    有一點要特別交代清楚，我並不是因為特別有天分所以才賺到錢，我也是從小白開始，一點一滴持續學習，而且這種交易方式並不會花你太多時間。我認為每個人都可以做到，只要學會，一定能成為一輩子的財產和技能。


    我希望和我有相同境遇的人，或希望家人過得幸福的人，一定要讀本書。我也希望本書能為那些完全沒有股票投資經驗的人帶來勇氣。市面上多的是解釋專有名詞和講解技巧的書，但老實說，光了解這些東西，很難在股票市場賺錢。因此，我希望你在讀本書時，不僅是技巧，還要從思考層面，理解這套股票交易竅門，讓你除了本業的收入，還可以多出數十萬日圓的額外收入。


    靠股票賺來的錢，是你額外增加的收入，你可以拿去慰勞辛苦把你養大、從未出過國的雙親，帶他們出國去玩，也可以帶老婆去吃一頓高級晚餐，連小孩去補習英文或鋼琴的學費也都有著落。


    增加收入來源，不只能讓你走向財富自由，連精神上也能獲得自由，對於想要守護身邊重要的人來說，這是至關重要的事情。先試著踏出一小步，這一小步會為你日後帶來豐碩的成果，成為你自信心的來源。


    我是一個沒有才能、沒有人脈的平凡人，希望大家看完我如何抓住成功機會的過程，可以變得更有信心。我相信只要方向正確，做出對的努力，任何人都能成功。


