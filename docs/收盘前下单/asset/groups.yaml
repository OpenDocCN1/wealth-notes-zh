    \ 年 3 月 30 日。\n資料來源：Goodinfo! 台灣股市資訊網。\n\n---\n\n## 在公司發表財報前，我會先賣掉股票\n\n投資股票要賺錢，最重要的當然是買好公司的股票。那要怎麼看出哪間公司是好公司？如果你想到的是檢視公司業績，請快點拋棄這個想法。為什麼？因為就算公司的財報表現很亮眼，股價也不一定會上漲。\n\
    \n各家企業發表的財報，可以說是一間公司經營狀況的總覽。財報會詳細列出公司的財務狀況，包括為了經營必要的支出、從經營中獲得的利潤、其他的損失等，你可以把它想成是一間公司的健康檢查報告。\n\
    \n財報有很多種類型，根據公布的時間點不同而有所區分：\n\n- **年度財報**\n\n年度財報 1 年發表 1 次。每家公司的財報發表月份不盡相同，唯有銀行等金融機構統一\
    \ 3 月為年度財報月份（按：臺灣的年度財務報告，則於每會計年度終了後 3 個月內 [3/31 前] 公布）。\n\n- **季報**\n\n季報 1 年有\
    \ 4 次，為每 3 個月發表一次的財報。若一間公司的年度財報為 3 月，那麼 4 到 6 月就是第一季財報，7 到 9 月是第二季財報，10 到 12 月是第三季財報，1\
    \ 到 3 月是第四季財報。\n\n重要的是，我們無法預測當公司發表完財報後，股價會往上或往下，所以在財報發表日的 2 到 3 天前，即使虧損，也要把手上持有的股票清空。在財報公布期間持有股票，和賭博沒什麼兩樣。\n\
    \n下面，我以軟銀集團（9984）為例解說（2019 年 11 月與 2020 年 2 月）。\n\n根據軟銀集團發表的 2019 年 7 月到 9 月的合併財報，他們的最終損益是虧損\
    \ 7,001 億日圓（去年同期是獲利 5,264 億日圓），創下該公司季報睽違 15 年的虧損，同時也是歷史最高的一次虧損。\n\n創下如此巨大虧損的主因是投資虧損。包括軟銀投資的美國公司\
    \ The We Company 旗下供應共享工作空間「WeWork」虧損，導致企業價值降低。除此之外，他們旗下投資提供叫車服務的美國優步公司（Uber Technologies）的投資公司股價也不斷滑落。據統計，近年軟銀不斷擴大的投資事業，已造成高達\
    \ 9,702 億日圓的巨額虧損。\n\n該公司做出以上發表後，外界評估軟銀集團的股價應該會下跌。但事實上，它的股價不跌反漲。所以說，不是財報難看，股價就一定會下跌。\n\
    \n又，在 2020 年 2 月的發表中，2019 年 10 月到 12 月的合併財報（國際會計基準）中，盈餘為 550 億日圓，較去年同期減少 92%；作為主力的基金事業的經營損益為虧損，再加上經營共享辦公室的美國公司\
    \ The We Company 的損失，最終創下 7,000 億日圓的虧損。\n\n同日還發表了 4 到 10 月的報告，顯示合併盈餘大減 69%，來到\
    \ 4,765 億日圓。外界預期它的股價將大幅滑落，結果卻相反，財報發表的隔天，股價比前一天還大漲 10% 以上。\n\n### 圖表 3-5 軟銀集團股市財報發表日的股價變動\n\
    \n![](img/554ec54d2eecd32c8037517049342430_200_0.png)\n![](img/554ec54d2eecd32c8037517049342430_204_0.png)\n\
    ![](img/554ec54d2eecd32c8037517049342430_205_0.png)\n\n### 小知識\n\n- **臺灣年度財報公布時間**\n\
    \  - 一般上市櫃公司財報公布時間：\n    - 月營收：每月 10 日以前公布。\n    - 上年度整年財報：3/31 前。\n    - 第一季（Q1）財報：5/15\
    \ 前。\n    - 第二季（Q2）財報：8/14 前。\n    - 第三季（Q3）財報：11/14 前。\n    - 第四季（Q4）財報及年報：隔年\
    \ 3/31 前。\n\n> 註：此為臺版增補資料。\n"
