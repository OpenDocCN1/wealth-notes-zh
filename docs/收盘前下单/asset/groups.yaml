    # # 2

    # 我不投資市值少於5,000 億的公司


    股票交易可分為兩種：國內股票交易，以及海外股票交易。


    初學者應先從國內股票交易開始。國內的股票，很多都是我們平常生活中聽得到的大公司，你可以透過網路、電視、報紙、雜誌蒐集到許多情報（臺灣也可從報紙、雜誌、網路平臺來蒐集相關資訊）。


    在證券公司買得到的股票，就是所謂的上市、上櫃公司，大家下的單子會集中在這裡進行買賣。所謂上市，就是指獲得證券交易所認可、可以進行買賣的商品。日本全國有四間可以申請上市的證券交易所，分別是東京、名古屋、福岡、札幌（按：臺灣可於臺灣證券交易所申請上市）。'
  md: "\n## 收盤前下單，月薪多 50 萬日圓\n\n股票的圖表出現進場訊號，我就會衝去廁所下單，久而久之而成了一種習慣。每次的交易我都會依照條件進場出場，獲利了結，就這樣一點一滴累積我的資產。每次獲利雖然都不多，但積少成多累積下來，就成功達到月收\
    \ 50 萬日圓的成績。\n\n以平常上班來說，一個月要賺 50 萬日圓並非易事。月收 50 萬日圓，以一般企業來說，大概要是課長或部長等級，對於當時一個月薪水只有二十多萬日圓的我來說，本業以外還有這樣的收入，實在非常可觀。\n\
    \n### 小知識\n\n- 股市上漲稱多頭。\n- 股市下跌稱空頭。\n- 十年來股市都是上漲的稱大多頭。\n\n### 臺灣交易手續費\n\n| 交易成本\
