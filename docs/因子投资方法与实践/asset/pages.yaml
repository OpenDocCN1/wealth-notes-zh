  md: '不是一个好的估计量。


    式（2.56）右侧表达式中除第一项1/T之外，剩余部分可以看成是三个矩阵相乘的形式，其中第一个和第三个仅和解释变量X有关，因此修正自相关和异方差的核心就是正确地估计式（2.56）中的中间矩阵。为了方便讨论，令Q代表中间的矩阵：


    ```

    $$Q \equiv \frac{1}{T} X'' [\sigma^2 \boldsymbol{\Gamma}] X = \frac{1}{T} \sum_{i=1}^{T}
    \sum_{j=1}^{T} \sigma_{ij} \boldsymbol{x}_i \boldsymbol{x}_j'' \tag{2.58}$$

    ```


    式中 $x_i = [x_{i1}, x_{i2}, \cdots, x_{iK+1}]''$, 即$X$的第$i$行的转置（注意它不等于$X$的第$i$列）。一旦能找到在考虑了自相关和/或异方差之后的矩阵$Q$的估计量，便可通过它进而求出
    $\hat{b}$ 的协方差矩阵的估计量 $\hat{V}_{OLS}$。在这方面，最著名的两个估计量当属White（1980）估计量（仅考虑异方差）以及Newey
    and West（1987）估计量（同时考虑异方差及自相关）。


    # 2.4.3 White估计量和Newey–West估计量


    为了估计$Q$，需要用到的“武器”恰恰就是解释变量矩阵$X$，以及回归的样本残差向量 $\hat{\varepsilon} = [\hat{\varepsilon}_1,
    \hat{\varepsilon}_2, \cdots, \hat{\varepsilon}_T]''$。当$\varepsilon$仅有异方差但没有自相关时，$Q$则简化为仅考虑对角线上的元素：


    ```

    $$Q = \frac{1}{T} \sum_{i=1}^{T} \sigma_i^2 \boldsymbol{x}_i \boldsymbol{x}_i''
    \tag{2.59}$$

    ```


    White（1980）指出使用$X$以及$\hat{\varepsilon}$便可求出$Q$的渐进估计（记为$S_0$)：


    ```

    $$S_0 = \frac{1}{T} \sum_{i=1}^{T} \hat{\varepsilon}_i^2 \boldsymbol{x}_i \boldsymbol{x}_i''
    \tag{2.60}$$

    ```


    将$S_0$代入式（2.56）便得到$\hat{b}$的协方差矩阵的估计量：


    ```

    $$\hat{V}_{OLS} = \frac{1}{T} \left(\frac{1}{T} X'' X\right)^{-1} \left(\frac{1}{T}
    \sum_{i=1}^{T} \hat{\varepsilon}_i^2 \boldsymbol{x}_i \boldsymbol{x}_i''\right)
    \left(\frac{1}{T} X'' X\right)^{-1} \tag{2.61}$$ $$= T (X'' X)^{-1} S_0 (X'' X)^{-1}$$

    ```


    式（2.61）被称为White异方差相合估计量。该结果的优势在于，哪怕人们对异方差的取值或结构一无所知，仍然可以根据OLS的结果进行适当的推断。考虑到实际问题，在资产收益率中无法被多因子模型解释的随机扰动部分的异方差性质未知，上述性质就显得格外重要。在检验异象时，除了异方差外，通常仍需考虑$\varepsilon$的自相关性。为此，一个自然的想法是将上述$Q$的估计延伸到对角线之外的元'
