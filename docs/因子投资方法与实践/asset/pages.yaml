    从价值因子角度来看，2016年销售额和盈利的激增让BIG5非常诱人，但当人们通过基本面分析得知这背后的原因后就会明白，这么高的财务数据是难以持续的。如果以它们来外推，则根本无法对该公司基本面的变化做出正确判断。事实上，该公司自2016年Q2直到2017年Q4，EPS几乎呈现单调下降走势，盈利能力下降得十分明显。


