    \ -3 | 1 | 2 |\n|  | -3 | -3 | -2 | 4 |\n| $E_T[u_t]$ | 0.4 | -0.8 | 0.6 | 1.6\
    \ |\n\n既然样本均值本身也是一个随机变量，那么一个很自然的问题就是样本均值在不同的样本中是如何变化的，即求解样本均值的方差。从方差的定义出发有：\n\n\
    $$\\mathrm{var}(\bar{u}) = \\mathrm{var}\\left(\\frac{1}{T}\\sum_{t=1}^{T}u_t\r\
    ight) = \\frac{1}{T^2}\\mathrm{var}\\left(\\sum_{t=1}^{T}u_t\right) \\tag{2.100}$$\n\
    \n式中$T$为样本量。在最简单的情形中，假设$u_t$序列满足独立同分布，则式（2.100）可以简化成：\n\n$$\\mathrm{var}(\bar{u})\
    \ = \\frac{1}{T^2}\\mathrm{var}\\left(\\sum_{t=1}^{T}u_t\right) = \\frac{\\sigma^2(u_t)}{T}\
    \ \\tag{2.101}$$\n\n将式（2.101）两边开方就得到样本均值的标准误：\n\n$$\\mathrm{s.e.}(\bar{u}) = \\\
