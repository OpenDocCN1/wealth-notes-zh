- pgno: 375
  md: '牛熊”。然而，最近几年投资者都能从全球市场上明显感受到，无论不同的大类资产，还是更底层的一些因子，它们的相关性——尤其是下行时的相关性——变得越来越高。每当发生冲击全球经济的黑天鹅事件时，就很难有资产或因子能够“独善其身”，而普遍会出现大跌。由于大跌代表着收益率分布的左尾，因此同时大跌也被称为尾部相关性陡然上升。全球市场颇为艰难的2020年就是很好的例子。


    面对这种情况，一个自然的想法就是如何抵御因子尾部相关性上升对投资组合的伤害，即如何抵御因子的尾部风险。针对这个问题，贝莱德（BlackRock）提出了防御性因子择时（defensive
    factor timing）的理念（Fergis et al.2019）。防御性因子择时的目的是降低风险。与传统的为了预测收益率而进行的择时不同，防御性因子择时关注的是因子的协方差矩阵，即风险。它是一个低频事件，其唯一的目的就是规避巨大的市场风险，降低黑天鹅事件对投资组合的冲击。


    一般来说，极端市场风险可能来自以下三个方面：（1）市场风险偏好的骤降；（2）不同因子之间的相关性激增，从而无法实现预期的分散化；（3）某些因子变得极度昂贵。为此，需要通过一定的量化手段来监测并鉴别上述三种情况是否发生。一旦出现一种或多种情况，便通过降低仓位来有效地保护投资组合免受极端事件的冲击。由于前两种风险对于防御性因子择时的重要性远超过因子估值本身，以下对它们进行简要介绍。


    首先来看看市场风险偏好骤降。通常来说，高风险意味着高收益。因此，可以使用因子收益率和波动率的秩相关系数来定量计算风险容忍指标（risktolerance indicator，RTI）。使用秩相关系数背后的依据是市场风险偏好的高低可以由不同资产的收益率和它的风险水平的一致程度所反应。当风险偏好高时，高风险资产应该比低风险资产有更高的收益率；当风险偏好低时，高风险资产应比低风险资产有更大的跌幅。秩相关系数的优势是考察收益率和波动率的单调相关性，而不假设变量之间的线性或非线性关系。令
    q（R）和 q（σ）分别代表不同因子收益率和波动率的排序序列，则RTI的定义为：


    ```

    RTI=corr（q（R）,q（σ））      （7.110）

    ```


    由式（7.110）可知RTI的取值范围是-1到1之间，其值越大说明风险偏好越高，越小说明风险偏好越低。对RTI指标的实证结果显示，其在2008年全球金融危机以及2010年和2012年欧洲主权债务危机时都给出了明确的警示信号。


    接下来看看如何监测因子相关性激增风险。为此，可采用多样化比例（diversification ratio，DR）指标，它是各因子自身波动率按其权重的加权与投资组合波动率之比：


    ```

    DR = Σ w_i σ_i / σ_p     （7.111）

    ```


    DR的值越大说明因子之间的相关性越小，越能够分散风险；越小则意味着因子之间的相关性越大。


    使用DR、以（7.110）定义的RTI，以及因子估值，防御性因子择时在最近十年的几次全球性金融危机中都保护了投资组合。举例来说，从2012年第二季度开'
  merge: -1
