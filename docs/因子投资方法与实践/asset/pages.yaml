    # 2.5.4 α检验


    前文介绍的GRS检验和均值一方差张成检验均是联合检验N个资产的定价误差是否显著偏离零。与它们不同，本节的α检验把每个资产i的αi独立看待，检验其是否为零。在得到所有αi的检验结果后，将它们取平均并以此评价多因子模型。


    α检验实操起来非常简单。对每个用来检验多因子模型的资产（可以是测试资产或其他模型的因子），将其超额收益作为被解释变量，使用待检验的多因子模型作为解释变量，进行时序回归，估计其定价误差
    α̂i 以及 α̂i 的标准误（计算标准误时通常会采用Newey-West调整）。有了 α̂i 和它的标准误，计算 t-值= α̂i / s.e.(α̂i)。在原假设下，多因子模型可以解释这些资产，因此
    αi=0。在得到全部N个资产的 α̂i 和 t-值之后，将它们的绝对值取平均作为评价多因子模型的依据。取绝对值的原因是，此处只关心定价误差相对于0的偏离程度，而非其方向。因此，α检验关注的两个评价指标就是
    |α̂i| 的均值以及 |t-值| 的均值。


    α检验在多因子模型的比较中应用非常广泛。最常见的做法是使用同一组测试资产来检验不同的多因子模型，并以上述指标偏离零的程度来评价多因子模型的“好”与“差”。这两个指标越低，说明一个多因子模型越能够解释这些资产，因而是“更好”的模型。在实证资产定价研究中，应用α检验来比较模型的例子数不胜数，Hou
    et al.（2015）和Fama and French（2020）就是其中的代表。最后值得一提的是，α检验经常和GRS检验同时使用。在本书第4章介绍多因子模型时，也将同时使用这两种检验方法进行实证分析。


