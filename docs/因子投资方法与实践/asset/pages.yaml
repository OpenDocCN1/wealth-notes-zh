    图6.4 累积前景理论中的价值函数和权重函数


    对于累积前景理论中的权重函数πi，有以下两点需要说明。首先，它延续了前景理论中权重函数的最重要定性特征，即对于小概率结果，其权重要高于结果发生的概率本身。由于累积前景理论允许盈利和亏损两端均包括多个结果，这意味着人们会高估结果分布左尾或右尾出现的概率。由定义可知，对于极端收益结果xn和极端亏损结果x-m，它们的权重为w+（pn）和w-（p-m）。假设γ=δ=0.65，并假设极端结果xn和x-m出现的概率均为0.01。由公式可知，w+（pn）=w-（p-m）=0.047，因此w+（pn）>pn且w-（p-m）>p-m。关于πi，第二点需要指出的是，如果一个选项的结果都是盈利（即所有xi均大于零）或都是亏损（即所有xi均小于零），则由式（6.16）可知该选项所有结果的权重函数之和满足∑πi=1。然而，对于更一般的情况，即某个选项既有盈利结果又有亏损结果时，所有结果的权重之和∑πi并不一定等于1，它可能大于1也可能小于1，但这并不影响累积前景理论的性质或应用。


    # 2. 模糊厌恶


    风险偏好偏差的第二个要素是模糊厌恶（ambiguity aversion）。考虑下面这个实验。有两个罐子，每个罐子里放有红色和蓝色小球一共100个。这两个罐子的区别是，在罐子1中有红色和蓝色小球的数目均是未知的；而在罐子2中有红色和蓝色小球各50个。被试者首先被要求从下面两个选项中选择：


    +   A1：从罐子1中抽取一个小球，如果抽出红色小球则获得100元，如果抽出蓝色小球则没有奖励；


    +   A2：从罐子2中抽取一个小球，如果抽出红色小球则获得100元，如果抽出蓝色小球则没有奖励。


    这两个选项唯一的区别是抽小球的罐子。


    在第二个实验中，被试者被要求从以下两个选项中选择：


    +   B1：从罐子1中抽取一个小球，如果抽出蓝色小球则获得100元，如果抽出红色小球则没有奖励；'
