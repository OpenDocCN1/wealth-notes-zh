  md: '这些都是非常引起关注的问题。


    Frazzini et al.（2018）针对上述问题进行了富有成效的工作。该文基于1976年至2011年间伯克希尔哈撒韦公司的股价及投资组合的数据对巴菲特的业绩进行了详细的风格分析，并有以下几点重要发现。首先，在此期间巴菲特获得了19.0%的年化收益和0.76的年化夏普比率，业绩优异且有持续性。与此同时，巴菲特的相对业绩也非常优异。巴菲特的业绩优于任何一支存续时间达到30年的股票或共同基金。而即便同1976年至2011年间存在过的任何股票或公募基金相比，巴菲特的业绩也是非常顶尖的。其次，常见的多因子模型并不能解释巴菲特的优异表现。例如，在使用Carhart四因子模型进行风格分析时，巴菲特的投资组合仍可获取高达12.1%的年化超额收益（t-值为3.19，高度显著）。


    之所以出现上述结果是因为在常见的多因子模型中并无针对上市公司的质量高低而构建的质量因子，导致已有因子无法很好地反映巴菲特的选股风格。为了更好地分析巴菲特的选股风格，Frazzini
    et al.（2018）在Carhart四因子模型中加入了Asness et al.（2019）提出的质量（quality minus junk，QMJ）因子和Frazzini
    and Pedersen（2014）提出的代表低风险的低β（betting against beta，BAB）因子。当使用这6个因子对巴菲特的收益率进行风格归因后，其组合的α消失了。在这个基础上，该文基于对巴菲特组合的风格分析，构建了一个仿巴菲特风格组合——即有着与巴菲特的投资组合相同的风格暴露和波动率的假想组合。该仿巴菲特组合甚至有着比巴菲特更为优异的表现①。风格分析结果显示，质量因子和低β因子的加入能够更有效地体现巴菲特的投资风格，因此可以说传统意义上的买入便宜股的价值投资并非巴菲特的标签，而高质量投资才更能代表他的风格。需要强调的是，上述事后风格分析并不代表巴菲特不厉害。恰恰相反，他在数十年前便构建起了极为卓越的投资风格，并通过对杠杆的极致利用持续获得了优异的回报，是真正样本外的奇迹。


    除了上述关于巴菲特的例子，Hou et al.（2019a）一文使用Hou-Xue-Zhang四因子模型（也被称为q-因子模型）和Hou et al.（2020）提出的增强版q-因子模型（简称q⁵模型①）对一些经典的价值投资策略（表7.26）进行了风格分析。


    # 表7.26 Hou et al.（2019a）进行风格分析的价值投资策略


    | 策略 | 出处 |

    |---|---|

    | 内在价值策略 | Frankel and Lee (1998) |

    | F-Score | Piotroski (2000) |

    | 神奇公式 | Greenblatt(2006, 2010) |

    | 质量因子 | Asness et al. (2019) |

    | 无先验的基本面分析① | Bartram and Grinblatt (2018) |

    | 期望收益策略 | Penman and Zhu (2014, 2019) |


    ①该策略的英文原名为agnostic fundamental analysis，简称AFA，直译为“不可知论的基本面分析”。其中agnostic一词的中文意思为“不可知论的”，在此代表真实的基本面价值是不可知的。其意为不假设任何金融学知识，仅是从统计学的角度衡量公司的基本面价值。


    其中，内在价值策略依据历史数据或分析师通过预测来估计公司的内在价值，并买入那些内在价值相对于股价较高（从而被低估）的公司。F-Score（见5.1.2节）是一个综合性因子，从盈利能力、资本结构和运营效率三个方面对公司'
