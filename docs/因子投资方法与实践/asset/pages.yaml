- pgno: 246
  md: '# 图6.3 前景理论中的价值函数和权重函数


    从图6.3（a）的价值函数形态可以总结出ν（.）的三个重要性质：


    +   - 结果x是相对一个给定的参考点而言的，而非财富的最终水平。举个例子，某人现在有1000元；某个游戏有两个结果。第一个结果将使他的最终财富变为1100元，第二個结果会让他的最终财富变为950元。在他评估这个选项时，他不会使用1100和950作为结果，而是使用1100和950相对于1000元这个参考点的差异，即100和-50为结果。在前景理论中，x>0的结果被称为盈利（gains）、x<0的结果被称为亏损（losses）。


    +   - 价值函数的第二个特点是它反映了人们损失厌恶（loss aversion）。价值函数ν（.）在x=0左、右两侧并不对称，亏损部分的负增长快于收益部分的正增长：ν（x）<-ν（-x）。实证研究表明，亏损带来的痛苦是收益带来快乐的两倍左右。


    +   - 无论是获利还是亏损，价值函数均呈现出敏感度递减（diminishing sensitivity）。这意味着，当结果为获利时，价值函数为凹函数；当结果为亏损时，价值函数为凸函数。举个例子，假如盈利从100元提高到200元，以及从1000元提升到1100元，二者都是提高了100，但前者对人的边际价值要强于后者。又或者，亏损从100元变成200元，以及从亏损1100到1200元，两者都是多失去100元，但前者对人的边际价值高于后者。


    前景理论中的第二个关键是权重函数π（.）。权重函数π（p）是某结果发生的真实概率p的函数，但它不是概率。它衡量的是该结果对选项的影响，而非仅仅是该结果发生的可能性。Kahneman
    and Tversky（1979）指出π（p）应满足π（0）=0且π（1）=1，但是当0<p<1时，π（p）是p的非线性函数。图6.3（b）定性给出了当0<p<1时π（p）的样子。从图6.3（b）中不难看出，当p很小时，π（p）>p，这表明对于那些发生概率很低的结果，人们往往高估它们发生的可能性。在生活中人们购买彩票和购买保险就是这样的例子。假设一张彩票5元钱，买了彩票后有千分之一的机会得到5000元。人们往往会放大这个千分之一的可能性，从而认为彩票的吸引力很高，尽管彩票的预期收益也是5元钱，和成本一样。而在买保险时，假如5元保费可以规避一个损失5000元、发生概率为千分之一的事故。在面对这种情况时，人们往往毫不犹豫选择购买保险，因为他们同样高估了事故发生的概率。


    Kahneman and Tversky（1979）提出的前景理论后来被视作行为金融学发展的重要基石之一。然而，这篇1979年发表的论文也并不完美。第一，如前所述，它只允许待评估的选项有不超过两个非零的结果；第二，无论是价值函数还是权重函数，Kahneman
    and Tversky（1979）给出的都是定性，而非定量的结果。为了解决这些不完美，Tversky and Kahneman（1992）对前景理论进行了必要的改良和补充，提出了累积前景理论（cumulative
