    \n这本书的主标题是Alphanomics一词，中文翻译为“阿尔法经济学”。这个词的前半部分是Alpha（阿尔法），代表着市场中的超额收益α，而后半部分Nomics则指的是获取超额收益背后的经济学，它囊括了信息套利背后涉及的成本和动机。全书共分为6章，分别阐述了市场非有效性、噪声交易者、投资者情绪、基本面分析、套利成本以及异象研究方法几个方面，从信息套利的角度对市场的非有效性以及如何利用这种非有效性获取超额收益进行了深入的剖析和解读，涵盖了学术界关于市场有效性、行为金融学及基本面分析的大量研究。对于想要通过行为金融学挖掘并利用市场的非有效性、构建投资策略战胜市场的读者来说，这本书不容错过。\n\
