  md: '个X₂排名最低的组，即P_{i1}（i=1,2,⋯,L₁），分别取并集：


    P_{L₂}^{top} = P_{1L₂} ∪ P_{2L₂} ∪ ⋯ ∪ P_{L₁L₂} （2.9）


    P_{L₂}^{bottom} = P_{11} ∪ P_{21} ∪ ⋯ ∪ P_{L₁1} （2.10）


    将P_{L₂}^{top}中的全部股票按照市值加权或等权重配置，构成变量X₂的多头；将P_{L₂}^{bottom}中的全部股票按同样的加权方式配置，构成变量X₂的空头。在每一期t，多头组合收益率（记为R_{L₂}^{top}）减去空头组合收益率（记为R_{L₂}^{bottom}），就是在这种方法下围绕变量X₂构建的因子的收益率：


    λ_{X₂t} = R_{L₂}^{top} − R_{L₂}^{bottom} （2.11）


    这两种计算X₂（即第二排序变量）因子收益率的方法虽略有不同，但仔细比较它们不难发现，当每个投资组合中的股票都按照等权重配置时，式（2.6）和式（2.11）则是完全等价的。只有当每个投资组合采用非等权重（比如市值加权）时，这两种方法才略有差异。假设每个投资组合内股票按市值加权配置，当使用式（2.6）时，它多、空两头各自的L₁个投资组合仍然按照等权重配置；而当使用式（2.11）时，它首先把所有属于多头和空头的股票都挑出来，然后再按照市值加权配置。


    最后值得一提的是，条件双重排序的规则保证了每组内都有足够多的股票。在本节的例子中L₁=L₂=5，如果假设这5组是按照排序变量的五分位数划分的，那么条件双重排序得到的25个投资组合中有相同数量的股票。在更一般的情况中，两个变量划分的组数可以不同，且每个变量用来划分的分位数也可能有差异，在这时不同组内的个股数量会有差异，但仍然能够保证有足够多的股票。


    # 2. 两点说明


    关于双重排序，还有两点补充说明。第一点说明，使用双重排序的目的是排除两个变量之间的相互影响，从而更准确地计算围绕每个变量构建的因子模拟投资组合的收益率。在这方面，条件双重排序比独立双重排序是更好的选择，因为它是在控制了第一个分类变量后、考察第二个分类变量和股票收益率的条件关系。然而，学术界在研究因子时，往往更习惯使用独立双重排序。这可能与最初经典的Fama
    and French（1993）三因子模型使用了独立排序有关。另外，当研究异象时，为了排除小市值的影响，使用市值和异象变量进行条件双重排序、构建异象投资组合并计算其超额收益也并不罕见。而在这些研究中，两种计算收益率的方法均有使用。举例来说，Bali
    et al.（2014）在研究尾部风险异象时采用式（2.6）计算异象收益率；而Liu et al.（2019）则使用式（2.11）研究并计算了一系列异象投资组合的收益率。


    第二点说明是关于双重排序时两个变量划分的分组数。当学术界研究异象时，当股票池中的股票数量很大时，5×5或10×10都是常见的分组方式。但是当学术界研究因子时，往往采用2×3的划分，且变量之一是股票的市值。这种处理方法也和Fama
    and French（1993）三因子模型不无关系。由于该文是多因子模型的开'
