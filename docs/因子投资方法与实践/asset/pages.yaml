  md: '| 中文名 | 英文名 | 代表文献 | 和预期收益率的关系 |

    |---|---|---|---|

    | 股票净发行量 | Net Stock Issues | Fama and French (2008) | 负相关 |

    | 复合股权发行量 | Composite Equity Issues | Daniel and Titman (2006) | 负相关 |

    | 应计利润 | Accruals | Sloan (1996) | 负相关 |

    | 净营业资产 | Net Operating Assets | Hirshleifer et al. (2004) | 负相关 |

    | 总资产增长率 | Asset Growth | Cooper et al. (2008) | 负相关 |

    | 投资与总资产之比 | Investment to Assets | Titman et al. (2004) | 负相关 |

    | 财务困境 | Distress | Campbell et al. (2008) | 负相关 |

    | O-分数 | O-Score | Ohlson (1980) | 负相关 |

    | 动量 | Momentum | Jegadeesh and Titman (1993) | 正相关 |

    | 毛利润 | Gross Profitability | Novy-Marx (2013) | 正相关 |

    | 总资产回报率 | Return on Assets | Chen et al. (2010) | 正相关 |


    下面就来看看到底如何构建这两个因子。在每月末，对于这两组中的每一个异象，使用异象变量在截面上对股票排序。排序时，从每个异象指标和未来预期收益率的相关性方向（即正、负相关）出发，将被高估的股票排在前面、被低估的股票排在后面。具体来说，如果异象变量和收益率呈负相关（比如应计利润），则按变量取值从高到低排序，取值最高的排第一、第二高的排第二，以此类推，取值最低的排最后。反之，如果异象变量和收益率呈正相关（比如动量），则按变量取值从低到高排序，取值最低的排第一、第二低的排第二，以此类推，取值最高的排最后。在使用全部11个异象变量对股票排序后，每只股票就有11个分数，分别把管理和表现两组内的六个和五个异象排名取平均，就得到每只股票在两组内各自的综合排名。综合排名越高，说明该股票价格越可能被高估，其未来预期收益越低；综合排名越低，说明该股票价格越可能被低估，其未来预期收益越高。此外，Stambaugh
    and Yuan（2017）进一步解释说，之所以采用多个排名取平均，是为了消除单一异象变量的噪声，更准确地衡量每只股票错误定价的大小。


    有了股票在管理 and 表现这两个变量上的排名，接下来使用市值和这两个变量依次进行2×3双重排序，构建管理、表现及市值三个因子。然而，Stambaugh and
    Yuan（2017）的做法和学术界的传统做法又有不少差异。在使用市值排序时，该模型和其他多因子模型一致，使用纽交所包含股票的市值中位数将所有股票分为大市值、小市值两组。然而，对于管理和表现这两个变量则是将三大交易所的股票混合在一起，使用所有股票在这两个变量上各自的20%和80%分位数划分成高、中、低三组。这种做法和其他多因子模型的处理有两点不同：（1）划分的断点没有使用纽交所股票的分位数，而是使用全部股票的分位数；（2）划分阈值没有采取传统的30%和70%分位数而是“另辟蹊径”，采用了20%和80%的分位数。


    Stambaugh and Yuan（2017）对此并无太多解释。然而，Hou et al.（2019b）对此提出了质疑。该文复现了上述方法并同时按照传统的纽交所30%和70%分位数的方法构造了管理因子和表现因子。结果发现，这两个错误定价因子对双重排序的构造方式十分敏感。构建管理因子和表现因子的双重排序如图4.4所示。'
