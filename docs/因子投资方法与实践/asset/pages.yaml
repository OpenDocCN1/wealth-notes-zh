- pgno: 202
  md: '当使用等权重构建组合时，无论采用哪个定价模型，预期差组合均能获得显著的超额收益。该组合的CAPM-α为1.44%（t-值5.88）、Fama-French三因子-α为1.09%（t-值5.25）、而Liu-Shi-Lian四因子-α为0.68%（t-值3.89）。随着定价模型中因子个数的增加，超额收益逐渐减小但持续显著。当采用市值加权时，预期差组合依然能够获得显著的CAPM-α以及Fama-French三因子-α，但是其Liu-Shi-Lian四因子-α不再显著（t-值1.88）。而非预期差组合则展现出了完全不同的结果。该组合的CAPM-α并不显著，几乎为零。然而，当使用其他定价模型时，无论是等权重还是市值加权，该组合的超额收益都显著为负。综合上述结果可知，利用因市场预期和基本面预期的匹配不当导致的预期差可以获得显著的超额收益。


    # Panel A: 等权重多空组合


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_202_0.png)


    # Panel B: 市值加权多空组合


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_202_1.png)


    图5.7 预期差、非预期差以及单BM排序投资组合累计收益率曲线


    在Piotroski and So（2012）这篇文章中，除了预期差能带来超额收益这个假设外，两位作者还用数据证实了另一个猜想，即存在预期差的股票在未来业绩公告期内有更显著的收益（正或负），分析师在这些股票上的预测误差更大，对它们的预期修正也更大。这都表明预期差是由投资者的反应不到位造成的——对于价值股，即便它们的基本面优秀，投资者也过度悲观；对于热门成长股，哪怕它们的基本面很差，投资者也过度乐观。


    最后需要指出的是，在本节实证中使用了F-Score是为了尽量在A股中复现Piotroski and So（2012）的发现。在实际中，该模型也未必就是最适合A股的模型，如何更好地衡量股票的内在价值也是见仁见智。但无论如何，定量、科学地衡量基本面价值，找到预期差，获取超额收益都是值得努力的方向。


    [1]在某些特殊的情况下，一些价格乘数的取值为负，无法正常衡量公司估值，因此文中结论对这些公司并不适用。


    [2]巴菲特的原句是“It’s far better to buy a wonderful company at a fair price than a fair
    company at a wonderful price.”。'
