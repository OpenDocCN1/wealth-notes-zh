  md: '# 3.6 盈利因子


    # 3.6.1 盈利因子起源


    盈利能力指企业利用已有资源获取利润的能力。通常来说，盈利能力越强，企业前景越好，也越容易受到投资者的关注。经典的股票估值模型，不管股利贴现模型（Dividend
    Discount Model，DDM）还是剩余收益模型（Residual Income Model，RIM），本质上都是把未来各期的盈利按照一定的折现率贴现到现在。而金融分析师对企业估值的核心工作便是估计其未来的盈利水平。近年来，在学术界盈利能力与预期收益率之间的关系得到了越来越广泛的关注。而盈利因子也被
    Fama and French（2015）和Hou et al.（2015）两个重要的多因子模型纳入麾下，以更好地解释股票预期收益率的截面差异。


    在选择构建盈利因子的变量时，最直接的做法是利用绝对盈利水平来度量盈利能力。然而，为了保证指标在不同公司间可比，在计算时通常需要用诸如总资产、销售收入等对盈利水平进行标准化。由于分子和分母都有很多选择，因此学术界相继提出了很多种高相关，但又不完全相同的变量来评价公司的盈利能力。例如，Haugen
    and Baker（1996）考察了4个变量并发现盈利能力强的公司有更高的平均收益。


    在诸多变量中，最常用的一个还是净资产收益率（Return On Equity，ROE），它是归属于股东的利润与净资产之比。但即便是使用ROE，在不同研究的处理细节上也有细微差异。其中，Fama
    and French（2006，2015，2016）将年度营业利润作为分子计算ROE，而Hou et al.（2015）将季度净利润作为分子。这些研究均表明ROE代表的盈利能力与股票的未来收益呈显著正相关。除了ROE，总资产收益率（Return
    On Assets，ROA，即归属于股东和债权人的利润与总资产之比）也得到了不少研究者的支持。与ROE类似，关于计算ROA时应选取什么指标作为分子，学术界也有不少争论。Novy-Marx（2013）认为分子应使用毛利润（gross
    profit），并指出通过毛利润除以总资产算出的ROA（记为GP）具有和BM一样的预测能力，且优于ROE。但Ball et al.（2015）却提出了不同的意见，认为GP的良好表现来自其分母的贡献，当同样将总资产作为分母时，用净利润或营业利润作为分子也能得到优异的表现。


    另一个常用来构建盈利因子的变量是有形资本收益率（Return On Tangible Capitals，ROTC，即息税前利润与有形资本之比）。ROTC由华尔街明星基金经理Joel
    Greenblatt提出。他在Greenblatt（2006，2010）这两本书中讨论了如今已经家喻户晓的选股“神奇公式”。该公式包含一个盈利指标和一个估值指标。盈利指标正是ROTC，而估值指标为企业价值倍数（enterprise
    multiplier，即息税前利润除以企业价值）。ROTC长期表现优异，但最近几年表现不佳。投入资本回报率'
  merge: -1
  img_proc: true
- pgno: 137
  md: '（Return On Invested Capital，ROIC）也是一个常用的盈利因子变量（Damodaran 2007），其计算公式为息前税后利润与投入资本之比④。最后，Nissim
    and Penman（2001）提出使用净经营资产收益率（Return On Net Operating Asset，RNOA）来构建盈利因子，它的定义为经营利润除以净经营资产Ⅲ。RNOA从经营活动的角度拷查企业的盈利能力。和ROE相比，它剔除了杠杆带来的干扰；和ROA相比，它剔除了投资性房地产等与经营活动无关的活动，更加客观和纯粹。理论上，以RNOA为变量构建盈利因子应该有较好的表现，但近年来其表现也不尽如人意。


    # 3.6.2 盈利因子成因


    和其他依赖经验研究的因子相比，盈利因子的理论基础要扎实很多。Fama and French（2006，2015）从股利贴现模型出发推导了预期盈利和股票预期收益率之间的关系。Hou
    et al.（2015）则以实体投资经济学理论（该理论在学术界也被称为q-理论）为基础建立了预期利润和预期收益率之间的联系。需要注意的是，在实证研究中，考虑到数据的限制，学者们不约而同使用了当期盈利而非预期盈利。由于历史盈利能够较好地代表预期盈利（Zhang
    2017），因而可以使用当期盈利代替预期盈利作为构建盈利因子的变量。


    除此之外，不少研究也探索了盈利水平之外的维度，包括盈利质量、盈利波动和盈利增长等，它们极大地拓展了盈利因子的内涵。就盈利质量而言，Sloan（1996）可谓是开山之作。该文将盈利分解为现金流和应计利润两部分，并指出盈利的现金流含量越高（即应计利润越少），盈利质量也就越好；反之，盈利的现金流含量越低（即应计利润越多），盈利质量也就越差。在此基础上，该文发现应计项目高的公司相对应计项目低的公司的确有非常显著的负超额收益。这就是著名的应计异象（accruals
    anomaly）。Ball et al.（2016）进一步指出，净利润并不是最好的度量盈利能力的方法，而采用基于现金流的盈利指标可以得到更好的表现。相比传统的盈利能力，基于现金流的盈利指标不仅表现得更好，而且还可以解释前述的应计异象。


    盈利波动之所以吸引了研究者的注意，是因为它可以部分表征盈利能力的持续性。已有的研究通常用过去T个年度或季度的利润的标准差Ⅳ表示盈利波动。Dichev and
    Tang（2009）对此做了精彩的讨论，他们利用一个简单的时间序列模型指出了盈利持续性、盈利波动和盈利可预测性之间的关系。如果保持盈利持续性不变，则盈利波动和盈利可预测性呈负相关；而如果保持盈利可预测性不变，则盈利波动和盈利持续性呈负相关。Frankel
    and Litov（2009）进一步确认盈利波动同盈利可持续性的负相关是非常稳健的。此外，也有学者单独研究了现金流波动和应计项目波动对股票收益的影响，并指出二者对股票未来收益都有负面影响（Huang
    2009）。


    盈利增长则是另一个很重要的维度。投资者大都认可大牛股的重要条件之一是加速增长的盈利Ⅴ。Haugen and Baker（1996）指出成长潜力越大的公司，其未来预期收益越高。Piotroski（2000）在构造F-Score时，使用了ROA的同比变化衡量盈利变动，并取得了不错的效果。此外，盈利增长本身也是一个很丰富的维度，可以进一步细分为很多子变量。例如，自Ball
    and Brown（1968）的开创性研究以来，标准化的预期外盈利（Standardized Unexpected Earnings，SUE）得到了广'
