  md: '始，由希腊和西班牙引发的一系列问题使得全球市场的神经极度紧绷。RTI指标从当年4月底的20%骤降至6月中的-60%。在这种大环境下，防御性因子择时在2012年5月将投资组合的仓位降低20%，直至同年8月RTI恢复到0%的水平才重新提高到之前的仓位。此外，2013年夏天，时任美联储主席的伯南克宣布美联储将会逐渐削减购债规模。在听到这个消息后，投资者开始疯狂抛售债券，债市收益率大幅上行，而债券价格的下跌也传导至其他资产，导致不同类资产的下跌。这一事件被称为“减码恐慌（taper
    tantrum）”。在这期间，RTI指标虽然没有什么表现，但DR指标发挥了作用。它的急跌显示出因子之间的相关性迅速提升，从而启动了防御性因子择时。自2013年6月，投资组合的仓位被降低20%以抵御风险，直至同年9月DR恢复到之前的水平，仓位才提高到基准水平。这两个例子有效地说明了从多维度度量风险的优势，即同时使用多个低相关的风控指标对于抵御风险至关重要。


    如今，使用因子进行大类资产配置已经逐渐成为海外市场的主流做法。本节介绍的两个问题——构建因子模拟投资组合和抵御因子尾部风险——是在投资中成功践行上述做法的关键。除了这两个关键，传统因子投资中的各种要素，包括是否以及如何预测因子收益率、计算因子的风险、配置因子，也依然至关重要，需要使用科学的方法进行研究和实践。和传统的因子投资一样，用因子进行大类资产配置其成功的关键也在各种细节之中。


