    [3]公众号“川总写量化”的文章《出色不如走运（II）？》一文对该方法进行过详细介绍；《实证研究——使用正交化和自助法寻找显著因子》一文将该方法应用于A股进行了实证研究。


    [4]公众号“川总写量化”的文章《出色不如走运（IV）？》对Chordia et al.（2020）进行了解读。


