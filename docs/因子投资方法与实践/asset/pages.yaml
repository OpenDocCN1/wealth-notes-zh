  md: '# 3.7 投资因子


    # 3.7.1 投资因子起源


    投资效应指的是当期投资较多的公司相比于投资较少的公司，在未来的预期收益率更低，即投资和预期收益之间呈现负相关。投资因子是近几年被逐渐认可的一个因子，其原因是因为Fama
    and French（2015）和Hou et al.（2015）同时将其纳入了各自的多因子模型。但事实上，投资因子早已植根于公司金融经典的q-理论，Zhang（2017）更是将其拓展为投资资产定价模型（investment
    CAPM或ICAPM），与自20世纪60年代以来一直盛行的基于消费的资产定价模型（CCAPM）并驾齐驱。


    公司的最优投资行为要求公司投资预期盈利的现值等于投资的边际成本（此时边际利润为0）。在均衡时，盈利率除以投资的边际成本等于折现率，即股票的预期收益率。因此，在盈利率水平给定时，投资越高的公司，股票期望收益越低。这与第3.6节基于相同理论所讨论的盈利与股票预期收益的关系相对应。Fama
    and French（2015）从DDM推导出了投资因子，他们通过该理论模型推导出预期投资跟股票未来收益的关系，且在实证研究中使用历史投资作为预期投资的朴素估计。Zhang（2017）认为这种处理方式值得商榷，因为历史投资并不能很好地预测未来的实际投资。在本  书的6.2.1中将详细解读Hou
    et al.（2015）和Fama and French（2015）两个模型中投资因子的差异。


    抛开争议不谈，几乎没有一项研究是横空出世的，投资因子也不例外。虽然投资因子真正受到重视是2015年之后的事，但对投资效应的研究更久，其中Titman et
    al.（2004）是最早的实证研究之一。该文使用异常资本投资（abnormal capital investment）来代表投资，并发现有着高额的异常资本投资的公司在接下来一年的收益会显著降低，且该效应不能被其他公司特征或常见的风险因子所解释。Xing（2008）是最早利用q-理论来构建投资因子的研究之一，其实证研究也支持Titman
    et al.（2004）的发现。也正是从这篇文章发表的2008年起，投资效应受到了越来越多的重视，诸多学者利用不同的样本对投资效应进行了大量的实证研究。


    与Titman et al.（2004）有所不同，大部分后续研究都采用了将总资产增长率作为投资的代理变量，它也是Hou et al.（2015）和Fama
    and French（2015）采用的定义。Cooper et al.（2008）基于40年的美股数据发现投资对股票未来收益的负面影响非常显著且稳健。此外，大量学术研究成果表明投资因子也存在于其他国家的股票市场中，不过发达国家市场中的投资效应要比新兴市场中的投资效应强很多。此外，A股市场也吸引了一些学者的注意，已有研究大多认为A股市场不存在显著的投资效应。其中，Guo
    et al.（2017）利用1995至2014年间的数据发现，'
