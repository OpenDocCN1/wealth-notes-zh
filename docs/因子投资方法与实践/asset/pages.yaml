- pgno: 151
  md: '# 3.8 换手率因子


    # 3.8.1 换手率因子起源


    成交量也对股票未来表现有显著影响。对于这一点，业界的应用可能远远早于学界的研究。例如，Lefevre and Markman（2012）详细描述了华尔街的传奇人物Jesse
    Livermore于20世纪初提出的趋势交易方法。该方法就包括在股票突破形成上涨趋势时，需要有成交量放大的配合。而换手率作为标准化的成交量指标，同样备受关注。


    现如今，学术界和业界的共识是，换手率和预期收益之间呈负相关关系。相关的研究可以追溯到20世纪90年代，但最初的实证结果却并不一致。Campbell et al.（1993）发现市场指数和大盘股日收益率的一阶自相关性都随着成交量的增加而下降。Chordia
    and Swaminathan（2000）发现高成交股票的日度和周度收益率领先于低成交股票的。Datar et al.（1998）指出换手率有助于解释股票收益。Chordia
    et al.（2001）进一步指出，成交金额和换手率的变化对股票收益有显著的负面影响。而Subrahmanyam（2005）发现换手率对股票未来表现的影响存在显著的不对称性，对于过去一个月收益最低的股票，换手率同股票未来收益呈负相关，而对于过去一个月表现优异的股票，二者却呈正相关。


    再来看看换手率因子在其他市场上的表现。Hu（1997）和Chang et al.（2010）发现在日本股市中，换手率及其变化也都对股票未来收益有显著的负面影响。Rouwenhorst（1999）则在新兴市场中观察到相同的现象。然而，Dey（2005）却有不同的发现，认为在新兴市场中高换手率有正的风险溢价。关于A股市场也有不少研究。Mei
    et al.（2005）基于中国市场特殊的A/B股交易结构发现投资者的投机活动导致更高的A股换手率和更高的价格，从而推升A/B股价差。此外，Liu et al.（2019）指出A股市场换手率对股票未来收益有显著的负面影响并据此构建了换手率因子（Pessimistic-Minus-Optimistic，PMO），且通过实证结果支持了他们的结论，并在其对A股市场提出的四因子模型中纳入了PMO因子。该因子可以更好地解释其他因子无法解释的异象，如A股市场上的短期反转。


    # 3.8.2 换手率因子成因


    早期的相关研究大多将成交量和换手率当作流动性的一种度量方法，但随着Amihud（2002）将非流动性定义为单位成交金额对应的平均收益变化，换手率便不再适合作为流动性的代理变量。Subrahmanyam（2005）认为应将其视作趋势是否能延续的表征，这与Lefevre
    and Markman（2012）讲述的趋势交易方法不谋而'
  merge: -1
  img_proc: true
- pgno: 152
  md: '合。Barinov（2014）也认为换手率与流动性并不相同，而是与市场的总体波动率有关。特别地，他指出换手率异象在那些有期权状的股权结构中最为显著，且这一点也可以被总体波动率因子所解释。Chen
    et al.（2001）则认为换手率可能同股价崩盘风险有关，发现换手率相对于过去6个月的趋势显著增长且在过去36个月又显著正收益的股票面临最高的崩盘风险。


    另外，从行为金融学的角度分析，换手率及换手率异象也有一些代表性的研究。Odean（1998）和Statman et al.（2006）指出换手率反映了投资者非理性的情绪，诸如过度自信和盲目乐观，因而是一个情绪指标。Lee
    and Swaminathan（2000）、Glaser and Weber（2007）及Hong and Stein（2007）则认为换手率和投资者的注意力及投资者的意见分歧有关。Chou
    et al.（2013）研究发现换手率与股票未来收益的负相关性不能被Fama and French（1993）三因子模型和Liu（2006）的流动性CAPM模型等经典资产定价模型解释，也不能被Daniel
    et al.（1997）提出的特征收益模型完全解释，而是和行为偏差和套利限制更相关。此外，他们还发现换手率异象高度持续，在组合形成后长达五年的时间内，都可能获得显著的超额收益。


    除此之外，一些学者探讨了异常成交量对股票收益的影响，并发现异常高的成交量往往预示着更好的股票表现。例如，Gervais et al.（2001）发现成交量异常高的股票有更高的未来收益，且成交量的预测能力并不受高成交量期间股票收益的影响，这同趋势交易方法的结论有所不同。该文认为高成交量的股票有着更好的可见性（visibility），吸引更多的潜在买家，从而有更好的表现。Kaniel
    et al.（2012）基于41个国家的数据指出，在发达市场和新兴市场都存在高成交溢价。Zhou（2010）则提供了中国A股市场存在高成交溢价的证据。Akbas
    et al.（2017）表明市场总体的异常高周度成交量预示着未来一周更高的市场收益以及更高的波动率。Lee et al.（2016）进一步指出高成交溢价是一个短期现象，高成交量的股票虽然在未来一周表现更好，但在更长期的时间表现反而
    limitations。他们将成交量拆分为预期的成交量和未预期的成交量，并指出前者与不同期限股票的未来收益呈负相关，而后者同股票未来五周之内的收益呈正相关，但对更长期的收益没有显著影响。


    # 3.8.3 换手率因子实证


    在构建换手率因子时，本书依照Liu et al.（2019）提出的方法，即使用异常换手率作为排序变量。对于每只股票，在t月末，异常换手率的定义为过去21个交易日的平均换手率和过去252个交易日的平均换手率的比值（换手率基于自由流通股本计算）。剔除黑名单及异常数据后，异常换手率的数据覆盖度如图3.29所示。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '![](img/8ad8b7f696519d8b709b07f70d7ebfdb_153_0.png)


    每月末将股票按异常换手率从低到高分成10组，记为Low、2、……、9及High组。表3.29给出了这10个投资组合在整个实证期内的描述性统计。无论总市值、市场β、年化波动率，还是P/B及ROA，这10个投资组合在这些变量上的取值都非常接近，并没有在某个变量上表现出明显的单调性，说明换手率和这些变量的相关性是非常低的。这是一个非常优秀的性质。


    表3.30展示了以异常换手率为变量的排序检验结果。无论等权重还是市值加权，低换手率效应在A股上都十分显著，投资组合的收益率随着换手率的上升而下降。当采用等权重时，这10个投资组合的月均收益率和每组平均异常换手率的秩相关系数均为-0.903（p-值为3.44×10-4），呈现出显著的负相关性；当采用市值加权时，上述单调性有所下降，秩相关系数为-0.612（p-值为0.06）。无论等权重还是市值加权，由做多低异常换手率（Low组）和做空高异常换手率（High组）构造的换手率因子的月均收益率都非常显著。当采用等权时，换手率因子的月均收益率为1.50%（t-值高达5.45）；当采用市值加权时，该因子每月的收益率较等权重时下降到1.10%（t-值下降到3.01）。尽管如此，该结果无论在经济上还是统计上都依然非常显著。


