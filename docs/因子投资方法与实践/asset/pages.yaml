    # 3. 指数编制


    在编制因子指数时，因子暴露和可投资性是必须考虑的两个因素。然而，这二者天生矛盾，获得高的因子暴露是通过牺牲可投资性得到的，反之亦然，因而必须在它们之间权衡和取舍。可投资性是指目标因子的投资组合中股票的仓位是否合理，该组合的换手率和交易成本是否符合实际，进入该组合的股票是否有足够的流动性，该投资组合能承担的资金量（即因子的容量）是否足够大等。图7.4中金字塔描绘了五种因子指数化方法，自上而下，它们的因子暴露越来越低、可投资性越来越高。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_332_0.png)


    图7.4 不同的因子指数化方法


    +   • 纯因子指数：位于金字塔顶端的是纯因子指数。纯因子指数是为了正确定量计算因子的收益和风险而从纯数学的角度构建的。构建时没有考虑任何可投资性的约束，其可投资性非常低（例如Barra模型中的因子）。它满足对目标因子有1个单位的暴露，对其他因子没有暴露。


    +   • 多空因子指数：金字塔的第二层是多空对冲的因子指数，这类指数通常是资金量中性的。比如Fama-French三因子模型中的规模和价值因子的组合就是这一类的代表。构建这类指数的常见方法<|message|>
    排序法。该方法对目标因子仍然有很高的因'
