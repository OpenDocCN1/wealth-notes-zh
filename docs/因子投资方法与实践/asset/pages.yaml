    # 图5.15 错误定价和特质性波动率双重排序月均Fama–French三因子-α（%），市值加权


    特质性波动率代表着特质性风险，经典理论认为特质性波动率和预期收益率之间应该相互独立。然而，大量实证分析表明这二者之间却表现出负相关性，这便形成了特质性波动率之谜。近年来，大量的学者投身到研究特质性波动率之谜的行列中，而本节介绍的Stambaugh
    et al.（2015）正是其中的代表。它从套利风险和套利不对称性的角度拆解了不同错误定价股票的IVOL异象，为人们理解这个迷困提供了新的思路。除此之外，值得一提的研究还包括Liang
    and Tang（2018）一文。它将IVOL拆解成不确定性和残差波动率两部分，并指出IVOL和收益率的负相关主要源于不确定性部分，为理解IVOL之谜提供了新的视角。此外，Herskovic
    et al.（2016）发现个股的特质性波动率之间也存在显著的共同运动，并提出了一个因子结构来解释特质性波动率。该文的发现对于实证资产定价有一定的启示，且他们的结果也表明了特质性波动率和预期收益率之间的负相关性。


    在股票市场中，低波动异象（或低风险异象）广泛存在。比如人们熟悉的低β异象（betting against beta，见Frazzini and Pedersen
    2014）就是这样的例子，而本节介绍的低特质性波动率异象则是低波动异象中最杰出的代表。关于低波动异象，学术界的另一种观点是用来检验它的定价模型遗漏了一个重要的因子——剩余协偏度因子。20世纪70年代，Kraus
    and Litzenberger（1976）指出从投资者递减的绝对风险厌恶可以推出效用函数的三阶导大于0，从而隐含着投资者对正偏度的偏好。Harvey and
    Siddique（2000）进一步通过正式的模型指出资产的CAPM超额收益与其剩余协偏度负相关。在这些研究的基础上，Schneider et al.（2020）猜想剩余协偏度的遗失才是造成低波动率异象的原因。为了证明上述猜想，该文针对美股使用股票期权数据计算出隐含偏度，以此作为未来剩余协偏度的代理变量，并发现当该因子被加入定价模型后，常见的低波动异象（包括低特质性波动率异象）消失了。此外，该文进一步利用主成分分析和回归分析检验了该因子与低波动异象之间的关联。为此，Schneider
    et al.（2020）利用主成分分析提取了4个低波动异象的第一主成分，并发现隐含偏度因子几乎可以完全解释该主成分。这一结果表明，隐含偏度因子能够解释低波动异象并非因为巧合，而是因为它同低波动异象的核心驱动因素有关。上述研究为人们理解包括低特质性波动率在内的低波动异象提供了新的思路。


