- pgno: 204
  md: '# 5.2 基本面锚定反转


    短期反转异象（short-term reversal anomaly，STR）大概是A股中最显著的异象。反转异象意味着前期大涨的股票在未来有更低的预期收益率；反之，前期大跌的股票在未来有更高的预期收益率。以学术界和业界都广泛认可的过去一个月累计收益率为变量，将A股市场中的股票分成五组：输家（Loser）、第2组、第3组、第4组、赢家（Winner）。其中输家代表过去一个月累计跌幅最大的一组，赢家代表过去一个月累计涨幅最高的一组。这五个投资组合的累计收益曲线如图5.8所示，可以清晰地显示出A股市场中的反转现象。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_204_0.png)


    图5.8 使用最近一个月收益率分组的投资组合的累计收益率曲线


    在实际投资中，由于做空受到很大的限制，因此想要利用反转异象就只能从多头入手，即买入前期超跌的股票。通常来说，投资者需要克服极大的恐惧才能进行这种逆趋势而为的操作。而股票的超跌主要有三个原因：（1）上市公司基本面恶化；（2）投资者对信息的过度反应（Lehmann
    1990a）；（3）噪音交易者导致的瞬时流动性冲击（Grossman and Miller 1988，Jegadeesh and Titman 1995）。在上述三个原因中，由于基本面恶化造成的股价大幅下跌往往难以反转。因此，要想通过逆势做多来利用反转异象，就理应规避那些基本面恶化的公司。这意味着投资者应试图把基本面变化造成的影响从收益率中剥离出去，而使用收益率中剩'
  merge: -1
  img_proc: true
- pgno: 205
  md: '余的部分代表过度反应和瞬时流动性冲击的程度，并以此构建更合理的反转策略。Zhu et al.（2019）利用这个想法提出了基本面锚定反转异象，并在美股的实证中获得了显著的超额收益，远超原始反转异象。


    # 5.2.1 金融学依据


    为了将基本面的影响从收益率中剥离，考虑由Da et al.（2014）提出的模型：


    ```

    Residual_{t+1}=R_{t+1}-μ_t-CF_{t+1} （5.1）

    ```


    式中R_{t+1}为某股票的收益率，μ_t为其均衡状态下的条件预期收益率，CF_{t+1}则代表该股票最新的现金流信息造成的收益率变化，因此Residual_{t+1}则代表了把基本面影响剥离之后的残余收益率。Da
    et al.（2014）将和现金流有关的新息从股票收益率中减去，以此排除基本面变化对于收益率的影响，以期捕捉由于过度反应和流动性冲击造成的非理性下跌。为了定量计算CF_{t+1}的影响，一般可使用基于分析师预期修正的计算方法。然而Zhu
    et al.（2019）指出，模型（5.1）的计算方法存在两个问题：


    +   （1）股票价格对于基本面消息的吸收是缓慢的（见Hong et al.2000和Choi and Sias 2012），因此仅考虑最新的基本面信息是不够的，还应考虑过去一段时间的；


    +   （2）分析师并不能覆盖全部股票，因此使用分析师预期修正无法对全市场的股票进行分析。


    为改进上述第一点，Zhu et al.（2019）将模型（5.1）调整为包含过去T期内现金流信息的变化：


    ```

    Residual_{t+1}=R_{t+1}-μ_t-1/T ∑_{i=0}^{T-1}CF_{t-i+1} （5.2）

    ```


    为了在上述基础上继续改进第二点，他们使用Piotroski（2000）的F-Score代替现金流信息作为基本面信息的代理变量。Choi and Sias（2012）指出，随着价格对基本面信息的逐步吸收，F-Score对于基本面驱动的未来收益率变化预测能力是提升的。使用F-Score隐含的收益率（记为R_{F-Score}）代替式（5.2）右侧中的最后一项可得：


    ```

    Residual_{t+1}=R_{t+1}-μ_t-R_{F-Score} （5.3）

    ```


    最后，大量实证结果显示，无论选择哪个实证资产定价模型来计算式（5.3）中的μ_t，改进后的反转异象都非常稳健，因此μ_t的影响有限。利用这一点，最终把式（5.3）进一步简化为：


    ```

    Residual_{t+1}=R_{t+1}-R_{F-Score} （5.4）

    ```


    传统的短期反转异象说明，短期历史收益率和未来预期收益率之间呈现负相关关系，而F-Score代表的基本面强则和未来预期收益率呈现正相关关系（见5.1节'
  merge: -1
  img_proc: true
- pgno: 206
  md: '的实证结果）。综合以上两点，短期历史收益率和F-Score叠加后与预期收益率的关系如表5.5所示。


    # 表5.5 短期历史收益率以及F-Score叠加后和预期收益率的关系


    |  | 短期历史收益 | F-Score | 二者叠加 |

    |---|---|---|---|

    | 过去输家 + 高 F-Score | 正相关 | 正相关 | 正相关 |

    | 过去输家 + 低 F-Score | 正相关 | 负相关 | 模糊 |

    | 过去赢家 + 高 F-Score | 负相关 | 正相关 | 模糊 |

    | 过去赢家 + 低 F-Score | 负相关 | 负相关 | 负相关 |


    由表5.5所示的关系可知，通过做多基本面好（F-Score高）的过去输家，并同时做空基本面差（F-Score低）的过去赢家便可以提升传统短期反转异象，获取更丰厚的超额收益。而上面这种处理方式，实际上和5.1.4节有异曲同工之妙，也是在寻找市场和基本面之间的预期差。其中，过去的输家叠加高F-Score的组合是被低估的股票，而过去赢家叠加低F-Score的组合是被高估的股票。投资者通过做多被低估的、做空被高估的获得超额收益。上述剥离了基本面信息的反转异象被称为基本面锚定反转（fundamental-anchored
    reversal，FAR）。


    # 5.2.2 A股市场中的基本面锚定反转


    下面针对A股进行基本面锚定反转的实证分析。实证中使用过去一个月的累计收益率为反转变量，使用5.1节介绍的F-Score为基本面变量，构建改进后的反转异象。为此，使用上述两个变量进行独立双重排序。具体来说，使用反转变量将股票分成5组（Loser、P2、P3、P4、Winner），使用F-Score将股票分成3组（Low、Middle、High），这样一共得到15个投资组合，如图5.9所示。


    表5.6给出了以上15个组合在本书记证期内的月均收益率以及它们的t-值。为了考察结果的稳健性，表中同时汇报了等权重（Panel A）和市值加权（Panel
    B）的情况。受到Stein（2009）的启发，Zhu et al.（2019）提出通过做多Loser/High组合（基本面强的输家）同时做空Winner/Low组合（基本面差的赢家）就得到了基本面锚定反转。作为对比，通过做多Loser/Low组合（基本面差的输家）同时做空Winner/High组合（基本面强的赢家）得到未经基本面锚定的反转（fundamental-unanchored
    reversal，FUR）。表5.6中展示了FAR和FUR的月均收益率及其显著性。最后，表中同样列出了传统的反转（即Loser-Winner组合）的检验结果。


