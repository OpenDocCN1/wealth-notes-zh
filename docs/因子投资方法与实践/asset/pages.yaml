  md: '# 1.3.2 因子投资和投资者


    再来看看投资者视角下的因子投资。自20世纪80年代末以来，业界开始把学术界的研究成果很好地落地，形成了许多风格因子指数。举例来说，1987年罗素（Russell
    Investments）推出了最早的两个风格指数，分别对标价值和成长因子。在这之后，标准普尔指数公司（S&P）[2]、明晟（MSCI）等机构也推出了它们各自的风格指数。最初，推出这些指数的目的是评估主动基金经理人的业绩。然而不久之后，复制这些指数的基金便应运而生，而这其中的代表则是大名鼎鼎的先锋集团（Vanguard）。1992年，先锋推出了第一支价值指数基金和第一支成长指数基金。这些指数基金一经推出便受到了追捧。人们把它们视作主动型价值投资的低成本替代品。鉴于价值因子取得的巨大成功，业界也开始把关注的重点转移到学术界发现的其他因子，并构造出了一系列Smart
    Beta ETF产品[3]，造福了普通投资者。


    2018年，《经济学人》估算因子ETFs[4]的总规模超过6500亿美元。大量低成本的ETFs产品让普通投资者也能享受风格因子带来的收益——前提是能够选择适当的ETFs。然而，这并不容易。在一项针对大学本科生和研究生的实验中，Choi
    et al.（2009）让参与者从众多追踪标准普尔500指数（简称标普500指数，英文S&P 500）[5]的被动型ETFs中挑出他们认为最好的。实验中为参与者提供了ETFs的费率以及它们在不同时期的收益表现情况。作为具备金融知识的理性投资者来说，鉴于这些ETFs均是被动地追踪标普500指数，因此应该把费用的高低作为唯一的标准来选择。然而，参与者被它们在不同时期的收益率差异所迷惑，绝大多数投资者完全忽视了费用的差异，而选择了收益率最高的ETF。另外，就算是排除了投资者本身的非理性行为，琳琅满目的ETF产品也足以让人迷失。以价值因子为例，表1.1总结了美股上主流的价值因子ETFs。


    针对某个因子的不同ETFs，一般可以从因子敞口、费用、流动性等角度进行比较。即便表1.1中所列出ETFs都是为了捕捉价值因子的超额收益，但它们风格差异却十分鲜明。这无疑对投资者的选择带来了巨大的挑战。进一步从表1.1列举的ETFs中挑选那些以标准普尔500指数成分股为标的构建的价值因子ETFs，表1.2统计了它们自2013/04/30至2020/03/31的表现。由于最近几年价值投资不太好使，这些因子均跑输标普500指数（SPX）本身，且它们之间也有明显的差异。从夏普比率的角度来说，最好的要数VTV，而垫底的则是RPV。不幸的是，对于投资者来说，事前就从琳琅满目的ETFs中挑出最好的并不容易。


    Smart Beta ETFs的流行给投资者提供了越来越丰富的工具，也对投资者提出了更高的要求。在投资ETFs时，投资者需要首先明确自己的目标，比如是分散化风险还是获得相对于市场的超额收益。在明确目标之后，需要理解每个风格因子背后的逻辑和它代表的风险。唯有这样，才有可能享受这些标的带来的更高性价比的风险收益。


