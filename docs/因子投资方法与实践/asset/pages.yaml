    # 4. 增加透明度


    和被动指数投资相比，主动投资取决于投资经理的主观判断，由此会带来委托代理问题。首先，由于激励机制和考核制度，基金经理的目标不一定是投资人利益最大化，而是自身利益最大化。比如为了追求短期目标，基金经理倾向于选择彩票型股票（高波动、高贝塔或正偏度），而彩票型股票往往被高估凹。其次，由于投资框架不成熟，抑或基金经理变更，会带来风格漂移，致使业绩持续'
  merge: -1
