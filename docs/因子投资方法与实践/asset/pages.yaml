    \ v₂₂ … 0 ; ⋮ ⋮ ⋱ ⋮ ; 0 0 … v_TT ] = [ σ₁² 0 … 0 ; 0 σ₂² … 0 ; ⋮ ⋮ ⋱ ⋮ ; 0 0 …\
    \ σ_T² ]  (2.53)\n```\n\n反之，当仅出现自相关但没有异方差时，σ²Y满足：\n\n```\nσ²Υ = σ² [ 1 ρ₁ … ρ_{T-1}\
    \ ; ρ₁ 1 … ρ_{T-2} ; ⋮ ⋮ ⋱ ⋮ ; ρ_{T-1} ρ_{T-2} … 1 ]  (2.54)\n```\n\n式（2.53）和式（2.54）只是给了Y的两个典型例子。在一般的情况下，自相关和异方差同时存在，Y矩阵中第i行、第j列的元素则由v_ij表示。如果矩阵Y已知，则通常使用广义最小二乘（GLS）对回归系数b进行参数估计。但当Y未知时，OLS往往是首选。对模型（2.52）使用OLS得到b的估计\\\
