  md: '# 4.4 多因子模型的简约性


    从数学上来说，如果仅以能否解释异象来评判多因子模型的能力，那么随着人们在时序回归的右侧加入越来越多的因子——即模型包含越来越多的因子，该模型一定能够（在实证区间内）解释越来越多的异象。但从本章介绍的七个多因子模型来说，它们的因子个数均在3到5个之间，都是非常有限的。这背后遵循的就是简约性原则（The
    Law of Parsimony）。


    虽然在不同多因子模型中，因子个数的差异不大，但有些因子的构建用到了大量的变量。更多的变量意味着模型更高的复杂度，而这也造成了因子模型解释力度上的差异。在2018年美国金融协会年会上，Daniel
    et al.（2020）的作者之一Lin Sun报告了Daniel–Hirshleifer–Sun三因子模型，并探讨了模型复杂度和模型解释异象的效果之间的关系，颇有新意。为此，他们提出了两个简约指数（记为简约指数I和简约指数II），通过惩罚因子个数以及用来构造因子的变量个数来计算模型复杂度。


    其中，简约指数I的定义为：


    简约指数I=0-模型中所有因子用到的全部变量之和 （4.44）


    在上述定义中，有两点值得特别说明。第一，由定义可知简约指数I的取值为负，其数值越接近零说明模型越简单，其数值越低说明模型越复杂。第二，如果一个变量被用于模型的多个因子中，则需要多次计算它，而非仅仅计算一次。


    举个简单的例子，Fama–French三因子中包含市场、规模和价值三个因子。市场因子是市场组合的超额收益，无须任何变量，因此对简约指数I没有贡献。规模和价值因子分别采用市值和BM双重排序构建，即这两个因子都用到了上述两个变量。按照式（4.44）的定义，市值和BM都将被计算两次。最终，市场、规模和价值三因子用到的变量分别为0、2和2，因此Fama–French三因子模型的简约指数I为-4。再来看一个复杂一些的例子，在Stambaugh–Yuan四因子模型中，两位作者分别使用市值以及11个异象变量（共12个变量）构建了规模、管理
    and 表现因子。其中，管理因子用到了市值和6个异象变量（一共7个变量），表现因子用到了市值和5个异象变量（一共6个变量），而规模因子则用到了市值和全部11个异象变量（一共12个变量）。最终，Stambaugh–Yuan四因子模型的简约指数I为-25=（0-0-12-7-6）。


    再来看看简约指数II，它的定义为：


    简约指数II=0-模型中的因子和变量个数之和 （4.45）'
