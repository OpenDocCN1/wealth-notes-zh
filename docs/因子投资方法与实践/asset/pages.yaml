    表3.28汇总了使用ROA和总资产增长率条件双重排序的检验结果。无论等权重还是市值加权，在控制了ROA后，依然无法在A股上观察到显著的投资因子。当采用等权重时，投资因子的月均收益率为0.03%，其$t$-值仅为0.19；当采用市值加权时，投资因子的月均收益率为0.07%，$t$-值为0.34。观察表中更细分的结果，在不同的ROA条件分组下，总资产增长率区分股票预期收益率差异的能力均十分有限；无论采用哪种权重，以总资产增长率排序的五组收益率都无显著单调性。尽管如此，表3.28的结果表明，在控制了ROA之后，投资因子的收益率不再显著。这和前文的猜测一致，即投资因子会受到盈利因子影响，如果不对盈利因子加以控制，则投资因子的负收益可能源于在盈利因子上的负暴露。综合表3.25中的描述性统计，以及表3.27和3.28中的双重检验结果，可以认为投资因子在A股市场中并不显著，而不是和理论相矛盾。


    最后，A股市场中投资因子不显著也可能存在另外的解释。一方面，金融学理论表明投资和未来预期收益率呈负相关。另一方面，A股市场中的总资产增长往往来自公司的兼并和收购活动，而这类活动往往伴随着后续股价的上涨、收益率的提高，故造成投资和预期收益率之间的正相关。投资和预期收益率之间的强弱都会影响投资因子，最终造成其在本书的实证期内并不显著。'
