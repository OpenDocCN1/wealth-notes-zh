- pgno: 117
  md: '# 3.3.2 规模因子成因


    关于规模因子，最自然的解释来自风险补偿说。Chan and Chen（1991）认为，小市值公司普遍在过去遭遇过困境使得市值大幅下滑，即所谓“坠落的天使”（fallen
    angels）。Fama and French（1995, 1996）进一步指出规模效应可能与小市值股票更大的财务困境风险（financial distress
    risk）有关。但也并非所有人都对此解释信服。例如，Campbell et al.（2008）基于美股的研究发现，有着更高破产概率的公司确实对规模因子有更大的暴露，但它们并没有更高的预期收益。除此之外，另一种解释认为非流动性是一个定价因子，而规模与非流动性相关，并因此呈现出规模效应。但这一解释也并不完美，因为非流动性因子本身仅能解释收益差异的一小部分。除风险补偿外，投资者行为也是一种潜在的解释。机构投资者往往更偏好流动性好的大市值股票，而小盘股由于缺乏知名度，因而缺少投资者基础，这使得小盘股不得不提供更高的预期收益来吸引投资者（见Gompers
    and Metrick 2001和Daniel et al.2001）。也有研究认为，规模效应可归因于退市偏差、少数股票的极端收益和季节效应。


    另一些研究则认为，规模效应可能源自模型设定偏误，是遗漏变量问题的自然结果。Berk（1995）认为，如果定价模型形式设定有误，则公司规模将总是与股票收益中未被解释的部分负相关。举个简单的例子，假设两家公司A和B有相同的期末现金流，但其中公司A的现金流风险更大。自然地，公司A的股价将低于公司B，即其市值更小。但二者的内在价值实际上是相同的，公司A的预期收益也将更高。这便是典型的遗漏变量问题。总体来看，早期实证证据普遍支持股票市场中存在显著的规模效应，而新近的研究则表明，随着投资者熟知规模效应，规模因子表现也趋于平庸，甚至其长期超额收益逐渐变得不再显著。人们在美国、欧洲和中国市场均观察到类似的现象。


    # 3.3.3 规模因子实证


    实证中采用总市值（股票收盘价乘以总股本）为排序变量构建规模因子。在剔除了黑名单及异常数据之后，总市值变量的数据覆盖度如图3.14所示。


    每月末将股票按照总市值从低到高分成10组。这10组分别记为Small（市值最小的组）、2、……、9以及Big组（市值最大的组）。表3.14汇报了这10个投资组合在整个实证期内的描述性统计。考察并汇报不同组合的描述性统计是学术界的惯例，其目的是在研究目标因子之前定量分析不同组合在常见的特征指标上是否存在差异，以及差异是否会对因子收益率造成影响。对于每个特征指标，首先计算每期每个组合内所有股票在该指标上的均值，然后将全部7期的均值在时序上取平均，并汇报最终的均值。本章实证中考虑的特征指标包括总市值、市场β、持仓股票的平均年化波动率、市净率（P/B）以及总资产收益率（ROA）。在本章余下的实证中，也会汇报使用其他排序变量划分得到的投资组合的描述性统计。'
