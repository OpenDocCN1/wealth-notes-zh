- pgno: 6
  md: '# 第1章

    因子投资基础


    因子投资涵盖的内容包罗万象。有人用因子来获取收益，也有人用因子来控制风险；有人用因子进行被动的资产配置，也有人用因子博取主动的套利收益；有人用因子研究预期收益率，也有人用因子研究收益率的波动……这些差异性的使用方式足以把刚接触因子投资的人搞得晕头转向。而如果将“什么是因子投资”这个问题抛给从事因子投资的人，一千个人也可能给出一千种答案。因子投资涉及的内容虽然看似纷繁，但它们其实非常协调地构成了一个有机的整体。本书将围绕一个公式，站在一个统一的视角下探讨因子投资的方方面面。'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# 1.1 统一视角下的因子投资


    # 1.1.1 一个公式


    20世纪60年代，资本资产定价模型（Capital Asset Pricing Model，CAPM）问世。在CAPM被提出之前，人们对于风险如何影响一个公司的资本成本（cost
    of capital），进而如何影响预期收益率并没有清晰的认识。1958年，Modigliani and Miller（1958）提出了著名的资本结构无关原理（也被称为MM定理）。该定理认为在不考虑税收、破产成本、信息不对称，且市场有效的假设下，企业价值不会因为企业融资方式改变而改变。然而，MM定理使得如何刻画风险和预期收益率之间的关系变得更加扑朔迷离。直到CAPM的诞生，才首次清晰地描绘出风险和收益率之间的关系。


    根据CAPM理论，资产的预期超额收益由下面这个一元线性模型决定：


    ```

    E[R_i]-R_f=β_i (E[R_M]-R_f)    (1.1)

    ```


    其中E[.]是期望符号，R_i为某资产i的收益率，R_f为无风险收益率，R_M为市场组合的预期收益率。式中β_i=cov（R_i, RM）/var（R_M）刻画了该资产收益对市场收益的敏感程度，它也被称为资产i对市场风险的暴露程度。CAPM正是最小最简单的线性因子模型，它指出资产的预期超额收益率由市场组合的预期超额收益率和资产对市场风险的暴露大小决定，而市场组合也被称为市场因子。


    式（1.1）这个简单的关系为后续大量线性多因子定价模型的研究拉开了序幕。人们发现不同资产的收益率并非由单一的市场因子决定，而是同时受到其他因子的影响。以此为契机，Ross（1976）提出了著名的套利定价理论（Arbitrage
    Pricing Theory，APT），在CAPM的基础上做了进一步延伸，构建了线性多因子定价模型（简称多因子模型）。多因子模型假设资产i的预期超额收益由以下多元线性模型决定：


    ```

    E[R_i^e] = β''_i λ    (1.2)

    ```


    其中E[R_i^e]表示资产i的预期超额收益，β_i是资产i的因子暴露（factor exposure）或称因子载荷（factor loading），λ是因子预期收益（factor
    expected return），也常被称为因子溢价（factor risk premium）[2]。式（1.2）中引入符号E[R_i^e]代表预期超额收益而舍弃了E[R_i]-R_f，原因如下。对于个股或者由若干支股票组成的纯多头投资组合这类资产，它的预期超额收益是E[R_i]和无风险收益率R_f之差，即E[R_i]-R_f。在实证'
