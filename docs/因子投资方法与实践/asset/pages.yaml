  md: '方法的有效改进。考虑到每种方法仍有其局限，未来仍有很多拓展工作值得进一步挖掘。此外，如何将通过PCA获取的信息成功地转化为投资实践也有待更多探索。但无论如何，这些方法都是极为有价值的探索，不仅标志着资产定价的大门对无监督学习方法敞开，也意味着因子投资领域多了一门令人充满期待的新武器。


    # 6.8.5 机器学习的问题


    机器学习算法固然强大，但人们在使用这些算法时也必须面对两个问题：（1）机器学习算法常常被视作黑箱，缺乏足够的可靠性；（2）机器学习算法也容易陷入过拟合。对于前者，以神经网络等算法为例，其内部往往非常复杂，黑箱性质使得人们难以真正理解其发现的特征与未来收益率之间的关系。幸运的是，这个问题并非完全无解。Dixon
    and Halperin（2019）指出可以通过计算特征对最终输出结果的影响程度来解释自变量和因变量之间的关系。另一方面，人们应在发现有显著预测能力的模型后，进一步考察有哪些特征是显著的，并梳理清楚特征和收益率之间可能的逻辑关联。一旦人们试图理解机器学习发现的规律时，它就变成研究中的一块基石，帮助人们更好地理解数据背后的经济逻辑。


    机器学习容易陷入过拟合有以下几个原因。首先，由于真实的资产价格路径只有一条，因而基于该路径反复训练模型本身就很容易过拟合。在这个过程中，也容易踏入Harvey
    et al.（2016）提出的p-hacking的陷阱。虽然相关研究往往采用了前向回测分析（walkforward backtesting），但该方法只能规避未来数据问题，并不能完全杜绝过拟合。事实上，这一问题对于因子研究而言可能尤为严重。典型的因子研究通常以股票月度收益为研究对象。即便以历史最为悠久的美股而言，较为完整的历史数据也只从1962年开始，即大约700个月的样本。对于机器学习算法而言，这一样本实在过小。另一个原因则与金融数据中的自相关性和异方差特征有关。在机器学习中一般使用交叉验证（cross
    validation）等方法来进行模型选择。但金融数据的序列的自相关性和异方差特征使得训练集中的信息会泄露到测试集，从而导致交叉验证方法失效。最后，当给定资产的收益分布时，其预期最高夏普比率同波动率正相关。这造成波动率较大的资产，在一次历史回测中反而可能得到更高的夏普比率。因此，单纯的历史回测可能会高估因子的表现。


    虽然有各种各样的问题，但也并不意味着人们就束手无策。例如，通过模拟生成多条（更长周期的）资产价格路径并分析不同场景下的表现，可以改善在历史价格路径上反复测试的问题。此外，通过确保训练集和测试集在时间区间上没有交集，可以改善前述交叉验证可能遇到的问题。而使用平减夏普比率（deflated
    Sharpe ratio）则可以部分解决夏普比率被高估的问题。


    总体来说，机器学习在因子投资领域的应用仍处在早期阶段。但随着数据和算法日益成熟、研究者更加谨慎地应对上述问题，机器学习在未来注定能在因子投资研究中扮演更重要的角色。不过，机器学习是否可以取代经典的多因子模型成为最主流的方法，则有待进一步的考察。说到底，机器学习是一类数据模型方法，要在业务实践中发挥作用，仍有赖于对业务领域知识的理解。综合本节介绍的内容，本书作者认为有理由期待机器学习将扮演更重要的角色，但同时也相信机器学习在因子投资中的最佳路径在于和已有方法结合，而非取而代之。'
