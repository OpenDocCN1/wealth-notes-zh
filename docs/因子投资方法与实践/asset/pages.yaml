  md: '山鼻祖，它 הב很多处理方法对学术界都有着非常深远的影响。Fama and French（1993）在构建规模（SMB）和价值（HML）两个因子凹时，采用市值和BM进行独立双重排序。在排序时，该文按市值把股票分成了大、小市值两组，按BM把股票分成高、中、低三组，最后两两交集构建了2×3=6个投资组合。这种使用市值和另外一个变量进行2×3划分的独立双重排序在Fama
    and French（1993）之后得到了广泛的应用，本书第4章会详细介绍。


    # 3. 三重排序


    除前面介绍的双重排序之外，近年也有部分研究采用了三重排序（triple sorting）。一个典型例子是Hou et al.（2015）提出的四因子模型。该文从实体投资经济学理论出发推导出预期收益率和投资以及盈利之间的条件关系。此外，考虑到盈利能力和投资效应在小盘股中都更强，为了排除市值的影响，Hou
    et al.（2015）在构建因子时，使用规模、投资和盈利三个维度的变量进行了三重排序。


    排序法及其检验是因子研究中最常见的方法之一。它最大的好处是绕过因子暴露，构建因子模拟投资组合、计算因子收益率。它是通过时间序列回归检验股票多因子模型的基础。在结束2.1节之前，最后再来讨论一个问题：因子命名。


    # 2.1.4 因子命名约定


    因子命名本身并无严格的要求。但之所以需要约定一个命名方式，是因为无论是在学术界的研究还是业界的实践中，对同一个因子往往有很多不同的称呼。仍以BM为例。在Fama
    and French（1993）三因子模型中，两位作者使用BM和市值双重排序构建了一个HML因子。HML是High-Minus-Low的首字母缩写，而其中High代表BM高的股票，Low代表BM低的股票，Minus代表做多前者、做空后者。显然，人们也可以把它称作BM因子——这个名字以构建因子的变量为出发点；又或者把它称为价值凹因子——这个名字以该变量代表的股票风格（style）为出发点。无论是叫HML因子、BM因子还是价值因子，它们指代的都是同一个因子模拟投资组合、同一个因子。为了本书前后一致性，本小节对书中使用的因子命名方法进行说明。在因子命名时，考虑的因素是命名的方便程度以及名字是否能清晰地传达因子的含义。


    首先，本书不采用Fama and French（1993）的命名方法，原因如下。任何一个变量排序都可以把股票分成高、中、低不同的分组，并构建一个High-Minus-Low组合。如果大家都叫HML因子，则无法加以区分。举例来说，在Fama
    and French（2015）五因子模型中包括使用BM构建的HML因子和使用ROE构建的盈利因子。Fama and French（2015）将ROE和市值一起进行双重排序，并通过做多高ROE的组同时做空低ROE的组构建了该盈利因子。由于High和Low两个词已经被HML因子占用了，Fama
    and French（2015）则想出了使用稳健（Robust）和疲软（Weak）来代表高、低两个ROE组合，并以Robust-Minus-Weak即RMW为该因子命名。这种做法的优点是，它能体现变量和收益率之间是正相关还是负相关。比如无论是HML还是RMW，都代表变量高取值组和变量低取值组的差异，这意味着BM或ROE和股票收益率呈现正相关。而在Fama
    and French（1993）中，代表规模的SMB因子是Small-Minus-Big的缩写，它则表示市值和收益率呈现负相关，即小'
