- pgno: 297
  md: '量的预测能力。然而这么做的代价是很高的换手率。除非收益非常可观，否则往往难以覆盖由此造成的高昂的交易成本。另外，对于衰减快的预测变量，就算是其获取的超额收益能够覆盖成本的损耗，其容量往往也较低，难以承受较大的资金量。在实际投资中，需要在信息利用效率和调仓频率之间权衡。


    除了信息衰减，同样需要考虑的还包括市场冲击成本。如果新变量选出来的股票流动性很差，则隐形的冲击成本就会比较高，造成超额收益看得到却拿不着。在这方面，比较典型的是Amihud（2002）计算的非流动性指标（ILLIQ），它看起来让人兴奋，实则很难交易。ILLIQ可以理解为单位成交额对应的涨跌，可以用来衡量股票的流动水平，其值越大，流动性越差，能获得的非流动性溢价也就越高。


    # 6. 普适性


    普适性是考察预测变量的最后一个标准。具有普适性的变量能够经受起不同市场的检验，广泛存在于各个国家和资产类型中。这其中的优秀代表要数价值和动量。Asness
    et al.（2013）在美国、英国、日本、欧洲等成熟股票市场，以及股票、债券、商品期货及外汇等资产类型中，均发现了明显的价值和动量效应。


    # 7.1.4 收益率预测


    一旦有了预测变量，接下来就是通过它们预测收益率，并最终选股。这个过程涉及的步骤包括确定投资范围、剔除预测变量异常值和预测收益率几部分。在预测收益率时又包括非参数化预测和参数化预测。下面依次说明。


    # 1. 确定投资范围


    投资范围的确定包括原始股票池和优化股票池两步。原始股票池限定了最原始的投资范围，指明可供选择的股票有哪些。普通投资者在选择股票时几乎不受限制，只要在相应的板块开了股票账户，便可以交易任何一支股票，因此普通投资者的投资范围是全市场。但对于行业基金产品，例如医药基金，其选股范围只能限制在医药行业内，因而已买不了、也不会买其他行业上市公司的股票。最后，对于指数增强产品来说，例如中证500增强基金，其投资范围就天然限定了在中证500指数的成分股中挑选股票，如果买入了沪深300指数的成分股，便被视作越线。常见的原始股票池范围如表7.3所示。


    # 表7.3 原始股票池范围


    | 投资范围 | 举例 |

    |---|---|

    | 全部 A 股 | 沪深两市主板、中小板、创业板和科创板股票均可交易 |

    | 指数成分股 | 中证 500 指数成分股和沪深 300 指数成分股 |

    | 行业成分股 | 医药类股票、房地产类股票和国防军工类股票 |


    确定了原始股票池后便进入第二步，对其进行优化。在初始投资范围的基础上，为了防止掉坑踩雷，通常会进一步剔除掉有缺陷的股票（黑名单），得到更加干净的股票池子。从黑名单的来源上，可以分成三类：低流动性股票、高风险'
  merge: -1
  img_proc: true
- pgno: 298
  md: '股票和大概率跑输股票。


    首先来看低流动性股票。一般来说，在控制其他因素后，股票收益率会随着流动性的降低而增加。也就是说，如果愿意承担流动性风险的话，会获得非流动性溢价（Amihud
    2002，Pástor and Stambaugh 2003）。但是流动性差的股票冲击成本高，市场容量有限，并不适合机构资金运作。因此，很多投资机构将非流动性视为一个风险因子，在构造组合时将流动性极低的股票剔除。举例来说，中证指数在很多指数编制方案中都引入了流动性剔除规则（见表7.4）。


    再来看看高风险类股票，这类股票在3.1节有所提及，包括待退市股、风险警示股、净资产为负股以及次新股。由于上述股票潜在的风险较大，可能带来巨大亏损，因此在指数编制时需要剔除，基金合同中也明令禁投。除了这些常见的高风险标签之外，投资者也可以自行定义其他高风险类股票，例如“高商誉类股票”和“高负债股票”等。


    最后，长期大概率跑输大盘的股票，即具有负的超额收益率，可以在选股时事先剔除。根据经验，有三类股票应该给予考虑，它们是：从量价交易特征上看，具有高短期动量、高换手率和高波动的股票（即投机股）；从公司基本面来看，估值高而盈利差的股票（即低性价比股）；从事件驱动角度看，发生持续负向风险事件（如股东减持和财务造假等）的股票。


    # 表7.4 中证指数编制方案中对流动性的规定


    | 指数 | 举例 |

    | --- | --- |

    | 中证沪港深红利低波动指数 | 对非 ST、*ST 股票以及非暂停上市 A 股股票，按照最近一年（新股为上市以来）的 A 股日均成交金额由高到低排名，剔除排名后
    20% 的股票 |

    | 中证中信稳健成长策略指数 | 过去 60 个交易日的曰均成交金额不低于 1000 万元 |

    | 中证港股通红利低波动指数 | 剔除样本空间内过去一年日均成交金额低于 4000 万港元的股票 |

    | 中证香港质量成长指数 | 过去一年日均成交金额大于 2000 万港元 |


    # 2. 剔除预测变量异常值


    不同的预测变量暗含了不同的信息，数值差异越大表明信息差异越大。但需要警惕的是，变量值只是股票某一个特征的代理变量，应满足一个合理的分布区间。在计算时由于数据质量问题和计算方式的选择，可能会造成异常值，给后续研究带来干扰。这时就需要对预测变量在股票截面上的异常值进行处理。这样做的目的
    一方面是为了排除数据错误，另一方面让数据的分布更加均匀。剔除异常值的方法较多，常见的有缩尾法、三倍标准差法和中位数法。


    缩尾法（winsorization）最简单也最常见，是学术论文中应用最为普遍的方法。缩尾法又被称为固定比例法，即按照变量从小到大进行排序，将小于 p% 分位数和大于
    1-p% 分位数的指标值剔除（或者用临界点值替代）。缩尾法虽然简单易用，在学术论文中也是标准方法，但依然存在较多缺陷。首先，对于某些指标（如异常换手率），异常值并不常见，强行使用缩尾法会将原本合理的数据删除。其次，对于异常值很多的指标，如果临界点取得较小，会造成异常值剔得不干净。最后，对于分布不对称的指标，异常大和异常小数量差异较大，因而在分布的左尾和右尾采用同样百分比确定临界值也不恰当。'
  merge: -1
  img_proc: true
- pgno: 299
  md: '另一种常见的方法是三倍标准差法。在概率分布中，标准差反映了分布的离散程度。对一个满足正态分布的随机变量而言，其取值落入均值左右一倍标准差内的概率是68.3%，落在两倍标准差内的概率是95.4%，落在三倍标准差内的概率是99.7%。因此随机变量的取值落在三倍标准差之外的概率非常小，不足0.3%。受到上述启发，均值方差法将距离均值超过3σ视为小概率事件，若取值满足这一条件，则被视为异常值。均值方差法比较直观易懂，考虑了数据的波动情况，在数据满足正态分布或者接近正态分布时，具有较好的识别异常值效果。然而，正所谓“成也萧何，败也萧何”，当数据偏离异常值较大时，均值方差方法可能就会出现偏差，难以达到理想的效果。除此之外，由于均值和方差在计算时本身也会用到全部样本数据，即异常值会影响均值和标准差的计算。若部分异常值特别大，导致σ值很大，则距离均值±3σ的范围就会很宽，造成看起来是异常值但却无法识别到的窘境。


    最后一种常见去异常值的方法是绝对中位差（median absolute deviation，简称MAD）法。考虑到样本均值和标准差不够稳健，容易受到异常值的影响，因此将均值用中位数代替，将标准差用绝对中位差代替，这样就得到了MAD法。中位数（Median）又称中值，是按顺序排列的一组数据中居于中间位置的数，它不受数据分布的极大或极小值影响。令Xi代表股票i的某预测变量的取值，令Xm代表Xi的中位数，则绝对中位差（MAD）的定义为：


    ```

    MAD=median (|Xi-Xm|)  (7.2)

    ```


    该式的含义是，用原数据减去中位数后得到新数据序列，然后将该序列取绝对值后再找出中位数即为MAD。一般来说，在描述数据离散程度时，标准差和MAD并非1比1的关系，因此需要给MAD乘以一个系数。考虑到当随机变量服从正态分布时，1标准差约为1.4826倍的绝对中位差，因此将式（7.2）中的MAD乘以系数1.4826得到最终的偏离幅度，记为MADₑ。对于任意Xi，如果它偏离中位数Xm的距离（左右两侧）超过3×MADₑ，则被称为异常值，需剔除或用Xm±3×MADₑ之一代替。相比于均值和标准差，无论是中位数和绝对中位差都更能适应数据中的异常值，少量的异常值不会干扰到异常值的识别，从而提高异常值的识别准确度。但是当异常值较多时，这种方法也仍然会出现识别盲区，无法排除所有异常值。


    # 3. 非参数化预测


    一旦选定了股票池并剔除了预测变量异常值之后，接下来就使用预测变量选股。首先来看非参数化预测的方法，包括条件选股和排序打分两种。由于这两种方法对于变量和收益率之间的具体关系不做假设，而仅是利用二者之间的单调相关性，故而称为非参数法。


    条件选股法非常常见，大多数量化平台和行情软件都提供该功能模块。条件选股只需要简单的两步：（1）确定预测变量（即选股指标，例如BM、ROE和EPS变化率等）；（2）对于每一个变量，设定一个筛选条件（例如BM>0.5和EPS变化率>10%），选出所有满足条件的股票。举个例子，假设投资者想要买入“估值低并且盈利强”的股票，并使用BM和ROE分别作为衡量价值和盈利的变量。在每个月月末，用如下两个条件进行筛选：（1）BM>1/3；（2）ROE（TTM）>10%。选择出来的股票等权重持有并每月调仓。在不考虑成本的情况下，该选股策略的累计收益率如图7.1所示。'
  merge: -1
  img_proc: true
- pgno: 300
  md: '![](img/8ad8b7f696519d8b709b07f70d7ebfdb_300_0.png)


    图7.1 以BM和ROE（TTM）为变量条件选股的累计收益率


    条件选股法简单直接，许多传奇基金经理的选股方法均可描述成条件选股[4]，但它的不足也很明显，在使用时需要注意以下问题。第一，选股条件不能过多或过少。若条件太多，满足所有条件的股票可能很少甚至不存在；若条件太少，筛选出来的股票又太多，对资金少的投资者来说会在交易层面造成困难。第二，条件选股往往造成持股数量在时序上非常不稳定。第三，由于需要给每个预测变量设置一个阈值，因此发生过拟合的可能性较高。第四，非参数化的条件选股结果往往难以和投资组合优化模型相融合，因而无法实施更精确的组合管理和风险控制。


    另一个非参数化预测方法是排序打分法。在该方法中，使用每个预测变量分别对每只股票排序，排序时遵循“排名和预期收益正相关”的原则，因此排名靠前的股票得分高，未来预期收益率也更高。按照每个变量排序后，将所有变量上的得分加总便得到股票的总分，并从中选出总分最高的Nₕ支。依然以BM和ROE（TTM）为预测变量，在每月月末选择总分最高的50支股票等权重配置。该方法的累计收益率如图7.2所示。


    排序打分法能较好地解决条件选股法的缺陷。它能同时考虑多个指标，且选股数量能够保证稳定和可控，参数过度拟合嫌疑也更低。其缺点是基础的排序打分法假定每个变量的权重相同，不考虑预测变量预测能力的差异以及预测能力的
    变化。同样的问题在条件选股法中也依然存在。确定预测变量之间的权重属于因子择时的范畴，将在7.5节讨论。'
  merge: -1
