    # 图3.19 双重排序构建的价值因子累计收益率（市值加权）


    2019年，Liu et al.（2019）因为其是首个在金融学顶刊上发表的针对中国A股市场的多因子模型而备受关注。该文的两个特点是：（1）出于对A股市壳价值污染的考虑，剔除了市值最低的30%的股票；（2）使用EP取代BM构建了价值因子。由本节的实证结果可知，BM在小市值中的作用要远远高于在大市值中的作用。因此剔除市值最低的30%的股票无疑会进一步削弱BM的显著性。另一方面，从接下来3.6节关于盈利因子的实证可以看到，在A股中使用ROE为变量构建的盈利因子在小市值中的表现显著弱于其在大市值中的表现，因此剔除市值最低的30%的股票则在“无形中”提升了盈利因子的表现。最后，最为关键的是，由简单的会计学关系可知EP=BM×ROE。所以，市值最低的30%的股票被剔除实则在削弱BM的同时，提升了EP的效果！此消彼长，以EP构建价值因子“优于”以BM构建价值因子也就顺理成章了，然而这完全仅是实证数据展示出的现象。虽然壳污染问题在A股臭名昭著，但以30%为界一刀切是否合理？且在这个基础上，仅凭实证结果的好坏差异就选择EP取代BM也缺乏金融学依据，无法令人信服。Liu
    et al.（2019）通过详尽的统计检验分析了EP和BM在A股上的差异，并指出无论是否剔除30%最低市值的股票，以EP代替BM都难言合理。本书第4.3节将对此进行探讨。


    [1]Rosenberg et al.（1985）也有类似的发现。


    [2]该文研究的是负债权益比率（debt-equity ratio），而由于总资产=总负债+权益，因此负债权益比率同资产负债率本质上是一样的（1/资产负债率=1/负债权益比率+1），都反映企业的经营杠杆。


