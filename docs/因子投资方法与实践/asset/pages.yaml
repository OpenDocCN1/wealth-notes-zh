    | 标普道琼斯（S&P Dow Jones） | 使用透明和明确的规则编制另类加权指数，以捕获因子风险溢价。 |

    | Wealthfront | 相比市值加权，Smart Beta 采用多个因子得到更智能的权重，以增加预期回报。 |

    | Betterment | 在同一资产或不同资产内，通过一系列明确定义的因子，以获得目标收益和组合分散化。Smart Beta 偏离了市值加权，介于主动投资和被动投资之间。
    |


    表7.8中涉及的机构包括资产管理公司、指数编制商、数据资讯公司和智能投资顾问等。它们的业务和客户差异较大，因此对Smart Beta的定义也存在区别。尽管如此，还是能够从中总结出Smart
    Beta的如下要素：（1）偏离传统的市值加权宽基指数；（2）规则清晰和透明，可复制性强；（3）主动在一个或多个因子上暴露；（4）追求增强收益或降低风险。


    综合上述信息，本书可以将Smart Beta定义如下：在某类资产内，以更高的收益或更低的风险为目标，针对一个或多个具有风险溢价的因子来确定投资组合持仓及权重。由此可见，Smart
    Beta选择通过主动偏离传统的市值加权指数，以获得更好的投资结果。在资产管理领域有两个对立的流派：被动投资和主动投资。而 Smart Beta被认为介于二者之间（如图7.3所示）。


    被动投资认为市场是有效的，想要持续获得战胜市场的超额收益十分困难，因此最好的投资方式就是持有市场组合。该组合以股票市值作为加权依据，市值越高权重越大。被动投资有诸多优点，包括容量较大、易于实施以及成本较低等。不过，业界对被动投资的批判之声也不绝于耳。例如Arnott
    and West（2006）认为市值加权组合高估了成长股，低估了价值股，并不是一种理想的投资方式。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_329_0.png)


    图7.3 被动投资、主动投资和Smart Beta的关系'
