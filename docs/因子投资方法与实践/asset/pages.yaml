    # 2.7.2 分析框架


    回顾了样本均值的方差之后，本节就来解释GMM到底是怎么回事儿。GMM的作用是为了检验模型，比如模型到底对不对？模型的参数如何估计？误差是来自运气还是因为模型有误？GMM提供了一个优雅而强大的计量经济学框架来回答这些问题。一般来说，GMM框架分为以下三个部分。


    +   - 第一部分：把关注的问题表达成一系列总体矩条件，即提出模型。\n- 第二部分：使用样本数据得到对应的样本矩条件，从而对参数进行估计，即把模型和数据联系起来。\n-
    第三部分：计算参数的标准误（方差），并进行统计检验，即检验模型。


    # 1. GMM第一部分


    在接下来的讨论中，令x_t代表数据，b代表参数（它们都是向量）。在使用GMM时，将猜想的模型描述成一组关于x_t和b的函数f（x_t，b），且当b=b0时如下的矩条件成立：


    ```

    E[f(x_t, b_0)]=0 \quad (2.106)

    ```


    式（2.106）左侧的E[f（x_t, b0）]是总体矩（population moments），而约束（2.106）就是总体矩条件（population
    moment conditions）。它们表示当猜测的模型正确时，参数和数据应该满足的关系，因此它们就是待检验的原假设。需要说明的是，期望符号E表示对总体求均值；而前面使用的（接下来也将会继续使用的）期望符号E_T表示对样本求均值。GMM的第一部分是把研究的问题转化成数据和参数的一组矩条件E[f（x_t,
    b0）]=0。


    为了加深理解，来看资产定价中的例子。Cochrane（2005）指出资产定价理论都可以归结到一个最基础的式子：


    ```

    p_t = E[m_{t+1} x_{t+1}] \quad (2.107)

    ```


    其中m是随机折现因子（stochastic discount factor，由参数b0决定），x_{t+1}是某个投资未来的回报，p_t是该投资现在的价格。因此这个式子说明某个投资未来的回报的现值等于今天的价格。举例来说，令R^f_t代表无风险资产的总回报，即t期投'
