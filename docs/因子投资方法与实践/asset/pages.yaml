  md: 'DM12 = \frac{\bar{d}_{12}}{\hat{\sigma}_{\bar{d}_{12}}}  (6.34)

    其中 $d_{12} = \frac{1}{N} \sum_{i=1}^{N} \left( (e_{it+1}^{(1)})^{2} - (e_{it+1}^{(2)})^{2}
    \right)$


    上式中N为样本外的股票数量，$d_{12}$为两个模型在样本外的均方误差的差异，而$\bar{d}_{12}$和$\hat{\sigma}_{\bar{d}_{12}}$分别为$d_{12}$的均值和均值的标准误，$e_{it+1}^{(1)}$和$e_{it+1}^{(2)}$分别为两个模型对于股票$i$的预测误差。由定义可知，$DM_{12}$越大，表明模型1相对模型2表现越差；反之则表明模型1相对模型2表现更好。


    基于从1957到2016年的长达60年的美股数据，Gu et al.（2020）仔细研究了不同模型的表现。他们考虑了94种公司特征和8个宏观变量及它们的交互项，并另有74个行业分类，得到总共94×（8+1）+74=920个特征。在此基础上，该文比较了13个预测模型，包括6个线性模型算法（即包含全部特征的OLS回归，只包含规模、账面市值比和动量的OLS回归、PLS、PCR、弹性网络，以及广义线性回归）、2个树模型（随机森林和GBDT）以及5个神经网络模型（分别包含1到5层隐藏层），且对于OLS、弹性网络、广义线性回归和GBDT，使用Huber稳健估计量。从全样本来看，OLS的表现非常糟糕（且对大盘股而言更是如此）。而只考虑三个特征的OLS，或者弹性网络等方法，通过添加额外的惩罚项，表现得到了显著的提升。此外，GBDT和随机森林表现也不错。然而在众多模型中，表现最好的非线性模型还要数神经网络模型，尤其是带3层隐藏层的神经网络模型。当采用样本外R²_OOS为评价标准时也有类似的结果。除此之外，模型间的两两配对比较则有如下发现：所有带约束的线性模型的表现都显著优于普通OLS，而在降维方法（PLS/PCR）和惩罚性回归模型的表现则没有明显差异；树模型表现相比线性模型更好，但差异并不显著；神经网络表现显著优于线性模型，但相对树模型的改进则不够显著。


    除了比较不同模型的表现外，Gu et al.（2020）的实证分析还有另外一个重要作用，即比较不同特征对于股票定价的重要性。该文将所有公司特征分为四大类：趋势类特征（例如各种动量和短期反转）、和流动性有关的特征、风险测度指标，以及基本面特征。他们发现线性模型普遍高度倾向趋势类特征，而非线性模型则会较为平均地关注多种公司特征。总体而言，趋势类特征的影响最为显著。


    除上述针对美股的代表性研究外，近些年也有不少学者研究了机器学习算法在中国A股市场的表现，并有类似的发现。总体而言，带约束的线性模型表现优于OLS，非线性模型又优于线性模型。在非线性模型中又尤其以深度前馈神经网络（DFN）和XGBoost表现非常出色。此外，利用集成学习整合不同模型也可以进一步提升模型表现。而在特征重要性方面，已有研究表明，在A股市场中最为重要的因子是交易摩擦类（流动性）相关因子，这与美股市场有所不同。


    # 6.8.4 主成分分析和因子选择


    近年来，一些新的研究将无监督学习算法引入实证资产定价和因子投资，用'
