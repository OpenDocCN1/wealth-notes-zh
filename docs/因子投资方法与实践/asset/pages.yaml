  md: '多最低IVOL组、做空最高IVOL组构建的特质性波动率异象组合的收益在绝大多数情况下均非常显著（市值加权比等权重时显著性降低，但依然显著）。以Fama-French三因子-α为例，在等权重时该异象的月均超额收益为1.27%（t-值高达8.64）；在市值加权下，月均超额收益降至0.82%，但t-值仍有3.64。


    在上述结果中，唯一的例外是当市值加权时，若以Liu-Shi-Lian四因子模型为定价模型，特质性波动率异象组合的月均超额收益仅为0.36%，其t-值为1.62，因此不再显著。回顾5.1.3节和5.2节两节分别介绍的预期差和基本面锚定反转异象，当采用市值加权构建这些异象组合时，它们在Liu-Shi-Lian四因子模型下的超额收益也都不显著。加之本节的结果，在市值加权下，本章考虑的全部三个异象均能够很好地被该定价模型解释。这从一定程度上说明该模型对A股市场的适用性。


    接下来考察表5.10至表5.13中不同的错误定价分组内，能否观察到和Stambaugh et al.（2015）一样的结论。为了更清晰地展示结果，图5.14和图5.15以Fama-French三因子定价模型为例，分别给出了等权重和市值加权时这25个投资组合的超额收益。在最被高估档内的5个IVOL组中，IVOL和收益率呈现出负相关。然而，在最被低估的档内的5个IVOL组中，并没有观察到和美股一样的正相关。但值得注意的是，在最被低估组中，以IVOL划分的前三组的确呈现出正相关的现象，即高IVOL对应着高的平均收益率；而如果将第四组也纳入比较，前四组的秩相关系数在等权重和市值加权下分别为-0.20（不显著）和0.80（依然呈现一定的正相关性）。但有意思的是，最高IVOL组的收益率却显著低于其他几组，从而造成即便在最被低估的股票中，通过做多低IVOL组、做空高IVOL组得到的低特质性波动率异象依然显著。当采用CAPM或Liu-Shi-Lian四因子模型为定价模型时，上述结论也依然成立。该结果与Stambaugh
    et al.（2015）在美股中观察到的现象有所不同，它可能和A股市场的高噪音以及高换手率有关，值得进一步探索。


