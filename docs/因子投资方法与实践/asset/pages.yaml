    # 3.1.4 因子构造流程


    3.1.2节和3.1.3节介绍了股票量价数据和财务数据的常见处理方法。有了数据之后便可使用投资组合排序法构造因子，分析因子收益率等。在实际研究和使用因子时，往往需要处理以下几个问题：（1）如何确定股票池；（2）异常值处理；（3）投资组合排序法中分组的参数设定和调仓频率。本节回答上述问题并介绍本书中数据处理时采用的流程。


