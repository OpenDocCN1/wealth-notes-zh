  md: '在截面上计算其标准化的Z-Score：


    ```

    z_{ij} = \frac{x_{ij} - E[x_{ij}]}{\sigma(x_{ij})}\n\tag{7.82}

    ```


    盈利稳定性以及债务负担率底层逻辑和预期收益率负相关，因此这两个指标的得分需要乘以-1。得到股票在这三个变量上的得分后，将其取平均就得到股票在其上的综合得分Z_i，最终的股票i质量得分Q_i由式（7.83）得到：


    ```

    Q_i = \begin{cases} 1 + Z_i & \text{若 } Z_i > 0 \\ (1 - Z_i)^{-1} & \text{若 }
    Z_i < 0 \end{cases}\n\tag{7.83}

    ```


    将投资范围内所有股票按照质量得分降序排列，选择排名靠前的N支股票入选质量指数的成分股。最后一步是确定每个成分股的权重。明晟质量指数成分权重由质量得分和股票市值共同决定，既能保证因子暴露足够高，又能保证容量足够大。这种权重方式也被称为市值调整法（market
    capitalization scaling）。令s_i代表股票i的市值，使用市值和质量得分的乘积计算权重如下：


    ```

    \omega_i = \frac{s_i Q_i}{\sum_{j \in I} s_j Q_j}\n\tag{7.84}

    ```


    式中I为选出的N支股票的集合。该方法融合了市值和质量因子变量，因而在流动性和因子暴露之间达到了某种平衡。


    # 7.4.2  为什么要投资Smart Beta


    通过和被动投资与主动投资的对比可知，Smart Beta兼具两类投资方式的良性基因，这也是人们选择Smart Beta的原因所在。总结起来，选择Smart
    Beta有如下四个理由：增加收益、降低风险、节约费用和增加透明度。


    # 1. 增加收益


    被动投资主要捕捉市场风险溢价，收益来源较为单一；主动投资收益来源虽然较为多元化，但是却难以区分管理人的能力和运气。Smart Beta具有明确的因子暴露，可以从价值、质量和动量等多个角度获取风险溢价。因此，如果将宽基指数基金或者主动管理基金换成Smart
    Beta产品，能够获得确切透明的收益增厚。


    下面以传统的60/40股债组合为例展示Smart Beta对收益率的增强效果。在本书关于Smart Beta的所有实证中，宽基指数和因子指数均使用三位作者自己维护的BetaPlus
    1000指数系列⑧。在投资实务中，60/40股债组合是最常见的分散化策略，该策略将60%投资股票资产，剩下的40%投资国债。如果将60%的权重平均分配给6个Smart
    Beta指数，能显著增强60/40组合的表现。图7.5展示了传统60/40组合和Smart Beta增强60/40组合的累计收益。前者年化收益率为6.68%，年化夏普比率为0.48；后者年化收益率为9.11%，年化夏普比率为0.60。将Smart
    Beta加入60/40组合'
