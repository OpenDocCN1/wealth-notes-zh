    # 9. TTM数据


    TTM是Trailing Twelve Months首字母的缩写，即滚动12个月数据，以消除季节性差异使得横向可比，具体计算流程见图3.9。在计算过程中，值得一提的是对资产负债表科目的处理方法。由于资产负债表是时点数据，如果要计算其科目的TTM数据，那么有三种常见的算法：（1）当前最新数据；（2）最近四个报告期'
