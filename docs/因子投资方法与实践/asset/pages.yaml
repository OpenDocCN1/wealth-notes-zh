  md: "回到本节的重点，异象检验的第一种方法非常直接，即时间序列回归。令 $R_t^e$ ($t=1,2,\\cdots,T$) 代表 $t$ 时刻异象收益率，$\\\
    lambda_t$ ($t=1,2,\\cdots,T$) 代表 $t$ 时刻因子收益率向量（假设共有 $K$ 个因子）。在检验异象时，原假设是异象收益率中不存在因子无法解释的部分，即\
    \ $\\alpha=0$。为检验它，用 $\\lambda_t$ 作为解释变量、$R_t^e$ 作为被解释变量进行时序回归 OLS 估计：\n\n```\n\
    $R_t^e = \\hat{\\alpha} + \\hat{\\beta}_\\alpha' \\lambda_t + \\hat{\\varepsilon}_t,\
    \ \\; t=1,2,\\cdots,T\\qquad(2.50)$\n```\n\n式中，$\\hat{\\alpha}$ 是截距项，它是 $\\alpha$\
    \ 的估计值，代表异象收益率中无法被多因子模型解释的部分；$\\hat{\\beta}_\\alpha$ 为该异象在 $K$ 个因子上的暴露向量的估计，它的取值告诉人们哪些因子对解释异象收益率起了作用；$\\\
    hat{\\varepsilon}_t$ 是残差。OLS 除了给出上述参数的估计外，还会计算出它们的标准误。由于目标是检验异象能否获得显著超额收益，因此使用\
    \ $\\hat{\\alpha}$ 和它的标准误 s.e.($\\hat{\\alpha}$) 计算 $t$-值：\n\n```\n$t\\text{-值}\
    \ = \\frac{\\hat{\\alpha}}{\\text{s.e.}(\\hat{\\alpha})}\\qquad(2.51)$\n```\n\n\
    在时序回归中，总的期数为 $T$。另外，解释变量包括一个截距项以及 $K$ 个因子，故而一共有 $K+1$ 个解释变量。因此，式（2.51）中 $t$-值满足的\
    \ $t$ 分布的自由度为 $T-K-1$。最后，根据 $t$-值和 $t$-分布就可以计算出 $p$-值，从而决定是否在给定的显著性水平下拒绝原假设。如果原假设\
    \ $\\alpha=0$ 被拒绝，那么就称 $R_t^e$ 背后的资产为异象。\n\n其实，对于异象的检验到这里就告一段落了。然而，在时间序列回归中有一个必须面对的计量经济学问题。当时间序列的随机扰动有自相关性或者异方差时，OLS\
    \ 的标准误就是不准确的，这就造成计算出的 $t$-值也是失真的。下面 2.4.2 节首先说明这个计量经济学问题，然后 2.4.3 节给出解决办法。\n\n\
    # 2.4.2 计量经济学问题\n\n接下来暂时跳出多因子模型，讨论回归分析中普遍存在的计量经济学问题。考虑总体（population）的广义线性回归模型（generalized\
    \ linear regression model）公式如下：\n\n```\n$\\boldsymbol{y}=\\boldsymbol{X}\\boldsymbol{b}+\\\
    varepsilon$  \n$E[\\varepsilon|\\boldsymbol{X}]=0$  \n$E[\\varepsilon\\varepsilon'|\\\
    boldsymbol{X}]=\\sigma^{2}\\Upsilon=\\Sigma\\qquad(2.52)$\n```\n\n其中 $y$ 是 $T$\
    \ 维向量；$X$ 是 $T\\times (K+1)$ 解释变量矩阵（其中 $K$ 是解释变量的个数，外加一个截距项）；$b$ 是 $(K+1)$ 维回归系数向量；$\\\
    varepsilon$ 是 $T$ 维随机扰动向量；$\\Sigma$（$T$ 阶）是 $\\varepsilon$ 的协方差矩阵。上述模型和经典线性回归模型最大的区别是正定矩阵\
    \ $Y$ 的引入。在经典模型中假设给定解释变量 $X$ 下，$\\varepsilon$ 满足独立且同方差，因此 $Y$ 是单位阵 $I$。\n\n在广义线性回归中，$\\\
    varepsilon$ 独立、同方差这两个假设均可被打破，从而得到两个常见的特性：异方差（heteroscedasticity）和自相关（autocorrelation）。在广义线性"
