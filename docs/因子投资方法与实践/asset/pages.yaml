    # 2.1.3 多重排序法


    # 1. 双重排序


    在多重排序法中，最重要的是双重排序（double sorting或bivariate sorting）。所谓双重排序，即按照两个变量排序并构建因子模拟投资组合。考虑两个排序变量X1和X2，将股票按照这两个变量分别划分为L1和L2组，一共得到L1×L2个组合。在双重排序时，一处非常关键的细节是使用这两个变量分别独立对股票排序，还是这两个变量在排序时存在先后的依存关系。前者被称为独立双重排序（independent
    double sorting或unconditional double sorting），或者是被称为条件双重排序（dependent double sorting或conditional
    double sorting）。


    首先来看独立双重排序的情况。假设使用两个排序变量分别独立地把股票划分成5组，即L1=L2=5，它们两两取交集一共得到25个投资组合，如图2.2中的P11到P55所示。在划分时，最常见的做法是取这两个变量各自的五分位数。这25个投资组合中股票的权重可以采用等权重或市值加权。接下来，通过这25个组合就可以围绕给定的变量构建因子模拟投资组合了。以X1为例，构建的思路和单变量排序一样，仍然是做多在该变量上排名高的股票、做空在该变量上排名低的股票，并满足资金中性。由于采用了双重排序，因此对于变量X2的每一档，都存在一个在变量X1上排名高的投资组合。换句话说，一共有L2（=5）个这样的组合，它们是P51、P52、P53、P54以及P55。类似的，一共有L2（=5）个在变量X1上排名低的组合，它们是P11、P12、P13、P14以及P15。最后，等权重做多L2（=5）个高排名组合、做空L2（=5）个低排名组合，就得到了围绕X1构建的因子投资组合。令Rij,t代表投资组合Pij第t期的收益率，则该因子第t期的收益率λX1t为：


    ```

    λX1t = 1/L2 Σ (i=1 to L2) R L1 i,t - 1/L2 Σ (i=1 to L2) R 1 i,t

    (2.5)

