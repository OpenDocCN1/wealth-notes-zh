    通过对宏观经济变量和因子表现的研究，Bender et al.（2018）发现比较明显的规律包括：（1）期限利差和盈利因子呈高度负相关，且持仓时间越长负相关性越高，这表明利率上升不利于企业盈利；（2）当持仓超过6个月时，TED和期限利差两个因子对价值、盈利、投资有相当强的预测能力；（3）当持仓在1年以上时，单位产出增长率、个人储蓄率、CPI和PPI四个指标与价值和投资因子具有较强的相关性。


