  md: '# 1.2 因子投资的学术起源


    学术界对于因子的研究可以追溯到20世纪30年代。Graham and Dodd（1934）提出了价值溢价，而这本Security Analysis（证券分析）也早已成为业界的圣经。之后的60年代和70年代，CAPM和APT相继被提出，它们为研究因子提供了定量的分析工具。自20世纪70年代以来，学者们逐渐发现按照某种风格“打包”的股票能够战胜市场。这其中最值得一提的是Basu（1977）发现的便宜股效应和Banz（1981）发现的小市值效应。由于它们和当时主流的有效市场假说相违背，因此被称为异象。也正是从那个时期开始，学术界开始了轰轰烈烈的因子研究大潮。


    # 1.2.1 实证资产定价


    对于学术界而言，研究因子的最主要目标是提出更好的资产定价模型。在这方面的研究中，2013年的诺贝尔经济学奖获得者Eugene Fama、Lars Peter
    Hansen以及Robert Shiller三位教授功不可没。


    对于Eugene Fama，各位读者可能并不陌生，他被誉为有效市场假说之父。他对市场有效性的最大贡献出自Fama（1970）这篇文章。该文提出了联合假设（joint
    hypothesis）问题，即要想检验市场的有效性就必须先有一个合理的资产定价模型。只有知道了定价模型给出的均衡状态下股票的预期收益率，才有可能正确地检验市场是否有效。毫不夸张地说，自20世纪70年代以来，学术界在实证资产定价方面的研究都是在联合假设的框架下进行的。


    在多因子模型方面，Eugene Fama也是当仁不让的代表人物。首先来看看多因子模型的特例CAPM。在CAPM被提出之后，学术界进行了大量的工作来检验它。其中颇具代表性的一篇文章是Fama
    and MacBeth（1973）。该文章中的方法在检验CAPM时，巧妙地规避了收益率随机扰动项截面相关性的影响，得到了更加令人信服的结果并拒绝了CAPM模型。值得一提的是，Fama
    and MacBeth（1973）虽然是为了检验CAPM，但提出的回归方法却得到了更广泛的传播，成了因子投资中的一个重要统计手段。


    除了检验CAPM之外，Fama的另一个贡献是在Fama and French（1992）一文中整合了学术界后来陆续发现的便宜股效应和小市值效应，它们均是CAPM无法解释的异象。面对诸多异象，人们再也无法无视不能被单一市场因子解释的系统性风险了，学术界也亟待一个新的定价模型的出现。这时Fama
    and French（1993）横空出世。该文在市场因子的基础上加入了代表便宜股和小市值效应的HML和SMB两个因子，构成了一个三因子模型。时至今日，Fama-French三因子模型早已'
