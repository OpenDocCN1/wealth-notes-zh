  md: '# 3.1 数据和流程


    # 3.1.1 数据来源


    基于数据质量和可得性的考虑，本书中使用的数据主要来自Wind[4]和Tushare[2]。其中基本信息、行情数据、指数成分和宏观数据来自Wind，财务数据来自Tushare。


    # 3.1.2 量价数据处理


    本书的全部实证研究均属于日线级别，因此数据频率也以交易日为单位，不涉及对高频数据的处理。量价数据主要指的是与行情相关的数据，包括开盘价、最高价、最低价、收盘价、成交量、换手率、交易状态和涨跌停状态等信息。量价数据比较纯粹、简单，各各个数据商提供的服务都差不多，在存储和处理上也比较简单。下面介绍几个常见的问题。


    # 1. 前复权和后复权


    由于股票存在配股、分拆、合并和发放股息等事件，会导致股价出现较大的缺口。若使用不复权的价格处理数据、计算各种指标，将会导致它们失去连续性，且使用不复权价格计算收益也会出现错误。为了保证数据连续性，常通过前复权和后复权对价格序列进行调整，示意图见图3.1。图中股价在t时刻发生跳变，实线a和b两段表示变化前后的实际价格。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_97_0.png)'
