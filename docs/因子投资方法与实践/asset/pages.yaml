- pgno: 241
  md: '回正 是 管理人 面对的 职业 风险，这 是 噪声 交易者 风险 的 直接 结果。


    # 3. 实施成本


    实施成本具体包括两部分：第一部分是为了建立套利头寸需要付出的成本，包括手续费、交易价差、价格冲击以及做空需要付出的费用等。在有些市场，做空难以实现，这进一步加大了实施套利的风险；第二部分是为了寻找错误定价所付出的成本，由于内在价值难以确定，因此判断价格是否等于内在价值本身就是非常困难的。


    在行为金融学发展之初，传统金融学对其最大的质疑是如果非理性行为造成了错误定价，那么它也是转瞬即逝的，因为理性投资者必然会对它进行套利，在获得收益的同时纠正错误定价。起初，上述批评确实阻碍了行为金融学的发展，但这个障碍在20世纪90年代随着套利限制的提出而被打破。


    # 6.3.2 预期中的偏差


    如果说有限套利使得价格无法回归价值是“果”，那么交易者的各种非理性行为造成的价格偏离价值正是“因”。行为金融学中的第二个支柱正是借助心理学的研究来分析人们的各种系统性认知偏差（cognitive
    biases）用的，它们影响了人们的预期以及做风险决策时的偏好。较传统经济学中的理性预期而言，本节介绍的内容属于预期中的偏差；6.3.3节介绍的内容较传统经济学中的期望效用理论而言，属于风险偏好中的偏差。正是传统经济学理论眼中的这些偏差构成了一个个鲜活而真实的投资者。下面首先来介绍预期中的偏差。


    # 1. 过度自信


    过度自信是一种根深蒂固的偏见，主要体现在两方面：（1）人们对自己判断的自信程度总是高于该判断的准确性；（2）人们总认为自己比别人更优秀，或自己的判断比别人的判断更准确。对于第一方面，在一项研究中，被试者被要求估计某地区加油站的数量，并给出90%的置信区间。实际结果显示，加油站个数落在这
    些区间内的频率只有50%左右，远远低于90%，说明被试者给出的置信区间太窄，也反映了他们对自己的估计准确程度过于自信。对于第二方面，在一项对600名基金经理的调研中，有74%的人认为自己比别的基金经理优秀。如果不存在第二方面问题，则这个比例应该接近50%。


    过度自信在很大程度上可以解释市场上每天庞大的交易量。假设两个投资者对于某个资产持有相同的先验信念。当新息出现后，由于他们对新息的处理方式不同，以及过度自信偏误，他们会认为自己对该资产未来的看法更加正确，这就导致了二者之间的意见不统一，从而带来交易的契机。Eyster
    et al.（2019）以过度自信为出发点构建了数学模型，将超高的交易量和过度自信联系起来。如果过度自信是造成超高交易量背后的原因之一，那么很自然的一个推论就是：越过度自信的人越倾向于去交易。Grinblatt
    and Keloharju（2009）的研究证实了上述猜想。


    # 2. 乐观主义


    乐观主义可能是人们与生俱来的一种本能。在2008年2月，有91%的分析师预'
  merge: -1
  img_proc: true
- pgno: 242
  md: '测市场会有牛市，应该持股。乐观又常常被控制幻觉所放大：人们总觉得结果是可控的，可以按预期发展，而一些偶然的好结果也加深了这种幻觉。比如在一个掷硬币的游戏中，如果一个人连续几次猜对了硬币的结果，他就会觉得他是“天选之人”，可以控制并继续正确地预测结果。然而当样本数量非常有限的时候，连续的盈利或亏损均有可能出现，这在统计上并不意味着什么显著的情况。


    自利偏差也容易产生乐观主义。自利偏差是指人们的决策往往倾向于有利于自己的利益。审计师的行为就是这么一个例子。在一项测试中，5个有争议和错误的会计报告被随机分配给139位审计师，每个报告都有明显的错误。这个测试中最有意思的部分是，这些审计师中有些被要求从这些会计报告涉及的公司的立场来评判这些报告，而另一些则要求从想投资这些公司的第三方投资人的立场来评判这些报告。结果，不说你也可以猜到，在认为这些报告没有问题的审计师中，从公司立场出发的人要比从第三方投资人立场出发的多31%。


    # 3. 代表性启发法


    Tversky and Kahneman（1974）的研究发现，当人们试图判断数据A是否来自模型B，或者样本A是否属于类别B的时候，往往使用代表性启发法

    （representativeness heuristic），即考察A和B的相似程度。这种做法可能造成一些严重的偏误。第一个偏误是忽视结果的先验概率。举个例子，通过下列对某男子的描述来判断他的职业：“他非常害羞、虽然乐于助人但却不喜欢与人打交道；他是一个温顺的人，执着于事物的有序性并对细节有极致追求。”请问他的职业是农民、销售、还是图书馆管理员？人们可以使用贝叶斯定理来判断该男子的职业：


    prob(职业|描述) = prob(描述|职业)prob(职业) / prob(描述)    (6.10)


    在这个过程中，忽略先验概率偏误指的是人们过度关注上述描述和职业之间的相似性，即上式中的prob（描述|职业），而忽视了某个职业出现的先验概率。在这个例子中，关于该男子的描述非常符合人们印象中图书管理员的特点。这将导致人们错误地认为他的职业是图书管理员。在现实世界中，农民比图书管理员要多很多，因此先验概率大得多，所以该男子其实更可能是一个农民。


    代表性启发法造成的第二个问题是人们对样本大小不敏感。在新闻报道中常有这样的标题：《大数据告诉你××月大盘怎么走》《大数据告诉你××节后是涨是跌》。点开一看，所谓的大数据就是一共十来个样本点。Tversky
    and Kahneman（1971）称这个问题为小数定律（law of small numbers）信仰，并指出人们往往相信仅仅有限个样本点就能反映出未知模型的全部特征。但统计学知识指出，当样本点非常少的时候，无法可靠地计算出变量的变化范围，因此这个错误也被称作小数定律偏误。


    代表性启发法和小数定律偏误可以导致（错误的）外推信念（extrapolative beliefs）。外推信念指的是当人们对未来做预测的时候，其预测值通常和当前数据正相关。在投资中，外推包括收益率外推和基本面外推。对于前者，当人们预测股票未来的收益率时，总偏好给近期的收益率更高的且大于零的权重。如果最近股价涨得好，人们倾向认为它未来还会涨得更高；如果最近股价跌得多，人们倾向认为它在未来会继续跌。对于后者，基本面外推指的是人们认为公司未来现金流变化率和近期现金流变化率正相关。如果近期现金流增长，人们会认为其盈利'
  merge: -1
  img_proc: true
- pgno: 243
  md: '在未来会按之前的增速继续增长，从而买入该股票、造成价格上升。一旦未来现金流的增长率不符合外推的预期时，就会出现非常失望以至于开始抛售资产，造成其价格下跌。


    # 4. 保守主义


    人们通常都有保守主义，即一旦观点形成，就拒绝接受信息；如果必须改变，那也是非常缓慢的。保守主义的原因是沉没成本。因为当一个人已经花费了很多努力（包括财力、物力和精力）才得到当前的结论时，他便不愿意轻易推翻它，哪怕它是错误的。


    在一项研究中，被试者被要求就下面这个场景回答问题。某飞机公司决定投入1000万美元制造一架隐形飞机。在项目进行到90%的时候得知另一家公司已经造出了隐形效果更好、成本更低的飞机。在这时，该公司是否应该把最后10%的预算，即100万美元，继续花费在该项目上？在面对这个问题时，80%的被试者认为应该。在另外一个场景中，问题的描述变成：该公司还有剩余100万美元的研究经费，公司一名员工提议用它研究隐形飞机，但同时得知另外一个公司已经造出了隐形效果更好、成本更低的飞机，这时是否应该把这100万美元花在这个项目上？面对这个问题，80%的被试者认为不应该。这两个场景的对比凸显了沉没成本在决策时对人的干扰。面对错误的决策，考虑沉没成本、当变不变只会让人们错上加错。在保守主义这种偏差下，投资经理经常拒绝推翻之前的投资决策，哪怕市场的运行方向证明其原方案是完全错误的。


    # 5. 确认偏误


    确认偏误，也被称为证实性偏差，指的是人们选择性地回忆、搜集有利细节，同时忽略不利或矛盾的资讯，以支持已有想法的片面诠释。在一个游戏中有四张卡片，上面分别为字母A、Q，数字4、7。被试者被告知“每一个元音字母卡片的背面都是一个偶数”并允许通过翻动两张卡片来检验该陈述是否为真。在这时，大多数人会选择A和4，因为它们是和上述陈述相符的卡片，但是确认性的证据并不能证明任何事。事实上，题目中并没有说偶数的背面是元音，因此翻动卡片4并不说明任何问题。正确的答案是翻动A和7，这样可以提供有价值的否定依据：如果7的背面是元音就可以确定“元音字母卡片的背面都是一个偶数”这个陈述是虚假的。


    就像上面的卡片例子一样，投资者在做投资决定时倾向于收集确证证据，而不是评估所有可用的信息。在分析公司基本面时，分析员有时很早就提出了结论，之后便陷入了确认偏误，努力寻找所有能够证明其观点成立的论据和数据，忽视那些使之结论不成立的数据。类似的，当处于亏损的交易之中时，交易者有时会拒绝接受事实，而是如饥似渴地寻找所有可能支持自己交易的证据，从而迷失自我。


    # 6. 锚定效应


    锚定指的是个人在做决定时过度依赖其被提供的初始信息（称为“锚”），哪怕该信息和所做决策毫无关联。锚定效应是指在生活和投资中经常出现的一种认知偏差。Tversky
    and Kahneman（1974）对此进行了大量的研究。在一个实验中，两组参与者分别猜测美国人口中非洲裔的百分比。在预测之前，首先在每组参与'
  merge: -1
  img_proc: true
- pgno: 244
  md: '者面前进行一次幸运大转盘，转盘的结果为0到100之间的一個随机数字。大转盘的结果和非洲裔的百分比毫无关系，按理说应该对预测结果没有影响，然而玄妙的事情发生了。第一组参与者得到的转盘结果为10，他们的猜测结果为25%；第二组参与者得到的转盘结果为65，他们的猜测结果高达45%。显然，不少参与者将大转盘的结果作为了“锚”。


    在另一个类似的研究中，600名基金经理被要求写下他们手机号码的后四位，并同时预测伦敦有多少个医生。在手机后四位大于7000的那些投资经理中，大部分预测伦敦有8000名医生；而在手机后四位小于3000的投资经理中，大部分猜测伦敦有4000名医生。我们都知道，电话号码后四位和医生个数没有什么关系，但基金经理们都用自己的手机号后4位作为了判断的基准。在投资中，锚定效应使得人们过分依赖某个历史数据而忽视最新的变化，从而无法做出最优的决策。


    锚定效应对於预测股票市场整体走势也有帮助。Li and Yu（2012）以道琼斯工业指数为对象，指出投资者往往使用过去52周高点以及历史高点两个数值为“锚”。他们发现，指数当前的数值和这两个锚定值之间的距离能够分别反映出投资者的反应不足和反应过度。如果当前价格和过去52周高点离得越近，则说明投资者对于个股基本面的好消息的反应越不足；如果当前价格和历史高点离得越远，则说明投资者对于个股基本面的坏消息的反应越过度。Li
    and Yu（2012）通过把上述两个效应叠加，有效地预测了道琼斯工业指数的整体走势。


    # 7. 可得性启发法


    可得性启发法是一种心理捷径，它指的是当人们评估问题、概念、方法或决策时，往往依赖于脑海中最容易想起来的那些示例。如当人们被询问英文中是以字母r开头的单词多还是r在第三个位置上的单词多时，会马上在大脑中搜索这满足这两种模式的单词。以r开头的比如return；r在第三位的比如car。对该问题的回答会基于哪种情况下想起的单词更多。由于人们轻而易举就能想起大把以r开头的单词，比如rat、road、read、result等，而想起r在第三位的单词却要费劲得多。因此会错误地认为以r开头的单词要多于r在第三位的单词，而事实恰恰相反（Tversky
    and Kahneman 1973）。


    可得性启发法背后的逻辑是，如果人们能够很容易想起某个示例，那么它一定是重要的。在这种认知偏差下，人们在投资中往往错误地被近期发生的事情所左右。不成熟的交易者会过分看重最近交易的结果，并让这些交易来支配他们未来的决定。在亏损后，交易者往往急于回本；在盈利后，交易者可能会信心爆棚。这两种状态都容易让人在随后的交易中变得更加草率。


    Barber and Odean（2008）的研究发现，投资者在选择股票时倾向于考虑那些最近引起他们注意的股票，诸如近期新闻中集中报道的股票、交易量异常大的股票，以及单日内回报极高的股票。毫无疑问，这些都会给投资者留下非常深刻的印象，从而导致他们出现可得性启发法偏差。同样的問題也出现在分析师中间。Lee
    et al.（2008）发现分析师倾向于使用最近的经验来判断事件的可能性。当经济扩张时，分析师对公司每股收益长期增长的预测往往相对乐观；而当经济收缩时他们则相对悲观。这个现象说明分析师在做出长期预测时夸大了经济当前状态的影响。'
