  md: '身相关的指标来择时不同，市场情绪从资本市场的不同特征观察因子表现。市场情绪也被称为投资者情绪，用来反映市场整体的乐观或悲观程度。通过刻画情绪状态，来反映投资者的风险偏好水平，从而预测市场和因子未来的表现。


    Baker and Wurgler（2006）详细讨论了市场情绪和因子表现之间的关系。一般来说，在市场情绪较为乐观时，投资者会偏爱具有进攻性质的股票，例如小盘股、新股和成长股；在市场情绪较为悲观时，投资者会偏爱具有防御性质的股票，例如低波动和基本面好的股票。正是因為在乐观时过度追逐进攻型股票，在悲观时过度追逐防御型股票，所以导致这些股票的价格被推至较高水平，过分高估会带来未来预期收益降低。因此在乐观时期之后，进攻型股票表现得不及防御型股票；相反，在悲观时期之后，防御型股票表现得不及进攻型股票。


    再来看一个简单的例子。Ung and Luk（2016）用波动率指数（VIX）来衡量投资者情绪，将市场划分为三种状态：乐观、中性和悲观。然后统计在不同状态下价值、质量、低波动、动量、股利、规模等因子的表现，见表7.23。


    可以看到，在市场乐观时，价值和动量因子表现较好，低波动因子超额收益率为负；在市场中性状态时，动量因子效果优秀；在市场悲观时，低波动、质量和股利等防御因子异常优秀，年超额收益率高超过10%，而此时动量因子效果较差。如果能有效预测市场波动率水平，在高波动市场中高配价值和动量，在低波动市场中高配质量和低波动，大概率能获得更令人满意的结果。


