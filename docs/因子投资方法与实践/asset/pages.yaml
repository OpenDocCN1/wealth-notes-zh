    # 7.4.4 应用实践


    本节从实际投资问题出发，介绍Smart Beta的应用场景和案例。


    # 1. 构造因子指数


    Smart Beta基金需要跟踪某一个因子指数，因子指数一般由专业的指数公司编制并发布，国外的典型代表有明晟、富时罗素、标普道琼斯和锐联，国内主要是具有官方性质的中证指数有限公司和深圳证券信息公司。一些证券公司以及第三方机构也有涉及。在接下来的Smart
    Beta应用实践中，为了让数据样本更多，也为了更加灵活地开展测试，本书采用三位作者自己设计的指数进行实证研究，所用到的指数包括BetaPlus 1000指数和系列因子指数。


    BetaPlus 1000指数对标罗素1000。它包含A股中总市值最大的1000支股票，代表了全市场90%的股票市值，它是实证中的基准指数。在BetaPlus
    1000指数的基础上，同时构造价值、质量、红利、动量、低波动和规模（小市值）共六大类因子指数。BetaPlus 1000指数以及6个因子指数均是综合考虑可投资性和高因子暴露的纯多头组合，具体编制方案见本书配套网站[4]。表7.15汇总了上述7个指数在2000-01-01到2019-12-31之间的历史表现。其中，BetaPlus
    1000指数年化收益率为7.24%，年化波动率为27.63%，和Wind全A指数的表现非常接近。另外，6个因子指数年化收益率和夏普比率均优于BetaPlus
    1000指数，说明因子暴露获得了货真价实的溢价。其中表现最好的是质量和价值指数，说明依赖基本面信息的价值投资在A股长期表现更好。令人有些意外的是，规模（小市值）指数表现一般。这似乎有违常识，但它主要是由样本空间和加权方式导致的。在所有因子指数中表现最差的是动量指数，仅微弱地跑赢基准，这与A股市场中反转效应太强有关。'
