  md: '从变量之间的相关性还能够引出业界的另一种常见处理方式——正交化（或中性化）。考虑两个相关的变量A和B，且变量A是一个优秀的预测变量，而变量B虽然能解释股票收益率的波动但通过它选股却无法获得超额收益。这二者之间的相关性使得用A预测股票收益率时会受到B的影响。由于B对于预测收益率没有贡献，因此人们希望把它对A的干扰排除，这时就会对A进行正交化处理。在股票截面上以B作为解释变量，以A作为被解释变量进行回归，得到A的残差并用残差代替原始变量A作为预测变量。由于A的残差与B正交，因此利用它预测收益率时便不再受到B的影响。在业界的因子投资中，通常使用行业哑变量和市值变量作为风险因子变量，将原始预测变量进行正交化处理，得出的残差被称为行业和市值中性的预测变量。


    # 4. 稳健性


    稳健性衡量的是预测变量对构造方法或参数是否敏感，以及在不同的实证区间内表现是否一致。在不改变预测变量逻辑的前提下，若重新定义构造方法，或者改变研究区间，它均能显著地预测收益率，那么则称其稳健性很好。相反，如果预测结果大相径庭，说明该变量十分脆弱。稳健性检验主要从三个角度入手：参数、算法和样本。


    参数指的是在定义变量时所采用的设定。以动量变量为例，学术上常用过去12个月的收益率（剔除最近1个月）作为选股的变量。在这个定义中，12就是一个参数设定。假如将12换成13或是11，如果动量变量在新的参数下表现差异不大，就说明其稳定性好。但如果参数稍微改变就导致预测性的大幅变化，这时就有理由怀疑挖掘变量时是否过拟合了。算法指的是对同一个变量的不同计算方法。仍以动量变量为例，常见的定义是使用原始的收益率计算动量。如果把它换成风险调整后收益就相当于改变了计算方法。稳健性好的预测变量在不同算法下应该有相似表现。最后，样本指的是将整个研究区间划分成不同的子区间，在不同的区间下进行测试。划分样本有多种方式，例如可以按10年为窗口划分区间，也可以按照商业周期划分样本，还可以按变量被发表前后分为样本内和样本外。一个优秀的预测变量在不同区间内的表现虽然存在差异，但总体来看都有不俗的表现。


    # 5. 可投资性


    业界同仁总爱用“阿尔法只存在于论文中”这样的话来调侃学术界找到的各种异象。这背后折射出的现象是：从研究异象到最终在实际交易中获取超额收益，这之间还需则有一大步要走。想要把纸面上的收益转化为真实的实盘收益，必须考虑信息衰减、换手频率以及交易成本等几个问题。


    正如新鲜的食物具有保质期，一旦过了期限口感和营养就开始下降一样，变量预测未来收益率的能力也具有时效性。随着时间的流逝，其信息含量不断衰减，预测能力也越来越差。变量的信息衰减，又叫信息时间尺度（information
    horizon），反映了预测变量固有的行为特征。为了衡量其衰减速率，Grinold and Kahn（1999）定义了半衰期指标，即信息衰减一半时所需要的时间。在实际应用时，以IC衡量变量的信息含量，计算t时刻变量值z_it和滞后s期收益率R_{i
    t + s + 1}之间的IC。滞后IC下降到原始IC一半所用的时间即为半衰期。从数据来源上来看，基于高频量价数据构造的预测变量有效期较短，而使用财务数据构造的基本面变量的保质期则更长。信息衰减决定了使用该变量交易时的换仓频率和策略容量。一般来说，衰减速度快往往需要较高的换仓频率，才能追上衰减的速度并有效利用变'
  merge: -1
