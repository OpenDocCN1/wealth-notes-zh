  md: '性较差。例如，根据界面新闻的统计，国内基金经理人均任职年限仅为1.72年[2]。最后，基金经理也是人，只要是人都会存在认知和行为偏差，如过度自信、锚定效应、处置效应和选择性偏差等，这也会给基金管理带来不确定性。


    Smart Beta能有效地解决上面三个问题，透明度可以和宽基指数媲美。首先，由于Smart Beta也是指数化投资，跟踪误差是考核的重要指标，所以基金经理不会也没有动机偏离基准指数；其次，Smart
    Beta在设计之时，就已经明确了风格暴露特征，并且规则清晰透明，不会受到基金经理情绪的影响，也不会因基金经理的离职而偏离设计初衷。


    # 7.4.3 如何投资Smart Beta


