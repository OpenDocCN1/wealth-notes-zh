    Beta可以聚焦到低波动和质量等防御类型因子上，进一步降低投资组合的风险。图7.6对比了防御版本的60/40组合和原始组合的回撤时间序列。在防御版本中，其中股票资产的30%分配给质量因子，30%分配给低波动因子。由于高质量和低波动具有较好的回撤保护功能，防御版本的60/40组合波动明显降低。


