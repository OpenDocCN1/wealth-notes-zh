  md: '# 2.5 多因子模型比较


    2.2.5节提到，所有的多因子模型都是“不完美”的。而这句话的后半句是有些多因子模型是“有用”的。如果一个模型中的因子都有可靠的经济学或金融学依据，代表了某种风险，且该多因子模型能够解释大量资产的预期收益，那么该模型就是有用的。然而从不同的逻辑出发，人们总能提出不同的因子，并用它们组合出不同的多因子模型。对于不同的多因子模型，应该如何进行比较呢？有哪些统计学方法能帮人们做出科学的判断呢？介绍比较多因子模型的方法就是本节的内容。


    要比较多因子模型，可以本着“两个目标、两个切入点、多种方法”这条逻辑主线进行。先看两个目标。Barillas and Shanken（2017）指出，评价一个多因子模型要看它能否解释用来检验该模型的资产（英文为test
    assets，本书将其译为测试资产）以及该模型能否解释其他模型的因子。因此，比较不同多因子模型对同一组测试资产的解释程度就是第一个目标；而不同多因子模型两两相互检验能否解释他人的因子就是第二个目标。再来看两个切入点。无论是解释测试资产还是其他因子，被解释的资产往往都是多个。当评价一个多因子模型时，联合检验多个资产定价误差是否为零就是第一种切入点；而单独考察这些资产的定价误差是否为零则是另一种切入点。无论采取哪种切入点，都有具体的方法进行检验。如果目标是联合检验定价误差，则可以使用GRS检验以及均值一方差张成（mean-variancespanning）检验；如果目标是把定价误差独立看待，则可以使用α检验。


    比较多因子模型的核心是从某个切入点出发，选择适当的统计方法。一旦有了方法，它就既可以被用来检验测试资产，也可以被用来进行不同模型包含的因子的相互检验。换句话说，不管是用测试资产还是用其他模型的因子当被解释变量，对于统计方法本身是没有太大差异的。因此，下文将以不同切入点介绍不同的检验方法。在实证资产定价的研究中，来自这两个切入点的不同方法经常被同时使用，其目的是让模型之间孰优孰劣的结论更加可靠。接下来的2.5.1节和2.5.2节两节首先分别介绍GRS和均值一方差张成检验，它们都是联合检验定价误差的方法。这两种方法的检验统计量（test
    statistic）的表达式差异并不大，而且背后有着千丝万缕的联系，2.5.3节将从几何的角度解释它们的差异。2.5.4节将会介绍α检验，它也是非常流行的一种检验方法，但与前面两种方法不同，它并不是把所有定价误差联合看待，而是独立看待。最后，2.5.5节简要介绍贝叶斯方法。


    # 2.5.1 GRS检验


    GRS检验由Michael Gibbons、Stephen Ross以及Jay Shanken提出，并由此得名。在2.2.1节介绍多因子模型的时序回归检验时已经对该方法进行了介绍，并给'
