  md: '# 1.3 因子投资的业界发展


    本节梳理因子投资在业界的发展脉络，以下行文又细分为基金管理人和普通投资者两个维度； 而本书的第7章将会详细论述业界在实践因子投资时需要解决的各种问题。


    对于主动型管理人来说，因子投资早已成为投资工具箱中的重要选择。一个因子在学术论文中的超额收益可能非常诱人，但是对于管理人来说，如何在现实中实现它是必须要解决的问题。在实际围绕某个因子构建投资组合时，必须要考虑可投资性的约束，成功的因子投资需要注重从理论到实践的每一个细节。对于普通投资者来说，了解每个因子背后的原因，选择适合自己风险偏好的因子，以及使用合适的金融工具（例如Smart
    Beta ETF）交易这些因子就成为重中之重。


    # 1.3.1 因子投资和管理人


    当管理人实施因子投资时，往往可以从以下几个角度考虑：（1）收益预测vs风险管理；（2）资金流入削弱因子收益率；（3）因子择时；（4）各类因子大行其道，如何鉴别能够获得超额收益的管理人；（5）创新的价值。


    # 1. 收益预测vs风险管理


    不同的管理人使用多因子模型的角度可能截然不同；有的管理人从截面的角度使用因子获取超额收益；而有的管理人从时序的角度使用多因子模型计算投资组合中股票之间的协方差矩阵，即风险管理；还有管理人使用多因子模型来同时进行收益预测和风险管理，并在这个基础上进行投资组合的优化。


    # 2. 资金流入削弱因子收益率


    当越来越多的资金涌入因子投资时就会造成因子拥挤（factor crowding）。而使用相似的指标排序、接近的调仓频率的因子投资则加剧了这种负面影响。任何投资策略想要持续赚钱都是利用了市场在某方面的非有效性。当使用的人越来越多，市场在这方面就会变得更有效，从而降低了该因子的预期收益率。


    因子拥挤也会造成流动性冲击。一旦市场中发生冲击风格因子的事件后，持有相似头寸的管理人会竞相卖出手中的股票，由此产生的流动性危机 Conway 会造成很大的亏损。2007年8月，很多美股量化基金经理在短时间内清理了相似的头寸，巨大的抛压对流动性造成了巨大的打击，使得这些股票的价格在短时间内大幅下降，导致市场上一些非常优秀的量化对冲基金在短时间内录得了巨大的亏损。如何定量计算因子拥挤度，并规避因子拥挤带来的负面影响就是管理人必须面对和解决'
  merge: -1
  img_proc: true
- pgno: 21
  md: '的问题。


    # 3. 因子择时


    因子择时是个大课题，其背后的动机简单而清晰：因子的表现都有周期性，有时能够获得超额收益，有时却持续亏损。因此如果能成功择时，将会极大提升因子投资的收益率。关于这个话题，Bender
    et al.（2018）客观地综述了使用不同预测指标在不同时间尺度下对不同风格因子择时的效果。这些预测指标包括因子估值、因子动量、投资者情绪以及各类宏观经济指标。


    在因子择时的众多方法中，最重要的两类方法是按因子估值（factor valuation）和按因子动量（factor momentum）择时两大立场。这两个立场来自美国两个著名且风格鲜明的对冲基金。前者的拥<|message|>
    是来自美国西海岸的Research Affiliates，而后者的支持者是来自美国东海岸的AQR。他们两家均认为自己的方法更好，认为对方的存在逻辑缺陷，并相互发论文，用实证分析证明对方的错误，颇为精彩。


    # 4. 区分α和β收益


    随着因子投资的盛行，一个新的挑战油然而生：主动管理人获取的超额收益到底来自异象，还是因为配置了某些因子？从多因子模型的定义以及式（1.3）中的数学符号可知，某个资产的高收益既可能来自高α也可能来自选择了收益率高的因子并且以高暴露（即高β）配置在这些因子上，因此业界（和学术界）通常把这两部分收益称为α和β收益。Bender
    et al.（2014）指出，管理人获得的超额收益中，80%的部分可以由因子暴露解释，只有剩下20%才取决于获得α的能力。


    由于不同风格因子的表现受到宏观经济的影响，主动配置因子β（涉及因子择时和风险控制）从而获得超额收益也彰显管理人的能力。在一项最新的研究中，Duanmu et
    al.（2018）比较了主动β和主动α管理人，并指出从长期来看，最顶尖的主动β型管理人能够获得比顶尖的主动α型管理人更优异的收益。


    # 5. 创新的价值


    对于任何研究领域，创新的作用都至关重要。对因子投资来说，创新意味着使用新的数据或者算法。随着大数据的普及，越来越多的管理人开始搜寻新的能够成为收益源的数据（比如舆情数据、专利数据、新闻数据等）。此外，机器学习算法也被广泛地应用于因子投资实践中，包括使用机器学习算法预测基本面财务指标，或挖掘因子和收益率之间的非线性关系。


    考虑到数据和技术的革新对金融领域的影响，2019年Institutional Portfolio Research Journals（IPR Journals）为旗下的期刊系列增加了一位最新成员——Journal
    of Financial Data Science，旨在指导金融领域的实践者正确使用与日俱增的数据和日新月异的技术。当然，创新的机遇总是伴随着巨大的挑战。虽然机器学习在金融领域以及因子投资领域拥有乐观的前景，但由于金融数据信噪比很低，因此需要时刻保持冷静。Lopez
    de Prado（2018）详细论述了在投资领域实践机器学习算法时可能遇到的各种坑，填补了理论和实践之间的空白。'
