- pgno: 10
  md: '式成百上千，但归根结底它们都可以归结为不同因子的组合。这就是因子的作用和多因子模型的价值。


    从上述定义可以总结出因子需要满足的两个必要条件：（1）因子驱动了资产收益率的共同运动（co-movement），因此因子一定和资产收益率的协方差矩阵有关；（2）从长期来看因子是可以获得正收益的，这意味着因子必须是被定价的。明确了因子的定义，下面再来看看什么是多因子模型。


    把若干个因子放在一起使用就构成了一个多因子模型，它们对应着式（1.3）中的βiλ部分。通常来说，人们总可以找到非常多的能够解释资产预期收益率截面差异的因子，但无论是学术理论还是投资实践都表明并不应该把所有的因子都放到一个多因子模型里。如何确定一个多因子模型中到底有几个以及哪些因子，可以从以下两点考虑。首先，很多因子之间都存在一定的相关性，高度相关的因子代表的是资产收益率所暴露的同一类风险。在选择模型包括的因子时，必须要考虑相关性的影响，人们希望加入模型的因子是相互独立的、每个因子都能对解释资产预期收益率截面差异有显著的增量贡献。其次要考虑简约法则（The
    Law of Parsimony）。从定义出发，每个因子代表的是资产暴露的某种共性风险。因此从常识来说，多因子模型中因子的个数一定是有限的。学术界的主流多因子模型通常包括3～5个因子，本书的第4章将对这些模型进行系统的阐述。


    最后来看异象。在选定了多因子模型后，如果按照某个特征构建的多空组合的预期收益率中存在一部分无法被多因子模型解释，且这部分显著大于零，那么该资产就是一个异象。举个例子，在股票市场中，人们经常根据某个公司财务指标或者量价指标来把股票排序，并按照排序高低构建一个多、空对冲投资组合。将该投资组合作为一个资产放在多因子模型中，如果其αi显著大于零，那么就称该投资组合为一个异象，而构建该组合的指标就被称为异象变量（anomaly
    variable）。


    # 1.1.3 再论异象和因子


    1.1.2节从式（1.3）出发探讨了因子投资中的三个部分：因子、多因子模型和异象。下文将围绕这三部分，从学术界和业界各自的立场来讲述因子投资的内容。不过在那之前，本节想花一点笔墨说明一下学术界和业界对异象和因子看法上的差异，这将有助于下文介绍因子投资的内容。


    在因子投资的术语中，无论是式（1.3）中αi代表的异象还是βiλ代表的因子往往都被称为因子。为了区分它们，只需要记住βiλ是一个定价模型，因此它包含的因子又被称为定价因子（pricing
    factors）；而αi代表的是按某种方法构建出的能够获得多因子模型无法解释的超额收益的资产，因此它又被称为异象因子（anomaly factors）。在本书中，如无特殊说明，当谈及异象时，指的是αi代表的部分；当谈及因子时，指的是定价因子βiλ的部分。


    在因子投资中，学术界往往更加严谨地区分异象因子和定价因子。由因子的定义可知，它必须能够解释资产预期收益率截面上的差异。经过几十年的发展，学术界已经从上市公司财务指标和股票交易中的量价指标中找到了上百个满足上述要求的因子。然而，从1.1.2节的论述可知，一个多因子定价模型应满足简约法'
