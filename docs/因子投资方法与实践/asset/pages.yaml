- pgno: 116
  md: '# 3.3 规模因子


    # 3.3.1 规模因子起源


    规模效应（Size）的含义简单清晰，即小市值股票有着比大市值股票更好的表现，而反映这一现象的规模因子则因为著名的Fama and French（1993）三因子模型而家喻户晓。该模型中的SMB（Small-Minus-Big）因子正是规模因子。规模因子的历史要追溯到1981年。Banz（1981）基于纽约证券交易所（NYSE）长达40年的数据发现，按照市值将股票分为5组后，市值最小的一组股票月均收益率比其他股票高0.4%，差异非常显著。不仅如此，规模效应并非线性的，而是对于市值最小的企业最为显著。规模效应背后的原因可以归结于投资者对小盘股的普遍规避：由于难以获取准确的信息，投资者普遍不愿意持有小市值股票，使得这些股票的价格低于规模较大的股票，因而有着较高的预期收益。


    自Banz（1981）以来，规模效应吸引了不少美国学者的注意，诸多研究都发现了支持美股市场存在规模效应的证据山。Lamoureux and Sanger（1989）更是指出，在纳斯达克交易所上市的公司中，规模效应异常显著。在这些研究中，规模因子溢价的估计都超过了每月1.50%，因此无论在经济上还是统计上都高度显著，但由于样本普遍较少，因而上述结论并不稳健。在诸多研究中，关于规模效应研究最为重要的研究还是要数Fama
    and French（1993）。这篇经典论文在仔细研究了包括规模、账面市值比（BM）和盈利市值比（EP）一系列可能影响股票和债券收益的因素后，指出规模因子溢价平均为0.63%。该结果虽然小于前述研究，但同样高度显著。Fama
    and French（1993）在此基础上进一步提出了包括规模因子在内的Fama–French三因子模型，并指出该模型能够比经典的CAPM模型更好地解释股票预期收益的截面差异。在此之后美国市场和国际市场关于规模效应的实证研究便如雨后春笋一般涌现。其中，最重要的国际市场的实证证据来自Fama
    and French（2012）。


    除海外市场外，中国市场也吸引了不少学者的注意。过去数年间，中国市场的规模效应也是众所周知的；在2016年之前，其显著性甚至远超欧美发达国家市场。在相关研究中，很有代表性的一项当属Liu
    et al.（2019）。这篇文章基于2000年至2016年的数据发现A股市场存在非常显著的规模效应。但值得注意的是，A股市场特殊的IPO制度和投资者群体使得微型股的壳价值长期畸高，从而扭曲了规模溢价。为了正确估计规模溢价，上述研究剔除了市值最小的30%股票，并发现在剔除微小市值股票后，规模效应仍然高度显著。但颇为有趣的是，该文的发现在样本外的表现却和样本内大相径庭。2017至2018年，大市值白马股的表现远远优于小盘股，这使得A股的规模效应被极大地稀释。近年来参与A股投资的读者一定会有切身的感受。'
