  md: '# 6.5 风险补偿、错误定价还是数据窥探


    在过去30年的研究中，学术界发表了数百个在样本内能够预测股票未来收益率的变量，并通过它们构建了诸多异象，获得了常见多因子模型无法解释的显著的超额收益。然而，面对层出不穷的异象，人们关心的问题是它们背后的原因是什么？弄清楚背后的原因有助于判断异象在样本外是否会继续有效。假如异象确实是真实的——即通过它们确实能够获得超额收益，那么这背后的原因一般可以归为风险补偿以及错误定价两个方面。当然，由于多重假设检验问题，如今人们已经知道大量异象都是虚假的，因此数据窥探就是它们在样本内有效的第三个原因。


    对于真实的异象，搞清楚其背后的机制至关重要。错误定价意味着投资者可以通过合理的策略获得潜在的超额收益；而风险补偿则意味着投资者获得的收益是以承担额外风险为代价的。而对于通过数据窥探获得的虚假异象，有效识别它们可以帮助人们躲开过拟合、在样本外摒弃它们。本节就来介绍这三种原因的常见检验方法。对于识别风险补偿和错误定价这两种原因，Lee
    and So（2015）的第六章做过精彩的论述，在接下来的介绍中会适当参考。


    # 6.5.1 风险补偿检验


    +   1. 常识“检验”


    判断异象是否源于风险补偿的第一个检验是通过常识来判断，它虽然不是一个正式的统计检验，但却简单有效。常识“检验”的依据是：如果异象来自风险补偿，那么获得高收益的股票应该比获得低收益的股票承受了更高的风险。如果事实并非如此，就可以拒绝风险补偿这种解释。有意思的是，对于很多超额收益，基于风险补偿的解释在常识上却无法说通。以盈余惯性异象为例，该现象指出在盈余公告发布后，拥有好消息的公司能够跑赢拥有坏消息的公司。按照风险补偿解释，这意味着发布盈余好消息的公司（基本面通常更强）要比发布坏消息的公司有更高的风险，这显然违背常识。


    +   2. 来自资产定价模型的推论


    除了常识“检验”外，还可以利用资产定价模型的推论来区分风险补偿和错误定价。一个变量如果能够预测未来收益，本质上是因为它是资产对某个系统性风险暴露程度的优秀代理变量。按照传统定价理论，使用该变量构建一个因子模拟投资组合，而资产在该风险上的暴露大小则由资产对该组合的β值决定。在风险补偿解释下，该β值应该比变量本身更能预测未来收益率。但是学术界在很多变量上'
  merge: -1
  img_proc: true
- pgno: 263
  md: '却观察到相反的结果。举例来说，Daniel and Titman（1997）发现BM变量本身比股票对以BM构建的价值因子的β值具有更强的收益率预测能力。类似的，Hirshleifer
    et al.（2012）使用同样的方法考察了应计利润，发现应计利润能够预测未来收益率，而基于应计利润的β值则不具备预测能力。


    # 3. 宏观经济的影响


    如果异象背后的原因是风险补偿，那么可以预期宏观经济因素将影响其收益率。例如，Savor and Wilson（2013）发现在宏观经济数据发布期间，市场超额收益是平时的10倍；类似的，Savor
    and Wilson（2014）发现在这些日子中，股票的收益率数据也更加符合CAPM理论。因此，检验风险补偿的第三种方法是考察异象收益率的时间序列特征是否因处于宏观经济周期造成不同市场状态下有所差异。如果异象源自风险补偿，那么可以预期它在宏观经济发布期间的收益率更高（因为经济长期来说是向上的）；同时也可以预期当市场处于极端风险状态下（比如经济衰退时期）它的表现会非常差，出现较大亏损。


    在检验中，可利用Fama-MacBeth回归获得异象收益率的时间序列。使用经济周期指标把市场划分为不同的状态区间，并考察收益率序列在不同区间内的差异。Lakonishok
    et al.（1994）用上述方法检验了价值因子，发现价值因子在经济衰退时的表现和平时并无显著差异，且有时还比未发生衰退时更好，由此认为价值因子背后的原因并非风险补偿。


    # 6.5.2 错误定价检验


    如果异象超额收益背后的原因是错误定价，那么通常可以观察到这样的现象：在异象投资组合构建后的一段时间内，其累计收益会持续上升。举例来说，Lee et al.（2019）提出了科技动量异象，它的投资组合在构建后的六个月内的累计收益持续上升。这个现象表明该异象代表了一个价格发现的过程，说明价格对于与科技动量相关的消息的吸收是缓慢的，从而出现了错误定价。为了检验异象是否源于错误定价，可以考虑以下方法。


    # 1. 业绩公告期


    考察因子收益率在业绩公告期窗口内的大小是一种被学术界普遍使用的方法。它背后的逻辑是，如果某个异象和错误定价有关，则其在业绩公告期内应该比其他时间内获得更高的收益，这是因为最新的业绩报告有助于修正投资者之前对该股票的定价错误。而反过来，如果该异象是源自风险补偿，那么该异象在不同时期的收益率应该大致相当，人们不应观察到业绩公告期内异象收益率较平时发生显著的变化。


    对于上述假设的检验可以参照Engelberg et al.（2018）提出的方法。其思路是使用股票日收益率作为被解释变量和一系列解释变量进行跨期、跨公司的混合回归（pooled
    regression）。回归中的解释变量包括：历史异象变量取值、盈余公告窗口哑变量（如果某天处在盈余公告窗口内，则取值为1，反之0）、异象变量和盈余公告窗口哑变量的交叉项，以及其他相应的控制变量——例如收益率的滞后项、成交量的滞后项等。此外，为了考虑不同日期收益率的差异，在该回归中'
  merge: -1
  img_proc: true
- pgno: 264
  md: '也往往加入时间的固定效应项。上述回归得到的系数就是不同解释变量的收益率。如果异象源自错误定价，则异象变量和盈余公告窗口哑变量的交叉项的系数应该显著大于异象变量的系数。Engelberg
    et al.（2018）使用这个方法研究了美股上的97个因子，异象在盈余期内的收益率比非盈余期内收益的收益率高了6倍，回归结果支持了错误定价的说法。


    # 2. 预测未来基本面


    第二个检验方法是考察异象和标准化的预期外盈利（Standardized Unexpected Earnings，简称SUE）之间的关系。一直以来，人们认为如果某个异象源于风险补偿，那么它在一些风险因子上会有更高的暴露。由于无法罗列出所有的风险，因此这种观点受到模型设定偏误的挑战，因为即使异象在已知风险因子上的暴露很低，它也可能代表着某个尚未被识别的风险。这种进退两难的局面让使用SUE这种仅和公司基本面相关的指标格外有吸引力。由于SUE是一个非收益率指标，不会因对风险的控制不足而受到影响。


    令Q_it表示上市公司i在季度t的盈利，则SUE的定义为：


    ```

    SUE_it = (Q_it - E[Q_it]) / σ(Q_it - E[Q_it])

    (6.21)

    ```


    上式中分子表示实际盈利和预期盈利之间的差异，该差异可正可负，表示预期外盈利；分母为差异的标准差，起到对分子标准化的作用（因此SUE被称作标准化后的预期外盈利），通常使用过去8到20个季度的差异数据计算。由（6.21）可知，计算SUE时最重要的输入是对盈利的预测。在这方面，Foster（1977）和Foster
    et al.（1984）对学术界常用的方法进行了介绍和应用[2]。


    Lee et al.（2019）使用预测性回归，检验了他们提出的科技动量异象能否预测公司未来的SUE。由于SUE是公司未来现金流的决定因素，如果该异象能够预测SUE则说明前者的超额收益和公司基本面的改变相关，而非风险补偿。实证结果显示，当季度的科技动量异象对未来三个季度的SUE都有显著的预测性，且这种预测性在逐步减弱。这一结果有力地支持了该异象来源于错误定价，而非风险补偿。


    # 3. 有限注意力导致错误定价


    从6.3节的介绍可知，行为金融学中的有限注意力能够导致市场异象。大量研究发现，资产的错误定价和投资者的有限注意力密切相关。沿着这个思路出发，一个自然的想法就是，如果异象背后的原因是错误定价，那么投资者关注度低——即有限注意力问题更严峻——的公司的异象收益率更高。由于有限注意力并不是一个可以直接衡量的指标，为此只能找一些代理变量。学术界通常认为市值小、分析师覆盖少、媒体报道少、机构投资者占比低的公司获得投资者的关注更低，因此投资者有限注意力问题更严峻（Hou
    2007，Cohen and Frazzini 2008，Fang and Peress 2009，Hirshleifer et al.2013，Drake
    et al. 2014，Jiang et al. 2016）。


    Fama–MacBeth截面回归常被用来检验上述猜想。在检验中，当期异象变量和代表有限注意力代理变量的哑变量，以及该哑变量和异象变量的交叉项被选为解释变量，股票下期收益率为被解释变量，考察具有上述特征的公司是否比它们的'
  merge: -1
  img_proc: true
- pgno: 265
  md: '对立面能够获得更显著的收益率。如果答案是肯定的（表现为交叉项的回归系数是非常显著的），则可以支持错误定价解释。


    除Fama–MacBeth回归外，使用条件双重排序法也可以进行检验。具体而言，可以使用前述有限注意力的代理指标，首先根据其高低将股票分组。之后，在每一组内，再按照待检验的异象变量将股票分组。最后，计算不同有限注意力分组中异象的预期收益率，并比较它们的显著性水平是否有差异。如果有限注意力是导致错误定价的原因，那么在有限注意力更强的组中应该能够观察到更显著的异象收益率。


    # 4. 套利成本


    除有限注意力外，行为金融学指出理性投资者之所以无法消除错误定价，是因为和套利成本（cost of arbitrage）有关。由于套利成本高的公司更容易出现错误定价，因此这些公司比套利成本低的公司的因子收益率更高。和有限注意力类似，套利成本也无法被直接衡量，因此需要代理变量。学术界使用的常见代理变量包括特质性波动率（Pontiff
    2006，Stambaugh et al. 2015）、负面新闻（Hong et al. 2000，Hirshleifer et al. 2011，Beneishet
    al. 2015），以及机构投资者占比（Chen et al. 2002）。


    在检验中，同样可以使用Fama–MacBeth回归和条件双重排序法。如果套利成本高的公司的异象收益率更高，就可以支持错误定价解释。Lee et al.（2019）使用上述方法检验了科技动量因子，认为它背后的原因更可能是错误定价而非风险补偿。


    # 6.5.3 数据窥探检验


    除了风险补偿和错误定价外，另一种从样本内挖出显著异象的原因是数据窥探（data snooping），也就是过拟合。早在近30年前，Lo and MacKinlay（1990）就曾指出数据窥探在检验资产定价模型中会造成一定的问题。类似的，Sullivan
    et al.（1999）以技术分析策略为对象，使用White（2000）的方法研究了如何修正数据窥探偏差的影响，从而更加科学地评价那些策略的表现。2016年，Campbell
    Harvey教授和他的合作者发表了一篇著名的文章（Harvey et al. 2016），题为…and the cross-Section of expected
    returns。该文的题目颇有讽刺意味：学术界发现新异象的论文题目一般都是xxx and the cross-section of expected returns，其中xxx代表异象的名字。因此Harvey
    et al.（2016）一文使用了这样的题目无疑是吐槽学术界挖掘出来的众多异象。该文分析了316个异象，并指出在排除了多重假设检验影响后，绝大多数均无法获得显著的超额收益。


    除此之外，Linnainmaa and Roberts（2018）还花费大量的精力构建了全新的样本外数据，并用新的数据检验了美股中源于会计数据的36个异象（表6.3）在样本内、外表现的差异。分析表明，绝大部分异象在样本外明显失效，这种现象和未知风险以及错误定价两种解释严重不符，因此这些异象很有可能仅是数据窥探的产物。


