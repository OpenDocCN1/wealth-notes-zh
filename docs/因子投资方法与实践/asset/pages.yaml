- pgno: 316
  md: '# 7.3 投资组合优化


    有了收益模型和风险模型，主动管理的下一步就是将二者结合在一起，进行投资组合优化，以获得更高的风险调整后收益。介绍投资组合优化就是本节的内容。


    # 7.3.1 错位的收益与风险模型


    7.1节和7.2节两节分别介绍了预测收益率的收益模型和计算资产协方差矩阵的风险模型。在因子投资中，基金经理往往将二者结合起来，进行投资组合优化。这时，如果收益率模型中的预测变量和风险模型中构建因子的变量不完全匹配，就会出现收益和风险模型的错位（misalignment）。错位会在优化过程中造成负面影响，使得计算出的最优组合在因子的暴露上偏离使用者的本意，影响组合的风险收益特征。


    在实际因子投资中，这种错位十分常见。对于大多数基金经理来说，他们都有独门的收益模型。而在风险模型方面，很多人选择采购第三方提供的商用多因子模型，比如Barra模型。由于独有收益模型中的预测变量无法与风险因子模型中的因子变量完全一致，因而造成了两个模型的错位。在投资组合优化过程中减弱甚至消除这种错位就显得格外重要。Lee
    and Stefek（2008）、Bender et al.（2009）以及Karels and Sun（2013）等在这方面做过很多研究。下面先来看看收益和风险模型的错位会产生什么问题。


    假设投资者使用某收益模型来获取相对基准的超额收益（记为Rα），该超额收益可以被视作股票在收益预测变量上暴露的某个线性组合（为简化数学表达，省略时间下标）：


    Rα = βa ω  （7.50）


    式中下标α表示收益模型；βa为股票在收益变量上的暴露矩阵。另外，投资者使用如下风险多因子模型计算股票的协方差矩阵：


    Re = βR λR + εR  （7.51）


    式中下标R表示风险模型。由风险模型可知，股票的协方差矩阵为：


    Σ = βR ΣR βR'' + Σs  （7.52）'
