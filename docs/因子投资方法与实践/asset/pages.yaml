- pgno: 383
  md: '由于方差一定是非负的，上式意味着基本面价值的波动应该大于价格本身的波动：


    ```

    var(P_{it}^*) > var(P_{it})          (A7)

    ```


    当资产为股票时，式（A7）意味着股票价格的波动应该小于未来股息现值之和的波动。但事实是否如此呢？Shiller（1981）回答了这个问题，并发现了和模型完全相反的结论，即价格的方差比未来股息折现值之和的方差要大得多。Shiller的研究表明，股票和债券的短期波动比其长期波动更加剧烈，说明长期的价格呈现均值回复的特征，因此长期来看这些资产的收益是可以被预测的——高于平均收益之后往往伴随着低于平均水平的收益。这是在20世纪70年代Fama的重要发现后，人们对于资产价格理解迈出的又一步。


    在Shiller（1981）之后，学术界关于资产的长期可预测性做了大量的研究。比如，Campbell and Shiller（1988）发现实际盈利率的长期均值能很好地预测未来的股息率，且该变量和当前价格的比值可以很好地预测未来的价格。Fama
    and French（1988）发现随着时间尺度的增加，股息率对收益率的预测能力也逐渐提高（体现为更高的时序回归R-squared），这也和“收益率在短期内难以预测，在长期内可以预测”的观点相一致。短期的高波动是资产价格在长时间尺度下可预测性的前提。


    回到P=E[mx]这个式子，Shiller等人的研究表示，既然P的波动比x的波动更高，如果无套利定价公式成立，那么P的高波动只能是来自随机折现因子m的高波动。因此，接下来学者们必须回答的问题就是：是什么导致了m的高波动？来自经济学的理论模型是否支持m的高波动？


    # 4 理性CCAPM模型


    如果想从经济学理论出发来解释m的高波动，那么就需要把资产的价格和人们的储蓄与风险决策（投资风险资产）联系起来。在这方面，当仁不让的选择是基于消费的资产定价模型（consumption-based
    CAPM, CCAPM），它允许投资者的风险偏好（即随机折现因子）随时间变化，背后的原因可能是消费或者财富的冲击。在CCAPM中，消费者的决策目标是预期效用的最大化：


    ```

    E[∑_{j=0}^∞ β^j u(c_{t+j})]          (A8)

    ```


    上式中β表示一个主观贴现系数、u是效用函数、c_{t+j}表示t+j期的消费。CCAPM假设投资人每一期购买一定量的风险资产（价格为P），并通过最大化上述目标函数来确定最优的购买量。根据目标函数的一阶条件可以获得如下关系（Cochrane
    2005）：


    ```

    u''(c_t) = E[ β u''(c_{t+1}) x_{it+1} / P_{it} ]          (A9)

    ```'
  merge: -1
  img_proc: true
- pgno: 384
  md: '上式中左侧是在$t$时刻消费一个单位能够获得的边际效用；右侧是将该单位进行投资（风险资产）并在$t+1$时刻获得$x_{it+1}/P_{it}$的回报并将其折现之后的边际效用。根据一阶条件，二者应该相等，故得到上式。将其进行简单变化变得到CCAPM的定价方程：


    ```

    P_{it}=E\left[\beta\frac{u''(c_{t+1})}{u''(c_t)}x_{it+1}\right]\quad(A10)

    ```


    比较式（A10）和式（A2）可知，在CCAPM下随机折现因子满足：


    ```

    m=\beta\frac{u''(c_{t+1})}{u''(c_t)}\quad(A11)

    ```


    CCAPM指出$m$和当期消费与下期消费的边际效用之比有关。从经济理论出发，这个表达式解释了为什么在经济衰退时，折现因子比较低：在经济不景气时，$c_t$较低、边际效用$u''(c_t)$较高，因此边际效用比$u''(c_{t+1})/u''(c_t)$较低；反之，在经济繁荣时，折现因子$m$较高。


    有了模型，接下来就应该用数据对其进行参数估计，从而检验CCAPM是否成立。但是在当时，人们突然发现不会了！首先，在CCAPM中，模型是变量的非线性方程；其次，需要为消费确定一个完整的随机过程模型；最后，在这个动态系统中，误差项的时序相关性也让使用正式的统计方法难上加难。


    面对这些难以逾越的困难，当时的两种妥协方法包括：（1）使用校准和非正式统计；（2）在模型之外强行加入一系列非常具体的假设（哪怕有些假设和被处理的问题毫不相关）从而把非线性的CCAPM线性化处理。在第一种方法的努力中，Grossman
    and Shiller（1981）是定量检验CCAPM的“始作俑者”。在使用了美国消费数据后，他们发现只有消费的边际效用对消费变化极度敏感，即投资者在表现出极度的风险厌恶时，股票价格的波动才能符合该模型。换句话说，在合理的假设下，CCAPM只能被拒绝。


    另外，在使用具体假设后的线性化结果也没好到哪里去，CCAPM依然被拒绝。而因为各种具体的假设也多少让问题变得更加复杂，即人们无法确定CCAPM被拒绝本身是因为理论存在固有的局限，还是因为线性化处理CCAPM而做的各种假设不够合理。在这进退两难之际，人们急需在计量经济学理论上的突破，让正式检验CCAPM成为可能。就这个时候，Lars
    Peter Hansen的广义矩估计（Hansen 1982）横空出世。


    使用广义矩估计将CCAPM表达成一系列矩条件的形式，即$E[f(x_t, b_0)]=0$，这极大地方便了对模型的参数估计和检验。Hansen（1982）对广义矩估计以及它的各种特性进行了详尽的描述；本书2.7节也对它背后的数学原理进行了解读。而该方法之所以如此强大是它对随机过程$x_t$的限制非常少（只需要满足弱平稳和各态历经性），此外它对函数$f$的限制也非常少（可以是非线性的）。这种强大的特征对于处理经济学的面板数据至关重要。在资产定价中，随机过程的残差是相互关联的，且主要关系也是非线性的。正因为如此“好使”，Hansen（1982）成了计量经济学领域最具影响力的论文之一。'
  merge: -1
  img_proc: true
- pgno: 385
  md: '有了检验方法，学术界终于可以一展身手了。广义矩估计首次被应用于资产定价正是出自Hansen and Singleton（1982），而他们的结论是CCAPM再次被拒绝了。根据CCAPM理论，从数据估计出的时变折现因子$m$根本无法解释资产价格的高波动。如果在广义矩估计被推出之前，学术界对CCAPM还心存幻想，那么这次CCAPM可以说是彻底被打败了。让上述结果雪上加霜的是，Hansen
    and Jagannathan（1991）为随机折现因子$m$的波动计算出了一个下界，它和资产的夏普比率有关。以美国股市的数据来计算，$m$波动的下界应该在0.5左右。从消费的实际数据来看，消费的波动是很低的。因此如果CCAPM能够解释随机折现因子$m$的波动，那么需要投资者具有不切实际的风险厌恶水平，否则就难以支撑$m$高达0.5的波动。


    尽管CCAPM遭到了拒绝，但学术界似乎不想轻易放弃它，而是努力地对理论进行“完善”，包括提出不同形式的效用函数以及考虑不同投资者偏好的差异等。归根到底，是学术界不想放弃理性行为这个假设。而就在这个时期，考虑投资者非理性的行为金融学也悄然萌芽。


    # 5 行为金融学


    如果要问谁是行为金融学的代表人物，得到的答案可能是Daniel Kahneman和Amos Tversky。这两位的地位和贡献无须多言，但他们均是著名的心理学家，更多的还是从心理学的角度分析人如何做决策；另外可能的答案是Richard
    Thaler，但Thaler更大的贡献是行为经济学。


    行为金融学的代表人物当属Robert Shiller，而奠定其地位的正是Shiller（1984）这篇提出了噪声交易者模型的论文。这篇论文成为日后日益增加的行为金融学文献的起点。在Shiller的模型中，聪明的投资者依基本面价值进行投资，而噪声交易者的存在造成了价格和内在价值出现了偏离，价格的过度波动来源于人们非理性行为造成的对基本面信息的过度反应。对于聪明的交易者，虽然能对预期回报做出理性反应，但这种反应因受到自身财富的限制而并不充分。


    自Shiller（1984）发表之后，大量相关的研究结果被提出，这其中有很多是从行为偏差的角度来修正CCAPM中理性偏好的假设，这无疑有着非凡的意义，它意味着基于理性和行为的模型正在结合。另外，更多的学者开始用心理学的发现来研究个人的行为和偏误，这些心理学发现包括前景理论、过度自信及心理账户理论等。本书6.3节对行为金融学的研究框架进行了系统的介绍。随着这门学科的发展，很多从行为金融学出发的新的定价模型被研究出来，它们对股票市场价格和交易量的高波动以及价格在不同尺度下表现出的异象给出了令人信服的解释。


    Shiller（1984）的另一个贡献是回应了长久以来传统经济学派对行为金融学的最大质疑——如果价格偏离了价值，即能被预测，为什么价值没有因为套利而消失？该文提出了套利限制（limits
    to arbitrage），排除了这个阻碍行为金融学发展的障碍。在行为金融学的进一步发展中，大量的研究表明资产的价格和投资人非理性的情绪有密切的关系（比如泡沫）。其中家喻户晓的例子包括金融市场的同质标的凹不满足一价定理（Froot
    and Daborn 1999）和“封闭式基金折价之谜”（Lee et al.1991）等。'
