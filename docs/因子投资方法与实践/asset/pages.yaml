- pgno: 278
  md: '前，基于因子的基本面量化投资只是一个过渡，而这二者的最佳结合应是使用数量化的手段来高质量、低成本地复制优秀基本面分析师对于财务报表勾稽关系的解读。当然，这绝不容易。


    在现阶段，如何有效地利用基本面分析来提升因子投资的效果呢？主要有以下两个途径。首先，利用会计学知识可以加工因子。举一个最简单的例子。总资产收益率（ROA）是一个常用的变量。根据定义，它可以分解为：


    ```

    净利润/总资产 = 净利润/总收入 × 总收入/总资产  (6.29)

    ```


    上式左侧正是ROA。在上式右侧，它被分解为两部分的乘积。其中第一项是净利率，代表了公司的效用（effectiveness）；第二项是总资产周转率，代表了公司的效率（efficiency）。ROA的高低由效用和效率两要素决定。比起单一要素带来的高ROA而言，当效用和效率都很高时，这个公司更有可能是优秀的公司。从这个猜想出发可以把单纯基于ROA的因子改进分解成这两部分的组合，并从这两个维度的综合评分来选股回，以此和单纯使用ROA选股进行对比。表6.6给出了针对A股的实证结果（市值加权）。


    # 表6.6 ROA分解实证结果


    | | 市场基准 | 单纯 ROA 多头 | 分解 ROA 多头 |

    |---|---|---|---|

    | 年化收益率（%） | 7.94 | 12.36 | 13.21 |

    | 夏普比率（年化） | 0.42 | 0.57 | 0.59 |

    | 最大回撤（%） | -70.59 | -69.86 | -69.15 |


    ROA分解后，纯多头组合的年化收益率较单纯使用ROA的多头组合从12.36%上升至13.21%，夏普比率从0.57上升至0.59。利用简单的会计学知识就有可能改进一个常见的因子并取得更好的风险收益特征。再次强调的是，这仅仅是一个简单的例子，基本面分析在因子的改造中能够发挥更大的作用。


    利用会计学知识和基本面分析来提升因子投资的第二个重要作用是识别财务造假。无论是安然的伪造收入，还是世通公司的伪造利润和现金流，都可以从财务报表中寻觅出蛛丝马迹。会计学领域有很多经典著作揭示了财务欺诈的常见方法，非常值得学习。具备专业的基本面分析知识对于因子投资中的排雷至关重要。


    基本面投资关心的本质是对公司未来现金流的预测。基于因子的基本面量化投资有其无可替代的优势，但仅依赖有限的财务指标所关注的仍然只是已经发生的过去。唯有以量化的手段进行基本面分析才有可能更好地预测未来。对于因子投资来说，科学、严谨的基本面分析将会持续创造价值。放眼未来，量化和基本面分析的完美结合将是大势所趋。而就目前来看，基于因子的基本面量化投资远非基本面分析的完美替代。


