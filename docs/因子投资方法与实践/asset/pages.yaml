  md: '# 内容简介


    本书在统一视角下，体系化地介绍了因子投资中的重要研究方法，并针对中国A股市场给出了独立的、可复制的、高质量的因子实证分析结果，是一本真正可操作、可上手的因子投资手册。本书主要内容包括：因子投资基础、因子投资方法论、主流因子解读、多因子模型、异象研究、因子研究现状和因子投资实践。书中还以附录的形式对理解资产价格的研究脉络进行了梳理。本书的写作既注重学术文献的严谨，也注重普通读者的阅读体验。书中虽然涉及必要的数学公式，但是会深入浅出、抽丝剥茧地解释统计方法，并把重点放在实证分析上，同时也会对因子投资的实务进行解读。


    本书适合与因子投资相关的从业人员、与实证资产定价相关的学生和老师，以及对因子投资理念感兴趣的读者。'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# 前言


    自从20世纪60年代资本资产定价模型被提出以来，实证资产定价经过学术界50多年的发展，形成了完善的研究体系，并获得了丰富的实证结果，而从中演化出来的因子投资如今也早已成为海外资产管理人必备的重要工具，其在资产配置和获取超额收益方面均大有作为。在因子投资领域，海外的学术界和业界出版了很多经典专著，系统化地介绍因子投资的研究方法和投资实务。遗憾的是，虽然因子投资已经在国内的股票和债券市场上得到广泛的应用，但在相应的中文版书籍方面仍然是一片空白。本书是为了填补这个空白而做的一点努力。


    本书的目标是在统一视角下成体系地介绍因子投资中重要的研究方法，并针对中国A股市场给出独立、可复制、高质量的因子实证分析结果，从而成为一本因子投资的专业工具书。本书的写作将不失学术文献的严谨，但作者也会时刻考虑读者的阅读体验，使其成为真正可操作、可上手的因子投资手册。书中虽然会不可避免地涉及必要的数学公式，但作者无意将本书写成一本纯理论性书籍，行文中将会深入浅出、抽丝剥茧地解释统计方法，并把重点放在实证分析上，同时会对因子投资的实务进行解读。本书适合与因子投资相关的从业人员、与实证资产定价相关的学生和老师，以及对因子投资理念感兴趣的读者。


    本书内容共七章，可以被分成三个部分。第一部分包括第1章和第2章。第1章抛出现究因子投资的统一视角，它是全书的灵魂，后续所有内容都将围绕它展开。在此基础之上，第1章将从学术界、管理人员和投资者三个维度综述因子投资基础，让读者在接触具体细节之前首先掌握因子投资的全貌。第2章介绍学术界在分析因子时最常用的统计学方法，例如投资组合排序法、Fama-MacBeth回归法、Newey-West调整以及广义矩估计等，它们都是实证资产定价研究中耳熟能详的名字。本章的内容是全书的核心，可以为读者进行系统性的因子研究奠定基础。


    第3章～第5章可被视为本书的第二部分。它们将以A股市场为对象，使用第2章介绍的方法，从因子、多因子模型以及异象三个角度进行详尽的实证分析。这三章的内容主要起到两个作用：（1）通过剖析过去20年A股市场中不同风格因子和异象的表现，加深读者对市场的理解；（2）通过理论和实际的结合，帮助读者掌握各种分析方法在研究异象、因子以及多因子模型方面的应用。


    第6章和第7章可被视作本书的第三部分。它们均属于进阶课题，使全书既丰'
