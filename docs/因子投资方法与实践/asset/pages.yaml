- pgno: 160
  md: '新排序并对这两个因子进行再平衡。Fama–French三因子模型被提出后逐步取代了CAPM成为资产定价的第一范式。而以上述双重划分以及以此衍生出来的多重划分来构建因子组合也成为学术界竞相模仿的对象。


    作为第一个被提出的多因子模型，Fama–French三因子模型被反复进行检验。Davis et al.（2000）使用自1927年开始的数据检验了三因子模型；Fama
    and French（1998）使用其他国家的股票市场检验该模型；Fama and French（2008）使用三因子模型考察了那些无法被CAPM解释的异象。除此之外，Fama
    and French（1996）还尝试从风险的角度解释了SMB和HML两个因子，并猜想它们和上市公司的财务困境风险有关。此外，Fama and French（1996）认为Fama–French三因子模型是Merton（1973）提出的跨期资本资产定价模型（Intertemporal
    Capital Asset Pricing Model，ICAPM）的多因子版本。但是关于SMB和HML代表何种状态变量，以及为什么它们能够捕捉CAPM无法解释的风险，依旧没有定论。


    # 4.1.2 Carhart四因子模型


    作为第一代的多因子模型，Fama–French三因子模型虽然有足够的开创性，但是“适用性”却有限，有很多其无法解释的异象。在众多异象中，最显著的大概要数截面动量异象。该异象最初由Jegadeesh
    and Titman（1993）提出。假如当前时点为t月，他们使用了t-12到t-1这11个月之间的总收益率将所有股票排序，并选择总收益率高的构建了赢家组合（Winner）、总收益率低的构建了输家组合（Loser），发现由做多赢家和做空输家获得的多/空投资组合可以获得超额收益。之所以特意规避最近的一个月是因为Jegadeesh
    and Titman（1993）观察到了市场短期存在反转现象（Jegadeesh 1990），为了不使短期反转干扰中期动量，因此在计算动量时特地把最近一个月剔除，故而使用了t-12到t-1之间的11个月而非最近12个月。


    受到Jegadeesh and Titman（1993）的启发，Carhart（1997）在Fama–French三因子模型中加入了截面动量因子（取动量英文单词前三个字母，记为MOM）并提出了Carhart四因子模型：


    ```

    E[R_i]-R_f = β_{i, MKT} (E[R_M]-R_f) + β_{i, SMB}E[R_{SMB}] + β_{i, HML}E[R_{HML}]
    + β_{i, MOM}E[R_{MOM}] (4.4)

    ```


    在式（4.4）中，E[R_{MOM}]为动量因子的收益率，β_{i, MOM}为个股i在动量因子上的暴露。在实际使用中，Carhart（1997）使用了NYSE、NASDAQ及AMEX的全部股票。每月末将所有股票按t-12到t-1这11个月的总收益率排序，并通过做多排名前30%同时做空排名后30%的股票构建动量因子。在计算动量因子收益率时，多空两头内的股票均采用等权重配置。


    # 4.1.3 Novy-Marx四因子模型


    Novy-Marx（2013）指出盈利能力和未来预期收益密切相关，并由此提出了一个四因子模型：'
  merge: -1
  img_proc: true
- pgno: 161
  md: '```

    E[R_i]-R_f=β_{i, MKT} (E[R_M]-R_f)+β_{i, HML}E[R_{HML}]+β_{i, UMDE}[R_{UMD}]+β_{i,
    PMUE}[R_{PMU}] (4.5)

    ```


    其中 E[R_{PMU}] 是盈利因子的预期收益率（PMU 是 Profitability-Minus-Unprofitaility 的缩写，代表盈利），
    β_{i, PMU} 为个股 i 在该因子上的暴露。除盈利因子外，该模型还包括市场、价值及动量因子。需要说明的是，Novy-Marx（2013）使用 UMD（Up-Minus-Down
    的首字母缩写）代表动量因子，因此式（4.5）中 E[R_{UMD}] 和 β_{i, UMD} 分别为动量因子的预期收益及个股 i 在该因子上的暴露。在使用时，动量因子的投资组合需要每月进行再平衡，而价值和盈利因子需要每年六月末使用最新的财务数据重新构建投资组合。


    如何衡量企业的盈利能力呢？Novy-Marx（2013）认为毛利润（Gross Profitability，GP）要比净利润更好。首先，毛利润代表最真实的经济生产能力，是整个企业所有投入者（债权人和股东）努力的结果。其次，毛利润包含了研发投入和广告投入等费用，这些费用事实上
    açıkl于企业未来的盈利，因此不应该被减掉。最后，毛利润总体来说比较干净纯粹，因为利润表越往下，受操纵的科目可能越多，数据就越不真实。无论排序法，还是 Fama-MacBeth
    回归，均显示 GP 具有和 BM 效果一样的预测能力，且比净利润与净资产之比以及自由现金流与净资产之比这两个指标更加优秀。


    在构建因子时，Novy-Marx（2013）追随了 Fama and French（1993）的脚步，分别使用 logBM、 t-12 到 t-1 的总收益率及
    GP 作为这三个因子的变量和市值进行 2×3 双重排序法。由此可知，该模型中的动量因子和 Carhart 四因子模型中的不同，因为后者的动量因子是通过单变量排序构造的。下面重点介绍一下盈利因子（PMU）的构建（图
    4.2）。


    以 NYSE 中上市公司 GP 的 30% 和 70% 分位数为界，把 NYSE、NASDAQ 及 AMEX 三大交易所的上市公司依据 GP 高低分为盈利（Profitable，即
    GP 在 70% 分位数之上）、中性（Neutral，即 GP 介于 30% 和 70% 分位数之间）以及不盈利（Unprofitable，即 GP 在 30%
    分位数之下）三组。这三组再加上市值高低的独立划分共得到六个投资组合：S/P、S/N、S/U、B/P、B/N 及 B/U，每个组合中的股票均按其市值确定权重。


    | Gross Profitability |  |  |  |

    |  | Profitable (盈利) | Neutral (中性) | Unprofitable (不盈利) |

    | 市值 Small (小市值) | S/P | S/N | S/U |

    | Big (大市值) | B/P | B/N | B/U |


    市值分组依据：NYSE 中位数；

    GP 分组依据：NYSE 30% 和 70% 分位数。


    # 图4.2 GP 和市值双重排序


    与 Fama-French 三因子模型及 Carhart 四因子模型不同的是，在构建这三个因子时，Novy-Marx（2013）进行了行业中性处理，即在做多一只股票的同时按同等权重做空该股票所属的行业指数，从而得到行业中性化后的投资组合。最后，由于盈利和预期收益率呈正相关，因此使用盈利组
    S/P 和 B/P 和不盈利组 S/U 和 B/U 的收益率之差构建盈利因子，公式见式（4.6）：'
