  md: '```

    $$\frac{M_t}{B_t}=\frac{\mathrm{E}_t\left[\frac{Y_{t+1}}{B_t}\right]-\mathrm{E}_t\left[\frac{dB_{t+1}}{B_t}\right]+\mathrm{E}_t\left[\frac{M_{t+1}}{B_t}\right]}{1+\mathrm{E}_t[r_{t+1}]}\qquad(4.36)$$

    ```


    从式（4.36）可推导出BM和ROE各自与单期预期收益率Eₜ[rₜ₊₁]之间的关系：


    +   (1) 当（4.36）中除了Mₜ、Bₜ以及Eₜ[rₜ₊₁]的其他变量保持不变时，更高的 Bₜ/Mₜ（BM）对应着更高的预期收益率Eₜ[rₜ₊₁]，因此BM和预期收益率之间正相关；


    (2) 当（4.36）中除了Yₜ₊₁、Bₜ以及Eₜ[rₜ₊₁]的其他变量保持不变时，更高的 Eₜ[Yₜ₊₁/Bₜ]对应着更高的预期收益率Eₜ[rₜ₊₁]。由于Eₜ[Yₜ₊₁/Bₜ]正是未来的预期ROE，因此它和预期收益率之间正相关。


    需要说明的是，在因子投资中，未来预期ROE是未知的，已知的仅仅是过往的ROE。但Zhang（2017）的研究发现上市公司历史ROE是未来预期ROE的一个可靠预测，因此可以近似认为历史ROE和预期收益率之间正相关。综合以上两点可知，从（4.36）中可以推导出BM和ROE都可以用来构建因子、预测股票的收益率。另一方面，正如前文反复强调的，EP=BM×ROE这个关系表明EP与BM和ROE紧密相连。因此，既然BM、ROE和预期收益率正相关，那么EP显然和预期收益率正相关。然而，仅仅使用EP代替BM来构造价值因子，并舍弃ROE代表的盈利维度仍然存在两个问题。首先，Penman
    and Reggiani（2018）针对美股的研究表明，为了更准确地对公司估值，在BM、EP和ROE这三个变量中应该考虑两个，仅考虑一个会丢失一些重要的信息。第二，仅从实证角度出发，由EP=BM×ROE可知EP和ROE正相关，因此使用EP构造的价值因子在盈利维度上有无法避免的暴露，这会提升价值因子的表现，使得以EP构造的价值因子不够纯粹。基于上述两点考虑，Liu
    et al.（2019）认为分别使用BM和ROE构造价值和盈利因子要比仅使用EP构造价值因子更合理。


    # 4.3.3 模型比较的实证结果


    为比较4.3.1节提及的两个多因子模型，首先需要在本书的实证周期内复现它们，即构建每个模型的因子。为此，本书采用尽可能贴近原始论文的方式构建因子。除市场因子外，Liu
    et al.（2019）以市值和EP为变量，并依照Fama and French（1993）的方式，通过2×3独立双重排序构建了他们的规模和价值因子。在每月末，对于股票池中的股票，使用市值的中位数将它们划分成小市值组（S）和大市值组（B），同时使用EP的30%和70%分位数将它们划分成价值组（V，EP在70%分位数之上）、中间组（M，EP在30%和70%分位数之间）和成长组（G，EP在30%分位数之下）。使用上述划分得到的六个投资组合（依照惯例，每个投资组合内采用市值加权），Liu
    et al.（2019）三因子模型中的规模和价值因子分别为：


    ```

    $$\text{CHN-SMB}=\frac{1}{3}(\text{S/V}+\text{S/M}+\text{S/G})-\frac{1}{3}(\text{B/V}+\text{B/M}+\text{B/G})\qquad(4.37)$$

    ```


    ```

    $$\text{CHN-VMG}=\frac{1}{2}(\text{S/V}+\text{B/V})-\frac{1}{2}(\text{S/G}+\text{B/G})\qquad(4.38)$$

    ```'
