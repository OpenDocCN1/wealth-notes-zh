  md: '（2.5）是对这5个高排位和5个低排位投资组合“先分别取平均、再做差”，而式（2.7）则是将它们两两“先做差、再取平均”。在数学上，这两种方式完全是等价的，而式（2.5）的方式也确实是常见的计算因子收益率的方法☐。但是，之所以介绍式（2.7）和式（2.8）这种表达式，是因为它们经常被用于对异象的研究中。


    在学术界针对美股市场异象的研究中，双重排序法经常被使用。为了检验一个新的异象变量可以获得超额收益，学者们往往用它和已有的因子变量进行双重排序，从而排除已有因子的影响。在进行分析时，学者们除了关心异象收益率之外，还关心在已有因子变量的每组内，该异象变量是否能区分股票收益率的截面差异。回到上面X₁和X₂的例子，为检验能否通过X₁构建异象，应考察在每个X₂分组内，根据X₁划分的L₁个分组中最高和最低的组的收益率差异是否显著☐。在这种情况下就会关心每个R_{L₁i}
    - R_{1i}的取值。以上就是式（2.7）和式（2.8）这两种表达式也存在的原因。但再次强调的是，当使用独立双重排序法时，无论使用哪种表达式都不影响λ_{X1,t}和λ_{X2,t}的计算结果。


    独立双重排序虽然简单，但它也有一个缺点，即独立排序可能导致某些组合包含的股票数目过少。举个例子，假设共有1000支股票，按照X₁和X₂两变量各分为5组，得到25个组合，平均下来每个组合包含40支股票。当X₁和X₂的截面相关性很高时，那么当一支股票在X₁变量取值较高时，它在X₂上的取值也会较高。这就会造成这两个变量相同的分组中——图2.2中对角线上的组——的股票个数较多，而其他组内（特别是高X₁、低X₂组以及低X₁、高X₂组）的股票个数较少。这种分组内股票数量的不平衡将使得最终的因子收益受异常值影响的可能性更高，造成因子收益率的不稳定并且也会影响在实践中的实施☐。在实际研究因子时，上述缺点虽然存在，但通常不会带来太大的问题。这是因为人们通常不会使用截面相关性高的变量做双重排序。当对参与排序的两个变量的相关性不确定时，可以计算每组内股票的数量。如果全部L₁×L₂个投资组合均包含足够多的股票，那么就没有太大的问题。


    接下来介绍条件双重排序。它与独立双重排序最大的区别是按照给定的顺序先后使用两个变量对股票进行排序。仍然以X₁和X₂两个变量为例。假设先用X₁排序将全部股票划分成L₁组。接下来，在以上每个组内，再用X₂排序把属于该组内的股票进一步划分为L₂个组，最终得到L₁×L₂个分组。从这个例子中不难看出，条件双重排序是考察当X₁控制之后，变量X₂对股票收益率的影响。反之，如果按照先用X₂排序、再用X₁排序，那就是在考察控制了X₂之后，变量X₁对股票收益率的影响。


    条件双重分组关心的是当第一个变量被控制之后，第二个变量是否对解释收益率有增量信息。在这种方法中，两个排序变量的地位是不对称的：第一个排序变量仅仅作为控制变量，人们关心的是第二个排序变量和收益率之间的关系，因此只需（也只应）围绕第二个排序变量构建因子并计算因子收益率☐。


    在条件双重排序方法中，学术界通常使用以下两种方法为第二排序变量计算因子收益率。第一种方法和独立双重排序法中的收益率公式并无不同。假设X₁和X₂分别为第一、第二排序变量，则围绕X₂构建的因子收益率就如式（2.6）或式（2.8）所示（如果需要计算X₁的因子收益率，只需将两个排序变量的先后顺序调换）。除此之外，还有另外一种方法。仍以X₁和X₂分别为第一、第二排序变量为例。在这种方法中，将全部L₁个X₂排名最高的组，即P_{iL2}（i=1,2,…,L₁），以及L₁'
