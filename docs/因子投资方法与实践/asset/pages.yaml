  md: '文指出，当使用投资组合时，个股β的估计误差会相互抵消，因此投资组合β值（个股βi的加权平均）的估计会更准确，从而在一定程度上降低EIV的影响。


    自此以后，在进行Fama-MacBeth回归检验因子时，使用投资组合而非个股作为资产就成了主流做法。但有大佬对此颇有微词，这其中就包括Eugene Fama的学生Richard
    Roll。Roll和他的合作者在Jegadeesh et al.（2019）一文中指出，将个股按照某种属性分组、构建投资组合作为资产实际上是一种降维处理，投资组合会丢掉很多个股截面上的特征。如果待检验的因子和这些投资组合恰好正交，那么用它们作为资产进行Fama-MacBeth回归是无法发现这些因子的风险溢价的。因此，Jegadeesh
    et al.（2019）建议仍然使用个股作为资产检验因子，并提出通过引入工具变量（instrumental variables，IV）的方法应对EIV问题。


    除此之外，应对EIV问题的另一种方法则显得更加“颠覆”，它干脆舍去了第一步的时序回归，而是直接采用公司特征（firm characteristic）的取值（经必要标准化处理后）作为因子暴露的估计
    β̂i。举个例子，假设考虑围绕账面市值比（BM）构建的价值因子，按照Fama-MacBeth回归的传统做法，应该把个股和该因子收益率做时序回归求出因子暴露；而另一种处理方式是直接使用BM取值，将其进行必要的标准化处理之后作为股票在该因子上的暴露。


    这两种选择因子暴露的方法大相径庭。它们之间孰优孰劣呢？它们又如何影响因子收益率的计算呢？这些问题的答案就是本节的内容。接下来先看一看引入工具变量的做法。


    # 2.3.1 引入工具变量


    在t时刻，资产超额收益率和因子暴露满足如下截面线性回归模型：


    ```

    R_{it}^{e}=γ_t+β̂_i''λ_t+α_{it},  i=1,2,…,N   (2.47)

    ```


    为便于讨论，引入如下数学符号。令 R_t^e=[R_{1t}^e,R_{2t}^e,…,R_{Nt}^e]''，β̂_E=[β̂_1,β̂_2,…,β̂_N]''以及α_t=[α_{1t},α_{2t},…,α_{Nt}]''；定义N×(K+1)矩阵
    B̂_E≡[1_N,β̂_E]；定义（K+1）维向量ζ_t≡[γ_t,λ_{1t},…,λ_{kt}]''。由定义可知，ζ_t中的第一项是模型（2.47）中的截距项，而后面K项则是这K个因子t期的收益率。使用上述定义，并将全部N个资产放在一起表达，（2.47）变为：


    ```

    R_t^e= B̂_E ζ_t + α_t   (2.48)

    ```


    为减少EIV问题的影响，Jegadeesh et al.（2019）在估计模型（2.48）的参数中引入了工具变量，得到ζ_t的IV估计量：


    ```

    ζ̂_IV,t = (B̂_I'' B̂_E)^{-1} (B̂_I'' R_t^e)   (2.49)

    ```


    式中 B̂_I≡[1_N,β̂_I]是 B̂_E的工具变量。Jegadeesh et al.（2019）使用互不重叠的历史数据分别进行时序回归计算 B̂_E和
