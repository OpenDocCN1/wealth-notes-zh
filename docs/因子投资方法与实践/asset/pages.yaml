- pgno: 294
  md: '做更多讨论。以ESG数据为例，它从环境、社会和公司治理等角度关注具有长期可持续发展的公司，近年发展迅速，越来越受到投资者的青睐。


    # 7.1.3 挑选预测变量


    随着数据的丰富和计算的廉价，越来越多的预测变量被挖掘出来。然而，预测变量的个数也并非越多越好，且也并非越复杂越有用。是否将一个新的预测变量纳入已有的收益率模型，需要一套合理且明确的标准。理想的收益预测变量应满足以下六大标准：逻辑性（intuitiveness）、持续性（persistence）、信息增量性（information
    increasement）、稳健性（robustness）、可投资性（investability）和普适性（pervasiveness），它们的具体解释见表7.1。从想法产生到进入应用，只有满足上述六个条件，才可能成为一个有用的预测变量。


    # 表7.1 收益预测变量应满足的六个标准


    | 标准 | 定义 |

    | --- | --- |

    | 逻辑性 | 要有合理的逻辑，无论是从风险视角，还是从行为金融学视角 |

    | 持续性 | 有效且长期有效，即使被公开发表，也并未失效 |

    | 信息增量性 | 要有差异性，不能被已有的预测变量解释，能够对预测收益率带来独立的信息增量 |

    | 稳健性 | 定义对参数不敏感，经得起稳健性检验 |

    | 可投资性 | 收益不能只停留在纸面上，应具有较高可投资性，交易成本可控 |

    | 普适性 | 广泛存在于不同的资产类别或不同国家的同一类资产中 |


    # 1. 逻辑性


    由于多重假设检验的问题（6.1.5节），有时仅凭运气也能针对历史数据（也称为样本内数据）找出一些看上去能够预测收益率的变量，然而它们在样本外却不再有效。为了降低甚至是排除这种干扰，逻辑性就是寻找预测变量时最重要的标准。如果没有底层的逻辑，再漂亮的结果都没有灵魂。


    根据学术界多年的研究可知，预测变量背后的逻辑可以从风险补偿和错误定价两方面解释。前者是经典金融学的角度，认为如果一个异象能够获得超额收益，它有可能承担了某种（未知）的系统性风险，而超额收益是对风险的补偿。后者从行为金融学的角度，认为人的行为偏差以及套利限制的综合作用导致错误定价的出现，且不会迅速消失。如果从上述两个方面都无法解释，那么某个预测变量很可能仅仅是针对样本内的数据窥探导致。至于如何检验该变量的原因是风险补偿、错误定价还是数据窥探，6.5节进行了详细的介绍。


    # 2. 持续性


    仅有理论逻辑并不够，还要看实证数据是否支撑该理论。如果通过实证分析发现该变量确实能够预测未来收益率，那么它就是有效的。例如，很多针对美股研究出来的预测变量到了A股都出现了水土不服的现象。这背后很大程度上和两国股市中投资者结构不同有关。因此，实证结果能否支撑逻辑至关重要。在评价有效性时，常用的步骤包括：IC测试、投资组合排序法以及发表前后检验等。'
