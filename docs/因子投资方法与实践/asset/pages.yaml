  md: '质量进行综合性评估。神奇公式则主要由两个指标构成：净有形资产回报率（分子为息税前利润，分母为净流动资产与净固定资产之和）和盈利回报率（息税前利润与企业价值之比）。质量因子则由盈利能力、成长性和安全性三个维度复合而成。同Frankel
    and Lee（1998）类似，Bartram and Grinblatt（2018）的AFA策略也着重于买入内在价值相对股价较高的公司。但有所不同的是，后者将企业的内在价值与财务数据相关联，通过公司市值对16个来自资产负债表的指标、11个来自利润表的指标，以及1个来自现金流量表的指标的截面回归来估计公司的内在价值，然后计算内在价值相对价格的偏离幅度并据此选股。从上述描述可知，Bartram
    and Grinblatt（2018）关注的是通过其他公司隐含的企业内在价值。最后，Penman and Zhu（2019）指出股票的下期预期收益（1-period
    ahead expected return）与公司的预期盈利及预期盈利增长有关，并用8个指标凹来估计预期盈利和预期盈利增长，然后构建选股策略。


    Hou et al.（2019a）使用多空对冲组合代表上述每一个策略，并检验该组合是否能够获得q和q⁵模型无法解释的超额收益，以及该组合在模型所包含的风格因子上是否有显著的暴露。表7.27总结了检验结果凹。对于绝大多数价值投资策略，q和（或）q⁵模型中的因子均能较好地解释它们的收益率，说明这些策略的风格可以被这些因子解释。具体结果详见表7.27，文中不再赘述。


    # 表7.27 价值投资策略风格分析结果


    | 策略 | 风格分析 |

    |---|---|

    | 内在价值策略 | 内在价值策略在 q 和 q⁵ 模型下均没有显著的 α；其多空对冲组合在投资因子上有显著的正暴露。从金融学角度来说，这是符合逻辑的，因为股票内在价值同账面价值的增长有关，而账面价值的增长与投资因子密切相关
