    # 2.1.2 排序法及其检验


    大量研究发现，股票的收益率受很多因子影响。因性质不同，因子又可以被分为不同的种类。以2.1节开篇举的两个例子来说，围绕诸如估值这类股票的财务信息或者量价数据构建的因子代表了最主流的一类因子，它们被称为股票的风格因子（style
    factor），典型的风格因子还包括市值、盈利、低波动等；而像围绕GDP这类经济数据构建的因子则被称为宏观经济因子。因子的种类远不止风格因子和宏观经济因子两类，上面的例子只是为了说明数据的属性决定了因子的类别。有必要指出的是，本节介绍的排序法是针对风格因子构建因子模拟投资组合'
