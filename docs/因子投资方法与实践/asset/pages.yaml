- pgno: 112
  md: '式中$E[R_z]$是第二个因子的预期收益率。由于该因子的系数是 $(1-\beta_i)$，因而Black et al.（1972）将该因子称为零$\beta$因子，其收益率$R_z$和市场组合的收益率$R_M$满足协方差为零，即$\text{cov}（R_z,R_M）=0$。观察式（3.1）可知，如果考察资产超额收益$E[R_i]-R_f$和其$\beta_i$的关系，则Sharpe–Lintner
    CAPM模型暗示这二者关系之间的斜率为市场组合的预期超额收益$E[R_M]-R_f$。反观两因子的Black CAPM模型，随着$(1-\beta_i)\
    E[R_z]$这一项的加入且这一项的收益率和资产的$\beta_i$成反比，式（3.2）隐含的资产预期收益$E[R_i]$和$\beta_i$之间的关系相比传统CAPM模型则更加平坦，而这也恰恰更符合实证数据的结果。


    由于更加符合实证数据的结果，Black CAPM得到了比Sharpe–Lintner CAPM更广泛的应用，也拉开了关于CAPM的研究序幕。诸多学者从不同角度对CAPM模型进行了大量的实证分析，主要目的是检验CAPM模型隐含的资产预期收益与其$\beta$之间的关系。学者们将这二者之间的关系提炼为三个待检验的假说：（1）仅依据$\beta$，便可解释资产的预期收益的截面差异，且二者之间的关系是线性的。（2）市场组合的超额收益显著为正。（3）如果资产和市场组合不相关（即$\beta$为零），则其预期收益率应为无风险利率，其超额收益为0。为了检验这些假说，截面回归和时间序列回归检验方法被应用于此类检验。但颇为遗憾的是，实证研究大都不支持传统的CAPM模型。其中较为重要的发现有两点。其一，市场组合的平均超额收益很高，但高、低$\beta$组合之间的收益差异要小很多，远远小于CAPM模型隐含的差异，这和Black
    CAPM模型的结果相符。其二，诸多研究分别发现按照市值、账面市值比（book-to-market ratio，BM）、盈利市值比（earnings-to-price
    ratio，EP）等变量有助于解释股票预期收益，这也进一步拒绝了CAPM模型。当然，从学科发展的角度来说，CAPM模型被实证证据拒绝也并非坏事，毕竟，正因如此才有了多因子模型和因子投资的兴起。Fama
    and French（2004）对此进行了很深入的综述和介绍。


    总体来看，市场因子对于解释股票收益的时间序列变化很有帮助，是很重要的因子。但诸多证据也显示单凭市场因子不能很好地解释股票收益的横截面差异，这使得引入其他因子、构建多因子模型成为必要的选项。此外，实证研究发现资产预期收益和$\beta$之间的斜率远小于CAPM模型隐含的结果，而更加符合Black
    CAPM模型。该结果也催生了一大类很重要的异象，即低$\beta$异象——通过做多低$\beta$的股票、同时做空高$\beta$的股票来获取超额收益。Frazzini
    and Pedersen（2014）以*Betting against beta*为题详细讨论和实证了这个异象。该文一经发表就获得了学术界和业界的高度关注。


    # 3.2.3 市场因子实证


    由于市场因子并非传统风格因子，因而无须构建多、空对冲的因子模拟组合来检验它。本书在构建市场因子时，选用所有股票按照总市值加权的方式，以此得到的投资组合就是市场因子的投资组合。本节的实证重点则在于以下两点：


    +   （1）检验市场组合的超额收益对个股超额收益在时序上的波动的解释程度；

    （2）检验CAPM。


    对于第一点，首先使用每支个股的全部超额收益率数据和市场组合同期的超额收益率数据，通过时序回归并求出可决系数（coefficient of determination），即$R_2$，它的高低代表了市场因子在时序上解释个股超额收益的能力。表3.12和图'
