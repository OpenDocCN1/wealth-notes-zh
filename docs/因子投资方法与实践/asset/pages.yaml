  md: '![](img/8ad8b7f696519d8b709b07f70d7ebfdb_79_0.png)


    y在x上的投影：\(\frac{\langle x,y\rangle}{\langle x,x\rangle}x\)


    图2.13 一元回归几何意义


    为了加深对回归的几何意义的理解，下面再看看二元回归$y=b_1x_1+b_2x_2+\varepsilon$。假设$x_1$和$x_2$之间是正交的。它的几何意义（图2.14）是将$y$垂直投影到由$x_1$和$x_2$生成的平面内，记为$\hat
    y$。此外，将$y$分别单独投影到向量$x_1$和$x_2$上。由于$x_1$和$x_2$相互正交（即垂直），因此向量$\hat y$恰好等于上述两个向量之和。因此，当$x_1$和$x_2$正交时，OLS估计$\hat
    b_i$仅由$x_i$和$y$决定，其他任何解释变量$x_j\ (j\neq i)$ 对$\hat b_i$均没有影响。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_79_1.png)


    图2.14 二元回归几何意义（$x_1$和$x_2$正交）


    当$x_1$和$x_2$非正交时会怎样呢？在这种情况下，二元回归的几何意义如图2.15所示。它和图2.14最大的区别是，$y$在由$x_1$和$x_2$生成的平面内的投影不等于$y$分别在$x_1$和$x_2$上的投影之和。在这种情况下，解释变量之间对各自回归系数的OLS估计有不同的作用，$\hat
    b_i$不再等于$\langle x_i,y\rangle / \langle x_i,x_i\rangle$。非正交$x_i$之间的相互作用如何影响回归系数$\hat
    b_i$呢？通过连续正交化来求解多元线性回归可以回答这个问题。'
