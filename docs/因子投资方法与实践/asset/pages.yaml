  md: '# 7.5 因子择时


    无论是使用多因子模型作为数量化工具来预测收益率（阿尔法因子），还是通过因子指数化（Smart Beta）进行因子投资获得超额收益，因子择时（factor timing）山都是一个绕不开的话题。由于股票的收益率由因子的收益率驱动，而因子收益率在时序上有波动性，因此因子择时的美好愿景就是在因子收益率高的时候赋予它更高的权重，而在因子收益率低的时候赋予它更低的权重。由于金融领域数据信噪比极低，时序上可利用的相关性非常有限，所以这件事听上去就十分艰难。但学术界和业界都对因子择时十分着迷，只因择时成功的吸引力太强。


    虽然理想很“丰满”，但现实很“骨感”，要成为先知显然不可能，因此只能通过各种科学方法对因子在时序上的表现进行合理预测，这也是因子择时研究的对象，而其目标就是战胜等权重配置因子获得的收益率。因子择时，既可以来自主观判断，也可以基于量化建模，而两者都需要寻找影响因子未来收益的因素，即因子的因子。综合学术界和业界的相关研究，影响因子未来收益率的因素大致可以分为五类，如表7.22所示。其中前三类因素和因子自身的表现有关，而后两个因素则来自外部环境。


    # 表7.22 用于因子择时的因素


    | 因素 | 典型代理变量 | 含义 |

    | --- | --- | --- |

    | 因子估值 | 价值价差（value spread） | 衡量因子的估值水平 |

    | 因子动量 | 过去12个月累计收益率 | 衡量因子过去一段时间的表现 |

    | 因子波动 | 因子收益率的波动率 | 衡量因子的风险水平 |

    | 市场状态 | 市场情绪：波动性、流动性和趋势性 | 衡量市场所处的某一个状态 |

    | 宏观环境 | 经济增长、通货膨胀、利率水平等 | 因子的宏观驱动因素 |


    # 7.5.1 按因子估值择时


    一个资产当前估值是高还是低，取决于价格偏离真实价值的程度，这个真实价值即估值锚点。价格围绕价值波动，具有均值回复特征，如果价格高于这个锚点则被高估，预期收益为负；如果价格低于这个锚点则被低估，预期收益为正。一般来说，人们比较熟悉的是股票估值，例如学术文献常用BM作为代理指标。而在其他资产类型中，也可以定义相似的指标。Asness
    et al.（2013）定义了国家指数、国债、商品期货和外汇等的估值因子，Israel et al.（2018）定义了公司债的估值因子。那么，因子的投资组合同样身为一种资产，如何判断其估值高低呢？


    Asness et al.（2000）在研究价值因子时给出了答案，他们首先根据'
