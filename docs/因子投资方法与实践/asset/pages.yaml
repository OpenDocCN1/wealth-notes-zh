  md: '中，人们根据不同的目标函数使用Σ构建最优组合。比如常见的最小方差组合，又比如大名鼎鼎的均值一方差模型都要用到Σ。


    假设按某个给定目标函数求出的最优投资组合中股票的权重向量为ω，则利用ω和Σ可以计算出该投资组合的方差σ²ₚ = ω''Σω。一个自然而然的问题就是σₚ是否准确。换句话说，该最优投资组合的偏差统计量是否显著地偏离1.0。如果这个问题的答案是否定的，则说明最优投资组合的事前风险估计是不准确的，这将极大影响该组合的表现。由Σ的定义式（7.18）可知，个股协方差矩阵可以分解为因子协方差矩阵Σₗ和个股特质性收益率协方差矩阵Σₑ两部分。由于模型假设特质性收益率之间相互独立（即Σₑ是对角阵），因此σ²ₚ是否准确在很大程度上取决于ω''βΣₗβ''ω。


    定义ωₗ≡(ω''β)''，则ω''βΣₗβ''ω可以简化表达为ωₗ''Σₗωₗ。ωₗ''Σₗωₗ的意义是，把因子的纯因子组合当作资产，按某种“最优”权重ωₗ配置这些资产，得到投资组合的方差。σ²ₚ很大程度上依赖于这些因子资产的某种最优组合的方差，因此可以将对个股最优组合偏差统计量的关注，转移到对因子的最优投资组合的偏差统计量的关注上来。如果ωₗ''Σₗωₗ并非准确的事前风险估计，则个股最优投资组合方差的事前风险估计也不会准确。那么，使用历史数据计算Σ̂ₗ是否为真实因子协方差矩阵Σₗ的准确估计呢？接下来的分析将指出，这个问题的答案是否定的。首先，对Σ̂ₗ进行特征分解（且利用它是对称矩阵的性质）：


    Σ̂ₗ = U D U''  (7.37)


    式中U是Σ̂ₗ的特征向量矩阵，U的第i列是Σ̂ₗ的第i个特征向量；D是对角阵，对角线上的元素为对应的特征值。利用Σ̂ₗ是对称矩阵的性质可知，U是正交矩阵，即U⁻¹=U''。为了解释U和D的含义，将式（7.37）变形得到：


    U'' Σ̂ₗ U = D  (7.38)


    对于每个特征向量，如果把因子投资组合视作资产，以特征向量中第k个元素作为因子k的权重就得到了一个特殊的投资组合，即特征因子投资组合（eigenfactor
    portfolio）。由于U中有K个特征向量，因此共有K个特征因子组合。特征向量相互正交保证了这些投资组合相互独立、协方差为零。且由式（7.38）可知，对角阵D对角线上的元素正是K个特征因子组合的方差。


    由于U是正交矩阵，因此这些特征因子组合构成了一组正交基。当以这K个因子作为资产时，它们的任意一组权重ωₗ都可以表达成这组正交基的线性组合。因此，ωₗ''Σₗωₗ的事前风险估计ωₗ''Σ̂ₗωₗ是否准确取决于这K个特征因子组合方差的事前风险估计是否准确。然而，研究表明这些特征因子组合的偏差统计量并非都接近1.0，而和组合的方差成反比，即特征因子组合的事前方差估计越小，其事后偏差统计量越大，且显著高于1.0。该实证结果说明对于该特征因子组合，事前方差估计非常不准确。既然特征因子组合的事前方差估计不准确，可想而知ωₗ''Σ̂ₗωₗ也不准确，因此个股的某个最优组合的方差的事前估计也难以准确。为了解决这个问题，Menchero
    et al.（2011）提出了特征因子调整法，它能够有效消除特征因子组合方差事前估计的偏差，使得事后偏差统计量接近1.0。'
