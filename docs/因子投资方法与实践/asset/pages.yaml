    观察式（4.21）可知，当预期盈利E₀[Πᵢₜ]给定时，股票收益率和投资Iᵢ₀/Aᵢ₀成反比；当投资给定时，股票收益率和预期盈利成正比。在上述关系中，投资Iᵢ₀/Aᵢ₀是时刻0的，故为历史投资。值得一提的是，q-因子模型和Fama–French五因子模型中均包括投资因子，但前者从实体投资经济学理论推出收益率和历史投资的关系，而后者使用股息折现模型推出收益率和预期投资的关系，因此二者存在很大的差异。本书在6.2.1中将解读它们的差异。


    在实证研究中，Hou et al.（2015）使用ROE和总资产变化率作为代表盈利和投资的指标。在构建因子时，为了体现上述条件预期收益率的关系，他们使用市值、单季度ROE和总资产变化率进行2×3×3独立三重排序，其中市值按纽交所中位数划分、ROE和总资产变化率按纽交所30%和70%分位数进行划分。独立三重排序共得到18个投资组合，每个组合内的股票按照市值加权。令c₁、c₂、c₃依次代表每个投资组合在市值、ROE和总资产变化率三个变量上的划分，其中c₁取值为S和B分别代表小市值和大市值，c₂和c₃分别取值为H、M、L来代表高、中、低三档；令数学符号c₁/c₂/c₃代表上述三个变量某个划分交集得到的分组。例如，S/H/H代表由小市值、高ROE和高总资产变化率股票构成的分组。依照上述数学符号，使用这18个投资组合，规模（ME）、盈利（ROE）、投资（I/A）三因子的定义如下：


