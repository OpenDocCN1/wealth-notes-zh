    | 股票数（支） | 均值 | 标准差 | 最小值 | 25% 分位数 | 中位数 | 75% 分位数 | 最大值 |

    |---|---|---|---|---|---|---|---|

    | 3365 | 4.16% | 34.53% | -1227.85% | 2.87% | 7.03% | 11.69% | 78.51% |


    剔除异常值的方法包括缩尾法（winsorization）、均值标准差法、中位数法和Boxplot法，其中缩尾法最简单也最常见。本书7.1.4节将简要介绍常见的剔除异常值方法。本书的实证中将采用左右各1%的缩尾处理，将小于1%分位数和大于99%分位数的样本点剔除。


    # 3. 排序和分组'
  merge: -1
  img_proc: true
- pgno: 108
  md: '本章的因子实证分析将同时采用单变量排序和独立双重排序法。单变量排序将按某财务或量价指标的十分位数将股票分成10组，统计每个组合的股票特征和预期收益，并检验收益率的显著性。在独立双重排序时，使用市值和目标因子的变量对股票进行独立排序、各分成5组，然后将它们相交得到5×5=25个投资组合，并按照（2.6）计算因子收益率并检验。由于在双重排序中将市值作为一个默认的排序变量，因此这种方法对市值因子不适用。因此，对于规模因子，仅采用市值进行单变量排序。最后，无论单变量排序得到的10个投资组合，还是双重排序得到的25个投资组合，每个投资组合内股票或按等权重、或按总市值作为权重，计算投资组合的收益率。


    # 4. 因子投资组合调仓频率


    一般来说，对于量价类因子（如动量），调仓频率为月度；对于财务类型的因子（如盈利），调仓频率为年度。为了更快地利用因子信息，减少滞后带来的损耗，本书对每一个因子均在每月末进行换仓。为了尽量和实际一致，在调仓日剔除当天停牌股票和一字涨停股票，因为这些股票无法成交。


    除此之外，本书将一字跌停股也列入不可交易股的范畴，原因如下。无论是单变量排序还是双重排序，划分出的每个投资组合本身都是多头组合。在构建多头组合时，规避一字跌停股票的原因是出于风控角度的考量。在构建因子投资组合时，需从上述划分出的组合中挑出一部分做多、一部分做空，即使用多、空对冲的组合作为因子和异象组合。因此，在做多时限制买入一字跌停股等价于在做空时限制卖出一字跌停股，这将使空头部分的收益率更符合实际情况。


    最后，本书将投资组合再平衡时的交易成本设为0，即不考虑成本。通常来说，交易成本需要精确建模，或者粗略地估算为单边3%计算。


    # 5. 研究范围


    本书的股票池范围是上海证券交易所主板，深圳证券交易所主板、中小板和创业板的所有股票，即除去科创板后的全部A股。在时间跨度上，起始日为2000年1月1日，结束日为2019年12月31日，整整20年。之所以选择从2000年开始，主要出于两个原因。首先，会计规则从1999年才开始成型和标准化，这样选择能尽量保证财务口径前后一致。其次，选择从2000年开始可以保证足够的样本数量，避免因股票数量太少导致统计误差。图3.10统计了研究区间在市股票数量，可以看到A股上市公司数量逐年增长，2000年年初只有925支，而2019年12月31日已经达到3692支。'
