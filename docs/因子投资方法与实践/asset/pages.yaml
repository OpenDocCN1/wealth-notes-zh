- pgno: 245
  md: '# 6.3.3 风险偏好中的偏差


    因为资产的收益充满着不确定性，所以研究人们在风险下的决策偏好至关重要。在行为金融学框架中，理解人们的风险偏好偏差的两大关键要素是前景理论和模糊厌恶。


    # 1. 前景理论


    前景理论（Prospect Theory）由心理学家Daniel Kahneman和Amos Tversky提出（Kahneman and Tversky
    1979, Tversky and Kahneman 1992）[1]，它是一个描述人们如何在不确定下做决策的分析框架。具体来说，前景理论研究的问题是，当面对多个选项时，人们如何评估不同的选项并选出他认为最优的选项。在这个描述中，“选项”可以是购买不同的股票，或者参加不同的博弈。而体现不确定性的是，每个选项都有
    m≥1 种结果，其中每个结果都有一定的实现概率[8]，人们需要依据每个选项可能出现的结果来计算该选项的价值，并选出价值最高的。


    在最初提出前景理论的论文Kahneman and Tversky（1979）中，两位作者假设每个选项最多有两个非零结果。令x和y代表某选项的两个非零结果，p和q分别代表它们发生的概率，则该选项在数学上可以描述为：


    ```

    (x, p; y, q)      (6.11)

    ```


    上述数学符号的意思是“以概率p获得结果x，以概率q获得结果y”，且x和y满足 x≤0≤y或y≤0≤x。根据前景理论，人们赋予（x, p; y, q）所代表的选项价值为：


    ```

    v(x) π(p) + v(y) π(q)      (6.12)

    ```


    其中v(.) 表示价值函数，π(.) 表示权重函数。某个选项的价值就是其所有可能出现结果的价值的加权平均，反映一种“预期”的概念，这也是前景理论中prospect一词的由来。对于每个选项，人们按照式（6.12）计算其价值，然后在所有选项中选择价值最高的那一个。从式（6.12）可知，前景理论的核心就是价值函数和权重函数。Kahneman
    and Tversky（1979）之所以极具创造性和现实意义是因为通过大量的心理学实验定性总结了v(.)和π(.)所具备的性质[1]。图6.3绘制了 v(.)
    和π(.)。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_245_0.png)'
