    # 2.2.1 时间序列回归


    时间序列回归（time-series regression）简单直接，Black et al.（1972）最早使用它来检验CAPM。这种方法在回归时使用因子收益率作为自变量（independent
    variable）或解释变量（explanatory variable），以资产的超额收益率作为因变量（dependent variable）或被解释变量（explained
    variable）。


    此方法更适合分析由风格因子构成的多因子模型，这是因为人们可以使用2.1节介绍的排序法构建风格因子的因子模拟投资组合，并计算其收益率作为解释变量。对于其他类别的因子，比如GDP等宏观经济因子，由于难以应用排序法构建它的因子模拟投资组合以及计算收益率，所以这种方法就无法使用，举例来说，Fama
    and French（1993）中的价值（HML）和规模（SMB）因子均是风格因子。该文使用独立双重排序构建了这两个因子的投资组合，并计算了它们的收益率时间序列，使用它们就可以方便地进行时间序列回归检验。


    令λt表示t期因子收益率向量，Rit e为资产i在t期的超额收益率，这二者在时序上满足如下线性关系：


    Rit e = αi + βi′λt + εit,  t = 1,2,…,T  (2.13)


    对每个资产i=1,2,…,N，使用简单最小二乘（Ordinary Least Squares，OLS）对模型（2.13）进行参数估计。在时间序列回归中，回归方程右侧自变量是因子收益率λt，左侧的因变量是Rit
    e，回归得到资产i在因子上的暴露β̂i向量，截距α̂i，以及残差ε̂it。一旦有了α̂i和β̂i，将Rit e和λt在时序上取均值就可得：


    ET[R i e] = α̂i + β̂i′λ̂,  i = 1,2,…,N  (2.14)


    式中 ET[·]≡1/T∑(·)表示对样本数据在时序上取均值；λ̂=ET[λt]是资产预期收益率和因子暴露在截面上的关系式。时间序列回归中的截距α̂i正是资产i的定价误差的估计。由（2.14）可知，时间序列回归的好处是可以方便地估计每个因子的预期收益率。对于任意因子k，其收益率序列λkt在时序上的均值就是因子k预期收益率的估计：


    λ̂k = ET[λkt],  k = 1,2,…,K  (2.15)'
