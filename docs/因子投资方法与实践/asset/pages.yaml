  md: '# 6.2 从“因子动物园”到“因子大战”


    6.1节引出了“因子动物园”的概念，介绍了学术界在挖掘异象和因子时的现状、问题和解决之道。本节把目光放到介绍多因子模型的研究现状，并引出“因子大战”的概念。


    从多因子模型的定义出发，一个优秀的多因子模型应该回答两个问题：（1）资产收益率背后的驱动有哪些（即模型中应该包含哪些因子）；（2）每个驱动背后的原因（即因子的解释）。只有从回答这些问题出发，人们才能加深对多因子定价模型以及股票市场的理解。事实上，最早的Fama-French三因子模型也确实是朝着这个方向努力的。Fama
    and French（1996）从风险的角度将上述三因子模型中的规模（SMB）和价值（HML）因子与财务困境风险联系起来，猜想它们代表某种投资人需要对冲的系统性风险。


    然而，自Fama-French三因子模型之后，学术界提出的其他多因子模型似乎与回答上述问题渐行渐远。一个多因子模型的提出，似乎并不再以回答这两个问题为己任，而是为了比拼哪一种模型能解释更多的异象。如今提出的新
    的多因子模型毫无疑问能比25年前提出的Fama-French三因子模型解释更多的异象，但这是否一定意味着新的模型就是更好的模型呢？它是否回答了上述两个问题？是否加深了人们对股票市场的理解？只有肯定的回答了这些问题——而非通过解释异象个数的多少——才能说明新模型的优势。本书作者把这种通过比较异象的解释能力来评判多因子模型高下的做法称为“多因子模型大战”，简称“因子大战”。需要特别强调的是，解释异象的能力毫无疑问是多因子模型的重要目标，但这不应成为研究和比较多因子模型的唯一目标。


    谈到多因子模型比较的最新研究成果，Hou et al.（2019b）这篇题为Which factors?的文章不得不提。它系统比较了几大主流多因子模型在解释异象能力上的差异。除此之外，该文还从因子背后的逻辑上比较了Hou-Xue-Zhang四因子模型和Fama-French五因子模型中的投资因子，并对后者进行了“抨击”。为了使读者了解学术界近年来因子大战的“硝烟”，首先在6.2.1节说明上述两因子模型中的投资模型有何差异。之后的6.2.2节介绍Hou
    et al.（2020）提出的一个最新的五因子模型，为介绍因子大战进行铺垫。最后在6.2.3节阐述愈演愈烈的多因子模型之争。


    # 6.2.1 形同意不同的投资因子


    通过4.1.4节和4.1.5节两节的介绍可知，Fama-French五因子模型和Hou-Xue-Zhang四因子模型中均包含投资因子，且这两个因子的计算方法非常近似，都是以过去一年总资产的变化率为变量，使用排序法构建投资因子。虽然变量一致，但'
