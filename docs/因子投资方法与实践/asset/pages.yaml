- pgno: 122
  md: '# 3.4.2 价值因子成因


    关于价值因子的成因，也可以分为系统性风险补偿和投资者行为偏差两类。前者中最为人熟知的一类解释大概是财务困境风险假说。Griffin and Lemmon（2002）发现在财务困境风险较高的企业中，高、低BM股票组合的收益差异是在其他股票中的两倍，表明价值因子可能与财务困境风险有关，即高BM很可能反映着更高的财务困境风险。Peterkort
    and Nielsen（2005）也确认了BM应该代表着某种系统性财务风险，发现在没有负债的企业中BM对股票未来收益没有显著影响；而在净资产为负的企业中，BM对股票收益的影响反而是负的。Zhang（2005）则认为企业在不景气时期难以削减在位资产（assets
    in place），使得在位资产的风险大于增长期权（growth option），因而高BM企业需要更高的回报。而Hahn and Lee（2006）则认为BM反映了与商业周期有关的风险：高BM企业对期限利差（term
    spread）有着更大的暴露，因此获得更高的预期收益。此外，Lewellen（1999）通过假设Fama–French三因子模型中的因子暴露为BM的线性函数，将BM的预测能力分解为与风险相关和与风险无关的两个部分，并指出风险是其解释力的重要来源之一。Obreja（2013）的新近研究将价值因子溢价归因于企业的经营杠杆。除上述发现外，Cochrane（2017）总结了一些从宏观经济角度研究价值因子的文献。


    在使用行为金融学解释价值因子方面，Lakonishok et al.（1994）无疑是最重要的研究之一。这篇经典研究认为投资者倾向于将过去的表现简单外推来评估企业前景，从而会对过去盈利不佳的企业过度悲观，这便导致了价值效应。Ali
    et al.（2003）发现BM在面临更大套利限制（例如特异性波动率和交易费用更高，投资者群体更不专业）的股票中表现更为显著。Daniel and Titman（2006）发现，由于相对于无形信息（intangible
    information），投资者只给予了有形信息（tangible information）过少的关注，因而股票未来收益同其无形收益（intangible
    return）高度负相关，而BM刚好能较好地预测无形收益，从而对股票未来收益有显著的预测能力。Jiang（2010）则进一步指出，机构投资者倾向于买入有正面无形信息的股票，使得无形收益的均值回复在有更多机构投资者的股票中更加显著，因而BM也在这类股票中表现更好。Chan
    et al.（2001）和Daniel et al.（2001）也利用与Daniel and Titman（2006）类似的研究方法发现研发费用对BM的表现有显著影响。


    虽然价值因子历史悠久，且诸多证据支持价值因子溢价在长期内非常显著，但价值因子近年来还是遭遇不少挑战。例如，在Fama and French（2015）提出五因子模型时，两位作者承认盈利和投资两因子的加入使得价值因子变得冗余。此外，价值因子自2008年以来的后金融危机时代表现并不好，与同期不断创下历史新高的股指相比更是相形见绌，因而饱受质疑。由于价值因子在最近十年的惨淡表现，有很多学者试图从金融学和会计学原理出发，通过改造BM来提升价值因子的表现，并取得了一些不错的成果。Liu
    et al.（2019）对这些改进后的BM变量进行了综述，并在A股上进行了实证研究。


    # 3.4.3 价值因子实证


    尽管越来越多的新近研究质疑以BM构建的价值因子在近年来的效果，并提出了其他的替代物（例如Liu et al.2019主张使用EP代替BM，并通过前者在A股市场'
