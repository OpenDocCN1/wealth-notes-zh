    # 2.2.2 截面回归


    时间序列回归虽然很方便，但它以因子收益率时序已知为前提。这意味着它更适合处理股票的风格因子，而对诸如 GDP、CPI 以及利率这样的宏观经济因子无能为力。这时可以选择截面回归（cross-sectional
    regression）来检验多因子模型，它能够方便地处理因子收益率时序未知的情况。截面回归检验的最终目的自然还是考察 E[R_i^e] 和 β_i 在截面上的关系，但此方法的第一步仍然是利用时序回归确定资产的因子暴露。


