  md: '# 附录A 理解资产价格


    2013年，诺贝尔经济学奖被授予Eugene Fama、Lars Peter Hansen及Robert Shiller三位教授，以表彰他们在实证资产定价领域的卓越贡献。暂且抛开Lars
    Peter Hansen在关于定价模型检验的计量经济学方法论方面的突出贡献不说，诺贝尔奖被同时授予Fama和Shiller实在是意料之外，但却又在情理之中。令人感到意外的是，Fama和Shiller分别为有效市场假说之父和行为金融学的先驱，他们就市场是否有效持完全对立的态度。而又在情理之中的是，他们及Hansen的研究成果奠定了人们理解资产价格的基础——价格波动受到理性和人的行为的共同影响。在笔者看来，诺贝尔奖委员会的这个决定是科学的胜利，是人类在探究市场真相道路上坚实的一步。


    为了普及三位教授的研究成果，诺贝尔奖学术委员会特地编撰了一篇题为理解资产价格（Understanding asset prices）的科普性文章（Economic
    Sciences Prize Committee of the Royal Swedish Academy of Sciences 2013）。该文以他们三个人的研究成果为主线，系统而全面地梳理了学术界在过去50年里在理解资产价格和收益率方面发现的重要成果。由于多因子模型是资产定价的一个组成部分，因此强烈推荐对因子投资感兴趣的读者仔细阅读这篇综述。本书的最后简要梳理该文的重点，供各位参考。


    # 1 无套利定价公式 $P=E[mx]$


    这一切始于 $P=E[mx]$。


    假设在$t$时刻，资产$i$的价格是$P_{it}$；在$t+1$时刻，资产处于某种资产状态$s$，其发生的概率为$\pi_{t+1}(s)$，且在该状态下，资产的支付额和对应的折现因子分别为$x_{it+1}(s)$和$m_{t+1}(s)$。由无套利约束（absence
    of arbitrage opportunities）可知，$P_{it}$满足以下关系（无套利意味着左右两端必须相等）：


    $P_{it}=\sum_{s} \pi_{t+1}(s) m_{t+1}(s) x_{it+1}(s)$

    (A1)


    利用数学中的期望符号$E(.)$，可以把上式写成更加“喜闻乐见”的形式：'
