    由于A股市场中显著的规模效应，CHN-SMB在两个区间内均显著并不令人意外。而为了搞清楚为什么CHN-VMG也能一直显著，则需要回到EP=BM×ROE这个式子。这个关系说明EP和BM以及ROE高度相关。从它可以推断出，通过EP构建的价值因子CHN-VMG和通过BM和ROE（TTM）构建的价值LSL-HML以及盈利LSL-RMW因子有很高的相关性。从表4.4的Panel
    C给出的相关系数中，已经能够证实上述结论。为了进一步分析，图4.8给出了通过60个月滚动窗口OLS回归估计的CHN-VMG因子在LSL-HML和LSL-RMW上的暴露。从中不难看出，CHN-VMG在这两个因子上均有非常稳定且较大的暴露。回顾表4.11的结果，在实证期的前十年，LSL-HML的月均收益率很高；而在实证期的后十年，LSL-RMW则变得显著。得益于这两个因子在不同时期的表现以及CHN-VMG在这两个因子上持续的高暴露，CHN-VMG在整个二十年的实证期内的月均收益率是显著的，因为它始终反映出以BM代表的价值和以ROE代表的盈利两方面的风险溢价。毫无疑问，不同因子之间的相互关联，以及因子在不同时期的表现会影响GRS检验中F-统计量的取值，并最终产生了表4.10所示的结果。


    表4.12给出了剔除市值最低的30%股票之后的GRS检验结果。在整个实证期内，两个模型可以相互解释，难分高下。但有意思的是，无论是单独考虑前一个十年还是后一个十年，根据GRS结果判断，四因子模型都是更好的模型。对于上述结果，可以使用类似的方法进行分析。出于对篇幅的考虑，书中不再进行更多的解读。


