  md: 'contribution to risk, MCR），它由如下的偏导数定义：


    ```

    MCR_m = ∂σ(R)/∂x_m  (7.97)

    ```


    在这种解释下，投资组合对收益源m的风险暴露每增加Δx_m，投资组合的风险 σ（R）便增加MCR_mΔx_m。比较第一种方法，这种方法的优点是投资组合的风险等于所有收益源的边际风险贡献之和：


    ```

    σ(R) = Σ_{m=1}^{M} x_m MCR_m  (7.98)

    ```


    式（7.98）意味着投资组合的风险可以完全被边际风险所解释，这是此种方法最大的优点。然而，它的缺点是人们很难从业务层面理解偏导数——每个收益源到底对投资组合的风险有多少贡献？风险和偏导数又有什么关系？诸如此类的问题很难直观地回答。


    # 7.7.2 风险的三要素


    由于上述两种传统方法在解释投资组合的风险σ（R）时都不理想，Mencheo and Davis（2011）提出了投资组合的风险归因三要素公式。该公式可由如下推导得出：


    ```

    σ(R)σ(R) = cov(R,R)

    = Σ_{m=1}^{M} cov(x_m r_m, R)

    = Σ_{m=1}^{M} x_m cov(r_m, R)

    = Σ_{m=1}^{M} x_m σ(R) σ(r_m) ρ(r_m, R)  (7.99)

    ```


    将式（7.99）两边同时除以σ（R）就得到风险归因三要素公式：


    ```

    σ(R) = Σ_{m=1}^{M} x_m σ(r_m) ρ(r_m, R)  (7.100)

    ```


    由式（7.100）可知，投资组合的风险和暴露、波动性及相关性三要素有关：


    +   • 暴露x_m：它衡量投资组合对每个收益源的暴露大小。这完全由基金经理来决定，充分地反映了基金经理的投资偏好。值得说明的是，投资组合对于收益源的暴露值没有任何符号上的限制，即它既可以为正也可以为负。优秀的基金经理会通过对特定收益源采取负的暴露来对冲投资组合在其他收益源上的风险，从而降低投资组合整体的风险。'
  merge: -1
  img_proc: true
- pgno: 365
  md: '• 波动性 σ（r_m）：它代表的是收益源 m 的收益率 r_m 的波动。由于投资组合暴露在不同的收益源之中，那么某个收益源的收益率的波动越大，它对投资组合风险的贡献程度（可以是正向也可以是负向，取决于暴露的符号）也越大。


    • 相关性 ρ（r_m，R）：它是收益源 m 和投资组合收益率之间的相关系数。二者的相关性越高，投资组合收益率受收益源 m 波动影响的确定性就越大。


    由上述说明可知，风险归因三要素式（7.100）的含义是：如果投资组合在该收益源上的暴露越大，收益源的收益率自身的波动越大；收益源的收益率和投资组合收益率的相关性越高，则该收益源对投资组合的风险的贡献就越大。此外，投资组合的风险
    σ（R）可以完全被所有收益源的风险 σ（r_m）按式（7.100）分解。


    在解释投资组合的风险时，三要素公式较前述两种传统方法有明显的优势。第一种方法将收益源与投资组合隔绝开来，不考虑收益源与投资组合的相关性，也不考虑收益源之间的相关性，无法正确地解释收益源对
    σ（R）的贡献。另外，对比第二种方法中 σ（R）的计算式（7.98）及三要素式（7.100）易知 MCR_m = σ（r_m）ρ（r_m, R）。这可以由如下推导验证：


    ```

    var(R) = Σ_{m=1}^{M} x_m cov(r_m, R) = Σ_{m=1}^{M} x_m cov( r_m, Σ_{n=1}^{M} x_n
    r_n ) = Σ_{n=1}^{M} Σ_{m=1}^{M} x_n x_m cov(r_m, r_n)      (7.101)

    ```


    式（7.101）两边同时对 x_m 求偏导数，并利用链式法则及协方差公式的定义有：


    ```

    2σ(R) ∂σ(R)/∂x_m = 2 Σ_{n=1}^{M} x_n cov(r_m, r_n)

    ⇒ σ(R) ∂σ(R)/∂x_m = cov( r_m, Σ_{n=1}^{M} x_n r_n )

    ⇒ σ(R) MCR_m = cov(r_m, R)

    ⇒ σ(R) MCR_m = σ(R) σ(r_m) ρ(r_m, R)

    ⇒ MCR_m = σ(r_m) ρ(r_m, R)    (7.102)

    ```


    可见，收益源 m 的边际风险贡献 MCR_m 等于其自身的波动 σ（r_m）乘以它和投资组合收益率的相关系数 ρ（r_m，R）。比起偏导数的解释，σ（r_m）与
    ρ（r_m，R）乘积的解释要更加清晰。此外，这种对 MCR_m 的分解可以为基金经理提供更好的判断方法。


    举个例子，假设两个收益源的边际风险贡献都是 1%（且投资组合对这两个收益源的暴露相同），基于 MCR 的解释方法无法区分它们。进一步假设第一个收益源 1 自身的波动为
    10%，它与投资组合的相关系数为 0.1（10%×0.1=1%）；第二个收益源 2 自身的波动为 2%，它与投资组合的相关系数为 0.5（2%×0.5=1%）。
    MCR_m = σ（r_m）ρ（r_m, R）说明，虽然 MCR_m 相同，但是收益源 1 自身有更大的波动。这虽然并不意味着收益源 1 更加危险（因为这两个收益源的边际风险贡献相同），但是也不要忘记，所有的这些参数都是根据历史数据估计得到的。由于收益率自身的波动比收益率之间的协方差更容易估计，因此收益源
    1 对投资组合的风险的影响很可能比收益源 2 更大。此外，如果基金经理想要排除投资组合对这两个收益源中某一个的暴露，仅仅依靠 MCR_m 是不够的，σ（r_m）与
    ρ（r_m，R）为他提供了更多的依据。'
