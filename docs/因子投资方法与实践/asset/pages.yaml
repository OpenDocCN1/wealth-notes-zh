- pgno: 135
  md: '发现，双重排序时动量因子的月均收益率为正（虽然非常不显著），但其累计收益率却小于零。造成这种差异的原因是，双重排序中的月均收益率是算术平均，累计收益曲线图中反映的是收益率的几何平均，而收益率的波动使得几何平均总是小于算术平均。由于动量因子收益率的算术平均非常接近零，收益率波动造成其几何平均小于零，因此动量因子在实证期内的累计收益小于零。


