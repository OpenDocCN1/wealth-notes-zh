    # 7.5.5 按宏观因素择时


    宏观因素是指影响企业生产经营的经济、政治、社会和自然环境等因素。经济因素，包括经济周期、利率水平、货币供给和流动水平等；政治因素，比较典型就是选举周期；社会因素，比如2020年新型冠状病毒的冲击；自然环境包括全球气候和自然灾害等。宏观因素数量巨多，传导关系错综复杂，和因子表现之间的关系也充满了神秘色彩。哪些宏观经济变量和股票因子表现有关呢？为此，Bender
    et al.（2018）考虑将一系列经济变量作为预测因子，详见表7.24。


