  md: '# 2.3 因子暴露和因子收益率


    自从Fama and French（1993）提出第一个多因子模型以来，使用排序法构建因子投资组合、计算因子收益率，并通过时序回归确定资产在因子上的暴露便成为学术界的研究范式，本书第4章介绍的七个主流多因子模型均采用此方法。然而，由2.2.3节的介绍可知，通过截面回归可获得因子的纯因子组合，从而得到和排序法不同的因子的收益率。相较于使用排序法构建的因子投资组合，由于纯因子组合在其他因子上没有暴露，因此从理论上能够更准确地体现因子收益率。


    在此基础上，近年来出现的新研究趋势是使用时变因子暴露的Fama–MacBeth截面回归计算因子收益率，并以此代替排序法的收益率。在诸多研究成果中，最具代表性的两篇文章要数Jegadeesh
    et al.（2019）和Fama and French（2020）。这两篇文章都是研究因子收益率的，但侧重点却有所不同。前者关注的是如何更准确地估计因子暴露，进而计算因子收益率；而后者则考察了排序法和回归法之中，哪种方法计算的因子收益率能够更好地解释股票预期收益率的截面差异。这些发现将人们对于因子暴露和因子收益率的理解带上了更高的台阶，也为未来实证资产定价和因子投资指明了方向。本节接下来的内容将综合梳理这些新方法和新发现。


    下面回顾一下Fama–MacBeth截面回归，它是一个两步回归方法：


    +   • 第一步时序回归：估计时刻t资产i在所有因子上的暴露β̂i。（为了简化符号表达，β̂i中没有引入代表时间的下标。在本节的讨论中均假设β̂i代表时变因子暴露。）


    +   • 第二步截面回归：使用β̂i作为解释变量，资产的超额收益率R^e_{it}作为被解释变量，用OLS对截面回归模型（2.46）进行估计，得到t期每个因子的收益率λ̂_{kt}；在得到整个因子收益率时序后，对因子预期收益率进行检验。


    显然，如果没有β̂i就无法进行截面回归，因此上述过程的第一步是为了第二步服务。一旦有了β̂i，第二步的截面回归就是“例行操作”。由此可知，Fama–MacBeth回归中值得深入讨论的是如何确定因子暴露。由2.2.4的介绍可知，时序回归仅仅得到βi的估计，它属于生成的回归变量，而非真实（但未知）的βi。因此，这种做法存在误差。将β̂i作为第二步截面回归中的解释变量就引入了计量经济学中的变量误差（errors-in-variables，EIV）问题。


    Fama and MacBeth（1973）自然意识到了这个问题。为此，他们给出的解决办法是使用个股组成的投资组合代替个股作为资产。以检验CAPM为例，该文将个股按照其历史βi的大小构成了不同的投资组合，然后将这些投资组合作为资产。该'
