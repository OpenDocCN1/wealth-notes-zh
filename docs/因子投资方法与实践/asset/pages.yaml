    最后，图3.30和图3.31展示了等权重和市值加权下，换手率因子的多、空两头各自的累计收益率曲线（Panel A），以及因子投资组合（即多、空对冲组合，Panel
    B）的累计收益率曲线。无论等权重还是市值加权，以上两图各自Panel B中换手率因子的累计收益率曲线都非常平顺，看上去非常吸引人（从超过6.0的t值也可以感受到这一点）。然而，需要“泼一盆冷水”的是，这仍然仅是从实证资产定价出发得到的纸面上的收益率，并没有考虑任何交易费用的影响。考察多空两端的表现，多头组合的月均收益率虽然较本章考查的其他因子的多头收益率更高，但对因子组合的收益率来说，起到更关键作用的还要数空头组合。较其他因子来说，异常换手率因子的空头端（高换手率组）的收益率明显更低，从而更好地平抑了多头端的波动，对于因子收益率的贡献更大。然而在实际交易中，由于做空限制将会使空头端的贡献大打折扣，因此实际中注定无法取得纸面上收益率这种完美的效果。在多头方面，低异常换手率组合则能够显著的跑赢市场组合。在等权重和市值加权时，多头组合的年化夏普比率分别为0.65和0.64，而市场组合年化夏普比率仅为0.40。因此，虽然空头组合难以在实际中发挥作用，但仍然可以利用多头组合跑赢市场的特点，在实际投资中将投资组合有计划地暴露于低异常换手率因子上。'
