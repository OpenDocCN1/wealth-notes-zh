    总结一下本节。以上用了大量的文字和推导把 var( b̂0 ) 和 var(g_T( b̂0 )) 背后的数学含义呈现给读者，是希望这个过程能帮助各位加深对GMM的理解。站在数学符号的角度来说，虽然这些公式看起来很复杂（又是转置、又是求逆），但当使用GMM时，只需提供它需要的矩阵a、样本矩条件g_T及矩阵d和S，剩下的“无脑”交给GMM就可以计算出各种想要的统计量并进行检验，非常方便。如今，各种编程语言的统计包更是能够方面地实施GMM。


    # 2.7.4 有效性


    2.7.2节曾给出了GMM估计量如下：


    b̂0：令 a g_T( b̂0 ) = 0


    其中a是p×n矩阵，每一行都代表样本矩的某个线性组合。本节关心的问题是，如何选取矩阵a？回答这个问题应从业务和统计两方面思考。从金融学原理出发，尤其是针对资产定价问题，可以选择一些业务含义最重的矩，让它们或它们的线性组合等于零。另外，单从统计上说，Hansen（1982）给出了一个特殊的a，它能确保得到的GMM估计量是有效的（efficient
    GMM estimator），即在给定的样本矩g_T下，该特殊的a使得 var( b̂0 ) 最小。这个特殊的a为：


    a = d'' S^{-1}    （2.128）


    这个a到底有没有什么更直观的含义？别急，先来验证一下a的阶数。由d的定义式（2.120）可知，它是一阶偏导数矩阵，且在计算时遵循分子布局。由此可知，d的阶数是n×p，而d的转置d''就是p×n矩阵。事实上，d''同样也是一阶偏导数矩阵，只不过这次转置运算出现在分子上，即
    ∂g''_T(b0)/∂b。它的运算则遵循的是分母布局（denominator layout）或黑塞布局（Hessian formulation），通常表示求梯度（gradient）。此外，由S的定义式（2.118）可知它是n阶矩阵。因此由a
    = d'' S^{-1} 可知a的阶数确实是p×n。


    下面就来看一看a = d'' S^{-1} 的含义。为了解释它，就不得不提GMM估计量的另一个表达式：


    b̂0 = arg min g_T(b)'' W g_T(b)    (2.129)


    式中W是半正定权重矩阵（weighting matrix）。式（2.129）的含义是，在过度识别问题中，既然无法让所有的样本矩g_T都等于零，那么就让这n个g_T的范数的加权之和尽可能地接近零，以此来确定
    b̂0。正如可以在式（2.113）中随意选择矩阵a一样，在式（2.129）中可以随意选择权重矩阵W。然而，从估计量的有效性来说，最优的权重矩阵满足W = S^{-1}。这从统计上非常好理解：对于一组矩g_T，人们希望它们（非负）加权之和最接近零。使用W
    = S^{-1}即S的逆矩阵（别忘了S/T是 var(g_T(b0))）相当于给误差大的矩更低的权重、给误差小的矩更高的权重。'
