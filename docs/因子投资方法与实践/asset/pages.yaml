  md: 'W = \begin{bmatrix} \frac{\sqrt{s_1}}{\sum_{i=1}^N \sqrt{s_i}} & 0 & \cdots
    & 0 \\ 0 & \frac{\sqrt{s_2}}{\sum_{i=1}^N \sqrt{s_i}} & \cdots & 0 \\ \vdots &
    \vdots & \ddots & \vdots \\ 0 & 0 & \cdots & \frac{\sqrt{s_N}}{\sum_{i=1}^N \sqrt{s_i}}
    \end{bmatrix} (7.25)


    求解模型（7.19）的另外一个难点是约束条件式（7.20）。为此，需要构建代表该约束的约束矩阵C。由于仅有一个约束条件，因此K个因子收益率之间的约束关系可以表达为（Ruud
    2000）：


    \begin{bmatrix} \lambda_C \\ \lambda_{I_1} \\ \vdots \\ \lambda_{I_P} \\ \lambda_{S_1}
    \\ \vdots \\ \lambda_{S_Q} \end{bmatrix} = \begin{bmatrix} 1 & 0 & 0 & \cdots
    & 0 & 0 & \cdots & 0 \\ 0 & 1 & 0 & \cdots & 0 & 0 & \cdots & 0 \\ \vdots & \vdots
    & \vdots & \ddots & \vdots & \vdots & \ddots & \vdots \\ 0 & -\frac{s_{I_1}}{s_{I_P}}
    & -\frac{s_{I_2}}{s_{I_P}} & \cdots & -\frac{s_{I_{P-1}}}{s_{I_P}} & 0 & \cdots
    & 0 \\ 0 & 0 & 0 & \cdots & 0 & 1 & \cdots & 0 \\ \vdots & \vdots & \vdots & \ddots
    & \vdots & \vdots & \ddots & \vdots \\ 0 & 0 & 0 & \cdots & 0 & 0 & \cdots & 1
    \end{bmatrix} \begin{bmatrix} \lambda_C \\ \lambda_{I_1} \\ \vdots \\ \lambda_{I_{P-1}}
    \\ \lambda_{S_1} \\ \vdots \\ \lambda_{S_Q} \end{bmatrix} + \begin{bmatrix} 0
    \\ 0 \\ \vdots \\ 0 \\ 0 \\ \vdots \\ 0 \end{bmatrix} (7.26)


    式（7.26）中等号右边的矩阵就是约束矩阵C，它是K×（K-1）矩阵（这是因为K个因子收益率之间有一个约束条件）。在构造C时，将λ_{I_P}用其他行业收益率的线性组合来表达。


