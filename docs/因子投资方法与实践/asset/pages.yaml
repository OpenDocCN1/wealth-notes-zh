- pgno: 68
  md: '# 2.5.2 均值—方差张成检验


    Huberman and Kandel（1987）提出的均值—方差张成（mean-variance spanning）检验是另一种常见的联合检验手段。从名字就不难看出，这种方法和Markowitz（1952）提出的现代投资组合理论（Modern
    Portfolio Theory）以及均值—方差分析有着紧密的联系。Kan and Zhou（2012）对均值—方差张成检验进行了系统而全面的介绍。


    这种方法的核心无疑是“张成（spanning）”两个字。假如市场中有K个因子投资组合；通过按各种不同的权重配置它们又能得到许多新的组合。对于每个给定的预期收益率μ̂，都能找到这K个资产的唯一一种配置权重，使得该组合是所有预期收益率等于μ̂的组合中方差最低的，这个特殊的投资组合就是预期收益率为μ̂的最小方差组合。把不同μ̂的最小方差组合都绘制在横坐标为标准差、纵坐标为预期收益的二维平面内，就得到了最小方差前沿（minimum-variance
    frontier），它的形状是一个抛物线，如图2.8所示。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_68_0.png)


    图2.8中的最小方差前沿就是由这K个因子张成的（spanned），这就是这种方法得名的原 因。而这种检验所关注的问题是，加入N个新的（来检验该模型的）资产后，这全部N+K个资产张成的新的最小方差前沿能否“优于”仅由K个因子张成的最小方差前沿。这里，“优于”意味着对于每一个给定的μ̂，N+K个资产张成的
    前沿上的点都比K个因子张成的 前沿上的点有更低的方差，这就是均值—方差张成检验的直观解释。


    下面来看看数学上的这种检验的原假设是什么。令 R_t = [R_{1t}, R_{2t}]'' 代表t期N+K个资产的收益率向量，其中R_{1t}和R_{2t}分别为K个因子和N个资产的收益率向量。接下来，定义这N+K个资产的预期收益率和收益率的协方差矩阵：'
