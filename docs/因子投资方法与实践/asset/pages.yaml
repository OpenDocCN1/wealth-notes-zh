- pgno: 306
  md: "式中 $R_{it}^{e}$ 是 $t$ 时刻股票 $i$（相对无风险收益率）的超额收益； $\beta_{it-1}^{I_p}$ 是 $t-1$（即\
    \ $t$ 期期初）股票 $i$ 在行业 $I_p$ 上的因子暴露（假设一个公司在任何时刻只能属于一个行业，那么 $\beta_{it-1}^{I_p}$\
    \ 的取值为 0 或者 1）； $\beta_{it-1}^{S_q}$ 是 $t-1$（$t$ 期期初）股票 $i$ 在风格因子 $S_q$ 上的因子暴露；\
    \ $u_{it}$ 为 $t$ 时刻股票 $i$ 在收益率中的随机扰动，也被称为特质性收益率； $\\lambda_{C t}$ 为 $t$ 时刻国家因子的收益率；\
    \ $\\lambda_{I_p t}$ 为 $t$ 时刻行业因子 $I_p$ 的收益率； $\\lambda_{S_q t}$ 为 $t$ 时刻风格因子\
    \ $S_q$ 的收益率。此外，在上述模型中，所有股票在国家因子上的暴露都是 1。\n\n在模型（7.19）中，$t$ 时刻股票收益率以及 $t-1$ 时刻股票的因子暴露已知，采用加权最小二乘法（weighted\
    \ least squares, WLS）估计 $t$ 时刻的因子收益率。因此，模型（7.19）的本质正是 Fama-MacBeth 截面回归。在求解模型（7.19）时，需要注意的是国家因子的因子暴露和\
    \ $P$ 个行业的因子暴露之间存在共线性。国家因子的因子暴露向量可以表达为 $P$ 个行业因子的因子暴露向量的线性组合，但会造成模型（7.19）的解不唯一。为此，对行业因子的因子收益率作如下限制：\n\
    \n$$s_{I_1} \\lambda_{I_1 t} + s_{I_2} \\lambda_{I_2 t} + \\cdots + s_{I_P} \\\
    lambda_{I_P t} = 0 \\tag{7.20}$$\n\n其中 $s_{I_p}$ 是所有属于行业 $I_p$ 的股票按市值计算出的权重之和。\n\
    \nBarra 多因子模型的另一个特点是风格因子暴露的确定。首先，该模型直接使用公司特征，而非时序回归系数，并以此作为因子暴露的原始值[2]。举例来说。如果使用\
    \ BM 构建价值因子，则股票 $t-1$ 时刻的 BM 指标取值就作为其在该因子上的因子暴露的原始值。接下来，对原始值进行标准化处理，包括去均值和除以标准差两步。对于前者，假设市场组合在任何风格因子上都应该是中性的，即暴露为零。因此，对于任意因子，去均值的处理是使用因子暴露原始值减去因子暴露的市值加权。去均值后，因子暴露满足：\n\
    \n$$\\sum_{i=1}^{N} s_i \\beta_{it-1}^{S_q} = 0, \\quad q=1,\\ldots,Q \\tag{7.21}$$\n\
    \n式中 $s_i$ 代表股票 $i$ 的市值权重。之后，将经过式（7.21）处理的风格因子暴露在截面上除以其标准差，就完成了对风格因子的因子暴露的标准化。\n\
    \n较之 Barra 针对中国市场的早期模型，CNE5 模型最大的差异是加入了国家因子。国家因子投资组合的实质正是按市值加权的市场组合。这一结论可以通过以下推导证明。令\
    \ $R_{M t}^{e}$ 表示 $t$ 时刻市场组合的超额收益。因为 $s_i$ 是股票 $i$ 的市值权重，因此以 $s_i$ 为权重构建的投资组合就是市场组合。将\
    \ $R_{M t}^{e}$ 作为资产代入模型（7.19），并利用式（7.20）及式（7.21）推导可知：\n\n$$\\begin{aligned}\n\
    R_{M t}^{e} &= \\lambda_{C t} + \\sum_{p=1}^{P} \\beta_{M t-1}^{I_p} \\lambda_{I_p\
    \ t} + \\sum_{q=1}^{Q} \\beta_{M t-1}^{S_q} \\lambda_{S_q t} + u_{M t} \\n&= \\\
    lambda_{C t} + \\sum_{p=1}^{P} \\left(\\sum_{i=1}^{N} s_i \\beta_{it-1}^{I_p}\\\
    right) \\lambda_{I_p t} + \\sum_{q=1}^{Q} \\left(\\sum_{i=1}^{N} s_i \\beta_{it-1}^{S_q}\\\
    right) \\lambda_{S_q t} + \\sum_{i=1}^{N} s_i u_{it} \\n&= \\lambda_{C t} + \\\
    sum_{p=1}^{P} s_{I_p} \\lambda_{I_p t} + \\sum_{q=1}^{Q} 0 \\times \\lambda_{S_q\
    \ t} + \\sum_{i=1}^{N} s_i u_{it} \\n&= \\lambda_{C t} + 0 + 0 + \\sum_{i=1}^{N}\
    \ s_i u_{it} \\n&\\approx \\lambda_{C t}\n\\end{aligned}\\tag{7.22}$$"
