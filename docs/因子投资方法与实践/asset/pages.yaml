- pgno: 11
  md: '则，这意味着定价因子个数是有限的。为此，学术界往往从经济学和金融学的原理出发，从大量相关的因子中找到有限个相对独立的因子构成多因子模型，而把其他没有被加入模型中的、能获得模型无法解释的超额收益的因子都视为异象。反观业界，无论是管理人还是投资者，他们往往不严格区分异象因子和定价因子，而把它们统称为因子。业界往往更关心因子能否获取定价模型无法解释的超额收益，因为这代表着构建因子的变量可以区分高收益股票和低收益股票，因此人们可通过买入高收益股票而“战胜市场”。理解了学术界和业界对定价因子和异象因子看法的差异后，接下来就来看看因子投资包含哪些内容。


    # 1.1.4 因子投资包含的内容


    因子投资的内容可以因研究的对象是式（1.3）右侧的βiλ或αi而分成两大类。每一大类下又可以因站在学术界和业界的不同立场再进一步划分。按照重要性的先后顺序，首先来看βiλ这部分。


    # 1. 关注于βiλ的研究


    对于βiλ，学术界关注的是找到“最好”的多因子模型“最好”通常意味着在该模型下资产的αi尽可能接近零，即该模型无法解释的异象越少越好。以此为目标，学术界在过去30年针对股票市场推出了很多经典的多因子模型。在提出每个多因子模型的同时，学术界也格外关注每个因子背后的原因。即便到了今天，因子背后的原因也仍然是研究的热点之一。经过几十年的发展，学术界也发明出很多计量经济学的方法，它们可以计算因子暴露、因子收益率并对多因子模型进行假设检验。除此之外，学术界研究βiλ的另一个重点是对主动基金管理人的业绩进行归因。大量的实证数据研究表明，在选择了适当的。到目前为止，绝大多数主动基金管理人并不能获得超额收益。


    与学术界不同，业界进行因子投资最重要的目标是使用因子来获取超过基准的收益囗。因此业界从资产配置的角度聚焦于找到从长期来看有风险溢价的因子（即λ大），并以尽可能高的暴露（即βi高）配置在这些因子上。仍然以Ang（2014）中食物和营养的类比做解释。人们每天摄入不同的食品，其本质是为了吸收食品背后的营养成分，这些食品只是获得营养的渠道。人们想要保持健康则需要这些营养成分均衡的搭配。回到因子投资中，业界关心如何以资产为媒介配置在不同的因子上，并在分散化的前提下最大化在不同因子上的暴露，从而获得稳健的（超额）收益。除此之外，随着因子投资的发展，很多Smart
    Beta ETF金融产品相继问世，极大地丰富了资产配置的工具。


    # 2. 关注于αi的研究


    再来看αi部分。αi代表了可以通过套利获得的超额收益。出于截然不同的原因，学术界和业界都对它非常感兴趣。先说学术界，从有效市场假说（Efficient-Market
    Hypothesis，出自Fama 1970）的观点出发，如果多因子模型不存在模型设定偏误，那么市场中不应该存在太多异象。因此，一旦一个异象被发现，就会被拿来评判市场并非有效，或用来描述市场均衡状态的因子模型有误，这是学术界研究异象的主要动机。另外，解释异象的能力是评价多因子模型优劣的重要标准之一。比如两个多因子模型A和B，如果使用模型A时异象的个数少于使用模型B时'
  merge: -1
