  md: '并且跟踪不同因子指数的基金产品也越来越多，使得普通投资者也能享用因子投资盛宴。这些因子类基金，还有一个高大上的名字——Smart Beta基金。专业的事情交给专业的人士去做，通过直接买卖或申赎这类基金，投资者就可以免除中间的繁复步骤，也可以避免落入各种陷阱的危害，剩下简单和美好。然而，不用亲自设计和交易因子组合，并不意味着投资者就变成了一个懒人。Smart
    Beta虽然是因子投资的捷径，但俗话说“世界上最快的捷径就是不走捷径”，要做好Smart Beta投资仍然有大量功课要做。本节将和你一起，抽丝剥茧，讲清楚Smart
    Beta的前世今生。


    # 7.4.1 因子指数和Smart Beta


    # 1. 概念定义


    都说互联网行业喜欢造词，其实金融行业也一样。在Smart Beta这个名字中，第一个词Smart是一个形容词，是“聪明的”之意；而第二个词Beta则代表了式（1.3）中的β，表示因子暴露之意。简单来说，这两个词放在一起得到的Smart
    Beta就表示挑选有风险溢价的因子（Smart部分）并通过暴露在其上（Beta部分）来获取超过基准的收益。


    有人说Smart Beta是一次行业革命，也有人说这是在故弄玄虚。类似的称呼还有很多，比如Systematic Beta、Alternative Beta、Style
    Beta和Strategic Beta[3]，有时让人“傻傻分不清楚”。正如一千个读者眼里有一千个哈姆雷特，不同机构对Smart Beta的具体定义也不尽相同。表7.8梳理了一些知名机构对Smart
    Beta的定义，从中提炼出共同点，就能够更好地定义和理解Smart Beta概念。


    # 表7.8 各机构的Smart Beta定义


    | 机构 | 定义 |

    |---|---|

    | 富达基金（Fidelity） | 和传统的市值加权指数相比，Smart Beta 使用一个或多个因子构造指数，试图增加收益、减少风险和成本，以及增加组合多样性。
    |

    | 贝莱德（BlackRock） | Smart Beta 通过明确的规则编制因子暴露指数，以便基金公司低成本地进行复制，从而增强组合收益和降低组合风险。
    |

    | 景顺（Invesco） | 通过一些事先定义的规则和公式编制指数，以在常见的风险因子上有所暴露，主要有两个特点：（1）组合权重偏离市值加权；（2）透明的规则。
    |

    | 先锋（Vanguard） | 偏离市值加权的另类加权方法，以获得不同的风险和收益结果，即为 Smart Beta。 |


    续表'
