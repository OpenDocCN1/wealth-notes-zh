  md: '口，发现BM在整个窗口内都能获得显著的绝对收益以及CAPM-α；然而EP则仅当市值最低的30%股票被剔除之后才能获得显著收益。最后，来自MSCI的报告Rao
    and Gupta（2019）以2000到2019这二十年为研究区间（和本书一样），分析了BM和EP在前后两个十年（即2000到2009以及2010到2019）的表现，发现在前一个十年，BM显著优于EP，而后一个十年则是EP胜出。


    抛开实证结果，从金融学理论上，Liu et al.（2019）指出单纯地使用EP来取代BM，并利用前者构建价值因子并不合理。该文从DDM出发分析了BM及ROE与股票预期收益率之间的相关性。虽然EP=BM×ROE，但二者的作用不应该仅由单一EP来代替；反而是EP在A股市场的表现恰恰得益于EP=BM×ROE这个关系。为此，Liu
    et al.（2019）主张仍然使用BM而非EP构建价值因子，并在Liu et al.（2019）三因子模型的基础上加入了ROE代表的盈利因子，得到市场、价值、规模以及盈利的四因子模型。这个四因子模型就是本节模型比较时考虑的第二个模型[3]。


    # 4.3.2 BM、ROE与预期收益


    在通过实证比较上述两个多因子模型之前，本节首先从公司估值的角度解释一下为什么BM与ROE和股票的预期收益密切相关，这将帮助读者理解为什么在多因子模型中加入利用BM和ROE构建的价值和盈利因子是合理的。在“因子大战”（见6.2节）硝烟弥漫的今天，Fama
    and French（2018）警告说多因子模型背后的每个因子都应该有理论支撑。一旦缺乏理论，那么对多因子模型的研究就会演变成一场纯粹的数据挖掘，而不能帮助人们更好地理解市场。


    关于BM和ROE与预期收益率的关系，Hou et al.（2019b）从DDM出发并利用单期预期收益率进行了精彩的论述。根据定义，某股票的单期收益率满足（为了数学符号的简洁性，以下略去代表股票的下标i）：


    ```

    M_t = \frac{E_t[D_{t+1}] + E_t[M_{t+1}]}{1 + E_t[r_{t+1}]} \quad (4.33)

    ```


    式中 M_t 是该股票在 t 时刻的市值，D_{t+1} 是 t+1 期的分红，r_{t+1} 则表示 t 到 t+1 之间股票的收益率，期望符号的下标 t
    表示根据 t 时刻的已有信息计算条件期望。此外，由净盈余关系（clean surplus relation）可知分红是利润和账面价值变动之差，即：


    ```

    D_{t+1} = Y_{t+1} - dB_{t+1} \quad (4.34)

    ```


    其中 Y_{t+1} 是 t+1 期的利润，dB_{t+1} 是 t 到 t+1 期的账面价值变动。将（4.34）中 D_{t+1} 的表达式代入（4.33）可得：


    ```

    M_t = \frac{E_t[Y_{t+1} - dB_{t+1}] + E_t[M_{t+1}]}{1 + E_t[r_{t+1}]} \quad (4.35)

    ```


    将（4.35）两侧同时除以 t 时刻的账面价值 B_t 有：'
