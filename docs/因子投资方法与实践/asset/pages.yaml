- pgno: 324
  md: '布和基准中行业分布的相同，从而实现行业中性化。该约束条件的表达式为：


    ```

    $$H_\omega = h \quad (7.71)$$

    ```


    其中$H$为$P\times N$矩阵（$P$为行业数量，$N$为股票数量）。$H$中每一个元素都是一个哑变量，如果股票$i$属于行业$p$，则该矩阵中的第$p$行第$i$列个元素的取值为1，否则为0。另外，该约束中$h$为$P$维向量，表示基准指数中各个行业的权重。


    # 4. 换手率约束


    由7.1.3节的介绍可知，信息衰减是收益率预测变量必须面对的问题，而应对它的办法之一就是提高投资组合再平衡的频率。然而，这么做往往以更高的换手率为代价，意味着更高的交易成本。为此，换手率约束也是投资组合优化中必不可少的一环，尤其是对于资金量规模大的策略来说更为重要，正所谓船大难掉头。对于单个股票，换手率约束可以表达为：


    ```

    $$|\omega_i - \omega_i^0| \leqslant \phi_i \quad (7.72)$$

    ```


    式中$\omega_i^0$为进行投资组合优化再平衡之前股票$i$的权重，$\phi_i$为股票$i$权重变化的上限。如果要对整个投资组合换手率进行约束，则约束条件为：


    ```

    $$\sum_{i=1}^{N} |\omega_i - \omega_i^0| \leqslant \Phi \quad (7.73)$$

    ```


    式中$\Phi$为整个投资组合中所有股票权重变化的上限。


    # 5. 持仓数量约束


    一个股票组合具体持有多少支股票，取决于股票池、资金大小和风控要求。如果股票数量太少，则不够分散，资金容量也有怃；如果数量太多，会损失一定的灵活性，因子暴露程度也会减弱。为了权衡利弊，在构造投资组合时，可对持仓数量进行一些约束，使其保持在某个范围内。令哑变量$\delta_i$表示投资组合中是否包括股票$i$，即：


    ```

    $$\delta_i = \begin{cases} 1 & \text{若 } \omega_i > 0 \\ 0 & \text{若 } \omega_i
    = 0 \end{cases} \quad (7.74)$$

    ```


    接下来，利用$\delta$构建持仓数量约束：


    ```

    $$N^L \leqslant \sum_{i=1}^{N} \delta_i \leqslant N^U \quad (7.75)$$

    ```


    其中$N^L$和$N^U$分别为持仓数量的上下限。


    # 6. 因子暴露约束'
  merge: -1
  img_proc: true
- pgno: 325
  md: '在因子投资中，不同因子的风险收益特征千差万别。有的因子长期溢价不高，波动却比较大，它们在截面维度下解释股票预期收益截面差异时用处不大，但却能在时序维度解释股票收益率的波动。这类因子常常被视为风险因子，比如Barra多因子模型中的国家和行业因子。因此，在设计投资组合时，为了减少投资组合收益率的波动，经常控制它在风险因子上的暴露。这一目标可通过因子暴露约束实现：


    ```

    βₖᴸ ≤ ∑ᵢ₌₁ᴺ βᵢₖωᵢ ≤ βₖᵁ  (7.76)

    ```


    式中βᵢₖ为股票i在因子k上的暴露，因此∑ᵢ₌₁ᴺ ωᵢβᵢₖ为投资组合在因子k上的暴露。该约束的含义是，投资组合在因子k上的暴露被限制在下限βₖᴸ和上限βₖᵁ之间。


    在式（7.76）中，还可以将股票权重换成主动权重，即相对于基准的权重。令ωᵢᴮ表示股票i在基准组合中的权重，则主动权重为ωᵢ−ωᵢᴮ。此时，因子暴露约束条件变为：


    ```

    βₖᴸ ≤ ∑ᵢ₌₁ᴺ (ωᵢ−ωᵢᴮ)βᵢₖ ≤ βₖᵁ  (7.77)

    ```


    它的含义为投资组合在因子k上的主动暴露需要被约束在某个范围内。在这种情况下，若令βₖᴸ=βₖᵁ=0则表示要求投资组合在因子k上的暴露和基准指数相同。这种组合又被称作关于因子k的风格中性组合。风格中性组合在业界的应用非常广泛。


    # 7. 跟踪误差约束


    对于指数增强策略而言，评价业绩的一个重要指标就是跟踪误差（tracking error）。跟踪误差指的是策略相对于基准的主动收益的波动率。跟踪误差越大，说明策略收益率与基准收益率之间的差异越不稳定。为了减少跟踪误差，可在投资组合优化中加入跟踪误差约束。令ω和ωᴮ分别代表股票在投资组合和基准组合中的权重向量，Σ代表股票的协方差矩阵，则跟踪误差约束为：


    ```

    (ω−ωᴮ)′ Σ (ω−ωᴮ) ¹/² ≤ σ_TE  (7.78)

    ```


    式中σ_TE表示能够容忍的最大跟踪误差水平。


    以上介绍了七种常见的约束条件。在实际投资组合优化中，应根据实际的配置目标和需求选择合适的约束条件，再配合选定的目标函数以求解最优的股票权重。需要说明的是，当考虑了上述各种线性或非线性的约束条件之后，投资组合优化问题往往不再有解析解，因而需要采用数值方法求解。当投资组合的股票数量较少时，通过数值解法找到全局最优解往往也极具挑战性，且约束条件的参数如果选择不当甚至会出现无解的情况，这时可考虑按照约束条件的优先级来适当调整。


    # 7.3.5 交易成本模型'
