    | 动量 | t−12 到 t−1 总收益率 | 0.33 (1.30) | 0.61 | 0.20 |

    | 盈利 | ROE(TTM) | 2.36 (4.75) | 0.12 | 0.28 |

    | 投资 | 总资产增长率 | 0.10 (0.72) | 0.33 | 0.03 |

    | 异常换手率 | 异常换手率 | -1.13 (-7.75) | 0.61 | -0.69 |


    括号内为经Newey-West调整后t值。


    首先来看t-值。无论是按照传统的2.0（或-2.0），还是按照如今更被学术界接纳的3.0（或-3.0）为阈值[2]，规模、价值、盈利以及换手率因子的月均收益率都非常显著，因此它们是被定价的因子。需要说明的是，规模和换手率因子的t-值分别为-3.68和-7.75，说明因子暴露越高的股票收益率越低，因而和小市值效应以及低换手率效应一致。另一方面，市场、动量以及投资因子的月均收益率均不显著。其中，市场因子的月均收益率为负，这与Black
    CAPM模型相符合；动量因子的月均收益率虽不显著，但仍然大于零；最后投资因子的月均收益率为正（虽然t-值仅有0.72，非常不显著），说明总资产增长率高的公司比总资产增长率低的公司的收益率更高，这与从经济学理论导出的投资和收益率之间的负相关不符。


    接下来看看因子的月均收益率。由于在回归中没有对因子暴露进行标准化，因而收益率的绝对大小会受到因子暴露（即公司指标）标准差的影响，造成不同因子的收益率并不直接可比。为此，可以使用Bali
    et al.（2016）介绍的影响系数（impact coefficient）的概念。影响系数的定义为因子的收益率与因子暴露标准差的乘积，它的意思为当其他条件不变，而资产在目标因子上的暴露增加一个标准差时，其预期收益率的变化大小。以规模因子为例，其月均收益率为-0.52%、因子暴露标准差为1.02，因此影响系数为-0.53%。表4.3的第四列汇报了不同因子的影响系数。在被定价的四个因子中，换手率和规模因子的影响系数（绝对值）最高、价值因子紧随其后。盈利因子的影响系数虽然只有0.28%，但由于它的标准误很低，因此十分显著（t-值高达4.75）。


    本节和第3章的实证结果说明，规模、价值、盈利以及换手率在A股市场中被定价。在实际因子投资中，可以考虑从这四个维度构建因子，对A股市场进行异象研究。


    [1]本书7.1节将对因子暴露在实践中的处理做进一步介绍。


    [2]关于t-值阈值的讨论，详见6.1.5节。'
