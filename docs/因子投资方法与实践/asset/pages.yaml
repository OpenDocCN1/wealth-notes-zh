- pgno: 213
  md: '# 5.3 特质性波动率


    由多因子定价模型可知，股票的风险可以分解为因子代表的系统性风险以及特质性风险两部分。后者通常通过股票收益率的特质性波动率（idiosyncratic volatility）来度量。由于特质性波动率可以通过分散化投资而被抵消，因此金融理论暗示着投资者不应该因为承担了特异性风险而得到补偿。换句话说，股票的特质性波动率应无法预测股票的预期收益率。


    2006年，一篇发表于金融领域顶级期刊Journal of Finance的文章Ang et al.（2006）打破了这种观点。该文的题目是The cross-section
    of volatility and expected returns，它指出特质性波动率高的股票在未来预期收益率更低，即二者之间存在负相关关系。此外，该文作者于三年后又在顶级期刊Journal
    of Financial Economics上发文（Ang et al.2009），通过来自美国和全球的更多实证结果说明特质性波动率和预期收益率之间的负相关性。Ang
    et al.（2006）一经发表便得到了学术界的高度关注。截至今日，其谷歌学术引用量已超过3000次，足见其影响力。


    然而在该文发表之后，其他一些研究却有不同的结论。其中Fu（2009）可算是一篇代表性的文章。该文同样发表于Journal of Financial Economics，题为Idiosyncratic
    risk and the cross-section of expected stock returns（谷歌学术引用量超过1000次）。如果仅看论文标题，Ang
    et al.（2006）和Fu（2009）都让人分不清，但后者却提出特质性波动率和收益率之间存在正相关。该文认为Ang et al.（2006）发现的负相关源于很少一部分高特质性波动率股票收益率的反转。此外，Anderson
    et al.（2015）则认为在Ang et al.（2006）的实证分析中，1987年十月是一个极端异常点，它的存在使得异象收益率的标准误被严重低估（缩水了一半），导致t-值被放大。排除该点后，特质性波动率和预期收益率之间的负相关性不再显著。


    除了上述旗帜鲜明的“正、反”两派外，还有一些论文的研究结论是特质性波动率和未来预期收益率之间受到多种因素影响，因此难有定论（Bali and Cakici
    2008）。以下总结了学术界关于特质性波动率和未来预期收益之间的三种观点。


    +   • 无显著关系：Fama and MacBeth（1973）、Bali and Cakici（2008）、Li et al.（2014）、Novy-Marx（2014）；

    • 正相关：Tinic and West（1986）、Lehmann（1990b）、Xu and Malkiel（2004）、Fu（2009）；

    • 负相关：Ang et al.（2006）、Ang et al.（2009）、Jiang et al.（2009）、Guo and Savickas（2010）、Chen
    et al.（2012）。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '综合学术界到目前为止的主流观点来看，大多数实证结果均发现特质性波动率和预期收益率的负相关关系。这无疑和定价理论所隐含的无关联相悖。学术界把这种负相关关系称作特质性波动率之谜（idiosyncratic
    volatility puzzle）。既然有了谜团，就自然少不了解谜的人。这背后的代表作要数Stambaugh et al.（2015）一文。该文从套利不对称性（arbitrage
    asymmetry）的角度对特质性波动率之谜进行了精彩的解释。


    # 5.3.1 套利不对称性和特质性波动率


    高特质性波动率常常被视作阻止套利的因素之一。基于这一出发点，Stambaugh et al.（2015）从套利风险和套利不对称性两个角度对特质性波动率之谜进行了研究。


    +   • 套利风险：套利活动常常因为各种原因被阻止；


    +   • 套利不对称性：投资者愿意积极买入被低估的股票，却对于卖空被高估的股票犹豫不决。


    关于套利风险的来源，最常见的便是噪声交易者的行为。套利交易者在价格被高估时会卖空股票，但此时噪声交易者可能继续买入，进一步推高价格，甚至最终迫使套利交易者因追加保证金的压力等原因而止损。另外，套利的不对称性也与投资者的交易行为有关。投资者往往不愿意卖出、卖空被高估的股票，或卖空的成本过高。这使得套利活动在被高估的股票中更难以进行。图5.13展示了Stambaugh
    et al.（2015）提出的关于特质性波动率、套利风险以及错误定价三者间的关系的猜想，为特质性波动率之谜提供了解释。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_214_0.png)


    图5.13 套利不对称性和特质性波动率之谜


    图5.13中，符号∧表示影响的强弱。通常来说，投资者对于被低估的股票套利更充分，因此消除了更多在被低估股票上出现的错误定价。然而对于被高估的股票，由于无法或不情愿卖空造成套利不够充分，因此这些股票的错误定价难以被消除。套利行为在被低估和被高估股票中的不同程度被称为套利不对称性，它造成被高估股票中特质性波动率和预期收益率之间的负相关性强于被低估股票中'
  merge: -1
  img_proc: true
- pgno: 215
  md: '特质性波动率和预期收益率之间的正相关。两者结合，导致整个股票横截面上特质性波动率和预期收益率之间的负相关，即特质性波动率之谜。


    为了证实他们的猜想，Stambaugh et al.（2015）针对美股进行了详细的实证研究。为了确定被高估和被低估的股票，他们采用了本书4.1.6节在介绍Stambaugh-Yuan四因子模型时提及的11个异象。这些异象在美股上均能取得Fama-French三因子无法解释的超额收益。正如4.1.6节所讨论的那样，异象能获得超额收益说明其多、空对冲的投资组合中，多头能获得正的超额收益，而空头则获得负的超额收益。越是多头排名靠前的股票越有可能是被低估的，越是空头排名靠前的股票越有可能是被高估的。因此，异象变量取值的高低就可以用来描述错误定价的方向（被高估或低估）和大小[2]。在具体实施中，使用每个异象变量依次为股票排序：从每个异象变量与预期收益率的相关性出发，越是能在未来获得正超额收益的股票排名分数越低、越是能在未来获得负超额收益的股票排名分数越高。使用全部11个异象变量对股票排序后，每支股票就有11个分数，把它们取平均就得到综合得分。综合得分越高，则该股票越被高估，未来预期收益越低。这个综合得分就是评价每支股票被错误定价的变量。使用该错误定价变量和特质性波动率进行双重排序就可以对图5.13展示的猜想进行检验，而基于美股的实证结果支持了上述猜想。


    除上述主要发现外，Stambaugh et al.（2015）还以机构持股比例为代表，检验了套利限制程度对特质性波动率异象的影响。结果显示，在机构持股比例较低（套利限制较大）的股票中，特质性波动率异象更加显著。此外，该文通过Baker
    and Wurgler（2006）的投资者情绪指数研究了特质性波动率异象的时变特征。当投资者情绪高涨时，特质性波动率异象高度显著；但当投资者情绪低迷时，特质性波动率异象不再显著。


    # 5.3.2 A股市场中的特质性波动率异象


    为了计算特质性波动率，实证中选择Fama-French三因子模型为基准，使用过去21个交易日个股超额收益率和三因子收益率进行时序回归得到残差收益率，并计算残差收益率的波动率（IVOL），以此作为特质性波动率。在计算错误定价程度时，由于数据可得性问题本书未能复现财务困境、股票净发行量以及复合股权净发行量3个指标，故而采用余下的8个异象变量进行实证。


    由于实证中格外关注特质性波动率对不同错误定价程度的股票的影响，因此在接下来的实证中采用条件双重排序。首先，使用这8个指标构成综合错误定价变量，将所有股票分成5组，分别记为：最被低估（most
    underpriced）、2、3、4以及最被高估（most overpriced）。其次，在每个错误定价组内，利用IVOL将股票再分成5组，分别为：最低IVOL、2、3、4以及最高IVOL。上述双重排序一共产生5×5=25个投资组合。为了检验特质性波动率异象，在每个错误定价组中，使用最低IVOL和最高IVOL组之差构建IVOL投资组合（最低IVOL-最高IVOL）。作为对比，实证中同样考虑将五个错误定价组取平均的结果，以此考察仅用IVOL分组时，最低IVOL和最高IVOL组之差构建IVOL投资组合的收益率。


    表5.10至表5.13分别展示了不同投资组合的绝对收益以及超额收益的检验结果。首先来看平均五组错误定价的结果。无论是绝对收益还是超额收益，通过做'
