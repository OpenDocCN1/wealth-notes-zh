  md: 'B2：从罐子2中抽取一个小球，如果抽出蓝色小球则获得100元，如果抽出红色小球则没有奖励。


    实验二和实验一的区别在于两个选项中，获得奖励的小球颜色从红色变成蓝色。面对这两个实验，神奇的结果发生了：在实验一中，更多的实验者选择了A2；而在实验二中，更多的实验者选择了B2。实验一的结果说明，人们主观认为罐子1中的红色小球数量比罐子2中的红色小球（已知为50个）更少；而实验二的结果则截然相反，人们主观地认为罐子1中的蓝色小球数量比罐子2中的蓝色小球（也是50个）更少。这正是决策论中著名的Ellsberg悖论（Ellsberg
    1961）。


    该实验结果说明，在充满着不确定性的博弈中，人们讨厌结果分布未知的情况，这正是模糊厌恶。在面对风险决策时，如果结果的分布是已知的，那么该决策的不确定性对于人们来说是已知的，可以通过结果的分布精确地量化出该不确定性；反之，如果结果的分布是未知的，那么这个不确定性对人们而言也是未知的，因此无法被精确地量化出来。


    由于模糊厌恶，人们往往倾向站在模糊性的对立面，即选择自己熟悉的。在投资中，这体现在人们会根据自己的经验、学识和能力选择更熟悉的标的来投资。当然，这个出发点并没有问题，Warren
    Buffett（巴菲特）也曾建议人们不要涉足自己不擅长的领域。⑫不幸的是，这并不容易。由于过度乐观以及确认性偏误等认知偏差，人们往往在自认为熟悉的领域输得更惨。模糊厌恶和前景理论构成了风险偏好偏差的两大要素。这些理论很好地诠释了人们在面对风险时如何做决策。


    # 6.3.4 认知限制


    心理学中的认知限制（cognitive constraints），又被称作有限理性，它也是行为金融学对传统金融学的第三个挑战。它指的是学者们在研究人们如何做经济决策时，以人脑有限的处理能力为约束条件，并把它加入到最优化问题当中。在这个框架下，由于认知限制，人们只能在约束下做出次优解，而无法实现完全理性（无约束）下的最优解。在这个领域中，最重要的两个方面是有限注意力（limited
    attention）和分类思维（categorical thinking）。


    # 1. 有限注意力


    传统金融学理论认为，当人们在做决策时，应该使用全部可得的信息。然而，由于人脑对信息的分析处理能力是有限的，在任何给定的时刻，都无法及时处理所有的信息，而偏好去应对最显著、最重要的信息，这种认知限制被称为有限注意力。在股票市场中，投资者的有限注意力问题也十分普遍。心理学的研究表明，投资者有限注意力和以下三点有关：（1）信息的重要性，（2）投资者获取信息的渠道，（3）投资者处理信息的能力。


    关于有限注意力，Huberman and Regev（2001）给出了一个精彩的例子。1998年5月3日星期日，《纽约时报》（New York Times）封面报道了一家名为EntreMed的公司在治疗癌症方面的重大技术突破。这个消息使得该公司股票在接下来的星期一大涨330%。然而有意思的是，同样的消息其实早在半年之前就出现过；《自'
