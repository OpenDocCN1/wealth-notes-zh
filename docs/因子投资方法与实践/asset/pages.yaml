  md: '从上述讨论中延伸一步，便引出另外一个常见的问题。在开发收益率模型时，人们往往从不同的维度（比如估值、盈利、成长性、安全性等）寻找预测变量，而在每个维度内，为了预测水平的稳健性又会使用多个细分的变量。在这种情况下，将不同维度下的细分预测变量都一股脑塞入式（7.4）计算综合Z-Score并不科学。更合理的做法是按照层级处理，即先将属于每个维度的细分变量综合，得到该维度的Z-Score；然后再将几个维度的Z-Score汇总，得到最终的综合Z-Score。这种层级处理方法在学术界和业界非常普遍。举例来说，Asness
    et al.（2019）在构建公司质量因子时，就采用了该方法。他们首先使用资产毛利率（GPOA）、净资产收益率（ROE）、资产收益率（ROA）等计算盈利维度的Z-Score，用毛利润五年增长率、ROE五年增长率、ROA五年增长率等计算成长维度的Z-Score，用BAB因子（Frazzini
    and Pedersen 2014）、杠杆（总负债与总资产之比）、ROE标准差等计算安全性维度的Z-Score。最后，盈利、成长、安全三个维度的Z-Score汇总得到了每支股票的综合Z-Score，就得到了质量因子的变量。


    有了综合Z-Score，接下来就是将其转化为收益率预测。为此，要考虑以下一元截面回归模型：


    R_{it}=c_t+b_t z_{it-1}+ε_{it}, i=1,⋯,N  (7.5)


    式中z_{it-1}表示t-1时刻（即t期期初）股票i的综合Z-Score。使用OLS即可对模型（7.5）进行参数估计，求出ĉ_t和b̂_t。由于上述OLS回归在每个t期进行，因此一旦有了ĉ_t和b̂_t的时间序列{
    b̂_1,⋯,b̂_t }和{ ĉ_1,⋯,ĉ_t }，便可利用它们来预测t+1时刻的收益率。通常的做法是使用最近T个参数b和c的估计值各自取平均值（T的大小和预测收益率的频率有关。以预测月频收益率为倒，T的取值往往为12、24或36，代表利用过去12、24或36个月的参数估计值），并将均值视作t+1期参数的估计：


    ĉ_{t+1}=1/T Σ_{i=t-T+1}^{t} ĉ_i  (7.6)


    b̃_{t+1}=1/T Σ_{i=t-T+1}^{t} b̂_i  (7.7)


    得到ĉ_{t+1}和b̃_{t+1}之后，将它们代入模型（7.5）并使用t时刻最新的综合Z-Score，即可预测t+1时刻的收益率（预测值记为R̃_{it+1}）：


    R̃_{it+1}=ĉ_{t+1}+b̃_{t+1}z_{it}  (7.8)


    除上述每期截面回归再取均值估计下期参数外，另一种常见的做法是使用截至t时刻的最近的T期收益率数据，以及与它们对应的滞后一期的综合Z-Score数据进行面板回归（panel
    regression）。将面板回归得到的系数直接作为ĉ_{t+1}和b̃_{t+1}，并代入式（7.8）预测t+1的收益率。


    模型（7.5）和主动管理中关于超额收益的著名经验法则也密切相关。将模型（7.5）等号左右两侧同时减去基准的收益率（记为R_{Bt}）：


    R_{it}-R_{Bt}=(c_t-R_{Bt})+b_t z_{it-1}+ε_{it}  (7.9)'
