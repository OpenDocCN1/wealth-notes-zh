  md: '的一种简化方法。对于其他类型因子，比如宏观经济因子，该方法并不适用（2.2节会说明如何处理其他类型的因子）。话虽如此，由于风格因子在股票多因子模型中的地位无人能及，这种方法得到了广泛的使用。


    前文2.1.1节的例子说明，构建因子模拟组合的前提是知道所有股票在该因子上的暴露。由式（1.3）可知，股票在某因子i上的暴露βi反映的是在控制了其他因子后，该目标因子的收益率变化对股票超额收益变化的影响程度。这意味着首先需要知道因子收益率才能计算因子暴露。而从前文可知，首先需要有因子模拟组合才能计算因子收益率，而因子暴露又是构建因子模拟组合的前提条件。这种矛盾似乎让人们陷入“先有鸡还是先有蛋”的怪圈。排序法最大的优势则在于它舍弃了“因子暴露已知”这个条件，从而绕过了上述“怪圈”。


    下面以账面市值比（book-to-market ratio，BM，即市净率的倒数）这个经典的估值指标为例介绍排序法。虽然BM是一个估值指标，但依照学术界的惯例，将通过它构建的因子称为价值因子而非估值因子。本书遵循上述惯例。在排序法中，将股票排序的变量（比如BM）被称为排序变量（sort
    variable，简称变量）。排序法中最核心的思想是使用个股在该变量上取值的大来代替个股在该因子上暴露的高低。需要强调的是，该方法并没有假设变量的取值等于因子暴露，也没有假设这二者之间满足某种特定的数学关系。该方法仅假设变量和因子暴露是相关联的。以BM为例，该方法认为高BM的股票在围绕BM构建的价值因子上的暴露更高，低BM的股票在围绕BM构建的价值因子上的暴露更低，仅此而已。在这个核心思想下，人们虽然不知道个股在该因子上的暴露，但是却可以通过变量的高低来代替它，并以此为依据构建因子模拟投资组合。这正是排序法的方便之处。同时，这也解释了排序法为什么仅适用于风格因子。对于其他类型的因子（比如宏观经济因子），由于难以从个股本身的数据出发找到和因子暴露相关的变量，自然也就无法使用这种方法。


    前面说完了排序法的核心思想，下面马上来介绍它的具体方法。排序法的英文名字是portfolio sort，它的背后包含了“按变量将股票排序”“把股票依排序分组构建投资组合”以及“定期更新投资组合”三个步骤。


    +   （1）排序：首先确定股票池，并将股票池中的全部股票在截面上按照排序变量（本例中的BM）的取值高低从大到小（或从小到大）排序。


    +   （2）分组：按排名高低将全部股票分为L组（依照惯例，一般根据变量取值分布的十分位数将全部股票分成10组，即L=10）。做多排名最高的第一组内的股票，并同时做空排名最低的最后一组内的股票而构建一个多、空对冲的投资组合，该投资组合又被称为价差组合（spread
    portfolio）。由构建方式可知，价差组合中多、空两头的收益率分别为变量取值最高的1/L股票的收益和变量取值最低的1/L股票的收益，它们的差异就反映了围绕该变量构建的因子的收益率。因此，价差组合正是使用排序法构建的因子模拟投资组合，而价差组合的收益率正是该因子的收益率。需要指出的是，在构建价差组合时，通常要求多、空两个组合的金额相同，即整个因子模拟投资组合是资金中性的。此外，由于多、空两个投资组合都包含多支股票，因此需要为它们选择个股加权方式，其中最常见的是市值加权和等权重。


