- pgno: 271
  md: "买卖价差（bid-ask spread），对美股上多达120种因子进行了研究，发现当考虑了交易成本后，这些因子平均月收益率在样本内从超过0.6%下降到0.3%，而样本外的月均收益率甚至为负数。为降低交易成本对因子收益率的侵蚀，该文提出了一些优化交易算法，有效降低了换手率和成本。但即便在这种情况下，这120个因子的样本外月均收益率仅有0.13%。除此之外，这120个因子月均收益率均值的分布近似一个均值为零的正态分布，和随机因子的表现并无太大差异，即如果完全随机生成120个因子，其中也总会有一些是显著的。由于发表的因子都多少存在选择偏差（selection\
    \ bias），因此面对上述结果，Chen and Velikov（2019）不禁发问：在排除运气后，还有多少因子是显著的？为了回答上述问题，两位作者采用了经验贝叶斯方法对选择偏差进行了修正。\n\
    \n假设因子$i$在被发表后的样本平均收益率$\bar r_i$由真实$\\mu_i$和随机扰动$\\varepsilon_i$决定：\n\n$$\\bar\
    \ r_i = \\mu_i + \\varepsilon_i \\tag{6.23}$$\n\n其中$\\varepsilon_i$满足正态分布$\\mathcal{N}(0,\\\
    mathrm{SE}_i^2)$，这里$\\mathrm{SE}_i$是$\\bar r_i$的标准误（standard error）。进一步假设所有因子收益率的真实均值$\\\
    mu_i$都满足如下正态分布：\n\n$$\\mu_i \\sim \\mathcal{N}(\\mu_\\mu, \\sigma_\\mu^2) \\tag{6.24}$$\n\
    \n使用矩估计（method of moments）对$\\mu_\\mu$和$\\sigma_\\mu$进行估计：\n\n$$\\hat\\mu_\\mu\
    \ = \\frac{1}{N}\\sum_i \\bar r_i \\tag{6.25}$$\n$$\\hat\\sigma_\\mu^2 = \\max\\\
    left\\{\\left[\\frac{1}{N}\\sum_i (\\bar r_i - \\hat\\mu_\\mu)^2 - \\frac{1}{N}\\\
    sum_i \\mathrm{SE}_i^2\\right], 0\\right\\} \\tag{6.26}$$\n\n上式中$\\hat\\mu_\\\
    mu$是所有因子平均收益率的截面均值。接下来，使用贝叶斯收缩（Bayes shrinkage）方法，利用$\\bar r_i$和$\\hat\\mu_\\\
    mu$来估计因子$i$的真实收益率均值：\n\n$$\\hat\\mu_i = s_i \\hat\\mu_\\mu + (1 - s_i)\\bar r_i\
    \ \\tag{6.27}$$\n\n其中$s_i$是收缩系数，由$\\bar r_i$的标准误$\\mathrm{SE}_i$和$\\mu_\\mu$的标准差$\\\
    sigma_\\mu$的相对大小决定：\n\n$$s_i = \\frac{\\mathrm{SE}_i^2}{\\hat\\sigma_\\mu^2 +\
    \ \\mathrm{SE}_i^2} \\tag{6.28}$$\n\n结合$s_i$的定义式（6.28）不难看出，如果$\\mathrm{SE}_i$小说明$\\\
    bar r_i$可信，则收缩后的因子$i$的收益率由其主宰；如果$\\mathrm{SE}_i$相对$\\hat\\sigma_\\mu$很大就说明$\\\
    bar r_i$不可信，则因子$i$的收益率由全部120个因子的截面均值主宰。使用经验贝叶斯调整后，即便是最好的因子（排名前5%），当被发表后月均收益率也仅有0.21%。基于以上结果，他们认为考虑了合理的交易成本后，绝大多数因子在样本外都无法获利。"
