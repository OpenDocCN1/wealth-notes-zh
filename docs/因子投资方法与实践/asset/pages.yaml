    # 2.2.4 Fama–MacBeth回归


    1973年，Eugene Fama和James MacBeth在Fama and MacBeth（1973）一文中提出了一个两步回归方法（被称为Fama–MacBeth回归），该文的目的是检验CAPM。该方法非常巧妙地排除了随机扰动在截面上的相关性对标准误的影响，在业界被广泛使用。这篇文章也是计量经济学领域被引用最频繁的文章之一。


    与2.2.2节类似，Fama–MacBeth回归的第一步也是通过N个时间序列回归得到每个资产i在全部因子上的暴露 β̂_i，这和截面回归的第一步相同。Fama–MacBeth回归和截面回归检验最大的差异体现在第二步截面回归上。截面回归检验使用
    β̂_i 和 E_t[R_i^e]在截面上进行一次截面回归。Fama–MacBeth回归在每个时间点t，以t期的收益率 R_{it}^e 为因变量（注意：是t期的收益率，而非全部T期收益率的均值），以
    β̂_i 为自变量进行截面回归，因而一共进行了T次截面回归。这是Fama–MacBeth回归检验和截面回归检验最大的不同。在t期，资产超额收益和因子收益率在截面上的线性回归模型为：


    ```

    R_{it}^e = \hat{\beta}_i''\lambda_t + \alpha_{it}, \quad i = 1,2,\cdots , N \tag{2.36}

    ```'
