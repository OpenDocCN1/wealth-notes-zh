  md: '一旦确定了多因子模型，学术界往往选择已经发表的异象作为测试资产2，通过GRS检验（2.5.1节）来考察多因子模型能否解释它们的预期收益。此外，每当一个新的多因子模型被提出，它的提出者往往少不了用新模型和已有模型进行一番全方位的对比。这就是上面提到的第二方面。为比较不同的模型，可以使用同一组测试资产，或不同模型的因子互为测试资产来进行检验。对于前者，最常见的做法是GRS检验和α检验（2.5.4节）。它们的目标都是考察在哪个模型下，这组测试资产的超额收益更接近零。对于第二点，即两个模型的因子互为测试资产，常见的方法是GRS检验和均值一方差张成检验（2.5.2节）。


    接下来的第3章～第5章就将使用上面介绍的方法，从因子、多因子模型和异象的角度，针对中国A股市场进行详尽的实证研究。


    [1]本书第3章将会介绍被纳入多因子模型的常见因子；第4章将介绍学术界的七个主流多因子模型。


    [2]Hou et al.（2020）花费了大量的精力复现了452个异象，几乎涵盖了所有曾被用来检验多因子模型的异象。'
