  md: '# 2.7.5 不应成为黑箱


    GMM如此强大，再加上现在各种编程语言（R、Stata等）都能方便地计算，这种便捷性似乎把人们都惯坏了。人们习惯于把问题描述成矩条件后一股脑塞进GMM并仅从统计的角度选择W=S^{-1}得到有效估计。这样做十分危险。GMM的强大之处在于它不仅仅是一个计量经济学工具能用来做检验，更重要的是它足够灵活从而可以让人们研究真正关心的经济学或金融学问题。这种灵活性体现为可以从先验出发去定义最适合待研究问题的矩阵a（或W），而不是无条件地选择W=S^{-1}。


    以2.7.2节中资产定价的例子来说，它有4个矩和2个参数，待检验的模型是CCAPM。从经济学业务出发可以选择如下的ag_T( b̂ )=0：


    ```

    [1 0 0 0; 0 1 1 1] [E_T[m( b̂1, b̂2)R_m^e ]; E_T[m( b̂1, b̂2)R_f^g -1]; E_T[m(
    b̂1, b̂2)R_HML^e ]; E_T[m( b̂2, b̂2)R_SMB^e ]] = [0;0]   (2.139)

    ```


    在选择矩阵a时，令市场超额收益和无风险资产完美满足两个样本矩条件，并由此进行CCAPM的参数估计，求出两个参数 b̂1 和 b̂2。同时，使用另外两个资产的超额收益来检验CCAPM。由GMM框架可知，最终的χ²-统计量的自由度为2（因为一共4个资产，2个被用来估计参数），因此实际上的检验正是HML和SMB两个因子在CCAPM下的定价误差联合起来是否显著偏离零，从而判断接受或拒绝CCAPM。这个例子说明，从金融学原理出发选择合适的a或W能够回答最重要的问题。GMM的强大之处正在于此。


    纯从统计学的角度来说，选择W=S^{-1}确实能够得到有效估计量。但不要忘记，这个有效性是以给定的样本矩为前提的——如果换了或者添加了更多的矩，则参数的有效估计量也会发生变化。在金融市场中，有无数的资产，包括股票、债券、外汇、商品等，还有无数的投资组合，这些资产可以构成无数的矩。如果一味地追求有效性，则应把这成千上万资产的矩都塞进GMM。但显然，从业务的角度来说这么做毫无意义。在研究资产定价的时候，应该使用业务含义最重要的资产，并用它们去检验定价模型。毫无疑问，GMM非常强大，但在资产定价的研究中不应追求使用GMM进行一个仅在统计上正式但模型却缺乏含义的统计检验。GMM的强大在于它让人们从经济学和金融学原理出发，去找寻最合理的模型。不要让GMM成为计量经济学的黑箱。


    > [1] Lars Peter Hansen在提出GMM之后又对其进行了一系列必要的扩展，包括工具变量选择（Hansen 1985）、连续时间模型（Hansen
    and Scheinkman 1995）、其他GMM估计量（Hansen et al.1996）以及非最优权重矩阵下的GMM（Hansen and Jagannathan
    1997）等。Hansen也因为这一系列突出贡献，于2013年和Eugene Fama和Robert Shiller一起分享诺贝尔经济学奖。


    [2]关于这个式子的论述，详见公众号“川总写量化”的文章《理解资产价格》以及本书附录A。


    [3]如果样本矩的个数n等于参数个数p，则不存在过度识别问题，可以令所有矩都等于零从而求出全部p个参数。'
