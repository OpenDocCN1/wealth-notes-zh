  md: '• Fama–MacBeth截面回归检验先在不同的$t$上使用OLS（或GLS，下同）对$R_{it}^e$和$\hat{\beta}_i$的截面回归模型进行估计，再把估计$\hat{\lambda}_t$和$\hat{\alpha}_{it}$在时序上取均值得到$\hat{\lambda}=E_T[\hat{\lambda}_t]$和$\hat{\alpha}_i=E_T[\hat{\alpha}_{it}]$；


    • 传统截面回归检验是先把$R_{it}^e$在时序上取均值得到$E_T[R_i^e]$，然后用OLS对均值之间的截面回归关系进行一次估计，直接得到$\hat{\lambda}$和$\hat{\alpha}_i$。


    简单来说，Fama–MacBeth截面回归是“先估计、再均值”，而传统截面回归是“先均值，再估计”，因此，Fama–MacBeth回归可以被理解为一种特殊的截面回归。较2.2.2节的方法而言，Fama–MacBeth回归的优势是可以排除$\alpha_{it}$的相关性对标准误的影响。有必要指出的是，当截面回归中的解释变量$\hat{\beta}_i$在全部$T$期上不变时，以上两种方法得到的估计是相同的，但Fama–MacBeth在应对$\alpha_{it}$的截面相关性上仍然有优势。


    在实际应用中，由于Fama–MacBeth方法具有灵活性，不必限制全部$T$期截面回归中因子暴露$\beta_i$保持不变。事实上，在Fama and MacBeth（1973）中，两位作者在时序回归估计$\beta_i$时便采用了滚动窗口，因此因子暴露向量在不同的时刻$t$会发生变化。具体来说，对于$t$期，使用截至$t-1$期的一段给定窗口的历史数据进行时序回归估计因子暴露$\beta_{it-1}$。由于它是使用截至$t-1$期的數據估计的，因此因子暴露向量的时间下标是$t-1$。使用估计值$\hat{\beta}_{it-1}$作为$t$期截面回归的解释变量，得到如下的截面回归模型：


    ```

    $$R_{it}^e = \hat{\beta}''_{it-1}\lambda_t + \alpha_{it},\quad i=1,2,\cdots,N
    \tag{2.45}$$

    ```


    或考虑截距项的情况：


    ```

    $$R_{it}^e = \gamma_t + \hat{\beta}''_{it-1}\lambda_t + \alpha_{it},\quad i=1,2,\cdots,N
    \tag{2.46}$$

    ```


    在每个时刻$t$对模型（2.45）或模型（2.46）进行OLS估计就是时变因子暴露的Fama–MacBeth回归。比起全局都用同样的因子暴露，这种方法在实际的研究和投资实践中的应用更加广泛。


    下面来说一说Fama–MacBeth回归的不足。首先，它对于$\alpha_{it}$在时序上的相关性无能为力。其次，由于截面回归中用到的$\beta_i$并不是真实的，而是通过时间序列得到的估计值，因此存在误差。Fama–MacBeth回归对此也无能为力，仍然需要Shanken修正。话虽如此，Fama–MacBeth回归通过在截面回归时“先回归，再均值”的思路巧妙地排除了$\alpha_{it}$截面相关性的影响，得到了学术界的广泛认可，影响深远。时至今日，在计量经济学做面板分析的文章中，仍有约1/3的文章采用Fama–MacBeth回归（Petersen
    2009），且几乎在每篇研究资产定价的论文中都可以见到它的身影。Fama–MacBeth回归的要点总结如下。


    +   （1）Fama–MacBeth回归是一种截面回归。和普通截面回归一样，它的第一步也是通过时间序列回归得到资产在因子上的暴露$\beta_i$。


    +   （2）在得到$\hat{\beta}_i$后，在每个$t$（共$T$期）使用OLS对资产超额收益率$R_{it}^e$和$\hat{\beta}_i$的截面线性回归模型进行估计，得到$t$期因子的收益率的估计$\hat{\lambda}_t$和残差的估计$\hat{\alpha}_{it}$。在通过$T$次截面回归，得到$T$个估计后，将它们在时序上取均值得到因子预期收益率$\hat{\lambda}$和残差均'
