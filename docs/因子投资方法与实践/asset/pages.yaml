  md: '市值股票的预期收益率高于大市值股票。尽管有这一优点，然而一旦人们真正理解了因子背后的原因，就不再需要依靠其命名来暗示变量和收益率的关系。且考虑到这种做法在因子数量越来越多的时候将会对因子命名造成不便，因此本书放弃这种方法。


    使用变量本身和使用其代表的风格命名在方便程度上并无太大差异，但由于以下两个原因，本书作者认为后者更合理。首先，如前所述，风格因子在股票市场中占主宰地位。学术界和业界的绝大多数研究都是关于风格因子。因此，风格比变量本身能更清晰地传达出因子所代表的含义。其次，在业界的因子投资实践中，出于稳健性的考虑，往往使用多个指标构建某种风格的因子。比如，业界会同时使用BM和盈利市值比（earnings-to-price
    ratio，即EP）等多个估值指标构建价值因子。在这种情况下，选择某个指标对因子命名就会以偏概全。


    出于上述考量，本书选择以变量代表的风格为出发点对因子进行命名。举例来说，按照本书的约定，将会称使用BM构建的因子为价值因子，使用ROE构建的因子为盈利因子。


    [1]排序法的第二步将会通过做多排名靠前的股票、做空排名靠后的股票构建因子模拟投资组合。一般认为因子的风险溢价为正。这意味着在排序时通常从金融学和经济学原理考虑变量和收益率之间的相关性。如果变量和收益率呈现负相关，则往往按变量取值从小到大将股票排序。低波动因子就是这样一个例子。


