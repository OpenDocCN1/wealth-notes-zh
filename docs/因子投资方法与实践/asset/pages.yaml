- pgno: 293
  md: 'IVOL）。而“阿尔法因子”由于强调“阿尔法”，似乎仅仅对应α部分，而忽略像BM这样也能够预测股票收益率的变量，但这显然不是业界的做法2。业界关心所有能够预测股票收益率的变量（无论它们在学术界看來是一个因子变量还是一个异象变量），因为只要某个变量能够区分高收益和低收益股票，就可以通过它来选股并获取超额收益。


    总结一下上述讨论。第一，本书遵循学术界的惯例，因此“阿尔法”和“因子”指代的是异象和因子投资组合，而非它们背后的变量；反观业界使用“阿尔法因子”则是指代变量。第二，在式（1.3）的视角下，收益模型中的预测变量既可以是异象变量（对应α），又可以是因子变量（对应βλ），而“阿尔法因子”一词有强调“阿尔法”即异象变量之意。基于上述原因，下文将不会使用“阿尔法因子”这个称呼，而是使用（收益）预测变量表示收益率模型的研究对象。


    其实，哪种术语惯例更好是见仁见智的问题。以上的讨论并非强调学术界的术语比业界的称呼更合理，反之亦然。然而，由于因子投资包含的内容十分丰富，研究和实践因子投资的人更是数不胜数，因此一个人口中的“因子”未必是另一个人口中的“因子”。本节一开篇之所以花费不小的篇幅强调术语，是希望帮助刚接触因子投资的读者厘清不同的概念和定义，使读者在学习因子投资时不因术语的杂乱而困惑。


    # 7.1.2 寻找预测变量


    寻找收益率预测变量是主动管理的核心所在。在业界，量化研究员的主要工作就是开发“阿尔法”模型，除了维护已有的预测变量，还得不断学习、与时俱进，不断寻找新的预测变量。在这方面，可以从以下三个方面入手：发现新异象、改进已有预测变量以及使用另类数据。


    第一个方向，从常见的行情数据和公司财务出发，寻找尚未被发现的变量。这类尝试在二三十年前相对容易，如今随着异象挖掘越来越深入，要找到全新的异象愈发困难，这从近年来讨论新异象的论文越来越少也可以看出端倪。


    第二个方向，改进已有预测变量。很多时候，已有的变量虽然有效，但在构造方法上仍存在提升和优化空间。例如，6.7.4节讨论的ROA，可以将其分解为效率和效用两部分，从而提升异象的收益率。另外还有一些变量，随着社会和经济的发展慢慢变得不再合理，因此也需要改造。这其中最典型的例子要数BM。很多新经济（如很多科技公司）投入大量的研发费用，但它们并没有体现在净资产中；同理，广告支出对公司商业形象和未来收入会产生持续影响，也没有考虑进净资产。因此，对BM的一个改进思路就是将广告和研发支出加回净资产，以它们的总和作为分子计算BM。改进后的BM变量比起原始BM能够获得更高的超额收益（Liu
    et al.2019）。


    第三个方向，利用另类数据，寻找尚未被开垦的宝藏。传统的量价数据和财务数据，已经被挖掘到了山穷水尽的田地。受益于数据存储和计算的快捷，研究员们将目光投向了另类数据。另类数据的含义非常宽泛，只要和传统数据不同，只要可能存在新的信息，均会受到重视。常见另类数据包括交易社区数据、微观数据、ESG数据3、电商数据以及卫星和气象数据等，本书7.8.1节将会对另类数据'
