  md: '6.3节将系统梳理行为金融学的主要内容以及它和资产收益率的关系。下面先来说说出自行为金融学的第一个多因子模型：Stambaugh–Yuan四因子模型（Stambaugh
    and Yuan 2017）。


    Stambaugh and Yuan（2017）在市场因子和规模因子的基础上，引入管理因子和表现因子，构建了四因子模型：


    ```

    E[R_i]-R_f=β_{i,MKT} (E[R_M]-R_f) +β_{i,SMB}E[R_{SMB}]+β_{i,MGMT}E[R_{MGMT}]+β_{i,PERF}E[R_{PERF}]
    (4.25)

    ```


    式（4.25）中E[R_{MGMT}]和E[R_{PERF}]分别为管理因子和表现因子的预期收益率，而β_{i,MGMT}和β_{i,PERF}为个股i在相应因子上的暴露。在使用中，规模、管理
    construed和表现三个因子的投资组合均为月度再平衡。


    在上述四因子模型中，管理因子和表现因子均源自关于错误定价的研究。错误定价意味着价格较内在价值的偏离，当价格高于内在价值时资产被高估，当价格低于内在价值时资产被低估。被高估的资产由于价格的修正会在未来会出现较低的收益率，反之被低估的资产在未来则会获得较高的收益率。为了从错误定价中寻找因子的灵感，首先要找到衡量股票价格是否被高估或低估的指标。


    为此，Stambaugh and Yuan（2017）延续了两位作者以及他们的另外一位合作者余剑峰教授在早期关于错误定价的一系列研究，包括Stambaugh
    et al.（2012, 2014, 2015）。他们以11个Fama–French三因子模型无法解释的异象为基础，构建了错误定价指标。其背后的逻辑是，异象的超额收益反映了其投资组合内股票的收益中无法被Fama–French三因子模型解释的超额收益，即个股的错误定价。因此，异象变量取值的高低就可以用来描述错误定价的方向（被高估或被低估）和大小。表4.2总结了这11个异象。需要指出的是，该表的目的仅仅是对这些异象做简要说明，每个异象变量的名称并不完全等价于它的计算方法。关于异象变量的具体计算方法，请读者参考Stambaugh
    and Yuan（2017）或表中列出的代表文献。


    根据这11个异象之间的相关性将他们分成两组，使得每组内异象之间的相关性更好，而分属两组的异象的相关性较低。第一组包含股票净发行量、复合股权发行量、应计利润、净营业资产、总资产增长率及投资与总资产之比6个异象。这6个异象变量均和上市公司的管理决策相关，使用它们构建的因子被称为管理因子。第二组包含另外5个异象，即财务困境、O-分数、动量、毛利率及总资产回报率。它们均和上市公司的表现有关，使用它们构建的因子被称为表现因子。


