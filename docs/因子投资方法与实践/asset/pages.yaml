  md: '作为当今一个重要的投资类别，因子投资中涉及的内容非常丰富，但所有的方面都可以围绕式（1.3）来展开和讨论，形成一个关于因子投资的统一视角。为了更好地解释因子投资包含的内容，以下先对式（1.3）的三个成分加以说明，它们是因子、多因子模型以及异象。


    # 1.1.2 因子、多因子模型和异象


    图1.1展示了式（1.3）中的三个成分。在多因子模型中，β''iλ中包含了多个影响式（1.3）左侧资产收益率的解释变量，每个解释变量代表了一个因子。多个因子的预期收益率以及资产在它们上的暴露放在一起构成的β''iλ就是多因子模型。对于某个给定的资产i，如果它的实际预期收益率和多因子模型隐含的预期收益率之间的误差αi显著不为零，则称这个资产为一个异象（anomaly）。


    因子投资中最重要的自然是因子。那么，因子到底是什么？如何选择因子？由式（1.3）可知，它左侧不同资产的收益率均可以归结到有限个因子的收益率上，而不同资产预期收益率的高低由它们对因子的暴露大小决定。由此可以得出因子的定义：


    > 一个因子描述了众多资产共同暴露的某种系统性风险，该风险是资产收益率背后的驱动力；因子收益率正是这种系统性风险的风险溢价或风险补偿，它是这些资产的共性收益。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_9_0.png)


    下面通过一个来自Ang（2014）的类比加深对上述定义的理解。Ang（2014）将因子之于资产类比于营养之于食物。人们的日常生活离不开摄入各种食物，比如米饭、谷物、肉类和乳制品等。这些食物之所以对人体重要是因为它们所包含的营养成分，例如水、碳水化合物、蛋白质、纤维和脂肪等。这些营养成分就是食物的“因子”。每种食物对人体的价值体现在两方面：（1）它包含哪些营养成分以及包含了多少（类比多因子模型中的βi）；（2）该食品包含的每种营养成分对人体健康的重要性（类比多因子模型中的λ）。因此，虽然食物种类五花八门，但归根结底它们都可以归结为不同营养成分的组合；同理，虽然股票资产的组合形'
