- pgno: 253
  md: '于浮亏的时候则更希望通过彩票股回本，从而造成它们进一步被高估、未来的预期收益较非彩票股则更低。An et al.（2020）通过对美股的研究证实了上述猜想，并通过仅利用浮亏的股票构建偏度异象获得了更显著的超额收益。


    除上述研究外，Barberis et al.（2016）和Barberis et al.（2019）是综合考虑前景理论的价值及权重函数，并用它们来研究股票收益率的两个开创性研究[1]。其中，Barberis
    et al.（2016）研究了前景理论对股票截面预期收益率的预测能力。在每个月初，他们使用每股票过去60期月收益率作为该股票的盈利和亏损结果，套用前景理论的价值和权重函数计算出股票对于投资者的价值。该文通过一个市场均衡模型显示出投资者如果按照前景理论价值高低购买股票，会造成价值高的股票被超买、价值低的股票被超卖。因此前景理论价值和未来收益率呈负相关。他们将所有股票按前景理论价值高低排序后分成十组，通过做多价值最低的一组、做空价值最高的一组构建了前景理论价值异象。针对美股和其他46个国家股票市场的实证结果表明，该异象在绝大多数市场中均能够获得其他常见因子无法解释的超额收益，且在考虑了包括公司特征和收益率特征之内的很多控制变量之后，该异象的收益率依然显著。Barberis
    et al.（2019）从前景理论出发，并利用心理账户理论（Thaler 1985, 1999）中的狭隘框架（narrow framing）[1]，提出了一个全新的投资者决策模型。该模型考虑了前景理论中价值函数和权重函数的全部特征，使用股票收益率的波动率、偏度等参数为输入，且模型的最优解满足市场出清（market
    clearing）条件。除此之外，其创新之处在于它是一个动态模型，并考虑了投资者之前在股票上的盈亏情况，以此更好地反映出投资者在面对盈利和亏损时表现出的风险偏好差异。通过该模型，他们尝试解释市场上最重要的22个异象。实证结果显示，该模型能够很好地解释动量、异质波动率、异质偏度、盈利以及PEAD等异象，但无法解释市值、价值、反转、应计利润以及投资等异象。


    本节简单介绍了行为金融学和异象之间的关联。由于股票收益率的共同运动和投资者的行为有着千丝万缕的联系，行为金融学在解释股票收益率截面差异时也发挥了越来越大的作用。在本书4.1节介绍的多因子模型中，Stambaugh
    and Yuan（2017）提出的四因子模型和Daniel et al.（2020）提出的三因子模型都是从行为金融学出发的。它们对大多数异象的解释能力并不亚于其他从传统金融学理论提出的主流多因子模型。毫无疑问，这两个模型为实证资产定价和因子投资提供了新的思路，均是值得肯定的尝试。


    # 6.3.6 行为有效市场


    长久以来，有效市场假说是学术界对于市场理解的第一范式。Eugene Fama对市场有效性提出了三个基本假设：（1）市场将立即反应新的资讯，并调整至新的价位。因此价格变化取决于新资讯的发生，股价呈随机走势。（2）新资讯的出现呈随机性，即好、坏资讯是相伴而来的。（3）投资者是理性且追求最大利润的，而且每个人对于股票的分析都是独立的，相互不受影响。


    有效市场假说的核心假设是“价格反映全部信息”“价格并迅速反应到位”以及“所有的投资者都是理性的”。在这些假设下，股价的走势应该是阶梯型的：当一个利好消息出现时，它瞬间跳升；当一个利空消息出现时，它瞬间下降；当没有新息时，它保持不变。显然，这和现实中的股价走势完全不符。无数的实证结果持续地挑战着有效市场假说，而正如图6.2所示的那样，行为金融学也对这三个'
