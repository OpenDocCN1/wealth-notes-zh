- pgno: 268
  md: '# 6.6 因子样本外失效风险


    因子样本外的表现较样本内变差是人们的共识。这里的因子包括异象和因子，在下文不做区分，统称为因子。造成因子样本内、外表现差异的最主要原因自然是样本内的数据窥探（即因子本来就是假的），但如果因子确实是真实的，那么它们在样本外变差的原因是什么呢？学术界和业界的主要观点包括：曝光导致错误定价减弱、因子拥挤、交易成本。下面分别做简要介绍。


    # 6.6.1 曝光导致错误定价减弱


    如果一个因子背后的原因并非系统性风险补偿，那么它代表着市场在某方面的非有效性、代表了某种错误定价。只要套利限制不是过大，聪明的投资者就一定会先人一步去交易这个因子，导致定价错误收窄甚至消失，这就解释了为什么当因子被发表后，它的收益往往也跟着显著下降。


    在这方面，McLean and Pontiff（2016）的研究颇具代表性。该文研究了97个因子，发现因子样本外的表现比样本内的表现下降了26%、发表后（post-publication）的表现较样本内则下降了58%。McLean
    and Pontiff（2016）考虑样本内外差异是为了控制过拟合的影响。上述结果表明，58%与26%之差——即32%——就是发表本身造成因子效果的减弱。McLean
    and Pontiff（2016）把它称作因被发表而造成的“知情”交易（publication-informed trading）。这背后的逻辑链是：因子被发表导致它被公布于众，越来越多的人交易该因子从而减弱了错误定价，最终导致因子收益率降低。


    如果说McLean and Pontiff（2016）检验了因子的平均收益，Bowles et al.（2019）则是从时效性的角度展示了因子背后的信息越来越快地被反映到价格之中。长久以来，由于Fama
    and French（1993）的影响太过深远，学术界在研究因子的时候为了避免未来数据，通常采用每年再平衡的方法（量价相关的指标通常是月频再平衡），导致构建因子的指标数据严重滞后。这其中最著名的例子要数Eugene
    Fama的学生Clifford Asness使用月频价格对Fama-French三因子模型中的价值因子（HML）的改造。Asness and Frazzini（2013）发现，使用月频价格数据构造的价值因子较原始价值因子表现更好，说明了数据时效性的重要性。


    对于使用财务指标构造的因子，学术界之所以使用每年再平衡是因为学术界的重心毕竟是实证资产定价。为了研究成果的可复制性和可比性，大家用的都是同样的数据库、采用同样的再平衡周期，因此也就没有想过要用粒度更细的数据。Bowles
    et al.（2019）反其道而行之，使用Compustat Snapshot数据库对因子时效进行了分析。Snapshot数据库在学术界用得很少，但它却是有着粒度最细的数'
  merge: -1
  img_proc: true
- pgno: 269
  md: '据，精确记录财报中每个变量更新的时间。


    以美股为例，通常上市公司先有业绩公告然后才有季报（10-Q）和年报（10-K）的披露。而在业绩公告时往往只会公布总收入和净利润等部分指标，而等到正式的财报中才披露全部财报内容。在这种情况下，Snapshot数据库会在业绩公告当日更新总收入和净利润这些先期被披露的数据，而等到财报披露之后再更新其他数据。因此，使用Snapshot数据可以保证在用来计算因子的指标被更新后，第一时间更新因子，进行投资组合的再平衡。利用Snapshot数据，Bowles
    et al.（2019）研究了一些常见的源自财务数据的因子，发现绝大多数因子在最新数据更新后的120天之内（特别是最初的30天内）能够获得显著的超额收益。而在120天之后，超额收益消失。基于这些发现，Bowles
    et al.（2019）认为因子的超额收益很快就会因套利交易而消失，说明因发表造成的曝光导致因子背后的错误定价被削弱。和Bowles et al.（2019）针对美股的研究类似，国内的券商金工团队针对A股也做过类似的研究，并发现利用业绩预告和快报能够提升财务信息的时效性，提高财务因子的表现。


    # 6.6.2 因子拥挤


    造成因子样本外变差的第二个原因是因子拥挤（factor crowding）。通常来说，因子的表现都有周期性。当某类因子好使的时候，就会导致更多的资金涌入，从而出现因子拥挤，并降低该因子未来的预期收益率。而使用相似的指标排序、接近的调仓频率的因子投资无疑加剧了这种负面影响。由于因子拥挤度和因子未来收益率呈现负相关，如何定量计算因子拥挤度就成为人们关注的问题。在这方面，MSCI整理了相关研究，提出五个描述因子拥挤度的代理指标（Bayraktar
    et al.2015，Bonne et al.2018）。这五个指标包括估值价差（valuation spread）、配对相关性（pairwise correlation）、因子波动率（factor
    volatility）、因子反转（factor reversal）以及做空持仓量差异（short interest spread）。由于制度问题，做空持仓量差异在A股上并不适用，所以下面对其他四个指标做简要介绍。


    # 1. 估值价差


    顾名思义，估值价差考虑的是因子的估值是否便宜。其背后的逻辑是，当更多资金涌入某个因子时（特别是多头时），会造成受波及股票的价格上涨，使它们的估值变高。因此，因子估值和因子拥挤度成正相关，是一个不错代理指标。估值价差的计算方法十分直观。首先选择一个合适的股票估值指标，比如BM，然后分别计算因子多空两头组合中该估值指标的中位数，以此作为多空两头的估值，最后这两个估值差就是因子的估值价差。当使用BM时，因子估值价差的表达式为：


    ```

    估值价差 = ln( 多头中个股 BM 中位数 / 空头中个股 BM 中位数 ) (6.22)

    ```


    # 2. 配对相关性


    第二个因子拥挤度指标是配对相关性。它是为了从因子投资组合内股票收益率的相关程度来试图揭示资金持仓的集中程度，并以此来评价因子的拥挤程度。'
  merge: -1
  img_proc: true
- pgno: 270
  md: '为了计算该指标，可采用如下步骤：


    （1）从股票收益率中提出系统性的部分，得到特质性收益率。


    （2）对于多、空两头，分别计算每支股票的特质性收益率和其他股票特质性收益率均值的相关系数。以多头为例，使用多头组合中第i支股票的特质性收益率和多头组合内其他股票的平均特质性收益率计算相关系数。空头处理相同。


    （3）在多、空两头组内，分别计算每组上述相关系数的均值。


    （4）将多、空两头相关系数均值再取平均，得到该因子配对相关性的原始值，最后再将该值进行标准化得到最终该因子的配对相关性。


    # 3. 因子波动率


    由于资金的流入会加剧因子收益率的波动，因此Bonne et al.（2018）从这个角度提出了衡量因子拥挤度的第三个指标，即因子波动率。值得一提的是，该文使用的是预测的未来因子波动率相对未来市场波动率的比值来计算该指标。他们认为这么做可以有效控制市场波动率变化造成的影响。在实际操作中，一个简化的处理方法是使用因子的历史波动率。4.
    因子反转


    最后一个因子拥挤度指标是因子反转。De Bondt and Thaler（1985）这篇著名的论文表明美股在3到5年的中长期尺度上存在反转。由于因子是股票构成的投资组合，因此可以从股票的反转延伸出因子的反转，使用因子过去三年的累计收益率计算该指标。


    因子拥挤也会引发流动性冲击。一旦市场中发生冲击因子的事件，持有相似头寸的管理人会竞相卖出手中的股票，由此产生的流动性危机十会造成很大的亏损。2007年8月，美股市场上一些非常优秀的量化对冲基金在短时间内录得了巨大的亏损。Khandani
    and Lo（2011）对此进行了研究并发现，很多基金经理在短时间内清理了相似的头寸，巨大的抛压对流动性造成了巨大的打击、使得这些股票的价格在短时间内大幅下跌。


    # 6.6.3 交易成本


    交易成本是因子在样本外的效果较样本内显著变差的第三个原因。大多数研究因子的学术论文中并没有对交易费用给予充分的考虑，造成对因子收益率的高估。此外，由于因子投资组合一般都是多、空对冲的组合，因此如果不合理考虑做空限制，也会高估因子的收益。以价值类因子为例，Kok
    et al.（2017）指出并没有证据表明基于BM的策略可以持续战胜基准。BM在回测中的良好表现主要来自做空一小撮微小市值成长股。尽管该因子的纸面收益率很高，但在实际中考虑了各种成本和费用之后，却难以盈利。Novy-Marx
    and Velikov（2016）研究了交易费用对因子效果的影响，并提出三个思路降低交易成本：（1）仅使用交易费用低的股票构建因子组合；（2）降低因子组合再平衡的频率；（3）在交易时考虑更严格的买卖价差约束。


    Chen and Velikov（2019）使用有效价差（effective spread）的概念代替传统的'
