- pgno: 78
  md: '假设有一元回归模型y = b x + ε（模型只有一个解释变量，没有截距项）。该一元回归模型的OLS估计为：


    $$\hat{b} = \frac{\langle x, y \rangle}{\langle x, x \rangle} \tag{2.85}$$


    上式中，⟨x, y⟩ 表示向量x和y的内积，即⟨x, y⟩ = Σ_{i=1}^N x_i y_i。式（2.85）这个结果非常简单，但是它十分重要。比较式（2.85）和式（2.84）的表达式可以发现，如果多元回归模型中所有的解释变量两两正交，即⟨x_i,
    x_j⟩ = 0, i≠j，则向量β̂中的每一个系数β̂_i恰恰等于：


    $$\hat{b}_i = \frac{\langle x_i, y \rangle}{\langle x_i, x_i \rangle} \tag{2.86}$$


    上式成立是因为⟨x_i, x_j⟩ = 0保证了矩阵X′X的所有非对角元素都是0，因而它是一个对角阵。对角阵的逆矩阵就是把该对角阵对角线上的元素都取倒数，所以逆矩阵仍然是对角阵。因此，式（2.84）中X′X的第i个对角元素为1/⟨x_i,
    x_i⟩。另外，X′y的第i个元素是x_i和y的内积，即⟨x_i, y⟩。因此，β̂_i恰好等于⟨x_i, y⟩ / ⟨x_i, x_i⟩。


    多元回归的OLS估计量β̂_i和一元回归的OLS估计量β̂的表达式一模一样，说明当所有解释变量相互正交时，不同的因子暴露对彼此的因子收益率没有影响，这正是因子相互正交的好处。那么，当因子之间不正交时又会怎样呢？为了回答这个问题，先来看看回归的几何意义。


    # 2.6.2 回归的几何意义


    将式（2.84）中β̂的表达式代入模型（2.83）得到样本残差ε̂。计算X和ε̂的内积有：


    $$\begin{aligned}

    X''\hat{\varepsilon} &= X''(y - X\hat{b})\n&= X''(y - X(X''X)^{-1}X''y)\n&= X''y
    - (X''X)(X''X)^{-1}X''y\n&= X''y - X''y\n&= 0

    \end{aligned} \tag{2.87}$$


    上式说明，OLS的残差ε̂和解释变量X正交。来看看这在几何上意味着什么。先考虑最简单的一元回归的情况。如图2.13所示，一元回归OLS的几何含义是将y垂直投影到x之上，使得y和其在x上的投影之间的距离（ε̂的长度）最短。'
