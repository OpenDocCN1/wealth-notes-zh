  md: '# 4.2 A股中被定价的因子


    本书3.2到3.8节介绍了一些主流因子，并在A股市市场上使用排序法对它们进行了检验。虽然前文通过和市值的双重排序排除了小市值的影响，但它依然无法完全规避目标因子在其他因子上的暴露。为此，本节使用Fama-MacBeth回归进一步检验上述因子中有哪些在A股中真正被定价，即可以获得显著的超额收益。


    # 4.2.1 Fama-MacBeth回归实证设定


    依照2.3节的介绍，在进行Fama-MacBeth回归时，除去市场因子，本书将使用公司特征作为因子暴露值。这意味着除市值外，将用每期截面上公司特征指标的实际取值。对于市值，由于削弱市值分布右偏的影响，将用对数市值代替市值作为因子暴露。这种做法也符合学术界的惯例。对于市场因子，本书使用滚动252个交易日窗口时序回归计算个股的β作为其在市场因子上的暴露。在Fama-MacBeth回归中，在每个t月使用当期公司特征作为解释变量，使用个股t+1月的收益率作为被解释变量，通过截面回归计算因子的收益率。具体步骤请参考2.2.4节。在每期回归时，股票的选取遵循和第3章一样的数据处理原则。


    在给出结果之前，还有另外两个设定需要说明。第一，本节实证在Fama-MacBeth回归中加入了截距项，以控制模型设定偏误问题。第二，无论是学术界还是业界，在进行回归时，往往对作为解释变量的因子暴露在截面上进行剔除异常值以及标准化两步处理。经标准化后，所有因子暴露在截面上的标准差均为1，这有利于直接对比不同因子的风险溢价。不过本节的实证中仅对因子暴露进行剔除异常值处理，不进行标准化处理凹，但行文中会说明在这种情况下如何比较不同因子的收益率。


