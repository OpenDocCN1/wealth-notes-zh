- pgno: 69
  md: 'μ = E[R_t] ≡ [μ₁; μ₂],    V = cov(R_t) ≡ [V₁₁ V₁₂; V₂₁ V₂₂]   (2.69)


    由多因子模型可知：


    R₂ₜ = α + β R₁ₜ + εₜ   (2.70)


    利用μ和V可以求出α=μ₂-βμ₁以及β=V₂₁V₁₁⁻¹。接下来，定义δ=1_N-β1_K（其中1_N和1_K分别为N和K阶元素全是1的向量）。由此，Huberman
    and Kandel（1987）给出了均值—方差张成检验的原假设的充要条件：


    H₀: α=0_N, δ=0_N   (2.71)


    式中，0_N表示N维零向量。当原假设式（2.71）成立时，对于任何一个用来检验的资产（或这些资产的组合），总能使用原始的K个因子来构建一个投资组合，并使得该投资组合的预期收益率和测试资产的预期收益率相同，但方差更低。其中前者由α=0_N和δ=0_N（即β1_K=1_N）保证；而后者由式（2.70）中R₁ₜ和εₜ不相关，且
    var（εₜ）>0保证。这两条关于预期收益率和方差的性质说明，这N个资产无法在K的基础上张成更优的最小方差前沿，因此可以接受原假设。


    除了上述数学含义外，从由全部N+K个资产张成的最小方差前沿上也能够找到上述原假设的直观解释。Kan and Zhou（2012）指出，在这个最小方差前沿上存在两个特殊的投资组合。其一是全局最小方差组合（global
    minimum-variance portfolio），其二是从均值—方差二维平面的原点(μ̂=0, σ̂=0)向最小方差前沿做切线的切点。如果原假设成立，则条件δ=0_N意味着全局最小方差投资组合中，N个资产的权重都是零，即该组合完全由K个因子构成。类似的，条件α=0_N意味着切点投资组合中N个资产的权重都是零，因此该组合同样完全由K个因子构成。换句话说，这两个特殊的投资组合均仅仅由K个因子构成，而N个资产对它们没有任何贡献。另外，在投资组合理论中，有一个重要的定理叫作“两基金分离定理”（two-fund
    separation theorem）。它的含义是，使用最小方差前沿上的任意两个组合就能构造出整个前沿，即前沿上的其他组合都可以由这两个投资组合的某种线性组合得到（Merton
    1972）。根据“两基金分离定理”，如果这两个投资组合中均不包含N个测试资产，那么整个由N+K个资产构成的最小方差前沿上的所有投资组合都不包含这N个资产，这便解释了为什么α=0_N和δ=0_N是原假设成立的充要条件。


    虽然以上直观地解释了均值—方差张成检验要干什么以及它的原假设是什么，但为了进行检验，还是要用到的具体的统计检验量的。在这方面，Huberman and Kandel（1987）一文最早提出了似然比（likelihood
    ratio）检验统计量。而Kan and Zhou（2012）又通过Wald检验和拉格朗日乘数（Lagrange multiplier）检验构建了两个检验统计量。这三个检验统计量在大样本下都渐进满足自由度为2N的χ²分布。


