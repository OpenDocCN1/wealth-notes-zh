  md: '# 7.7 风险归因


    除了风格分析，多因子模型同样能在对投资组合进行风险归因（risk attribution）时发挥巨大的作用。从定义出发，既然每个因子都代表资产收益中的某种驱动力，那么投资组合的风险和它在不同因子上的暴露以及因子本身的波动就密切相关。从该思路出发，Menchero
    and Davis（2011）提出了对投资组合风险归因的一个简洁、直观的式子：风险=暴露×波动率×相关性。这个公式被称为风险的“三要素”公式。


    为介绍风险归因方法，假设投资组合的收益率R可以表示为M个收益源的线性组合：


    ```

    R = Σ_{m=1}^{M} x_m r_m  (7.95)

    ```


    式中x_m是投资组合在收益源m上的暴露，r_m是收益源m的收益率。为简化表达，式（7.95）中省略了时间下标。在多因子模型中，不同的因子和个股的特质性收益率就是不同的收益源。接下来，暂时把因子或特质性收益这些收益源一视同仁，使用式（7.95）介绍风险归因的方法，以便读者理解。在介绍风险三要素公式之前，作为铺垫，首先来看另外两种常见的风险归因方法。


    # 7.7.1 两种传统风险归因方法


    第一种方法是独立考虑每个收益源对投资组合的风险贡献。对于收益源m，由（7.95）可知，它对投资组合的收益率贡献为x_m r_m，因此其风险贡献为 σ（x_m
    r_m）。这种方法先计算收益源的收益率r_m自身的风险，再把它按比例计算到投资组合收益率的风险中。这种做法虽然直观，但是它没有考虑收益源与投资组合之间的相关性——收益源与投资组合的相关性越高，它对投资组合的风险贡献度越大。此外，收益源各自独立的风险加在一起并不等于投资组合的风险，即：


    ```

    σ(R) ≠ Σ_{m=1}^{M} σ(x_m r_m)  (7.96)

    ```


    式中σ（R）为投资组合的风险。因此，投资组合的风险无法被收益源的独立风险之和所解释。


    第二种方法是考虑每种收益源m对投资组合风险的边际贡献（marginal'
