  md: '# 第5章

    异象研究


    继第3章和第4章在A股市场对因子和多因子模型进行了实证之后，本章是本书实证环节的第三部分，它将着眼于分析异象。从因子投资的方法论来说，如果一个资产能够获得定价模型无法解释的超额收益，那么它就可以被称为一个异象。然而，由于人们对真实定价模型的认知还非常有限，因此通过数据挖掘总能找到很多源自公司财务信息或者量价信息的指标，以它们为变量构建的投资组合便符合上述异象的定义。然而在现实中，很多异象仅仅是过拟合的产物，在样本外根本站不住脚ㄠ。为了避免这个问题，异象背后应该有非常扎实的金融学依据。


    此外，由式（1.3）可知，异象的超额收益代表了异象的预期收益和定价模型所解释的预期收益之间的偏离。从这个意义上说，异象的产生和投资者对资产的错误定价有关。因此，越来越多在样本外可持续的异象都能或多或少地从错误定价的角度解释。另一方面，与早期使用单一变量构建异象的研究相比，越来越多新近的研究使用多变量，从多维度构建综合异象变量，从而捕捉更加稳定的超额收益。本章接下来的部分将详细解析三个经典的异象，它们分别为由预期差造成的估值高低异象（5.1节）、基本面锚定反转异象（5.2节）以及特质性波动率之谜（5.3节）。希望通过本章的介绍让各位读者了解研究异象的方法。


    在开始解读异象之前，还有一个问题需要说明。为了检验异象能否获得显著超额收益，就必须要选择定价模型。为此，本章的实证选取了被海外学术界和业界最广泛使用的CAPM和Fama-French三因子模型。此外，由本书第4.3节的论述可知，Liu
    et al.（2019）主张的包含市场、规模、价值以及盈利的四因子模型也能够解释很多A股市场上的潜在异象。细心的读者可能已经发现，该模型其实就是在Fama-French三因子模型的基础上加入了Fama
    and French（2015）提出的盈利因子，是对三因子模型的完美补充。为此，本章也将上述四因子模型（记为Liu-Shi-Lian四因子模型）选为用于检验异象的定价模型。除上述模型外，Fama-French五因子模型也是海外学术界常用的定价模型。然而，从本书3.7.3节的实证结果可知，投资因子在A股上并不显著，无法解释股票预期收益率的截面差异。此外，从计量经济学的角度来说，投资因子可以被视作一个不相关的变量（irrelevant
    variable）。在OLS中加入不相关变量虽然不会影响其他估计量的无偏性，但会对估计量的方差造成负面的影响，进而影响检验结果。基于以上两点原因，本章并'
