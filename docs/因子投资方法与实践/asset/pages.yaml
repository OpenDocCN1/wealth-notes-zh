  md: '# 4.1 主流多因子模型综述


    自Fama and French（1993）发表并提出第一个多因子模型以来，学术界对多因子模型的研究经历了近30年。其间，很多新的模型先后被提出，它们对人们认知市场产生了深远的影响。表4.1总结了当下学术界主流的多因子模型，其中最“年长”的模型是Fama–French三因子模型（“高龄”28岁）、最“年轻”的模型是Daniel–Hirshleifer–Sun三因子模型（还是个“小婴儿”）。


    # 表4.1 主流多因子模型


    | 模型 | 出处 | 所含因子 |

    |---|---|---|

    | Fama–French 三因子 | Fama and French (1993) | 市场、规模、价值 |

    | Carhart 四因子 | Carhart (1997) | 市场、规模、价值、动量① |

    | Novy-Marx 四因子 | Novy-Marx (2013) | 市场、价值、动量、盈利 |

    | Fama–French 五因子 | Fama and French (2015) | 市场、规模、价值、盈利、投资 |

    | Hou–Xue–Zhang 四因子 | Hou et al. (2015) | 市场、规模、盈利、投资 |

    | Stambaugh–Yuan 四因子 | Stambaugh and Yuan (2017) | 市场、规模、管理、表现 |

    | Daniel–Hirshleifer–Sun 三因子 | Daniel et al. (2020) | 市场、长周期行为、短周期行为 |


    ①动量因子实际上是代表股票之间相对强弱的截面动量，但通常当学术界提到这个因子的时候并不会特别加上“截面”二字。因此，依照惯例，本书也简称它为动量因子。


    虽说新模型的提出是为了取代老模型，但目前学术界就各个模型的孰优孰劣尚未达成一致的观点。正如Fama–French三因子模型如今依然是实证资产定价研究中被使用最广泛的定价模型，而像Hou–Xue–Zhang四因子模型和Stambaugh–Yuan四因子模型这些完全从不同角度推出的模型也极大地丰富了人们对资产定价及因子投资的理解。接下来就逐一介绍表4.1中的多因子模型。


    # 4.1.1 Fama–French三因子模型


    在多因子模型被提出之前，CAPM是资产定价的第一范式。然而，自20世纪70年代以来，学者们逐渐发现按照某种风格“打包”的股票能够战胜市场。这其中最值得一提的是Basu（1977）发现的盈利市值比（EP）效应和Banz（1981）发现的小市值效应。继EP之后，账面市值比（BM）和债务市值比（debt
    to market value of equity，DM）效应也被发现。虽然单一异象被发现后都对CAPM提出了挑战，但它们并没有形成合力，因此人们并未对CAPM产生太大的质疑，直到Fama
    and French（1992）横空出世，它整合了之前被提出的多种异象，彻底颠覆了人们对CAPM的看法。当然，由于CAPM在数学上足够简单优雅，且在业务上非常容易解释（风险来自对市场的暴露），因此它还是资产定价的一个很好的出发点，只是'
  merge: -1
  img_proc: true
- pgno: 159
  md: '人们再也无法忽视不能被CAPM解释的其他系统性风险因子了。


    想要摒弃一个旧模型，唯有提出一个更好的新模型。Fama and French（1993）在CAPM的基础上，加入了价值（High-Minus-Low，HML）和规模（Small-Minus-Big，SMB）两个因子，提出了三因子模型山，它也是多因子模型的开山鼻祖：


    ```

    E[R_i]-R_f=β_i MKT (E[R_M]-R_f) +β_i SMB E[R_SMB]+β_i HML E[R_HML]  (4.1)

    ```


    式（4.1）中，E[R_i]表示股票i的预期收益率，R_f为无风险收益率，E[R_M]为市场组合预期收益率，E[R_SMB]和E[R_HML]分别为规模因子（SMB）及价值因子（HML）的预期收益率，β_i
    MKT、β_i SMB和β_i HML为个股i在相应因子上的暴露。


    为构建价值和规模因子，Fama and French（1993）选择了BM和市值两个公司指标，并用它们进行了如图4.1所示的2×3独立双重排序。在排序时，以纽约证券交易所（New
    York Stock Exchange，NYSE）（下面简称纽交所）中上市公司的市值中位数为界，把NYSE、纳斯达克（NASDAQ）以及美国证券交易所（American
    Stock Exchange，AMEX）的上市公司分成小市值（Small）和大市值（Big）两组。类似的，以NYSE中上市公司BM的30%和70%分位数为界，把这三大交易所的上市公司分成三组：BM高于70%分位数的为High组、BM低于30%分位数的为Low组、位于中间的为Middle组。通过以上划分后，按照市值和BM各自所属的组别，所有股票被分到一共6（2×3=6）个组中，记为S/H、S/M、S/L、B/H、B/M及B/L。将每组中的股票收益率按市值加权就得到六个投资组合。最终，Fama
    and French（1993）使用如下方法构建了规模和价值两个因子：


    ```

    SMB = 1/3(S/H + S/M + S/L) - 1/3(B/H + B/M + B/L)  (4.2)

    HML = 1/2(S/H + B/H) - 1/2(S/L + B/L)  (4.3)

    ```


    | BM | High (高组) | Middle (中间组) | Low (低组) |

    |---|---|---|---|

    | 市值 Small (小市值) | S/H | S/M | S/L |

    | 市值 Big (大市值) | B/H | B/M | B/L |


    市值分组依据：NYSE 中位数；

    BM 分组依据：NYSE 30% 和 70% 分位数。


    图4.1 BM和市值双重排序


    从式（4.2）和式（4.3）中不难看出，规模因子是三个小市值组合S/H、S/M及S/L的等权平均减去三个大市值组合B/H、B/M及B/L的等权平均；而价值因子是S/H和B/H两个高BM组合的等权平均减去S/L和B/L两个低BM组合的等权平均。在每年的六月末，Fama
    and French（1993）使用上一财年最新的财务数据对股票重'
