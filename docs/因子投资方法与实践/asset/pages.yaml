    # 图3.13 检验CAPM


    CAPM被A股的数据拒绝并不令人意外，也可以由此引申出两个思考。第一，市场因子本身无法有效地解释股票预期收益率的截面差异，因此需要在CAPM模型的基础上加入其他风格因子，找到适合A股市场的多因子模型。第二，高β并没有带来高收益，反倒是低β带来了高收益，这表明A股市场中也可能存在著名的低β异象。


    [1]颇有意思的是，在提出CAPM之后，Lintner将他自己的模型和当时已经发表的Sharpe的模型进行了比较，并指出他们的模型并不相同，而且他自己的模型适用性更强。在一段时间内，Sharpe似乎被说服了，并承认Lintner的模型确实优于自己的（Sharpe
    1966b）。然而Fama（1968）指出二者的CAPM模型是等价的。


    [2]这一假定沿袭自Markowitz（1952），即投资者根据均值一方差优化方法进行投资组合选择。Markowitz的这一经典研究建立了现代投资组合管理理论，也打开了现代金融学的大门。


    [3]横截面回归方法的早期代表性研究包括Blume（1970）、Blume and Friend（1973）和Black et al.（1972），他们用组合作为测试资产来提升β的估计精度，而Fama
    and MacBeth（1973）的方法则是实证资产定价研究中最为常用的方法之一，2.2.4节对此有详细的讨论。时间序列回归方法的典型代表则是Jensen（1968），通过将资产超额收益序列对市场组合超额收益序列进行回归，得到与市场因子无关的α，并通过α的显著性来检验模型是否正确反映了资产的预期收益，这也为后来的GRS检验等提供了坚实的基础。'
