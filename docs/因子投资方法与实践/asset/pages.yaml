    # 5.1.4 通过预期差获取超额收益


    从5.1.2节和5.1.3节两节的实证来看，F-Score和G-Score均在A股上表现出一定的有效性，但前者的普适性更强。本节利用F-Score所代表的基本面强弱以及BM代表的估值高低来改进价值因子，争取获得更高的超额收益。而入手的出发点正是估值和基本面的匹配程度。


    Piotroski and So（2012）对于基本面和估值之间的匹配问题进行了充分的研究，提出了预期差（expectation errors）的概念，并指出价值股战胜成长股背后的原因是错误定价，即市场参与者低估了价值股、高估了成长股。这里的高估和低估都是价格相对于其内在价值而言的。价格反映了投资者对股票的市场预期，而内在价值反映了股票本身的基本面预期。高估、低估说明这两个预期之间存在差异，Piotroski
    and So（2012）把这个差异定义为预期差，价值股跑赢成长股的内在逻辑是预期差的修正。为了证实他们的猜想，两位作者使用F-Score来衡量基本面预期，使用BM代表市场预期。按照基本面预期和市场预期分别分成高、中、低三档，便构成了图5.6所示的九宫格。'
