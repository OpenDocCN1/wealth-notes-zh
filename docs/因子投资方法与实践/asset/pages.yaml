  md: "# 背后的出发点截然不同：\n\n+   - Hou-Xue-Zhang四因子模型来自实体投资经济学理论。从其数学模型出发推导出股票的预期收益率和过去的历史投资成反比。基于上述逻辑，Hou\
    \ et al.（2015）使用最近一个财年总资产变化率构建投资因子；\n- Fama-French五因子模型来自股息贴现模型。从其数学模型出发推导出股票的预期收益率和未来的预期投资成反比。Fama\
    \ and French（2015）基于Fama and French（2006）的实证结果，使用历史投资作为未来预期投资的朴素估计。基于以上逻辑，Fama\
    \ and French（2015）同样使用过去一个财年总资产变化率构建投资因子。\n\nHou et al.（2019b）一文通过理论和实证两方面质疑了Fama-French五因子模型中的投资因子：\n\
    \n（1）理论方面，股息贴现模型中的长期平均收益率和未来单期的预期收益率不同，后者才是多因子模型关注的重点。从定价理论出发，将股息贴现模型中的长期平均收益率替换为未来单期收益率可以得到如下关系：\n\
    \nM_t / B_t = [ E[ Y_{t+1} / B_t ] + E[ (dB_{t+1} / B_t) (M_{t+1}/B_{t+1} - 1)\
    \ ] + E[ M_{t+1} / B_{t+1} ] ] / [ 1 + E[ r_{t+1} ] ] \n(6.8)\n\n其中M_t和B_t分别为公司t时刻的市值和账面价值，Y_{t+1}是t+1期的净利润，dB_{t+1}是t+1期的账面价值的变化，r_{t+1}是t+1期的收益率。观察式（6.8），由于市净率M_{t+1}/B_{t+1}通常大于1，因此当给定其他变量仅允许E[dB_{t+1}/B_t]和E[r_{t+1}]变化时，由式（6.8）可知更高的E[dB_{t+1}/B_t]隐含更高的E[r_{t+1}]，即预期账面价值变化率和预期收益率成正比。此外，利用Fama\
    \ and French（2006）的结果使用总资产变化率替换账面价值变化率，就得到预期总资产变化率和预期收益率之间的正相关关系。基于上述论述，Hou et\
    \ al.（2019b）认为当使用未来单期收益率时，从股息贴现模型能够推导出未来预期投资和预期收益率之间的正相关关系，而非Fama and French（2015）提出的负相关关系。\n\
    \n（2）实证方面，Hou et al.（2019b）的计算结果显示，使用历史投资作为未来预期投资的朴素估计并不靠谱。\n\n结合以上两点不难发现，Fama\
    \ and French（2015）使用过去投资构建的投资因子其实是“负负得正”的结果，它阴差阳错地利用了实体投资经济学理论支持的过去投资和预期收益率之间的负相关；而非从股息贴现模型推导出的预期投资和预期收益率之间的负相关。这无疑撼动了Fama-French五因子模型中投资因子的根基，也质疑了该模型的学术地位。\n\
    \n客观地说，关于预期投资和预期收益率的关系，本书作者倾向认为Hou et al.（2019b）的解读比Fama and French（2015）的解读更合理。但上面这种因子竞赛还是让人感到不安。它似乎传递出一个信号：人们总能使用不同的金融学或经济学模型，推导出截然相反的结果。模型（6.8）与股息贴现模型（4.9）比较，其通过把长期平均收益率换成单期预期收益率而巧妙地移除了账面价值变化前面的负号，因此把“负相关”改成“正相关”。"
