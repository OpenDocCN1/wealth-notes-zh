  md: "价相关的各种理论、模型和计量经济学方法，其中多因子模型及其检验仅仅是一小部分。最为精妙的是，全书的论述都围绕着资产定价中的一个最基本的公式——无套利定价公式——展开，行文逻辑清晰而严谨。在这本书中，Cochrane教授将资产定价的宏大画卷以及不同理论之间的相互关联清晰地展现在读者面前。虽然书中有大量的数学推导，但Cochrane教授对数学公式的驾驭能力极大地降低了读者理解它们的难度。除此之外，这本书的配套教学视频也被芝加哥大学免费发布到互联网上。在课程中，Cochrane教授的讲授十分生动、到位，学习该课程也非常有助于理解各种定价模型背后的数学公式。这本书值得任何对资产定价感兴趣的人认真读、仔细读、反复读。\n\
