- pgno: 352
  md: 'Gordon（1962）模型，把股票预期收益分解成每股收益（E/P）加上预期盈利增长（g）：


    E[R]=E/P+g  （7.85）


    由于因子投资组合仅是一揽子股票，因此对价值因子多头和空头代表的价值股和成长股组合也分别如法炮制，分解投资组合的收益率：


    E[R_value]=E/P_value+g_value  （7.86）


    E[R_growth]=E/P_growth+g_growth  （7.87）


    利用上述分解，价值因子的收益率可以被拆解为：


    E[R_value]-E[R_growth]=(E/P_value-E/P_growth)-(g_growth-g_value)  （7.88）


    其中E/P_value-E/P_growth被称为价值价差（value spread），g_growth-g_value被称为成长价差（growth spread），价值因子的收益率由这两项同时决定。从定义不难看出，价值价差反映了该因子中价值组（多头）相对于成长组（空头）的便宜程度。当价值价差很高时，说明因子的估值相对较低。学术界将上述研究拓展到其他因子，使用因子多空两头的价值价差来衡量其估值水平。除E/P外，在实际应用中也常常使用BM等指标描述多空两头的估值，且在计算价值价差时，除了进行减法，有时会采用除法计算多空两头估值的比值。


    基于上述分析，在实际应用中可根据因子的估值高低来调整权重。令VS_kt代表因子k在t时刻的价值价差；VS_kt^mean、VS_kt^max及VS_kt^min分别代表该因子在过去36个月内价值价差的均值、最大值和最小值。根据Asness
    et al.（2017）的算法，因子权重为：


    ω_kt^raw=1+(VS_kt-VS_kt^mean)/(VS_kt^max-VS_kt^min)  （7.89）


    ω_kt= ω_kt^raw / Σ_{j=1}^K ω_jt^raw  （7.90）


    从以上定义不难看出，它反映的是因子当前的估值相对于过去36个月估值的位置，并据此可以调整因子权重。如果当前估值较高（价值价差小），则低配该因子；如果估值较低（价值价差大），则超配该因子。按因子的估值择时听上去合情合理，但Asness
    et al.（2017）的研究表明按因子估值择时的超额收益和价值因子本身在时序上的表现有很高的相关性。这意味着，一旦价值因子表现不好，那么按照估值择时也不会有好的表现。自2008年金融危机之后，美股市场的价值因子指数持续跑输市场本身，这无疑对按因子估值择时提出了巨大的挑战。


    # 7.5.2 按因子动量择时


