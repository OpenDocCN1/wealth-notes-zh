    boldsymbol{x}_t,\\boldsymbol{b}_0)\\boldsymbol{f}(\\boldsymbol{x}_{t-j},\\boldsymbol{b}_0)']\\\
    tag{2.117}$$ \n\n利用式（2.117），定义$S$如下：\n\n$$\\boldsymbol{S}\\equiv \\sum_{j=-\\\
    infty}^{\\infty} E[\\boldsymbol{f}(\\boldsymbol{x}_t,\\boldsymbol{b}_0)\\boldsymbol{f}(\\\
    boldsymbol{x}_{t-j},\\boldsymbol{b}_0)']\\tag{2.118}$$ \n\n它是一个$n$阶矩阵（在实际情况中，它可以用样本数据来估计）。式（2.117）的计算中之所以能把方差和协方差写成$E[XY]$的形式，是因为原假设下的总体矩条件约束$E[f(x_t,b_0)]=0$这里预期符号$E$没有下标$T$，表示总体期望。\n\
    \n需要强调的是，式（2.117）给出的是$\\operatorname{var}\\left(g_T\\left(b_0\\right)\\right)$，即样本矩$g_T$在真实参数$b_0$下的方差。而为了检验模型，人们关心的是$g_T$在估计$\\\
    hat{b}_0$下的方差，即$\\operatorname{var}(\\boldsymbol{g}_T(\\hat{\\boldsymbol{b}}_0))$。然而，一旦有了$\\\
    operatorname{var}\\left(g_T\\left(b_0\\right)\\right)=S/T$，计算$\\operatorname{var}(\\\
    boldsymbol{g}_T(\\hat{\\boldsymbol{b}}_0))$（以及$\\operatorname{var}(\\hat{\\boldsymbol{b}}_0)$）就变得容易了。首先看看$\\\
    operatorname{var}(\\hat{\\boldsymbol{b}}_0)$如何计算。将$\\boldsymbol{a}\\boldsymbol{g}_T(\\\
    hat{\\boldsymbol{b}}_0)=0$在$b=b_0$中进行一阶泰勒展开：\n\n$$\\boldsymbol{a}\\boldsymbol{g}_T(\\\
    boldsymbol{b}_0)+\\boldsymbol{a}\\frac{\\partial\\boldsymbol{g}_T(\\boldsymbol{b}_0)}{\\\
    partial b'}(\\hat{\\boldsymbol{b}}_0-\\boldsymbol{b}_0)=0\\tag{2.119}$$ \n\n式中一阶偏导数$\\\
    partial\\boldsymbol{g}_T\\left(b_0\\right)/\\partial b'$的分母中$\\partial b$右上角有一个转置符号。在计算偏导数时，$g_T$是一个$n$维向量（$n$个矩），而$b$是一个$p$维向量（$p$个参数），因此偏导数运算将会得到一个矩阵，这类运算属于矩阵微积分（matrix\
    \ calculus）。当转置符号出现在分母时，得到的偏导数矩阵是$n\\times p$矩阵，即每一行代表一个矩，这种排列方式被称作分子布局（numerator\
    \ layout）或雅可比布局（Jacobian formulation）。\n\n接下来，定义矩阵$d$如下：\n\n$$\\boldsymbol{d}\\\
    equiv E\\left[\\frac{\\partial\\boldsymbol{f}(\\boldsymbol{x}_t,\\boldsymbol{b}_0)}{\\\
    partial b'}\\right]=\\frac{\\partial\\boldsymbol{g}_T(\\hat{\\boldsymbol{b}}_0)}{\\\
    partial b'}\\tag{2.120}$$ \n\n式中第一个等价符号是$d$的定义，而第二个等式意味着在实际应用中用样本矩和$\\hat{\\boldsymbol{b}}_0$来计算$d$（Cochrane\
    \ 2005）。Hansen（1982）指出，当$T$趋于无穷大时，$\\partial\\boldsymbol{g}_T(\\hat{\\boldsymbol{b}}_0)/\\\
    partial b'$依概率收敛于$E[\\partial f\\left(x_t,b_0\\right)/\\partial b']$。这个一阶偏导数矩阵正是式（2.115）和式（2.116）中的$d$。用$d$代替$\\\
    partial\\boldsymbol{g}_T\\left(b_0\\right)/\\partial b'$代入式（2.119）并进行简单的代数运算：\n\
    \n$$\\begin{aligned}\n\\boldsymbol{a}\\boldsymbol{g}_T(\\boldsymbol{b}_0)+\\boldsymbol{a}\\\
    boldsymbol{d}(\\hat{\\boldsymbol{b}}_0-\\boldsymbol{b}_0)&=\\boldsymbol{0}\\\\\
    \n\\Rightarrow \\quad \\hat{\\boldsymbol{b}}_0-\\boldsymbol{b}_0&=-(\\boldsymbol{a}\\\
    boldsymbol{d})^{-1}\\boldsymbol{a}\\boldsymbol{g}_T(\\boldsymbol{b}_0)\n\\end{aligned}\\\
    tag{2.121}$$ \n\n对上式的两边直接求方差就可以得到$\\operatorname{var}(\\hat{\\boldsymbol{b}}_0)$。值得一提的是，式（2.121）右侧的"
