- pgno: 284
  md: '练神经网络时，常用的方法是通过最小化预测误差的L2范数形式惩罚项来估计权重参数。相比于前面介绍的决策树方法，神经网络的优势在于在每一步训练中可以同时更新所有的模型参数。但神经网络的高度非线性特征和巨大的参数量，使得其计算非常复杂，且需要更多的正则化处理以避免过拟合。为解决这些问题，随机梯度下降（stochastic
    gradient descent，SGD）方法常常被用来训练神经网络。它通过牺牲一定的精度换取计算效率的大幅提升。除此之外，诸多正则化方法也被引入来解决过拟合的问题，它们包括学习率收缩（learning
    rate shrinkage）、提前停止（early stopping）、批标准化（batch normalization）和集成学习（ensembles）。近年来，深度学习又有了进一步的发展，先后出现了深度前馈神经网络（deep
    feed-forward neural networks，DFN）、循环神经网络（recurrent neural networks，RNN）和长短期记忆模型（long
    short-term memory，LSTM）等。


    # 6.8.3 模型评估与实证研究


    如何评估模型是将机器学习算法应用于因子投资中的另一个重要问题。常用方法是分析预测模型的样本外可决系数R²_OOS，它的定义如下：


    ```

    R²_OOS = 1 - Σ_{i=1}^N (R_{it+1} - R̂_{it+1})² / Σ_{i=1}^N (R_{it+1} - R̄_{it})²  (6.32)

    ```


    其中R_{it+1}和R̂_{it+1}分别为资产i在t+1期的真实收益和预测收益率，R̄_{it}则表示t期资产i的历史平均收益。因此，式（6.32）衡量的是相对于历史均值预测，该模型是否有更小的样本外均方误差。当模型预测结果不如历史均值时，根据（6.32）定义的R²_OOS为负。


    Welch and Goyal（2008）和Campbell and Thompson（2008）使用（6.32）为依据检验了诸多变量对市场总体收益率的预测能力。然而对于预测个股收益而言，历史均值预测往往表现非常糟糕。因此，Gu
    et al.（2020）指出应用零代替历史均值预测作为预测基准。相应地，R²_OOS变为：


    ```

    R²_OOS = 1 - Σ_{i=1}^N (R_{it+1} - R̂_{it+1})² / Σ_{i=1}^N R_{it+1}²  (6.33)

    ```


    实证分析结果显示，若采用历史均值预测作为基准，则所有候选模型的R²_OOS都会上升大约3%。一般来说，预测模型的样本外R²_OOS超过0.5%就表明该模型是有价值的。因此，如果在评估个股收益预测模型时使用历史均值作为基准，很可能得到具有误导性的结论。


    除此之外，Gu et al.（2020）还进一步参照Diebold and Mariano（2002）构建了形如（6.34）的统计量，用来比较不同预测模型两两之间的相对表现。假设待评估的模型为模型1和模型2，该统计量定义为：'
