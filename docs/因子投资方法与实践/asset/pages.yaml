  md: '成为全球各国股票市场上实证资产定价研究的首选，而学术界后来推出的主流多因子模型也都建立在该三因子模型之上[2]。


    Lars Peter Hansen对实证资产定价的贡献主要体现在计量经济学理论的突破。除多因子定价模型之外，其他最重要的资产定价模型大概要数基于消费的定价模型（Consumptionbased
    CAPM, CCAPM）。Hansen（1982）提出的广义矩估计（Generalized Method of Moments Estimator, GMM）在检验CCAPM模型时起到了巨大的作用。由于GMM非常强大，因此也常被用来检验多因子模型。关于这点，Cochrane（2005）有过详细的介绍。


    与Eugene Fama认为市场是有效的截然不同，Robert Shiller则是行为金融学的代表性人物之一。Robert Shiller在其代表性论文Shiller（1984）中提出了著名的噪音交易者模型。这篇论文成了日后日益增长的行为金融学文献的起点。在Shiller（1984）的模型中，聪明投资者依股票的内在价值进行投资；而噪音交易者的存在造成了价格和内在价值出现了偏离；价格的过度波动来源于人们非理性行为造成的对基本面信息的过度反应。反观聪明交易者，虽然能对预期回报做出理性反映，但这种反映因受到自身财富的限制而并不充分。与传统金融学不同，行为金融学认为人并非完全理性的、会犯各种认知偏差，并从这个角度研究人的行为如何影响资产的预期收益率。如今，行为金融学也已经被广泛接受，不少学者从投资者行为的角度提出了错误定价因子（mispricing
    factors），构建了多因子模型。


    自20世纪70年代以来到今天，学术界在实证资产定价方面的研究已经走过了近半个世纪。除了上述三位代表性的研究之外，更有大量的学者持续地在这个领域做出杰出的贡献，这些非凡的学术成果为因子投资打下了坚实的基础。这些发现可以归结为理论方面和实证方面两大类。理论方面包括各种统计学方法，用来检验异象和因子，或者比较多的因子模型。以后者为例，主流的统计手段包括Gibbons
    et al.（1989）检验（简称GRS检验）、Huberman and Kandel（1987）的均值一方差张成（mean-variance spanning）检验以及Barillas
    and Shanken（2018）的贝叶斯方法。此外，随着近几年机器学习的迅猛发展，也有越来越多的学者将其应用到因子模型检验上。本书的第2章将系统而严谨地介绍研究因子投资时用到的各种常见统计手段。在实证方面，学术成果则主要指的是各种因子以及多因子模型。本书的第3章和第4章将分别介绍这些因子和多因子模型，并针对A股市场进行实证分析。和理论推进的按部就班不同，学术界在实证方面挖因子的努力是十分激进和狂热的。正如一枚硬币有正、反两面一样，这些实证结果一方面的确丰富了人们对股票收益率背后真实驱动的理解，但另一方面很多所谓的发现却仅仅是样本内过拟合的产物，对因子投资并无实质的帮助。


    # 1.2.2 研究现状


    如今，学术界已经挖出了超过400个因子（包括定价因子和异象因子）。在发表偏差和多重假设检验（multiple hypothesis testing）的不良影响下，绝大多数因子仅仅是数据窥探（data
    snooping）的产物。数据窥探是统计学术语，指的是学者们在查看数据之后才去提出假设，进行统计检验，以此达到找到能够获得显著超额收益因子的目的。学术界对于挖因子的狂热和浮躁的态度已经引起很多学者的警惕。2011年John
    Cochrane在美国金融协会主席演讲时用“因子动物园”（factor zoo）'
