  md: '在上述定义中，同样有两点值得注意。其中第一点和简约指数I的第一点相同，即简约指数II的取值也为负，其数值越接近零说明模型越简单，其数值越低说明模型越复杂。第二点则和简约指数I不同。在计算中，即使一个变量被用于模型的多个因子中，它也仅会被计算一次，而非多次。回顾Fama–French三因子模型和
    Stambaugh–Yuan四因子模型两个例子，前者包含市场、规模和价值三因子，使用了市值和BM两个变量，因此其简约指数II为-5。反观后者，它包括市场、规模、管理和表现四个因子，使用了市值和11个异象变量，因此其简约指数II为-16（=0-4-12）。


    表4.13列出了本章介绍的七个多因子模型的两个简约指数。为了考察模型复杂度和模型解释力度的关系，Lin Sun使用CAPM以及上述模型检验了34个异象，并以0.05显著性水平下异象个数作为模型解释力度。图4.9绘制了显著异象个数和简约指数的关系。


    从图4.9中可以清晰地看到，随着模型复杂度的提升（表现为简约指数I或II的取值更小），模型的解释力度上升（体现为0.05显著性下的异象变少）。这个结论符合预期，它也再次强调了不同因子模型之间的好坏并无定论。人们总能通过增加模型复杂度来提升模型（样本内）的解释效果，因此需要在模型复杂度和样本内的解释力度之间取舍。在简约法则的指导思想下，一个优秀的多因子模型应通常有较少因子，此外构建这些因子所需要的变量个数也不应该太多，而使用者则应该尽可能搞清楚每一个因子背后代表的风险。6.2.3节将进一步阐述不同多因子模型之间的比较。


