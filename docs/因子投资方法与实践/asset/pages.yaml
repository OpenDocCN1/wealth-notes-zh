  md: '# 6.7 因子投资难以取代基本面分析


    在因子投资中，很多因子是以财务报表中的会计学指标作为变量来构造的，比如BM、ROE等，它们被称为基本面因子。定量使用这类风格因子进行的基本面投资则被称为基本面量化投资（quantamental）。随着因子投资被广泛接受，基本面量化投资也已深入人心，在华尔街大行其道。基于某些财务指标以及投资组合优化的手段，大量基于简单规则的选股策略被发明出来，它们被视为继承了基本面分析（fundamental
    analysis）的衣钵。另一方面，因子投资的普及造就了数不胜数的Smart Beta ETF产品，其中绝大部分或多或少都会使用基本面因子。这些低成本ETF产品让普通投资者享受因子投资的同时，也推波助澜了基本面分析的“因子化”。面对如此影响深远的变化，华尔街日报不禁高呼“宽客占领华尔街”。


    随着使用因子来执行的基本面量化投资的影响日益深远，也有学者表达了担忧。其中代表性的观点是，仅使用财报中的各种指标来构建因子这种相对“简单粗暴”方式并非基本面分析的合格代替品。基于财务数据、使用排序法构建因子的手段仅仅是对证券内在价值（intrinsic
    value）的朴素估计，存在很大的误差。该观点背后的代表人物正是以研究盈余操纵而闻名的Richard Sloan教授。


    2017年，Sloan教授应美国会计协会主席邀请作为当年年会的演讲嘉宾，做了 一篇题为Fundamental analysis redux（基本面分析的重生）的报告（后发表于Sloan
    2019）。在报告中，他认为学术界越来越忽视基本面分析的重要性，而是倾向于用有限个简单的财务指标构建因子模型来代替前者。基于因子的基本面量化投资很容易忽视掉财报中的重要信息，且这些指标的数值反映的很可能是失真的会计数据（上市公司充分利用会计准则来产生会计报表）而非某种能够实现盈利的错误定价机会。那么，使用基本面因子进行投资是否能够取代基本面分析呢？本节就来回答这个问题。


    接下来的6.7.1节和6.7.2节首先简要回顾基本面分析和基本面量化投资的简要历史。6.7.3节通过一个例子说明基于因子的基本面量化投资无法取代基本面分析。最后6.7.4节做更深入的讨论。


    # 6.7.1 基本面分析


    基本面分析源自Graham and Dodd（1934）这本著名的Security Analysis（证券分析）。基本面分析旨在通过定量和定性分析与上市公司相关的经济和金融数据来衡量证券的内在价值。基本面分析更是直接催生了金融分析师这个职业。1937年，纽约证券分析师协会成立，并于8年后推出了The
    Analysts Journal。1947年，美国一些地方的证券分析师协会合并，成立了第一个全国性的金融分析师协会'
  merge: -1
  img_proc: true
- pgno: 274
  md: '（National Federation of Financial Analysts Societies）。随后，该协会更名为金融分析师联合会（Financial
    Analysts Federation），The Analysts Journal也更名为Financial Analysts Journal。1959年，特许金融分析师协会（Institute
    of Chartered Financial Analysts）成立并开始举办特许金融分析师（Chartered Financial Analysts）考试。最终，FAF和ICFA合并组成了如今家喻户晓的CFA协会。


    随着金融分析师行业的发展，在上世纪70年代前后，基本面分析主宰了华尔街。在机构方面，有像富达投资（Fidelity）这样的巨头使用严格的基本面分析来推行它们的业务；而在投资者方面，有像Warren
    Buffet和John Neff这样的明星作为基本面分析的拥gypte。此外，CFA协会在其课程设置上也把基本面分析作为在重中之重。然而就在同期，随着学术界在金融领域的迅速发展，一些变化悄然发生了。


    自20世纪50年代开始，现代投资组合理论、CAPM、有效市场假说以及期权定价相继被提出，奠定了金融学的基础。而它们之中，对基本面分析造成最大冲击的当属有效市场假说。如果市场是有效的，那么价格已经很好地反映了证券的内在价值。因此，除非分析师有新的消息，或者对已有消息有新的解读，否则是无法通过已有财报找到错误定价的。虽然有效市场假说自问世以来便伴随着争议，但它依然作为市场第一范式牢牢统治了学术界的课堂。以Bodie
    et al.（2017）这本投资学“圣经”[2]为例，其写作理念就从一定程度上支持了有效市场假说作为教学的第一范式，因此仅使用了很少的篇幅介绍基本面分析，而将更多的章节留给投资学中的其他内容。80年前，Graham
    and Dodd（1934）这本Security Analysis用了15章的内容介绍基本面分析，而如今在Bodie et al.（2017）这本几乎商学院学生人手一册的经典著作中，仅用了1章介绍基本面分析，与之形成巨大反差的是，该书中有9章介绍投资组合管理、3章介绍资产定价、2章介绍有效市场假说，以及4章介绍衍生品定价。这种在学术界和教学中对于基本面分析的逐渐忽视潜移默化地影响了一代代新人，让基本面分析渐渐淡出了大众的视野。


    # 6.7.2 基本面量化投资


    本节回顾使用因子进行基本面量化投资的发展史。对于股票市场的定量分析很大程度上得益于20世纪60年代CRSP[4]推出了股票价格数据，让使用历史数据进行实证分析成为可能。有了数据的支持，学术界各显神通，先是对CAPM进行了检验并拒绝了它，而后又接二连三地发现了一个又一个的异象或因子。比如Fama-French三因子中使用BM变量构造的价值因子就是基本面因子中最著名的例子。


    随着学术界在挖掘异象的道路上越走越远，业界自然也没闲着。业界把学术界的研究成果很好地落地化，推出了许多风格指数。举例来说，1987年罗素投资（Russell）推出了最早的两个风格指数，分别对标价值股和成长股。这两个指数的构造方法用的正是BM变量——BM取值位于前一半的股票被放进了价值指数、位于后一半的股票被放进了成长指数。在这之后，标普道琼斯公司（S&P
    Dow Jones）、明晟（MSCI）等机构也推出了它们各自的风格指数。


    最初，推出这些指数的目的是用来评估主动基金经理人的业绩，然而不久之后，复制这些指数的基金便应运而生，其中的代表是大名鼎鼎的先锋集团（Vanguard）。1992年，先锋推出了第一支价值指数基金和第一支成长指数基金。'
