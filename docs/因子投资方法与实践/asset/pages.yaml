  md: '时，$\hat{b}_K$就是因子$K$的收益率。为了因子收益率的估计更稳定，所以要求不同的因子之间尽量满足正交化。举例来说，在Barra的中国市场多因子模型中，非线性市值因子和市值因子之间进行了正交化处理。


    在本节的最后再介绍一个有意思、也有用的特性。在格拉姆—施密特正交化过程中，任何一个解释变量均可以被选为最后一个，然后根据连续正交化方便地求出它的回归系数。这意味着如果有20个解释变量，需要进行20次上述操作。是否有脸么办法仅通过进行一次连续正交化就求出所有的回归系数$\hat{b}_k$（$k=0，1，…，K$）呢？答案是肯定的。


    假设按照某给定顺序$x_0，x_1，…，x_K$依照（2.92）进行连续正交化过程，得到$z_0，z_1，…，z_K$。对于排在最后一位的解释变量如下关系$\hat{b}_K
    = \langle z_K,y \rangle / \langle z_K,z_K \rangle$成立。由于$\hat{b}_K$是解释变量$x_K$的回归系数，因此$\hat{b}_K
    x_K$就是$x_K$所解释的$y$的部分。如果从$y$中剔除$\hat{b}_K x_K$，并把得到的$y-\hat{b}_K x_K$作为被解释变量，用剩下的$x_0，x_1，…，x_{K-1}$作为解释变量，则回归结果就和$x_K$无关了。在这个新的回归中，$x_{K-1}$就变成了最后一个被正交化的解释变量，其对应的正交向量为$z_{K-1}$。因此，$x_{K-1}$的回归系数就用$y-\hat{b}_K
    x_K$和$z_{K-1}$依照式（2.86）计算：


    $\hat{b}_{K-1}=\frac{\langle z_{K-1},y-\hat{b}_K x_K \rangle}{\langle z_{K-1},z_{K-1}
    \rangle}\quad(2.95)$


    以此类推，便可以按照$\hat{b}_K,\hat{b}_{K-1},…,\hat{b}_0$的倒序求解出多元回归中所有解释变量的回归系数的OLS估计$\hat{b}_j$（Drygas
    2011）：


    $\hat{b}_K=\frac{\langle z_K,y \rangle}{\langle z_K,z_K \rangle}\quad(2.96)$


    $\hat{b}_j=\frac{\langle z_j,y-\sum_{i=j+1}^{K}\hat{b}_i x_i \rangle}{\langle
    z_j,z_j \rangle},\;j=K-1,K-2,…,0\quad(2.97)$


