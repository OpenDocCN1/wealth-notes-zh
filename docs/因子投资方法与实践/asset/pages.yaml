  md: '得：


    $$\Sigma = \beta \Sigma_{\lambda} \beta'' + \Sigma_{\varepsilon} \quad (1.6)$$


    其中Σ（N阶矩阵）、Σλ（K阶矩阵）以及Σε（N阶矩阵）分别为N个资产的协方差矩阵、K个因子的协方差矩阵以及N个随机扰动的协方差矩阵。由于εi相互独立，因此Σε是一个对角阵。式（1.6）就是关于方差的模型。


    从学术界的立场来看，式（1.6）意味着因子必须和资产的协方差矩阵有关，而这也正是1.1.2节中关于因子需满足的两个必要条件中第一个条件的出处。值得一提的是，当下学术界流行的所有主流多因子模型（本书第4章会详细介绍）要么来源于金融学或经济学原理，要么来源于自行为金融学的启发，但它们都没有直接从式（1.6）传达的因子协方差矩阵和资产协方差矩阵的关系入手。一个多因子模型代表着资产超额收益的某种结构，因此一个好的模型应该尽可能解释不同资产收益率间的共性运动。这反映到式（1.6）上就是模型中因子的选择应使得βΣλβ′尽可能接近资产协方差矩阵Σ的非对角线元素。但无论是经典的Fama–French三因子模型（Fama
    and French 1993）还是当下热门的Hou–Xue–Zhang四因子模型（Hou et al.2015）等，均没有对此给予充分的考量。在最新的研究中，Pukthuanthong
    et al.（2019）指出了这种关联的重要性，并以此为依据提出了一个甄别真正因子的框架。可以预期，从式（1.6）出发找到真正的因子、构建多因子模型将会是学术界未来的一个研究重点。


    再来看看业界。业界对于式（1.6）的关注和学术界有所不同，而是基于风险控制这个非常现实的考量。在投资中，一个很重要的风险指标是投资组合的波动率。投资组合的波动率由其包含的资产在组合中的权重、资产收益率的方差以及资产收益率之间的协方差决定。因此，计算投资组合的波动率就必须知道资产之间的协方差矩阵。从数学上说，如果使用历史收益率序列计算样本协方差矩阵，那么历史数据的期数T需满足T≥N，否则用历史数据估算出的样本协方差矩阵就是不可逆的。当资产个数N很大时，要求T≥N是不切实际的。然而，如果把资产的收益率通过多因子模型转化为因子的收益率，则可以大大简化上述问题。


    在多因子模型中，因子的个数K往往远小于资产的个数，因此使用多因子模型分析资产收益率相当于一种降维处理。式（1.6）通过多因子模型把求解N阶的协方差矩阵巧妙地转化为求解K阶因子收益率的协方差矩阵。有了因子协方差矩阵，利用资产和因子收益率之间的线性关系就可以反推出资产收益率的协方差矩阵并进行风险控制，这种做法在投资实务中有巨大的价值。在海外的大机构中，使用多因子模型计算资产协方差矩阵并进行风险控制的有很多，但其中最著名的大概要数Barra多因子模型。以Barra最新一代的中国股票多因子模型CNE6为例，它使用1个国家因子、9个风格因子以及一系列行业因子来刻画A股市场上超过3000支股票的收益率，极大简化了股票协方差矩阵的求解。在过去好几代多因子模型中，Barra开发了一系列统计学方法，逐步提高了协方差矩阵估计的准确性。


    时序角度的另一个研究重点是因子择时。与截面角度只关心因子的预期收益率不同，在时序角度，人们关心的是因子收益率如何随时间波动。由因子的定义可知，因子代表了资产共同暴露的某种系统性风险，而长期大于零的因子溢价正是对该系统性风险的补偿。这说明每个因子的收益率在时间序列上是有波动的，有时收益高，有时则面临亏损；且不同因子的收益率在不同宏观经济周期对应的'
