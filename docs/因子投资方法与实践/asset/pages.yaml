  md: '刊应该鼓励学者们尝试“高风险”的研究项目。“高风险”意味着学者需要费时费力费钱以收集和处理数据，且得到的结论不一定显著。然而，这样的研究成果才是 最根本的，才是能推动金融学阔步向前的创造性工作。因子投资研究的前景深深地植根于学术界的研究和发表环境中。“因子动物园”的窘境也将会被改变。


