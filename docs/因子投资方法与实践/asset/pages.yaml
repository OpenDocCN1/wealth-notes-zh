    # 1. 是否剔除金融股


    金融行业（银行、证券和保险等）的公司，由于经营模式和会计科目与普通企业存在较大差异，在实证分析时剔除这类公司已经成为学术研究的惯例。然而，本书实证分析部分如没有特别说明，将保留金融行业。这么做的原因有三个：（1）本文涉及的大部分因子具有普适性，不涉及特殊会计科目带来的行业差异；（2）本书的定位偏理论和实践结合，金融行业里面有不少优质公司，从投资的角度来看保留会更优；（3）学术界经典的Fama
    and French（1993, 2015）在探'
