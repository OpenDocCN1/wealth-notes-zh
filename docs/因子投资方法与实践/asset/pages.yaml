    # 2.3.3 两类模型


    最初，Fama and French（1996）这篇著名的解读Fama and French（1993）三因子模型的文章指出，解释一支股票的收益应关注它和因子之间的时序回归系数，而非公司特征。举例来说，某个BM很低的公司的收益率如果和价值因子的相关系数很高，那么该公司应该被当作价值股，而非成长股。毫无疑问，使用时序回归$\hat{\beta}$作为因子暴露则是符合人们认知的，然而实证数据显示的却又是另一个故事。当使用个股作为测试资产时，以公司特征作为因子暴露则“完胜”时序回归得到的$\hat{\beta}$：前者能获得显著风险溢价，但后者却不行。


    以下从两个不同的角度思考时序回归$\hat{\beta}$和公司特征之间的差异：（1）日频收益率噪声较高，使用它进行时序回归得到的因子暴露存在较高误差，使得个股的因子暴露取值在时序上并不稳定。一旦因子暴露在时序上不稳定，就会导致在不同期进行截面回归时，该因子的表现就像随机因子一样，因而难以获得显著的溢价。（2）真实的因子暴露是未知的，而相比时序回归系数，公司特征是未知因子暴露更好的代理变量。基于A股的实证结果凹显示，当期的公司特征比最新时序回归$\hat{\beta}$更能预测下一期股票的收益率。这个结果可以从一定程度上解释为什么仅有公司特征为暴露的因子被定价，而使用时序回归$\hat{\beta}$为暴露的因子没有被定价。在某种意义上，它似乎说明公司特征是更好的因子暴露变量，但其背后的原因仍然值得继续深入探索。


    既然公司特征相比时序回归$\hat{\beta}$是更好的因子暴露，且只有以公司特征作为因子暴露代理变量的因子被定价，那么一个很自然的想法是使用截面回归计算因子收益率并以公司特征作为个股在因子上的暴露，从而也得到一种多因子模型。学术界管这种方法得到的模型叫作“截面多因子模型”。与之相对应的是自Fama
    and French（1993）沿袭而来的使用排序法计算因子收益率，并通过时序回归计算股票的因子暴露。这种模型被称为“时序多因子模型”。那么，在这两类模型中，谁能更好地解释股票预期收益率的截面差异呢？


    Fama and French（2020）回答了这个问题凹，其核心结论为，比起传统的“时序回归多因子模型”，“截面回归多因子模型”更能解释资产收益率的预期差异，即资产的定价误差更接近零。此外，当使用“截面回归多因子模型”时，因子暴露应使用时变破公司特征，而非恒定的公司特征（比如对于某公司，把它的某个特征'
