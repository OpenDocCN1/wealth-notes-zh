  md: '# 7.4 Smart Beta: 因子投资的捷径


    多因子模型（1.3）的核心是解释股票预期收益和因子预期收益之间的关系。利用这种关系，人们在投资中便能做到有据可依，有放矢，找到股票收益率背后的驱动力（即那些长期来看有溢价的因子）并通过暴露在这些驱动力上获取超额收益。


    以此为目标，专业机构投资者可依照7.1节到7.3节的内容，在投资组合优化的整体框架下进行主动投资，而在这个过程中多因子模型为专业投资者提供了一种量化工具。仍以账面市值比（BM）和特质性波动率（IVOL）为例，用它们预测收益率均能获得相对于市场指数的超额收益，即为优秀的收益率预测变量。主动管理人会以它们为出发点，经过收益预测、风险控制、组合优化等构建投资组合。但无论在这个过程中所涉及的数学模型或者运算多么复杂，最终的投资组合一定是以某种最优的权重利用了BM和IVOL预测收益率的能力。


    那么，对于不具备专业技能的普通投资者来说，是否意味着无法利用它们战胜市场呢？答案是否定的。


    为了回答这个问题，让我们换一下看问题的角度。虽然在主动管理人眼中，BM和IVOL是预测超额收益的变量，但在式（1.3）中，BM也同时被用来构建价值因子，而IVOL也同时被用来构建特质性波动率异象，因此只需通过投资组合排序法便能够轻松地构建它们的投资组合。通过投资这两个投资组合也就相当于利用了BM和IVOL预测股票收益率的能力。从这个意义上说，虽然主动管理通过复杂数学优化得到的投资组合和上述按排序法构建的投资组合中股票的权重会有区别，但它们在本质上并无差异。所以，哪怕不使用复杂的数学工具，普通投资者也可以通过投资有显著溢价的定价因子或异象因子的投资组合来获取超额收益。而这正是学术界关于多因子模型的研究成果对普通投资者的最大价值——学术研究揭示了那些能够获得显著溢价的定价因子和异象因子。


    当然，在实际应用中，投资者仍然会面临一些问题，比如学术界的因子投资组合都是多空对冲且资金量中性的理论型组合。由于实际中的各种限制，它们并不具备可投资性。因此，如何使理论中的因子投资组合落地成真正可交易的投资组合就是必须解决的问题，而其中的关键就是因子指数化（factor
    indexing）。与把多因子模型视作量化工具而进行主动投资不同，因子指数化的目标是把具有显著超额收益的因子，以高暴露、高可投资性和低成本为目标加工为投资组合[2]。依照业界的惯例，这种以因子指数化组合为标的投资才被称为因子投资（factor
    investing）。


    近年来，因子指数化的概念早已深入人心，越来越多的机构将因子指数化，'
