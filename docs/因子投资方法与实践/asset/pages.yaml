  md: '在上述推导中，式（7.22）右侧中间两项变为0，分别用到了式（7.20）和式（7.21）这两个条件设定。最后，式中∑_{i=1}^N s_i u_{it}是所有股票特质性收益的加权平均，由于它的值近似等于零，因此上述推导表明R_{M
    t}^e ≈ λ_{C t}。国家因子收益率近似等于市场组合的超额收益，意味着国家因子组合近似地等价于市场组合。这就是国家因子的本质。从数学上说，由于CNE5模型假设所有股票在国家因子上的暴露均为1，因此在截面回归时，国家因子实际上起到了截距项的作用。


    # 7.2.2 模型求解


    Barra模型的求解仅仅是在每个t期进行截面回归，通过WLS估计求因子收益率和特质性收益率，因此使用任何编程语言都可以方便求解。然而，正如2.2.3节所解释的那样，在多元回归求解因子收益率的同时也得到了每个因子的投资组合。与使用排序法构建的因子投资组合相比，多元回归得到的因子投资组合因其优秀的特征而被称为纯因子投资组合（pure
    factor portfolio）。搞懂纯因子投资组合的性质有助于更好地理解该模型。本节和7.2.3节将对此进行详细说明。本节首先来看模型的求解。


    Menchero and Lee（2015）给出了求解模型（7.19）的简要步骤。为了方便起见，将模型（7.19）用向量和矩阵表示。此外，为了简化数学表达，在本节的推导中略去时间下标t以及t-1。使用向量和矩阵，模型（7.19）变为：


    R^e = β λ + u  (7.23)


    式中β是N×K因子暴露矩阵：


    β = [ 1  β_1^{I_1}  …  β_1^{I_P}  β_1^{S_1}  …  β_1^{S_Q} ; 1  β_2^{I_1}  …  β_2^{I_P}  β_2^{S_1}  …  β_2^{S_Q}
    ; … ; 1  β_N^{I_1}  …  β_N^{I_P}  β_N^{S_1}  …  β_N^{S_Q} ] (7.24)


    令Ω为全部因子的纯因子投资组合权重矩阵，即它是K×N矩阵，在第k行为因子k的纯因子投资组合中所有N支股票的权重。由于使用了WLS估计，因此在求解因子收益率以及纯因子组合时，需要指定回归权重矩阵（regression
    weight matrix）。为此，Barra模型假设个股特值性收益率的方差和其市值平方根成反比，并选择了如下回归权重矩阵W：'
