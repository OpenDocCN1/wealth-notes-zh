  md: "平均收益较高，企业经理也会择机利用高估值进行股权融资，从而有较多公司进行IPO。反之，当投资者情绪较为低迷时，新股表现相对较差，企业IPO活动也会减少。\n\
    \n⑤Baker and Wurgler（2000）指出总体股权融资占比可以预测未来的市场收益。较高的股权融资占比预示着较低的股票市场未来收益。\n\n⑥发放股利的公司，往往是大市值且增长较缓慢的公司，成长股则往往较少发放分红。投资者情绪高涨时，投资者往往会更关注那些具有极佳成长前景的股票，因而股利溢价同投资者情绪负相关。\n\
    \n```\nSENTIMENT_t = -0.241 × CEFD_t + 0.242 × TURN_{t-1} + 0.253 × NIPO_t\n \
    \          + 0.257 × RIPO_{t-1} + 0.112 × S_t - 0.283 × P_{t-1}^{D-PD}     (6.18)\n\
    ```\n\n这个指标具有很好的性质。首先，式（6.18）式右侧每一个指标前系数的符号都与理论蕴含的一致。其次，该主成分可以解释49%的样本方差，具有很好的代表性。另一方面，该指标的一个潜在问题是人们难以区分投资者情绪和经济周期的影响。为此，Baker\
    \ and Wurgler（2006）进一步使用多个反映经济周期的变量作为解释变量，投资者情绪基础指标作为被解释变量，通过回归取残差实现中性化处理，并最终对残差的协方差矩阵提取主成分因子作为排除经济周期影响之后的投资者情绪。这样便剥离了宏观经济对指标的影响，得到新的投资者情绪\
    \ SENTIMENT⊥表达式为：\n\n```\nSENTIMENT_t^⊥ = -0.198 × CEFD_t^⊥ + 0.225 × TURN_{t-1}^⊥\
    \ + 0.234 × NIPO_t^⊥\n                + 0.263 × RIPO_{t-1}^⊥ + 0.211 × S_t^⊥ -\
    \ 0.243 × P_{t-1}^{D-PD,⊥}     (6.19)\n```\n\n与SENTIMENT_t一样，式（6.19）式右侧每一个指标前系数的符号也与理论蕴含的一致。此外，对于这些被经济周期变量正交化后的情绪指标，它们的第一主成分能够解释53%的样本方差。\n\
    \n在近年来关于投资者情绪的研究中，式（6.18）和式（6.19）所示的指标得到了广泛的应用。然而，Huang et al.（2015）指出该主成分分析方法存在潜在问题[4]，并提出了利用偏最小二乘法（PLS）这种机器学习方法来估计投资者情绪。新的投资者情绪指标在样本外的预测能力显著优于Baker\
    \ and Wurgler（2006）的方法。\n\n# 6.4.2 投资者情绪与异象表现\n\nBaker and Wurgler（2006）使用根据（6.19）计算的指标，探讨了投资者情绪如何影响常见异象的表现。他们按照SENTIMENT⊥将样本逐月分为情绪高涨（high\
    \ sentiment）和低迷（low sentiment）时期，考察在高涨和低迷时期异象表现及差异。一般来说，乐观的投资者通常被认为会更偏好上市时间较短、市值较小、增长较快的投机性股票。相反，保守型投资者会更偏好较为成熟的大盘股。这类股票的增长通常更缓慢，估值也较低。理论上，在投资者情绪高涨时期，乐观的投资者大量买入投机性股票，将它们的价格推到过高的水平，导致其未来预期收益率降低。相反，当投资者情绪低迷时，投机性股票的表现反而会更好。通过排序法检验，他们通过美股数据证实了上述猜想。Baker\
    \ and Wurgler（2007）也对此进行了精彩的总结。"
