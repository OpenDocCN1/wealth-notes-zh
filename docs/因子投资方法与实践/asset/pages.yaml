    # 8. 单季度数据


    每年12个月可以分为四个季度，每个季度包含三个月份，单季度数据对每个季度作单独衡量。由于资产负债表是一个时点数据，因此单季度数据和对应的报告期数据相同；对于利润表和现金流量表，一季度数据和一季报相同，其余三个季度数据等于对应报告期数据减去环比报告期数据。如果环比报告期缺失，则无法计算单季度数据，单季度数据为空。具体对应关系见表3.9，计算流程图见图3.8。


