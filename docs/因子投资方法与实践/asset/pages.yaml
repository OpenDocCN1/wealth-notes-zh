    # 2.3.2 使用公司特征


    虽然使用IV估计量消除了EIV问题，但Jegadeesh et al.（2019）的研究同时指出，通过IV估计量得到的显著的因子收益率也可能源自被忽视的变量偏差，即在截面回归时没有使用构建因子投资组合时使用的公司特征作为控制变量。以规模和价值因子为例，排除变量偏差意味着在使用经回归得到的因子暴露β̂_i的基础上，同时加入了构建这两个因子的公司变量（即对数市值ln和BM）共同作为解释变量，进行Fama–MacBeth截面回归。实证结果显示，当排除变量偏差后，仅有公司特征作为因子暴露的因子被定价了，而以时序回归β作为因子暴露的因子并没有被定价。无论采用传统OLS估计量还是新提出的IV估计量，上述结论均成立。


