    et al.（2020）。


    # 6.2.3 因子大战


    正如6.2节开头就指出，近年来最新提出的多因子模型往往都以谁能解释的异常更多为评判依据。本节通过按照这些模型发表的时间先后顺序对它们进行梳理，并以此阐释因子大战之争。


    当Hou et al.（2015）提出Hou-Xue-Zhang四因子模型时，他们使用了80个异常作为测试资产，比较了新模型、Fama-French三因子模型以及Carhart四因子模型（由于Fama-French五因子模型同期发表，因此没有进行比较）。结论是新的四因子模型战胜了它们。2017年，Stambaugh
    and Yuan（2017）提出了Stambaugh-Yuan四因子模型。同样，新的模型也少不了和旧的做一番对比，而结论也不言自明。在2018年美国金融协会年会上，Daniel
    et al.（2018）首次提出Daniel-Hirshleifer-Sun三因子模型，该模型后来正式见刊，见Daniel et al.（2020）。在年会的报告中，Daniel
    et al.（2018）将该模型和主流模型进行了对比，除了考察因子模型解释异常及其他因子的能力外，也特别从模型复杂度角度进行了对比。在该篇报告的讨论环节，该模型曾被质疑无法解释规模因子，且没有将规模因子加入模型之内。不过笔者倒认为这反而是该模型的一个优点。该模型从行为金融学的理论出发提出了长、短两个时间尺度的行为因子。我们都知道，从行为金融学的理论是无法推演出规模因子的。因此，该模型不包含规模因子无可厚非；如果生硬地将其加入，反而更有数据窥探之嫌。只有当人们仅把目光局限于一个模型能否解释更多的异常，才会得出应该加入规模因子的结论。


    自2015年Hou-Xue-Zhang四因子模型发表后，由于其在理论上的创新和实证方面的优秀表现，获得了学术界的广泛关注。但是，随着诸如Stambaugh
    and Yuan（2017）和Daniel et al.（2020）等新的模型发表，上述四因子模型又被比了下去。在这种背景之下，q5模型横空出世。Hou et
    al.（2019b）的实证结果显示，q5模型能够解释最多的异常，因而战胜了其他所有的多因子模型。从现有的实证结果来看，出自实体投资经济学理论的q5五因子模型是现阶段“最强”的实证资产定价模型。当然，在不远的将来，学术界一定会搞出新的多因子模型来打败它。近年来，随着“因子动物园”的概念越来越深入人心，学术界对挖异常和因子的热潮有所减退，转而把研究重点放到了多因子模型效果的比拼上，形成了愈演愈烈的因子大战。然而，如果仅以能否解释更多异常，或者因子模型的因子之间能否相互解释为评判的标准，非要在众多模型中拼个“你死我活”、一分高下，到底又有多大意义？如果仅以“打赢”因子大战，而非推动人们对股票收益率背后的驱动力的理解为目标，使用不同的金融学或经济学理论提出一个“更好用”的多因子模型，这又有多大意义？


    在因子大战烽鼓不息之时，Fama and French（2018）这篇题为Choosing factors的文章却保持了“冷静”。该文拓展了GRS检验，提出使用模型所包含因子能够构成的最大夏普比率平方来比较不同的模型。这篇来自Eugene
    Fama和Kenneth French的文章虽然也是比较不同的模型，但它没有和别人的模型比，而是“自己和自己比”。该文比较了CAPM、Fama-French三因子模型、Fama-French五因子模型，以'
