  md: '对A股市场，《会计法》规定会计年度从1月1日开始，12月31日结束。一般要求上市企业一年定期披露四次财报，分别是一季报、半年报、三季报、年报①。财务报告在披露日期上没有严格要求，只要在规定的截止日之前披露即可。每个报告期都有一个标识，一般用“年份+季度末”的格式表示，如2018年三季报用“20180930”标识，2018年年报用“20181231”标识，具体定义见表3.2。


    # 表3.2 财务报告期


    | 报告期 | 起始点 | 结束点 | 常用标签 | 最晚披露日 |

    |---|---|---|---|---|

    | 一季报 | 1月1日 | 3月31日 | XXXX0331 | 同年4月30日 |

    | 半年报 | 1月1日 | 6月30日 | XXXX0630 | 同年8月31日 |

    | 三季报 | 1月1日 | 9月30日 | XXXX0930 | 同年10月31日 |

    | 年报 | 1月1日 | 12月31日 | XXXX1231 | 次年4月30日 |


    # 2. 财务报表


    财务报告主要由财务报表构成，财务报表包括“四表一附注”，即资产负债表、利润表、现金流量表、所有者权益变动表和附注，具体定义和特点见表3.3。①


    # 表3.3 四表一附注


    | 表名 | 含义 | 特点 |

    |---|---|---|

    | 资产负债表 | 反映企业在一定日期（通常为各会计期末）的资产、负债和所有者权益情况 | 时点数据 |

    | 利润表 | 反映企业在一定时期经营成果（盈利或亏损）和利润分配情况 | 区间数据 |

    | 现金流量表 | 反映企业资产负债表中各个项目对现金流的影响，分为经营、投资和融资三个类别 | 区间数据 |

    | 所有者权益变动表 | 反映企业期初到期末所有者权益的增减情况 | 区间数据 |

    | 附注 | 财务报表附注旨在帮助财务报表使用者深入了解基本财务报表的内容，是财务报表制作者对资产负债表、利润表和现金流量表的有关内容和项目所作的说明和解释。财务报表附注中的内容非常重要，主要包括：企业所采用的主要会计处理方法；会计处理方法的变更情况、变更的原因及对财务状况和经营业绩的影响；发生的非经常性项目；一些重要报表项目的明显情况；或其他事项；期后事项；其他对理解和分析财务报表重要的信息
    |  |


    # 3. 基准报告期


    在披露最新报告期财务报表时，会同时披露对应的某个历史基准报表。不同报表对应的基准报表不同，资产负债表对应上年年报。以白云机场为例，图3.3显示白云机场在披露2018年三季报时，会同时披露年初余额（2017年年报）。另一方面，利润表和现金流量表对应为上年同期值。图3.4展示了白云机场在披露2018年三季报现金流量表时，会同时披露上年同比报告期（2017年三季报）。'
