  md: '# 3.4 价值因子


    # 3.4.1 价值因子起源


    价值因子的含义简单而明确：相比估值较高的股票，那些估值较低的股票有着更高的预期收益率。与规模因子一样，关于价值因子的研究也起自20世纪80年代，并由Fama
    and French（1993）这篇雄文发扬光大，而以账面市值比（BM）为变量构建的价值因子也正式确立为系统性的因子。


    关于价值因子，Stattman（1980）是最早的相关研究之一，它发现BM较高的公司，股票预期收益也显著更高1。除BM之外，其他一些估值指标也被拿来研究和股票预期收益率之间的关系。Basu（1983）指出盈利市值比（EP）有助于解释股票收益，而Jaffe
    et al.（1989）基于1951至1986年间的长期数据进一步研究确认EP对股票未来收益有显著的正面影响。Bhandari（1988）则发现杠杆率2较高的企业有着显著的超额收益。而作为集大成者，Fama
    and French（1992）的结论稍有不同，他们基于排序法和Fama–MacBeth回归方法的研究指出，单独来看BM和EP都有显著为正的风险溢价，但当同时控制它们和规模后EP不再显著，表明EP的风险溢价可能只是其同规模和BM的相关性带来的虚假效应。Fama
    and French（1995）提供了支持BM同股票未来收益相关的进一步证据，发现较高的BM预示着持续较差的盈利表现，而较低的BM则预示着持续较好的未来盈利。Fama
    and French（1992）基于可比性等原则剔除了金融企业，但Barber and Lyon（1997）的研究发现同样的关系对金融企业也成立。除了解释股票预期收益的截面差异，Pontiff
    and Schall（1998）的研究表明BM也有助于预测市场指数（如标普500指数和道琼斯工业指数3）的未来收益率。


    价值因子在其他市场的实证证据也非常丰富。Chan et al.（1991，1993）和Daniel et al.（2001）发现日本股市存在显著的价值效应，以BM为代表的价值变量对股票收益有显著的预测能力。Charitou
    and Constantinidi（2003）和Clubb and Naffi（2007）则提供了BM在英国市场显著的证据，后者更是指出，除了当期BM，预期BM也对英国市场的股票收益有显著的解释力。此外，Aras
    and Yilmaz（2008）和Cakici et al.（2013）分别检验了12和18个新兴市场并发现了显著的价值效应。当然，实证资产定价研究中的“扛把子”Eugene
    Fama和他的搭档Kenneth French也不会缺席这个重要主题。他们的两项研究Fama and French（2012，2017）表明在北美、欧洲和亚太地区都存在显著的价值效应，且在日本之外的区域，价值效应随着股票市值增大而变弱。Asness
    et al.（2013）则更进一步，研究了8个不同的国家和股票、债券、商品及外汇等不同资产，并指出在不同国家、不同资产中广泛而持久地存在显著的价值效应。最后，也有不少研究4提供了价值因子存在于A股市场的证据。'
