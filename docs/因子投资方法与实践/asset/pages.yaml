    | F-Score | F-Score 在 q 和 q⁵ 模型下均没有显著的 α；其多空对冲组合对盈利因子有显著正暴露，同时对市场组合和规模因子有较显著的负暴露。由于盈利能力是
    F-Score 的一个重要维度，因此上述风格分析结果符合预期 |

    | 神奇公式 | 神奇公式在 q 和 q⁵ 模型下均没有显著的 α；它对于盈利因子有高度显著的正暴露，而对于市场组合有显著的负暴露。由于神奇公式的两个维度都与盈利能力有关，因此它对盈利因子有显著的正暴露符合预期。除此之外，神奇公式对
    q⁵ 模型中的预期投资增长因子也有显著的正暴露，因此 q⁵ 模型比 q-因子模型能够更好地解释神奇公式策略 |

    | 质量因子 | 质量因子在 q-因子模型下能够获得显著的 α，但在 q⁵ 模型下能够很好地解释其收益率。从风格暴露来看，质量因子对 q⁵ 模型中的盈利和预期投资增长因子有显著的正暴露，对市场组合、规模和投资因子有显著的负暴露。考虑质量因子由盈利、成长、安全性等多个维度复合而成，上述风格暴露与其构造逻辑相一致
    ® |

