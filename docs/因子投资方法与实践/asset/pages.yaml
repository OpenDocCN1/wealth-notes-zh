- pgno: 254
  md: '假设提出了三大挑战。从行为金融学的视角来看，市场似乎不是有效的。但另一方面，在人们的认知中，市场确实很难被打败。从这个意义上说，市场似乎又是有效的。如何理解这种分歧呢？


    Statman（2018）将行为金融学和有效市场假说融合在一起，提出了行为有效市场的概念，解决了上述矛盾。该文认为有效市场假说其实包含了两层含义，只有把它们剥离开来才能充分、合理地探讨市场的有效性。这两层含义分别为“价格等于价值”假说和“市场难以被战胜”假说。仔细体会一下行为有效市场的两个层面不难发现，它们完美的对应着行为金融学的两大支柱。首先，由于心理学造成的投资者的行为偏差和套利限制，市场中的价格有可能偏离价值而无法被修正，因此“价格等于价值”这层含义通常是不成立的。另一方面，对于仅仅掌握公开信息的普通投资者而言，市场又是难以战胜的。唯有那些有私有信息优势的投资者才有可能战胜市场。然而，认知偏差造就了一波又一波、前赴后继的噪声交易者，并给他们造成了能够战胜市场的幻觉。因此“市场难以被战胜”假说是成立的。


    市场中有句老话叫“天下没有免费的午餐”，它表示想要战胜市场是那些有非常困难的。一起来，人们对它的理解是“价格等于价值”才导致了“没有免费的午餐”。然而，从行为金融学中的套利限制可知，即便是非有效的市场中，“没有免费的午餐”也是成立的，但是却不能也不应该从它反推出“价格等于价值”。这二者的关系就如同数学中的原命题和逆命题的关系。即使能够从A推出B（原命题），也不意味着逆命题（从B推出A）是成立的。正因如此，Statman（2018）提出了市场有效的两层含义，并将其命名为行为有效市场。


    1986年，Fischer Black在美国金融协会年会的主題演讲中发表了题为Noise（噪声）的报告（Black 1986）。在这次影响深远的演讲中，他抛出以下经典言论：“噪声的存在使得市场不够有效，然而它同样会阻止人们利用这种无效性。”[4]也许这句话就是对行为有效市场包含的两方面内容的最好总结。


