    et al.2018采用的实证区间），q-因子模型和六因子模型都能够较好地解释巴菲特在此期间的业绩，且伯克希尔哈撒韦股票对盈利和投资因子都有显著的正暴露。但当把实证区间拓宽到1968年至2018年时，使用不同模型的风格分析结果出现了差异，且所有模型均无法很好地解释巴菲特的表现。当采用q、q5及六因子模型时，巴菲特的超额收益率分别为每月0.64%（t-值为2.44）、0.77%（t-值为2.67）以及0.61%（t-值为2.08）。关于为何上述模型均无法很好地解释巴菲特的表现，其背后的原因可能有二。第一个原因可以归因于巴菲特的投资分析能力，例如对公司预期盈利和增长有更好的估计。第二个原因则可能与因子模型的不完善有关。像员工培训、研发、管理质量等与企业未来盈利和成长性密切相关的因素可能对解释巴菲特的选股结果至关重要，但它们均由于难以度量而未被这些模型考虑。


    上面这个例子传递出来的另外一个信息是，人们总可以挑选不同的多因子模型对目标投资组合或资产进行风格分析。以上述q5和六因子模型来说，无论均值一方差张成检验还是GRS检验都无法分出“胜负”，它们都能提供对方无法包含的信息，都是在风格分析实践中有用的多因子模型。风格分析可谓是从一个新的角度来看待和应用多因子定价模型，不仅关注资产或投资组合相对于定价模型的α显著性，还考察其对哪些风格因子有显著的暴露，以及风格暴露是否符合逻辑推论。科学的风格分析让人们不仅可以更好地理解资产和投资组合的表现，也能对其收益来源有更为透彻的理解，并对其未来表现形成更合理的预期。


