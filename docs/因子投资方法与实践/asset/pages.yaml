  md: '在对投资因子进行实证中，本书采用上市公司年报中披露的总资产计算总资产（同比）增长率，以此作为排序变量构建投资因子。计算中之所以选择年报，是出于A股上市公司财务报表披露的情况考量。A股上市公司从2002年开始披露季度资产负债表和利润表，从2003年开始披露季度现金流量表。如果选择季报数据计算同比增幅，则会在2003和2004年前后出现大量上一年同期数据的缺失值，导致变量的数据覆盖度在这两年大幅减少。为避免这个问题对实证结果造成影响，故而采用年报数据进行计算。在剔除黑名单及异常数据之后，总资产增长率的数据覆盖度如图3.26所示。


    每月末将股票按总资产增长率的取值从低到高分成10组，记为Low、2、......、9及High组。表3.25给出了这10个投资组合在整个实证期内描述性统计。值得注意的是，这10组的ROA（总资产收益率）随着总资产增长率的增加而单调递增，即总资产增长率越高的公司，其平均ROA也越大。对该现象的解释如下。由会计学原理可知，总资产等于股东权益加负债。假设在不分红的情况下，上市公司总资产的增加由利润和负债的变化决定。数据显示，A股上市公司的平均负债率的时间序列在2006年之后非常稳定（全部A股上市公司的平均负债率在85%左右）。因此，如果进一步假设负债不变，则总资产的变化就由利润决定。这就不难理解为什么总资产增长率低的公司，ROA也低。此外，这10组的总市值呈现出倒U字形，即位于两端的低投资组和高投资组的平均市值低于位于中间的其他组。


