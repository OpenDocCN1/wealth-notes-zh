- pgno: 382
  md: '对时间轴的统一处理，就可以把所有个股的同类事件在截面上取平均并观察整体的效果。这可以消除个股对事件的特质性波动，从而考察事件对股票异常收益率的平均影响。这无疑也是最具创造力的一点。


    通过上述方法，Fama et al.（1969）研究了拆股（stock split）事件对股票收益率的影响，并发现股票的异常收益在事件发生后没有显著异常回报，事件所包含的信息已经很好地反映在价格之中，从而证明了市场的有效性。而以上方法论中的三点创新也迅速开辟了一个子领域——事件分析。如今，事件分析在经济和金融领域都有广泛的应用。


    根据以上关于有效市场假说和事件分析的研究结果，人们对资产价格和收益率在短期内的不可预测性达成了共识。这是20世纪70年代，人们对资产价格理解迈出的第一步。


    # 3 过度波动导致长期可预测


    下面来看看资产价格和收益率在更长的时间周期内能否被预测。这是20世纪80年代的主要研究课题之一。而在这一领域的代表性人物则是Robert Shiller，他做出了大量开创性的贡献。


    Shiller的第一个贡献在于提出了方差比检验（variance ratio tests）。Shiller（1979，1981）分别以债券和股票作为资产，研究了它们短期波动和长期波动的方差差异。以股票为例，在1980年以前，学者们倾向于认为股票的长期波动取决于和未来现金流相关的基本面信息的波动，直到Shiller（1981）发表，这个观点也因检验结果而被颠覆。该文的题目
    Do stock prices move too much to be justified by subsequent changes in dividends?（相对于未来股息的变化来说，股价的波动是否过高了？）——也和它的内容一样具有颠覆性。


    我们仍然可以从 P=E[m x] 出发理解 Shiller 的发现。以股票为例，该无套利定价方程意味着股票今天的价格等于其预期基本面价格的现值，即未来每期现金流（对于股票，可以认为是股息）的折现值之和。令
    P*_{it} 代表股票 i 的未知基本面价值的折现值，它的变化来自未来股息（x）和随机折现因子（m）的波动。由 P=E[m x] 有：


    ```

    P_{it} = E_t[P^*_{it}]  (A4)

    ```


    由上式可知，预测误差为 P_{it}-P^*_{it}，该误差和所有历史信息（包括现在的价格 P_{it}）是不相关的。接下来，可以把 P^*_{it} 写成如下的形式（左右两侧完全是等价的）：


    ```

    P^*_{it} ≡ P_{it} + (P^*_{it} - P_{it})  (A5)

    ```


    利用误差项 P_{it}-P^*_{it} 和所有历史信息（包括 P_{it}）相互独立这个性质，对上式两边直接求方差可得：


    ```

    var(P^*_{it}) = var(P_{it}) + var(P^*_{it} - P_{it})  (A6)

    ```'
