  md: '除了约束条件，交易成本也是造成理论和实际结果有差异的重要因素。本节简要介绍交易成本模型。交易成本一般分为两种：显性成本和隐性成本，前者包括交易费用和买卖价差，后者主要指的是市场冲击成本。由7.3.4节的介绍可知，通过添加换手率约束可以间接控制交易成本，尤其是降低交易产生的费用。然而，由于过高的交易成本会侵蚀收益，因此更加精细的方式是通过对交易成本建模，将其作为惩罚项加入目标函数之中，实现收益和成本的均衡。两种常见的成本模型包括线性成本函数和二次成本函数。


    # 1. 线性成本函数


    线性成本函数简单直接。假设股票 i 的成本为权重变化的固定比例 c_i，因此投资组合的成本函数为：TC(ω) = Σ_{i=1}^N c_i |ω_i -
    ω_i^0|  (7.79)


    # 2. 二次成本函数


    线性成本函数虽然简单，但它假设每支股票每笔交易的成本比例均一样，并没有考虑对市场的冲击程度，因此不够精细。二次成本函数，顾名思义，它在线性成本函数的基础上引入一个二次项，用来反映交易权重变化越大冲击成本越高：


    TC(ω) = Σ_{i=1}^N c_i |ω_i - ω_i^0| + Σ_{i=1}^N d_i (ω_i - ω_i^0)^2  (7.80)


    以上仅简要介绍了这两种最简单的交易成本模型，对它们更详细的说明可参考相关文献（如Lobo et al.2007, Kopman and Liu 2011,
    Hedayati et al.2018, Chen et al.2019等）。当选定了成本模型TC(ω)之后，将其作为惩罚项代入目标函数。令 max_ω f(u,
    Σ, θ, ω) 表示原始目标函数，则考虑了成本之后的目标函数变为：


    max_ω f(u, Σ, θ, ω) - γ_TC TC(ω)  (7.81)


    式中γ_TC为交易成本的惩罚系数。使用式（7.81）所示的目标函数，再辅以必要的约束条件，通过优化问题求解可以获得最优的股票权重。


    [1]例如，风险模型包含通过过去12个月累计收益计算的动量因子，而收益模型中的动量变量则依照学术界惯例滞后了1个月，这种差异使得β_α和β_R中对动量变量的暴露很接近。


    [2]如果它确实没有风险，而是纯收益，那也不用惩罚了。'
