- pgno: 230
  md: '最后，Chordia et al.（2020）通过控制FDP为目标研究了如何修正时序回归得到的因子超额收益t-值以及Fama-MacBeth回归系数的t-值。在试图消除多重假设检验的影响时，除了选择控制伪发现概率的统计手段外，另一个必须回答的问题就是学术界到底一共研究了多少因子（称为研究的因子集）。他们认为Harvey
    et al.（2016）一文研究的因子仅仅是已经发表出来的（称为发表的因子集），而发表的因子集仅仅是研究的因子集的一个子集，因此基于这些因子分析多重假设检验对因子统计性的影响，实际上是低估了运气的成分，造成得到的3.0阈值有些保守。然而，学术界到底研究了多少其他因子是无从而知的。为此，Chordia
    et al.（2020）创造性使用模拟（simulation）方法推断出基于研究的因子集的统计特征如何消除多重假设检验的影响。该文指出，对于时序回归和Fama-MacBeth回归这两种常见检验手段，某个因子的t-值应至少为3.8或3.4才可能是真正有效的凹。不出意外的话，这两个阈值均超过Harvey
    et al.（2016）一文建议的3.0。


    # 6.1.6 先验的重要性


    在发表偏差的驱使和多重假设检验的影响下，很多挖出来的因子都是样本内过拟合的产物。如何从成百上千个因子中找到真正有效的呢？这就不得不提先验的重要性。先验来自人们对股票市场的客观认知，来自从经济学和金融学的规律总结出来的规律。先验知识允许人们对每个潜在的因子赋予一个先验概率——比如我告诉你按照股票代码首字母选股能获得超额收益，你一定会对它嗤之以鼻，因为如此选股没有科学逻辑支撑，先验概率非常低。使用先验概率，再结合检验的p-值就能得到因子是否显著的后验概率，这也是贝叶斯思想的一种体现。


    下面通过三个例子加深对先验的理解：（1）一位音乐家声称可以完美地区分莫扎特和海顿的乐谱，并连续成功地辨识了10张乐谱。（2）一个常年喝茶的老妇人声称可以判断出一杯奶茶里是先加奶还是先加茶，并连续成功地判断对了10杯。（3）一个酒馆老板号称酒精赋予他预测未来的神力，并连续猜对10次扔硬币的结果。在这三个例子中，如果原假设分别是音乐家无法辨识乐谱、老妇人不能识别茶和奶的加入顺序，以及酒馆老板不能预测扔硬币的结果，那么在原假设下，连续10次全部正确的结果的p-值是非常低的（远远低于0.001）。虽然这些结果均显著拒绝原假设，但它们带给人们的认知却截然不同，这时就需要借助先验的力量。对于第一个例子，先验知识告诉人们音乐家分辨乐谱理应易如反掌，因此先验信仰就是他能够成功，实验的结果只不过确认了这一点。在第二个例子中，人们则多少心存怀疑（先验），不相信老妇人能够成功，然而10次全对的结果让人们倾向于推翻自己的先验认知，即拒绝原假设，并认为她确实有这个能力。在第三个例子中，人们会认为这个人就是个大骗子（酒精怎么能够预测未来？），因此从心底完全不屑（先验）。在这种情况下，即便他猜对了10次，也不会推翻原假设（因为“酒精能够预测未来”这件事的先验概率太低了），而仅仅认为他是运气好罢了。从这三个例子能够看出先验在解读p-值时起到的作用，这就是贝叶斯思想的强大之处。


    利用先验，Harvey（2017）将传统的p-值嵌入到贝叶斯框架中，提出了贝叶斯p-值的概念，它是一个后验概率。贝叶斯p-值与先验概率和贝叶斯因素有关，后者是在原假设下观测到因子收益率的似然性与在备择假设下观测到因子收益率的似然性之间的比值。由于在备择假设中效用的概率分布未知，因此贝叶斯因素的取值有一个范围，该范围的下限就称为最小贝叶斯因素φ。它代表在贝叶斯框架'
