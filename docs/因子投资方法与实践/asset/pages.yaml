  md: '关于投资者情绪的研究分为两类。第一类研究关注股票预期收益的截面差异。从行为金融角度，将投资者情绪视作诸如动量、短期反转等因子和异象的根源。在这类研究中，投资者情绪为异象提供了理论基础，帮助人们更好地理
    解它们。这类问题仅关注异象为什么会出现，即股票的收益率在截面上为何会有不同，但并不关注异象本身在时序上的表现。与之对应的，另一类研究则将投资者情绪当作类似经济周期这样的指标，着重考察投资者情绪对总体市场收益以及异象表现的预测能力。关于前者，第6.3节已有详尽的讨论，因而本节的讨论将集中于后者。


    # 6.4.1 投资者情绪的度量


    要研究投资者情绪对未来收益的预测能力，首先需要度量投资者情绪。自20世纪80年代后期开始，相关研究逐渐兴起，而Baker and Wurgler（2006）是其中集大成者。该文采众家所长，利用了表6.2所示的6个细分指标，构建了一个综合性投资者情绪指标。


    Baker and Wurgler（2006）使用表6.2中的6个指标，通过两步法计算出投资者情绪。首先，选择这些指标t期和t-1期滞后项（一共12个变量），通过主成分分析提取它们的第一主成分构建出一个临时指数，它是前述12个变量的线性组合。接下来，对每一个指标，分别计算该指标当期和其滞后项与临时指数的相关系数，并挑出相关系数高的变量。举例来说，对于CEFD指标，当期项CEFDt与临时指数的相关系数高于滞后项CEFDt-1与临时指数的相关系数，因此CEFDt入选。这个过程将从全部12个变量中筛选出6个，每一个都是表6.2中指标的当期或滞后期项。在第二步中，使用挑选出的6个变量，并再一次通过主成分分析提取它们的第一主成分②，最终构建投资者情绪指标如下：


    # 表6.2 Baker and Wurgler（2006）投资者情绪细分指标列表


    | 指标① | 来源 | 定义 |

    |---|---|---|

    | 封闭式基金折价率（CEFD） | Lee et al. (1991) | 封闭式基金的净值同交易价格的平均差异② |

    | 扭交所股票的换手率（TURN） | Baker and Stein (2004) | （去趋势的）对数换手率③ |

    | IPO 公司数量（NIPO） | Ibbotson et al. (1994) | 当年 IPO 公司的数量 |

    | IPO 公司上市首日平均收益（RIPO） | Ibbotson et al. (1994) | 当年 IPO 公司上市首日收益的算术均值④ |

    | 股权融资占比（S） | Baker and Wurgler (2000) | 当月总体股权融资金额与股权融资和长期债券发行总额之比⑤ |

    | 股利溢价（PD-ND） | Baker and Wurgler (2004) | 发放股利的公司同不分红的公司的账面市值比（book-to-market
    ratio）的对数差⑥ |


    ①IPO 相关的两个指标为年度数据，其他四个指标为月度数据。


    ②封闭式基金往往存在大幅度的折价，且折价率波动非常剧烈。Lee et al.（1991）发现不同基金的折价率变化高度同步，这便是所谓的“封闭式基金折价之谜”。他们发现投资者情绪可以较好解释这一谜题，因而封闭式基金折价率可以作为投资者情绪的一种度量指标。


    ③当存在卖空约束时，投资者只会在对后市乐观（即情绪高涨）时较多参与交易，因而市场总体的换手率可以在一定程度上代表投资者情绪。此外，由于换手率序列存在指数趋势，Baker
    and Stein（2004）依据5年移动平均来去除原始序列中的趋势。


    ④Ibbotson et al.（1994）指出IPO 数量及新股的表现与投资者情绪密切相关。当投资者情绪高涨时，新股的'
