- pgno: 251
  md: '盈余惯性，学术界还有一些非常有意思的发现。DellaVigna and Pollet（2009）指出如果业绩公告出现在星期五，随之而来的盈余惯性现象会更显著。他们猜测由于星期五临近周末，投资者的注意力比平时更不足，更无法对业绩信息做出足够的反应，造成显著的盈余惯性异象。另外，Hirshleifer
    et al.（2009）发现当多家上市公司同时发布财报时，由于投资者无法处理同时涌现的多家公司的大量新信息（即有限注意力问题更严重），盈余惯性会更加显著。


    类似的，Barberis et al.（1998）从行为金融学出发提出了一个投资者情绪模型，认为投资者在面对上市公司新的财报消息时会受到保守主义和代表性启发法的影响，这会导致一些常见的异象。首先，当超出预期的盈利消息出现时，投资者因保守主义而愿意相信自己的先验判断，对这个信息反应不足。他们会对这个利好持怀疑态度、不情愿更新他们对于该公司基本面的认知，因此信息无法有效地反映在股价上。随着时间的推移，当该公司又逐渐出现新的盈利利好时，其股价才会慢慢对其新的基本面调整到位，而这造就了动量异象。


    其次，当好的盈利消息接二连三出现时，投资者会受到代表性启发法和小数定律信仰的影响，出现对股票的收益率以及代表公司基本面的现金流的过度外推（over-extrapolation），并将错误的外推用到对公司未来股价的预测上。一旦未来的盈利没有达到预期，就会引起他们的恐慌，造成股价的下跌，从而导致长期反转和价值异象。通过使用分析师一致预期数据，La
    Porta（1996）发现分析师在对公司长期盈利能力做预测时也会踏入过度外推的错误。该文使用上市公司未来五年预期盈利增长率为变量进行了研究。数据显示，预期增长率高的那些股票的未来预期收益率反而更低。Bordalo
    et al.（2019）对La Porta（1996）的发现进行了回顾和拓展。


    其他影响深远的研究成果还包括Daniel et al.（1998, 2001），他们研究的重点是投资者在处理私有信息时容易产生认知偏差。当投资者对于某个上市公司做了大量深入研究后，容易对自己的分析结果表现出过度自信。如果分析的结果认为该公司的基本面向好，投资者就会大举买入该公司的股票。此外，在这个过程中，确认偏误会让投资者在短期内仅仅关注与自己分析结果相一致的公共信息，而忽略掉意见相左的信息，从而造成动量和盈余动量等异象。当股价被推高后，如果接连出现基本面变差的信息，这时价格就会发生下跌修正，造成反转和价值异象。


    类似的，Hong and Stein（1999）通过提出一个统一理论研究了投资者的反应不足和反应过度，以及它们引发的短期动量和长期反转。和Barberis
    et al.（1998）以及Daniel et al.（1998）不同的是，该文假设市场中存在两类交易者：基本面交易者和动量交易者，并以这二者如何相互影响为视角进行了研究。基本面交易者根据信息进行交易，而动量交易者根据近期价格变化进行交易。该文进一步假设基本面投资者有一些私有信息，但无法从价格走势中感知出其他基本面交易者所掌握的信息。这导致信息的传播是缓慢的，造成投资者短期内反应不足，而动量交易者会利用这一反应不足而获利。但另一方面，当大量动量交易者采用相同的策略时，最终会引发长期投资者的过度反应以及价格的反转。


    # 2. 风险偏好偏差和市场异象


    将前景理论用于解释市场异象方面也有丰硕的研究成果。Barberis and Huang（2008）通过应用前景理论研究了资产收益率的偏度和未来预期收益率之间'
