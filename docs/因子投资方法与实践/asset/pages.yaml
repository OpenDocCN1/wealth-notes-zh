- pgno: 96
  md: '# 第3章

    主流因子解读


    除介绍因子投资的方法论之外，本书的另一个特色是针对A股进行严谨的、可复制的实证分析。这些实证分析分布于本章、第4章及第5章，分别以因子、多因子模型和异象为研究对象，使用第2章介绍的相关方法进行深度实证分析。


    然而，巧妇难为无米之炊，要做好实证分析，离不开高质量的原始数据，也离不开严谨的数据处理流程。在因子投资中，数据处理方面存在着很多坑。无论是未来数据的迷雾，还是不切实际的设定，都可能让人在兴高采烈后落入无尽的空虚。因此在针对A股进行实证研究之前，首先要把数据和计算因子的流程说清楚。本章的3.1节会系统地介绍这部分内容，包括数据来源、财务数据处理、量价数据处理和历史回溯的基本约定等。全书中所有的实证的数据处理都将遵循3.1节介绍的方法。


    在介绍完数据处理方法后，3.2节到3.8节将以A股为研究对象，深度解读学术界认可的主流因子，包括市场因子、规模因子、价值因子、动量因子、盈利因子、投资因子和换手率因子。除换手率因子外，其余因子均被包含在海外学术界最重要的多因子模型中，并得到了业界的广泛认可。把每个因子背后的来龙去脉讲清楚将有助于读者理解本书第4章介绍的这些多因子模型。虽然换手率因子尚未被纳入海外的模型中，但由于其在A股市的显著性和认可度，本章也将其加入讨论之列。


    在以下针对每个因子的论述中会同时关注因子的起源和成因。知前者能了解因子的发展演进，知后者则可以明白每个因子为什么会有显著的超额收益。长久以来，风险补偿都是解释因子溢价的最重要原因。然而，随着行为金融学的发展，越来越多的学者将投资者行为偏差作为解释因子溢价的另一个思路。因此在讨论因子成因时，会涉及部分行为金融学的内容。为了行文的紧凑，本章暂时不会对行为金融学进行展开论述，但6.3节将系统地阐述行为金融学和资产预期收益率之间的关系，供读者参考。在介绍完起源和成因之后，本书将对因子进行基于A股市场的深度实证。


    [1]例如假设能够买入一字涨停股票。'
