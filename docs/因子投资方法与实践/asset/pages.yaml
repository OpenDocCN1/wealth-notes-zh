- pgno: 229
  md: 'Holm（1979）方法，它们通过直接修正单一假设检验的$p$-值来降低其显著性。另外还有White（2000）的bootstrap reality
    check方法和Romano and Wolf（2005）的StepM方法等。由于控制FWER太过严苛，因此以它为控制对象不太适用于金融领域（Chordia
    et al.2020）。


    伪发现率（FDR）的定义为FDR≡E[F₁/R]，即F₁/R的期望。在给定的水平δ下控制它可以表达为：


    E[F₁/R]≤δ  (6.3)


    从定义可知，控制FDR允许F₁随R增加，它控制的是伪发现的比例，这是一种相对温和的方法。这意味着，当以FDR代替FWER为控制目标时，会有更多的原假设被拒绝。这其中的代表算法有Benjamini
    and Hochberg（1995）和Benjamini and Yekutieli（2001）。这类算法对检验统计量之间的相关性不敏感，适应性更强。


    最后，控制伪发现比例（F₁/R）的目标是限制F₁/R超过某给定阈值γ的概率不高于显著性水平αₛ，表示为：


    prob（F₁/R≥γ）≤αₛ  (6.4)


    从定义不难看出，它和FDR类似。常见的算法有Romano and Wolf（2007）和Romano et al.（2008）。以控制上述三种统计量为目标的算法在统计学中得到了广泛的应用。对于金融领域，一般认为以控制FDP和FDR为目标是更好的选择，因为FWER不适合金融领域。Farcomeni（2008）以及Romano
    et al.（2008）对不同算法进行了综述。近年来学术界越来越重视多重假设检验问题对因子显著性的影响，在这方面也诞生了很多优秀的研究成果。


    Harvey et al.（2016）研究了学术界发表的316个因子，并以控制FDR为目标来应对多重检验假设的影响。他们研究发现只有在单一假设中原始t-值超过3.0（而非人们传统认为的0.05的显著性水平对应的2.0）的因子才是有效的。根据这一结果，Harvey
    et al.（2016）指出在上述因子中，伪发现比例为27%。不过该文也同时指出，3.0的阈值其实是非常保守的。类似的，Harvey and Liu（2015）利用同样的思路研究了如何排除多重假设检验对策略夏普比率的影响。一般的经验认为，策略在实盘中的夏普比率应该是其在回测期
    anchored? 夏普比率的50%。Harvey and Liu（2015）定量计算了不同夏普比率在实盘外的“打折程度”，发现了“打折程度”和夏普比率之间的非线性关系。


    受Foster et al.（1997）和Fama and French（2010）的启发，Harvey and Liu（2018）提出了一个基于回归的框架来控制多重假设检验的影响。它通过正交化和自助法得到了仅靠运气能够得到的显著性的经验分布，从而得到运气造成的显著性水平的阈值。如果某个因子的显著性水平超过该阈值，则认为其在排除了运气之后依然显著，因此它是真正的因子，而非数据挖掘的产物。该方法的优点是可以按顺序逐一挑出最显著的因子、第二显著的因子，以此类推，直到再没有显著因子。这么做的好处是可以评价每个新增加的因子在解释股票截面收益率时的增量贡献。该方法既可以被用于从大量候选因子中找到真正显著的因子，也可以被用于从一大堆基金经理或策略中找出真正能够战胜市场、获取超额收益的基金经理。'
