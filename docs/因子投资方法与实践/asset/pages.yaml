    # 4.1.5 Hou–Xue–Zhang四因子模型


    Hou et al.（2015）从实体投资经济学理论出发提出了一个四因子模型。由于实体投资经济学理论又被称为q-理论，因此该模型也被学术界称为q-因子模型。该模型包含市场、规模、投资和盈利四个因子：


    ```

    E[R_i]-R_f = β_{i,MKT} (E[R_M]-R_f) + β_{i,MEE}[R_ME] + β_{i,IA}E[R_IA] + β_{i,ROE}E[R_ROE]      (4.16)

    ```


    式（4.16）中E[R_ME]、E[R_IA]和E[R_ROE]分别为规模因子、投资因子和盈利因子的预期收益，β_{i,ME}、β_{i,IA}和β_{i,ROE}为股票i在相应因子上的暴露。需要明确的是，在使用中规模因子和投资因子的排序变量每年六月末更新，而盈利因子的排序变量每月末更新，但所有因子的投资组合均是月度再平衡。


    Hou–Xue–Zhang四因子模型受到了Cochrane（1991）的启发，源于公司投资的经济学原理。该论文的作者之一张nissen教授曾在《清华金融评论》上撰文介绍过这个模型的来龙去脉（Zhang
    2016）。该模型体现了公司金融学中的净现值原则（NPV rule）：如果项目现值大于投资成本，则应当投资该项目；如果项目现值小于投资成本，则不应当投资。起初，公司会有很多投资项目，此时应优先投资折现率低、盈利率高，即现值最高的项目。随着被投资的项目越来越多，投资成本会慢慢增加，盈利率会越来越低。投资的最后一个项目应该是净现值为零（净现值原则）：投资成本=项目现值=盈利率/折现率。


    净现值原则说的是，一家公司应该持续投资，直到投资的边际效益（被折现到今天）等于投资的边际成本。这句话是对Hou et al.（2015）所依托的经济学原'
