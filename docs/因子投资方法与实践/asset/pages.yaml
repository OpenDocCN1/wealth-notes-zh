  md: '当然，并非所有异象都有类似的表现。例如，发放股利的公司的股利同账面资产的比率因子，在不同情绪状态下的表现几乎没有差异。除排序法外，Baker and
    Wurgler（2006）也利用预测性回归对投资者情绪对于异象收益率在时序上的预测能力进行了检验。结果与排序法相似，投资者情绪对规模、年龄、波动率、盈利能力与股息政策、增长期权和财务困境风险等异象的多空组合收益率有显著的预测能力，只有研发相关的异象同投资者情绪没有显著的关联。当使用风险调整后的多空组合收益率作为被解释变量时，结果同样如此。


    Stambaugh et al.（2012）使用Baker and Wurgler（2006）的投资者情绪指标，考察了包括财务困境、股票净发行量、动量、投资等11个异象的多空组合，以及多、空两端在不同投资者情绪状态下的表现，从而更细致地讨论了投资者情绪与错误定价的关联。通过比较多空两端，而不仅仅是多空组合的表现，他们得到了非常有趣的发现。在这11个异象中，有10个异象的空头端在投资者情绪高涨时的未来预期收益率，比它们在投资者情绪低迷时的未来预期收益率显著更低凹。相反，多头端的表现则和空头端截然不同。所有异象的多头端在不同投资者情绪状态下的表现均没有显著差异。因此，异象在不同状态下的表现差异，主要是由空头端所驱动的。


    除此之外，Stambaugh et al.（2012）也使用（6.20）所示的预测性回归进一步检验了投资者情绪和异象的关系。该模型控制了Fama–French三因子的影响：


    ```

    R_{it}^e = a + b S_{t-1} + c R_{MKTt}^e + d R_{SMBt} + e R_{HMLt} + ε_t    (6.20)

    ```


    其中R_{it}^e为投资组合i在t期的超额收益，该组合可以是异象的多头、空头或多空对冲的异象组合。S_{t-1}为滞后一期的投资者情绪，R_{MKTt}^e、R_{SMBt}和R_{HMLt}为Fama–French三因子t期的收益率。他们发现，投资者情绪对于多头端收益率没有预测能力，但与空头端收益率则呈现显著为负的相关性，并最终与多空对冲后的异象组合的收益率呈现显著正相关。这项分析同样表明，异象在不同状态下的表现差异更多由空头端所驱动。


    面对投资者情绪对异象（特别是其空头）在时序上显著的预测能力，一个自然的问题是：这种预测性真实吗？Stambaugh et al.（2014）通过模拟回答了这个问题。在每次模拟中，他们使用一阶自回归过程（自回归系数为0.988、随机扰动满足正态分布）生成了随机指标序列，并使用该随机指标代替投资者情绪放入预测性回归式（6.20）中，考察它是否具有和投资者情绪可比的预测能力▽。该文共进行了200万次模拟，以确保得到可靠的分析结果。研究结果表明，平均每28500次模拟，才能有一个随机序列满足同所有11个异象的多空组合收益显著正相关；而进一步考虑同异象空头端显著负相关的条件，则需要105000次模拟才会出现一次。由于它们均是非常小概率的事件，因此先前研究（Stambaugh
    et al.2012）发现的投资者情绪的显著预测能力不大可能是伪回归的结果，投资者情绪的确对异象未来表现有显著的预测能力。


    Baker et al.（2012）则提供了投资者情绪影响在其他市场中的证据。受限于数据可得性，他们采用了同Baker and Wurgler（2006）略有不同的投资者情绪定义方法。具体而言，他们保留了IPO数量和IPO公司上市首日平均收益以及换手率三个细分指标，但是用波动率溢价取代了股利溢价▽，并剔除了封闭式基金折价率和股'
