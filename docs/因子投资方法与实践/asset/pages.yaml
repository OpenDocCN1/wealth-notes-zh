  md: '异象的个数，就会认为模型A比模型B更好。模型之间的对比也从侧面推动了对异象的研究。


    相比之下，业界对异象的研究动机则“单纯”得多。正如1.1.3节所描述的那样，业界并不严格区分定价因子和异象因子。在业界看来，一个因子是否被纳入某个定价模型（从而从异象因子转变为定价因子）并不重要，而更关心在考虑了交易成本之后，使用该因子是否仍然能够获得超额收益。


    # 3. 截面角度vs时序角度


    目前，在关于因子投资内容的介绍中，无论研究的关注点是βᵢ′λ还是αᵢ，它们都是在给定的因子模型下研究资产的预期收益和β之间的关系，即资产预期收益率在截面上的差异，因此多因子模型是关于均值的模型（model
    of the mean）。从数学定义可知，预期收益率是收益率在时间序列上的平均，因此均值的模型仅关心不同资产的收益率均值为什么会有差异，而非每个资产的收益率如何随时间变化。把式（1.3）沿时间轴展开，资产超额收益和因子收益率在时序上满足如下多元线性回归模型：


    Rᵢₜᵉ = αᵢ + βᵢ′λₜ + εᵢₜ (1.4)


    其中 Rᵢₜᵉ 表示 t 时刻资产 i 的超额收益，λₜ 表示 t 时刻因子收益率，εᵢₜ 表示 t 时刻的随机扰动。这就是研究多因子模型的时间角度。图1.2展示了截面角度和时序角度之间的切换。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_12_0.png)


    图1.2 截面角度vs时序角度


    在时序角度下，因子投资中的两个重要问题是方差模型（model of the variance）和因子择时。为了解释前者，把N个资产的时序多元回归模型放在一起表达：


    Rₜᵉ = α + βλₜ + εₜ (1.5)


    其中 Rₜᵉ = [R₁ₜᵉ, R₂ₜᵉ, …, R_Nₜᵉ]′ 是 N 维超额收益向量；α = [α₁, α₂, …, α_N]′ 是 N 维定价误差向量；β
    = [β₁, β₂, …, β_N]′ 是 N×K 因子暴露矩阵；εₜ = [ε₁ₜ, ε₂ₜ, …, ε_Nₜ]′ 是 N 维随机扰动向量，满足 E[εₜ]
    = 0 以及 cov(λₜ, εₜ) = 0。对式（1.5）两侧求协方差矩阵并利用 cov(λₜ, εₜ) = 0 可'
