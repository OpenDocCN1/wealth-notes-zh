  md: '函数为：


    $$\max_{\omega}\frac{\omega''\sigma}{\sqrt{\omega''\Sigma\omega}}$$  (7.62)


    式（7.62）的最优解满足（Clarke et al. 2013）：


    $$\omega_{md}\propto\Sigma^{-1}\sigma$$  (7.63)


    # 4. 风险平价


    2005年，PanAgora资产管理公司的Edward Qian首次提出了风险平价（risk parity）的概念（Qian 2005）。随后，这一概念因桥水（Bridgewater）基金的全天候（all
    weather）策略而发扬光大。从经济含义上说，全天候策略的核心是将投资组合的风险平均地暴露在不同的经济环境中，从而对冲市场环境的风险，使得未来无论处于哪一种经济环境中，该投资组合的风险都是可控的。


    从资产组合优化的数学含义上说，风险平价的意义是让投资组合中的资产对组合的风险贡献相等，因此该最优组合又被称为等风险贡献（equal risk contribution）组合。令σp代表投资组合的波动率，则等风险贡献意味着：


    $$\omega_i\frac{\partial\sigma_p}{\partial\omega_i}=\omega_j\frac{\partial\sigma_p}{\partial\omega_j},\quad\forall
    i,j$$  (7.64)


    式中ωi为股票i的权重。将式（7.64）转化为数学优化问题可得：


    $$\min_{\omega}\sum_{i=1}^{N}\left[\omega_i-\frac{\sigma_p^2}{(\Sigma\omega)_i
    N}\right]^2$$  (7.65)


    其中（Σω）i表示向量Σω中第i个元素，即一个标量。一般情况下，式（7.65）并无“优雅”的解析解，而需要通过数值方法求出。然而，若所有资产两两相关系数均相等时，Maillard
    et al.（2010）指出在∑_{i=1}^N ω_i =1的约束下，式（7.65）的最优解满足：


    $$\omega_{rp,i}=\frac{\sigma_i^{-1}}{\sum_{j=1}^{N}\sigma_j^{-1}}$$  (7.66)


    需要说明的是，对于配置股票来说，所有股票两两相关系数相同这个假设难以成立，因此在该假设下的最优解似乎有些不切实际。但作为资产配置中最重要的方法之一，风险平价常被用于大类资产配置和计算不同类资产的最优权重。在这种情景下，资产两两相关系数均相等这个假设往往可以被接受。比起单纯使用历史数据来估计相关系数，这种假设往往可以产生更具稳健性的最优配置结果。


    # 7.3.3 不同目标函数的比较'
