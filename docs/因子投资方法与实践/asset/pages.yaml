    # 5.1.1 价值因子与价值投资


    在因子投资领域，价值因子要说自己是老大哥，没人会提反对意见。因为长期表现优异，所有指数公司均有编制价值类指数，例如MSCI的增强价值指数（Enhanced
    Value Index）、标普道琼斯的纯价值指数（Pure Value）以及罗素的纯价值暴露指数（Pure Value Target Exposure Factor），国内的中证指数公司也编制了红利价值等指数。


    本书3.4节详细探讨了价值因子的起源和发展。它不仅历史悠久，更是存在于各种不同的资产类别之中。Asness et al.（2013）在美国、英国、日本和欧洲等成熟股票市场，以及股票指数、债券、商品期货和外汇其他资产中，均发现价值因子能获得正的超额收益和较高的夏普比率。Kunz
    and Mazzoleni（2018）也讨论过相似的问题，并在股票、债券、外汇和商品中均发现了价值溢价，并且不同资产的价值溢价相关性较低，有利于组合的分散化配置。


    价值因子通常按照估值指标的高低选股。依照这个法则，投资者应尽量选择看起来较便宜的股票，避开那些已经很贵的股票。无论是针对美股还是A股的实证都显示，便宜的股票确实长期看来比昂贵的股票有更高的预期收益。然而这是事实，却不是真相。一个股票估值之所以便宜，是因为要么价格真的偏离了内在价值，要么本来就不值钱。前者属于真正的价值股，后者可能存在估值陷阱。Piotroski（2000）对此有过统计，虽然估值指标较低的组合整体表现不错，但只有不到44%的股票能够在未来两年获得正的超额收益；也就是说，超过一半的低估值股票仅仅拖了后腿。


    上述现象中的矛盾凸显了价值因子和价值投资之间的差异。Kok et al.'
