  md: '# 7.6 风格分析


    顾名思义，风格分析旨在对一个投资组合的投资风格进行研判。风格分析与业绩归因有着密切的关系，二者都旨在更好地理解投资组合的收益来源，而多因子模型在风格分析方面大有可为。业绩归因与风格分析的起源，都与资产组合分析有着密切的关系。从业绩归因角度看，Brinson
    et al.（1991）表明，资产配置决定着资产组合的大部分收益波动，而风格分析则为人们提供了理解投资组合收益来源的另一个视角。


    # 7.6.1 经典风格分析


    Sharpe（1992）开启了风格分析研究的大门。 具体来说，Sharpe（1992）考察的是基于收益的风格分析，即通过利用资产或资产组合的收益率序列对因子收益率进行回归来得到相应的风格暴露。与此相对应的是基于持仓的风格分析，即先获取持仓资产的风格暴露，再依据持仓权重加总得到资产组合的风格暴露（Daniel
    et al.1997）。基于持仓的风格分析往往更加准确，但它依赖于完整的持仓数据。由于完整的持仓数据并不容易得到，因此基于收益的风格分析在实践中得到了更广泛的应用，而这也是本节的重点。接下来均用风格分析指代基于收益的风格分析。


    Sharpe（1992）提出的风格分析表达式和一般的多因子模型并无差异：


    ```

    R_{it}=β_{i1}λ_{1t}+β_{i2}λ_{2t}+⋯+β_{ik}λ_{kt}+ε_{it}  (7.92)

    ```


    其中R_{it}为t期资产i的收益，λ_{kt}为t期因子k的收益，β_{ik}为资产i在因子k上的暴露，而随机扰动项ε_{it}为在t期资产i的收益率中无法被上述因子解释的部分。需要说明的是，由于所有收益率及因子暴露在事前均是未知的，因此风格分析和业绩归因一样，也属于事后分析方法。在上述模型中，由于Sharpe（1992）假设不同资产的残差收益互不相关，因此资产收益的相关性完全由因子的相关性和资产对因子的暴露所决定。此外，该模型允许ε_{it}的均值不为零。


    虽然模型（7.92）看上去和多因子模型并无差异，但Sharpe（1992）在提出风格分析时，对其做了很多约束，而这些约束在如今看来太过严格。首先，纳入风格分析模型（7.92）的因子必须满足“不重不漏”（mutually
    exlusive and collectively exhaustive，MECE）原则。在这个限制下，所有股票按照不同的风格被划分到其所属的特定因子投资组合之内。换句话说，在该模型中，每支股票属于且仅属于某一个因子，而不能同时出现在多个因子的投资组合之中。其次，该模型规定任何资产对模型（7.92）中所有因子的暴露之和必须为100%。最后，考虑到现实中'
  merge: -1
  img_proc: true
- pgno: 358
  md: '卖空往往很困难，因此它还加入了禁止卖空约束。由于每个因子投资组合都是纯多头组合，卖空约束意味着资产对每个因子的暴露必须非负。


    Sharpe（1992）风格分析模型（7.92）不仅可以用于分析单一资产的表现，也可以用来分析投资组合的表现。关于对该模型的进一步理解，以下三点值得思考。第一，上述约束对模型（7.92）的求解也带来了额外的困难。若没有禁止卖空约束，则可以通过线性回归求解风格暴露。然而，卖空约束的加入使得该模型的求解变成了非线性的二次规划问题，这增加了求解的复杂度。第二，风格分析旨在找到一个静态风格组合，使其能够最好地接近资产在样本期内真实表现，帮助人们解释资产的表现。考虑到投资者可能在样本期内有较为频繁的交易活动，上述风格分析的性质就很重要。只要可以找到一个静态风格组合足够接近其投资组合的真实表现，便可以很好地解释它，而无须过度关注投资者的交易行为。第三，风格分析将一项资产的收益分解为风格暴露带来的系统性部分和与风格无关的扰动项，后者经常被称作相对前述静态风格组合的跟踪误差，但其均值则不一定为零。对εit进行统计检验，就可以得到关于投资者是否有良好投资能力的更多信息。


    为了说明该模型的具体应用，Sharpe（1992）通过一个12因子模型对先锋基金发行的一支开放式基金进行了风格分析。在这12个因子中有4个股票风格因子，即大盘价值股、大盘成长股、中盘股和小盘股，并使用相应的风格指数来代表这些不同的风格因子组合（这也是风格分析中的典型做法）。显然，上述划分是满足“不重不漏”原则的，且每支股票只属于单一因子。从分析结果来看，当没有卖空限制时，该基金对大盘价值股的暴露非常高，约为110%，同时它对中盘股和国际债券有非常显著的负暴露。当添加卖空约束后，结果表明该基金在大盘价值股和小盘股上有较高暴露，二者可以很好地解释该基金的表现。


    在实际使用Sharpe（1992）的模型进行风格分析时，如何选择作为因子的风格指数是必须解决的问题。由于不同指数提供商对于同一风格可能有不同的定义，因此来自不同指数商的风格指数很可能有很大差异。以价值因子为例，某个指数提供商可能选择有高账面市值比的股票来构建价值风格指数，而其他提供商则会用那些账面市值比、盈利率市值比和股息率综合评分较高的股票来构建价值指数。这两种价值指数在某些时期的表现差异可能会较大，导致基于它们的风格分析得出不同的结论。基于这个原因，Buetow
    et al.（2000）悲观地认为，虽然Sharpe（1992）风格分析的逻辑毫无问题，但它在实践中却难以有效地应用。另外，该风格分析的两个约束也加剧了这一问题。首先，该模型要求对不同风格的暴露之和总是等于100%，这一约束可能会扭曲估计结果。其次，该模型要求作为解释变量的风格因子之间是互斥且完备的。这意味着一旦选择纳入价值风格，就必须相应地纳入成长风格。当人们希望考虑的风格越来越多时，模型需要纳入的风格因子将呈指数增长。例如，以常见的规模（大中小盘）和价值/平衡/成长风格为例，要满足“不重不漏”原则，则需要在模型中加入9个风格因子；一旦人们想要考虑更多的风格类型，这种方法注定会遇到不小的挑战。


    # 7.6.2 基于多空因子的风格分析


    鉴于Sharpe（1992）模型遇到的种种挑战，人们提出了另外一种风格分析，即基于多空因子的风格分析。这种风格分析的模型如下：'
  merge: -1
  img_proc: true
- pgno: 359
  md: '```

    R_{it}-R_{Bt}=\beta_{i1}\lambda_{1t}+\beta_{i2}\lambda_{2t}+\cdots+\beta_{iK}\lambda_{Kt}+\varepsilon_{it}\qquad(7.93)

    ```


    其中$R_{Bt}$为基准指数的收益（通常选择市场指数作为基准指数）。这一转变有两个额外的好处：首先，由于考虑的是超额收益，因此不再需要风格暴露之和为100%的约束；其次，模型（7.93）允许使用多空因子组合而非纯多头风格指数作为因子，这可以规避经典风格分析遇到的问题。


    进一步，将模型（7.93）等号左侧的基准指数（相对无风险利率）的超额收益移到模型右边作为解释变量，则模型（7.93）就变为人们熟悉的多因子模型形式：


    ```

    R_{it}^{e}=\alpha_{i}+\beta_{i,m}R_{Mt}^{e}+\beta_{i1}\lambda_{1t}+\beta_{i2}\lambda_{2t}+\cdots+\beta_{iK}\lambda_{Kt}+\tilde{\varepsilon}_{it}\qquad(7.94)

    ```


    其中$R_{it}^{e}$和$R_{Mt}^{e}$分别为资产$i$和市场基准指数（相对于无风险利率）的超额收益，$\alpha_{i}$为在资产$i$的收益率中无法被因子解释的部分的均值，$\tilde{\varepsilon}_{it}$为均值为零的随机扰动。模型（7.94）正是实证资产定价和因子投资中最常见的定价模型。这也是为什么多因子模型可以被用来进行风格归因。本书第4章4.1节介绍的经典Fama–French三因子和五因子模型、Hou–Xue–Zhang四因子模型等都是典型的代表。


    在实践中，基于多因子定价模型的因子分析早有大量应用，一个典型例子是基金业绩分析。Carhart（1997）指出动量对于解释公募基金的表现非常有帮助，并用Fama–French三因子和动量因子构建了Carhart四因子模型，发现该模型可以有效解释大部分股票型基金（不包括持续表现不佳的基金）的业绩。此外该文还发现，相比表现最差的基金，表现最好的基金在规模和动量因子上有着更高的暴露，而这两者在价值因子暴露上则没有显著差异。上述风格差异使优异基金比落后基金每月多产生0.67%的超额收益，该差异要远大于它们$\alpha$的差异（仅为每月0.29%）。毫无疑问，风格暴露对于资产或投资组合的总体表现有着显著影响。这意味着在分析资产或投资组合的收益时，除考察$\alpha$以外，也需要对风格分析给予足够的关注。


    此外，投资组合分析中很重要的一点是考察其风格的稳定性。在这方面，可以利用滚动回归估计投资组合的时变风格暴露，并通过分析因子暴露的时间序列进行风格稳定性分析。如果投资组合对某个（些）风格因子的暴露在短时间内发生剧烈变化，或其暴露较大的几类风格因子频繁发生变化，则可能预示着投资组合的风格并不稳定。最后，虽然模型（7.94）形式上与模型（7.92）的经典框架稍有不同，但风格分析的核心作用仍是一致的，即找到一组能够最好地解释投资组合表现的静态风格因子。


    # 7.6.3 实例：巴菲特的投资风格


    谈到风格分析实例，一个最佳的研究对象自然是股神巴菲特（Warren Buffett）。他在过去50年间实现了接近20%的年化收益。巴菲特师承价值投资的代表Benjamin
    Graham（格雷厄姆），非常注重股票的购买价格（安全性）。与此同时，他也逐渐发展了自己的投资风格，特别是对质量的高度重视。巴菲特是否真的具有这样的投资风格？相关风格因子是否可以很好地解释巴菲特的优异业绩？'
