  md: '史波动率。这时填充法将导致停牌日的收益率为零。由于收益率为零相当于没有波动，因此使用它计算波动率并不能真实反映波动率水平。由于没有波动是由于停牌造成的，因此填充法将会造成历史波动率被低估。一个相似的例子是计算个股超额收益率相对于市场超额收益的暴露β。由于市场超额收益率是每天都有的，而个股收益率停牌日如果用0代替，则会导致β的计算出现较大偏差。在上述这些情况中应该将停牌日设为缺失值，不参与计算。


    # 4. 最少交易日


    A股市场中有些公司出于这样或那样的原因，滥用停牌制度，造成其股票交易断断续续，这会给指标计算带来干扰。举例来说，假如想要利用过去一个月内交易日的收益率数据计算波动率。如果某支股票在绝大多数交易日均停牌，只有少数样本用来计算，则最终结果会受到小样本的影响，造成较大的偏差。为了避免这种情况，对于需要使用一段时间窗口内数据计算的指标，本书要求只有当有效样本数超过时间窗口的三分之二时，才进行相应的计算。仍以一个月波动率为

    例，由于一个月通常包含21个交易日，因此当样本数量大于或等于14时才会计算波动率，否则把结果做缺失值处理。


    少数公司滥用停牌制度，其随意地停牌实际上侵犯了投资者的知情权和交易权，也影响了市场的流动性。为维护资本市场公平交易秩序，优化交易监管，上交所和深交所于2018年12月28日发布了停复牌指引，进一步减少停牌事由，明确停牌条件，缩短停牌期限。图3.2展示了从2005年至2019年每日停牌股票占比。在市场各方的合力之下，上市公司停牌次数、停牌家数近年来已大幅减少。


    ![](img/8ad8b7f696519d8b709b07f70d7ebfdb_99_0.png)


    图3.2 每日停牌股票数占比


    # 3.1.3 财务数据处理


    财务数据就是与公司财务有关的数据，反映企业一定期间的经营成果和财务状况变动。交易所为了保护投资者的权益，要求上市公司定期公布财务报告，以便投资者了解其经营及财务状况。财务数据比量价数据复杂得多，因此下面会花较多笔墨介绍。


    # 1. 报告期'
