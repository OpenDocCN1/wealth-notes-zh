- pgno: 235
  md: '从实证结果来看，虽然Hou–Xue–Zhang四因子模型和Fama–French五因子模型均使用历史总资产变化率作为构建投资因子的变量，但由于使用的排序法略有差异，前者中投资因子的因子溢价也完胜后者。从实体投资经济学理论出发，投资和收益率的负相关是在控制ROE之后的。因此，Hou–Xue–Zhang四因子模型在构建投资因子时利用市值、ROE和总资产变化率三个指标使用2×3×3三重排序法，从而更好地反映了在控制ROE之后投资和收益率的关系。反观Fama–French五因子模型，它仅使用市值和总资产变化率进行2×3双重排序，没有考虑控制ROE的影响，因此效果不如Hou–Xue–Zhang四因子模型。


    无论是从理论还是实证结果出发，人们总能讲出最适合数据的故事，但对着历史数据讲故事真的让人们离真相更进一步了吗？


    # 6.2.2 q⁵模型


    Hou et al.（2020）在Hou–Xue–Zhang四因子模型的基础上，添加了一个新的预期投资增长因子，从而构建了全新的五因子模型，即Hou–Mo–Xue–Zhang五因子模型（他们将其称为q⁵模型）。Cochrane（1991）一文指出在控制住当期投资和预期盈利的条件下，预期投资增长率和预期收益率成正比，这就是Hou
    et al.（2020）加入预期投资增长因子的动机。


    在数学上，q⁵模型是Hou–Xue–Zhang四因子模型的直接延伸。回顾一下提出该四因子模型的Hou et al.（2015）一文。它使用了简单的二期（时刻0和1）模型公司决策模型引出投资和盈利因子I。
    由于它假设公司在时刻1不再投资，因此实际上是一个单期投资框架，不涉及未来投资增长。然而，Hou et al.（2020）一文把投资模型扩展到了多期，从而引入了预期投资增长。在多期投资模型中假设资产从t到t+1期的折旧率为δ（在Hou
    et al.（2015）中，资产从时刻0到时刻1折旧完，因此δ=1）。公司投资决策是每一期的投资{Iit+s}（s=0,1,…）。在任何时点t，目标函数是最大化股东权益的现值。根据投资第一性原理可知从t到t+1期的边际投资成本应该等于边际效益折现到t，使用和4.1.5节相同的数学符号，t到t+1的投资收益满足：


    ```

    r_{it+1}^I ≡ [Π_{it+1} + (a/2)(I_{it+1}/A_{it+1})² + (1 − δ)[1 + a(I_{it+1}/A_{it+1})]]
    / [1 + a(I_{it}/A_{it})]   (6.9)

    ```


    在一定的假设下，Hou et al.（2020）指出股票收益率等于投资收益率。由此，从式（6.9）可以找到股票收益率和投资以及盈利的关系。式（6.9）中第一项近似对应分红，第二项平方项与边际调整费用有关（由于是高阶小量故忽略），第三项近似对应预期投资增长。具体来说，第三项是I_{it}/A_{it}的增长率，即投资与总资产之比的预期增长。


    从多期模型出发，股票收益率除了与盈利以及历史投资相关，还和预期投资增长正相关。因此，Hou et al.（2020）将预期投资增长作为第五个因子补充到Hou–Xue–Zhang四因子模型中，得到了q⁵模型。在实际构造预期投资增长因子时，用历史数据构建了一个截面回归预测模型，然后利用最新的财务数据预测下期的投资与总资产之比的增长率，并以此作为构建因子的变量。从数学复杂度上来'
