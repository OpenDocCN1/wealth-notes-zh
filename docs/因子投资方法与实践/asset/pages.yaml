- pgno: 59
  md: '# 2.4 异象检验


    学术界对于异象的研究是十分狂热的。在过去30年的时间里，学者们在美股市场中“挖”出了数百个异象。Hou et al.（2020）一文花了非常大的精力复制了452个异象，是一篇很好的总结。不幸的是，他们发现绝大多数被发表的异象并不能获得多因子模型无法解释的显著α收益率，这意味着很多学术研究并没有带来真正科学、正确的结果。本书第6章会对学术界的这种风气进行介绍，本节先来看看如何检验异象。


    # 2.4.1 时序回归检验异象


    通过第1章的介绍可知，如果某个资产能够获得多因子模型无法解释的显著超额收益，那么就称该资产为一个异象。在股票多因子研究的范畴内，上述异象资产通常是按照如下几个步骤构造投资组合的：


    +   （1）选择一个潜在的财务指标或者量价指标，以它作为异象变量（anomaly variable）。


    +   （2）根据异象变量取值的高低，将股票在截面上排序，使用排序法构建异象投资组合，并获得异象收益率的时间序列。


    +   （3）检验该异象收益率能否被多因子模型解释。


    在给出具体的检验之前，有一点关于异象研究的重要趋势值得一提。在过去，最常见的做法是使用单一异象变量来构建异象。然而，在近些年的研究中，一个主流的趋势是使用多个（即复合）变量来构造异象。当然，这种做法有利也有弊。好的一方面是这些使用多指标构建的异象往往有更强的金融学含义，因此更能够帮助人们理解上市公司基本面和技术面信息与未来预期收益率之间的关系。比如Asness
    et al.（2019）一文以Quality minus junk为题提出的质量异象。该文三个维度使用了众多指标，最终得出了一个总分对股票排序，构造了异象投资组合。又如Piotroski
    and So（2012）的研究，它使用两个变量的独立双重排序构建了一个预期差异象，而其中一个排序变量本身就是一个应用了多个财务指标的复合变量。不好的一个方面则是使用复合变量更容易出现过拟合。从某种意义上说，研究异象（和因子）其实是对着历史数据进行数据挖掘。一旦使用的变量过多，就容易出现过度挖掘，使得发现的所谓异象仅仅是样本内过拟合的结果。尽管如此，从本书的目标来看，复合变量构成的异象仍然比单一变量构成的异象更加值得探讨。为此，在本书第5章研究异象时，会针对学术界一些非常经典的复合变量异象在A股进行实证。'
