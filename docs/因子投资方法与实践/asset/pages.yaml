  md: '费用代表着更高的套利成本，那些由错误定价解释的异象在前样本外数据中应该更加显著。


    使用崭新的样本外数据，Linnainmaa and Roberts（2018）分析了这36个异象在样本内/外的绝对收益、CAPM-α以及Fama-French三因子-α，结果发现它们在样本外（包括前、后样本外）的表现均远远不如其在样本内的表现。以统计来看，在样本内，无论从收益、CAPM-α还是Fama-French三因子-α，这36个异象均显著。而在1963年之前的前样本外期间，这三个指标下显著的异象个数变为8、8和16；在异象被发表后的后样本外期间，这三个数字变为1、10和9。此外，他们发现随着宏观经济的变化，在整个实证区间的前半段，有效的异象和有形投资以及股权融资相关；在实证区间的后半段，有效的异象和无形投资以及债券融资有关。这似乎说明只有真正和经济相关的异象背后才可能存在未知风险或错误定价的解释，而非来自数据窥探。


    对于异象和因子在被发现后表现变差，另一种来自套利者的解释（McLean and Pontiff 2016）也被广泛接受。当某个能够预测股票收益率的变量被发现后，套利者便开始利用其进行交易，导致它代表的市场非有效性降低，表现逐渐失效。如果这个解释成立，那么当异象被发现后，它的收益率应该和其他已经被发现的异象的收益率的相关性就会更高。这是因为市场上的聪明交易者同时在交易这些不同的异象，使得按它们构建的策略的资金流入和流出相对一致，从而造成异象表现的趋同。为了检验这个说法，Linnainmaa
    and Roberts（2018）对前样本外和后样本外的因子收益率数据进行了回归分析。结果却多少有些尴尬，因为在前、后两个样本外区间，他们都发现所有异象的收益率均呈现正相关。


    显然，人们不能使用套利者的交易行为来解释前样本外期间因子收益率之间的正相关。这是因为在论文被发表前异象尚未被公开，因此套利者根本无法交易它们。更不幸的是，由于在前、后样本外观察到了几乎一致的现象，这也间接质疑了后样本外中套利者这个解释。另一方面，上述现象的一个合理的解释是在样本内，数据窥探不仅对异象的一阶矩（即预期收益）造成了影响，更对异象之间的高阶矩（即相关性）也造成了错误的影响。唯有此才能解释在前、后样本外期间都观测到的异象之间不合理的正相关性。这便是数据窥探的另一个证据。


    当很多人都在使用同样的数据来分析大量不同的选股变量时，最终被发表在顶级期刊上的那些异象注定是在样本内表现非常优秀的。但是样本外呢？即便学者们试图从未知风险和错误定价角度去解释这些异象，但它们背后仍然存在着严重的发表偏差和数据窥探偏差。面对这些偏差，以提高代表样本内显著性水平的t-值阈值为目标的方法作用仍然有限。Harvey
    et al.（2016）指出在条件的允许下，使用样本外全新的数据检验才是排除虚假因子的最好办法。


    【1】具体例子见Bernard and Thomas（1989），Chopra et al.（1992），Gleason and Lee（2003）等。


    【2】公众号“Chihiro Quantitative Research”的文章《盈利的其他方面（下）》对计算预期盈利的不同方法进行了详细说明。'
  merge: -1
