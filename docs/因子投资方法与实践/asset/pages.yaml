  md: '市场环境中表现也是不同的。在这方面，学术界通常关心的是不同因子和宏观经济以及投资者情绪之间的关系。而反观业界，由于业界使用因子的目的是进行资产配置和获取超额收益，因此自然会对因子收益率在时序上的变化产生极大的兴趣。这是因为如果能够通过择时来挑出某个因子“好使”的时候配置、在它“不好使”的时候规避，那么无疑会提高使用因子的风险收益水平。正是
    Requirements在这个动机的趋势下，因子择时始终是业界的研究热点之一。


    # 4. 统一视角


    以上从式（1.3）出发，从β′iλ、αi、α以及“截面角度vs时序角度”三个维度梳理了因子投资中所涉及的内容。这也正是本书希望传递出来的统一视角下的因子投资。图1.3对这三个维度进行了总结，它可以被视作全书的思维导图。


    # 1.1.5 实证资产定价与因子投资


    严格地说，在1.1.4节涉及的内容中，学术界视角下因子投资的内容属于实证资产定价研究的范畴；而一般当人们谈论因子投资的时候，通常指的是业界的视角。然而，出于以下两个原因，本书提倡把学术界和业界关注的不同内容放入统一的视角，学习和实践因子投资。


    首先，投资学大概是学术界和业界结合的最紧密的学科之一，而因子投资则是这种紧密结合的代表。经过了几十年的努力，学术界在实证资产定价方面提出了丰富的金融理论模型和计量经济学统计手段，并发现了诸如价值、盈利、动量、低波动等如今已被广泛认可和接受的因子。这些发现自问世以来就持续地指导着因子投资实践。毫不夸张地说，因子投资的兴起深深地植根于学术界关于资产定价的研究中。另外，业界的因子投资活动也为已有理论的反复检验和新理论的提出提供了充足的数据，促使学术界不断提出新的研究成果。


    |  |  |  | 学术界 | 业界 |

    |---|---|---|---|---|

    | $E[R_i^e] = \alpha_i + \beta''_i\lambda$ |  | $\beta''_i\lambda$ | · “最好的”模型<br>·
    管理人业绩归因 | · 配置因子、获取超过基准的收益 |

    | 因子投资 | 截面角度 | $\alpha_i$ | · 市场有效性检验<br>· 模型比较 | · 通过异象获得收益 |

    |  | 时序角度 |  | · 因子和资产协方差矩阵有关<br>· 因子和宏观经济以及投资者情绪的关系 | · 风险控制<br>· 因子择时 |


    图1.3 统一视角下的因子投资


    其次，作为一个理论指导实践的细分学科，虽然历经了几十年的发展，但因子投资依然在不断地完善和创新。最初，多因子模型仅是在人们拒绝了CAPM之后的代替之选，其后它逐渐发展成为股票投资的有效手段之一。时至今日，多因子模型早已渗透到不同大类资产的投资中，人们在股票、债券、商品期货甚至是加密货币领域都可以看到它大展身手。在当下最新的趋势中，人们更是从因子的角'
