    # 4.1.7 Daniel-Hirshleifer-Sun三因子模型


    Daniel et al.（2020）提出的Daniel-Hirshleifer-Sun三因子模型是把行为金融学应用于资产定价的另一个尝试。该文从长、短两个时间尺度上提出两个行为因子（behavioral
    factor），与市场因子一起构成了一个复合三因子模型：


    $$E[R_i]-R_f = \beta_{i,\text{MKT}}\left(E[R_M]-R_f\right)+\beta_{i,\text{FIN}}E[R_{\text{FIN}}]+\beta_{i,\text{PEAD}}E[R_{\text{PEAD}}]\quad(4.29)$$


    式（4.29）中$E[R_{\text{FIN}}]$和$E[R_{\text{PEAD}}]$分别代表长周期和短周期的两个行为因子的预期收益，$\beta_{i,\text{FIN}}$及$\beta_{i,\text{PEAD}}$为个股$i$在相应因子上的暴露。在使用中，FIN因子的投资组合每年六月更新，PEAD因子的投资组合每月更新。


    这两个行为因子旨在捕捉由于过度自信（overconfidence）和有限注意力（limited attention）造成的错误定价，从而解释学术界之前发现的大量选股异象。从行为金融学的角度出发，股票收益率之间的共同运动通常有两个原因：


    +   - 股票错误定价上的共性（见Barberis and Shleifer 2003）；

    - 投资者对股票基本面信息的错误反应上的共性（见Daniel et al.2001）。


    前者指出不同的股票实际上暴露在一些共同的风格风险上，而情绪冲击会造成同一风格的股票收益率的共同运动，因此同一风格的股票存在相关性很高的错误定价。后者说明由于认知偏差，投资者难以对股票基本面方面的信息做出及时、正确的反应，因此也会导致错误定价。由于错误定价可以预测未来收益率，这意味着可以使用行为因子来构建一个多因子模型，以期更好地解释股票预期收益率之间的截面差异。这就是Daniel
    et al.（2020）的研究动机。此外，该文进一步指出市场上的绝大多数异象可按照时间尺度分为短时间尺度和长时间尺度两大类。短时间尺度的异象大多来自投资者的有限注意力，而长时间尺度的异象大多来自投资者的过度自信。为此Daniel等三位作者提出了捕捉长时间尺度异象的FIN因子和捕捉短时间尺度异象的PEAD因子。


    FIN因子使用上市公司股票的发行和回购计算。研究表明，一方面，由于具备信息优势，公司的管理层善于利用市场上已经形成的错误定价“择时”自己公司的股价：当他们认为公司股价过高时，往往会增发；而当公司股价被低估时，通常采取回购。另一方面，普通（非理性）投资者往往过度自信，导致对上市公司的增发、回购行为反应不足，使得股价不会在短期修正。


    大量（美股上）的实证表明，增发行为和未来的收益率呈负相关，而回购行为和未来的收益率呈正相关。为此，Daniel et al.（2020）使用以下两个指标构建了FIN因子：（1）过去五年的复合股权发行量（5-year
    composite share issuance，CSI）；（2）过去一年的股票净发行量（1-year net share issuance，NSI）[1]。首先来看CSI，它的处理比较简单。以纽交所上市公司CSI指标的20%和80%分位数为界，将全部股票分成低、中、高三档。再来看NSI，它的处理则十分复杂。Daniel
