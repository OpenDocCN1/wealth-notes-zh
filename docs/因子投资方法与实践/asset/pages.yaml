  md: '权融资占比。他们为美国、英国、德国、法国、日本和加拿大这六个发达国家市场构建了国家及全球投资者情绪指数，并考察了其预测能力。研究结果揭示了两个有趣的发现。首先，全球投资者情绪同各国的总体市场收益显著负相关，但当控制了全球投资者情绪后，各国的国家投资者情绪则没有显著的预测能力。其次，对于各国股票收益率的横截面差异，全球与国家投资者情绪都有显著为负的预测能力。上述结果与前述关于美股的各项研究大体一致，当投资者情绪高涨时，那些难以估值和套利的股票会被高估，并伴随有更低的未来收益。


    # 6.4.3 投资者情绪与市场表现


    除了同异象的表现有关，投资者情绪对总体市场风险收益特征也有显著影响。Yu and Yuan（2011）使用Baker and Wurgler（2006）的投资者情绪指标对投资者的风险收益偏好进行了研究。他们发现，当投资者情绪较为低迷时，市场呈现出显著的高风险高收益特征，这与经典金融理论的预测一致。但当投资者情绪高涨时，市场预期超额收益便同风险不再相关。此外，为了说明投资者情绪的重要性，该文还考虑了其他能够反映市场不同状态的常见指标，包括利率、市场整体市盈率以及剩余消费比率（Campbell
    and Cochrane 1999）等。在上述指标区分的市场不同状态中，均无法观测到不同的风险收益偏好。这也从侧面反映出投资者情绪和市场的风险收益特征之间的密切关联。


    Huang et al.（2018）研究了不同资产类别中的投资者情绪的影响。他们利用路透社基于新闻和文本分析方法计算的不同资产的投资者情绪数据，研究了美国股票、债券、大宗商品、地产和货币市场中的投资者情绪的影响。不出意外，每类资产的表现都受其自身投资者情绪的影响。此外，一项资产的投资者情绪可能对其他资产的表现有影响。例如，债券市场的投资者情绪会影响股票的表现，而债券市场的表现又受到货币市场投资者情绪的影响。


    Jiang et al.（2019）一文则分析了管理者情绪指标（manager sentiment）。该文利用文本分析从公司定期公告和电话会议文字稿中提取了公司的管理者情绪，并进而汇总得到市场总体的管理者情绪指标。这篇论文的几个发现颇有价值。首先，管理者情绪同市场总体的未来收益显著负相关，样本外预测表现同样不俗。其次，管理者情绪同常见的投资者情绪不完全相关。在预测性回归分析中，当控制了各种常见的投资者情绪指标后，管理者情绪依然显著为负。再者，管理者情绪可以预测市场总体的未来盈利（用未预期盈余来代表，管理者情绪同其负相关）和投资增长（用总体资本支出的同比增长率来代表，管理者情绪同其正相关），这可能是管理者情绪可以预测市场未来收益的原因。最后，该文也探讨了管理者情绪和异象之间的关系，并发现多种异象的多空组合收益都同管理者情绪存在显著关联，且当控制了管理者情绪后，Baker
    and Wurgler（2006）的投资者情绪对异象多空组合收益的影响减弱了很多。这些新研究使得投资者情绪这个领域变得更加丰富，在未来仍有很大的探索空间和应用价值。


