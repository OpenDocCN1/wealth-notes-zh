  md: '值。噪声交易者模型及有限套利也为行为金融学的发展铺平了道路。如今，系统性风险和投资者行为偏差成为驱动资产价格变化的两大动力，它们也共同推动了人们关于资产预期收益率截面差异的理解。图A.1简要汇总了学术界关于资产价格的研究脉络。


