- pgno: 129
  md: '关于动量的成因，一部分学者将其归因于系统性风险敞口。具体来说，动态风险敞口假说认为赢家组合和输家组合有着不同的、时变的系统性风险暴露。因此，多空对冲构建的动量因子组合有着时变的系统性风险敞口，需要获得风险溢价补偿。Geczy
    and Samonov（2016）利用长达近200年的美股数据研究发现，在一个市场状态的初期，动量组合对于当前的市场状态有着负的暴露，从而导致该时期的大幅损失，这意味着动量组合需要获得更高的收益来弥补相关的风险。Daniel
    and Moskowitz（2016）将此形象地描述为“动量崩溃”（momentum crashes），并指出这一尾部风险正是动量的风险溢价来源。Liu and
    Zhang（2008）指出赢家组合对产出增长率因子有着更高的短期暴露，这可以较好地解释动量效应。他们发现额外的因子暴露主要来自赢家组合，而输家组合的因子暴露则在不同时期保持稳定。Chordia
    and Shivakumar（2002）和Antoniou et al.（2007）则认为经济周期有助于解释动量效应。Yin and Wei（2020）基于中国市场数据发现，总体盈利的不稳定性（aggregate
    profit unstability）有助于解释动量因子的表现。但也有学者并不认可这类解释，例如，Griffin et al.（2003）和Ji et al.（2017）反对使用宏观经济变量解释动量效应。NovyMarx（2015b）则自成一派，认为价格动量效应来自盈余动量（earnings
    momentum），当控制盈余动量之后，价格动量便不再显著。


    除风险补偿外，更多的学者认为投资者行为偏差能更好地解释动量效应。Daniel et al.（1998）的经典研究认为，投资者对其私有信息的过度自信及有偏的业绩自我归因会造成动量效应。Hur
    and Singh（2016）进一步指出反应不足是主要原因。其次，Grinblatt and Han（2005）认为投资者心理账户的存在导致了处置效应，拉大了股票价格与其基本面价值之间的差异，进而导致了动量效应。他们发现，在控制了未实现盈利值（capital
    gain overhang）后，动量效应不再显著。第三类解释是推定预期偏差，即投资者通过将当前数据外推来得到对未来表现的预期，而这一朴素估计（naïve estimate）是有偏的，Choi
    and Mertens（2019）是这方面的代表作。而Barberis et al.（2015）则更进一步，构建了部分投资者有推定预期的X-CAPM模型，用以解释资产预期收益的截面差异。知情交易也是一种有趣的解释。Chen
    and Zhao（2012）发现，在知情交易概率较大的股票中，动量表现优异；反之，在知情交易概率较小的股票中，股价则没有明显的持续性。除上述发现外，另有研究表明收益序列的过度相关性是动量的收益来源。例如，Lewellen（2002）发现高度分散的规模因子组合和价值因子组合仍表现出非常显著的动量效应，且公司和行业特质不足以解释，而只能归因于收益序列的过度相关性。最后，市场情绪也是另一类重要的解释（Stambaugh
    et al.2012）。Li and Yeh（2011）基于中国A股市场的数据，指出空头组合蕴含的市场情绪越强烈，动量效应就越显著。Antoniou et
    al.（2013）等也提供了市场情绪对动量效应有显著影响的证据。


    虽然有如此多的理论和实证支持动量效应，但仍有不少学者提出了质疑和批判。相关的问题主要包括三点，其一，有研究认为动量的收益其实来自对其其他经典风险因子的暴露。例如，当控制了规模和低波动因子后，动量因子的超额收益在经济和统计意义上都大幅下降（Liu
    2019）。此外，NovyMarx（2015b）认为价格动量完全由盈余动量这一基本面特征所驱动。其二，空头端对动量收益的贡献较大，但由于在实践中卖空并不容易，因此动量因子对实际因子投资的作用有限。其三，Patton
    and Weller（2020）指出由于动量往往有很高的换手率，因此其纸面收益难以很好地转化为实际交易盈利。'
