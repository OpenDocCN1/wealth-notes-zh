  md: '因子上的暴露也是随时间变化的），因此需要定期进行上述两步，完成对因子模拟投资组合的更新。学术界通常称上述更新为再平衡（rebalance），且再平衡的频率多为每月或每年。在每期构建了新的因子模拟投资组合之后，计算该组合在当前时刻和下一个再平衡时刻之间的收益率。在时序上如此往复，就得到因子收益率的时间序列。


    通过排序法，人们可以方便地构建因子模拟投资组合，计算因子收益率以及由排序法得到的L个投资组合的收益率。一旦有了这些数据，检验因子预期收益率，以及考察L个投资组合收益率的单调性就构成了检验的内容。学术界将上述检验称为投资组合排序检验（portfolio
    sort test）。下面依次说明这两个检验内容。


    投资组合排序检验最重要的目的是检验因子预期收益率。在关于因子的研究中，原假设通常为因子预期收益为零。由第1章的定义可知，因子的预期收益率应该大于零。因此，检验关注的是依据样本数据计算出的因子收益率，能否在给定的显著性水平下拒绝原假设。令{λt}（t=1,2,⋯,T）代表因子收益率时间序列，则因子预期收益率的估计λ̂以及其标准误（standard
    error）s.e.(λ̂)分别为：


    λ̂ = 1/T Σ_{t=1}^T λ_t

    (2.1)

    s.e.(λ̂) = std(λ_t)/√T

    (2.2)


    其中std（λ_t）表示λ_t的标准差。上式说明将{λ_t}在时序上取平均值就得到预期收益率的估计。有了λ̂和s.e.(λ̂)，便可在原假设下（即λ=0）计算t-值（t-statistic），进行t-检验：


    t-值 = λ̂ / s.e.(λ̂)

    (2.3)


    它满足自由度为T-1的t分布。根据t-值和t分布可计算出（双尾）p-值，通过t-值或p-值就能够判定在给定的显著性水平下接受或拒绝原假设。依照学术界的惯例，通常使用0.05和0.01的显著性水平，在大样本下它们对应的t-值阈值分别约为2.0和2.6。因此，一旦样本数据计算出的收益率的t-值高于2.0，就认为该结果在原假设下是显著的①。如果原假设（因子预期收益率为零）无法被拒绝，那么被研究的因子就不满足预期收益率大于零的要求，因此t-值是否高于2.0就是一个重要的判定依据②。本书第3章到第5章的实证分析中将汇报检验结果的t-值。


    除此之外，由于一个好的因子应能够解释个股超额收益的截面差异，因此排序法关注的第二个问题就是依照排序变量高低得到的L个投资组合的收益率是否有很多好的单调性，这可以通过计算收益率和排序变量分组的秩相关系数（rank
