  md: '由Barillas and Shanken（2018）提出的贝叶斯方法Ⓥ也常被用于多因子模型的比较。该文作者是计量经济学大佬，且又发表于金融学顶刊Journal
    of Finance，因而备受关注。考察多因子模型：


    $$R_t^e = \alpha + \beta \lambda_t + \varepsilon_t$$


    令Σ=cov（εₜ），如果原假设α=0成立，那么预期收益率就满足E[Rᵉ]=βλ。

    Barillas and Shanken（2018）提出的贝叶斯方法假设多因子模型的参数β和Σ满足特定的非正常先验分布（improper prior）Ⓥ。而对于参数α，它在原假设下为零，在备择假设下满足多元正态条件分布f（α|β，Σ）=N（0，τΣ）（τ>0是一个参数）。在该方法中，因子收益率和资产收益率为观测到的数据。有了参数和数据，Barillas
    and Shanken（2018）通过计算边际似然度（marginal likelihood）来比较不同的多因子模型。令D代表数据、Mᵢ代表第i个模型，则边际似然函数为：


    $$\operatorname{prob}(D|\mathcal{M}_i)=\iint f(D|\mathcal{M}_i,\alpha,\beta,\Sigma)f(\alpha|\beta,\Sigma)f(\beta,\Sigma)d\alpha
    d\beta d\Sigma \tag{2.81}$$


    由定义可知，边际似然度是在给定模型Mᵢ下，观察到数据D的条件概率。在贝叶斯模型比较中，不同模型的后验概率比与它密切相关。假设两个多因子模型Mᵢ和Mⱼ，则它们的后验概率之比满足：


    $$\frac{\operatorname{prob}(\mathcal{M}_i|D)}{\operatorname{prob}(\mathcal{M}_j|D)}=\frac{\operatorname{prob}(\mathcal{M}_i)}{\operatorname{prob}(\mathcal{M}_j)}\frac{\operatorname{prob}(D|\mathcal{M}_i)}{\operatorname{prob}(D|\mathcal{M}_j)}
    \tag{2.82}$$


    式中，等号右侧第一项是两个模型先验概率之比；而第二项就是它们的边际似然度之比，它又被称为贝叶斯因子（Bayes factor）。在多因子模型比较中，通常假设两个模型的先验概率一样，因此边际似然度的高低就会最终主宰模型的选择。


    上述描述虽然简要，但它就是Barillas and Shanken（2018）一文的核心。利用该方法，Stambaugh and Yuan（2017）比较了他们提出的四因子模型和Fama
    and French（2015）五因子模型以及Hou et al.（2015）四因子模型。该文是将贝叶斯方法用于多因子模型比较的代表性研究之一。相较于GRS检验或均值一方差张成检验来说，贝叶斯方法在学术界的使用要少一些。这一方面和它被发表的时间较短有关Ⓥ，另一方面该方法也存在一些被质疑的地方。


    2020年，贝叶斯统计学的大佬Siddhartha Chib同样在Journal of Finance发文对Barillas and Shanken（2018）的方法提出了挑战（Chib
    et al.2020）Ⓥ。该文直截了当地认为Barillas and Shanken（2018）的方法有误，并给出了改进方法。


    Chib et al.（2020）指出上述贝叶斯方法中参数的先验设定存在问题。简单地说，在具体使用时，在参数β和Σ所满足的非正常先验分布中需要确定一个常数的取值。而只有当所有待比较的多因子模型满足以下三个性质时，采用边际似然度来挑选模型才是合理的。这三个条件是：（1）不同模型的参数βᵢ和Σᵢ（下标i代表模型i）满足同样的非正常先验分布；（2）该分布中的常数对所有模型相同；（3）不同模型的参数空间一样。Chib
