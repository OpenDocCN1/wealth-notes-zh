  md: '# 4.3 多因子模型比较：来自A股的例子


    本节通过一个简单的例子说明如何使用2.5节介绍的GRS检验和α检验比较两个多因子模型。需要明确的是，本节论述的重点在于如何应用相关的计量经济学方法比较模型，而不是对比两个模型孰优孰劣。


    # 4.3.1 两个模型


    为了使实证结果对A股市场最具借鉴意义和研究价值，入选的第一个多因子模型正是Liu et al.（2019）针对A股市场提出的三分子模型。该文于2019年发表于金融学顶级期刊Journal
    of Financial Economics，参照Fama-French三因子模型，提出了适合A股市场的三因子模型1。中国版三因子模型同样包括市场、价值和规模三因子。然而，该文针对A股市场做了两个特别的处理，使得他们提出的模型更加符合中国股市2。第一，该文规避了中国股市的壳价值污染问题。由于A股的IPO发审制度不健全，造成优秀企业在A股上市成本高、时间长。在这种情况下，有些企业则选择“弯道超车”，通过收购市值非常低的上市公司来借壳上市。上述情况使得A股市场中市值最小的一部分股票具有很好的“壳价值”。它们的收益率很大程度上和壳价值挂钩，且远远偏离这些公司的基本面，这就是壳价值污染问题。壳价值的存在对A股的实证资产定价研究和因子投资均带来了挑战。为了降低壳价值污染的影响，Liu
    et al.（2019）在实证中剔除了市值最低的30%的股票。其次，与Fama-French三因子不同，该文采用EP取代BM作为构建价值因子的排序变量，使用EP和市值的双重排序构建了价值因子。如果说针对壳价值污染而做的处理无可厚非，那么使用EP取代BM来构造价值因子则并没有那么令人信服，因为它几乎全部是来自实证方面的考虑，即在该文的实证中，EP比BM更能显著地解释股票预期收益率的截面差异。


    为什么说上述选择并不十分令人信服呢？回顾本书3.4节和3.6节关于价值和盈利因子的实证结果可知，BM在小市值中的作用要远远高于在大市值中的作用；另一方面，在A股中使用ROE为变量构建的盈利因子在小市值中的表现显著弱于其在大市值中的表现。由于EP=BM×ROE，因此当市值最低的30%的股票因壳价值污染问题被剔除，而仅保留其他大市值的股票时，BM的效果就会较使用全部股票时变差，而ROE和EP的效果则会较使用全部股票时变得更好。此消彼长，这就不难理解为什么在Liu
    et al.（2019）一文中EP比BM更能解释股票的预期收益。


    近年来学术界也有一些针对A股市场的研究表明BM和EP之间各有千秋，并没有任何哪个显著优于另一个。举例来说，Cakici et al.（2017）和Hsu et
    al.（2018）分别以1994年到2011年和2008年到2016年为实证区间，均发现在上述区间内BM比EP更能预测股票的预期收益率。Qiao（2019）则使用了自2000年到2017年的实证窗'
