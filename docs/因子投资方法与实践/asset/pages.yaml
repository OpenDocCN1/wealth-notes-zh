- pgno: 313
  md: '特征因子调整法的核心是自助法（bootstrap）。该方法将样本因子协方差矩阵 \hat{\Sigma}_\lambda 视为“总体”，并以它作为数据生成过程（data
    generating process）的已知参数，通过模拟（~simulation）计算出该参数下的“样本”协方差矩阵，记为 \tilde{\Sigma}_\lambda。使用
    \hat{\Sigma}_\lambda 和 \tilde{\Sigma}_\lambda 分别求出对应的特征因子协方差矩阵 D 和 \tilde{D}。由自助法的性质可知，\tilde{D}
    和 D 之间的偏差近似等于 D 和真实但未知的特征因子协方差矩阵之间的偏差。使用该偏差来调整 D 并进而计算 \hat{\Sigma}_\lambda 就可以得到真实协方差矩阵
    \Sigma_\lambda 的更好的估计。下面来看具体步骤。


    （1）对因子样本协方差矩阵 \hat{\Sigma}_\lambda 进行特征分解得到特征向量矩阵 U 和对角矩阵 D。


    （2）令 D（k）表示 D 对角线上的第 k 个元素。对于特征因子组合 k，假设其收益率满足正态分布 N（0，D（k））。在第 m 次模拟中，使用该分布生成全部
    T 期样本，作为特征因子 k 的收益率序列。对全部 K 个特征因子进行上述操作得到 K×T 收益率矩阵，记为 b_m。使用 b_m 和 U 计算出因子收益率矩阵
    \tilde{\lambda}_m：


    \tilde{\lambda}_m = U b_m \tag{7.39}


    式中下标 m 表示第 m 次模拟。


    （3）计算因子收益率 \tilde{\lambda}_m 的“样本”协方差矩阵 \tilde{\Sigma}_{\lambda m}：


    \tilde{\Sigma}_{\lambda m} = cov\left(\tilde{\lambda}_m, \tilde{\lambda}_m\right)
    \tag{7.40}


    （4）对 \tilde{\Sigma}_{\lambda m} 进行特征分解，得到对应的特征向量矩阵 \tilde{U}_m 和对角阵 \tilde{D}_m。


    （5）由于“真实”的协方差矩阵 \hat{\Sigma}_\lambda 已知，利用它和 \tilde{U}_m 求出“真实”的特征因子协方差矩阵，记为 D_m：


    D_m = \tilde{U}_m'' \hat{\Sigma}_\lambda \tilde{U}_m \tag{7.41}


    （6）将上述（2）到（5）步重复 M 次。在每次模拟中，对给定的特征因子 k，比较 D_m 和 \tilde{D}_m 对角线上第 k 个元素的差异，取全部
    M 次模拟差异的均值，按照式（7.42）计算平均偏差：


    \nu(k) = \frac{1}{M} \sum_{m=1}^{M} \sqrt{\frac{D_m(k)}{\tilde{D}_m(k)}} \tag{7.42}


    式中 D_m（k）和 \tilde{D}_{m}(k) 分别表示 D_m 和 \tilde{D}_m 对角线上第 k 个元素。


    （7）在模拟中假设收益率满足正态分布以及平稳性。然而在真实世界中，实际的收益率序列无法很好地满足上述两点。为此，需要在偏差式（7.42）的基础上对其进行额外的缩放，以应对经验波动率偏误。缩放后，特征因子
    k 的偏差 \nu_s（k）为：


    \nu_s(k) = a\left(\nu(k) -1\right) +1 \tag{7.43}'
