  md: '```

    PMU = 1/2 (S/P + B/P) - 1/2 (S/U + B/U)   (4.6)

    ```


    # 4.1.4 Fama–French五因子模型


    Fama and French（2015）在Fama–French三因子模型的基础上添加了盈利和投资两个因子，提出了新的五因子模型：


    ```

    E[R_i] - R_f = β_{i, MKT}（E[R_M] - R_f）+ β_{i, SMB} E[R_{SMB}] + β_{i, HML} E[R_{HML}]
    + β_{i, RMW} E[R_{RMW}] + β_{i, CMA} E[R_{CMA}]  (4.7)

    ```


    式（4.7）中，E[R_{RMW}]和E[R_{CMA}]分别为盈利因子和投资因子的预期收益率，β_{i, RMW}和β_{i, CMA}分别为个股i在这两个因子上的暴露。每年六月末，使用最新财务数据对股票重新排序并对规模、价值、盈利和投资四个因子的投资组合进行再平衡。


    该模型从股利贴现模型出发并利用Miller and Modigliani（1961）的结果推导出t时刻公司市值M_t满足如式（4.8）关系：


    ```

    M_t = Σ_{τ=1}^{∞} E[Y_{t+τ} - dB_{t+τ}] / (1 + r)^τ   (4.8)

    ```


    其中，Y_{t+τ}是t+τ期的净利润，dB_{t+τ}是未来t+τ期的账面价值的变化，r是股票长期的预期收益率。将式（4.8）两边同时除以t时刻公司的账面价值B_t可得：


    ```

    M_t / B_t = [ Σ_{τ=1}^{∞} E[Y_{t+τ} - dB_{t+τ}] / (1 + r)^τ ] / B_t   (4.9)

    ```


    Fama and French（2015）通过分析式（4.9）提出了如下关系：


    +   • 当除了 M_t 和 r 的其他变量不变时，更小的 M_t（或更高的 B_t / M_t）对应更高的 r；

    • 当除了 Y_{t+τ} 和 r 的其他变量不变时，更高的 Y_{t+τ} 对应更高的 r；

    • 当除了 dB_{t+τ} 和 r 的其他变量不变时，更高的 dB_{t+τ} 对应更低的 r。


    上述后两点说明r和预期盈利呈正相关、r和预期投资呈负相关。在实证中，如何围绕预期盈利和预期投资构建因子呢？这方面的研究可以追溯到Fama and French（2006）。该文专门检验了预期盈利和预期投资这两个维度和预期收益率的关系。在计算预期盈利和预期投资时，Fama
    and French（2006）既检验了使用历史数据作为预期的朴素估计（naïve estimate），又考虑了使用回归分析预测的方法。


    对于预期投资，当使用总资产变化的历史数据作为预期投资的朴素估计时，分析结果显示它和收益率之间呈显著的负相关性。而当采用回归计算预期投资'
  merge: -1
  img_proc: true
- pgno: 163
  md: '时，却并没有发现它和收益率之间的显著关系[2]。Fama and French（2006）从计量经济学的角度对两种方法的结果进行了大量探讨，并最终选择了使用历史数据进行朴素估计来计算预期投资。对于预期盈利，使用历史ROE数据和回归预测的差异很小，因此Fama
    and French（2006）也采用了朴素估计。上述处理方法也最终被保留到了Fama and French（2015）中。值得一提的是，按照DDM，代表投资的变量应该是账面价值的预期变化，而非总资产。Fama
    and French（2015）坦言他们比较了分别使用账面价值和总资产的两种方法，发现使用后者排序的话，股票收益率在截面上的差异更大，因此选择了总资产的变化。


    在构建因子时，与Fama and French（1993）相似，对于新加入的盈利因子和投资因子，Fama and French（2015）依次使用ROE以及过去一年总资产变化率和市值进行2×3双重排序，分别得到六个投资组合（图4.3）[3]。首先以NYSE中上市公司的ROE的30%和70%分位数为界，把NYSE、NASDAQ以及AMEX三大交易所的上市公司依据ROE高低分为稳健（Robust，即ROE在70%分位数之上）、中性（Neutral，即ROE介于30%和70%分位数之间）及疲软（Weak，即ROE在30%分位数之下）三组。这三组和市值高低独立排序共得到六个投资组合：S/R、S/N、S/W、B/R、B/N及B/W。每个投资组合的收益率使用各组成分股收益率的市值加权得到。对于盈利因子，由于预期盈利和预期收益率呈正相关，因此使用稳健组（S/R和B/R）和疲软组（S/W和B/W）的收益率之差构建盈利因子（Robust-Minus-Weak，RMW）：


    ```

    RMW = 1/2 (S/R + B/R) - 1/2 (S/W + B/W)          (4.10)

    ```


