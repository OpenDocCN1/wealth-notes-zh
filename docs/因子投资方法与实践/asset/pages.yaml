    # 7.5.3 按因子波动择时


    如果说按因子动量择时是从收益率的角度确定权重，那么因子择时的另外一个角度就是因子的风险。在这种方法下，往往不对因子收益率做任何假设，而仅仅利用因子收益率的波动率和相关性。常见的因子波动加权方法包括最小方差、风险平价和波动率倒数加权。


    最小方差的目标是使得整个因子组合风险最小，其在最小方差前沿上具有唯一性，处于前沿最左侧。风险平价最早由Qian（2005）提出，从风险的角度进行均衡配置，以追求所有证券对组合的风险贡献相同。世界著名的对冲基金桥水（Bridgewater）的全天候基金就采用了风险平价模型，因其常年的优异表现使得这种配置方法被发扬光大。波动率倒数加权是风险平价的特殊形式，是AQR在进行因子研究时常用的工具，例如Asness
    et al.（2015）在汇总多个风格因子时就用的该方法。波动率倒数加权比较简单，直接用因子波动率进行加权，给予低（高）波动因子更多（少）的权重，其表达式为：


    ```

    ωₖ = (1/σₖ) / Σ_{j=1}^K 1/σⱼ  (7.91)

    ```


    式中σₖ为因子k的波动率。波动率倒数加权由于只需要考虑每个因子的风险，而不需要对它们之间的相关性进行估计，因此也被称为朴素风险平价。波动率倒数加权是风险平价的简化形式，当资产收益率之间的相关系数相等时，波动率倒数加权等同于风险平价。从波动的视角决定因子权重，主要出发点是降低风险和回撤。Rabener（2018）对比了在风险平价和等权重两种方式下的因子表现，发现前者的最大回撤要明显小于后者的；但从收益的角度来看，并没有明确的结论。


    # 7.5.4 按市场情绪择时


    本书6.4节详细介绍了对市场情绪的衡量以及它和异象的关系。与使用因子本'
