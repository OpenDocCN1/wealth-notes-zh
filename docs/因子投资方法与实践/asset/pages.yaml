- pgno: 381
  md: '$P_{it}=E_t[m_{t+1}x_{it+1}]\quad\text{(A2)}$


    其中的$m$被称作随机折现因子（stochastic discount factor）；$E_t$意味着在$t$时刻对状态变量$s$的概率空间求期望。这个公式称作无套利定价公式（no-arbitrage
    pricing formula），它正是资产定价的基础。接下来的故事就从$P=E[mx]$讲起。


    # 2 短期不可预测性


    首先来看短期的情况。


    假设两个非常近的时点。在这之间，无风险收益率近似为零，且因为时间很短，因而可以假设折现因子$m$在不同状态下的变化不大。在这些假设下，$m$近似等于1。进一步而言，假设未来的支付等于出售该资产的价格，因此由$P=E[mx]$可知：


    $P_t=E_T[P_{t+1}]\quad\text{(A3)}$


    上式意味着短期内价格的上升或下降是随机的，收益率难以预测。在检验短期内能否预测方面，Fama做出了重大的贡献，主要包括以下两个方面。第一方面是对收益率序列的直接统计检验。虽然在Fama之前，有诸如Samuelson（1965）和Mandelbrot（1966）这样的开创性研究，但Fama无疑是系统性研究收益率统计特性的第一人——他在其1963年的博士论文（后于1965年全文发表在Journal
    of Business上）中使用序列相关性检验、游程检验（runs test）及过滤准则检验（filter test，即使用特定的规则对收益率序列过滤，然后考察其是否能战胜买入持有）检验了短期收益率无法预测，这对后续的相关研究产生了巨大的影响。在收益率为不可预测下，有效市场这个概念也应运而生。


    Fama对市场有效性的最大贡献来自Fama（1970）提出的联合假说（joint hypothesis）问题。它指的是为了检验市场有效性，首先要有一个正确的资产定价模型。只有知道了在模型给出的均衡状态下资产的预期收益率，才有可能正确地检验市场是否有效。此外，Fama（1970）还对有效市场假说的三种形式，即弱式（weak）效率、半强式（semi-strong）效率及强式（strong）效率进行了讨论。


    Fama的第二个贡献是和他的学生在Fama et al.（1969）一文中首次提出了事件研究（event study）的方法，该文是事件分析的开山鼻祖。事件分析的对象是和资产价格相关的新息（事件）发生前后的资产价格“行为”。Fama
    et al.（1969）为此提出了开创新性方法论，主要包括三个方面。


    +   （1）将市场的收益率从个股的收益率中排除，将个股异常收益率（abnormal return）作为研究重点，从而剔除市场时序波动的影响。


    +   （2）在时间轴上，将事件发生的时刻记为时刻0，事件发生之前则在时刻0的左侧，事件发生之后则在时刻0的右侧。考察股票异常收益率在事件发生前、发生时及发生后的变化。


    +   （3）任何事件在个股上是否发生及发生的时间都是不同的，而由于（2）中'
