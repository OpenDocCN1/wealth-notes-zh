  md: '# 7.2 风险模型：以Barra为例


    风险模型是使用多因子模型进行主动投资管理中的另一个重要模块，其重要性不亚于收益率模型。正如1.1.4节解释的那样，通过多因子模型可以实现降维，方便地计算股票的协方差矩阵，并以此作为投资组合风险控制的依据。式（1.6）给出了股票协方差矩阵和因子协方差矩阵的关系。为方便下文的讨论，这里再给出一次：


    Σ = β Σλ β'' + Σe  (7.18)


    其中β=[β1, β2, ⋯, βN]''是N×K因子暴露矩阵；Σ（N阶矩阵）、Σλ（K阶矩阵）以及 Σe（N阶矩阵）分别为股票的协方差矩阵、因子的协方差矩阵以及随机扰动的协方差矩阵。由于股票收益率中随机扰动相互独立，因此Σe是对角阵。


    在因子投资中，有一些多因子模型的目的并非解释资产预期收益的截面差异，而是为了通过式（7.18）和各种统计学手段准确地估计资产协方差矩阵Σ。鉴于此，业界更倾向于称它们为风险模型。在这些模型之中，Barra模型无疑是最著名的。它在全世界不同国家的股票市场因地制宜地推出了多因子模型，并通过几代模型的迭代和统计手段的升级，在事前估计Σ方面做了很多努力。本节介绍Barra针对中国A股市场推出的CNE5多因子模型。


    # 7.2.1 Barra多因子模型


    CNE5模型中包含一个国家因子，P个行业因子（记为I1, ⋯, IP）以及Q个风格因子（记为S1, ⋯, SQ）。令K=1+P+Q，表示一共有K个因子。在t时刻，该多因子模型为：


    [R1t^e; R2t^e; ⋮; RNt^e] = [1; 1; ⋮; 1] λCt + [β1t-1^I1; β2t-1^I1; ⋮; βNt-1^I1]
    λI1t + ⋯ + [β1t-1^IP; β2t-1^IP; ⋮; βNt-1^IP] λIPt + [β1t-1^S1; β2t-1^S1; ⋮; βNt-1^S1]
    λS1t + ⋯ + [β1t-1^SQ; β2t-1^SQ; ⋮; βNt-1^SQ] λSQ t + [u1t; u2t; ⋮; uNt] (7.19)'
