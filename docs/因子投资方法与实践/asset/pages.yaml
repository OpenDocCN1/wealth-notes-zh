    （3）使用收益模型中的因子，以及风险模型中和上述因子无关的因子，联合起来构成一个全新的风险因子模型。此方法与第二种方法的差别是，前者仅是因子暴露间的替换，而不涉及因子收益率本身。本方法则使用具有差异的因子构建全新的风险因子模型。调整风险模型虽然很直接，但在实际中也会受到不少的限制。比如当风险模型来自第三方的商用模型时，就难以对其进行改动。此外，从以上描述可知，对风险因子的改造首先需要识别收益和风险模型之间相近的因子，但如何定义相近的因子却十分模糊，因此容易引入未知的
    العديد不确定性。因此，上述方法虽然提供了很好的思路，但实际的作用却很有限。更好的降低错位的方法则是直接对投资组合优化进行改进。


    既然收益和风险模型的错位会导致最优化高估R_⊥^α的权重，因此一个自然的想法就是在优化问题中对R_⊥^α进行额外的惩罚。Bender et al.（2009）最先提出了这种改进思路，并将优化问题的目标函数由式（7.53）改为：


    ```

    max_ω (R^α)′ω − ½ ζ ω′Σω − θ(ω′R_⊥^α)²    (7.56)

    ```


    式中θ是非负系数，而新加入的−θ(ω′R_⊥^α)²则代表了对R_⊥^α的惩罚。这种做法也带来了一个新的问题，即如何确定系数θ。首先考虑最简单的情况，即风险因子无法解释的收益R_⊥^α是纯噪声。这听上去似乎不可思议，但如果收益模型和风险模型中的因子非常接近，这种情况就有可能出现。当R_⊥^α是纯噪声时，显然不希望优化过程赋予其任何权重，因此θ的取值应该足够大。然而，更一般的情况是R_⊥^α绝非纯噪声。每个基金经理都有独门的预测收益率的变量，它们可以获得风险因子模型无法解释的收益率，因此R_⊥^α代表了正收益。然而，虽然R_⊥^α无法被风险因子模型解释，但并不意味着它没有风险[2]。在这种情况下，θ应该和R_⊥^α的风险成正比。


    本节对投资组合优化中潜在的收益和风险模型错位问题进行了介绍，希望能够引起因子投资使用者的思考。忽视这个问题将给优化结果引入未知的确定性，影响投资组合的事后风险收益特征。在国内相关因子投资的研究中，例如券商金融工程报告中，使用不同的收益和风险模型十分常见，却没有对错位问题进行任何处理，说明该问题尚未得到足够的重视。收益和风险模型错位对实际因子投资的定量影响值得持续关注。


    如果收益和风险模型相同，则不存在错位的问题。接下来的7.3.2节将以此为前提讨论几种常见的投资组合优化目标函数。


    # 7.3.2 目标函数


    为了介绍投资组合优化中常见的目标函数，令μ表示股票相对无风险收益的超额收益，Σ代表股票的协方差矩。以μ和Σ作为输入，最著名的目标函数当属均值'
