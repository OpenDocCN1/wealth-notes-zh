    元，而2016年财报中它的净PP&E仅为0.78亿美 元。为了对此进行修正，Sloan（2019）将PP&E的累积贬值加回到账面价值中。重新计算后，ROE较前值8.4%降低了50%以上，仅为3.9%。以这个水平来说，BIG5并没有创造很好的回报。除ROE之外，质量因子的另外两个指标也出现了不同程度的失真。修正之后，债务股本比便从0.065一下跳升至1.500，使之直接成为高杠杆的公司。对于应计项目与资产比，BIG5在2016年年末有一大笔应付账款。因此，仅看其财报上的高额现金流实际上并不能正确判断其真实的运营情况，该现金流在未来难以持续。一旦通过基本面分析搞清楚了BIG5所处的行业背景以及其财报后面的来龙去脉，便会对此恍然大悟。在和依靠因子投资而选出BIG5的机构的比拼中，Stadium
    Capital笑到了最后。这个例子说明仅用简单的因子并不能很好地捕捉财报中其他有价值的信息。即便是在因子投资主宰的今天，科学、严谨的基本面分析仍有很高的价值。


    # 6.7.4 思考和讨论


    客观地说，基本面投资的“因子化”和基本面分析的使用者所具备的“能力圈”是不同的。对于普通投资者来说，正因为不具备专业金融分析师的基本面分析能力，才使用因子进行基本面量化投资。使用价值、质量等基本面因子的目标是以概率取胜。换句话说，也许使用有限个因子挑出来的个别股票并不靠谱（比如上文说的BIG5），但只要控制好仓位，让选出的标的足够分散，那么还是能够依靠概率优势和大数定律获得长期的风险溢价。


    长久以来，学术界的主流观点认为，由于有限套利，市场并非完美有效。错误定价的大小应刚好等于通过基本面分析（以发现该错误定价）的实施成本。显然，使用一些广为人知的因子来实现基本面量化投资并没有实施成本，所以因子投资者应该对它能够取得的效果有客观、合理的认知。就因子投资的效果来说，样本内的过度挖掘以及样本外的过度拥挤都会对其产生很大的负面影响。基本面投资的“因子化”并不等同于基本面分析。


    在Security Analysis中，Benjamin Graham和David Dodd就曾明确地指出投资者不应仅仅依靠几个量化的指标来制定其投资决策，而是应该进行全面系统的基本面分析。随着近几十年投资学作为一门独立学科高速发展，数量化的触角已经渗透到投资流程的方方面面，如今可以说是无量化不投资。时至今日，广义的量化投资已经发展成为基于现代科学方法的理论体系、研究方式以及工程系统的总和。因此，基本面分析和量化方法（如因子投资）的合二为一注定会发生。当'
