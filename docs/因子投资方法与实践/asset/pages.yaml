  md: '# 3.5 动量因子


    # 3.5.1 动量因子起源


    动量因子——严谨地说，截面动量因子——是一个颇受争议的因子。实证资产定价领域的代表人物Eugene Fama一贯旗帜鲜明地反对将动量视作一个系统性因子。但另一方面，该因子又实实在在地存在于不同国家及不同大类资产中。其受关注的程度大概只有前面介绍的规模和价值因子能与之相提并论。动量因子背后反映的是股票间的相对强弱趋势会延续，“强者恒强，弱者恒弱”；通常通过做多过去一段时间表现最好的股票（称为赢家组合）、同时做空这段时间表现最差的股票（称为输家组合）来构建动量因子。


    动量因子源自Jegadeesh and Titman（1993）提出的动量效应。他们在每月月末，依据过去X个月的股票总收益率排序，将股票分为10组，按照等权重方式做多收益率最高的一组股票，同时做空收益率最低的一组股票，并持有Y个月。为了规避路径依赖对结果的影响，两位作者构建了Y个不同的子策略，每个子策略的起点相隔一月，最后再取Y个组合的收益均值代表动量效应。实证结果显示，无论是多空组合还是纯多头组合，都可以获取显著且稳健的超额收益，且规模、市场β和季节性等常见因素都无法解释动量效应。


    Jegadeesh and Titman（2001）利用样本外数据进一步检验了动量效应，并以此回应了那些认为Jegadeesh and Titman（1993）是数据挖掘结果的批判。Rouwenhorst（1998,1999）在12个欧洲国家市场和20个新兴市场发现了显著的动量效应，上述发现为支持动量存在于其他市场中提供了有力的证据。类似地，Liu
    et al.（1999）和Hon and Tonks（2003）表明英国股市存在动量效应。De Groot et al.（2012）指出在新兴市场同样有着显著的动量效应，而Asness
    et al.（2013）更是提供了动量效应在全球多个市场广泛存在的证据。与上述研究成鲜明对比的是，在日本和中国A股市场中，动量效应的表现可谓惨不忍睹。


    除了个股动量，行业动量也非常显著。Moskowitz and Grinblatt（1999）是这方面的代表性研究。此外，在债券、大宗商品和外汇等资产中也存在动量效应。举例来说，Jostova
    et al.（2013）、Houweling and Van Zundert（2017）和Israel et al.（2018）研究了公司债市场的动量效应，Shen
    et al.（2007）和Narayan et al.（2015）讨论了商品期货市场的动量效应，而Menkhoffet al.（2012）和Orlov（2016）表明外汇市场同样存在显著的动量效应。


    # 3.5.2 动量因子成因'
