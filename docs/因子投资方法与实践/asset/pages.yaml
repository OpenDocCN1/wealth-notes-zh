    # 5.1.3 G-Score


    与Piotroski（2000）的初衷不同，Mohanram（2005）设计G-Score的目的是从成长股（即低BM）中区分出基本面好的赢家和基本面差的输家，从而解决投资者面对高估值而错失像Amazon这种大牛股的问题。G-Score从三个维度衡量公司的基本面，包括盈利能力、保守会计准则和盈利可持续。其中，保守会计准则指的是广告和研发等产生的支出往往被费用化处理，因而降低当期利润和现金流。然而，这些支出与未来的盈利直接挂钩，投入越大未来潜力越大。此外，一家公司盈利和增长是否确定也很重要，最怕遇到业绩“坐过山车”的情况。为此，G-Score中纳入了盈利波动和收入增长波动两个指标，以体现成长的可持续性。


    使用1978年到2001年的美股数据，Mohanram（2005）检验了G-Score的效果。结果表明，在美股上G-Score对低BM股票具有较好的区分能力，得分最高的组获得了3.1%的年化收益，最低组的年化收益则为-17.5%。也就是说，即使在高估值的股票中也存在基本面足够支撑估值的股票，这和学术界认为的成长股投资还是存在区别的。如果单从空头组合来说，那些估值高且基本面又差劲的公司，收益率显著为负。虽然在实际中难以通过做空来获取收益，但至少可以将它们纳入黑名单池子，降低潜在风险。


    针对A股，表5.2给出了G-Score的计算方法，它使用8个指标对股票进行综合打分。考虑到数据可得性，本书使用了销售费用代替广告费用。一方面广告费用是销售费用
    的重要组成部分，另一方面销售费用信息更加丰富饱满。其次，由于A股上市公司从2002年开始披露季度资产负债表和利润表，从2003年开始披露季度现金流量表，两个方差指标在2005年之前几乎缺失，这会在整个实证窗口的前期造成一定的影响。最后，每个指标得分（应计除外）是和同行业的其他股票比较'
