- pgno: 130
  md: '针对动量的尾部风险和对动量的批判，学者们也构建了一些拓展方法来优化动量的表现，其中较为知名的包括尾部风险调整的动量和残差动量（residual momentum）。关于前者，最出名的研究当属Daniel
    and Moskowitz（2016）。该文指出基于对动量策略均值和波动率预测的动态动量策略，可以将静态动量策略的夏普比率提升一倍。类似地，Barroso
    and Santa-Clara（2015）发现，通过引入目标波动率进行仓位管理也可以显著提升动量组合的表现。残差动量（Blitz et al.2011）由个股的残差收益率计算，定义为个股收益率中无法被给定多因子模型解释的部分。Blitz
    et al.（2011）的研究发现残差动量可获得非常显著的收益，且不再有动量崩溃的烦恼。其背后的原因在于求解残差的过程剥离了传统动量因子对系统性风险因子的敞口，从而可以获得更加稳健的收益。Blitz
    et al.（2017）和Huij and Lansdorp（2017）为此提供了更多有关国际市场的证据。Chang et al.（2018）发现残差动量甚至在日本股市中也可获得显著的超额收益，Chaves（2012）也有类似发现（不过他定义残差动量的方法略有不同）。而Lin（2019,
    2020）发现残差动量在A股市场同样有效。但笔者认为，虽然实证结果看似支持残差动量存在于A股市场这一结论，但其背后的原因需要进一步探索。


    此外，还有一些研究将动量拓展至更广泛的市场中，以及价格动量之外。例如，Chui et al.（2010）研究了文化对不同市场中动量表现的影响，并指出越是崇尚个人主义的国家，其投资者过度自信和自我归因的偏差越严重、市场成交越活跃、动量因子的表现越好。Jiang
    et al.（2020）则研究了新闻动量，他们将股票日收益拆分为由信息驱动的和由非信息驱动的两部分，并指出由信息驱动的收益有较强的连续性，因而买入高信息驱动收益的股票，并做空低信息驱动收益的股票，可获得显著的超额收益。


    # 3.5.3 动量因子实证


    熟悉A股市场的读者可能有这样的体会，无论使用哪个时间周期计算动量都无法出现显著的动量效应，而更多时候表现出来的是反转效应，即前期涨幅高（低）的股票未来的收益率低（高）。根据学术界的发现，在t月末将t-12到t-1之间的11个月内的总收益作为动量因子的排序变量。从定义可知，在计算动量时排除了t月本身的收益。这样做的目的是排除短期反转对动量造成的影响。举例来说，假如现在是2019年1月末，依照上述方法将使用2018年1月末到2018年12月末，即2018年2到12这11个月内的总收益计算动量。实证期内动量变量的数据覆盖度如图3.20所示。'
