    由于简单易用，排序法在学术界和业界关于风格因子的研究中得到了广泛的应用。值得一提的是，在前文介绍排序法的时候默认的都是使用单一变量对股票排序，因此它也被称为单变量排序（univariate
    sorting）。但不要忘记，排序法仅仅是构建因子模拟投资组合的一个相对“粗暴”的方法。根据定义，因子模拟投资组合应该在非目标因子上没有暴露，然而排序法却难以控制其他因子的影响，这是它最大的缺点。举个假想的例子，如果高BM的股票全都是大市值股票、低BM的股票全都是小市值股票，那么当使用BM这个单一变量排序的时候，构建的价差组合在无形之中也同时做多了大市值股票、做空了小市值股票。因此，这个价差组合虽然是围绕BM构建的，但其收益率却受到BM和市值的共同影响，因而难以客观评估BM的贡献。为了尽可能排除其他因子的干扰，常见的做法是使用多个变量进行双重排序或三重排序，这些方法统称为多重排序法。'
