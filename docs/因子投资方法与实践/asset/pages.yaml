  md: '于改善基于线性回归的计量经济学估计方法的表现。因其简单有效，主成分分析（principal component analysis，即PCA）备受关注，而在资产定价领域的相关应用也主要集中在对PCA方法的应用和拓展上。这背后的原因与经典的因子收益率估计方法（如Fama–MacBeth回归）面临的问题有关。经典方法需要明确指定因子结构才能进行有效估计，且容易受到遗漏变量和测量误差的影响。另一方面，越来越多的研究指出，人们其实并不知道真实的定价因子是什么，反而更倾向于将真实因子视作是隐性的因子（latent
    factors），并利用降维的手段来同时估计因子暴露和因子溢价。PCA方法也由此进入实证资产定价的舞台。


    隐性因子模型（latent factor model）是统计学中很常用的一个模型，在推荐系统等机器学习实践中有非常广泛的应用。对于资产定价问题，隐性因子模型的表达式为：


    ```

    R_{it}^e = β''_i λ_t + ε_{it}    (6.35)

    ```


    其中，R_{it}^e 是t期资产i的超额收益，λ_t 是t期的因子溢价向量，β_i 为资产i的因子暴露向量，而ε_{it} 是随机扰动。乍看起来，模型（6.35）与一般的多因子模型并无差异，但它的特别之处是真实因子无从观测（隐性的含义），即人们并不知道λ_t
    的取值，因而因子暴露β_i 也无从知晓。


    此时PCA方法便派上了用场。它通过提取资产收益协方差矩阵的主成分来估计风险溢价和风险暴露。Giglio and Xiu（2019）在这方面做出了开创性的贡献，利用PCA构建了一种无需观测到全部的真实因子便可准确估计因子溢价的新方法。在隐性因子模型框架下，任一可观测因子的风险溢价等于它对隐性因子的暴露乘以隐性因子的溢价。计量经济学中的两个重要性质使得PCA在估计因子溢价时扮演了重要的角色。首先，利用线性多因子模型的旋转不变性，即便只能观察到隐性因子的某个满秩变换，也不妨碍估计可观测因子的溢价。其次，只要隐性因子足够强,可,
    PCA总是可以复原对因子空间的某个旋转变换（Bai 2003）。通过结合这两个性质，Giglio and Xiu（2019）指出虽然真实因子不可观测，但利用PCA方法，仍可以准确估计因子溢价。


    Giglio and Xiu（2019）基于美国市场的实证分析表明，相比经典方法，该利用PCA方法得到的估计量确实有显著的优势。一般来说，Fama–MacBeth回归结果高度依赖模型的控制变量。以动量因子为例，不控制其他因子和控制Fama–French三因子两种情况下，其因子溢价符号竟然相反，且都高度显著。而该PCA方法则能够获得令人满意的估计结果。对于可交易因子，其因子溢价与时序均值较为接近；对于加总的市场流动性、金融中介杠杆率等不可交易因子，其估计结果也与理论方向一致。


    将PCA方法应用于资产定价的另一项研究来自Rapach and Zhou（2019）。该文首先通过稀疏PCA从120个宏观经济变量中提取了10个稀疏主成分，并指出这些主成分可大体对应债券的名义收益率水平、通胀率、产出率等经典指标，因而具有极好的可解释性；其次利用Giglio
    and Xiu（2019）的方法估计了这些稀疏宏观因子（sparse macro factors）的溢价，并发现债券的名义收益率水平、住宅和乐观情绪有显著的风险溢价。最终，他们用这三个因子和市场组合一起构建了一个稀疏宏观四因子模型，并发现该四因子模型具有同Hou–Xue–Zhang四因子模型和Fama–French五因子模型可比的解释力。'
