  md: '# 第2章


    # 因子投资方法论


    本章介绍学术界在进行实证资产定价研究时最常用的方法。熟悉并掌握它们有两个作用。首先，在金融学、经济学、会计学的顶级期刊，以及投资界的最高水平期刊上，大量关于实证资产定价和因子投资的文章均会使用这些方法[1]。掌握它们有助于读懂最新的论文，获得研究因子的新思路。其次，很多方法（例如投资组合排序法和Fama–MacBeth回归）在业界的因子研究中得到了广泛的应用。


    本章内容共分为8节，把因子投资方法论中的各知识点按照严谨的先后顺序有机地串联在一起。为了帮助读者更好地学习本章内容，以下首先简要说明本章的结构，每节的开头则会进一步解释上下文的关联。本章的2.1节首先介绍如何使用排序法构建因子模拟组合并进行检验，它是一切的基础。无论是研究多因子模型还是异象，都需要用到它。接下来的2.2节是本章的核心，说明如何使用不同的回归方法对多因子模型进行检验。2.3节将进一步对因子暴露和因子收益率检验进行解读。因子投资中的一个重要内容是通过异象获取多因子模型无法解释的超额收益，本章的2.4节就来讨论这个问题。2.5节解读比较不同多因子模型的方法，它一直是学术界研究的热点。本章的2.6和2.7两节内容相对独立。2.6节说明因子正交化的重要性。在业界进行因子投资时，因子正交化是十分常见的处理方式。2.7节介绍广义矩估计。掌握这个非常强大的计量经济学工具将为今后持续展开因子投研工作打下坚实的基础。最后，2.8节对全章内容进行总结，给出因子投资中使用这些方法的建议。


    在正式介绍不同的方法之前，先来说说本章的写作风格。本章的内容将不可避免地涉及大量的数学公式。然而，本书的目标并不是成为纯理论的“数学”书，因此行文不会变成定理或者证明的罗列。美国金融协会前主席、实证资产定价领域的顶尖学者John
    Cochrane教授曾说“在现实和学术中，金融中的数学其实并不难。难的是理解如何使用这些方程，以及它们对这个世界的真正意义。”[2]本书作者十分认可上述观点，因此本书记在介绍数学公式和推导时会遵循以下两个目标：（1）尽量阐述数学背后的直观含义，帮助读者理解公式所传递的内容；（2）把公式的表达和推演的逻辑说清楚，帮助读者在实际因子研究中应用这些方法。对于第一点，行文中会加入必要的图示，通过可视化解释公式的含义；对于第二点，行文中会扯一些看似不那么重要的细节，比如矩阵和向量的阶数。希望本章'
