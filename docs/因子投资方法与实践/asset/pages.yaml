  md: '# 2.7 广义矩估计


    在实证资产定价研究中，除了多因子模型外，还有很多其他的模型。其中一个重要的模型是由Lucas（1978）和Breeden（1979）提出的基于消费的资产定价模型（Consumptionbased
    CAPM，CCAPM）。CCAPM的理论虽然优雅，但是模型中消费和资产收益率之间的关系是非线性的，传统的统计学方法在检验该模型时无能为力。在学术界为如何检验CCAPM绞尽脑汁的时候，Hansen（1982）提出了广义矩估计（Generalized
    Method of Moments，GMM）山。


    GMM是一个非常强大的计量经济学方法，在实证资产定价研究的历史上起到了举足轻重的作用。而如今无论是在经济学领域还是金融学领域，GMM因其数学上的优雅和特性上的强大而被广泛运用，Hansen（1982）也早已成为计量经济学领域被引用量最高的文章之一。虽然GMM最初是被用来检验CCAPM的，但其强大的性能和“标准化”的使用流程使得它可以被方便地应用于检验线性多因子模型（Cochrane
    2005的第13章对此有精彩的论述）。为此，作为因子投资方法论章节中的进阶内容，本节对GMM进行介绍。笔者相信，掌握GMM将会帮助读者在未来进行更深入的因子投资研究。


    本节的目标是从直观出发揭示GMM蕴含的数学之美。以下行文中试图把公式掰开揉碎讲清楚，从而帮助感兴趣的读者理解复杂公式背后的本质。Cochrane（2005）指出，学习GMM时最大的障碍就是涉及的数学符号繁多。只要搞清楚这些符号，GMM背后的数学精髓其实是非常简单的，因为GMM的核心最终能够归结为计算样本均值的方差（the
    variance of the sample mean）。希望本节的论述能带给你这种恍然大悟之感。接下来就从样本均值的方差说起。


    # 2.7.1 样本均值的方差


    考虑某随机变量u_t。假设它在某个样本内的取值为0、-1、3、3、-3。式（2.99）计算出了u_t的样本均值ū：


    ū = E_T[u_t] = 0.4    (2.99)


    由于u_t是一个随机变量，因此其样本均值ū也是一个随机变量。虽然它在上述样本中的取值为0.4，但假如能够乘坐时光机回到过去“重写历史”，得到不同的样本，那么在不同的样本中，样本均值的取值也会有所变化。假设除样本一（就是上面这个样本）之外，还有三个样本。每个样本中的u_t和它们的样本均值ū如表2.5所示。'
