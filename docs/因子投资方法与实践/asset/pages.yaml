  md: '接下来看因子收益率。当采用等权重时，由做多小市值Small组、做空大市值Big组（即Small-Big组合）构造的规模因子的月均收益率为1.41%（t-值为3.11）；当采用市值加权时，规模因子的月均收益率为1.40%（t-值为2.90）。由于这二者的t-值均高于0.01显著性水平对应的阈值2.6，因此可安全地在该显著性水平下拒绝原假设。（对于书中的实证分析结果，0.05和0.01显著性水平对应的t-值阈值分别为约2.0和2.6。在后文汇报实证结果时，由于t-值大小可以清晰地传递出结果是否显著，因此将不再特意强调在某个显著性水平下接受或拒绝原假设。）


