  md: '# 3.2 市场因子


    # 3.2.1 市场因子起源


    由第1章的论述可知，多因子模型源于资本资产定价模型CAPM。CAPM是仅包括市场因子的单因子模型。在多因子模型普及之前，CAPM是人们计算资产预期收益率的第一范式。下面就来看看市场因子。由式（1.1）可知，CAPM模型的数学表达式为：


    E[R_i]-R_f = β_i (E[R_M]-R_f)   (3.1)


    CAPM模型指出资产的预期超额收益与市场组合的预期超额收益成正比，比例β_i系数代表着资产系统性风险。由于市场组合的预期超额收益在长期内为正，CAPM模型意味着人们所熟知的“高风险，高收益”。这一简单而有力的模型在20世纪60年代由Treynor（1961，1962），Sharpe（1964），Lintner（1965a，1965b）以及Mossin（1966）分别独立提出，但又以William
    Sharpe和John Lintner的版本最为知名，因此它也常被称作Sharpe-Lintner CAPM模型。这些学者从不同的方法出发，却都得到了同样的结论，CAPM的强大生命力由此可见一斑。


    假设投资者使用收益率的均值和方差来刻画股票的回报与风险[2]。对于给定的预期收益水平，投资者总是可以找到一个组合使得组合风险最小。将这些组合连接起来形成一条曲线便构成最小方差前沿。进一步，假设投资者可以按照无风险利率水平自由地借贷。从无风险资产向最小方差前沿做切线，得到切点组合（tangency
    portfolio），该组合是所有组合中夏普比率最高的（可参考2.5.3节的说明）。理性投资者应根据自己的风险偏好组合无风险资产和该切点组合：对于风险偏好较高的投资者，可以借入资金加杠杆；而对于风险偏好较低的投资者，则可以将一部分资金投资该切点组合，另一部分资金则按照无风险利率借出。由于所有投资者都投资该切点组合，因而这个切点组合就是市场组合。


    # 3.2.2 对CAPM的质疑


    由于投资者可按无风险利率自由借贷这一条件往往过于严苛，使得CAPM模型受到了一些批判。Black（1972）和Black et al.（1972）的研究提出，即便放松了这一限制（即不存在无风险资产）也可以推导出另外一个版本的CAPM模型——Black
    CAPM模型。事实上，Black CAPM模型在市场因子之外又加入了第二个因子，因而是一个两因子模型：


    E[R_i] = β_i E[R_M] + (1-β_i) E[R_z]   (3.2)'
