    # 3. 贝叶斯收缩


    贝叶斯收缩（Bayesian shrinkage）是一种常见的统计手段，其含义是利用贝叶斯框架将先验和新息结合起来得到后验。在业界，贝叶斯收缩被广泛地应用于预期收益率和协方差矩阵的估计上。例如，大名鼎鼎的Black–Litterman资产配置模型就是将贝叶斯收缩作用于预期收益率预测上的应用（Black
    and Litterman 1992）四。又比如，Ledoit and Wolf（2003）将贝叶斯收缩应用到协方差矩阵的估计上，取得了很好的效果。


    回到关注的问题，实证数据显示特质性波动率（即特质性收益率的标准差）在样本外的持续性很差，说明样本协方差矩阵Σ̂_ε并不是很好的估计。具体来说，将所有股票按照样本特质性波动率的大小分成十档，并计算每档的平均偏差统计量。对于特质性波动率小的档，偏差统计量显著大于1.0，说明使用历史数据计算的样本特质性波动率低估了这些股票在样本外的事后特质性波动率；而对于特质性波动率大的档，偏差统计量显著小于1.0，说明样本特质性波动率高估了这些股票在样本外的事后特质性波动率。既然使用样本数据得到的估计不准，那么考虑通过贝叶斯收缩使用先验来对其进行矫正。先验就是人们对特质性波动率的先验判断，将先验和样本数据线性组合在一起就得到后验协方差矩阵的估计。这个过程可以视作使样本波动率数据向先验靠拢，这就是“收缩”一词的含义。


    为了得到先验，首先将全部股票按市值分成十档。令s_i表示股票i的市值、σ̂_i表示股票i的样本特质性波动率（上标i代表特质性）。对于任意给定的市值档g，利用s_i计算股票i在该档内的权重：


    ω_i = s_i / Σ_{j∈M_g} s_j  (7.46)


    式中M_g表示市值档g包含的全部股票。以ω_i为权重，计算M_g内全部股票的特质性波动率加权平均：


    σ̄_g^i = Σ_{i∈M_g} ω_i σ̂_i^i  (7.47)


    对于所有属于M_g的股票，使用经式（7.47）计算出的σ̄_g^i作为它们特质性波动率'
