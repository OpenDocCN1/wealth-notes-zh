  md: '# 5.1 估值高低中的异象


    接触过股票的人都知道市盈率（PE）的概念，它常被拿来用作分析的依据。除了PE之外，常被人挂在嘴边的还有市净率（PB）、市销率（PS）和市现率（PCF）。这些指标长得很像，本来也是一个模子里刻出来的，即价格和某个基本面指标之比。在投资中，人们通常将上述和价格有关的比率称为价格乘数（price
    multiples），表示价格偏离基本面的程度，该值越大表明估值越高，该值越小表明估值越低山。


    知道估值指标的含义非常容易，在实际应用时却寸步难行。股票市场中的人们经常遇到的问题是：PE已经很高了，还追不追？PE已经很低了，是否可以买入？前者害怕买贵了，无缘无故当了“接盘侠”，但又害怕错过了大牛股；后者担心入场太早，或者买到烂公司的股票，陷自己于万劫不复。为了更形象地说明这一点，来看看看美股上Amazon（亚马逊）和IBM的例子（图5.1）。2014年6月，Amazon的PE高达511，而IBM的PE只有12。用PE来衡量价格是否合理的话，Amazon已经贵得离谱，存在回调的可能；而IBM属于大甩卖的便宜货，谁见了都得动心。站在当时来看，这样的分析完全没错；然而站在此力量来看，最终的走势可谓惊为天人。如果当时卖掉Amazon去抄底IBM，一定会追悔莫及。


    金融教科书告诉人们，估值水平很重要。然而Amazon和IBM的例子又狠狠地给了人们两耳光。是教科书错了，还是上面的例子只是偶然？事实上，估值高低确实很重要，但必须结合基本面来看，这就是本节要讨论的问题。'
