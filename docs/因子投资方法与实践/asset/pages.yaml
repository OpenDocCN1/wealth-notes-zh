- pgno: 67
  md: "出了检验统计量。假设有$N$个用于检验的资产，并假设待检验的多因子模型中有$K$个因子。令$\\hat{\\alpha}=[\\hat{\\alpha}_1,\\\
    hat{\\alpha}_2,\\cdots,\\hat{\\alpha}_N]'$表示全部$N$个资产的定价误差向量，$\\hat{\\varepsilon}_t=[\\\
    hat{\\varepsilon}_{1t},\\hat{\\varepsilon}_{2t},\\cdots,\\hat{\\varepsilon}_{Nt}]'$表示$t$期$N$个资产无法被该多因子模型解释的残差向量，$\\\
    hat{\\lambda}_t=[\\hat{\\lambda}_{1t},\\hat{\\lambda}_{2t},\\cdots,\\hat{\\lambda}_{Kt}]'$表示$t$期$K$个因子的收益率向量，则根据（2.16）可知GRS统计量为：\n\
    \n$$\\frac{T-N-K}{N}\\left(1+E[\\lambda_t]'\\hat{\\Sigma}_\\lambda^{-1}E[\\lambda_t]\\\
    right)^{-1}\\hat{\\alpha}'\\hat{\\Sigma}^{-1}\\hat{\\alpha}\\sim F_{N,T-N-K}$$\
    \ \n其中 $\\hat{\\Sigma}_\\lambda=\\frac{1}{T}\\sum_{t=1}^T[\\lambda_t-E[\\lambda_t]][\\\
    lambda_t-E[\\lambda_t]]'$ \n$\\hat{\\Sigma}=\\frac{1}{T}\\sum_{t=1}^T\\hat{\\\
    varepsilon}_t\\hat{\\varepsilon}_t'$ \n\nGRS检验有两个吸引人的优点。首先，它的$F$-统计量是有限样本（finite\
    \ sample）下的统计量，即GRS检验给出了给定样本大小$T$下这些定价误差应满足的联合分布，该检验是高度精确的。当样本量趋于无穷的时候，$\\hat{\\\
    alpha}_i$的联合分布渐进趋于$\\chi^2$分布，但在有限样本下使用$\\chi^2$分布并不可靠，这就凸显了GRS检验的价值。其次，GRS检验有非常高的检验效力。当然，任何事物都有两面。GRS统计量的精确性高度依赖正态分布假设。在现实中，该假设可能过于严格而无法满足，这会降低GRS检验在实践中的吸引力。另外，GRS检验要求样本数$T$大于资产个数$N$。这意味着当用来检验的资产个数很大时，需要使用更长窗口的历史数据来计算GRS统计量。\n\
    \n尽管以上种种，时至今日，GRS检验仍被学术界广泛使用。比如Liu et al.（2019）使用GRS检验比较了他们提出的中国版三因子模型和Fama and\
    \ French（1993）三因子模型在A股市场上的效果。在GRS检验中，将这两个模型之间的因子互为解释和被解释变量。结果显示，中国版三因子模型能够解释Fama\
    \ and French（1993）中的因子，而Fama and French（1993）三因子模型无法解释中国版三因子，因此中国版三因子模型更适用于A股市场[2]。\n\
    \n借助计算机的运算能力，人们可以根据式（2.16）式很容易地求出GRS统计量。但是这个看上去复杂的数学公式对理解该检验背后的本质似乎没有太大帮助。好消息是，GRS统计量还有另外一种形式：\n\
    \n$$\\frac{T-N-K}{N}\\left(\\left[\\frac{\\sqrt{1+\\hat{\\theta}_{N+K}^2}}{\\\
    sqrt{1+\\hat{\\theta}_K^2}}\\right]^2-1\\right)\\sim F_{N,T-N-K}\\quad\\text{(2.68)}$$\
    \ \n\n式中，$\\hat{\\theta}_{N+K}$表示由全部$N$个资产和$K$个因子构成的某个事后（ex post）最大夏普比率投资组合的夏普比率；$\\\
    hat{\\theta}_K$表示由全部$K$个因子构成的某个事后最大夏普比率投资组合的夏普比率。因此，GRS统计量可以直观地理解为：在$K$个因子之外加入$N$个资产之后，能够获得的最大夏普比率是否显著高于仅由$K$个因子实现的最大夏普比率，如果夏普比率显著提高，那么该因子模型就不能解释这$N$个资产。注意，即便原假设被拒绝，也仅能说这$N$个资产作为一个整体无法被该多因子模型解释，但却无法知道具体哪个或哪几个资产发挥了作用，这是因为GRS检验是联合检验。2.5.3节将从式（2.68）引出GRS统计量的几何解释。"
