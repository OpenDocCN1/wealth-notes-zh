- pgno: 272
  md: '由于曝光导致错误定价减弱、因子拥挤以及交易成本等原因，因子样本外表现变差是因子投资中必须面对的问题。这也催生了业界对因子择时的极大兴趣，并尝试使用各种手段持续挖新的因子（新的因子意味着曝光少、拥挤度低）。Arnott
    et al.（2019）一文也严肃讨论了投资人在因子投资中常犯的三大错误，第一条就是对样本内的表现非理性外推，造成对因子样本外的表现缺乏理性预期。另外，当因子表现变差时，人们由此想到的另一个问题是因子是否会失效。如果因子背后的原因是风险补偿或者错误定价，那么还是有理由相信因子长期来看会有效。在这方面，Asness（2015）有过精彩的讨论，认为诸如价值、动量等因子在长期来看会持续有效。这背后的原因主要包括：


    （1）从风险的角度来看，因子承担了某些不可预知的风险，需要得到相应的补偿。只要风险是真实存在的，承担这种风险长期就会得到回报。


    （2）从行为金融学的角度来看，投资者认知偏差和信息传播速度等因素可以导致股票的价格偏离内在价值。只要投资者“动物精神”（Keynes 1936）不消失，那么错误定价就会一直存在，就给了使用因子获取收益的机会。


    最后，还有一个事实也不得不提。很多人知道了一个因子，并不代表他会利用这个因子，也并不代表他无条件信任这个因子，更不代表他会坚定不移地使用这个因子。知道并不意味着懂，懂并不意味着会用，会用也并不意味着始终如一。因此，有充分先验依据的因子的长期表现依然值得期待。


    > [1]这还是在允许等权重构建因子的前提下。当使用市值加权时，该数值降低至0.07%。'
