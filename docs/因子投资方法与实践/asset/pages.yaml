    # 5. 基本原则


    在进行财务数据的研究时，调整和更正的存在会增加数据处理的复杂度。一个处理方式是，不考虑调整和修正，只使用第一次披露的数值。这种方式简单易'
  merge: -1
  img_proc: true
- pgno: 103
  md: '实现，不会引入未来数据；但其缺点是无法反映调整或更正的新信息，信息利用不充分。另外一种方法是始终采用调整后和修正后的最新数据，这种方式也简化了计算过程，缺点是在历史回溯时会利用未来数据，导致结果偏差较大。这两种方式为了追求简单而牺牲了精确性，因而并不推荐。实证资产定价研究和因子投资是非常精细的过程，因而需要遵循以下原则：在当前时点利用可得的最新信息（即point-in-time原则）。按照这个原则，既能保证充分利用最新的数据，例如考虑调整和更正，或者将业绩预告和业绩快报考虑进来，也可以避免使用未来数据。


