- pgno: 224
  md: '# 6.1 p-hacking和“因子动物园”


    不可否认，学术界在过去近三十年里对因子和异象的研究加深了人们对市场的理解。很多经典的异象和因子（本节统称为因子）更是长盛不衰。但是，正所谓物极必反，过度的挖掘也为实证资产定价和因子投资带来了负面的影响。为了竞逐在顶级期刊上发表文章，学者们过度追求因子在原假设下的超低p-值（即统计意义上“显著”）。由于有意或无意的数据窥探、使用不严谨的统计检验手段、错误解读p-值传达的意义，以及忽视因子背后的其他原因，使很多在功利心驱使下被挖掘出的因子仅仅是样本内过拟合的产物，在实际投资中根本站不住脚。为此，杜克大学教授、曾任美国金融协会主席的Campbell
    Harvey大声呼吁学术界应该后退一步，重新审视学术氛围和文化，真正做到以推动人们对金融经济学的正确认知为己任（Harvey 2017）。同样曾任美国金融协会主席的John
    Cochrane教授更是用“因子动物园”一词抨击学术界对挖掘因子的狂热：


    > “We thought 100% of the cross-sectional variation in expected returns come from
    the CAPM, now we think that’s about zero and a zoo of new factors describes the
    cross section.”——John Cochrane 上面这段话如今已成为学术界家喻户晓的金句。它说的是，从前人们认为CAPM模型可以解释资产预期收益率的截面上的全部差异，但现在人们却摒弃了CAPM并挖出了众多的因子来解释预期收益率的差异。那么，真的有那么多能够解释资产收益率的因子吗？答案显然是否定的。既然如此，是什么让学术界前赴后继、姮姮烈烈地挖因子呢？学术界又是如何挖的呢？回答这些问题就是本节的目标。


    # 6.1.1 何为p-值


    在检验因子预期收益率时，p-值（或与之相对应的t-值）是至关重要的，它告诉人们能在何种显著性水平下拒绝原假设。下面以p-值为对象展开讨论。在统计检验中，令原假设H₀为随机变量X=0，而在样本数据中观测到X的取值为x，则p-值表示在原假设H₀下随机变量X取到比x更极端的数值的条件概率（Fisher
    1925）。根据所分析的具体问题，极端事件又分为右尾极端事件、左尾极端事件，以及双尾极端事件。不同情形下，p-值的定义如下。


    +   • 右尾极端事件：p-值=prob（X≥x|H₀）；

    • 左尾极端事件：p-值=prob（X≤x|H₀）；

    • 双尾极端事件：p-值=2×min{prob（X≥x|H₀）, prob（X≤x|H₀）}。'
