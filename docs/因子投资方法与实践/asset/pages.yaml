    除了单一因子的指数外，业界的另一创新是将多个因子融合到一个指数化产品之中，从而实现同时投资于多个因子的目的。利用这样的产品，投资者只需要购买一个对应的ETF就可以分散化地暴露于几个相关性较低的风格因子上。这类产品中最著名的要数明晟的分散化多因子系列产品，它的目标是最大化地暴露在价值、动量、质量以及市值四个因子上。在该类产品线上，规模最大的ETF虽不如单一因子产品，但也仍然高达10亿美元。除了指数化产品之外，华尔街上还有数不胜数的管理人采用基于因子的方法实践着基本面量化投资。这其中不乏Dimensional
    Fund Advisors、AQR Capital Management、Arrowstreet Capital等耳熟能详的名字。这些管理人都有基于基本面因子的产品。上述发展推动了基本面投资“因子化”的盛行，但也使得这种投资手段逐渐变得拥挤。


    # 6.7.3 基本面投资“因子化”的不足


    毫无疑问，以因子为工具的基本面量化投资带给人们全新的投资途径。然而，仅基于几个财务指标来构建因子这种做法相对粗糙，在很多时候难以反映财务报表中所传递出来的最具价值的信息。从这个意义上说，基本面投资的“因子化”还远远不能取代基本面分析。下面借用Sloan（2019）中的一个例子来说明这一'
