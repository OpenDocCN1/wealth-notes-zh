  md: '的先验。有了先验和样本波动率，利用贝叶斯收缩将它们结合，得到股票i的后验特质性波动率：


    σ̂_i^{bs} = η_i σ̄_g^i + (1 − η_i) σ̂_i   (7.48)


    上式中等式左侧就是收缩后股票i的特质性波动率（上标bs代表贝叶斯收缩），等式右侧的第一项中的η_i是在收缩时赋予先验的权重（称为收缩强度系数）。η_i的表达式为：


    η_i = q|σ̂_i − σ̄_g^i| / [ (1/N_g Σ_{j∈M_g} (σ̂_j − σ̄_g^i)^2 )^{1/2} + q|σ̂_i
    − σ̄_g^i| ]   (7.49)


    式中q是一个经验压缩系数，N_g是M_g中股票的个数。式（7.49）中的分子以及分母中的第二项的|σ̂_i − σ̄_g^i|表示了股票i的样本特质性波动率和其先验之间的偏离程度；而式（7.49）分母中的第一项是M_g中所有股票的样本特质性波动率和其先验偏离程度的标准差，它是这些股票平均偏离程度的度量。最终的压缩权重η_i就由这两个偏离程度（以及经验系数q）决定：


    +   • |σ̂_i − σ̄_g^i|越大，说明股票i的样本特质性波动率和先验的偏离越大，因此倾向于相信先验而非样本波动率，所以赋予先验的权重η越 كبير。


    +   • |σ̂_i − σ̄_g^i|越小，说明股票i的样本特质性波动率和先验的偏离越小，因此倾向于相信样本波动率而非先验，所以赋予先验的权重η越小。


    最后，在式（7.49）中唯一剩下的就是要确定经验系数q。由于贝叶斯收缩的目标是降低个股特质性波动率的偏差统计量，因此通过综合考虑所有个股特质性波动率收缩前后偏差统计量的改进来找到合适的q值。


    作为风险模型，Barra模型在业界得到了广泛的使用和认可，因此整个7.2节也花了相当多的篇幅对其进行介绍。然而需要强调的是，任何模型都需要假设，模型本身也并无好坏之分。Barra模型仅是众多风险模型中的一个选择。随着学术界和业界研究的推进，很多估计资产协方差矩阵的新方法也应运而生。因子投资的践行者应该持有开放的心态，不断学习和吸收新的知识，争取在实际投资中能更好地控制风险。


    > [1] Barra已经被明晟（MSCI）收购。明晟于2018年8月月底推出了最新一代的中国模型CNE6。


    > [2] 本书2.3节详细阐述了如何确定因子暴露。


