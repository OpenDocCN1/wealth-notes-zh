  md: '理的核心概括。传统资产定价理论从投资者最优证券组合角度出发，和公司变量没有直接关系；而q-因子模型为实证资产定价研究开辟了一个新途径。


    将净现值原则变化一下得出：折现率=盈利率/投资成本。从这个式子出发，可以得到两个关于折现率的条件预期结论：当盈利率给定时，投资越多的公司（投资成本越高），折现率越低，股票预期收益率也越低；当投资给定时，盈利率越高的公司，折现率越高，股票预期收益率也越高。由此可知，股票收益率和投资成反比，和盈利率成正比。


    q-因子模型背后的数学模型考虑了一个两期（记为时刻0和1）的公司投资决策模型。假设在时刻0，某公司i的资产为A_i0、利润率是Π_i0（假设已知）；在时刻1，该公司的利润率是Π_i1，它是一个随机变量。对于时刻0和1，公司的现金流为每一时刻的资产乘以利润率：Π_i
    t A_i t, t=0,1。在这个两期模型中，公司的决策变量是时刻0的投资额I_i0。该模型假设公司时刻0的资产A_i0在t=1时全部折旧完，因此该公司在时刻1的资产正是其在时刻0的投资：A_i1=I_i0。除此之外，伴随I_i0而来的还包括一个调整费用：（a/2）（I_i0/A_i0）²A_i0。对于该公司，时刻0对于股东的回报是现金流减去投资额及投资的调整费用，即Π_i0
    A_i0−I_i0−(a/2)(I_i0/A_i0)²A_i0；而对于时刻1，由于不再有投资，因此其在时刻0的预期回报可以表达为E0[M1 Π_i1 A_i1]，其中M1是随机折现因子、Π_i1
    A_i1是时刻1的现金流、期望符号E的下标“0”代表时刻0时的预期。这两期的回报相加就是最优化的目标函数：


    ```

    max_{I_i0} Π_i0 A_i0 − I_i0 − (a/2) (I_i0/A_i0)² A_i0 + E0[M1 Π_i1 A_i1]    (4.17)

    ```


    该目标函数的最优解I_i0满足：


    ```

    1 + a I_i0/A_i0 = E0[M1 Π_i1]    (4.18)

    ```


    式（4.18）的左侧为投资的边际成本（第二项为边际调整费用）；右 precoce为边际效益预期被折现到时刻0。这个关系式也说明了4.1.5中提到的净现值原则。此外，由投资第一性原理（the
    first principle of investment）可知，投资收益率r^I（上标“I”表示投资收益率，为了区分股票收益率）应满足：


    ```

    E0[M1 r_{i1}^I] = 1    (4.19)

    ```


    比较式（4.18）和式（4.19）就可以得到投资收益率和边际成本及边际效益的关系：


    ```

    E0[r_{i1}^I] = E0[Π_i1] / [1 + a(I_i0/A_i0)]    (4.20)

    ```


    根据Cochrane（1991）和Liu et al.（2009）的研究结果，在上述模型设定下，公司的投资收益率等于其股票收益率（记为r^S），因此最终可以把股票收益率和上述从公司投资角度出发的经济学理论联系起来：'
