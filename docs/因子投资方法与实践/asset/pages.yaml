  md: '# 7.1 收益率模型：获取“阿尔法”


    在使用多因子模型作为量化工具来获取超额收益的实践中，收益率模型是最重要的模块。顾名思义，收益率模型就是为了预测收益率。业界很多量化研究员的主要工作正是集中于此。本节的目标就是把开发收益率模型时应注意的问题阐释清楚。


    # 7.1.1 基本术语


    在正式开始介绍之前，有必要阐明接下来要用到基本术语。收益率模型的作用是预测股票的收益率，从而获得超过基准的超额收益。在主动投资中，通常把全市场指数或者某个宽基指数的收益率选为基准。开发收益率模型的目标就是找到能够预测股票收益率的变量，这些变量往往是通过股票的量价或者财务数据计算的指标。在海外业界，这些变量有一个贴切的名字：return
    predictors，即收益率预测变量。由于收益率模型的作用是获得相对基准的超额收益，而超额收益通常由α表示，因此国内业界有时也把这些预测变量称为“阿尔法因子”。然而，在本书基于式（1.3）的统一视角下，“阿尔法因子”这个称呼是不准确，甚至错误的，其中存在两个问题。


    为了说明这两个问题，考虑以下的例子。第一，由于和收益率呈正相关，账面市值比（BM）常被拿来作为预测变量放在收益模型中。第二，特质性波动率异象的收益率无法被定价模型解释。因此，特质性波动率（IVOL）也是一个优秀的预测变量。在这两个例子中，BM和IVOL都是业界口中的“阿尔法因子”。


    下面来看第一个问题。首先，在本书围绕式（1.3）的统一视角下没有“阿尔法因子”这个概念。而如果将“阿尔法因子”拆成“阿尔法”和“因子”两个词，它们在本书的术语中指的也并非预测变量。回到上述例子。BM是构建价值因子的变量，使用它构建的投资组合是价值因子；IVOL是构建特质性波动率的变量，通过它构建的投资组合是特质性波动率异象。根据1.1.3节的说明，价值因子被称为定价因子，特质性波动率异象则被称为异象因子，而BM和IVOL分别是构建这两个因子的变量。学术界在实证资产定价研究中会严谨地区分这两类因子，且会区分因子和构建因子的变量。由于本书的术语遵循了学术界的惯例，因此“阿尔法”或“因子”在本书的术语中代表的是异象或者因子这些投资组合，而非它们背后的变量。这和业界使用“阿尔法因子”指代变量不同。


    再看第二个问题。回顾BM和IVOL的例子，前者是构建价值因子的变量，而后者是构建特质性波动率异象的变量。这两个例子说明收益率预测变量既可以对应式（1.3）右侧的βλ部分（如BM），又可以对应式（1.3）右侧的α部分（如'
  merge: -1
