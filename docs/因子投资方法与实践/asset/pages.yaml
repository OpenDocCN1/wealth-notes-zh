- pgno: 231
  md: '下，人们拒绝原假设的倾向性，即φ越小，越倾向拒绝原假设。利用原始检验的p-值或t-值，φ有以下两种计算方法：


    φ=-exp（1）×p-值×ln（p-值） （6.5）


    φ=exp-1×t-值²/2 （6.6）


    利用式（6.5）或式（6.6）中的φ和先验概率（待检验因子的先验概率需使用者自行估计），式（6.7）给出了后验贝叶斯p-值的计算方法：


    贝叶斯 p-值 = φ×先验概率 / 1+φ×先验概率 （6.7）


    作为后验概率，贝叶斯p-值的强大之处在于它回答了人们真正关心的问题：在（极端）事件发生的前提下，原假设为真的条件概率是多少，即prob（H₀|D）。使用后验贝叶斯p-值，Harvey（2017）对学术界的一些知名因子进行了分析。在分析中，该文考虑了三类不同的先验情况：非常不可能的因子（假设先验概率仅为2%），可能的因子（假设先验概率为20%），以及非常可能的因子，即有金融学或经济学理论支撑的因子（假设先验概率为50%）。


    Head et al.（2009）研究的“聪明的股票代号因子”是第一类的典型例子。它的意思是有些股票代号比另一些听上去更令人愉悦、更让投资人喜欢，因此这些股票有超额收益。显然，这听上去并不是什么靠谱的因子。在贝叶斯框架下，当假设其先验概率为2%时，该因子的后验贝叶斯p-值高达0.588，因此无法在任何常见的显著性水平下拒绝原假设。值得一提的是，该因子的原始p-值非常低，仅有0.0079，暗示着该因子能够获得显著的超额收益，但贝叶斯框架逆转了这个错误的结论。二十。第二类因子的代表是Fama–French五因子模型中的市值和盈利因子。在Fama
    and French（2015）中，这两个因子都有超低p-值。然而，它们的后验贝叶斯p-值分别为0.053（盈利因子）和0.117（规模因子）。可见，盈利因子的后验p-值仍然较低（虽然比原始p-值高很多）。最后一类因子的代表是市场因子。它的后验贝叶斯p-值为0.035，依然在0.05的显著性水平下显著。


    这三个例子说明了当人们有一个手段来回答正确的问题时（即prob（H₀|D）），便能够得到更加合理的结论。能够获得超额收益的因子不是不存在，但它们非常稀有，数量远远少于学术界挖出的上百个伪因子。需要说明的是，在实践中采用上述贝叶斯方法修正p-值也并非没有困难，比如它要求对先验概率进行估计。然而，这种重视先验的思想非常值得借鉴。它表明，在研究因子时，比起因子收益率在样本内的显著性，人们更应该关注因子背后是否有合理的解释。只有拥有合理的解释，该因子才可能是一个真实的因子，而非过拟合的产品。本书第6.5节将对因子背后的集中解释进行详细阐述。


    在过去的二十年里，金融领域的许多学者都在追逐超低p-值的道路上狂奔。然而，这么做的结果是人们在科学的道路上渐行渐远。科学研究的目标是为了推动人们对该学科的理解。为了实现它，应该确保所有的发现（不管是有效因子还是无效因子）都是可以复现的、经得起检验和推敲的。在顶级期刊中，只有Journal
    of Finance要求被录用的文章提供计算机代码；没有任何一个期刊要求作者提供数据，造成p-hacking的行为根本无法被复现。可喜的是这个现象正在发生转变，成果能够被复现也逐渐成为学术界的主流。除此之外，学术界和顶级期'
