- pgno: 212
  md: '因子模型，FAR在市值加权下的超额收益依然显著。比较等权重和市值加权的结果说明，反转异象更多地出现在小市值的股票当中，而市值加权由于避免了对于小市值的过度暴露而造成反转异象的减弱。在实际交易中，为了依靠FAR获得更高的超额收益，可考虑在满足换手率、流动性等必要约束的条件下，适当将反转组合向小市值倾斜。


    短期反转是股票市场上的一个经典异象。它不仅仅在A股中显著，在美股中亦是如此。在美股中讨论动量的Jegadeesh and Titman（1993）在计算动量因子时就特意把最近一个月剔除，其背后的原因正是一个月收益率的反转山。在A股中，有不少卖方研究报告对反转进行了研究和改进。由于非条件的反转异象本身已经十分显著，任何通过增加复杂度的“改进”得到的条件反转异象都会在样本内有更好的效果。然而，没有经济学或金融学依据的改进终究难以令人信服。本节使用F-Score作为代理变量，将基本面变化造成的影响从收益率中剥离出去，因而能够准确定位超跌的根本原因，并针对过度反应和流动性冲击的部分构建加强的反转策略。另外，价格的涨跌和基本面的强弱也会形成预期差。一旦预期差修正，这个经基本面锚定的反转异象就能获得比传统反转异象更高的超额收益。


    [1]Narasimhan Jegadeesh虽然因研究动量成名，但他其实早在动量之前就在Journal of Finance上发表过关于反转的研究（Jegadeesh
    1990）。'
