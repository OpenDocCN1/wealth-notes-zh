  md: '# 7.8 因子投资展望


    本节通过两方面展望因子投资未来的发展趋势。其中，7.8.1节介绍另类数据在因子投资中的作用。如今随着那些早已家喻户晓的因子被越来越多的人使用，很多因子的预期收益逐年降低（比如价值因子）。面对这种局面，人们开始从尚未被过度使用的数据源中寻找构造因子的灵感，这些数据源就是另类数据。然而，另类数据是否像想象中一样好使呢？7.8.1节将给出讨论和答案。接下来的7.8.2节将介绍如何使用因子进行大类资产配置。资产配置从来都是投资中的重要课题，而随着对因子和资产关系理解的加深，业界现在已广泛接受的观点是不同类的资产的收益率也都是被底层的有限个因子驱动的。在这个认知下，海外业界也已逐步从资产配置转型到因子配置。7.8.2节将就这个话题展开讨论。


    # 7.8.1 另类数据


    美国时间2018年10月25日，困境中的Tesla（特斯拉）股票取得9.14%的大涨，只因为在前一个交易日盘后发布的2018财年三季度财报大超华尔街预期。财报显示，Tesla的爆款车型Model
    3的产量在过去一个季度较之前几乎翻番，这无疑给投资人注入了一剂强心针，也引得市场一片狂欢。


    面对Model 3产量的大增和股票大涨反映出的市场信心，最高兴的人当属Tesla的掌门人Elon Musk。然而，除了Musk，同样高兴的恐怕还有另外一群人，他们就是另类数据公司Thasos以及它的很多对冲基金客户。因为在Tesla发布三季度财报之前，这群人大概早就凭借着信息优势预判到了这一点并提前布局。Thasos是怎么做到的？


    他们在一张在线地图上环绕Tesla位于美国加利福尼亚州Fremont占地370英亩的工厂创建了一个数字围栏，以隔离从Tesla工厂范围内发出的智能手机的位置信号。Thasos租赁了通过智能手机APP收集到的数万亿个地理坐标的数据库，并使用电脑程序密切监测从Tesla工厂中发出的手机信号。利用手机信号量，他们发现从2018年6月到10月，Tesla工厂夜间轮班时间增加了30%，因此推断Tesla的产能得到了极大的提高。Thasos将这个数据分享给了它的一些对冲基金客户。毫无疑问，这一数据发挥了巨大的作用。它是将另类数据应用于二级市场投资的一个经典案例。


    其实，另类数据并非什么新鲜概念。在几十年前，当人们仅通过量价数据进行交易的时候，财务报表数据就是另类数据；当财务数据被广泛使用后，分析师一致预期就是另类数据；当分析师一致预期家喻户晓之后，网络舆情数据就成了另类数据；当人们对网络舆情不再陌生之后，非结构化的文本数据就变成了另类'
