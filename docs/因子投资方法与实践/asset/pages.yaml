  md: '# 2.2 多因子模型的回归检验


    使用2.1节介绍的排序法，人们可以很容易地针对股票风格因子构建因子投资组合并计算其收益率。然而，多因子模型中最核心的问题是检验一系列因子解释异常的能力。本节就来说
    spray如何使用回归的方法检验多因子模型，其中涉及的不同方法包括时序回归检验、截面回归检验以及Fama and MacBeth（1973）回归检验。


    在下文的介绍中，令N和K分别代表资产和因子的个数。回顾一下本书第1章中的式（1.3），它指出资产预期（超额）收益和因子预期收益率之间满足如下关系：


    E[R_i^e] = α_i + β_i'' λ  (2.12)


    其中 R_i^e 代表资产 i 的超额收益，β_i 为资产 i 的 K 维因子暴露向量；λ 为 K 维因子预期收益率向量。多因子模型研究的核心理问题是资产预期收益率在截面上——即不同的资产之间——为什么会有差异。根据模型（2.12），如果一个资产在因子上的暴露β_i
    高，则它的预期收益 E[R_i^e] 也应该更高。


    再来仔细品一品这句话，即多因子模型（2.12）研究的是资产预期收益率在截面上的差异。站在本书提出的统一视角下，这是从截面角度来研究多因子模型的。在检验模型（2.12）时，不关心资产的收益率
    R_i^e 在时间序列上是如何随着每期因子收益率来波动的，只关心 R_i^e 的期望 E[R_i^e] 在截面上和对应的 β_i 之间的关系，因为模型（2.12）是关于均值的模型。多因子模型中所包含的因子代表了收益率的一种结构。一旦结构给定后，个股或者任何一个投资组合的预期收益率就完全由它在这些因子上的暴露决定——暴露高，预期收益率就高；预期收益率是因子暴露的线性函数。怎样找到最好的因子结构，即哪些因子使得个股在截面上的预期收益率区分度高，并让不能被该模型解释的定价误差
    α_i 部分尽可能低，就是多因子模型研究的问题。


    仍然晦涩？用图2.3解释一下（因为要做图，所以假设单因子模型）。图中横坐标为 β_i，纵坐标为 E[R_i^e]，每个点代表一个资产。图中这条直线就代表 E[R_i]=β_i
    λ，它的斜率 λ 就是因子的预期收益率。当模型不能被完美地满足时，资产的预期收益率 E[R_i] 和模型算出的 β_i λ 之间就会存在误差，它就是图中的
    α_i。'
