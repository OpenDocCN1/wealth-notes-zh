  md: '一方差模型。


    # 1. 均值一方差优化


    均值一方差优化的目标函数为：


    $\max_{\omega}\;\mu''\omega - \frac{\zeta}{2}\omega''\Sigma\omega$  (7.57)


    其中$\zeta$是风险厌恶系数。当不考虑任何约束时，式（7.57）的最优解为：


    $\omega_{\text{mvo}} = (\zeta\Sigma)^{-1}\mu\quad (7.58)$


    假设在实际投资中要求所有股票的权重之和为1（即$\sum_{i=1}^{N}\omega_i=1$），则加入此约束条件的最优解仅和式（7.58）相差一个缩放系数，因而可以写为：


    $\omega_{\text{mvo}} \propto \Sigma^{-1}\mu\quad (7.59)$


    均值一方差优化的好处是同时考虑收益和风险。对于给定的风险（表示为投资组合的波动率），该组合能够获得最高的预期收益；对于给定的预期收益，该组合能够满足最低的风险。这些性质使得均值一方差优化备受关注。然而，这种方法的缺点是最优投资组合$\omega_{\text{mvo}}$对输入参数$\mu$和$\Sigma$非常敏感。往往参数的细微变化都会造成最优权重的巨大波动。众所周知，股票的预期收益率是难以预测的，因此该方法对参数敏感的缺点使得它在实际投资中也没少被人诟病。


    为了避免使用$\mu$，其他仅以$\Sigma$为输入参数的目标函数相继被提出。仅使用$\Sigma$构造目标函数也可以规避7.3.1节谈到的错位问题，但这并不意味着收益模型就不再重要。事实上，人们可以使用收益模型预测股票的收益率，并通过无参数预测挑出预测值高的股票。然后，针对这些股票不再区分其收益率差异，而仅使用它们的协方差矩阵为输入参数构造目标函数，并进行优化。当仅使用$\Sigma$为参数时，主流的目标函数包括最小方差、最大多样化以及风险平价。


    # 2. 最小方差


    顾名思义，最小方差（minimum variance）就是要使最终投资组合的方差最小。其目标函数为：


    $\min_{\omega}\;\omega''\Sigma\omega\quad (7.60)$


    其最优解满足：


    $\omega_{\text{mv}} \propto \Sigma^{-1}1\quad (7.61)$


    # 3. 最大多样化


    令$\sigma=[\sigma_1,\;\sigma_2,\;\cdots,\;\sigma_N]''$代表股票收益率的标准差向量。最大多样化（maximum
    diversification）的目标是最大化股票线性加权波动率与投资组合波动率之比。这个比值越大，说明该投资组合中股票的多样化（分散化）越充分。此方法的目标'
