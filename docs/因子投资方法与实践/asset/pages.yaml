  md: '与Giglio and Xiu（2019）类似，Kelly et al.（2019）同样将真实因子视作不可观测的隐性因子并利用PCA方法同时估计因子溢价和资产的因子暴露。但他们同时指出经典的PCA只适用于估计静态模型，而对于动态条件资产定价模型则无能为力。为了解决这一问题，他们采用Kelly
    et al.（2017）提出的工具变量PCA方法（IPCA），引入大量公司特征作为股票因子暴露和超额收益的工具变量，构建了IPCA因子¹。该方法受到以下两点的启发。第一，公司特征和因子暴露密切相关¹，这使得用公司特征当作因子暴露的工具变量成为可能。其次，一家公司的各种特征会随着时间变化，这使得很难利用时间序列分析方法构建个股的条件预期收益率模型。以往研究者更多采用投资组合排序法，但该方法的局限在于只能处理较少的特征。一旦需要更多特征来充分刻画资产的预期收益率截面差异，它就会面临极大的挑战。而通过将因子暴露参数化为公司特征的函数，则可以较好地解决这一动态面板估计问题。


    实证结果显示，IPCA方法的确具有较好的表现。相对经典的CAPM、Fama–French三因子模型等，有相同数量主成分因子的IPCA模型能够更好地刻画个股的风险，且经典因子相对于IPCA因子的增量信息非常有限。进一步地发现，随着因子数量增加，IPCA因子的样本外切线组合²的夏普比率也显著提升。当使用六个IPCA因子时，夏普比率高达惊人的4.05。相比之下，Fama–French五因子加上动量这六个因子的样本外切线组合的夏普比率仅有1.37。从均值一方差的角度来看，IPCA因子极高的夏普比率表明它们能在解释股票收益的共同运动的同时，通过因子暴露解释不同股票收益之间的差异。通过对比研究，Kelly
    et al.（2019）指出，真正起作用的是公司特征的动态变化，其对于理解因子暴露非常重要，这也呼应了IPCA想解决的核心问题，即如何在动态条件定价模型中得到因子溢价和暴露的估计。最后，通过分析每个因子对不同公司特征的暴露可以发现，IPCA因子有不错的可解释性。例如，第一主成分可近似理解为价值或杠杆率因子，第二主成分对应市场因子，第三和第四主成分则分别对应动量和短期反转因子。


    上述这些利用PCA的研究虽然新颖，但它们仅仅利用了收益率的二阶矩信息，即协方差矩阵。Lettau and Pelger（2020）认为，这么做会丢掉原始因子和收益率在截面上的关系，即一阶矩信息。为此，它们在经典PCA问题的目标函数中加入了代表一阶矩，提出了风险溢价PCA方法（risk
    premium PCA，PR-PCA）。实证分析表明，RP-PCA在绝大多数情况下都优于PCA和Fama–French五因子等经典模型，且统计检验表明，通过使用五个PR-PCA因子能够很好地反映股票的系统性风险，且同时能够解释它们收益率的截面差异。对因子构成进行进一步探索发现，这五个因子都有很好的经济学基础。


    从上面相关最新研究的介绍可知，PCA及其拓展方法具备更好的解决资产定价问题的潜力。而在因子投资方面，也有两个思路可以考虑。一个思路是直接使用前述某种PCA方法提取主成分因子，并倒推出恰当的因子组合或公司特征权重，并据此构建股票组合。另一个思路则是利用各种PCA因子对公司特征以及经典因子的暴露，将它们映射为经典因子，然后以这些经典因子为基础进行资产配置。不过需要指出的是，由于投资者在现实中面临卖空约束，依据上述方法构建因子组合可能比经典因子更复杂、可投资性更低。因此，虽然它们提供了新的投资思路，但要真正用于实践，仍有不少细节需要进一步完善。


    以PCA为代表的无监督学习应用于实证资产定价只是最近几年出现的新研究趋势，因此还不能将其视作高度成熟的方法。反之，它们的定位更多的是对经典'
