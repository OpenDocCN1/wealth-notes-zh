- pgno: 8
  md: '资产定价中，另一类常见的资产是通过多空对冲构建的资金中性投资组合，例如做多一定金额的股票，同时做空同样金额的股票。依照定义，这类资产的预期超额收益率就是多头和空头预期收益之差，无须额外减去无风险收益率。因此，使用
    $E[R_i^e]$ 代表资产的预期超额收益更具一般性。此外，在资产定价研究中，由于学术界默认的研究对象始终是资产的预期超额收益，因此约定俗成在称呼上舍去“超额”二字而仅用预期收益率。为了表达的便利性，本书将遵循这种惯例，后续统一称
    $E[R_i^e]$ 为预期收益率。


    和CAPM类似，多因子模型假设资产的预期收益率 $E[R_i^e]$ 由公式（1.2）右侧的一系列因子的预期收益率和资产在这些因子上的暴露决定。它表明多因子模型研究的是不同资产预期收益率之间的差异，而非单一资产收益率在时间序列（又叫时序，书中为了不同对应关系，两种叫法会混用）上的变化。在多因子模型研究的术语中，不同资产预期收益率的差异通常被称为（横）截面（cross-sectional）差异，给定因子的预期收益率，资产预期收益率的高低由它在这些因子上的暴露
    $\beta_i$ 大小决定。多因子模型在数学上简单、优雅，它允许人们在式（1.2）的右侧加上任何可能影响资产预期收益率的因子。然而，实际的金融市场十分复杂，影响资产收益率的原因层出不穷又千变万化。因此，虽然式（1.2）给出了市场均衡状态下资产的预期收益率，但在实际中式（1.2）左、右两侧往往并不相等，而是存在一个定价误差（pricing
    error）：


    ```

    $E[R_i^e] = \alpha_i + \beta_i''\lambda$  (1.3)

    ```


    上式中 $\alpha_i$ 就是资产 $i$ 的实际预期收益率和多因子模型隐含的预期收益率之间的定价误差。该误差产生的原因可以从以下两方面来考虑：


    +   （1）模型设定偏误，即式（1.2）右侧遗漏了重要的因子。当被遗漏的因子被加入后，即可消除误差。


    +   （2）模型本身没有问题，但由于资产收益率的实际数据仅仅是总体的一个样本，因此误差总是存在的。这时需要通过统计方法检验误差 $\alpha_i$ 是否显著不为零：


    +   如果 $\alpha_i$ 并非显著的偏离零，那么可以认为它的出现仅仅是因为运气的原因；


    +   如果 $\alpha_i$ 显著偏离零，它则代表了某个可以通过套利而获得超额收益的机会[3]；它也同时说明由于某些原因，市场对该资产出现错误定价（mispricing），从而导致其实际预期收益率和多因子模型下的预期收益率出现了偏离。


    如何选择因子来构建多因子模型，如何计算资产在因子上的暴露以及因子的收益率，如何使用统计学的方法对定价误差 $\alpha_i$ 进行正式检验就成了使用多因子模型研究资产定价时必须回答的问题。而多因子模型一经提出，用来回答上述问题的相关理论也得到了迅速的发展。如今多因子模型早已成为实证资产定价（empirical
    asset pricing）研究的最主要方法，也由此在投资实务中催生了一个全新的类别——因子投资（factor investing）。'
