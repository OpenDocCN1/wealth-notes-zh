  md: '在时序上取均值，但这种方法效果并不好）。除此之外，Fama and French（2020）还研究了另一种“四不像”的模型，即使用截面回归计算因子收益率，得到因子收益率序列后再使用股票和因子收益率时序回归计算因子暴露，以取代公司特征。这个“四不像”模型对资产预期收益率的解释能力和“时序回归多因子模型”相似，但却不如“截面回归多因子模型”。这个结果说明，“截面回归多因子模型”优于“时序回归多因子模型”，原因可能源于两点：（1）截面回归的因子收益率优于排序法的因子收益率；（2）时变公司特征相比时序回归β是更好的因子暴露代理变量。二者缺一不可。


    自Fama and French（1993）三因子模型问世以来，学术界便采用了“时序回归多因子模型”这一传统。而在27年后，如今，Eugene Fama和Kenneth
    French又通过Fama and French（2020）一文打破了这一传统，引领了今后实证资产定价模型的研究方向。虽然其结果更多地建立在纯粹的实证分析之上，但该文还是清晰地回答了学术界和业界都非常关心的两个问题：到底如何计算因子收益率以及用什么作为因子暴露。从上述结果来看，基于截面回归得到的纯因子组合作为因子投资组合、使用公司特征作为因子暴露在未来或大有可为。此外，“截面多因子模型”也更符合业界的做法（例如Barra多因子模型）。本书第3章将遵循学术界惯例，采用投资组合排序法检验因子，而第4章将使用公司特征作为因子暴露，通过Fama–MacBeth回归检验因子，以帮助读者理解不同方法的差异。


    [1]在使用个股的数据进行截面回归时，市值通常会被对数市值代替，以此降低极值的影响。


    [2]在原文中，Jegadeesh et al.（2019）在进行Fama–MacBeth回归时还加入了市场因子暴露以及截距项作为解释变量。但由于它们不是此处关注的重点，因而没有被纳入表2.4中。


    [3]公众号“川总写量化”的文章《Which Beta?》以中证500的成分股为基准验证了Jegadeesh et al.（2019）的方法，并在A股上观察到了类似的现象。


    [4]参考公众号“川总写量化”的文章《Which beta?》。


    [5]公众号“川总写量化”的文章《Which Beta（II）?》对Fama and French（2020）进行了详细解读。'
