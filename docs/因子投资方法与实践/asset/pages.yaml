  md: '# 6.4 投资者情绪


    由6.3节的论述可知，投资者预期和风险偏好中的很多偏差都能对股票的预期收益率产生不同的影响。在学术研究中，一篇论文通常仅关注某一个偏差和收益率之间的关系。然而在实际投资中，众多投资者的不同偏差是交织在一起的，共同影响着个股乃至市场的走势。那么，有没有单一指标能够在一定程度上反映出不同偏差，乃至其他未知因素对于预期收益率的综合影响呢？这个问题的答案是肯定的，它就是投资者情绪（investor
    sentiment）。投资者情绪会因不同偏差的强弱交替以及投资者结构的更迭而变化，在时间序列上出现投资者情绪高涨和低迷的不同时期山。而投资者情绪的高低又和异象的表现之间有着怎样的联系呢？这就是本节要回答的问题。


    首先从资产定价方面引出一个思考。本书第2.7节介绍广义矩估计时曾经提过资产定价中一个最基础的公式（Cochrane 2005）：


    $p_t = E[m_{t+1} x_{t+1}] \quad (6.17)$


    其中$m$是随机折现因子。以股票为例，$p_t$为当前价格，$x_{t+1}$是股票未来的回报（即$t+1$的价格和$t$到$t+1$之间的股息）。这个公式意味着股票的价格受折现因子和上市公司基本面两个因素的共同影响，因此价格的波动应该由折现因子的波动和基本面（股息）的波动共同决定。1981年，行为金融学代表人物Robert
    Shiller教授发表了对后来影响十分深远的文章Shiller（1981）。该文发现价格的波动比基本面的波动要大得多。因此如果式（6.17）成立，那么唯一合理的解释就是价格的高波动来自折现因子的高波动。那么，到底是什么导致了$m$的高波动呢？后续的研究发现，来自传统经济学理论的消费资本资产定价模型无法解释$m$的高波动，而投资者情绪却在这方面提供了新的思路。Shiller（1984）指出价格的过度波动来源于人们非理性行为造成的对基本面信息的过度反应。


    以2020年一季度为例，标普500指数在2月19日至3月23日这一个月左右的时间内，最大跌幅超过了35%。虽然有新冠肺炎疫情等基本面因素的影响，但整体市场的基本面恶化本身并不足以支撑这一次价格的急跌。这一经验事实（stylized
    facts）使得投资者情绪逐渐受到越来越多的关注。但是，投资者情绪到底是什么，以及用什么指标来表征它？目前仍然尚无定论。一种典型的观点认为，投资者情绪代表的是投资者对未来预期的系统性偏差。当投资者情绪高涨时，投资者对个股以及市场整体的未来预期或需求都更高；当投资者情绪低迷时，投资者对个股以及市场整体的预期或需求则更低。依照上述定义，投资者情绪有两个要素：一是与投资者的各种行为偏差有关；二是投资者情绪是一个加总指标，反映的是全部投资者的综合预期偏差。'
