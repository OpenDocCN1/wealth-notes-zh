  md: '（2017）对此有过明确的区分。通过价值因子投资，也被称为公式化价值投资。它单纯按照估值类指标进行股票选择，好处就是简单和纯粹，但容易选出较多“伪价值”股。而另一方面，价值投资是在价值因子的基础上，将基本面考虑进来，真正关注公司未来的盈利能力和成长能力，试图找到那些优质且便宜的股票。显然，后者要比前者更科学合理，也是大众熟知且默认的理解。如果用一句话来描述价值投资理念，大多数人会引用1989年巴菲特致股东信中的中的金句“以合理的价钱买入优质的公司要远胜于以便宜的价钱买入一般的公司。”[2]


    基于上述认识，学术界在研究价值因子时越来越注重同时将基本面因素考虑进来，并通过基本面和估值相结合的方式，获取常见多因子模型无法解释的超额收益。这意味着这二者的结合更有助于找到并利用估值中的错误，构造投资中的异象。在对基本面的研究中，最能和因子投资相结合的当属Piotroski（2000）提出的F-Score以及Mohanram（2005）设计的G-Score。前者被用来衡量公司基本面好坏，后者则被拿来衡量企业的想象空间。


    # 5.1.2 F-Score


    Piotroski（2000）使用了三大类共9个指标来度量一家公司的好坏。这三大类包括盈利能力、财务情况和经营效率。盈利能力强、财务状况好并且经营效率高的公司，能获得较高的得分，表明整体比较健康；相反，盈利能力弱、财务陷入困境并且效率低下的公司，得分较低，公司质量差。利用1976到1996年美股股票数据，Piotroski（2000）发现高BM公司整体上确实具有较高的超额收益，但大约57%的公司在未来1到2年内超额收益为负值，而F-Score和股票未来收益率的相关系数能达到0.12（一年）和0.13（两年）。此外，以F-Score为变量排序，分组收益具有显著的单调性。在A股中，F-Score是否有同样的功效呢？以下仿照Piotroski（2000）的方式，构造A股的F-Score。表5.1给出了用于计算F-Score的9个指标。


    从表5.1的定义可知，F-Score的取值范围是0到9，分值越高则说明公司的基本面越强。从直觉上来说，无论是0分还是9分的公司都是非常极端的，大部分公司在这些指标上的总分应该是4分或5分左右。图5.2给出了实证期内不同F-Score的平均股票数量，也确认了上述猜想。从图中不难看出，F-Score的分布在0～9分是不均匀的。为了解决这个问题，Piotroski（2000）按照F-Score将公司分成三大类：0～3分为最低组、4～6分为第二组、7～9分最高组。图5.3展示了这三组（每月末调仓）的投资组合在本书实证期内的走势（Panel
    A为等权重；Panel B为市值加权）[3]。无论是等权重还是市值加权，最高F-Score组的收益率均显著高于最低F-Score的收益率，表明使用F-Score确实能在一定程度上评价公司的基本面。


