- pgno: 301
  md: '![](img/8ad8b7f696519d8b709b07f70d7ebfdb_301_0.png)


    图7.2 以BM和ROE（TTM）为变量、采用排序打分法选股的累计收益率


    # 4. 参数化预测


    除上述非参数化方法，线性回归模型也常被用于收益率的预测。在线性回归模型中，解释变量是预测变量，而被解释变量则是股票收益率。由于不同的预测变量量纲不统一（比如BM和对数市值），因此通常先对每个预测变量进行标准化处理，得到标准化得分。该得分通常被称为Z-Score[8]，其计算公式为：


    ```

    Z-Score = (变量 - 变量均值) / 变量标准差

    (7.3)

    ```


    其中变量均值和变量标准差均使用t期股票池中的所有股票在该变量上的取值计算，因而是截面统计量。得到单预测变量的标准化分数后，就ensiones回归模型预测收益率了。由于通常使用多个预测变量，因此在回归时也有两种处理方式。第一种方式是将所有变量加总，使每支股票得到一个综合得分，然后用该综合得分作为解释变量并通过一元回归来预测收益率。第二种方式则是将不同的变量视作多个解释变量，通过多元回归来预测收益率。这两种方法各有千秋，但一元回归由于其简单和易于理解，因而被更广泛地用在投资组合优化中（Chincarini
    and Kim 2006）。


    为进行一元回归，首先需要得到股票在全部预测变量上的综合得分。为此，将每个变量的Z-Score按某个权重求和即可：


    ```

    综合 Z-Score = Σ_{k=1}^{K} ω_k × Z-Score_k

    (7.4)

    ```


    式中ω_k为变量k的权重。理论上，变量的权重应和它们预测未来收益率的能力成正比。然而在实践中，等权重配置所有变量往往就是很好的选择。偏离等权重配置就相当于预测变量之间的择时。具体可以参考7.5节的做法。需要说明的是，按照式（7.4）计算出来的t期每支股票的综合Z-Score虽然仍然满足截面均值为0（因为每个单一的Z-Score_k的均值都是0），但其截面标准差通常不再为1，而是小于1。因此，需要对式（7.4）计算出的综合Z-Score最后再进行一次标准化处理，使得其截面标准差为1。'
  merge: -1
