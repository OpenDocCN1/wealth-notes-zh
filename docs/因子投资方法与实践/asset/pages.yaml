    我们三位作者为公众号“川总写量化”“因子动物园”的创作者。我们在这两个公众号上均创作了大量关于因子投资的高质量的内容，得到了学术界和业界的肯定。而我们三个人也通过写作而结识、相互熟悉，并最终认可彼此的能力和研究态度。在我们平时的研究和实践因子投资中，会查阅大量海外顶级期刊上的论文及这方面的专著。在感慨外文文献科学且务实的同时，也对国内尚无关于因子投资的综述性书籍而感到遗憾。为了弥补这个遗憾，我们一拍即合决定将和因子投资有关的内容系统地整合并辅以全新的实证分析，最终就有了这本《因子投资：方法与实践》。我们的愿景非常简单，即深度解读因子投资的方法论，并提供针对A股市场进行高质量、可复制且完全独立性的实证研究结果。希望这本书能够让正在因子投资这条道路上前行的小伙伴们少走些弯路。


