- pgno: 252
  md: '的负相关性，即收益率分布呈右偏（或正偏态）的股票其预期收益率往往更低。从收益率分布的形状来说，右偏的股票在右尾的高收益令人充满无穷的遐想，而左尾的亏损则相对有限。这种特征和彩票收益的特征很类似（通过有限的下注买一个无尽的念想），因此学术界也形象地把收益率分布呈右偏的股票称为“彩票股”。Barberis
    and Huang（2008）利用权重函数中描述的人们倾向于放大尾部事件发生的概率，造成过度追逐收益率分布呈现右偏的资产、推高其价格、降低其未来收益率。这正是股票截面收益率上大名鼎鼎的偏度异象。类似的，Green
    and Hwang（2012）对首次公开募股（IPO）的研究也发现了类似的结论。IPO股票的收益率呈现出严重的右偏，人们在非理性决策下对此的追踪导致了这些股票未来的低收益率。股票截面上的另一个异象是低异质波动率。Boyer
    et al.（2010）研究发现，时序上异质低波动和未来的异质偏度存在一定的正相关性，因此使用前景理论研究异质低波动和未来收益率之间也存在负相关性。


    上面这些例子主要源于前景理论中权重函数。下面再来看价值函数会产生哪些影响。在市场中人们常有这样的感受，对于上涨的股票经常拿不住，倾向于获利后卖出；对于下跌的股票却迟迟舍不得卖出。这个现象也称作处置效应（disposition
    effect），它和价值函数在盈利和亏损两端的非线性凹性和凸性有关，也和人们的损失厌恶有关（Shefrin and Statman 1985）。Barberis
    and Xiong（2009）以及Ingersoll and Jin（2013）的研究表明，前景理论的价值函数和处置效应之间存在关联。由于处置效应的存在，平均处于浮盈的股票被投资者非理性地过度卖出，造成其被低估；而平均处于浮亏状态的股票则因投资者非理性地持有，造成其被高估。由于被低估的股票在未来有更高的预期收益，而被高估的股票在未来有更低的预期收益，因此可以推断股票的浮盈、浮亏情况和预期收益率之间存在密切的关联。学术界通常使用未实现盈利值（capital
    gain overhang, CGO）来衡量一只股票的浮盈或浮亏程度。利用处置效应和CGO，很多学者尝试对市场中已有的异象进行改进。


    Frazzini（2006）利用CGO改进了盈余惯性（PEAD）异象。该文研究发现，投资者的浮盈或者浮亏，以及盈余公告的好消息或坏消息可以叠加出不同的效果。当投资者处于浮亏且公告是坏消息时，处置效应和有限注意力同向作用，使得该股票被进一步高估，未来预期收益率进一步降低；当投资者处于浮盈且公告是好消息时，处置效应和有限注意力仍然是同向作用，使得该股票被进一步低估，未来预期收益率进一步提高。而在另外两种组合下（即浮亏和好消息，以及浮盈和坏消息），这两种影响则在一定程度上相互抵消。利用这些现象，Frazzini（2006）使用CGO改造PEAD，得到了更加显著的异象。


    Wang et al.（2017）则使用CGO进一步分析了市场中著名的低波动异象。该文指出，当人们处于浮亏时，由于追求风险，往往指望通过高波动的股票来回本，造成它们被进一步高估，因此波动率和预期收益率呈负相关；而当人们处于浮盈时，由于风险厌恶，往往会更加卖出高波动的股票，造成它们被进一步低估，因此波动率和预期收益率呈现正相关。Wang
    et al.（2017）使用大量常见的风险指标，研究了浮盈和浮亏不同状态下，风险和收益率之间的关系，并提出了更好的交易策略。


    An et al.（2020）研究了当人们处于浮盈、浮亏不同状态下对彩票股的偏好差异。当人们处于浮盈的时候，往往不会太关注彩票股，因此它们和其他收益分布没有明显右偏的股票（称为“非彩票股”）的预期收益没有太大差异；而当人们处'
