- pgno: 81
  md: 'al.2016）。该过程的核心是通过连续的正交化计算把一组非两两正交的向量x_i转换成为一组两两正交的向量z_i，并以此方便地求出最后一个被正交化的解释变量的多元回归系数。该过程共有三步：


    （1）第一步是初始化。在所有解释变量中（如果线性回归模型包括截距项，则它也是一个解释变量）任意挑选一个当作x₀进行初始化z₀=x₀。


    （2）第二步是将其他解释变量按任意顺序排序，记为x₁, x₂, …, x_K（假设一共有K+1个解释变量）。按上述顺序从x₁开始依次进行正交化。具体来说，对x_k的正交化公式如下：


    z_k = x_k − Σ_{j=1}^{k−1} ⟨z_j, x_k⟩ / ⟨z_j, z_j⟩ z_j   (2.92)


    其中z₀, z₁, …, z_{k−1}是已经被处理过后的正交向量。


    （3）得到z_K之后，计算⟨z_K, y⟩ / ⟨z_K, z_K⟩，它正是多元回归模型（2.83）中解释变量x_K的回归系数的OLS估计量\hat{b}_K：


    \hat{b}_K = ⟨z_K, y⟩ / ⟨z_K, z_K⟩   (2.93)


    需要强调的是，这一结论仅对最后一个被正交化后的解释变量成立。对于其他解释变量k<K，⟨z_k, y⟩ / ⟨z_k, z_k⟩并不等于多元回归的OLS估计量\hat{b}_k。也许有的读者会有疑惑：这个算法确实不错，但是费了半天劲算出了一大堆相互正交的向量z_k，而求解回归系数的结论却仅对最后一个被正交化的解释变量成立，这不是坑人吗？答案是否定的。上述过程中的关键在于正交化这些解释变量的顺序是任意的，因而可以选任何一个变量进行初始化，也可以选任何一个变量作为最后一个被正交化的解释变量。无论怎么选，上述过程保证了最后一个被正交化的解释变量的回归系数满足\hat{b}_K
    = ⟨z_K, y⟩ / ⟨z_K, z_K⟩。只需依次挑选这些解释变量作为最后一个被正交化的，就可以通过上述步骤求出这些解释变量的回归系数的OLS估计。而上述过程所反映出来的本质是，在对多元线性回归模型（2.83）进行OLS估计时，解释变量x_k的回归系数的估计量\hat{b}_k等于x_k在被其他解释变量x₀,
    x₁, …, x_{k−1}, x_{k+1}, …, x_K正交化之后（从而排除其他x_j对x_k的影响）仍能够对解释y产生的增量贡献。


    上述过程称作多元回归的格拉姆—施密特（Gram—Schmidt）正交化过程。式（2.93）表明x_K的回归系数\hat{b}_K和正交化后的z_K的范数大小（z_K自己的内积为分母）有关。如果x_K和其他解释变量高度相关，那么x_K被其他x_j,
    j≠K解释之后的残差z_K就会很小。当y_i满足独立同分布时，可以证明\hat{b}_k的方差和z_K的范数大小成反比：


    var(\hat{b}_K) = var(y_i) / ⟨z_K, z_K⟩ = var(y_i) / ||z_K||²   (2.94)


    当||z_K||²很小时，var(\hat{b}_K)就会很大，导致\hat{b}_K非常不稳定，即样本数据的细微变化会导致\hat{b}_K大幅变化。回到本书关注的问题，当使用Fama−MacBeth截面回归求解因子收益率'
