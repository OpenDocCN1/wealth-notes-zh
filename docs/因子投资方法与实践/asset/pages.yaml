  md: '图6.1 行为金融学的知识框架


    图6.2 行为金融学与传统金融学的对比


    接下来的6.3.1节到6.3.4节将分别解读上述框架中的各个部分，6.3.5节介绍能被行为金融学解释的异象，6.3.6节介绍行为有效市场的概念。


    # 6.3.1 套利限制


    根据传统金融理论，市场应该满足有效市场假说（Efficient Markets Hypothesis，简称EMH），而EMH的两个核心假设是“价格反映全部信息并迅速调整到位”以及“所有投资者都是理性的”。显然，这两个假设均被现实无情地打脸。行为金融学为解释由于人的非理性行为而造成市场中各种价格相对价值的偏离提供了新的思路。在实际市场中，信息在不同投资者之间的传递速度是不同的。由于投资的时间尺度不同，不同投资者关注的信息也有所差异，这使得人们无法对同样的信息做出一致的反应。此外，人们的决策行为受非理性支配，它源自人类大脑中根深蒂固的认知偏差。这样的例子不胜枚举，以下这个例子来自Robert
    Shiller教授的著作Irrational Exuberance（Shiller 2009，中文名为《非理性繁'
  merge: -1
  img_proc: true
- pgno: 240
  md: '荣》），就很好地说明了这两个核心假设。


    1995年1月17日凌晨5点46分（日本标准时间），日本神户发生了里氏7.3级地震（阪神大地震）。这是自1923年以来在日本城市中发生的 alternatif
    最严重的一次地震。地震造成6434人丧生以及约1000亿美元的直接经济损失。这个纯外来的因素对日本乃至世界的股市有着怎样的影响呢？在地震发生的当日，东京股市仅仅轻微下跌，直到一个星期后，市场才出现对大地震的反应。1995年1月23日，日经指数下跌了5.6%；在震后的10天内，日经指数损失了8%。在这10天内，投资者在想什么无从而知，但这无疑说明了即便如阪神大地震这样的消息，它对市场价格的影响也是需要时间的。更令人感到困惑的是阪神大地震对国外股市的影响。在1月23日日经指数大跌5.6%的当天，伦敦FTSE100指数下跌1.4%，巴黎CAC40指数下跌2.2%，德国DAX指数跌1.8%[2]，而巴西和阿根廷的股市都下跌了3%左右。由于这些国家并未遭受地震，因此各种价格行为不可能均来自投资者的理性行为。


    观察到市场中的非理性行为，Shiller（1984）[1]提出了噪声交易者（noise traders）模型，认为市场由理性投资者和噪声交易者构成。在一次影响深远的美国金融学会主席演讲中，时任协会主席Fischer
    Black对噪声交易者做出了如下定义（Black 1986）：“噪声交易是针对信息噪声的交易，这时投资者以为其拥有了新的信息，但事实上这一信息只是假象。从客观的角度来看，噪声交易者不交易是更好的选择。但即使如此，他们仍会针对信息噪声进行交易，这可能因为他们误将噪声当成了真正有用的信息，也可能因为他们只是喜欢交易。”[4]


    由于噪声交易者的存在，价格往往偏离资产的内在价值，即出现错误定价。在一个没有摩擦的市场中，每当价格偏离价值时，理性投资者（也被称为arbitrageurs，即套利者）应该迅速利用这个机会进行交易，赚取无风险收益并同时修正价格。然而，行为金融学指出，上述假设是不成立的，而这背后的原因正是套利限制。理性投资者在想要利用错误定价赚取收益时要面对以下三个风险：基本面风险、噪声交易者风险以及实施成本。这些风险使得理性投资者无法做到充分套利，使得价格相对价值的偏离得以持续。


    # 1. 基本面风险


    假设某股票的价格因噪声投资者的抛售而下跌，大幅低于其内在价值，如果套利者想买入它获得无风险收益，就必须要防范该股票的基本面风险。为此，套利者需要同时做空一个和该股票基本面相同的股票。然而，能够完美对冲基本面风险的标的是不存在的，这就使得套利者在买入该股票时或多或少地暴露在它的基本面风险之中，一旦发生基本面负面冲击，就会造成该股票的继续下跌，给套利者带来亏损。


    # 2. 噪声交易者风险


    噪声交易者的非理性行为会造成价格在短期内持续偏离价值，无法在套利者的投资期限内回归（De Long et al.1990，Shleifer and Vishny
    1997）。这个风险会给套利者带来职业风险：市场上的资金委托给专业管理人，而绝大多数资金都是短视的业绩追逐者。这些资金不关心、也不知道套利者背后的交易逻辑，而仅是根据净值曲线的短期走势评估管理人的水平。当噪声交易者的非理性加大了错误定价时，由于套利策略的持续亏损，管理人将面临巨大的资金赎回压力，这将迫使他们短期内卖掉手中的头寸，无法等待价格的回归。短期业绩惨淡造成资金被赎'
