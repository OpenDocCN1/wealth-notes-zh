  md: '在投资组合优化中，由于预期收益率难以预测以及优化结果对其的敏感性，人们往往退而求其次，仅使用协方差矩阵Σ为输入参数构建不同的目标函数。无论采用哪种方法，其目标都是该投资组合在事后能获得尽可能高的风险调整后收益。因此，一个很自然的问题就是在资产预期收益率μi以及风险（包括波动率σi和相关系数ρij）满足特定的条件时，通过其他目标函数得到的最优配置权重是否等价于均值一方差优化的最优权重。本节针对7.3.2节提到的最小方差、最大多样化以及风险平价三个目标函数，就这一问题进行简单论述。


    首先，比较均值一方差优化的最优解式（7.59）和最小方差最优解式（7.61）可知，当所有资产的收益率μi均相等时，最小方差优化等价于均值一方差优化。接下来，比较（7.59）和最大多样化最优解式（7.63）可知，当所有资产的收益率μi与波动率σi之比相同（即μi/σi=μj/σj）时，最大多样化优化等价于均值一方差优化。最后，Leote
    de Carvalho et al.（2012）指出风险平价最优解式（7.66）和均值一方差优化等价的条件是：（1）μi/σi=μj/σj，∀i,j；（2）所有资产两两相关系数均相等。


    与上述几种投资组合优化不同的是，在实际投资中经常用到的另一种配置方法其实无须用到任何优化，这种方法就是等权重（简单平均）。顾名思义，等权重就是所有资产权重一样，它无须用到μ或Σ。在∑i=1^N
    ωi=1的约束下，其权重配置满足ωew=[1/N, ⋯, 1/N]′。当以下三个条件满足时，等权重便等价于均值一方差优化：（1）μi/σi=μj/σj，∀i,j；（2）所有资产两两相关系数均相等；（3）σi=σj，∀i,j，即所有资产的波动率相同。表7.5总结了上述几种配置方法和均值一方差优化的等价条件。


    # 表7.5 不同配置方法与均值一方差优化的等价条件


    | 配置方法 | 等价条件 |

    |---|---|

    | 最小方差 | μi = μj, ∀i,j |

    | 最大多样化 | μi/σi = μi/σj, ∀i,j |

    | 风险平价 | μi/σi = μi/σj, ∀i,j; ρij = ρ, ∀i,j |

    | 等权重 | μi/σi = μi/σj, ∀i,j; ρij = ρ, ∀i,j; σi = σj, ∀i,j |


    从表7.5不难看出，除了最小方差之外，其他三种方法的等价条件依次增多。接下来通过构建一系列实验，并以最苛刻的等价条件开始，再逐一放松约束，以此展现这三种方法的配置结果和均值一方差优化配置结果的差异。稍后会单独比较最小方差和均值一方差优化。由于等权重配置方法需要三个条件才等价于均值一方差优化，因此一共考虑以下四个实验。


    +   （1）实验一满足三个条件： μi/σi=μi/σj, ∀i,j； ρij=ρ, ∀i,j； σi=σj, ∀i,j。


    +   （2）实验二满足两个条件： μi/σi=μi/σj, ∀i,j； ρij=ρ, ∀i,j。


    +   （3）实验三满足一个条件： μi/σi=μi/σj, ∀i,j。


    +   （4）实验四以上三个条件均不满足。


    每个实验中包含三个假设资产，作为实验输入给定它们的μi、σi以及两两相关'
