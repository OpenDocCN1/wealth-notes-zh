    # 4.1.6 Stambaugh–Yuan四因子模型


    在4.1.6节和4.1.7节中介绍的最后两个多因子模型均是从行为金融学的角度对资产定价的探索。大量研究表明，投资者的有限理性和认知偏差造成了市场中的各种错误定价，而错误定价可以解释市场中的许多异象和因子。本书第6章的第'
