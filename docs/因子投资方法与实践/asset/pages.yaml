  md: '对于因子和异象来说，上述$x$代表它们的预期收益。如果$p$-值=0.05则意味着在原假设$H_0$下观测到比$x$更极端的收益的条件概率为5%；当$p$-值=0.01则表示在原假设$H_0$下观测到比$x$更极端的收益的条件概率仅有1%。$p$-值越小说明在原假设$H_0$下观测到$x$的可能性越低，即观测到“因子预期收益为$x$”这个事件和原假设$H_0$越不相符，因而越倾向于拒绝原假设。


    一旦“因子的预期收益率为零”这个原假设被拒绝，人们便会顺水推舟的认为“因子的预期收益显著不为零”，且“$p$-值越低，因子预期收益率高越显著”，从而追求更低的$p$-值。然而，足够低的$p$-值仅仅是因子预期收益率为显著不为零的必要条件，而非充分条件。有意或者无意的数据窥探和数据操纵，以及因多重假设检验问题（见6.1.5节），使得低$p$-值并不能准确地传递出因子是否真的有效。


    # 6.1.2 在追逐$p$-值的道路上狂奔


    6.1.1节说明了$p$-值对因子研究的重要性：要想说明某个因子有效（即因子获得显著超额收益），最少得有低的$p$-值，否则免谈。在这种暗示下，学术界刮起了一股追求超低$p$-值之风，这背后的动机其实很容易理解。$p$-值越低意味着因子越显著；因子越显著则研究成果越吸引眼球；成果越吸引眼球越有可能得到更高的引用；高引用的文章越多，期刊的影响因子越高；期刊的影响因子越高，期刊的学术声望也越高。


    为了提升期刊的声望，期刊编辑们都更倾向于接收低$p$-值因子的文章；为了在更高水平的期刊上发文，学者们更倾向挖掘低$p$-值的因子。在美国绝大多数学校里，学者如果能在金融领域顶级期刊发表一篇
    文章，就有可能得到终身教职。在功利心的驱使下，学术界对于超低$p$-值的追逐导致出现了一种发表偏差（publication bias），即学者们更愿意把研究时间和精力花到可以利用各种手段找到低$p$-值的因子上，只愿意发表“最显著”的研究成果，而不愿意冒险来研究“无效的因子”。从推动学科发展的角度来看，“无效的因子”和“有效的因子”同样重要。如果能够确切地证明某个因子无法带来超额收益，那么它对因子投资实践仍然很有价值，因为人们可以放心地避开该因子。然而，在追求超低$p$-值之风下，学者不愿意进行这样的研究，因为顶级期刊上鲜有它们的容身之处。


    Harvey et al.（2016）分析了自1963年到2012年间发表在金融领域顶级期刊上的316个因子的$t$-值（$p$-值越低、$t$-值越高）的分布情况，该分布清晰地说明了学术界的发表偏差。比如，$t$-值在2.00到2.57的文章数和$t$-值在2.57到3.14的文章数十分接近。要知道，$t$-值=2.57对应的（双尾）$p$-值约为0.01；而$t$-值=3.14对应的（双尾）$p$-值则约为0.002。显然，理论上找到$p$-值=0.002的因子要比找到$p$-值=0.01的因子困难得多，但它们的文章数量却大致相同，这只能说明在顶级期刊发表文章时，学者们倾向于更低的$p$-值。


    # 6.1.3 硬科学与软科学


    看到这里，人们不禁要问怎么会有这么多（超）低$p$-值的因子？这可以从“硬科学”和“软科学”的角度来解释。法国著名的哲学家Auguste Comte将科学分成不同'
  merge: -1
  img_proc: true
- pgno: 226
  md: '的等级。像数学、物理这类“硬科学”位于等级的上方，而社会学（包括目前所说的经济学或者哲学）这类“软科学”位于等级的下方。这里的“硬”和“软”并不是“好”与“坏”之分。“硬科学”中的成果往往不受研究者个人偏好的影响，而是从数据可以直接得到结论，且结论是高度可归纳的。比如数学上的四色问题，一旦证明成立那就是成立；又如物理上的引力波，一旦发现那就是说明它的存在，这些都是确切的结果。反观“软科学”的成果则容易受研究者个人偏好的影响，因为研究成果依赖于提出怎样的假设、如何处理数据，以及如何解释结果。这些都和研究者自身的声望、利益、个人偏好有关，因此结果往往是无法归纳的。金融学中的因子研究无疑是“软科学”，因子变量选取、因子投资组合的构建，以及因子收益率计算结果都会因人而异。


    比如“使用过去50年的数据还是过去30年的数据来检验因子？”“使用美股还是其他国家的股票？”“每月再平衡还是每年再平衡因子投资组合？”“使用百分比收益率还是对数收益率计算量价类因子变量？”“是否剔除，以及如何剔除变量异常值？”“使用截面回归还是时间序列回归？”“如果某因子只对所有股票中的一部分有效，是否在发论文时仅使用这部分股票？”……在追逐超低$p$-值的背景下，学者们在面临这些选择做决定时心理会“非常微妙”，一切阻碍超低$p$-值诞生的数据都会被巧妙地避开。学术界把这种为了追求低$p$-值而在数据处理和分析时千方百计地进行数据操纵，直到发现足够显著结果的行为称为p-hacking。


    在科学研究中，人们往往先观察事物是如何运作的，然后提出一个假设并通过数据来验证其是否成立，可谓“先有假设再有结果”。然而，p-hacking却可能让人们本末倒置，即“先有结果再有假设”。为了找到显著的因子，人们热衷于使用不同的变量，挑选不同的数据范围，直到找到显著的因子。这已经偏离了科学研究的本意，而仅是对照历史数据进行过拟合而已。所有这一切对超低$p$-值的追逐在一定程度上源于人们的一个误解：“$p$-值越低”等价于“因子的预期收益越显著”。然而，这种解读并不正确。


    # 6.1.4 正确认识$p$-值的含义


    人们对$p$-值的正确含义充满了误解。为了说明这一点，Harvey（2017）给出了一個假想的例子。假设我们猜想董事会规模小的公司比董事会规模大的公司能获得更高的收益，因此董事会规模可以作为变量构建因子。在这个例子中，原假设$H_0$是董事会规模与超额收益无关；备择假设$H_1$是董事会规模小的公司比规模大的公司能获得更高的收益。为了检验这个想法，构建该因子的投资组合（做多董事会规模小的公司，同时做空董事会规模大的公司）并检验该组合的平均收益率。假设$p$-值小于0.01（非常显著），问以下四种关于$p$-值的陈述中，哪些是正确的？


    +   （1）我们证明了原假设是错误的。


    +   （2）我们找到了原假设为真的概率，即prob（$H_0|D$）。


    +   （4）我们证明了董事会规模小的公司比董事会规模大的公司有更高的超额收益。'
  merge: -1
  img_proc: true
- pgno: 227
  md: '（5）我们可以推断出“董事会规模小的公司比董事会规模大的公司有更高的超额收益”为真的概率，即prob（H₁|D）。


    怎么样？你认为上面四个陈述中有几个是正确的？答案是：它们都是错的。p-值代表原假设下观测到某（极端）事件的条件概率。以D代表极端事件，则按照定义，p-值=prob（D|H₀）。从它的定义出发，p-值不代表原假设或者备择假设是否为真。因此，陈述（1）和（3）都是错的。此外，p-值是数据和假设之间关系的陈述，而非假设本身的陈述。换句话说，p-值是原假设H₀成立的条件下，D发生的条件概率，即prob（D|H₀）；它并不是prob（H₀|D），即在观测到D的前提下，原假设H₀为真的条件概率。因此陈述（2）也是错的。同理，p-值也并非在观测到D的前提下，备择假设H₁为真的条件概率，即prob（H₁|D）。因此陈述（4）也是错的。


    p-值=prob（D|H₀）≠prob（H₀|D） （6.1）


    这个例子传递的重要信息是p-值等于prob（D|H₀），但人们常常把它和prob（H₀|D）弄混淆。站在研究因子的角度，用户若知道prob（H₀|D）（即原假设H₀在D发生时为真的条件概率）当然更有意义，但p-值不等于它，把这两者混淆是严重的错误。如想正确理解p-值的含义，来看看美国统计协会关于p-值的六个准则（Wasserstein
    and Lazar 2016）：


    +   （1）p-值表示数据和给定统计模型的不兼容程度。


    +   （2）p-值不表示所研究的原假设为真的概率；同时，它也不表示数据仅由随机因素产生的概率。


    +   （3）科学结论和商业或政策决策不应只根据p-值是否低于给定的阈值而确定。


    +   （4）全面的分析报告和完全的透明度是适当统计推断的必要前提（这意味着要规避phacking问题）。


    +   （5）p-值或统计上的重要性并不能衡量效用的大小或结果的重要性（在研究因子时，同样需要关注因子收益率的大小在经济上是否显著）。


    +   （6）关于模型或者假设是否有效，p-值本身不能提供足够的证据。


    至此，我们已经了解了p-值的含义，也明白了学术界为什么对挖掘超低p-值的因子如此狂热。接下来回答本节关注的另一个问题，即学术界到底是如何挖掘出这么多显著因子的？从理论上来说，找到显著因子本来就是小概率事件，但Harvey
    et al.（2016）的统计揭示学术界挖出显著因子似乎轻而易举。这背后正是多重假设检验在作怪。


    # 6.1.5 多重假设检验


    如果人们直接从某种金融学或经济学规律出发，找出一个能够获得显著超额收益的因子，那么它很可能是真的显著。但如果尝试了500个因子，然后从中挑出'
  merge: -1
  img_proc: true
- pgno: 228
  md: '了一个$p$-值最低的（$t$-值最高的），则不应草率地认为它一定是真正有效的因子。举个通俗易懂的例子，假如在大街上随机遇到一个人并让他猜20次扔硬币的结果，结果他全都猜对了，那么他很可能真的拥有“天生神力”；但是如果让三亿人同时玩猜20次扔硬币结果的游戏，20轮过后全对的还会有250人左右，这时我们会认为这些人仅仅是运气好。


    隐藏在上述例子背后的数学逻辑是，如果只检验一个因子，它的$t$-值为2.0（对应$p$-值0.05），那么可以认为该因子在0.05的显著性水平下表现显著。然而，如果同时检验许多个因子（比如100个），然后发现第55个因子的$t$-值最高，且其$t$-值为2.0，在这种情况下不能说该因子在0.05的显著性水平下显著。这是因为仅仅靠运气，这100个因子（假设独立）中最显著的那个的$t$-值大于2.0的概率高达99%。


    使用同样的数据同时检验多个原假设就是统计学中的多重假设检验（multiple hypothesis testing）。在因子投资中，使用同样的历史数据挖掘出成百上千个因子就是一种多重假设检验。在统计上，多重假设检验的存在会导致单个检验的显著性被高估。当排除了运气成分后，某个因子很可能显著性并不明显。如果仍然按照传统意义上的2.0作为$t$-值的阈值来评价因子是否显著，一定会有很多伪发现（false
    discoveries或者false rejections）。因此，考虑多重假设检验的核心就是控制伪发现发生的概率。这意味着，单一因子的$t$-值只有比传统意义上的2.0要高很多，那么它才在减去了伪发现概率之后仍然有可能是真实的。关于如何控制伪发现发生的概率，学术界提出了很多不同的方法。下面借助表6.1来解释它们。


    # 表6.1 假设检验结果


    |  | $H_0$ 被拒绝 | $H_0$ 被接受 | 总和 |

    |---|---|---|---|

    | $H_0$ 为真 | $T_0$ | $F_1$ | $S_0$ |

    | $H_0$ 为假 | $F_0$ | $T_1$ | $S_1$ |

    |  | $S-R$ | $R = F_1 + T_1$ | $S$ |


    假如使用同样的数据挖掘出$S$个因子，其中$S_0$个在原假设下为真（true，即因子不能获得显著的收益率），$S_1$个为假（false）。根据事先选定的显著性水平（比如0.05），其中$R$个原假设被拒绝了，包括$T_1$个真实的显著因子（称为真发现，true
    discoveries），和$F_1$个虚假的显著因子（称为伪发现，false discoveries）。使用$F_1$和$R$可以定义一些不同的统计量，而不同的多重假设检验算法是以控制不同的统计量为目标。这些统计量包括三大类，分别为族错误率（family-wise
    error rate，FWER），伪发现率（false discovery rate，FDR）和伪发现比例（false discovery proportion，FDP）。它们都是描述第一类错误（Type
    I error），即错误的拒绝原假设的统计量。


    族错误率（FWER）的定义是出现至少一个伪发现的概率，即prob（$F_1\geq1$）。在给定的显著性水平$\alpha_s$下控制它可以表示为：


    ```

    prob（$F_1\geq1$）$\leq\alpha_s$ （6.2）

    ```


    由式（6.2）不难看出，控制FWER对单个假设来说相当严格，因而会明显提升第二类错误（Type II error）[2]。针对FWER，常见的算法包括Bonferroni（1936）和'
