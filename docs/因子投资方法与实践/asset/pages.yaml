    and So（2012）的猜想——预期差是价值股和成长股收益率差异的驱动——能否在A股中成立。实证结果完美地在A股中复现了美股的结果，因而证实了上述猜想。以等权重为例，预期差组合的月均收益为1.43%（t-值高达5.63），这一结果远超仅通过BM高低构造的投资组合（月均收益率0.65%，t-值3.11）；而非预期差组合的月均收益仅为0.19%（t-值为0.70），这和美股上的结论相似。当采用市值加权时，上述定性的特点依然保持不变。预期差组合的月均收益率为1.31%（t-值为3.55），而非预期差组合的月均收益率仅为0.23%（t-值为0.59）。图5.7展示了预期差、非预期差以及高BM-低BM这三个投资组合的累计收益率曲线。


