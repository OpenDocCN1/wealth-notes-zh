- pgno: 144
  md: '在A股市场中投资与股票未来收益间不存在显著的相关性，而Qiao（2019）和Liu et al.（2019）也得到了类似的结论。


    # 3.7.2 投资因子成因


    关于投资效应的解释也多种多样。第一种解释就是从q-理论出发。Cochrane（1991）最早基于q-理论提出了投资效应。Zhang（2005）对此进行了拓展，指出有较高盈利能力和较低资本成本的企业会倾向于向扩大投资，并获得较低的预期收益。Xing（2008）指出包含随机折现因子的q-理论可以很好地解释投资异象。第二种解释则基于实物期权而构建。通过假设资产的风险小于实物期权，研究者们指出更多的投资意味着行权；而用资产代替实物期权，可以降低公司的风险，因而预期收益也随之降低。Berk
    et al.（1999）、Carlson et al.（2004）和Anderson and Garcia-Feijóo（2006）等是这类解释的代表。除此之外，Lyandres
    et al.（2008）还提出了第三种解释，即投资效应是由递减的规模報酬（decreasing return to scale）所致。规模報酬递减意味着，随着投资的增加，资本的边际产出下降，预期收益也随之降低。最后，Cooper
    and Priestley（2011）认为投资效应与其多空投资组合的系统性风险的差异有关。


    除了上述基于系统性风险溢价的解释，也有不少从行为偏差和错误定价的角度进行的分析。但略有不同的是，这类解释更多讨论的是公司的行为，而不仅仅是投资者的行为偏差。Baker
    and Wurgler（2002）可谓是这方面的先驱，提出企业经理人会利用关于企业真实价值的信息优势进行择时活动，在股票被高估时发行股票扩大投资，但普通投资者通常不会关注这一点。因此，经理人的这一择时行为导致了投资与股票未来收益之间的负相关关系。Baker
    et al.（2003）再次提出了类似的解释。但后续的实证研究说法不一，Polk and Sapienza（2008）支持这一解释，而Dittmar and
    Dittmar（2008）却不支持。


    那些有着高额投资的公司，就会有过度投资的倾向。这些公司为了构建自己的企业帝国，会投资很多净现值为负的项目，但投资者往往对此反应不足。随着投资者逐渐消化信息并纠正自己的错误行为，这些公司的股票价值将回归，并获得较低的未来回报。Titman
    et al.（2004）和Cooper et al.（2008）的研究支持这一解释。后者认为，投资者在为公司估值时，倾向于将历史增长率外推来得到预期的未来增长率，但这一外推法常常会落空21，从而使得投资者高估了股票价值。


    另外，公司可利用盈余管理（earnings management）满足市场预期，推动股价上涨和估值上升，进而利用高估值进行有利的并购活动。而并购活动自然会带来资产的增长，从而进一步导致投资与股票被高估的虚假关联。这一关联意味着即便投资效应不存在，人们仍可观察到投资与股票未来收益之间的负相关关系。不过，对于这一点，相关的实证研究并没有达成统一。例如，Li
    and Zhang（2010）和Lipson et al.（2011）给出了支持这一解释的证据，但Lam and Wei（2011）和Watanabe et
    al.（2013）却不支持这一解释。


