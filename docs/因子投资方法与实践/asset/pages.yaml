    # 2. 混合还是整合


    以上的实证结果是针对单一因子指数进行的。在Smart Beta投资中，不要把鸡蛋放在一个篮子里的理念同样适用。如果要想收益来源更加多样化，可以选择投资多个因子指数。将多个单一因子进行结合，有两种方法：混合法（mix）和整合法（integrate）。混合法把每个因子视为独立个体，每个因子独立选股互不影响，因而可以将每个因子理解为一个子基金或子账户，通过持有多个单因子Smart
    Beta即可达到分散的目的。整合法是在选股时，整体考虑股票在多个因子上的综合表'
  merge: -1
  img_proc: true
- pgno: 345
  md: '现，按照综合表现高低选股。这样只需要选择一支多因子基金，就可以实现多样化配置。


    两种方法各有特点。混合法简单直观，单个组合能最大限度地暴露在目标因子上，就像选择在某一学科有专长的学生一样，不用考虑其综合成绩。然而，由于因子之间较低的相关性，不同单因子组合持有的股票重合度低，导致总体持仓数量较多，从而使得最终的组合效率较低。此外，由于持有多个单一基金，如何确定每支基金的权重也是一个问题。整合法需要同时考虑股票在多个因子的综合暴露情况，就像升学考试一样，总体成绩好才会进入好的学校。同时，由于只需要投资一支基金，资金门槛较低，并且不需要考虑底层因子权重分配问题。然而，由于仅投资一支基金，投资者无法灵活地对因子暴露进行动态调整，这是整合法最大的缺点。关于两种方法孰优孰劣，业界尚未有统一的观点。Bender
    and Wang（2016）利用1993年至2015年间美股市场价值、质量、低波动和动量因子的数据，发现无论是年化收益、夏普比率还是信息比率，整合法的表现都显著优于混合法。而在另一项研究中，Chow
    et al.（2018）指出Smart Beta产品却更多地使用混合法（混合法与整合法的比例大致为5：3）。基于1968年至2016年间近50年的数据，他们发现虽然整合法的夏普比率高于混合法，但前者有着更高的持股集中度和换手率，这两点使得其可投资性大打折扣。Ghayur
    et al.（2018）认为，为了比较两种方法，需要对二者的因子暴露进行匹配。当因子暴露和主动风险较低时，混合法占优；当因子暴露和主动风险较高时，整合法则是更好的选择。因此，哪种方法更好要取决于投资目标和应用场景。


    以下利用BetaPlus因子数据进行混合法和整合法的对比。在每个月月末，等权重持有6个因子指数组合，得到混合法组合；整合法组合则在选股层面实施，即在每月月末，将每支股票在6个因子指数上的得分加总，选择得分最高的200支股票（即1000支的前1/5），并按照自由流通市值加权。表7.17和图7.14展示了两种方法的效果。混合法和整合法均能稳定战胜基准组合。两种方法相比，整合法表现更优，年化收益率高1.49%，年化夏普比率高0.06，但不足之处是其最大回撤也要略微高一些。


