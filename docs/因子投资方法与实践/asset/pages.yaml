    Fama and French（2018）认为，虽然CAPM以及基于消费的CCAPM模型被实证数据拒绝了，但是这些理论模型在收益和风险之间建立了有效的联系。另外，实证资产定价中的各种多因子模型则更多地是来自对历史收益率数据中某种模式的挖掘。为了防止多因子模型变成一场纯粹的数据挖掘游戏，模型背后必须有足够的理论支撑。一旦缺乏理论，那么多因子模型就会退化成人们对着历史数据中的成百上千个因子，以提升事后有效前沿上切点组合的夏普比率为目标的数据挖掘。对于一个因子模型来说，它是为了解释股票收益率如何共同运动，因此因子必须和个股的协方差矩阵密切相关（Pukthuanthong
