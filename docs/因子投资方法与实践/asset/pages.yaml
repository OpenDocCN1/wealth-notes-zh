    # 7.5.6 因子择时很难


    虽然以上几节分门别类地介绍了用来进行因子择时的不同因素，但找到影响因素和成功择时却是两码事。和市场择时（market timing）一样，因子择时是否可行面临着巨大争议，目前尚无统一结论。Bender
    et al.（2018）认为虽然因子择时理论上可行，但也指出了择时研究可能面临的陷阱和风险：（1）预测因素和因子收益之间的关系是动态变化的；（2）挑选题的指标有数据窥探和幸存者偏差嫌疑；（3）由于部分数据存在事后修正，因此实证研究存在使用未来数据的风险。


    投资公司Newfound Research在择时方面也有很多深入研究。他们认为，虽然因子估值和因子动量择时具有一定的效果，但是考虑成本以后，再和不择时相比就优势尽失；使用商业周期相关的数据进行因子择时，更像是过度拟合数据。如果等权重持有多个因子组合，其胜率则已经很高，尤其是在持有时间较长的情况下，要战胜等权重非常困难。类似地，Dichtl
    et al.（2020）探讨了使用不同权重方法配置因子的效果，并发现虽然因子能够明显提升传统宽基指数的表现，但要在因子之间动态分配权重以获得更加优良的结果却很困难。和简单的等权重方法相比，无论基于风险相关的方法，还是基于收益相关的方法，均难以带来更高的附加值。对于因子择时，也许正如DeMiguel
    et al.（2009）指出的那样，各种优化方法都很难超越简单多样化（等权重配置）。


    [1]也称作因子轮动（factor rotation）。


    [2]Ilmanen et al.（2015）比较了两种计算价值价差的方法，发现二者相关性较高，但在极端情况下会有差异，各有优缺点。'
