    比较模型（2.36）和模型（2.18）可知，在截面回归检验中，首先在时序上对 $R_{it}^e$（$t=1,2,\cdots,T$）取均值，得到资产$i$的平均收益率$E_T[R_i^e]$；之后用
    $E_T[R_i^e]$ 和 $\hat{\beta}_i$（$i=1,2,\cdots,N$）在截面上做回归，因此只做了一次截面回归。反观Fama–MacBeth回归，它在每个$t$对模型（2.36）进行一次OLS估计（如果有$T=100$期数据，就意味着进行100次截面回归），得到因子收益率和残差的估计$\hat{\lambda}_t$和$\hat{\alpha}_{it}$。接下来，Fama–MacBeth把$T$次截面回归得到的$T$个估计再取平均，最终得到因子预期收益率和每个资产$i$定价误差的估计：


    $$\hat{\lambda} = \frac{1}{T}\sum_{t=1}^{T}\hat{\lambda}_t \tag{2.38}$$


    $$\hat{\alpha}_i = \frac{1}{T}\sum_{t=1}^{T}\hat{\alpha}_{it} \tag{2.39}$$


    Fama–MacBeth回归的巧妙之处在于它把$T$期的回归结果当作$T$个独立的样本。传统的截面回归检验只进行一次回归，得到因子收益率和定价误差的一个样本估计。而在Fama–MacBeth截面回归得到了每个因子收益率的时间序列$\{\hat{\lambda}_{kt}\}$以及每个资产定价误差的时间序列$\{\hat{\alpha}_{it}\}$，因此可以方便地求出每个因子预期收益率$\hat{\lambda}_k$的标准误和每个资产定价误差$\hat{\alpha}_i$的标准误：


    $$\sigma(\hat{\lambda}_k) = \left[\frac{1}{T^2}\sum_{t=1}^{T}(\hat{\lambda}_{kt}
    - \hat{\lambda}_k)^2\right]^{1/2} \tag{2.40}$$


    $$\sigma(\hat{\alpha}_i) = \left[\frac{1}{T^2}\sum_{t=1}^{T}(\hat{\alpha}_{it}
    - \hat{\alpha}_i)^2\right]^{1/2} \tag{2.41}$$


    将 $N$ 个资产的 $\hat{\alpha}_{it}$ 写成向量的形式 $\hat{\alpha}_t = [\hat{\alpha}_{1t}, \hat{\alpha}_{1t},
    \cdots, \hat{\alpha}_{Nt}]''$, 以下给出了全部 $N$ 个资产定价误差 $\hat{\alpha}$ 的协方差矩阵：


    $$\hat{\alpha} = \frac{1}{T}\sum_{t=1}^{T}\hat{\alpha}_t \tag{2.42}$$


    $$\mathrm{cov}(\hat{\alpha}) = \frac{1}{T^2}\sum_{t=1}^{T}(\hat{\alpha}_t - \hat{\alpha})(\hat{\alpha}_t
    - \hat{\alpha})'' \tag{2.43}$$


    有了每个因子的预期收益率 $\hat{\lambda}_k$ 和它的标准误 $\sigma(\hat{\lambda}_k)$，如法炮制便可计算$t$-统计量，并以此来检验因子预期收益率。此外，在有了
    $\mathrm{cov}(\hat{\alpha})$ 矩阵之后，使用$\chi^2$-统计量检验全部 $N$ 个定价误差是否联合为零：


    $$\hat{\alpha}''\mathrm{cov}(\hat{\alpha})^{-1}\hat{\alpha} \sim \chi^2_{N-K}
    \tag{2.44}$$


    从上面的描述不难看出，Fama–MacBeth回归中的截面回归和传统截面回归的区别是：'
