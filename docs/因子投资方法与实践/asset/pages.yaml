  md: '# 6 预期收益率的截面差异


    到目前为止，以上对资产价格的理解仍然停留在时间序列层面上。而一个自然而然的问题是：是什么决定了资产价格的截面差异？例如，为什么在同一时点，某支股票的价值比另一支高呢？根据P=E[mx]，价值取决于未来的现金流和折现因子的变化。那么，哪些因素决定了资产不同的现金流以及投资者对不同资产的时间偏好和风险偏好呢？关于资产收益截面差异的研究，首先进入人们脑海中的名字恐怕仍然非Eugene
    Fama莫属。


    早在50年前，关于资产截面收益差异的第一范式无疑是资本资产定价模型（CAPM）。在最初关于CAPM的检验中，最著名的两篇论文当属Black et al.（1972）及Fama
    and MacBeth（1973）。后者开创性地在每个时间节点逐一进行截面回归，从而规避了残差收益率的截面相关性对回归结果的影响。这篇文章提出的“先回归、再均值”的方法，即Fama–MacBeth回归，在后来得到了非常广泛的应用。


    虽然最初的检验结果大体上支持CAPM，但是到了20世纪70年代，很多CAPM无法解释的异象被提出。这些单一异象虽然都挑战着CAPM，但因为它们并没有形成合力，所以人们并未对CAPM产生太大的质疑，直到Fama
    and French（1992）整合了之前被提出的多种异象，从而给了CAPM“致命一击”。为了摒弃一个旧模型，唯有提出一个更好的新模型，而这个更好的模型就是Fama–French三因子模型（Fama
    and French 1993）。该模型在市场因子之外加入了价值和规模两个因子。Fama and French（1996）指出三因子模型是Merton（1973）的跨期资本资产定价模型的多因子版本，并认为价值和公司的财务困境风险有关。但是，关于二者代表何种状态变量（state
    variables）以及为什么它们能够捕捉市场因子无法解释的风险，依旧没有定论。


    Fama and French（1993）拉开了使用多因子进行实证资产定价研究的序幕。这个三因子模型也一度成为股票定价中最重要的基准，直到它的继任者Fama–French五因子模型（Fama
    and French 2015）诞生。在过去的三十年中，Fama and French（1993）引领了多因子模型的发展（很多主流因子模型被提出）以及因子背后成因解释的研究（行为金融学的研究结果也在这方面做出了巨大的贡献），后者的意义则更加非凡。


    # 7 结语


    以上从P=E[mx]讲起，指出价格由折现因子以及未来的支付额的现值决定。从这个式子出发引出资产价格在短期内难以预测。在更长的时间尺度上，方差比检验发现资产短期的波动大大高于长期的波动，价格的波动大大高于基本面的波动。过度波动意味着资产收益率在长期是可以预测的。


    既然P的波动远远大于x的波动，依据P=E[mx]，随机折现因子m就必须有很高的波动。在这方面，广义矩估计的提出让人们能够检验CCAPM，然而它却被拒绝了。这也让人们从其他的角度试图理解m的高波动，而行为金融学在这方面提供了很好的视角。它从非理性偏差的角度解释价格的高波动，并认为价格可以偏离价'
