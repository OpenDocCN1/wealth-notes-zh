  md: '# 2.8 研究方法建议


    作为本书的核心内容，本章系统梳理了学术界过去近50年在实证资产定价研究中提出的最常见的方法。这些方法使得人们在检验多因子模型、检验因子及检验异象时有法可循。针对研究的
    cụ thể问题，读者们可以灵活地选择相应的方法。经过几十年的发展及论文之间的相互影响和传承，学术界在研究异象、因子及多因子模型时，在使用的方法上形成了一些惯例，下面就对它们进行说明。


    首先来说异象，研究中关注的重点是通过异象变量能否获得多因子模型无法解释的超额收益。通常的做法是首先通过排序法（2.1节）构造异象投资组合并检验其收益率。在这个过程中，往往先使用异象变量进行单变量排序。有时，为了控制市值的影响，也经常将异象变量和市值进行双重排序再次构建异象组合并检验。无论是单变量排序还是多重排序，排序法仅能检验异象的绝对收益。为了检验异象的超额收益，需依照2.4.1节介绍的方法，以某个多因子模型中的因子收益率为解释变量，以异象收益率为被解释变量，通过时序回归检验新异象能否获得多因子模型无法解释的显著超额收益。如果答案是肯定的，就认为发现了一个异象。


    异象能获得超额收益意味着异象变量能够预测资产未来的收益率，而排序法难以控制其他变量对该异象变量对收益率的预测性的影响。为此，Fama–MacBeth回归常被用来检验当考虑了常见控制变量后，该异象变量是否仍然可以获得显著的超额收益（2.4.4节）。将异象变量和常见控制变量选为解释变量，将个股超额收益选为被解释变量，在每期通过截面回归得到异象收益率（异象变量的回归系数）序列。如果其均值显著不为零，则认为在控制了其他变量后，它依然能够预测资产的收益率，因而是一个异象。以上就是研究异象的常规做法。


    再来说因子和多因子模型。由于这二者是密不可分的，因此放在一起讨论。关于它们的研究主要包括两个方面：（1）一个多因子模型中应该包含哪些因子，以及该模型能否解释资产预期收益的截面差异；（2）如何比较不同的多因子模型。对于前者，虽然学术界已经在期刊论文中发表了不下400个异象（算上没有发表的就更多了），但是在挑选定价因子这件事上还是相当克制的。首先，被选为定价因子并进入定价模型中通常需要有明确的金融学依据。例如Fama
    and French（2015）和Hou et al.（2015）提出盈利和投资因子均是受金融学原理的启发。而近年来，随着行为金融学的发展，也有不少学者从投资者非理性行为导致的错误定价角度提出了新的因子山。因此，有明确的金融学依据是成为定价因子的必要条件。由于因子是资产收益率的驱动力，因此它自身必须是被定价的，即能够获得显著超额收益。为此，可使用因子变量并通过排序法构造因子投资组合，并检验其收益率是否显著。此外，Fama–MacBeth回归（2.3节）也是检验因子收益率是否显著的常见方法。'
