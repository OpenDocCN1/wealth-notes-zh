  md: '# 6.3 用行为金融学解释异象和因子


    行为金融学的发展已经走过了半个世纪。与传统金融学不同，行为金融学认为投资者和交易者是有限理性的，他们的行为导致资产的价格偏离其内在价值，即出现错误定价。行为金融学研究的就是错误定价出现的原因，以及投资者的非理性行为和资产收益率之间的关系。除此之外，越来越多的研究发现，投资者的各种行为偏差也驱动了股票收益率的共同运动，进而产生了各种异象乃至基于行为金融学的定价因子山。在行为金融学出现之前，人们普遍认为因子代表了某种系统性风险。如今，随着行为金融学越来越被人们熟悉和接受，学术界的另一种观点是因子捕捉了错误定价的共同来源，例如全市场范围内的投资者情绪（Hirshleifer
    and Jiang 2010，Kozak et al.2018）。本节就来介绍如何从行为金融学的角度解释异象和因子。


    关于行为金融学的发展历程，Sewell（2007）按时间顺序梳理了该领域内最重要的研究成果，这是一篇很好的文献综述。除此之外，Barberis and Thaler（2003）、Hirshleifer（2015）以及Barberis（2018）从知识体系的角度对这一学科所包含的内容进行了总结。行为金融学背后的两大支柱是套利限制（limits
    to arbitrage）和心理学，而心理学中又分为预期偏差、风险偏好偏差，以及认知限制三部分。每一部分下面又有各自的理论和内容，构成了行为金融学的全貌。图6.1展示了行为金融学的知识框架。


    传统金融学中的两大假设为人的理性预期以及依照预期效用最大化来进行决策。前者意味着人们能够迅速处理全部新息并使用贝叶斯理论更新先验，得到纯理性的后验信仰；后者则假设人们在完全理性下以最大化预期效用为目标来做决策。从这两大假设中可以引申出三个要素：（1）理性预期；（2）及时处理全部信息；（3）完全理性的风险偏好。行为金融学则对上述三个要素逐一提出了挑战。对于理性预期，行为金融学认为人们的预期并非完全理性，会出现诸如过度自信、锚定效应等偏差；对于及时处理信息，认知学研究表明人的大脑对信息的处理能力是有限的，存在认知限制、无法对全部信息进行及时处理；对于理性风险偏好，行为金融学指出人在不确定性下做决策时也难以做到完全理性，存在风险偏好偏差，而前景理论以及模糊厌恶比预期效用理论能够更好地描述人如何在不确定下做决策。行为金融学与传统金融学的对比如图6.2所示。'
