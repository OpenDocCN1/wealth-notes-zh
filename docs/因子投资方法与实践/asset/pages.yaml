    \ \right] \\tag{2.103}$$\n\n当$T$趋于无穷大时，$(T-j)/T$趋于1，可以求出$\\mathrm{var}(\bar{u})$的渐进形式：\n\
    \n$$\\mathrm{var}(\bar{u}) \rightarrow \\frac{1}{T}\\sum_{j=-\\infty}^{\\infty}\\\
    mathrm{var}(u_t,u_{t-j}) \\tag{2.104}$$\n\n下面再假设一个特殊的情况，即随机变量$u_t$的总体均值$E[u_t]=0$，并利用方差运算的性质$\\\
    mathrm{var}(X,Y)=E[XY]-E[X]E[Y]$可得："
