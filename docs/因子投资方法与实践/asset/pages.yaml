  md: "由上述关系可知，系数$b_t$不受影响。定义$\\alpha_{it}\\equiv R_{it}-R_{Bt}$表示超额收益，并用符号$c'_t$代替$c_t-R_{Bt}$得到：\n\
    \n$$\\alpha_{it}=c'_t+b_t z_{it-1}+\\varepsilon_{it}\\tag{7.10}$$ \n\n式（7.10）的OLS估计量为：\n\
    \n$$\\hat{b}_t=\\frac{\\mathrm{cov}(z_{it-1},\\alpha_{it})}{\\mathrm{var}(z_{it-1})}\\\
    tag{7.11}$$ \n\n$$\\hat{c}'_t=\\bar{\\alpha}_t-\\hat{b}_t\\bar{z}_{t-1}\\tag{7.12}$$\
    \ \n\n其中$\\bar{\\alpha}_t=\\frac{1}{N}\\sum_{i=1}^N\\alpha_{it},\\;\\bar{z}_{t-1}=\\\
    frac{1}{N}\\sum_{i=1}^N z_{it-1}$。由于Z-Score的均值为0（$\\bar{z}_{t-1}=0$），因此$\\hat{c}'_t=\\\
    bar{\\alpha}_t$。将$\\hat{b}_t$和$\\hat{c}'_t$代入（7.10）计算超额收益的估计值：\n\n$$\\hat{\\alpha}_{it}=\\\
    bar{\\alpha}_t+\\frac{\\mathrm{cov}(z_{it-1},\\alpha_{it})}{\\mathrm{var}(z_{it-1})}z_{it-1}\\\
    tag{7.13}$$ \n\n式（7.13）中等号右侧第一项是所有股票超额收益在截面上的均值，这一项目对所有股票来说是一样的（且如果基准是一个等权重指数，则这一项将严格为零），因此对个股超额收益的预测仅取决于等号右边的第二项。利用方差和协方差的定义将第二项进行简单的代数运算可得：\n\
    \n$$\\frac{\\mathrm{cov}(z_{it-1},\\alpha_{it})}{\\mathrm{var}(z_{it-1})}z_{it-1}\\\
    tag{7.14}$$ \n\n$$\\Rightarrow \\frac{\\rho(z_{it-1},\\alpha_{it})\\sigma(\\alpha_{it})\\\
    sigma(z_{it-1})}{\\sigma(z_{it-1})\\sigma(z_{it-1})}z_{it-1}\\tag{7.15}$$ \n\n\
    $$\\Rightarrow \\frac{\\rho(z_{it-1},\\alpha_{it})\\sigma(\\alpha_{it})}{\\sigma(z_{it-1})}z_{it-1}\\\
    tag{7.16}$$ \n\n其中$\\rho\\left(z_{it-1},\\alpha_{it}\\right)$为$z_{it-1}$和$\\alpha_{it}$的相关系数。且由于$z_{it-1}$是Z-Score，其标准差为1。将式（7.16）进一步化简并得到关于$\\\
    alpha$的关系：\n\n$$\\hat{\\alpha}_{it}\\approx\\rho(z_{it-1},\\alpha_{it})\\times\\\
    sigma(\\alpha_{it})\\times z_{it-1}\\tag{7.17}$$ \n\n上式中右侧第一项是IC，第二项是超额收益的截面波动率，第三项是Z-Score。式（7.17）所示的超额收益与IC×波动率×Score的关系正是Grinold（1994）提出的著名的超额收益经验法则，也就是$\\\
    alpha$三要素公式。\n\n[1]即特质性波动率低的股票的预期收益率更高。具体解释和针对A股的实证结果见5.3节。\n\n[2]像BM、ROE这些用来构建价值和盈利因子的变量也被广泛地应用于收益模型。\n\
    \n[3]ESG全称为environmental, social and corporate governance，即环境、社会和公司治理。它们是衡量公司或企业投资的可持续性和社会影响的三个核心因素。\n\
    \n[4]曾经有私募路演时声称配置了3000多个“阿尔法因子”，引来阵阵拍案称奇。\n\n[5]为了消除预测变量分布不均匀的影响，有时也会使用Spearman秩相关系数代替Pearson相关系数。当采用前者时，IC又被称为rank\
