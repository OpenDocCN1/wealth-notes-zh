- pgno: 18
  md: '一词来描述当前学术界因子研究的现状（Cochrane 2011），并提出了三个至关重要的问题：（1）哪些因子是独立的？（2）哪些因子是重要的？（3）因子驱动资产价格的原因是什么？


    Cochrane（2011）的提问引发了学术界的深刻反思。最近几年，越来越多发表于顶级期刊上的文章致力于回答这些问题。Harvey et al.（2016）研究了316个因子，提出了一种能够利用不同因子之间相关性的全新分析框架，把代表因子显著性的t-值（t-statistic）的阈值从2.0提高到了3.0。Chordia
    et al.（2020）则对标了前文，认为Harvey et al.（2016）考虑的316个因子仅仅是被发表的，因而仅仅是所有被研究过的因子的子集，所以基于它们的分析会低估多重假设检验的影响。该文使用模拟定量刻画了学术界挖因子的过程，并进一步将代表因子显著性的t-值的阈值提升到了3.4以上□。除此之外，Green
    et al.（2017）使用Fama-MacBeth回归同时分析了近100个因子，发现真正独立的因子少之又少。Harvey and Liu（2018）以“幸运因子”为题提出了一个基于正交化和自助法的分析框架，从一揽子因子中逐一识别对解释资产预期收益率截面差异有增量贡献的因子。


    一个新因子被提出后，随着越来越多的人使用，它在发表后样本外的效果就会变差。在这方面，McLean and Pontiff（2016）研究了97个因子在被发表之后的表现，发现因子的收益率比论文中的表现降低了50%以上。类似的，Limainmaa
    and Roberts（2018）研究了36个财务因子在样本外的表现，绝大多数因子在样本外的表现令人失望。另外，在学术研究中通常没有对交易费用给予充分的考虑，造成对因子收益率的高估。由于因子投资组合一般都是多、空对冲的组合，因此如果不合理考虑做空限制，也会高估因子的收益。当然可喜的是，学者们意识到了交易费用对因子效果的冲击，并开始在论文中对其加以必要的惩罚。


    学术界对因子研究的另一个关注点是使用多变量构建复合异象或因子，用它来选股并获取超额收益。在这方面的代表作包括Piotroski（2000）提出的F-Score以及Mohanram（2005）提出的G-Score。使用多指标选股构建的多、空对冲投资组合能够获得主流多因子模型无法解释的、显著大于零的α收益率。本书的第5章将会解读包括上述F-Score、G-Score在内的一些非常有意思的异象。它们可以极大地丰富读者进行因子投资的思路。此外，美国著名的对冲基金AQR
    Capital Management（以下简称AQR）提出的质量因子也是很好的例子（Asness et al.2019）。就构建符合异象或因子问题，Novy-Marx（2015a）指出，虽然这么做无可厚非，但由于变量数量增多导致过拟合风险加大，因此需要谨慎考虑每个变量对于提升收益率的增量贡献。


    从式（1.3）可知，异象的超额收益说明资产的定价中存在错误。近年来，行为金融学得到了长足的发展。与传统金融学不同，它假设人是有限理性的，因此在不确定性下做决策是会出现预期中的偏差以及风险偏好中的偏差。这些偏差对错误定价产生的原因提供了有效的解释，并可以解释很多市场中观察到的异象以及因子。基于这些新的发现，学术界和业界都逐渐同意风险补偿并非因子背后的唯一原因，而人的各种偏差则也是因子成因的必要补充。近年来，越来越多的研究着眼于理解这些偏差以及投资者情绪和收益率之间的关系。这些研究不仅涉及市场整体收益率在时序上的可预测性，也包括不同资产预期收益率在截面上的差异性。


    学术界的最后一个关注点可以归结为因子收益率和宏观经济的关系。在不同'
