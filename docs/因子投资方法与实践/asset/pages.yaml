    在上式中，除了因子暴露矩阵β已知以外，因子协方差矩阵Σ_λ和个股特质性收益率的协方差矩阵（非对角线上元素为0）Σ_ε均需要估计，而Σ的准确性取决于Σ_λ和Σ_ε的准确性。通过求解模型（7.19）可以得到因子收益率和特质性收益率的时间序列。对于任何时刻t，可以用给定的时间窗口、使用t时刻之间的历史收益率序列计算因子收益率的样本协方差矩阵（记为Σ̂_λ）和特质性收益率的样本协方差矩阵（记为Σ̂_ε），它们是Σ_λ和Σ_ε的最简单估计。


    然而，大量实证经验显示，使用历史数据计算难以得到协方差矩阵的准确估计，因此需要通过不同的统计手段分别对Σ̂_λ和Σ̂_ε进行了调整。在诸多调整手段中，最重要的是对Σ̂_λ采用的特征因子调整法，以及对Σ̂_ε采用的贝叶斯收缩法³。为介绍这两种方法，首先需说明偏差统计（Bias
    statistic）量这个概念，因为上述两种调整均以降低偏差统计量为目标。


    # 1. 偏差统计量


    偏差统计量是评估风险模型准确性的一个常用指标（Menchero et al.2011），它用来衡量风险预测值和风险实际值之间的误差。如果这二者之间有显著误差，则认为风险预测是有偏的，故这个统计量称为偏差统计量。令R_it为资产i在t期的收益率，σ_it是t期期初的估计值。定义b_it如下：


    ```

    b_it = R_it / σ_it  (7.34)

    ```


    b_it的含义是将R_it用σ_it标准化。假设一共有T期数据，则将有T个b_it。利用它们定义资产i的偏差统计量B_i：


    ```

    B_i = sqrt( 1/(T-1) sum_{t=1}^{T} (b_it - bar b_i)^2 )  (7.35)

    ```


    式中bar b_i是b_it的均值。如果事前风险σ_it预测准确，则标准化后的收益率b_it的标准差将为1。假设资产收益率R_it符合正态分布且事前风险预测准确，当T足够大时，B_i也应满足正态分布，且其95%的置信区间为：


    ```

    B_i ∈ [1 - sqrt(2/T), 1 + sqrt(2/T)]  (7.36)

    ```


    如果B_i不在上述范围内，则可以认为事前风险σ_it估计不准确。搞清楚了偏差统计量，接下来就看看针对因子收益率协方差矩阵的特征因子调整法。


    # 2. 特征因子调整法


    前文曾反复强调过，从风险角度来说，多因子模型的作用是利用资产和因子收益率之间的关系，实现数学上的降维，方便地计算个股的协方差矩阵Σ。人们之所以希望知道Σ，是因为它是投资组合优化中必不可少的输入之一。在实际投资'
