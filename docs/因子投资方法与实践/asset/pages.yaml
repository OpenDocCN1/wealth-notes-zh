  md: '和被动投资相反，主动投资认为市场并非完全有效，只要找对了方法就能击败市场，获取超额收益。在这方面，选股和择时是两个重要的思路。选股以在股票截面上选出未来预期收益率更高的股票为目标，而择时则以在时序上判断市场整体涨跌从而动态控制仓位为研究对象。无论是选股还是择时，具体方法仁者见仁，智者见智。主动投资的目的是通过获得更高的收益和（或者）降低投资组合的风险（例如降低最大回撤）来击败市场指数。和被动投资相比，主动投资方法更加主观，也不够公开透明，且换手率较高，可复制性较低。


    从Smart Beta的特点和定义可知，它兼具两种投资流派的基因，属于“中间派”。一方面，Smart Beta规则透明清晰，易于复制和成本较低，属于典型的指数化投资，这和传统的被动投资如出一辙；另一方面，它选择在特定的因子上有所暴露，主动偏离指数加权方式，以获得更高收益或更低波动，这又和主动投资方式十分接近。表7.9将
