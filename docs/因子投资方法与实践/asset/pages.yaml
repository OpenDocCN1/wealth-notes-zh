    # 图2.3 截面上股票预期收益率和风险暴露的关系


    正如前文反复强调的，多因子模型反映的是预期收益率和因子暴露在截面上的关系。在多因子模型被提出之前，人们最熟悉的因子模型无疑是CAPM。它因为只有一个市场因子，所以是多因子模型的一个特例。人们最早的猜测是市场因子的收益率和个股在该因子上的β就可以解释截面上不同股票收益率之间的区别。但大量的实证结果显示如果把个股的
    E[R_i^e] 和它们针对市场因子的 β_i 画出来，二者之间的关系并不能很好地满足该模型，说明仅仅用单一市场因子无法很好地解释 E[R_i^e] 在截面上的差别。为了反映这一现象，Black
    et al.（1972）在CAPM的基础上又加入了一个zero-beta因子，该两因子模型能够更好地解释 E[R_i^e] 在截面上的差别 3。再后来，Fama
    and French（1993）提出了大名鼎鼎的三因子模型，它在市场因子的基础上加入价值（HML）和规模（SMB）两个因子。这些努力都是为了能够更好地解释人们在股票收益率数据中观察到的
    E[R_i^e] 在截面上的差别。


    之所以回顾上面这一小段历史，是为了说明学术界在多因子模型上的各种努力都是为了更好地解释 E[R_i^e] 为什么会因资产而异。那么，拿来一个多因子模型，如何定量地评估它是不是一个好的模型呢？为了回答这个问题，首先来看检验中的三个部分：估计值（estimate）、标准误（standard
    errors）以及检验（test），见表2.3。


    # 表2.3 多因子模型检验的三个部分


    | 任务 | 说明 |

    | --- | --- |

    | 估计值 | â_i, β̂_i, λ̂ |

    | 标准误 | σ(â_i), σ(β̂_i), σ(λ̂) |

    | 检验 | 联合检验所有 N 个资产的定价误差；检验每个因子的预期收益率 |


    对于截面关系式 E[R_i^e] = α_i + β_i''λ，下文将采用回归分析（regression analysis）来确定 â_i、β̂_i、λ̂
    和 σ(â_i)、σ(β̂_i)、σ(λ̂)。一旦有了估计值和标准误，就可以用它们检验多因子模型。由式（2.12）可知，α_i 代表了资产 i 的定价误差。如果能够在统计上证明所有
    α_i 都很接近零，则可以说该多因子模型就是很好的模型，即它能够解释资产预期收益率的截面差异。由此可见，多因子模型的回归检验中最重要的就是检验所有 α_i
    联合起来是否在统计上足够接近零。除此之外，使用 λ 的估计值和标准误，同样可以检验每个因子的预期收益率 4。根据上述说明，多因子模型的回归检验可以简单总结为以下三步：


    +   （1）计算每个资产在所有因子上的暴露 β_i;'
