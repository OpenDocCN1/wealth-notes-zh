  md: '然》（Nature）杂志和很多主流媒体（甚至包括《纽约时报》本身）在当初就对其进行过报道，但却并未引起股价的波澜。这个例子说明，这个消息在最初被报道的时候并未引起投资者的注意，而当它登上《纽约时报》的封面后便如同被放到了聚光灯下一般，引起了投资者的追捧。


    在另一项研究中，DellaVigna and Pollet（2007）从人口结构变化和资产收益的关系出发提出投资者存在有限注意问题。假如2018年婴儿出生率激增，那么则可以想见6年之后的2024年，这些幼儿对于玩具的需求将会到达顶峰，利好玩具公司。因此，如果投资者不存在有限注意力问题，那么应该在2018年就部署、增持这些玩具公司的股票，而非等到2024年才行动，但事实却非如此。该文的研究发现人们对于人口变化的相关信息是反应不足的，并基于此构建了一个投资策略来利用这种定价中的错误：当人口变动信息出现后，马上买入会因该信息受益的公司、做空会因该信息受负面冲击的公司，便可获得超额收益。这进一步证实了市场中存在有限注意力问题。


    # 2. 分类思维


    市场中有成千上万种资产。为了简化思维，投资者会把它们分类，比如把股票按风格分成价值股、成长股、高质量股、小市值股等。如此分类让投资者在判断这些资产时，更多考虑它们所处的类别，而非每种资产本身的基本面，这造成了同类资产中显著的共同运动。而对不同风格股票的外推造成了不同风格股票的波动，这便形成了风格因子之间涨跌的差异。Peng
    and Xiong（2006）指出有限注意力也能引起分类思维，比如投资者更倾向于分析和全市场相关的信息，而非仅针对某个公司的私有信息。


    股票入选指数成份股之后的走势也能反映投资者的分类思维。Barberis et al.（2005）的研究发现，当一只股票入选标普500指数时，它的价格便开始和其他成份股一起共同运动。如果投资者是完全理性的，这种相关性发生的唯一前提应该是该股票的基本面和其他成份股的基本面的相关性提高，然而实际数据并不支持这种说法。回归分析结果表明，投资者的分类思维才是上述现象背后的原因。Boyer（2011）也观察到类似的现象，即在基本面没有任何变化的前提下，仅仅因为被选入指数就提高了股票和指数之间的相关性。


    # 6.3.5 行为金融学与市场异象


    如今，越来越多的学者使用前面介绍的行为金融学框架解释股票市场的各种现象，其中既包括市场整体行为，也包括股票预期收益率的截面差异（即异象）。由于本书主要关于因子投资，因此下面主要介绍行为金融学在解释后者时发挥的作用。


    # 1. 预期偏差和市场异象


    盈余惯性（Post-Earnings-Announcement-Drift, PEAD）最初由Ball and Brown（1968）发现[3]，而后又因Bernard
    and Thomas（1989, 1990）的研究被世人所熟知。它指的是由于认知限制中的有限注意力，人们对新的基本面信息反应不足，造成价格无法迅速对其反应到位，而是在业绩公告之后继续漂移[4]。关于'
