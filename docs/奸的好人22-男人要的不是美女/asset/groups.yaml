    \n**沒有夢想的男人，你會喜歡他嗎？擁有夢想的男人，你有勇氣喜歡他嗎？**\n\n到你事業有成的時候，你城府就更深了，看盡人情冷暖，你喜怒不形於色，就更不會和任何人談心事。你深深埋藏了自己。有時，你會想身邊的人，無非都是酒肉財色，互相利用；身邊的女人，也只是貪你的錢？如果有一天你一無所有，他們是否還會留在你身邊？有時，你會覺得很空虛寂寞，有時候你會很想去放縱享樂。到底，有誰會真正了解你？\n\
    \n### 每個人都在留意你飛得高不高？有多少人會關心你飛得累不累？\n\n社會總是對男人有較高要求，無論在事業、學識、家庭、愛情……每一部分男人都應該要努力、付出、爭取，彷彿男人都是精力無窮電量十足的外星人。事實上，男人很少會向其他人表達自己的軟弱，你只有和其他女孩不同，才可以打開他的心。\n\
    \n男人都希望自己是個英雄。但重點是，哪裏有這麼多英雄？這種慾望，往往只能投射在遊戲和電影世界之中。如果你明白這個男人在愛情裏的 2 大需求，你會想讓他成為你的英雄。\n\
