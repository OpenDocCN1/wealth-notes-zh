    正當他們以為「空手而回」當兒遇上大雨，他們找到了一個涼亭避雨，正巧這時正好有數位女子也很狼狽跑到涼亭避雨，但在那刻他們同時被一位年紀三十多歲，穿白衣的貧家女深深吸引住，他們二人不約而同慨嘆：「是她了！」


    這位相女大師事後與富豪討論，跑到涼亭避雨的女子，論容貌姿色，此女子絕非最出色，而且算是最普通中的平凡容貌，論「濕身」程度，很多女子的身材顯露比她更玲瓏浮凸，但那些年輕女子，一走進涼亭首先是抬頭直視他們，接著就直接抖動衣服，很直接「守禮節」地雙手交叉守護著該遮護的「地方」。


    那位三十多歲的白衣貧家女子（在古代屬年紀很大的「老女人」了），是很「輕盈」跑進涼亭，然後眼睛先是「秋波斜視」他們，緊接她眼神像是看著遠方，然後再拉回視線，如是重反覆三次有多，之後才是「輕柔」地轉過身子……。'
  - '[PAGE 97]


    # 附錄


    據此種種文獻，配搭上現代儀態理論，我們「統 一」發現：原來古今中外，說起吸引男人有媚態的美 女，其目光和肢體語言都不是「直接」呈直線的，都 是「間接」式的有技巧地「斜視」和肢體語言呈「曲
    線式的挪動」。


    曾經很多大陸的女讀者問我：「男人是不是視覺 動物，男人是不是都是貪新忘舊……」


    我多番的告訴大陸女讀者，我是男人，我覺得男 人都很膚淺，男人不但是「視覺動物」，更是「觸覺 動物」；視覺的缺口可以借媚態攻破，觸覺可以靠「不 經意」的觸摸推倒圍牆，其次，才是「放風箏」的相
    處哲學。


    因此，女人應當以「媚態」來「修飾」自身，靠 「觸摸」來與屬意男人「社交」，最後當以「放風箏」 哲學，以一放一收的招數「管理」感情。'
  - '[PAGE 98]


    記得，開始階段靠引誘，相處階段靠經營，對我而言，不論男女之間的相處，必須要靠權謀手段經營，同时也要靠真心誠意維持，人，就是如此的複雜，這就是我們生而為人最矛盾的地方，同時也是最精彩和最過癮的地方！


    羅智勝'
  - '[PAGE 99]


    # 附錄


    # 2 個穿衣小技巧，

    Natural & Sharp！


    ![](img/c7516cb6b18dccbd71f0fbdfe62ac0da_99_0.png)


    這樣說好像很「倒米」（自虧），但事實上大部分男生並不懂得妳身上穿的所謂時尚，妳以為徐濠縉很有型嗎？男生們只覺得她打扮誇張奇怪，標奇立異又像一个大嬸。可是太過樸素，在人群中又毫不起眼，現在來教妳兩個簡單穿衣的小技巧，絕對不受潮流所限！


    # 一、露肌吧！


    不是教妳要穿著暴露，而是每次全身造型都露出一個重點，除了可以吸引目光外，還可以有顯瘦作用，當然，每個人也要根據自己身形的優點和缺點來選擇不同的衣服。'
  - '[PAGE 100]


    例如很多香港女生偏向下半身肥胖，但手臂線條漂亮，那就穿上一件亮麗的背心上衣吧！把全身都包得緊緊的，唯獨露出兩條光裸幼滑的手臂，這點反差感就已經可以吸引男人的目光。


    可能妳會疑惑，要露肌我為什麼不索性穿上Deep V 短裙？那殺傷力更大！如果妳想吸引一班只想勾搭中出即飛的狗公（對感情不認真的毒男），那請盡妳所能地穿上最少的衣物吧！如果妳想追求的是穩定的關係，就要好好緊守「每次只露一個重點」這個法則。


    # 二、加入一個重點物！


    原理與「每次只露一個重點」一樣，每次的造型也選擇穿上一個特別起眼的 ITEMS，讓別人一眼就得見，例如，一件黑色簡約的連身裙再配搭一對紅色'
  - '[PAGE 101]


    # 附 錄


    搶眼的耳環，就會讓耳環更突出，別人一看就會注意到妳的耳環。


    人的心理很有趣，對於第一眼就注意到的東西，自動就會歸類入有兩個極端的想法：很漂亮或很醜。如果妳的打扮不是過份得令人想吐的話，恭喜妳，妳已成功讓他留下良好印象！


    記得，男人要的不是美女，但我們更不是要教你做一個醜女人。最重要的是，讓你發掘出屬於你的風格，屬於你的魅力。穿著和化妝就是一個簡單的開始。'
  - '[PAGE 102]


    # 沒有醜女人，只有懶女人！


    ![](img/c7516cb6b18dccbd71f0fbdfe62ac0da_102_0.png)


    你相信自己的眼睛嗎？電視上美麗面孔的背後，難道就沒有黑眼圈？沒有眼袋？沒有一點瑕疵？


    那為什麽那些女星素顏的時候要戴大大的蒼蠅眼鏡？Facebook 和微博上的素顏照就真的是素顏嗎？


    你相信嗎？


    “化妝”並不是要用厚厚的粉底，加上假到不能再假的睫毛。有時候，一個很淡的妝，更能突顯你的氣質。


    就像換衣服一樣，化妝需要看場合，需要良好配搭。就算你天生麗質，都總會有看膩的一天。不只是男人，誰不貪新鮮？誰不喜歡漂亮的東西？日日月月看著同一樣的東西，同一樣的臉龐。多美也會變得普通吧！'
  - '[PAGE 103]


    # 附錄


    因此，適當的裝扮也是你對男人的一點尊重，也是一種情趣。


    在不同的場合裡，利用不同的化妝技巧配襯不同的服飾，可以營造不一樣的效果。偶爾打扮清純，偶爾打扮性感，偶爾打扮高貴，必定能讓你男友眼前一亮，重新抓住他的目光，也讓他身邊的人羨慕不已。當他身邊的人都在注意你，他的防範意識就會增加，更牢牢的牽著你，恨不得把你吞進肚子裡，效果立刻就奏效了。


    但是請謹記“化妝”不是“偽妝”，不僅要適合自己，也必須配合場合。難道跟男友出門吃點東西也要弄得像做秀一樣嗎？


    每天對著濃妝豔抹的容顏，我也會想吐吧！況且每天上街也讓他等幾小時，就算是天仙一樣的美女，也會讓人討厭。有些女孩甚至連睡覺也要補妝，這種'
  - '[PAGE 104]


    病態式的，不健康的化妝習慣，請恕我不敢苟同。


    那麼該怎麼辦？


    給大家一點小貼士，化妝其實可以是局部的，

