    # 第一部分


    # 男人要的不是美女


    每個人都有追寻快樂和幸福的權利。'
  - '[PAGE 22]


    # 樣貌就是一切？


    喜歡我的人？我喜歡的人？


    女生是一種自以為很清楚自己的動物，她們常常告訴我，她們需要一個好男人，專一、細心、關心自己，但當談及過往的戀愛經驗，那個最愛、最刻骨铭心的男人，偏偏以上的條件一個也沒有。


    女人會想要一個好男人去疼愛她們，但其實她們喜歡的是另一種男人。這就是女生經常遇到的問題：到底我應該選擇一個喜歡我的人，還是喜歡的人？


    有多少女生都處於這樣的矛盾中，試過跟喜歡的人在一起，然後分開。最後不禁想，不如降低要求，找個不算太喜歡，但對自已好的人在一起，每天過著不算太快樂也不算太悲哀的生活。但，這真的是你想要的生活嗎？'
  - '[PAGE 23]


    除非你急著結婚生子，又或者佔有慾超強，否則，我還是強烈建議你選擇你真正喜歡的人。但是有太多太多女生，每次遇到喜歡的男生，總是被吃得死死的。她們不是被小三破壞，就是被劈腿，到底，怎樣做才能和自己喜歡的人好好戀愛？


    # **女人的命運**


    任何人也有獲得幸福的權利，只是你願不願意去改變。今天你可以選擇留在家中，問自己為甚麼在快樂的星期五晚上居然獨自看電視；你也可以作出妥協，與那些不算太差的男生約會；而你也可以嘗試了解男人多一點，嘗試為自己作出一點改變，因為你值得變得更好。


    正如你在千百本書中拿起了這本書，這絕不是偶然，而是你自己作出的選擇，因為你絕對可以隨時放'
  - '[PAGE 24]


    下。有些女人跟了一個錯誤的對象，覺得自己身不由己，其實不然，你隨時可以選擇，追求你想要的生活。


    # 英雄只愛美人？


    有很多女生失戀後，會積極減肥、學化妝，因為她們以為美麗是吸引男生的唯一途徑。越漂亮的女生的確越多人追求，但這種想法是十分危險的。男人跟你分手的根源，不是因為你不夠美，那只是女生對男生的誤解。


    你看完這本書的內容，可以拿來問問身邊的優質男。例如要他列出三個他遇過最漂亮的女生，在哪裏認識？接下來再問他，有沒有試過很愛很愛一個人，她在旁邊時，一切都很美好；你覺得她在你生命中非常重要，不能失去她。否則，生活中美好的事物，都變得沒有意義……'
  - '[PAGE 25]


    然後你問他，他很深愛的這個女人，是不是這三個漂亮的女生中的一個？答案肯定不是。


    每個男人都試過很愛很愛一個女人，願意為她做任何事情。最深愛的那個女人，通常都不是最漂亮的女人。


    我並不是說外表完全沒用，我只是想告訴你，每天走到街上，比你漂亮的女生都不知有多少個，如果因為漂亮就會愛上一個人，那男人豈不是忙得連吃飯的時間也沒有？'
