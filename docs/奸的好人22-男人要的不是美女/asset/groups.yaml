    正如 Facebook 一样，当对方这发表者留言后没有回应，很快就会开始冷淡下来，最后变成这石头般的用户。相反，发表者留言后得到赞好，认同感产生后，就会更积极发表留言不断付出。


    当然“赞好”可以有不同形态的方式，可以是一句发自内心的 Thanks，可以是一个深情的一吻，可以是一份心思的回礼，其实不同形态的赞好都不重要，最重要是令对方感受到你对他的认同。


