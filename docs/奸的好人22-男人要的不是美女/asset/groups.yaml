    \n或許現在的追求者都沒什麼耐性，所以時間才是真正的考驗，誰說雙方彼此能溝通，就代表可以在一起了？錯誤的追求者不會增加愛情路上成功的機會，它只是令你看到很多壞男人的真面目！反而令愛情路上都變得崎嶇了，不想再有錯誤再有失敗，只求一次真愛！\n\
    \n### 讓他聆聽吧！\n\n常常有人請教我：Instant，學技巧很麻煩，做回自己不就可以了嗎？\n\n首先，麻煩與否。如果你希望一件事情有結果，一定要努力付出，不勞而獲的心態會讓你甚麼也得不到。\n\
    \n然後，「做回自己」是對的，也是錯的。\n\n先不講你的「自己」有沒有魅力，即使你有好的想法，好的性格，一大堆優點，都要知道怎麼讓人發現。這就像經濟學上「資訊不對稱」的概念。\n\
    \n而這些訊息的傳遞，有兩個不可缺少的環節，那就是溝通狀態，溝通模式。\n\n先講溝通狀態，人有兩種狀態。一種是「接收狀態」，一種是「關機狀態」。\n\n\
    如果你在他看書，看電視，看奧運的時候，向他講秘密，談心事，他肯定會左耳入，右耳出，因為他處在「關機狀態」。\n\n在社交場合裏，你常常會忘記新認識朋友的名字和職業（但又不好意思再問），因為大家都沒有進入「接收狀態」。\n\
    \n你就是要學會在短時間內，把對方帶入「接收狀態」。\n\n一個簡單的方法就是，出其不意的對他說：\n\n- 「我發現到你的一個秘密」\n- 「昨晚你前女友突然打電話給我」\n\
    - 「告訴你一定件事，你千萬不要告訴別人」\n\n他肯定會立刻坐前，耐心看著你，等你開始說。\n\n# 後記\n\n## 只要是男人都會認同的危機\n\n\
    女人是一種複雜的動物，但她所想要的，卻很簡單；男人是一種簡單的動物，但社會對他的要求，卻一點也不簡單。\n\n試想想，如果你是個男人，你讀醫科，你會發現幾十個和你一樣的同學們都是醫生。你會想，自己和其他人有甚麼分別？或許你是做金融的，你會發現公司裏的人都是一個模樣，每天準時上班，按時或不按時下班，過的是重覆又重覆的生活。整個城市都是這樣的人，而自己彷彿是個面目模糊的過路人，被茫茫的人海所埋沒……\n\
    \n接下來，你很快就要繳付你的第一張帳單，4年大學的學費（還沒包括你海外exchange、留學、讀Master 的開支）。這時家人對你充滿期望，社會也認爲男人要有事業、有車有屋子。你不想給其他人看扁，在公司每晚\
    \ OT 加班，暗地裏盤算著如何節省，想升職、儲蓄、付頭期。雖然每天老闆對你呼呼喝喝，儘管你很想轉工，但是你不能 ……\n\n到了週末，你要準備約會的内容，所有地點話題都要就緒，千萬不能有閃失，也當然是由你付賬啦。你等了半小時，她終於到了。這是你很喜歡的女孩，你經常也接送她上班下班，還特意記下她喜歡的餐廳，經過多次約會，施展完渾身解數，你終於鼓起勇氣向她表白。\n\
