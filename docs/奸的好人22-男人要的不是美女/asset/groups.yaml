  - '[PAGE 112]


    # 給他一個 Like


    ![](img/c7516cb6b18dccbd71f0fbdfe62ac0da_112_0.png)


    如果大家有留意，你會發現一個 Facebook 新用家在剛剛開始發表文章時，通常有兩個情況。


    # 第一個情況


    新手 A 發表文章或留言後，沒有太多人留意或“like” 。之後，慢慢就開始不再發表了，熱情冷卻，最後變成石頭一般的用戶。


    # 第二個情況


    新手 B 發表文章或留言後，開始收到其他用戶的留言或“like”，心態上得到別人的讚賞和認同，開始花更多時間，更多心機發表新文章。最後，誕生了 Facebook
    的網絡紅人。'
  - '[PAGE 113]


    其實人的心態就是這樣簡單，當你想對方投資多一點時間在你身上，不需要很多方法。我們大部分的女學員都並不是想不斷認識異性，她們只是想找到一個合適的對象，之後好好戀愛，不再做戀愛上的失敗者，所以她們想學到的都是令對方投資時間和心力的技巧。


    馴服是約會學的重點環節，要令對方願意向你投入更多就要學會怎樣去“like”。每個男人都想得到別人的認同。曾經有一名女學員菲利，上完約會學後，在吸引階段已經做得不錯的效果，很快就得到自己想要的愛情，但三個月的甜蜜時刻過後，開始感覺對方的熱情不再。


    “到底問題出現在哪裡呢？”


    菲利開始回想這三個月的時間，出現了什麼問題？'
  - '[PAGE 114]


    在我們的一個聚會中，菲利簡單講述了這三個月的狀況，提出這問題，我和 Instant 意見一致：“給他一個 like。”


    大家目光都呆了，都不明白為什麼。


    為什麼這男生對她熱情不再，還要 like 他？菲利在吸引階段做得很出色，但當長期都處於一個吸引的狀態，對方就會很容易適應或疲倦，最後熱情冷卻。一般在冷淡前，就要開始加強馴服階段，令對方投入到不能自拔。


    正如 Facebook 一樣，當對方這發表者留言後沒有回應，很快就會開始冷淡下來，最後變成這石頭般的用戶。相反，發表者留言後得到讚好，認同感產生後，就會更積極發表留言不斷付出。'
  - '[PAGE 115]


    當然 “讚好” 可以有不同型態的方式，可以是一句發自內心的 Thanks，可以是一個深情的一吻，可以是一份心思的回禮，其實不同型態的讚好都不重要，最重要是令對方感受到你對他的認同。


    “但還有一個問題未解決。”


    什麼時候來一個 “讚好” 呢？


    是一見到就讚？


    還是一直讚好就足夠？


    要為長遠的未來鋪排，亦令雙方都感到舒服。賞罰分明是戀愛中一個很重要的心態，如何賞？如何罰？'
  - '[PAGE 116]


    # 賞


    當對方為你付出不論是時間、心力或金錢，都是你讚賞對方的時候。讚賞的機會可以是自然發生，同時也可以是人為因素。重點是引領對方一步步投入在你的世界，最後對方的付出就會成為他生活的一部分。


    # 罰


    罰是相對比較難掌握的方式，不過帶來的得益就會高得多。其實最難掌握的就是罰的程度，到底他的錯要罰他什麼呢？到底他的錯要罰多久呢？


    因為罰是累積的。


    罰是一層層的。


    罰是時機性的。'
  - '[PAGE 117]


    罰在關係管理中是必須的，而且特別在開始的甜蜜階段，很多熱戀的情侶在蜜月期不會去罰對方，但在關係管理而言，蜜月期相對最有效及最影響往後發展，所以罰就要在蜜月期開始。


    賞是令對方投入，罰是令對方著急。


    後面會再講到，這是令男人對你專一的好方法。當你學懂如何“Like”他，他會變得更為積極。然後，你最期待的表白情節就會自然出現了……'
  - '[PAGE 118]


    # 讓他主動來表白！


    ![](img/c7516cb6b18dccbd71f0fbdfe62ac0da_118_0.png)


    Chloe 是個很純真可愛的女生，戀愛拍拖經驗不多，拍拖兩次，被騙命中率是 100 巴仙。


    對，就是兩次都遇人不淑，一個是有婦之夫，一個在交往期間出現了小三。她從此發誓，要專心工作，向男人和兒女私情說 Bye Bye。


    但今次 Chloe 破浪喜歡上了一個條件很不錯的男生，身高 1 米 8，濃眉大眼，很有素質的陽光男孩，而且自己創業，品牌在香港有數家分店。


    「雖然我每天早上下班都會收到他的 Whatsapp 訊息，但現在很多男生啊，都不會只追一個女生。條件比較好的男生，甚至同時間跟好幾個女生在交往呀！」Chloe
    快樂地跟我分享了沒多久，還是忍不住說出了憂慮。'
  - '[PAGE 119]


    「星期六我們第一次約會，很緊張啊！到底要怎樣才可以把他吸引住呢？」


    女生與心儀的對象外出，在首一兩次的約會，可能是因為緊張，又或者是想多了解對方，總是愛發問，特別是一些比較私人的問題，比如你有沒有執業，每個月收入多少，有結婚的打算嗎？這些都會讓男生覺得有壓力，甚至反感呢！


    「約會要勾引。」我告訴 Chloe，「讓他覺得你就是那種可愛的軟軟的，讓人一點都不想拒絕你的女生！」


    如果你在約會中表現出愉快的情緒，對方也會感到愉快，更重要的是讓他覺得你是個不折不扣的甜甜女生。


    要怎樣做到？簡單來說，就是在跟他的互動中，不知不覺讓他感到你跟他有點曖昧。'
  - '[PAGE 120]


    「如果你太明顯示好，第一次約會，就幫他弄弄衣領，答應下次弄他喜歡的菜，他會認為你太主動。你的對象條件愈好，他愈會這樣想！」


    「可是如果你太被動呢，他會覺得你沒趣，不然覺得你不給他機會。」


    Chloe聽了，急著說：「呀！我懵懂啊，男人那麼難搞！我就不能直接對他示好，讓他覺得我是個超細心溫柔的女生嗎？」


    「才不！你不能直接示好，這樣沒用啊！」我笑了笑。


    方法很簡單，你需要一個小魔法：在朋友的界線上「勾引」他。


    一會兒甜甜的跟他說：「你是我的好朋友啊！」一會兒卻做出很多女朋友才會做的事情，讓他覺得意亂情迷，覺得好像跟你很曖昧，然後你卻又把他輕輕'
