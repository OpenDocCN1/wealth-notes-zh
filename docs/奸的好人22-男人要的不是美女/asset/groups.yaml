  - '[PAGE 108]


    # 女士約會 Dos & Don''ts


    ![](img/c7516cb6b18dccbd71f0fbdfe62ac0da_108_0.png)


    “女為悅己者容”，聽起來總有點彆扭；倘若換成“女為己悅者容”，雖不被學者認同，卻話粗理不粗。


    準備赴約的女士們，又該到“喬裝”自己的時候了。為了留下完美的第一印象，總會把自己“大喬”一番，但效果卻答不上比例，因為那往往都不是自己最熟練的妝容，正所謂“出其不意，必自斃”，其實“小喬”一下，效果就已經很搭配。


    彩妝“以少取勝”，才能留下你最想顯露的第一印象，而不是“噢，她化了個貓眼妝，唇色也很大膽”之類的精闢形容。總的來說，唇色和眼妝是男士們分辨女孩子頂著個大濃妝的根據。希望約會對象更關注自己獨特的個性，那就該把注意力，放在如何將肌膚“喬”得更光鮮亮麗，看上去靠譜了，交流起來也如意多了。'
  - '[PAGE 109]


    信心固然重要，但往往魔鬼總藏在細節裡。約會中的兩個人進入餐廳，點菜是必然的吧，如果對方真是“己悅”的，還是稍稍顧慮一下，表示完自己大致的喜好，然後把點菜的權利推給他吧，現實原因是，男士希望可以自己掌握預算；倘若非“己悅”，那女士們請盡情發揮好了。原因聽起來很掘門，實際上避免了尷尬的情況，而被照顧的一方還是能感受得到。


    完美的約會過後，讓女士們期待下一次；但請也不要忽略了那些平淡又無趣的，單單一次小糟糕的約會，那並不代表什麼，還是稍稍給他一個Like，給自己留一個期待。'
  - '[PAGE 110]


