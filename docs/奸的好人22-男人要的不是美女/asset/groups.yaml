    ### 给他一个 Like


    ![](img/c7516cb6b18dccbd71f0fbdfe62ac0da_112_0.png)


    如果大家有留意，你会发现一个 Facebook 新用家在刚刚开始发表文章时，通常有两个情况。


    #### 第一个情况


    新手 A 发表文章或留言后，没有太多人留意或“like”。之后，慢慢就开始不再发表了，热情冷却，最后变成石头一般的用户。


    #### 第二个情况


    新手 B 发表文章或留言后，开始收到其他用户的留言或“like”，心态上得到别人的赞赏和认同，开始花更多时间，更多心机发表新文章。最后，诞生了 Facebook
    的网络红人。


    其实人的心态就是这样简单，当你想对方投资多一点时间在你身上，不需要很多方法。我们大部分的女学员都并不是想不断认识异性，她们只是想找到一个合适的对象，之后好好恋爱，不再做恋爱上的失败者，所以她们想学到的都是令对方投资时间和心力的技巧。


