  - '[PAGE 1]


    或許你會問，為什麼這本書的作者群這麼多？


    本來的計劃是，最多的人材，最少的文字，最深人的內容，最簡單的表達。


    然後在 2013 年完書的時候，我忽然覺得，寫得不夠完美，而又不夠淺白易懂。


    接著我找了更多的專家導師，研究了更多的故事案例。


    結果，出版社就這樣等了 1 年。我還是寫得不夠完美，我最後放棄了這個念頭。'
  - '[PAGE 2]


    甚麼是「完美」？我們總是期待「完美」的愛情，但自己卻不「完美」。我們更沒有想過「完美」的他會是怎樣。到底他會怎樣想？他會喜歡甚麼類型？


    這本書沒有甚麼令你一朝變美的貼士，更沒有令你左右逢源的魔法。我們能做的，只是盡量去坦白，盡量去理解，男人這種簡單又難懂的動物。


    僅獻給這世界不夠完美的愛情。'
  - '[PAGE 3]


    # 想說的話：技巧 VS 真心……


    從前，我一直覺得愛情應該是上天安排的，

    喜歡我的人「自然」會喜歡上我；

    人際溝通也應該是天生的技能，

    「做回自己」就對了，想怎樣就怎樣，結果……


    # 誠意？


    當時，我以為我對你好，所以你也應該對我好；

    我喜歡你，所以你也應該喜歡我。

    然後，我看著我喜歡的女生，和那些我不敢苟同的傢伙風流快活，然後當我是知己，和我哭訴男朋友的不是；

    還有一次，我發現身邊的女朋友對我有所隱瞞，

    我忍不住偷看她短訊和其他男人的甜言蜜語，'
  - '[PAGE 4]


    我無法形容當時的心情，


    我只記得，當時我不能自控，雙手一直在發抖。


    我忽然明白，這個世界，根本沒有甚麼「應該」不「應該」，


    「以為」永遠只是「以為」，


    當時我根本不知道，我「應該」怎樣做；


    你「以為」對方喜歡的，和他真正喜歡的，


    總是有一段很遠很遠的距離。


    # 技巧？


    我有時仍然會想，如果有一天人與人之間的溝通，


    真的不用任何技巧，不用解釋那麼多，那該多好。'
  - '[PAGE 5]


    直接和他說「我喜歡你」不就行了嗎？

    可惜，現實是現實，男人不應該直接表白，

    女生更不能夠直接示愛，

    溝通要用智慧與手腕。


    但戀愛學不是將你變成公主的玻璃鞋，

    戀愛學只是告訴你如何成為更好的自己；

    戀愛解密學不能帶給你幸福，

    因為幸福永遠掌握在你的手中。


    而戀愛一定要是雙方都快樂的事，'
  - '[PAGE 6]


    不是單方面癡癡地的等待，

    不是單方面傻傻地付出，

    不是單方面欺騙換取的的感情，

    不是單方面佔據索取的關係。


    因為，真正的愛情，只有雙贏，或者雙輸，永遠沒有中間。'
  - '[PAGE 7]


    # 關於作者


    總策劃 尹思騰 Instant


    香港創業家、作家、顧問、全球天才會 Mensa 成員。


    自 2006 年起創業，曾創辦業務包括市場推廣，商業研究，私人會所，兩性關係，銷售培訓等。曾獲邀至馬來西亞、臺灣、北京、武漢等地作公開演講。


    Love decode 創辦人，曾帶領中國、台灣、香港、星馬 12 位星級情感專家團隊，創立戀愛解密學，研寫《禁書》、《惡魔獸示錄》等暢銷售，指引無數男女和夢寐以求的戀人甜蜜交往。


    Instant 認為人生就如遊戲，每一個關卡都是一場挑戰。因此創辦真人娛樂遊戲《逃出香港》及《Mr.Escape》，並將其業務帶至澳門、星馬、加拿大等地。


    曾於《3 週刊》撰寫專欄，曾接受美國《CNN》、加拿大《CBC》、法國《AFP》、臺灣《東森電視臺》、上海《星晨電視臺》、《TVB》等媒體採訪報導。'
