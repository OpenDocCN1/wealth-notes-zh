    觸碰是關係中一個重要的部份，你可能會認為這是很輕易的事，在這方面我要提醒的是，這將會非常有效，但要是你錯誤運用，很可能會令場面非常尷尬。我們把觸碰分為力度、時間、方式、場合和關係五個不同的要點，當中涉及很多肢體動作細節技巧，文字難表達，我們會在課堂裏明確示範，現在就初步簡單地講解一下。


