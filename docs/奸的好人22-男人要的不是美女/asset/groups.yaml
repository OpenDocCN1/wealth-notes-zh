    \n「反正你的朋友沒甚麼吃虧，多幾回這樣的經驗，也沒有甚麼損失。」\n\n陳：「女人很恐怖，與男人有性之後，還分得那麼坦然，我覺得很不可思議，誰說，女人要有愛才有性，說分就分，男人跟女人有性之後，還會回味，她們不回味的嗎？」\n\
    \n### 性愛不分的男人\n\n「哈哈，現在是你的朋友性愛不分，你的朋友有沒有告訴你，那位兩位曾經跟他有一夜情的女人是不是在上床做愛時很豪放、野性？」\n\
    \n陳老闆沒有說話。\n\n我繼續說：「我在報紙讀到一則新加坡的新聞，內容是說，新加坡的少婦怕丈夫出國出差會有外遇，就會到情趣店買充氣娃娃給丈夫，哇塞，以後你的朋友太太，也應該送他一個充氣娃娃，他不但可以回味，還能夠玩了又再玩，充氣娃娃不會太絕情吧！」\n\
    \n陳老闆沒有笑。\n\n「你的朋友喜歡偷吃，不怕自己的女人偷吃嗎？\n\n不如這樣，叫你的朋友送無數電子小鳥獨龍鑽動棒給\n太太，要她天天鑽一次。你看男的長期依賴充氣娃\n\
