    \n於是，公公從地上拾起一支樹枝，在沙上寫上：「此時此地，我和老婆吵架了，老婆令我很憤怒，I Hate You!」\n\n一會，孫女兒**待**（原為“大家”或“等”，依語境“待大家心情平伏後”）大家心情平伏後，心裏有個問題不明白，便問公公婆婆：「為什麼之前爺爺扶住了婆婆，婆婆把感受刻在石牆上，剛才你們吵架，卻把感受寫上沙上？」\n\
