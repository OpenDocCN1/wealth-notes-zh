    草食男是現在很普遍的現象，主要是因為男人生活習慣的關係，缺少了人與人之間的接觸，使得溝通上出現一個嚴重障礙，所以要令男生開始採取主動，你先要發放出合適的綠燈訊號。綠燈訊號可以分開幾個不同的部份，我們在課堂中詳細講解了綠燈訊號的方法及發放的時機，觸碰就是一個很好的綠燈訊號，而且能令男人最快的時間對你產生興趣。


