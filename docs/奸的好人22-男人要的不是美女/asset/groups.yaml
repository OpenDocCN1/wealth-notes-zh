    東西都給你想到……」\n\n「夠放就足夠了！總比充氣娃娃好！改天情趣\n店不知道有沒有『真人』賣？」\n\n### 還是緣份吧！\n\n![](img/c7516cb6b18dccbd71f0fbdfe62ac0da_195_0.png)\n\
    \n對別人來說，我比較幸運吧！因為一直以來，我都是一個被別人追求的角色。對於愛情，我總是被動的。\n\n而我是個忠於自己感覺的人，亦不容易喜歡上一個人，所以追求者多與少也沒關係。我相信在對的時間，遇到對的人，再遇上對的時機，有緣才會在一起。所以其實我也沒有太刻意去做些什麼去吸引人，要來就來！一切隨緣。\n\
    \n但如果現實一點，其實大部分的男人，也只不過是因為單單的外表而有興趣去認識一個人，不過也要明白，愛情的第一步就是好感，所以我相信給別人第一次的感覺非常重要。\n\
