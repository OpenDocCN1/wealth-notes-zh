    大家目光都呆了，都不明白为什么。


    为什么这男生对她热情不再，还要 like 他？菲利在吸引阶段做得很出色，但当长期都处于一个吸引的状态，对方就会很容易适应或疲倦，最后热情冷却。一般在冷淡前，就要开始加强驯服阶段，令对方投入到不能自拔。


    正如 Facebook 一样，当对方这发表者留言后没有回应，很快就会开始冷淡下来，最后变成这石头般的用户。相反，发表者留言后得到赞好，认同感产生后，就会更积极发表留言不断付出。


    当然“赞好”可以有不同形态的方式，可以是一句发自内心的 Thanks，可以是一个深情的一吻，可以是一份心思的回礼，其实不同形态的赞好都不重要，最重要是令对方感受到你对他的认同。


    “但还有一个问题未解决。”


    什么时候来一个“赞好”呢？


    是一见到就赞？


    还是一直赞好就足够？


    要为长远的未来铺排，亦令双方都感到舒服。赏罚分明是恋爱中一个很重要的心态，如何赏？如何罚？


    #### 赏


    当对方为你付出不论是时间、心力或金钱，都是你赞赏对方的时候。赞赏的机会可以是自然发生，同时也可以是人为因素。重点是引领对方一步步投入在你的世界，最后对方的付出就会成为他生活的一部分。


    #### 罚


    罚是相对比较难掌握的方式，不过带来的得益就会高得多。其实最难掌握的就是罚的程度，到底他的错要罚他什么呢？到底他的错要罚多久呢？


    因为罚是累积的。


    罚是一层层的。


    罚是时机性的。


    罚在关系管理中是必须的，而且特别在开始的甜蜜阶段，很多热恋的情侣在蜜月期不会去罚对方，但在关系管理而言，蜜月期相对最有效及最影响往后发展，所以罚就要在蜜月期开始。


    赏是令对方投入，罚是令对方着急。


