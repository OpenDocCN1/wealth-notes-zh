- pgno: 120
  md: '看完前一篇，你或許會認為，既然如此，乾脆選擇共享汽車或訂閱式租車。 「訂閱」是每月繳納固定費用使用某物品或某服務的商業模式，無須一次支付全額買斷商品。這種商業模式原本只用於影音網站、串流音樂平台，最近全球最大的汽車製造商豐田也推出這類服務，提供全新的車輛使用方式。


    但是我對訂閱式租車服務充滿懷疑。


    這種商業模式是會員每月固定繳一筆租用費，實際上與貸款買車別無二致，解約時還有可能得多浪費一筆錢。另外，為了避免訂閱的會員中途解約，業者會刻意擬定複雜的解約機制。有些服務甚至會綁定使用期限，提前解約必須收取違約金。就連豐田汽車的訂閱式租車也規定，如果不是在每六個月一次的換約期解約的話，必須收取兩個月的違約金。這種情況與日本過去的「三大行動電話公司」一樣，解約門檻總是設得特別高。


    這樣一來，訂閱式租車就與傳統租車沒兩樣，兩者的差別只在於是否包含任意責任保險。也就是說，兩者實質上是一樣的東西，只是呈現的方式不同罷了。


    其他還有許多類似的例子。比方說，我過去經營的情報資訊販賣公司，經常有人批評是毫無內容的投機事業，但現在卻變身成為「線上沙龍」、「app」，也有許多名人在經營。各位仔細想想，那些其實就是「販賣經過包裝的情報資訊」，只不過是換了介紹方式而已。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '面或平台，改變行銷方式罷了。


    另外，年輕女性找上中年男性獻身的生意，自古以來就以各種形式存在，並在幾年前以「爸爸活」20 的新名稱捲土重來。「援助交際」這個說法不好聽，「爸爸活」感覺上就好聽多了。在這個世界上，像這樣本質上相同，只是改變呈現方式的事物不計其數。訂閱式租車服務有部分內容其實也和傳統租車差不多，只是換了一個方式呈現，透過形象的操弄，讓訂閱式租車看起來比傳統租車更美好而已。


    這就是所謂的「舊酒裝新瓶」，業者將已有的商品或服務換個名稱，試圖讓消費者認為這是前所未有的全新商品或服務。因此，我們更應該時常深入思考事物的本質。


    # 社會上到處都是想要騙你錢的危險陷阱。


    電視上大量播放著帥哥美女擔任形象代言人的廣告；街頭、車站也到處都是吸引目光的平面廣告和活動。再加上社群網站上網紅的商品宣傳、部落客的成功瘦身經驗、樣


    19即INTIDOMO、air和Smartknot。


    20 在二〇一四年左右出現在日本社群網站上的名詞，女性為有錢的年長男性提供服務，換取經濟援助，類似援助交際。在日本，找尋結婚對象的聯誼相親活動稱為「婚活」；大學生畢業找工作稱為「就活」，即就業活動的簡稱。因此把找錢爹提供經濟援助稱為「爸爸活」。'
