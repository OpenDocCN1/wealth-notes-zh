  img_proc: true
- pgno: 232
  md: '玩具店時才開心。所以把麵包超人商品鋪貨到實體商店的進口商，就能拉高其他人參一腳的難度。


    抬高售價是麵包超人授權單位允許的行為嗎？還有關稅該怎麼處理呢？關於這些我不是很清楚。但看到這樣的生意能夠長久存在，我不禁感到欽佩；所謂做生意的良機，就是只要仔細觀察四周，也有可能混得風生水起。


    # 採購進來的東西加上利潤後賣出∥做生意


    這只不過是我最近看到的一個例子，而且這種生意有库存的風險。但如果業主採購了一百萬日圓的商品全部都能賣光，就會變成兩、三百萬日圓的現款回來；採購三百万日圓的商品賣光，收入就會擴增到六百萬至九百萬日圓。這六百萬至九百萬日圓如果拿去再投資，就能夠增加軍費。假如你想做這門生意，說實話也沒有不能做的理由。重點在於「將採購進來的東西加上利潤後賣出」。


    有一種貿易方式稱為「直運（Dropshipping）」。簡言之就是「無須採購商品（零庫存）」也能開網路商店的商業模式。'
  merge: -1
  img_proc: true
- pgno: 233
  md: '追隨者眾多的部落客當中，有些人就是利用直運的商業模式，銷售原創T恤等商品來獲利。


    直運的優點是，由業者提供T恤等商品，替你印上原創設計，幫你出貨，因此你完全沒有任何庫存，而貨運費用則是由買家負擔。舉例來說，部落客把商品五百日圓、印製費一百日圓，總計六百日圓（約新台幣一百六十二元）採購買的T恤，以一千五百日圓（約新台幣四百零五元）販售，賣一件就能賺九百日圓（約新台幣兩百四十三元）。


    另外再舉一個例子，我在第一章也提過把各類資訊寫成內容文章投稿並收費的blog服務，在日本似乎很流行。這門生意也沒有生產成本，扣除系統使用費之後，剩下的全是毛利。


    其他還有在日本以外的國家流行的「OniPress」服務，以月費制販售性感女性的數位照片或影片。這項服務讓原本很難賺錢的社會階層可以賺錢，一年賺超過一億日圓以上。高學歷才有高收入的社會常識已經不適用，沒人曉得機會什麼時候會找上誰。


    像這樣利用網路做生意的案例，只要想找，要多少有多少。說得極端一點，去河邊撿一塊漂亮石頭回來標價賣，也是零成本的生意。雖說商品沒有附加價值的生意很難長久維持下去，不過替石頭標價就是在做生意了。'
