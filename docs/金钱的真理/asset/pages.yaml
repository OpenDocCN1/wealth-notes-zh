- pgno: 47
  md: '好處的幸福就是至高無上的幸福」。他們無法忘記自己曾經滿足過的欲望，即使明白狀況正在逐漸惡化，仍會產生新的欲望，緊抓著不放，直到滿足它為止，反而使傷口惡化到無法挽回的局面。


    我也想過倘若自己當初能夠早日清醒過來，或許就不至於跌落谷底。由此可知，從幻覺中清醒過來有多麼困難。就看你是否及時懸崖勒馬，還是摔下懸崖後才幡然悔悟。現在正在閱讀本書的你如果正處於絕佳狀態，請重新審視自己，看看自己是否變得驕傲自大？是不是覺得自己的所作所為都是對的？對待金錢的態度是否輕忽隨便？是不是認為小錢隨時都可以再賺回來？假如你有以上徵兆，請把我的失敗經驗當作教訓，不管用什麼方法，都要讓自己立刻清醒過來。'
