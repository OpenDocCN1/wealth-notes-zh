- pgno: 312
  md: '大筆金錢後反遭對方利用的例子也時有耳聞。


    多數養小白臉的人，說好聽是心地善良；這類單純又直接的人基本上不會懷疑別人，所以容易上當受騙，也最有可能吃虧。如果沒有遇到壞人還好，但基本上人類這種生物，只要身邊有好操弄的人，就不會放過機會。因此我們一開始就不應該期待對方會善待自己，一定要預設對方有可能會把自己吃乾抹淨，連骨頭都不剩。


    對超自然、神祕學深信不疑的人都有「確認偏誤」39，一旦相信某個東西，即使聽到或看到惡評，他們也只會收集對自己有利的證據，完全無視不利自己的證據。遇到這類型的受害者，批評他們深信不疑的東西，只會引發他們的反感，讓他們更固執地繼續往錯路走下去，堅定不回頭。


    正如《論語．學而篇》所云：「過則勿憚改。」發現錯誤永遠不嫌太晚。發現走錯的那一刻馬上換到正確的路，才是最重要的。


    39 Confirmation bias，個人選擇性地回憶、蒐集有利細節，忽略不利或矛盾的資訊，來支持自己已有的想法或假設。'
