- pgno: 84
  md: '# 年收入高不見得是真正的有錢人


    還有一件事你必須知道。


    那就是――「有錢人」的定義是什麼？


    去書店走一趟，你會看到架上陳列著《年収千萬不是夢》、《賺到年収一億的○○○》等，許多以「年收入」為賣點的書。商業雜誌也經常製作「平均年收入最高五大企業排行榜」等特輯，把焦點鎖定在年收入。


    我聽說在婚友社網站註冊的女性中，許多人要求另一半的首要條件就是「年收入一百万円」（約新台幣兩百七十萬元）。


    從這樣的社會風氣可以看出，多數人以「年收入」來判斷一個人的身價，並以年收入的金額多寡判斷對方是不是有錢人。


    問題是，年收入高的人不見得是真正的有錢人。


    年收入在經濟術語上屬於「流量」（flow）。流就是流動的意思。假設你從某個時期開始一整年每個月領薪水，再從薪水扣掉稅金和必要支出。現金在一定時間內像水一樣流進流出，就稱為現金流。'
  merge: -1
  img_proc: true
- pgno: 85
  md: '與現金流相反的錢稱為「存量（stock）」。假設年收入是流量，存款就是存量，錢是處於靜靜存放的狀態，不會像現金流一樣劇烈變動。


    但是，我所謂的存款，意思與總資產不同。美國知名經濟雜誌《富比士》（Forbes）每年都會根據總資產的市值多寡，公布「全球富豪排名」。這個總資產不只包括存款，還有股票、不動產、保險、投資信託等，但其中可能還有尚未清償的負債。負債是必須償還的「他人資產」。總資產之中如果還包含了別人的錢，即使總資產再多，也不代表這個人就是真正的有錢人。負債愈多的人愈有錢，豈不是很奇怪？


    也就是說「全球富豪排名」裡，可能也包含了因為負債多而上榜的人，或是總資產多負債也多的人。事實上有報導指出，軟體銀行的孫正義社長、ZOZO¹²的澤友作前社長，都曾抵押自家公司的股票貸款。基本上我對別人的壞消息沒興趣，因此沒有詳細了解實情。我並不是要強調這兩位都有負債，毋庸置疑，他們兩人都是我遠遠比不上
    的超級富豪。我想說的是，世人往往習慣只看總資產，卻沒有考慮到其中是否包含負債，這種傾向不正确。負債是一定要償還的；只要有負債，資金調度就會出現問題，還款逾


    12 日本最大流行服飾購物網站「ZOZOTOWN」的母公司。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '期就會破產。相反地，只要沒有負債，就無須擔心破產。


    因此，要確定一個有錢人是否無須擔憂破產，就必須用總資產減去負債，根據對方的「淨資產」多寡來判斷。相對於總資產裡可能包含別人的錢，淨資產正如其名稱，純粹是「只屬於自己的資產」。


    我再提一個判讀資產時的重點，那就是資產額的評比標準是根據市場價格（目前的價格）。市場價格時常變動，幾個月之前的評比與現在有可能完全不同。目前全球富豪手上的資產市值，在新冠肺炎疫情之後均大幅下跌。也就是說，像這次這樣的市場崩盤，就足以使得資產價值瞬間蒸發。


    即使我擁有不動產、公司債、股票、虛擬貨幣也不能倖免。不會受到市場價格變動影響的唯有現金。所以發生金融危機時，大家才會說：「現金為王（Cash is King）」。


    再回到流量與存量的話題。流量有停止流動的風險。反之，存量（現金亦屬之）本不存在停止的概念。前面提過變動資產會發生市值評比下跌的問題，但已經累積的存量並不會消失。尤其如果存量是優質股票或優質不動產，股票會持續發放股利，而不動產會帶來持續的房租收入。


    因此，只要淨資產夠多，即使年收為零，這個人也仍然是有錢人。而且淨資產還可'
  merge: -1
  img_proc: true
- pgno: 87
  md: '一點一點地變現（換成現金）讓你活下去。


    話說回來，以年收入來定義一個人富有與否也是眾說紛紜；有一說認為年收入三千萬日圓（約新台幣八百零九萬元）以上才算是有錢人。


    我們來比較看看年収三千萬與年収為零的人。


    假設一個年收三千萬的人，淨資產只有一千萬日圓的存款。另一方面，年收為零的人淨資產卻有三十億日圓。即使比較兩人幾十年後的情況，仍然是年收入零但淨資產多的人，才是毋庸置疑的有錢人。


    年收三千萬日圓的話，累進稅率也會提高。從實質稅率（或稱有效稅率）的角度來看，收入扣除税金等各項費用之後，大概會剩下兩千萬日圓（約新台幣五百四十萬元）左右。這麼一來，假使這兩千萬全部存起來，十年後也只有兩億日圓（約新台幣五千万四百万），一百年後也只有二十億日圓（約新台幣五億四千萬元）。


    因此，年收入三千萬與年収為零的人，誰是有錢人一目了然。


    也就是說，不管年收入比一般老百姓高多少，即使用上上一輩子的時間，也贏不了淨資產多的人。所以，假如你今後的年收入（流量）增加，也不要就此鬆懈，接下來能否累積淨資產，才是真正的戰局。'
  merge: -1
  img_proc: true
