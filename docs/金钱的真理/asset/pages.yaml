    # 「自以為是」燒了我好幾億


    我在這些完全無法帶來利潤的「投資」上所花的金額，累計高達數億日圓。儘管並不是所有找上門來的邀約都會掏錢出來，但我還是浪費了很大一筆錢。更傷腦筋的是，當時是我自己決定要掏出那些資金，讓那些錢有去無回，並不是誰強迫，也經常有機會拒絕。也就是說，這一切都是我「自找死路」。


