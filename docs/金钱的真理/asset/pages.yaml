  md: '損了，但我不在意」「賠了錢也是無能為力」的態度，敷衍了事。如果你把錢當成自己的孩子般愛惜，你一定不會說：「孩子丟了就算了。」因為自己的疏忽導致孩子身亡的父母，一輩子都會活在陰影裡。你也必須拿出這種程度的認真態度對待金錢。


