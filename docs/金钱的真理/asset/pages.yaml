  md: '即使我這兩個金融商品已經買了四年，也符合合約上合法解約的權利，解約的過程卻不順利。對方的負責人買一個換過一個，拚命慰留我。在經歷一連串的交手之後，我發現：因為疫情衝擊的變數，金融業目前的局面也相當混亂。


    最後，解約了兩個投資基金之後，我重新思考，決定今後絕對不再把钱交給大名鼎鼐的投資信託和基金。仔細想想，解約與管理的手續費也收得不合理，而且一旦發生變數，對方就有很多藉口，甚至有可能不遵守約定。


    # 我重新仔細分析過契約後，也清楚了了解到目前這些金融商品的設計，都是我們這些投資人在承擔高風險，但我們得到的回饋卻是微乎其微。


    委託別人投資是浪費時間和金錢的行為。如果要投資，不管是虧是賺，還是自行操盤比較穩當。原因在於自己動手的話，能夠大大增加個人的經驗和見識。


    每次有了新的人生經驗，我就會這麼想：


    「這世上原本就沒有什麼值得信任，能夠相信的只有自己的技術。」


    我自己過去也曾經多次接到許多大型金融機構的提議：「您要不要拿持有的股票當作擔保申請融資，加買其他金融商品呢？「假如我當時利慾薰心，真的同意該提議的話，我現在的淨資產早就嚴重虧損了。因為我如果使用槓桿背負利息，花十億日圓起跳'
