- pgno: 75
  md: '段患者不會立刻就死掉。公司也一樣，即使經營狀況不佳，通常還是能夠撐個幾年才破產倒閉。而這個「不見得立刻就會死掉」就是人們始終樂觀看待問題的最主要原因。


    但是，在現今劇烈動盪的時代，樂觀等同於自尋死路。你必須在隱約感到不安的階段就下手為強，打破僵局。這一次的新冠肺炎疫情使得人類全體對金錢產生強烈的不安。


    我之所以不組團隊也不設辦公室，避免提高固定支出，選擇獨自一人在國外各處私人住宅遠端工作，全是因為我經常在腦海中預設有可能發生類似這次疫情、引發經濟停滯的緊急情況。也多虧如此，除了個人投資多少有些損失之外，我的事業沒有受到這波經濟衝擊太大的影響。


    當然，我沒有具體預測到會發生新冠肺炎病毒的全球大流行，也沒有料想到二〇二○年會突然爆發疫情蔓延，甚至嚴重到必須限制外出。


    但是，在我即將三十歲時，身為公司經營者的我，曾經歷過二〇一一年的三一東日本大地震，那件事令我印象深刻。從那之後，我時常擔心人類無法抵抗的天災異變會再次發生，也隨時做好因應準備。


    其結果就是，我平時不出門上班，也不參加聚餐或與人往來，因此即使爆發新冠肺炎'
