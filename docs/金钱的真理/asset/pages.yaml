- pgno: 103
  md: '想要成為有錢人，必須養成「守財」的習慣。


    一聽到守財，你或許以為就是已經成為有錢人的說法維持自己的淨資產不減少。完全不對！各位今後在創造財富的過程中，一定要做到一件事：這世上有許多危險陷阱會奪走你手上珍貴的財富。在創造財富的同時，如果你無法遠離這些陷阱守住財富，你的淨資產將永遠不會增加，始終在原地踏步。


    為了避免這種情況發生，首先你必須仔細掌握自己「真正的年收入」。所謂真正的年收入，指的是第一章提過的，用年收入扣掉所有生活必要開支算出來的「可處分所得（個人淨利）」。


    跟經營公司一樣，生活也有許多必要支出。這些支出大致上可分為「固定支出」和「變動支出」這兩類，主要細項如下：


    # 【固定支出】


    居住費（房租、房貸）、保險費、自來水費、電費、通訊網路費、教育費……金額固定且每個月都必須支付的開銷。


    # 【變動支出】


    餐費、日常用品費、醫療費、治裝費、娛樂交際費、雜支……自己能夠控制金額多寡的可變動開銷。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '以會計術語來說的話，變動支出就是隨著營業額增減的開銷。舉例來說，假設餐飲食 店收下顧客支付的一萬日圓（約新台幣兩千七百元），要付給信用卡公司 3% 的刷卡手續費，也就是三百日圓（約新台幣八十元），這時三百日圓就是變動支出。假使營業額為兩萬日圓（約新台幣五千元四百元），必須付給信用卡公司的手續費就是六百日圓（約新台幣一千一百二十元）。這筆支出就像這樣，會隨著營業額變動。


    但是，個人的固定支出與變動支出，就沒有必要像這樣按照會計上的定義去思考， 只須照字面上的意思理解即可。金額單純不變的就是固定支出；可按照個人意願變動的 就是變動支出。我之所以用固定支出和變動支出等專業術語來說明個人支出，只是為了
    方便各位理解而已。首先，固定支出是為了活下去的最低營運成本。因為沒有住處會很 困擾，沒有手機則非常不方便。


    # 一味省錢，反而無法累積財富


    可處分所得少的人往往以爲必須把固定支出縮減到極限，才能夠增加可處分所得。 理財顧問或省錢達人給的建議都是陳腔濫調，他們只會告訴你：「這筆和那筆支出都是'
  merge: -1
  img_proc: true
- pgno: 105
  md: '浪費，請全部刪除。』


    我要告訴你的，不是「總之就是縮減開銷」這麼單純的答案。


    因為，不合理的節約，其實並非好辦法。


    以我個人來說，那些憂心未來會出事而繳納的保險費，以及定時定額收費的服務的確應該中止，但三餐和居住環境至少必須維持一定的水準。如同我前面提過的，在家工作的重要性提升之後，飲食和居住環境對於工作表現會有很大的影響。乾淨衛生的居住環境、快速好用的網路、健康適量的飲食——如果捨不得這些投資，以中長期來說你將不會有好的表現。


    另一方面，假如你考慮縮減變動支出，交際費往往是第一個刪減的支出；但與朋友聚餐喝酒對於紓解壓力又有一定的效果，也有人把這當成努力的動力。


    要活得有活力，心理層面的養分不可或缺，所以不應該停掉所有娛樂，因此我不會刪掉與交往對象約會的支出。事實上，當初我落魄至極的時候，也沒有省下與那時還是女友的妻子交往的支出。那是激勵我努力下去的唯一動力。


    另外，買書學習也很重要。我在落魄時也沒有停止做的就是買書。人沒有知識，就無法繼續向前。'
  merge: -1
  img_proc: true
- pgno: 106
  md: '這些說起來其實與日本憲法的條文有異曲同工之妙。日本憲法第二十五條第一項將「健康且最低限度的文化生活」視為國民的權利，認為應該給予保障。這裡所謂的健康是什麼？文化又是什麼？我們必須針對這兩點仔細思考。


    想要成為有錢人，首要條件就是「舒服地活著」。


    原因在於，一個人的心理若不健康，思考就會鈍化，一事無成。人們要配合情況適度思考，解決現實中的問題，大前提就是必須保持心理的健全。心理（精神）一旦不穩定，職場與家庭內部就會産生不協調的雜音，甚至做出平時不會出現的暴力行為。


    環境是讓自我現形的一面鏡子；妻子心情不好就是你行為的反射。如果你想要打造理想的环境，首先就必須振作自己的精神。你四周的世界不是別人造成的，那是你內心的投射。


    一味地節儉、禁慾，把自己逼到這種狀態，只會帶來反效果。我希望各位常保良好 的心理狀態，好面對未來更大的挑戰。


    像這樣子，維持心理健全狀態所必須的最低限度支出，我稱為「生活成本」。


    這是一個人面對挑戰時不可或缺的支出。因此，並非所有需求都割捨就是最好的守財方法。每個人要維持心理健全所必須付出的成本因人而異，所以你應該自行認真思考'
  merge: -1
  img_proc: true
- pgno: 107
  md: '找出結論，分辨這個是必要的、那個不是。當中也會有一些你必須狠心剋捨的事物。以固定支出為例，為了減少房租支出，你有時也需要先租狀況較差的物件來住。這一切的判斷標準就在於是否符合「能讓心靈經常處於滿足狀態的最低限度支出」。「處於滿足狀態」與「最低限度」，這兩個條件是互相矛盾的。也就是說，決策要講究平衡；支出過多不行，過度削減也不行。


    而扣除生活成本剩下的錢，才是你實際的年收入（可處分所得）。


    # 「真正的年收入」不是賺多少錢，而是剩多少錢


    繼續思考下去，我們會發現一個真相。


    也就是說，即使年收入同樣是一千萬日圓，實際年收入也會因人而異。


    假設有兩個在一流的商社工作的菁英上班族，兩人的年齡都是三十歲左右，單身，年收入同樣是一千萬日圓。A員手工邊剩下的可處分所得是一千三百萬日圓（約新台幣八十萬元）；相反地，B員工只有他的十分之一，也就是三十萬日圓（約新台幣八萬元）。A員工過著健康又充實的極簡生活，沒有太多物品；B員工則是物欲強，而'
  merge: -1
  img_proc: true
- pgno: 108
  md: '且背負了龐大的房貸和車貸。

    就像這樣，從可處分所得的角度思考就會發現，稅前年收入同樣都是一千萬日圓的人之間也有很大的差異；A員工與B員工的年收入實際上就相差了十倍之多。

    接下來，我們以比較貼近一般人現實狀況的年収入當作標準，再來思考可處分所得的問題吧。


    根據日本國稅局的〈民間薪資實況調查〉最新數據顯示，日本國民平均年収入大約是四百四十一萬日圓（約新台幣一二百一十九萬元）。

    各位也清楚，公司每個月發的薪資會先扣除健保費、勞保費、所得稅、住民稅。健保費、所得稅的稅率根據薪資額度有所不同；年收入四百四十一萬日圓的話，實際上能領到的金額大約是三五百四十四萬日圓（約新台幣九十六萬元）。

    然後，再用三百五十四萬日圓扣掉一整年的生活成本：


    +   【公寓大樓等房租】一個月十萬日圓 × 十二個月＝一百二十萬日圓

    【瓦斯、水電費】一個月二萬日圓 × 十二個月＝二十四萬日圓

    【食材或外食費】一個月八萬日圓 × 十二個月＝九十六萬日圓


    一百二十萬日圓＋二十四萬日圓＋九十六萬日圓＝二百四十萬日圓（約新台幣五十八萬元），也就是說，扣除房租、水電、伙食之後，剩下的錢只有一百零四萬日圓（約新台幣二十五萬元），可處分所得大約佔全年的收入的百分之二十，跟A員工和B員工所處的狀態相差約三倍以上。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '+   【日常用品費】一個月一萬日圓×十二個月=十二萬日圓

    【醫藥費】一個月一萬日圓×十二個月=十二萬日圓

    【手機與網路費】一個月一萬日圓×十二個月=十二萬日圓

    【治裝費】一個月二萬日圓×十二個月=二十四萬日圓

    【與朋友、家人、交往對象的交际費】一個月二萬日圓×十二個月=二十四萬日圓

    【其他雜支】一個月〇・五萬日圓×十二個月=六萬日圓


    生活成本合計約三百三十萬日圓（約新台幣八十九萬元）。用三百五十四萬去減，就只剩下二十四萬。也就是說，即使年收入達到平均值，可處分所得頂多也只有二十四萬日圓。


    你或許不想要面對這個真相，但這才是你的實際年收入。把這筆錢換算成每月的收入，你的月收入就是二萬日圓（約新台幣五千四百元）。一切都耍像這樣，從淨利的角度思考，你才能夠認清嚴峻的現實。用稅前金額來談年收入的話，你永遠無法增加淨資產。


    再說這每月二萬的金額，也不是你可以盡情花用的錢；其中一半必須存起來當作'
