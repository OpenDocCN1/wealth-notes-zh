- pgno: 185
  md: '在經商與投資上，起身行動參與的時間點非常重要。成功機率最高的，是在比例約占六分之一、對潮流很敏銳的族群開始動起來時，跟著他們行動。這個族群稱為「嘗鮮者（Early
    Adopters，又譯「早期採用者」）。所謂嘗鮮者，是史丹佛大學社會學家羅吉斯（Everett M. Rogers）教授在距今五十多年前提出的「創新擴散理論」中，擔任潮流形成重要角色的購買族群。創新擴散理論把新產品與新服務在市場上普及的過程分成五個等級，建議以此為基準，重新審視行銷策略與市場的生命週期。創新擴散理論將普及過程分成以下五個等級：


    # **【創新者（Innovators）】占整體市場的1・5％**


    最早使用商品與服務的族群。他們的資訊敏銳度度高，「新穎」是他們衡量的價值。即使是尚未於市場普及、價格偏貴的產品與服務，只要符合自己的價值觀，就會採用。


    # **【嘗鮮者（Early Adopters）】占整體市場的13・5％**


    速度儘管不及創新者，仍屬於早期就注意到新商品或新服務，並購買使用的族群。他們對世界脈動與流行潮流很敏銳，積極收集資訊，使用接下來可能會流行的東西，因'
  merge: -1
  img_proc: true
- pgno: 186
  md: '此很容易成為意見領袖。對於接下來幾個族群也具有很大的影響力，被視為這五個族群中最重要的攻克目標。


    # 【早期大眾（Early Majority）】占整體市場的三四四％


    這是相對謹慎的族群。他們的情報敏銳度雖高，卻不會立刻接納新產品或新服務，容易受到「嘗鮮者」的意見影響。


    # 【晚期大眾（Late Majority）】占整體市場的三四四％


    相對之下疑心較重的族群。他們對於新產品與新服務的態度消極，必須確定使用者已成為多數之後才會接納並使用，普及率不高就絕不會行動。


    # 【落後者（Laggards）】占整體市場的十六％


    這是市場中最保守的族群。他們對於世界脈動與流行不太在意，不只是要等到新商品或新服務普及，還必須等到那些東西成為文化、傳統或常識的一部分，才願意嘗試。'
  merge: -1
  img_proc: true
- pgno: 187
  md: '各位一看就知道，「創新者」的族群購買新商品時，市占率只有市場整體的二五％。另一方面，等到晚期大衆開始購買新商品時，市占率已經超過五○％。這也就是說，跟著創新者行動固然太早，但看到晚期大衆行動才動起來，就已經太遲了。許多人都是看媒體報導新商品才開始關注，但幾乎都已經是在晚期大衆行動之後。比較之下，創新者與嘗鮮者全都買下新商品的話，市占率也只有十六％。這就是新商品接下來會開始流行的絕佳時間點，不算太早，當然也不會太遲。


    確認新商品已經在嘗鮮者之間普及以後再行動，我認為就是輕鬆成功的關鍵。反過來說，早於嘗鮮者行動的話，時機還太早，必須自己花時間推廣與說明。而晚於嘗鮮者行動的話反應又太慢，此時的對手太多，就無法以先驅者自居，成功的機率也會降低，接下來的路就艱辛難行了。


    # 現在才加入YouTube，已經沒有優勢


    同樣的道理，各位可以套用在目前流行的YouTube上。整體而言，YouTube的時代應該還會持續一段時間，不過我認為如今已經發展到早'
  merge: -1
  img_proc: true
- pgno: 188
  md: '期大眾接二連三加入的階段；二〇二二年之後，恐怕連晚期大眾也會加入，演變成過度競爭的局面。於是，儘管整體業續仍持續成長，但部分玩家的發展可能就不一樣了，或許到時候我們會在媒體上看到人氣
    YouTuber 轉行，或是原本的高收入不再，或網紅退出 YouTube 等消息。也就是說，我認為現在才加入，已經錯過最恰當的時機了。


    舉例來說，假如你是看到日本超人氣 YouTuber「Hikakin」${}^{30} 拍廣告或參加綜藝節目，才決定加入 YouTube，就有點太晚了。


    我無法斷定兩者之間的關聯，不過，Hikakin、Kaine 社長 ${}^{31}$ 等人氣 YouTuber 隸屬的 Uuum 公司股價，在這次疫情衝擊之前就已經開始下跌，代表他們的人氣跟之前全盛時期相比，已經開始下跌了。


    從股價可以預見未來，看穿未來的真實情況並搶先一步做出反應；等股價到達最高峰，自源臨極限的那一刻起，原本搶先反應的數十分比漲幅就會開始下跌。這種情況經常發生。


    新加入的菜鳥這時候才進場，即使做了跟老鳥同樣的事情，也賺不了大錢。即使多有些收入，也沒有什麼優勢，往往會變成我常講的「事倍功半」的狀態。


    再者，新的對手接二連三帶著新點子出現，即使你暫時賺了錢，市占率也多半很快'
  merge: -1
  img_proc: true
- pgno: 189
  md: '就會被搶走。因此，假如你現在靠YouTuber賺了錢，千萬別就此安心，最好先做足準備，預測接下來會面臨的困境，盡快摸索出其他賺錢的方法。


    由此可知，太晚加入只會耗費成本與負擔。想要維持優勢的話，也需要花費更大的勞力。如同我在前面提過，過早加入也很耗費成本與勞力。因此，無論你今後有任何打算，一定要仔細衡量參與的時間點，因為這個時間點將影響到你的成敗。


    當然，像YouTuber這種已經很成熟的平台，還是有很多賺錢方式，因此我不是反對各位現在才決定加入。


    只是，新人要一口氣超越前人，成功取得優勢，絕對要絞盡腦汁下功夫。現在的YouTuber有大批藝人加入使用，無名小卒若沒什麼好點子就加入戰局，想要累積人氣並維持優勢，基本上格外困難。你必須記住「好景不常」的道理，以悲觀的態度謹慎地努力下去。


    30 日本知名YouTuber，影片主題有dress表演、遊戲實況、日常生活、有趣實驗、企業合作等。


    31 中文常譯為「哈吉祥社長」、「豆芽菜社長」，日本知名YouTuber，影片主題包括生活實驗、惡作劇、靈異探索、文員介紹、遊戲實況、商品介紹、企業合作等。'
  merge: -1
  img_proc: true
- pgno: 190
  md: '這時候最重要的就是與眾不同的發想。想要單靠行動力贏得好評，只適合很早就加入的人。到了後期你才終於動起來，慢吞吞地想要踏入這個成熟市場，就必須焚膏繼晷努力想出吸引人的點子才行。如果吝於付出努力，奉勸你最好別加入已經成熟的市場。


    任何事並非開始行動就一定會有好結果，沒有勝算就採取行動，就沒有任何意義。


    所以，**你還有一個選擇，就是等待下一波潮流。緊盯可能引發新潮流的嘗鮮者動向，找出有利可圖的題材，並規畫開始行動的時機。建議你平日可以多注意各領域資訊敏銳度高的嘗鮮者族群，鎖定目標之後，透過社群網站等確認他們目前正在關注什麼、說了什麼話、做了什麼事，在最適當的時機採取行動吧！**'
  merge: -1
  img_proc: true
- pgno: 191
  md: '＊ 只有存款的人退休生活只能还过得去


    # 致富心法 20


    光靠储蓄

    无法成为真正的有钱人'
  merge: -1
  img_proc: true
- pgno: 192
  md: '在撒下財富種子的同時，你必須做的另一件事是儲蓄。


    當然，不管再怎麼努力存錢，單靠存款基本上無法成為有錢人。想辦法用你存下的錢滾出更多的錢，你才能成為有錢人。


    只靠存款真的無法成為有錢人嗎？我先針對這一點回答你，的確有人能夠單靠儲蓄成為有錢人。比方說，一年的可處分所得高達數億日圓或數十億日圓的人。這些人單靠儲蓄也會成為有錢人。


    但除了這種人之外，九九、九九％的人基本上不可能單靠存款就成為有錢人。能夠靠儲蓄成為有錢人的都只是稀有的例外。


    當然，就算不是可處分所得超多的的人，假設一年能夠存下一千萬日圓，三十年後你就到三億日圓。


    問題是，三十年是很長的時間，過程中很可能出現變動，讓你無法持續存錢。實際上一年存一千萬日圓，連續存三十年，應該算得上是極少數的奇蹟例子了。至少我自己就不曾存錢那麼長一段時間，因此我沒自信能夠辦到。結果還是只能一邊存錢，一邊用存下來的錢再去滾錢，才能夠掌握成功。


    另外，規畫存款時，還有一件事絕不可忘記，那就是：人生總有意料之外的支出。'
  merge: -1
  img_proc: true
- pgno: 193
  md: '比如說，在新冠肺炎疫情爆發之前，餐飲店老闆一定都認為自家餐廳每個月的營業額應該都差不多。等我看到網路上的新聞與世界各國的情況之後，發現有不等老闆即使餐廳暫停營業，仍然必須支付固定的支出，在營業額驟減的情況下，為了支付那些支出，不得已要申請融資，甚至還得動用過去累積的存款。


    另外，以個人情況為例，人有旦夕禍福，有的人昨天還很健康，今天卻突然發生意外或生病，導致身體動彈不得，或是原本交情不錯的客戶突然不跟你做生意了。


    所謂的人生就像這樣，前方充滿了不可預料的意外。所以各位要記住，意外支出有可能發生在自己身上。


    既然是意外支出，表示突然降臨的是你我現在都沒有預測到的事端。這類事端有可能讓你必須拿出存款應急，所以最好事先準備一筆緊急預備金，來應付意外的花費。


    習慣事先準備一筆應急用緊急預備金的人，往往也會多存一點錢，今後再度遇到像新 코로나肺炎這樣的情況時，應該能夠存活下來。這個道理就與前面提到的日本企業的留存收益相同。'
  merge: -1
  img_proc: true
- pgno: 194
  md: '# 長時間縮衣節食存錢II坐「錢牢」


    根據前面提到的內容，我們以一般的可處分所得平均值來思考的話，假設每年存兩百萬日圓（約新台幣五十四萬元），持續存三十年。


    首先，要從平均年收掉兩百萬日圓當存款，就很有難度。再加上長達三十年的時間，都要以相同速率存錢，幾乎沒什麼人做得到。


    在這三十年的時間，你會遇到孩子升學考試與入學、家人罹患重大疾病或受傷……必須用掉存款的情況。前面已經提過，人生有許多沒有列入預算的支出，多到你無法想像。


    因此，千萬不要相信美好事物可以長長久久的事。我平常一直強調眼光要放長遠，這兩件事看似互相矛盾。但是，把看事物的目光放長遠，跟盲目相信不確定的事物會長久，其實是兩碼子事。


    說起來，不僅是存錢，到底有多少人能持續做同一件事三十年呢？我自己沒有這類的經驗，因為我目前只活了三七七年。再沒有什麼比這場馬拉松更充滿不確定性且困難的了，所以你也必須懷疑自己：「我真的有辦法跑完這麼長的距離嗎？」'
  merge: -1
  img_proc: true
- pgno: 195
  md: '這麼一想，我覺得訴求幾十年後遠景的商品還能夠存在簡直是奇蹟。各位應該已經明白三十五年的房貸是多麼不切實際的設計了。從現在起算的三十年後，自己和世界的一切都會改變，就連自己的思考方式、個性，甚至是社會和國家的狀況也會改變。


    退個一百步來講，萬一你真的能夠每年穩定存下兩百萬日圓，持續存錢三十年的話，存下來的總金額也不過是六千萬日圓（約新台幣一千七百萬元）。


    一般認為退休基金必須準備兩千萬日圓（約新台幣五百四十萬元），如果你能完整存下六千萬日圓，用來過退休生活想必足夠，稱得上是很會儲蓄的人。如果再加上年金，夫妻倆一起去旅行或送兒孫禮物之類的，退休生活應該能過得挺舒服的。


    但是，這不算是真正的有錢人。只是持續過了三十年苦日子：年輕時幾乎沒有什麼戲劇化的美好經驗。


    所謂有意義的人生，最理想的狀態應該是體驗人生各個時期最美好的經驗，並逐漸朝自己的人生目標邁進。


    從這個角度來看，被關在錢牢裡一味地節儉、禁慾、存錢，到了六十幾歲退休之後才出獄，這樣實在說不上是幸福的人生。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '# 把力氣花在「賺錢」而不是省錢


    那麼，該怎麼做才好呢？成為有錢人真正重要的事，以企業來說，就是增加收入而不是削減成本。也就是說，你必須把焦點放在「賺錢」而不是「省錢」。


    我認為，耗上整個人生拚命節省，結果得到的只是還過得去的退休生活，這樣的人生一點夢想和希望都沒有。我非常確定這樣做的人，之後只會徒留遺憾，感嘆「早知道我應該趁年輕去做這些事」。如果你省吃儉用過了三十年，得到的回饋只有前面提到的六千萬日圓，未免也太空虛了。


    說到這裡，我要在此提出相反的主張。


    我認為享受過玩樂的人，反而比較容易在往後的人生中成功增加收入。理由在於，他們透過玩樂高速體驗過大量的失敗與成功，已經知道自己想要什麼、不想要什麼，旱地就面對自己內心深處的需求。


    事實上，我也曾經沉溺在酒池肉林及溫柔鄉，體驗過揮金如土的生活，經歷了公司倒閉、破產、欠稅等各種酸甜苦辣。


    當時我總是盡全力享受一切玩樂，現在回顧那段過去，我可以告訴你自己的過去有'
  merge: -1
  img_proc: true
- pgno: 197
  md: '多荒唐，與你分享人生的智慧。但是，我之所以能夠像現在這樣健全地發展，毫無疑問就是因為經歷過那些糜爛的玩樂，以及大大小小的眾多失敗。從這層意義來說，我由衷地想要告訴大家一件事：


    如果你真的很想做某件事，就儘管去做吧。


    即使你要做的事與我在本書主張的論調相反，即使你很有可能因此受傷，但就長遠來看，這個經驗將是你最大的人生資產。'
