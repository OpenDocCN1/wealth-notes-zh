- pgno: 314
  md: '即使你自認絕對不可能犯下確認偏誤這種錯誤，還是有可能輕易犯下這種錯。我平日也經常注意自己是否陷入了確認偏誤。

    比方說，投資股票時，只注意股價上漲的消息，並依此判斷應該繼續持股；在杜拜的不動產上投資很多錢，看到杜拜前景一片看好的新聞，心情就會大好。

    問題是，我持有的股票股價不一定會上漲，杜拜未來的發展也有可能是一片黑暗。此時最重要的是做好準備，讓自己無論遇到什麼情況都能應付自如；即使最壞的情況發生，你的損傷也不至於致命，這才是重點。

    如果我叫你想像負面的狀況，你一定會覺得很簡單；因為人們往往過度自信，自認已經事先評估過所有情況。然而預測負面情況，並不如你想得那麼簡單；因為你採取行動時，心裡其實確信自己一定是對的，不會失敗。懷疑自己的決定，預設最壞的情況，並非一般人天生就具備的避險本能。

    因此，我們必須經常主動去懷疑自己所相信的事情，告訴自己「凡事沒有絕對」，經常預設可能發生的最糟情況，同時讓自己在面對各種情況時都能存活下來，重新建立對自己有利的狀態。所以我們需要做的是降低期待值，別放縱欲望，別想著要馬上賺大錢。'
  merge: -1
  img_proc: true
- pgno: 315
  md: '當然我也很想相信自己過去做過的決定和行動正確無誤，也會覺得懷疑自己的決定像是在否定自我。但是，我們本就該對自己的行為存疑。懷疑自己過去這麼多年來所做的一切有可能一開始就不正確，否定自己過往的所作所為。這麼一來，你至少就不會把錢浪費在超自然、神祕學等無用的東西上，也不會被人一直利用。


    # 定期複習「最糟糕的情況」


    假設你現在在透過複利效果賺了錢，水庫裡儲了不少水，還是必須記住「好景不常」這句話。如果持續好幾個月不下雨，水庫裡的水總有一天會枯竭。


    目前因為新冠肺炎疫情的影響，愈來愈多企業關門大吉。假如日本防止病毒擴散的政策導致經濟停滯，將會有更多公司倒閉。說得直白一點，那些倒閉也不奇怪的公司之所以會在此時倒閉，疫情只是間接原因，只不過是財務體質虛弱的公司終於在這個時間點撐不下去了。


    仔細想想，事先預設會發生這類情況，是成為有錢人的必要條件。這次的疫情迫使產業界汰弱留強。存活下來的公司與個人，早就預測到這類最糟情況可能發生。至於那'
  merge: -1
  img_proc: true
- pgno: 316
  md: '些原以為前景一片看好而不斷擴大公司規模，或生活奢華浪費的人，在現今這般嚴峻的環境下，當然有很高的機率無法生存。


    我對金錢原本就採取負面思考的態度。我認為如果不採取行動，人生只會走向愈來愈壞的局面，畢竟就連呼吸也要花錢。因此我經常預設最糟的情況並做好準備。或許這是因為我以前太過樂觀，後來得到了慘痛的教訓，所以我現在仍有陰影。


    因此，我才會注意到這次的疫情規模非常龐大，而且有有可能拖很久，而我也為此做好了準備。我解約了部分投資基金轉為現金，也一直在思考如果這種情況長期持續下去，我應該做哪些生意與投資。


    前面我也重複提醒過很多次：「別輕易辭掉公司的工作」、「創業別選擇需要組織的高風險事業」、「一時賺錢完全不可信」……


    這些提醒都是因為我希望各位預先設想最糟糕的情況並做好準備。資產運用的術語中有個專有名詞叫「避險」，意指避開價格變動的風險。我希望各位隨時要懂得避險，避免陷入賠錢的情況；即使沒有收入也必須活下來。


    假如你搞到債務不履行或精神崩潰，等於捨棄未來再度獲利的機會。只要你平時預先模擬資產或收入銳減的情況，自然會避免無謂支出，準備應付緊急情況的糧倉。'
  merge: -1
  img_proc: true
- pgno: 317
  md: '# 手邊的钱等同你的命


    這麼一想，你就會明白現在賺的錢、存下來的錢有多重要。現在你手邊的錢等於你的命。賺錢沒那麼容易，守財也沒那麼簡單。你絕對不能小看眼前的任何一塊錢。


    口渴時打開冰箱就有十瓶一五公升寶特瓶裝礦泉水的話，人人都會大口暢飲。但如果你只有小半瓶水，喝水時就會做好規畫，避免一次喝光。


    金錢也一樣。請以沒錢為前提，事先做好準備。根據我的經驗，人類基本上就是手頭有錢就會全部花掉的生物。我之所以買很多不動產，也是因為只要手邊有現金，我就會全部花掉，包括用來買無用的東西。


    當初買不動產時，我告訴身邊所有人：「我把錢埋在土裡了。」埋在土裡，就沒有那麼容易拿出來。不動產的流動性其實很低，無法立刻轉換成現金，也不會有人這麼做。但沒想到當初埋在土裡的不動產，竟能給自己帶來房租收入，而且我住在自己的豪宅裡，因為我就是房子的所有權人，也不用浪費錢付房租。


    就像這樣，賺來的錢在得手的這一瞬間，我就會當作那筆錢「沒了」。我認為這就是生存的祕訣。'
  merge: -1
  img_proc: true
- pgno: 318
  md: '再加上我才知道自己不會永遠賺錢，也開始強烈意識到好景不常，所以我絕對不把錢用在與短暫欲望有關的無用物品上。


    即使有想要的東西，我也會等到明天，不會今天馬上就買。先給自己一段考慮的時間。結果絕大多數放到明天的東西，我就不會想要了。我再也不會被賺錢的好消息欺騙，或聽從誰的建議去貸款。


    之所以會聽信那種話，代表你沒有經濟壓力。一旦沒有經濟壓力，人就會順從欲望思考。問題是，人生比我們想像得更長。而且人生不只是只有壞事，有時也會有好事發生。但是順從欲望行動，不但會導致經濟上、精神上的崩潰，也會害你只能看到漫長人生中陰暗的一面。


    所以，投資股票或虛擬貨幣的時候，必須不停地深思熟慮，直到你覺得即使那筆錢就算打水飄也不後悔時再買。然後，只有好計畫還不夠，即使再怎麼深思熟慮，仍然可能損失大半金錢，希望各位記住會有這樣的風險。


    即使最後賺了錢，為了存活下來，你仍要繼續少量投資。你想要賺大錢，就會增加投資金額；投資金額愈大，證明你的期待愈大；你愈期待，就愈容易以賺錢為前提採取行動。一旦你的行動準則是基於「尚未實現的獲利」，一切齒輪就會亂掉，導致事情的'
  merge: -1
  img_proc: true
- pgno: 319
  md: '發展荒腔走板。你能夠相信的只有實際人袋、誰也拿不走的已實現利益。胡思亂想等你真的賺到錢之後，再做也不遲。


    # 觀察真正的有錢人如何花錢


    我必須說，有錢人當中其實有很多小氣鬼，這是稱讚的意思。這些人不是單純的小氣，而是認真面對、仔細考慮每一筆錢的用途。假如你看到有錢人去購物或請人吃飯，那筆錢一定花得有意義。假如你遇到正在發錢的有錢人，撒錢舉動的背後也一定另有所圖。相反地，花錢時沒經過思考、隨隨便便就大撒錢的有錢人，早晚會破產。


    因此，如果你以為向有錢人哭窮，他就會把閒錢分給你，那可就大錯特錯了。網絡上經常見到人向有錢人哭窮，那只是在浪費時間，千萬別這麼做。我會這麼說是希望，你不要浪費時間與精力，而非出於倫理道德。有錢人對金錢的態度往往比你想像得更嚴謹，他連一塊錢也不會多給你。


    同理，請求別人投資或融資的場合也一樣。只要出資者不覺得交易划算，就不會提供資金給走投無路的人或公司。'
  merge: -1
  img_proc: true
- pgno: 320
  md: '錢會聚集在已經有錢的人手上，反之，它也會遠離沒錢的人。也就是說，錢不會到有需要的人手上，而是會往已經不需要更多錢的人那裡集中。錢就是喜歡故意反其道而行。


    錢有自我增值的特徵；努力儲蓄創造軍費的人就能夠吸引知識和好點子，讓下一批錢再度聚集過來。相反地，錢會離開不努力存錢創造軍費的人。


    就結果來說，經濟必須靠自己努力、自行負責。如果必須下跪懇求別人投資、融資，就代表你沒戲唱了。讓我來說的話，路已經走到盡頭。


    為了避免這種情況發生，你平時就要記得這個世界不會幫助任何人，認真面對金錢，用心建立資產。'
  merge: -1
  img_proc: true
