- pgno: 74
  md: '是明智之舉。在今後的時代，每個人只能自行面對並解決對於錢的不安。我本來沒打算在這裡提這件事，但我從十幾歲時就認為自力救濟是理所當然的；我想這是因為自己是由祖父母帶大，而他們正好是人生起伏變動激烈的自營業者。


    我相信有危機意識才能夠站上成功的起點。


    對於錢的不安應該趁年輕時盡早體驗一下。日本的經濟在幾十年前就進入低成長期。且早在至少三十多年前前，民衆就已經知道日本社會將朝向少子化發展。


    實際薪資也在全球化經濟正式發展的二〇〇〇年之後持續倒退。實際薪資倒退的意思是，薪資成長率減掉物價上漲率，得到的真正薪資上漲率不是正值，而是負值。簡單來說，日本整體的家庭生計有日益拮据的傾向。


    再加上稅金和醫療費用的負擔增加，民眾手邊剩下的錢應該會愈來愈少。


    這樣的變化雖然緩慢，卻是切切實實地正在發生。


    然而，儘管多數人都隱約察覺到這些變化，卻沒有認真看待，也沒有採取行動解決問題。他們感到一股無以名狀的不安，卻對眼前的變化視而不見，只知道粉飾太平。


    這狀況就跟癌症病患不願接受治療，只是等死一樣。


    癌症分為第一期、第二期、第三期、第四期，愈到晚期，情況愈惡化，但在初期階'
