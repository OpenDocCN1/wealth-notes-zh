  md: '你應該馬上打消買車的念頭。


    買車時，除了車子本身之外，還有其他林林總總的支出。


    首先，買車之前要提出車庫證明18、繳納法律規定的相關費用、驗車登記費等，還有汽車牌照稅、重量稅等稅金、汽車強制險等保險。此外，還有停車場租金、油錢、高速公路過路費等。在車輛的保養維護上，兩年一次的驗車費、換機油、換輪胎、維修費……也都是必要開銷，一筆又一筆的支出令人頭疼。


    把這些花費全部算入買車開銷的話，相較之下，只在必要時才搭的計程車費金額加總起來反而比較便宜。更別說當車子發生各種情況時，你還得花不少寶貴時間處理。因此，比起買車，非到不得已時才「配合需求」搭乘計程車比較划算。


    如果無論如何都需要車，利用既有的租車模式也是一個辦法。


    畢竟，不管是住宅也好，汽車也好，在你累積出過人的淨資產之前就「擁有」這些，都是錯誤的決定。若你想要建立比現在更理想的現金流累積資金，第一步就是先捨棄「擁有」的慾望。'
