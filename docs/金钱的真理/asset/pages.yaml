  md: '瘦後的樣子。如此戲劇性的轉變，就會吸引人上鉤。廣告標題上寫著：「只要使用本產品，你也能變瘦變美！」假設此時你正在努力減肥，試過各式各樣的方法都無法成功。你就會開始認為這個產品是你的救星。然而，就像你過去曾經用過的減肥產品，這個產品也不會讓你變瘦。遵照傳統減肥方法均衡飲食、經常運動、睡眠不足，成本遠比買減肥產品便宜許多，而且成功率比較高。


    當你覺得對方的廣告打動了你內心的自卑、欲望、不滿足、不安，就必須提高警惕。因為錢永遠不夠用，所以想要更多錢；因為想要每天和女人上床，所以希望得到女人的青睞；因為想要跟外國人說話，所以想學好英文。每個人都有許多欲望、不安、待解決的問題；也有不少人認為只要能夠解決這些問題，花再多錢他們都願意。但我認為：「解決問題其實用不著花錢。」這就是我的結論。


    被金錢喜歡的人往往不花錢，所以錢會愈來愈多。他們會花心思解決問題，而不是靠花錢。立刻掏錢解決問題的人，等於放棄了動腦思考這個重要習慣。要動用你的寶貝孩子去解決的、唯有再三精挑細選的重要時刻。寶貝孩子（錢）是你不得己才能用的大絕招。'
