- pgno: 199
  md: '由前面的說明不難理解，我要大家「存錢」，並非因為有存款就是人生勝利組，而是要大家創造「軍費」。想要改變既沒有夢想也沒有希望的現實生活，你需要「一筆錢」，當作改變人生的能源。


    「軍費」顧名思義，就是軍事活動所需的資金，這裡引申為「採取行動時的必備資金」。這是用來增加未來收入的钱。當機會及好運來臨時，你就能把這筆錢當作資本一舉投入。這筆資金的用法，會配合機會的種類與時期，可以用來採購商品、當作網站的外包費，或是購買股票、虛擬貨幣、外幣。


    如同我已經提過的，我本來就有存錢的習慣，十七歲那年已經存了七百萬日圓。我用這筆存款當作資本，在大學時期成立服飾公司。多虧有這筆軍費，我的人生才能夠飛黃騰達。


    # 先以三年存到三百萬日圓為目標


    手上沒有軍費的人，無論過多久都沒有辦法改變人生。而大多數人平常都沒在準備未來要使用的軍費。因此，即使過了五年、十年、二十年，仍然過著相同的人生。沒有'
  merge: -1
  img_proc: true
- pgno: 200
  md: '為自己準備軍費，非但無法成為有錢人，還會被剝奪改變人生的資格。


    沒有軍費，意味著「你的人生已死」。


    我先假設你一年的可處分所得（淨利）是一百萬日圓，三年應該可以存下三百萬日圓。就先從準備這三百萬日圓的軍費開始吧。累積軍費的時間先以三年為限。原因前面已經提過，時間太長的話，會很難持續下去。


    至於可處分所得比這個金額更多的人，請拉高軍費的金額。


    不管怎麼做，這筆軍費就是你今後成功故事的第一頁。


    # 極簡生活的建議


    想要在最短時間內累積軍費，你必須改變基本觀念。


    首先，把自己房屋所有用不到的東西，透過Mercari等網路二手交易平台全部賣掉。說得極端一點，賣東西回收的金額即使只有一塊錢也無所謂；叫你賣掉那些東西的目的，不是要你用那筆錢當生活費，而是為了讓你看清楚自己過去買了多少不知所云的東

    西。'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 事實上，愈窮的人愈常購買多餘的東西。


    假如你堆著許多用不到的物品，就很難確實掌握家裡的衣服、日常用品、食材等必需品的總量，也就容易重複購買相同的物品。反之，家裡若沒有用不到的東西，就能夠一眼看出庫存有多少，避免過度購物的情況發生。


    有錢人不會買到不到的東西。反之，想要成為有錢人，你需要過極簡的生活。我之所以大量購買不動產，就是為了避免把所有現金在同一時期換成變動性更高的股票與虛擬貨幣，這是為了避免在「一瞬間失去大部分資產。實際遇到新冠肺炎疫情的衝擊之後，更證明我分散投資在不動產、債券、保險、基金、外幣的做法沒有錯。


    投資不動產這樣的實體資產，對我来说就等於是「投入軍費，那是另一個層次的话题了。極簡生活是「創造軍費」階段的话题，兩者的意義不同，請各位別混淆。以我自己現在的情況來說，我在生活上一律不買任何無用的物品。


    不只是物品，服務也是，像是每月自動扣款的智慧型手機應用程式、NETFLIX、Amazon Prime 的月費、niconico 影音頻道的付費會員等，這些服務在創造軍費的階段基本上都必須中止。計畫「接下來我想努力改變人生」的人，沒時間去瀏覽那些娛樂內容。這樣的娛樂，等你成功之後要多少有多少。'
  merge: -1
  img_proc: true
- pgno: 202
  md: '關於這部分的道理，《伊索寓言》中的〈螞蟻與蟋蟀〉就足以說明一切。


    這個故事是說，螞蟻們在夏天辛勤工作，努力儲存冬季的糧食。相反地，蟋蟀卻拉著小提琴唱歌玩耍。到了冬天，蟋蟀找不到食物，希望螞蟻們分給牠。螞蟻說：『既然你夏天都在唱歌，不如冬天跳個舞如何？』拒絕把食物分給牠，蟋蟀最後餓死。


    要我来说的話，這個故事很簡單，就是你願意辛苦後甘而已。一開始先辛苦，之後只會愈來愈好。相反地，一開始過得輕鬆，之後就會很苦。


    這個故事就連小朋友都懂，所以「接下來打算努力」的人，沒有那個時間耗在網路娛樂服務。享樂的事情全都等到以後再做吧。'
