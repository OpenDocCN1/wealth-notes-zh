- pgno: 234
  md: '聽說美國在一九七〇年代真的有人拿普通石頭當寵物販售。令人驚訝的是，這個人半年內賣掉五百萬顆石頭，賺到大約六億一千萬日圓（約新台幣一億七千萬元）。


    採購進來的東西加上利潤後賣掉，這個轉賣過程就是做生意的基礎。


    事實上我正在從事的股票和不動產投資，也是屬於轉售的一種。


    舉例來說，我以一股一千日圓的股價買進一百股，等到需求升高時，我再以一股兩千日圓的高價轉賣那一百股。差別在於股票投資會透過K線圖視覺化而已。事實上股票投資也只是向某人買來無形的權利，再賣給其他第三者的轉賣行為罷了。


    不動產也一樣。我擁有的曼谷頂級豪宅麗池卡爾頓酒店式公寓（The Ritz-Carlton Residences Bangkok），按照購買當時的匯率來看，買價大約是兩億六千萬日圓（約新台幣七千萬元），現在的交易價格已經來到四億五千萬日圓（約新台幣一億三千萬元）左右。將來飯店進駐大樓下半部樓層、改裝成餐廳等，更進一步開發建物本身和周邊地區的話，交易價格還有可能是漲。當然如果新冠肺炎疫情持續下去的話，房價也有可能會大跌。


    在此提個假設：假如我以兩億六千萬日圓買房，再以四億五千萬日圓賣出的話，我就能賺一億九千萬日圓，這筆錢就是從杯子溢出來的水。'
  merge: -1
