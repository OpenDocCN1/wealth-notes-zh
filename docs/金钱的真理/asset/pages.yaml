  md: '就這一點來看，外出服飾的銷售量或許會減少，餐飲店的來客數或許無法恢復，但是這些產業減少的錢，應該會流向其他的新需求。重點在於如何看準時機掌握新需求。在为此为大家重点整理前面提过的内容，并请各位分享我今后的趋势预测：


    +   ⑪ 贯彻水库式经营理念的日本，习惯将保留盈余存起来，因此具有相对优势，最后得以在疫情肆虐下存活。


    +   ⑫ 日本的卫生水准与习惯本来就很好，从全球的角度来看，新冠肺炎疫情的影响也相对较小。当然，日本防止疫情扩大的措施与检查，以现状来说稍嫌不足，因为在我居住的泰国和阿拉伯联合大公国这些国家，甚至动用法律严禁止商家营业、民众外出，但我始终相信日本能够在疫情大爆发之前，找到全球通用的解决方法。只不过对于这部分我没有确切的依据。


