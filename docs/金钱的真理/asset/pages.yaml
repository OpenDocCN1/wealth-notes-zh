- pgno: 237
  md: '話說回來，我最近這幾年才確定一件事，那就是：這個世界充滿了詐欺。聽到我這麼說，或許有人會很驚訝，但我離開日本到海外後，更加確認了這世上大多数的存在，毫無疑問都是詐欺。就連你所相信的國家和大型企業也是。


    先進國家提出貨幣政策，把來路不明的資金大量提供給市場，這樣的行為很難稱為正當；就連上市企業辦的股東大會（企業向投資者和股東報告財務狀況等的活動）也令人存疑。


    即使是企業，也會準備好對消費者不利的契約，而且內容滴水不漏。


    民眾對於給人負面觀感的賭博或典型詐欺，時時都會保持警戒，反而是包裝好看、正大光明、乍看之下沒有危險的機構，才最難應付。


    你很容易相信的大型投資信託、避險基金、國際級投資銀行所推出的保險商品、企業集團發行的公司債，這些金融商品多半會讓投資人簽下不利的契約。


    嚴格來說，是否會對投資人不利要視情況而定，不過這些合約至少都不會讓他們吃虧。


    我試過不少金融商品，現在我可以斷定：資產運用唯有靠自己操作才會賺錢。'
