  md: '# 有錢人與你的差距，不只是年收，心態才是關鍵！


    —推薦序—


    Mr. Market 市場先生／財經作家


    過去我曾經看過超過百本關於投資理財與財務的書籍，但看完本書後我仍 是覺得印象深刻，而且深受幫助。


    本書和絕大多數的書籍不同，作者在談到關於金錢時，他並不是談一些技巧或理論，談的更多是人生的經驗、自己曾犯的錯，以及對周遭的觀察，從中所得到的體會。藉此我們可以看到一些更貼近生活的經驗，也可以從中看到作者對金錢與財務本質的理解。


    # 有錢人想的真的跟你不一樣！


    大多數的書籍，通常都是教你一些技巧或方法，例如怎麼存錢、各種金融商品的知'
  merge: -1
  img_proc: true
- pgno: 4
  md: '識、投資的方法。


    但很少有書會告訴你一些沒有標準答案，或是看起來理所當然，卻可能嚴重影響財務的事情，例如：


    +   • 盡量省錢好嗎？不一定，省錢不是壞事，但低於一定限度就是壞事。

    • 多增加人脈，對自己的財務是好事嗎？答案是否定的，百分之九十九的人脈都是讓你多花錢而沒任何收入。

    • 該貸款買房嗎？萬萬不可，無法一次付現買的東西，就是不適合自己的東西。


    諸如此類，看似沒有標準答案的問題，作者對這些問題都給出了很明確的答案，以及背後的理由。


    可能你會有疑惑，怎麼跟我們平常認知不同？


    大多數人的做法與認知似乎也與作者說的相反，甚至你可能可能會認為作者比較偏激、或覺得他已經很有錢才說這些。


    的確這些看法不一定適用所有人，但有部分是我自己親身體驗過的經驗，因此對作'
  merge: -1
  img_proc: true
- pgno: 5
  md: '者說大多想法都是非常認同的。


    # 經驗是最好的老師，但你不用親身踩坑！


    有句話說：「經驗是最好的老師，只是學費太貴了。」


    很多事情看似難有標準答案，而且也不容易從一般書籍或是能從身旁的人學到，唯有自己體驗過，才能得到一些結論。


    從錯誤中學習往往代價過於巨大，但有些事情，我們卻也沒有其他更好的學習管道。如果能從别人身上學習到這些經驗，其實就代表我們不需要再親身踩一次坑。


    本書帶給你的不是什麼困難的專業知識，也不談任何艱深的術語或理論，而是一個在財務上經歷過巨大起伏，最終取得財務成功的人，分享他自身對於金錢與財富的真實經驗與體會。


    很少有關於財務的書籍，能夠整本都是作者的人生經驗談，看完本書，只要能夠幫助我們人生在金錢上少犯幾個錯誤，遇到類似情境的問題時提早警覺，我就絕對值得回票價了。'
