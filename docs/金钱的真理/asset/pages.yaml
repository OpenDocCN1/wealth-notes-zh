  md: '〔一決勝負的資金〕。存下來的這筆錢將來用在哪裡，正是你能否成為有錢人的最大關鍵。


    這是一筆很重要的存款，千萬別動用這筆錢去滿足你個人臨時起意的欲望。想要成為有錢人，就是過著能满足你最低需求的簡樸生活，並靠那筆珍貴的存款一決勝負，別無他法。


    因此，我們要做的就是改善目前的現金流。我在前面例子中列舉的金額只是大概的數字，有些實際支出或許更少。相反地，如果你的支出比我隨便列舉出的金額還高，你就必須重新檢視自己的開銷。關鍵是在確保自己的精神狀態健全的同時，逐步縮減最低限度的支出。'
