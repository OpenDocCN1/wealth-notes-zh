  md: '假設東京市中心三區（千代田區、中 央區、港區）最引人矚目的摩天大 樓，一戶面積約三十坪，全部以現金 購買的話，每坪不下數百萬日圓，所 以需要好幾億日圓。一次掏出好幾億
    日圓，大多數人都辦不到。但如果用 租的，想要住進摩天大樓並非遙不及 的夢想。此時，你會產生某種錯覺。


    舉例來說，假設你租屋住在每月租 金高達一百万日圓（約新台幣二十七萬 元）、面積三十坪的房子裡。前期開銷 準備六個月份的房租，也就是六百 萬日圓（約新台幣一百六十二萬元）
    就足夠。這麼一來，你就會產生一種 錯覺，認為「幾億日圓的房子只要 六百万日圓就能得手」。這是我二十 幾歲時也曾有過的誤解。


    事實上我只不過是狐假虎威，暫 時借用「東京中城」的盛名罷了，卻 產生了與自己比他人優秀的錯覺。


    我開始覺得自己可以住在這麼高 檔的地方，是因為我比一般人厲害， 這也是我從高峰跌落谷底的第一步。


    同樣地，貸款買高檔車也算是一種 租賃。你不斷付租金，最後留下的不 是資產，只是回憶。另一種情況是， 儘管你還在付車貸，也有可能在貸 款付完前就想換新車，於是你賣掉
    原本的车子，付清貸款餘額。從結果 來說，這就跟每個月付錢租豪宅一樣。'
