  md: '俗話說「人有兩隻腳，錢有四隻腳」。錢這玩意在經濟活動中會不斷地在「消費者」、「生產者」、「物流業者」、「勞工」等多種角色之間來來去去。除此之外，也會在「政府」、「企業」、「個人」之間不停地來回。如果有人因為原油價格下跌而獲利，也一定有人因此而損失。錢會從某個主體移往下一個主體移動，在世界各地馬不停蹄地流動著。我認為隨時提醒自己「錢在流動」非常重要。


    在此先講一個與「金錢流動」有關的例子。


    假設你拿五十萬日圓（約新台幣十四萬元）的閒錢去學電腦程式設計，準備了網域名稱和伺服器，設計出在雲端使用的軟體。這個軟體一共賣得一百萬日圓。你一開始投資的五十萬日圓變成一百萬日圓回到你手上，中間五十萬日圓的差額就叫「附加價值」。也就是出外旅行的孩子回到你身邊時，規模擴大了一倍。


    你的錢在外面繞了一圈後增加，但一定還有其他人早因為你投資的五十萬而賺錢；在這個例子中就是你學程式設計的學校、提供你域名和伺服器的業者。他們在比你更早的階段就賺到錢了。


    重點在於去思考「在你讓錢增加之前，早已經靠你拿出來的錢賺一筆的人是誰？」更重要


    重要的是，你必須盡量靠近財富的源頭，爭取更具優勢的位置。'
