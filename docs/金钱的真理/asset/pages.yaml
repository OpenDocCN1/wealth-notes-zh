  md: '# 摆脱－「员工思维」－


    # 致富心法


    # 16


    # 想成为有钱人，拥有个人公司是绝对条件'
  merge: -1
  img_proc: true
- pgno: 150
  md: '話說回來，想要守住財富，還有一點必須先考慮清楚的，就是節稅。所謂節稅，就是在法律許可的範圍內，降低納稅額度，盡量把現金留在手邊。


    假如你的收入只有公司的薪水，幾乎沒什麼方法可以節稅。但是，假如你有固定的副業收入，就必須學會節稅。最有效的節稅方法就是「成立個人公司」。


    在沒有成立公司的情況下從事副業的話，通常就會以一般的個人所得率計算納稅金。用營業額扣掉部分支出之後，剩下的就會被視為個人收入；這項收入愈高的話，稅率也就愈高，因為綜合所得稅採用累進稅率計算。


    相反地，如果繳的是營利事業所得稅，即使獲利增加，原則上仍然採用固定稅率計算。也就是說賺得愈多，成立公司愈有利。


    還有一個節稅方法就是把你賺來的副業收入，當成家人的薪水分發出去。個人事業主基本上不能付薪水給家人，但成立公司就沒有這種限制。讓妻子、父母、兄弟姐妹或親戚擔任公司董事，盡情利用每個人的個人所得扣除額額度，如此一來所有人的課稅額度也會跟著降低。


    而且，成立公司還能免繳消費稅。剛開始的兩年，原則上個人事業主和資本額一千萬日圓以下的公司都能免繳消費稅。利用這項規定，個人事業在起步兩年後轉成公司法'
  merge: -1
  img_proc: true
- pgno: 151
  md: '人的話，最長就可以四年免繳消費税。我從六年前開始就不住在日本，對於日本相關稅制的最新情況不是很熟。因此，關於日本目前的稅制，希望各位自行查詢。我在這裡要強調的是，各位千萬別小看這些小小的節稅額度。


    # 活用法人經費收支制度節稅


    另外，只要搞懂法人經費收支制度，就能夠擴大經費包含的範圍。個人生活開銷不能列人經費，但如果是業務上的花費，就可以全部當作經費。也就是說，如果能夠盡量讓必要支出認列為業務費，就可以剩下來多的結餘。因此，想要成為有錢人，你必須掌握可列入經費的條件。只不過，如果出現定義模糊的經費，是否能認定为經費，就要看國稅局的判斷，這一點必須留心。依我當時的經驗，隨便把各種開銷全部列舉為經費


    24 臺灣的個人所得稅率最高是四〇％。公司的稅率最高是二〇％。

    25 臺灣的稅制規定不同，不同的所得額有不同的課徵稅率。詳情請見：財政部稅務入口網「營利事業所得稅的稅率規定如何？」'
  merge: -1
  img_proc: true
- pgno: 152
  md: '的話，事後下場可是會很慘。


    我們以目前當紅的職業 YouTuber 為例思考看看，這些 YouTuber 為了壓縮必須納稅的收入所得，多半會把為了拍攝影片購買的物品列入經費。但這會導致私用與拍攝用的分界線變得很模糊，國稅局很有可能認定你是遺漏申報。


    比方說，你拿高價名牌精品當作拍攝道具或主題，並且以這個理由把這筆開銷列入經費。事實上也真的 有 YouTuber 公開展示自己買的名牌精品。此時，假設他購買三百萬日圓的手錶、包包、衣服等，並把這筆開銷報為拍攝影片的經費，之後他拿到
    YouTube 根據觀看次數支付的廣告費，這筆所得就有三百萬日圓的免稅額度。但是，買來拍攝影片使用的東西，如果也供私人使用，國稅局就不會承認這項精品屬於經費，甚至會對你提出警告。假如你把那些名牌精品拿去當鋪賣掉，即使不是蓄意為之，國稅局也很可能認為你是把公司資產處分換錢之後放入自己的口袋，因而認定你逃漏稅。


    像藝人治裝費這種經費支出就是類似的情況。上電視穿的衣服如果私底下也穿，經常就會發生經費認定的問題。由此可知，品項能否列入經費必須視情況而定，多半很難事前就有明確的分界線。


    各位或許覺得這樣很麻煩，但是否具備讓納稅的金額降至最低的觀念，將會影響到'
  merge: -1
  img_proc: true
- pgno: 153
  md: '你能否成為有錢人，因此對於稅金，各位最好不要比過去更加關心。只要關心跟自己的事業有關的稅制就好，請務必「透徹了解與自己相關的稅務」。


    # 法律本就不夠完善且主觀，所以不該硬碰硬


    前面提過，是否可以識別經費要根據國稅局的判斷。至於為什麼會發生這種問題，是因為法律規定本身很模糊。不熟悉法律的人，也會對法律規定的不明確感到憤慨或不公平吧。但是從全世界的角度來看，法律不夠完善也是情非得已。人類建立的社會本來就不公平。如果你不懂「不公平是理所當然，不合理的事情有時就是會發生」的道理，你就無法在這個社會存活。


    我在海外生活這六年也遇過許多令人生氣的情況。基本上，說好的交期或施工期無法遵守是常有的事。施工不做防護因而造成毀損，來修理毀損問題的人又弄出其他毀損就離開，幾乎已是家常便飯。各位聽來或許覺得我是在說笑，但國外就是這樣，比日本隨便很多。剛開始我成天為了這種事情發脾氣，後來發現這樣只會讓自己失去理智，沒有任何好處，最後只能自己選擇寬容放下、不去計較。'
  merge: -1
  img_proc: true
- pgno: 154
  md: '同樣地，面對權力、法律、行政體制的不合理對待，與其憤怒挑釁，不如學會如何與那些情況和平安處，這正是在這個世界好好存活下來的祕訣。


    當然，不熟悉法律的人多半誤以為法律萬能，是毫無缺陷、能夠濟弱扶貧的制度。當他們發現法律並不完美時，想必十分失望吧。但是各位必須明白，法律這種東西天生不完美；有些法律可以有很多種解釋。所謂的「判決」也多半是根據現場負責人員個人的考量、感覺、習慣去決定。


    當然，根據租稅法律主義，人民僅依法所定之納稅主體、稅目、稅率、納稅方法，以及納稅期間等項目，負納稅之義務，稅務也受到法律的規範。但是某些人購買名牌精品，國稅局就認可是經費，其他人購買同樣的名牌精品卻不被認可是經費，這種情況也很常見。這種時候生氣憤怒找當局理論沒用，反而只會導致雙方關係惡化，下場慘烈，或是拉長法院判決的時間，浪費時間與金錢。


    想要成為有錢人，你應該盡量避免吵架爭論，因為這樣做只是浪費時間。為了製造出更多的財富，積極正向的活動比爭執重要好幾倍。「有錢人不吵架」是基本原則，所以請盡量避免打官司。


    另外，根據我過去在稅務上的經驗，欠國稅局的滯納金不能分期償還，而且國稅局'
  merge: -1
  img_proc: true
- pgno: 155
  md: '立刻就動手抵押我名下的財產。不過我聽朋友說，雖然國稅局不認可滯納金分期償還，但他們都沒有遇過像我這樣名下財產立刻被扣押的情況。也就是說，國稅局認為如果不立即抵押我的財產，我就會把財產藏起來或轉出去。我當時的對應方式與行為為八成很妥吧，所以現場負責人員才下這樣的判斷。現在回想起來，我可以理解他們當時的做法。如果我是國稅局的負責人員，我也會認為「與澤這傢伙必須受罰」。


    回到原本的話題。我在這一節想表達的有兩件事：一是法律不完美，我們會面臨什麼樣的結果要看當時負責人員的判斷，因此多少也跟運氣有關。另外一點就是，與國稅局等行政、權力、法律機關打交道時，記得要採取良好的溝通方式，而不是以強硬的態度反抗。你必須找到雙方都能接受的折衷點相互妥協，讓情況好好收尾；因為你需要的是確保自己有時間和餘力專注賺錢。別忘了，執著在毫無意義的意气之爭，最後吃虧的只有自己。


    # 成立公司能提高你對賺錢資訊的敏銳度


    成立個人公司除了能夠節稅之外，還有其他莫大的好處。'
  merge: -1
  img_proc: true
- pgno: 156
  md: '其中一個就是，即使是副業或兼差，只要你成立公司、有了董事長或社長頭銜之後，就會產生「想法上的轉變」。成立公司後，如果你什麼都不做，就會連半毛營業額都沒有。現在不是別人付薪水給你，你必須自己製造商品、跑業務、行銷才行。


    因此即使賺得少，只要公司有營業額（收入），你就會產生「我已經獨立賺錢了」的想法。賺錢的方式是部落格行銷也好，舉辦個人講座也可以，什麼都行，說得極端一點，即使營業額只有一百日圓（約新台幣二十七元）也無妨。


    想法的轉變才是重點。


    就算收入只有一百日圓，只要有了營業額，你就會想要讓這個數字成長。


    人類的天性就是，只要有一個盒子，你就會想要往裡面裝東西。有實驗結果顯示，只要把可上鎖的存錢筒和紀錄存款金額的筆記本交給沒有存款的人，光這麼做存款金額就會增加六〇％以上。


    成立公司，你就會想要擁有類似辦公室的空間；印了名片，你就會實際感受到自己正在從事這份工作。架好網站之後，你會經常思考如何增加瀏覽人數。也就是說，只要給你一個盒子，你自然就會產生想要豐富盒子內容的念頭。


    這麼一來，你對於與公司業務相關的資訊敏銳度也會跟著提升。'
  merge: -1
  img_proc: true
- pgno: 157
  md: '成立個人公司的另外一個好處就是「提高資訊敏銳度」。


    舉例來說，資料顯示喜歡紅色法拉利的人，容易對紅色產生反應；因為他們希望擁有紅色法拉利，目光不自覺就會追著相同的顏色跑。但是，如果是對紅色法拉利不感興趣的人，紅色對他們就不具任何特殊意義。即使他們在路上看到紅色車子，也只會覺得那是路上的風景之一，他們的反應就跟看到用
    rossau 軟體調成灰階的照片一樣。


    我再舉個例子。好女色的男人到哪兒都會立刻發現美女；因為他們成天打開天線注意哪裡有美女。但是，對女人沒有太大興趣的男人即使走在路上，多半也沒在看女人。


    成立公司能夠提高你對資訊的敏銳度，也是同樣的道理。


    坊間有许多人每年靠副業賺五、六百萬日圓（約新台幣一百三十五萬、一百六十二萬元）。他們一個人獨立作業，把工作透過群眾外包（crowdsourcing）的方式發包出去。假如你成立公司之後，營業額還是掛零的話，你就會開始好奇「那些人是在做什麼副業，為什麼可以賺那麼多錢？」「什麼叫群眾外包？」自然也會動手收集相關資訊。你如果沒有成立公司，就不會主動想要收集情報。


    成立公司確實需要耗費成本。公司章程的擬定與登記申請要花時間，而登記时的公司章程認證費用、稅籍登記等林林總總大約要花上二十五萬日圓（約新台幣六萬八千'
  merge: -1
  img_proc: true
- pgno: 158
  md: '元），資本額也必須多少準備一些26。但是，如果你想要賺錢，成立個人公司與否，會帶來完全不一樣的結果。想要成為有錢人，只有成立個人公司這個選擇。也就是說，成公司必須支出的經費，都是成為有錢人的必要投資。


    我相信總有一天全體國民每人擁有一間個人公司的時代將會到來，否則日本恐怕會愈來愈窮。以日本目前的情況，光靠上班族的平均薪資，已經不足以讓你擁有舒適的退休生活。你也必須跳脫薪水階級的員工思維，從現在開始培養個人商店老闆的思考模式。個人商店的老闆為了讓自家的店生意興隆，會絞盡腦汁努力想办法賺錢。這種努力打拼的動力能夠大大活化腦力，反之，不努力的店一定會倒閉。


    這世界就是如此變化無常，沒有人可以過度樂觀，一旦疏於發揮創意和努力，前面的路就會一片黑暗。為了改變觀念，我建議各位先從成立個人公司起步。你應該就能實際感受到自己的想法一點一滴逐漸改變。


    +   26以上是日本的情形。臺灣的公司登記流程請參考「經濟部公司與商業及有限合夥一站式線上申請服務網站」、經濟部商業司「公司登記」、臺灣會計記帳網「設立公司的主要步驟」。'
  merge: -1
