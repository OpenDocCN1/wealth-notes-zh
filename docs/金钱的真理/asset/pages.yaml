- pgno: 322
  md: '我現在的生活總算擺脫了「人際束縛」。


    當初我剛離開日本時，多少還是會受到過去人際關係的影響，經歷過幾個階段後，那些影響已經逐漸減少。當我終於完成了人際關係的斷捨離，我才終於擁有真正的自由。走到這一步的路途十分漫長，有時也需要忍耐。


    我為什麼要把「人際束縛」排除得一乾二淨呢？


    舉例來說，在組織裡工作，一定有人會偷懶。大家都習慣把責任推給別人，例如：「社長會幫忙處理」、「某某某行事董事會幫忙」，而社長也會期待「員工會全部幫我處理好」。如此一來，就跟鐵達尼號一樣，所有人最後只會一起沉入海底。


    我喜歡專注在一件事情全力以赴，全心全意面對一項工作。說到工作，根據「鏡的法則」 $ ^{40} $ ，認真的工作態度會投射在周遭的相關人士身上，逐漸加強正向循環。


    但組織中如果有人偷懶，就沒戲唱了。認真投球時，如果對方投回來的球軟綿綿地感覺不到力道、缺乏速度，我們就沒必要和這種人共事。


    所以，我選擇獨自工作這條路。一個人就是全部，不需要依賴誰、服從誰、猜測誰。我從所有壓力中解放，只選擇做自己真正想做的事，而且能夠專注。


    於是，我第一次展現自己的個性。人的個性一旦解放出來，有的人會畫畫或演奏音'
  merge: -1
  img_proc: true
- pgno: 323
  md: '樂，有的人外出旅行或全心全意打電動。我則是沉溺在有老婆小孩的生活中，收集家人


    的照片；因為覺得投資有意思而每天不停地學習。讓這樣的個性自由發揮，又為我創造


    出新的財富。


    # 珍惜為自己認真工作的人


    這世上當然也有少數人是願意真心為你工作。對於這種少數人你要格外珍惜。和他


    們一起工作也是會讓金錢愛上你的生活作息。認真工作的人湊在一起，一定能夠創造出


    好商品或好服務，也會帶來新的財富。


    但是，我也真的覺得這種人少之又少。認真交付靈魂工作的人，依我所見，幾乎不


    存在。大家都是隨便應付工作，就算沒有其他副業兼差，光是本業一份工作也做不好。


    也就是說，能夠稱為「一流」的人不是那麼多。如果是這樣，至少我自己要誠實面對自


    己的工作。因此，我選擇獨自行動。


    「人生」是反映內心世界的一面鏡子，出自日本作者野口嘉則的暢銷書《鏡的法則》。'
