- pgno: 310
  md: '上館子或去百貨公司時也一樣，家人需要的東西我會盡量滿足他們。我們原本預定今年春天在馬爾地夫舉行婚禮，可惜受到疫情影響，飛機停飛，只得作罷。只是我們原本要招待幾十位親戚的機票和住宿，所以已經花掉幾千萬日圓了。


    我現在不再像以前那樣靠撒錢排解壓力，但只要是我認為對自己人生非常有意義的場合，仍會爽快花錢。

    就我自身原則是說，只有用在我自己身上支出，我纔會連一毛錢都斤斤計較；對於身邊的人，我不會讓他們感覺到任何金錢的負擔，因為我不想讓家人操金錢的事。

    而且，只把錢用在重要的人身上，完全不是为了自己花錢，這麼做能讓我置身在幸福的環境中。我可以控制自己不花錢，事實上這很不容易。相反地，只要錢能為身邊的人帶來笑容，光能看到他們的笑容，我也會很幸福，這也是我賺錢最大的動力。

    而且，太小氣導致家庭關係、人際關係失和的話，只會影響到自己的表現，這是最不利自己的情況。因此在用錢時，我希望各位嚴以律己，寬以待人。如果反其道而行，你就處處碰壁。'
