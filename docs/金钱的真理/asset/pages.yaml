  md: '會換車。每個月五間房子要支付的房租合計大約八百萬日圓（約新台幣二百一十六萬元），光是買車就花了超過一億五千萬日圓（約新台幣四千元元）。當然，我也揮霍了好幾千萬日圓購買海瑞溫斯頓（Harry
    Winston）、宇舶錶（HUBLOT）、百達翡麗（PATEK PHILIPPE）等名錶。


