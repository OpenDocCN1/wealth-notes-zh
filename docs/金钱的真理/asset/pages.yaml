- pgno: 83
  md: '尤其是，有存款的人一旦遇到股市暴跌，就可以抓準時機進場全力投資。這是在短期內比其他人賺更多錢的大好機會。事實上全球最大財經資訊公司「彭博新聞社」（Bloomberg
    News）就曾經在二〇一〇年三月二十日報導，美國著名投資家卡爾·艾康（Carl Cahn））、股神巴菲特（Warren Edward Buffett）趁著市場大亂增資買股，進行「一生一次的大掃貨」。


    話說回來，你如果沒錢（沒存款）的話，就沒有這種機會了——即使你知道這是進場的大好時機，卻心有餘而力不足。


    你甚至沒有多餘心力去考量未來，光是為了今天的溫飽就筋疲力竭。


    你待在自已不想待的公司，為勞動條件極差的黑心企業工作，甚至連自由也遭到剝奪；你無法抬頭挺胸說：「這種爛公司，我要辭職！」只能對那些討厭的人、只想遠離


    的人不停地卑躬屈膝。


    為了跨越困境、掌握大好機會、活出自己的人生，你一定要學會存錢。錢是人的膽，有存款才有力氣，成為有錢人的第一步就是「存錢」。'
