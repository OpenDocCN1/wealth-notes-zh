  md: '# 瞧不起小錢，是財富遠離的開始


    關於我「過去的行為」，接下來我想再具體說明一下。


    我第一次創業成立公司是大學在學期間。當時開的是服飾公司，一年的總營業額約十億日圓（約新臺幣兩億八千萬元），在澀谷知名的一〇九大樓也有門市。


    後來公司卻因為我過度拓展事業，只開了五年就倒閉。手頭沒有資金的我絲毫不在


    意別人的目光，緊接著一腳踏入兜售情報資訊的實驗性質事業。


    服飾公司倒閉後，隔月我就在情報資訊業界賺了大錢，沒過多多久人人都稱我為「秒賺一億日圓的男人」。


    於此同時，我的花錢方式也更加忠於自己的欲望。就在我宣告破產、自暴自棄之時，突然又有一大筆錢二話不說來到我面前，導致我過度自信，看不起小錢。那段時期我誤以為「賺錢很容易」，而當你開始看不起一塊錢的時候，地獄之門就開啟了。我當時的口頭禪是「小錢可以丟掉」，這樣的心態當然也導致我後來直接走向破產地獄。


    那時我住在六本木的東京中城4，月租兩百萬日圓（約新臺幣五十四萬元）的豪宅，擁有勞斯萊斯頂級車款「幻影」、賓利、法拉利等好幾輛名車，每次一有新車推出我就'
