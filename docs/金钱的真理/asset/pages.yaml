- pgno: 174
  md: '我們繼續原本的話題。那麼，如果不是辭職創業從零開始，而是大家很感興趣的「開分店」，怎麼樣呢？


    所謂的「開分店」，就是沿用某家店的味道與店鋪經營方式，以同樣的店名獨立出來開業。例如，你必須先去某家拉麵店工作，在一定期間內當學徒學藝，直至拉麵店老闆認可，才得以出師，而不是一下子就開店。


    開分店的優點是，你能透過在成功的拉麵店實際工作，了解多大的店面坪數會有多少客人上門、每位客人的消費金額該有多少才會賺錢······對經營一家店有某種程度的概念。繼承前人的經營方式，你就能在現有基礎上做得更有聲有色，也能省去犯錯的時間，成功縮短剛開店的虧損時期。從這個角度來看的話，我認為開分店遠比赤手空拳從零開始創業更好。


    但是，開分店在民間現有的體制中，終究不脫「加盟」的形態。大多有義務要支付權利金，有各種限制，而且要接受嚴格監督。


    當然也有無須權利金的加盟類型。


    比如說，某知名餐飲連鎖店採用的加盟方式就是「免個人資金」、「獨立開業免權利金」。一聽到能邊領薪水邊學習經營技巧，沒有資金也能創業，也不用付權利金，你'
  merge: -1
  img_proc: true
- pgno: 175
  md: '或許也想試試。日本的人力銀行網站也介紹過，將此視為是低風險的獨立開業方式。然而，實際消息指出，超過八成懷抱夢想、期待未來能夠獨立開業而加入該公司的人，後來都退出了。據我所知，這個加盟體系不是真的能夠讓人一邊工作一邊有效地學習經營。事實上他們是拿民眾對獨立開業的期待當作誘餌，迫使加入的員工在店裡沒日沒夜不眠不休地工作。據說進那家公司至少要待個四到五年才能獨立，在這段期間，加班和假日排班是理所當然的。而且即使你都已经這麼努力了，也不保證你最後一定能夠獨立開業。這類加盟事業的問題點，各位只要看看超商加盟店糟糕的勞動環境所衍生的社會問題應該就很清楚了。結果，加盟店主其實就是「創業圈的上班族」，很難有什麼了不起的成就。


    當你事事都要靠別人的那一刻開始，你就已經被抓住要害。網路事業等也是如此，古今中外不管是誰，只要想靠別人致富，結局往往不是太好。既然如此，你應該先在某處學會經營的訣竅，接著完全脫離與該處的關係，再把勞力投入自創的體制與品牌建立上，從零開始。人往往對於自己花心思打造到一半的東西很執著，想帶著它離開。但是，如果你……'
  merge: -1
  img_proc: true
- pgno: 176
  md: '帶走的是完成品，就會出現糾紛等麻煩事。只要看看那些上班族辭職創業，卻帶走前公司的屬下和客戶等引發問題的例子，應該就能明白。


    我很好奇他們為什麼要做這種事。我並不打算討論職場倫理的問題，只是覺得應該避免惹麻煩。惹出這種麻煩，損失的只有自己。能從原本的職場學到工作訣竅，便已足夠。像事業夥伴、客戶、店名等，在全新的地方從零開始建立會比較輕鬆，也才能夠長久順利。


    假如你決定離職自己創業，卻總想著攀附別人踩上「巨人」的肩膀，利用他人奠定好的基礎，或偷懶沿用他人的財產和資產，這行徑就跟小偷根本沒兩樣。這時你更應該堅持從零開始，靠自己打下江山。這樣的志氣非常重要。


    想創業，先從副業或兼職開始吧！


    這樣看來，我認為自由接案賺錢還是最佳選擇。就是一邊繼續公司的工作，一邊利用下班和假日時間從事某項副業、兼職或投資賺錢。


    至於要做什麼副業或投資，在這個階段還不是什麼大問題。想想自己適合或擅長什'
  merge: -1
  img_proc: true
- pgno: 177
  md: '麼，做出選擇即可。


    我可以想到的例子包括：當「中間商」高價轉賣低價採購來的商品、利用拍賣網站賣掉用不到的物品」、當「部落格」寫文章賺聯盟行銷收入、當「內容創作者」提供影片編輯服務、當「網頁設計師」架设網站、當「程式設計師」替客戶寫軟體、當「交易員」利用短期的價格變動賺取買賣差價……要做什麼都可以。


    唯有一點希望各位務必記住。


    不管你要做什麼，都「不要有期待」。


    我現在參與的的股票投資與虛擬貨幣世界中，有一種自以為是的散戶投資客，經常在事情還沒有發生之前，就一廂情願地認為「股價下個月就會翻漲數倍，我光靠這支股票就可以賺大錢！」


    問題是，不管你再怎麼期待，股票和貨幣的價格都不會按照你的期望變動。過度期待的人會因為情況不如預期而備受打擊。一個月過後他們就會心力交瘁，決定賣掉股票或虛擬貨幣。其實只要再忍一忍，繼續持有一年，價格就會變成兩倍……這種情況經常發生。


    我在投資時考慮的不是「賺不賺錢」、「有沒有買對」這些事。買下一千萬日圓的'
  merge: -1
