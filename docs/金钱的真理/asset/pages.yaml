- pgno: 211
  md: '這世上有很多人以為只要存錢就能變成有錢人。這是很大的誤解，原因我也已經解釋過了。成為有錢人靠的不是存錢與守財，唯一的辦法就是賺很多錢，而且要錢滾錢，愈滾愈多。


    所謂賺錢，以公司來說就是獲利。獲利的方法有很多，一般人熟悉的就是「提高營業額」與「削減成本」這兩種。我用的方法卻不是這兩者的任何一個。


    因為最好的方法是「降低成本，同時提高營業額」。


    我當然也知道這只是理想，而且不是那麼簡單。一般來說，只要削減成本，營業額就會跟著下滑；因此想要提升營業額就必須投資。


    但是，用對做法的話，有可能在降低成本的同時還能提高營業額。於是，「提高營業額帶來的利潤增加」與「削減成本帶來的利潤增加」合計起來，可處分所得就會增加到非比尋常的數字。這麼一來，用增加的所得繼續投資，就夠錢滾錢，帶來更多的財富。


    因此，為了增加財富，你必須考慮削減成本與增加收入這兩個方面。我希望各位明白一件事，如果是個人的收入成功增加，也就是個人的薪水增加時，因為累進稅率的緣故，納稅額也會跟著增加。但是，如果可以減少可處分所得內的所謂'
  merge: -1
  img_proc: true
- pgno: 212
  md: '開銷，就能直接讓你的淨利增加。


    我舉個例子，假設你的月薪調高十萬日圓（約新台幣兩萬七千元），你拿到的不會是完整的十萬日圓，因為這十萬日圓也會被課稅；假如這筆錢要扣稅四〇%，也就是四萬日圓（約新台幣一萬元）的話，剩下的就是六萬（約新台幣一萬七千元）。因此，你的可處分所得只增加了六萬日圓。


    另一方面，假如你能節省十萬日圓的無謂支出，就能夠直接留下十萬日圓在手邊，這整筆錢都是你的可處分所得。


    也就是說，與月薪增加十萬日圓相比，削減十萬日圓的開銷，對於增加淨資產的貢獻較大。削減成本的意思就是這麼重要。所以，接下來我要先從削減成本的角度談起。


    # 別相信「眼前賺到的錢」


    看看四周，有很多人只是短期內增加了收入，卻一副自己已經達成目標的樣子到處炫耀。這種人只要手上的錢增加一點，就會買車換房，喜歡極度奢華的生活風格。


    舉例來說，假設有一個搞笑藝人突然人氣竄升，這陣子他戶頭裡收到的薪資是一年'
  merge: -1
  img_proc: true
- pgno: 213
  md: '五千萬日圓（約新臺幣一千四百萬元）。


    這筆錢平均下來，每個月有四百萬日圓，他覺得自己住房租一百萬的房子應該也無妨，於是搬到豪宅。然而，這樣的收入沒有持續太久。他的人氣後來下滑，原本每月四百萬的收入變成每月兩百萬、一百萬、五十萬，急速減少。


    結果，這名搞笑藝人無法繼續住在房租一百萬日圓的房子，只能搬回便宜的地方。因為他誤以為一時增加的收入會永遠持續下去，結果賠上一百萬日圓的租房礼金、一月份的中介手續費、退租時的復原費、搬家費，還有新家的礼金、中介手續費等，浪費了不少錢。


    我其實也有完全相同的經驗，所以才會寫出來。


    因為暫時有了很高的收入，我立刻誤信那就是自己的實力，並誤以為這樣的收入能夠一直維持下去，於是提高了生活水準，但各位要知道這種狀態根本不可能持續太久。同樣的例子還會發生在公司經營者、投資客、炒短線的股票交易者身上。打贏勝仗之後更應該把戰袍穿好，隨時備戰；你必須把錢轉入定存，或是換成踏實無風險的資產，在下次機會來臨之前維持生活現狀，養精蓄銳。


    假設有位公司經營者因為二〇一九年的業績極佳，卻正好在新冠肺炎疫情爆發前換'
  merge: -1
  img_proc: true
- pgno: 214
  md: '到更大的辦公室、大量錄用剛畢業的新鮮人，或一口氣在各地展店，現在應該覺得欲哭無淚吧。


    當然，没人能夠事前預料到會爆發疫情，這是前所未有的情況，因此這名經營者也 很無奈。但是，所謂的「經濟」，就是即使遇上這樣不可抗力的情況也必須負起責任。 也就是說，必須把天災地變等異常現象也當作是自己的責任。


    這麼一來，時時自我警戒，告訴自己「世事無常，這個月的收入或許下個月突然就 沒有了」，才是比較妥當的做法。


    # 即使收入增加，也應維持原本的生活水準


    再舉一個現實生活中的例子。除了我自己過去的經歷之外，網路上的網紅之中，也 有人開設現在很流行的線上沙龍大賺一筆，馬上急著提高生活水準，結果後來聲勢不 再，因為無法維持生活而關掉帳號，就此消失在眾人面前。


    突然搬到出租豪宅，或流連在六本木與西麻布的俱樂部、夜店VIP室，或是與 知名偶像團體的女團員們搞曖昧，這些都是危險信號。相反地，長期穩定站在頂端的傑'
  merge: -1
  img_proc: true
- pgno: 215
  md: '出人士即使賺大錢，也不會敗給欲望，而是冷靜地維持著原本的生活。


    話說回來，當紅線上沙龍的年營收預估方式是「月收入×人數×十二個月」；假設現在會員有一千人，每人一萬日圓，預估年營收就是月收入一千萬日圓×十二個月，也就是一億兩千萬日圓（約新台幣三千三百萬元）。但這筆錢只是預估，不知道是否真的能夠拿到手。一般來說，光是要維持現有一千名會員一年的訂閱就很不容易，更別說增加會員的人數。


    有些會員一開始是秉持著「好奇」才加入，基本上人都是喜新厭舊的，恐怕到了明年就已經徹底忘了你，轉而追求新潮流了。所以，千萬別誤以為「我是特別的，大衆對我的喜愛會長長久久」，否則就是悲劇的開始。


    說起來就連大企業無微不至的服務都會被解約了；他們必須不斷花心思與行銷費用，招募新客戶來彌補解約者的空缺。因此，計算年營收的時候，不可以隨便就把月營收乘以十二倍計算。


    另外，短線交易者和投資者也一樣。現階段大環境因為疫情影響，擴大了不確定性，所以隨意買進賣出即使賺了錢也多半是偶然，這只是在賭博，不只下一秒可能讓你把賺的錢吐出來，還有很高的機率會讓你連本金都賠光。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '原因在於，人一旦贏了就會得意忘形，變得更貪心；一旦輸了就會奮起想贏回來。像這樣來來去去，你將無法堅持穩健的投資方針，而是付出更大的代價企圖一次逆轉勝。也就是說，當你把投資或交易當成賭局的那一刻，就已經註定會敗給起伏不定的情緒了。因此，即使一時賺了大錢，也不能相信之後一直會有同樣水準的收入進帳。尤其投資本就是在有賺有賠的狀況下，本金逐漸增加。才賺了一點錢就急著提高生活水準，就是沒有考慮到之後如果收入減少該怎麼辦，這麼做只是在增加風險，應該更加謹慎小心才是。


    歸納以上的內容，你要注意的重點就是：「即使收入順利增加，也很可能只是暫時，別提高生活水準」、「別買不需要的物品」、「別隨意擴大投資或展店」。即使收入多少增加了，也請維持原本的生活水準。在財富增加的同時，還能夠削減支出的話，你就更有機會成為有錢人。


    # 成功的哲學即「忍耐的哲學」


    關於為何應該維持原本的生活水準，我想再多解釋一下。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '有些人會主張豪奢的生活可以「提高賺錢的動力」。我不會說這樣的做法完全沒有提升動力的效果。


    以網路公司CyberAngel為例：這家公司是藤田晉社長於一九九八年和兩名工讀生一共三個人，在原宿一間小小住商混合大樓創立的公司。成立大約一年後，就搬到表參道車站旁的氣派大樓。明明是剛起步的新創公司，辦公室面積卻比以前大上三倍。


    當然，此時員工仍然不多，所以辦公室裡空蕩蕩的。藤田社長一看到沒人的空間就想要填滿，於是他擴大事業版圖，增加員工人數。


    也就是說，他先準備好盒子再去填滿它，讓實際狀況跟上。


    我所住的杜拜也是如此。自二〇〇〇年起經濟發展的同時，也帶動了基礎建設的投資，使得不動產供給過於求，因此杜拜對外宣傳他們是摩天堂大樓棟棟相連到天邊、世界數一數二的先進國家，吸引外來移民入住。


    不過，這樣的強者邏輯容易受到運氣和天賦的影響。一般人不會主動去填滿眼前的空盒，這種做法對他們來說反而危險。我們不能不經思考就仿效天才做同樣的事：因為'
  merge: -1
  img_proc: true
- pgno: 218
  md: '看到成功的特例，就深受感動進而模仿，下場通常都很慘。我希望各位選擇平凡人也能夠確實辦到的方法。


    另外，如果一般人採取提高生活水準來提升動力的做法，有可能開啟無窮盡的物欲。住進租金昂貴的豪宅之後，你會開始穿上昂貴的衣服，連光顧的餐廳也不一樣了，八成還會購買高檔車和手錶。這麼一來，你就會陷入「我很了不起」的優越幻象，直到墜入深淵才能清醒。


    就我所見，打腫臉充胖子的人有九成以上都會變成這樣。


    為了避免這種情況發生，重要的是你必須「經常延遲滿足」。延遲消費與欲望，你就會有動力賺錢，財富因此增加。延遲滿足就是一個人努力的最大動機。


    也就是說，成功的哲學就是「忍耐的哲學」。


    回顧自己的過往，我發現自己往往在忍耐之後就能闖出一番成果。我曾經為了減肥而忍耐，忍受過股票套牢，也忍受過來自外界的誹謗中傷和批評。


    我經常說：「打完勝仗之後更應該把戰袍穿好。」意思就是不能因為小小的勝利就鬆懈，要更加戒慎恐懼。這也是祖父留給我很重要的人生哲學。


    比起現在拿手上的一百萬日圓去血拼，你應該先忍住欲望，讓這一百萬滾成未來的'
  merge: -1
  img_proc: true
- pgno: 219
  md: '一億。當這筆錢變成一億日圓，即使你花掉一百萬的五倍，也就是五百萬日圓，手邊還有九千五百萬日圓。你不覺得這樣的結果更理想嗎？


    因此，在錢變多的時候，你更應該要忍住別亂花，這正是有錢人致富的祕訣。


    # 想成為真正的有錢人就要懂得「再投資」


    忍住消費的欲望之後，接下來要做的就是再投資。也就是用錢滾錢增加收入的方


    法。把短期賺到的錢拿來再投資，獲利之後再投資，這樣持續下去，財富就會增加。這個做法很單純，但唯有這個辦法才能夠成為真正的有錢人。


    這個狀態如果要打比方，就像從山頂滾下來的小雪球，滾到山腳下時已經變成巨大的雪球了。


    這就是「複利效果」。所謂的複利效果，就是把投資的獲利用來再次投資，藉利生利併入本金裡加碼投資，所形成的連環效應。向民間金融機構借錢還不出來時，債務的利息也會產生新的利息，就像雪球般愈滾愈大，這也是複利效果，只不過是負面的。


    以我自己為例。我在匯豐銀行（HSBC）與大東方控股（Great Eastern Holdings'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'Limited，簡稱 GEH）的保險基金投資了大約五百萬美元（約新台幣二億五千萬元），一年會產生四・二%（二十一萬美元，約新台幣六百零二萬元）的獲利。我把這筆二十一萬美元加入本金繼續投資，翌年產生的獲利是五百二十一萬美元的四・二%，也就是二千八百二十美元（約新台幣六百二十萬元的二倍，也就是一百二十八萬美元，約新台幣六百二十五萬元）。我再次把獲利全數投入本金，繼續得到四・二%的獲利，過程就是這樣。


    另外，我還擁有同樣是價值五百萬美元的公司債，一年約有五%的利息，所以一年會產生二十五萬美元（約新台幣七百二十萬元）的獲利。使用這筆二十五萬美元購買股利有四%的股票，價值二十五萬美元的股票就會多增加一萬美元（約新台幣二十九萬元）的獲利。


    把投資創造出來的軍費像這樣換成其他資產，先製造小額的回饋；然後這筆回饋也不花掉，繼續換成其他能夠獲利的商品，持續用利滾利，是最基本的思考方式。如果是保險，獲利會自動納入本金；但如果是股票股利或公司債的債券票息，你就會直接拿到現金，必須自行再去購買其他資產。


    以下注意事項請各位必須小心：保險如果打算在七年之內贖回，就會產生違約金。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '買了公司債之後，如果沒有到達到期日就必須以不利的價格賣掉，會產生資本損失（Capital Loss，又稱資本減值）。在股票除權息交易日之前，以略高的價格買進股票，等到除權息交易日那天股價下跌時賣出，就會與公司債一樣產生資本損失。也就是說，


    如果投資有時間限制，或是缺現金必須變現，你的獲利投資多半會以失敗收場。


    但是，只要你冇充足且沒有時間限制的資金，也有充分的時間，就可以利用前面提過的理想復利方式拿利息再次投資。


    在這次的疫情衝擊下，仍有公司經營不受影響，能夠照常支付票息，因此你還是能如常收到利息。你可以再利用這筆利息，趁著目前高投資報酬率的股票價格受到疫情影響打了折，加碼買進。


    再加上等到期日才贖回，還能夠保本。發行公司如果倒閉，的確有可能拿不回部分或全額本金，不過這種情況發生的機率十分罕見。只要你更謹慎挑選發行單位，就能夠減少遇上債務不履行的機率。不過，我當然無法保證證率為零。


    再者，以這類收入（股票的配息金、債券的利息等）為基礎的資產運用，等到資金3500000，按照票面利率支付的利息。'
  merge: -1
  img_proc: true
- pgno: 222
  md: '增加之後再進行比較有效率。一開始還是必須透過商業行為，或是參與能帶來資本利得 (capital gain，提升資產價值帶來的利益) 的短期投資擴大軍費。


    另外，商業行為與短期投資雖然能夠擴大軍費，但要持續進行再投資，必須克服很大的心理障礙。比方說，某人很努力累積了三百萬日圓的軍費，他以這筆錢當作本金，從事新副業或炒短線賺錢，使得三百萬變成五百萬回來。這時，他的腦子裡就會冒出「我好不容易賺到五百萬，不想用掉」、「這筆五百萬可以用來買很多东西」等干擾。


    用五百萬再投資增加到八百萬時，因為手邊的錢變多，外在的誘惑就會更加強烈。例如：有了八百萬就能夠買那輛想要的車、付房貸頭期款買房。隨著錢愈來愈多，與欲望交戰的情況也會愈演愈烈。想要戰勝這些誘惑，把錢當成是打「金錢遊戲」電動的得分，不失為一種方法。


    # 「把錢當成是打電動的得分」，與現實切割


    我說的金錢遊戲，不是短期獲利的投機型投資，而是純粹用得分配比較贏的電動遊戲。想想《信長的野望》和《三國志》這類戰國時代的策略模擬遊戲。遊戲的得分在現'
  merge: -1
  img_proc: true
- pgno: 223
  md: '實世界中沒有意義，增加或減少也不會心痛。但如果你對賺到的錢太過執著或真實感太強的話，就很難拿來再投資。


    因此，我離開日本之後幾乎不去看現金。即使錢變多了，也只是帳面上顯示的數字變大而已，沒有太大的真實感。重點在於，看到逐漸增加的數字，你是否能把那個數字看作不可使用的錢。


    是再投資，是足以影響人生的重大問題。我不是在恐嚇你，無法持續以錢滾錢的話，你就無法升級。


    以前面提到的電動遊戲來打比方的話，這道理就跟你平時儲備軍糧保衛國家，提高軍事能力，在與其他戰國諸侯交戰的勝負時刻，你卻燒掉軍糧、解散軍隊一樣。這麼做的話，敵軍瞬間就會攻陷你的城池殺掉你。


    所以，不管你將賺錢比拟成哪種電動遊戲，希望各位暫時忘掉對錢的執著。拿來當作軍費的錢，絕對不可以在中途抽掉，連一次也不行。最後贏得遊戲統一天下的人，那筆錢才會真正成為你的錢。


    全球規模最大的怪獸企業亞馬遜（Amazon.com,Inc.），自一九九七年起超過二十年都把大部分獲利拿來再投資。該公司的營業額雖然以驚人的氣勢持續成長，但最終損'
