- pgno: 238
  md: '# 大企業推薦的金融商品很危險


    當然我現在仍持有匯豐銀行與大東方控股的保險、歐美和中東基金、歐洲企業公司債等。只要沒有時間限制，這些投資的確能幫忙賺錢。但沒時間的人、缺乏資金的人如果投資這些商品的話，毫無疑問最後一定會虧損。因此，你不可以抱著隨便玩玩的心情投資。原因前面也提過，這類金融商品通常設計成現買現賣的話一定會損失。與那些金融機構交手想要賺錢，你必須投入大把時間才行。


    另外，一般來說當你想要抽回資金時，對方一定會全力慰留；他們不會痛快地答應解約，而是會說：「如果您需要資金，可以抵押這個證券申請現金融資。這個合約這麼有利，您為什麼要解約？」


    事實上，我前幾天剛解約兩個非主力投資、本金總計七十萬美元（約新台幣兩千萬元）的金融商品，但解約過程非常艱辛。


    對方說：「市場正在崩盤，現在解約不是良策，希望您再等幾個月看看。」「銀行戶頭的自動扣款尚未解除完成，所以目前無法解約。」「明明只是要解約個約，沒想到這麼麻煩。'
