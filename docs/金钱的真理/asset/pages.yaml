- pgno: 242
  md: '因此，違法與否只是政府的問題。自由主義原本就主張物品流通不受限制。我認為這樣子才有助於價格的形成與流通。


    當然，我舉票券轉賣（黃牛）的例子，就跟販賣毒品、槍械一樣，都是違法的行為，正因爲供給有限制，才能高價轉賣。但無論如何，千萬別忘了從「供給可以獨占嗎？」這個角度來思考。即使在某領域已經有類似的商品存在，你還是可以採用品牌區隔策略，變成獨家提供；或是透過原創的服務變成獨家提供。打造供給有限的狀態，是我在考慮做生意時最重視的原則。


    # 配合社會潮流與時代脈動


    接下來我們來談談轉帳詐騙。這是現代最具代表性 的惡行，千萬不可以模仿，但詐騙集團死纏爛打的機制倒是值得研究。


    舉例來說，詐騙集團會持續開拓詐騙對象，每天不停地打電話，業務系統相當有組織，宛如活在黑暗世界的蟑螂般生命力旺盛。


    另外，轉帳詐騙的特徵就是相當貼近時事。最常出現的四種詐騙類型有「盜用身分'
  merge: -1
  img_proc: true
- pgno: 243
  md: '詐騙」、「假請款真詐財」、「融資保證金詐騙」、「退稅詐騙」，當中的「退稅詐騙」就屬於貼近時事的類型。


    大約十年前，日本公明黨提案實施生活援助政策，撥款總金額超過兩兆三千九百五十億日圓（約新台幣五千五百億元）當作定額給付金，發給六十五歲以上每人兩萬日圓（約新台幣五千四百元），十九歲到六十四歲每人一萬兩千日圓（約新台幣三千兩百元），十八歲以下每人兩萬日圓。


    率先對這項政策做出反應的，就是詐騙集團。


    詐騙集團想出把定額給付金當成詐騙藉口，開始打電話說：「我是市公所的職員，您的定額給付金手續尚未完成。請拿著手機前往ATM辦理。」


    不只是定額給付金，每當政府改了什麼政策，詐騙集團一定會推出與新制相關的詐騙。利用主要受害者老年人在電視上看過的資訊設計詐騙內容，與社會大衆的現實狀況即時同步。


    我認為詐騙集團的劇本創作者相當有商業頭腦。為什麼這麼說？聰明的YouTuber和部落客也非常擅長配合社會潮流與時代脈動。比方說：世界盃延期他們就會幽默揶揄，發生地震就會討論捐款，民眾抨擊不倫行徑就會一起加入批評……懂得將吸引社會'
  merge: -1
  img_proc: true
- pgno: 244
  md: '大衆目光的時事，與自己的行動做連結，像這樣搭上時勢順風車的視點相當重要。

    這麼一想，轉帳詐騙的行為其實相當反映世態。詐騙集團的騙術很容易煽動人們起身行動。我當然不是叫大家去轉帳詐騙，但你可以汲取其中的精華，以正確的方式套用在正派生意上，我認為會很有幫助。

    說起來，也有不少人從成人片等地下世界轉入正派經營的世界，搖身一變成爲成功的企業家。想要在這個世界順利存活，理想與現實必須維持絕妙的平衡。

    馬丁·路德·金恩牧師說：「沒有愛的力量是魯莽濫用；沒有力量的愛是敏感貧瘠。」$^{37}$我認爲很有道理。每次看到一事無成的年輕人參加反政府抗議遊行，我就會這樣想：「你必須先有些成就，說話才有力量，才能夠改變社會。你現在的主張在多數場合只是浪費時間精力。」

    因為那等於是沒有力量的愛。現實社會沒有那麼簡單，並非你主張正確的事就能夠改變。

    因此，當你舉著社會正義的大旗，嘴上說著漂亮話就能萬事順利的話，我只會說恭喜你，但現實問題是，缺乏實際成績和金錢作為助力，你就沒有力量。

    歸納以上內容，我希望各位記住的重點是：為了擁有力量，不管是什麼生意、以什'
