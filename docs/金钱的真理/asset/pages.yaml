- pgno: 229
  md: '回到杯子的話題，我們對於杯子裡的水必須悲觀看待，應該解讀成「才只有半杯水」。更重要的是，即使杯子裡裝滿了水，你也要想到「喝掉就沒了」。你應該像前面那部電影提到的：等到杯子裝滿水，水溢出來，你才可以喝那些溢出來的水。杯子裡滿滿的水就是你的淨資產，也就是資本金，接下來很長一段時間它将為你帶來更多的錢。


    另一方面，溢出杯子的水，就是再投資買下的不動產收到的房租，或是股票股利，或是你創立的事業帶來的後續收入。因為擁有資產讓你得到的收入稱為「投資收益」（income
    gain）。這些投資收益，加上你擁有市場交易價格會變動的資產，價格上揚時，你的資產會因為市值評價而產生未實現獲利，將未實現獲利實現之後，你就能夠喝掉溢出來的水。這就稱為「資本利得」（capital
    gain）。


    像這樣只喝溢出來的水，你用來作為資本金的淨資產就不會減少。如果能夠變成這個狀態，你會發現一件很有趣的事，錢會吸引更多的錢來，你既能夠滿足欲望又能夠成為更有錢的人，一舉兩得。等你走到這個階段時，就可以稍微放鬆日積月累的忍耐。比方說，假如你無論如何都無法克制物欲，只要你只取用溢出來的水，要買任何想要的東西都可以。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '不過我要特別補充一點，我認為溢出來的水至少必須留下一半。假設溢出來的水金額是五百萬日圓，你最多只能花掉兩百五十萬。所以，即使你想要上千萬日圓的高檔車，這個時候買還太早。其實我覺得用掉一半還是太多，可能的話，花在欲望和消費上的額度，最好不超過四分之一，才是最理想的狀態。


    # 把「淨資產一億日圓」設為必達目標


    我這樣說，各位或許會心想：「我究竟要忍耐到什麼時候才會變成有錢人？」這要看每個人的想法，有個數字姑且可以當作判斷的依據。


    研究分析全球經濟的智庫認為，富裕階級的定義是「淨金融資產達一億日圓」。至於淨金融資產達五億日圓以上者，就是超級富裕階級。


    淨金融資產是指現金、存款、股票、債券、投資信託、壽險等金融資產的總和，減掉負債之後得到的金額。這個數字不包括土地和建築物等不動產；大概是因為不動產要變現比較耗時，有些物件甚至找不到買家。反過來說，如果是流動性高的人氣物件，或許就可以考慮當作淨金融資產。'
  merge: -1
  img_proc: true
- pgno: 231
  md: '總而言之，日本的富裕階級數量超乎想像的多。二〇一七年的資料顯示，大約有一百十八萬個家庭屬於富裕階級。這個數字僅次於美國、中國，名列世界第三。日本現在還可以算是有錢的國家。


    因此，身為日本人的你如果想要成為有錢人，就必須先以淨金融資產達一億日圓為目標。


    一般上班族想要創造一億日圓的淨金融資產並不簡單，但也不是辦不到。我想一切都取決於你的點子。


    比方說，利用以下這種方式可能就可以達到。


    日本的麵包超人有推出各式各樣的官方周邊商品，例如：玩具、圖書書、衣服等，但是在我居住的曼谷卻沒有賣。我家有小小孩，他最愛麵包超人，在國外也經常看麵包超人的電視節目。但不管孩子再想要麵包超人商品，我們也只能在去日本的時候買，或是從日本網站訂購再轉寄到國外，沒有其他管道可以購買麵包超人商品。曼谷有很多日本人家庭，麵包超人在這裡很受歡迎，卻沒有在賣官方出的周邊商品。


    但是日本官方推出了大量的周邊商品提供給市場，於是有人從日本買進大量的麵包超人商品寄到曼谷，再以兩倍或三倍的价格販售。孩子們對網路購物不會興奮，只有去'
