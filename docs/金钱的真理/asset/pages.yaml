- pgno: 89
  md: '繼續上一節的話題，從「年收入多寡」判斷一個人的身價，這個做法還有一個問題。信奉年收入的人大多認為收入就是領到的總金額（Gross），但我認為年收入應該從淨利（Net）的角度來思考才對。


    舉例來說，以書店裡隨處可見的「年收千萬」書籍為例。


    我記得根據統計結果，年收入一千萬日圓的人只占日本全國總勞動人口的4.5%。大家想像的應該是企大企業員工、律師、醫生等菁英住在豪宅的樣子吧？


    一般人一聽到年收入一千萬日圓，想到的往往是一千萬日圓直接入袋的畫面。但仔細算過後，你會知道事實上根本不可能。


    因為政府的稅制改革影響，可以從課稅所得減去的基本扣除額和扶養扣除額經常變動，對日本國民來說有時是加稅，有時是減稅。但目前的趨勢基本上是加稅。不管哪一種，在現在這個時間點來看，年收入一千萬日圓扣掉税金等之後，實際拿到的錢大約是七百萬日圓（約新台幣一百八十九萬元）。


    要想探討年收入一千萬日圓的真實狀況，第一步必須先由這裡切入。在這個階段，三百萬日圓（約新台幣八十萬元）已經從你手上飛走了。


    接著我們再從扣稅剩下的七百萬日圓，減去每個月生活不可或缺的各项開銷。首先'
  merge: -1
  img_proc: true
- pgno: 90
  md: '是房租十萬日圓（約新台幣兩萬七千元）、三餐和衣服等生活費十萬日圓、小孩的教

    育費五萬日圓（約新台幣一萬四千元）、工作或朋友的交際費四萬日圓（約新台幣一萬

    元）、通訊網路費一萬日圓（約新台幣兩千七百元）……這些花費累計下來，總共要扣

    掉三十萬日圓（約新台幣八萬一千元）。


    一

    整年扣稅之後的收入是七百萬日圓，相當於每個月約五十八萬日圓（約新台幣十

    六萬元）。


    這五十八萬日圓扣掉每月必須花費三十萬之後，只剩下二十八萬（約新台幣五萬

    五千元）。


    一個月二十八萬日圓的話，十二個月就是三百三十六萬日圓（約新台幣九十

    萬元）。


    也就是說，年收入一千萬日圓的人真正的年收入，其實是三百三十六萬日圓。扣掉

    所有必要支出之後的金額稱為「可處分所得」。可處分所得的多寡才是累積財富的關

    鍵。可處分所得愈多，愈有可能成為有錢人。


    年收入一千萬日圓乍聽之下很多，但從可處分所得來看，其實並非如此。假如背負

    房貸，或是住在房租更貴的房子，又或者小孩的教育費更花錢，可處分所得就會更少。'
