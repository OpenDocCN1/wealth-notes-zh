- pgno: 59
  md: '危機時最重要的就是「斷捨離」。只留下自己此刻真正不可或缺的東西，「告別」人生中不必要的東西。人們往社會購買用不到的東西，維持有害的人際關係，進行沒有效益的投資，投入不賺錢的生意；那個也出手這個也試試，就像在展現自己多管齊下很能幹。然而愈是這樣「樣樣通、樣樣鬆一，你愈有可能陷入困境。


    有些事情不用刻意割捨，自然而然就不會去碰了。但我想強調的是「刻意割捨」這個動作。為了避免今後繼續採取沒成效的膚淺行動，也為了防止繼續購買不必要的物品，現在就必須將這些生命中多餘的人事物割捨掉。即使過程中會痛，若能在此刻切實感受到疼痛，今後再做傻事的機率就會大大降低。危機正是你進行斷捨離的大好機會。


    比方說，假如你有在投資，平常注意力總是放在許多股票上，覺得那支股票不錯、這支股票也很好、那支好像會上漲……。但是，仔細研究過後，你會發現之前的自己對績效的預估過度樂觀。如果只是看起來會漲、可能會漲這種程度的預估，每個人都能夠列出很多支股票。這時最重要的是，只持有「真的會漲」的股票，而不是「看起來可能會漲」的股票。實際上，我們無法斷言哪支股票「一定會漲」，但我們可以只投資自己認定會漲的那幾支股票。當然，我們也要做好心理準備，對自己決定的投資結果負責。


    在市場行情急速走跌的時候，看到成交价在短時間內迅速走貶，我們實在無法光憑'
  merge: -1
  img_proc: true
- pgno: 60
  md: '# 危機正是拿回人生主導權的好時機


    我認為最近這十年全世界製造了太多沒用的東西。趁著這次新冠肺炎疫情的機會，淘汰這世界上沒有用處的東西吧。對世人來說沒有必要的公司、對個人而言不必要的欲望……全都趁此機會清除乾淨。此刻正是世人重新覺醒，找回冷靜的大好時機。


    這種時候，如果你仍執著於過去的欲望，就會被時代淘汰，遭遇不幸。現在你必須做的就是斷捨離，盡量割捨不需要的東西，解放你的身心靈，將儲存下來的能量，拿來面對那些對你而言真正重要的人物。不管是個人範圍或國家範疇的斷捨離，我認為都是這世界今後永續存在的重要過程。類似新冠肺炎疫情這樣的一強制斷捨離，以後仍會定期發生，在我們有生之年，應該會再發生個幾次，因此培養對強制斷捨離的免疫力非'
  merge: -1
  img_proc: true
- pgno: 61
  md: '常重要。


    在現在的狀態下進行斷捨離，短期之內你或許會覺得是一種損失，現在收手或撤退，之前投入的成本或勞力就等於白費了。不過，當下看來是損失的行動，以長遠的眼光來看多半是利多。


    舉例來說，不斷整形或許能讓人得到瞬間的滿足，但下一秒你又覺得自己還不夠完美。在這種念頭的驅使下，你不斷地整形，臉總有一天會毀掉。另一方面，美麗的外貌就短期來說或許能給你帶來好處，但以長期來看，過度依靠外在美會讓人漸漸忽略培養內在美的重要性。即使世人推崇外貌至上主義，光靠一張好看的脸，並不能保證你就能擁有成功的人生。


    電視節目會定期介紹曾經的一流藝人現在落魄的模樣，靠著亮眼外表紅極一時，如今卻落魄潦倒的電影演員更是不計其數。這就是光有外表不見得人生就能從此一帆風順的最佳證明。


    除此之外，吸毒也是給人帶來短暫歡愉，但長遠看來卻會導致一個人的心志逐漸瓦解崩場，最後無法控制自己人生的例子。沉溺於酒色同樣會使你獲得一時的好心情，久而久之卻會掏空身體，讓你的表現每下愈況。衝動購物雖然能滿足當下的欲望，但資金'
  merge: -1
  img_proc: true
- pgno: 62
  md: '不斷減少，長期來看依然是有害無利。同樣的道理，輕易嘗試賺快錢的工作，長期累積下來的，往往只有龐大的損失。


    這也就是說，短期內看來美好的事物，長期來看多半會導致不良的後果。相反地，像斷捨離這種當下看來是損失的情況，長遠來看多半會帶來非常好的結果。遇到危機時應該怎麼辦？答案就是斷捨離。你現在這一刻做的決定，將會影響你往後十年的人生。


    請務必下定決心，徹底執行。


    當初的我就是認真地面對自己的失敗，好好反省過後重新挑戰，才能逆轉過去的窘迫局面，成就了現在的我。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# 致富心法


    ![](img/e54da6402e644e0f166460ffacd9d1c4_63_0.png)


    懂得「八分飽」的人，將所向無敵'
