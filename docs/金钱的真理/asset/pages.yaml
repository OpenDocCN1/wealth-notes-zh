  md: '常生活中五花八門的甜蜜陷併，而時時警覺小心。現在你應該重新審視過去的購物行為，看看自己為什麼沒有察覺到那些陷併的存在。


    # 基本原則就是「凡事存疑」


    這世上存在著許多陷併。因此，想要守住財富，就必須培養不被陷併迷惑的避險能力。根據我的經驗，方法有兩種。


    第一種方法是「凡事存疑」。信任被視為人際關係上的重要態度。一聽到要凡事存疑，你或許會覺得做人不該如此。


    但如果他對凡事深信不疑，就很有可能被心懷惡意靠近的人矇騙。即使對方起初沒有惡意，他也有可能在你不知情的時候突然改變心意，這種情況也不少。從結果來說，你還是上當受騙，痛心自己的信任遭到背叛。但是，臨時改變想法的行為，其實你也經常對其他人這麼做。只要你懂得人心瞬息萬變這個真理，就能理解這種行為背後的的原因。總之第一步就是對一切存疑，包括懷疑對方的心情或想法可能在不知不覺間改變，凡事存疑就能讓你避開類似的風險。'
  merge: -1
  img_proc: true
- pgno: 129
  md: '我認爲容易相信他的人都靣較弱。容易相信人聽起來很善良，也給人誠實的印象，但在現今複雜的時代，容易相信他 person 的人不懂隨機應變的生存法則，往住是最先犧牲的一群。


    對人不疑，只知道盲從信任，你就死定了，這等於是搭上通往人生墳場的直達車。正確的順序應該不是先相信再懷疑，而是先從存疑開始，只跟值得信任的人慢慢建立關係。不是先廣泛交友再縮減人數，而是一開始就嚴格縮小交友範圍，再慢慢擴大信任圈。男女關係也是如此，投資與做生意的哲學亦是相同。『花時間測試』是不容輕忽的重要原則。另外，不只對人如此，買任何東西時，只要別輕易相信那些廣告文宣，事後就不會失望。這個世界本就充滿讓人失望的人事物，即使是沒有惡意的人也有可能性情大變，翻臉不認人。


    我自己過去也曾經盲目相信他人，結果導致重大損失。那個人我姑且稱之爲 A。A的外表在六本木夜生活圈算是相當出衆。我剛認識他時，他找我去跟藝人們一起喝酒，還介紹我好幾位知名音樂人與女藝人。當時年輕的我对
    A 的印象是「他是個大人物，連藝人都信任他」。


    他也曾經居中牽線介紹我認識非法吸金集團；那些粗壯手臂上有刺青的黑道一看到'
  merge: -1
