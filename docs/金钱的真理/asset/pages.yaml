- pgno: 49
  md: '我現在最重視的一件事，就是替自己安排「反省時間」，用來反思工作、投資、人生。正確來說，因為我在離開日本之前，身陷於再不反省就無法突破的人生瓶頸，那时我才發現唯有反省才能使自己進化，反省是讓自己存活下來的唯一方法。


    舉例來說，假設你投資股票買了十家公司的股票，之後你留下其中五家的股票，賣掉另外五家。


    此時，多數人接著只會深入研究持股的五家公司，認為賣掉的那五家股票已經是過往雲煙，再與自己無關，心想：「過去的就忘了吧。」


    但我認為反而不能就此忘記，你應該繼續追蹤那五家公司的股價波動和公司動態。原因在於，假使你賣掉的五家公司股票後來上漲，就證明你太早脫手，你只能承認自己當初的判斷錯誤。這麼一來，往後你就会去思考怎樣才能留下對的股票，讓自己賺得更多。後續追蹤將成為啟動這些行為的關鍵。


    也就是說，別因為事情已經結束就不再關心，已經結束的事才更應該放在心上。請記住：「已脫手的股票更需要追蹤後續發展」、「過去的事情才需要事後檢視」。


    結論就是，假如你發現自己有錯，請立刻坦承失敗。'
  merge: -1
  img_proc: true
- pgno: 50
  md: '# 坦白自己丟臉的一面，是好的開始


    只要看過那些黑心企業被爆料後的應對，你應該就能夠明白老實承認錯誤的重要性。多數企業遭到爆料後，往往因為害怕大衆的批判而隱蔽事實，最後導致情況更加難以收拾。假如企業高層在事情剛爆發的階段就出面道歉，或採取必要的因應措施，事情多半可以好好收尾不會鬧大；還有企業在事情剛爆發階段就乾脆站出來公開一切，反而能獲得大衆的讚賞。也就是說，一開始就把膿瘡擠乾淨是處理傷口最好的方法。承認錯誤的話，丟臉只是一時的；若還有隱匿的真相，最好在被人揭開前就自行公開。這樣做雖然需要莫大的勇氣，但總好過之後信用盡失，演變成無可挽回的下場。


    聽說徵婚網站曾發生會員上傳的照片修圖修太大，結果雙方約見時認不出彼此的长相，鬧出了大笑話。年輕人之間也很流行使用手機的修圖應用程式，讓自己看起來更好看。有些手機應用程式甚至可以修到跟本人截然不同，完全變成另一個人。


    這些例子也跟前面提到的企業坦承錯誤的重要性有相似之處。在雙方見面之前過度拉高對方的期待值，反而會引發對方的失望，導致談不成戀愛。相較之下，我認爲先上傳不好看的照片，之後再提高對方的好感，反而更有機會談成戀愛。我的妻子就曾對我说'
  merge: -1
  img_proc: true
- pgno: 51
  md: '說過：「之前在電視上看到你時，坦白說我覺得你這個人很討厭。」實際跟我相處之後則改觀：「你很健談，所以我就慢慢喜歡上你了。」「我當時在電視上的形象，就是個滿身銅臭、又胖又醜的男人，所以我那位對錢不感興趣又熱愛傑尼斯偶像的妻子，對我沒有太大的期待，恐怕也沒想過會跟我談戀愛。但是，正因為她一開始就對我不抱期待，所以之後無論我做什麼都是加分。


    隱藏真實的自己，以過度美化的一面與對方來往，你就很難隨心所欲地做自己。你會苦於自己打造出來的形象太過完美，與真實的自己差距太大，因而養成不肯面對現實的壞習慣。最後你將停滯不前，成為高不成、低不就的半吊子。


    就像人的身上有膿瘡卻不處理，理所當然會惡化發臭。掩耳盜鈴只是在自欺欺人，永遠無法解決問題。


    因此，我在減肥之前會先露出自己的身體，一發生虧損就停損並在網路上公開，因為我知道老實承認才是促使情況好轉的第一步。這是我在日本時就養成的習慣，在日本那段時期，公司的資金一旦短缺，我就會立刻在部落格上報告這件事。資產遭到查封時，我甚至自己主動在大眾媒體上揭露這則消息。'
  merge: -1
  img_proc: true
- pgno: 52
  md: '# 過度在意別人的評價，會讓你愈來愈軟弱


    多數人應該都很害怕聽到別人說：「你活該。」有的人想要隱瞞自己投資失敗，有的人不想讓外界知道公司陷入困境，所以故意避而不談。但是，不管是哪一種窘境，都應該老實承認。我為什麼這麼說？因為一旦養成隱瞞的習慣，你將重複同樣的錯誤，最後演變成不得不極力隱瞞的重大問題，接下來等著你的就是無法逃脫的無間地獄。


    一 切力求透明化、公開化，一開始的確會經歷一段陣痛期。不管是任何人、任何國家、任何企業，都有著想要隱瞞的祕密或弱點。但只要你能夠鼓起勇氣，在一開始就把傷口裡的膿擠出來，強迫自己面對問題，問題自然會獲得解決。剛開始雖然會感到痛苦和難堪，但那也只是一時的，其實並沒有那麼難以忍受。


    而且，主動承認錯誤反而能夠吸引眾人的注意，甚至為你帶來貴人。應該說，在社會大眾的監視下，你就算想逃避也逃避不了，反而更能夠戒慎恐懼，踏實成長。這也是我能夠東山再起的方法。


    丟臉會使人成長。不怕丟臉才會使人更堅強。無論哪個時代的英雄，過去都曾有过一段被人看不起的歲月。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '總是贏得了眾人稱讚的「好學生」，內心往往很脆弱；他們太過於習慣讚美，一旦沒有人讚美，就會立刻喪失力量和自信。這種人害怕丟臉、批評、被瞧不起，遇到任何問題都是先逃避再說。也就是說，當你行動的動機只是為了獲得別人的稱讚，你就會愈來愈軟弱；因為你的一舉一動都受制於他人的目光，最後只會逐漸遠離自己原本想要的人生。


    相反地，一路丟臉、承受批評和謠諍中傷走來的人，從來不會認為別人的稱讚是理所當然的；因此即便沒有得到讚美，仍會毫不猶豫地按照自己的理念繼續前進。以長遠來看，能夠活出理想人生的人，往往都是按照個人理念行動的那些人。


    我再講一個類似的情況。推特上有些人會轉推那些稱讚自己的推文，或轉發到自己的時間軸上。以長遠的角度來看，這樣的做法並不好。因為轉發者期待獲得他人稱讚的心情太過明顯了。


    稱讚這種東西，就是要出現在自己不知道的地方才有意義和價值。當著你的面稱讚，不過就是客套話：面對面的稱讚、同桌人的讚美，全都沒有價值。人在面對其他的時候，總是習慣於討對方歡心。唯有在物理距離或精神上遠離對方時，才會發現許多讚美多半是言不由衷。'
  merge: -1
  img_proc: true
- pgno: 54
  md: '推特使用者之中，也有人希望得到意見領袖的轉推，因而刻意去稱讚那些網路紅人。他們為什麼要做這種事？因為事關自己的聯盟行銷(affiliate marketing，簡稱
    AP)、廣告收入。我自己也是半斤八兩，所以對於這種做法我不會置喙，不過至少我會盡量避免轉發稱讚自己的推文給我的追隨者看。因為稱讚不該由自己來做。我認為在我不在的場合、在與我無關的地方、在我聽不到的時候稱讚我，這樣的稱讚才有價值。


    我認為「渴望立刻得到稱讚」、「渴望知道自己獲得好評」的人，就好像在說：「我大多數就是這樣，今後不會繼續成長了。」他們渴望的背後隱藏著驕矜自誇。理由在於，認為自己今後還會更加成長的人，往往會覺得現在的自己還不夠好、還不值得稱讚。而且，沒有任何行為比頻頻告訴他人「我被稱讚了」更惹人厭煩。回想看看你在現實世界裡，如果遇到一個老是炫耀自己得到稱讚或好評的人，心裡會有什麼感想，你就應該就能理解我想說的話。同理，老愛炫耀人脈的人也一樣。


    一旦你開始把別人的稱讚放在心上，你就不會再進步了。我的建議是，別把那些讚美當一回事，好好珍惜那些丟臉難堪、被瞧不起的經驗，專心去面對自己想挑戰的事情，這樣子你才能夠更強大。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '只要你能夠做到這件事，總有一天一定會有人在你背後發自內心地表讚你。


    # 困境中做出的決定，將影響你接下來的十年


    現在全球受到冠肺炎疫情的影響。閱讀本書的你或許也是其中一人，請別慌張，先讓自已冷靜下來。危急時刻做出的判斷，不分好壞，將會影響你往後的十年。


    我十幾歲時不學好，跟著一群不良少年鬧事遭到逮捕，曾經兩次進入少年觀護所。二十幾歲時，我害得公司倒閉，負債總金額高達三億日圓（約新台幣八千一百萬元），只好自行宣告破產。到了三十幾歲，我的財產又被國稅局查封。光是讀到這裡，各位可能會覺得我這個人真是無可救藥，實在不是一個可以寫書的正派人士。這些失敗經驗對我來說，全都是足以影響我命運的重大危機。幸好我很堅強，不曾想過尋死，否則這些經歷早就足以讓我自殺好幾回。我現在回顧那些經歷，想到的是，因為我在面對危機時


    5廠商或業主透過推廣者或合作夥伴（如意見領袖、網紅等）來推展銷售自家產品，並利用連結的方式追蹤，最後依照轉換的訂單量，讓推廣者或合作夥伴可以賺取一定比例的佣金。'
