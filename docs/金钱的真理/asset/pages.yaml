- pgno: 324
  md: '現在，與妻子小孩共度的每一個瞬間，都讓我感到幸福。


    守護無可取代的重要家人，跟喜歡的人全力以赴工作，只選擇自己想做的事，這樣的生活方式，我想就是讓金錢喜愛你的重點。


    當然，你還需要擁有名為淨資產的經濟水庫；這次的新冠肺炎疫情使得全人類都認清了這個事實，沒人料到自已的事業會突然停擺。


    好了，寫到最後，我想說的是：要常保自信。你是否相信自己可以存活到最後？我對自己有著過人的自信，我認為：「無論再艱難的困境，我都能夠突破！」所有危機我都憑著一己之力跨越過來了，而且還把危機當成心靈的糧食，轉化為正面的力量。


    危機就是轉機，我打從心底這麼認為。因為我對自己有自信，相信接下來不管發生任何事都能跨越。累積經驗就能培養出這種自信；沒有經驗背書，所有自信都只是自我感覺良好罷了，一且遇上危機，自信立刻就會瓦解。


    累積經驗建立自信沒有捷徑可走，即使你聽過別人的經驗也沒用。正因如此，我才會希望你挑戰自我，累積許多成功與失敗的寶貴經驗。


    成功與失敗只有一線之隔。最後能否成功，端看你是否擁有堅韌的心智，徹底相信自己一定可以跨越所有困難。衷心期待讀完這本書的你成為真正的成功者。'
