    現在回頭看看，我當時是被那些人當成「提款卡」了。對他們來說，我根本就是散財童子。


    我沉淪在六木木夜晚的歡樂、欲望、炫富之中，也因此引來壞人。詐騙、非法吸金集團、仙人跳……各種怪咖我都遇過。


