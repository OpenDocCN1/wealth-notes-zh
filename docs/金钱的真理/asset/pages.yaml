  md: '我想，每個人至少都會經歷過一次貧困的生活，差別只是早晚問題。那是一條必經之路。回顧全球知名富豪的過往，那些成功人士一定曾有過為錢所苦、缺錢的時期，只是有的人選擇不說出來罷了。


