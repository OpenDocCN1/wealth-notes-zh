  md: '我十分反對未經規畫的節省，不過該刪減的支出就要確實刪減，做好「連一毛錢都不浪費」的心理準備。


    我認為首先必須削減的最大筆支出就是房貸。


    國家對於買房的人會提供房貸減稅等優惠政策，因為貸款利息低，即使房貸很高，民衆也同樣趨之若鶩。而且大多數人都覺得貸款買房比付錢租房子更合理。


    一般也經常聽到「租房子是付錢給房東，繳貸款買房子就是自己的」這種說法。許多人就是因為這種迷思，毫不猶豫地貸款買房。


    但是，如果問我的話，我會說貸款買房是絕對不能做的事情之一。


    房貸的貸款金額高，還款時間長，儘管利息低，但是從結果來看，付出的利息也是一大筆錢。想當然耳，銀行想賺的就是利息，而你就成了這種制度下的肥羊。


    再說，房子的資產價值最高峰就是剛蓋好的時候，之後會隨著屋齡愈高逐漸下跌。如果是地段絕佳的市中心摩天大樓自然就另當別論，否則屋齡在買賣估價時確實會拉低價格。


    那些努力存到頭期款、以貸款方式買下三千萬日圓（約新台幣八百一十萬元）房子的人或許會以為：「這樣一來我的固定資產就有三千萬日圓了。」但之後請人來估價'
