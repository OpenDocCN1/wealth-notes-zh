- pgno: 76
  md: '炎疫情，我的生活和經濟狀況也沒有受到影響。


    再加上我原本就沒有上司、客戶、贊助商、股東等利害關係人，老實說也無從受到疫情影響。另一方面也是因為我早在整體經濟環境良好的時候就腳踏實地賺錢，準備好一輩子所需的花費了。


    若問我為什麼要做這些準備，那是因為我選擇了面對不安而非逃避，我花了很長的時間擬定具體對策，來對付隱約存在的不安。


    能夠從這次疫情勉強存活下來的人，如果仍然像從前那樣無視對錢的不安，我相信「下次死的人就是你了」。眼前最重要的就是，快趁這次機會，好好補強你因為疫情而凸顯出來的弱點，為將來做好準備。如果你想成為有錢人，此刻應該更能明白「不立刻行動的話，所有的好點子終將只是紙上談兵」。


    # 「經營之神」松下幸之助的「水庫式經營」


    想要成為有錢人，你必須先知道「何謂金錢」。錢為什麼很重要呢？


    我先從專業的角度來說明：錢（貨幣）有三種功能，第一是「價值儲藏」，第二是'
  merge: -1
  img_proc: true
- pgno: 77
  md: '「交易媒介」，第三是「價值標準」。


    這三種功能之中，各位印象最深刻的想必是第三種「價值標準」。因為錢經常用來表示物品或服務的價格。


    第二個功能「交易媒介」，是指讓全球供需能夠順暢流通。舉個例子，我小時候祖父母在田裡種粟子，拿去市場賣掉換錢，再用賣粟子得到的錢買米。假如這個過程沒有錢參與，他們就必須找到願意接受粟子換米的生產者，看對方是否願意交換。這個過程相當辛苦，需要付出很大的勞力。但是如果利用錢的交易媒介功能，祖父母先去市場用粟子換錢，再來就可以自由使用這筆錢輕鬆換到米。以結果來說，錢成了粟子和米交換的媒介，促成了物品的流通。


    這兩個功能固然非常重要，但我認為錢更重要的功能是第一個「價值儲藏」。


    為了讓各位徹底了解這項功能，我引用距今超過半個世紀，也就是一九六五年，人稱「經營之神」的松下幸之助的演說內容。


    當時日本的大型企業一家接著一家倒閉，證券公司的結算也是一連串的赤字，「昭和四十年經濟蕭條」的情況相當嚴重。經濟蕭條的原因在於，日本企業從戰後起有很長一段時間都是貸款經營。而長年貸款的賒帳問題，在前一年（一九六四年，即昭和三'
  merge: -1
  img_proc: true
- pgno: 78
  md: '九年）舉行的東京奧運結束之後一口氣爆發開來。


    當時，松下幸之助以「水庫式經營」為題發表了演說。


    我按照自己的理解摘要之後，整理成以下的內容：


    「現在已不是戰後的非常時期，是可以從容穩定經營的時候。不能因為景氣稍有好轉就隨波逐流，必須事先備妥因應景氣轉壞時的資金。就像水庫儲水，再配合需要慢放水一樣，必須以穩定的經營為目標。''


    水庫截斷河水，把水儲存下來，就能夠避免季節或天候的影響，經常提供一定的數量。假如沒有事先儲水，遇到久久不下雨，河川的水量澀滅，就很難確保民生用水充足，也無法種植稻米蔬菜。」


    在過去，企業花錢如流水，不懂得存錢，因此負債累累，只顧著追求眼前利益，不看長遠價值。因此松下幸之助推廣水庫式經營，追求穩定發展，開創永續未來。


    水庫儲水，就像因應災害或嚴重歉收的穀倉庫存公糧一樣。


    這絕不是什麼老掉牙的警世寓言。先賢們早早就告訴我們非常重要的真理。事實上日本現在的大型企業，仍依舊著松下幸之助的水庫式經營。


    就是電視新聞等經常提到的「留存收益」。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '留存收益在會計上稱為保留盈餘（retained earnings），簡言之就是「企業的存款預備金」。有的是現金，有的則轉換成不動產等形式的資產。


    近年來，日本企業儲備的留存收益持續刷新紀錄，二〇一八年度已經超過四百六十兆日圓（約新台幣一百二十五兆元），比歐美企業高出許多。日本的對外資產淨額（Net External
    Assets，又稱對外淨資產）也是世界第一。對外資產淨額是對外資產與對外負債兩相互抵之後的數字，也就是扣除該國向其他國家借貸的負債之後、剩下的資產大於負債的淨資產。


    日本企業重視穩定經營所做的預防準備，就是如此高水準。沒想到二〇二〇年的新冠肺炎疫情，給了他們發揮本事的機會。在這種情況下，原本表現平平、沒有成長的日本，很有可能比世界其他國家更具優勢。


    但另一方面，勞工的薪資卻停滯不前，近十年來的漲幅很小，只停留在5%。因此也經常聽到「公司既然有賺錢，就應該回饋給員工」的批評聲浪。


    但如果考慮到「今後要繼續活下去」，我認為企業增加存款預備金很重要。事前準備好一筆錢，遇到突發狀況才能夠發揮作用。因為假使企業破產倒閉，在那裡工作的員工就連半毛錢都沒得領了。'
