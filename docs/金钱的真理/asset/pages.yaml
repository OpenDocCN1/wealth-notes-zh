  md: '我認為經過此次新冠肺炎疫情，今後會演變成個人活躍的時代。當全世界為了緩和疫情大流行而必須重視衛生時，自然會發現公司要維持多人集體上下班的龐大組織有多困難。其中的代表例子就是，日本最具代表性的科技產業集團
    GMO Internet, Inc. 首先早要求員工改成在家工作。


    今後，遠端工作、線上教育、遠距醫療、在家消費的需求將會愈來愈多，有能力向大眾發聲的個人在這種環境下將會具有優勢。全球目前正在急速提升衛生水準。這項改變使人們重新審視與非特定多數人的近距離接觸，而我之前一直在提倡的「小我時代」終於正式登場，連帶也改變了金錢的流向。


    今後的關鍵是「窄而深的牢固關係」。在大眾澡堂、酒館等公共場合與初見面的人一見如故、相處融洽，將成為舊時代的過時行為。我只是沒想到，自己早在十年前就預測會出現的社會，居然因為新冠肺炎疫情提早實現了。


    錢只會往最賺錢的地方移動。前文也提過，金錢的總量不會改變，當某一方的錢減少，代表其他人賺錢的機會來了。遭遇危機時只知道崩潰抱怨，情況只會愈來愈壞。重要的是改變想法，無論遭遇任何危機，都要質疑這是不是另一個機會。


    此時最重要的是分辨哪艘船會沉沒；假如你判斷自己正在那條船上，請立刻下船。'
