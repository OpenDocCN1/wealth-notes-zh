  md: "# | 本書作者 |\n\n# 與澤翼\n\n![](img/e54da6402e644e0f166460ffacd9d1c4_328_0.png)\n\
    \n日本知名投資家、企業家。一九八二年十一月十一日出生，埼玉縣人。曾為日本暴走族，卻突然發憤考上早稻田大學。二〇〇七年三月畢業於早稻田大學社會系。他在就讀早大時，曾經兩度創業並因此受到媒體矚目，被稱為「秒賺一億的男人」。靠股票投資贏得香車、美人、直升機。隨後又經歷破產，卻用十萬日幣（約新台幣兩萬八千元）再度逆轉勝。多次谷底翻身的經驗讓他聲名大噪。\n\
    \n二〇一四年移居新加坡，二〇一六年移居迪拜。目前以個人投資家的身分活躍於股票、不動產、外匯、虛擬貨幣、公司債、保險、信託等領域。在馬來西亞、菲律賓、泰國、阿拉伯聯合大公國、日本等五個國家擁有四十戶高級不動產，租金收入頗豐。買房全都是現金一次付清購買，不靠貸款。淨資產總計約七十億日圓（約新台幣十八億九千萬元）。\n\
