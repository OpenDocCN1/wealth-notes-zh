  md: '在不確定的時代，今後將發生什麼事、事情的規模與持續的時間完全無法事先預測。我舉個例子，今年（二〇二〇年）初美國與伊朗情勢緊張，戰爭一觸即發，沒想到全球股市動盪幾天後就恢復原狀。另一方面，新冠肺炎疫情卻造成股市大跌，跌幅超過專業人士的預期。


    日本泡沫經濟瓦解、三一東日本大地震、雷曼危機¹¹，再加上這次的疫情，沒人知道這類重大危機何時爆發。雷曼危機等級的金融危機如果再次發生，將造成公司倒閉、自由接案者的工作銳減、資產的市價暴跌等，許多人的經濟都會遭遇嚴重打擊，而且這種情況有可能發生無數次。


    此外，一般人也經常面臨重大疾病、傷亡、事故等風險。


    以疾病為例，近來國人罹患癌症的比例持續增加，日本人每兩人就有一人罹癌，每三人就有一人死於癌症。這個數字在先進國家中也是相當驚人，日本民眾死於癌症的數比美國高出一·六倍。


    但是，只要你事先存夠足以應付危機的錢，就能在世界最高水準的美國先進醫療機構接受昂貴的治療。只要有充分的存款，基本上就能應付所有突如其來的不幸，也能將危機化為轉機，在動盪的年代活下來。'
