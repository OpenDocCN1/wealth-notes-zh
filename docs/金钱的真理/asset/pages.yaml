- pgno: 252
  md: '# 能因小成果而喜悅的人，獲勝機率更高


    綠，只會成天唉聲嘆氣，就會離成功愈來愈遠。


    別人家的草坪長什麼樣子都與你無關。


    因為隔壁億萬富翁的經歷，在你過往的人生與生活中，在你累積經驗的過程中，不必然會出現的選項。


    最重要的是你現在正在做的事，也就是你一直培養到現在的幼苗。


    當你付出努力卻遲遲看不到結果，確實會對自己做的事感到厭煩。我能夠理解你羨慕別人的心情。無法想像自己成功的樣子，也是一種痛苦吧。


    但是，光是嚮往別人成功的「結論」，無法使你成功。


    你只能憑感覺摸索自己現在正在做的事，找出勝利機會，這樣才有出路。無法繼續努力只是因為你還沒看到希望之光。看不到希望之光，使你誤以為轉換跑道就能夠看到光。


    當你遇到了這樣的瓶頸時，請對自己小小成果更有信心，為自己的進步而開心。'
  merge: -1
  img_proc: true
- pgno: 253
  md: '即使那樣的成果在別人眼裡看來「沒什麼了不起」，但成果就是成果。例如：網站的面瀏覽量（Page View）比昨天多了一頁、昨天還不會用的功能今天會用了……光是這樣也很值得高興，這就是希望之光。


    無法樂在其中，就無法獲得成功。我也曾埋頭默默苦幹過，你問我那些過程不難受嗎？其實我反而覺得很愉快。就像現在寫這本書也是，我非常享受寫書的過程。我認為沒有任何成功法則，能夠勝過「樂在其中」。


    另外，即使你現在正在做的事在他人眼中多麼過時、不值得一提，只要你覺得自己做得很愉快，就能夠讓它在現代復活，重新受到矚目。讓過時的事物在現代復活，也不失為一種成功的方法。請務必對自己更有自信一點。


    此時最重要的就是你的視線角度。


    視線不能向下，但太高也不好。太過樂觀的話，沒有結果時你會大失所望；即使最後的發展符合預期，你仍會感到失望。


    最理想的視線角度是，朝著斜上方二十至三十度角仰望，同時讓視線以四十五至六十度角俯視地面。以上方為目標，根據實際的成績往上修正你的視線角度。


    這麼一來，你就能夠大幅提高對成功的信心。'
  merge: -1
  img_proc: true
- pgno: 254
  md: '斜上方三十度角看到的光或許很微弱，但是有光射進來就表示那個方向確實存在著希望，此時你就可以朝著光的方向努力前進。


    我在前面也說過，那股發自內心的確信，來自不斷累積的小小成功；如果沒有前期的兢兢業業，自然不可能看到光。


    有時我也會懷疑自己「我是不是搞錯了？˜但即使這樣也無妨。確信和不安在一天之內不停地反覆著，這樣的心理狀態才是成功最真實的現象。微光會慢慢增強，最後在前方等待著你的，就是只屬於你的成功。'
