  md: '出租大樓，至少你能擁有隨時搬家的自由，或是乾脆搬回父母家，省下房貸的錢，這么一來應該能夠大幅改善現金流。只要能夠消除鉅額的房貸負債，就能夠解除心理的負擔，也更容易維持精神狀態的健全。


