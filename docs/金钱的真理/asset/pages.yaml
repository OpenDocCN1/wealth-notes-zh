  md: '相反地，假如你找到了接下來將會航向繁榮與興盛的船隻，就要鼓起勇氣登船。


    各位記住這一點之後，我們再來回頭看看金融市場。二〇一六年的美國總統大選最後確定由川普獲勝時，金融市場把這位行事出人意表的新總統定義為「川普風險」。理由是川普的決策難以預測，也不知道他會說出哪些話。


    然而，等川普實際繼任總統之後，金融市場只有一開始急速下跌，很快地，包括日經指數在內的全球股市，就因為對他的經濟政策充滿期待而急速上揚。其中，美國最具代表性的道瓊工業平均指數（道瓊指數）甚至出現歷史最高點的紀錄。這個現象稱為「川普交易」。從結果來看，實際出現的趨勢是大盤走高，可是不久之前眾人對盤勢原本還是悲觀看待。也就是說，當時的變化成為一個機會。我也在那段時期增資對股票和虛擬貨幣的投資，所以這次的暴跌雖然也有損失，整體來說我的投資仍是賺錢的。


    # 掌握金錢流動趨勢，晉身新富階級


