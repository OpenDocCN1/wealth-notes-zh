- pgno: 114
  md: '這也是一種典型的「優越幻想」。這種人不承認自己的錯誤，始終認為自己過去的決定「不會有錯」，一意孤行讓問題更加惡化。


    我在序章中也提過，人一旦產生自己比別人優越的錯覺，就很難成為有錢人；因為這種人無法做到「停損」，只會浪費白白時間在沒有效益的事情上。


    **想要成為有錢人，一定會遇到必須忍痛推翻自己過去決定的時刻**。但過去的决定，不過是當時的自己所能做的、自認最好的選擇。


    每個人都會犯錯，這不是什麼問題，問題在於「犯錯卻不承認」。這會害你多走很多冤枉路，遲遲無法前進，浪費了寶貴的時間。


    # 即使會虧損，也要立刻處理掉房貸、車貸


    「停損」原本是股票投資術語，意思是「手中持有的股票股價下跌，現在賣掉雖然會虧損，但為了避免更大的損失，所以在損失不太大之前賣掉」。


    停損在人生各種場合中絕對必要，例如：退出看不到成長的新創事業、斬斷浪費時間與金錢的人際關係等。原因在於，就連天才也無法保證自己的每個決定都正確，更何'
