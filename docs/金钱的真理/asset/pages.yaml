  md: '一個時代的結束。在結束的進程中，有的公司、個人、國家會消失。這世上的一切都不能保證永遠存在、萬代繁榮，然而正是舊一代的毀滅催生了一代的誕生。在既有的權利與過去的成功者逐漸凋零的同時，也孕育著下一個時代的新生命。


    本書寫的是我對金錢與人生的「真心話」。獻給決心成為新一代英雄的所有人。


