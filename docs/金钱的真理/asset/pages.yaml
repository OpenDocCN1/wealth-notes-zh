  md: '# 愈大的公司，愈會把消費者當成肥羊


    話說回來，你是否覺得自己是「不會上當」的那群人呢？假如你的回答是 YES，可得要小心了。自以為聰明的人往往更容易上當受騙。也就是說，自認消息靈通的人一旦遇到等級更高的壓榨者，完全會被對方吃得死死的。


    舉例來說，酒店女公關是取悅男人賺錢的職業。無論古今中外，只要從事這份工作，每個女公關都希望男客人砸錢在自己身上。當然，她們不會在客人面前表露出來，而是滿嘴甜言蜜語，但她們的本質就是讓男人墜入溫柔鄉，把錢掏出來。而擅長從客人身上撈到錢的女公關們，再把錢花在愛馬仕柏金包，或是整形、美容保養、光顧牛郎店……成為他人的肥羊。


    從整體經濟來看，把男客人當成肥羊宰的女公關，對其他行業來說也是肥羊。女公關成為男公關的肥羊，詐騙集團成為黑道的肥羊，菁英階層成為其他菁英集團的肥羊，都是基於同樣的道理。這樣的連鎖效應不斷發生，以為自己逮到肥羊的人，很容易在其他地方成為別人的肥羊；以為自己很聰明的人，往往更容易上當受騙。把別人當肥羊宰的人，最後也終將成為待宰的肥羊。以上這些都是我親身經歷過的陷阱。'
  merge: -1
  img_proc: true
- pgno: 124
  md: '尤其是相信大企業招牌或知名大學光環的人，格外容易上當；只因爲是「大企業」的產品就盲目相信、毫不懷疑的人，往往第一個就被當成肥羊。


    自從離開日本之後，我更能夠從不同面向來觀察日本及全世界，也因此發現愈大的企業愈會把顧客當肥羊。根據我的經驗，民眾往往會輕易相信「國際知名銀行」、「歷史悠久業界第一的公司」等光環，而這些人正是最好騙的對象。


    投資信託、保險之類的契約內容，對投資人或被保險人來說肯定不友善，所以那些公司才能賺好賺飽屹立不搖。這些公司必須把成本、虧損轉嫁到其他人身上，收支才能夠打平，這就是資本主義。大公司推出的金融商品一開始就經過精算，設計成多數人無


    法獲利的結構。做生意也一樣，能讓大多數創業者賺錢的生意，根本就不存在。


    能成爲歷史悠久且規模龐大的企業，代表他們給客戶的契約，絕對是對企業本身最有利的设计和這一點各位務必要記住。大型企業容易贏得信任，因此最危險。運用資產


    時一定要親力親爲，把錢交給別人處理那一刻，你就被當成肥羊了。'
