  md: '# 向騙子學習「供需理論」


    的一大筆錢買當時的美股，我現在應該早就套牢兼借台高歌了。假如那些債券每天都有利息產生，我應該會精神崩潰吧。從這個角度來說，再沒有什麼東西比知名大企業推銷的金融商品與投資觀念更危險的了。


    由此可知，我們要記住「值得信賴的企業根本就不存在」，這樣才能夠守住財富、增加財富。當然世界上還是有正派的公司。正因為知道這一點，所以我才敢這麼說。信任就是一種盲目的依賴，依賴不會讓你的錢變多。


    因此，在此我不去分析大型企業或知名企業，反而想跟大家談談一般視為禁忌話題的詐欺和違法商業行為。


    首先看看最近流行的違法轉賣證券（黃牛）。他們購入民眾需要的商品，加上不合理的利潤之後賣出，但從另一個角度來看，也可說他們相當具有商業頭腦。


    他們轉賣的價格取決於供需之間的平衡。這種商業模式的原理是，想要某樣東西的人非常多，但賣的人卻極少的話，賣家就能賺大錢。舉例來說，像風等傑尼斯偶像團體'
  merge: -1
  img_proc: true
- pgno: 241
  md: '的演唱會門票，從過去揭露的案例來看，價格可以賣到十五倍。因此考慮供需時，別忘了「獨家提供」這個角度。因為一般來說，多數商品都會因為競爭對手太多，導致無利可圖。


    # 供給可以獨占嗎？


    我們當然應該避免違法轉賣這類觸法的行為。這不只是倫理道德的問題，刑事罰責與社會制裁也很重；比起賺到的利潤，你更有可能損失時間，還要面臨賠償問題。


    但是，從原始的商業原理思考的話，有人想用某個價格賣商品，也有人想用那個價格買商品，既然雙方達成共識，只要過程中沒有威脅、詐欺等行為，應該都可以自由買賣。問題是轉賣在日本是違法的，在某些國家卻是合法的。美國就是其中之一，網絡上有許多轉賣票券的服務，從音樂表演到體育賽事，所有票券皆可販售。


    在日本，票券（遊樂園門票與新幹線車票、低於定價的轉賣除外）、酒類、廠商警告禁止轉售的商品、中古二手貨，這四類商品禁止轉賣。其中，中古二手商品必須有執照才能買賣，一般民眾不可購買二手商品轉賣賺差價，不過可以轉賣自用的二手貨。


    36'
