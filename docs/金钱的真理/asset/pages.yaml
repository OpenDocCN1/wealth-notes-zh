  md: '舉例來說，假設有一家即將上市的新興企業，它的創辦人以每股一萬日圓的價格取得自家公司一千股股票當中的六○%（持有股數六百股，市價六百萬日圓）。等到該企業上市之後，把公開募股價格訂為每股一千万日圓（二十倍）的話，創辦人就能夠獲得五十九億九千四百万日圓的未實現利益（市價六十億日圓）。公開募股的成交價總金額為一百億日圓。考量到企業的成長潛力，假如是受到高度矚目的IPO（首次公開募股），價值通常會比預估的更高，創辦人分到的獲利也將很可觀；光是實現其中極小部分的利益，也有幾億日圓。


    這個例子可不是我在畫大餅，我只是把現在每個月都會實際發生的IPO事例簡化寫出來而已。公司在實際上市時會進行股票分割，把一股分成一千股之類的，因此每股的價格不是一千萬日圓，而是一萬日圓；而創辦人的持股數量就會變成一千倍，但持股仍占市價總額一百億日圓當中的六○%，也就是六十億日圓，這個結果還是不變。實際上就是有這種情況。我再舉個極端的例子。臉書創辦人馬克·祖克柏（Mark
    Zuckerberg）在六公司IPO之後，他目前擁有市值超過六兆日圓的資產。


    另一方面，假設這家新興企業進行股票分割後的股價是一萬日圓，在股票公開發行時，你抽中購買IPO的資格，而且很幸運地買進該公司六百股的股票。之後你等股價'
  merge: -1
  img_proc: true
- pgno: 301
  md: '漲成兩萬日圓時賣掉，此時的獲利只有六百萬日圓（約新台幣一百六十二萬元）。雖然你同樣投資六百萬日圓在高風險金融商品上，但與企業創辦人的獲利相比，明顯地相形見絀。


    當然，創業者往往是抱持著背水一戰的心態，辭掉上班族的穩定工作後創業；過程中可能還過貸款的連帶保證人，準備好的資本金有很長一段時間不能動用。他們經常把雞蛋全放在一個籃子裡，將銀彈全都用來集中投資一家公司。


    因此，前面提到的新興企業創辦人，與後來那位能夠自由投資贖回的個人投資者，兩人所背負的風險完全不能相提並論。


    我在此想強調的是，儘管如此，兩人得到的回報差異也未免太大。也就是說，企業創辦人比較靠近財富的源頭。


    # 持續尋找財富的源頭


    另外講個例子，我們來談談買地。土地原本不屬於任何人，自然存在某地，完全零成本。假如能夠賣掉零成本的土地賺錢，你覺得如何？將會帶來相當龐大的利潤吧。'
  merge: -1
  img_proc: true
- pgno: 302
  md: '不動產投資都是由我親自操盤，因此我會定期查看各國上市不動產開發業者的決算書。我注意到不同國家和不同開發商的毛利率相差甚遠，因此得知毛利的差異主要是因為土地取得的成本不同。


    舉例來說，杜拜原本是一整片沙漠，而且是君主制國家，土地是屬於皇室的东西。我注意到他們官方民間合作經營的企業，用幾乎免費的方式從皇室手上取得土地。杜拜的不動產品質很好，價格與世界各主要都市相比遠遠便宜許多，這對投資客來說是非常有利的交易。也就是說，因為當地的土地取得用不著花費大把成本，所以能夠以比其他國家更便宜的單價購得高品質的不動產。


    但是，我這時突然想到，最靠近財富源頭的不是我，而是把免錢土地改造後賣掉的杜拜不動產開發商。明白這個事實之後，我迅速養成了尋找財富源頭的習慣。


    我在這一段想說的重點是：既然錢在全世界到處流動，你我雖然能夠想到幾個方法介入錢的流動，但介入的方法也有祕訣。在你我賺錢時，我們的背後通常還有賺更多錢的人存在。如果你沒搞懂這個道理，永遠會被當成肥羊宰宰。也就是說，你必須取得靠近財富源頭的位置，否則無法期待財富能有爆增的一天。'
  merge: -1
  img_proc: true
- pgno: 303
  md: '# 來自朋友的案子百分之百拒絕


    我在前面的例子中提過，假設你有一筆五十萬日圓的閒錢，如果你決定拿來開發跟垃圾差不多的商品，或是對錯誤的客群打廣告，這五十萬日圓就不會變成一百萬日圓回到你手上，而是會死掉。不管是錢或孩子，都必須用正確的方式送去歷練。把它或他放在危險的場所，不是愛的表現。


    提到危險的場所，朋友的介紹往往會讓你降低防備，因此格外需要注意。近年來，虛擬貨幣問世，民眾接二連三把錢投入號稱「新虛擬貨幣」的新興垃圾幣（虛擬貨幣中，市場價格最低、投機性最低者）。這麼做的起因似乎是身邊親朋好友的唆使，因為聽到好友大聊賺錢的夢想，所以才跟著一起跳下去。在那個當下，你把對這位朋友的信任轉移到虛擬貨幣上頭。問題是，根據我過去的經驗，朋友的邀約從來不曾讓我賺錢；即使對方在本業工作上事業有成，即使對方是有錢的前輩或有實際業績的朋友都是如此。


    另外，除了新興的虛擬貨幣之外，還有健康方面的多層次傳銷、新興宗教事業、未上市股票的投资……類似的情況經常發生。這時如果是不認識的陌生人上門介紹，你就'
  merge: -1
  img_proc: true
- pgno: 304
  md: '會拒絕；但如果是好友推薦，你就會喪失拒絕的判斷力。同樣地，只要是名人介紹，民眾往往也會盲目相信。


    **推結論來說，最親近你的人介紹來的案子，毫無例外都會讓你變肥羊。把那些東西推薦給你的朋友本身也多半是受害者。你必須百分百拒絕，否則大家都跟著一起受騙。**


    問題是，你會對身邊親友都在投資或接觸的事物感到好奇，這是不爭的事實。你必須格外小心，避免鬆懈警戒。最重要的是，即使對方是朋友，對於自己以外其他人的事情，你都不該有太強的好奇心。你只需要解決自己面臨的問題即可。


    # 淘汰那些沒有通過時間考驗的東西


    我在這裡介紹一個可以避免你成為肥羊的強力試金石，就是：想想你打算投資的對象，是否經歷過時間的考驗？只要想想這一點，你就能夠守住你的錢。


    我舉個例子。過去一講到部落客、Youtuber、短線交易者等，世人只會認為這些都不是正規的工作。以前一說自己的工作是「部落客」，就會被誤以爲是家裡蹲的無業遊民。'
  merge: -1
  img_proc: true
- pgno: 305
  md: '考慮到這類工作不屬於任何團體，收入也不穩定，會受到這樣的批評也是理所當然的。但是，現在情況又是如何呢？短線交易者、部落客、YouTuber 經歷過多年來「時間的考驗」，現在已經逐漸受到認同，成了一項正經的職業。


    我在這裡想說的是，「存活很久的東西，比較容易評估」。相反地，沒有經過時間考驗的東西，往往多半襤假。假貨無法通過時間的考驗。因此假貨們會在有限的壽命之內，盡量多抓住更多肥羊。所以請各位這樣做：沒有經過時間考驗的東西請立刻排除！


    # 這是避開假貨最簡單的原則。


    只要遵守這項原則，你至少不會投資新興垃圾幣，也不會受到名人或好友的煽動而賠錢在可疑的投資上。


    一個東西能夠長久存在，必然有一定的道理，也多半證明這個東西不是假貨。我當然不是說當你看到對方歷史悠久有傳統，就可以盲目追隨，這一點我在前面談知名投資銀行的金融商品時也說過。你不應該盲目相信傳統和歷史，但這至少能避免你被垃圾幣這類東西欺騙。'
