- pgno: 56
  md: '懂得認真反省苦思，才會有現在的我。我深深感謝當時的那些失敗經驗，而在困境中所做的決定，也大大翻轉了我之後的命運。


    以這次新冠肺炎疫情的影響為例，有些人或許在投資方面損失慘重，有些人經營的公司被迫倒閉，有些人遭到公司解雇……諸如此類，讀者之中可能也有不少人直接或間接蒙受其害。但是肺炎疫情帶來的不全是否面影響，現今正是我們改變的大好機會；平時沒有存款如今陷入困境的人，就會知道要改掉老是亂買東西的壞習慣、不儲蓄的觀念，重新反省自己原本的花錢方式。


    總是把所有財產都拿去投資的人，這時才注意到應該準備一筆動員資金，在市場行情大跌的時候，趁著價低時買進。使用槓桿（舉債投資等行為）投資的人，或許會因為保證金被強制平倉，而在不由自主的情況下被迫出場，沒有時間等到價位回升。這個經驗會提醒你，自己是在玩的金錢遊戲，局勢對自己來說有多不利。如果是融資做生意的人，即使沒有營業額仍必須還錢，應該備感壓力，失去做生意的欲望。以上不過是所有人在過去及未來會面臨的悲劇之一。但悲劇並非只有壞處，悲劇之後往往會出現大幅度成長。


    沉溺在過去的回憶中懊悔不已，無法改變過去；只知道後悔，也無法改變未來；而'
  merge: -1
  img_proc: true
- pgno: 57
  md: 不作為只會讓情況更加惡化。所以我們首先必須正視問題，並接受已發生的事情無法改變的現實。然後，主動為悲劇打上休止符，先承認自己過去的錯誤，再好好思考今後面對同樣失敗時該如何解決問題，盡可能告訴周遭的人你目前的實際狀態，與他們約定你今後打算怎麼做。這一點很重要。告訴周遭的人，用意在於請他們監督自己，你也能從他們那裡得到一定程度的諒解與協助。
