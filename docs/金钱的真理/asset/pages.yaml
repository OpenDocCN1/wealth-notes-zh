  md: '自己的需要聯絡我，我就必須給他回應，這樣的關係真的很麻煩。而且明明是對方主動聯絡，當他得不到自己期待的答案時就會已讀不回，實在很自私。這樣的交流不僅浪費時間，也會帶來壓力。只要能迴避這種情況，就能專注在自己的事情上。


    一旦少用 LINE，你就會深刻明白之前自己把時間用在這種交流上是多麼沒意義。我習慣使用封鎖功能，這個方法可能不適合喜歡聊天的人，但說句老實話，假如你想要達成的成就難度很高，把時間浪費在聊天，你就會離成功之路愈來愈遠。


    # 與港區女交往會增加無謂的開銷


