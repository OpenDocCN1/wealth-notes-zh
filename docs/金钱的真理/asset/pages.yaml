- pgno: 64
  md: '在此為大家介紹兩個我做過的斷捨離例子。


    首先，為了往後的人生，我徹底反對建立組織、團隊。我從十幾歲起就熱愛組織；大學創業時建立了團隊，後來二度創業時也組了團隊。也就是說，在人生所有關鍵場合，我都是建立組織，組成團隊，結合眾人之力行動。但是離開日本來到國外這六年之間，我不曾創建任何團隊。也就是說，我徹底進行了斷捨離，割捨了團隊。


    我當然明白現在能夠讓世界動起來的仍是企業，也就是團隊。能夠提供高價值的毫無疑問也是團隊。但是，我第一個就先質疑這種常識。單打獨鬥還是打團體戰？適合自己的是哪一種模式？個人難道真的就無法提供高價值嗎？


    我過去雖然一直擁有團隊，但我本來就是不與任何人商量，憑著自己的直覺快速行動，從失敗中學習成長的獨裁者。速戰速決並立刻實踐是我的行事風格。我注意到以組織或團隊形式迎戰的話，無法發揮自己的長處。簡言之就是，我不想聽別人抱怨我的所作爲。當然，所有責任由我負。以最快的速度計畫、執行、反省，這是我的強項。


    基於這個確信，我決定只帶現在妻子離開日本。沒有告訴任何認識的人，沒有與朋友討論，也沒有找人幫忙。當時割捨掉「組織」的決定，如今帶來最理想的結果。也就是說，我六年前做出的斷捨離，至今仍影響著我的人生。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '此外，關於「少了團隊，還能夠提供高價值嗎？」這個疑問，像這樣認真寫書告訴讀者一些資訊，也是一種價值提供。一個人能夠做的事情或許有限，但在有限範圍內追求最高品質，就有可能提供高價值。直到現在我仍這麼認為。


    我做的另一個斷捨離，就是排除無極限的危險欲望。在日本時，我陷入欲望上癮的狀態。我想要喝酒讓心情變好，想要每天和許多女人玩樂，想要賺大錢再花錢如流水，想要得到權力和名聲……我忠於自己身為人類的欲望，盡已所能揮霍時間與金錢。


    但是，仔細想想。喝酒讓心情愉快的隔天，我要面對的就是身體不舒服和倦怠無力。這不是良好的生活習慣，而且什麼問題都沒有解決，只是在浪費時間和金錢。那些喝酒用掉的時間對於掌握真正的成功，有提供什麼幫助嗎？與非特定多數、連長相和名字都轉頭就忘的女人上床，真的能帶給我幸福嗎？不管賺再多錢都只覺得心靈虛空，這種對金錢的極度渴求，能讓獲得滿足嗎？想要權力和名聲，不就只是為了掩飾自卑嗎？我愈深入思考，就愈確定那些都不是我需要的東西。


    > 「你好了不起！你真厲害！大師！」旁人的諂媚有什麼意義呢？一時的歡愉後，接下來卻是揮之不去的不悅，這又有什麼價值呢？把時間用在不會往來一輩子的關係上，究竟又有多大的意義呢？'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 用錢滿足欲望，錢就成了毀掉人生的惡魔


    如果想要成為真正的有錢人，你就會領悟到這些欲望都只是毒害；短期來說有助於心情愉快，但長遠看來對資產的增加只有負面影響。


    金錢的力量強大，而且具有善惡兩面，如果你不曉得正確面對與使用錢的方式，只會「用錢滿足欲望」，金錢的負能量就會使你陷入險境。


    如同我前面提過的，錢能夠使人的欲望失控。我必須不斷地重申，人的欲望真的很可怕，沒有極限。而欲望與金錢掛鉤的後果，就是可能使你跌入地獄。


    因此最重要的第一步，就是對不必要的欲望進行斷捨離。祕訣是「知足」。我們常說「飯吃八分飽就好」，別失控吃到撐。養成習慣，隨時把八分滿當成最滿足的狀態。


    舉例來說，我在本書開頭也提過，我現在仍開著買了四年多的法拉利和勞斯萊斯。車子愈舊，我愈珍惜。過去每次出新款，我就會立刻換車，不這樣就無法滿足。我的口頭禪是「開過時車款很丟臉」。如今，我現在開舊車子就很滿足了，相當於吃飯只吃八分飽。另一方面，我在女性關係上也一樣，我不再跟其他女人聯絡。一說到自己在曼谷，或許有人會想：「你喜歡紅燈區嗎？」但那些地方我連去都沒去過。我反而是每天'
  merge: -1
  img_proc: true
- pgno: 67
  md: '都與妻子親熱。以前我渴望不同女人的肉體，不停地換女人，對上鉤的對象很快就失去興趣，欲望完全失去控制。後來和車子一樣，與妻子親熱成為我的幸福，這也是八分飽的道理。


    八分飽是最理想的幸福狀態，超過八分或低於八分都不會幸福。


    # 適當的欲望，是追求成功的動力


    飲食男女，人之大欲。有欲望不是壞事，倒不如說是心理健全、身體健康的證明。我之所以強調八分飽，是怕有人以為我提倡禁慾，所以特別提出來解釋一下。


    欲望是活著的證明，也是成功的原動力，因此我不會禁止欲望的產生。我想強調的是，別讓欲望失控。


    愛物惜物，與單一對象深入交往，適量飲酒，定期旅行，就能夠感受幸福。尊嚴、面子、自尊心不值半毛錢，也用不著希冀得到所有人的稱讚。只要身邊的人懂你，就是最理想的八分飽狀態。


    另一方面，過度缺乏欲望也不是一件好事。窮困潦倒到沒飯吃、沒有喜歡的對象因'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 金錢就像雙面刃，具有極大的魔力。


    而多年沒有性行為，或是嫌麻煩所以完全不與人往來——這一連串的「缺乏」也會妨礙你成就大事。擁有足夠的愛、食物、社交生活，都是促進你成長不可或缺的能量。因此，當這些最低限度的欲望也無法實現時，你必須開始努力得到它們。


    人生的確有些東西是必要的，除此之外應該全部捨棄，這才是正確的態度。


    我不打算透過這本書勸大家勤儉持家或禁慾。


    人們總愛把一切事物以「非善即惡」的二分法說明。對於金錢、欲望也是如此。多數人都喜歡從「非善即惡」的角度去批評賺錢、增加資產的行為。最典型的例子就是「拜金主義是惡，勤儉持家是善」。也有人認為好色不是好事。但我認為這是錯誤的觀念。勤儉持家過了頭，也會造成旁人的困擾，因而失去信任。另外，男歡女愛也是健全行為。重點在於欲望的程度，正所謂過猶不及，只要能甘於八分飽，就能擁有多元價值觀，為你的人生帶來活力。


    尤其是把金錢簡單二分成善與惡，根本一點意義也沒有。別遠離金錢。


    重要的是學會如何與錢相處。如何面對錢，才能夠發揮金錢正面的能量？——假如你想要成為有錢人，請務必深入思考這一點。'
