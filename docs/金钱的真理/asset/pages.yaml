  img_proc: true
- pgno: 308
  md: '# 錢因為「改變模樣」而變多


    錢的使用方式也是同樣的道理。錢必須使用，至於會變成良藥或毒藥，端看個人的使用方法。方法一旦出錯，你的確有可能墜落深淵。即使你已經成了有錢人，假如你做拿出整疊鈔票打人這種事，的確會下地獄。但是，謹慎思考用錢的方法，讓錢去旅行的話，你的人生就會出現戲劇性的好轉。


    另外，錢和血液一樣都會循環。血液循環不好，人類很容易死掉。同樣地，只要錢停止循環，你將面臨經濟上的死亡。因此水庫式經營很重要。但是光靠攔河堰擋水，無法使你成為有錢人，儲水就是為了之後的放水。錢在增加的過程中，勢必會離開我們身邊，變成其他商品、服務或其他資產的模樣。這個暫時的「改變模樣」就是關鍵。


    我將手上的現金與其他資產相較，發現自己持有的不動產和金融商品遠超過現金。我知道那是因為錢經歷過多次外型的變化，最後增加一兩倍回到我手上。具體來說，讓錢出去旅行的過程，使我學到很多事；如果沒有做不動產投資，我不會去看開發商的決算書；如果沒有買股票，我也不會關心股價變動的主因。


    也就是說，所謂「用錢」，就是決定自己要認真學習哪個領域。當你開始做生意，'
