- pgno: 91
  md: '以企業來打比方的話，年收入就像是「總營業額（年營收）」，而可處分所得就相當於「淨利」。同樣的道理也適用於公司。


    媒體經常介紹某經營者「年營收一百億日圓（約新臺幣二十七億元）」，但是，不管年營收有多少，假如淨利很少的話，代表這家公司根本不賺錢，這樣的經營者不能說是有錢人。


    如果年營收一百億日圓，但本期稅後淨損（赤字）高達十億日圓，那可就不妙了。意思是在社長呼吸的同時，錢正在逐漸消失。而社長為了填補赤字，必須先把個人資產投入公司。這麼一來別說成為有錢人，哪天突然宣布破產也不奇怪。


    《莊子・天運篇》有云：「勞而無功，身必有殃。」這種狀況也有可能發生在個人身上。


    假設某人年收入有一千萬日圓，可處分所得只有一百萬日圓，這個人成為有錢人的可能性就很低，必須從今天起徹底改變用錢的方式，努力大幅提升可處分所得。不管你是年收入三千萬或一億都一样。可處分所得的多寡，將是你今後能否成為真正有錢人所需的淨資產基礎。


    我再重申一次，有錢人指的是淨資產高的人，不是年收入高的人。想要徹底改變想'
