- pgno: 224
  md: '益卻長期都是虧損，這是很有名的例子。


    亞馬遜想要短期獲利很簡單，停止追求營業額的成長、放棄擴大企業規模的話，多少都會有獲利。然而，亞馬遜的創辦人兼CEO貝佐斯（Jeffry Bezos），似乎沒有打算回收前期投資的軍費，彷彿在等待自己統一天下的時刻到來。


    我想強調的就是亞馬遜採用的這個點子。短期內他們的确必須一直忍耐：早期社會大眾經常批評亞馬遜是萬年虧損企業，看不起他們，如今卻得到全世界的讚揚。也就是說，忍耐的過程中被他人瞧不起是理所當然的，甚至會讓你開始懷疑起自己。但是綜觀大局來思考的話，你就會發現他們堅持的再投資心態沒錯。


    結果，問題就是你要在哪個階段才能感到滿足。把你現在買得起的東西，和你未來買得起且更大的東西做個比較試試。只要你能夠冷靜下來，你就會明白不應該為了滿足小小的欲望殺雞取卵，你會開始重視更遠大的欲望，好滿足你今後的漫長人生。


    # 你怎麼看待杯子裡的水？


    假設你透過商業行為和反覆再投資，累積了幾千萬、幾億日圓的淨資產。要怎麼做'
