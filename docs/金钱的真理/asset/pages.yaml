  md: '# 後疫情時代｜階級翻轉的全新契機


    我認為現今讓全人類陷入困境的新冠肺炎疫症，就是對所有團體、國家、企業、個人的自然淘汰考驗。但是，存活下來的人就能成爲下一個時代的英雄嗎？沒那麼簡單。


    如果只需要存活下來，許多人和企業都能辦到，問題在於**後疫情時代全球的「貧富差距」愈發顯著**。有些人恢復較慢，有些人就此衰退一蹶不振，也有人取而代之以爲抬頭的新興勢力。此時最重要的是，以此次疫情爲契機，一定可以发掘出以往没發現的潛在需求。


    一方是逐漸凋零的昔日英雄，另一方則是逐漸抬頭的明日英雄，舊世代的英雄與新世紀英雄間的改朝換代即將臨。那麼，你現在應該做什麼呢？沒錯，**你現在的決定將大影響你接下來十年的人生**。也就是說，眼下的問題沒有那麼簡單，並非只要勉強撐過眼前的困境就好，當下正是左右你今後人生的重要時期。


    千萬不能逃避。現在正是重新審視一切的機會。一個新時代的開始，必然會面臨前


    3 連接東京站與新大阪站的新幹線路線，是日本第一條高鐵路線。'
