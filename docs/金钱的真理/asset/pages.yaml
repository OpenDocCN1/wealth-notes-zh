  md: '# 前言


    撰寫本書的當下（2020年四月），全球新冠肺炎（COVID-19）肆虐，股價大幅下跌，直逼金融海嘯時期。而且為了防止疫情擴大，飛機禁飛、活動停辦、餐飲店暫停營業，甚至連東京奧運、和杜拜世界博覽會，都被迫延期，全世界每天都在研究如何對抗病毒。這些手段激烈的預防措施造成經濟活動嚴重停滯，已經有企業因此破產倒閉。


    諸多亂象讓人感覺全球經濟彷彿即將瓦解。


    全球化經濟的前提，就是人與貨物的跨國往來。國境封鎖讓所有企業活動受到嚴格限制，因此多數企業都處於業績惡化的狀態。彷彿電影裡才會看到的末日世界突然出現在我們面前。


    +   1. 2020年夏季奧運原定2020年七月二十四日至八月九日於日本東京舉行，因新冠肺炎疫情肆虐全球，國際奧林匹克委員會與日本政府決定延期至2021年七月二十三日至八月八日。

    2. 2020年世界博覽會原定2020年十月二十日至2021年四月十日於阿拉伯聯合大公國杜拜舉行，因疫情影響，延期至2021年十月一日至2022年三月三十一日。'
  merge: -1
  img_proc: true
- pgno: 10
  md: '處於這種嚴峻的大環境下，我們能夠採取的回應有兩種：一種是看著電視或新聞，祈求狀況能夠改善並持續袖手旁觀；另一種是反過來把現在當成重新生、過去的好機會，從根柢重新審視自己的「過去」並展望「未來」。換個方式思考，危機就有可能變成轉機。


    請各位冷靜想想，人類原本就經常因為病毒或細菌等而面臨生病的風險。美國在新冠肺炎肆虐之前，就有一萬兩千人死於流感。綜觀人類的歷史，人類還經歷過天花、霍亂、肺結核、瘧疾、西班牙流感、禽流感等各式各樣的傳染病造成的瘟疫。


    除了病毒之外，還有地震、海嘯、颱風、洪水等人力不可抗的自然災害，以及空難、交通事故死亡，甚至還有高齡者開車突然失控撞進人行道或餐廳等。新冠肺炎在日本爆發之前，才發生過一般住宅區路旁的斜坡突然崩塌，掉落的土石壓死十八歲女高中的意外（二〇二〇年二月五日，發生於日本神奈川縣逗子市）。


    人只要活著，無論如何，即使什麼也不做，也不可避免要與死神為鄰。這個事實今後也不會改變。因此，死亡風險就像體內存在的壞菌，是人類天生就有的風險，就算是億萬富翁也無法讓這個風險歸零。經濟上的虧損風險也一樣，就算你自認已經爬上了頂點，也可能在意想不到的地方突然摔下來。


    14'
