  img_proc: true
- pgno: 73
  md: '早早醒悟，不該盲目依賴政府的制度。


    二〇一九年，有人提出：「退休之後要有兩千萬日圓（約新台幣五百四十萬元）才夠生活。」引發社會大眾批判。


    但引起批判的原因，主要是多數人曲解日本金融廳¹º的報告，並且過度解釋了。民眾誤解政府的報告，以為光靠年金過活的話，退休後還要自行多準備兩千萬日圓。事實上，那份報告只是在提醒大家，在這個人人都可能活到一百歲的時代，建議大家以投資或定期定額儲蓄因應老後生活資金不足的問題。我覺得這樣的建議很合理；想要過富裕的生活，事先做好準備才不用煩惱。


    民眾曲解報告並引發爭議，足以證明他們對錢感到不安。也可以清楚反映出日本民眾想把自己不努力這件事歸咎到某個代罪羔羊頭上，指望別人幫忙他們爭取。


    在以往的大環境開始瓦解的情況下，如果還想像之前那樣依賴政府或公司，實在不


    +   8 日本企業按照年資晉升的制度。

    9 日本企業保障員工在公司工作到退休都不开除的制度。

    10 日本負責監管存款、保險、金融商品等的政府行政機關。'
