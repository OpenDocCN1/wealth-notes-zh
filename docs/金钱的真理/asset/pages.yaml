- pgno: 205
  md: '講求交通方便的話，住在這類迷你公寓也是一種選擇。


    直到十年前，二、二五坪或一、五坪的公寓象徵貧窮，住在裡面的房客都是被歧視的對象。但是，現在已經是帶著一卡皮箱就能搬家的極簡時代。從這個角度來看，迷你公寓十分合理。另外，住這種公寓的前期負擔低，沒有押金、礼金、32的負擔也不用簽約；有些房子第一次承租還可以短期免費居住。


    如果你想住豪華的摩天大樓，在你能夠用現金買房之前，這個夢想必須先擱置。等到你未來成為有錢人，再以現金一次付清買下摩天大樓的最高樓層，等不想住的時候再賣掉即可。


    但是，現階段不需要這麼奢侈。你過得愈奢侈，夢想就會離你愈遠。忍住一時的欲望，放眼長期的目標，這樣的戰略非常重要。現階段應該捨棄所有奢侈作爲，奮起努力賺錢。削減成本沒有界線，只要你做得到的，全部都要做。


    禮金是日本的租房習俗，是感謝屋主將房子租給自己的謝禮，於簽約時繳交，平均約為一個月的房租，退租後也不退還。'
