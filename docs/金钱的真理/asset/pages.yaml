- pgno: 235
  md: '兩億六千萬日圓的本金是杯子裡的水，我當然會拿來再投資，即使我從溢出來的水中拿一半金額（九千五百萬日圓）去亂花，還是可以把剩下的九千五百萬日圓拿去再投資。


    投資、靜置、等到出現評價利益就實現獲利。然後溢出來的水取一半以上，可能的話拿四分之三以上再投資。這樣的反覆操作固然簡單，但努力維持這個循環持續運作才是重點。


    反覆投資再投資，總有一天你會得到淨資產一億日圓的杯子。但即使達到目標，之後也只能取用溢出來的水。


    不管是投資或做生意都可以，再投資不問方法，只要賺錢就好。平日多想想再投資的門路非常重要，你也可以收集資訊幫助思考。反過來說，如果你不喜歡這類活動，你就很難成爲有錢人。'
