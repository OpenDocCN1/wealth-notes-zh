- pgno: 178
  md: '股票時，我就已經把這筆錢當成全丟進水溝了。儘管如此我還是樂此不疲地買股票，簡單來說，我只是想要保留機會，等待有一天能夠中大獎。


    從另一個角度來說，其實這筆投資的最大風險就是一千萬日圓全沒了而已。如果全都沒了，重新來過就好。相反地，如果我運氣好賺了錢，回饋就會翻漲三倍或五倍。也就是說，我只要接受可能失去一千萬日圓的風險，扣除本金一千萬日圓之後，我還能賺兩千萬到四千萬日圓。因此我認為這是比較有效率的勝負。


    我反對買中獎機率極低的彩券，但從心理層面來看，買股票其實也跟買彩券一樣。但是如果連播種都不播，絕對不會長出東西來；如果播了種，哪怕有可能枯死，還是有機會開花。也就是說，持續買彩券與持續買股票有共同之處。


    順便補充一點，據說頭獎七億日圓的日本新年大樂透，中頭獎的機率是兩千萬分之一，簡直是天文數字。假如你過度期待中獎而每期都買，之後心累了就會放棄。畢竟沒人能保證一定會中獎。


    儘管彩券的中獎機率幾乎等於零，但可以確定的是，沒買彩券的人絕對不會中七億。即使中獎機率再低，買彩券的人當中還是有人會中獎，這是不爭的事實。股票也是。儘管股市目前的整體情況看來是大幅走跌，但總有一天一定會走揚，到時候手上沒'
  merge: -1
  img_proc: true
- pgno: 179
  md: '股票的人當然沒有機會得到回饋。


    這個道理也適用在其他事物上。不敢挑戰的人永遠不可能得到好結果。大多數的挑戰確實都會失敗，有時還會帶來不良影響，但我覺得什麼都不做更叫人絕望。不管最後得到的是壞結果或沒成果，我還是想要抓住得到好結果的機會，所以我持續挑戰。


    再者，在挑戰的過程中，你可以得到生存的動力與經驗。你在挑戰過程中學到的事情，未來一定會派上用場。對我的人生來說，挑戰就整體而言終究是有好處，也帶來了無可取代的正面影響。


    因為，你在小處所累積的失敗，終將會為你帶來極大的成功。


    # 預設「彩券不會中獎」「投資會虧損」才是正確心態


    你在現實世界的生活，大半都建立在正職工作的收入上。前提是公司發的薪水足以供應你的生活。像這樣子認真過活，私底下仍持續買彩券，才是正確的做法。你要預設彩券不會中獎，但仍隱約保留對中獎的期許。


    股價表現遠遠超出預期的情況，在股票投資中稱為「上漲」，相反的情況稱為「下'
  merge: -1
  img_proc: true
- pgno: 180
  md: '跌」。把下跌的風險視為理所當然，虎視眈眈等著上漲好幾倍的情況發生，這就是我的生活 方式。


    因新冠肺炎疫情影響，使得投資人的股票嚴重套牢，你或許因此不想再碰股票。但是股票原本就有可能大賠，也有可能大賺。既然想要賺錢，當然也得事先想到賠錢的可能。假如你只看對自己有利的部分，請務必改掉這種觀念；這個世界不可能事事順你心如意。若想完全避開損失，你根本打從一開始就不應該投資。


    賺錢的時候不得意忘形，應該更謹慎；賠錢時才要樂觀面對。最糟糕的做法就是賺錢時過度貪心，還沒實現獲利就急著加碼進行槓桿投資 28，增加交易部位，一旦賠了錢只得以這些全部低價拋售。這是最糟糕的做法，會使得你發生損失時急著賣掉停損，有獲利時卻遲遲不去實現獲利。


    基本原則 是，你應該在其他人很想買進的時候賣出；而適合買進的時間點則是其他人低價拋售時。這個原則固然簡單，但只要照著做，資產運用就會出現天差地別的結果。根據這個原則，市場行情大幅走跌的現在正適合買進。一聽到我建議各位現在買進，或許有人會批評我是在推廣高風險的買空交易
    29。我並不是在勸大家做空，只是在說從基本原則來看，現在買現股最正確。只要股票殖利率也提高，現在肯定是比過去更'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 沒有「時間」與「閒錢」的人，投資不會賺錢


    追溯究杳，問題在於你是否有充裕的「時間」和「資金」呢？


    我舉個例子。假設你手上有一筆資金，預計要在六月底用來付款，於是你現在動用這筆錢去買股票。這麼做的話，你將有很高的機率不會賺錢，因為你必須在六月底的付款日前賣掉這些股票。光靠短短幾個月時間就想賺錢，是你想太多了；市場動向很無情，不會受到個人的期盼影響。拿這種有時間限制的資金投資的人，我稱為「沒時間的人」。


    沒時間的人不夠從容，容易焦慮；他們有時會在股票才剛開始漲就賣掉，只能小賺


    好的買進時間點。


    +   28. 借鑒進行投資，即利用小額資金來進行數倍於原始金額的投資。目的是獲取投資標的物波動的數倍收益率。然投資有賺就有賠，使用槓桿之後，投資者也會面臨虧損成倍增加的風險。

    29. 股價下跌時加買股票的投資手法，藉此拉低每股均價，在股價上漲幅度低時，整體仍為獲利。相反地，如果行情持續走跌，損失也會擴大。'
  merge: -1
  img_proc: true
- pgno: 182
  md: '一筆，但也有些人會輸給心理壓力，為了停損就早早認賠賣出。這類型的人容易因為搶心股價而疏於正職工作。因此想要靠股票賺錢，先決條件就是擁有沒有期限的時間。


    如果規定自己只在獲利的時候賣股票，只要不低賣，就不會有虧損的可能。沒有人曉得什麼時候能夠獲利，所以至少時間上必須很充裕，充裕到可以永遠持有股票也無妨。


    接下來談談資金的充裕。「投資要用閒錢」已經是人人聽過的道理。然而，實際上還是有許多人拿必要資金去投資，而不是閒置的錢。我在這裡想說的是：拿閒錢投資更容易賺錢。所謂的閒錢就是賠掉了也不會引發問題的資金。


    賠掉了也不會引發問題的錢，你就不會執著，即使那筆錢有很長時間都是股票，也不會帶給你壓力。如果股票有股利，只要持有就會持續有錢進來。這筆閒錢還能夠產生新的錢，再沒有什麼比這更美好了。長期持有股票不是壓力，而是一件值得感激的事。


    由此可知，我認為想要持續投資，就必須擁有充裕的「時間」與「資金」。


    另外，我還有一點想要補充。前面用彩券舉例時，我一直強調中獎很困難，但如果是副業或投資，實際上都比彩券中獎更值得期待，因此也別過於沮喪。以股票來說，在我印象中，在日本的三千七百家股票上市企業中，每年只有幾十家會出現股價增值十倍'
  merge: -1
  img_proc: true
- pgno: 183
  md: '以上的「十倍股」。之所以說「在我印象中」，是因為「十倍股」的計算方式是同一年年頭到年尾這段期間是否上漲十倍，或五年之內是否達到十倍的高點。兩種算法不同，符合的企業數量也有差異。像現在股市暴跌，十倍股的數量也跟著減少了。


    但是不管怎麼說，股價會上漲十倍的股票確實存在，今後也還會繼續出現。也真的有投資客因此大賺一筆，像我就曾經在虛擬貨幣上像這樣海撈過一次。從最低價上漲十倍到最高價，難度當然極高，大部分是靠運氣。不去追求買在最低點、賣在最高點，只賺兩倍是比較實際的心態，而且這樣的兩倍獲利比較容易重複實現。像我就交易過好幾次兩倍股。因此，做任何事之前不要過度期待，以悲觀的心態謹慎面對很重要，但千萬別因為過度悲觀而忘了挑戰。'
  merge: -1
  img_proc: true
