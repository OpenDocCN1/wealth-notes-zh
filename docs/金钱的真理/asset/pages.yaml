  md: '之一就是說，虧損和死亡的風險對每個人來說都無法避免，都是包含在人生內的元素


    既然是風險無可避免，想要完全沒有風險可說是癡人說夢。就連在家睡覺都有可能發生地震，所以人生打一開始根本就不可能零風險。因此，我認為採取「與風險和睦共處」的態度才正確。談到錢，如果收入有可能因為疾病或景氣惡化而減少，那麼事先做好準備很重要。預設危機造訪時如果沒收入該怎麼因應；首先必須存下兩年不工作也沒問題的緊急預備金。接下來才是賺錢。


    # 與風險和睦共處，找出生活中的低風險選項


    但困難的是，我們在生活順風順水時，很難想像沒有收入的情況。但現實就是，很多人因為這次的疫情影響，遭遇了人生中想都沒想過的谷底。這次的疫情可說是上天給予的考驗，是為了讓我們今後在這一世紀能夠活得更堅強、長更久。


    現在最重要的是，學會與必然存在的風險和睦共處。直到人生結束為止，我們要對抗的不只是這次的疫情，類似的考驗今後還會發生很多次。要想與風險和睦共處，最重'
  merge: -1
  img_proc: true
- pgno: 12
  md: '要的就是你「選擇了什麼」。


    舉例來說，假設從東京前往名古屋的交通方式有「搭乘新幹線」、「搭高速公路」、「搭朋友的車」這三個選項。其中風險最低的是搭乘新幹線；東海道新幹線，自一九六四年啟用以來，不曾因為列車運行問題發生事故。另一方面，我想各位對高速公路意外應該有所聞：二〇一六年輕井澤滑雪巴士曾經發生嚴重的翻車事故，四十一名乘客與司機中有十五人死亡。即使只在新聞看過，各位也知道巴士發生意外的頻率很高，其風險如何不難自明。朋友開車當然也是，朋友既不是專業駕駛，而且考慮從東京開到名古屋的距離很長，發生事故的危險性當然遠遠高過新幹線。


    就像這樣，日常生活中有許多面臨選擇的時刻。風險經常被一概而論，但其實有許多「低風險」的選項，可以達成同樣的目的。賺錢也是同樣的道理；二話不說就開實體餐廳，風險自然很高，從網路部落格開始的話，風險就沒那麼高，前期投資也不會花很多錢，如果中途想要退出，也花不了什麼成本。我想說的是，假如你的目的不是開餐廳而是想賺錢的話，可以考慮其他低風險的選項。'
