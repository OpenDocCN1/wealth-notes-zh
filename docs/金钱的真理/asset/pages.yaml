- pgno: 266
  md: '# 致富心法


    # 29


    # 真正的有錢人是房東、股東


    # * 年收三千萬日圓不算有錢人'
  merge: -1
  img_proc: true
- pgno: 267
  md: '這世上有一種有錢人，他們的成功不是一般人所能想像。我搬到國外生活之後，曾經親眼看到有人用自己的錢買下一整層要價幾十億日圓的豪宅。十億、二十億、三十億日圓的鉅款，他們根據經驗、憑著直覺，眼睛眨也不眨就投資下去。


    在他們這種淨資產超過幾百億的超級有錢人看來，年收入屬於流動收入，不管是一千萬日圓或三千萬日圓其實沒有太大差別，因為差額都在誤差範圍內。


    我用前面提過的「杯子裡的水」打比方，來談談這些超越一般水準的成功人士吧。杯子裡裝滿的水是淨資產，而有錢人只取從杯子溢出來的水使用，但光是這樣，它就能夠過著十分富裕的生活。


    因為成為終極富豪之後，就運溢出杯子的水，都是非常龐大的量。


    日本酒有一種喝法，就是把杯子放在小木盒裡，再把酒滿滿注入杯中。這種喝法稱為「盛切」。溢出杯子的酒會裝滿小木盒，杯裡的酒更是滿到因為表面張力而隆起。


    頂級的富裕階級就是，不管怎麼喝小木盒裡從酒杯溢出的酒，也無法喝完。感覺有人不停地往酒杯裡倒酒那樣。


    因為倒酒的速度愈來愈快，酒也不斷地從小木盒溢出。此時就要把酒杯和小木盒換'
  merge: -1
  img_proc: true
- pgno: 268
  md: '成較大的尺寸。


    這正是讓財富循環擴大的「雪球效應」最佳的範例。


    距今約十五年前，那時我還不滿二十五歲，曾有一位公司甫上市的創業家告訴我：「年收入三千萬日圓算是窮人。」


    我當時的年收入是兩千萬日圓，而且自認是成功人士。


    因此我對那位經營者有些反感。但等我搬到國外生活，見識到超富裕階層的生活方式後，才終於理解他那句話的意思。


    我在海外一開始的據點是新加坡，當時住在月租兩百萬日圓（約新台幣五十四萬元）的房子。


    我那時的月收入大約是一千萬日圓（約新台幣兩百七十萬元），要支付兩百萬日圓的房租很吃力。新加坡的所得稅稅率是二〇%，所以扣稅後的收入大約是八百萬日圓。其中的兩百萬日圓要用來付房租，也就是說我一個月中有一週的時間全是為了賺房租而工作。


    光是呼吸，我的兩百萬就飛了。而且，流動所得一旦停止就沒戲唱了。當時的我與大多數的各位一樣，以為「水會源源不絕地流進來」。但事實上水很容易停止流動。'
  merge: -1
  img_proc: true
- pgno: 269
  md: '一旦水停止流動，流動所得減少到剩下五百萬日圓，再從中扣掉二○○％的稅，就只剩四百萬日圓了。在水流變小的情況下還要支付兩百萬日圓的房租，等於我人生的一半都是為了繳房租而活。我突然產生這樣的疑問：「真正的有錢人會這樣嗎？」


    # 房東、股東才是「真正賺錢」的人


    我經常在想，這世上「真正賺錢的是誰」？


    從前面的例子可以看出，「真正賺錢」的是收我房租的房東。我減少睡眠時間拚命地工作，錢卻一分不少地落入在自家豪宅悠閒生活的房東口袋。關於這個物件，雖然它是位於新加坡的不動產，但我匯入房租的收款帳戶卻是英國維京群島（BVI）的法戶。後來我才知道這位房東透過設在避稅天堂的公司，管理名下的各項資產。有錢人到底都在做什麼呢？——我的疑問愈來愈深了。


    為了繳房租給他，我辛勤地工作，所以我等於是他的小廝或員工。


    可以確定的是，房租就是把財富轉移給房東的設計。股利則是讓擁有股票的人變有錢的設計。'
  merge: -1
  img_proc: true
- pgno: 270
  md: '我開始好奇自己過去匯給這些房東的房租總金額到底有多少。感覺一直付房租給別人好蠢，於是我決定把自己也變成房東。


    這世上絕大多數人都是承租屋子的房客，擁有不動產的房東相對來說人數很少。我之所以會有當房東的念頭是因為，我相信必須成為出租房子的房東、擁有股票的股東，才能曾身真正的有錢人。我在世界各地購入約四十五億日圓（約新台幣十二億元）的不動產、持有相當於二十億日圓（約新台幣五億四千萬元）的股票、公司債、保險、基金等，就是基於這個理由。


    # 擺脫人際關係的束縛


    本書開頭也提過，我過去曾經有一段紙醉金迷的日子。說得詳細一點，我在日本那段日子總是被不安追趕、總是在逃避。那時的我在經營公司，月底經常要煩惱資金調度，壓力使得我經常胃痛。因為雇用不少正職員，為了維持組織的運作，我必須和各式各樣的人打交道。再加上「秒賺一億日圓的男人」的稱號，使我格外受人矚目。然而，我卻愈來愈不懂幸福是什麼？自己為了什麼賺錢？自己的未來將會變得如何？'
  merge: -1
  img_proc: true
- pgno: 271
  md: '日常生活中總有可疑人士帶著各種誘惑找我。人際關係充滿了各種利害、義務、上下關係、猜忌、金錢借貸，這些全都是「束縛」。即使你不喜歡對方，不知道對方能否信任，也必須維持表面的往來，而我也一直以為這就是大人的的人際關係。另一方面，我也認為只要彼此有交情，往後萬一有難就能向他們求助。也就是說，過去的我有一段時期也很依賴別人。


    但我現在的想法是，這些我隨意拓展的人際束縛，反而困得自己動彈不得，十分痛苦。最後，我在日本幾乎失去了所有資產，當時出面幫我一把的人卻連一個也沒有，不僅如此，那些人反而落井下石，想要從我身上搶走更多東西。直到那時我才終於幡然醒悟：一直以來，我努力經營、以為將來能成為自己財富的人脈，其實是不切實際的東西。


    所以我離開日本移居國外後，最先切斷的，就是這類人際關係。'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 致富心法


    # 30


    這世上主動接近你的人，都不是為了讓你賺錢，


    ※人際關係也要設停損'
  merge: -1
  img_proc: true
- pgno: 273
  md: '過去與我有關係的人當中，只有極少數人對現在的我來說絕對不可或缺，當中包括我的妻子，但其他絕大多數都是完全沒必要往來的人。但是，在我清理掉這些人際關係之前，我一直誤以為跟那些人往來能夠得到好處。他們有些人以豪華的陣仗招待我，也有人給我特權。事實上這些也沒什麼大不了，不過只是些「一時爽」的好處罷了，並不會為我往後長遠的富裕人生帶來任何貢獻。這種人際關係所帶來的風險，反而遠超過短暫的歡愉。


    比方說，跟有壞習慣的人來往，你一定也會染上那種習慣。不管你對自己的定力再有信心，就我的經驗來說，一定還是會受到影響，毫無例外。


    假如你身邊有很多人愛喝酒，你也會每晚喝酒。假如你身邊有很多人愛賭博，你也會沉溺於賭博。假如你身邊有人嗑藥，不管你的防備再嚴，到最後也會不再排斥。因此，無論基於何種理由，你都不該與擁有這類惡習的人扯上關係。哪怕對方再有魅力也不行；就算他是多金型男、位高權重的大咖、當紅明星也不可以。你必須徹底拒絕與對方扯上關係。


    當素未謀面的陌生人突然主動接近你，你一定要經常思考對方的目的是什麼。請記住，這世上主動靠近你的人，都不是為了給你好處。即使他們嘴上有好聽，但他们'
  merge: -1
  img_proc: true
- pgno: 274
  md: '接近你就是为了自身的利益。只要你牢记这个理所当然的道理，就会大幅降低被当成肥羊的概率。


    另外一种类似的情形是，网络上有许多广告简讯煽动你对未来的不安、表示可以帮你，这些也是准备把你当肥羊宰的陷阱。简讯中是不是列了许多对你有好处的优惠条件呢？记住，在这场交易中唯一受惠的，就是卖东西给你的人。


    要切断从以前到现在的人生束缚，最好的做法就是像我这样，离开日本去国外，彻底改个环境。倘若你因为诸多因素无法立刻换环境，那就先换掉联络方式，像是重新申请门字号码之类的，让那些束缚联络不上你。


    # 再苦，也不要自我放蕩


    我在日本时，经常在东京闹区喝酒。我不否认其中有自暴自弃的成分在；不是因为迷上哪个女人，只是不想面对那些令人心寒的现实。我不在乎庸浅的关系，只要能够让忘记讨厌的现实就好。但是，这种自暴自弃的生活方式，只会让财富远离我。


    自暴自弃就是一种怎样都好、变成怎样都无所谓的自我放蕩心態。但自暴自弃是一'
  merge: -1
  img_proc: true
- pgno: 275
  md: '種會讓金錢遠離你的糟糕態度。


    那種態度就是：我想喝醉忘記一切，我覺得早起很痛苦只想永遠躲在被窩裡，我再也想不面對現實了。人到了這種狀態，我想已經瀕臨精神崩潰了。實際上真的有人因此而尋死。


    但是，請你仔細想想。自暴自棄之後，你接下來要面對的是，自暴自棄所帶來的更嚴重的連鎖效應。


    我也有過這種經驗。我用暴飲暴食來消除經營公司的壓力；大吃大喝的時候，的確實得壓力不見了。然而，接下來我要面對的是更加嚴重的不安與失落感、逐漸變胖的自己，以及完全沒有解決的經營問題。這些問題在我逃避現實時變得更加惡化，讓我完全無力去面對。


    那時，我唯一能做的就是，不要繼續自暴自棄。已經發生的事情我也無能為力，所以我先找出自己現在能做的事，即使再小的事也無妨。用這種方式站穩腳步重新面對問題，情況就會逐漸好轉。然後，不管現在在怎麼低潮，你一定能夠再次感受到幸福。雖然一開始需要忍耐，但為了避免自己陷入無可挽回的地步，無論如何都不要放棄。


    事實上，一個人的幸福與你現在是否處於絕佳狀態無關。就算你現在很窮、很悽'
  merge: -1
  img_proc: true
- pgno: 276
  md: '# 懂得知足，才不會掉進「追逐獲利的陷阱」


    慘，只要對未來仍懷抱希望、有積極進取的念頭，就能感到幸福。相反地，即使你現在再有點錢再成功，如果對未來只有失望，就不會覺得幸福。


    我曾有過兩次人生低潮期，但每一次我都很努力地思考解決的方法，永遠懷抱希望，試圖打破逆境。只要有一點點成果，我就會雀躍萬分；妻子在我們住小套房時親手為我做的菜，令我深深感動。終於找到方法解決欠國稅局的滯納金時，我開心到跳起來；不過是財產從負債變成零而已，就讓我高興到手舞足蹈。


    也就是說，一個人無論身處什麼狀態，只要不放棄希望、不逃避問題、果敢地挑戰，就能感到幸福，實際體會到活著的充實感。從這個角度來看，只要你能對自己所做的事情樂在其中，即使不是有錢人，也能夠感受到喜悅、感動、希望，這樣就已經算是一位成功者了。


    我想說的是，「天堂和地獄就在你一念之間」。以積極上進的態度，時常懷抱希望和期待，就能克服所有困境。'
  merge: -1
  img_proc: true
- pgno: 277
  md: '根據我過去累積的諸多經驗，我可以告訴你，要讓金錢喜歡你，最重要的就是徹底降低自己的滿足標準。


    舉例來說，現在有一位投資客持有未實現利益一億日圓的股票。這支股票預估後續看漲。考量到該公司的動向、業績和市場的反應，這位投資客評估這支股票可以有兩億日圓的獲利。沒想到該公司受到這次新冠肺炎疫情的衝擊，基本面的優勢支撐不住，股價應聲下跌。這位投資客因為貪圖一定要撈到兩億日圓的獲利，一個反應不及，一億日圓的未實現利益也沒了，還多賠了一億日圓才停損。他忘了知足，變得過於貪心，結果不只損失了一億日圓的獲利，還倒賠一億日圓。


    另外，我們也來看看這種例子：


    假設你經營一家美味且生意興隆的餐廳。大型購物中心紛紛主動邀請你進駐開店，只要去開店就有獲利。等到你的店舖拓展到一百家、兩百家門市，你開始想，繼續向國外展店的話，就有機會開到一千家、兩千家門市。因為你太想賺更多錢，目前的門市數量所產生的獲利已經無法滿足你。


    問題是，你忘了最重要的一點：再好吃的餐廳，缺乏深思熟慮，在短時間內迅速展店的話，市場跟不上展店的速度，終將導致你的財務狀況惡化、負債變重。在這樣的情'
  merge: -1
  img_proc: true
- pgno: 278
  md: '況下，倘若顧客已經膩了，原本運轉順利的齒輪就會慢慢開始逆轉。


    到了這個地步，原先賺進來的利潤就會消失無蹤，造成虧損；事到如今即使你把門市一家家收掉，還是止不住錢繼續出走。最後當你看到大火燒盡、一片荒蕪的慘狀時，應該會這麼想：


    假如我那時候懂得知足就好了……


    # 「更多、更好」的貪婪心態使人墮落


    這些例子在在顯示，因為不知足而引發的災難也有可能在在身上發生。日常生活中經 常可看到，因為太過貪心，最後反而連原本擁有的一切也失去，變得更加凄慘。


    我能夠想到不少例子佐證。例如：


    因為想要更美、更年輕的妻子而外遇，結果失去所有重要的家人，就連原本打算與外遇對象展開的全新幸福人生，最後也以失敗告終。


    有人以為自己只要換家公司就會獲得賞識，和現在的公司鬧到撕破臉辭職，結果剛跳槽的公司卻倒閉了，反倒是原本的公司成功上市，前景看好。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '想要更大的房子、更漂亮的交往對象、更多的人脈……「更多、更好」的欲望沒有極限。儘管已經擁有相當程度的成功，卻仍不知滿足，一心只想追求更多更好，貪婪的人性成為拉著你往下墮落的引力。


    這是我經歷過巨大的痛苦之後才懂的事。希望你能夠學會知足，所謂的「知足」就是知道滿足，知道感謝現在所擁有的一切。請降低你的滿足標準；不管吃任何东西，置身任何環境，都要懂得心懷感謝，這一點非常重要。


    # 小額收入、小額支出最需要注意


    再介紹一個我自身失敗的例子。那是太過輕視小錢所導致的失敗。


    假設你現在每年有三百萬日圓（約新台幣八十一萬元）的可處分所得。你手上有三百萬可以自由使用，也認為自己已經大幅削減了無謂的支出。於是，為了消除壓力，你定期血拼，買了許多不需要的東西，還訂閱了幾乎沒在使用的每月固定扣款服務。每一筆大約都是幾千、幾萬日圓左右的消費，所以你也不放在心上。


    可是，如果你把以前到現在所有這類小額支出的金額全部加總起來，總金額一定會'
  merge: -1
  img_proc: true
- pgno: 280
  md: '讓你嚇到說不出話來。


    正因為每月扣款不是太大的金額，所以你覺得肉痛，也很容易漏財。但寥寥幾千、幾萬日圓累積下來，也是一筆足以參戰的龐大軍費。


    實際上，我在日本經營服飾公司時，就因為覺得顧客可能希望品項愈多愈好，所以毫無節制地採購，導致賣不掉的衣服堆積如山。採購是非常愉快的工作。新衣服會打上標籤，裝進袋子裡，整整齊齊地送進倉庫。看見商品堆滿到天花板，我就覺得雀躍不已。


    我瘋狂迷上這種採購的喜悅；翻閱廠商的型錄訂貨是我做得最起勁的工作。一開始還會因為預算有限，而去認真評估商品好不好賣，再三審慎考慮；等商品採購進來以後，也會詳細追蹤數量、賣掉的速度……但是，等生意大到可以融資之後，隨著資金循環變好，下訂時反而變得較為隨便。


    就連原本很重視的訂單預測和結果驗證，後來也懶得執行；一件衣服用幾千日圓的價位採購也不在意。在每月營收破億之後，幾千日圓感覺上變得可有可無。向上游廠商訂貨的各尺寸、各顏色的欄位上，全都填入隨意想到的數字，比方各訂個十件之類的，公司的庫存逐漸堆成一座小山。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '儘管如此，只要有商品熱賣，公司就能夠經營下去。但那堆賣剩的商品裡，有許多怎樣都賣不掉的東西，完全成了「滯銷貨」。這些滯銷貨最後會用低於進貨價的價格塞進福袋裡出清，藉此停損；後來計算這些特別損失時，我才驚覺總金額有多麼龐大。這些小錢累積下來，足以抵銷我至今努力賺到的所有利潤。從這個經驗我學到一件很重要的事：小額支出最可怕。


    # 所有「大錢」都來自「小錢」的累積


    各位或許覺得這是理所當然的道理。但一個人粗心大意的地方，經常會成為這個人最大的弱點。即使你擁有三百萬日圓可以自由花用的錢，也必須謹慎看待幾百、幾千日圓的小額支出。這樣你才能更快存到更多資金。


    除了小額支出，小額收入也一樣。當你能夠賺進幾百萬、幾千萬日圓，你就會開始看不起幾千、幾萬日圓的小錢。但是，我回顧自身的經驗，發現在建立現有淨資產的過程中，對獲利貢獻最大的，顯然是多年來一點一滴累積的收入。


    即使那些錢換算成每日收入，不是什麼值得一提的金額，但累積個一年、兩年、三'
  merge: -1
  img_proc: true
- pgno: 282
  md: '年，也會帶來很大的影響。最後你會明白，自己的成功就是這些過往的小獲利長期累積所致。


    因此，我很珍惜出租房子的收入。前幾天我剛收到「杜拜山莊」這個物件一年份的房租；我從各個角度細細品味、發自內心感謝這筆收入。這筆錢大約六百萬日圓（約新台幣一百七十萬元）。我過去投資時曾有過短期內上億日圓輕鬆入袋的獲利經驗；跟幾億日圓的金額相比，六百萬確實不足為奇；換算成月收入的話，不過是五十萬日圓（約新台幣十四萬元）而已。


    但我對這樣的小額收入同樣由衷珍惜，不敢看輕；因為我曾有過前面提到的服飾公司失敗經驗，切身體會到看不起小額收入和小額支出，下場會有多悲慘。因此我才會希望各位多加留意小額收入和小額支出。


    # 自己擅長的領域更不該「大意」


    人經常在自己擅長的領域失手。前面我提過，粗心大意會變成一個人最大的弱點，所以會粗心大意，通常是因為你覺得情況應付得來。這種游刃有余的態度會出現在你'
  merge: -1
  img_proc: true
- pgno: 283
  md: '錯。


    熟悉的活動，或對自己充滿自信的時候。然而，人往往在自己擅長的原領域更容易犯下大錯。


    舉例來說，因為上電視而大紅大紫的藝人，就容易因為跟電視有關的醜聞而失去一切。因為偏激的言行受到矚目的網紅，就容易因為偏激的發言引起批判，失去可信度。另外，靠著號稱「高度安全」的虛擬貨幣累積財富的專業人士，也發生過把加密私鑰放在安全係數低的雲端，因而被偷的例子。還有靠股票作多賺錢的天才投機客，最後也會因為股票作多而破產。


    由此可知，人們一旦在自己太習慣的領域就容易粗心大意，這樣的例子屢見不鮮。


    你是否只顧著把眼光放長放遠，卻沒注意到親信的心已經遠離？你是否只顧著開發新客源，卻因此累積了太多老顧客的抱怨？


    金錢喜歡的人，是對自己日常生活中的一舉一動謹慎小心的人。珍惜自己所在的位置，時時抱持著緊張感認真做事。當你認為「不要緊」、「游刃有餘」、「這個我最在行」的時候，你就會遇上最大的威脅。


    相反地，只要你能夠時刻注意自己的狀態，你就能夠一直握有優勢。即使是你再擅長的領域，即使你已經闖出了一番成果，仍要時時戒慎恐懼，千萬不可以鬆懈。'
  merge: -1
  img_proc: true
- pgno: 284
  md: '# 接納世界的不完美，你將更輕鬆


    金錢喜歡的人還有一個特徵，就是「不違背潮流」。我常說：「不要過度審時度勢。」人的確需要有自己的理念，有時不去在意外界的雜音，才能有所突破。雖說如此，「不去在意外界的聲音」還是有程度上的差別，而且會依狀況而不同。


    各位可以想想叛逆期的孩子。青春期的孩子都會反抗父母；我十幾歲時也總認為自己所想的一切都是對的，父母說的話都很落伍。但是，我反抗之後的下場，就是遭到逮捕拘提。在獄中我突然有感，覺得「爸媽說得沒錯」。此時我才發現，之前爸媽對我的糾正都是對的，並對自己的愚蠢感到錯愕。


    正因為如此，來自社會大眾的批評和責備之中，自然也有正確的意見。我們對這類批判不能一概無視。我自己也經常挨罵，所以深有所感；我認為這類批判中，也許藏有能讓自己變得更好的提示。因此，我現在仍然經常看網上別人對我的批評，只要我認為自己真的有錯，就會改正。


    當然，人生中很難時刻注意到自己犯了錯。更多時候，我們總在認錯之前就急著反駁；往往要嘗到錯誤帶來的慘痛教訓，才能終於覺醒。但是，正因為錯誤難以察'
  merge: -1
  img_proc: true
- pgno: 285
  md: '覺，所以我才要說，別過度反抗這個世界的潮流，才是明智之舉。改掉凡事愛反駁、隨時愛反抗的習慣很重要。一發現自己的想法有誤，最好立刻道歉；硬要堅持已見的話，有時反而會讓你陷入非常不利的狀況。


    在此容我稍微離題一下，看到許多人對政府的主政者、企業領導人不分青紅皂白地大肆批判時，我往往覺得非常擔憂。這些人當中，有的人會激烈批評時事：「政府的政策太失敗、判斷錯誤！」「這個責任該由誰負責？」有的人一覺得自己受到權力壓迫或遭到企業不合理的對待時，就在網路上大肆抨擊。他們的動機可能是為了排憂泄忿，但也有可能是扭曲變形的憤怒。於是這個世界變得愈來愈混亂，每個人都在互相監視，等著抓住別人的小辫子；人人都把自己所做的一切正當化，不提自己的錯，只顧著撻伐別人的過失。


    重點是，完美的人並不存在。所以我們應該提高對他人的寬容程度，相信人性本善。只有這樣，你才能真正放過自己。


    堅信只有自己最正確，不斷地與人事論，堅持不認錯，這種態度我一概稱之為「反抗」。因為反抗而痛苦的人，其實不就是當事人自己嗎？只要停止反抗，坦然接納，你的生活將過得比較輕鬆。'
  merge: -1
  img_proc: true
- pgno: 286
  md: '# 停止反抗，人生就會好轉


    事實上，我在日本的時候也經常反抗。有一段時期，我自認絕對不會有錯，老是擺出一副「無法理解我是你有問題」的傲慢態度，非常堅持自我。不管面對有交情或沒交情的人都是如此。


    我對周遭總是感到憤怒失望，經常大罵：「日本是個爛國家！」「那個女人不懂我！」「為什麼大家會認同這種不合理的事情呢？」我也總是在反抗他人：「要你管！」「你閉嘴！」「少在那邊對我指指點點！」結果，最後吃虧的人就是我自己。正因為痛過，我才終於有所覺悟。


    我沒有必要反抗這個世界，應該尊重世界的潮流，順著潮流走。


    奇妙的是，自從我停止反抗之後，我的人生就此開始好轉。自此以後，無論是事業或私生活，都不再有壞事發生，總是好運連連。


    在此我想說的是，就某個意義上來說，「虛無感」很重要。現在的我有很大的成分是「無」。本來無一物，何處惹塵埃。


    這世上的確有很多奇人異事。有很多不遵守約定的人，會背叛他人的人也不少，但'
  merge: -1
  img_proc: true
- pgno: 287
  md: '這就是我們所生活的真實世界。我明白了這個世界永遠不可能完美。這個不完美、不合理、不公平的世界，待起來卻很舒適。

    想要在這個不完美的世界裡舒適地生活，最重要的就是別反抗，別忤逆世界潮流，順著潮流前進即可。

    儘管這次的新冠肺炎疫情衝擊，造成世界各國紛紛封鎖邊境，不過這樣也很好。我現有的不動產和股票或許價格會下跌，股利和房租收入或許會減少，但這樣也很好。政府要求民眾少出門，大家就乖乖待在家裡，這樣也很好。可以趁此機會好好睡一覺，或大量閱讀平常沒空看的書。

