- pgno: 325
  md: '# 後記


    本書的內容，全都來自於本人親身經歷。


    走到現在，我體驗過許多，累積了數也數不完的失敗，現在也仍舊經常失敗。


    或許有人讀完這本書會心想：「原來錢是這樣增加、守住的啊！」


    但是人類這種生物，不是親身經歷學到的教訓和知識，往往很容易忘記。我本身愛看書，也讀過不少書，每天都深刻感受到：若要真正掌握作者想表達的理念，就需要更深刻的精神支柱，需要親身去體驗那些內容。


    我在某本書上看到世界知名的投資專家股神巴菲特（Warren Edward Buffett）說過：「不管我們是這麼優秀的企業，也無法從過去的業績賺到半毛錢。」當時我心想：「原來如此。」


    讀那本書時我十分認同書上的內容，實際上卻沒有掌握到作者真正想說的話。直到最近投資股票失利，才真正體悟到那句話的意思。


    體驗過失敗之後，我重新思考巴菲特那句話，這才明白他要講的是什麼。巴菲特真'
  merge: -1
  img_proc: true
- pgno: 326
  md: '正的意思是：「一家企業過去的業績很好，不代表未來也很好。」這句話道盡了我所投資的公司的現況，讓我有更深遠的體會。


    名言，尤其是歷史偉人的名言，都很有分量。


    但是，我們必須親身經過無數的經驗與失敗，才能真正了解名言的含意。不管名言再怎麼美妙，少了親身經歷，就無法真正內化為自己的東西。


    在這層意義上，我認為行動很重要。實際起身行動、經歷失敗、受過許多小傷，唯有這樣的累積才能夠改變一個人。各位也必須親身去體驗，才能完全發揮從這本書獲得的諸多知識。想要了解財富，就必須切身體會金錢的真理。


    人在困境中才會成長，唯有經歷過試煉才會長大。沒有哪一個成功者不曾走過逆境；倘若人生中只有順境，只會跟著眾人隨波逐流，這樣的人稱不上真正的成功。失敗和逆境都是成功重要且珍貴的基石。


    假如你讀完這本書之後有任何感想，我希望你趁此機會親自去感受成功與失敗，體驗痛苦與喜悅。


    但是，就算你鼓起勇氣起身行動，還是需要花上幾年時間才能改掉過去學會的依賴他人與推託責任的不良習慣。我可以告訴你大概要花上十年。因此，你在心裡許願想要'
  merge: -1
  img_proc: true
- pgno: 327
  md: '成為有錢人並認真展開行動之後，無可避免需要忍耐很長一段時間，才能得償所願。在這段期間，你將嘗遍各種酸甜苦辣。


    這個過程絕對不容易，我只能說：「一切端看你願不願意去做。」


    否則，讀完這本書，你也不會有什麼改變。這就是我最想告訴各位的事。


