- pgno: 126
  md: '我們再繼續之前的話題，談談分期付款。使用分期付款購物時，你必須想成這個商品是「一一年三萬六千日圓（約新台幣九千七百元）一，而不是「每月三千日圓（約新台幣八百零九元）一。假如商品一開始說要賣你三萬六千日圓，還會有很多人搶著打電話訂購嗎？想必多數人都不會購買吧。換成「每月三千日圓一的說法，聽起來是付得起的價格，民眾就會掏錢購買。強調總金額只會使人失去購買慾；但也因為每月分期付款的金額負擔得起，於是你就落入陷阱，一口氣買下十個或二十個，搞得自己荷包失血。請記住，任何分期付款以低價取得的東西，事後都得面臨可怕的後果。


    如果是不再使用就能夠中途退訂的付費方式還好，但如果是分期付款，直到付清全額貨款之前，你都無法退訂；拒絕付款的話，債權人會讓你破產。


    事實上，房貸也是相同原理的甜蜜陷阱。


    很多人一聽到「房貸選擇固定利率的 E135.21 最划算！利息最低！」等宣傳標語，就跑去申請貸款，還稱讚這種長期負債每月還款的負擔少。問題是，在這個貸款背後等著你的，是總金額三千萬日圓的鉅額債務地獄。如果不以月繳金額，改以總金額的角度去思考的話，你應該更能感受到這筆金額龐大到令人害怕。


    背房貸等於是對自己處以三十年徒刑的「鐵牢」。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '陷入這類甜蜜陷阱的人，在我看來就像黏在蟑螂屋裡的蟑螂，被誘餌的氣味吸引上鉤，自己跑進陷阱裡。簡單來說，你必須了解，所有無法一次輕鬆付現購買的物品，都不適合你的身分。你將會因為腳上綁著枷鎖而痛苦很長一段時間。人類這種生物的心情說變就變，一分鐘後你就會後悔自己一分鐘前的衝動。所以你若因一時情緒而想要的某個東西，只要那不是你能一次輕鬆付現購買的，都會送你去坐錢牢，千萬不能一時衝動。


    以現金一次付清購買的商品，在你買下的那一刻，你就擁有了所有權，所以即使你之後不想要轉手賣掉，也能立刻拿到折價後的金額，這個商品留給你的頂多只有後悔。但如果你是以負債或分期付款的方式取得商品，直到你付完貸款之前，那個東西都不是你的，因此你沒有脫手轉賣的自由，也沒有停止支付貸款的自由，這就是錢牢。


    想要的情緒只是一時的。只要暫時忍耐，事後你會發現很多東西其實你並不需要。衝動購物只會使人後悔莫及。假如你認為繳貸款很痛苦，那種動彈不得的狀態其實就跟黏在蟑螂屋裡的蟑螂沒兩樣。


    不只是前面列舉的這些例子，經常浪費錢的人必須先有自覺，知道自己容易掉進日


    21日本政府的住宅金融支援機構與民間金融機構合作推出的住宅貸款商品名稱，提供長期且固定的貸款利率。'
