- pgno: 311
  md: '# 別迷信超自然事物


    話說回來，世上有很多人在乎財運。經常聽到像是「擺放鈔票時正反面統一，才能提升財運」、「使用這款皮夾可以提升財運」之類的說法。其他還有能量石、風水、占卜、抽籤……各種真假難辨的招財方法。老實說，我完全不信這類超自然的東西。錢才不會單憑你的念力就增加；錢是更現實、更真實的東西，不是向老天爺祈禱就會掉下來。


    如果不起身採取具體的行動，尋找財富的源頭，你的錢就不會增加；如果你沒有小心翼翼避開社會上的各種陷阱，也無法守住錢財。


    還有一點，錢不是隨賺即有。有的人即使現階段經濟充裕，花錢如流水，還是有可能下一秒就拿不出錢來。在你不以為意的情况下花掉的那些小錢，最後全部加總起來，往往會是讓你欲哭無淚的龐大金額。


    因此，如果你打算花錢購買能量石、護身符等東西，應該立刻停手。前不久有一則藝人被洗腦的駭人新聞傳遍大街小巷。世上總有一群人熱愛無止盡地布施，或捐款給宗教團體與特定對象，任由對方予取予求。對吃軟飯的男人產生母愛本能的女性，在奉上'
  merge: -1
