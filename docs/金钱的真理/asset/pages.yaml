  md: '# 一 推薦序


    # 億萬富翁的「八〇三〇」金錢觀


    花錢八分飽、存兩年預備金、有三年軍費再賺錢


    「效率理財王」版主／余家榮


    這是一本關於金錢基礎觀唸的書，適合多數上班族與想要創業的人，作者與澤翼從三大方向跟你分享他對於金錢金錢的經驗談：


    # 一、花錢：八分飽的幸福


    本書作者是淨資產高達七十億日圓的企業家，歷經過住豪宅、開名車、穿戴名錶或名牌精品，而且美女環繞的奢華生活後，他發現花錢的欲望是沒有盡頭的，因此從一開始就不該引燃那無限的欲望。作者推廣「八分飽」的幸福：愛物惜物，與單一對象交往，定期旅行，就能夠感受幸福。擁有足夠的愛、食物、社交生活，都是促進你成長不'
  merge: -1
  img_proc: true
- pgno: 7
  md: '可或缺的能量，除了這些必要的人事物之外應該全部捨棄，面子不值半毛錢，也用不著希冀得到所有人的稱讚，只要身邊的人懂你，就是最理想的八分飽狀態。


    # 二、存錢：緊急預備金


    作者是一名成功的創業者，但他一開始不是教你如何找客戶、建立品牌，他說你要先存錢。存多少呢？兩年不工作也沒問題的緊急預備金。遇到疫情或景氣影響收入，許多人怨聲載道，但作者說本來就不可能每年都順風順水，而你可以事先做好準備。先存下這筆緊急預備金，接下來才能談賺錢。


    # 三、賺錢：先存軍費


    假如已經存夠緊急預備金，那要賺錢的第一步是什麼呢？還是存錢！你應該存下三年可支配所得當作你的「軍費」。例如，你每年可以存三十萬元，那目標就是要先存九十萬元。軍費指的是用來增加未來收入的錢，也就是你賺錢的本金。用途有兩大塊：投'
  merge: -1
  img_proc: true
- pgno: 8
  md: '資與創業。投資可以拿去買股票、基金、房地產等。創業可以用來採購商品，或是當作網站的外包裝。


    # 想創業，先從副業或兼職開始吧！


    關於財務自由，作者建議：等你每天花一到兩個小時的副業或投資成果能夠超過公司薪水，這時候你才有資格考慮辭職。那麼，副業有哪些可以做的呢？


    自由接案賺錢是最佳選擇。你可以一邊繼續公司的工作，一邊利用下班和假日時間從事副業、兼職。例如：當中間商，高價轉賣低價採購來的商品；當部落客寫文章賺聯盟行銷收入；提供影片編輯服務；當程式設計師替客戶寫軟體、架設網站；還可以開設線上收費課程，例如攝影、寫作、咖啡教學等。尤其受到全球疫情影響，今後遠端工作、線上教育、遠距醫療、在家消費的需求將會愈來愈多。


    羨慕作者現在的財務自由嗎？書中還詳盡介紹了許多花錢、存錢與賺錢的原則，跟著他一步步執行吧！作者說大多數人都沒在準備未來要使用的「軍費」，因此即使過了五年、十年、二十年，仍然過著相同的人生。你想改變？就從今天開始行動吧！'
