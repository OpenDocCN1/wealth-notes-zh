- pgno: 29
  md: '接下來我將把自己過去的經歷，在有限的篇幅內盡可能在本書與大家分享。其中包括了許多失敗的例子，或許大家比較難從中找到成功的範例。老實說，我前幾天才剛賣掉部分股票停損，這次賠了兩億日圓。這個金額不是未實現虧損，而是實實的已實現虧損。


    我對於金錢的哲學，全都來自自我身諸多實際的失敗經驗。我想，把我的失敗經驗鉅細靡遺地分享給大眾，並將這些失敗帶給我的深刻教訓告訴大家，才是傳授我所領略到的「金錢的真理」最好的辦法。


    拿起這本書的你一定很在乎錢，想必平常老是在想要怎樣才能成為有錢人。為了回應諸位的期待，我認為自己應該毫無隱瞞地寫出「真心話」。在此，我必須先聲明我過去有不少不光彩的歷史，或許會令各位讀者感到不悅，還請多多包涵。


    # 砸錢買高檔車，錢就成了「死錢」


    接下來我想請你一起模擬體驗我的人生。


    電視等媒體會定期介紹我在杜拜的海外生活，看到我生活在各國大量置產的豪宅內'
  merge: -1
  img_proc: true
- pgno: 30
  md: '的模樣，你或許會心想「與澤這個人花錢還是一樣不手軟呢。」如今或許還是有很多人認為我是拜金主義者。


    我的確認為錢很重要，也對金錢抱持敬畏的態度。但是，現在的我與拜金主義者完全扯不上邊。


    拜金主義是把滿足物慾、情慾、對名利的渴求視為第一優先。有這類想法的人想要成為有錢人，住進摩天大樓頂層，出入有名車代步，跟知名女明星交往。


    這個人如果是經營者，就會想要成為上市企業老闆，在市中心最貴地段蓋豪宅，跟藝人結婚，建立龐大組織並凌駕於眾生之上，贏得名聲或成績，受到無數人的吹捧。


    但這種想法是一種危險的欲望，因為它會使人無視本質上的關鍵，變得短視近利。繼續這樣下去，財富一定會遠離你。你愈努力想要打腫臉充胖子，就愈是會失去財富。這也是我親身體驗過的事實。對，前面提過的所有欲望，我以前全都有過，然後我的下場就是破產。


    因此，現在的我完全沒有這類欲望。我猜一直以來追蹤我社群網站的讀者接下來可能要反駁了，所以我趕快先招供：沒錯，我目前仍然擁有勞斯萊斯和法拉利。但那些車是二〇一六年四月購買的，已經開了四年，而且一整年裡只會開上幾次，'
  merge: -1
  img_proc: true
- pgno: 31
  md: '目前放在杜拜當裝飾品。在曼谷新買的車只有用來載老婆小孩的豐田 ALPHARD，我的手錶也全是別人送的禮物。現在的我對珠寶飾品、豪奢精品、知名度與名聲、美女伴遊之類的，已經一概不感興趣了。


    六年前，也就是二○一四年的春天，我解散了當時經營的公司，幾乎身無分文，從零開始在海外建立了如今的資產。我最先移居到新加坡，接著搬去杜拜。當時是二○一五年到二○一六年初，那時期的我的確多少還留有在日本時的物慾與散財惡習、低水準的欲望與壞習慣。


    但是，如今的我由衷認為過去花在高檔車與豪奢名錶上的所有錢都是「死錢」。已經做過的事無法挽回，為了避免忘記自己得到的教訓，我決定現在的车子要開到壞掉為止才換車。我不再把東西賣掉變現然後忘記，而是改變習慣，盡可能地愛惜物惜物，延長物品的使用期限。


    後來的四一年，我連一輛高檔車都沒買，這幾年的想法也有了急速的改變。


    提到這幾年發生的事情，我能想到的只有我那個三歲兒子的出生。可以說，那孩子的出生為我的生活方式帶來了很大的影響。'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# 人的欲望沒有界線，並非所有欲望都要滿足


    至於我為什麼一直強調高檔車、高級手錶，因為這些都是浪費錢的代表。正如本書開頭所說，為了告訴各位我領略到的「金錢的真理」，我必須與各位分享自己從過去經驗中學到的一切。


    根據這些經驗，我可以告訴你：當男人沉迷於高檔車與豪奢名錶、女人沉溺於名牌精品與美容整形之時，這個人今後就不會再進步了。


    沉迷於其他類似的高檔嗜好、奢侈品也一樣。原因在於，人的欲望沒有盡頭，它會逐漸扭曲變形，像黑洞般無邊無際，最後成為怎麼也無法滿足的無底深淵。你會產生嚴重的錯覺，明明不需要的東西卻會認為自己非需要不可。


    此時如果你任由欲望擺布，首先瓦解的就是你的心靈，緊接著你的財富將隨之見底。所以，從一開始就不該貿然引燃那無限的欲望。當一個人未曾見過欲望的盡頭是什麼模樣，就能甘於樸實的幸福。然而一旦點燃了欲望的導火線，想要中途喊停就沒那麼容易了。舉例來說，各位曾在電視上看過不斷美容整形、已經看不出原本面貌的人，還有每半年就換新車，不知換了幾輛高檔車還洋洋得意的人吧？那就是欲望變成黑洞的狀'
  merge: -1
  img_proc: true
- pgno: 33
  md: '態。我認為再怎麼有錢，都不應該做出這些行為。


    這些人為了追求新刺激與虛幻的理想，腦子逐漸麻痹陷入錯亂；到手的東西立刻就厭膩，這種狀態就跟永遠無法壓足的活屍一樣。到了這個地步，就算再得到新的人事物，他們也永遠不會滿足。冷靜思考的話，每個人應該都能夠理解欲望的黑洞有多危險，而一旦自己成了當事人，任何人都有可能陷入那樣的危險。


    我沉沉迷於毒品應該也是同樣的情況。因為找不到滿足的臨界點，所以無法戒除。看到民眾在茶餘飯後討論的那些吸毒成癮者，往往是活躍於各界、令人羨慕的天之驕子，就知道這些人也是落入了相同的陷阱。人在登上成功頂峰的途中會遇到的風險之一，就是名為「欲望」的黑洞。


    我的結論是，個人沒有極限的欲望從一開始就沒有必要去理會，因為你能得到的只不過是一文不值的「自我滿足」。不去靠近危險的黑洞，自然不會產生不好的影響。


    # 有錢人花出去的每一筆錢，都是為了帶來新的收入


    我現在的年收入，換算成日圓的話，大約是五億到十五億日圓（約新台幣一億三千'
  merge: -1
  img_proc: true
- pgno: 34
  md: '多萬到四億元）的程度。金額之所以不是固定數字，原因在於自營業本來就收入不定，再加上不同年度的投資收益也有很大的落差。


    現在我個人，在曼谷每個月的開銷大約一萬泰銖（約新台幣九千元），相當於三萬五千日圓。主要的用途是每天在住家附近的便利商店購買一杯四十五泰銖（約新台幣四十元）的咖啡。每個月我從銀行領出一萬泰銖，晚上完全不去聲色場所，只靠著這筆錢過一個月。這筆錢恐怕比大多數閱讀本書的讀者一個月的零用錢還少。


    各位在電視媒體看到我的奢華生活，其實只是娛樂效果，不過是我日常生活的一小部分。在攝影機前刻意大手筆花錢，大多是為了製造節目效果。所以這麼做，是因為人們喜歡看鋪張奢華的場面。我的經驗告訴我，這類矚目對於我今後中長期的經濟發展有好處；畢竟現在是社群網站的全盛時期，無論你喜歡或不喜歡，這股潮流今後仍會繼續增強。在這種情況下，社會大眾都認得你固然有不少壞處，但排除這些壞處之後，結果仍是利大於弊。


    比方說，拿起這本書的你或許就曾在電視或 YouTube 看過我。很有可能就是因為你在社群網站或電視上看過我，才會想要讀這本書。


    總結來說，我根據過去上過許多電視、報章雜誌、廣播節目、網路媒體等得到的經驗'
  merge: -1
  img_proc: true
- pgno: 35
  md: '驗，確信了一件事：「讓眾人認識我」或「成為受人矚目的人」，好處絕對比壞處多很多。因此，看完本書之後，如果你真心想要重來過，我建議你趕快上網公開分享自己的想法與行動。試過之後你自然就會察覺，這麼做會對你的經濟帶來什麼樣的好處。所以，不管你是要匿名或不放大頭照都無妨，重點是先讓這個世界看到你的存在。要完全掌握在網路世界走紅的祕訣必須花上幾年時間，所以我建議你盡早開始比較妥當。

    這就是我自身深刻的體悟。世人喜歡看到豪邁撒錢或打扮得花枝招展的人，因為人們想要看不同于一般老百姓的生活，而我就是在回應他們的需求。只要能夠藉此獲得合理投資報酬率的利潤，我就會配合這種需求演出。

    但是，為了獲得世人的矚目，沒經過深思熟慮就亂花錢，很容易造成入不敷出。所以，我在媒體前表演揮金如土時，大多把錢撒在不動產這類穩固的資產上。實際上我半數的不動產將來都打算脫手變現，現在先放著也有租金可賺。由此可知，想要獲得世人矚目不能只是漫無目的的撒錢。持續動腦思考如何不花無效成本又能夠贏得知名度，才是我要告訴你的重點。'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# 致富心法


    # 2


    # 金錢帶來的快感，容易麻痺人的思考


    ※認識金錢的可怕副作'
  merge: -1
  img_proc: true
- pgno: 37
  md: '那麼，既然我有錢，為什麼不像以前那樣過著豪奢的生活呢？並不是因為我的欲望都已經獲得滿足。我前面說過，欲望這種東西本來就很難徹底滿足。容我再重申一次，人類的欲望沒有極限；一旦開始拘泥於社會地位之類的欲望，你就會不停地追求，宛如恐怖電影裡嗜血的活屍般，直到遭受重大打擊為止。對於欲望的盡頭，無知便是福。與無窮盡的欲望往來，只會使你重要的錢財徹底枯竭。


    也就是說，金錢有一種「魔力」，它能點燃欲望，使人跌落谷底。擁有一大筆財富，當然能夠實現自己的諸多欲望，但它同時也在摧毀你的心靈。


    我在日本時為什麼會失敗？在反省自己過去行為的過程中，我了解到比起錢帶來的喜悅，錢給人帶來的更多是走向自我毀滅的危機。


    此外，錢想賺多少就有多少的想法，完全是妄想。每個人能夠有效率賺大錢的機會雖然因人而異，但不管對任何人來說，這種可以賺大錢的機會都不持久。諸行無常，萬物經常在改變，縱使是天才也無法讓自己成為永遠的贏家，因此每次創造出來的珍貴財富如何能夠守住、增加，才是更重要的課題。


    過去的我對錢很執著，只想靠錢解決問題，懶得動腦，一旦沒錢就什麼也不會；再加上我以爲錢這種東西只要再賺就有，從未認真地面對錢，結果就是被錢徹底拋棄。'
