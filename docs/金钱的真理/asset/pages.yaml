  md: '裝成一般新聞報導的企業置人性行銷……真要一一列舉的話，實在是不勝枚舉。


    我把這些全都稱為「甜蜜陷阱」。甜蜜陷阱原本的意思是，女間諜利用美色接近政客或外交官，掌握其弱點獲得機密情報，一般稱為桃色陷阱。而以誘人的字句誇大宗商品的效果，誘使消費者花錢的行為，就跟前述的「甜蜜陷阱」一樣。各位千萬要記住，這世上九九%的宣傳廣告，都是甜蜜陷阱。問題在於，多數人都是「心甘情願」自投羅網。最具代表性的例子就是電視購物節目。電視購物的特徵就是主持人會連珠炮地喊著乍聽之下非常划算的關鍵字，例如：「每月只要三千日圓」、「限量三百個」、「分期零利率」、「現在買還加送這項商品」。聽著這些煽動人心的台詞，電視前的觀眾忍不住就會上鉤，心想「每月才三千日圓的話，那就買吧」，掉入商人的陷阱。


    分期付款的每月分期金額愈低，商品賣得愈好，所以主持人只會不斷強調「每月只要多少錢」。在我看來，這很明显是電視購物業者慣用的伎倆，用來引誘觀眾掉進甜蜜陷阱。但是，看著那些趨之若鶩的人，你真的會忍不住懷疑「他們是故意掉進那些陷阱的嗎？」「明明應該努力增加可處分所得，卻隨便亂花錢，這樣資產怎麼可能增加？那些買回家的商品很快就會成為廢物，但你卻仍要繼續支付它的費用，還真是一筆冤枉錢。


    因此，掏錢買東西之前，請務必三思再三思。'
