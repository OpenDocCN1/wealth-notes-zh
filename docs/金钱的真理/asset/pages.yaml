- pgno: 162
  md: '# 收入分散成多個來源，才能夠長长久久


    從多方來源取得收入，才是常保成功的祕訣。這麼說的我，也是從名下眾多不動產收取租金，外加股票股利、公司債分紅、保險的當期收益率等，以廣泛且分散的收入累積財富。為什麼要這麼做？因為只靠單一來源的收入，很有可能斷糧。假如你習慣只靠單一收入來源，遇到像這次新冠肺炎疫情的情況時，就會陷入危機，這一點顯而易見。


    另外，只有單一收入時，你就會變得偏執貪婪，也很容易向利益關係人要求拿到比較多的利潤。這樣一來，利益關係人就會覺得你很難搞，最後決定減少與你做生意的機會。相反地，假如你的收入來源分散，你對自己分到的那一份利潤在某種程度上就很容易滿足，也不會想要從中獲得更多。以結果來說，你的生意夥伴就會覺得：「這是一場愉快的交易。」


    由此可知，「使對方覺得有利可圖的交易」才能夠讓雙方長久持續合作下去，到頭來得到好處的仍然是自己。所以錢不見得拿愈多愈好。假使後續沒有繼續合作的機會，整體算起來你能獲得的利潤還是減少了。做生意時最重要的不是追求單次交易就賺大錢，而是能夠與對方長期合作；即使每次的獲利不高，但長時間累積下來的利潤更大，'
  merge: -1
  img_proc: true
- pgno: 163
  md: '這才是雙贏的做法。只要你能夠這樣想，完全沒有必要從公司發的薪水，以及私人時間從事的副業收入二選一。如果你辭掉了其中一份工作，反而比較危險。


    # 別人的成功經驗很難複製


    我也不是不懂想創業的人的心態。知名的富豪之中，有许多人是藉由成立新企業致富，他們也留下許多淺顯易懂的成功故事。


    比方說，談到孫正義先生的書，經常會提到軟體銀行成立第一天的那個知名小故事。那天孫先生站在橘子木箱上，對著僅有的兩名工讀生演講：「軟體銀行將在五年內成為市值一百億日圓，十年達到五百億日圓，總有一天變成一兆日圓的公司！」另外還有一則很有名的小故事，孫先生在高中時，沒有事先預約就直接跑去見日本麥當勞控股公司創辦人藤田田先生，問他去美國留學應該學什麼，徵詢對方的意見。


    問題是，孫先生創業是在一九八〇年，距今已經四十年之久；那個時代沒有背景的人想要從零開始成功，就唯有創業一途，別無他法。當時孫先生被吹捧為日本新創先鋒。到了現在，時代背景已經迥然不同。孫先生的例子在統計學上來說是例外，那是天'
  merge: -1
  img_proc: true
- pgno: 164
  md: '才才有的成就。想擁有這樣的成就，你首先必須具備一般人想象不到的謙虛。


    除了孫先生的例子外，民眾也經常吹捧時下的成功人士，但我覺得最好別因為這類成功故事而過度期望。俗話說：「一樣米養百樣人。」「一百個人對事情的看法也有一百種，有多少人就有多少個性、多少長相。人的確可以大略分成幾種類型，但仔細觀察過後你會發現，即使是同一類人還是有些微的差異，擅長與不擅長的領域也各有不同。再搭配上映時代環境與個人背景，好不容易才能誕生出一個特殊的成功案例。也就是說，成功故事這種東西，終究與人類的誕生同樣不可思議，也不可能複製。


    比如說，我的兒子名叫「麗」。為什麼「麗」會在「那個時間點」誕生，我也無法解釋。我射入妻子體內的精液之中，只有一顆精子抵達卵子受精，變成麗的長相、聲音、個性，我和妻子是後來才知道當時已經受孕。假設之後麗的弟弟或妹妹出生，也可能與麗一模一樣。也就是說，即使是親生父母也無法控制孩子的模樣。


    同理，某個人在不同時期做同樣的事，也不會得到同樣的結果；因為對當事人來說，各時期的狀況不同，同樣的機會不會再來第二次，而且還要加上運氣。所以自以為能夠控制成果（小孩）的父母實在是太愚蠢了。成果是老天根據你的努力，事後才給你的東西，那並非我們事前就能按照自己的想法掌控的事。'
  merge: -1
  img_proc: true
- pgno: 165
  md: '因此，聽了街頭巷尾流傳的成功事蹟就想要複製，結果只是浪費時間罷了，我勸你最好別這麼做。勉強用不適合自己的方式想要獲得成功，反而會帶來負面的效果。


    當然，因為嚮往那些成功人士而受到激勵或得到靈感是件好事，但成功的方法還是必須要靠自己摸索。


    # 人們很少談失敗的例子


    老實說很少有人第一次創業就成功。很多上班族用努力存下的錢當作資本，辭掉工作跑去創業，但創業的一百個人之中，最多只有五個人會成功。這一百個人裡，有九十五人的公司會倒閉，而且當中一部分的人會背負鉅額債務。另外有些人則會二度挑戰創業然後成功，但這也只是極少數的例子。絕大多數人都是認清現實之後，重新回到職場去當上班族。


    我自己是從學生創業起步，因此聽過、看過不少認識的人或朋友的例子，多到不計其數。一般人只看到成功的例子，卻不知道背後累積了多少屍橫遍野的失敗，那是世人不知道的事情。創業失敗的機率明明很高，想創業的人卻絡繹不絕，原因之一就是日本'
  merge: -1
  img_proc: true
- pgno: 166
  md: '政府的獎勵創業政策，內容包含各類補助金、援助款等，提供創業者資金援助。想要創業的人都把這筆錢當作獨立創業資金，用來租借辦公室或店面。


    但是，我對接受這類補助才能創業的人，抱有很大的疑問。


    以我的個人經驗來說，創業不應該靠別人的援助。成功人士只要一想到好商品，在考慮創業之前，就會先用網路等管道出售該商品。在還沒有辦公室也沒有事業計畫書之時，私人帳戶裡已經有一百萬日圓起跳的營業額。有了這種程度的營業額，轉為法人比較有利，因此才會決定「好，我就來開公司吧！」亦即他們在動腦仔細思考之前，就已經先一步採取行動了。


    反之，一般人的做法是先走去日本政策金融公庫諮詢，取得資金援助租下辦公室之後，才說：「好，來賣東西吧！」這樣太缺乏效率與真實感，跟不上現實的競爭，自然不會成功。


    所謂的創業，是在沒有路的地方開路。當你考慮接受別人援助的那一刻，就已經不合創業，你應該對這一點有自覺。另一方面，創業這件事也沒必要想得太隆重。做生意只要有兩個要素就足夠，即擁有自己的媒體，以及把商品放上媒體宣傳。只要有這兩點，就能夠做生意。'
  merge: -1
  img_proc: true
- pgno: 167
  md: '以我自己為例，我擁有追蹤人數眾多的社群媒體，因此我只買採購或創造商品放上社群，就能用很簡單的方式做生意，不需要辦公室也不花宣傳費用。


    我之所以一直強調「個人品牌時代」，是因為現代網路的基礎建設完善，每人都能夠輕鬆擁有這兩項要素之一的「媒體」。因此我只需要思考另一個要素，也就是「商品」即可。結論就是，創業不需要大張旗鼓建立事業計畫，也不需要準備龐大的資金，以及看起來很厲害的組織架構，這些都沒有意義，沒事自找風險的時代早已過去。


    # 上班族辭職去開拉麵店當然很危險


    由這個話題繼續延伸，我們來看看看一般人最愛開的餐飲店，例如拉麵店，情況如何？


    我們經常聽到上班族辭職去開餐廳的例子。尤其是愛吃拉麵的上世族之中，或許有


    27 Japan Finance Corporation, 簡稱 JFC。由日本政府管轄的特殊金融機構，主要業務內容是提供國民、中小企業、農林水產業資金貸款等。'
  merge: -1
  img_proc: true
- pgno: 168
  md: '不少人都想開一家自己的拉麵店，賣自己認為好吃的拉麵。


    但是，開拉麵店成功的機率非常低，差不多只有一成。目前光是日本國內就有好幾萬家拉麵店，當中大約有九成據說會在三年內關門大吉。剩下的一成在三年之後能否存活，至今也仍是未知數。


    因為開拉麵店的前期投資費用高，要讓拉麵店延續到賺回前期投資的成本為止，非常困難，幾乎沒有三年就足以回本的例子。九成的人才剛開拉麵店就已經虧錢或負債了。知名度不高的拉麵店，如果店面不是位在地鐵站徒歩十分鐘的範圍內，如果沒有特殊的點子，根本毫無勝算。開店的前期投資成本包括店面保證金、首月月租等不動產開銷大約就要三百萬日圓，再加上內外裝潢的工程費五、六百萬日圓，廚房設備與廚具一百萬日圓，還有傳單等的廣告宣傳費……至少也要準備一千萬日圓。


    很少有上班族能夠一口氣拿出這些錢，不夠的部分他們就會去向金融機構貸款。假設你借了五百萬日圓的開業資金準備開店。


    可是餐飲店在開店之初就能賺錢的例子少之又少，虧損大概會持續半年。如此一來，你的負債從一開始的五百萬變成八百萬、一千萬，愈欠愈多；即使好不容易在半年後轉虧為盈，仍然必須持續好幾年都是獲利，才足以填補負債的部分。等到你順利還清'
  merge: -1
  img_proc: true
- pgno: 169
  md: '負債，這時才算打平前期投資成本，站起跑點。淨資產就是從這裡開始累積。每個月都有支出，又希望在納稅後能出現淨利，原本就很困難。因此，想用拉麵店擴大淨資產，只能算是癡人說夢。


    而且這裡的假設是你的拉麵店每個月都有獲利，現階段你的店在半年後能否轉虧為盈都還不清楚。虧損期拖得愈久的話，加上前期投資累積下來的營運成本虧損，就會使經營出現赤字；有時不得不在負債累累的狀況下把店收掉。


    上述是三年內會倒閉的九成拉麵店實際要面臨的情況。想靠開拉麵店致富，其實沒有你想像中的容易。街頭巷尾經常聽到某人開了拉麵店很成功、店裡總是高朋滿座等，但我勸你最好別因此起心動念想效仿。開店有客人上門光顧是理所當然的，但即使店裡有客人，從店外也看不出店家的收入是否足以維持開銷。


    即使有客人上門，卻仍不足以支付店裡的開支，才是做生意的常態。


    事實上，根據國稅局的調查，日本國內約有兩百七十個法人，當中有六到七成的營收是赤字。繳完稅有了淨利，用來償還貸款，回收前期投資之後，才終於能夠開始累積淨資產。這個過程有多麼困難，希望各位要有所心理準備。


    準備。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# 接受融資不保證一定成功


    我們經常在新聞上看到，金融機構即將擴大無擔保融資，協助因肺炎疫情發生資金週轉問題的企業主。提到這件事，我想跟各位聊聊融資。


    首先，在不動產投資等商業世界有個風潮，就是將「導入融資」視為成功。對此我十分懷疑，原因在於取得融資與「核撥貸款」，簡單來說是一樣的。能夠「平白得到」三千萬日圓的話，你當然可以盡情高興，但如果是「借到」三千萬日圓，在我看來，代表接下來將有一條艱辛的路在等著你。


    假設你接受三千萬日圓的融資購買不動產，你只不過是背負了三千萬日圓的鉅額債務罷了。然後你從這個不動產收取房租，一點一滴花很長一段時間攤還那筆債務。如果考慮到還有利息的話，你要償還的就不只是三千萬日圓。仔細想想，這只能說是地獄的開始。


    假如你的房子在還債的過程中發生火災怎麼辦？地震來時能夠挺得住嗎？房客如果因為房子捲入某些意外事件，你要怎麼辦？房屋設備發生意想不到的故障時，費用你能負擔嗎？諸如此類，你將與這些不安共處許多年，直到債務還清之前都不能鬆懈。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '另外，我們也來看看融資申請不過關、傷害反而輕微的例子。舉例來說，世界各地現在應該隨處可見受到新冠肺炎疫情影響，導致公司營業規模縮小，每天只是不斷地付營運成本，老關們為了支付這些成本而去借錢。這個時候如果沒有取得融資，馬上得考慮裁員，有些情況還必須停業或宣布倒閉，才能避免債務持續擴大。但還是要考慮到融資可能導致業主最後反而欠下一大筆債務。


    融資聽起來很好聽，但說穿了就是借錢。電視連續劇裡經常出現某個角色苦苦哀求「別中止融資」或「拜託您追加融資」等場面，我看到時總是在想「融資就是借錢啊！」你不應該拚命借錢，應該要認真創造淨利才對」。說起來，一家公司如果不繼續接受融資就經營不下去，代表其實已經有很大的問題。假如問題無法輕鬆解決，就不該用融資來延續公司的生命，應該盡快把公司收掉才是。這麼一來債務人和債權人的損失才不會更加慘重。


    歸納起來就是這麼一回事：融資既不是你的營業額也不是獲利，只是債務，只是別人的資本，負擔很大，而且你必須要償還。因此你不應該為了得到融資而高興，別高興得太早，也別誤解了融資的意義；真正值得高興的時間應該是在年度結算出現淨利時。


    另外，人類基本上習慣把手邊有的錢全部用掉，這是永恆不變的真理，請你務必記'
  merge: -1
  img_proc: true
- pgno: 172
  md: '住。沒錢的話就會想其他辦法解決，可一旦有了錢，人們就會全部花光光。


    所以日本政府才會預先扣下你的所得稅、健保費等重要的國庫收入。國家不信任納稅人。政府也知道假如一開始就給國民全額薪資，並且提醒你：「別忘了留點錢繳稅。」「大家基本上還是會有多少就花多少，把錢全部花光。這麼一來，即使政府擁有課稅權也沒意義了。


    我想說的是，我們要反過來利用這種人性，事先從收入扣掉一筆錢存起來。


    我在十幾歲時就用這個方法存到七百萬日圓。當時我不用信用卡，工作的月薪大約三十萬日圓（約新台幣八萬一千元），一年九個月的薪水我一毛錢也沒花，全都存起來。最後這筆錢成為我大學時的創業資金，使我年紀輕輕就累積許多經驗，也大大改變我往後的人生。


    嚴格說來，我真心認為，無法存錢的人本來就不具備成功的天賦。另外，我也認為無法創造利潤的人沒資格做生意和投資。存錢是首要之務，接著是創造利潤。得到融資不是什麼值得高興的事。'
  merge: -1
  img_proc: true
- pgno: 173
  md: '# 致富心法


    18


    邊做正職工作，邊用「副業」賺錢


    ＊沒做過副業就突然創業容易失敗'
  merge: -1
