  md: '房子等級、職業的社會地位，因此從屬性來說，港區女與女公關沒有兩樣；她們很懂得深層心理，讓你沉溺在自己很了不起的錯覺中。你如果打腫臉充胖子與她們交往，荷包就準備大失血。


    而且，有些港區女會讓你在不知不覺之間逐漸墮落。例如，不自覺地愛炫耀，或是想要強調自己比其他男性更優……只把力氣花在這種無聊的事情上，成為一個膚淺的人。另外，如果你已經是「大叔」，為了不輸給年輕又帥氣的男人，很有可能會靠砸錢充場面。因此我可以斷定，港區女在你要成為真正有錢人的過程中，完全可以說是百害而無一利。假如你就是喜歡港區女的長相，也别擔心，這樣的女人每年都會大量生產製造出來，品質也總是控制在一定的水準範圍內，等你奮鬥三年後再選一個交往，也還有機會。


    如果你打算花三年存到三百万日圓，並用這筆錢改變沒有夢想也沒有希望的人生，現在顯然不是你追著那些港區拜金女屁股後面跑的時候。基本上想要得到某些東西，就必須有所割捨，你需要徹底習慣這樣的斷捨離。不僅是摩天大樓和港區女，所有不需要、不迫切的欲望，現在請全部丟掉。為了將來可以好好滿足那些欲望，現在請先努力存錢。但不可思議的是，當你達成目標的時候，往往早就忘了過去那些膚淺的欲望。


