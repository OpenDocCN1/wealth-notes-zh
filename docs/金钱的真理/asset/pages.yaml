- pgno: 255
  md: '「無法直接增加財富」——卻——很——重——要——的——行——動


    # 致富心法


    ![](img/e54da6402e644e0f166460ffacd9d1c4_255_0.png)


    有愈多時間思考的人，

    愈有可能持續賺錢'
  merge: -1
  img_proc: true
- pgno: 256
  md: '想要成為真正的有錢人，可以採取兩種行動：「可以直接增加財富的行動」、「無法直接增加財富卻很重要的行動」。


    前面我一直在談的都是「可以直接增加財富的行動」。接下來我將針對另一項「無法直接增加財富卻很重要的行動」舉幾個例子說明。


    首先是思考的時間。我在日常生活中總是在思考，例如：因為新冠肺炎疫情影响而發生經營危機的公司有哪些？有沒有業績反而逆勢上揚的公司？金融機構損失慘重嗎？假如他們損失慘重會發生什麼嚴重問題？日本政府做了哪些限制？中東糾紛如何發展？我持有的不動產價格是否會下跌？杜拜世界博覽會延期造成的影響是好是壞？有機會發展在家遠距工作嗎？像這樣沒完沒了，不斷地回答腦子裡接二連三拋出來的問題。


    # 經常自問自答，對世界常保好奇


    有時候這樣一直自問自答，最後不見得會得到明確的答案。但我仍然持續思考。上廁所時、搭計程車時、用餐時，即使是看電視的時候也一直在思考。我對自己提出疑問，並針對該問題回答；因為回答沒有期限，有時在答案想出來之前也會中斷思考。偶'
  merge: -1
  img_proc: true
- pgno: 257
  md: '爾也會從突然看到的新聞或社群網站發文，找到有助於自己找到答案的提示。


    我想這是因為我時時打開天線吧。在平日的生活中，我就是不斷地對自己提出疑問，同時找尋著答案。


    的確，問自己再多沒有結論的問題，錢也不會增加。但正因為我經常在日常生活中這樣自問自答，所以面臨決策時，我總是能夠一針見血、明確地做出決定，並且順利執行。


    另一個與思考時間有關的就是：「故意不賺錢」的時間也很重要。


    開始賺錢之後，你是是否會覺得沒賺錢的時期是低潮期？像是「昨天賺了多少錢，今天卻完全沒賺錢」。但是，這裡也有需要注意的地方。


    我絕不是在說能夠持續賺錢就是好事，我想表達的其實是：當你愈想一直賺錢時，反而愈無法持續賺錢。因此，如果你想要持續賺錢，請安排一段時間「故意不賺錢」。這樣做，你思考的時間就可以增加。當你思考的時間愈多，就愈有可能持續賺錢。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 没必要一味地追赶新事物


    想要赚钱时，你的视线总是会看向新事物。但这也是陷阱之一，请务必小心。


    这世上，新术语接二连三不断地出现又消失。例如：區塊鏈（Block Chain）、人工智能、5G 行动通讯、数位转型（Digital Transformation）……这些关键字之中，的确有些东西已经成为社会潮流，但问题在于这些东西是否真的改变了世界。「區塊鏈」这个词最流行的时候是二〇一七年左右，三年过去了，世界并没有因为區塊鏈技术而有了不同的样子。也就是说，人们往往操之过急，去接触那些号称「世界最先进」、「前所未有的商品或公司，白白浪费宝贵的时间和金钱。但那些新技术究竟有害归无害，是否真的有用还不知道。


    结论就是，没必要为了赚钱而进入世界最先进的领域。若问我要如何选择，我认为最重要的是先攻克早就已经存在、无可动摇的领域。


    举例来说，最近出现一种机器人顾问。所谓机器人顾问，一言以蔽之就是利用全自动的 AI 代替客户投资的服务。也有提供投资建议的机器人顾问。


    现今媒体大肆报导机器人顾问，极力推荐投资新手采用，但我对此完全没有好评。'
  merge: -1
  img_proc: true
- pgno: 259
  md: '舉個例子：東京電視台的晨間財經節目《早安衛星新聞》中，曾經用機器人顧問預測當天日經平均股價範圍。但就我所見，它們的預測不是很準。一般人以為無所不能的AI機器人，在現實生活中也不過爾爾。看樣子人工智慧的發展還需要很多時間。


    機器人顧問雖然能夠學習並善用大數據（大量統計），但它們目前的用途只能提供符合常識的提議。也就是說，它們雖然不會發生重大失敗，但也不會真的幫你賺到錢。當然，新手要投資股票的話，交給成功率在平均值範圍內的機器人顧問幫忙，或許比較保險。但正如我前面提過的，沒有親身體驗過投資的話，就無法讓自己的技術進步。因此在我看來，靠機器人顧問幫忙投資毫無價值。


    我好奇的反而是機器人顧問的交易日紀錄。我想知道AI自行交易的股票當中，有哪些股票股價上漲、獲利多少、哪支股票賠了多少。只要看過這些紀錄，我也能夠學到東西。就當作是為了即將到來的AI共存時代做準備，我想拿十萬日圓（約新台幣兩萬七千元）讓機器人顧問代操作看看，順便研究它們是如何交易的。結論是，人工智慧畢竟也是人類在操控的東西。從現在開始，慢慢找到與人工智慧和共處的方法很重要。'
  merge: -1
  img_proc: true
- pgno: 260
  md: '# 致富心法


    28


    # 窮人總是懶得做準備


    成功者不會吝嗇為將來播種的努力'
  merge: -1
  img_proc: true
- pgno: 261
  md: '前一節我提到增加財富的行動可分為兩種。多數人都是臨時起意而創業，或是像無頭蒼蠅般經營，或者看了財經新聞就去買股票，只採取可以直接增加財富的行動。


    但是，不能直接增加財富的研究類行動，反而能在事後為你帶來更大的回饋。關於這一點，只要你看過 Google 和亞馬遜的研究開發費規模，就能秒懂。研究開發費不會直接產生利潤，卻是催生新一代技術和商品不可或缺的投資。等到那些投資一個接著一個回收，就能夠替公司創造優勢。


    關於研究開發費， Google 投入了二・四兆日圓（約新臺幣六千五百億元），亞馬遜則是三・二兆日圓（約新臺幣八千六百億元）。這是比日立製作所等日本大型企業高出近十倍的金額。全球企業都想要的AI研究人才，據說
    Google 就擁有超過七百名。


    從這層意義上來說，投資十萬日圓在機器人顧問身上，檢查它的股票買賣紀錄，這個行為雖然不會立刻生出錢來，但我想能夠在將來為我帶來財富。我可以從它們買賣股票的行動邏輯學到東西，並成為自己將來投資時的提示。


    所謂的有錢人總是像這樣，整天都致力在不會直接變成錢的行動、為將來播種的行動。但一般民眾看不到這部分，所以才會覺得不可思議，心想：「那個人為何能辦到那種事？」殊不知成功者總是在背地裡不斷地持續探究。'
  merge: -1
  img_proc: true
- pgno: 262
  md: '別。


    簡單來說，成功者一直在做準備，這些日常的準備無疑就是有錢人與其他人的差


    # 打造「直覺↓執行↓反省」的自動循環


    一般認為，即使得到一定的成果，想持續獲得成果還是非常困難。但只要做到我接下來提到的心理準備，持續獲得成果並不難。


    首先，當收入增加，你必須為收入可能減少而更加兢兢業業。即使你擁有人氣商品或內容，也要將這種成功當成偶然的僥倖。這樣的心態就是我在本章開頭提過的「別相信你賺到的錢」。


    話雖如此，你賺的錢增加的確是事實，所以你必須思考如何讓下一個商品也能賺錢。有沒有比自己賣得更好的商品？有沒有能夠讓顧客更開心的東西？有沒有使利潤進一步增加的方法？即使縮短睡眠的時間，你也應該忘我地研究這些問題；在這個階段，貪心是重要關鍵。只要你能夠樂在其中，就能夠順利地執行。


    找到商品之後，接下來請加倍努力。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '只要看到前方有光，就必須一股腦地跟著光繼續前進，直到脫離黑暗來到地面上。


    要帶著「唯有這條路能救我」的心情努力不懈。


    假如下一個商品失敗，就要不停地思考有哪裡不足，是展示方式或文案寫法不好嗎？或是顧客覺得不夠稀有、不夠划算？像這樣反覆檢討之後，你就會明白「這個東西會熱賣、那個不會賣」，漸漸地掌握到賺錢的訣竅。


    等到你抓到「順利」與「不順利」的手感，就會開始打從心底覺得有趣。


    等走到這一關，你就不會再去思考「要怎樣才能夠繼續做出成果？」因為你已經沉迷其中，再也不去羨慕別人的成就，「好麻煩」、「好累」的負面思考也會消失。由此可知，懂得引導內心，使其發揮作用也很重要。


    在這個過程中你要做的，只有直覺、執行、反省這三件事。


    # 「直覺」比計畫更重要


    直到十年為止，大家還很重視「PDCA」這個詞。這也是豐田汽車等諸多企業採用的自我管理方法。P 是計畫（Plan），D 是執行（Do），C 是確認（Check），A
    是'
  merge: -1
  img_proc: true
- pgno: 264
  md: '# 改善（Action）。


    但我認為最重要的是，把 P 所代表的計畫換成「直覺、靈感」。總之就是決策要快，一想到就立刻進行，我自己也是這樣做。因為我早就料到單獨行動更容易成功，所以我靠「直覺、靈感」充分發揮單獨行動的優勢。如果是企業內部的一分子，就不可能全靠「直覺」行動了。


    靠直覺行動之後，不需要想得太複雜，再來只要「反省」就好。搭配數據資料，好好反省自己採取的行動結果如何。這是最重要的部分。


    多數人重視「計畫」，但計畫其實可有可無。你只要記住，想成為有錢人不需要計畫。因為你再怎麼計畫，事情也不會按照計畫發展，只是浪費時間罷了。


    靠直覺行動、反省之後，接著只要按照我前面提過的理論，找到如何改善問題的行動。在這個階段也不必想得太複雜，反省之後若有什麼發現，你會知道自己接下來應該怎麼做。接著，如果你又有了什麼新發現或新點子，自然就會很想要嘗試。憑著那股衝動去行動就對了。等到直覺、執行、反省能夠成為一個自動循環，勝利就離你不遠了。'
  merge: -1
  img_proc: true
