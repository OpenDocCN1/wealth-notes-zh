- pgno: 225
  md: '才能達成為目標，請參考我前面已經提過的內容，以及我接下來要寫的內容，自行找到適合自己的方法


    接下來我想談談擁有某種程度淨資產的人會有什麼問題。


    在這個階段你將會面臨下一道關卡。


    我在第一章提過松下幸之助的水庫式經營。重點是「景氣固然好，但經營不可以隨波逐流，必須為景氣惡化做好準備。把水存在水庫裡，配合需求放水，這才是你必須採取的經營方式」。


    現在，假設水庫已經儲好一半的水。


    你看到這個水量有什麼想法，將是你能否成為有錢人的重大分水嶺。


    人稱「企業管理之父」的彼得・杜拉克（Peter F. Drucker）有句名言提到「一杯子裡的水」。有一部日本電影以非常簡單明瞭的方式說明了杜拉克想表達的意思，我來介紹一下。


    那部電影就是在泡沫經濟全盛時期的一九八七年上映的《女稅務官》，導演是伊丹十三。《女稅務官》講述國稅局查察部調查員與逃稅嫌疑人之間的戰爭，是相當寫實的作品。津川雅彥飾演的國稅局查察部統括官花村，與山崎努飾演的逃稅搜查對象權藤英'
  merge: -1
  img_proc: true
- pgno: 226
  md: '樹，有過這麼一段對話：


    花村問：「要怎樣才能像你一樣賺錢？」權藤拿起裝威士忌的酒杯，這麼回答：


    「就是把錢存起來啊，花村先生，就是不花錢。」


    「你呢，一出席葬禮就包一萬，參加婚宴就包兩萬，對吧？你這樣子花錢，錢就不會留下來。」


    「就算你有在一百萬，只要你開始花，錢就會花完。然而只要不花錢，即使只有十萬，也能擁有完完整整的十萬。」


    「你現在就像在滿水的水龍頭底下放杯子想要儲水。水才存了一半，你就口渴把水喝掉。這是最糟糕的做法。」


    「你應該要等到水裝滿，即使裝滿也不可以喝掉。要等水滿溢出來了，你才可以舔掉溢出的水。在那之前你必須忍耐。」


    看到杯子里裝著半杯水，因為「已經有半杯水」而樂觀與因為「才只有半杯水」而悲觀，看法截然不同，而且解讀因人而異，有多少人就有多少種解釋。


    我舉個例子：你如何看待這次的新冠肺炎疫情？在你產生想法的那一刻，我認為勝負已定。在此提供我的解釋給各位參考：'
  merge: -1
  img_proc: true
- pgno: 227
  md: '「民眾開始注意起病毒，能夠大幅度降低自己與家人未來不小心罹患其他傳染病時的死亡機率。」


    「市場行情出現意想不到的谷底，正好趁此機會深入學習資金管理的重要性，最重要的是能夠增加股票張數。」


    「可以仔細思考後疫情時代的世界哪些事物會加速發展、哪些會被淘汰，進行大幅度的斷捨離因應變化。」


    就像這樣，即使是短期看來讓人感到絕望的情況，在我看來長期下來一定還是有好處。我在日本破產時、少年時期遭到逮捕時也是，不同的解讀會帶來不同的結果，可能是危機，也可能是轉機。


    還有一點很重要的就是，發生好事時你反而應該悲觀地解讀，保持謹慎態度，才能持續成功。


    由此可知，對事情的解讀將左右你往後人生的成敗，這一點也包含在金錢的真理中。'
  merge: -1
  img_proc: true
