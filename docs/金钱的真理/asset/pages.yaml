- pgno: 92
  md: '# 錢的「總量」不會變，改變的是流向


    法，改以高淨資產為目標，就必須先從否定年收入的神話開始。


    想要成為有錢人，必須先具備的理財素養還有一個。


    就是你必須有這樣的觀念——不管大環境再艱難，「錢的總量不會改變」。


    我有在投資，因此社會一旦發生重大變化，我就會想：「錢接下來會往哪裡移動？」


    舉例來說，新冠肺炎全球大流行之後，許多人表示：「經濟完蛋了。」出於這種恐懼，他們把所有投資都換成現金，只想著停損，並待在家裡避免外出。


    然而，我沒有因此感到恐懼，而是冷靜地分析哪些公司受到新冠肺炎疫情影響而業績下滑，而又有哪些公司的業績不降反升。


    由於世界各國正在實施邊境封鎖，禁止搭機搭船出國；政府也呼籲民眾避免參加活動，仰賴外國觀光客的觀光業、零售業、航空業、餐飲業都無可避免地遭受打擊。


    另一方面，很多人避免外食或外出，改採窩在家裡消費，因此提升了某些產業的生'
  merge: -1
  img_proc: true
- pgno: 93
  md: '意。例如：外送服務、串流影音服務、手機遊戲等。實際上，網路視訊會議系統Zoom的使用者也大幅激增。達美樂披薩也在疫情爆發之後，擴大了外送需求，因此宣布僱用五千兩百名員工，並以兼職人員為徵才重點。


    另外，根據CNN的報導，德國的成人性愛用品製造商營業額也比預期增加一五倍，尤其是義大利、香港、美國、加拿大、日本的需求量最高。報導中指出「長期單身或與伴侶被迫待在家裡，民眾開始摸索善用時間、好好享受居家時光的方法」。


    也就是說，有些公司業績下滑，卻也有些公司的業績逆勢成長。現在發生的這一切不過是變化。過渡期的錢往往都是這樣，一方之所得必為一方之所失，這就是賽局理論中的「零和思維」。零和思維的意思是正負加起來等於零。假設A團體的人虧錢變窮，B團體的人就會因為賺走A團體的錢而變成有錢人。


    過去有一段時期，我經常主張新富階級即將誕生。距今天約十年前，正好是雷曼危機結束時，我放棄生產衣服，改投入情報資訊產業，當時我預測接下來將是內容產業時代的高峰。我認為財富會從過去生產物品的人，流向生產內容的人，以及那些讓內容在新平台上流通的人。


    十年過去了，這樣的時代逐漸迎來盛世。Youtube就是其中一種，rose線上沙龍服'
