  md: '# 致富心法


    26


    不斷進行「小測試」


    訓練你的直覺力


    ※ 決策速度愈快，愈能提升成功率'
  merge: -1
  img_proc: true
- pgno: 247
  md: '前面舉了許多例子，我認為不管靠什麼賺錢，最重要的是「累積小成績」，以及藉此「訓練右腦」。


    遇到任何情況，我都是先憑直覺採取行動。聽到我這麼說，你或許會認為我是單憑靈光乍現的點子決勝負，但事情並非那麼簡單。


    一般人決定事物，是用左腦進行邏輯思考之後做出決定。例如：採購新商品時，客戶準備了A、B、C、D四個選項。你收集各選項的所有情報，包括：各有多少需求、標價多少顧客願意買、必須花多少廣告費宣傳等，在腦子裡整理過一遍，慢慢思考。


    但是這種做法要花上很長一段時間才能夠做出判斷。而且即使花了那麼多時間，也不見得保證就是最正確的選擇。


    相反地，右腦是負責直覺、靈感、感覺、靈光乍現等邏輯無法解釋的思考。假如有A、B、C、D四個選項，我會立刻憑直覺選D。


    我舉個例子：人都有「喜歡」和「討厭」的情緒；看到一幅畫時，每個人應該都能在瞬間判斷出喜歡或討厭。右腦的判斷機制就跟這情形一樣，看起來好像沒在思考，其實大腦已經做出了判斷。


    因為不是靠邏輯思考，所以不需要思考的時間，很快就可以做出決定。「很快」代表'
  merge: -1
  img_proc: true
- pgno: 248
  md: '表有很高的機率能夠把握機會。當其他人花了很長的時間思考同一件事時，你早已經進入下一個階段了。


    只是，靠直覺行動，不可以一下子就失控爆走。


    因為經驗不夠的話，直覺就會缺乏準確度。年輕人經常犯這種毛病：直覺告訴你好，你就把資金全數投入，或辭掉原本待的公司自行創業，不顧一切地採取行動。這很常見。我敢斷言，這麼做不會成功。


    假如你有某些副業或投資，卻還沒有成果，那並不是因為花太多時間待在公司，妨礙了發展，而是你還欠缺經驗和敏銳度。你誤以為「只要我變成專家，就能賺錢」。等你每天花一到兩小時的副業或投資成果能夠超過公司薪水，這時候你才有資格考慮辭職。


    # 直覺不一定正確，需要反覆驗證


    我的做法是，當我憑直覺從 A、B、C、D 的選項中選出 D 之後，一定會先用小筆錢進行測試。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '以股票投資為例，即使我直覺認為某支股票的股價會漲，一開始仍然只會買一點點。假如我平常一買就是兩、三億日圓，此時只會先買個兩、三百萬，也就是用百分之十的小額資金進行測試。


    有時我突發奇想，想到「這個商品用這種宣傳，應該會熱賣」，我就會先進貨一個，用一千日圓（約新台幣兩百七十元）的預算上網打廣告測試看看。我會像這樣反覆進行非常小規模的測試；等到證明結果與自己的直覺相符，才會踩下油門加速。這個時間點我稱之為「主觀與客觀一致的瞬間」。


    但即便是這種時候我也不會冷不防就投入全數資金，而是會分幾個階段進行：用十萬日圓測試很順利的話，接著就是一百萬日圓，再來是一千萬日圓。到了這個階段終於可以確定我的想法無誤的話，就會投入一億日圓。


    我會根據經驗，從直覺起步，經過幾次測試後，最後踩油門全力加速。即使你認為自己的點子很好，只要市場不認同，就只能是紙上談兵。


    憑直覺決策固然速度快，但猜錯的情況也很多。這裡我想說的是，猜錯並不是什麼大問題，正因為我已有可能猜錯的心理準備，才會先用小額的錢進行測試。


    尤其當遇到自己不擅長的領域、沒有研究過的領域、沒有成功經驗的領域時，很容易'
  merge: -1
  img_proc: true
- pgno: 250
  md: '易會判斷失準。正因為直覺不見得是正確答案，才需要立刻進行小測試。


    就像這樣，以直覺為依據，超快速採取行動，累積成敗的經驗，你就能訓練直覺，自某個時間點起，你的直覺判斷就會比邏輯判斷還準確。


    這個道理就跟運動員的反射動作一樣，運動員的行動不是靠大腦判斷，而是靠身體的自動反應。這麼一來，原本千分之一的成功機率就會變成十分之一左右。儘管如此，直覺也不會百發百中，這就是人類的極限。所謂成功，就像「駱駝通過針孔」$^{38}$一樣，是一件很困難的事。


    然後，用來做小測試的錢即使損失，也不必在乎，這種心態很重要。這是增加財富必須的花費，就當作是繳學費買到一個教訓，從大局來看，這個教訓就是最好的回報。


    # 羨慕「旁人的成就」無法讓你成功


    根據直覺採取大量的行動後，培養出小小的成績就是「成功之芽」。接下來你必須專注替幼苗澆水，把它養成大樹。但是人類這種生物，經常一想到別人成功的例子，就會想照做模仿。'
  merge: -1
  img_proc: true
- pgno: 251
  md: '假設你原本在培養部落格這株小芽，一看到人家Youtube賺錢是以億為單位的報導，又看到Hikakin（人氣Youtube）上電視的樣子，你心想：「當Youtube，那麼賺啊？我也想當。」於是開始在Youtube上傳影片。


    或是你看到某位成功短線交易者的報導，心想：「啊，玩股票或外匯也不錯。」於是開始買股票或投資外匯。也有人是因為看到創業成功、股票上市的例子，就決定自己也要創業。


    挑戰新領域本身不是壞事。問題在於，受到他人成功事蹟的影響開始行動，這種程度的動機多半無法持久，恐怕幾個月就是極限了。


    我再舉個例子。我聽說有人看到電視節目介紹我之後，很嚮往我這種住在國外的生活，或是也想跟我一樣當投資客。但這種人即使移居海外也不會順利，很快就會感到挫折搬回日本。


    如果你不懂得專注在自己目前正在做的事情，總是覺得別人家的草坪看來比較鮮


    38這個比喻出自《馬太福音十九章二十四節》，高大粗壯的駱駝要穿過細小的針孔，表示「非常困難」。'
