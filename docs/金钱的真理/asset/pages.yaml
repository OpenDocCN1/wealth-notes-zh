- pgno: 307
  md: '看到我這樣提醒，你或許會擔心努力存到的五十萬日圓拿去投資，不一定會變多回來吧？何況把錢拿去投資，錢就會暫時離開你。有人會因此感到害怕，而不想讓錢離開自己的手邊。


    但是，假如你真心想當個經濟強者，讓錢去進行一趟投資之旅是無可避免的過程。


    # 把錢存著，是成為有錢人最爛的做法。


    我已經說明過了，你能夠靠一般薪水存下來的金額有限，光靠存錢無法讓你成為有錢人。


    我在過往的人生中，也不曾把錢存著不用。這樣做就像把錢這個可愛孩子關進冰冷的地牢，不過是你的自我滿足，並不會使錢成長。


    對人體來說，感冒藥等藥品原本是異物，所以有一定的用量規定；不遵守規定就會產生副作用陷入危險。也有不少人因為服用不同種類藥物過量而殞命。


    但是，只要我們正確用藥，就能延年益壽。事實上人類的壽命之所以能夠延長，有很大的原因也是因為開發出前所未有的治病藥物。'
