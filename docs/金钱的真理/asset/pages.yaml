- pgno: 139
  md: '只要凡事存疑，你的人際關係也就能自動整理乾淨。


    渴望自己未來能夠成功的人之中，不少人都認為建立人脈很重要吧。


    專辦跳槽轉行業務的人力銀行，針對一千位二十到五十幾歲的上班族，進行人脈相關問題調查，得到的結果是：九成以上的人認為「人脈對事業很重要」。另外也有九成


    以上的人認為，培養與他人的關係，能夠加快生意談成的速度。


    問題是，人脈不見得會讓你賺錢。牽扯的人愈多，就愈容易引起問題或發生人禍。


    而且，認為人脈能夠帶來財富的人，基本上就是只會指望別人的人。可以明顯看出這種人的心裡隱約等待著別人的幫助，或期待有人為他帶來好機會。


    根據我的經驗，我可以肯定地告訴你，人脈在淨資產的擴大上，最終只會帶來負面效果。


    原因在於，人往往會帶來問題；只要幾個人聚在一起，就會衍生出利害關係或醜陋的心態。假設有三個人一起做生意，獲利就必須分成三等分。假如三個人付出的勞力都相同，萬一其中一人拿走較多的錢，另外兩人就會心生不滿。


    不只做生意如此。假設感情很好的兩個男人與一位美女女人三人同遊，兩個男人可能會因為那位美女爭風吃醋，最後演變成兩男爭奪一女的局面。也就是說，只要多幾個人湊'
  merge: -1
  img_proc: true
- pgno: 140
  md: '在一起，人類就容易露出醜陋的一面。因此，我會在一開始就避免這種麻煩事情發生。


    尤其這次的新冠肺炎疫情促使網路相關領域今後更加成長，「人脈很珍貴」的觀念已經落伍了。


    我本身過去也認識很多人，以為善用這些人脈，是身為一位經營者、商業人士的責任。當時身為經營者的我，認為即使是初次見面的人，或許也能提供什麼好建議，所以多少也會聽聽他們怎麼說，來者不拒，甚至一天見上十個人。我錯將這些約見當成自己的工作之一。


    夜晚與各式各樣的人聚餐也成了我的例行公事。


    我就這樣將大把時間耗費在建立人脈上，事後回想起來才發現，這樣做對我其實沒有半點好處，而且多數時候只會給我造成損失，也經常讓我看到人類醜惡的一面。我的確透過這些交際獲得不少情報，但仔細一想，那些情報全都與我無關。對我而言最重要的事情，我自己應該最清楚才是。一旦投資不熟悉的新領域，只會造成損失，並讓我與本業漸行漸遠。


    另外，那些開口閉口老是把人脈掛在嘴邊，自豪交遊廣闊的人，多半把他人看成是「賺錢工具」。這種人接近你只是基於私心，認為「認識這個人對我有好處，幫助我賺錢」。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '到錢]而已。這世上永遠存在著一群利用與他人的關係來賺錢的人，在我看來，這些人之中沒有一個是一流的菁英。這種人沒有自己堅持的核心價值，幾乎都是透過與人建立關係從中取得利益，就像仲介一樣。


    你身邊應該也有許多這種人。不久前，一位號稱朋友有五千人的演藝圈相關人士，因為私底下仲介不法生意，遭到所屬製作公司開除。姑且不問他是否蓄意為之，但以結果來說，周圍的人都被他之所作所為拖累。


    如果你不懂這一點，誤以為膚淺的人際關係就能替你帶來財富，就很容易陷入麻煩；當對方帶著可疑的賺錢生意找上你，你就會聽信對方的說詞，或出資加入他的投資案。人際關係的糾葛遠超過你的想像，也常在不知不覺之間對你的決策帶來不好的影響。因此請記住，假如你因為能夠認識新朋友而開心，代表你要退步了。成功必備的要素往往都是反求諸己。你的心、你的努力、與已在你身邊的人合作，這些你都已经擁有了。


    我先說結論：拓展人脈不會讓你致富。所謂的人脈，就是未來會奪走你財富的東西，甚至可以說就是「負債」。


    原因在於，與他人來往的過程中，除了金錢借貸之外，麻煩的還有人情往來。例'
  merge: -1
  img_proc: true
- pgno: 142
  md: '如，「我介紹你○○」、「讓我來教你○○」、「恭喜，這是我一點心意」……他人主動提供的「善意」，會讓你覺得欠對方人情，不報答說不過去。


    但是，說到這些「不請自來的好意」，當下或許你會覺得對方以自己頗為照顧，但事後細想，大都是對方雜婆多事，因為就長遠來看，那些「好意」大多無法為你的問題提供任何正確的解方。


    而且，對於那些人自以為是的善意，我們也無法惡言相向，但採用那些其實不需要的提案根本就只是浪費資源。接受他人的善意其實必須付出很高的代價。跟對方的交情愈好，你就愈有可能得參加你不想去的餐會，或為了不破壞氣氛買下自己其實不需要的東西，有時甚至還得借錢給對方。


    像這樣子，與人往來長期看來只是負債。正因為人際交往是一種負債，所以我才希望各位只跟真正重要的少數人往來就好。


    除非對方讓你有一我倆的交情無關利益，為了這個人，我即使吃虧也無妨」的想法，否則沒必要與對方往來。任意拓展人際關係，你會會陷入人際關係的「牢籠」，久無法逃脫。


    說到「工作上不可或缺的重要人脈」，其實就比例來看，能真正為你的工作帶來極'
  merge: -1
  img_proc: true
- pgno: 143
  md: '大幫助的人，幾千人中頂多只有一人，而且五年能碰上一個就已經算多了。深入了解後你會發現，對自己來說真正有利害關係的人其實少之又少。


    只不過，換個立場來看，這種想法的確不見得適用於所有情況。


    舉例來說，如果你是大型企業的經營者，就必須具備事業合作相關的人脈。對於企業的人資管理、人才獵人、活動相關人員來說，建立人脈也是生意的一環。人際關係對這些人來說是一種「庫存」。


    但是，我可以確定人脈對於前述職業以外的多數人而言，就是陷阱，也是負債。


    「別人找我去聚餐或參加交流會，我一定地去！」「認識的人愈來愈好！」如果你有三種想法，只會浪費時間和金錢，請現在立刻就改掉。膚淺的人脈長期下來只會帶給你在富有減少的作用。而且不只是減少你的錢，還會為你的人生帶來更多煩惱。


    不管對方怎麼風趣，看似甜美的蜂蜜，時間久了也會變成劇毒。因此，你不應該輕易與人建立關係，必須嚴格挑選往來的對象。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 賭博本來就不可能永遠贏錢


    還有一點絕對要避免的就是賭博。


    所有賭博都有莊家，他們會從客人交出的賭資中事先抽取一定比例的利潤。例如：小鋼珠機台的利潤約占賭資的二〇%；賽馬和賽車等公營賭博約二五%；彩券是五〇%以上都被主辦單位拿走。相較於前面這幾種賭博模式，澳門、韓國、新加坡等日本人喜歡的賭場，反而屬於回饋機率高的類型，但當然也不是保證你的賭資百分之百都能拿回來。


    賭博這門生意的本質就是，即使砸錢添購豪華設備，還要支付發牌員等工作人員的薪水，老闆仍舊有賺頭。我們這些賭客贏回來的錢，絕對不可能百分之百還本，這一點賭場已經事先縉密計算過了。


    也就是說，你去賭博的話，不可能永遠贏錢。輸錢只是時間的問題。


    將大把金錢和時間花在這種不值得期待的遊戲上，帶給你的只有損失，別無其他。


    因為在那個世界，努力到最後不一定有回報。你不應該期待靠賭博賺錢，而是根本不該抱任何期待。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '相反地，如果你從事賭博以外的副業，努力到最後必然會開花結果。這樣說你應該很清楚應該把時間和金錢投入哪邊了吧。


    我覺得賭博更大的問題是會令人上癮的特性。據說人的大腦有個部位，把延續生命、留下後代所必須的食慾、性慾等獲得滿足時的快樂，定義為報酬。吃到美食、喝醉酒精、做愛亢奮的時候，這個部位就會分泌名為「多巴胺」的物質，也就是所謂的「快樂物質」。


    賭博時分泌的快樂物質多到驚人，在我看來，沉迷於賭博的人得到的快樂，甚至遠高於性愛。


    問題是，當賭博變成日常生活的一部分時，大腦的反應就會愈來愈遲鈍。於是，為了得到更多的快樂，你的行動就會更加激烈：投入更多賭金，期待靠這一把逆轉勝。


    到了這個狀態，你的自制力已經失去作用；無論你多想收手，都無法憑個人意志停止。為了把之前輸的錢全部贏回來，你甚至會去借更多錢投入賭博。這就是賭博上癮症，也是地獄的開始。'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 即使是賺錢達人，進了賭場也會血本無歸


    我身邊有不少人沉溺於賭場，全都無法戒賭；只要一陣子不去，就會引發癱瘓等戒斷症狀，因此每個月要上好幾次賭場。


    二〇一八年夏天，我和一位朋友去新加坡的濱海灣金沙酒店，親眼目睹那位朋友在隔壁賭桌輪掉六千萬日圓。這位朋友是土木engineering公司的老闆，工作認真，一年可以賺到一億日圓以上，而他卻把那些收入全貢獻給了賭場。


    還有大王製紙<sup>23</sup>前董事長井川意高的例子。


    井川前會長在澳門和新加坡的賭場欠下鉅額債務，為了取得更多賭金，他從旗下七家公司不當融資了總金額約一百零五億日圓（約新台幣一千二百一十九億元），權充私人使用。這件事也出現在他的自傳中，我就不再贅述。


    結果就是，當事人井川前董事長以特別背信罪遭到逮捕，不僅要坐牢，創辦人井川一族的所有成員也都必須卸任大王製紙的管理階層職務。


    值得一提的是，井川前董事長畢業於東大法學系。如此優秀的人卻也輸給人類天生對快樂物質的渴求。我與對方兒過幾次面，他的個性很好，充滿魅力，除了沉溺賭博這點。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '個缺點之外無懈可擊。


    因此，沉迷賭博這種事有可能發生在任何人身上。我過去曾有一段時期沉迷於百家樂，一想到我如果沒有回頭，後果該有多慘，不禁毛骨悚然。如果當初真的深陷下去，現在我恐怕早就被債務逼死，也無法寫這本書了。


    賭博這種東西，原本就是設計巧妙的陷阱。舉例來說，賭場裡沒有時鐘也沒有窗戶。為了讓客人忘記時間，盡可能待久一點，賭場的空間也經過一番刻意設計，直到你走出賭場大門那一刻看見天色，才能判斷當下的時間。豪華的裝潢、由美女送上餐點和美酒、極盡豪奢的附加服務（顧客VIP服務）等，所有的一切都是為了讓客人最後能夠輸更多錢。全世界最會賺錢的人只要一進了這裡，全部會被一網打盡，死傷慘重。


    為了避免落入這類陷阱，失去寶貴的金錢與時間，最好的辦法就是不去賭場。


    但是，如果你才二十幾歲，很年輕且不曾去過賭場，趁現在體驗失敗也是一種方法。我也是親身體驗過一陣子，才深刻了解到賭場的可怕。趁著年輕時大玩特玩，累積小失敗，從那些經驗得到教訓，同樣能夠降低今後人生遭到摧毀的風險。所以，年輕時'
  merge: -1
  img_proc: true
- pgno: 148
  md: '放縱一點、受點傷，長遠來看反而能夠幫你守住財富。


    另外，如果只是小賭怡情，設定一年內賭博次數的上限，旅行時順便玩一把，或是與交往對象、朋友們小玩一番，這種程度倒還可以。我不會否定賭場這類場所提供的樂趣。


    只不過進了賭場之後，接下來就看個人與生俱來的個性能否做到自制了。如果你對自己的自制力沒有信心的話，不踏入賭場才是最聰明的做法。'
