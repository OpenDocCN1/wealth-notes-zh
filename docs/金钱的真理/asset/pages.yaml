  md: '還有，在下次租約更新時，你應該搬去比較便宜的房子住。租摩天大樓住的人，其實很少是真正的有錢人。原因我前面也說過，真正有錢的都是收房租的房東。


    沒搞清楚這一點，明明是付房租住進摩天大樓的高樓層，卻以為「自己與眾不同」，結果只是成為資本主義的肥羊罷了。其實我也曾經這樣，現在看來，我認為住在摩天大樓三樓的人反而才可能是有錢人，而不是住在高樓層的人。住三樓證明這些真正的有錢人不會把錢花在充面子上。


    說得極端些，為了在三年內存到三百萬日圓的軍費，只要不影響個人精神健全，即使住進二．二五坪大的小公寓也在所不惜。如果有老家伙住的話，不用付房租更是天堂。我提過自己十幾歲時待過少年觀護所。在裡面每天有一個小時可以看電視，也可以運動和看書。就算在那樣的環境我都能感到幸福。每個人能保持心靈平靜狀態的居住環境不同，不過久居則安。只要習慣了你原先自以為住不下去的便宜住處，說不定你會覺得住起來超乎意料地舒適。


    現在東京市中心有愈來愈多一一．五坪雅房一公寓。居住空間只有三塊榻榻米大的狹窄住家，就位於市中心超人氣地段，房租只要七萬日圓（約新台幣一萬九千元），在缺錢的年輕人中似乎很受歡迎。我認為七萬日圓絕對算不上便宜，但如果地段好，你又'
