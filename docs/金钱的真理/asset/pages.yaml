- pgno: 44
  md: '租住摩天大樓、開法拉利的菁英分子容易有一種錯覺，以爲自己就是人生勝利組。這也是「優越幻象」的一種。即使只是租來的東西，也會讓你產生「我很行」、「我與眾不同」的錯覺。


    頂著大企業光環的員工，也有不少人覺得「我是菁英分子」，對他人擺出高高在上的傲慢態度，這也是「優越幻象」。在大企業工作的上班族，不見得就是該公司的擁有者（股東），卻把公司當成是自己的，只能說是狐假虎威。


    我自己在二十幾歲時也有過這樣的誤解。因為我住在東京中城、開法拉利，身邊的人和社群媒體不斷地吹捧我，讓我產生了一種錯覺，覺得自己做什麼都是對的。過度得意忘形，讓我即使做錯了事，也不願承認錯誤，堅持一意孤行。


    仔細想想就能明白，即使付了再多錢去租摩天大樓或高檔車，這些東西也不會變成自己的。你的資產規模跟那些計時出租不動產與高檔車的房子和車主相比，簡直是天壤之別。


    請各位別誤會，我並不是在鼓吹大家購買不動產或高檔車。持有這些東西也會產生相對應的成本，直到賣出之前都是負擔，還必須具備相關的知識。我真正想告訴大家的是接下來這段話：'
  merge: -1
  img_proc: true
- pgno: 45
  md: '「孤假虎威」不會讓你成為真正的人生勝利組。重要的是，如何成為出租這些東西給他人的那一方，也就是說，你應該思考的是什麼做才能真正成為人人崇拜的老虎。花錢租用屬於他人的高價財物卻洋得意，你永遠別想成為真正的有錢人。


    我當時對於自己住在摩天堂大樓裡很自豪，也經常到處吹噓。直到某天，我才突然驚覺自己成了資本主義的肥羊。


    # 對錢的輕慢，讓我跌入破產地獄


    你不好好愛惜錢，錢就會遠離你。假如你頻頻背叛交往對象，對方還會無條件地對你死心塌地嗎？應該不可能吧。不管對方再怎麼人美心善又重視你，如果你不斷辜負對方，對方總有一天會離你而去，錢也是一樣。


    希望將來成為有錢人的第一步，就是要改變自己，懂得愛惜錢財，不再購買不需要 的東西，花錢時審慎評估後再執行。等到你懂得對錢灌注愛情，錢也會以愛回報你。這樣的說聽起來或許很玄，但我根據自身的經驗學到，這種愛惜金錢的態度，有助於累積資'
  merge: -1
  img_proc: true
- pgno: 46
  md: '產。也就是說，對金錢的態度不能隨便，要像對待交往對象一樣慎重用心。


    話說回來，我之前在日本的時候對錢的態度就很隨便，後來情報資訊事業的獲利逐漸面臨瓶頸；投入再多的廣告宣傳費也無法重振業績，即使絞盡腦汁開發全新的業務服務，最後也全都以失敗告終。


    最後，我因為拖欠公司稅而不得不解散公司。我賣掉手上所有資產與物品，勉強付清稅款之後，陸續解約了港區租住的五處豪宅，逃難似地搬進西新宿房租十五萬日圓（約新台幣四萬元）的套房。


    # 恰到好處的幸福才是至高無上的幸福


    從一般人的角度來看，位在市中心，房租十五萬日圓的套房，並不是條件很差的物件。但對於原本住在每月租金共計八百萬日圓豪宅的我來說，簡直就像被關進了監獄那


    般丟臉。直到那一刻我仍認為自己的所作所為沒有錯。


    之後，我終於清醒過來，重新省視自己對待錢的態度。


    人在迷失自我時不會懷疑自己，也不會珍惜當下擁有的一切，更不會領悟到「恰到'
  merge: -1
