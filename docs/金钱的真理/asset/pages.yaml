- pgno: 131
  md: '前面也提過，當你自認消息靈通時，就已經成了比你更具優勢的人眼中的肥羊。這個道理與生物界的食物鏈相同；人類殘忍地殺掠動物來吃，同樣地，我們姑且先不討論騙子是壞人這種倫理道德的議題，騙子之所以騙人也是為了生存。


    結果，騙子也是比他們更具優勢的人眼中的肥羊；因此A不是最強的，A遇上在某領域更厲害的高手時也同樣無能為力。這個情況我稱為「肥羊連鎖」。為了擺脫這個連鎖效應，唯一方法就是打從一開始就對一切存疑。


    最後，我因為過去的一連串失敗，學會了「存疑」、「不輕易相信人」。如果凡事不存疑，你就無法守住重要財富，遠離所有陷阱。這些陷阱的背後有名人、大企業的招牌、大人物的名字加持。當對方備齊所有容易取信人的條件，讓你覺得「因為是○○所以一定不會有問題」時，你就已經落入陷阱了。各位請務必記住這一點。


    # 期待過高的人很快就會失敗


    還有一點與「別輕信他人」的主張有異曲同工之妙，那就是不論做任何事，期待過高的人很容易失敗。'
  merge: -1
  img_proc: true
- pgno: 132
  md: '舉例來說，假設有個 人最近開始炒作外匯或投資股票，期待靠股票和外匯大賺一筆，他恐怕會大虧一筆離開投資市場。 因為他很有可能因眼前的新冠肺炎 疫情而決定停損，提早一步退場保命。若你問為什麽會變成這樣，就是因為他的期待太高了。


    電視、社群網站、書店等到處都可以看到「靠股票賺上億」等宣傳文案。看到這些廣告文案的人心想「好，我也要成為億萬富翁！」於是開始玩股票或外匯。如果大家只看到買股大賠的消息，我相信不會有人願意開始投資股票或外匯。也就是說，人開始採取某些行動時，背後一定有「欲望」在推動。


    欲望成了行動的原動力，這是動物的本能，我不否定。可是當這種欲望產生時，人們的反應可以分成兩種：一種人是只會想像自己賺大錢；另一種人則會想到也有可能虧錢，於是開始降低期待。


    這時，只期待賺錢的人，遇到與個人想像不相符的情況時，精神就會發生錯亂，例如：原本聽說會賺錢才買進的股票卻嚴重虧損。他們無法承認現實，感覺自己上當受騙，只想要逃離窘況。情況到了這種程度，已經無法期待他們能夠冷靜行動，最後只能認賠退場。


    另一 方面，如果是屬於後者的類型，他們認為投資賺錢本 本就没那麽容易，早就看準'
  merge: -1
  img_proc: true
- pgno: 133
  md: '很有可能賠錢，所以一開始並不抱太高的期待。他們原本就不期待會賺大錢，因此多半不會投資過多，而且因為他們已有可能會虧錢的心理準備，就算股票套牢也不以為意。也就是說他們的痛苦程度沒有前者那麼高。


    舉個例子說明了，我現在手上有二十四萬九千五百股 Patina Securities (Retil)，有興趣的人可以去看看。該公司的會計年度期末是二〇二〇年三月的最後一天，因此六月份舉行的股東定期大會開會通知上，我的名字寫在第三股東的位置，名稱是
    Patina Securities (Retil)，有興趣的人可以去看看。


    我持有的這些股票因為疫情影響而嚴重套牢，但我因為一開始就對投資這家公司沒有過度的期待，所以即使現在股票被套牢，我也沒什麼感覺。說起來，成交價（目前的股價）不過是現在賣出股票的人能夠立即得到的金額罷了。我現在沒有賣掉股票的需求，所以也沒必要在意成交價。


    # **我認為「不抱過度期待」在堅持某件事的過程中，扮演非常重要的角色。**


    副業也一樣。有些人期待利用 YouTube 賺大錢，因此開始使用 YouTube，可是他們熱不過沒有收入的那段時期，於是早早放棄。


    另外有些人則是打從一開始就不抱期待，懷疑透過 YouTube 能夠賺錢，他們認為沒有'
  merge: -1
  img_proc: true
- pgno: 134
  md: '有收入很正常，所以泰然處之持之以恒，結果做著做著反而真的賺到了錢。


    我自己的經驗也是。我到現在還是不認為不動產能夠賺錢，但我卻買了很多不動產。我開始玩股票和虛擬貨幣也不是因為覺得會賺錢，但總的來說我賺了很多。剛開始接觸網路相關事業時，我也幾乎不抱賺錢的期待，結果卻賺了一大筆錢。


    也就是說，我基本上對任何事都不抱期待。說實話，現在我對自己的所有行動也都沒有期待，也不認為自己的行為了未來一定會有好結果。正因為我的心態如此，我才能夠長期持續下去。說起來就是因為我悲觀，認為不賺錢理所當然，所以即使有很長一段時間沒有成果，也完全不覺得痛苦。


    只要能夠保持這樣的心態持續下去，你一定能夠在過程中掌握訣竅，漸漸累積經驗，內心某處就會開始隱約確信這麼做有賺錢的可能。


    # 不要跟風加入拉麵店的排隊人龍


    延續如何避開陷阱的話題，接下來我要強調的另一個方法就是「別跟風排隊」。


    投資股票時，如果「已經新聞」報導的消息造成某支股票成交量飆升，很多人就會'
  merge: -1
  img_proc: true
- pgno: 135
  md: 一窩蜂地想購買那支股票。所謂成交量，就是在一定期間內完成交易的股票數量。漲停板表示太多人想要買進，無法與賣出的訂單相互抵銷，所以交易被迫停止，股價也因此一口氣上升到上限。人們一看到新聞，一心認為「買這支股票準沒錯！」「必須快点買到手！」就會立刻進場，朝漲停板的股票飛蛾撲火。而購買電視購物的人也是一樣，一聽到「數量有限！」「折扣只有現正在拉麵店外排隊的顧客，也可以算是與這些情況完全相同的例子。在拉麵店外排隊的人龍，多半不是因為那家拉麵好吃才去排隊，而是因為電視介紹，或是看到別人在店門前排隊，所以認為那家店應該很好吃，於是也跟著聚在那兒排隊。同樣的場景，在各行業的店家門外經常能夠看見。但是，跟風者的下場又是如何呢？看看三十年前泡沫經濟瓦解的情況就能一清二楚。人們常以為群眾齊聚的場所絕對不會出錯，然而，否定「眾人的常識」很重要，只有心存懷疑，你才不會成為肥羊。當時報章雜誌都說地價一定會上揚，煽動土地神話，所有媒體力勸民眾購買不動
  merge: -1
  img_proc: true
- pgno: 136
  md: '產，整個日本充滿著「現在不買地就虧大了」的氣氛。銀行的資金流動性過剩，不斷找尋融資對象，因此他們也對民眾洗腦：「我們會借錢給你，要不要買不動產呢？」結果不只企業如此，就連一般上班族也跟風購買不動產，甚至買下偏遠郊區的度假村土地。


    不久之後泡沫破裂，土地神話瓦解，許多泡沫經濟時代非常活躍的企業因此倒閉。上班族們買下的土地價格暴跌。


    樂於在拉麵店外排隊的人，很容易受到一窩蜂潮流的引誘。這樣做只是把好不容易賺來的錢花在無用的事物上，而且還是買在高點，更別提能夠增加淨資產了。


    因此，如果你想要守住錢財，原則上就不應該排隊。同樣地，衆人大舉買進的股票也不要碰，才能夠持續守住財富。


    這裡我再稍微深入一點談談股票。的確有一種情況是民衆有理由跟風買進的，稱為「市場買氣」。市場買氣當然也有正確的時候，但基本上市場變化快速，而且有些人不夠深思熟慮，跟著一窩蜂進場之後，股價多半會暫時下跌。因此我建議出現排隊人龍時，先觀察一下情況，等到股價下跌之後，你認為這波買氣有客觀的依據，就可以考慮進場。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '假如股價持續順勢上揚，沒有出現你預期中的下跌情況，那就當作是無緣吧。這樣就好，之後還會有無數次的機會；別只盯著似乎會賺錢的股票，別受到高股價的誘惑而進場，把這些觀念放在第一位，你才能夠在股海裡活得長久。


    假如你無論如何都想嘗試人氣拉麵店的滋味，最好趁著無人排隊的離峰時段前往。如果要去旅行，就避開日本黃金週等連假期間，使用年假在平日前往。這麼做既能省錢，也能毫無壓力並樂在其中。


