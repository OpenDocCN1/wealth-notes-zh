- pgno: 72
  md: '己的生活水準屬於「中產階級」。


    在那個時代，普遍認為最理想的人生規畫就是去當上班族或公務員，買房買車，過著安定的小康生活。當時的國民所得隨著經濟成長持續增加，人人有資產，只要好好存錢、繳年金，退休之後靠利息或分批領回的本金過活，直到死前都用不著擔心。


    而支撐這種生活模式的，就是年功序列制度、終身雇用制度、高利率的存款利息，以及全世界數一數二的年金制度。這些制度曾經造就了日本社會的大環境。


    可是現在，這個大環境正在逐漸瓦解。


    # 依靠政府和公司養老，是不智的想法


    企業配合員工的在職年資提高薪資，保障其生活直到退休的時代，不久之後即將宣告結束。包括豐田汽車的豐田章男社長在內，許多企業界的人士明白表示：「終身雇用制度很難繼續維持下去。」


    政府的年金制度顯然也愈來愈難維持下去，因此出現給付金額減少、請領年齡提高等情況。尤其有報告指出，現在的年輕世代未來恐怕領不到年金。所以我們這一輩應該'
