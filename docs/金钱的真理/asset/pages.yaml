- pgno: 71
  md: '現在多數人對於「自己的未來將會如何」開始感到不安。


    對於未來的不安，源自錢不夠的不安。


    公司發的薪水到了十年後、二十年後會變成什麼情況？老了以後真的能夠領到年金嗎？即使能夠領到，那筆錢足夠維持生活到離世為止嗎？多數人都因這種不安而倍受折磨。


    這一點也清楚反應在公家機構的調查報告中。


    根據金融廣報中央委員會發表的《家計相關金融活動民意調查》，二十歲到四十九歲的民眾有近九成「擔心」退休之後的生活，其中約有七成的原因是「沒有足夠的金融資產」、「年金或保險不夠用」。


    這種對錢的不安，來自於「大環境的改變」。


    日本過去曾經有一段時期稱為「一億總中產」7，意思是大多數日本國民都認為自己屬於中產階級，這種意識就稱為「一億總中產」。在一九七〇和一九八〇年代的日本經濟高度成長期尤為明顯。


    6 以公平公正立場推廣與民眾生活相關之金融活動的日文組織。總部設在日本銀行情報報服務局。


    7 一九七〇年代日本人口達到一億，而這一億名日本國民之中，約有九成認為自己屬於中產階級，這種意識就稱為「一億總中產」。在一九七〇和一九八〇年代的日本經濟高度成長期尤為明顯。'
