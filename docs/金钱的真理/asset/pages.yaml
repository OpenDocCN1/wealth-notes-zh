  md: '# 「讓錢去哪裡歷練？」是嚴肅的問題


    如果你讓孩子去充滿暴力、毒品、性侵的城市留學，必須想到孩子總有一天也會被那樣的環境污染，變得缺乏道德觀，最後精神失常。即使是表面上看來治安很好的城市，背地裡也可能充滿了欲望與暴力。這樣的地方到處都是，特別容易出問題的是導致精神崩潰的毒品。


