- pgno: 98
  md: '些人，我很想問難道就不能採取中庸之道嗎？但似平真的很難。人們的想法總是像鐘擺一樣極端且來回搖擺不定。這時候千萬不能輕易相信任何消息。一旦發生類似這次新冠肺炎疫情的大問題，直到昨天為止都還很悲觀的人，今天卻突然樂觀起來，被這樣猶如躁鬱症患者的極端意見左右，只是浪費自己的時間和勞力。最重要的是，你自己認為的趨勢走向是往哪邊走？


    根據我的判斷，股市對於新冠肺炎疫情是反應過度了。事實上在我撰寫本書時（本書全書稿完成時間是二〇二〇年四月），正好碰上美國失業保險申請件數創下歷年新高，增加到六百六十四萬件，之後才短短兩週就暴增到一千萬件。單從這個數字來看，你大概會覺得經濟完蛋了，但這只是企業為了防止疫情擴大，暫時讓員工放無薪假所造成的影響罷了。


    假如之後發明效果顯著的疫苗，或是找到有效防止傳染擴大的方法，經濟活動就能快速重啟。至於重啟的時期是什麼時候，我也不知道，不過我認為投資市場最後必然能夠強勢復甦。


    為什麼我敢如此篤定？前面也提過，經濟活動即使受到限制，仍在背地裡生生不息地進行著，轉變成因應當下情況的另一種型態，以全新的形式滿足人類的需求。'
