- pgno: 113
  md: '時，房子的實際價值往往只有一千萬日圓。


    各位最好記住一件事：三千萬日圓買進的房子要直接以原價或更高的四千萬日圓（約新台幣一千零八十萬元）賣出，是相當罕見的情況。


    也就是說，你很難期待不動產「將來會升值」。


    而且房貸就是讓你必須長期背負數千萬日圓債務的龐大負擔。


    各位想想，人類這種生物，每半年或一年想法就會出現變化。我相信各位應該都有事後回想起來不免後悔「我當時為什麼要買那個東西？」的經驗吧。過了一年你就會推翻現在的想法，這種情況在瞬息萬變的現今更是普遍。到時候你很可能因為嚮往都市生活而想搬家，或是因為調職必須出國。


    貸款買房子等於你要被房貸綁住超過三十年。你或許會覺得把房子租出去就可以回本，但只有位在東京市中心的房子才有穩定的需求。如果房子買在市場需求偏低的偏遠縣市或鄉下，你可能要有心理準備，自己恐怕難以忍受背負房貸長達三十年以上。


    即使我這麼說，我想多數人還是會認為「我的判斷不會出錯」。


    這些人為了付房貸吃盡苦頭，卻仍自我安慰「只要再繳三十年，房子就是我的了」。他們只聽那些對自己有利的房屋交易成功案例，絕不接受失敗案例。'
