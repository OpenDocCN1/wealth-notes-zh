  md: '「敗」。


    創造財富時，有件事你最好要先知道。那就是「創業搞得聲勢浩大幾乎都會失


    你如果正在某家公司上班，建議你不要辭職，也別急著另起爐灶成立新創企業。


    原因在於，現在是建立個人品牌比創業建立組織更賺錢的時代。


    日本的文化背景與美國不同，無法直接比較，不過美國的自由工作者，包含有副業


    的人在內，占勞動總人口近五成。日本的比例沒有這麼高，不過也的確在增加，兼職、


    副業等廣義的自由工作者已經超過勞動總人口的六分之一。我相信這個走勢受到新冠肺


    炎疫情影響，將會一口氣加速成長。


    當然，這個變化要有網際網路才能夠成立。但是網路終究不過是基礎建設，只是地


    基。能夠進入個人品牌時代，都是因為利用網路賺錢的個人愈來愈多的緣故。


    一般公司的上班族，只要善用下班後、假日等私人時間，在安全的狀態下自由接


    案，這樣賺錢也更容易存到錢吧。最重要的是能夠保持精神上的安定。


    在現在這種「個人品牌時代」，你不必選擇危險的方法，辭掉公司工作，從零開始


    雇用工創業。'
