  md: '人都要求快，及 时性非常重要，对于一般个人而言，手机既方便拍照，又能够及时分享保存，用专业的摄影器材还要挎贝，实在太麻烦，这是一个短板。


    刘润


    一念一世界同学，从一个用户的角度，提出了一个需求，就是买器材，送摄影服务。这个需求，是一个客户自己设计的“产品”，你未必要这么做，但是你应该从中间收到启发。很多人买相机，是为了拍照。怎么满足用户真正的需求？


    # 9、小欧言商


    在摄影器材城，销售同类产品的商铺有很 多，这就使得每一个来到这里的客户都处 于选择过剩的状态。


    但是选择再多，客户却也不可能把几十甚 至上百家店铺都转一遍。所以，有这样一 种情况就很常见：有的店铺还没被客户 逛，客户就已经在同行那下单了。


    也就是 说，每天进城的潜在客户有很多， 最后进自己家店门的却很少，这样流量成 本太高了。所以，赵同学要想提升销售 额，第一个要解决的就是流量问题。


    在此，我给赵同学的策略是『引流&收集& 圈养&变现』。步骤如下：


    +   1. 根据过去多年的销售数据或经验，分析 客户群体组成，找出成规模有代表性的群 体，分门别类有针对性地建立微信社群。


    +   2. 设置引流品，比如低成本的收纳包、 贴膜等，让进城的流量大批涌入你的店 内。


    +   3. 想获得引流品是有代价的，要先扫码加 入对应的微信社群。


    +   4. 你要把微信社群做成一个内容产品，持 续满足群内成员的某个核心需求。（比如 只给摄影小白提供器材操作方法、进阶玩 法，只给资深发烧友推送最新资讯等）


    这样，在这个流程下，大量的新客户...


    你再也不是一个只会卖货的店铺，而 是一个有温度的生活方式品牌。到那时， 你不光是用户购买的第一选择，还可以找 到其他更有价值的变现模式和玩法，比如 筹办线下活动赚取报名费、把摄影人才和
    需求对接赚取中介费，等等。


    刘润


    小欧言商给赵同学的策略是『引流&收集 &圈养&变现』。这个建议让人眼前一 亮。简单来说，通过线下获得初始用 户，然后在微信社群的方式养殖。这个 建议的核心，是通过优秀的服务，提高
    复购率，获得客单价。


    # 10、小猪之辉


    "我的建议是保留实体店，但减少面积。主要基于以下几点思考，仅供参考：


    # 1、为京东店服务


    主要是增加信任和提供售后服务。摄影器 材一般单价较高，首选考虑的是品牌直营 店和大的代理商，一质量有保障，二售后 服务有保障。京东上多少用户是因有实 体店增加了信任感，更坚定的购买值得分
    析。


    # 2、流量成本


    刘润老师谈到的流量成本，实体店的盈利 能力需要主要从转化率、客单价、复购率 方面下功夫，实体店的流量下滑是不争的 事实，无法改变。首先充分利用线上流 量，进店就加微信，主要向顾客现在用什么
    相机，都有些什么装备做好记录，在好友 备注里都填好，做好分类。日后针对用户 不同的需求和店里产品优势进行推荐和交 流。将线下流量转化为自己的线上流量， 其他策略就跟线下常规手段了。


    # 3、由坐商转化为行商


