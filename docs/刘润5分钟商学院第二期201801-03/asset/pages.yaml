    最后，请允许我再多说两句。


    另外，从今天开始到初六，...，

    如果你在自己的老家，希望你把当地特有的商业现象分享给大家，比如当地特有的商业模式、特有的需求等等；如果你外出游玩了，也希望你把观察到的特别的商业现象分享出来。

