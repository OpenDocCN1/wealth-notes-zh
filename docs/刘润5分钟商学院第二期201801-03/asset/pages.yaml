  md: '# 061 | 公关产品：一双你都未必没见过的筷子，是如何创造品牌价值的？


    061 | 公关产品：一双你都...


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    今天，我们进入营销这个大模块的最后一周，学习一种特殊的营销手段：公关。到底什么叫公关？公司里的市场部（Marketing），主要是营销“产品”的；公关部（Public
    Relation）呢，主要是营销“品牌”的。


    这一周的内容，我们从一种叫“公关产品”的格斗术开始。


    我有个朋友，是一家袜子企业的创始人，总觉得自己的品牌不好营销。袜子嘛，生活的耗材，而且穿在里面，别人也都看不见。赞助明星吗？明星总不能一见粉丝，就拽起裤管说：你们看，你们看，这是我代言的袜子。这可怎么办呢？


    嗯，也许你可以试试做一个“公关产品”，说不定会有奇效。


    # 概念：公关产品


    什么叫公关产品？


    第一次提出公关产品这个概念的，是华与华战略营销公司的创始人，华杉。华杉说，公关产品，是一款不以销量，不以收入，也不以利润为目标的产品。那以什么为目标呢？以获得大众关注，用户“WOW”一声惊叹为目标。


    我举个例子。


    2014年的愚人节，百度公司发布了一段视频，宣布他们要做一款智能产品，叫做“百度筷搜”（筷子的筷，搜索的搜）。对，就是一双智能筷子。这双筷子可以检测水的酸碱度，水果的甜度，甚至可以检测食品中有没有地沟油。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_10_0.png)


    这段视频刚爆了我的朋友圈。哎，可惜只是个愚人节玩笑，要是真有这种筷子就好了。2014年9月，在百度世界大会上，百度公司CEO李彦宏宣布：我们开玩笑是认真的，这款产品真的做出来了，而且它还能识别三氯氰胺。


    媒体噶地一下炸锅了。太牛了吧！黑科技啊！妈妈再也不怕我吃到地沟油了！


    这双智能筷子卖出去多少双呢？我估计你一双都没见过。因为实在是太贵，据说造价就要3000元。于是，很多人评价：这是一款创意上成功，商业上失败的产品。


    真的是这样吗？看你要怎么定义“商业上的成功”了。2015的5月，百度筷搜在One Show国际创意节上，一举获得了3项金铅笔奖，和1项铜铅笔奖；6月，获得了戛纳创意节技术创新金奖。这双估计你都没见过（但真实存在）的筷子，给百度带来了巨大的、积极正面的公关形象。


    并非每一款产品生产出来的目的，都是最大的销量、最大的收入，或者最大的利润。有一些产品来到这个世界上，仅仅是为了“秀”，秀你的科技实力、创意能力、品味水准，或者工艺水平。这些产品就叫做：公关产品。


    # 运用：


    做产品，还可以这样啊！于是，很多人就脑洞大开了。


    东京市郊一家叫做“福六十”的面店，推出了一款“巨无霸寿司”，在1斤4两的米饭上，盛满各种海鲜。欢迎你来挑战。如果能吃干净，800日元的餐券，拿走不谢。


    这家面店，真的是指望“巨无霸寿司”给他 们带来销量、收入，和利润吗？当然不 是。这款巨无霸寿司，就是这家面店的“公 关产品”，你看，连我从来没有去过的人，都知道了它。现在，你也知道了。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_10_1.png)


    那我怎样用“公关产品”这个工具，营销袜 子品牌呢？


    首先，你想“秀”什么？科技实力、创意能 力、品味水准，还是工艺水平？


    科技实力？好的。那你可以试着做一款“恒 温袜”。羊毛保温，金属丝导热。充好电 的绑腿，给袜子边缘加热，手机控制温 度，保持一整天的温暖干燥。你也可以在 4月1日愚人节这天，发布产品宣传视频。
    大家不喜欢，就说作开玩笑；如果喜欢， 过两天你正式发布产品。通过这款公关 产品，你让公众知道，科技正在改变袜业， 而你是领跑者。


    # 今日得到：


    划重点


    并非每一种产品生产出来的目的，都是最大的销量、最大的收入，或者最大的利润。有一种产品来到这个世界上，仅仅是为了“秀”，秀你的科技实力、创意能力、品味水准，或者工艺水平，并通过这些“秀”，换取公众对品牌的关注和好感。这种产品就叫做：公关产品。


    “公关产品”这个概念背后，是一种“产品意识”。品牌、组织凝聚力、供应商品口碑、长期资源储备等等，每一样都可以，或者说应该被当作“产品”来经营。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_10_2.png)


    刘润


    抛开“公关”这个话题，除了用来挣钱的产品之外，你或者你的公司，还在经营什么样 的“产品”呢？


    欢迎你在留言区分享，与大家一起，过过招。也欢迎你把这篇文章分享给你做品牌的朋友，帮他们用“公关产品”的思路，提升品牌价值吧。'
