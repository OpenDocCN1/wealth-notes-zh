  md: '# 065 | 大复盘：占领用户钱包之前，先占领用户心智


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》，实战篇。


    到今天，我们终于完成了整个第一季度的学习。第一季度的内容，叫做“理解用户”，为什么要先理解用户？因为一切商业的起点，都是消费者获益，我们必须理解他们的行为习惯和偏好，才能知道如何让他们获益，以及我们能够如何影响他们。


    理解了用户之后，在第二季度，你会学习“打磨产品”，用什么样的产品来满足用户的需求，真正做到让他们获益？产品做好了，用户获益了，那我们也能够因此获得收益吗？这就是在第三季度，我将与你讨论的问题：“找到模式”。找到模式了以后，所有的这一切，都要靠人来实现。如何靠人实现？这就是第四季度的“建设团队”。整个一年的内容，环环相扣，相辅相成。


    刚刚完成的第一季度，我们学了三大模块，你还记得吗？


    第一个模块是用户行为，我们学了心理账户、语义效应、锚定效应等等，从不同的角度来了解用户的心理偏好；了解了之后，我们要找到用户到底在哪里活动，这就是第二个模块的内容：渠道；找到了用户后，我们能够如何影响他们的行为？这就是第三个模块的内容：营销。


    那如何占领用户的心智呢？我们在营销模块的5周分别讨论了5个话题。


    占领用户心智，你需要一个载体，就是“内容”，或者说文案。好的文案，是坐在键盘背后的销售。如何写出销售力强的广告文案？要满足三个原则：简单易记、对消费者有利、和与产品相关。如何写出能唤起消费者强烈情绪的文案？要呼应信念、共鸣感情和满足渴望。如何提升内容的打开率？你的标题要明确具体，有紧迫性、独特性和实际益处。标题决定打开，内容决定传播，那什么样的内容会被疯狂转发呢？你的内容要符合“疯传6原则”。


    有了内容之后，你要将内容传达给用户，这个传达的过程，就是“传播”。如何引发传播？你可以靠“创意”。创意，就是旧元素的重新组合，让人既熟悉又陌生，激发“居然还可以这样”的惊叹，引发传播。除了靠创意，你还可以通过“跨界营销”来传播。跨界营销的本质，是不同品牌，从多个角度诠释一个用户的特征，达到1+1远远大于2的营销效果。那还有别的传播方法吗？你还可以“借势营销”，快、准、狠地捕捉热点事件，获得“汹涌而来的注意力”。那没势可借怎么办？你可以找到一个支点，通过“造势营销”，撬动大众的传播势能。


    传播的时候，你要借助一个载体，就是“媒体”。有哪些媒体？你要记住一个词，叫做 POE。P，是 Paid Media，“付费媒体”，在付费媒体上，你要“精准投放”；O
    是 Owned Media，“自有媒体”，除了你的公众号，产品包装、快递盒、你的 T 恤、车身、行李箱、你的显示名、自拍照等等，都是你的自有媒体。E 是 Earned
    Media，“赢得媒体”，指不属于你，但你也没花钱，别人自发的传播。付费媒体，是用钱触达第一层用户；赢得媒体，是用内容，触达第二层，第三层，甚至更多层用户。


    每一次传播所带来的消费者的“了解、信任和偏好”，你要用一个容器把它们积累起来，这个容器，就是“品牌”。建立品牌，就是建立一个符号，识别你的产品，浓缩你的价值，让消费者购买你，推荐你。建立品牌，就要在品牌标识、品牌内涵、品牌反应，和品牌共鸣四个方面，持续投资。那如何定位自己的品牌呢？通过把用户细分、定客群目标、和差异化定位的方法，让自己脱颖而出。


    品牌容器建立起来后，往里“存钱”和往外“拿钱”的过程，就是“公关”。你可以通过公关产品和网红企业，来往里“存钱”；但有时候危机出现了，你也会被迫往外“拿钱”，这个时候你就要“危机公关”，根据舆情走势，利用或规避“沉默的螺旋”，做好公关管理。


    那公关和营销的关系是什么呢？营销，通常指对产品的宣传；而公关，通常指对品牌的宣传。品牌，就是公关部的产品。


    好了，第一季度的内容我们就总结完了。恭喜你，花了整整3个月，终于搭建好“理解用户”的体系大厦，到达了一个新的里程碑。下周开始，我将带你进入一个全新的格斗场，从理解需求到打磨产品，再到确定最佳的定价策略，获得更大的商业和个人成功。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_14_0.png)


    刘润

