  md: '# 083 | 设计3层次：好看有什么用？好看，能当饭吃


    083 | 设计3层次：好看有...


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    我有个朋友，在某大型银行工作，有天拿着他们的App来找我，请教如何做互联网金融；我还有个朋友，要开大型产品发布会，有天拿着PPT来找我，请教如何演讲成功；我还有个朋友，想在线下开店，有天拿着商业计划书来找我，请教如何才能做得更好。


    我看完之后，统一的回答就是：太丑。App太丑，PPT太丑，店面设计太丑。花钱请个好点的设计师吧，好好打扮下自己，成功率一定能提高不少。


    为什么啊？我的产品很有用，你却以貌取人，太肤浅了吧？


    你才肤浅呢。19世纪英国最伟大的作家与艺术家之一奥斯卡·王尔德说过，“只有肤浅的人，才不会以貌取人。”翻译成今天的话，就是：颜值就是正义，美就是生产力。


    你不信？我举个例子。


    美国经济学家丹尼尔·哈默米肖（Daniel Hamermesh）经过研究发现，长得好看的人，平均要多挣5%，而姿色不佳的人，要少挣9%。因为长得好看而获得高于平均水平的收入，叫做“美貌溢酬”；而因为长得丑而收入偏低，则叫做“丑陋罚金”。原来，好看，真的能当饭吃。


    “好看，能当饭吃。”像我这样丑的人，实在不愿接受这套理论。但是，诺曼在他的《设计心理学》中，对这个现象，给出了理论化的解释。


    # 概念：设计3层次


    诺曼说，心理学研究发现，人类的大脑活动可以分为三个层次：本能层、行为层和意识层。本能层就是天生的、最原始的需求，比如“好看”；行为层是后天学来的经验和动作，比如“好用”；意识层最高级，需要理性的参与，比如看推理小说，需要大量思考才能获得更多乐趣，叫做“好有意思”。


    # 运用：


    “好看，好用，好有意思”，诺曼说，设计师的工作，就是要让自己的产品满足这三个层次。具体怎么做？我们一层层来学习。


    第一，本能层：好看。


    好看，是个统称，好听，好闻，也同样，指的是所有直接的感官刺激，带来的情绪。


    人们看到漂亮商品，通常第一反应是“真好看”，然后是“我想要”，然后才是“它能干什么”。如果看到丑的商品，第一反应估计是：这东西，真难看，嗯，估计也好用不到哪去。然后，就再也没有然后了。


    所以，好看和好用不该是取舍问题。好看就是好用的一个部分。你一定要把好看，当作天大的事。小米联合创始人刘德说，小米的产品在上线之前，都要过“7人长老会”，其中最重要的指标之一，就是“颜值”。


    关注颜值时，你必须注意，用户关于什么是“好看”的口味，一直在变化，所以你也要随之变化。


    比如，现代人越来越喜欢扁平化，所以谷歌的LOGO，从1999年的最初版本，去阴影，去立体效果，去渐变，最终变成了今天的样子。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_48_0.png)


    第二，行为层：好用。


    高颜值带来的喜爱是否能延续，要看产品是否能有效完成任务，操作是否便捷有趣。这就是在行为层设计的关键。


    前天的“设计5原则”，其实回答了“是否能有效完成任务”的问题（相关课程：081 | 设计5原则：从“诺曼产品”中，找到创业机会）；昨天的“驯化复杂”其实回答了“操作是否便捷有趣”的问题（相关课程：082
    | 驯化复杂：苹果鼠标，为何从“简单”的单键设计，变成“复杂”的双键？）。你可以回顾一下。


    第三，意识层：好有意思。


    本能、行为，都是人类潜意识的反应，而意识层的设计，需要他想一想，判断一下，才会恍然领悟：哇，好有意思！


    举个例子。很多网站或 App 在刷新网页时，会显示“请等待......”这就是没有经过意识层设计的页面。经过意识层设计的，可能会这么说：“服务器正在玩命帮你组装内容，请稍等......”用户看到后，会心一笑，心里说：好有意思。


    再比如，杜蕾斯所有的“谐势营销”设计，都不会让你一下就明白，而是绕个小弯子，你领会了之后，坏坏地一笑，心里说：好有意思。


    # 今日得到：


    划重点


    +   1. 把东西做he用是远远不够的。对产品的需求，有三个层次：本能层，行为层，和意识层。简单来说，就是：好看，好用，好有意思。\n2. 要记住：颜值就是正义，美就是生产力。别只关心功能，全面设计你的产品吧。\n3.
    做一个好看，好用，好有意思的人。几年后再看看你的收入，你会大吃一惊。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_48_1.png)


    刘润


    你见过哪个在本能、行为、意识3个层次，都做得很好的产品吗？


