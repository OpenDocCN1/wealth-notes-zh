  md: '时代所带来的优势了，所以你靠域名来发家的概率就会下降。


    时代是对冲运气的第一要素，我把它的重要性排在千位。


    # 2. 战略


    百位是战略。


    我有一位好朋友，29岁从微软辞职，专职炒股。他炒股不是去看K线图，找消息。他数学特别好，人特别聪敏。他通过建立数学模型找到股票里面的套利空间，也就是量化交易。


    我记得十几年前，他一天赚的钱，常常比我一年赚的都要多。我曾经问他，成功的要诀是什么？他的回答是，要有自己独立的战略，坚定地执行自己的模型。


    比如他建一个数学模型要进行100次交易，可能前3次交易赚了钱，第4次交易就赔钱了，第5，第6次交易又赔钱。这时候心态就变得很重要了，很可能怀疑自己的模型有问题。这是最考验人的，你要相信，你能赢不是靠消息，就是靠模型，靠战略，靠判断力。所以赌的时候也要坚定地执行下去，因为这是一个概率游戏。


    所以说战略也是专门用来对冲运气的。


    再举个例子，过去中国企业有种非常重要的战略，叫做跟随性战略。德国人制造业做得比我好，日本人服务业做得比我们好，美国人高科技行业做得比我们好，他们走在前面，我们在后面跟着。走到路口，有人向左转，有人向右转。向右转的人都死光了，我们只学向左转的那些人，就是跟随性战略。如果你往右走了，你再聪明，再努力，再懂得管理，都没用，因为已经跌落悬崖了。跟随性战略就相当于别人帮助我们排除了一定的失败概率。


    再比如，互联网有一个基本逻辑叫网络效应，网络效应就会导致赢家通吃，最终形成721的格局。快鱼吃慢鱼，能最快构建起网络效应的就是赢家，我们称之为快鱼战略。一旦你要做互联网创业项目，快鱼战略是最重要的战略。


    曾经团购网站打得不可开交，最终美团和大众点评成为赢家，你今天再去做团购，已经没有机会了，没有人会向这个领域投资。打车软件，在滴滴快滴成为赢家通吃者之后，游戏就结束了。摩拜跟OFO已经打成这个地步，你就千万别再去做共享单车了，最终格局马上要形成了。


    还有一些人相信慢就是快，只有慢慢来，才能最后走得很快。这种说法不是没有道理，但是在互联网创业领域就是找死。因为在“平台战略”下，快是必须的。只要慢下来，你管理水平再高也必死无疑。


    很多人看互联网公司觉得很奇怪，OFO被爆管理混乱，美团王兴承认自己早期管理一塌糊涂，连有自己有多少员工都没办法搞清楚，但他们为什么还能快速增长？因为战略选对了，极大地对冲了概率。在这个战略下，“快”，比“好”来得重要。


    # 3. 治理


    十位是治理。


    治理指的是结构，治理是董事会优整个公司管理层的结构化设计。比如股权制度，合伙人制度等等。


    我们经常说一句话叫“结构不对，什么都不对”。举个例子，两个创始人搭伙创业，每人50%的股权，这个公司大概率上很难获得发展。因为未来有许多的决策要做，他们股份相同，也就意味着谁也不会听谁的，公司没有核心领导，大家会吵得不可开交，死在山脚下面。


    另一种极端情况是，一个创始人占98%的股权，另外两个各拿1%。投资人问他，为什么其他人只有1%？创始人说因为他们只值1%。投资人很可能会跟他说，你也不值98%，因为你找不到能够跟你搭伙创业的人，1%根本就不叫合伙人。今天这个时代，单打独斗是无法获得成功的。


    不管是50%:50%还是98%:1%:1%，结构如果不对，大概率就会失败。


    # 4. 管理


    个位是管理。


    管理是指你有没有找对人？有没有合适的奖金制度？有没有梳理好流程？有没有设计好员工的激励计划？有没有做一些企业的文化建设，团队建设？有没有做好充分的沟通？内部有没有一些员工跨组的调动和沟通等等。这些都属于管理。


    管理非常重要，也是用来对冲概率的，如果你没有做对管理的话，你的总成功概率也会降低。


    # 今日得到:


    “概率思维”是你要求平气和地承认，就算你做对了所有事情，你成功的概率也不高，可能在今天的互联网行业只有不超过5%。然后再思考应该用什么方式提高概率。


    千分位上，通过踏上时代的脉搏提高12%；百分位上，通过选对战略，再提高5%；十分位上，通过设计好组织结构又提高2%；最后在个位上做好管理，提高1%。综合计算一共提高了20%，加上原来的5%，你的成功概率就变成了25%。


    有25%的概率获得成功，已经是很大的希望了，但是依然有75%的概率会失败，怎么办？那就接受失败再来一次，再来一次，再来一次。如果你曾连续创业四次，每次成功概率是25%的话，四次里面有一次成功就是比较大概率的事件了。


    概率思维，是这个时代成功者所秉持的底层思维。理解和运用概率思维，去增加好运气，避开大坑和陷阱，创业者才能可能在成功的路上走的更远。


    刘润


    想想看你的老板和朋友们当中，那些取得不错事业成就的，他们都做对了哪些事情？欢迎你把你的思考放到留言区，和大家一起分享，提升成功概率。


    同学们，我们明天见！'
