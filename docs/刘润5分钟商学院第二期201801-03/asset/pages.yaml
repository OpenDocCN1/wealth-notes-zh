  md: '# 第20周周末私董会｜如何从零开始做一款父爱式母婴产品


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》实战篇。


    5分钟商学院的同学们，大家周末好！


    本周获得私董会提问资格的同学是：橡皮擦。


    润总，您好，我是一名建造师，打算辞职，跨行业进入母婴市场创业。现在母婴市场的产品和服务大多聚集于线上，且没有一个彰显父爱的产品或品牌，计划做一个以父爱为切入点的品牌项目。提供的服务主要为：一是手机App上的中高端母婴用品、亲子教育用品售卖；二是与线下同城的亲子游乐园合作开发服务项目；三是开发省会城市的游玩、教育资源，提供辐射周边市县的周末亲子游服务项目；针对每一个会员家庭，运用数据分析，提供相对个性化的服务！对于我这样的，只有一个想法的
    人来说，如何行动？去哪里找、找什么样 的合伙人，谈什么样的投资，希望得到同学们的指导。


    我觉得这是一个非常好的问题。一位建筑师打算创业，而且是从父爱的角度来做母婴产品，这个切入点让我眼前一亮。


    但是我们静下来想一想，过去这个产品为什么叫母婴产品，而不是父亲产品？因为这类产品通常是母亲为了孩子购买的。那 今天我们要说的是父爱产品，这个提法很有趣，也很好，但是我们就需要从比较系统化的逻辑来分解它、理解它。


    # 一、这个产品要满足哪些消费者的什么需求？


    # 二、产品形态'
