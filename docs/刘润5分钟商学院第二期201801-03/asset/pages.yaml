  md: '# 078 | 可用性测试：用最便宜、最快的方式，纠正错误


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    今天，我们来学习需求调研的第三种方法：可用性测试。什么叫可用性测试？


    你有没有遇到过这样的情况：一个产品拿到手，不知道怎么用，只好找来说明书，发现说明书写得比产品更难懂；使劲一推门，“咔”地一声，发现这个门只能拉；打开洗手间的冷水龙头，突然被烫着了。


    这时候，我们会忍不住骂一句：这种鬼东西，是什么木鱼脑袋设计出来的啊？这哪能用啊！


    # 概念：可用性测试


    “这哪能用啊”，就是对产品“可用性”（Usability）的声讨。可用性，不是说品质，而是说这东西好不好用，易不易用。


    虽然互联网时代，常说“小步快跑，快速迭代”，但是，如果你胆敢拿出一个连基本“可用性”都没有的产品给用户，说“我要开始跑了啊”，你试试看，用户能把你踩死在起跑线上。


    所以，“可用性测试”非常重要。可用性测试，就是通过观察有代表性的用户，完成产品的典型任务，而界定出可用性问题并解决，让产品用起来更容易。它是在正式发布产品，用户大规模使用前，最后一道验证需求的防线。


    # 运用：


    那具体怎么做“可用性测试”呢？你要学会四个步骤。


    第一，找到有“代表性的用户”。


    你想对大幅改版的音乐播放APP做可用性测试。谁是你的“代表性用户”呢？用过你上一个版本APP超过3个月的，下载过歌曲的用户。


    用户是18岁，还是30岁重要吗？年龄之类的“人口统计学特征”没那么重要，因为对可用性产生作用的，更多是“用户行为特征”。他们如何用你的APP，用了多久，做过哪些事情，更重要。


    那选几个用户，才有代表性呢？需要100个吗？并不需要。5个用户已经可以发现明显的可用性问题了。5-8个一般就足够了。8个以上，新信息量就很小了。


    第二，设计“典型任务”。


    “你听到一首被打动的歌，分享到朋友圈”，或者“你想听某首歌的高清版，需要注册为会员，请完成注册”，或者“请找到华晨宇的‘齐天大圣’”。


    这些都是“典型任务”。设计典型任务时要记住：


    +   1. 任务不能太多，必须是重要的，新版本中容易出问题的；

    2. 任务必须是用户会遇到的场景，而不是你想象的步骤。


    第三，界定出“可用性问题”。


    用户开始做测试时，你就是一个记录员。

    记住：

    仔细观察和记录用户的使用行为。有条件的话装两个摄像头像，一个记录手机上的操作，另一个记录用户的表情。


    对手机上的操作，观察用户看了哪里，点了哪里，接着又到了哪里，是不是你预期的路径。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_39_0.png)


    对用户的表情，要尤其观察用户“思考，皱眉，犹豫，惊讶”等表情。当用户不停皱眉、做出思考状，想点又犹豫不点，说明他对操作没信心。当用户瞪大眼睛，很惊讶时，说明
    App 给他的反馈，让他很意外。


    不要着急，不要指导，忠实地记录。


    第四，解决这些问题。


    用户不知道要往下划屏幕，可是“下一步”按钮藏在了下面，用户困在这里走不下去了。这是严重问题，必须立即修复；用户习惯在左边找按钮，没找到，然后到右边找到了。这是一son问题，需要尽快修复。用户下载了非常多音乐，存储满了，他找不到清除本地音乐的地方。这种情况很少见，是次要问题，可以延后修复。


    # 今日得到：


    划重点


    +   1. 可用性测试，就是通过观察有代表性的用户，完成产品的典型任务，而界定出可用性问题并解决。

    2. 怎么做可用性测试呢？1）找到有“代表性的用户”；2）设计“典型任务”；3）界定出“可用性问题”；4）解决这些问题。

    3. 可用性测试的底层逻辑，就是“我会错”的思维。但是让用户证明我错了，实在是太贵了。

    4. 用最便宜、最快的方式，纠正错误，这是每个自信的人，都应该拥有的反向思维。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_39_1.png)


    刘润

    你的产品，也做过“可用性测试”吗？是怎么做的？

    欢迎你在留言区分享，与大家一起，过过招。也别忘了把今天学到的内容，分享给做产品的朋友，也许能够帮到他。


    +   1、青岛罗刚：你的情敌已经开始在《5分钟商学院》学做自己的CEO，你却还在打王者荣耀？

    2、青木水晶：你是想用这5分钟来刷个朋友圈，还是用来改变你的世界？

    3、Henry_志权：你与CEO之间只差一个《5分钟商学院》

    4、河深J：别总被老板逼着加班，读5商，为自己的明天加个班。

    5、康有为 | 3号色：感谢你，5分钟让我鼓起勇气朝着成功之路前行。'
