  md: '居中对齐，当然比随意安放好。但居中对齐，是一种非常乏味的对齐，你应该慢慢尽量避免使用。试一试“左右对齐”吧，你会惊讶于布局的明显改善，比如下面的修改。


    # Your Attitude

    is Your Life


    Lessons from

    raising three children

    as a single mom


    Robin William

    October 9


    对齐，也就是那根“看不见的线”，带来了一致性。


    这款封面的布局设计，还能怎么改进呢？请看下图。


    # Your Attitude

    is Your Life


    Lessons from

    raising three children

    as a single mom


    # Robin William

    October 9


    这个版本修改了什么？1）用绿色的箭头，前后“重复”；2）用加粗的字体，前后“重复”。


    为什么要重复？重复带来“统一性”，让你进一步看到所有元素间的关联。


    但是要记住，一致，并不意味着一样。每个视觉元素，毕竟是有差别的。


    强烈的对比，能在不同元素间建立一种有组织的层次结构，也就是互补性。罗宾说，“如果两个项不完全相同，就让它们不同，而且是截然不同。”


    你体会一下，下面这个加上对比的封面布局设计。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_69_0.png)


    好了。学习完亲密、对齐、重复、对比这4个“布局原则”后，我们看看James重新设计的简历，是不是比原来的版本，有“秩序感”，不“乱”了呢？


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_69_1.png)


    # 今日得到：


    划重点


    1. 什么叫做“布局原则”？我们每个人内心，都深深埋藏着秩序感。用具有“组织性、一致性、统一性、互补性”的布局，来建造视觉上的秩序感，能给用户带来巨大的美感。


    2. 具体怎么做？记住4个原则：亲密、对齐、重复、对比。


    3. 我们总觉得“美”是微妙的，不可琢磨的。说不清，道不明。但其实，再不可琢磨的东西，依然有底层规律。美有美的规律，爱有爱的规律。万物，皆有规律。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_69_2.png)


    刘润

    你见过哪些充满“秩序感”的布局设计呢？欢迎你在留言区分享，与大家一起，过过招。也别忘了把今天学到的内容，分享给你的朋友，也许能够帮到他。


    另外，祝同学们春节快乐。春节期间也就是初六之前，... ...


