- pgno: 43
  md: '售，因为做零售需要的能力跟原来做产品是截然不同的。


    总结一下我的建议。一个中国的OEM厂商想在中国境内出口转内销，开始做自己独立的品牌，是一件非常好的事情，但是要记住，有3关一定要闯过去：产品化一关、品牌化一关和零售化一关。


    产品化，要重新理解设计这件事情，要充分明白产品不仅仅是制造，甚至不仅仅是品质，还要包括很重要的设计这部分。品牌化是什么呢？品牌化的核心建议是要懂得建立自己的一个容器，要相信品牌能够帮助你减轻消费者的选择负担（交易成本），以及它在价格中占据着非常重要的位置，你要建立消费者的了解、信任和偏好。关于零售化，我的建议是分步走，首先是坚持自己的B端，同时和那些有渠道的零售企业合作，给大家足够的利润空间，然后不断用产品验证消费者的喜好，验证自己的产品能力，等你具有了一定的品牌能力之后，如果真的非常有愿望，这个时候才可以走出去，自己来做最后的销售。但是，建议先把产品能力，包括产品化
    direction 和品牌化建立起来之后再做第三件事情。


    这些是我比较偏战略性的建议，但我觉得，先想清楚这些根本问题可能更重要。说的比较多，希望能够对你有所启发。我也挑选了10位同学的精彩回答，请看他们的见解。


    请你们留下电话、手机型号，得到同学将为你们尽快充值。也请麦奶奶同学留下你的联系方式，得到的同学会尽快联系你。


    # 针对本周私董会的提问，我有以下建议：


    +   1. 确定战略：是2B还是2C。如果是2B的话，我能想到两家很好的渠道商：必要商城和网易严选。对于质量好，价格低，但是没有品牌知名度的好产品，在淘宝京东上没有太大的优势和区分度。如果是2C的话，建议采用精品店+单品爆款的形式，因为没有知名度，就必须把资源集中在一个点上打开市场。


    +   2. 如何引流？引流品利润品如何设计？这个问题的核心是：目标客户是哪个群体？在找到目标群体之后，才能谈所谓 的引流的问题，引流的方法我们学过很多，比如异业联盟，奖励用户分享，微信平台等。引流品和利润品的设计可以参考手机和手机壳，一部手机会用个2~3年，但是中间会换很多的手机壳啊，特别一些定制的，有个性的。这方面可以借鉴宜家：一个东西拆成好几个部件出售，其中相对耐用的部分设计成引流品，容易损坏的部分设计成利润品。这样做同时也能提高自己的复购率。但是前提是风格要一致。


    +   3. 维护老顾客还是吸引新顾客？罗胖的跨年演讲里提到“超级用户思维”可以回答这个问题。给过钱的顾客和没给过你钱的顾客那完全是两类人。除非找到流量成本很低的方式，否则精耕细作为才
    是目前最好的策略。以上建议，供你参考。


    麦同学你好！我理解的你的问题本质就是挖掘需求的问题。


    +   1. 利用电商平台，了解需求。关于引流品和利润品如何确定，我建议一百次，不如用户购买一次，因为用户也并不清楚自己的真正需求。用户数据就可以帮助你了解了用户需求，有了数据，引流品和利润品可能就自动出现了。


    +   2. 提供定制化服务，引导需求。有很多用户可能已经在买房子之前就已经想好设计风格，针对用户的不同室内设计风格，上门服务，提供不同设计方案和不同预算。这样用户就会被打动，成为超级用户，他们又可以影响一批他们周围的新用户。


    +   3. 和地产商或装修公司合作，激发需求。可以专门针对地产商和装修公司不同的设计风格，利用他们的效果图或实景图，配上你们的家具单品，做互换。用户买房子和装修房子时，明明没有想到家里那么远的事情，但是是你替他们想到了，用户如果被你们的周全、贴心的服务感动，就可能激发需求。


    麦奶奶你好，针对你的两个问题，我准备三支箭：相关性、异业联盟及客户生命周期。


    +   1. 研究高端家具与其他商品的相关性。我 们在实战篇028｜相关性：我也想把啤酒放在尿片旁边，学过怎么问题，也许 有意想不到的销售成绩。你们能否通过现有互联网资源，找到其他相关性产品，可能是高端西服，也可能是婚宴场租服务。事前的调研功夫不足，才能事半功倍。


    +   2. 异业联盟 и打开你的能见度。刚进入市场，必须要在营销上先占领用户心智。在实战篇019｜异业联盟：我的服装店，每天门可罗雀，怎么办？提出流量共享、创造额外价值，像是欧洲旅游展、房地产年会，都是你们能大展拳脚的地方。我对IKEA印象深刻的，除了它的展示设计之外，还有那柔软的抱枕。一个抱枕不到40元，穷学生也买的起，每当同学来宿舍聊天，我总会提到那是IKEA的，没意外我未来要买家具，也会先想到IKEA。你们的引流品，要能搭配的家居品，即使顾客没买高端家具，他们也会为你传播。


    +   3. 熟知客户生命周期能绑住顾客的钱包。在实战篇032｜客户生命周期：想与顾客形成黏性？努力促成前3~5次购买。如果能将顾客的活跃期、沉默期、睡眠期及流失期掌握，那么适时推送宣传信息，则能恰好对上顾客想你、需要你的时刻，那么顾客黏性也就建立了。祝
    你三箭齐发，心想事成。


    麦奶奶的问题我理解是，OEM想转型自己做产品，做品牌，应该怎么做。相信你自己已经有了很多想法，以下是我的一些建议：


    +   1. 紧跟原来代工品牌或类似品牌的渠道。你原来是给欧洲做代工的，那么这些品牌在国内的销售渠道你应该也了解一二。你去联系这些渠道，以同等品质，更低价格去尝试切入，这是做2B。


    +   2. 和电商平台合作。主打优质低价，去品牌化的电商平台，是符合你们转型角色的。如果有资源，可以尝试去和网易严选等类似平台对接，借助平台的流量来销售产品。


    +   3. 引流品一定是爆款，而且一般会在价格上做出很大让步。首先是相对普通的 产品，这样才能吸引更多的流量关注。其次，最好是相对简洁经典的款式，这样，不用花太多时间和精力去重新设计。最后，要和类似竞品在成本控制上
    有一定优势。


    +   4. 关于老客户和新客户因为采购频次比较低，老客户可以保持定期的沟通就行。比如一个电话联系一次，定期的售后维护


    还有一条建议，就是既然已经有了家庭办公椅，那么做公司办公椅也是顺理成章。这样可以切入公司的B端市场。以上建议供参考，祝生意兴隆！


    我今年刚装修完新房，买了不少家具，有不少买家家具的感受：


    首先，理一下这个问题的本质：一家没有品牌知名度的企业，椅子质量好且比大牌同类产品低很多，想定位中高端家庭市场，如何打开中国市场？


    +   1. 理清目标用户，明确产品核心竞争力和定位：你如果仅仅只是价格比大品牌同类产品低很多，还不足以成为核心竞争力。消费者买家具，其实买的是家具带给他们的居家生活方式和情感。思考时可参考：宜家。宜家的定位就非常清晰而且有“温度”：帮助更多人创造更好的家居生活。


    +   2. 建立品牌知名度：中高端家庭可是很重视品牌的。前面讲了家具其实承载的是居家生活方式和情感，所以我会比较倾向于内容植入式品牌营销，如和装修真人秀节目（国内比较好的梦想改造家，大梦小家这类收视率比较好的）合作，带来巨大的品牌曝光。


    +   3. 引流品和利润品的设计可以参考宜家。宜家有很多非常好用又便宜的爆款产品，通过这些吸引大量的人流来到宜家，人们去了之后总会买一堆。


    +   4. 新老用户问题：你的产品主要是椅子，椅子对于每个家庭并不是经常更换的产品，质量和舒适性是挑选椅子最重要的因素。因为是低频且消费周期长的产品，建议以新客户为主，老客户为辅（可以在服务上做文章，如鼓励老客户推荐新客户则可免费享受到一些上门的维修服务）会更加合适。'
