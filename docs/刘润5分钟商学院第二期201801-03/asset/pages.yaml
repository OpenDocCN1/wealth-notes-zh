  md: '# 113 | 内容运营：从"用产品换钱"，到"用内容换时间"


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战简。


    今天，我们来学习"养孩子"三大关键之二：为孩子买东西。


    李雷做了个卖生鲜净菜的APP，东西很新鲜，价格也很公道。他做了一些推广，吸引了一些用户，但这些吸引来的用户，流失很严重，买了一两 chou 就不再来了。怎么办？


    要解决这个"怎么办"的问题，我们首先要理解它的本质。这个问题的本质是，这些用户的"黏性"不够。所谓黏性不够，就是你没能让用户在你身上花足够多的时间。花的时间多了，感情就深厚了，当然就离不开
    了。


    那怎样让用户在你身上花足够多的时间呢？你可以试试"内容运营"。


    # 概念：内容运营


    什么是内容运营？


    内容运营，就是让用户在这里有东西看，有事情干，来 了就不想走，想走也走不掉。


    我举个例子，你正在装修房子，想买一套沙发。我问你，你知道自己想买什么沙发吗？我估计大部分人是不 知道的。所以你会到百度或天猫上搜索"北欧风格+沙发"，然后在"图片"里一页一页往下翻，找
    感觉；你也会阅读《让客厅增彩的9款沙发》，或《选颜色，还是选款式？选购沙发的7个技巧》，找经验。最后，你会去 线下或者网上商城，根据"内容"给你带来的感觉，选购沙发。


    你想想，如果这些图片和文章，都是你提供的，他在你的APP内容 的汪洋大海里遨游，有东西看，有事情干，甚至看中的沙 发都有购买链接，是不是更有可能"激情"下单？


    这就是内容运营。


    那怎么让用户在你身上花更多时间呢？用吸引人的内容。


    回到最开始的案例。想用生鲜净菜换取用户的"钱"，首先要用吸引人的内容换取用户的"时间」。比如，你可以做个"今天吃什么"的栏目，每天推荐10道美食，养成用户每天来嘎口水刷一小时的习惯；比如你可以让有才华的用户，上传自己的作品，比如"可乐鸡翅"，"八珍香菇电烤鸡"，因为看了这些意见领袖的分享而下单，甚至可以给他们销售提成。


    # 运用：


    原来，运营内容这么重要，那，我具体应该怎么做？


    如果你做电商网站，一定要让用户喜欢"逛」。梁宁在《产品思维30讲》里说，每天晚上有2000万女生在淘宝上逛，什么都不买，就是逛。只逛不买，就是只消费内容，不消费产品。漂亮的图片、直播的介绍、分类的点评，这些就是内容运营，用来赚取用户"逛"的时间。放心，她总会买的，那些东西已经在她的购物车、或收藏夹里了，花了时间，就会花钱，他们只是在等待打折的时机。


    如果你做旅游网站，一定要在用户心中"种草」。你没去过北极点？这个位于北纬90度的神奇的地方，往任何方向走，都是南，你再也不会找不到北了；你没去过加拉帕戈斯群岛？当年达尔文就是在这里受到启发，提出了著名的"进化论"；你没去过乞力马扎罗？这是人类可以徒步登顶的最高峰，而乞力马扎罗的雪，最多再等你10年。


    如果你开咖啡厅呢？一样可以做内容运营。用世界各地的咖啡豆，装扮整个空间，扫描二维码，可以看到咖啡豆的故事；每杯咖啡上，可以3D打印一幅照片，让用户忍不住拍照，分享到朋友圈；你还可以在咖啡馆做各种美术展览、时尚秀场、爵士演出，让用户有东西看，有事情干，来
    了就不想走，想走也走不掉。


    # 今日得到


    划重点


    +   1. 用户有两个重要的决策：把时间花在[F]，和把钱花在[F]。这两个决策又是相互关联的，时间花得多的地方，钱就花得多。 2. 怎样让用户在你身上花更多时间？做好内容运营，让用户在这里有东西看，有事情干，来
    了就不想走，想走也走不掉。 3. 内容运营背后的逻辑，其实是典型的"目标转换"。把"用产品换钱"的目标，转化为"用内容换时间」。有 时，直接追寻目标，反而会求仁不
    得仁。转化目标，反而更容易达成目标。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_116_0.png)


    刘润


    你过去哪些企业，用内容交换了你无数的 时间，让你欲罢不能呢？它有哪些值得学习的地方？


    欢迎你在留言区分享，与大家一起，过过招。也别忘了把今天学到的内容，分享给你不懂内容换时间 的朋友，也许能够帮到他。


    我们都知道选对行业是一件特别幸运的事，因为这就相当于你搭上了上升的电梯，不费吹灰之力事业就能日中天；而相反，如果你选错了，就跟待在泰坦尼克号的头等舱差不多，眼前再豪华，早晚也有下沉的一天。那如何选中一个有未来发展前景的行业呢？


    # 主题就是：从商务角度帮你解读未来最有前景的行业，如何解决这个核心问题及相关问题的元。


    欢迎你来听。如果有朋友对这个话题感兴趣，或者正在苦苦寻觅一个适合自己的行业，也欢迎你邀请他明天一起来听这场直播。我周四晚八点，得到直播间见。


