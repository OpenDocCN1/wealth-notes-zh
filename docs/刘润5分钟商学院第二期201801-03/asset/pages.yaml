  md: '# 074 | 明天的需求：未能实现 sor... 074 | 明天的需求：未能实现的渴望 + 科技创新 = 明天的需求


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    祝贺你，我们花了6天，终于学完了亚德里安在《需求》这本书里总结的，发现需求、创造需求的6大关键：魔力、麻烦、背景因素、激发力、45°精进曲线和去平均化。学完后，我想你一定能够理解、敬畏需求，并且更加敬畏发现需求、创造需求的过程。这个过程不是拍脑袋，而是一套系统而科学的方法。


    基于这“6大关键”，今天，让我们回到最初的那个问题：明天的需求从哪里来？


    # 概念：明天的需求


    来自科技创新。亚德里安说：科技创新正是需求创造的根基。


    为什么？要回答这个问题，我们首先要区分两个非常重要的概念：欲望（Desire），和需求（Demand）。


    什么是欲望？欲望是人类的底层动机。这些底层动机，可能是亘古不变的，比如追求快乐和自由，免除恐惧和焦虑；那需求呢？需求是实现欲望的具体方式，比如，为了自由旅行，人们对鞋、自行车、马车、汽车、地铁、飞机、宇宙飞船有需求。随着时代变化和科技创新，人类实现欲望的具体方式，一直在升级，越来越彻底。


    比如，人类想在空中自由飞行。这个“欲望”，有实现的方式吗？在过去，是没有的。所以，“在空中自由飞行”，就被划入“未能实现的欲望”清单里。虽然“未能实现”，但“欲望”一直都存在。


    # 运用：


    那具体应该怎么做？你可以把你的视野，放 在以下几个方面。


    +   1、实验室：从欲望出发，找科技。


    如果你是一家大公司，可以考虑独立建设实验室，或者和大学等研究机构合作成立实验室，专门研究阻碍“未能实现的欲望”的技术障碍。


    +   2、专利库：从科技出发，找欲望。


    如果说实验室是从欲望出发，寻找科技，那么专利库，就是从科技出发，寻找欲望。


    # 今日得到：


    划重点

    1. 欲望，是人类的底层动机；需求，是实现欲望的方式。因为科技限制，人类有大量“未能实现的欲望”。未能实现的欲望 + 科技创新 = 明天的需求。

    2. 怎么创造明天的需求？1）建立实验室：从欲望出发，找科技；2）研究专利库：从科技出发，找欲望。

    3. 再优秀的人，对“明天的需求”，都缺乏想象力。学完这一课后，我希望你能对明天，充满想象。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_31_0.png)


    刘润

    你觉得，还有哪些“未能实现的欲望”，可以借助即将到来的“科技创新”，变成“明天的需求”呢？

