  md: '# 079 | 数据分析：从原子世界，移民到数字世界


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    我有个朋友，打算在淘宝卖些新奇的东西，比如非洲的木雕，斯里兰卡的手工茶叶，马来西亚的锅具。中国专柜卖1000-2000元的东西，他卖700-800，一半左右价格。他觉得，识货的人一定非
    常喜欢，但他的生意却不温不火，怎么办？


    要解决这个“怎么办”的问题，要理解用户为什么明明便宜都不买，我们就要用到“需求调研”的第四大方法：数据分析了。


    # 概念：数据分析


    什么叫数据分析？数据分析，是对用户行为的量化分析。用户访谈，用户问卷调查等，都是用户没有真正去做的事，而数据，是用户行为所留下的痕迹，是最真实的。


    于是，我这个朋友购买了一份淘宝用户行为数据的分析报告，仔细学习。其中一个数据，如雷电一样击中了他。淘宝上，用户购买最多的商品，集中在100-200元之间。


    为什么会这样呢？原来，这是因为在网上买东西，大家终究有点不放心。万一是假货呢？万一不喜欢呢？虽然店家号称7天包退，你也可以投诉，但毕竟麻烦。拿2000元冒风险，有点懊。100-200元就不同了。就算店家真不退，虽然心疼，但还能接受，200元，是互联网时代“零钱”这个心理账户的上限。


    于是，他决定改变策略，把自己定位为“200元以内却特别高端的东西”。生意一下子就好起来了。


    这就是“数据分析”。用户永远都不会告诉你“200元的心理账户”这个“秘密”，因为他自己都不知道，但是，数据，是用户掩饰不了的行为痕迹。


    # 运用：


    数据分析这么厉害。那我具体怎么做，才能利用这个工具，挖掘出需求呢？我们来学习三个方法。


    +   第一，分析搜索数据。

    用户有需求，他们第一时间，会上哪找答案呢？他们会去搜索引擎。用户的需求，会通过搜索关键字，清晰无比地摊在你面前。

    百度有个“百度指数”，专门对用户搜索的关键字，做数据统计。比如，你输入“蛋糕”，可以看到搜索“蛋糕”的用户，很多还同时搜索了“星座”，和“烤箱、做法”等。

    有这些数据，就可以分析需求了。既然很多人喜欢星座蛋糕，那就专门做一些12星座主题的蛋糕；既然不少人喜欢自己做，那就做一些蛋糕胚子，让妈妈们享受给孩子亲手做蛋糕的乐趣。


    +   第二，分析统计数据。

    用户确实有需求，但到底多少用户有这个需求呢？这时，你就要分析统计数据了。

    比如，几乎每个人对买房都有需求。但房地产商，该在哪些城市重金拿地，哪些城市逐渐退出呢？很多房地产商会看一个数据：城市的人口流入流出比。人口流入持续大于流出的，这个城市的购房需求在累积，应该投资；反之则在减少，应该谨慎。

    从哪里可以得到这些统计数据呢？


    +   第三，分析行为数据。

    有限的研发经费，是投资买域名，开发PC网站，还是做基于H5页面的手机应用呢？这时，你就要分析用户的行为数据了。

    很多人都知道，2017年天猫双11的交易额达到了1682亿，但是很多人没有注意到在屏幕上这个惊人的数字右下角，有个小小的，同样惊人的数字，叫无线成交占比。这个数字在2014是45%，2015年68%，2016年82%，2017年达到了90%。

    也就是说，90%用户的行为，已经移到了手机上。itory这个行为数据的分析，你的决定应该很明显了吧。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_40_0.png)


    # 今日得到：


    # 划重点


    +   1. 数据分析，是对用户行为的量化分析。很多时候，用户通过问卷调查和用户访谈表达的都是自己想要的，而不是真正需要的，但用户行为所留下的数据却是很诚实的。你要分析三个：搜索数据，行业数据，和行为数据。

    2. 数据分析的底层，其实是一种数据思维。人类正在从原子世界，移民到数字世界。拥有数据思维，是每个人必备的技能。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_40_1.png)


    刘润

    你的典型用户最重要的三个数据，是什么呢？

    欢迎你在留言区分享，与大家一起，过过招。也别忘了把今天学到的内容，分享给你做数据分析的朋友，也许能够帮到他。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_40_2.png)'
