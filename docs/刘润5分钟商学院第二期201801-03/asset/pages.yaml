  md: '脑及时切换到商业世界的CEO模式。正如谚语说的，每个人都是自己的CEO，CEO模式要求你要看问题的时候不再是一个工程师的思维角度，而是要开始考虑产品的商业属性，你要做媒体人、运营人、产品人属性的混合体。第二，既然后要创业，就不得不把自己的商业知识框架搭建牢固。


    橡皮擦同学你好：我是一名从事母婴行业十二年的老司机。前两年在家乡母婴项目创业失败之后，现在在安徽一家传统母婴实体连锁店（员工规模100+）的公司出任CEO，另外，本人也是一名两周岁宝宝的父亲。针对您的创业想法，有以下几点建议，希望对您有启发与帮助：


    # 一、以父爱切入点很好，但一定要专注，要花精力做好定位。


