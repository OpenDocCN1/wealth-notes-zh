  md: '# 加餐｜微软奇葩面试题背后，真正测试的5种能力


    加餐｜微软奇葩面试题背后...


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》实战篇。


    上周日的加餐里，我给你留了5道面试题，都是我在这么多年的面试与被面试经验中积累下来的，错过的同学可以点这里文末的链接看一下。今天这篇加餐，我就要给大家出这5道题的答案以及背后的考点和出发点。


    先看第一题：


    +   1）有三个连续的，大于六的整数，已知其中两个是质数，求证第三个数能被6整除。


    我先来说一下这道题该怎么解，然后再说这道题的用意是什么，要考核被试者的什么能力。


    三个连续大于6的整数我们都明白，比如7、8、9，或者说11、12、13等等。另外，题中还给了一个条件，叫其中两个是质数。质数我们也明白，就是只能被1和这个数字本身整除的数。问题是，要证明第三个数能被6整除。为什么突然冒出来个6？这个6是怎么来的，就是解这道题的关键。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_85_0.png)


    CO2 = P x S x E x C


    P，就是People，人口；S，就是Service Per Person，每个用户使用多少项服务，比如开车，壁炉，烧烤等等；E，就是Energy Per Service，每项服务使用多少能源；C，就是CO2
    Per Unit Energy，每单位能源，排放多少二氧化碳。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_85_1.png)


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_85_2.png)


    第三题：


    +   3）昨天，我早上8点爬山，晚上8点到山顶。睡了一觉后，今天，我早上8点从山顶原路下山，晚上8点到山脚。请问，有没有一个时刻，昨天和今天，我站在同一位置？'
