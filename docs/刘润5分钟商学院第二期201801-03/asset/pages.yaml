    我有以下的几个建议：


    +   1. 把更多的时间和精力用到丙方，即企业的身上。


    +   2. 刚开始时需要锁定几个“试点”企业，这些企业需要精挑细选，最好是那些非常需要英语人才，但是没有财力或精力制定考核标准的。


    +   3. 邀请英语还不错的同学免费考试，然后把他们免费推荐给需要企业，录取的人多了，企业和学生就会慢慢意识到这个考试的重要性了。


    +   4. 如上述，从考试、到推荐、到被公司录用，这是一个比较缓慢的过程。不能期望立竿见影，一蹴而就。需要给这个项目定一个比较理性的时间规划。'
