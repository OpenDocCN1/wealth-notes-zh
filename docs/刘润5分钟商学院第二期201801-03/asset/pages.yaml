  md: '# 116 | 一级价格歧视：比"讨价还价","价高者得"更高级的吸钱大法


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    本周，我们进入"产品定价"的学习。"产品定价"的课特别不好讲，因为稍有不慎，就有"教人学坏"之嫌。我争取克制地讲，你努力批判地听。


    提问：你知道一架波音747卖多少钱吗？1亿美? 2亿? 3.5亿?


    如果你打电话去波音公司，假装自己很有钱，他会给你一份报价单。但事实上，这个报价单意义并不大。因为，几乎没有一个人，一家公司，是用这个价格买到波音747的。这个价格，只是谈判的起点。波音公司会有价格谈判专家，通过谈判，尽可能让有钱人，为同一架飞机，付出更高的价格。


    这就是：一级价格歧视。


    # 概念：一级价格歧视


    这个名字听上去怪怪的。什么是"价格歧视", 什么又是"一级价格歧视", 价格一共有几级歧视?


    价格歧视（Price Discrimination），是一个经济学名词。Discrimination，中文翻译为歧视，又是，或许歧视。Price Discrimination若直译，就是在定价，或许歧视定价。但是，第一个把这个概念引入中国的人，估计那天心情不好，选用了"歧视"这个带有感情色彩的翻译，导致很多人，一听到"价格歧视"，就会想到"种族歧视",
    "性别歧视", 总觉得这不是个好东西。


    学过《5商|基础篇》的同学一定都知道, "价格歧视"不是"歧视"。价格歧视，是针对不同特征的消费者（这叫：三级歧视），针对不同采购量的消费者（这叫：二级歧视），甚至针对每个不同的消费者（这叫：一级歧视），生产"差别定价策略"。


    这周，我们就来具体学习，这三级价格歧视的具体特征和打法。今天先从"一级价格歧视"开始。


    一天，某化妆品公司的创始人Rick，收到一封邮件，说他们研究出一种算法，能99%准确地判断一个人的购买意愿，根据这个算法，你可以给不想买的人更打折，吸引他下单，同时不用把折扣（打双引号的）"浪费"在忠实顾客身上。他们保证，用了这套算法，营收至少能提高5%。


    Rick没有抵挡得住诱惑，和这家公司签了约，利用让不想买的、刁钻的客户少付钱，忠实的、不在乎钱的客户多付钱的"选择性促销"方式，让在线销售收入，三个月提高了13.52%。


    天啊，听到这里，估计你张大了嘴：这个方法，实在太邪恶了吧！


    别急。你先消消气，其实这种"看人下菜"的一级价格歧视，自从有商品交易以来，就一直存在。


    # 运用：


    你有没有在批发市场买过东西？你问："这双鞋子多少钱？"售货员用0.5秒打量你一眼，把你的衣服牌子、首饰价格，富有气质，输入大脑，开始计算，给你报了个价。然后，你们开始讨价还价。最后，每个人买到这双鞋子的价格，就是不一样。你妈去买，几乎一定比你便宜。这就是：一级价格歧视。


    我们都学过，市场价格，本质或成本定价，供给或需求定价。但是，每个人对商品价值的判断，又非常主观。于是，很多企业就开始研究，如何让觉得价值高的人，多付钱。


    回到最开始的案例。用"讨价还价"的方式卖飞机，就是经典的"一级价格歧视"。常用的"一级价格歧视", 还有拍卖, "价高者得"。


    到了今天，随着科技进步，互联网公司在"一级价格歧视"方法论上的创新，让人叹为观止。一旦人的行为可以数据化，他们比你更了解你后，就能轻而易举地"看人下菜"。


    某研究者曾对一个著名的购物网站做了项测试。他先在一台电脑上，浏览奢侈品，然后在另一台电脑上只看便宜商品。两周后，研究者用两台电脑同时在被测试网站买同一款耳机。结果，经常看奢侈品的富人，看到的耳机价格，是另一个人的四倍。


    在中国也有某著名旅游网站，利用互联网对个人的了解，实施"一级价格歧视"。你在网上搜索机票信息，它会显示各种折扣。你不停地刷，不停地刷。然后，他就知道你很着急，于是悄悄隐藏了低折扣的机票。你再刷，便宜的机票越来越少。


    好的，不能再说下去了。再说下去要三观毁了。


    # 今日得到


    划重点


    +   1. 价格歧视，就是对不同用户的差别定价。\n2. 价格歧视中，最极致，也最受争议的，就是"一级价格歧视", 精确地针对每个消费者，差别定价。"讨价还价",
    "价高者得"，就是经典的"一级价格歧视"。\n3. 到了互联网时代，精准的用户数据，成了"一级价格歧视"指哪儿打哪儿的核武器。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_126_0.png)


    刘润


    你觉得，一级价格歧视，有违商业道德吗？你赞同用"一级价格歧视"来定价吗？


    欢迎你在留言区分享，与大家一起，过度招。也别忘了把今天的文章，分享给你的朋友，也许能够帮到他。'
