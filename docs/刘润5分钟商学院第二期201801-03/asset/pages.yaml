  md: '# 第18周周末私董会 | 如何推广无人货架？


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》实战篇。


    5分钟商学院的同学们，大家周末好！今天是大年...


    本周获得私董会提问资格的同学是：garra。


    润总，您好。我是5商两届的学员。目前在广州创业，做办公室无人零售货架。公司在广州、上海、北京、成都的CBD运营无人零售货架一千家左右。客户发展均通过扫楼+地推，并与一家楼宇物业服务公司合作开拓客户。市场竞争日益激烈，半年以后，货架的开拓进入了瓶颈期，新增货架缓慢，客单价开始走低。发现问题后，我们通过推荐现金奖励与开通大礼包等方式刺激消费，开拓范围也扩展到周边的写字楼与创业园区。运营方面也开始了早餐运营。但早餐的经营并不理想，客户也并没有因我们的现金奖励而推荐更多的客户。比较尴尬的一点是，我们服务的客户是to
    C的客户，开拓时的谈判对象是客户公司的管理层甚至老板，所以就算是为消费者带来了便利，企业主或者管理者也不一定想引入我们的货架，也少有客户公司推荐新公司进驻。想问问：办公室无人零售货架可以解决客户企业主或者管理层的哪些痛点？如何利用这些痛点开拓客户，才可以吸引客户推荐转发，形成网络效应？产品与服务的差异化对比同行甚至电商渠道的area
    在哪里？出价500元，希望能得到润总与各位商业才子的回复。谢谢。


    # 刘润


    garra同学的这个问题是关于无人货架的，无人货架其实是各样新零售创新业态中的一种。其实目前为止，很多无人的业态已经出现了。在这我先做一个小小的预告：咱俩专栏第一季度讲的是理解用户，第二季度讲的是打磨产品，第三季度讲商业模式，第四季度讲建设团队。而在第三季度的内容中，会有一期专门来讲新零售货架下的无人商业，感兴趣的同学们可以关注一下。


    # 无人货架的三重交易结构：


    要给这位同学提建议，我们首先要搞清楚无人这种业态，它是什么，有什么特点。


    无人商业的业态有很多，包括无人超市，写字楼、高铁站、机场里的自动售货机，还有无人货架等等。所谓的人无业态，其实就是对零售的商业结构、交易结构的一种优化，这是创业者本人最应该意识到的一点。而“优化交易结构”这个概念，我们之后在第三季度内容中也会反复提到。


    那么优化交易结构的本质是什么呢？


    比如，传统的便利店的租金，对于无人货架来说就是可以省掉的一个成本，因为放在办公室里的无人货架不用付租金。而且，不像复杂的自动售货机那样需要几万块钱的生产成本。简单的无人货架几乎没有任何技术含量，成本可能只有几百块，所以它也节省了制造成本。也就是说，无人货架相对于便利店和自动售货机，都有效率的提升。


    但是，在实现效率提升、节约租金和制造成本的同时，它也创造了新的成本，那就是信任成本。如果别人拿了东西不给钱，或者当时网络不好，打算过一会儿再给，但是后来就忘了怎么办？无人货架这种模式注定是一种商品损耗更大的模式。


    所以，...


    好，说完了无人货架的商业模式，下面我们来讲讲这个具体问题。


    本质上，这个问题涉及到的是交易结构的改变。无人货架的真正受益者是公司的员工，有了这个货架之后，他们就可以更方便地买到更便宜的东西。但是，决定无人货架能否摆在办公楼里的却是老板。在garra同学的提问里面我们也看出了这个矛盾的存在。


    无人货架这种商业模式，我们称之为B2B2C。第一个B指的是售卖无人货架的公司；第二个B指的是可能会买无人货架的公司、企业主、公司负责人；而这里的C，指的就是最终的消费者，也就是有无人货架的公司的员工。而作为创业者，...


    接下来，我们就一个一个说说，这三个交易结构该如何优化。


    就好像我们刚才说的，他要通过实际的运营数据搞清楚，这种模式省下来的制造成本和租金到底能否覆盖掉增加的信任成本。


    举个例子。我们知道，外卖送餐员一般骑的都是电动车，电动车虽然沉，不容易被偷，但是车的电瓶特别容易被偷走。可是，你又不能让快递员每次送餐上楼都带着电瓶，这样会浪费大量的时间。那怎么办呢？有一家外卖公司是这么干的：当外卖员到达一个小区的时候，公司系统会给他发送一条消息，提示他这个小区的安全状况好不好，是否需要把电瓶拎上楼。这样，外卖员就可以根据实际情况来处理。


    那外卖公司是如何知道这个小区是否安全的呢？就是通过以往经验中的实际情况统计出来的数据信息。这样一来，有的地方拎电瓶，有的地方不用拎，外卖员的送餐效率就达到了一种最佳的平衡。所以说，数据带来的运营效率是可以控制信任成本的。


    第一个交易结构是否成立，就要看具体运营之后最终数据。


    在这里我认为garra同学其实犯了一个小错误，那就是错把企业的员工当成了客户，把企业主当成了一个许可证的发行者，这样想其实是不对的。


    在B2B2C这种模式中，他的第一个重要客户仍然是企业，也就是中间的那个B，他不只是许可证发行者，而就是客户本身。所以，你应该想的其实是：你的产品能够满足企业主、老板的什么需求？他为什么需要你的无人货架？


    在我看来，老板们可能需要无人货架来解决两个问题：第一个问题，如何显得自己特别关注员工。这里“显得”这两个字是打引号的，因为我相信大部分老板是真心关心员工的，但真心也需要通过一些方式显露出来；第二个问题是如何提高员工的工作效率。比如，员工跑便利店买东西的时间如果可以花在工作上，该多好。


    如果你能解决这两个问题，企业主也就有了需要你的理由。那么具体该怎样实现呢？我在这里先给你提供两个思路。


    +   1. 在货架上提供一些可用作午餐，而且不易坏的食物。可以用作午餐是因为，如果员工能在办公室扫码就把午饭解决了，就可以继续工作了，这对老板来说就是提高员工工作效率的好方法。同时食物还要不易坏场，这是因为不用频繁地更换补货，本身就可以降低无人货架的运营成本。另外，除了矿泉水、可乐这种必备品之外，在货架上放一些红牛、咖啡之类的，能提高工作效率的食品，也一定会受到企业主的欢迎。


    +   2. 就是通过一些细节来展现老板对员工的关心。具体怎么做呢？


    举个小例子。假设一包薯片在一般零售店的售价是3元，而你无人货架上的售价是2元。为什么能卖得更便宜呢？不要以为这是你的功劳，本质上，是因为老板给了你地方，所以你省掉了便利店的租金，你也不需要自动售货机那么强大的设备，所以你省掉了制造成本。这都是企业老板给你的机会。那老板的这种行为，你就可以在产品上体现出来。


    比如说这商品原价是3块钱，但是现在卖2块，你就可以在产品上贴个条说：老板补贴1块钱。你在每个产品上如果都贴上“老板补贴了几块钱”这样的标签，老板对员工的关爱就显露出来了，而你，就可以拿这个逻辑，以及刚才所讲的提高员工工作效率的方法，去找老板谈了，相信这时候老板一定会更加欢迎你。


    这部分该如何优化呢？作为创业者，站... Aa'
