  md: '西，如果不经历一遍，谁也拿不去。就像罗胖在跨年演讲中说的快进业的经营智慧。其他的，还属于资源范畴，一定会有你比你更有钱、更有有人脉去聘用按师，你会陷入焦虑的竞争中。有了这个直营/加盟之外的第三选择，你就可以围绕“如何让其他足疗店老板合法收入翻10倍？、“如何让不甘平庸的足疗妹妹成为月入10万的小老板？”等问题梳理你的经营哲学了。


    其次，你需要把你的经营哲学产品化，产品化是让你在这个物理世界有个东西存在，让人们感知到它的存在，有了拉新—保留—激活—老带新—整套产品，就可以帮助其他从业者推广了。


    最后，就是把在5商中学到的推广手段用到极致，自己的会所，就是一个最好的样板，你可以把流水从1.5万/天提升到5万/天，就一定能通过自己的经营哲学，把一家流水是0.5万/天的会所，提升到5万/天。其实名创优品也是这个路子，你只需要拿出好位置的店铺，其他都不用你管，等着分钱就行。你让别的足疗会所创造了10倍的增长，你拿走一部分，人家也愿意哦。


    # 3、余词涛


    我是做美容美发的，以前在北京经历过连锁店的快速发展模式，跟小小鱼同学经营的足浴会所最大相同之处就是全部要靠人员来服务。从我经历的过程中学到连锁店至少要具备的几点：


    +   1. 你要有一整套的从选址分析（定位），到成本预算（投资），到开店前的活动营销策略（战略），到店内服务人员的服务流程（管理流程），到价格设计项目转化率（价格策略），到留客机制。\n2.
    流程设计之后，每个岗位都要有个专门的人员配在那个位置，开连锁分店不是光有足浴技师就可以了，需要干部，管理人员，能打仗的将军。这些岗位人员你是否都有能力培养？\n3.
    有这么多人就需要怎么分钱，你是否有开连锁的股份机制，管理机制能让你的后员变成熟虎之师。在我们美容美发行如果前些年就上面这三个问题你只需要引进一个有成功案例有过结果的“系统”就行，前些年是系统打天下，这几年那些连锁都是泥菩萨过江了。因为市场变了，消费观念也变了。


    所以我给的建议是：像刘润老师说的你是知道目前这个店你真正成功的原因在哪里，是否真的看清了，如果你的经营方法是具有章法的，你要考虑的就是复制就好了！如果只是某方面的运气所取得的成绩，然而自己还不知道，以为是自己经营的好，就建议不要盲目的动，否则就是盲目扩张，自毁灭。最后一个建议是既然现在盈利不错，也不是不可以去发展，要像罗胖讲的选蓝色开关得一亿美金那种思维，想办法分担你的风险，找到有开连锁加盟经验的专业人员，成功了他拿多少你拿多少！至少你有一家有盈利的足浴会所！


    # 4、古小千


    直营或加盟，本质上是「技术」或「资金」为主的区别。考虑到你的行业，技师团队属于稀缺资源，那么应该以直营的方式扩展。\n首先，盘点培训师的数量和质量，能够到新设直营店培训的外派有多少，接着要设定直营店的阶段性任务，单单
    KPI 是不够的，要用 OKR+360度环评（能参考润总5商基础篇的221讲），让事项有着落、件件有响应，即便新设的直营店，也要能像创始店一样的水准，顾客的口碑才能在各城市传开。以资金为主的加盟方式，中间的风险是技术和抽成问题。技术一旦外流，加盟的模式是否可行，就值得商榷。


    # 5、廖军


    我也从事连锁服务行业的，针对你的问题，我的建议如下：足浴行业属于劳动密集型行业，核心竞争力就是技师的操作技能和服务水平。如果你想开分店，首先你得问问自己：


    +   1. 你有没有一套完善的复制模式，最核心的有没有完善的技师招聘、培训、认证上岗模式，能不能在短时间内为一个新足浴店配备齐完整的技师队伍；\n2. 你有没有强大的开发团队，迅速为你找到合适的物业，加盟业主等，让他们认可并加入你的品牌；\n3.
    足浴在四川是个红海市场，连锁的品牌也多，特别是川渝比较出名的渝富桥和高桥等等，你有没有比他们更有特色东西，能让你在竞争当中脱颖而出。


    如果以上都有，那么你可以尝试找资金，开房加盟模式，如果以上问题是否，那我觉得比较稳妥的是只开直营店，把服务和品质做好，同时，慢慢摸索出一套可以复制的盈利模式，再图发展，以上是我们的建议，祝你生意越来越红火。


    # 6、佛祖门徒


    曾经有幸与全国知名足浴品牌“重庆富侨”的创始人胡芝容女士有过一次交流，把她创业的几个关键节点分享一下，希望对你有所帮助。


    +   1. 开店步骤，先在本地开了十家分店后，再开往有沐浴休闲消费传统且经济富足的长江西三角洲地区，在江苏、浙江和福建三省收获颇丰。\n2. 开店模式。直营和加盟并行，但是要解决人才队伍在人数和服务水平方面的问题。她的办法是创办了一所按摩职业技术学校，除了教授“自创”的72招洗脚手法、202招泰式按摩手法外，还高薪聘来数位老中医讲解病理课程。学员所有费用全免，毕业后优先进入富侨门店工作。这个试验成了富侨早期创业的源头活水，“开多少门店，就有多少技师能够跟上”。同时胡女士规定，无论是直营店，还是加盟店，只要进入富侨的技师，必须先在学校里进行系统培训，并领取经过富侨考核的资格证书。以此保证技师水平和服务质量。\n3.
    开设高端满足高端人士奢华、私密、低调的需求。同时，推动自己公司参评ISO9001：2000质量体系认证，并牵头发起制定足浴行业标准。


    # 7、Tony to ni


    小小鱼想进行扩张，面临着两个选择：一条是直营，一年开一家；二是找资金快速复制。我理解第一是自己独资做；第二种是引入投资人或者股东，合伙开新店。因为你也做了一家店，如果做加盟模式，恐怕还不具备品牌条件。直营的话，自己可以全面掌控店面运营。因为足浴店是属于服务行业，不同于产品，服务因人而异，许多地方无法标准化。你在这家成功了，并不意味着你再开一家就能成功。直营可以控制节奏，稳打稳扎，缺点是自有资金，复制速度慢。而找资金的话，确实可以快速的多开几家。但是涉及到合伙，就要有分工和协调，可能无法完全按自己的意愿去运营；多家店面复制，管理和运营难度大大增加，这也是为何服务业很难出现一家公司占据大部分市场的原因。


    鉴于目前的情况，我个人建议，还是先开直营店。因为你目前还只有一家店，没有再次复制的经验。等到第二家，第三家复制成功的时候，你可以将复制的经验提出来，形成一套相对比较标准的流程，再考虑引入资金去快速扩展，这样，可能相对风险要小一些。


    # 8、伊春荷歌


    结合本周的课程，我们讲的企业故事，建立信任和情感。而情感也包括历史，产品，情绪。信任是否够夯实，有多少积累盈利的关键资源我们可以控住。一个相对年轻缺少历史的店，在产品上有哪些差异，我们又在传递着一种什么情绪。这些问题涉及发展的根本，建议彻底想清楚，再出发。\n老师说过商业的两种模式，�高达分布和正态分布。只有边际交付成本为零的晦涩分布才有可能获得指数级增长，而服务业人工交付成本很高，要想做大很艰，但也不容易被互联网直接干掉。要想获得指数型增长，也就是获得资本支持下的复制扩张，需要把服务里边际成本接近零的部分剥离出来，否则随着扩张，管理幅度和阻力也会增大，搞不好就会崩盘。现在大的环境是加盟连锁出现很多阵亡的案例，建议慎重。和郁共勉：没有金刚钻，就不要轻易瓷器活。踏踏实实积累核心资源，厚积薄发。


    # 9、Caicai


    这段时间正好去了一家养生会所做肩颈按摩，觉得他家的模式可以借鉴。他们一共开了两家店，都是直营。第一家老店开起来口碑很好，又开了第二家直营店，但第二家直营店不完全复制同样的服务，而是分不同的服务对象和种类。比如第一家现在只做女性产后修复服务，第二家特别针对压力下年轻人的肩颈腰椎保养服务，第三家据说在筹备中，是针对老年人关节问题的。\n我觉得做好这一行最重要的就是口碑，就像第一次被很好服务后，后面自然会去，而而且也推荐给了朋友。因此我的建议是，'
