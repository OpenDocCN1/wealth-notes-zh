  md: '# 070 | 读拳谱：乙方心态：谁付钱就听谁的，一定对吗？


    070 | 读拳谱：乙方心态：... ↓


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    学了什么是需求和去哪里找需求，你还要搞清楚，你到底是在满足谁的需求？在这个问题上，你要注意避免一种心态，叫做“乙方心态”。


    我有个朋友，从知名的 IT 公司出来创业，做一个基于互联网的教育产品，但用户怎么都不喜欢。问我怎么办？我请他给我演示了一下，我发现这个产品的很多功能都围绕着，怎么向来检阅的领导展示而开发的。我告诉他，你犯了
    IT 人创业的常见病：乙方心态。


    # 概念：乙方心态


    什么是乙方心态？甲方付钱给你，你就是乙方，来做一套 IT 系统，甲方的老板，并不是最经常使用这个产品的人，但他决定付钱，他是客户；最经常使用这个产品的人，是公司的全体员工。这些员工，用互联网的语言来说，就叫做“用户”。


    客户在付钱，但是不怎么用产品；用户在用产品，但是并不付钱。用户和客户常常不统一，是两群人。那这个时候我们到底应该听谁的呢？


    大部分的乙方会选择，谁付钱听谁的！所以，大量的乙方公司，做出了很多用来取悦甲方老板，但大部分员工很难使用的产品。这种心态，就是典型的乙方心态。


    比如，你为甲方开发了一套办公软件，对接的是甲方的IT部门。IT部门最想取悦的不是员工，而是老板，于是问老板怎么想。


    老板的想法，那就天马行空了，他们提出这里要这么做、那里要那么改，可能完全是根据自己个人的喜好提的。比如，几乎每个老板都想要一个“老板视图”，一打开电脑，看到所有数据。


    既然是老板决定付不付钱，那就拼命做呗。你花了最多的时间，最大的优先级来做“老板视图”，甚至不惜挤占了开发别的功能的时间。最后老板满意了，你就高高兴兴地拿钱走了，但是这个产品的真正的用户，广大的员工，可能并不喜欢。


    乙方心态，会让你逐渐丧失理解真正用户需求的能力。


    今天，你开始做互联网创业了，突然没有一个确定的老板决定需求、并为此付钱了。这时，你必须理解真正用户需求并开发产品时，突然之间不知道怎么办了，很可能会自然而然地也开发了一个“老板视图”。这是乙方心态的危害。


    从IT公司出来做互联网，从面对企业客户（toB）到面对消费者（toC），很重要的一点是打破自己的乙方心态。而打破乙方心态的本质是，透过付钱的客户，找到真正的用户。


    乙方心态不仅存在于 IT 公司，在很多其他行业里也有，比如说广告公司。


    广告公司做出来一个非常漂亮的设计，交给客户去审阅，客户的专业程度还不如广告公司高，但他会说这个不行，那个不行，我们的 LOGO 要做大一点，核心广告语要变成红字……广告公司的专业人士想，既然是对方付钱，那就改吧，改到最后全是大标题，效果很差，但是你愿意付钱什么都好说。广告公司的这种心态也是乙方心态。


    这没错，谁付钱听谁的。但是，你今天做自媒体了，突然没有“老板”付钱给你提要求了，你必须要满足真正用户的喜好了，这时候，很多广告人因为做了太久的乙方，已经不能洞察用户需求了。


    那怎么办呢？


    调整心态。有时候，甲方和乙方的需求都不重要，重要的是真正的用户，也就是丙方想要什么。下大力气研究丙方的痛点，把用户服务好之后，客户自然来。


    # 今日得到：


    +   划重点

    1. “甲方（客户）付钱给乙方来服务丙方（用户），但心里装的是丁方（甲方的老板）”。这种想法缺乏对用户真正需求的洞察力。这就是乙方心态。克服乙方心态的方法就是：透过付钱的客户，找到真正的用户。2.
    在互联网时代，有时候用户比客户更重要，因为只有把用户服务好了，客户自然就来了通过服务用户的方式取悦客户，是每个人都应该提高的技能。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_23_0.png)


    刘润


    你还见过哪些行业，也有这种把客户当用户的乙方心态呢？如何克服这种心态的呢？


