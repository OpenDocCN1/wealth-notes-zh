  md: '# 058 | STP理论：世界上11%的左撇子们，他们在用什么产品？


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    今天，我们要学习一个非常经典的品牌建设概念：STP理论。


    在《5商 | 实战篇》的周末私董会，一位提问的同学，是靠近高铁站、写字楼的高档酒店的大堂吧的经理。为了提高业绩，他向客人推荐高档红酒，可是大家并不怎么买账。于是，他推出促销活动，拉动业绩。但是促销的时候，大家喝两杯，促销一结束，大家又不买了。怎么办？


    我们以这个5商学员的真实问题为案例，学习解决这一类问题的通用的实战方法。


    首先，要解决这个“怎么办”的问题，我们要理解这个问题本质。


    # 概念：STP理论


    什么是STP理论？STP理论，是美国著名营销学家菲利浦·科特勒对战略营销和品牌定位的巨大贡献，S、T、P这三个字母，是Segmentation（细分）、Targeting（目标）、和Positioning（定位）的缩写。它的核心是，通过
    的方法，让自己脱颖而出。


    我举个例子。


    20世纪60年代末，米勒啤酒的市场份额只有8%，和百威、蓝带等差距很远。米勒当然很想提升业绩，但是怎么办？用STP理论试验。


    首先，把用户细分。米勒对市场做了调查，发现啤酒市场可“细分”为轻度饮用者，和重度饮用者。轻度饮用者人数很多，但饮用量只有重度饮用者的1/8。


    然后，定客群目标。那么，服务谁呢？米勒决定把客群“目标”定为重度饮用者。他们继续研究发现，这群人大多是蓝领，爱看电视，爱好体育运动。


    最后，差异化定位。米勒决定，重新定位子品牌“海雷夫”为“敬开来喝”，开始宣传“你有多少时间，我们就有多少啤酒”，广告中鼓励各种蓝领，船夫、钻井工人等等，开怀畅饮。


    你猜怎么着？“海雷夫”获得了巨大成功，1978年，它的销量仅次于百威，全美名列第二。这样的例子还有很多。


    +   把用户细分：买工具的人，可以细分为左撇子，和右撇子；

    定客群目标：德国有11%的人是左撇子，专门服务他们；

    差异化定位：开一间左撇子工具公司。


    # 运用：


    那我应该怎么办呢？我们试着用STP理论，来解决酒店大堂吧的问题。


    第一，把用户细分。


    根据在大堂吧消费行为的巨大差异，你可以把用户大概细分为三类：1）入住酒店的商旅客人；2）高铁站的来往过路客；3）写字楼里的公司客户。


    第二，定客群目标。


    商旅客人，白天办事，晚上回来，把这里当“客厅”；来往过客，短暂停留，简单消费，把这里当“驿站”；公司客户，接待访客，洽谈公务，把这里当“会议室”。

    那服务谁？这样看来，也许写字楼客户，才是最有价值的客户。他们的消费场景和消费能力，都很契合酒店大堂吧。


    第三，差异化定位。


    # 今日得到：


    划重点


    STP理论是战略营销，和品牌定位的核心方法。它的核心是，通过1）把用户细分，2）定客群目标，3）差异化定位的方法，让自己脱颖而出。

    往前走一步，如果我是个个人，怎么应用STP理论呢？STP理论的本质，是“差异对待”。我们常说，你不可能取悦每一个人。我们要接受这件事情，然后把你周围的人分类，找到你认为最值得交往的朋友，最后愉快相处。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_2_0.png)


    刘润


    你的客户如果可以细分，你会怎么分呢？你想专注地服务于谁？怎么和别人差异化呢？欢迎你在留言区分享，与大家一起，过过招。'
