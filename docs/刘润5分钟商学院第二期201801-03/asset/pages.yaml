  md: "# 080 | 大复盘：需求，一切产品的源头\n\n![](img/6b086af319379c0fa7ce76dc48c3f1a1_41_0.png)\n\
    \n080 | 大复盘：需求，一切...\n\n每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》，实战篇。\n\n又到周五了，这三周我们系统地学完了“打磨产品”的第一个模块：需求。今天，我们一起来做个复盘。为什么要从需求开始学起呢？其实从根本上，我想跟你讲明白5件事：用户、欲望、需求、产品和商品。我们一个个来看。\n\
    \n首先是用户。一切商业的出发点，都是用户获益。我们在上一季度理解了用户的心理偏好、行为习惯，学习了接触用户的渠道，以及影响用户的营销方式。那我们到底应该满足用户什么呢？\n\
    \n其实最根本的，就是满足用户的底层动机，这个底层动机，叫做欲望。比如渴望生存和安全，追求快乐和自由，免除恐惧和焦虑等等，这些欲望是亘古不变的。所有让用户获益的东西，最终最终都是在心理层面，满足了用户的欲望。\n\
    \n那需求是什么？需求，是实现欲望的具体方式。比如，为了实现自由旅行的欲望，人们发明了鞋，马车，然后是汽车，飞机，宇宙飞船，这些具体的方式，都是需求。随着时代变化和科技创新，人类实现欲望的具体方式，一直在升级，越来越彻底。\n\
    \n那产品又是什么？产品，是满足需求的工具。比如人们对飞机有需求，但波音747，是产品。那商品呢？商品，是有了商业模式的产品。换句话说，是可以用来交换的，让别人获益的同时也让自己获益的产品。\n\
    \n理解了这个大逻辑后，再来看这三周“需求”的内容，我们到底讲了什么？\n\n其实我们一直在讲，如何把欲望变成需求，也就是如何从欲望中发现需求和创造需求。在这方面有个人特别牛，就是亚德里安·斯莱沃斯基，他在自己的畅销书《需求》中，总结了发现需求和创造需求的6大关键。\n\
    \n+   1. 为产品赋予魔力。\n   产品功能是理性的、参数化的“左脑需求”；情感诉求是感性的、非常冲动的“右脑需求”。\n\n+   2. 化解生活中的麻烦。画出用户的麻烦地图，每个麻烦，都是地图上的一个摩擦点。每个摩擦点，都是一个创造新需求的机会。\n\
    \n+   3. 构建完善的背景因素。如何来判断土壤是否合适呢？你可以从时间、技术、文化和资源4个维度开始。\n\n+   4. 寻找激发力。没有激发市场热烈反应的产品，可能因为种下了“假种子”，也可能是种下了“休眠中的真种子”。怎么激发“休眠中的真种子”呢？\n\
    \n+   5. 打造45°精进曲线。用户的需求，是在不断深入，升级，变化和消失的。对需求的探索，不能停止在“找到了的那天”，\n\n+   6. 去平均化。没有一种用户，叫做“平均用户”，也没有一种需求，叫做“什么都好”，更没有一种产品，叫做“满足一切想象”。\n\
    \n总体来看，这6大关键都是在发现需求，但除了发现需求，我们还要创造需求。什么意思？发现需求，是产品形态已被发明的情况下，我们还能发现什么需求；而创造需求，是用科技创新，从“未实现的欲望”这个清单里，“捞出明天的”需求。\n\
    \n那发现需求和创造需求有哪些工具呢？我们学习了四种。\n\n+   1. 问卷调查。靠谱的问卷调查，是个技术活。你需要学好四门课：概率课、心理课、沟通课和逻辑课。\n\
    \n+   2. 用户访谈。大部分用户分不清事实和观点，所以用户访谈非常不容易。你要学会问三类问题：1）你正在解决什么问题？2）目前你如何解决该问题？3）有什么方法能帮你做得更好。\n\
    \n+   3. 可用性测试。就是通过观察有代表性的用户，完成产品的典型任务，界定出可用性问题并解决，让产品用起来更容易。\n\n+   4. 数据分析。很多时候，用户通过问卷调查和用户访谈表达的都是自己想要的，而不是真正需要的，但用户行为所遗留下的数据却是很诚实的。你可以通过分析搜索数据、行业数据、行为数据等来理解用户真正的需求。\n\
    \n# 今日概要：\n\n划重点\n\n> 从欲望到需求，靠科技进步；从需求到产品，靠设计制造；从产品到商品，靠商业模式。\n\n![](img/6b086af319379c0fa7ce76dc48c3f1a1_41_1.png)\n\
    \n![](img/6b086af319379c0fa7ce76dc48c3f1a1_41_2.png)\n\n刘润\n\n学了三周的需求，你有在生活中发现什么真正的需求吗？欢迎你在留言区分享，与大家一起，过过招。\n\
    \n![](img/6b086af319379c0fa7ce76dc48c3f1a1_41_3.png)"
