  md: '# 081 | 设计5原则：从身边的“诺曼产品”中，找到创业机会


    081 | 设计5原则：从身边...


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    花了三周时间，我们从“欲望”出发，学完“需求”，本周终于要进入“产品”这个大模块了。今天，我们先从产品“设计”学起。


    我经常出差，在机场休息室里，常常看到很多咖啡机上都贴满了小字条：不要按这里，按那里。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_46_0.png)


    太不美观了吧，但为什么会这样？因为，你遇到了 一台“诺曼咖啡机”。


    唐纳德·诺曼，是美国著名的认知心理学 家、工业设计家，是产品设计领域真正的 大师。他在著作《 设计心理学》里，列举 了很多日常生活中糟糕设计，比如难以 打开的门、令人迷惑的电灯开关、无法弄
    明白的淋浴控制器，引起无数共鸣，以至 于后来人们把“反人性”设计的产品， 叫做“诺曼产品”。


    那到底什么是“顺乎人性”的设计呢？我举个例子。


    你走进冰冷的房间，冻坏了，赶紧开空调，,Uu叫，U。20 20 度就够暖和了，你为什么要设到30度？因为你希望房间马上、立刻暖和起来。你其实也明白，就算设成3000度，温度提升的速度也不会更快。但，这就是“人性”。


    所以，什么是“顺乎人性”的设计？如果设定温度，和当前室温差距过大，就增强马力，加速缩小差距，这就是“顺乎人性”的设计；相反，均匀加热的设计，与人的自然意愿不符，就是“反人性”的设计。


    天啊？按照这种定义，那这个世界上，到处都是“反人性”的诺曼产品啊？确实如此。使用某产品遇到麻烦时，别自责，那不是你的错，而是你遇到了“反人性”的诺曼产品。诺曼产品的存在，人类，
    们创造者留下巨大的机会。


    # 概念：设计5原则


    那到底怎样才能发现，并且消灭“诺曼产品”呢？诺曼在《 设计心理学》这本书里，介绍了具体的方法，被奉为经典，这就是著名的“设计5原则”。


    # 一、示能


    示能，就是不需解释，一看就知道怎么用。


    你希望门是被拉开的？那就设计一个拉手，一看就知道要拉；你希望门是被推开的？那就不要拉手，放一小块平板，一看就知道要推。一看就知道怎么用，自己是自己的说明书，这就是示能。


    # 二、意符


    意符，就是表达意思的符号。


    有些洗脸盆的排水口，是按压式塞子。这就是典型的诺曼产品，因为没用过这种塞子的人，可能一辈子都想不到它还能按下去。


    那怎么办？在面盆旁边贴个标志，写着“按压排水”。这就是意符。门上贴的“推”或者“拉”，也是一种意符。一进电梯，广播响起：请按要去到的楼层。这也是一种意符。


    # 三、约束


    成年人的药，怕被小孩子当糖果吃了，怎么办？用意符的方法，在瓶身上印：“儿童勿食，后果自负”吗？当然不行。你可以把瓶盖设计得很紧，紧到只有大人才能打开。


    这就是“约束”设计原则。组装家具时，不同部位用不同形状的螺丝；微波炉通电时被打开，强制断电；重置手机，屏幕会弹窗好几次提示，这都是约束设计。


    # 四、映射


    进了酒店房间，手边七八个开关，不知道哪个开关控制哪盏灯。这就是“映射”没做好。


    好的映射是怎样的呢？台灯开关就在台灯上，不要放床头；汽车座椅的调节按钮，就设计成汽车座椅的样子；热水一律在左，冷水一律在右，不要反人类。


    # 五、反馈


    好的设计，必须有及时反馈。比如电视遥控器，按下后电视必须立刻点亮。如果做不到，至少遥控器要“嘀”一声，否则用户会不知所措，按来按去。


    手机上的虚拟键盘，主动震动；电动汽车，模拟发动机轰鸣；各种指示灯、提示音，都是反馈设计。反馈必须及时，即便延迟1/10秒，都会让人觉得不安，恼火，最后放弃。


    # 今日得到：


    划重点


    1. 这个世界上，有太多反人性的诺曼产品，这就给创业者留下了巨大的机会。那怎么样才算是好设计呢？请记住唐纳德·诺曼提出的 设计5原则：示能、意符、约束、映射、反馈；


    2. 你自己也是一个产品，别 人和你打交道，就是在使用这个产品。比如别人交代你的事，一直没有回音，就违 反了“反馈”原则。做人，不要做反人 性的“诺曼人”。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_46_1.png)


    刘润


    你还见过哪些反人性的“诺曼产品”呢？它违 反了设计5原则中的哪一条？应该怎样改进？


    欢迎你在留言区分享，与大家一起， 过去招。也别忘了把今天学到的内容， 分享给你的设计师朋友，也许能够帮助 他。'
