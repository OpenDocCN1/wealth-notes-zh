  md: '位置？


    这道题我先告诉你答案：一定有。


    很多同学会想：我上山跟下山的速度肯定是不一样的，那是不是一定有呢？可能有吧。怎么证明呢？很多人就开始列方程，算了一打草稿纸也没算出来。


    你可以把这道题转换变成这样的一道题：你和另外一个人，一个从山顶往下走，一个从山脚往上走，走的是同一条路，是不是一定会相遇？答案是一定的啊，你们走在一条路上，一定会遇见的。


    这道题就是这么简单，但如果你不懂得“转换思维”，可能就是答不出来。


    甚至，如果你习惯用数学方式来解题，我还可以给你提供一个思路：你可以画一个坐标系，横轴是时间，早7点到晚8点，纵轴是山的高度，从0到海拔多少米。这时候你按照两天的行程画出两条线，你就会发现，无论你怎么画，两天的速度有多少不一样，这两条线都一定会在某一时刻、某一高度相交的。好，第三题就说到这里。


    这个“转换思维”有什么用处呢？就是用“换个角度”这四个字，换个角度。


    顾客吃完饭结账，200元。服务员说，"对了，我们今天有个充值免单活动。您只要充值1000元，这顿饭就可以免单，很划算呢"。全额免单？这是莫大的优惠啊！你可能冲了1000元。但是，如果有“转换思维”，你就会想到，这“其实就是”花1000元买1200元的东西。相当于打了83折。


    # 第四题：


    4）上海有多少辆自行车？


    这个问题吴军老师在他专栏里讲高盛的时候，也提到过一个类似的，问的是纽约上空在任何一个时间点有多少架飞机。它的逻辑本质上跟自行车这道是一样的，感兴趣的同学可以看一下文末的链接，我从吴军老师那里申请来了这篇文章，给你免费读。


    这道题考的是“系统思维”。也就是你理解一个系统、事物之间的关联的能力。这道题其实是没有标准答案的，我在这里给你提供几种思路。


    比如，你可以先查一下上海一共有多少人口，接下来你可以估算一下，这些人口当中有多大比例是骑自行车的？比如可能20-60岁之间，工作的人会骑自行车，通过比例你就可以估算出有多少自行车。你还可以大致算一下上海有多少条街道，每条街道大致能容纳多少辆自行车，这样也能得出一个相对确定的数字。甚至在以前，自行车挂车牌的时候，有的人会说，我去街上随机拦几十辆自行车，算出这几十辆自行车车牌数字的中位数，通过这个中位数，我也能算出上海市一共发放了多少车牌。


    当然，这些都是思路，而且也并非是完美的思路。这就对了。因为只有没有标准答案，我才能测试你的思路，测试你发现自行车和人群、自行车和街道、自行车和车牌或者和这个生态中其他因素的关系的能力，也就是系统思维。


    这种系统思维能力重不重要呢？这种系统思考的能力，在软件世界的能力，我想我就不用说了。就算在商业世界，也尤其重要。比如，在分析房价问题时，到是房租决定了房价，还是房价决定了房租？当你能够画出一张模型图，找到中间相互关联的各种自变量和因变量，你才能系统性地思考和回答这个问题。


