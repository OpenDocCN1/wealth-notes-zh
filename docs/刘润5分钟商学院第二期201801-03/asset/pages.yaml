    上周说这道题的时候，我说大部分人是没学过数据结构的，如果你不懂，可以忽略这道题。这其实是我埋的一个伏笔。我之所以放这道题在这里，就是想看看，在不懂计算机、不懂数据结构的情况下，你是否会去查一查什么是链表，什么叫做指针。


    以前我在微软的时候，有一个人来面试，但是面试没通过，他就特别遗憾，说特别想进微软。当时，他的面试官就从桌上拿起了一本厚厚的全英文的书，跟他说：如果Mr.


    那我们说回这道题。你对区块链感兴趣吗？区块链就是一种链表。但是，很多号称懂区块链的人，可能从来没有学过“链表”这种数据结构。我们简单介绍一下。


    什么叫做用两个指针来判断一个链表是否有环？


    你可以把“链表”想象成无数的小房间，每个房间里面都有一张纸条，纸条里写的是下一个房间的坐标，如果你进到第357号房间，纸条上写着456，那你就跑到第456号房间。然后456房间里面写着578，你就再跑到578号房间，然后从578再到632，从632再到7号房。这就叫链表，其实现在一点都不复杂。


    那什么叫有环呢？你到了7号房间，发现里面的纸条写着456。你进到456，哎，我刚才不是来过吗？这就是有环。那什么是指针呢？你，或者说一直在走的这个人，就是指针。


    那么怎么来判断这个链表是不是有环？这里面考察的就是“相对思维”。


    这道题的解法是这样的。让两个人同时走房间，其中一个人一间一间的走，另一个人要走得更快一些，在前一个人走一个房间的时间内，他要走两个房间。这样，每当前者走一个房间，后者就比前者多走了一个房间，相对前者，后者多走的房间就会越来越多了。那么，如果这个链表有环的话，后者就一定会在某一个房间和前者相遇。否则，两人都会先后到达终点。


    好了，通过这5道题，我其实讲了微软面试时时，非常看重的，独立于专业知识的几种思维能力：


    我很幸运，考试通过加入了微软。在微软的14年，和创业的5年，深深感受到这些能力对我的巨大帮助。不管你是否加入微软，我都建议你，培养这些能力。做出这些题不重要，拥有这些思维能力，更重要。


    好，这就是这5道题的答案了，希望今天的讲解能够对你有所启发。


