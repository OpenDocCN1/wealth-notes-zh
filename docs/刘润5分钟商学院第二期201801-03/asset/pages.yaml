  md: '# 加餐 | ICO：ICO到底是庞氏骗局，还是伟大创新？


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    今天我们来讲“区块链、比特币、ICO的机遇与陷阱”小专题的第3课：ICO。


    如果听完上一节课，你觉得比特币实在是太疯狂了，那你一定没有接触过ICO。ICO的疯狂，比比特币更甚百倍。


    # 概念：ICO


    ICO是（Initial Coin Offering）的缩写，它和IPO（Initial Public Offering），也就是俗称的“上市”，不但是看起来类似，意思也差不多。IPO是股票的首次公开发行，ICO是代币的首次公开发行。


    举个例子。我想基于区块链技术，做一个“分布式智能电网”的项目，建立一个去中心化的、巨大的能源生态体系。我组了个团队打算开干，但是，没钱怎么办呢？


    发行“代币”。


    什么叫“代币”？当这个巨大的能源生态体系建立起来后，各种供电企业，用电企业，和服务企业之间，为了进行“可信的、不需要第三方的”交易，一定需要一种基于区块链的、用于流通的“货币”。这种只能在我这个生态系里流通的“货币”，就叫做“代币”。


    # 运用：


    我决定，发行1亿枚“代币”，并给它起个名字，叫做“能源币”。这1亿枚能源币的分配方案是：20%归创业团队持有，30%奖励挖矿者，还有50%销售给投资者。我承诺，能源币只有1亿枚，永不增发，所以不用担心被稀释。


    你对能源币感兴趣吗？感兴趣的话，就来投资我的ICO吧。这就叫：代币的首次公开发行。我只接受两种投资方式：比特币，和以太坊。我决定，首次发行10%的能源币，也就是1000万枚。发行价是：1枚比特币，可以买1000枚能源币。


    现在我们来算一个账。1000枚能源币，可以换1枚比特币，1枚比特币可以换10万元人民币，那这1000万枚能源币值多少钱呢？10亿人民币。


    # 今日得到：


    # 划重点


    +   1. ICO，就是代币的首次公开发行。代币不是股票，是某个特定生态内流通的“货币”。

    2. 代币有没有价值，要看这个未来的生态系是否真能建立，是否真有价值。


    刘润

    区块链、比特币、ICO到底是机遇还是陷阱？我们下一节课讲。

    有人说ICO是庞氏骗局，有人说ICO是伟大创新。你认为呢？

    欢迎你在留言区分享，与大家一起，过过招。也别忘了把今天学到的内容，分享给你对ICO感兴趣的朋友，也许能够帮到他。'
