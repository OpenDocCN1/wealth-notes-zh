  md: '# 第16周周末私董会 | 代工企业如何在国内打开销路


    第16周周末私董会 | 代工企业...


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》实践篇。


    5分钟商学院的同学们，大家周末好！


    获得私董会提问资格的同学是：麦奶奶


    我是做家具的，针对国内中高端家庭市场，产品以沙发椅、家庭办公椅和餐桌椅为主，欧式简约的风格，比较百搭。因为是自家曾经做欧洲代工的工厂，无论工艺、设计还是环保标准，都是欧盟的标准。我们使用的原料都是欧洲或者北美进口的，单品的价格大概是国内市场中国际大牌同类产品的三分之一，甚至更低。家具作为耐用消费品，用户决定购买的周期相对较长，复购率也是很低的，而且国内市场做家具的都是整体家具，但我们是家具单品。我的问题是，第一，一个都是耐用消费品且单价较高又以单品为主的家具品牌，刚进入中国市场的时候应该怎么做？如何设计和区分引流品和利润品？一开始如何引流？第二，我该如何维持购买过产品的老用户，还是以吸引新用户为主？希望润总和同学们帮我支支招。


    刘润


    这个同学的问题比较复杂，但也非常典型。我解释一下它为什么很典型。


    中国相当长一段时间都在做世界的代工厂，在国际大品牌的训练下，中国有一大批很优秀的OEM厂商，俗话说就是代工厂。他们能力很强，对品质的控制能力很好，尤其是一<|start|>中高端品牌的产品，拿到欧洲、美国去，都是大品牌，能卖很高的价格。


    举个例子，有一个做沙发的品牌叫海宁，我记得有一次我去海宁，看到了一个非常漂亮的沙发，这个沙发值多少钱呢？6000块人民币。但是如果卖到欧洲，马上就变成了6000欧元。当时欧元兑人民币的汇率是1：10，这就意味着，这只沙发卖到欧洲就能涨10倍的价格。


    我说这个问题很典型，就是因为这样的企业在中国大量存在。


    # 第一关：产品化


    我们 可以先把产品分成两个部分，一部分叫设计，比如根据用户的真实需求设计出一把椅子来；第二部分是制造，也就是以尽可能高的品质和尽可能低的成本把椅子生产出来。


    很多OEM企业都认为自己有做产品的能 力，但在我看来这其实是要打一个问号的。因为大部分中国的OEM企业，其实是从制造阶段才开始介入的。所以它相对拥有的，是把东西做出来的能力，而不是把东西给设计出来的能力。拥有把东西设计出来的能力的企业，叫ODM，只负责把东西做出来的企业叫OEM。


    但是，真正产品化的时候，真正要单独面对市场的时候，设计这个环节是必不可少的。因为 你用原来的款式肯定不行，这涉及到侵权。同时，你的产品也必须要有设计感，有面对中国市场的独特的
    设计风格和设计语言，才可能在中国建立起消费群体。


    所以，这就是第一关，找到用户的需求，并根据需求设计出用户真正想要的产品。这两周我们也一直在讲需求，同学们可以再回顾思考一下。


    # 第二关：品牌化


    还拿先前说的海宁沙发举例。一只沙发出厂价是6000块人民币，到欧洲就变成了原来的10倍。所以很多OEM厂商心里多少会有一些不平衡：这个东西是我做的，在欧洲卖那么贵，那我自己定个价在中国卖，只卖1/3的价格不行吗？成本一块钱的东西，在欧洲卖10块，我在中国卖3块，我是不是就很有竞争优势了？


    这里其实是忽略了一个问题，那就是交易成本。


    一个大牌的产品为什么能卖到10倍的价格？它可能设计感很强，产生了一定的溢价，那还有什么能让它的价格变成10倍呢？还有品牌。


    品牌主要的目的 是什么？我们之前讲过，...尤其是 在很多信息不对称的行业，比如红木家具、玉石、古董等等这些行业，对方如果说这是纯实木的，是上等的，你作为消费者其实是很
    难分辨真假的，那这个时候，你就会想：买大牌的 总不会错，那么大的牌子总不至于骗我。


    这就是欧洲的这些老牌企业，花了很多时间和精力培养用户的信任和偏好的结果，这也大大降低了用户的选择成本，那么它自然会卖的更贵一些。


    所以说，要想真正面对终端消费者，慢慢让自己品牌化是中国的这些企业必须走的一条路。关于品牌建设，同学们也可以复习一下这一季专栏第一季度的内容。品牌建设就相当于去占领消费者的心智，不管你未来是做2B
    的生意还是做2C的生意，占领心智都是必须要做的一件事。


    这就是我要说的第二关，从产品化到品牌化。


    # 第三关：零售化


    零售化是什么意思呢？过去它可能是按单生产的，别的品牌商拿到欧洲去卖，而这个品牌商可能也不是最终的销售者，而是有自己的销售渠道，比如家居商城、专卖店等等，总之你只需要按单交付就可以，销售不用你操心。


    但是，既然谈到了引流品和利润品，那就证明打算自己做零售了。零售这一输其实是跨度最大的一步，因为2B和2C的逻辑是截然不同的。


    我自己在领教工厂的私董会里面有一位组员，这位组员是做袜子生意的，他做了很多年 的袜子，是中国对美国销售的袜子大王，每年有大量的袜子卖给CK、哥伦比亚这样的品牌。他的情况和提问的同学很像，也是OEM厂商，现在想在中国做2C的生意，建立自己的品牌。但是做
    了一很长时间，效果都不是很理想。所以，最后我对他的建议：坚守B端。


    什么叫坚守B端？刚才我说，做流量和做产品是两个截然不同的生意。做流量生意，不仅仅是考虑引流品和利润品的问题，首先的逻辑是你怎么去选址，你要做电商还是做线下，你能覆盖的是哪个年龄段的人群，搞什么样的活动，怎么做自己的产品组合，桌子要不要搭配床，要不要打折等等等等，这里
    不是一个两个问题，而是一系列问题。


    我们曾经讲过一家很著名的公司叫做红领西服，它为美国的莱卡品牌做C2M，也就是用户反向定制西装，每一件西装都不一样。他曾经也很想在中国做零售，但后来他采取策略
    是什么呢？他去扶持了很多做零售的独立品牌，像鄂人邦人等等。他自己的核心竞争力依然放在产品上，同时跟这些零售的独立品牌合作，让他们去面对终端，面对流量的运营问题。


    所以，你的核心能力到底是想做产品，还是想做流量，我个人的建议是一步一步来。


    在一开始的时候，我其实并不建议你突然之间去做零售，因为做零售需要的能力跟原来做产品...'
