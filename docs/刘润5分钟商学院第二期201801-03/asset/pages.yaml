  md: '# 加餐｜刘润：如何使用专栏才能达到最大效果？


    《5分钟商学院》的同学们，大家周末好！


    很多同学留言给我，想了解下如何学习咱们的专栏才能获得更多收获。这个周末，我特别整理了一些学习方法，分享给大家。


    # 第一步：当天学习法


    建议先跟着第二季，每天都有互动。


    第二季的学习方法更加侧重实践，最好用输出倒逼输入，多实践、多留言，或者主动找身边有实战经验的人切磋讨论，同时查看其他有实战经验的同学留言，这些都会加深你对当天内容的理解。周六的私董会栏目，每一期会分析一位同学的真实案例，也是非常好的学习方式，要积极参与。


    学完每一期，记得在文稿中选 сотрудник对你启发最大的一句或者一段话，写上你自己所在公司和行业，对当期内容的应用；你之前看到过的一些相关或类似的知识和观点；你自己看待这个问题异的角度，把它们加入到知识账本中，这样未来回顾看时，你对知识的理解会更加深刻、收获也会更多。


    分享一下咱们的同学任光辉的学习方法：


    我最近想了一招倒逼自己用心学习的方法，分享给大家一下：


    +   1. 让公司的员工自己报名参加我的分享课程，每人每月缴费99元。\n2. 每周我进行2-3次的分享，员工学习完成，可以自己写分享，传给公司的其他员工。\n3.
    设置勋章系统，每个月完成5个勋章，获得100元奖学金。


    结果：21名员工报名参加，占比12%。倒逼自己把5商第1季和第2季，结合复用。用公开承诺的方法倒逼自己坚持。一年半5商的学习，终于有了结果，我策划的一次儿童摄影汇报演出暨毕业作品展，60个家庭突破500块，交收金额23万斤。并且还有二阶收费，10天后的儿童摄影年度展会，会见分晓。


    # 第二步：整体学习法


    建议在第二季学习的同时追第一季。可以一次追一周内容，同一个主题。


    30分钟听完，30分钟看完留言，再花时间思考、理解。即使你是第一季的老用户，也建议回顾重听，不仅可以加深记忆，还能系统性地思考，发现许多新的知识。


    另外，试着养成一个习惯，把你觉得有收获的内容分享给同事、身边朋友，试试在3分钟之内，用你的语言，把你学到的知识讲给别人听，那些你讲不明白的地方，或者别人听不懂的地方，就是你理解的薄弱点。记下来，重新理解后，再复述。


    你也可以把当期内容分享给有需要的朋友们，搜集大家的观点和困惑，多和他们讨论，在思考的同时，把新学到的内容链接到已有的知识上。


    第一季，我们一起学习了260个经典实用的商业概念，帮大家打好扎实的商业基本功。


    第二季，转入真实商战的招法体系，将理论用于实战中。商业世界最复杂的地方是很多人在一个现场跟你博弈，在一个局里面。所以你不仅要想自己的行为，还要想别人的行为。这是从知到行最难跨越的一条鸿沟，你得知道自己对世界的认知是什么样，你还得知道环境的变量是什么样，更重要的是你得去判断跟你博弈的人，他的行为方式是什么样，然后再做出自己的行为决策。


    所以，在第二季里，我们增加了几个环节：周五紧追热点、周六私董会，目的就是为了...


    心法+招式两季一起学习，让你在商业世界中拥有自己的兵器库。遇到商业、管理、个人、效率，任何一个相关问题，都可以来这个兵器库，直接找到解决方案。


    最终，我希望和大家一起努力，成为有无限增长空间的人。


    # 第三步：学以致用


    来看看几个同学们的真实收获。


    +   1、这两招，让他拿下客户几十万的大单


    概念：通过设定、改变、移除用户心中的参照物，达到影响用户评价体系的方式，就是“锚定效应”。


    概念：人们都厌恶“失”，而期待“得”。通过调整价诉方式中“得失感”，影响语义，可以使人做出截然不同的决策，这就是语义效应。


    活学活用：\n胖子会飞：\"我是做化工机械产品的海外销售的，因为做中高端市场、价格不占优势，以往和客户报价时侯总是吸引力不够。听完锚定效应，我把产品设置成了四个阶梯价格：基础型、瞄准同行价格；基本型、正常售价；基本增强型、多添加功能、价格略高几万美元；高档型、豪华配置、价格最...\"


    +   2、这一招让他三个月赚了50万


    概念：想要卖出自己的产品，要先从消费者的心智出发，找到未被满足的需求痛点；用最简...信息不断重复强调；成为消费者心...类别的第一。


    活学活用：\n张琦予：\"我是一名95后的学生，在澳洲念书的同时，和朋友一起做一些淘宝的服装生意。听了定位理论之后，我重新调整了自己的服装卖点和定价策略，强调布料的独特性吸引用户，然后把客户数据备份，过段时间提醒
    vip 用户白衬衣脏了，洗不出色了，来这里可以以旧换新、还可以打折，增加复购率。结果，3个月时间销售翻了几倍、赚了五十多万。\"


    +   3、这一招 让他卖旧家具时多赚了几百元


    概念：评价一个事物，如果有明确的其他事物可做比较，人们就会“联合评估”他们的利弊；否则，人们就会“单独评估”。


    活学活用：\n全德凯：\"我一个朋友要回老家发展了，打算把房子转租，里面所有家...\"


