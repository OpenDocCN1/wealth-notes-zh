  md: '# 091 | 简约至上：简约的本质，是一种商业选择


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    今天，我们来学习一个几乎每个设计师都挂在嘴边的设计方法：简约至上。


    有一次，我坐高铁到南京。车慢慢停稳，我刚准备下车，发现站台上聚集了很多 人，疯狂向我挥手。我一惊，心想：我现在这么有名了啊。我小激动地走下车，发现“粉丝”们还在向车上挥手。回头一看，一个带着黑口罩的年轻从我身后下车，人群大喊着：鹿晗！鹿晗！


    我才知道到，原来鹿晗和我在同一节车厢。我 lập马拿出手机，解锁，翻页，找到“相机”APP，然后举起手机 …… 鹿晗已经在保安的簇拥下，消失了。


    为什么会这样？是我反应太慢吗？我要求缚手机的速度，以准备好下次遇到胡歌吗？


    并不是。主要是因为这款手机“瞬间拍照”的功能，太复杂，不“简约”。


    那什么叫“简约”？


    2007年，两个年轻人也遇到了类似的尴尬。他们决定开发一款“瞬间拍照”的设备，这款设备没有说明书，没有连接线，甚至没有物理变焦，但拿出就能拍，拍完就能分享到Youtube视频网站。


    这款摄像机叫做“Flip”（快速翻动的意思），一上市就在美国掀起狂潮，在整个摄像机销量只有600万的10年前，卖出上百万台，大获成功。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_65_0.png)


    为什么会这样？因为“简约”。


    # 概念：简约至上


    这让很多人不解。人們需要物理变焦和影片編輯功能啊，也需要延时摄影、手动操作和各种滤镜啊！


    科尔伯恩在他的经典著作《简约至上》里说，这个问题的核心是：你说的人们到底是谁？他把这个“谁”，分为三种。


    +   第一，随意型用户，也叫新手用户，大约占20%。他们就是随便玩玩的，门槛足够低就试试。

    第二，主流用户，也叫中间用户，大约占70%。他们为完成某个任务而用你的产品，几乎不会有兴趣用所有功能。

    第三，专家用户，大约占10%。他们喜欢深入研究产品，探索新功能。


    你说的人们需要这个，也需要那个，其实只是专家用户需要。但专家用户只有10%，你为10%的人，开发90%的功能，得不偿失。每项多余的功能，都是成本，你的制造成本和用户的认知成本。


    那么怎么办？


    那专家用户呢？让他们去用单反相机吧。


    # 运用：


    具体怎么做？你要学会四种方法。


    2006年，研究人员做了一项实验。两个播放器，一个有7项功能，另一个有21项。专家让第一组观察，第二组试用，然后问他们，更喜欢哪款。观察组有2/3的人选择了功能多的型号；试用组56%的人，选择了功能少的。


    也就是说，功能多对于没试用的消费者有吸引力，但消费者使用后，会更喜欢因为功能少，而更易用的型号。


    所以，怎么办？大胆“删除”非核心功能。比如，遥控器上真的需要那么多功能键吗？是“专家用户”需要？那就删除。


    小米决定，把传统电视的“72键”，缩减为11个键。大受欢迎。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_65_1.png)


    那么如果必须有那么多按键呢？那就重新分块组织。把太多的东西，分到合适的里面。


    如何分组呢？可以用空间的办法，比如点开第一级，打开第二级；可以用时间的方法，比如点击第一步、进入第二步。


    那些主流用户不常用，但是不能少的功能，就隐藏。


    比如，遥控器上的“自定义功能”，必要但不重要，隐藏；网页上的按钮，鼠标划过去，才显示介绍；微信里，长按语音，才会出现“转文字”的菜单。


    那有些很必要，但是不方便的功能呢？那就“转移”。


    什么意思？比如在电视上输用户名、密码？很不方便。那就用手机扫描二维码，在手机上输。这就是向其它设备转移。


    # 今日得到：


    划重点


    1. 什么叫“简约至上”？简约至上的本质，是一种商业选择：通过只服务70%的 каждому用户，来简化产品。

    2. 具体怎么做？主流用户用不到的功能，删除；经常用的功能，组织；不常用的功能，隐藏；不好用的功能，转移。

    3. 简约的本质，是取舍，是得失。只服务70%的用户，看上去是舍，是失，但结果却让最主要的用户满意了，是取，是得。只有想清楚你要服务哪群人，才能把那群人服务好。'
