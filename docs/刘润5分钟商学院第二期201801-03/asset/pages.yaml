  md: '这部分该如何优化呢？作为创业者，站在员工这一端肯定会想一个道理：我特别想喝可乐，可是到楼下去买好麻烦。这时候，如果公司的无人货架上就有可乐，而且比楼下的便利店买得更便宜，那么我一定会买的。这个需求很明显，所以相对此前两个交易结构来说，这个交易结构更容易被创业者想到。所以，你的竞争对手可能是楼下的便利店以及电梯间，甚至还有一楼的自动售货机。这时候，可能就需要你不断地去向最终消费者强化，你的无人货架有多便宜、多省时间，这样才可能有所改变。


    好了，我总结一下。无人货架这种商业模式我们称之为B2B2C的无人商业，这里有三个交易结构，创业者要做的就是分别优化这三个交易结构。


    要注意的是平衡成本之间的关系。一边是省下来的制造成本和租金成本，一边是提高了的信任成本，只有当前者大于后者时，这种模式才能成立。至于如何提高成功的概率，还是要通过实际运营过程中的数据，才能找到解决方案。


    面对他，你要知道，你得解决老板的两个需求：一是“显得”他很关心员工；二是提高员工的工作效率。


    这里你要记住：这个商业模式，如果能够成立，最终动力一定是来自于有人购买商品。让消费者获利，是一切的起点。这是大家最容易想到一个交易结构，但是前两个交易结构你也一定要忽略。


    以上就是我对garra同学的问题的回答，希望能给他和其他同学一些启发。当然，我也选出了10名同学作为这次私董会回答的获奖者，他们分别是：


    请中奖的同学记得在留言中


    我觉得老板希望员工在有效的时间内有更多的产出，还有希望员工加班。相比早餐，下午4点的下午点心和晚上加班夜宵更容易吸引人一些。早上从外面进来，经过的路线中可选早餐的地方太多，但是下午肚子饿了，还有晚上加班，只能选择外卖，相比外卖，当然是1米以内的无人货架更方便了。


    而解决老板的什么痛点，取决于如何谈判。比如谈判的时候，可以告诉他们，放上无人货架，既可以增加员工的福利，最重要的还能提高工作效率。毕竟加班不饿肚子，是可以调动他们积极性的。


    比如无人货架上可以有微信扫码请大家吃。员工加班的时候，老板可以通过公众号下单，发到群里，鼓励小伙伴，而每个加班的人可以先领取的凭证到无人货架扫码领东西。既能互动，又能体现老板体恤下属的行为。


    garra同学，您好。我身边有两个朋友，2017年也加入了新零售的厮杀战团，拓展方式和您一样是BD，恰巧刚刚参加过他们的战略研讨会，有一些心得分享给你。


    烧了半天大脑，最后让我记住的反而是一个BD之王的故事。这个小兄弟姓李，以前卖过保险、卖过房子也送过外卖。小李和所有没资源的BD一样，一开始就是去扫楼，挨个公司去找行政。扫了一个星期的楼，小李觉得很不舒服，因为经理分给他的地盘是一个新的商业区，写字楼相对比较高档，都是谢绝推销的，自然被保安、楼宇管家各种不待见，很窘火。


    第二周，小李打算去最后一个创业园区试试看，如果还是颗粒无收就不干了。果不其然，跑了一整天，依然没有收获。不过好在创业园区管理不像别的写字楼那么严格，也加了一些行政微信，以便日后沟通。那天晚上8点多了，小李跑最后一栋楼。在大堂看见了一个送外卖的人搬了好几箱子货准备上电梯，小李帮他按了电梯。


    本来晚上8点加班叫个外卖很正常，不过这个外卖小哥送的却不是快餐，而是两箱方便面和两箱红牛。于是小李就和外卖小哥聊了几句，得知3楼这家公司每周都会叫两三次代买服务。


    故事讲到这里你一定也猜到结果了，这是一家IT公司，技术团队有上百人，天天加班是常态，方便食品与能量饮料的消费非常大。小李只是和他们说了一句：我可以在你们这里放两个货架，你们想要什么随时可以拿走，不用叫外卖。第二天，该公司的行政主动联系小李来安装无人货架。后来，该公司的工程师陆续给小李介绍一些别的公司的工程师。小李再去找行政就好谈了很多。


    最后，只用了两个多月短时间，小李一个人就放出去了100多个无人货架。用户企业清一色是技术驱动型公司，货架上摆的最多就是方便食品和能量饮料，消费者清一色的工程师，并且他的货架损耗率小于5%。


    故事讲完了，我们讨论过后得出了一个公认的结论，就是想要引发网络效应，就必须对企业进行画像，还要对企业的员工进行画像。就像小李一样，击中正着找到了技术型企业和工程师。在这一类用户眼里，无人货架带来的新体验要比呼叫外卖小哥的旧体验强，同时替换成本是0，上无人工货架就成了顺理成章的事情。


    在这里，借用一下俞军老师的用户价值公式：套用这个公式，早餐是很低价值的，水果也很低价值……没有用户价值的东西，是不会被用户推荐的。


    你可以先针对一类类型的企业进行分析，除了IT型之外，外贸型企业一般都是什么节奏呢？他们的员工经常消费什么呢？消费这些东西的场景是什么呢？替换成本有哪些呢？


    明确回答你一个问题：企业管理层的一个共同的痛点：怕员工偷懒、分心导致效率低。然后，一个类型一个类型地去攻破，无人货架才刚刚开始，作为5尚的学生，真心希望你能成功。最后，借用刘润老师对新零售的定义来结尾：“所谓新零售，就是信息流、资金流、物流的万千组合”，你可以回顾一下刘润老师新零售专栏。我读了刘润老师这篇专栏不下50次，每次都有不同的收获。也正因如此，才有资格参加圈内的战略研讨会。


    这个无人货架现在遇到的痛点是这种零售模式的痛点，前几天我看到有个案例分析是这样说的：在互联网交易平台中，交易牵涉的方数越少，发展速度越快。因为每完成一笔交易，相当于平台要在这些方之间完成撮合，需要的撮合方数量越多，交易规模越难，也越慢。


    办公室无人便利货架，涉及到的撮合方包含场地方、货架方、补贴方、用户方四方，甚至可能面对场地方和决策方分离，用户方和买单方分离。并且在这种多角撮合关系中，除了无人便利货架平台本身，其中的任何一方都没有足够的动力或者愿意去推动交易的达成。这就是这位同学所说的现在没有什么新客户愿意去用，红包奖励效果也不大，也不愿意介绍别的企业客户去用的原因。


    无人便利货架希望通过场景化地、密集地布点，在物理距离上更加贴近用户，从而提高用户的购买频次，但货架的形态在距离上的接近，却不得不牺牲了SKU的丰富度，从而牺牲到了店流量的转化率。年轻人为什么愿意去便利店买东西，哪个不是便利店的产品比超市的产品会贵一些。原因是，在时间有限的情况下，年轻人日常需要的大众消费品（零食、餐饮、日用品等）基本上都可以从物理距离更近的便利店找到。这意味着，商品SKU丰富度是促成消费转化的一个重要因素。


    反思无人便利货架，目前，无人便利货架更准确的名字是“无人便利零食货架”。有了无人便利货架，用户想吃零食可以随时可得，但是如果想买其他日用品等，还是要去便利店或者超市。所以，无人便利货架为了便利和方便管控，第一时间牺牲了SKU的丰富度，随之牺牲了高客单价转化的机会。此消彼长之间，很难说无人便利货架的消费转化率能有相较其他零售业态更为出色的转化率。SKU少，而且过于标品，可能会是制约无人货架消费转化的一个瓶颈。


    我觉得无人货架要想突破瓶颈还得与办公室的白领进行一项产品调研。根据'
