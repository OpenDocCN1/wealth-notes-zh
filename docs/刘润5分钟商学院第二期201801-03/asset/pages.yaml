  md: '而且也推荐给了朋友。因此我的建议是，可以针对不同的人群，开服务侧重不同的直营店，因为加盟店的话，没有形成流程规范之前服务质量不好控制，一旦服务质量不好很容易流失客源。另外也可以让技师持股直营店，把他们变成命运共同体，这样也能保证服务质量。


    # 10、叶枫


    我在一个地级市做化妆品，前几年化妆品店主要开在大型商场和超市，市场上实体化妆店只有10来家，生意还不错。后来有一个开实体店的人觉得生意不错，为了迅速占领市场，一口气开了20多家店。结果由于扩张迅猛，资金周转困难、管理跟不上、货源跟不上、员工服务跟不上，只能勉强维持经营。到后来不得不关到只剩下三四家。所以说，抢占市场先机不是绝对的，没有任何规定，你在那里开了，同行不能再开。


    所以，更建议开直营店之前，先梳理出一套行之有效的管理方法、经营理念和服务体系。稳步增长直营店，开一家成一家，才会让你的店成为品牌店。品牌店比的不是数量，比的是服务和品质，如果你不能控制店的品质和服务时，比如加盟商急功近利，当他不挣钱，抱怨，指责，扯皮随之而来，后面就会很麻烦。


    小小鱼同学，请在留言区留下你的联系方式，得到的同学会联系你。同时，也建议小小鱼同学结合这些留言思考下自己的下一步打法，期待你的好消息。


    为了让最需要的同学们得到帮助，我们请有问题咨询的同学出价，比如100元，1000元，或者更高。这钱不给我，相反，我也自掏腰包，形成双倍奖金池。然后把奖金，给到那些踊跃帮助同学，回答最有价值的10位同学。


    本周，获得私董会提问资格的同学是：David


    我是一家原创视频制作公司的创始人，致力于为企业打造自带流量的电影级创意视频方案。我的强项是为别人的产品创造自带流量的视频内容，我还在尝试“一支广告，多个产品共同营销”的互动植入式营销，希望能够吸引更多客户，而且我的价格只相当于传统4A广告公司的1/3。但问题是，遇到自己的营销问题时，我反而不知所措了。还希望大家为我再支支招，我该往哪个方向营销自己呢？


    他出价1000元，所以加上我自掏腰包的1000元，本周奖金池达到了2000元。欢迎大家一起来给这位同学支支招。希望每位同学都踊跃发言，认真思考，我会挑选10位同学的精彩回答，获得这笔奖金奖励。（以节操币的形式返还给大家）


