    曾宇帆同学，你好。我在之前看专栏留言的时候就认真考虑过你这个问题。我从以下5点谈谈我的看法：


    +   1. 客户出行的本质需求是从此“点”到彼“点”，是一个点对点的空间解决方案。这种解决方案又会根据距离的远近有不同的策略，比如单车、地铁、公交、打车、自驾，这些都是为了解决这个问题，至于客户担心的充电问题和30万元价位的问题无非是因为替代方案太多。如果陷在这个维度竞争，电动车很难具备优势。


    +   2. 燃油车牌照拍和类似北京的“抽签”政策，是目前电动车最大的卖点。北京现在就连电动车也开始抽签排队了，而最大的电动车品牌就是“北汽”。在影响力上来、看，小众的品牌和车型，又是毫无优势。但是我在网上专门看了你们的宣传片，是和戴姆勒合作的，在性能和舒适性上，可以类比成电动车界的奔驰。


    +   3. 从集客量入手的话，其实重点就放在营销策略上了。这里的内容可以参考《5商》营销的那一周内容，对于小品牌而言，选中一个渠道借势营销会有奇效。比如某个红毯秀或者有明星的场合，蹭一把热点。最近吉利成为奔驰大股东，也可以借势营销一下。


    +   4. 关于目标人群的定位。我有一个建议：跟着房地产商走，和他们合作。深圳的房产还会走高，你们的电动车能够在新房产的地方出现，满足新买房用户出行的需要，这种场景的架构更有意义。而且，因为目前充电桩的稀缺依然是现状，所以和房地产商合作，能够在小区有充电设施，更容易满足客户需求。


    +   5. 在转化率和成交量上。如果价格上和同质产品相比没有优势，就主打外观和性能，在面子上和电池持久性上让客户为你买单。你们的车很“酷”，就足以吸引爱面子的车主。我之前和一个新能源车主聊过，因为城市充电桩并不多，晚上有的还会关门，司机很担心续航问题，所以续航500公里是个非常好的卖点。


    同学你好，看完你的问题，我觉得应该从购买用户的心态入手。我在网上查找了一些数据及调查资料，关于你的问题可以分为以下几点。


    在深圳买新能源车的原因：


    +   1. 免摇号，省事儿

    2. 不限号，可以满足家里需要多辆车的需求

    3. 认为新能源车是未来趋势，环保

    4. 操作简单，噪音低


    在深圳不买新能源车的原因：


    +   1. 充电难，充电慢

    2. 车价对比同档次燃油、电混车高

    3. 售后服务跟不上

    4. 续航差


    有了市场调研后，我们来进行分析：


    +   1. 产品：腾势的主要问题是没有绝对的亮点，其次即使算上补贴，跟同价位的燃油车或混动车相比，仍有较大差距（车内氛围、做工等）。所以你对自己的产品最大的优势一定要车主抓住。


    +   2. 潜在客户：你要思考你的潜在消费群体是哪些人？你们的客户购买力怎么样？你们的客户群体喜好是什么？


    方案及建议：


    +   1. 我们的潜在客户：

    第一类，买车只是为了日常通勤，上下班等不需要长途出行的客户。

    第二类，家里已经有一辆车的客户（经济实力较好），希望用车更方便。

    第三类，接受新新鲜事物的新新人类。


    +   2. 潜在客户在哪：

    方法一，针对已买客户做问卷调查，在他们经常出入的生活场所做广告。

    方法二，去创新创业产业园区寻找更年轻的客户群体。

    方法三，和高端的售楼处及高消费休闲娱乐场所共同做活动，让更多有经济实力的人熟知这个品牌。


    3. 提高转化率：

    提高品质并降低交易门槛，可以先让顾客付押金进厂几天试驾。买车，其实更重要的是品质要有保证，也可以尝试推出更多延保类服务。


    以上，供你参考，希望帮到你，谢谢！


    曾同学你好。针对你说的电动车销售困境，恰巧去年我试驾了腾势，也与北京区域销售人员有过简短交流，把我的思考呈现，供你参考。


    我重点针对你提到的第二点，如何让集客量多又有成效进行阐述。你已经积累了很多过往消费者提到的痛点经验，总结来看无外乎5点，而前3点说到底都与电池相关：


    +   （1）充电桩问题。消费者顾虑所在城市的充电桩分布有限，担心行走在外，车子没电也找不到充电桩；消费者还顾虑自家小区车位紧张，没办法安装充电桩。


    +   （2）充电时间及效率：现在市面大多电动车，慢充需要7-8小时，快充约半小时，但快充频繁会损伤电池寿命。总体来看，充电效率太慢，时间太长。


    +   （3）电池问题。消费者担心电池用不久，三年到五年就折损到需要更新，害怕更换电池的费用和麻烦。


    +   （4）续航里程。去年我试驾的腾势是最多少400公里续航，已经算很不错了。但消费者拿来与汽油车相比，仍然担心续航里程导致不能长途。


    +   （5）价格。腾势的30万元定位，在电动车中略显尴尬，与相同学价位汽油车相比，明显处于劣势。


    仔细分析这5个痛点，第1、2、4点，参照当下各自国家政策及市场大环境难以解决；第5点价格难以解决；第3点电池问题，你可以通过企业服务，免费更换电池、免费提供更换及检修服务等来解决。


    结合如上分析，你会发现，大多数痛点不是你能解决的，那么怎么让集客量多而有效呢？可以尝试如下战略，下决心大胆放弃“存在如上痛点”的这部分消费者，将重点放在发展、培养、找出没有上述痛点的...'
