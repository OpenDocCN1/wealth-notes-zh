  md: '# 057 | 品牌符号：构建“品牌符号”的5大路径


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    今天我们要学习的概念，叫做“品牌符号”。


    前段时间有一家公司火了，因为它取了一个很长的名字，叫做“宝马有一群怀揣着梦想的少年相信在牛大叔的带领下会创造生命的奇迹网络科技有限公司”，一夜之间刷爆了朋友圈。你想，这也是一个获得品牌知名度的方法啊，要不要也起一个呢？如果要的话，怎么办？


    要解决这个“怎么办”的问题，我们首先要理解这个问题的本质。


    刚才那个名字确实很有趣，但是现在我给你30秒，请你把它的名字说一遍试试？开始，……，说不出来了吧？说不出来，是因为记不住。这个名字虽然很特别，但你能记住的，还是苹果，娃哈哈，或者可口可乐这样简单的名字。


    这个问题的本质是，到底应该怎样给品牌命名。


    # 概念：品牌符号


    中国著名的战略营销公司“华与华”提出的“品牌符号”理论认为：建立品牌，就是建立一个符号，识别你的产品，浓缩你的价值，让消费者购买你，推荐你。这个符号可以是一个词语，可以是一个图形，也可以是一个声音。好的品牌符号，要方便记忆，容易传播。


    那什么是好的品牌符号呢？什么不是呢？


    华与华在《超级符号就是超级创意》这本书里举了一个生动的例子。两个别墅，西郊庄园，和兰乔圣菲。西郊庄园就是好的符号，一说就明白；兰乔圣菲就不是，因为你没半分钟，估计讲不清楚到底是哪四个字，不方便记忆，不容易传播。


    花钱搞个别扭的品牌符号，再花更多的钱去解释这个品牌符号，是典型的钱多了烧得慌。


    # 运用：


    那怎样才能设计出好的品牌符号呢？今天，我们来学习华与华总结的，“构建品牌符号的5大路径”。


    第一，视觉符号。


    “三精口服液，蓝瓶的。”蓝瓶，就是三精口服液的视觉符号。以后一看黄到蓝瓶，就想起三精，一想起三精，也会想起蓝瓶。


    再比如，你在运动服上看到三条斜杠，会想起谁？是的，阿迪达斯。三条斜杠，就是阿迪的视觉符号。


    再比如，高露洁冰爽牙膏里的冰爽片，汰渍活性洗衣服粉里的蓝色活性颗粒。它们真的是靠这个冰爽，靠这个活性的吗？当然不是。这都是视觉符号，让你识别，让你记住，让你传播。


    设计视觉符号一定要记住，不要赋予它太多内涵，比如“兼葭”。消费者在购买商品时，旁边没有画外音，没有男中音给他脑补“兼葭苍苍，白露为霜”的诗句。


    第二，听觉符号。


    有没有注意到，小米手机的默认铃声，到小米6了都没换过？苹果、华为、诺基亚也都有自己的舍不得换的默认铃声。


    这就是听觉符号。小米有几亿的用户，电话铃声在每个角落的每次响起，都是提醒大家：这人在用小米手机。


    同样的还有Intel广告里的“灯！等灯等灯！”，和拍照时大声喊“田～七～”，都让你印象深刻。


    口语化的宣传口号，也有听觉符号属性。比如“人头马一开，好运自然来”，如此朗朗上口，让你打开人头马时，脱口而出。再比如“西贝莜面村，闭着眼睛点，道道都好吃”，当有人问你“西北莜面村好吃吗？”，你可能会脱口而出“闭着眼睛点，道道都好吃”，而不是“无声细下飞碎雪，放着未尝全盘空”。


    第三，嗅觉、味觉和触觉符号。


    嗅觉、味觉、触觉符号使用没有视觉、听觉符号使用广泛，但也随处可见。


    比如，高端酒店基本都有专门的香气设计，一推门馨香扑鼻；百货商场化妆品区，让人心旷神怡；而星巴克咖啡，则满屋飘香。这些都是品牌的嗅觉符号。


    再比如，康师傅红烧牛肉面里的，“就是这个味儿”，让你很难忘记；在国外打开一瓶老干妈，那熟悉的味道，换谁都不行。这些都是品牌的味觉符号。


    再比如，摸上去像棉布的纸巾，冰凉丝滑的爱马仕，柔软温暖的鄂尔多斯，这些都是品牌的触觉符号。


    方便记忆，容易传播。构建品牌符号的5大路径，你学会了吗？


    # 今日得到：


    # 划重点


    品牌符号可以是一个词语，可以是一个图形，也可以是一个声音。品牌符号的目的，不是感动自己，而是让用户方便记住，容易传播。视觉、听觉、嗅觉、味觉、触觉，都可以搭载你的品牌符号。


    其实所谓品牌符号，就是“抽象化的能力”，把具体的实物，抽象化为语言，文字，图像，声音。这种能力，是一种理解本质，排出杂音的能力，是一种无处不在的能力。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_1_0.png)


    刘润


    你的品牌，有符号吗？你打算怎么设计你“方便记忆、容易传播”的品牌符号呢？你见过最牛的品牌符号是什么？


    欢迎你在留言区分享，与大家一起，过过招。也欢迎你把这篇文章分享给你有品牌没符号的朋友，帮他们降低营销成本吧。'
