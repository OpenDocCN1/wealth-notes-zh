  md: "产品销售价格虽然是国际大牌的三分之一或者更低，但是国际大牌的价格一定是高的，对方有多年品牌积累和完整的前售后服务体系，以及多年经营而得到的信任度和品牌度，这就是它们溢价的能力。\n\
    \n你要计算和您公司同类品牌的定价区别。第一季讲了很多关于“定价，定倍率”的知识，可以用在这里。建议如下：\n\n+   1. 把定价梳理一下，定价不一定最低，而是同类品质产品的“空档价格区间”，把价格定在这里，吸引这个价位购买能力的消费者。是为品牌定价理论的一种应用。\n\
    2. 产品百搭，是一个优点，但对于新品来说，也是一个缺点。缺点就是，用户也可以买所有其他欧式的。建议设计一个独特的系列风格。客户买回去，总觉得已有 ...\n\
    3. 创业公司一开始做单品很好，最好不要羡慕那些有能力或者没能力要强硬的做全部家装的。除非是大牌子，否则很难获得客户的信任，也很难提供优质的全面服务。随着公司逐步成熟，可以逐步积累这样的能力，才会逐渐树立起很高的竞争壁垒。\n\
    \n# 引流建议：\n\n+   1. 样板间照片+互联网，找专业家具类媒体，或者装修这人的微博、订阅号，同时附上电商购买链接。\n2. 找家装设计师或者设计公司合作，为之提供样品，作为精准引流渠道。\n\
    3. 广告、专业展会等（很烧钱）。\n4. 进一步商业模式上的创新。思考新的商业模式。比如，为超级会员提供家具三年换新（收会员费）、家具租赁（适合租房者，未必是没钱的年轻人，北上广深有很多外籍高管都是租房）等创新商业模式都可考虑。\n\
