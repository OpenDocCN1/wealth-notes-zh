  md: '# 第13周周末私董会 | 如何复制一家成功的店？


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》实战篇。


    5分钟商学院的同学们，大家周末好！


    上周，获得咱们私董会提问资格的是小小鱼同学，


    他的问题是：


    我在县级市经营一家2000多平米的足浴会所，自从在得到里学习之后，营业额提升了很多，从以前一天1500的流水到现在一天接近50000，我就做了一样，就是PDCA循环，并用企业微信让循环流水化。每天都通过自查，纠错，解决问题，完善自我。获得客户的好评，并且让生意蒸蒸日上。我自己以前是做会水的，现在属于跨界，我又把足浴会所加上进泡澡洗浴这个元素，获得成功。足浴行业最缺的就是技师资源，我不缺，我在四川凉山这边有很多团队，大量彝族女子进入足浴行业。现在我的问题是，我需要开分店，想听听大家的意见。是只开直营店，一年开一家，还是找资金更快的复制？这中间还有什么风险？


    首先我eya要给大家介绍PDCA循环，这是我们《5分钟商学院·基础篇》的第223节课程，PDCA循环又称戴明循环。P-D-C-A这四个字母，分别代表：Plan（计划），Do（行动），Check（检查），Act（处理）。


    戴明是一位美国的质量管理大师，在他的帮助下，丰田公司获得了巨大的成功。戴明认为，质量管理，企业管理的关键，是持续改进；持续改进的关键，是Plan（计划），Do（行动），Check（检查），Act（处理）这四个流程组成的循环。


    # 1、先说能力。


    当你觉得一家店开得好的时候，你要仔细分析，到底是什么让你_PERCENT店开得好的？是产品好，比如足浴的那种药材，就是和别人不一样？还是管理好，我的服务流程设计，激励机制，就是非常高效？还是因为这一群人同心同力，你的领导力强？还是因为你选址选得好，这个地方人气就是旺？


    # 2、再说品牌。


    # 3、最后才是资本。


    # 1、青岛罗刚


    # 2、章旭'
