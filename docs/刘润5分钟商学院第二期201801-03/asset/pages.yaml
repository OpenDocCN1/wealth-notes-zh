  md: '# 059 | 品牌故事：如果不懂讲好故事，品牌价值可能要大跌


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    今天，我们要学习如何讲好“品牌故事”。


    有一家旅行社，为了品牌宣传，不断强调“我们已经成立20年了”，以营造信任感。但是后来发现，用户并不关心这家旅行社成立了多少年，信任感也没带来多大的价值。怎么办？


    要解决这个“怎么办”的问题，我们首先要理解这个问题的本质。品牌价值分为两个部分：信任价值和情感价值。它们都能影响消费者决策，但是作用方式完全不同。


    我举个例子。


    我想买一台冰箱。但这个市场鱼龙混杂，怎么选？算了，就买海尔吧。虽然比那些杂牌子贵500块，但肯定不会买错。这500块，我们称之为“品牌溢价”。你为什么愿意多付500块？因为信任。


    但是今天有了互联网。一个没有牌子，和海尔一样品质，但便宜500块的冰箱，可以在网上卖。买的人觉得不错啊，就会留下好评，好评会鼓励购买，购买再留下好评。好和不好的信息一旦对称了，用户就可以依靠“口碑”来获得信任，而不再那么依赖品牌了。


    这个问题本质是，“我们已经成立20年了”，这句话试图建立的，以品牌为容器的“信任价值”，正在被互联网时代，不断稀释。


    那品牌就没有价值了吗？当然不是。品牌的信任价值虽然不断稀释，但是情感价值，将会日益重要。你为什么买耐克？因为我“Just Do It”，你为什么买美特斯邦威？因为我“不走寻常路”。为什么买小米？因为我“为发烧而生”。


    # 概念：品牌故事


    讲好一个故事，尤其是能激发消费者强烈情感的故事，说起来容易，做起来难。到底怎么做呢？今天，我们来学习讲品牌故事的三个方法。


    +   1. 讲历史故事。


    在美国有个叫尊本伯特的药剂师，研制一种治感冒、头晕的糖浆时，他的店员不小心把苏打水当做了白开水，没想到调制出来后味道居然很不错。尊本伯特基于这种冒险糖浆，又做了很多试验，最终配制出一种口感很好的饮料，100年畅销不衰。这就是闻名世界的可口可乐。


    这就是历史故事。让你听完之后觉得：能喝到可口可乐，简直是太幸运了。


    +   2. 讲产品故事。


    有一款打火机，曾被鱼吞到肚子里，居然还能用；这款打火机，曾在越南战场上，为一位叫安东尼的战士，挡住子弹救了性命；这款打火机，火焰曾被当作求救信号，帮人荒野求生；这款打火机，甚至曾被用来煮熟了一锅粥。这款几乎无所不能的打火机，就是Zippo。


    这就是产品故事。让你听完之后觉得：不带一个Zippo打火机出门，太不让人放心了。


    +   3. 讲情绪故事。


    如果我的公司没悠久历史，产品也没那么出众呢？


    很多人刚过40岁，就开始拎着保温杯担心中年危机了。可是昔日烟王褚时健，71岁银锭入狱，75岁出狱从零开始，包下2400亩的荒地种橙子，而这些橙子，6年之后才能挂果，那年他81岁。太励志了。


    这就是情绪故事。让你听完之后觉得：我吃的不 NAS


    # 运用：


    所以，作为一个旅行社，你可以讲个“历史故事”，这20年你帮助多少人实现了“世界这么大，我想去看看”的梦想；


    你也可以讲一个“产品故事”，我们的路线是多么的特别，为什么别人才是在“旅游”，而我们是“旅行”；


    你还可以讲一个“情绪故事”，我受够了每天来回两点一线，受够了日复一日没有变化，我就想任性地生活在别人的生活里，哪里怕一天。


    # 今日得到：


    划重点


    品牌价值来自于两个部分：信任价值，和情感价值。品牌的信任价值虽然不断稀释，但是情感价值，将会日益重要。那怎么建立情感价值呢？讲故事。历史悠久的，讲历史故事；产品独特的，讲产品故事；如果都没有，就讲个呼应消费者情绪的故事。作为个人，也要学会讲个人的品牌故事。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_3_0.png)


    刘润


    奢侈品、化妆品是最会讲品牌故事的行业。你听过最打动你的奢侈品、化妆品，或者其他行业的品牌故事是哪个呢？


    欢迎你在留言区分享，与大家一起，过过招。也欢迎你把这篇文章分享给你只靠信任支撑品牌价值的朋友，帮他们学会讲好故事吧。


