    我有个朋友，开了家手机专卖店。一天，客户冲进店里，怒气冲冲：我什么都没做，手机突然就坏了。我朋友斩钉截铁地说：是因为你装了流氓软件。客户一听，发飙了：还不承认，我投诉你们！他们越吵越凶，所有客人
