    +   1. 扬长避短。与传统的燃油车相比，腾势主要 driver''s 缺点是日常充电不便和后期更换电池成本较高，目前的价格也相对较高；优势是戴姆勒的品牌、技术和比亚迪的服务网络，安全性好，续航里程长，容易上牌等。基于这些现实，在定位、营销、服务上，就要尽可能地扬长避短，即扬品牌、安全、续航、牌照之长，避充电之短。


    +   2. 细分客户。针对刚才分析的优势和劣势，重点寻找那些比较在意腾势的优势，对其劣势不太敏感或能够自己解决充电不便问题的客户。我认为，深圳各行各业的创新创业者，就属于和腾势契合度较高一个群体，可以作为营销的重点。比如，将腾势的品牌形象更多地与开拓创新、积极进取等联系起来，打造“创业路上与你同行”为你的成功保驾护航”的品牌形象。


