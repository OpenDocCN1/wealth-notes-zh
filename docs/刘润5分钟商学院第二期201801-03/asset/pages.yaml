  md: '# 第17周周末私董会 | 如何帮一款国产产品走向国际化？


    第17周周末私董会 | 如何帮...


    每天5分钟，解决一个商业问题。欢迎收听《刘润•5分钟商学院》实战篇。


    5分钟商学院的同学们，大家周末好！


    本周获得私董会提问资格的同学是：伊春莺歌。


    创业三年，我从小兴安岭原始森林采集自然蜂蜜，首创自然结晶洞藏技术，做出了可以嚼着吃的蜂蜜品牌“洞藏雪蜜”，不仅获得了《舌尖上的中国》总顾问沈宏非的称赞，还被China
    Daily报道得到欧洲皇室关注。现在我手上已经有了这款打磨好的产品，请同学们指导，我希望对标国际一流品牌做国产传统食品，现阶段应该进行哪些方面的布局，如何更好地组建一支团队，一步步实现国产蜂蜜品牌的国际化呢？求您高见。


    刘润


    首先我要对伊春莺歌表示祝贺，祝贺她有一款不错的产品，受到了《舌尖上的中国》的沈宏非的认可，而且已经在考虑国际化了，我们在第一季里面也用她的蜂蜜做过奖品。


    另外，我也祝愿《5分钟商学院》能成为她和未来合伙人梦开始的地方，因为《5分钟商学院》确实是一个能人辈出、高手如云的地方，希望她能在这里搭建一个不错的创始人团队。


    然后我们来谈谈伊春莺歌提出的这个问题：如何把一个国产品牌做到国际化。


    在我看来，这个问题其实不应该称作一个问题，而是课题，因为这个问题太大了。怎么实现国际化这件事，我觉得写个二十本书都未必能写得清楚。所以在留言里，我也看到了同学们来自各角度的建议，这些建议对于“如何实现国际化”这个课题来说，可能不是解决问题的路径，而是一个可能性，但每一个可能性都有它的价值，所以最后我们会挑出10个建议呈现给大家。


    接下来我谈一谈我对这个问题的理解。由于这个课题确实太大了，所以我来讲几个重要的点，希望能给伊春莺歌和其他同学一些启发。


    中国其实已经有一些很不错的品牌。比如海尔，全球排名第一的白色家电品牌；比如联想，全球第一的PC品牌；比如猫狗的CEO傅盛，刚创业没多久就在美国做了一款很成功的软件叫清理大师，Clean
    master；还有一家很知名的公司叫做传音科技Tecno，2015年我去乞力马扎罗爬山的时候，发现我的黑人向导拿的就是传音科技的手机，看上去是一款比较廉价的功能机，但是他跟我说这个手机是你们中国的第一大手机品牌，当然我们都没听说过，因为这款手机只在非洲卖。所以传音科技也完成了国际化，只不过这个国际化没有中国的土壤，完全是在国际上做好的。


    所以说，不同公司可以通过不同途径完成国际化。那么你就要想清楚一件事：你说的国际化指的到底是什么概念。所以我们来区分一下国际化这个概念。


    +   1. 最简单的国际化指的就是产品的国际化。


    什么叫产品的国际化？比如我们刚才说的“清理大师”和传音手机，这两个产品就是典型的产品国际化。很多中国人都没用过美国的Clean Master，也没用过传音科技，但是它符合当地人对功能
    transverses特殊需求，就能在国际上卖得很好。


    +   2. 品牌的国际化。


    +   3. 文化的国际化。


    现在我们来总结一下今天谈到的国际化的逻辑：谈到国际化的时候，你首先要明确'
