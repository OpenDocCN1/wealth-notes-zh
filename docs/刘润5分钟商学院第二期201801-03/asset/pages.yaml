  md: '# 073 | 去平均化：一次增加一类顾客


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    今天，我们继续学习发现需求、创造需求的“第6大关键”：去平均化。


    让我们先从一个案例开始。


    在美国，随着流行文化（比如摇滚、嘻哈）的盛行，去听古典音乐的人越来越少。怎么办？


    交响乐团的营销经理们相信，享受古典音乐，是每个人都有“潜在需求”，所以，我们只需要让他们进门一次，他们就一定会被古典音乐的强大魅力征服，这个“潜在需求”就会被唤醒。


    然而，事与愿违。他们花了大量精力吸引来新观众，但91%的新观众听完一次后，就再也没有回来过。新观众，完全没有被“征服”。


    为什么会这样？因为古典音乐已经过时，不再是这一代人的“需求”了吗？因为演奏不好，满足不了“需求”吗？因为价格太高，抑制了“需求”吗？


    美国9家交响乐团决定：不猜猜，看数据。他们聘请了一个专业团队做调研，调研结果出来后，所有人都大跌眼镜。让91%的新观众不来第二次的决定性原因，排名第一的，居然是：停车不方便。


    啊？这是怎么道理啊？那为什么“老观众”们，从来不抱怨停车位的问题呢？那是因为，老观众们早就自己找到了停车的方法。而对于新观众来说，停车不便，是阻碍他们成为老观众的巨大障碍。


    交响乐团随即对这个他们做梦也想不到的问题，做出了改善，发现新观众的流失率，有明显下降。


    这是一个非常有趣的案例。新观众的需求，不是“听古典音乐”，而是“方便停车时听听古典音乐”。可为什么大家过去就想不到“方便停车”这一点呢？这是因为，大部分人很容易陷入一种可怕的思维障碍：平均客户的迷思。


    # 概念：去平均化


    没有一类客户，叫做“平均客户”。在“平均客户的迷思”的指导下寻找需求，只能导致功能过剩（提供很多人不需要的功能）、或者功能缺乏（忽略人们实际需要的功能，比如方便停车），或者纯粹的错误（依据猜测和近似性来选择功能，而不以现实为基础）。


    “古典音乐”是平均需求，“古典音乐+方便停车”，是“新观众”差异化的需求。


    那老观众呢？他们“真正的需求”是什么呢？调研结果又让大家大跌眼镜。老观众很喜欢看到年轻人来听古典音乐会。于是，交响乐团把年龄大的人排在后排，年轻人排在前排，让老观众享受那种“后继有人”的满足感。


    “古典音乐”是平均需求，“古典音乐+后继有人”，是“老观众”差异化的需求。


    虽然你很想满足所有人的需求。但满足所有人需求的方法，不是满足一个统计学上的“平均需求”，而是“去平均化”，满足每一类人的“差异化需求”。


    # 运用：


    具体应该怎么做“去平均化”？亚德里安给出了5点建议。


    +   1. 版本去平均化。提供产品的差异化版本，比如 iPhone 的多个配置。 2. 服务去平均化。提供带有第三方差异化服务的平台，比如 iPhone
    的应用商店。 3. 行业去平均化。提供针对不同行业的解决方案，比如苹果针对教育、政府等行业的定制解决方案。 4. 个人去平均化。提供基于数据的个性化定制产品，比如亚马逊根据你买的书，推荐你可能也喜欢的书。
    5. 组织去平均化。设立新的部门，或者新的公司，专门为不同类型的客户服务。比如雀巢为浓缩咖啡市场，而设立的独立品牌 Nespresso。


    # 今日得到：


    划重点


    +   1. 没有一种用户，叫做“平均用户”，也没有一种需求，叫做“什么都好”，更没有一种产品，叫做“满足一切想象”。 2. 用“平均客户的迷思”指导发现需求，只能导致功能过剩、功能缺乏以及纯粹的错误。
    3. 针对差异化的用户，提供“去平均化”的产品。一次增加一类客户，不断丰富。 4. 记住5点：版本去平均化、服务去平均化、行业去平均化、个人去平均化，组织去平均化。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_30_0.png)


    刘润


    你见过哪些产品，是通过“去平均化”，满足差异化的需求，获得成功的呢？

    欢迎你在留言区分享，与大家一起，过度招。也欢迎你把这篇文章分享给你想用一个产品过好所有人的朋友，帮他们拿捏共性和个性之间的平衡吧。


