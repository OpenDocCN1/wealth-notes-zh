    春节结束后，我和得到的工作人员会把大家的分享汇总起来，我相信一定会有来自全国各地甚至异国他乡的分享，所以，通过大家的留言，最终我们就可以一起绘制出一张“现象商业地图”了。开工之后，我会把这张属于你们的“地图”以加餐的形式分享给大家。


