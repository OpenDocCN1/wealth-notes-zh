  md: '# 062 | 网红企业：你就是你公司最大的“吉祥物”


    062 | 网红企业：你就是你...


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    昨天学习了“公关产品”真是让人大开眼洞。但如果我们生产的产品并不面向消费者，比如水泥，纸浆，或者福尔马林溶液呢？这些产品，终究胞汁，我都做不出让人“WOW”一声惊叹的公关产品，怎么办？


    要解决这个“怎么办”的问题，我们首先要理解这个问题的本质。公关产品，可以不仅仅是你新研制的高科技产品。你公司里的任何一样东西，管理方式，公司文化，甚至老板本人，都可以是公司的公关产品。


    我有个朋友，苏尼克兹的创始人，宗毅。他的公司是做热泵的，你就理解为冰箱里的压缩机。也不面向消费者吧？那把什么做成“公关产品”，才能增加品牌知名度呢？做一个全球最大的热泵？


    宗毅没有。宗毅选择，把自己做了公司最大的公关产品。


    2014年，身在广州的宗毅成为特斯拉在中国的第一批车主。当时中国的充电桩非常少，他在北京提完车后，根本开不出北京城。怎么办？宗毅自掏腰包买了20个充电桩，开着特斯拉一路向南，开到哪里，就把充电桩免费建到哪里，最终零油耗，把特斯拉开回了广州。这件事，获得了美国《华尔街日报》、《快公司》、央视国际新闻频道等媒体的巨大关注。


    宗毅，成为了网红企业家。


    可这是个人知名度，和企业品牌有什么关系啊？


    别急。宗毅不仅是网红，更是有思想的企业家。后来，他提出了著名的“裂变式创业”的管理实践（相关课程：《5商 | 基础篇》第24课），影响了无数创业者，和转型期的企业家。苏尼克兹，作为“裂变式创业”的标本，成为无数媒体、论坛、研讨会争相免费宣传的对象。


    苏尼克兹，也因此成为了网红企业。


    那又有何用呢？


    别急。成为网红企业后，苏尼克兹从toB，走向toC，推出“家用中央空调+水地暖一体机”，把网红带来的影响力，兑现在产品上。


    # 概念：网红企业


    什么是网红企业？著名投资人徐小平提出过一个观点：每一个创业者都应该成为网红。在过去，是先有产品、然后有品牌。而在今天，我们可以先有品牌，先占领人心，先树立魅力人格体，然后再给用户提供他们所需的产品。


    这种拥有独特的“魅力人格体”的企业，就是“网红企业”。


    # 运用：


    那我怎样也能变成一个“网红企业”呢？今天我们来学习两种典型的做法。


    第一，把公司变成“网红”。


    苏尼克兹，是把公司变成网红的典型。可是公司凭什么红呢？你总要有个与众不同之处，可以作为“亮点”。苏尼克兹，把自己的管理模式“裂变式创业”作为亮点，与众不同，无法复制。


    与苏尼克兹采取类似做法的，还有红领西服的“C2M模式”（相关课程：《5商 | 基础篇》第55课），和韩都衣舍的“小组制”（相关课程：《5商 | 基础篇》第77课）。


    如果我没有独特的管理模式呢？那你有没有独特的价格观，比如谷歌的“不作恶”？有没有独特的办公室设计，比如堪比米其林三星的员工厨房？


    第二，把个人变成“网红”。


    有一次我和徐小平老师聊天，他说：我是我们公司的吉祥物。为什么是他做吉祥物，而不是一个美女投资总监呢？因为徐老师憨萌吗？是的。更重要的是，他往台上一站，那种激情，睿智和感染力，让创业者对真格充满向往。


    那如果老板不想抛头露面呢？可以捧红员工，比如“明星基金经理”，比如“月薪5万元的助理”。


    那如果担心基金经理会跑，助理会辞职呢？就真的做个吉祥物吧，比如海尔的海尔兄弟，比如吴晓波频道的“巴九零”。


    # 今日得到：


    # 刘重点


    > 公关产品，可以不仅仅是你新研制的高科技产品。管理方式，公司文化，甚至老板本人，都可以是公司的公关产品。


    每一个企业，或者个人，都拥有自己独特的魅力。过去你没有机会魅力四射。而今天，你的魅力，可以传递互联网。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_11_0.png)


    刘润


    你的企业，或者你个人，有没有某种魅力可以变成“公关产品”，增加品牌价值的呢？


    欢迎你在留言区分享，与大家一起，过来招。也欢迎你把这篇文章分享给你有网红体质的朋友，帮他们开始光芒四射吧。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_11_1.png)'
