  md: '# 107 | 黄金准则："露8颗牙齿才叫微笑"，真的很搞笑


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》实战篇。


    我有个土豪朋友，盖了栋大厦开酒店，发誓要成为当地最好的五星级酒店。他亲自选了最好的床垫、电视、马桶，终于正式开业了。但是，没想到很多用户投诉说"服务"不好。


    什么叫"服务"不好？


    客人说，服务员看到他，连基本的微笑都没有。服务员很委屈：我微笑了啊。客人说没笑，你说笑了。那到底是笑了，还是没笑？怎么样才算是"笑"？


    这个问题本身，有点"搞笑"。


    但是，我这个朋友不死心，决定给大家做标准化的微笑培训，要求每位员工微笑时必须露出8颗牙齿。


    # 概念：黄金准则


    那应该怎么办呢？用"黄金准则"来提升服务品质，而不是标准化。


    2002年左右，微软邀请以服务享有盛誉的酒店集团"丽思·卡尔顿"的总经理，给微软员工分享，如何更好地服务客户。这位总经理说，其实很简单，就是一句话：


    We Are Ladies and Gentlemen Serving Ladies and Gentlemen.


    （我们以绅士淑女的态度为绅士淑女们忠诚服务。）


    # 运用：


    那，具体怎么做？三个建议。

    1、制定你的"黄金准则"。

    遇到千变万化的服务场景时，员工判断怎么做的"准则"是什么？制定之后，必须严格遵守。比如"安全"第一，那么如果员工在厨房发现老鼠，就关闭了门店。这时，你应该奖励他，而不是惩罚他。

    2、给予员工权力。

    什么样情况可以免单？什么样情况可以送礼品？送多少？由谁批？所有能确定的流程，都无法应对服务的千变万化，每一个案例，都是特例。你可以给予员工一定的权力，比如每周1000元的免单权，充分利用员工对复杂情况的判断力。

    3、把员工当主人，而不是仆人。

    当客人太把自己当上帝时，你要站在员工一方，让客人知道，你的员工不是仆人。这样也许会得罪一两位客人，但是员工从此之后焕发的自信微笑，比露8颗牙齿更迷人。


    # 今日得到


    划重点


    +   1) 制定你的"黄金准则"

    2) 给予员工权力

    3) 把员工当主人，而不是仆人


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_99_0.png)


    刘润

    这个难不难？非常难。但是如果你做到了，就会是下一个丽思卡尔顿，下一个迪斯尼，而不是感慨：海底捞，我学不会。

    你还见过哪些逆天的服务吗？他们的黄金准则是什么？

    欢迎你在留言区分享，与大家一起，过过招。也别忘了把今天的文章，分享给你朋友，也许能够帮到他。


    实战篇线下大课3月底就要正式开课了，前几天推出的300席学习通卡，不到48小时就已全部售罄。

    现在，第一模块的单次课程也优先在专栏里开启报名通道。

    在线上课程中，我用65期的内容，讲了行为经济学、流量、品牌等等内容。它最大的价值是希望大家在做一切产品之前先仰俯底的，全方位的了解最终买单的这个人。因为一切商业的起点，都是消费者获益，为他花多点时间都不为过。

    线下大课第一模块主题是"理解用户"，我将用一整天的时间，结合线上的内容，讲解更多的案例，从三个部分来逐步分析"理解用户"背后的商业逻辑：

    第一、内在因素——使用者为什么需要商品？

    第二、外在影响——什么在影响用户决策？

    第三、决策流程——用户用什么自私消费？

