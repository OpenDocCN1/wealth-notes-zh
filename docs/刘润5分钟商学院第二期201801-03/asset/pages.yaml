  md: '# 第14周周末私董会｜视频制作公司如何自我营销？


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》实战篇。


    5分钟商学院的同学们，大家周末好！


    获得私董会提问资格的同学是：David


    我是一家原创视频制作公司的创始人，致力于为企业打造自带流量的电影级创意视频方案。我的强项为别人的产品创造自带流量的视频内容，我还在尝试“一支广告，多个产品共同营销”的互动植入式营销，希望能够吸引更多客户，而且我的价格只相当与传统4A广告公司的1/3。但问题是，遇到自己的营销问题时，我反而不知所措了。还希望大家为我支支招，我该往哪个方向营销自己呢？


    之所以挑这个问题，是因为它很有趣，...


    其实营销这个行业，一直有一个比较通用的营销手段，这个手段就是案例营销。


    # 什么叫案例营销呢？


    有这样一个故事：在一次作家聚会上，很多非常著名的作者都来参加了，其中有个作家侃侃而谈了好半天，说我写过什么什么书，他旁边的一女士一直默默不语，那个人就问她，你是谁呀？你写了什么书啊？这位女士说，我就只写过一本书，这本书叫《Gone
    With The Wind》，也就是《飘》，说出来之后那个人立刻不说话了。


    在今天很多行业，尤其是投资这行，更是如此。投资者现在多的不得了，那你怎么知道这个投资人好和不好呢？其实只需要看 track record 这一个东西，track
    就是跟踪，record 就是记录。track record 就是你过去投了什么公司。比如晨兴资本的刘芹，他只要把自己投资小米科技的经历说出来，今日资本的徐新只要说自己投过京东，这就够了，大家都会对你肃然起敬。未来一些新的创业者想去找投资人，他就可能优先去找刘芹、徐新的投资。所以，作家写过的书、投资者过去的投资记录，就是他的作品，也就是他的营销。


