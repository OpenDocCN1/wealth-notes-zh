  md: '法建立线下的优势；如果能拿到独家代理，甚至能独立营销，才是拓展商业版图的 好办法。以上观点，供您参考。


    刘润


    古小千同学提到了我在上次直播时，说到的对未来5年的预测：代理人此消，经纪人长；经销商此消，服务商彼长。是的，为厂家负责（比如销售），到为用户负责（比如团购）；从卖产品（比如相机），到卖服务（比如摄影培训），也许是重要的思考方向。另外，稍微剧透一下，我正在和得到团队排时间，可能会在1月18日
    direct 飞往北京，为大家做一次直播，盛点鸡年，展望狗年。


    # 4、Toni to ni


    电子产品实体店铺人流量减少，销售下降是因为电商的信誉建立起来以后，对于3C数码产品，流量都到线上去了，这是大势所趋。这就是所有数码产品线下店铺面临的共同问题，北京中关村电子城就是先例。


    鉴于此，有以下几点建议：


    +   1. 统计所有老客户资料，拉入微信群，引流到线上，尝试进行线上经营。 2. 线下店铺未来更会是展示产品的作用，因此，如果线上引流成功，可以考虑减少线下人员，转换经营地点，来降低运营成本。
    3. 线下店面主要是2C，现在自然流量在减少，加上摄影城的定位，即使在线下扩充相关品类，个人感觉效率不高，会被自然流量减少的大势所淹没。除非能通过营销来引流，不过引流成本太高的话，又不合算。
    4. 新零售目前的趋势是线上线下融合，零售店的人可以考虑将一部分人转成线上运营人员。或者，除了留守门店的最小人员，其余人员去做2B的拓展，这样人员利用率更高。
    5. 如果线下转型不成功，是否有可能壮士断腕？集中火力攻线上，以及渠道。因为日益衰落的门店会拖累其他业务。


    刘润


    Toni to ni的建议，主要是围绕“流量运营”，非常有实操的价值，效果能立竿见影。他说，应该1）统计所有老客户资料，拉入微信群，引流到线上，尝试进行线上经营；2）线下展示，线上销售；3）除了少数人留守门店，更多人做2B生意拓展。在思考长远战略时，Toni
    to ni的短期运营建议，不能忽视。


    # 5、于金国


    赵同学的这个困惑是如今智能手机大爆发的影响下比较有代表性的问题。因为智能手机的自带拍照功能越来越高级，你们公司的摄影器材销售肯定会受到很大的冲击。我建议从社群营销和异业联盟以及产品服务延伸等方面来提高流量和业绩。


    # 6、高原


    目前来看，来到摄影器材城的顾客多半是有购买相机、配件需求的摄影爱好者，你们就可以趁此机会经营其他和摄影相关的产品，以此打造线上配合线下的摄影一体化服务，共涉及以下六个方面的建议，供你参考。


