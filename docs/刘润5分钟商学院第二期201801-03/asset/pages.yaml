  md: '# 060 | 读拳谱：自带传播能力的产品设计


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》，实战篇。


    又到周五了，为了准备今天的内容，我特意采访了著名的营销人小马宋老师。如果你经常用得到，你可能对小马宋老师不陌生，他是罗辑思维的“外脑”，专门在创意营销方面出谋划策。咱俩专栏的开篇语“每天5分钟，解决一个商业问题。”就是出自小马宋老师之手。


    小马宋老师有非常多令人醍醐灌顶的营销洞见。我说：一定要分享最最有价值的内容给《5商》学员，你会讲什么？他想了想说：自带传播能力的产品设计。


    今天的“读拳谱”，就让我们一起来研读小马宋老师的这本秘籍。


    什么叫“自带传播能力产品设计”？你的产品本身就是一个“广告位”，假如你的产品卖出去100万份，就有100万次的传播，这些传播几乎没有任何成本。“自带传播能力的产品设计”，就是基于用户接触产品的4个关键点：购买前、拿到手、使用中和使用后，为自我传播而设计产品。


    具体怎么做？我们一个个来看。


    # 1. 购买前


    在用户购买你的产品前，你要做两件事，第一，让用户一眼就能发现你；第二，促进用户做出购买决策。


    举个例子。川渝地区有个卖鸡爪的小吃品牌，叫“降龙爪爪”，它每个店的门头都:o. 它在取名时就包含了产品信息，你一听就知道它大概是卖什么的；然后它在招牌上把“降龙爪爪”这四个字做得特别大，你在很远的地方就能看到；同时它把自己的产品图印在招牌上，还写了句口号，叫“一抓就化了”，产品精髓一目了然，这就是在帮用户一眼发现你，然后瞬间做决策。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_4_0.png)


    # 2. 拿到手


    那用户买了你的产品后，怎么激发他传播呢？这个阶段有个非常重要的环节，就是一拿到手的时候，俗称“开箱体验”。一个好的开箱体验能让每个用户，都成为你的潜在推销员，把开箱照分享到朋友圈。开箱照的关键，是为用户提供“社交货币”，你不仅得颜值高，体验好，甚至你连发朋友圈的姿势都得帮用户想好。


    举个例子。2016年，小米 MIX 上市的时候，专门发布了一个制作“透明照”的教程，你把小米MIX拿在手上，手机就像透明的一样，能透过屏幕看到你的手，酷炫又好玩儿，许多明星都发了微博，大家纷纷效仿，刷爆了全网。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_4_1.png)


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_4_2.png)


    小米 MIX 仅仅通过一个教程，就引发了手机透明照的风潮。


    # 3. 使用中


    发了开箱照，传播就结束了么？在使用产品时，有没有可能激发用户传播呢？当然有。好看的衣服，你穿出去，就会有你问你是什么牌子；好用的手机，你带出去，朋友就会拿起来把玩。那如果我的产品是袜子呢，是冰箱呢，或者是地砖呢？地砖上又不能印
    Logo，就算是请朋友来家里玩，有人会问你家地砖是什么牌子吗？这怎么传播？


    小马宋老师给出了个好主意。你可以设计一系列特别精美的“风水砖”，免费送给每个顾客，上面印上镇宅神兽，就铺在一进门的门口。只要有朋友来家里，第一眼就能看见这块精美的“风水砖”，也许他就会说：有意思，这个砖是什么牌子呀？这就获得了使用中的免费传播。


    《5分钟商学院》每次线下大课现场，得到团队都会请专业摄影师给大家拍照，甚至在毕业大课的时候，为每位学员都拍了与我的单独合影。拍完之后还要帮你 P 完，5分钟之后，就上传到了一个叫做
    VPhoto 的平台上，你只要扫二维码就能实时把自己的照片下载到手机，直接发朋友圈。方便吧？那如何传播品牌呢？在每张照片上印上 Logo。


    # 4. 使用后


    那用户用了你的产品后，如何引发他的传播呢？帮他准备好传播的内容。比如在美甲店每次顾客做完美甲，店员说：“我给你拍张照吧”，拍好照片给顾客，就给顾客准备好了发朋友圈的传播素材。再比如，小马宋老师曾为一家卖瓜子的店写过一句文案，叫“十斤瓜子逊二两”，顾客尝得瓜子不
    jab，分享给朋友，朋友问“这瓜子好在哪儿啊？”，顾客张嘴就来，“十斤瓜子逊二两”，你就为他提前总结好了分享的内容。


    # 今日得到：


    划重点


    除了把产品本身做得足够好用、好看之外，你还要在用户购买前、拿到手、使用中和使用后这四个关键时间点，主动设计分享姿势，让用户帮你做传播。这就叫“自带传播能力的产品设计”。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_4_3.png)


    刘润


    感谢小马宋老师，专门接受我的独家访谈，为《5商》学员分享商业智慧。


    你还见过哪些在这一四个阶段获得巨大传播的产品呢？


    欢迎你在留言区分享，与大家一起，过去招。


    也欢迎你把这篇文章分享给你做营销的朋友，帮他们设计出自带传播能力的产品。'
