  md: '# 063 | 危机公关：海底捞的危机公关，你学得会


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    今天，我们来学习一种特殊类型的公关：危机公关。


    我听说过一个非常有名的案例，有一天，美国知名比萨饼公司达美乐（Domino）的CEO被告知，有两名北卡州的员工故意把恶心的脏东西涂在了披萨上，并声称5分钟后它会送到顾客手上。而且他们把这段视频传到了互联网上。你可以想象，网民是多么的惊恐和愤怒，达美乐的股价应声下跌9%。这时候，怎么处理才能化解危机呢？


    撒谎吗？说：没有的事，视频是伪造的；还是假装道个歉吗？说：他们是临时工，我们有失察之责，自罚三杯。


    如果你学过《5商｜基础篇》第49课“危机公关”，就一定会知道：撒硬谎，道软歉，就是作死。


    # 概念：危机公关


    那到底怎样才是“危机公关”的正确姿势呢？在《5商｜实战篇》，今天我们从一个实战案例里，来学习危机公关的十二字口诀：这锅我背，这错我改，这就去办。


    第一，这锅我背。


    2017年，中国的海底捞遇到了和美国的达美乐几乎一模一样的危机：某家门店后厨卫生有严重问题。视频传播后，网民立刻愤怒了，炸锅了。怎么办？


    首先，要诚信。


    沃伦·巴菲特曾说过：“树立品牌需要20年的时间，而毁掉它，5分钟就足够了。”但毁掉品牌的，往往不是危机本身，而是不诚信的“危机公关”，它不但不解决危机，还会瞬间清零用户的所有信任。


    那应该怎么做？不要绕弯子，直接说：这锅我背。不要否认、不要部分承认、不要转移责任，不要沉默，更不要说：“仅在”哪里出现，“只有”发生一次。


    海底捞怎么回应的呢？四个字：问题属实。


    你知道，这四个字要冲破律师们的阻拦，出现在知名企业的声明里，有多难吗？你和女朋友吵架，冷静下来后你意识到自己有不对的地方，但“我错了”这三个字，就是很难说出口。但有时候，对方需要的，是一个毫无条件的认错。


    第二，这错我改。


    你咬着牙对你女朋友说：我错了。然后，就这样结束了嗎？当然没有，她会接着问：说，你错在哪儿了？怎么改？


    所以，危机公关的第二步，是给出诚意的改正方案。告诉大众：这错我改。


    海底捞怎么回应的呢？四个字：别废话，改！


    出问题的门店，这么办这么办；其他门店，那么办那么办；技术提升谁负责，顾客监督联系谁；员工不要恐慌，这不是“临时工”的问题，是深层次管理问题，董事会承担主要责任。


    错了，那就改。不废话。这就是“这错我改”。


    第三，这就去做。


    危机在互联网上的蔓延速度，已经超过了绝大多数公司处理危机的速度。所以，跑赢时间，是危机公关的关键。那怎么办？反应要快，要非常快。


    海底捞有多快呢？问题曝光的3小时内，海底捞就做出了反应。


    3小时内做出“这锅我背，这错我改”的反应，非常关键。为什么？3小时内，事件逐渐成为热点，大量自媒体公号觉得终于等到“借势营销”的机会了，选了个姿势正在写文章开骂。这时“这锅我背，这错我改”的道歉信出来了，他们可能会立刻觉得“开骂”不再是正确的姿势，反而会被骂，赶紧把写了一半的文章删掉，从批评改为赞扬。


    所以，速度非常关键。你等这些“借势营销”的文章都发出去了再道歉，伤害已经无法挽回。


    # 今日得到：


    +   划重点


    > 营销是往品牌里存钱，危机是从品牌里取钱。但真正把品牌里的信任取空的，常常不是危机，而是危机公关本身。危机公关的12字口诀：这锅我背，这错我改，这就去办。


    最大的错，就是“一错再错”。及时止血，不要为了规避一个风险，而去冒一个更大的风险。否则，人生也处处都是“危机公关”。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_12_0.png)


    你是某品牌服装的公关负责人，一位新郎穿着你们的西裤，下跪为妻子戴上戒指时，西裤突然从裆部一直开裂到后腰。这件事传遍了互联网。请问，你打算怎么做危机公关？


    欢迎你在留言区分享，与大家一起，过过招。也欢迎你把这篇文章分享给你强硬处理危机的朋友，帮助他们用12字口诀化解危机吧。'
