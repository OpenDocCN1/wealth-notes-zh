  md: '# 3.15加餐：消费者如何利用商业逻辑，来保护自己的权益


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_111_0.png)


    3.15加餐：消费者如何利用...


    今天是315，也就是著名的国际消费者权益日。每年的这一天，都有大量的骗局、陷阱、假冒伪劣产品被揭露。那么我们自己，作为消费者本身，有没有什么方法可以保护自己的权益呢？今天这篇加餐，我们就来用商业逻辑，从理解企业行为的角度，来讨论一些保护自身权益的方法。只要知道企业思考的胳路，就能找到对应的解药。


    # 一、品牌容器


    品牌容器是《5分钟商学院》基础篇里讲过的一个概念，在安卓篇里，我们又做了延伸。那么如何用品牌容器来保护自己的权益呢？（详见底部相关链接）


    首先，我们要知道，我们之所以说品牌容器，是因为这个品牌装着消费者的了解、信任和喜欢，就像一个容器一样。得到消费偏爱的商品自然会贵一些，这叫品牌溢价，消费者也因为喜欢这个品牌，因为它降低了自己的选择成本，所以也愿意接受这个溢价。这就是品牌容器的威力，它能帮企业获得更多利润。


    然而，品牌容器又是企业的一把双刃剑。一方面它提高了企业利润，但另一方面，它也竖了一个靶子，让企业更容易被打到。


    我们会发现，很多被晚会曝光的企业都是大品牌，为什么会这样？因为大品牌影响的人更多，一旦出了问题，影响更大；而且，因为它们会更加关注大企业。


    我们从另一个角度看，315晚会其实是一种“报复复制”，这里的报复并不是我们通常所说的报复，而是一种正面的报复。从某种程度上来说，315晚会是通过打去那些不守规矩的大品牌，来杀鸡做猴。因为打击小品牌，对它的伤害非常小，受到的关注也非常少，只有打击了大企业，才能对所有企业都有震慑作用，才能更好地起到保护消费者权益的作用。所以从这个角度来说，站在企业的视角，大品牌也更容易被“伤害”。


    所以，我真正想说的是，千万不要因为315曝光了那么多大品牌，就认为大品牌也不可信，从此就不买大品牌了。恰恰相反，你应该继续买大品牌，买广为人知的品牌，当然是还没有被曝光的产品。大品牌因为更容易被伤害到，所以会更加小心。


    这里还涉及到一个犯错成本的问题。


    对于小品牌来说，犯错没关系，重新来就可以了。可大品牌不行，它曾经为打造品牌容器付出过那么多成本，好不容易才积累了今天的品牌溢价，一旦犯错，就会付出非常大的代价。所以，它一定会尽全力让自己不犯错、少犯错。


    这就是我要说的第一点：从品牌容器的角度看，大品牌没有被曝光的时候，依然是你保护自身权益的一个方式。


    # 二、重复博弈


    重复博弈是相对单次博弈来说的。什么叫单次博弈呢？简单说就是一锤子买卖。比如你去旅游，在当地吃顿饭，买个纪念品，基本都算单次博弈，因为你第二次跟对方发生交易的几率非常小。


    那么什么是重复博弈呢？比如你家楼下有个菜店，你经常去买菜，你跟这家店的老板的博弈关系就是重复博弈。


    单次博弈跟重复博弈的关键区别是：在单次博弈里，如果对方不守约，你一次交易，大多数情况下你也没办法惩罚他，所以对方违约的可能性就比较大；而重复博弈就不一样了，如果对方违约或者欺骗了你，你不仅可以不去找他买东西，而且你还可以跟别人说，让其他人也不要去，你就失去了这个客户，当然也不会有你。


    我在《5商》基础篇里说过一句话：所谓的诚信，就是你选择与这个世界重复博弈。一旦重复博弈的时候，你就不会在短期去骗人了。


    那么我们作为消费者应该怎么来思考这个问题呢？当然是去选择那些愿意为你重复博弈的商家。


    比如，你想买一个品牌的商品，你可以先去它的京东店、淘宝店看一看，如果这家店连评论都没有开放，那就是拒绝了重复博弈，这个商家你可能就要敬而远之了。再有，像美团、大众点评，这都是多次博弈的场所，如果一家店不愿意在上面公开信息，那你可能也要考虑一下。


    另外，老人们经常会讲一句话“跑得了和尚跑不了庙”，意思就是说，只要是有固定的位置和固定商品的店，就更加可信一些，所以，不管是线上还是线下，推销的人也不要信。


    当然，不只是我说的这些，大家也可以再想想还有哪些重复博弈的场景，能给我们提供一些信任成本上的支持。


    # 三、一级价格歧视


    互联网当然给我们带来了很多好处，但下面我们要说一个坏处，那就是一级价格歧视。


    什么叫一级价格歧视？举个例子：你去一个服装店买东西，你说这衣服多少钱，300块。怎么这么贵，200块好不好？200块卖给你了。另外一个人去问，多少钱呢？300块。能不能150块啊？结果150也卖给他了。同一个商品，每个人买的价格可能都是不一样的，这就叫一级价格歧视。


    我们知道，这种现象一直都存在，但是互联网时代，让不同的人以不同的价格购买同一个商品，这件事情更容易实现了。


    比如著名的机票事件。你到网上买机票，发现上面现在有四折机票卖，然后你想，再等等，说不定能等到三折票呢。等了半小时后，刷新一看，还是四折票。又等了一会，发现四折票都没有了，只有五折票了。为什么会这样？是被买走了吗？当然有可能就是被买走了，但也可能是：网站发现你老是刷新机票信息，这就说明你特别需要这张机票，而理论上，你越需要这张机票的时候，你愿意为这张机票支付的价格就越高。所以你再刷的时候，明显有四折机票，它可能就藏起来了。最后，你一直刷，很可能就只有八折的机票了，但你已经等不及了，就以八折买了这张机票。


    那如何避免这个情况的发生呢？使用浏览器的隐私功能，同时不要登录个人的账号，选中了商品之后再登录下单，以防你的浏览记录上传到服务器，避免价格被抬高。


    # 四、信用成本


    什么叫信用成本？我们拿最近很火的共享单车来说。几乎每一个共享单车软件，在你用车之前，都是需要先交押金的。因为万一你骑了我的车，弄坏了或者弄丢了怎么办呢？所以，用车之前你要交押金。这就是信任成本。


    这个押金的体量是非常大的，因为它是按人算的，不是按车算的，一辆车可能有8个人交了押金。而这些钱放在企业那里，它就一定会拿去用，如果赚了更多的钱，可以把押金还给你，这没问题，但如果你钱被公司吞掉了，拿不回来了，这对你来说就是很大的损失。


    那如何避免这种情况呢？你可以使用信用系统来降低信任成本的方式。


    比如：芝麻信用、腾讯信用，它会根据你以往的信用记录来生成你的信用分，代表你这个个人的可信程度。现在很多服务都可以用信用分来抵消信任成本。比如你的芝麻信用分超过多少分，就可以直接骑共享单车，不用交押金。这样，你的风险就大幅降低了。


    所以未来，如果某个商家没有跟这些信用平台合作，通过其他渠道的了解也不能让你信任他的话，我建议你就别用了。未来，对于消费者来说，提高自己的个人信用是一件很重要的事，因为它不仅会让你更方便，也会让你更安全。


    # 总结


    所有企业为了自己的利益，都会不断研究商业逻辑，不断提升自己对商业知识的理解，越是这样，就越会带来企业跟消费者之间的不对等。所以对消费者来说，学习一些商业知识是非常重要的，这不仅可以帮助你在企业面前更好地保护自己，也能让你拥有更好的选择能力。'
