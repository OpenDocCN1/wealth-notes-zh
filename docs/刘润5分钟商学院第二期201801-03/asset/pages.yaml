  md: '# 089 | 设计冲刺（原型）：从0到0.1，叫制作原型；从0.1到1，叫快速迭代


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    “理解，草图，决定”之后，什么？一天制作出90%真实度的产品“原型”？这不可能吧？我们研发新产品至少100天，90%真实度，就算不要90天，也要50天吧？为什么非要1天做出pemb?
    我就不能用充足的时间研发出1.0版本，先推向市场、小步快跑，用快速迭代的方法验证模型吗？


    不能。


    为什么？还记得我们在第一季度学习 的“现状偏差”、“沉没成本”和“损失规避”吗？你在产品上花的时间越多，你的“现状偏差”就会越强烈，因为巨大的“沉没成本”，尤其是汗水和情感的投入，你会包容它、爱上它，产生“损失规避”的封闭状态，听不进任何重大改进建议，只愿小修小补。


    # 概念：设计冲刺（原型）


    也就是说，花100天做出来的产品，几乎只能优化，无法转型。产品原型，必须是在第1天就完成的。


    我理解了快速制作原型的重要性，但是，只用1天真的可能吗？


    确实有挑战，但也确实有可能。


    你看过拍电影的布景吗？两个牛仔在酒馆门口决斗，非常逼真。但如果你绕到酒馆后面去看，整个酒馆就只有一面经过装饰的墙。镜头拍不到的部分，什么都没有。这就是“原型”。如果说昨天是“写剧本”，今天就是“做道具”。道具需要逼真，但不需要真实。


    《设计冲刺》的作者杰克说，你要有一 种“建模心态”：从追求“十全十美”到“差强人意”，从“长期质量”到“临时模拟”。


    具体怎么做呢？你要学习四个原则。


    如果你要做网站，或者App的原型，一天怎么做？用PPT画得逼真一些就好了嘛，投影出来给用户看，他们分辨不出来的；做实体产品呢？用3D打印，没有的话，用PPT画一些，然后打印出来，贴在机器、设备、硬纸板上；需要屏幕呢？用iPad代替嘛；需要人机对话呢？派一个真正的人工，躲在后面假装嘛；那做的是服务呢？更简单了，组员们排练一下扮演嘛。


    为了保证7小时内完成原型制作，设计冲刺团队需要精确分工、高效协作，逐个击破制作的任务。


    怎么做？首先，需要一个“资源收集者”，他的任务是满世界找素材，比如搜索网页、图片、借iPad、弄纸箱什么的；第二，需要两个制作者，一般是设计师或工程师，他们动手能力很强，能把资源快速搭成原型；第三，需要一个文案，大量呈现给用户的文字，需要他来完成；第四，需要一个采访者，他要先接受测试，找到感觉，然后在明天测试别人；最后，需要一个整合者，确保所有东西无缝结合。


    这个原则，是要求整合者担起责任，确保整个原型的日期、时间、名称和其他虚拟内容，每个环节都流畅没有漏洞，比如前面写张三，后面写张三丰，这种细节错误，会让接受测试者“出戏”，无法捕捉到他宝贵的真实反应。


    好的，下午3点，我们要拿“采访者”先做实验了。尽量早做试验，这样还有足够时间改正错误，和让采访者写采访提纲。


    学完制作原型的四大原则，萨维团队的特莎和艾莉森，为了模拟机器人得到好评后欢快地跳舞，决定用遥控器远程控制，而不是写代码。他们为此练习了一天。


    机器人的头部呢？艾德里安决定用iPad mini替代，眼镜、筷容就用幻灯片冒充。


    机器人到房间门口，自动打电话通知客人呢？艾德里安决定跟在机器人后面，躲在一边打电话，然后假装机器人那种生硬的发音。


    经过缝合、试验，这一天终于结束了，大家非常兴奋，期待周五到来。


    # 今日得到：


    划重点


    +   1. 周四的工作，是用1天做出有90%真实度的产品“原型”。只花1天很重要，因为花越多时间，未来越不想改动；90%真实度很重要，因为如果不像，你就很难获得用户真实的反应。怎么做呢？四大原则：选对工具，逐个击破，缝合完整和先行试<|start|>。


    +   2. 我们到底不要爱上自己的产品。有时候，我们爱上的，只是自己付出的心血。为了避免被“心血”绑架，如果必须要改变，那么越早改变越好。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_59_0.png)


    如果为你产品的下个版本制作原型，你会如何脑洞大开地一天完成呢？

