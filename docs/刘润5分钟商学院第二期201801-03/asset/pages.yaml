  md: '（中国）软件有限公司、腾讯等。


    从 PAT 的成功经验中，可以帮你总结出两条有操作性的建议：


    +   1. 在出题的权威性上依靠着名的高校来背书。既然在院系渠道方面比较强，不如就依托这个优势，找着名的高校寻求合作，提高考试的权威性，从而保证报考的同学以及合作企业对专业性的期待以及审核水准；


    +   2. 在推出考试初期尽量谈下几家国际著名企业的合作，然后由此开始攻城略地。PAT也不是一开始就谈下了170家企业的合作，而是首先找到业内最著名的企业，从介绍考试的专业性、帮助企业减少招聘成本的姿态起手，从而获得这些企业的认可和欢迎。一旦达成与这些公司的合作，就会成为业内的标杆，此时只要稍作推广，考试就能被大范围的企业认可，甚至主动寻求合作。


    # 4、宸泉：


    阿里巴巴起步的时候，也面临这个问题，没有采购方，供应商就不愿意入。滴滴快的是如此，没有客人，司机不愿加入。阿里是通过强大的地推团队说服了越来越多的供应商加入。而滴滴和快进因有强大的资本，采用更加直接有效的双向补贴。


    明同学的问题，从两方面来看，学生方向看中的考试的效果：到底考了有什么用，是主要门槛，考试费用在其次。如果考试认证对求职好坏很明显，推广起来就会相对容易。企业方更看重，这个考试认证，到底能不能有效筛选出我需要的英语技能的人。


    所以我建议，先集中资源攻下一批重点学生，比如学生会成员，甚至可以免费。同时，集中资源攻下一批优秀大企业，对校招学生拥有此认证的学生优先考虑。以点带面，或许可以打开一个新的局面。


    # 5、aqua：


    首先，要保证产品的差异化和含金量。此英语考试要与已有的四、六级考试，托福、雅思考试区别开来，强调职场英语的实际应用功能，如商务英语、情景对话、英文函件等；对于考试严格把关，控制通过率，提高考试证书的含金量。


    其次，利用资源整合的优势，搭建人力资源平台。利用出版社在院系渠道方面的优势，建立应届毕业生的档案库，包括学生的简历、就业期望、校方评价等，至少报名参加考试的学生要填写具体的资料，并且有学校背书，相信对用人单位是有吸引力的。平台的链接、搭建才是核心价值所在。


    最后，解决先有考生还是先有用人单位认可的问题。建议为该考试设立奖学金，考试成绩优异的学生将拿到奖学金，并且优先推荐进入好的企业；奖学金由企业出资，而企业则得到相应回报，如考场设立广告牌、准考证背面广告、指定考试用品等。通过借势营销等手段，迅速打开市场局面。


    # 6、小段：


    我从小生活在日本，从初中开始接触日语，最初的感觉语言，只要会听，会说，会读，会写就行。但自从进入职场后，完全就不是那么一回事儿了，生活、职场中到处都需要对日语更深层的理解。


    # 1. 打击痛点


    推出一套欧美职场宝典，增加一套实战学习方法论，免费让学生体验真正的欧美职场语言的表述方法，邮件书写方法等，让学生体验出“生活英语”和“职场英语”的不同之处，当学生们发现自己学的英语在职场上使用还有很多欠缺的话，自然会进一步跟进咱们的产品。


    # 2. 增加爽点


    语言不仅仅是用来交流的，更要学会深含义（历史背景等）。所以不仅要在考试中增加学生在职场上的英语正式用法，还要增加一些培训，教会他们其它异类用法，比如可以教他们一些如何在职场上用英语讲笑话，可以增加一些脱口秀段子，不仅要讲的好，也要讲的爽。


    # 3. 抓取痒点


    在职场上的交流，不仅仅是日常会话，更重要的是要与时俱进，和同事领导交流新闻，最新的技术，最新的企业管理方法理论等。要增加关于时事的解释和用法。比如教给学生们用“电梯演讲”的方法，用最短的语句说清楚一件最近发生的世界性规模大事。也增加英语的面试实战环节，提前做好准备，满足学生们的“痒点”。


    一句话：要和四六级，托福雅思进行产品的差异化。


    # 7、和逸伦：


    明同学您好，您的产品考察的是“职场面对的实际问题以及人际沟通”，您已经很明确地有自己的定位了，“职场英语+人际英语”。那么就千万不要怕传统考试，他们都做不做“处理人际沟通的英语能力考查”。


    所以，你的产品定位应该是“优秀的人际沟通英语水平的证明”。把重点资源布局在英语交流，探讨，汇报工作，演讲等方面的水平测试。如果你的测试标准够高，对于想要出国工作的人，想要领取公司外派机会的人，或者在领英上给自己添“流利的人际沟通英语水平”的人，都会成为你的主要客户。


    如果资源渠道足够强，在学校里做测试，让通过四六级的同学来参考你的英语口语测试，看他们的通过率，然后向企业证明，达到你的考试XX分以上，才真正可以流利地在职场中使用英语，而非通过六级考试。把你的考试作为一项专精领域的水平证明，你就成功了。


    战略定位清晰以后，营销战略就简单很多了：校内宣传，企业合作，职场选拔竞赛，猎头招聘网能认证等等都可以开展起来了。


    # 8、月风：


    我是一名世界500强企业前资深HR，结合在五商的学习，对您提出的（营销）推广问题，从如下角度进行分析回答：


    # 1. 产品供应商快速变现


    目前英语考试的产品可以称得上是红海领域，既然你还要做，那就选择合适的渠道尽快把成型产品输出吧。


    求职考试产品的营销推广对象既非学生（数量大、转化慢，自选考试没有机构背书难以被接受），也非企业（数量大、意愿低，单独出题成本和精力都不划算），而是求职考试的平台和服务提供商。目前企业招聘，英语考试只是笔试环节的一个环节，单独选择考试题目的非常少，大型企业多数招聘笔试外包给招聘平台或考试供应商。可以将你们的笔试产品作为招聘整体产品的有机部分进行共同推广，针对性和落地性都相对较强。


    # 2. 服务提供商持续深耕


    关键是打磨产品，提高势能和做好营销与渠道，转化动能。职场英语服务供应商目前有一些，也有做的不错的，但整体来说并不像英语考试类产品火爆。


    +   1. 打磨产品，形成爆款。目前的产品可以打磨成“职场英语百题斩”，将职场中最常见、最常用、最长出错的英语场景变成有趣的题目进行挑战娱乐化输出。


    +   2. 精选客群，对点营销。精选求职者和在职者作为C端目标客群，打造职业英语进阶服务品牌；精选学校、职场培训机构、大型企业、招聘平台作为B端目标客群，开展针对性营销，进行强化联合。


    +   3. 立体化渠道，传递价值。线上可通过学习社群、在线培训、精炼课程，形成线上传播；线下可通过出版明星书籍、联合培训机构、举办各企业培训会、开设学校培训课程等方式形成线下传播。


    # 9、天天：


