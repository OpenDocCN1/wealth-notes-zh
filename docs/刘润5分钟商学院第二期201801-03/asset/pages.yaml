  md: '# 第15周周末私董会 | 如何推广一门新开发的职场英语考试？


    每天5分钟，解决一个商业问题。欢迎收听《刘润·5分钟商学院》或致篇。


    5分钟商学院的同学们，大家周末好！


    获得私董会提问资格的同学是：明


    润总您好，我是一家出版社的销售人员，今年我们新开发了一门英语考试，主要是考察职场上实际面对的问题以及人际沟通，任何人都可以来考。但是目前英语类考试都是四六级、雅思托福类的，四六级属于国家强制型考试，雅思托福也是出国必备考试，所以考试的人也很多。因为我是出版社，在院校渠道方面比较强，一方面我们从院校入手，向学生宣传选考考试，但是由于考试费用（专家出题和评阅成本高）相比四六级考试（60元不到）还是高不少，加上无强制统一考试，以及目前企业认可度还在慢慢开拓中，虽然我们和大型人力资源公司战略合作带过来的学生们推荐一些实习或者就业，但是学生都在观望中。另一方面，企业肯定是需要考的人员很多才会认可我们的考试，大型外企目前也有自己的英语考核体系，所以我们还陷入了一个先有鸡还是先有蛋的两难问题。想请教您和同学们如何推广我们的考试？


    这个问题其实跟我们这一周在讨论的话题——需求，是特别紧密相关的。要解决这个问题，首先要去理解这个问题的本质，考试到底是什么。


    考试跟很多东西不同，它几乎永远都是手段，是服务于其他目的的，考试本身不可能成为目的。比如雅思和托福这样的考试，目的是测试你够不够去美国留学的基 本语言水平。怎么知道个人是不是有这个水准呢？那我就为此设计一套题目。四六级考试也是一样，目的是希望大学生们毕业后，可以达到与外国人日常交流的特定英语水平，考试只不过是为了验证你到没到那个标准。


    好了，那么明同学你现在开发了一个英语考试，你想达到的目的是什么，这个问题要先想清楚。不是说设计一个考试就能收钱了，这不是目的。我分析你的目的是，让企业能够更好地招到人。


    很多企业对员工是有英语要求的，但他怎么验证候选人的英语水平呢？一个是看你过去有没有在一些外企工作过，或者看你有没有通过四六级，但四六级考试都是书面英语，如果我需要这个人的口语水平，该怎么办呢？我们就面试吧。这个时间成本就高了，需要有专门的人花时间来面试了。另外，公司一般需要的是商务英语水平，比如说写邮件、跟别人电话沟通专业事项，这种怎么考察呢？也需要面试，我需要给他一份外文资料，随便一本杂志挑两篇文章，候选人能在不查字典的情况下读懂里面的内容。这些，是企业招聘过程中真实面对的场景。而如果你要设计考试，


    这是考试真正的目的。


    一旦想明白这个目的之后，再重新思考一下考试，这考试应该怎么来设计呢？


    # 1、咨询那些最受欢迎的公司，寻找需求


    最重要的是请一些专家型的出题人，而应该去找到今天最热门、最受欢迎的50家公司，比如阿里巴巴、腾讯、百度、外企的谷歌、微软、苹果，还有一些大型的国企，询问他们在招聘时，最希望招到什么样的英语水平的员工；现有市场上的英语考试有没有达到要求；如果没有，你希望哪些地方需要补充进去；您愿不愿意来做我们的这个出题人或者顾问……所以如果能够把中国排名前50的公司HR负责人都请教一遍，出一个题库，那这个题库就是真的能解决这些企业问题的。


    这个时候再去和这些企业沟通，说我们会设计一套题，这套题设计出来之后，我给你推荐一些通过这个考试的、成绩优异的学员，这样就能节省面试的时间，你看好不好？这时候，事情就容易多了。对这些HR的负责人来说，标准是他们给的，题是他们参谋出的，我们还免费推荐给他优秀学员，这件事的接受度就要高多了。


    # 2、确保有价值的生源


    我们毕竟是平台型的生意，


    既然你真正的客户是企业，这时候你要补贴的就是企业一方，你的利润要从学生身上赚。


    但首先，你要先找到一些已经通过六级、英文水平不错的同学，免费邀请他们来参加考试，你告诉同学，考试达到一个什么样的分数，就能够优先获得世界五百强企业、中国排名前50名的公司的内推机会。之后，你就把通过考试的最优秀的人推荐给HR们，多试几次之后开始和这些公司谈，不如咱们签一个合作协议，通过这门考试的，作为你们优先录用的一個标准。你这个优先录取的名單上每多一家公司，你就吸引来考试的学生就会越多。


    早期的时候，你可以这样设计价格：通过四级的才有考试资格，但费用是全价；通过六级的，半价参加考试。如果连四级都没通过的话，就不要来考了，要保证你的生源是足够让那些企业觉得有价值的。这个时候，作为考试机构特别容易犯一个错误就是说，你们都来考吧，我把考试标准放低一点，参加考试的人越多，考过的人越多，我收到的考试费也越多，这种想法是非常非常错误的。因为如果一个考试大家都能通过，那就筛选不出来人才，这样企业和用人单位就不会用这套标准，用人单位不用的話，考生去考试的价值就不会大。


    这个成本转去哪儿了呢？转换成了你收的学生考试费。先把这套逻辑想明白，然后让用人单位，而不是那些专家学者来设计题库。这样的话，这个东西是有机会做成的。


    今天说的比较多，希望能够对你有所启发。我也挑选了10位同学的精彩回答，点开艺稿，就能看到他们的见解。


    +   1、宋亨：


    商业中的第一要义是理解用户，明确用户需要什么。而从你的描述中看，你是先开发了一门考察职场问题和人际交流的考试，然后再去想如何推广。梁宁老师的大师课重点强调说产品思维应该把握用户的痛点、痒点、爽点，放到你的这件事情上，你要问问自己：你解决的是什么问题？同学们考完之后能得到什么？如果和出一本书、做一个培训班效果差不多，何必要研发考试呢？最后再补充一点，因为我们公司本身也在做平台，做平台生意一定要先搞定平台两端的其中一方，比如学生和企业，要么你切实给学生带来一些好处，要么你先和企业谈敲定一个“民间”的入职英语考核体系。一上来就希望研发出一门双方都买单的考试，不太现实。


    +   2、董坤：


    今天的问题是，一个英语考试产品，是先获得考生支持，还是先获得目标用人单位的认可？


    这个英文考试产品，目标是想为企业筛选出来把英文能够真正应用于实际工作的人员。考试不是学生的需求，没有人主动去参加一场考试。显然，需要这门考试课程先得到企业的认可，之后才能引起学生们的兴趣。


    所以，如果想要推广这项考试，首先要让考试项目获得大型企业的认可。比如把相应的能力测试的结果与传统考试对照，把出题的师资水平与企业HR介绍，获得至少起码一个优先录用的加分项，考试才能引起大家的兴趣。从而实现良性循环。建议出版社可以与企业展开合作，比如对于一定要英文过关才能胜任的岗位，考试+面试，可以帮企业解决问题，就会被认可。


    +   3、AlleluJah：


    明同学在推广考试这一方面可以借鉴浙江大学推出的PAT考试。PAT作为一门完全由国内团队自主设计、推出的本地编程考试，只要通过了PAT考试的某个等级或超过一定分数，就一定可以免笔试，直接参与企业面试。联盟圈中甚至包括国际著名500强企业Google中国、微软（中国）、摩根士丹利公司（上海）、淘宝（中国）软件有限公司、腾讯等。'
