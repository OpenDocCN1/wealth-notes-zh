  md: '# 072 | 45°精进曲线：缓慢的改进，就等于平庸


    072 | 45°精进曲线：缓慢的... ↓


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    今天我们接着学习“需求”的下一课：45°精进曲线。什么叫“45°精进曲线”？


    韩梅梅重新开发了一款产品，这次一炮而红，她非常高兴，觉得终于找到了麻烦背后的需求。可没多久，用户就对她的产品不感兴趣了，竞争对手推出差异化产品后，用户流失得更快。她很苦恼，用户为什么如此喜新厌旧？


    因为用户的需求在深入、在升级、在变化、在消失。构建一款魔力产品，从来都不是一次成型的。“发现需求、创造需求”这件事，很不幸，从来没有“一招鲜、吃遍天”的方法。


    我举个例子。


    在第68课我们讲到，奈飞的创始人哈斯廷斯，从忘记还录像带，造成巨额罚金的“麻烦”中找到了“需求”：用月租或年租的方式，提供租用服务，他迅速成立了NetFlix，大获成功。


    # 概念：45°精进曲线


    这就是45°精进曲线。因为为什么是45°？因为进步的坡道要足够陡峭，才能快速匹配用户需求的变化，同时也是给竞争对手的“恐吓”，别来了，等你准备好，我已经又十万八千里了。缓慢的改进，就等于平庸，避免竞争的唯一方法是逐从一个极致走向另一个极致。


    # 运用：


    那么怎么保持这种精进的状态呢？你可以分三个阶段，使用不同策略。


    +   1、探索期：定型。


    +   2、成长期：优化。


    +   3、成熟期：多元。


    # 今日得到：


    划重点


    1. 用户的需求，是在不断深入，升级，变化和消失的。对需求的探索，不能停止在“找到了的那天”，只有保持“45°精进”，才能始终和真正的需求保持同步。


    2. 我们的能力，就是满足这个世界对我们的期待的方式。只有保持45°的精进曲线，才能让领先者胆寒，让尾随者放弃。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_29_0.png)


    刘润

    你见过最好的，始终保持“45°精进曲线”，紧跟用户需求变化的产品，是哪个呢？

    欢迎你在留言区分享，与大家一起，过过招。也欢迎你把这篇文章分享给你产品跟不上需求的朋友，帮助他们保持45°的精进吧。'
