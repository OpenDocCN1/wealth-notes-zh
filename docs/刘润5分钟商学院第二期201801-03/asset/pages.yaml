  md: '# 067 | 魔力：创造无法割舍的情感共鸣


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    今天我们学习需求6大关键之一：魔力。


    我有个朋友，打算开家咖啡厅，于是想，来喝咖啡、吃蛋糕的人，他们“真正的需求”是什么呢？他觉得：只有卫生安全、好吃不贵才是真的。于是，他请了手艺精湛的师傅不断测试，终于咖啡很好喝、点心很便宜、蛋糕很新鲜，他终于把店开出去了。可是……市场几乎毫无反应。


    “毫无反应”，这是最令人生畏的四个字。我的咖啡店，怎么就不能像星巴克一样有“魔力”呢？怎么办？


    要解决这个“怎么办”的问题，我们首先要理解它本质。如果想做出，因为满足了“真正的需求”，从而拥有核动力，有魔力的产品，就要明白，功能本身并不能创造出魔力。


    # 概念：魔力


    那到底什么才能创造出魔力？亚德里安在《需求》这本书里，提出了一个公式：


    魔力产品 = 产品功能 x 情感诉求


    这个公式中，产品功能，指的是“好用、价格实惠、方便省事、减少麻烦”；而情感诉求呢？指的是“喜悦、温暖、无拘无束、受人尊重”。我们“产品功能”较为理性、可参数化的“左脑需求”，而“情感诉求”则为感性、非常冲动化的“右脑需求”。


    这个问题本质是，“咖啡很好喝、点心很便宜、蛋糕很新鲜”，这些都是“产品功能”式的左脑需求，而不是“情感诉求”式的“右脑需求”。


    关于有魔力的产品，亚德里安在书中举了一个例子。


    “共享汽车”这种商业模式，早在上个世纪的美国就出现了。1999年，罗宾·切斯开始创业，通过提供共享汽车，来减少路面上不必要的车辆。这家公司，就是后来估值最高时过12亿美元的独角兽：ZipCar。


    与买车相比，ZipCar 会员每年能节省几千美元，还不用将大把时间花在停车、维护、修理、保险等琐事上。从“产品功能”上来说，省钱、省事，还环保的 ZipCar，简直是对传统汽车的颠覆。


    但从1999年创立，到2003年，ZipCar 发展非常缓慢，只在3个城市，拥有130辆车，和6000名会员。最终，充满改变世界梦想的切斯，被董事会赶出了自己创立的公司。


    然后斯科特·格里夫斯成为了新任 CEO，开始在用户的“情感诉求”上，对没有加入 ZipCar 的观望派做研究。研究结果就是一个字：远。一年能省几千美元，挺好，但要走30分钟取车，啊，有点远。为了几千美元，多走几步也不行？嗯……不行。


    “偷懒”，有时候比“省钱”更重要，这就是“情感诉求”。


    于是格里夫斯认识到，ZipCar 走向未来的关键在于密度。他迅速改变策略，把多个地方分散投放，改为在一个地方集中投放，让取车时间缩短为5分钟。“即时密度”战略，让成千上万人开始注意到
    ZipCar 的魔力特质，大获成功。


    这就是“情感诉求”的力量。对于有魔力的产品，需求中的“情感诉求”与“产品功能”，是同样重要。


    盖勒普公司做过一份调查，那些对超市极端满意的顾客，相对于其他顾客，到店次数更少，消费更低。对超市的“产品功能”满意，并不能对销售起到增值作用。但如果增加“情感诉求”的连接呢？这些极端满意的顾客，平均每月的采购次数会从4.1次升为5.4次，平均每次消费会从166元陡升至210元。


    # 运用：


    所以，寻找“真正的需求”时，千万不能只用左脑，不用右脑。


    那我的咖啡店，该怎么办呢？


    试着在“产品功能”上，增加些“情感诉求”吧。


    比如，在咖啡的提花上，打印一幅照片或者一些心情用语，“快乐，惊喜，心情不错”等等，让顾客喝咖啡时，有种获得这些心情的感觉。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_20_0.png)


    再比如，在点心里加一张祝福话语。美国的中餐馆，餐后都有一编码小点心，叫"Fortune Cookie"（幸运饼干），咬开后，里面一张字条：很快，你就会站在世界之巅。这种幸运饼干每年销量达到30亿。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_20_1.png)


    再再比如，把蛋糕做成奖状，写上祝贺“XX同志，获得最模范老公奖”。人们买蛋糕“真正的需求”，也许不是“吃”这个“产品功能”，而是“庆祝”这个“情感诉求”。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_20_2.png)


    # 今日得到：


    # 划重点


    +   1. 魔力产品 = 产品功能 × 情感诉求。 “产品功能”是理性的，参数化的“左脑需求”；“情感诉求”是感性的，非常冲动的“右脑需求”。在发现“真正的需求”的赛场上，赢家不一定是先行者，而是第一个基于产品功能，创造出情感共鸣的人。
    2. 作为个人，你总觉得给父母、家人、孩子提供了“产品功能”，但是，只有你同时满足了“情感诉求”，才是一个有魔力的“产品”。


