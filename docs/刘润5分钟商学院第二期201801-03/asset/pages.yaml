- pgno: 122
  md: '你说的这个软件非常有难度，简单理解：人工智能=机器学习+大数据。香气因人、因时、因心情变化很大，很难量化，很难对香气本身做智能化。而且奢侈品香水平台很难有那么多潜在用户，就算市面上买的数据也很很难保证数据的有效性，在少量数据基础上推荐，意义不是太大。


    综上，个人认为张鹏要解决的问题是，"奢侈品香水平台"如何高效匹配用户并转化购买的问题，"香水气味偏好智能软件"只是其中的一个解决办法。


    同学你好，首先你提到的App，我感觉只是为了实现客户了解香水的 一个工具罢了，而你最终的目的是卖更多香水。如果是通过气味交互实现App互动，这点我觉得目前的App暂时无法做到。下面是我个人观点：


    +   1. 客户细分决定价格组分，你们公司有如此多的产品应该有区分利润款、引流款等。按照28定律，无论你们怎么细分，大多都符合。有20%的个别品牌的个别味道的香水提供了80%的销量或者说是利润，那么我们在做日常销售引导的话应该会有意识地进行销售引导吧。


    +   2. 客户标签化，可以根据客户年龄，所属行业，工作场景，是否单身，工作收入等进行客户细分，让所有的进店客户在第一时间先找到自己的标签定位，这样我们就可以根据客户的这个标签推荐相应的香水即可。当然这种适用于非成熟客户，就好比像我这种基本不用香水的，如果要买，大多也是听从导购安排，如果味道跟价格还能接受，估计也就买了。总之，通过寻问快速定议消费者的标签，从而更快更好地引导消费者购买。


    +   3. 借助营销+异业联盟，除了传统的节日，现在还有很多互联网节日，如女王节等，充分利用好每一个节日，紧跟社会热点；其次，跟高档服装店铺、美甲等店铺相互合作以试用装产品为主，这两种产品的客户跟我们是有一定共性的，无论产品品类多少，还是要符合STP分析的。我们的性质跟你差不多，我们的产品是手机，国内外国多个手机品牌，差不多几百款手机，我们是很做个性化推荐的，只能通过细分客户，以及根据自己的盈亏目标来有意识地引导客户按照我们的期望进行消费。如果你跟我们公司一样只是所谓的渠道商而并非生产厂家的话，我想我们的核心目标就不在于品牌多产品多了，我们的核心就在于服务方面了。而你后面提到的线上线下新零售更是为了提高目标市场范围，提高客户体验度，而这一切应
    该基于我们已经既定的公司战略，而制作App、产品试用装、"新零售"等，只是为了实现我们战略目标采用的战术手段罢了。


    张鹏你好，我是一位女性消费者，看了你的问题和其他同学的答案后，我就在想，你真的需要这款App吗？与其投入大量资金研发一个仍需求的App，不如从场景式导入思考问题，挖掘消费者的真实心理才是营销的关键。


    你现在的主要纠结点不应该在怎么做一个App，而应该是怎么提高试香效率从而达到销售产品的效果。看你的问题我就知道，你根本不知道自己为什么要做这个App。如果我是你们的老客户，你要我下载你们新开发的App，我百分百会拒绝。因为我现在手机里的App已经够多了，而且你的App对我来讲还不如小红书使用频率高。


    所以在此，我建议你放弃开发App的想法，选择学习"花费时间"那样的商业模式。


    +   1.开辟线上市场，从微信公众号或者小程序开始做起。


    +   2.开设会员服务和每月定期送（随机送n个小样）服务。


    +   3.通过不同场景、星座、爱好分类香水类型，给大家建议。


    +   4.气味的感受是非常个人的，肯定是要在线下试香的，所以我认为可以出一些品牌香水的廉价分装让大家购买。


    +   5.建立会员社群，将一些小众品牌首发到这群香水爱好者中，引爆口碑效应。


    以上是我的建议，谢谢。


    张鹏同学，我有一个很不同的想法供你参考-建立一个香水细分市场的社区。


    根据润总一直强调一家公司经营的三件大事：产品、营销和渠道，我想你所提的问题其核心是要解决你产品的营销和渠道这两件大事。你计划用投入资金研发并运营一款解决"顾客匹配"和线上线下融合的问题香水App，我认为更像是一个香水的互动社区。


    +   1）芳香启动通过专业香水用户或翻译提供高质量的香水主题的内容，比如"芳香心情日志"等主题内容，及线下门店的拉新推广，吸引"种子用户"。后续就是激发这些用户创造内容，不断地扩散社区的影响力。让少数人先受益，让用户知道App如何玩，同时吸引大批同类型的人，让他们感觉能够在这个社区中获益。


    +   2）营造氛围还没有用户内容是，先开始做活动，如试香、鉴香等免费活动，让网友报名，最终抽选一定数额的网友，提供免费体验。当参与活动的人数足够多后，报名须提交报名帖，还要相互拉票，最终通过帖子和相互点赞两个因素来确定最终人选。这样可提升用户活跃度，同时形成互动和分享的氛围。


    +   3）赋能自己的运营人员，要想方设法让用户生产芳香日志，并且是高质量、高可读性内容。


    +   4）建立生态。当用户的芳香日志与产品直接关联起来后，推出电商模块，电商平台像淘宝天猫一样，但有产品介绍、购者评价，还有该产品相对应的用户日志链接，更好地解决"顾客匹配"的困境。从在达到教育和培育用户的基础上，网聚人群，其价值自然凸显。最终让社区形成一个生态系统（香水领域），在社区中，有人生产内容、有人消费内容，还有人获取商业利益。


    以上，供你参考。


    我主要针对这位同学的融资问题回答一下。


    首先，针对你的问题：这个项目能否融资？


    这两年做App的项目，如果还是在种子期，投资者是很少有兴趣的。而且由于前两年的资本寒冬期，这两年还有大规模的App项目公司倒闭。所以现在投资人普遍对App项目比较观望。而市场上真正能融到资的App项目，也是因为商业模式特别好，特别新颖，而且投资人都会切入进行开发。投资人的切入也是为了减少风险性的存在。


    因此可以总结出：


    +   1.如果一个App项目想要融资，还是需要有一个好的商业模式。


    +   2.如果商业模式够新颖，投资人就会参与到开发，因此你也不用担心太落后期开发的问题。


    接下来，咱们谈一下你的商业模式，也就是你的问题"这个香水智能匹配发展方向行不行？免费试香、记录顾客气味偏好的功能，能否带来市场价值？"


    从你的描述，我的理解是，这个App的作用更像是辅助你销售的一种手段，而还没有成为一个单独的商业模式，因此在这种情况下，你还是在如同原来的框面一样，销售你的香水，只不过有了这个App，客户的体验要好一些，试用香水快，增加了效率，但整体却没有形成独特的商业模式，因此很难融到资。


    而如果这位同学想要去融资，就需要将这个App单独拿出来，有一个全新的经营模式。除了特别经营模式，App项目还需要有一套全面的App营销策略，要比现在市场上的营销策略都要新颖，使得你的经营可以变为盈利，只要让投资人可以清晰看到可实现利润，可进行的资本运作，才有可能对项目进行融资。


    综上所述，这位同学如果想融到资，需要进行以下几方面努力：


    +   1.有一个以App为核心的商业模式。


    +   2.有一套针对此App的营销策略。'
