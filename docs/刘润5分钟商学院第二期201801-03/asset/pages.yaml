  md: '# 106 | 服务蓝图：10分钟闭嘴理发店


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    学了两周的产品，你注意到没有，这些产品都有个特征，就是"有形"，比如APP，杯子，房子。但是，这个世界上，还有一类特殊的、"无形"的产品，它的数量甚至远大于有形的产品。那就是：服务。


    小张开了家理发店。他边学产品课程，边在思考：我的产品到底是什么？我应该设计什么？我满足了什么？从本质上，《...》思考，我如何把"理发"这件事，做得更好？（详见底部相关课程）


    小张的学习精神，值得表扬。但在回答"如何做得更好"这个问题之前，我们首先要明白："理发"这件事情，是产品，但它是一种特殊的、"无形"的产品，叫做：服务。


    # 概念：服务蓝图


    什么叫"服务"？


    比如，《5分钟商学院》是产品，还是服务？《5分钟商学院》每天的音频课程，是产品。因为它的"边际交付时间"为零（详见底部相关课程），你可以在我不介入的情况下，随时听，来回听，躺在床上听，怎么都可以。它是一个具体的，已经属于你的"有形的东西"。


    那《5分钟商学院》的线下大课，是产品，还是服务？是服务。因为它的"边际交付时间"很高。你来参加大课，我必须在场。我讲你听，你问我答。我们酣畅淋漓地处一 胶，谁也不能缺席。线下大课，是一个"无形的过程"。


    所以，"有形的東西"是产品，比如电脑，书本，手机，游戏道具；"无形的过程"是服务，比如问诊，培训，咨询，或者朋友听你诉苦。


    为什么一定要严格区分"产品"和"服务"呢？因为，服务是一个过程，只能"体验"，无法"带走"，它比产品多了根"时间轴"。这根"时间轴"上的每个节点，都要经过设计。


    # 运用：


    回到最开始的案例。具体应该怎么设计"理发"这个服务呢？你可以尝试：服务蓝图。


    前台，是直接和顾客打交道的员工，比如接待员，发型师；后台，是顾客看不到的，支持前台工作的员工，比如值班经理；比后台还后台，只在内部互动的员工，叫做"支持"，比如库房保管员。


    现在，我们用"时间轴"，把这四种角色串联起来。


    +   1）顾客推门进入，"前台"的接待员上去。 2）顾客问：要排队吗？接待员说：不用排队。 3）接待员问：您有熟悉的发型师吗？他说：没有。 4）接待员说：那您先洗个头，我给你安排一位发型师。
    5）"后台"的值班经理，从"支持"的系统里，指定发型师，并找到空位。 6）顾客洗完头，指定发型师给客人理发。 7）理完发后，客人付钱离开。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_98_0.png)


    它让我们可以用"上帝视角"看待顾客与员工，员工与员工间的所有互动。


    顾客问：要排队吗？接待员说：不用排队。这步可以优化吗？应该可以。买个"红绿灯"放门口。红灯，就是要等15分钟以上；黄灯就是15分钟以内，绿灯不用等。


    从洗头到理完发，要耗时40分钟，这步可以优化吗？嗯，有点难。可顾客时间有限，如果必须缩减到10分钟呢？这太夸张了吧？我想想。如果不洗头，不挑发型师，快剪快收，有可能可以。


    太好了，那 ensure 10分钟。 还有，顾客对"理发师卖卡"这件事，深恶痛绝。如何优化？那就开设"闭嘴专座"吧。


    沿着"时间轴"，小张在"服务蓝图"中一步步优化，最终决定，把理发店转型为一家"10分钟闭嘴理发店"。顾客可以在店门口根据红绿灯指示进店，也可以在微信上预约。理发师戴着"闭嘴口罩"，10分钟剪完，讲一句理发就免费。


    这个"10分钟闭嘴理发店"，受到了写字楼用户的热烈欢迎。


    # 今日得到


    划重点


    1.产品是有形的東西，服务是无形的过程。 2.服务蓝图，是设计"服务"的工具，它用"时间轴"，把"顾客，前台，中台，支持"的每个触点链接起来，然后创新、优化每个节点的服务体验。
    3.服务精神，不是在给对方一个"有形的東西"，而是陪对方度过一次"无形的过程"。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_98_1.png)


    你的公司，提供的是产品还是服务？如果是服务，你的服务蓝图中，有哪些部分可以提高呢？欢迎你在留言区分享，与大家一起，过招。也别忘了把今天的文章，分享给你的朋友，也许能够帮到他。


    实战篇线下大课3月底就要正式开课了，前两天推出的300席学习通卡，不到48小时就已全部售罄。'
