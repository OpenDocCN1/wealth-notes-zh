  md: '# 069 | 背景因素：这款你都没听过的中国手机，为何能成为非洲之王？


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    知道了什么是需求和到哪里找需求，就够了吗？当然不。每个“需求”的种子，都有适合它的土壤。今天，我们来学习，如何为需求找到合适的土壤，也就是“背景因素”。


    学完“麻烦”这课，李雷苦苦在麻烦背后找需求。他突然想到，每个人的脚都各得很不一样，但鞋却是批量生产，很难真合脚。那上门量脚，反向定制，应该是个“隐藏在麻烦背后的需求”吧！他非常兴奋，赶快辞职创业，从朋友那找到第一笔风投，风风火火干起来。半年之后，他的公司终于......倒闭了。


    为什么呢？这听上去是个真需求啊！为什么倒闭了呢？


    # 概念：背景因素


    因为这个需求的“背景因素”，可能暂时还不具备。什么叫“背景因素”？我举个例子。


    在亚马逊的电子阅读器 Kindle 发布3年前，索尼公司就有了自己的电子阅读器 Librié（这是一个法文单词，意思是：小型图书馆）。Librié 是款颠覆式产品，比书还轻，能装下成百上千本书，电子墨水屏，在阳光下也能清晰阅读。索尼梦想着用它改变世界。


    # 运用：


    那到底该怎么判断“背景因素”是否合适呢？你至少要从4个维度开始：


    第一、时间


    需求的种子，太早种下去，会冻死；太晚，已经没有机会。


    第二、技术


    第三、文化


    第四、资源


    # 今日得到：


    划重点


    +   1. 令人激动的需求，并不永远能长成产品的苍天大树。所有的需求，都有适合它的土壤。这个土壤，就是“背景因素”。那如何来判断土壤是否合适呢？你可以从4个维度开始：时间、技术、文化和资源。
    2. 对应到个人身上，做任何事情，抛洒一腔热血，也要注意天时、地利、人和。只有背景因素具备了，才能事半功倍。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_22_0.png)


    刘润


    你有没有见过，把好的需求种子，种在不合适的“背景因素”里，最后夭折的案例呢？


