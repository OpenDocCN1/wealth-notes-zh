  md: '# 064 | 沉默的螺旋：为什么“先说的声音越来越大，后说的最后无话可说”？


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    今天，我们来学习一个经典的传播概念：沉默的螺旋。


    我有个朋友，投资的一部电影终于上映了。可电影刚上映，一位毒舌影评人就发表了一篇影评，把电影从头到尾嘘讽了一遍。他的文章很有煽动性，所以后面很多影评人跟风，360度地挑毛病，俨然这就是本年度烂片之王。我这个朋友非常恼火，想请朋友写文章把他们骂回去。但是，平常很要好的朋友，几乎都不帮忙。怎么办？


    要解决这个“怎么办”的问题，我们首先要理解这个问题本质。这个问题的本质是，你很不幸地遭遇了“沉默的螺旋”。


    # 概念：沉默的螺旋


    什么是沉默的螺旋？“沉默的螺旋”是大众传播学中最重要的概念之一。它最早是由德国政治学家伊丽莎白·诺尔-诺依曼于1974年提出的。它是说，在公开的舆论环境中，人们如果发现自己的观点和大部分人一致，就会积极参与讨论；但如果发现自己的观点不被大部分人认同，甚至会被耻笑、或者攻击，就会保持沉默。越沉默，就越沉默，最终另一方形成“优势意见”。这就是“沉默的螺旋”。


    我举个例子。


    2016年儿童节这天，一篇题为《最心酸的儿童节礼物：她偷了个鸡腿给生病的女儿》在朋友圈刷屏，感动了无数网友。“刘某燕真是个好母亲”的声浪，螺旋上升；“唉，偷东西居然还有理了”的音量，螺旋下降。最后，反面意见逐渐沉默，“母爱如天”成为优势意见。网友们一边感动，一边捐款，2小时内的捐款就超过了30万。


    可是不久后，有媒体做了深入调查后得知：这个刘某燕，其实是个惯犯！这个结果让网友们大吃一惊。啊？是个惯犯，我捐了30万你才告诉我是个人犯？你们怎么不早说啊？


    超市当然很委屈：我早说了，可是你们不听啊。在“母爱如天”的意见气候中，反对者们被群起而攻之，所以，他们逐渐选择了沉默。


    这就是“沉默的螺旋”。


    # 运用：


    原来“沉默的螺旋”这么可怕！那我应该怎么办，才能让支持自己的观点不掉进“沉默的螺旋”呢？你可以试试两个办法。


    第一，抓住“黄金24小时”。


    一个公共事件发生，最开始24小时的“意见气候”，几乎决定了舆论走向，这就是“黄金24小时”。这段时间，如果大家都说好、非常好，后来的反对者会怀疑自己的品味，甚至怀疑人生。反之亦然。


    具体怎么做呢？还没上映前，召开媒体、自媒体、意见领袖、网红的专场看片会。看完后当然有喜欢，也ilinx不喜欢的。喜欢的多半会褒奖，而不喜欢的呢，多半也会碍于情面不至于恶意攻击。


    不过，这一招威力强大，要慎用。心术不正者，雇人给自己虚假好评，就变成了“5毛”；给对手虚假恶评，就变成了“水军”。


    第二，反沉默螺旋。


    原来这就是“5毛”和“水军”的理论基础啊！可是，我已经被“水军”黑惨了，怎么办呢？


    这时候，你就需要把握节奏，“反沉默螺旋”了。


    所有能量，盛极必衰；凡是螺旋，都有节奏。批评到一定程度，公众必然会厌烦，媒体人也会觉得，我再批评，也没有新意了。这时，反转的“节奏”就出现了。


    具体怎么做呢？这时，你可以透露一些劲爆的独家消息，给没骂过你的权威媒体人。为了写出夺人眼球的文章，他很可能选择在负面意见衰减时，做“孤独的英雄”，带起一波新的正面节奏。


    正负交替，是自然规律。你需要做的，


    # 今日得到：


    # 划重点


    > 在公关传播中，因为人们害怕被孤立，被嘲笑，被攻击，优势意见会越来越响亮，弱势意见会越来越沉默。这就是“沉默的螺旋”。

    你可以用两种办法利用、或者规避“沉默的螺旋”。1）抓住“黄金24小时”：在最早的24小时内，鼓励支持者大量发声，会导致负面意见产生“沉默的螺旋”；2）反沉默螺旋：如果负面意见已经成为主流，可以等它冲顶回落时，顺势带起一波新的正面节奏。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_13_0.png)


    刘润


    请你想一想，你见过哪些被“沉默的漩涡”带到沟里，后来又救出来的公关事件呢？


    欢迎你在留言区分享，与大家一起，过来招。也欢迎你把这篇文章分享给你被黑惨了的朋友，帮助他们把握反击节奏吧。'
