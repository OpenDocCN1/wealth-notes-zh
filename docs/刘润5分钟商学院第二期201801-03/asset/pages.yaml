  md: '# 068 | 麻烦：解决顾客没开口告诉你的困扰


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战简。


    前几天，我们学习了什么是“真正的需求”；今天，我们继续学习，如何发现“真正的需求”。那到底如何发现？一句話：真正的需求，在麻烦背后。


    我有个朋友，做Nella十几年电饭煲，是行业中的专家。他心想，电饭煲这种东西没人比我更懂了，早就没有未被发现、未被满足的需求了。如果有，早就有做人做了。像我们这种，没有新需求的行业，应该怎么办？


    要解决这个“怎么办”的问题，我们首先要理解它的本质。这个世界上，没有“被完美满足的需求”。所有自满的巨头背后，都有一批不满足的消费者。只不过他们的抱怨声，被媒体的赞扬声掩盖了。掀开盖住麻烦的石板，下面都是真正的需求。


    亚德里安在《需求》这本书里，举了一个例子。


    1997年，里德·哈斯廷斯在整理旧东西时，突然发现了一盘，六星星期前租来的录像带。居然完全忘记还了，他赶紧算了下罚金，整整40美元，已经够把录像带买下来了。


    “忘记还录像带”这件事，给哈斯廷斯带来了“麻烦”。大部分人面对这个麻烦，可能是抱怨几句就算了。而哈斯廷斯不同，他决定掀开这块“麻烦”的石板，看看下面有没有藏着什么“需求”。


    # 概念：麻烦


    他在去健身房的路上，突然冒出一个想法：“对啊，电影租赁，为什么不能像健身房一样，用月费或年费的方式购买服务呢？为什么必须为每一盘录像带的使用天数付费呢？”于是他开始着手实现这个想法，最终成立了一家公司，就是今天如日中天的奈飞（Netflix），市值超过600亿美金，是本世纪成长最快的公司之一。


    小结说，问题总藏在矛盾中。你是从麻烦上跃过去，还是掀开它研究呢？


    回到最开始的案例。电饭煲背后，有没有被你忽视的小麻烦？


    我以前用的电饭煲，每次盛完饭，勺不知道放哪儿。放锅里吧，锅就盖不上；放桌上吧，勺子就脏了。怎么办？你怎么做的？我是拿个小碗，把勺放在小碗里。


    十几年来，我从没觉得这是个“麻烦”。直到最近，我买了一只新电饭煲。它的勺很特别，勺头和勺柄之间有一个凸起，勺柄重一点，勺头轻一点，这样我往桌上一放，勺柄和凸起支撑了勺子，勺头就翘起来不会被弄脏了。也就是说，用了这个勺，我再也不用小碗了。


    我突然意识到，过去几十年，我每天都要多洗个碗，是多么“麻烦”的一件事啊。如果你以前也和我一样，那中国人每年要多洗多少个碗啊。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_21_0.png)


    只要麻烦存在，需求就存在。只不过，你是不是有一双从麻烦背后，发现需求的眼睛。


    那我具体怎样做，才能从麻烦背后，发现需求呢？亚德里安说：画出用户的麻烦地图。每个“麻烦”，都是地图上的一个摩擦点。每个摩擦点，都是一次创造新需求的机会。


    # 运用：


    具体怎么画？他提供了3条思路。


    第一，流程地图。


    想象从你走出家门，上车，到机场，落地北京，取行李，打车，最后到酒店的流程。中间每个环节，有没有“麻烦”存在？有的话，掀开它，下面有没有“需求”？


    比如，等行李就是件麻烦事，傻傻站在那里十几分钟。怎么办？巴西的圣保罗机场，为旅客提供免费的酒水，让大家愉悦、耐心地等行李。


    第二，资源地图。


    你装修房子，要买建材、沙发、电器、油画，还要和设计师装修工人打交道。麻烦不麻烦？非常麻烦。这个麻烦下面有没有“需求”？


    于是，“一站式”装修网站就出现了。


    第三，两难地图。


    有些公司告诉你，要简约体验，就不能要复杂功能；要便宜，就不能要质量；要个性化，就不能要速度；要方便，就不能要选择。鱼与熊掌永远不能兼得。这就是“两难地图”。但真的是这样吗？这个让你陷入“麻烦”的选择下，有没有“需求”？


    谁告诉你说“便宜，和质量不可兼得”，那是他们水平不够。我就要做到又好又便宜，于是网易推出了“网易严选”。


    # 今日得到：


    划重点


    +   1. 真正的需求，在麻烦背后。画出用户的麻烦地图，每个“麻烦”，都是地图上的一个摩擦点。每个摩擦点，都是一次创造新需求的机会。具体怎么画？三个办法：画出流程地图资源地图，和两难地图，然后在上面“找麻烦”。


    +   2. “真正的需求，在麻烦背后”，这个道理对个人，也是同理。你可以说“真正的成长，都在痛苦背后”，“真正的机会，都在挑战背后”。事情总有两面，看到负面，正面也就่วไม่ไกล。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_21_1.png)


    刘润


    回想你上次旅行的过程中，有没有什么让你觉得“麻烦”的呢？这个麻烦背后，有没有需求呢？


