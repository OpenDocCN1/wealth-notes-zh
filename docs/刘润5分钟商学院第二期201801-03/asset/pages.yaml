  md: '# 110 | 看比赛：对不起，楼继伟说的基本是对的


    每天5分钟，解决一个商业问题。欢迎收听《刘润5分钟商学院》，实战篇。


    两会期间，全国政协委员，全国社保基金理事会的理事长楼继伟，接受采访时说，"保证6%以上回报率的理财产品别买，那是骗子"。这话说出去后，就有网友跳出来了，你明明在另一个采访中说，"去年社保基金投资收益在9%以上。"
    你这不是打自己脸吗？你不让我买6%以上收益的产品，自己却收益9%以上？你才是骗子呢。很多网友愤愤不平。


    # 楼继伟：保证6%以上回报率产品是"骗子"


    全国政协委员、全国社保基金理事会理事长楼继伟在接受记者采访时表示，老百姓要加强风险意识，不能一看收益高就被"忽悠"进去了，他说，"保证6%以上回报率的就别买，那是骗子"。


    # 楼继伟：去年社保基金投资收益在9%以上


    中国证券网讯 全国政协委员、社保基金理事会理事长楼继伟5日在人民大会堂接受上海证券报记者采访时表示，去年社保基金投资收益在9%以上。


    可是，楼继伟真的自相矛盾吗？今天的看比赛，我们就来看看这背后有什么商业逻辑。


    很多网友觉得楼继伟打脸，可能是不理解金融。"保证6%以上回报率的产品别买"这句话的核心是什么？核心不在于"6%以上的回报率"，而在于"保证"二字。


    我们国家对金融体系是强监管的，禁止银行、保险理财机构推出任何保底的理财产品。为什么呢？因为这个世界上根本没有什么金融产品是完全零风险的。你说你的产品没有任何风险就能获得6%以上收益，这是非常不负责任的。


    当然，实际收益6%以上的理财项目多了去了，巴菲特几十年平均年化收益率30%以上，更别说风险投资了。比如你投资了小米公司，小米公司一旦上市，可能 shirt
    几倍、几十倍、甚至上百倍的收益。


    但是在你投资小米之前，这么大的收益率，小米会不会给你保底呢？当然不会。你之所以能获得这么大收益，是因为你承担了非常高的风险。


    所以楼继伟说的其实是保底这件事，"保底6%以上是骗子"和"社保基金收益9%"，这两句话并不矛盾。


    那到底有没有保底的理财产品呢？


    理论上是有。风险很低，或者几乎没有风险的产品才可以保底。在金融体系里，最没有风险的，就是银行存款。银行定存一年的利率是1%到2%，理论上是保底的，银行有存款保险制度，但保底最多只保50万。


    比如你在银行存了100万，突然这家银行倒闭了，这个概率非常小，但也不是不可能。因为它为你的存款买了保险，保险公司会赔付给你，但最多给你赔50万，剩下的50万你自己承担。所以即使是银行这么保险的机构，其实也是不保底，或者说不完全保底的。


    啊？连银行都不保底，那到底有没有保底的理财产品呢？理论上也是有的。比如，我今天想管你借1000块，我把价值4000块的手机放你那，你以6%的利率把钱借给我，我还钱后再把手机拿回来。如果我没还钱，这个手机就归你了，你怎么卖也能卖个2000块。这理论上是保底的，这就叫抵押贷款。


    但这样的话，你用6%的利率给别人借钱，别人就不一定会管你借了。为什么呢？他抵押最少也能卖2000块的手机，去借1000块钱，那银行就会以比6%低的利率，把钱借给他。


    现在银行一年的定期贷款，利率大概是4.75%左右，上浮到顶，大概是6%。也就是说，今天在市场上借钱的最低成本大约是6%。这就意味着，你想以保底7%或是8%的利率把钱借给别人，那银行就会用6%借给他，他就不会找你借钱了。


    尤其当金额很大的时候。比如用几亿、几十亿、几百亿投资股债、基金时，是不会出现保底收益6%以上的情況的。因为一旦高于6%，既然有充足的抵押，银行就会以6%的利率，把钱借出去。


    反过来说，如果今天，我真的找到了保底6%'
