  md: "能价值，而是情绪价值。\n\n# 三、团队和融资\n\n咱们专栏第四季度的课程中会花很大篇幅来讲团队建设的问题，在这我先简单说说。\n\n首先，你一定要有能力互补的合伙人。比如你是有建筑背景的一个创始人，那么你可能至少得有一个懂孩子、懂教育、懂母婴产品市场的人，他会知道销售和渠道的很多问题，和他一起你就能避开很多坑。另外，你还得有一个懂技术、懂产品的人，比如以前做过玩具的人。这样你们三个人在一起，成功的可能性就会大一些。\n\
    \n另外，投资方面，关于投资的天使轮、A轮、B轮等等的融资逻辑，咱们课程的第三季度中会讲得很清楚，今天我们先不说太远，只说第一步：拿你的想法不断去找身边的有经验的人士，跟他们聊，看看他们对你的想法是不是感兴趣，有没有人愿意给你第一笔启动资金，也就是所谓的天使投资。天使投资最重要的目的是把这个东西启动起来，把第一个产品原型给做出出来。拿到原型之后，你再推销到家庭中去试用，收集意见反馈，继续做调整。\n\
    \n这个阶段你可以验证两个很重要的问题：第一，你们团队是真的靠谱，还是origin一时兴起，靠谱的人才能真正做出口东西来；第二，你做出的东西是不是真的有价值。\n\
    \n好，以上就是我对于这个问题答案，这位同学可以再结合咱们的课程内容多做一些思考。总之，我认为父爱产品这是个很好的想法，如果你下定决心了，就希望你能勇往直前，做出好东西，祝愿你创业成功。\n\
    \n当然，我也选出了10名同学，作为这次私董会问答的获奖者，他们分别是：...\n\n请中奖的同学记得在留言中写下你的联系方式和手机系统型号（每人将获得200元奖学金，以充值的方式返还到你的账户）。\n\
    \n在母婴市场打父爱牌，不得不说是一个新鲜的主意。基于你本身是一句建造师，我给你的建议是：\n\n做一个“小小建筑师”的项目，让父亲带着孩子来参与，在这个核心项目的基础上，再去做其它产品的销售。所谓“小小建筑师”，就是提供一个场地和建筑材料，让父母和孩子一起搭建小房子、小花园、小滑梯、小桥等建筑。这个产品已经有了，取得材料不是问题，而且从品牌上看还没有做得特别知名的，你有机会。盖房子这件事情，主要是爸爸发挥作用，是父爱与孩子非常好的互相项目。因为你本身就是建造师，做这个项目你有优势。关于融资，我觉得不要着急，你应该先在自己所在的地方做出一个样板来，然后再找资金进行复制。\n\
    \n橡皮擦同学你好！我工作于一个基于服务社区的亲子玩学社群——遛娃团，强调的是父母对孩子的高效陪伴，服务于0-15岁亲子家庭，重点解决周末及节假日爸妈带孩子不知道去哪里玩？不知道玩什么？不知道跟谁玩？三大痛点问题。目前遛娃团已经落地服务全国25个城市！\n\
    \n下面我分四个方面给大家做一下遛娃团服务模式的透视，请谅总，各位老师同学多给我们提宝贵意见：\n\n# 一、用户是谁？0-15岁城市亲子家庭用户父母受教育程度较高，中产阶级以上收入重视亲子陪伴及亲子教育\n\
    \n# 二、用户痛点：带孩子去哪玩、带孩子跟谁玩、带孩子怎么玩。\n\n# 三、遛娃团社群服务解决方案：\n\n+   1. 去哪玩：整合全国、本地优质亲子游玩场所资源，餐饮，研学，旅游等各种合作资源，形成亲子服务产品；\n\
    2. 跟谁玩：基于小区的亲子社群模式，让邻居变成朋友，孩子在小区里就能找到兴趣相投的玩伴，父母通过带引孩子进行有效的亲子社交找到价值观相同的其他亲子家庭，形成高品质圈层，重塑邻里关系；\n\
    3. 怎么玩：每周遛娃团提供高品质的亲子活动，由专业遛娃师团队，策划组织，带着家长和孩子一起玩，让父母轻松高品质遛娃，让孩子在玩耍中愉快的学习和成长，促进亲子家庭和谐亲子关系。\n\
    \n# 四、服务方式：我们为付费会员具体提供五种服务内容：\n\n+   1. 产品服务：遛娃护照，一本护照玩遍全国；\n2. 活动服务：每周末高品质亲子活动，让孩子情商，体能，综合素质在游戏中得到提升；\n\
    3. 赛事服务：主办各类大型国际、国内亲子赛事，提供更广阔的亲子参与、展示、社交平台；\n4. 父母课堂：让爸爸妈妈碎片化时间里学做睿智新时代父母；\n5.\
    \ 社交圈层：让孩子童年不孤独，让父母育儿不慌张，小区里找到一家几口共同的好朋友。\n\n请谅总，各位老师同学，橡皮擦同学不吝赐教！\n\n第一，品牌差异化定位设计。大量的研究表明，父亲不仅是孩子性别认同的模板，也是孩子社会认同的榜样。孩子在自控力、坚毅、责任感、自信、乐观、积极向上等对未知环境和世界的好奇心和征服感离不开父亲的塑造。那么，你让用户真切感受到所建立的品牌传递了父亲在孩子成长中所扮演角色的内涵，这就是与其他母婴品牌的差异化体现。这样的定位要体现在品牌名称、logo设计、APP风格等，我想谅总这几周的产品设计课应该能够给你很大的帮助。\n\
    \n第二，项目开发少而精。我认为就目前基础而言，你想到的三个方面很难同时推进，不妨根据自己身边的资源优先做好一项。如果选择亲子游乐园或周边亲子游项目，我建议参考国内曾经很火的综艺节目《爸爸去哪儿》的理念和模式。一是可以找到有运营亲子游乐园的团队合作，试着设计一个规模适度的以父爱为主题的亲子乐园；二是在周边找到愿意合作开发亲子游项目的场地提供方，共同进行项目设计，比如发挥你的特长设计一个“未来设计之星”的项目，布置好相应的场地。然后，和旅行社合作，推出特色游项目。可以考虑在活动现场，让用户扫码加入你的公众号，并在现场推广一些你事先准备的一些符合品牌特质的产品。\n\
    \n第三，制定商业计划书。简单高效讲清项目的方法。一是使用一种固定的句式：如果我做了一个什么动作（输入），就能获得一个什么结果（输出）。Uber的创始人卡拉尼克在早期和别人描述Uber的时候，说的就是：你只要按下一个键，就会有<|message|>一辆车来接你。二是利用了“二维定位”方法，一方面找到一个大家非常熟悉的产品对照；另一方面在找到一个大家非常熟悉的产品对照之后，要说出你做的事情和它的区别是什么。\n\
    \n橡皮擦同学，你好。我是一名造椅师，你提到的转型问题，我也思考过，在这里仅就你提到的该如何行动，说说我的建议。\n\n+   1. 恭喜你，已经选好了意向行业，并有了自己的想法和点子。关于转型的问题，很多人都遇到过，你要相信你遇到的大多数问题，很多前辈早都遇到过，并且也都提出过很成熟、有框架的解决方案。关于自己的职业规划，可以出门左转学习一下古典老师专栏《超级个体》，相信里面很多内容是你需要的。\n\
    2. 第一，一方面还是要做好自己的个人商业画布，分清楚自己拥有的和能够带来价值的地方；另一方面，对自己的职业规划要有个清晰的定位。第二，转行之前，研究目标行业，看是否这个行业真的是你要去的。去研究行业白皮书、行业年度研究报告、行业内人\
    \ \n的评论、研究市场已有的成功案例等。用多一些时间去拆开行业面纱，看看它真正面目的样子，也要看到这个行业最差的那一面。第三，用产品膜视角考虑这件事情，创业就是直接去打造产品，在你制造产品之前，问一下自己是否确实设计好了？因此，切入这个新行业的角度，建议先到一家行业内的公司去担任某个职位，全方位地了解这个行业，发现用户的真实痛点、痛点。先入行，在工作中积累经验，转型成功的几率会直线上升，风险也要小很多。\n\
    3. 第一，转变自己的思维模式，将自己闪烁着工程师智慧的大脑尽快切换到商业世界的CEO模式。正"
