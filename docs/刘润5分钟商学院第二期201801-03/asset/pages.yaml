  md: '# 加餐 | 区块链：这个点石成金的“区块链”，到底是什么鬼？


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_27_0.png)


    加餐 | 区块链：这个点石成...


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    最近，有几个东西非常红火，红到发紫、火到烫手，叫做：区块链，比特币，和ICO。全球股市，沾上区块链的概念就大涨；比特币价格，在2017年猛涨了十几倍；ICO更是像打新股一样疯狂。但是很快，中国七部委联合下文，叫停了ICO，一夜之间ICO似乎成了庞氏骗局的代名词。


    那么，区块链、比特币、ICO到底是什么鬼？它们到底是庞氏骗局，是数字泡沫，还是投资机会？这里面到底有什么样的机遇与陷阱？


    为了帮助《5分钟商学院》的同学们能透彻地理解区块链，更重要的是能推开骗子，吹开泡沫，抓住真正的机遇，我特别赶在去北极之前，从上海飞去北京给同学们做了一场主题为“区块链、比特币、ICO和机遇与陷阱”的直播。信息量很大，所以我特别分了4期内容，用连续的4个周日，给你加餐，让你彻底看透这轮热潮背后的商业逻辑。


    今天，我们先从区块链开始。


    区块链，简单来说，就是一套“加密的分布式记账技术”。“加密”是数学概念，“分布式”是网络概念、“记账技术”是金融概念。因为横跨三个复杂学科，理解区块链，确实比较困难。


    我从2014年开始给无数银行、保险、证券、基金，讲了4年区块链。但即使是专业的金融人士，因为不懂数学和网络，理解起来也很吃力。所以，我今天假设你不懂数学，不懂网络，不懂金融，我试着用最通俗的语言，给你讲明白。


    首先，你不用背住“加密的分布式记账技术”这个定义。如果你理解了“中心式记账”，自然就会理解“分布式记账”了。


    什么是“中心式记账”？中心式记账，这是当前金融行业广泛采用的记账系统。


    举个例子。


    我们的资金是存放在银行的，比如我在某某银行有5000块钱，这在银行其实表为一条数据，银行是用一个中心数据库来存储这个数据的，为了防意外和灾害，它还建有备份的数据库来存放这个数据的副本，这种记账方式就是中心式记账。


    我对这笔资金的所有操作，都需要通过某某银行做身份认证和修改授权，才能完成。


    这样的中心式记账有很多好处，但也有两个你未必重视过的问题：


    +   1. 如果中心（如银行）出现问题，例如黑客攻击或者系统错误，导致记账数据被篡改或损坏，就可能导致整个系统的危机甚至崩溃。虽然这种可能性很小，但并不是完全不可能。2.
    这种运作模式因为账本的唯一性，依赖的是中心的信用，即银行的信用，如果这个“中心”的信用出现问题，比如银行擅自篡改数据，那么客户的权益也会受到侵害（例如已经发生了很多起的银行职员利用职权盗窃客户资金的事件）。现在的办法是依靠严格的监管。但所有的监管都不完美，都会存在漏洞，导致人为事故。


    区块链的出现，则解决了这两个问题。


    我们刚才说，区块链是一个“分布式记账技术”，也就是说，我有5000块钱这件事情，不是指录在“中心”（比如银行）的数据库里的，而是记录在全网所有的计算节点上的，也就是说这5000元钱属于我，是获得全网所有节点计算机确认的。


    这听上很神奇，也很让人费解。很多人的第一个问题就是：这安全吗？比如，既然我的电脑上，也有“你有5000元”这条记录，那我把这5000元改成我的，行吗？


    几乎不可能。这就是“加密”两个字的含义了。这个“加密的分布式记账技术”中的加密算法，导致如果你想要篡改数据，需要“说服并修改”’甄不相识’的全网51%以上计算节点。而如果系统中计算节点数量足够多，这基本上是个不可能完成的任务。


    那么这个听上去怪怪的“加密的分布式记账技术”，有什么用呢？


    所有的交易，都需要依赖信任。比如，到底是我先发货，还是你先给钱？总统大选，会不会被人篡改？我们签了合同，你会不会修改了你手上的版本，还说我是假的？


    过去，这些信任问题，是通过中间可信的第三方解决的，比如银行，比如政府，比如公证处，比如证券交易所。区块链的本质，就是建立了一个“不需要中间人的信用体系”。在没有中间人的情况下，所有的交易仍然可信，甚至更加可信。


    这个“不需要中间人的信用体系”，到底给我们带来什么样的商业机会呢？太多了。我们在第4课慢慢讲。下一课，我们要先讲讲，基于区块链技术的第一个应用，1年涨了十几倍的比特币，它到底是不是数字泡沫，值不值得投资。


    # 今日得到：


    划重点


