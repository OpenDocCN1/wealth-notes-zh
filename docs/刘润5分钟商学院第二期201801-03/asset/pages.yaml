  md: '# 108 | 排队心理学：排队，是个数学问题；等待，是个心理学问题


    每天5分钟，解决一个商业问题。欢迎收听，《刘润·5分钟商学院》，实战篇。


    在“服务蓝图”这课，我们学了服务设计的“关键时刻”；在“黄金圈”这课，我们学了服务设计的“客户体验”。今天，我们来学服务设计的另一个“关键时刻”：排队。


    美国休斯顿机场接到了大量旅客投诉，说排队等行李的时间太长。机场决定增加搬运工，并轮班工作，加快搬运速度。这个办法很有效，旅客平均等待时间缩短到8分钟，低于同业标准。但是，旅客依旧还是觉得太慢。怎么办？


    要解决这个“怎么办”问题，我们首先要理解它的本质。


    # 概念：排队心理学


    “排队等待”（Waiting-in-line），是“服务”这个“无形过程”中，独特，但也司空见惯的现象。你在超市结账要排队，银行取钱要排队，上班等电梯也要排队。据估计，美国人每年要花370亿小时排队，平均每人150小时。


    那么，怎么解决“排队等待”的问题？数学家认为“排队”是個最优化问题，一定有数学上的最优解。他们拿出草稿纸，不断计算，提出了著名的“排队论”。


    我本科是数学专业，学了十几门不同的数学，其中一门，就是：排队论。


    排队论公式表格


    心理学家哈哈大笑。“排队”，可能是个数学问题，但“等待”，是个心理学问题啊。我们最终的目的，不是让排队时间最短，而是让等待时间不焦虑。于是，心理学家也提出了著名的学说：排队心理学。


    什么叫“排队心理学”？


    回到最开始的案例。休斯顿机场通过增加人手，已经从数学“角度”，把搬运速度做到qu极致，但旅客还不满意。著名的心理学家“拉森”建议说，旅客下飞机走1分钟，在行李转盘等7分钟。你修改下旅客的ою走路线，让他们走6分钟，然后等2分钟，看看效果如何。


    神奇的事情发生了：再也没人抱怨了。因为你有事忙起来（比如走路）时，对时间的感受，比无所事事（比如等待），要短得多。所以，让他等，不如给他事情做。


    这就是“排队心理学”。


    # 运用：


    那如何用“排队心理学”设计服务，来提高用户满意度呢？做好四件事。


    第一，不要让顾客闲下来。

    闲下来，就度日如年；忙起来，就白驹过隙。所以，不要让顾客闲下来。

    怎么做？

    如果电梯很慢，就在里面放个镜子。顾客就有事做了：检查自己的仪容，或者悄悄观察别人，甚至会感觉电梯来得“太快了”。


    如果你是餐厅，可以学学海底捞。海底捞等位区，有吃有玩，还有“事做”。服务员给你一堆彩纸，折星星可以换菜钱，一个星星抵5毛。于是，大家拿出半生功力和时间赛跑，发誓要把海底捞拆破产。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_100_0.png)


    第二，从排队开始服务。

    超市收银台，会有个“传送带”，让你在排队时，可以先把东西从购物车里拿出来。在一些快餐厅，会有服务员，拿着小本子，在你排队时帮你选好菜品。

    这样，可以减少顾客等待的焦虑，并同时因为服务已经开始，减少他放弃的欲望。


    第三，让顾客看到“进度条”。

    银行、餐厅、政府办公大厅，可以用机器或手机取号、叫号，让顾客按自己的情况自由行动，无需枯燥地排队等待。这个叫号系统，就是“进度条”。

    如果你是咖啡厅，可以开放操作后台，让顾客看到制作过程。做咖啡的过程，本身就是“进度条”。

    如果你是外卖APP、打车软件，快递员、专车司机，在地图上的位置，以及预计到达时间，就是你的“进度条”。

    进度条给顾客“掌控感”。


    第四，一定要保证公平。

    排队时，人们对“公平”的追求，到达了巅峰，甚至会患上“队列恐症”（Queue Rage）。在排队时，吵架，打架，甚至刺死、枪杀的事件，层出不穷。所以，服务者，一定不能容忍插队。

    那如果，我确实想给高级用户，优先提供服务呢？在中国传统里，这叫“走后门”。记住“走后门”，不要“走前门”。


    # 今日得到：


    # 划重点


    > “排队”，是个数学问题；“等待”，是个心理学问题。

    我们最终的目的，不是让排队时间最短，而是让等待时间不焦虑。

    方法：

    1.不要让顾客闲下来

    2.从排队开始服务

    3.让顾客看到“进度条”

    4.一定要保证公平


