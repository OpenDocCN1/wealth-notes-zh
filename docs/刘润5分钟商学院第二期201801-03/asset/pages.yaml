  md: '# 056 | 1-3-2心法：花1元建设品牌，省3元交易成本，拿2元品牌溢价


    每天5分钟，解决一个商业问题。欢迎收听，《刘润5分钟商学院》，实战篇。


    从本周开始，我们将学习营销这个大模块的第四部分：品牌。


    今天我来告诉你一个建设品牌的心法：叫做1-3-2心法：花1元建设品牌，省3元交易成本，拿2元品牌溢价。


    这是什么意思呢？


    作为一个商业顾问，我每天最大的痛苦是发现，笨蛋老板太多了。你看看这个老板，一个做OEM的，帮别人代工皮鞋。他却自己注册了一个商标，但是根本卖不出去。问他为什么代工还自己注册商标？他说，自己辛辛苦苦生产的鞋子，别人贴个商标就能多卖200元，我想这多少钱啊？我也注册一个。但是，为什么我卖不动呢？怎么办？


    要解决这个“怎么办”的问题，我们首先要理解这个问题的本质。这个问题的本质是，人家贴的那个，是品牌；而你注册的，只是一个商标。产品贴上商标，并不等于品牌。


    什么是品牌？


    在《5商｜基础篇》第37课“品牌容器”里，我们学过品牌的基础概念。品牌是一个容器，通过承载消费者的“了解，信任，和偏好”，而被优先选择。你注册的“商标”，是一个新容器，里面空空如也，消费者当然不会优先选择你。


    # 概念：1-3-2心法


    今天，我们先来理解建设品牌的“1-3-2心法”：


    花1元建设品牌，省3元交易成本，拿2元品牌溢价。


    # 运用：


    那么，具体应该怎样建设品牌呢？


    第一，建设品牌标识。


    第二，建立品牌内涵。


    第三，建立品牌反应和品牌共鸣。


    # 今日得到：


    划重点


    > 品牌建设的心法就是，花1元建设品牌，省3元交易成本，拿2元品牌溢价，从而让消费者花的钱少了，你赚的钱多了。具体就要在品牌标识、品牌内涵、品牌反应，和品牌共鸣四个方面，持续投资。


    其实它的本质，就是共赢思维。今天的社会，信息高度对称，从别人手上抢一点食的“套利思维”越来越难以生存。用我的独特价值，帮你赚100元，我拿50走，共赢思维将会成为主流。


    ![](img/6b086af319379c0fa7ce76dc48c3f1a1_0_0.png)


    刘润


    好了，今天的“怎么办”，就回答到这里。你的产品有品牌吗？还是只有商标？你做过哪些把商标变成品牌的努力，值得与大家分享呢？'
