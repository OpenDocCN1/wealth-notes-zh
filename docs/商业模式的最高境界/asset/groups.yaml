    ## 第02节 卖东西的3个层面


    卖东西有3个不同层面：卖产品、卖商机和卖股权。


    因为卖的东西不一样，导致需求不一样，收益不一样。消费者要效果，经营者要利润，股东要溢价要分红。说白了，不外乎是卖艺和卖身。杨白劳卖豆腐一辈子都还不清黄世仁的债，卖喜儿一夜就能还清，可见卖艺不如卖身。


    卖产品赚的是每一单产品的差价，卖商机赚的是一群人帮你卖产品的差价，这些赚的都是业务层面的钱，属于卖艺。卖股权是把未来提前透支，把业务层面经营20年、30年才能赚到的钱，一年就赚回来，属于卖身。


    卖艺卖得好，卖身就值钱。产品零售卖得好，代理商就愿意经营赚钱，进而就有更多人愿意买你的股票，投资成为你的股东，这是一个良性循环的链条。


    很多老板想，既然我现在经营得这么好，赚业务层面的钱就够了，何必割让股份给别人呢？其实你没有考虑一件事：变化！


    你今天生意好不代表明天生意好，今天团队稳定不代表明

    天团队稳定，你无法预期明天的经营环境是否会恶化，你无法预期明天会发生什么突如其来的变故瞬间摧毁你的业务，非典、禽流感、拆迁、政策变动、战争，在这个世界上，几乎每个人对未来都是不确定的！


    所以最好的做法是，趁着自己还是黄花大闺女，正是风情万种迷死人的时候，赶快找个如意郎君嫁了，以后有个长期饭票。万一过了这个风头，拖到年龄大了，人老珠黄，想嫁也没人要了，该出手时就出手。


    ### ▸卖产品


    产品买单的是用户。用户是金字塔的底层，是系统的消费者。


    大鱼吃小鱼，小鱼吃虾米，虾米吃泥巴，用户就是泥巴，是生态链的底端，可是没有泥巴大家都得死光光。


    用户感兴趣的是效果好、品质好、功能好、品味好、包装好…等一系列的元素，同时用户对你的效果好、品质好、功能好、品味好、包装好、价格好…一点兴趣都没有，用户更想知道，因为你这些好，他能得到的好处是什么，利益是什么，

    结果是什么？


    请给结果！这就是用户。


    如果你能读懂用户真正要什么，你就开始根植大地，屹立不倒了。


    产品是讲英语的，用户是听汉语的，广告是翻译官。重要的不在于你是什么，而是你在用户的印象里是什么，因为营销传播的核心是一场认知的革命，是头脑的革命，是抢占用户心智模式的革命。


    革命能否成功，很大程度上取决于你的广告传播，有没有用清晰简洁的语言直指用户的痛点，把产品的最大卖点和用户的最大痛点用充满激情的语言，瞬间点燃用户的梦想。你做到了，你就成功了！


    ### ▸卖商机


    商机买单的是商户，也就是经营者，他们是金字塔的中层，是系统的经营者。


    这些商户可能是你的代理商、加盟商、批发商、经销商、分销商、团购商、渠道商、合作商，是帮助你开疆拓土、跑马圈地打江山的中流砥柱。因为他们，你的事业得以发展壮大，生意得以遍地开花。他们因名利而来，因情义而留。


    和用户不同，商户不仅在乎你的产品，还在乎你有没有一套验证有效的营销模式、推广方法和促销手段，更在乎跟你能不能赚钱。


    “这个市场很大”、“这个项目很好”、“能赚很多钱，快来跟我干”听到这番话，他们的热血就被你点燃了。


    需要注意的是，在你开始招募商户之前，有没有一套验证有效、能帮助商户赚钱的模式？如果没有，请认真打磨，否则后果自负。


    ### ▸ 卖股权


    股权买单的是股东，也就是投资者。股东是金字塔的顶层，是系统的所有者。


    那些看好你企业未来发展，同时又不愿出力干活的，可以投资成为你企业的股东，这个过程就是股权融资。


    股权融资属于直接融资，就是以公司股权来交换投资方的资金。割让股权换来的资金是企业的股本金，股本金是无须还本的，这意味着投资者需要与你共同承担风险，因此他们不但要享受利益分配的权利，同时也要参与分享企业决策的权力，这些权利和权力与其投资额度成正比。


    从操作层面看，股权融资的形式基本上 有两种：增资扩股和割股套现。更多绝学课程请咨询微信xi383921,备注：咨询！


    增资扩股是由投资者向企业增资，致使企业总股本增加。投资者基于扩大后的总股本来计算其占有的公司股权比例。增资扩股的结果是企业获得了资金，而不是企业家获得了资金。


    割股套现是企业发起股东转让部分股权给投资者，换取相应资金。投资者是基于原来的股本金来计算其持股比例。这种融资形式，企业并没有获得资金，获得资金的是企业家个人。也就是说，投资者收购企业股权的资金流入了企业家个人的账户，而非流进了企业的账户。


    股权融资不但是权益与资金的交换，同时也是风险与利益的权衡。投资者虽然分享了企业分配的权益，但同时也分担了企业经营业的风险。企业吸收的外部股东越多，抗风险能力越强，需大家共同承担风险。


    ## 消费经营股权融资模式


    我们总结了一套特别的融资模式，将卖产品、卖商机、卖股权三合一，我们把它命名为“消费经营股权融资模式”，它从而彻底解决了资金、客户、人才三大问题。


