    贪污犯贪污了 1000 万，行贿的人行贿 1000 万却拿了 2 个亿的工程，赚了 2000 万。这两个都赢了，可是其他企业却因此少赚了 3000 万，所以国家能放过他们吗？


    不能，因为不平衡！


    所以如果这个事一开始设计不平衡，迟早会出问题，你们只见贼吃肉，没见贼挨打，所以平衡比什么都重要。


    当你的梦想跟大家的利益都有关系的时候，大家就愿意帮你实现梦想了，这样你才能梦想成真。


    你不能一味去追求结果，你更要注意结果背后的后果。有时候结果很美好，后果很严重。


    手术很成功，但病人却离开人世了，这就是悲剧！


    我们要考虑平衡，平衡每个参与方的价值观和利益。


    我问你：什么是大人物，什么是小人物？只要参与你的系统的，每一个都是大人物。


    有一个高手去餐厅吃早餐，跟服务生说“再来一块牛油。” 服务生说：“一盘面包只能配一块牛油。” 他说：“你知道我是谁吗？”'
  - '[PAGE 108]


    他说："我很牛逼，我在哈佛大学拿一等奖学金，现在世界五百强企业工作。"


    服务生说："先生，看得出来，你很牛逼，可你知道我是谁吗？"


    高手很诧异："你不就是服务生吗？"


    服务生摇摇头："不，我是给你拿牛油的那个人！"


    大系统里没有小人物，企业里面没小事，感冒都可以要人命的，同意吗？要平衡。有的事都是人做的，人是基本元素，车不走了要加油，人不干了是没动力了。


    行为背后一定有动机，动机背后一定有利益！


    必须平衡好每方的利益，平衡好每一方的价值观，而且这个价值观不是强加给对方的。


    有一对夫妇离婚。俩人办完手续之后，一起吃最后一顿饭，男人像往常一样，把鸡腿夹给了女人，女人一下就哭了："这些年来我最讨厌的就是鸡腿，你从来都不在乎我的感受。"
    男人一听得更惨："从小到大，我最爱吃的就是鸡腿。但和你在起后每次我都不舍得吃，都夹给你吃了。"


    爱也是需要沟通的，个人要明白组织的价值观，组织要明'
  - '[PAGE 109]


    白个人的价值观。而企业家要做的，就是要平衡每一方的价值观。


    每个人出生时都是光溜溜的，可是为啥到现在不一样了呢？这个社会的资源对每个人都是敞开的。我认为做老板，你要考虑是在做一个多大的框架，装了多少资源进来。


    为什么好的投资商、供应商、人才、客户都进不来？为什么社会外部的资源进不来你的企业，为什么？


    因为跟人家没关系。


    孙子兵法说要先胜而后求战，什么意思？


    是得到所有战争获胜的必备要素之后才开战，而不是仗打了一半发现武器装备不行，粮草补给不行，军情不明，这个时候想赢却没机会了。


    兵法的最高境界是不战而胜，百战百胜是下策，最好的赢家是不战而胜，最差也是打一次就够了。百战百胜意味着要打好多次仗，劳民伤财啊。秦国的灭亡跟打仗是直接相关的，当年的战争掏空了国家资源。


    所有的战争不是打人的，而是打钱的，所有的市场都是打'
  - '[PAGE 110]


    钱的。孙子兵法不是教战法的，而是教不战之法的。做生意频繁出手的，出错的机会就很多。


    很多老板生意东边赚一点，西边亏一点，最后剩下一 点点。这就像一个男人同时交往好几个女人。人的精力有限，管都管不过来啊。生意牵扯的人力、物力、财力，你顾不过来。


    对老板来说，减少出手的频率，一辈子做好一件事情就不得了了。


    ![](img/bfda52d6c5cdfa68d525dc14d6d5ffc7_110_0.png)


    毛主席一辈子也就只做了两件事情。第一是把小日本送回老家了，第二是把老蒋送去台湾了。


    伟人也只做两件事情，咱 们普通人能做好一件事情就够了。打死骇嘴的，淹死会水的，乱拳打死老师傅。常在河边走哪有不湿鞋？频繁出手的，出错的机会就很多，你认同吗？


    全世界最省力的方法，就是一次性把事情做好，返工才是最大的成本，要消耗掉大量的人力、物力、财力。'
  - '[PAGE 111]


    早产儿大多先天发育不良。万事万物都有它的规律和周期，你要按规律办事，按套路出牌。拔苗助长的、转基因长出来的，可能会短暂繁荣，但是后果很严重。


    我们中国的老板们普遍都很勤奋，但是最后大部分努力成了“两院院士”：要么进医院，要么进法院。


    在你的商业架构中，要有四个基本原则符合各参与方：最

    佳利益、最小风险、最简单、最平衡。

    所以，在动作之前，先考虑清楚。


    ![](img/bfda52d6c5cdfa68d525dc14d6d5ffc7_111_0.png)


    商业模式顶层设计应先于一切的动作！'
  - '[PAGE 112]


