    基于你对用户生活场景的了如指掌，你就能先发制人领先对手，在用户必经之路上守株待兔；基于你对用户生活方式的烂熟于胸，你就能设计出一个又一个巧妙的主张让他们回应，从而一步一步跟随你，并走进你的营销系统。


    ### ▸第三步：设计粉丝入口


    当你走进用户的世界，你会惊奇的发现，粉丝入口如此之多：所有能接触到用户的地方，都是你的入口。


    也就是说，用户在哪里，入口就在哪里。


    随着用户生活场景的多变，你已经无法用单一入口捕获到全部粉丝了，仅仅只用电视广告、纸媒、广播、搜索引擎、地推、门店，不管哪种单一的方式，都不足以全部覆盖到你的用户，因为随着选择的增加，用户被分流到了各个不同的入口。


    怎么办？


    多入口进入，全网营销捕获用户。


    如果一张桌子仅靠一条腿支撑，那么当这条腿断掉的时候，桌子就塌了。如何让桌子站得更牢固？答案就是：腿要多一些。


    每一个入口都是粉丝的来源，都是现金流的管道。如何保障持久、稳定、大量的现金流？答案是：多入口吸纳粉丝。


    你见过章鱼吗？它只有一张嘴巴，却有 8 只触手，每只触手捕获到食物都会送回到嘴巴里。我们把这种多入口吸粉的策略称为“章鱼总动员”。


    狡兔三窟，章鱼还有八爪，做企业何必死守一个入口呢？


    ### 第四步：合作方式


    当你找到入口准备进入时，你会发现这些入口，尤其是流量巨大，聚焦了很多粉丝的入口，无一例外都被别人把守着，这是人家花了心血、资源、时间和资金才建立的管道，岂能是无主之地？


    要从这里过，留下买路财。


    常人的想法就是花钱买路，而你知道高手会怎么做吗？


    世界首富比尔盖茨，在刚创建微软公司的时候，选择跟


    IBM 合作，提供 DOS 语言操作系统给对方。IBM 作为世界第一名的公司，有着全球广阔的分销网络和渠道。通过跟 IBM 的合作，微软的产品趁机铺到了世界各地。


    听懂这句话顿悟商业真谛：


    ![](img/bfda52d6c5cdfa68d525dc14d6d5ffc7_176_0.png)


    假如把客户比作是珍珠，你会发现珍珠散落在石头旁、海底下、沙滩上，一个一个地找真的是太慢了，没必要这样做，你只要看谁脖子上挂着一串珍珠项链的，把它摘下，放在你脖子上就好了。


    在深圳有一帮姐妹，她们有个口号：傍大款，吃大款，喝大款，让自己变成大款，然后干掉大款。


    我们必须承认，傍大款的确是捷径。


    营销如果有一万个方法，那么最管用的肯定是合作。营销如果只有一个方法，那么猜都不用猜，肯定是合作。


