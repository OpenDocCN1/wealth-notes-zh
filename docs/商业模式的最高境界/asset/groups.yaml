    赵总：我们以前就在商场那个专卖店卖代金券，然后二百号员工，每人十张的任务。当然也有很多完不成的，活动太频繁了。


    老师：“送礼+增值+回购”的代金券形式，在实践中威力还是挺大的，不过对接的目标客户需要绝对的精准。如此，花50块钱购买我们的代金券，送你一份80元的礼品，同时，这张代金券还可以抵300元使用。


