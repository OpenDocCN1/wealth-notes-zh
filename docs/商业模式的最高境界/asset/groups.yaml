    老师：家长来了之后，千万不要强制销售，应该引导性的让他们去了解你的产品，并给他们身份感、稀缺性、紧迫感和引发从众心理，同时在领取礼品的时候，一定要登记联系方式，最后就算是没有成交，也有持续跟进的机会。


    王总：谢谢老师提醒，我明白了！


    老师：那你现在还有什么困惑吗？


    王总：没有了，思路完全通了，现在心情非常激动，我回去就马上行动！


    ## 案例:墙面高端艺术涂料的自动化赚钱方案


    我有一位学员赵总，是经营高端环保的墙面艺术涂料生意，主要目标客户是新装修房子的中高端业主。在参加我课程之前，已经到了关门的边缘。他请了大量的业务员扫楼拜访，发了铺天盖地的广告，始终无法打开市场，更可恨的是，连上门的人都没有！


    在参加我课程之后，接受了不到5分钟的指点就找到了解决

    方案，直到现在根本不需要业务员陌生拜访，也不需要派发

    广告，业务已经完全实现了自动化。


    到底如何做到的呢？


    其实就是教他用单笔利润为指导设计买客户的方案，下面

    是整个指导对话过程。


    老师：每成交1个客户，你能从他们身上平均赚到多少钱？


    赵总：除去材料和人工的成本能赚到将近7000元吧！


    老师：如果20个目标客户找你，并深入了解到你的产品之后，有没有可能成交1个？


    赵总：我对自己的产品很有信心，只要认识到我们涂料的价值了，20个精准的目标客户成交1个完全是小菜一碟，现在最大的困惑就是根本没人上门！


    老师：刚刚你说成交1个能平均赚到7000元，那么，如果你用350元左右的成本转化为一个高诱惑的产品或服务，到目标客户聚集的地方投放，吸引他们了解你的产品，进来20个成交1个就不亏，成交2个就赚啦！

    这就是买客户，明白我的意思了吗？


    赵总：呀！这么简单，我怎么就没想到呢？这下心里有数了！


    在咨询完之后，赵总针对自己的业务进行了深入的思考，并设计出了自动化的业务模式。


    第一步：打造一款艺术涂料电视背景墙的包装服务，材料和人工成本在 300 元左右，市场定价 1980 元；


    第二步：找到装修公司，跟装修公司传达这样的合作主张：


    “只要是你们的客户，都可以免费赠送市场价 1980 元的艺术涂料电视背景墙的包装服务。”


    给装修公司的合作理由是：“我们的产品为了打开市场，让更多人了解，与其花几十万的广告费，还不如实实在在地用服务来做宣传！”。


    按照这样的合作洽谈方式，很快就达成了好几家装修公司的合作。


    第三步：在给装修公司的客户做艺术涂料电视背景墙的包装时，让客户直观感受到了高端艺术涂料的实际效果，并向客户推荐整套房子的墙面高端艺术涂料。


    最终的结果是，每赠送 45 个艺术涂料电视背景墙的包装

    服务，就能成交1笔整套房子的墙面高端艺术涂料业务。


    也就是说，每投入1200-1500元，就能赚回50000多元，


    这是多么高的投资回报呀！


    接下来他要做的就是对接更多的装修公司免费赠送艺术

    涂料电视背景墙的包装服务就行了。


    当然，现在赵总正在打造更好的成交工具和流程，争取做到每送2个服务就能成交1单整体墙面涂料业务，我们也恭候他的喜讯。


    通过两个案例的分享，相信你已经明白了运用单笔销售利润进行买客户的运作。


    你必须认识到，拓展客户并不需要赌博式的宣传投入，所有投入产出是可计算和监控的，通过各个环节的测试与优化，完全能够在没有任何风险的情况下，轻松做大客流量。


    ## 第03节 利用客户终身价值设计引流方案


    原理：以客户终身价值为出发点，依照锁定一个客户的终身价值为参照，计算出对应的买客户成本，从而选择和打造吸引目标客户进店的引流产品。


    先了解下什么是客户终身价值。


    通俗点讲就是：平均一个客户一生或一定周期内为你贡献的利润，我们称之为客户终身价值！


    当然，在买客户思维中对客户终身价值的定义有所差别：锁定一个精准客户1年或终身给你创造的利润！


    为了让你更透彻地理解利用客户终身价值买客户思路，还是通过实际案例进行讲解。


    ### 案例：汽车美容店客流倍增咨询录


    有一位汽车美容店的老板经朋友介绍找到我，向我咨询如何告别坐等生意的窘境，做到主动开发客户。


    我问他的第一件事情就是，如果锁定1个精准客户，一年时间能够从他身上赚多少钱？包括洗车、修车、保养，还有购


    买其他周边产品等。


    他说，1 个精准客户被他锁住以后，至少能够从他身上赚到 3000 元。这是比较保守的回答。


    我继续道，如果吸引 10 个客户过来，有没有把握锁定 1 个消费一年？


    他感到非常惊讶，并带有证明的口气说：肯定不止，要是这样的话直接关门就好了，最后他拍着胸口保证，如果是真正是有需求的目标客户，100 个至少能够锁定 30 个。


    见他如此胸有成竹，我就顺利的表达了自己的想法。我说：如果花 30 元吸引 1 个客户进店，进来 100 个锁定 1 个就不亏，按照你刚说的锁定 30 个，岂不赚大了！


    此时，他显得有些兴奋，同时又带有疑惑的眼神！


    我继续了解了一些相关服务成本后，开始帮他规划了引流产品。我说：洗车的成本 5 元左右，完全可以提供 5 次免费洗车，总成本也就 25 元，转换成本市场价就是
    100 元的洗车服务。


    再比如说，汽车消毒一次，成本也不到 5 元，把价值塑造好，市场价收费至少 60 元左右，洗车和消毒捆绑在一起，成本刚好 30 元，而整体的市场价就是 160
    元了，160 元的服务


    对于车主来说有没有价值呢？


    我继续说，你肯定渴望吸引过来的都是有消费能力的车主，所以找一些中高端的消费场所合作，比如，酒店、咖啡厅、高端足浴会所等，让他们把这张价值 160 元的服务卡当赠品免费送给他们的会员，持卡过来便可以免费享受服务，这样过来的基本上都是你的精准目标客户了。


    听到这里他已经豁然开朗了，获取客户就这么简单，完全不需要到大街上发广告，通过设计引流产品对接精准客户渠道（鱼塘）是最快、最没有风险的拓客方式。


    要知道，吸引 100 个客户进店只要锁定 1 个就不赔钱，锁定 2 个就赚了，就算不按他承诺的锁定 30 个计算，哪怕锁定 10 个，这样的投资回报率都够高了！


    再延伸一下思考，难道锁定的客户只消费 1 年吗？只要维护好，有没有可能消费 2 年、3 年甚至 5 年呢？有没有可能还介绍自己的朋友过来呢？


    所以说后端的价值更大，完全可以比预想的赚得还要多。

    其实很多店的服务都可以这样计算，记得前年我被一家化妆品公司邀请作为会议嘉宾，有一个老板王总咨询我如何开发


    客户，我仅仅分享了利用客户终身价值的买客户思路。据说后来就实现了自动化客户倍增。


    ### 案例：化妆品店的客流倍增咨询录


    王总：老师好，最近我一直在策划如何运用引流赠品来拓展新客户，今天遇到您太高兴了，还想请您指点一二。


    老师：如果锁定1个精准顾客，1年时间，能够从他身上赚多少钱？


    王总：这个不好说，有多有少，如果要算一个平均值的话，赚5000元应该是可以的。


    老师：如果吸引50个精准客户过来，通过你们的服务，有没有可能留住一个长期消费的？


    王总：肯定不止，按照二八定律算，至少也得留住10个吧！


    老师：如果是这样的话，你的生意就太好做了呀，我们来换算一下，锁定1个顾客消费1年，能够从他身上赚到5000元，现在花100元的成本吸引获得跟1个目标顾客接触的机会，进来50个留住1个就不赔钱，留住2个就赚了，按照你所说的留客比例，不做任何成交率的优化，瞎子碰鬼也能碰上几个呀！


    王总：这么简单？100元的成本如何吸引顾客？


    老师：化妆品本身就是一个暴利行业，100 元的成本放大到市场价 300 元的产品和服务并不难，光我知道的，几块钱成本的面膜市场价销售几十块钱一贴，应该是很常见的现象。


    王总：这个倒没错，您的意思是免费送？


    老师：虽然是免费送，但是必须精准，所以绝对不能像其他化妆品店一样在大街上发放免费体验的广告，那绝对是费力不计好的买卖，你要做的是对接精准客户渠道。


    王总：是不是您所说的鱼塘？


    老师：对的，首先你可以考虑从老客户入手，因为物以类聚人以群分，发动老客户进行病毒转介绍，对非常忠诚的老客户，回馈赠送 3 张友情卡，她们可以送给自己身边的朋友，持卡过来就能免费获得原价
    300 多元的化妆品套装或服务，如果 1 个老客户给你带了个过来，你的客户量是不是立马就翻了 3 倍。


    假如你有 1000 个老客户，立刻就能增长 3000 个潜在客户，按照你说的 20%的留客率，锁定 600 是很正常的事情，每个给你贡献 5000 元每年的利润，那么你就能额外多赚
    300 万，3 年下来，你就可以多赚 1000 万呀！当然，后续你还可以跟中高端的互补商家合作，比如，高端女鞋店、瑜伽馆、咖啡厅等，用回馈客户或促成成交的形式赠送你的产品领取卡，也能非常高效的把他们的客户导流过来


    王总：呵呵，照您一算，确实是这么回事啊！做了这么多年生意还真就没这样去算过账，今天是受教了！


    自从我在课程中提出买客户思维之后，已经帮助了很多实体店彻底解决了吸引客流的难题，其实很多老板不敢免费送高价值产品吸引客户，并不是他们的格局不够大，而是不会精准渠道对接，没有分析到更长远的利益，更没有认识到客户终身价值的威力。


    换句话说，他们害怕有风险的投资。然而，每当我把计算的数据摆出来，并询问他们能不能做到的时候，基本上都会觉得，按照客户终身价值所计算的比例，是很容易实现的，固然就舍得投入了，只要在成交和锁客环节稍做优化，最终的结果往往比预想的还要好。


    ## 第04节 利用预期目标利润设计引流方案


    原理：设定好预期完成的利润，并计算好销售额，然后拿出部分利润前置，通过销售额与成交率计算出买客户的成本。


    为了让你更清晰的理解利用预期目标利润设计引流方案的思路，直接带你进入案例观摩。


    ### 案例：给美的电器经销商的咨询启示


    这家美的电器店的老板李总在咨询我之前，每年要投入十几万的广告费，由于地理位置比较偏，加之市场竞争激烈，所以销售业绩一直都不理想。


    为了提升业绩，早已想尽了各种方法，依旧无法摆脱现有的困境，在咨询我的时候，他那精疲力尽的眼神让我再次看到了现在大多数实体店老板表现的状态。


    由于当时只是一面之缘，我并没有给他具体的做法，仅聊了一下运用预期目标利润来设计引流方案的思路。但就是这不到20分钟的梳理，让他瞬间对自己接下来的运作胸有成竹起来，并决定放弃每年十几万的广告投入，立刻回家制定新的营销方案。


    我说，虽然我不知道你成交一单的平均业绩是多少，也不清楚你的利润，但是我可以给做一个模拟推演启发你的思维。


    我问他：如果每个月完成 40 万的业绩，利润假定为 6 万，你愿不愿意拿出 1 万元吸引目标客户？


    他立刻表示同意。


    我接着说，假如平均一个客户在你这里购买电器，能够贡献的业绩是 8000 元，完成 40 万的业绩获得 6 万的利润，你需要成交 50 个客户，对不对？


    他点头确认。


    我继续说：我不知道你的成交率是多少，为了方便计算，现在我只能假定有需求的目标客户进店之后，你的成交率能做到 50%，如果要成交 50 个客户的话，是不是需要吸引
    100 个精准客户来进店，了解你的产品？


    他表示赞同。


    我再分析说：前面你愿意拿出 1 万元获取目标客户，通过 50%的成交率和 8000 元每单的业绩计算，需要吸引 100 个精准客户进店，才能够完成预先设定的业绩和利润，1
    万元分配给


    100 个人，就相当于买进一个目标客户的成本是 100 元，对不对？


    再变换一下计算数据，如果以 50 元的成本吸引 1 个目标客户，完成目标业绩的成交率只需 25%，对不对？如果你用 25 元的成本吸引 1 个目标客户，完成目标业绩是不是只需要
    12.5% 的成交率。


    当我算到这里的时候，李总的表情惊讶了，做了这么多年的生意才明白，原来业绩、利润是可以算出来的。


    其实，这是非常简单的思维，而往往很多生意人根本就没有思考到这个层面。


    回到上面的案例，如果花 100 元买一个客户，拿这 100 元的成本能不能转换成市场价两三百块的饮水机呢？拿 50 元的成本买一个客户，能不能转换成市场价一百多块的电热水壶？


    这些东西都是非常有吸引力的，只要把这些礼品的免费领取卡投放到精准的客户渠道一定能够吸引大量精准目标客户主动进店 (具体如何投放，在后面的章节有详细的讲解)。


    为了更进一步启发你的思维，我们再看一个案例。


    ### 案例：酒吧客户倍增的咨询启示


    在我课程现场，有个学员刘总，在商场的三楼开了一个酒吧，为了提高知名度不高，发了很多宣传广告，可惜并没有起到很好的效果，生意一直不理想。


    酒吧的环境、风格、装饰都非常豪华，纳闷的是，为何如此独具特色的酒吧就吸引不来客源呢？


    原因很简单，传统的广告并不能直接发放到精准客户手上，很容易被市场上各种铺天盖地的宣传所淹没。


    课程现场刘总问我，酒吧要如何提升业绩。我也是用预期目标利润的买客户思维启发他。


    我说：假如一个月想赚 10 万，你愿不愿意拿出 1 万元的成本吸引客户？


    可想而知，获得的答案是肯定的。


    我接着说：假如一个准客户可以为你每个月贡献 50 元的收入，通过计算，只需要吸引 200 个精准客户进店消费即可。


    我继续说，既然你愿意拿出 1 万元的成本吸引目标客户，将这 1 万元的成本分摊给 200 个准客户，每人可以分到 50 元，也就是说，花 50 元的成本，转换成市场价至少
    150 元的产品，


    投放到鱼塘对接精准客户，就能很轻松完成 10 万的利润了！


    如果每月赚 4.5 万就够了，那么，1 个客户只需要为你贡献 250 元的利润，如果你把吸引目标客户的成本降低到 25 元，是不是赚的会更多？所以，没有必要每天背着高额的开支坐等生意，计算清楚之后完全可以主动出击。


    通过本节的两个案例，你应该能够看到，运用预期目标利润进行买客户的方式，有三个指标是可以灵活控制。


    即：成交率、成交金额和引流产品成本。


    为了最终达到设定的利润，每个指标都可以测试、监控和调节，投入产出的每一个点都能做到心中有数，再也不需要盲目的做那些不可监控的风险投入了。


    以上案例展示的是买客户思维的计算方式，具体如何选择与包装引流产品，如何通过精准渠道(鱼塘)对接客户，如何成交与锁定消费，在后面的课程中会逐步讲解。


    本章三种买客户的方式请务必在纸上计算几次，以确保真正记住并理解其中的运算逻辑。


    通过本章的学习，你已经理解了用买客户思维计算出的成本，转换成引流产品吸引目标顾客的威力。


    但是，到底如何打造引流产品才能让目标顾客欲罢不能呢？


    不同行业和产品用什么思路才能设计出高诱惑的一流产品呢？


    在下一章透彻为你解密！


    ## 第十章


    ## 包装技术


    ## 第 01 节 4 大关键打造成功引流产品


    通过对上一章的学习，你已经知道如何运用买家户思维来计算包装引流产品的成本，那么，确定成本之后如何选择和设计引流产品呢？相信这是你最关心的话题。


    虽然市面上有很多人都在谈鱼饵营销（也就是我们所说的引流产品），但是大多数都停留在理念的层面，并没有告诉你具体包装的方法，而接下来我将彻底让你掌握不同行业、不同生意の引っ越し产品设计、包装的技巧以及注意细节，并通过大量的案例供你参悟。


    不管后面教你设计引流产品的技巧和方法有多么精彩，威力有多么惊人，都离不开打造引流产品的四个关键点，也就是说，要想设计出让目标客户欲罢不能的引流产品，就必须用下面
    4 个关键维度作为前提来思考。


    ### 关键点 1：低成本


    市面上有许多培训老师都说，要打造低成本高价值的引流产品，可是，他们从来没有告诉过你，到底多低的投入才算是


    低成本，甚至很多人误以为低成本就是便宜，所以才看到市场上用钥匙扣、小玩具、廉价丝袜、库存货等如此低级的产品作为引流产品。


    以上这些并没有理解低成本的原理。这种所谓的低成本，完全是站在自己利益的角度所认为的成本低，甚至一些投机的人还会想，就算是占便宜的人都来免费领取，自己也不会亏太多。这样的想法简直太幼稚了。


    我所说的低成本，其实是按照买客户的三种思维方式，用投入和产出比计算未来的成本。如果还没有理解低成本的概念，请务必再认真研读前一章的内容。


    对低成本的理解不同，就决定了吸引目标客户效率的高低。如果认为低成本就是便宜的东西，很可能，你只会提供钥匙扣、小灯泡、免费体验3次……


    如果理解的低成本是用买客户思维所计算出来的投入产出比，那么，你免费提供的引流产品就可能是电饭锅、饮水机、会员年卡等，如此一来，产生的引爆效应肯定是相差千百倍的。


    ### 关键点2：高价值


