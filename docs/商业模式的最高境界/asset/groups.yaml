    # 4、是否有潜在的替代品威胁？


    # 5、是否已经存在价值链龙头？


    这是考虑商业模式所面临的风险时最需要注意的一点。你准备进入的行业不能有产业链主存在，即不能有价值链的龙头存在。因为优秀的商业模式应当具有发展成为龙头和链主的最大可能性，而不是在一开始发展就受制于别人。


    顺便说一句，与传统的认识不同，我们评估风险的目的并不是回避所有风险。事实上，几乎所有重大的商业成功无不是冒着很多不确定的高风险取得的。正所谓：“不入虎穴、焉得虎子”，与机会伴随而来的必然是相应的风险。


    正因为如此，我们说评估风险的最终目标是要识别出所有可能的风险、制定相应的应对策略，使得风险都能够可控和被管理。


    换句话说，我们要通过有效地利用风险、规划风险和管理风险来创造商业奇迹。


    总体上说，设计商业模式需要考虑的这五个方面，可以概括为“定位要准，市场要大，扩张要快，壁垒要高，风险要低”。


