    你要开发客户，已经有人大量地拥有了你要的客户，你只要跟他合作，一夜之间他的就是你的。


    有人已经花了三五十年，花了三五千万，建立和拥有了他今天的资源，你就没必要从头再来！你只要通过跟他合作，提出一个他没有办法抗拒的条件，他就会心甘情愿开放他所有的资源来跟你合作。


    只要条件足够好，他就会打开他的平台，开放他所有的资源来跟你合作。所以一夜之间，他过去三五十年的客户，那都会变成你的客户，都会变成你的客户，这是最快的批量开发客户的方式。


    这个管理、控制、接近、影响渠道入口的人，就是关键人物。你们和关键人物达成一个共赢的合作模式。


    别人凭啥对你好，全世界所有人都愿意为你推荐客户，凭啥啊？嫁姑娘的时候，小伙子来提亲，丈母娘说：“我凭啥给你


    你啊？” 小伙子就说：“妈，我有彩礼。”


    ### 第五步：鱼饵诱惑


    当粉丝入口搞定之后，剩下的就是如何把粉丝从入口引流到你自己的平台上来。


    现在问题来了，这些用户最初并不认识你，尽管入口的负责人也愿意把这些粉丝推荐给你，可是这些粉丝对你没有接触，根本谈不上依赖感，那么你应该如何吸引他们进呢？


    答案是：设置鱼饵，极度诱惑，无法抗拒的鱼饵！


    鱼不上钩，只是表示你的鱼饵还不够香。


    舍不得孩子是套不住狼的，何为舍得？小舍小得，大舍大得，不舍不得。


    现在各个商家都在想方设法“钓鱼”，一般的小恩小惠已经不足以打动这些“鱼”了，你得舍得下大饵，用上好的饵料。


    你知道吗？商家和客户就像下棋博弈的双方，彼此都按兵不动，不见兔子不撒鹰。对商家来说，你不给我钱我就不给你价值。对客户来说，他没感受到价值就不愿意付钱。可如果这俩人都不愿意先出招，这棋就没法下了，总得有人先付出。


    作为商家，你应该先付出，打破僵局。


    知道你小区楼下卖水果的大妈怎么做的吗？她让你免费品尝，你问她：这个桔子甜不甜？她说：甜不甜你先尝一尝。


    结果你一尝很甜，就把水果打包买走了。


    听懂这句话顿悟商业真谛：


    > 没有免费就没有收费，现在免费就是为了将来更好的收费。——唐逸狮


    就像公园里，以前买门票再进去看，后来免费开放，结果人来的更多了。很多人到了公园里，结果发现最好玩的景点是收费的，商家因此也赚了很多钱。


    在设计成交流程的时候，要注意：要么产品免费服务收费，要么服务免费产品收费，要么试用装免费正式产品收费，要么这群人免费那群人收费。


    就像酒吧里女士免费男士收费，男的追女的，跑到酒吧里消费。要么用户免费，正式使用期收费。如同美国人当初卖给中国的鸦片，毒品先吸，等你吸毒吸上瘾了，然后再收费。


    要么教育产品免费，后续产品收费，就像在报纸上免费赠书的商家，当你收到他们的书之后，他们会在书里促销其他药品保健品给你。


    ### ➢ 第六步：扫粉关注


    当你在粉丝入口处放置了香喷喷的鱼饵，引一群的“鱼儿”上钩时，千万要注意你指令，要求用户做什么具体的动作。


    传统的做法是：让用户打进电话咨询，或者到指定地方领取。


    大错特错！因为消费者的心理是：如果我打电话过去，说不定电话那头有一个训练有素的推销准备要说服我呢。


    如果是要求用户到指定的地方去领取，可能他在过去的路上，接电话或者忙其它的事情就会改道了。


    以上这些指令，都要会减低用户的回应，使你的营销效果大打折扣。


    正确的做法是：把所有入口的“鱼儿”都引流到一个地方来，让他们扫你的微信二维码。


    为什么要这样做？


    因为每个人几乎都会用手机，而从用户的生活场景来看，手机几乎是使用频率最高自工具，而且实时联网，方便快捷。现在一个人摸手机的时间，远远超过摸恋人的时间。


    当用户为了获取你提供的“鱼饵”，扫描微信二维码的时候，“鱼儿”就上钩了。你就抓住了他们的微信号，方便你持续跟进他们，从而推进成交。


    ### 第七步：完善名单


    你要更进一步的完善他们的名单，当你获取的名单越完整，你就越能有效的和他们进行互动，保持跟踪。


    如果你仅仅是抓住了他们的微信号，那么你也仅仅是微信给他们，而无法进行其他诸如电话跟进之类的方式，营销效果就会大打折扣。


    正确的做法是，当对方扫描你的二维码，关注你微信的时候，你的微信就应该自动推送一个手机版的网页，在这个网页上，你可以充分地描绘送给对方礼物的价值，同时要求他们注册登记留下姓名、电话、邮箱、以及收货地址，好方便你把礼物给他们。


    当对方完成注册之后，你的网页就可以把对方带到另外一个页面，在这个新的页面上，你可以提醒对方，这份礼物是免费的，但是需要自付邮费或者支付礼物的成本，那么对方会有两个选择，要么支付邮费或成本，领取礼物。


    要么不付任何费用，那么你也无需把礼物寄出，你没支付成本，却抓住了对方的名单。


    更重要的是，你要在这个新页面上提出一个更好的主张，邀请对方升级成你的 VIP 会员，或者优先客户。


    那么这个新页面的设计应该是这样的：分成两个部分，上面的部分是礼物介绍，要求对方支付邮费或礼物的成本，然后就发快递给他们；下面的部分是一个升级邀请，也就是一篇促销成交的广告文案。


    这样做的好处是什么？


    你对刚完成注册的客户，做了一次紧急的促销，对这个主张感兴趣的家伙做出了购买的回应，因为总有那么一部分人很容易做出决定。


    而剩下没购买的人，反正你的名单已经抓到了，就在你的数据库里，你可以持续和他们保持联系，为他们传递高价值的

