    5 元消费，就非常具有诱惑力；平时 68 元每斤的小龙虾，现在持券可以抵 40 元现金，限购两斤，也能促使目标客户欲罢不能。


    ## 引流卡的设计


    用引流产品对接精准客户渠道(鱼塘)时，要想尽一切办法获得跟他们接触的机会。


    所以，作为领取产品的凭证卡(引流卡)就成了吸引目标客户的关键环节。


    引流产品的种类有很多，引流卡的设计方式也不尽相同，但是，不管做什么形式的引流卡，材质一定要好，设计要有档次，绝对不能用名片纸质，整体设计不能低级花哨。


    我们在指导别人做引流卡的时候，都会建议用 PVC 材质或纸质比较厚的代金券，如果找到好的印刷渠道，成本并不会太高。


    ### 抽奖代金卡设计要点：


    这里带你分析它所具备的核心元素。


    核心元素 1：店名必须设计上去的，这代表着你的品牌，在店名下面的广告语是必不可少的，一句攻心广告语能够让目标受众直观感受到给他带来的价值，比如，“阳光、活泼、有

