    ## 第03节 打造咨询服务类引流产品


    每个人都想远离痛苦，实现自己的梦想，但是在人生的道路上，并非事事一帆风顺。


    在处理各方面的问题时(孩子学习成绩、经营生意、职场竞争、夫妻相处、亲子关系、婆媳关系、身体健康、技能提升等)，总会遇到一些阻力，当这些阻力无法化解时，一般会找有经验的人取经，希望得到点拨。


    所以，针对各种化解阻力、解决困难的咨询服务就有了非常广阔的市场。


    比如，我们熟悉的心理咨询，其实就属咨询服务类产品。由于生活的压力，心理压抑和扭曲的人越来越多，在这样的生活阻力下，便有了庞大的市场空间。


    如果能够把你所在领域的客户他们所面临的阻力和痛苦，按照你的经验打造出一套咨询服务体系，让他们通过与你对话咨询，梳理思维、解决困惑，绝对是非常受欢迎的。这种咨询服务，既可以销售，又可以成为吸引客户的引流产品。


    ## 案例：3个咨询服务类引流产品的启发参考


    策划公司可以开设“生意咨询服务”，以此作为引流产品，专门帮助生意发展遇到瓶颈的老板设计。在一问一答中，为他们找到问题的根源，并提出建设性意见，启发他们的思维，今后他们在做其他广告宣传时，肯定会优先选择你。


    教育培训机构，可以开设“学习成绩优化”的咨询服务。因为家长们都渴望孩子学习成绩优异，然而，他们在教育孩子时显得盲目无助，不知道如何有效引导学习，这是家长们的痛点。


    此时，打造一个帮助小孩提升学习成绩的“每周咨询研讨会”，定价680元。在会议中，分别了解孩子具体情况，提出一些理念和方法，教家长如何引导孩子学习，如何给孩子做学习计划，如何跟孩子处理好关系等。


    把研讨会的门票或会员资格，通过精准渠道送给家长，每周可以邀请10-20位家长同时参加。对于家长来说，是非常有诱惑力的。


    婚姻中介公司可以增设一项“幸福咨询服务”，帮助大龄剩女或离异女人。针对她们的性格与生活情况，提供最佳的择偶选择与夫妻关系处理咨询，并成立幸福俱乐部，咨询和俱乐部的会费标价
    1000 元。


    要知道，很多大龄剩女或离异女性，在感情方面是受挫的，甚至，有的不相信或是害怕感情，但又渴望获得自己的幸福。


    针对她们的痛点，把 1000 元的咨询与俱乐部会员卡送给他们，将立刻增加客户基数。


    咨询服务虽然是比较厉害的引流赠品形式，但是，并非喊个口号就能吸引到潜在客户，还需要注意一些操作要点。


    ### （1）描述出接受咨询能够解决的具体问题及得到的结果


    比如，做实体店咨询服务，在宣传资料上可以写“我们本次圆桌咨询会议，专门针对如何零成本快速拓展客源，如何提升三倍成交率以及解决客户回头难的问题，做 3 个小时的深入咨询和讨论，并通过至少
    5 个案例的详细操作剖析，带你制定自己的专属营销方案”。


    只有让接受邀请的对象清晰地知道能解决哪些问题和得到哪些结果，他们才会迫不及待的想要参与。


    ### （2）咨询服务必须标注好收费价格


    要让目标受众知道这次服务是收费的，并不是所有人都能


    够得到. 比如 “实体店百万咨询圆桌会议”，市场价 2000 元，只有这样，获得参加资格人才会感受到价值，才会好好珍惜。


    ### (3) 必须使用大量见证


    要想让人行动，就必须让对方看到，已经有很多跟他同样困惑的人早就行动了，现在已经得到想要的结果了。


    所以在赠送咨询服务的时候，一定要通过大量的见证再次塑造服务的价值，并刺激目标受众迫不及待地主动参加。


    关于如何获取和撰写客户见证，请登陆《改变世界》APP 学习，在后面的课程中会有详细讲解。


    ## 第04节 打造诊断检测类引流产品


    诊断检测类引流产品，一直以来都很受欢迎。因为，人们都有防范风险和纠错的意识。


    医院体检、眼镜店视力检测是非常具有代表性的引流赠送服务，更重要的是，检测与诊断出毛病之后，很容易引发补救性消费。这也是为什么营销高手们总喜欢用此类引流产品吸引潜在顾客的根本原因。


    很多人都误以为这种引流方式只适用于医疗行业，事实并非如此，通过多年的实践证实，大多数行业都可以设计出诊断和检测类引流产品。


    ## 案例：营销型单页广告诊断问卷的巨大威力


    我曾经帮助 DM 广告公司，拓展客户的一套诊断型引流问卷，采用免费发放给实体店老板的形式，实现广告业务引流。


    我相信，所有开店的老板都不希望发出去的广告没有效果，但是他们并不是专业的广告人，所以，对自己的广告肯定无法做到 100%的自信。现在不同的是，他们手上有了
    一份广告诊断问卷，可以对照每个环节诊断自己的广告设计和促销思路，减少不确定性，对于他们来说是非常有价值。


    重点是,诊断出广告的毛病,但又不知道如何调整的时候, 是不是顺理成章地就会联系到这份问卷的发放单位,不仅吸引了广告客户,还在他们心目中树立了专家地位。


    ## 案例：更多诊断检测类引流产品的参考启发


    补习培训机构可以策划一套《学习力诊断系统》，塑造好价值之后赠送给家长，通过六大学习力系统诊断，便能快速找到孩子学习能力低下的根本原因，并为对症下药提供有效的指导依据。


    家长们总是希望孩子成绩优异,却始终不知道成绩不理想的根本原因是什么。有了这份资料的诊断,就有了方向,可是,当发现问题根结,又不知道如何对症下药,便会优先考虑这家补习培训机构。


    做网站建设的,可以提供《网站成交率评分诊断》。要知道,企业做网站的目的绝对不是凑热闹,而是希望通过宣传自己的产品,实现订单转化,如果你能增设网站成交率评分服务,


    就可以更加获得客户的青睐。


    维修空调，可以提供空调检测服务；销售室内空气净化器的可以提供空气质量检测服务；健身房可以提供身体各项指标检测服务；美容院可以提供皮肤检测服务……


    在打造诊断检测类服务的时候，要想达到最佳效果，还需要注意三点：


    ### （1）诊断检测的内容一定要简单标准化


    诊断检测的内容有固定参数和标准，既体现专业度，又能够让诊断检测的对象进行直观衡量与判断，尤其在做问卷检测的时候，绝对不能让自己或被诊断检测的对象，用文字填写问卷，而应该对每个问题都设置
    ABCD 成“是与否”的选项，依照实际情况进行选择评分即可，最后按照分值得出相应的诊断结果。


    检测的结果提前准备好，通过评分值能够对号入座。其实，有点类似于经常在网络上做的心理游戏。


    ### （2）诊断检测形式一定要模块化


    用一系列无规律、无分类的问题及指标做诊断检测，是比较低级的做，高明的营销人员会把诊断检测的形式做到模块化，让受众感觉这是一套系统，而不是单纯的题目列表。


    模块化一般通过 4 个方面实现，分别是：类型化，板块化、层级化、标准化。


    #### 类型化：


    比如，生意经营的诊断：不同类型的生意，有不同的诊断方式，初创生意的诊断和规模成熟生意的诊断，绝对不能一概而论；服饰搭配诊断：不同性别、身形、性格的人，绝对不能一套系统。所以，在做深入诊断之前，第一步就是先诊断出受众所属的类型。


    #### 板块化：


    诊断的内容不能只是一长串的问题或指数列表，要区分出板块。比如，“生意诊断的 48 条问答”就显得不够严谨。同样还是 48 条，如果分割成 4 大模块，给人的感觉就完全不一样了。比如，生意四大系统诊断：客流诊断系统、成交诊断系统、锁客诊断系统及品牌诊断系统。


    #### 层级化：


    任何事物的发展必定有阶段和等级之分。比如，做颈椎病诊断的时候，仅仅只是诊断出对方有颈椎病，只能说有一定的经验，但是，如果你能按照受损程度和身体状况把颈椎病分为
    4 个等级，每个等级有相应的诊断标准，如此一来，更容易让人信服；


    #### 标准化：


    标准应该贯穿于类型化、板块化和层级化，因为诊断检测所得出的结论，绝对不能让受众感觉是你随意下的定论，而是，每个结果都有指标或元素作为判断依据。


    ### （3）做隐患提示和强有力证明


    并不是提供一份问卷，就能激发目标顾客的诊断检测欲望。要想让对方有更强的意愿参加，首先，必须做隐患提醒。也就是说，你必须在介绍资料中告知对方，一旦疏忽某些细节，就会出现哪些潜在的损失，就好像医院鼓励你做定期体检一样，几乎都是以癌症隐患来刺激你的行动欲望。


    同时还需要提供大量的反面证明，让他们知道，因为一些没有及时检测和预防所遭受到严重损失的案例，以及提供对诊断检测服务的权威证明。不要让人感觉你是随便编写的检测题。


    ## 第 05 节 打造前端体验类引流产品


    把主营产品、服务，让目标顾客没有任何抗拒地免费或低价体验，获得第一次跟他们接触与沟通的机会，促使后续长期付费购买以及带动身边的朋友消费，这是前端体验类引流产品所要达到的目的。


    往往我们拥有很好的产品和服务，但在消费者没有认识到它的价值时，做出购买决策是相当困难的，与其花费大量的宣传投入，还不如直接让他们体验。


    饭店可把特色菜通过鱼塘免费赠或低价销售的形式，吸引客源，目标顾客趁着这道特色菜，很有可能进店消费，他们除了吃这一道菜，肯定还会有其他消费。


    这种引流形式一般不会赔钱，要是正好符合他们的口味，很有可能就会长期过来消费。


    然而，很多店宁愿花几千上万的广告，采用打折或消费送代金券的促销方式，也没有意识到，把特色菜塑造包装之后，对接精准客户渠道免费赠送，将瞬间引爆客流量。


    在顾客进店之后，采取办理会员卡锁定或赠送下次抵现消费的代金券，很容易引发重复消费。


    做空调清洗服务的，可以把市场价 40 元每台的挂机清洗，给目标客户免费清洗一台。


    要知道，多数家庭平均有三四台空调，而且还有收费 80 元的柜机。我们以前做保洁公司时，所测试的结果是，只要 1 台空调清洗了，基本上所有的空调都能拿下，有的客户还会请我们给他们父母家的空调一并清洗。


    在没有接触之前，他们并不知道清洗空调到底有什么好处，也没有感受过清洗后的空调跟没有清洗的差别，通过面对面的沟通及效果对比，就能立刻产生后续消费。


    健身房可以免费提供健身月卡，并配合身体检测和一对一教练辅导，当作引流产品，对接鱼塘赠送。客户过来之后，通过身体检测找出毛病。


    针对性进行一对一教练辅导进行沟通教育，就能产生一部分办卡的客户。其实，健身房的固定成本是不变的，来多少人都一样，关键是很多人不知道健身的好处，没有到健身房健身的习惯，你提供一个月健身，他们不来你没有损失，来了，就有更多销售的机会。


    ## 案例：绝妙的实体书软文广告招商策略


    在课程现场有一位学员咨询我说：“我准备帮一位给灯饰经销商做经营培训的老师印刷 1 万本实体书，然后送给全国各地销售灯饰的终端商家，可我不想自己承担高额的印刷成本。


    所以，计划找生产灯饰的厂家联合赞助，彼此分摊成本，将这些灯饰厂的优势以软文形式植入到书中，用这位老师的口吻进行介绍，潜移默化的影响经销商的心智。我想，这对于厂家来说是非常有价值的。”


    虽然这是一个非常不错的整合想法，可他却犯难了，他表示说：“虽然我有信心，只要这些厂家愿意与我见面交流，就有很大的把握让他们掏钱做软文植入的赞助，但现在最大的困惑是，如何才能让这些厂家主动找我，思考了很久都没有找到有效的解决的方案，就是说，我该如何包装引流产品吸引这些厂家。”


    有人说，给这些厂家提供免费的咨询服务吧！


    也有人说，把这位老师的视频课程作为引流产品免费赠送吧！


    还有人说，整合别人的产品作为引流赠品来吸引这些厂家主动联系！


    以上这些思路看起来都是引流产品的打造方法，但事实是，生产厂家是很難被这些虚无缥缈的东西所吸引的，因为不管是咨询还是课程，他们见得了太多了。


    到底这些灯饰厂家需要什么呢？很简单，让更多销售灯具的终端店面了解到他们的优势，从全国成千上万家灯饰厂脱颖而出，这是他们迫切需要的。


    鉴于以上的需求，我给的建议是：


    - 1、书中增加一张彩页，成本并不会提升多少，但是这张彩页正反两面至少可以做 80 家灯具厂商的 LOGO、广告语和联系方式。

    - 2、彩页上设计一个统一的二维码，扫描二维码，可以进入手机版网站查看这 80 家灯具厂的产品图片、优势及合作咨询。


    试想，1 万本书都是发布到精准目标客户手上，书是可以长期保留和复习的，还有权威老师推荐，在书中植入的品牌广告及手机版网站宣传，价值至少可以包装到 1 万元以上。


    - 3、把以上的价值塑造好，将 1 万元的精准宣传，免费赠送给灯具生产厂家，吸引力自然就有了。不管是信函邀请，还是让灯具厂现有的供应商当作回馈的礼物赠送都能非常轻松地吸引到至少
    80 个厂家主动联系。

    - 4、最后经过深入的沟通，在这 80 个厂家中筛选出 10 个额外掏钱做软文广告的，就非常简单了。


    其实，这就是通过增设一个前端体验产品，作为引流赠品的思路进行策划的。


    ## 案例：茶楼让顾客盈门的五壶茶策略


    茶楼的生意经营惨淡，免费品茶的广告到处派发，没有任何效果，在跟我做了 30 分钟的咨询后，利用 5 壶茶策略，引爆了大量的客流。


    更重要的是，一个捆绑式的双向促成模式，带动了进店顾客后面持续的消费，下面是当时咨询对话的过程。


    客户：老师您好，谢谢你抽时间帮我解决问题。


    老师：不客气，还不知道能不能解决你的问题了，先说说你的困惑吧！


    客户：我和朋友合伙开了一家茶楼，我们的地段选的不是很好，平时客流量比较少。


    老师：开业多久了？


    客户：刚开业一个月。


    老师：为什么要选择做这个生意呢？


    客户：本身自己比较喜欢喝茶，平时去一些茶楼，觉得人家的生意还不错，而且这个生意感觉经营起来比较简单，再有，我们都是供电系统的，有一些关系，觉得客源应该不成问题，没想到……


    老师：理解，大部分人做生意都有你这样的误区，其实隔行如隔山，等自己亲自做了才知道困难所在。


    客户：现在犯愁了，我们的茶叶质量真的很好，比很多茶楼的价格都要低一点，就是没人进来。


    老师：你现在是怎么宣传的呢？


    客户：现在主要就是打电话让朋友们过来喝茶，再就是到附近发一些宣传单，也是宣传免费喝茶，还有就是做过几轮短信群发，但是几乎都没有什么效果。


    老师：哦，免费喝茶……好像看不到诱人的价值啊！


    客户：其实我们给顾客免费喝的都是好茶。


    老师：好像顾客不知道是吧？比如，我走在大街上，你给我一个传单，让我免费来喝茶，我的印象中会觉得肯定是不值钱的茶，并且我们并没


    有信任基础，很难促使我行动。


    客户：是有点这个感觉，不过进来喝过的就会明白，我们提供的都是好茶。


    老师：所以现在关键的问题是如何让他们进来，感受到你的茶很好，并产生想来喝的冲动。


    客户：嗯，要是那样，客源就不愁了。


    老师：现在主要的问题就是一个，你送了有价值的东西，只是客户进店之前，并没有感受到价值，所以我建议你这样做…


    客户：老师请讲！


    老师：你把免费喝的茶改一下。你现在店里有什么茶？


    客户：普洱茶、铁观音、大红袍、绿茶什么都有。


    老师：那这样，不要写免费喝茶，做一个代金券或代金卡，然后送5壶茶，铁观音、大红袍、普洱茶什么的各一壶，你店里一壶茶多少钱？


    客户：从68到198元不等。


    老师：很好，这样你把每种茶印上去，总价值应该是几百块钱了吧！


    客户：只多不少。


    老师：持这张券或卡，就可以帮助免费喝五次茶，每次喝的都不同，每壶茶都是明码标价，你觉得这样有吸引力吗？


    客户：如果这样的话，就太有价值了。我拿着去送给老同事也有面子啊，不过还真有点舍不得送了。


    老师：其实，好的产品很多，但不是每件产品都能让客户感受到价值的。


    你的东西有没有价值，不是你说了算，是客户说了算，东西再好，人家感受不到的话还等于零。


    客户：那我马上就执行五壶茶的策略，感觉您给的建议很容易操作，马上就能用。


    老师：千万不要往大街上面发，每个人都能得到的东西也就不是好东西了！


    客户：老师，我明白，我现在就是先把客流量做上来，哪怕没有销售额，天天有人不断坐在这里喝茶也行啊！


    老师：如果都不买你的东西，这个方案就没有意义了，我们毕竟还是为了销售茶叶，你有什么好的方案吗？


    客户：老师，我现在没有什么好的办法，最多给他们便宜点，我相信来的人多了，总会有人买的。


    老师：你现在是怎么收费的？


    客户：我们的收费是两部分组成，茶钱和房间费。


    老师：具体怎么收的？


    客户：房间费 60 元每小时，茶叶任选，比如，你要了一壶 98 元的茶，在这里坐上 2 个小时，那么，我们的收费就是 98+60*2=218 元。


    老师：咳，我建议你，每个来的人只要买你的茶叶就送一张卡，具体买多少送多少的门槛，你依照实际情况把握。思路是，买 200 元的茶叶送1000 元在你店里消费的充值卡。


    客户：然后呢？


    老师：然后你规定一下，卡里送的消费金额，可以抵现金使用，但是只能付一项费用，要么付房费，茶钱另外付现金，要么付茶钱，房费另外付现金。这样，你的卡送得就有价值了，并能保证每次过来都有现金收入。


    客户：太妙了！老师你是怎么想到的啊，我觉得这样的话，应该会有很多人会为了这张卡买茶叶，而且就算是他不来，这张卡送人也是很有面子的。


    本咨询案的“五壶茶”就是打造的一个前端体验类引流产品。


    ## 第 08 节 打造关联切入类引流产品


    很多生意的主营业务比较单一，而且属于一次性消费（或很长周期才会更换），像这类类型的产品，比如，热水器、净水机、沙发、摩托车等，并不好寻找前端体验类引流产品。所以，最好的方式是打造关联性引流产品来吸引客户，一旦获得跟目标客户接触的机会，便进行沟通跟进，销售主营产品。


    下面通过具体的案例让你理解关联切入类引流产品的操作方法。


    ## 案例：净水机大规模引流与自动化成交方案


    由于水质污染，导致家居饮用水越来越不安全，为此净水机就成了健康饮用的最佳解决方案，固然，在中国市场掀起了净水机的销售狂潮，为了抢占这块肥肉，各种品牌的净水机蜂拥而至。


    可惜的是，虽然市场前景无限，但由于大众对饮用水安全意识缺乏及净水机经销商的营销能力低下，导致市场的青睐程度并没有想象的那么美好，不管是推广还是销售都遇到了巨大


    的阻力。


    要想破局，必须解决两大难题。第一、如何吸引精准客户；第二、如何教育客户购买。想吸引精准客户，必须打造有诱惑力的引流产品，并找到目标客户人群聚集的鱼塘合作。


    净水机不能像其他服务一样切割赠送，所以就得找到相关联的产品做前端引流。


    与净水机相关联的产品是什么呢？“水质过滤器”是目前公认最好的选择，虽然它不能直接对各种有害矿物质进行净化，但对水中的杂质过滤还是非常有效果的，成本 50 元，市场标价可以是
    200 元。


    假如一台净水机能够赚 1500 元，按照买客户思维的单笔利润换算，以 50 元的成本获取 1 个精准客户，接触 30 个成交 1 个就不赔钱，成交 2 个就赚了，其实这样的成交比例是很易做到的。


    到底什么人群才是最精准的呢？


    经济条件不能太差，并受过教育，有健康意识的人，医生、高级教师、生意做得稍微大一点的老板等都是比较优质的客户。


    这些人都聚集在哪里呢？

    '
