    如果站在整个行业的角度来看，就会具备行业领袖的眼光；如果站在整个产业、上下游垂直整合、平行关联的角度来看，就具备了产业先驱的高度和风格。


    没有谁能独善其身的，大部分人都不不得不活在圈子里，很难看出来在整个行业里自己处在哪个链条，哪个环节的资金最多。有时候产品不赚钱，但是配套关联的产品是盈利的，


    当你跳出自己的企业，能站在整个产业的高度，你就能看到更宏观的关联产业，你会发现你的布局是否合理。


