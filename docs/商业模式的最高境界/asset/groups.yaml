    定价过高是否会降低客户消费频次、影响客户消费欲望；


    定价过低是否会影响利润，这两方面需要综合考虑。


    ## 3、客户是否会持续消费


    商业模式从本质上讲就是如何从客户身上挣钱，如果想挣钱最快，要么客户数扩展速度最快，要么客户平均贡献额最高，两者兼备当然最佳。


    但从商业实践的角度来看，真正起到关键作用的实际上是客户数量的扩展速度。因为如果不可大规模复制，你从单一客户身上即使获得再高的收入也是枉然。


    道理显而易见，能够大规模迅速扩展客户群的商业模式收入会持续高增长。要远超客户数量增长缓慢但平均客户收入很高的商业模式。


    因此新增客户速度是否快，客户能否快速大规模复制，是衡量商业模式能否迅速做大规模最关键的因素。


    ### 壁垒


    拥有了好的定位、大的市场、收入快速扩展后，是否就算万事大吉呢？


    当然不是！如果你具备了上述三点，但却发现有很高的行业壁垒无法攻破，那也只能黄梁一梦、望洋兴叹；或者谁都可以进入这个让人摩拳擦掌、前途无限的市场，那凭什么你会取得成功呢？


    所以我们一定要扪心自问：为什么是你而不是别人？


    一厢情愿的投入是无法取得成功的,还必须确保目标市场更接受我们而不是别人。换句话说：不仅我们要特别钟情于目标客户，目标客户也要特别青睐我们。


    好的商业模式一定要和自身的优势紧密结合。最好是自己独有的优势，这就等于构筑了最好的竞争壁垒。


    关于进入壁垒，我们要考虑五个方面的问题：


    - 1、进入该行业本身是否有壁垒？比如法律、技术、专利、资质或者垄断资源，不能有高的进入壁垒，否则执行起来就会有很大困难。

    - 2、是否存在产业链的制约因素？如何解决？

    - 3、如何利用自身优势来构筑竞争壁垒？

    - 4、如何建立产业竞合关系？

    - 5、如何构筑价值链？


    总之，自己进入时壁垒要低，进入后要能建立起高的壁垒，让竞争者难以进入。这是考虑壁垒因素的重点所在。很多企业之所以发展到一定阶段就出现问题，就是没有考虑到后进者的壁垒，这一很容易被人赶超。


    ## 风险


    设计商业模式的最后一个环节，就是要综合评估可能面临的各种风险。在评估风险时，需要考虑五个方面：


    - 1、是否存在政策及法律风险？

    - 2、是否存在行业监管风险？

    - 3、是否存在行业竞争风险？


    如果行业竞争过于激烈，这显然不适合进入。特别值得注意的是，按照你的定位，目标市场不能够有已经取得明显领先优势的竞争对手存在。


    换句话说，你应当设计最大的可能性使自己成为所要进入领域的 NO.1。如果从一开始就要采取追赶策略，而且还很难确保成为第一，那么最好的决策就是放弃这个目标定位，重新确立新的细分市场。


    ## 4、是否有潜在的替代品威胁？


    ## 5、是否已经存在价值链龙头？


    这是考虑商业模式所面临的风险时最需要注意的一点。你准备进入的行业不能有产业链主存在，即不能有价值链的龙头存在。因为优秀的商业模式应当具有发展成为龙头和链主的最大可能性，而不是在一开始发展就受制于别人。


    顺便说一句，与传统的认识不同，我们评估风险的目的并不是回避所有风险。事实上，几乎所有重大的商业成功无不是冒着很多不确定的高风险取得的。正所谓：“不入虎穴、焉得虎子”，与机会伴随而来的必然是相应的风险。


    正因为如此，我们说评估风险的最终目标是要识别出所有可能的风险、制定相应的应对策略，使得风险都能够可控和被管理。


    换句话说，我们要通过有效地利用风险、规划风险和管理风险来创造商业奇迹。


    总体上说，设计商业模式需要考虑的这五个方面，可以概括为“定位要准，市场要大，扩张要快，壁垒要高，风险要低”。


    一个优秀的商业模式需要考虑的方面有很多，但是这五条


    应该是 最基本和最重要的。在实践中特别值得注意的一点就是，一个优秀的商业模式既不是一蹴而就的，在实践中也不是一成不变的。


    一方面，一个优秀的商业模式需要在实践中不断的尝试、不断的修正甚至是不断地试错而会变得日益完美；另一方面，一个已经十分完美成熟的商业模式也许会随着产业环境和竞争态势发生了变化而显得不再适应。


    因此，这就需要进行新的设计和调整，在本书后面的内容当中，将会围绕商业模式的组成以及设计，进行详细的分解和模拟落地。


    ## 第03节 商业模式的4个组成要素


    商业模式由四个密切相关的要素构成，这四个要素相互作用时能够创造价值并传递价值，目前来说最重要的是创造价值。


    ### 客户价值主张（Customer Value Proposition, CVP）


    凡是成功的公司都能够找到某种为客户创造价值的方法，即帮助客户完成某项重要工作的方法。


    在此，“工作”的含义是旨在特定情境下需要解决的一个根本性问题。只要了解了工作的含义以及工作的各个维度（包括如何完成工作的整个过程），我们就可以为客户设计解决方案了。


    客户工作的重要性越高，客户对现有方案的满意度越低，你的解决方案比其他可选方案越好（也包括价格越低），你的客户价值主张就越是卓越。


    ### 赢利模式（Profit Formula）


    赢利模式指公司如何即为客户提供价值、有为自己创造价值的详细计划，包括以下构成要素：


    收益模式：价格 x 数量


    成本结构：直接成本、间接成本、规模效益。成本结构主要取决于商业模式所需要的关键资源的成本。


    利润模式：在已知预期数量和成本结构的情况下，为实现预期利润所要求每笔交易贡献的收益。


    利用资源的速度：为了实现预期营业收入和利润，需要提高库存周转率、应收账款/应付账款周转率、固定资产及其他资产的周转率，并且还要从总体上考虑如何利用好资源。


    ### 关键资源（Key Resources）


    关键资源（又称资产）是指向目标客户群体传递价值主张所需的人员、技术、产品、厂房、设备和品牌。我们需要关注的是那些可以为客户和公司创造价值的关键要素，以及这些要素间的相互作用方式。而不是关注那些无法创造出差异化竞争优势的一般资源。


    ### 关键流程（Key Processes）


    成功企业都有一系列的运营流程和管理流程，以确保其价值传递方式具备可重复性和扩展性，这些流程包括培训、产品研发、生产、预算、规划、销售和服务等日常周期性工作。此外，关键流程还包括公司的规则、绩效指标和规范等。


    上述四个要素是每个企业的构成要素。客户价值主张和盈利模式分别明确了客户价值和公司价值，关键资源和关键流程则描述了如何实现客户价值和公司价值。


    四个要素相互影响，任何一个发生重大变化，都会对其他部分和整体产生影响。企业要想做得成功，需要设立一个相对稳定的体系，将这些要素以持续一致、互为补充的方式联系在一起。


    ## 第 04 节 案例：苹果的商业模式


    我们知道乔布斯曾因与大多数管理人员经营理念不合而在 1985 被董事会决议撤销了经营大权。而苹果公司也在此后陷入经营困局。1996 年乔布斯重新返回苹果公司，拯救苹果于危难之中。


    在此后,由他主导先后推出 iMac、OS X操作系统、iTunes、iPod，以及最为人熟知的产品 iPhone。


    就拿新世纪初推出了 iPod-iTunes 组合为例。这是一场便携式娱乐设备的革命，它创造了一个新市场，并使苹果公司成功转型。


    在短短三年内，iPod-iTunes 组合为苹果公司创收近 100 亿美 元，几乎达到公司当时总收入的一半。苹果公司的总市值一路飘升，2003 年年初为 10
    亿美 元左右，而到 2007 年年末已超过 1500 亿美 元。


    苹果公司的成功有目共睹，但很多人却不知道，最先将数字音乐播放器推向市场的并不是苹果公司。1998 年，一家名为“钻石多媒体”（Diamond Multimedia）的公司推出
    MP3 随身听 Rio。2000 另一家叫 Best Data 的公司又推出 Cabo 64。


    这两款产品均性能优良，既可随身携带，又新颖时尚。可 是，最后获得巨大成功的是 iPod 而不是它们呢？


    这是因为苹果公司确有过人之处，它所做的不仅仅是为了 新技术提供时尚的设计，还有把新技术与卓越的商业模式结合 了起来。它让数字音乐下载变得更简单易行。


    苹果公司开创先河，打造了一个新的商业模式将硬件、软件和服务融为一体。这种模式对价值进行了全新的定义，并为客户提供了前所未有的便利。


    正基于苹果公司不断地创新，目前它的市值以超过 1 万亿美元成为市值全球第一的公司。


    所以，商业模式创新可以改变整个行业格局，让价值数百亿美元的市场重新洗牌。


    ## 第05节 顶层设计的定义


    > “理论总是灰色的，而实践之树常青”

    > ——恩格斯


    “顶层设计”一词起源于工程学，而后延伸至政府规划和企业战略等领域，应用领域不断扩大。其本义是统筹考虑项目各层次和各要素，追根溯源，统揽全局，在最高层次上追求问题的解决之道。


    顶层设计是运用系统论的方法，从全局的角度，对某项任务或者某个项目的各方面、各层次、各要素统筹规划，以集中有效资源，高效快捷地实现目标。


    简单来说，顶层设计就是布局，就是系统规划，就是为了企业的长远发展，寻找一套可操作的系统性解决方案的过程。


    我们都知道田忌赛马的故事，虽然田忌整体资源都比对方齐威王弱，但通过合理统筹，高效配置资源，用自己的下等马对对方的上等马，输一局；用自己的中等马对对方的下等马，赢一局，扳平；用自己的上等马对对方的中等马，赢一局，取
    得决定性的胜利。


    这个整合配置资源的过程，就是“顶层设计”。


    与顶层设计对应的是“摸着石头过河”。“摸着石头过河”是有问题就着手解决问题，强调务实有效，在业务方面表现出商业质感，体现出魄力；在管理方面表现为管理智慧，体现为经验。“摸着石头过河”是一种探索精神，在改革开放初期这种精神成就了一批敢闯敢拼的企业家。


    “摸着石头过河”靠的是企业家的胆识、魄力和商业质感，而顶层设计靠的是企业家的谋划能力、布局能力和系统思考能力。


    随着需求复杂、竞争加剧，供需逆转、增速放缓等外部因素影响，企业生存环境已经进入深水区，“摸着石头过河”风险重重，过去依靠招式制胜的时代已经一去不复返了。要想打开局面，持续成功，企业就要依靠顶层设计进行系统作战。


    顶层设计作为企业最高的发展纲领，作为事业大厦的设计蓝图，具有以下两个特点：


    ### 严密的逻辑性


    系统性思维讲究严密的逻辑性。所以，顶层设计不但要清晰描述企业的“终极目标”是什么，更要明确回答“获得成功” 是为什么。不但要有合理的经营理念与愿景，更要有具体可操作的方法。


    换句话说，我们不光要有顶天立地的梦想，更要有脚踏实地的计划。


    我们要按照发展愿景和战略目标，有针对性地做出系统完整、步骤清晰、分工明确的实施计划，并按需要组织人力、物力、财力等资源条件配套安排实施、管理、监督、检验，井然有序，环环相扣，丝毫不乱。


    ### 明确的可操作性


    顶层设计必须从实际出发，再回到实际中来。所有的设计方案及每一个方案的所有措施，都要能归结到可执行的要素“5W2H”。


    即：明确所要执行的是什么任务 (what)、为什么要做 (why)、何时开始 (when)、从哪里入手 (where)、由何人负责 (who)、如何去做 (how)
    及要花多少时间和资源 (how much)，以此确保执行者能够充分把握战略落地的要领，保证执行不出偏差。同时，还要充分估计各种执行风险，做好相应的预案准备。


    此外，因为顶层设计所针对的是系统工程，所以从设计构想到评议决策，再到管理、执行、监督、检验，整个过程是一个群策群力的合作过程，需要高层管理者到基层员工的全员式参与。


    同时，又由于顶层设计具有很突出的重要性和风险性，所以，对企业决策、管理层和执行层都提出了相当高的要求。


    大家把这句话记下来：


    顶层设计就是运用缜密思维架构和实践体系把平庸企业变成卓越企业的系统规划。


    ## 第08节 顶层设计的核心


    如果说商业模式是一套方法论体系，那么企业顶层设计就是实现“赢”的关键。


    顶层设计应站在企业内外环境的角度思考企业经营。它包含企业家、方法论和核心团队三个支点。这其中最为关键的核心也就是企业家。


    亚里士多德在《形而上学》中说：“一支军队的能率，部分决定于秩序，部分决定于将军，但主要决定于后者，因为将军并不依赖于秩序，而秩序却依赖于将军”


    企业家经营企业的选择，决定了企业家的历史使命和重要性。


    你们知道，现在中国哪家企业在全球范围内攻城略地，让美国都胆战心惊吗？


    没错，是华为。它拥有全球最多的 5G 专利，它在国际的营收一直超过国内营收，它目标在 2020 年手机销售额超越三星成为全球第一。


    华为是中国的骄傲，华为真正影响着世界。


    大家知道华为没有上市，2018 年，《财富》杂志公布了世界 500 强，华为榜上有名，排在第 72 位，成为中国民营企业中排名最靠前的科技企业，也是世界 500
    强中唯一没有上市的公司。


    世界 500 强的最后一名是老牌通讯设备企业爱立信。而华为的竞争对手高通第一次被挤出榜单，没有进入世界 500 强的名单。


    这一切离不开华为背后的掌舵人：任正非。


    任正非身上有什么企业家精神值得我们学习呢？


    ### 一、远见


    任正非 43 岁才开始创业，不惑之年始见春，一手把山寨公司变成了震惊世界的科技王国，同时创立了开中国企业先河的企业治理大法。在判断企业市场时又极具预见性，在企业繁花似锦的时候却说这很可能是企业的“寒冬”。


    ### 二、忧患意识


    任正非的忧患意识众人皆知，他说：“我天天思考的都是失败，对成功视而不见，也没有什么荣誉感、自豪感，而是危机感。”而正是这种忧患意识，逼迫任正非不断思考，推动华
    为不断前行。


    ### 三、淡泊名利


    在当今这个物欲很重的名利场中，任正非在华为的股份很少，却让员工大量持股，这在业内是很少见的。特别是他深居简出，个人出行，一个人拉着行李箱去排队坐车，没有一个助手，没有一个保镖。能放下自己拿起华为是相当难能可贵。


    ### 四、远大抱负


    1994 年，任正非在员工内部讲话说到：十年后，全球通信行业三分天下，华为占其一。如今我们知道，华为确实做到了，它让世人都惊叹其发展速度。


    ### 五、专注


    说起华为的成功，正是因为华为坚定不移 28 年只对准通信领域这个“城墙口”冲锋。华为成长起来后，坚持只做一件事，在一个方面做大。


    ### 六、开放


    “师夷长技以制夷”。任正非的华为从一开始创建就呈全开放的心态。在与西方公司的竞争中，华为学会了竞争，学会了技术与管理的进步。


    在战场上,军人的使命是捍卫国家主权的尊严;在市场上，企业家的使命是捍卫企业的市场地位。


    《下一个倒下的会不会是华为》一书作者评价道：“中国历来都不缺乏政治家、企业家，但从来都缺乏真正的商业思想家——在当代中国，任正非算是一个。”


    商场如战场，企业家就是领军人物，希望各位企业家能够带领自己的企业在市场上赢得市场的胜利。


    这里篇幅有限，就讲到这里。在一诺老师的课堂上，花了几个小时重点讲述了企业家应该有的格局、信念、使命、愿景和价值观等。上过一诺老师课程就自然就会明白。


    ## 第07节 案例：国家的顶层设计


    今年（2019年8月22日）将是邓小平同志诞辰115周年纪念日。作为我国社会主义改革开放和现代化建设的总设计师，他以胆识胸襟，推动国家民族的前行，将社会主义中国带到一个前所未有的境界。


    可以说，没有他，中国的经济腾飞步伐至少要晚十几年，甚至几十年。今天，他的理想和14亿人的梦想，仍在路上。


    回顾《邓小平文选》，他谆谆嘱附：“要坚持党的十一届三中全会以来的路线、方针、政策，关键是坚持‘一个中心、两个基本点’。不坚持社会主义，不改革开放，不发展经济，不改善人民生活，只能是死路一条。基本路线要管一百年，动摇不得。”


    一百年不动摇啊，这是国家领导人对整个国家的顶层设计。这些话高瞻仰嘱，分量够重了，永远发人深省。


    解放思想求实事求是。


    他是解放思想的伟大旗手。


    解放思想，放下包袱，放大格局，装满爱装满正能量，你的模式才会无比的强大，信念会无比的坚定。


    邓小平说：“打破习惯势力和主观偏见的约束，研究新情况解决新问题。”


    我们现在能够在大街上牵手拥抱，要感谢我们的小平同志解放了思想。


    我们伟大的小平是我的偶像。


    邓小平对股市有个精辟的论述：“证券、股市，这些东西究竟好不好，有没有危险，是不是资本主义的东西，社会主义能不能用？允许看，但要坚决地试。看对了，搞一两年对了，放开；错了，纠正，关了就是了。关，也可以快关，也可以慢关，也可以留一点尾巴。怕什么，坚持这种态度就不要紧，就不会犯大错误。”


    各位，你在做的时候这个模式到底行不行，干了再说，干一干还可以改吗？


    小平同志说“更重要的是政权在我们手里。”


    最重要的是做顶层设计的人是自己。


    成功是一个不断试错的过程。


    任何一项伟大的事业是试错的过程，爱迪生发明电灯都试了一千多次。


    在试错的时候领导人要给属下一个信心和决心，让他们干，给他们胆量放开去做。


    1979 年他在中国的南海边画了一个圈，深圳诞生了。人们满心欢喜地迎接着新深圳的诞生，寄托着希望，寄托着未来。


    但是建设一个新的庞大的经济体，一个崭新的城市是需要人力物力财力的一很多创业的人都遇到同样的问题，没有人没有物没有钱。


    小平同志对广东省的领导人习仲勋对他说，中央没有钱可以给一些政策，你们自己去搞杀出一条血路来。


    小平同志最后证明：深圳的发展和经验证明建立特区的政策是正确的。


    这一部分人先富起来了，全国开始大干。事实也确实是，广东地区发展之后一看，这人民日子也过好了，也没有反动也是吃饱了肚子，也没有资本主义。


    后来中国的经济就这样腾飞了。


    一个国家要强大，一定要有一个强大的模式。很多国家只能在国际中充当小虾米的角色，而美国一个 300 多年历史的国家却经过两次世界大战之后奠定了世界霸主的地位，为什么？


    因为很多国家的模式就错了，一开始就注定做不到。


    基于国情，我们国家是走中国特色的社会主义发展的道路，这一模式奠定了中国的强国之路基础。


    大如国家都需要顶层设计，所以，企业也需要顶层设计。


    ## 第08节 商业模式·顶层设计的价值


    资产是过去的积累，价值是未来的发展，利润是一次性的价值，价值是可持续的利润；定价权的高低决定了价值的高低。


    可持续发展的企业才是好企业，与企业的资产、规模没有关系。所以，企业离不开商业模式。顶层设计。


    传统企业▶▶利润为 1；


    商业模式的力量▶▶利润增长 10 倍；


    资本的力量▶▶企业价值年利润 15-30 倍；


    营销/制造▶▶属于常规武器，坦克/大炮；


    商业模式/顶层设计▶▶属于核武器级别，原子弹。


    世界上为什么有这么多才华横溢的失败者，为什么很多才 能平平的人却取得了辉煌成就？


    很多产品质量上乘的企业都没有生存下来或经营惨淡，而一些产品或服务质量较次的企业却做得很大，如鱼得水，甚至成了行业老大。


    不要怪老天爷不公平，首先要改变自己的观念；也不要怨天尤人，正确的战略布局才是关键。

