    搜索引擎。


    首先，你可以参考其他的畅销产品。要知道所有的创新都是新生于旧的，彻底原创的很少。在旧的架构体系里加上自己原创的东西，就是创新。可以把世界上销量过百亿的产品找出来，看他们的畅销主题是什么。同样的主题看你用在新的载体上，就是新产品。


    其次，可以参考搜索引擎互联网给我们一个全方位、多角度搜索信息的工具，大数据出来了，像百度指数、百度风云榜、谷歌趋势这些工具，在上面用关键词检索就可以查看哪些关键词搜索量大。


    这叫搜索心理学，每个关键词背后都有很多人搜索。


    不需要闭门造车，自己凭空想概念。放眼望去，那些销量过几十亿上百亿的产品，它们本身就已经畅销了，换句话说它们的概念和功能已经被市场检验过，被大众认可了。直接拿来用就好了，而且还省去了新概念新功能的教育成本。


    只要把这些畅销的概念和功能，从这些畅销的产品身上提取下来，放到另外一个载体上，就再造了一个新品类，成为了新的第一名。


    例如：减肥茶在市场上卖得好，你可以把减肥的概念和功能放在其他载体上，做成减肥药、减肥水、减肥衣、减肥鞋等，这个你就是新的第一名。


    此外，还可以把多个畅销的概念和功能，集成到一个载体上，做出一个超级畅销的新产品。


    就好像苹果手机，在一部智能手机里，集成了多个功能：普通手机接打电话收发短信的功能、游戏机的功能、电子书的功能、上网的功能、摄像机的功能、照相机的功能、MP3播放器的功能等，苹果手机集众家所长，集合了当时众多畅销产品的核心功能，结果开创了智能手机的时代，一夜成名，红遍全球。


    不止如此，你还可以去网络上搜集很多热点词汇和畅销概念，这些热词的背后，都意味着一个庞大的市场。你可以去百度指数、百度风云榜、谷歌趋势这类应用工具上搜索，看看有哪些热词，然后根据热词来研发产品。


    例如你发现“催眠”这个热词有3亿人在搜索，同时“减肥”这个词也有搜索，那么你可以出一个新品类的产品叫“催眠减肥”，你就是这个领域的第一名！


    你一刀下去，就切中了6亿人关注的市场。而懂减肥的不一定懂催眠，懂催眠的不一定懂减肥，通过交叉定位，你一出道就是老大，别人不懂只能问你。


    在包装开发的时候，可以参考“广阔、畅销、高价值”的原则。刚才谈到了广阔、畅销，那么什么是高价值？


    高价值就是带给用户的价值要高，就好像同样是治病，治疗癌症和感冒的价值与收费肯定不同。你把一个人感冒治好，可以收点小钱，但是如果你把一个快死的癌症病人治好了，收再多钱病人也愿意。


    记住：能解决小问题，可以收小钱；能解决大问题，可以收大钱；能解决任何人都解决不了的大问题，那就你说了算！


    当别人还在为了蝇头小利忙碌不停时，你完全可以通过经营暴利产品轻松获利。


    最简单的方法就是按照关键词点击广告，每个关键词背后都是一个市场，每个市场都是一种暴利的存在。


    赚一元和赚一百元，花的时间精力都是一样的，但是结果却相差100倍。既然付出的时间精力一样多，为什么不选择赚钱多的那个产品？


    ## 百度搜索示例：


    ## 第 1 步：确定你吸粉市场的核心关键词


    举例：假设你确定的细分市场是孩子的近视眼治疗，那么


    近视眼、近视治疗、近视眼镜，这些就是核心关键词。


    ## 第 2 步：打开百度，输入刚才找到的核心关键词


    如果有多个关键词，就一个一个来，看下搜索出来的结果，


    关注做竞价推广的都有哪些产品。


    ## 第 3 步：记录竞价排名的网站


    做竞价排名的网站所销售的，就是你要做的细分市场的相关产品，也就是未来你可能要操作的产品。那么，用表格把这些产品以及相关信息记录下来，例如：网址、电话、产品名称、卖点、售价、竞价中的排名，并记录下当前的日**。


    ## 第 4 步：跟踪做竞价排名的网站


    10天后，输入同样的核心关键词，看搜索出来的结果，关注做竞价排名的网站，你会惊奇地发现，这次的结果，和前10天会有很大的不同。10天前做竞价的网站中有些消失了有些还在但是排名会有变化。那么，这些存留下继续做竞价的网站，就是你要学习的榜样。


    ## 第 5 步：分析判断选择产品


    找到了10天持续做竞价的网站，锁定了上面的产品，你需要分析这个产品，是否值得做。如何判断呢？最好的办法，就是自己试用。如果不具备试用条件，可以通过其他途径调查。比如把产品名放到百度搜索，或者百度知道搜索下，看看大家的评价，如果负面太多，就要谨慎了。


    ## 第 6 步：找货源


    在互联网上，如何找货呢？

    百度、阿里巴巴、淘宝，上面基本上都能找到。


    以上只是一小部分策略，如果你学过《猪买单》课程你会领悟其中更多的精髓。


    ## 第04节 产品扩展模式


    各位企业家要学会通过打造极致爆款单品和终生价值平台来轻松赚大钱。


    ### 极致爆款单品


    几乎每个伟大的企业，都要自己的明星产品，也就是招牌菜。麦当劳有汉堡，肯德基有炸鸡，永和有豆浆，星巴克有咖啡，这些企业不一定只有一款产品，但一定有一个极致爆款的单品：卖点聚焦、个性鲜明、价值独到。


    还有些伟大的企业，只用一个单品打天下，就可以帮助成就雄图霸业：可口可乐、百事可乐、脑白金、王老吉、小米手机。


    > 《孙子兵法》云：十则围之，五则攻之，倍则战之，敌则分之，少则能守之，不则能避之。


    也就是说，当我们有十倍于敌人的兵力就包围敌人，五倍于敌人的兵力就进攻敌人，一倍于敌人就进行战斗，兵力与敌人势均力敌就分散敌人，兵力少于敌人就进行防守，兵力比敌人的兵力差就避免作战。


    毛泽东和蒋介石作战，在战略上是以一打十，在战术上是以十打一。尽管军队人数比国民党人数少太多，但是集中优势兵力，分面击之，各个击破，最后取得胜利。这就是聚焦的威力！


    战争如此，品牌也是如此。


    市场是广阔的，而一个企业的资源是有限的，你不能把自己有限的人力、物力、财力、精力到处乱撒，拉长战线，齐头并进，什么都想做，这样终将一事无成。


    弱水三千只取一瓢，城有所不攻。你只能聚焦在自己最擅长、最热爱、最有价值、最能帮助别人的部分，集中精力，反复打磨，好钢用在刀刃上，把这个部分变成你的绝活，成为你的主题，才能缔造经典。


    如何才能打造出极致爆款的单品呢？


    首先要找到自己的位置，要明白只做什么和不做什么。做什么才有将来，不做什么将来才更加广阔。有所为有所不为，最后才能大有作为。


    确切地说，要围绕3点：自己的优势、用户的需求、对手的空缺。这便是自己的位置所在。


    ### 终生价值平台


    有两个土匪分别在街上打劫受害者。某日，甲土匪打劫了一个受害者，发现对方钱包里有1000元现金，于是甲土匪当天营业额1000元。而乙土匪打劫了一个受害者，发现对方钱包里只有500元现金，于是乙土匪当天营业额只有500元。


    但是乙土匪发现钱包里还有一张身份证、一张结婚证、一张驾驶证和一枚结婚的戒指，于是把这些东西拿到当铺抵押换了500元现金，然后打电话告诉受害人：如果想赎回这些东西，汇款2000元到我的账户来，于是受害人汇款给乙土匪2000元，换回一张当铺的当票。


    以上资源配置、资产整合的整个过程中，乙土匪一共实现了3000元的营业额，是甲土匪的3倍。这就是用户思维，这就是用户终身价值的思维。


    通过这种思维模式，你可以用最少换最多，从而远远超越你的竞争对手。


    绝大多数商家是保守的，是短视的，他们的眼光只停留在自己一亩三分地上，只停留在眼前这一笔生意上，只盯着今天的钱，因为缺乏用户终身价值的思维，他们始终赚的是小钱。


    如果你开始转换思维，你会发现，用户这一生的价值有多么庞大：用户随着年龄增长，随着生活方式的变迁，随着交际模式的改变，其一生会产生很多问题、痛苦、需求和梦想，而这些都是商机所在。


    如果你能和用户建立一种终身的关系，你的收益将从一个点，放大成一条线，一个面！


    用户浑身都是宝，抓住不能让他跑。用户的吃喝玩乐睡、衣食住行用，生活 Methodology 的方方面面都需要消费，如果客户只消费一次，那就太可惜了。相反，你应该建立一个为用户终生贡献价值的平台，一个能黏住用户并建立终生关系的沟通平台。


    腾讯公司用一款 QQ 打天下，积攒了8亿月度活跃用户，是世界人口第三大“国家”，数量仅次于中国和印度。


    同时腾讯公司建立了一个持续挖掘用户终身价值的平台，先后上马了众多项目来变现用户价值：QQ邮箱、企业QQ、拍拍、腾讯门户网站、游戏、搜索、微信等，这些项目让腾讯公司赚得盆满钵满。


    前面我们也提到过苹果公司。它的硬件(手机、电脑)售出后，软件又可以持续赚钱。众所周知，苹果 iPhone 非常成功，


    在全球风靡。


    不过，对苹果来说真正的杀手应用其实是其软件商店商业模式，毕竟这是增值服务的真正源泉，它打破了以往电信商垄断的手机软件市场，让全世界的消费者都可以透过同一个集市购买、下载
    APP，也让任何软件开发者都可以做到全世界人的生意。


    这造就了 Angry Birds 这个来自北欧小国芬兰的品牌，也让像 Lightning Fighter、Burn The Corn、Cytus、Gun Strike
    等台湾制作的游戏，第一次有机会快速在全世界走红。


    所以苹果不只是一家产品公司，他们的策略其实是用极致爆款的单品去建立一条条通路和管理。


    管道建成后，通上水就是自来水公司，通上电就是国家电网，通上油就是石油公司。


    区区一台 iPhone 手机虽然拥有一定的利润，但那是一锤子买卖，而苹果软件商店的出现是一种细水长流的积累。就如同 iPod 给苹果攫动的利润很大一部分是因为
    iTunes 模式的成功一样，在手机市场，苹果在继续演绎着这种商业模式。


    亲爱的学员们，你看懂了他们的赚钱模式了吗？


    把这句话记下来：


    超级赚钱模式=极致爆款单品+终生价值平台


    这就是他们轻松赚大钱的秘密武器，相信你也可以做到！


    ## 第 05 节 创造让人尖叫的好产品


    到很小的鱼塘里，钓最饥饿的鱼


    当你决定进入一个市场开始赚钱的时候，摆在你面前很重要的一个问题就是卖什么。毕竟，不是所有的产品都一样赚钱。当然，你也不能什么都做，一只能生蛋、长着羊毛、又产奶的猪，还想要潜水和飞翔，是不太可能的事情。


    利润的获取在于满足的需求，高额利润的获取在于满足顾客迫切的需求。尤其是当顾客迫切的需求只有你能满足的时候，你就有了定高价获取暴利的主动权。


    很多人盲目的以为自己只要有一个好产品，然后就可以找顾客进行销售了。这简直是天大的错误，产品并不值钱。它们虽然也很重要，但是对于营销的成功来讲远远比不上找到一个销售市场重要。


    我要说的是：一个好的产品未必可以找到好的市场。但是，如果先找到很好的销售市场，再找到适合这个市场的商品来填充这个市场，那么你就可以稳稳当当地赚钱了。


    如何找到一个好的市场呢？


    答案很简单：看人们想要什么！


    你知道人们对什么抱怨最多吗？你知道人们对什么渴望最大吗？你知道人们对什么趋之若鹜的追逐，又对什么避之如洪水猛兽吗？


    马上找张空白的纸张出来，在正面填上人们抱想最多的事、设法逃避的事。然后在背面填上人们渴望拥有的事，拼命追求的事。填得越多越好。


    好了，我们现在来数一数，你填写了多少？是不是有很多个市场被你给找出来了呢？


    现在，从中把你认为人们最肯为之花钱解决的市场找出来。举个例子，假设你今天卖药，你把别人的感冒治好了，你问别人收10万元，你猜别人会说什么？“太贵了，简直是抢劫啊，我就是不吃药，过几天也会好啊！”人们可能会这样回答你。


    但是如果你把别人的癌症治好了，收10万元，人们还会觉得贵吗？的确，生命是无价的，跟10万相比，还是活下来比较重要。


    你知道暴利项目开发的关键所在了吗？


    是的，太对了！那就是了解人们的快乐与痛苦，感知人们的烦恼和不快，明白人们的渴望和追求，从中找到人们最愿意为之花钱的，愿意花大价钱的，你就找到了超暴利的项目！


    通常我们在选择产品的时候，会把标准定在以下4个方面：


    ### 完全独立控制


    你需要对你正在销售的产品拥有完全的控制权。这意味着你不能购买那些广泛地出售给任何人的产品，你的产品必须是

    你能够独立掌控的。


    换句话说，如果你的产品顾客可以从任何别的渠道得到，他为什么要从你的手里买？也就是说，你要从源头上掌控产品。


    这是否听起来很不现实？需要巨额投资吗？一点也不需要，线下课上将向你展示如何在几乎没有任何投入的基础上，完全拥有独家经营的产品。


    ### 选择专业的目标市场


    这是最重要的“秘诀”之一。大多数人们认为拥有无拘无束的公众吸引力的产品将最可能迈向成功，但是，此观点仍然


    有不足的地方。


    请想一下，当公众成为你市场，需要有实质性的资源来和市场沟通。为了向公众营销，可能需要在很多昂贵的大众媒体上做广告。


    例如：在北京市发行量大的报纸上刊登一个不错的广告，一个版面要花掉你大概7-10万元。如果在电视上登广告，有时候2秒钟的时间就要花掉30万左右的广告费。


    当然，也鼓励你们应该以同样的方式选择你的首要“目标市场”。


    如果你喜欢钓鱼，应该成为热心钓鱼的人。如果你收藏邮票；你的目标市场应该是邮票爱好者。如果你已经成功销售保险，你的目标市场应该是保险销售人员。如果你是一个设计师，你的目标市场应该是其他设计师，如果你拥有一个赚钱的网站，你的目标市场应该是打算在网上赚钱的人们。


    你理解我的意思吗？在选择目标市场的时候，你应该思考你的过去和现在的职业。


    ### 聚焦特别的信息产品


    首先，信息产品可以是一本书、一本小册子、CD指南、报告、新闻通讯、录音带、DVD、讲座、网站、网上讲座、电子书、软件或者任何这些东西的结合体。要知道，在这个世界上没有其他任何行业比信息产品更加容易和成本更低。


    ### 可观的利润空间


    在这里，我建议你卖具有很大利润空间的高价信息产品，加价5-8倍是赚取利润绝对必不可少的要点。你可能认为你能通过出售廉价的物品来赚取更多钱，因为你会薄利多销，而事实并非如此！


    在一个专业市场，你仅仅能在一个合理的营销成本范围内说服一定比例的人。当你出售指南时，这类比例并不会因为低廉的价格面不断扩大。销售100元和1000元的产品几乎要花费同样的努力，但是利润却差别很大。


    还有，信息产品因为它最大的价值就是信息本身。人们由于地域上的不同，从而信息就产生了地域和时间上的相对滞后性。你就可以利用这种差异去整合各方面的信息资源从而将这些资源销售给别人。


    如果你知道核武器的制造方法，你可以把它拷贝在一张光盘上，然后有人可能愿意花费上亿美元的代价来购买这张光盘。


    是什么让几毛钱成本的光盘增值？没错，是里面的信息，人们不在乎你的成本是多少，他们真正 在意的是附加在上面的价值是什么，这才是关键。


    并且，它有其特定的消费群体，我们可以实现广告的精准投放而不至于四处撒网。


    阅读到此，相信各位也知道如何设计大卖产品了吧！确实，那么很多人可能会问，有产品了如何卖出去呢，如何建立自己的成交系统呢？


    由于版面有限，只能讲这么多。如果有上过一诺老师课程学员，这些就自然很是明白。


    ## 第九章


    ## 换算思维


    ## 第01节 快速引爆精准客流的核心原理


    有人气才会有财气，开门做生意的，谁都渴望门庭若市的场面，可惜的是，多数商家投入了大量的金钱、人力和物力，却依旧无法获得消费者的青睐。


    我曾经听一些老师教学员拓展顾客的N种方法，学完之后基本还是处于云里雾里的状态，有的事情理解起来太过复杂，只能说，他们没有抓住事物的本质。


    如果你要问我获取客户最快的方法是什么，我的回答只有一个字，那就是“买”！


    也就是说，客户不是宣传过来的，客户也不是拜访过来的，而是买回来的。


    “买客户思维”是获取客户最有效、最快的策略和手段，更是任何产品快速切入市场的法宝。


    记得去年年初，在深圳的一次分享交流会中，有一位策划界的大腕听了买客户思维之后，握着我的手说，“买客户思维”完全颠覆了传统低效率无法监控效果的营销拓客手段，必将成为所有生意人最有效开发客户的指导思想，也是我们策划人必


    须掌握的思维方式！


    虽然这位大腕的点评有些夸张，但我敢肯定，当你明白了如何买客户思维之后，从此经营任何生意都不会再缺客源。


    如果你是第一次听到“买客户”的概念，头脑中可能会产生一连串问号。客户真的可以买来吗？？？如何买？？？到哪里买？？？用什么方式买？？？


    本章接下来将带你透彻剖析三种买客户的思考与设计方式，相信足以启发你对买客户思维的深刻认识！


    ## 第 02 节 利用单笔销售利润设计引流方案


    原理：以单笔销售的毛利作为出发点，依照成交率计算出吸引目标客户的成本，并以此成本为参照，选择和打造获取目标客户进店的引流产品。


    什么意思呢？比如，每销售一套产品可以赚到1000元，那么以100元的成本吸引目标客户进店，10个人进店成交1个就不赔钱，成交2个就赚了。


    如果花50元的成本吸引一个目标客户进店，20个成交1个就不赔钱，成交2个就赚了，成交3个就赚大了。


    为了让你更直观的理解“利用单笔利润买客户”的思路，下面通过两个案例做进一步阐述。


    ### 案例：少儿英语点读机精准客流引爆方案


    销售少儿英语点读机的王总，因为客流受阻，遇到了前所未有的压力，通过找幼儿园合作销售，到大街上发宣传广告等各种手段用尽，依旧没有任何起色。


    后来通过不到30分钟的咨询，轻松帮他解决的了拓展客


    源的难题，并实现了自动化引流。到底是如何做到的呢？


    其实，利用单笔利润为指导的买客户思维，就能帮他解决


    问题，下面还原当时的咨询过程。


    王总：老师，您好，我是做点读机的，非常感谢您能抽空给我30分钟时间讲解。


    老师：不客气，请先介绍一下你的项目吧！


    王总：我代理了一款点读机，我朋友是厂家，直接从他那里拿货，利润相对比较高，而且可以先拿货，卖了再给钱，现在我遇到的问题就是不知道如何扩大销量。


    老师：现在市面上有许多点读机，你的点读机对比其他同类产品而言，有什么优势？也就是说，别人在为什么要选择你？


    王总：是这样的，我们这款点读机与其他不同的是，我们的定位比较精准，只针对儿童提供，并且专注于英语学习，现在我们这里还没有同类产品，并且，我们全套教材有9本，基本一套就能让孩子学习好几年，对于家长来说是非常划算的，现在报一个英语学习班一年要好几万，而我们为了打开市场，所以促销期间价格比较低，只销售540块钱一台。


    老师：非常好，那现在销售情况怎么样，家长的接受程度如何？


    王总：销售业绩不好，但是只要是我们沟通过的家长，基本上没有不动心掏钱的。


    老师：也就是说，你们的成交是没有问题的，关键是别人不知道你的产品，客流太少，对吗？


    王总：是的，我们现在的成交率基本上做到了70%，因为产品确实很好，并且价格也便宜，只要稍微跟家长讲解，都很容易接受。


    老师：既然是客流问题，那你们平时都使用了哪些方式吸引目标客户呢？


    王总：一开始的时候，我们就是大量的发宣传单，但效果非常差，后来参加了您商业模式的课程后，我知道了，必须找到精准的客户渠道也就是鱼塘合作，所以，我们开始找鱼塘对接了。


    老师：找鱼塘对接的结果怎么样？遇到了什么问题？


    王总：我们找幼儿园合作，可是幼儿园的负责人好像不感兴趣，给他们70%的利润都不接受，谈了3家都失败了，所以很纳闷，就想问您，到底是什么原因？


    老师：你这样谈，他们肯定不会跟你合作的，原因很简单，第一、政策上不允许；第二、家长反感学校推销东西，他们不想承担风险。单刀直入地给提成让他们帮你卖，肯定会拒绝，要知道曾经有很多类似的产品肯定也找他们谈过，如果每个都合作的话，他们还开不开幼儿园呢？

