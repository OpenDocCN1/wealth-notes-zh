    ## 第 09 节 打造按期排队类引流产品


    按期排队引流产品是商业顶层设计在引流产品策划上的一个创举之作，可以说，它的出现彻底解决了一些不便于大批量提供引流赠品的商家，也能轻松解决引流的难题。比如，宾馆、电脑维修、KTV
    房间、驾校等。


    所谓排队是指，在一定周期内提供限定数量的免费或低价服务，而持卡者可到对应的日期免费或低价享受，如果还没有到对应的日期需要提前享受服务，则可获得多次代金消费资格。


    为了让你更进一步了解按期排队的威力，下面通过一系列的案例来启发你。


    ### 案例：宾馆瞬间暴增会员的绝密策略


    前段时间，有一位学员向我请教了关于宾馆酒店的引流策略，下面是我还原当时的对话。


    学员：老师，在我们县城有一个宾馆，老板关系跟我不错，有七八十个房间，全部新装修，档次还算可以，由于新开不久，很多人都不知道，现在入住率特别低，看了您的书之后，我一直在想，如何帮助他们包装引流赠品，可是抓破脑袋也想不出宾馆能用上免费的东西吸引客源，还得请老师指点一下。


    老师：先确定一下，这个宾馆是接待本地的人比较多，还是专门接待一些外地出差的客人？


    学员：我们是县城，外来人口少，一般都是本地住宿的。


    老师：如果都是本地住宿的话，引流产品就非常好包装了，按照你的说法，现在有大量的房间每天都是闲置的是吧？按期排队类的引流产品应该是当下最好的选择。


    学员：按期排队？不明白。


    老师：那我问你，如果要宾馆的老板每天免费提供6间房的住宿，他会同意吗？


    学员：当初我们也想过这个问题，但是后来想想，这样还是不能实现大规模的引流，很有可能住了就住了，产生不了锁定性的消费。


    老师：也就是说，如果能够实现大规模的引流，并能产生锁定性的消费，那么，每天提供6间房免费是完全没有问题的噢？


    学员：要是能这样的话，肯定没问题啊，可是想不到有什么方法可以实现。


    老师：其实要实现很简单，每天免费提供6间房，一年就是2190间，配合免费提供房间的数量，做 2190 张 PVC 会员卡，每张卡上面标注一个日期，持卡者在对应的日期过来，可以免费住宿
    1 晚，并且，在卡里还给他充上 100 元，这 100 元可以抵现金消费 5 次。


    试想一下，假如你在 2019 年 3 月 18 日拿到了这张卡，上面注明了可以在 2019 年 9 月 10 日免费住 1 次 “贵宾体验房”，你会不会保留这张卡呢？


    这个宾馆的印象是不是瞬间就植入到了你大脑，同时，很有可能在 9 月 10 日之前你也有住宿宾馆的需求，怎么办呢？这时卡里充值的 100 元还可以提前抵 5
    次消费，每次过来都可以减免 20 元的费用，是不是也很吸引力？


    学员：还可以这样玩啊，确实没想到，那这张卡要怎么去派发比较好呢？


    老师：肯定不能在大街上乱发，你要看准住宾馆的都是哪些人群，先做个调查，直接到对应的鱼塘派送，在赠送时，不能让别人随便挑选日期，而应该通过抽奖的形式，一等奖
    1 名，平板电脑一台；二等奖 5 名，200 元/桌的饭店套餐，这些奖品可以付费也可以整合；三等奖若干名，这个奖品就是刚刚策划的那张会员卡。


    然后找到精准的渠道，帮他们做活动即可，两千多张会员卡很快就能送出去，你能明白我的意思吗？


    学员：咳，明白了，那么卡发出去之后，就坐等他们过来吗？我还要做其他动作吗？


    老师：在卡片或者抽奖的 X 展架上需要提示，拿到卡之后，需要加微信注明会员才能激活，这样，你就顺利的跟他们建立了沟通的管道，同时，在领卡的时候尽量登记姓名、电话号码造册，具体你自己去把控。


    学员：这下彻底明白了，相当于很快就拥有了几千个持卡会员了，这一招果然高明。


    ### 案例：KTV 另类的规模化引流卡模式


    某 KTV 的排队引流卡片，左侧写了店名及免费包房的展示图片，右侧则是免费享受服务的介绍：


    399 元贵宾体验包房，免费 5 小时欢唱卡。


    激活使用日期 xxxx 年 x 月 xx 日。


    这里表达的意思很明确，持这张卡在 xxxx 年 x 月 xx 日可以享受到 5 小时价值 399 元的唱歌服务。


    右侧下面是使用本卡的细则：


    - 1、在激活使用日期，你可以持卡免费获得原价 399 元贵宾体验包房 5 小时欢唱资格。（另外还赠送 38 元的果盘一份）

    - 2、如果在激活使用日期之前，你需要消费的话，持本卡每次抵 50 元现金消费(可抵 8 次);


    假如 KTV 有六七十个包房没人光顾，既需要场地成本，也需要人工成本，做需要宣传成本，现在采用排队卡的引流策略，完全可以每天拿出 5 个包房免费赠送，就相当于一年拿出
    185 个包房，立刻拥有了 1825 个会员。


    同样的道理，电脑维护也可以这样操作。比如，每天提供 3 台免费的维护服务下来就有 1000 多台，把卡片发到目标客户手中，试想一下，如果我是 2 月份拿到的
    8 月份才能享受到免费的服务，但我的电脑在 3 月份出现了问题，会等到 8 月份再处理吗？肯定不会，是不是会优先考虑拨打卡片上的电话，享受更加优惠的服务。


    通过上面几个案例的展示，你已经明白了其中的奥妙。不过，使用排队引流策略获得更大的成功，还有两个注意事项：


    ### 注意事项 1：最好采取抽奖的形式派发！


    就拿 KTV 来说，他们的目标客户，可能是在某个高端会所经常消费的人群，如以抽奖的形式在抽奖箱抓取卡片，很多人就会挑选最近的日期，对于后面的人来说，得不公平了，放在箱子里，抓到几月几日是你的运气，对谁来说都没有异议。


    ### 注意事项2：跟持卡会员建立通畅的沟通管道！


    潜在顾客拿到排队卡之后，一定留下数据，也可以注明，加微信才能激活此卡以通过微信预约。


    前面讲的是免费排队引流，接下来带你看一个用低价作为排队引流的经典策略。


    ### 案例：驾校的垄断性经营策略


    这是我的学员钱总分享的一个非常经典的低价排队引流策略。


    钱总有一家驾校，同时面临十几家对手的同质化竞争，后来仅用了一招，几乎垄断了当地的驾驶培训市场。


    当时学习驾驶的费用基本在 3000 元左右，可是钱总的驾校突然打出一个震撼性的促销主张“在 xx 节日之前报名者，仅需 1980 元……” 。


    疯狂的主张一经推出，立马引起了轰动，准备在其他驾校报名的人，经不起诱惑都跑过来了，想学驾驶却犹豫不决的人也过来了，感觉今后有学车需求的人也过来了。仅仅几天时间，报名人数达到了几千人，也就是说，把当地未来几年的客户都抢过来了。


    或许你会疑惑，驾校疯了吗？这么便宜的价格，不是在害人害己吗？如果你也这样理解，只能说明你对排队引流的策略还没有理解透彻。


    首先，驾校教练和教练车的数量是有限的，几千人报名，虽然可以享受到超低价格，但是，只能排队等候或是插队，有时候一辆车可能同时有二三十人在学习。


    这时，很多要赶快拿驾照的学员不想这样大锅式学习，就纷纷提议能不能推出一辆车只带几个人的 VIP 服务，再额外交钱也无所谓，其实，这正是驾校已经料到的结果，于是顺利推出了
    VIP 练车服务。


    此时，没有那么多车和教练怎么办？驾校早就打好了如意算盘，因为当地很多教练车都是教练自己买的，被他们这么一整，其他驾校的生意已经惨不忍睹了，很轻松就把其他驾校的教练吸引过来了。


    最后的结果是，45%的人额外再补交了 1000 元加入了 VIP 服务，这就是把限量的车当作了低价的排队引流产品。


    当然，这个案例还可以变换，比如，驾校有 30 辆车，可以只拿出其中的 5 辆低收费，作为引流噱头，打出低价学车的广告，吸引大量的人过来咨询，咨询的时候告知对方：低价学车只有
    5 辆，需要插队或排队，其他车按正常收费……


    虽然不能像前面那样轰动，但同样可以起到非常好的引流效果。


    ### 按期排队卡设计要点：


    核心元素1：店名、广告语和图片的展示缺一不可。


    核心元素2：把按期排队产品的价格标注出来，让受众感觉如果没有这张卡，此服务是需要花钱购买的。


    核心元素3：激活使用日期必须标明，如果在制作卡的时候，机器不能压制出日期，需要留出手写的空白条，卡片印制好之后，自己手写即可。


    核心元素4：右侧的细则得描绘清楚，让持卡者知道能够免费得到哪些项目，比如，电脑维护可以写上除了重装系统之外，还对键盘、鼠标以及机箱进行深层除尘菌。


    总之，描述得越清楚，想要得到的欲望就会越高。最后，还要阐述明白，在激活日期之前，持卡能够获得哪些具体的优待。


    ## 第10节 打造基础套装类引流产品


    人们使用产品、服务的目的 是为了解决问题或实现梦想，然而，问题的解决和梦想的实现并不能一步到位，必须经过一个发展过程或做好多个方面的配合。


    所以在包装产品的时候分阶段进行策划，把第一阶段的产品或服务作为基础套装类引流产品，是超级具有杀伤力的策略！


    接下来透过一系列的案例教会你如何运用！


    ### 案例：美容院倍增客户的精彩策划


    以免费体验的形式拓展目标客户，是大多数美容院惯用的套路，她们明明知道这种方式效率低下，可并没有找到更好的解决办法，大多数美容院的老板不懂如何通过阶段性划分，打造基础套装类引流产品。


    皮肤美白、红润、弹性、光泽、粉嫩是所有女性的终极梦想。但是，当皮肤出现问题的时候，并不能一步就可以达到理想的结果。


    通过找专家梳理皮肤美白过程，可以得出，从问题皮肤到好皮肤必须经过四个阶段：


    第一个阶段【深层洗涤】，必须把毛孔垃圾洗干净才能进行第二步操作；


    第二阶段【细胞灌溉】，然后就是【营养导入】，最后进行【能量激活】，走完这四个阶段才能实现美白、红润、弹性、光泽、粉嫩的肌肤，并且顺序不能颠倒。


    基于前面四个阶段的划分，把每个阶段进行拆分，打造出四套不同的服务，每套服务都解决相应的问题，达到阶段性结果。


    把第一阶段的【深层洗涤】包装成【微洁技术皮肤深层清理套餐】，市场价 2180 元，以此套餐作为引流赠品，对接瑜伽馆、咖啡厅、高端美发店、奢侈品店等精准渠道，让他们以回馈客户的形式免费赠送，必将引爆大量客源。


    为什么免费体验几次的拓客形式会效果一般呢？首先，免费体验就注定了价值感很难体现，何况又是在大街上派发，信任度严重缺乏，别人一看就明白这是钓鱼钩子。


    然而，打造成四到五次的套餐服务，给别人的感觉就是整体的价值，对接精准客户渠道，让鱼塘塘主回馈赠送，又有了信任转嫁，所以，引流效率自然提高了 N 倍！


    当引流进来的客户接受服务时，把皮肤保养的四个阶段进行全貌的介绍，除了让人感觉整体性和专业性之外，更重要的是，做完第一个阶段看到了效果，就能非常顺利地引导客户做其他三个阶段的服务。


    ### 案例：饰品店的引流魔术


    曾经有一个做女性饰品店的老板问我：“我们传统的销售方式一般都是顾客来了之后，依照她们自己的需求，想买哪个就买哪个，也想过用某个饰品做引流赠品，但总感觉诱惑力不大，特别想知道，像我们这种类型的店，如何打造出高诱惑的引流产品？”


    我说：“首先你必须知道，做任何生意都不要把自己定义为商家，而应该以专家的身份面对顾客，如果进行深入研究，站在更专业的角度，完全可以深化你的服务。”


    比如，各种配饰的搭配可以分为不同场合(上班场合、建街场合，聚会场合，约会场合)和不同季节(春、夏、秋、冬)各种不同的个性化组合，也就是说,今后你不是卖单一的产品，而是销售时尚前沿的搭配套餐。


    一年分四个季节，不同的季节搭配不同的配饰组合，每个季节又有不同的场合，每个场合又是不同的搭配。所以，在设计引流产品的时候，可以把一个季节中的一个场合打包成配饰套餐，塑造好价值，低价或免费让目标客户领取。


    通过沟通，只要对方接受了你的搭配理念，就能顺利引导他们购买这个季节其它场合的搭配，还可以促销会员资格，让他们获得其它季节搭配套餐的超值优惠。


    因为人都是追求完美的，在他不知道整个完美体系的时候，只能按照自己的喜好去选择，当明白不同季节、不同场合的搭配组合时，你赠送局部套餐，他就会感觉自己的配饰缺乏完美，为了追求完美，就有欲望选择全套的产品。


    此时，只要给他一个无法抗拒的成交主张，一般都能很轻松地实现后续消费。


    ### 案例：各类培训班的引流思维


    不管是跆拳道培训，还是英语学习，也不管是乐器教学，还是舞蹈训练，我们会看到大多数都是以免费体验 1-2 节课作为进行引流。


    如果真的想把引流产品的威力发挥到极致，1-2 节课的体验就显得有点软弱无力了，因为它不能给别人一个整体的价值，让人感觉就是一个钓鱼的钩子，赤裸裸的摆在那里，并且像这样的体验，大街上随处可见，价值感就显得微乎其微了。


    比如，做英语培训的，可以告诉目标客户，英语基础入门到最终的顶尖程度可以分三个阶段，第一个阶段叫 “思维突破阶段”，第二个阶段叫 “技术突破阶段”，第三段叫
    “应用突破阶段”(这只是打个比方，你可以依照自己的教学流程和特点进行划命名)。


    把第一个 “思维突破阶段” 包装成 6 节课，并命名为英语思维突破训练营，广告语是 “6 节课教会你外国人说英语的思维方式”。更多绝学课程请咨询微信xi383921,备注：咨询！


    然后，详细描述一下在 6 节课中具体能够学到什么，得到什么样的结果，这就成了一套系统的课程，标价 680 元，让人们认为这是你原本收费的课程，价值感立刻指数级增长。


    最后，做一张学习卡，把课程价值描述在卡上，对接精准客户渠道，塘主以回馈的名义免费赠送给你的目标客户，并在卡上注明添加微信报名即可激活【英语思维突破训练】的参训资格。


    参训之后，学员们通过第一阶段学习获得了提升，并建立起情感，后续会有很大一部分学员，继续付费申报第二阶段、第三阶段的课程。也就是说，再也不用坐等学员以及做那些狂轰滥炸的无效广告了！


    ### 案例：瑜伽会所的终极拓客方案


    有一位学员，他为自己的瑜伽会所策划了 10 节课的瑜伽套餐，本以为这个套餐会有足够的吸引力，可是在对接精准客户渠道（鱼塘）的时候，虽然已经极力地塑造套餐的价值，塘主却表现得不太感兴趣，于是他咨询我到底哪个地方出了问题。


    这种情况是很多营销新人经常遇到的困惑。我给出的建议是，把 10 节课改为年卡课程。也就是说，持卡可以免费享受 1 年的瑜伽课，如此一来，对于鱼塘塘主来说是无法抗拒的，足以让他们感受到这张卡帮他促销和回馈的价值，作为潜在顾客而言，肯定也是无法抗拒的。


    看到这里，或许你也会跟很多学员一样产生疑惑，免费 1 年，瑜伽会所赚什么钱啊！这就是整个策划思路让一般人很难捉摸的巧妙之处。


    其实非常简单，只要把瑜伽课程划分出等级，基础班、中级班和高级班，然后，初级班的课程可以免费参训1年，并塑造好价值。


    要知道，瑜伽会所的固定成本几乎是不变的，所以，通过赠送基础课程的年卡进行前端放大，是最好的选择，有意向的客户一定会珍惜这个年卡，并在基础课程结束之后，顺利引导进入更高级的课程。


    这样一来，不但可以提升影响力，还能大规模的获得精准客户，更重要的是，当拥有庞大的会员基数，以此作为筹码，便能整合更多的资源回馈客户，以及跟更多相关商家合作赚钱。


    要想让前端引流和后期收费课程的转化做到最好的效果，还需要注意两个关键：


    关键一：在课程等级的包装上千万不要用初级班、中级班和高级班来命名，可以是《修身班》、《修心班》等命名形式，以确保价值感的进一步提升。


    关键二：虽然是免费学习1年，但课程教学可能只有10节,1年免费学习指的是在1年之内可以随时来参加《修身班》的训练以及每月1次的交流会。


    这就是基础套装类引流产品的变通设计思路。


    ### 礼品领取卡设计要点：


    直接持卡就能领取礼品或享受服务的礼品领取卡,在设计的时候也需注意到一些元素的把握。


    核心元素1：店名和广告语是必不可少的,如某张卡片的广告语是“1261 位家长佐证,6 节课让你的孩子彻底蜕变！”,通过这句话,让目标受众知道孩子能够获得哪些具体的好处,比如,英语思维突破训练营的广告语是“6
    节课让你学会外国人讲英语的思维方式”,直击消费者的欲望。


    卡片左下侧的图片也能够起到刺激欲望的作用,所以,有必要再次通过图片和描述做进一步展示。


    核心元素2：记得把零售价标注清楚,很多人做的礼品领取卡,就犯了很严重的错误,比如,“免费领取价值**元的**服务”,这种表达形式,给人的第一感觉就是钓鱼的钩子,不是一套系统的产品和服务。


    建议以零售价的形式表现，他们会认为这是已经付钱的服务，之所以能够免费得到，是受到了特别的待遇。如果再加上“此服务为单位专属订制”，就能更进一步让受众感觉，这张卡是单位团购过来回馈给他们的。


    再次谨记，不要出现“免费”字样，它是一个恐惧字眼。


    核心元素3：描述出持卡过来能够得到的具体价值，从上面的卡片中可以看到，我们对整个课程的价值都做了详细的描述。


    用于引流的理发卡设计也是运用了同样的原理，给到了瑜伽馆的老板。你可以参考思路。


    如果你是瑜伽馆的客户，瑜伽馆的老板对你说：“非常感谢您对我们长期以来的支持，我们特意到**理发店团购了一批理发卡，市场价是98元的服务，也就是说，现在持这张卡到理发店可以免费享受98元的理发和护理服务……”


    作为客户的你，会不会珍惜这张卡呢？


    这就是设计引流卡的奥秘，切记不能让别人感觉不值钱，认为就是一个钓鱼的钩。


    引流产品详细介绍的展示秘诀时，小小的引流卡并不能完全把赠送的价值展示出来，以前我们会为引流卡配备一张小单页，用于塑造引流产品的价值。


    如今，微信公众号成了最佳的替代方案，只需在引流卡上加入微信公众号的二维码，手机扫描关注就可以查看领取礼品的详细信息，如此一来，施展空间就更大了。


    除了加入更多图片元素，还能插入视频介绍产品，如果想更进一步刺激持卡者关注，还可以给出不同的诱惑主张，比如，“扫描二维码关注了解产品详情，输入卡上编号，还能参加赢千元现金活动”。


