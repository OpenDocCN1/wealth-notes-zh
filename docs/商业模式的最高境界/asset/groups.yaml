    ### 案例：新开童装店的引流卡策略


    我的团队曾帮某童装店设计过一张抽奖券卡，上面有“活泼、阳光、有范，让你的孩子魅力四射”的广告语，然后，左侧还配有一张童装店的服装照片，这些内容都是用于刺激目标受众美好的联想。


    最主要的是，右侧三条具有诱惑力的规则组合：


    - 持卡可到本店享受三次抽奖机会，一等奖：儿童学习平板一台；二等奖：童装一套；三等奖：游乐场门票三张。


    第一条,抽奖的营销形式为何经久不衰,取决于两个方面。第一，在高诱惑奖品的刺激下，人们都是心存侥幸的，所以，参与度一般都会很高；第二，站在商家自身来看，由于中奖的比例有限，低投入就能吸引大量的人气。


    本案例中的高诱惑奖品，就能刺激目标顾客的欲望，如果一位妈妈拿到这张卡，今后给孩子买衣服时，是不是也会优先到这家店碰一下手气。


    第二条，持卡可以到童装店兑换 10 元现金抽完奖之后只需要留下这张卡，还可以兑换 10 元现金，不需要任何额外消费。有了这个价值点，卡的诱惑力就更大了。


    为什么还要加上现金呢？如果你还记得前面买客户思维的计算逻辑,应该就会明白,相当于花 10 块钱买进一位客户,如果维护一位顾客的好关系,1 年从她身上赚到 500
    元,那么,吸引 50 位潜在顾客进店，维护锁定一位就不赔钱，锁定两位就赚了，这是完全没有风险的高额回报。


    不过也有学员测试，将金额降低到 5 元的时候，同样能够吸引目标顾客进店。


    第三条，如果不兑换现金，还可以直接增值抵 30 元购买任意童装。这种增值抵现的促销手法，是为推荐衣服打下的铺垫。告诉对方：持卡仅今天1次机会，没有卡片的，新老客户一律原价。


    你可以站在目标顾客的角度思考一下：假如小孩的妈妈拿到这张卡，会扔掉么？会置之不理么？在考虑给孩子买童装的时候，是不是一定会优先到这家童装店？事实证明确实如此，这就是抽奖券卡的威力。


    假如你是卖电器的，也可以同样的方式操作。比如，持卡可以到本店享受了3次抽奖机会。一等奖，空调一台；二等奖，微波炉一台；三等奖，豆浆机一台；幸运奖，超值礼包。


    抽完奖之后，凭卡还能领到15~20元现金，不兑换现金，可抵50元购买电器，是不是也会吸引目标客户优先到你店里来？何必一年花掉数十万的广告费做漫无目的的宣传呢！


    当然，抽奖券卡的发放途径一定要准确，绝对不能在大街上随意的乱送，否则，吸引过来的估计全都是占便宜的老人家。（在后面的章节会专门教你如何对接精准客户）


    操作以上策略时，要留下持卡顾客的联系方式，或让对方加微信后才能参与活动，以方便持续沟通和跟进，才能做后续的适时促销。


    留下联系方式或加微信的理由是“老板需要验证，如果没有验证，我们是要罚款的，因为验证才能防止虚假抽奖和领取现金”，用这样的理由基本上无漏网之鱼。


    ### 案例：引爆购物商场的超级抽奖模式运作方案


    前面我们提到，奖品越有诱惑力、中奖率越高、抽奖次数越多，越能充分激发人们的侥幸心理。


    接下来教你一套超级抽奖模式，不仅可以用于引爆商场的人气，各种促销展会、联盟砍价会等都可以利用此模式进行带动。


    下面通过一段对话，让你明白超级抽奖模式的运作方式。


    学员：老师，新开购物商场人气不旺，如果用传统的广告宣传，效果肯定一般，对于这种引爆人气的策划活动，您有没有什么好的建议？


    老师：既然是商场，肯定有很多商户已经入驻了吧？


    学员：对，商户租赁铺面，由商场统一管理。


    老师：像这种购物商场的人气引爆，最有效的方式就是运用超级抽奖模式！


    学员：什么是超级抽奖模式？


    老师：直接说操作步骤（如下），你就能够明白它的威力。


    ### 第一步，联合采购奖品及工具打造


    - （1）假如商场有 100 个商户，每个商户拿出 400 元的活动经费；

    - （2）用 10-20 元的成本采购奖品，至少可以放大到 20-40 元的价值，奖品可以从外面采购过来，也可以商场内部商家自己提供，采购的奖品分别摆放在每个商家店门口的桌子上，形成直观的诱惑。


    假如每个商家拿出经费中的 300 元采购奖品，整个商场至少有 1500-3000 份小奖品，把剩下的 100 元经费分成 50 份，每份 2 元，把 2 元置于红包内作为幸运奖，那么，100
    个商家就有 500 份幸运奖，加上前面的奖品，整个活动就有 6500-8000 份奖品，中奖之后拿奖券到对应商家领取即可。


    - （3）每 4 个店为一组，在门前放置一个抽奖箱，100 家店就有 25 个抽奖箱，25 个抽奖箱就代表着每个人有 25 次抽奖机会。确定抽奖剩余次数的方法就是，每个顾客发一张印有
    25 个格子的名片，命名为抽奖次数卡，每个抽奖箱抽一次奖，就用笔在格子里面画一个叉。


    （4）为本次活动命一个主题，比如『抽奖购物狂欢节』，印刷 1 万张 PVC 材质的活动邀请卡，持卡过来可以不用消费就能参与抽 3 次大奖和 25 次小奖的机会。


    在卡上注明，本次活动共发放 1 万张邀请卡，活动奖品数量共 8000 份，活动奖品有……，如此一来，通过抽奖次数、中奖率和奖品的诱惑，就能有效刺激持卡者的行动欲望。


    印刷和制卡费用直接找赞助，收回成本即可，邀请卡、奖券及抽奖次数卡的背面绝对是高频率关注的黄金广告位。


    ### 第二步，整合大宗奖品


    前面提到持卡可以抽 3 次大奖，大奖的奖品如何来呢？当然是通过整合的方式获得。


    要知道，本次活动发行 1 万张邀请卡，为期 3 天的活动至少可以集中带动几万人气，那么，很多外围商家都可以借助本次活动，宣传与展示自己的品牌。如果展示？在大厅把产品摆上作为奖品即可。


    比如，卖家电的赞助一台微波炉、卖电动车的赞助一台迷你电动车、卖沙发的提供一套沙发、卖茶叶的提供几盒茶叶、按摩店提供 10 张 68 元的足浴按摩卡……依照这样的方式，至少可以整合几十个外围商家参与进来。


    ### 第三步，精准对接客流


    为了确定客户人群的精准性，邀请卡不能在大街上乱发，而是通过精准渠道进行投放，主要投放有 2 个方向：给商场商户安排指定数量的邀请卡发放任务，他们可以送给自己的亲戚朋友；跟互补商家、鱼塘等合作，让他们赠送给自己的客户，合作筹码是，活动期间赠送商场广告位。


    ### 第四步，建立数据平台


    活动当天，凡是持邀请卡过来的人，可以到大厅参与抽大奖，抽完 3 次大奖之后回收邀请卡，只需要关注商场的微信公众号，便可赠送 25 次抽奖机会，并获得【抽奖次数卡】。


    通过这个举动，便能顺利地留下了所有人的数据，拥有大量的粉丝，为后续整合礼品互动和促销推荐做了长远的铺垫。


