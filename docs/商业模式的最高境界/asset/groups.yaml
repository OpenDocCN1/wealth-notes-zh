    ### 案例：家具城引爆销售的代金券模式


    以下是我在学员辅导群的一段对话，被学员整理出来了，现在分享给你，相信能够启发到你的思维。


    赵总：老师，我同学是地级市美的总代理，以前做展销会销量挺好，采用的销售入场券模式，现在人都疲勞了，有什么办法可以对接鱼塘吗？


    老师：刘总也认识一位美的电器的代理，曾经也去用代金券对接鱼塘，结果如我们所料想的一样，没弄来一个人。


    赵总：代金券不可用？


    老师：不是代金券不可用，关键要看代金券怎么用！


    赵总：他是在大型商场开设的销售专卖店，老师请指教。


    老师：那家美的电器的老总执意要用代金券的时候，许总就劝过他，并且，已经给他断言没有任何效果，当初他不听，最终的结果，果然不出所料，由于几个点的原因，导致没有任何效果。


    赵总：哪几个点呢？


    老师：第一、对接鱼塘时，鱼塘的塘主拿到代金券之后，根本感觉不到代金券能够给他带来任何具体的价值，既不能通代金券帮他促成成交，也不能促进引流，唯一的感觉，就是在帮美的电器做宣传。所以，开始可能碍及面子答应了，但这些代金券发出去的概率是非常小的，后来，美的电器老板做回访的时候，结果确实是这样，别人几乎没有帮他发。


    第二，就算代金券发到了目标客户手上，他们并不会认为有多大的价值，而且给人的感觉就是，羊毛出在羊身上，你发代金券给我，肯定是美的电器给你提成了，像这样的代金券跟宣传单上的打折促销没有任何差别，所以，就算是拿了代金券，也没有人去询问。


    赵总：那老师给点建议。


    老师：像这种代金券的活动，以前做得比较成功的(包括家电、家具、灯饰类等)基本上采取地运作方式是这样的：


    （1）通过宣传广告，在地面提前宣传预热，让大家都知道将在几月几日有促销活动。


    印刷一批限量的代金卡，卡片必须高档，可以是 PVC 材质，并标注好这张卡片的价格，比如，“此卡零售价 10 元，不需要此卡的，活动当天可以 10 元回收，有购买需求的，持卡可以在活动折扣价的基础上，再抵
    xx 元现金消费”。


    也就是说，活动当天，只要持卡过来，在地面宣传的促销折扣基础上，还能无条件享受到优惠；


    （2）对接精准鱼塘当作回馈的赠品免费赠送，发放 300 张卡出去，相当于对接了 300 个精准客户，做好领卡人的联系方式登记，以便后续跟进。


    卡发出去之后，在活动开始的前一周分 3 轮主动联系潜在客户：第一轮短信通知，告知对方准时参加活动；第二轮短信通知，也是类似的提醒；在活动倒数两三天时，客服打电话做第三轮通知，电话表明的意思是：


    这张卡片的数量是有限的，现在还有很多人想要获取，如果到时候您没有购买的需求，可以活动当天来本店以 10 元的价格回收或转让此卡，给其他有需要的人，如果有购买需求，请一定妥善保管，可以获得区别于普通顾客的优待。以上流程就是提前宣传和活动蓄客的过程！


    持卡的人在活动当天，会有很大比例过来看看，就算是自己暂时没有需求，也会把卡送给自己身边有需求的朋友。以前我的一位学员帮助一家家私城，按照上面的运作方式，活动当天，从晚上7点到9点，仅2个小时，销售额就达到了40多万！


    赵总：谢谢老师，我以前每次做活动都能卖出一千多张代金券，但是退回来的得有三分之一。


