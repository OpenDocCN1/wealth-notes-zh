    ## 第05节 资源战略


    第五个战略叫做资源战略。


    其实我们所有的一切都是通过资源的组合，我们的事业的成功都是资源的组合，那我们这里所说的资源就包括了什么？


    它包括你的人才资源、人脉资源，包括你外界所借的影响力资源，包括你的资金资源，所以说我们这一方面也要制定好自己的战略。


    比如说：首先我们讲人才战略，你一定要有自己的十大元帅，也就是说，你也一定要培养自己的人才。这是一个战略方向。


    你一定要清晰地知道，你要做成一件什么样的事情，做成这样一件事情，需要什么样的人才来匹配，这个非常关键。


    比如专门做品牌管理的，做互动的人才，需要专门管市场策划的人才，需要专门策划整个事件的人才，需要专门做管理的人才，需要专门维护客户关系的人才，这些必须要规划得很清楚。


    需要什么样的人才，整个人才需要具备什么样的特质，你一定要找到这样的人。因为我们做事业，是像拼盘一样拼起来的，我有这个能力，我有这个资源，他有那个能力，他有那个资源，把大家拼在一起，就成了一个事业。


    听懂这句话顿悟商业真谛：


    ![](img/bfda52d6c5cdfa68d525dc14d6d5ffc7_135_0.png)


    人才的团队打造好之后，是不是事业就成功了 80%。这方面一定要考虑清楚，有没有挖掘到非常好的伙伴，他们之间是相互互补的，看你自己摆在一个什么样 的位置。


    如果说你能够摆在一个老板的位置，你就当老板。如果说你摆不了老板的位置，就别当老板，你就当其他的，你就别当 CEO。


    CEO 主管战略方向以及后勤工作，方向在哪里，CEO 要做的还有去协调各大人才之间的关系。


    人才战略做好了，我们这里讲的资源还包括 “1000 钢丝法则” 的战略。


    你能培养 1000 名钢丝客户，这是你的核心基础，吸收他们成为你的会员，这就是客户方面的资源战略。


    客户也是你很好的资源，员工是你的 teens 资源。你要把这资源的一部分做好，你必须要有 1000 个对你死心塌地地愿意为你出来说话的，愿意出来为你代言的，愿意一起帮你的生意出谋划策的客户。


    还有一个外界的资源整合战略：针对你的整个资源链条，你要通过合众连横把其他的资源全部吸附过来。


    打个很简单的比方，如果说你要做高端的酒店，光靠自己的酒店是不够的，要吸附当地有影响力的资源提供互补。


    比如其他高端商家形成强有力的联盟，并有影响力的人物加入你的圈子，这就是你的资源战略，一定要吸附好，不要让他被别人拉去联盟了。


    如果说你能在当地把高端资源全部笼入你的联盟里面来，形成强强联手，去做市场，是不是更容易把它做起来？


    更重要的是，其他人来跟你竞争的时候，你不要让别人一下把你的资源抢走了，他一下去跟其他人强强联手而联盟，那你就成了弱势。


    这就是我们说的你自己的国家维护好之后，是不是还要跟其他国家形成战略联盟。就像古时候打仗一样，联盟国平时彼此之间各自做各自的，各自为阵，但是 一旦有外敌侵犯，彼此就形成联盟。


