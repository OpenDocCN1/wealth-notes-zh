    ### 什么是高需求度？


    例如，你要卖一套渔具，现在有三个用户：第一个用户是正在收看钓鱼节目的人，第二个用户是明年打算去钓鱼的人，而第三个用户今天下午就打算钓鱼。你认为谁更容易成交？


    没错，就是第三个人，因为他需求迫切，不需要你经过漫长的培育。


