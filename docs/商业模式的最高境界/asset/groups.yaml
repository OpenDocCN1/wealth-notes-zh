    # 第02节 卖东西的3个层面


    卖东西有3个不同层面：卖产品、卖商机和卖股权。


    因为卖的东西不一样，导致需求不一样，收益不一样。消费者要效果，经营者要利润，股东要溢价要分红。说白了，不外乎是卖艺和卖身。杨白劳卖豆腐一辈子都还不清黄世仁的债，卖喜儿一夜就能还清，可见卖艺不如卖身。


    卖产品赚的是每一单产品的差价，卖商机赚的是一群人帮你卖产品的差价，这些赚的都是业务层面的钱，属于卖艺。卖股权是把未来提前透支，把业务层面经营20年、30年才能赚到的钱，一年就赚回来，属于卖身。


