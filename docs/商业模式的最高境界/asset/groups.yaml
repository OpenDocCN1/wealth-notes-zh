    ### 第02节 垂直供应链整合


    接下来，我们谈一下整个产业链的布局。


    未来的大企业通过裂变成平台，小企业通过聚变成平台。合纵联手，要么被吞并，要么联合。产业集群生态圈布局有3个重点：垂直供应链整合、水平价值链整合、内部系统化整合。


    你先把你最擅长的、最好的，把它做到极致。在你自己行业里实现转型或转行。第一点先找垂直的供应链，首先是端对端，去中间化。


    未来没有代理商，没有分销商，没有中间商，这是整个商业进化的结果，传递价值方法会发生巨变。你已经看到，李宁店关了上千家，百盛开始关门了，杭州关了一半的铺。以更便捷的方式更低的成本传递价值，这是必然的。


    我们能不能提前先布局，很多零售商代理商现在过得很好，可是明天呢？通过互联网物联网，万物互联，甚至未来的心联网，意识传感，沟通越来越透明。


    一个人的信誉越来越值钱，量子传输已经实现了，信息传逃的方式越来越透明了，这是一个共享经济的时代。未来价值会更能发挥价值的流动，一个企业没有价值，就没有活下去的理由。


    > 共享经济的最高境界就是共产主义。

    — 墙葛喇


    随着科技的管理体系的变革，更高效的将代替之前低效的方式，这是必然的，能用工具的就不用人，人太复杂了。


    现在人越来越冷漠，机器越来越人性。虚拟现实的世界，见面打招呼，超高位的仿真传感器，可以看到摸到对方。机器越来越像人，这是必然的。


    你去推断，这是必然的，局部推断整体，同时体系会越来越完整。


    人类这么多次的变革，未来找对象不需要相亲，只需要大数据匹配就好了，而且婚姻幸福指数比较高。


    所以去中间化，传递价值越来越便捷，你需要移动你的企业在价值链中的位置了。从设计出发到用户，设计、原料、加工、渠道、终端等所有的都是设计在最前面。


    过去客户要拿到价值，需要经过中间一层层盘剥，现在出现了互联网，所有多余的步骤都会被去掉，用户直接加入。中国未来只有一种商业模式：C2B—以用户为中心，定制设计产品。


    未来不是消费者请注意，而是请消费者注意。未来不是你需要什么，而是请问我能为您做点什么。所有人都变成顾问式销售，这是更符合人性的，所有的组织比拼的是谁更能通人性，谁能真正站在客户角度，谁能给客户带来更好的体验。


    体验经济的最重要的一个词是爽，未来的客户要的就是爽的体验。让客户爽，就有钱赚；让员工爽，就跟着你；让渠道爽，就卖你的货。


    为什么女性比男性好？因为女性更感性，更在意感受，更懂得为别人着想。相对来说男人更自我一些。


    未来我们会更多的变外求为内求，从以自己为中心变成以对方为中心。


    皇帝的女儿不想嫁，酒香不怕巷子深的时代已经过去了。你的出发点是利他还是利己？利己的最终很难利己，利他的最终都会利己。老子说过：人无常心，以百姓心为心。


    当你能够让世界因为你而得到更多，全世界会让你得到更多！


    各位企业家们，你们在做商业模式顶层设计的时候要先做内部的，攘外必先安内。固若金汤的城池是从内部瓦解的，永远不要急着去圈地，要想着自己是否准备好了？


    当有一万个人进来的时候，你能帮助他们成功吗？有没有一套方法能成就他们呢？口碑坏了，人的信任就没了。


    顶层设计做的第一件事就是做充足的准备，宁可终生不用，不可一日不备。准备十万次的目的就是为了 一次都用不上，但是万一没准备对方真的来了，你就会输得很惨，命都搭进去了。


    人生不是百战百胜，面是减少动作频率，等机会来了做一次就够了。在机会来之前，你要做的是准备。在战争之前，先取得战争胜利的一切要素。


    《孙子兵法》开篇五十七计，提到是否在道上，是否能让大家都能赢，大形势怎么样，风水怎么样。决胜的地方如果是主场作战，天时、地利，胜仗是准备出来的，不是打出来的。有军事气象学，基本上夏天和冬天是不出征的，因为士兵大苦了。


    日本当时侵华战争时期，主张是共建大东亚共荣圈，也要一个高度统一兼容大家利益的口号，这就是政治高度，以正义之师伐不义之师必胜(至少让自己看起来像是正义之师)。


    天时、地利、人和，掌握时机，占据有利之地，然后看将军是否知人善用，是否有智慧。将不在猛，在谋，其次是仁。


    领袖肯定要守道德。成吉思汗拿下欧亚大陆，他是这样说的：只要攻下一座城池，我只要敢动一个财宝，你们尽管剁下我的手指；若敌人来犯，我是先跑，你们可以砍掉我的双脚。


    古代将军第一个是杀人立威，准备到极致了，敌人不敢来犯。真的要打了，就开始用计。打仗胜利的 99%都是在准备，做生意也是如此，内部的模式设计是很重要的。


    不出手则已，一出手，所有人都愿意跟你合作。


