    ## 生态营造布局


    ### 第01节 鸟瞰生态圈


    未来企业之间的竞争，不再是产品之间的竞争，而是商业模式之间的竞争。


    现在市场估值的时候，如果你是做产品的，估值也就几十亿；做平台的，估值百亿；做生态圈的，估值能到几千亿。


    今天的 BAT 基本都是做生态圈布局的。


    习大大提出的一带一路，这也就是布局生态圈啊！


    比如：中国政府投一百亿，但是要用我们中国指定的供应商，指定的材料，这样一来 80 亿就进入中国人自己的腰包了。


    过一段时间，好的地段中国企业都会进来，投的钱要付利息，过一段时间升值了，可以转让股权，关键是政治影响力。


    未来的竞争是联盟的竞争，未来的生存环境要看整个生态圈。


    你的位置决定你的角度，角度决定你的观点，观点决定你的世界观，你的世界观决定你的世界。


    一个员工，站在职业的角度看，就仅仅是一个员工；如果站在整个企业的角度来看，他可能就是一个很棒的当家人、CEO；


    如果站在整个行业的角度来看，就会具备行业领袖的眼光；如果站在整个产业、上下游垂直整合、平行关联的角度来看，就具备了产业先驱的高度和风格。


    没有谁能独善其身的，大部分人都不不得不活在圈子里，很难看出来在整个行业里自己处在哪个链条，哪个环节的资金最多。有时候产品不赚钱，但是配套关联的产品是盈利的，


    当你跳出自己的企业，能站在整个产业的高度，你就能看到更宏观的关联产业，你会发现你的布局是否合理。


    高手能看得更远一些，是站的位置不一样，基于这一点，我们看一下你怎样让自己有一个好的生态圈的布局。


    你不规划自己的人生，你就会被别人规划。


    各位企业家，你进入到商业这个圈子，一定有先有战略准备。那就是乌鸦生态圈。


    实际上乌鸦都不足以描述。因为实际上看整个生态圈，我认为最好的视角叫上帝的视角，就是上帝当初怎么创造着整个生态圈的。


    我们如果去一个森林里面，或是到一个大草原去观察一个


    生态圈，我们要试着站在一个上帝的视角，当初这些生态圈是怎么演化出来的？


    我们要了解一个生态圈里面会有多少的角色，多少的玩家，以及他们这些生态圈玩家之间的关系是什么。


    生态圈可能比较复杂，我们把它缩小来看，大家很熟悉的就是看食物链，当我们在谈食物链的概念的时候，它就是一个一维的观念，也就是说有所谓的上游跟下游，它就是一条线。


    在一维的食物链里面，我们知道在海里面有小的微生物，小鱼吃小虾，中鱼就吃小鱼，然后大鱼就吃中鱼，这是一条食物链。


    在森林里面看食物链，我们就会看到有很多小青蛙那种小动物，都会有比它大一点的动物如蛇去吃它；一些小的在地上爬的动物，可能就会有四只脚的动物也可以吃它；四只脚的动物里面就有肉食的跟草食的，草食的就要拼谁跑得快，肉食的话就要拼谁的爪牙比较厉害。


    这些草食的动物就需要有草让他们吃，这样他们可以长大，长肉，让这些肉食动物来吃。这些草它就必须要有一些动物的粪便，以便能够得到肥料，所以这些草原也可以长得很好。


    一个好的生态圈它是为自己供养自己的。


    我们商业模式的变革为何要看生态圈，因为这是一个万物互联的时代，在万物互联的时代里面所有的东西是连接在一起的。


    你以为你可以圈一块市场，然后关起门来好好的做这一块市场，好好的做这个生意，但是你有可能就像螳螂捕蝼眼睛盯着一个蝼，你觉得我可以把这个蝼吃掉，就没想到后面有一个更高危的动物就是黄雀在背后盯着你。


    举个例子，就比如说五年前当苏宁跟国美经过了 5 到 10 年的激烈竞争之后，苏宁正要出来说它终于打败了国美的时候，结果背后有一个京东说你们两个的游戏实际上都不够看的。


    所以，如果说你不从一个比较大的生态圈的概念去看你的商业模式的时候，你就很容易掉入传统企业这样子的一个低维动物的窘境！


    小时候我们调皮的男生喜欢玩蚂蚁，你如果把蚂蚁放进去一个透明的吸管的时候，这个时候蚂蚁在一个什么样的维度？它只在一个一维的空间，他只能往前走跟往后走。


    如果你把蚂蚁放到桌面上来之后，他突然觉得说天地宽广，因为他这个时候从一维到二维的空间，他可以前后左右走，他已经到了一个平面的。


    我们是三维的动物，蚂蚁是二维的动物。如果你跟蚂蚁说你再走十分钟，你会碰到一条河，蚂蚁会抬头问你说，你怎么知道？


    我们用手蘸点水，然后在它前面不远的地方用水画一条水痕，蚂蚁走着走就会碰到水，它就会很惊讶，说，你怎么知道我以后会碰到一条河？


    对你来讲你是看得很清楚的，可对蚂蚁来讲，它需要走到才知道。


    如果你用手去攻击它（但是你不是要弄死它），你只要跟它玩，你就到它的前面，碰触桌子的时候，它突然吓一跳，天空本来没有任何东西，然后突然之间来了一个庞然大物，然后它准备回击你的时候，你突然又收手了，他又击不到你。


    所以你在跟蚂蚁玩斗的过程，它就是一个高维跟低维动物一个互动的过程。


    所以当你在高维的空间的时候，你对低维的动物实际上是几乎欲求予取，因为你知道它的动向，你能够看得很清楚。


