    # 第05节 顶层设计的定义


    > “理论总是灰色的，而实践之树常青”


    ——恩格斯


    “顶层设计”一词起源于工程学，而后延伸至政府规划和企业战略等领域，应用领域不断扩大。其本义是统筹考虑项目各层次和各要素，追根溯源，统揽全局，在最高层次上追求问题的解决之道。


    顶层设计是运用系统论的方法，从全局的角度，对某项任务或者某个项目的各方面、各层次、各要素统筹规划，以集中有效资源，高效快捷地实现目标。


    简单来说，顶层设计就是布局，就是系统规划，就是为了企业的长远发展，寻找一套可操作的系统性解决方案的过程。


    我们都知道田忌赛马的故事，虽然田忌整体资源都比对方齐威王弱，但通过合理统筹，高效配置资源，用自己的下等马对对方的上等马，输一局；用自己的中等马对对方的下等马，赢一局，扳平；用自己的上等马对对方的中等马，赢一局，取'
  - '[PAGE 66]


    得决定性的胜利。


    这个整合配置资源的过程，就是“顶层设计”。


    与顶层设计对应的是“摸着石头过河”。“摸着石头过河”是有问题就着手解决问题，强调务实有效，在业务方面表现出商业质感，体现出魄力；在管理方面表现为管理智慧，体现为经验。“摸着石头过河”是一种探索精神，在改革开放初期这种精神成就了一批敢闯敢拼的企业家。


    “摸着石头过河”靠的是企业家的胆识、魄力和商业质感，而顶层设计靠的是企业家的谋划能力、布局能力和系统思考能力。


    随着需求复杂、竞争加剧，供需逆转、增速放缓等外部因素影响，企业生存环境已经进入深水区，“摸着石头过河”风险重重，过去依靠招式制胜的时代已经一去不复返了。要想打开局面，持续成功，企业就要依靠顶层设计进行系统作战。


    顶层设计作为企业最高的发展纲领，作为事业大厦的设计蓝图，具有以下两个特点：'
