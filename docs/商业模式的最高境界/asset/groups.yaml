    # 终生价值平台


    有两个土匪分别在街上打劫受害者。某日，甲土匪打劫了一个受害者，发现对方钱包里有 1000 元现金，于是甲土匪当天营业额 1000 元。而乙土匪打劫了一个受害者，发现对方钱包里只有
    500 元现金，于是乙土匪当天营业额只有 500 元。


    但是乙土匪发现钱包里还有一张身份证、一张结婚证、一张驾驶证和一枚结婚的戒指，于是把这些东西拿到当铺抵押换了 500 元现金，然后打电话告诉受害人：如果想赎回这些东西，汇款
    2000 元到我的账户来，于是受害人汇款给乙土匪 2000 元，换回一张当铺的当票。


    以上资源配置、资产整合的整个过程中，乙土匪一共实现了 3000 元的营业额，是甲土匪的 3 倍。这就是用户思维，这就是用户终身价值的思维。


    通过这种思维模式，你可以用最少换最多，从而远远超越你的竞争对手。


    绝大多数商家是保守的，是短视的，他们的眼光只停留在自己一亩三分地上，只停留在眼前这一笔生意上，只盯着今天的钱，因为缺乏用户终身价值的思维，他们始终赚的是小钱。'
