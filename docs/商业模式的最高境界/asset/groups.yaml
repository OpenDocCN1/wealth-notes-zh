    ### 第二步：生活场景


    当你锁定目标用户之后，更进一步，你需要了解用户的生活场景。也就是说，你需要知道用户们经常在做些什么。


    我们要有一双火眼金睛，透过现象看到本质，找渠道要找到本质，本质是客户的生活方式，在哪个地方待得多，渠道就在哪。


    比如说，他们几点起床？几点睡觉？读什么书？看什么杂志？读什么报纸？上哪些网站？上网浏览哪些关键词？喜欢收看哪些电视台？喜欢收听哪些广播？买什么品牌的衣服？开什么车？经常去哪里购物？在哪里待遇比较多？在哪里平均待多久等等这些貌似没营养的问题。


    越了解他们的生活方式和生活场景，就能清楚的知道在哪里找到他们，同时你的营销也就会越准确，直达目标，有的放矢，精确狙击。


    遗憾的是，今天越来越多的企业老板，已经不愿意进入客户的世界，他们更热衷于应酬银行行长、政府官员、风投。他们的屁股离老板椅越近，就离用户越远，直到有一天粉丝抛弃了他们，他们才明白，是自己先抛弃了粉丝。


