    他们有，他们非常渴望成为富人。他们也憎恨贫穷。但他们做所有的事情来自于内心的顽固僵化的思维模式：


    - 我没有能力，所有我做不好事；

    - 我没有资金，所以我不能创业；

    - 我没有时间，所以我没法学习；

    - 我没有人脉，所以我圈子狭小；


    我没有资源，所以我处处碰壁；


    “这不可能”，所以我不尝试；


    “我可不会”，所以我不去做；


    “这会失败”，所以我不行动；


    “我太累了”，所以我晚点干；


    ……


    每个人的思维模式里都有一个黑洞,黑洞需要不断地做事情去填补它。我是谁？我从哪里来？要到哪里去？我 Awakening 我要做什么？


    只有真正了解了自己，相信自己眼中的未来，那才会看到你渴望看到的。


    各位企业家，哪一个说自己没有计划，自己不相信能够实现，然后就还去做这件事？


    我告诉你，没有计划就是计划失败。当你自己都不相信自己能实现自己所想的时候，你就不会去实现它。


    给大家看个图，我们看看信念是如何影响一个人的。


    ![](img/bfda52d6c5cdfa68d525dc14d6d5ffc7_32_0.png)


    比如，一个人的信念就是实现财务自由。价值观就是通过创业才能实现财务自由。这就导致他的思维方式是会看别人创业是怎么做的，别人在做什么项目。接着促发他的行为，他会去参加一些创业营，参加当地的一些创业活动，参加各种聚会。他就会去寻找创始人聚会的圈子。


    紧接着，他的朋友圈就变得不一样。结果，在圈子里他无意间遇到了张三。张三跟他还挺投缘的，大家就成了合伙人一起创业。尽管第一次创业可能失败，但是能力得到了提升，信念得到了提升，潜意识就告诉他：虽然失败了，但是我觉得我还是有能力的。


    他明白了自己的优点在什么地方，自己的短板在什么地方。所以潜意识就进一步增强了他的信念：这条路能够走得通！


    通过这个例子，希望大家能够明白正向信念能够促进正循环，而负向信念会进入恶性循环。


    相信自己所做的，并将此作为自己一辈子的事业，时间会给予你意想不到的回报。


    ## 第03节 梦想引航


    大多数人莫名其妙地出生，稀里糊涂地活着，不知所以然地死去，总有一个不完美自己和一个完美的梦想。


