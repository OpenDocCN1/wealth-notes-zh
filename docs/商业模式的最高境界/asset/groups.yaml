    ## 第二章


    ## 解密商业模式


    ## 与顶层设计


    ## 第01节 商业模式的定义


    > “中国企业基于低成本的竞争优势构不成商业模式，它们要获得真正的竞争 力，迟早要转向对商业模式的关注。商业模式是屏蔽行业恶性竞争和整体经济低迷的最终的防御工事，是在令人绝望的冬天里置身充满希望的春天的‘时间机器’。”


    ——克莱顿·M·克里斯藤森（哈佛商学院著名教授）


    商业的本质是什么？就是以最低的成本赚取最高的利润。只有那些成功地以相对优势的成本取得相对优势的利润的企业，才能称得上优秀。


    商业模式就是帮助企业以相对较低的成本去赚取相对较高利润的商业系统。


    商业模式一词早在 1950 年就已经出现，但直到 1990 年后才开始在国内被广泛使用和传播。今天，虽然这一名词出现的频度极高，关于它的定义仍然没有一个权威的版本。


    有人认为它是一种交易结构；有人认为它是企业持续盈利的系统组合；还有人认为它是一种包含了一系列要素及关系的概念工具。


    “商业模式”这个词给普通大众的感觉就像一个筐，什么都可以往里面装，因而使得这个词极易被误解、被滥用。


    这里给大家先阐述一下这个概念：


    商业模式是指准确判断产业链利润区所在，并且根据利润区的转移，迅速调整战略，将客户群的选择、价值的获取、产品差别化和业务范围的确定等各方面的战略措施，都围绕最高利润区来进行配置。


    企业存在的目的是为了盈利。没有盈利的企业是无论如何都支撑不下去的。而企业要实现盈利，就必须要知道自己的赢利点在哪里。


    商业模式就是企业着重于发现利润区，从客户创造价值的角度进行战略定位，发现可满足客户需求的价值后，通过对自身内部和外部资源进行整合而建立的商业系统的结构。


    通俗地讲：商业模式就是你准备怎么挣钱。


    设计商业模式要回答三个最基本的问题：


    - 1、你是谁？

    - 2、你为谁而做？

    - 3、你还能为他们做些什么？


    我们都知道商业模式很重要，是企业的立命之本。任何一个企业和商业项目创立之初，最需要费功夫琢磨和研究的，就是商业模式。


    创立之初的商业模式也并不是一成不变的，应当随着市场需要、产业环境、竞争形势的变化而不断调整。


    更重要的是，商业模式并不是生来平等的，有的模式相对轻松，企业很快就扶摇直上；而有的模式则需要付出更多精力，每年增长却总是差强人意。


    因此选择、设计一个好的商业模式会事半功倍，也最需要成为企业战略管理的一项基本功而被高度重视。


    ## 第02节 好的商业模式的5个指标


    一个好的商业模式要符合五个方面的标准：定位要准、市场要大、扩展要快、壁垒要高、风险要低。


    因此我们在进行设计时，就要重点从这五个方面入手。


    ## ➤ 定位


    定位定江山。


    市场定位的核心是要寻找到一个差异化的市场，为这个市场提供独有优势的产品。确立好的市场定位的关键是细分市场，并寻找到能够利用自身优势来满足该细分市场所需要的产品和服务。


    在进行目标定位时，我们需要考虑五个最基本的问题：


    - 1、是否进行了差异化的市场分析？

    - 2、你的定位是否万目标市场和顾客创造了价值？

    - 3、是否确定了独特的市场定位？

    - 4、你的产品和竞争对手的产品是否有明显差别？

    - 5、是否设计出了客户所需要的产品或服务？


    在设计你准备提供的产品或服务时，最关键的是：你的产品满足了顾客哪些方面的需要？产品本身为客户创造了怎样的价值？顾客为什么愿意认可该价值而付费？这是产品设计的核心所在！也是定位分析之后的最重要成果。


    总之，定位最重要的目的就是找到细分市场，为这个市场提供满足顾客需要的、有价值的、独有的产品，让顾客愿意为此付费。


    ## 市场


    关于市场，这不是随意找一个细分市场提供所需的产品和服务就算一个优秀的市场定位，关键在于，要寻找一个快速的、大规模、持续增长的市场，这是确定是否为优秀市场定位的一个关键标准。


    在目标市场确立时，最需要关注的是四个问题：


    - 1、目标市场规模是否足够大？

    - 2、是否能满足目标客户重要的基本需求？

    - 3、是否能保证高速增长？

    - 4、如何保证持续性的增长？


    也就是说，除了准确定位以外，我们需要确保所瞄准的目标市场是一个拥有高成长预期的大规模市场，而且更重要的是，公司要考虑清楚是否能确保该市场在未来仍能持续高成长。


    ## ▸收入


    这是很多商业模式在设计时最容易被忽略的一个问题，也是决定该模式是快速增长还是平滑缓慢的最关键的环节。


    收入是否快速扩展，是衡量商业模式能否迅速做大规模最关键的因素。


