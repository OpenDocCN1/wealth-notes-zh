    ## 第02节 吸粉七步走


    移动互联网时代的到来，意味着人们进入了碎片化的时代，信息源和传播源在快速分化，受众也在快速分化，圈层效应明显，从前的单向传播变成了多点对多点的分散传播。


    消费者在逐渐成熟，也在逐渐改变。这个时代他们不再是客户，而是“粉丝”。


    本书的主题是商业模式顶层设计，这里不教你如何作自媒体营销。此类书籍在世面上也多如牛毛。当然，如果有机会你能学到一诺老师《营销的最高境界》，奇迹会在你身上出现。


    为了能够通俗易懂地让大家理解，本小节将吸粉分解成7个具体的流程。按照下面7个步骤，每个企业、每个人都可以建立自己的粉丝。


    ## 吸粉七步法:


    目标用户→生活场景→粉丝入口→合作方式→鱼饵诱惑→扫粉关注→完善名单


    ### ➢ 第一步：目标客户


    你需要先明确你的目标客户是谁，你需要研究他。


    比如说，我让你去广州找个人。你会问：“找什么人？”


    我说：“找一个女人。”


    你会问：“找一个什么样的女人？”


    我告诉你：“找一个长头发的女人，这个女人长发及腰，她穿一身红色风衣，戴着黑色的墨镜，而且每天晚上9点钟会准时出现在天河体育馆东门前。”


    你看，我这样一描述，你是不是就很容易找到她了？


    营销中，你最容易犯的一个错误就是，并没有清晰界定你的目标客户是谁。


    如果你没有明确目标客户，那么你的营销人员就不知道去哪里可以找到他们，同时你的广告媒体无法精准选择，导致广告投放的严重浪费，等于把大把的现金扔进了臭水沟里。更重要的是，白白浪费了自己宝贵的精力，从而把大好的时间浪费在众多无用功上面。


    正确的做法是：明确你的目标客户是谁。


    弱水三千只取一瓢，城有所不攻。


    即便你可以服务每个人，但是不见得你真的要服务每个人，你只能把自己有限的资源集中在目标客户身上，就是那些迫切需要你的人，而且他们有足够的支付能力来购买你的产品和服务。你的任务就是，找到他们，成交他们，服务好他们。


    你永远无法取悦每个人，因为你不是钞票。你只能找到那些需要你、喜欢你的人、而且你也喜欢的人，这样的关系才能创造彼此的幸福。


