    ## 第四章

    ## 设计四项原则


    ### 第01节 最佳利益


    我们要思考，在做顶层设计的时候需要哪些人参与。我们要满足每个参与方的最佳利益。


    每个人不是被你领导，是被自己的价值观领导，员工不是在成就你的梦想，是在成就自己的梦想。他发现在你的平台上能成就自己的梦想，顺带替你做点事。


    每个人都会选择最符合自己的最佳利益的行为。


    员工为什么会流失呢？觉得跟你混没前途。客户为什么会被人挖墙角？别人家好处比你多了。经销商为什么会去卖别人的货？因为卖别人的更挣钱了。银行为什么不给你投钱了？他发现投到别人那里赚钱更多。钱喜欢往更大的地方去。为什么厂商第二年不给你供货了？他发现产品交给别人销量更高了。


    你要反复问自己: 今天我的顶层设计是否满足了每一个参与方最佳的利益了？


    所有的商业模式里都有创造价值的过程，今天这个时代，我们发现传递价值的方式发生了很大的变化，可是创造价值的人真正的开心了吗？


    几年来，随着淘宝购物在身边迅速蔓延，杭州有一半的服装店倒闭了，很多人在网上买，为什么？更便宜。


    这个社会变化很快，以前同行之间视为冤家，老死不相往来，如今互通互联。如果你是真的有价值的，你的舞台会更大，你的机会更多。


    这个时代是真正有价值的人的狂欢时间。


    每个人都在坐井观天。位置决定角度，角度决定观点，观点决定世界观，而世界观决定了你的世界。


    听懂这句话顿悟商业真谛：


    ![](img/bfda52d6c5cdfa68d525dc14d6d5ffc7_98_0.png)


    所谓导师，就是站得比你高，看得比你远。你出门旅游，不管你是多大的官，多有钱，一个小小的导游都可以领导你，为什么？因为这个地方他来过，你没来过！


    如果在森林里你发现了两条路，一条是弯弯曲曲的小路，一条是笔直的大道，你选哪一条？用第一感觉去判断。


    正确的做法是：你爬到一颗大树上，从高处看，看看哪条路能通往你的目的地，不是说“欲练神功必先自宫”，而是先看清楚，“横看成岭侧成峰，远近高低各不同”、“不识庐山真面目，只缘身在此山中”。


    你现在看不见，你的对也只是在你的世界里，你的眼界就是你的境界，这就是局限。


    互联网是改变人类进步最大的发明之一。借助互联网，人与人的沟通加快了，不止如此，轻轨、动车、高铁、飞机、私家车，随着众多的交通工具出现，人与地域之间的距离也被拉近了。


    还有一个很大的变革：快递拉近了人跟货物的距离。所有生产工具的变革就导致社会关系发生的重大的变革，要么主动改变，绝处逢生，要么你就等着被革命！


    连三大运营商，短期之内就被微信给革命了。你以为微信很好过吗？不知道哪里的一个十来岁的小孩发明一个跨时代的工具可能就把微信给革命了。


    这年头，老革命总是被新人给革命了！


    曾经的世界第一，诺基亚和柯达，不也被革命了吗？

    所以我们今天好好琢磨一下，全国的大公司，第一名不是被第二名干掉的，而是被别的领域干掉的。

    未来所有的盲人会把自己摸到的大象碎片上传到一个云端，互通互联，拼成一张拼图，叫做全世界！


    请你好好思索一下，你的框架能做多大取决于你能装多少人进来，甚至跨行业、跨领域的装更多人到你的框架来。我们永远不是靠权力、魅力领导别人，永远是靠我们的系统，

    用我们的顶层设计中能满足别人的最佳利益来领导别人。

    历史上多少次农民起义，没有几次是做大的，太平天国算是大的，包括陈胜吴广为什么失败了？他说过：“王侯将相，宁有种乎？”

    换而言之，为了自己当上皇帝，他的出发点考虑的就不是所有人的最佳利益。

    中国历史上所有的革命里，最成功的就是共产党。因为他们的信仰是什么？解放全人类、实现共产主义社会。

    是什么呢？初中的政治老师讲了，共产主义社会就是：住


    房不花钱，看病不花钱，吃饭不花钱。这就是最佳利益。


    我们需要的是利他！


    《周易系辞下》记载：何以聚人，曰财。


    透过满足每一个参与方的最佳利益，你可以牢牢地凝聚每

    个人。


    曾经有学员问：“一诺老师，看你每天这么忙，应该没空闲时间吧？”


    一诺老师的回答：“人只要活着就有时间，我有很多时间，只是我的时间并不属于我自己，是属于使命和责任，有使命就有时间。因为责任，我们需要在有限的时间里，去做更多有价值的事，和帮助更多的人实现人生的价值！”


    ### 第02节 最小风险


    抢银行收益高，但是风险大，所以很少有人做。我给了你最好的好处，你怎么还不参与呢？因为你不想承担风险。


    牵一发而动全身，你只要做事，就一定有消耗，有消耗就有代价，有多大的动作就有多大的风险。


    打麻将下多大的注，就有多大的赢面，当然风险也随之放大。


    我们赚钱有一个捷径，就是你只要活得足够久，你一定能赚很多钱。不怕赚得少就怕死得早，留得青山在不怕没柴烧。


    李嘉诚说：别人都在考虑如何成功，我考虑的是如何避免失败，所以我做了各种预案来避免失败。


    在中国，做企业通常有三种死法：小企业死在市场竞争中，中企业死在融资中，大企业往往死在政商关系当中。


    做生意首先考虑的是怎样保住本金，可是和你合伙的人他们也想保住本金，你想安全他们也需要安全。


    我告诉你，谁做大哥，谁就承担最大的风险，同意吗？犯罪团伙的首犯判得最重，当然，干成了收益也是最大的，成正


    比。


    如果你不想承担风险，那么你就要思考如何规避、转移、

    消除和降低风险。


    ### 第03节 最简单


    人的天性，喜欢简单。


    在做顶层设计的你，听懂这句话顿悟商业真谛：


    ![](img/bfda52d6c5cdfa68d525dc14d6d5ffc7_104_0.png)


    考虑的时候要兼顾每一步，要做长远周期的整体规划，而做的时候要做起来会最简单，要分解流程。


    所有的事情为什么能做成，是每一步简单动作，链接在一起组成一个复杂的系统。分解每个环节，到每个人都能做成。


    如果有一种记忆的方法让你两秒钟轻松记住任何电话号码，你愿意吗？


    这就是人性！


    傻瓜相机出来就多了一批摄影师，如今每个手机用户都成了摄影师，都玩起了自拍，对吧？因为太简单了。


    我们谈到，要满足每个参与方的最佳利益、最小风险、最


    简单、还要最平衡，这样才能做到大家好，才能和更多人达成共识。大家好才是真理，投票选举也是满足大部分人的价值观，能否成功取决于和多少人达成共识。


    把这句话记下来：


    先把原则搞清楚，如果顶层的道偏了，后面的术肯定是歪的。


    ### 第04节 最平衡


    所有的商业模式，设计的时候都要保持平衡。


    什么叫平衡？


    比如，咱俩合作，被你给坑了，这平衡吗？


    不平衡。


    你知道吗，牢里关的都是好人。可是好人怎么会被抓起来呢？


    每个动机都是好的，每个人都会选择当下对自己最佳利益的行为。


    请问你，抢劫犯的动机是什么？钱！贪污犯的动机是什么？钱！你做生意这么付出，这么辛苦，你的动机是什么？钱！


    可见你们的出发点都是一样的！


    请问，抢劫犯抢了 100 万，受害人损失了 100 万，这平衡吗？


    不平衡。


    还有，小偷偷了 100 万，受害人丢了 100 万，这平衡吗？


    也不平衡。

