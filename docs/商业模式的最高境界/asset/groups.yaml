    ## 第02节 吸粉七步走


    移动互联网时代的到来，意味着人们进入了碎片化的时代，信息源和传播源在快速分化，受众也在快速分化，圈层效应明显，从前的单向传播变成了多点对多点的分散传播。


    消费者在逐渐成熟，也在逐渐改变。这个时代他们不再是客户，而是“粉丝”。


    本书的主题是商业模式顶层设计，这里不教你如何作自媒体营销。此类书籍在世面上也多如牛毛。当然，如果有机会你能学到一诺老师《营销的最高境界》，奇迹会在你身上出现。


    为了能够通俗易懂地让大家理解，本小节将吸粉分解成7个具体的流程。按照下面7个步骤，每个企业、每个人都可以建立自己的粉丝。


    ## 吸粉七步法:


    目标用户→生活场景→粉丝入口→合作方式→鱼饵诱惑→扫粉关注→完善名单


    ### ➢ 第一步：目标客户


    你需要先明确你的目标客户是谁，你需要研究他。


    比如说，我让你去广州找个人。你会问：“找什么人？”


    我说：“找一个女人。”


    你会问：“找一个什么样的女人？”


    我告诉你：“找一个长头发的女人，这个女人长发及腰，她穿一身红色风衣，戴着黑色的墨镜，而且每天晚上9点钟会准时出现在天河体育馆东门前。”


    你看，我这样一描述，你是不是就很容易找到她了？


    营销中，你最容易犯的一个错误就是，并没有清晰界定你的目标客户是谁。


    如果你没有明确目标客户，那么你的营销人员就不知道去哪里可以找到他们，同时你的广告媒体无法精准选择，导致广告投放的严重浪费，等于把大把的现金扔进了臭水沟里。更重要的是，白白浪费了自己宝贵的精力，从而把大好的时间浪费在众多无用功上面。


    正确的做法是：明确你的目标客户是谁。


    弱水三千只取一瓢，城有所不攻。


    即便你可以服务每个人，但是不见得你真的要服务每个人，你只能把自己有限的资源集中在目标客户身上，就是那些迫切需要你的人，而且他们有足够的支付能力来购买你的产品和服务。你的任务就是，找到他们，成交他们，服务好他们。


    你永远无法取悦每个人，因为你不是钞票。你只能找到那些需要你、喜欢你的人、而且你也喜欢的人，这样的关系才能创造彼此的幸福。


    那些恨你的人，请继续…


    那些讨厌你的人，请继续…


    那些你不喜欢的人，请继续…


    那些不爱你的人，请继续…


    那些你不爱的人，请继续…


    你不需要改变他们，你只要让爱你的人和你爱的人更幸福，就够了！


    1992 年 11 月 3 日，民主党总统候选人克林顿在大选中击败时任总统、共和党总统候选人布什，从而当选为美国第 42 任、第 52 届总统。那一年，克林顿的得票率为
    43%！


    也就是说，你就算当了总统，也会有全国 57% 的人不能接受


    你，何况你还不是总统呢！


    看完这组数据，请你不要沮丧，更不要难过，转个思路，


    你何必计较剩下的那些不属于你的 57%呢？你只要锁定那属于你的 43%的粉丝，服务好他们就足够了。


    所谓幸福，就是庆幸你已经得到的，而不是沮丧你没得到的。


    怎么明确用户？就是你想锁定什么样的粉丝。


    对于粉丝有下面 3 个标准：高需求度、高购买力、高决策权。


    ### 什么是高需求度？


    例如，你要卖一套渔具，现在有三个用户：第一个用户是正在收看钓鱼节目的人，第二个用户是明年打算去钓鱼的人，而第三个用户今天下午就打算钓鱼。你认为谁更容易成交？


    没错，就是第三个人，因为他需求迫切，不需要你经过漫长的培育。


    有个烟鬼去医院戒烟，医生问他：“10 年前我就让你戒烟，为什么今天天才来呢？”


    烟鬼说：“因为那时还没得肺癌！”


    为什么有些客户总是特别容易成交，他们一看到你的产品就扑上来买？因为他们已经饥饿很久了，已经痛苦很久了，终于看到了解决方案，所以迫不及待，根本不用你说服，而且几乎没有抗拒。


    记住：去找最饥饿的鱼！


    ### 什么是高购买力？


    用最俗的话说，就是有钱人。赚钱最好赚有钱人的钱，赚穷人的钱太累了，就好像从蚂子腿上刮油，劳心费力，所得无几。


    夫妻两口子卖大白菜，卖一颗白菜能赚几分钱，从早上天刚蒙蒙亮出发，一直晚上月亮出来才回家，关上门数毛毛钱的时候才发现，辛辛苦苦卖了一个月白菜的收入，不如人家卖钻石的店卖了一颗钻石的价值。


    ### 为什么要锁定高收入人群？ 8个理由：


    - （1）他们有购买力，能够买得起，而且能够持续买得起；

    - （2）毛利高


    你可以让利给很多人，所以你的合作伙伴多，而且合作伙伴


    伴的质量也很高，因为他们要匹配你；


    # （3）高端客户背后的资源比较多


    服务村民跟服务村长，背后的资源是不一样的，服务村长


    跟服务首长，背后的资源更加不一样。通过高端客户背后的资


    源，会有多重获利的地方；


    # （4）高端客户的忠诚度比较高


    低端客户没钱骑自行车，有钱之后就换车了。


    可见，低端客户一旦他有钱了，购买能力提高了，审美观


    提升了，立刻就转投别人的怀抱了；


    # （5）高端可以带给你更多便利和附加值


    你会比较容易引起媒体的追捧、同行的羡慕、员工的爱戴、


    客户的尊敬；


    # （6）客户满意度高


    毕竟高端客户不像低端客户那么多数量，相对比较少，那


    么服务起来比较容易，而且你可以集中更多的资源服务客户，


    从而提高客户满意度；


    # （7）比较自由


    毕竟高端客户三年不开张，开张吃三年，所以会有更多时间来享受生活，这不正是赚钱的意义之所在吗？


    （8）有更好的圈子，更聪明的朋友、更有能量的朋友、更有资源的朋友


    因为是高端，他们会匹配你，你会过着谈笑有鸿儒，往来无白丁的优雅生活。


    尽管还有很多理由，但是不必多说了，你已经完全明白为什么要选择高购买力的客户了。


    有一个理财大师，专门教别人如何把信用卡漂白，那些刷卡刷爆的人经常接到银行的催款电话，他们很痛苦，所以跑来参加这个大师的课程，因为透支信用卡的穷人很多，所以这个大师有十几万个粉丝。


    但是他恨死了这些客户，因为他们总是在成交时拿不出更多的钱来。


    记住，我们要找最肥的鱼！


    什么是高决策权？


    就是说话算数，能做决策的那个人。


    有个小伙谈恋爱，发现女生凡事都听她妈的，那么求婚的时候，你认为该找谁？没错，她妈！


    有多少次你的客户跟你说：我要跟老婆商量一下，我要跟老板商量一下，我要跟董事长商量一下，我要跟股东商量一下…


    见鬼！你找错人了好吧。


    今天你谈一笔大型贸易采购，跟你谈判的是采购员，把关的是技术员，使用的是工人，拍板的是老板，结账的是财务。


    请问，谁是你的客户？对方的决策权被分散了，决策范围限于自己的那块，如果有一方没搞定，可能你的这笔生意就黄了。


    可是你知道吗？无论多么复杂的一个客户，最终是由一个人说了算的。即便是一伙人说了算，也一定有一个最终做主的。这个人就是关键人物，射人先射马，擒贼先擒王，你要先搞定那个人。


    记住，请找到“头鱼！”


    ### 第二步：生活场景


    当你锁定目标用户之后，更进一步，你需要了解用户的生活场景。也就是说，你需要知道用户们经常在做些什么。


    我们要有一双火眼金睛，透过现象看到本质，找渠道要找到本质，本质是客户的生活方式，在哪个地方待得多，渠道就在哪。


    比如说，他们几点起床？几点睡觉？读什么书？看什么杂志？读什么报纸？上哪些网站？上网浏览哪些关键词？喜欢收看哪些电视台？喜欢收听哪些广播？买什么品牌的衣服？开什么车？经常去哪里购物？在哪里待遇比较多？在哪里平均待多久等等这些貌似没营养的问题。


    越了解他们的生活方式和生活场景，就能清楚的知道在哪里找到他们，同时你的营销也就会越准确，直达目标，有的放矢，精确狙击。


    遗憾的是，今天越来越多的企业老板，已经不愿意进入客户的世界，他们更热衷于应酬银行行长、政府官员、风投。他们的屁股离老板椅越近，就离用户越远，直到有一天粉丝抛弃了他们，他们才明白，是自己先抛弃了粉丝。


