    上面的案例，是以过滤器作为关联引流产品，如果你还记得上一章的内容:销售少儿英语点读机以少儿英语单词点读卡作为引流的产品，其实也属于关联切入类引流产品的范畴。


    ## 案例：做爆超市人气的策略


    超市吸引客流最常见的手段相信你并不陌生,低价卖鸡蛋已经成了大多数超市经营的必选策略。


    鸡蛋在这里的就承担了 “关联切入类引流产品” 的角色。


    经常用鸡蛋来引流的策略虽然屡试不爽，但是依旧有两个不可否认的弊端。


    第一，消费者并不会每天都来买鸡蛋。


    由于鸡蛋的保存周期比较长，所以，很难把进店的频率做上来；


    第二，大多数人并不会无缘无故买一些鸡蛋回家。引流人群会有一定的局限性。


    到底有没有更好的关联切入类产品呢？当然有，包子馒头就是非常厉害的替代产品，尤其是以面食为主的北方市场，更加具备杀伤力。


    具体如何操作呢？


    很简单，把当地比较好的包子铺都筛选出来，然后每天把这些包子大规模的批发过来，并按照稍微低于批发的价格，在超市以每人限购 4 个的形式进行销售。瞬间就能提高进店频率及打破进店人群的局限性。


    我的一个学员孙总，在参加完商业顶层设计课程之后，自己做策划，取得了不错的反响。下面是他引爆超市人气与销售额的关联切入类引流策略。


    这是一家准备开业的中小型超市，当初预计在开业当天可以达到 5 万的营业额，但没想到的是，仅通过一个简单的策略，却轻松实现了 11 万多的业绩。


    孙总表示，当初他只是给超市提了一个建议“一提抽纸 8 包，拿一包免费送，剩余 7 包，原价 9.8 元，现价只要 6.8 元”。


    没想到就这样一个思路，第一天就卖出了 1300 多提抽纸，免费领取不购买剩余抽纸的不到 50 个。人气一上来，固然就带动了其他产品的消费，轻松就完成了超越预期的销售业绩。


    ## 第07节 打造会员资格类引流产品


    人们都渴望得到某种特殊的身份待遇，或融入到某个有价值的圈子，基于这样的需求，在打造引流产品的时候，完全可以通过巧妙的整合，策划出一个特殊的会员身份，塑造价值并明码标价，然后，通过精准鱼塘免费赠送，获得大量会员。


    下面通过几个案例让你明白会员资格类的引流产品是如何打造的。


    ### 案例：大闸蟹店的顶级会员卡方案


    由于大闸蟹的成本相对比较高，如果采取免费送大闸蟹作为体验引流手段，送少了没有吸引力，送多了又违背了低成本的原则，所以，很多店并没有找到有效的引流方式。


    有一家大闸蟹店却采用了不一样的拓客手段，他们为了快速吸纳大量的顾客，开设了一个顶级会员资格，只要持顶级会员卡到本店消费，啤酒和饮料都是任意免费喝，然后，把会员卡通过老客户转送和对接精准渠道的形式免费赠送，非常短的时间就获得了几千个会员，做到生意爆棚。


    要知道，非会员去大闸蟹店消费，饮料和啤酒都是需要支付现金的，但是有了这张卡就不一样了。对于持卡人来说，身份感瞬间提升了，并且，通过测试，啤酒饮料喝得越多，消费就会越多。我们都知道，大闸蟹和其他菜品的消费肯定不低，啤酒饮料的成本很容易就分摊掉。


    ### 案例：高端女性消费类商家的联盟引流模式


    高端美容店、化妆品店、服装店、箱包店、鞋店、咖啡店、美甲店等，整个链条的商家所需要的目标客户，几乎是同类人群，可惜的是，很多店并没有意识到联盟的威力，而是每家店各自每年投入大量的广告宣传，少则几万，多则十几万。


    其实，他们完全可以把广告费省去，每家店拿出三万元，10 家联合在一起，用 30 万的资金，成立一个高端女性生活俱乐部。


    在俱乐部定期举办培训和聚会，比如，女性气质培训、化妆培训、服装搭配培训、葡萄酒会等，把俱乐部的会员资格塑造为 3000 元每年的年卡，对接精准鱼塘，让塘主当作回馈的福利免费赠送，便可以获得大量会员。


    所有会员由 10 家店共同维护，并且，持俱乐部的会员卡到这 10 家店消费，都可以享受顶级待遇。


    更重要的是，俱乐部还推出一项政策，只要在俱乐部的联盟商家消费累计满 300 积分，第二年的会费全免。比如，消费 100 元可累计 20-30 积分，如此一来，俱乐部的会员资格又成了联盟商家促成成交和锁定会员消费的筹码。


    ## 第08节 打造抽奖券卡类引流产品


    什么是抽奖券卡类引流产品？


    有诱惑力的抽奖或代金券，都可以刺激人们的行动欲望，是商业模式顶层设计高手们常用的引流赠品形式。


    对于抽奖来说，奖品越有诱惑力、中奖率越高、抽奖次数越多，越能促使人们参与。同时，价格透明的产品，运用代金券，也能够立刻促使人们行动，在实践过程中，将代金券和抽奖卡同时配合使用威力更大。


    更多绝学课程请咨询微信xi383921,备注：咨询！


    ### 案例：新开童装店的引流卡策略


    我的团队曾帮某童装店设计过一张抽奖券卡，上面有“活泼、阳光、有范，让你的孩子魅力四射”的广告语，然后，左侧还配有一张童装店的服装照片，这些内容都是用于刺激目标受众美好的联想。


    最主要的是，右侧三条具有诱惑力的规则组合：


    - 持卡可到本店享受三次抽奖机会，一等奖：儿童学习平板一台；二等奖：童装一套；三等奖：游乐场门票三张。


    第一条,抽奖的营销形式为何经久不衰,取决于两个方面。第一，在高诱惑奖品的刺激下，人们都是心存侥幸的，所以，参与度一般都会很高；第二，站在商家自身来看，由于中奖的比例有限，低投入就能吸引大量的人气。


    本案例中的高诱惑奖品，就能刺激目标顾客的欲望，如果一位妈妈拿到这张卡，今后给孩子买衣服时，是不是也会优先到这家店碰一下手气。


    第二条，持卡可以到童装店兑换 10 元现金抽完奖之后只需要留下这张卡，还可以兑换 10 元现金，不需要任何额外消费。有了这个价值点，卡的诱惑力就更大了。


    为什么还要加上现金呢？如果你还记得前面买客户思维的计算逻辑,应该就会明白,相当于花 10 块钱买进一位客户,如果维护一位顾客的好关系,1 年从她身上赚到 500
    元,那么,吸引 50 位潜在顾客进店，维护锁定一位就不赔钱，锁定两位就赚了，这是完全没有风险的高额回报。


    不过也有学员测试，将金额降低到 5 元的时候，同样能够吸引目标顾客进店。


    第三条，如果不兑换现金，还可以直接增值抵 30 元购买任意童装。这种增值抵现的促销手法，是为推荐衣服打下的铺垫。告诉对方：持卡仅今天1次机会，没有卡片的，新老客户一律原价。


    你可以站在目标顾客的角度思考一下：假如小孩的妈妈拿到这张卡，会扔掉么？会置之不理么？在考虑给孩子买童装的时候，是不是一定会优先到这家童装店？事实证明确实如此，这就是抽奖券卡的威力。


    假如你是卖电器的，也可以同样的方式操作。比如，持卡可以到本店享受了3次抽奖机会。一等奖，空调一台；二等奖，微波炉一台；三等奖，豆浆机一台；幸运奖，超值礼包。


    抽完奖之后，凭卡还能领到15~20元现金，不兑换现金，可抵50元购买电器，是不是也会吸引目标客户优先到你店里来？何必一年花掉数十万的广告费做漫无目的的宣传呢！


    当然，抽奖券卡的发放途径一定要准确，绝对不能在大街上随意的乱送，否则，吸引过来的估计全都是占便宜的老人家。（在后面的章节会专门教你如何对接精准客户）


    操作以上策略时，要留下持卡顾客的联系方式，或让对方加微信后才能参与活动，以方便持续沟通和跟进，才能做后续的适时促销。


    留下联系方式或加微信的理由是“老板需要验证，如果没有验证，我们是要罚款的，因为验证才能防止虚假抽奖和领取现金”，用这样的理由基本上无漏网之鱼。


    ### 案例：引爆购物商场的超级抽奖模式运作方案


    前面我们提到，奖品越有诱惑力、中奖率越高、抽奖次数越多，越能充分激发人们的侥幸心理。


    接下来教你一套超级抽奖模式，不仅可以用于引爆商场的人气，各种促销展会、联盟砍价会等都可以利用此模式进行带动。


    下面通过一段对话，让你明白超级抽奖模式的运作方式。


    学员：老师，新开购物商场人气不旺，如果用传统的广告宣传，效果肯定一般，对于这种引爆人气的策划活动，您有没有什么好的建议？


    老师：既然是商场，肯定有很多商户已经入驻了吧？


    学员：对，商户租赁铺面，由商场统一管理。


    老师：像这种购物商场的人气引爆，最有效的方式就是运用超级抽奖模式！


    学员：什么是超级抽奖模式？


    老师：直接说操作步骤（如下），你就能够明白它的威力。


    ### 第一步，联合采购奖品及工具打造


    - （1）假如商场有 100 个商户，每个商户拿出 400 元的活动经费；

    - （2）用 10-20 元的成本采购奖品，至少可以放大到 20-40 元的价值，奖品可以从外面采购过来，也可以商场内部商家自己提供，采购的奖品分别摆放在每个商家店门口的桌子上，形成直观的诱惑。


    假如每个商家拿出经费中的 300 元采购奖品，整个商场至少有 1500-3000 份小奖品，把剩下的 100 元经费分成 50 份，每份 2 元，把 2 元置于红包内作为幸运奖，那么，100
    个商家就有 500 份幸运奖，加上前面的奖品，整个活动就有 6500-8000 份奖品，中奖之后拿奖券到对应商家领取即可。


    - （3）每 4 个店为一组，在门前放置一个抽奖箱，100 家店就有 25 个抽奖箱，25 个抽奖箱就代表着每个人有 25 次抽奖机会。确定抽奖剩余次数的方法就是，每个顾客发一张印有
    25 个格子的名片，命名为抽奖次数卡，每个抽奖箱抽一次奖，就用笔在格子里面画一个叉。


    （4）为本次活动命一个主题，比如『抽奖购物狂欢节』，印刷 1 万张 PVC 材质的活动邀请卡，持卡过来可以不用消费就能参与抽 3 次大奖和 25 次小奖的机会。


    在卡上注明，本次活动共发放 1 万张邀请卡，活动奖品数量共 8000 份，活动奖品有……，如此一来，通过抽奖次数、中奖率和奖品的诱惑，就能有效刺激持卡者的行动欲望。


    印刷和制卡费用直接找赞助，收回成本即可，邀请卡、奖券及抽奖次数卡的背面绝对是高频率关注的黄金广告位。


    ### 第二步，整合大宗奖品


    前面提到持卡可以抽 3 次大奖，大奖的奖品如何来呢？当然是通过整合的方式获得。


    要知道，本次活动发行 1 万张邀请卡，为期 3 天的活动至少可以集中带动几万人气，那么，很多外围商家都可以借助本次活动，宣传与展示自己的品牌。如果展示？在大厅把产品摆上作为奖品即可。


    比如，卖家电的赞助一台微波炉、卖电动车的赞助一台迷你电动车、卖沙发的提供一套沙发、卖茶叶的提供几盒茶叶、按摩店提供 10 张 68 元的足浴按摩卡……依照这样的方式，至少可以整合几十个外围商家参与进来。


    ### 第三步，精准对接客流


    为了确定客户人群的精准性，邀请卡不能在大街上乱发，而是通过精准渠道进行投放，主要投放有 2 个方向：给商场商户安排指定数量的邀请卡发放任务，他们可以送给自己的亲戚朋友；跟互补商家、鱼塘等合作，让他们赠送给自己的客户，合作筹码是，活动期间赠送商场广告位。


    ### 第四步，建立数据平台


    活动当天，凡是持邀请卡过来的人，可以到大厅参与抽大奖，抽完 3 次大奖之后回收邀请卡，只需要关注商场的微信公众号，便可赠送 25 次抽奖机会，并获得【抽奖次数卡】。


    通过这个举动，便能顺利地留下了所有人的数据，拥有大量的粉丝，为后续整合礼品互动和促销推荐做了长远的铺垫。


    学员：厉害，活动居然还可以这样做！


    老师：如果只是做商场狂欢节的购物打折宣传，估计过来的人并不会太多，但是，在原有的活动折扣基础上，加上这种超级抽奖模式，人气必将引爆，试想一下，如果你拿到一张邀请卡，会不动心吗？尤其是女性拿到之后，还会带着朋友闺蜜成群结伴而来！


    看完上面的案例，相信你更进一步感受到了抽奖的威力，当然，这仅只是抽奖模式的一种，在商业顶层设计高手研习社还有更多巧妙的模式。


    ### 案例：家具城引爆销售的代金券模式


    以下是我在学员辅导群的一段对话，被学员整理出来了，现在分享给你，相信能够启发到你的思维。


    赵总：老师，我同学是地级市美的总代理，以前做展销会销量挺好，采用的销售入场券模式，现在人都疲勞了，有什么办法可以对接鱼塘吗？


    老师：刘总也认识一位美的电器的代理，曾经也去用代金券对接鱼塘，结果如我们所料想的一样，没弄来一个人。


    赵总：代金券不可用？


    老师：不是代金券不可用，关键要看代金券怎么用！


    赵总：他是在大型商场开设的销售专卖店，老师请指教。


    老师：那家美的电器的老总执意要用代金券的时候，许总就劝过他，并且，已经给他断言没有任何效果，当初他不听，最终的结果，果然不出所料，由于几个点的原因，导致没有任何效果。


    赵总：哪几个点呢？


    老师：第一、对接鱼塘时，鱼塘的塘主拿到代金券之后，根本感觉不到代金券能够给他带来任何具体的价值，既不能通代金券帮他促成成交，也不能促进引流，唯一的感觉，就是在帮美的电器做宣传。所以，开始可能碍及面子答应了，但这些代金券发出去的概率是非常小的，后来，美的电器老板做回访的时候，结果确实是这样，别人几乎没有帮他发。


    第二，就算代金券发到了目标客户手上，他们并不会认为有多大的价值，而且给人的感觉就是，羊毛出在羊身上，你发代金券给我，肯定是美的电器给你提成了，像这样的代金券跟宣传单上的打折促销没有任何差别，所以，就算是拿了代金券，也没有人去询问。


    赵总：那老师给点建议。


    老师：像这种代金券的活动，以前做得比较成功的(包括家电、家具、灯饰类等)基本上采取地运作方式是这样的：


    （1）通过宣传广告，在地面提前宣传预热，让大家都知道将在几月几日有促销活动。


    印刷一批限量的代金卡，卡片必须高档，可以是 PVC 材质，并标注好这张卡片的价格，比如，“此卡零售价 10 元，不需要此卡的，活动当天可以 10 元回收，有购买需求的，持卡可以在活动折扣价的基础上，再抵
    xx 元现金消费”。


    也就是说，活动当天，只要持卡过来，在地面宣传的促销折扣基础上，还能无条件享受到优惠；


    （2）对接精准鱼塘当作回馈的赠品免费赠送，发放 300 张卡出去，相当于对接了 300 个精准客户，做好领卡人的联系方式登记，以便后续跟进。


    卡发出去之后，在活动开始的前一周分 3 轮主动联系潜在客户：第一轮短信通知，告知对方准时参加活动；第二轮短信通知，也是类似的提醒；在活动倒数两三天时，客服打电话做第三轮通知，电话表明的意思是：


    这张卡片的数量是有限的，现在还有很多人想要获取，如果到时候您没有购买的需求，可以活动当天来本店以 10 元的价格回收或转让此卡，给其他有需要的人，如果有购买需求，请一定妥善保管，可以获得区别于普通顾客的优待。以上流程就是提前宣传和活动蓄客的过程！


    持卡的人在活动当天，会有很大比例过来看看，就算是自己暂时没有需求，也会把卡送给自己身边有需求的朋友。以前我的一位学员帮助一家家私城，按照上面的运作方式，活动当天，从晚上7点到9点，仅2个小时，销售额就达到了40多万！


    赵总：谢谢老师，我以前每次做活动都能卖出一千多张代金券，但是退回来的得有三分之一。


    老师：退了好像也没问题吧！


    赵总：我们以前就在商场那个专卖店卖代金券，然后二百号员工，每人十张的任务。当然也有很多完不成的，活动太频繁了。


    老师：“送礼+增值+回购”的代金券形式，在实践中威力还是挺大的，不过对接的目标客户需要绝对的精准。如此，花50块钱购买我们的代金券，送你一份80元的礼品，同时，这张代金券还可以抵300元使用。


    如果活动当天你用不到的话，可以50元现金回购代金券，礼品依旧可以保留，这种代金券的销售速度是非常快的，也是一种买客户的思维方式。80元的礼品，成本或许只有30元，也就是说，如果一单能够赚1000元，来33.33个精准客户，成交一个就不赔钱。


    赵总：礼品好说，厂家支持，对接精准目标客户有什么建议？


    老师：鱼塘对接就行了，比如，需要装修房子的业主在购买电器之前还需要购买其他产品，他的前行者就是精准鱼塘，如果鱼塘塘主不愿意跟你合作，你就可以直接找鱼塘的业务员合作，捆绑一定的利益机制，让他帮你送就行了。


    还有一种代金券策略：如果你的产品销售价为 50 元，那么，在促销期间可以打出 “消费 50 元送 5 元现金” 的主张。也就是说，消费 50 元购买我们的产品，退
    50 元现金到你的会员卡，这 50 元可以在活动结束之后，再购买其他的产品抵现金使用。


    赵总：这个可以考虑。


    老师：如果你的感觉消费 50 返 50 大多了，可以返 40、30 都可以。


    赵总：返的钱是充值到会员卡里吗？


    老师：是的，而且是活动结束之后，才能再次使用。


    赵总：谢谢老师！


    最后延伸说明一下代金券的引流，有价值衡量标准或价格透明的产品，不需要抽奖，直接用代金券也是非常不错的引流方式。比如，平常 68 元的足浴按摩，现在持券可以抵
    5 元消费，就非常具有诱惑力；平时 68 元每斤的小龙虾，现在持券可以抵 40 元现金，限购两斤，也能促使目标客户欲罢不能。


    ## 引流卡的设计


    用引流产品对接精准客户渠道(鱼塘)时，要想尽一切办法获得跟他们接触的机会。


    所以，作为领取产品的凭证卡(引流卡)就成了吸引目标客户的关键环节。


    引流产品的种类有很多，引流卡的设计方式也不尽相同，但是，不管做什么形式的引流卡，材质一定要好，设计要有档次，绝对不能用名片纸质，整体设计不能低级花哨。


    我们在指导别人做引流卡的时候，都会建议用 PVC 材质或纸质比较厚的代金券，如果找到好的印刷渠道，成本并不会太高。


    ### 抽奖代金卡设计要点：


    这里带你分析它所具备的核心元素。


    核心元素 1：店名必须设计上去的，这代表着你的品牌，在店名下面的广告语是必不可少的，一句攻心广告语能够让目标受众直观感受到给他带来的价值，比如，“阳光、活泼、有

    '
  mdcn: '

    医院、学校、商会或企业家俱乐部都能找到这些人的身影。


    只要把“过滤器免费上门安装卡”送给这些单位，医院和学校可以用来发福利，商会和企业家俱乐部可以作为上缴会费的回馈，就能轻松对接到这些目标人群，且让他们主动打电话给你，要求上门安装。


    然而，并不是上门安装过滤器就能把净水机推销出去的，还必须设计好一系列教育与成交的流程。


    在安装过滤器的同时，为了提高成交率，可以带上平板电脑，给客户播放一段几分钟的不洁净饮用水造成身体危害的宣传片，过滤器安装完，宣传片也基本看完了，借着宣传片制造的恐慌，顺利引导出话术：


    “刚刚我给您安装是水质过滤器，只能起到过滤一些大颗粒杂质的作用，要想做到宣传片中的毒害物质净化，还必须进行更深层次的处理，您跟我来，这里是一些水质测试纸，我来帮您检测一下水质。”


    通过水质测试纸的检测，立刻就能让目标客户直观判断出水质的毒害，同时引导出第二段话术：


    “这样吧，如果您重视水质健康的话，我帮您免费深层净化一个星期，您看如何？”


    只要客户答应,就立刻把楼下车上的净水机搬过来安装好，并说：“这是我们公司让水质深层净化、营养的净水机，我给您接上，我们再来测试一下净化后的水质。测试完之后，前后的对比立刻就显现出来了。”


    这时候告诉潜在客户,这台净水机可以免费给他安装一个星期，然后，送一些测试纸，让他每天进行对比测试，让他有一个自我强化教育的过程，最后，在一个星期之内，给他一些促销政策，便很容易促成净水机的成交。


    上面的案例，是以过滤器作为关联引流产品，如果你还记得上一章的内容:销售少儿英语点读机以少儿英语单词点读卡作为引流的产品，其实也属于关联切入类引流产品的范畴。


    ## 案例：做爆超市人气的策略


    超市吸引客流最常见的手段相信你并不陌生,低价卖鸡蛋已经成了大多数超市经营的必选策略。


    鸡蛋在这里的就承担了 “关联切入类引流产品” 的角色。


    经常用鸡蛋来引流的策略虽然屡试不爽，但是依旧有两个不可否认的弊端。


    第一，消费者并不会每天都来买鸡蛋。


    由于鸡蛋的保存周期比较长，所以，很难把进店的频率做上来；


    第二，大多数人并不会无缘无故买一些鸡蛋回家。引流人群会有一定的局限性。


    到底有没有更好的关联切入类产品呢？当然有，包子馒头就是非常厉害的替代产品，尤其是以面食为主的北方市场，更加具备杀伤力。


    具体如何操作呢？


    很简单，把当地比较好的包子铺都筛选出来，然后每天把这些包子大规模的批发过来，并按照稍微低于批发的价格，在超市以每人限购 4 个的形式进行销售。瞬间就能提高进店频率及打破进店人群的局限性。


    我的一个学员孙总，在参加完商业顶层设计课程之后，自己做策划，取得了不错的反响。下面是他引爆超市人气与销售额的关联切入类引流策略。


    这是一家准备开业的中小型超市，当初预计在开业当天可以达到 5 万的营业额，但没想到的是，仅通过一个简单的策略，却轻松实现了 11 万多的业绩。


    孙总表示，当初他只是给超市提了一个建议“一提抽纸 8 包，拿一包免费送，剩余 7 包，原价 9.8 元，现价只要 6.8 元”。


    没想到就这样一个思路，第一天就卖出了 1300 多提抽纸，免费领取不购买剩余抽纸的不到 50 个。人气一上来，固然就带动了其他产品的消费，轻松就完成了超越预期的销售业绩。


    ## 第07节 打造会员资格类引流产品


    人们都渴望得到某种特殊的身份待遇，或融入到某个有价值的圈子，基于这样的需求，在打造引流产品的时候，完全可以通过巧妙的整合，策划出一个特殊的会员身份，塑造价值并明码标价，然后，通过精准鱼塘免费赠送，获得大量会员。


    下面通过几个案例让你明白会员资格类的引流产品是如何打造的。


    ### 案例：大闸蟹店的顶级会员卡方案


    由于大闸蟹的成本相对比较高，如果采取免费送大闸蟹作为体验引流手段，送少了没有吸引力，送多了又违背了低成本的原则，所以，很多店并没有找到有效的引流方式。


    有一家大闸蟹店却采用了不一样的拓客手段，他们为了快速吸纳大量的顾客，开设了一个顶级会员资格，只要持顶级会员卡到本店消费，啤酒和饮料都是任意免费喝，然后，把会员卡通过老客户转送和对接精准渠道的形式免费赠送，非常短的时间就获得了几千个会员，做到生意爆棚。


    要知道，非会员去大闸蟹店消费，饮料和啤酒都是需要支付现金的，但是有了这张卡就不一样了。对于持卡人来说，身份感瞬间提升了，并且，通过测试，啤酒饮料喝得越多，消费就会越多。我们都知道，大闸蟹和其他菜品的消费肯定不低，啤酒饮料的成本很容易就分摊掉。


    ### 案例：高端女性消费类商家的联盟引流模式


    高端美容店、化妆品店、服装店、箱包店、鞋店、咖啡店、美甲店等，整个链条的商家所需要的目标客户，几乎是同类人群，可惜的是，很多店并没有意识到联盟的威力，而是每家店各自每年投入大量的广告宣传，少则几万，多则十几万。


    其实，他们完全可以把广告费省去，每家店拿出三万元，10 家联合在一起，用 30 万的资金，成立一个高端女性生活俱乐部。


    在俱乐部定期举办培训和聚会，比如，女性气质培训、化妆培训、服装搭配培训、葡萄酒会等，把俱乐部的会员资格塑造为 3000 元每年的年卡，对接精准鱼塘，让塘主当作回馈的福利免费赠送，便可以获得大量会员。


    所有会员由 10 家店共同维护，并且，持俱乐部的会员卡到这 10 家店消费，都可以享受顶级待遇。


    更重要的是，俱乐部还推出一项政策，只要在俱乐部的联盟商家消费累计满 300 积分，第二年的会费全免。比如，消费 100 元可累计 20-30 积分，如此一来，俱乐部的会员资格又成了联盟商家促成成交和锁定会员消费的筹码。


    ## 第08节 打造抽奖券卡类引流产品


    什么是抽奖券卡类引流产品？


    有诱惑力的抽奖或代金券，都可以刺激人们的行动欲望，是商业模式顶层设计高手们常用的引流赠品形式。


    对于抽奖来说，奖品越有诱惑力、中奖率越高、抽奖次数越多，越能促使人们参与。同时，价格透明的产品，运用代金券，也能够立刻促使人们行动，在实践过程中，将代金券和抽奖卡同时配合使用威力更大。


