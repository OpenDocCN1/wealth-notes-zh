  md: '# 今日报告：欧盟的天价罚单为什么不管用？

    ---

    《经济学人》


    尽管techlash在全球声势浩大，并不时开出天价罚单，但美国科技巨头既不听天高法度，欧盟也缺乏有效手段。


    面对美国科技巨头开出的天价罚单，看起来一张比一张更狠，但是，为什么没有效果呢？


    今天的议题分为三个部分：


    - 为什么说欧盟开出的天价罚单意义不大？

    - 欧盟能到哪里监管做到？

    - 欧盟能该怎么做？


    从去年开始，“techlash”就成了西方世界的一股新浪潮。我们都知道，techlash指的是对大型科技巨头公司的批评与抵制。


    《经济学人》在预测2018年世界趋势时，就说过，techlash会是2018年大败的力量之一。


    垄断、侵犯隐私、阻碍创新、对民主制度产生威胁，是西方媒体对美国科技巨头的主要批评点。这些年来，欧盟对这些科技巨头了开了不少批评——比如最近，欧盟刚刚就谷歌下达了一张43亿欧元的天价罚单，原因是原谷歌竞争对手针对安卓系统的垄断指控，挤压竞争对手，触犯了欧盟的反垄断法。


    43亿欧元，在一些老外们看来，是难以想象天价，就显得谷歌家大业大，被罚款也看看着很无所谓？但《经济学人》最近就发表了一组文章说，真实的情况，并不是这么回事。


    《经济学人》认为：尽管techlash在全球声势浩大，不时开出天价罚单，但美国科技巨头并不害怕，欧盟也缺乏有效手段。


    这句话也被我选为今天的金句：


    > Despite a global techlash and high fines in Europe, America''s online giants
    do not have much to fear from regulators. The European Commission''s remedies
    are wanting.


    一句话，欧盟如果想驯服科技巨头公司，要走的路还长着呢。


    我今天要给你的，并不是天价罚单的新闻，而是通过《经济学人》的分析告诉你，隐藏在一张又一张天价罚单背后的东西，即在今天对欧洲的所谓“inconvenient
    truth”——难以忽视的真相。


    ### 为什么说欧盟开出的天价罚单意义不大？


    对欧盟的天价罚单，《经济学人》给了一副评价，也是其中一篇文章的标题，叫：High Fines, Marginal Results。翻译过来就是，巨额罚款，效果甚微。


    而这背后的原因，《经济学人》认为，主要出在欧盟一招鲜，走偏了的思维定势上。


    为什么说这么说呢？我带你简单看几个欧盟开出的罚单记录，你就知道了：


    2008年，欧盟对微软开出了将近9亿欧元的罚单，原因是欧盟认为，当竞争对于想要微软微软专利授权，对其它厂商进行了不合理的收费，用来打压竞争对手；


    2009年，欧盟罚了英特尔10.6亿欧元，原因是英特尔利用自己的垄断势力，向戴尔、惠普这些大型电脑生产商提供折扣，让他们使用自家的处理器，排挤竞争对手AMD的产品；


    2017和2018年，吃罚单的“大户”是谷歌。谷歌去年就吃了欧盟一张24亿欧元的罚单，原因是原谷歌在用户购物的搜索中，优先显示自家的服务，排挤竞争对手，违反了欧盟的反垄断法，这张罚单也是当时欧盟反垄断史上最大的一笔罚单。'
  merge: -1
  img_proc: true
- pgno: 12
  md: '不能只会开罚单。罚款只是一个开始，接下来，欧盟应该针对科技巨头的行为，提出更强硬、更具体的执行要求。


    比如说，谷歌不是在智能手机安卓系统垄断么？设备制造商想用安卓系统，就得全套安装谷歌应用。那你就可要求，消费者在首次激活手机时，让他们自己选择要安装的默认软件，而不是像原来那样直接给人家预装好了，强制人家使用，要把选择权留给用户，这个有点像电脑让你自己选用哪个浏览器做默认浏览器的意思。


    再比如说，谷歌的手机应用只能在谷歌自己家的应用商店下载。那你就打断这个垄断链。让谷歌同意自家的应用进驻竞争对手的应用商店，这样就能提高其他应用商店的竞争力。


    第二个建议，是欧盟要提高执行力问题。《经济人》的看法是，欧盟你不能那么死脑筋，每次都是以耗时长久的罚单告终。欧盟应该追求短平快的胜利，一旦科技公司对竞争对手做了什么打压行为，马上出手解决。这样，才能真正的支持那些科技巨头公司竞争对手的发展，给他们足够的成长空间，让他们免于科技巨头公司的打压。


    # | 总结


    从《经济人》的角度来看，天价罚单只是欧盟反垄断、促进行业发展的第一步，但不应该是全部。正如金句所说：“尽管techlash在全球声势浩大，不时开出天价罚单，但美国科技巨头并不害怕，欧盟也缺乏有效手段”。


    总之，欧盟如果想要更有效地改善商业环境，就要制定更具体的措施、同时行动更迅猛才行。在这里，我想引用爱因斯坦的一句话来评价欧盟的天价罚单，他是这么说的：“疯狂就是一遍又一遍地重复相同的动作，却期待会有不同的结果。”


    好，今天留给你思考的问题是，你认为，欧盟是该极力打压科技巨头的垄断，还是应该放手，让它们自由发展？


    欢迎你留下自己的答案和我交流。也欢迎你把今天的内容转发给自己的朋友们。


