  md: "营养物质进入，最后，把细胞给闷死。\n\n直到2016年，一项新的技术横杀出来，麻省理工学院的研究团队公布了一项新发现，它是一种能让移植细胞在免疫系统面前“隐身”的方法。研究者们从一种经过改造的物质中，挑了上百种材料之中，选择了经过改造的物质，叫做“藻酸盐凝胶”。他们把胰岛素细胞封装在这种凝胶中，并植入患糖尿病的小白鼠体内，没想到，这种细胞立刻开始发挥作用，应对血糖的变化生产胰岛素。\n\
    \n之后，在长达六个月的时间里，它都能帮助小白鼠持续控制血糖水平。更棒的是，在此过程中，小白鼠的免疫系统没有产生排异反应。\n\n现在，已经有好几家公司投入研究，来探讨如何用这种植入式细胞来针对各类病症了，不光是糖尿病，还有青光眼，帕金森症等等都在研究范围内。未来，也许植入式细胞疗法甚至可以植入经过人工改造的细胞，来达到更精准的药物控制和释放。\n\
    \n假如时日，像这样可以植入体内的“药物工厂”，多种疾病的治疗将从此告别越来\n\n越多的服药过程。即使你生病了，一切也都不用你操心，植入的细胞会像“管家”一样，按时定量给你服药。你所要做的，只是痊愈而已。\n\
    \n![](img/105e314200188b1eed4f6514f28e6cda_83_0.png)\n\n# 基因驱动技术\n\n对基因进行编辑，其实不算什么新技术了，咱们专栏以前也讲过。但如果把基因编辑和演化相结合呢，你能想象到会有什么效果吗？基因可能让你非常吃惊——它可能会永久性地改变一个种群甚至整个物种的特性。\n\
    \n基因驱动技术，是通过基因工程，让某些遗传因子从父母传递到孩子的数量升高，从而让这种基因快速地在物种中传播。\n\n一般来说，“基因驱动”是自然发生的，但现在，人类掌握了可以人为控制它的技术。如果运用得好的，那将会大有益处，比如说，通过基因驱动，我们可以阻止昆虫传播特定传染的致病病毒，在一些卫生条件欠发达的地区，就不会有那么多人因为感染疟疾而丧命了。\n\
    \n目前，美国防高级研究计划局已经投入1亿美元，用于这方面的基因驱动研究了。\n\n当然，基因驱动技术无疑是对人类有益，还可以造福自留区。比如说，科学家通过基因驱动，赋予珊瑚抵抗环境压力的能力，这样，我们可以大大降低珊瑚退化的速度，还可以常常看到一些水母动物破坏当地生态的报道，比如亚洲鲤鱼称霸美国大湖，为害一方，而有了基因驱动技术，我们可以改变亚洲鲤鱼的某些种群特性，让它们无法再肆虐。\n\
    \n然而，因为基因驱动技术的威力太大，人们也对它产生了一些担忧——万一通过改变物种，引发一系列不可预知的连锁反应，对生态系统造成破坏，那该怎么办呢？\n\n\
    所以，现在许多科研团体都在拟定条例，来规范基因驱动技术的应用。基因驱动的确是一把威力强大的新武器，现在，科学界正在为它加上保险。\n\n我们可以预见的未来是，如果科学家能用好基因驱动技术的话，很多人的生命会因此得救，一些濒危物种也能从严苛的生存环境中活下来。当然，前提是，一切要可控。\n\
    \n# 总结\n\n《科学美国人》最新发布了2018年十大新兴技术，我从中重点挑选了三个新技术介绍给你，它们中都是具有颠覆性的新技术，也都能改变我们现在所处的世界。\n\
    \n这三项技术，其中一个是“增强现实技术”，很多科研巨头都以此为核心技术来打造下一代产品；另一个是“植入式药物传送系统”，对糖尿病患者这类需要随身携带状况如药的病患来说，绝对是一大福音；还有一个是“基因驱动技术”，它可以改变整个物种的特性，如果用得好，可以控制疟疾这类通过昆虫传染的疾病，甚至拯救濒危动物。但是，使用它也是有风险的，需要慎之又慎。\n\
    \n那你会可能会问，我们为什么要了解这些呢？用英文来回答，就是这样一句话：\n\n> Understanding the latest innovations—and\
    \ their challenges—will help society determine how to maximize their benefits.\n\
    \n这句话的意思是，了解了这些新技术，同时也对它们带来的风险心中有数万，才能更清楚如何趋利避害——这句话，也被我选作了今天的金句。\n\n今后，我也会继续为你关注这些新技术的发展趋势，因为在不远处的未来，我们每一个人的，生活，或许都会因为这些新技术而发生翻天覆地的变化。\n\
    \n如果你是一名投资者，手头有100万可用的资金，那么，你会投入到今天提到的哪一项新技术？\n\n欢迎你留言告诉我，也欢迎把今天的内容转发到朋友圈。\n\n\
