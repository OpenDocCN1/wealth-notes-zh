  md: "# ## 082报告｜关于“科技毁掉民主”的两个洞见\n\n\n\n# ## 洞见报告：关于“科技毁掉民主”的两个洞见\n\n科技毁掉民主，民主是科技带来的副作用，这是很多人心中的定论。\n\
    \n> > 但科技没有让民主变得更好，民主正在被科技摧毁。  \n> ——《麻省理工科技评论》\n\n+   - 马克安德鲁\n\n你可能还记得，就在几年前，西方媒体还在高呼“大数据拯救政治”，互联网要把民主推向全世界。但今天，风向变了。\n\
    \n今天的洞见分为两个部分：\n\n+   1. 谁能把工具用得更妙？  \n2. 问题原本就在那里\n\n科技，曾被看作是“民主之光”，但如今，风向变了。把“推特”用成水花起势特别普遍了，西方媒体对美国精英阶级更加严厉了。放眼世界，英国，在争议声中脱欧，发达国家难掩问题的一角；民粹主义抬头……大家心知肚明，民主变得糟糕，要么变得更糟，怎么可能变好？\n\
    \n不光是我们这么觉得，西方学界早就有预判。《经济学人》杂志之前就写了一篇文章，叫作“科技依赖支持民主”，我在去年的专栏里专门讨论过，感兴趣的可以去翻一下，那篇结论里就已经可以看出，当时西方媒体就已经意识到，太晚了。\n\
    \n随着乱象愈演愈烈，西方学界的看法有了更新。之前的一些分析家，也做出了新的修正。因此，我们有必要再次深入一下，最新观点，我们一起来看看，做一个认知的升级。\n\
    \n最新一期的《麻省理工科技评论》9月刊，专门推出了一本刊物，篇幅特别有点长，叫做《科技正在帮助我们民主，我们应该怎么思考》。这本特刊一共刊了16篇文章，从哪个角度来探讨这个话题？作者们几乎一致地，科技已经不再站在民众这一边，而是成为了“反民主的武器”。可是，这不是科技本身的问题。\n\
    \n为什么说？看完全了16篇文章之后，我挑选了两个最有价值的洞见分享给你，相信它们能解答的困惑。这两个洞见相互关联，关系也不复杂，值得你仔细读一读。\n\n\
    ![](img/105e314200188b1eed4f6514f28e6cda_74_0.png)\n\n# ### 1 谁能把工具用得更妙？\n\n我要给你的第一个洞见是：“当权者也在不断进化。权力强大的工具最终都会落入他人手中。”\n\
    \n> > 英文原文是：Power always learns, and powerful tools always fall into its hands.\n\
    \n之前，在西方人眼里，科技把权力分配到了民众手中，通过移动互联网，通过社交媒体，民众可以更加便捷获取信息，表达声音；民众也可以更加表达自己，民众，用舆论影响局势，对权力形成有效的制约。\n\
    \n可是他们忘了，当权者也在不断地学习，或者更开明的，科技展现出了他们有些措手不及，可如今他们不仅学会了用，甚至用得更巧妙，玩得更高。\n\n举个例子，特朗普首先被看为使用“推特”来制造话题，甚至被外号叫作“推特总统”，这个不用我多说你也知道了。\n\
    \n但你可能不知道的是，特朗普的竞选团队还将Facebook，来测试民众的反馈，然后找出哪些最有信息，再进行一些投放特定制人群——这个操作有个热门的英文表达：\"\
    micro-targeting\"，就是“精准投放”的意思。\n\n特朗普的团队厉害到什么程度呢？据说Facebook曾派员工到竞选帮助他们技术入局，然后为了回报他们，特朗普就帮Facebook公司多派点人来，跟他们学几招。\n\
    \n还有一个政客爱用的宣传渠道，就是YouTube。美国有个电台节目主持人叫艾丽斯·琼斯，是右翼保守派，她本人也是一位极右翼阴谋论家。艾丽斯·琼斯最近的一个阴谋论，是说明2012年发生在美国桑德胡克小学那场大规模枪击案，是假的，那些哭得撕心裂肺的父母，都是导演，目的就是为在枪支管制问题上做文章。\n\
    \n你看，就是这样一个人，在YouTube上有个空白，她叫：“艾丽斯·琼斯的空洞空间理论”。说的是，如果你在YouTube，会注意到开头放的是什么视频，在滚动相关视频的推荐列表里，只要你多次点击，就会看到关于艾丽斯·琼斯在鼓吹枪击案是阴谋论的视频。\n\
    \n你可能想问，难道这些科技巨头愿意为这种人推波助澜？答案是，是的，他们乐意。\n\n还记得我们以前也提到过，数字经济的核心资源，是“注意力”吗？Facebook和Google的科技巨头，目的是要利用用户的注意力。这是他们商业模式的核心所在。\n\
    \n《华尔街日报》之前有一项调查发现，YouTube的算法推荐，会把用户一步步导向越来越极端的观点和内容，这不是巧合。就因为这能抓住用户注意力的最好方法。\n\
    \n所以，科技并不是天然站在“民主”这一边的，科技是站在利益最大化的。科技巨头对更开放和那些能帮他们实现利益的努力合作。\n\n那么未来呢？《麻省理工科技评论》提到一项值得警惕的新技术，如人工耳蜗。已经有研究组织，美国的数据科学家和算法公司，已经在尝试利用“神经迷思”，它通过摄像头扫入人们的面部表情，进行识别和分析，发现人们正在不经意间流露出真实情绪和想法。为政客制定竞选策略提供支持。\n\
    \n换句话说，政客们正在用最新科技，做到比你比你还了解你。\n\n请问，在这样未来，民主还能剩几分真实呢？\n\n![](img/105e314200188b1eed4f6514f28e6cda_74_1.png)\n\
    \n# ### 1 问题原本就在那里\n\n我想告诉你的第二个洞见是：“科技提供了火种，但总能熊熊燃烧，是因为可以点燃的东西早就是。”\n\n> > 提供的英文原文是：If\
    \ digital connectivity provided the spark, it ignited because the kindling was\
    \ already everywhere.\n\n这话什么意思呢？就是表明看起来，科技造成了很多社会矛盾，但原本根源，这些问题就在那里。\n\n《麻省理工科技评论》用俄罗斯干预美国大选这件事，举了一个例子，说明表面上看，俄罗斯运用微缩技术在社会媒体上“洗脑”等，但根本是特朗普团队对恐惧主义表达同情，首先伪装成白人至上主义者，对移民限制表达极端偏见。总之是试图煽动民众，激发美国内部的矛盾，把大选结果导向他们希望看到的方向。\n\
    \n但注意啊，就算如此，他们所做的，无非也只是抓住美国社会已经存在的痛点，焦虑，经济分化或社会阶层的焦虑，枪支权利、移民问题、医疗改革的困局，枪支管制、部分，或进步党的崛起，这些国内矛盾，是科技进入放大，早已就在那里的问题。科技只是放大了它们而已。\n\
    \n那么网络上充斥着各种极端声音和意见分歧，这难道不是科技带来的问题吗？"
