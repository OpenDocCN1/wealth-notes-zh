    \n不过，正因为“阅后即焚”这个特点，Snapchat 就没办法像 Facebook 那样，通过用户的大数据进行广告精准投放了。但广告是社交平台的主要利润来源，如果不追踪用户的隐私，Snapchat\
    \ 又怎么生存下来呢？\n\n这就是我在这部分重点给你讲的内容了——Snapchat 在广告投放上的三种创新模式。\n\n第一种是根据用户的定位来投放广告，当用户出现在某个位置时，Snapchat\
    \ 就会展现这个区域的商品广告，这样就提升了广告投放的精准度。\n\n第二种是随机发放折扣券。Snapchat 跟一些商家达成合作，以类似抽奖的方式，给用户随机发放优惠券，用户只有在自己的钱包里付账的时候，才能看看自己抽中的券能买几折。其实就，就算抽中一张九折券，大部分人都会欣然买单。这种“玩心”的营销方式，大大受用户和商家的好评。\n\
    \n第三种是让用户主动筛选广告主，具体来说，是 Snapchat 平台上有一个叫“Discovery”的栏目，点击后有个性的页面，你会看到 CNN、《国家地理》等\
    \ 20 多家一流媒体的入口，这些媒体每天为 Snapchat 定制新内容，同时把广告穿插在内容里面。\n\n比如说，在 CNN 做的一篇关于环境可持续性的文章里，Snapchat\
