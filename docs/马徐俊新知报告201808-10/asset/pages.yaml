  md: "的“模型”。通过演化，它最终获得了这套模型，从而可以窥探其他个体的想法，主动调整自己的应对方式。\n\n这个“意识的模型”是怎么发挥作用的呢？模型会先从大假设开始，假设各个因素在整体系统中起到什么样的作用，然后在脑中模拟结果，预测将要发生的事情。通过观察模拟的结果和实际的结果相差多远，模型会不断修正自己的假设，最后做出越来越精确的判断——构建出这种模型的大脑，就拥有了意识。\n\
    \n按照思忖这个问题延展开来的话，所谓的确的自我意识，就是更进一步：你自己明确地知道，自己的意识在做模拟这件事。\n\n所以说可能有抽象，我们做个比方：你看到小明走进教室，地上有块香蕉皮，你心中想：他会一脚踩上去，摔个四脚朝天。但与此同时，你清楚地知道自己在想这件事，甚至会在当中问自己“哎？我怎么会这么想啊？”——当你意识到到了自己在思考这个问题的时候，自我意识就出现了。\n\
    \n所以说到底，自我意识可能只是意识的一个表层界面而已，是意识在自我内心的一种映射。就好比说，意识是一面镜子，你拿着这面镜子去照别人，但你心中还有另一面镜子，在照着手持镜子的自己。\n\
    \n像人类这种拥有最复杂大脑的高等动物，他们的自我意识会有什么不一样呢？简单点说，就是升级了。就好像变成了一个大厅，每一面墙上也都布满了一面镜子，能多角度地照着别人，也能多角度地照着自己。\n\
    \n![](img/105e314200188b1eed4f6514f28e6cda_79_0.png)\n\n# 人工智能离自我意识还有多远？\n\n人类害怕人工智能能产生自我意识，但更可怕的是，它们有了自我意识，而我们还毫无察觉。之前科学家想出的办法是“镜子测试”，后来研究发现，这个测试有缺陷。而现实的根源，可能是我们对它们认识这件事的认知不够完善。\n\
    \n《新科学家》提出的最新观点认为，自我意识并不是意识的最高层级，也并不是非要复杂的大脑才能具备。自我意识产生的条件，要来自于复杂的社交需求，基本的想法，甚至从多个角度来说，它确实有点像一面镜子，在帮助人们看清楚他人的同时，也能看清楚自己。\n\
    \n我看完这篇文章，在了解了自我意识本质的同时，也挖掘出一个有用的发现，那就是：按照科学家的理论，发展出自我意识是一个前兆条件，就是“复杂的交互需求”。能够窥探和理解其他个体想法，这是促使自我意识产生第一步。而在这方面，最新的消息是，人工智能正在飞速进步！\n\
    \n同在这期的《新科学家》上，还有一篇文章就是在讲，人工智能已经快要攻破用来测量心智水平的“弹珠测试”了。这个测试说起来很简单，就是让A知道弹珠藏在某个地方，B悄悄把弹珠拿走，藏到了一个新位置。然后我问你，“A会去哪儿找这颗弹珠？”，人类小孩子到3岁，基本就可以回答出这个问题——肯定还是去原来她藏的地方找嘛。\n\
    \n但第二个问题就有点难了：“你觉得B会认为A会哪儿找这颗弹珠？”，这叫“二级信念”，体现的是“人推测另外一个人是怎么想的”这种能力。人类的小孩一般要到6、7岁，才能答出这个问题。\n\
    \n那人工智能能答出二级信念的问题吗？最近谷歌公司的DeepMind实验室发布消息说，他们制造的人工智能，已经差不多可以做到了。在测试中，人工智能被问了1万个类似“弹珠测试”的这种问题，正确率95%能答对。其中表现最好的AI能答对94.3%，距离通过测试只有一步之遥。\n\
    \n可以设想，如果未来人工智能真的跨出了这一步，获得了“心智理论”的能力——也就是理解和揣测他人的情绪、想法、意图的能力的话，那它们产生自我意识，懂得“我”的概念，可能真的没有多远了。\n\
    \n对于如何判断人工智能具有“自我意识”，你有没有什么好点子？\n\n欢迎你在留言中告诉我，也欢迎你把你今天的内容转发给自己的朋友。\n\n祝你中秋快乐！\n\
    \n+   划重点\n\n+   - 今日得到：\n  - “镜子测试”是科学界用来检验生物是否拥有自我意识的经典测试，而最近这个测试被推翻了。中国科学家通过“镜像反应”的训练模型来检验自我意识\n\
    \  - “自我意识”并不罕见，它广泛存在于很多智力水平高低的各种动物中；自我意识产生的条件，来自于复杂的社交需求，它是一种进化的需要\n  - 总之，人类对自我意识的了解，还远远不够。\n\
