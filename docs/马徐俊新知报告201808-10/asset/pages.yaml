  md: "锚定效应：在做出判断时，容易受第一印象或第一信息的支配。\n\n代表性原则偏见：倾向于利用过去的印象或经验法则来判断未来的情势发展。\n\n投射偏见：倾向于假定别人与自己有同样的感受或想法。\n\
    \n有六个团队同时进行这个项目的研发，其中最受关注的是由莫尔维及（Morewedge）教授带领的团队。莫尔维及教授来自波士顿大学，他和游戏公司创意科技（Creative\
    \ Technologies），以及国家安全技术公司雷史密斯（Leidos）一起，设计出了这款游戏。\n\n“失算”是一款探险类游戏，搭载PS3平台，以黑色电影的画风提供了丰富、浸入式的游戏体验，游戏中融入了辨别和纠正认知偏见的训练。游戏的故事分为三个部分，如需要完成一系列的任务，和NPC进行互动，最终找到失算的邻居邻里。在解谜的过程中，你需要给出判断和预测，而这些问题会涉及各种认知偏见。\n\
    \n比如，你在搜索特里的公寓的时候，大楼的管理员会走过来敲门，随口问你关于另一个租客玛丽的事情。他会告诉你玛丽不是一个运动员，同时告诉你70%的租客会去健身健身房，10%的租客会去安排比健身房，20%的人只是会呆在家里看电视。\n\
    \n然后，他会问你觉得玛丽会去哪？有的人会回答“哪里不去，玛丽就是会呆在家里电视”，而这是一个错误答案，为啥？因为他向上给出了三个健身房分别有多少比例的人去，这就把基本比率告诉了，而受试者直接忽略比率，按照直觉自己认为的，这就是犯了基本比率谬误。\n\
    \n在游戏过程中，游戏会对你表现出来的认知偏见进行评估。游戏的每个部分结束时，会有一个回顾环节，解释方才游戏中碰到了哪些认知偏见，给你刚才的答案评分，再有一些小故事巩固知识。游戏中的每个问题和回顾环节都是根据成人教育和学习理论精心设计的。\n\
    \n为了测试这个游戏在辨别和纠正认知偏见上的效果，一个由政府领导的独立验证团队进行了一项实验。实验中有两组参与者，一组参与玩这个游戏，另一组看一个关于认知偏见的视频。两组参与者在培训之前、培训刚结束、结束8到12周以后，分别接受了关于认知偏见的测试。\n\
    \n测试结果显示，所有人在认知偏见上都有改进，但游戏组的改进是视频组的三倍，并且在实验结束12周以后，再次测试参与者的信息保留程度，游戏组仍然保留他们学到的信息，而视频组又回到了实验之前的水平。\n\
    \n莫尔维及教授认为，游戏有非常显著的效果也是说明了，通过测试，可以避免认知偏见。\n\n作者自己也亲身体验了这个游戏。他认为，游戏的效果到底有多大，也不能单看测试的结果，因为测试本身也是一种提示，测试对象会有意识规避认知偏见。但在深入对认知偏见领域之后，让自己的行为方式确实有一些改变，会有意识地纠正一些认知偏见。\n\
    \n目前，游戏“失算”并不对公众开放，有需求的客户得联系美国的创意科技公司。可能有点贵，但类似的严肃游戏还有很多。在2013年，国内上市了好几款严肃游戏，其中最有代表性的有安利公司和汇思公司合作设计的国内首创3D培训游戏《安利人生90分》，游戏安利公司优秀营销人员的智慧和经验，以及工作中经历的情境浓缩成有趣的游戏桥段，让员工在游戏中学习营销技巧。\n\
    \n除了对个人的能力训练之外，严肃游戏甚至能起到推动行业发展的大作用。比如，美国圣塔大学曾经开发了一款名为“折叠”（Foldit）的游戏，让玩家以真实的蛋白质结构为基础进行解谜。这样，科学家就能在很短的时间内，得到玩家搭建的海量蛋白质模型，从而推动科学的发展。\n\
    \n# 总结\n\n认知偏见是可以被纠正的，只要在几个简单的认知偏见，就能帮助我们解决很多日常中的思维偏差。从游戏“失算”的测试结果来看，认知偏见可以通过互动性、趣味性更强的方式来纠正，效果十分显著，这说明，像这样寓教于乐的学习，可以运用到生活工作的方方面面，不仅能提升个人的技能和认知水平，也可以推动行业和社会的进步。\n\
