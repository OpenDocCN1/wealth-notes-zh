  md: '威”有一种盲目的崇拜和迷信，只要有所谓的科学界权威人士背书，再加上媒体广告的推动，人们就会毫不犹豫地选择相信。


    第二点，人们对生命健康一直缺乏安全感。根据世界卫生组织的描述，心血管疾病目前已经全球的头号死因，2015年，每死亡10个人，就有3个死于心血管疾病，这些数据更加剧了人们的焦虑。商家也正是抓住了这种焦虑，再利用这一点，夸大宣传保健品的神奇功效，让很多人信以为真，也就不奇怪了。要知道，根据美国锡安市场研究的报告，2016年全球保健品市场就已经达到了1,328亿美金的规模，未来还将达到2,203亿美金，在这么大一块蛋糕面前，商家能不拼命宣传、推波助澜？


    第三点，人们在做判断的时候，很容易发生“认知失调”和“确认偏误”问题。这两个概念，得到的用户并不陌生，也可能在倾听五维钢老师、何帆老师的专栏里也都听到过。简单来说，“认知失调”指的是，当发现自己的形为和自我预设的形象不符时，你就会编织一个幻觉，来解释自己的行为；“确认偏误”指的是，我们观察世界时，很容易先预设一个立场，然后不断地寻找符合自己立场的信息，来支持自己的观点，对其他不同的立场和观点视而不见。


    总而言之，这两种非理性的思维方式，带来的结果就是，那些受了所谓“权威”的影响，花了不少心思和金钱投资在保健品上的人们，会抓住一切支持“保健品有效”的证据来证明自己是对的，别人的劝告，他们都听不进去。即便有一天，又有新的科学研究来证明这些保健品无效，他们也会编织一个幻觉来告诉自己——我选的没错。这两种认知问题，可能也是保健品能持续畅销这么多年的原因之一。


    咱们年轻一代，都知道很多保健品本质上就是商业炒家，但鱼油和维生素，我从小就见到家里人都吃着，很少有普通人会怀疑它们的功效。看完今天的内容，可能你也迷茫了，到底吃什么，才能保证健康呢？


    其实这一点，我不用多说你也知道，答案就是健康和均衡的饮食。尽管这是个常识，但你日常生活中可能很难做到，所以我在这里，也引用《NBC新闻》的金句，像老朋友一样再叮嘱你一句——没有什么东西，可以取代一顿均衡且营养的饮食，这顿饮食应该包含有更多的蔬菜和水果。


    There is just no substitute for a balanced, nutritious diet with more fruit and
    vegetable.


    即使科学研究告诉你保健品无效，你还会吃吗？为什么？


    欢迎你留下自己的答案和我交流，也欢迎你把今天的内容转发给自己的朋友和家人。


    今日得到：

    1.鱼油和维生索保健品到底能不能预防心血管疾病，在医学界一直停留在猜想或者争议的层面，而现在，通过考科蓝合作组织和美国阿拉巴马大学进行的大规模研究，科学界证实了它们确实对心血管疾病无效。

    2.鱼油保健品是一个价值300亿美金的暴利产业。

    3.对权威的迷信、认知失调、确认偏误，是导致人们盲目迷信的三个认知上的缺陷和误差。


