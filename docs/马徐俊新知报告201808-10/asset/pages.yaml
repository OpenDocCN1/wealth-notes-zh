  md: "蒂·马公司也在榜上，不过理由不是因为造飞机，而是他们为NASA制造的地球气候卫星，GOES-16，在发现森林火灾、风暴和极端天气预警方面，帮全人类省了大眼。\n\
    \n好，你肯定会关心有哪些中国企业在这份榜单上，一共有两家，正好是一小一大——大疆和小米。\n\n小米现在是世界第四大手机制造商了，《时代周刊》风趣的调侃，小米像是“笨手笨脚的苹果”。小米跟苹果一样，除了时髦的手机，也很有自己鲜明的风格，小米的创始人跟乔布斯的穿衣风格类似，都喜欢黑上衣、牛仔裤的打扮。但小米走了一条跟苹果截然不同的低成本路线，除了成本之外，产品的利润不超过5%。\n\
    \n我个人倒是觉得，小米最了不起的地方，应该是像老师爷的活——它创造了一种智能手机史上新的平等。\n\n中国的大疆无人机上榜的理由非常简单粗暴，因为在无人机领域，大疆是无可争议的绝对霸主，英文叫两个词叫over\
    \ the drone industry，占据着72%的市场份额，从最小的掌上无人机，到好莱坞电影里看到的大型无人机，大疆的产品线着覆盖的。它还逐渐重新定义了人们自拍的方式，不止可以用手、用自拍杆，还能用非常轻巧的无人机自拍。\n\
    \n怎么样，看到咱们中国的企业榜上有名，还是蛮欣慰的大致面和开心吧。\n\n那接下来咱们说情况就先说讲到这里，接下来要给各位讲讲榜单上最重磅的榜单位置，也就是《时代周刊》花了最多篇幅来报道的迪士尼。\n\
    \n![](img/105e314200188b1eed4f6514f28e6cda_107_0.png)\n\nI 为什么迪士尼被评为最伟大的创新公司？\n\
    \n其实刚才说了那么多上榜的公司，从新技术到新服务，从高科技到小工具，听起来都挺令人兴奋令人刮目相看的，但说到迪士尼这份榜单的榜首，恐怕绝大多数人，甚至我想到我身边的人来听我讲，听到最多的回答会是：不会吧！先说啊！\n\
    \n在一般人眼中，迪士尼就是那个会讲故事，做主题乐园、能把怪物给弄得非常好，咱们都觉得迪士尼很肥，迪士尼这几年在买买买，从皮克斯动画到漫威，从卢卡斯影业到最新华173亿美元收购福克斯，这不象是土豪作风，不差钱呐，哪儿有创意了？\n\
    \n咱们得到的每天新书和视频跟老师的老的专刊，不止一次说过迪士尼，那么《时代周刊》又是怎么看迪士尼的创新的呢？\n\n文章很长，我帮大家提炼出了两个核心要点：从产品层面和创新，商业模式上的自我革新。\n\
    \n从产品层面来说，迪士尼非常重视原创，在收购了那么多大大小小的娱乐公司之后，迪士尼居然让它们各自保持独立性、保持各自的风格和形象，这就是迪士尼了干大善的内容创作，比如，让迪士尼作为一个把“合家欢”作为公司核心理念的集团，允许集成制作年龄分级作品，不读合孩子，只适合成年人的作品；收购了皮克斯之后，迪士尼也没有要求皮克斯改变自己的风格，比如说让迪士尼公主去子的路子上的路。\n\
    \n对于创意的尊重，给迪士尼带来的是丰厚的回报，2018年至今天全球三部票房最高的电影，分别是漫威的《黑豹》和《复仇者联盟3：无限战争》和皮克斯的《玩具总动员4》，都是迪士尼旗下的作品，累计票房达到了20亿美金。至今，全球最卖座的10部电影里，5部都出自迪士尼，让迪士尼爆了84亿美金。\n\
    \n当然，也有人批评迪士尼总是拍续集作品，不再进取，坐摊了好菜场。但迪士尼为什么被这么被做呢？\n\n这就要说到迪士尼在商业模式上，正在下的一大盘大棋，也是为什么迪士尼这几年要下重本买卖自己的原因从一传统迪士尼打造最完美的业务从传统电视领域，转型到网络流媒体领域，跟奈飞和亚马逊正面PK。\n\
    \n迪士尼的传统优势来自电视，所以之前一直都是把自家作品给传统电视台网络流媒体公司播出，然后投权收费，奈飞因此受益匪浅，大大丰富了它的影片库。\n\n但是迪士尼明显感觉到观众的收看习惯正在改变，从2013年开始，迪士尼的ESPN体育台，最多支付了1千1百万用户，与此同时，奈飞的订阅用户却超过了1亿2千万人。\n\
    \n为了不被重蹈覆辙，迪士尼主要做了这么两件事，首先大举收购拥有优秀制作能力和知名品牌的公司，皮克斯的动画形象、漫威的超级英雄，卡罗斯的星球大战系列，包括这次收购了福克斯，意味着迪士尼将拥有了像国家喻户晓的《辛普森家族》系列动画。\n\
    \n跟传统的经典好制作，相信稳重的票房就能能力和大爆电影等号召力不同，迪士尼相信品牌将带来长久生命力，从米老鼠、唐老鸭，到各种迪士尼的故事和形象，迪士尼就是这么一路走过来的。所以买下这些公司就等于买下了大大可能全龄段的IP，不仅可以制作续集大电影，还能在迪士尼乐园里不断制作游乐项目，出售周边，这就是迪士尼为什么不断制作续集系列电影的原因。\n\
    \n另一件可可以说是需要比山旦斯彻一样的勇气，那就是迪士尼开始坚定地走自己的流媒体道路，终止跟奈飞授权合作，收网播放还意还意思还意思还意思还意思还意思还，加上手里握了这么多知名的IP，2019年，迪士尼要正式上线它的流媒体平台，跟奈飞和亚马逊正面对决了。\n\
    \n怎么样，说了这么多，有没有感到迪士尼在内容和商业模式方面敢敢于不断地创新，甚至自我颠覆的勇气呢？从传统的时代进入网络流媒体时代，迪士尼迅速调整方式都进行改造，苹果的CEO，库帕克就说了，让企业成功的运营方式，其实更像一家科技公司。\n\
    \nI 总结\n\n《时代周刊》第一次制作的最具创意公司榜单，一共评选了50家企业，涵盖了各个领域，而评选标准还是企业还是新意思，标准就是要够有创造、有野心，够成功。\n\
    \n我想我们可以从这份榜单里得到的启示是，创新是不分行业，不分阶层的，甚至不分年龄的，就像咱们一开始说的：每一家伟大的企业，本质上都是创造性地解决了一个问题。\n\
    \n> At the heart of every great business is a creative solution to a problem.\n\
    \n这句话，也是咱们今天的金句。\n\n听到迪士尼是这份榜单的第一名，有没有让你有惊喜意外感？你觉得迪士尼登顶属实实至名归吗？\n\n欢迎留言写下自己的答案，也欢迎你把今天的内容转发给自己的朋友。\n\
    \n+   * 划重点\n* 今日得到：\n    1. 《时代周刊》第一次推出“最具创意公司”榜单，评选标准是：原创性、影响力、成功度、公司的愿景与野心；全球50家公司榜上有名，中国的小米、大疆已上榜，科技巨头Facebook和Google也榜上有名。\n\
    \    2. 《时代周刊》认为百年老店迪士尼从产品层面实现了创新，从商业模式上很有自我颠覆的勇气，是最具创意公司的头号代表。\n\n资料来源：\n\n50\
    \ Genius Companies, Time, 2018.10.15\n\nDisney Leading the Magic Kingdom into\
    \ Tomorrowland, by Belinda Luscombe, Time, 2018.10.15"
