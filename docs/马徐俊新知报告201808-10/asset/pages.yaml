    # “分段式学习“如何改变未来的人才流动形态？”


    事实上，“分段式学习”的推行，也给西方的求职招聘形式，带来了新的启发。


    比如说，IBM的员工通过业余时间学习，完成了一个科目的学习后，就能得到一个象征“学业完成”的徽章，这个可以记录到领英这种职业社交网站站上，猎头在寻找人才时，通过你的页面，就知道你掌握了什么技能，可以匹配哪些岗位


    根据《经济学人》的介绍，从2016年到今年，已经有超过20万的IBM员工进行学习，获得了665万个徽章，平均每个人至少完成了三门课程的学习。还有我们刚才提到的美国通讯巨头AT&T
    设立的 Work-force 2020人才培养计划。根据AT&T的介绍，到目前为止，它们公司的员工已经完成了270万次内部在线课程的学习。AT&T向5.7万员工，发放了17.7万象征“完成学业”的徽章。


    总之，企业提供的“分段式学习”，为更多员工实现了更精准的“赋能”，让他们在求职的市场上有更多竞争力，而他们的学习成果，又与职业社交媒体实现了联动，这种互动提高了猎头衡量人才的效率，也让员工才能，能以更直观的方式量化出来，让他们在跳槽的时候更抢手，职场发展路径也会更长远也更顺畅。


    你可能会想，那员工的能力上去了，不会跳槽么？这些公司也想到了，比如说IBM，同佯也制定了如何留住人才员工计划，比如使用股票、期权、现金等激励方法，还协助员工制定更长远的职业规划。我很认可这种做法，毕竟一个企业想要有长远发展，就不该怕自己的员工有本事。


    好，总结下今天的内容。对咱们得到的用户来说，“终身学习“是一个非常熟悉的理念了。当然，西方知识界也非常重视“终身学习”，有多重视呢？我给你举个栗子，你在浏览经济学人网站时，会弹出一个广告页，上面写着，如果你注册会员的话，就会给你一个奖励。那这个奖励是什么呢？就是《经济学人》之前做的特别报告-《终身学习》—
    Lifelong learning，这一期内容我们在《世界名刊速读》详细讲过，感兴趣的话，听完今天的内容可以回去听一下。


    如今，无论是在科技、金融企业，还是制造业，都意识到了分段式的终身学习的重要性，走在前面的企业，已经开始主动出击，为员工职业技能需求进行精准定制，并且结合各种高精科技手段，为员工提高学习效率，给员工和整个行业都带来了不断升级迭代的活力。就像贝辛在接受访谈时所说的：“企业只有投资员工，投资新的工具和平台，为员工提供他们需要的培训，才能为未来做好准备。”这句话也被我选为今天的金句
    — Companies can prepare for the future of work by investing in their people and
    providing new tools and platforms that deliver the learning people want and aspire
    for.


