    - *Silicon Valley is Changing, and Its Lead Over Other Tech Hubs Narrows*, The
    Economist, 2018.9.1

    - *What to Make of Cryptocurrencies and Blockchains*, The Economist, 2018.9.1

    - *Silicon Valley Versus Route 128*, by Annelee Sachsenian, Inc, 1994.2.1'
