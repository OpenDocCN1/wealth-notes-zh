  md: '# # 049报告 | 经济学人智库解析今年全球十大经济风险


    ![](img/105e314200188b1eed4f6514f28e6cda_0_0.png)


    # ## 今日报告：经济学人智库解析今年十大经济风险


    尽管最近的经济数据表现相当不错，然而国际经济史将带来几年内、面临最深最复杂的风险之一。（经济学人智库）


    作为各国政府、跨国企业的重要智库，经济学人智库的分析报告，是行业精英们了解世界变化大势的风向标之一，值得你关注。


    今天的内容分为四个部分：


    +   1. 2018年全球十大经济风险是什么？

    2. “持续走低”的股市将带来哪些连锁反应？

    3. “大规模的互联网攻击”将危及网络交易？

    4. 未来的油价究竟是涨还是跌？


    今年3月，经济学人智库发布了《2018全球十大经济风险综合报告》，在7月初披露了报告全文。总体而言，经济学人智库认为，尽管最近的经济数据表现相当不错，然而国际经济史将带来几年内、面临最深最复杂的风险。这句话也被我选为今天的金句。


    > Despite the encouraging headline growth figures, the global economy is facing
    the highest and level of risk in years.


    经济学人智库(EIU)是经济学人集团旗下的权威智库，是分析机构，拥有70多年的历史，在全球200多个国家设有分析团队，它为国际政府和非企业提供智能服务，它的分析和预测报告，是全球行业精英们了解世界变化大势的风向标之一。因此，经济学人智库的报告，值得你关注和了解。


    这份《2018全球十大经济风险解析报告》，是经济学人智库根据全球政治、经济、科技等领域的变化提供具体提出的10种潜在的经济风险。我为你精读了这份报告，挑选了三个最值得你了解的经济风险，看一看经济学人智库是如何分析的，以及它们可能会给我们带来什么样的影响。


    ![](img/105e314200188b1eed4f6514f28e6cda_0_1.png)


    # ### 2018全球十大经济风险是什么？


    经济学人智库把十大风险，划分成了“非常高”、“高”、“中”、“低”、“非常低”五个风险等级。划分的依据是“发生概率”和“影响程度”这两个指标。一个是考虑到未来两年内，风险发生的概率，超过40%就将被认定为“非常高”，10%以下将被认定为“非常低”；第二个是观察风险发生后，全球平均GDP的变化情况，如果变动超过2%就被认为是“非常高”，而“非常低”大概只会产生0%~0.1%的变动。


    报告中把2018年的十大经济风险，按风险强度分为五个等级：


    +   - 风险等级第一：“持续走低的股市”和“美国贸易保护主义”；

    - 风险等级第二：“美国经济增长率突破6%”和“大规模的互联网攻击”；

    - 风险等级第三：“中国经济不能走低”及“朝鲜半岛的大规模军事对抗”或“中东冲突影能源市场”；

    - 风险等级第四：“石油输出国组织(OPEC)减产协议破裂，油价因此大跌”；

    - 风险等级第五：“多个国家撤出欧元区”。'
