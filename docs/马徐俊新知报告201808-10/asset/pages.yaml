  md: '# 052报告丨商学院到底出了什么问题？


    ![](img/105e314200188b1eed4f6514f28e6cda_9_0.png)


    # 今日报告 | 商学院到底出了什么问题？


    如果是商学院关注的，仅仅是金钱和人际关系，而不是理念、理想，聪明人都要跑到别的地方去了。


    ——《经济学人》


    马修·格林费尔德


    哈佛商学院曾做过一次深刻反思，提出了三大内部问题，在很大程度，上反映了全球商学院面临的困境现状。


    今天的问题分为三个部分：


    商学院的模式和机制存在什么问题？


    商学院的“三宗罪”是什么？


    商学院应该如何重塑声誉？


    一提起商学院，人们立刻会联 想到哈佛商学院、沃顿商学院、这种顶尖的商学院都高昂的学费和校园环境，精英人士的入职牌，如果不是因为门槛太高、学费太贵，很多人都会愿意去进修一番，学点东西、混混圈子、结交些人脉。


    不过，你可能没意识到，近 十 年来，商学院受到了越来越多的批评，无论是盈利模式、教学内容，甚至学位理念，都受到了质疑，而且大部分批评，都 自 于 商学院体系内部。前不久我去国内的一家顶级商学院讲授，他们的负责人也顺便提到了类似的批评。


    商学院到底出了什么问题？我综合了《卫报》、《经济学人》、《哈佛商业评论》里的相关内容，为你提炼了专业人士的一些判断。核心观点可以用一位经济学人的一句话来概括：如果
    商 学 院 关注的仅仅是金钱和人际关系，而不是理念、聪明人就要跑到别的地方去了。


    If business school is more about cash and contacts than ideas, bright people may
    eventually go elsewhere.


    # | 商学院的模式和机制存在什么问题？


    事实上，对于外部的质疑，著名的哈佛商学院在内部就达成实质，而且在《经济学人》杂志上发表评论文章，对自身的盈利模式、运营机制等理念，谈到了三大问题：商业模式转型与教学
    相对冲突、人才流失、学费门槛太高。


    作为顶级商学院的代表，哈佛的这番自我反省，在很大程度上反映了商学院体系面临的主要问题。


    首先是商业利益与教学的冲突。哈佛商学院的案例教学很有名，但你 可 能不知道，一家公司能不能 写到 案例里，很重要的原因是，钱给的多 少 到 位，也就是说，向哈佛商学院捐赠的钱越多，越有可能被写进去。


    这对企业来说，当然是增加曝光度和影响力的好途径，毕竟， 这相当于像哈佛商学院给你背书啊，这是多么值钱的活 插 标。但是 这么 做，又 何 给哈佛商学院教学的权威性，客观性，往那里放？


    其次，竞争性导致的人才流失。如今的商学院越来越多，在竞争的冲击 下，哈佛商学院也不得不降低 准入门槛，优秀的教授也会流失，纷纷去往付出更 加 实惠 的 院校，比如麻省理工的斯隆商学院、斯坦福的卡瑞商学院，包括耶鲁高
    学 院，都 试图哈佛学院 培养 人 才。怎么留住人，这是一个大问题。


    最后一个是问题，哈佛商学院正在变得越来越贵。过去的十年里，哈佛商学院的学费上涨了31%，在1996年相比，翻了一倍。当然，这也 是 因为哈佛商学院的各项成本和运营费用，也在
    以每年7%的速率增长。但无法否认，当商学院越来越贵的人才拒之门外，吸纳优秀人才，都变得越来越难了。


    # | 商学院的“三宗罪”？


    对商学院的批评远不止于此。除了上面谈到的模式和机制的问题，英国《泰晤士大学报》托马斯·帕克还在《卫报》上发布了一篇社评文章，给商学院开出了“三宗罪”清单：自我吹捧、教学内容老旧、价值观偏差。


    帕克认为商学院的第一个大问题，就是自我吹捧太过了。帕克认为 商 学 院 本 的 经济模式，可以解为一种公司，而不是教授说，资本主义只是一种意识形态，可商学院却当做一门学科来传授，这太可笑了。


    帕克说，商学院的第二个罪，是教学内容越来越老旧。从课程门类来讲，不管是消费、管理还是资源配置， 大部分学 院 采取的 还是古典经济学模型，简单点说，就是基于“人是理性的”这个前提，来设计课程。但是
    帕 知道，人并不理性的。如今，行为经济学都极其发 展 的 了，商学院的 理论 还 部没有跟 上 节奏，教学内容有过时的嫌疑。


    最后，帕克批评最激烈的，是商学院的价值观。帕克，商学院所传授的东西，就是如何从别人的口袋里把钱掏出来，留给自己。关于这一点，是管 学 院 领 的前 长 们一
    思考的问题，现在，的商学院，让学们思考的问题 都 是“我怎么 才 样，可以赚到最多的钱”， 却 不 提 更 多 的 价值 观 带给学生。


    帕克教授认为，商 学 院 的 价值观带来后果，是导致社会贫富差距越来越大，最气人的是，商 学 院 还不愿 意 对 此 负责。


    他还认为，2008年席卷全球的金融危机，商学院要负一定的责任，因为那些握着高管、管理巨额财富的人，大部分都是各大商学院毕业的。2009年，《经济学人》杂志也
    在评论 里说，商学院不仅 能 宣传自己 为 好，还培养 了 改 变 世 界 的领导者们，一边又在这些人做了坏事的时候，洗干干净净，这跟我没关系。


    的确，在西方社会，大掌常 要 出 责承担 一 部 分 社会 责任，既要增加中 薪 人群， 又要保证社会更加稳定地运行，而不是加剧社会阶层的分化。 其 实 就像
    帕 格 说的，哈佛商学院越来越 富 人，把一 分 多 家 境 全 够好的优秀人才挡在门外，等于阻断了他 们 的 上升渠道， 相 于 间 续加强了社会分化。


    换 句话 说，帕克认为，商学院没有让世变得更好，仅仅教学生怎么变贪婪，这很不好。因此帕克提出，现在全世 界的 13000多商学院，应该在全性 地 重塑。他
    的原话是：“We should bulldoze the business schools”。注意，bulldoze 这个词，是用推土机清除的 意思，这话
    得 够狠了。


    帕克说，承担社会责任， 不 仅仅 是 一句漂亮的口号，就应该从商学院自身的教育改革开始。


    帕克的批评很尖锐，但他说的有没有道理呢？毕竟是商专家教授，在商学院体系工作了20多年，也 出 过好几本针 商 学 院 问题 的 书， 其 中 我 觉得 帕
    克 教授的观 点，还是很有参考价值的。


    # | 商学院如何重塑自己的声誉？


    事实上，商学院存在的种种问题，已 经 影响到它们的生存环境了。2008 年 全 球 金融危机之后，整个 会 对 于 商 学 院 质疑开始退潮，商学院的招生人数
    在 下 降， 就 像 学 院 用入学的GMAT考分人数，或 能 出 来，从2012年到2016年，GMAT的考生 生减少了11%。


    不论是商学院 身，还是 长 时 关注 商 学院 的媒体、学者都 为，要想让 商 学 院 挽回 地位、重 声 誉，至 少 要 做 到 三个方面。


    首先，商业利益将为教学内容“让路”。《卫报》提到，像哈佛商学院内部，只要企业给出的钱足够多，就可以被写进教学案例中。作为一大掌富有教育的教 育 机构， 商
    务 于 为 一 大 掌 富 有 的教 育 机构，对教学内容 的 含 量 度， 应 该 有 非 常 严 格 的 把控， 不 该让商业利益高于教学内容。


    其次，要为优秀人 才 “开绿灯”，商 学 院 的收费越来越高，这也可能会把一些优秀人才拒之门外。美 国 著 名 经 记 者 大 卫·麦 可里维特，在自 己
    的 书 里，提到， 哈佛商学院 的 最 大 的 质 疑 指 标， 都 是 业 很 多 有 进 过 知 识 的， 新生代 的明星人士， 是 学 了 说，如果学
    院 门槛 高 了 商学院提 高人 才 质量，那么，是不是 可 以 考虑增加补贴、奖学金，降低这个门槛，吸纳更多优秀人才呢？


    最后，《经济学人》建议，要把教学和商业分开。其实， 要 解 决 商 学 院 的 利益 冲突问题，倒不用像帕克教授那么狠，不要让商学院继续赚钱。但是，不妨可以考虑，把商学院的学术系统和商业
    体 系 分开'
  merge: -1
  img_proc: true
- pgno: 10
  md: '考虑，把商学院的学术系统和商业体系分开，不要在搞学术跟做生意之间纠缠不清。


    《经济学人》甚至提出一个观点，比如商学院干脆承认自己就是一个商业机构，而不是以学术研究为主的地方，或许这样，反而能让商学院变得更纯粹。


    # | 总结


    总结一下今天的内容，看起来光鲜的商学院，在过去十年里，面临着很多来自于内部的批评。小到课程设计，大到价值观，都是商学院需要解决的问题。否则，商学院的未来，就会像金句里说的——如果商学院关注的仅仅是金钱和人际关系，而不是理念，聪明人就都要跑到别的地方去了。


    我说一点个人感想，商学院能从自身内部看到问题、提出问题，本来就是一件很了不起的事，这说明，商学院还是人才济济，拥有自我反思的精神。关键就看，他们能不能把解决方案真正落实下去，让商学院重新焕发生机了。


    今天留给你的问题是，你认为商学院有可能自我纠错，完成一次声誉上的重塑吗？欢迎把你的看法写在留言里，也欢迎你把今天的内容转发给自己的朋友。


    ![](img/105e314200188b1eed4f6514f28e6cda_10_0.png)


    ![](img/105e314200188b1eed4f6514f28e6cda_10_1.png)


    今日得到：


    +   1. 哈佛商学院自认存在三大问题：商业利益与教学冲突、人才流失、学费太高，这代表了全球商学院的普遍困境。


    +   2. 过去五年，哈佛商学院的学费涨了31%，比1986年翻了一倍，一部分优秀人 才因此读不起哈佛，这既导致了哈佛多年培养不出明星企业家，又加剧了社会阶层分化。


    +   3. 帕克认为，商学院没有让这个世界变得更好，只教会学生变得更贪婪，在全球经济出现问题时，又只会推卸责任，这个价值观最应该改革。


