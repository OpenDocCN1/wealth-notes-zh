    —《新科学家》\n\n# 今日报告：从演化论看民间经济学\n\n1 徐敏健\n\n在经济学家看来，普通民众坚信的“民间经济学”，存在很多偏见和谬误，百姓为什么，无经济\
    \ 学 家 怎么科普，老百姓就是不买账？\n\n今天的议题分为三个部分：\n\n+   - 为什么说民间经济学充满谬误？\n- 民间经济学的演化论\n- 谁在利用民间经济学？\n\
    \n长久以来，在经济学家们一直有一个让他们头疼的问题：在一些经济问题上，普通民众的看法，往往和经济学家大相径庭。比如说国际贸易问题，移民、关税、政府干预等等的些方面，老百姓多有自己的一套根深蒂固的见解的，什么“在外海建工厂会减少本地人的就业机会”、“大企业可以操纵市场”等等。这理论被称作“民间经济学”，英文叫folk\
    \ economics.\n\n在经济学家看来，这种“民间经济学”，存在很多偏见和谬误，是违背当代经济学的主流观点的。可奇怪的是，无论经济学家怎么科普，老百姓就是很难买账，始终坚信自己那一套。这到底是为什么呢？\n\
    \n最新一期《新科学家》杂志刊登文章，提出了一个新颖的“民间经济学”的出现，并不是因为普通民众见识短浅，或者被媒体的宣传钻了空，这些想法，出自一种根深蒂固的传统：在“物物交换”的过去就打下\
    \ 了印记，又在人类数千年来的经济活动里，不断传递和累积。换句话说，这些“错误的经济观念”，是人类自然演化的结果。\n\n你可能会觉得，怎么看是演化论……确实，如今“用演化论”\
    \ 在经 济 学 是一 种 大 热了，好像什么都推倒来，都能和演化扯上头。就好像什么最终都能到“人性”上一样。但是这篇文章的价值在于，它没有玩概念游戏，而是真把普通人的经济观念对上的一些常识，在人类的演化图谱中找到了对应的联系。\n\
    \n![](img/105e314200188b1eed4f6514f28e6cda_109_0.png)\n\n# 1 为什么说 “民间经济学” 充满谬误\n\
    \n其实，“民间经济学”的观点你一点都不陌生。无论是 大 到 投 资 热 水，还是 社 交 媒 体 你总能听到类似的话，在《新科学家》上列举了7个常见的“民间经济学”\
    \ 观点，我们先3个让你感受一下，“社会财富像一块蛋糕，富人分得多了，穷人分得就少”；“大企业掌握着定价权，消费者只能被动接受”；“资源依赖国外进口的话，本国经济会没有危险。”\n\
    \n# “民间经济学” 的七个常见谬误:\n\n+   • 社会财富像一块蛋糕，富人分得越多，留给穷人就越少：\n*Wealth is a fixed-size\
    \ pie - the poorer get poorer when the rich get richer.*\n\n• 大企业掌握者定价权，消费者只能被动接受：\n\
    *Big corporations can impose prices on consumers.*\n\n• 资源都依赖从国外进口的话，本国经济就会变差：\n\
    *Importing from other nations makes our own one poorer.*\n\n• 政府的干预可以有效控制市场价格：\n\
    *Prices can be controlled with government regulation.*\n\n• 市场自由竞争，会社会带来负面影响：\n\
    *Free market competition will have negative social effects.*\n\n• 最好只和熟悉的对象交易：\n\
    *It is better to trade with known parties.*\n\n• 对“获利动机” 应该始终持怀疑：\n*We should\
    \ be suspicious of the profit motive.*\n\n怎么样，是不是很眼熟？有些观点你可能 在 听 过 ，还 觉 得 “没 毛\
    \ 病 ” 。 但 其 实， 在主 流 经 济 学 家 看 来， 这 些 都 是 很 明 显 的 谬 误。\n\n1996年，美国进行了一项调查，第一次让大家明确看到，普通民众和经济学家在哪个\
    \ 经济 理 论 上 的 思 想 关 系 有 多 大。 在 同一个 调 查 上， 有 个 问 题 是 “与 别 国 的 贸 易 协 定 能不 能 给 本 国\
    \ 创 造 更 多 就 业 岗 位 ” ， 有 50% 的经济学家认为“会”，只有 5% 的 经 济 学 家 认为“ 不 能 ” ， 而 普 通 民 众 呢？只\
    \ 有 17% 的人认为“ 不 能 ” 创 造 就 业 岗 位 ， 而 54% 的人认为 这 个 可 以 增 加 就 业 岗 位 。\n\n还有一个问题：企业高管薪酬过高，会阻碍\
    \ 经 济 发 展 吗？69% 的民 众 认 为“ 会 ” 。 但 只 有11% 的 经 济 学 家 认 为“ 会 ” 。\n\n 可 见 就 看， 普 通\
    \ 民 众 又 没 接 受 过 经 济 学 教 育 ， 不 具 备 经 济 学 思 考 模 型 也 没 经 常 犯 过 错 。 但 有 意 思 的 是， 研\
    \ 究 发 现， 这 些 民 间 经 济学的观点和非常 有 特 性， 甚 至 到 于 跨 越 不 同 的 地 区 和 文 化 ， 像 欧 洲 、 拉 美 和\
    \ 中 国 ， 无 论哪个地方老百姓，都是这么想问题的，这又是怎么回事呢？\n\n这 个 问 题 ， 经 济 学 家 想 不 明 白 ， 可 心 理 学 家找出了答案。\n\
    \n![](img/105e314200188b1eed4f6514f28e6cda_109_1.png)\n\n# “民间经济学” 的演化论\n\n《新科学家》上这篇\
    \ 文 章 的 作 者 帕 斯 卡尔 博 耶 （ Pascal Boyer）， 他 是 华 盛 顿 大 学 的 认 知 心 理 学 教 授 ， 他 刚 刚\
    \ 发 布 了 一本新书，就是 对 这 个 问 题 的 最 新 研 究 成果 。 博 耶 认 为 ， 人 类 之 所 以 会 具 有 特 定 的 思 想 方式\
    \ 去 解 决 经 济 问 题 ， 是 由 于 人 的 意识 ， 对“ 交 易 ” 这 个 经 济 学 核 心 的 行 为 ， 到 底 应 该 如 何 进\
    \ 行 的 ， 有 一 套 能 有 趣 的 、 重 视 化的思维模式。\n\n这 套 理 念 通 过 人 类 几 千 年 的 经 济 活 动 中 形 成 了\
    \ ， 并 且 通 过 文 化 、 代 代 相 传 下 去 。 这 些 理 念 与 生 俱 来 ， 不 受 社 会 、 文 化 传 统 的 影 响 。 这\
    \ 也 是 为 什 么 不 同 国 家 的 民 众 ， 对 于 经 济 学 的 看 法 差 异 没 有 小 异 。\n\n那 该 如 何 呢？ 其 实 没\
    \ 有 ， 在 人 类 历 史 的 很 长 一段 时 间 里， 它 都 是 适 用 的 。 博 耶 指 出 ， 在 人 类 延 长 的 交 易 过 程 中，\
    \ 学 会 了 相 互 合 作 。 随 后 出 现 了 分 工 和 交 易 。 不 过 在 当 时 ， 交 易 的 范 围 和 规 模 极 有 限 ， 交\
    \ 易 双 方 都 熟 悉 的 。 就 像 买 菜 ， 不 光 只 讨 价 还 钱 ， 你 对 羊 走 来 是 从 谁 家 的 羊 身 上 剃 下 来 的\
    \ 都 清楚。\n\n换 一 句 话 来 说 就 是 ， 从 前 做 ， 交 于 交 易 的 一 切 ， 都 是 。\n\n在 漫 长 的 历 史 形 成\
    \ 中 ， 人 们 对 交 易 的“ 公 平 ” 带 着 着 很 强 的 执 念 ， 如 果 有 谁 占 了 便 宜，很 容 易 就 会 引 发 公 怒 。\
    \ 我 们 更 喜 欢 熟 悉 的 人 做 生 意 ， 否 则 就 会 感 到 担 心 。\n\n但 这 些 观 点 在 如 今 全 球 化 的 经 济 环\
    \ 境 中 ， 明 显 就 不 再 适 用 了 。 现 代 社 会 ， 交 易 网 络 的 范 围 和 复 杂 程 度 ， 都 远 不 是 能 比 的 ，\
    \ 就 有 了 一 系 列 的 负 面 结 果 ， 如 只 看 个 体 ， 不 去 整 体 —— 我 们 总 认 识 错 误 认 为 大 众 业 力 会 成\
    \ ， 因 为 我 们 认 识 模 式 ， 总 是 认 为 交 易 是 “ 两 方 ” 之 间 完 成 的 ， 如 果 交 易 的 一 方 过 于 强 大\
    \ ， 另 一 方 只 有 吃 亏 的 份 。\n\n所以 你 总 会 听 到 这 样 的 声 音 ： 苹 果 这 样 的 巨 头 是 可 以“ 操 纵 ”\
    \ 市 场 的 ， 所 以 它 们 可 以 随 意 给 产 品 定 价 。\n\n举个 例 子， 新 款 iPhone 的 顶 配 在 国 内 官 网 售价\
    \ 一 万 多 ， 但 民 众 认 为 公 平 。 果 然 贵 得 不 值 ， 是 因 为 市 场 中 占 据 垄 断 地 位， 消 费 者 只 被 被 动\
    \ 接 受 。 但 这 样 认 知 是 错 的 ， 就 是 因 为 消 费 者 有 替 代 品 。 无 论 企 业 多 大 ， 在 消 费 者 这 个 整\
    \ 体 ， 都 企 业 是 很 弱 的 。 诺 基 亚 和 索 尼 ， 曾 经 被 认 为 是 有 操 纵 市 场 的 能 力， 但 后 来 ， 它 们 都\
    \ 没 落 了 。\n\n还 有 ， 我 们 对 自 由 竞 争 是 心 怀 戒 备 的，总 觉 得 政 府 能 干 手 下 平 ， 调 控 资 源 分 配\
