    他的投资顾问一直在他这边卖。在过去的15年里, 始终在劝说不要这么做, 但是, 马克·库格林的坚持, 在今天得到了回报。

    >

    > 而报道里还提到了另一个人, 也非常值得玩味, 这个人就是约翰·斯卡利, 他是苹果公司历史的人都知道的, 他就是当年百事可乐的CEO, 被苹果的一句“你想要一升苹果味X”是眼我一成世界智慧”
    所打动, 他是加入苹果公司, 后来又把乔布斯赶出苹果公司的人。

    >

