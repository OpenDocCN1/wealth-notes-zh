  md: "# # Dysmorphic Disorder.\n\n![](img/105e314200188b1eed4f6514f28e6cda_48_0.png)\n\
    \n# ## 「身体畸形恐惧症”与认知失调\n\n其实，“身体畸形恐惧症”并不是一个新出现的病症，1987年就被心理学家正式归类的命名了。目前全球患病率在2%左右，也就是说，每50个人中大概有1人患有这种病。\n\
    \n“身体畸形恐惧症”这个名字，听着有点吓人，其实它属于一种认知失调，患者就像患了强迫症一样，对自己身体上的一些极轻微小、甚至根本不存在的缺陷产生痛苦，引发社交障碍。\n\
    \n很多人会依赖整形手术来“修复”这些问题，但问题却越修越多，就此陷入了恶性循环。可以说，身体畸形恐惧症比美颜综合症更严重，相当于它的升级版。\n\n要命的是，一旦患上身体畸形恐惧症，通过整形手术是无法解决问题的，因为患者永远不会觉得，还有更多的缺陷需要调整，病情只会越来越糟。\n\
    \n对于这种病，唯一的干预手段就是进行心理治疗，比如采用“认知疗法”，帮助患者识别哪些是消极的想法，然后用积极的想法来替代它们。一些病情严重的患者，还需要服用抗抑郁和缓解焦虑的药物。\n\
    \n《美国医学杂志》担心的是，当前人们对美颜软件和社交媒体依赖的成瘾，以及美颜综合症的出现，会为主体畸形恐惧症提供土壤，加剧它的负面影响。\n\n好在，西方媒体都开始纷纷关注美颜综合症和身体畸形恐惧症，对读者做出了相应的警示。一些整容医生已经开始提醒前来咨询患者注意防范心理上的风险。\n\
    \n那么，有没有预防这两种心理疾病的方法呢？心理学家们指出，就算你未来还要继续修图，继续在社交媒体上发自拍，你也起码要做到“心中有数”，分得清什么是真实，什么是虚幻，不要迷失在美颜带来的幻象里。\n\
    \n# ### 总结\n\n“美颜综合症”成为了一个值得警惕的新趋势，患者认为，用美颜软件修图后的脸，才应该是真正的自己，他们不惜通过整容来让自己的“活成修图后的样子”。这种对容貌过度关注会导致极大的社交焦虑感。\n\
    \n《美国医学会杂志》认为，在这背后，社交媒体起到了推波助澜的作用。医生们更担心的是，美颜综合症发展下去，可能会诱发一种更严重的心理疾病——身体畸形恐惧症。到时候，患者必须需要进行专业的心理治疗，甚至吃药才行了。\n\
    \n老实讲，我看相关报道后，不由得想起了一句很流行的英文：I may not be perfect, but at least I'm not fake 意思是说：“我可能不完美，但最起码，我活得真实”。\n\
    \n假如，我们能从内心真正接纳那个“不那么完美的自己”，或许就有了美颜综合症的解药。\n\n你身边是否存在“美颜综合症”的现象？你自己是否感受过“美颜”所带来的心理压力呢？欢迎你在留言中告诉我，也欢迎你转发身边多爱修图的朋友们。\n\
    \n# ## 划重点\n\n+   - 今日得到：\n  1. 过度依赖美颜软件可能引发“美颜综合症”，人们沉迷在美颜照片换来的赞美中，分不清真实和虚幻的自己，不敢以真面目示人，甚至想把自己整成美颜照的样子。\n\
    \  2. 人们在社交媒体上的活跃度越高，对自己外貌不满意程度就越高，失落、孤独和焦虑感也越强烈，这是引发美颜综合症的主要因素。\n  3. 美颜综合症可能诱发“身体畸形恐惧症”，这是一种严重的认知失调，需要采取医学手段治疗。\n\
    \n# ## 资料来源\n\n+   - 刊物\n  - “Selfies—Living in the Era of Filtered Photographs,\
    \ JAMA Facial Plastic Surgery, 2018.8.2”\n  - “Snapchat Dysmorphia”: Selfies,\
    \ Photo Filters Driving People to Plastic Surgery, CBS, 2018.8.6\n  - “Snapchat\
    \ Dysmorphia”: Inside the Trend of People Getting Surgery to Look Like Their Filters,\
    \ Inside Edition, 2018.8.19\n  - “Body Dysmorphic Disorder Affects 1.7% to 2.4%\
    \ of the General Population- About 1 in 50 People, Anxiety and Depression Association\
    \ of America, 2013\n\n# ## 下期预告\n\n下周一的议题是#哈雷摩托如何陷入时代困境#\n\n哈雷作为美国三大最有名的世界品牌之一，因为消费群体太老而且日渐势衰，哈雷为何错过了转型的时机？它做了哪些努力和改变？\n\
    \n![](img/105e314200188b1eed4f6514f28e6cda_48_1.png)\n\n# ## 用户留言\n\n**张筱Yucky**:\
    \ 我身边有部分女性朋友在“拍照五分钟，修图一小时”的行为。发到朋友圈之后，不仅朋友圈的人都看不到原图了，还会问我：“你看着这张去怎么显得有点奇怪呢。”这可能就是一种“美颜综合症”的现象吧。\n\
    \n我作为一名女生，我不否定爱美心、修得完全看不出自己的样子，结果会带给自己一系列焦虑。当面见之后的照片与自己相差太大，自己也会出现：“别人会不会觉得我太作了太假了……”等一系列心理压⼒。\n\
    \n目前还没有感受到在“朋友圈”的社交压力下，我目没有很少会在朋友群里发自己发自拍……当好友聚会合影的时候，对于想知道能进行大幅度修图的朋友，我会拜托她“手下留情”。\n\
    \n**刘溜溜**: 很幸运的是，我身边虽然有很多爱美颜的女性朋友，但没有发现患者“美颜综合症”的人。我自己最美颜的照片应该是拍照的时候……\n\n现在美颜似乎成了一种全新的“炫耀性消费”，许多人把各种照片和奢侈品包装自己，让美颜的爱好者来分享“美颜”的社交地位，这似乎成了一种经济方式。\n\
    \n或许到了严重的程度会形成心理疾病，不过在平时对一些女生，这也是一种乐趣。在我身边一些女生里喜欢在一起还会讨论自拍的照片中以共同探讨P图技术，这也是他们社交的方式，拉近双方距离的方式。\n\
    \n能相互分享P图后更完美的自己，也能在生活中不再买真实的自己，这同意义不是一种坦诚、值得信任的社交方式呢？\n\n**Dante**: 一个人越是炫耀什么，就越缺什么。\n\
    \n美颜图严重成瘾可以理解为对自身相貌缺乏自信的表现，会在社交里产生过度活跃的行为，很有可能会缺乏真实的社交。\n\n以上留言由作者 筛选显示"
