    # 📚 划重点


    > 今日得到：


    在神经科学技术的推动下，未来的武器，可能不再是刀枪箭炮，而是把人的大脑变成武器，比如让残废士兵通过大脑来精确地控制假肢，或者把军事技能直接“下载”到军人 的大脑里去；神经科学技术也可能被利用到民用领域，我们不需要通过键盘就能直接输出大脑里的想法，或者直接用大脑控制机械，这一天离我们并不遥远。


