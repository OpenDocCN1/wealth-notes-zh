    同情疲劳指的是，由于长期承受同情心的压力，人们在生理上、心理上和情感上出现的精疲力竭和功能失常，常见于医护人员。在新媒体时代，由于接受过量的负面信息，普通人也很容易出现同情疲劳，变得越来越麻木，并且失去解决社会问题的动力。

    解决的办法，就是让自己更成熟和理性，既能接受人间疾苦的常态，又不至于丧失同情心，能够在“始终保持同情心”和“同情心泛滥”之间找到一个合适的度。


