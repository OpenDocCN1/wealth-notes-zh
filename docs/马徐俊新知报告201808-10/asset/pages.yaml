  md: '# 059报告 | “人造肉”能缓解全球变暖趋势吗？


    今日报告：“人造肉”能缓解全球变暖趋势吗？


    中国目前面临着个窘境：如何能在不损害国家对遏制温室气体排放、应对全球变暖的承诺之下，满足人民对肉类激增的需求。——《大西洋月刊》


    马徐骏


    作为一个新兴的行业和生活方式，“人造肉”正在逐步进入市场。普通人为解决全球变暖问题能做什么呢？也许，选择吃人造肉就是一个切实的贡献。


    今天的议题分为两个部分：


    +   吃肉在多大程度上加剧了全球变暖？

    “人造肉”将如何缓解全球变暖的趋势？


    全球变暖加剧，在今年夏天可是一个热门议题，占据了各国天文刊的封面。我们之前讲过的054号报告，说的是《经济学人》关于全球变暖的封面报道，标题叫《在火线上》，中国是处在奋力扑灭一场火灾。还有8月4日这一期的《新科学家》封面，标题很直白，叫做“越来越热了”(It''s
    Getting Hot Up Here)，封面图片是冰水即将融化的景象。你可以从这两张封面图里感受一下，全球变暖这个问题，已经严重到what程度。


    ![](img/105e314200188b1eed4f6514f28e6cda_25_0.png)


    ![](img/105e314200188b1eed4f6514f28e6cda_25_1.png)


    我们多次分析过全球变暖控制不下来的深层原因，从中，你可能会有一种感觉——全球变暖的背后，大多是国家的、市场的、行业巨头层面的问题，普通百姓的饮食实在很轻微。换句话说，我们明知道这个问题很严重，却几乎做不了什么。


    但最近《大西洋月刊》上发表的一篇文章，就令我，说真的我感触挺深的。其实咱们日常生活中有一件事，对全球变暖的影响非常直接，那就是一吃肉。再进一步说，这件事跟中国人的关系，还特别大。


    《大西洋月刊》的这篇文章，标题就叫 China''s Love For Meat Is Threatening Its Green Movement，翻译成中文就是《中国人爱吃肉已经威胁了环保进程》，专门点名吐槽了中国人的吃肉问题。


    《大西洋月刊》认为，中国目前正面临着一个个窘境：如何能在不损害国家遏制温室气体排放、应对全球变暖的承诺之下，满足人民对肉类激增的需求。


    > 这句话也被我选为了今天的金句——China is faced with a quandary: How to satisfy the surging demand
    for meat without undermining the country''s commitment to curbing greenhouse gas
    emissions and combating global warming.


    # | 吃肉在多大程度上加剧了全球变暖？


    如果你问，吃肉和全球变暖之间有什么关系？答案只有三个字——畜牧业。


    这个逻辑让我们去，就是按金字塔形状的生态链逻辑，人类处在金字塔的形状端，要获取养牛马，就得养活这些牲畜，而这些需要占用大面积草原，比如牲畜需要草地，场地不够就得砍伐森林，森林一减，温室效应就会加剧；同时，养牲畜需要喂粮食，比如说大豆就是牛的的主要饲料，牲畜越多，需要的粮食就越多，这个循环就长又越多的一种越多的粮食，就需要占用更多的耕地，耕地面积不够，还得砍伐森林。


    再说，动物本身也会带来排放，比如牛有四个胃，牛打嗝的嗝儿里面，就包含有甲烷，而甲烷，就是一种很强的温室气体。


    总之，根据联合国粮食及农业组织的数据(The United Nations Food and Agriculture Organization)，畜牧业的碳排放量占总排放量的14.5%，这个数字在未来还会不断上升，因为根据这个组织的预计，在接下来的30年里，肉类的产量还会翻一倍。


    《大西洋月刊》在文章里评论说，如今中国人的生活水平是越来越好了，但吃肉也是越来越多了。


    我给大家几个《大西洋月刊》给的数据，你来感受一下中国人吃肉的实力——在过去的35年里，中国的肉类消费量增长了7倍；1980年左右，中国人年均10公斤，当时中国人平均每人每年吃57斤左右的肉，现在，中国人有14亿左右，平均每人每年要吃127斤肉。


    总体来说，咱们中国一个人，就吃光了全世界28%的肉。咱们总是美国人爱吃肉，其实中国人吃肉的量，是美国人的两倍。公共政策研究机构Wielinkd 专家说的，到了2030年，中国人的年人均肉品消费量，可能从现在的127斤增加到181斤左右。


    那么问题就来了，为了满足人们越来越高的吃肉消费需求，畜牧业就不得不扩大生产规模，生产就会带来更多碳排放，加剧全球变暖的趋势。按照《大西洋月刊》的说法，中国现在是世界上最大的碳排放国，碳排放量占到了全球总排放量的27%。


    要影响的还不只是中国的碳排放问题。要知道，中国的畜牧业，是全世界一半的牧场，肉四之一的家禽和10%的牛群，就这样，还不够，中国还得从其他国家进口肉，这就直接刺激了其他国家的畜牧业扩张，也就给这些国家带来了更多的碳排放。


    这个问题非常现实，那么，咱们要怎么办？


    我当然不会劝为了环保少吃肉，我能说的是，想解决这个问题，也许能从科技的角度，找到一些方案。比如说，用“人造肉”来代替普通肉类。


    # “人造肉”将如何缓解全球变暖的趋势？


    毫无疑问，人造肉(clean meat)是如今西方世界的一大热点，从学者、媒体，到商业大亨，都密切关心这个行业。


    《人类简史》和《未来简史》的作者尤瓦尔·赫拉利，在今年又出版了一本新书，叫《今日简报》。我觉的这本书像，其实它的英文名全都是讲个话题目——27 Lessons
    for the 21st Century—《21世纪的21个重要课题》。


    在这本书中，第7个议题讨论的是人造肉的问题。赫拉利很有想法人造肉，他在书中有一个观点，就是想吃汉堡的话，如果能让工程师培育出一片汉堡就好了，就不用去杀牛杀牛了。


    实际上，人造肉的技术，在2013年时就实现了，当时，一片人造肉的造价是33万美元，显然是不是普通的百姓消费得起。不过，到了2015年，人造肉的价格就降到1美元了。赫拉利在书中说，再过10年，这种人造肉的成本，将会比养殖屠宰后的肉类便宜。


    西方媒体关于人造肉报道太多了，我在'
  merge: -1
  img_proc: true
- pgno: 26
  md: '西方媒体关于人造肉的报道太多了，我在去年就读过很多关于人造肉的文章，其中最有价值的，就是《财富》杂志、彭博智睿报告，和美国国家科学院NAS发表的报告。今天，我就在这里向你进行一个汇总性的介绍。


    对于人造肉的未来，西方媒体还是很看好的，目前人造肉目前已经逐步进入市场，它的制作主要有两种方式。


    一种方式是利用细胞技术来生产人造肉，比如说美国的创业公司Memphis Meats就用牛细胞生产肉丸。还有一种方式，是利用生物技术把植物变成肉，比如美国的家创业公司impossible
    foods，就已经实现了“素肉汉堡”，2016年起在纽约开卖，每个12美元，据说口感和真实的牛肉很接近，看起来也很像，有血丝，在烘烤时会发出滋滋的声音，还会散发出肉香。


    这家公司已经拿到了多轮融资，光是D轮融资就高达1.08亿美元，投资人我们都很熟悉，包括李毅中和比尔·盖茨。据说谷歌还曾经开出过3亿美元的高价想要收购这家公司，但被拒绝了。


    日本也研究过人造肉，不过脑洞就比较大了，我在2011年就看过《福布斯新闻》和英国《每日邮报》的相关报道，讲的是日本人用人类的排泄物来制造人造肉。根据介绍，这种人造肉的营养还挺丰富，含有63%的蛋白质、25%的碳水化合物、3%的脂类，以及9%的矿物质。但这个实在是口味太重了，当时《福布斯》的记者也表示质疑和反对。


    那么，人造肉作为一个新兴的行业和生活方式，它的商业成熟度究竟怎么样呢？


    《福布斯》杂志预测，2022年左右，人造肉就会大量进入市场，十年内在价格上就能和传统肉来匹敌。这个观点也得到了美国国家科学院NAS的报告，彭博智睿在2016年曾经发表过报告，报告中指出，人造肉的销售额，平均每年增长8%，约20亿美元。国际可持续发展及企业管治研究机构Sustainability则预测，人造肉的销售额增长率将在五年内升到8.4%，除了美国和欧洲，中国也会成为人造肉的主要消费市场。但我现在看起来，这个速度还要更快，去年，人造肉公司Beyond
    Meat制作的人造肉汉堡就已经进入了美国超市，正式成为肉食类产品的一员。


    总之，无论是什么形式，人造肉不仅进入了人们的视野，也走入了人们的生活。


    # | 总结


    吃肉这事儿儿，对咱们来说是满足口腹之欲，是一种慰藉。但对于世界环境来说，咱们吃的肉越多，对它的压力就越大。但我觉得，虽然说得国人吃肉的总量，是美国人的量倍，但中国人均吃肉的量，才是美国人
    均吃肉量的一半，没道理人家吃了这么多年，到我们这就不让吃了。但事情也不是非此即彼，要不就是吃，要不就是不吃。科技的存在，可以给我们更多的选择。


    今天留给你思考的问题是，你能不能接受吃人造肉？为什么？


    欢迎你留下自己的答案和我交流。也欢迎你把今天的内容转发给你身边无肉不欢的朋友，碰碰一下他们的看法。


    +   今日得到：


    1.过去35年里，中国人的吃肉量上涨了7倍，预计接下来还要再翻一番，这大大加剧了全球变暖的趋势。


    2.“人造肉”在西方世界是一种很被看好的趋势，谷歌曾想花3亿美元收购一家人造肉的技术公司。


    3.到2022年左右，人造肉就会大量进入市场，成本比普遍肉类还要低。


