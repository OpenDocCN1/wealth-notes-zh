  md: "# # 072报告｜哈雷摩托的时代困境\n\n哈雷陷入的困境，是不知道自己究竟应该代表什么。既想开拓未来，又不愿放弃过去。  \n——《彭博商业周刊》\n\
    \n# # 今日报告：哈雷摩托的时代困境\n\n徐骏斐\n\n哈雷在这个全球化的时代，遭遇了一场从文化到商业的双重危机。如果哈雷的野化变成了顺从的小绵羊，哈雷还是哈雷吗？\n\
    \n今天的议题分为三个部分：\n\n+   - 哈雷摩托车陷品牌危机\n- 哈雷为何打动不了年轻一代？\n- 进退两难的选择\n\n咱们先闭上眼睛，想象一个场景，在美国西部耀眼的蓝天下，热浪滚滚的沙漠中，代表着荒原精神的66号公路上，伴着咆哮的引擎声，飞驰而来一队摩托车骑士。请问，你觉得他们的摩托车会是哪个牌子的？\n\
    \n答案只能是一个——哈雷·戴维森。\n\n这样的场景你一定非常熟悉，它反复出在好莱坞电影、美剧、广告、小说、海报里。遥想、追索、只是提到摩托车，你脑海里第一个蹦出来的，就是哈雷。它就像一座圣杯，不但是美国文化的经典代表，也是近代心目中象征着独立、自由、不羁的精神符号。\n\
    \n美国有三大世界知名的国民品牌，除了可口可乐和迪士尼，哈雷摩托。整个20世纪下半叶甚至一度被称为“哈雷时代”。\n\n然而，就是这么一个塑造了百年历史的传奇品牌，却在全球化的今天，遭遇了一场从文化到商业的双重危机——哈雷摩托车它的拥趸们，主要是美国的中老年白人男性群体，正在一起慢慢老去，陷入了左右为难的困境。\n\
    \n这次《彭博商业周刊》的封面文章 *The Hog of Tomorrow*，说的就是这件事。文章指出哈雷摩托的处境，有一句很精辟的点评——哈雷陷入的困境，是不知道究竟应该代表什么，既想开拓未来，又不愿意放弃过去。\n\
    \n```\nHarley is caught between duplicating ideologies about what it represents.\
    \ It’s searching for a middle ground, one that will let it reach into the future\
    \ without letting go of the past.\n```\n\n![](img/105e314200188b1eed4f6514f28e6cda_49_0.png)\n\
    \n# ## 哈雷摩托陷入品牌危机\n\n不论你是不是机车迷，你大概都听说过哈雷摩托的大名。毕竟，哈雷在二十世纪美国文化的各个层面，都扮演过重要的角色：\n\
    \n1918年，第一次世界大战签订停战协议之后，第一个进入德国领土的盟军士兵，骑的就是哈雷摩托车；第二次世界大战开始后，哈雷生产了9万辆军用摩托，成了二战美军士兵生活的一部分，奠定了美国军人心中国、忠诚、胜利的象征意义；半个世纪以来，美国的重大社会事件和街头游行，哈雷摩托几乎都是主角；一代摇滚教父“猫王”、知名影星马龙白兰度都是哈雷摩托的狂热粉丝。就连我们熟悉的电影《终结者》里，施瓦辛格的座驾也是一辆哈雷摩托。\n\
    \n在二战后出生的“婴儿潮”一代眼中，哈雷又成了摇滚乐、自由精神和摇滚士文化的精神之一，对它不仅仅是  骑摩托是一种梦想，因为它不仅仅是一种交通工具，更多代表着一种生活方式、一种精神盔甲、一种深刻的文化认同感。\n\
    \n当这些尘埃落定的时候，哈雷摩托也走上了巅峰。1997年，美国哈雷摩托的人数达到了历史最高点，当年的销量连续12年打破增长纪录，那个时代，能够买到一辆哈雷摩托车，得排队等两三年才行。当时，美国摩托市场的80%，都是哈雷的。哪怕它又贵又丑，粉丝们却根本不在乎，他们要的就是它的特立独行。\n\
    \n美国著名品牌战略研究专家大卫·艾格在《建立强势品牌》这本书里曾写道：“对一些人来说，骑哈雷摩托车比遵守法律，更能表达强烈的爱国情怀。”\n\n但是，时代在变化。2008年经济危机之后，哈雷遭遇重大低谷。三年间，哈雷在美国本土的销量，下跌了超过40%，从\
    \  2014年至今，又跌了14%。\n\n经济危机只是一个诱因，更要命的是，哈雷托管着引以为豪的品牌文化，也遭遇了巨大的挑战——当那些曾经风光的哈雷粉丝们，正在老去，如今骑哈雷摩托的人，平均年龄已经超过了50岁。《彭博商业周刊》的高级数据分析师乔伊·麦格说，当下的年轻一代美国人跟自己的长辈相比，对摩托车的感情已经没有那么深了。\n\
    \n这就奇怪了，哈雷不是美国精神的代名词吗？怎么年轻一代美国人却不认识它了呢？\n\n![](img/105e314200188b1eed4f6514f28e6cda_49_1.png)\n\
    \n# ## 哈雷为何打动不了年轻一代？\n\n哈雷之所以就引起年轻人的兴趣，主要有三个原因：价格昂贵，不够环保，缺乏竞争意识。\n\n首先，在美国，主要的交通工具是汽车，摩托车被视为一种休闲娱乐的奢侈品，价格比较贵。一般是5000到47500美元一台，而哈雷的平均价格是1万5千美金。现在美国的工薪一代年轻人，光是学费贷款都要还1万5千美金了，债务负担很大，更别说还有房贷、结婚生孩子\
    \  的花销，这笔钱用来买哈雷摩托，还不如买辆二手汽车更实用。\n\n其次，如今的美国年轻人深受环保理念的影响，更青睐小排量、电力驱动  的交通工具。哈雷的排\
    \  汽  声  音  又  大 ， 跟  环 保  可  以  说  是  背  道  而  驰 。\n\n再次，进入千  纪  之后 ， 哈  雷  面\
    \ 临  日 本  的 本 田 、 雅 马 哈 、 欧 洲 的 宝 马 这 些 品 牌 的 强 烈 竞 争 ， 这 些 品 牌 更 倾 向 于 追 逐 摩\
    \ 托 车 小 树 苗 以 了 的 通 用 车 形 。 很 快 ， 就 在 年 轻 人 心 中 树 立 了 coo l 的 形 象 。 可 是 ， 哈 雷\
    \ 从 来 没 有 推 出 过 骑 车 型 ， 一 旦 转 开 摩 美 国 开 源 高 速 公 路 系 统 ， 在 其 他 品 牌 的 马 路 上 ， 哈\
    \ 雷 就 施展 不 开 。\n\n至于电动摩托，哈雷也迟迟没有推出，这样一来，哈雷的市场份额就不断遭到挤压。\n\n听到这里，你可能会想，刚才说的这些问题，其实很多传统企业都遇到过，但为什么它们都能抓住时代变革的趋势，准确地判断形势，抓住机遇，实现转型或者迭代呢？可口可乐和迪士尼不就不是这样的吗？为什么哈雷就不行呢？\n\
    \n这背后的原因，就是哈雷品牌理念的“双刃剑”——哈雷当年辉煌，靠的是它强硬的品牌文化和精神气质。这种强悍，在半个世纪前，曾  为  几 代 了 粉 丝 们\
    \ 的 心 中 世 界 ， 但 它 也 让 哈 雷 变 得 非 常 自 满 ， 根 本 看 不 到 时 代 的 变 化 、 危 机 的 到 来 ， 更 不\
    \ 愿 意"
