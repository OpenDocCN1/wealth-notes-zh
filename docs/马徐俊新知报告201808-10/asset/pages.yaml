  md: '中出现的弄虚作假等问题之外，其实更多的问题是出现在妈妈们冲泡奶粉的过程中。


    据《泰晤士报》报道，几十年来，婴儿配方奶粉公司在发展中国家的销量，远远超过发达国家。但是，为了节省开支，发展中国家的贫困妇女，会用不安全的水，对奶粉进行稀释。牛奶粉不良，而且还会引起部分婴儿死亡。美国国际开发署的一名医生，认为这种操作上的失误，造成了发展中国家每年约100万婴儿的死亡。


    所以，现在出现了一个叫“有喂养就是最好的”(Fed is Bes)的新运动。这项运动致力于通过教育，向家庭普及婴儿喂养方面的知识，其中包括母乳和奶粉在内的所有安全喂养方式。Fed
    is Best运动认为，母乳喂养当然是优先选择，但如果及新生儿不能摄取足量的母乳，容易造成各种并发症，所以，对于一些没有条件进行纯母乳喂养的家庭来说，配方奶粉也不失为一种好的补充——这从科学喂养的角度，为母乳和奶粉之争起到了调节作用。


    # | 总结


