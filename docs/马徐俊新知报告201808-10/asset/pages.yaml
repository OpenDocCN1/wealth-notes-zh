  md: '# 087报告 | “自我意识”的真相


    087报告 | “自我意识”的真相， 087报告 | “自我意识”的真相


    # 今日报告:


    对“自我”的察觉，似乎并是什么意识的最 高级形式，可能也只是另一种进化的需要。


    ——《新科学家》


    马徐骏


    如果人类智能学会了从镜子中认出自 己，我们能就此断定，它具备了“自我意 识”吗？被广泛认可的镜子测试“出了 什么问题？


    今天的议题分为三个部分：


    +   - “镜子测试”为什么不再靠谱了？

    - “自我意识”究竟是什么？

    - 人工智能离“自我意识”还有多远？


    人工智能会不会产生“自我意识”，是个 老问题了，答案一直是：很多人坚信，这 是最难的事。可问题是，万一真有一 天，人工智能产生了自我意识，我们怎么 能知道呢？


    如果你想说“到那时我们自然会知道的 ”，那这可不是科学的答案，科学必须 有明确的操作标准。而目前，人类能想到 最高明的测试方法就是：给一只猴子镜子。


    科学界一直认为，能认出镜子里的“自 我”，这里为意识的最高级形式，也是智 慧生物独有的行为。镜子对于人类来说， 也具有很重要的小小说《苏菲的世界》里， 可能也逃不过，在书里，14岁的少女苏菲，
    由于机缘巧合，打开了通往哲学世界的大门。


    但一切的开始，是某天苏菲站在镜子里， 打量着里面照映出自己的自己，问了一 句：“你是谁？”


    可你不仅是作家笔下的桥段，科学家们 是真的设计出了一个类似“镜子测试”。 用来测定动物是否具“自我意识”。 除了人之外，到目前为止，动物界只 有些猩猩、黑猩猩、海豚和白鲸通过了
    这一测试，而它们也被科学家们认知 为最智慧动物。这也似乎证明了几类认知： 只有最聪明的动物才有自我意识，才能 够明确区分“我”这个概念，分自己和 其他个体。


    可是最近，这个被广泛认同的“镜子测试 ”在可信度上却出了问题。最新的《新科 学》杂志刊登文章指出，这一项测试太 难住了。因为近期实验发现，能认出 镜子中的“自我”这件事，是可以让通过
    镜子来学习的。这一发现，迫使人重新 修正了对于“自我意识”的认知。


    那到底是怎么样修正的呢？答案就是： 对“自我”的察觉，似乎并不是什么意识 的最高级别形式，它或许只是一种进 化优势，是为了更好地在环境中生存， 时刻读懂他人想法的时候，所演化出的一
    种“副产品”。


    这句话，也被我选为了今天的金句：


    > Self-awareness is likely to occur in creatures whose survival is dependent on
    reading the minds of others. In fact, it is nothing more than an accidental by-product
    of evolution.


    这么重要的新知，建议你千万别错过。


    ![](img/105e314200188b1eed4f6514f28e6cda_78_0.png)


    # 镜子测试为什么不再靠谱了？


    答案其实很简单，因为最新实验发现，一 些之前没通过“镜子测试”的物种，通过 短短的练习后，竟然也通过了测试。


    如果就像一个考试的内容，显然答案 是，只要多“考试练习”培训，竟然连 猩猩都能过及格线，通过了考试。那你 觉得，这个考试还能考出答题者真正的能 力吗？


    不过，在搞清楚猴子是怎么学会“答题技 巧”之前，咱们必须先了解一下“镜子测试”的原理，这个过程很有意思，研究人员 会把动物身上涂上带颜色的斑点，通常是涂在额头或脸颊上，这样动物在自己
    照镜子时看到镜子里斑点的时候，它们 能辨认出自己是猴子，它们会试图去 触碰镜子里的斑点。而斑点，是涂在它们 真实的额头或脸颊上，它们能辨认出 镜子里的斑点，是它们自己，这就说明了
    它们有自我意识。


    反过来说，没有自我意识的动物，会把镜子里 的影像当成别的个体，对镜子里出现的斑点 没有反应，或者是去攻击它，甚至把镜面当 成是竞争对手。


    这个很好理解，如果你养过宠物的话，对这一 幕应该很熟悉：大多数的猫和狗，到达 镜子的时候，要么装作扑上去，要么 躲着镜子走，所以，猫和狗都没通过镜子测试。


    能通过动物有哪些呢？有红毛猩猩、亚洲象、海豚、虎鲸，都是公认的高智商动物。


    所以人们理所当然地认为结论：自我意识 和智力水平是挂钩的。足够复杂的大脑， 才会有自我意识。


    那他们之前说的，是那个实验，是怎么导致 了“镜子测试”的根源呢？说起来，这个实验 是《自然》中的一篇论文：上海生命科学研究 院的研究所做的，实验的对象是黑猩猩。


    只是在实验中，研究人员教给黑猩猩使用镜子 工具，去找身后的斑点。如果猴子 模仿了光，就把它身体上的光点拿走，通过 几个小时的训练，它们不但发现镜中的自 影是自己的，能利用镜子来检查自己身体
    上未看到的部位。


    这个结果很有意思，一方面，它足以说明 照镜子这件事，是可以训练的，也就是说，会照镜子，未必就等于是有自我意识，动物也可能只是把自己的肌肉运动 和眼所见的东西，关联起来。这当然
    也间接否定了“镜子测试”的有效性；另一 方面，它也表明，对于自我意识并不存在 二元的，能/不能，而是连续光谱，这 些动物虽然没能通过镜子测试，也 未必说明它们就没有自我意识，只是我们
    测试的方法有问题。


    你可能需要点时间消化一下，没关系，我想说的 就是：无论哪一种解释和说明，“镜子测试”在判定自我意识这事上，有问题的。


    那么，我们以后能不能用“镜子测试”为 标准，来判断人工智能是否具备自我意识， 这就引出了一个问号。


    更令人担忧的是，之前我们对自我意识的 理解，是否也出现了偏差呢？这促使科学 家展开更深入的思考。


    ![](img/105e314200188b1eed4f6514f28e6cda_78_1.png)


    # “自我意识”究竟是什么？


    很多心理学家和人类学家认为，意识是 分级的，每一级都和大脑的复杂程度相关。 低等级也有低等级意识，但只有复杂 的大脑，才能产生高等意识，而最高等 的“我”，体验是结构来支撑，并用来
    探究，描述自己围绕我们的世界，所以自我 意识属于意识的最高级形式，只有智慧生 物才会拥有。


    但银河级的镜子测试，让人们重新思考这 个问题：如果“自我意识”是从自我“训 练”出来的呢？那就有意思了，自我意识 不特殊，要么是高度复杂或者智商高的 物种，而是《新科学家》提出的一个新观点：
    人和某些动物会拥有自我意识，或许仅仅 是因为他们有更复杂的社会生活。自我意 识，是一种进化的需要。


    英国牛津大学的人类学家罗宾·邓巴提出 了著名的“社会脑”假说，他指出：在一个 非常复杂的灵长类社会群体中，个体的存 在于非大，因为这种生存需要更多的信息 来处理，所以，必须时刻读懂他人想法。
    为了做到这一点，需要在脑中构建一个“ 心理理论”，通过演化，最终结果就是获 得了自我意识。'
