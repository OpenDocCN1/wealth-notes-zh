  md: '# 112报告 | 人脑能变成武器吗？


    > 智能手机和互联网技术给人类社会带来的变革，在从未被神经科技造成的颠覆和改变面前，显得微不足道。

    ——《大西洋月刊》


    美国军方有一个充满神秘色彩科研机构，名叫DARPA，它是硅谷大半底层的科技命脉，也是未来武器发展方向的掌舵者。DARPA 曾是开了一个天大的“脑洞”——把人的大脑武器化。


    今天的议题分为三个部分：


    +   - 硅谷为什么紧盯DARPA？

    - 人脑武器化

    - 神经科技能实现民用吗？


    你可能是好奇了，未来的武器长成什么样子？是像“OO7”系列电影里的潜水飞机？能发射导弹的汽车？还是传说中最神奇的生化武器、纳米武器，甚至气象武器？


    本期刊《大西洋月刊》的封面推文，花了很大的篇幅来回答这个问题，标题就很吸引人，叫《五角大楼正在把人类的大脑武器化》，文章大意是，美国五角大楼下属的一个叫DARPA的机构，正在研发未来的武器，研究方向，不再是向外增强外部杀伤力的刀剑箭镞，而是向内探索人类的身体，也就是说，把人族的肢体能至无脑当成武器，而这需要借助一个有半新的技术，叫做
    Neurotechnology——神经科学技术。


    《大西洋月刊》说，这个技术带来的，不仅仅是武器研发的全新进展，它可能会影响到人类社会的方方面面，文章里有句话是这么说的：


    > Neurotechnology could cause social disruption on a scale that would make smartphones
    and the internet look like gentle ripples on the pond of history.


    智能手机和互联网技术给人类社会带来的变革，在从未被神经科技造成的颠覆和改变面前，显得微不足道。


    这句话也被我选为了今天的金句。


    ![](img/105e314200188b1eed4f6514f28e6cda_129_0.png)


    # 硅谷为什么紧盯DARPA？


    美国军方有一个充满未来感和神秘色彩的科研机构叫DARPA，全称 Defense Advanced Research Projects Agency （美国国防部高级研究计划局），这个机构有多重要呢？它是硅谷这个科幻的科研圣地里的靶心、不敢踩雷的一颗科技高地。


    为什么这么说？据文章的介组，DARPA 的创立，是因为 1958 年的冷朝，前苏联发射了人类历史上第一颗人造卫星，让全世界为之震颤。为了应对这次的危局，美国总统肯尼迪发话，当时的美国总统尼克松毅然成立了一个独立的武器研究机构，叫做高精尖研究计划局，只向国防部汇报。这个机构使命，就是研发出打破常规、超脱想象、面向未来的武器，经过半个世纪的发展，这个机构就成为了今天的DARPA。


    所以你，从创立之初，DARPA的重要任务就是“打破常规”和“超脱想象”，而从这个角度上来说，DARPA 可说是无界度，比如说，DARPA 的经费比说明得息急武器，以及电影《星语大战》里的“光剑”；体脑战的研究，它还在过专用用于休旅战斗的机器人、脑白运动量里的“高达”差不多。听上去，不是一个一个比一个更像？


    这些武器都尚未有真正投入实战，已经让读者感受到DARPA的“脑洞”太大了。其实，DARPA研发出来的很多高科技，一部分已在我们日常生活中不可缺少的，比如GPS
    系统、语音识别、技术、无人机甚至互联网，都由DARPA 研发出来的。之后逐渐从军用过度到民用领域，这些技术，几乎每一样都有创利意义，同时，也携带者巨人的商业价值。


    看到这里就明白了，为什么DARPA 的研究方向和科研成果，不但是全球军事领域关注的焦点，还是硅谷的灵魂源泉了。硅谷的知名公司，像谷歌、Facebook、马斯克的
    SpaceX，都没少从DARPA 挖过人。


    更有意思的是，DARPA 本身的工作模式，很像那些创业公司，或者也可以说，创业公司的组织架构，有从DARPA 偷师的。DARPA 共有 220 名全员，有
    1000 家供应商，2522 名员工，有一部分是科学家和工程师，他们除了做自己的研究工作之外，还要负责监督分散在全球各地的合作企业、顶尖大学和实验室外工作的进度。


    而且在过去的14年里，DARPA 每年的预算都有差不多30亿美元，只要DARPA 觉得哪个项目有价值，或者哪个人才重要，它们就会不惜重金挖到它们的麾下。


    DARPA 信奉的准则是 high Risk, high Reward——高风险带来高回报，不怕一点子听起来更完美，只只要它有战略价值和理论上的可行性，DARPA
    就会投入大人力财力来开拔，因为DARPA 就认说，you can weaponize anything——万物皆可武器化。


    # 人脑武器化


    我们一直说DARPA脑洞大开，这可不只是一句形容，DARPA 正在研究的更多，的信息是在人脑上展开，注人更多功能，发挥更大的威力。说白了就是，要把人类的大脑武器化，因为他们使用的科技，正是我在文章一开头介绍的“神经科学技术”。


    那么，怎么利用神经科学技术把人脑武器化呢？


    我说了两个DARPA正在做的研究，你一看就知道了：一个是研发，用大研究控制外部机械甚至是武器；另一个是把技能直接“下载”到大脑里。


    2014 年，DARPA 建立了生物科学办公室，是DARPA 六个主要部门里最新的一个，这个办公室的职责，就是专门负责研究如何让人脑更好地发挥作用。


    比如说，美国国防部被一款针对傻般的军，专门给那些残疾的士兵和残疾使用，它能在最新的假肢技术，可以使用者的动作精细到大一小块巧力或者进地自机械，甚至可以让他们装40千克的硬枪，上上下下来一干，直到电池没电也不会感到累。


    DARPA 看到了这项技术武器化的潜力，试想着，如果把这项技术，让正常人可以通过大脑直接操纵机械，结果会怎么样呢？比如可以操控智能机械城市，甚至驾驶空直具和战机投掷弹，现在DARPA
    就成功地做到了，让人用大脑直接控制飞行模拟器来飞行。


    另外，2013年，维克隆奈大学、南加州大学与康奈尔大学等发表了一篇学术发，讲的是在老鼠身上进行的大脑训练研究。这项实验分为1只老鼠的大脑里，植入电极，然而分为两组，一组属于比较快的训练项目，暂且就叫它“困难组”，另一组的任务相对简单，我们就叫它“简单组”的吧。


    当“困难组”的老鼠，学会了自目标功能之后，实验者通过电脑研究它们大脑的神经学习模式，把这些技能复制到“简单组”老鼠的大脑里，就能发现，本来需2周时间训练来掌握的技能，短短几秒钟时间就可以让老版掌握了。这不是很像电影《黑客帝国》里的情节，你会不会手道，直接把钟容手器的技能到脑子里，让几小时成为武林高手，不会飞机？没事，下载个飞行技能到你脑子里，几秒钟后，你将在空中花式飞行。


    DARPA 看到了这项研究，于是用自己的方式，让这些大脑里学的科研团队成自己的外包合作者，继续开发。DARPA的终极目标，就是让军人短时能击中、识别和杀伤，请速来这几个方面可以干'
