    099报告 | 共享经济如何重新定义工作


    围绕共享经济的争论，才刚刚开始，路还长着呢。


    ——《经济学人》


    # 马徐骏


    共享经济的代表——咱们都非常熟悉的 Airbnb，到今年已经诞生13周年了，在这个时间节点上，知识界会对共享经济做一次什么样的复盘呢？


    今天的议题分为两个部分：


    +   - 共享经济产生了哪些正面影响？

    - 共享经济带来的问题是什么？


    共享经济这个概念，在过去的几年真是太火了，从衣食住行到给人买衣服、装家具，各种巧思服务，深度嵌入到了现在人的都市生活，给我们带来便捷的同时，也形成了很多“灰色地带”。


    《经济学人》本期的封面推荐文，就详细分析了共享经济给劳动力市场带来的变化和问题。在《经济学人》看来，共享经济改变了人们对于工作的定义和基本面，而这种由移动互联网技术所起的新型工作形态，在未来还会不断发展。所以，正确地认识它，无论是对于雇主还是雇员，都是必要的。


    今天我们就来讲讲，《经济学人》是怎么看共享经济的，它给劳动力市场带来的供需关系带来了哪些正面影响？又对从业者的权益、责任边界造成了什么样的问题？


    ![](img/105e314200188b1eed4f6514f28e6cda_102_0.png)


    # 共享经济产生了哪些正面影响？


    要想清楚这点，咱们首先要对什么是共享经济，也就是 gig economy 有个正确的认识。因为国内混在打着“共享”旗号的事儿太多了，不清楚“共享经济”的本质，容易乱跑。


    《经济学人》把共享经济定义为——通过在线平台分配的短期工作（short-term jobs assigned via online platforms）。


    你看，gig 这个词在英语里就是“打零工”的意思，其实，共享经济的起源就是2009年经济危机之后，很多人因失业的钱，比如说车子、房子，还有自己的专业知识等，拿到社会上去，和别人一起用，然后收取补贴家用，这才有了共享经济。'
  merge: -1
  img_proc: true
- pgno: 103
  md: '的“灰色地带”。


    那么，又该怎么解决这种新的工作方式带来的问题呢？文章提了这么两点：首先，可以从立法的角度，给共享经济的从业者提供基本的劳动权益保障，不管是最低工资保障也好，工伤意外保险也罢，至少应该跟各国劳动法的规定；其次，就是运用市场的力量，通过平台间的互相竞争来规范共享经济，促使平台来主动改善从业者的劳动状况和福利。


    # | 总结


    《经济学人》把共享经济视为全职和兼职之外的第三种工作形态，它解决了传统劳动力市场匹配效率低，资源浪费的问题，为职业创新提供了土壤，也提高了不少从业者的收入。但它存在的问题是对从业者的权益保护不够，法律保障也没有跟上，这引起了不小的争议。


    另外，我个人觉得，《经济学人》作为自由市场的坚定支持者，对于共享经济带来的问题，它提到的两个建议似乎都很常规，也不够有力。但确实，一个新鲜事物本身就需要在发展的过程中逐渐成长壮大，就像现在的传统劳动力市场里，对于劳动者利益的保护，也是过去200年里工人阶层不断斗争的结果。


    就像文章说的，The battle over the gig economy has a long way to run——围绕着共享经济的争论，才刚刚开始，路还长着呢。这句话，也是咱们今天的金句。


    对于共享经济，你是看好还是看衰呢？


