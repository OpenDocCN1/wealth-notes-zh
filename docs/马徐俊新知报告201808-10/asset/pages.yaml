    \n![](img/105e314200188b1eed4f6514f28e6cda_60_0.png)\n\n# **| 广告投放模式的三大创新**\n\n\
    Snapchat 跟 Facebook 最本质的不同，是它有一个独一无二的创意，叫做“阅后即焚”：用户对一下发送的内容，在阅读后会自动消除；Snapchat\
    \ 平台上不允许安装任何第三方软件，因此用户也无法偷偷保存对方的照片；用户显示的信息只有自己的昵称、加密的手机号、邮政编码，还有坐标位置。\n\n这样做的好处是什么呢？就是规避了\
