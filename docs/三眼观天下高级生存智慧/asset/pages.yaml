  md: '# 认知的屏障：媒体、读书、朋友交流，大概率会把认知带歪！因为都是“散点”！


    “每个人的头顶上都有一个穹顶，而我们习惯了低头忙碌地过自己的生活，从不抬头仰望一下头顶上那片最美的天空。但其实，只要我们抬头就会看到它的变化，只要伸手，似乎就能离它更远一点！”


