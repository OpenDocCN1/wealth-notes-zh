  md: '而货币是资产交易的等价物，所以堆积起来的这些东西就用货币的数字去表示，也就是资产价格。

    在资本主义社会，富人堆积的资产，通过等价物货币交换，可以换1个劳动者一辈子，甚至几辈子的劳动收益。


    劳动是相对比较公平的，而资产带来不公，资产的囤积从本质上讲可以说是对于劳动的囤积，因为无论何种资产，最后都会建立在劳动这个地基上，由劳动最后埋单。

    1个资产可以囤积1个人几辈子的劳动价值，社会推高资产价格，而收入不变，相当于在提高资产持有者囤积劳动的量级，这是一种隐性劫掠。


    当你劳动层积累足够时，就要开始思考怎么“隐性劫掠”了。


    但在特色 SHE 会，不是你想劫就能够劫的！


    # 能玩的资产和不能玩的资产


