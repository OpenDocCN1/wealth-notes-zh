    但是干事情面还是要靠资本去推动（不入魔不成事），也就是只管理资本，不管其具体企业运行，而且资源也要逐步开放，入魔的资本一起玩，看谁玩的好就用谁。国家成为做大的庄，最大的投资人，最大的股东，企业效率低下来就都要出清（供给侧改革）。


    通过在根源上（资本控制权）控制最大盘面，在此基础上放权、放开资源、小范围放纵资本，从而使得权力与资本达到一个动态平衡，从而“稳稳健”又保护小动物。


