  md: '因为大家一起玩道没毛病，完全是帮助人心脑运转，释放人的思想力而已，对于绝大多数人来说，单纯的悟道就是种娱乐，多多益善，大家靠着道在各自领域推导方法与术，能推导出一个啥跟三眼也没关系；

