- pgno: 225
  md: '总结就是：围绕着政治分配和各种理论工具去观局，并感受各种政策以及政策落地后的具体反映的“势”。


    # 【入局】


    入局就是观局明白了，开始盘点自身。


    也就是说自身资源与目标局势所需资源的契合度。


    这里要说的一点是，在现如今这样一个商业化饱和和无死角的时代，入局这事已经不是凭一己之力可以完成的了，合伙人制度在未来会成为一个常态！


    除了很少一部分可以独立输出能量的自由职业外，比如知识与经验输出、专业性极强的个体劳动输出等，都要以合伙的方式才行。


    # 入局讲究的是切入点和切入时机。


    这在中国国学智慧里叫做“机点”，古诗写为“几点”，意思是门与框的可转动的连接处，把握转动的 erfordert， 自然能开门关门。


    切入点是什么？

    就是在政治分配链条上，从哪个环节切入；


    切入时机是什么？

    就是观察每个环节的周期。


    马云拍那个《功守道》很多人看个乐呵，关注在武术这个肤浅层面。读完三眼说的局你就会明白，观局入局就是攻，逃局就是守，而整个合起来在于一个字“道”！


    马云之道是什么？他当年是怎么攻的？现在是怎么守的？对于新的局势他是否又有新的“攻”了？做到什么时候又要开始守呢？


    # 【第二要准备的是心力！】


    要成多大事，就要有多大心力！


    心力是什么？

    是人的心可以承受住多大的压力，就可以看到包容多大的事物。'
