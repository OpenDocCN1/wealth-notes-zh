  md: '在思想上要纵向比较，也就是与自身比较，只要一个动物每天都对结构的洞察越来越丰满，这就是思想的进步，而影响面从自身扩展到家庭、亲人、朋友、社会圈层、文化圈层，乃至更高的人类社会，这就是思想之光在扩围。


