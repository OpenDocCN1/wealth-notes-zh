- pgno: 191
  md: '# 第五种生存：二皮


    二皮们都拥有两层皮，领导是上帝，顾客也是上帝，这是一门左右逢源的功夫，多见于知识分子专家学者，混得个“双向亲养”的受宠地位。


    咬文嚼字的功夫了得，抨弃情绪的功夫甚好，文字一经写出，领导们拍手叫好，底下刨食的也拍手称赞。


    核心关键词：滑！


    # 第六种生存


    正如每个娃娃小时候的理想都是当一名科学家一样，每个人生来都天然而带着对真理的渴望和对诚实的诉求，而有着超凡智慧和悟性之人，在2600多年的社团生态下，就会自动挤出第六种生存。


    这是一种游走穿梭于五种生存层面的生存，需要第六感知。


    这是一个独立，自由的感知。


    这种生存在大生态里是没有立场、没有是非观的，只有自身的原则和法则。


    只有深谙前五种生存，逐一“解构”才能“重构”至第六种生存。


    无论大社团还是小组织，无论研究钱流、权流，最后还是要归结到人流，走倒哪都是这个六种结构。'
