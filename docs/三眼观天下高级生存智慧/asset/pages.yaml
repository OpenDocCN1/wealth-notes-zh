  md: '那么资产层就是架构，求的是稳！


    人类社会的财富就两块：创造+存储。


    这也符合人本性格，社会创造的东西多了，贪婪使人存储。逢人见面炫耀的就是谁存储的东西多，我存货多就比你牛。这是一种占有欲和安全感。


    经济学不用搞那么专业高深，复杂的系统有复杂的说法，简化系统有简化的说法，实用才是最好的逻辑说法。

    闭上眼，感受一下这个世界分三层在流动：

    底下一大块，是劳动在流动，收在一个流动，大组织对这块是有“调节”的，stylesheet 特性为：你命运该巧被“调节”到好位置，那么劳动收益就大，被“调节”到差位置，再努力也只获得个个瓜倭枣，自悟！


    中间一块，是资产在流动；下面整体劳动层创造的诸多财富，多了就要堆积起来，形成各类资产，不然怎么分番号？

    这就是“有产者”的来源，2B主义和几十年前咱俩搞的SH主义理论上在此区分。

    众生无产的话，只剩下劳动价值了，堆积的东西都是大组织的，这叫G有制；

    房子是分的，吃的是分的，甚至媳妇也是组织托付的，这样一来人的积极性是很低的，这种东西关起门来自己玩可以，投向世界怀抱是玩不转的。

    从历史可以推导出来，能明白自啥叫资产的人，最早也就是六十年代的人，到今天时日也就三代人赶上了。


    今天的年轻人为何奋斗回报低，是因为“空间”很小了，因为社会发展太快，竟然几十年走完西方200年的道路，“空间”几乎都被60、70的人给提前占了，这些早先的“有产者”生了孩子继续占着绝大多数资产。


    如果把现在在资产的背后持有者都透明化一下，翻出来大家看看都是谁，应该很少很少一部分是通过“劳动改造”之后起之秀，多数还是六七十年代早日占地盘的家庭。'
