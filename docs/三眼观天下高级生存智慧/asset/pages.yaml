  md: '开始去思考怎么能更深入了解各种政策了，但三眼说的是，还是没到根本，因为政策这种东西，就像小时候玩过家家，你当头带着一堆小屁孩过家家，具体玩具怎么分？为这怎么分？你喜欢哪个小女孩让她扮演粤妈妈，你扮演爸爸来占便宜，你最好的小伙伴你给分配在哪个角色…等等等等，这些东西能公开说吗？不能！

