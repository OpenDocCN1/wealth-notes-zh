- pgno: 150
  md: '经济增长就是资本家吸血越来越多的，这就叫增长。

    如果吸血越来越少，吸不下去了，就叫经济衰退。


    当然了，这句话太真实，小动物们平时见到的信息都是经过包装的，会讲的很专业，用绕来绕去你也不明白啥意思那种词。


    所以，任何走资本主义路线的农场，国内开发是经济增长起点（吸血点），

    吸血有两条主要“管道”：

    左手吸劳动力价值；

    右手吸资源价值。

    合起来就是劳动+资源=财富。

    最后吸的就是财富。


    但是任何一个农场地盘大小都是固定的，也就是说劳动力和土地上下ante的资源都是固定的，在科技研发停滞不前的时候，经济增长（吸血量）会达到一个顶峰的。


    那怎么办？


    资本主义一天不吸血，一天就难受，一天就没有经济增长。好吧，只好扩大地盘，去外面吸别的农场，这就是殖民地的来源。


    看看老牌海盗农场英国，坚船利炮打出海把地盘扩大到全世界，搞出个日不落农场，通过别的农场海量的劳动力、资源和更大的市场，经济被吸增长。


    跨国公司就是这么来的，啥叫跨国公司？


    就是一个大财团，游走在世界各地球场，两个东西保证他们四处“流窜作案”，一是背后有一个强权枪杆子撑腰；二是手中带着海量的财富筹码。

    跨国公司在地球四处寻找市场份额，通过当地的劳动力和资源来吸血。


    那为啥跨国公司可以满地球流窜呢？


    一是它们要进去一个农场，农场主不让进，那就玩武力；

    比如鸦片战争，大老板不是要侵略，侵略这种东西都过时了，谁没事拉一堆人过去搞管理啊，那多麻烦，而是要搞殖民，通过武力把农场大门打开'
