  md: '# 耶为啥海盗们能搞出市场、搞出资本主义呢？


    因为在上文讲到，各白土地的“性格”不一样，瓷器农区必然长出“圈养模式”，而海盗们都是乘船外出抢东西，属于放养模式；

    圈养的结果一定是玩分配，大家倒食，集中起来给老大，再给下面小动物们分东西；

    放养的结果就是玩自由抢，在一个统一规则下，看谁能抢过谁。

    放养就爱依赖“无形的手”，每个小动物脑子开光，在市场上生死靠自己的抢夺能力。


    # 所以资本主义的本质是啥？


    就是抢东西。资本主义就是弱肉强食。


    # 抢东西的必然结果是啥？


    就是贫富分化越来越大，巨量的财富会逐渐集中在一小撮动物手里。


    地球上前 60 位富豪的财富，相当于整个地球底层近 40 亿人的财富总和。几百万年的人类社会，贫富差距从未如此之大，而产生这个差距只用了 200 年，也就是资本主义运行的
    200 年。都拜这个“无形的手”所赐。


    # 二、经济的增长


    但到了今天，“无形的手”越来越不好用了，资本主义走此时经济危机，逐渐走向崩溃，走到尾声了。


    那么在这 200 年里，是怎样一个过程，产生了如此大的贫富差距呢？

    又为什么玩不下去了，资本主义为何走到尾声了？


    首先我们了解一个词——经济增长。'
