  md: '不对等随处可见，金钱与地位都是表象，真正拉开人距离的是信息的对称度，也就是认知度。


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_128_0.png)


    # 关键词三【共生】


    道德经讲“长短相形，高下相倾，音声相和，前后相随。”具体到人事上就是穷富贵贱是共生体。没有穷就不会有富，没有贱就不会有尊贵可言。一般人会把穷富贵贱割裂开来看，这是最根本的错误，因为割裂开就看不到穷富贵贱的互相转化了。


