  md: '空间的变化累积，才能产生了时间的推移。

    现代人的情感结构与三十年前的<|start|>人<|start|>然不一样。财富的认知结构变化也同样道理，从爱惜银子到敢抛锚，从锭子到金子到房子到房子，空间的变化推动着时间移动，这个过程可以看到的是观念《空间结构》的不断变化。

    多数人只看到变化的结果，以“眼见为实”设定自身的“标准”，而看不见变化的过程，更看不到未来的变化，这个变化就是“时间”。


    # 何谓大势？大势有两条


    一类游戏《棋盘》制定者的人

    是空间结构《猪物人酉》变化的积累推移

    在神州，第一点很明显且永远大于第二点！

    也就是说，作为猎人首先要知道，神州“时空”的变化大部分是人为的，通过操控“空间结构”变化，不断累积时间变化，如果行駛稍稍偏离轨道，那么就会“扶正”

    大势只能讲这么多，明者自明


    猎人还要知道，空间假象是把人困在“温沟里带”，而收割要靠时间。

    在比的时点，通过人的对土地”《空间《价值》错位》，来获取价值，就是猎杀收割。比如股市，会人为的对土地、户籍、地产、地产等扭曲“空间结构”，让大部分猎物错判，通过时间从而为经济增长收割出“腾挪空间”

    几十年前城镇户籍的买买，98之后对于土地的买买，如今对于城乡结合部耕地的买买扭曲错位在前，时间收割在后！

    除了“最大庄家”，“小庄家”也同样遵循“真假象”这一规律，比如股市

    股市的道理一句话，让人们活在当下的“空间结构”之中，并信以为真，以此产生价值错判，并通过时间来收割


    # 什么是猎物？


    就是：用假象去解释假象，期望找到真相。

    这就是人心！

    研究猎物就是研究人心，即可洞悉假象的形态，即可定夺棋盘。

    当一个人的明白了他谓“棋盘”，何谓“真假象”，何谓“空间错位收割”，不去相信眼前的幻象，他就已经开始猎猎人转变！

    而研究幻象，研究集纳人，是猎人每天的必修课，这让猎人的猎杀水平越来越高级。研究人心，不只要研究猎物的人心，更要研究诸多“猎人”的人心，因为后者决定了前者的形态《真相》，我们所能观察到的人心，大多是由“原有猎人”的猎杀方法造就出来的，这个东西叫做信息论，也叫作历史


    # 时空的真相就藏在时空本身之中。


    所以，研究人心时，一定要明白，所谓真实的东西都是假象，而附着于假象之上人心的形态，才是真实

    大道至简，就如投资之神讲的“在别人贪婪的时候我恐惧，在别人恐惧的时候我贪婪”，猎物的贪婪与恐惧皆附着在假象之上，洞悉这个形态才是真实就好比想'
