- pgno: 82
  md: '道家呢？是“入世观”，道士学成都要下山，学成什么？


    就是三眼所讲的“解构观”——结构万事万物的方法！


    诸子百家的思想来源就是道家，诸家同属一脉，都起源于阴阳辩证哲学，而不同之处在于“用法”。


    就像天下武功出自少林，但会形成各种门派，因为“价值观”不一样，“套路”不一样，这与上面所讲一个意思。


    各种“门派”在服务于王权的意识下，会形成各种“解构观”和“重构观”，比如：


    法家的奖励辩证，而产生了王霸之学；

    纵横家的捭阖辩证，产生了外交学；

    兵家的奇正相生辩证，产生了攻城略地的实战之法。


    但这些东西都是“上层”知识，这些东西才是真知。


    用三眼一句话说：我们都依附于大组织规则而活！

    另一句话就是：认知，就是浸近真相的距离。


    问：

    那在您看来，什么是有效的知识，或者像您说的是可以独立的知识？


    三眼答：


    +   一个字：道；

    两个字：历史；

    三个字：法儒西（法家儒家和西学）；


    三眼说过，人们的记忆跟鱼差不多，这祥就会“以眼目前见到作为真相”。


    这里我没法细说，我只能说，历史从未离开我们，很近很近。'
