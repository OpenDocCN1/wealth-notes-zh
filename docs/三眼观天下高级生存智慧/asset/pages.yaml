  md: '跑得慢天被 avo 取的都耿在底层，根据“哭嚎等级”来分成一个个势的圈层，大吸血鬼在最顶层吸着全社会，而精英与中产就是中间传递环节，帮着大吸血鬼吸，自己也受益，根据受益的不同来分成一个个中产精英圈层。


