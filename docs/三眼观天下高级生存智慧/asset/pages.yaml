  md: '和体悟了人性的本质。胆后面一定跟着暗字，暗就是格格，就是纹理。


    # 3、稳定性！


    上帝的品神培育人千不了，但人性就是要扮演上帝，追求永恒的稳定性。具体到社会生活层和运行上，身体的培育——饮食、医疗、生存环境等区隔；思想的培育——教育、认知灌输、自我觉悟力与思辩力培育等区隔（最高等级教育培养思辩力，最低等级教育培养专业技术）；在肉身与思想外，稳定性通过资本、地域、民族、以及社会运行的关键资源的掌控等层面区隔。社会越发达，一定朝着这种区隔发展。资本差距、生活方式断层、认知断层、这是必然。


