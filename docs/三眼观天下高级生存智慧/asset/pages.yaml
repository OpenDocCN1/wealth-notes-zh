  md: '# 生存法则（一）有了假象，才会有猎杀！


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_1_0.png)


    思想观,学习观等系列,是在聊“生活”;生存法则系列与谋略系列,开始聊“生

    讲生活是为了情道,讲生死是开始给体用

    任何不涉及利益的思想推演,那结果一定是幼稚的,任何知识都是“刀”,如果不去用,它们毫无价值,人的每一次所得,都是他人的失去。

    在生活上要修炼佛性,锻造利器,藏橹而动

    在生存上要修炼魔性,与龙蛇为伍,与猛兽潜行。

    什么是佛道与魔道？


    参禅悟道,可以看见人性的痛苦之处(因共有巨大漏洞)。

    而发现漏洞之后对其展开攻击,有所得有所成,这是魔道。


    这就好比,一本道德经,全篇所述归结为一句话:事物存在的漏洞。对漏洞在不同层面展开攻击,形成了诸子百家,他们均秉承老子。

    鲁先生成“翻开历史只有吃人二字”。不错!真实的历史是由魔道填充的,所谓G字撕掉衣服,只有猎杀。

    此系列开始入魔,帮助有缘人重构世界,带着佛教智慧进入兽性本能,建立一套猎杀方法

    此系列赤裸裸灭三观,脱胎换骨,谨慎为之,去留随意!


    这第一篇讲的是“假象”,这是“入魔”的最基本。

    许多人谦虚求进,勤学好问,但一直懵然至极:有心志也有心智,但不知道怎么施展。

    悟了养牛之术再怎么学,牛在哪?

    很简单的道理:没有棋盘,怎么会有下棋一说呢?

    人活着要入世生存,首先要知道“棋盘”在哪,是何模样,这样才能开始下去棋,'
