  md: '# 人类社会发展，人性在里面扮演着以及能够做的是什么？


    这个问题是这位同学读了《养殖》之后发问。

    社会大到最大组织，小到一个社群，都是一个养殖模式，分两层世界，下层的是养殖层，上层的分配层，在养殖层里的人想要到上层“参与分配”，这叫逆袭；上面分配层里的人想获得更大的利益分配，那叫搬阶。无论大小社群，都是一个利益分配体，最基层干活的一定拿的最少，搞分配规则的一定拿最多。这是一个很客观的不稀奇很正常的存在，如果你觉得是颠覆观念，那就过于分
