- pgno: 221
  md: '# 80%创业为何失败？因都是赌和被逼无奈！要创业先学观局！！


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_221_0.png)


    问：为何 80% 的创业均失败？


    三眼：因为对于绝大多数人来说，所謂创业，只是贪婪欲望刺激下的赌博，或是被逼无奈找出路。赌博大概率是输，被逼上路亦走不远！


    问：但主流意识认为没有失败哪有成功，人就要多折腾，虽然输但折腾多了是不是就可以赢？


    三眼：什么叫折腾？折腾是你看好一个领域，把握好一条线，反复的试错，成功的本质是“不去走错误的道路”，本身是个概率问题。如果一个人要折腾，起码要明白什么叫工作、事业和创富。


    问：那什么什么叫工作、创富和事业？'
  merge: -1
  img_proc: true
- pgno: 222
  md: '这三者完全不一样！

    工作是为了维持基本生存持续付出，付出包括体能、精力、经验、人情这四大块；

    创富是为了赚取更多的钱，造富不是为了生存而付出，而是想通过一定的套路，在社会财富分配链条上，尽可能的获取更多；

    工作与造富的本质思想完全不一样，一个是守，一个是攻！

    而事业是不计算回报，为了满足个人人生的目标信仰，满足自我的成就感和获取存在感。


    工作的本质是依赖于一个规则，凭体力精力和不费心力！

    创富的本质是认知，费的是智力，认知到了，财富自然来，提升认知是一个很良好的过程！

    所以工作有得好的人，与创业玩得好的人，说不到一起去，一个玩身体一个玩脑子！

    事业的本质是使命感。


    # 一般人的迷茫和困惑，都是因为把这三样混合在一起！


    人的痛苦与迷惑都是自己造成的！

    多数人为和平衡？因为胃口太大，什么都想要，不知舍得，什么都想要一定什么都得不到！

    因为都想得到等于“根本不知道想得到什么”！

    这源于认知，因为庸人的认知和动物差不多，只有所求，而不知把所求分类。


    问：那创业属于哪个？


    三眼：创业属于事业，创造事业。

    创业也分真创业和假创业。

    真创业，是把一件事情当成使命来做，钱只是顺带的产物。

    “业”是什么，是佛家用语，是指事物演进背后的推动力。

    真创业，就是能看到在这个社会上，某一条真实存在正在演进中的推动力，或者说叫确定性趋势，而自身将顺应这种推动力，把达到一个目标作为使命，而不断运作。至于财富，只是一个顺带的产物，因为掌握住了推动力，必然会吸引资本财富聚集。'
  merge: -1
  img_proc: true
- pgno: 223
  md: '为何很多上市公司一直亏损，还能圈那么多钱，就是这个道理，因为它掌握了某种推动力，把握住了某种确定性趋势。


    而假创业：


    一种是因为欲望贪婪而赌博，说白了就是投机，想快速致富而已。投机是世界上最难的东西，因为投机与投资都是个概率学问题，投入的是风险，得到的是回报。投资是尽量降低风险，这就要“不去走错误-的道路”；而投机，是直接在千万条路当中，直接选出那条正确的路，这种概率微乎其微。韭菜都是投机分子，假创业的结果多沦为韭菜！


    第二种假创业就是被逼无奈找出路，这没什么好说的，人只有好逸恶劳，没有找不到出路一说！


    把中国企和民营 circled? 民营成就非莱，因为它在反复赌博和被逼无奈之下打拼！


    缩小至个体，你还认为韭菜少吗？满地都是！


    问：建议人创业吗？


    三眼：不建议，能准备好的人少之又少。99%都是假创业，1%是真创业就不错了。


    投机分子不会用脑子思考，只会用欲望和屁股思考，只看到创业成功者的暴富，以此来认定成功者的“投机”，看不见在这<|start|> “投机”的背后，是无数对错误路线反复试错的投资，以及持续不断的付出，体力、精力、经验、人情这四块的付出只是个基础，更大的付出是心力的付出！


    体力与精力可以借助他人，这是管理学问题；经验可以累积，这是认知学问题，人情可以运作，这是社会学问题，而最核心的心力，只能靠自身，这是一殷人所不具备的。


    问：那您说的准备好，是指准备好什么？


    三眼：要准备的很多，而且很多东西是准备不了的，不是人人皆可，整体说来要准备两大块！'
