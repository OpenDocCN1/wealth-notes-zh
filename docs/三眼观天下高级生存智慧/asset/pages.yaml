  md: '小霸王游戏机，再高就是VR体感游戏，游戏的形式变了，但是游戏的本质永远不变，高手玩家无论身处何种形式依然是高手，因为其洞悟本源规则。社会游戏必定以人为本，而在洞察人、制定人类游戏（社会）的规则上，最顶级的就是儒释道。


