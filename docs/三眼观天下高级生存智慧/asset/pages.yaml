- pgno: 226
  md: '这就像肉体在举重，心力就能举起多重的东西，要有耐力一直举着，而且要稳！


    人在肉体举重上会产生生理的疼痛，一般人受不了；

    而心力的举重，要比生理更痛，一般人更受不了。

    吃点苦、受点累就受不了的，干好工作都是个问题，更别说创业了。


    为什么很多成功者都有着充满苦难甚至悲惨的早年？因为只有这些才能锻造一个人的心力！


    # 心力不是天生的，也需要训练的，和生理健身锻炼肌肉道理一样！


    为何很多富二代都是“败家子”？

    还是因为心力！


    # 人能否经得住多少财，镇得住多大权，是要靠心力来掌控的。


    多数人连自身都掌控不了，如何掌控他人与事物呢？


    再举一个每个人都可以明白的事例，就是同伴之间谁强谁弱的问题！

    为什么人 and 人在一起，一个要惧怕另外一个？

    这是因为心力在角力。


    # 角力是社会常态，决斗是莽汉行为。


    韩信是个强人为何还要钻过流氓的裤裆？

    因为人要别人尊重你、怕你，不是把对方直接置于死地，那是低等动物、莽汉行径，而是要通过心智和心力，通过不断角力把对方压制住，这才是致胜之道！


    国与国之间也是如此，心力的角力就是政治掰手腕，这也是外交至关重要的原理。

    如果都拧开底线直接分生死，会有古时三国的群雄争霸之戏吗？


    所以一个人，在干事之前，在思考是否创业之前，分析下自己心力大小，而不靠头脑发热和欲望激情去赌博。'
