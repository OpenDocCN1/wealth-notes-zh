- pgno: 141
  md: '# 养殖模式（一、二）内法家外西学的解释；和制度之上——土地的性格。


    上文书《世界就是一个个农场，农场就是农场主养殖小动物！》


    书接上文，开始说第三点，养殖模式。


    # #养殖模式（一）内法家外西学的解释


    搞养殖就是做生态，怎么能更符合“生态”搞养殖，这个就是制度。


    养殖模式一篇说不完，需要非常多篇，我们作为小动物，建立的主要结构就是在这个范围里。


    诸位可以把农场主当做“0”，把小动物当做“1”，0与1结合起来形成诸多结构。


    也可以把0与1不当成各自群体，而是抽象到人性层面，0代表贪婪与攻击，也就是矛；1代表防守，也就是盾，再抽象点就是阴和阳。


    > ——这就是东方抽象哲学的逻辑，可以将万事万物都抽象到阴阳。


    例如中国古代很多治世能臣都是“老中医”，给国家看病的，医治目的就是达到“阴阳平衡”。


    而西方思想就比较“实际化”，什么阴阳的根本没这个思维，讲农场主就直接把农场主群体给“解剖”了，这种现实的“解剖”思想搞出很多实用的东西，比如经济学，比如各种科技。'
  merge: -1
  img_proc: true
- pgno: 142
  md: '尤其是这个科技，是东方哲学里万万没想到到的，在科学技术出现以前，东方绝对是占上风的，因为东方玩脑子太厉害，无论什么事情都有一个套阴观去玩，从种地创食（一民）到给脑子套上紧箍咒（儒术），从行军打仗群集体斗殴（兵家）到人与人之间玩关系的个体斗殴（纵横），都达到了智慧至极的状态。


    发辫民族几万人入主中原，而后又开疆扩土把地盘掏到 1000 多平方 km，这么少的人统治了这么大的地盘，小蚂蚁玩大象，这是封建制度的最高峰了，至极中的至极。


    管小动物通过阴阳之法管得死死的，所謂 F 建义主义思想是人类管制思想最高峰了。


    所以很多小白不明白研究一个少数民族的清史有什么用啊？

    研究历史不是研究一个个小故事，你那是看泡沫爱情剧看多了，智商就停留在那里；

    研究历史就是研究人类思想的“结构”演化，无论发展几万年几亿年，只要有人存在，农场无论以何种形式存在，人性里都有 0 与 1。无论是看五千年历史还是看未来，这个
    0 与 1 之间形成的诸如“结构”会一直有用，这是真知识。


    而科技出现是使得这种结构演化越来越快，因为：


    # 科技是更加满足人性的膨胀，并且是逆自然的。


    科技就像是游戏外挂，在原来的游戏规则下东方阴与阳的玩法是最厉害的，当有了科技这一外挂，改变了游戏形态。


    游戏外挂都是“贿赂的”，因为都是满足人性的罪恶研发出来的，是不守规则的逆自然。


    这也决定了科技首先是在军事上应用，打破了军事斗争最初的形态，而后再逐步过渡到“农场生活”，打破了生产生活的模式、小动物们交流的模式；生产能力大爆发，信息交流的效率爆发，整个地球变成地球村。


    各个农场原来都是封闭的小世界，这回连成片了，军事与经济贸易成为农场主最重要的东西，而这两东西在本质上都依赖于科技开挂水平。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '除了科技开挂水平不同，农场另一个最大不同，就是原来玩的 0 与 1 不一样，也就是制度延续。


    这样就能明白啥叫“内法家外西学”了。


    内法家就是 0 与 1 玩法的延续，在科技没出现的时候，这是地球最牛的农场玩法；


    外西学就是科技这种“游戏外挂”出现了，打破了固有的游戏规则；所谓西学薇就是以科技外挂为核心的军事、经济规则。


    内法家——就是保持原有领先的东西；

    外西学——就是不得不过跟着人家规则玩的东西。


    # #养殖模式（二）制度之上——土地的“性格”


    很多人都喜欢拿各个农场的生态（制度）做对比，这种对比有一半的借鉴意义，也有一般是没有意义的。


    有意义那一半叫战略经济和科技，没意义那一半叫制度。


    政治决定经济，什么决定政治呢？


