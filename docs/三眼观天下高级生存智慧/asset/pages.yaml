  md: '# 什么是思想力？


    三观=思想系统；

    思想力=系统运行。


    系统拼的是完整度、维度；

    运行拼的是快慢。


    这就好比提升电脑的性能，假设硬件 CPU（天性）不变，那就需要一是优化系统，二是更加内存提升运行效率。


    比之前面引述鬼谷子讲的“为小无内为大无外”本来是鬼老头用于捣糨糊给人洗脑的，讲述的是人起心动念的形态过程，后面还有话：为小无内，为大无外，盈损、去就、倚反、皆以阴阳御其事。


    整段话虽少，但是一个由道至术的完整过程，这就很了不起！


    此话也可用到读书学习上，也可用到做人做事上，也可用到分析问题上。如果再会玩，可以引导人们往“小”走或往“大”走，这就是意识形态攻击了，比如媒体做内容引导舆论。


    这个单独反三的过程，就是“系统运行”，也就是思想力。


    用“系统运行”角度去看读书，书籍就是一个个“场景”，读书就是不断地切换场景，在切换中伴随着系统运行。


    切换这事要追求舒服，也就是最好按照兴趣来，不舒服就不爱切换、就会觉得很累没激情，那就没有意思了，最怕的就是“啃读”。


    运行久了，熟悉熟路，以前一个月读完的书，可能一下午就读完了。


    而且，切换环境非要靠读书吗？电影、对话、社交活动…都是“书”（场景）。


    所以大多现代人嘴里的“读书”为何讨厌？


    因为养得好像是读书=学习，不爱读书=不爱学习。本质上是因为人们太懒惰，'
