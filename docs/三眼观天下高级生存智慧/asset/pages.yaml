  md: '任何城市化与工业化的进程，都是大城市对小城市，省级对地方，最后全国对农村的1ue夺。


    在这个流动的过程中，会产生三种赚钱套路，从下层到上层大体有三种路数。


    # A. 底层收智商税。


    底层是最接近市场化的层面，每天信息变化不停的所有屑创业、营销都是围绕着最底层市场，因为中高层根本不屑一顾这些繁琐的话。


    收智商税核心逻辑：信息不对称！


    核心方法只有一个：洗脑！


    达成结果：被洗脑者甘愿自欺欺人！


    短缺经济时期，满世界都是交易。消费者认为的好是商品真的好！


    过剩经济时期，满世界都是套路，因为真实的商品需求所产生的交易已经赚不到什么高额利润了。消费者认为的好都是被他人洗脑的结果。


    过去营销玩的是4P，以产品为核心，现在玩的是4C，以刺激需求为核心，也就是让你想要啥然后给你啥。


    收智商税就是高认知者对低认知者在人性弱点上的营销行为。

    所要达到的效果就是：让你自认为很高级，从而自欺欺人。

    过去底层赚钱靠的是商品，占有了你的本体，现在是靠攻击你的大脑，占有了灵魂。


    随便举几个收智商税的套路：


    +   ——贩卖自律


    人人在对未来迷失和对当下的境遇感受到痛苦时，任何人都是不自律的。


    人是一种被欲望拉动和恐惧推动的机器，当只有恐惧而没有欲望的拉动，任何人都会自律起来。


    自律是个被动的行为，并不是主动的，当人对事物有着浓厚的兴趣和明确的目标，即可被动充满足自律行为。


    贩卖自律的对象往往都是漂泊奋斗的年轻人，通过“自律就能得到xx结果”来洗脑广大劳苦青年，这个时代注定是大多数人迷失的时'
