    总结就是 LPR 这玩意在“利益体规”分析上看，没啥太大实质意义，也不用去专门学习金融业知识。


    最后再多说一点，就是没有结构也比结构混乱要强，因为一旦散点太多，就很容易自以为是，从而自我设限。

    倒不如从 0 开始，从最基本认知结构开始建设。


    结构这个东西不是放在那里让你直接用的，要是那样三教九流各行各业，从卖包子的到卖人口的，难道都要把规则写出来吗？

    再说三眼知识面也是有限的啊，现在在后台，两口子干架都要跟我咨询情绪，这种规则套路我就不会了。

    有些领域咱切磋一下可以，有的领域切碰不了。

    “结构”属于思维层面的，要学会举一反三和演绎啊！'
