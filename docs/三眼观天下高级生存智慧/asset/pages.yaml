  md: '绝大多数人都是低能者，都搞人格崇拜，现在也一样，这是写在人的天性里的游戏就是打击满足，如何打击满足面讲。

    比如下雨时大河森林，对着一根树<|message|>头，看到老鹰嗉头，看到虎狼做饭，这是 一种思想上很低能的“自我治疗”方法。

    这不行，太低端，得改进！

    当人类发现自然界没有可复制的对象后，就开始以人类有限的思维能力，捏造出一个人格化的神。

    前面说了，人类的思想是不断“判断+复制”的，围绕物质与精神两个层面：

    1、活着为什么

    2、世界是什么。

