- pgno: 175
  md: 'n 个环节，小动物们协作分工，同样的劳动付出可以造出 n 多个椅子，生产能力几何倍数增长，这就是社会存在的意义。这一点在经济学上讲叫做“生产力与生产关系”。


    社会存在的本质就是分工协作；对社会的 yönetim 就是对分工的管理。


    # （3）小动物收割。


    小动物每天露宿加上分工协作，有吃有喝自然体壮毛盛，这时候就要接受一轮收割。在这一点上的牧养之法与牧养牛马羊是一样的，养肥了再剪毛，春暖花开草木繁盛又会长出新一轮毛。


    经济有宏观和微观，经济的本质就是循环；宏观上的循环就是对小动物的周期收割；微观上的循环就是农场各种动物分工协作间的利益往来。


    所以宏观上研究的都是大势；也就是农场之间的往来，也就是地盘怎么分、对小动物们怎么互相都利用利用、都收割收割。


    微观上研究的都是企业、行业、小动物们间的具体分工协作、生产协作、和利益交换，所以微观上都是一些行业政策、法律条文等 geblieben的东西。


    在宏观经济循环上怎么 disruptions 周期收割呢？


    围绕小动物们的求生与发展本能，也就是吃饱、看病、住所、脑子开光机构，这些东西在经济学上叫刚性需求。


    牧养牛马羊时收割靠鞭子；牧养小动物就很柔和，靠税和货币（货币也是一种税）。这也是为何研究货币就可以研究明白宏观经济本质的逻辑所在。


    # 3、金融。


    动物贪婪的本性使得农场主对土地和小动物劳动这两种“空间地盘”不满，怎么打破空间的障碍，从而穿越时间获得更大的地盘，是每一位农场主终极脑汁研究的事。'
  merge: -1
  img_proc: true
- pgno: 176
  md: '在大海那边的海盗农场研究出心得了，那就是金融。


    金融为何比以往的农场周期收割更加厉害？


    因为以往收割的都是当下，一亩地种出 100 斤谷子，收割去 90 斤；

    金融是收割未来，一亩地将来能种出多少谷子，要看时间线拉多长，按照理论可以种出无限量谷子，贪婪本性这一下炸开了，得以空前释放。


    金融有两个确定性：


    （1）虽然理论上讲可以对未来无限收割，但拿未来的财富来标的现在，这本身就是一个幻象——因为物质财富不可能穿越时空存在。


    所以金融必然会产生泡沫，这只是一种障眼法，一种对当下资源配置的潘多拉魔术而已。这是一种对预期（打磨时间）的交易，这种交易存在的载体就是货币，而且只能是货币，因为货币简单来说就是一串数字而已，数字当然可以穿越时间了。


    但为什么明知物质财富不可能穿越时间，还要搞金融呢，就是因为可以通过穿越时间来玩货币，而货币是撬动小物周期收割的最有效工具（对马牛羊用鞭子收割，对小动物用货币和税收割）。


    所以，金融存在的目的只有一个：就是穿越时间搞周期收割。


    （2）根据农场养殖模式的存在逻辑，金融所产生的每一滴泡沫，最后都要由小动物埋单。小动物傻傻的崇拜金融，根本不知道金融是收割镰刀的增强器。


