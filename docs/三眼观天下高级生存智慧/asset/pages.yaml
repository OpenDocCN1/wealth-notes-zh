  md: '但是科技发展到目前，除了手机和汽车，也没见有什么其他创新了，看股票市场的科技股，基本都围着苹果手机和特斯拉汽车转悠。目前有很多科技概念，但都还没有转化成生产力，也就是不能大面积使用铺开，进入民生很难。


