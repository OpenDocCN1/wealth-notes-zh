- pgno: 207
  md: '所以底层逆袭一定要跟最大的庄，玩最大的盘面。

    多大盘面算大？

    一个主旨，能带动就业的。

    只有在这种盘面里才能够有“有无资产泡沫”的称谓。因为这种盘面决定不取决于个人操盘和财团操盘，而是政策性操盘。这就可以通过多点多角度整体去分析考量，从而建立信息对称，进盘透散散户也是可以做到的。


    多数财经观点看此盘面都是从下向上看，从表象往里猜，这就很慢也很模糊。


    比如蓄水池理论，简单说就是货币超发没地方去，不能流向消费领域，那么自然流入一个大蓄水池，所以资产价格暴涨。

    对不对？也对！但是等于没说。因为这就好比在说，供需决定价格，又好像是在说人满一辈子背要死，这是最普通的大道理，对实际生活毫无用处。


    看经济要看政治，看政治要看政策，看政策要看背后的分配，最大的盘面就是看分配，所以经济问题归结到最后就是分配问题。只有通过此处才能看清盘面的变化。


    首先，货币超发是世界性的，当代经济运行模式必然伴随超发，永无止境，只是发的快还是慢，这取决于工业体量与水平。

    第二，分配这事不可能平均的，发大水时候从上向下流，通过各个领域，具体看政策和信贷，雁过拔毛，稀释拉到最底层时，涉及到两个东西，物价和工资水平。只有底层的人才决定物价，物价是由存款和工资水平决定，一个是积蓄的钱一个是不断收入的钱。


    这里有个逻辑：物品价格，也就是消费品，是由底层决定，指标看的是地极，刚需物品买得起是一定要保证的。


    而资产价格，也就是投资品，是由上层决定的，核心地段的地产达到50万一平方米也不稀奇，因为和什么超发货币没有本质关系。

    所以房价这事一定要分两面看，一种是全民财产性收入的承载物，一种是精英小圈子玩的。

    物价是要看底层的，底层存款都拿出来消费，物价自然暴涨，而上层资产虽然是天量数字，其实对于普通消费是没有影响的。所以所谓蓄水池理论只是针对底层存款才有作用。'
  merge: -1
