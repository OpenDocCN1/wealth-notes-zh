    诈骗这事不是小毛贼专属，大佬们也干，逼急了所有地球动物道德底线都一样，谁也再骗不起谁。


    比如各种理财陷阱门，大众屁股门，各种金融公司造假门…


    尤其是金融圈，当经济发展长不起来，吸血无门，都会玩劳氏循环大法，所以诸位小动物当下可要当心各种理财产品呀！


    # 六、科技的等待


    要解决经济增长，使得经济循环起来再度玩吸血，那就需要通过科技创新才行。


    科技创新是维持资本主义发展的关键！

