    > 如果说问题的话，疑问很多的问题就是人类作为一个类，应该是有共性很强的人性欲望的，比如趋利避害。那么社会又用一些软的控制比如道德，文化，宣传的方式去控制各类人群的人性，比如现代道德上要求男生理终止纳妾。也将会利用硬的控制去控制各类人群比如违法会被警察抓。那么我想知道既然牧羊人用牧羊的方式去控制羊群，那么为什么不干脆用人igo选育的方式一代一代选出最符合牧羊人希望的羊的品种呢？比如羊有时候会闯事，会顶撞牧羊人，这都是很麻烦的事时，为啥不直接用品种选育的方式去一代代稀释掉羊性中对牧羊人不利的部分呢


    滴三加影视


