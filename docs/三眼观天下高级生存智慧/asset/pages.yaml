  img_proc: true
- pgno: 3
  md: '物，人性必须要选择一个方向行驶，这就产生了所谓价值


    2、人性都是我执的，会锁定在一个狭小的“边界”之中，大多数人都是“眼见为实”，就像低级动物一样，只相信眼中的固有幻象，固守价值标准，而不会赋予变通去思考真相。


    以上两点合起来就是：多数人都朝着一个错误的方向奔跑，却深以为是极其正确的的（对的价值），这就是人们的假象


    清楚假象的根源后，再进一步，假象是如何在人们脑子里产生的？或者讲如何观察假象四个字：时空错位！


    时空不同，人们脑子里认识的结果不同。我们先讲述正确的时空观，之后即可明白假象是如何产生的。


    空间，也可以理解为利益结构，这样便于理解，利益结构从何而来？


    其是由一个个人构成的，每个人对利益的理解不同，所需不同，集合在一起形成了利益结构


    为何每个人会不同？


    回到人性漏洞第一点，人的思想是必须要有一个方向选择，以此来判定对错，这样人性才能“不停行驶”，而每个人判定的方式都不一样，所以“价值表现”不一相，比如的情况不同，有的是钱大本因。人类对价值的判定，最后都要归于道，因为价值到底根源在于“对与错的标准使然”，道德标准建立往往来自家庭，而后是教育，而人大多是我执的，很少有人会“自我教育”（有慧根会反思），将自己锁定在狭小的边界内，所以家庭教育大概率影响人的一生，这也是观察潜物首先要观察其家庭的本因。


    每一个社会阶层，都深刻着“道德标准”的烙印，都暗含着其对价值的判断与理解，这就是群体性。


    所以之前文章为何反复讲“无我”，讲“穿越道德束缚”，讲“道德是最高谎路”，因为不过就谈不自由穿越阶层，看清除各种“空间结构那么假象在空间上如何生产


    是人们都锁在边界，都紧索在各自“标准”里：是拿着固有标准去判定万事万物，就像“拿着尺子测量空气长度”，这样一定会错


    比如，你跟他讲钱，他跟你讲感情；你跟他讲国家战略，他会先入为主一个“我我们国家”，并生出一个“敌对国家”，把他人的道德情绪加入其中，这时候就不能再讲真相了，讲不清楚他是故意吗？不是！这些都来自于其其实际的“固有标准”


    一个女人说你不爱她，有的原因是没有一天发 10 次信息给她，有的没有给她买些“标准”可能来自于其影视剧偶像的一句话，也可能是其家庭的一句话，多'
