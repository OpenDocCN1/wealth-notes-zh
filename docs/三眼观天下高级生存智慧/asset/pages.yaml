  md: '# 生存法则（二）万谋之基 人心的形态！


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_7_0.png)


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_7_1.png)


    # 说在前面


    这一篇“冰冷赤裸”！通过“禽兽→人”的转化过程，将人心剖析彻底，把“人心的形态”剖析至尽。


    通过“一生二，二生三”的基础逻辑，用简单的三维图形将人心终极化演绎；会从根子上打破原有的价值观念，比如人分“兽类”与“人类”；动物本能下的人心原始形态；如何为“人心之水”设定“管道”和“刻度”


    道德、教育、文化、文字等皆为思想之锁；权利的本质，恐惧与威胁将诸多百家的“萌芽”剖开，直指其虚假象表背后的真实操控逻辑；道德之中的每一句话，背后都是冰冷的操控人心的智慧。等等…


    从人到社会到文化，皆冰冷剖析，找寻其背后的真实形态，而后再去认识道德、是非、制度、信仰、文化、观念等。


    再去明白谎路为何？何谓谋？何谓“略”？何谓顺应人心？何谓操控人心？何谓做人？'
