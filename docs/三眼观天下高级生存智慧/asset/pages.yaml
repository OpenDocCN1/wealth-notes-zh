    有两句话特别棒，合在一起就是超高级学习方法，比读书要强得多；


    +   1、与君一席话，胜读十年书；

    2、系词：是故君子居则观其象而玩其辞，动则观其变而玩其占。


    第一条意思是“顿悟”，也就是快速提升思想力是靠顿悟，而不是靠累积。


    人们所看到的事物都是一样的，正如同盲人摸象，大象没变过，变的是人们的摸法，也就是观察事物的方法。


    大象并不复杂，复杂的是人。抽象的人越多，产出复杂感越多，大象就越不容易见到真身。


    老子讲“天下难事必作于易”，复杂的事物表面背后仅仅只是一层窗户纸，捕破了头就看清，所以最好的学习方式就是找“捕窗户纸”的东西。


    而事实上大多数人学习都是“不断糊窗户纸”，比如学管理、学投资先认为其很复杂，之后搜索一堆“成品”书目，开始“啃”，这个字是最讨厌的。


    低级教育方法是灌输，高级教育是引导启悟。


    第二条意思是“玩”。


    一是让心态问题，切换信息要轻松，要玩，千万不能啃。用心的叫玩，用脑子的叫啃。'
