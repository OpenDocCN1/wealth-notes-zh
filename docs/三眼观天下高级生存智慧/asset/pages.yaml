  md: '+   增长的极限

    新的地盘——金融

    诈骗的必然性

    科技的等待

    200年与佛系


    # 一、起源


    衔接上文，上文讲到每个动物农场的养殖方法，取决与土地的“性格”，瓷器农场玩的是“同一化”，海盗农场玩的是“多元化”。


    同一化这个东西以前全世界都玩，只是谁玩的更厉害而已。也就是说说法家模式在哪片土地、哪个农场都会出现。或者通过政府搞同一化，或者通过宗教搞同一化，反正都是给小动物脑子带上紧箍咒，肉身上打
    LOGO，比如贵族和奴隶，打上 LOGO 带上紧箍就能 bes 统一实力气创会。


    但这种东西会把小动物变傻，脑子不放光，只会埋头创食，生产力停滞不前，海盗们谈打破提出个新花样、新思想——如果释放小动物的趋利本能，为了自己的利益卖命就会刺激脑子放光芒。


    这就是资本主义的思想起源了。


    在 200 年前以一个叫英国的海盗农场为发源地，那里有个叫亚当斯密的小动物写了一本《国富论》，奠定了资本主义玩法的基础。


    这本书主要核心就一个词：无形的手。


    啥叫无形的手？用专业词汇解释起来多半是难以看懂的，用小动物大白话讲，就是释放魔性（小动物的趋利本能），把小动物们都扔进市场里，生死靠自己，小动物为了满足欲望，为了自身的利益
    Typically 自热刺激出光芒。


    比如为了让自己想 NB 点，自然一群小动物来着三眼看东西，这要前往数 40 年，小动物们不光不会欣赏三眼，反而会挑斗来，挑斗让大家脑子放光，这是邪路，参见鸭绿江对岸。'
