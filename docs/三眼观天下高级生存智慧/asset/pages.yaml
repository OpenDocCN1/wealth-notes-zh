  md: '一些自认为饱读诗书“聪明”的同学，总是用“领域话术”去研判趋势，就比如国外的历史经验了、如今的经济数据了，三眼说了这些东西没用的事实，或者说在战术上有点用，战略上不搭嘎，战略上一定要“识时务”看大组织性格！


