  md: '# 世界就是一个个农场，农场就是农场主养殖小动物（三）


    时间很晚了，但三眼明天要去踏青吸收太阳的能量，索性把小动物利益角度这一块也写完了吧，因为嘎嘎待哺的小动物们估计最想看这个，剩下农场养殖模式回头再写，因为比较繁琐，恐怕一篇<|start|>文章撑不平其结构。


    好了，我们来谈农场结构第二点：小动物有什么（主体二的利益角度）。


    # 1、繁殖能力。


    在我们这个大农场里，平均每 2 秒就出生一个小动物，每分钟出生 38 个，每天大约出生 5 万个，而每天平均死亡小动物 2 万个。


    也就是说，正在看此篇文章的你，每天早到晚上，两眼一闭一睁，5 万个和你一样的小动物诞生了，2 万个和你一样的小动物挂掉了，如果算上世界各地的农场，这个数量更大。


