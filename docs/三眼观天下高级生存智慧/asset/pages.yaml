- pgno: 208
  md: '第三，全民炒房的背后动机是什么？一是够存款，不遮掩，比如“六个钱包”理论。二是拗未来，也就是加杠杆。还是最根本原则，看钱的流动。最终流到哪？地方政府。干嘛？搞建设。任何城市化与工业化的进程，都是大城市对小城市，全国对农村的剥夺，而在增量时代，靠输出低廉劳动力创富，夺的是劳动收益，而在存量时代，夺的一定是土地收益。


    劳动收益时期，要钉死户籍，而户籍打开之时，就是土地收益时期了。


    这样从上到下看，通过分配就看清了整个线条，看清枯燥的数字的背后动机。


    物价、工资水平、信贷收缩与扩张、资产价格圈子分类、存款率、杠杆率、户籍制度。


    现在已经到了轮换盘面阶段了，也就是所谓倒逼改革阶段。


    现阶段最大盘面一定冰火两重天。


    一种是精英决定的资产价格，也就是一线城市核心地段优质资产，会无限上涨，因为这跟大盘面毫无关系。5000万一套的豪宅涉及不到信贷，买家也不用加杠杆。


    另一种是由存款和杠杆推动的资产价格，也就是部分二线和三四五线资产，冰封失去流动性，但资产价格还标记在那里，实际上不动产真要不能动了，价值趋近于0。但分配这事到最后玩的并不是钱，而是心理，安居乐业就是最大的资产，这是一种心理资产。


    轰轰烈烈的户籍改革与科创板，背后代表着土地和工业质量，下一个轮动的盘面可能就在其中。'
