- pgno: 199
  md: '# 混乱的信仰与规则


    人们都有一个思维误区，就是用其他不相关规则来指导自己所依存的规则。这源自信仰的崩塌——“确定性状态”的不确定感。


    例如拿民主自由的规则来套养社会 ZY 规则，拿企业的规则来套养民企的规则，拿男人的规则套用女人的规则。


    而今的社会人都是活在混乱的信仰与规则之中，不是规则混乱，而是人们认知的混乱。人的修练之路是一个“内外都结构”平衡的过程，修身先修心，社会的运行是人的意志为起点，人脑子里首先是由驱利本能所产生的是非观的运行，而后是各种行为规则的运行，最后才是财富与生产生活的运行。


    对“信仰商品”制造的“流程”的钻研，从人类驱利本性的本源起思考演算，方可洞悟一个信仰规则的玩法——这就是人类社会本原玩法。'
