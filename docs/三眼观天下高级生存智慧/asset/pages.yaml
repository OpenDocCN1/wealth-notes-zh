  md: '# 世界是个养殖场，上层养殖下层，提升认知与格局

    唯有学好养殖技术


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_164_0.png)


    # 【世界是个养殖场】


    纵观人类史，就是个养殖的过程；

    从驯养第一匹马、饲养第一头猪开始，当动物都被养殖起来后，人类自然开始内部养殖。整个近代竞争史就是一部抢钱抢粮抢资源的历

    史，当然人也属于资源。

    所有的知识、文化、科技统属于衍生物。唯有哲学才脱离了养殖，因

    为哲学的目的是要摆脱人性。


    # 【视野距离】


    人怎么能更了解自己？

