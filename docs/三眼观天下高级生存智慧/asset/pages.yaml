- pgno: 196
  md: '肠，车行就是什么轨迹，野狗也会形成什么轨迹。多数人就如同野狗，活在汽车规则的轨迹之中，却对规则不明所以。


    随着人类社会的复杂分工化，权力所能体现的优越性范围越来越广，信仰的制造也与时俱进——商业化与资本化。

    我们反观古代，每当天灾人祸社会动乱之时，就是官府与寺庙放高利贷的机会。伴随政治的资本化，信仰的经营规则也更“实际”起来。


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_196_0.png)


    为了兴建圣彼得大教堂以及扩张教皇国领土，并纵容自己及其追随者享受穷奢极欲的世俗生活，罗马教皇派人四处兜售赎罪券。宣扬；只要购买“赎罪券”，即使不忏悔，你的罪也会被代表上帝的教皇赦免；死后免受惩罚——“金币投入收银箱的刹那，灵魂就从炼狱跃入天堂”。


    如果说谈财的效果比较而言，制造信仰敛财的效率要比政府税收高得多，只是q在政教竞争中的“退居二线”使得信仰与敛财范畴相比后者要小得多。但整体依然惊你。在你的十位朋友之中，至少有
    1 位在宗教信仰上被'
