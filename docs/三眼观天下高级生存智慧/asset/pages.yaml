- pgno: 200
  md: '# 赚钱的本质套路一共就 3 个：底层收智商税、中层找接盘侠、上层玩金融！（完整版）


    看经济有两条线：

    第一条是钱的线，也就是钱从哪来、经过哪里、到哪里去；

    第二条线就是分配的线，也就是钱在流动的过程中，各个环节（阶层、圈层、领域）都分配多少钱。

    要看经济，先看政治，这是政治经济学。政经一体，分开盲人摸象。


    从改开开始，咱家基调就是“发展增量带动存量”，也就是说先把蛋糕做大，再搞分配问题。而实际上蛋糕确实是做大了，但分配问题并没有处理的很美好，行政垄断与 yang
    企业垄断拿太多。

    编外 80%的人口分配 20%的财富还不到，而且各行业领头羊还要拿走财富大头。


    以至于很多年都要“保 8”，后来是“保 7”，现在看情形要“保 6”了。


    保的数字看面是 GDP，其本质是在保就业，因为存量不动，只能发展增量来分配给底层。


    粗略估算 1% 的 GDP 能带动大约 1000 万个就业。


    在过去生产力低，物资短缺时期，发展存量干就完了，老牌资本主义靠的是战争输出生产力，而咱家起点低，劳动力充足，通过人口红利输出过剩生产力和平崛起。


    而现如今生产力已严重过剩，商品和服务大量过剩。

    这就会挤压出一个结果：想赚钱就要通过存量财富转移。

    没有新科学技术，没有新的经济动能，没有增量，只有存量竞争，只能就是互相抢，财富互相转移，穷了这家富了那家。

    分配是从上至下，而在财富转移流動的方向上看，必然遵循从下往上流动！

    这个世界的规则都是富人赚穷人钱，增量时代，是分多分少，而存量时代，就是转移多少。增量时期养，存量时期<|start|>。'
