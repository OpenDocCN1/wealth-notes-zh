- pgno: 192
  md: '# 信仰与规则的制造人类社会的玩法


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_192_0.png)


    # 画地为牢


    人类，天生就是一种需要被管理约束的动物。我们都高喊着追求自由，但恰恰相反的是，如果使我们面对真正的自由，我们将手足无措。


    我们从一出生开始就被套上了文明的规则镣锁。从对襁褓中婴儿的说教开始，伴随着人的成长，教育就是不断地给人套上规则镣锁，你原本以为教育是帮助思想开悟，从而获得思想上的自由，其实恰恰相反，绝大多数教育只不过是从一个规则转向另一个规则。


    教育因规则而生，也因规则的漏洞而被淘汰掉，这就是知识的迭代，我们称之为进步。


    我们被教育如何弯着打扮，如何规范我们的行为举止和言辞，对待事物的判断上如何行被告知道德准则，为何我们都要依附于各种规则而生存？


    追根溯源本质在于人性都需要信仰。信仰是人类可以维持行进动力的能量本源——人类都需要找到一个理由将生命续下去。'
  merge: -1
  img_proc: true
- pgno: 193
  md: '从人类大脑发育出生认知开始，我们就被告知一个个理由，且在不断的寻找新的理由：当下行为的理由与未来人生的意义。


    我们逃脱一个规则，而等待着的是另外的一个规则，绝大多数知识的制造目的就是对众人“面地为牢”。


    # 选择与崇拜


    人类由于聚集的本性必然会不断地进行利害选择，选择产生了对事物正确与错误的判断，产生了是非观。


    而人们对于“正确”的追寻，使得我们亟需一个“正确的示范”，这就是崇拜——崇拜的本质就是寻找一个可以给个体生命存续“示范”的对象。


    信仰，本源是人性的聚利，而崇拜即为仰望，此之谓信仰。如果谁能给你一个“确信”的东西，他就是在为你量身定做信仰。当人们由于聚利的本能，而选择摒信条样规则，这亦然是信仰。


    在人类社会之初，对自然的认知浅陋，将生命存续进行的理由与天地联系起来，这就是对天地的崇拜；随着人类社会的不断发展，生产生活的分工加速，商业分工愈加精细，可衡量利益单元愈加精小，以及阶层的产生，人的信仰需要“拟人化”，由对天地、祖先和神灵的精神信仰的崇拜转而到物质信仰的崇拜。


    # 制造信仰的宗教


    个体的生命存续都需要一个理由、一个示范；而人性上我们更相信神秘莫测的东西，它像宇宙一样冰冷的运转，这个东西叫“威严”。


    信仰自始至终都依存于人性聚利的本能，当有人以此来谋求利益之时，权力与威严的结合体——权威就诞生了。


    依托于人性崇拜的本能来制造信仰，这是权力的最高级的制造方法。这也'
  merge: -1
  img_proc: true
- pgno: 194
  md: '决定了人类社会第一个最高权力机构一定是宗教。


    宗教的本质就是制造信仰的规范。宗教就如同一个个股份制公司，所制造的商品是一个个信仰的规范。如果我们放眼观察全世界，所要选择的信仰“商品种类”繁多，肤色不一的神灵们向所有人推销自家的产品。而为了得到更多虔者的拥护，“信仰公司”们也逐渐放开自身的规范严格度，比如在吃素与吃肉上、在是否可以结婚满足繁衍欲与性欲上。


    哲学的发展是返璞归真，宗教的发展必然是逐渐商业化。


    信仰规则的运行 Lep 是凌驾于其他各种规则运行之上的根本之法，政治、经济、社会、文化皆是在其下运行的规则，而与宗教距离最近的就是政治，政治的存在一方面要有宗教属性，无论民主主
    Z 还是社会 2Y，都需要反复洗练自身规则可以存续下去的理由，从而争取人们的崇拜；另一方面政治又要具有实际生活属性，这就延伸出经济社会——也就是信仰的物化。


    随着信息量充分与趋向对称，政治所扮演的角色也越来越赋予更多的社会实际生活属性，从君权神授到资本驱动。


    # 权力与吃人


    拥有生杀予夺的力量不是权力；在某个组织中占有某一分配环节也不是权力，用金钱推动人们的行亦不是权力；权力是讲出的话可以影响多少人，可以让多少人“确信无疑”，这种支配人精神的方法，就如同牵引者人们的灵魂。


    任何的信仰能被众人广泛接受，需要满足众人的低级感知：利益驱动。以平等的理念行不平等之事，以谴达的理念行狭隘之事。就好比一个人信仰上帝的驱动力是由于错误的事情想要得到救赎而已。


    信仰的“威严”就是在规则上不允许辩驳和排它性，这也决定了诸多信仰不仅不能成为社会发展的有效动力，反而成为人类前进的阻碍。无论是儒教对社会发展的损害，还是天主教对科学进步的遏害。


    伴随着人类社会发展，信仰的演化从最初淳朴的自然崇拜转向权力之刃。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '当一个人只有低级的感知能力，并确信某一种信仰的利益驱动，那么等待他的就是“面地为牢”。


    再精美的包装也掩盖不了宗教冲突的本质——利益冲突。信仰的争夺说到底是一场精神殖民与权力变现的地盘冲突。当我们观察这种“面地为牢”规则的运行，借用鲁迅先生的话：翻开书细眼都是仁义道德，而仔细观看从字缝里看出两个字“吃人”。


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_195_0.png)


    十字军东征，野蛮的杀戮为上帝贡献。


    # 信仰的产业


    信仰并不是什么高端词汇，更不是什么光彩正能量的词汇。拥有信仰也未必见得就是好事。在人类这一高度层面，我们称之为信仰，而在实际生活层面，信仰就是一个附加于人性弱点本能之上的规则玩法。


    人与人的高与低之分別，在于对欲望的掌控程度，相比较划分成高感知度与低感知度两类人群。低感知度的人就像是野狗追逐汽车尾巴上挂着的香'
  merge: -1
