  md: '# “放水养鱼”就是“识时务”的话，这个是核心，剩下一堆什么减税减费的数据不用看了，那都是“领域话术”。


    很多不会“识时务”的同学都喜欢抠数据，希望在此间对未来推导出一二，三眼不止一次告诫这些同学，经济是政治的延伸，政治的核心是分配，大组织玩分配你不懂，经济给你1T硬盘的真实数据你也是看不懂的。


