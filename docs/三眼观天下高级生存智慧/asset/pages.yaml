  md: '“同一性”的。


    比如瓷器农场的茶文化、酒文化，背后就是“同一性”，无论文你是小穷鬼、流浪，还似富豪、街疯，众多小动物虽然也分成很多阶级，在经济、军事、科技等具体“实干层面”思想结构是不一样的，但是弄杯茶端碗酒坐下来聊聊家长里短，不谈实干只谈人生，所有人都可以互相通路，无论你是北方草原放羊的，还是东莞做大保健的，栖居于那里之外，也可以坐下以聊一聊。


