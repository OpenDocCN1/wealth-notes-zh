- pgno: 151
  md: '进去吸血，吸干了就跑，流窜在全世界各地猎害农场。


    # 二是有的农场主觉得它们进来也挺好，有钱有方法使自家农场小动物生产力提高，这样自家也发展起来了。


    这个“合作”就是工业化转移，老牌海盗农场 NB 都是靠工业科起来的，工业化水平就是其看家本领，新兴农场还有停留在农耕文明维度。跨国公司就是把工业化体系逐步的做套进新兴国家，用新兴国家的劳动力和资源，加上带来的工业化体系，一起创造财富，最后再通过贸易把财富运走，这就是整套吸血过程。


    有的农场主傻乎乎，工业化水平毛都没学到，财富倒是被吸干了，跨国公司走了，满地鸡毛和污染；有的农场主就特别机智，财富肯定是要被吸的，但是自家农场小动物学习能力强，慢慢的工业化水平就练出来了，自力更生自己赚钱自已吸。跨国公司一看没啥机可吸血赚啥就立刻跑，跑去东南亚继续玩吸血套路。（近
    20 年）。


    在拓展第主义地盘方面，老牌海盗农场英国早已过时了，被新海盗农场美帝大流氓早已取代。20 世纪 60 年代，大流氓农场地盘扩大到 70 多个农场，到了 2000
    年后，地盘扩大到 150 个农场。


    所以北极熊农场的话事人讲过，地球各个农场只有两个是真正独立自主的，一个是瓷器农场一个就是北极熊农场，剩下都是 tm 殖民地。


    # 还有一个东西需要说一下，就是量化宽松。


    这个词天天看见，具体是啥小动物们一头雾水。

    在一個农场内部也有吸血循环，只不过不跟外部掺和，自己内部吸，当然也会有吸不动的时候啊，咋办呢？


    农场的央行就会制裁利率，这样借贷成本就低了，相当于钱变得便宜了，这样更制激小动物们贷款，降低存款产生的利息反向逼迫着你不爱存钱，这样个人和公司都会增加开销。

    整体看就是：增加流通环节的货币量，鼓励投资和消费，刺激经济循环，即可开启吸血大法猪增长。


    但是这个东西依然解决不了贫富分化差距啊，小动物们都不傻，谁也不贷'
