    比如种地，1 个小动物开拖拉机播种洒水除虫，这种生产力就很一般，累到吐血最多种 1-2 公顷土地；

    但如果变成 10 个小动物一起种，加入更多的科技机械，将种地划分成 10 种环节，每个小动物使用机械只于 1 个环节，这种更加精细的分工协作可能会玩转 100
    公顷土地，如果科学院机械更高端，可能还会玩转 1000 公顷土地。

