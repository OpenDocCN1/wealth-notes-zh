    # 2、想象力=切西瓜的能力。切西瓜的关键在于“下刀角度”，不同切法结果不一样。


    其实，西瓜本来是没有的，一旦有人要去切，就会产生一个西瓜，也就是说大家眼中的西瓜都不一样，我们所面对的诸多事物都是主观产生的。


    不同角度 产生不同的西瓜，所有人的切法最终会组合出一个西瓜的样子，想象力就是确定你所认为的西瓜有种模样，越趋越大小深，就越能够覆盖容纳更多的人。


    你说的“碎片”就是切西瓜：


    有的受限于“西瓜刀”太小，只能切个表皮，而大部分人只能看见表皮，所以切表皮最容易共鸣；


    有些切法是有意而为之，掺着明白装糊涂，受于利益而混乱试听，或者迎合煽动，看似深其实也是表皮，而吃瓜群众也不在乎深不深，因为只能见到表皮，寻求共鸣；


    什么是表皮？就是前面讲的“提供一种选择”。对上了就共鸣，对不上就怒喷，这就是蕉羊。


    有些切法很深，但受限于刀主的个人角度站位，比如看科院有学著专门站在一定政治立场去研究国学谤略、研究充论场，那样研究100年也倒不到根，但你还不能说他错，在他的那个圈子的角度，是非常正确的方法，而且会成体系。


    所以怎么通过信息、通过碎片们建立结构？'
