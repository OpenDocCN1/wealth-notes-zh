- pgno: 92
  md: '二是玩什么？怎么玩？玩思想运动，也就是玩“加工方法”，人最重要的就是这个。


    比如领悟道德经，就是领悟老子的意识流，想办法将老头的思想运动模式附体到自身。


    玩意识流得有个载体，道德经和易经也得讲点人纹、政治和世故什么的，特别特别到诸谈辩，那就要讲点美丑、有无这些“人为主观定义”，因为意识流需要载体显现。如果没有载体，那就是道了，是无意识无主观的，摸不着看不见。


    但事实上绝大多数人是不会“玩”的，专门锁死载体，因为人脑子一动就要“主观下定义”。没这个话不了解。比如<|start|>老子阐述思想的某个载体“虚其心实其腹”，然后给老子定义成政治家…再去锁死别的载体，定义成军事家、外交家…就算忘了老子是个思想家。


    所以老头要“逆人性”。真正玩爽的都不顺应着人性玩。


    这就像是数学：玩，就是从 1+1=2，悟出了开根号、次方等。这就是玩出新水平。锁死，就是死记硬背加减法、乘法口诀，以及 XXX 例题。


    思想不是学出来的，而是玩出来的、逆出来的，玩才能悟。


    经常玩“加工方法”，常怯常新，平时看不出有什么效用，但真要遇到问题之时，它就自动激活，跳出来帮助分析问题。


    之前星球里写过一个，就是“入藏识”，大概意思就是潜意识。人提升思想和练武术大同小异，武术上有个“肌肉记忆”，比如搏斗不能“记住”套路，靠记忆去搏斗那就是还没练好，只有被敌打的份。思想也一样，能记住的那不叫思想。'
