  md: '中层境界是自我感悟到了什么，这已经不受限于视觉视野，开始用思想观看，但受制于自我！人过于重视自我，思想的视野就逃不出自我的范围，围绕在自我情感、人际关系、生活范围里；

    上层境界是忘我去俯瞰，这样才能客观的看看这个真实的世界。


    # 【动物养殖】


    当忘我去观察世界，你是一个动物，然后是一个人类；

    万亿年的动物世界后，才有了人类世界。人首先是野兽，而后才是人。


    养殖的最初形态源自于动物界分配，这是群居动物的基本，也是养殖的最原始模式。


    一个狼群会在捕猎后分配猎物的肉，这是对内而言，这叫分配；

    而狼群知道，在一个季节轮换不会吃光草原上的兔子，会使其繁殖，这是最原始的养殖，这是对外而言，这叫养殖。


    而人类因为智慧，使养殖更加精密化、可操控。


    一切分配的核心在资源。整个人类进化史就是一部资源争夺史。


    而当人类认识到，最根本的资源除了土地外（土地资源就是地上地下的附属资源），劳动是排在第二号位的超级价值，自此种群内部的养殖开始了，公式是：劳动+资源=价值。


    什么才能保证养殖？几千年从来未改变，那就是武力+资本。参见美弟


    # 【分配】


    为何三眼的五大认知论里，政治排在第一位。


    因为整个世界看来，把政治脱掉外衣，本质就两个字：养殖，如果强追迹非要说一个字，那就是在古代叫“牧”字。徐州牧、豫州牧，如果想进入政圈，首先要学会怎么做一个牧人。


    经济、文化、科技等都是养殖过程的顺带产物而已。你再有钱、文章写得再好，科技头脑再强，受到接见也会笑沮人。


    经研究发现财富价值、文化研究人类精神，资本推动科技，如果脱离开养殖的根本思维，都会不得其本，专家就会成家了。


    这就是三眼讲政治的核心是利益分配。


    而什么是养殖？什么是分配？有哪些联系呢？看清这一点对实际生活有巨大效用。


    豫州牧<|message|> 预备！'
