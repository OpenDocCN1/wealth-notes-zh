  md: '首先思考，LPR 针对的人群主要是哪部分？

    是中产。

    为什么？

    因为中产手里房子最多，与中低层人群比，“碗头平米”就是决定阶层的东西。


    再想想银行是干嘛呢？

    银行是给国家赚钱的。


    国家赚钱在左手收税，右手就是靠银行收利息，那么利息收谁的最大头？

    肯定是中产吗，难道收地主的？更不可能在中低层一个劲薅羊毛吧？


    那么 LPR 呢？

    是利率市场化的东西，你以为银行是傻子吗？你个中产房子不少，现在开始大幅度给你又降利息？让你天天躺着数钱？银行赚什么？

