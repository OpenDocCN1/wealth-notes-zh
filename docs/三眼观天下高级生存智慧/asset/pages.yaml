- pgno: 169
  md: '浮躁就是想快速致富，快速虚荣，快速的获得优越性。

    这是没有丝毫逻辑的思维，这种浮躁一定让人关注赌博！

    如果一个人身在养殖层，认知往往也是锁在养殖层，扩大不了，而当寻找到出路时，出路基本都是“牧人”的养殖技术套路。底层玩彩票，中产玩股票，一坑套一坑。

    看民彩票就是一个个翻滚出来的小球球，股票就是一条条曲线，除此之外，在认知上，信息极不对称，当信息不对称时那就是幻觉。玩的不是彩票和股票，玩的是内心的幻觉和浮躁的心跳。

    而一群人讨论幻觉，这就是文化现象。

    开篇说过，除了哲学外，任何的文化、科技都是养殖过程的顺带产物而已。


    这个世界称得上认知的就两个：


    +   一个是哲学，跳出人性；

    另一个就是几千年发展至今的养殖技术。'
