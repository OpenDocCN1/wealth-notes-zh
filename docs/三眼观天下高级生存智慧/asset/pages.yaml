    所以诸子百家为何法家能走到最后，这是因为法家的内核就是“一也”，也就是说将小动物整齐划一。


    这一点没啥可嗨的，不要闷骚论（闷骚论就是还没想开），很正常，你是农场主也会很自然走“一也”的路线，走别的你也走不通。'
