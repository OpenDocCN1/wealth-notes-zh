- pgno: 153
  md: '之秀的大农场在工业化上啥都有了，吸起来不太容易了，给吸血的空间少得可怜，吓坏呢？


    那就得通过不需要实体贸易往来的东西吸，金融是没有具体边界的，只要货币都是融合在一起的（一个货币结算体系下），就可以通过资产交易产生利润。


    这个吸血方式更高明，以前还要挖技工去建厂子，还要和各个农场的地头蛇搞关系，时不时来个罢工啥的代理人还有生命危险，操作起来好麻烦，有了金融就方便多了，通过资本交易玩花样，核心就是玩货币。


    新兴的农场们工业化大多还没玩明白呢，金融货币这东西更是没见过，大流氓靠着枪猛忽悠带听呢，大多数农场都金融开放（汇率开放）了，与大流氓的绿钞挂钩，这下可就进入大流氓花园陷阱了。


    每隔一定时间（约 10 年）就来一次货币狙击，给弱小农场的货币搞崩溃，然后再用纸币进去抄底资产，这比以前的实体吸血来的更快速更简便。


    截止到目前为止，全球股票、债券与虚拟领域资产的价格加在一起，是实体财富的近 4 倍。


    虚拟资产严格意义上讲不能吃不能穿，电脑死机了你都看不见它们，根本就不是什么真正的财富，只是耽在实体财富（实体经济就是创造实物物品和服务的经济）上吸血的套路罢了。


    毕竟是虚的，要有实体财富做支撑才行，这也决定了虚棍经济玩法也要有上限，经过这些年的吸血，金融市场也达到上限，地盘也开发不出来了。


    # 五、诈骗的必然性


    当经济增长（吸血）达到上限，诈骗就会多起来！


    吸血达到极致必然呈现出贫富巨大差距，你想啊一边是少数资本家狂吸，另一边是被吸的小动物，时间久了一边富的流油，一边干瘪，财富差距巨大'
