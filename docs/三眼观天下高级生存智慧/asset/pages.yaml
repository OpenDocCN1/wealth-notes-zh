  md: '三眼经常说政治决定经济，那么什么决定政治？那就是权力与资本的博弈。


    我们静态看“农场”就是养殖，动态看它就是猎捕与反猎捕。猎手有两种猛兽，一个是权力，一个是资本。活在一个农场里都要依存于制度，制度的本质就是权力与资本的博弈形态。


    天天看新闻嘲海量大流氓，其实营造农场与海盗农场之间就是意识形态之争，意识形态之争的本质就是权力与资本的博弈结构之争。这种博弈结构影响着每一个人的实际生活。


    权力是什么？就是姓社；资本是什么？就是姓资。


    往极端走，哪条路都不是最佳路线，一个农场最恐怖的事情，莫过于权力与资本失衡；权力过大，就会朝作非为（参见十年 WG）；资本过大，反过来操控权力，吃人不吐骨头（参见美帝）。


    权力猛兽如何搞破坏我们就不聊了，结合香冠先生的话（字缝里就是吃人二字）几千年历史自己翻翻看。我们聊聊现今，专讲资本，资本如果过大就会反噬权力，就会控制舆论、媒体、甚至参与权力政策制定。


    很多东西老百姓见了就不会以为然，比如：


    +   脑 B 金宣称上相当于治百病的灵丹妙药；

    6 个核桃能给脑子开光；

    与黄赌挨边的游戏一遍毒害青少年一边吸着血，几乎所有互联网大佬的主体利润都来自游戏，古天乐渣渣辉大砍刀，刀刀见血；

    个人信息不断被贩卖；

    T 宝宝和 M 团各种 “请君入瓮”，先给仨甜枣，后面大棒子一顿毒打吸血；

    等等…'
