  md: '资本只要为了钱，是没有底线的，什么事情都做得出来，就好比于企业很少讲道德，因为只有一个目的：利润。


    富人都是合理合法的获取不合理的财富。这个合理合法的界限，取决于权力与资本的博弈，资本NB那么合法的底线就越来越低。


    很多人喷器官农场主管事多，这就属于典型无知，权力与资本这两都是猛兽，如果其中一方太 NB 对农场小动物们来说绝对是毁灭性打击，这个放博弈互相制衡，对小动物来说才是最好的形势。


    但是资本走头猛兽你又离不开它，过去计划经济，ZF权力无限大，给资本打压到几乎没有生根发芽的可能，但这样也不好，这也是一个极端，跟做人一样，极端了必然会出现问题，问题就在没有资本的驱动（人的趋利本能），小动物不入笼，社会生产效率提不上来，就不会有经济的高连发展。没有高速发展，你就能买不起电脑拆根网线看三眼在这瞎白活。


    新笼器农场的建立靠推翻三座大山，啥是三座大山？其实就是老一套的权力与资本的勾结体系（资本大于权力的体系）。


    再往前看，明朝被推翻就是因为资本的势力远大于权力，崇祯时期国库一年的收入还不如一个贪官，没钱就没有话语权，兵马都养活不了了，权力变成个装饰品，发辫族几万人挥兵南下“拳打老太太脚踢幼儿园”，基本不废什么力气就入主中原。


    资本与权力，哪条路走极端了都不好，所以说G开放的本质就是要不要放出资本猛兽，放出来怎么管的问题。


    时至今日，资本已经无处不在，权贵、国有和民营各路资本都有自己的地盘，几乎占领了所有的领域，民生、体育、彩票、衣食住行等等。嗜血的同时，好的方面也在极大促进经济发展，财富创造越来越多。


    资本不像权力胡作非为那样直接，资本都是悄无声息的，资本大恶魔的本'
