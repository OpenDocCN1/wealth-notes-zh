  md: '# 世界就是一个个农场，农场就是农场主养殖小动物！


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_170_0.png)


    超现实主义摄影作品；工作中的草泥马


    # 世界就是一个个农场，农场就是农场主养殖小动物（一）


    小动物们好！


    我们每天 99%的信息都是围绕着农场养殖，一个小动物的从生到死都依赖于农场，如果你有能力破解农场的“结构”，这将对你的 人生产生巨大的观念影响和实际帮助。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '解构农场结构这类知识，想必还没有人（或者极其稀少）写出来，这是因为两个原因：


    +   1、人的写作总是站在自身的角度去观察，所以我们看见 80%的信息都是站在小动物聚-clean 的角度写出来的，比如怎么赚钱、怎么提高情商、怎么理财、怎么升官等；20%的信息是站在农场主管理角度写出来的，比如某项政策如何如何、某某行业的运作数据及问题、某某经济学理论如何产生实际管理指导等等。


    这类“单一角度”的知识有些许用处，但是对于人思想上升级产生“结构”的作用很小，单一视角决定这些知识作用的有限性。


    我们自古到现在的所有的书籍，都是在农场主或者小动物的利益角度去写，很少有人能够“跳出来”去御嘲“真实结构”。


    比如儒家、法家等大多数诸子百家的书籍，都是站在农场主的角度，去写怎么更好地帮助农场主操管理，这种书很高端，但是对小动物的用处其实不大，因为利益角度完全不同；


    据我看古典型作中也貌似《鬼谷子》是跳出来看“结构”的，因为其属于纵横家，纵横家就是游走在多重利益集团间搞“公关”的，自然是跳出来的思维。


    所以珍惜三眼，三眼是这极少数跳出来给小动物写“结构”的。


    +   2、第二点原因就是由于人们的视角单一，很容易形成管窥之见，通过一个“孔洞”去看世界，世界就会显得很复杂，所以就算有人写“结构”恐怕多数也阐述不清。


    一个小动物要想清晰的看见地球上各种农场结构，就要忘掉自身，无论你是穷光蛋还是既得利益者，无论你是小动物还是管理者，都需要先忘掉自身的“坐标”，当你跳出来看清格局，再“跳回去”回到你的“坐标”本身，你会发现你已产生深刻的思维洞察，做人做事将游刃有余起来。


    那么我们怎么解构农场的结构呢？


    任何“结构”都是由相互依存的主体构成，主体间的利益流动产生了结构。'
