  md: '西瓜本来是没有的，把各种碎片以及真实的或虚伪的切法都融合在一起，才能形成“大西瓜”。


    提供一些基本方法：


    # 1、反向切；


    事物有好的一面就有坏的一面，多数人只选择一面，那么我们就需要选择两面；


    比如地产，坏的一面：吸血实体、金融劫掠、锁住流通性降低经济效率、掏空内需…


    好的一面：基础建设融资器、保护百姓财富、集体系富的空间缓冲…


    选择坏的一面看的人，结果往往很悲凉，选择好的仿佛见到春暖花开。


    # 2、换位切；


    心中没有好坏，没有选择，没有明确对立，而是放下自我，站在刀主的角度去体会，刀主到底要干嘛？


    比如现在头条上巨火的一位体制内长脸老先生讲地产，还给出套地产著陆的方法，那是绝对不可能被大组织接受的，但还是要去仔细琢磨，哦，原来讲了几万字归到四个字森富济贫，而且方法简单粗暴，这是在搞迎合嘲啊，那为啥搞迎合呢，哦，原来年纪大了，开始要道德标杆，但是切法有可鉴之处，虽然角度迎合但水平很高，不看角度只看切法即可。


    吃瓜的继续意淫，而你已从中看到切法。


    再看看其他智囊，有的不是吃瓜群众的明星，而且一旦露头就会被吃瓜群嘲的体无完肤的，继续站在他们的角度去看，哦，切法一定不被吃瓜的接受，但一定被采纳。


    换位就是“翻译”，翻译很难的，看字面是看不懂的，需要把各路刀主放在一定的环境里去看，这涉及到面就广了。'
