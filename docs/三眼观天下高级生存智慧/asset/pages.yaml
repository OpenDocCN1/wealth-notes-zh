  md: '# 如何在信息碎片中，建立自身的思想结构？


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_102_0.png)


    思想背后都是人心


    提问：三眼老师，文章中多次提到人要有自己的“结构”，结构的建立是“创根”，可是我们目前小到朋友圈，大到互联网，都是像老师说的那样“碎片”，最后可能什么都懂，有什么都不懂的状态，也就是说根本没有结构的搭建。俗称短平快。个人的结构建立，序，是什么样排列？与其他领域或者行业是否都相似存在？请教！


    答：我们从小到大所见的信息足够用了，能否建立结构在于自己，不在于外部。


    这就像是两个娃娃同一起点起步，外界条件一样，但最后结果不一样，在于自己不在于环境。


    把事物比喻成西瓜，解构就是切西瓜，西瓜切得多了，就会有自身结构。在“切西瓜”上人和人之间会有两个区分：


    +   1、大部分是懒惰的，直接想要切西瓜固定程式，甚至连切都不想切，只想要结果；


    也就是说，人们多数只要“一个结果”，或者叫“提供一个选择”。


    而且人们固执，一旦选择很难改变，害怕明知是错误的，也要继续维护自身的选择，因为这是其维护自身存在感的方法。'
