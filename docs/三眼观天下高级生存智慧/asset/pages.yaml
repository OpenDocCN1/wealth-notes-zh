    其实是没有问题的，正常态，任何市场要快速发展都要经历这个过程，相当于“七伤拳”，攻击力越强也会对自身造成结构性伤害。这个过程经历完成后，下一步肯定是要“调整结构”，这个词耳熟能详吧？


    在高速发展的过程中，在权力那一端口，国企依靠权力差断无节制；在资本这一端口，对贬责和民营资本放纵，这很正常，三眼经常并入魔，这集体与个人是一样的，不入魔就不成事，只是入魔后如何“修仙”回归平衡状态。


    所以，调整结构就是调整权力与资本的博弈结构。


    小布什他爹说将权力放进笼子，这话只说了半，而而且也只做了这一半，另一半是要将资本也要放进笼子，这一半年做不下的场可以看看海南农场如今的结果，贫富差距严重，制度走到尾声，结构失衡都要控制不住了。'
