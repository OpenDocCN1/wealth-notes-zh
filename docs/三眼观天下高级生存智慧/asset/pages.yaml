    不搞事怎么能搞斗争？不搞事怎么能“大禹治水”？不搞事怎么能“愚公移山”？


    参见从毛《中国各阶层分析》看这个时代竞争！告诉你最简简单实用的成功思维！（3000字）这篇阅读量最少，但其实最受用，只是多数人都已经被nu化成小绵羊了，吃肉的牙退化了，都变成吃素的。


    媒体编写信息的前提，是大众心理分析。大众爱看什么，才会编什么。


