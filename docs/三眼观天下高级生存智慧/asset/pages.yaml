  md: '![](img/7db57a7e0d8c809adbec081fdf6a8e74_168_0.png)


    # 【人生意义与幻觉】


    人活着总在寻找意义，如果非要寻找意义，你首先要知道什么叫人生。


    人类社会会未离开过养殖，养殖技术越来越精细化，而无论怎么精细化，都以殖民技术为根本。从奴隶时代，到土地殖民，再到经济殖民，而到思想殖民（认知殖民）。技术越来越高端。认知殖民就是告诉你人生是什么！


    人越往底层，越沉沦，越容易被舆论和大众娱乐掌控，活在一个个幻觉里，因为人都不重视自我，摆脱不掉情绪的释放，通过外界环境灌输的信息来认知自己的人生。


    这就是一个所謂文化现象，象都是幻觉。


    任何主流的文化现象都是以满足自我为基础方法。无论是武侠还是韩剧还是泡沫剧还是家长里短的家庭剧。


    越往底层，人会越自我，越觉得自已是独一无二的，因为认知太小了，其实就是亿万养殖动物的一员。而越往上层，当看见分配，参与分配，越来越觉得自己渺小，因为认知扩大了。


    而大多数底层是叫不醒，但也睡不着的。


    叫不醒是脱离不开幻觉，睡不着是潜意识里也明白幻觉是虚的，这种叫不醒且睡不着的结果，就是浮躁！'
