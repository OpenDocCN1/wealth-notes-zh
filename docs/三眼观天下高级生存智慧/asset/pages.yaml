  md: '大！


    看整个地球上前 60 位富豪的财富，相当于整个地球底层近 40 亿人的财富总和。要是单看某个农场，5%的人占了全农场 80%财富，彼此彼此。


    经济是啥？经济就是循环，不循环怎么吸血呢？

    如果不循环还吸血，那只能靠直接抢，这个是一般农场都干不出来的，地球曾经干过两次，就是一二战。如果单看各个农场历史啊，更换农场主这种事就多了。


