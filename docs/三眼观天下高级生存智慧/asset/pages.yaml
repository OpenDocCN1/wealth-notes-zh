- pgno: 81
  md: '问：

    按理说人都是向学而生，为什么会产生这么多垃圾信息呢？


    三眼答：

    大规则使然！

    这个大规则叫做文化！


    什么是文化？你们的理解全都是错误的！

    在三眼的“解构观”里，万物可拆解，只有拆解你才能了解它，那么文化怎么拆解呢？


    文化古语“纹化”，也就是社会的纹理，纹化属于管理学，管理国家用的，管理的就是形成了“人纹”。

    （不知道哪位贱人将“纹化”改成了“文化”二字！）


    纹有两种：

    一种是硬性规则，比如法家农战思想，比如士农工商的阶层划分，硬性规则就是在权力意识下将人划分成各个“纹理”，像棋盘的格子，而人都是棋子，有规有矩方便管理；

    另一种是软性规则，也就是意识中的“棋盘”。


    一硬一软，画出“纹理”，此谓“纹化”，而今叫“文化”。


    问：

    可否进一步深入解构？


    三眼答：

    举个例子，比如：

    佛家为什么在历史上不被压制？

    为什么道家却不显主流踪迹？


    因为佛家是“出世观”，也就是让人们“从三到二再归于一”，这样就不会讲利益，只讲道德。'
