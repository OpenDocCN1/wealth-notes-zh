  md: "换一种可以说出来的说法就是，一片生态土地，无论经过多少年，都是原来的生态演化到如今的生态，根本的东西不会变。\n\n举个“根本”的例子：文字！\n\n\
    文字就是思想的载体，文字可以说是最初的知识，知识的来源是以用为体，你要用它，才会发明它，首先发明的是文字。\n\n文字就是一个个关键词，每个关键词都是一个“世界观”，一串串“世界观”有逻辑的组合在一起形成句子，这就是思想的本体，**你在用什么文字，你就依附于什么思想本体**。\n\
    \n无论经济政治再到社会，都是依附于这个东西。\n\n现在年轻孩子，逐渐变成借用原来的文字，而自成一套语言系统，比如什么火星文等，当人丢掉根子，那么就得不到真知。\n\
    \n**我们去继承一些东西，并不是为了继承而继承，而是因为那些东西确实是最实用的！**\n\n也就是说，有一个简便的学习方法，就是去搞懂最原始的文字的意思，以及组合逻辑，你就明白了“中式”人生的真谛！\n\
    \n用些东西是“体”，也就是说最初的规则内核，这个不懂，学再多“用”和“术”你也玩耍不起来，因为没有体可以“插”！这就是无本之木，都是幻影。\n\n尤其是近十年来，西学东进，被一个个不明真相的孩子奉为珍宝，凡事都是西式的好，结果呢？\n\
    你学了再多各种西学大师“小资”知识，用得上吗？\n\n问：\n为何西学“小资”这么受 EVEN?  \n\n三眼答："
  merge: -1
