- pgno: 227
  md: '# 人生逆袭三大层次：拼劳动、垒资产、玩金融！先认知先发力！


    > “轮回即为上下浮沉的生死流转”


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_227_0.png)


    主旨：


    +   拼劳动——卖身；

    垒资产——暗着抢；

    玩金融——明着抢。


    人生逆袭就是一个从卖身到抢劫的过程。'
  merge: -1
  img_proc: true
- pgno: 228
  md: '# 【一、拼劳动】


    # 劳动创造价值


    绝大多数人都需要靠劳动来获取财富，我们所说的竞争，几乎都是在劳动收益上的竞争。


    劳动是啥？

    就是出售自身的精力、体力、脑力、经验、时间等，换取利益回报。

    说白了，就是把自身当成一个劳动工具出售，竞争就是如何把自己卖个好价钱。


    绝大多数都在劳动层，只有少数人才能够“不劳而获”，这也符合金字塔社会的基本逻辑——多数人干活，少数人享受。


    而且对于绝大多数人，所谓创业也同样是出售自身而已。

    其实这样不叫创业，叫换个方式卖身，真创业是卖别人，不是卖自己。


    # 被利用的价格


    我们从小接受义务教育，有的初高中缀学进入社会，有的直啃书本到硕士、博士、博士后，拖着孩子步入社会，学习的目的是为了啥？

    都是为了进入社会后获得具有竞争优势地位的劳动收益，说白了就是如何能更好的被利用。


    这么说，难道劳动分贵贱吗？


    三眼：分！


    同样敲键盘，你打一份营销推广 PPT，和敲一份资产评估 PPT，得到的回报肯定不一样；

    同样扛东西，你扛化肥麦子，和送货物送外卖，得到的回报肯定不一样。


    谁都想在同样精力与体力的付出下，获得更高的回报！'
  merge: -1
  img_proc: true
- pgno: 229
  md: '每年高考，家长最关心的除了孩子考试分数外，就是报考志愿如何填，甚至花钱请“大师”来给指导指导——孩子学什么专业将来毕业了混的相对好？


    # 劳动的定价


    说到此处，诸位最关心的就是什么样的劳动“最值钱”？

    要想知道什么“最值钱”，首先得明白劳动是怎么定价的。

    劳动定价一种是人为制造的，一种是市场制造。


    # 人为制造的，也就是“有形的手”操作的：


    核心：看风向！


    比如，体制内看报纸玩手机消耗一天时间，可能和体制外拼命敲键盘、搬砖头消耗一天的收益一样多，甚至前者收益>后者收益。

    也就是投入回报率不在一个量级上。


    比如在改开初期，为调整劳动结构，将大量农村劳动力转到工业劳动，怎么调整？

    把农产品价格往死压，工业品价格抬升，这样在劳动分配上自然工业劳动远>农业劳动。

    形成“剪刀差”，只要人不傻还年轻，拖家带口去沿海。


    农业一直比二三产业要收入小，这个是“遗留”问题，也是金字塔“分配”问题，这个在很多文章讲过了，但是到底谁的劳动收益靠谱，这个也是个未知数。


    大家都是被利用的，就都容易被“遗弃”，比如此次疫情，充分展示了农民可以自给自足的本事，疫情对农民影响远小于城市中产，后者因为疫情所带来的收入停滞、失业、债务不会停滞继续滚动，如果疫情延续时间长的话，中产很容易破产归0。

    假设真到那个份上，你说谁的劳动收益靠谱呢？'
  merge: -1
  img_proc: true
- pgno: 230
  md: '还有一点，在《九大阶层》里说过（微信公众号内搜索阶层二字），大组调整社会结构，解决社会矛盾，其中一点就是在调整各阶层收入比，这个层里吐出来，那个层里多吃点进去。


    # 市场制造的，也就是“无形的手”运化的：


    核心：看供需！


    比如从宏观层看，我在科技发展上整体质量并不高，对于高精尖人才来说需求口比较少，结果就是你在专业学习上再敬业，也未必有什么实际用处；

    在这一点上看，高校里的专业设置都是虚的！

    怎么样才叫实？

    就是社会生产结构与专业招生结构是相配比的，比如你学物理学得好，到了社会可以用得上。

    而实际上，除了一些特别专业的（比如兽医、计算机）的学科外，大量学子步入社会就是倒卖：销售和文员。

    看各企业排行榜、富豪排行榜就知道了，不是玩地产就是搞网游的（互联网大户基本都靠游戏赚钱），这些对口需求不是销售、文员和很少一部分技术工。


    再比如从微观层面看，在教师比较好混的时期，家长会给孩子报教师类的较多，等一批师范生都毕业了，教室岗位招不下，供严重大于求，咋办？念四年师范最后还是去做文员或销售。


    # 命运在这里的逻辑反应就是：


    绝大多数人的“过程”不一样都不取决于个人，因为认知范围狭窄，不可能一眼就看到哪个劳动收益最大，且最光荣。'
  merge: -1
  img_proc: true
- pgno: 231
  md: '人生命运在此处，就像风中的飞沙，飞到哪你根本不知道。

    有哪个?人跳出来跟三眼说：老子撇掉块砖，当年早想好了！


    多数人的命运不是“指哪打哪”，而是“打哪指哪”。

    或者说都是被时代的洪流裹挟着前进的，具体走到哪，看“吹”到哪。


    # 改命！


    改命的唯一办法就是提高认知！


    人的逆袭必然要经过劳动层，没有“劳动改造”被人利用过，你也学不会么“利用别人价值”。

    在这个层里，所要做的就是尽可能提高认知，尽可能的从宏观中微观以及“无形的手”和“有形的手”等方面，找到你最适合的且在你的能力范围内劳动收益最大化的地方。


    人在35岁之前，都有这个机会。


    一般人23岁毕业，社会10年生活能有此认知已经算不错了，当然读三眼的东西提前建议认知更好，有了认知就会有意识的去找路子。


    # 基石！求快！


    人逆袭的基石，或者所谓第一桶金，几乎都是在此层造出！

    通过合法的或不合法的，取得合理的或不合理的。

