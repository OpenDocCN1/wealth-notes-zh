    疫情一把火给西方极乐击得粉碎，公知傻眼了，假象站住不倒了，估计现阶段再研究下一个标杆吧。


    所以知低怪谁？怪公知带路没带好？不是吧！


    人家带路也是为了迎合众人的心啊…没有需求哪里来市场！


    再比如人们会将社会分成上流社会和底层社会，上流社会者奢华高大上，就像六道轮回里的天人道，对于“天人道”的创作者代表人物——郭小四同志，用很下流的方式包装出一个上流社会，无知青年们内心激流着渴望着…


