  md: '# 人类的精神规则：强大与快乐的本源


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_106_0.png)


    人与人的差距，绝本溯源于精神力，这是人力量的源泉。


    接上篇


    人们都活在一个游戏规则里，规则有“边界，人们都在一个“圈圈”里打转，这就是人的一生。

    精神的规则（宗教）、公式的规则（科学）、利益的规则（政治）、运作的规则（经济和文化）等诸多多少规则，又向下延伸出无规则，把所有人类都载进来。

    污着就是要把游戏玩好，所以一定要谙悉各种“游戏规则”


    本篇


    在人类所有游戏规则里，“精神规则”是规则之本，人类如何定义价值，在社会交互中的种种决策行为，都给予脑中的精神规则

    人类活着，总有个精神归宿，也就是在现实世界之外的另一个精神世界，没有这个人类身不由己，谁能创造这样的世界，谁就是主宰！

    人可以把身体锻炼得很强壮，也可以努力学习到很多生存技能，但仍弥补不了精神上的脆弱

    因为脆弱，需要一直被“哄着”才能生存下去，这是人类的巨大漏洞。

    没有漏洞就没有游戏，玩游戏就是玩漏洞！


    本篇主要围绕人的两个漏洞来讲述：精神指向和模仿行为。

    各种社会交互活动的核心就在于这两个漏洞之中！

    关键句'
