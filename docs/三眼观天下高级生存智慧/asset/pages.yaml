- pgno: 84
  md: '因为它以“存在”为前提基础，也就是“眼见为实”的东西。无论经济、哲学、管理再到具体的为人处世、情绪调节等等，它们都把事物分割成一块一块的，各种表格、数据、曲线、逻辑组合等，看起来“有理有据”，正好符合人们“眼见为实”的这一根本人性。


    但事实呢？


    这种“分割”法，用在科学技术上没问题，因为科学技术是以“存在”为基础。


    但在“纹化”，也就是俗话讲的一个人怎么混社会的问题上，是没有多大用处的，只会越用越乱。


    比如用西式经济学去观察楼市，屡战屡败；

    比如用西式的“自我管理”法去培养自我发展，结果多是沦为“糊涂的工具”。


    你所生存依赖的环境是由一个个人构成的，人和人是不一样的，一个人本身为企业家、老板或者身在衙门，更容易明白这个事实：


    所“牧”之群决定了你的具体方法，也就是术（西学为用）；

    所依附于的最大组织规则决定了你的战略（东学为体）。


    你明白这条线，什么中国酒文化，茶文化，士大夫文化，传统道德规等等都自然顺带解境。


    做人做事都是如此，而已！'
