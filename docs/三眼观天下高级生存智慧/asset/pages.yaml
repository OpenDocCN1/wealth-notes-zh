- pgno: 85
  md: '# 什么是书、什么是读书；三观是啥，为何极重要；

    思想系统、思想力如何提升？


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_85_0.png)


    后台又堆了一些求推荐书籍的问题，一茬又一茬反复问，大家都是上进的小伙伴，再再统一系统回答，未必适合所有人，仅供参考！


    真的很少看书，九年义务教育都很少完整学过一本。如果非要推荐，少而精，且系统完整，那就是道德经，比较像“理科生”，容易入门，可以抱着一辈子，常常常新；而而且怎么读都不会读死，不会祸害读者。


    报道道德经的系统，就是报道家的三观！道家三观包容性强，一旦通路，再打开其他思想流派效率就会飞速。


    但这来讲，估计很多小伙伴还是不明所以，有几个东西理清楚了就好了：


    +   1、什么是三观；

    2、什么是书；

    3、什么是思想力；

    4、如何获取思想力提升。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '三观就是系统化思想。


    其实绝大多数人对三观是很模糊的，而且市面对三观的定义也 SST 模糊，有好几套，其实大同小异，都是截取片段：宇宙观、世界观、人生观、价值观、道德观、情感观…。其实就是从大到小、从虚到实、从道至术的一个
    n 排列，截取其中 3 个就是市面上的某一套三观。


    我们拿宇宙观、世界观、人生观来讲，这个比较“正统”，其实就是中国传统思想中的“天地人”。


    思想，就是观察事物形态；三观，就是观察外界形态的系统化方法。


    宇宙观（天）——事事物存在的本源为何，也就是什么东西诞生了宇宙；


    看起来很虚吧？其实最重要！道家诸境是一二三、阴阳、八卦、五行、天干、地支什么的。有了这个本源认识，才会有根可生长，开始向自然科学（方术、堪舆等）和社会科学（人心活动）上系统发展。


    世界观（地）——认为宇宙是怎么诞生的，直接决定了如何看世界。


    比如以万物为弔狗，有无、美丑、高下、善恶相生。再具体套到社会交互活动，政治、经济、人伦、人纹、利害、优劣，乃至生存方法等等。'
  merge: -1
  img_proc: true
- pgno: 87
  md: '站在法家角度讲就会说其没原则，而站在道家去看法儒，会嘲他御都 是 “死人”。大家伙怎样分析利益形态，评估价值方向都不一样，都是因为背后的系统不一样所致。


    # 大多数人为何思想混乱？因为没有完整的三观，混乱所致。


    宇宙观和世界观都谈不上，很少去叛本源、驳权力、资本、宗教、意识等形态，基本大多停留在人生层面，又要玩灵清做人，又要讲仁义忠孝、又要玩法家残酷利益善恶，又抄袭着自由民主...


    # 生活的假象提升一个维度，才能容易破解真相。


    大多数人都活在 “乱流” 之中，什么时候能清澄这件事，才是建立自身结构的良好开端。


    什么是书？


    书不就是码字唧唧喳喳！只是思想交流的方式之一而已。


    字符得有素材，或者是生活现象、历史事件等客观摆在那的，或者是作者自己编出来的。这两者还总混在一起，比如历史就是人编出来的，覆盖面广的接受度高的就变成真实了…


    而无论是客观存在的，还是作者编的，都是借助载体来展示作者的观点。如果真要看书，看的就是观点，至于素材大概会忘记，难道举子记着无数故事材料啊？100 页的书最后归结成一页。


    那好好了，观点是什么？观点就是一个 “成品”。是作者的意识流形态+素材催化=形成一个具体的逻辑。


    一个简化公式：


    # 书：加工方法（思想运动方式）+材料（真实或编写）=成品（观点）。'
  merge: -1
  img_proc: true
- pgno: 88
  md: '99%的书都是如此。人到最后要获取的是加工方法，至于材料和成品，用完可以抛掉了。抱着这条路径，读书和接收各种信息源躲累，才能跳出来。


    如果人有思想（三观成系统），理论上可以无限量•材料=成品。坐在那写观点造“成品”可以无上限。写书就会变成个体力活。


    假设老子养到现代，让他读书学习，眼前堆上几号车的书。


    老子：俺这套三观超牛X，眼前这些写手的思想运动模式都能涵盖，好吧，开始看…


    老子的三观就相当于三眼讲的“结构”，老头看一堆堆现代书就相当于“解构”。有什么样的结构，就会有相应的解构方法。所以老子读出来的东西，跟其他读者阅读结局肯定不一样。


    人们都想要锻炼“穿透表象看本质”的能力。


    错误逻辑：给 100000 个表象，然后一个个穿透看背后本质； 正确逻辑：本来就是带着“本质”（结构）去看表象的（解构）。


    事物的本质哪有那么多啊？那还不累死人？有本质，才有表象；有真相，才有假象。表象与假象可以无限多，但本质只有一个（一套三观一个）。


    用柯南的话讲：真相只有一个（在柯南的三观看来），嗯嗯，日本动漫的教育水平都比都居要高…


    这就是为何讲“少读书，多思考”的原因，也就是化繁为简、去伪存真。


    而大多数人喜欢读书，都变成了读死书，对“成品”特别看重，记在心里，表现就是一张嘴能讲出百八十个死道理，特别喜欢冠着某某“真实故事”等，大众最好这一口。'
  merge: -1
  img_proc: true
- pgno: 89
  md: '所以市面上的“老师”给人洗脑开课，最善于讲“故事”捏道理，通过“当前感受”迎合大众口味，死道理填满脑子沉甸甸…


    鬼谷子说“为小无内为大无外”，用在读书学习上，就是过于往小（死了）思考就没有什么结构了，过于往大（虚）了思考也没有结构了。


    这一点在啸子上表现最明显：

    你讲结构，人家自动报字数、抵欧冠点；

    你讲结构，人家能四个字大道理概括你。


    那好了，前面讲了 99%的书，那还有 1%呢？


    像老师这种思维力超高的人就会觉得“加工材料搞成品”很麻烦，直接讲“加工方法”。比如道德经，材料也有但少且宏大，核心部分道经讲的就是加工方法，纯意疏流。这才是好东西！直接给干货，而且系统完整，这是大善人！（善与自信成正比，与所求成反比，自信+无所求=诞生无私）。


    那还有小伙伴们还没有那种直接给“完整结构”的书，也就是从开悟、到完整硬骏辑、再到手把手实操，全面“附体”那种，想必是没有的！


    一个思想（三观）流派，是需要多人协同不断丰盈的，也需要“分工”。这个人添一点，那个人添一点，就像砌头瓦砖一样，添的都是“片段”，这需要读者把这些做点融合在一起，融汇多大，结构就多大。


    比如孔子就像拼图内核，然后其他家开始往上拼接。围绕一个“加工方法”开始多领域深加工，有操军事之道的，有政治之道，有谋略之道，有纵横之道，有管理之道等等，还有阴阳家、杂家等远而自然科学的。


    单拿出来哪一块，都不完整。但最好的入手方式，就是从“加工方法”直接入手，效率会更高。'
