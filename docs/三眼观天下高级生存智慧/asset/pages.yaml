  md: '# 为何你学的知识都没用？因为你不了解什么叫“纹化”！（正确学习观）


    > “藏器而动”


    ![](img/7db57a7e0d8c809adbec081fdf6a8e74_79_0.png)


    你所读的东西大多是没用的！


    问：

    何为有用？


    三眼答：

    能让你独立的东西，就有用；

    让你陷入其中产生依赖的东西，就没用！'
  merge: -1
