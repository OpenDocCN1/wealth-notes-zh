    开一关，这就是人生，有了这个观念，各种欲望和行为都“归位”了，人就不再烦乱。


    # 可欲


    既然谈到“欲”，最后再啰嗦点

    人打造“结构”也好，伪装与猎杀也好，心灵的净化也好，上山也好，下山也好，都围绕人的天性欲。

