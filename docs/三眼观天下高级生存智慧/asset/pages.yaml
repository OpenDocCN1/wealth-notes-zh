  md: '的逻辑，基本涵盖了人们所能接触的一切，告诉世人如何破除假象，抽离自身于幻象，自得真相。


    道德经是老子“问道”，而不是“得道”，道就如同“真相”，是不存在的，“求道”的过程就是不断地规避假象，真相会一层层浮现。


    道是这样一个东西：它创造了诸多假象来伪装自身，假象和真相都是因它而起，规避假象的过程和寻求真相的过程，都是在循道。


    佛法与道法在本质上都是教人如何开悟，只是佛家按照正路子走，道家是逆向思考。


    “求道”用在生活上，就是能够看清世间诸多假象的逻辑，知道怎么假，就距离真相更进一步。


    这对于所有人来说很公平：专业的东西可以去学，比如数学化、自然科学等等，但对于大多数人的一生来说，情绪、心灵、家庭、工作、创业、投资等等，是没有所谓专业性的，因为这些重要的东西只能去悟，而不能去学。


    绝大多数人都是浑浑噩噩一生；一小部分人是“量变到质变”，经历了很多，突然有那么一刻悟出道理，再去处理各种人生之就开明得多；极少数人是“直接质变”的，这就需要悟性了。


    比如大家以为经济是个很专业的东西，但是熟悉三眼的人知道三眼把它称作诡辩学，它是没什么专业性的，拿着数学化的公式展开悠悠大法而已，只要开了悟，政治决定经济，人性决定政治，再去看经济能看出个八九不离十；


    比如创业投资，这些东西也不是学来的吧，哪有专门的一门学科叫做创业学或者投资学啊？真要这种书籍，仔细去看讲的也都是“心法”，因为创钱这个活拼的是综合能力，归到最后比拼的是悟性，悟的是人心，所以做人做事都是联系在一起的。


    要是有专门的创钱学科，那岂不是所有人去学习，而后都发家致富了…谁被收割呢？


    教人赚钱就是大骗子，这东西是悟出来的，怎么可能学的会？'
