    # 第四卷 刘逸文


    2015-08-11yevon_ou[拜金女郎](link://)


    ### （十一）机场


    冷夜辉觉得今天所有的一切，都不在预定的轨道上。


    她刚到机场，下了汽车，就有一个穿着恭僮土著服装的少女迎了上来。“刷我地卡，姑娘你福象饱满，面泛桃花，今天一定有人用 9999 朵玫瑰向你求婚哦”。


    冷夜辉楞了一下，然后就被一堆人拥簇着进了航空公司。


    在贵宾厅里，一个皮肤黝黑的胖子，据说是他们的营运总监。非得一口咬定，冷夜辉有 5000000 航空里程没有补登。哭死哭活一定要帮她补登记上去。


    冷夜辉觉得又好气又好笑，费尽了口舌解释。可对方双手比划，用尽蹩脚的英文，将耶稣佛陀圣母玛丽亚都举出来了，就说她是他们的 VVVVIP 客户。


    机场外面的大厅传来一阵喧嚣。“轰然”她一下，似乎整个大厅都爆炸开来了。冷夜辉侧耳听去，隐隐约约听见机场广播：“尊敬的寰宇一家会员，您乘坐的……航班，由于 Overbooking，现征求自愿退票者。如果
    2 小时的下一班，经济舱补贴退票费 2 万元，头等舱补贴退票费 20 万元……”


    然后她就听见外面哗啦啦地传来排山倒海般的脚步声。一群花子蜂拥地跑了过去，海啸般的人群几乎把整到的办票窗口都压塌掉。花子们尖叫着“我要，我要，赚翻了”。比整个旅行团的团费还要多。


    冷夜辉摇了摇头，觉得今天的一切都凝聚得不真实。


    眼看起飞时间临近，冷夜辉实在拗不过这个胖子。只得让他办了一张贵宾卡。一群人恭恭敬敬地送到了门口。胖子和小妹们排成一列，低眉含什礼仪说：“姑娘你福象饱满，面泛桃花，今天一定有人用
    9999 朵玫瑰向你求婚哦”。


    冷夜辉到达机场的时间很早，可是现在却几乎最后一位登机。胖子让专车送她直接影响到跑道上，冷夜辉登上机舱，飞机过一会就匆忙忙飞翘了。


    ### （十二）万里


    A340 是著名的双通道宽体客机。当泠夜辉走进机舱时，整个头等舱空空荡荡，只坐着一位老人。


    泠夜辉向他微微鞠躬。任何时候，都不要忘记淑女的优雅与从容。


    不用看，她也知道他是谁。除了岁月的侵蚀与雕琢，他的脸简直就和子默一模一样。


    “小姑娘，来，坐我旁边。可以陪我这个老头子说会话”。


    泠夜辉静静地走了过去。扣上了保险扣。飞机在跑道上猛冲，拉起，穿过了厚厚的白云。直到三万英尺的高空。


    泠夜辉看着晚霞落下，蓝蓝的天空，一直到云层之上灯光渐稀，星和月和黑穹的领空：她闭上眼睛微微叹了口气。睫毛颤动，更像是墙角无助的小花。


    平流层上，刘父拍了拍手。立刻就有二个助理，举来了二块巨大的 85 寸玻璃。从机舱顶端的电源插口引下二路电线，悬在半空。电容器般的玻璃中间却有了影像出现。隐隐约约的，就像水彩画一样。


    “光幕电视，很成熟的技术。就是贵了一点”。


    “航空公司都不赚钱”老人打破了沉闷，“因为欧美的上流社会很喜欢买一家私属航空公司。他们觉得这样信有面子”。


    “名与利，永远绕不过去的话题”。


    “很抱歉，让您亏钱了”。


    “哦，你是说老何的事”。


    刘父拿过眼前的橙汁，加了二块冰块。“任何商业机构，都不会依仗单一的经销伙伴。因为这意味着巨大的风险”。


    “而且生意是相对的。他在帮我赚钱的同时，我也在帮他赚钱”。


    “老何如果有能力提高叫价的话，他早就说出来了。他如果有能力伤害刘氏的话，那他每年至少会从我这多要走 5000W”。


    “杀敌八千，自损一万”刘父突然俏皮地和泠夜辉说道，“老何这会是一个麻烦，但绝对不是灾难”。


    “您是怎么找到我的”。


    “酒店的车都装有 GPS，你一打电话退房，我就知道了”。


    “还是说说你们吧。你是怎么确定子默的行程的”。


    “有钱人你用心去找，总还是能找到他们接触的。譬如赛车，上海就是天马。韩寒也在那里”。


    “你想打高尔夫的话，就是佘山高尔夫”。


    “在北京的话，就是马会”。


    “我知道子默预定了去从化看马。有二匹澳洲纯血马据说很不错”。


    刘父赞赏地看了她一眼，“那你怎么知道具体航班的呢。航空公司，还是 Lounge 贵宾厅”。


    “Lounge 贵宾厅，我不能和伯父比资源。那些小女生工资都很低的，有 27 万的柜台人员只有 1500 元底薪。我很容易就和她们交上了朋友”。


    “事实上，我 12 小时都在机场。一直等 Lounge 给我消息了，再买票入场”。


    “專業的类型，是我看了他在马会吃饭的餐牌”。


    “赛车，滑板，游泳，是你之后学的”刘父补充说。


    “不错，都挺好的。佳偶天成啊”刘父由衷地满意地说。


    “可是，你为什么要走呢”。


    “因为我不爱他丁”。


    刘父的指尖在屏幕上扫过。那是一幅幅的照片和资料，是何以玫准备的那本小册子。


    “在您的面前，我不敢隐瞒”，泠夜辉是聪明人，此时此刻，说真话无疑是最好的选择。


    “其实我靠近于默，完全是一个局。是一个精心安排的计划。我是冲着他的钱去的，所谓的飙车牛排打游戏，完全都是装出来的爱好”。


    “真实的我，并不是于默想象的那个样子。我并不是和他参齿般配的那个人。其实我，就是一个曲意伪装魅惑狐疑男人的狐狸精”。


    “哦”，


    泠夜辉脸一红，看着自己的 Chanel 说，“呃，这些是靠我自己的力量赚来的”。


    “我，抄楼”。


    “抄楼啊，很高尚的职业”。


    泠夜辉眼睛亮了一亮。


    “因此，你知道了于默在业内的声名。才决定要将他作猎物么”。


    “是的。当我决定开始时，我甚至都不知道他长什么样子，是什么性格，是怎样的人”。


    “在我的眼中，他就是一个猎物，是被我捕获，俘虏，吞噬的。我是坏人，吃人不吐骨头”。


    空乘这时候进来，弯着腰，偷偷换去他们二杯橙汁，再换成适温的雀舌。热饮总是要比冷饮对身体好。


    “哦，很好呀。为什么不做下去呢”。


    “您说笑话了。子默是一个很阳光的人，不该和我的黑暗捆绑在一起。我想做一个坏人。变坏。．，能给我力量”。


    “小狸同志啊，这就是你的不对了”。刘父气愤地说。


    “做狐狸精就该做到底。怎么可以中途搁挑子呢。你这也太没有职业道德了”。


    泠夜辉傻了。


    “做一行就要爱一行，认认真真去做，做到出类拔萃。持之以恒，精益求精。发前人所不能，竖万世之标榜。""


    “狐狸精这么优秀的职业，你该好好珍惜。千万不能学邓文迪，她要是多撑几年，撑到老默喝屁了，绝对就是传奇啊”。刘父唠唠叨叨地说着，说他在东南亚有多少朋友，咕噜着现在的年轻人怎么这么没有敬业精神。


    “女人不值钱”。


    “同意”。


    “感情才值钱。凭子默的条件，外面的女人大把”。


    “同意”。


    “你知道我老头子活了几十年，这辈子遇见过几个狐狸精，几个职业狐狸精”。


    “零个，一个也没有”。刘父的眼神之中，充满了落寞。


    “现在的女人都怎么了，中华民族的传统美德一个都没流传下来。破“四旧”都给破光了”。


    “聊斋志异的黄金时代，一去不再复返”。


    “你以为做狐狸精很容易么。狐狸精这一个传说中的职业，属于“听说过，没见过”。每个人都在传闻听说，可是从来没一个人亲眼见过”。


    “狐狸精之稀缺，之稀少，简直比职业炒（楼）家还要少。这样的濒危动物再不保护，地球上就要灭绝了”。


    老头子抬起头，脸上老泪纵横。“子默这辈子能遇上一个狐狸精，真是祖宗积德”。


    “你想要什么，用自己的力量去争取。这很好，非常道德。“


    “我族虽然有一点金钱，可是获得的幸福，和金钱完全不成正比”。


    “你想要什么，如果你想要财富的话，二家之间没有矛盾。完全可以优势互补”。


    “天造之和，佳偶天成”。


    “李治为什么要找婚姻。后宫佳丽三千，可还是抵不上一个姻缘。一个完全成全热杂女人所具有的魅力”。


    “姻缘想要整个帝国，那就给她好了。你以为李治真在乎整个帝国么”。


    “你，就是我选中的儿媳妇。最理想的儿媳妇，我会倾尽全部的力量支持你，在所有人的面前支持你”。


    “可是我并不爱子默。我对他完全就是虚伪假意，不能违背自己内心的感受”。


    “狐狸精第二定律，真爱”。


    “哪怕你没有爱意，请你装出真爱。哪怕你不能坚持一生一世，装尽量长的时间也好”。


    “每一寸共度，都是幸运”。


    默多克会不懂中文么，人家手下几万个拍马屁的狗仔队。可他这辈子只遇见过一个狐狸精。他自然要捧着脸，快乐得年龄倒长。


    “许多人可以花一辈子的时间来上班，将一份枯燥无聊的工作每天做八小时。可是他们却不能每天花八小时来经营感情”。


    刘父摇了摇头，“打工上班，这是巨大的负劳动。把你的一生都毁了”。


    “我刘某人的儿媳妇，当然不需要象某些媚妇白领一样，每天上八小时班，然后把公司里受的怒气疲意，都发泄在子默身上，为了一点琐事给他脸色”。


    “也不是每天八小时尽情玩耍，做社交名媛”。


    “你的工作，就是每天尽情发泄，把脾气怒气都发泄在别的售货员身上。然后每天 8 小时，专职哄子默开心。全心全意呵护他的感受”。


    “上班可以敬业，做狐狸精更可以敬业”。


    “好好做你狐狸精这份大有前途的工作，三百六十行，职业无贵贱。稀缺才是尊贵，白领上班才是贱途”。


    泠夜辉有点迟疑，“你的意思是，即使我不喜欢子默。我也可以和他过一生”？


    空乘又偷偷进来，递上二条热毛巾。头等舱服务真不错。


    “你会喜欢他的。因为你尊重金钱。并且靠自己的力量去争取”。


    “尊重金钱的人，你就一定会喜欢子默的。因为在他的身上，也有相同的品质。而且，子默象我，长得也不丑………”


    “可我还是不能答应您。我是坏人，专干坏事的。我已经立下誓言”。


    “纯粹一份工作么，别考虑那么多的。来，签了这份劳动合同，哈”。


    无人管理，屏幕上的 PPT 一页一页向后翻着。冷夜辉的身体突然颤抖了起来，无可控制的从眼角到眉梢全身发抖。嘴唇发紫，缺氧般的抓住了把手。


    屏幕上跳到了最后一页。那并不是何以玖小册子上的，而是传来的最后一页。


    那是一张婚纱发票清单。


    ### （十三）玫瑰


    “您，全部都知道了”。


    “哦，银卡会员，享受 85 折优惠”。刘父嘀咕着。“说实话，我在不明白 VERA WANG 之类商品模式是怎么想的。搞什么积分制嘛。真不知道他们的市场营销都是什么脑子”。


    “这事是子默去处理的。电脑记录已经被全部抹掉，当事人被收买。再不会有任何破绽”。


    “子默………………”


    “年轻人做事，总是不够炉火纯青。天底下哪有藏得住的秘密。我已经让人去把锅底揭开。宾友们预先都知道的比较好”。


    “子默，我想他是关心我吧”


    “没事，没事，不经历人造，怎么做孩子他妈”。


    “是您告诉子默的么”。


    “不，我才不会管这些事。是子默自己发现的”。


    “子默是一个很谨慎的人，他不管去哪里出差，永远只带 9 张名片。他总是说，超过了这个数字，就不值得他结交”。


    “所以子默根本就没有丢失过名片”。


    “是的，没有。一张都没有”。


    “而老王手里的那张名片是真的”。


    “子默稍微查一下，问一下，最近和哪些人有接触。很多事只要你预先有了准备，都不难查问出来”。


    “之后子默…………”


    “他喜欢你，就这么简单”。


    冷夜辉笑了起来，就好像一个长途鏖战的将军，终于获得了胜利。


    空乘又俯身跑了进来，半跪着，收走了冷掉的绿茶。换上了牛乳白的玫瑰蛋糕。娇艳鲜红的玫瑰花瓣，仿佛还滴着露水。


    “可我还是不爱他。我不爱他，这是底线。我是魔女哎，魔女是没有心的”。


    “不爱就不爱，随便你们”，刘父已经被年轻人的感情戏搞昏了头脑。


    “可你总要给子默一个机会吧，我说过会全力支持你。你总要给老头子一个露脸的面子”。


    “那你就期待奇迹吧”。冷夜辉看着手里繁复花饰的蛋糕糕，若有所悟。


    “如果我能收到 9999 朵玫瑰，就是现在，就在这里，在这 30000 英尺的高空上，Now，我现在就要么。那我就嫁给子默”。


    半跪的空乘站了起来，撤掉帽子，拉开窗帘，做了一个手势。头等舱与中舱之间鼓起了强烈的强风，就像是气压失衡。


    然后，就是无穷无尽的花瓣漂浮了起来，飞了进来，象大河汇进了海川，将头等舱灌成了玫瑰的海洋。


