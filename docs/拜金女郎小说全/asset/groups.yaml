    “这个狐狸精，迟早把她的尾巴揪出来”。何以玫愤愤不平地想着。眼看牌桌对面，刘子默捏着冷夜辉的手，冷夜辉整个身子都快要倚靠上去了。斜斜地躺在他的怀里。他轻轻闻着她的发际，露出陶醉的笑容。


    “白痴”，她甩下了一个A一个K，“Black Jack通杀”。


    冷夜辉举起了面前的干邑，重重地喝了一口。刘子默似乎想要趁机亲她，却被她机巧地躲开了。而过了一会，她却悄悄倚靠在子默背上，看着他的牌，往他的耳朵里吹气。


    “狐狸精，八百年道行的老狐狸”。何以玫觉得自己快要气炸了。


    “子默哥哥，我记得你以前说过。在认识GF的第一百天，要送她礼物”。


    “嗯，是有这个说法”。


    “越是珍贵的人，礼物越要贵重。对么”。。


    “不错”


    “前一阵子，郭哥送了他媳妇一套海滨别墅。有这事吧。冷小姐对你更重要，那礼物一定也更贵重吧”。


    刘子默脸色微变，刚想申辩几句。冷夜辉却突然醒了。干邑的威力出现了回光返照般的退潮。


    “嗯，我要礼物”她很认真地说。


