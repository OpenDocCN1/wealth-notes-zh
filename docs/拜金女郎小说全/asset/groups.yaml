    # 第一卷 泠夜辉


    2015-08-11yevon_ou 拜金女郎


    ![](img/ec7ac78432c144336e940619f4164e25_7_0.png)


    水库论坛


    ![](img/ec7ac78432c144336e940619f4164e25_7_1.png)


    欧神文集（纸质版）


    # 第一卷 泠夜辉


    # （一）天空


    刘子默把眼罩又移了移，耳塞用力地插紧了一点。叹了口气，在心中默默地念数着：“1001，1002，1003，1005”


    “哦，哦，哦，哇……”，果然符合节奏。三短一长，伴随着三声铺垫，高潮迎面而来。小孩子宛如排出了肺部所有的空气，尖叫了一声，用120分贝的割裂式风刀，大声地呼啸了“啊，啊，啊，啊，哇……”


    刘子默翻了个身，用双手捂住耳朵。再次对中华航空的服务表示了极度的不满。头等舱的机票是经济舱三倍价格。可是依然抵不住熊孩子的折腾。


    从飞机起飞拒绝扣上保险带，小孩子就开始干嚎。到现在已经两个多小时了，丝毫没有衰竭的迹象。刘子默已经打过三次灯了，要求乘务员管一管小孩。至少管一管小孩的父母，如果他们实在再吵，至少可以把他们踢到后面的经济舱去。


    可是中华航空的服务实在太烂，制服空乘非得说每一个旅客都是他们最尊贵的客人，得罪谁也不能得罪客人。'
  - '[PAGE 8]


    “难道我便不是客人了么”，刘子默愤愤不平地爬了起来。翻了背包，希望能找到块巧克力之类的去贿赂小孩。虽然一小时前隔壁叔叔尝试，熊孩儿的妈已经明确表示不能让她的小孩
    吃来历不明的食物。那就顺势自己吃掉也好。


    “小姐，给我加二块冰”。隔壁座位传来保险扣咔哒解锁的声音。


    空乘急急忙忙跑过来，拿了冰桶，半蹲下“对不起，对不起，给您添麻烦了”。


    隔壁一女跑捡起水杯，晃了二下。晶莹的冰块在里面承载起伏，反射出银白色的光芒。 她走到前排座位，对着熊孩子，把整杯水倒了下去。从熊孩儿的脸上，脖子上，衣服上。一
    直到抱着他的母亲手上，膝盖上，裙子上，高跟鞋上。二块冰块翻然而落，一块砸在熊孩儿 的肩窝，一块被反弹了起来，进了他母亲的衣领。


    熊孩儿的哭闹声戛然而止。他被冰水下傻了。


    他母亲也吓傻了。


    刘子默吓傻了。


    空乘吓傻了。


    整个机舱里的人都吓傻了。


    熊孩子的母亲愣了足足三秒。然后发出了一声足以干扰雷达的高声波。她手忙脚乱地翻出自 己的小包，拎起熊孩子，重重地被保险带拉回了座椅。


    然后啪嗒啪嗒试了三次才把保险和解开，弯腰在地上捡起了三支口红，又再次弯腰捡起三支 眉笔。然后以火球术的速度跃进丁厕所，“哐地一下拉上了门。


    “小姐，我想你欠一个解释”。空乘们和机务长围了上来。


    女郎转过了身，难以掩饰她眼中的厌恶之情。难怪说中国人是劣等民族，一群内战内行，外 战外行。


    “要什么解释，等她出来了，让她自己来找我好了”。


    空乘和机务觉得有理，也就渐渐散开了。


    “她没有一个小时根本出不来”。


    “等她出来了，气也散了”。


    刘子默探过头去，偷偷搭讪了二句。直到这时，他才有空仔细好好观察身边坐了二个小时的 旅伴。


    她有一头长长的头发，随意散落在肩膀上。理得很顺，洗得很干净，传达出一股淡淡的皂角 的味道。


    她的眼睛很大，皮肤不是很白，却也不黑。鼻翼小小，嘴唇上没有涂口红，却泛着一股健康 的天然红色。


    穿着一件深紫色小v领，腿型很细，长根丝袜。下面是3cm的鞋。五指露在外面象青葱一样， 刘子默观察到她没有戴任何的戒指。


    “女孩子下巴微微扬起，很漂亮”


    “谢谢，‘30度仰角’，我读过她的书”。


    “你去花城么”。


    “嗯，有个朋友的地产项目。让我去看看，帮他参谋”。


    眼见女郎拿出了 iPad，开始干自己的事。刘子默也不好意思，把自己面前的 A4纸收拾整理 了一下。架起了眼罩，又开始睡了。'
  - '[PAGE 9]


    也不知道过了多久，刘子默半梦半醒之间，隐隐约约听见乒乒乓乓的声音。这个音量并不大，也不足以影响到他。可是这声音是如此地熟悉，就象有条小虫虫在他内心壕沟里爬来爬去，痒得他难受，痒得他无法入睡。


    刘子默翻了个身，再翻了个身。最终还是忍不住，一把扯掉了眼罩。


    然后他就看到了Auralux。


    女郎手里捧着 iPad，瞪大着眼睛。这样让她的眼睛看起来更大了。


    刘子默一眼就认出了这一关是Rack。当年他在这一关卡了好久，这音乐实在是太熟悉不过了。


    “这一关的通关秘诀是”，刘子默心中默念到。但他绝对不会说出来，大家萍水相逢，男人要学会沉默。


    Insane 难度是很难的。女郎连续失败了二次。但刘子默知道，她已经找到了正确的打法。多试二次就通关了。


    “很聪明的女人”。他心中评价说。


    飞机轰然落地。


    一下飞机，女郎提起行李就走了。刘子默慢吞吞地把行李毯子收拾好，跟在人群后面慢慢走出了甬道。反正再快你也是要等行李。


    人潮汹涌而出，又向二边散开。就像水浪拍上礁石，露出了中间的女郎。她的身材修长，脖颈光滑，远远望着就像是一只仙鹤。


    “怎么又是她”，刘子默从边缘走过。隐隐觉得眼睛有点刺痛，这幅景象挥之不去。


    “啪”的一下，二人几乎同时伸出了手。又撞到了一块，谁也没有拿到包。


    “那是我的包”。二人几乎同时说着。刘子默露出了微笑。


    “可以帮我取下箱子么，红色的那个，那是我的包”。


    刘子默赶紧往前跑了几步。挤开了人群。取回了红色箱子。至于自己的箱子，再转一圈好了。


    “泠夜辉”，铭牌上写着名字。


    奇怪的是，并没有电话号码。


    # （二）新域


    “东域晶华”是珠江新域最近新开的大型楼盘。南望珠江，北望花园。距离天河商务区仅一步之遥。最近正在吸纳认筹。刘子默到达的那天，正是人山人海。


    不过他不急，照例可以把车停在 KFS 划出的内部车位。离售楼处又近，走路步行过去即可。


    不过今天却小有麻烦，他惯用的车位被一辆红色 Corolla 占据了。被迫兜了一个圈子才能停下。


    走到售楼处里面，和狐朋狗友聊了一下。好友其实想拉他入伙投资，一起有 4F 裙楼的几个铺子。可以做餐饮。


    “我们这的好处，是可以有赠购面积”。好友拍着胸脯说。四楼虽然名义上只有半个楼面，但是如果你把二间铺都买下，就能独占楼梯和走道。


    “后面整个屋顶花园和三樘大型灯箱都是你的”。狗党继续吹嘘说。“光一个外立面灯箱就可以价值 100W 了”。


    “还有这里秘中这谜。你看这个绿地走道，说是走廊，我们都修了二墙 15 米*3 米的单层墙”。


    “为什么，你懂的呀。验收一交房，你加个屋顶，立即就是多个餐厅”。


    这就是专业与非专业的区别。你永远可以拿到最好的内部价铺子。[1]'
  - '[PAGE 10]


    “项目是不错，可是我们已经见多了六折笋。光六折笋已经引不起我们的兴趣了”。


    刘子默走下会议室，表示要再考虑。恍惚间，他似乎又见到了人影一闪。摇了摇头，昨天飞机上没睡好，不要幻听了。


    走出售楼处，走到门口停车场时。


    他看见那辆红色 Corolla 车灯闪烁，远处有个人拿着汽车钥匙，拎着一个紫红色包包，戴着太阳眼镜，一头乌黑的长发。


    他叹了口气，往下走了几阶台阶。门口老王屁颠屁颠地跑了过来。


    “默认”，他抽出一叠纸币，随手递了张一美金过去。


    老王笑得更欢了，眼神闪炼。“您和您的朋友一起来看房子的呵。可少见呢”。


    “今天早上您朋友来了，拿着您的名片。我就把您的车位给他停了”。


    刘子默转身过去，寒着脸说：“冷夜辉，我想你欠我一个解释”。


    冷夜辉的牙齿很白很整齐，她笑的时候就会露出第六颗牙齿。


    “那天我在飞机地板上捡到一张名片”。


    “我看见了你桌面上的 PPT”。


    “我想，既然文案上写得这么有吸引力，就过来看看也不错”。


    冷夜辉笑得狡猾狡猾的，双手交叉剪在背后。扭头扭去就象一只小狐狸。她笑的时候鼻尖皱了起来，左脸额有一个小酒窝。


    刘子默走近了前去，双手举了起来，箕开五指，做出大灰熊的样子，“吼…………”


    “想不想知道最后一关 Talons 的过关方法”。


    女郎猛地瞪大了眼睛，“你，你怎么知道我卡…………”


    “二沙岛，三围。如果你能追到我，就告诉你通关的方法。今天的事也算一笔勾销”。


    “好的。不过我最终要停在 31 号的门口”。


    刘子默拿出了地图，查了一下#31 幢的位置。和冷夜辉碰了一下拳头，“成交”。


    半个小时以后，刘子默和冷夜辉并排坐在 31 号的门前。


    昔日衣冠楚楚的刘子默，现在已经剥掉了西装，解开了衬衫前二粒纽扣。正拿了一瓶水往喉咙里倒。


    “开赛车还真是太累、累累啊”。


    “嗯，精神集中”。冷夜辉的状态比他好不了多少。


    “没想到女人开车这么猛”。


    “你启动的时候好厉害，我反应没你快”。


    “最后还是你赢了。我找 31 号耽搁了不少时间”。


    冷夜辉跳了起来，大声地敲击着别墅的门。“荷姑，开门开门”。


    巨大的客厅落地六米。斜斜的阳光透射进来，穿过蔓纱，被分割成一缕一缕。


    屋内似乎弥漫着香气，空调已经开到了十足。冷到想盖被子的地步。


    “快把西装穿起来。你这样会容易着凉”。


    “你怎么知道我怕热。你怎么知道我喜欢盖被子开空调”。


    “你呀，你就是个蒸笼头”。“睡觉的时候又打呼又磨牙”。


    冷夜辉咯咯咯咯笑着。欢快得就象只百灵鸟。她不知道从哪里变出一支魔杖，又找了二个恶魔角戴在了头上。'
  - '[PAGE 11]


    “姐姐什么都知道”，她挥舞着魔杖，裙子似云朵一样飘舞了起来。“魔法，赐予我力量吧”。整间屋子空空荡荡的。寂静得只剩烤阳光味。可随着小魔女一声令下，一道道热气腾腾的粤菜却递了上来。三菜一汤。


    刘子默吃了一口清炒虾仁，差点把舌头吞了下去。又喝了一口海螺汤，眯着眼睛闷了半响。冷夜辉只是静静地看着他，也不催促。过了好一会，刘子默才长长地吐了一口气。“海螺汤最重要的是温度，你怎么做到的”。


    冷夜辉卷起一缕长发，手指卷啊卷的然后再放掉。这样头发就被卷成了螺旋形，一弹一弹地晃悠在胸前：“用心呗，只要花心思都可以做到的”。


    # （三）夜场


    “兄弟啊，我看你最近状态不正常”。灯光晦暗，音乐震耳欲聋，郭淳摇晃着酒杯说道。

    “你也发现了”。


    刘子默抬头看看在外厢挪挪的冷夜辉，无奈地说。“她真是一个天才”。


    “前一阵子我和她说，我们这最流行的牌木是大怪路子红心五”。


    “她今天牵了你复板Q：9”


    “我前天才教会她牌子和精拳”。


    郭淳瞄了一眼门外的冷夜辉，她正熟练地把骰盅一甩，六粒骰子飞出了台几。然后她的骰盅早就守在那里，飞行的骰子一粒不落汇入盅中。冷夜辉把骰盅往桌上一扣，大喝一声“杀”。郭淳同情地拍着刘子默的肩，“兄弟，输给女人那不叫输。有空我多剪几张纸条。贴你脸上”。


    刘子默不答，继续愁眉苦脸的说：“我喜欢金庸和古龙的小说”。


    “她全懂？”


    “不说全懂。至少能接话。说起程灵素的那段眼泪汪汪”。


    “基督山伯爵，盗墓笔记”。


    “全懂”。


    “COC 和海岛奇兵”


    “全懂”。


    “你不知道吧，当初我们就是打 Auraulux 认识的。这是一个很冷门的游戏”。


    “高智商的电影，少数派报告，明日边缘”。


    “全懂”


    “低智商电影，北京爱情故事，全城热恋”


    “全懂”


    “志明与春娇”


    “这事就奇了。这么小众的电影她居然全懂。这是我在 Gewara 账号里唯一打五星的。我觉得几乎我看过的每一部电影她都知道”。


    “这不是挺好的，绝配啊”。'
  - '[PAGE 12]


    “看过基普山伯爵么”。


    “你是说电影版么”。


    “切，就说你家伙不读书”。


    “在第一卷的末尾，主人公要和梅尔塞丝结婚的时候。他想着，幸福宛如重童魔宫中深埋的宝藏。要经过魔龙和火焰的考验才能争到手。而他，竟然能这么容易地和梅尔塞丝结婚，这让他感到巨大的不安，深深的危险与惶恐”。


    “我，就是觉得好得不真实”。


    郭淳伸出手，摸摸刘子默的额头，再掰开眼睛仔细看了看瞳孔。


    “你对珠江新城的项目怎么看”。


    “广州没前途”。


    “哦，怎么说”。


    “广州已经充分证明了，广州没戏”。


    “2015 年这一轮，深圳累计涨了有 50%，而广州几乎没动。我们知道，财富源自于北京。就象一滴水，水波荡漾而延伸到第二圈，第三圈”。


    “深圳是钱的出口，广州不是。这一轮行情，充分证明了深圳直通北京。神创板，私募基金，深圳几乎是药效反应最强烈的部分。而广州纹丝不动”。


    “广州已经充分证明了他只是一个二线城市。远离中央不得宠。以后去和武汉、郑州竞争去吧。中国只有北上深，没有北上广深”。


    郭淳大笑，猛地拍了一下刘子默的背脊。 “我看你正常极了，智商完全没问题”。


    “你这只是婚前恐惧症，快去吧。以玫已经快要哭了”。


    # （四）脖局


    刘子默跑到大厅里，外面正在玩二十一点。冷夜辉的面前放着三个空酒杯，脸红得像潮水一样。从脖子到眼睛全都是水汪汪的。


    刘子默凑上去，亲了一口。冷夜辉却扭过了头，害羞地往后缩着。长长的头发垂了下来，遮住了脸腮。刘子默只隔着头发，稍微碰了一下她的脸蛋。


    小伙伴们传来一阵嘘的声音。大伙起哄着，各种阴阳怪气都有。刘子默找了个位置坐下，却顺手扯过了冷夜辉的桌凳，放在了自己手中。冷夜辉脸一红，偷偷地把手抽了回去。


    刘子默攥了过去，找到了她的手腕，双手合十牢牢握在掌中，于是便再也挣脱不了。


    “我们抓脖” 冷夜辉轻轻地喊道，吐气如兰芬芳。刘子默侧头看去，她的脸离他只有 6cm，或许凑过去可以亲到她的唇。哪怕挨一记耳光也是值了。


    “夜辉，我想闻闻你的鼻息”。这句话在心中盘旋了许久。却一直说不出口，刘子默默默地痴了。


    “子默十六点，要踢么”。，小伙伴们快被这对好夫淫妇气疯了，不停地催促快点。


    “子默，子默”。


    刘子默一抬头，就看见了何以玫的眼睛。


    何以玫是他的发小。因为生意上的往来，何刘二家很早就是世交。何氏夫妇整天带着小以玫往他们家里跑。可以说从小看着她长大的。


    何以玫比他小三岁，最近去英国读书刚回来不久。父母几次约了他们见面，总因为种种原因始终没聚上一会。'
