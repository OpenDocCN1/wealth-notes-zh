    “我有很多办法哄女孩子开心”。

    刘子默叹了口气说，“但我永远无法哄自己开心”。

    “不管我设计多么精巧，多么复杂的局，这都是哄别人开心”。

    “而在这些事的背后，则是计划与衡量。筹划与准备，以及无穷无尽的操心”。

    “哄女人15分钟，我可能要准备一个星期”。

    “所以人不可能布置一些场景哄自己开心”，泠夜晖补充说。

    “对，如果我自己，我宁愿天天宅在家里，什么事也不做”。

    人不可能哄自己快乐。而我如果想获取幸福，我得找一个人，她关心我，爱护我。会帮我每天换挺好的T恤，从此以后袜子再也不会有破洞。偷偷在我的包里塞三明治，让我能放心地开始喝酒。

    他抬起头，凝视着她，“我想要爱情，纯粹的爱情”。

    泠夜晖又喝了口酒，眼睛更湿润了。刚才还算正常的她，此刻却癫狂了起来。

    “爱情，爱情是什么。居然还有人相信爱情。拿这种骗小女生的话，你以为我会信什么”。

    “世界上的女人那么多，你干嘛选我啊。干嘛不选十七八岁的小萝莉”。

    “你这个大色狼，你上次骗老娘一双袜子还没有还给我呢”。

    “什么，你想让我爱你。开什么玩笑，我可是魔女，魔女呀”。她不知哪儿又变出了一对恶魔角戴在了头上。“魔女，是没有心的”。

    泠夜晖跌坐在地上，摸着自己的心口。喃喃说“魔女，是没有心的”。

    她的嘴角突然又勾起一丝讥笑，把酒瓶重重地扔出去。随手操起地上一把巨大的水枪，“说，说实话，否则姐姐一枪崩了你”。

    刘子默一身白衣，在海风的吹拂下哧哧作响。泠夜辉紧张得耍命，就看他一步步靠近来了。

    “傻瓜，其实我是骗你的”。他几乎咬着她的耳垂在她耳边轻轻说。“我选你的原因……”

    “颜值，关键是颜值啊！！”

    “啪”地一声，泠夜辉实在过于紧张，以至于扣动了水枪的扳机。水枪斜斜地全部射在了刘子默的颈下，又反弹到她的脸上。铺天盖地的水幕遮住了她的眼睛，她尖叫着往后退去，被龙骨绊倒，跌倒着摔下船舷。刘子默牵着她的手，赶紧俯出身去拉她。两个人重重压在同一个方向，船噗嗤地一下“翻了”。

    浮载沉沉，餐盒、水枪、电话，音箱，烟筒，糖浆纷纷掉入了水中。刘子默大惊，赶紧用力捏住了泠夜辉的手。而她却反之缠绕了上来，似八爪鱼一般紧紧将他缠绕。双手搂住他的脖颈，双脚盘在他的腰上。

    这是他和她最接近的时刻，刘子默心中却感到深深的恐惧。因为他双手双脚都被她牢牢地箍住。二人就此向深深的海底坠去。

    第二卷完'
