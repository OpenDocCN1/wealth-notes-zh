    > 我也不知道该说些什么


    刘子默脑子里塞满了乱七八糟的念头。此时此景此刻，他当然知道最该要干的什么。可是没等他伸手过去，冷夜辉却突然哭了起来。


    她挥舞着粉拳，雨点般地洒落在他的身上。“为什么，为什么，为什么，为什么你要这样对我……5……”


    “555555……”


    刘子默只能什么事也不做，只能任由她的粉拳重重地捶打在身上。他只能尽全力地抱着她，尽力把她笼在双臂之间。


    “傻妞啊”。他无奈地想着。


    也不知过了多久，直到远处有手电筒灯光传来。“刘先生，刘先生”，他才轻轻地抬起冷夜辉的手。“大提琴师要回家了，我们得往回走了”。


    ## （六）梅子


    一百天快到了，小伙伴们又一次聚集在了一起。郭淳比以前更胖了，何以玫却瘦了好多。


    “咦，这次怎么不选夜场之地，反而跑到大梅沙海滩上来了”


    “夜辉喜静。她其实一个很喜欢宁静的人，不喜欢太高的分贝”


    “没看出来嘛。她上次可不是这样，掷骰子可厉害”


    “就是，还有喝酒。战斗力加倍”


    刘子默脸上露出了笑容。“这是在一个很宁静，很宁静的地方，我观察她告诉我的”


    “而且夜辉的脚也不适合高跟鞋。所以我特意选了沙滩，好让她舒服一点”


    “又吹牛。我们每次见到夜辉，她都是笔挺笔挺的。什么时候你这么怜香惜玉了”。刘子默笑而不语，像他这种人，自然不会庸俗地在意别人怎么看法。


    晚餐是在海水里吃的。大家把长桌扛到了浅海，双脚泡在冰凉的海水中。有时候拍打两下水花，引来对桌女生的阵阵尖叫。


    刘子默笑着端来两大盘比萨，“知道为什么不能在沙滩上吃比萨么”，郭淳故弄玄虚地说道。


    “因为风会把沙子吹到餐盘里去”，大伙异口同声地答道。看来每一个人都是吃货。


    “哥，你是不是不吃黑橄榄和酸黄瓜的么”，何以玫生气地剥着盒子。

    刘子默楞了一下，“夜辉喜欢吃，所以最近就多放了一些”。


    “夜辉，夜辉，当年是谁兴高采烈地说，说终于找到了一个人，只爱吃牛排。西餐除了牛排都是垃圾”。


    “你看看你现在，芝士也上了，纳豆也上了，还有Fusilli和薯饼。哥你简直是堕落啊”。

    刘子默略显尴尬，“其实酸黄瓜也是好吃的。我只是不喜欢吃，不是不吃”。


    冷夜辉一直坐在刘子默的身后，就像躲在他侧影里的一只小白兔。此时探出身来，夹了一块烤鱼，剔除了骨头，塞在刘子默嘴中。


    刘子默怜惜地摸了摸她的长发，冷夜辉摇了摇头，轻轻闭上眼睛。拉着他的手，抚入怀里，倚靠在了刘子默的身上。


    刘子默爱吃水果，尤其爱吃草莓和杨梅。冷夜辉来了以后，多了女主人，四季鲜果就没有断过。目前刘子默面前放了满满一盆，堆得像小山一样。此时临近六月下旬，杨梅已接近落市。却还是被她费尽心机找了过来，一个个又大又圆。


    刘子默拿过一个樱桃，剥去根茎，塞在了冷夜辉嘴里。过了一阵子又体贴地接回果核。随手又拿过一个大杨梅，冷夜辉却是怕酸，摇着头说是不吃。刘子默拿着杨梅在她口鼻处晃来晃去，逗着她。轻轻在她耳边说「我想吃你的口水」。


    冷夜辉脸红了起来，却把唇凑了过来。轻轻地啄住了杨梅，留下了唇印。却是不吃，侧过头美目凝视着他。刘子默接过杨梅，不由得痴了。


    “哥，我不许你吃”。何以玫气急败坏地叫到。


    刘子默的手向下滑了两码，从肩膀滑到了腰际。“小妹，一个贵族最重要的品质，就是永远不要干涉别人”。


    何以玫大怒，拾起了手中塑料叉子，一叉子飞刀扔了过来。刘子默赶紧侧了下身，把冷夜辉掩在胸前。飞叉从头顶上飞了过去。


    何以玫站起身来，翻转餐盘，把盘子里的食物统统扔到了海里。她竖着食指，直指着说：

    “哥，这个女人是个狐狸精，她没安好心”。


    “你别看她现在娇滴滴的样子，她全是骗你的。虚情假意”。


    “我现在手里没有证据，但总有一天，我会拆穿她的”。


    “哥你不要被她蒙昏了头。我才是真正关心你的人”。


    何以玫愤怒地涉水而去。踢起的水花向两边飞溅着。还有吃了一口的比萨和意面，挥舞着红色番茄酱的航海手海上漂浮着。


    当她走过冷夜辉身边时，只听见冷夜辉冷冷地说了一声：“真是不讲卫生”。于是她益发愤怒，想将手中两块海石抛过去，却发现冷夜辉已经躺到刘子默膝盖上。


    “城狐社鼠”她咋了一口，“迟早剥你皮”。


    深圳的夜晚来得很晚，一直到夜里八点，天色渐渐泛出锦缎的落辉色，而海水却已悄悄开始凉了。


    冷夜辉回头望去，不知道何时，整桌人已经散得干干净净。只剩下她和刘子默的手掌还握在一起。


    更奇葩的是，沙滩上本来是人山人海，玩沙滩车的，玩香蕉船的，还有数不清的人在游泳。现在却像是突然人间蒸发。静得可怕，整个沙滩，一眨眼只剩下她和刘子默两个人。


    在他们身后，原本上岸的地方，竖起了八根柱子。顶上缠着火绒布。冷夜辉捏了捏手，刘子默还在她的手中。能感受到他的体温温暖。这让她感到安心。于是也就不再害怕了。


    “嘭”地一下，一根火柱突然冒出了火星，开始燃烧了起来。冷夜辉吓了一跳，很快八根柱子都被点燃。天色却暗黑了下来。只在弧形火炬中间形成了一个光的舞台。预埋在沙中的音响响了起来，摩莎摩莎，放的是
    “Kiss the rain”.


    ![](img/ec7ac78432c144336e940619f4164e25_18_0.png)


    刘子默走到了舞台中间。


    “在深圳买套别墅很贵，滨海别墅动辄十万。上档次的一套在三千万至五千万之间。

    但是酒店业的估值，并不按照如此规则。而是根据盈利，市盈率，客户基础，加盟品牌之类综合考虑。

    这间酒店含一百五十个客房，带自己的冰池会所，二间别墅型总统套房，三百米私属沙滩。不贵，比我想象中的便宜。当能引进基金财务投资者，杠杆收购之时，就更是便宜得吓人”。


    刘子默单膝跪了下来，“囡囡，我把这片沙滩送给你”。


    ## （七）沉舟


    还是这片海，还是这片水，明月，清风，大江。


    一叶扁舟，两个人，一叠生鱼片。


    “你们男人是不是都喜欢做口惠不至的事”。


    “哦”


    冷夜辉躺在斜椅上，眼神却突然变得极度的不屑与不肖。“你说是会待我好，可我似乎什么也没捞到”。


    “你说是送一片沙滩给我，可事实却是和旅客分享的。而且我一年也难得来上几回，也不知道到底是我的还是别人的”。


    刘子默笑了一笑，变戏法似的变出了一函文件。“这是公证过的股权转让委托书，其实这家酒店，我是挂在你的名下”。


    “从开始就是”，他补充说。


    冷夜辉叹了口气，接过文件，翻了两翻。随手远远地扔了出去。EMS 的信封划过了长长的弧线，弹跳了四次，最终斜斜地切入了蓝色海水深处。


    “耶，打水花了，成功！”冷夜辉却高兴了起来，挥舞着拳头。


    刘子默依然坐在那里，温文如水。月光洒在他的身上，其实他很年轻。冷夜辉第一次发现原来他这么帅。


    “公证处有副本”。


    “我就是不明白，我到底有哪些好。你看上我什么了”。冷夜辉侧过头，努力不让刘子默看到她眼中的神色。


    刘子默拉动了身边的一根绳子，从海中拎起了一瓶清酒。他们出海已经有二个小时，酒被海水冰得冰凉。


    泠夜晖捡过一片蓝鳍金枪鱼，甩在了嘴里。又喝了一口冰酒，惬意地呼了一口气。

    “快说”！

    刘子默取过一个圆筒，扭了一下。“砰”地一声，筒口射出了一大簇烟花。

    烟花掉落到水面上，奇怪地却并不熄灭。反而继续欢快地燃烧，于是整个海面上都是红色，蓝色，黄色，绿色，紫色一朵朵小花。随着海浪手拉手在跳舞。

    “我有很多办法哄女孩子开心”。

    刘子默叹了口气说，“但我永远无法哄自己开心”。

    “不管我设计多么精巧，多么复杂的局，这都是哄别人开心”。

    “而在这些事的背后，则是计划与衡量。筹划与准备，以及无穷无尽的操心”。

    “哄女人15分钟，我可能要准备一个星期”。

    “所以人不可能布置一些场景哄自己开心”，泠夜晖补充说。

    “对，如果我自己，我宁愿天天宅在家里，什么事也不做”。

    人不可能哄自己快乐。而我如果想获取幸福，我得找一个人，她关心我，爱护我。会帮我每天换挺好的T恤，从此以后袜子再也不会有破洞。偷偷在我的包里塞三明治，让我能放心地开始喝酒。

    他抬起头，凝视着她，“我想要爱情，纯粹的爱情”。

    泠夜晖又喝了口酒，眼睛更湿润了。刚才还算正常的她，此刻却癫狂了起来。

    “爱情，爱情是什么。居然还有人相信爱情。拿这种骗小女生的话，你以为我会信什么”。

    “世界上的女人那么多，你干嘛选我啊。干嘛不选十七八岁的小萝莉”。

    “你这个大色狼，你上次骗老娘一双袜子还没有还给我呢”。

    “什么，你想让我爱你。开什么玩笑，我可是魔女，魔女呀”。她不知哪儿又变出了一对恶魔角戴在了头上。“魔女，是没有心的”。

    泠夜晖跌坐在地上，摸着自己的心口。喃喃说“魔女，是没有心的”。

    她的嘴角突然又勾起一丝讥笑，把酒瓶重重地扔出去。随手操起地上一把巨大的水枪，“说，说实话，否则姐姐一枪崩了你”。

    刘子默一身白衣，在海风的吹拂下哧哧作响。泠夜辉紧张得耍命，就看他一步步靠近来了。

    “傻瓜，其实我是骗你的”。他几乎咬着她的耳垂在她耳边轻轻说。“我选你的原因……”

    “颜值，关键是颜值啊！！”

    “啪”地一声，泠夜辉实在过于紧张，以至于扣动了水枪的扳机。水枪斜斜地全部射在了刘子默的颈下，又反弹到她的脸上。铺天盖地的水幕遮住了她的眼睛，她尖叫着往后退去，被龙骨绊倒，跌倒着摔下船舷。刘子默牵着她的手，赶紧俯出身去拉她。两个人重重压在同一个方向，船噗嗤地一下“翻了”。

    浮载沉沉，餐盒、水枪、电话，音箱，烟筒，糖浆纷纷掉入了水中。刘子默大惊，赶紧用力捏住了泠夜辉的手。而她却反之缠绕了上来，似八爪鱼一般紧紧将他缠绕。双手搂住他的脖颈，双脚盘在他的腰上。

    这是他和她最接近的时刻，刘子默心中却感到深深的恐惧。因为他双手双脚都被她牢牢地箍住。二人就此向深深的海底坠去。

    第二卷完


    # 第三卷 何以玫


    2015-08-11 yevon_ou 拜金女郎


    ![](img/ec7ac78432c144336e940619f4164e25_20_0.png)


    ![](img/ec7ac78432c144336e940619f4164e25_20_1.png)


    ## （八）厮杀


    刘家大公子要求婚了。消息以野火般的速度在圈内传播。他选择在 Waldorf Astoria Club 求婚，这是一幢 32m*13m*5.1m 的古典宫廷式建筑。二楼的观景阳台可以包揽整个外滩正面。


    ![](img/ec7ac78432c144336e940619f4164e25_20_2.png)


    ![](img/ec7ac78432c144336e940619f4164e25_20_3.png)


    一笑加一笑 (微信号：150500211) 邀您加入水库欧神文集群。群内文集每月一更新……


    届时，对面的震旦广场会叠出二行名字，巨大的空气集会半空中拖曳条幅，烟花炮艇会游弋在黄浦江上。随着齐鸣的汽笛声，将一束束彩球送入半空。


    刘子默选择了9999朵玫瑰。任何一个递过超过100朵以上玫瑰的人都知道，这已经不能单手握往。而是要搭一个木头支架，将花朵一朵朵插上去，从而变得毫无意义。


    刘子默选择了花雨。当镁光灯聚焦亮起的那一刻，将有玫瑰花瓣的花雨从空中降落，形成螺旋状的水幕。将心上人笼罩在光柱之中。而他，仅仅手捧一颗99粒的小型花球。


    为此，他要在天花板布置特制的鼓风机，八部，再让它们旋转起来。


    这一切都不是简单的事。浦江上的烟花需要政府的批准。宴会厅也需要改造。这些都需要漫长的时间。所以当大家收到鎏空玉格的“WA”邀请函时，对这一切已不感到惊讶了。


    据路边社不负责任报导，男主迄今都没亲过女主的唇。如此丧心病狂的谣言，在世风日下的今天，反倒引起大伙更大的好奇心。相比之下，婚纱店老板娘的小小爆料，已经引不起大家的兴趣了。


    冷夜辉三天前就来到了上海，住进了半岛。她对这座城市如同自己手掌一样地熟悉，所以当从荷兰银行，盘古银行，AXA出来时，她很惊讶在Shiatzy Chen门口撞见了何以玫。


    “你还是真难找啊，一天有16个小时不在酒店”。


    冷夜辉眉头忭了一下，“有什么事么”。


    “方便找个地方坐下来谈吗”。


    “随意，Bund 3还是5”。


    冷夜辉手里捧着一个巨大的文件袋，但她发现何以玫手里也有个同样巨大的文件袋。她眼眶很黑，充满血色，虽然用粉底强行压往，但仍苍白得可怕。这样情况下，以玫居然扔没有带手袋。就仅仅攥住那个文件袋，似乎比她的生命更重要。


    二人在罗斯福坐了下来，弯弯的圆窗正好把二人外的世界全部都包入黑暗中。


    “一杯白兰地，一杯朗姆酒，一匝冰”。冷夜辉说道。


    何以玫今天不喝酒。


    日光下，冷夜辉发现以玫的嘴角弧度拉得有点长。她平日总象个人畜无害的黄毛丫头，而此刻却更象是个主宰一切的君临女王。


    气氛有点僵，冷夜辉耐心地往白兰地里面加冰块。当她加到第七块冰时，何以玫先开口了。


    “收手吧，冷夜辉”。


    “哦”，冷夜辉有一点意外，但又不是全部意外。


    “你是个很不错的狐狸精。但现在收手还来得及，离开子默哥哥，走得越远越好”。


    “你哥没教过你么，小孩子别管大人的事”。


    “冷夜辉，你还不明白么。你露馅了，你完蛋了”。何以玫从文件夹中抽出一叠资料。甩在了桌上。


    冷夜辉翻了个翻，“你花私家侦探调查我”。


    “5W元/天，真便宜”。


    “哦，希望你的经费不要扔到空处”。


    “冷夜辉，你的哈佛硕士是假的。这里有一个技巧。哈佛本科可能是全世界最难进的本科。可哈佛硕士不同”。


    “如果你不申请奖学金的话，如果你读一个超级贵的专业，又没什么人申请的科”。


    “譬如这个，农林机械学，27万美金一学年。哈哈哈，有什么人会去读农民机械学呢。除了我们的泠大小姐”。


    “可我还是正牌的哈佛硕士”。


    “没错，等我说下去”。


    何以玫得意洋洋地拿起另外一份图表。“你说你和我哥是在飞机上认识的，可是根据我这里的-份报告，在之前的三个月内，你至少已经有三次和我哥出现在同一架飞机，同一个航班上”。


    “哦，想不到我和子默这么有缘啊。真应该早一点认识他”。


    “哼哼，恐怕不是那么巧吧。有谁会在头等舱落地之后，二小时之内再飞回来！”


    何以玫取出了第二份表格。这是前二趟邂逅的记录。一次间隔2:25，一次间隔2:45分钟。


    原路返回。


    泠夜辉的脸色更苍白了一点。


    “我怀疑你根本没出机场”。


    “说，你到底是去干什么”。


    “从我开始怀疑你，你身上处处是漏洞。纸终究包不住火的”。


    “这一盒是行李转盘旁的监控录像。你知道我哥有开空调盖毛毯的习惯，也知道我哥常常是整舱人最晚几个下飞机的”。


    “你看看这二段截屏，这，这，这里是你”。


    “你把你的行李箱子拿下来，放在我哥的箱子边上。然后再去出口处等他。狐狸精，你好深的心机啊！”


    泠夜辉叹了口气，喝了口酒，“小妹妹，你长大了”。


    “你根本就不喜欢吃牛排，却在我哥面前假装爱吃牛排”。


    “你根本就不喜欢粤菜，却比我哥还要精通粤菜”。


    “你的生活轨迹完全都在西区。可那天你却去东城看房子”。


    “知道了，我特意去查过二沙岛31幢的荷姐。她说你之前就去过了，这几个菜反反复复烧了无数遍”。


    “我哥去的前一天，你还特意去布置复核过。就为了那一天表演得天衣无缝”。


    “哥有一个坏毛病，就是所有的网站用同一个密码”。


    “他的网银密码估计你已经知道了。那么他的Gegara密码你也知道了”。


    “你登陆进去看，就把我哥之前看过哪些电影，喜欢的哪些观点赞赏全知道了。爱看什么书，爱读什么小说。你好深心机的绿茶婊啊！”


    “大梅沙那件事，一开始我没意识到。后来我才想起来，你是故意刺激我的。是我在你面前提郭淳买别墅，是你鼓动我让子默哥给你买礼物。你纯粹是为了钱和子默哥在一起的，对不对”。


    “是我害了子默哥，55555……”


    “你知不知道那天多危险，船翻了以后，你们俩个都会死的。吓死我了，求求你，离子默哥哥远一点好么。555”


    泠夜辉酩了一口酒，眼神还是清澈明亮。“别嚎了，真让人恶心。说到现在，我还是看不出我犯了什么错误”。


    何以玫抬起了头，眼神中多了几分怨毒。“冷夜辉，你真的要我揭你老底么。你的丑事还没做完么”。


    “你的财务并不健康。我在人行获取了你的资信报告表。啧啧啧，真是内容丰富啊”。


    “一共十六笔贷款，3000W负债。86张信用卡，其中90%额度已经刷爆了。哈哈哈，冷夜辉，你可真能干啊，仅仅信用卡就欠了四百多万。你等着坐牢去吧”。


    何以玫伸出一根手指，戳戳冷夜辉的脸膛。冷夜辉毫不犹豫竖起了餐厨。


    何以玫收回了手指。用餐布擦拭干净。“你在这身行头，名牌衣服，包包，太阳眼镜，全都是诈骗透支而来的是不是。只要没有钱，明天就会被抓进去吃牢饭。所以你才要接近子默哥，你是为了他的钱，是不是”。


    “一个月四十几万贷，啧啧啧”。


    冷夜辉脸上苍白退下去了一些。取之而来的则是酒劲后的潮红，她的神色更稳定了一些，就象翻过了山隘口的远征军。


    何以玫却越激怒了，冷夜辉漠然不经的样子让她愤懑，她不能理解一个人怎么能无耻成这样地步。


    “刘家的生意，一半是靠我们何家做销售的。只要我回去闹，断了刘家的往来。刘氏立刻遭遇重大损失”。


    “子默虽然很有钱，但你知道大家族规矩。在他正式结婚成家之前，可动用的资金是很少的。属于他个人的资金就更少”。


    “他上次为了哄你，买的那个酒店，花了很大一笔钱。这次他的事搞那么大，刘老爷子都被惊动了。特意地会飞过来”。


    “你想像一下，在婚礼现场，揭穿你的真面目。刘老爷子会有多失望。子默不会得到家族的承认的。你在子默身上榨不出钱来。我会让子默哥变得身无分文。你不就是为了钱么，难道你还想和他一起供贷款，过紧日子。你这个臭不要脸的狐狸精”。


    何以玫晃了晃手里一本印刷精美的小册子。“你瞧，冷夜辉，这就是你的故事，你的丑事。我精心准备好了，印了好好多本。每个宾客手里都会有一份哦”。


    “就连马路上的人，我也会派。我会让全世界的人都知道，冷夜辉是个大骗子，是属狐狸的心机绿茶婊”。


    “你紧张么，害怕么，想阻止么。对不起，一个小时之前，我的小组员们已经开始散发了。哎哟哟，我刚才和你说什么来着。让你收手，对不起我忘了告诉你，就算你收手，也已经太晚了”。


    “我就是要你身败名裂！”何以玫的怒火一下子燃烧了起来，“子默哥应该娶的人是我。你和我何子默，根本不是同一类人，不配站在我们中间。只有我才是名门淑人，贤良淑德，门当户对。你会弹钢琴么，你会跳芭蕾么。我看你除了发呆什么都不会。只有我，我才配站在舞台的正中，成为万人瞩目的中心。只有我，才配独占灯塔，花海，只有我，才配让男人倾倒追求”。


    “至于你，冷夜辉，你完了”。何以玫的目光如铁。她的威势并不来自于对方的厚脸皮，而是来自于文件夹最后一页。那里才是她的最后一张王牌。


    ## （九）机车


    冷夜辉拂了拂肩膀，“女孩子说话不要口沫飞溅，真是不讲卫生”。


    她调整了下坐姿，换了个最舒服的姿势斜斜地躺了下来。依次比较了脸，胸，手，确信万无一失，才懒洋洋地开了口。


    “我玩 Auralux，是因为我在飞机上，看见你哥在打星星”。


    何以玫霍地站了起来，“这样，你是承认了”。


    泠夜辉没有理他，只是继续再问，“小妹妹，那你知道你哥现在在打什么游戏”。


    何以玫略显疑惑，“什么游戏，不是还打 Auralux 么”。


    “小妹妹，Auralux 是单机版的。所以在长途飞行中很流行。但也正因为是单机版的，地图有限，很快会打完的”。


    “尤其是最后几关 Rack，Aurora，Talons，其中的乐趣，算了，说了你也不懂”。


    “你哥上次是在玩 Auralux，但他最近在看小说《死人经》，而之前是《拔魔》”。


    “小妹妹，你有关心过这些事么”。


    “你哥喜欢喝海螺汤。但其实真正的原因，是他的呼吸道不好，北京的上肺太严重。他只是喜欢喝汤润肺时的一股火烫的感觉。虽然这是虚幻的润觉”。


    “他并不喜欢广东汤，如果你要煮一点标准广州老火靓汤的话，估计他要苦着脸喝下去了”。


    “谢谢你告诉我这些，以后我做他太太时，会悉心照料的”。


    “不，你不会。因为你甚至都没有问我海螺汤的做法”。


    “你说你最适合做他的太太，可是你想做的第一件事情呢，是拆他的台，逼他身无分文。折腾到他生意失败”。


    “人渣”，泠夜辉鄙视地说道。


    “你说什么”！


    “婊子，Bitch”。


    “在你心中，你肯定以为子默的地产投资是一笔巨大的失败。恨不得尽快割肉斩仓套现还贷。对不对”。


    “你真是太不了解你哥了。子默会这么做，最简单一个大前提，就是收购酒店一定赚钱。而且是很赚钱。才值得他这么辛苦去做”。


    “才值得他送给你”。


    “象子默这么优秀的人，只有 3000W 赚 8000W 的单子，才会拿来礼物给我。他炫耀的是成绩，不是金钱。钱算什么，毫不稀奇”。“你根本不了解我们刻在骨子里的骄傲，根本不了解精英中的精英。你和我和子默，根本不是同一类人，你不配站在我们中间”。


    “狐狸精第一定律，用崇拜的眼神看着你的男人”。


    泠夜辉虚空拍打着何以玫的耳光，“光这一条，99.99%的社会主义新青年就做不到”。


    “人渣就只懂得争风吃醋，你妈从小给你的教育，就教你请侦探黑帮敌。没教你做人的真知识么”。


    泠夜辉突然起了兴致，凑上前去，神秘祕祕地说“小妹妹，你知道什么是机车么”。


    “少用你那些肮脏的，下流的话来侮辱我。我什么都不想知道”。何以玫冷冷地说。


    “‘机车’的意思，是一个女的，趴开了双腿，躺在了床上，只会啊啊啊啊啊叫”。


    “这样过了二十分钟，象块木头一样。木板车”。


    “然后你就让男人帮你付牛奶费，午餐费，料理费，电车费，服装费，运动费，医疗费，保健费，美容费，美甲费，娱乐费，旅游费，你爸你妈你弟你舅子所有的事都让你男人掏钱”。

