    届时，对面的震旦广场会叠出二行名字，巨大的空气集会半空中拖曳条幅，烟花炮艇会游弋在黄浦江上。随着齐鸣的汽笛声，将一束束彩球送入半空。


    刘子默选择了9999朵玫瑰。任何一个递过超过100朵以上玫瑰的人都知道，这已经不能单手握往。而是要搭一个木头支架，将花朵一朵朵插上去，从而变得毫无意义。


    刘子默选择了花雨。当镁光灯聚焦亮起的那一刻，将有玫瑰花瓣的花雨从空中降落，形成螺旋状的水幕。将心上人笼罩在光柱之中。而他，仅仅手捧一颗99粒的小型花球。


    为此，他要在天花板布置特制的鼓风机，八部，再让它们旋转起来。


    这一切都不是简单的事。浦江上的烟花需要政府的批准。宴会厅也需要改造。这些都需要漫长的时间。所以当大家收到鎏空玉格的“WA”邀请函时，对这一切已不感到惊讶了。


    据路边社不负责任报导，男主迄今都没亲过女主的唇。如此丧心病狂的谣言，在世风日下的今天，反倒引起大伙更大的好奇心。相比之下，婚纱店老板娘的小小爆料，已经引不起大家的兴趣了。


    冷夜辉三天前就来到了上海，住进了半岛。她对这座城市如同自己手掌一样地熟悉，所以当从荷兰银行，盘古银行，AXA出来时，她很惊讶在Shiatzy Chen门口撞见了何以玫。


    “你还是真难找啊，一天有16个小时不在酒店”。


    冷夜辉眉头忭了一下，“有什么事么”。


    “方便找个地方坐下来谈吗”。


    “随意，Bund 3还是5”。


    冷夜辉手里捧着一个巨大的文件袋，但她发现何以玫手里也有个同样巨大的文件袋。她眼眶很黑，充满血色，虽然用粉底强行压往，但仍苍白得可怕。这样情况下，以玫居然扔没有带手袋。就仅仅攥住那个文件袋，似乎比她的生命更重要。


    二人在罗斯福坐了下来，弯弯的圆窗正好把二人外的世界全部都包入黑暗中。


    “一杯白兰地，一杯朗姆酒，一匝冰”。冷夜辉说道。


    何以玫今天不喝酒。


    日光下，冷夜辉发现以玫的嘴角弧度拉得有点长。她平日总象个人畜无害的黄毛丫头，而此刻却更象是个主宰一切的君临女王。


    气氛有点僵，冷夜辉耐心地往白兰地里面加冰块。当她加到第七块冰时，何以玫先开口了。


    “收手吧，冷夜辉”。


    “哦”，冷夜辉有一点意外，但又不是全部意外。


    “你是个很不错的狐狸精。但现在收手还来得及，离开子默哥哥，走得越远越好”。


    “你哥没教过你么，小孩子别管大人的事”。


    “冷夜辉，你还不明白么。你露馅了，你完蛋了”。何以玫从文件夹中抽出一叠资料。甩在了桌上。


    冷夜辉翻了个翻，“你花私家侦探调查我”。


    “5W元/天，真便宜”。[1]


    “哦，希望你的经费不要扔到空处”。


    “冷夜辉，你的哈佛硕士是假的。这里有一个技巧。哈佛本科可能是全世界最难进的本科。可哈佛硕士不同”。


    “如果你不申请奖学金的话，如果你读一个超级贵的专业，又没什么人申请的科”。'
  - '[PAGE 22]


    “譬如这个，农林机械学，27万美金一学年。哈哈哈，有什么人会去读农民机械学呢。除了我们的泠大小姐”。


    “可我还是正牌的哈佛硕士”。


    “没错，等我说下去”。


    何以玫得意洋洋地拿起另外一份图表。“你说你和我哥是在飞机上认识的，可是根据我这里的-份报告，在之前的三个月内，你至少已经有三次和我哥出现在同一架飞机，同一个航班上”。


    “哦，想不到我和子默这么有缘啊。真应该早一点认识他”。


    “哼哼，恐怕不是那么巧吧。有谁会在头等舱落地之后，二小时之内再飞回来！”


    何以玫取出了第二份表格。这是前二趟邂逅的记录。一次间隔2:25，一次间隔2:45分钟。


    原路返回。


    泠夜辉的脸色更苍白了一点。


    “我怀疑你根本没出机场”。


    “说，你到底是去干什么”。


    “从我开始怀疑你，你身上处处是漏洞。纸终究包不住火的”。


    “这一盒是行李转盘旁的监控录像。你知道我哥有开空调盖毛毯的习惯，也知道我哥常常是整舱人最晚几个下飞机的”。


    “你看看这二段截屏，这，这，这里是你”。


    “你把你的行李箱子拿下来，放在我哥的箱子边上。然后再去出口处等他。狐狸精，你好深的心机啊！”


    泠夜辉叹了口气，喝了口酒，“小妹妹，你长大了”。


    “你根本就不喜欢吃牛排，却在我哥面前假装爱吃牛排”。


    “你根本就不喜欢粤菜，却比我哥还要精通粤菜”。


    “你的生活轨迹完全都在西区。可那天你却去东城看房子”。


    “知道了，我特意去查过二沙岛31幢的荷姐。她说你之前就去过了，这几个菜反反复复烧了无数遍”。


    “我哥去的前一天，你还特意去布置复核过。就为了那一天表演得天衣无缝”。


    “哥有一个坏毛病，就是所有的网站用同一个密码”。


    “他的网银密码估计你已经知道了。那么他的Gegara密码你也知道了”。


    “你登陆进去看，就把我哥之前看过哪些电影，喜欢的哪些观点赞赏全知道了。爱看什么书，爱读什么小说。你好深心机的绿茶婊啊！”


    “大梅沙那件事，一开始我没意识到。后来我才想起来，你是故意刺激我的。是我在你面前提郭淳买别墅，是你鼓动我让子默哥给你买礼物。你纯粹是为了钱和子默哥在一起的，对不对”。


    “是我害了子默哥，55555……”


    “你知不知道那天多危险，船翻了以后，你们俩个都会死的。吓死我了，求求你，离子默哥哥远一点好么。555”


    泠夜辉酩了一 口酒，眼神还是清澈明亮。“别嚎了，真让人恶心。说到现在，我还是看不出我犯了什么错误”。'
