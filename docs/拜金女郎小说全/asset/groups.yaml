    个人资信报告，理论上是隐私。但如果你有一个 P2P 个人小贷牌照，其实可以查的。


    最后何以玫和冷夜辉撕逼的那场戏其实有一个 bug，因为一般的火柴只能燃烧四秒钟。不够讲完那一长串的话。


    只有特制的磷芯火柴，但又不可能出现在餐厅桌子上。


    所以这段话只能改成冷夜辉右手持火柴，左手拿着火柴盆。但这样写也太 Stupid 了，只能略过。反正也大致可以看得通。


    冷夜辉一开始就点了一杯白兰地，一杯朗姆酒。而她只喝朗姆酒，说明白兰地点来就是准备泼的。


    她往白兰地里面向冰块，加到了第七块时何以玫开了口。这决定了冰块的浓度。


    其实餐馆里卖的白兰地都很少，一般只有 1 厘米都不到。这样的酒是不足以燃的。甚至连七块冰块都无法完全浸没。但何以玫是一个大小姐。所以这也解释得通。


    RR 是半岛的专用车辆。每一个住店客人都可以用他接送往返机场。


    那艘船是我编的。其实我一直希望外滩上能有快速游艇系统，一直通往松江遥远的水系。以后的有钱人，在陆家嘴上班，在外滩吃晚饭，吃完就直接坐船到松江的码头别墅上岸。


    双脚根本不碰汽车。这才是理想高大上的生活。


    航空里程是个笑点。我一直期望着有人回复“卧槽，500W 航空里程”。结果却无人关心。是不是零太长了。


    刘氏父子既然涉足酒店业，那完全可以靠航空伙伴计划向冷夜辉打里程。这解释得通。500W 航空里程大约价值人民币 20W 元左右。


    专属私车直接开到跑道上，把滑行的飞机拦下来，塞一个人上去。


    这样漫无法纪的事我不知道上海机场能否可以做。但至少在沈阳这种级别的城市，是一定可以做到的。而且只需要一个集团级干部就可以了。


    光幕电视确有其事。但我不确定民航法规是否允许它悬挂在飞机舱顶。也可以改成是一个立式支架。但 IB 味就差了很多。


    有人问，为什么刘父可以在机舱内做这么多的布置。


    “欧美的上流社会，很喜欢买一家航空公司。因为这信有面子”。


    “我在东南亚有大量朋友”。


    其实一开始还酝酿了一句台词，“以我的力量，虽然不足以使国际航班返航，但包下半架飞机还是可以的。尤其是这种东南亚的小航空公司”。


    “宾客们都在后面，中舱。虽然没到齐，但重要的也来了七七八八”。


    后来觉得实在没地方塞进去这句话，所以也没写。


    航空公司最初是以宿雾航空（CEBU）为蓝本的。他只有一架飞机，收购不难。


    不需要签证，没有入境记录的国家是科伦坡。


    全文尾最后的结局，配的应该是梁静茹的《勇气》。可是 QQ 音乐居然没有这首歌。只能草地选了一首姚贝娜的充数。


    《梁静茹·勇气》的酷我链接是：http://m.kuwo.cn/?f=qqliulanki&mid=MUSIC_82767#1


    冷夜辉的身家，大致在 1 亿资产，3000W 负债左右。这是根据 25%的负债率反推出来的。


    3000W 贷款，月供 40W，信用卡上限 400W，这是很真实的数据。只有真正富贵圈人才写得出来。


    16 套天珠，这是“富贵自由”的最基本底线。3000W 才可以财务自由，但你要有一亿，才能像冷夜辉这样生活。


    相比之下，冷夜辉相对于她的身家，还是花得太多了一点。但人家是拜金女郎，又是一个求偶期的女生，花多点也是可以原谅的。


    剧中设定何以玫比刘子默小三岁，何以玫刚刚从英国毕业。


    所以冷夜辉年纪并不大，能取得如此资产，殊实不易。


    整篇文章真正触动我心境的，是到最后刘父几乎是苦苦哀求着说：“象子默这样的人，你会喜欢他的”。


    很多人会奇怪，供求关系，为何会如此逆转。


    但事实就是这样。这个地球上99%的有钱人，都处于极度的情感荒漠之中，如道明寺般渴望慰际。


    而我们的民众，敌视仇富得要命。恨不得分光土豪的田地。但是偏偏就没有一个人，填补土豪的精神食粮。冷夜辉轻易就可以拿走刘子默绝大多数银行卡。


    这其中，给“狐狸精”行业留出了巨大的空间。狐狸精这个职业前景广阔远大，堪称21世纪的高科技朝阳产业。


    有女孩子评论说，前二辑的铺垫太多。不如直接进入第三卷的撕逼大战精彩。


    这种人，就是天生注定的一辈子女屌丝命。


    事实上，精华全在前二辑。我还觉得写得太少了。专职哄男人开心，如何安排美丽的邂逅讨男人欢心调情与挑逗。


    这些东西，才是狐狸精的立身之本。


    而第三卷的撕逼大战，只是粗俗的街察般的女人才会关心的事情。


    你一个女人，不仔细阅读狐狸精秘笈，心思全放在争风吃醋上面。那你这辈子也这样了，这篇文章对你毫无帮助。


    你注定一生都是个女屌丝，住出租房去吧。


    今天早上看阅读评论，idronnie说她每天养家赚钱，八小时忙完累到死。这时候她最需要的是被找个狐狸精，而不是当个狐狸精。


    对的，所以你不是狐狸精。


    “体脑分工”是人类文明的高阶段产物。只有衣食无忧了，你才会想到去当狐狸精。八小时专业狐媚。


    所以狐狸精的产生必然是极少的。你以为满大街都是狐狸精吗。我们的街上只有粗俗不堪的女屌丝和大妈。


    刘父说他这一辈子都没见过狐狸精。许多人问作者的自我代入，究竟是刘子默还是冷夜辉。


    这还用问么。刘父的名字就叫做刘逸文。《拜金女郎》是我写给我儿子看的。


    有人问，还有没有下一篇。


    没有了。至少十几年内是没有了。


    小说写的是故事，是人生，只有人生的体醌感悟，才能写出伟大的作品。


    孔二狗写《黑道风云二十年》时才才艳绝。但是他这部写完，出版商让他再交二部剞稿。他写“炒楼客小曾”，就写得一塌糊涂。


    远不如我反击的《秦时明月汉时霜·我的租客孔二狗》。

    因为作品来自于生活，十几年的感情，才能触入笔尖。当它宣泄完了，灵感也就完了。

    就先写到这吧。


    （yeyon_ou@163.com，2015 年 5 月 17 日）


