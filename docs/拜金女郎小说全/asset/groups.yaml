    ## 《拜金女郎》侧记


    2015-08-11yevon_ou拜金女郎


    ![](img/ec7ac78432c144336e940619f4164e25_33_0.png)


    ![](img/ec7ac78432c144336e940619f4164e25_33_1.png)


    # **《拜金女郎》侧记**


    《拜金女郎》是我早在十几年前，初中时期就开始构思的一篇文本。虽然细节和骨肉随着时代不停飞跃，但框架是一开始就定下来的。


    整部小说最核心的一点，就是“ **她被指出是各种心机绿茶妹，然后她（刘母）当中宣布她就是选出的儿媳妇** ”。


    最初的场景设定，是一个类似于茜茜公主选婚的大宴。当约瑟夫王子手捧着花球走近时，竞争对手公主当众指出，茜茜所做的一切，全都是虚情假意和伪装。构筑了大量心思的一个圈套。


    而这时，皇太后，也就是那个手握大权的老女人，当中宣布“Yes，不错，这才是我理想中的公主”。这才是我理想中的儿媳妇。


    皇家的规则和价值取向，自然和民归的不同。那些以为检举出心机骗局胜利的无知小白兔，根正小红苗，才是幼稚洗脑低能的可笑。这样的人，自然不配站在殿堂上。


    很久以前，有一部梁朝伟和徐静蕾演的电影《伤城》。其中，梁朝伟扮演一个一心接近女主的复仇男。


    但“拜金女郎”的故事，的确不是从伤城里来的。是我更早之前就想到的。


    在实际写作中，唯一做了大幅修改的，是增加了泠夜辉出走的这场戏。


    在原始剧本中，是没有泠夜辉出走的。也就是她死不悔改。做狐狸精就要全心狂热做到底。哪怕在殿堂上被揭穿，也要撒泼打横死赖强词夺理。直到皇太后出面，来一个颠覆性的大翻转。


    在现实版中，增加了泠夜辉出走的桥段。其实冲击力是大幅减弱了，戏份被消散了。她已经不配称之为一个真正的“拜金女郎”。


    但是，我实在是很喜欢退机票压垮柜台的那幕场景，一时半伙又找不到更好的喜剧。所以还是忍痛让她心软了一会。


    毕竟，这世俗的十几年，我也不同初中时的心境了。


    泠夜辉坠海的桥段，参照的是《非诚勿扰》第一集。


    好溪坠海，其实是一种交代。无论你之前欠了多少纷扰，我就命填给你，就算是一个了断。


    真心求死过了，这事就算是结了。以后剧情才可以展开。


    泠夜辉的故事，其实交代得很清楚。IQ太低还看不懂的人，自动面壁去。


    泠夜辉是一个硬壳。当她背叉着双手，扭头扭去，在赛车旁剪立时，其实她是一种伪装，是


    狐狸狸精幻化出的人形。


    而只有当她被真正打动时，那个坚果外壳才会破碎。才可以看见她柔碎的中心。


    在文中，出现了二次。


    第一次是在冷漠岛上。非常宁静浪漫的夜晚，泠夜辉却突然发起火来，哭喊着捶打“你为什么


    要这样对我，为什么要这样对我……”。


    另一次则是在刘子默迷定她大梅沙酒店。二人泛舟海上。泠夜辉却突然变得尖锐刺激了起来。


    费尽心机找一切机会挑刘子默的刺，一百个不满意。


    果然，秉承了一贯的“送礼物都没有好下场”爱情剧规则啊。


    这文中有极强的代入感。就是泠夜辉看见了过去，把眼前的刘子默混成了人渣。对人渣有数


    不清的痛苦、憎恨和怀疑。


    在最后和刘父的对话中，泠夜辉说：“我想变个坏人。坏人，能让我变强”。


    所以她找到了刘子默，哪怕他制定计划前都不认识这个人。她决定转职做拜金女郎。


    刘子默是一个很暖阳的人。就象是人参滋补品，会慢慢补上你心灵中的裂痕。


    这样的人，生活中自然是原型的。知名不具。


    但问题是，刘子默一样面临心力消耗的问题。人不可能哄自己开心，当他滋补哄慰着别人，


    他自己却是在消耗，在枯萎，在心力耗尽。


    太阳不是永动机。如果一个男人永远是暖阳。他迟早也是会耗尽的。


    所以刘子默还是需要找一个狐狸精。不多，只要一点点养分就可以让他活下去。可是我们这


    个世界女性缺少敬业精神，哪怕一点点养分都非常非常地难找。


    此外，追逐赛车的桥段，最初是参考李修贤、王晶的电影《绝桥智多星》。


    在片中，李修贤想要泡王祖贤，所以就在道路上超车。一连超了好几次，直到引起王祖贤的


    注意。


    二人在弯道上飙车，极为惊险地把王祖贤压制在后面。从而引发了女方的注意。


    刘子默、泠夜辉的最初相见，其实我想写赛车的。但是我不懂车，堵塞了很久，最终也写不


    好空气弹跳的桥段。


    所以还是改了，改成了在飞机上的一杯冷水。


    二沙岛一直都是飙车圣地，这些广州的十三行都很清楚。珠江新城是因为水库地主群前一阵


    子有人推销楼盘，“南望珠江，北望花园”。而西城经典则是虫虫小妖精的心水盘。只不过


    位置改成了东城。


    有人问我，为什么是 Corolla，为什么不是大奔。

