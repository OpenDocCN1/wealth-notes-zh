    “你不做家务，不收拾房间，不给他洗衣服，不给他准备早餐，午餐，晚餐。不陪他笑，不陪他骂，不陪他看电影，不陪他唱歌，不陪他吃烤串，不陪他等快递”。


    “你不许他喝酒，不许他晚归，不许他狐朋狗党，不许他失踪，不许他孝敬父母，不许他沉溺游戏，不许他熬夜，不许他打呼，不许他开空调，不许他吃冰淇淋”。


    “为什么有些女人认为，你只要趴开大腿二十分钟。男人就要付出这一切呢。你有没有考虑过消费者的感受。


    冷夜辉晃晃手指，五指葱惹在阳光下又白又嫩，“我们女人的名声这么差，全都是被你们这些心机婊绿茶婊败坏掉的。臭不要脸的狐狸精”。


    何以玫完全懵了，她的大脑一时转不过来，不理解该说些什么话该如何解析。


    “何以玫，你想嫁给予默，是为了他的钱吧”。


    “你爱他么，你真的了解他么。你看上去他哪一点，你是真心极度渴望想要拥有他么”。


    “你的父母为你安排了几次机遇，你都没有抓住。反倒让我这个外人争了先，于默在你的心里，可能还不如下午去做个头发重要。‘爱’，你也配说这个字。婊子”。


    冷夜辉一把抓住了何以玫的发髻，将她拉到眼前。


    “等你嫁给了于默。只要 20 分钟的机车，你就心安理得地享受这一切。你会象狗一样地差使他为你做任何事，花光他的钱财，败光他的基业。为了一点琐事而乱发脾气给他脸色。而你对他的关心和爱护，几近于零”。


    “因为你的英国教育，没有教会你这些。在你的血统里，只有自私”。


    何以玫大叫一声，抓起桌上的朗姆酒，用力洒了过去。冷夜辉毫不犹豫，立刻抓起白兰地酒杯，原样摔了回去。于是二个女人都象落汤鸡一样，酒水顺着发梢一滴满地落下。


    何以玫想要扑上去，却看见冷夜辉手里突然多了一根防风火柴。


    “何以玫，你没有希望的。就算没有我，于默也不会选你。你根本不了解你哥是一个多么恐怖而又可怕的怪物，哪怕翻船掉落水埋，手里还拉着绳子”。


    “贵族之间，只有一件事是不可原谅的。那就是愚蠢”。


    “我不蠢”，何以玫弯下腰竭力地喊着。


    冷夜辉把火柴扔了过去。


    何以玫尖叫着向后倒去，连带着扫倒一系列的桌椅，从台阶上滚了下来。


    “猪，加了那么多的冰块，还怎么烧得起来”。


    冷夜辉用餐布包了一下头巾，鞠了个躬，“对不起，我有事先走了”。


    （十）无心


    冷夜辉走下中山东一路，RR 早已接到了指今，守候等在了 WA 的门口。


    她还有四个小时的时间。人的第一印象最重要，所谓的“七秒钟定律”。


    她知道，在错过最初的慌乱期之后，何以玫此刻一定在打电话，或者打给她的父母，或者打给她的智袋。她很快会会稳住阵脚，再编造出不利于她的谎言。


    她必须在这极短的时间内首先见到刘父。现在的问题是，坐火车，还是坐船去。


    刘父就在河对岸的 Ritz-Carlton 酒店。她一直有一艘隐秘的船，可以直接穿越浦江。停到河对岸的游艇俱乐部。


    冷夜辉上了 RR，对司机说，“机场”。


