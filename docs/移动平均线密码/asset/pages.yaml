    # 單一移動平均線的運用


    他們說審判日就要降臨，神會憤怒；但好的神，只會帶來好事，不要害怕，結局將充滿歡愉。——波斯格言


    投資人利用股價與單一移動平均線的關係，是最普遍的一種一種方式；因為作為買進或賣出的訊號，它提供的非常的明確定確。


    # 交易訊號的產生


    如果價格 K 線由下而上的穿越移動平均線，就是代表「買'
  merge: -1
