    # 巴菲特獲利22%


    1956 年葛萊姆解散了他自己的投資公司之後，巴菲特回到了故鄉，與朋友合夥設立了一家投資公司。一開始，公司總共募集了十萬五千一百美元，其中只有一百美元是巴菲特出的。巴菲特爲自己定下了每年要超越道瓊工業指數漲幅的
    10%的目標；結果，巴菲特的表現是遠超過自己所定下的目標。十五年之中，巴菲特每年的平均報酬率都高於道瓊工業指數，漲幅達到 22%。又因爲公司的年年獲利，到了
    1965 年時，公司的資產價值已經高達 2600 萬美元。


    巴菲特從 1957 年到 1969 年的投資績效是相當的出色，公司的年平均報酬率超過道瓊工業指數的漲幅 22 個百分點；更可貴的是它的獲利呈穩定成長，很少有大起大落的現象。公司的標準差比道瓊工業指數的標準差還要低，這表示公司的報酬率波動很小。巴菲特則是維持他一貫低調的語氣說：「不論從什麼角度來衡量，公司的獲利表現——應該是讓人很滿意的。」


