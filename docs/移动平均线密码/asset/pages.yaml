  md: '# RSI型態分析


    > 凡事豫則立，機會來臨前的充分的準備；遠強過有了一個好機會，卻還沒有準備好。——懷特尼.揚（Whitney Young, JR）


    相對強弱指標 RSI 也經常發生有類似「價格型態」（Price pattern）的圖形。這種 RSI 的型態波動，因爲敏感而快速，所以都能比商品或個股提早預報，而且常常早一步突破頸線，而爲操盤者在獲利了結出場提供了可貴的線形參考。


    # 底部RSI型態


    在下降波的下跌走勢之中，市場價格屢屢創下新低；在超賣區所出現的底部型態——像是頭頂底、雙重底等，都是市場分析師的可貴的參考圖形；一旦 RSI 指標向上突破底部型態的頸線之時，投資人就可以考慮進場買進的。


