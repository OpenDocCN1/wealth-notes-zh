  md: '# 死亡交叉（Dead Cross）


    ……………………可能失落的七個月，你能熬得過去嗎？


    當短天期的均線由上往下穿越長天期的均線時，尤其是兩均線都呈向下滑落的走勢時，稱爲「死亡交叉」（Dead Cross），這是表示將要展開一段跌勢，股價續跌的可能性大增，很多人主張這是賣出的時機。


    黃金交叉與死亡交叉的使用，會因爲均線天期的不同而有不同的含義。一般說，愈長天期的均線所形成的黃金交叉或是死亡交叉，它的影響的時間愈長。例如，半年線與年線如果形成黃金交叉，基本上是表示空頭市場的結束：未來數年內，或者有股價有機會呈倍數的漲幅。如果只是
    5 日、10 日的平均線所形成的黃金交叉，那麼股價可能只有一成到兩成的漲幅。


