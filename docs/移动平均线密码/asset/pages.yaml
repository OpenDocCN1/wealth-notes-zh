  md: '一段的同志理論更具廣泛影響力——他說，人在處理棘手的性慾時，可能：


    +   一是，完全不理；


    +   二是，拚命意淫；


    +   三是，將性慾「昇華」爲求知慾。


    達文西屬於第三類：他只要知識，不要性——他是戒除色慾的浮士德。佛氏曾寫信給榮格（當時兩人還沒有鬧翻），說：「我發現了一個和達文西一模一樣的病人，但是這個病人並沒有達文西的才華……」


    **佛洛伊德的「達文西密碼」**，是三面照妖鏡：照出了達文西的歪影、佛洛伊德本人，以及那一段歷史。如今，《達文西童年記憶》讀起來像是讓人悵惘的志怪小說：那個異想天開的「現代性」，早就恍恍惚惚，過去了。


    # ## 三個重點密碼


    本書的論點之一是，富翁是「將性慾昇華爲致富慾望的人」；信不信由你；如果沒有這一個層面，你很難理解富翁的聚斂財富的慾望的——原來，它是由性慾轉化昇華而來的；因此，我們將本書定名爲《移動平均線密碼》。


    本書的密碼之說，並非空口白話，而是將重點擺在五日平均線，這是第一個密碼；再來，移動平均線與乖離率的結合運用，這是第二個密碼；再來，移動平均線與 RSI 的併聯使用，是第三個密碼。


    事實上，光是三個密碼的連用，互相支援，就足以致富的！'
