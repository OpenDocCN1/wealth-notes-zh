  md: '在上升的趨勢中，這三條均線的排列順序是由下而上的，3 日線在最上，7 日居中，21 日均線在最下方朝上。在下降的趨勢（Trend）中，這三條均線的排列正好相反，3
    日線在最下，7 日居中，21 日均線在最上方朝下。


    在趨勢（Trend）反轉的時候，3 日均線向上穿越 7 日與 21 日線，這是買進的良機。在這之後的修正或整理期間，三條平均線的位置，可能會互有變動，但只要是上升的趨勢維持不變，是可以繼續持有多頭的部位的。


    當趨勢（Trend）反轉下降時，最敏感的 3 日線會向下穿越 7 日線與 21 日線，這是賣出的訊號。有些交易者在 3 日線穿越 7 日與 21 日線時，作爲多頭不倉的部位。而在
    7 日線穿越滑落 21 日線時才建立空頭的部位——俗稱「放空」。


