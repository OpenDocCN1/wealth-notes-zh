  md: '# 怒火 像最快的馬車一樣的飛奔

    懂得控制憤怒的人 才是好車伕


    > 怒火像最快的馬車一樣的飛奔，懂得控制憤怒的人才是好車伕。其他人只知道拉住韁繩，他們沒有真正的力量。——法句經（Dhammapada）


    # 移動平均線與擺盪指標

    股市達人孫叔熬，每週引頸企盼


    ADL、ADR、OBOS、TAPI、OBV 等都具有「領先指標」的功能。但是移動平均線卻是個「落後指標」；它要在趨勢（Trend）反轉一陣子之後，才會發生訊號；所以說它是一種落後市場的行爲。移動平均線是一個平滑化的工具；藉由數字的平均，產生平滑曲線，使讀者容易看見潛在的趨勢（Trend）。


    # 移動平均線


    移動平均線往往得和其它技術指標配合運用。這主要是因爲價格走勢——往往會呈現長期的橫向走勢。在這種橫向的整理走勢中，移動平均線會持續的產生錯誤的穿越訊號。就以
    1946-1949 年間的華爾街股市的空頭行情來說，就出現有許多錯誤的穿越訊號。'
