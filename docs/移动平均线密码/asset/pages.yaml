    Story），它也是當今世上最成功的動畫製片廠。在某個奇特的形勢變化下，蘋果買下了 NeXT，我重新回到蘋果，我們在 NeXT 發展的技術成了蘋果目前振興公司的核心技術，而羅倫（Laurence）和我也共組了美滿的家庭。


