    # 5+12+8+2的獲利祕訣


    巴菲特（ Warren Buffett ）是一個價值型投資人（value investor）；他的非凡的投資策略在哪裡？他用阿拉伯數目字將它們串連起來，就是所謂的「
    5+12+8+2 的獲利祕訣」，也就是五項投資邏輯、十二項投資要點、八項選股標準、兩項投資方式。


    # 五項投資邏輯


    +   1. 因為我把自已當成是企業的經營者，所以我成為優秀的投資人；又因為我把自已當成投資人，所以我也成為優秀的企業'
