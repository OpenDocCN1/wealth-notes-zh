  md: '查理.孟格（Charlie Munger）又說：「人的思考是運用各種模式；我們如何比別人更有智慧，那就是要找出最基本有效的思考模式；因爲它可使我們考慮得更多元、更全方位。」「你只要掌握幾個重點觀念就好，不需要專精各種學科的。」


    # 股市起伏多靠幻念與運氣行事


    > 股市極易為大量無知的群眾心理所影響，而產生劇烈波動，而一些投資大戶的神經、鬱悶，甚至他們的消化情形和對天氣的反應都會造成股市的震盪，而這樣劇烈的波動是無法以數學模型加以評估的，投資股市儘可依過去經驗加以計算，但股市裡還是憑幻念、運氣行事者居多。——凱因斯在《一般理論》（The
    General Theory）1936 年出版


    凱因斯認爲人民會因為經濟蕭條及失業而受苦，凱因斯說了一句名言：「說到長期，大家都死了。」（In the long run, we are all dead）。


    # 股市在驚恐（fears）與希望（hopes）中起落


    經濟學家凱因斯（John Maynard Keynes, 1st Baron Keynes, 1883~1946）曾說過：股市的投資——往往是在驚恐（fears）與希望（hopes）中起落。


    由於短期的股市變幻莫測，因此，凱因斯提醒那些沒有賭博天份者不要從事股市投資；而有賭博天份的人，若掌握不了短期的波動，最好也不要借錢買股票，否則下場不堪想像。


    凱因斯有深厚的數學造詣，1921 年出版有《機率論》'
