    # 創新高的個股


    賺錢老手喜歡一年內創新高的個股；理由是強者恆強。這種創新高的個股比較容易持續的漲；後後的支撐是在股價創新高之後，賺錢的人多，套牢的籌碼相對的少。


    長線投資人在價格一高之後，就不再追漲；但是投機客是以賺取差價為目的，與投資客不同；他們在乎的是上漲機遇的把握，價位高低——並不太在意。


