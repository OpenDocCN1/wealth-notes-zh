  md: '預見這些點點滴滴會如何串連起來。不過，事經十年，當我再回顧過去，一切就變得非常非常清楚了。


    同樣地，你們無法預先串連人生的點滴，你們只能在回顧時將它們串連起來，因此，你們必須相信這些點滴，總會以某種方式在你們的未來串連。你們必須相信某些事情——你們的勇氣、命運、生命、業（Karma）……因為，相信這些點滴終於未來串連起來，會讓你有自信去依循你的內心，即使它引領著你，離開一般人已走爛了的陳腐道路，你都不會失去自信。


    我的第二個故事，是關於愛與失去。


    我很幸運，在很年輕的時候，就發現自己喜歡做的事情。我二十歲時，就和沃茲合作，在我父母親的車庫創辦＜蘋果電腦＞。我們拼命工作，十年後，蘋果電腦已經從兩個窩在車庫裏的小夥子，成長為一家價值二十億美元、員工超過四千人公司。我們推出最棒的作品？——麥金塔，而我才剛邁入人生的第三十個年頭。然後，我被解雇了。


    你怎麼會由你自己創辦的公司解雇呢？


    隨著＜蘋果＞的日益成長，我們聘了一位我認為非常有才華的人，請他和我一起經營公司。頭一年，事情進展得很順利，然後，我們對未來的願景開始出現分歧，最後發生了爭執。在我們爭執的過程中，我們的董事會站在他那邊，所以，三十歲時，我出局了，而且是非常公開地出局。我成年後的生活重心全部消失了，這真是毀滅性的打擊。


    有好幾個月的時間，我真的不知道該做什麼。我感覺自己弄'
