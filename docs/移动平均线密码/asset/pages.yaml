  md: '人都知道：美國大小城鎮的街道規劃，都有一條主街叫「大街」（Main Street）的；這裡住的是各地的小市民們，他們大多是奉公守法，日出而作，日入而息的小老百姓。但是，華爾街發生金融危機時，竟然要他們大街的人來埋單，也對他們的衝擊最大；這些小市民們或者是因爲工廠關閉，或者是因裁員而失業；因而沒有收入可以繳房貸（mortgage），以至於住屋被提前收回（foreclosed）；還有就是，那些已經退休的人也是因養老金（pension）儲存的公司或銀行倒閉，而使生活陷於困境之中。這種景象，很像
    \text{is} 1929/10/29 日華爾街股市的「大崩盤」（The Great Crash）後，隨之而來的「經濟大恐慌」（The Great Depression）。


    爲了解救不定時發生的華爾街金融危機，美國國會在 2008 年就批准了 7000 億美元的紓困方案（bailout），可是紓困的對象卻是兩大房貸公司房利美（Fannie
    Mae）與房地美（Freddie Mac）、以及 AIG，主要的受惠人是華爾街，而不是大街。


    # 《大街》（Main Street）的小說


    說到美國的大街，人們不得不提到 1920 年的美國女作家辛克萊.路易斯（Sinclair Lewis）所寫的同名小說。這個名爲《大街》（Main Street）是刻劃
    1920 年代美國中西部一小鎮的保守而又封閉的社會；對於一個在大都會長大、深受良好教育的新女性的禁錮與心靈的摧殘，導致她的背棄醫生丈夫，而與情人出走；但悲劇是——她最終竟然重返那個明知會使她整個靈魂毀滅的「大街」。


    「華爾街」代表的是美國高度資本主義與弱肉強食的社會，「大街」則反映著美國傳統、保守社會的縮影，以及那根深柢'
