  md: '# 乖離率：失落的七個月

    Deviation Ratio


    # 【乖離率 BIAS 的理解】


    ![](img/9d806147c3b4d71949ef1a89678cd362_208_0.png)'
  merge: -1
  img_proc: true
- pgno: 209
  md: '股價在大漲表現過後，往往陷入長時間的整理，七個月是平均來看；在整理期間，痛苦的套牢族——逐漸不堪忍受，而將股票認賠殺出……；大戶逐漸的以低價取得這些股票，儲蓄了來日上漲的動能。


    「乖離率」(Deviation Ratio)，簡稱 BIAS，是描述價格與某種天期的移動平均線的相距的遠程序度。這 BIAS 指的是相對的距離。這乖離率的計算公式與參數如下：


    ```

    N日乖離率 = $\frac{當日收盤價 - N日移動平均價}{N日移動平均價}$ × 100%

    ```


    如果我們用字母與符號來表示，就是如下：


    ```

    BIAS(N) = $\frac{C_n - MA(N)}{MA(N)}$ × 100%

    ```


    在上述的公式之中，分子是價格（股價的收盤價）與移動平均價的絕對距離，它是可正可負的；在除以分母之後，就得到相對的距離。


    另外要注意的是，移動平均價是一元時的相差 0.1 元，與移動平均價為 10 元時的相差 0.1 元，是有不同的，這時除了考慮絕對距離之外，還要考量相對距離的。


    # 乖離率的參數


    在乖離率（BIAS）的公式中，含有參數的項目只有一個，就是移動平均線 MA。因此，MA 的參數，也就是乖離率（BIAS）的參數——也就是說，乖離率的參數，就是移動平均值的天數'
  merge: -1
  img_proc: true
- pgno: 210
  md: '（參數）。分析師用 12 天期做為移動平均線的話，那麼乖離率也就是 12 日乖離率的了。


    這參數的大小的選擇，最先是影響到 MA，其次是影響到乖離率（BIAS）。通常，參數選得愈大，就是允許價格遠離均線 MA 的程度愈大。這也就是說，價格在遠離均線
    MA 到了一定的程度之後，它就會回頭的了；而這一個遠離的程度，是隨著參數的變大而變大的。


    投資人選擇參數，大概都不會與習慣觀察的移動平均線的日期一模一樣；避開同樣的日期，也可能讓投資人多一個角度觀察市場的型態變化吧！


    舉個例子來說，如果參數設定為 6 時，BIAS 到了 5%時價格就該回頭的了；但是，如果參數設定為 12 時，乖離率（BIAS）可能得到 8%時才會回頭的！


    # 鑽研經濟的股市達人


    「股市悲觀的時候，會太悲觀；樂觀的時候，又會太樂觀！」股市達人的休閒活動就是閱讀國外《財星》、NEWS WEEK、富比士等財經類雜誌。有一陣子，他的休閒活動幾乎投入在鑽研世界好公司的股票。


    股市達人從國內外財經雜誌中——找出個別企業的展望介紹，並且收集各公司的詳細資料；包括過去的成長趨勢、獲利本益比、及財務狀況等！這個達人做足了功課，認為具有成長性、展望不錯的公司，才會投入資金。


    收集全世界好公司的經營獲利狀況，成了股市達人的唯一嗜好；也因爲分批承接，大多順利，因此不斷累積財富。'
