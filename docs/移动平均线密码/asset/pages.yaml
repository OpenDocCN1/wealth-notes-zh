- pgno: 193
  md: '不要絕望；如果你發現無法達成所有想完成的美事，不要為此失望。如果你跌倒，要試著站起來，努力克服面前的障礙；要直搗問題的核心、事情的本質。——奧理略


    「碟形底」是一種橫向的「整理型態」（Consolidation pattern)。在整理的時間夠久之後，都會賺錢的。世界上著名的富翁，都是在這種線形時買進續價股的。


    「碟形底」（Saucer Bottom Pattern）是一種發展非常緩慢的橫向走勢；技術分析師很難判斷它完成型態的訊號，也很難估計排列完成後的目標價位。「碟形底」通常是誕生在「過線圖」與「月線圖」的長線觀察中，它的涵蓋的時間，有的往往長達數年之久。


    # 潛伏底型態


    「潛伏底」是圓形底的一種修正型式，它的底部幾乎是靜止盤旋的狀態，拉出一個「長又平」的底部型態。價位長久顯得沉悶。


    潛伏底，大部份是出現在少數市場流通籌碼不多的個股中；這時因為被看壞或忽視，因此成交量稀少。


    有的市場老手喜歡尋找這種低迷已久的潛伏底個股；理由很簡單，靜極思動；它蟄伏久了，地牛最後總是會翻身的。市場老手認為，大型股的蟄伏久了，會有上漲，但漲幅有限，重點是投'
