  md: 'Stocks and Uncommon Profits）一書之中，他提到研究股票的一項過程，稱之爲「閒談家常」（scuttlebutt approach)；這個研究方法是投資人打電話給該企業或其競爭對手，詢問有關該公司的問題。


    費雪最喜歡的訊息來源之一，就是他所謂的「閒談家常」（scuttlebutt approach）的方式——也就是人們私底下評論公司與產品的意見；他會找來與該公司往來的客戶、消費者、供應商、離職員工，還有最重要的競爭者來談談。通常，一位主管可能不太願意給你很多自己公司的細節，但是他們卻很樂於告訴你有關競爭同业的一切。


    # # 華爾街並不是一個能賺很多錢的地方


    1951 年的華爾街，並不是一個工作的熱門之選。當時的道瓊指數只有 200 點；從 1945-1949 年，股市一直低迷，最高大約達到 190 點，最低大約是
    160 點。1949 年之後，道瓊指數開始上升，1950 年成為道瓊指數從未低於 200 點的第一年。1929 年，道瓊指數曾經到達 381 點，但也跌破
    200 點。人們對於戰後的股市持觀望的態度，認為我們正陷入蕭條。所以在當時，華爾街並不是一個能賺很多錢的地方……它和現在截然不同。——華倫·巴菲特（Warren
    Buffett）


    這是華倫·巴菲特（Warren Buffett）提到當年——他從哥倫比亞大學畢業時說的華爾街。


    無論是針對個股還是市場，都會有投資人在走勢看似明確的'
