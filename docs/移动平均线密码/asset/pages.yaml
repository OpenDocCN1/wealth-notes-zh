  md: '月 12 日在美國加州帕羅奧多市——


    我很榮幸今天能來到全球第一流的大學，與你們一起參加畢業典禮。我從來沒有從大學畢業，這是我第一次離大學畢業典禮這麼近。今天，我想要告訴你們三個我的人生故事。沒什麼大不了的，只是三個故事。


    # 第一個故事，是關於「串連人生點滴」。


    我在 <里德學院> (Reed College) 讀了六個月後就休學了，但之後我仍然偶爾去學校上課，過了大約十八個月才真正離開。那麼，我為什麼辦休學呢？


    故事得從我出生之前講起。我的親生母親是個年輕的未婚研究生，她決定讓別人領養我。她認為領養我的夫妻都該有大學學歷，於是為我準備好一切手續，好讓我一出生，就能過繼給一位律師與他的妻子。但是，當我出了娘胎，他們卻在緊要關頭決定自己其實想領養一個女孩。就這樣，排在候補名單上的我的父母，在那天半夜接到了一通電話，問他們：「我們有個意外出世的男嬰，你們想要他嗎？」他們說：「當然。」後來，我的親生母親發現養母並沒有從大學畢業，養父甚至連高中文憑都沒有，於是她拒絕在收養文件上簽字。幾個月後，我父母承諾將來會讓我去上大學，她的態度才軟化下來。


    就這樣，十七年後，我果真上了大學。然而，我天真地選擇了一所幾乎跟 <史丹佛> 一樣昂貴的學校，我那藍領階級的父母，幾乎把所有積蓄都花在我的學費上。六個月後，我看不出讀大'
