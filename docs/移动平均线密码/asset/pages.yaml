  md: '學的價值何在。我不知道這輩子要做什麼，也不曉得大學如何能幫助我找到答案。所以，我決定休學，並堅信船到橋頭自然直。這個決定在當時確實令人驚心膽跳，但回首前塵，那卻是我這輩子做過最好的決定之一。休學之後，我再也不用上自己沒興趣的必修課，開始去聽比較有意思的課。但這件事一點也不浪漫。我沒有宿舍，所以得睡在朋友房間的地板，靠回收可樂瓶的五先令（約當新台幣三十元）退瓶費買吃的，每個星期天晚上得走上七英里的路，穿越市區，到禮讚克里須納神廟（Hare
    Krishna temple）吃頓大餐。我熱愛這種生活。許多我循著自己的好奇與直覺而踏上的岔路，後來都成了無價之寶。讓我給你們舉個例子：


    ＜里德學院＞當時開設了或許是全國最好的書法課程。整個校園內的每張海報，每個抽屜的標籤，都有美麗的手寫字。由於我休學了，不必修一般課程，便決定去上書法課。我學會了襯線字體（Serif）與無襯線字體，學會了以多樣化方式呈現不同字母組合的間距，學到了造就美妙版面設計的要素。這種優雅、具有歷史感與藝術感的微妙形式，是科學無法捕捉的。我覺得它很迷人。


    我從未期待這些東西能在我的人生中發揮任何實際作用，然而，十年後，當我們在設計第一台「麥金塔電腦」時，這一切突然重新浮現在我腦海中。我們把這一切都納入麥金塔系統的程式設計，那是第一台能做出美麗版面的電腦。如果我當年沒在大學上過那一門課，麥金塔就不可能有那麼多樣的字體，以及字母間距協調勻襯的字型。而且，微軟視窗系統是模仿麥金塔的，因此可能沒有任何電腦會有這些功能。當然，我在大學時，是不可能'
