  md: '「零股理論」的思維是，只要看看最笨的那個人（傻瓜）在做什麼——然後在證券市場上做與那個人相反的事情，大約就是正確的。聰明的投資人將這種「零股理論」運用到股市之中。因此，只要有外行的投資人開始買進零股——非常少額的股票時，就是正確的「賣出」的時機了！反之亦然。


