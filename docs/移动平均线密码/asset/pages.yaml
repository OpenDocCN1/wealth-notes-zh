  md: '# 谷底盤整：市場往何處去？


    危機入市，中國股民說「抄底」


    # 【谷底盤整】線形逐漸變小之中


    ![](img/9d806147c3b4d71949ef1a89678cd362_190_0.png)'
  merge: -1
