    查理.孟格當時剛從哈佛大學法學院畢業，並且在洛杉磯開業，業務看來是蒸蒸日上的。但是，後來巴菲特還是說服了查理.孟格轉行從事投資證券；相對的，查理.孟格也是不負眾望的；他'
