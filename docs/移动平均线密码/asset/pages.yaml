  md: '的好事，而是指殘酷的負面事項。


    「完美風暴」是英文 perfect storm 的硬譯。但英文 perfect 一字，除了指「完美」，還可指「完全」或「完全適合」，例如 a perfect
    student 是指「完美的學生」；而 a perfect fool 是爲「不折不扣的傻瓜」；weather that is perfect for a hike
    是指「最宜遠足的天氣」。


    這個 perfect storm，是美國作家雲格爾（Sebustin Junger）一本書的名稱。該書描述 1991 年十月吹襲北美大西洋海岸的恐怖颶風。


    氣象學者凱斯（Robert Case）曾談到風暴成因說〜：當時的氣候完全適合風暴形成：The situation is perfect for the formation
    of a storm。


    雲格爾則取 perfect storm 兩字作書名。這一本災難紀實，在 2000 年拍成電影，香港譯做《驚濤駭浪》，所根據的是電影情節。至於大陸則譯做《完美風暴》，是逐字的硬譯英文
    The Perfect Storm。


    這個「完美風暴」一詞，說的是禍因俱備，大患即將形成。曾俊華的那一句「市場已具備完美風暴的各種因素」，中文會譯做「市場山雨欲來風滿樓」。


    2016/7/5 香港財政司長曾俊華出席博饒論壇午餐會，致詞時說：「英國退出歐洲聯盟，加上歐洲經濟脆弱，美國利率遼升，各國中央銀行政策相異等等，市場已具備完美風暴的各種因素。」大災難竟然被譽爲「完美」，現代漢語著實諷刺得道地。'
