- pgno: 151
  md: '> 沒有男人是一座完全屬於他自己的孤島。——— 鄧恩 (1572-1631)


    兩個靈魂結合在一起，在彼此的工作、成就與不幸中相互支援，直到最後告別的靜默時刻降臨，這是何等美妙的事。——— 艾略特 (George Eliot)


    頭部型態是屬於最可靠的原始反轉型態。


    在多頭市場的末期，因爲作手或大戶出貨的最後階段，時常會出現一些反轉的型態。


    從出貨的時間快慢來區別：以 M 字頭 (double tops) 和天井型 (inert true) 最快；頭肩型 (head-and-shoulders)
    和圓頂型 (rounding tops) 的時間較慢。


    不論是 M 字頭、天井型、頭肩型、或是圓頂型，這些都是多頭市場要結束的徵兆。


    伍克夫 (Peter Wyckoff) 是 1960 年代華爾街的著名分析師；他認為：「市場中最嚴重的虧損，來自於無知的人們買進價格嚴重高估的股票！」


    中文的投資學上有「勢不可用盡，福不可享盡」的說法，通常投資人在頭部的階段最是好玩，每天都能盡興而歸，但要提防的是有一天可能會「敗興而歸」！


