    原來，巴菲特在 1951 年時，透過葛萊姆的介紹而認識了蓋可公司，萊姆當時是這一家公司的董事。在一個一月寒風中的早晨，巴菲特來到蓋可公司的總部，希望能更瞭解這一家公司的狀況。當時，向巴菲特作簡報的人是大衛森（Loriner
    Davidson）；而羅瑞爾當時只是總經理的特別助理，後來晉升為公司的執行長。


    巴菲特返鄉為父親的證券公司工作後，就開始介紹客戶買進蓋可公司的股票。巴菲特還爲蓋可公司寫了一份研究報告，刊登在<商業金融紀事報>（The Commercial
    and Financial Chronicle）上，標題是〈我所喜歡的投資標的〉（The Security that I like Most）。1951 年底，巴菲特把他的所有資產的
    65%——大約是 1'
