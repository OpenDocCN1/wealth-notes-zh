  md: '吧」，而這意味著：你必須試著在短短幾個月內，告訴你的孩子們你以為可以在未來十年內告訴他們的事；你要確保搞定了每件事，好讓你的家人好過些。這也意味著向大家告別。我整天都在想那個診斷結果。當天晚上，我做了一個切片檢查，他們從我的喉嚨裏伸進一個內視鏡，穿過我的胃，深入小腸，然後在我的胰腺中置入一根針，從腫瘤內取出少許組織細胞。我被打了麻醉劑，不過，我的妻子當時也在現場，她告訴我，那些醫師看到顯微鏡下的組織細胞時，個個都哭了，因為那是一種相當罕見的胰腺癌，可以透過手術治癒。我做了手術，現在我已經康復了。


    這是最貼近死亡的時刻，希望這也是我未來數十年內最貼近死亡的經驗。經過這一切之後，我可以更確定地跟你們說：沒有人想死。即使是想上天堂的人，也不想搭乘死亡列車抵達那裏。然而，死亡是我們共同的宿命，沒有人能逃過這個宿命，而且也理當如此，因為死亡很可能是生命獨一無二的最棒的發明，它是生命改變的原動力，它清除老一代的生命，為新一代開道。此刻的新一代是你們，但在不久的將來，你們會逐漸變老，並且被清除掉。很抱歉講得這麼戲劇化，但這話是非常真實的。


    你們的時間有限，所以，不要浪費時間活在別人的人生裏。不要被教條困住——這等於是活在別人思考的結果裏。不要讓他人意見的噪音淹没了你們內在的聲音。最重要的是，要有勇氣依循你們的心與直覺，從某個角度來看，它們早已知道你真正想成為什麼樣的人。其他一切都是次要的。


