  md: '丟了傳到我手上的接力棒，讓上一代的企業家們失望了。我和大衛.普克（David Packard，惠普公司的共同創辦人）及鮑伯.諾宜斯（Bob Noyce，英特爾
    Intel 公司創辦人）見面，試圖向他們道歉，因為我徹底搞砸了。我是個眾所皆知的失敗者，我甚至想過要逃離矽谷。然而，某些事慢慢讓我醒悟過來——我依然熱愛我所做的一切，在＜蘋果＞的形勢變化絲毫沒有改變這點。因此，我決定從頭來過。


