    - 第三层：确立了偏实的意思，事情的变化也是不断改变的\n\n# 虚实与偏强的三原则\n\n真正学习《虚实篇》，就需要通过这三条来认识虚实：\n第一条，就是能打头的，以虚击虚。\n\
