    ## 18 行军篇：行军宿营，比交战更重要


    华杉讲述孙子兵法30讲 2018-07-05 进入直播>


    —— 重金金句解析 ——


    > 孙子曰：“凡此数者，... 勿近之 水边之地，必远水源，...”


    这一讲我们进入《孙子兵法》的第九篇《行军篇》。你要注意《孙子兵法》每一篇的内容和标题并不是完全对应的，互相各篇之间内容也有交叉。之前在《虚实篇》和《军争篇》，我用了一些篇幅讲行军的九法，而第九篇是专门的《行军篇》。


    ## 四种地形的行军宿营守则

    《行军篇》开篇名言："凡此军所..." 处就是教你要如何布置你的军队，在处军守营论里面，不只是行军，还包括行军和宿营。相较就是我们下一讲要讲的，相较就是倚察。


    那应该怎么行军宿营呢？主要还是看地形，这里主要讲四种不同的地形，有四种不同行军和宿营的原则。


    ## 第一种地形是山地，军队在山地行军和宿营，要注意三条：


    - 第一，你带兵要靠近山谷。因为山谷有水源和草料，不靠...

    - 第二，不要谷底行，行军要有一定的高度，特别注意你要顺风向走。

    - 第三，如果你从山谷通过的时候，敌人在山顶上攻击你，这时候你一定不要进攻，要赶紧走。


    ## 第二种地形就是河流，孙子说，渡河之后要快退进，尽可能地远离河流。因为敌如我从那边来，你就背着水一战了。


    ## 第三种地形就是盐碱地和沼泽地。对于沼泽地，实际上我们在《九地篇》也讲过了，“厄地者无”，厄地就是沼泽地，在沼泽地就不要宿营。


    ## 第四种地形是平原，在平原要注意两点：


    ## 判断危险的救命法则


    ## 六种危险地形不要去


    比打仗更重要的是做好战前准备；比去哪更重要的是远离危险的地方。


