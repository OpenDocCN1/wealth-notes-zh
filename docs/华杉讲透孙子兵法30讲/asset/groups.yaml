    \n# 10 兵势篇：战术第一原则：以正合，以奇胜\n\n华杉谈孙子兵法第30讲\n2018-06-27\n\n# —— 黛玉解析金句 ——\n\n孙子曰：凡治众如治寡，分数是也；...\
