    \n# 16 九变篇：原则比变通重要\n\n华杉解读孙子兵法 30讲\n2018-07-03\n进入专题\n\n16 九变篇：原则比变通重要 11.28 10.5\
    \ MB\n\n# ——重点金句解析——\n\n孙子曰“凡用兵之法，将能而君不御者胜。其知 ming 合，知地形者，可以有其事。\n‘地地无常，角地合交。将地无常，知地形者，死地则存，……’\n\
    \n今我们读《孙子兵法》的第八篇《九变篇》，《九变篇》比较长，主要内容可以分为三个层次：\n\n# 五种地形变化的相对之道\n\n第一种“通达地形”，罕见之地，处于通达地带，就是说地形宽敞通达，通路、道路、沼泽等都是通达行进的。\n\
    如果在地形易于出入，是个通达之地，我就不需要设防...\n\n# 李广与程不识：弱学小帽率事件\n\n要讲这个例子，我举两个古代流传的著名例子。第一个人，是战国时的飞将军李广，第二个人，也是汉朝的名将，同时期的和李广同朝的...李广的下场很惨，他最终自杀而亡，他是一个名将，自己一直想求胜，但是《史记》里面有一句名言：\n\
    \n> “鸿毛轻于马，程不识重于泰山。”\n\n不要奢望于小概率事件。要有计划，按程序办事，以不变应万变。——华杉\n\n总结一下，《九变篇》讲的主要是原则，以及如何应对变化。原则，就是法则，无论情况如何变化，法则始终不变。变化只是战术的调整，...\
    \ \n\n# 华杉解读孙子兵法·30讲\n\n# 精选留言\n\n生存和风险这一题是一个问题！真正的英雄不是生是死，而是稳而不偏。正确是因为我们得到自己的认知和思维...信息的影响，战略的规律。是自己立于不败之地。\n\
    \n今天的文章让我想起了一个词就是傻瓜力。程序不好的军队就是一种傻瓜力的体现，孙子法子里面说的是...战斗战役从来都是...是成千上万条小事构成的。每一秒，你一定要知道自己的目的是什么，但是如果你...所以整理好自己的原始一下，切切按照流程办事，就事变步骤和手工清洁...不能...来收敛和新事...如何也会收费的创新呢。\n\
    \n![](img/34bf454d5fdd573267dd2a353064c747_17_0.png)\n\n# 17 九变篇：紧扣战略重心，别跑题\n\n\
    华杉解读孙子兵法 30讲\n2018-07-04\n\n# —— 重击金句解析 ——\n\n孙子曰：凡用兵之法，将受命于君，合军聚众，圮地无战，... 凡此五戎，不可不察也。\n\
    \n# 战略上的五个“不可为”\n\n战场上的五个“不可为”\n第一“不可战”。\n第二“不可战而战”。\n第三“不可胜而求战”。\n第四“不可胜”。\n\
    第五“可战而不可战”。\n\n用毛泽东的说的话说，就是主要矛盾。这就是战略思想的核心。任何一件事情都有一个战略重心。\n\n# 将领的五种性格缺陷\n\n\
    在《九变篇》里，还有一个非常重要的问题就是将领的五种性格缺陷，《孙子兵法》原文又是这么说的：\n\n> 故将有五危，必死可杀，必生可虏，忿速可侮，廉洁可辱，爱民可乱。\n\
    \n> 军记：始终服务于最终目的。理念上不忘初心，战略上不忘本诣，做人上不忘本心。\n\n# —— 本小结 ——\n\n# 《九变篇》原文\n\n孙子曰：凡用兵之法，将受命于君，合军聚众，圮地无战，...\
    \ 凡此五戎，不可不察也。\n\n# 华杉解读孙子兵法·30讲 这期是解读《孙子兵法》\n\n# 痛越成长\n\n1.有所为有所不为，为什么感觉我们都做不到。巴西马特乌斯和他飞行员的例子。巴西马特乌斯写出了十五个重要的事，把最重要的从前面放下，...\
    \ 怎么样做到的？飞行员说：我觉得大部分时间是在鉴别什么五件事上，然后下来的时候我们也就去做了。 不是，你你应该把所有精力放在最重要的五件事上，对其它的它可以放掉就像睡觉一样，不在任何时间都精确在上面。\n\
    \n# 周赛萍\n\n华老师好，我今天的观点有点反常想。无论是“不忘初心”“不忘本诣”还是以终为始等等，美其名这样的说话几十年所的大多了，几乎每个人都知道这个道理，但做到的人却始终很少，这是何...？\n"
