    # 《华杉讲透孙子兵法》学习指南


    华杉讲透孙子兵法30讲

    2018-06-20 进入课程 ›


    文/得到App团队


    你好，欢迎来到《华杉讲透孙子兵法30讲》。

    这门课是由上海华与华营销咨询公司董事长华杉，开设的课程。

    华杉是《孙子兵法》的解读者，研究兵法经典20多年，也是兵法理论的践行者，一直活跃在商业战场的第第一线。

    这门课也从《孙子兵法》原意出发，打通中西方军事战略思想，结合军事、商业经典案例，给你彻底讲透孙子兵法。


    # 这门课会怎么讲？


    除了对《孙子兵法》思想精华解读的30讲正式课程之外，为了让你了解《孙子兵法》原文的魅力，华杉给你准备了《孙子兵法》全文，供你学习。


    +   1. 按原文逻辑展开

    《孙子兵法》共13篇，30讲课程也按照《孙子兵法》的逻辑顺序展开。全篇大致可以划分为战略理念、战术原则和具体战术注意事项三层。

    2. 解读原意

    孙子兵法6000多字，后世却有很多误解。课程以宋本《十一家注孙子》为蓝本，筛比对历代解读，还原孙子原意。

    3. 解读兵法精华

    华杉挑选兵法思想精华，结合经典战例、商业案例，解读对当代人有启示的人生原则。

    《孙子兵法》原文一共十三篇，华杉将它们划成三大层级——战略层是兵法的头脑；战法层是兵法的脊梁；而战术层则是兵法的手脚，是操作的技要点。

    【战略】：始计篇、作战篇、谋攻篇、军形篇

    【战法】：兵势篇、虚实篇、军争篇、九变篇

    【战术】：行军篇、地形篇、九地篇、火攻篇、用间篇


    # 你能从这门课收获什么？


    《孙子兵法》不仅仅是战法，还是管理之法，博弈之法，更是智慧的人生处世之法。通过这门课，你将：


    +   1. 深刻理解《孙子兵法》的原意，真正读懂孙子兵法，感受古代军事思想的魅力；

    2. 培养管理思维，学习管理方法，从中西战略思想交流和经典战例的讲解中获得启发，理解团队、竞争、战略等重要思想；

    3. 领悟人生的基本原则和道理，搭住人生错误的源头，让自己生活得更智慧。


    # 你可以怎样学？


    方法一：原文与讲解相结合，和华杉交流互动

    1.每一讲的文稿开头，提炼了本课重点解析的金句，并在文末附上了对应篇章的兵法原文。你可以在学习华杉老师对精华思想的解读后，重新通读原文，提升理解。

    2.参与讨论：每一讲，华杉都会给你出一个有关战略、战术或人生思考题。欢迎你在文稿下方的留言区写下你的想法和问题，和华杉交流，也和大家在讨论中进步。

    方法二：设置“学习计划”，有节奏地学习

    1.设置学习计划：点击App首页最下方“学习计划”按钮，你可以通过“调整计划”讲课程添加到学习计划中；

    2.在课程更新过程中，你可以在“学习计划”版块和课程内部进行最新内容的学学习，“学习计划”版块将按照你自身的学习进度给你推送教学内容。

    在课程更新结束后，你可以根据自己的复习节奏，设置每日学习的数量，让学习更灵活。

    方法三：管理好自己的“笔记”


    +   1. 收藏内容：你可以通过点击音频或文稿最下方“桃心”按钮，对喜欢的内容点赞，进行收藏。

    2. 划重点：每一讲的最后都会为你划到讲重点，带你回顾本讲精彩观点，你可以一键添加到“知识账本”。

    3. 记笔记：读到好的内容，可以通过长按屏幕点击“记笔记”，来记录你的学习感悟。同时，你可以把记录下来的笔记通过“加标签”进行分类，方便查找。

    4. 公开笔记：如果将笔记设置为“公开”，对你感兴趣的用户将看到你的学习心得，与你交流。好的笔记还有可能进入“知识城邦”，与所有得到用户分享。

    5. 以上内容，都可以通过点击App首页最下方中间的“笔记”按钮，进入“我笔记”查看。


    ![](img/34bf454d5fdd573267dd2a353064c747_0_0.png)


    方法四：分享课程知识，与朋友一起交流


    +   1. 分享精彩文字：看到金句和精彩观点，你可以选中想要分享的文本，点击“分享”，生成金句卡片，分享给你的朋友或者转发朋友圈，与他人共享有趣的知识；

    2. 分享文章：大师课具有“闪读红包”功能。点击页面右下角“请朋友读”，你可以把喜欢的这节课分享给朋友，和他一起讨论。有30个免费抢读名额，可以分享给30个朋友。

    3. 分享课程：当然，如果你希望你的朋友跟你一起学习这门大师课，欢迎你点击文稿右下角的“分享”，把这门课程推荐给朋友。


    方法五：使用倍速听，让学习更高效

    1. 如果你想在更短的时间内听到知识密度更高的内容，你可以打开“音频播放器”点击“更多” “倍速播放”选择你想要的倍速。

    2. 我们为你提供0.7倍速、1.25倍速、1.5倍速、2.0倍速、3.0倍速，你可以根据信息接受需要，用更少的时间听到更多的内容，节省时间。


    方法六：掌握功能，找到最适合你的学习节奏

    1. 你可以通过章节的选择，直达你最感兴趣的内容模块。

    2. 如果你是中途加入课程，可以点击“倒序”切换成“正序”，从第一讲开始学起。


    好的，对你的叮嘱就到这里，祝你在这一课程里学有所得。


