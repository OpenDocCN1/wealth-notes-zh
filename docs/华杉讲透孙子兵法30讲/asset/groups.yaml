    \n# 军事上的“致人而不致于人”\n\n《虚实篇》开篇就是这么说的： “凡先处战地而待敌者逸，后至而趋战者劳。” 你先抢占战地，在战场上摆兵布阵等着人来，就叫做“以今用逸”；“后至战地”别人把地利形地拿给你，你事后赶过去，就等于你去送死，你是以“劳待逸”今夕用逸了。”\n\
    \n# 虚实要应用到生活中\n\n> 调动敌人来主场有两个关键点：一是对他有利，二是不来对他有更大的祸害，他不得不来。\n\n# 《孙子兵法》原文\n\n\
