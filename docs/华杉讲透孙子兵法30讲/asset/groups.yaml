    \n华杉谈孙子兵法·30讲  ... 精选留言 ...\n\n# 11兵势篇：部下强不强，责任在领导\n\n华杉讲透孙子兵法30讲\n2018-06-28\n\
    \n# —— 重点解析金句 ——\n\n> 孙子曰：“凡治众如治寡，分数是也；斗众如斗寡，形名是也；三军之众，可使必受敌而无败者，奇正之变也；兵之所为，如水之就下，亏实也是也。”\n\
    \n> “求之于势，不责于人而能得胜者，有胜。”\n\n> “故善战者之势，如转圆石于千仞之山者，势也。”\n\n这一讲，是我讲《兵势篇》的第二讲，《孙子兵法》第四篇《军形篇》和第五篇《兵势篇》，联系系统地一起来理解形势。\n\
    \n# 组织领导：将兵，将将\n\n《兵势篇》第一章：\n“凡治众如治寡，分数是也。”\n\n# 求之于势，不责于人\n\n> “善战者，求之于势，不责于人，故能择人而任势。”\n\
    \n# 三种兵势：气势、地势、因势\n\n兵势可以道德经济学呢？李唐时的名将李宓说：兵有三势，有三样兵势，一种是气势，一种是地势，一种是因势。\n\n# 曹操选择夺势合肥\n\
    \n# —— 本讲小结 ——\n\n# —— 《兵势篇》原文 ——\n\n> “势”是临时之宜、进退之机。领导者要能够造势和运用它。\n\n# 精选留言\n\
    \nPrince\n老师不用像Frank Hu道歉！得到是我见过最好的，价格最便宜的课程，大家都可以入门课程。\n...\n\n![](img/34bf454d5fdd573267dd2a353064c747_12_0.png)\n\
    \n# 12 虚实篇：想要得到，必须先放弃\n\n华杉解读孙子兵法第30讲\n2018-06-29 进入课程>\n\n# 12 虚实篇：想要得到，必须先放弃\n\
    \n> —— 重点解析金句 ——\n孙子曰：‘我专为一战，敌分为十，是以什其众，夫夺人之众者也。’\n\n这一讲，我们开始解读《孙子兵法》第六篇《虚实篇》，讲了三个层次：\n\
    \n+   - 第一层：敌人而我弱于人，你就应该让敌人觉得我人迹稀少\n- 第二层：兵法原是相生，要以实击虚，以少胜多，而以多胜少，是常法；以虚道盛成而实之，敌之必胜之处，是虚处\n\
    - 第三层：确立了偏实的意思，事情的变化也是不断改变的\n\n# 虚实与偏强的三原则\n\n真正学习《虚实篇》，就需要通过这三条来认识虚实：\n第一条，就是能打头的，以虚击虚。\n\
    第二条，敌人有实我有虚，我能坚守有我。虚实相对...让敌人从我这边转移。\n第三条，我看得准就能大概看，...只要有一个法，就是用虚换实，通过把一些东西放弃，让他掉，...\n\
    \n# 做商战战时重心的选择时，有策略地做“虚”，能保障最重要“实”。 —— 华杉\n\n《华杉解读孙子兵法·30讲》\n\n# 13 虚实篇：把战场变成主场\n\
    \n华杉讲述孙子兵法30讲 2018-06-30\n\n13 虚实篇：把战场变成主场 11:09 10.21 MB\n\n> 孙子曰：凡先处战地而待敌者逸，后至而趋战者劳，故善战者，致人而不致于人。\n\
    \n# 军事上的“致人而不致于人”\n\n《虚实篇》开篇就是这么说的： “凡先处战地而待敌者逸，后至而趋战者劳。” 你先抢占战地，在战场上摆兵布阵等着人来，就叫做“以今用逸”；“后至战地”别人把地利形地拿给你，你事后赶过去，就等于你去送死，你是以“劳待逸”今夕用逸了。”\n\
    \n# 虚实要应用到生活中\n\n> 调动敌人来主场有两个关键点：一是对他有利，二是不来对他有更大的祸害，他不得不来。\n\n# 《孙子兵法》原文\n\n\
    孙子曰：凡先处地而待敌者逸，后至而趋战者劳，故善战者，致人而不致于人。能使敌自至者，利之也；能使敌不得至者，害之也，故敌从我欲之，迎而勿拒，安而勿动之。\n\
    \n# 14 军争篇：怎么样在行军中设计战场\n\n华杉讲述孙子兵法30讲\n2018-07-01\n\n# —— 重点解析孙句 ——\n\n> 孙子曰：“故诡道而行之，后人发，先人至，如此真至之者也。故军争为列，军争为危。举军而争利，坌不及，委军而争利，则崩军而争利，颠覆者。”\n\
    \n上半讲，我们谈了《虚实篇》的破釜和陷等，这是一 些我们工作和生活的基础原理。如果能够从小事 情上讲清楚兵法的原则，并且始终带着把战术做故 事，你就掌握了《孙子兵法》。我希望在整\
    \ 个课程里 面，你都能贯彻这种会不会一点。\n\n# 行军的原理\n\n> “举军而争利不及，委军而争利则崩军而争利，颠覆者。” 这就是行军的基本原理了。\n\
    \n# 赵奢救韩国\n\n> 行军的基本原理是：急行军会耗损军队的精力，要想办法调动敌人到我的战场。\n\n# —— 本讲小结 ——\n\n# 15 军事篇:如何管理因队士气\n\
    \n华杉话解读孙子兵法30讲 2018-07-02 进训练营\n\n15 军事篇:如何管理因队士气 11:24 10.44 MB\n\n# —— 重敲解金句\
