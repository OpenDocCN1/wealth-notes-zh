    \n> —— 重点解析金句 ——\n孙子曰：‘我专为一战，敌分为十，是以什其众，夫夺人之众者也。’\n\n这一讲，我们开始解读《孙子兵法》第六篇《虚实篇》，讲了三个层次：\n\
