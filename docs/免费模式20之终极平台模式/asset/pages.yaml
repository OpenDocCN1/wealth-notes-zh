    具体怎么玩呢？5年免费吃那不得到 ಒ 啊，难道玩的是众筹？


    首先玩众筹一般的餐馆是怎么玩的呢？一般都是你投资多少给你等额的餐厅消费券然后每年给你一定的分红，比如，投资1万给你1万的餐厅消费券，然后每年给你1%利润分红对吧。


    但是这家海鲜餐厅，他说，我玩的不算是投资也不算是众筹。


    简单的说，你投资3千块，我给你3千块的餐厅消费券，5年之内又效，5年后我返还你3千块，如果你投资5万块，我给你5万块的餐厅消费券，5年以后返还你5万块，不就是相当于5年免费吃吗对吧。


    对于用户来说，假设你把1万块放在银行，5年你是变不出1万块的对吧。但是你放在我的餐厅，你可以得到1万块的消费额度。


    对于公司来说，为什么要这么玩呢？


    获得现金流是一个原因，因为他这笔钱是用于开连锁店的，用户投资的这个钱可以在他们公司旗下的任何一家餐厅使用。


