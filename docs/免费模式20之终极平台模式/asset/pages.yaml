  md: '一个全年的联盟抽奖活动，邀请本地的商家参与进来。我们至少有半年的时间来找赞助商，这 50 多万就很容易收回来，没准就直接赞助了 100 万，那我们就赚了，当然给赞助商也要有一个全年的赞助。


