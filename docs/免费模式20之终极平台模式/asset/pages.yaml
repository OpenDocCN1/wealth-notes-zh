  md: '首先这里反应出了一个消费者的心里，大部分人都是爱占便宜，喜欢随大流看热闹，这些免费的东西大家都爱，也就是为什么很多地方，用了一个免费的策略就像开了挂一样，只不过好好的一个抽奖活动，就这样被玩坏了，抽奖这个活动要​​​是稍微修改一下，用在正道，也就是不要坑人的地方，抽奖和免费这种策略可以演变出很多模式，引流的威力是相当大的，这个在后面给大家分享。


    但是要告诉大家的一定要把学来的东西用在正道，不要去做那些不正当的项目，同时也告诉家人，人都是为了自己的，谁傻了会免费给你这么多东西哇，在看到各种免费各种赠送活动的时候要擦亮眼睛，最好不要去参与。


    # 19、5 大“免费策略”让你的微商业绩快速提升


    免费是一种诱惑，免费是一种策略，免费的背后是人性，人性都是贪婪的，渴望免费，渴望获得更多的东西。几乎大大小小的企业都在玩免费策略，像腾讯、淘宝等平台都是玩的免费商业模式。


    曾经有一个聪明的犹太商人经营灯油，刚开始没有市场，但他通过一个“免费赠送灯”的策略迅速引爆了市场，然后向这些用户去销售灯油，在极短的时间内轻松占领了当地的灯油市场，这就是免费的力量。


    免费是最有力的词汇，任何的模式都可以用，当然微商也可以。一旦正确使用它，你的市场将被快速的打开，你的客户会源源不断的增加，你的业绩也会持续不断的增长。


    # 1、免费体验'
  merge: -1
  img_proc: true
- pgno: 52
  md: '如果你站在客户的角度看问题，你就会明白：当你被邀请去购买一个从未接触过、从未了解过 的产品时，你的内心是担忧的，担心产品质量，担心产品功能。但是如果能够免费试用，客户的接受度就更高，降低了客户的购买风险，他也不会担心钱财被浪费及产品质量。

    当你的销售建立在免费体验的基础上时，你所得到的回报率将是全部现金直接购买的 2 倍以上。免费体验是一个非常强大的销售技巧，可以通过向目标客户群体邮寄体验装的方式，来实现这一策略。


    比如面膜，你先免费让客户体验 2 片，客户体验完受益了，肯定会找你继续购买产品；保健贴，你先给客户免费体验 2 片试用装，他切实的接触到产品，再让他购买产品；空气净化器，你可以先让客户免费试用
    7 天，7 天后客户觉得满意可以直 接购买，不满意不需要一分钱。

    如果你的产品可以提供体验装，建议你让客户免费试用，通过体验的方式客户的响应度会更高。免费送体验装也是微商动销最快的方式，你把产品送给身边的朋友体验，体验好了最终购买率肯定高了。


    # 2、免费赠品


    前几天还写了一篇关于赠品营销策略的文章，讲的就是微商如何利用赠品营销提高业绩。如果你 的产品很有吸引力，再也没有任何事情比“免费赠品”更能提高销售业绩了。其中的关键就是“免费赠品”必
    须很有吸引力，必须拥有价值，必须是跟客户需求相关联的。


    在选择“赠品”前，你需要回答一个问题：如果将这个“赠品”出售的话，是否有人会去购买它？一旦你为客户准备好一个非常棒的产品，同时附赠一个“免费赠品”，客户的满意度自然会更高。'
  merge: -1
  img_proc: true
- pgno: 53
  md: '当然你可以尝试多种“免费赠品”，不断地测试，最终看哪个赠品客户的接受度更高，然后选择一个最好的赠品。


    # 3、免费礼物


    很多微商不懂维护客户，也不知道老客户的重要性，往往把老客户疏忽了，最终老客户不断地流失，可见这种微商做起来的很累的，因为他需要持续不断地去找新客户，没有老客户的复购及转介绍。当然如果你把老客户维护好了，客户的复购率及转介绍对你来说都是一笔大财富。


    你可以定期通过一些免费礼物来增加客户的好感，增强客户的满意度，比如说客户生日送个蛋糕。让客户对你的情感越来越深，客户会觉得这是一个惊喜，会觉得你非常的细心，会觉得你非常的关心他，甚至你们之间会成为一种朋友关系。从买卖关系晋升到情感关系，从客户关系晋升到朋友关系，这也是做服务的最高境界。


    你也可以在客户购买完产品后，持续地给客户提供一些价值，比如免费的护肤知识，贴心的养生常识，实用的职场经验等。你做护肤品，可以持续地跟客户分享护肤常识，夏季美白常识，冬季补水方法等；你做养生产品，可以持续地分享一些养生知识，健康常识，保养技巧等。这些对客户来说就是价值，你持续地分享，客户肯定记得你并会感激你，肯定也愿意持续地找你买产品并介绍朋友购买。


    # 4、买一送一


    记得有一次去商城买衣服，两个店铺一个打五折促销，另一个买一送一，最终我选择了买一送一的这家店铺。为何呢？因为觉得占了'
  merge: -1
  img_proc: true
- pgno: 54
  md: '便宜，觉得够实惠。实际上价值是一样，都是打五折，但是给客户的感觉不一样。


    大多数情况下，买一送一比打五折的效果要好，客户接受度会更高。打折客户不会觉得占了便宜，只会在内心认为产品换季或 Lad其他原因在降价，当然产品在客户心中也大打折扣了，如果是买一送一，客户就会觉得占了便宜，购买率也会更高。


    很多微商品牌都在围绕“动销”下功夫，实际上买一送一就是一个非常好的促销策略，用好了销量肯定提升。如面膜买一盒送一盒，保健贴买一盒送一盒。产品的赠品对于销售来说非常重要，但多数情况下，大多数的客户很难去理解和接受你所提供的赠品，因此可以适当的改变一下策略，以买赠的形式送赠品。


    # 5、免费抽奖。


    像啤酒、饮料等产品都利用了抽奖策略在做营销，哪怕中奖几率不高，客户也愿意去尝试，也希望自己是幸运儿。因为人性都是贪婪的，渴望得到自己得不到的东西。免费抽奖也是一个非常重要的营销策略。就像人们买彩票一样，总希望自己中奖一样，有一种对美好结果的向往。通过免费抽奖不仅增加了有趣好玩性，还会带来大量客户的参与，最后提升业绩。


    比如护肤品，你可以在每一箱产品中设置一个奖项，类似于现金红包，苹果手机，IPAD、等额产品等奖品，代理的补货速度是不是会更快，参与度也高。如果做招商活动，现场设置一些金蛋，金蛋里设置很诱人的奖品，让现场成交的代理享受砸金蛋的机会，最终成交'
