  md: '身上的广告在短短几天的时间全面招商完毕，不仅把投入的成本全部赚回来，还额外整合了一百多万的礼品。


    有一个年轻的小伙子，他与公交公司签了一批三个月短期的车身广告合同。现在正在对外进行招商，凡是合作的都可以得到以下的优待:车身广告数量有一百部左右，最低 4000
    元 1 部，每部的制作费要另外加 1500 元，总的周期三个月，合同期到 3 月 1 日，重新招标的是 5 月份，也就是说理论上可以发布 5 个月，但是这个必须在这几天之内租出去，否则后面更不好租了。


    真要是按照传统的方法去做，很难在短短的几天时间把这价值 50 多万的车身广告全部租出去，那我们是如何按照资源腾挪的模式卖出去的，而且商家都主动找我们合作，有的还要主动加量，是什么样的魔术，让这些老板瞬间改变了他们的主意？


    共分为四步：


