- pgno: 65
  md: '变不了它拥有巨大爆发力的事实。


    今天分享一个把分销模式嫁接到实体店的项目，其实也就是转介绍策略，不过现在科技这么发达，就不用顾客背好你给的话术到处去说了，一切都可以全自动完成。


    当初是一个开在商场五楼的烤鱼店，烤鱼店装修很大气，倒是商场看上去半死不活的状态，味道是非常过关的，客户评价也很高。问题在于客户分散，人流量不大导致很难播出去，况且你要好好吃到人人吃过就到处去说的话是不现实的，这就需要用上一定的方法。


    当时死马当活马医，各种方法测试一下不现实的话马上就停止，一直留到最后的还是一个分销模式，效果肯定是杠杠滴。


    当初设计的是一个会员卡的二级分销，也就是老顾客的会员卡会绑定一部分二级会员，可以赠送给朋友，二级会员也可以享受一定的会员特权，在二级会员消费的同时，VIP
    也能得到很多好处。


    当初把这个卡叫做 VIP 亲情卡，首先客人到店，凡是充值两百元的顾客，赠送六十元的额度，每次抵用现金二十元，同时赠送五张 VIP 亲情卡，可以赠送给朋友，朋友持亲情卡到店可以赠送三十八块的烤鱼一份，其它消费一律九折优惠，如果客人需要买套餐这条烤鱼可以抵用现金三十八元。


    大家都知道三十多块的烤鱼，其实成本很低的，关键在于让客人到店，客人到店以后总不会拿着那条烤鱼就带走了，连一瓶水都不买了吧。在一个顾客身上只要保持不亏本就行，这张卡的目的是引流让客人到店，通过什么方法让它成为回头客同样可以设计其它的办法，'
