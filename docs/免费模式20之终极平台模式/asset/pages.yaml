  md: '今天要分享的是矿泉水，据一位老板说，矿泉水的成本大概在 20%左右，换句话说利润还是比较高的，当然也不是每个品牌都有这么高的利润吧。以前也分享过一些关于矿泉水的商业模式，今天分享一个比较亲民一点的，为啥这么说呢？


