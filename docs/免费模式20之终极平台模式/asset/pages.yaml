    用极致的茶杯吸引用户，先解决用户泡茶问题的痛点，然后再通过卖茶叶获得源源不断的收入。所以，好的产品加上好的模式才能赚大钱。所以，这个茶杯估值过亿也就没有什么奇怪了。


