- pgno: 32
  md: '技，倭瓜式泡茶的一个杯子。在这里要和大家说的一个比较好玩有趣的营销套路，就是他在手机的软件上面搞了一个喝茶排行榜，就是你喝一杯茶就记录一次，记录你用这个茶杯喝茶的杯数，这招有什么用呢？除了让喝茶的爱好者能找到知己以外，另外一个就是让你们多喝茶。因为喝得越多排名越靠前，你就能拿第一，明白了吧，这些人为
    了拿第一，是不是要用这个茶杯多喝茶？也就是说搞这个排行榜，就是让你有一个攀比竞争拿第一的心。最好你一天干个十几杯更好。


