    比如今天和大家分享一个比较好玩的跨界打劫的模式，幼儿园和农场相结合的模式。


    正常来说，幼儿园基本都是开在居民楼的附近，一天都是在学校里面，搞一些游玩的设施让孩子玩。但是，偏偏有人把幼儿园开在农场里面，在国外，越南，直接搞一块地，然后建设一个农场，然后把幼儿园开在农场里面，但是他们这种投资比较大，因为他们都是经过规划设计的。


    但是在国内，有人把这种模式运用起来，也玩农场幼儿园的模式，彻底颠覆传统的幼儿园模式，把幼儿园开在农场，这种模式，当然有人赞同也有人反对，但是他们就这么干了。


    有一家干幼教的公司，搞了一个几十亩的蔬菜种植基地，种植各种各样的蔬菜水果，幼儿园小孩子吃的就是他们的基地提供，看得见的绿色蔬菜啊。不仅种菜，还养鸡，然后老师就带这些孩子在基地上课，近距离的接近大自然，讲课内容大家都懂的了，就是这些大自然的东西，当然还举办各种各样的活动。说句难听一点的，就是小时侯农村小孩玩的事情，但是现在城里人感兴趣啊。


    还有另外一家幼儿园，同样是农场加幼儿园的模式，同样搞了几十亩生态农场，然后在旁边建了一个幼儿园。这个项目得到了当地政'
