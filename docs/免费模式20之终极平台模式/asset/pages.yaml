- pgno: 68
  md: '赚钱，因为中间有一个租金差，赚的就是这个钱。


    那么还有另外一种专玩共享教室的就是不论你要举办会展、沙龙、Party、小型演奏会、发布会还是用开放式厨房录制美食节目，或者你想上公开课、小班课甚至是自习都可以。


    也就是说他们的教室有不同的场景，不同的设备，完全满足你，这种就是针对社会上各行各业的，对于这些创业者来说，他可能一个月只需要一次或者几次而已，所以他们会有一部分老板会选择这种模式，因为可以降低成本啊。


    那么说完专玩共享教室的，下面再和大家分享一下业余的是怎么玩共享教室的，专业玩共享教室的基本上都是按时间收钱的，那么业余的又是怎么收费的呢？


    其实业余玩共享教室的比专业的还要猛，直接免费。那么免费怎么赚钱呢？下面通过一个案例告诉大家业余玩免费共享教室的真正核心秘密。


    有一家做托管的公司就玩了一个免费共享教室的模式，大家都知道，做托管的基本上都是有几间教室，专门供这些孩子放学以后到托管机构学习啊，玩啊对吧。但是，现在是暑假了，学校也放假了，所以教室就是闲置出来的，但是，放暑假又是一个课外培训的高峰期，什么
    chess 书画啊，舞蹈艺术啊等等。那么对于一些老师来说，如果想在这个时候搞培训的话，是不是需要一些教室啊？因为有一些老师仅仅周末或者放长假才做培训的啊，所以他们有空闲的教室，而你们又需要教室。'
