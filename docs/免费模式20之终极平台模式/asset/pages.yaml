  md: '惠，长期持续性的循环。


    # 23、一家小小水果店运用免费送，半年净利润 30 万！


    案例的重点是开拓思维，而不是生搬硬套来使用。


    今天要发的有一定的可执行性，可以举一反三，灵活多变。


    开水果店的年轻人小李，店面不大，也就 30 平米左右吧，位置是小区附近。小李开的水果店并没有什么新奇，做了预算进货渠道等等，核算起来有钱赚，于是装修，进货等等完毕就开始营业了。


    经常做促销，打折，等等活动，然而生意还是一般般，因为别人同样会这样。大家见怪不怪了，都会想打折的一般都是些快放坏的水果吧。


    苦撑 3 个月后，一个点子忽然崩出来，小李决定试试！


    我们来看他怎么玩的~


    免费送！对，又是免费？不要急我们慢慢看


    小李在门口放了个牌子，每日猜水果，时间上午 9 点~下午 17 点，每天限量一百斤！猜对重量免费送！限量一人猜一次，两斤以内，一两内差别均做数！


    这下好，那些大叔大妈一看到有免费送，吃瓜群众不大一会都围了过来，经常买菜拿东西的人，掂量掂量多重应该是有些点把握吧，许多人已经开始跃跃欲试！当逆时，小李宣布，今天要猜的水果是又新鲜又甜的南丰蜜桔，刚从农民手里收来。


    猜中了免费拿着，猜不中就花钱买下！价格只要 1.5 一斤！这下倒好，这么漂亮的蜜桔，别人店铺起码都要卖 2.5 元，他这里就猜不'
