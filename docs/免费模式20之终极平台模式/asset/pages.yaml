  img_proc: true
- pgno: 150
  md: '可以赚钱啊，还有一些啤酒啊，饮料啊都可以赚钱是吧，但是，偏偏有很多人就点一个菜。


    那么搞了2天以后呢，简单的改了一个策略，结果亏钱变赚钱。


    因为前面没有限制，所以引来都是屌丝，后面，只加了一个条件，那就是办会员卡，你充值49块钱，成为我们的会员，就可以点1元的菜，而且有时限限制，就是活动7天内。而且你充值会员，活动结束后我还额外赠送10个1块钱的菜，但是每次只能用点一个。


    那么通过办会员卡的模式，直接过滤掉了一部分真正贪小便宜的人，得到的是一些精准的用户。那么这些用户来了不会只点一个菜，当然，如果49块带来的用户还是一群贪小便宜的人，你再提高会员费就可以了，会员费越高用户越精准，这个就是过滤的好处。


    那么大家可以看一下，办这个会员卡有什么好处呢？对于用户来说，如果你经常去这家餐厅吃的，对你来说没有坏处吧，如果你是新用户，49块也不算多。重要的是1块钱的菜太有吸引力了。


    那么餐厅怎么赚钱呢？1块钱的菜只要是个正常人都能知道，绝对亏本。但是他通过办会员卡获得一些精准用户，这些用户除了点这个菜还会点一些其他的菜和一些酒水等，这些可以赚钱吧。


    另外，那个10张卡对吧，就把你锁定在这个餐厅10次，也就是说这个活动结束以后，你还会来10次，当然你不来也可以是吧。你来了，老板就有钱赚，你不来，老板也不亏。为什么？


    因为49块的会员卡，7天就算你天天来，7个菜，成本肯定不到49块吧。另外这些都是精准的用户，会带来一些其他的消费，后'
