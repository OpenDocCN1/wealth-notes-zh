  md: '呢？是不是无条件的免费吃呢？当然不是，只要在活动期间，你带上一位朋友，鸳鸯鱼头我给你打 5 折，带上两位朋友，鸳鸯鱼头打 3 折，带上 3 位朋友，价值
    88 元的鸳鸯鱼头免费。


    那么，大家看了就知道怎么赚钱了吧，你带上 3 位朋友，总共 4 个人，难道 4 个人就吃一个鱼头？不可能吧，仅仅吃一个鱼头你好意思叫啊，除非你的脸皮够厚。


