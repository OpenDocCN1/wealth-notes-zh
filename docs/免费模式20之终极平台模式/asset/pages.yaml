    # 9、一个茶杯储备过亿背后真正赚钱的核心商业模式


    喝茶是中国人特有的一种爱好，因为喝茶有很多的养生保健的功能，所以卖茶叶的人也特别多，茶叶这个行业其实也算是一个利润比较高的行业。所以在去年就有很多的公司通过众筹茶树啊众筹茶园众筹茶基地等，通过认购的模式来降低中间的环节，让消费者真正的拿到低价高品质的茶叶。'
