    我们把这 100 部车子切割成三部分，每部分是 33 台，3 个部分，就是三个商家也就是 33×（4000+1500）=181500 元，找到商家后给他做一个全年的品牌推广计划，由于是一百部车子，总价值
    50 多万，不可能让一个商家全部来承担，这几天时间就把这些广告租出去，这个难度非常大，所以最终我们决定把这 100 部车子进行切割，这样方便我们来招商，反正总数不变就行了。


