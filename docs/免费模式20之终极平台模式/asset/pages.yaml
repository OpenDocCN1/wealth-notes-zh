    所以今天就和大家分享一下实体店方面的众筹模式的玩法吧，其实当你了解众筹的基本核心以后，思路基本都是相同的。

    那么关于酒吧的众筹以前最基本的玩法就是，酒吧拿出一部分股份，然后发起众筹，比如充值5000块，送你价值5000块的消费额度，然后给你一定的股权，然后按月给你们发分红。

