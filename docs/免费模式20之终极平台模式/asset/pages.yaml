  md: '为用户提供你自己的独特价值，只要用户觉得你有价值，自然而然用户会买单对吧。


    # 那么什么样的顶尖模式能在 2017 年轻松的长久赚大钱？


    这个问题是很多用户关心的问题，那么想轻松的赚大钱，大家首先有解决的是两个问题：


    +   - 第一，你要有足够多的用户

    - 第二，你能把用户留在你平台


    就是围绕这两个点来展开，关于用户的问题，你就要想，我能通过什么样的方法能把大量的用户吸引过来？


    并且用户来了以后我通过什么样的模式把用户留在你的平台上面，只要你能把大量的用户留在你的平台上面，即使现阶段不赚钱，但是这也是一笔财富。为什么这么说呢？


    因为有了用户，你以后可以不断的销售产品给用户，不断的开发用户需求，挖掘用户的终身价值，有了用户就不怕没有钱，这也是为什么很多人花钱买用户的原因。


    简单的说，不管你做的是什么项目，如果你想长久轻松的赚大钱，那么你就要把原来经营产品经营项目的思维变为经营用户的思维。


    一切以用户为核心


    我觉得经营用户才是长久轻松赚大钱的最佳模式


