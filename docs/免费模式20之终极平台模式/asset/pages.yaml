- pgno: 157
  md: '产品打折，要么就是送一些小礼品，因为这种模式对于消费者来说已经是司空见惯了，根本没有什么吸引力。


    那么，今天和大家分享一个同样是玩会员卡充值的，再对比你玩的玩法和他们的玩法区别在哪里，你就知道为什么你赚不到钱而他们却能赚到钱的原因。


    这是我的一个朋友操作的一个案例，按理说我不应该分享出来，因为这毕竟是他们还在用来赚钱的秘密，但是呢，不分享又不是我的个性，所以还是和大家分享这里面的一整套思路。


    他是做什么的呢？他是做修车美容养护的，和很多做汽车养护的一样，因为这个行业现在也竞争很大，原来的生意也只是一 般般，但是后来他们玩了一个充卡模式以后，生意立马变得火爆起来。


    为什么呢？因为，他通过办会员卡，锁定了一大批客户的后续消费，客户都被他锁定了，生意能不好吗对吧。那么他是怎么玩会员卡的充值的呢？


    他搞了一个会员卡充值的活动，充值 5000 元送 20000 元，那么当你看到这个活动是不是被吸引了？现在充值 5000 元得 20000 元啊，一般来说，很多
    人搞会员卡充值是反过来玩的，一般都是充值 20000 元送 5000 元，或者是冲 5000 送 500 这种模式。


    如果你的活动能吸引用户，那么你就成功了第一步，至少用户的眼球被你吸引过来了，那么他这个充值 5000 送 2 万是怎么送的呢？按照正常的思维，不仅不赚钱还要亏本啊。


    那么下面和大家分享一下，他是怎么充值 5000 送 2 万不仅不亏'
