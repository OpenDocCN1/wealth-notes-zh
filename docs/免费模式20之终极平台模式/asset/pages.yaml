  md: '户为主。畅总就对外（当地各个公司）发布了一个消息，30 元一天有没有人住原价 380 元的三星级酒店，并且做了了解，结果几千人报名；60 元一天有没有人住原价
    380 元的三星级酒店，结果还有几千人报名；畅总就又往上拉升了一下，说 100 元有没有人住，结果还是有几千人报名要来住。


    畅总就发现，客户的住店需求人群还是很大的，相当一部分人对长期住酒店有刚需，他们自己的招待比较多，原来这部分人和酒店谈合作，打打折，也省不了多少钱，压根没想过可以有
    100 块钱一天的三星级酒店。


    这时候畅总就出了一个模式，就说，一天 100 元钱，你交三年的钱，去个零头，10 万，这个房间就归你用了。房间服务完全由酒店出。随后畅总召集这些意向客户开了个会，每人限订一间，470
    间房间一抢而空，都订走了。一个订房间的老总对畅总讲，畅总，我一年的房间费每年下不了 7 万块钱，在这里三年才 10 万，这个政策对我们住酒店需求大的人太好了。接下来畅总做了一个更可怕的举动。凡是订我酒店，交
    10 万的客户，酒店分三年，每年 33000 元，把 10 万每返还给你。相当于你交 10 万元当三年押金，房间免费住三年。


    具体怎么做呢？


    畅总发现，交 10 万元的客户也不是天天都住，正常只有三分之一的时间会住，一年也就住四五个月，房间大部分时间会闲置。畅总就对 vip 客户开会说，这 10
    万怎么返还呢？除了充卡 10 万元 vip 客户，酒店是不是还有大量的散客，正常酒店房间费是 380 元一天。'
