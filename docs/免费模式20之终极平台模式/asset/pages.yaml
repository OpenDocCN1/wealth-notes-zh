- pgno: 66
  md: '有的地方什么活动都不做不一样是有很多回头客。


    但是这张卡的关键不在于这里，在于会员亲情卡所有的消费有百分之十的额度是直接奖励到 VIP 卡里的。只要朋友持有你送的亲情卡，每消费一百块，你卡里都会多出十块的额度。


    那么客人也不会有推销的嫌疑，因为他赠送的卡是实实在在的东西，一条烤鱼，还可以打折。所以在设计的时候我们也需要站在顾客的角度为他考虑一下，量身定做方案是最好的。那么客人来到店里明明就要消费这么多钱，为什么还要赠送那么多的东西出去呢？大家有没有想过，凡是赠送出去的东西，都是要客人再次来消费的时候才生效的，客人Năm来消费的话那就是一张塑料卡，我们就当没送过，不损失什么，但是这样做能够迅速传播，客人到店以后还可以引导更多的消费。


    理论上也当然有来了拿着烤鱼就走的人、但是来了一次消费三四十以下的人是非常少，可以忽略不计的，那么如何找到高消费的人群，如何想办法留住顾客，第一批顾客从哪里来都可以设计不同的方法，这些在后面的时间很大家分享。


    # 25、免费共享教室源源不断获得客户被动赚大钱的核心商业模式


    这是一个资源过剩的时代，有非常多的资源其实是白白浪费掉了，但是有时候资源浪费就会导致行业的成本过高，这对于一些刚创业的朋友来说并不是好事，因为意味着创业的成本增加了。


    随着各种共享经济模式的到来，共享教室也跟着来了。今天要和'
