    他们搞了一个免费试吃，不是一次两次，而是经常搞，扫码一次试吃，永久免费。什么意思呢？真的永久免费吗？真有免费的午餐？他们是如何赚钱的？


    很多人搞免费试吃一般都是在自己的商店里面，如果没有的话，一般都是在大街上搞免费试吃活动，但是，这种免费试吃一般都是量非常少的，让你尝一下味道而已。


    但是他们搞的免费试吃，不是在自己的店里面，因为他们没有店面，也不是在大街上，那么他们在哪里搞免费试吃呢？


