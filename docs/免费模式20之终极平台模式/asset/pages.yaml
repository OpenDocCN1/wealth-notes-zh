    # 49、揭秘国内一家海鲜餐厅让你免费吃 5 年的赚钱套路


    现在越来越多的行业都开始尝试新的模式去发展企业或者项目，大家接触比较多就是让消费者变成投资者和宣传者。


    也就是说，现在很多人干项目，基本都把消费者拉进来玩，让消费者参与项目。那么如何才能吸引消费者呢？


