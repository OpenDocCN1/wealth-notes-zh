    # 14、餐饮店免费加盟让加盟商爆棚，利润多赚几倍


    大家都知道免费的模式只要你运用好，威力绝对很大的，关键是要落地，也就是要能够运用。今天就来分享一个免费加盟赚钱的例子，绝对会让你眼前一亮，希望各位能够举一反三。


    那是我堂哥开的一个非常有特色的烧烤店，在城里比较偏僻的地方，虽然位置不是很好，不过味道正宗。老顾客非常多。因为经常有人来加盟的事情，原本觉得加盟也不好管理，自己的经营能力有限，一直都拖着没搞。但是人问多了就觉得还是搞个加盟，其实也就是收学徒，卖配方而已。


    刚开始做的时候，一个配方两万块不到一点，其实做我们这个特色烧烤的卖配方的人也比较多。自己不卖，别人同样卖，到时候同样会有很多同行，但是卖配方的人多了，价格战就开始了，你卖两万我就卖一万五，另外有人看了那我就卖一万算了。


    跟我堂哥一直考虑了一个晚上，要不然免费加盟怎么样？


    首先表弟非常的怀疑，这简直是培养竞争对手呀，同行太多了，自己就没得卖了，因为这只是一个简单的收学徒，又没有合同，加盟的区域保护之类的。其实我自己也没有多大信心，要不以可以试几天吧，自己不搞，别人搞，同样是竞争对手。磨磨蹭蹭终于拟订了方案，我们就打了一个免费加盟的牌子，当然来问的人是非常多的，大家都很好奇，倒是大家都明白，肯定会有收费的地方，没有真正的免费这种'
  merge: -1
  img_proc: true
- pgno: 43
  md: '事情。


    但是我们的回答是：绝对是真的免费加盟，你来我店里做学徒，我一分钱不收你的，你想学到什么时候就学到什么时候，技术是传给你，如果你需要调料的话，可以来我店里买，三百块一桶。当然买不买是你自己的事情，调料都是成品，拿去就用，味道保证和我们的一模一样。


    大家明白了吧，技术这个东西是非常简单的，看都可以看会，但是配方就不一样了，那我们就免费教技术，赚调料的钱。


    这样的好处非常明显，牌子一打出来，询问的人非常多，转化率也是非常高的，因为门槛低呀，之前要两万块才做出的口味，现在三百块就做了，当然你要出两万块买个配方也是可以的。


    那我们如何通过卖调料来在一个学徒当中赚到两万块呢？


    三百块一桶的调料，成本不会超过一百块，也就是说我们每卖出一桶就有两百块的利润，也就是需要卖一百桶才可以赚到那么多，我们来算一下，调料是烧烤必需品，一般的店铺基本是五天左右一桶，也就是大约五百天的利润可以达到两万块，生意更好的话还不止这么多，大多数情况一个店铺的生命周期是远远大于五百天的，那么后续只要他店铺还在，我们就有收入，一直收到它关闭的那一年，普遍来说，赚的钱是不止两万块的。


    这就是把一生一次的生意变成一生一世的生意，一直都有被动收入，同时还降低了加盟的门槛，可以在很短的时间内抓取大量的加盟商，后面的结果是开店利润大部分来调料，每天我堂哥最多的事情也'
  merge: -1
  img_proc: true
- pgno: 44
  md: '就是调佐料，就算是哪天我们的店铺倒闭了，那也没关系，他也不用干了，在家里调佐料就可以了。


    这就是免费的威力，这种模式的运用是非常广泛的，希望能够举一反三！


    # 15、实体店用一张月卡锁定顾客，一石二鸟打劫同行和面包店


    前久跟一个朋友聊策划的事情，说到了他帮一个冷饮店做的事情，感觉这个方案的确做得非常好，分享给大家探讨下，虽然不是我自己做的，里面的方法也是一看就会，都差不多多了。


    当初是在一个市中心开的冷饮店，位置非常好，铺面也还是很宽敞，只不过是自己做的小品牌，虽然味道装修都不错，各大品牌的甜品店之类的<|start|>起来对这种自己没有品牌的店铺，打击是很大的，位置好吧，每家都想来瓜分点市场。这个朋友给出的方案是什么呢？


    用包月喝冷饮的方法来锁定顾客，当然价格比零售就低的多。


    这里必须要说的一点是:大家看到了打折这个方法，但是单纯的打折是最没有效果的，伤敌一千，自损八百都不足了。很多人会有个想法是不是冷饮十块一杯一天卖一百杯，降价到五块是不是就可以卖两百杯、无限降价就卖出更多了，这个是很错误的想法，打折的目的是为了锁定顾客，打造自己的后端，在一个个人身上赚更多的钱（后端这个概念在后面给大家讲），人就那么点，无论怎么打折，人还是那么多。'
  merge: -1
  img_proc: true
- pgno: 45
  md: '冷饮作为一个单品，加上各种甜点点心，pr掉那些不好卖的品种，留着销量最大的几款就可以了。这也是有自有品牌的好处，加盟的那些大品牌你要这样做估计是没有哪家会同意的。甜品和点心之类的也就这是这家店的后端了。


    冷饮怎么包月呢，一百二十块就可以包喝一个月，每天一杯，当天不来领取的作废。办卡的同时，还赠送其它东西，把成本控制在一百块之内，同时持月卡在本店所有的消费都可以打九折。对于喜欢喝冷饮的朋友，一杯奶茶相当于只需要四块钱，还可以赠送礼品在市中心绝对是没有任何家可以做得到的。


    那么商家怎么赚钱，刚才说了，还有后端嘛，如果一个人来包月，首先有一部分人不可能每天都来，没来的那几天也就有一点利润，一个月你往我店里跑个二三十趟，百分之八九十你会买其他的东西，除非东西真的太难吃了，说白了，人流量决定了一切，基本上都是准客户，同时还可以打折。


    另外当你有一张月卡每天都来的时候，身边总会有很多朋友吧，有的时候聊天或者请客喝点东西，客人首选的地方一定是这里，因为他的冷饮还在这里，两个人再买一杯就可以了，那么就会带一些朋友来，也就带动了消费。很多人说，客人买三十杯冷饮是三百块，我只要一百多，是不是损失了本应该赚到的一百八十块的利润？大家要明白，卡的期限是一个月，在没有办理月卡的时候，谁会三十天每天都来买你一杯的冷饮呢？所以大致的意思就是，把冷饮店增加品类做成一个甜品店，通过低价格的月卡把顾客锁定在自己的鱼塘里面，让顾'
  merge: -1
