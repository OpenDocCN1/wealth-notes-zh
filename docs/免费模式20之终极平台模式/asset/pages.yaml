  md: '么一点，纯粹是个塑料壳子加个显示器，一点用处没有，质量更不用说，我就知道他绝对是又给人家坑了。听他一说我这气就上来了，一千二买的，还加了个几十块的手机，一张手机卡，里面有很多话费，具体金额记不清楚了，但是这话费跟没有一样，一个月返那么几块钱给你，最低消费就是好几十，营业厅随便买个破手机都可以送。这种模式我见过，先把东西免费送给你，时机差不多再来刷你的卡，不给钱的话把东西再要回去。


