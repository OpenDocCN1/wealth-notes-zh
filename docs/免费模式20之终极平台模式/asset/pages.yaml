  md: '好，解决了核心竞争力问题，接下来就是通过策略怎么招生的问题了。


    # 第一步、设计包装引流产品


    以免费试学1个月为引流产品，然后对接学校学生！


    设计的引流产品媒介分别是：拼音本、铅笔、橡皮、记作业的作业本等等；这里您可能会问了，招生不发宣传单页吗？我的回答是，是的，整个招生过程没有发过一张宣传单页。


    这里我给您讲一下原因和思路：大家都知道，发传单的效果实在不敌恭维，而且不能保证效果，很多宣传单客户看都不看直接进了垃圾桶，更重要的是无法分辨哪些是精准客户，不能有效的和学生家长建立互动的管道，也就无法做到监控和信任度的建立，所以也是这次招生没有采用宣传单页的原因，但是，没有宣传单页，并不是没有招生信息，而是把招生信息做在了记作业的作业本上，也就是说，作业本是定制的，封面是辅导班的
    LOGO，第一页是招生信息，并设计了一个家长签名栏。


    之所以选择定制作业本，是因为，作业本是学生每天记录老师布置的作业，所以使用周期相对时间要长，可以长时间保留在学生手里，更关键的是，家长每天要根据作业本检查孩子的作业完成情况，相当于长期性的植入式广告，无形中增加了品牌能见度


    具体做法是这样的：


    # 第一步，发放引流赠品


    在学生放学阶段，每个学生免费发一本作业本，然后告诉学生，'
