  md: '客经常都跟商家接触，然后提供更多的东西给顾客消费。也就是分为前端和后端，前端可以不赚钱用来锁定顾客，通过后端来在一个顾客身上赚更多的钱。


    # 16、烧烤店大胆赠送三十元早餐卡，让早晚都排队


    去年表弟回县城里开了一个烧烤店，也就是多年前我的老本行了，因为他自己有一套秘方，一直在做着这个，但是城里租金比较高，竞争也很大，所以就去老家县城租了一个两层的铺子，生意一直都还不错。大家都知道烧烤这个行业，都是在晚上五六点才开工，那么早上的时间就空了出来，本来打算租给别人卖早点，但是两家人用一个铺子是很麻烦的，而且一年也租不了几个钱。倒不如加两个员工，自己做了，可自己做的问题是你做早点同样有很多同行，开始的客户非常少，需要很长的时间来积累。


    每次这些问题一出来呢，他又要叫我去喝酒了，其实这个问题也比较简单，首先是烧烤跟早点的客户群体是差不多的，也就是吃烧烤的人也需要吃早点，另外一个是大家吃早点基本都喜欢在小区附近或者公司附近解决，这个也跟吃烧烤的场景差不多，这样一来就比较容易把吃烧烤的人给引导过来早上消费，当然你总不能告诉客人明天来吃我的早点吧，或者你直接送给他，更是不行，买烧烤送早点这种事情直接就是把自己的钱往外面送，你送他一顿就想让他以后常来那是不可能的事。


