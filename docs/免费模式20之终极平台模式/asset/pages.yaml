  md: '回家让家长签字，明天在家长的陪同下可以去辅导班再领10本拼音本、10支铅笔和一块橡皮，首期发放100本作业本，仅对一、二年级的学生做测试第二天，将10本拼音本、10支铅笔和1块橡皮，统一打包在印有LOGO的手提袋内，送给来辅导班领礼物的家长。家长来了之后，有专人接待，参观教室环境，鼓励家长让孩子免费试学一个月，整个过程没有任何的营销成分，当时共计来领的家长有68位，成交率在80%以上，第一批成功招收55位学生，强调一下，有部分学生家长因为工作原因，或家离学校太远，没有来领，总投入的引流成本大约1200元。


    第二步、做品牌能见度

    1、100本印有LOGO的作业本，可以直接影响同班同学的羡慕；

