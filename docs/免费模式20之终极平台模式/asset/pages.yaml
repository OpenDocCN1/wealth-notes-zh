    # 22、小酒吧玩跨界合作共赢，3 个月赚 60 万！


    说个资源整合的营销案例，算是一个入门的方法，不过很好用，这个方法可以带入到各个行业。许多小伙伴没玩过资源整合，不知道怎么开始套用在自己生意中，其实无非就是合作，交换利益。


    我一朋友叫辛辛，身材高挑，长相出众！是个典型的美女，前年跟个闺蜜开了个小酒吧，走的是格调路线，酒吧的装修风格不错，再放些轻音乐很有意境。但习惯性的营销手法并没有使生意好起来，比如硬性广告，打折，促销活动等等，生意依然还是稀松平常的。


    后来她经过高人指点，整合了别人的资源，虽然本质还是促销打折，但换了个方法效果截然不同。辛辛的酒吧卖酒水利润还是可以的，成本也就是 20% 左右，也就是说消费
    1000 块钱，最少能赚 800 块。


    这样的利润在酒吧行业中并不算太黑吧，甚至卖奶茶的利润都有翻倍利润。让点利拉生意肯定是可以的，我们来看看辛辛的整合让利方式怎么玩的吧。


    她注意到许多年轻人晚上在酒吧喝完酒小聚后，总会去吃宵夜，光顾最多的就是小龙虾店了，而小龙虾店的生意也是非常火爆，利润也非常可观。这事辛辛就上心了，她找了离她不远最好的那家小龙虾店老板谈。'
