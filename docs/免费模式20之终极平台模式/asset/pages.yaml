- pgno: 70
  md: '众学生，就像一个明星有很多粉丝一样，你把一个明星请到你那里去，这些粉丝是不是都乖乖的跟着去了？


    所以，我免费提供场地给你们，我要的就是你们帮我带来精准用户，一个老师带来几十个，几十个老师呢？因为这些学生都是要来到我的场地来上课，那么家长是不是也要来？


