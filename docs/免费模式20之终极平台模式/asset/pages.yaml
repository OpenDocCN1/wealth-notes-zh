- pgno: 162
  md: '主要是花钱租车位用。这种也就是人生的第一重境界，看车位就是车位。


    但是，如果业主既不想买也不想租，那怎么办呢？还有另外一种模式，车位业主免费用还给你钱，也就是说原来是要花钱租车位用的，现在不仅免费用还赚钱，爽吧，原来你一个月要花几百块租车位，现在不用钱了，我还倒贴几百块给你。到底怎么回事呢？有这么好的事情？


    那么他们是怎么玩的呢？这就需要用到人生的第二重境界，看车位不是车位。而是变成一个聚宝盆，聚宝盆是什么？就是聚财的。


    所以，物业公司跨界和金融公司合作，金融公司搞了一个车位的理财产品，你现在购买这个理财产品，车位你免费用还可以获得收益。


    比如原来是 10 万块的一个车位，现在你交 10 万块给我，比如是三年或者五年，然后这段时间你免费用车位，而且我还给你 4% 到 7% 的预期年化收益。


    那么对于用户来说，这个收益就相当于把钱放在银行的收益，但是他可以获得免费车位的使用权，一年 5000，三年就是一万五了。


    对于用户来说，3 年后本金返还 10 万块，而且还获得一万多的收益，车位还免费用。这还不是最重要，关键是 3 年以后这个车位升值了，大家都知道城市的车位是有升值功能，要不然那些土豪会砸钱进去买一个车位啊。


    所以如果说三年以后车位升值了，比如原来这个车位是 10 万块，3 年以后涨到 15 万了，这个时候如果你突然想买这个车位了，你仅'
  merge: -1
  img_proc: true
- pgno: 163
  md: '需支付原来的10万块即可，也就是说按照原来的价格购买。那么这个時候，如果用户把车位买进来再卖出去，是不是又赚了5万了对吧。所以，这种模式对用户来说，好像还是蛮爽的，稳定的收益，免费的车位。


