  md: 'B 套餐，充值 5000 块，除了和上面的 一样，另外成为会员起满一年加送 200 斤水果或者超值礼品或者 500 块红包。这个套餐就相当于 10 年免费吃水果，因为，每年
    500 块红包，十年不就是 5000 块？


