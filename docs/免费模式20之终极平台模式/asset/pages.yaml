  md: '大致意思是，我酒吧搞活动，消费 1000 元送 1000 元的龙虾消费券，就送你店里的券，给你引客人来，你得算我成本价。


    龙虾店老板有犹豫啊，平时龙虾卖 128 块每份，这一千块钱可是差不多 10 份了，给你成本价我有什么好处？


    苡苡说，老板你算算一份龙虾成本是多少钱，128 块钱一份的龙虾，2 斤左右成本应该就在 50 以内吧，这个成本还包括了厨师水电等费用了。10 份也就是 500
