  md: '所以，他们通过这种模式直接覆盖了 10000 多家幼儿园超过 200 多万的精准用户，有了这些精准用户可以干的赚钱事情其实还有很多，对于幼儿园来说，你们的这些老师想不想提高技能？我们这里有专门的培训你要不要来？我们还有很多专门为教师开发的教材你要不要买？


