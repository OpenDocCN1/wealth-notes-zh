    # 53、零加盟费零产品利润于了138家便利店是如何斩获1.1


    # 亿融资的核心商业模式


    今天直接进入主题和大家分享一个便利店的商业模式。6个月的时间干了138家便利店，并且获得了1.1亿元的融资。


    很多人认为现在的便利店竞争非常大，而且赚不到钱，因为现在的便利店实在太多了，几乎几百米就有一个。但是有一家公司在竞争激烈的情况下干了一个便利店的项目，而且在非常多的时间里面开了
    一百多家的连锁店。


    能在这么短的时间内发展这么猛，背后一定有一套牛逼的商业模式。那么他们是怎么做到的呢？下面和大家分享一下他们的模式。


    其实他们并不是自己开直营店，而是采用加盟的形式。那么正常来说，传统的加盟店基本都是要交加盟费啊，保证金等等。但是这家公司承诺，永久加盟，无需一分钱即可加盟他们。如果聪明的人就知道。其实他们玩的是整合社群的夫妻店，也就是那种不是加盟的便利店，把这种便利店整合起来，改个logo，就变成了他们的加盟店。'
