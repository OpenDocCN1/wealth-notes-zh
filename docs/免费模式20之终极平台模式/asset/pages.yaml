  md: '# 解读免费商业模式如何让你赚钱？


    免费不是不要钱，免费是一种吃亏、利他的思维方式，只要你的活动有驱动力，只要能吸引客户的眼球并能够让客户达到冲动消费的结果，都是最好的免费模式！白送的不一定被客户认可，所以，在设计免费模式的时候，大家千万不要
    gratuita？进入免费的误区，降低了自己的品牌和利润！


    免费不等于白送，但给人看起来就是白送。


    比如最常见的就是：买一送一、9.9 包邮，充话费免费送手机等等。


    有些人用这种模式做的风生水起，有些人认为这些模式是赔钱的买卖，而买家们多数是迷茫的吃瓜观众。


    那么，免费模式是如何经营的呢？


    举个网络流传的案例：


    充话费送手机。预存 2000 元话费，赠送价值 2000 元的手机，话费一分不少，分 24 个月返还。


    乍一看，免费得了手机没花一分钱。心动吗？的确，我在学生时代就购买过这样的手机，宿舍 6 人集体出资，作为宿舍公共电话使用。


    记得当时免费购手机后，网线还打了 3 折，可以说当时整栋宿舍楼都采用这种模式办的网线。


    这么做划算吗？划算，一笔账下来，宿舍每个人省了 200 多块钱，然后吃了几顿大餐。我们作为消费者，看后认为很划算，认为他们在赔钱做生意，大家想想，他们真的会赔钱吗？不但不会，还会挣钱，这就是我们很多人没有看明白的道理，你送赔钱，别人送就会挣'
