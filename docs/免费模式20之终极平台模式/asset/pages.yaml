    # 26、湘菜餐厅玩转免费模式做营销的核心机密


    想赚钱就必须先赚用户, 想赚用户就必须先吸引用户, 想吸引用户就必须给用户好处, 所以, 当你想赚钱的时候, 你首先考虑的是我能给予用户什么样的一个好处。


    对于线上做电商的来说, 经常玩的就是用爆品的模式, 就是通过一个超值产品来吸引用户, 这个超值产品对于商家来说不仅不赚钱还是亏本的。因为他们并不靠这个爆品来赚钱,
    这个爆品仅仅是一个引'
  merge: -1
  img_proc: true
- pgno: 72
  md: '流产品而已。那么对于线下的实体店来说，又应该如何玩爆品模式呢？或者说如何通过一个爆品吸引用户来消费呢？


    今天就和大家分享一家餐厅是如何做营销活动的，对于很多做餐厅的老板来说，都会有一个拿手的菜，而这个拿手菜就是你们餐厅的卖点，比如，有些餐厅的水煮牛肉好吃，有的餐厅宫保鸡丁好吃，有的餐厅鱼头做的好吃。


    不管是哪一种，对于一个餐厅来说，你一定要找到一个菜品作为你们餐厅的卖点，这样有助于你做营销，而这个菜品就是你们营销的卖点。


    很多干餐饮的老板做活动的时候基本上都是，打折再送你一两个小菜，他们认为这样就是给予用户的一个好处，但是，往往用户不接受你的这个好处。


    那么现在的高手是怎么玩的呢？现在的高手他是把主营的变成免费，而不是送你一两个小菜。为什么他们的这种模式更有杀伤力呢？因为主营的招牌菜，意味着是你店里面最好吃的，而最好吃的免费了，你来不来？


    所以，下面和大家分享一个鱼头餐厅是怎么做营销的。这家餐厅在当地也是有一定的影响力，开了十多年了。他们的招牌菜是鸳鸯鱼头，但是都是辣的，一边是红辣椒，另外一边是青色的辣椒，是他们店里的一个主打的招牌菜。


    然后搞了一个活动，免费吃价值88元的鸳鸯鱼头，一个餐厅店里面的主营菜品免费了，你要不要来尝试一下？那么免费吃怎么赚钱'
  merge: -1
  img_proc: true
