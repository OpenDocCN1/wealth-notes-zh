  img_proc: true
- pgno: 174
  md: '签约合作，美容院为整形医院提供目标客户，关键的是这些目标客户不用花一分钱免费为客户做一个部位的微整形，那有的人可能会问，那什么样的才算是目标客户呢？不可能每一个用户都可以吧。


    其实目标客户也很简单，她是不是经常来美容，卡里冲了多少钱就知道了，然后把这些用户对接到合作商家。


    对于美容院来说，为自己的客户免费提供一个微整形的服务，是不是相当于一个很大的吸引力，客户会觉得很爽。美容院也获得了一个吸引用户的法宝。


    那么，问题来了，免费为用户提供一个微整形的服务，好像美容院没赚到钱啊，整形医院也没赚到钱啊，那还说什么轻松年赚千万？


    因为玄机就在后面，虽然给客户提供一个免费微整形的服务，但是，用户去做了微整形以后，比如你做的是隆鼻子，但是你做完以后，鼻子是好看了，但是整体来说会好看吗？你眼睛小小的，还是单眼皮，下颌还是个国字型的。


    这个时段专家就会告诉你的再来个双眼皮，再来个瓜子脸，全面做一个才好看，这个时候就体现什么是精准用户了，精准用户在众多专家的建议下会怎么办呢？很简单，一个字，做。反正不缺钱，要不然这样也不好看对吧。


    所以，如果后端成交了美容院可以拿到很高的分成比例，这个时候对于美容院来说，赚取的后端收益比前端还高，这部分的收益也是自检的。这种模式对合作商家来说都有好处。


    当然，这里<|message|> 整形医院的实力和美容院的实力也是一个关键的因'
