  md: '为只有婚宴这块可以赚钱，可以开发出很多新增的盈利点。这些就是细节问题了。


    酒店有两个婚宴大厅，一个可以容纳 100 多人，一个可以容纳 300 人。当畅总把场地，主持人，场景布置，灯光音响等免费以后，发现赚的钱是往日的两倍还多。


    酒店会议室免费，小型会议室 30 多人，中型会议室 100 多人，大型会议室可以容纳 300 多人。畅总怎么做的呢？以容纳 100 多人的中型会议室为例，往常这个中型会议室要收费
    3000 元场地费，加上 led 屏幕，一天要 6000 元。


