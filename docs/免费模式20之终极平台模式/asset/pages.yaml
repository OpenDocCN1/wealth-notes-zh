    # 73、上万元课程的协议控制思维模式精装版


    协议控制法


    > 盖瑞尔·波特曾经说过：“你与你想要的东西之间，就差一封销售信的距离！”


    > 但是我想说的是：“你与你想要的东西之间，就只差一份协议！”


    请各位伙伴，先记住这个观念：任何你想要的资源，都可以通过一份协议控制！'
