    3000 元，用了每个月超过两天的，按每天 1500 元计算。原来会议室利用率一个月也就 7 天左右，现在这个政策出来，几乎每天都排得满满的，给酒店引来了大量的客流。很多人订下个会议室改租给别人。


    畅总盘下的这个酒店还有亲拿服务，也是运用的免费思维，主产品免费模式，房间免费住，但早餐收费 30 元，餐标是 50 元一个人，也吸引了大量的客流


