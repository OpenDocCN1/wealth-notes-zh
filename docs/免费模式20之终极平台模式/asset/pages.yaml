    但问题是这个锁就没法送，给哪个商家都不行，当你看完后面的方法你就清楚了。我们用的是积分累积的形式，达到积分才送锁，但我们所有的商家都可以以这个噱头来宣传，消费可以得积分，满多少积分送指纹锁，促进自己产品成交，事实上也只有这种方法最好了。


    # 第四种


    还是其他人买单，不过把指纹锁变成商家的赠品，这个也不行，因为商家的客户量是有限的，所以我们要把指纹锁在短时间内卖火也不现实，那我们就必须有自己的会员，我把他们推荐到合作商家这里，这样我就占了优势，而且在很短的时间内就能把我的锁卖火，光靠商家自己的客流量一天也来不了几个人，而且他们也不懂如何发展会员的方法。


    综上所述，最终我们把第三种和第四种综合一下。


    # 有了第五种


    我推荐过来的会员，他们在你这里消费，总共累积多少积分，我就把市场价 4000 元的指纹锁免费送给你，这个也是为了加速业主快速下单，而且每帮助这些商家成交一单，你要给我多少钱的提成，这样我们就不从指纹锁上赚钱，是要靠商家给我的提成赚钱。


    首先，我们要做的是：圈会员。'
