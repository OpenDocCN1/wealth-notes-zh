    # 17、超市小票换礼的新高度，客人满意商家稳赚


    今天给大家分享一个实体店案例，一个做市场营销策划的朋友帮超市做的，方法也是比较简单，很多朋友会恍然大悟，我特么怎么就没想到呢，都说了一定要学方法，所有的营销策略呢也都是可以不断演变的，而且有些地方已经在实施，说明这个方案还是比较实际，比较容易落地了。


    当初主要做的是一个过节的活动，因为过节嘛，大家都需要买很多的礼品送给家人朋友，做生意的朋友也应该抓住这几天赚大钱了。当初一个在县城还是比较大的超市，这个朋友给出的方案其实非常的简单，首先的话把各种礼品叫做出很多的套餐，也就是需要提高客单价，大家也知道这个礼品的利润还是比较高的。然后在门口的话，也码放了很多很多的礼品，但是这个礼品呢不是卖的，是用消费小票来兑换的。活动怎么做呢，首先礼品提价是当然的了，但是可以买二送一，同时过节期间凡是指定的商品消费达到了一定的额度呢，就可以看到门口兑换其它的礼品。


    首先这个活动是买二送一，那么这个对于消费者来说是非常划算的。因为过节嘛，总要买很多的东西。赚钱就比较简单了，客人买的多肯定就赚了，同时呢客人消费了一定的额以后，可以兑换礼品，很多朋友呢觉得还差那么一点就可以兑换礼品了，那就再买一点吧，一买发现马上又可以兑换更多东西了，算了，看看需要什么一起买了得了。'
  merge: -1
  img_proc: true
- pgno: 49
  md: '然后呢客人买完东西到了门口兑换礼品的时候了，很多朋友都做过活动，客人拿着小票来，礼品拿给他就回家了。


    这里呢就浪费了一个给客人推销的机会。当时怎么做的呢，门口放了很多的东西给客人挑选，当然也会有一些价格相对稍微高一点的，这个价格比较高的商品呢都是需要加一点钱来兑换的。


    当然客人来了，你要兑换免费的东西也可以呀，每满多少额度，东西送给你，但是非常诱人的就是如果你不需要免费的东西，你可以加钱兑换更贵的，那么你这个小票抵用的现金就会更高。商家怎么赚钱的呢，这就简单了，利润高的商品太多了，实在找不到那就把很小的那些东西打包嘛。除了客人小票抵用的额度再除了进货价格，有利润就行。


    当初选择加钱兑换的人也是非常多的，反正很多东西也需要，一起买了得了，这样比较划算。对于商家贩活动也是比较成功的，首先活动做出来呢很多人就会来逛超市了，参加各种活动以后呢，客单价就上来了，也就是活动还是为了在一个人顾客身上赚更多的钱，这一条呢也是活动最关键的地方，有的人活动赚了钱，有的人做了活动连广告费都没赚回来，另外做活动呢，一定要一举两得，千万不要一个活动坑了消费者，马上就臭名远扬了。


    # 18、揭秘：当抽奖和免费模式被骗子学会了，瞬间赚取了大把黑心钞票


