- pgno: 35
  md: '可能也以为他要开店销售


    那他是如何成交他的土特产的呢？方法也非常简单。


    比如,你在我这里买100元的土特产，我就送你价值120元的飞机，而这120分的飞机它的成本实际上只有10到20元，而且1.8万置换的成本可能只有几块钱，但可以有效的帮助他的土特产来进行成交或者增加客户的回头率，更何况他这些玩具玩具厂都是以最低的价格给他了。


    如果你去买土特产，你看到一家店铺满100元什么都不送，或者送一些没有啥价值的东西，而另外一家买一百元送你价值一百元的玩具车，而且都是实实在在的玩具，你会选择哪家呢？


    并且他还拿着这些玩具，去整合美发卡，健身卡，洗车卡，一套菜系等，来进一步帮助他进行促销和成交，以及做各种各样的活动，甚至于整合过来的礼品打包低价销售，这里的玩具可不是虚拟等码，是实实在在的笋码。那就是资源腾挪的整个流程。


    在这里面，800元的网站经过高大上的包装以后就值3.6万元，但网站对他们来讲不值钱就几百元的事情，而价值50万的礼品经过缩小后它的成本是1.8万左右，对于厂家来说无所谓，但是你要是让玩具厂花1.8万元现金可能有点难度，如果说你要他的玩具，他很愿意，反正具体的成本价格你也不知道，商家是非常乐意给的，在这里你可以理解实际上他是花了800元的成本购买了1.8万的玩具，划不划算？但是放在市场上就值50万的产品。


