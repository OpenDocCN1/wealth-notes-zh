    # 10、火锅店免费模式经典案例


    一家 1500 平的火锅店，开业半月收款几千万。原理很简单，拿出 400 平做超市，超市产品有三大类：童装儿童玩具，女性内衣（品牌），进口品牌红酒。只要在火锅店充会员卡（分几个等级，1500/3000/5000/10000，级别不同优惠不同），充完卡在火锅店正常消费，还有优惠，同时在超市可以免费领
    1500 元的任意商品，直接一次性领走。


    关键在于他超市的产品都是合作单位的源头产品，如:品牌女士内衣，市价 1200 元，65 元拿货，市价 680 元的拿货价 30 元左右。


    所以说这类活动本身没问题，关键是你能否搞到高价值低价格的源头产品，并且质量一定要好。


    这里的本质是：（因为产品信息的不对称）通过不同模块间的腾挪来迅速获得现金流。其实这是产品众筹的一种转化模式；其实也是营销的一种常用方法，其实是消费权众筹，把未来的收益现在一次打包变现，本质就是一种金融手段；也是消费权众筹


    本质总之：没有离开金融的本质，同样也没有离开营销策划的本质。


    再直白的说就是：现金为王'
