  md: '盈利的渠道，并且顺利垄断了一个城市的酱油市场，而且这个商业模式一旦大范围推广有可能可以实现全国酱油市场的垄断。我们帮助这个酱油厂商短短两个多月就开发了一百多家餐饮饭店。说到这里，你或许等不及了，想知道其中的策略到底是什么。


    首先，我们都知道酱油是餐饮行业的刚需用品，无论如何都是要采购的，比如你一个饭店的业绩是10万，那其中大概酱油等调料的成本就需要1万。那我们怎么帮助这个酱油厂商怎么卖酱油呢？


    首先我们策划就和餐饮饭店进行沟通，大概内容是我不用你们饭店花钱买我的酱油，我可以给你提供价值1万元的酱油。但是你要给我一万两千元的餐饮代金券，因为我需要帮你把餐饮卷卖出去，然后才有人来你这吃饭，但是你要给我的代金券必须是有折扣的，不然我怎么卖给更多人，帮你带来这么多客户呢。


    餐饮行业的老板就感觉这种合作方式非常好，因为无论如何都是要买调料的，只要产品质量没有问题，又不用花现金，用预期餐饮代金券就可以抵当前支出的现金成本，而且即使有优惠折扣，以后客人拿着代金券来消费，餐饮饭店也是不吃亏的，所以餐饮老板就很开心的同意这种合作方式。把后端的预期利润用在前端的成本费用上。这样的主张对餐饮业是无法拒绝的可以说是。


