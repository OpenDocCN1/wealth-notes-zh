- pgno: 31
  md: '那么今天分享茶叶的另外一种赚钱模式，包括里面涉及到一些营销知识，前端如何干，后端如何干，如何做布局，如何落地等等。


    那么大家看标题的就应该知道接下来将要分享的主题了，那就是一个估值过亿的茶杯的赚钱模式。很多人就会想，一个茶杯就估值过亿？有那么大的能量吗？但是你听完分享你就会知道，原来是这样赚大钱的。做任何的项目产品都是先要布局，然后倒推回来根据自己的实际一步一步落地，所以，我给大家分享的是一种思维模式，你需要落地，你是需要根据你的条件前端要做很多的准备的。


    那么这个茶杯它又是怎么玩的呢？第一步，先找第一批种子用户，同时验证这个产品是否有市场，那么最好的方法就是众筹，如果众筹结果理想或者说超额完成，说明产品被用户认可有市场，而且同时获得第一批种子用户。所以，这个茶杯在
    2015 年的时候在某东上面做了一次众筹，众筹了 100 多万，支持者就有几千人，这样就轻松的获得了第一批种子用户，并且验证了这个产品是被用户认可的。那么众筹成功的前提就是你这个产品能打动用户，这就回归产品本身的价值，那么，这个估值过亿的茶杯又有什么功能呢？


    简单的说就是一个馍瓜式的茶杯，一个高科技的智能茶杯，可以根据不同的茶叶自动设定泡茶时间，经过大数据分析，泡出最佳口味的茶，当然这个是通过手机的软件进行设置，对用户来说，简单方便，不懂泡茶的人也能喝到最佳的茶。


    在这里关于茶杯的高科技，环保材料，是怎么泡的，有多智能等等这些，我就不详细说了，说半天也说不玩，总的来说就是智能高科'
