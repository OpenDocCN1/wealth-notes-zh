    # 40、顶尖高手告诉你用共享模式颠覆旅居行业赚大钱的秘密


    在以前的文章里面分享过，现在很多行业的高手采用了轻资产的模式去颠覆行业，所谓轻资产，说白了就是玩资源整合，通过设计一个共赢的商业模式把别人的资源整合过来大家一起赚钱。


    因为现在很多行业的资源都处于过剩的阶段，都在进行激烈的价格战，如果你没有一个很好的创新或者颠覆式的模式，或者说有很多很多钱的话，还去玩重资产基本胜算的可能比较小。


