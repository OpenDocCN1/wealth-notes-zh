    可能你就会有疑问了，既然引流来的都是一些贪小便宜的用户，这种模式有效果吗？值得这样做吗？答案肯定是有戍果的，为什么呢？原因很简单，就是销售员的口才加上概率，十个人不能成交一个，那100个人呢？所以人多了总会有成交的。即便是成交率不高，也'
