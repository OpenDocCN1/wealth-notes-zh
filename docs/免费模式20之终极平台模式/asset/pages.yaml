    后端大家都懂的，就是让这些用户持续产生购买，然后代理，这个套路是以前的了。说这个的目的也就是说快餐行业的广告还是有市场的。所以今天和大家分享一个专门干快餐外卖行业的赚钱模式。


    这种模式也不算新鲜，因为可能很多人都看到过，不就是在餐盒上面做广告而已嘛对吧，用户吃饭的时候必须看啊。简单的说就是一个广告传媒的公司，整合餐盒行业，然后在上面做广告，赚取广告费。


    但是今天要说的这家公司除了赚取广告费以外还有更多的赢利点，你想不想知道呢？那么他们具体是怎么玩的呢？


    餐盒免费送，他们给这些餐饮老板免费提供外卖使用的快餐盒，一般来说，这些快餐店的老板的外卖餐盒都是花钱购买的对吧，但是他们给你他们免费用，你要不要？所以他就有了在餐盒上面做广告的机会，快餐店的老板也爽啊，免费获得餐盒。


    餐盒只是其一，还有筷子啊，纸巾啊等等这些耗材都是他们提供。很明显，他们就是通过餐盒上面的广告费来补贴餐盒的成本。


    所以免费送餐盒这一招，两个月直接合作商家超过一千多家，当然这些都是覆盖商区写字楼的商家，因为这些用户的价值才大啊，才'
