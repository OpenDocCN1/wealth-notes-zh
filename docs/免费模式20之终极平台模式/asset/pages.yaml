  md: '我可能马上购买。


    但是，如果这个产品目前对我来说需求并不是很强烈，而你让我占便宜的前提是我要掏钱消费你的产品，而市面上和你一样的产品太多了，有可能下一家的优惠力度比你更大。这个时候你就不能刺激用户做出行动，换句话说你的宣传效果并没有达到你的目的。


