    # 46、饭盒免费送也能赚大钱？这个赚钱套路杠杠的


    一个好的商业模式，一定是每一个参与者都是受益者，损害任何一个参与者的利益都无法进行下去，另外一个还要有吸引力。


    干项目的人就是一个布局者，你要站在每一个参与者的角度思考他们的切身利益，只要让他们觉得只有好处没有风险，用户才愿意参与对吧，还要把自己的风险转嫁出去，这才是目的。


    那么今天和大家分享一个关于快餐行业的赚钱套路，由于时间关系就直接进入主题。


