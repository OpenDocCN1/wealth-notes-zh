  md: '只要你的房间有人住了，酒店拿出 50%，也就是 190 元返给大家，第一天住，第二天就打你账上。


    要知道平时自己不住的时候，房间使用权是归酒店用的。大家一听有这政策，原来闲置的房间还能赚钱，很多人为​了赚回这 10 万元钱，亲戚朋友客户要住店的，都会推荐这家酒店。而且这家酒店本身条件在当地就非常棒，推荐来的人来这住的也很满意。很快酒店入住率就接近满员了，有时候还爆满。酒店住宿这块赚的钱更多了。


    这家酒店的赢利点不全在住宿上。这家酒店还是一个婚庆酒店，原来婚庆这块也是处于亏损状态，一个月时间也只有一周到十天时间有婚庆，结婚婚庆不是要请主持人，布置场景，灯光音响之类。这些酒店原来都是要收费的，现在畅总说这些全免费了，还送婚纱，化妆。


    只要结婚需要的，酒店提供一切便利，所有服务都免费，只收酒宴的钱，条件是相当的优惠，酒店还比较有档次，所以一下就火了。酒店打出广告以后，很多恨排队办婚礼，就连清明节那天都有人办婚宴，因为实在没有档期，大家排队等办婚礼，必须提前三个月预定才能订到。


    外行看热闹，内行看门道。畅总这么做有哪些理论支撑呢？酒店婚庆这块畅总主要运用了《免费模式》中 16 种免费模式中的空间免费模型，在特定空间免费，其他的空间收费；在空间模型中又用到了产品分级模型和利润模型等共计七个免费模型。这点学习过《免费模式》的家人都能够发现和理解怎么用的，为什么这么用。千万不要认'
