- pgno: 63
  md: '中买了也亏！这个场面简直火爆到不行，简直成了抢购，但是小李可说谎便卖，说了是猜就能猜，不直接卖！这个南丰蜜桔进货价就是1.5元。那他怎么赚钱的？


    随着人群越来越多，大家发现小李店里的其它水果不仅新鲜，价格还比其它店便宜那么一点！这小伙子实在啊，所谓有人不怕没生意，抓住了流量就抓住了钱。小李忙活一天下来，其它水果高利润的几乎都被带动了，送出去的那些蜜桔成本几乎可以忽略不计，这一天小李的营业额直接到了9千多，差一点就破万，净利润都3千多了。


    既娱乐了大家，又把钱赚到了手。


    第二天早上9点开门，门口已经站了不少等着买水果的群众，这个活动持续了三天。第四天小李又改变了水果品种，今天不猜南丰蜜桔，猜橙子！不断给群众换新鲜感，随着时间推移，附近人都知道这里有一家好玩又实在的水果店了。小李的生意也蒸蒸日上！


    但是两个星期后，大家的兴趣似乎有所减退。老是猜一种不好玩，那怎么再升级游戏。看看他怎么玩的！


    大转盘抽奖！抽到蜜桔，橙子，香蕉，都免费拿走一斤。抽到芒果必须买一斤！这次他挑的是三种价格便宜的水果，一种贵的。'
