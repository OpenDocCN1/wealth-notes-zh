- pgno: 173
  md: '赚的是这个用户消费女装的钱，但是，如果我介绍给其他的商家，如果这个用户消费了，那么她所带来的利润远远比卖一条裤子利润高很多。但是，我花钱仅仅是引流到女装店，但是这个用户后续的消费完全是不增加我的任何成本但是却增加了我的收入。


    那么今天通过一个非常经典的案例和大家分享这套模式的运用并且结合免费模式的运用轻松年赚千万的核心秘密。


    大家看标题就应该知道了，今天要分享的是关于微整形行业和美容院合作的案例。


    首先对于微整形的医院来说，传统的很多都是大量的投放广告，这个行业的利润大家自己都知道的，是一个相对来说比较暴利的行业。但是大量投放广告除了成本高以外，其实还有一个转化率的问题，转化率不高也是不赚钱，这种是传统的玩法。


    那么还有另外一种不需要投放广告却能轻松赚钱的模式，那就是分钱，这个世界如果你想赚大钱就要学会分钱，因为你舍得分钱才有人愿意和你合作。


    那么，他们找到的是美容院合作，为什么找的是美容院的用户呢？因为这些用户非常的精准，因为一个用户，她需要整形之前一般都是先去美容院搞美容的，这个大家赞同吧，如果一个用户连美容院都不去的，你还想让她整形，估计难度不小。那么对于传统的美容院来说，也有很多的痛点，开美容院的太多了，竞争也大，到店率低，留存率低，活动力度搞大一点了，最后发现钱变少了。


    所以，有两家公司，一家是搞整形的，一家是搞美容连锁，两个'
