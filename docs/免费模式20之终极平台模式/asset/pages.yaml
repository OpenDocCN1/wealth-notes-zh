  md: '项目，都会在不同的时间做些活动来吸引用户，那么吸引用户的多少很多时候取决于你给的诱惑力有多大。


    我见过很多人搞活动促销，本想通过活动赚点钱和赚点人气，但是结果，一场活动搞下来不但不赚钱而且还亏钱。


    那么为什么有的人搞活动赚钱，而有的人搞活动亏钱呢？


    其实原因就是一个，搞活动亏钱的人，吸引来都是一群贪小便宜的屌丝，而搞活动赚钱的人吸引来的都是一群精准用户。


    简单的说，你没有设定一个条件去限制一些贪小便宜的人，很多人总是觉得人越多越好，但是实际上这种模式会让你亏得更多。


    那么今天和大家分享一个简单的营销策略，1块钱的菜价是如何赚钱的。


    按照正常的逻辑来说，普通人看到，都会被吸引，1块钱就可以点一个菜，不吃那不是傻子吗是吧。


    干餐饮的人看到，1块钱，你不得不佩服家伙产啊。


    但是，真正操作的人呢，在偷着乐呢，因为他在偷偷的数钱


    那么具体是怎么玩的呢？'
