    所以在这个模式里面，用户可以先试吃，好吃再产生后续的购买，而且是永久免费试吃。餐厅为他们免费提供场地，可以获得流量，提升用户的体验，当然营业额也会有所提升。而他们通过试吃活动获取用户，通过前端销售水果赚钱。


