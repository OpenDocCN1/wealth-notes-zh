  md: '本还赚钱的秘密，这个模式现在玩的人还不算多，这种模式不仅仅现在在汽车维修保养的行业，这个模式基本上适用于任何的行业。


    听好了，你现在充值 的 5000 元，第一，我送你 5000 元我们店里面的储蓄卡，在店里的所有项目都可以使用，那么对用户来说是不是已经不亏了？因为 5000
    元已经得到了 5000 的实际消费额度。


    那么剩下的这个 15000 元是怎么送的呢？送产品，送你价值 15000 元的产品，有吸引力吧。都是一些什么产品呢？比如，儿童手表，红木家具，白酒，人参，净水器，眼镜，茶叶等等，随便你选，你喜欢什么就选什么，没有要求，只要你选够
    15000 元的产品就好。


    那么对用户来说，第一个赠品的选择多样化，平常很多人都是固定两三款产品。产品多样化的好处就是可以达到吸引更多的用户。


    大家看了这些价值 15000 元的产品不知道大家有什么感想，如果说你是一个对跨行业有一定了解的话，你一定知道这些都是一些利润非常高的产品，成本低到可能让你大跌眼镜，但是这些产品毕竟是存在的。


    前几天不是有一新闻爆料说某奢侈品牌的包包，在市场的售价一万多块，电商的网站售价也要 9000 多，但是有人用一模一样的材料，包括配件都是同一厂家的，结果做出来的成本才
    400 块。


    一个标价几千块的净水器成本也许就是几十块的都有，几百块的儿童手表成本几十块，茶叶白酒的利润我就不说了，那么，可能有的人就会说了，就算你找的赠品利润都是非常高的，低成本高质量的，但是，用户不相信啊，因为现在的用户都很精明了，用户也不是傻子，'
