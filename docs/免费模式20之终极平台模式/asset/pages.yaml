    # 20、学校附近奶茶店的免费模式运用


    这是一家奶茶店、老板姓黄、她把这家奶茶店开在学校旁边，定位做学生市场群体，但这附近已经有一家开了 3 年的老店，生意非常火爆，经常是做无席，成为学生恋爱、聚会常聚场所。这店铺都已经装修的差不多了，对于以后的生意黄老板心里是忐忑不安，最后找到我并请我帮他解决这个问题。


    我根据黄老板的描述感觉她这新开的店的计划和考察是一塌糊涂。客户没有考察好，没做奶茶试吃，周边的竞争对手没有了解。开业没有详细的计划。这在于现在广告泛滥，每家都促销的年代，以她这产品经济时代的开店方法，已经可以预见开业后的情景。


    由于同在一个城市，于是，我就赶过去看了下实体情况。在那摸底了 7 天明确了学校周围的基本情况。发现 3 年老店也不是非常难搞定的，很平常，点单、制作、结账，走人。当我把这个结果和黄老板说了，就轮到他奇怪了“每个奶茶店都是这样的，有什么不一样吗？”
    “如果你和他做的一样，你能赢了他 3 年的老店？”'
