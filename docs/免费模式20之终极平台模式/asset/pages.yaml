    通常来说，你想获得一个行业的切入点，你就要提供和这个行业不一样的商业模式，而且这个模式一定要具有颠覆性的，这样才能获取这个流量的入口。


    那么，在传统的酒店行业，布草是酒店的一个刚需，布草的清洗也是酒店的一个刚需，通常来说，酒店的布草都是酒店自己掏钱买的，如果房间数量比较多的话，这是一个不小大开支，而且布草的备货量是房间的
    3 倍。平时还有一些损耗。


