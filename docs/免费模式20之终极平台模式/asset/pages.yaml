    大家要明白的是，一个果树种下去，他是每年都结果果的，简单的说，假设你掏了 5 块钱买了一颗果苗回家种，然后每年给农家肥，是不是每年都有水果收？如果能收 50
    年，但是你投进去的成本就是树苗的 5 块钱，明白这个原理就很好理解了。


    所以，他们就是每年投入一点果园的维护成本采摘，快递等等，但是这些费用他也不是一年就投进去的啊，他是每年都投一点，这个成本可以通过把项目运营好来解决这个成本的。


