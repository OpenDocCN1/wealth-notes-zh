    通过以上的规划，同竞争对手相比，就会有明显的优势，我们一直反复强调过这样一个观念性的问题：不论是做实体生意，还是做销售卖产品，首先考虑的不应该是如何引流的问题，而是先要考虑，如何打造核心竞争力的問題，比如，我的产品可以给客户带来哪些竞争对手不能满足的功能，我的服务可以给客户带来什么不同的超值体验，我能给客户带来哪些附加的高性价比回馈等等，只有解决了核心竞争力，接下来的引流是最简单的，否则，没有核心竞争力，客户来了不能很好的锁定，那么引流的越多，死的越快！这也是做生意能不能稳定持久的根本原因！'
