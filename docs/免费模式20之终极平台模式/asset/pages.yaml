    +   3）政府把 1500 架钢琴分发给所在区域的部分学校，由这些学校去进行招生，招生的费用和学校进行五五分成（因为是公办学校，有稳定的招生渠道，收入会比较稳定）。


    +   4）因为是 BT 模式，所以与政府合作时不需要进行招标，只进行公示，这样每台钢琴可以卖到 2.5 万元，而实际上每架钢琴的成本是 8000~10000
