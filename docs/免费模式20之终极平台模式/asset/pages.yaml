  md: '这些车子广告出租出去，这个还是有难度的，你直接让商家付款 18 万多这个也有难度，一个是不信任你，一个是没有什么实际的效果，所以我们直接运用资源腾挪的模式，不直接从车身广告上面收钱，我们先把这些车身广告折现，然后置换出等价的礼品，再把这些礼品再来变现就会更容易，而且我们就会有更长的时间来招商。


