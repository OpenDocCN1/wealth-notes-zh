    那么，到这里大家看懂了吧，为什么你玩充值赚不到钱，是因为你的思路不对。OK，今天就分享到这里，不知道你看懂了吗？


    # 60、揭秘停车位免费用颠覆传统运作模式轻松赚钱


    佛家有人生三重境界之说，即：“看山是山，看水是水；看山不是山，看水不是水；看山还是山，看水还是水。”这句话简单的说就是反应人们对同一个事物的不同看法。


    人生第一重境界看山是山，看水是水；就好比小学生，单纯童真，初识世界，眼瞅看见什么就是什么，你告诉他这个什么就是什么。


    人生第二重境界看山不是山，看水不是水；就好比中学生，对世界的认识发生了变化，不再是单纯的只看事物的表象，对同一事物有了不一样的看法。


    人生第三重境界：“看山还是山，看水还是水，就好比大学生，反璞归真，回归事物的本质，虽然从不同的角度看待事物，但是都是建立在事物的本质基础上。


    现在有很多项目的运作模式都是按照传统的方式来运作，也就是拿产品本身的价值来运作，当然并不是说这种模式不可以对吧，毕竟大多数人都是这样干的。但是，当很多人采用同样的模式来做同样的项目或者卖同样产品的时候，就会出现一个必然的结果，那就是竞争，有竞争就有价格战。


    比如说，同样的卖矿泉水，一般人就是把矿泉水当做一个普通的水，卖水产品本身的价值赚差价，这个对用户来说就会考虑性价比了。'
  merge: -1
  img_proc: true
- pgno: 161
  md: '但是还有另外一种高手，不再卖产品本身的价值，把水当做是一个道具，把水免费送给你，通过其他的模式去赚钱，不再赚产品的差价。


    有人可能会说，这种模式怎么可能实现呢？产品还是有成本的啊，但是同样的一个产品，不同的商业模式就有不同的赚钱模式，就看你是站在哪个角度赚哪里的钱而已，当然，任何的模式都是建立在双赢的情况下才有可能成功，强买强卖只会死得更快。


    今天要和大家分享一个产品免费用还赚钱的模式，颠覆大家对于产品的一个认识，让大家从小学生变成中学生，也就是人生的第二重境界。


    今天就和大家分享的是停车位的模式，现在的有钱人越来越多，基本都ELLS有一个小车，但是住在小区的用户就有一个烦恼脑了，房子是买了，但是车没地方放啊，也就是说要么租车位，要么买一个车位。


    但是在一些北上广深的城市，一个车位就是十几万啊，甚至有的还是几十万的一个，一个车位顶一些三四线城市的一套房啊，买个车才几万块，但是一个车位就要十几万，车位比车还值钱。所以有很多人是选择租车位的，一般来说，这种城市的租车位价格大概在
    400 或者 500 左右一个月，当然也有高一点的或者低一点，这个要根据条件的。


    那么，如果说一个车位一个月就是 400 块左右，一年就是 5000 块了，那么对于传统的小区停车位的操作模式，基本上是物业来收这个租金，也就是按月租，所以，传统的模式，车位是靠出租赚钱，业'
