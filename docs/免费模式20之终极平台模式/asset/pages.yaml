    # 34、万元停车场设备免费送还能赚大钱，高手都在这么干


    其实不管你culas产品还是做大项目，都离不开的是用户，那么很多人都问我，有什么好的大量获得用户的方法啊。


    这个问题是很多人关心的问题，那么有什么方法能大量的获取用户呢？其实，方法非常多，每一个方法都有人使用，但是很多高手喜欢用的模式就是免费加后端，也可以说是前端加后端。


    前端的免费是为了获得用户锁定用户，通过后端赚钱，如果你的产品或者项目并没有设计前端和后端，那么你是比较难获取用户的。


    也就是说很多高手当他们决定做一个项目的时候，他们首先想的是我如何为这个项目设计一个前端产品，而且我还要把这个前端产品免费送给合作伙伴，这样才能短时间大规模的抢占市场。


    如果说这个项目的后端盈利空间非常大，但是前端免费送产品给用户是需要成本的，所以这个时候就会有资本介入，投钱给你去占领市场。反过来，如果说你的后端盈利空间不大，或者说市场空间不大，你也想前端免费的话，你是很难以做到的。


    那么今天就和大家分享两个不同的案例，如何通过前端产品的免费去获取用户，通过后端来盈利的商业模式。但是后端的盈利大致相同，只是前端获得用户的手段不一样。


    第一个是全年免费洗车，很多人更多接触的是在洗车店充值会员卡的模式。这种模式更多的是汽车维修店干的，但是今天要分享的是，全年免费洗车是一个平台干的。'
