    # 5、健身房成功的免费商业模式


    传统的健身房靠什么盈利？一个是会员，一个是销售营养食品，健身小器材等之类的东西。


    杭州这家健身房顾客只需缴纳一定数量的押金，就可以免费来健身房健身，但必须与健身房签订对赌协议。按照约定，你这个月明明应健身10次，但如果只去了9次，那么，你就得支付一小笔“激励费”了。


    每个月10次健身，听起来并不难做到，但在实际操作过程中，确实很少有人能坚持平均三天来一次健身房，而一个顾客每个月被扣两次以上的“激励费”，就已经相当于花钱买张健身月卡了。


    健身房的客流量多，就能促进他们购买其他的营养食品，最终形成良性循环。


    # 6、重庆某钢琴培训公司的 BT 模式


    解释：BT（Build and Transfer）模式，意指“建设---移交”，是政府利用非政府资金来进行基础非经营性设施建设项目的一种融资模式。


    BT 模式一般用在建筑行业，比如万达广场。传统的商务地产，就是盖好了商务楼，然后再去招商。万达不是这样，万达和麦当劳，百丽，味千拉面等连锁企业都签到了协议，所以万达广场一旦建好，就把这些签约企业全部拉过去，从而节约了招商成本。


    BT 模式同样可以应用在传统行业上面，重庆某钢琴培训学校主要业务：钢琴培训、钢琴销售。公司成立于1996年，总共培养了2'
