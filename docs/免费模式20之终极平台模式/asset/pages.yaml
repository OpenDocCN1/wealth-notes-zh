- pgno: 201
  md: '所以，我们就把自己的热回收设备免费送给你用，帮助你省水省电 40%。但这是，作为交换，你需要去把你的对你而言不是太重要或者闲置的那部分资源给我用。这也是协议控制法所能构建的基础！在这个过程中，我们的用于锁定对方资源的鱼饵产品就是：热回收设备。


    2）、你还要给自己制造一个利润产品：转移支付


    大师和他的弟子探讨了十多个行业，最终他们选择了美发行业。


    通过把热回收设备送给发廊免费使用，帮助他们省水省电 40%。


    其实发廊的消费是很多的，我们只需要发廊已经发生的一个消费，通过支付转移的方式，转移给我们就就可以了。


    很多发廊都会使用一次性消毒毛巾，洗发水这些，大的发廊可能自己生产，小的都会自己去采购。


    那我今天给你说，假设你今天要卖 100 块的消毒毛巾，你找谁卖都是一样，价格，服务，品质都差不多。但是如果你找我卖的话，价格，毛巾都一样，产品和服务都一样。你相当于把别人的转移到了我这里，向别人买消毒毛巾，转移给我，向我买消毒毛巾。你其他的成本完全一样，你得到的毛巾品质完全一样。我却能够送热回收设备给你，让你立即省水省电
    40%。一年下来，你要省多少水费电费。而且你不需要额外多支付成本，不需要去消费新的项目，你只是针对你原有消费采购成本的缩减和转移！


    因为毛巾的开销，不是主要的开销，是一个附属的易耗品的开销。不是伤筋动骨的核心采购项目。对他们来讲，既然毛巾品质和服务都一样，那我找谁买都是一样的。'
