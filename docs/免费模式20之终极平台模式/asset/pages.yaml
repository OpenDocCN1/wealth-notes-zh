- pgno: 159
  md: '他们不相信怎么解决呢？


    所以，当你吸引用户眼球是第一步，找到低成本高价值赠品是第二步，那么接下来这步非常的关键，如何让用户相信你的产品。


    举个简单的例子，如果我把一个成本 20 块的产品卖 100 块，我去路边摆摊卖，会不会有人买？很少吧，甚至没有，因为用户不相信啊，但是，如果我把这个产品放到某个大型的超市去卖？会不会有人买？有吧，为什么？因为用户相信的是超市，而这个产品傍上了超市这个大树。这样也就解决了信任的问题。


    所以，他们是怎么傍大树的呢？如果这些产品你放在你的店面来送，几乎没有人相信，但是，如果说这些产品都是某大型的电商平台上面在卖的，这个时候你信不信？而且发货物流都是这个电商平台的，你信不信？在电商平台上的售价也是赠品的标价，你信不信？


    所以他们就是利用电商平台做背后，让电商平台解决信任这个问题，我送的这些赠品呢，你不是在我的店里面领取，而是去某电商平台领取，这个时候用户心里是不是感觉赚到了。明白了吧。


    那么通过这种模式就很轻松的解决了这个信任的问题，当然，这些产品是他们的合作商家，拿货价肯定是非常低的，第一，为他们引流，第二，这些赠品你怎么选都是刚刚好达到
    15000 元，所以，要么差一点不够，要么就是多了，多了怎么办？加钱啊。


    那么对于这个搞活动的维修店亏不亏？绝对不亏吧？因为赠品的成本非常低，所以，怎么算，你充值了我都能赚到钱，其实就是相当于给你打个折而已，再说，这些服务也不是一次性给的，还有一部'
