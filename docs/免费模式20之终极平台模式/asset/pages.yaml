    也就是当传统的行业面临租金高人工高的时候，这种灵活的自助售卖的机器将会颠覆传统的模式，把传统模式进行拆分变成迷你的自助售卖模式。


    比如，KTV变成共享KTV，咖啡馆变成自助咖啡机，卖成人用品的变成成人用品自助售卖机，健身的变成集装箱的等等非常多，大型超市变成无人自助超市，这些都是把传统的商业模式进行拆分变成自助模式，自动运转，自动赚钱，一个人管几十几百个自动赚钱机器。


    那么这种模式未来会越来越多，或许这就是大家常说的新零售吧，那么，你可以考虑你的行业是否可以应用类似的创新模式，如果可以，先测试吧，测试成功，你就不会缺钱了。OK，今天就分享到这里。


