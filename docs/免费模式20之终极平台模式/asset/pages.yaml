  md: '大家分享两种玩共享教室的模式，一种是专业的，另外一种是业余的，但是专业有专业的玩法，业余的也有业余的套路。


    首先和大家解释一下什么是共享教室，为什么会出现共享教室这种模式。共享教室简单的说就是一种分时租赁模式。那么教室，很明显是用于培训的，也就是说这种共享教室针对于的是一些刚创业的培训机构。


    因为对于一些刚创业的做培训的老板来说，需要自己找场地，自己装修，初期的投资非常的大，但是，当你场地装修好以后，又面临着招生的问题，当你招到学生的时候，这个场地其实是已经空闲很长时间了，而且，场地在一年之中真正使用的时间可能都不到
    30%。也就是说可能你一天只用一小时但是你却要花一整天的租金。


    所以，现在就有专业的人玩共享教室，这里面又分为两种，一种是专门针对学生的培训机构，然后找一些闲置的场地进行装修，然后分时租给这个培训机构，比如一些学舞蹈的啊，书画的啊，跳舞的啊等等。当然，这里面也会有一些是个体教师。


    这样对于机构或者个体教师来说都是有好处的，可以省掉一部分的房租，换句话说分时租赁比自己搞一个场地划算。而且减轻了一些刚创业的老板的投资。而且还有一个好处是什么呢？那么他可以集合不同行业的机构到这里，可以联合搞营销活动，比如，搞个
    99 元的课程，随便你选 4 门课。因为他们的用户群体都是一样的，所以，比你自己单打独斗强很多。


    对于操盘者来说，你就是需要找到这些人群进行签约，就能保证'
