  md: '但是核心一定是回归到：正向现金流


    # 11、资源腾挪整合礼品顶级商业模式


    有一个朋友，他有一个建站公司，专门是给企业建站的，每个网站至少都要收几万块呀，但成本实际oy非常低。我们正常建立一个网站，就是套用一个模板，也就是几百元钱，这里加上一些好的服务，由于他的目标客户是企业客户，可以直接收几万元与成本没有什么关系，而与目标客户有关系。这里共分为两步。

    第一步:收款有技巧。


    这时有一个非常大的玩具厂找到了他们来建站，然后谈下来是3.6万。在收款的时候这个朋友说你给我1.8万现金就行了。玩具老板很吃惊，就问了句另外1.8万呢？另外的1.8万直接兑换成儿童玩具，你以最低的价格即成本价给我就行了。说实话，玩具厂负责人当时就答应了，因为他们的玩具堆积在那里，也是一分钱也不值，既然而有人主动要，就直接成交。其实在金钱和产品之间，我们的客户往往会选择用产品，而不是用钱来买单。

    这位朋友深深知道，这1.8万的玩具要是放到市场上价值至少值几十万。


    第二步:礼品促成交。

    但是你有没有想过，为什么放着1.8万的现金不要，偏偏要了对他来说没用的玩具，原因非常简单，因为这位朋友他有一个土特产店，而且买到土特产的人群基本asso都是20到30岁左右的妈妈，正好玩具厂的目标客户与他的目标客户群体差不多，所以最终的想法是用这个玩具来促进成交他的土特产，或者通过这个玩具整合其他商家的礼品，进一步成交他的土特产。当然，玩具厂根本不知道他要做这些，'
  merge: -1
