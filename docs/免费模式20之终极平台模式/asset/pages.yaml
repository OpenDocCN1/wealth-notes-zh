  md: '# 55、每年 400 斤有机水果免费吃 10 年还赚大钱？彻底颠覆了传统水果店老板


    现在很多行业也都被各种各样的商业模式给颠覆了，你不去创新，就有人创新，你不去跨界，就有人跨界打劫你。


    在创新的过程中中虽然有的项目最后由于各种原因失败了，但是对整个行业来说仍然得到了提升。


    由于现在创业越来越简单，门槛越来越低，以前想创业可能没有几万块钱基本上是不敢去创业的，但是现在创业可能不用投一分钱都可以实现创业的梦想，


    所以现在创业的人非常多，但是有很多人又很迷茫，门槛是降低了，但是竞争也大了，总 stric 想找个好项目捞一笔，看中的是短期的盈利，这是很多刚创业的人的想法。


    但是另外一种创业者，基本上也能称算是老鸟了，他们怎么选创业项目的呢？他们和刚创业的人的思维是截然相反的，他们看中的是长期的利益。也就是后端的收益，他们选项目，一般都是根据用户的需求出发，然后选择某一个行业，用一种颠覆性的模式去干掉现有的竞争对手，把这些用户吸引过来并且锁定这些用户。


    简单地说就是拿目前别人赚钱的项目拿来当前端免费玩。


