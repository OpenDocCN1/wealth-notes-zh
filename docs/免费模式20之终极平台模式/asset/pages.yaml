  md: '大家都知道，有很多传统的行业都是通过招代理的模式，做生意的老板呢基本都是批发商那里拿货，因为一个批发商，要的数量又不是很大，很难从厂家那里拿到低价对吧。所以有很多都是经过层层的批发商，最终流到市场。


    今天主要分享一下这家公司的玩法。一个90后的小女生用众筹包1000多个山头估值超2个亿的核心。


    其实原理说起来也很简单，就是这家公司发起茶山的众筹，主要有两种，第一种就是收益模式，这个也很容易理解，就是投资多少钱，然后一年我给你多少的收益。是茶叶还是现金都可以自己选。


    那么另外一种就是，包山头，以前分享比较多的都是按棵树来众筹，但是他玩的是分山头，你投资多少钱，这个山头的茶叶归你，也就是说，他们众筹的主力军是各个地方的经销商。


    因为这些经销商传统 cutting 模式都是从批发商拿货，现在直接参与生产阶段，拿货价格更低，不用自己生产，不用管理，看得见的真材实料，所以，这些批发商也愿意。然后他们公司再把茶农变成公司的合伙人，这样茶农的收益又有了保障。而且还获得公司提供的先进的技术培养管理知识。


    那么公司呢？除了现金流，中间的茶叶利润差以外，还有茶山的旅游，还有什么呢？答案是品牌。因为，他们采用的所有包装都打上自己的品牌，换句话说，通过众筹，全国大量的经销商帮助他们卖品牌。品牌值不值钱？这个不用说了吧，当市场上面大部分的茶叶都是他们品牌的时候，也就成了行业老大。'
