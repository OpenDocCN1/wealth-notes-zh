  md: '根据对比优化，我给她定位做一家像咖啡店的奶茶店，有座位、有室内等、这样不仅能让顾客停留与休息、更能显我们奶茶店与众不同、定位不同，避开竞争，才能赢得市场。


    会员制：我在销售过程向大家表明，比如有顾客点单，喝完买单后、让服务生说：“你的这一杯奶茶今天有机会完全免费获得”，你是不是感觉惊讶了，免费获得？真的是免费获得、免费用的好其实现就是一个企业的商业模式、不单只是一个策略。有时要懂得舍得、才能获得。服务生接着说道：“只要办理我们奶茶店的会员卡，今天这杯奶茶免费。以后你的每一杯奶茶都会有
    9 折的折扣，会员卡 20 元一张，期限是半学期”。这时你会不会让到手的奶茶飞了呢、肯定不会，因为那个学生每学期喝奶茶也喝的不少，这样一学期下来还是省下不少钱。


    三天开业试了一下就有两千左右学生办会员卡、会员费用达到 4 万多。当你感觉这个方案已经完了，那你就错了。想想客户来的时候让你手忙脚乱，空档的时候是无所事事，看不到客户心里不安那。


    这时候办理会员卡的时候，留下的电话号码就有了作用。打电话给会员说：“你好，xx 同学，恭喜您中了一杯 xx 奶茶。你可以在这个星期的 xx 点-xx 点，来我们店领取。”


    什么！你说电话打不通，你说客户领了奶茶就走怎么办。那就是你缺少一套客户管理软件，我给黄老板店用的是管家婆致胜管家客户管理软件。我们要在客户来办理会员卡的时候可以客户说：“你在检查一下，我们会根据会员电话号码抽奖是可以有不定期抽奖的哦，到时'
