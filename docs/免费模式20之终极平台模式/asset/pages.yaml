    360 搞杀毒起家的，腾讯搞 QQ 起家的，但是今天他们仅仅是做杀毒软件吗？仅仅是做 QQ 吗？所以，你会发现他们赚大钱靠的不是杀毒软件也不是 QQ，因为这些都是免费提供给你的，而且免费还把产品做到极致。


    很多人们可能会说，你说这些都太遥远了，和我有什么关系，现在我又不能做一个手机或者再做一个 QQ 啊，但是这里面的思维是值得很多人思考的。他们都是通过一个极致的产品吸引用户，然后赚大钱的都是靠其他的产品，而很多购买其他产品的这些用户正好是通过前端的极致产品吸引过来的，比如很多买小米电视的用户基本上都是已经购买过小米手机的用户，简单的说就是用户的价值最大化。很多'
