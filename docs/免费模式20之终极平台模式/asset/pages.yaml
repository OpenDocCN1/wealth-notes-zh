  md: '# 27、母婴称免费送是疯了还是另有隐情？他竟说这样能赚大钱


    卖产品就要做用户，做用户就得做营销，做营销就得花钱，有人花钱做广告请代言，有人花钱做产品免费送，到底谁更胜一筹？


    在这个商业竞争激烈的年代，做生意就是做用户，做用户就是做人心，你的产品能否打动用户，能否顺利的吸引用户成了关键，要不然就成了花钱赚吆喝了，到头来钱花出去了用户没有获得。


    今天和大家分享一个做母婴行业的玩法，通过送硬件的模式获取精准的用户，通过后端来Argue实现盈利的玩法。


    在分享这个案例之前，再分享一个简单的小案例让大家对这种模式有一个简单的了解，现在在南方基本上已经进入夏季了，也就是说爱美的 MM 开始秀大腿了。那么这个时候，肥胖的
    MM 就开始要做瘦身了，那么很多人都知道这个行业是一个比较暴力的行业，很多人的玩法就是烧钱做广告，铺天盖地的做宣传，线上不断的投放广告，因为他们获取一个用户花费的钱可以上升到
    100 多块。


