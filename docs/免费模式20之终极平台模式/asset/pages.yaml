  md: '钱。


    我们仔细分析一下，他们赠送的这些东西，我们看看市场价，也确实是这些，大家想一想，他们批量购买会是什么价位吗？据了解，批量购买很可能只需 500 元。他们敢这样做，因为他们知道学生的基数很大，卖得出就划得来。可以说，免费模式带来了双赢。再比如
    9.9 包邮，有人说都不够邮费，实际上 9.9 包邮产品的月销量基本在 10000+，在这种情况下和快递合作，费用可以低至 5 元，产品价格只需控制在 4
    元，商家一个月盈利也有 10000 元+，但你要知道这是一个产品的盈利，在月 10000+ 的客流量下，其它产品的附带购买也是一笔不小的利润。


    他们赚大了，我们也认为占了大便宜。这就是商家免费送的同时也要有利白获得。这一点，麦当劳、肯德基便做得不错。他们拥有免费的卫生间并非皆知，内急找不到公厕的时候去哪？答案很明显。这样做，好处是什么？


    1、带来客流量，烘托人气；2、有助于品牌传播；3、让过客有机会成为顾客。当然，除了免费模式，还有很多很牛的营销模式，比如：卖服务，给客户高价值体验；卖情怀，让客户情不自禁掏腰包；卖萌，让顾客动心动钱包。但相对免费营销模式来说，它们的受众都是有限制的，反观免费模式下的基数人群，是庞大且充足的。


    如果说免费营销模式靠的是流量，那流量呢？也需要靠免费的模式吧！试问一下自己，如果你现在有一款产品，你有魄力在还没有客流的时候做免费营销吗？'
