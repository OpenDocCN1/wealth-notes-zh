    # 45、用免费模式颠覆玩具市场规模超过 200 亿，你相信吗？


    现在有许多传统的行业都被颠覆了，也越来越多的一撮局者开始向传统的行业发起挑战。今天和大家分享一个市场规模超过 200 亿的市场，如何被免费模式颠覆的。那就是玩具市场，由于受到共享经济模式和免费模式的影响，玩具市场也有很多的公司用免费的模式颠覆传统的卖的模式。


    有人估算儿童玩具这个市场每年的规模超过 200 亿，那么这个市场有什么样的痛点呢？


    第一，低端的玩具很多家长买回去以后，小孩可能玩一两天过了新鲜期就不玩了，严重浪费。


    第二，高端玩具，很多家长又买不起啊，一个就是几千块啊，对于一般的家庭来说几千块毕竟不少吧对吧。


    所以，针对这两个痛点，和大家分享一下目前比较主流的免费玩法。


    先说第二个吧，因为第二个玩的人比较多，就是玩具的租赁。


    一般玩的都是高端的玩具，因为低端的几十几百块的很多人都买得起，租赁就没有什么意思了对吧。'
