- pgno: 69
  md: '那么，一般的老板可能会想，赚钱的机会来了，来我这里租吧，一个月多少钱，这样又可以赚上一笔，但是有这种思想的老板基本生意做不大，因为格局太小了，总是盯着眼前这点利益。


    但是他们是怎么玩的呢？你们要教室是吗？我免费提供给你们，不要一分钱，你要不要？而且你做培训赚的钱我也不抽提成，全部归你，更让你感动的是，我这里的设备你免费用，包括高端的多媒体教室。


    对于这些老板来说爽不爽？不花一分钱免费获得场地，而且背后没有任何的套路。


    那么，问题来了，这样做对我有什么好处呢？明明可以赚钱却免费提供给你，但是大家听我分析完，你会发现，原来这才是高手。下面和大家分析一下这背后的高手思维。


    那么，我免费为你们提供场地，是不是有很多老师抢着要？但是，我的场地是有限的啊，而且我是做儿童托管的，所以，第一，你要是在当地有一定的知名度的老师，第二，你授课的对象必须是
    5 至 12 岁的，太大了不行，第三，你要有一定的生源的老师，而且我还协助你招生。那么其他的一些什么要爱护设施啊，什么不能太大的噪音啊，本地的啊等等都是一些次要的。


    那么这背后是一套什么样的逻辑呢？第一个有知名度的老师，很多家长是不愿意让小孩来上课？谁都想让自己的孩子更优秀啊对吧，第二个，授课对象是 5 到 12 岁，这个刚好是托管机构的目标用户，第三，有一定生源的，这样就能保证我提供的教室不被浪费，重要的是，你能帮我带来大量的用户。因为每一个老师他都有自己的受'
