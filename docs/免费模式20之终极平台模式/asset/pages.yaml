    # 21、披萨店换一种客户定位思路，一天卖出 600 份！


    说个小县城的披萨店，这家披萨店开在几个小区交接的位置，约 50 平米左右。老板是一个小伙子，叫阿武，看他的披萨店生意很火，闲着没事找他聊了会。阿武是的店里除了披萨，还有生鲜果汁、小糕点等等其产品。说实话，一开始生意并不怎么样，毕竟这样的店在县城里不算主流，说白了不能当饭吃。人们饿了会吃快餐，吃其他的，很难想要吃披萨。办法他用了许多，有其中一个营销点子还是挺有用的。咱们来看看阿武怎么玩的吧。


    大家都知道小孩的钱好赚，于是阿武把一开始定位的年轻群体转移到了儿童身上。但是这里有个重点，大家注意了，儿童是没有钱的，儿童的钱来源于大人。而且儿童吃得不多，份量少，是产生不了多大效益的。那么阿武做的就是利用儿童来吸引大人。


    阿武做了个活动，6 岁以下儿童有一系列的便宜套餐，甚至有 1 元一杯的生鲜果汁，2 元一小份的小糕点。


    店里还有些小孩答智力题的小活动，答对了免费送一杯小饮料。

    活动推出后，吸引了附近很多的小朋友。'
