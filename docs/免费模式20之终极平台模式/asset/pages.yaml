- pgno: 58
  md: '那么关键在于什么呢，这个年龄段的孩子们嘴馋是肯定的，关键是这个年龄段的孩子们需要家长陪同，而他们的父母基本都是年轻人。


    阿武给店里重新布置了一番，什么免费 wifi 就不用说了，基本各种店里的标配。环境尽量布置得舒适，让孩子们有地方坐着吃，家长能好好陪伴。店门口还放置了两台免费的摇摇车，全天候免费。


    店里有一个角落放置一些孩子们的娱乐设施，整个店风格焕然一新。


    假如有 10 位家长踏着孩子来买东西吃，有 2 位家长不喜欢干等，自己也点一些吃的，生意就来了不是吗。


    这里有设置一个陷阱，一份披萨小孩是吃不完的，但又不在活动种类里，而价格 20-40 元不等，不算贵，家长没有理由来到披萨店不点一份披萨吧。而吃这么干的食物，很难不点一份饮品吧！


    活动第三天，阿武店里竟然卖出去 600 份披萨！这样效果他自己都想不到！大人们吃的东西肯定比孩子多，当大人们吃到阿武店里的东西确实不错，发现不仅仅是孩子喜欢，也有不少适合他们的食品，那么下次再光临是必然的。


    阿武的活动效果很明显，很多家长带着孩子光顾他的店，从一开始的生意一般，到火爆。一家火爆的店是会产生很多连锁反应的，别 人看到你店里那么火，难免好奇去消费一次。


    这里是一个小点子，当然阿武还可以用很多其他的营销方式，营销说白了就是推广，引销，追销。先把产品推广出去了，引导消费，'
