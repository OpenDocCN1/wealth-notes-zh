  md: '在很多传统行业人的眼中，餐馆的主要盈利来源就是靠卖饭菜赚钱，这个也是餐馆一直以来的生存之道啊。但是如果你不去创新，迟早会被竞争对手干掉。


    那么对于餐馆来说，还有什么样的创新模式呢？还能打造自动赚钱机器？正常来说很多的餐馆的米饭都是免费，但是有一家餐馆玩了一个不一样的模式，米饭收费。


    米饭收费也不奇怪，但是他们居然有两种米饭，普通的 2 块一人，另外一种贡米 10 块一碗。大家都知道这种有机大米都比较贵的。


    因为这种米会有一中不一样的清香味，让你闻到香味都想吃。


    所以会有一部分人好奇直接花 10 块钱买一碗尝一下，一般来说下馆子都不是一个人，所以只要一个人吃，一桌子的人都会吃。


    当你吃这种 10 块一碗的时候，发现是挺好吃的，就会有一些人问这是什么米啊，这么好吃。老板呢，把一个二维码扔给你，扫描二维码上面有介绍，还可以购买送货到家。


    看到这里你应该明白了吧，当你进入他们的官网购买大米的时候，这个老板就有钱收，你购买一次他就收一次钱。


    因为，他直接对接的是有机大米的基地，帮助基地卖大米，直接拿提成。对于有机大米的种植基地来说，通过这种方式，轻松的把大米销售出去，而且宣传推广成本大大地降低，因为用户都是直接先体验，感觉好吃才购买对吧，对于他们来说，直接找中高端的餐馆合作就好了，利用他们这些精准的用户引流轻松的销售的大米。


