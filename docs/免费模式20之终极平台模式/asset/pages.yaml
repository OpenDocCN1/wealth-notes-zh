  md: '各种各样北欧的文化，为你输送各种各样的北欧干货，通过这些干货不断转化用户购买产品，同时建立一个线上的微店，上面卖什么呢？卖家居家具，沙发，潮品，一些音响，耳塞数码，杯子盘子，咖啡豆咖啡杯，甚至是包包和袜子都有，甚至还要保健品等等太多了，完全一个北欧控的风格。但是如果把这些产品都放在实体店不太现实，所以，线上就是一个完美的平台。所以，他们不仅线下赚钱，还把线下流量导入到线上，结合公众号+商城的模式继续赚钱。所以，你可能看到他的生意并不是很火爆，但是他却能轻松赚几百万。


