- pgno: 77
  md: '关于这个问题我也一直在思考，为什么有的老板学了就能落地，而有一些老板学了很多竟然一动不动，有的甚至参加几万块线下学习的老板，结果学习回来还是不能落地。经过漫长的思考后，终于发现了一个问题的所在。到底是什么原因呢？


    以前很多人都在谈营销，但是现在很多人都在谈商业模式，所以现在很多人把重点放在商业模式上面，而忽略了营销的重要性。


    商业模式解决的是企业的发展问题，营销模式解决的是生存问题，生存问题你都没有解决你就想着怎么发展。很多人设计模式都是忽略了最基本的成交用户这个环节。也就是说，你有好的模式，但是你没有好的成交主张，无法解决生存的问题，说白了你连客户都没有谈什么发展？


    那么今天就通过一个案例分享是如何解决用户成交的，同时解决企业发展的。下面直接进入主题。学会这个绝招以后，你们就知道为什么以前学那么多的知识总是飘飘然在半空中而不能着地的原因。


    其实不管你设计的商业模式再好，再牛逼，一定要有一个非常牛逼的成交主张，也就是成交用户的环节，这个环节决定着你这个模式是否能落地实施，如果这个环节你都没有解决好的话，后面基本都是屁话。


    今天分享的是一个做外卖火锅的案例，以前一般吃火锅都是到实体店里面吃，但是现在有一些人更愿意在自己家里邀请上几个好友。所以就有了外面火锅这个市场。


    那么传统的外卖火锅是怎么干的呢？一般都是把锅和电磁炉这'
  merge: -1
  img_proc: true
- pgno: 78
  md: '个工具和菜品一起送到客户手上，然后客户吃完以后，又把这些锅和电磁炉收回来，而且还一定要有电的地方才行。那么中间就多了一个回收的成本在里面。


    那么有一家公司就针对市场这个痛点，搞了一个小火锅的模式，而且不用电磁炉，用矿物油代替，这样就解决电的问题，这个还不是重点。重点的是买套餐送锅，也就是说他们设计一个套餐，你只要购买这个套餐直接把锅都送给你。有人说，这个也没什么奇怪的啊，套餐里面把锅的成本加进去了啊。


    但是如果你是这种格局的话基本很难赚大钱，为什么？因为对于用户来说，你这个套餐就没有什么是吸引力，也就不能促使用户的成交，用户都不买单你赚什么钱。所以，这个套餐对于用户来说一定是一个超值的套餐，只要不是傻子都觉得超值。怎么样让用户觉得超值呢？


    简单啊，只要这个套餐不加锅的成本，在用户的认知中都超过套餐的价格，这个时候你再把锅加进去，用户是不是感觉超值？所以他们靠买套餐送锅的模式，直接让业务涨了30倍。


    但是有人说，我不赚钱啊，是的，这个套餐除去各种成本几乎不赚钱，但是你不要忘了，你把锅送给用户，就相当于送了一个会员卡。同时这家公司，菜品对接的都是上等的食材，也就是说好产品加上一个具有杀伤力的成交主张，用户就会产生重复购买，因为第一次就让用户感觉超爽啊，锅都送给你了，你以后要不要吃几次火锅？


    所以通过送锅的模式，让用户产生重复购买，延长利益链条。利润不就上来了。这个模式解决了成交的问题。而且这种配送都是标准'
  merge: -1
  img_proc: true
- pgno: 79
  md: '化的，食材啊，调料啊都可以标准化。同时他们建立了自己的配送系统，这个时候你看似他们是做火锅配送的，其实他们是做生鲜食材的。因为用户体验到他们的食材后，平时会不会购买？


    上游整合优质的生鲜食材产地，这边用自己的配送系统对接用户，所以，他们做的就是一个对接平台。所以希望大家通过今天的分享，好好琢磨一下，你是怎么设计成交主张的？第一次成交有没有给客户一个惊喜？让用户感觉超值。也就是说，不管你做什么行业的，你都要设计一个让用户感觉超值的成交主张，有了成交才有用户，有了用户才有后端，你都没成交就想着后端怎么赚钱不现实啊吧。OK，今天就分享到这里。


