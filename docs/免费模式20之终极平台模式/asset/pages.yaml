  md: '面来的 10 次还有一部分带一些朋友来，这个时候是不是利就上来了？


    重要的是，这个仅仅是前端，是获取用户，重要的是后端，那么很多人搞活动，让这些人来了吃完就走，根本没有留下用户的联系方式，结果，下次搞活动要再次搞钱去吸引用户。


    但是如果你把这些用户的联系方式留下来，下次搞活动直接通知这些人，这样有了联系方式就有了后端。当然，这里要注意的是，你菜的成本和用户的精准度，这两个把握好了，你就可以赚钱，采用低价吸引用户，带动其他的消费来赚钱。


