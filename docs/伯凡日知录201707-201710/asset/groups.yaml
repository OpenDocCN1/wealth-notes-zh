    # 9.20 | 创新是一种巧夺天工


    9.20 | 创新是一种巧夺天工


    # ——► 第199天的知识笔记 ◄——


    # | “到底是什么在造船”


    昨天我们讲到恐龙的后裔和中国神话传说中的龙之间的差异。恐龙虽然灭绝了，但是它的变种、直系或是旁系的后裔—各种各样的鸟，还在这个世界继续生存繁殖，原因就在于，鸟在各自的生态位面对真实的场景、真实的挑战给出了相应的生存策略，而一个个的“策略组合”，或者说“性状组合”，也就是一个真实的物种。


    中国神话中想象的龙，看上去也是各种“性状组合”，但它并不是一种“策略组合”，而是想象的、没有节制的延伸的一个结果。当然，龙有龙的价值—神话的价值、文学的价值等等，但它不是一个真实的物种。


    说到恐龙后裔和神话龙的差别，我想到了一个很著名的论断：“到底是什么在造船？”


    这个问题听起来非常荒唐，当然是人在造船了！但提出这个问题 的哲学家Alan认为，“是 大海本身用它彻底的严谨性选择了 功能适应的船只，摒弃了不适应者，从而塑造了船只。”—
    船不是人造的，本质上，船是大海造的。


    # | 瓦萨号的沉没


    # 1.国王的造船心愿


    说到大海造船，我们可能首先想到了“泰坦尼克号”。我以前说过，“泰坦尼克号”之所以被人记住，是因为它沉了，更重要的是，它是在首航中沉没的。


    # 2.画龙思路来造船


    ![](img/d67c5f056bd8085d4e954a23126b5c83_114_0.png)


    # 3.沉没的反面标本


    1628年8月10日，当“瓦萨号”终于下水的时候，也就10分钟，它就沉了。


    # | 幼态延续


    ![](img/d67c5f056bd8085d4e954a23126b5c83_114_1.png)


    一只看似无为，但又非常严格的手，是它在决定每一个物种的生死存亡。


    当我们知道恐龙是如何变成鸟的时候，也就是明白了为什么是大海在造船，而不是人在造船。


    # ｜天是董事长，人是CEO


    事实上，中国传统思想对于“到底谁在造船”这个问题已经给出了非常明确，也非常深刻的答案。


    《天工开物》这本书，本来说的是很实际的事情：如何造出各种各样的器具，是一本工科生读的书。而实际上，这本书在讲，是天的功夫在开发物种，表面上是人在造物，实际上是借助于天工在造物。


    还有一个类似的成语“巧夺天工”：我们做一个事情要做得足够的好，就是把天做的工作变成你的工作。也就是说是让大海造船，而不是你来造船。


    类似的说法也有很多：说一个东西完美，把它形容为“天造地设”；某种联盟特别好，叫“天作之合”；中国传统思想中特别强调“天人合一”，这个“合一”不是让天来合人，而是让人去合天。


    人可以做工作，但是你的工作一定要配合天的工作，你顶多是一个执行者：天是董事长，人是CEO，这个关系千万不能颠倒。


    我们做一个事情的时候，不是自己在做这个事情，而是在“替天行道”。我们的工作类似于天职，是天赋予我们的一种智能、一种责任。用这样的一种思路做出来的东西才可能是留得住的。人算不如天算，人做不如天做。


    所以，我们读到Alan“到底是什么在造船”的时候觉得很精彩，而熟悉中国传统哲学就知道，他的这种理念并不是原创。我们一定要记住古人的提醒：我们造物其实是“天工开物”，做事不要沉浸在自己的想象当中，不要以为创意就是天马行空。最好的作品，最好的产品都是巧夺天工的产品。


    模块式创新，乐高式创新，在某种程度上也是一种“巧夺天工”的思路：很多的要素、功能、性状已经悄悄地出现，我们要做的是如何把这些已经出现，但并非由我们造出来的东西集成，做一个不断优化的性状组合，这才叫“新物种”。


    # 9.21 | 组织里的消音机制


    9.21 | 组织里的消音机制


    —— 第200天的知识笔记 ——


    # ｜致命的自负


    昨天我们讲到“瓦萨号”船沉没的故事，由此引申出一个话题：当我们造船造物的时候，真正的造物者是谁？


    船是大海造出来的，“人造物”实际是“天工开物”，是天在造物。如果忘记这一点就会导致灾难，“瓦萨号”就是最好的例子。我们可以借用咱们看过的一个书名来诠释灾难的原因——致命的自负。


    今天出现了很多热衷于“新物种”和造物的创业者，他们常常犯这种很明显、低级的错误，比如中国第一家倒闭的共享单车公司。


    这家公司在重庆，它在这个地方做共享单车，显然忘记了一个特别简单的道理：是天造物，而不是人造物。


    # ｜佛罗里达航空90坠落事件


    还有一个事故作为一个案例经常在很多管理书籍里出现，那就是“佛罗里达航空90坠落事件”。


    这起空难发生在1982年1月13日，编号为“佛罗里达航空90”的飞机坠落，导致78人死亡。按照惯例，处理这起事故的人找到了飞机的黑匣子，他们在黑匣子里听到了这样一段对话：


    > 副机长：看见后面的冰锥了吗？


    机长：嗯。


    > 副机长：天啊！我们没有办法完全消除这些冰，这样让人很没有安全感……（停顿了一会儿）既然我们都坐在这儿了，就去检查一下上面吧。


    > 机长：（没有反应）


    【安全带提到进插槽的声音，表明机长准备要飞了】


    这就是黑匣子里的录音。


    # ｜礼节的灾难


    这个案例有各种各样的解读，有人把它解读为一种“礼节的灾难”，就是在等级森严的体系或关系中，处于弱势的一方被迫要将他的信息包装在厚厚的礼节里。因为他不能冒犯强势者的尊严，他要保护自己，不愿意挑起冲突。同时，他作为弱势方还要传递非说不可的信息，于是他就采取了用厚厚的糖衣包裹一个关键信息的方式。最终，这个信息就被忽略，被强势者自然地忽略——这种状态，被称为“在一个等级森严的组织里的一种自然消音机制”。


    # 1. 海因里希法则


    我们都听说过的“海因里希法则（Heinrich’s Law）”，是一条由美国著名安全工程师海因里希（Herbert William Heinrich）提出来的关于生产安全的法则。这个法则是说：在一次重大事故出现之前，会出现29次轻伤或者轻微的事故。而在这29次轻微事故的背后是300个隐患。


    # 2. 组织里的消音机制


    有一种关于公司基因的理论认为，一个公司的基因由四个要素决定：决策权、激励机制、组织结构、信息传递方式。


    # 3. 被礼节化的一生


    # ｜制造熵减


    组织成熟的过程就是它的体制化或者礼节化逐渐形成的过程，这是组织成长过程中自然出现的一种“熵”。我们以前讲过“熵”这个概念，就是无序、混乱、僵化，甚至接近于死亡的这样一种力量。


    # 1. 短命的“瓦萨号”


    我们昨天讲到了著名的沉船“瓦萨号”，这艘船之所以如此短命，可以从各种角度来进行解读，我们今天就从“礼节的灾难”，从消音机制上来说说这场灾难。


    # 2. 任正非的总裁令


    最近几天有一条刷屏的新闻，是关于华为的总裁任正非先生签署的一个总裁命令：对公司某部门的员工进行嘉奖。


    对公司某部门的员工进行嘉奖。


    这个嘉奖不但意味着这个员工连升两级，月工资增加了一万元，同时，他还为这个敢说真话、揭露部门存在问题的员工指定了一个保护人，负责保护这个员工不受打击报复。在这个文件里还提到“连升两级不影响自然升迁”，也就是说，这个员工如果按照年度业绩今年可以再升一级的话，他就可以升三级。


    那么，为什么任正非要做这样一件事？显然，他意识到在华为这样一个有18万员工的公司里，已经出现了种种消音机制，礼节的灾难可能正在降临。所以，任正非要用这样一种方式来制造一种负熵，来反抗和消解企业业已出现的非常严重的信息屏蔽机制。


    # 3.另一个损友


    我们在上周的互动里提到过一个法国哲学家的观点：每一个人都有一个随身携带的损友，那就是坚定不移、孜孜不倦、乐此不疲地从事着自恋的那个自我。其实，我们每个人、每个组织还有一个损友，那就是一种我们看不见的消音机制——对真实信息和状况自动屏蔽、自动粉饰的这样一种机制。


    中国人讲“吾日三省吾身”，各种宗教里都强调内观内省，或者忏悔，这些措施都在做一件事：消除我们的消音机制，尽可能减少各种我们没有意识到的损友对我们的伤害。当这种作为消音机制的礼节在我们周围弥漫的时候，灾难也就远了。


    骄傲、狂妄、自大是一种灾难。“神要使之灭亡，必先使之疯狂。”还有一种灾难非常隐秘，但它的杀伤力更大，比自大狂妄还要可怕，那就是我们内心一直特别偏好、特别期待、让我们滞留在舒适区，并且消化这个舒适区的“礼节的灾难”。


    吴伯凡


