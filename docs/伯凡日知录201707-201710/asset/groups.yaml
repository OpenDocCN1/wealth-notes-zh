    # 10.4 | 苹果未来还有优势吗？


    10.4 | 苹果未来还有优势吗？ ↓


    # —— 第207天的知识笔记 ——


    iPhone8的议论很多，关于这个产品现在我不想说太多，这里涉及到了我们以前的一个话题："新种族"主义的产生——以前的种族是按肤色进行划分，而现在的种族是以多种要素来划分的，比如使用不同产品的人就会形成一个"种族"。


    "种族问题"一直有一条很重要的原则：所有的判断都不是事实判断，而是价值判断——没得可争论，没得可商量，因为涉及"价值判断"就很容易触到情感底线。


    我们今天不对iPhone 8这个具体产品做更多的评价，但我们可以说的是iPhone。


    # | iPhone的"颠覆性创新优势"


    iPhone在10年前横空出世，完全是作为一个"新物种"出现的，它的胜利在于形成了一种新的产品品类——不是品牌间的简单竞争，而是品类间的竞争。


    ![](img/d67c5f056bd8085d4e954a23126b5c83_135_0.png)'
  - '[PAGE 136]


    # 第一类：


    很多的研发“智能汽车”的公司都是这样在做的：集中了大量的人力、物力研究智能汽车，进行“以我为主”的研发。


    比如有一家公司，每天通过几十辆车在路上跑来收集各种数据，获得尽可能多的场景，当数据足够多的时候，就会产生一种“智能”——这个“智能”的核心是数据量——老中医和年轻中医的差别就是数据量的差别，汽车也是——你的汽车是否有足够的智能，取决于你是否获得了足够大量的数据。


    # 第二类：


    特斯拉。


    特斯拉表面是一家汽车公司，但在“智能汽车”这个领域，它越来越是一个大数据公司：特斯拉的研发部门不是用每天多少辆车在路上跑来收集数据，而是每卖出一辆车，就意味着它的数据库的数据会增加。每天、每月、每年都有新增的汽车在为特斯拉的数据库增加数据。“智能”就存在于这些数据当中。


    现在，在“智能汽车”这个领域里，谁在智能上更具有优势，一下子就清楚了：特斯拉和所有其他智能车。


    总结一下，今天，“智能手机”的竞争已经处于“前一个竞争的尾声”，同时也是“下一个竞争的序曲”。这个行业已经在孕育“新物种”——谁能够在这个新物种的产生过程中扮演关键的角色，谁就是下一轮的苹果。


    9.11 | “再部落化”时代下的“新种族”


    吴伯凡


    在这个“尾声和序曲”并存的时间段，大家不妨预测一下，苹果在已经开始的新一轮竞争当中，会不会是一个新物种的缔造者呢？


