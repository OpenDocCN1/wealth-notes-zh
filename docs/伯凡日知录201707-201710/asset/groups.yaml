    \n# 8.2 | 新物种的脆断\n\n8.2 | 新物种的脆断\n\n## —— 第171天的知识笔记 ——\n\n## ｜灭绝物种曾经也是新物种\n\n\
    说了新物种，我就想到了一些灭绝的物种。灭绝的物种当初也是极具竞争力的新物种，比如，恐龙。恐龙显然不是从来就有的，它出现的时候就是地球上的一个新物种。\n\n\
    有点不可思议的是，恐龙的祖先是鸟，或者说是禽类。大家可以想像一下，如果我们把鸡或鸭的毛都拔了，放它们在地上走，是不是像微缩版的恐龙？仔细一想，恐龙和鸡真的挺像的，它的很多特征也跟鸡一样，比如鸡有鸡蛋，恐龙有恐龙蛋。\n\
    \n![](img/d67c5f056bd8085d4e954a23126b5c83_44_0.png)\n\n明明是和鸡鸭同一个祖先，这个强大到让人恐惧的物种又是如何演变成恐龙的呢？\n\
    \n是因为在特定的环境下，它的性状得到了很好的发挥，形成了某种正循环：当这个物种的体型比其它的禽类更大的时候，它获取食物几率就会越大，而获取的食物越多，这个物种的体型就越有可能增加。这种正循环使恐龙的体型越来越大，让它把同根生的那些物种甩出去老远。而它的体型越大，获得的竞争优势就越大；竞争优势越大，它的体型就更大。但是这时候，一个恐龙自己没有意识到的危险开始发生了，那就是，如果环境一旦发生变化，它获取食物的途径就没那么容易了。\n\
    \n## ｜成也T型车，败也T型车\n\n在商业史里也有“恐龙”，那就是已经灭绝了的T型车。我们现在只能够在一些老爷车的博物馆里才能看到这样的车，但在 一百年前，它不是汽车里的某个物种，所有的汽车都是它这样样子。\n\
    \n![](img/d67c5f056bd8085d4e954a23126b5c83_44_1.png)\n\n1908年福特公司成立的时候，汽车成本很高，只有极少数的富人才能买得起。福特公司靠着它的生产线大大降低了汽车的成本，使得这种本来是奢侈品的东西变成大多数人都能买得起的一种商品，赢得了巨大的市场。\n\
    \n> “今后五十年，我们将在同一种底盘上生产同一种车型，用户可以选择任何颜色的车，只要是黑色。”\n\n## ｜戴尔，PC业的“恐龙”\n\n还有就是戴尔。当PC作为一个新产品出来的时候，戴尔以它独特的生产和管理方式，使得这个产品就像T型车一样人人都买得起。虽然没什么特点，但是价格很便宜，让大多数人都能够拥有电脑。\n\
    \n## ｜“其兴也勃，其亡也忽”的独角兽\n\n这种突然之间起来，又突然之间衰落的现象，是因为新物种性状太单一。特定的市场环境让这种新物种的特点大行其道，迅速发展起来，但当环境悄悄发生变化的时候，它的单一性状没有办法应对变得越来越丰富的情形和场景，它就一定会出现“脆断”。\n\
    \n吴伯凡\n\n听完今天的课程，大家可以想一想，那些被称为独角兽的公司以及它们的产品中，有哪些是真正的新物种？有哪些是虽然来势凶猛，但是很可能一夜之间脆断的物种呢？\n\
    \n# 8.3 | 云思维和雨思维\n\n8.3 | 云思维和雨思维\n\n## —— 第172天的知识笔记 ——\n\n听了这几天的课程，相信你脑中会时时冒出各种名字，比如手环、电子宠物、直播……我相信在未来的一段时间内也会出现各种各样迅速诞生的新物种。\n\
    \n戴尔今天已经私有化了，但它当年的风光我们还记忆犹新。\n\n昨天我们说，福特公司的创始人亨利·福特曾经自信、霸气、狂妄地说：今后50年，我们在同一个底盘上生产同一款汽车，顾客可以选择各种的颜色，只要是黑色的。\n\
    \n## ｜亚马逊的云服务\n\n前两天我们说亚马逊这家公司现在有点四不像。但它从一家网上卖书的公司变成云服务的巨头，它今天的活力和竞争力恰恰就在于它的四不像。\n\
    \n## ｜华为的太阳能\n\n有人问了一个问题：你知道现在中国太阳能技术最先进的公司是哪个家？\n\n答案是：华为。\n\n## ｜云思维和雨思维\n\n\
    水变成水蒸气，变成云在天空自由飘荡，最后各种云朵不停聚集在一起，又被风吹开、吹散，然后又被聚到一起，变成雨，这中间可能要经历好几个月的时间。但是，没有云就不可能有雨，如果你不做云的事，你就不可能有雨，更不可能有及时雨。\n\
    \n## ｜又谈结构性混沌\n\n我们可以把多样性的基因看作是一种对应环境变化的保险条款，它可以避免我们与环境签下一个条款极其单一的合同，以至于当环境发生变化的时候，我们一夜之间陷入破产的境地。\n\
    \n吴伯凡\n\n听了今天的课程，我给大家布置一道作业：中学时侯有一篇叫《纪昌学射》的寓言，说纪昌满心希望地跟他的师傅学射箭，但他的师傅根本不教他射箭，只教他那些在纪昌看来完全没用的技能。但最后，纪昌终于意识到，师傅教的那些没用的功夫恰恰是悄悄教给了他一种绝活。那么《纪昌学射》这个故事跟我们今天讲的多样化基因库和结构性混沌有什么样的关系呢？\n\
    \n南远远地看着它，十天之后，看虱子渐渐大了；几年之后，虱子在他眼里有车轮那么大。用这种方法看其他东西，都像山丘一样大。纪昌便于燕地的牛角装饰的弓，用北方出产的篷竹作为箭杆，射那只悬挂在窗口的虱子，穿透了虱子的中间，但绳子却没有断。\n\
    \n纪昌又把自己练习的情况告诉了飞卫，飞卫高兴得抬高脚踏步，踮脚，拍胸膛。说道：“你已经掌握了射箭的诀窍了。”纪昌把飞卫的功夫全部学到手以后，觉得天下只有飞卫才能和自己匹敌，于是谋划除掉飞卫。终于有一天两个人\
    \ 在野外相遇。纪昌和飞卫都互相朝对方射箭，两个人射出的箭正好在空中相撞，全部都掉在地上。最后飞卫的箭射完了，而纪昌还剩最后 一支，他射了出去，飞卫赶紧举起身边的棘刺去戳飞来的箭头，把箭分毫不差的挡了下来。于是两个人\
    \ 都扔了弓相拥而泣，互相认为父子，发誓不再将这种技术传给任何人。\n\n## 用户留言\n\n翠\n\n现在我每做一件事情，看我身边发生的每件事情。我都会联系伯凡老师说过\
    \ 来对比。比如今天我们的大堂经理遇到一件很棘手的事情，在我看来这事很难办成的。以我惯有的思维方式，我就想着怎么去寻找别人的帮助，或者是推迟处理去想办法。但是经理她不像我的思维，她就是积极的，一直在不停的寻找办法。最后事情终于给她解决了。我在旁边一直看着，我在心里就在对比，原来这就是积极的态度，积极主动跟消极被动的差别。然后我知道以后再碰到这样的事情，我自己应该怎么去面对，怎么样去处理。\n\
    \n08-03 23:02:08\n\n# 本周问答 | 越高级，越脆弱\n\n本周问答 | 越高级，越脆弱\n\n## Ⅰ《新物种的脆断》中“恐龙和鸟类关系”的释疑\n\
    \n前两节讲到了关于恐龙和鸟类关系的问题，其中的一个表述很容易引起疑问，那就是：目前鸟类跟恐龙到底什么关系？\n\n关于鸟类的起源目前有三种论点：\n\n\
    - 1. 普遍的观点是：现在的鸟类起源恐龙。\n- 2. 鸟类起源于槽齿类。\n- 3. 鸟类是鳄类的姐妹群。\n\n我个人比较倾向于鸟类和恐龙都共同起源于槽齿类，也就是说，在恐龙生活的时代已经有鸟出现了。\n\
    \n![](img/d67c5f056bd8085d4e954a23126b5c83_47_0.png)\n\n由于气候发生了变化，体型巨大的恐龙失去了它的生态位，直接灭绝了。但“本是同根生”的分支鸟类，由于体型不大，能够在一个食物不那么充足的环境当中繁衍生息，于是就进化成了今天看到的鸟类。\n\
    \n所以更准确的说法是：恐龙不是起源于鸟类，它起源于看起来更像鸟类的槽齿类。恐龙和鸟类来自同一个祖先。\n\n## Ⅰ独角兽：谨防环境变化\n\n经常看到媒体报道，手机行业利润的90%被三星与苹果霸占，但现在苹果做为一个畅销品，已经不能引领时尚潮流。现在满街的iPhone，都失去了差异化的资本，它在创新上越来越弱，或许不久的将来会横空出世一个新品牌来取代苹果。我觉得苹果做为一个独角兽公司，市场份额一直在下滑。老师我不明白的是：为什么这些大公司（诺基亚、HTC、摩托罗拉）有那么多顶级人才，还避免不了迅速的破灭呢？衰败的终极原因是什么呢？\n\
    \n吴伯凡\n\n苹果不是一家独角兽公司、独角兽公司是有专门定义的：\n\n## 独角兽公司：已经完成了创业初级阶段，进入到一个相对稳定的成长期，估值在10亿美元的公司。\n\
    \n苹果的市值好几千亿、已经非常成熟了，它不是“独角兽公司”。\n\n但正如大家都感受到的，苹果的产品正在老化，它的前景变得越来越模糊，尤其是在今天大谈人工智能、大数据和云计算的时代，苹果将走向何方，确实存在很大的疑问。\n\
    \n那么，为什么那些资金、人才都是其他新创的公司无法比拟、看起来非常强大的大公司会突然之间走向衰亡呢？“颠覆性创新之父”、哈佛教授克里斯坦森早就揭示过这个问题：\n\
    \n- 1. 当公司越来越强大的时候，它对环境的判断、假设就越来越固化。与此同时，它的能力也越来越固化。或者更要命的是它越来越单一化。因为它竞争力很强、能够赚到大钱，而强大的竞争力会让它获取更多的资源，更多的资源让它的竞争力就更强，如此往复循环，导致它的能力出现单一化。越强大的公司，越是对环境那些小而细微的变化不敏感。\n\
    - 2. 当细微的变化突然形成了一个明显气候的时候，这个公司的资源库、能力库、基因库里没有与之相对应的能力和基因。那么，不管它的资金多充足，人才多丰富，它业务指向的单一性导致了这个公司本身能力的单一性。因此，当环境发生巨大变化的时候，原来的优势不仅不是优势，反而成了它的劣势。\n\
    \n进化论告诉我们的，任何一种性状，一种功能的强化都同时意味着其他功能的退化和缺失。所以，表面上是被竞争对手打败的，但真正打败它的是悄悄变化的环境。\n\n\
    ## Ⅰ王东岳：递弱代偿原理\n\n我们到底是应该以变化来应对变化，还是以不变应万变呢？如果复杂性是生存和进化的必要条件，那为什么那些单细胞生物是地球上存在最久的生物？\n\
    \n吴伯凡\n\n推荐大家去读一下王东岳先生的《物演通论》。进化不仅表现在生物界、无机界，也表现在人类社会。越是简单 的东西，它 的稳定性就越强；越是复杂的东西，它的稳定性就越弱。\n\
    \n比如，一块石头生命的稳定性就远远大于任何一个生命，不管是植物还是动物的生命周期。石头太单一了，也就特别稳定。越是高级的动物、越是高级的物种、它的内部复杂性就越强、精密度就越高，而精密度越高的东西脆弱性就越强。我们摔一块石头是摔不坏的，但是把手机在地上摔的时候它就很容易摔坏，这就是高级的和低级的差别。这种“越来越先进的过程=越来越脆弱的过程”的现象，就是王东岳先生的递弱代偿原理。\n\
    \n从这个意义上，虽然人类是万物之灵，但我们比那些单细胞动物要脆弱的多。如果真发生巨大环境变化，那么生物等级上较低的动物就容易存活。但是我们作为一个高级生物不能为了存在的长久性而牺牲我们的生物等级。\n\
    \n开个玩笑，一个物种要想留下，最好 的办法就把它做成标本；它在等级上已经降到非生命形态的时候，它一直就停在那儿了。还有我们人类发明的东西，比如技术、产品，这些通更是被套上了一个进化\
    \ 和创新的红舞鞋，停下来就是死亡。你要不死亡，就要不断地变复杂变精密，而越复杂 越精密，就意味着你越脆弱。这就是物种的命运，也是一个产品的命运。\n\n\
    比如生产手机，就有可能随时被 人给替代，但如果去生产菜刀，被替代的可能性就很小，因为一千年后人们可能还会用菜刀。但不能因为一个产业不稳定、一个行业的风险大，就退回去做那些产品生命周期特别长，科技含量、创新水平不那么强的那些产品。任何一个生态位都被物种所占据，一旦退回去，直接面对的问题就是激烈的竞争。\n\
    \n而我们对竞争的定义很清晰，就是生态位重叠。在重叠过程当中，你随时可能被替代。\n\n## 用户留言\n\n提交留言可与专栏作者互动\n"
  mdcn: "\n# 7.31 | 新物种=新的性状组合\n\n7.31 | 新物种=新的性状组合 ↓\n\n## —— 第169天的知识笔记 ——\n\n最近有一条新闻，说将在这里年底来北京演出的太阳马戏团现已开始售票了。\n\
