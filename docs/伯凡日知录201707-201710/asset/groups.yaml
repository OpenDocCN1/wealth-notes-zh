    # 丨“人是生活在自己编织的意义之网上的动物”


    以前看“创新”仅仅是看创造发明了什么，现在看“创新”更多是看利用已有的资源进行排列组合产生新的功能。就如人们以前会把怎么吃也长不大的猪杀掉，而现在食物充足了，这种猪经过一系列概念的包装成了宠物圈的新贵，完成了一种从食物到宠物的转型。所以，所谓的“创新”和“新物种”也不一定得是新的事物。旧的事物在新的时代背景下功用发生了变化，就算同样东西在新时代也可以被赋予新的意义，成为“新物种”。就如古代民用陶瓷如今很多成了古董收藏，同样的东西不同时代背景，几乎就是两个物种。也许这就是为什么说：“人是生活在自己编织的意义之网上的动物。”


    吴伯凡


    这个引申很好地概括了“新物种”产生的真正原因。


    地球上最早出现的物质还不是物种，它们往往是单原子结构。后来由于元素种类增加、场景的复杂，使得地球上出现了各种各样指数级增长的物种，它们都是化合而成的。所以在这个意义上，“新物种”越往后越显出一种化合的状态，因此我们今天看到新物种不再是单一要素、功能的承担者，而是多种要素、功能的化合。


    # 丨文科生的能力


    “创新是一种巧夺天工”让我觉得很受启发，把“天人”跟“精日课”四老师讲的文科生理科生结合起来看：文科生是在学天道，理科生是在学人道。钻研人道的理科生不断开发各种新技术，而钻研天道的文科生审时度势做取舍。如果把两者很好地结合起来，就是天人合一的完美境界了。


    吴伯凡


    李开复前不久说了一句话“在人工智能时代，文科生终于轮到扬眉吐气的时刻。”


    # 丨“天下万物生于有，有生于无。”


    鸵鸟在遇到危险的时候会把自己的头埋到沙子里去，这不是因为鸵鸟傻，也不是因为它害怕，而是通过把头埋在沙子里去可以准确地侦察敌情，通过沙子的震动来判断敌人的力量和距离，以便做好应对策略。一个生物的习性和生长模式，主要取决于它的性状组合，而这些性状又是环境所孕育的，物种的进化与演变，都有基因内部最根本的模式，也就是一系列生存策略暗码，无论是...


    老子在《道德经》中所说：“反者道之动，弱者道之用。天下万物生于有，有生于无。”


    个地方后后结七赢待J士似，自然，那些积极主动的老鼠的基因就留不下来了。


    所以，我们说一个“新物种”是新的还是旧的不重要，关键在于它是否能够活得下来，能否是一种留得住的、能够繁衍下去的物种。


