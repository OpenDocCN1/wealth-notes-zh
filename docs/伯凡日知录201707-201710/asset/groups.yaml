    有比我们做得好，你们为什么不说啊？这些话可能都是实话，但是你不能说。原因是：第一，跟你的目标没什么关系；第二，他甚至正好跟你的目标相反。当你在解释问题的时候，不管你用怎样的事实和理由来解释问题，都是对用户愤怒的无视。一旦你开始说这些话的时候，就已经在远离你的目标，甚至是与你的目标背道而驰了。


    所以说：


    不管是在生活当中，还是在工作当中，我们总会遇到各种各样随时出现的关卡，这个时候最不该忘记的就是你真正的目标是什么，千万不要本能地把自己的注意力和精力全部集中在眼前的这个细节上，你越是这样做，这个关卡就越是不能过去。因为你没有找到钥匙之前，一切的努力都是白费，所以说在这个复杂的世界上，要有口令思维。


    吴伯凡


