    另外，关于我讲的“当一个新的产业情景出现的时候，原来极具竞争力的企业突然之间完全丧失竞争力，甚至猝死”，隔壁专栏《张潇楠·商业经典案例课》提供了一个非常贴切的案例《Netflix
