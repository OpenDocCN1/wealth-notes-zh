    ## 周末加餐 | 为己之学


    前不久，咱俩《伯凡·日知录》办了一个小型凶见面会，我和几位同学讨论了很多问题，我也受到了很大的启发，感谢同学们的精彩发言。今天趁周末的时间，和大家分享一些我们当天讨论的部分内容，希望你也能从中受益。


    ### 保持幼态，终身学习


    学习的状态是一种挑战，让自己对一种新的东西产生好奇。实际上，这是一种心智的幼态延续。我们学习曲线的陡峭程度是和我们的好奇心成正比的，小孩在一出 生，稍微有点点感知，他就有强烈的
    好奇心，所以人的学习曲线从0岁到7岁是很 陡峭的。而从7岁到14岁，也比较陡峭。 但逐渐逐渐的，从14岁到21岁，从21岁 到28岁，逐渐地平缓，到了35岁，再一
    个七年，就是一个平的线，甚至往下走 了。


    我们说终身学习，一个很重要的动力，就是延续你的好奇心，那种幼态，小孩的那 种好奇心。要终身学习的道理我们都明 白，但是人从来不是根据道理去生活，根据道理去行事的，而是根据场景。所以，
    我们就秦要把自己置入到知识的场景当中， 激发自己的兴趣、好奇，进而去思考那些 超出了我们视野的东西。如果你能够常 保持着这种张力，就证明你是处于学习的状 态，如果你不是处于这种状态的话，你强
    迫自己学习，你想往自己的脑子里灌一 些东西，即使灌进去了，很快也会蒸发 掉。


    ### 虚位以待


    总有人问我，看了那么多书怎么能记得 住？我说是，我记得住其实是因为，我迅速 地在我学到的东西之间建立了连接。丢掉 一个东西容易，但如果几个东西栓在一根 绳上，就不太容易丢掉了。你要建立各个知
    识点之间的关联，这样想丢都丢不掉。或 者说，当一个新东西出现的时候，我第一 眼看到的是，我关心的某一个问题原来是 这样的。


    之前中信出版社给我发了一个PDF文件， 是他们马上要出版的一本新书，讲意志力 的。序言我一看就知道，这本书是我一直 要找的。为什么？因为我一直在考虑意志 力，它既然叫意志力，它形成的机制是什
    么？为什么有的人意志力特别的薄弱，激 情很高，但很快就消失了？有志者立长 志，无志者常立志，为什么有些人常立志，戒烟就只有几个小时，这到底是怎 么来的？也就是说，我一直在思考意志力的问题，只不过我的思考里有很多漏洞需要
    填满，也就是虚位以待。所以拿到书之 后，我很快就把整本书都看完了。如果你 不在头脑当中制造很多虚位以待的东西， 你是不可能有高的学习效率的。


    ### 君子见几而作


    如何获得认知优势？不要去学那些大家都 可能学到的东西，这个世界上最不稀缺的 就是那些大白于天下的信息和知识，水涨 船高，学了你也构不成优势。最稀缺的是 什么？是已经出现的，但是只有少数人能
    感受到的，微妙的，但具有决定性的那些 趋势和知识。几乎就是差不多没有，实际 上又有 getattr那些东西。这个东西就叫几。 跟“机会”、“见机行事”的“机”不
    同，但也有联系。


    我们知道，熟练的出租车司机知道堵车 的时候该走哪条胡同、哪条小路，但是这个 信息他是不会共享的，因为一旦共享了， 所有的车都跑到这条小路上来，那小路一 定是堵死的，不仅不会形成优势，很可能
    形成巨大的劣势，因为这是条小路嘛。


    我们要的，就是那种佚稀出现的东西，那 才是最重要的。在黎明之前，会有特别黑 的那一段民间，在那一段民间里面，只有 极少数的人，比如说长期生活在荒野的猎 人，在没有指南针，看不到星星，没法识
    别方位的情况下，他知道马上天就要亮 了。但是大多数人只能通过已经出现的曙 光发现哪边是东方。


    大家作为自己的领导者，要看未来的方 向，而方向这种东西，不是说我想保密不 告诉别人，是即使我告诉别人，别人也不 会相信，因为他感受不到那种东西。所以 从0到1的创业，他是在常识和幻想之间找
    到了一个秘密。常识是不可能创业的，纯 粹的幻想当然也不能支持你创业。对你来 说真真切切，对别人来说虚无缥缈的东 西，这就叫见几而作，君子就要做到这 样，所以君子就是领导者。


    华为有一句话，“绝不在非战略性机会点 上消耗战略性资源”。企业也好，个人也 好，都应该是这样。我之前讲过，自然界 里最猛的猛兽猛禽，它们平时都是病怏 怏的，是因为它们太清楚要把精力消耗在
    哪些机会点上。这是区别卓越的人、优秀 的人和普通人的一个很重要的地方。意 志力资源有限，你一定是引发了一个小的 变化以一天，这个小的变化像发酵一样，自 内而外的，引发一场大变革，高人就是这
    样。而普通人就是新官上任三把火，大张 旗鼓地改革，实际上是行不通的。


    ### 延迟判断


    大家都在讲穷人思维和富人思维，我觉得 可以用一个纬度来区别，那就是是否会延 迟判断。穷人思维是什么？穷人思维就是 事情的好和坏只是眼下，就这一刻，他 不会延迟判断。而富人思维，就是这个事
    的好和坏，我先不判断，我先要问这个事 该不该做。假如，你抱了特别大的期望， 做了一件你觉得能改变你的一生的事，后 来发现根本没用，甚至有副作用，那结果 就很惨。如果你会延迟判断，就不会轻易
    地在最初就判断一件事情有用还是无用。就 像电影《罗马假日》、《芭芭公主》、 《角斗士》等，拍摄的时候完全没想到后 来会给拍摄地带来那么大的游客量。


    ### 为己之学


    孔子说，“古之学者为己，今之学者为 人”。古代的学者是为自己而学的，为自 身的进步和成长而学，这叫为己之学；今 之学者，是为了在别人面前显得自己有学 问，或者是拿去卖弄，这种就是为人之
    学。


    我认为现代社会的某些人格问题、精神问 题，在很大程度上，是因为我们不再是一 个为自己的人了。没有了人格，成为了人 格商品袋子。也就是说你这个人不是个人，实际上是装各种商品的袋子，你要尽可能地
    往这个袋子里放更多的商品，提到市 场上交易，“你看我的价码高吧”。


    比如说穿衣服这件事情，我曾经讲过，服 和装，这两个都是连在一起的，服装饰 装，但是服和装是不一样的，服是舒服 帖，是为你自己穿的，这叫服。装是什 么，以衣壮之，以衣服壮大自己，是要给
    别人看的。再比如说爱这个事，为什么要 讲爱的艺术？爱的本质是什么？爱的本质 是爱人，而现在的爱，有的是让自己显得 可爱、值得爱，让自己的人格商品袋里的 东西更多些，然后在爱情交易市场上获得
    更高的交易，这是很要命的一个东西。


    学习也是这样。学习，我们到底是为己之 学，还是为人之学？学这个东西，应该还 是为己之学，不是卖弄，不是交易，而是 真正要解决自己的问题，要明白哪里是真 正有问题，要真正会提问题，然后在这个
    问题的基礎之上，渴望有不同帮你的人 来解决这个问题。而不是说我现在就是一 个蓄水池，我也不需要水干什么，我就不停 地把水蓄在这个池子里面，这个东西对别 的方面也许有用，但是对于学习是毫无意
    义的。因为你的东西放在大脑里，当你没 有办法把这个东西放在特定的框架的时 候，它就会自动蒸发，或者它自己就消减 了。


