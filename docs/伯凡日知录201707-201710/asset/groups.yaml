    有自己的独特色方。阳光和水对于植物，就像钱和健康对于人类一样，这是两个需要平衡的点。植物自己能根据环境，巧妙地平衡好这两个点。


    今天的文章我最有感触的是，曾国藩智转换后的那一句一跟人相处的时候我只看结果，我不訾判你的过程。大多数时候，我们都喜欢以自己的观点去 绑架别人，总是希望别人按照自己的思维方式想，按照自己的行为习惯做，一有什么跟你想的有出入的地方，就急狗跳墙般的出来“教训”“指导”；其实每个人都有自己的思维方式，给他人足够的空间去
    展开他自己 的想法，只要结果不太离谱，其实也没多大影响，不是吗？我  想，这也是领导和家长长有的智慧吧。再者，注意力是有限的，这个世界上你管的事情 越少越好，当你的注意力控制在一个很小的范围时，你的机会就越大；注意力是宝贵而有限的财富，没有必要花那么多时间去管别人的事，将自己有限的精力关注于自己的成长，才是最有价值的事。在我看来，企业和个人的硬通货都可以归结为声誉二字；企业有好声誉，即使转型了，客户还是会认可你的产品，甚至会继续购买你的新产品（当然好产品与好声誉之间是一个良性循环的过程）；个人有好名声，即使你创业失败了，还会有那么多人无条件地帮你，这就是硬通货的价值流动性强的表现。


    如果用一台电脑来作比一个企业，那么硬件越好 操作系统运行越流畅，相对企业来说就是资本越雄厚、优质，那么企业 建立和运行流畅的操作系统就有了更好的条件。企业的操作系统是由决策权、信息传递方式、激励制度、组织结构四个方面构成的，那么它们运行的基本规则是什么？结合6周所讲的拉波波特游戏规则所体现出的4种人性，正直、诚信、原则、包容，我们不难看出，首先，一个好的企业的操作系统是开放的，兼容一切硬件（资本），也兼容一切软件（人才、技术、产品、合作、竞争）；其次，它是有原则的，也就是有制度和规范来制约硬件、软件、使用者的行为，不能带来破坏性效果（比如硬件故障、病毒、破坏电脑）；再次，在系统硬件资源
    的分配上是正直的，不偏不倚，谁在前端的 需求大，谁在后台默默地运行，操作系统是非常清楚的，并且合理地分配着硬件资源，最后，以诚信来兑现承诺。所有在操作系统中运行的软件、硬件都会体现和获得自己的价值。使用者使用企业这台电脑，解决了问题，处理了事情，得到了好处，初期可以是免费的，后期再用电脑就要收费了。硬件（资本）、操作系统（企业）、软件（员工、合作者等），大家分配利益，皆大欢喜。这是学习至今，我对如何建立一个良好的企业操作系统
    的一些思考。


    人类进化 的过程中，为了适应当时的生存方式，自然而然地内化了一些本能反应。例如恐惧、贪婪、嫉妒、厌恶损失等等的心理状态，而这些远古留下 的潜意识，应对现在的
    高科技时代时，却往往是错误的。所以我们要了解这种心理特征，并用刻意练习的方法，去除不利的本能，又要把一些适应当代的知识，内化到潜意识里，形成新的本能。这种刻意练习的方式，需要大量的实践，才能逐渐掌握。这种过程所引发的效果，大概就是老子所说的无为。不刻意，就能做正确的事
    情。多维度规划自己的人生或公司时，它起到的作用，是相乘的关系。多维度并进，在单一维度上，高度聚焦，大处着眼，小处处置。


    感觉，这其中蕴含的道理很像王东岳所提出的递弱倒猝原则，也就是一个生物层次越级高，它的代偿就越高，存在度就越低。想要提高存在度，那么就要降低他的代偿性。但是存在都是不可逆的，所以我们只能疯狂地用代偿来弥补我们的存在度降低。所以我们要因其道而行之，学习那种无为而治，少即是多的理念和方法。要有弹黄思维，只有在蓄力准备好之后才会利用势能弹动，完成任务。而在平时尽量保持一个低熵能的稳定状态。到了必须时刻才会压缩弹
    簧积累势能，然后在很短的时间内释放出来。这才是一个更要  谐 的求稳策略。


    吴老师今天的总结，让我联想到了两个重要的性格特质：“谦卑”和“自律”。谦卑就是性格上的降维。何帆老师上次在“得到”做直播的时候说过一句 话，我一直牢记在心：“一切让人学会谦卑的学问都是好学问。”因为谦卑能让人懂得感恩和珍惜，保持清醒和敬畏，从而使人们的心态变得平和，同时又具有更高的适应性。事实上，对于我们绝大多数普通人来说，可利用的资源总是有限的。在这个前提下，谦卑的好处就不言而喻了。“知道的越多，不知道的就越多。”“不知道的越多，越谦虚谨慎。从这个角度来看，不断地学习，不断地拓展眼界，不断地提升
    认知水平，是学会谦卑的重要途径。我在“得到”上跟着诸位老师学习的过程，就是不断认识到自己的浅薄无知，又不断 进产步的过程。李笑来老师就常常告诫我们：“最可怕的是，不知道自己不知道。”万维钢老师前一
    阵领着我们把目光从忙忙碌碌的现代生活中移开，重新投 向久违了的宁静浩瀚的宇宙。在那里，万老师给我们展示了一幅幅肃然的画卷和那些动人 心魄的未解之谜。全程听得我浑身起鸡皮疙瘩。恍惚间意识到，这样的体验已经只存在于儿时的记忆之中了。那时候的我知道自己很渺小，但也因此对这世界充满好奇。获取满足感，始终贯穿着我们的生命历程。被动如生存竞争，主动如工作爱好，都是不断被满足感奖励的过程。自律就是对满足感的管理。当满足感来源十分单一的情况下，就会导致满足的阈值不断被提高，进而变得越来越不容易被满足。就像电视里常
    看到的那样，吸毒者会慢慢加大吸食的剂量，最后必须得通过静脉注射才能抑 制毒瘾发作。恐龙生活的环境对它们十分有利，资源丰富，任其索取。在这样的环境中，故循地吃就是最低成本的获取满足感的生存方式。同时，更大的体型也是一种简单粗暴的对捕食者的手段。这在一定程度上，确实是对现有资源的充分利用。可是，对单一资源的依赖程度太大，就直接导致对于变化
    缺乏弹性。边际收益其实是一个先升高后降低的曲线，过了顶点之后，性价比就不高了。就好像肚子饿的时候吃慢头，第一个慢头会让人获得特别大的满足感，第二个就差 不多够了，再吃第三个就会感觉到胀，再吃就想吐了。因此，即使环境对我们十分有利，也需要勇敢跨出舒适圈。要有居安思危的意识，培养多样化的满足感来源，给生活提供多个支点，以此来营造平衡、自律、健康的生活状态。总的来说，谦卑能够让我们更容易发现和利用有限的资源，自律又会让我们在利用资源的时候保持适度和理性。二者搭配使用效果更好。


    对于悲观主义者，如果可以 将悲观、焦虑、不安转作一种动力，悲观的环境可以是一种“资源和“动力”。反之则是一种束缚和制约。对于乐观主义者来说，盲目乐观所造就的“环境”会成为一种
    认知束缚，因为有很多因素是不可控的。不过话说回来，乐观本来也是一种资源。在可以努力争取到的相对确定性面前，我的天平会偏向谨慎的乐观；在无法控制的不确定性因素面前，适度的悲观更有助
    于激发潜能和动力，识别风险等。


    顺着伯凡老师关于孩子教育的主 题，我这个大学生多说两句啊。关于教育，我觉得最根本的问题还是在于“去标准化”。上大学前三年的痛苦，还有一本《平等的终结》让我实在在地想通了这一点。中午和爸妈聊天，聊到妈妈去听的
    教育界专家的报告，我顺便提了一句：我觉得大学本科要想培养创新型人才，先要做的第一件事情就是砍掉大部分专业，去培养基础性能力、通识能力、底层学习能力。其实跟伯凡老师说的“非认知能力”很类似。其实我觉得可以更粗暴一点：先老老实实把数学语文英语学好再说。因为中国的高中毕业生可以说是基本什么都不懂，在底板还没有的时候就想垒墙那是他们都
    没有的事。包括很多大学老师在内，他们对教育有一个错误的假设：教育是提供一些现成的道路让学生去选，走不好就是你不上进，就是你笨蛋。实际上我觉得恰恰相反：教育应该是在一条未建成的路的两边提供各种各样的资源，让学生在其中不断发现自己的兴趣点和天赋点，把这些资源主动
    取来，一砖一瓦地搭建起一条通往自己未來的道路，而这条路也只能由自己 给自己铺。只有秉基础性的非认知能力 夯实，才有可能推以后的发展。本科院校在培养好学生的底层认知能力之后，再为学生提供各种各样的可能，鼓励他们去发现并发展自己人生的各种可能性。只要底板结实，资源丰富，同时建筑师自己有自主选择权，这


    丰富，同时建筑师自己有自主选择权，这样我们才能建成一座稳固而有创意的建筑，这才是我们需要的创新。


