    # 7.19 | 愚人税


    7.19 | 愚人税


    —— 第163天的知识笔记 ——


    # 你是花19块5买雨伞的“聪明人”吗？


    有一个和最近大雨有关的段子。南方某地一个公司发起了共享雨伞的计划，在各个公共汽车站点投放了4万把雨伞，一把雨伞的押金是19.5元，每次使用0.5元。在一个大雨的下午，这4万把雨伞都被共享了，几乎没有还回来的。


    这是一个很成功和狡猾的营销案例：在没有营销，没有广告，没有渠道费用的情况下，价值9.9元的雨伞被以19.5元的价格一售而空！


    《钓愚》这本书，就是讲资本市场上很多玩家、操盘手利用人性当中的愚蠢来赚钱的。愚蠢是普遍存在的，尤其在那些聪明人身上特别明显。真正愚蠢的人是看不懂那些操纵手段的，只有那些自以为是聪明的人才会在自鸣得意中愉快的上当。


    # 你是花100块钱买只鸡的“聪明人”吗？


    # 你是买股票像买菜一样的“聪明人”吗？


    # 你是选择100美元滑雪票的“聪明人”吗？


    # 你是直销保健品的目标客户吗？


    # 你是朝阳仁波切的目标用户吗？


    # 你也喜欢吉利数字吗？


    # 有效的理财方式：少交愚人税


    行为经济学的通俗读物《怪诞行为学》的副标题是：可以预见的非理性行为。所谓非理性行为，就是愚蠢的行为。


    吴伯凡


    听完今天的分享，我们不妨反省一下我们平常的消费行为：哪些是在自以为得计当中被套进去的？你是如何为自己没有意识到的荒唐和愚蠢而买单的？大家可以举出一个两个发生在自己和别人身上的例子。


