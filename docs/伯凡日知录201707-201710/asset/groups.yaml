    基因库的多样性，为有效应对不同场景提供了路径依赖，看完这篇文章我得到了两个点：一是凡事预则立，不预则废。想要完成目标，必须做好事前准备，要让天下雨首先要“制造”乌云。二是看似无用或者不相关的基因，可能在冥冥之中会与场景形成绝妙的匹配，从而诞生出一个新物种，可能会在未来兴起一场“革命”。就拿读书为例，读了很多书积累了知识，虽然很多知识在当下的场景里应用不到，但可能未来某个场景里起到意想不到的作用。所以读书用到时方恨少，这也说明了我们大脑基因库中的知识缺乏，无法应对实际生活中所遇到的各种场景。脚踏实地，不积跬步，无以至千里。转换思维，有则以为利，无则以为用。


    我认为自上而下与自下而上其本身没有好坏之分：上，抽象出的认知；下，实践的行为自下而上：由实践抽象至经验。自上而下：由经验指导至实践。伯凡老师强调的是知行合一且循环的整体成长策略，在“上下上下”的循环中动态壮大。成长的循环：现实——认知——行动——现实反馈——认知——行动——现实反馈。


    边絮竞争力的感觉是，它可能是一个很小很不起眼的东西。但确实是前进路上的一个重要的标记。了解了这个标记事半功倍，如果不告诉你那标记是什么，那就是事倍功半。我们向老司机问路，老司机三两句就给你讲清楚了，前面几个红灯口后有个什么牌子，在哪里怎么转，然后直走就到了。我们是听得简单。但“老司机”能说得这么简单，那是因为他走了许多复杂的弯路，所以浓缩出了精华，简单有效。山坳里的橡树叶也一样。看似很简单但可以想象一下。在这之前无数
    measure 的农民“老司机”一定也是像田间地头的爱迪生一样，实验观察了不少东西，然后在树下休息探讨，磨去不知多少时间。才能简单地告诉你“看橡树的叶子”。


    沟通语言这个话题，我深有感触。以前在工作中，以为有的同事不好合作，甚至感觉针对于自己，把原因归咎于“八字不合”。我们办公经常用到邮件，有一次，无意回看自己发出的邮件，发觉自己的表述措辞以及语气、表达的习惯都有问题，如果我是收邮件的一方，或许我也不会接受或理解对方的观点。而这是在发邮件当时无法感觉到的。大家可以尝试回看自己与别人的文字聊天记录、邮件，总会发现些什么。


    吴老师，今天的课程真是听得过瘾，悠然顿悟，如同醍醐灌顶。 MWU 大半年，忍不住发帖回应。我因为工作关系，经常需要出差海外和客户交流，包括在很多大型会议上做主题宣讲，当然都是用英语。在交流过程中，我可以完全聚焦业务问题本身而无需投放精力在英语上。而这一切都开始于一次意外的经历。我曾在中学和大学时投入很多时间在英语学习上，听说读写，尤其是每天早上都要到学校的湖边大声朗读英语，坚持多年。这顾问是因为爱好，二是认为必要。然而，在工作后第一次出差海外，却发现到了实战时很吃力。当时是独自去泰国曼谷出差，在香港机场转机，我的英语都差到连问下段航班的值机柜台在哪里都问不清楚，最终不得不写出来才解决问提。而我是公司派出去要去做一个重要的方案演讲的，焦虑可想而知。然而，就在那个周末我迎来了最重要的转变。因为交流在下周，当周的周末我决定去大皇宫逛逛。出门打了一个三轮摩托车，嘟嘟车（tuk-tuk），把大皇宫的照片拿给司机看，司机立刻心领神会，立刻着车出发。结果过了一会儿就到了，让我下车，我下来一看，发现好像不是大皇宫，而是一个珠宝店；他说没问题，你进入看一眼我们继续，于是继续上车，一会儿又到了，让我下车，我看还不是，是个翡翠店。我说在那里呢，连售票厅都没有找到，当然所有这些都是用蹩脚的英语加上手势辅辅完成沟通的，他又说没事你看一眼我们就继续；当第三次故技重施时，我一下明白过来这不是走错了路，这是故意带我兜圈挣珠宝店佣金呢。周末时间如此宝贵，我一下子就火冒三丈，直接下车指着他鼻子大骂了三分鍾，骂得很过瘾，从诚信到时间重要性到服务意识，骂完把他赶走了，然后步行过去大皇宫。然后忽然我想起一个问题，我刚才用什``么骂他来着，好像不是中文，而是英语！我居然可以说得出如此顺口流利的英语，完全无需大腦翻译的过程，而是想到啥出口就是标准地道的英语了！从来不敢想象！和平常结结巴巴的区别在于，当时我进入了一种完全忘我的状态。明白了这一点，接下来的那周的交流就容易多了，交流非常成功，赢得了客户的一致好评，还问我英语是从哪里学的，是否留过学。
    从此开启了我的英语演讲的特长，在后来的工作中给了我很大帮助。 多年之后，我依然想，不知道那个曼谷司机有没有想过，他的一个随意的动作，却成就了一个陌生人的英语突破。将来如果有机会见到他，我一定要诚信地补偿车费给他。其实，无需多言，这个故事就是发生在我自己身上对今天的课程内容的最
    好反映。 从长期的有意识训练到下沉为无意识的反应，需要一个契机，越过那个契机，无意识比有意识要高效和精确得多。 扩展开去，也让我在别的领域有所悟。 分享给各位知友，更谢谢吴老师！


    最后，请以下同学在留言区留言，写下你的通讯地址、姓名与联系电话，得到的工作人员会在下周把书寄给你：


    Want me、桃之天天、心无猛虎，牛啸牡丹、郭成、HL、仲中原、金思蔻、大刘、Echo、老树阳光


    ## 预告 | 幸运、天赋和努力


    ![](img/d67c5f056bd8085d4e954a23126b5c83_81_0.png)


    预告 | 幸运、天赋和努力


    ### ｜框架理论


    日本的“经营之圣”松下幸之助每次招人的时候，都会问求职者一个同样的问题“你觉得自己是一个幸运的人吗？”


    他为什么问这个问题呢？因为他认为，如果自己的公司里都是觉得自己很幸运的人，这个公司才会健康的成长。


    松下幸之助的思想的背后有一个他自己可能都没有意识到的理论——框架理论。


    “框架理论”跟摄影有关。当摄影师拍摄一个实景的时候，他会精心的取景，从一个客观的场景当中截取他认为最符合他的标准、他的价值的那一部分景物——从这个意义上说，任何一种摄影都是拿真相在撒谎。


    “框架理论”后来成为了一种传播理论。所谓“新闻传播”，表面上是在报道真实发生的的事，但你为什么选取这样一个事件登在你版面有限的报纸上呢？在报道这件客观事件当中，你无意当中采取的取舍标准已经悄悄的对这个客观事实进行了PS。


    事实上，人的感知行为、认知行为都是在不知不觉之中，用自己内在的框架给现实动了手脚。听起来极其客观的表述是一种不自觉的作弊。我们每天都在用这样一种方式看着我们周围的世界、周围的人和我们自己。


    在一群岁数大的人当中，有的人会说“我一天比一天老了”，这种人无意当中选择了悲观主义的框架；而另外一种人会说“我过的每一天都是我生命当中最年轻的一天”——这两种人都没有撒谎，他们的表述如此不同的差别就在于所依据的框架不一样。


    如果你太太怀孕了，你就会发现街上有好多孕妇，这并不是因为街上的孕妇增加了，而是你选择了一种新的框架。


    《伯凡·日知录》本周会分析框架对个人有什么样的影响，我们在提升自己认知的时候，如何给自己的框架做一些改进和手术，已经这样做的结果会是什么样的。


    ### ｜语欲胜人症


    前一阵我给一些创业者上课，发现了一个现象：这些创业者提问的特点跟他们所经营的企业特点非常相似，他们问题的品质跟他们的经营品质非常的对应。


    事后我做了一些调查，发现那些总是以一种理性、建设性态度提问，以解决自身面对的问题和困惑为诉求的创业者，他们企业都经营的不错；而提另外一种问题的人，他们的企业都存在着明显的问题——他们提的问题更多不是关于他们企业的问题，而是包含着某种明显的挑战性。这种挑战性往往都是肢解性的，他们在提问当中获得了某种战胜被问者的快感——这种现象古人叫“语欲胜人症”，现代人叫“雄辩症”。


    雄辩者之所以在非关键性的节点上不断的谋求快感，是因为他们并没有在关键性问题上取得真正的成就感和荣耀感。他们被这样一种琐屑的、肢解性的快感所绑架，最后忽略，甚至完全遗忘什么是真正的成就和荣耀。这种挑战的姿态，固然让周围的人感到不愉快，但真正的受害者是他们自己。


    《伯凡·日知录》本周告诉你：雄辩者为什么会被这样的快感所绑架，这种快感形成的机制是什么，以及它的危害。


    ### ｜幸运的发生机制


    从框架理论我们引申出另外一个话题——幸运。如果你选择了幸运的框架，你的内心会形成一种幸运的滚雪球效应，你会不断的、不自觉的寻找证明你幸运的各种事实。同时，对那些不幸运、不愉快的事事实来越具有一种忽略的能力和习惯。


    有一句话说“我们现在的奋斗都是为了兑现小时候吃过的牛”。吹牛和吹牛不一样，有一种以虚荣为基本诉求的吹牛，还有一种更接近于愿景——当你不断向别人表述你的愿景的时候，你就把自己陷入到了一场自己没意识的赌局当中，也就开始了一场滚雪球的游戏。


    世界上 साथ दो种相信，一种是“看见了才相信”，还有一种是“相信了才看见”。当一个人沉浸在他自己的愿景，或者越来越不自觉、非常幸运的被幸运感所绑架的时候，他也就进入到了一场幸运游戏当中。


    假戏真做，弄假成真，让一个听起来很不靠谱的豪言壮语，最终成为现实，这就是幸运的发生机制。


    ### ｜幸运、努力和天赋的关系


    如果从幸运的角度看自己的话，我们会发现人生就是一场幸运的奇幻之旅：我们的生命开始于一个亿分之一的幸运游戏，你在只有亿分之一的成功率中胜出，接下来，穿越无数偶然，一步步走到了今天——说到底，生命是一场开始于幸运游戏，尽可能让这场游戏持续得更久一点儿的奇幻之旅。


    《牧羊少年的奇幻之旅》讲的就是这样一个故事：一个少年在大树底下做了一个梦，梦见了遥远的金字塔有一个宝藏。他梦醒之后，卖掉自己的羊，历经千辛万苦去寻找宝藏。一路上历经千难万险，九死一生，在接近金字塔的时候，少年落到了一群盗匪的手里，他无意当中听见了盗匪的谈话，这才知道他历经艰辛找到而没有找到的宝藏原来是在他的出发地，也就是那棵树下埋藏着。


    这个故事是一种启示，它告诉我们构成我们生命的是三样东西：天赋、努力和幸运。最初游戏当中已经出现的这三样东西会一直伴随着我们的一生，缺一不可。


    突如其来的幸运很可能是一场空头支票，关键在于你如何通过救赎、努力、凭着你的天赋将这个空头支票变成一张实实在在的支票。


    这就是本周《伯凡·日知录》要和大家分享的四个话题，道理也许大家都懂，但真正要明白这个道理是要在一个个的案例故事和场景当中去感受的。

