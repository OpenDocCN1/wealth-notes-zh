    ## 预告｜深度剖析商业新物种


    预告｜深度剖析商业新物种


    说道2017年的热词，“新物种”应该算很重要的一个。无人驾驶汽车、比特币、共享单车……甚至共享汽车，这些新产品和商业模式的出现，使得很多人都开始谈论“新物种”。


    “新物种”我们以前讲过一次，讲了新物种和性状基因组合之间的关系，本周我们会在之前的基础上，进一步深入分析“新物种”。讲一讲为什么会发生物种大爆发，物种大爆发之后的生存策略，以及性状组合的本质是什么。


    ## ｜新物种大爆发


    物种之所以大爆发的原 因，和“约束条件”的消失或放缓有关系：寒武纪的物种大爆发是在五六亿年前，其中一个很重要的因素是氧气浓度突然大幅度上升，生物生存的约束条件突然消失，生物所需要的资源和条件大大增加。


    事实上，很多商业繁荣都跟“约束条件”的消失和新资源的突然出现有密切的关系。在今天，数字科技、信息技术、智能技术使得从前各个产业所受到的那些明显的约束条件一夜之间消失，这就导致了商业物种的大爆发。


