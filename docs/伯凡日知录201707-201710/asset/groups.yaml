    # 本周问答 | 沸点思维


    # I 沸点思维


    听说过边际成本和边际收益。第一次听到竟然还有边际竞争劣，这让我联想到老师之前提到的核心优势。刀锋竞争力是个体或组织的“绝技”，只有到了某种极致的场景这种绝技才能被激发出来，并能够取得“决胜于千里之外”的效果。老农民的大数据库是多年实践积累的经验，是对自然环境反复认知辨识后的结论，虽然没有专业的理论总结，但是他们就是依靠他们自己的一套感知系统来做出准确判断的，因此要了解某一具体地方的农业问题，向专家不如问当地的老农。有一个问题想向老师，既然刀锋是整把刀的最边缘的部分也是最关键的部分。我在思考既然我们用刀要用的
    是刀锋部分，那除刀锋以外的部分是不是都是废铁呢，它们仅仅是起着“连接”和“代替”的作用吗？我们花在整把刀上的成本，是不是就是只是在为刀锋买单？延伸一下作为个人或企业要有意的培养自己的刀锋竞争力，怎样去均衡刀锋竞争力与其他部分竞争力的关系？


    # 昊伯凡


    这个问题让我想到了一个很老套的故事：一个人吃了4个烧饼还是没吃饱，然后他吃了第5个烧饼，一下就饱了，这个人就说，早知如此，我就不用吃那4个烧饼了。唯一防断更微信：699250

    刀锋的确是一把刀最关键的部分，但是刀锋以外的部分并不是可有可无的。刀鞘是实现功能必要而不是充分条件，而刀锋可以理解为这把刀的充分条件。只要这两者合在一起，我们才可能实现自己的目的。可以想象一下，我们能不能用一根细细的钢丝去切东西呢？那会非常的不方便。所以，刀锋之外的部分根本不是废铁。


    # I 极端境遇造就极端能力


    有个疑问，如果说刀锋能力是平时不断积累培养的，那我没有处于那个极其罕见的情景，该如何培养刀锋能力呢？


    # 昊伯凡


    随着年龄的增加，我越来越相信人的能力，尤其是人的竞争力要取决于很多机遇。没有处于某种极端的境遇，我们不太可能具有某种极端的能力。即使你很想获得某种独特的极端能力，但由于你所处的场景、环境是一个很平常的环境，你很可能最终没法具备这种能力。


    # I 无意识下的有意识能力


    # I 意志力培养中的奖励'
  - '[PAGE 67]


    我经常说 成功是一种习惯性的坚持，而这种坚持是在受到了奖励或奖励诱惑牵引的状态下形成的一种习惯。


    成功是一种习惯，失败也是一种习惯。之所以这么说，是因为染上了失败这种习惯的人，面对一个目标的时候会习惯性的放弃。追根溯源，有一个很重要的原因是失败者很少、甚至从来没有体会过什么是成功，什么是奖励。


    动物学家做实验要培养老鼠的习惯，或者一种定向行为的时候，都会用到奖励。一只老鼠之所以能够绕过好几道弯达到某个目的地，是因为它曾经在这个地方找到了一块奶酪。如果它一直找不到奶酪，就不可能形成一种习惯。


    要成功首先要培养成功的习惯，而培养成功的习惯的一个小小的秘诀，就是不断的让自己获得小成功和小奖励。通过小成功和小奖励，让自己的意志力能够不断提高。


    一个朋友告诉我，他在寻找合作伙伴的时候一定要仔细跟这个员工聊天，他要了解这个人过去是否经历过成功，而且是经常经历那种虽然不是很大、但一直有的那种成功。如果这个人很少经历成功，或者根本没有成功体验，那这个人是很难做成事的——他骨子里没有一种不放弃的基因，或者说他骨子里有一种习惯性放弃的基因。


    吴伯凡


