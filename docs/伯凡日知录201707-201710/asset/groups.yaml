    的企业会因为一个场景的变化，一夜之间就会倒闭。


    比如说，当我们看戴尔这家公司的时候，你要是不了解戴尔是怎么创业的，戴尔的整个供应链体系是在一种什么样的场景下建立的，它最擅长的那些经营手段、管理手段是因为什么而产生的，你也就完全不能理解为什么他们对未来的事情那么不感兴趣，你当然也不可能理解这一家极其强大，强大到你都没有办法想象它的衰落的一家公司，怎么会一下子走向衰落。你做不到这些，原因很简单，是因为你对场景缺乏感受能力。


    包括我们今天在思考新零售的时候，一定要意识到场景是如何重要。过去纯粹的电子商务它是一个场景相对单一的零售方式，人的购买行为其实是非常复杂的，在不同的场景下会产生完全不同的特征，会做出完全不同的决策。如果你能够营造一种非常有效，同时客户自己又没有意识到的一种场景，就会让你的零售效率大大提高。


    事实上，在这个时代，权利是很难改变人的，影响力才能够改变人。有本书叫《权利与影响力》，它讲的就是那种软性的、看不见的能量如何在改变我们的员工、客户。风和太阳打赌的寓言说的也是软性的能力和强制的能力。它们之间的差别为什么那么大？当风想把一个人的衣服吹下来的时候，风越大，气温越低，那个人就把那个衣服扣的越紧，然后扎上一根绳子。太阳跟风不一样，它要一个人把棉袄脱下来，它采取的不是权利，而是影响力，太阳不断地加大它的热度，使得气温越来越高，这个人自己就把棉袄脱下来了。


    实际上，我们说场景就是悄悄地影响人，而且是以一种非常大的力量在影响人。


    原因是它不能够适应这个快速变化的世界，它的战略没有弹性。另外，在产品研发上，极致也是难得的优秀策略。极致和弹性——蛇是一种同时具有这两种策略的生物。


    蛇，一种典型的残疾动物，缺胳膊少腿，眼睛几乎看不见，甚至是全盲，很多蛇对声音是没有感知的。以上是外表的残疾。同时，它的内脏也是不健全的：肺只有一个，肝脏只有一叶。


    但是，蛇身上有不少值得我们学习的地方。


    - 1. 它能够将一种策略发展到极致。毒液是它的武器，为了最大化利用这个武器，早期毒蛇的牙就进化出了一种凹槽，这个凹槽相当于一个盖子，毒液出来以后，它把毒液罩住，确保毒液能够全部注射到猎物的伤口。在进化的过程中凹槽变得越来越深，后来干脆进化成了一种像针头一样的子弹，能够确保毒液一点都不浪费，直接注射到猎物的体内。


    - 2. 蛇的嘴富有弹性。蛇嘴周围的皮平常是折叠起来的，扩张的幅度远大于大多数动物。“狮子大开口”是因为狮子的口本来就大，蛇大开口是看上去口很小，但是能张大到难以置信的程度。所以，才有了蛇吞象的说法。


    - 3. 蛇类的颌骨上，肌肉可以拉到非常非常长，以至于连接在一起的肌动蛋白都能够被扯开，撕裂以后，还能迅速恢复到原位。


    - 4. 蛇的内脏也富有弹性。我们知道蛇都有冬眠的能力，但蛇在不冬眠的时候也会遭遇连续忍饥挨饿的情况。所以，它进化出了一种“暴饮暴食”的生活方式。有的蛇上顿跟下顿相隔的时间甚至可以以月来计算。蟒蛇在吞下猎物的几天之内，它的新陈代谢率可以提高到平常的45倍，小肠和肝脏的体积和质量会增大一倍，肾和心脏的体积也会随之增加，以便它消化猎物。消化完以后，它就把这些能量存储在体内，然后就可以几个月不吃东西。有专家说，当蛇把它的新陈代谢率降到接近于0的时候，它几乎是一条死蛇。如果对它进行体检的话，你恨不得给它一张死亡证明。


