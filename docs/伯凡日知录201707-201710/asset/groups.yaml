    ## 预告 | 服装业的本质是什么？


    预告 | 服装业的本质是什么... ↓


    《伯凡·日知录》的同学们，本周的《伯凡·日知录》有两天的话题是跟上周有关的。


    ### 1. 服装业是金融业


    第一个是关于场景的话题。场景的切换会导致商业模式的变化，同样的产品在不同的场景中所呈现的价值和意义是完全不一样的。比如说服装，从最低的层次上说，服装业是一个制造业...每一件服装其实也与媒体产业...每一个人的服装都是一个随身携带的自媒体，我们通过服装无意地在发布大量的关于我们自己的信息。但是，服装业在最高的层次上，其实是一种金融业。或者说，最高级的服装企业它从事的是一种发行货币的产业，是有话语权的央行，它生产服装，不过就是在印钞而已。


    ### 2. 感知黑洞


    我们上周还讲到了场景是如何影响一个人的教育方式、学习方式的。本周我讲到了一个话题：在一个家庭中，父母与孩子的交流中词汇量的多少直接与孩子的大脑发育程度和学习能力相关。在一个使用词汇量很少的家庭，尤其是那些总是在使用祈使句的家庭里，孩子的自立程度、孩子的感受方式会有什么样的不同。为什么说语言的简化、词汇量的缺乏会导致我们感知方式的贫乏，甚至会造成一种感知黑洞？


    ### 3. “全或无” 定律


    本周我还讲到了一种定律，叫 “全或无” 定律（All or None Law）。我们早就注意到，当高考分数线划定在500分的时候，考0分和考499分是一样的。这个现象里头就包含着
    “全或无” 定律。“全或无” 定律在自然界、人身体和社会当中可以说是无处不在。为什么有的人总是感到怀才不遇？为什么有的人怨气冲天，觉得自己很有才，很努力，却总是没成功？这跟
    “全或无” 定律有什么样的关系？大家要想象一情景：当一个密码锁的9个数字都已知的...明明已经...当一个密码锁的9个数...的时候，...还是打不开这个箱子？明白了这一点，我们也许就不会有那么多的怨气，不会感到自己怀才不遇了。


    ### 4. 刺猬效应


    本周我还讲到了一种现象：在办公室、在团队当中会存在刺猬效应。一个好的团队里，团队成员之间一定有亲密的关系，而且是那种有张力的亲密关系，因为只有有张力的亲密关系才可能持久，才可能健康。无论是在亲子关系，还是团队成员的关系当中，都必须存在一种必要的张力，那就是掌握亲密和距离的关系。为什么说只有做到亲密有间才可能成就一个团队、一段关系？这就是我这期要说的话题。


    欢迎大家收听本周的《伯凡·日知录》。


    ## 7.10 | 服装业=金融业


    7.10 | 服装业=金融业


    上周我给同学们布置过一道作业题：除了共享经济、闲鱼App，利用场景变换所创造的商业模式还有哪些？我在出这道题的时候就想到了一个我一直很想讲的话题——服装业。


    中国是服装业大国，如果从现在开始，全世界的服装企业都停产，那么三年之内，整个世界也不愁没有衣服穿。这就是中国现在的服装业产能。所以，从这个意义上说，中国是一个服装业大国。


    但是，服装业跟服装业是不一样的，服装其实是最典型的具有场景性的产品。打开衣柜，不同的服装实际上就是不同的场景。在一个服装业发达的国家里，它能够生产各种各样场景的衣服。


    服装业至少可以分成三个层面。


    ### 1. 服装业与制造业


    服装业显然是制造业，它就是制造一个价廉物美、性价比高的产品，让你遮寒、遮羞。这就是服装业最基本的，或者说是最低的层次。


    ### 2. 服装业与媒体产业


    服装业还有第二个层次：服装业是一种媒体产业。每一个服装企业，哪怕是从事纯服装制造的企业，它也是在从事媒体业。


    20世纪原创媒介理论家、思想家麦克卢汉在他的《人的延伸》这本书里头提到了26种媒介，这些媒介当中有些报纸，有电视，还有一种媒介叫服装。因为每一个人所穿的衣服就是一个自媒体。也许你自己没有意识到，但是别人能够从你的服装里解读到许许多多的信息。比如你的世界观、价值观、经济状态、个人品位，甚至是你的
    人际关系等等。一套服装所承载的信息远远大于我们自己的想象。你说，“我并没有想发布什么信息”。对不起，服装业也遵守米兰达宣言，你可以保持沉默，但你说的每一句话都将对你不利。你说我不装饰，我不修边幅，不修边幅也是在发布信息。一些相对比较高端的服装企业，它从事的工作其实跟杂志社、报社是一样的。他们设计一些内容，然后借助于工厂，就像报社借助于印刷厂一样，去复制它的产品，然后再借助于发行渠道，最终变成一个媒体终端。所以，比较高阶的服装企业它就是一个媒体公司。


    举一个例子，维多利亚的秘密，它每年为什么要花那么多的钱，以那么大的声势在伦敦搞发布会？那就是典型的媒体发布会。它借助于一个刻意营造的场景，把它要表达的信息让所有的人感知到，接下来它只需要做一件事情：大量的印刷、复制它的产品。


    服装是一种媒介，并不仅仅是指服装上所传递的信息，超越服装的大量隐性信息也随着服装被发布出来。以维多利亚的秘密为例，它选择了一种内容定位——只为瘦人打造的一种内衣产品，把世界上三分之二的人排除在外了。但是不要紧，当它制造了一个门槛，制造了有限进入这种感觉的时候，就会有很多并不那么瘦的人希望穿上这样的内衣。所以通过制造有限进入的感觉内衣反而制造了极其具有的特权。换句话说，你就买到了某一个身份。也就是说，我们购买服装早已经超出了保暖、遮寒的水准，而是追求一个炫耀、身份的徽章、标签、旗帜。借助于某种服装，我们会获得某种融入感、安全感和优越感。而这种感觉，就是服装公司精心营造的信息，让我们去消费。


    维多利亚的秘密还使用了一种手法，那就是礼品经济。礼品经济的特点是：购买者和消费者常常是分离的。购买者购买的是消费者的欢心，而消费者的欢心是很建议价的，这种定价叫情感定价。比如脑白金用的也是这样一种模式。你可能并不认可这个产品，这个产品的价格也可能高得离谱，但是你并不在乎，因为你买的不是这个产品，而是使用这个产品的人的欢心。维多利亚的秘密在做产品发布会的时候，就已经在悄悄地制造一种信息：只有这样的产品才能够赢得你所在乎的女性的欢心，所以男士会去购买这种性价比其实很低的产品。在这个意义上，我们把服装业称为媒体业。


    ### 3. 服装业与金融业


    服装业的第三个层次，就是金融业。


    它是一个不折不扣的物理性产品，怎么会是金融业呢？麦克卢汉所列举的26种媒介里头，有一种媒介叫货币。货币是一种特殊的媒体，它承载的信息是一种被认证、被背书的关于信用的信息。麦克卢汉把货币称为穷人的信用卡，也就是一种无记名的信用卡。你拿着这张纸，实际上拿的是一个信用。就那么一张纸，商家就会给你一大堆产品。原因就是他拿着这张纸就可以换很多的产品，所以货币其实是一种关于信用的信息。


    接下来，大家终于明白了为什么说服装业是金融业。我们知道，任何一个货币的发行都必须要有 一个央行，我们之所以接受一种货币是因为央行对这张货币背书了。一张美元上面会写
    “In God We Trust”——以上帝的名义我们信任这张纸，上面还有财政部长的签名。这些东西都是在告诉你，这是一张值得信任的纸。因为它是媒体，它承载了重要的信息，它的价值就不再是这张纸本身的价值。在美元里头，一美元和一百美元是一样大的，据说一张一百美元的纸的制造成本是6美分，我们暂且相信它是6美分，但为什么一张6美分的纸它值一百美元呢？原因就是它是信息，而不是一个物质。我们看到这张纸的时候，看到的是它的面值，而不是它本身的价值。


    听到这里，买过奢侈品服装的朋友就有点感悟了。媒体上经常会说，某品牌服装实际的制造成本只有一百多块人民币，可是它为什么能够卖到四五千甚至上万呢？原因就在于它的价值不是它本身的价值，而是它所代表的这种面值。当你拥有了这个服装的时候，别人认。别人认，这就是它的价值。当你不拥有这个服装的时候，你就被排除在外。或者说，一套服装就是一个票证，拥有了这个票证，你就能进得去某地地方，没有你就被排除在外。


    那服装业的央行在哪呢？在巴黎和米兰。这不仅仅是因为每年巴黎和米兰都要举行奢华的、声势浩大的服装发布会。还是因为巴黎和米兰已经代表了某种信用，或者说代表了所有人心中都认的一种价值。那么，有这个央行背书以后，从理论上说，这个货币就可以在全世界通行了，剩下的事情那就是印钞了。


    以前经常听说LV的包包都是在中国生产的，不过就是人造革，生产成本也是一百多块钱，我们中国人还得跑老远，漂洋过海去香榭里舍大街排着长长的队去买那一个包。原因很简单，我们买的不是包，买的是一种货币。所以，在这个意义上说，服装业就是一个货币体系，或者说是一个金融体系。


    我们知道，印刷厂是很容易开的，但是央行是不能随便开的。一个国家的服装业是否发达不在于你有没有那么多的服装工厂，而在于你有没有自己的央行。


    如此说来，中国的服装业离第三个层次还很远，在第二个层次上我们做得还不是那么好。什么时候中国的服装业会真正繁荣呢？一句话就是：什么时候中国的服装业从制造业变成金融业，或者说超越印钞业变成一个有话语央行背书的金融业，就迎来了真正的繁荣。


    吴伯凡


    听完今天的演讲，我希望大家思考一个问题：如果服装是一种自媒体，你想一想你穿的衣服上头哪些是你的签名、哪些是你的封面？在一个看不见的朋友圈里头，你每天在发布什么样的信息？


    服装业可分为三个层次：


    - 1. 制造业。服装业的最基础层级。


    - 2. 媒体业。 每个人穿的衣服都是一个自媒体，每一场新装发布会都是一场媒体发布会。


    - 3. 金融业。 货币是被认证、背书过的信息，服装也是。背书服装的央行就在米兰和巴黎。


    § 来自 7.10 | 服装业=金融业 伯凡·日知录


    有两本很重要的关于沟通的书，一本叫《关键对话》，一本叫《非暴力沟通》，这两本书都讲到了一个共同的现象：我们在与人沟通的时候，抱着良好的初衷去跟别人对话，结果不知道是什么原因，突然鬼使神差地陷入到一种巨大的冲突当中，恶言相向，最后沟通不仅没有效果，而且让双方的关系极度恶化，这是在沟通当中常常出现的问题。


    听完今天的课程，大家不妨思考一下，为什么会出现暴力沟通？要克服暴力沟通，我们需要有什么样的能力和素质？


    ## 7.11 | 感知黑洞


    上周我们讲到，独生子女家庭由于场景单一，孩子的智商和情商会不自觉地受到损害；学校里的学霸由于场景单一，智力也会在不知不觉中受到伤害。如果我们把这个观点推广而广之，所謂学习就是对场景的感知，在场景当中形成一系列的应对机制。


    ### 学习型大脑与词汇量


    最近我在读一本书，是美国人写的，名字叫《父母的语言——3000万单词的区别塑造更强大的学习型大脑》。这本书起源于一个意料之外的实验。有位负责儿童人工耳蜗植入手术的美国外科医生，他通过对自己患者的观察发现，孩子智商的形成和家长与孩子的对话词汇之间有密切的关系。


    当这位外科医生对患者植入人工耳蜗的时候，人工耳蜗有记录装置，他就可以对每一个孩子每天听到的话进行分析。通过一个大的样本分析，这个医生就发现，学习能力强的孩子和学习能力弱的孩子，或者说大脑发育好的和发育不好的孩子，每天听到的词汇量是有差别的。也就是说，学习能力弱的孩子，他们每天听到的词汇量是很少的。有些人是频率不高，也就是说他每天听到的话很少；还有是频率比较高，但是词汇量非常少，他听到的话经常是少数几个词的不斷重复，比如起床了、吃饭、睡觉、一边去、滚蛋等等，他每天听到的是这样一些词汇。这样的孩子可想而知，他的生活世界跟每天听到很多词汇的孩子的生活世界是很不一样的。


    我们可以说，听到词汇量少的孩子，他们生活的世界是一个以祈使句为主导的世界。我们知道祈使句在某些地方听到的是最多的，比如说在军队、监狱，还有就是所谓的管教特别严厉的、家庭关系特别好的家庭里头，也是祈使句居多。他们认为在那样的世界里头，祈使句之外的話是没有必要说的，他们的生活处於一种人跟人之间没話的状态。


    如果再往深处想，这种环境就是一个权力主宰的世界，因为祈使句就是发布权力，不管这个权力发自哪一方。在有些经济条件还不错的家庭里，他们也爱使用祈使句，但是往往是孩子对大人发出的，我要什么、我不想什么、你给我买什么，等等等等。不管是发自哪一方，在整个的人际交往当中，权力是这个交往的主角，如果我们可以把它称为交往的话。


    ### 三种权力


    一般来讲，我们可以把权力分成三种。


    - 1. 强制性权力。没有二话可说，没商量的权力。比如拦路抢劫的人把刀子架在别人脖子上的時候，这就是一种强制性权力。


    - 2. 交易性权力。你之所以服从我，是因为我能给你利益。


    - 3. 共识性权力。它不存在明显的服从和被服从关系，往往是大家共同服从于一个我们已经都意识到的共识。我听你的话，不是因为我是你的下属，不是我有求于你，而是我觉得你这样做是对的，反过来也一样。


    共识性权力的权力色彩已经很淡了，淡到我们可能感受不到。在形成共识的过程之中，彼此之间要充分地交流感受、交流想法。这个用哲学上的话说，是彼此之间能够形成一种叫视野融合的状态，我的视野和你的视野形成了某种融合，或者是重叠。比如说在网球双打、乒乓球双打当中，同一方的两个队员之间，就是一种视野融合的状态。我来干这个，不是你命令我干这个；我来接这个球，不是你命令我来接这个球，是我们俩都对这个局势有一个一致的判断，值方便谁就来救这个球。


    但是在日常生活当中，尤其是在亲子关系当中，你很难仅仅靠身体语言就能够交流。因为孩子正处于学习的状态，父母跟孩子的知识背景很不一样，这个时候要形成共识的话，就需要用很多间接的方式、间接的描述、间接的推导，最后不知不觉达成一种共识。


    这有点像我们看字典，字典上任何一个词条下面都是一长串的解释。要解释清楚一个词，可能要用十几个词甚至二十几个词。那父母在跟孩子交流的时候，常常会使用这种解释的、描述的方式，来跟孩子进行交流。有一种就是，如果亲子关系不好的话，他会选择不说，小孩有疑问的时候他不敢去问，因为他问了以后也得不到回应，甚至受到呵斥，所以渐渐他就选择了沉默。父母习惯于粗暴的交流方式，他心情不好，他正在为别的事情操心，小孩问一个问题的时候，他没有耐心、没有心情去跟孩子细致地进行描述。可想而知，这个小孩一天听到的词汇就少之又少。


    ### 感知黑洞


    长此以往，会导致一个什么样的结果呢？我们把它称之为 感知黑洞。


    我们从口中说出来的是一个词，但它背后有一大堆的感觉和认知。如果你经常使用多词汇的方式，用解释、描述的方式跟孩子交流，他会听到更多词汇，而且他对任何一个名词、一个动词、一个形容词的感受和别的孩子都是完全不一样的。


    我们知道，儿童刚出生的时候色差是很多的，比如孩子看红色，可能有十几种色差，但成年人的色差就少得多，我们只在乎说这是红的，还是不是红的；或者是深红的还是浅红的。对孩子来说，当你不断地用标签化的词汇，用简单粗暴的词汇跟他交流的时候，他的感知敏感度就会降低，他对世界丰富的感知逐渐地就变成非常简单的，甚至是黑白化的世界。


    这就让我想起《小王子》里头，作者他小的时候跟他爸爸交流，在他爸爸听起来，他的描述太啰嗦了。他说，“爸爸，我今天看到了一所房子，非常漂亮，它有玫瑰色的砖墙，红色的瓦又有白色的鸽子，房子上面有蓝天，窗户上天竺葵。”描述了半天，他爸爸都是心不在焉地敷衍他。这个小孩子很聪明，他知道大人就是这样的，你跟他很细地说一件事，他们是不感兴趣的，所以他后来急中生智说了一句，“爸爸，那栋房子值39万英镑。”他爸爸马上说，“这么好的房子啊？”在这场父子对话当中我们就能感受到什么叫简化，简化的极致就是标签，或者干脆就是价格。


    事实上，从一个小孩变成一个成年人，往往就是词汇量逐渐减少的过程。但是如果父母意识到丰富的词汇量是对应于丰富的感知，是对应于孩子跟这个世界的关係，那么父母就不会这么去粗暴地简化孩子的世界。孩子每增加一个词汇量，也就是意味着他的感知方式更精确，他对人、对事的态度也会更加的细致。


    泼妇=不善于发怒的女人


    简化的方式带有非常粗暴的色彩。比如，有个很不好听的词“泼妇”，当我们说出这个词的时候，表面上它是一个名词，但这个名词里头有明显的蔑视，甚至可以说它就是一句骂人的话。我们要面对这个世界，你经常使用这样的词汇的话，就意味着你跟世界的关係是一种极其粗暴的关係，要不是骂人，要不是被人骂。


    如果我们不使用这样的单一词汇，遇到了这样的人，你可以把她描述为一个“不善于发怒的女人”。这句话能表明，你对世界的感知方式是丰富的，而且是平和的，你不用标签去感受世界。使用这种语言的人，你不可能认为他是一个粗暴的人。当这样的人面对一个场景、一个人、一个事的时候，他会调动他丰富的感知能力，来观察、思考、应对这个场景，而不是简单的权力思维或者是游戏思维。在游戏世界里头只有一种关系，那就是权力关系。你不被干掉，你就会被对方干掉，你跟对方之间的关系就是消灭和被消灭的关系。然你的生活的意义就是一个进度条、一个积分而已。


    所以，让孩子听到更多的词汇，让孩子的头脑当中储存更多的词汇，让这个世界以一种丰富多彩的面貌显现在孩子的脑海里头，这是给孩子一个最重要的礼物。这样的孩子长大了，他跟人、跟世界的关係才可能是健康的、和谐的。反之，一个词汇量少的孩子，他跟世界、跟别人的关係很可能是不健康、不和谐、不正常的。


    吴伯凡

