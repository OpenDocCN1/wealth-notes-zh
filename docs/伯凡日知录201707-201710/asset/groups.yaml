  mdcn: '

    基督教传统中的忏悔、祈祷，看起来像是迷信，但无形中它产生了一种方法，一种超越了具体事物的方法，这种方法以经常的、固定的、抽身出来的，站在一个更高的参照系来看自己的习惯，这就叫管理。


    我们曾经讲到过“清教徒的礼物”，而管理学界基本上达成了一个共识：现代管理起源于清教徒的那套行为规范。因为清教徒强调“在生活当中去掉所有不创造价值的环节，去掉所有无意义的环节。”他们在做任何一件事情的时候，首先确定目标，其次是以非常固定的方式进行核算、进行清理——清教徒“去掉一切不创造价值的环节”的行为准则，最后就变成了一条最重要管理的原则，所有的管理都是“去掉一切不创造价值的环节”。


    你想去掉“一切不创造价值的环节”，你就要把自身和自身的状态作为对象，像做几何题，像下棋一样地看待自己和自己的行为，然后进行理性客观的计算、判断和决策。


    吴伯凡


    苏格拉底说“未经审查的人生是不值得过的”，尼采说“重新审查一切价值。”——我们 可以问自己两个问题，我的人生是经过省察的吗？今天这样一个认知迭代变得越来越重要的时代，我们是否有意愿，而且付出了行为来做到重新省察一切价值呢？


