    # 本周问答｜锻炼领导力的路径是什么？


    本周问答｜锻炼领导力的路...


    你好，又到了周末互动的时间了，首先祝你国庆节快乐。


    今天的互动问答我想给你提供一期不一样的内容。之前我和隔壁专栏《超级个体》的主讲人古典老师合作过一次，他问了我几个关于领导力的问题。我很认真地回答了这些问题。在古典老师的专栏里你可以看到这一期的文章以及听到相应的音频。今天我想把这次和古典老师之间的问答拿出来跟你分享，希望你能通过这期内容的学习，对领导力能有更新的认识。


    # 领导力和管理力的区别是什么？


    吴伯凡


    +   1. 正确做事 & 做正确的事


    “领导力”是一个固定的词——leadership，“管理”我们都称为管理能力。德鲁克对领导和管理有个经典的区别：“领导”，就是做正确的事情；“管理”就是正确地做事。


    简而言之，“领导”是在众多可以做的事情当中确定该做哪些事情，所以领导力本质上是一种取舍的能力——表面上是确定该做什么的能力，背后是确定哪些不值得做的。哪怕很有诱惑、马上有利可图的事情都不去做。做真正重要和正确的事情。管理者所需要的能力是如何把一个已经确定的事情做到最好，所以讲“好”，就是成本最小化、效果最大化。


    +   2. 方向感 & 驱动力


    IBM 前 CEO 路易斯·郭士纳 (Louis V. Gerstner) 对领导力有一个定义，他认为“领导力”包含两个方面：方向感和驱动力。衡量一个领导者有没有领导力就看这两方面的能力。


    方向感：在大家都不知道做什么，或者大家对该做什么众说纷纭的时候，领导者有一个方向感能够判众议，带着大家朝正确方向走。


    驱动力：当你确定了一个方向，大家都沿着你确定的方向走的时候，你要尽可能提供各种各样的支持和资源，用物质的、精神的、多维度地能量支持大家朝那个正确的方向去做事。


    +   3. 北斗星 & 及时雨


    +   4. RPV理论


    +   5. 领导力 ≠ 营销力


    如果领导力可以被塑造，那么锻炼领导力的路径是什么？


    吴伯凡


    领导力的形成受制于两种力量，其中一个是个人天赋，禀赋是什么。我越来越觉得天赋和基因的成分可能占到了50%以上的份额，但领导力也是习得的。在多子女家庭当中，同样的基因、同样的家庭背景，为什么有的人有领导力，有的人没有领导力，与他后天的环境有很大的关系。


    +   1. 合作共赢，遇到事情总想以合作共赢的方式去做，而不是傲独行快吃独食。


    +   2. 对待资源要永远坚守一个不等式：给予 >索取，并形成一种习惯。我们说有人有“大哥的品质”，其实就是具有一种给予维护这样一个不等式的能...


    +   3. 对他人的感受、立场、利益具有充分关注的能力。


    领导者如何能做到能激励、理解他人，但又是又不至于太亲近？'
