    大闸蟹不是用来吃的，也是用来炒的！ 1、比如，网上一张阳澄湖大闸蟹券的面值是1000元，以毛利率70%来算，每提前卖出一张蟹券就能回笼资金700元，养殖成本要300元，先不算流通成本。
    2、如果卖出去的蟹券没有被兑换，回收的价格是500，那么每回收一张的利润就是1000\*70%-500=200元。 3、卖家提前预售能赚多少钱？我们预估一个比例蟹券回收比例为30%，如果是提前预售10000张蟹券的话，收益如下：
    10000\*70%\*700+10000\*30%\*200-流通成本=550万-流通成本 那么单张蟹券流通成本可以控制到多少呢？ 550万/1万=550元
    也就是说，在整个蟹券的流通过程中，只要获客成本低于550元，也就是说只要流通成本不超过蟹券面值的55%，卖家都是赚钱的。 而且，提前预售回笼的钱其实就是一个“资金池”，资金池里的钱可以再支付后期的流通成本，只要设定好兑换时间，把“资金池”积累的够大，本质上就变成了一个成本控制和流量转化的金融生意。
