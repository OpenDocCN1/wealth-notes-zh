  - '[PAGE 57]


    纹身和风险 前两天看见群里有同学做纹身意象调查，然后看见大部分同学们的评论都说纹身不是好人。 其实这些评论里透露出我们的一种风险意识，反映出我们对于身上有纹身人的一种风险偏好。
    生活中我见过很多纹身夸张的朋友都很可爱，他们非常性情，也很仗义，很多时候就是想到什么就做了。我有一位朋友因为是双鱼座，胸前纹了两条特别大鲤鱼还上了很漂亮颜色，在798的一个工作室花了一万多，他问纹身老板可不可以额外赠送几个字，老板说可以，然后他把自己新婚媳妇儿的名字用小篆体的形式纹在了右臂上。我说你这今后如果要离婚还挺麻烦的。他说那是不可能的事儿。生活中他是一个很疼爱自己女人的人，朋友相处也特爽快。
    我们暂且不论对于纹身文化的接受与否，我们只从风险偏好的角度来看待这个问题，不论纹身还是不含身，人群中总有好人总有坏人，就算纹身的人是有风险的，他们也是把风险标注在了身上让你看见。就算他们是流氓，他们也是表里如一的流氓。
    这就是塔勒布要告诉我们的风险观念，标注了风险的东西其实并不可怕，可怕的是那些我们以为安全的东西。 于是我们发现在生活中伤害我们的黑天鹅往往不是那些带着魔鬼面具的人，恰恰是那些带着人狼面具的人。


