    # 木姜提婆


    2019/9/12


    我学道德经#任正非的境界# 道德经:沌沌兮如婴儿之未孩；傯傯兮若无所归。就像还不会笑的婴儿一样处于混沌状态，没有情感好恶，没有是非善恶，淡淡然无所归，就是不把自己归属于任何分类。就像有人想给上帝下个定义，却永远给不出来，上帝不属于任何分类，我们只能说明上帝不是什么，却不能说明上帝是什么，这就是傯傯兮若无所归。
    任正非作为华为的领头人，没有领导的派头，去年被人拍到等出租、餐厅排队打饭、机场挤摆渡车，一时成为网络谈资，大家都为任老点赞，这些都是优秀的好品质，但任老的境界却体现在却在记者采访时对自己挤摆渡车的回答上：碰到同事，谈着话就跟着上了摆渡车了。这就是不给自己归类，不给自己贴标签，就像我们昨天说的，不追求排场，也不标榜质朴，只是心想处自然。这就是佛家推崇的心无所住，一切只为“方便”，作为企业家时间极其宝贵，派个小巴车来接很正常，不排斥，但遇到同事谈得高兴挤个摆渡车也不觉失了面子，这才是大境界。


