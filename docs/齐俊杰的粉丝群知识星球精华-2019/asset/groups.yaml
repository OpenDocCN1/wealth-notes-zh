    指数基金快速发展 被动投资大有可为 来源: 经济日报 今年以来，指数基金继续快速发展。


    据Wind统计，今年前8个月新发行的交易型开放式指数基金（ETF）累计35只，接近去年全年的发行数量，且其中不乏首募规模超50亿元的爆款产品，市场热度可见一斑，同时也显示了ETF市场上除了宽基指数ETF外，行业及主题指数ETF也在快速扩容，被动投资产品线不断丰富。在海外资本市场中，被动投资基金已经历数十年持续快速发展并逐渐成为市场主流。数据显示，2018年末，在美国股票投资基金市场中，股票指数型共同基金和交易所交易基金等被动跟踪指数投资基金的资产占比约48.7%。预计至今年末，美股被动投资基金的资产占比将首次超过50%，这也将成为美国投资基金业的一个重要转折点。从海外经验看，大规模指数基金具有较高的市场深度与宽度，这对资本市场稳定发展有诸多好处。首先，能够带来二级市场交易的活跃，便于投资者买卖即时成交；其次，可以容纳大额资金的申购和赎回，不会形成大的价格冲击；第三，有助于投资者机构化程度迅速提升，指数市值权重高的大盘股机构化尤其明显。此外，从投资效益角度看，海外资本市场数十年表现证明了被动投资的有效性，长期内主动管理的投资组合在扣除费用之后平均收益率未能超过市场标准指数。相比之下，我国A股市场被动投资基金起步较晚，虽然目前发展势头良好，但尚处于初级阶段。截至2018年末，我国被动指数型和ETF基金规模占权益类基金比重仅为24.5%。目前，仍有一些因素对我国被动投资基金发展构成一定制约。例如，从理论角度看，个人投资者采用被动投资策略的基本原理是基于有效市场理论。有研究表明，目前A股市场有效性依然不足，弱有效市场中价格信号无法充分反映基本面信息。在这种市场环境下，被动指数投资会经常面临大幅回撤，风险调整的收益率不具备明显优势，不利于形成被动投资偏好。未来，随着A股制度层面不断优化，A股有效性有望逐步提升。另外，A股投资者结构上仍以个人投资者为主，但个人投资者往往容易高估自身投资能力，认为自己能战胜市场，忽视被动投资的作用。个人投资者占比过高，也显示出养老资金等长期稳定资金对股票型基金参与度依然不足，这类资金往往是配置指数基金、被动投资的主力军。针对这一问题，我国已经出台相关金融、税收政策，对长期投资者和长期投资行为予以充分鼓励和支持。结合海外市场发展经验，预计未来随着我国资本市场制度不断完善，被动投资工具不断丰富和投资者结构与投资理念不断优化，以指数基金为代表的被动投资将持续高速发展。


