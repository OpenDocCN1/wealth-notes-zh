    大家中秋节快乐~老齐过节去了，那我就把这周的资产分析补上。。其中有一些个人观点，欢迎探讨 市场经过上周的大幅攀升之后进入了一个3000点以上的窄幅震荡区间，4个日K并列一字排开，从周线上来看几乎就没有体积，只有一丢丢。。上证指数总共上涨了0.75%，安稳站上了3000点，算是个好兆头吧。沪深300收出一根假阴线，上涨1.08%，上证50这周略微强势，上涨1.43%，创业板与大盘几乎同步，同为上涨1.08%，表现最好的是中证500，上涨了1.73%。但大家的感觉都不会太好，因为所有的涨幅都来源周一的高开，接下来市场就进入了一系列的调整，要不是最后一天翻红了这个节都不一定过的好了。具体原因昨天也提到了一些，CPI数据出炉之后市场对于央行是否会进一步进行宽松的货币政策出现了一些分歧，所表现出来的就是市场的犹豫。接下来我认为市场会在这个位置进一步徘徊，因为一些普通的利好消息已经刺激不了市场的预期，而底下又有很多配置资金在不断的进入，另外又逢国庆长假，资金并不会过多的流入市场。接下来比较大的波动将来源于9月底央行是否降息的决
    定，长期来看整体机会大于风险，中小创的机会更大。港股方面依然继续着反弹，但香港的经济前景老是说并不乐观。。我的港股配置也只有3%。。只能说有估值修复的机会吧。综上所述，我预计国庆前夕股票方面都不会有大动作，等待国庆长假进行第一次再平衡。债券方面，这周十年期国债继续上行，已经接近了3.1%，债券基金整体表现也比较糟糕。但这都是可以预料的，今年的债市肯定不如去年，宽松还是会继续，但是能有多大收益就好说了，想着总比货币基金强呗。从收益上也能看出，信用债比利率债的收益会高出一点，信用用的逻辑肯定是不会变的。债券牛市是否会继续，我认为将取决于月底央行的态度，如果维持利率不变那很有可能就维持在此区间，所以月底再看吧，我更倾向于将信用债的比例再提升一点点。最后就是黄金了，本周依然处于调整阶段，昨晚欧央行降息后出现反弹，随后冲高回落。我认为还是市场对于美联储下一步的决策信心不足，鲍威尔始终没有足够的表态表明这是一个降息周期的开始。虽说市场普遍预期下周将进行第二次降息，但更关键的是鲍威尔随后发言所传达出来的信息。黄金经过过去三个月的暴涨之后也有一定调整的'
  - '[PAGE 38]


    需求，但从长远来看，我依然认为黄金有进一步上行空间，配置黄金的逻辑与基本面环境并没有改变，世界经济甚至有进一步恶化的趋势，我的7%建仓也没有完成，再平衡之后总量会有所下降，不高不低正好。
    油老实说我是不太懂。。那就按照老齐的来吧。。不见兔子不撒鹰。 本周还有一点值得关注的就是汇率在不断下降，XXZ预期有所回暖，QFII和RQFII全面放开，这也会给北上资金的进一步配置带来动力，缓慢的资金流入有助于市场走出一个长期行情。
    总的来说。。我认为国庆节前都是一个看书学习的好时机，不用太过于关心市场，一切都需要时间来沉淀与验证。 最后祝大家在中秋佳节来临之际，与亲朋好友把酒言欢，共赏花好月圆。


