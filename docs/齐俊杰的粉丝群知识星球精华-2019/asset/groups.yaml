    # 缘木世家天然文玩系珠宝


    5 小时前


    如果你只盯住交易，那么行情上涨的牛市，最蹩脚的股民也会赚钱，而行情下跌的熊市，最棒的交易者也会赔钱。所以做投资一定要评估大众心里的反应。之前我们也说过90%的涨跌，都是由心里原因造成的。而基本面没有个5-10年的长周期，根本显现不出来。所以老齐也奉劝各位，不是说你买白马股就是价值投资了，短期股票波动就会让你坐立不安的人，根本就不是真正的价值投资者。持股连一年都没有，那么看到的基本都是心理影响的海市蜃楼，因为价值根本还没来得及绽放
