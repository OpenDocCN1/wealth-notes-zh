    # 答读者问 | 苹果公司的表永远指向上午九点


    # 来自日课：电视台、广告商和观众的对决


    人类一直在努力织茧做新衣，而这新衣又总是穿在我们自己身上，没有注意力的收购和买卖，还会有进步的动力吗？


    万维钢


    我在美国听说过这样的故事，也不知是不是真的发生过。从前有个小镇，有一年沃尔玛把超市开到了这里，然后小镇仅有的两家报纸倒闭了。报纸是靠小镇上一家家小商店的广告供养的，沃尔玛一来这些小店全被挤垮，而沃尔玛不需要在报纸做广告。


    广告养活了报纸和电视，这句话不是白说的。理想情况下，既然沃尔玛的东西比小商店便宜，而且沃尔玛的价格里还不包括广告费，那么小镇居民就把从沃尔玛身上省下来的钱，直接交给报社呗？实际上这当然不可能，人们对“内容产品”的态度一贯都是花注意力可以，花钱不行。


    都是套路！现在最大的问题是，太多事会影响我们的注意力，注意力被太多事分散了，无法集中精力读一本书了，时间总是觉得太少了！这可如何是好？！万老师，看到请解惑一下？！


    万维钢


    此恨人人有。大概有三种理论上的办法，按照有效的可能性从低到高排列：


    +   1. 你要做到时刻“以终为始”，总想着读了这本书就能让自己成长，成长了将来就能赚很多钱之类……

    2. 你要蔑视那些分散注意力的内容，以深入读书为荣。

    3. 对任何事情，都非常慎重“开始”。现在你有空闲时间，摆在你面前一本书和一部手机，你拿哪个？其实拿起哪个来，你都可能花很多时间在上面。关键就在于那一刹那的选择。选择书的那一刻可能有点痛苦，一旦读进去就不痛苦了。


    # 来自日课：赚钱的想法和历史的行程


    杀手运用这个概念真好。那可以理解为：为自己的产品设计一个大需求吗？


    如何才能做到眼光独到？如何做到格局够大？如何在大家还没接受的情况下顽强生存下来等到大家都接受你？


    看了这几天的文章，让我感受最深的是每一个阶段初期都有那么一波人看到了机会的来临，并且抓住了机会，成为时代的标志人物，那么在当今社会，互联网已经发展的这个时候，还会有那些可以思考或是改变的机会呢？让我们也赶上这波潮流？


    万维钢


    需求显然不是设计就能设计出来的。最理想的情况是需求存在，只不过还没被发现。但也有可能是需求将来可能出现，但是现在不存在。还有可能根本就不存在。


    等到人人都知道这个需求存在，你再入场就已经晚了，因为有些公司，或者有些人，是在需求还不存在的情况下就已经开始干了，他们早就准备好了。那么那些公司都是怎么想的呢？这里面不管怎么说都有
    一点任性的成分。他们不是“现在什么赚钱就干什么”，而是“也可能不赚钱，但我就是想干这个”。


    苹果电脑一度被PC挤压得不成样子，苹果公司为什么不改变理念适应市场？


    最后特别成功的公司，往往是这种特别能坚持的公司。


    我听过一个非常形象的说法——“苹果的表永远都指向上午九点。以前这个表不准，现在这个表准了，这只不过因为现在正好是上午九点。”


    当然从另一方面，这样的公司也可能是特别失败的公司。但他们绝对不是平庸的公司。


    关键在于，想要事先确定地看准机会是不可能的，任何投入都有风险，而且风险大才能回报大。企业家配得上那么高的收入，根本原因就是他们敢于承担风险。


    # 来自日课：中文的一个小缺点和一个大优点


    在某些领域，一般都会淘汰不合格者，就看条件，机敏也就是应变能力。这个天生的吗？有什么方式可以提高应变能力吗？


    万维钢


    我今天正好看了个电影，My All American，讲的是一个美式足球运动员的故事。其中德克萨斯大学队教练有一句台词让我印象非常深，上网一搜还真有这句话——
    Football doesn''t build character. It eliminates the weak ones.


    > “足球并不培养品格，它只是把不行的 人淘汰掉。”我还特别考证了一下，这句话有真实的出处，原话是UCLA篮球 队教练说的，把“足球”改成“体 育”。


    从理论角度，什么能力都不是完全天生 的，后天都可以练习，品格也是可以培 养的。但是站在高水平运动队教练的角 度，有那么多人想进我这个队还进不 来，我哪有时间培养你的品格，我的工
    作机关当然是淘汰不行的。


    具体怎么提高某一方面的能力，不是应 该在这里问答里说的，我们可以说的是 要培养品格得提前就培养，别等到球队 决定不用你的时候才培养。


    再回到上一题，公司也是这样。都是非 得于这件事不可的公司，才会在有需求 之前就投入研发“培养自己”。


    牛津词典每年都会增加新的词汇，而再 造新的汉字几乎不会被人们认同使用。比 较而言，英语的生命力应该更强吧？


    万维钢


    汉语不造新字，可是汉语造新词啊！

    汉语每年都会增加新的词汇，而再造新 的英语字母几乎不会被人们认同使用。比 较而言，汉语的生命力应该更强吧？


    # 来自日课：明星和粉丝的正确关系


    我们为什么不追星，因为我们追“得到”啊，得到 的老师们也是一种注意力商人，可以这样理解吗？


    万维钢


    注意力商人是贩卖注意力的商人。他们 把观众的注意力收取上来，卖给广告 商。这不是“得到”上我们这帮人的工 作模式。我们是把自己的青春卖给观 众。


