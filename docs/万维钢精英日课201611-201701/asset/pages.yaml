  md: '# 3.虚拟的……


    AOL，找到了互联网的杀手应用。它的神来之笔是千疮百孔内容，让用户自己制造内容。它做电子社区，最主要应用是聊天室，用户可以自己开聊天室互相聊天。


    别的公司也有聊天室项目，但AOL的聊天室里有女性用户。当时上网的大多数用户都是男的，大部分是极客、书呆子这类社交能力很差的人，聊天室里有女性，气氛马上就不一样了。


    AOL这个服务，有人专门发明了一个词，叫“赛博空间（Cyberspace）”。原来电子社区这么有意思！人们很快意识到，赛博空间里的社交和互动跟日常生活非常不同。既然网络都是匿名，用户就可以放心大胆地说一些话——结果就出现了“虚拟性爱”。等到了1995年左右，AOL简直成为了虚拟性爱的代名词，一提到某人用AOL，就知道他要去做什么事情。


    当然AOL还有一个正经服务，那就是电子邮件。电子邮件变得越来越重要。使用电子邮件的人越多，你的电子邮件账号就越有用，电子邮件从一个小众文化，现在经历了正反馈，终于达到改变社会习惯的境界。


    九十年代的AOL实现了用户量的雪崩式增长。它的一个独特营销手段是把上网接入服务的安装软盘——后来是光盘——直接寄到每家每户，每张盘自带一个月的免费服务。这绝对是值得载入史册的成功营销，用户注册率竟然高达10%——要知道一般这样的广告能有1%的注册率就不错了。一时之间，美国生产的光盘，一半都被AOL用了。


    但是AOL还是没解决怎么赚钱的问题。


    用户愿意支付的上网费用太低。广告还是卖不出去，因为一直没有科学证据说网页广告有用，广告商不怎么买账。AOL甚至像现在Facebook这样，开发用户的隐私数据，直接卖给商家，也没赚多少钱。就算曾经跟时代华纳合并，风光一时无两，结果还是以失败告终。


    但是AOL留下了一条无比宝贵的经验：原来在看电视的注意力之外，用户还有一种非常不一样的注意力，也可以供注意力商人收割——


    那就是用户之间的社交互动。早在七十年代，电子邮件刚出来不久还远远没有流行的时候，有人就已经养成了时不时查看邮件的习惯。一开始是每天查看几次，后来是每小时查看几次。


    其实大部分邮件都是你不感兴趣的，但总有几封是你感兴趣的——这就是我们日课在《行为设计学》这篇文章中说过的“随机回报”。查看邮件的吸引力实在太大，就好像大脑里有个什么地方痒，你总要去挠一下，这么一种上瘾的感觉。


    人们这才明白，互联网的本质不是什么中心化的优质内容，而是社交！人们对亲朋好友的关注程度胜过看电视。这么好的资源，当然要好好收割。


    后来的注意力商人是怎么收割的，咱们下次再说。


    # 丨我的评论


    现在Prodigy公司已经不知所终，而AOL则沦落到了一个靠吸引眼球的廉价新闻收割用户廉价注意力的公司——咱们以前的一期日课《杀时间内容的工业化大生产》介绍过现在的AOL，生意倒是还不错。


    现在我们知道，网页广告、网上购物、隐私大数据，这些都是特别能赚钱的好东西。可是最早实践这些想法的公司，都死在了沙滩上。


    其中最根本的原因，大概是当时的技术条件不允许。网络速度慢，计算机性能差，广告不可能做得很好看，甚至大部分商家根本没有网站让你连过去。图片显示不了，网上购物就不可行。网上购物都不可行，网上广告就更没用。至于说开发用户数据，不用说计算和存储能力，就连成熟的算法理论都是近年才有的。


    所以想法光“好”不行。做实事不是写论文，想法再好，当时实现不了，就算过几年历史证明你是 .=对的，也没用。


    我们的另一个教训，是“观念”这个东西真是不绝对化。你说政府主导就不好？互联网恰恰就是政府主导发明的。你说内容就应该免费？报纸好使，后来的互联网好使，早期的互联网恰恰就不好使。


    如果不了解这段历史，就算把一个现代人穿越到1991年，他也未必能成功。


    ……我甚至想，也许就算了解了这段历史，你去1991年也未必能做得更好。也许互联网的命运注定了，就是得烧很多很多钱，死很多很多公司，才能让这么多人养成上网的习惯。


