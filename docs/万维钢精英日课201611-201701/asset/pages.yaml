  md: '# 日课104｜电视台、广告商和观众的对决


    日课104｜电视台、广告...


    今天我们继续说《注意力商人：进入我们脑袋的史诗争抢》（The Attention Merchants: The Epic Scramble to Get Inside
    Our Heads）这本书，作者是吴修铭（Tim Wu）。


    咱们先来思考这么一个问题：电视台到底是为谁服务的？


    在咱中国，所有电视台都是公共的，我们默认的设定，电视台应该为观众服务。而美国绝大多数电视台都是私营的，那么美国的电视台是不是为观众服务的呢？至少对那些“免费”电视台来说，也许更接近事实的答案是它们为广告商服务。就如同当年廉价的报纸和今天免费的Facebook一样，观众只是它们的产品，广告商才是它们的顾客。


    但这个说法似乎也不完全公平。私营电视台的新闻记者一样有社会责任感，私营电视台制作的一些教育节目比公共电视台的水平更高。这个复杂的现象，应该怎么解释呢？


    这是电视台、广告商、观众三方斗争的结果。吴修铭的调研考功夫非常厉害，我看这本书里的美国电视史，真是 blocco。


    这是一部斗争，收割，反抗和改良的历史。


    # 1.广告主导电视


    上世纪50年代，是电视在美国的大发展时期。电视机的家庭普及率在1950年只有9%，到1956年就达到了72%。不过早期的电视机非常贵，按今天价格相当于2000到5000美元一台。看电视，最早可是个高雅活动。


    当时的人在家里面看电视，跟现在我们去电影院看电影差不多——全家坐在一起，非常安静，全神贯注地看，而且通常还要关灯。人们把影像视为奇迹，心里有一种敬畏感，就好像在参与一个什么宗教仪式一般。


    # 2.电视台的巅峰时刻


    整个五十年代的美国电视业，基本上就是NBC（全国广播公司）和CBS（哥伦比亚广播公司）两家竞争的关系，再加上后来的ABC（美国广播公司），也不过就是三个台。但这已经足够让牛人辈出的电视业迅速演化了。


    历史上第一次，一个私人媒体，打败了政府宣传！也是从那时起，美国人重新重视宪法第一修正案，发现言论自由的的确对国家政治生活有很好的影响。'
