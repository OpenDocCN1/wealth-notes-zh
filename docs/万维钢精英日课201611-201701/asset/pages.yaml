  md: '# 日课096 | 性格…到底是什么意思？


    日课096 | 性格…到底是… ↓


    如果你经常关注心理学——包括学院派和民间的心理学——你可能会有一个困惑。人到底有没有性格？


    民间的说法，人显然是有性格的。我们一直在按照性格把人分类——有的人友好，有的人苛刻；有的人勤奋，有的人懒惰；有的人内向，有的人外向；有的人好斗，有的人和平；有的人慷慨，有的人吝啬……这些还都是直观的分类。民间还有更高级的性格“研究”，比如说星座、血型，还有什么“性格色彩学”。


    可是我们平时看到的那些学院派的、“主流”的心理学研究，几乎都是在研究人的共性。如果一个心理学实验证明人是有偏见的，它的意思就是说“所有人都是有偏见的”，或者“所有人都有一定的概率会有这个偏见”。人就是人，并不存在什么“火星人”和“金星人”的区别。


    那么人到底有没有性格？如果有的话，我们的行为到底在多大程度上是被性格左右的呢？


    我们今天继续讲托德·罗斯（Todd Rose）的《平均的终结：我们怎样在一个崇尚相同性的世界中成功》（The End of Average: How We
    Succeed in a World That Values Sameness）这本书。罗斯就总结了此时此刻心理学家对性格都有什么看法。


    首先，一般的心理学研究的确是根本不考虑性格因素，就像我们之前介绍的凯特莱的思想那样，把人都看作“平均人”。当然在这些研究中，受试者的反应并不都是完全一致的，研究的结论都是统计结果。确切地说，这些研究的结论说的是，遇到这个特定的形势，“大多数人”是怎么反应的。


    也就是说，大多数心理学实验的假设，是“形势”决定了人的反应，而这个反应与人的性格无关。我们把这一派观点叫做“形势派”。


    但是大多数心理学家也承认人是有性格的。比如有个学院派的性格分类方法叫“大五（the big five）”性格分类法，也就是从五个方面去评估一个人的性格。


    但是请注意，这个分类法只是一个“常用的做法”，其背后并没有什么本质的科学含义，我们不能说人就只有这五个方面。还有很多别的方法也被广泛使用，比如咱们日课之前的文章《政治争论ABC》中，就提到过“迈尔斯-布里格斯性格分类指标（Myers-Briggs
    Type Indicator，简称MBTI）”，它把人分成了16种性格。还有更细致的分法能把人分成900种性格！


    这种把人按照性格分类的做法，可以回到高尔顿——本质上还是认为人和人是有区别的，而且这个区别是本性，不容易改变。我们把这一派观点叫做“特性派”。


    好了。1980年代以后，“特性派”获得了普遍的认可。这是因为人和人的确是有差异的，面对同一个形势，不同的人的确会有不同的表现，而“形势派”显然解释不了这个差异。你不得不承认人是有性格的。


    那么我们就假想一下，有个民间心理学家在台上作报告。他说有的人外向有的人内向，对付外向的人你就应该如何如何，对付内向的人你就应该如何如何……台下正好坐着一个学院派心理学家，这位学院派心理学家是不是会点头赞同呢？


    不会。我猜他更可能的表情是笑而不语。


    “特性派”的问题在于，不管你怎么分类，面对一个具体的人的时候，你还是很难预测他的行为。一个被贴了“外向”标签的人，今天晚上的聚会上就一定会表现出外向吗？不一定。


    事实上，人的性格和行为的相关系数，很少能够超过0.3。本周一咱们刚说过，如果相关系数低于0.4，都算弱相关。“特性派”是个有用的理论，但并不是一个非常好的理论。


    现在有一个更好的理论，认为预测一个人的表现不能只看特性标签，也不能只看他所处的形势，而应该将两者综合考虑。我们把这一派观点叫做“情境派”。


    “情境派”的起源，可能是华盛顿大学教授正田裕一（Yuichi Shoda）九十年代的一个著名研究。研究者在乌一个夏令营里，对84个6-13岁的孩子做了为期六周的系统性观测。这一次研究者并没有把孩子们看作一个整体，而是观察每个孩子作为个体的表现——这意味着你必须投入至少高出一个数量级的人力，取得至少高出一个数量级的数据量。'
