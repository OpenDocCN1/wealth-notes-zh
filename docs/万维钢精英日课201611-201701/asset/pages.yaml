    什么了不起的？成年人完全有权决定自己干什么。


    我举一个例子，同性恋。传统的保守派人士认为同性恋是一种堕落，因为这个行为破坏了一男一女的传统家庭价值，政府根本就不能让同性恋者注册结婚——当然近年来保守派对同性恋的恶意已经减少很多了。自由论者认为同性恋完全是个人选择，谈不上好坏，但是政府无权干涉。而自由派则认为，同性恋群体在过去这么多年来一直受到保守派的打压，实在是个弱势群体！所以同性恋不但合理合法，而且应该大张旗鼓地宣传，我们应该以支持同性恋为荣。


    以我的感觉，目前在美国来说，自由派占领了主要的话语权。媒体从业者、知识分子、特别是广大的城市中产阶级，几乎都是自由派人士。在美国某些发达地区，如果你是少数族裔（注意，华人不算少数族裔），出身贫寒还是个同性恋者，你不但不会受到歧视，而且还会受到优待，比如说有比别人更高的机会进入知名公司工作。


