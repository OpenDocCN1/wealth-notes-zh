  md: '# 答读者问 | 有时治愈，常常帮助，总是安慰


    来自日课：大人物演讲法


    晴天小猪：这样高级别的演讲其实就是气魄，也可以看做是一种艺术，成不成功就看你能不能得到多数人的认可。但首先你要相信自己是有领导力的，这表现在生活中的方方面面，环境会给你反馈的，自己会根据环境做出判断。这肯定不是件容易事，如果自己都不相信的东西别人怎么会相信呢！所以其中也存在一定是必然性。是环境影响人，还是人调动环境，顺其自然的领导者算不算是天生的？


    # 万维钢


    我理解你说的是“领袖魅力”。领袖魅力的确有很大天生的成分。最简单的，身高比较高，就是个天生的优势。有一些人从小就能团结别的孩子跟他一起玩，还听他指挥。


    虽是这样，领袖魅力其实是可以学的 — 至少学点有用的皮毛没问题。而且有研究表明，短期的训练，甚至一堂课，就能有效提升受训者的领袖魅力，而且效果还能持续挺长的时间。这些训练课无非就是传授些“技巧”，并没有要求脱胎换骨触及灵魂的修行。…..都有些什么技巧呢？既然说到这里，我们干脆近期专门写篇文章。


    赵理想：如果一上台看到下面坐的人就紧张，这个怎么破？


    # 万维钢


    费曼在普林斯顿念博士的时候，有一次作报告，事先完全没想到，爱因斯坦居然来了，而且还有以批评别人直言不讳闻名的泡利。费曼非常紧张……可是他一开始说物理，就把什么紧张、什么大牛、什么可能的批评全忘了，可以说是进入了“无为”的状态。


    这就是因为他真有料。他有一个独一无二的新思想，而且他知道台下那些大佬对这个思想感兴趣。事后证明那次说的內容在物理上并不成立，而且泡利当时就明确表示不信 --
    但是这都没关系，物理学研究本来就是这样。


    如果没有这么猛的料，那就只能靠熟练弥补。练习的本质是假装：学些表示自信的肢体语言，比如演讲的时候应该走来走去，不要站在一个地方不动！最好说着说着走到观众中间去跟人互动几句再走回来。总而言之，fake
    it until you make it -- 装着装着就是真自信了。


    # 来自日课：大目标，和任务勾选框


    水水：面对问题，有办法总比没办法强。如果现在的做法不能完全解决问题，那么通过不断地试错，从而修正改善总能找到好的办法。在没有找到新办法之前，当前的做法就是最好的办法。例如，对于大组织（尤其是政府组织），像KPI这类绩效考核仍然是适用的。这是因为绩效考核有统一的标准，有客观量化的數據，考核对每个人都是相对公平的，组织可以通过设置考核指标来命令下级完成任务。如果考核指标设置不完全正确，那么不断改善就是了。对于政府组织，如果不用绩效考核，那用什么办法来衡量，来评价呢？


    # 万维钢


    的确如此！不同的人，不同的事情，差别千变万化，用任何明确的规章制度来管理都肯定是有漏洞的。但要管理大量的人和事，有裂端的制度也比没有制度好。我们不能指望有什么完美的东西，生活本来就不完美。


    我个人感觉，越往下，越要强调原则性；越往上，越要强调灵活性。比如说现在大学和科研机构评价一个人的学术水平，如果是招博导后或者助教教授之类，那就是强调几个数字化的硬指标，多少篇论文，什么引用因子。


    但如果是著名机构要招一个正教授，那就不能用这套体系了。这时候你要的这个人肯定在学术圈已经有了名气，圈内人对他的评价才是真正重要的因素。而这种评价往往很难量化，需要让有思想的人来决策，而不能靠机械化判断。


    关键在于，制度是死的，人是活的。你只要成长了，就可以享受灵活性。如果有个刚毕业的博士生说我就不服这些硬指标，我要求用评选院士的办法全面考察我的水平——这个人就有点过于理想化了。


    # 来自日课：平庸公司的厚黑学


    如果我是真的：我是一名创业者，按照万老师介绍的观点来看，对于企业需要分阶段管理，那么如何让企业在进入稳定期的同时不息妾呢？企业老板让自己的企业不息妾应该怎么做啊？


    # 万维钢


    公司事业平稳，员工日子过得都不错，而领导者高瞻远瞩，看到了即將到来的危机，或者一个新的发展机会，他有什么改革的手段吗？一般说改革都是有了真的危机才改革，这种还没有危机就想先改革肯定不容易，会被认为是瞎折腾。


    不过有本书，希斯兄弟的 Switch: How To Change Things When Change Is Hard （中文版：《情变：让改变轻松起来的9个方法》），说的内容其实就是这样的改革，推荐你去读一读。'
