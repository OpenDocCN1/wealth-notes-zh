  md: '# 日课116｜老百姓的不满和高材生的设计


    日课116｜老百姓的不满和...


    今天说个“行为设计学”的坏消息。咱們日课之前有篇文章叫《行为设计学》，讲到现在有些心理学的手段被Facebook之类的公司用于产品设计，能左右用户的使用习惯，甚至让人上瘾，可以说是心理学家的黑科技。


    我们也说过，“行为设计学”很早就被用于公共领域，以前有一本书叫《助推》（Nudge），设想政府可以用这些手段帮助人民作出更好的选择。


    现在情况是，行为设计学在私人领域效果不错，但是在公共领域效果不太好。


    2017年1月23号这期《纽约人》有篇文章叫《好行为》（Good Behavior: An unusual team of White House scientists
    works through the final days of the Obama Administration），作者Sarah Stillman。这是一篇比较长的报道，说了个故事，而且其中穿插了一些行为科学在公共政策方面的一些最新的应用，内容很不错。


    咱們说的“行为设计学”，在这篇文章里叫“选择建筑学（choice architecture）”，其实意思都一样，说明现在这一行刚刚兴起，想当祖师爷的人太多，谁都不肯用别人发明的名称。


    如果现在有一个学问，不强迫、不劝说、不宣传、不花钱，使用一个微小的心理学手段，就能左右人民的行为，从而改造社会，你说好不好呢？这简直是政府做梦都想要的东西。


    所以奥巴马政府从2009年就开始探索如何运用这类手段，后来还专门成立了一个白宫“社会与行为科学小组”。这个小组的负责人是一位非常年轻的女科学家，斯坦福大学毕业的高材生马雅·尚卡（Maya
    Shankar）。


    ![](img/9befb2e4b5878711040fbe72f1245d32_221_0.png)


    尚卡的父母都是印度移民。所以，少数族裔、女性、青年、科学家，无比政治正确，对奥巴马来说这是非常理想的人才。尚卡本人也是睥睨满志，自己的团队虽小，也想要做一番西丙两拨千斤的大事。


    但是想做大事可没那么容易。我看这篇文章列举的几个应用，感觉行为设计学在公共事务上的效果似乎一般——


    +   简化医保计划的申请手续，让人更容易加入。


    +   设计一套新系统，让贫困家庭的孩子不经申请就能得到营养午餐补助，还能防止冒领。


    +   为了让孩子更愿意吃健康蔬菜，让学校食堂给蔬菜起更酷的名字——比如胡萝卜叫“X光视觉胡萝卜”，西兰花叫“铁拳西兰花”——结果有酷炫名字的蔬菜的确更受欢迎。


    +   英国很多医生滥用抗生素，政府就给那些开抗生素最多的医生写信，也不批评，只是告诉他，你是全国开抗生素最多的医生之一——结果英国抗生素处方率下降了3%。


    +   美国每年夏天有20%到30%已经被大学录取的新生没有入学——有的是因为家庭困难，有的是因为忘了申请助学金的手续！行为科学家想了个办法，在整个夏天给这些学生发8个提醒短信，结果入学率提高了7%。


    # 这些似乎都是小事儿，而且这个效果，3%？7%？也许统计误差都有那么大。那行为科学能不能用在大事情上呢？


    2014年，美国一个贫困小镇的水源发生了严重的铅污染。铅对成人身体有直接危害，而且能够直接损伤小孩的大脑，降低智商。这是一个环境危机，同时也是一个心理危机！


    污染刚发生的时候，小镇政府居然欺骗人民，说水是干净的！结果导致更多人中毒。现在当地人已经完全不信任政府了。


    小镇政府的不专业还表现在承认水污染之后也不知道怎么处理，曾经一度号召居民把水烧开再喝——但实际上铅污染水烧开了毒性更严重。


    小镇上的居民多是黑人，本来经济条件就不行，本来水费就特别贵，现在政府只好挨家挨户发了一些免费的瓶装水。可是洗澡怎么办？每家就必须安装过滤装置，可是过滤水的步骤，非常麻烦。


    还有一个困难是非法移民。小镇上有些从墨西哥过来的非法移民，他们语言不通，而且因为害怕被遣返根本不愿意跟政府接触，生活非常封闭。到了这个时候，有些非法移民甚至还不知道水源被污染了。


    这是行为学家大显身手的机会。怎么让居民重新信任政府？怎么跟非法移民沟通？怎么教会居民过滤水的正确方法？怎么破除“水要烧开再喝”的谣言？


    最近，尚卡领着她的行为科学团队从白宫来到小镇。她们跟当地政府官员、居民代表、宗教团体在一起开了好几个会，尚卡弄了一大堆PPT，最后给两个问题提出了解决方案。


    首先是辟谣。当地人的想法是现在赶紧告诉居民“我们上次说错了，水其实不能烧开喝”——尚卡说千万不能这么做。行为科学认为直接否定谣言反而可能会进一步传播谣言，最后老百姓肯定分不清哪个对。比如之前有个谣言说奥巴马是穆斯林，你要辟谣，你千万不要说“奥巴马不是穆斯林”，那样反而让本来不知道这个谣言的人也开始怀疑奥巴马是不是穆斯林——你应该说“奥巴马是个基督徒”。'
