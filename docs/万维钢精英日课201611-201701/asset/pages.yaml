  md: '# 3.做明星，别做艺术家


    《人物》杂志的编辑还发现，现在的明星跟历史上那些“艺术家”有个本质的不同。


    过去的艺术家，都是用作品说话，非常不愿意向公众展现个人生活。


    而现在的明星，则是非常乐意暴露私生活。家庭矛盾、性生活、宗教信仰，只要《人物》问，他们什么话题都愿意谈。


    这是因为明星收割注意力的商业模式变了。过去的明星只能靠演技谋生，而现在的明星靠的是“名望”。你说金·卡戴珊为啥这么有名？她有什么特别厉害的作品吗？也许她有名就是因为她“有名”。她在片场外的花边新闻，才是她的价值所在，她的名望就是她的资本。在这个朋友圈时代，人们对于明星的私生活越来越感兴趣，对演技和艺术越来越不在乎了。


    现在美国电视有一类特别受欢迎的真人秀节目，就是完全让普通人出演。这些人不需要演技，不需要会唱歌，也不需要是任何领域的“达人”。节目就是把一群普通怯男美女聚集在一起，比如说把他们放到一个岛上，让他们按照一些什么规则互动，并且用遍布房间的隐藏摄像机把他们的一举一动都记录下来，向观众播出。


    结果观众看得如醉如痴。


    这不就是中国现在特别火的网络直播吗？不需要任何剧情，观众都爱看主播们在干些什么……而主播根本就不需要干什么。


    “像我们”的极致，就是演技为0的普通人也能当明星。“超越我们”的极致，就是有名仅仅是因为有名。对现代的很多明星来说，演技和长相都是获得名望的敲门砖而已，而且最好的敲门砖其实是运气。怎么出名不重要，重要的是出了名以后怎么经营这个名望。


    每个时代的人都崇拜名人。只有我们这个时代，把明星做成了产业。


    # | 我的评论


    我有一个看法，中国的演艺明星们，一开始享受的媒体待遇就是《人物》杂志这个级别的。美国媒体是从八卦到严肃，中国媒体是从严肃到八卦，谣言小报都是后来才有的东西。本来，中国观众对明星的观感都很好，甚至寄予艺术家的厚望，这大概也是为什么现在我们对明星有这么大的失望。


    有人气不过，说明星在旧社会就是戏子！这种话没有任何意义，现代明星的真正地位有如神明。有人指责明星们不好好练习演技，整天弄花边新闻炒作，殊不知花边新闻是明星工作的一部分。至于说谴责明星道德堕落的，更是根本没摆正明星跟粉丝的关系。


    你真把明星当神，才会对他们产生这么多负面情绪。明星不是神。他们的A工作就是娱乐大众，观众喜欢善良，他们就扮演善良；观众喜欢性感，他们就扮演性感。观众喜欢谈道德？没问题，将来中国一定会有明星在戏里戏外都扮演道德导师，用人格魅力给观众提供充分的道德优越感。


    明星的商业模式就是积累名望，然后把名望变现。他们就是注意力商人。


    而且明星这个职业会越来越不好干。国民总时间只有这么多，注意力商人玩的都是零和博弈。网络主播的竞争力量这么强，我们大概可以预期，演艺明星们会进一步放低身段，牺牲隐私。


    # | 由此得到


    咱们日课的读者大概不至于追星，但是你应该了解明星。我们生活在一个明星主导文化的时代。有时候想想这真是很无奈……好在这也是一个多元的时代，不追星，也可以玩手机啊。


