  md: '# 日课088｜《成功与运气》解读5：富而好礼（完）


    日课088｜《成功与运气》...


    今天咱俩把罗伯特·弗兰克的Success and Luck: Good Fortune and the Myth of Meritocracy（成功与运气：好运和精英社会的神话）这本书说完。


    咱俩日课之前讲过森胤瀏的《无为》，他用现代科学一些最新成果解释中国古代的经典。今天我能不能效仿一下森胤瀏，用一段中国经典，来概括一下弗兰克这本书中一些经济学和心理学实验的内容。


    我想到的就是《论语·学而》中的一段话——


    > 子贡曰：“贫而无谄，富而无骄，何如？”

    子曰：“可也，未若贫而乐，富而好礼者也”。


    我理解子贡说的是Buffer


    放在《成功与运气》的语境下，那就是说一个成功者，初等的要求是不骄横，高等的要求是要主动回报社会。


    # 成功了就骄横，可是人的本能。


    # 1.富贵而骄


    有一个著名的“分钱实验”，你可能在别处都看到过。实验是让A和B两个互相不认识的人去分一笔钱，比如说100元。规则是这样的：A决定这笔钱怎么分，而B决定是否接受A的分配方案。如果B接受，那么二人可以拿钱就走，如果B不接受，那么就是一FAT


    ![](img/9befb2e4b5878711040fbe72f1245d32_145_0.png)


    这个实验的机关在于，实验者宣布A和B的对错，其实是随机的，跟二人的实际答案一点关系没有。


    # 2.主要看气质


    弗兰克说，一个人要想在事业上取得成功，光靠自己的天赋和努力是不够的，得跟人合作才行。最好的办法，就是加入一个精英团队。而别人愿不愿意跟你合作，也不是光看你的天赋和努力，还得看你能不能维护集体的利益——换句话说，就是你是否能不作弊。'
