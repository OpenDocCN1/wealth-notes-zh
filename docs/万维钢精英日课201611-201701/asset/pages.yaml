  md: '# 来自日课：把人变成工业品的思想


    嘎啦嘎啦嘎啦：听了万维钢老师好多期节目，对很多知识，很多现象都有了更丰富的看法，有的是改变，有的是更新。我发现您总是拿出很多新书，新研究，新现象来和大家分享。我很好奇，您的认知体系的搭建是怎样的，很想知道过去有哪些影响您的重要旧书，旧研究，和旧知识点。经过这么多期的相处，我早已不再怀疑您对此栏目的辛苦付出。能否在后面的栏目中穿插着讲一讲。谢谢！


    万维钢

    我的水平很不够，“个人学问之道”这种题目我是不配说也不敢写的。有些纯技术性的经验，比如读了哪些好书，用了哪些工具，将来可以说说。


    边旭力48211137：以后是否会有机会解释某种人特别容易得到别人帮助的书，不是那种能帮一把的帮一把而是那种你有意无意地都会想着她一点的那种。不是指洞见，而是科学的研究。对这个点特别想知道，万分好奇。


    万维钢

    有本书叫 Give and Take，中文版被恶俗地取名为《沃顿商学院最受欢迎的成功课》，作者亚当·格兰特，说的就是这个话题。


    栾登：那么如何定义精英呢？平均是不是我们的一种衡量标尺呢？


    万维钢

    现在这个根据相对“平均水平”的距离来给人排序的方法，问题不在于排序，而在于排序的时候只考虑了特别单一的指标，比如说高考总分。现代社会要求“能人”，必须有复杂的技能，这些技能往往不能通过几个简单指标描写。明天的文章咱们详细说。


    乾坤：在工业社会你是系统的一部分，你的价值由系统评价，而现在系统是你的工具或者说合作伙伴，你可以自由选择任何系统，因此你的价值由自己来定义。既然这样，那么在这个时代要想成功和获得尊严只是做到比别人更好是不够的，你必须和别人有所不同。如果是这样的话，那么所谓“和别人不一样”的选择是自由还是被迫自由呢？


    万维钢

    哈哈，这也是一个哲学问题啊！现在网上流行一种文体是“青年与禅师的对话”，十几年前，青年的我，曾经跟一位也许是真的禅师有过一次对话。我在网上遇到一个号称“普陀山人”的人，我就向他请教了一点佛学。我问他，按理说做好事应该是考虑到回报的，可是你们佛教整天宣传因果，我看那些打着信佛的旗号做好事的人都是为了图个好报，这样真的好吗？如果一个人是真的信佛的，那么他做好事的时候怎么才能确保真诚，不想“好报”呢？

    禅师说，你做好事就算图个好报也没什么，因为你获得了好报之后，就有能力去做更大的好事啊，这叫“回向增量法”。我一听太对了——我立功是为了升官，可我升官也是为了更好地为人民服务啊。

    所以你说的这个自由和被迫自由，没必要特意区分，这是个良性正反馈过程。

    这位“普陀山人”，现在也不知去了哪里！


