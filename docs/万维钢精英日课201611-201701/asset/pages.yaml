    # 日课078 | 政治争论 ABC(下)


    日课078 | 政治争论ABC(下)


    今天我们继续说美国的三个主流政治派别 —— 自由派、保守派和自由论派。我们使用的这本书还是 The Three Languages of Politics（政治争论的三种语言），作者是卡托研究所的经济学家阿诺德·克林（Arnold
    Kling）。


    ![](img/9befb2e4b5878711040fbe72f1245d32_119_1.png)


    前面我们说到，这三个派别的思想其实都有道理，因为它们是基于三种情感倾向，也可以说是三个思维快捷方式，代表三个思考公共事务的角度。


    本来我们作为个人，最好能同时具有这三种思想，到时候具体问题具体分析。可是一人一旦参与到公开的政治争论之中，就难免会拉帮结派。想法相似的人会自发地团结在一起，分出敌我友，最后甚至可能形成正式的政党，党同伐异。


    到了这个局面，政治辩论也就变得非常不好玩 —— 从另一个角度来说也可以说是非常好玩了。现在我来给你出题目。


    # 1.攻击的方向


    假设你加入了某个政治阵营。也可能一开始你没想跟人结党，也可能是碍于情面迫不得已，总之你现在进来了。你上次在论坛跟别的阵营的人论战，咱俩这边的人给了你积极的支持。咱俩看你人格魅力高，演讲水平强，决定让你在阵营之中发挥更大的作用
    —— 给你提供条件，让你经常发表文章和巡回演讲。


    成了公众人物，你就有能力影响我方阵营和敌方阵营的人的思想。那么问题来了，在以下三个方向中，你应该专注于哪个方向呢？


    +   （A）开放对方阵营成员的头脑，说服对方加入我方阵营；

    （B）开放我方阵营成员的头脑，鼓励我们的人去考虑对方的视角；

    （C）关闭我方阵营成员的头脑。


    如果你是个一点斗争经验都没有的好青年，我敢打赌你会选错！


    正确答案是（C），关闭我方阵营成员的头脑。只有这么做，你才能团结自己阵营的人，共同对付其他阵营。


    克林考察了大量美国公众人物的言论，包括专栏作家的文章和政客的发言，发现他们所做的事情，都是关闭本方阵营成员的头脑。他们似乎并不奢望争取对方的人，他们更关心怎么把本方的人留住！他们最担心的事情就是本方阵营的成员加入了对方阵营。


    > 你不能讲“包容”，也不能一味防守，你要做的是进攻。最好的办法就是抓住对方的一个什么弱点猛攻，而对对方阵营的优点和正确的观点一律视而不见。

    14年笔记


    比如在这一届的美国大选中，希拉里说过一句话，说大部分特朗普的支持者都是可鄙之人（ a basket of deplorables），这句话其实有点失言了 ——
    特朗普的阵营就抓住了这句话反复抨击希拉里。专门针对这句话做了个党选广告密集播放，各种谈话中反复说。当然希拉里批特朗普小辫子的时候更多。


    形容这个做法，我们最好借助一句英文 —— “gotcha”，“got you”的省略语，也就是“我终于抓住你了！”


    所谓政治争论，其实在很大程度上就是玩这个 gotcha 的游戏。


    我们来想想这件事。希拉里说过很多话，也许其中绝大部分都是正确的，可是特朗普阵营的人最关注的，是她说错了的那几句话。


    我们看中文微博和网上论坛上不也是如此吗？一个有点影响力的人，他可能说的大多数道理都是对的，但对方阵营根本不考虑，对手唯一关心就是他说错了、或者说得有漏洞的那句话，一旦发现一句，就兴奋得不得了
    —— gotcha!


    这就是现在的政治争论。如此一来，各方阵营都各说各话，把对方描绘成又蠢又坏的人。这种口水仗，人们根本不是在攻击对手真正主张的观点，而只是抓住了 一句话错话而已，攻击的都是稻草人。


    # 2.部落之心


    人都是好人，为什么一旦加入阵营就成这样了呢？克林说，这里面有个阵营内部的政治问题。


    人生在世，除了追求自我实现之外，还都追求一个归属感，或者说是集体认同感。也就是说我们其实都有点原始部落（tribe）的思维，只不过现代人都属于不止一个部落。根据乔纳森·海特在《正义之心》这本书里的说法，人不是只顾自己的，他天生也有一种希望自己的部落好的情感。我们最关心的，其实就是两个地位：


    +   我在我所属部落的地位

    我所属的部落，相对于其他部落的地位


    这两个关心是可能有冲突的。也许我爱自己胜过爱部落，那么我为部落做事的时候就可能是装装样子 —— 所以一个部落内部的政治，首要一点就是要把那些装样子的人给揪出来。'
