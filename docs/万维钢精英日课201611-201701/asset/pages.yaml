  md: '# 日课090 | 一个让人寝食难安的世界观


    日课090 | 一个令人寝食… ↓


    我认为这个世界上的道理一共有两种。第一种，就好像电视剧一样有始有终，听完很舒服，它的结局是和谐的，它告诉你世界是完美的。“世上本无事，庸人自扰之”，最终一切回归到真善美，我们只需
    要坐在那里欣赏。这种道理，大概是我们为了坚强地活在这个世界上而故意给自己找的错觉 —— 说的浪漫一点叫做心灵鸡汤，说的严肃一点，就是精神鸡片。


    第二种，则是真实的道理。真实的道理是没有结局的，你听完总觉得哪里不够完美，这种道理总有矛盾和疑惑、解决了一个危机还会迎来下一个危机，甚至可能是更大的危机。


    我得承认，咱们日课讲的很多内容都有不错的结局 —— 但你也知道，那些结局不过是阶段性的，继续推演下去还不知道会怎么样。


    今天我要说的，是一个有关这个世界的最基本的事实，它的道理，却可能让你寝食难安。不知道就不知道，一旦知道，你的思想就会发生一个永久性的改变，也许再也不能就这么心安理得地生活下去了。


    # 我们要说说宇宙的事儿。


    今天要讲的是《宇宙》（Cosmos）杂志十二月的一篇新文章，A universe made for me? Physics, fine-tuning and
    life（宇宙是为我定制的吗？物理学，微调和生命），作者 Geraint Lewis 是悉尼天文学院的天体物理学家，他的主要工作是用计算机模拟宇宙的演化。不过这是一篇纯粹的科普文章，内容都是物理学家早就知道的。


    乍一看，我们这个宇宙挺简单的。宇宙中的主要物质是100多种原子，而原子又由质子、中子、电子组成。再深入一步，你可以说质子、中子都是夸克组成的。这样宇宙的最主要构成成分，也不过就是六种夸克、六种轻子和四种基本的力
    —— 按物理学家的说法叫做四种“相互作用”——包括引力、电磁相互作用、强相互作用和弱相互作用。


    现在物理学家已经有一个非常厉害的理论，叫做“标准模型”，能够把前面说的这些所有东西 —— 除了引力之外 —— 都描写清楚，而且无比精确。标准模型预言应该有一个叫做“希格斯波色子”的东西，现在也被发现了，也就是所谓“上帝粒子”。当然，还有一些事情是标准模型解释不了的，比如说暗物质和暗能量，但这些都不是我们今天要说的。


    ![](img/9befb2e4b5878711040fbe72f1245d32_152_0.png)


    我要说的是一个更严重的问题。标准模型有19个自由的参数。这些参数不是理论计算出来的 —— 也就是说似乎没有什么道理约束它们必须如此，它们都是被实验测定出来的。物理学家不知道为什么这些参数恰好是这样的数值。


    但是物理学家知道，如果它们不是这样的数值，我们这个宇宙可就麻烦了。


    比如说，“下夸克”的质量。


    ![](img/9befb2e4b5878711040fbe72f1245d32_152_1.png)


    质子是由两个上夸克和一个下夸克组成，中子是由两个下夸克和一个上夸克组成。下夸克比上夸克稍微重一点，这导致一个单个中子的质量要比单个质子稍微大一点。质量越大就越不稳定——中子就是不稳定的，一个自由的中子只有15分钟寿命，过后就会衰变。原子核之所以稳定，是因为中子多出来的质量变成了原子核的结合能。


    而对比之下，单个质子非常稳定，似乎永远都不会衰变。


    这个事实非常重要。只有质子稳定，我们才能得到氢原子——一个质子加一个电子。宇宙中90%的原子都是氢原子。氢元素是一个非常活泼的元素，很容易和其他元素产生化学反应，比如氢气和氧气反应后产生水。你这个宇宙想要有生命，就必须要有大量的氢原子。'
