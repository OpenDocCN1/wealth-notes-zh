  md: '利维斯通说了三个事实，在我看来有点怵目惊心。


    # 1.整体工作数量正在减少。


    这个判断来自伦敦大学经济学家的 一份报告。报告说20年之后，目前所有工作的一半，将会消失。不仅仅是体力工作，一部分脑力工作也将消失，被人工智能和自动化所取代。这个问题我们已经听说过很多次，今天不必细说了。


    # 2.即使是幸存下来的这些工作，其中一大部份也是根本不值得做的。


    现在美国的失业率是6%，这是一个非常漂亮的数字，意味着想工作的人基本都能找到工作。问题在于这些工作不是什么好工作。大部分工作的收入非常低！这就是为什么就业率很高的情况下美国收入不均的局面越来越严重。


    美国四分之一“有工作的”成年人的收入实际上是低于贫困线的。美国政府规定的贫困线是三口之家的家庭年收入应该在差不多2万美元。如果这个三口之家只有一人工作，他每天始满八个小时，每小时收入必须达到10美元才行。可是联邦政府规定的最低工资是每小时7.25美元。而且有些人还找不到全职的工作。这些拿低工资的人怎么养家？这就是为什么当前美国五分之一的儿童处在贫困状态。


    还有一个数字——“有工作的”美国成年人中的一半，因为收入如此之低，以至于可以去领食品券。食品券是美国政府给低收入者的一個福利，人们可以拿食品券到超市买吃的。不过很多可以领食品券的人拒绝申请这个福利。


    # 3.美国已经是一个福利国家。


    从1959年以来，美国增长速度最快的收入类型，是政府的转移支付，也就是政府直接发放的福利。所有家庭收入的总和之中，有20%是政府的转移支付。如果没有这笔转移支付，一半有工作的美国人会陷入贫困。


    很多人可能会质疑福利是否会给国家造成负担，阻碍经济增长。但利维斯通说，从纯经济角度来看，一点问题没有。他说只要两条，第一，个人社保基金的上限提高一点；第二，提高企业税率，就足以提供很好的福利，让所有美国人生活愉快。


    那么提高企业税率，会不会把企业逼到国外去，减少美国的工作数量呢？根据前面我们介绍过的，消费带动经济增长这个理论，不会。高福利制度能够保证国民都有足够的资金用于消费，有了需求，自然有企业来满足他们的需求，经济自然就能增长。


    这样说来，从纯经济角度讲，大部分人不工作，只有一少部分人工作，国家是可以正常运转的。


    可是经济没问题不等于社会没问题。一小部分人养活大部分人，这对社会意味着什么呢？


    过去我们一直认为，工作，并不仅仅是提供一份收入。工作还有很多别的意义，比如说有利于性格养成！正是你因为你每天都得工作，你才有了勤奋、诚实、守纪律这些好品质。如果你根本不需要工作，你应该做些什么呢？打游戏吗？这样如何培养人的性格呢？更重要的是，对很多来说，人生的意义就是通过工作为社会创造价值，不工作了，他们将会无所适从。138笔者记


    所以利维斯通说，福利社会并不是一个经济问题，而是一个道德问题。对知识分子来说，这个问题也是知识上的一个挑战——在即将到来的这个只有少数人工作的时代，大部分人应该何以自处？


    实际上，作者并没有在这篇文章中解决这个问题，他只是提出了自己的一些设想。其中一个设想认为如果大家都不工作，更能促进男女平等。因为在过去，男的收入高、挣钱养家，女的收入低，这是男女不平等的根源。再者，工作还带来了社会等级差异，老板比雇员的等级高。从种族来看，黑人大部分都是出卖体力的雇员，所以黑人的社会地位低。如果大家都不工作的话，这些差异就都不存在了。


    作者甚至提出，如果不工作不道德，难道德工作就道德吗？银行家和华尔街投机者干的一些事情跟犯罪分子有什么分别？与其做那种工作，还不如不工作。


    # | 我的评论


    如果你认为利维斯通的观点有点过分了，我跟你有同感。他说大多数人不工作能促进人人平等，我看纯属无稽之谈——没有工作，只能促进那些不工作者之间的平等，可是同时会大大加剧工作者和不工作者之间的不平等！


    其实利维斯通想研究不工作的社会，根本没必要坐在大学办公室里畅想美国未来，他为什么不去欧洲看看？最近罗辑思维有一期节目叫《共同体的意义》，其中讲到一本书叫《反社会的人》，书中说的就是上层阶级和下层阶级如何搞垮德国社会。德国现在已经形成了一个庞大的不工作阶层，靠政府福利生活——这些人的生活状态和精神状态，我看应该用“绝望”形容。


    但是利维斯通提出的问题是真实的。不远的将来，确实会存在一大部份人没有工作可做。而且社会并没有准备好。


    美国有些经济不发达的州，其中有很多白人，收入非常低。他们思想保守，崇尚传统价值观，经常被称为“红脖子”——可就是这些红脖子，宁可拿一份微薄的工资身陷贫困，也拒绝领取福利！他们认为领福利是一种耻辱，是寄生虫才做的事情。很多中国人，一些在美国生活的华人，也有这样的精神。


    这是特别高贵的精神。


    你说政府应该直接给他们发钱，让他们回家打游戏去，我认为你这是对他们的侮辱。


    可是这些人应该何去何从呢？


    # | 由此得到


    作为有知识的现代人，我们总要对未来有所预判，看看有什么变化，怎么应对——一般都是从自己的角度想，今天我们了解了一个别人的角度。


    万维钢


    顺着利维斯通的观点，你也可以想一想，如果某一天你不需要去工作，完全可以靠高福利生活的时候，你将如何自处？欢迎给我留言。'
