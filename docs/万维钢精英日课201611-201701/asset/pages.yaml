    # 周末小议｜权利和权利


    标题并没有写错，不是“权利和权力”，是“权利和权利”。今天咱们继续这个“概念辨析”小栏目。之前我们有过一期叫“道德和道德”。


    这次说的是 right 和 privilege。


    Right，我们都知道是“权利”的意思，人权、著作权，都是这个 right。Privilege 这个词通常的译法是“特权”，是一种并非所有人都有，只有少数人才有的“权利”。Privilege
    是“特权”，但并不是一种特殊的“right”。


    Privilege 和 right，是互不包含的两种权利。


    所谓 privilege，是政府、或者什么机构、或者什么人，授予你的权利，是特权。比如成为各种会员，上大学，甚至因为出生在一个比较好的家庭而拥有各种优越条件，这些都可以称得上是特权。


    更进一步，哪怕这个权利是政府提供给“所有人”的福利，比如说免费上小学，这个权利其实也是特权。因为它是……政府给的。这届政府给了，你很高兴；之前的政府没给，你也没说什么。


    而所谓 right，却是一个人天生就有的权利，不需要任何东西赐予你。比如美国《独立宣言》说“人人生而平等，造物主赋予他们某些不可转让的权利，其中包括生命权、自由权和追求幸福的权利”，这些就是
    rights。《宣言》中拿造物主说事儿，意思就是你不用为这些 rights 感谢任何人间的东西。


    我理解“著作权”（copyright）就是这么一种 right。你写一篇文章，只要公开发表了，不论你发在那里，哪怕是发在博客或者网上论坛，从发表那一刻开始，你就自动拥有它的
    copyright。现在好像中美两国的法律都是你根本不需要去特别注册一篇文章的著作权，自动就有。就算需要注册的，也只是为了便于操作而走一个手续，背后的意义永远都是这个权利你就应该有。


    Right 这个概念，非常了不起。它等于给政府权力设定了一个限制：凡是 rights，就是你政府根本就不应该管的。比如言论自由这个 right，美国宪法第一修正案的说法不是“政府应该保障言论自由”，而是“政府不能制定限制言论自由的法律”。也就是说公民本来就有这个
    right，不需要你的赐予，你别插手就对了。


    现代人参与各种社会活动，就得有点权利意识。


    Rights，我们在生活中可能经历不多，但是在美国时不时就会有场争论。比如说，人有 rights，那么企业有没有 rights？几年前美国最高法院裁定，企业可以任意捐款去支持政客竞选，还援引了宪法第一修正案，说这是言论自由。这个裁定就有非常大的争议。有很多人认为，企业只能有
    privileges，不能有 rights。


    而 privileges，我们的感受就非常明显了。


    所谓“社会经济地位”，无非就是各种 privileges。争夺这些特权显然是比单纯花钱买东西更高级的世俗追求。水平完全相同的两个高中生，A的家庭只能让他自己报考一所公立大学，而B的家庭就有办法把他送到耶鲁去，这种特权，比买个什么名牌包包可厉害多了。


    但是市场经济有个好处，那就是很多 privileges 都是花钱就能买到的。


    我最近一次享受 privilege 是在停车场。机场自带的停车场收费很贵，如果要出门很多天，我们一般都把车停到机场附近的私营停车场，然后他们用面包车把你送到机场。那家停车场提供三个档次的服务：露天区、有棚区、和
    valet，也就是代客停车——你到门口直接下车走人，有小厮把你的车开走停好，你回来他再把车交给你。


    我们一家选了有棚区。回来以后，停车场的面包车从机场接了一整车人，按照乘客交给司机的停车票把人一个个送到各自的车旁。按理说，应该先送 valet，再送有棚区，最后露天区。结果那次司机疏忽了，把有棚区的其他乘客送完，跑到露天区了也没送我们。我就说我们是在有棚区的。


    司机赶紧说对不起对不起。我说没关系，等下再送我们。他说哎呀实在是不应该，有棚区是有优先级的。


    这时候后面一个老太太说话了，说她是 valet 的！司机连忙又向老太太致歉。


    这时候老太太说了一句话，我一听太有特权味道了——


    > “没关系，看看下面这儿的情况也挺有意思”。


