  md: '# 新年快乐 | 今天，你立志了没有？


    新年快乐 | 今天你立志了没…


    每逢新年的时刻，我们总爱回顾一下过去，展望一下未来，我们希望未来比过去好，把新年作为一个全新的开始。所以新年这一天，其实是一年之中最适合立志的一天。新年甚至比生日更重要——我刚看到一个研究，说几乎没人在生日的时候立志戒烟，但是的确有人在新年立志戒烟，而且还成功了。


    所以你应该郑重其事地找张纸，写下自己的若干个新年目标。


    但是在你开始写之前，请先听我一言。


    > ——你的目标将不太可能实现。这不是我信不过你，这是科学统计的结果。你现在想得再好也没用，过段时间就会跟以前一样。


    新年立志，在很多地方已经成了人们的传统习俗，就好像圣诞节送礼物一样。英文世界甚至对此有个专门的名词，叫 “New Year’s Resolutions”，直译过来就是
    “新年决议”——这个说法非常郑重其事，就好像什么联合国安理会的决议一样。那么你可以想见，针对 “新年决议”，必定已经有了大量的研究。


    +   * 2015年最常见的三项新年决议是减肥、时间管理和存钱。

    * 45%的美国人经常性的设定新年决议。

    * 另有17%的美国人偶尔设定新年决议。

    * 以减肥决议为例，你的决议想必是节食或者去健身，那么有多少人遵循了自己制定的决议呢？在新年这天立志的人中——


    +   一周以后，还剩下75%；

    两周后，还剩下71%；

    一个月，64%；

    六个月，46%。


