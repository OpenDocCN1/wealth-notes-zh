  md: '# 周末小议 | 推荐5本奇书，纯为好看


    今天周末，我们能不能搞点娱乐活动——分享几本好书。不过可不是我们专栏平时说的

    好书，而是娱乐性的好书。这些书的入选标准是：


    +   - 中文

    - 无关思想学习，不论作者对错

    - 好看或者好玩

    - 比较新


    说说我最近看过，而且特别喜欢的五本。


    # 1.李天飞，《万万没想到：西游记可以这样读》


    出版社给起了一个让我感到懵懵的书名，但这本书在网上连载的时候叫《李天飞大话西游》。


    这是一个考据派的西游记解读，观点和材料都来自名门正派——所以颠覆了电视观众对西游记的认知——但是写得还特别有娱乐性！特别有意思的一点，书中有很多道家修行角度的解读，因为《西游记》原本就是一本道家的书。


    ![](img/9befb2e4b5878711040fbe72f1245d32_100_0.png)


    # 2.老树，《在江湖》


    这是一本画册，风格都是这样的：


    ![](img/9befb2e4b5878711040fbe72f1245d32_100_1.png)


    ![](img/9befb2e4b5878711040fbe72f1245d32_100_2.png)


    作者自成一家，尤其是所配的文字很有趣味，有的时候还挺幽默。


    # 3.紫金陈，《高智商犯罪》


    这是一本中国人写的推理小说，书中故事的网络版叫《谋杀官员》。作者专攻“本格推理”，不怎么在乎文笔，没有过度的描写，节奏很够意思。案情设计非常精彩……还偶尔出现一个让人感动或者让人痛快的情节。


    ![](img/9befb2e4b5878711040fbe72f1245d32_100_3.png)


    # 4.刘仲敬，《经与史：华夏世界的历史建构》


    平生不识陈近南，便称英雄亦枉然！刘仲敬是当今奇人，读书过目不忘，讲话出口成章，观点独树一帜，姿态天下最狂。


    我认为刘仲敬关于近代史的说法，他保守主义的思想，他的“大洪水”理论，全是错的。不过我们说了，今天不论思想只论好看——这本书，非常好看。


    有一次请朋友来家里吃饭，我为了推荐此书，竟专门翻开一页，在众人面前朗读了一段！


    ![](img/9befb2e4b5878711040fbe72f1245d32_100_4.png)


    # 5.保罗，《答案之书》


    我们专栏之前有篇文章，“混乱解读1：任意的震动”，其中提到音乐家布莱恩·伊诺用一堆写有各种指导意见的卡片来给创作提供灵感。当时咱们有个读者评论，说有本书叫
    The Book of Answers，就是干这种事儿的。我就立即买了一本。'
