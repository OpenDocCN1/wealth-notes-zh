  md: '# 日课100｜奢侈品的逻辑


    日课100｜奢侈品的逻辑


    咱们日课经常强调一个道理，就是办事情不能一根筋，要做一个有复杂思想的人，学会在两种相反的理念中寻求一个平衡。最近我发现一个绝佳的例子。


    今天我们的主题是，爱马仕的包到底应该卖多少钱。


    先别着急表态！不管你对奢侈品是个什么态度，先都放在一边，这次我们不是从消费者的角度考虑奢侈品。今天的问题是，假设你是爱马仕的CEO，你应该怎么卖这个包。


    我要说的这篇文章出自去年的《1843》杂志，题目是 Demand curve：Why doesn’t Hermès want you to buy their
    amazingly expensive bag？（需求曲线：为什么爱马仕不想让你买他们那个贵得出奇的包？）作者是《经济学人》杂志编辑 Brooke Unger。


    爱马仕有一款包非常出名，叫做柏金包，好像是现在世界上最贵的手提包。柏金包的价格主要是由做这个包的动物皮质的稀有程度决定的，从入门级的各种牛皮到鳄鱼皮、鸵鸟皮、鲨鱼皮……听着就好像是奇幻游戏世界里的包。入门级柏金包的价格是7000美元，在中国买还要交高额的奢侈品关税，达到10万元人民币以上。最贵的，是香港曾卖出过一个叫“喜马拉雅鳄鱼皮”的柏金包，高达30万美元。


    ![](img/9befb2e4b5878711040fbe72f1245d32_179_0.png)


    我对爱马仕的命名方法有点疑问，喜马拉雅山也没有鳄鱼啊？这都不重要——重要的问题是，一个手提包凭什么卖这么贵？


    爱马仕的官方说法，卖得贵是因为成本高。纯手工制作要求特别高，再加上用的动物皮特别珍贵。但是有分析师专门研究过，匠人制造一个包花费的劳动时间也就18个小时，即使考虑到皮质的珍贵，一个柏金包的成本也就800美元。爱马仕做的是至少乘以十的生意。


    当然，商品定价从来都不是由成本决定，而是由供求关系决定的。柏金包这么贵，还是供不应求。经济学上早就有个名词，叫做“韦伯伦商品（Veblen Good）”——一般商品都是价格越高，需求越少；而韦伯伦商品却是价格越高，需求越大！这是因为人们买韦伯伦商品是为了炫耀。正所谓“不求最好，但求最贵”，越贵才能越能彰显购买者的财富。


    不过，柏金包并不完全是韦伯伦商品。


    如果你要炫富，你就应该要求别人一眼就能看出来这个包是名牌——比如LV的某些包包，身上印满了“LV”这两个字母；古驰（Gucci）的包上，会有大大的字母G。可惜是爱马仕的柏金包上几乎就看不到商标，一般人不认识，只有内行才能看得出这个包的价格。这怎么炫富呢？


    这个现象，经济学家可是直到2010年才有一个理论解释。这个理论说富人其实分两种，一种可以称为“爆发户”，一种姑且就叫“贵族”。爆发户追求的是把自己和普通人区分开来，证明自己是个有钱人。而贵族则根本不在乎普通人怎么看他，只要本阶层的人知道他属于这个阶层就行了。爆发户是在向普通人炫耀，贵族是在向内行证明。


    这也解释了奢侈品的一个非常有趣的设计理念：同一品牌内，越是低端的类别，商标就越显眼。越便宜的LV包，LV两个字母就越显眼。奔驰越是低端的系列，车标就越大。


    这个道理大概就是“低调的奢华”。奢侈品的逻辑是不但要讲高价，而且要维持高品位。


    所谓高品位，关键就在于，只让该拿这个包的人拿这个包。为此爱马仕采取了两个措施。


    一个是限量。爱马仕每年只生产7万个柏金包，要买得先阻塞定制。你到专卖店必须显示出足够的购买诚意，售货员才能认真对待你，让你选择皮质外饰，再等上至少两个月的制作时间，商店再通知你去取包。爱马仕对此的解释是优秀匠人和珍贵皮子都太少，柏金包其实不是“生产”出来的，而是像比特币一样“挖掘”出来的。不过经济学家怀疑，限量主要是品牌管理需要。


    如果不是为了品牌管理，既然柏金包供不应求，为什么爱马仕不把价格定得再贵一点呢？要知道二级市场上的柏金包可是都比专卖店贵。


    也许根本原因是如果价格太贵，代表时尚的法国女人就买不起了。高定价可以让爱马仕在短期内大赚一笔，但从长期来看，如果有文化有品位的巴黎贵妇都放弃了这个品牌，只剩下没见识的发展中国家新贵用柏金包，柏金包的品牌形象就完蛋了。


    背柏金包绝不仅仅是为了炫富，而是为了当贵妇。


    爱马仕必须在高价和品味之间，寻求一个非常微妙的平衡。


    这个平衡，其实非常难以把握。


    事实上，爱马仕根本不用给柏金包做广告，名人们在网上发的那Clean，好的广告。但爱马仕恰恰不希望有太多这样的自拍照！很多菜考古小明星特别爱拿柏金包自拍，可是爱马仕认为他们根本配不上这个包。如果最终人们认为拿柏金包的都是整天上花边新闻的小明星，那些高端有钱人就看不上它了。


    我们马上就能想到一个问题：如果柏金包越来越大众化，那么爱马仕索性就重新为高端有钱人再设计一个新款式，让所有包包都从高端到低端自然流动，这样行不行呢？


    答案是也不行。比利时一个品牌同样主攻高端人群，质量和爱马仕不相上下，而且产量更低，每年只生产6万个，但是价格就是上不去，比柏金包低了15%到20%。'
