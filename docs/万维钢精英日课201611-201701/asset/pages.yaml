    # 来自日课：信命不认命


    **：可不可以也转换成为：同等水平的竞争里，运气很重要！？


    万维钢


    不是的。不同档次的竞争，拼的东西不一样。韩非子有句话说“上古竞于道德，中世逐于智慧，当今争于气力”——我理解这句话的意思是说，上古的时候各个部落的发展差异很大，也许你家部落已经有了文明，而别家部落还在很土的茹毛饮血，那你当然是轻易就能比别人高一大块，稍微表现一点文明作风，野蛮人也许纳头便拜。


    等到了中古，各地都有了最基本的文明，但是教育水平不一样，有的地方人聪明，有的地方人笨，那聪明人使几个计策，笨人就得吃亏。


    而到了战国末期，各地交流非常充分，谁也不比谁傻，计策什么的就不好使了。战争都是实打实的国力之争，士兵必须综合训练，不可能谁要个小聪明就能取胜。事实上上古罗马军队的指导思想，也明朗说明不可依赖“诡计”。


    这个规律就是参与的人越多，交流水平越高，竞争就越惨烈。等到参与各方都是高水平，一些细微的东西才能左右大局，那才是运气更重要的時候。


    # 来自日课：谁是复杂的现代人


    媊媊妈：现在的考试，为了方便判断，都有标准答案。标准答案与多角度思考习惯是不是有些矛盾？孩子通过12年标准答案的初等教育，多数孩子是不是被迫放弃了多角度思考的习惯？


    万维钢


    深有同感。现代教育是按流水线的办法批量生产“标准人才”，并非是用来培养思想家的，美国也是一样。所以高手都是自学，不能指望学校。学校只是提供了一个交流和社交的场所，有时候老师可以督促一下学习，有时候老师还起反作用。真正的高手是挡不住的，自己读些书，跟志同道合的同学交流交流，也挺好。


    # 日课：攀比动力学


    Zoe：两国影响房价的原因不同，如果按文章提取相同关键词的话都有少数幸运人，都在胜者通吃的环境，也会贫富差距大，攀比也都存在。美国因富人引领时尚的现象在中国也会有吗？或者说也已经有了？那是不是可以理解为，只要适当引导少数富人就可以了呢？


    万维钢


    攀比消费的时尚的确是富人引领。但是别的社会动潮就未必是富人说了算的了，所以我们看有些部门的人以为把上层搞定就能搞定一个地区，就犯了很多错误。


    # 来自日课：富而好礼


    geyun：今天的文章里提到了两位闻名世界的中国古人，感觉万老师不但潮也很古啊。在科学技术突飞猛进日新月异的今天，人们的物质生活也在极大的丰富，人们的精神世界与古人比起来并没有比古人优越，甚至还不如，这是不是人们的迷失呀？


    万维钢


    我上大学的时候，跟几个同学对教学水平不满，就去找系主任谈心。有个同学说，我们用的教材水平不高，你看美国人的教材水平多高啊。系主任说，那是因为我们只引进高水平的美美国教材，美国还有很多水平不高的教材你没看到……


    也许大多数古人都不如我们。


    每个好理论都只能被发明一次，孔子先把结果发表了，后人就只能引用他。为人处世能用上的道理总共就那么多，几位中国圣人都说完了，后来的人再做多少个心理学实验也只能查漏补缺。


    那么为什么恰恰是这几位圣人这么厉害呢？难道他们是天降伟人吗？也不见得。关键点可能在于当时正在发生剧烈的社会变革。用《西方将主幸多久》的说法，就是从一个“低档次国家”（封建分封制），变成“高档次国家”（郡县制、高税收、职业军队）。孔子整天感慨“时代不行了”——其实恰恰因为“时代不行了”，才刺激了他的思考。社会变动一般不是伟人所能直接推动的，但反过来説，社会剧烈变动的时候，人人就容易思考大问题，就容易出伟人。也可説是这些人的运气好。


    其实后来的各种社会、经济和科技变革中，不也产生了大量的思想家吗？只不过孔子他们已经占据了最好的位置（小学生都能学，人人都能懂），所以还是最有名的。康德的水平未必就说不到孔子，但是他的理论太难，不容易推广。还有些现代哲学家的思想高度比康德高很多很多，但是实在太高，无人会，登临意。'
