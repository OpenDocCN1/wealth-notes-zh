  md: '第二个实验是模拟卖地。假设有人想卖一片地，如果这片地是要用来开发成居民区，开发商，也就是买家愿意出的价格就比较低；如果这片地开发成商业用地，买家愿意出的价格就会比较高。所以卖家在要价之前，先问了开发商一个问题：“这块地是开发成居民区还是商业区？”


    买家其实是想做商业区。但是从讨价还价角度，买家不希望卖家知道他们要做商业区，那么买家应该怎么说呢？实验人员把扮演买家的受试者分成三组：


    +   第一组说实话，告诉对方买这块地是为了商业用途；

    第二组直接撒谎，告诉对方这块地将被开发成居民区；

    第三组说的是“误导性的事实”，告诉对方“我们公司一直以来都是做居民区开发”——这句话是对的，他们公司确实一直做居民区开发，只不过打算从这块地开始做商业区开发。


    最后揭露事实，研究者让扮演卖家的受试者对这三组买家进行评价，结果撒谎组和误导事实组得到的评价是一样的。


    对被误导的人来说，用事实误导 = 撒谎。


    那桑德尔的建议是错的吗？也不是。用事实误导并不仅仅是为了给自己找个心理安慰。用事实误导，还是比直接说谎好。


    > 桑德尔说，虽然你误导了别人，但只要你说的话还是实话，你的话就还是值得听的。别人可以仔细分析你说的每一句话，从事实推测真相。可如果 sequest 如果你直接撒谎，你的话就根本不值得一听了。

