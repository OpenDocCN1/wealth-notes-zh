  md: '# 日课115｜谁想成为（文化）亿万富翁（下）


    日课115｜谁想成为(文化)...


    今天咱们继续说泰勒·科文从一个经济学家的角度，对欣赏文化艺术的建议。


    在个人时间非常有限，外面的文化作品几乎无限的情况下，我们的原则就是要以从自己的兴趣出发，高效率地欣赏作品，最终目的是为了完善自我。


    一般的欣赏者对文化作品都比较随意，有时候陪家人看个电视剧，有时候因为朋友推荐读一本书，甚至可能纯粹因为单位发了免费的电影票而用一个晚上的时间看场电影。而你如果想像科文那样成为一个文化百万富翁，你就需要更高的效率，就不得不更无情一点。


    文化是一种很特殊的商品。很多东西并不是你想看，而是别人想让你看的。比如博物馆服务，就与其他服务非常不一样。麦当劳做的一切都是为了让你高兴，而博物馆搞各种展览的主要目的可不是为了取悦参观者——因为你不是博物馆的衣食父母。


    很多博物馆免费参观。即使收费，纽约的大都会艺术博物馆25美元一张门票，这个门票收入相对于展品价值来说也起不到多大作用。科文估计一般博物馆门票收入也就占到运营经费的不到10%。美国博物馆有些小部分收入是政府的拨款，大部分来源则是私人捐赠。这些捐赠者对博物馆如何陈列展品有很大的影响力。可能他们想教化公众，他们想表现自己的文化品位，可能他们把博物馆当成一个高级的炫富手段。


    读书更是如此。有些人写书并不是为读者而写，可能只是想出本书评职称。有人出书是为了体验把作品印出来的成就感。有时候媒体邀请名人写个推荐书单，这些名人往往不是为读者着想推荐几本好书，而是故意说几本高难度和冷门的书，借上报纸的机会彰显自己的阅读品味。


    面对这样的世界，你不狠心一点行吗？


    不去博物馆，又怕错过好东西；真把一本书从头到尾读完，又怕浪费了时间。怎么办呢？最好的办法就是——轻易地开始，无情地放弃。

    2A笔记


    你也可以说这叫“始乱终弃”。


    ![](img/9befb2e4b5878711040fbe72f1245d32_219_0.png)'
