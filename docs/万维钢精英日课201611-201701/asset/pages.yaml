  md: '# 答读者问 | 大众的本质就是低俗的吗？


    # 来自日课：道光年间的注意力商人


    我想冒昧地问一个题外话，就是现在的趋势是往智能时代发展。很多事都可以交由机器负责。那我们现在开始学英语、编程会不会意味着以后这些技能变得一无是处。我问这个问题的主要原因是
    我要出于一个目的来为我学的技能加一份耐心、坚持。因为我每天一边坚持学技能一边又想着以后机器都能完成，我学来干嘛。所以我需要一个人来说一句有分量的见解来全面打消我往这方面想的念头。谢谢！


    万维钢


    英语和编程并非仅仅是工作的技术，更是人的基本素养。人工智能翻译得再好，自己亲身体验byte 英文的感觉，也和看翻译的完全不同。至于说到编程，你要一个“有分量”的见解我就给你一个“有分量”的见解：举重。


    美国曾经有过一场关于“为什么要学习数学”的大讨论，最好的答案来自一个中学数学老师。这位老师说，诚然绝大多数人高中毕业以后就再也用不到解析几何了——但是哪怕你打算将来做律师，你也应该好好学会解析几何。这是因
    为学数学就像在健身房练举重。有谁会在生活中用到举重？它的作用是健身！数学的作用是锻炼大脑！


    编程的作用除了锻炼大脑，还能磨练性情，还能获得把一个东西做成的成就感，还能玩出个人风格。能把程序写好，完成一个大项目的人，生活再差也差不到哪去。别管什么人工智能不人工
    智能，如果你英语真的厉害编程真的很牛，你想干什么工作就可以干什么工作。


    我有个同学说，如果要交朋友的话，除了物理学家，就是程序员。


    是说低俗是大众的，高雅是小众的吗？


    低俗是大众传媒的本质，那大家还是爱看爱评论，甘愿贡献自己的注意力价 值。那么问题来了，到底是低俗是大众传媒的本质，还是大众的本质就是低俗？


    万维钢


    我认为这里面的关键原因是“高雅”的项目都有有一定的门槛。比如围棋，高手看最近“master”连胜多位九段的棋谱可能沉迷到不能自拔的程度，而一个不懂围棋的人就完全无感。再比如喝酒，会喝的人都认为酒好喝，不会喝的还是认为雪碧最好喝。


    大众的问题不在于“本质”不行，而在于没有机会跨过那些门槛。“高雅”的人不是天生基因变异的“小众”，他们也不是在运用意志力抵抗低俗的诱惑，他们只不过幸运地跨过了一些门槛。


    你想想这个性质的确有意思：有些乐趣必须经过学习、训练、挣扎才能体会到。一旦体会到了，就再也不想回去了。


    19笔笔记


    我常常会被游戏吸引注意力。我不喜欢把时间花在游戏上，于是将游戏卸载，等待自然出现吸引注意力的事。我尝试着做其他感兴趣的事，但过一段时间就忍不住把游戏重新下载来玩。如何管理自己的注意力呢？又或者说怎么让重要却不紧急的事拥有更大的吸引力呢？


    万维钢


    那可能因 为你那“重要却不紧急的事”还不够实在。游戏能给人即时的反馈，一分辛苦一分回报。可以从“反馈”和“结果”这两个东西考虑，把那件大事的做法重新设计。


    # 来自日课：奢侈品的逻辑


    老师说“特意调研了一番爱马仕柏金包的受欢迎程度”，想知道调研方法是什么呢？如何提高自己的调研能力？


    万维钢


    写文章用词要正式一点。比如说“Google”这个词，可以替换为“调研”：）


    新做一个产品如何定位？原本计划是做高端产品，无奈价格订高了销量上不去，如果订低价可能销量上去了，可给别人的印象属于低端产品，是否又难以转变？应该如何掌握这个度呢？


    万维钢


    从高端往低端走很容易被人接受，一开始是低端就没法高端了。一个好办法可能是先用低端的东西进入市场， 等到发展壮大以后，再推一个高端款。这个高端款最好连品牌名字都换掉。就如
    同“雷克萨斯”，本来就是丰田公司 的东西，但是不能叫丰田，因为丰田这个名字已经是低端的了，所以连车标、品牌名都得换。将来自比亚迪要想做高端，就应该确保那辆车身上绝对不出现“比亚迪”这三个字。


    # 来自日课：广告的最高境界


    我并不认为如今的社会是商业的副产品。在没有发明货币还是以物换物的 时代，那时候存不存在社会？商业性并不明显 的时代有没有社会呢？


    万维钢


    可以说得更严谨一点——现代社会的很多特性，是商业的副产品。原话，大多数读者明白它是什么意思；非要这么严谨，语言就少了点分量。


    厉老师对那些发明出东西却没有改变人们需求的情况怎么看，比如多年前的 google wave。


    万维钢


    赌输了。发明创造有点像赌博，更确切地说有点像生物进化的“随机变异”，很容易就过不去，但是你不尝试就永远不知道。'
