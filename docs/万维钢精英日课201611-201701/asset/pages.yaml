    没有固定标准，不等于没有“缺点”和“优点”的划分。比如欺负同学、抢东西，就是明显的缺点，必须从小治理。“自由”，是个特别不好把握的东西，小孩的某些自由不是真自由，其实是自己欲望的奴隶。“不能按照一个模子批量生产”，不等于“不管”。


    卢承宗Newsun：所以，最终给到我们的Recomandation是：现在，发现您的优势？还是尽人事，安天命？另外，对于日常生活和工作中的各种“标准”，我们应该如何看待？总觉得，“每个人都是不一样的个体”是听着大道理的话，但是对于生活怎么落地？这是一个困惑。确实有些道理，只能知道，但是对于人的行为没有落地建议的，不知道这个是不是其中之一。


    # 万维钢


    这些道理只是拆墙，并没有给出针对不同人的具体建议。但我以为，一个强者得有两个精神：第一敢于为自己负责，不依赖不模仿；第二，敢于大胆尝试。有了这两个精神，就可以自己在生活中取得经验和智慧。书，只能起一个启发和提醒的作用。


    知行合一-33216320：万老师，我自己最近开了一个公众号，主要是写我的一些感想并把从学习中总结的认知与行动分享给别人，但是文章中肯定是要给出的方法和建议，就像你之前说的文章中也有很多的方法，这样的做法和今天说的给出标准是不是成了悖论，怎么看待大众给出的标准与每个人不同成长所需要的特殊情景的差别呢？


    # 万维钢


    让读者把这些都理解成仅供参考的案例和建议也就行了。阅读文章就如同看别人的棋谱，总要有有点举一反三、具体问题具体分析的精神，岂能生搬硬套。读的东西多了，潜移默化之中，琢磨和纠结之中，阅读品味越来越高，思想水平就能慢慢提高。


    我们写文章不是写人生指南，更不是产品使用说明书，能提供一点启发就很不错了。……我甚至觉得，一篇文章最大的价值其实是有趣。有趣，有阅读愉悦感，能让人读得下去，这个要求比“有用”要高得多。


    拿来就能用，保证有用的文章，那是菜谱。


