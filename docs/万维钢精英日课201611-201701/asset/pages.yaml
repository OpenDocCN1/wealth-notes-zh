  md: '当时帕西诺只是个无名的三线演员


    制片方本想选个名角来演麦克，可是导演科波拉非得用新人


    其实科波拉自己就是个新人，一个三十多岁的年轻导演，敢跟制片方这么叫板，还成功了的，太少了


    制片方选的几个名角都不在档期，只好妥协


    导演想要一个长得就像西西里人的新人，帕西诺正好合适


    原著中麦克戏份并没有这么重要，是导演改了剧本，让帕西诺几乎成了全片的主演


    这样的机会，有几个新人敢指望？如果没有《教父》，帕西诺还会是今天的帕西诺吗？我想到一个不知在哪看到的典故：人说布拉德·皮特长得帅演技好，可是一个电影大传说，像皮特这么帅的人，我出门到洛杉矶街头随便就能找到二十个——他们只不过运气没那么好而已。


    在人生的早期，关键节点上，好运气就有这么大的放大效应。


    而且这还不是个例，这还有大规模统计的效应。


    加拿大职业冰球运动员，有40%是出生在一月、二月和三月，只有10%出生在十月、十一月和十二月，为什么？因为他们小时候参加少年冰球队选材的时候是按照年龄分组，而早出生的孩子在同一年龄段有整整一年的身体优势。


    冰球从一月一日划线，小孩上学则是从九月份划线，那么夏天出生的小孩一入学就是班里面年龄最小的，这就吃亏了。年龄大的孩子从小就被潜移默化了领导力，这就是为什么美国公司，出生在六月和七月的CEO，人数比平均值低了三分之一。


    经济学术论文署名，一般把所有作者按照姓氏的第一个字母排列——按理说内行都知道这个规矩，可是为什么，那些第一个字母在字母表中越靠前的助理教授们，会越早被提升为正教授呢？为什么针对心理学教授的统计就没有这个现象？因为心理学论文署名不按字母顺序。


    所以说，如果你出生的月份正好压线，你又正好姓“安”，你就赢了人生的起跑线。可如果是你想出类拔萃，你还得再有几个这样的好运气才行。


    # 2.运气可以累加


    弗兰克在书中讲了很多自己的人生经历，在我看来简直是传奇一般。可以说是一系列——不是一次两次，是一系列——的好运气，他才获得了康奈尔大学经济系的正教授职位，他才有机会搞那么多有趣的研究，写那么多专栏文章，我们才能看到他这本书。他甚至面临过两次死亡危险，也是因为非常不可能发生的巧合才让他转危为安！


    不过弗兰克显然不是世界上运气最好的人。


    比尔·盖茨才是。我们来看看运气在盖茨的早期生涯中是怎么起作用的：


    +   1. 盖茨正好出生在1955年。如果晚生几年，他的青年时代就赶不上个人电脑的第一波浪潮；如果早生几年，那时候他就太老了。

    2. 盖茨家境很好，更好的是他上的那所私立高中，是当时全美唯一一个给学生提供免费的、无限的、能够即时看到运算结果的计算机终端的中学——那时候绝大多数大学还没有这个条件。没有这个“即时反馈”的计算机终端，少年盖茨就没法“刻意练习”那么好的编程技术。

    3. 盖茨退学创业的时候，正好赶上IBM需要个人电脑的操作系统。

    4. IBM本来想从别的公司买操作系统，但是很偶然地没谈成。

    5. 盖茨的公司去收购一个现有的操作系统——QDOS，对方公司那人iz不值行，居然五万美元就卖给他们了——这才有了MS-DOS，未来世界首富的第一桶金。


    哪怕以上这些事中有一件不成立，盖茨也绝对成不了世界首富。


    这种运气，等于连抛20次硬币，次次都是正面朝上。你可能会说这种概率也太小了，怎么可能发生——对每一个具体的人来说很难发生，但是地球上这么多人，其中必然能找到一个人，在他身上就发生了。这就好比买彩票中大奖的概率很小，但是总会有人中大奖一样。


    当然我们不是说盖茨全靠运气成功，天赋和努力就不重要。我们说的是，在某些领域，光有天赋和努力远远不够。


    # 3.竞争越激烈，运气越重要


    全美高中棒球联盟，一共有15,000个球队，其中有450,000个高中生在打棒球。每年有140,000个高中生有资格参加职业球队的选拔，而最后被选中的只有1500人。可是美国职业棒球大联盟，总共只有30个球队，每个球队只能报名25人，那么每年能给这1500个新人提供的位置又能有几个呢？


    所以有的教育专家说人生是一场长跑，不要计较孩子能不能赢起跑线——我敢说他家肯定没有踢职业体育的孩子。


    像职业体育这种竞争激烈，淘汰率极高的项目，你不但要赢起跑线，而且必须接连不断地一直赢，才能获得一个哪怕是在正式比赛上场的机会。也许你家孩子打球像邻居家孩子一样好，甚至还要更好，但是因为非常偶然的原因，一次选拔没选上……那你很可能就没有下一次了。


    原因非常简单：高手太多了。


    弗兰克介绍了一个计算机模拟的实验。假设有这么一种比赛，决定胜负的因素中，天赋和努力占95%，运气只占5%，你猜最后取胜的是什么人？——结果是只要参赛者足够多，最后胜出的都是运气特别好的人。


    这是因为比赛中足够多的高手，他们的天赋和努力值都非常高，那么这些人之间又比什么呢？当然是比运气。而现在的职业体育比赛，就是如此。没有天赋和努力的根本就上不了场。弗兰克统计了短跑项目的男女共八个世界纪录，其中七个是在顺风时候创造的，一个是无风，没有一个是逆风。


    > “机遇只偏爱有准备的头脑”，这句话说得当然好，但现实问题是有准备的头脑太多，机遇太少。


    如果你仅仅凭借天赋和努力就能在一个领域取得了不起的成就，那只能说明你这个领域不够热门，没有吸引到太多跟你一样有天赋，跟你一样努力的人。


    再者，难道天赋不也是一种运气吗？别忘了智商主要是遗传的。如果一个领域连天赋都不需要，仅仅努力就能有所成就——那只说明这个领域……是个非常低端的领域。


    我看，弗兰克这本书，其实是写给幸运者的书。我们未必非得参加那种高水平的竞争，但是了解一下那种竞争是什么情形，也是一种趣味……而且未必一点用处都没有。


    那么那些已经非常幸运的人，他们面临的竞争，是个什么局面呢？咱们本周五再继续说。


