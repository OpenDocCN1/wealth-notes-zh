  md: '# 日课059 | 《混乱》解读1:任意的震动


    日课059 | 《混乱》解读1:...


    今天开始，我们要连载解读一本新书，蒂姆·哈福德十月份刚刚出版的Messy: The Power of Disorder to Transform Our Lives（混乱：改变我们生活的无序力量）。


    ![](img/9befb2e4b5878711040fbe72f1245d32_19_0.png)


    蒂姆·哈福德是经济学家出身，后来专职写作，成为金融时报的专栏作家，因为十多年前的 一本《卧底经济学》而被中国读者熟悉。


    最初，他擅长的是把专业的经济学知识用通俗语言告诉读者。后来，他通过主动调研，开始提出自己的思想，并且又写了两本书。那两本书其实都不错，个人化的观点一本比一本突出，但是在中国的影响力都不如《卧底经济学》。


    ![](img/9befb2e4b5878711040fbe72f1245d32_19_1.png)


    现在距离哈福德上一次出书，已经过去了五年。


    这本《混乱》，刚一出来就大获好评。《纽约时报》、《经济学家》的书评都不在话下，特别是值得一提的是，著名经济学家，同时也可能是目前世界上读书最多的人之一，Tyler
    Cowen说，这是哈福德最好，也是最深刻的书。


    如果只看书名，这本书大概说的是，如果一个人桌子上的物品都摆放整齐，文档都归类整理了，生活井井有条，他可能就没有什么创造力。反过来来说，大人物 的桌面一向都很
    混乱，似乎混乱和邋遢的风格更能激发创造力，做事反而可能更有效率。


    > ——这点见识，我二十五年前就懂。这可配不上“深刻”二字。


    哈福德这本书，平心而论，写的并不算特别通俗易懂。我本来买了有声书，想以两倍速播放快速听完，结果发现跟不上。哈福德并不像格拉德威尔那样热衷于讲故事，他这本书的思维密集度相当高，左一个研究右一个案例，才说几句集成电路设计优化算法，紧接着就是自行车运动员与国际自行车联盟的一番恩怨。我就不得不耐下心来仔细阅读，才能跟上思路。


    哈福德到底说了什么“深刻”的东西呢？


    # 1.专注力和多动症


    我们这一帮人，包括《罗辑思维》的粉丝，和“得到”的读者，最关心的问题，用一句话概括，大约是：怎么把事做好。有些人可能会说你们过分实用主义了，你怎么不去关心一下东亚某国的民主问题呢——我们不是不关心，但我们首先是做事的人，不是说话的人。


    禅宗有“渐悟”和“顿悟”，爱迪生的方法论有“汗水”和“灵感”，心理学家的理论有“刻意练习”和“天才”。前者是笨功夫，后者比较神秘化。


    过去这十几年，关于做事的学问，各种研究，各种文章和书籍，主流的思想，是强调笨功夫。比如下面这些思想，可能我们都非常熟悉了：


    +   - 专注力：人脑不适合多任务，每次应该只做一件事情；

    - 自控力：能管住自己，该做什么事的时候就能去做什么事，这个能力比智商更有用；

    - 习惯的力量：做正确的事形成习惯，就没有那么痛苦了；

    - 任务列表工作法：做事不是行为艺术，得有明确的目标和结果评估，要做就要把事情做完；

    - 极简式生活：为了专注于大事，必须排除一切不必要的干扰

    - ……


    这些思想都很好。我敢说一个人如果能做到以上这些，他的工作水平和生活水平肯定超过绝大多数人。更重要的是，这些思想废除了我们对“天才”和“灵感”的迷信式的追求，傻乎乎地坐等灵感出现，肯定不如老老实实勤学苦练。


    但是你也不得不承认，这些方法都有点机械化的特征，似乎比较适合做“学习”和“执行任务”之类的事情。那些大师级的艺术家和科学家，乃至一个任何领域的决策者，在以上这些功夫之外，肯定还有一点别的东西。


    以我之见，哈福德这本书，关注的就是这点“别的东西”。这个“别的东西”背后的哲学，可就完全不一样了，但是它并不神秘，也是可以研究，可以学习的。


    书中提到一个哈佛大学的研究。研究者选了一群大学生——注意，不是普通 的大学生，是哈佛大学的学生——给他们做“排除干扰能力”的测试。也就是说，假设你在一个嘈杂的餐厅里跟人聊天，你能不能不<|start|>受旁边人的说话声、各种噪音、各种情景的打扰，专注于眼前的对话？


    其中有些学生的抗干扰能力非常差。旁边有点风吹草动，他马上走神。然而研究发现，这些人的创造力反而更强！这些哈佛学生里颇有一些能人，有的已经出版了小说，有的写的剧本上演了，还被全国性报刊点评，有的
    有专利。根据这些硬指标 ，在25个有超强创造力的学生中，有22人的抗干扰能力是弱和比较弱的。


    另有一项研究发现，那些成年以后还患有“注意缺乏多动障碍”症（ADHD，俗称'
