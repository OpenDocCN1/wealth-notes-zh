    manganese 这点时间内说清楚你的方案。


    第三，在白板上讨论商业计划，要使用粗的马克笔。最初的计划必须抓住重点！笔画越粗，对你的思维越有利，越能逼着你去考虑大局。如果你用圆珠笔，无形之中就会陷入关注细节的思维模式。


