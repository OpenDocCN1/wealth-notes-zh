  md: '# 答读者问｜有些问题我也想知道答案


    # 1.来自日课：数学家告诉你怎样慢慢变老


    立正稍息：尽管书不如无书，过往万老师用知识给我们更新了很多观念，但这次我觉得很奇怪：具体是，案例中关于去餐厅吃饭，一个餐厅去过两次，基廷斯指数0.7以上不太科学，因为按照概率常识，也是0.5吧？


    拙自当中：能不能讲一下基廷斯指数是怎么算的。很多数学知识不知怎么应用，而有了具体问题又不知道怎么计算。


    万维钢


    基廷斯指数的算法非常复杂，这就是为什么要弄个表。不过维基百科上（搜索Gittins index）就有对具体算法相关的介绍。


    需要特别说一句，基廷斯指数不是“win的概率”。我们使用的时候要仅仅把它当做一个数字，这个数字只有在不同选项进行比较大小的时候才有意义。一个去过两次，一好一坏的餐馆的基廷斯指数是0.7844，而一个去过4次，2好2坏的餐馆的基廷斯指数是0.7308——为什么前者更高？因为测量次数越少，就越不准确，就越有惊喜的可能。


    这个道理其实挺有用的。比如你是一个球队经理，你队里有个队员，你观察了他一个赛季，一半的时间表现好，一半不好。转会市场上有一个新人，只打过两场比赛，一场好，一场不好。那么哪怕排除两人的年龄因素，你也应该更关注这个新人的表现，叫他来试训一下——因为你已经知道老队员的斤两了，而这个新人却有可能给你惊喜。


    # 2.来自日课：中美好家长都为孩子做些什么


    唯静放至：如果家长去学校当志愿者，孩子的学习成绩就会 improves；如果不去当志愿者，孩子的协作能力就会更差。所以嘞～这里面的度怎么把握啊？期待数学家们给出量化的解决方案，不然当家长的就只能靠直觉了。


    万维钢


    不能这么说！PISA研究结果只是说，统计表明，去当志愿者的家庭的孩子比不去当志愿者的家庭孩子成绩更差。这只是一个统计上的相关性，并不能说明因果性。也许是差生的家长更“愿意”去当志愿者，也许不去的话孩子就会更差。再者，所谓“差”，其实也没差多少。我认为对这个结果最好的总结是“没有任何证据表明当志愿者对提升你孩子的学习成绩有好处。”


    当然，这里里面还是有取舍，当志愿者至少是个花时间的事儿。但钢琴课更花时间。取舍是数学，但我们那篇文章可以在你取舍之前，介绍一下志愿者的好处，帮助决策。


    # 3.来自日课：人工智能，能婴儿乎？


    高源：关于人工智能的研究有点个人的想法不知道对不对，请万老师指教。1.智能是按照人的标准定义的，那么人是生物的一种，生物的智能就是人类智能的基础。所以研究人工智能的最初是不是应该从生物的最初级智能起步呢？就是不直接考虑想人一样思考，而是考虑想初级生物一样感知。2.智能是像人一样用大脑思考，人脑的研究还没有达到一定的深度，所以人脑的研究达到一定程度，人工智能也就会有所突破了？


    赵宇新：通过构建类似人类的神经网络可以模拟出人类的行为吗？对于人类神经的研究已经有了比较确切的结果了吗？


    万维钢


