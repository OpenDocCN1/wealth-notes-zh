  md: '首创者是CBS。当时有一家企业濒临绝境，提出强烈要求，不管花多少钱，一定要弄个大新闻！CBS就推出了一个叫“64,000美元的问题”的问答节目。参赛者都是普通人，问题都是老百姓喜闻乐见的小百科知识。每个人的初始奖金是64美元，每答对一题奖金翻倍式的往上涨，但是一旦答错就拿不到一分钱。结果收视非常火爆，引领了后世无数效仿者。


    当时就有人研究，为什么观众爱看这种真人秀？答案是三个因素：


    +   1. 没有剧本，是真实的悬念；

    2. 选手都是普通人，观众容易产生情感共鸣；

    3. 拨动了观众内心深处对金钱的贪婪。


    我们可以想这三点。一直到今天，中国的电视真人秀节目也只做到了前面两点！中国节目里从来没给过那么大尺度的奖金，最多也就送个出国旅游而已。这可能是因为政府监管部门害怕直接谈钱太刺激，不想让拜金主义污染中国观众的思想吧。


    但是美国电视人明白，拜金思想非常好使。“64,000美元的问题”节目实在太受欢迎，后来奖金干脆翻了四倍，曾有一个十岁小孩拿走了224,000美元的奖金……相当于今天的180万美元。


    到五十年代末，美国观众平均每天看电视的时间接近五个小时。


    人们渐渐产生了逆反心理。


    # 3.观众的反击


    每天老老实实看五个小时充满广告的节目，确实太荒唐了。很快就有越来越多的人从对电视的痴迷之中清醒过来。这时候恰好有个高科技公司，推出了一个反电视广告的利器——


    # 遥控器。


    遥控器当然并不能屏蔽广告，它的功能只有两个：静音，和换台……而且当时总共有三个台。然而就是这么一点点对自己注意力的掌控感，打响了观众反击电视台的第一枪！你一播广告，我就换台，实在不行可以静音！


    然后电视台节节败退。


    # | 我的评论


    回顾美国电视业的发展史，有一个特点值得咱中国人思考，那就是美国政府在其中几乎没有起到什么作用。我看书中提及的政府唯一一次发挥作用，就是选秀问答节目中发现造假行为，国会派出调查团调查此事。而在麦卡锡事件中，反而是电视台打赢了一场对政客的战役。


    广告泛滥的时候，电视剧万人空巷的时候，真人秀过热的时候，美国政府都没有进行“宏观调控”。


    我看真正能推动电视业发展的外部力量，其实是技术进步。如果电视机的价格一直是在5000美元，电视节目就没有这么大的影响力；如果遥控器从未被发明，观众就不会有如此强大的主导权；如果没有无线电视，就不会有这么多电视频道。


    # | 由此得到


    今天你是主角，明天我就得当英雄。今天你弄个大新闻，明天我就敢放个大招。电视史给我们的最大教训，就是谁都不会永远自甘被动！'
