  md: '# 日课065 | 学点领导魅力


    日课065 | 学点领导魅力


    今天我们说说“领导魅力”。我觉得你应该学点领导魅力。


    选总统也好，拥戴CEO也好，人们心目中的“领袖人物”，不但得有“能力”，还得有“魅力”。我们都知道“领导魅力”这个东西肯定是真实存在的，但它到底是什么呢？


    九月份的《大西洋月刊》上有篇文章，The Charisma Effect: how to bend people to your will（魅力效应：如何让别人服从你的意志），作者
    Matthew Hutson。这篇文章其实是一篇研究综述，讨论了到目前为止，科学家们是怎么看领导魅力的。


    首先，领导魅力不等于领导力。领导力，是一个领导的……领导能力，他得确实有能耐把人领导好，这大概涉及到决策能力、知人善任的能力、团结人的能力等等。不过呢，领导力到底是什么东西，现在学术界也在争论不休，我们暂且先姑且认为领导力是个真功夫和硬实力。


    而领导魅力，并不是一种实际的工作能力，而是一种精神作用。就是你看到一个人的外表、姿态、一鞠一笑，你就觉得他像是一个领导者——但他实际上会不会领导还不一定。事实上，世人公认领导魅力指数最高的几个人是曼德拉、甘地和马丁·路德·金等人，这些人基本上都是精神领袖。


    科学家的第一个判断，就是我们必须把领导魅力和领导力分开。


    再者，领导魅力似乎不是智商，也不是一个人的道德水准有多高，大概也不是颜值——一个漂亮、聪明显又老实的好人大概未必具有领导魅力。很长时间内科学家也搞不清“领导魅力”里面的关键配方到底是什么，甚至专门管它叫“X因子（X
    factor）”，代表一种未知的东西。仅供社群内部学习交流，请预觉后删除，入社群加微信：ccdd660


    近年来，才有人陆续提出对于领导魅力的解释。现在人们比较接受的一个说法，是从进化心理学角度，说所谓的领导魅力，就是他能让他的追随者相信，他能让更多的人参与到合作中来，的能力。这句话说得有点绕口，说白了，领导魅力，就是能让人感觉，他能够促进人与人之间合作。


    像马丁·路德·金，作为民权运动的领导人，其实各种活动的组织策划都是身边另有高人安排的，他本人最大的作用就是演讲厉害！别人听一场他的演讲，就愿意追随他去做事，这就是最纯粹的领导魅力。


    实验中发现，如果人们对一个人的领导魅力评价比较高，那么他号召大家捐款的时候，大家都更愿意捐款，也更愿意捐出更多的钱。一个领导魅力指数高的人动员你去和陌生人合作，你会更愿意去和陌生人合作。


    如此说来，领导魅力最关键的用处就是在人们彼此不了解的情况下，他能快速动员一帮人行动起来。哪怕这个人没有什么实际本事，可是他往那儿一站你就愿意听他的，这难道不是一种能力吗？


    这种能力，值得拥有。


    什么样的人有领导魅力？《大西洋月刊》这篇文章介绍了几个研究结果，我们列举一下：


    +   身高很重要。人们天生更愿意追随长得高的人。


    +   精神要充沛。你要是没睡好，精神萎靡地往那儿一站，或者动不动就表现得很劳累，肯定没有领导魅力。


    +   反应得快。问你一个问题，你能快速回答，或者面临某种突发状况，你能马上想出应对措施，这种能力其实比智商和性格更管用。


    +   最好带有一点神秘感。比如你带队取得好成绩了，记者采访，说你为啥能成功呢？你就让记者写这是因为自己有远见、对局势有深刻的理解——这些虚无缥缈的东西，你的领导魅力就会增加。如果你说是因为自己这段时间工作一直加班加点，你的领导魅力就会减分。


    如此说来，领导魅力也许是可操作的。2012年有人做实验，把一些企业的中层管理人员和MBA班的学生召集起来，对他们进行了为期好几天、时长达到30-90个小时的领导魅力培训。研究者在培训一个月前，和培训三个月以后，分别对这些人的同事们进行了采访，结果发现周围人对他们“领导魅力”的评价都明显提高了。


    也就是说，领导魅力不但是可以学的，而且学成之后效果至少能持续三个月！


    这篇文章现在已经非常有名了，我把标题截图像在下面，感兴趣的读者可以细研读。


    ![](img/9befb2e4b5878711040fbe72f1245d32_55_0.png)


    那么这个领导魅力培训班里都讲了什么呢？研究者是专门找了一些能够提升领导魅力的策略，对学员进行了冲击培训。这些策略挺有意思，这里咱们简单说几个。


    你讲话要善于打比方，用类比和比喻把一个道理讲清楚。一方面这样可以帮助下属理解，另一方面这也能让别人觉得你很聪明，通常都是聪明人才会打比方。


    你要善于讲故事，尤其是讲自己以前的故事。奥巴马就非常擅长讲故事，动不动就来一段自己小时候的遭遇。你的故事不见得非得是真实发生的，编造的也管用。也许一场演讲下来，那些道理大家一个都没有记住，但是发生在你身上的故事会给他们留下深刻的印象。


    你要善于使用设问句和反问句。这个方法可以调动听众的注意力。


    上面三点看起来好像都是演讲的技巧，但增加领导魅力的策略和一般的演讲技巧不同，还有更高的要求——


    你的动员讲话要占领道德制高点，要能够调动所有人的感情。比如“我知道我们公司现在处于一个困难时期，每个人都很担心，别人都说我们的商业模式注定失败！可我们就是要坚持这么做，因为我们知道我们是对的！”


    你需要制定一个很高的目标，并且表达对完成这一目标的信心。就像特朗普说的“要让美国再次伟大！”“我肯定要建议这个星际边…'
