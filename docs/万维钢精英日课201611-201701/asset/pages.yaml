    如果一个毫无经验的学生，想要一年自己挣数十万元，通过宣传传播能做到吗？利用什么传播方式，能够短期就见成效呢？而且传播本人还是没有颜值也没有什么才华，可以色取人。什么可以作为资本传播出售呢？


