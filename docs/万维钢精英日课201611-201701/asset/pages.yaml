    人体新陈代谢机制，就给人脑提供了一个能量限制，想太多了就累，相当于保险丝。


    自省：看了万老师分享的这篇文章，对我来说挺震惊的，因为我就是一个过度拟合的人。之前由于工作岗位原因会有绩效考核和执行制度的内容，曾经我会因为未达到工作计划完成率而焦虑，从而纠结于细节之中而不自知。也曾出现过花费很多精力展现的PPT而被领导不屑一顾，我之前一直认为对每个细节分析的越透彻，能想到的因素越多，那么得到的结果就越好。也曾经一直弄不明白，无论你如何用心的准备了什么内容，领导总能问倒你。但是，我还是有个疑问，如何掌握这个度呢？请用数据说话！细节决定成败！这些都是有道理的呀，我们不经过深思熟虑如何得到聚焦？没有聚焦哪有抓住了问题的核心和重点？是否可以采取两者结合呢？'
