  md: '些东西构成的。我们对智能的定义，也仅仅是站在人类角度的“智能”——也存在一种事物，它的“智能”是人类无法理解的，但是同样“复杂”。


    计算不可约性其实揭示了自然界一个最大的秘密：在一定的复杂程度之上，所有的复杂都是等价的。人类的生命、智能实际上和自然界的一阵风、一堆原子的复杂度是同等的！


    从抽象的角度来看，我们并不能认为哪件事情物一定比另一件事情物更加高级。比如你观测到一个电磁信号，你能判断它是天然的还是外星人故意发给我们的吗？本质上不能。


    天然的信号，比如脉冲星的信号，也可以很 mp 有规律。人为的信号，也可以看上去很随机——比如现在手机信号就被压缩到几乎是随机信号的程度了。


    所有的复杂都是等价的。如果我们用一组数字信息代表所有人类行为，一组数字信息代表某个外星文明的行为，一组数字信息代表一盒子空气分子的行为——那么沃尔夫勒姆说，从抽象的学术角度，你根本无法判断哪组信息更高级。


    沃尔夫勒姆说，我们之所以觉得我们的信息比一堆空气分子更有价值，其实只不过是历史的产物。


    这听起来非常抽象，我编个故事你就明白了。有一个人，从小在农村长大，身上有些随地吐痰和吃饭发出很大响声之类的小毛病。但是他聪明而且勤奋，一番拼搏之后成为百万富翁，并且跻身上流社会。他认为自己身上的小毛病都是历史的产物，需要加以改正，成为一个真正的现代人。于是现在的他非常懂得社交礼仪，还对红酒很有品位。


    有一天，他遇见了一位禅师，就问禅师：“我现在已经不再是过去农村的穷小孩了，我改掉了历史在我身上留下的痕迹，是上层社会的一员，我是不是更像个纯粹的人了？”


    禅师回答：“你所说的上层社会的习惯，吃西餐和喝红酒的礼仪，其实是欧洲历史的产物，你并没有摆脱历史，你只是换了一种历史罢了。”


    沃尔夫勒姆说，排除历史的因素，人类文明并不比一袋空气高级。


    这就引出了一个结论：指引我们行动方向的，我们的目的和价值观，恰恰是我们的历史包袱。


    现在人类行为很大程度上是以生存为目的——想要战胜疾病、繁衍后代，住更大的房子，开更好的汽车，享受更优越的生活。但如果将来技术迅速进步，人类长生不老，这些欲望都能得到满足，你不需要再繁衍后代，房子车子的意义也荡然无存，并实现了最大限度的自由，那人类生活的目何在？


    你看着算法宇宙中的各种算法，就如同<|message|>一个已经没有欲望的神仙看着自己法宝库里的一大堆法宝，他要这些法宝还有什么用呢？他选择用哪个法宝，又该用什么标准呢？


    沃尔夫勒姆说，到那个时候，人类就只能从历史中寻找意义。


    限制彻底不存在以后，当你回想起过去有限制条件的历史，你可能会羡慕当初那种还需要为生计奔波，被生理条件限制的生活，你甚至可能想模仿他们的生活。


    就好像现在有的人，会去重走一遍自己父母当初走过的路，体验父辈的生活。他也许会问：今天的我是从哪里来的？我要以家族的历史为荣。


    你作为一个未来人，也许会特别沉迷于回望历史。


    而回访历史，人们能回到的最佳时代，就是二十一世纪的今天。在此之前的生存并没有很好的历史记录，而再往未来，人类的限制就更少，没有了限制的生活也了无乐趣。只有我们所处的这个时代，才同时具备详细记录，还保留了生存限制。


    我们是人类历史中极为特殊的一代。


    沃尔夫勒姆说，我们这一代人的使命，除了为将来人类的技术进步做铺垫之外，还有一个目的，就是记录下此时的生活，为将来人类体验受限制的生活提供样本。


    你想想看。我们今天这个时代是一个充满目的的时代。每个人都有劲头，像我们得到和罗辑思维的小伙伴们，每天就琢磨如何能把事情做得更好。未来的人类将会羡慕今天这种充满限制，但同时又很有目标的生活！所以，我们应该通过多种途径记录自己的生活，比如发朋友圈、写文章、拍视频，让未来的人在回访历史的时候能够有充分的数据。


    所以……那你就写下自己的日课，然后再把这篇文章发到朋友圈，让未来的人……羡慕我们吧。


