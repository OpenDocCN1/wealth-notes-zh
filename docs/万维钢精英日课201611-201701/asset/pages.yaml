  md: '# 日课061 | 《混乱》解读 3:刻意创新的办公室


    今天我们继续说蒂姆·哈福德的《混乱》。


    前面两次连载之后，想必你已经了解，为什么“混乱”对创新有利 —— 一定程度的分心可以带来意外的灵感，而人与人之间的交流，特别是与不熟悉的人的交流，可以促进团队的判断决策能力，和创新能力。


    那么根据这个精神，假设让你去设计一个创新公司的办公楼，不限成本，只问创意，唯一目的就是促进创新，你会怎么设计呢？


    我先来提供两个非常有名，引领了时尚的设计。


    # 1.两种办公楼


    既然是创新公司，它的办公楼就得有点现代感，下面这个办公楼就体现了现代艺术的审美。空间巨大，大量使用直线，有一种几何式的抽象感，一眼望去只有钢材、玻璃和木板，没有任何多余的装饰。


    这种风格已经不仅仅是简洁，而是极简的简洁。


    ![](img/9befb2e4b5878711040fbe72f1245d32_27_0.png)


    另一个风格的办公楼则是下面这张图。也很有现代感，但是跟前面的风格完全是 ​​​反其道而行之。各种杂乱的装饰，什么颜色都有，楼梯和过道都充满个性。实际上图中还只是办公楼的一角，整个办公楼其实就像是个游乐场，各种怪异物件遍布其中，连男卫生间都能跟你开个玩笑。


    这是一种强迫你在办公室里玩的设计。


    ![](img/9befb2e4b5878711040fbe72f1245d32_27_1.png)


    你猜哪个设计的效果好呢？


    公布答案。后面这个办公楼，属于著名广告公司 Chiat/Day，该公司因为1984年给苹果公司拍摄的一则广告闻名世界 —— 那是在他们搬进这个怪异的办公楼之前。这个办公楼是公司创始人Jay
    Chiat的主意，1994年在洛杉矶落成。Chiat的设想是用一个真正代表二十一世纪创新公司风格的大楼来刺激公司的发展，结果事与愿违。


    没错，办公楼在当时引起轰动，人们纷纷赞叹说这才是创新的样子！唯一问题是在里面工作并不舒服。员工在里面呆的时间长了真的扛不住起来，各种无谓的争执，各种抱怨，管理层搞政治，底层员工反叛……再加上Chiat的高压式管理，公司业绩直线下降。


    可能这种设计的风水不太好吧。


    而前面那个楼，是皮克斯动画工作室的总部，而且还是乔布斯亲自设计 —— 现在它就叫“乔布斯大楼”。极简的现代感其实是乔布斯的一贯风格，我们看苹果的各种产品，从手机、电脑到软件、到包装盒，都是这个风格。这是一个深受欢迎的风格！


    但是乔布斯也犯了一个错误。他非常了解“陌生人观点碰撞能促进创新”这个思想，所以他在设计办公楼的时候，就想尽办法让公司不同部门的人员能够有机交流。他的一个绝招，是给整个大楼只设计了两个卫生间（一男一女），并且是安排在一楼大厅里。


    乔布斯想，这样一来，任何人上厕所都必须经过一楼大厅 —— 你就算再内向，这回去也得在上厕所途中跟人聊几句。


    这个设计遭到了全体员工的强烈不满。


    # 2.真正的创新大楼


    以前清华老校长梅贻琦有句名言，大意是说大学之所以叫大学，不是因为里面有大楼，而是因为里面有大师。现在那些一心想争取名校的大学校长们想起这句话来，不知会不会略感惭愧。那么如果一个大学想要容纳大师，甚至想要培养大师，它到底需要什么样的的大楼呢？


    可能梅贻琦说得对，大师并不需要漂亮的大楼。


    哈福德在书中说，近代大学里产生了最多创新成果，培养了最多大师的一个大楼，是下面这个楼。


    ![](img/9befb2e4b5878711040fbe72f1245d32_27_2.png)


    知识众筹社群微信：ccdd6601


    这就是著名的麻省理工学院20号楼。这个楼除了面积大，基本上没有什么设计 —— 其实它是1943年，学校为了容纳军方的雷达实验室项目而临时建的，随便找了个建筑系的学生，用一下午就设计出来了。原本计划用一年就拆除，结果一直用到了1998年。


    雷达实验室，为美国打赢二战提供了关键的技术，而且还孕育了九位诺贝尔奖得主。军方项目撤走以后，20号楼里入住了麻省理工学院的各种人马。这里是一个著名黑客俱乐部的诞生地，是一种电脑视频游戏的诞生地，有人在这里完成了认知科学的关键论文，就连著名语言学家和在派政治学家，乔姆斯基，都在这里长期办公。这里还孕育了博士音响公司和DEC公司。


    20号楼很难看，而且里面设施简陋很不舒服，但是大师们特别喜欢待在这里。后来20号楼被拆了，麻省理工学院给大师们建了一个新楼，大师们并不欢迎。


    20号楼好在哪呢？


    首先，它的确符合乔布斯的要求，促进了不同学科大师的横向交流。大楼的布局 —— 其实现在没有什么布局 —— 就是不按学科安排，办公室分布很凌乱。'
