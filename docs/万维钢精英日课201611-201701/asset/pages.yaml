    中国家长在这方面做的很不够，中 国式教育有点个人顾个人的意思。这大概也是为什么美国大部分亚裔学生在学校的表现非常好，但在工作中就很难获得高位。他们是规则的适应者而不是改变者，有强烈的打工者心态，缺乏主人翁精神和改变世界的愿望，这很可能和从小的家庭教育并不关注公共事务有关。


