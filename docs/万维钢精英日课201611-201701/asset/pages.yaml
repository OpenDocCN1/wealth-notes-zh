    and Colonies Can Make Us Better at Communicating, Decision Making, and Getting
    Things Done），作者是彼得·米勒（Peter Miller）


    ![](img/9befb2e4b5878711040fbe72f1245d32_171_0.png)


    我们一般设想，像蚂蚁、蜜蜂这样的低等生物，哪有什么思考能力，要决定个什么事情必定是大王一声令下，全体山呼万岁俯仰执行。但事实上根本不是这样。蚂蚁和蜜蜂种群的任何重大选择，恰恰都是每个个体都参与，最后集体决策出来的结果，而且它们的决策过程非常值得人类学习。


    比如说蜜蜂搬家。蜜蜂每年都要搬一次家，老蜂后带着一半的蜜蜂搬去新巢，留下女儿在旧家当家。那么这个新家的选址工作，就非常重要了，而且搬家的窗口期很短，必须在短时间内完成选址。这个选址决定，不是蜂后说了算，也不是哪个侦查蜂说了算，而是每只侦查蜂，根据个人不同的知识，集体决策的结果。


    我们知道蜜蜂传递信息的方式是跳舞。比如一只蜜蜂想要向同伴传递花的位置，它跳的舞蹈曲线跟地面中垂线的角度，就是花的位置跟太阳方向所成的角度，一段舞蹈的时间长短，则跟花的位置到这里的距离成正比。据说这个发现还得了诺贝尔奖。


    新家选址，也是侦查蜂们在跳舞中讨论决定的。侦查蜂的数量只占全体蜜蜂的10%。准备要搬家了，侦查蜂全体出动选址，其它蜜蜂原地休息，为搬家做好体能准备。


    每个侦查蜂要搜索若干个地方，在其中选定一个地点之后，就回来向同伴指示方位。它们会通过跳舞的次数表达对自己选定的这个地方的喜爱程度——一般是跳一遍到十遍，遇到特别喜欢的可能会跳三十到四十遍。


    别的侦查蜂看到有人强烈推荐一个地方，也不盲从，而一定要自己去看一眼。如果它也觉得这个地方行，就回来跟着跳这个舞。这就相当于民主投票。


    等到有超过十五只侦查蜂都投票到同一个地方的时候，决定就算达成了。全体蜜蜂起飞，直接搬家过去。


    侦查蜂们的这个决策过程，专家是越看越有意思，越看越心惊。可能每个侦查蜂都有自己的个性，也可能是因为他们访问过的全部地点不一样，侦查蜂对同一个自己认为的最优地点的跳舞次数未必相同。最后投票决定的时候，居然还要按每只侦查蜂的意见强烈程度加权，就好像奥运会体操比赛裁判打分一样。


    我们作为人类，可曾经常参与过这么高级的决策行动吗？我们买个什么股票，难道不是看别人买啥就买啥吗？


    米勒把蜜蜂的智慧总结为三点：


    +   1. 各抒己见，寻求多样化的知识；

    2. 鼓励不同想法的友好竞争；

    3. 找到一个能让最佳选项脱颖而出的有效机制。


    我不知道你对这三条有什么感触，我当初读书读到这里，可以说是陷入了深思。我们经常说么“集体决策”，什么“民主集中”，什么“群体的智慧”，什么“群众的力量”，我看都不如这三条蜜蜂的经验有道理。


    为什么要追求多样性？为什么要重视每一个人，特别是每个基层人员的声音？就是因为他可能知道你根本不知道的信息，他有他自己独特的视角。但是光让每个人发言还不行，你还得像蜜蜂那样去亲自体会别人的想法。


    1人笔记'
