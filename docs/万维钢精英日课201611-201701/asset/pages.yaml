  md: '# 答读者问｜我和“禅师”真有过一次对话


    # 来自日课：哪有什么“标准人”


    冲：我一直觉得我自己跟别人不一样，所以就想着去学习这个人，学习那个

    人，结果越学越脱离自我。那不学又没有提升与长进，万老师。您觉得这种

    情况应该如何取舍呢。


    万维钢

    “学我者生，似我者死”——齐白石。

    “Good artists copy. Great artists steal.”——毕加索。


    苏满：其实看到没有标准的概念阐释中有关是否大量个体落在平均值范围内，实验证明不是落在期间。我想到几点困惑：1、大数法则的应用。在人的行为经济学方面就有正确性，行为也是一种基因的表达吗？长相和身材数据也是一种基因表达吗？2、是不是统计的时候不取“平均值”而是其他值也许能反应大多数的规律？


    万维钢

    人的身材数据基本上是正态分布的（差异由基因和环境共同决定），这就是说“平均值”是个很好的指标。也就是说，如果你单看一项数据，比如说身高，那么相当大比例的人都会落在平均值的附近。这就是为什么当初人们会有“平均人”这个概念。


    问题出在多项指标。比如如果你既看身高又看体重，要求一个人的身高和体重同时在平均值附近，这就不容易了！这都是因为人体的各项指标之间的相关性没有那么高，有太多高个儿瘦子和矮个胖子。


    那么什么时候“平均值”不是好指标呢？如果不是正态分布就不应该用平均值。比如说人的收入分布其实是幂率（power-law）分布，也就是说有的人收入极高，那么讨论平均值就没有什么意义。比尔·盖茨到哪个电影院就把现场观众的收入平均值提高无数倍。这种情况下“中值”，也就是收入中位数——一半的人比这个收入高，一半的人比这个收入低——是一个更好的指标。


    向阳昭翔：现在网络上 нежели 一种声音越来越响：“别跟我谈理想，我的理想就是不上班”，甚至在一直以敬业著称的日韩国这种现象也越发严重。起先我挺反感的，但随着身边的朋友也慢慢有了这样的想法，我开始思考这也许是因为我们的社会一直以来都是希望以一种价值观、一种生活模式来辩准化每一个人，我有时甚至觉得生产线女工、办公室白领、设计研发工程师在工作上其实毫无区别，忙碌碌却不知所谓，像个无声的陀螺不停旋转却不知为何。请问万老师是否注意到这种现象？作为当下的年轻人们，我们又该如何行动呢？


    万维钢

    我以前看到《非诚勿扰》，就觉得有一个现象特别有意思，男女嘉宾都喜欢说自己是个“吃货”——难道贪吃是优点吗？我猜他们可能只是想表现自己是个真诚而不虚伪造作的人。可能很多表态说理想就是不上班的人，也是这样的意思。


    不过话说回来，生活中的确有很多人忙碌碌却不知所谓的人。面对这种情况，你无论是感到“自豪”还是“自怜”，我看都不太好。你应该感到幸运。


    # 来自日课：一个让人食难难安的世界观


    YJJ：我认为自己找到了这个问题的一种解释，同时解释为什么现在的人类还没有发现外星人。我认为在我们的宇宙外存在更高维的存在，而这些存在创造了或许是不可列的宇宙。每一种宇宙都被相互隔离，这是为了不同宇宙的演化彼此独立，可以比作是一场演化实验。而我们所在的宇宙是非常幸运的一个，也可能是在某些方面得到了高维存在的帮助。如果我是所谓的更高维的存在，我认为这样做有意义，您怎么看呢？


    万维钢

    这个解释跟上帝没区别，而且“高维”这个词也不应该乱用。我理解你的意思是说存在“更高级、住在我们这个宇宙之外”的智能。但这解释不了微调的问题——那些智能又是从哪来的呢？


    小狂：生命及人类的出现纯属偶然的可能性最大，因此M理论对微调的解释更靠谱，其他假设都把生命的出现归为必然。例如你提到“终极理论”，就算将来发现了“终极理论”，根据它的计算结果那19个参数恰好是那些数值，然而为什么终极理论恰好是那样？那岂不是等于说宇宙就是为人类定制吗？


    万维钢

    如果最终M理论只有一个解，就是我们这个宇宙，那就不是“定制”了，而是必然。我举个例子你就明白了。现在从逻辑角度，咱们描写一个宇宙。我要求这个宇宙中的物理定律：


    +   1. 不随时间变化

    2. 在空间各个位置都成立

    3. 在各个方向都一致


    这三条要求都非常平淡吧，不算定制吧？但是物理学家证明，只要满足这三个条件，那么你的这个宇宙中就一定是能量守恒、动量守恒和角动量守恒的。


    现在物理学家的梦想，就是从这些看似特别平淡的要求出发，推导出我们这个宇宙的全部定律。如果这个梦想实现了，那就是说我们这个宇宙是逻辑自洽条件下的唯一解，不需要定制，人类必然出现。那就什么问题都没有，一片祥和。


    # 来自日课：老王的体能和老张的灵感


    不如此：现在很多人都会或多或少地接受“世界并不是非黑即白”的，但是每到具体事物的时候又会有强烈的对锯、喜恶偏好。我在寻思，这种偏好是否也是认为世界是黑白分明的一种表现。再深思一下，如果分成黑白两类是一种不恰当的手段，那么分成三类、四类的事物呢？是否也是不恰当的？另外，再反过来想，分类的目的是否是为了让我们更简易地理解世界？如果是的话，是否也就是说在某种意义上，你认知里面分类越多，则认知水平也就越高了？


    万维钢

    你说的这个，其实就是用多少项指标去评价一个事物。“非黑即白”，那就是单一维度（前面的“YJJ”兄请注意，我这里用“维度”就很恰当，它等于矩阵的阶数），1表示好，-1表示坏，0就是不好不坏。如果再从别的方面考察这个事物，那就等于增加了维度，也就是多了一项指标。比如Facebook对每个人有98项指标，它看人显然就不是非黑即白，而是更全面地看。从这个角度说，当然是指标越多，认知水平越高。


    但是这些指标的选取，也是有问题的。

    一个人可能有无数个侧面，你Facebook看着98项，无非是为了多赚钱而已，你仍然是主观的视角。你看了98项，看的其实还是“值钱不值钱”，这跟非黑即白本质上没有区别。

    那么有没有真正客观的视角呢？这是哲学问题，非我所能回答。'
