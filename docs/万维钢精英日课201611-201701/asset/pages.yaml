  md: '# 日课101｜广告的最高境界


    日课101｜广告的最高境界....


    最近我看微博，被一个国产饮料的包装设计和广告给刷了屏，那就是著名的国宴饮料、中国名牌、不加香精、不加色素、不加防腐剂、不含三聚氰胺、正宗植物蛋白、每天一杯、白嫩丰满的——正宗椰树牌椰子汁！


    ![](img/9befb2e4b5878711040fbe72f1245d32_181_0.png)


    ![](img/9befb2e4b5878711040fbe72f1245d32_181_1.png)


    在这个消费升级的时代，很有幸还能看到这么朴素直白的广告。


    广告，到底应该怎么做呢？


    今天咱们继续说《注意力商人：进入我们脑袋的史诗争夺》（The Attention Merchants: The Epic Scramble to Get Inside
    Our Heads）这本书，作者吴修铭（Tim Wu）。上次我们说到，注意力商人从一开始就走了低俗的路线，并且到了后来因为过度艳俗、虚假广告的问题引起了公众的极大反感，遭遇挫折。


    但是开发注意力资源的时代已经被开启了。第一次世界大战期间，英国率先开动国家级的宣传机器给部队征兵，美国随后效仿，效果非常之好。从此之后人们就明白了一个道理——


    只要你能取得注意力，你就能操弄人心。


    广告业，也进入了更高级的探索阶段。等到一战结束，从1918年开始，美国就迎来了一次私人消费的升级——有点像中国现在的情况。从业者对广告有了更深入的理解，有了各种高级的玩法。到1930年，美国广告业规模扩大了10倍。


    早在1923年，就有人总结了一套“科学广告”的理论，并且得到广泛应用。在今天看来，这些套路不但一点都不过时，而且仍然非常高端。那时候的广告人很喜欢谈论弗洛伊德，但他们的水平其实已经超过了弗洛伊德。这些“科学广告”操弄人心的手段，已经到了极高的境界——


    # 1.需求工程学


    以前人们对广告的理解是提供信息，在消费者和产品之间架线搭桥——你有这个需求，我告诉你哪家的产品最好。可finance是高层次的广告，却是要在原本没有需求的情况下，去发明创造一个全新的需求。


    一种是用新需求解决老问题。比如说我们现在喝的橙汁，在1920年代是刚出来的新产品——产品出来了，可是人们并没有喝橙汁的需求——这就是广告人的用武之地。


    当时就有一个广告，说喝橙汁对婴儿有好处！鼓吹一些什么“维生素C”之类的概念，说给婴儿哺乳的时候，应该喂点橙汁……反而我们今天的科学家认为婴儿其实是不适合喝橙汁的。那个广告取得了巨大的成功，橙汁从此成了家庭必需品。


    另外一种情况更厉害，是用新需求解决你一个此前根本就没有的问题。也就是说为了发明需求，先给你发明一个问题！


    最典型的例子就是口臭。口臭本来不是问题，人们从来没想过美国有口臭问题——是1920年代厂商发明了牙膏和漱口水，广告于是给美国发明了口臭问题。


    广告说，你是个漂亮的女孩，周围朋友都喜欢你，可是你知道吗？他们接近你的时候都得强忍着——他们永远也不会告诉你，你的呼吸很 nauseating。女孩一听这个，能不刷牙漱口吗？《纽约时报》曾经发表谴责文章，说广告人正在给公众制造恐慌！但消费者最终都买账了，不刷牙不敢出门。


    # 2.品牌


    品牌是广告业的一大发明。以前的人以为“声望”这个东西是靠产品好慢慢赢得的，而广告人发现，声望其实是可以短期内制造出来的。广告人大力推广告哪个品牌，哪个品牌就能迅速获得声望。


    那么品牌是什么意思呢？你可能以为品牌无非是对不同商品的一种标记，帮助消费者做选择用。而对高級广告商来说，品牌，其实是一种信仰。


    我们日课有篇文章叫《政治争论ABC》，其中提到在政治派别的竞争中，最关键的并不是争取对立阵营的人，而是把本方阵营的人留住！美国广告人早在1920年代就意识到了这一点，品牌的目的就是为了培养忠诚的消费者。广告商想让你像皈依宗教一样皈依品牌。这就是为什么在人人早就知道可口可乐是什么东西的情况下，可口可乐还在不停地做广告。


    可你明明只是一种商品，我怎么可能对商品忠诚呢？这就要求广告人赋予品牌精神内涵。


    广告商说，凯迪拉克不仅仅是汽车，它象征的是领导力！如果你认为你是个人领导力的男人，就应该买凯迪拉克。道奇汽车的精神，则是可靠性——dependability这个英文单词，当初就是广告商专门为道奇汽车发明的。


    如此看来，广告商已经改写了人民的文化基因。品牌商品不再仅仅是商品，它有了自己的精神和个性。消费者哪里是在追逐品牌，他们其实是在追求自己的身份认同。


    现在提到“可口可乐”这个词，除了想到饮料之外，难道你就没有一点文化共鸣吗？


    # 3.靶向广告


    靶向广告就是针对某个特定人群，比如说针对女性做广告。广告人很早就意识到女人是感性动物，更容易说服，更容易有购物冲动。商家推出各种女性品牌。


    而且广告人发现，针对女性的广告，你不应该强调商品的使用价值。


    比如说有一种护肤霜，用了能让皮肤白嫩细腻。但是它的广告中并没有像椰树椰汁那样列举成分，也没有像椰树椰汁那样暗示皮肤好了就有更性吸引力——这个广告的潜台词是好皮肤代表了一种更高品质的生活！


    它卖的不是护肤霜，也不是好皮肤，而是好生活。


    女人对美好生活的追求从来都没让广告商失望过。广告商还知道，女人很愿意模仿那些名人和社会地位比较高的人——于是发明了明星代言。


    在这三个技术之外，广告业还有一个登峰造极的成就。广告人为了帮商家销售一个产品，甚至可以改变社会规范。'
