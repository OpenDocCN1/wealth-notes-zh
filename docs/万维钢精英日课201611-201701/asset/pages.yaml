  md: '艾瑞里说，如果我们是预付（先花钱再享受）或者后付（先享受再付款），就没有那么强的支付痛感，因为感觉不到钱在减少。这就是为什么我们在家里用水电都不怎么计较，可以说是比较浪费，因为水电费我们一个月支付一次就可以了。所以谁如果想督促自己省钱，应该在水龙头上接一个直接显示钱数的水表。


    艾瑞里的文章到此就结束了，但是我还想多说一些。我们立刻就可以从他说的这个道理里面，引申出一个重要结论来——


    用信用卡支付，我们会更乐意花钱。


    这个结论对商家来说可就太重要了。我们想一想，这件事儿挺有意思。你买个什么东西，不管是用现金还是用信用卡，它的定价都是一样的。可について对商家来说，收信用卡就得向发卡银行支付1%左右的手续费——这就是为什么有些短视的商家故意不收信用卡。


    所以说不懂行为经济学就要吃亏啊。你收信用卡，别人在你这里花钱不但更方便，而且痛感低！他们会花更多的钱！那点手续费根本不算什么。我就看到过统计，说在竞价拍卖这个行为中，如果能用信用卡支付，人们会愿意付比现金支付高出整整一倍的价格！在餐馆吃饭用信用卡给小费，比现金给的小费至少高10%。哪怕平时非常节俭的人，一旦用上信用卡就容易变大方，不知不觉之中欠下高额账单。


    艾瑞里说这是因为信用卡的支付痛感低，我听到过两个更进一步的解释。


    有本书叫 How We Decide，中文版书名叫《为什么大猩猩比专家高明》，作者是乔纳·莱勒（Jonah Lehrer），书中提到，信用卡支付痛感低，甚至有脑成像的实验证据！实验发现，用信用卡消费，能减弱大脑中岛叶（insula）部位的活动，而这个部位恰恰负责负面感情。


    从脑科学角度看，使用信用卡消费，其实是让我们在眼前的享受（消费）和长远的利益（过段时间再还款）之间做了一次取舍。人脑考虑眼前享受的时候基本上是感情区在起作用；而在考虑未来的时候，我们就需要动用大脑的前额叶皮层（prefrontal
    cortex），进行理性计算。而一般来说，感性总是能战胜理性，我们很容易高估当下能获得的享受，而低估了未来需要付出的代价！


    不过，关于人们为什么在使用信用卡的时候表现得更大方，我还听到过另外一种解释。这个解释来自《决策力》（Decisive: How to Make Better
    Choices in Life and Work），作者是奇普·希思（Chip Heath）和丹·希思（Dan Heath）。这本书说，用信用卡支付的时候，你脑子里的金钱是一个连续变化的数量，不会有太大的感受。可是用现金支付，就需要你掏出一张张的钞票，等于是把钱分成了若干小块，每一张钞票就是一整块钱。人对连续的数量不敏感，但是对分块的东西很敏感。


    这个解释有实用价值——如果你想要省钱或者节食，就应该对事物进行分块。比如你吃薯片，直接打开一大包薯片连续地吃，一不留神就吃多了。但如果你买的是小袋包装的，一包吃完你就不太可能再来一包。


    根据这个原理，我们吃不健康的零食，如果是大包装，最好用小袋子进行分装。如果你想要省钱，就给自己设定一个额度，每天的消费不能超过这个额度。再者，想要节食减肥的人，吃饭最好使用小碗。


    # 我再补充一点


    我女儿上的幼儿园，就坚决不收信用卡，每个月的学费都是直接从银行转账——他们这个做法其实非常理性：学费都是固定的，就算是收信用卡我也不可能哪天高兴了就来自个10%的打赏！


    # 由此得到


    +   1. 作为商家，应该主动接受信用卡，因为信用卡能有效刺激人们消费。\n2. 作为消费者，我们在使用信用卡消费的时候需要谨慎，时刻保持对数字的敏感，想省钱可以尝试用分块的方法。\n3.
    尽管你知道使用信用卡会让你多花钱，你大概还是会忍不住去刷……这都是脑科学所决定的的。


