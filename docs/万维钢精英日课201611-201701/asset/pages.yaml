    克林认为，你最好三种感情都有，然后具体问题具体分析。


    比如美国的民权运动，马丁·路德·金带领黑人搞非暴力的抗议示威，争取自身权利。我们对待这个问题，采用自由派的思想就是最恰当的。当时美国南方很多州仍然在实行种族隔离制度，黑人的的确确就是被压迫的群体！帮助黑人争取人权，甚至要求政府出面干预，都是完全说得过去的。


    在当时这个情况下，你如果采取保守派的态度，非得强调黑人文化落后，你就太不近人情了。而克林特别提到一位泰山北斗级的经济学家，米尔顿·弗里德曼，在民权运动时期采取了自由论者的态度，认为谁愿意歧视黑人那是他自己的自由，这个态度就很不得体。


    再比如说，在城市犯罪率上升这个问题上，使用保守派者的论点就比较合适。这个时候推崇法律和秩序，表扬文明人，谴责野蛮行为，甚至对犯罪分子使用强硬手段，都是合理的。而如果自由派出来非得说犯罪分子都是弱势群体，应该同情他们，对他们实行“两少一宽（少捕少杀，在处理上要尽量从宽）”，那就非常不合理。


    再比如大麻问题。现在美国有好几个州都已经实现了大麻合法化。现在一般认为大麻对身体的危害不大，大概和吸烟差不多，可能还不容易上瘾。那么自由论者认为是否吸食大麻是个个人选择，这个观点也许就是合理的。如果保守派站出来说吸大麻败坏道德，在当今美国来说，有点说不过去。


    这就叫具体问题具体分析。个人做到这一点其实并不难，你甚至还可以就某一问题进行更复杂的推理分析，也许三种感情都能顾及到！


    然而问题是，群体政治，可没有这个能力。


    社会上的事儿就是这样，单个的人可以非 常聪明，可是一群人一旦统一行动，就可 能变得愚蠢。群体，没有办法进行复杂推 理，也不会具体问题具体分析。


    这就是政治争论一旦形成阵营的悲哀之处，咱俩下次再说。


