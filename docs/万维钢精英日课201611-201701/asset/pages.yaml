  md: '个什么新管理理念？甭管是大数据还是专注力，咱公司也上！


    这种刻意的跟风，往往不起什么作用。比如现在美国特别流行的一种企业理念叫做“多样性”，也就是说，你们公司你们的雇员绝对不能全是白人男性，最好各种族、各年龄段、各种宗教信仰、男女都有。这个理念背后的理论支持是如果人员越多样化，三个臭皮匠赛过诸葛亮，你们公司的决策就越科学。而且这还特别政治正确！


    但是有一项针对石油和天然气公司的研究表明，多样性根本没有带来什么正面效果，甚至都没有让这些公司的员工变得更宽容。


    # 5.企业文化


    有个高科技公司的企业文化是改变，他们每隔几年必须要搞一次大的变革，结果什么有意义的效果都没有。人 продолжи... 既然现在又有新的东西了，我们公司也得变。


    有个公司的企业文化是“正能量”，公司上上下记的口号是“我们不要问题，我们只要解决问题！”结果没人敢提问，没人敢说实话，上上下下刻意维持一团和气——外人观察之后的评价：这不是一个公司，这是一个宗教。


    ![](img/9befb2e4b5878711040fbe72f1245d32_9_0.png)


    那么为什么这些组织和个人，会愚蠢到，容忍自己被“愚蠢化”呢？作者提出，这是因为从短期利益来讲，愚蠢是有好处的。按流程做了，就不会有人找我麻烦。大谈谈导力口号，我就容易获得提拔。模仿谷歌，外界就会把我们当成世界级的创新型公司。推出新品牌，领导层不用痛苦的变革就能给公司一个新形象。强调企业文化，员工的忠诚度才能提升。


    愚蠢化的真正问题在长期。iPhone 2006年就出来了，天大的威胁就在眼前，而诺基亚公司从2007到2013年，整个高层强调的企业文化是什么呢？是正能量！高层听不得坏消息，底层就只好报好消息，结果公司一步步走向深渊。


    如果不幸身处一个平庸的、愚蠢化了的组织，我们应该怎么办呢？作者提出了六个建议，在我这个中国人看来，简直深厚厚黑学的精髓。他一共说了六条，我看可以重新排列一下，分为四个普通厚黑功夫和两个高级厚黑功夫。


    普通厚黑功夫，可以保证你的生存：


    +   1. 领导让干啥就干啥，出错也是领导的。\n2. 别人做什么你就做什么。竞争对手开始学谷歌了嗎？咱也学谷歌！错了难道还是我的责任？\n3. 用各种专业术语把别人搞晕，这样你就不用真干事儿了。\n4.
    如果你要做一件什么没有把握的事儿，担心可能会出错，你要事先告诉所有同事，你这么做纯粹是为了多挣钱。这样万一事实证明这个做法是错的，你可以说这是因为公司的激励制度有问题——而不是你的智商有问题。


    高级厚黑功夫，可以给你带来升职：


    +   1. 见好就收。愚蠢的做法在短期往往是有好处的，这个项目的好处一出来，你就赶紧拿功劳走人，将来出了毛病也找不到你。\n2. 少下功夫干活，多下功夫做PPT。表现得漂亮比把事儿作好更重要。也许你的PPT里有很多错误的东西，但没关系，万一出了问题就说领导当时没有仔细看我的PPT——其实领导根本记不住你的PPT里有什么。


    组织愚蠢化，可不是什么心理学问题或者行为经济学问题——不是因为领导人愚蠢，才让组织愚蠢化。愚蠢化往往是有意为之！因为愚蠢化能带来短期的好处。


    # | 我的评论


    你可能会问，为什么这些愚蠢化的组织还能在市场中长期生存？我觉得答案是市场竞争其实没有读书人想象的那么激烈——用经济学的话说，就是市场的效率没有那么高。


    创立初期的公司，什么资源都要自己争取，品牌、商业模式和客户关系要慢慢建立，那是绝对不可能靠愚蠢运行的。一旦这些东西已经建立起来了，一套成熟的制度就是让公司持续赚钱的保障。这个工作方法已经被证明是好使的，客户已经接受了，为什么不把它变成流程呢？江山已经打下来了，不需要什么特别高明的领导就能让公司平稳运行，何必计较什么叫真正的领导力？


    如果不出事儿，大部分公司就能这么一直生存下去。刚招进来的年轻人员如果不服这一套，非得按自己的想法做事，对公司的效率反而是个威胁。


    普通打工根本不需要特别聪明的士兵，你保持队形就行了。愚蠢化，恰恰是效率的保障。


    直到遇到危机为止。


    # | 由此得到


    今天我们得到了：厚黑学的处世之道。——啊不对，是对真实世界的一个认识……


