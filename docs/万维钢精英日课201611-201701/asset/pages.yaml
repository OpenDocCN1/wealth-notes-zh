  md: '我现在读写量太大，只能用录音的方法记笔记，然后请助手手把录音整理成书面文档。我读一段书，有什么心得感想就直接用Evernote录音，把录音保存在“录音笔记”目录下。我的助手随时看到，有时间就帮我整理。我不用特意告诉她新录了哪些笔记，她也不用告诉我整理到了哪里，所有工作进度一看着便知。


    主编、助手和我，我们在不同的地方，甚至是不同的时区工作。但是我们一交流都是说大事儿，几乎不用花时间做什么技术性的协调同步。


    # 3.创造


    最后说两个Evernote的高级功能，是用来思考创造的功能。我们还是以写作为例。


    第一个功能是，你可以在一条笔记中插入另一条笔记的链接。这个功能简单但是意义重大。


    从2012年开始，我对贫富差距增大这个话题非常感兴趣，就一直想写篇文章来解释为什么现代社会的贫富差距会越来越大。我的做法是先在“想法立项”目录中创建一条笔记占位置，然后一遇到相关的素材，比如什么新的研究结果，就把保留那个素材的笔记链接在这里——


    ![](img/9befb2e4b5878711040fbe72f1245d32_200_0.png)


    截图是这条笔记的一部分，其中每条绿色链接，都指向一个相关的素材。这样几年时间内，我搜集了好几十条素材，想的越来越多，可是文章到现在也没动笔。


    但这个思路是清楚的——不成熟的想法先放着，慢慢积累，什么时候素材够了自己想明白了什么时候动手。而Evernote的关键作用在于，平时你不用总记得这个想法，它老老实实就待在那里，你随时有新东西都可以去补充它。这不仅仅是写作的问题，这是借助一个外部工具，把想法壮大起来。


    其实我还需一个功能：自动告诉我一条笔记都被哪些笔记引用过。这能引发更多联想，希望将来Evernote能有这个功能。


    第二个功能是，Evernote能通过可能是词汇匹配之类的算法，自动发现一条笔记的“相关内容”。


    最近《大西洋月刊》上有篇文章介绍心理学家 Paul Bloom 的新书 Against Empathy，这本书说的是同情心泛滥对现代社会的害处。我把文章保存在了Evernote中。


    然后Evernote就根据这条笔记的内容，自动发现了六条“相关内容”（Context），其中三条来自我以前的笔记，三条来自最近的媒体文章——


    ![](img/9befb2e4b5878711040fbe72f1245d32_200_1.png)


    Evernote至少告诉了我三件事：


    +   1. 这个Paul Bloom早在2013年就在《纽约客》杂志发表过一篇类似内容的文章。我看过那篇 Dijkstra文章还保留了，但是现在全忘了。\n2.
    文章中提到精神病人的决策能力可能更强，而我之前读过的一篇书评，也讲过类似的观点。\n3. Paul Bloom最近还在《华尔街日报》上发表文章，介绍了他这本书。


    我没有做任何搜索，这些都是Evernote主动告诉我的。


    更重要的是，Evernote这已经是在模拟人脑的思维！人脑发挥创造力最重要一个手段，就是把两个不同的想法连接起来。这个连接越是意想不到，创造出来的东西就可能越有意思。想要让想法连接，你得先拥有很多很多想法才行，而现在你可以把想法寄存在一个外部工具里，让计算机帮你建立连接！


    但是Evernote做得还不够好。另一个工具，DEVONthink，能用更复杂的算法提供更多的相关内容，而且还有量化的相关度评估。可是DEVONthink的其他功能实在远远不如Evernote……所以我特别希望Evernote收购DEVONthink。


    不论如何，有这样的工具，我等于于是“计算机辅助写作”。这就是为什么“精英日课”专栏能够做到日更，我永远不缺资料，我的烦恼是资料太多怎么取舍。我完全不担心有什么人工智能写作软件，我希望这些软件越强越好，为我所用。


    我希望看到更多的人使用这些方法，写出有干货、有严肃研究结果支持的好文章来。那些无病呻吟的鸡汤文字根本配不上这个时代。


    而现在如果有哪个作家还在用复印和剪报搜集资料，用Word写文章，他面临的是我这样的作家的不公平竞争。


    万维钢


    写完这篇文章感觉太像软文！主编就联系了Evernote，要求对方给我们读者提供福利，结果洽谈良好。但我想先请你帮我一个忙：把这篇文章转发推荐给你身边一个爱学习的朋友。等专栏订阅达到七万，咱就发送Evernote的福利。


