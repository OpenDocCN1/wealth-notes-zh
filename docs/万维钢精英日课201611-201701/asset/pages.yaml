  md: '# 日课099 | 道光年间的注意力商人


    日课099 | 道光年间的注…


    前天罗胖的跨年演讲中提到一个非常有趣的概念，叫做“国民总时间”——现在这是一个绝对稀缺的资源。商家们都在拼命地争夺这个国民总时间，也就是争夺我们的注意力。


    不管你是打算争夺别人的注意力，还是不想让别人抢走你的注意力，“注意力争夺战”都可以说是我们这个时代最重要的主题之一。其实这场争夺战早就打响了——不是今天，不是十年前，甚至不是一百年以前，比一百年更早。这场战争中不知道有多少套路，多少算计，多少科学，多少教训！


    所以咱俩新年第一本书，就说这本十月份刚出版的《注意力商人：进入我们脑袋的历史争夺战》（The Attention Merchants: The Epic Scramble
    to Get Inside Our Heads）。此书作者Tim Wu是哥伦比亚大学的法学院教授，他可能是华裔，还有个中文名叫吴修铭。之前我曾经读过他的一本讲美国电信史的书，印象深刻！吴修铭的调硏能力和写作水平都是一流，而且风格很大气。


    ![](img/9befb2e4b5878711040fbe72f1245d32_177_0.png)


    我读这本书的第一个感叹，是我们现在搞注意力经济的各种常见打法，别人数在一百多年前就全都玩明白了。


    把人类注意力给商业化的历史，起源于1833年——那一年在中国是道光十三年。


    1833年的纽约只有三十万人人口，一份报纸的定价是6美分，属于小众市场，大部分人买不起。这一年，有个23岁的年轻人，本杰明·戴（Benjamin Day）——我们姑且就叫他“小戴”——决定创办一份自己的报纸，叫《纽约太阳报》。


    小戴的一系列动作，让我简直怀疑他是不是一个现代人穿越过去的。


    小戴从一开始就设定，《纽约太阳报》的定价只要1美分。1美分连印刷成本都不够，但小戴根本就没有打算赚读者的钱——他要靠广告赚钱。


    但是请注意！当时根本没有“广告”这个概念。那时候报纸上的广告和新闻是没有明显区别的，广告是作为对顾客有用的信息刊登在报纸的公告栏里，并没有商业化。小戴一上手，就把公告栏里的那些小信息改成了高大上的广告。


    因为此前没有什么广告业，商家根本没有这个意识。所以小戴是先培养市场——他免费、主动在《纽约太阳报》发了一些商家的广告，等这些商家尝到甜头了，再去找他们要钱。


    所以小戴等于说是一手造就了现代传媒广告业。结果非常成功。九月份发刊的《纽约太阳报》到了当年年底就成功实现盈利，然后1年之内就成了纽约市最大的报纸。当时有些富人和政党赔钱办报纸，那都是为了宣传——而小戴的目标非常单纯，就是为了赚钱。


    只不过他赚的不是读者的钱。读者，其实是他的产品；商家，才是他的顾客。他吸引读者的注意力，再把注意力转交给商家——小戴，其实是个“注意力商人”。


    所以小戴可以说是现在这些互联网内容从业者——什么扎克伯格，什么今日头条——的祖师爷。《纽约太阳报》是历史上第一份真正的大众传媒，你甚至可以说是因为有了小戴，才有了“公共舆论”这个概念。就连“全职记者”这个职位都是小戴的首创——老百姓爱听打官司的故事，小戴就派了专人每天盯住法庭，把庭审记录直接登在报纸上。


    小戴不但是第一个发现注意力资源的人，他也是第一个意识到这个资源不够用的人。竞争对手马上出来了，读者的注意力就这么多，纽约市到底能容下几家报纸？


    吴修铭说，人的注意力有两个特点。第一，你任何时候都在花费注意力，不用在这里就用在那里，随时产生随时花掉，既不能关闭也不能攒起来——所以商家要争夺你的注意力，是有充分机会的。但是第二，人的大脑还非常善于忽略信息，实际接收到的信息中绝大部分都被忽略掉了，越常见的，越容易忽略。这就意味着如果你仅仅拿信息轰炸读者，是争夺不来注意力的。


    而且人脑的适应能力非常强。哪怕是新奇有趣的内容，也会很快变成熟悉的事物，然后就会被忽略。


    所以注意力生意其实并不好做，你必须不断地推陈出新，加大剂量给读者新的刺激——最直接的策略，就是往越来越低俗的方向去。


    《纽约太阳报》从创刊之初，就刊登一些老百姓们喜闻乐见的内容，比如自杀新闻或者家庭风波。后来竞争日趋激烈，各报纸纷纷提供更low的内容，比如它的竞争对手中有一份报纸专门爱报道一些暴力死亡事件，其对尸体的描写可谓是非常生动。再后来，几份报纸之间开始进行撕X大战——英文叫
    trash talk ——很像现在名人们在微博上的互动，现代和当时的读者都非常欢迎。到了更后来，就开始出现琐读读者智商的假新闻。比如《纽约太阳报》曾刊登过这么一则新闻，说天文学家发明了一种先进的望远镜，观测到月球上存在一种比人还厉害的高级生物！


    然后，注意力争夺战就上升了一个维度，从一维文字变成了二维图像。


    1860年代，巴黎出现一位海报艺术家，叫朱尔·谢雷（Jules Chéret）。谢雷现在享有祖师爷待遇，法国有个以他的名字命名的艺术博物馆——谢雷对艺术的主要贡献，是艳俗。'
