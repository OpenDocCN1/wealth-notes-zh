- pgno: 168
  md: '事实上，为了观察这84个孩子，研究者请了77个成年观察员。观察员要时刻跟踪每个孩子，每隔1小时记录一次对孩子们的性格评价，总记录数据达到14000多个小时，平均每个小孩被跟踪观察167个小时。


    这项研究最重要的结论，就是每个小孩在不同的情境之下，所表现出来的性格是不同的。


    比如一个小女孩在餐厅里和大家一起吃饭的时候，表现得非常外向。可是在游乐场和大家一起做户外运动的时候，又表现得非常内向。那你说她的性格到底是外向还是内向呢？


    正田裕一据此提出，人其实没有什么“本性性格”。他在这个情境下是一个性格，在另一个情境下完全可以是一个相反的性格。就算你把不同的情境都考虑到，给他算个性格平均值，又有什么意义呢？


    那么，我们应该如何科学地谈论性格呢？


    最科学的方法，是考虑一个人的“如果…就…特征”（If-then signatures）。每个人的性格不再是一组标签，而是一系列的列表，也可以说是一份有点复杂的使用说明书——如果这个人在陌生人面前，他就表现得内向；如果这个人在熟人面前，就表现得外向；如果这个人面对压力的时候，就表现得有点内向；如果这个人在办公室里，就表现得特别外向……


    你要问我这个人是内向还是外向，我得先问你关心的是什么情境，然后我查他的“如果…就…特征”表才能告诉你。


    更进一步，现在心理学家认为，不但我们常说的内向/外向这样的一般性格是情境相关，就连诚实、忠诚、善良这些的品德，也是情境相关的。一个人在某些情境下表现得非常善良，却在另一种情境下表现得非常无情；一个人可能在同事面前表现得友好，却在家里面表现得冷酷；一个人也许会在超市里偷东西，但在考场上并不作弊；一个小孩在家长面前非常温顺，但在学校里却有霸凌行为……
    21人笔记


    如此说来，说谁谁是有什么样的“性格”，这种做法恐怕已经过时了。


    # 我的评论


    我读书读到这里，略有所悟。以我之见，与其说这是性格，不如说这是习惯。前几年有本书叫《习惯的力量》，书中就把习惯定义为某种特定场景下的特定做法——比如你每天去上班，形成了一到某个路口就右转的习惯。有了这一天你换了工作，到了这个路口你应该直走，而不是右转，可是如果你注意力不集中，就会不自觉地右转。习惯，就是让一遇到某种情境，就触发某种行为——这难道不就是我们今天所讨论的“如果…就…特征”吗？


    我猜想，性格和习惯这两者可能没有差别，也许习惯就是广义的性格，性格就是狭义的习惯。


    由此，我们还能推导出人的性格是可以改变的，因为有大量的研究表明人的习惯是可以改变的。其实我们在生活中就见过性格改变的例子，一个在上学时期非常“内向”的人可能在工作几年之后就变得非常“外向”。


    不过我觉得这段书给我们更深刻的一个教训，是科学方法。民间心理学家喜欢弄一些玄乎其玄的概念，听着深不可测或者饶有趣味，可我总想问那些“老师”一句话——“你有什么科学依据？”


    围绕“性格”这个概念，已经有了太多的民间科学、非科学甚至是伪科学。其实越神秘的概念越经不起推敲。


    # 由此得到


    不要随意给人贴内向、外向这样的性格标签——如果你非要这么做，那就做得科学一点，列一个If-then表格。


    在招聘、寻找合作者或者和人打交道的时候，我们尤其要注意这一点。对方在某种情境下的性格表现符合你的要求，并不意味着他在实际工作的那个情境中依然这样。要真真正正了解他的表现，没有比让他着手去做一做更好的办法了。
