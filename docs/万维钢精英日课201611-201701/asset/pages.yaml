  md: '# 周末小议 | 我怎样管理信息


    只要你从事脑力工作，不管具体于什么，你干的其实都是同一件事——吸收大量外界信息，让这些信息在你头脑中发生化学反应，然后创造新信息。以前我搞物理研究，现在我是科学作家，都是在和信息打交道。我想分享一点信息管理的经验。


    有关信息管理，大概有两种错误的思想。


    一种是想要用大脑记住信息，强调记忆力，据此现在有各种记忆术，什么记忆力培训班之类。在互联网时代，这个依赖蛮力的思想实在太落后了——人脑应该是用来想事儿的，不是用来记事儿的。我专门写过一篇文章叫《超强记忆力是一个邪道功夫》，这里不必细说。


    另一种是强调搜索，指望什么信息都临时去网上找——这就太业余了。比如你看到一篇什么有价值的文章，只要你觉得将来可能还需再看一眼这篇文章，你就应该把它保存下来，而不能指望日后再去搜索。你可能会忘记关键词，甚至把整个这件事儿都忘记。


    正确的做法，是使用一个外部系统，专门存储个人化的信息。


    所有学者都是这么干的。过去人们使用笔记本和文件柜，现在我们有更方便的工具。


    # 1.采集


    人脑很不擅长提取记忆里的东西，但是很擅长识别东西。如果让你列举你所知道的所有美女，你大概一时之间说不上来多少个；但是当你看到一位美女的时候，你马上就知道这是美女。所以我们要专注于识别，而让计算机帮着提取。


    # 2.合作


