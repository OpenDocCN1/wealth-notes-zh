  md: '# 日课 073 | 统治者 和“拒绝被统治”者的学问


    ![](img/9befb2e4b5878711040fbe72f1245d32_96_0.png)


    日课073 | 统治者和“拒...


    今天我们说一个特别重大的题目，liberal arts。这个词组的字面意思是“自由艺术”，但它说的并不是我们通常理解的“艺术”。Liberal arts 这个词在中文世界并没有一个取得共识的译法，经常被翻译成“通识教育”、“素数教育”、“人文教育”、“博雅教育”等等——可是
    kur 我看 来，所有这些“教育”，都把 liberal arts 给矮化了。


    Liberal arts，不是为了训练一个能歌善舞的漂亮小孩子，不是为了熏陶一个多愁善感的文艺青年，也不是为了武装一个中年危机的忧郁大叔。


    Liberal arts，是最正统的西学，其地位在工程、医学等一切应用学科之上，它原本是一种最高级的学问——


    统治者的学问。


    今天我打算结合两本书，来说说在西方学者眼中，liberal arts 到底是什么东西。


    一本其实是个有声书，叫How to Think: The Liberal Arts and Their Enduring（如何思考：liberal arts的前世今生），这是韦顿学院教授Michael
    D. C. Drout 2013年出的一系列讲座。


    ![](img/9befb2e4b5878711040fbe72f1245d32_96_1.png)


    一本是2015年出版的Excellent Sheep: The Miseducation of the American Elite and the Way
    to a Meaningful Life（优秀的绵羊：美国精英的错误教育以及怎样才是有意义的生活），作者是前耶鲁大学教授William Deresiewicz。这本书的前半部分内容，我已经写过书评，题目是《精致的利己主义者和常青藤的绵羊》。


    ![](img/9befb2e4b5878711040fbe72f1245d32_96_2.png)


    以我之见，liberal arts 的合理翻译应该是“自由技艺”——“arts”，不是“艺术”的艺，是文艺武艺的艺，技艺的艺。


    # 1.统治者七艺


    自由技艺，原本是古罗马时代的一套课程，被认为是“自由的人”应该掌握的一套学问。“自由”这个词，对今天的人来说有点无感，因为所有人都是自由的。而对古罗马人来说，“自由”的意思非常明确——那就是说你不是一个奴隶。


    你不是奴隶，你有权直接参与社会事务和公共政治，而且你还要管理奴隶。这才叫自由。


    自由技艺的课程项目在历史上有个演变的过程，到了中世纪，被确定为七个项目。中国春秋时代的贵族大约也有类似的项目，比如孔子说的“六艺”。那么我们也可以把西方自由技艺的这七个项目，称为“七艺”。


    这七艺中，前三项被当时的学生认为是比较简单的项目，叫Trivium（现代英文“trivial”这个词，就来自这里），后四项则叫做Quadrivium。


    这七个技艺，其实都蕴含着统治者的统治之道。


    +   1. 文法。其实就是拉丁文。拉丁文在古代欧洲是各国通用的上层语言，而英语、德语都只能算是方言。掌握拉丁文，你才能参与国际交流——就像现代人应该学普通话和英语一样。

    2. 逻辑。掌握逻辑，你读什么东西才能读懂。

    3. 修辞。学修辞的最主要的是为了说服别人，施加自己的影响力。

    4. 算数。作为贵族，你得管理财产。

    5. 几何。涉及到严密的推理，而且你需要对建筑有所理解。

    6. 音乐。音乐被视为与世间的法则有关。

    7. 天文学。其中包括了占星术。音乐是人世间的法则，天文则是自然界的法则。


    时至今日，西方大学里自由技艺的科目已经有了各种变化，比如科学类的课程有时候不算自由技艺，单独拿出去，而历史、文学、艺术这些内容则被加进来。


    而且现在也没有奴隶了，也没有那么多“统治者”。那么还要自由技艺培养什么人呢？培养的是具有自由意志和独立人格的人，我看也可以说是“拒绝被统治”的人。


    不论如何，自由技艺的精神没有多少改变，这些课程学的都不是能够直接拿出去找工作赚钱的知识，而是一种间接的思维训练，传授的是“软实力”。


    美国有些小的学院，是专门教授自由技艺，而根本就没有专业课程的，学生在这里学四年再去学医学法律之类。一般综合性大学也要求学生必须花上至少两年时间学习自由技艺。


    学习自由技艺不是为了就业，可是自由技艺这个软实力在美国的就业市场上反而很受欢迎。《优秀的绵羊》书中引用一项针对美国公司的统计，最受欢迎的专业中，排第一的是工程和计算机科学，欢迎度是34%；排第二的就是自由技艺，欢迎度高达30%！


    甚至有一种说法，认为本科学什么专业根本不重要，通过学习自由技艺掌握的思维方法才是真正重要的。华尔街日报有个统计，说'
  merge: -1
  img_proc: true
- pgno: 97
  md: '才是真正重要的。华尔街日报有个统计，说有93%的公司认为，有三个来自自由技艺的技能，比任何本科专业都重要。


    这三个技能是批判性思维、交流、和解决问题的能力。


    # 2.三大技能


    所谓“批判性思维”，最简单地说，就是对一个事物进行分析、判断和评价的能力——最最简单地说，就是你不能独立思考。


    比如说，秦朝灭亡，是中国历史上的一个大事件。我们的历史课对这个事件的学习重点和考点都是什么呢？可能是事件发生的时间、参与的各方势力人物、后来人对秦朝灭亡原因的分析之类——这些都是有标准答案的。这就叫不批判性思维。


    批判性思维，最好你得自己给秦朝灭亡原因提出一个说法，然后找各种证据来支持你的说法。就算看别人的分析，你得能对这个分析进行“批判”——其实不见得是批评，这个词在这里的意思是审视：他的证据充分吗？逻辑链条完整吗？有没有偏见？反方的说法有没有道理？


    中国“文科”教育非常强调死记硬背，而真正的自由技艺恰恰是不能死记硬背的。我们在真实世界面临的绝大多数问题，哪有什么现成的标准答案？一个统治者，或者“拒绝被别人统治”者，必须自己做判断。面对各种问题能够运用批判性思维，才是一个独立自主的人。没有这个冷静判断的能力，听说一个什么事情要么就只知道情绪性地宣泄，要么就附和别人的说法，要么就加入一个阵营党同伐异……这些人，大概就配不上“自由”这两个字。——95人笔记


    所谓“交流”，在这个时代我们已经知道很多了，比如说“说服力”、“影响力”、修辞技巧，演讲技巧等等。这里我们特别强调一点：风格。


    风格，是一种非常人性化的东西，它的反义词是机械化。比如同样一个笑话，或者一句特别经典的话，奥巴马说一遍可能效果就非常好，而你如果接下来照着他学一遍，那就完全不好使——你就是机械化的模仿，你没有自己的个人风格。


    说服别人，不能用写学术论文的方法，期待用一大堆数字图表去碾压别人，那样别人只会反感，当你是机器人。没人愿意听机器人的，人们喜欢有风格的人。“我喜欢你的风格”，这简直就是对人最高级的评价。


    可是个性不等于任性。只有通过自由技艺的训练，你对文化有了充分的了解，知道人性是怎么回事儿，掌握各种套路，你才能非常自然地跟别人产生感情上的共鸣。我们看有风格的人，不管是引经据典还是吹拉弹唱，反正他上来几句话就能打开局面，这就是学习过自由技艺的作用。


    所谓“解决问题”，可不是求解一个什么数学方程，而是在复杂世界中解决一个具体的问题。这种问题的难度并不在于有了方程怎么解，而是你根本不知道该用哪个方程！


    自由技艺解决问题的办法，用计算机科学的术语，叫做“模式识别”。用我们中国人熟悉的说法，叫做“定性”。


    比如说公司有个下属犯了一个错误。你怎么定性呢？这只是一个偶然事件呢，还是代表了一个坏趋势必须马上遏制？你从不同的角度观察，了解不同的细节，采取不同的手段，自由技艺里面都有各种历史经验可以让你借鉴。你应该学学刚刚打赢官渡之战的曹操，把这个事情忽略掉，来稳定人心呢？还是学“梦中杀人”的曹操，高调处理，来给自己立威呢？


    这些经验和套路，不但没有标准答案，而且可能是互相矛盾的，但是你反而要多掌握一些，才能灵活运用。自由技艺，就提供了一个装有各种套路的工具箱。


    有了批判性思维，你就能建立正确的认识。学会交流风格，你就能让别人接受你的认识。再加上一个箱子解决复杂问题的手段，就算不去统治人，也不至于被人统治吧？


    # 3.文艺的意义


    近代国人，在潜意识之中，似乎是觉得所谓“素质教育”，是政府和社会的请求，不是个人的事儿，好像花时间学习人文艺术是一种牺牲一样——我牺牲了学习赚钱本领的时间，来参加素质教育，无非是想把自己变成一个好人，让社会对我放心。


    可是在西方学者眼中，自由技艺，恰恰是为自己学的。


    事实上，根本没有任何证据表明学习了自由技艺就能把你变成一个好人。一个就算掌握了批判性思维、学会了说服别人，还能随心所欲地达成各种目的，他完全可以使用这套方法玩转世界，操弄人心，甚至奴役别人。我们看西方有很多文修养很高的人根本就不是好人，纯粹是流氓会武术。


    至于说“文学艺术”，我们一般会说这是为了“陶冶情操”，可陶冶情操又是为了什么呢？难道是为了美容吗？


    科学说的是客观世界，而文艺，说的是从一个主观视角，对世界的主观体验和主观看法。在某一个具体的时刻，站在某一个具体的立场，当事人是一个什么心情？这些体验难以用实验量化，各不相同，没有标准答案，所以才叫做“艺术”。


    我们通过文艺作品了解别人的视角、观点和体验，我们才能够理解别人，进而理解自己。最起码的一点，我能意识到自己的局限和渺小，知道我不是世界的中心！——59人笔记


    而同样地，我也知道我没有必要围绕着别人的中心转。流行文化常常能吸引人去渴望某种生活，而真正的艺术，却能让人质疑那种生活。


    一切人文学科都是历史学科，不了解过去就不理解现在的世界。你得知道这都是怎么来的。你得知道世界不总是，也没必要必须是，现在这个样子。我们是今天这样，只是偶然的文化选择，根本就不是普世的。认识到这些，学会了质疑，我们才能知道还有别的可能性，我们才能去想象别的可能性，才能发挥创造力改变世界。


    归根结底，自由技艺教会我们的，是去做一个独立的人，而不是去做一个工具。


    所以Liberal Arts的关键词，不是“通识”，不是“素质”，不是“人文”，不是“博雅”，而恰恰就是英文和拉丁文原文中的那个词——白由。'
