  md: '# 日课094｜不规则人才


    日课094｜不规则人才


    下面这张图叫雷达图，也叫蜘蛛图，它把一名球员的各项能力指标用一张二维图片显示。这张图说的是梅西在一个赛季的各项统计数据和平均水平的比较。梅西在过人、进球、射门、传球成功率、助攻这些指标上，表现远高于平均水平，你一眼就能看出这是一位伟大球员。


    ![](img/9befb2e4b5878711040fbe72f1245d32_163_0.png)


    这种图的关键在于，它是用一组，而不是一个数据来表现一名球员的水平。玩《足球经理》之类游戏的时候，我们都是用这种图，全面考察球员的各项指标，来判断要不要买入他。


    现在问题来了：在真实世界中，有多少公司在招人的时候，会看雷达图呢？答案是几乎没有。


    今天我们继续说《平均的终结：我们怎样在一个崇尚相同性的世界中成功》（The End of Average: How We Succeed in a World
    That Values Sameness）这本书，作者是哈佛大学教育学教授托德·罗斯（Todd Rose）。


    # 1.你就是一个数字


    普通公司就不用说了，咱們直接说Google。Google，当然是个非常厉害的公司，新人的起薪都能超过十万美元，更重要的是，人们以为在Google工作为荣。但是直到几年前，Google公司的招人方法，并没有什么特别之处。在面试之前，它考察的也就是一个人的毕业院校、大学期间的GPA、和大学入学考试的SAT成绩——总而言之跟考研差不多，就是看你的学业如何。


    按时完成项目的能力呢？与人合作的能力呢？创新能力呢？对不起，你不是球星，没人统计你的那些数据。


    # 2.什么叫“相关”


    之前咱們说过，英国人类学家高尔顿认为人的各项能力指标都是“相关”的——如果一个人聪明，那么他的身体素质也更棒，也更自律，品德也好。


    这个“相关”的意思，就是当一个变量变大或者变小的时候，另一个变量是否也跟着变大或者变小。统计学家用“相关系数”，这里我们姑且称之为“r”，来表示相关度，规定r的值是在-1和1之间。


    ![](img/9befb2e4b5878711040fbe72f1245d32_163_1.png)


    ![](img/9befb2e4b5878711040fbe72f1245d32_163_2.png)'
