  md: '# 日课067 | 心态年轻，你就真的年轻吗？


    我们专栏之前有篇文章叫《中年的大脑更厉害》，说不同的人到中年之后，大脑的衰老速度会很不一样。有的人的大脑衰老很快，而那些用脑多、或者经常参与体育锻炼的人的大脑衰老速度就比较慢。在一定程度上，你对自己大脑的衰老速度是有掌控能力。今天我们来说一个更大的问题：人的身体衰老速度也是这样吗？


    我们看生活中，中年以后，各人的衰老速度似乎是很不一样的。同样年龄的两个人，有的就看上去很年轻，有的似乎就显老。人们还普遍相信，衰老速度跟心态有关系，心态年轻的人身体也更好。


    那么这个说法科学吗？要知道，就算心态跟身体衰老速度真有相关性，这里面的因果关系还不好说——我们完全可以说那些所谓“心态年轻”的人，恰恰是因为他们身体好，才有个好心态。


    所以我们给科学家的关键问题是这个：如果我刻意保持一个年轻的心态，是否就能延缓衰老？


    11月刚刚出版的这期《鹦鹉螺》杂志有篇文章，Why You Can’t Help But Act Your Age：The surprising relationship
    between mindset and getting old（为什么你非得按年龄行事：心态和变老之间的惊人关系），作者Anil Ananthaswamy。文章介绍了这方面研究的最先进展。


    目前为止，科学家的答案是……好消息。


    1979年，有人做了一个至今被人津津乐道的抗衰老实验。实验者招募了一批七八十岁的男性，在一个修道院里像度假一般度过了5天，这5天的活动主题是“假装现在是1959年”。他们讨论1959年发生的事情，读1959年的书，听1959年的广播，用特意找来的老黑白电视观看1959年的电视节目，甚至还收看了一场1959年的体育比赛的“直播”。


    五天后，实验人员给这些人体检，发现他们的记忆力、视觉、听觉，以及身体力量都比参加活动之前更好。让不知情的外人看他们活动前后的照片对比，人们普遍认为活动后的照片看起来更年轻。


    实验还有个控制组，控制组中的人也是在修道院度过同样的时间，但不是假装自己回到了20年以前，也没有各种环境配合，实验人员只是要求老人回忆自己20年前是什么样子。结果控制组的人就没有收获变年轻的效果。


    如此说来，“假装年轻”，似乎真的可以让人变年轻！我甚至想到，这里有商机啊！现在完全可以搞些针对老人的“年代体验”旅游项目……


    问题在于，当时这个实验搞得不是特别严格，还不能被科学界广泛接受。研究怎么让人“变年轻”，想要获得有足够说服力的结果，其实非常困难。


    一个最起码的技术问题是，你怎么“测量”一个人的生物年龄？现在有人的时钟年龄是60岁，你说他保养得好，他的生物年龄——也就是他的身体所表现出来的年龄——只有50岁，请问你这个50岁是怎么算出来的呢？


    这个问题困扰了科学家很长时间。过去人们尝试过血压、体重这类显然就不准确的判断标准。20年前，生物学家一度发现“染色体端粒”是式破碎机？是一个好的指标，年龄越大的入
    实际上文本：20年前，生物学家一度发现“染色体端粒”是…… 。


    最近几年才出现一个比较客观的指标——DNA甲基化水平。生物学家注意到，器官的衰老会改变人的基因表达。人的基因组中，有些基因的甲基化水平随着年龄增长而增长，有些基因的甲基化水平随着年龄增长而下降。但如果你能用一个数学模型把这些基因综合考虑，你就能很准确地描写一个人身体各部分器官的衰老程度。2013年，生物学家就有了这么一个测量生物年龄的手段，叫做“表观遗传学时钟（epigenetic
    clock）”。


    实际上科学家还没有在分子水平上搞清楚为什么这个“表观遗传学时钟”能反映衰老水平，但最起码现在我们有了一个好工具。


    有了这个精确工具，人们一下子就取得了不少有意思的研究结果。首先人体不同器官的老化速度是不一样的，你可以给每个器官测定一个生物年龄。另外，每生一场大病都能加速衰老，尤其是唐氏综合征和艾滋病。阿尔茨海默症（Alzheimer''s
    disease，俗称老年痴呆症）会加快大脑的额前叶区的衰老。癌症更会极大地加速人体的衰老。


    好了，那么今天的科学家，对“心态影响衰老”的问题有什么说法呢？


    有个令人振奋的初步研究结果，说让人做些冥想之类的思维训练，咔怕只训练一天，也能显著地影响这个人的基因表达水平！既然基因表达水平跟衰老程度有关，这个结果似乎暗心态可以影响衰老。


    还有更有意思的研究。实验人员招募一些2型糖尿病患者玩电子游戏——给每个人发一个闹钟，要求患者们每过15分钟，就换一款游戏玩。实验的秘密是这些闹钟都被做了手脚，有
    的走得快，有 的走得慢，有 的准时。结果发现，闹钟走速更快的人血糖水平的变化速度也更快！这说明糖尿病人的血糖并不是根据“实际时间”的变动来发生变化的，而是根据个人“对时间的感知”来变化的！


    那么我们能不能把这个结论推广出去，说如果我们感觉时间过得快，衰老速度就快？目前来说这都是推测，可是似乎有这种可能性。


    还有研究表明，人对自己年龄的“主观认知”，会对身体机能和认知能力产生影响。比如你今年60岁了，但你却得认为自己是50多岁，那么你的走路速度、身体强壮程度、手
    的握力、头脑的认知能力以及反应速度都会比一般同龄人更好。不过，这就又会回到我们一开始的那个问题，到底哪个是因，哪个是果呢？


    这有个很漂亮的实验。实验者将老人分成两组，都是先做关于主观年龄认知的问卷调查，然后做握力测试。测试之后，第一组的老人受到了实验人员的夸奖：“哎呀你这个握力水平厉害！击败了全国80%的同龄人！看来咱老人家身体比较年轻啊。”而第二组的老人就没有这个待遇。


    接下来两组老人再做握力测试，结果发现得...'
