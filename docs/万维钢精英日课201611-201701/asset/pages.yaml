    \n万维钢\n历史上数学家利用统计方法在赌场赢了很多钱的事情发生过很多次，所以这件事的确是可能的。但这绝对不是说随便找几个数学家/统计学家到赌场就能赢钱。统计方法只是工具，你必须对这个具体的赌博项目非常、非常有研究才行。事实上现在扑克比赛中手都在使用统计知识。所以赢钱的与其说是偶赌博的数学家，不如说是使用了数学知识的赌徒。赢钱也不是把把赢，总要玩很多很多把，只要确保赢多输少就是“系统性地”赢钱。首先，这是可行的。\n\
    但是赌场也不傻。如果使用什么统计方法能在某个赌博项目上“系统性地”赢钱，那就说明这个项目有漏洞。如果没有问题就应该改进设备，如果规则有问题就应该改进规则。事实上，赌场现在也在雇佣数学家设计赌具。\n\
    总的来说，这是一个道高一尺魔高一丈的博弈过程。没有一个方法能长期地、系统性地赢钱——否则赌场不用开 了。你发现一个漏洞，赌场会弥补这个漏洞，然后你还可能发现新的漏洞。所以数学家要想在赌场赢钱，必须得有创造性才行。\n\
