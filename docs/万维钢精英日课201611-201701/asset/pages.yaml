  md: '# 日课062 | 《混乱》解读4:特朗普的打法


    日课062 | 《混乱》解读4:...


    这时候可能人人都在谈论刚刚揭晓的美国总统大选，而今天我们还是继续说蒂姆·哈福德的《混乱》——不过这次内容，我要说的恰好是特朗普的竞选策略。


    这并非是我有意为之。特朗普是哈福德这本书第五章的三位主角之一。


    正如吴军老师在上周末回答我提问的文章里说的那样，美国主流媒体对特朗普抱有极大偏见。一直到昨天，所有主流媒体的预测都是希拉里大概率获胜。难道所有那些统计机构的数据和模型都有毛病吗？


    就在昨天，也就是选举日当天，《纽约时报》发表社论文章：What 2016 Has Taught Us（2016教给我们什么），文章说美国人能从2016年学到的第一个教训，也就是特朗普竞选的秘密，是“贩卖仇恨”。这个态度，跟希拉里的说法如出一辙：特朗普的支持者都是可悲的种族主义者、厌女症者和阴谋论者！


    这帮人输了，还不知道自己是怎么输的。


    哈福德知道。


    为了理解特朗普的胜利，我们得先从亚马逊创始人杰夫·贝佐斯的创业史说起。


    对今天的互联网创业者来说，1994年真是令人无比神往的一年。那一年，整个互联网的流量是前一年的2000倍——那是一个稍纵即逝的窗口期，而没有多少人意识到这个机会有多么可贵——微软公司，甚至连公司主页都没有。


    局面太混乱，巨头们看不清楚。——关键词：混乱。


    而当时在华尔街工作，有一份高薪的杰夫·贝佐斯，决定辞职创办电子商务公司。亲朋们劝他等到年底再辞职——因为会有notin a very high year-end
    bonus——但是贝佐斯已经等不了了。他给公司起名为“亚马逊”，因为“亚马逊河能把其他所有河流挤压干净”。


    1995年，亚马逊正式在网上卖书。那时候在微软还没有推出IE浏览器。


    贝佐斯宣称，亚马逊的书价格保证比传统书店便宜，亚马逊有超过一百万本书可供选择，如果你对一本书不满意，亚马逊可以不问问题立即给你退货。但实际上，贝佐斯根本不知道怎么实现这些承诺！他打算干起来再说。


    亚马逊上线第一周，销售额就达到了一万四千美元，可是公司人手有限，只发送了八百多美元的货。所有人都疲惫不堪，已经是全体吃住在公司。


    就在这时候，雅虎总裁杨致远给贝佐斯发了个电子邮件，问他是否愿意把亚马逊网站列在雅虎主页上——当时没有那么多网站，人们上网的第一步就是去雅虎。贝佐斯的计算机工程师吓坏了，说我们根本吃不消那么大的流量，如果你答应，就等于拿消防水管喝水！贝佐斯答应了。


    他总是在自己没准备好，甚至可以说是根本就没准备的情况之下，见到机会马上就行动。


    亚马逊开始在卖书之外再加上卖厨具的时候，公司的分货设备还只适合分书。亚马逊宣布开始卖玩具的时候，公司库存里就没有玩具可卖。贝佐斯说拍个发布会吧，于是公司高层只好全体出动，刷自己信用卡到当地Toys"R"Us实体店扫货，拿回来摆给记者看。


    从实体店，用零售价格买东西，拉回亚马逊，再在网上以低价卖给消费者，不为赚钱只为占领市场，这居然成了2001年圣诞节期间亚马逊的主要做法。他们派出员工，把几个地方的主流商店里的玩具买光，甚至几乎是把Toys"R"Us的玩具整体都给买回来，像搞行为艺术一样为了在网上卖东西而在网上卖东西！


    金钱上的损失极大，这还不算运送发货过程中又损坏和浪费了很多，可是2001年的圣诞攻势必须打下来！


    那一年的消费者记住一件事：最大的连锁玩具店，Toys"R"Us，没有保证圣诞节礼品的供货，而亚马逊做到了。


    后来亚马逊搞Kindle和电子书，搞第三方市场，搞云计算，都是这样的打法：


    > ——看到机会不顾一切先冲进去再说，以不符合成本的低价抢占市场，然后再面对根本吃不下来的流量、资金流断裂的危险、和各种技术问题。

    109人笔记


    那时候，贝佐斯曾经到哈佛商学院去做过一次演讲，说了自己公司的这套发展壮大的方法，而从教授到学生，哈佛人给他的不是赞赏，是同情。有个MBA学生当场就跟贝佐斯说：“我看你这人不错，十分感动！但是你还是赶紧把公司卖给Barnes
    & Noble吧。”


    Barnes & Noble，全美一家独大的连锁书店，所有店铺都在各地最繁华地段，向上控制了出版社，向下掌握了消费者，根本没把亚马逊放在眼里。


    在这些这些巨头眼中，电子商务的前景太混乱了。局面不清楚，就没有必要改变自己的核心业务，更没必要把自己最好的人手转到这个方向上去。不过Barnes & Noble还是给了贝佐斯一个收购offer，贝佐斯拒绝了。


    站在巨头角度，贝佐斯这种颇前不顾后，只知道进攻没有坚实基础的打法，根本不可能成功。


    可能他们忘了，历史上有人就是用这个打法，取得过惊人的成就。


    # 2.隆美尔


    ![](img/9befb2e4b5878711040fbe72f1245d32_30_0.png)'
