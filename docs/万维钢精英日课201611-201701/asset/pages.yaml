  md: '# 何帆拜年 | 严肃小说：因为虚构，所以真实


    何帆拜年 | 因为虚构，所以...


    《精英日课》的读者，你好！我是隔壁专栏《大局观》的何帆。今天来日课串门拜年，祝你新春大吉，新年进步！


    当我年少无知的时候，我是个文学少年。后来把想当诗人这件事给忘了，但读小说的习惯还是保留了下来。今天，我给万维钢老师当文学课助教，跟大家讲讲，为什么要读严肃小说，哪些小说既严肃、又好读。


    多读严肃小说的第一个好处是能够锻炼我们的移情（empathy）能力。


    移情不是同情（sympathy），同情是跟别人有同样的感受，移情则是能够在不同的境况中理解别人感受。这是一种能够从全局出发，由小见大、见微知著、能够在看起来没有联系的事物之间找到相互联系，能够在看起来不合情理的现象中发现规律的能力。成功人士各有特质，有的执著，有的胆大，但有一类人不仅成功，而且睿智，他们的秘诀就是具有强大的移情能力。


    红杉资本的合伙人莫里兹是硅谷最成功的风险资本家之一。硅谷的风险资本家大多是学技术出身、或是读过商学院，莫里兹和他们不一样，他在牛津大学读的是文学，年轻时候的梦想是成为一名像诺曼·梅勒那样的作家。他的投资风格和其他风险投资家也大相径庭。他并不看重前沿技术或是市场预测，他关心的是公司的创始人是什么样的。他的本领就是能够和公司的创始人产生共鸣，能够理解他们心中的梦想。


    有一天，一个小伙子找到莫里兹，跟莫里兹说，自己想做搜索引擎业务。当时，搜索引擎业务已经是一个“红海”，包括雅虎、微软和美国在线在内的商业巨头都斥巨资研发这一技术，当时这个小伙子和他的团队一没有钱，二没有经验，硅谷里其他十几个风险投资基金都没有搭理他们。不管别人的怀疑，不管别人的耻笑，莫里兹坚持给了这家企业1250万美元。这家企业叫Google。


    移情能力在很大程度上是一种天分，但也可以在后天继续锻炼。阅读严肃小说，可以为你提供一个个案例，让你置身局中，体会各种不同的人生。好的小说，不管多么离奇荒诞，都是源自生活的，而且能够超越时空，让不同时代、不同国度的读者形成共鸣。人物传记看似更真实，但人的记忆都是有偏差的，尤其是自传，未必客观准确，不可尽信。小说是虚构的，也正是因为有了虚构的幌子，作家才能尽情地把真实的故事讲给你听。“假作真时真亦假，无到有时有还无。”


    多读严肃小说的第二个好处是提升你的道德境界。


    道德不是说教，而是在遇到复杂问题时的审慎取舍。学习道德的一种途径就是思考在遇到各种道德两难困境时何去何从。比如，我们很熟悉的“电车悖论”：一个疯子把五个无辜的人绑在电车轨道上，一辆失控的电车朝他们驶来，你可以拉一个拉杆，让电车开到另一条轨道上，但另一条轨道上有一个又瘸又哑的老人，根本没有看到电车朝他驶来。你会拉这个拉杆吗？


    捷克作家米兰·昆德拉说，小说就是要悬置道德判断。好的作家不会在作品中宣传教化，他会不动声色地把人性中光明和黑暗的地方都呈现给你，让你自己来做选择。这往往是没有标准答案的选择题。你选择了任何一个答案，都会有相反的观点跟你争辩。“人类一思考，上帝就发笑”。没有人有终极答案。好的小说让你更加宽容，更加谦卑，对人类更加悲悯，对人性更多理解。


    多读严肃小说的第三个好处是能提高你的写作能力。'
