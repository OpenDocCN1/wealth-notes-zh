    # 日课111｜站着挣钱的互联网公司


    日课111｜站着挣钱的互联...


    今天咱们继续说吴修铭（Tim Wu）的《注意力商人：进入我们脑袋的史诗争夺》（The Attention Merchants: The Epic Scramble
    to Get Inside Our Heads）这本书。


    前几期日课我们一直在说一个问题：互联网注意力商人为什么不赚钱。学传统媒体、中心化的新闻不赚钱，发扬互联网特点、去中心化的博客不赚钱，聊天室吸引人可是pal不赚钱，低俗内容更吸引人可还是不赚钱。


    注意力商人从来不在乎挣钱的姿势——可是在互联网上，他们就算跪下，都挣不到钱。


    2010年以前，真正能通过互联网广告赚钱的公司只有Google。而Google，是站着就把钱挣了。


    Google的首页只有一个搜索框，没有任何广告。在很多时候搜索结果里也没广告。只有当某个广告正好和你的搜索关键词相匹配，Google才会显示它。只有当你点击了这条广告，Google才会向商家收钱。


    这种做广告的方法不但作风正派，而且效率奇高。对广告商来说，用户既然搜索这个词，就说明他已经有相当明确的购买意愿，这时候的点击是最优质的点击，广告商当然愿意为此出一个高价。对用户来说，他既然搜索这个词，就的确是想了解这方面的信息，他不会反感看到相关的广告，甚至可能还乐意看到广告。这就叫双赢，这就叫用户体验！


    而当时绝大多数网站的用户体验都很不好。各种飘浮的广告，什么人什么内容都有，像个菜市场。后来人们分析，体验差的一个重要原因是匿名。早期人们还能从匿名中获得新奇感，很快匿名就被滥用，哪个网站都有一大堆躲在匿名后面的喷子（英文叫
    “trolls”，直译为 “怪物”），发评论就是为了激怒你。很多公司意识到匿名不是优点，要想让用户良好互动，就必须实名。


    最早使用实名制的主要是一些婚恋交友网站，比如Match.com。Facebook进入社交网络的时机其实已经有点晚了，它有的功能别人都有，那为什么Facebook就成功了呢？


    一个原因是Facebook起源于哈佛大学的校园。学生们在真实世界里已经有一个社交网络，现在Facebook只不过把这个网络搬到 “网” 上。有这么一群集中的用户，规模效出得非常快——哈佛的学生，居然会为了上Facebook而逃课！有人表示自己第一次使用Facebook就不能自拔，坐在那里连续浏览了好几个小时。


    几个小时都干什么呢？加别人为朋友，和同意别人的加朋友请求。最早的Facebook就只有最基本的功能——每人一个个人主页，然后就是互相加朋友。而这就足以让哈佛的学生疯狂了！主页显示自己有几百个好友，而且都是真名实姓的人，这是极大的社交满足感。


    本来，大多数人上交友网站是为了寻求浪漫关系，而Facebook特别聪明的一点，是从一开始就没有把浪漫关系作为卖点宣传。其实我们在生活中加入某个俱乐部或者社团，就算目的是为了浪漫关系，也不会直说，目的太明确反而没意思。Facebook定位在更一般化的交友网站，还大大拓宽了用户来源，你可以纯粹为了和同学保持联系而使用Facebook，这样的关系可以在毕业后长期存在。'
