  md: '# 日课118｜中国的自豪感和美国的文化


    日课118｜中国的自豪感和...


    万维钢


    今天我们继续请Jobs2Careers CEO葛振洲讲他在美国的创业心得。这是文章的下半部分，主题是中美文化的碰撞。


    # —— 中美文化的碰撞 ——


    # 1.最有价值的美国传统


    2007年起步的时候，由于经费紧张，我不得不OCI国内招聘一些员工。因为既没有微软谷歌的品牌，又没有经费，我能够招到的大部分都是二本、三本的毕业生。我发现很多员工非常难以激励。直接体察到的现象
    basically 是这样的：


    经理不在的时候，他们在玩游戏。


    如果接受到经理指派的任务，他们会很快做完，但是不会检测质量，而且不会汇报。


    经理不问，他们不会发声。所以不可能提出什么建设性的意见帮助公司。


    员工如果是这种心态，智商再高也没意义。中国社会到底有一种什么因素导致这种心态普遍存在？我找到的答案是 “Entitlement” —— 中文翻译成 “应得权利”
    —— 认为自己的权利是应得的，而不讲义务。


    如果让我评价美国传统之中最有价值的是什么，我会说是 “独立的精神”。所谓 “独立”，就是 “善待别人，但是不期望被别人善待。” 与独立精神相反的就是 Entitlement：“要求被善待，甚至是特殊对待。”


    独立的人会感恩。因为对别人没有过多的苛求，所以获得帮助的时候常常感恩。因为感恩，也对其他人公平，所以公平也成了一个自然的性格特点。独立的人做事情的时候知道自己不会得到太多别人的帮助，所以也很少抱怨。没有达成目标的时候会持续地努力。独立的人很少会有情绪，所以也非常理性。这些特征都是领导魅力的组成部分。


    21人笔记


    相反，一个讲Entitlement的人不会感恩，他们常常逃避或推卸责任，抱怨，对别人苛责，冷漠。做起事情来也很容易泄气。这样的人自然很少有人愿意追随。


    为什么现代中国文化中缺少独立精神，而Entitlement却很普遍呢？我想主要说说价值观上的原因。中国现代价值观的核心是 “爱与包容”。这种价值观非常适用于家庭，却不能使人独立。


    从爱与包容，到Entitlement的逻辑演化过程大概是这样的：为了劝导人们行善，发 incerica 一? 善有善报，恶有恶报”、“人在做，天在看”，这些理论虽然有效劝人行善的效果，但是改变了我们行善的动机：我们行善的目的是在上天那里攒积分，自认为攒够了积分以后，上天就会自动让别人善待于我。我们还是在期待别人（包括上天）的
    “爱与包容”！甚至还有了道德优越感，认为别人对自己的善意是理所应当的。这样就形成了Entitlement。


    # 2.避免与主流社会的隔阂


    我认为部分华人对西方的态度其实是有失公正的，无形中给自己造成与主流社会的隔阂。近两百年的历史对中华民族的自信 心打击很大，骄傲和自卑同时存在，心态容易纠结。表现出来，就是某些华人对某些事情特别敏感，让美国人很难接近。比如说——


    不断地强化《排华法案》等华人屈辱历史。华人主动给自己制造了一个 “你们欠我们的” 道德优越感 —— 可是反过来想，如果有个人跟你谈话的时候，带着一种道德优越感，你是不是会避之不及？


    召唤民族情绪，带着一种竞争对抗心态。比如说我们随时关注中国在科技、经济方面的各种成就，想着 “总有一天我们会超过美国”。爱国之情当然好 —— 可是试想如果你的同桌好友每天都在暗暗努力，准备有一天把你比下去，你还会开心地和他做朋友吗？


    华人群体对 “种族歧视” 过分敏感，导致各种极端的故事被传播和放大，然后又让普通华人更加敏感。这种敏感本身就是种族歧视的放大器，甚至是无中生有的直接原因。


    因为这个问题很普遍，所以特别给大家介绍一下我对待 “种族歧视恐惧症” 的心法。


    很多华人如果接触到一些普通的美国人，往往会把他们的行为放在 “种族歧视” 的框架上测试。这实际上是一种自我中心的思维模式导致的。我认为真正的现实世界是这样的：他们根本没有时间思考如何对待你，因为你不能关切到他们的切身利益。更不要说什么美国人对中国文化和中国人的总体态度
    —— 美国人根本没有想过中国的事儿，或者仅仅是粗略地有些概念而已。要知道大部分普通人都是自我中心的，他们关切的是利益。种族差异问题可能偶尔也会成为议题，但是对他们来说，真是一件太不重要的事情了。


    如果有一个美国人对人缺乏耐心，他们的内心最有可能是这样的：“这个人对我没有什么价值，还要求我给他特别的关注……” 这种心态虽然不友好，但是也算不上什么种族歧视。可
    是常常会触动华人敏感的神经。'
