  md: '# 周末小议 | 答吴军老师:"好人"为什么没去竞选总统


    周末小议 | 好人为什么没去...


    跌宕起伏的2016美国总统大选结果即将揭晓，隔壁吴军老师的《硅谷来信》和王烨老师的《王烨大学问》专栏，都在连载讲解美国政治。


    我和吴军老师各自给对方提了一个有关大选的问题。


    吴军老师给我的问题是：


    > 这次大选的两个候选人都不能让人满意，为啥两党找不到更合适的人？这种情况下是否投票率会很低？


    今日周末，我们同时回答。


    这次大选的两个候选人，希拉里和特朗普，都有非常严重的缺陷，甚至可以说是很不像话。一个是从政三十多年没有任何政绩，犯了很多错误，而且还涉嫌严重的腐败，不但不应该当总统而且应该进监狱；一个是没有任何从政经验，说话满嘴跑火车，让人怀疑他可能根本就不懂什么国家大事。


    对选民中的正人君子来说，这一票的确是投给谁都很难情愿。通常我们理解的选举应该是从两个好的之中选一个更好的，而这届选举，可能相当多的人面临的局面是从两个坏的之中选一个更“不坏”的。


    ![](img/9befb2e4b5878711040fbe72f1245d32_15_0.png)


    而且不仅仅是希拉里和特朗普。在两党初选的时候被他们淘汰掉的那十几位候选人中，也没有特别出色的人物——有的比他们更极端，有的ase是一看就是平庸之辈，有的就是跳梁小丑。


    这届候选人不行。


    那么美国的好人都哪去了？这个特别崇尚英雄的国家，现在怎么就没有一位体面一点的英雄出来竞选总统呢？


    这其中大概有制度的原因，也有历史进程的原因。


    美国是一个非常多元的国家，政府能做、该做和想做的事都很少，从政本来就不是能人的理想。想获得荣誉的可以当科学家，想改变世界的可以当企业家，想出名和有钱的可以当演员——美国最高法院大法官的年薪大概是20万美金，而常年在电视节目里扮演某个大法官的一位演员，年薪则是几百万甚至上千万美金。这些职业的自由度都比当总统大得多，甚至可能连影响力都比总统大。


    和平年代，如果国家没有什么危机，在国会权力制衡之下，美国总统能做的事情非常有限。我们专栏之前有篇文章，《总统、CEO、好学区：到底是你们厉害，还是天气好？》，其中就提到，有经济学家经过研究测算，美国总统选择什么样的政策，对国家经济增长来说几乎没有影响。


    而且现在两党党争愈演愈烈，甚至到了一党的提案会遭到另一党议员全体反对的地步，总统就更加寸步难行。奥巴马第一个任期，在自己声望很高、自己的党在国会还占有多数的情况下，也才非常勉强地、甚至可以说是有些危险地通过了一个几乎没有什么重大改革的医保方案。奥巴马有一次在国外访问，居然公开说了一句“华盛顿那帮人把我当条狗”。谁如果指望自己能振臂一呼，横扫特殊利益集团，给美国带来一个焕然一新的重大改革，大概应属白日做梦。


    当上总统没啥可干的，而为了当上这个总统，还必须付出极大的牺牲。


    一个体制内的政客，如果想当美国总统，不管他有多大的理想，他都必须做以下这些事情：


    +   1. 选边入伙。也可能他看两党都不顺眼，可是 Dra,不入伙就无法得到党的支持，入了党就得参与党争。 2. 长期做些底层的事情。走行政路线当市长、州长，收入低、工作琐碎，远远不如当公司CEO有意思。走立法路线，常年都在忙竞选，很多精力是用来筹措竞选经费——民意如同小孩，比中国古代小皇
    帝还难伺候。 3. 各种见不得光的私下交易，为利益集团代言。不交易别人就带你玩，不代言就没有经费。 4. 万一运气真好到有机会竞选总统，你必须设法搞到很多很多钱来做竞选经费，这并不容易。
    5. 还要牺牲自己和家人的隐私，面对各种无耻的攻击。


    好人谁愿意做这些事情？而且事实上，那些经历了这一切，慢慢从基层一步步爬上来的老油条，往往并不适合担任总统职务，选民也看不上他。


    一方面是总统干不了什么，另一方面是也不需要总统干什么。更何况每年才有一个总统名额，中奖率太低前期投入太大，所以现在第一流的人物大概不会一开始就打定主意要当总统。


    美国选民比较欢迎，而且也被证明是好总统的候选人，往往是先在别的领域取得成功，中途从政的人物。威尔逊是大学校长，艾森豪威尔是二战名将，布什是商人，卡特是农场主，里根是演员，肯尼迪是战斗英雄，还写书得过普利策奖。


    但是，这些人愿意出来当总统，并且能当上总统，需要历史条件。首先历史得给他们机会证明自己，其次他们得觉得总统是个值得干的工作。


    可是过去几十年美国天下太平，并没有多少机会出英雄——麦卡恩的所谓“战斗英雄”只不过是他在越南被俘虏过！国家看起来一切正常，能人最好的选择是到硅谷搞个高科技公司干。


    希拉里是个特别平庸无能的政客，但是非常...'
