  md: "# 日课103｜《注意力商人》解读3:希特勒的注意力大杀器\n\n日课103｜希特勒的注意力…\n\n今天我们继续说《注意力商人：进入我们脑袋的史诗争夺》（\
    \ The Attention Merchants: The Epic Scramble to Get Inside Our Heads ）这本书，作者吴修铭（Tim\
    \ Wu）。\n\n上次我们讲到，广告人的影响力非常之大。不过在电子媒体出现之前，广告的渠道其实是非常有限的，无非就是报纸、杂志、街头海报之类。书里就肯定不能插进广告，一直\
    \ 到今天也没有人在书里插播广告。当年，美国人曾经尝试在电影院播放电影的过程中插进广告，结果观众很不买账。\n\n那时候的注意力商人可以说是纸媒的衣食父母，但是他们很难插手\
    \ 娱乐业。\n\n直到第一个大规模注意力收割武器的出现 ——\n\n收音机。\n\n# 1.黄金时间\n\n1928年，美国NBC广播电台开播了一档类似于广播剧的节目，《阿摩斯和安迪》（Amos’n’\
    \ Andy），每天晚上7点播一集。按今天标准看，这个广播剧相当简陋，演员只有两个——一个扮演阿摩斯一个扮演安迪，节目全程就是这两个人的对话。你说这是广播剧也行，说这是脱口秀也行……\n\
    \n但这其实是历史上第一个情景喜剧。你甚至可以说，这是后世所有电视连续剧的祖师爷。\n\n《阿摩斯和安迪》已经运用了后世电视剧的常用技术，比如说设置多个悬念线索，整部剧围绕着这两个主人公的感情生活展开，充满戏剧张力，让观众始终保持兴趣。\n\
    \n这部剧成功到什么程度呢？每天晚上，全美国有4000万人，有时候甚至能达到5000万人收听，相当于全国1.22亿人口的三分之一！现在美国的一年一度“超级碗”直播也就是这个规模，而这可是每天一场\
    \ 的超级碗！\n\n而且这个超级碗还只插播一个广告：“本节目由xx牙膏赞助播出”——这是第一个全国流行的广播剧，也是第一个以广告商赞助的形式出现的广播剧。\n\
    \n那乡以前的广播节目难道就没有广告吗？真的很少有。那时候人们普遍认为广播是个特别高大上的信息传播方式，应该专门用于新闻和教育节目，岂能商业化……之前还流行过在公共场合一屋子人盛装\
    \ ect 坐听广播的风俗。就像上世纪九十年代极客们玩新闻组和 BBS一样。\n\n《阿摩斯和安迪》对娱乐业的最重要贡献，却是它开创了“黄金时间”这个概念。\n\
    \n我们可以想想这个情景。本来可以有各种活动的 一家人，一到晚上7点，就聚到一起安安静静地坐在收音机前，等着收听一个广播剧！如果不是收音机，还有什么东西，能让全国人民，在同样的时间，做同一件事情？而且还每天都做？\n\
    \n这是意识的共享，这是共同的体验！\n\n这是一个无比可怕的力量。它能把所有人团结起来，像一个人一样行动。\n\n最后把这个力量用到极致的，是一位德国的注意力大师，他也曾是一位广告人\
    \ ——\n\n阿道夫·希特勒。\n\n# 2.希特勒的宣传观\n\n希特勒在1910年代的时候，曾经在维也纳以绘制广告海报为生，他那时候就对广告产生了非常深刻的理解。他的理念比一般知识分子和普通的广告人都高明很多。\n\
    \n希特勒把广告思维升级了，然后用到了国家宣传上。\n\n收音机在二战前的德国已经非常普及，覆盖了70%的家庭，相当于5600万的人口，被称为“人民的接收器”。德国人经常参加围绕收音机组织的活动，比如在大厅、学校这些公共场合集体收听重要的广播。但是希特勒之前德国的广播电台，经常犯一个知识分子特别容易犯的错误——\n\
    \n在还没有获得听众注意力的情况下，就把道理说得特别复杂。\n\n那谁还有耐心继续听你说呢？\n\n资深广告人希特勒一上手，就给国家宣传带来了全新的理念——\n\
    \n+   1. 宣传的对象绝对不是知识阶层，而是文化程度不高的底层大众。面向有科学思想的知识阶层做宣传是毫无意义的。\n2. 宣传的目的是引导，而不是告知。你要敢于让别人照你说的做，甚至照你说的想。\
    \ \n3. 宣传的手段是重复。普通大众接受信息的一个特点是速度非常慢，说一遍他们可能根本没有记住，一定要素要重复、重复、再重复。 \n4. 宣传的内容不能复杂，也不要列举一大堆道理，只要总结出来简单几条即可。最好是口号化，反复重复这几条口号，一直\
    \ 到这些口号深入人心，达到能主导人们的思想的程度。 \n5. 要调动感情。动之以情比晓之以理有用得多。教育、劝说的效果都不如直接诉诸感情。 \n6. 人民喜欢强硬的领导人。作为一个领导人，需要在人民心目中保持一个非常强硬、非常坚定的形象。不用去劝说人民，直接给他们下命令就是最好的做法。\n\
    \n咱们再看看希特勒的演讲。希特勒从一开始就是凭借演讲能力上台的，在执政的过程中，始终依靠着自己的演讲魅力去蛊惑人心、施展权力。希特勒的演讲套路，说起来你可能比较熟悉——\n\
    \n+   1. 始终保持同样的、笔直的站立姿势，用自己特有的手势。 \n2. 以长时间的沉默开口。（咱们日课之前有篇文章，《大人物演讲法》，也提到过这个技术：一上来先沉默。）\
    \ \n3. 先用一个低沉的语气讲述自身经历，主动暴露自己感情上的弱点，比如自己当年作为士兵在战争中的迷茫和无助感。（咱们日课之前有篇文章，《怎么样快速跟人建立亲密关系》，也说过这个技术：暴露弱点能让人更加容易接纳你。）\
    \ \n4. 诉诸感情。慢慢提高语调和语速，宣泄对犹太人的仇恨。 \n5. 直接号召人民按照他的理念去做，一起努力让德国变得更加伟大。\n\n事实证明，希特勒这一套简直是太有效了。据有人后来回忆，处在当时的德国，聊聊本来对政治完全没兴趣，听完他一场演讲也会很不得马上为他效力！\n\
    \n宣传，是比广告更厉害的武器，是撼动人心的大规模杀伤性武器！\n\n# 3.广告与宣传\n\n吴修铭写写写到这里，对广告和宣传的关系做了一番反思。他的出发点，是个人自由。\n\
    \n吴修铭说，所谓自由，就是你知道世界上 有各种不同的选择，而且这些选择对你来说都是可实现的。\n\n从这个角度来看，好的广告其实是增加了我们的自由。广告可以告诉我们一些我之前不知道、但现在唾手可得的选项。比如市场上多了一款新型牙膏，你不买也可以，要买的话随便花点钱就能买到，这就是扩大了你的自由。"
