  md: '# 答读者问｜怎么评价"善意的谎言"？


    # 来自日课：业余时代的终结


    万老师在怀念业余生产力的美好时光！

    话说中国互联网在很多方面领先美国，请问美国有类似“得到”的产品吗？


    万维钢


    据我所知没有。不但没有“得到”，而且没有《罗辑思维》。在线课程有，非技术性的系列讲座有（The Great Courses），演讲有（TED Talks），连续更新的讲座节目也有（Podcast）——但是人格化的、跟观众有强烈连接的、强调“服务”意识的知识产品，没有。


    突然想问：是不是说我们活在这个世界上，不是被别人占用业余时间就是在占用别人的注意力呢？还是说我们只要认为自己生产的内容好，就应该放心大胆地去占用别人的注意力？


    万维钢


    注意力是个有限的资源，但也是一个不可积累的资源。我们和别人每时每刻都在花费注意力，不用在这里就用在那里。占用别人的注意力没有什么不好意思的——你不去占领，更差的内容就会去占领。


    # 来自日课：怎样（不）说谎话


    事实性误导确实是一个替代说谎的方式，但是如果对方是日课会员，所以打破砂锅问到底呢？这种情况如何应付对于事实性误导的二次、乃至三次的提问？请老师教一下哈，真怕用这个技能的时候遭人反杀。


    万维钢


    追问是失礼的行为。正式场合一般不会对私人问题问了还追问，提问的人会感到自己太八卦了。如果对方失礼在先，你就有权继续跟他绕，甚至拒绝回答。


    可不可以讨论下人们对“善意的谎言”是怎样的一个评价呢？


    万维钢


    善意的谎言也是谎言。跟人说一个善意的谎言，就等于把这个人当小孩看——你认为他处理不了，或者接受不了事实。有些人不愿意被当做小孩。


    # 来自日课：站着挣钱的互联网公司


