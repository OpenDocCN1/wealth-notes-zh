  md: '# 日课092｜把人变成工业品的思想（下）


    日课092｜把人变成工业品...


    今天我们继续说托德·罗斯的《平均的终结：我们怎样在一个崇尚相同性的世界中成功》（The End of Average: How We Succeed in
    a World That Values Sameness）这本书。


    上次说到，凯特莱和高尔顿关于“平均人”的两个思想，从十九世纪中也开始，慢慢地深入人心。而真正用这两个思想改变世界的，则是两位实干家。


    第一位，就是因为发明了“泰勒制”工作法而闻名世界的弗雷德里克·温斯洛·泰勒（Frederick Winslow Taylor）。


    # 3.系统比人重要


    就好像现在比尔·盖茨和扎克伯格从哈佛退学创业一样，泰勒当年也是放弃了哈佛，直接创业，当时是1890年代。泰勒关注的，是怎么提高工人的工作效率。


    当时美国企业的工作效率确实堪忧。工人非常不专业，工作效率参差不齐，工人离职率也相当高。泰勒的改革思想，最直接的启发来自他的中学数学老师。


    这位老师总是让所有学生当着他的面做数学题，谁做完了就举手，他记录每个学生花费的时间，然后计算出一个平均值。而这位老师留作业的标准，就是“平均人”做两个小时所能完成的题目数量。


    泰勒就想，我能不能把这个办法用在工厂工人身上呢？正好他还是凯特莱的信徒，非常理解“平均人”的思想。泰勒考察了工厂里每一道工序上，若干个工人所需要耗费的平均时间，就把这个时间作为标准时间。类似地，他还可以计算固定时间内，一个工人平均能完成多少工作量，作为标准工作量。


    “泰勒制”的核心思想，就是这个标准化。我不要要求你做得多，我也不要求你做得快，我要求你在标准的时间内完成标准的工作量。泰勒说，只有一种好的工作方法，那就是标准的工作方法。


    我们今天爱说“以人为本”，而泰勒制，却是以系统为本。人要适应系统，而不是系统为人服务。在此之前，公司招人可能还要说些什么这个人才那个人才，泰勒来了，说我们不需要什么高人牛人，我们需要的是“标准人”。


    今天的白领可能认为“标准人”拇士的，但是对当时那些文化程度不高，无组织无纪律的粗人来说，变成“标准人”，可是对自我的提升！泰勒制极大地提高了工人的工作效率，在各国掀起一场管理革命，可以说是造福了无数工人家庭。


    有一年，泰勒的儿子去日本访问，日本企业代表甚至提出，“你身上有没有什么东西是你爸爸……哪怕砸过一下的？能不能送给我们做纪念品”。泰勒，被奉为神人。


    现在公司里都有个“人力资源部”，这个概念就是泰勒发明的。当时很多人批评泰勒把人变成机器，不近人情，可是事实上，泰勒专门让人事部门去关心工人疾苦。


    但更重要的是，“经理”这个职位，也是泰勒发明的。工人按标准干活，经理人员的任务就是测量和计算这些标准，并且监督工人。


    泰勒提出，作为工人，你应该每天问自己两个问题：


    +   1. 我的经理是谁？

    2. 他给了我什么任务？


    那么剩下的問題就是，谁来当工人，谁来当经理。


    # 4.现代教育大工厂


    平均人思想在工业界大获成功，那必然会影响到教育界。美国普及了高中教育，这种高中教育的目标，就是给泰勒制工厂提供标准工人。在这个学校体系里，就有工厂经理一样的人物，他们专门负责制定教学大纲——学生被按照年龄排列好，每一学年，每个学期应该学习什么内容，完全标准化。


    而且教育界也出了一位实干家，叫爱德华·桑代克（Edward Thorndike）。桑代克的教育理念，直接继承了高尔顿的思想，认为应该按照水平把人分类，而分类的标准就是看他偏离平均值的程度。不但如此，桑代克还把高尔顿的思想进一步发动了——他认为人和人之间的区别是天生的。桑代克说有的学生天生就是“快脑子”，学东西快，有的学生天生就是慢脑子。而教育系统的任务，就是把不同类型的学生输送到不同的社会岗位上去。特别一点，教育资源应该向优等生倾斜！


    桑代克的名言，是“质量比平等重要”。桑代克发明了各个学科的标准化考试，堪称是现代考试制度的鼻祖。


    这样整个教育系统就成了一个大工厂。这个工厂干的事情不是什么“启蒙”，也不是什么“培养人才”，什么“传播知识”，而是把人分类！大部分人去泰勒制工厂当工人，一部分人去当经理。


    从凯特莱到泰勒，从高尔顿到桑代克，围绕“平均人”的两个思想，直接塑造了现代的企业制度和教育制度，影响力一直达到今天。每个人都被贴了标签，分了类，评定了排名。你作为一个人的个性、想法和感情都不重要，重要的是你相对于“平均人”是个什么状态。


    人，在这个体系中只不过是个劳动力，是个生产单元，是个工业品。


    # ｜我的评论


    我读这段历史，脑子里不停地闪现电影《集结号》里的一个镜头。谷子地面对“无名烈士墓”，说“爹妈都给起了名了，怎么全成了没名的孩子了？”


    咱们日课之前讲过《未来简史》这本书，书中赫拉利的一个重要思想，就是研究历史并不是为了预测未来，而是为了让人类更加自由，去思考各种不同的可能性。现在我们知道了这一系列体制的由来，我们就知道它不一定是现在的样子。


    > “平均人”和“标准化”，是一百年前第二工业革命的产物，而我们现在是信息时代！现在的机器已经越来越像人了，人就没必要再去假装机器了。


    # ｜由此得到


    泰勒让工人每天问自己两个问题：我的经理是谁？经理让我干什么？像这样的工人，以后就让机器人去当吧。今天的人应该只问自己一个问题：


    ——我能不能当经理……啊不是，是我能不能在工作中有点自主的决策权？


    “个人”比“平均人”强在哪呢？咱们下次再说。'
