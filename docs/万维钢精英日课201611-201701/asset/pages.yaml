  md: '# 春节特刊 | 那些天我们学过的套路（上）


    春节精选 | 那些天我们学过…


    过年好！从今天开始，精英日课将为你奉上春节拜年特别节目。日课已经100多期了，不少读者刚刚加入，也有读者说没时间听全，所以趁着假期，我们特意为你制作了几期精选，把从日课从16年8月上线以来的内容，做了一个比较系统的梳理。这么做是出于三个考虑：


    +   1，咱们说过，提取强度比记忆强度重要。重复是最好的学习。


    +   2，对于新加入的读者，可以当成音频版的目录索引来用。


    +   3，浓缩的都是精华，听这几期或许也可以让你感觉物超所值了。


    再说，春节假期，阖家团聚，暂时不给大 家增加新的认知负担，多陪陪家人，因为春节后会有更烧脑的精彩内容等着和你一起精进。


    接下来的几天我会帮你精选以下内容：


    +   那些天，我们学过的套路

    “什么到底是什么？”系列

    值得记住的概念和名词

    你以为你以为的就是你以为的吗？

    现代好家长必备

    占领人类智慧最高点


    每期精选都配有文稿，听到感兴趣的内容，你也可以按照文稿中的提示，去看相应的日课文章。


    # 好了，这就开始。


    社交娱乐、工作学习、婚姻感情……现代世界太复杂，可不是靠着几句谚语教你的道理就能好好生存，更不是仅仅学会“生存”就够了，你必须学点套路，日课都教过我们啥套路呢？


    我们先从与人相处说起。怎么快速跟人建立亲密关系？


    # 日课023 | 怎样快速跟人建立亲密关系


    跟人增加亲近感，有几个小技术。


    比如说随意地触碰一下对方，造成身体接触，或者多有一些眼神交流，就很有效。有研究表明工作面试时双方的眼神交流跟成功率很有关系。


    谈判专家最有效的一个技术，是故意跟对方说一个自己的缺点。


    让谈话深入的几个阶段：

    1. 讨论事实。我住在纽约，你住在哪里？

    2. 评价。我觉得你的头发很好看。注意这是一种冒险！其实表达自己对对方的观点，哪怕是称赞，也要冒险，因为你可能夸的根本不是地方。但敢冒险就说明二人的关系已经开始深入了。

    3. 谈论自己的感觉。我感觉怎么样，我今天觉得怎么样……到这一步，已经是比较亲密的关系。

    4. 谈论自己过去隐秘的感情，过去最伤心难过的事情。到这一步，双方就已经是非常亲密的关系了。


    # 日课063 | 《混乱》解读5:敢不敢做个自由的人


