  md: '# 日课071｜中美好家长都为孩子做些什么


    日课071｜中美好家长都为...


    今天咱们说说家庭教育。家长们总是担心自己的一举一动都有可能对孩子前程造成重大影响，可是有些专家分析统计数据，结论往往是家长行为对孩子的影响可能没有那么大。


    比如我们看《魔鬼经济学》这本书，其中就说“你自己是什么人”，是决定“你的孩子会是什么人”的最大因素。比如有个指标说家里藏书多的孩子学习成绩更好——难道是因为孩子从小接触书，就对书籍有亲切感吗？其实答案更可能是家里书多的家长爱读书，爱读书的家长素质高，素质高的家长基因好。


    可是站在家长的角度，我们总觉得放任自流肯定不对，你总得做点什么才放心。再者说来，好家长和坏家长对待孩子的方式的确有很大不同——那就算我基因不行，我想模仿一下那些好家长，这总可以吧？


    那么好家长，都对孩子做什么呢？


    今天我们要说的这本书是 The Smartest Kids in the World: And How They Got That Way（世界上最聪明的孩子：他们是怎么做到的），作者是调查记者Amanda
    Ripley。


    ![](img/9befb2e4b5878711040fbe72f1245d32_87_0.png)


    这本书说的是一项规模和影响都非常大的研究，“国际学生能力评估计划（Programme for International Student Assessment，简称PISA）”。


    PISA主要是个考试项目，但它考的不是学生的应试能力，而是数学和阅读理解的实际水平，死记硬背无效，而且试题内容独立于各国的文化——所以我们大概可以说，PISA成绩能够反映一个学生的真实能力。好消息是中国上海的学生已经连续多年在PISA测试中获得世界第一。而相比之下美国学生的成绩就很糟糕，这本书实际上上就是写给那些焦虑的美国家长的。


    不过PISA项目的目的并不是为了给各国教育水平排名，而是为了比较不同国家的不同教育风格，以期发现最有效的教育手段。2009年以来，PISA调查统计了13个国家的5000个孩子的家长的教育风格，结论非常值得一提。


    首先，家长的教育风格对孩子的成绩的确会产生显著影响。从总体趋势来看，家长在孩子教育中的参与度越高，孩子的成绩就越好。但是，“参与”，有不同的方法。调查显示，美国很多家长的参与方法，和中国家长的参与方法，是两种非常不同的风格。


    美国家长更像是孩子的拉拉队。以前我们以为美国人不管孩子，其实很多美国人——尤其是中产阶级——管得更厉害。他们给孩子提供全方位的服务，现在甚至有个专门名词叫“helicopter
    parents（直升机父母）”，就是说他们就像直升飞机一样恨不得24小时在孩子头顶上盘旋。各种课外活动全程跟进，还热衷于到学校当志愿者，老师让干啥就干啥。


    而且美国家长还把孩子按“温室里的花朵”一样保护。上世纪八九十年代，美国 de?


    而亚洲家长，包括在美国生活的亚裔家长，更像是孩子的教练。他们更倾向于严格要求，而且是直接参与孩子的学习训练，比如说在家里面给安排比学校更多的学习内容。


    这两种风格一比较，结果是美式拉拉队完败给了中式教练——


    一个奇怪的统计结果是，如果家长经常到学校当志愿者，孩子的学习成绩不是更好，而是更差！即使在同一国家、同一种族内都是如此。也许是家长因为自己孩子学习差才去当志愿者取悦老师？也许是因为家长花太多精力当志愿者就没有时间关心孩子学习了？原因不得而知。


    美式教育特别鼓励孩子参与体育活动，为什么美国孩子的肥胖情况是全世界最严重的？体育真起到作用了吗？


    > 美国强调自尊教育，可是没有任何证据表明正能量的夸奖对孩子的人格完善有帮助。只夸奖不批评的做法可能根本就是错的！学习本来就是个充满挫折感的过程，只有严格要求才能真正进步——你要正能量，就不能确保严肃性。

    ……177人笔记


    而且研究还发现，两种风格结果之所以不同，就是教育风格本身的问题，而与种族和文化无关——有些美国的白人家长也用了教练式风格，他们孩子的学习成绩就很好。


    PISA还发现，以下几件事对孩子的教育很有帮助：


    +   1. 在孩子还小的时候帮助他们阅读。比如对上幼儿园的孩子，如果家长每天在固定时间带着孩子阅读或者读书记给他们听，他的阅读理解能力会比同龄人高出1年的水平。


    +   2. 等孩子15岁之后，家长最好和孩子多讨论一些文化、艺术、电影、社会新闻方面的話題——总之就是那些并不发生在我们身边的事，也就是我们过去常说的“something
    bigger than yourself”，这将对孩子的思维能力有很积极的影响。


    +   3. 如果家长本身就爱阅读，那么孩子也会受其影响。学习成绩会更佳。'
