  md: '# 日课081 | 《成功与运气》解读1：运气动力学


    日课081 | 《成功与运气…


    喜爱阅读成功学和励志类著作的人肯定听说过查理·芒格这个人。他是巴菲特的左右手，是泰山北斗级别的投资者，同时还是一个作风低调的、酷爱读书的智者。芒格的很多话都值得作为名人名言在一本书或者一篇文章的开篇引用，咱们也来引用一段：


    > 得到你想要的东西，最保险的办法，就是让自己配得上你想要的那个东西。


    这句话……当然是前辈高人说给“好学上进的青年”的。但你仔细想想，他其实说的是无数成功人士的心声——“我配得上！”


    所以这句话最适合出现的场合就是记者采访你的时候。记者问你，你的成功秘诀是什么？你就可以把芒格这句名言抖出来。……可是以我之见，如果你的成功是特别大的成功，而你又想让采访更精彩一点，你还可以尝试另一种风格的话——


    实话。


    美剧爱好者都知道有一片叫《绝命毒师》(Breaking Bad)，《绝命毒师》有个导演叫文斯·吉里根（Vince Gilligan），吉里根有一次接受GQ杂志的采访，记者问他你们的成功秘诀是什么？他就说了一段比芒格说的更有意思的话：


    > 你有没有过这样的经历——把一张纸团成一团，根本不瞄准，随随便便往远处的垃圾桶一扔，就扔进去了？下次你想再这么扔一次，精确瞄准，百般努力，可是怎么都进不了。……我们为了拍这个剧，每个人都付出了全部的努力，我们想让它堪称人类所能做到的最好的电视剧……但是你知道吗？隔壁《老爸说了算》(According
    to Jim)剧组也是这么投入的……那为什么非得是我们这个剧大获成功了呢？我真想知道为什么，这样下次我还有机会在电视业再拼一把。可是说实话，现在这个片成我已经是偷着乐了。


    他说的成功经验，叫运气。


    从今天开始，我们专栏要连载解读一本新书，Success and Luck: Good Fortune and the Myth of Meritocracy（成功与运气：好运和精英社会的神话）。此书作者罗伯特·弗兰克（Robert
    H. Frank）是康奈尔大学经济学教授，他在纽约时报写一个经济学专栏，而且之前我们的读者可能还读过他的另一本书，有中文版，叫《牛奶可乐经济学》。


    ![](img/9befb2e4b5878711040fbe72f1245d32_129_0.png)


    我们现在所处的这个社会，不管是美国还是中国，大体上都是一个精英社会——也就是说人们可以靠天赋和努力去争取财富和地位，而不像历史上那样家庭出身决定一切。


    “精英”，是个比“贵族”好得多的词。这是一个“选贤与能”的好时代。


    不过弗兰克说，如果你认为精英们之所以成功，就全是因为他们的天赋和努力，外加在人生重大关头做出了理性的正确选择，那也不对。成功在很大程度上是因为运气，而且在现代社会更是如此。


    弗兰克列举了很多例子，包括他自己的生活经历，还有一些系统研究的结果，来说明运气在成功中的重要性。我帮他总结一下，个人运气的规律大約有三条，咱们姑且称之为“运气动力学”。


    # 1. 运气可以放大


    假设现在有两个个人，A和B的天赋、努力程度和见识水平完全一样，但是A的运气比B好一点点，大约好5%吧。那么请问，假以时日，A的个人收入会比B高多少呢？也是5%吗？


    那就大错特错了。我看更合理的答案是500%，甚至更高。人类社会是个非线性的复杂系统，这意味着初始条件好一点，最终结果不是按比例也好一点点，而是很有可能不成比例地把初始优势放大很多很多。


    ![](img/9befb2e4b5878711040fbe72f1245d32_129_1.png)


    帕西诺主演了无数好片，我们今天的人可能认为他是个天生的最佳男主角，简直无法想象一个没有帕西诺的平行宇宙。可是帕西诺能拿到《教父》角色，恰恰是运气的力量。'
