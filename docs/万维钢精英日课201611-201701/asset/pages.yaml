  md: '# 日课037 | 如何优雅地跟人谈政治…以及任何有争议的话题


    一共分四步：


    第一，一上来要摆一个向对方学习的姿态。原来你支持特朗普啊，其实我也有自己的看法，但我对你的看法很感兴趣，请问您能不能跟我分享一下你的观点呢？


    第二，在说自己的观点之前，还要先征得对方的允许！我对移民问题的看法跟您不太一样，不过我不是来跟你争论的……您看，我能说说我的看法吗？


    第三，全程要充分尊重对方。作者说，尊重就如同空气，如果你突然把尊重拿走，那么对方满脑子想的就是尊重！我非常珍视你的视角！我想听到你的观点，而且我也不敢假没我的观点是对的。


    第四，寻找双方的共同点。先得到共识，才能从这个共识出发去谈具体的问题——中国有个政治网站就叫“共识网”，口号是“在大变革时代寻找共识”。可能我是保守派你是自由派，但最起码我们都是爱国者吧？——好吧就算你连“爱国”都反对，那最起码我们都希望全国人民过上好日子吧？


    这已经是聊天的最高境界了。但是人和人相处，总会有摩擦，也难免做出对不起别人的事。做错了事伤害了别人，该怎么道歉？如果你认为最关键的是表达愧疚或者重新赢得别人对你的信任，那就错了。这其实是想用一道歉信操作别人。对于道歉，你首先要解决的不是什么人际关系问题，而是你自己的人格完善问题——


    # 日课050 | 精英水平的道歉


    只有当你分析并解决了自己的问题，你的道歉才配得上被人考虑。


    你在道歉中要告诉别人你自己对这件事的评价和反思，你对对方感觉的响应。你本来想要的是什么结果，而因为你的错误，这件事变成了什么结果，给对方带来了什么伤害。这是你的态度还是因为你的能力？你会做出什么改进？


    道歉的目的，不应该是为了从对方获得什么——这个你控制不了。你只能控制你自己。


    一个好的道歉要有三步：


    +   明确动机：不是为了赢回别人的信任，而是为了完善自己的人格。学到东西：态度有问题就解决态度问题，能力有问题就解决能力问题。提出道歉：说明你的错误，也说明你的改变，但是把是否原谅的决定权留给对方。


    所以一个真正的精英人物得有点中国古代君子，或者西方绅士的作风，学点反思自己的功过，这才是精英水平的道歉。这句“对不起”，可不是那么容易说的。


    除了道歉，批评别人也有学问。


    # 日课078 | 政治争论ABC（下）


    《理性选民的神话》一书的作者布赖恩·卡鲁兰提出一个概念，“意识形态图灵测试”——也就是说你能不能假装自己是对方法阵营的成员，阐述一遍对方阵营的观点，然后你能不能做到让别人相信你真的是那个阵营的成员？


    只有通过了意识形态图灵测试，你才算真正了解对方的思想和主张。那么你对别人的批评，才能让人信服。


    之前我们在《推理的力量》这篇文章中说过丹尼尔·丹内特的《直觉泵和其他思维工具》这本书。这本书里有个思想，值得每个知识分子、每个君子、和每个有志于通过意识形态图灵测试的人了解——


    我们应该怎么批评一个人？你至少要做四步才行：


    +   1. 总结这个人的学说。要总结到比他自己讲得都好，甚至他会感谢你居然能帮他总结得这么好的程度。 2. 列举你赞同他的地方。 3. 列举你从他的理论里学到的东西。
    4. 最后，才是批评他的理论里你不同意的地方。


    如果刚才382是精英水平的道歉，这个应该算是精英水平的批评了。我们一直都在说“精英”都该怎么做，大概精英也都会面临这样一个两难问题：有些事儿我们的确是不想让别人知道实情。别人问了，你不回答也不行，说谎也不行，那怎么办呢？


    世间安得双全法，不负如来不负卿？


    也有办法。


    # 日课110 | 怎样（不）说谎话


    桑德尔说，作为一个不说谎的人、遇到实在不能实话实说的情况，你可以给对方一个“误导性的事实”。


    比如说，你的朋友为躲避杀手的追杀躲入你的家中，杀手找到你家，问你那个朋友是否在这里，你应该如何回答？


    桑德尔不建议直接撒谎说他不在这里。他的建议是，你可以告诉杀手，“我今天下午在超市里见到了他。”


    这就是“误导性的事实”。首先你说的的确是事实，你今天下午的确跟那位朋友一起去了超市。但你这是一个误导性的事实，因为杀手听了这句话，还以为你的意思是说这个人不你家，你上次见到他就是在超市里。你没有撒谎！是他自己被误导了。


    学会用事实误导去代替说谎，这是社会进步的表现。其实我们可能经常会无意识地这么做，但是我们没有把它上升到理论高度。在英语里，这个行为专门有个词，叫“pal​ter”。中文词典中把“pal​ter”翻译成模棱两可，闪烁其词，这个翻译没有抓住要點。


    我们设想，如果人人都随便撒谎，那这个社会就太可怕了，根本没有合作基础。而如果我们说的都是实话，只不过有时故意用事实误导，那这个社会虽然也不完美，但至少还是值得互相说活的。


    在社会上行事，一定不要说谎。


    如果你非得说谎的话，可以尝试“用事实误导”这个办法。但是请注意，将来别人发现了，还是会认为你撒谎——他会同情鄙视你的人格……但至少不会鄙视你的智商。


    会交往、会聊天、会道歉、会批评、会说谎或者会“不撒谎”，看上去是套路，但是背后都有科学实验和严密的推导论证。学会这些，你基本上已经是个十八般武艺的现代人了。


    这就是今天的精选，对感兴趣的部分，你可以按照文稿的提示去阅读原文，那里有更丰富更全面的内容。下期将跟你继续盘点现代人的必备套路，而且是升级版，等你来听，也祝你新年每一天，都有收获！


