  md: '# 日课068｜一个神人的世界观


    日课068｜一个神人的世界观


    今天是周五了，我们干脆多花点时间，来欣赏一个跟日常生活和工作都沒有太大关系的思想。这个思想很有意思，我认为作为现代人，特别是我们专栏的读者，应该了解。


    我一直觉得，如果你计较的是思想，那么我们这个真实世界和武侠世界、魔法世界其实差不多。这个世界里不但有普通人和牛人、还存在神人——类似仙侠世界里传说级的人物。他们中有科学家、哲学家还有实干家。


    他们并不追逐权力，没有狂热的粉丝，可是他们的思想照耀人类历史。


    未必所有人都支持这个说法，但以我之见，史蒂芬·沃尔夫勒姆（Stephen Wolfram），大概就是神人级别的人物。我们都是通过Mathematica软件知道他的。我们知道沃尔夫勒姆从小就是个神童，20岁就在加州理工学院拿到了理论物理博士学位并且获得教职，在物理上取得相当成就之后转而研究复杂性理论，27岁开发出Mathematica软件，并创建了斯蒂芬·沃尔夫勒姆公司。


    可就是如果你说他是个弃学从商的、成功的“创业者”，你就太低估沃尔夫勒姆了。


    沃尔夫勒姆，自始至终，都在追求人类最高智慧。


    ![](img/9befb2e4b5878711040fbe72f1245d32_67_0.png)


    沃尔夫勒姆自诩，他目前为止的成就有三个。


    第一是Mathematica软件。我在大学第一次用Mathematic的时候都惊呆了——这不是一个传统上的“编程”语言，这是一个“符号计算系统”，它可以像人一样积分和推导方程！……而今日的Mathematica已经到了深不可测的地步。


    第二是开发了Wolfram|Alpha，这是一个“人类知识搜索引擎”。Google是搜索网页，而这个引擎搜索的是事先封装好的、标准化的知识！比如苹果手机助手Siri背后的知识库，其实就是Wolfram|Alpha支持的。


    第三是写了一本书，《一种新科学》（A New Kind of Science，简称NKS）。这本书争议极大，其中的思想，就是今天我们这篇文章的主题。


    不过我要说的不NKS，而是EB一本非技术性的小书，Computation and the Future of the Human Condition（计算与人类状况的未来）。这本书其实是沃尔夫勒姆2010年在哈佛大学讲座的一个内容整理，可以直接在他
    的 网 站 上（www.stephenwolfram.com）看到。


    沃尔夫勒姆讲了一个概念，并由此对人类未来做出了两个断说。


    # 1.不可约化的复杂


    想要完全理解沃尔夫勒姆思想的技术细节，对一般人来说可能比较困难；但想要知道他大概是什么意思，还是容易做到的。


    我们先从一个特别简单的游戏开始。


    ![](img/9befb2e4b5878711040fbe72f1245d32_67_1.png)


    上面这张图（图1）叫“元胞自动机”，非常简单，值得你花点功夫体会一下。


    从上往下看，你可以看到图中有很多小格子。最上面一行只有一个黑点。此下每一行，每个格子是黑是白，由它头顶上三个格子的颜色决定。具体的规则一共有八条，都列在图的下面。


    比如说，如果上方三个都是黑格，那么这一格子就是黑格。如果上方三个格子是黑-黑-白，接下来依然是黑格；如果是黑-白-黑，接下来是白格，以此类推。


    这样按照规则一行一行地画满整个画面，你就得到一个三角形的图案。这个规则非常简单，产生图案也不复杂。


    但如果对规则稍加变动，你就会得到非常不一样的图形。例如下图（图2），图中的三角形有大有小，层层嵌套，非常有趣。但这也是简单规则所产生的简单图形，有一定结构但不复杂。


    ![](img/9befb2e4b5878711040fbe72f1245d32_67_2.png)


    接下来我们看第三张图，依然是看似平常的八条规则，但所产生的图形就变得非常奇怪！


    ![](img/9befb2e4b5878711040fbe72f1245d32_67_3.png)


    这张图（图3）看似有规律，但并不整齐，总会打破规律。但如果你认为它没有规律也不太对，它并不是完全的紊乱无章，仍然具备某种结构。我们把这张图继续往下推演，从大尺度上看：


    ![](img/9befb2e4b5878711040fbe72f1245d32_67_4.png)'
  merge: -1
  img_proc: true
- pgno: 68
  md: '![](img/9befb2e4b5878711040fbe72f1245d32_68_0.png)


    最左侧的结构是简单的，越往右越复杂，有很多三角形的图案，可是这些图案的出现也没有固定规律。


    这个图（图4），才是真正意义上的“复杂”。


    产生这张图的这套规则，被沃尔夫勒姆命名为“第30号规则”——沃尔夫勒姆甚至说，这个“第30号规则”，就是他本人迄今为止最大的发现！


    一套特别简单的规则，居然演化出了一个特别复杂的结果。


    而且沃尔夫勒姆说，这个结果的“复杂”，跟你用任何一套复杂规则所能产生的复杂结果的“复杂”，是一样的“复杂”。


    ——这就是他的“一种新科学，NKS”这本书的核心思想：计算等效原理（Principle of Computational Equivalence）。


    这一原理说，像前面那些简单程序得到的是简单结果，但只要结果超过了一个很小的界限，所有的程序，不管有多复杂，最后得到的结果，都是同等的复杂，并不能说哪个更复杂。


    再说白了，我们可以得出一个非常有意思的结论：即使是再先进的事物，它的复杂度和我们刚刚看到的图形的复杂度，其实也是一样的。


    据此，沃尔夫勒姆就得到几个非常重要的、甚至能让人震惊的思想。


    首先是计算不可约性（Computational Irreducible）——真正复杂的东西是无法进行简化的。这就导致一个问题：没有哪个复杂系统是可预测的！


    # 2.技术进步的终极方法


    传统上，我们技术进步的方法都是迭代——这一代iPhone怎么样，一年后有了新的技术突破，你就可以再改进一下……所有新技术都是在原有技术基础之上演化出来的。


    ——所有的可能算法，在数学上，组成了一个“算法宇宙”。我们直接从算法宇宙里找到各种算法拿来用就是！一步到位，无需逐步改进。


    # 3.未来人眼中的历史


    到了人可以随意选择各种技术为我所用的时候，人会选择哪些技术呢？人想用这些技术干什么呢？


    第一步肯定是要解决生存问题。可是在沃尔夫勒姆看来，所谓生存，或者说生命，乃至“智能”，其实都没有一个客观抽象的判断标准，都是历史的产物。


    我们认为生命就是DNA和RNA这些东西，但也许宇宙中就存在一种生命形态并不是由这些东西构成的。我们对智能的定义，也仅仅'
