    # 周末小议｜且让外行领导内行


    特朗普当选总统以来，美国知识分子和文艺界竞相抒发自己的悲观情绪，就如同亡国了一般。


    我最近看《纽约人》杂志，有篇文章讲的是拉斯维加斯每天要消耗6万吨虾的事儿，作者是这么开头的：特朗普当选总统后，我头脑中有太多黑暗的想法，每天凌晨3、4点都会从噩梦中惊醒，为了排解消极情绪，我只好去想吃虾的事情。


    这似乎有点像撒娇。但我相信，有些忧国忧民的知识分子，是真心实意地睡不好觉。


    比如说科学家。虽然我们目前无法具体判断特朗普的科学政策，但从他之前的言行来看，他大概不是科学家的好朋友。特朗普公开质疑全球变暖学说，他居然相信给儿童注射的常规疫苗有可能导致自闭症，还认命了一个跟他有同样想法的人担任疫苗安全和科学诚信委员会主席！特朗普任命的能源部长是德克萨斯州前州长里克·佩里（Rick
    Perry），他认为全球变暖学说是"value"，而且还曾经发表言论认为应该撤销能源部。


    本文截稿为止，特朗普还没有任命他的科学顾问。缙闻人选是耶鲁大学的计算机科学教授大卫·格伦特尔（David Gelernter）。格伦特尔本周二从耶鲁逃课去华盛顿见了特朗普。


    ![](img/9befb2e4b5878711040fbe72f1245d32_213_1.png)


    格伦特尔是个有意思的人。首先，如果他真当上白宫科学顾问，那他就是有史以来第一个不是科学家的科学顾问——计算机科学是科学吗？再者，格伦特尔强烈批判全球变暖学说。更进一步，格伦特尔甚至强烈批判整个学术界！他2013年出过一本书，认为美国学术界、尤其是名校，都被犹太人所把持，过于左倾，自由主义意识形态泛滥，已经辜负了美国传统价值。


    所以你看出来没有，特朗普选的人，都有点像特朗普——都有点“反智”的气质。


    那么，我们是不是可以说，美国科学的冬天就要来临了呢？


    也不一定。特朗普这一票人马似乎都是科学的外行，但外行不见得就不应该领导内行。这里面有个认识问题。


    在咱们中国，科学家的实际地位不高，但是声望地位很高。一提到科学家，我们总是深表同情，真诚地希望给他们多点收入。国家把钱花在其他方面，老百姓总爱争论一下是否花费过高，但如果把钱用于科研，我们就家长供孩子上大学一样，一致赞成。我们提起科学来总能感受到一种情怀，不明觉厉！


    > 总统可不能只讲情怀。总统“不明”，还可以问专家；总统如果“觉厉”，就容易被忽悠。

    ——2人笔记


    白宫科学顾问也好，总统也好，他们的任务不是“领导”科研工作，更不是直接指挥科研人员。政治的本质是“谁得到什么”，说白了就是分钱——分国家的钱。


    简而言之，就科学而言，总统的任务是决定把国家的钱分给科学多少，分给科学以外多少；科学顾问的任务是建议把科学的钱分给这个领域多少，分给那个领域多少。


    咱们先说第一次分钱。特朗普不是科学家的朋友，他大概缺少对科学家的同情心，这对科学绝对是个坏消息。可是对国家整体来说，也一定是坏消息吗？


    科学家天生想让国家给科学多投钱。前一阵中国争论比较激烈的一个事件，是到底要不要建一个大型对撞机。有关科学家甚至站出来说如果不掏钱建这个对撞机，中国就只能是个二流国家，想做一流国家必须掏钱建设对撞机。


    > @知识分子：【独家】王贻芳再谈大型对撞机：让中国成为“世界第一”的只是一项政治决定】“我们都承认：最终评判对撞机值不值的问题是一个政治决定。国家领导人会想一想，中国究竟是要做一个二流国家还是要做一个一流国家，要做二流国家，去他处做没问题，省钱，但若要做一个一流国家，对不起，不可以这样”，王贻芳…全文


    ![](img/9befb2e4b5878711040fbe72f1245d32_213_2.png)


    这就有点太情怀了。国家当然应该支持科研，即使饥荒和贫困困扰在，我们也要探索太空！然而凡是要花钱的事儿，总应该问个性价比。如果我花的钱要比对撞机项目还多，预期得到的结果比它还少，那我是不是可以考虑把钱投到更有效率的地方——比如说普及高等教育、升级民用技术、研发新武器，或者探索太空上去？我少建一个对撞机，怎么就成了二流国家了呢？'
