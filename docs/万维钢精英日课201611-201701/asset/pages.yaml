    # 万维钢


    对自己的好处主要是心理上的，有些人喜欢整齐有序。


    整齐有序的真正实际好处是容易跟别人对接。老师把课程表安排好，按部就班讲解，罗胖每天固定时间给语音，这是因为他们是在为别人服务！得给人一个合理预期，别办事找不着你，或者你的风格太混乱别人根本听不懂。


