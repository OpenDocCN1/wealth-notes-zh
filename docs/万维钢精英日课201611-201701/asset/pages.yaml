    在这个实验的短短时间内，老人的心态的确就影响了他们的身体机能。当然这个实验只是单次的，没有长期观察，更没有用到“表观遗传学时钟”的精确测量……不过结论仍然是好消息。


    归根结底，所有的实验都指向一个方向：心态年轻，有利于减缓衰老！


    衰老肯定是人人都会老，但在一定程度上，也许出生日期代表的年龄就是一个数字而已。


    # 我的评论


    还有一个感想。我认为中国传统文化中“尊老”的说法，已经不适现现代社会了——因为尊敬老人本质上就是歧视老人。看到老人上公交车就要给让座，一旦年龄到了就强迫退休，从表面上看这些行为是尊重老人，可是从今天这些研究来看，这实际上是在加速老人的衰老。我们的文化应该更平等地对待老人，这也是更平等地对待将来的自己。


    # 由此得到


    不要用年龄给自己贴标签。不要问“社会环境认为我这个年龄的人该干什么”，你只需知道“我想干什么”！


    ![](img/9befb2e4b5878711040fbe72f1245d32_64_0.png)


    日课精选


    # 行者无疆 63


    今天的日课是在北京的酒店里写下的。爱人很幸运的在公司年度的综合考评中得到一等奖，给了带家属来北京总部参加活动的机会。我对他公司的管理很感兴趣，想了解他们的企业文化，也想借机来看住在亲弟家的母亲和读书的女儿。所以来时就大包小裹的带了很多家里的特产来，赶飞机，坐地铁，六七个小时，我们两个人有一个共同的感觉，累！但我们并没有觉得自己老了，只是仍不太适应大城市的生活节秦，路途远，挤地铁，急匆匆，但到了酒店稍作休息后就开始计划这几天的活动和行程了。您说的不要给自己贴年齡的标签，我赞同！想起塞缪尔·厄尔曼的《年轻》写到：年轻，并非人生旅程的一段时光，也并非精萃红唇和体魄的娇健。它是心灵中的一种状态，是头脑中的一个意念，是理性思维中的创造潜力，是情感活动中的一股勃勃的朝气，是人生春色深处的一缕东风。岁月可以在皮肤上留下皱纹，却无法为灵魂刻上一丝痕迹。忧虑、恐惧、缺乏自信才使人何惚于时间尘埃之中。无论是60岁还是16岁，每个人都会被未来所吸引，都会对人生竞争中的欢乐怀着孩子般无穷无尽的渴望。在你我心灵的深处，同样有一个无线电台，只要它不停地从人群中，从无限的时间中接受美好、希望、欢欣、勇气和力量的信息，你我就永远年轻。一旦这无线电台坍塌，你的心便会被玩世不恭和悲观失望的寒冷酷雪所覆盖，你便衰老了一即使你只有20岁。但如果这无线电台始终矗立在你心中，捕捉着每个乐观向上的电波，你便有希望超过年轻的80岁。


    十几年前读到这些文字时就深深记在脑海中，虽然随着年龄的增长让我觉得每一一年都过的越来越快，但我并不恐惧，年龄丰富了我的阅历，让我收获了很多意外的惊喜，比如今天的北京之行，让我有机会体验新事物，多好！


