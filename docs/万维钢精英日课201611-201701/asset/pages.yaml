  md: '# 日课112 | 量子力学的“人性”


    日课112 | 量子力学的“…”


    今天咱们说个比较刺激的话题：量子力学。我以前是研究物理的。当年我选择学物理，肯定不是为了找个什么高薪的工作，也不是为了出名，实在是被物理学的精妙思想所吸引。当时最吸引我的，还不是爱因斯坦的相对论，什么科幻小说作家喜欢的时间旅行之类，而是量子力学。


    量子力学是一个特别反常识的学问，但并非完全不可理解。只要你稍微理解一点量子力学，就会拍案叫绝。如果你理解的足够多，就可能陷进去。如果你理解的再多一点，搞不好就想把青春献给物理学。


    后来各种机缘巧合之下，我在物理学里的专业领域并不是量子力学，到现在连物理也不搞了，可以说是非常遗憾。


    闲话少说。最新一期《纽约书评》上，有篇温伯格（Steven Weinberg）的文章，《量子力学的困境》（The Trouble with Quantum
    Mechanics）。温伯格，咱们以前说过，日课有篇文章叫《科学家对诗人的有失恭敬》，讲过一本他的新书《给世界的答案》。温伯格是目前活着的物理学家里面的泰斗级人物。


    温伯格讲了一个困扰物理学家已久的问题。这个问题实在太过重大，可以说足以影响每个人的世界观。理解这个问题不需要什么高深概念，就让我来给你说一番。


    咱们先从一个最基本的问题出发：到底什么叫“不确定性”？


    # 1.常识中的“不确定性”


    现代人经常会讨论“不确定性”、“概率”这些东西，但是你是否想过，这个世界真的是不确定的吗？


    你往空中抛一个苹果，如果我精确知道苹果的初始速度、空气的阻力、引力的强度，我就可以精确计算苹果的轨道，告诉你它会在什么时候、在哪里落地。完全都是确定的。


    可是如果你抛的是一个硬币，问我硬币落地的时候哪一面朝上，我就只能说一个概率了。这并不是因为硬币和苹果有什么本质的不同，而是因为影响硬币落地因素实在太多了——初始速度、角度、旋转度、地面的平整情况、空气中气流的变化等等。我对这些因素的了解和我的计算能力都是有限的，我就没有办法精确预测。但是你考察那些左右硬币运动的物理过程，它们都是确定性的。也就是说，如果有人能够精确实解所有的因素，他在原则上就能精确预测硬币的运动轨迹！硬币事件，本质上仍然是确定性的事件。


    在量子力学出现之前，物理学就是这样的局面。所有物理方程都是确定的，那么如果你精确知道宇宙中每一个粒子的初始条件，你在原则上就完全可以预测整个宇宙后续的演化，一切都是确定的——这就是所谓“机械宇宙”。


    今天我们说的天气、股市、地震这些所谓“不确定事件”，在机械宇宙里也都有，我们说不确定只不过是因为我们的计算能力有限。机械宇宙里没有真正的不确定事件，一切都已经注定了。


    这个世界观有点令人沮丧——我们的大脑也受物理定律支配，所以你未来想什么，也是注定——但这是一个和谐自治的世界观。


    这就是为什么量子力学一出来，物理学家就懵了。


    # 2.既在这里，又在那里


    下面这个实验叫“双缝实验”。把一束光从两个缝隙中传过去，两个缝隙的光束就会形成干涉，在后面的屏幕上形成干涉条纹。


    ![](img/9befb2e4b5878711040fbe72f1245d32_208_0.png)


    这是因为光是有波动性的，就好像水波一样，如下图：


    ![](img/9befb2e4b5878711040fbe72f1245d32_208_1.png)


    可是量子力学一出来，我们知道，光同时也是粒子——也就是“光子”。物理学家原则上可以把光子——或者电子、或者别的东西粒子——一个一个地发射到那块有双缝的隔板上去。你猜会发生什么？


    即使你每次只发射一个光子，后面屏幕上也会出现干涉条纹图案！这非常奇怪，因为干涉条纹，是两个缝隙之间同时发出的光互相干涉的产物。现在你每次只打一个光子，它跟谁干涉呢？


    答案是这个光子自己和自己干涉——也就是说，这一个光子，同时通过了两个缝隙！用电子或者别的粒子做这个实验，结果也是如此。


    这就是量子力学。一个粒子，可以“既走过了左边的缝，又走过了右边的缝”——“既在这里，又在那里”！


    再举一个例子。物理学有个概念叫“自旋”，你大概可以理解成一个粒子的自转。任意选定一个方向，比如说北方，那么对一个电子来说，它有两种自旋——对着北方，如果这个旋转是顺时针的话，我们就说它自旋是正，如果是逆时针的话，我们就说他的自旋是负。


    ![](img/9befb2e4b5878711040fbe72f1245d32_208_2.png)


    你不用关心自旋的精确定义是什么，只要知道电子在任意方向都有正、负两种可能的自旋。


    好了。现在假设这里有一个电子，在我观测它之前，你问我一个问题：这个电子的自旋是正还是负的？


    如果咱们说的是一个台球，我的答案就应该它是“或者是正的，或者是负的”。可是对电子来说，我的答案就必须是它“既是正的，又是负的”。


    这就和前面双缝实验中，“既走过了左边的缝，又走过了右边的缝”，是一样的道理。


    一个没有被观测的电子，其实是两种自旋状态的“叠加”，这就是“量子叠加态”。物理学家用“波函数”描写这个叠加态。


    这个“既是……又是……”的概念可能已经让你震惊了。这其实是一个概念问题。日常生活中一个人不可能同时从左右两个门中穿过，还自己撞到了自己，但那只是我们的日常经验。微观世界的情况跟宏观世界非常不同，只要你能接受这个观念，就不至于睡不好觉。


    基本粒子不是台球。只要你不观测它，它就可以“即是这样，又是那样”。


    让物理学家至今都睡不好的，是“观测”。'
