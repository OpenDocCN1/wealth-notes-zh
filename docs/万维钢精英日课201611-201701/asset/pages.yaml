  md: '# 日课070 | 霍金说的劫数，人人都有


    日课070 | 霍金说的劫数...


    有些科学家老了以后，你想看他的新闻就得去娱乐版。著名物理学家霍金，近年来经常对专业领域以外的东西发表看法，每次都让媒体非常兴奋。如果你只看断章取义的标题，很可能会以为霍金正在靠大嘴吸引注意力，走球王贝利的路线。


    他最近的一个言论，有关人类在地球上的命运。雅虎新闻的标题是《霍金表示人类或将于一千年内从地球上消失》。中文网上流传更广的一个标题是《霍金：不在一千内年内逃离地球，人类就来不及了》。


    这些标题总结得……基本正确。


    我认为霍金说的这个道理不但关乎世界观，而且关乎人生观，所以必须让我们的读者了解。我们先来考证一下霍金的原话是在什么情况下和怎么说的。


    霍金是在本月15日，在牛津大学做了个演讲，演讲的主题大约是人类应该积极探索宇宙，争取早日殖民外星。霍金的意思是说，如果不这么做，想要老老实实在地球上待着，那是没有前途的，因为地球有各种风险。


    根据《基督教科学箴言报》的报道，霍金的原话是：


    > "Although the chance of a disaster to planet Earth in a given year may be quite
    low, it adds up over time, and becomes a near certainty in the next 1,000 or 10,000
    years," Hawking said in the speech."


    这段话才是关键。首先霍金说的不确定的千年，而是“一千年或者一万年”——对天文学家来说，千年和万年的差别不算太大。但更重要的是，其实是霍金的这个推理方式！这里面蕴含一个你必须了解的概率论道理。


    在讲这个道理之前，我先顺便说一下，新华社的一篇文章，《地球只能维持一千年？听听霍金怎么说》，也考证到了霍金这段原话，但是文章把这段话给翻译错了。新华社的文章是这么翻译的：


    > 尽管地球在未来一些年里遭遇灾难的几率可能很低，不过(几率)会不断加大，而且会变得接近确定，在未来一千年或一万年里(会发生灾难)。


    这是不懂概率论的人犯的错误。霍金到底是什么意思呢？如果是我的话，我会这么翻译：“尽管在每一个特定年份里，地球遭受重大灾难的可能性都非常低，但是在此后一千年或者一万年内至少遭受一次重大灾难的可能性就很高了。”


    这里面其实是一道非常简单的概率题，咱们一起来把玩一下。我们假设，地球每年发生毁灭性灾难的可能性是万分之一，那么请问，在未来一千年，以及未来一万年内，地球都不出事儿的可能性是多大呢？


    这道题你得这么算。每年出事儿的可能性是0.0001，所以不出事儿的可能性就是0.9999。那么连续一千年都不出事儿的可能性是多少？是0.9999的一千次方，约等于90.5%。换句话说，一千年内出一次事儿的可能性，是1-90.48%，也就是差不多是9.5%。


    一万年都不出事儿的可能性，则是0.9999的一万次方，约等于36.8%。那么出事儿就成了大概率事件。


    用公式说话，霍金的意思是说，用p表示地球每年出事儿的概率，那么地球在N年之中出一次事儿的概率是：


    ```

    1 − (1 − p)^N

    ```


    哪怕p是个很小的数字，在N足够大的情况下，这个答案也是一个接近于1的数字。


    这个道理就是，经历的时间长了，早晚会遭遇一次小概率事件。你说这是常在河边走哪有不湿鞋也行，说这是出来混早晚要还也对。


    如果我们把“小概率事件”特指为灾祸的话，这里其实说的是人生中很悲观的一个道理。


    现代人一生之中得上癌症的概率大约是20%，得心脏病的概率大于20%，还有其他的常见病。我们姑且大方一点，假定有五种最常见的疾病，每种的发病率是10%。那么请问，一个人，这五种病都不得的概率是多大？答案是0.9^5，大约是59%。


    但是别忘了还有其他灾祸。车祸之类的意外死亡呢？投资失败呢？家庭不幸呢？经济不景气被裁员呢？高考发挥失常呢？找对象遇人不淑呢？


    所有这些坏事，也许每一件遇到的概率都很小，但是想要什么坏事都不遇到，却是非常困难的。


    有不_an意之处，才是正常的人生。这就是为什么有那么多人感慨说“平安是福”。


    而霍金和概率论明确告诉我们，想要不折腾不惹事老老实实做个安静的美男子，其实是做不长的。


    每念及此，我就想起《西游记》里菩萨祖师对孙悟空说过的一段话：


    > ……虽驻颜益寿，但到了五百年后，天降雷灾打你，……再五百年后，天降火灾烧你……再五百年后，又降风灾吹你……


    他说的这些五百年一遇的劫数，如果用现代语句表述，大约就是每年发生概率是0.2%的灾祸吧？这跟霍金说的道理完全一样。而更重要的是，霍金和菩萨祖师说这些话的目的都不是为了吓唬人，不是为了感慨人生无常，什么珍惜眼前时光之类的鸡汤，他们的'
