    这本书说的都是美国的事儿，对照一下中国互联网，情况略有不同。我敢说在很多方面，中国互联网已经领先美国。


    现在中国也没人写博客了，但是业余生产力并没有完全消失——人都跑到微信公众号去了。公众号对应博客，有两个好处：


    +   1. 背后依托于微信社交网络，获得比博客高得多的流量；

