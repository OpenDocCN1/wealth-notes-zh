- pgno: 28
  md: '实没什么布局——就是不按学科安排，办公室分布很凌乱。更有意思的是大楼房间的编号系统非常不科学，新人来了很容易走错路，走着走着就走到别人的办公室里——在办公室里聊天，比乔布斯设计的在卫生间门口聊天效果更好。


    更重要的是，既然20号楼非常简陋，它的入住者想怎么折腾，别人都不会管。有个教授说，如果你在别的楼里想接个新管道，从打报告申请经费到找来管子工不知要消耗几个星期，而在这个楼里你完全可以自己直接动手，没人管，一下午解决问题。


    在别的办公楼，科研人员要想动改变办公室格局，比如拆一面墙，都非常困难——而在20号楼，有一次研究者为了做原子钟实验，直接拆了两层楼的地面。


    也许办公楼好不好并不在于它是什么风格，而在于它给入住者多大的自由度。


    # 3.四种办公室


    2010年，几个心理学家为了知道到底哪种办公室对工作效率最有帮助，特意把大学心理系的办公室腾出来给受试者用。他们设计了四种办公室。


    第一种是极简主义的风格。什么装饰都没有，桌面上除了起码的办公设备也没有别的东西，进得门来除了工作就没有别的 hedging 的。


    第二种是装饰了的办公室。墙上有些艺术照片之类，给人感觉至少温暖一点。


    不出意料，人们更喜欢装饰了的办公室，而且在里面的工作效率也更高。


    第三种和第四种都是装饰了的办公室。所不同的是，第三种办公室允许受试者自己装饰，桌椅怎么摆放，画贴在那里，随便折腾。


    第四种就非常特别了，一开始也是允许受试者自己摆弄，但是等受试者摆放好了，研究人员又回来，把所有东西归位！


    实验结果，第三种的工作效率显著高于其他种类。而第四种的工作效率显著低于其他种类——有个受试者甚至跟研究者说，我都想揍你！


    所以哈福德说，所谓促进创新的办公室，其实无非就是两点：


    +   1. 它在设计上要能促进不同部门的交流。

    2. 它要给员工充分的自主权。


    自主权比交流机会更重要。这就是为什么强势的乔布斯最后也妥协了，改为在每层楼都设计了卫生间——好在乔布斯大楼里还有很多其他地方可以交流。


    > 如果员工对办公环境没有自主权，一切设计和风格全是老板定的还不能更改，那不管你这个风格是极简还是混乱，你都是在“刻意地创新”——那就不是真正的创新。


    一个人的办公区是什么样的，根本不重要——重要的是他想让它是什么样，就可以让它是什么样。如果让工程师根据自己的方便来随便摆弄办公室，办公室一定是看上去比较萧条杂乱的——一点关系没有。


    现在的谷歌公司总部，是个非常漂亮的办公楼，但是哈福德提醒我们：你可千万别搞错了逻辑——谷歌并不是因为有这个漂亮办公楼而成为今天的谷歌。谷歌成为今天的谷歌，可能是因为它最早那个办公室——租了别人家车库和几个房间的那个杂乱无章的办公室。


