  md: '# 说一件有关时间的小事


    ![](img/9befb2e4b5878711040fbe72f1245d32_35_0.png)


    《精英日课》到今天，正好开通3个月了。我们的更新时间，一直是每天0点。不断有读者留言给我说，这个时间太晚（严格地说是太早）了，看完文章、写完自己的日课已经1点，长此以往，X将不X。


    所以我选了一个新的更新时间：每天晚上10点43分。


    为什么是这个时间？


    “1043”这个数字的缘起是物理学上的“普朗克时间”，它等于普朗克长度除以光速，数值大约是10的 - 43次方秒。


    普朗克长度，是物理学在理论上能够测量的最短距离；光速，是信息传递的最快速度。所以普朗克时间，是任何物理过程，被任何仪器测量感知到所需要的最起码时间。根据宇宙起源的大爆炸理论，从奇点到普朗克时间到底发生了什么，物理学永远无从得知。过了普朗克时间，引力才开始出现，对称性破缺才得以发生，物理学中四个最基本的力才开始分化。


    普朗克时间之前，宇宙就已经存在；但是普朗克时间之后，可以理解的宇宙才正式开始。


    我想把晚上10点43分作为《精英日课》的普朗克时间。


    没有比普朗克更短的时间了，所以也不可能有更快的速度了——我希望把最新的思想，用最短的时间，以最快的速度传递给你。


    我更想用这个时间和你共勉——对无限的未知永怀敬畏。


    今晚普朗克时间见！


    顺致 冬安


