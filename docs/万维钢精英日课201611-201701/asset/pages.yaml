  md: '# 日课 089 | 哪有什么“标准人”？


    日课089 | 哪有什么“标准...


    你可能听说过这样的说法：最美的脸，就是把所有人的脸综合在一起取平均值得出的脸。网上有很多这种图片，比如下面，就号称是一位计算机科学家算出来的中日韩三国青年男女的“平均脸”。


    ![](img/9befb2e4b5878711040fbe72f1245d32_150_0.png)


    这六张平均脸，似乎还真带一点本国人的特色，更关键的是，确实都非常漂亮。可是我有两个问题。第一，有多少人长得像这些平均脸？第二，我们能不能说，人的长相距离平均脸越近，就越美，越远，就越丑呢？


    我的长相……距离中国男性的平均脸挺远的。不过我觉得，恐怕绝大多数人都不像图 Playoffs 这些平均脸。我们在生活中能见到很多俊男美女，他们的长相各不相同，可以说是各有各的美法——那么这些“平均脸”，到底有多大意义呢？


    今天要说的是blos 一本2016年1月出版的书，The End of Average: How We Succeed in a World That Values
    Sameness（平均的终结：我们怎样在一个崇尚相同性的世界中成功），作者是哈佛大学教育学教授托德·罗斯（Todd Rose）。


    我读这本书的第一个收获，就是这些所谓的平均脸，一点意义都没有。


    ![](img/9befb2e4b5878711040fbe72f1245d32_150_1.png)


    看上去就是一位健康漂亮的女青年。


    Norma的问世引起了各方高度重视，被视为完美女孩，人们纷纷购买塑像的复制品。


    ![](img/9befb2e4b5878711040fbe72f1245d32_150_2.png)'
