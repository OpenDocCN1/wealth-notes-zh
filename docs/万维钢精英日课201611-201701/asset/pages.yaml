  md: '# 日课114｜谁想成为（文化）亿万富翁（上）


    日课114 | 谁想成为(文化)亿...


    咱们日课最近一直在说注意力，特别是怎么夺取别人的注意力，和不被别人夺取注意力。其实注意力虽然是有限资源，但是不可积累的资源——过期就作废，不用白不用。所以今天我们大方一点，谈谈怎么“花费”注意力。


    特别是，怎么把注意力花在“享受”上面，比如说，“文化”。人生不能只有工作，总要花点时间欣赏绘画、音乐、小说、电影这些东西。工作有学问，享受也学问，甚至还需要点经济学眼光。


    今天咱们要说的这本书叫《发现你内心的经济学家》（Discover Your Inner Economist），作者是乔治·梅森大学经济学教授泰勒·科文（Tyler
    Cowen）。

    咱们日课以前介绍过这个泰勒·科文，他是我最佩服的读书人——我猜他可能是全世界读书读得最多的人，而且他看电影也多，音乐、绘画各方面都花了很多时间——专业研究之外，如果单论欣赏文化艺术，泰勒·科文可以算得上是亿万富翁。


    ![](img/9befb2e4b5878711040fbe72f1245d32_217_0.png)


    那我们就来看看这位经济学家是怎么欣赏文化艺术的。


    经济学家跟普通人有啥不一样呢？他们至少有两个优点。第一是“理性”，也就是说要从自利的目的出发考虑问题。第二是非常，非常讲“效率”。


    咱们先考虑一个最基本的问题：为什么要欣赏文化艺术？


    不仅仅是为了娱乐放松，也不仅仅是为了“有用”。拿手机看几个搞笑视频就能很好地娱乐放松。如果为了纯粹“有用”，那你就应该强迫自己欣赏那些“别人说好”的“高品位”的东西。


    科文的洞见在于，你欣赏的文化艺术，是和你的自我认同联系在一起的。也就是说，你欣赏什么文化，约等于你是个人。


    我们欣赏文化应该既追求高度也追求广度，这是因为我们的自我认同也要追求高度和广度。


    举个例子。作为东北人我非常喜欢赵本山的节目，赵本山是我自我认同的一部分。但如果除了赵本山小品我就不可信世界上更有好的东西了，甚至还歧视外地的文化，那我的格局就太小了，可以说就是特别无知——这样的“我”，绝对不是我想做的“我”。


    心理学有个概念叫“现状偏见（Status Quo Bias）”，说我们有时候会过高评价自己拥有的东西。大部分人的认知被现状偏见所误，我们本来可以追求更好、更多的东西——所以我们应该主动欣赏、甚至还要激励自己去欣赏更好和更广泛的文化艺术。


    泰勒·科文的文化涉猎广到了什么程度呢？作为一个土生土长的美国人，他专门写过怎么在中餐馆点川菜，读过刘慈欣的《三体》、麦家的《解密》和郝景芳的《北京折叠》，还看了很多印度电影。泰勒·科文，上得了厅堂，下得了厨房。


    很多人嘲笑谁谁谁“穷得就剩钱”，咱们能不能学学科文，看能不能“富得全是文化”。


    泰勒·科文从经济学的角度，提出两个欣赏文化的原则。


    第一，你得知道最稀缺的是什么——是你的时间和注意力，而不是艺术品。收藏艺术品非常花钱，但是欣赏艺术品花不了多少钱。买本书、去逛博物馆，能花多少钱？你真正花费的是时间。


    第二，你得知道，文化其实并没有那么重要。我们大多数人并不打算为艺术献身，我们只想当个欣赏者——要让艺术为我服务，而不是我为艺术服务。那么你欣赏艺术的姿势正确不正确，态度虔诚不虔诚，听个歌剧穿什么衣服，那都根本不重要。


    比如说参观博物馆。


    大多数人参观博物馆的方法是有问题的，没有让自己的利益最大化。科文列举了人们参观博物馆常犯的几个错误——


    +   1. 花太多时间看展品的说明文字，而不是看展品本身——人们看说明文字的时间常常超过看展品的时间，你是来准备考试的吗？

    2. 头几个展厅看得太仔细，结果没时间欣赏后面展厅里更好的东西——你的时间有限，应该优先看好东西，甚至根本就不应该看第一个展厅，人太多。

    3. 有人建议去博物馆之前应该先做大量预习，到时候按图索骥——从节省时间角度，这也没必要，再说仍然是考试思维。

    4. 过分关注“别人说好”的东西——你应该关心的是你自己喜欢什么。'
