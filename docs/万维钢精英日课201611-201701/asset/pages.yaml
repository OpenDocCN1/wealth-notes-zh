  md: '书中给了三个建议。


    第一，限定思考时间。比如一天之内必须完成报告，或者一小时之内必须结束会议。其实开会也好，写报告也罢，考虑的时间越长越无法保证效果，反而是在有时间限制的情况下，你才会逼着自己去考虑最重要的因素。


