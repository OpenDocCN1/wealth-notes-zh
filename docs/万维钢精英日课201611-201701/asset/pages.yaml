  md: '# 日课055 | 极端式成功者


    日课055 | 极端式成功者


    从七年前儿子出生以来，我一直都在琢磨和演练一个问题：怎么把个人的工作效率发挥到最大。讲时间管理、各种工作方法的书我也读过很多本，自己也尝试过一些方法，但总是未满意。我完成的事儿比我想干的事儿少太多，我甚至猜测，也许家庭、工作和业余爱好这三件事儿中，你最多只能选两件。


    想必你也有同样的困扰。今天要说得不是什么提高效率的新方法，而是想把我们心目中“一个人到底能做到多大效率”这个答案的上限，给提高一点。


    也许我们对个人效率的传统认识是错的。一个现代人，借助各种现代化工具、借助现代社会提供的先进基础设施、借助身边优秀人物的帮助，如果他本人足够厉害，他就可以同时做好很多事。


    比如最近我读一本书，作者也是个比较成功的记者，但是因为家里生了小孩，感觉写书、采访和照顾家庭这三件事实在无法同时做好，于是就想向哈佛大学教授 Atul Gawande（阿图·葛文德）求教。这位阿图·葛文德是谁呢？除了哈佛教授之外，他还是：


    +   一位很厉害的外科医生

    麦克阿瑟天才奖得主

    世界卫生组织的顾问

    一个医疗创新公司的主管

    自己创办了一个非营利组织

    《纽约客》等媒体的撰稿人

    写了三本书，都上了纽约时报排行榜——

    你可能听说过其中两本，都有中文版：《清单宣言》和《最好的告别》


    +   1. 兰道尔天生就比别人聪得很多，而且极大限度地发挥了自己的才 cậu。

    2. 兰道尔不但物理厉害，而且在生活中的很多方面，包括业余爱好在内，都有不寻常的追求，不怕折腾。

    3. 兰道尔做事的目的性很强，总想得到结果


    十月底最新出版的这期《纽约客》杂志上有篇文章，The Dark Energy of a Theoretical Physicist（一个物理学家的暗能量），说的正是丽莎·兰道尔。'
