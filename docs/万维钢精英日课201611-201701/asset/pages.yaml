  md: '![](img/9befb2e4b5878711040fbe72f1245d32_31_0.png)


    纳粹德国陆军元帅，“沙漠之狐” 埃尔温·隆美尔，最爱干的事情就是发动迅速的机动攻势。不论是一战时在意大利，还是二战时在北非，隆美尔都是这种模式——


    当时局面混乱


    隆美尔率领少量军队，对十倍于自己的敌人中的某一部，发动突然攻击


    敌军失败，但隆美尔并不撤退，而是沿往下继续打，在敌人没反应过来的时候就已经接二连三的取得胜利


    自己伤亡极少，可是已经破坏了敌人大量物资，俘虏了大量敌军——这些俘虏是个累赘，可是隆美尔也不杀他们


    仗继续打下去，隆美尔越来越深入敌后，这时候他发现友军已经联系不上了，自己弹药快打完了，而且敌人慢慢包围过来了


    然后他又用一个出其不意的方法突围成功


    这是战神的打法。隆美尔最初决定深入敌后的時候，他是否想过，如果被人包围应该怎么办呢？很可能没仔细想过，因为战场形势瞬息万变，你事先做什么计划都没用。那他为什么就敢这么干呢？


    他的秘诀是快速机动。他知道对手做什么事情都比他慢，他相信自己一定能随机应变，他敢别别人一本正经的决策和行动方法不好使。


    隆美尔的每一个动作，都能让局势更混乱，而混乱对他有利。


    对隆美尔和贝佐斯来说，混乱，是稍纵即逝的好机会。为了抓住这个机会，哪怕后面有再多麻烦都是值得的。 86人笔记


    后来美军有人把隆美尔这套打法做了很深入的总结，被包括军界以外的很多人了解。


    特朗普在共和党初选<|start|>中痛击杰布·布什这些建制派的时候，有人给希福德发了个短信：


    > “特朗普就是在用隆美尔的方法对付他们”。


    # 3.特朗普


    ![](img/9befb2e4b5878711040fbe72f1245d32_31_1.png)


    今天我在微博看到一则轶事，说2015年，特朗普还在犹豫要不要参选，他的好朋友克林顿夫妇就鼓励他参选，“在共和党中树立你的形象！”


    特朗普参选总统？别人第一反应这是一个笑话。他面临的局面跟贝佐斯和隆美尔是一样的，不乱就根本没机会。


    所以特朗普的策略就是把局面搞乱。整个的竞选模式是这样的：


    特朗普对某个问题——比如说移民——突然发表煽动性的言论


    媒体兴奋了，选民非常关注


    别的候选人羡慕这种关注，就出来对此发表讲话，说特朗普说的不对，你们还是听我说说这个问题


    但是解释，就有漏洞。比如杰布·布什有一次为了“更正”特朗普关于墨西哥移民的话，说自己非常喜欢墨西哥移民……结果说着说着把亚洲移民给得罪了


    特朗普就会立即抓住你的漏洞发动嘲讽式攻击


    你还不知道怎么反驳他，特朗普又把话题转到下一个媒体兴奋点上去了。


    这不也是一个顾前不顾后，只知道进攻没有防守的打法吗？特朗普这么做，必然给自己带来一大堆漏洞，可是跟贝佐斯和隆美尔一样，他根本不在乎。


    而“建制派”对特朗普却不能不在乎。这就好像隆美尔已 经打到你家后院来了，你不反应行吗？


    你要<|message|>是反应，你却没他快。


    特朗普有个能力，他总能即兴发挥，现场出现问题现场转移，贝佐斯搞商业和隆美尔打仗都有这个能力，而商业巨头和建制派政客缺少这个能力。


    马克·卢比奥是共和党建制派最中意的候选人，他就没有这个能力。今年二月初选辩论中，有人嘲讽卢比奥没有自己的思想只会背台词，卢比奥的反击是……当场把之前刚刚说过的一大段台词又说了一遍！然后他又说了一遍。


    后来他还再说了一遍。从此，人送卢比奥一个外号：卢机器人（RuBot）。


    如果你的打法是什么都事先计划好，谋定而后动，没有把握见到机会也不出手，你就永远也打不过贝佐斯、隆美尔和特朗普。 109人笔记


