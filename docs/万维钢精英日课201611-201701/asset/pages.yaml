  md: '# 周末小议 | 不看广告的人


    ![](img/9befb2e4b5878711040fbe72f1245d32_135_0.png)


    多年来，我一直对Google、新浪这些常去的网站有一种愧疚之情。我一直使用它们的服务，而且他们的服务质量很好，但是我从来没给它们带来过收入。因为我从来不点击广告。


    实际上我已经很多年都几乎看不到网页广告了。有个浏览器插件叫Adblock Plus，只要装上，它就会自动屏蔽一切（严格的说是几乎一切）网页广告。


    ![](img/9befb2e4b5878711040fbe72f1245d32_135_1.png)


    它的工作原理并不是人工智能，是靠人工，不靠智能。它有几个巨大的广告来源列表（而且有专门的中文网站广告列表），凡是列表中有广告都不会显示出来——如果偶然看见一个列表中没有的广告，你只要把它加进列表就行。几年前我还手动添加过几个广告源，现在已经不需要。


    我打开的网页永远清爽整洁。凡是原本应该出现广告的位置，现在都是空白的。Adblock Plus可以被装在各种平台，包括iPad和手机上。用惯了之后，偶尔换个新设备，打开一个网页居然看到广告，你可能还觉得挺新奇。


    据说德国已经有10%的人使用了Adblock Plus，美国的数字不知道，但也很广泛，中国也有很多人用。网站和广告商当然对此很不满，时不时能听到他们起诉Adblock
    Plus的消息。这使我想起美国历史上，电视媒体曾经起诉过家庭录像机——因为录像机可以不录广告。


    也可能他们会胜诉。我还听说Adblock Plus搞了一个白名单制度，适当放行一些符合他们“规范”的广告，但是我在使用中对此没什么印象。还有一些网站能自动探测到我用了阻止广告的插件，要求我先停用插件，才给我看网页……很多时候我就干脆不看那个网页了。


    其实这些都是技术细节。现在情况是就算网页上仍然显示各种广告，我也能做到视而不见——我的眼睛就自动屏蔽广告。这当然不是说我很厉害，这其实是经常上网的人的一个基本能力。


    这就引出一个问题：网页广告到底还有没有用呢？之前Yahoo实验室有个随机测试的研究，说网页广告带来的收入，差不多相当于投放这个广告的花费的四倍，所以还是很有用的——但是这里面有个转折点：网页广告只对年长的人有用。40岁以下的人自动屏蔽广告。我猜这可能是因为年长的人上网不够熟练。


    广告，现在仍然是很多网站的最大收入来源。但我觉得，互联网广告将会慢慢消亡。对视频来说，尤其是体育节目的电视直播，它中间给你穿插几个广告，你在一定程度上的确是看也得看，不看也得看。可是在网页广告就不一样了，看与不看是我主动的！我就不往那里看，我就不点，你又能怎么样呢？


    其实我们仔细想想，广告是个不符合互联网精神的东西。有用的信息传递，才是互联网精神。在一个理想的互联网中，产品跟用户之间的关系应该是这样的：


    +   - 你可以根据我的需求向我推荐

    - 你可以开新产品发布会

    - 你可以像推荐新书一样，把产品拿给专家去评测

    - 对任何一个产品，我可以很方便地看到用户的评论

    - 我可以自动货比三家，找到最低价


    所有以上这些功能，现在已经都有了。比如“推荐”就比广告高明得多。推荐，是只有在你主动浏览商品的时候才出现，它不会在你看一条军事新闻的时候问你买不买化妆品。


    关于最后一点，有个浏览器插件，叫InvisibleHand。比如你在亚马逊看一个什么商品，它自动告诉你别处有没有更便宜的价格。不过好像目前还不支持国内的网站。


    ![](img/9befb2e4b5878711040fbe72f1245d32_135_2.png)


    我可以设想，等这个插件用的人多了以后，围绕它也会有一番争斗——哪家网站不让用它，哪家网站付钱给他求加入比价，它能不能公正地给每个人同样的价格，等等。但是这个思路完全正确。


    现在可是信息时代！如果每个人都知道有哪些东西自己可能需要，而且知道任何一个东西，在哪里有卖，最低多少钱，用户评价怎样……广告还有什么意义？


    ![](img/9befb2e4b5878711040fbe72f1245d32_135_3.png)'
