  md: '# 日课058 | 跟《冰雪奇缘》学创造力魔法


    日课058 | 跟《冰雪奇缘…


    今天我们还是说 Charles Duhigg 的 Smarter Faster Better: The Secrets of Being Productive
    in Life and Business（更聪明更快更好：在商业和生活中获得高生产率的秘密）这本书。


    纽约时报记者 Duhigg 写此书的初衷是想了解当前各行业的牛人是怎么会有那么高的生产率的，他为此采访了很多人，这些人给了他各种说法，可以说是非常混乱。


    书中有一个内容，价值极高——作者采访了前几年非常成功的一部动画片，迪斯尼的 Frozen（冰雪奇缘）的全体剧本创作人员，而且还进行了特别深入的交流。


    从《冰雪奇缘》的剧本创作过程中，我们能学到很多很多。


    ![](img/9befb2e4b5878711040fbe72f1245d32_12_0.png)


    影片最初的设定剧情是这样的：


    童话王国的一对公主姐妹，姐姐艾莎有个制造冰雪的超能力，但是她无法控制，所以其实是个毛病，并因此失去了王位继承权。妹妹安娜是个典型的好姑娘，获得继承权的同时还即将跟英俊的王子结婚……


    姐姐深感嫉妒，最终在妹妹婚礼当天发动冰雪攻击……


    妹妹被击中，心脏渐冻，只有王子的真爱之吻才能救他……


    姐姐制造出来的雪怪失控了，姐妹俩必须联手……


    你觉得这个剧情如何。好莱坞有个好习惯，大片正式推出之前要先拍个简陋的样片，内部试映一下看看反应。结果反应都很差。而这时候，距离公布的正式上映日期还有18个月。


    关键问题是没人喜欢这两个角色——妹妹太乖，姐姐太邪恶。嫉妒和复仇，这样的情节很难讨好观众。而且姐姐一言不合就搞这么大的动作，似乎也不太真实。以两姐妹作为主角，无法控制的超能力，这都是非常新颖的设定，应该有很好的发挥，可是现在这个剧情没有灵魂！


    现在的影视剧，通常都是用一个团队的编剧集体创作，这样设计人物、剧情、对话可以发挥个人的特长，跟传统上一个人写剧本的做法很不一样。《冰雪奇缘》的编剧团队，陷入了困境。


    接下来的事情，就成了“怎么发挥创造力”的一个经典案例。Duhigg 总说，我们至少可以从中学到有关创造过程的三个教训。


    # 1.压力


    可能有人觉得时间紧、压力大的局面会扼杀创造力，但有时候正因为这样，人才能更清楚地看到最本质的东西。


    编剧们自己也对剧情很不满意。有个编剧就说他非常不喜欢王子吻醒公主这个老套剧情——现在都什么年代了，女孩应该自救！


    还是制片人说了一句话。他说咱们能不能先别说你不喜欢的部分，咱们先把这个电影中，你内心深处最喜欢的设定列出来，你最想在这个片里看到什么？


    这个，正是迪斯尼电影能打动人的秘诀——它总是要求创作者深挖自己的内心，一直挖到最后，其实是创作者把自己心中的某个真实的部分展现给观众。


    有一个叫Lee的女编剧说，我小时候经常跟我姐姐打架，长大以后我们分开了，可是有一次我遇到不幸，我姐姐第一时间过来安慰我。想起姐姐，这就是我加入剧组的原因。编剧们最后认定，以姐妹俩为主人公，她们长大以后疏远了，然后又团聚，这个设定，必须保留。


    但是问题来了，剧情要想好看，姐妹俩之间必须要有张力。可是有张力的話，似乎就得让一个扮演好人一个扮演坏人，但那样一来，观众就不可能同时喜欢姐妹俩！这个矛盾怎么解决呢？


    Lee说，我非常不喜欢姐妹俩一好一坏这个设定，根本不真实！真实的姐妹就算分开了也不是因为谁是坏人，而且最后她们总能发现自己其实是需要对方的。


    好吧，必须是一对好姐妹。可是剧情张力从哪来呢？


    心理学家把这个在这重压之下的创造，叫做 “creative desperation（绝望创造）”。而且心理学家发现，在绝望的时候，人们常常能从自身的经历中获得启发，把个人的素材和新的内容连接起来，产生一个特别有意思的创造。


    ![](img/9befb2e4b5878711040fbe72f1245d32_12_1.png)


    # 2.人生经历的价值


    负责给这部电影写歌曲的是一对夫妻档，Bobby Lopez 和 Kristen Anderson-Lopez。这两人已经被剧情折腾疯了，实在无法给一个坏的姐姐写好歌。


    有一次二人在公园散步，Bobby 突然对 Kristen 说，如果你是艾莎，你会是个什么感受？


    Kristen 就想到了自己的经历。作为事业心很强的夫妻，二人在照顾孩子方面不太细心，有时候给孩子吃冰激凌——在美国社会氛围内，这是不负责任的做法，因为冰激凌是不健康食品。有一次他们在饭馆吃饭，还允许孩子一边吃饭一边玩iPad。周围别的家长看Kristen的眼神，就不太赞成。


    这其实就是我们以前说过的，被人给judge了。'
