  md: '# EXPOSITION UNIVERSELLE DE 1889


    ![](img/9befb2e4b5878711040fbe72f1245d32_178_0.png)


    谢雷的作品是张贴在巴黎街头的大幅广告海报。这种海报的成功关键在于能不能吸引到过往行人的注意力。谢雷创造性地发现，你不能让海报中的人物老老实实待在那里，必须营造一种人物马上就要跑出画面的动感场景。艺术家们很快就找到了能吸引注意力的各种元素
    —— 动感、彩色、画面中一定有人或者动物，比如性感的男女、可爱的小婴儿，以及怪兽……


    总而言之，媒体和广告业一开始走的就是低俗路线。作为注意力商人，第一，你要用低俗去争取注意力；第二，你还要用更低俗去保有注意力。这个局面愈演愈烈，就会引起读者和观众的反感，注意力商人反受其害。


    一旦人们发现这些媒体吸引他们的注意力是为了剥削他们身上的注意力价值，就会产生一种感情被玩弄的感觉，这对广告商、媒体都不利。巴黎市政府很快就对艳俗海报采取了限制措施，规定只能在特定的地点张贴这类海报，并且需要交纳高额的税金。


    再到后来，随着注意力商人们越玩越大，媒体上充斥着各种虚假广告，政府和人民都忍无可忍了。


    还不到几十年的时间，注意力商人，就遭遇了创造力障碍。


    ……咱们下次再说。


    # 我的评论


    很抱歉今天有点标题党，标题说的是道光年间，其实内容还是美国的事儿。不过如果你查百度百科，在小戴创办《纽约太阳报》的1833年，也就是道光十三年这一年，中国总共发生四件大事儿。其中一件，就是有了史上第一份中文杂志
    —— 某德国传教士创办的《东西洋考每月统计传》。


    所以注意力商人的历史其实很长。我们今天玩的这一套，一点都不新鲜。


    那为什么我们在潜意识中，总觉得传媒是个高大上行业，记者都是文化人呢？为什么我们总觉得低俗是媒体的“堕落”呢？这可能是因为中国媒体的出身不同。中国过去所有报纸都是官办的，并不以盈利为目的。这导致即便放开了限制，媒体人还是一种情怀。只有时间久了，注意力商人们不断试探底线，才走到今天这个地步。事实上时至今日，中国媒体的低俗水平还可以进一步向美国人学习。


    关键在于，大众传媒从来就不是高雅的产品，从一开始的定位就是低俗的！


