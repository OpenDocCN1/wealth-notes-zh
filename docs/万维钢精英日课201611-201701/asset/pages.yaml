  md: '# 日课066｜现代世界的快速上升管道


    多年前，我在物理系读书的时候，同学之间有个观点：大家都老老实实上课写作业吧，谁也别指望能在30岁之前做出什么了不起的研究成果来。20世纪初的物理学是年轻人的天下，那时候20多岁就做出名垂青史的成果大有人在。可是随着时间推移，那些诺贝尔奖得主做出获奖工作时的年龄在慢慢变大，现在大概已经到了四五十岁。


    这可不是因为什么论资排辈或者官僚主义，纯粹是因为现代科学知识在过去100年里发生了爆发式的增长，一个人别说做一线研究，就仅仅是学会此前的知识，积累到能“上手”的水平，就已经花去了很多年。

    本科生只能算“预备队员”，连论文都看不懂，硕士生只能帮着打下手，博士生中特别出色的，才能在科研队伍里担任主力。至于说当明星？且慢慢等着吧。


    如此说来，这个越来越复杂的现代世界，岂不是中老年人的天下吗？


    然而事实根本不是这样。如果你放眼诺贝尔奖之外，各个行业里出头的年轻人比比皆是。十几岁的人唱首歌就一夜爆红，两个高中生写个手机APP转手就把公司卖上了亿美 元，一个大学生成办个社交网站，几年之后就跻身全球首富行列，跟各国元首谈笑风生……


    这让老老实实上课写作业、辛辛苦苦积累了半生知识的老一辈情何以堪呢？所以就有老艺术家对年轻人的成就相当不忿，说黄晓明婚礼居然花了一个亿，要知道火箭科学家的奖金才500万啊，这公平吗？


    “公平”是个很难定义的词，我们换一个词——这件事不见得“公平”，但是“合理”。


    合乎现代世界的“道理”。


    这些年轻人的成功肯定有运气成分，但这跟买彩票中大奖可是两码事。如果我们认为他们的成功就是运气好中了大奖，那么老一辈的人（因为感觉自己已经没有机会了）就会说我不属于这种成功方式，这个世界不合理！年轻人也会白日做梦，指望自己哪天能被大佬看中，也来个几轮风投，谈笑间公司就上市了。


    事实上，在现代世界年轻人要想迅速成功，至少得满足三个条件：


    +   你得有真本事，这意味着天赋和努力；

    你得运气好，这意味着你正好处在一个特别有利于发展的环境；

    你得善于利用现代世界提供的快速上升管道。


    摆在你面前的这本书，《出奇制胜：在快速变化的世界如何加速成功》说的就是这些上升管道。


    ![](img/9befb2e4b5878711040fbe72f1245d32_58_0.png)


    这些管道可不是传统意义上的拉关系走后门，更不是指成为“自二代”“富二代”——它们摆在我们每个人的面前，机会几乎是平等的。可以说，这些管道其实就是现代世界给我们提供的另外一种基础设施。


    一个管道叫“换梯”。为什么美国总统的平均当选年龄比议员低？难道一名政客不应该先当好了议员再当总统吗？答案是大部分美国总统，特别是那些历史评价很高的美国总统，并非职业政客出身。他们以前可能是律师、大学校长、演员、军队将领、战斗英雄和作家。他们在自己原本的领域里做出了名堂，获得了选民认可，参政几年就能选上总统。


    他们不愿意在一部梯子上慢慢爬到头，他们爬着爬着就换个梯子更快地继续向上。按当下中国的流行词，这叫“跨界”。


    一个管道叫“拜师”。哥德纲跟门下弟子的师徒恩怨时不时成为网上的热点，人们纷纷议论，在现代社会还有必要搞那种封建家长式的师徒制度吗？答案是师父仍然很重要，但不是以前那种师父，而最好是一直能对你的成长提供建议、帮着规划人生的导师。


    这本书里就有个喜剧演员，他的进步的确多亏了自己的一位老师。但他可不是像鲁云金那样把自己的全部身心交出去才进师门——他的做法是自己在家模仿当今著名喜剧演员的表演。他大量下载了这些人的录像跟着学，对大佬们的一举一动，所有事情都了如指掌……等到他的恩师——不是喜剧演员，而是一位经纪人——看过他的表演录像给他打电话的时候，他已经做好了
    一切准备。这是一个对自学成才空前友好的时代！


    一个管道叫“反馈”。俗话说“失败是成功之母”，但事实证明，个人经历一次大失败对你未来的成功几乎是只有坏处没有好处——因为你太痛苦了，根本不愿意反思自己，你学不到什么教训。斯诺在书中列举了大量例子，证明最好的失败其实是那种不针对个人的、能够获得快速反馈的小失败。而现代世界恰恰提供了经历这种小失败的可能。我们可以在新产品推出之前，先在小范围内测试一下，获得反馈迅速迭代，就可以在正式推向市场之前把产品做到很好。如果人人都忌讳谈论失败，我们还可以从别人的失败上快速积累经验。


    一个管道叫“高级工具”。“汇编语言”是一门特别难学难用的编程语言，你必须完全按照机器的思维写代码，灵活性很差，特别容易出错。汇编语言无疑抬高了计算机技术的门槛！很多大学可能认为汇编语言是计算机的基础，要求所有理工科学生都学这门课，学得好的学生被同学视为牛人，而且他们的确有理由感到自豪……在某种程度上说，这些大学其实是在犯罪。


    当你的学生还在拼命地钻研汇编的时候，别人家的高中生已经用 Ruby on Rails（一种灵活性极高，对编程者基础知识要求极低，能够快速上手写出应用程序来的高级语言）搭建好一个网站还赢利了。'
