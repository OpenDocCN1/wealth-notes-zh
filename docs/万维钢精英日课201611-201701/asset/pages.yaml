  md: '3. 兰道尔做事的目的性很强，总想得到结果和发掘意义——宁可花很多时间计划和改变计划，也不愿意做一件没有意义的事。


    这三点我肯定做不到。我的生活充满无意义的浪费时间，我经常上网看两个小时的新闻而且毫无收获。如果有朋友邀请我出去看星空，我根本不会想到云层状况，我看星空的时候也不会去寻找人造卫星。


    我觉得兰道尔这是一种极端的生活方式。


    但是还有更极端的。关于伊隆·马斯克，现在已经有专门讲他的书了。不过我想说的是 Quora（相当于美国的“知乎”）网站上的一篇问答：How can I be
    as great as Bill Gates, Steve Jobs, Elon Musk, Richard Branson?（我怎样才能像比尔盖茨、乔布斯、伊隆·马斯克这些人一样了不起？）


    回答这个问题不是别人，而是伊隆·马斯克的前妻，贾斯婷·马斯克（Justine Musk）。而且贾斯婷本人正好也是个作家！


    贾斯婷的答案，一句话总结：极端的成功，来自极端的人格。


    一般人对成功的定义大概是事业有成家庭和睦身体健康之类。马斯克这种级别的人物想要的，可不是这种“小确幸”生活。


    +   被视为不通人情世故的怪人

    跟家人搞不好关系

    不得不参加一些毫无意义的会议，看身边人不顺眼

    日复一日的睡眠严重不足、飞行时差、精神疲劳

    孤独感、挫折感、深夜灵魂的追问

    表现出孤独症、阅读障碍症、注意力紊乱症等各种症状，经常跟人争吵

    ……


    # ｜我的评论


    有个特别流行的段子，说一个商人跟一个渔夫对话。渔夫问，你那么努力赚钱，到底是为了什么？商人说，等我有了钱就可以买个海岛，然后岛上天天钓鱼。渔夫笑了：你追求的，不就是我现在的生活吗？


    # ｜由此得到


    这条路未必适合你，但万一你真有一个梦想，想要极端的成就，你大概需要三个条件：


    +   1. 天赋

    2. 找到自己愿意为之付出一切的使命

    3. 为之付出一切，过一种极端的生活


