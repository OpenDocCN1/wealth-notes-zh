    # 日课106｜赚钱的想法和历史的行程


    日课106｜赚钱的想法和…


    今天我们继续说《注意力商人：进入我们脑袋的史诗争抢》（ The Attention Merchants: The Epic Scramble to Get
    Inside Our Heads ）这本书，作者是吴修铭（Tim Wu）。


    每一个时代的人们使用注意力的方式，都是主导这个时代的媒体技术决定的——几乎每次都是人在适应技术，而不是技术适应人。前面我们已经讲了报纸、广播和电视，这一次讲互联网。


    互联网这个技术实在太独特，以至于对于发展这么快的一个技术，注意力商人们是用了二三十年，才搞明白应该怎么使用它。


    在进入正题之前，我想咱们能不能先思考这么一个问题：现在“3D打印”怎么不热了？


    大概仅仅两年以前，3D打印是非常流行的创业和投资概念，技术日益成熟，一台家用3D打印机价格大概才500美元，原料齐备，还有各种APP。人们曾经认为3D打印时代已经到来——现在怎么很少有人提起了呢？


    我想，这是因为缺少一个“杀手应用”——英文是“killer app”，非常有用的一个概念。3D打印看上去很好玩，我自己还付费打印过东西——可是我没必要买一台3D打印机放在家里。突然需要一个茶杯？最好的办法是去商店买一个。始终没有一个功能，是非得自己3D打印不可的。


    反过来说，个人电脑一开始就有杀手应用——所谓杀手应用，就是能让你为干这件事儿而去买电脑的应用——这当然就是游戏。早在八十年代初期，个人电脑就开始迅速在美国家庭普及，人们买电脑不是为了搞科研也不是为了处理账目，而是为了打游戏！


    所以这个原理就是，要想让一个新东西流行，它就必须得有一个杀手应用。


    那时候人们打电脑游戏不需要联网。那么早期互联网的杀手应用是什么呢？


    # 1.形象工程


    现在很多人认为私人公司应该是技术创新的主力，尤其是互联网行业，国企根本干不过私人公司。然而有意思的是，互联网，恰恰是政府资助项目的产物。


    1969年，美国政府出资，把十五个研究机构的内部网络连接在了一起，形成一个全国性的网络，这就是互联网的前身。在政府看来，这是一个了不起的成就，就好像修了个遍布全国的铁路网！


    问题在于，这个铁路网上没有火车。从政府到科研机构，都不知道这个网能干什么——也许科学家们可以传递些数据，可是那时候也没有多少数据需要跨机构传递。甚至在整个70年代，这个互联网的用处都不大，政府甚至开始纠结是否需要继续资助它的存在。


    1971年，政府就干脆指派了一个30岁的计算机科学家雷·汤姆林森（Ray Tomlinson）去发明一项互联网应用！汤姆林森一开始的想法是搞一个协议让用户可以在网上方便传输文件。后来他灵光乍现，想到传输文件，还不如传递消息有用——于是电子邮件就此诞生。


    也就是说，电子邮件不是用户需求而生的。它是政府科研经费多到没处花，弄了个形象工程，想到要给这个形象工程找点用处，才被发明出来。电子邮件在间世很长时间内，只是用于政府和科研单位传递消息，不为外人所知。


    一直到1978年，才算有人“滥用”电子邮件。当时DEC研发了新型号的计算机，想要在加州开一个产品发布会，市场经理嫌挨个通知太麻烦，就发出一封有393个收件人的电子邮件。邮件刚发出去他就被批评了，这么高级的政府工具怎么能用来发广告呢？……那就是历史上第一个垃圾邮件。


    连垃圾邮件都没有。那时候如果有人说这个网有朝一日能跟电视争抢注意力，肯定是个笑话。


    # 2.怎么用互联网赚钱


    我调研了一下，中国第一封电子邮件是1987年9月14日发出的，发信人是德国人维纳·措恩，发信地点是北京计算机应用技术研究所。


    1987年，互联网就接到了北京。第二年又接到了更多的中国城市。使用互联网的主要是科研机构，但是一些极客已经开始联网打游戏，人们已经意识到，这个东西必定能流行。


    到1991年，美国已经有四家公司提供私人的互联网接入服务，其中最大的两家是Prodigy和美国在线（AOL）。当时的上网费很贵。一个多月9.95美元只能上5个小时，超出就是每小时3.5美元。


    如果你穿越到1991年，你会怎么做这个互联网注意力生意呢？注意力可是1991年，那时候的商家和用户都还不知道网上有什么可看的。


    也许你可以向早期的报纸学习，用低价吸引用户，再把用户注意力卖给广告商。Prodigy公司就是这么想的。它提供了非常廉价的接入服务，请专业人士精心准备内容，跟主流媒体合作让新闻上网……但是没有多少广告商愿意做广告。在90年代初的几年间，Prodigy就损失了几亿美元，钱烧完了也就完了。


    其实Prodigy还尝试过电子商务，希望用户能在网上购物，就好像后来的亚马逊一样……后来亚马逊行，可是当时Prodigy就不行——因为那时候的互联网很难传输图像！看不到产品图，哪有购物欲望？


    野心勃勃想法多多的Prodigy，不但没赚到钱，而且也没有吸引到很多用户。真正吸引到很多用户，让互联网在美国普及开来的，是AOL。'
