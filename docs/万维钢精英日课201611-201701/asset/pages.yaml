    如果你稍微关心美国政治，肯定听说过“自由派”、“保守派”这些名词。我认为你应该多了解一下这方面的东西，因为这些政治思想的用处并不仅限于美国——可以说在任何一个现代国家，只要讨论的内容涉及到政府、社会和个人之间的互动，你就可能会加入某一派。


    比如说，如果让你来主导中国高校招生改革，你打算怎么改革？按美国标准——


