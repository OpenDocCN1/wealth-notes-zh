    男孩子的心理发展过程，早期的父亲崇拜，到青春期的反叛，打到偶像，再到形成自己的价值观，这是孩子正常心里变化[书籍《养育男孩》]。很多以前被崇拜的父亲现在被瞧不起，会有深深的失落，这也是正常现象，我们不应该在别处寻找认同，当然也不应该在孩子那里寻找认同，我们应该在自己内心，自己价值观深处寻找。

    第二个问题关于失控，关于父亲的权威。

    失控是针对可控而言，想可控就必然会有所谓的权利争夺。[书籍《叛逆不是孩子的错》]一旦出现权利争夺，必然和孩子处在对立面，人无法把和自己争夺控制权的人奉为权威。万sir此前讲过成为权威的前提，一是保证各方的声音被听到，二是公平，三是决策确定透明。我想出现现有权威的情况，可能在这三个的某一方出现了问题。这个时候要得不是控制，不是权利争夺，而是无条件的爱。

