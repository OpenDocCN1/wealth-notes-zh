  md: '# 答读者问｜皇帝做习题


    来自日课：数学家告诉你什么时候结束单身


    牟海望：37%，与黄金分割比例（0.382:0.618）很相近啊，万老师觉得两者有关系么？


    大雄：为什么感觉这个数字和黄金分割很接近啊！巧合吗？


    万维钢


    没有关系，纯属巧合。37%是1/e，黄金分割那个数是(-1+√5)/(1+√5)。


    空心菜：万老师，我越来越发现数学这门学科的伟大，可是我这样，原来上学时没学扎实，数理关系的理解不强，现在工作中应该如何训练自己的数学思维能力呢？


    蓝色Tory：万老师，一个纯文科生如何开始培养数学思维呢？


    万维钢


    王小波有篇文章叫《皇帝做习题》，说曾经有西 Ferguson 传教士给康熙讲过几何学，还 toez 留了习题作业，而康熙皇帝很可能真的做了这些习题。王小波说：


    解几何题和干别的事实不同，要是解对了，自己能够知道，而且会很高兴。要是解得不对，自己也知道没解出来，而且会郁郁寡欢。一个解对于一道几何题，他的智慧就取得了一点实实在在的成就，虽然这种成就可能是微不足道的，但对于个人来说，这些成就绝不会是毫无意义。


    ……给计算机编程和解几何题有共同之处：对了马上知道对，错了也马上知道错，干干脆脆。你用不着像孟子里那样，养吾浩然正气，然后觉得自己事事都对。


    王小波既说明了数学思维的好处，也说明了提升数学思维的方法。好处有两个：提升智慧、直面现实。方法也有两个：做题或者编程。


    康熙皇帝做习题，未必是他认为几何题对治国安邦有什么好处，也许他纯粹就是出于兴趣玩玩。我觉得我们也应该有这样的精神：把数学和编程当成强身健体陶冶情操的活动！


    肆肆肆肆阿哥：老师今天说的可以理解成，理性思考，感性做事吗？这让我想起了富兰克林找伴侣时在纸上罗列推断的那一幕，今天说到了结果，我还没有想过。思考的理性会让你省下不必要的大脑带宽去更冷静的分析。在这里我要问万老师，浪漫这件事情可以用算法吗？


    万维钢


    现在的浪漫关系交友网站，比如 eHarmony，都要求你填写一个非常详细问卷，列举自己的各种爱好和生活经历，并以此通过什么大数据分析或者心理学算法来帮你找到另一半。这背后的理论依据，大约是人的各种喜好之间是有关联的：你喜欢用什么颜色的笔写字，可能跟你喜欢什么样的异性有关——尽管没人知道这背后到底是个什么机制，反正大数据只要要求相关性，不需要因果性。


    对这个做法，我听到过两种声音。


    一个说法是这种大数据给你推荐的选择，比你自己选的好得多。证据是，据说，从 eHarmony 配对成功的夫妻，结婚以后的感情比生活中巧遇的夫妻要好。


    还有一个说法则是大数据其实没啥用。有很多实证发现，你输入很多很多数据，然后交友网站“假装”把这些数据盘考考虑，但实际上只考虑了几个最基本的要求——年龄、所在地区——剩下的因素统统不管，干脆来个随机配对……效果也很好。


    只要系统“真诚地”告诉你哦，说我是用心理学最新研究加上大数据分析，发现你们俩是天生一对——你们俩就会真的会发生感情！


    哪个说法对呢？我更相信第二种说法。谁知道 eHarmony 到底是怎么给人配对的，也许它就是用了很多随机方法。


    不论如何，关键在于，这件事儿的确没法完全理性分析——你根本就不知道你喜欢什么样的。要不怎么叫“浪漫”呢。


    十三：万先生，你好，我挺喜欢你的文章，思路清晰，逻辑严谨，有一个问题想请教：只计较得失概率和多少的理性人，面对无法计算的情感怎么选择，比如亲情。


    万维钢


    就连经济学家都不要要求人在一切事物中做个计算得失的理性人。对亲情应该多讲情感，甚至不计得失。情感和理性是个什么关系呢？也许情感决定你“想要什么”，理性决定你“怎么达到和平衡这些目标”。


    比如你有个孩子，你完全是出于亲情，既想让他将来成为一个很厉害的人才，也想让他拥有一个快乐的童年，为了这两件事儿，你可以做出牺牲。理性说，完全没问题，支持！但如果这两件事儿是有矛盾的，想要将来成现在就苦练，你怎么平衡这两种情感呢？这才是你需要诉诸理性的时候。内部学习交流，阅后即删除，入社群加微信ccdd660


    # 来自日课：一个神人的世界观


    Lucky：这篇文章的部分内容我不是太懂。算法宇宙怎么理解，我注意到您用的是“找到算法”而不是“创造算法”，这区别可大了。


    书包：文中提到的“算法宇宙”，是由所有可能的算法组成的，可是，如何才能获得所有可能的算法？是不是还是需要技术人员的推动？如果是这样的话，技术发展其实就是在不断探索新的可能的算法，去组成“算法宇宙”。


    Angela Xu：那个算法宇宙中的算法也是先人们在历史发展的过程中慢慢积累创造出来的，并不是现成的算法吗！其次现在算法宇宙中的算法的数量和功能真的能满'
