  md: 'Angela Xu：那个算法宇宙中的算法也是先人们在历史发展的过程中慢慢积累创造出来的，并不是现成的算法啊！其次现在算法宇宙中的算法的数量和功能真的能满足我们现在和未来人类的需求吗？最后想问哪里能找到那个算法宇宙？很好奇！


    # 万维钢


    这里面的区别的确可大了！事实上，这是一个很大的问题。


    “算法”到底是某个数学家或者工程师“发明”的，还是“发现”的？是发现的。比如文章中提到的这个“第30号规则”，它其实是一个客观的东西，如果沃尔夫勒姆没有发现它，将来也会有别人发现它。


    不但如此，在沃尔夫勒姆没有发现它之前，这个算法就不存在吗？它就在那里，等着人去发现！我们完全可以认为，所有可能的算法，一切数学知识，早就在存在，甚至不论有没有人类文明，不论有没有这个宇宙，它们也存在，而且永远存在。


    设想有个外星文明，他们搞出来的数学，难道一个苹果加一个苹果还能等于三个苹果不成？肯定也是1+1=2，无非是符号系统跟我们可能不一样。


    也许某个别的宇宙里，因为空间是弯曲的，其中外星文明的几何学也会跟我们不一样，但两种几何学其实都是“大数学”的一部分，我们本质上还是说的是同一个数学。


    那么有一派人就认为，所有数学，构成了一个独立于任何宇宙、任何文明的世界，数学自己就是一个客观存在的世界，也就是“柏拉图世界”。这个就是我们所说的“算法宇宙”。哪个数学家发现了什么新的定理，找到了什么新的算法，其实就是看了一眼这个柏拉图世界里的东西。沃尔夫勒姆的意思是说，也许将来我们可以更快更好的办法，系统性地从这个世界拿东西用。


