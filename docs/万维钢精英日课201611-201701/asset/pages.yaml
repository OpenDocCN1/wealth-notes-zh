  md: '# 周末小议 | 独一无二，才是宝物


    这是我最近买的一本书，Codices Illustres，大约可以翻译成《绘图抄本》。一本非常笨大厚重的书，五百多页，内容是古代欧洲手抄本书页的欣赏合集。


    ![](img/9befb2e4b5878711040fbe72f1245d32_187_0.png)


    编录这本书的人下了很大功夫，从各地珍藏的古卷中精选出来书页，还要配上说明讲解文字。一般的彩色印刷术都是四分色，要想金色只能用别的颜色混合出来一个假金色，而这本书为了表现古书原貌，特意在其中间二百多页中把真金色作为第五种颜色使用。此书的纸张也很好，感觉挺厚，每一页都精精执敞。


    ……我说这些的意思是想说，这点功夫，跟原始的古卷相比，根本不值一提。


    ![](img/9befb2e4b5878711040fbe72f1245d32_187_1.png)


    这些都是印刷术流行之前，欧洲的手抄书。手抄，简直比印刷高级太多了！上图是中世纪一本古书的一页，我们来看看那时候的“书”有什么特点：


    +   精益求精的“插图”。这张还不算最好的，有些书的插图完全是高分辨率油画水平。


    不厌其烦的装饰。书页边缘会有植物和小人像的装饰花纹。这些花纹粗看有规律，细看有变化，还使用了不同的颜色，应该都是一笔一划纯手绘的，而不是用什么印章一页一页印上去的。


    每句话的开头字母不应该是大写吗？这个大写字母也有多个变化。每章节第一个字母的“大写”，完全就是一幅小画，如图中④。每句话的开头字母也都使用了不同的变化，适尺寸都不一样。


    每个自然段结尾的“空白”处，全都用某种长条图案填充。填充图案仍然是各不相同。


    页面上有好几种不同的颜色。有时候一段话写着写着也要变个颜色。


    装饰图案的笔画可以做到非常细，也不知用的是什么笔。


    有些书还用了金粉和银粉装饰。


    这些书，当然非普通人所能拥有。很多书是献给权贵的礼物，但大多数似乎都与宗教有关。宗教需要图书，抄书匠们也是以宗教精神在制作这些书，也许他们根本不在乎凡人的眼睛，把书当成对上帝的致意。


    我们今天说图书馆，大楼都比图书贵得多；那时候的人说图书馆，说的是一座知识的——不是比喻的——宝藏。这本书提到，十三世纪某修道院图书馆起火，神父冲进去，把书一本本从窗户拖到楼下，为了抢救书而被烧死了。


    最关键的是，每一本手抄图书都是独一无二的存在。


    有些书只此一本，它没了知识就失传了。有些书是抄的别的书，但即使是抄书，也不不仅仅是原封不动地复制文字。抄书匠可以在这个过程中大搞艺术创作——我猜他们很享受这个过程，总是这里用个图案那里换个图案，就好像炫技似的。


    拥有一本这样的抄本，跟现在花钱买本书，能一样吗？从手抄本到印刷术，从产量而言当然是利在千秋，但是单论一本书的质量，我看纯粹是退步。


    上面说的那些手抄本的特点，现代排版技术大概统统做不到。我们经常看到有人用手写“字体”冒充手写“字”——但其实你仔细一看就能分辨出来，两个相同的字，写法一模一样。只要你“排版”，只要你想“自动化”，你就一定会在某地方使用简单的重复。


    “重复”，是工业革命以来的时代主题。所有产品都是复制品。


    你开的车、用的手机、拿的包、戴的表、喝的饮料——只要是买来的，都是复制品。


    美国开发一种新药，在某些国家卖成千上万的高价；印度人复制一个，只要几十元。有人问印度复制品的药效能一样吗？当然一样——成分都是固定的，原材料都是到处都有的。


    现代制药业，本质上就是软件业。所有成本几乎都在研发这里，一旦定型，生产成本可以忽略不计。当然电影业、唱片业，早就是软件业。


    将来的招商智能接管各个领域的生产环节，那么一切行业都是软件业。


    没人会为卸载一个软件或者扔掉一张唱片而感到心疼。


    也许将来的价值观，会特别重视那些独一无二的东西，而鄙视复制品。


    那么人工智能接管生产工作以后，也许人类工人的一个出路所在，就是过去抄书匠这样的行业。手工业可能会复兴。手工匠人会故意使用一些花哨的技巧——标准是让自动化生产线很难做到，或者就算能做到也不值得专门为一件东西做。


    印刷术和大规模工业生产，也许只是人类文明史上一段小插曲。


