  md: '# 答读者问｜矛盾不矛盾


    ![](img/9befb2e4b5878711040fbe72f1245d32_46_0.png)


    # 来自日课:任意的震动


    风筹有风：这里面提到了，笨办法，和天才。前者可以通过专注力训练，刻意练习提高。后者就有点虚无缥缈的意味了。而且混乱产生灵感的前提还是那些大人物。就算在我的理解中也是赞成那种已经有很好的知识基础，思维能力，概念铺垫的人，可以用这种随机震荡的方式，就像举的例子中说到，伦敦地铁罢工，人们采用新的换乘方式，这一点还是伦敦有足够丰富的交通方式和多样的交通线路吧！如果，压根儿就没有这些基础，大概人们就只能开车或者走路了吧！所以，我还是理解这本书的前提不是为乱而乱，只是有了那些刻意训练的能力之后，拥抱不确定性。不知这样的理解是否正确？


    幸运每一天：任意的震动是牛人找到新的突破，而我们普通人没有那么多的积累知识，任意的震动对我们是好是坏呢？普通人需要的是专注。


    ![](img/9befb2e4b5878711040fbe72f1245d32_46_1.png)


    # 万维钢


    我们普通人既需要专注也需要震动。如果什么事情都是按照事先学会的一套固定流程操作，那的确不需要震动，但我们总会遇到必须要解决一个什么问题，而这个问题又没有事先设定好的解法的时候。比如说你要上街买件衣服，专注的做法，是事先测量好自己的尺码，想好衣服的风格、颜色、质地等等，按照这些设定的条件搜索。可绝大多数人根本不是这么买衣服的！我们都是到商店里随便看看，也许就有一件你事先完全没想到自己会喜欢的衣服，甚至是一件你从来都没见过的衣服，这不就是震动吗？


    刻意练习，最最适合的是那些受外界影响小的项目，比如花样滑冰、游泳、高尔夫这些。如果一个项目随时受到环境的影响，比如打仗、足球，那么刻意练习的作用其实是练基本功——基本功不可一日荒废，但是大局观和灵感也得有。


    工作中也是这样，大多数人并不是在生产流水线上重复一个固定的动作。你总会遇到一些没有流程、需要临场发挥的问题。面对这种情况下如果一时之间不知道怎么做，与其抱怨自己没学过，还不如四下看看，找找震动。如果你对环境保持敏锐观察，也许就能随时找到意外的解决办法。


    专注和震动，未必是此消彼减的取舍关系，也未必是先练好了刻意练习才能寻求灵感，更有可能是乘法的关系：收获＝专注 × 震动。


    为什么有些跑堂的伙计，最后居然能变成经理甚至老板？当然是因为他见机行事，总能创造性地办成一些通常不是伙计该办的事情——他必定是一个有自由意志的、机灵的伙计！


    哇咪咪：以前是说专注做好一件事，做好一个项目，再做另一个项目，我都搞晕了……这怎么回事？如何协调和自洽？我们有很多任务或者项目，这个做不动了，先做另一个，然后做某一个的时候就专注做某一个？


