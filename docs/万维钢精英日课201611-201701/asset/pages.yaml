  md: '# 日课108｜明星和粉丝的正确关系


    日课108｜明星和粉丝的正...


    今天我们接着说《注意力商人：进入我们脑袋的史诗争夺》（The Attention Merchants: The Epic Scramble to Get Inside
    Our Heads）这本书，作者是吴修铭（Tim Wu）。


    在讲互联网注意力商人收割注意力的最新方法之前，吴修铭专门用了几章的篇幅，考察了现在另外一种注意力商人，也是我们这个时代最重要的一个文化现象：娱乐明星。


    中国大概是从1990年代才开启了娱乐时代，至今也就二十三年，有很多现象我们可能还没完全适应。娱乐明星对社会能有多大贡献，他们凭什么赚那么多钱？有人崇拜有人鄙视，简直很难用平常心看待明星。


    而美国歌舞升平了这么多年，明星文化可能更加成熟，吴修铭总结的这段历史，可能给你带来启发。


    这一切还得从亨利·卢斯说起。


    # 1.老办法的新机会


    《罗辑思维》视频有一期节目叫《老办法抓不住新机会》，罗胖重点讲了亨利·卢斯的故事。亨利·卢斯，1920年代创办《时代周刊》，是媒体界革命性的人物。


    卢斯对新闻行业有一个洞见。其他媒体报道新闻都是以议题和事件为核心，而卢斯的《时代周刊》却是以人物为核心——确切地说，是以大人物为核心，是政治家或者取得了非凡成就的强力牛人。读者最关心的不是事儿，而是人！《时代周刊》曾经连续几年，每期都事无巨细地记录总统做了些什么。这是一个大获成功的新新闻理念。


    几十年过去了，到1972年，亨利·卢斯去世，他的时代·生活公司面临一个巨大困难。旗下的《生活》杂志已经连续几年巨额亏掉，因为年轻人 negatives 换。公司痛定思痛，创办了一个新杂志，叫《人物》。


    《人物》杂志的创意之处在于，它还是用卢斯的老办法，也就是要以人物为核心——但是这一次报道的不是总统，而是演艺明星。


    # 2.怎样当好娱乐明星


    第一，至少得有80%的读者认识她。


    第二，她身上必须有一个现在大家都想知道的事情。


    第三，符合上面两个标准的，还要按照以下顺序排序——也就是说，明星其实是有等级的：


    +   - 年轻的优于年老的；

    - 貌美的优于貌丑的；

    - 有钱的优于没钱的；

    - 电视明星优于音乐明星，音乐明星优于电影明星，电影明星优于体育明星……排序最低的，才是政治明星。


    这个排序很值得玩味。一般不都说电影比电视高端吗，为什么电影明星的优先级不如电视明星？体育明星付出的努力更大，为什么排序这么靠后呢？美国读者的这个口味序列，就暗示了明星对粉丝的意义所在。'
