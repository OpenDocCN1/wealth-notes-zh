  md: '总而言之，从那时起，一直到今天，人们对“平均值”就有了两种态度——


    +   用一群人的平均值来代表一个人，说明什么叫“正常”，并且作为公共政策的依据；

    用偏离平均值的距离，来给人排序和分类。


    凯特莱和高尔顿的思想在今天看来平淡无奇，而在当时来说，其实对观念有很大的冲击力。我举个例子你就明白了。比如说自杀。


    当时的人本来以为，自杀是个非理性的行为，甚至可以说是疯子的行为，根本无法预测。可是凯特莱根据比利时统计数据，就（正确地）告诉公众，每年死于自杀的人数，占整个人口的比例，都差不多——就像有个什么力量要求每年必须有这么多人死于自杀一样。


    那么据此，凯特莱就可以说，一个“平均人”，有一个固定大小的自杀倾向。这就非常令人震惊——我还以为我活得挺好，原来我还有一个自杀倾向！


    # 请问这种推理对吗？


    高尔顿抓住这个“相关性”，甚至认为一个人的勇气和忠诚度也和他的智力是相关的——所以社会就应该把人按照学习成绩排名。既然学习好就等于什么都好，那我们干脆就创造一种制度，让学习成绩来决定人的前途吧？


    # 请问这个制度合理吗？


    真正用“平均人”这个思想改变世界的，还不是凯特莱和高尔顿，而是一位实干家。接下来要出场的这个人物叫弗雷德里克·温斯洛·泰勒（Frederick Winslow
    Taylor）。今天人们常说的所谓“泰勒制”，就是他的发明……咱们明天继续说。


