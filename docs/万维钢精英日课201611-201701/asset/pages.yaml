  md: '# 周末小议 | 学点 computing


    请原谅我在标题中使用了一个英文单词。 computing 和 calculating 翻译成中文都是“计算”，可是它们的意思并不完全一样。用计算器算个账，是calculating，而我总感觉，computing是更高级的计算行为。


    我们本周的专栏文章有个偶然的主题：计算机科学。周一《数学家告诉你什么时候结束单身》说的是算法，周三《现代世界的快速上升管道》提到了高级编程工具，周五《一个神人的世界观》说的是Mathematica的发明人沃尔夫勒姆。


    我们专栏的一些读者本身就是程序员，不过大多数人可能未必熟悉这些内容——我就特别想问这些读者一个问题：


    ——你难道不想试试这种高级的计算吗？


    Mathematica就是个很好玩的计算工具。跟一般计算器和普通编程语言不同，它可以进行“符号计算”——也就是像人一样计算。


    比如你可以用它算个最简单的分数加减法：


    ```

    In[1]:= 1 / 3 + 4 / 7


    Out[1]= 19 / 21

    ```


    第一行是我的输入，第二行是它的输出结果。它直接给了一个分数答案，而不是像计算器那样给一个近似的小数结果！


    它还会解方程，比如来个一元三次方程：


    ```

    In[4]:= Solve[x^3 + x + 1 == 0, x]

    Out[4]= ...

    ```


    它给出了精确的一个实根和两个虚根。如果你想要小数结果，只需要在输入的时候把一个数写成小数：


    ```

    In[5]:= Solve[x^3 + x + 1. == 0, x]

    Out[5]= {x -> -0.682328}, {x -> 0.341164 - 1.16154 i}, {x -> 0.341164 + 1.16154
    i}

    ```


    哪怕方程参数不是具体数字，它也可以算：


    ```

    In[8]:= Solve[a x^2 + b x + c == 0, x]

    Out[8]= {x -> (-b - Sqrt[b^2 - 4 a c])/(2 a)}, {x -> (-b + Sqrt[b^2 - 4 a c])/(2
    a)}

    ```


    它可以算积分：


    ```

    In[10]:= ∫ 1 / (1 - x)^3 dx

    Out[10]= 1 / [2 (1 - x)^2]

    ```


    它还可以非常方便地生成各种函数的图像：


    ![](img/9befb2e4b5878711040fbe72f1245d32_71_0.png)


    你还可以让它把圆周率算到任意多位数：


    ```

    In[16]:= N[Pi, 10000]

    Out[16]= 3.14159265358979323846264338327950288419716939937...

    ```


    可以说，一个人从小学到大学毕业所需要的所有数学计算，Mathematica都会——事实上，Mathematica算积分的能力超过所有人类。


    现在的Mathematica已经被沃尔夫勒姆给扩充成了“沃尔夫勒姆语言”，它不但能做各种计算，而且是整合了各种实际知识，可以随意查询和使用。比如在Wolfram|Alpha网站，你可以很方便地比较中国、美国和欧盟的GDP情况：


    ![](img/9befb2e4b5878711040fbe72f1245d32_71_1.png)


    不过这篇文章并不是想向你介绍Mathematica或者Wolfram语言，而是想让你对“计算”，重新产生兴趣。


    我们大多数人使用计算机主要做的事情大概是上网、看视频、处理文档等日常生活的事情，但是别忘了，计算机还可以用来……做计算！


    用 Excel 算个账是一种计算，用 Mathematica 画两个图是一种计算，而更高级的计算，则是编程。并不是只有程序员才应该编程。


    编程的本质，是你写一个剧本，让计算机根据剧本去完成你交给它的任务。你发布命令，计算机执行命令。你负责想事儿，计算机负责做事儿。你深谋远虑，计算机埋头苦干。这难道不是很有意思的事儿吗？


    编程不见得非得是为了做个什么产品，自己在生活中也能用到编程。前段时间很热闹的阿里程序员写了个脚本抢月饼事件，你听说之后，难道不想学学这个脚本是怎么写的吗？


    我自己写过几个简单的脚本。以前老的 Kindle 阅读器，把你读书时高亮的所有句子，做的所有笔记都存在一个文件之中，可是如果同时读几本书，这些书的句子和笔记就会混在一起没法看。我就用Python写了个小程序，能把一本书的高亮句子和笔记从
    Kindle 文件中直接提取出来，单独形成一个整洁的文件，非常好使。这个程序我用了很多次，不知道省下多少时间！


    今年我儿子学乘法，不好好背口诀。为了让他刻意练习，我就写了个小程序，能生成一份乘法考试试卷：


    3 × 8 =   5 × 7 =   4 × 4 =   7 × 4 =

    9 × 2 =   3 × 7 =   9 × 5 =   4 × 9 ='
