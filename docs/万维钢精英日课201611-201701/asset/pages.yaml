    全体编剧听了这首歌。迪斯尼高层当场拍板：这首歌就是主题曲，这首歌就是整个电影的主题。


    ![](img/9befb2e4b5878711040fbe72f1245d32_13_0.png)


    # 3.扰动


    所有编剧都喜欢这个主题，现在两姐妹都是好人，观众都喜欢，而且还产生了张力。一通百通！整个影片三分之二的剧情很快就定下来了。


    但是编辑团队又有了新的麻烦：他们不知道结局怎么写。


    # | 我的评论


    对有志于创造内容的人来说，这个故事里可以学的东西实在太多了。但我最想说的，是迪斯尼的创作态度。


    # | 由此得到


    三个激发创造力的办法：


    +   1. 把你最想要的东西列出来，用解决问题的思维想想怎么实现它。 2. 个人的经历，往往是创作的源泉——你要做的是把自己投入过情感的经历，跟新的东西连接起来，这就是创造。
    3. 旁观者清。陷入一个情境不能自拔的时候，主动换一个视角。


    ![](img/9befb2e4b5878711040fbe72f1245d32_13_1.png)


    日课精选 西风之雨 22 今天的日课我的感想是两点:潜能展示的是你冰山下的另一角。创造力也有章法可循。1.厚积薄发。平时多积累（阅历，学识等等），用时才能轻松，才能达到时效性。2.以终止为始或叫不忘初心方得初始，没有目标是达不到效果。爱丽丝梦游记中猫讲，如果你不知道要去哪里，选择不起任何做用3.举一反三，多玩跨界，如可以借用经历，做放改变'
