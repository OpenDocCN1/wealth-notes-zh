    日课109 | 业余时代的终结


    今天咱们继续说吴修铭（Tim Wu）的《注意力商人：进入我们脑袋的史诗争夺》（The Attention Merchants: The Epic Scramble
    to Get Inside Our Heads）。


    不知你是否还记得，在个人博客出现以后，社交网络流行之前，我们曾经有一个单纯美好的业余互联网时代。


    那大概是2005年以前的事。忽然之间仿佛每个人都开始写博客，人人都有表达权，个人的影响力越来越大。从大学教授到中学生，从学术讨论到娱乐八卦，各类型的博客都有读者。人们甚至寄希望于用博客改变世界，而且的确就发生了很多因为一篇业余作者的博客文章掀起一场运动，让企业和政府低头的故事。


    弗里德曼据此认为现在“世界是平的”了。他说一个业余青年写的博客，影响力可以超过一家主流媒体的报道。他说过去的世界讲国家和公司，现在的世界讲个人！


    那时候的博客没有付费阅读，没有打赏，甚至没有什么广告，没人谈钱。人们花自己的业余时间写东西，以为互联网贡献内容为荣。维基百科不给稿费不收费，结果做得比所有收费的百科全书都更全更好。有人特别感慨，写了本书叫《认识盈余》，赞美这“无组织的时间力量”，说我们少看点电视，如果人人都献出一点认知盈余，世界将变成美好的明天……


    但是我们得知道，世界上的任何事情都处在不断的演化之中。


    再好的梦也有醒过来的时候。


    去中心、无组织的东西好是好，但是不赚钱——想要赚钱就得有个什么中心把力量组织起来。从早期业余电台到后来的商业电台，从松散的社会团体到凝聚力强的政党，这几乎是一个颠扑不破的真理。


    很快就有人想把博客整合起来赚钱。2005年，美国出现了“赫芬顿邮报”（The Huffington Post）。这是一个博客平台，任何人都可以到这个平台上开博客，平台给你提供编辑和推广服务。作者没有稿费，所以专业记者和作家不会来，但是各路业余影响力精英来了不少。赫芬顿邮报的商业模式是低成本运营，用耸人听闻的标题和吸引眼球的图片吸引流量，然后把读者注意力卖给广告商。


    从吸引注意力角度，赫芬顿邮报做得非常成功，它的文章标题都是科学实验出来的产物，大脑甚至无意识地就想去点击。各种热点新闻，政治问题，都从普通读者最感兴趣的角度切入，完全不像主流媒体那么严肃，真正是喜闻乐见。


