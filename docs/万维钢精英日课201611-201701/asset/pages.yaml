  md: '# 答读者问｜越简单越好，但不能过分简单


    来自日课：数学家告诉你为什么难得糊涂


    aaayin：我有个疑问，叙述比较长：模型成立的前提是“以前发生过的，以后以大致相似的方式发生”，针对模型选择的问题，在机器学习领域有个定理叫“天下没有免费午餐”，意思是所有情况充分发展的时候，所有模型的效果是一样的，这有详细的数学证明。所以很难说哪一种模型在所有情况Total都适用。过度拟合对于聪明人和老年人都是容易犯的错误；不过，在另一个极端，“欠拟合”（under-fitting）则是没有充分考虑数据变化趋势所带来的错误，是年轻人常犯的。问题是，仅仅强调过拟合的坏处，是否会有认知偏差，跌入欠拟合的错误？


    万维钢

    您说的这个道理，就如同爱因斯坦说的“Everything should be made as simple as possible, but not simpler.”——越简单越好，但是还不能过分简单。


    《指导生活的算法》这本书提到，判断一个模型是否过度拟合了，可以用交叉验证的办法。比如说把已有的几个数据放着不用，拟合出来的模型再跟这几个数据对照，看看有没有很大差异；或者干脆选取一组数据用另一个模型拟合一下，看看二者的结果是不是差不多。如果能交叉验证，就说明现在这个模型比较可靠。我看这个办法用来判断欠拟合更方便。


    Jo：昨晚我在读《万万没想到》的“反常识”一章其中提到确认偏误，当然我也有这种体验，并且自己有时还能感觉到，我突然想到之前说的贝叶斯方法，万老师曾举例小孩学习的方法就是贝叶斯方法的具体实例，那贝叶斯方法和确认偏误相违背吗？尤其对于我们有预设立场的成年人而言，我的解答是在想法求证时是贝叶斯而求证后就得确认偏误。


    万维钢

    贝叶斯方法恰恰是治疗确认偏误的！贝叶斯方法要求观点随着事实发生改变，确认偏误是无视事实，观点不变。


    其实我理解您的担心。你是说，自己有个先入为主的观点，这个动作就可能有问题——没错，最理想的观测应该是事先不预设任何观点，完全靠数据说话。但大多数情况下根本没有那么多数据！贝叶斯方法的精神，就是数据不够的时候，它允许你先猜测一个观点，然后新数据来了慢慢修正。我们整个说的意义，就是这么做不但合理，而且高效。


    zy：我怀疑人脑里也有类似于保险丝的结构防止信息过载。这倒让我想起了AlphaGo，不知道AI是怎么防止自己想太多的。给不同信息的重要程度配权重吗？


