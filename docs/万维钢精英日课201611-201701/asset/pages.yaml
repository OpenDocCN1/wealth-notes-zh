  md: '一般低俗网站研究的都是怎么吸引用户点击。BuzzFeed研究的是怎么吸引用户分享。它不指望你主动来，它关心的是你来了，看完一条“新闻”之后，愿不愿意把文章分享到自己的朋友圈。BuzzFeed
    75%的流量，来自社交网络。


    一个<|start|>人听闻的标题能吸引人点击，但是内容不好就不会有人分享，所以追求分享比追求点击高级。BuzzFeed使用了一系列的大数据分析方法，找到了让人愿意分享的秘密。可吴修铭这本书里没细说！我也希望读者分享咱俩日课的文章，所以我专门调研了一番，总算找到几条
    BuzzFeed 的实战经验——


    +   - 不要愚弄读者；

    - 做好你自己，要有个个性意识，要以分享这些内容为荣；

    - 多尝试新想法；

    - 要把注意力放在情商上，而不是智商上，要调动人类情感。


    最后这条，就是为什么BuzzFeed上有那么多有关小猫小狗的内容——宠物代表爱心！你要写过节回家，重写写跟你家小狗的互动。你要写连环杀手，重点写他怎么虐待动物。


    你觉得这种新闻怎么样呢？BuzzFeed上没有什么严肃新闻，但也没有特别恶俗、令人作呕的东西，都是一些轻松幽默又机智，充满爱心的小文章。把这些文章分享给家人朋友，不但不会被鄙视，别人还感觉挺温暖。


    但这种内容，哈哈就是新时期的“低俗”。BuzzFeed迎合的是人们卖萌和表现爱心的需求，人们把注意力都放在这种垃圾新闻上，谁还会关注严肃议题呢？很多人就说，BuzzFeed这类新闻是互联网的堕落，是对真新闻的最大威胁！


    咱俩前几期说过，用低俗换流量的新闻其实是不赚钱的 —— BuzzFeed 也不赚钱。它直到2013年才扭亏为盈，直到现在的年利润也才一千万元。


    但它是个坏榜样。现在连《大西洋月刊》、《纽约人》这类所谓高格调传统媒体都开始学BuzzFeed了。


    # 3.希望


    现在再看今日的互联网，是不是有点乌烟瘴气，甚至黑暗侵袭的感觉。


    Google曾经号称“不做恶”，Facebook曾经那么不愿意发广告，今天他们都变了。作为上市公司，每个季度的财报都必须好看，两家公司都在滥用广告。用吴修铭的话说，一个苏联间谍看到它们滥用用户隐私信息发广告的手段，都会感到脸红。


    当然，好东西并没有完全消失。维基百科继续存在，而且继续做非盈利组织。Reddit很像早年的论坛，网友讨论风气很正。Medium.com是博客时代的遗迹，业余作家也能在上面写出认真的作品。还有各种小众杂志，比如咱俩日课常引用的Aeon，《鹦鹉螺》，《英国心理学学会研究文摘》等等。但是吴修铭说，这些东西，只能算是一片黑暗中仅有的亮点。


    说一千道一万，所有注意力商人的工作模式都是收割观众的注意力，向观众投放广告。互联网上各种负面的东西，也大多是因为广告！


    吴修铭最后给我们的两个建议，就是要看视频就花钱去用Netflix，要上网就带着广告拦截工具。


    # ｜我的评论


    吴修铭这本书是按照技术进步的线索写的，把各种文化现象都归结于技术。以我之见，至少在中国来说，人群的进步也是影响文化的重要力量。我想借此机会说一个自己的小理论：中国的文化品位，主要由观众的流动决定。


    上世纪九十年代末，我在国内上大学的时候，有一次看到有个同学居然在宿舍里手写文章。我说你怎么变文艺了？他说这是为了发到BBS上去的，先写好，等到实验室再输入电脑。


    这是多么美好的奉献。为什么那时候人们如此郑重其事地上网，而且以此为荣？因为能上网的人很少！网络本身就是个门槛，简直就是高素质人才俱乐部。


    为什么早期中国的电视剧都挺严肃，很讲社会责任，有的导演还特别追求文学的味道？为什么现在的电视剧都很弱智？因为看电视的人变了。我几年前看到过一个采访海岩的报道，记者问他，以前“海岩剧”那么流行，怎么现在你不写电视剧了？海岩说现在只有保姆才看电视剧。


    Netflix和各大收费影视网站是个很好的方向，我们大概可以期待网播剧时代能出一些精品。


    高素质观众去哪里，哪里才有好的文化。他们总是领先一步，从来没有被用广告换廉价注意力的商人追上。


    # ｜由此得到


    今天各种媒体的一切技术似乎都 estabelecimento 了，最好的和最坏的东西我们都见识了。观众不会永远被动，早晚都要反击。


    但正如吴修铭所说，最好的办法就是宁可花钱，不看广告。如果人人都有这样的意识， 注意力商人又能怎么办呢？


    （全书完）


