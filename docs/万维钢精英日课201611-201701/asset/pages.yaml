    万维钢


    我给你点赞！


    其实偶尔晒个幸福挺好，就算晒得多也不能说“不对”。我觉得关键不在于晒什么，也不在于晒多少，而在于你有多少“在意”这个东西。


    有的人高兴了就发个自拍，跟亲友分享一下自己的动态，时不时还自嘲、恶搞，纯属闹着玩，这种心态都很好。而如果一个人——


