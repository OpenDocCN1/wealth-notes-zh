  md: '# 答读者问 | “爱折腾” 是运气的宠儿


    # 来自日课：数学家告诉你最好的时间管理


    罗鑫（絮塔）：有两个问题与这篇文章密切相关却未被提及。第一，如果要计算每件事的密度，那如何为这些事合理估值？只用物质回报来估值，应该会错过很多对人生非常重要的事情。第二，时间管理还是精力管理？时间总量其实对每个人都差不多，最大的区别是如何在有限的时间内精准地选择做合乎人生大目标的事，并高效率地搞定。选择和搞定都会消耗精力，如果在同样的时长内人的精力密度更高，无疑会获得相对更多的可支配时间。那剩下的問題就变成如何提升人的精力密度了。


    SiSi Ieong：我最近有个困惑，就是不能每天写日课。因为有别的必须完成的任务还有生活琐事。那重要程度怎么衡量？单纯用钱衡量是不够，写日课能给我带来金钱吗？但对我的成长很重要啊！我写一篇日课要到两个小时，运动也很重要，花的时间也要两三个小时。每天做的任务感觉就是在紧急和重要的事情之间徘徊。


    万维钢

    用金钱给事情的重要性估值，是一个方便的办法，做这件事获得的一块钱严格等于做那件事获得的一块钱。这个做法的精神并不在于“金钱”，而在于“量化”。你说这件事比那件事“重要”，我们就要问到底怎么个重要法？重要程度如果不能“量化”，就没办法合理规划。

    “量化”，是使用数学手段解决任何问题的第一步。不过“量化”这个动作本身，就有很大的问题，比如说人的生命，能不能用一个一般等价物来量化？只有把人的生命给量化了（说白了就是你算算一条人命值多少钱，或者值多少社会平均时间），经济学家才有可能评估诸如机场安检之类的公共政策的合理性。你用了量化的方法，别人就会批评你，说生命是无价的，怎么能用钱来算呢？可是不量化就没法计算。再者，其实现们心知肚明，生命不可能是无价的，否则为了避免车祸应该禁止一切车辆通行！

    当然量化的方法不限于金钱。总而言之，这个精神就是对事情的重要性有个量化的观念，比如“A比B重要两倍”这种。

    这些方法默认每件事消耗精力的速度是一样的。如果要考虑精力消耗，并且假定精力差的情况下工作水平低，那么大概应该优先完成精力消耗低的任务。


    # 来自日课：决策左右命运，还是运气左右命运？


    刘玉冬：成功的命运也许有充分条件，但是我们还没认识到。决策、努力、运气都是必要条件，如果成功是从0到100，那么决策和运气是跨越0到1的主要形式，努力是从1增长到100的主要形式，前者是跨越不连续性的点，后者是连续性增长的方式。这个作用的重要性怎么比较，标准是什么呢？


    万维钢

    这是一个好问题！弗兰克的理论对“运气”并没有进行特别的建模——在他描写的模拟实验中，运气只是作为一个锦上添花的因素，在能力值之上添加几分。他这个模型低估了运气的重要性。

    不过你这个“运气是从0到1，努力是从1到100”的模型也不合理，这个模型等于说“没有运气再怎么努力都是0”！

    我不知道搞一个更好的运气模型有多大意义，简单的模型已经足够说明运气对成功很重要。


    邱小杰先生：处在二十几岁的妙处同时也是坏处就是：我所做的每个决定都将改变我的余生，那到底是因为我做了一个好决定，导致我运气更好，还是我运气好才做了一个好决定？


    万维钢

    这个问题，明天文章最后有解答。


    # 来自日课：运气动力学


    Lina645563：运气是否可以理解成概率呢？天赋是基因决定的，运气是随机发生的，那人本身能做的也只能是努力，提升能力，期待好运来临？


    kaka：既然运气也是如此重要，我们应该做个什么样的人呢，怎样的性格才是宠儿呢？


    万维钢

    没错，运气只是概率，这意味着在本质上你无法左右运气，你只能左右自己的努力。

    不过这并不是说你对运气就什么都不能做。期权、投资组合化、反脆弱，这些都是我们“管理运气”的手段。对一个明天就将发生的具体的事情，我们没办法只能等着；但是如果我主动出去尝试一些不同的事情，而且：

    1，就算是事情每一件都失败了，我也没有太大损失；

    2，只要其中有一件事情成功了，我就有很多的收获。

    那么有“爱折腾”这种性格的人，就是运气的宠儿。


    小兔子：是不是这个理论很有帮助缓解阶级固化时代的焦虑啊。中美在这个问题上心态一致吗？


    万维钢

    美国对阶级固化的焦虑感更强一些。中国还是比较朝气蓬勃的，我感觉。'
