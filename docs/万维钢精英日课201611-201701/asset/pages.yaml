  md: '学家才能计算。


    答案是37%。


    数学家的策略是，你要把这一个月的时间分成两个阶段。在第一阶段，你只看不买，就是根据自己的购买能力，了解一下市场上哪些房子你喜欢，哪些你不喜欢。记住在这个阶段内你看到过的最满意的那个房子。


    等到过了某个时间点——具体说过了你设定期限的37%以后——你就进入第二阶段。如果事先设定的期限是一个月，那么第二阶段就从第12天开始。


    从这天开始，你一旦遇到一个比第一阶段那个最好的房子好，或者类似的房子，就毫不犹豫地买下来。


    分两阶段这个策略，和37%这个数字，都是数学家们好不容易算出来的。实际上这是一个随机选择优化问题，1958年才被解决。现在人们就把这个办法叫做“37%规则”。


    37%规则并不能保证你一定能买到最好的房子，但是在假设市场上的房子随机出现的情况下，它是能让你买到一个足够好的房子的足够好的办法。从概率角度，如果你看了不到37%房子就开始买，你将更可能后悔买早了；如果你看了超过37%的房子开始买，你将更可能后悔买晚了。


    我们生活中有很多情况跟买房是类似的， 好东西过了这个村就没有这个店，那要还是不要？使用37%规则，是你作为一个理性人在这个不确定世界中所能做到的最好，那么你就可以无怨无悔，没有那么多纠结和痛苦了。


    ![](img/9befb2e4b5878711040fbe72f1245d32_54_0.png)


    再举个例子，找结婚对象也可以用37%规则。比如一个女青年，从18岁开始找对象，设定的目标是在40岁之前结婚，那么根据37%规则，她的两阶段分割点是26.1岁。


    在数学家看来，这个女青年的最佳择偶策略是这样的。26.1岁之前是观察期，她应该只交往不结婚，但是必须记住在交往的男生中间，自己最喜欢的是哪个。26.1岁之后是决策期，再结交新的对象，一旦遇到一个比那个人还好，或者和那个人差不多一样好的男人，就应该马上把他拿下，和他结婚。


    当然具体到择偶的话，这个数学模型还可以更复杂一点。37%规则是假设你向谁求婚，那个人马上就会答应，主动权全在你手里。但如果主动权不在你手里，你向人求婚，有被拒绝的可能性，那么分割点就不是37%了。


    数学家计算，假设你每次被拒的可能性是50%，那我们就要把37%变成25%。也就是说条件不好的人应该缩短观察期，仍然从18岁开始算的话，过了23.5岁之后你就赶紧开始发offer。看谁好就向谁求婚，他要是同意你就达成目标，他要是拒绝你就再看下一个。


    还有一点，37%规则是在假设无法回头的条件下成立的，也就是说如果你在第一阶段错过一个人，他可能就和别人结婚了。可是如果你条件非常好，就算一开始错过了一个人，过了一段时间回去找他，他还有可能答应你的话，你的观察期就应该延长。


    具体来说，数学家计算，假如在观察期内已经被你拒绝了的人，你回头他还有50%的可能性会同意，那么这种情况下，你可以把观察期从37%延长到61%。


    条件好的就多等等，不要急于决定；条件差的就赶紧行动。数学家的计算结果，跟我们的常识还是符合的。


    当然，这些计算都是数学家把人们找对象的过程给理性化、模型化了。这个模型里没有“命中注定的真爱”这个概念，似乎缺少了一点浪漫元素。你可能会说我一定要找到真爱才能结婚，可什么是真爱？在数学家看来，你一看A觉得不错，但是错过了，那么再找到一个和A差不多的人，也就可以了。如果你非得说只有A才是真爱！那就不对了。


    在这个问题上，我觉得你不服不行。如果你说找对象跟买房子不一样，我一定要寻找到命中注定的真爱，那么数学家告诉你，你大概会有两种可能结局：或者后悔自己没有早早结婚被剩下了，或者后悔自己结婚太早。


    理性的人，应该知道什么时候停止。


    说到停止，这本书里还提到一个问题。假设有一个抢劫犯，通过一次次的抢劫获得财富。抢劫，总是有危险，哪一次失手被抓进去了，前面的钱就都白抢了。可是不抢，就不能得到更多的钱。问题：他应该什么时候收手呢？


    这个问题在（某些人的）生活中也很常见。我们看黑帮电影，经常有人感慨该收手的时候没有收手，正所谓“身后有余忘缩手，眼前无路想回头”。我写此文的时候上网搜索，发现某地的“廉政网站”，居然用这句话教育贪官，也不知作者的意思是让贪官根本别贪呢，还是劝他们做几次赚够了钱就及时收手。


    不论如何，数学家把这个随机优化问题也解决了。算法是这样的，你先估计一下自己抢劫一次成功的概率有多大，然后用成功的概率除以失败的概率，就是你抢劫的最优次数。比如如果你水平高，得手可能是90%，失手的可能性是10%，那么你就应该在抢劫9次以后收手。如果你成功和失败的可能性都是50%，那么这件事你就应该只做一次。


    总而言之，如果我们能有点数学精神，就不用长叹短叹地感慨人生无常了。


    # 我的评论


    我想再次强调，算法不是算命。也许女青年到头来发现他的高中同学才是最合适的结婚对象，也许十拿九稳的抢劫犯第一次作案就失手了——这并不等于是算法不对。


    这些算法，说的是面对一个不确定的世界，你根本不知道命运会怎样的情况下，所能采取的最佳策略。如果找足够多的人试验足够多次，你就会发现这些策略比别的策略好——更比没有策略好。


    我们成年以后在生活中运用到复杂数学的机会太少了。如果你不搞技术，可能就连在工作中用到数学的机会都不多。我们生活中用到的数学，大都停留在小学生水平，比如购物算账。'
