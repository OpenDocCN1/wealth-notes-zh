  md: '# 丨 我的评论


    我认为我们中国人思想中的“标准错误”可能更严重一些。中国的城市人口非常密集，大量的人聚集在一起就容易发生互相模仿。更何况中国人比较热衷于社交，文化比较合群，那么相比强调个人主义的欧美国家，可能就更容易出现模仿的现象。


    比如说，每个中国的大学都有自己的BBS，学生们可以在上面讨论学校的各个方面，可是在号称言论自由的美国，就几乎没有哪个大学有这样的BBS。


    首先我认为这是好事儿，这说明中国互联网本质上就应该比美国发达，咱俩中国人有非常可爱的性格。


    但是这些BBS上，有一个非常有意思的现象——人们热衷于发布各式各样的攻略。我当年申请留学的时候，就从这些攻略中受益良多，包括什么时候考GRE、什么时候考托福、怎么拿到申请表、推荐信怎么写……每一个步骤都非常详细，详细到你最后办理出国手续进行例行体检时，需要打几针预防针，上面都写的清清楚楚。


    这就特别容易让人有标准错误。如果有人未能按照攻略走，他就会感到非常不安！


    既然美国大学都没有BBS，海外中国留人员就搞了个自己的BBS——叫MITBBS（但是跟麻省理工学院没关系），上面从军国大事到购车指南无所不谈。我有一次在这个BBS就看到一个帖子，简直不知道说啥好——


    有人在走杰出人才通道申请绿卡，但是他不知道用什么方法邮寄申请表“比较好”，特意发帖求攻略：是该用联邦快递呢，UPS呢，还是普通邮政呢？然后很多人就结合自身经验给了一本正经的回答。我心里就想，这位大哥，你连邮寄个申请表都不敢自己做主，还好意思说自己是“杰出人才”？


    # 丨 由此得到


    不同的人走同样的路线，很大程度上是体制批量生产，或者互相模仿的结果，这个现象并不“正常”。


    不同的人走不同的路线，最后都实现了自己的目标，这才是真正的“正常”。


