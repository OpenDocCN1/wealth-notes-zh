  md: '从这个角度考虑，我们还是借鉴企业管理比较好，毕竟那都是在实践中总结出来的经验。还记得我们之前有一期日课，《大目标，和任务勾选框》，其中提到通用电气公司发明了一套
    SMART 目标系统，现在已经被无数公司广泛使用。这套系统对于大企业长期创新来说可能有问题，但是对付我们的新年决议则是绰绰有余。


    # 咱们再看一遍这个SMART目标的要求：


    Specific：具体。你不能含糊地说我要“全面提升自己的认知”，得有具体的方案；


    Measurable：可测。将来目标是否完成，结果得是可以测量的；


    Achievable：可实现。你给自己规定的这些任务不能好高骛远，得是可以实现的；


    Realistic：有现实意义。你的目标应该是你现在确实需要的东西；


    Timeline：有明确期限。一周后做到什么程度，一个月、几个月、一年之内做到什么程度，要有时间表。


    # 从小事做起，慢慢养成习惯。我听到过一个最实用的建议是，说服自己就干五分钟。比如你应该打扫房间了，不要想象打扫整个一个房间，那个任务量会把你吓倒。你就跟自己说，今天我就干五分钟，五分钟一到就停手
    —— 这样你才会去干，而往往是一开始干就停不下来。每天都敢于开始，就已经是一个了不起的成就了。


