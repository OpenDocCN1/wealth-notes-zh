  md: '# 日课057｜平庸公司的厚黑学


    日课057 | 平庸公司的厚黑学


    在这个时代，各种研究企业管理、商业模式、创新之道的书和文章实在是非常之多，大概每个人都能说出几个思想和套路来。但今天我突然想到，我们平时大量阅读和谈论的这些东西其实有个系统偏见。


    > ——我们过分关注了成功和高调创新的公司。


    左手谷歌右手Facebook，内有马云外有马斯克，这些公司、书和理论当然都是极好的，但我们可能忽略了一点：这些都是在全世界范围内非常罕见、极其特殊的公司。有句俏皮话说现代心理学理论应该都叫“大学生心理学”，因为研究人员用的受试者一般都是在校大学生——那么根据这句话的精神，我们是否应该把市场上大部分讲管理学的书称为“硅谷管理学”，因为它们研究的其实都是硅谷式的创新型公司。


    世界上绝大多数公司，并不是像谷歌和Facebook那样运营的。


    那些普通的、平庸的、没有什么成功经验值得写书，没有青年偶像式的CEO，甚至可能患有大企业病的公司是怎么运营的呢？在这样的公司或者组织里工作是一种怎样的体验？


    今天要说的是.log一篇文章，作者是伦敦城市大学组织行为学教授 André Spicer，他研究的就是这个问题。这篇文章的标题是 Stupefied: How
    organisations enshrine collective stupidity and employees are rewarded for checking
    their brains at the office door（愚蠢化：为什么组织会供奉愚蠢和奖励雇员不带脑子）


    他给的答案是，平庸的组织，是靠愚蠢运营。


    这句话听着挺极端，但他给了很好的解释，说明为什么你必须愚蠢——实际上是必须假装愚蠢——才能在平庸的组织里很好地生存下去。具体来说，组织的愚蠢化来自五个方面。


    # 1.流程和条例


    比如你是一个刚从名校毕业的大学生，踌躇满志地加入了一家很有名气的咨询公司，你的第一个任务，是深入到客户公司去，帮助客户找出问题，提出解决方案。


    如果你真的发现了客户公司业务的三个重大缺陷，还兴冲冲地提出了一揽子解决方案，你根本就没上道。


    你们公司为客户服务的商业模式早就有固定流程了。可能客户想要的只不过是一份漂亮的PPT而已。你要做的就是上自己公司内网，找些现成的套路，把这份PPT给做出服用头像是一个专业的印象。如果你真想在流程之外发挥自己的聪明才智，还提出别人“致命的”问题，客户可能反而非常不高兴——客户花钱购买咨询服务，不是为了听你一个新人指点江山。


    大组织都是靠成熟的流程和条例运行的。一个医生做的大部分工作，就是在清单的一个个勾选框上打钩而已！按条例走，能确保工作顺利完成，能确保谁来了都能提供同样质量的服务。


    更有甚者，大组织的“动脑时刻”，也就是着手制定新条例的时刻——而不是解决新问题的时刻。新条例定下来了，人就假装问题已经解决了。


    # 2.领导力


    “领导力”这个词现在已经泛滥了。领导们读各种书，上各种培训班去提高自己的领导力。据统计，美国企业每年要花费140亿美元来提升领导力，而结果是……几乎没有任何效果。


    说句大实话：知识密集型的组织里，雇员其实都是自我激励的，根本不需要上面给来个什么领导力！大部分所谓领导，每天干的事情其实就是开会、填表和传递信息。作者说，有个公司的领导张口闭口都是领导力，宣称自己是个开放型的领导。然后他就问这个公司的雇员，你们领导都干啥了？


    雇员说，他每天早上请我们吃早餐，每年还给我们搞一次啤酒品尝会。


    # 3.换品牌


    前几年中国大学有个改名潮，各种农机学院、纺织学院纷纷变为“科技大学”，这个动作，就是改变品牌。对公司来说，这个做法也是屡见不鲜。换个品牌，同时再换一个更漂亮的logo，表示革新的态度……而实际上，真正更新了的，也就是品牌和logo了。


    很多企业家爱说品牌就是自己公司的形象和生命！但是如果你私下问他，你们卖牙膏的，到底怎么卖才能卖得好呢？他如果老老实实地跟你说的话，那就是“关键在于促销。没人对牙膏感兴趣，什么时候搞促销活动什么时候就卖得好。”


    # 4.模仿


    企业家追起星来，跟女中学生追逐名牌没什么区别。昨天马云又说什么了？谷歌又搞了'
