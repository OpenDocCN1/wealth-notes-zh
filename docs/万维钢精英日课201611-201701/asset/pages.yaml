  md: '# 日课095 | 优等生、奇人和猛人：斯坦福商学院都招什么人？


    日课095 | 优等生,奇人和猛...


    昨天咱們提到，公司招聘應該向職業球隊買人學習，不但要全面考察，而且還得招不同類型的人，千萬不能只看單一指標。這個道理是如此的簡單，又是如此的難以操作。比如前几天刚刚结束的大学生考研——中国目前的考研制度，就基本上是只看总成绩这个单一的指标。


    所以我想介绍一个更先进的做法。咱們直接上最极端的例子：斯坦福商学院的研究生院。


    美国私立大学的录取标准往往不对外公开，你甚至可以说根本就没有固定标准。私立大学，没有义务“为国家培养人才”，有很大的办学自主性。哪怕有的学生纯粹是因为他爸爸给学校捐了几千万美元而被录取的，外人也无话可说。没有分数线，没有一定好使的攻略，甚至有点像是黑箱操作，这就让申请者非常困惑——我到底要做到什么，才能进名校呢？


    有本2013年出版的书叫《混沌冲动：几率和扰动如何推动创新、效率和成功》（The Chaos Imperative: How Chance and Disruption
    Increase Innovation, Effectiveness, and Success，作者是Judah Pollack和Ori Brafman）。这本书的作者和斯坦福商学院的一位招生负责人是多年好友，从而得知了一些有趣的内部信息。


    ![](img/9befb2e4b5878711040fbe72f1245d32_165_0.png)


    他们招生的方法，跟中国式考研完全不同，更像是一个球队在招兵买马。


    基本上，斯坦福商学院录取四种人。


    第一类是优等生，占招生总数的50%-60%。这类学生需要优秀到什么程度呢？首先得是名校本科毕业，比如哈佛大学、达特茅斯学院之类。他们可以先学习自由技艺（liberal
    arts），毕业后还得有两到四年的知名企业工作经验——比如高盛那样的投资银行或者像麦肯锡那样的咨询公司。他们的大学成绩单和GMAT成绩必须出类拔萃。他们还得有强力的推荐信，证明他们不但成绩好，而且具有优良品质……用句单田芳的话说，这些就是“挑了又挑选了又选，拔了又拔捞了又捞”出来的人。


    优等生给商学院提供安全感。如果招生是买股票，录取优等生就相当于持有低风险的绩优股。名校毕业，成绩好，还有过大公司的工作经验，品学兼优，这样的人再差也差不到哪去。


    第二类是特长生，占招生总数的5%-15%。特长生给商学院带来天赋。


    如果你成绩没有优等生那么好，那你最好具备某种特别突出的专长。什么叫“特别突出”呢？如果你的特长是小提琴，那必须是世界级水平；如果你的特长是体育，那必须拿过奥运金牌；你也可以是个物理天才，比如斯坦福商学院就曾招收过美国国家航空航天局（NASA）的火箭科学家。


    第三类是“提供多样性”的人，占招生总数的25%左右。所谓“多样性”就是来自不同的国家、不同民族、有不同宗教信仰的人。不管你是来自新兴经济体，还是来自老少边穷地区，还是信仰一个非常奇特的宗教，你都能提供多样性。


    这些人存在的目的之一，是让斯坦福的学生学会和不同背景的人打交道。把一批想法一致的聪明人聚在一起，是非常糟糕的情况——你会以为世界上所有人都跟你一样，根本不知道真实世界是怎么回事！有了多样性，你才能学会从不同的立场上考虑问题。


    最后一类被称之为“秘密调料”。这部分人的数目不多，但都有极不寻常的人生经历。


    可能这个人在阿富汗和伊拉克执行过特殊任务。可能这个人是一位单亲妈妈，一边抚养孩子一边完成了一项难度非常高的工作。可能这个人来自一个非常冷门的行业——比如说钢钱厂——而不像其他同学那样都来自投行和咨询公司。这些人，提供的是特别的视角。


    对后面这三类人，并非没有学历和考试成绩要求。他们必须也有很好的成绩——否则怎么证明你的学习能力足以完成研究生的课程呢——只不过不必要像“优等生”那么突出。你的GMAT成绩没必要比99%的人强，但也得过硬。


    所以我们可以想想，一个在阿富汗打过仗，回来还在GMAT考试中取得了不错成绩的人，这都是什么人。


    # 把这些人聚在一起，就非常有意思了。


    书中举了个例子。比如课堂上讨论一宗收购案。如果学生都是来自华尔街，他们看问题的角度就都是站在大公司的立场上，去研究怎么和小公司谈条件。但如果学生中有些来自边远地区或者冷门行业的同学，他们就可以提出小公司是怎么想的！他们能给其他同学一个提醒，用不同的视角看问题，他们经常能说出一些连教授都不知道的观点。'
