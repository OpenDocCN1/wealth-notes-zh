  md: '制度一直有问题，但是没有人敢提出异议，因为你说了学校也不会轻易做出改变，不痛不痒的也经营了几十年。所以一届又一届的学生就在这种制度化成熟的大学毕业。这种活在平庸化大学的学生大部分都是高不成低不就，其他一小部分学生因为自我成长突破了环境的平庸化变得更加优秀。自身处在平庸之中应该有清醒的认知，不要被平庸化。但是自己还是会个疑问，用何种方式可以最有效的抵抗平庸化，而不让自己变得愚蠢呢？


    # 万维钢


    首先郑重声明：我们写这篇文章绝非是为了教人厚黑学，事实上，就连李宗吾写《厚黑学》的目的也不是教人厚黑学。这篇文章的意义仅仅是说明一个现象。


    平庸有平庸的合理性，你不能要求所有机构、所有人都野心勃勃，每天曝个大新闻。


    对牛人来说，平庸的、不折腾的机构其实也有好处——比较适合隐居。


    张益唐，本是北大数学系毕业的高材生，天赋极高，然而人生中种种偶然际遇，才华不被承认，在美国辗转漂泊干过很多杂活，甚至还在连锁店里当过会计。后来在新罕布什尔大学获得一个讲师职位，给本科生讲讲微积分，教学任务不重，有大量自由时间可以用来私下研究数学。


    他当会计的时候并没有研究怎么让店里的销售额翻上一番。他当讲师的时候也没有给系主任上书，“关于提高教学质量，把新罕布什尔大学建成美国一流名校的N点建议”。他凭借自己的才能，轻轻松松就能把分内的工作做好，也许比别人还稍好一点——但是仅此而已。


    他隐居在这些机构里，真正干的是更大的事，比如说证明孪生素数猜想！


    当然，如果一个人一生都在这种机构里混，而且没有取得什么成就，那么作为外人，我们就没有办法判断：他到底是隐居，还是寄居。


    # 来自日课：极端式成功者


    凯凯刘：我最近一直在思考怎样让自己效率最大化，尤其在有了小孩之后，明显感觉时间不够用，自己想做的事和家庭之间怎么平衡？还请老师帮我解惑。


    # 万维钢


    我自己也不知道怎么平衡，实在无法解惑。但我可以给你一个安慰！小孩长得非常快，用不了几年他就能自己玩自己吃饭自己写作业，不用占用你太多时间了。没准那时候你觉得一两岁的小孩更好玩决定再生一个。


    我有一个感想是抚养孩子就好像在大学里上课一样——很多时候你并没有完全搞明白，这门课也考及格了，自动就过去了。比如你要问我“一岁以内的孩子应该如何照顾？”我们好像全忘了，当时肯定也没表现出什么高水平，但是我家两个孩子现在都长得挺好。


    新父母往往有过分重视孩子的倾向。以前陪老婆去做产前培训，护士给我们讲了个笑话。说你的第一个孩子如果吞了个硬币，你会万分紧张，把他领到医院要求做X光检查。第二个孩子吞了硬币，你就不会那么紧张了，密切观察他把硬币拉出来也就算了。


    第三个孩子吞了硬币，你直接从他的零用钱里扣除。


