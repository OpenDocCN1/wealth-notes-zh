  md: '# 日课083 | 《成功与运气》解读2：胜者通吃


    日课083 | 《成功与运气…


    今天我们继续说罗伯特·弗兰克的 Success and Luck: Good Fortune and the Myth of Meritocracy（成功与运气：好运和精英社会的神话）这本书。


    前面我们提过一个问题：如果有A和B两个人，水平一样，但A的运气比B好5%，那么一段TE间过去后，A的收入能比B高出多少？我估计答案的数量级是500%。现在我们把问题换一下——如果有A和B两种同一类型的产品，A的性能、价格综合起来比B高5%，那么请问A的销售额会比B产品高出多少？


    答案不是5%，也不是500%。而是A将占有全部市场，B将出局。


    因为今天的市场是一个胜者通吃的市场。


    # 1.胜者通吃的市场


    早在19世纪就有人明白这个道理：交通越发达，好产品的优势就越大。


    比如说钢琴。最初，每个地方都有一家钢琴厂，有的做的好，有的做的不够。做的不好的也能生存下去，因为外地厂商做得再好也卖不到这里，运费太贵了。


    可是等到交通越来越发达、运费降下来以后，好钢琴就会占据越来越大的市场，乃至占据整个市场。这个局面，就是胜者通吃。


    弗兰克早在1995年就曾经和菲利普·库克（Philip J.Cook）合作过一本书，叫做《胜者通吃的社会》（The Winner-Take-All Society）。那本书的核心思想就是技术进步能加速好产品的扩散，导致市场被少数几个大公司垄断，本地的小工厂出局。他们考察了很多领域，从轮胎到演艺明星，都是这个局面。


    运费下降只是一方面。更关键的是，现在很多产品里最有价值的部分，并不是重量，而是它承载的想法！一张唱片本身能有多少大价值？真正的价值是它的内容，而把内容多复制一份的边际成本，基本上是0。


    运费越来越低，而且要运的东西还越来越轻，甚至可从网上即刻下载，结果就是把好东西传播出去越来越容易。


    这还只是单方面的传播。如果再考虑到消费者给的反馈，局面就出现戏剧性了。


    # 2.正反馈效应


    弗兰克管这个效应叫做“网络效应”，我认为叫“正反馈”更简单明了。


    举个例子，Windows 对 Mac。历史上曾经有过一段时期，微软的Windows操作系统和苹果的Mac操作系统势均力敌。Windows的兼容性好，可是Mac的用户体验好，谁想吃掉谁，似乎都不是太容易。


    ……但是从“吃”到“通吃”，却是非常容易的。


    +   1. 可能是微软押对了战略，也可能纯粹是由于什么偶然的原因，从某一时刻开始，Windows的用户数稍微超过了Mac一点；

    2. 因为这一点，软件公司开发新软件就会优先考虑Windows；

    3. 这么一来，Windows下的用户能使用的软件就更多；

    4. 于是就有更多的用户选择Windows……


    这就是正反馈——因为你的用户多，所以你的用户就会更多。因为你厉害，所以你就会更厉害。这个效应一旦启动，就是雪崩式的过程，市场在非常短的时间内就几乎全部落到微软手里。


    类似的例子是当初录像带格式的Betamax和VHS之争。索尼的Betamax清晰度更好，特别适合家庭录像，但是录制时间只有60分钟；VHS清晰度差，但是用来录电视节目很合适，一盘带能录一整部电影。你说哪个好呢？真实情况是一旦有更多用户选择VHS，录像带租店就必须倾向于VHS，这导致买VHS录像机的人更多……正反馈之后，Betamax迅速出局。


    后来的蓝光DVD对HD-DVD，历史重演……只不过这一次是索尼笑到了最后。


    正反馈，是一个最可怕的力量，但也是一个非常不可靠的力量。


    想要通吃，你只需要积累一点点优势，可是这一点点优势背后有太多的偶然因素。


    比如说，怎么出一本畅销书？弗兰克说，最好这本书的作者之前就出过畅销书，读者跟作者之间已经有正反馈。如果作者名气不大，那就得指望媒体宣传，比如让《纽约时报》给个好的书评。但风险在于，书评人的口味不一，好书未必一下子就能获得好评。你说找人帮着炒作，可是别的书难道就不会炒作吗？


    所以正反馈这把火，并不是那么容易点起来的。那些已经占领了优势的人，难道不应该感到侥幸吗？


    # 3.收入差距


    好在人不是产品，不能随便于复制，否则绝大多数人都没工作了。即便如此，人和人之间的收入差距还是越来越大。


    弗兰克说，在胜者通吃的市场中，个人的收入有兩個特点。


    第一，你的绝对实力并不重要，重要的是你的相对于对手的相对实力。


    比如老球迷都知道，90年代有个女网球明星叫做施特菲·格拉芙。格拉芙在整个90年代的水平一直稳定在世界顶尖高手的级别，但她的收入真正达到最高是在1993年4月份以后的12个月。水平还是这个水平，收入突然猛增。这是什么道理呢？那只不过因为当时世界排名第一的莫妮卡·塞莱斯，因为被粉丝刺伤，被迫休假了12个月。整个舞台都让给了格拉芙。'
