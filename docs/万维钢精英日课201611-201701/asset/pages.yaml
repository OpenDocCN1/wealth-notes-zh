    人工智能在向人类学习，但我们人类可不能向人工智能学习——你没有办法用六周的时间看5000个小时的电视节目！人得发挥人类所长，还不如向婴儿学习。


    在实践中学习新技能，数据有限先上手再说，“在战争中学习战争”，这个做法比较适合人类。


