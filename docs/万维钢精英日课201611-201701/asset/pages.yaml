    # 日课056｜大目标，和任务勾选框


    ![](img/9befb2e4b5878711040fbe72f1245d32_4_1.png)


    日课056｜大目标和任务勾…


    今天说昨天提到的一本书：


    Smarter Faster Better: The Secrets of Being Productive in Life and Business（更聪明更快更好：在商业和生活中获得高生产率的秘密），今年三月份出版，作者是纽约时报记者
    Charles Duhigg。


    ![](img/9befb2e4b5878711040fbe72f1245d32_4_2.png)


    看标题我们就能猜出来，这是一本“科学的励志”类的书。作者经过充分的调研和采访，把“个人和公司怎么做事”，这个领域的一些新的英雄事迹和研究结果综合在一起，介绍给读者。这种类型的书现在在中美两国都是特别流行，其中写得好的都略微带有一点学术味道，而不是像以前那样搞煽情和鸡汤。


    我注意到，这些书的内容，其中强调的理念，一直在不断演化，而且速度还挺快。几年前流行的概念，过 了几年就会被修正，甚至可能还会被否定，你就感觉美国各大学商学院的这帮教授还真不是白给的，一直都有新思想。


    那么为什么，在一定时期之内，很多 人、很多企业中都行之有效的一个做事方法，过了一段时间就不灵了呢？读过这本书之后我自己有一点思考，今天重点想跟读者分享一下。


    我们先来说一个做事的办法：任务列表。


    几年前特别流行一个个人管理方法，叫 GTD（Getting Things Done），实际上就是任务列表法。它要求我们事无巨细，把所有想干的事情都作为一个个“项目”，每个项目又分为若干个“动作”，每个动作都有自己的规定完成时间、地点和预期难度。这样一来，当你做事的时候，你要处理的并不
    是项目，而是动作。


    你只要看看此时此刻需要做哪些动作，做就是了。这就把人的心思给解放了出来，遇事做事，活在当下，而不用整天惦记着还有什么该做的事没做。


    严格执行GTD不太容易，你需要搞好几个任务列表随身携带而且还要随时调整。通常人们都是用一些更简单的做法，比如说弄一个任务列表，每天列举当天要完成 的几件事，每件事的旁边都有个勾选框，做完一件就打个勾。


    ![](img/9befb2e4b5878711040fbe72f1245d32_4_3.png)


    这个做法带来了条理，它就带来了效率。养成用任务列表做事的习惯，就比那些稀里糊涂丢三落四的人高明太多了。


    我自己就经常使用这个办法，而且我发现，做完一件事在任务列表上打钩那一刻那种感觉，实在是太好了！首先你充满成就感，其次打了勾就等于你从此可以把这个任务置之脑后，它再也不会烦你了——就好像杀死一个敌人一样。所以Getting
    Things Done的关键词，就是这个“Done”！


    《更聪明更快更好》这本书里也提到一些理论，说这种特别讲究做事有条理，追求把一件事做完的倾向，叫做“cognitive closure”，也就是认知闭合。认知闭合高的人大约占人群中的20%，他们就好像侦探不喜欢没破的案件一样，不喜欢没做完的事儿和没整理好的东西。而且调查表明，这些人更有自控能力，做事效率高，常常被视为是领导者。


    但关键的问题来了：认知闭合太强，反而不 好。认知闭合强的人，做事爱快速决定，不愿意考虑不同的可能性，连思想都有点闭合。


    原来，常被人们作为个人事务管理的这个任务列表法，早在1940年代就已经被通用电气公司给大规模地用于企业管理了。而且在1980年代，通用电气把这个办法交给扬光大，变成了一套叫做“SMART”的目标系统。


    具体来说，每个季度开始的时候，公司每个人都必须给他的上级写一封信，告诉上级自己这个季度都有那些目标。这些目标必须符合以下特点，编写出来正好是SMART：


    +   - Specific：具体。你不能含糊地说我要加大力度研究新产品，得有具体的方案；

    - Measurable：可测。将来目标是否完成，结果得是可以测量的；

    - Achievable：可实现。你给自己规定的这些任务不能好高骛远，得是可以实现的；

    - Realistic：有现实意义。你的目标得跟公司其他目标是相关的；

    - Timeline：有明确期限。什么时候做到，你得给出话。


    这套系统的影响力实在巨大，至今全世界有好多企业还在使用。对个人来说，其中也很 有借鉴意义——你要做什么事情，制定计划，可不就是符合这些原则吗？如果政府官员能在工作报告里使用SMART原则，我们的各种会议会有效得多。


    所以你的工作方法就是这样的：先想想要达成什么目标，然后把这些目标根据SMART原则细分成任务列表，把这个任务列表跟上级讨论。如果上级批准了，你去做就是了，将来完成完不成，各有奖惩。'
