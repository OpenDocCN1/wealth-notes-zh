  md: '# 4. 引用


    引用一句别人的话，和引用一个具体的数字，都能起到提升演讲力量的作用。但是注意，第一，引用千万不要随意和泛滥；第二，最好搞得正式一点，甚至有点仪式感。


    作者的建议是把你要引用的这句话，或者这个数字，写在卡片上。把卡片放在口袋里，同时口袋里再放一副眼镜。讲话讲到这里的时候，从容不迫地拿出眼镜戴上，再拿出卡片来，直接照着念。


    让人觉得这里说的内容非常非常重要。这么引用，才有力量。


    # 5. 自然


    当领导要牢记一点：永远不要低着头说话。说话的时候眼睛一定要看着听众！那么如果得照着稿子念，怎么办呢？作者提出了一个办法，据说是丘吉尔、罗斯福和里根都用过的。这个办法的动作要领可以用三个S总结：See,
    Stop, Say。具体来说，


    see, 拿着演讲稿，不要一个字一个字的念，要先往下看两行，记住；

    stop, 抬头，看听众；

    say, 用正常对话的语气，把这两行的内容说出来。


    然后再看再说。有人可能会问，我这样讲话的中间会有停顿，听众会不会不喜欢？恰恰相反。真正的对话中本来就是有停顿的，你的停顿会让演讲更自然，而且可以吸引注意力。


    # 6. 大胆


    不要讲那些陈词滥调，不要按部就班，尽可能做到与众不同。丘吉尔说，如果在地上爬能让听众更好地接受他的看法，他就可以在地上爬！


    日课065 | 学点领导魅力


    什么样的人有领导魅力？《大西洋月刊》这篇文章介绍了几个研究结果，我们列举一下：


    +   · 身高很重要。人们天生更愿意追随长得高的人。

    · 精力要充沛。你要是没睡好，精神萎靡地往那儿一站，或者动不动就表现得很劳累，肯定没有领导魅力。

    · 反应得快。问你一个问题，你能快速回答，或者面临某种突发状况，你能马上想出应对措施，这种能力其实比智商和性格更管用。

    · 最好带有一点神秘感。比如何你带队取得了好成绩了，记者采访，说你是靠什么成功呢？你就让记者写这是因为自己有远见、对局面有深刻的理解——这些虚无缥缈的东西，你的领导魅力就会增加。如果我说是因为自己这段时间工作一直加班加点，你的领导魅力就会减分。


