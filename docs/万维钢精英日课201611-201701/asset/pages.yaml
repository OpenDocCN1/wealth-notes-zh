  md: '# 春节特刊｜那些天我们学过的套路（下）


    春节精选｜那些天我们学过...


    你好，这里是特别为你制作的春节精选特刊，今天是《那些天我们学过的套路》下集。上集我们说了，会交往，会聊天，会道歉，会批评，还不说谎，算是一个优秀的现代人必备技能，今天我们帮你回顾一下，如果要做一个更聪明、更不可替代、甚至是具备让人追随的领导魅力的人，又该学哪些套路呢？


    请看今天的精选套路升级版。


    人工智能越来越厉害，但是作为人类，每个人都不希望自己有一天会被人工智能取代。那该怎么做，才能不被机器替代呢？答案是，利用人一个偏见——人喜欢过高评价“面对面交往”这个行为，对抽象数据不买账。人本质上，是个社交动物——


    # 日课013｜有些事儿我们不想让机器干


    这个偏见，在人工智能时代给人类留下了一个工作机会。人工智能再怎么发达，我们还是要求：


    +   1. 最重要的决定是由人做出的。如果中国要对某国宣战，我们要求这个命令是人下达的，在这个问题上我们不可能听从人工智能的指挥，我们不可能把核按钮交给人工智能。人说了算，不能让机器说了算。\n2.
    我们喜欢什么想要什么，这个想法随时都在变，我们无法给人工智能一个清晰的目标，所以有些事儿还是让人自己解决比较好——因为我们有时候自己都不知道要“解决”的是什么。\n3.
    也是最重要的一点，我们更愿意跟人打交道。


    所以想让别人放着机器不用用你，最好的办法就是表现出“人味儿”。


    怎么才能让自己更“人性化”呢？


    +   跟客户建立个人关系，不要只谈利益\n衣着打扮、说话语言彰显个性\n一个团队要有私下的个人互动，要有“化学反应”\n作报告不要把数字直接摆在别人面前，得发挥想象力把这些数字形象化（参见本专栏前面的文章《要怎么说，别人才能听懂你的数字？》）\n逢年过节给群众送温暖\n关键时刻站出来调动周围人的情绪\n出了事主动承担责任\n表态支持你支持的人\n发现别人身上的亮点，互相吹捧\n面对敌人同仇敌忾\n……


    越是人工智能发达的时代，越要让自己更像个人，充分发挥人的自由意志，把控主场感。什么是“主场感”，怎么获得主场感？


    # 日课024｜主场有多重要


    有本书：Soccernomics《足球经济学》，作者是两个喜欢足球的经济学家。这本书介绍，有人对两万多场足球比赛进行了数据分析，得出以下结论：


    +   1. 主场优势相当于三分之二个进球。\n2. 如果你的球队的国际比赛经验比对手高一倍，你的优势相当于半个进球。\n3. 如果你们国家人口是对手的两倍，这个所谓“人口优势”只相当于十分之一个进球。\n4.
    两倍的GDP也只相当于十分之一个进球。


    所以人多和有钱对足球来说意义不大，国际比赛经验很重要，而最重要的，则是这个主场优势。


    心理学家认为，主场优势其实就是进化心理学上的领土意识！我先来了，这个地方就是我的了，不是你的，你来是对我的侵略。不但先到者理直气壮，后到者也天生气短。


    据此，这本书给了我们几个获得主场感的建议。


    比如你要跟老板谈个什么关键的事情，升职加薪之类，最好的办法是在你自己的办公室谈。当然有些老板什么事都把下属叫到他的办公室谈，也是老司机。


    参加任何活动都要尽量早到，早到可以获得主场感。


    如果两个团队在一个公共空间合作一项什么工作，你的团队一定要先到，而且最好还能准备一些咖啡啊面包圈啊之类的东西跟对方分享。对方吃人嘴软，就会给你们更大的主动权。


    越是人工智能发达的时代，越要让自己更像个人，研究人性的偏见和弱点，学点心理学套路，不仅不被替代，还能让别人听你的；不仅听你的，还能让他们上瘾。怎么做？'
