    # | 我的评论


    我们中国人从小在国内接受的教育都是强调实干，讲怎么完成任务，很少强调领导力。而对比之下，美国人从小培养孩子的领导力。不但如此，现在又开始研究领导魅力，甚至办班教人怎么假装自己有领导魅力！


