- pgno: 164
  md: '我们知道心理学实验都不太靠谱，在很多心理学家看来，r=0.3 就足以说明两个变量之间有相关性，甚至还可能暗示这两个变量之间有因果关系——智商和收入之间的相关系数是0.35？太好了！这足以说明挣钱多的人是因为聪明。但是在真正的统计学家看来，只有当
    r > 0.8，才能说这两个变量 “高度相关”；如果 r ≤ 0.4，你只能说这是 “弱相关”。


    “高度相关” 是个什么概念呢？举个例子，股票市场上有成千上万支股票，道琼斯指数只考察30支股票的综合表现，可是我们知道，道琼斯指数和其他股票指数之间的相关性达到了0.94以上！因为有这个强相关。你要想知道今天股市怎么样，看看道琼斯指数这一个数字就可以了。


    可是人的各项指标之间，却是弱相关的。身高和胸围，智商和品质，这些变量的相关系数大都在0.4以下。在这种情况下只用一个指标代表一个人，就非常不可靠了。


    人，本质上是不规则的。


    那么应该怎么选人呢？


    # 3.Google的新观念


    公司大也有大的好处。如果又大又有钱，你就可以拿自己公司员工做各种研究。最近Google公司做了一个内部研究，就想找出来，招聘员工的时候到底哪些指标是真正有效的？研究者考察了300项指标！然而结果却是其中没有一个是特别好用的。


    而且他们发现了以下几个事实，我看对一般公司也都有用：


    +   1. 一个人的SAT（相当于中国高考）成绩，和这个人的工作能力毫无关系；


    +   2. 毕业院校和工作能力也没关系；


    +   3. 是否曾经在编程比赛中获奖，和工作能力也没关系；


    +   4. 在大学的学习成绩，和工作表现有关系，但这一点只在毕业三年内有效——也就是说，如果一个人已经毕业超过三年了，再看他在大学里的学习成绩就没有意义了。


    当然我得说明一点，这些结论是针对已经在Google工作的人调查得出的统计结果。一个能进Google，他必然满足一个基本的学历和编程技能门槛——如果你考察加油站工作人员和程序员，你肯定会发现上面说的那些统统有关系。


    不论如何，这项研究说明在一定门槛之上，再看学业成绩就没什么意思了。所以现在Google已经决定放弃了用单一指标评价人的做法，转而采用一个非常复杂的招人策略，不同部门对人关注的重点都不是一样，具体问题具体分析。


    那就是雷达图的做法，球星的待遇。


    # 我的评论


    我们再回头看一眼梅西的雷达图。梅西虽然在绝大多数指标上都明显高于平均水平，但也有几项指标明显低于平均水平，比如拦截和铲断就不行，丢球的次数也很高。这是怎么呢？因为梅西是进攻球员！他的任务并不是拦截和铲断，而且一旦他拿球，对方的球员就会不断地拦截和抢断他，他在危险地区拿球多当然也会丢球多。


    球队需要的并不是全能型选手，而是：

    不规则的人才。你让不同类型的人才互相配合，才能打出精彩的比赛。


    # 由此得到


    用单一指标评价人才的时代即将过去，也许将来每个人都能像球星那样拥有一张自己的雷达图。这个趋势才刚刚开始，但是已经开始了。


    ![](img/9befb2e4b5878711040fbe72f1245d32_164_0.png)


    > “欢迎来到现实世界！这里糅透了……但你会喜欢的。” —Monica E. Geller'
