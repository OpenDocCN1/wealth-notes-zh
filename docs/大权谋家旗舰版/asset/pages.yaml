    # 新领导上任，为什么往往要推翻前任的路线，旧下属何去何从？


    我们看到职场上新领导上任后，往往就要推翻前任的既有决定或者路线，这背后是什么原理？


    新领导履新，绝不会萧规曹随，他一定会开动脑筋，弄出新名堂出来。为什么一定要搞出新名堂？答案很简单，如果前任领导怎么做，新领导就照着做，那新领导就算做的再好，功劳也要记在老领导的身上，这样何以体现新领导的创新精神？何以显示新任领导的突出政绩？没有创新精神，没有出色业绩，对继续高升乃至于未来的前途，显然非常不利。


    所以，新领导一上任，思路是新的，措施是新的，一切都要推到重来，打破条条框框，开创新局面。


    那新官上任的三把火一般具体是怎么烧呢？


    # 一、打击既得利益者'
