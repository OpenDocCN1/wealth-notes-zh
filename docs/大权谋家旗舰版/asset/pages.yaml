- pgno: 259
  md: '肯定，实际上他是说，当下你还不行，所以你听到领导这样评价你的话，这其实是一句暗含批评的话。所以你一定要注意收敛，看看自己还有在什么方面可以提高，尽量把事情做的比较完美一点。


    # 3、他们说你怎么怎么样


    领导在批评下属的时候，往往会说，有人说你咋样，当然这些都是负面评价，而实际上这些都是他的看法，只是给大家留点回旋余地而故意这样说的，所以你千万不要再辩论，先应承下来，如果对方对你的看法是不对的，那就用行为来改变领导对你的看法即可，或者你收买领导身边人，让他们帮你说好话即可。


    领导说话，其实都是有艺术性的，很多不谙世事的下属就认为，你直接说就完了，为什么还要这样绕弯子呢？我们一直说，只有兜圈圈，绕弯弯，才是最短的路径，等你有机会坐到了领导的位置，你也一样会如此，揣摩领导的话中话，调整自己的思想和行为，无疑是最快升职加薪之路。


    # 当领导说“大家不要有顾忌，畅所欲言”的时候，你中招了吗？


    有学员问起来，领导在公开征求意见后，自己迫不及待觉得给领导提出了几个组织急需解决的问题，本来以为领导会召见自己，夸奖自己，哪知道居然把握调离了现在岗位，难道我按照领导的意思提建议错了吗？这位学员应该是刚入职场，不知道职场的奥秘。


    权力的本质是独占的，权威的，不容置喙的，而对于领导有的时候来公开征求意见的时候，做下属的一定要引起警觉。因为这时候说不定是引蛇出洞，然后一网打尽，当然也有可能是迫于压力，我们来看权力愿意广开言路的几种情'
