- pgno: 67
  md: '准备活动，尤其是人事方面的变动，总体是赵匡胤集团安插自己人的同时，排斥不是他这个圈子的高官或将领，在准备工作都做完之后，再寻找合适的机会一击即中。


    所以我们怎么看一件事情发生的背后的事实和真相，我们不要听别人怎么说，而是要先了解这之前到底发生了什么确实的事情。因为这个事情是没法遮掩的，然后我们再基于这些事实，做合理的推演，大概就能推算出背后的真相。


    不过在中国人的组织内，就算是你很厉害，能算出领导心中所想，也不能对外提起，“暗子吃饱饱，肚里有数”就可以了，不然就可能是杨修的下场！


    # 懂了这三个潜规则，轻松拥有职场好人缘


    在社会上，看到很多人的人缘不好，究其原因，除了自以为正确并一再坚持以外，不懂人际关系里面的潜规则也是重要原因。


    在社会上，有些规则是白纸黑字写在纸面上，需要我们去遵守。但是更多的规则，是隐藏在我们日常生活和工作的细枝末节之中，这就是人际关系之中的潜规则，这需要局中人很高的悟性。


    那到底这些好人缘的潜规则都有哪些呢？


    # 一、感情还是利益？


    在现实社会，人人都把自己的利益深深的隐藏起来，而嘴上不是说道德就是讲感情，而如果我们不懂人情世故，那以为这就是真相。其实他们往往用感情来掩盖利益，不过当感情和利益冲突的时候，他们会毫不犹豫选择利益，所以我们在和别人交往的时候，感情最多只是一个敲门砖，要考虑到对方的利益在'
  merge: -1
  img_proc: true
- pgno: 68
  md: '哪，和对方说清楚利害关系，那你做事就容易的多。


    # 二、背后不说坏话


    社会上很多人大嘴巴，对于让自己不爽的人和事，都毫不犹豫得到处宣传，然后被别有用心的人利用添油加醋后传播到对方的耳中，然后进入冤冤相报何时了的模式中。所以，就算对方对不起你，你要报复对方，也不能说。因为你一说，传到对方耳朵，那对方就引起警觉。如果你不说，反而还说对方好话，那对方就会放松警惕，如果你真要下手，那就是一击即中。


    # 三、保密的原则


    对于还在酝酿中的事情，很多人就开始大喇叭宣传了，殊不知有很多人，尤其是自己的身边人，是见不得他人好的。你有好事，如果做成了，对方就会很嫉妒，所以在你的道路上对方会想办法使绊子，不然你成功了，就显得他比较失败了。由此，我们对于还没做成，尤其是还在酝酿过程中的事情，必须守口如瓶，不然非常容易引起纠纷，流言四起，导致于自己的形象崩塌，所以偷偷的把自己变得优秀，不仅是做好事情的基础，更是保护自己的手段！


    作者曾经碰到过一个人，对方的每一句话，每一个动作都让你很舒服，当时就觉得此人非同寻常，深谐人情世故，对潜规则的理解段位很高，这也是我们讲的降维打击。说到降维打击，很多人都把这个词想象成斗争和打击，而实际上，悄悄地迎合你是更深层次的降维打击（兼容）！


    熟悉这三个原则，将会对你积累好人缘将起到至关重要的作用，人际关系本来就是一张网，纵横交错，在交往的过程中必须掌握好火候和尺度，否则一不小心就会被这张网所束缚得动弹不得。'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 现实中你不可不知的残忍真相！


    在现实中，只要仔细观察，就会发现绝大部分人都容易想当然，对一些观点深信不疑，然后坚持错误到底。我们通过本文来剖析一下经常碰到的容易让人难以相信的残忍真相。


    # 一、认同的人越多就越错


    一般人都会认为，对于大部分道理，认同的人越多就越有道理，而事实恰恰相反，认同的人越多，反而是越没有价值。因为大众的整体双商都比较低，只要简单，只要煽情，就能博得大众的认同，能不能执行，对自己利害关系的剖析，那就想不透了。


    # 二、越是底层越觉得自己正义


    身在底层，仿佛就有了天生的优越感，对于管到自己的人，一般都非常痛恨，因为觉得他们限制了自己的自由，进而衍生出仇官仇富的心态，加上社会新闻经常有爆出哪里有贪官，造成了社会不公平，底层就把自己的不幸遭遇都归结到社会的不公上面，进行自己就变成正确的代表。


    # 三、目标和行为正好恰恰相反


    很多人看起来目标都非常明确，但是在现实中做的事情却往往背道而驰。譬如一个学生，明明知道自己要考出好成绩，但往往控制不了对游戏的热爱，普通人都想着要加薪升职，却和领导或权力对着干，而且这样目标和行为的相悖，大部分人却不觉得有什么不妥，所以只能被封印在最底层。


    # 四、越是底层，越容易发怒


    普通人还有一个特点，就是比较情绪化，也就是喜怒形于色。而情绪化的最大的表现在于容易发怒，容易发怒就容易让别人摸透你的性格脾气嗜好等等，'
  merge: -1
  img_proc: true
- pgno: 70
  md: '这样别人就容易来操控你，最后变成权谋家的炮灰。其实发怒还代表自己无能，越容易发怒的，也就越没有出息，因为无力改变，只能靠发泄情绪维持内心的平衡。


    如果你要在中国社会有所作为，那必须改掉以上的各种毛病，加深对人性、社会 direttamente理解。只有这样，你才可能调动一切有利的资源来为自己服务，而不是被别人利用来做炮灰而不自知，朋友们抓紧努力吧！


    # 颠覆认知：勤劳到底能不能致富


    从小到大，我们都被灌输过一个观念，就是勤劳致富，而且我们也从来没有怀疑过这个观念的正确性。不过随着年岁增长和阅历的增加，如果你仔细思考的话，勤劳致富，这个观念很可能就会被重新审视。


    因为看社会上的成功人士，几乎没有依靠勤劳致富的。


    举个例子，从古代到现代的农民，几千年来一直在地里刨食。中国的农民一直很勤劳啊，不过这几千年来，生产效率提高了嗎？亩产提高了多少呢？非常有限，而到现代社会，才有人专门培育种子，采用机械化的耕作方式，提高粮食的生产效率和亩产量。


    我们继续看在工厂上班的员工，典型的以全球第一大代工厂富士康为例，他的员工几乎都非常勤劳，还要无休止的加班，甚至加班到精神崩溃、跳楼自杀。就是这样，他们能拿多少工资？


    所以，勤劳不能致富，勤劳只是低层次的重复而已！


    为什么会这样？因为绝大多数人所从事的事情，都是被权力老早定义了，你'
  merge: -1
  img_proc: true
- pgno: 71
  md: '只能干这样的活，最好像老黄牛一样一直干到死；所以他们用勤劳致富的这个观念来控制你，给你一个致富的希望，同时让你丧失反抗的可能，看到这里，你是不是感觉到非常阴冷？


    如果仔细研究社会上的成功者，他们都有一颗不安分的心，首先他们都有急切想要致富的念头，其次他们还善于借助其他的势力。“君子性非异也，善假于物也”，给我们的启发就是埋头苦干还要抬头看天。


    天是什么？中国是权本位的，权力代表了天，善于借助权力，为权力提供政绩，无疑是一个非常好的方法。但凡中国目前传统产业（包括一部分新兴产业）的巨富，几乎都有权力的影子。


    有人就要说巨富太远，如果你只是一个小职员，那就靠近权力象征，一般就是你的领导，借助他的力量你才可能达到你的目的。


    所以，从现在起，勤劳致富这个观念应该被抛弃了，在努力的同时，你必须善于借助外在的条件和力量，让他们为自己所用，不过这需要让自己先练就柔软的身段（很多人这一关就过不了）。记住，柔软不是目的，柔软只是一个工具！'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 权谋家操控他人的七个狠毒的手段'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 1、亲缘操控


    亲缘手段是七种武器中最厉害的武器，杀人不见血，制人于无形。相信熟悉老子道家柔性谋略的人对亲缘手段一定能理解得很透彻。历史表明，亲缘手段是最重要的操控手段。


    俗话说：“虎毒不食子”，这句话是指在生存斗争中动物的天性里存在着同类相依的本性。借用到社会竞争中，自然是指一家人比两家人可靠、自己人比局外人可靠。


    还有向老话叫：“打虎亲兄弟，上阵父子兵”，讲的就是斗争中要老少爷们一起上，团结起来一致对外。上面这些话都反映了一个道理：在社会斗争中，具有亲缘关系的种群能够更好地合作，更少地斗争。这就是说，历史上的你砍我利、血影翻飞，大多是发生在两不相属的人们中间的。即使有着兄弟反目、父子成仇的个案，也是少之又少。故此我们可以说，亲缘关系是一种相对稳定和牢固的关系，人们可以大胆依托亲缘关系进行搏杀。


    中国人素来讲亲缘，把亲缘特别是血缘之间的情分看得比什么都重。即使在生活节奏如此之快、迁徙移居如此之频的当今社会，“血浓于水”依然是中国人固守不移的传统理念。也正因为如此，才产生了人们以亲缘关系编织网络、依靠亲缘关系操控别人的现象。


    利用亲缘关系实施操控，是所有操控手段中最安全和最有效的手段。下面结合案例分析：《三国演义》中以亲缘手段控制别人的例子有很多人，其中“无谋何进作三公”的何进就是一例。话说汉灵帝嗝呼哀哉之后，太子辩枢前即位。太子之母何皇后屠户出身，儿子年幼，孤儿寡母奈何不了外面一帮如狼似虎的大臣，也治理不了天下汹汹的百姓。幸亏何太后（太子即位后升了一职）有个'
