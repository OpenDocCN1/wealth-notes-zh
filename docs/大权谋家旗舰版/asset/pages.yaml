  md: '压威慑的政治诡诈而消于无形。王琦不仅利用威慑手段成功操控了周王，使其乖乖献出护卫军，而且，又借着自己这场大功获得皇帝青睐，可以说这就是利用威慑手段操控别人的收获了。


    当实力弱小，或者实力虽然比较强大但无法有效构筑威慑态势之时，要想靠威慑制人，则需要借力，也就是我们常说的拉虎皮、扯大旗。借势示形有以下两种方法：一种方法是虚张声势。即通过巧妙运筹，把自身的实力进行放大，从而震慑敌人。这些例子有“空城计”、“增灶示强”等。在竞争中，可以通过夸大实力、大肆渲染自己的优势等方式对别人进行震慑。另一种方法是假借他势。这种方法不是放大自身的实力，而是借助他人的势力，以此来威慑对方。这样的方法主要有三种，其一乃借“人”之势。比如，《隆中对》中说道，曹操“挟天子以令诸侯，此诚不可与争锋”。“挟天子”的意思是，曹操打着天子的旗号，占据了政治优势，对一般的人形成了政治威慑；“令诸侯”意思指的就是对诸侯实施操控。曹操的“挟天子以令诸侯”的把戏一使出来，其优势地位便基本上可保无虞了。他的这一方略，盗版的是齐桓公与管仲的“尊王攘夷”之策；其实质乃是遵循了政治威慑的基本法则。其二是借“天”之势。秦朝末年陈胜吴广起义之时，为了裹挟诸戌卒起义，陈胜吴广假托鬼神名义，以此达到威慑戌卒的目的。历史记载，三人事先找来一块破布，写上“陈胜王”三字塞进鱼腹，等大家发现鱼腹中的字后均面面相觑，以为陈胜是受上天保佑的。接着，吴广在夜里假装狐狸叫，不停喊：“大楚兴，陈胜王；大楚兴，陈胜王。”士卒们听见，吓得浑身发抖都以为祸害来了。后来听明白了“陈胜王”三字，再加上开始鱼腹藏书那个镜头，于是，士卒们对陈胜产生极度的畏服感，都相信陈胜是上天授意的
    utility，天子，并坚定了跟从陈胜的决心。陈胜的这一招在“三'
