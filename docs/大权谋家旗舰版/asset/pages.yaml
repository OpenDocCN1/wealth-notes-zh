- pgno: 322
  md: '太后垂帘听政。而当时大太监雷允恭很得刘太后的宠爱，而他利用这个宠爱，和首席宰相丁谓勾结，当时雷允恭是唯一一个能联系太后、仁宗和朝臣的，这样无形中他的权力就达到了最大，因为他可以选择的让人听某些事情，信息的剪辑对左右领导决定利益的导向非常有用。


    不过这时候雷允恭和丁谓结交，如果当时一把手有权力敏感的话，那就会非常在意这件事，内外朝结交历来可能对皇权不利，所以慢慢的刘太后就觉得雷允恭就不听话了，这次雷允恭自己撞枪口上了。


    雷允恭他索要山陵都监的这个位置，表面上是为说自己尽兴侍奉先帝宋真宗，而实际上是贪图这里面的很多的油水，因为往往这种建设工程，背后的油水都很多，从红楼梦里面看起来，一般建设成本都只是预算的三分之一，三分之二变成了油水了。嘴上都是主义，心里全是生意，在古代其实就是如此。


    雷允恭要拿到山陵都监的职位一定要通过刘太后点头的，而刘太后对雷允恭也非常了解，所以他找准时机，趁着宫中没有其他人的时候哀求刘太后让他来负责先帝的陵墓工程，因为哀求的场面如果有人在场的话，真的被刘太后拒绝的话，那就丢脸了。


    这里有必要说一下刘太后，说是太后，其实那时候估计也就30多岁，她能从一个蜀中的普通女子一跃成为帝国皇太后，那其中所使用的权谋手段肯定少不了，所以她对人心会了解得比较透。


    我们要揣摩一下刘太后的心情，也就是一般领导对于下属求项目的时候的心情，其实给谁都是做，如果你听话，给你也没有问题，而这里刘太后是知道雷允恭的小算盘的，所以她就说开了，如果把这个位置给你，怕你乱来。这里刘太后这么说，她可能有两个用意：'
