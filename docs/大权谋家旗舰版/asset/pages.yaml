    所以，各个权力派别为了实现自己的利益，往往要把水搞混，让你摸不到头脑，外人还没有摸到门道的时候，他们已经把关键的东西都定好了。所以，你就会认为社会很复杂，而且，利益越多的地方越复杂。因为水混了，那就方便浑水摸鱼了，而如果你看不清，还是远离这样的浑水和复杂的社会，当然，我们主张的还是要积极入世，从自己周围的资源着手，看破真相，找到脉络，勾兑利益，这样你才能入门。


