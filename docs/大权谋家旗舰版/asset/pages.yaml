- pgno: 12
  md: '自己还很得意！


    # ## 二、口号性麻醉


    穷人就意味着社会失意，而如果一直失意，就容易造成社会不稳定。有鉴于此，历史和统治者给予了很多心理上的安慰，譬如：自由、平等、民主等等，历史流传下来各种宗教，也是用来麻痹穷人的最好方法，让他们被收割也忘记了反抗。


    # ## 三、自卑性自大


    因为穷人们被麻醉性的口号所迷惑，以为口号就是真相，然后对着掌握自己生杀予夺的权力、领导没大没小，还因为怕被别人看不起，还容易自大，用以掩盖内心的自卑，殊不知正好和职场与商场上的权力潜规则冲突，别人给你穿小鞋你还不知道具体原因。


    这样不经意间得罪权力，被权力处罚，这样多次以后，自己也丧失了进取的动力，也懒得再找前进的方法了。所谓哀莫大于心死，如同行尸走肉一样。


    其实，穷不仅仅是兜里的钱，而是心态上的放弃和麻木，让人没有动力，没有念想，也都没有了未来。


    只有敢于直面自己的社会地位，调整自己的努力方向，用以前人人喊打的儒家伦理规则来充实自己的头脑，从内心开始敬重权威，承认社会的不公平，立足自身现有条件，努力向资源和权力靠拢，这样才有可能分得一杯羹，不然就算你很勤奋，也只是在生命的最低层次上做简单的重复，对自己自欺欺人，用战术的勤奋掩盖战略的懒惰，这样的人是不可能改变命运的。


