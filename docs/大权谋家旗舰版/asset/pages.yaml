- pgno: 289
  md: '对你的位置虎视眈眈、暗流涌动、等待机会一击必杀，自己才能取而代之，你一不留神可能就会身败名裂。所以权力学宝典《韩非子》主张，任何对权力的潜在挑战都要被消灭在萌芽状态，也就是先下手为强。


    中国历史是一部相砍史，内部为争夺权力、巩固权力、行使权力、衍生权力动辄刀斧相向，砍下的那么多人头，没有对不对的，只有该不该的。该砍就砍，乐此不疲，充分体现了“与人斗，其乐无穷”的最高境界。所以“伴君如伴虎”，所以“君视臣如草芥，臣视君如寇仇”，更要命的是，权力斗争这部绞肉机一旦启动，喝不够血不会停下。


    虽说权力可以放下，譬如汉朝的张良、春秋的范蠡，富甲天下且抱得美人归（张良封万户侯隐退，范蠡得西施后泛舟），这也可以是做官的理想。榜样在，但难学，因为权力这种东西，比美色更易诱人，比毒品更易成瘾。食欲、性欲，人之大欲也，但人老了，美食美女都难以消受了，只有权欲是超越食性的东西，恋袂不舍，到死都不会放手。所以，终身制，才是符合人性的，所谓看得开、放得下、舍得了，一般都是扯淡，或者说是没办法，形势所迫，不得不放下，纵观历史，放弃最高权力，还意味着放弃了自己的生命。


    张良和范蠡其实没有拿到集团组织内的最高权力，所以他们能退，只要最高领导保证他们的安全即可。但是对于最高权力而言，他在谋权、固权、行权、展权的时候，无疑会触动到很多人的利益，所以他的敌人也会非常多，如果他没有安排好自己的班底接好班得话，日后被反攻倒算是大概率的，当然自己的班底不如自己亲自掌权，所以从另外一个角度说明权力终身制的重要，不然权力的背后就是万丈深渊，粉身碎骨！


    所以在这样的环境下，高位的权力拥有者都会被权力养成一种人格，我们叫'
  merge: -1
