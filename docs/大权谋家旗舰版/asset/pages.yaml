- pgno: 35
  md: '综合来看，佛法和权谋其实是一体两面，互为表里，金刚经说“心无所住”，而权谋讲究聚焦，也就是心有所住，一击必中！佛经上也说“众生平等”，而从入世来看，处处充满等级和不平等，而就是佛家自己的寺庙，也是按照香客的社会地位、财富来做区分，寺庙实际上只服务于高端人群，菩萨和佛也是看香火钱的面子！


    # 为什么专业性人才很难走上领导岗位？


    职场上有一类这样的人，他们专业知识和专业技能很扎实、工作经验也比较丰富，但是领导就是不来提拔这样的人做中层，更没有机会走上领导岗位。这样的情况下，有些专业性人才就会心理不平衡，走上逆反体制的道路。


    专业性人才得不到提拔往往有如下几个原因：


    # 一、孤立


    专业人才往往信奉“有理走遍天下”，不太注意沟通方式和技巧。自认为有过硬的专业知识和技能，在与其他人的沟通中，只要别人的看法观点与他们不一致时，他们就可能当众挖苦、贬低别人，搞得别人一点面子都没有。


    本来领导对他们是寄予厚望的，领导有意将一些重要的工作安排给他们去做，一是对他们专业能力的认可，二是为了锻炼他们，三是为了让他们出成绩。


    但这些员工，领导安排他们做点事，他们总会搞得鸡犬不宁。首先容易畏惧困难，拈轻怕重、有时候还会斤斤计较，事情都还没有去做，就向领导摆困难、提要求，经常把领导气得火冒三丈。他们这样一次次得让领导失望，领导哪还敢对他们委以重任？'
  merge: -1
  img_proc: true
- pgno: 36
  md: '因为没有人愿意和这种人打交道，所以他们会越来越孤立，领导也不敢再派他们去做需要沟通协调的重要工作，他们的价值也就很难表现出来。


    # 二、视野


    专业人才的视野往往局限在自己的领域内，对自己和周围的利益非常关注，所以必然会缺乏整体意识，而做领导就是要丢掉自己的专业，西方说的总经理就是“General
    Manager”，也就是一般般的管理者，也就是你不能再有专业了，而是什么都要懂点，这样才能站在更高的位置俯视员工，关注组织的整体和长远利益。


    而专业性人才因为自我经历的限制，在视野上必然没有专业搞管理的全面，所以在上级提拔的时候会比较吃亏。而且如果专业人才被提拔了，具体的活谁干？


    # 三、协调


    做领导最多的事情就是需要协调个方面的关系，而协调就需要高情商，情商高的人，善揣摩，会说话、能办事，采用别人更容易接受的方式来达到自己的目的。也就是说：情商高的人在办事的过程中，说话和对待别人的态度，让别人感到非常舒服愉悦，别人愿意与他们打交道并乐于为之效劳。


    而技术出身的人才，思维往往是单向的，是非黑即白的，是以我为主的，这样就不会了解别人的内心，更不会贴着对方的心理去说话，那对方肯定也不会买你的面子，这样做事就非常艰难。


    不能能力强的员工就适合提拔为管理者的，如果不具备管理特质的人提拔到管理岗位的话，那他就很难让各方面信服，反而容易拖累组织。当然如果你以前是专业人才，有意向管理岗位转型，那以上提到的三点，你可以自己做主动


    ![](img/3d06f2ed5c6b0c2ef1e480981dc50168_36_0.png)'
