    # 曾经针锋相对的竞争者，成为了自己的上司，怎么办？（一）


    《岁月》是《沧浪之水》小说的电视剧版本，《岁月》是深刻揭露现代官场的现实主义题材电视剧。如果仔细看，你就会发现他就发生在我们周围。前面也写过这部电视剧的评价文章，今天我们从另外一个角度来研究一下配角吴过的职场智慧。


    在本电视剧的后期，主角梁志远从一个愣头青的小伙，经过蜕变，先通过私人事情靠近现任领导，通过告密获得领导的信任，最后被领导培养成接班人如愿接班卫生局局长。在接任局长的位置之前，局长位置的另外一个有力竞争者局长助理吴过使尽浑身解数，明争暗斗、针锋相对想切断梁志远的晋级之路。虽然两人都是现任闻局长的
    disguised text 心腹，但是闻局长还是力挺梁志远成为新任局长，梁志远新官上任，吴过就非常尴尬。这时候，吴过就要再次使出浑身解数来保住自己的位置了。


    一般人在吴过的位置，肯定是怨恨，愤怒，然后被新任领导穿小鞋，被边缘化，淡出了权力中心。如果这样，你在这个单位十几年乃至几十年的积累就化'
