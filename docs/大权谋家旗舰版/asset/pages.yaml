  md: '充满了扫除一切害人虫的道德勇气，以我划界，刚开始，反对我的就是妖魔，发展到后来，我看着不顺眼的都是妖魔。这样的人，最容易参与到狭隘的政治迫害中去，对迫害他人充满了乐趣和满足。


    在网上经常能看到一些帖子，因为贫困或者弱势(难辨真假)，所以正确，骂有权 的，骂有钱的，骂不顺眼的，这也是一种戾气。年轻人在一个阶段有些戾气是正常的，如果不能化解，就可能变成一个只会骂骂咧咧的废人。如果有合适的政治气候，也会成长为迫害狂。


    到底是什么原因把他们打造成这样的行为模式呢？


    # 一、思维差距


    我们以前就强调，被管理者思维和管理者的思维具有天然的鸿沟，被管理者往往认为自己是被针对的，敏感、自卑、玻璃心是他们的特点，而管理者要求就算做不到高瞻远瞩，那至少也要从宏观和整体角度来看问题，所以这个差距看起来不是很大，实践中能跨越的人少之又少。


    # 二、权力规则


    因为底层小人物平时大多数情况下是被权力所管束，对权力本身就非常反感，更不会去研究权力运行规则，所以一旦自己掌握权力后，就失去了章法，乱来一气，很容易被认为“上不了台盘”，就算拿到权力，也很容易因为表现失准而被撵下台。


    # 三、即时满足


    底层小人物还有一个重要特点就是做不到延迟满足，他们所需要的是即时满足，体现在掌握权力后的打击报复，他们掌权后的第一件事情并不是为组织、为领导服务，而是研究怎么运用权力来打击以前自认为得罪过自己的人，“一'
