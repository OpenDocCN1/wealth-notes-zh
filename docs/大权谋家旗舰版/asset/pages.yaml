  md: '当过几天晋武帝询问吾彦的时候，吾彦的回答聪明很多了。吾彦为什么回答这么好，很可能是他吸取了薛荔的教训，我们要记得当一个领导一再问不同的人同一个问题的时候，他往往是因为没有得到自己想要的答案。所以后面被询问的人要非常注意这样的情况。


    我们来研究吾彦的回答：“孙皓英俊，宰相贤明。吴国被灭是因为天意，天意归晋。”他这样回答，有以下好处：


    # 一、对故主忠心、对同事友好


    对老领导和老同事没有恶言，更没有在背后说坏话，不像薛荔一样有卖主求荣的嫌疑。新老板听到这个，觉得你忠心耿耿，对老领导忠心，对我这个新老板肯定也忠心，如前面所说，这时候天下初定，忠心最为重要，这样说老领导、老同事、新老板都很开心。


