- pgno: 137
  md: '但是，我们不是历史机械论者。近来研究历史，“历史机械论”这一派论调甚嚣尘上，一时间几乎压倒子一切其他声音。比如，当人们谈到苏联崩溃的时候，最初还是从技术层面上找原因，以我到可资我们借鉴的教训，本意是好的；但是，到丁后来，竟然说“苏联从一开始，就已经注定了要解体”、“苏联解体是不可避免的结局”。关于这一点，就大没其然丁。在这个世界上，没有什么是怎么定好了的，任何手物的发展都要要到外在变化着的条件的影响-固然，内因起到了决定作用，而外在条件，则或生或少成深或浅政交者車物的进程。如果苏联不是在美国的围追堵截之下苦苦挣扎，也未必最后会落得如此结局。所以，历史的机械论是要不得的。


    同样，我们研究李斯的结局，一样也不能走上机械论的道路。换句话说，李斯从政前的经历，为其从政之后的作为莫定了行为个性基础，这是很显然的。然而，也并不能说，李斯人性深处的弱点，就必然决定了他的失败。我们不能站在数千年前来贬低李斯在观察则鼠仓鼠时流露出对功名富贵的追求-其实也正是这种渴望和追求，驱使他走出楚国，走上中国的政治舞合，并改变了中国政治发展的轨迹。李斯的可悲结局，虽然是由于其追逐权势的弱点造成的，但另一方面，毕竟也是受到了环境的影响，尤其是碰到了赵高这样的阴谋高手。李斯的失败，是在内外双重因素的诱发下才最终定局的。


    笔者说这段话的目的，为的就是从李斯这样的绝顶高手中，追寻那个他都不曾发觉的道理，从而使我们签往知来，以史为镜。下面，我们分析一下：


    在李斯和赵高的第一次 PK 中，李斯由于人性深处的弱点败给予赵高。赵高采用的方法，本质上是“威懐”操控。李斯的失败，是缘于他贪生恶死的性格，这我们也分析了。李斯第一次的失败，是他性格的使然，这就是他的“局”。'
  merge: -1
  img_proc: true
- pgno: 138
  md: '但是，我们否定历史机械论的原因，是因为，在历史上，任何事物的发展，都是主观原因与客观条件互动的结果。像李斯如此之高的人，理应在第一次 PK 失败之后，及时总结经验，把自己自身固有的毛病和弱点找到并弥补，实现主观与客观的良性互动如果这样做了，从理论上讲是能够避免最后可悲
    下场的，即使不能，起码让赵高的 “威慑” 操控彻底破产，这是应该做到的。然而没有。李斯并没有将主观与客观有机地结合起来，而是一再倒在了自己的弱点上，这样，才最终导致了第二次
    PK 的失败。我们在惋惜李斯命运的同时，应该认清历史机械论的谬误之处，同时，应该对如何在政治斗争中总结成功经验汲取失败教训有更深刻更清醒的认识。


    但是，这仍只是一个浅层面的东西，还有更深层次的东西需要我们去挖掘。


    我们说，在这个世界上，存在着区别于普通百姓的精英。由于职业的不同，西方把这些精英称为 “经济人”、“文化人” 和 “政治人”。李斯和赵高都是在政治中讨生活的职业政客，所以我们可以说他们是
    “政治人”。既然从事政治，就应该按照 “政治人” 的身份来要求自己，要按照游戏规则进行游戏。违背了规则，就注定要被淘汰。


    李斯是个政治人，他年纪轻轻背井离乡，抛妻弃子，从本质上说，这是为了达成目的而勇于钢牲亲情和爱情的做法（类似吴起杀妻）。另外，他为了巩固自己的权势，阴谋杀害了同门师弟自己的好友韩非，这在本质上是超脱友情的行为。我们研究发现，人类本能深处，存在着亲情、爱情、友情这些美好的情感。正是这些情感，谱写了人性的和潜音符：正是因为人们的相亲相爱，才使得人们团结起来，战胜自然灾难和社会少难，推动着人类文明和历史的进步。然而，在人性与权欲交锋的居空场上，人类美好的感惜，却往往会演变成率割'
