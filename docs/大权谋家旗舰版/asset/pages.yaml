- pgno: 142
  md: '宝座给毁了。秦始皇则把自己的江山当赌注，甘冒如此大之危险，他又岂能是斤斤计较于权力的人？对于《英雄》中讲的秦始皇爱惜天下百姓不惜牺牲自己的观点，笔者不敢轻易苟同；但是，至少秦始皇能够超脱权势，没有把自己的所得看得多么重要，笔者则认为是情理之中的。舍得舍得，有舍才有得。所谓的大胸襟大包负大胸怀，皆来自于此。越是超脱权力，才越能得到更大的权力；越是计较于权力的得失，才越会失去更快。


    秦始皇的境界之所以比赵高和李斯高，是因为他站的角度高。如果单凭个人的素质，那么赵高和李斯坐到了秦始皇的位置上，未必不能当好一个秦王，但却未必能统一天下。其原因，在于二人都
    niv具备为了z一种政治理念自我死灭的勇气，也不具备“不是你死就是我死”这样一种在政治斗争中最需要的霸气。当然，这样的霸气应该人骨人髓地附着在精神的最深处，却一定要被外表的笨拙与痴傻包裹住，不然，往往是霸气露得越快，死得也越快。


    李斯超脱不了权力的得失，更超脱不了生死。因此，就形成了李斯被操控的可能性空间。赵高一旦拿着“失去权势”和“失去生命”来威胁李斯，李斯立刻被赵高所言而震憾，并开始按照赵高的思路去行动了。


    我们说李斯和赵高都是绝顶高手，无非是要告诉大家李斯并不是那么容易被操控的；鉴于李斯的斗争手段也是非常残酷的（比如害死韩非），赵高弄权不成，也很可能被李斯反手一剑削掉脑袋。所以，威慑与反威慑，是一胎双生的同胞。在这场斗争中，赵高更狠一点，他抓住了李斯的致命弱点，以威慑手段来敲打和震慑李斯。而李斯终没有突破对权力得失的计较，没有跨过生死门槛的玄关，因此，他的权力失得更快，他死得更惨。'
