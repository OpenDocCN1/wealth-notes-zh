- pgno: 253
  md: '从这个穿珠子人的角度看，他看起来是训练有素的，不然他说出来的话，不会如此妥帖。因为古代，知道领导的秘密不一定是好事情，明朝朱元璋刚坐上皇位时候一时失态被身边人看到，朱元璋本来准备杀人灭口，被马皇后教他们装聋和做哑才躲过一劫，不要说现在这个关系到齐襄王生死存亡的关键秘密。


    所以，这时候，装聋作哑其实很难过关，因为齐襄王只要打听一下，就知道真相，所以从这个穿珠子的人的角度看，是避无可避了，这才是最考验他的。如果说错，立即被处死。不过这次他说对了，他说，让齐王奖励田单，把田单收买人心的办法变成是齐王的授权，这样就把老百姓的威望集中到齐王身上，无形中就化解了田单在老百姓心目中的威望。


    之后还要把这个做法推向极致，在隆重奖励田单的时候，还要发布公告，战争灾难之后抚恤孤寡，这样就彻底消除了田单在老百姓和官员心目中已经形成的高大形象。因为齐王通过这一系列的行为艺术，直接把功劳都收到自己头上了。


    本案例这位穿珠子的小人物为什么应对如此成功，原因有两个：


    # 一、立场


    通过提出这样为领导巩固权力的建议，让领导觉得你的立场是站在我这边的，就无形中打消了你会向对方泄密的可能性，所以这是保命的前提。


    # 二、有效


    提出的方法，非常具有实战型，而且能直接为领导排忧解难，还没有采取任何极端措施，没有激化矛盾，最重要的还是维护了领导的权力安全！


    仅此一对，就足以让齐襄王对这位穿珠子的下人另眼相看！


    本段材料，绝大多数人都把他看成是功高震主的典型案例，而我们今天从小'
