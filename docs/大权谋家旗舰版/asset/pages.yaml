- pgno: 264
  md: '经验，导致应对失误，对自己前程不利，那面对这样的情况，小人物到底应该怎么做呢？我们先来看两个案例：


    # 一、宋教仁被暗杀事件


    袁世凯就任临时大总统后，极想笼络众望所归的宋教仁，他派人暗中了解宋的体型，送去的西装，比宋自己定做的还要合体。他给宋一本交通银行的五十万元支票，请他自由支用，但宋教仁只留下衣服，支票却让人退还给袁，并修书一封日："缎袍之赠，感铭肺腑。长者之赐，仁何敢辞。但惠赠五十万元，实不敢受。仁退居林下，耕读自娱，有钱亦无用处。原票奉璧，伏祈鉴原。"
    这件事是使袁对宋起了杀机的一个重要原因。


    # 二、江夫人给京剧名家赵燕侠送毛衣事件


    文化/大革命时期，在文艺界有一件著名的"毛衣事件"。赵燕侠是著名的京剧表演艺术家，京剧旦角赵派创始人，同时也是唯一一位女性流派创始人。而当时的江夫人在打造样板戏，需要一批演艺界人士为她效劳，而当时看中了赵燕侠，所以江夫人送赵燕侠送了一件毛衣，而后来江夫人和赵燕侠碰面时候，发现赵竟然没有穿，甚至有人对江夫人说，赵燕侠把毛衣搁在一边。之后，赵燕侠受到了全国封杀。


    从第一件袁世凯拉拢宋教仁的事件看出来，袁世凯是碰了一只软钉子，我们普通人都会为宋教仁不畏权贵而叫好；不过如果从袁世凯的角度来看，你就是不我拉拢，就是和我对立的敌人，甚至有一种"给脸不要脸"的/Re:


    而从权力角度看，不能为我所用的有才之人，都是自己的潜在威胁，而权力对于威胁又讲究先下手为强，而宋教仁那时候的声望越起，也会直接给袁世凯威胁，所以宋教仁被暗杀也是必然的了。'
