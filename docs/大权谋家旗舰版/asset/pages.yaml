  md: '# 高考结束说高考，高考还能不能改变命运？


    除了受疫情影响的上海，一年一度的全国性高考已经结束，从以红楼梦为作文的素材到数学太难，到英语容易，本年度的高考话题不断，不过我想大家最关心的还在于高考还能不能改变莘莘学子的人生命运？


    中国的高考制度始于 1970 年代末，那时候是改革开放的前夕，中国处于百废待兴的状态，所以对人材渴求度非常高。而且那时对考生的要求很高，是真正的千军万马过独木桥，体现在录取率非常低，大概只有百分之四，所以那时候的高考，只要考上，那一辈子的命运就此改变！


    时间一晃到了 2020 年代，据当前的高考统计，当前的录取率已经达到百分之九十！所以大学生的含金量已经大大下降。


    不过为什么高考在老百姓心目中的具有如此重要的地位，具体原因如下：


    # 一、公正


    经过几十年的发展，中国的高考制度形成了一套公开公平公正的完善制度，而且因为社会上存在太多的玻璃门和不公平，高考的公平制度已经是弥足珍贵，所以希望在公平的平台上脱颖而出，也为从民到官的身份转变（当然现在还要进行公务员考试）提供了一种切实的途径。


    # 二、希望


    很多父母因为自己的人生不如意，所以把希望都寄托在下一代的身上，而最为简单的方法就是让子女在读书上下苦功，希望通过高考能考上名牌大学，从而在日后的职场竞争中取得有利的位置。


