- pgno: 77
  md: '的相认，而是一种借力打力的方法。通过认亲这一手段，与对方建立“类亲缘”关系，以此关系来操控对方。我国古代宫内太监之间的拜干爹、收干儿，都是双方间缔结“类亲缘”关系而无中生有的例子。


    翻开史书，这样的典故多如牛毛。当年安禄山认杨玉环为母就是一个众人皆知的典故。后来的蒋介石纵横官场，很大程度上靠了大认干亲。没有利害冲突时，盟兄干弟是打天下的资本；有了利害冲突时，拜了盟兄灭盟兄，认了干弟害干弟。心狠手辣，收放自如。无怪乎后来李宗仁评蒋介石时说：蒋统兵带将极其低能，但用阴谋诡计则常有神来之笔，一石三鸟还可左右逢源。看来，此论果然有几分道理。


    为了更好说明，笔者仍以《三国》举例。当年刘备用亲缘手段大搞帮派，他、关羽、张飞共谋天下的手段，其实质就是以结义的方式缔结“兄弟”式类亲缘关系。前面讲到历史上有许多依靠亲缘手段操控别人的例子，但刘备之所以是高手，是因为他不仅能够在实际行动中顺利地缔结这种关系，而且能够在言论和思想上为这种控制行动找到理论依据。他公然叫嚣说：“兄弟如手足，妻子如衣服。衣服破，尚可缝；手足断，安可续？”他的意思就是说，手足断了，就没有兄弟帮自己打江山了；没了江山，也就没了妻子。妻子没了，还可以再娶，只要有兄弟就有江山，有江山自然就有了妻子。


    总之，利用亲缘关系实施操控是一种非常高明也非常高效的手段。由于这种手段以互相之间的吸引为要，故而是一种柔性控制手段。而因为这种手段最高效也最安全，我们把它列为七大武器之首。如果能掌握这种手段，则举目天下皆是亲人，又有什么大事办不了呢？即使敌人穷凶极恶，也有办法通过亲缘手段使他众叛亲离、孤身作战，这样，拿下他还不是手到擒来么？'
