  md: '想到袁家的家眷，自己就先来到袁府，查看相关的资源（主要是甄宓）；第二个时机就是在这时候袁绍的家眷可以说是惊魂未定，对未来非常迷茫，特别需要另外再找一个靠山，在这样的情况下，无疑曹丕的到来给她们一个定心丸。


