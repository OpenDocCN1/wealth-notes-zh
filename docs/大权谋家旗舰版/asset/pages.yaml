  md: '# “阎王好过，小鬼难缠”背后的隐秘权力规则


    “阎王好过，小鬼难缠。”众所周知，是用来形容往往大人物好说话，一些无名小卒反而喜欢故意刁难；换一句话就是，装大要横的大多是低级者。其实在充分分析了这句话，会发现一个不变的规律——即官越大越和善，反之是官越小越难缠。两著官职不同级，也不冲突。这是因为和善的面目也必须要有强硬的拳头。


    我们来看一个历史案例：


    乾隆五十七年(1792)，刚刚从前线击退廓尔喀入侵、平定西藏战乱而凯旋的福康安遇到了一件烦心事。


    在回到京城以后，福康安照例往户部递交了军费账册，以便能够早日报销军费开支，不料却遭遇户部书吏索要“部费”，也就是要赏钱。要知道，福康安从小由乾隆皇帝带在身边长大，皇帝待他如亲生子，这时候的他更是圣眷正隆，是朝廷的大红人。不入官品的户部书吏竟然刮钱刮到他的头上，无异于太岁头上动土。


    福康安哪里受得了这种勒索，气得暴跳如雷，他怒道：“么麽小胥，敢向大帅索贿赂乎！”论级别，小小书吏与他这个爵爷相差十万八千里。别说刮他的油水，就是他能在人群中瞥上他们一眼，他们也应该激动好几天。


    就在福康安愤愤难平之际，书吏对自己的行为给出了解释：索要“部费”只是为了“多添书手、日夜迅办”，如此才能速报速结，否则，“仅就本有之人……非三数年不能了事”。书吏还特意提醒福康安，现在你刚刚大捷归来，皇上对你有求必应，一旦这事久拖不决，“上意倦厌，必干诺责”。这句话是在暗示福康安，要办尽早办，如果拖下去对其不利。'
