  md: '# 权谋解读：红楼梦贾家为何必然从显赫辉煌到没落抄家？


    很多读过红楼梦的朋友（作者也研究红楼梦很多年）都会对贾家里面少男少女的恩怨情仇沉迷不已，对贾家衰弱和抄家懊恼不已，甚至都不想查看八十回之后的事情。不过，如果多读历史，我们就知道贾家的没落和抄家不可避免，原因如下：


    # 一、权力来源


    贾家第一代荣国公和宁国公都是清朝的开国元勋，在清政权力关的过程中功劳很大，所以作为相当于一个企业的小股东，分到了企业的股份，不过红楼梦的时代已经过去60-70年了，也已经过来3-4代了，所以贾家当前的后代都是靠着祖上余荫和帝国的继承制度才有了现在的荣华富贵。而上层的权力也在斗争和变动，所以一旦上层权力有所变化，贾家必然会受到波及。而当时，正好是康熙驾崩、雍正继位的权力更迭时期。而且随着时间的推移，你对当权者的作用也越来越弱，反而容易富贵而骄，骄纵不法，不给当权者提供价值，还给当权者制造麻烦，那肯定就会对自己越来越不利。


    # 二、权力能力


    因为贾家的荣华富贵不是当前的人努力斗争得来的，而是通过继承得到的，所以对权力能力的培养就非常缺乏，而且因为自己的荣华富贵得来非常容易，所以缺乏对荣华富贵来源的足够认识，权力的能力也就无形之中退化，乃至于是到了贾宝玉这代居然以读书做官为耻。试想如果不能争取官位，没有权力加持，怎么保有自的荣华富贵呢？


    # 三、利益争夺


    清朝入关的时候，靠的是夺取李自成和明朝的利益，是不断做大蛋糕的过程，'
