- pgno: 98
  md: 相传朱元璋得了天下，皇帝当得很过瘾。一日无事，上得殿来，看着周围富丽堂皇，踏着脚下金砖碧瓦，不禁大为得意，一时放松，竟然说了一句：“想当年老子要饭的时候，连顿饱饭都吃不上。实在混不下去才来当兵，没想到如今竟当了皇帝。”小朱不过随口一说，过去也就无事了。偏偏此时有个油漆工在大殿顶上刷漆。他听到神圣的上天之子小朱说出这样的话来，顿时大吃一惊，弄出声响来。小朱也吓了一跳，再一细看是个工匠，也就没在意。可是等了一会，他琢磨过味来。原来政治这个东西，不管多么肮脏，表面上却一定要糊上仁义道德、为国为民的大牌子来。如此，才能唬住那些开斗小民、贩大走卒之类。可是刚才他竟然在无意中说出了真心话，而这句真心话竟然被一个下人听了去，将来一旦传出去，岂不是被人家笑掉大牙？对于一向神圣的皇帝，在人前露了老底，这还了得？所以，朱元璋气哼哼回转过来，准备杀掉木匠灭口。谁知，等他站在大殿里叫工匠下来的时候，工匠竟然不理不睬，专心致志地干着手里的活。朱元璋派小太监把木匠拉下来，木匠咿咿呀呀手舞足蹈地比画，原来竟是个又聋又哑的漆工。顿时，朱元璋已经悬起的杀心放了下来。于是，工匠逃脱大难。事实上，这工匠既不聋也不哑，而是一个很聪明的人。他一听到朱元璋说出了这句没水準的话，当时就知大事不妙。等朱元璋回过头来想杀他的时候，他已经想好了对策。如果不装哑巴，那么，无论你讲什么保密啊、不为外人道啊等等的辩解之词，相信都无法控制朱元璋的杀心。相反，假装哑巴，不说话，不作声，却比公孙龙、苏秦之类的雄辩滔滔功用还大。此时无声胜有声，不说话时胜说话。我们说，在说服操控中注意分清“说”和“不说”的妙用，讲的就是这个道理。
    通常，人们主要关注如何用语言说服别人，很少有人注意到“不说”的好处，
  merge: -1
  img_proc: true
- pgno: 99
  md: '笔者在此从这个角度把生活中的道理挖掘出来，与众读者共同分享。


    其次，在“说”中，仍然可以分为有和无，具体来说就是“说什麽”和“不说什麽”。为了用语言操控别人，必须要知道说什麽和不说什麽。所说的话，所传递的信息，一定要为了有效操控对方服务；有些话是废话，有些话是画蛇添足的话，就不能说。这样看来，即使是要“说”，也有说什麽和不说什麽之分。要注意在说服别人时信息的选择。


    选择“说什麽”和“不说什麽”，是成功说服和洗脑的关键环节。有些话一定要说，只有说出来，才能够成功操控对方，使对方按照我方思路行动。有些话绝对不能够说，一旦说了，就可能导致整个操控行动的失控。此时，无论如何，也是不能够说的。


    有这样一个案例。战国时齐国有   一位齐威王，在他刚即位之时，不理朝政，吃喝玩乐，九年不管国家大事，甚至连国家打了败仗也并不放在心上。齐国的大臣臣们非常着急。


    有一天，一个叫邹忌邹忌的琴师来见齐威王。原来，威王一向喜好音乐，他一听有琴师求见，便叫人把邹忌邹忌带了进来，请他弹琴给自己听。邹忌邹忌正正衣冠，庄严神态，摆出一副准备弹琴的样子，但是却呆坐半天并不动手。威王不解，问邹忌邹忌弄什麽玄虚。邹忌邹忌回答说：“臣不仅会弹琴，而且还懂得弹琴的诸多深奥的道理。”随后就“一、二、三，甲、乙、丙”地讲了半天理论。威王前头还礼貌地听着，到后来不耐烦了，着急地说：“你说得很好，可是你怎麽不亲自弹弹让我听听啊。”邹忌听了哈哈大笑，说：“大王知道我是琴师，希望听我弹琴。但是，您看见我只摆架式不动真格的就不满意了。那么大王，全齐国人都知道您是大王，希望您也‘演奏’一下王者之音。可是'
  merge: -1
  img_proc: true
- pgno: 100
  md: '大王拿着齐国这把大琴，九年了也从未‘弹’过一回。那么，全国人不是对大王更加不满意了吗？


    威王一听马上明白，于是说：“您哪是在谈琴啊，分明是在劝诫我啊！”于是，二人谈论起国家大事来。邹忌向威王提出了许多良好的建议，威王大喜，便拜邹忌邹忌为相，帮助自己治理国家。


    我们来看邹忌是如何通过语言实施操控的。齐王上任九年，不理朝政，按说是个荒淫无道的大王。本来照实说，也未尝不可。但是这样，就会伤到齐王的自尊心，使得事情适得其反。所以，这些话显然反映事实，却也必须删除，打死也不说。而有些话，比如劝谏威王勤奋国事，必须得说，只是要说得巧妙，让对方能够接受。于是，就产生了下一个环节：如何说得好？


    第三，说得好和说不好。决定了说的内容之后，还有说得好和说不好之分。一般来说，即使同样是说服洗脑，也有方法对头不对头，语言组织丰富不丰富，观点立场正确不正确之分。说得好，对方听得口服心服，这是最佳选择；说不好，对方就可能将你的话当作耳旁风，从而枉费心机，竹篮打水。所以，说得好与说不好实在很重要。上文提到，邹忌邹忌在成功说服威王之后，又害怕威王听信身边的谣言，于是就又跑到威王身边，进行新一轮的说服洗脑。


    邹忌邹忌说：“有一天，我打扮好了自己，对着镜子看看，觉得自己非常漂亮。便问妻子说，‘我和城北的徐公比，到底谁漂亮？’妻子回答说，‘您是最漂亮的，徐公哪里比得上您啊。’我将信将疑，于是又问自己的妾说，‘我和徐公哪个漂亮些。’小妾回答，‘当然是您啊。’过了一会儿，我的一位朋友来拜访我，我顺便问他，‘我和徐公哪个漂亮啊？’我的朋友马上回答，‘徐公怎么能和你比啊。’于是，我心里美滋滋的，认为自己是最漂亮的。谁知第'
  merge: -1
  img_proc: true
- pgno: 101
  md: '二天，我正好遇见了城北徐公。仔细一看，原来他比我漂亮多了。于是我便开始反思起来：我妻子说我漂亮那是因为她对我比较偏爱；我的小妾说我漂亮，那是因为她害怕我讨好我；我的朋友说我漂亮，那是因为他有求于我。”


    讲完这个故事，邹忌说：“我明明比不上徐公，他们却一定要说我漂亮可见，我要想听到真话，该是多么困难啊。如今，大王土地广阔，宫中美女都想讨好大王，朝廷大臣都害怕大王威势，各地百姓都有求于大王。这样看来，大王您被蒙蔽的程度，岂不是比我更厉害？”


    威王听懂了这个道理，对邹忌的话非常赞同，于是下令在全国范围内，无论是大臣还是百姓，只要直言指责他的过失，就能够得到重奖。于是，威王执政日益开明，齐国开始蒸蒸日上。


    以上的这个例子是一个巧妙说服的例子。邹忌选了一个非常好的切入点开始言说，最后一点点引出自己的主题。逻辑严密，结构紧凑，言之成理，威王完全被征服了。


    在历史上，类似的例子还有很多，比如《触龙说赵太后》一文，大家仔细看看，就知道说得好与说不好的区别了。


    一般来讲，大多数演说教材都告诉人们如何才能说得好，笔者不打算赘述。其中种种方法技巧，都可以在认真学习后熟练掌握及运用。在这里，笔者想点出“说得好”与“说不好”的另外一层意思。


    通常而言，大家普遍都认为“说得好”证明此人有能力、有口才，适合去说服别人；说不好意味着没有说服操控的能力。殊不知，说不好，有的时候能够收到比说得好更好的效果。比如，你说得好，非常精彩，对方反倒怀疑你滑头，有所图谋，会对你提高警惕，这样就不容易操控对方；说不好，木讷，对方反'
  merge: -1
  img_proc: true
- pgno: 102
  md: 倒认为你虽然笨拙，但是老实可信，就不会对你提防。此时你说什么都容易让对方相信，因此反倒方便了操控竞争对手。大辩若讷，大巧若拙，说的就是这个意思。所以，衡量“说得好”与“说不好”的唯一标准就是能否顺利进行操控。我们认为，只要能够实现操控的说服，就是好的说服，就需要大力提倡；只要不利于成功实现操控的说服，就是不好的说服，就必须ίναι坚决改正或杜绝。有人说，你说的道理有那么玄奥吗？既然读者有不信的，我们可以找出证据来。楚汉相争之时，天下英雄辈出。后来刘邦灭掉项羽，削平诸侯，坐稳了江山，于是考虑千秋万代的大事。他的儿子刘盈不受喜爱，刘邦定爱戚夫人所生之子如意。戚夫人由于受刘邦恩宠，因此日夜在刘邦耳边絮叨，希望更立太子。为了自己百年之后戚夫人母子的安全，刘邦遂决定立如意为太子。但是，刘邦也是一个非常有手段的人。我们看他的一贯作为，就知道他是借势而不谋节的人，也就是说，他善于造成有利于自己的客观形势，让别人把他想要说的话说出来、想要做的事做出来。这一点，从当年他称帝时的虚伪态度就能够看出来，当然，他迫于形势不得不分封诸王，待到回过头来反手一一剪灭，用的也都是这个手段。这一次，他决定换太子，但是，还需要和大臣臣商议，希望等自己提出来，诸大臣附和自己的意见。可是，当刘邦提出之后，大臣众口一词，极力反对。众大臣中文臣臣墨客也并不在少数，说什么废长立幼古来取乱之道，言之凿凿，可惜刘邦决心早定，不肯听从，而且大倒苦水，希望他们明白皇帝苦心。正在此时，忽听有人大叫：“不……不……不可以。”刘邦顺声一望，原来是大臣周昌。这周昌是个结巴，素来正直。刘邦怒道：“为何不可？”这周昌本就说话不利落，看见皇帝发怒就更着急，一时连话都说不出来。好一会，周昌才拧扎着说：“臣臣口不能言，然臣期期知其不可。陛下虽欲废太子，臣期不本诛。”
  merge: -1
  img_proc: true
- pgno: 103
  md: '听了周昌结结巴巴的话，看着他着急失措的样子，刘邦忍不住笑起来。于是，刘邦转移话题，不再说换太子之事。


    人们看到史书中的这一节不禁要问——连那么多大臣都说不了皇帝，一个结巴怎么能说服他呢？


    原来，周昌为人耿直，这是刘邦素来知道的。而且，周昌口吃严重，刘邦平常并不把他放在眼里，起码不曾对他产生过戒心。刘邦做了皇帝，天下最大的事儿就是如何保住皇位；这周昌如此水平，根本不会引起刘邦对他的防范。这正是刘邦的帝王心术所在。历来皇家之事，易争不易和。皇帝家事，外人如果插手，一个弄不好，就可能自身先完蛋。我们假设如果是刘邦猜忌甚深之人——比如韩信前来说项，那会发生什么情况呢？笔者猜测，刘邦必定会认为太子与权臣勾结一室，那么，其后果很可能不妙了。


    况且，周昌为人正直，素为人们尊重，刘邦一向知他忠诚。有一次，周昌进宫奏事，正赶上刘邦揽着戚夫人寻欢作乐。周昌见了，转身就走。不料刘邦见到他之后，产生了玩笑之心，存心要逗逗这个老头。于是，追出殿外问：“你怎么走这么快？”周昌无法，只好转身跪下，准备奏事。谁想刘邦那老流氓的本色又暴露出来了。他并不答话，伸开双腿，骑在周昌脖子上，厉声问他说：“你见了朕，什么不说就走，简直不把朕放在眼里。你把朕当成何等君主看待，实在可恶！”周昌见刘邦这样无礼，心里着急；再加上自己口吃，一时说不出话，好半天才憋出一句：“臣，臣，臣看陛下乃桀纣之主。”


    刘邦听了，哈哈大笑，不仅没有介意，反而把他放了起来。细看刘邦的一生，就可知道此人刻毒：当年韩信无意中说了他一句将兵不过十万，而自己带兵多多益善，就被他怀恨在心；此时周昌如此咒骂，他反倒不恼怒，可见心里确实'
  merge: -1
  img_proc: true
- pgno: 104
  md: '没有提防周昌。


    此次周昌阻止刘邦更立太子，虽然口才拙劣，表演笨拙，但是，却让刘邦开怀大笑，原因在于他知道周昌对他忠心耿耿，而且确实也是操劳国事之人，再加上众人反复劝谏，正好借此收篷，遂转过话头不再提及此事。这周结巴在关键时刻保住了太子，吕后一直躲在后面偷听，下朝之后，据说吕后竟然给他跪下，感谢他保太子之恩。


    从上面的故事可以看出：说得好固然很好，说不好也有说不好的妙用。推及开来，真正聪明的操控高手，在需要以理服人的时候，不仅知道何时该夸夸其谈，一语中的；也知道何时该装疯卖傻，言不及义。这些人不仅知道何时应该说得好何时需要说不好，而且也能轻而易举地做到。不以语言去说服别人，不用不该说的话去说服别人，甚至不用漂亮的语言去说服别人，这就是“无”在“以理服人”中的妙用。


    以上，我们对于“以理服人”进行了肤浅的研究。为了更好地让读者看明白，我们再把思路重新理顺一下：


    说和不说，指的是要掌握“以理服人”的时机——时机到了，就得说，就需要摇动如簧之舌，努力说服对方，让对手乖乖被你控制；时机未到，就不能说，就必须隐忍沉静，装聋作哑，一句话一个字也不能说。


    说什么和不说什么，是指要掌握“以理服人”的内容。在“以理服人”过程中，哪些话能拿出来说，哪些话不能拿出来说，必须在前期做好信息甄选工作。如果把不该说的话（即使是真相）也说出来，则亦可能影响说服效果，因而也会就增加控制的难度。


    说得好和说不好，是指“以理服人”的形式和效果。说得好指语言精彩、口'
  merge: -1
  img_proc: true
- pgno: 105
  md: '才通畅、辩才无碍，这是说服别人所必须具备的前提条件。但是，有时候说得好听，并不完全管用。说得不好，也有它的用处。要掌握“语言洗脑”的操控手段，这个道理不能不明白，这种露拙的手段也不能不掌握。


    什么时候说，说什么，怎么说；什么时候不说，不说什么，怎么说不好，这些都是说服洗脑的道道。笔者过去曾对口才辩论下过一番大工夫，最后读书数卷头昏脑涨茫无所得，盖因市场上所售之口才书籍无一不是讲“如何说得好”这一内容的。至于其他内容，则几乎没有涉及。待到有一日看曾国藩，书中讲，此人得道之后，与对方交谈，一脸木讷，闭口不语，往往令竞争对手手足无措，不得不乖乖受他摆布，到此时方发现口才运用的新境界。


    说服操控之法博大精深，可根据对手、实际、环境不同而千变万化。实施说服操控，不能拘泥僵化，而应灵活应变，正所谓“运用之妙，存乎一心”是也。


    # 5、威慑手段


    在谈威慑手段之前，先谈谈人性。


    只要是人，就难免会有这样或那样的缺点。有的缺点可以克服，有的缺点不易克服。这些不易克服的缺点，就是人性的弱点。


    从理论上讲，每个人都存在人性的弱点。这些弱点，就如同筐桶理论中的短板，决定了一个人能在事业中究竟取得多大的成就。


    关云长，忠肝义胆、武艺高强，却因为傲气太盛，最后败走麦城；项羽，一介武神，“力拔山兮气盖世”，却因“妇人之仁”优柔寡断，最后身死东城。在生活中，有许多人聪明睿智、才堪大任，却因为嗜酒好色，关防不严，最后'
