- pgno: 107
  md: '神圣不可侵犯的法律，那渺茫无知的前途和命运。再比如，对邪恶势力、极端势力的担心，对虽然遥远却又不知何时会发生的灾难的恐惧，等等。说到底，每个人都会害怕，都会担忧，都会产生“软弱无力感”。即使连皇帝老儿也会害怕民众造反，连美国总统也会担心遭恐怖分子袭击，可以说，“担心”和“害怕”心理，是沉淀在人性深处可利用的最常见的弱点。


    回到竞争中来，人们会发现，现实生活中的竞争是残酷的。有时候，竞争一旦失败，轻则淘汰出局，重则家破人亡。所以，竞争后果的不可预测性，以及失败后下场的悲惨性，对每一个加入到其中的人来说，都能产生严重的震慑作用。而且，对于那些博弈的高手来说，越是高高在上，盯着的人越多，得罪的人也越多，因此生存环境更加险恶，所以更会谨小慎微，如履薄冰，比别人顾虑更多，比别人计较更多。


    翻开史书可以看到，那些熟于竞争的人，他们从来不会轻而易举地放手一搏，而是会更害怕、更犹豫、更谨慎。只有这样，他们才能够获得更安全也更长久的结局。相反，只有那些无知小人才会意气用事，不惜拿“二百五”精神引刀成一快。这样的人，正因为不知害怕，无知者无畏，所以往往死得比别人更早。笔者素来把从事资源竞争比作狩猎——如若狩猎成功，则可以诛虎杀豹、逐鹿天下；哪怕些许大意，就很可能被猛兽反噬、尸骨无存。有经验的猎人人在打猎时以来都不敢麻痹、不敢妄动，奈何那些想要打倒“天下”这只极其肥硕却又凶猛异常的猎物的“猎人”，反倒不知进退、不知死活。


    反过来说，正因为竞争具有残酷性和激烈性，正因为参加到竞争之中的人们比常人更谨慎和更计较，所以，他们也就存在着比常人更多的弱点，比常人更胆小，比常人更可欺。比如，当年韩信不杀钻胯之人，是因为他认识到这种小'
