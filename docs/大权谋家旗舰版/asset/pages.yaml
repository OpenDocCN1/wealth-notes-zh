- pgno: 206
  md: '# 6、结交之法


    常言道，一个篱笆三个桩，一个好汉三个帮。在竞争场内，没有广泛的人脉为基础，就根本没有出人头地的机会。因此，尽最大可能团结一切可以团结的朋友，逐步做大自己的人脉基础，这在一定程度上可以说是权力斗争胜负的决定因素。唐太宗一生雄才大略，善于用人。他有一次到进士考试的御史府去，看见许多新考取的进士鱼贯而入，不仅得意地说：“天下英雄，人吾�披中矣。”李世民的意思是，天下的英雄，都进了我的圈套为我所用了。从这句话中我们可以看到，要争取稀缺资源，最重要的事情，说到底，就是人脉。为了增加自己的人脉厚度，就必须尽可能广泛结交朋友。这样，就用到了结交之法。


    一般来说，结交之法主要包括以下情况：


    # (1) 利同而交为了共同的利益而走在一起，是结交的最基本的原动力。


    在竞争中，应该广泛地求同存异，最大化地争取建设共同利益，建立双赢格局。这样，才能够赢得更多人的支持，为自己积累丰厚的人脉关系。中国古代有个“将相和”的故事，说的是蔺相如和廉颇为了共同的国家利益而抛弃前嫌，齐心协力报效国家。蔺相如和廉颇就是“利同而交”的典范，不过，他们的“利”不是为了私利，而是为了公利。这种交往，更让人敬佩。当然，大多数交往靠的是人们之间利己因素的驱动。


    # (2) 志同而交


    “志”包括两个含义，一个是志向相同，一个是志趣相同。在古代，不三有为了共同志向而结交的例子。比如，西汉末年刘邦起义的时候，他和许多其他重臣，就是为了打天下这个共同的志向而团结到一起的。而高山流水伯牙子期的故事，讲的就是志趣相同而交。历史上还有一个著名的“管鲍之交”的'
