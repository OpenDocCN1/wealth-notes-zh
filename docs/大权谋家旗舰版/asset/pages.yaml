  md: 上都有一定的威信。威，即威严也。但是，主上制造威严也需用术，一方面既要营造平易近人的效果，另一方面又要严而有威，以防止下属“近之则不逊”。刘邦登基当皇帝后，任命叔孙通来制定朝仪。叔孙通带着许多儒家弟子忙活了很长时间，终于参照秦朝礼仪制定了大汉朝仪。以前上朝的时候，各位将军大臣姿态各异，非常放肆，有的时候甚至喝醉了拿出刀剑对着柱子一阵乱剁。等到朝仪制定好了，各大臣诚惶诚恐地伏在刘邦面前，刘邦才感觉到做皇帝的好处。在这个案例中，叔孙通制订朝仪增加了皇权的神秘性和权威性，增强了皇帝的威信和威严。古人说，礼，就是用来规范人们言行的。在这个例子中，刘邦用朝仪规范和震慑群臣，收到了很好的效果。
    示信之术：主上对下讲信用，下属才会为上级卖命。如果总是开空头支票，或者言而无信，就会使得臣下会失去对主上的信心。如此一来，主上的信用体系崩溃，则权力运行势必受阻；下级生出怨恨和不臣之心，主上的地位也就危险了。自古以来，人们就强调信用的作用。商鞅变法的时候，用的就是“徙木立信”的方法。《三国演义》里刘备借荆州之后，言而无信，取得益州也不归还，结果导致了东吴的偷袭，还直接导致关羽失败。马基雅维利在《君主论》中说到主上应该尽量少讲信用，这固然有其道理；但是，如果一味对下属不讲信用，也同样会失掉人心，这则是事物的另一面道理。当然，权力场中事态变化万千，往往事先承诺好的事情并不能够兑现，如此一来，则可能会造成主上对下属的失信。值此之时，一定要做好矛盾的协调和转化，切不可激化矛盾。第三，平衡之法。主上对下属的驾驭，不仅要从物质层面、精神层面入手，而且，还需要有切实可靠的组织力量给予保证和实施。没有组织上的行动，就不可能真正驾驭好下属。利用组织力量对下属进行驾驭，古人把这个方法称作“牵
  merge: -1
