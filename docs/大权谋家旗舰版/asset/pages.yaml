- pgno: 79
  md: '严嵩为人城府极深，人又狠毒。他隐藏锋芒，耐心寻找机会。


    严嵩打听到夏言是他的江西老乡，于是打算利用这层关系拉拢夏言。一天，他备下酒宴，亲自到夏府登门邀请。谁知夏言根本不打算结交严嵩，给了严嵩个闭门羹，避而不见。严嵩心里恨得牙痒痒，表面上却谦恭到了极致。他跪在堂前，高声反复朗通自己的请柬。夏言听到后大受感动，以为严嵩真对自己如此仰慕（当然此人是个爱慕虚荣之人），于是折节下交，两人遂成了朋友。


    严嵩在没有门子的情况下都能钻出这样一个门子，其为人心术之深也就可想而知了。所以，一旦结交，严嵩肯定会抓住夏言的弱点大举进攻，什么良言美语，什么字画古玩，高举着“正义”的名义一齐甩给了夏言。历史书上虽然没有详细记载，但是，从后来的发展来看，夏言确确实实被严嵩利用友情手段给控制了。严嵩与夏言攀上关系后，夏言非常器重严嵩，并一路提拔他，最后竟然还向皇帝推荐严嵩接替自己的首辅位置。


    严嵩利用友情谋到高位，就准备拔掉夏言，取而代之。为了达到这个目的，他对夏言俯首贴耳，言听计从，用友情手段迷惑夏言，让他对自己放松警惕；同时，暗地里搜罗夏言的罪状，寻找机会，欲彻底打倒夏言。


    机会终于来了。一次皇帝出行，夏言没有按时值班，皇帝对夏言产生了看法。一旦领导对你有了看法，这可是灭顶之灾。严嵩感到时机已到，就露出了真面目。往日里他和夏言交往时的卑躬屈膝没有了，话语中对夏言的感激涕零也没有了，取而代之的是悄悄搜罗来的证据，以及在皇帝面前指证夏言时的冠冕堂皇和大放厥词，又有皇帝宠信的道士陶仲文，一起添油加醋，作严嵩的盟军。皇帝本来就已对夏言不满，于是大发雷霆，罢免了夏言一切官职，让严嵩取而代之。到此，严嵩以友情实施操控的过程就已经完毕了。'
