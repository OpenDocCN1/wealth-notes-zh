- pgno: 183
  md: '# 3、用师之法


    古人云：用师者王，用友者霸，用徒者亡。古人非常推崇“用师”，认为能够用师的人是成就伟业的人。之所以如此说，是因为，任何组织的发展必须需要有一个方向。首先，这个方向必须是正确的；其次，这个方向必须是能够达到的，也就是说具有可操作性；最后，在行进过程中，必须能够根据形势的变化，随时调整行进的快慢，全面掌握行进的安全性。作为一个组织的领导人，可以是一个很好的组织者，能够把不同性格、不同爱好的人拢在一起；但是，未必能够成为战略规划家，特别是很少有领导人能够成为谋略家。这就如同茫茫大海中行驶的航船一样，领导者就仿佛是船长，组织人们进行航行；而谋略者就是罗盘，给整个航行指明正确的方向。依此看来，用师之法是最重要的。就一个个人来说，也需要有人随时给指点方向，进行决策咨询，只有如此，才能在大海凶波中进退自如、履险如夷。这也如同下棋，如果有高人指点，则可占得先机。


    军师，“王者师”也。古今凡是善于用师的人，常常能够在组织发展和对敌斗争中获得别人不具备的优势，而且也能够在实力不济的时候靠着“王者师”的指点化弱为强并收拾天下。其实，用师之术，在历史上是非常常见的。我们前文提到的秦穆公用百里奚、刘邦用张良、刘备用诸葛亮、朱元璋用刘伯温，都是用师之术。在这里，我们举出苻坚用王猛、成吉思汗用耶律楚材、皇太极用范文程的故事。


    # （1）苻坚用王猛


    《晋书》记载，王猛幼年贫穷，以卖草簌为生。但是，他博学而好读书，谨慎庄重，胸怀大略，不事琐事。而且，王猛择人而交，不是非常相知的人，王猛'
  merge: -1
  img_proc: true
- pgno: 184
  md: '一般不予理睬。为此，有些浮华之徒都轻视他并讥笑他，但他丝毫不以为意。

    王猛有一次去洛阳卖东西，有人对他说想高价买他的东西，但是没钱，自称家住不远，希望王猛同他回家去取。王猛认为价高，便跟了去。走了不远，就进了深山。来人带着王猛来到一个地方，见有位老者，须发皆白，蹲坐在一个椅子上，周围围着十多个人。来人领着王猛前去参拜。老头说：“王公不必拜了。”随后给了他十倍的钱，并派人送他回去。王猛走出深山，回头望去，才知道自己刚才进了嵩山。以这个故事中，可以看出王猛年轻时就已经名声在外了。

    王猛志向远大，且胸怀救世之志。他希望自己能够遇见成就帝业的君主，为此他隐居不仕，静观时局，想等待时机成熟再出山。当时东晋的大将桓温率兵攻打三秦，王猛穿着粗麻短衫去见桓温，

    一边纵论时局一边捏着虱子，旁若无人。桓温看王猛行止，感觉非常诡异。后来桓温班师回朝，想带着王猛一同回东晋当官。王猛回到华阴山去问他师父。史书并未记载他师父是谁，但我们以他的话中可以知道是一位高人。王猛的师傅告诉他说：你和桓温怎么能够同时相处呢？在这里就可以得到富贵，何必远行？王猛的师傅深知王猛是当世英雄，如果与桓温到了东晋，则势必成“一山不容二虎”的局面。桓温是东晋权臣，只手遮天，嗜权如命，曾经废除东晋当时的皇帝，另立新君。后来，他甚至想要废晋自立，只不过因为生病死得早才没实现。他那句“既不能流芳百世，不足复遗臭万年耶”的名言，曾经风传一时。虽然桓温看重王猛，但是王猛的师父深知桓温为人，劝诚王猛不要出山。当时，前秦由厉王苻生统治。苻几次想杀了苻坚，但是都被一个叫李威的人给救下了。因此，苻坚对李威以父待之。李威知道王猛很能干，就劝苻坚重用王猛。苻坚早就有心成就霸业，听说了王猛的名声，就派人去招他。两人一见如'
  merge: -1
  img_proc: true
- pgno: 185
  md: '故，谈到当时天下分裂兴亡一统的大事，竟然不谋而合，就像刘玄德遇到诸葛亮一样。等到后来，苻坚废黜了苻生，自己即位，号称大秦天王之后，李威就劝苻坚把国家重任交给王猛。于是，苻坚大胆启用王猛。由于王猛受到苻坚重用，旧的贵族功臣都看不惯。有个姑臧侯叫樊世的非常讨厌王猛，他对王猛说：
    “我们耕种，你吃现成的吗？” 他意思是，前秦的天下是他们打下来的，却让王猛享受富贵。王猛针锋相对地说：“不仅让你耕种，而且还让你煮熟。” 樊世听了勃然大怒，说，我一定要把你的脑袋挂在长安城门上。


    王猛回去之后，就把此事告诉了苻坚。苻坚说，我一定把这个老头给杀了。恰好樊世进宫奏事，在苻坚面前同王猛吵了起来。樊进一冲动，想起来打王猛，结果苻坚大怒，派人把樊世拉下去杀了。此后，群臣见到王猛，连大气都不敢出了。


    王猛治世，法令严峻。一次，他拘捕了一个叫强德的人。这个强德是当时强太后的弟弟，为人欺男霸女，为非作歹，百姓怨声载道。王猛抓住他之后，一边上奏，一边动手把强德杀了示众。苻坚看到奏折后派人来赦免强德，但是早就来不及了。在王猛的强力治理下，前秦的法令一新。苻坚感叹说：我现在才知道天下有法的样子。


    王猛三十六岁时，被苻坚任命为宰相，管理国家政务。不久，又让他总督中外诸军事，也就是让他掌了军权。王猛管政务，还可以说得过去；连军事大权都拿了去，这就有点冒尖了。王猛怕事过则反，于是上书推辞。苻坚说，你原先是布衣精英，我三十岁的时候还没有当上皇帝。恰逢乱世，厉王
    （苻生）在位，我很<|message|>。当初我刚见到你的时候，就把你比作卧龙，你也因我的一席话儿出山。自从你辅政以来，对内日理万机，对外扫除群雄，我不托付给你，'
  merge: -1
  img_proc: true
- pgno: 186
  md: '还能给谁呢？后来，苻坚又让王猛当司徒。这样前秦的一切军、政要务，悉决于王猛之手。


    王猛当宰相十六年之久，辅佐苻坚治理国家，很快就使前秦走向兴旺，而且，在军事上帮助苻坚基本统一了十六国时代动荡的北方版图，形成了北方前秦与南方东晋对峙的局面，为前秦国的政权和百姓立下了汗马功劳。他锐意，整顿国内官僚体制，裁汰冗员，奖励贤才，使国家政治清明；他建立坚不可摧的国防体系，有效保护了人民生活和国家安全；他注重农业生产，大力发展农业，使得前秦这样一个少数民族国家百姓生活富足安居乐业；他制定严法，以法治世，给百姓创造了非常有序的社会生活局面。


    王猛辅佐苻坚，内安百姓，外拓江山，不仅苻坚亲之爱之，用之敬之，而且就连当时的百姓，都对王猛赞不绝口。在王猛死的时候，人们送了这样一幅挽联，“关中良相唯王猛，天下苍生望谢安”。挽联将一南一北两大良相并称，可谓是对王猛的盖棺论定了。


    # （2）成吉思汗用耶律楚材


    耶律楚材是金国人，成吉思汗攻破大金燕京之后，听说了他的名字，就召见他。耶律楚材身高八尺，胡须漂亮，声音洪亮，成吉思汗非常看重他。曾经有个西夏人，因为擅长造弓箭而得到成吉思汗的赏识，他常常自夸道：“国家兴兵打仗，正应用我这样的人，耶律楚材这个书生能有什么用呢。”耶律楚材说：“造弓还需要弓匠，取天下的人难道就不需要懂得治理天下的工匠了吗？”成吉思汗听说后感到耶律楚材胸襟不凡，就更加信任和重视他了。成吉思汗曾经指着耶律楚材对后来的太宗说：“这个人是上天赐给我们家的，以后军国大事都要交给他办理。'
  merge: -1
  img_proc: true
- pgno: 187
  md: '历来，统一天下者都需要依靠武功，这是毋庸置疑的；但是，单有武功是不行的，还需要文治。刘邦人关还要约法三章以收民心，刘备取益州还要广施仁德，可见，单凭武力是难以进行征服和维系统治的。历代统治者都知道“马上取天下而不能马上治天下”，需要将武功和文治结合起来，以文武之道治之方得长久。耶律楚材是个书生，但是，元朝统一天下的过程中，耶律楚材提出了很多保护人民的建议，并为太祖成吉思汗和太宗提出了许多好的建议。太宗攻打下金国汴梁之后，有人建议屠城。耶律楚材建议说：

    “将士们餐风宿露，辛苦了几十年，想得到的就是土地和人民。如今，我们得到土地而失去了人民，又有什么用呢？”在他反复劝说下，太宗放过了本打算杀死的百姓，大约有一百四十七万。耶律楚材辅佐少数民族人主中原，依靠其高超的智识，提出了诸如倡导教化、保土安民等一系列措施，辅佐大元皇帝东征西讨文攻武伐，从国家的长治久安出发，提出了不少文治的好办法，极大帮助了元朝统治的建立。


    由于元朝历史上人才济济，所以耶律楚材的光芒被掩盖了，后人并不很了解。但是，从历史上来看，在元朝人主中原的过程中，耶律楚材确实是立下大功的。蒙古铁骑与儒生笔锋相结合，产生了巨大的能量，迅速摧毁了腐朽的南宋政权。


    # （3）皇太极用范文程


    范文程是汉人，居住关外，从小满腹经纶，胸怀大谋。努尔哈赤攻下抚顺之后，范文程和哥哥一同去拜访他。努尔哈赤很看重他。皇太极即位之后，叉受到了皇太极的重视。


    范文程知道清太宗皇太极急于人关，便提出了兵进雁门关的建议，而且提出要师出有名，并且力主制定人主中原的长远计划。由于范文程才华卓越，并且'
  merge: -1
  img_proc: true
- pgno: 188
  md: '谋略远远高于常人，所以，很快就成了皇太极的心腹之臣。每次讨论国政，皇太极一定要问一下范文程知道否，如果有大事不能妥善处理的，皇太极一定要问范文程的意见。


    范文程受到皇太极如此重视，当然也尽可能发挥自己的才干回报皇太极。前文提到的说降洪承畴的就是范文程。在范文程的辅佐下，皇太极较快统一了东北，建立了强大的政权，为其后的人关中原、定鼎江山奠定了坚实的基础。


    皇太极奠定人主中原之势，然而还没来得及实现就死了。他的儿子世祖顺治即位，由于年幼，由多尔衮辅佐。当李自成攻占北京之后，清军还被阻在关外。范文程被召来询问，他明确提出三点：第一，李白成逼死明帝，污辱士人，抢掠财物，已经失人心，且部下骄横不法，清军可一战胜之。第二，自古以来要得天下者，必须恩威并济，不能只嗜欲杀伐。大清想得到山海关以东那就罢了，如果要统一中原，必须要安定百姓。第三，范文程草拟檄文，明确告诉明朝百姓，清军作战是要为明帝报仇，与间贼作战，“官仍其职，民复其业”，绝对不扰民。事实证明，范文程的此举是非常明智和有远见的。他提出的这三点，为后来清朝人主中原、建立稳固统治，准备了重要的条件。


    以上，我们举出了几个“用师”的案例。其实，不必举太多例子，只要把《三国演义》翻出来，看看刘备是怎么用诸葛亮的，就足以知道“用师”之道。要用师，先要识师。这就用到了前面提到的识人之术。只有那些比自己强的人，才当的起“师”的称号。所以，要选择强于自己的人，这是用师的第一步。但最重要的，是要真正能用。这里有两个环节：其一，要敬之爱之。既然“师”有可用之处，必须要在感情上尊敬他，在生活上照顾他，在一切方面为师提供方便。《雍正皇帝》中讲到的雍正用邹思道，正是雍正礼贤下士，尊敬邹思道'
  merge: -1
  img_proc: true
- pgno: 189
  md: '到了无以复加的地步。这样，高人才能为之所用。其二，要对其深信不疑。无论是对其能力，还是对其品行，都不能有丝毫怀疑。项羽因为怀疑范增的品行而不能用，结果导致了自己的失败。刘备虽知诸葛亮年轻，但丝毫没有轻视反而深信不疑，结果在诸葛亮的帮助下裂土称帝。其三，要大胆使用。如果是掌握权力的人用师的话，就要大胆把事务交给对方，不能牵制，就像苻坚对王猛一样；如果是自己个人求师的话，就要经常与其积极请教，求其谋划。


    总之，要想在竞争场上纵横捭阖，就必须spolitik要处理好人与人之间的关系，选准发展的方向。师者，就是能够在关键的领域给予必要的咨询和帮助。所谓用师，最重要的是用那些高级策划人才，用那些智能超常、胸藏大略的人物。综述历史，大凡在斗争中胜出的领袖，无一不是有智囊在背后指点；甚至在今天，无论是个人还是组织，都离不开“用师”。当今，不仅个人、组织，即使是各个国家，也无一不需要聘请智囊来帮助谋划。比如美国兰德公司、美国智囊基辛格等。笔者对于古人所说的“用师者王”这句话非常推崇，并把“用师”之法简单总结为一句话，作为本篇的结语：如欲囊括江山，必得师而用之；善求师者也，无敌于天下。


    # 4、事上之法


    前面讲过，要想赢得竞争的胜利，就必须加入到团队中去。在任何团队中，都会有上下之分。处于下位，至关重要的一点就是要学会事上。


    在中国古代以集权制为特征的政治生活中，一切都围绕着一个核心展开，这个核心就是“上”。仿佛太阳系围绕着太阳一般，权力场上一切人、事都要'
  merge: -1
  img_proc: true
- pgno: 190
  md: '围绕着上级。上级能够决定个人的政治命运，决定个人的前途和发展、成功和失败。古代的集权制与集体决策制和民主制不同，上级对下级的命运具有一锤定音的作用。有句对联说得好：“说你行，你就行，不行也行；说不行，就不行，行也不行。”这个对联生动地表明了集权制度下官场的一个特点。当然，由于封建官场的特殊性，特别是由于是封建王权的强制性，权力场中“上”对“下”的决定作用更重要，甚至会发展到“让你活，你就活；让你死，你就死”的地步。所以，学习事上之术自古以来就非常重要。其实，事上之术与古人所讲的登龙之术有异曲同工之妙。


    所谓事上，就是一切以上级的意图为意图，以上级的爱好为爱好，以上级的需要为需要。不仅在行动上，而且在心理上、思想上永远同上级保持高度一致。并且，这个一致性，必须让上级时刻能够感觉出来。极端点说，就是要力争与上级形成融洽的如同情人般的关系。


    事上之重，大家都知道；事上之法，不是局中人，则不一定全明白。所以，我们重点谈谈事上之法。


    要正确做到事上，必须了解“上”，认识“上”，这在前文已经谈过了。那么，如何才能“事”呢？要根据不同的对象，采取不同的对策。


    粗略来看，上级有两种：一种是干事业之人，一种是贪享之人。如果对干事业之人谈享乐，对贪享乐之人讲事业，则就是驴唇不对马嘴了。所以，事上之法，贵在对症下药。


    # (1) 主有道，不争是争


    如果上级是个干事业的人，那么，他最看重的也是能够辅佐他于事业的人。在遇到这样的上级时，无需多么努力地去潜入他的内心世界，也不必煞费苦心'
  merge: -1
  img_proc: true
- pgno: 191
  md: '去讨得他的欢心，只要有本事，肯吃苦，坚持跟着上级干，就肯定能够得到上级的信任和赏识。这就是，主有道，不争就是争也。


    遇到有道之主，需要重视以下三个原则：


    第一，能干。凡是想有一番作为的主上，无一不需要能干帮助他把事业做大，或能帮助他分忧的人。这样一来，有过人的才能，必然能够得到主上的信赖。


    在我国历史上有房谋杜断这样一个成语，说的是唐朝房玄龄和杜如晦。在辅佐李世民南征北战的过程中，杜如晦和房玄龄两人戮力同心，建立了不朽功业。在李世民登基之后，两人先后为相，总理军政，为盛唐的开创立下了汗马功劳。房玄龄很早就认识了李世民。李世民对他就像老朋友一样。房玄龄侍奉李世民之后，就一心一意跟着李世民打天下。每次平定贼寇，别
    人争着去寻找珍宝古玩，只有房玄龄先把比较出色的人收拢到一起，然后安置到李世民的幕府中。房玄龄暗中和当时的谋臣猛将相互交结，使他们愿为太宗竭尽死力。房玄龄非常能干，善于谋划。李渊曾经对人说："房玄龄十分明了机宜，足能委以重任。每当替我儿陈说事务，一定能了解人的心理，千里之外，好象对面说话一样。"杜如晦也是一个干才。当年李世民任秦王的时候，许多王府的幕僚都被调到其他地方任职。房玄龄对李世民说："离开的人虽然多，但这些都不值得怯惜，可杜如晦是辅佐您的人才。大王如果最终只是守住封地，不干大事也就罢了；如果您一定要经营天下，除了杜如晦，没有谁能和您一起成就功业的。"李世民听了之后吃惊地说："不是您这样说，我几乎失去了他。"之后，立刻奏请李渊把杜如晦调到身边。房玄龄和杜如晦经常和李世民征战，出谋划策，军队里事务很多，两人处理得非常妥善。打下天下后，李世民的哥哥太子建成和弟弟元吉嫉妒李世民，想'
  merge: -1
  img_proc: true
- pgno: 192
  md: '害死他。在极其不利的形势下，杜如晦和房玄龄积极帮助李世民出谋划策，鼓动他先发制人，除掉李建成和李元吉。当时，建成曾说过一句话，“秦王府中所可悍者，唯杜如晦与房玄龄耳”从这话中，可以看到房玄龄、杜如晦对李世民多么重要。最后，建成向高祖上奏，说房、杜二人对朝廷不利。结果，李渊下令将房、杜二人赶出秦王府，并不许以后私见李世民。后来，太子党和秦王李世民斗争越来越激烈，李世民下定决心与建成、元吉进行最后决战，便秘密派人去召见房么龄、杜如晦入府商量大事。杜如晦化装成道士模样，随长孙无忌潜入秦王府。在众多谋士的策划下，武德九年六月四日，李世民率杜如晦尉迟敬德等一班亲兵亲将，发动了有名的“玄武门事变”，杀了大子李建成和弟弟李元吉，消灭了政敌，为李世民登上皇位扫清了障碍。


    李世民当上皇帝后，非常倚重房玄龄和杜如晦。房玄龄通晓政事，而且宽厚公平；杜如晦“剖断如流，深为时辈所服”。每当遇到大事，李世民先要询问房玄龄，之后房玄龄请李世民去再问杜如晦，杜如晦的回答往往是跟房玄龄的意思一样。“盖因房知杜之能断大事，杜知房之善建嘉谋。”这就是成语房谋杜断的来历。


    房玄龄和杜如晦跟着李世民从打天下到治天下，鞠躬尽瘁，勤勤恳恳。他们的干练深深受到李世民的赏识和信任。当时的监察御史陈师合曾奏上《拔士论》，说一个人不可担任几个职务，暗中讽喻房玄龄、杜如晦等人。李世民说：“房玄龄、杜如晦出来做官不靠别的，靠的是他们的才干可以参与治理天下。你想离间我们君臣关系吗？”然后，把陈的奏议驳回。杜如晦四十六岁时就死了。他得病时，李世民下诏书让皇太子去问候，并且亲自到他家去看望，话语梗塞。杜如晦死后，李世民痛哭不已，追封杜如晦司空官衔，赠谥号为“成”。'
  merge: -1
  img_proc: true
- pgno: 193
  md: 后来有一次，李世民吃瓜时发现味道好，就留下一半来祭奠杜如晦。李世民怀念杜如晦，曾送房玄龄一根黄银带，说：“过去杜如晦和您一同辅佐我，现在只见到您了。”说完，他又取出金带，派房玄龄送到杜家，并泫然流泪道：“世代带着黄银带，鬼神见它害怕。”又有一次，李世民忽然梦见杜如晦，第二天他向房玄龄说了这件事，并命令送自己所用的饭菜去祭奠。贞观二十三年，房玄龄老病复发。后来他的病逐渐加重，李世民接见他，对他流泪不止，玄龄也感伤悲咽得不能控制。李世民将房玄龄留在宫中疗养，如果他的病痛能减退，太宗就高兴得露出喜色；如果听说病情加重，就变得满面凄怆。后来，李世民皇上又亲自去探望房玄龄的病情，握手和房玄龄叙别，悲不能忍。
    房玄龄和杜如晦跟随李世民出生入死，治理江山，靠的不是别的，而是他们的才干。正如李世民所说，是因为他们的才手足以参与治理天下。李世民对房玄龄和杜如晦的厚遇，与其说来自于皇帝的赏识，还不如说来自于他们的能干。
    第二，忠心。古人用人大多讲德才兼备。光能干不行、如果对主上不忠，越是能干越是可怕。所以，在能干之外，还必须有一条忠心。更重要的是，这种对上的忠心必须被主上感知到。
    在李世民当政时期，著名的大臣魏征就是典型的忠贞不二的直臣。魏征原属太子派，在李世民和太子斗争过程中，曾经劝太子杀掉李世民。后来，李世民把他带在身边。魏征对李世民忠心耿耿，毫无二心。别看魏征貌不惊人，但是却很有胆识。见到李世民不对的地方，哪怕直言犯谏也不后退。魏征对大唐忠心耿耿，李世民也知道。所以，尽管魏征的话时常掷逆于他，也能够听得进去。一次，李世民得到一个很好的鹞鹰，爱惜得不得了，就把它放在胳膊上把玩。突然，魏征过来晋见，李世民怕魏征批评他玩物丧志，赶紧把它藏在怀里。结
  merge: -1
  img_proc: true
- pgno: 194
  md: '果，魏征奏完事退下后，鸳鸯竟死在怀里。类似的事情还有很多。尽管李世民多次对魏征大发雷霆，但是，李世民明白魏征提的意见是为了他皇位稳固，是为了大唐江山。所以，李世民非常重爱魏征。魏征死的时候，李世民登上禁苑西楼，遥望远方哭泣，并亲自撰写碑文，而且亲自把它写到碑石上。李世民常思念魏征，对大臣说：人们用铜做镜子，可用来整理衣冠。用历史做镜子，可以知道历代兴衰成败之道。用人做镜子，可以知道自己的得失。现在魏征死了，我失去了一面镜子啊。


    与李世民用魏征相同，赵匡胤用赵普，也是取其忠贞爱国。赵普对宋忠心耿耿，能够把江山大事当作自己的责任。曾经有一次，他推荐某人担任某个官职，但是赵匡胤不喜欢这个人，于是拒绝了。第二天赵普又奏请使用这个人。赵匡胤还是不同意。第三天，赵普还是奏请使用这个人。这下，赵匡胤生气了，撕碎了奏折，并把它扔在地上。赵普面不改色，跪在地上把撕碎的奏折捡起来带回家。过了些日子，赵普把这些旧纸片补缀好，又像当初一样拿去上奏。太祖这样才醒悟过来，最终使用了这个人。还有一回，一些大臣应该升官，但是赵匡胤讠庆这些人，不批准升官。赵普坚快地为他们请求，赵匡胤生气地说：“我就是不给他们升职，看你能把我怎么办？”赵普说：“刑法是用来惩治罪恶的，赏赐是用来报酬功劳的，这是古今都遵循的原则。刑法和赏赐是天下的刑法赏赐，又不是陛下的刑法赏赐，怎么能由着您的喜好而独断专行呢？”赵普的话大大惹翻了赵匡胤，他站起身来扭头就走。赵普就一直跟在他身边。赵匡胤进入宫中，赵普就站在门外，很久都不离开。无奈之下，赵匡胤只得同意。


    魏征和赵普之所以敢逆龙鳞，其根本原因，还在于他们是忠诚谋国的。而这一点，作为有道之君李世民和赵匡胤来说，又心知肚明。所以，尽管两人多次'
  merge: -1
  img_proc: true
- pgno: 195
  md: '和皇帝过不去，但考虑到他们的忠心，皇帝还是肯听的。假如换个为自己谋利而且又如此倔强的主，恐怕早就做了刀下鬼了。


    第三，和顺。任何主上，大多不喜欢批逆鳞者。大事坚持原则，小事保持灵活，以和顺为主，这是事上高手必须懂得的道理。在很多时候，无论是否能干，是否忠心，都需要借助“和顺”这个途径来赢得主上好感。如果让主上感觉浑身是刺，或者如鲠在咽，那么，如果不是遇到非常大度的主上，下场一般不妙。东汉和帝时期，宫里有个贵人叫邓绥。邓绥举止谦恭，小心翼翼，进退合乎礼仪，无论是伺候皇帝，还是侍奉阴皇后，以及与其他嫔妃相处，都能够克制自己，谦恭和顺。就是对普通的宫人、侍从、太监，邓绥也经常帮助他们，施恩于人。和帝对邓绥非常赞赏。


    邓绥有一次生病，由于和帝喜爱她，就准许她的母亲和兄弟入宫照料。邓绥对和帝说：“如果让外戚进来，别人就会记诛皇上偏私，而且会诽谤我说我不知足。”最后她推辞了。邓绥和阴皇后晋见皇帝时，她不敢正坐并立，走动时躬着腰，表示自己身份卑微，事事都谦让阴皇后，并且总是替皇后遮掩不足。和帝知道后，感叹道：“她修养德行的辛劳，竟然可以到了这个地步。”


    后来，阴皇后失宠，她见邓绥一天比一天受宠，就嫉妒地对人说：“如果我能够得意，我就不让邓家留下活口。”邓贵人听说后，悲伤地说：“我全心全意侍奉皇后，竟然得不到她的佑护。那我现在就死了吧，这样还不会连累家人，也省得让皇后因我而背负恶名。”但是，由于身边人的阻止，她才没有自杀。等到阴皇后被废黜以后，皇帝想立邓绥为后。邓绥推辞多次，也未获准，这才登上皇后之位。


    邓绥之所以能够成为皇后，在很大程度上是由于其德行昭著。而在她品行深'
  merge: -1
  img_proc: true
- pgno: 196
  md: '处，谦和恭顺，知道进退，这正是让和帝喜欢她的重要原因。


    # (2) 主无道，高足捷才者先登


    上面讲的是讲究事业的主上，还有一种贪图享乐、不思进取的主上，就需要转换方法。既不能愚忠，又要能够保发展。这里，需要个人根据情势，灵活应变，视不同对象采取不同的方法。孔子在《论语·先问》中写道：“邦有道，危言危行；邦无道，危言行孙。”这句话意思是，政治清明时，尽可以直言行正；政治昏暗时，行可正，但是言论就要圆滑一点。从权谋的角度来解释这句话，就是，碰到干事业的主子，要以正事之；碰到贪享乐的主子，要以奇事之。关于古人灵活事上的思想，历史上也有不少案例。


    第一，以物事人。有些好享乐的主上，虽然坐拥天下，也贪图享乐，纵情欲望。特别对于物质方面，需索无度。对于这样的主上，可以用物事之，以求进一步发展。


    隋朝时期，权相宇文述贪财好利，朝野皆知。有个小臣叫云定兴，他看准宇文述贪图财物的弱点，开始 Sveriges? 开始挖空心思谋求升迁。他的女儿曾经是废太子杨勇的昭训，曾经被赏赐一颗夜明珠。云定兴悄悄把珠子送给了宇文述，宇文述见钱眼开，立刻给云定兴安排了个好差事。


    云定兴知道宇文述贪财好利，每次过节，必定送给他一份厚礼。结果，云定兴赢得宇文述的好感。后来，他又了解到宇文述喜欢穿上奇特的衣服向别人炫耀。于是，云定兴开始挖空心思，多方求助，终于找人给宇文述设计了一个马鞯，并特意在后角上留下三寸空白，以露出白色。这样一来，宇文述立刻引起了许多人的竞相效仿，被时人称为“许公缺势”，受到人们的纷纷费扬。天气冷了，云定兴问宇文述，您到宫中值班一定冷吧。宇文述回答：“是呀。”于'
  merge: -1
  img_proc: true
- pgno: 197
  md: '是云定兴又让人给宇文述做了个头巾，非常好看。很快，人人们都开始仿效起来，并把宇文述的头巾称为“许公福势”。


    几个回合下来，云定兴通过大送特送，赢得了宇文述的好感；而且，云定兴送物得法，连宇文述自己都说：“云儿所作，总是能脱离俗套。” 云定兴正是靠着这些来博取宇文述欢心的。在宇文述的帮助下，他步步高升，很快谋得了好职位。


    第二，以欲事人。有时候，主上不仅有物质需求，而且也有很多的精神欲求。一般来说，作为主上，可支配的物质资源肯定超过下属。因此，对于主上，需要更多从精神层面入手。东晋时期有个官员叫殷仲文，极会迎合上司。有一次，刚刚篡位不久的皇帝玄所坐的床突然塌陷到地里。因为桓玄是篡位上来的，这一陷，可能意味着桓玄位子不稳。当时，群臣大惊失色，不知该如何是好。殷仲文从容地说：“恭喜陛下，您的圣德之深，连大地都快承载不动了。”
    桓玄听了之后，再一想，嗯，可能是那么回事，心道：“仲文小同志不错，可以重用。” 大臣们见殷仲文如此会说话，把没天大祸弥于无形，也都暗中舒了口气，但也暗骂殷仲文的无耻。就这样，殷仲文靠着自己的奉承之术，极力满足上司的虚荣心，不久之后，殷仲文就获得了重用并一路高升。


    第三，以乐事人。除了物质需要和精神需要，主上还有生活上的其他需要。如果能够雪中送炭满足之，则肯定能够获得青睐。唐武宗时期，大太监仇士良被封为骠骑大将军、楚国公，显赫一时。几年之后，他感到政治形势对自己不利，于是上表引退。临走前，他对身边的诸多宦官说：“诸位侍奉皇上，有兴趣听听老夫的意见么？”
    仇士良把握大权多年，当年权力之大，竟然逼得他的主子唐文宗流着泪说：“我这个皇帝比不上周赧王、汉献帝，周赧王、汉献帝，'
  merge: -1
  img_proc: true
- pgno: 198
  md: '他们是受制于强臣，我是受制于家奴。” 所以，听仇士良说完这话，在场的老宝官都纷纷表示愿意听听仇士良的高见。于是，仇士良诡秘一笑，对人们传授道：你们何候皇帝，绝不能让他闲着无事。要千方百计引导他纵情享乐，要经常变着花样与皇帝玩，使皇帝每天声色犬马，不学无术。这样，我们才能掌握大权。千万不能让皇帝读书，如果皇帝读了书，通晓古今，就会重用读书人，励精图治，那么还会我们的好日子吗？从仇士良的这番言谈来看，他确实是个深知事上玄机的太监。


    总之，事上之法，深奥难知，不可胜穷也。以正事人者久，以奇事人者暂。故，大多应以正事上，以奇应变。


    # 5、驭下之法


    事上和驭下既是相对的，又是相生的，三者道理有许多相通之处。只有懂得了事上，才能懂得驭下；懂得了驭下，就能更深刻理解事上的道理。在团队系统中，上级和下级的关系是任何一个层次的人都不能避免的。只有学会驭下，才能够带着一帮兄弟打天下和坐天下；不懂驭下，拙于驭下，则将骄兵反，势必一无所成。


    要学习驭下，先要弄懂什么是“下”。同事上一样，不同的下级，有不同的使用和对待的方式。要针对不同下级，灵活使用不同的驾驭之道。因此，先要对可用的下属做个界定。


    # (1) 可用之人


    第一，用能臣。在自己的团队体系中，有许多是非常能干的。对于能干之人，'
  merge: -1
  img_proc: true
- pgno: 199
  md: '要加以重用。因为不如此，则不能取得事业的根本性的进步。三国时曹操选取人才的标准就是唯才是举。他的手下不论有什么昭彰恶迹、卑劣行径，只要是人才，能够帮助他打天下，他就竭力网罗至身边。在重视下属才干的同时，古人还提出要从有德之人。作为“鉴于往事，可资于治道”的《资治通鉴》中就说道：“才者，德之资也；德者，才之帅也。”司马光认为，个人德行比才干更重要。他说，君子挟才以为善，小人挟才以为恶。因此，在用属下时，最好选择德才兼备之人，其次选择德胜于才者，再不济也得是才胜于德者。司马光的用人之术，为历代帝王将相所重视。


    我国一贯重视有才之士。上文提到的李世民用房玄龄、杜如晦就是一个很好的例子。古人的用才之道传之己久，早在奴隶社会就出现过“武丁用傅说”的典故。武丁是商朝的大王，他即位时商朝已逐渐衰落。武丁即位后，整整三年不说一句话，把所有的政务都交给大臣去办。三年之后，武丁突然对大臣们说：“我昨天做了一个梦，梦见上帝派了一个圣人来辅佐我。这个圣人住在傅岩这个地方，你们帮我我找看。”武丁详细地对臣子们描述了“圣人”的相貌和特征，然后命人到傅岩去寻找。使臣在傅岩一带找了好久，终于找到一个长相与武丁所说相同的人，叫傅说。不过傅说是一个奴隶，出身很低贱，恐怕不是上天说的“圣人”。使臣把傅说带回去后，武丁见了大喜，说：“这正是我要找的圣人啊。”于是，以很高规格礼遇傅说，向他请教天下大事。原来，武丁即位后，看到国力日渐衰落，非常忧虑；但是身边的大臣都很无能，没有真才实干。所以，武丁就暗自寻访了一个能够帮助他振兴国力的人。但是，这个人是个奴隶，在当时的社会架构中处于最底层，被人看不起。如果启用这样的人，肯定会遭到严重的政治阻力。武丁就想起“假托天帝”的办法，把傅说请来当'
  merge: -1
  img_proc: true
- pgno: 200
  md: '了宰相。在傅说的治理下，商朝内部实施了一系列改革，最终扭转了商朝的颓势，使商朝再度强盛起来。


    第二，用罪臣。在自己的团队系统中，有些人虽然也一直跟随自己，但是，由于某种原因，出现过这样或那样的错误。这时，如果不做太多计较，积极引导和使用他们，往往会产生意想不到的效果。二月河先生在《雍正皇帝》一书中曾经提到，康熙临终前曾罢免和关押了许多朝廷重臣。雍正对此百思不解。后来邱思道告诉他，这是老皇帝临死前为儿孙留下的一大笔财富。那些被老皇帝罢免了的人，一旦新帝登基，一纸诏书就能恢复他们的官职，这样他们就会感激涕零，从而赢得他们对新皇帝的感恩戴德和忠心耿耿。二月河写到的这个情节就蕴含着“使功不如使过”的道理。顺便提一向，在故事里，雍正
    how 分分地问邱思道，如果那些被罢免或关到监狱里的大臣，万一有个三长两短，岂不可惜？邱思道冷冷地回答，值此天下动荡之时，稳定江山为首要，死一两个人算得了什么？雍正这才明白过来，心里直呼父皇圣明。


    第三，用降臣。在自己团队系统之外，还会有敌对势力，或者第三方势力。随着自己实力的扩大，有可能把这些人吸收进来。对于降臣，当加以鉴别：如果可用，则大胆用之，则必可有所帮助；如果不可用，则大胆弃之，切勿养痈遗患。


    要做到放手使用降臣，非有大度量、大见识不可做到。当年春秋“五霸”之首的齐桓公之所以能够“九合诸侯，一匡天下”，就是因为他不计前嫌，能够大胆启用曾经和自己敌对的管仲。当年齐桓公和公子纠为了争夺江山，展开了激烈的争夺。管仲埋伏在齐桓公必经之路，趁其不备实施冷箭。齐桓公假装被射死，这才躲过一劫。后来，齐桓公当了大王，听从鲍叔牙的建议，不计前嫌，'
  merge: -1
  img_proc: true
- pgno: 201
  md: '大胆启用管仲。管仲见齐桓公如此大度，而且又对自己信任有加、极其重用，于是，死心塌地辅佐齐桓公。最后，在管仲的辅佐下，齐国国力迅速上升，齐桓公成了当时天下的霸主。


    # (2) 驭人之法


    驾驭下属，根据不同情况，有许多不同的办法。但是，万变不离其宗，驾驭下属主要需从物质上、精神上和组织上入手。


    第一，奖惩之法。奖惩之法主要依据的理论就是物质原理。常言道：“人为财死，鸟为食亡。” 面对利益，很少有不动心的；面对灾祸，很少有人不惧怕的。因此，顺之者，赏赐金钱权位；逆之者，剥夺财富甚至生命。以奖励来激发下属内心的热情，以惩罚来警诫约束下属的怠惰，这是通常的驭下之法。


    首先讲 Summe 之术。汉朝高祖时期，陈豨谋反。刘邦带兵前去讨伐。行至赵国，刘邦向赵国的相国周昌要几个能领兵打仗的将才。周昌好不容易找到几个人，都不怎么行，也根本就不会带兵打仗。刘邦见到他们，假装一副非常欣赏的样子，随便问了几个问题之后，就大度地说：“不错，给你们个将军当当。”
    事后，刘邦周国的人纷纷劝刘邦。他们什么功劳也没有，为什么就封赏为将军？刘邦说：你们只知其一不知其二啊。现在陈豨谋反，我无兵可用。只有赵国还有点指望。现在我大大封赏这四人，赵国人听说了一定会为我效忠啊。事实果然如刘邦所言。在平叛之战中，赵国军民确实为刘邦出了大力气。


    再讲惩罚之术。春秋齐景公时期，有人把著名的车事家司马穰苴推荐给齐景公。齐景公为了应对周边国家的威胁，就把司马提升为大将。司马说：“我出身微贱，如今让我当大将，恐怕别人会不服气。所以请大王派一名宦臣作监军。”
    于是，齐景公就派了庄贾作监军。司马对庄贾说，我们练兵的时候，请按时赶'
