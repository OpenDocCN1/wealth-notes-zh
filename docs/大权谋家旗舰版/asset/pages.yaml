  md: '【译文】霍光、张安世计议已定，便派田延年前去报知丞相杨敞。杨敞闻言又惊又怕，不知该说什么好，汗流浃背，只是唯唯诺诺而已。田延年起身去换衣服，杨敞的夫人急忙从东厢房对杨敞说：“这是国家大事，如今大将军计议已定，派大司农来通知你，你不赶紧答应，表示与大将军同心，却犹豫不决，就要先被诛杀了！”田延年换衣返回，杨敞夫人也参与谈话，表示同意霍光的计划，“一切听大将军吩咐！”


    【解析】在一个组织内部，经常会发生政治权力斗争，而组织内的绝大多数人，是没有资格形成自己的派系的，但是已经形成的派别会来逼你表态，如果你不会表态，那以后轻则边缘化，重则人头落地。


    本段材料里面西汉的宰相杨敞就遇到了这样的事情。


    杨敞这时候是丞相，在霍光当政的时候，一直被当做霍光的嫡系。


    霍光是当时掌握汉帝国军队的大权臣，权力大到几乎可以随便废立皇帝，用如日中天和一手遮天来形容都不为过。


    杨敞为人处世小心谨慎，也可能是因为没有魄力，所以霍光才敢于把丞相位置给他（因为丞相是文官领袖，照例是一人之下万人之上的），让他做自己的白手套。就是这样，在前几次霍光处理关键性问题的时候，杨敞似乎站位不稳。因为他没有明确表态，所以这次霍光派田延年来通知杨敞，就是霍光派人来进行火力侦查的。


    因为废立皇帝是一个风险极高的工作，在霍光派田延年通知杨敞的时候，首先，证明田延年和霍光的关系要比杨敞来的深入；其次，霍光也有点吃不准杨敞的站位，所以他要通过中间人来通知。


    不过因为霍光派人来通知杨敞，也一定意味着这件事情的知情面扩大了，为'
