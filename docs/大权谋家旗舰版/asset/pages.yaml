  md: '成部分，甚至有时候占了谈话最大的部分，通过寒暄，你可以探得对方的心情，了解到对方的想法，从而调整自己的说法乃至于做法，以达到最佳的效果。


    # 职场不懂站队，所有努力白费！那你站“对”了吗？


    有学员问到一个问题：他不知道怎么回事，就被领导排斥出核心圈子了，被边缘化了，还好自己有点背景关系，不然可能就会被开除了，问为什么会这样？


    我们先看一个事实，因为你原来还在领导的圈子里面，这点可以看出领导对你的能力是认可的，而现在突然把你打入冷宫，肯定是在有些方面你没做好，又或者说，你的一些缺点被人利用放大，其中最具杀伤力的就是你对有些事情的立场和领导不一致而被人告状，而领导往往也不会找你核实，先就把你一脚踢开了，所以你根本不知道你被干掉的原因。


    那有人就要说了，立场有那么重要吗？还决定了一个人的职场的生死存亡啊？答案是肯定的，因为立场代表了你是不是自己人，如果你的立场不在我们这里，那你对我来说就很危险，而立场也是区分职场派系的基础，派系的斗争往往是按照路线来，路线的基础也就是立场。


    不过本文的读者中如果你只是在基层，那不好意思，你还没有资格站队，你先做好你的本质工作，努力用业绩让上面的人注意到你。


    如果你能在基层脱颖而出，那就慢慢进入中层，进了中层，你才有资格站队，站队的第一个法宝就是交投名状。投名状是对你站队目标人物有非常的利益，同时能向对方表明自己已经堵塞了退路。


    通过交投名状获取初步的信任后，一般要做的是做领导的触角，随时汇报组'
