  md: '而齐王因为长久以来是生于深宫之中，长于妇人之手，对人性的险恶没有理解的那么深刻，对自己的处境的改变所引起的周围人的利益格局的改变也缺乏预见性，还是觉得自己是尊贵的齐王（甚至前面还称东帝），他的内心很难接受需要本来远远不如自己的人的接济，所以他虽然处境很不妙，但是还保持原来的思维模式和处事方式，这就给自己带来了很大的危险。


    如果齐王能及时转变思路，放低姿态，然后给出复国的具体方法，并承诺复国后，给卫国更大的回报，这样卫国在利益的驱使下，很可能会继续善待齐王。齐王没有想到这一点，所以卫国用攻击齐王来和齐王做切割，这样齐王急急忙忙再次出逃，别的小国看到这样的情况，也不愿意接纳他，这也是必然之势。这时候，楚国嗅到了机会，打着帮助齐王的名号，实际想浑水摸鱼，这招非常狠毒，因为是打着帮你的旗号，所以你很难拒绝，后来才发现是开门揖盗，到这时候其实已经追悔莫及了。


    就这样，楚国将领淳齿很容易就把齐王抓住了，这时候淳齿就历数齐王的罪过。这时候我们要注意，我们普通人讲道理是没人听的，要想让自己讲的道理别人听得进去。首先是自己要掌握权势，权势人物的发言就是真理，所以在这样的情况下，齐王也只能唯唯诺诺，可惜已经太迟了。


    从本段材料我们可以发现，我们必须随时能重新定义自己的位置，时刻关心形势变化所带来的相关人物、团体的利益格局的改变，通过这个位置和利益格局来调整自己的思维和行为，让自己能和周围的环境、人们的期许，尤其是能决定你命运的那些团体和具体的人物。


    所以儒家讲的伦理，背后隐含的意思就是说话做事一定要符合自己的身份，而这个身份可能随时在变，所以需要随时调整自己的说话做事的方式。也是春'
