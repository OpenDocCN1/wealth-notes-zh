- pgno: 39
  md: '成功者对失败者一般都是要痛打落水狗的，所以必须要抹黑他们，而抹黑他们最重要的一个方法就是把他所用的权谋手段揭露出来，让大家觉得他很黑暗。反正他现在也已经丧失了话语权，无力反击，所以对失败者的妖魔化的重要一环就是对失败者使用的权谋方法进行妖魔化。不过对于我们外人来说，就形成了一种权谋是黑暗的感觉，而且权谋和失败挂了勾，仿佛只要用了权谋，就一定失败，一定没有好下场。这样就尽可能不让其他人再用权谋手段给成功者造成实质上的威胁。


    # 二、对成功者的洗白


    所有的成功者，都不可以把权谋的标签贴在自己身上，不然人家会怎么看他，他还怎么工作。所以成功人士几乎无一例外都把自己所使用的权谋手段深深隐藏，粉饰自己，漂白自己，最好让自己的成功装扮成一种天命，一种不可抗的意志，所以一定要和权谋划清界限。对于这样的装饰，就算暴露了也可以说成功者不遭谴责，失败者没机会申辩。我们不能听成功者怎么说，而是要看他怎么做的，这样你才能知道，就是那些成功者，无一例外都是用的权谋手段，换句话说，不管成功者还是失败者，其实大家都是权谋家，而抹黑权谋也是成功者最大的权谋手段之一。


    # 三、大家用的都是权谋


    仔细看历史和现实，所谓的正邪两派，几乎都是用的权谋，因为资源和位置就那么多，离开斗争，你就能得到位置和资源？要斗争就离不开权谋，使用权谋后，就只有成功失败之分。因为当时每个人、每个派别的势力、能量不一样，加上有时候对条件的错判，就会产生成功和失败者，而实际上大家都是用的一本权谋秘籍，只是不方便说出来而已。'
