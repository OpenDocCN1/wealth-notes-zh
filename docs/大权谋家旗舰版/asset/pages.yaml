  md: '既得利益者一般是接近领导位置的那些中层，在原来的领导下面如鱼得水，形成了自己的既得利益，而新领导上任，往往就要拿这些人开刀，因为他们很容易变成自己新路线的绊脚石，因为新路线代表了利益的调整，必然会触动这些既得利益者的利益，所以必须先处理他们。譬如在《人民的名义》里面，沙瑞金一上台就冻结了前任赵立春准备提拔的干部名单。


    # 二、扶持失意派


    新领导利用组织内失意派长久以来形成对既得利益者的仇恨，通过扶持失意派，自然就会让他们去打击既得利益派，这样自己可以超然，做仲裁者，看似不偏不倚，其实通过别人之手，达到自己的目的。


    # 三、推行新路线


    当人员调整差不多了时候，形成自己的班底后，新领导才可以推行自己的路线，不然下面的人就会阳奉阴违。而只有推行新路线，才能体现新领导的新价值，做出新政绩！为自己进一步高升打下基础。


    在新领导的这个思维模式和做事方式下面，老下属应该怎么做呢？


    往往喜欢标新立异的新领导都是空降过来的，这时候他是势单力孤的，所以他特别需要找寻自己的支持力量。在这样的情况下，如果你原来是失意派，那你的机会就来了，想方设法为新领导的新政策摇旗呐喊，利用工作上对领导的支持靠近新领导。当然，说得再阴暗一点，那可能就是给新任领导提供得意派的历史把柄，借新领导之手打击对方，自己获得实利。这就是改变你职场命运的最佳机会。'
