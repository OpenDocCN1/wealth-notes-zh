    # 曹丕用了什么权谋手段，千钩一发之际在曹操虎口抢下甄宓？


    # 《三国演义》精讲


    【三国演义故事情节】曹操到了袁府门口，看到有人竟敢违背军令，擅自闯入袁府，非常疑惑。当得知是自己大儿子曹丕后，便怒气冲冲地进去要弄个明白。


    曹丕见父亲进来，赶紧对自己违抗军令认错，不等父亲追究责任，就叫那两个妇人出来见曹操。原来他相中的是袁绍二儿子袁熙的媳妇甄氏。曹操端详了一会，还没明白是儿子给自己相中的媳妇，只让他好生照料，爱咋咋地，然后转身就要离开。这时袁绍妻子刘氏叫住曹操，提出非曹公子不能保全他家，要将甄氏嫁给曹丕为妻。甄氏节烈不答应，让曹操赐死她。曹操思量了一会才回过神来，这样的贞节女子，不正可以做自己的儿媳妇吗？于是只说了一句这真是我的儿媳妇啊就走了，就这么愉快地答应了这门亲事。


    【解析】本故事是三国演义中绝大多数人容易忽略的一个片段。曹操想据为已有、曹植魂牵梦绕、却被曹丕先声夺人，让曹氏父子神魂颠倒的甄宓到底是什么样的美人？'
