    26 岁背井离乡闯荡江湖开始，早ion就把一切人伦情欲放在脑后，因此，他早就超脱了感情的束缚，纯从功利的角度看待权力斗年-就如同一个冷血的高手，在竞赛中从不会感情冲动，从不会意气用事，而是死死盯住权力，一切围绕权力，以权力为生命，以权力为亲人、为爱人、为知己。这样的人，已经超出了一般意义上的人，而变成了一个真正的“政治人”，从另外一个层面
    patik，李斯作为外籍臣僚，一步步从底层借着种种因缘际会爬到了丞相高位，金钱、地位早就不是他所挂念的东西了-有了权势，自然就有了金钱和地位。但是，权力，则是他的生命，是他念兹在兹无时忘之的东西。如果要夺走他的权力，那么，他的金钱财富，他的名望地位，统统玩完，而且，他的政治理想，他的权力欲望，也就飞花逐水不复返了。所以，就李斯来说，他能够超脱亲情、爱情和友情，不为这些所左右；他能够超出金钱、地位的限制，不为这些所操劳。然而，他却超不出权力对他的限制，超不出对权势的喜爱和执著-正是这种执著，成就了他；也是这种执著，毁灭了他。佛说，佛法如舟，到岸见弃。我们参详佛法，绝不能执著于佛法；等你真正放弃了佛法，把它视为狗屎垃圾的时候，你才真正能参破佛法，见性成佛。这其实是更高层次的智慧“空”的智慧，直指世界的本源；当然，也直指权力的本质。就权力来说，当一个政治人视权力为生命的时候，那么，他定能追逐到她、得到她、占有她、享受她。这是必然的结果。然而，追求权力和保有权力并非一回事。凡事你越是在乎，越会失去；越是执著，越是虚无。不经过大风大浪大苦大难，是无法悟透这一点
    的。历史上那些玩弄权术的狠辣角色，
