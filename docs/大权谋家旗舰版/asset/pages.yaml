  img_proc: true
- pgno: 249
  md: '老天要让宋仁宗掌权的一种意志，对增强刚继位的宋仁宗的权威性有非常重要的作用。而如果你提前祝贺，于公就是类似于拥立之功，于私也至少让皇帝对你很有好感。


    就在这样的一篇颂扬之声中，有人出来进谏了，我们注意御史鞠<|start|>就出来泼了冷水，说出现在一连串的内忧外患。他说的很对，但他让大家都很扫兴，不仅仅是扫兴，他还在(props)这里得罪了两个方面的势力：


    # 三、朝臣的势力


    朝臣都在阿谀奉承、歌功颂德的时候，你出来大放厥词，极大否定了你的同事故意的意见。虽然他们在当时一时很难拿你怎样，但是他们都会把你当做了眼中钉，等到时机成熟，再想办法把你搬倒。


    # 四、皇帝宋仁宗


    宋仁宗本来被大拍马屁的情况下，心情很好，说不定已经在做着亲政的美梦了，被鞠诅这样一说，顿时觉得一盆冷水从头浇到尾，而且还会从基础上动摇了宋仁宗亲政的合理性。宋仁宗必然对鞠诅就没有WM好感，所以日后在大臣们的鼓噪之下，宋仁宗就很容易把鞠诅处理了。


    所以，在进谏的时候，如果你不分场合，你越对，那得罪的人就越多，就算这就是你的职责范围。


    那你要进谏，又不得罪皇帝和同僚，他需要怎么做呢？


    # 一、单独进谏


    寻找和皇帝单独对话的机会，因为在私下场合，同事们都不在场，所以他们就不容易知道，而且私下场合，领导也没有面子的问题，所以相对的，你进谏的那些后遗症就没有了，同时也达到了进谏的效果。当然进谏的时候，一定不'
  merge: -1
  img_proc: true
- pgno: 250
  md: '要有其他人在场，不然有人就容易用这个进谏的内容来挑拨离间。


    # 二、密上奏章


    上奏章这个是更加保密的，只能让皇帝开启的那种奏章。历史上，奏章内容也必须保密，所以古代大臣上奏章的时候，都把底稿全部烧掉，就怕奏章内容泄露，被自己的政治对手大做文章，在同事之间挑拨离间，可见保密的重要性。


    进谏的内容首先都先要肯定这个祥瑞对领导的正面意义，再谈怎么消除当下的弊政，而且这些弊政都是因为不是皇帝亲政所造成的，给皇帝亲政提供更多舆论上的合理性和合法性。


    当然，鞫诏这样做了，其实变相的给刘太后撑腰。既然当众进谏的事实不可更改，那就想办法把这个进谏的信息透露给刘太后，让自己站队到刘太后这边，这个也有个大靠山，自己不容易被皇帝和同事干掉。


    所以，职场上进谏是非常不容易的，一不小心就得罪一大片。秘密进谏，消除进谏的副作用，站在领导的立场上，为领导的公私两方面的利益服务，这样你必然前程似锦。


    # “伴君如伴虎”，为什么领导总是那么难伺候，怎么破解？


    导读：职场上很多人都抱怨领导难伺候，一不小心就犯了领导忌讳，而自己还不知道原因，更不知道怎么调整就被打入冷宫，丧失了进步的机会，那到底应该怎么做才能避免发生这样的情况呢？


    【资治通鉴原文】田单相齐，过淄水，有老人涉淄而寒，出水不能行。田单解其裘而衣之。襄王恶之，曰：“田单之施于人，将以取我国乎！不早图，恐后'
  merge: -1
  img_proc: true
- pgno: 251
  md: '之变也。” 左右顾无人，岩下有贯珠者，襄王呼而问之曰：“汝闻吾言乎？”对曰：“闻之。” 王曰：“汝以为何如？” 对曰：“王不如因以为己善。王嘉单之善，下令曰「寡人忧民之饥也，单收而食之。寡人忧民之寒也，单解裘而衣之。寡人忧劳百姓，而单亦忧，称寡人之意。」单有是善而王嘉之，单之善亦王之善也！”
    王曰：“善。” 乃赐单牛酒。后数日，贯珠者复见王曰：“王朝日宜召田单而揖之于庭，口劳之。乃布令求百姓之饥寒者，收谷之。” 乃使人听于间里，闻大夫之相与语者曰：“田单之爱人，嗟，乃王之教也！”


    【翻译】田单出任齐国国相，有次路过淄水，见到一个老人渡淄水时冻得直哆嗦，走出水面时已不能前行。田单便解下自己的皮袍给他披上。齐襄王听说后十分厌恶，说：“田单对别人施恩，是打算夺我的国位，我不早下手，恐怕以后会有变故！”
    说完一看左右无人，只在殿阶下有个穿珠子的人，襄王便召他过来问道：“你听见我的话了吗？” 回答：“听见了。” 襄王问：“你觉得怎么样？” 回答说：“大王不如把此事变成自己的善行。大王可以嘉奖田单的善心，下令说：‘我忧虑人民的饥饿，田单就收养他们，供给饮食；我忧虑人民的寒冷，田单就脱下皮袍给他们披上；我忧虑人民的操劳，田单也因此忧虑。他正符合我的心意。’田单有善行而大王嘉奖他，那么田单的善行也就是大王的善行了。”
    襄王说：“好。” 于是赏赐田单酒宴。过了几天，穿珠子的人又来见齐襄王说：“大王应该在群臣朝见时召见田单，在殿庭上致谢，亲自慰劳他。然后布告国内寻找百姓中饥饿者，予以收养。”
    襄王这样做后，派人到街头里巷去探听，听到大夫等官员互相说：“哦！田单疼爱百姓，是大王的教诲呀！”


    【解析】易经有个“履”卦，其中九四爻辞：履虎尾，愬愬终吉。也就是说，'
