- pgno: 209
  md: '的亲戚关系而投靠了吕后，这样才当稳了丞相。如今吕后一家猖獗无状，得罪天下而不知收敛，一旦吕后死掉，肯定会有人出来收拾他们。那时候，自己肯定会受到牵连。登高而料远，这正是陈平的过人之处。


    陆贾见陈平吐了实话，就说：“如果要想天下安定的话，那么就得看丞相有无才能；如果天下处于危难之中，就得看将帅有无能力转危为安。将相团结，朝廷士大夫就会结合在一起。那么，即使有什么变故，也不至于大权旁落。现在，国家的前途，就掌握在你们文武大臣的手中了。我曾向太尉绛侯周勃说明了这一情况，但周勃一向和我说笑惯了，以为我在和他开玩笑。你为什么不跟太尉建立起友谊，与他交往交往呢？”


    陈平听了深以为然，就采取了陆贾的计策，用五百斤黄金向周勃祝寿，并大办宴会和周勃畅叙交情，周勃当然也以同样的礼节回报丞相陈平。这样，两人结成了深厚的友谊。后来，吕后去世，陈平和周勃一起，把吕氏家族的显宣从台上赶下来，派人分头逮捕了吕氏男女，不论老少一律出斩。然后，迎立了新皇帝，是为文帝。陈平和周勃继续掌大权、享富贵，并没有因为朝廷更换新君而遭殃。


    上述几个案例展示了人们结交的基本动机- 当有共同益处时，人们会自动走到一起；当遇到共同敌人时，人们也会自发联合起来进行抵制。利益相同，志趣相同，就能够结交更多的朋友，从而在社会竞争中增强自己的实力。


    结交之法有很多，大致可将其分为以下三种方法：


    # 第一、广交。


    广泛结交就是要尽最大可能得结交人脉。众所周知，社会竞争异常复杂，人与人之间往往有着千丝万缕。因此，广泛结交人脉，积极构筑对上、对下和平'
  merge: -1
  img_proc: true
- pgno: 210
  md: '级之间的良性关系，这有助于迅速打开局面。


    隋朝末年，有个地方官叫王世充。他看到隋朝天下动荡不安，于是就开始打自己的算盘。王世充当时管辖江淮一带，而此地之人民风彪悍，不守法制，经常寻衅滋事。王世充对于这些人，不仅不加问罪，而且利用自己的职权，暗中把这些人都放了出去。如此一来，王世充赢得了当地许多“强梁”的好感。


    后来，隋末农民起义席卷全国。王世充决定趁机招兵买马，伺机而动。他的如意算盘是，在天下混乱的时候，先拉起一支队伍，等到天下形势有变的时候，再决定个人的发展方向。于是，王世充开始招兵买马。以前受过他恩惠的人听说之后，都纷纷赶来报效，很快，王世充就拉起了一支一万多人的彪悍的队伍。王世充依然坚持广泛结交、收拢人心的原则，把每次战争得到的财物全部分给了士兵。于是，士兵们都说：“不替这样的人卖命，那还替谁卖命？”结果，不长时间，王世充的队伍就迅速壮大起来，他也成了隋朝军队中耀眼的一颗新星。


    # 第二、善交。


    结交之法，重在数，贵在量；重在多，贵在精。一个人的精力是有限的，不可能广泛结交到所有的人，因此，必须为了实现某些目标而重点结交某些关系。换向话说，就是要提高结交的效益。这就要求人们，要善于交往，善于结交那些有用之人。


    王莽新朝的末年，天下动荡不安。各地农民起义此起彼伏。当时，在河南有个大财主叫李通。他为了在乱世中自保，经常和诸路豪杰交往。后来，他判断王莽的天下已经坐不稳了，就我他弟弟李铁来南量说：“我们要举大事，需要找刘氏为首领。”经过仔细研究和多方对比之后，他们认为河南一带只有刘伯'
  merge: -1
  img_proc: true
- pgno: 211
  md: '升、刘秀兄弟最有才干，也最有前途。于是，李通开始重点结交刘秀。李通见到刘秀后，对刘秀表示，要专心辅佐他做一番事业。他说： “在百姓中间流传着一则谣语，说
    ‘刘氏复兴，李氏为辅’ ，老天让我们共同成就大事，我一定好好辅佐你。” 之后，李通拿出自己的财产帮助刘秀起事。经过一番角逐之后，刘秀当了皇帝。刘秀拜李通为大司空，位居百官之首。李通在乱世中结交刘秀，不仅为自己的未来铺平了道路，也对刘秀夺取江山起到了重要作用。


    # 第三、慎交。


    结交之法，有许多要则需要注意。因为交友不慎，可能祸患无穷。历史上有许多因为结交而成仇的故事。西汉时期的陈余和张耳，就是因为结交失误而终生成敌。而且，一般来说，结交不能过于亲密，过于亲密往往会走向反面；结交不能过于疏远，疏远的关系就会渐渐淡化甚至消失。更为重要的是，结交之法重在
    “广交新朋友，不忘老朋友” 。就是说，一方面，要拓展自己新的人脉；另一方面，要刻意维护自己既有的人脉。当然，人是会发展的，需要根据不同的情况对自己的人脉作出新的梳理和调整，但是，新老朋友的处理问题确实是很关键。如果结交不得法，反而会被自己结交的朋友、领导或部下所误。


    秦朝末年，陈胜当上了陈王之后，就对自己的乡亲故旧开始冷落起来。陈胜刚开始起兵时，他还比较记挂当年一同种地的朋友；等到当上了陈王，就开始讲起了排场。陈胜老家的人来拜访他，他的熟人也经常在王府出入，大家都比较随便，经常相互谈论起陈胜的往事。有人就对陈胜说：
    “大王，你的这些熟人都愚蠢无知，经常胡言乱语，会降低您的威信。” 陈胜听了觉得有道理，就把议论他的熟人给杀了。结果，陈胜过去的熟人都离开了王府，此后，陈胜再也没有亲近的人了。陈胜胸怀大志，也有一定的才能，但是，陈胜结交乏术：'
  merge: -1
  img_proc: true
- pgno: 212
  md: '他的将领们攻占土地回来，凡是不合陈胜命令的，就立刻逮捕。这样的办法，直接导致了陈胜与诸将领离心离德。


    最后，陈胜死在了他的马车夫手里。司马光编《资治通鉴》也认为，陈胜之所以失败，其中的一个主要原因就是将领都不亲附他；对比从亭长起身尽收英雄而王天下的刘邦故事，人们可以发现，陈胜之所以出现这种失误，其重要原因全在于陈胜结交之法不正确。'
