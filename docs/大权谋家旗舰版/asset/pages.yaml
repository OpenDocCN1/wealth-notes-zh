  md: '织内的动向，有人就会说了，你这不是小人告密么，没错，告密也是站队的核心方法。


    最后，在公开的场合要对领导表示绝对的支持，尤其是在有争议的时候，你要敢于出头，吸引反对者的攻击矛头，让你的领导隐藏起来，来做观察和平衡。这样领导必然会觉得你好用，立即你就会进入对方的核心圈子。


    回到学员的问题，他很有可能被人引导或者说是引诱说出了一些不符合领导立场的话（因为同情、感情、共鸣等因素），而这个话肯定还被人添油加醋的在领导面前重新演绎了一番，所以在职场上，要提高政治敏感性，能不发表意见就不发表，因为你不知道你的话，会被别人怎么利用和解读，既然你已经到了中层，那竞争也会越来越隐蔽化，打击也会越来越常态化。


    # 职场上下属操纵领导的最高妙手段大揭秘？


    【资治通鉴原文】癸酉，仇士良以左卫上将军、内侍监致仕。其党送归私第，士良教以固权宠之术曰：“天子不可令闲，常宜以奢靡娱其耳目，使日新月盛，无暇更及他事，然后吾辈可以得志。慎勿使之读书，亲近儒生，彼见前代兴亡，必知忧惧，则吾辈疏斥矣。”其党拜谢而去。


    【翻译】癸酉（十六日），仇士良以左卫上将军、内侍监的职位退休。他的党羽送他返回家中，仇士良教给他们保持权力和恩宠的秘诀，说：“对于天子，不能让他有闲暇的时间。应当经常变换花样，供他游戏玩乐，以便沉湎于骄奢侈靡的生活之中，无暇顾及朝政。这样，我们才可以得志。千万不要让他读书，亲近读书人。如果天子喜爱读书，明白了以前各个朝代兴亡更替的经验教训，'
