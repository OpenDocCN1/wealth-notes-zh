  md: '到。庄贾答应了。可是，到了第二天，庄贾喝得大醉，等到操练完毕才赶来。司马立刻下令将其斩首。庄贾吓得赶紧派人去找景公求情。可是，司马已经赶在景公命令到来之前就把他杀了。后来，景公的使者来到军营，说景公要赦免庄贾。司马说：“我已经把庄贾杀了。”说完这话之后，司马紧盯着使者，说：“按军法，骑马闯军营者要斩首。”吓得使者急忙求饶。司马下令将使者的随和坐骑杀掉，以做效尤。这样一来，全军上下顿时一新，从此军令就畅通无阻了。司马的这个方法，跟《三国演义》里提到的曹操割发代首实有异曲同工之妙。


    第二，立信之法。主上对下属的驾驭，不能仅仅停留在物质控制这个较浅的层面，更重要的是要深入到精神层面去。在这里，最重要的就是要立信。古人云，人无信而不立。同样，主上无“信”，则下属不服也。


    迷信之术：这个方法，就是通过大造声势，大造自己神圣的面目，使得属下对自己产生精神的信仰和依赖。古人常常运用“借尸还魂”这一招来打造自己的品牌，而借助的手段多是迷信之法。借助迷信的方法驾驭控制下属，这个方法在历史上比较常见。从陈胜吴广的借鬼神起义，到刘邦斩白蛇起义，一路数下来，历史上不少这样的典故。东汉光武帝刘秀在起义之时，为了使部下对自己死心塌地，而且为了延揽更多的英雄，他特地派自己的同学强华伪造了《赤伏符》来造声势。《赤伏符》写道：“刘秀发兵捕不道，四夷云集龙斗野，四七之际火为主。”按这个《赤伏符》的解释，刘秀是要当皇帝的。果然，部下们得知这个消息，都非常高兴，感觉自己也有了盼头，纷纷劝刘秀称帝。刘秀也就借此机会，名正言顺登上了皇位。


    威信之术：因为主上在一定程度上决定着下属的发展，所以，一般来说，主'
