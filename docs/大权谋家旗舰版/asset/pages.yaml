- pgno: 318
  md: '几乎不可能。也许人们私下里都在设想自己是“上级”吧，所以人乐意钻研“领导学”，却不屑研究“下级学”。其实如何做好下级的学问才更加高深，试想，现在世上有六十多亿人口，又有几人不
    steeds 不是别人的下级？虽然没人明里研究，但做下级大有学问却是客观存在的事实，道理很简单，不会做下级的人根本就没有做上级的机会。


    我是局长，在局里说一不二，威风八面。但是，我深知，对上级来说，我永远是下级。下级的命运永远掌握在上级手里。要得到上级的赏识和重用，就必须当好下级，这是最简单的道理。如何当好下级，是一门大学问，是一门十分重要的学问，一辈子都学不完呀。


    我很听话，对上级绝对服从。什么是下级？我理解，下级就是服从，下级就是听话，下级就是上级的走卒。所以，我当下级最基本的原则是听从指挥，服从领导，上级让我咋办我就咋办，我把上级的活当成圣旨，当做金科玉律，决不违背。我绝对相信和支持上级，我的座右铭是：上级永远是对的。上级给我部署工作，我的回答总是立即行动、全力以赴等；上级指令我停办什么，我总是说，坚决执行、认真照办等；上级提出了某某口号，我会把口号喊得震天响；上级提出什么倡议，我会组织全员轰轰烈地全力跟上。我清楚，上级最需要的是维护权威，上级指令和要求的事情，你不办，说明你目无上级，藐视领导，上级的权威也就无法落实，也就有损于上级的形象，上级不恨死你才怪呢。让上级恨你，你的日子还会好过？我才不那么傻呢。


    当下级的，最忌讳的是装聪明，充好汉，对上级的部署和命令指手画脚，吹毛求疵，说三道四，结果是聪明反被聪明误。我有一个朋友在一个不错的单位任一把手，他各个方面能力、素质都很优秀，可是，他有一个毛病，就是爱对'
