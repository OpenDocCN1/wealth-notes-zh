- pgno: 257
  md: '相当于我失去了对你的掌控，所以说不定他参了密折，让皇帝对杨及的感觉很差。


    # 三、同僚的嫉妒


    同僚、尤其是 Ward 有竞争关系的同僚，他们都是看不得你进步的，所以他们有潜在的想拖你后腿的动力。在行为上，就可以用曲解你的做法，重构你的动机，让领导误解达到打压你的目的。


    既然现在杨及的做法存在这么多问题，而结果也证明是很有问题的，那如果杨及怎么做比较好呢？


    # 一、用政绩向领导靠拢


    一般而言，对高自己几个层级的领导，你用私人的关系方式靠近，是有风险的。所以，比较牢靠的，就是仔细研究领导所倡导的方针政策，在自己的控制范围内落实，做好试验田，形成经验，并上报皇帝，皇帝看到，一定会对你留下深刻印象。


    # 二、委托上司来送


    如果你还是要送礼，那就委托上司，或者至少提前告知自己的上级，让他知道并能获得他的支持，同时必然你在礼品里面给他很厚重的一份。譬如给皇帝的是象征性的，给直属领导的礼物可是要用沉甸甸的利益。


    # 三、收买皇帝身边人


    如果你真的想要升官，那必须搞定的领导身边的人，譬如朝中皇帝秘书，后宫受宠妃子，太监等等，让他们平时帮你吹风说好话，达到润物细无声的效果。这样慢慢就对领导起到作用，你就受益了。当然，这个代价是不菲的。


    杨及在历史上就出现了这一次，代表他投机已经失败，也是追求上进人的一'
