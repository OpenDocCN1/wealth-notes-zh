    这两句话，看似柔和，其ʉ刚劲。我们现在慢慢分析，就已经看出了这两句话如同包着橡胶棒的凶器，柔和的外表之下包裹着呲呲杀气。想那李斯已经位居丞相，换句话说就是当时政局的既得利益者。如果政局动荡，首当其冲的是危害到他的既得利益甚至人身的安全，是可忍熟不可忍！不过这赵高也不是一般人，身居高位，辅佐胡亥，也不能轻易得罪，因此，李斯虽然认为赵高有僭越之嫌，举丧国之策，但他也并没出言斥责，反倒从规劝赵高注意白身安全避免祸患的角度，来回绝了赵高的建议。我们今天看李斯的这两向话，平平淡淡，实则向向皆有所指；貌似替对方考虑，实则是巧妙拒绝对方的推托之词。这一招，就如同打太极的高手，轻轻柔柔，绵里藏针---一代高手，信夫。


