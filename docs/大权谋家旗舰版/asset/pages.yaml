- pgno: 292
  md: '造就成至高无上的主宰。


    权利权利，权和利是紧紧连在一起的，有权才有利。


    在现实社会中，你只要是人，就时刻处在权力的制约中；天下没有顶天立地的人，没有漫无边际的人；而权力却是无所不在的。


    所以，我们没有任何理由去摆脱权力的制约，更没有任何理由去蔑视权力的存在。但权力又是一个非常有弹性的东西，你自身的权力大一分，制约你的外在权力就少一分；如果除了自然人的基本权力外，任何权力都没有，那就处处受他人权力的制约，那就是生活在社会最底层的老百姓了。


    只要你是生活在现实中的人，你对权力和权贵的藐视和不屑都是暂时的，或者一时的；而永远伴随你的，必然是你终身对权力的顶礼膜拜。人们为了改变自己的命运的最有效的方式，就是充分利用各种途径去获得权力，壮大自己作为个社会角色的综合力量，从而更快达到自己的目标。


    # 职场命运一线间！新任领导私下找你谈话，怎么应对？


    私下里有很多朋友问到了一个问题：我们是国有企业或者是体制内的，新老领导交替了，新任领导私下找自己谈话，自己不知道如何应对，进退失据，找不到重点，最后被排除出领导的圈子，自己也不知道到底是怎么回事；对于新领导的谈话，老员工到底要怎么应对？


    我们从著名的官场电视剧《人民的名义》着手，自从沙瑞金作为新任省委书记来到汉东省，面对前任书记赵立春三十年经营留下的铜墙铁壁，他是怎么一步步破局、从光杆司令找到支持力量的？其中对于汉东省委常委，京州市委书'
  merge: -1
  img_proc: true
- pgno: 293
  md: '记李达康的敲打和争取是至关重要的，因为李达康曾经是前任书记赵立春的秘书，所以沙瑞金的 primera 感觉肯定是觉得李达康不会和自己一条心。所以，沙瑞金通过前期的调研，利用各种小人物（小人物和小对现任官都有怨气）和小道消息（小道往往比正道更真实），了解班子成员的各种潜在问题，有选择得用了多种方法来敲打李达康。


    # 一、李达康妻子（前妻）欧阳菁受贿


    欧阳菁作为城市商业银行副行长，收受了五十万的贷款相关的贿赂，被主角侯亮平的反贪局盯上。这个案子，很难说不是沙瑞金授意的，因为你身边人有违法行为，领导就利用这个来对你采取措施，如果你不知道怎么做，那后面就通过瓜蔓法把你牵连进去，如果你识相，站队到我这里，那案子到此为止，你想怎么选择吧？


    # 二、李达康用自己的公车送欧阳菁出国


    如果说，欧阳菁的受贿，李达康还能以不知情，已经离婚了这个为借口进行切割的话，那李达康利用公车来送欧阳菁出境这个行为，毫无疑问是李达康自身违纪的重要的证据，而且此事因为主角侯亮平的高速公路拦截，闹得满城风雨，沸沸扬扬。李达康已经无法遮掩。


    # 三、京州信访窗口问题


    京州市低矮的信访窗口，给信访人员造成了很大的不便，在此之前，李达康得知情况后，已经要求信访窗口所在的光明区进行整改，只是光明区长阳奉阴违，只做表面文章，导致于省委书记突然驾临时候，李达康措手不及。而沙瑞金就是需要找到李达康任内的行政问题，从宏观来看，这不是什么大问题，但是如果上级领导过问了，那可能就是大问题，而且是能大能小，关键看领导怎'
