    # “冤假错案”翻案的难点有哪些？(违禁文章)


    【续资治通鉴原文】辽有司获盗八人，皆弃市。既而获真盗，八家诉冤，中书令张俭再三申理，辽主勃然曰：“卿欲朕偿命邪！”俭曰：“八家老稚无告，少加存恤，使得收葬，足慰存殁矣。”辽主从之。


    【翻译】有一次，官府捉住了八个盗贼，已经斩首之后，才又捉拿到真正的犯人。被斩首者的家人申诉冤屈，张俭接连三次请求审理。辽兴宗大怒说“：你难道想要朕偿命不成？”张俭说“：八家老小冤苦无告，如果能稍稍加以存问抚恤，使他们能够收尸下葬，就足以安抚活着和死去的人了。”辽兴宗于是听从了他的建议。


    【解析】不管在官场还是大企业的职场里面，冤假错案很难避免，因为其中牵扯很多人的利益在里面，而就算冤假错案已经暴露出来后，你要翻案也是很困难的，为什么会这样？在弄清这个问题之前，我们先要看看为什么会产生冤假错案的。


    冤假错案的问题究竟是怎么产生的呢？'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 一、政绩需要


    一般一个社会影响面大的、或者涉及到更高官员的案子，都有快速破案的压力，因为时间的紧张，所以证据就不会那么调查充分，如果能快速查清并定案，无疑有很大的政绩。


    # 二、栽赃需要


    为了掩盖真正的凶手，当然这里面可能涉及到一些内幕交易，所以需要隐藏真正的作案人，所以必须找出背锅侠和替罪羊，正好有证据能和你有关联，那再想办法制作其他证据，把证据坐实就可以完美过关了。


    # 三、权力介入


    有时候因为政治斗争需要，上级领导已经把案子定性了，而下面的办案人员就只能按照上面的意思来断案，这样就容易引发冤假错案。


    而在实践中，往往栽赃和权力介入交织在一起的，下面的办案人员为了唯上，都会按照上面的意思来办案，而且会让本单位更多的人签字，签字代表这些是大家的共同意见，这样加大了后期翻案的难度。除了这点之外其他还有很多方面的因素在阻碍翻案：


    # 一、影响官员的前途


    如果案子被翻了，势必上面要追责，那追责的话，必然会影响相关案子参与人员的前途，所以这些人必然会拼命反对翻案。所以如果你作为栽赃陷害的受害者，就算你要翻案，也不要强调追责，而只是要翻案，最好还要能提供一个台阶给原来的判案人员下。


    # 二、自我打脸、权威受损


    从整个司法机关乃至于公权力，都会因为这样的翻案而权威受损，这就相当'
