  md: '和自己的表现、领导身边人的谣言有关，这就需要从和领导的私人关系着手，注意，这时候不是临时抱佛脚，而是平时慢慢的来软化坚冰。


    譬如，领导有没有私人的愿望无法实现，如果他自己没有，他家里人有没有呢？家里人没有，身边人有没有呢？譬如秘书啊，司机啊，如果和他们打好关系，至少可以了解到领导的第一手信息，不管在私人还是工作中，都可以用得上，而秘书司机这样的关系，比直接接触领导要容易得多。


    有人会说，“恕臣妾做不到啊”，其实这都是自我设限。人在屋檐下不得不低头，如果你连观念都无法转变，怎么能有未来的出息呢，而且转变的观念本质上也是为了自己的前途，所谓，观念一变天地宽，现在就转变观念，迎接你的美好未来。


    # 冲破迷障，在人为刻意的隐瞒中，怎么才能辨别事实和真相？


    在现实申，有人为了达到目的的同时还能保持自己的形象，这样会刻意隐瞒事实和真相，保持自己伟光正的形象。在这样的情况下，作为权谋家，总是希望了解这背后的事实真相，以便于知道自己接下来应该怎么做。


    事实上，能不能搞清楚事实和真相是区分被统治者和统治者的黄金标准。


    现在我们用历史上著名的赵匡胤“黄袍加身”的案例来看，我们怎么寻找迷障背后的真相。


    “黄袍加身”这个案例，当事人宣传是，赵匡胤在北征途中被下属拥戴做皇帝，自己本来没有做皇帝的心，因为如果他有做皇帝的心有话，那就是篡逆。这个在儒家“忠孝”的观念里面无法接受，而且对赵匡胤登上皇位巩固权力也'
  merge: -1
  img_proc: true
- pgno: 64
  md: '非常不利，所以他必须对这个事情进行包装和美化，我们综合多种史料来复盘赵匡胤 “黄袍加身” 的过程：


    周世宗显德六年（公元 959 年）六月十四日，赵匡胤就任殿前都点检。十九日，世宗卒。第二年正月四日，赵匡胤发动陈桥兵变，黄袍加身，建立了长达 300 多年的宋王朝。赵匡胤也是在禁军拥立下取得政权的。


    自显德三年（公元 956 年）以来，赵匡胤先后网罗一批人才，成为自己的智囊团。著名的有赵普、吕余庆、刘熙古、沈义伦、李处耘等高级谋士，他们都是有谋略、有胆识的武将。


    周世宗去世之时，赵匡胤虽有政变的实力，但搞政变的阻力很大。最主要的阻力来自侍卫亲军司、都指挥使李重进，他是周太祖的外甥，能征惯战，握有重兵。副都指挥使韩通，有勇寡谋，誓死效忠周室。潞州节度使李筠，居潞（今长治）八年，在镇
    “擅用征税”，养兵三万，几乎是雄镇一方的割据势力。步军都指挥使袁彦，也是与赵为敌的大将。


    此外，尚有丅少中间势力，如引进使曹彬等，宰相范质、王溥，枢密使魏仁浦，与赵匡胤、李重进均无特殊关系。


    恭帝即位后，赵匡胤开始作政变准备。第一个重大行动在七月十七日，以侍卫步军都指挥袁彦为陕州节度使，解除他在侍卫司中的军职，侍卫马军都指挥使韩令坤为侍卫马步军都虞侯，龙捷左厢都指挥使高怀德升为侍卫马军都指挥使，虎捷左厢都指挥使张令铎升为侍卫步军都指挥使。


    第二个重大行动在七月十九日，以侍卫马步军都指挥使李重进为淮南节度使，让他去路途遥远的扬州当节度使，保留军职。


    这两个行动把侍卫司中的两名主要实权派排挤出去，由于两人改任节度使，'
  merge: -1
  img_proc: true
- pgno: 65
  md: '李尚保留军职，比张永德稍强，他们还能接受新命，而韩通等人职务未动，不会对这些行动有更多的猜疑。新升官的三人中，高、张是赵匡胤的密友，韩则属中间势力，与此同时，王审琦也由铁骑右厢都指挥使升为殿前都虞候。何以见得这些行动出自赵匡胤的旨意？赵本人无权发布这种命令，但他有一个特殊的条件，符太后与赵匡义（宋太宗）的妻子是亲姐妹，他完全可以通过太后口谕达到自己目的。


    再具体考察一下二司实权派的状况。


    殿前司的前四位人物：殿前都点检赵匡胤、殿前副点检慕容延钊、殿前都指挥使石守信与殿前都虞侯王审琦。四人中，赵、王、石是盟兄弟，慕容延钊与赵关系不错，赵"常兄事延钊"，他不是赵的集团成员，对赵发动政变，未必赞同。在政变前，赵将其打发到瀍州任镇宁军节度使，军职不变。


    殿前司厢级指挥官四人，知其姓名者二人：铁骑右厢都指挥使刘廷让与控鹤右厢都指挥使马全义均为赵心腹。至此，殿前司已成为赵发动政变的大本营。侍卫亲军司的前五号人物：马步都指挥使李重进、马步军副都指挥使韩通、马步军都虞侯韩令坤、马军都指挥使高怀德、步军都指挥使张令铎。此五人中，李已打发到扬州，高、张是赵集团的要员。韩令坤与赵关系密切，但不是赵集团中人。赵为了保险起见，于显德六年冬，让其去河北防守"北边"。这样，在京侍卫司里，效忠周室者只韩通一人。


    厢一级统帅有：龙捷右厢都指挥使祁廷训、虎捷左厢都指挥使张光翰、虎捷右厢都指挥使赵彦徽。张、赵是赵集团中人，祁是"临死多规避"的胆小鬼，他不入伙，也不妨事。至此，侍卫司除韩通外，大体上亦为赵的势力所控制。现在只剩最后一个问题，赵匡胤不能越过韩通，直接指挥侍卫司的军队。如果'
