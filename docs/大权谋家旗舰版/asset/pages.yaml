    众所周知，李斯赵高二人的 PK，以沙丘政变为起点，从此迁延数年，最终以实干家李斯的失败和阴谋家（在一定程度上讲更是擅权术者）赵高的胜利而告终。而二人交战的第一轮，就是互相之间的“威慑”与“反威慑”斗争；以此分野，赵高蒸蒸日上、大权独握，李斯则日薄西山、惨死刀头。中国历史上这两大高手的表演精彩绝伦，“威慑”与“反威慑”操控手段在此案例中关键异常，因此，我们准备多费些笔墨来深入剖析，看看威慑手段操控对方的种种妙处。笔者按照《史记》的原文稍加评点，逐次行文，以使读者看个清楚。


