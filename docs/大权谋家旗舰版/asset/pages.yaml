    从中国血的历史教训中看出，中国权力的最大特点是君主一人操权任势、通揽一切权力。法家认为最高执政者只能有一人。在权力结构层次中，每一层最高权力也只能由一人独掌。《慎子》中《德立》、《佚文》篇认为，“两”和“杂”是祸乱之源，因为“两则争，杂则相伤害”，“两贵不相事，两贱不相使”。解决矛盾的办法是定于“一”，“子有两位者，家必乱。子两位而家不乱者，父在也。”“臣有两位者，国必乱。臣两位而国不乱者，君在也，恃君而不乱矣。”一国内只能有一君主，“多贤不可以多君，无贤不可以无君。”《管子》中继承慎到这一思想，《霸言》篇云：“使天下两天子，天下不可理也。”


    韩非则从更广泛范围内论述势不两立，指出“一栖两雄”、“一家二贵”，“夫妻”是祸乱的根源。“为了防止篡位，君主只能一人，此是实现权力正常运行 的前提。权势独操，决事独断，是实现权力通常运行最主要的两项内容。


