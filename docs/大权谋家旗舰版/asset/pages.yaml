  md: '# 弱势群体信奉“平等”、“自由”，是好事还是坏事？


    【续资治通鉴原文】已末，上封者言：“比诏淮南民饥，有以男女雇人者，官为赎还之。今民间不敢雇佣人，而贫者或无自存，望听其便。”从之。


    【翻译】已末，有人呈上秘密奏章说：“最近朝廷下诏，淮南路（今江苏省扬州行）政区灾民把子女卖给富人做奴仆的，一律由政府赎回。导致民间不敢随便雇佣奴仆，而穷人也因为失去工作而陷于绝望，我建议不必下诏禁止。”朝廷批准。


    【解析】现在我们受西方宣传的影响，几乎每个人都把自由、平等、民主等观念挂在嘴上，刻入头脑。其实这是一个巨大的语境型陷阱，让你掉进去不可自拔，我们通过本案例来仔细分析一下。


    我们知道，中国社会从古至今一直是一个金字塔型的完整组织伦理架构，我们绝大多数人处于金字塔的底端，中国的社会是以父父子子君君臣臣为基础的伦理性结构，所以并没有提倡什么平等自由。因为你一生下来，不管你是不是愿意，就已经被纳入了这个体系。


    换句话说，你的出身就决定了你的层次，所以人和人生来就是不平等的。如果硬要说平等，那就是还没出生之前，又或者你可以认为在人格上，大家是平等的，不过在社会组织里面，那和人肯定是不平等的。


    宋朝之前下命令帮助受灾户把卖身富贵人家的奴仆赎身，看似为弱势群体和底层老百姓做主。出发点肯定是好的，但实际上你帮他赎身后，因为他们原生家庭资源的极度匮乏，所以他们恢复自由身后，几乎无法谋生，所以在这件事情上，北宋政府其实是好心办坏事的，由此可见，在红楼梦里面，我们现在的观念是谁想做奴仆呢？但是她们在贾府做丫鬟，帮工的时候，没有一个愿意离


    44'
