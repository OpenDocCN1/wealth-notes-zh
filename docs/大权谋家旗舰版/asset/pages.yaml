- pgno: 33
  md: '产生迷茫和对抗，如果对抗多了，就会断送自己的前途。因为你的位置变化导致于周围环境变化。俗话说，屁股决定脑袋，而且如果你的职位升高的话，你的竞争对手和力度都不一样了，你必须要改变观念才可能脱颖而出。


    # 三、遇到高手


    在现实中，我们有时候会遇到比自己高出很多段位的前辈。这时候，你需要做的就是偷师。当然，如果他愿意提携你，点拨你，当然是更好的。不过这个前提是你要有办法能靠近他，让他接纳你，信任你。向高手学习是成本小，见效快的捷径，比起前两种方法代价小多了。


    其他还有譬如你信任的人背叛了你、低谷期你遇到的世态炎凉等等，也都是可以让你更容易看清社会真相，调整自己的观念，刷新三观，从而大彻大悟。


    所以一个人如果没有挫折，就不能改变三观，而行为和选择都是按照三观来做出的，你的命运就是由你的行为和选择所决定。三观不变，不管外在条件怎么变化，你始终只能在原来的层次不断轮回。


    # 大跌眼镜！佛法原来是最高深的权谋


    一直看到佛家有一个著名的公案，以前一直没有啥感觉。最近突然发现，原来在佛家的公案里面也隐藏着高深的权谋手段。这段公案相信很多朋友都看到过，我们先来读一下：


    昔日寒山问拾得曰：世间有人谤我、欺我、辱我、笑我、轻我、贱我、恶我、骗我、如何处治乎？拾得曰：只要忍他、让他、由他、避他、耐他、敬他、不要理他，再待几年你且看他。'
