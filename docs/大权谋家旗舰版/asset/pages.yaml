    赵高见李斯开始作辩护了，知道自己已经占据了主动，便进一步说：“我赵高本来是宫中的一个奴仆（这是让李斯放心之语），幸而凭着熟悉狱律条文进人秦宫，管事二十多年了，还没有见过秦王罢免的权相功臣能保持爵禄并传给下一代的。最终都因车连被杀死。”赵高这话，点明秦国恩赏臣下的弊端，指出了在秦国做高官的一种并不乐观的可能性后果。以此，作为自己整个威慑操控的基本立论依据。


    赵高依据秦史，为李斯勾面了权臣仕途发展和命运变化的一股曲线图，指出了秦国（朝）官场险恶的生存环境，暗示在此大局和传统之下，李斯可能也摆脱不了这种命运。接着，他说：“皇帝有二十多个儿子，都是您所了解的。长子扶苏为人刚强、坚毅，英武勇敢，能够信任、激励他人，如果他继位之后任用蒙恬当丞相，您最终不能怀着通侯的印信衣锦还乡，这是明摆着的。”


