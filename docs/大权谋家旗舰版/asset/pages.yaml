  md: '精神惩戒，就是对对方精神进行打击，使对方在巨大的精神压力之下崩溃的方法。一方法 与威慑手段相同之处在于两者皆作用于对方心理，区别在于威慑大多是行动前的一种预先措施，而惩戒是行动失败后的一种补救式手段-如果能威慑，就威慑；威慑不成功，才用惩戒手段。精神惩戒，主要包括批判和影射两种方法。对于批判想来大家都不会陌生，无非就是对对方的语言和行为加以批驳，使其丧失合理性。批判包括操控者个人的批评和发动群众的批判，其最终指向即通过批判，孤立对方，使其处于人人喊打的绝望境地。至于影射，则是一种间接的方法，虽然不对对方直按构成攻击，但是，通过迁回手段，解构对方的逻辑、观点、主张，等等，使对方
    丧失意识形态和精神世界的正义性与合理性，也能够达到孤立、丑化对手的效果。总之，无论是批评还是影射，都是精神敲打的一种方式，都是一种刚性操控的手 段。如果运用得好，就能够使得受控者深受触动，从而迫使对方不得不听从施控者的摆布。


    # 其二，肉体惩戒。


    肉体惩戒主要包括囚禁和肉刑。因禁，是剥夺对方肉身自由的一种方式。历朝历代都有过囚禁对手的现象。至于肉刑，则又是另一种惩罚了。我国古代对于肉刑的种种方法，其发明可谓是世界之最。人体只要能被切割的部分，无一例外都涉及了。利用肉体惩戒来操控对方的方法，足可以摧垮对方的斗志，使对方屈从于我方的意志，按照我方意愿行事。关于肉体惩戒的典故，想来大家也并不陌生。


    当年刘邦的妻子昌后，为了刘邦宠爱的妃子戚夫人可没少受气。戚夫人仗着刘邦的宠爱，几次三番策动政治攻势，想要刘邦更立自己的儿子如意为太子。刘邦也宠爱如意，想换了太子。前文已经提到，在关键时刻，张良出主意请到'
  merge: -1
  img_proc: true
- pgno: 147
  md: '了商山四皓，才保住了惠帝的位置，也才保住了吕后的荣华富贵。


    此事之后，吕后对戚夫人恨之入骨。但是，因为刘邦在世，所以她对戚夫人无可奈何，只得忍气吞声暂不发作。好容易熬到刘邦死了，又整死了赵王如意，吕后见戚夫人再也没有什么能依凭的力量了，当然就得老账新账一起算算。吕后命人把戚夫人抓起来，挖去她的眼珠，熏聋她的耳朵，给戚夫人灌上亚药，砍去她的双手双脚，把她扔在厕所里。可以想见，吕后大仇得报，必定心里非常高兴。得意忘形之际，她把自己的儿子惠帝叫来，让他来看“人彘”。按照昌后的意思，她是想让惠帝看看戚夫人的下场。如果当年不是她死命保住了太子，那么，今天死的很可能是惠帝，而受苦的很可能是她吕后了。言传不如身教，吕后让戚夫人现身说法。
    熟料；惠帝初为人世，心肠柔软，跟好几次被抓进敌营在死亡里打了几次滚的吕后来说，他的层次还差很多，又哪里见过如此毒辣的手段、手段？得知眼前的人彘惨剧的主角是当年红颜如玉、千娇百媚的戚夫人之后，惠帝顿جت大哭起来。惠帝受到过度惊吓，竟然患上大病，一年多都没有起床。吕后用来惩罚戚夫人的手段之残酷，连她自己的儿子都看不下去受到惊吓。由此可见，吕后的惩戒方法是多么毒辣。


    在上述案例中，吕后所用的就是肉体惩我的方法。如果戚夫人能够再活一次的话，相信她绝对不会用当年那样的招数对付昌后，以致为自己招致如此之祸。同时，吕后将戚夫人做成了人彘，不仅惩戒了戚夫人，而且威慑了群臣。吕后的肉体惩戒之术并非绝无仅有的，后来唐朝的武则天也盗版了昌后的路数，把自己的政敌前皇后和萧妃投进酒缸，狠狠地惩罚了这两个女人。肉体惩戒在封建社会是掌权者对臣下的一种惯用手段。


    为了维护威严，肉体惩戒当然是历代帝王必选的手段。'
