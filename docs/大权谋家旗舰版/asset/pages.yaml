- pgno: 110
  md: '和司空王邑来了个下马威。平晏有次进宫，带的随从违反了规定，门卫长不准随从进人。平晏大怒，命心腹将门卫长掼了起来而后扬长而去。王莽得知，立马派几百人马包围太傅府。平晏又惊又怕，只得把心腹送了出去。王莽ADMIN立即将其处死，大大杀了太傅的威风。司空王邑的部下犯夜，与巡逻的亭长发生争执。部下一怒之下拿出马锤要砸亭长，亭长闪开后，随手杀死王邑的部下，然后畏罪潜逃。王莽得知后，下令“亭长奉公守法，无罪”。王邑听说这个消息，大感丢脸，却又无可奈何，在召集手下告诫一番之后，又亲自向亭长去道歉谢罪，才算平息了这场风波。王莽左右开弓，连拿两大重臣开刀，从而在权臣阵脚中打开了一个缺口。


    再次，杀鸡做猴，完成威慑。经过这两件事之后，王莽授意别人大肆宣传，从遏制权臣的决心，到遏制权臣的行动，都一览无余地展现在世人面前。诸权臣为怕惹祸上身，不得不收敛气焰，夹起尾巴做人。于是，王莽的威慑政策大功告成。


    虽然王莽食古不化、改革失败，虽然他阳奉阴违欺世盗名行为可憎，但是他的种种权变手腕，以及他在权力斗年中的威慑手段，却是值得我们研究和琢磨的。在这里例子中，王莽杀鸡做猴，干脆利落，毫不手软，有效地树立子威严，打击了权臣，强化了自己的统治。


    威慑手段既然是心理战，那么，威慑的效果，全部体现在斗争双方的心理活动中。也就是说，威慑手段是操控与反操控双方在心理战线上展开的一场“寂静的战争”。


    前文提到的刘邦败于张良的故事中，张良给吕后出主意，请来了商山四皓。刘邦看太子觉羽已成，势无法制，于是不得不打消主意。这一计策从本质上讲'
  merge: -1
