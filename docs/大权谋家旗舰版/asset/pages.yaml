    这个表态很关键也很高明，充分证明丁王璋对时局的透彻了解，也同时反映了其高超的智慧和过人的头脑。朱棣同意后，王璋带着几名随从从京城赶到周王府。周王见到王璋等人非常惊讶，不知道他为何来，连忙请到密室，询问王璋来意。王璋故作紧张状，说：“有人告发您谋反，臣因此而来。周王一听大吃一惊，又一向了解那个从刀锋中杀出血色王路的皇帝的为人做事，竟然坐不住身，跪在地下颤抖不已。王璋拉开号，蓄满势之后，继续追加威慑投资，恐吓周王说：“朝廷已经命令丘大帅领兵十万，不日内就要到您这里来了。臣以为此事尚未有什么征兆，特此先行一步，给您报个信，不知道您这里事态如何？”周王一听这话，顿时吓得抱头痛哭。王璋投下一粒石子，等着这颗石子在诸人恐惧的心湖上荡起圈圈涟漪并最后掀起波澜之后，方才慢悠悠地说：“光哭又什么用，赶快想办法解除皇帝对您的疑虑才好啊。”周王已经被吓得麻木，说：“我也不知道怎么办好哇，请先生帮帮我吧。”王璋沉吟片刻，故意卖了卖关子，然后才把早就算计好的话说出来：“您如果能够把您手下的三护卫重兵献出来，或许可保无事。”我们私下推测，周王也未必不知道王璋的来意，其前面的种种状态或许亦是一种政治表演，但我们也不能高估了周王爷的政治智商。无论如何，周王是听从了王璋的建议，立刻派人以最快的速度上告朝廷，成祖闻讯大喜，一场大祸因着王璋的几句高
