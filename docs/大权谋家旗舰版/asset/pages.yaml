  md: 面有疥色；邹、鲁两地闭门不纳，齐王又出奔莒地。楚国派淳齿率军前来救援齐王，被任命为齐相。淳齿却想与燕国瓜分齐国，于是抓住齐王数说他的罪过： “千乘、博昌之间的方圆几百里地，下血雨浸湿衣服，你齐王知道吗？”齐王回答：“知道。”
    “嬴、博之间，大地崩塌，泉水上涌，你齐王知道吗？”回答：“知道。” “有人堵着宫门哭泣，却不见人影，离开时又音响可闻，齐王你知道吗？”回答：“知道。”淳齿说：“天降血雨，是上天警告你；地崩泉涌，是大地警告你；人堵着宫门哭，是人心在警告你。天、地、人都警告，而你却不知改悔，你还想不死吗！”于是把齐王杀死在鼓里。
