- pgno: 34
  md: '初看这段话，体现了出家人慈悲为怀、宽宏大量的品格，但如果用权谋的观点看，那味道就完全不一样了。我们用四个不同的方面来解读一下：


    # ## 一、不树敌


    对于我们普通人，当有别人对付自己的时候，往往急着反击。这种直接反击就算赢了，往往自己也被溅一身血，而且社会上树敌是一件非常危险的事情。中国人还说君子报仇，十年不晚。所以尽量不树敌，以免有后患。


    # ## 二、捧杀


    光不树敌，光忍耐，还不够，还需要鼓励他，鼓励把他的缺点发扬光大。所以这里面，敬他，权谋家还要恭维他，鼓励他，让他得意洋洋，让他自以为是，加速他的自我爆破。


    # ## 三、让对方聚集相同的能量


    聚集相同的能量也就是志趣相投。中国人很奇怪，有特质的人，经过时间的积累，往往有相同志趣的人围绕在身边。而有些人动机不纯，譬如看到你豪爽，他就问你借钱；看到你喜欢欺压弱势群体，那就借你的刀来收割弱；；看到你喜好对抗领导，那就怂恿你去对抗强者，自己看戏。


    # ## 四、让别人收拾


    在以上的三个步骤完成后，他的对立面积累的越来越多，而强中更有强中手，所以让其他的强手来收拾他，所以拾得之所以为拾得，他看似不用自己努力，被动拾到的，而其实都是他在无形中进行布局造势和摆平，最后直接“你且看他”收获成果！


    所以，这个公案表面上是体现了大和尚们的宽宏大量、高风亮节，而实际上是暗藏杀机，这就是权谋的最高方式！'
