  md: '寄心腹。尉缭说他有求于人时下气相求，得志之后不能共享富贵，把秦始皇视臣子如工具的心思丝丝人扣地描绘出来。所以，秦始皇早已超脱了亲情、友情、爱情；其惨绝人寰、杀人如麻、人挡杀人、佛挡杀佛的作风，是有其性格源头的。


    另外，作为皇帝，金钱、名誉不会放在心上，权力也早在爽中，刺激不了他的欲望。有人一定会批评笔者说：不要胡谄了吧，说秦始皇超脱权力，这是不可能的。看官且慢下结论，等笔者逐一道来。


    六国者，合纵天下，戮力攻秦，秦数次受制于此。作为六国的国君，都会安分守己，谁也不敢明确提出统一天下，恐遭他国群起而攻之也。六国君主安居于位，唯有秦始皇务要统一天下，即使面对类似荆瓶行刺的危险也不罢休，何也？《英雄》中说，秦始皇统一天下，是为了天下苍生-这我们且不去管它。单从秦始皇不甘于位非要绝杀六国来看，他为了这个目标，不稠冒着六国合纵秦国战败亡国的危险，非要把统一“进行到底”，这到底是为什么？我们知道，秦始皇绝不是受了“统一”方便面厂家的贿赂来给他做广告，他唯一的动机，当然是权力。


    秦始皇之所以敢冒战败之后灭国亡种丢掉权力的危险，执著地反复发动战争，固然一方面是因为国力超级强大，发动战争要掠夺更大的权力；另一方面，在笔者看来，他并不把自己的位置看得多么重，并没有多么在意自己的所得而害怕所失，这也是一个重要的原因。也就是说，他宁愿以自己秦国的江山为赌注，来博一把天下一统的大业。我们还知道，如果你极喜爱一个女人，你会把她当作赌注么？如果你极在于一样事物，你会拿他当作赌注么？六国国君爱惜自己的宝座，珍惜自己的权力，谁也不敢贸然挑起战争，生怕一个不慎，把自己的'
