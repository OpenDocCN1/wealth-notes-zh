- pgno: 317
  md: '我最能对付恃才傲物、自命不凡的人。你觉得你才高八斗不被重用，心里不服气，满口怨言。那好，我会叫让认识到自己差得远呢。其你是学中文的，我叫你去算数字:你是学数学的，我让你干文秘：你是学唱歌的，我让你去搞体育。很快，你就会感到自己不行，让你真正明白，上级重用你，你才会有能力，上级不重用你，你就啥也不是。所以，在我的手下干，最好老实点，谦虚点，否则，没有好果子吃。我用这个办法，把些研究生、博士生毕业的人弄得服服帖帖的，他们都学会了拍我的马屁，越来越懂事了。这就是调教的结果。


    我善于平衡员工的心理。对于我看中的人，我总是默默地记在心里，有了机会就提拔起来，为我所用。有一些人工作干得不少，但我不喜欢，看不上，我就采取口头表扬的方式，或当面，或在大大小小的会议上表扬一下，有时在年末评个先进工作者。我还常常当着某某的面检讨，表示很遗憾没有提拔重用他，某某常常被我的诚意所打动，表示听了这句话也就心满意足了。我经常对我的手下人许愿，我说某某你是个个人才，你要听我的，好好干，将来我会提拔重用你。我发现，大家都很看重这句话，他们都认为自己很有发展前途，工作起来很卖力。其实，这些句话只是说说而已。将来是什么时候？是三年五年还是十年？这叫“先给一个热罐子抱着”。其实，我在一个地方也就干三年五年的，你在这几年里效力就行了。以后的事情，我就管不了那么多了。要知道，说话是一种艺术，并不是每一句话都要兑现的。


    # 下属怎么翻身做领导？且看现任领导自爆“做下属心得”


    人活一世不容易，人活一世没有做过“下级”更不容易，非但不容易，而且'
