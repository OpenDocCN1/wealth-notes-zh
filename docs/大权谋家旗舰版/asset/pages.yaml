- pgno: 261
  md: '走，不犯低级错误，以利于自己在职场的顺利发展。


    # 下属公开硬杠上司，会有什么结果？


    【续资治通鉴原文】始，钱惟演留守西京，修及尹洙为官属，皆有时名，惟演待之甚厚。修等游饮无节，惟演去，曙继至，数加戒敕，常厉色谓修等曰：“诸君知寇莱公晚年之祸乎？正以纵酒过度耳。”众客皆唯唯，修独起对曰“寇公之祸，以老不知止耳。”曙默然，终不忍，更荐修及洙，置之馆阁，议者贤之。


    【翻译】之前，钱惟演担任西京(河南省洛阳市)留守长官，欧阳修和尹洙都是钱惟演的下属，两个人在当时颇有名气，钱惟演对他们也特别的优待。欧阳修等经常毫无节制的游玩饮宴，钱惟演离任后，王曙继任，多次对欧阳修等人的行为加以告诫，王曙曾经严肃的对欧阳修等人说：“你们知道寇莱公(寇准)晚年之所以遭到流放远方吗？正是因为饮酒过度导致的。”其他人恭敬的回应，只有欧阳修说"寇公(寇准)之所以有这样的遭遇，只是因为他年岁已高却舍不得高位。”王曙听了之后沉默不语，却始终没有生气，反而向朝廷推荐欧阳修以及尹洙到馆阁(“昭文馆”、“史馆”、“集贤院”三馆和“秘阁”、“龙图阁”)任职，当时的舆论对王曙的评价很高。


    【解析】职场上见过很多有才的年轻人，控制不了自己的脾气，持才傲物，不太把领导放在眼里，自觉不自觉的和领导硬杠，我们来看看和领导硬杠会有什 么结果。


    本案例的主角是欧阳修，在北宋历史上如雷贯耳，唐宋八大家之一，八大家很多位还是他的学生，谥号为“文忠”，从谥号也可以看出他在朝廷心目中的'
  merge: -1
