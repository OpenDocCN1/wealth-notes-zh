  md: '层世界里面轮回，一点出路都找不到。因为在自己的价值观里面，任何事情都可以解释的头头是道，好像自己毫无问题，那肯定是无法提高，也无法摆脱无形中困住自己的那张大网！


    # 有钱人都是坏人吗？


    社会上对有钱人有一种看法，就是一般会认为有钱人都是人品不好，为什么会有这种感觉呢？原因是，赚钱属于利益范畴，人品属于道德范畴，如果想要追逐利益，那有时候道德就顾不上那么多，如果要做正人君子、道德楷模，那就和利益无缘。


    一般有钱人之所以有钱有以下几个原因：


    # 一、把心思放在赚钱上


    唐朝白居易《琵琶行》中说：商人重利轻别离。言下之意就是为了赚钱，商人需要背井离乡，这样就没有办法照顾家庭。如果从妻子儿女的角度看，那就是不顾家，没道德了。


    # 二、趋炎附势


    从道德范畴来看，趋炎附势、阿谀奉承的人都是小人，而从追逐利益的角度看，因为财富和资源都掌握在权势人物的手里，你不靠近他们，你怎么有机会发财呢？而如果你对他们说好话，拍马屁，那就又容易被认为巧言令色，油嘴滑舌。


    # 三、内部运作


    一般所有的有利益的项目，都是提前进行运作的，但是这样就很容易被认为'
