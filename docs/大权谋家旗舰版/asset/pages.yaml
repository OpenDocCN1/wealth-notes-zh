  md: '才有可能获得机会。因为资源和人脉几乎都掌握在有权势的人手里，你和一百个底层的du关系，不如权贵人士的一句话有用，没办法，社会就是这样现实。


    当然，如果你想要知道，怎么靠近权贵，获取权贵的信任，这都是一套学问，我们把他完整的写入了《大权谋家》系列。


    如果你要借助组织外的资源发展好，那就必须借助你在组织外的人脉关系。这个人脉关系，一方面有中国所一直存在的一种人情的历史传统和社会氛围，另一方面有一个信息不对称的原因。别人给你介绍一个大客户，实际上是在信息不对称的情况下来提供你这种商机和业务机会，当然这里面可能会涉及到权力和利益交换的问题。


    因为思维习惯的问题，人们有业务的时候都希望通过熟人去介绍，甚至我们还有一种习惯。我们去买一些成熟的产品，比如买车，你可能习惯性通过一个人介绍买这个车，所以社会资源从这里来延伸的，因为这里面有一个信任传递和背书的问题。


    马克思也说过，人是社会关系的总和，所以不管在东方还是西方，关系都至关重要，虽然我们从小就被灌输，做人要正直和诚实，对拉关系、走后门总是嗤之以鼻。


    但是踏入社会就会发现：你老老实实做事，升职的是其他人；你踏踏实实竞标，中标的总是别人！为什么会这样呢？因为你关系不到位，所以如果你想有好的发展，从现在起，好好经营自己的关系，不要一天到晚幻想着只要公平竞争自己就能脱颖而出，这无异于痴人说梦。'
