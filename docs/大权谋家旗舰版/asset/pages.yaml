- pgno: 260
  md: '形：


    # 一、传统观念的压力


    不做点姿态，面子上过不去，“防民之口甚于防川”，这是不符合圣人教诲的。所以，开放一点言路，给点言论自由一般都是不得已而为之，本质上是不愿意的，主观上是不赞成的。这种情况下让你说话，你可不要忘乎所以哦。


    # 二、倒霉的时候


    领导四面楚歌，内忧外患一起来了，计将安出？于是马上降低姿态，弯下腰来，开始倾听各方面意见了。这样的言路开通只能是暂时的，小范围的，也是急迫的，寡人一旦进入安全地带，就变成了我的地盘听我的，平日里爱提意见的同志哥应当马上踩刹车，注意安全。


    # 三、局面全控的时候


    有的君主或领导只是把言路畅通当成时髦的奖章，一种政治清明的标志，当需要标榜清明的时候，环顾四周又没有什么危险的时候，在言者承认“主流是好的”的前提下，说说窗明几净也难免有几只苍蝇，言者谆谆，听者藐藐一这时，言路好像也还是畅通的。


    # 四、怕人不动口动手的时候。


    这与第二种情况相仿，再不让人说话，老百姓就动手了，于是便让“君子”动动口，以防“小人动手。第二种情况侧重寻求对策，此种情形则完全出于平息众怒，逃过难关。没有民主之实，民主作风还是要体现一点的，中国历史上
    有不少皇帝下过“罪已诏”，打着哭腔请大家发表意见。


    所以我们必须要注意，就算是领导在说“大家不要有顾忌，畅所欲言”的时候，你始终要紧绷权力这根弦，还是要少说话，以免触犯权力的逆鳞而吃不了兜着'
