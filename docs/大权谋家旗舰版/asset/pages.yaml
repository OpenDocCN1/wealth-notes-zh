- pgno: 248
  md: '退下之后，上书表示祝贺。乙卯，又下诏召集文武官员参观，监察院监察主任(监察御史)开封(河南省开封市)人鞠诰说：“陛下刚刚即位，而黄河决口还没有堵上，连日大雨损害庄稼，陛下应该考虑如何回应上阶的警告。我希望陛下以任用忠诚贤良人士、罢免那些奸邪小人作为国家最宝贵的事情，以训练军队士兵、引导人民勤于耕作，使全国的仓库都堆满粮食作为最美好的祥瑞，而区区几根草，有什么值得如此兴师动众！”


    【解析】职场上下属给领导进谏是一项高难度的动作，因为如果你方式不妥当，那很容易得罪同僚，激怒领导，最后自己被报复，那我们应该怎么进谏呢？先从一个反面案例开始讲起。


    本案例发生的时间是宋仁宗刚继位，这时候，帝国大权掌握在刘太后的手里，这时候的这个局面，对于大臣和皇帝都是非常微妙的。


    而现在天安殿殿柱上长出灵芝草，一般认为，这是一个祥瑞。因为天安殿本来就是皇帝和上天沟通的一个专用场所，所以在天安殿里面长出灵芝草就更有象征意义了，几乎所有的大臣看到这样的情况，都会向宋仁宗祝贺，这个祝贺包含了两层含义：


    # 一、阿谀奉承


    大臣们作为皇帝的下属，都在寻找能恭维皇帝的机会，任何一个风吹草动都不能放过。因为如果你下手慢了，那你的恭维就意义不大了，所以我们看到阿谀奉承也是要争先恐后的，因为第一个可能会被皇帝记住，后面的大概率是不会被记得的。


    # 二、树立皇帝权威


    在太后掌握帝国实际权力的当下，把天安殿长灵芝草当做一种祥瑞，看做是'
