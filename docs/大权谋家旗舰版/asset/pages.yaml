    # 职场上消除潜敌的顶级功夫：嘘寒问暖的背后居然暗藏杀机！


    职场上有人对你嘘寒问暖，关怀备至，一般人都会非常感动，就容易任其摆布，殊不知在这无微不至的关怀背后，居然隐藏着巨大的阴谋。


    我们来看历史上高人是怎么操作的：


    唐朝天宝元年(742 年)，有一天，玄宗驾临勤政楼。兵部侍郎卢绚正骑马经过楼下，气宇轩昂，雄姿英发。玄宗看到后心生欢喜，称赞道：“真乃伟丈夫也！”李的耳目喉舌马上将此事汇报给李林甫。他担心卢绚被皇上重用，便设计阻挠。第二天，李林甫把卢绚的儿子召来，说：“令尊素有雅望，皇上准备让他去交、广(今广东、广西一带)任职。”


    卢绚的儿子一听，到那么偏远的地方任职，可是一个苦差事，就请李林甫指点该怎么办。李林甫说：“可以年老为由，乞求皇上另行安排。”


    果然，卢绚听从李林甫的“指点”，上书奏言自己年老，不堪重用，结果被罢免兵部侍郎之职，出任华州刺史。卢绚到任不久，李林甫又谏其借口有疾而不理政事。玄宗对他的好印象一下子抹煞了，改授为太子员外詹事。卢绚的前途就这样让李林甫给结束了。


    李林甫解决的另一个人则是中书侍部严挺之。严早年被李林甫排挤出京城。'
