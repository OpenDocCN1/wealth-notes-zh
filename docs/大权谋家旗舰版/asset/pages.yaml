- pgno: 300
  md: '还诙谐地笑着，同时另外一个手在摸打火机，并没有摸到。这时候，梁局长拿起桌上的打火机，打着后似乎要帮吴过点烟，这时候吴过没让梁局长点，而是把打火机请过来后自己给自己点上，吸了一口，着了。


    这个非常细微的表情和动作，吴过无疑是向梁局长低头和臣服的精湛表演，只有通过给福利和谈话开头的臣服，才有可能让自己的对手、也就是梁局长放下对自己的防备心理，不然大家谈话的氛围都没有，根本就没法做到心平气和的沟通。


    # 组织内部，为何只有领导能公开抽烟？电视剧《岁月》深究之二


    前面说到，吴过恭敬地接过梁志远的香烟，没让梁志远点，而是自己请来了梁局长的打火机自己给自己点上，然后说“闻局长不抽烟，自己从来没敢在这个办公室抽过烟”，梁志远歪斜着打量吴过说“这回好了，你可以使劲的抽。”


    抽烟，尤其是机关里面的抽烟，一直是一种特权。局长在办公室抽烟，没有影响到别人，那无所谓，现实中看到很多领导在开会的时候抽烟，而下属们都熟视无睹，他们难道都无所谓吗？其实并不是的，因为不抽烟的人，都对烟味很敏感，而且有规定明明是明令禁烟，领导在开会的时候抽烟，你有意见而不敢提，不敢搬出组织的规
    定，这不正是臣服于权力的一种具体体现么？而且这个领导还很受用，享受权力带来的特权。


    所以本视频里面，梁志远给吴过让烟，其实就是给他平等的机会，在这个基础上看吴过怎么表现；这时候吴过拒绝不太好，因为梁局长肯定知道吴过是抽'
  merge: -1
  img_proc: true
- pgno: 301
  md: '烟的，你说不抽的话，就会显得做作，而你抽烟的话，又显得大家平等了，就达不到吴过向梁局长显臣服、表忠心的初衷了。


    所以在这时候，吴过说的“闻局长不抽烟，自己从来没敢在这屋抽过烟”，这不仅代表闻局长的特权，也代表吴过对闻局长的尊重，现实中，不要说是在领导办公室抽烟了，就算是没事的时候进去一下，就有可能要被开除的。因为你越界了，僭越是领导最忌讳的，因为你不知道领导办公室里面藏着什么秘密，就算是你没有发现，那你也已经被严重怀疑了，更何况领导还担心你被商业对手收买变成内奸。


    回过头来看，吴过除了在点烟的时候抽了一口，后来只有抽了一口，由此足以证明，他是非常收敛的，对抽烟的细节也不放过。而梁局长的“你以后可以随便抽”，就是给你一种平等的错觉，其实是给吴过挖坑，也是来考验吴过的，所以作为历史上和局长有过很大过节的局长助理，吴过是不敢再有任何造次的行为出现。


    所以，抽烟的特权其实是代表了一种森严的等级，如果你只是一个下属，那-move -那就只能偷偷的抽烟，或者到规定的区域去抽烟，千万不要在公开的场合，会影响别人的情况下抽烟。不然，光抽烟一条，就容易让你在职场寸步难行，如果领导不喜欢抽烟，那你就会死的很难看了。


    # 怎么和曾经针锋相对的职场对手修复关系？电视剧《岁月》深入之三


