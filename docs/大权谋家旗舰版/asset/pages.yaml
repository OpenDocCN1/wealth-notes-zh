  md: '朝权在手，杀尽天下负我狗！”而这样的打击报复往往会把组织搞得鸡飞狗跳，鸡犬不宁。


    那当小人物骤然取得大权力后，怎么避免以上三个大坑呢？最重要的还是转变心态，把从弱者的受害心态转变成强者的掌控心态，这样反而就不容易想着随时要打击报复，从更高的维度来看待组织发展和相关人事问题，有利于放平心态，而同时平时就要研究权力规则，不然等到自己有了位置再来学习就来不及了。所以小人物不是不能获得大权力，而是要转变心态，掌握权力规则，小人物有大智慧！这样成长起来的小人物才能长久保有权力，而不是骤得再骤失、最后自己反而再被现有的权力体系打击、永无出头之日！


    # 做人做事，任何时候，最重要的基础：认清自己的当前位置！


    【资治通鉴原文】齐王出亡之卫，卫君辟宫舍之，称臣而共具。齐王不逊，卫人侵之。齐王去奔邹、鲁，有骄色；邹、鲁弗内，遂走莒。楚使浊齿将兵救齐，因为齐相。浊齿欲与燕分齐地，乃执王而数之曰：“干乘、博昌之间，方数百里，雨血沾衣，王知之乎？”曰：“知之。”“嬴、博之间，地坼及泉，王知之乎？”曰：“知之。”“有人当阊而哭者，求之不得，去则闻其声，王知之乎？”曰：“知之。”浊齿曰：“天雨血沾衣者，天以告也；地坼及泉者，地以告也；有人当阊而哭者，人以告也。天、地、人皆告矣，而王不知诫焉，何得无诛！”遂弑王于鼓里。


    【翻译】齐王出逃到卫国，卫国国君让出宫殿给他居住，向他称臣并供给日常用度。齐王却傲慢不逊，卫国人气愤地攻击他，齐王又出奔到邹、鲁国，仍旧'
