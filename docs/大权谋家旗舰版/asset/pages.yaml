  img_proc: true
- pgno: 299
  md: '为乌有，对自己的人生也是巨大的打击，这样肯定对自己是非常不利的，那在现有情况下，你怎么才能保住自己的位置呢？我们来看看吴过挽回败局的精彩表演！


    首先，吴过寻找了一个半年以后的一个福利，通过他自己的一点点权力，给局长梁志远报名出国考察（旅游），用这个事情作为由头，来进入了梁志远的局长办公室。这时候我们注意，吴过还是局长助理，他有这个权力决定一些小事。


    半年后的出国旅游的福利，我想，这个吴过应该是思考很久后所找到的一个切入点。他这时候，内心一定很志忍，他在现在的情况下，最想做的就是怎么和梁志远修补关系，而这个关系的修补，需要一个很好的由头。


    接着，他进了梁局长的办公室，进门的时候，吴过轻轻地把门关上了，这个细节也非常值得我们学习：为什么要关门，因为接下来是讲一些私密的事情，而私密的事情有为公（权力或路线）和为私，或者公私兼顾，梁局长在看到关门这个动作，就应该有这个预见性。另外，吴过轻轻地关门，在机关里面虽然属于标准动作，这也是对领导的尊重，对权力的臣服。


    这里面，吴过和普通职场人士最大的不同在于，敢于面对现实、转变心态。其实我们只要这样想就懂了，你臣服的不是具体某个领导，而是这个职位上的权力。


    吴过用这个出国考察（旅游）向局长示好，态度非常恭敬，而梁局长背靠老板椅，悠闲地在吞云吐雾，仿佛在宣告自己是胜利者。虽然口头上拒绝了吴过的提议，但是实际上还是很受用，于是接下来就有了梁局长请吴过坐下并让烟的举动。这里面有个细节，吴过在接烟的时候，身体前倾，手伸得很长，脸上'
  merge: -1
