- pgno: 81
  md: '任凭夏言如何仇视他，只要他不犯低级错误，剩下的，就是他反过来收拾夏言了。


    其三，前期准备工作已经做足，接下来的工作就是寻找机会，发动总攻。嘉靖二十六年，北方蒙古人入侵边关，夏言和一帮主战派力主开战。但嘉靖对自己的军事力量不如对神仙那样信任。皇帝犹豫不定，夏言摸不到皇帝是战是和，为怕将来担责任，只好上疏由皇帝裁决。皇帝本来希望大臣奏请不出兵，打算将来一旦有变可以杀军保帅、锯箭了事。这就是通常所说的“功揽手上，过归手下”之意。可惜这次夏言大要滑头，干脆把这个热山芋丢给了嘉靖，竟然一点忠君的思想都没有，让嘉靖感觉到和他离心离德、不穿一条裤子。于是皇帝大怒，准备给夏言点颜色看看。严嵩在一旁早就把皇帝的心思看了个透；他一边顺着皇帝的意思反对用兵蒙古，一边趁机给夏言点点儿眼药。严嵩的政治偷袭让夏言狼狈不堪，一时间陷入了被动。严嵩抓住机会，穷追猛打，不断扩大战果。他看到时机成熟，干脆公然自己跳出来，上奏攻击夏言专权。不用笔者多说，大家早就已经看明白了严嵩和皇帝为何讠厉夏言和除去夏言的缘由。可是，攻击夏言的罪状却是“专权”，这岂非好笑？不，一点都不好笑。严嵩上疏罗织罪名是权力斗争中的惯用伎俩。当年曹操为了害怕自己被人刺杀，声称自己具有特异功能，能在梦里杀人。一亲兵为他盖被，被他起而用剑杀之。翌日曹操醒来，佯问“何人杀吾近侍’”，众人回答后又假装大哭，命人厚葬。临葬时杨修指着坟墓长叹一声说：“丞相非在梦中，君乃在梦中耳。”这句话是什么意思呢？曹操害怕别人刺杀，特假托自己有异禀，不准别人近前；但又无法将其心意明说（如果说了，那么自己的英明形象就全毁了），于是宣称自己能在梦中杀人。这种伎俩本来明眼人如杨修一目就看穿了。可是，曹操身边'
  merge: -1
  img_proc: true
- pgno: 82
  md: '的侍从显然级别不够，竟然信以为真。他没有提防曹操的用心，还以为曹操真的有特异功能可以梦中杀人呢。曹操清醒得很，把大家都忽悠了；近侍信以为真，反被蒙在鼓里，有如一场大梦昏睡不醒一般。


    所以杨修说是“君乃在梦中”。等到后来曹操要杀杨修了，不说杨修恃才傲物、比自己聪明，把自己的小算盘都看透了，也不说杨修参与立储之争必须除去，反而说他扰乱军心，胡乱寻了个理由借机杀掉。在罗织罪名方面，杨修事件与夏言事件实乃异曲同工之妙。


    话说严嵩参了夏言一本，老皇帝本来已经对夏言要滑头不为自己着想生气，一看有人说夏言不好，正好趁机勒令夏言退休。夏言虽然没有被杀掉，但是已已经成了死老虎，苟延残喘，就等着最后
    anchor了。


    其四，斩草除根。一般来说，竞争一日分出胜负，就 Ploy了。严嵩既然已经取胜，就可以让夏老头子在家，种个花钓钓鱼吧。可是，严嵩不是普通人，而是中国几千年官场中有名的狠角色，在权力斗争的功夫上能与唐朝的李林甫和清朝的和珅并称江湖三大高手。对于严嵩这样的狠角色来说，不达目的是绝不罢休的。对严嵩来说，只有置夏言于死地而方能后快：既然早就与夏言撕破了脸，此次如果不置他于死地，将来再来一次咸鱼大翻身，严嵩自己也会死无葬身之地。反正得有人死，与其让我死，不如让你死。于是，严嵩大肆在朝廷散布谣言，说夏言背地里诽谤朝廷（也就是诽谤皇上），同时指使别人告发夏言收受贿赂。嘉靖皇帝正在气头，听人说夏言背着他嗤咕自己，看夏言还得罪那么多人，于是，龙颜震怒。嘉靖二十七年，夏言被杀。从此严嵩再无对手，执掌大权达十五年之久。


    在这个案例中，夏言开始时被友情所操控，吃了大亏，这是一个极深刻的教'
  merge: -1
  img_proc: true
- pgno: 83
  md: '训；后来他对友情操控手段有了足够的认识和提防，这是可取的。可惜的是他的政治斗争手段实在不高明，而且偏偏生不逢时遇见了严嵩这个绝顶高手，无奈之下只好魂飞冥都，做个枉死鬼吧。


    言归正传。我们已经粗略了解了利用爱情和友情手段实施操控的方法。其实，利用感情实施操控，还包括利用人类的感情弱点、利用人类情绪等进行操控的手段。


    “喜怒哀乐悲恐惊”是人人都有णा。只要是凡人，就不会具备佛家的“不动心”的境界；既然动心，就有痕迹；既然有痕迹，人们就能够利用弱点实施操控。历史上真正厉害的角色是不动心的。


    高高在上的时候不动心，不沾沾自喜得意忘形；身陷图围时不动心，不妄自菲薄一蹶不振。但是，这样的高手毕竟还是少数，大多数人都会受情绪所制。因此，依靠感情实施操控就具备很大的空间，可以利用情绪对人实施操控。比如，人们生活中常说的“激将法”，就是利用人们争强好胜的心理来操控别人的。《西游记》中猪八戒智激美猴王，《三国演义》中刘备激张飞，用的都是这个方法。下面，我们结合案例，好好分析感情操控的妙用。


    战国时期有个著名的军事家叫吴起，他是一个善于利用感情手段操控别人的高手。作为一国统帅，他平易近人，与士兵同甘共苦；对手下将领关怀无微不至。全军将士 4 都甘于为他效命，虽死不惜。一次，他巡营时发现一个士兵患了疽病，正躺在床上疼痛难忍辗转反侧，医生和士兵聚在周围束手无策。吴起看到这个情况，不顾自己作为主帅高高在上的地位，不顾士兵身上疮疤发出的恶臭，低头就给这个士兵吮吸起来。如此这般，患者病痛减轻，竟慢慢好了起来。有人把这个事情告诉患者母亲，说：“大帅仁义，对你的儿子可真好啊”。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '乍一听，吴起对士兵果真不错。谁成想这老太太早就懂了吴大帅的这一套花活。她听了这个消息，放声大哭。旁人奇怪地问她：“你儿子好了你哭什么啊？”老大太啼哭着回答：“我儿子得病死了，灵柩还能送回来，我这把老骨头还能为他守守灵。他病好了，我不知道将来他会死在哪里啊。”乡人更加惊异，说：“你这位大妈真不像话，哪有诅咒自己儿子死的？”老太太哭得更凶，说：“您有所不知。当年孩子他爹就在吴将军手下工作，因为吴将军待他恩重如山、视如己出，孩子他爹无以为报，才上阵拼命杀敌，最后死在战场上，至今尸首都没找到。我一人守寡养儿不宜，孩子临走前特嘱咐他爱惜自己。如今，他在吴将军麾下，而吴将军又如此这般待他，将来他肯定会拼了命报答吴将军的。他的下场，我现在就已经知道了。”


    乡人听了，竟竟然说不出话来。史书上寥寥几笔，把吴起利用感情手段操控别人为己服务的本领一语道尽。


    唐大宗李世民也是个善于使用感情手段操控别人的高手。仔细研究李世民会发现，他以力较力、硬碰硬的时候少，借力打力、以柔化力的情形居多。他善于用感情手段笼络和驾驭部下，使其为自己的江山卖命。史载，开国功臣臣李勣病重，需要贵人胡须为药引子。太宗说：“要说贵人，朕是天下第一贵人。老李为我大唐江山社稷立下不世大功，难道朕还舍不得几缕胡须吗？”于是，亲自剪下一撮胡须交给御医。李勣听到这个消息后，强扶病体爬到太宗跟前，放声大哭，叩头不止，额上鲜血淋漓。太宗忙说：“你为大唐建了大功，朕理应如此。”后来李勣成了太宗的铁杆忠臣臣，死心塌地为李世民效命。


    从以上两个案例中可以看出，实施操控不一定要用命令和强迫甚至暴力的手段，感情手段也能达成目的。一般来讲，力能制人，不能制心。而感情手段虽柔，'
  merge: -1
  img_proc: true
- pgno: 85
  md: '但是却可以渗透到对方潜意识中，让对方心甘情愿俯首贴耳，乖乖为你效劳，甚至可以到了连死都不计较的地步。历史中那些柔性操控段位较高的选手，他们能够在随意挥洒之间，就让别人赴汤蹈火、两肋插刀；相反，如果要采取高压手段，其效果就未必如此明显。哪里有压迫，哪里就有反抗。压迫越是剧烈，反抗越是激烈。靠暴力压迫的手段不可能使别人真心实意地供你驱策。所以，用柔性手段，施展感情操控，要比其他方法效果好些。


    老子说："天下莫柔于水，而攻坚强者莫之能胜，以其无以易之。" 用了感情操控的方法，虽然手段柔和，但是，只要方向对头，几乎没有人能够逃脱。正如温柔乡能够葬送一代英雄的雄心壮志一样，温柔和睦的感情有时也可能成为一封送给敌人去问王殿的请柬。谋略中有一计叫"笑里藏刀"，讲的是对待敌人可以拔出刀子一刀将其毙之，但这还不是最好的办法。因为，要和敌人搏杀，总得经过一番激烈抵抗，结果很可能并不如愿，甚至还可能被对方反噬，所以最好的办法是马上和他结成兄弟，用感情手段操控他，使他对自己言听计从、信任不疑，然后，在他最软弱、最不设防和最松懈的时候，不费吹灰之力就可以将其一刀毙命。这就是"笑里藏刀"之计。不会感情操控，笑得再阳光、再灿烂也不会让敌人着了你的道儿，那么，也就无所谓什么动刀了。


    善于运用感情操控的高手，就如同一个太极高手，见招拆招，借力打力，四两拨千斤，驭人于无形。这样的高手从不与人争，但是又无人能与他争，从来不显示自己的重要。但是，因为人人与他关系都很要好，所以都离不开他。他从来不多说话，不炫耀自己，他沉默如同一座大山，但是，由于人人都依附在他身上，受他恩赐，吸他养分，所以他越不言，众人越敬重他；他越不炫耀，大家越是推崇他。在不知不觉中，大家都被他编入了一个大磁场，而他就是这'
  merge: -1
  img_proc: true
- pgno: 86
  md: '个磁场的磁极，手握天秤，将一动一静整个全局尽情囊括殆尽。其势能包藏宇宙，其胸能吞吐天下。感情操控手段如果到了此境界，当然就是不战而屈人之兵，不争而人自服。若此高手，夫复何言？


    所以，擅长感情操控就像学会了吸星大法，能将别人的能量和资源在不知不觉中吸走。说句实在话，单单学会了这一招，就已足够让大多数人陷进来。所以，感情操控是人搏斗于竞争场中必备之大杀器。我们把这个操控手段列为七种武器之二。


    # 3、收买手段


    对于大多数人来说，收买手段实在是太重要了。


    有些人不善用柔，因而无法用亲情和感情手段操控别人；还有些人心肠太软，刚性手段又不下狠心。但买卖和利益交换行为是贯穿于每个人的日常生活中的，运用利益交换的手段，以收买的方式来实施操控，则是大多数人都能理解和使用的方法。


    在详细介绍这个方法之前，先讲一个例子，让大家看看在人们心中，利益是何等重要。


    前文讲过，苏秦是战国时期著名的纵横家。他游说六国合纵抗秦，曾佩带六国相印，风光不可一世。之所以能够如此，当然在于他深刻明了人性，特别□人性的弱点。合纵失败后，他来到了齐国。当时的齐国是实力最雄厚的国家，齐威王和齐宣王非常赏识苏秦，希望靠他来谋求战国霸权。但是，齐王对苏秦的赏识却招致了齐国大夫们的不满。加上齐国不像秦国那样具有重用外人的习'
  merge: -1
  img_proc: true
- pgno: 87
  md: '懔，因此，苏秦在朝廷上处境险恶。终于，齐国统治阶级内部暗中派出刺客，把苏秦刺成重伤。刺客在成功行刺后，逃窜于茫茫人海。宣王立刻悬赏捉拿刺客，为苏秦报仇，却一时无法捉到。苏秦伤势已经很重，自度将不久于人世，乃设一计。临死前他对宣王说：“我死之后，求大王把我的头割下来悬挂在街头，对外宣称：‘苏秦私通外敌，替燕国做间谍。现在已经把他杀了，如果有人知道他的秘密来告发的，赏黄金一千两。’这样，就能够捉到刺客了。”言罢，泪如雨下，大叫一声身亡。齐王马上按照苏秦所说的办法办了。那刺客看了告示，觉得自己替国家除了间谍，是个国家英雄，而且还听说可受黄金千斤之赏，便公开露了面，齐王立刻派人把他抓住并处以死刑。于是，苏秦之仇得报。


    仔细分析这个案例，不用说，这杀手乃一介武夫，只知武勇，而无政治头脑。他在得到消息之后，并未仔细思考为何苏秦成了国家罪犯，也没弄清赏赐黄金千两的真正原因，被外在的假象所蒙骗了。反观苏秦，由于对人性太了解了，深知刺客此时必然躲了起来。要想杀他，第一件事就是必须使他放松警惕。于是建议齐王颁布假诏宣称自己有罪。另外，光使对方放松警惕还不行，必须能够吸引对方现身，否则就无法为自己报仇。所以，苏秦建议齐王以千斤黄金为饵诱骗刺客。想那刺客虽然近身搏斗、见血封喉的功夫强于苏秦，但是，他的权力斗争的头脑和心术却绝不是苏秦的对手。尤其对于人性“好利”的弱点没有苏秦把握得清晰明了，因此，不得不死在了苏秦的算计之下。苏秦的这一计，在一定程度上，就是利用了“利益”操控，具体说是“金钱操控”来实现自己的目的的。


    上面的例子说明了一个道理——人为钱死，鱼为饵亡。马斯洛说人的“生'
  merge: -1
  img_proc: true
- pgno: 88
  md: 理需求、安全需求、社交需求、尊重需求和自我实现需求”是人基本的需求，请亲爱的读者分析一下，这里的五大需求，又有哪一个能够脱离金钱？金钱不仅在人们的日常生活中非常重要，在社会竞争中更是感情的润滑剂，是人生的助推器，是成功与失败的试金石，利用金钱进行收买只不过是收买方法的一个手段而已。前面已经提到，利益不仅包括物质层面，也包括精神层面。对于“收买”操控而言，用“金钱”收买，使其为己服务是一种方法，使用“精神贿赂”是另一种方法，也能够使其为自己服务。
    当年汉刘邦要废太子，满朝文武都没有办法，刘邦的重要谋士张良进谏他也不听，可见是铁了心肠。吕后危在旦夕，不得不揍下脸来，去请教张良。张良以“皇帝家事”推脱，可惜吕后一直缠着他不罢手。吕后当年也是以毒辣著称，对付刘邦固然差点，对付刘邦的兄弟倒是颇有心得。我们看她杀韩信的手段，就已经清楚她的为人。此次她知道自己命悬一线，死活请张良给出个主意。张良无奈，不得不说出“商山四皓”的名字。原来，这东园公唐秉、角里先生周术、绮里季吴实和夏黄公崔广是当时天下著名的隐士，四人甘于贫困生活并不喜欢做官，为此专门写下了《紫芝歌》，曰：“莫莫高山，深谷透迥。咻咻紫芝，可以疗饥。唐虞世远，吾将何归？驷马高盖，其忧甚大。富贵之畏人兮，不如贫贱之肆志。”
    刘邦久闻四人大名，多次请他们出山，都被拒绝，但刘邦反而越发敬重他们。张良道，只要请出这四人，皇上一见他们与太子在一起，自然就不会再提换太子了。吕后用言大喜，于是派人去请商山四皓。
    谁知，当吕后派人去请商山四皓，信使去了许久竟然请不来。后来得知，四人脾气古怪，当年刘邦想方设法都请不来，何况吕后是以太子名义去请的。无奈之下，只好再去请教张良。张良骂：“哎呀真笨，请不来，难道还买不来么？”
  merge: -1
  img_proc: true
- pgno: 89
  md: '来者怿然大悟，于是备了厚礼，再往商山，“甘辞厚币”，终于请来了这四人。读者请注意，这里“厚币”的意思前面已经提了，无非就是给点钱，拿点好东西之类，给点好处罢了，里面也并没有太大的学问。“甘辞”的意思也很直白：所谓“甘”其实就是“甜”的意思，“甘辞”就是说好话，这个意思不难理解。但是，用“甘辞”操控竞争对手门道很多。我们知道，有的时候，不是凭钱就能解决问题的，还需要进行精神上的交流与沟通，特别是通过精神“贿赂”，才能够达成感情的良性互动。仅仅有金钱礼物，没有精神上的互动，则根本无法有效沟通。而且，这个世界上，即使你有钱，有许多事情也未必能办好；即使能办，也要付出巨大的代价。所以，往往有时候，通过精神上的有效沟通（也就是甘辞——说好话），就可以很省时省力地把事情办下来。厚币很重要，但甘辞更重要。古人把甘辞排在厚币前面，实在是很有道理的。如果在厚币的基础上施之以“甘辞”，那么，操控对方的赢面就很大了。


    总之，“甘辞厚币”就是物质收买与精神收买双管齐下，在物质收买的基础上对其精神进行地毯式轰炸，于是，故人就在我们的物质糖衣炮弹和精神糖衣炮弹面前乖乖缴械了。


    按着举上面的例子。话说刘邦急着要换太子，吕后在下面大做动作，请来了四皓。终于摊牌的那天到了。有一次，刘邦设宴，太子刘盈带着一帮白胡子老头走进来。


    刘邦看见感到很奇怪，便询问其来历，一问之下，大吃一惊。原来这四人就是自己屡诏不至的商山四皓。他很奇怪地问这四个人：“我请了多次你们都不来，如今怎么跟了我儿子呢？”四皓不慌不忙叩首谢罪，说：“皇上一向看不起儒生，经常骂不绝口，我们不愿受人侮辱，所以才远远地躲起来。今闻太子'
  merge: -1
  img_proc: true
- pgno: 90
  md: '仁孝，尊敬贤者，善待儒生，天下谁都想为太子效力，所以我们自愿前来。”


    我们仔细看他们四位说的这话，可知道他们“不愿受人侮辱”，所以甘愿放弃高官后禄而远远躲起来。而太子尊敬他们，所以愿意为太子效力。这也无非是讲，操控别人，并非给以高官、施以金钱就能够解决问题的。要收买对方，不仅要给这些，而且还要给尊敬，给善待，特别是给予精神上的温馨呵护。这就是收买操控法的真正含义。


    讲到这里，笔者再讲几句题外话。


    话说刘邦听了四个老头的话，不动声色，顺水推舟说：“那就请你们费心辅佐太子吧。”宴会罢，刘邦回到后宫，见了母子俩，便说刘盈有这四个老头帮忙，如今人心归附，羽翼已成，势难再动。为此，不得不打消改立太子的念头。否则，将引起天下动荡，那大汉江山可就危险了。


    然而，刘邦的确非常喜爱戚夫人和赵王如意。而且，刘邦是靠与人打交道起家的，他和吕后多年夫妻，当然很明白吕后的凶狠和毒辣。想到自己百年以后，母子俩恐怕难逃吕后毒手，刘邦不禁心里疼痛难忍。戚夫人执爱自重，发动枕头攻势，到现在已经彻底破产了。她也很了解吕后的为人。此次已经撕破了脸，刘邦死后，自己和儿子是绝对不会有好果子吃的。想到此，也流泪不止。刘邦英雄末路，无力回天，于是勉强劝道：“算了，以后再说吧。你为我跳楚舞，我为你唱楚歌。”戚姬无奈，悲痛之下，为刘邦跳起了舞蹈。看着自己心爱的人心痛万分的模样，刘邦唱“鸿鹄歌”，云：“鸿鹄高飞，一举千里。羽翼已就，横绝四海。横绝四海，当可奈何！虽有缪缪，尚安所施！”歌曲的意思是，太子的羽翼已经丰满，如今我也无可奈何了。刘邦唱了一遍又一遍，与戚夫人相对泪下，情不自已。'
  merge: -1
  img_proc: true
- pgno: 91
  md: '看到了这里，读者一定觉得这个场景很熟悉，项羽和虞姬也是跳舞。对了，当年刘邦派韩信十面埋伏，项羽为心爱的女人作《垓下歌》：力拔山兮气盖世，时不利兮骓不逝。骓不逝兮可奈何，虞兮虞兮奈若何”。同样的英雄末路，同样的无力回天。政治斗争是残酷的，才过了没多久，当年政治斗争的胜利者已经成了政治斗争的失败者。木必先枯而后重生，花必先荣而后凋谢。刘邦荣华了半生，老了之后，竟然竟然连自己心爱的女人都保不住，不得让我们暗叹权力斗争的残酷性。不过，得意安然，必先退之；失意泰然，必得奋之，这原也是天地间的常理。江山一代一代，后浪前浪，汹涌不止。刘邦的失败，原也在情理之中。只不过张良出的这条计策太过毒辣，这一文弱书生轻轻一动头脑，就已让当年以厚黑名世、扫尽一切人伦、踏碎一切神圣的刘邦涕泪齐流，心力衰竭。看到此时，人们不得不再次目睹斗争的残酷，同时也会再次感叹操控之术的重要了。言归正传。在历史中，利用收买手段进行操控的例子比比皆是。下面，我们用隋朝杨宽的案例作进一步的说明。


    话说隋朝杨坚称帝之后，依照历朝惯例，将长子杨勇立为皇太子，同时将其余四子封为藩王：次子杨广为晋王，三子杨俊为秦王，四子杨秀为蜀王，五子杨谅为汉王。这秦王、蜀王和汉王还好说，那杨广可是一个野心很大的人，一心想取杨勇而代之。


    但是，要想获得权力这一稀缺资源，尤其是皇帝宝座这一更加稀缺的资源，仅仅依靠一个人单打独斗是绝对不行的。当时晋王杨广正镇守扬州城，他与宇文述交往密切，基本上可以算作一党，因此，他拉拢宇文述为其卖命。待到确立了操控宇文述的目标后，下一步就是展开行动，步步为营，直到把宇文述拉到自己的阵营里面来。'
  merge: -1
  img_proc: true
- pgno: 92
  md: '于是，杨广上奏，要求封宇文达为寿州刺史总管。明眼人已已经看出来，这是杨广收买宇文述的一个香饵。宇文述封了官，也知道自己靠谁才得到此位，理所当然把杨广视为恩主。杨广一见到时机已到，便蛇蛇蝎蝎地把自己的意思暗示出来，请宇文述为他出谋划策。


    吃了人家的嘴软，拿了人家了手短。已经收了钱，受了礼，就得替人家办事。黑道上都知道拿人钱财替人消灾，更何况一向以公正严明自诩的官场。


    按照《隋书·宇文述列传》记载，宇文述弄明白了领导杨广的意图后，就对杨广说：“皇大子失爱已久，令德不闻于天下。大王仁孝著称，才能盖世，数经将领，深有大功。主上之与内宫，咸所钟爱，四海之望，实归于大王。然废立者，国家之大事，处人父子骨肉之间，诚非易谋也。然能移主上者，唯杨素耳。素之谋者，唯其弟约。述雅知约，请朝京师，与约相见，共图废立。”意思是说，太子位子不稳当，殿下您有机会。但是，要想更立太子，我们还得继续继续下一步的工作。皇上听宰相杨素的，而杨素又听他弟弟杨约的。我们搞定了杨约，就
    esta??? 意思说，太子位子不稳当，殿下您有机会。但是，要想更立太子，我们还得继续下一步的工作。皇上听宰相杨素的，而杨素又听他弟弟杨约的。我们搞定了杨约，就可以搞定杨素；搞定杨素，就可以搞定老皇帝；搞定老皇帝，那太子的位置，自然就是您的了。当然了，宇文述这一系列动作都是以经济基础为前提的。


    历史记载，杨广是个风流儒雅的人。既然风流儒雅，就必然花钱如流水，因此，除去广筹资金外，惜财吝啬，想必也是应有之意。可以猜想，虽然杨广花钱肉疼，但在宇文述的开导下，他也明白了“眼下虽然花去大量银子，但是，不日当上了太子，杨家未来的花花江山就是您的了，那时就可以富有天下”的道理。于是，杨广大喜，当即让宇文述带了大量财宝进京。这是开皇二十年的事情。'
  merge: -1
  img_proc: true
- pgno: 93
  md: '杨广用收买的方法而不是强迫的方法使得宇文述愿意死心塌地为杨广卖命，这是本案例中收买的第一个环节。接下来，需要进行第二个收买环节。我们看看宇文述如何双管齐下，大展金钱外交攻势，拿下杨约、杨素，顺利完成杨广交给予任务的。


    宇文述到了京城，找到了大理少卿杨约。杨约是当朝宰相杨素的亲弟弟，杨素凡有所为，都先与他商量，然后再去做。宇文述摸清了情况后，就多次借故宴请杨约。历史记载，杨约好赌，宇文述便在宴会后与杨约赌博，乘机偷偷大出老千，将珍宝尽情输给杨约。杨约为人贪财，本来就对宇文述带回京的珍奇宝玩欣赏不已。但是，他也不是简单人物。刚开始喝多了玩，玩了赢，无非是主客博一笑而已。后来次数多了，赢了宇文述大量金钱和珠宝，杨约警觉起来。他问：“您怎么有那么多珠宝啊？”宇文述回答说：“此晋王之赐，令述与公为欢乐耳。”就是说，这是杨广命令我特地送给你的。杨约听了以为中了别人的圈套，于是大惊失色道：“究竟是为了什么呢？”宇文述回答说：作为大臣，操守良好、尽忠报国是人臣应该做到的，但是，真正聪明人，不仅能够履行正道，而且能够根据事物的变化，作出通达的变化，不拘泥于法。古往今来，凡是有作为的君子，无不适应时事，随机应变，以保全自己。你和你哥哥都是非常聪明的人，为国家建立了伟大的功业，功名盖世，乘公报国，已经执掌大事很长时间了。您和令兄固然心底无私，但是，在朝廷之中难免会得罪人，而且，执政年月越长，得罪的人越多。现在，太子心里有想法，却根本没法执行，所以太子对令兄弟
    statuses 深恨已久啊。您和令兄虽然受爱于皇上，但是，想要扳倒你们的人也很多啊。假如有一天皇帝一旦龙体归天，那时还会谁来庇护你们兄弟俩呢？太子是皇帝立的，你对他又没有什么好处，等他当了皇帝，显然你们俩'
  merge: -1
  img_proc: true
- pgno: 94
  md: '不会有什么好下场。幸亏现在太子不受皇后喜欢，皇上又一直都听皇后的，所以皇上有废黜太子的想法，这事您也知道。现在，如果您的兄长杨素宰相能够说句好话，请求皇上立晋王杨广为太子，那么；晋王必定非常感激你们兄弟两个。那时，“则去累卵之危，成太山之安也”（《隋书·杨约列传》）。宇文述的话是一篇好说辞，如果他仅仅拿着东西去见，不用精神贿赂大戴高帽，讨不到杨约的欢喜，照样办不成事。这是收买的第二个环节。


    杨约仔细想了一下，认为他说的有道理，于是去找他哥哥杨素。杨素官居宰相，朝廷的动态、官场的斗争早就是行家里手，对太子杨勇不受宠爱也非常了解，寻找“下家”的愿望原本也很迫切。无奈有些事情明明如此想，却是不能说出口的。他听说杨广派来的人和自己的弟弟接上了头，这条路子走通了，当然大喜。杨约操控杨素的方法，就是前文提到的亲缘手段，这里不作详细分析。但是，这个环节是整个计划中至关重要的一个环节，也是打通杨广杨素关系的
    最关键的节点。


    此后，杨广为了早日实现夺储计划，更是展开了前所未有的“收买”攻势。他将长女南阳公主许配给宇文述的儿子宇文士及，先后贿赂宇文述财物无数。并且，在宇交述的帮助下，给杨素兄弟提供了大量的金钱炮弹。(历史还记载，独孤皇后为了立杨广，也赐给杨素许多财物。这杨素果然老道，吃了“原告”吃“被告”，详情读者可以参见《隋书》，这里不再赘述。)于是，第三步收买计划完成。在与杨素兄弟的合谋下，终于在开皇二十年十一月，太子杨勇被废黜，晋王杨广被立为皇太子。


    现在让我们回过头来，看看整个事件的流程。杨广→(收买)→宇文述→(收买)→杨约→(通过杨约收买)→杨素。在这个过程中，杨广虽然干得很艰苦，'
  merge: -1
  img_proc: true
- pgno: 95
  md: '但操控手段很成功。


    其实，我们不必高估杨广的学识。他之所以成功，并不一定在理论上搞明白了“收买”操控的原理。不过，既然有了想法，又有许多金钱，当然可以不停地试，直到成功。无论如何，杨广在整个操控过程中，付出的是物质资源和精神待遇，换来了一连串人的归附。虽然历史上杨广是一个反面人物，而且他的操控过程未必是理性的认识的产物，但这并不妨碍人们研究他在整个事件中的操控之法。


    # 4、说服洗脑


    上文已经说了，希特勒组织纳粹党，吸收大众，进行宣传，凭的就是说服和报纸，一张口，一支笔。据报道，当年进攻苏联的那些德军，在冰天雪地中爬在战壕里哆哆嗖嗖发抖的时候，从广播里听到希特勒的演讲，“有如电击”，振奋不已。从这里我们可以看出说服洗脑手段的功效。


    首先举个案例，让大家看清“说服”操控的真谛究竟何在。


    话说曹操的儿子曹植七步成诗，文思敏捷。他的哥哥曹丕无论文采还是天分都远远落后于曹植。因此，曹操想要废曹丕而立曹植。一废一立，各有利弊。曹操心里反复斗争，还是定不下来。这天，曹操把谋士贾诩叫进宫来，屏退左右，说起自己的打算，问贾诩有何看法。


    贾诩是曹操身边很厉害的谋士，但是他的伪装很深，并没有让曹操看出他其实是个太子党。曹丕在与曹植的立储斗争中落了下风，很恐慌，就跑去向贾诩请教办法。贾诩建议他加强自身道德气度的修养，躬行寒士的学业，夙兴夜珠'
  merge: -1
  img_proc: true
- pgno: 96
  md: '孜孜不倦，不违背人子之道。贾诩的建议是一种以静制动、守而不失，以待可趁之机的高明斗争技巧。由此可见，贾诩其实是偏向曹丕的。


    可以，虽然心里这么想，嘴上却不一定要这么说。历来在立储的问题上，不知道栽了多少名臣。况且“疏不间亲”，你不知自己哪句话说错了，就会导致杀身之祸，这是一层意思。另外，曹操之所以左右为难，是因为两个人都有他中意的地方。如果贸然肯定曹丕而否定曹植，就相当于他贾诩直按否定曹操的一部分想法。那结果很可能引发曹操的逆反心理。那样，曹操就会问：“曹植为何不行？”这样，可能导致曹操的抵触情绪，因此，这不是最好的方法——最好的办法就是让曹操自己琢磨过味来。


    闲话休提。曹操问完贾诩之后，期待贾诩给他回话。这贾诩老奸巨滑，一脸沉思状(其实早就想好了)，半天也不吭气。曹操见他不说，又问他。他还是咬牙不说。曹操急了，说：“我问你半天，你也不回答我的问题，这是为什么啊？”——注意，曹操已经上了套了。贾诩慢慢悠悠回答说：“我在想一件事，想得出神，因此没有回答你的问题。”曹操又上了套，问：“你在想什么事啊？”贾诩又沉思半晌，等到吊足了曹操的胃口方说：“我在想袁绍、刘表父子的事呀。”袁绍、刘表大家都知道，这两人英雄一辈子，都因为废长立幼，结果把自己多年打下的江山丢掉了。而这两个人的江山又都是毁在曹操手上的，因此曹操对此事感触很深。贾诩点出这两个人来，非常巧妙地传达给曹操立曹丕的意思，但是，他引而不发，等待曹操自己悟出这个道理来。果然，曹操一听，马上联想起袁绍、刘表家败人亡的旧事来，同时也明白了贾诩的心思。于是他哈哈一笑（此笑并非惯常假笑），从此定了决心，再也不提废曹丕、立曹植的事了。曹操立储的例子表明，在激烈的政治斗争中，如果你看不懂，那么千万不要多'
  merge: -1
  img_proc: true
- pgno: 97
  md: '说，否则可能要付出惨重的代价；如果你看懂了，一定要巧说。如若不然，强逞口舌之快，很可能给自己埋下致命祸根。之所以会出现这种现象，是因为权力斗争是最激烈、最复杂的斗争，也是得利最大的斗争。在权力斗争中，些微细小的错误，都可能导致万劫不复的恶果。所以，如果说服洗脑运用得好，是可以操控竞争对手，所向披靡的；相反，如果运用得不好，那么，还不如三缄其口来得保险。


    关于说服和辩论，历来有许多参考书籍可以学习，其间的口才技巧也数不胜数，演讲书上都已写得明明白白。在这里，笔者准备结合史实，对运用说服手段实施操控谈点浅见。


    前文提到，“有”有“有”的好处，“无”有“无”的好处。运用这个逻辑研究说服操控可知，在人们用“说”的手段来服人的同时，也绝不能够忽略“无”的妙用。


    首先，要想以理服人，必须正确把握“说”和“不说”。


    读者万万不要以为说服操控，就是把自己的理由滔滔不绝地灌输给对方。固然，要说服别人，归根到底还是离不开“说”，但不说，同样也是说；有时候，不说能取得比说还好的效果。


    比如，要说服对方，不一定要耳提面命；有的时候，身教胜于言传。再比如，想要驳斥对方，不一定要面红脖子粗地与竞争对手声嘶力竭地辩论；适当的沉默，往往会令对方不知所措。动辄滔滔不绝，比不了“万言万当，不如一默”。学会了什么时候说，什么时候不说，这就懂得了有和无在“以理服人”中的妙用。正如管理的最高境界就是不管一样，说服的最高境界就是不说。个中道理非常微妙，为方便大家参详，有段轶史“不得不说”。'
