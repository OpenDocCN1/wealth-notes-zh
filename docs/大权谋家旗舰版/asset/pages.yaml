  md: '的做法就是调整好心态，以这个礼品为敲门砖，再通过平时向领导靠拢和提高对领导权力的服从度，也就是工作中对上级领导的支持，让他看到你真在的忠心，这样在以后有机会的时候，他再来提拔你。


