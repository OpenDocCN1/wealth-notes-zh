  img_proc: true
- pgno: 207
  md: '故事，就是一个志同而交的典型案例。


    春秋时期的政治家管仲和鲍叔牙，他们俩是好朋友，有着共同的理想和追求。

    当时，管仲比较穷而鲍叔牙比较富，但他们之间彼此了解、相互信任。管仲和鲍叔牙早年合伙做生意，管仲出很少的本钱，分红的时候却拿很多钱。鲍叔牙毫不计较，因为他知道管仲的家庭负担大。有好几次，管仲帮鲍叔牙出主意办事，反而把事情办砸了，鲍叔牙也不生气，还安慰管仲说，事情办不成，不是因为你的主意不好，而是因为时机不好。管仲曾经做了三次官，但是每次都被罢免，鲍叔牙认为不是管仲没有才能，而是因为管仲没有碰到赏识他的人。管仲参军作战，临阵却逃跑了，鲍叔牙也没有嘲笑管仲怕死，他知道管仲是因为牵挂家里年老的母亲。齐桓公当上国王之后，想让鲍叔牙当丞相帮他治理国家。鲍叔牙大力举荐当时还被囚禁在鲁国的管仲，说：“治理国家，我不如管仲。管仲宽厚仁慈，能够理政治军，这些我都不具备。所以陛下要想治理好国家，就只能请管仲当丞相。”齐桓公不同意，他说：“管仲当初射了我一箭，差点把我杀死我不杀他就已经便宜他了，怎么还能让他当丞相？”鲍叔牙说：“贤明的君主是会不记仇的，又何况当时管仲是在为王子纠效命。如果一个人能忠心为主人办事，那他也一定能忠心地为君王效力。陛下您要想称霸天下，没有管仲就不能成功。所以您一定要任用他。”齐桓公终于被鲍叔牙说服了，把管仲接回齐国。管仲回到齐国，当上了齐桓公的丞相，而鲍叔牙心甘情愿地做管仲的助手。在管仲和鲍叔牙共同的努力下，齐国成为当时诸侯国中最强大的国家，齐桓公成为当时诸侯王中的霸主。


    鲍叔牙死后，管仲在他的墓前大哭不止，想起鲍叔牙对他的理解和支持，他感叹说：“当年，我辅佐的公子纠失败了，别的大臣都以死效忠公子纠，我却'
