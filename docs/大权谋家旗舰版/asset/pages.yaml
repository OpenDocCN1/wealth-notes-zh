  md: '肝肠。于是，宫中政变，何进被砍作两段，其头如球，飞出宫门，想来当时的情景定然煞是好看。可怜这个令人又好气又好笑的何进，本无才能，冒秽大位，身死富官之手，最后落得荣华富贵一场泡影。


    却说无谋何进受诛，何后母子也跟着倒霉。少帝先被太监劫持，被夺回之后，又被董卓所废，最后被害死。何后更不用提，当然也就跟着失势了。从博弈学的角度来衡量何后的做法，她依托亲缘手段驾驭亲兄弟为自己效力，这自然是对的。但是从经济学的角度来看，即使运用亲缘手段来实施操控，也不能被亲情蒙蔽了双眼，滥用亲人，特别不能用那些尸位素餐和烂泥巴扶不上墙的人，否则，就很可能坏了自己大事。想那武则天当年登上皇帝宝座，也是势单力孤，虽然她也极力提拔自己娘家的人作外援，用亲情控制武家子弟为其服务，但是，她对武氏子弟并不过分倚重，反而重用那些有才能、能办事的大臣。因而，武则天没有走上何后的老路，也没像何后那样被人迅速端了老窝。


    言归正传。以亲缘手段操控别人为己服务，因为彼此都是亲缘关系或类亲戚关系（这一点在后文有详细解释），所以，利益冲突要比外人间的冲突少些，彼此之间拥有更多包容。因此，用亲缘关系操控别人，具有较高的回报率，也具有较大的安全性。


    依靠亲缘关系实施操控是一个很好的方法。现在我们把眼光深入到历史中去，在亲缘控制这个角度进一步挖掘，还可以发现更多新的东西。


    比如，利用亲缘关系操控，其对象不但可以是与自己有亲缘关系的人，还可以是对方的亲人。就是说，还可以利用此手段，通过操控别人的亲缘关系，借力打力，以别人的亲缘关系来操控其人。假如想要控制某人，但是却无法找到有效方法，此时，不妨先通过手段操控其至亲，然后通过此途径进而操控目标。'
