- pgno: 262
  md: '位置，不过本案例是说他年轻时候的反面故事，放荡不羁，持才傲物的个性在职场上悲惨遭遇。


    仔细看这段材料，欧阳修和尹洙当时都很有名气，注意，有名气和能不能被体制所用是两个概念，对统治者来说，你有本事，但是不能为我所用，就毫无价值，而且你的存在还会给其他人不良的榜样，也就是不配合统治者也能有很高的名望，变相鼓励了其他人不甩统治者。所以，周朝当年建国后，对于几个不听招呼的名士，姜子牙直接把他们杀掉了。


    欧阳修和尹洙当时都是文人，用现在的话说就是知识分子。知识分子为了体现自己的特立独行，他们总是有一些嗜好，这个嗜好经常表现为持才放纵，喝酒喝到醉生梦死，所以伟人才会说“知识分子都是臭老九”。


    如果说，钱惟演作为老上司对于欧阳修和尹洙还有知遇之恩的话，那新上任的王曙就没有那么多感情的牵挂了，而且往往因为你是前任领导的人，说不定还要想办法把你排挤走，这样才好安排自己的人。这时候欧阳修和尹洙还没有这样职场政治敏感性，还是一味保持自己的这种特点，这个行为就已经决定了他必然会和领导发生冲突。


    所以当王曙告诫欧阳修和其他人时候，他是寻找了一个宽准的案例。这个案例不一定非常准确，但是因为王曙是领导，所以他说的就是真理，不接受反驳；所以其他人都应声了，就只有欧阳修出来当众反驳了。注意，这个反驳可以说是严重违反了权力的权威性，就算是对的，你也会影响领导的伟光正的形象，以后领导都没法管理这个团队了，所以欧阳修这样做是权力大忌。


    而作为领导的王曙这时候体现出了高超的政治素养，他听了欧阳修的反驳后沉默不语。我相信他的直觉是想反击的，但是因为碍于自己是领导，如果直接'
