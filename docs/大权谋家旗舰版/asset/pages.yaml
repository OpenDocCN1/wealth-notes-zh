  md: '是暗箱操作，暗箱操作就是不公平，那就是有违社会道德，但是如果你不提前运作，利益越大，盯得人越多，对招标人来说就越没法控制。有人就要说，为什么要控制？很简单，内部人也需要实现自己的利益。


