- pgno: 178
  md: '于是刘邦当天就任命陈平为都尉，并让他做参乘和典护军。都尉是一个比较高的官位，刘邦手下的不少将领都吵起来。他们都说：“大王刚得到楚军的一个逃兵，还不知道他的底细和本领高低，就与他同乘一辆车子，还让他反过来管我们这些老将。”从这些话中，可以反观刘邦的识人之术要远远高出他手下的武夫。


    “以言识人”的具体运用之术，《鬼谷子》中有详细的介绍。其“开盍之法”可以用来作为人们“以言识人”的理论依据。归其总旨，可以通过言语挑之，让对方说出自己的想法，这就是“盍”，用阴柔之法引出对方；可以用言语堵之，激起对方的情绪，让对方表露出真实的想法，这就是“开”，用阳刚之法识别对方。当然，许多人都是言不由衷，见人说人话、见鬼说鬼话的，这就更需要人们善于通过他人的言谈来观察和识别其人。


    # 三是以事识人。


    这个方法就是通过对方的行止，或者通过观察对方的所作所为，以此来识别对方其人其思。这个方法是一个常识性的方法，历史上有很多“以事识人”的案例。


    明朝有个著名的大叛徒洪承畴，他在与清军作战时被捕。皇太极听说之后大喜，就派了一个人去劝降。这个人，就是范文程。


    范文程是谋略史上非常著名的人物，其详情留待后文交代。先说范文程劝说洪承畴的故事。话说范文程领命提审洪承畴，对他客气地劝坐。洪承畴见到范文程，破口大骂范文程身为汉人却替异族做官，背叛祖宗，为人不齿。之后，又大骂清军残暴，令百姓生灵涂炭。在整个过程中，洪承畴表现得大义凛然、极富气节。刚才我们说了，范文程是个谋略大家，他在洪承畴发飙的整个过程'
  merge: -1
  img_proc: true
- pgno: 179
  md: '中，默默无语，


    一言不发。等到洪承畴骂得筋疲力尽了，他才说：“先生为什么不坐下歇口气呢？”洪承畴气得直翻白眼，却也无可奈何。范文程等他平静了些，就装作什么事都没发生过，跟洪承畴闲聊起来。范文程是个饱学之士，言谈儒雅，与洪承畴聊得很欢。正在聊天时，从房梁上偶然落下一片灰土，恰巧落在了洪承畴的衣服上。洪承畴皱皱眉头，立刻把灰尘拍干净。聪明的范文程立刻看懂了洪承畴的心恩。


    范文程回到皇太极那里，禀报说：“洪承畴是个怕死之人，可以劝降。”皇太极问为什么？范文程说：“如果洪承畴视死如归，那么他就不会把其他事情放在眼里。他连自己的衣服都爱惜，那他对生命肯定看得更重。”皇太极听了之后非常赞同，于是亲自去监狱看望洪承畴，并脱下自己的貂皮大衣给洪承畴穿上。洪承畴一方面爱惜自己生命，另一方面对皇太极心存感激，于是投降皇太极。之后，洪承畴引清军入主中原，为清朝的建立立了大功。


    当然，这个故事还有许多不同的版本。有人说皇太极是派他的妃子用美人计降服洪承畴的。尽管具体过程可能有出入，但是范文程通过一件小事就看穿洪承畴为人的事却是史实。这个案例表明，“以事识人”是一个非常重要的识人之法。


    所谓“路遥知马力，日久见人心”。人心是看不见的，而真正的高手就是具备看穿抽象事物的能力，能够从抽象事物的具象中看出事物的规律。通过事情验证对方人品和真实想法，这是识人的不二法门。


    # 四是以人识人。


    以人识人也是识人之法。这个方法的道理也很简单，就是通过对方经常接触'
