  md: '日后曹操为甄宓写的洛神赋中提到："翩若惊鸿，婉若游龙。肩若削成，腰如约素。延颈秀项，皓质呈露。芳泽无加，铅华弗御。云鬓峨峨，修眉联娟。丹唇外朗，皓齿内鲜，明眸善睐，靥辅承权......"
    ，可见甄宓的美是符合文人的审美的，曹氏三父亲的内心其实都有浓厚的文人的气息，所以必然都非常喜欢这样的女子。


    时至今日，《洛神赋》电影电视剧一直在翻拍，证明洛神（甄宓）的影响力已经穿越了一千多年，几乎到了和四大美女相同的地位。


    战争是资源掠夺的一种形式，美女更是一种稀缺资源，随着袁绍在战争中的失败，甄宓必然会引起强烈的争夺。那本文就是来分析一下，曹丕是如何在这样的无形的竞争中胜出。


    有人就要说了，内部的竞争不算竞争，商量着解决就好了。其实不然，不同于外部斗争直白的打打杀杀，内部的竞争更具艺术性，因为竞争的参与方不能撕破脸皮，往往还不能用武力，所以内部竞争的胜出者往往水平更高。


    我们现在就来分析一下曹丕在曹操虎口下夺取甄宓的手法：


    # 一、耳目系统


    这段材料里面我们隐隐然已经知道曹丕在组织内部已经有了耳目系统，曹丕知道战争的进程，也知道战争能获得的战利品，从而决定自己的取舍。要记得在组织内部，一把手是非常忌讳潜在的接班人拉帮结派。因为如果一旦对方急着上位，自己可能就会有性命危险，为了夺取最高权力，什么父子、夫妻、兄弟之情都不会放在眼里的。


    # 二、把握时机


    这里面实际上存在两个时机。首先，趁着曹操在战场上做扫尾工作，还没空'
