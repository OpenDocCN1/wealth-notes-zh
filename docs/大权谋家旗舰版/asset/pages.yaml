- pgno: 121
  md: '者那里被正确翻译出来；如果威慑方的实力和决心，没有让对方获得，或者对方并未获得威慑方的准确信息，那么同样不能构成有效的威慑。所以我们说，信息通道是否畅通，是关系到威慑能否成功的关键一步。当年垓下之围，为了动摇楚军军心，汉军四面围定大作楚歌。通过大唱“楚歌”一方面勾起了楚人的思乡之情，另一方面，也极力展示了汉军的的强大。果然，楚军“夜间汉军四面皆楚歌”，吓得项羽大惊，说：“汉皆已得楚乎？是何楚人之多也！”汉军的楚歌，竟然让一向狂傲自大的项羽惊慌失措，误认为汉军已经攻占了楚地，从而在项羽心目中放大了汉军实力，并进而打击了项羽的信心。汉军策动的这次攻心战，以“歌曲”为渠道，穿越空间，直达楚营，就如同一个今天的阵地广播一样，动摇了楚军的军心，对项羽及楚军产生了极大的心理威慑作用。我


    # （3）威慑手段的运用


    就威慑手段运用的大要来说，一般有两种情形：一是实施主体为强有力者，此时施展威慑手段，不用讲什么谋略，只要把强大的实力展示给对方就可；另一个是实施主体为实力弱小者，或者实力虽强但并不能有效威慑者。此种情况下，则必须借力，通过巧妙地运筹和谋略，欺骗对方，使对方对自己的实力信以为真，并甘心屈从。实力强大，直接示之以形，这没什么理论深度，只要把握前面说的实力、决心和传递决心即可。下面看个案例：


