- pgno: 323
  md: '# 一、保护


    刘太后不想自己身边人犯错，毕竞他犯错误，如果传出去，对自己也不好。就如人家会议论，你作为领导识人不明，影响自己的权威。而且刘太后非常了解雷允恭，是一个贪财的，负责工程容易出问题，就像你让老鼠看大米，孙悟空守蟠桃园一样。


    # 二、假装


    刘太后内心已经想要除去雷允恭，而可能让其他人私下拱火，让雷允恭主动提出做这个工程，然后刘太后先是假装不允许，然后在再三哀求之下允许了，但是允许的前提是给你打过预防针了，以后你犯错误不要怪我不客气。


    当然还有一种情况，就是真的如材料所说，刘太后被雷允恭求的没办法，只好顺水推舟，但是这样其实给刘太后内心埋下了一根刺。因为刘太后的权力感觉是被挟制了，所以我们一般做下属的，不要勉强去做某件事。当然刘太后应该不会料到雷允恭胆子大到敢于更改大家已经定下来的墓穴的位置，这里肯定又涉及到一大笔回扣等油水。


    在这里有人就会说了，其实本案例没有你说的那么复杂，只是事情发展的必然而已。其实我们要知道，做下属的，贪污一点，如果你在维护领导的权力安全，他可能也会睁一只眼闭一只眼的。如果你影响了领导的权力安全，那领导是想办法要来处罚你的。


    所以，做领导的，怎么控制下面的员工，除了培养他的能力之外，还要善于控制他的缺陷。通过工作安排放大他的缺陷，等这个缺陷触犯法律后，你可以作为把柄来敲打，也可以直接用这个把柄来除掉他；所以管理者对下属的缺陷养成也是领导学秘密学问，如果不知道，那就很难控制整个组织。'
