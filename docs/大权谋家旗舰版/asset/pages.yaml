- pgno: 40
  md: '不管是商鞅、韩非、李斯，最后其实都是死于权谋家手里，只是对手更有权势，更有权谋手段而已，所以成功者其实也是权谋家，不过他们美化了自己，让我们观众不觉得他们是权谋家。


    在现实中，很多人受权谋人士所害，所以非常痛恨权谋，也巴不得用权谋的人早点失败，自己早点能翻身做主人，但这就犯了一个最大错误，就是希望世界以自己认为的规则来运行，如果一旦进入了这样的思维模式，那几乎就很难进步了，因为你的读书已经不需要联系事实了，每个事情只要想当然就可以了。


    权谋只是一把刀，本身没有是非好坏，自己回避不用，那别人就要用这把刀来砍你，而如果我们学了权谋，至少你可以防身，不会被权谋家所害还傻乎乎地帮权谋家数钱。


    # 你的命运到底是哪些因素决定的？


    现实中看到很多朋友在工作和生活中遇到困难的时候，很容易就到寺庙里面拜一拜，找个算命先生算一算，希望用这些来消除这些不顺，让工作生活重上正轨。


    本文要说的是，这样其实根本没有用，通常效果还适得其反。


    我们来看决定一个人命运的几个因素：


    # 一、出身


    这个社会，如果说是耍人人平等，那只有在还没有投胎的时候是平等的，一旦投了胎，每个人就不平等了，你的命就已经定了，定在和你父母一样的阶层，而你父母的阶层是被整个社会的权力结构体系所决定的，这个我们无法选择，'
  merge: -1
  img_proc: true
- pgno: 41
  md: '毕竟绝大部分人生下来就是韭菜的命。


    # 二、价值观


    你出生后，你的父母就不知不觉给你灌输价值观，而当你慢慢长大，你周围的亲戚朋友又在不断给你灌输他们的价值观，而这些价值观是潜移默化的，甚至在不知不觉中就已经改变了你的思想。价值观是我们来到这世界之后所要走的路的一个基础，这就是运。人们都容易把运气挂在嘴上，其实气是我们自己掌握的，也就是说，命运靠自己掌握。


    # 三、选择


    价值观本身不会决定你的运，而是价值观所决定你在碰到问题时候的取舍，而这个取舍的累积就变成了你现实的命运。所以只要你价值观已经定了，你的命运就已经定了。就算推倒重来，还是这个结果。不过这个对我们来说，也是求仁得仁、心想事成、咎由自取。譬如你选择了感情，那就肯定不能考虑利益了，如果你考虑了利益，那感情就可能要被伤害了，两者很难兼得，而且往往我们想要兼得的时候，那往往什么都没有得到。


    如果自己相信了那些江湖术士、走方郎中，他们本身就是看你的反应给你看相。换句话说，他对你的理解除了观察就是推断，给出的建议往往是模棱两可（如果确定，那错了就砸了招牌），让你自己理解，而你认为很多，但往往又失之毫厘谬以千里。试想这样的建议肯定不会帮到你，还会让你坚持自己的错误，反正这些术士的收入已经落袋为安了，你的结果和他没有关系，大不了他换个地方重新开始。


    综合以上因素，你就可以看到，看似我们的命运有很多种发展方向和选择，其实你来到这个世界后，如果没有遇到明师和机缘，那你只能一直在自己的底'
  merge: -1
