- pgno: 205
  md: '体上说，来俊臣圆满完成了武则天交给他的车制诸大臣和宗室皇亲的任务。他用的告密和酷刑之法也非常奏效。仅从名字上看，以上的刑罚就足以让人求死不能了。当然，武则天利用来俊臣等之后，又翻过脸来把来俊臣打翻在地。来俊臣被斩首的那天他的仇人争着吃他的肉，转眼就吃完了；有的人挖他的眼，剥他的脸皮，挖他的心脏，最后把他踩成了肉泥。


    # 用近臣治权臣：


    在古代专制的权力体系中，没有什么比保住自己的权力更重要了。在历史上sole，曾有过无数一家独大的权臣作乱并最后篡位夺权的案例。所以，为了确保统治，历史上大多数帝王都会倾向于把自己身边最亲近的人派遣到权力体系中去，借助这些人来制约权臣，以防止大局失控。利用近臣治权臣的例子有很多。历史上，皇帝最常见的就是用皇亲、外戚和宦官来车制权臣。在这里，宦官是不少皇帝的首要之选。由于宦官从小陪伴皇帝玩耍和长大，要说亲近，当然是宦官与皇帝最亲。我们看中国历代帝王中，除了少数头脑清楚的以外，大多数都或多或少重用过太监。有明一代，则是宦官治权臣相当发达的时代。为了避免权力转移，明朝有很多皇帝让太监掌握很大权力，以此来制约外面的权臣和众大臣。因此，明朝也产生了不少有名的大太监，比如导致士木堡之变的王振、器张一时的刘瑾、权倾天下的魏忠贤等人。对于皇帝来说，太监由于是特殊“人种”，所以造反的几率很小。利用能臣对百官进行管理，利用权臣牵制能臣，再利用近臣牵制权臣，这样，权力就集中到皇帝手中，因而也就能够确保皇帝的江山巩固、帝位安然了。


    以上，我们从历史的智库中寻访出一些有用的“驭下”之术。历史是无比奇妙的，特别是中国古代的官场，众多奇思妙计数不胜数，观不胜观。所以，借鉴历史上的“驭下”之法，必将给予我们更多的启迪。'
