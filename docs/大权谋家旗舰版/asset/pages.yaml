    而且从形势来看，你齐国甚至都要亡国了，卫国君主肯定心思要抓紧动起来了，怎么动呢？就是要重新寻找靠山，寻找靠山最好的办法就是出卖齐王，把他交出去，这样相当于给新靠山一个投名状。
