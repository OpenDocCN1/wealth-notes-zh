  md: '# ## 追求社会公平的人，结局都是啥样的？


    现代社会，很多人把公平都放在嘴上，仿佛自己一碰到问题就是社会不公平造成的，如果碰到不公平的事情多了，就对社会产生抱怨，然后自己就把公平作为自己的追求在做最大的努力！


    为什么社会的公平那么难？因为整个社会体制就不是公平的。从历史看，不管在哪个朝代，都是有统治阶级和被统治阶级，统治阶级通过设置各种规则（法律）来管理被统治阶级，一个是制定规则，一个是被规则的限制者，这怎么可能公平呢？所以你追求公平，宏观上就是要打破社会体制，难度可想而知。


    所以《易经》上也说“无平不陂”，就是说不存在真正的公平！


    那为什么我们会认为这个社会是公平的呢？


    首先，我们周围的人都和自己的社会地位差不多，所以在做事的时候的遭遇都差不多，不会特别被偏向，让我们造成公平和平等的错觉，所以公平是规则在底层运行时候良好的近似。


    其次，宣传需要，把社会营造出平等和公平的环境，对大家努力奋斗起到基础性的托底作用，而实际上在市场竞争的时候，大部分人都在采用表面公平、实际背后运作作弊的方式在为自己谋求不公平的优势。要保持社会稳定，所以需要公平。要获取实际利益，那又要不公平，这里面需要读者细品。


    既然公平几乎没法实现，那为什么有些人还要对公平如此执着？


    # ### 一、甩锅需要


    为自己混不好寻找理由，把责任推给社会不公平，而不是自己不努力，正确的姿势应该是努力寻找自己不成功的根本性原因，怎么让自己获取不对称优势。


    # ### 二、破罐子破摔'
  merge: -1
  img_proc: true
- pgno: 10
  md: '既然认为社会不公平了，那自己努力就没有意义了，所以就可以养成躺平和破罐子破摔的习惯，这样就彻底泯灭了改变人生的可能性。


    中国人不讲公平，而是讲伦理。伦理的意思就是认清你在社会、体制、组织内的客观位置，做符合自己身份的事情。试想，如果真的公平了，那资源分配就公平了，那就是大锅饭了，那谁还去努力？社会还怎么进步？


    # # 脑洞已破！礼貌居然是最廉价的权谋


    中国是礼仪之邦，礼是中国的立国之本，礼是什么？在礼制提出以前，社会秩序的混乱十分普遍。各种摩擦和冲突时有发生。人们在相处时不仅缺乏安全感，还会有危机感。在这样的情况下，儒家所提出的礼制就应运而生，礼是根据每个人的社会地位所制定的一套行为规范，如果在这套规范里面做事，就会顺风顺水，八面玲珑。


    礼貌就是礼制的一套外在表现形式；礼貌是人对人表示尊重的各种形式，包括动作形式和语言形式。如握手，鞠躬，磕头、送礼等，是动作形式；问候，道谢等，是语言形式。


    而礼貌的内涵是心里面有没有对方，就算你做礼貌的行为的时候，是为了自己做事方便，也尽量要表现出很重视对方，对方在自己的心中占有重要位置的感觉，这样你们就容易达成心理共鸣，给你做事排除很多暗礁。


    而且你如果平时就注重礼貌，人家看到你彬彬有礼，自然觉得你很有素质，很靠谱，也愿意多跟你合作，为你们下一步的互动奠定良好的基础。


    而做出礼貌的本身，是没有什么成本的，只是一种恭敬的态度而已，而就是'
  merge: -1
  img_proc: true
- pgno: 11
  md: '这样无成本的付出，却能给你带来用钱都换不回的潜在利益。


    有人会说，既然礼貌如此简单，也如此有效，为什么那么多人都不会用呢？很简单，因为他们比较自大，可能还是自卑带来的自大，还根本不知道自己不懂礼貌，无谓给自己做人做事增加很多障碍。


    江湖不是打打杀杀，而是人情世故，人情世故的起步就是礼貌！


    就算你要打打杀杀，也要保持自己的外在礼貌，这样才能放松对手的警惕，收集到核心的要素，最后一击即中。


    如果你要学习权谋，不懂基本的礼仪和礼貌，那根本就不可能入门；毕竟权谋不仅仅是斗争，更加重要的是合作，人和人之间的合作，就要先定尊卑、明位置、懂礼仪，而不管是合作还是斗争，礼貌都要先行。


    最廉价的礼貌，居然能得到最大的物质收益！


    如果你还不太懂礼貌，那就从现在起，把礼貌当成最重要的学问来学习！


    # 为什么穷人翻身难？逆天改命秘籍在哪里！


    看到社会上很多人都在抱怨：为什么社会这么不公平？自己一出生就已经被定位，而踏入社会后又找不到机会，导致于自己越来越穷，怎么办？还能翻身吗？能不能翻身我们先看穷人的来源。穷人的养成路径如下：


    # 一、工具性培养


    学校里流水线般的培养方式，把一个个学生培养成现代社会所需要的一个个工具，最后把思维模式完全调试成工具的方式，也就是说“对就是对”、“错就是错”，没有第三条路，踏入社会后，用自己的直率来冲撞同事，得罪领导，'
  merge: -1
