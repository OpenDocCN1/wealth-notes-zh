  img_proc: true
- pgno: 313
  md: '发言，“一把手”都是最后拍板。尽管有不少会议也有突破，但大体上不会太出格。所以，会议中“一把手”的意志主要是通过重要副职的发言来传达的。


    “一把手”与重要副职端出的盘子，有谁会听不明白？


    领导艺术最高超的的表现，就是“一把手”虽然不发言，甚至不参加会议，也能将自己的意志贯彻到会议中去。这就是让得力的副手充分领会自己的意志，然后放手让这位副手去贯彻。副手拿着“尚方宝剑”，还愁会议开不成功？


    有人希望用发言的次序、让副职先发言来消除“一把手”的权威，而实际上“一把手”发言顺序，与民主决策和让副职充分发表意见，没有必然的联系。倘若“一把手”的权力仍然是至高无上的，而决策机制又没有什么变化，那么，无论“一把手”何时发言，或者是不是在会场，参会者都会揣摩“一把手”的心思来发言。而且如果你在开会时候和“一把手”的意思唱反调了，那下次很可能你就会丧失参加会议的资格了！


    现实中，“一把手”与下属已经是地地道道的“上下级”关系了。“一把手”左右下属的政治前途，没有“一把手”的推荐和首肯，下属就很难得到提拔；假如某位下属不合“一把手”口味，不是被调离，就是被安排在冷门岗位。有几个下属敢拿自己的政治前途做赌注？


    所以，中国人的会议，尤其是重要的会议，往往体现了权力的深度博弈，而权力的博弈就涉及到站队。如果你不小心站错队了，那政治生命就玩完了；所以当你了解到中国式会议背后的权力行为逻辑的时候，你是不是已经知道自己应该怎么做了呢？'
  merge: -1
