- pgno: 242
  md: '鉴于上面唐代宗自己的利益，他不希望落下诛杀功臣的不良名声，所以他在暗杀李辅国之后，还给李辅国很高的荣誉，也善待了李辅国的家人。并且更为重要的是，他提出要严查凶手。


    做下属的，就算你对领导做出巨大的功劳，也要善于知止，因为物极必反，具体是什么原因会反呢，在权力场，毫无疑问是因为你越权，侵权，总之是侵害了领导的权力，所以领导才会毫不犹豫的要把你除掉！


    # 接班人争夺战的潜规则


    【资治通鉴原文】魏王泰多艺能，有宠于上，见太子有足疾，潜有夺嫡之志，折节下士以求声誉。上命黄门侍郎韦挺摄泰府事，后命工部尚书杜楚客代之，二人俱为泰要结朝士。楚客或怀金以贿权贵，因说以魏王聪明，宜为上嗣；文武之臣，各有附托，潜为朋党。太子畏其逼，遣人诈为泰府典签上封事，其中皆言泰罪恶，敕捕之，不获。


    【翻译】魏王李泰多才多艺，得到太宗宠爱，他看见太子有脚病，便暗地里产生夺嫡而立的想法，于是折节礼贤下士而拐取名声。太宗让黄门侍郎韦挺管理魏王府中事务，后来又命工部尚书杜楚客取而代之，二人都为李泰联络朝中大臣。杜楚客有时怀揣黄金以贿赂权贵，对他们说魏王如何聪明，应当立为太子；文武大臣，各有所托，暗中结为朋党。太子害怕李泰威胁自己的位置，便派人诈称为魏王府典签上书言事，都拆说李泰的罪过，太宗敕令逮捕这些告状人，查无所获。


    【解析】做太子是一个高风险的职业，也是 一个高难度的职业，做太子难，做'
  merge: -1
