    不过价值观不能改变也不是绝对，在以下三个情况下，人的价值观就会受到考验和改变。


    # 一、志在必得却失之交臂


    职场上领导对你赞赏有加，有意无意许诺你能升职，你自己也觉得表现不错，资历足够，感觉自己胜券在握，但是最后却失之交臂，自己非常失落懊恼。其实这时候，正好是你浴火重生的时候，也就是要检验自己原有的观念，是不是自己的观念和现实不符，并调整之，调整后的价值观就可以支撑你的进一步发展。


    # 二、原先行之有效却不断碰壁


    我们经常遇到这样的事情，原来自己的一套方法，在工作中非常有效，但是随着时间推移和职位的变化，自己原来的方法却原来越行不通，这时候就容易'
