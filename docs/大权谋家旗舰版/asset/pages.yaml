  md: '那么，小小的户部书吏怎么敢与皇帝身边的红人、朝廷的封疆大吏叫板？

    在中國民间有句老话说得好，靠山吃山，靠水吃水。地方上的胥吏吃老百姓的，而中央六部各衙门的书吏则吃下面大小官员的。所以虾米能不能吃定大鱼，关键不在虾米的才能高低，而在于虾米在权力结构中所处的位置。这些小小的户部胥吏之所以敢吃定福康安，因为他的位置非常关键，而且能决定福康安和自己组织内部更高层领导的隐形利益，或者说，更能合法伤害以福康安为代表的这一类需要办事人员的利益。

    而对于阎王级别的人物来说，他们一般不会被具体的事务所纠缠，而且思考的问题已经上升到比较远的位置，属于高瞻远瞩，而且高层的领导大家抬头不见低头见，弄僵了关系大家都不好过；我们也可以认为越是有身份的人，越有素养，也越容易相处，即时有了矛盾也很容易化解，

    另外高层的领导更容易有进取的需要，所以都比较爱惜自己的羽毛，不过阎王（菩萨）也需要香火，怎么获得香火呢？就需要通过下面的人实现，所以表面看他们做事方式完全不同，其实他们是一个利益集团的，只是外在的表现方式不一样而已。

    上面的福康安报销军费的案例里面，虽然谁都知道福康安是皇帝面前的大红人，但是胥吏就是不买他的帐，这时候胥吏的衍生权力，就形成了上至户部大员，下到普通胥吏的一条灰色产业链，这条产业链的上下游之间是互相贯通的。

    小鬼没阎王的境界，阎王没小鬼的职责。两者既不矛盾，还必须共存。以此类推，大到一个国家，小到一个组合，既要有人做好人，也要有人做坏人。好人可以不失身份的把握全局，坏人可以不失利益的保护自己。'
