  md: '曰："及，佞人也。民安政举，乃守臣之职，焉用为此？" 辛亥，令邸吏还之。


    【翻译】宁州州长、国防部军事图籍司挂职副司长杨及，曾经在宋仁宗生日(乾元节)那天献上锦绣佛像。宋仁宗对宰相们说："杨及，是一个阿谀奉承的小人。人民安定政务清明，这才是地方官员应该达到的目标，用这个锦绣佛像献给我，难道是我希望的吗？"
    辛亥，仁宗下令让宁州州政府驻京办事处官员退还给杨及。


    【解析】职场上，想要谋求进步，除了会做出政绩之外，还要善于靠近领导，而靠近领导的最重要方法之一就是拍马。拍马看起来容易，其实暗藏风险，怎么控制风险，让自己的拍马行为获得领导的认可，是一个具有挑战性的工作。


    本段材料里面的杨及，我们一定要注意他的官职。首先他是知宁州，也就是宁州的知州（实职），而后面的官职职方员外郎，员外郎这个官职比较尴尬，实际上在北宋初期就是一个官阶而已，并没有真正的职权，只是在中央有一个编制。这样他就是中央有编制的外放官员，我们可以了解一下他的内心，基本上他是非常想回中央朝廷的。


    他所想到的是直接向最高领导靠拢，而靠拢的方式趁皇帝生日直接送礼。这样跨越多个层级，直接向领导送礼的方式，风险很大：


    # 一、不知皇帝的真实喜好


    因为你离皇帝比较远，所以你很可能没有当前皇帝喜好的第一手材料，而且说不定还有人来误导你，或者你自己的自以为是，都导致于对皇帝的认识偏差，而这个认识偏差导致于你来承担严重后果。


    # 二、让直属上司心存芥蒂


    你跳过上级，直接给最高领导送礼。如果上级知道，肯定会心存芥蒂，因为'
