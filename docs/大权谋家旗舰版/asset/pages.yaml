- pgno: 330
  md: '权力制衡、任务调配等等，对权力安全起到非常重要的作用，所以在新时期，


    几乎党委都主抓人事权。


    # 二、工作分配权


    工作分配权这个也非常重要，就是什么任务安排给谁。譬如安排难题给自己看不惯的人，安排容易出成绩的人给自己人，然后利用这个功劳来给自己人加薪升职等等。


    这就是领导手中掌握的主要手段，领导就要巧妙利用手中的这种权力和手段来维护组织的权力平衡。


    具体到本案例来说，结合历史看，方法有三种：


    # 一、抛石头


    什么叫抛石头？就是朝对手扔一块石头出去，把对方打晕，也趁机表明自己的态度。怎么甩比较好，首先可以寻找对方在历史上做错的事情，不管从动机还是对组织的伤害方面进行放大，然后小道的舆论宣传；其次可以利用有些组织难题安排对方来处理，这个就是陷阱任务，如果做不好，那正好被你找到借口。这个方法其实更好，更容易让人第三者信服，有利于争取自己的支持力量。


    同时通过这样一系列的操作，也让其他人大概看清了组织风向，让他们方便站队，最大可能来扩大领导的支持面。


    如果你的那个把柄抓牢了，就方便安排其他人来接手对方的一部分工作，削弱对方的实力，对方的重要性就会大大降低。


    # 二、掺沙子


    所谓掺沙子就是在对方的阵营里安排自己人，使对方的墙根基不稳，达到破坏对方根基的目的。'
  merge: -1
  img_proc: true
- pgno: 331
  md: '从本案例来看，领导通过人事权，安排自己人进市场部门，慢慢了解市场部门里面的所有事情，收集各种材料，提交给领导。同时通过工作安排，让此人容易出业绩，就可以用业绩为借口提拔对方，最终达到和主管的制衡作用。


    这个方法比较有效，缺点是需要很长运作时间。


    # 三、挖墙脚


    挖墙脚这招最狠，见效也最快。挖墙脚就是把对方的人挖过来为自己所用，当然要先做调查，对方看似铁板一块的独立王国里面是不是有失意派，拉拢对方的失意派，因为失意派本来就有报仇需要，所以你们很容易一拍即合。


    就算你想拉拢的人是市场主管的心腹，那也不要紧。中国历史上还有一个毒计，就是故意派人去靠拢市场主管的心腹，就扯点有的没的的话，同时还要能传到市场主管的耳中，这样他们之间就会产生猜忌，然后发酵，你方再许以高回报进行拉拢就方便很多了！


    以上招法可以单独使用，也可以因地制宜联合使用，总之都需要リリース在私底下运作，不要容易让对方发觉，等到自己方面布局造势完成了之后，对方就算发觉，也已经无力回天，只能被你轻松摆平！


    # 领导为什么要挑动下属之间的内斗？内幕很“厚黑”！


    很多职场朋友都认为，一个组织内的最佳状态是和谐与稳定，而实际上，做到这样的状态是非常不容易的。因为如果下属们团结一致，那他们就会和领导斗。因为利益，斗争必然无处不在。对于领导来说，这样的情况他肯定接受不了，那领导会怎么做呢，我们先来看一个历史上的经典案例：'
  merge: -1
  img_proc: true
- pgno: 332
  md: '在春秋时期，齐景公有着三位名将，分别是公孙接、田开疆、古冶子，这三个大将自认为功高，经常炫耀武力，不讲晏婴等文臣放在眼里，甚至也不将齐景公放在眼里。


    晏婴看出齐景公的担忧，便设了一个局帮助齐景公除掉三人。他让人通知三人前来，说齐景公要奖赏他们。然而奖赏之物是两颗桃子。晏婴假装为难，说园里成熟的桃子只有两颗，让他们按照自己的功劳大小来吃桃子。


    公孙接说自己杀过野猪老虎，于是拿起一颗桃子，田开疆说自己两次率军打败过来犯敌人，于是拿起另外一颗桃子。


    古冶子非常生气，说自己陪同国君过河的时候，有只大鲨差点要了国君的命，是自己冒着生命危险苦斗杀死大鲨救了国君。自己的功劳这么大竟然没有桃子吃，于是拿起剑指着公孙接两人。


    公孙接两人听后觉得惭愧，认为古冶子确实功劳比他们大，他们却先拿了桃子，惭愧至极之下两人相继自杀。古冶子看到两人自杀，后悔不已，觉得三人原本情同手足，自己却为了争功导致两人自杀，于是自己也自刎了。


    本故事里面，本来齐景公的三个大将是团结一致的。正因为他们团结一致，所以才看不起文臣，甚至看不起领导了，导致于领导起了杀心。


    而实际上对于领导齐景公而言，他的最大利益不是把三个大将杀了，而是要离间他们，让他们都为自己所用，同时他们三个内部互相猜忌而合不来。


    有人说，二桃杀三士的故事，是狗争术；而本质上，二桃杀三士，是转移矛盾的艺术，把下属团结和领导闹矛盾，转化为下属和下属之间的矛盾。这样领导就能在下属的矛盾之间进行居中调和，掌握了评价权，领导也就能够坐得稳了。


    而在后世，很多领导把二桃杀三士的故事改编了一下，用“竞争上岗”这个变'
  merge: -1
  img_proc: true
- pgno: 333
  md: '相的 “桃子”， 引起下属之间的争斗。


    一旦下属之间有了争斗，那就很容易互相揭短，就算他们之间没有揭短，倚着领导对下属的了解，故意为一方揭露的另外一方的假内幕，被揭露的一方一股很难去怀疑领导，所以往往被激怒，这样正好被领导利用假消息套取了真情况，再利用这个真情况到对立的另一方去离间。


    在这样几个回合下来，下属之间的矛盾，下属的把柄，都被领导了如指掌，这样领导不仅可以通过下属和下属之间的斗争来维持自己的权力，还可以通过他所掌握的把柄来拿捏各个下属，这一招不得不说是非常高，杀人于无形。


    看到这里，有人就要说了，领导的权力有那么重要吗？要靠杀人？靠挑拨离间来维持吗？其实事实就是这样，没有权力，领导的位置就坐不稳，权力位置坐不稳，轻则寸步难行，自己的意志无法推行，重则身败名裂，粉身碎骨。历史上这样的案例也是层出不穷。


    最后，对于领导挑动下属的矛盾，下属应该怎么应对呢？很简单，团结到领导的周围，而不是在下面拉帮结派想要架空领导，善于帮助领导打探消息，及时汇报，不过这样的事情很容易被人所看不起，而实际上为领导负责才是最大的政治，当然，前提是这个领导是懂权力，具有较强的权力敏感性。


    # 《红楼梦》已经成为中国高考的杀手锏！


    《红楼梦》以前一直被大众认为是关于姐姐妹妹、情情爱爱的闲书，随着中央的复兴传统文化和四个自信的提出，《红楼梦》作为中国文化皇冠上的明珠的地位就越来越重要；其显著标志就是近年来《红楼梦》里面是内容已经是高'
  merge: -1
  img_proc: true
- pgno: 334
  md: '考的必出题！大家知道高考是中学教育的指挥棒，所以现在在中学校园里面，掀起了学习《红楼梦》的一波高潮。


    作者所在的上海，正好有个孩子在上高中，一进高中，语文课就进行红楼梦系统化学习。


    昨天高考全国卷更是以《红楼梦》的片段作为作文素材的来源。作文占了六十分之多，可见《红楼梦》已经成为高考语文的杀手锏了。


    高考作文题的内容如下：《红楼梦》写到“大观园试才题对额”时有一个情节，为元妃（贾元春）省亲修建的大观园竣工后，众人给园中桥上亭子的匾额题名。有人主张从欧阳修《醉翁亭记》“有亭翼然”一句中，取“翼然”二字；贾政认为“此亭压水而成”，题名“还须偏于水”，主张从“污出于两峰之间”中拈出一个“污”字，有人即附和题为“污玉”；贾宝玉则觉得用“沁芳”更为新雅，贾政点头默许。“沁芳”二字，点出了花木映水的佳境，不落俗套；也契合元妃省亲之事，蕴藉含蓄，思虑周全。


    我们先仔细分析这一段：为元妃省亲专用的大观园刚刚落成，中国建筑有一个特点，建筑完成后需要用对联和诗词来点睛，所以这里贾家的当家人贾政就带领一帮人先游览大观园，顺便看看怎么题对联。这时候主要是带了帮闲清客文人和大观园工程负责人贾珍，进了大观园撞见了贾宝玉，就顺便一起游览起来，按照文中的意思是贾政有意来考一下贾宝玉的文采。


    这时候，帮闲清客，他们其实都是有水平的，而当时的情况下，他们是不方便表现自己的真本领。因为这种风花雪月的，关系不到组织的重要发展的，就应该让领导或者领导指定的人来表演。换句话说，我们是要时刻注意自己的身份，在这个基础上，明白自己应该做什么，不应该做什么，所以这里的清客都'
  merge: -1
  img_proc: true
- pgno: 335
  md: '表现的很一般。注意，并不是他们真的不行，毕竟他们是靠这个吃饭的！


    所以有人就开始抛转，提出来的“翼然亭”，有典故，也有文采，但是缺点也很明显，就是过于注重了亭子的本身，而没有关注到亭子和环境的配合。


    这时候贾政开始发话了，准备题词“还须偏于水”，这个赓颂的题词就非常像苏州拙政园里面苏东坡的“与谁同坐轩”，一个是亲水，一个是亲自然，颇有异曲同工之妙。不过“还须偏于水”联系了环境，但却无法联系到元妃省亲的主题，所以其实还是有所欠缺，在这样的情况下，有清客就用领导贾政所说的话，提出“泄玉”。我们这里一定要注意的是，在领导发话后，你只有恭维的份，最好不要再提出什么建议了。尤其是容易表现你比领导水平更高的建议，就算是要提，也要顺着领导的话题来说。这样就算你表现的高明，也是领导的水平高，才启发了你（随时归功于上）。


    回过头来看“泄玉”其实这词的意境不太高，泄字过于写实，这样就给宝玉的发挥留下了很大的空间。


    所以我们再次看到帮闲的清客文人却非常清楚自己的身份，必须把舞台让出来，自己最多做一下搭台的角色！


    这里宝玉提出来说是“沁芳”，好处在文本里面已经说明白了。而“沁芳”无疑是这么多建议里面最好的，把清客文人和贾政都比下去了，那为什么宝玉就能表现的比领导还要好呢？一方面因为本次游览大观园就是让宝玉来表演的，其次关键还是关系，关系到位，你表现得比领导高明，领导也不会有意见，反而会采纳你的建议。三国时代的郭嘉，就是往往体现的比曹操还要高明，但曹操丝毫没有恼怒，反而一再重用。


    不过我们要注意，宝玉在家里，他可以这样表现。如果换了场景，譬如到了'
  merge: -1
  img_proc: true
- pgno: 336
  md: '官场上，那如果还是这样处处展现自己的高明，那很快就容易被上级打压，所以换位子就要换脑袋。


    我们就看这一小节，里面已经把诗词歌赋、训诂考据、人情世故、职场伦理完美的糅合在了一起了，一斑窥豹，就可以看到《红楼梦》的伟大。


    《红楼梦》的伟大在于他是诗词歌赋、训诂考据（古称小学）和人情世故、政治权谋（古称大学）集大成者，读这一本书你就可以了解中国文化的底层思维和社会运行模式，作者曾经一度研究《红楼梦》很多年，建议朋友们教育孩子从小就开始读，当然成人读更好，有了阅历再读会理解的更深入。


    # 权谋巅峰：负荆请罪的背后，到底是诚心道歉还是道德绑架


    秦、赵渑池之会以后，因为相如功大，拜为上卿，地位在廉颇之上。廉颇说：“我作为赵国大将，有攻城野战的大功，蔺相如只不过是耍嘴皮子的功劳，反而地位比我高，况且相如平素是个地位卑贱的人。我感到羞耻，不甘心位居其下。”并扬言说：“我要是见到相如，必定羞辱他。”相如听到以后，不愿和他相会。上朝时，相如常推说有病，不想和廉颇争高下。不久，相如出门，望见廉颇，便回过车来躲避，不让廉颇看见。蔺相如的舍人共同对相如说：“我们之所以离开亲人而来侍奉您，只是羡慕您的高义。而今您跟廉颇同列，他宣扬恶言而您却怕他、躲他，恐惧得太过分了。这种做法，就连普通的人都会感到羞耻，更何况您呢。我们不肖，请求辞去。”相如坚决阻止他们，说道：“诸位认为廉将军和秦王比起来怎么样？”舍人们说：“不如。”相如说：“像秦王这样的威势，听凭我在朝廷中怒叱他，侮辱他的群臣。我虽不中用，难道还怕廉将'
  merge: -1
  img_proc: true
- pgno: 337
  md: '军吗？但是我想强秦之所以不敢对赵国进犯，只不过因为我们两人在赵国的缘故。如今，设若两虎相斗，必然是势不共存。我之所以这样做，是把国家急难放在首位，把私仇放在后面。”相如这番话被廉颇听见之后，深受感动，便脱去上衣，露出臂膀，背上抽打人用的荆条，通过相如宾客介绍，来到相如府中请罪，说道：“我这个鄙贱的人，不知道将军宽宏大量到这种地步。”两人终于和好，成了生死之交。这就是负荆请罪、“将相和”的故事。


    # 【解析】历史上著名的将相和、也就是负荆请罪的故事，小时候读觉得就是道个歉，很简单，也没有必要搞这么复杂，更没有什么研究价值，不过等有了社会阅历之后，发现“负荆请罪”的故事很不简单，给我们很多启发。


    首先，本故事里面廉颇和蔺相如在赵王心目中的位置应该说是事非常重要，甚至说缺一不可，不过赵王其实最担心的是文武联合起来，所以他最希望的场景是廉颇和蔺相如不和，但是又不影响总体的局面，所以基于这个考虑，我们是不是可以认为，蔺相如被提拔到廉颇之前，也是赵王有意的呢？


    在以后的中国历史上，廉颇和蔺相如这样的一文一武的斗争是必然的，文臣说武将拥兵自重，会谋反，而武将说文臣老是在背后使绊，不利于前线作战，影响国家利益。


    而功劳和作用没有客观的标准，全部在领导的心中，所以才有对领导进谗言的空间，而领导为了自己的权力安全，一定会在文武之间搞平衡，让他们斗而不破。


    另外，廉颇很不服气也是很正常的。因为他的作用在打仗时候，虽然经常打胜仗，但是领导感受没有那么深刻，蔺相如在赵王身边，赵王感受更加真切。


    所以廉颇感觉自己没有得到公正的待遇，他不方便直接攻击领导，那就攻击'
  merge: -1
  img_proc: true
- pgno: 338
  md: '蔺相如吧（武夫本性），扬言要给蔺相如难看。蔺相如再三躲着廉颇，这个躲可以让蔺相如获得很大的名声，不过如果一直躲，蔺相如就会被认为真的怕了廉颇，是怂包，所以在必要的时候他要体现自己的本意。所以他说：“我连秦王都不怕，喜怕廉颇？我只是担心如果我们文武失和，给秦国可乘之机！”这句话一出，蔺相如就站在了道德的制高点，相对的，廉颇给人感觉就是私心重，不顾大局，要被其他人都看不起了。别人可能原来有的同情都已经烟消云散了。


    廉颇因为前面做的太过，所以通过私下的方式很难有脸直接面对蔺相如了，思考再三，既然你一心为公（至少表面上是的），那我只能用公心来和你对接，不过我跟进一步，就是采取公开的负荆请罪的方式（群众会觉得更有高风亮节），想必那时候他请了好多传媒的记者一路直播追踪报道，这样就把球踢给了蔺相如。这样的情况下，蔺相如是不能不接受廉颇的道歉的。因为如果你不接受，证明你前面的退避三舍都是做戏，不是真的，如果接受廉颇的道歉，那蔺相如有一种被强迫的感觉，很不是滋味，当然在这样的情况下，蔺相如只能接受。就算想报仇，也只能以后再找机会。故事最后，说到他们变成了过命之交，如果真这样的话，赵王要睡不着了，赵王是希望他们最好面和心不和。


    负荆请罪给我们的启发，在大家矛盾很深的情况下，私下很难沟通的时候，你可以大张旗鼓的邀请传媒、大 V、自媒体等方式，说自己要对某某人进行郑重道歉，并做出实际的动作（譬如开新闻发布会）来表达自己的歉意，这本身就是一种道德绑架，对方没有办法只能接受，把自己打造成知错就改、真诚道歉的光辉形象。这就是最深的权谋，表面上看是痛改前非、诚心道歉，背后却是暗潮涌动、道德绑架！你学会了吗？'
  merge: -1
  img_proc: true
- pgno: 339
  md: '# 马云做了坏事后是怎么洗白自己的？


    这几天正好看到了一个关于马云的视频，马云坐在一张沙发上，义正辞严地说自己的公司不行贿，也不允许受贿，他说到阿里巴巴刚开始的时候，主营业务还是帮客户建站（面向海外的客户），那时候的
    2002 年正好是互联网泡沫破裂的时候，互联网行业非常不景气，马云的公司当时也在倒闭的边缘。不过也就在那时候，马云说公司开始赚钱了，年终盘点的时候，发现两个员工的业绩超过了整个销售团队的百分之六十。经过调查发现这两个人是靠给客户回扣才业绩这么好，如果开除这两人，那公司就不赚钱了，如果不开除这两人，那公司的价值观就是一句空话，所以他们最后的决定是开除了这两个员工。


    他继续说到，不贿赂，一直写在阿里巴巴的守则里面，谁要触犯了，谁就要被开除！说得义正辞严，大义凛然。


    这段视频马云是把自己彻底洗白了，不过从我们做过公司和学过权谋的人眼中，里面有很多的漏洞。


    # 第一，业绩好，不是到年底才会知道的


    在市场不好的时候，公司内任何业务做的好员工都会非常引人注目，而这类公司基本上每周，至少每个月都要开会，甚至还会要做业绩排名，而且业绩做的好员工往往看不起业绩不好的，所以马云说到年终盘点发现这两人业绩非常好就说不过去。


    # 第二，行贿所用的款项很难遮掩


    在生意场上，行贿所用的款项都远超过一般的个人的市场费用，往往还需要一层层批。而在 2002 年业务非常不景气的情况下，费用支出就会非常谨慎，马云作为一把手肯定会对这种比较大额的支出比较敏感，而且那时候阿里巴巴'
  merge: -1
  img_proc: true
- pgno: 340
  md: '也不算很大。那些能出业绩的员工都是老板的重点关注对象，所以马云说年底才查出来他们靠行贿做业务，也很难说得通。


    那综合来看，马云当初因为业务难做，公司也在苦苦支撑，所以靠这两个员工把公司业绩撑起来，把公司也能维持下去。而到年末的时候，行贿事宜很可能在客户公司那边东窗事发，加上平庸的员工妒忌业绩好的员工，所以马云最终决定刮骨疗毒，对外宣称自己是捍卫阿里巴巴的核心价值观！


    时隔多年以后，马云才敢把这段故事用价值观美化的方式娓娓道来，并不是他真的那么高尚，而是现在说，已经不太可能再引起当事人的追责，同时为当初渡过难关所用的上不得台面的手段进行洗白，把所有的问题都推给那两个行贿的员工（真正的背锅侠），这招非常巧、非常妙。


    所以，现代社会我们所看到的种种故事和现象，往往是有人经过多重伪装出来的，如果不能练就火眼金睛，那就很容易被表面的故事情节所蒙蔽，而且一切被演绎的非常合理。其实他的内在有另外一套逻辑，这套逻辑是真正的社会规律，而这个规律，是别人要包装起来的，更没有人会来告诉你！


    # 中国组织的内部斗争为什么总是那么冷酷无情？


    有人的地方就有江湖，有江湖就有斗争，有斗争就有权谋。


    不管我们是不是承认，人来到这个世界上，就会为了生存资源的争夺而产生斗争，因为斗争，人和人会结成组织和帮派，和外部的敌人组织进行资源的争夺，与此同时，组织的内部也会进行地位和掌控权的争夺。


    外人看中国组织的斗争，有一种非常奇怪的观感，就是对外部敌人的时候，'
  merge: -1
  img_proc: true
- pgno: 341
  md: '尤其在自己掌握主动权的时候还能网开一面，或者用怀柔政策。但是对于组织内部的敌人，斗争却毫不留情，彻底打倒还要掘地三尺。


    内部斗争，有时往往比敌我斗争还残酷、还血腥，和组织外部敌人的斗争，是因为主义政见不同，是理性的仇恨。而组织内部自己斗争起来，还夹杂了个人情感和利益的种种因素，更直接更面对面。


    有时候，仇恨难消不是因为他杀了自己的亲爹，而是他某个时刻的恶毒嘴脸让自己一想起来就怒不可遏。


    内部残酷斗争、无情打击，让很多人很受伤。敌人的皮鞭痛，只是抽在身上。同志们的揭发和批判，则是痛在心里。这种情况下，人的心理极易逆反。


    另外，组织内部的斗争，往往会直接涉及自己的权力乃至身家性命的安全。我们要知道丧失权力往往就意味着肉体被消灭，当时司马懿发动高平陵政变的时候，答应曹爽让他做个富家翁，然而当司马懿控制了朝廷的局面后，直接就对曹爽夷三族。


    因为这样的政治斗争，是你死我活的，是不能讲任何的感情的。不然因为对方势力肃清不彻底而死灰复燃，那自己就会变成受害者而身首异处。金庸著名小说《笑傲江湖》中的东方不败因为一念之仁而没有消灭任我行，后来被任我行反扑翻盘，自己命丧黄泉。


    本质上，组织内的最高权力是独占性的，是无法和别人分享的，不然就容易引起组织的强烈纷争，纵观中国历史，中国强盛时候，也是皇权最集中的时候，而中国衰弱的时候，往往是诸侯或者地方势力崛起，皇权旁落，纷争不断，战争频仍，老百姓就受苦，恰恰和我们大多数人的观念相反，集权才是保证组织繁荣、百姓安定的法宝。而集权所伴随的组织内的整肃，也是无法避免！'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# 颠覆认知！精忠报国的岳飞为何必死无疑？


    岳飞一直是以精忠报国的抗金民族英雄的形象载入史册，那为何这样的一为国家舍生忘死、一心报国的忠臣良将因为“莫须有”的罪名而黯然落幕？


    仔细研究南宋开国之初的这段历史，竟然有了全新的发现，岳飞在皇权体制下必死无疑的原因也浮出水面！具体原因如下：


    # 一、手握重兵，不受节制


    因为需要打仗，所以南宋立国之初就只能依靠武将，而在这样的过程中，形成了很多军队的派系，叫“X家军”，这些军队的内部只对军头效力，心中几乎没有皇帝，而这些军队，都是自己解决粮草，可以说是内部铁板一块。有皇帝以来，对这样的军队其实是极端不放心的。而且朱仙镇的十二道金牌的另外一个解释，就是岳飞不听命令，所以才要发十二道金牌。


    # 二、宋朝重文抑武


    因为宋朝开国之君，宋太祖赵匡胤就是靠掌握军队后被下面的人拥戴篡夺了北周的政权而建立了宋朝，有一种说法，就算将领想忠于朝廷，下面的人为了荣华富贵也想把你推向皇位！所以宋朝的历代皇帝以此为鉴，对武将防范很严密，而当时的情况下，在金国的军事压力减轻后，宋高宗就能腾出手段来解决军队尾大不掉的问题。


    # 三、不肯放人质


    宋高宗一度提出，为了让岳飞的母亲安享晚年，接到杭州来养老，当然名义上为岳飞好，实际上是在对你母亲好的同时，把她扣为人质，中国人说话一般不直接，可能岳飞没有理解到这层，也可能认识到这一层，不想被挟制。不管咋样，岳飞拒绝了，但对高宗来说，他可能会理解成你有反心。'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# 四、介入立储


    如果一股的文臣或者不带兵的武将建议皇帝立储，那还没有那么敏感，而你作为一个带兵的，不受节制的武将提出这个问题，宋高宗似乎会多想，因为这是一个很大的权力忌讳。对高宗来说，你越权了，而且你做长远打算，是不是想通过立储来控制朝廷？先把我干掉？总之，这时候的高宗，肯定是如芒在背，汗流泚背。


    # 五、迎回二圣


    岳家军抗金还有一个口号是“直捣黄龙、迎回二圣”，从整个组织角度看，这样也无不妥，但是从宋高宗的角度看，两位前任皇帝回来了，自己怎么办，让位？在那时候，失去权位，往往还意味着丧失性命，所以高宗是不能让这样的事情发生，而当时岳飞也的确达到金国腹地，眼看就能夺取二圣，吓得金国赶紧转移两位前皇帝。其实换个角度，金国就应该让岳飞抢回来，然后就可以引起南宋的争权乱局，自己才能乘虚而入，而二个前皇帝在金国只有象征意义，没有实际作用，而如果放回，那很可能造成南宋内部的权力斗争！


    # 六、同僚关系不睦


    最后一点，大家可能都没有注意到，这时候南宋的各路“X家军”之间，也如同仇敌，当然，这也是宋高宗乐于看到，说不定还是皇帝居中挑拨所造成的。不管咋样，军事上，岳飞也很难得到其他将领的支持，而因为岳飞主张北伐态度过于坚决，还得罪了满朝的文臣，所以当岳飞被莫须有的罪名下狱后，几乎没有人来为他说话。


    虽然岳飞精忠报国，但是他的功劳是需要领导来定义的，而且要在领导规定的范围内（以打促和）施展自己的能耐。纵然有人说，是因为金国要求宋高宗'
  merge: -1
  img_proc: true
- pgno: 344
  md: '杀掉岳飞才能求和。我想如果不是因为岳飞多层次，多角度，多形式上触犯了宋高宗的权力安全，高宗也舍不得杀掉岳飞。因为就是和谈，也要武力作为保障，不然对方不可能理你，直接打趴你即可。


    很多人认为，岳飞根本没有反意，也没有确凿的证据，所以当韩世忠质问秦桧的时候，秦桧只是以“莫须有”的回答，按照岳飞当时的地位，绝不是一般的讹陷可以动摇的，更不可能将其陷害致死，如果是一场查无实据的“莫须有”，更不可能成为铁案。这样的情况下，如果没有高宗的默许，岳飞是不可能被杀头的，换句话说，宋高宗是支持甚至是杀掉岳飞的主谋。


    而且秦桧用“莫须有”来回答韩世忠，其实是借了皇帝的势，同时也非常含蓄，等于告诉韩世忠不要多管闲事，要知道皇帝的意图是最高机密，任何泄露的人都可能遭受灭顶之灾，所以秦桧只能用莫须有来暗示对方。


    岳飞的案子，没有证据，从法律上看属于证据不足，不过这个案子不是法律定性，而是政治定性，任何我们看不懂的案子，如果归结到政治和权力上面，那就会豁然开朗，而政治权力方面，是没有人会跟你讲的，只能看自己的阅历和智慧自悟！'
  merge: -1
  img_proc: true
