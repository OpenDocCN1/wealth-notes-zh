  md: '人，更是一种善了。


    权谋家可以从更高的层次降维观察，人性无所谓善恶，不管是善的还是恶的，都可以为我所用，以有没有用为基点，来衡量世间的一切现象。这样，你就不容易被各种条条框框所束缚，很容易找到解决现实问题的方法，打开不一样的人生。


    # 为什么“成功人士”的话不能听、书不能信？


    看到很多朋友都在读成功人士写的书，譬如王石的好几本，曹德旺的《心若菩提》，《李嘉诚传》，还有譬如马云、任正非等人的书，看的津津有味，觉得自己离成功也很近了。


    在本文里面，我要给这样的朋友泼一下冷水，你读这些书，非但不能学到什么东西，还很可能被他所害！背后的原因如下：


    # 一、不说真话


    现在经常出来曝光的成功人士几乎都是商业人士，商场如战场，战场就很残酷，但是你无一例外看到他们写的书好像很轻松，让自己读了很舒服。“信言不美，美言不信”，一旦你读的书，让你很舒服，那肯定是来骗你的。反观我们看到马云
    2020 年在上海外滩金融峰会上说了几句心里话，就被政府严厉打击。而李嘉诚以前也说过真话，他就是善于和别人分享利益才能做这么大，细品这句话，不就是行贿么？如果细细追究，那他和相关利益人要不要坐牢？所以他们能说真话吗？


    # 二、保护自己'
