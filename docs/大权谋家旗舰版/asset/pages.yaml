- pgno: 47
  md: '这个世界，并不是非黑即白的。对于有权势的人来说，指鹿为马已经是稀松平常，因为人际交往没有是非对错，只有利益上的得失。


    而如果你把是非善恶挂在嘴上，那很可能就被别人当枪使，所以你在遇事宜的时候，控制住脾气和情绪，不要急着做出头鸟，保持低调，仔细琢磨这背后的利害关系，总有一天你会突然开窍的。


    如果你到了一个新环境，一定要先保持低调，同时摸清周围人的利益诉求和派系网络。不然就容易一不小心就把人得罪了，莫名其妙就被当枪使了，平白无故变成背锅侠了。


    不过，如果你没有独立的思考，真的做到了和光同尘了，那你就是真的堕落了，因为大部分人都是没有什么长远规划的，你和他们一起滚，那还能有啥前途呢？所以最理想的状态是自己的利益观念清清楚楚，然而外在却让人感觉你是糊里糊涂的。不然你就真变成堕落的彻彻底底、心安理得。


    所以，和人交往，无需按照你的喜好和是非来做标准，而是看对方对你有没有用为标准，所以曹操“唯才是举”，“用有才无德之人”。当然你要找人帮忙的时候，也要体现自己的价值，甚至夸张、扩大自己的价值，别人才敢敢和你做人情，做交换，只有甘于被别人利用，才能利用好别人！


    # ## 一个人有没有前途，看这三个方面就知道了


    在社会上，如果我们需要和一个人进行深度合作，就需要知道这个人的背景，脾气性格，未来发展等，那怎么才能快速判断对方的情况，可以从以下三个方面着手：'
