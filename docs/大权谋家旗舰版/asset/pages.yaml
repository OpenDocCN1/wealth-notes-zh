    往往是一个重要的会议可以不参加，可是与上级的人情来往决不能不参加。这看似业余行为，其实十分重要。再比如，我和上级的家人、亲属、朋友都千方百计地搞好关系，在关键的时候，上级的家人、亲友会为我说话，其作用决不可低估。当然，与上级搞好关系的路子有千条万条，再此不可能一枚举。其​实，每个人都有自己的体会，所谓八仙过海，各显其能。


    上级是有自尊心的，所以，拍马屁的功夫是不可缺少的。和上级相处是一门学问，如果你说的话上级爱听，听着舒服，听着高兴，那说明你具有一定的拍马平了。上级需要赞美，需要掌声，当下级的就不要吝啬，这也是当下级的应尽的责任和义务。和上级在一起，我总是千方百计找到话题，表达我对上级的崇敬之情和诚服之意。有人以为拍马屁就是顺情说好话，其实不然。拍马屁得拍到点子上，拍得有分寸，有艺术性。如果拍得不伦不类，拍得肉麻恶心，那会起到相反的效果。人家会认为你心术不正，想靠要贪嘴占便宜。在这方面，我是有一定体会的。我赞美上级，不仅注重在当面，更注重在背后。


    当我和上级的 心腹和知己在一起的时候，我会想方设法赞扬上级的丰功伟绩、'
