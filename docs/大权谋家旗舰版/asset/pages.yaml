- pgno: 52
  md: '开贾府，甚至主人要赶她们走的时候，她们也是非常不情愿，甚至要以死抗争的原因。


    我们再说深一点，一个政权，开始起步的时候，为了要获取最大范围的支持，往往把自己打造成弱势群体的代言人，所以这时候“民主”、“平等”、“自由”都会叫的最响，也最容易迷惑人心，但是当夺取政权后，他就应该是社会伦理结构的维护者。因为只有稳定的社会结构，才能最大限度的符合各个阶层尤其是统治者的利益。


    一整套完整的社会伦理结构，看似对每个人的个性是有压迫，其实这个体制何尝不是在保护你呢？保护你最基础的生存需要，也是对全社会的托底，所以你可以看到当前中国和国外的政府对于疫情的不同理念就会明白了。


    所以，我们不能被“平等”、“自由”等话题所迷惑，而是一开始就要找准自己在社会结构中的地位，形成符合自己地位和身份的一套奋斗理念。只有这样，才能让自己的行为符合现实，才能让自己有更好的前途。


    所谓的自由和平等，对于弱势群体来说，根本就是一种不可能实现的幻想，除非你能通过努力改变你的社会阶层，不然就是慕虚荣而取实祸，你幻想着和金字塔顶层的人平等，这无异于痴人说梦，癞蛤蟆想吃天鹅肉！


    如果你一味要追求平等、自由，就会被引导成让你感觉自己的不幸遭遇都是社会造成的，这样只会培养你的对抗性思维，尤其是和权力和财富对抗（仇官仇富就是这样形成的），如果这样的话，那你还有前途吗？你的唯一前途就是成为别有用心的势力的炮灰。'
