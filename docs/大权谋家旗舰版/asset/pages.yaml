- pgno: 240
  md: '张后之功，不欲显诛之。壬戌夜，盗入其第，穷辅国之首及一臂而去。敕有司捕盗，遣中使存问其家，为刻木首葬之，仍赠太傅。


    【翻译】代宗在东宫当太子时，因为李辅国专横跋扈，心里忿忿不平，等到即位后，因为李辅国有杀掉张后的功劳，不想公开杀掉他。壬戌（十七日）夜里，盗贼进入李辅国的宅第，杀掉李辅国，带了他的头和一条臂走了。代宗敕令有关部门捕捉盗贼，又派遣中使慰问李辅国的家属，为他刻了一个木胸袋来安葬李辅国，还追赠他为太傅。


    【解析】权力场上，风云莫测，有事因为你做对了事情，站对了队，一下就名声显赫，大权在握；一不小心站错了队，那就身败名裂，粉身碎骨。而还有一些人，因为前期站对了队，为权力做出巨大贡献，而后期因为不尊重权力而又被权力打击，其中到底是什么原因？


    本案例里面的李辅国就是这样的情况，他作为宦官一直没有得到重用，直到四十岁之后，他帮助唐肃宗继承了皇位，其实对于唐玄宗来说，这个即位有篡位的嫌疑，而后安史之乱平定后，义无反顾的站唐肃宗的立场，对已是太上皇的唐玄宗毫不留情的进行打压。可以说他具有极高的权力敏感性，所以当时他就受到了唐肃宗的重用。


    这时候李辅国大权在握，天下大事几乎全决定于李辅国，朝臣所奏之事往往先经他手然后才告知肃宗。为了更准确地了解朝中大臣的动向，李辅国还专门派几十人负责监督官员的一举一动。对于不顺从的官员加以严厉打击。李辅国根据自己的好恶处治全国的讼案，并以皇意相标榜。地方上的节度使也是李辅国一手委派。


    李辅国权倾朝野，宰相及朝中大臣想见皇帝都须经过李辅国的安排，皇帝的'
  merge: -1
  img_proc: true
- pgno: 241
  md: '诏书也需要李辅国的署名才能施行，群臣不敢提出不同意见。


    当然李辅国最辉煌时刻是在唐肃宗病重弥留之际，冒着巨大风险，做出巨大努力，帮助当时的太子、后来的唐代宗顺利即位，对此唐代宗也是感恩戴德。


    不过这时候李辅国越发膨胀了，他后来甚至和唐代宗说：皇上但内里坐，外事听老奴处置。任何有权力敏感的皇帝都不会容忍下属这么干的。因为长此以往，很可能会江山易主。


    不过这时候，皇宫禁军和地方官员几乎都掌握在李辅国之手，如果你公开捉拿李辅国，至少会有两个问题：


    # 一、把握不大


    鉴于朝廷内外几乎都是李辅国的人，你要用公权力诛杀李辅国，往往可能会事情还没做，被李辅国先下手为强，这样事情没做，自己反而被干掉。所以，公开诛杀几乎不可能。


    # 二、名声不好


    鉴于李辅国对两代皇帝立下汗马功劳，如果公开诛杀，对唐代宗的名声也会产生不好的影响，人家对你那么好，你却要杀了人家，以后就没有人敢跟着你了。基于这点考虑，公开诛杀也是不符合代总利益的。


    在这样的情况下，只能被逼出暗杀的方案，这个方案有以下好处：


    # 一、成功最好，失败洗脱嫌疑


    “未胜先谋败”，在这样的权谋算计之下，进可攻，退可守，成功了当然是最好，如果万一失手，那就可以推卸责任，至少不会被牵连过来，当然还可以把杀手杀人灭口。


    # 二、还可以保留对方名誉'
  merge: -1
