  md: '制” 之术。


    用能臣治众臣：古代帝王往往要设宰相、军机大臣等百官之首，目的就是为了帮助皇帝统领众臣。这种利用能臣治众臣的局面，自古以来就是统治者的独得之秘。能臣把百官治理好了，皇帝再把几个能臣治理好了，于是，天下就基本上太平了，至少，臣僚不会起来造皇帝的反。唐玄宗早期，他先后任用了姚崇和宋璟为相。《资治通鉴·唐纪》记载，姚崇和宋璟任相，致力于选拔人才，能够使得文武百官各司其职。姚崇善于随机应变，宋璟长于秉公守法。二人辅佐玄宗，使得玄宗早期国家强盛，百姓富足人们把唐太宗时期的房玄龄、杜如晦和玄宗时期的姚崇、宋璟并称贤相，实在不为过也。唐玄宗也靠着两个贤相帮助他总理朝政，驾驭百官，巩固了自己统治。当然了，后来唐玄宗任命李林甫来治理百官，李林甫是个大奸臣，对百官玩的是口蜜腹剑的把戏，搞得是顺之者生逆之者死的那一套，结果，唐玄宗认人不准，被李林甫动摇了国本。


    用权臣治能臣：所谓权臣，就是专擅一职的弄权之臣。往往有的时候，主上需要借用某个特殊的臣子，来对能臣进行车制。如果放任能臣操控局面，则有可能出现失控的局面。所以，为了避免这一局面，就必须利用权臣来车制能臣。唐武则天时期，为了震慑百官，压制反叛的思想和言行，武则天启用了来俊臣、周兴等权臣，靠他们来稳固自己的统治。武则天统治之初，大臣徐敬业造反，诸王有不少起兵反对武则天。所以，武则天消灭了这些人之后，特别担心自己治下的大臣会谋害自己。她深知宗室大臣对自己既怨恨且不服，于是就大肆启用酷吏，以此来镇压反对者。来俊臣很好体会了武则天的意图，他纠集一帮人写了《罗织经》，发明了“突地吼”“死猪愁”、“求破家”等酷刑。来俊臣后来诬陷重臣狄仁杰等七人谋反，幸亏狄仁杰巧妙运用谋略，方得保住命。总'
