  md: '# 和你想的不一样！对领导最好的恭维，不是贬低他的对手，而是抬高对手！


    【资治通鉴原文】帝从容问散骑常侍薛莹，孙皓所以亡，对曰：“皓昵近小人，刑罚放滥，大臣诸将，人不自保，此其所以亡也。”他日，又问吾彦，对曰：“吴主英俊，幸辅贤明。”帝笑曰：“若是，何故亡？”彦曰：“天禄永终，历数有属，故为陛下禽耳。”帝善之。


    【翻译】司马炎曾经从容地问散骑侍从官（散骑常侍）薛莹，孙皓所以覆亡的原因。薛莹回答说：“孙皓亲近小人，刑罚太滥，大臣和将领，没有安全保障，覆亡原因在此。”有一天，又问吾彦，吾彦说：“孙皓英俊，幸相贤明。”司马炎说：“如果是这样，怎么会覆亡？”吾彦说：“上天的眷顾，到此为止。天道运转，已另有托付，所以被陛下擒获。”司马炎欣赏他的回答。


    【解析】恭维领导的方式，按照一般的理解，都是用他对手的不堪，来反衬领导的英明，所以史书上往往把前朝都说的很黑暗，这样让本朝的取而代之就成为理所当然，不过当具体到开疆拓土的这位具体帝王身上的时候，却往往又不是那么回事。


    本案例是当西晋灭吴，三国归晋，中国重回统一之后，大概晋武帝司马炎宏观上肯定心情大好，不过具体到微观上，总觉得有那么一点点不踏实，这不，他就到吴国旧臣薛莹、吾彦这边询问故主孙皓的情况。值得说明的是这时候，晋武帝还善待了吴国末代帝王孙皓，晋武帝这样问，毫无疑问是刺探一下吴国旧臣对改朝换代的真实想法，以便决定对孙皓去还是留，吴国的旧臣能不能启用。


    再说明一下，吴国旧臣薛莹、吾彦这时候在西晋都担任大概像散骑常侍类似'
