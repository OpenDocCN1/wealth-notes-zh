    # 混社会的三个顶级内功心法！左右逢源还是鼻青脸肿，只在一念之间


    社会上有有些人混得灰头土脸、鼻青脸肿，有些人却八面玲珑、游刃有余；大家都是同样有手有脚的正常人，为什么表现出来的差距就那么大呢？


    经过我们对历史大样本的提炼，问题主要出现在这些方面：


