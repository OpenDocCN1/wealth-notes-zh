  md: '惧怕丧失政权，就会励精图治，那么，我们就会被斥责疏远。” 他的党羽都下拜感谢，然后离去。


    # 【解析】


    我们知道，做领导的一般都需要和普通人不一样的素质。不然的话，你的位置都坐不稳，更不要说能带领整个组织往前发展了。到底需要什么样的素质呢？一般人都没有说清楚，本案例却从反面切入后提到了。


    一般都认为太监在政坛都是奸臣的存在，尤其是越靠近领导，也就显得越奸恶，为什么会产生这样的情况呢？我们知道其实纵观历史，也有很多太监是贤良的，只是更多的是奸险的，所以人们大概都认为太监都是坏人了。


    其实我们知道因为领导所具备的卓越的素质，和人的自私享受需要是冲突的，比较极端的例子就是“周公吐哺”，换句话说，周公为了处理公事，连最基本的生存需要吃饭都无法保证，更不要说进一步的享受了。


    由此我们看到，对于领导的职位来说，本质上个人享受和一心为公其实是冲突的，所以如果你在领导旁边做贤臣，那就让领导一心为公。如果这个领导不是开国的，没打过仗，不知道世事艰难，又因为继承皇位容易，生于深宫之中，长于妇人之手，不知世事艰难，那贪图享乐是大概率的事情。


    所以如果贤臣在傍边，那就一直会对领导的做法指指点点，如果皇帝喜欢玩乐的话，那就 For不厌其烦，这样就会疏远贤臣，这相当于是逆淘汰的过程。其他人一看，直言犯谏自己倒霉，那不如就纵容享乐邀宠来得方便，所以慢慢的，皇帝身边就会布满了阿谀奉承的人。


    所以才有仇士良说的：天子不可令闲，常宜以奢靡娱其耳目，使日新月盛，无暇更及他事，让他沉迷，甚至故意设局让贤臣在玩乐的进谏，造成皇帝极大反感，以后就没有以后了。'
