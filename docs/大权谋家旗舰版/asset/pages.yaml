- pgno: 144
  md: '段不奏效，那么，只好玩点真格的。这个道理大家都懂。那么，真要准备玩真格的了，又有哪些手段，或者说有哪些方法呢？


    # 其一，精神恫吓。


    汉高祖刘邦消灭了项羽之后，当上了皇帝。刘邦显然玩弄政治是个高手，统军打仗却极其低能。这一点，连刘邦自己都很清楚。刘邦的江山是韩信帮助他打下来的，如果当年韩信造反，跟着项羽一起和刘邦叫板，刘邦就绝没有今天。关于这一点，不仅刘邦心知肚明，而且他手下的大臣，甚至全天下都知道。古人云，功高不赏。韩信功劳太大了，他的存在对刘邦就是一种威
    grupper。所以，刘邦必须CGC... 龙潜回水底。 刘邦的死对头项羽手下有个大将叫钟离昧，当年让刘邦吃了不少苦头。刘邦得了天下，就在全国发布一号通缉令抓捕钟离昧。钟离昧躲无可躲，只好跑去找韩信。韩信自忖功高，认为刘邦不会把他韩信怎么样，就毫不犹豫地把钟离昧给藏起来了。不久，有人就给刘邦送了信，说韩信窝藏钟离昧，想要谋反。刘邦把众人集合起来询问对策。不少人口出狂言：“赶快发兵，我们去把韩信这小子给灭了。”众人头脑发热，刘邦却藏奸不露。过了一会，刘邦问陈平怎么办。陈平是个阴谋大家。他没直接回答，先问刘邦：“韩信谋反，有人上告，这事韩信知道么？”刘邦说，韩信还不知道。陈平说：“陛下的部队与韩信的比，谁的更强些？”刘邦无奈地说：“我的比不了他。”陈平又问：“陛下手下的将领，有能比得了韩信的吗？”刘邦说，我手下没人能胜过韩信。陈平说：“现在我们的军队比不了韩信的军队，将领又比不过韩信，还要率领军队去攻打他，这不是很危险啊？”刘邦着急了，忙问：那我们可怎么办啊？陈平说：'
