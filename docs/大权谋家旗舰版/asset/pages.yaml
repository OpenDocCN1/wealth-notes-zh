- pgno: 290
  md: '“权力人格”，这个特点就是实用、理性、无情、无常、杀伐果决、权谋、和下属保持距离以营造神秘感等等。


    掌握了权力，也就意味着身不由己，屁股决定脑袋，所以很多老朋友会认为权力型人物性情变了，变得不熟悉了，这才是对方真正进入了权力的状态，对我们普通人来说，了解权力，以及背后的权力规律，才能更好的利用好这个权力关系，不然就算你有脸熟作为通行证，对方也不会买你的账。


    # 不管你承不承认，权力都已经全方位地掌控了我们的一切！


    “普天之下，莫非王土，率土之滨，莫非王臣”，小时候在教科书里面看到这句话的时候，很不以为然。没有王，我们也能过照样过的很好。等踏入社会，历经世事后，猛然发现王（权力）无处不在，简直是掌握了我们工作和生活的方方面面。


    “权力”，在社会学及政治学中最普遍的定义，是指一个人根据其意愿而对他人的行为加以控制或者决定的能力。在中国，从古至今，正是这种权力，常常是无所不在的。纵观中国几千年的历史，掌握了政治权力的官员们还有什么事情不归他管呢？


    权力这个东西很奇怪，它虽然不能直接满足人们的生理需求，但在权力集中的条件下，却可以支配人们生理需求的物质资料。在这里，权力实际上可以和一切有价值的东西挂起钩来。只要有了权，土地、财富、一切东西都可以源源而来。中国社会的一个重要历史事实就是：政治权力在当时是比任何有形的东西更值得追求的无价之宝。如果一个人能够掌握国家的最高权力，成了皇帝君'
  merge: -1
  img_proc: true
- pgno: 291
  md: '主，便可以把全国的行政、立法、司法、赏罚以至生杀各种大权集于一身。这是中国古代社会结构最重要的一个特点。而正是由于政治权力所占据的这种突出位置，以至古代中国社会的各个方面，如土地运动、社会分配、阶级构成、思想文化以及社会兴衰等等，实际上都与权力发生了密切地关系。所以考察中国历史，不可不留意于政治权力在中国社会中的这种特殊位置和作用。


    生活在中国现实土地上的人，无论走到哪里，无论办什么事情，无论遇见上司或者碰到领导，不由自主地感到一种束缚，一种制约，一种无形的压力。它是什么？是权力。权力象颈背上的盘石，沉沉的，深深的，框固着你的生活方式，钳制着你的文化行为。它的支配欲好象巨魔手中的权杖，舞到哪里，哪里就只有肃静和屏息。


    纵观中国古代社会的结构，皇权是座金字塔中的顶端部分至高无上、主宰一切。在这种形态下，每个人的谋生途径、每种人的生活方式，以及物质文化和精神文化的享受，权力都可以加以干预。还有道德规范、社会舆论、法律制裁和人生自由，全部掌握在最高权力手中，决定着对于人们是非功罪的评判和祸福荣辱的予夺。你在国家权力结构中所处的是一个何种级别的地位，以及你对权力运用的熟练程度如何，也取决于你是否具有足够冷竣而坚硬的心肠。也就是说，你是否擅长将自己手中的权力，运用到可以使它最大限度地发挥威力震慑他人，而替自己得益！


    从吕不韦的故事我们可以帮助获得启示：为什么在投机政治反倒比直接从事经济活动能更快地发财致富呢？我们认为是由政治权力在中国社会的特殊地位所决定的。


    权力可以造就富翁，权力可以造就英雄，权力还可以给人神圣的光环，把人'
