- pgno: 19
  md: '# ## 三、虚伪化


    民可使由之，不可使知之，历朝历代的统治者多少都为了稳定的需要进行愚民，所以在各种材料里面都会把不符合现实的理论写出来作为教材，让读者也脱离了实际，不过对于统治阶级来说这样就容易管理。当下还有一种情况，就是很多成功人士的人物传记，他们为了美化自己，也为了不要暴露真实的情况引起追责，所以写入的东西大多是美颜过的情节，如果读者把这个当做真相，那就上当受骗了。


    还有一种人，他读书是为了寻找认同，而不是增长自己的水平。其实这样读者一直坚守在自己的舒适区，不但没法提高自己的水平，而是加剧了自己的偏见。


    那对于我们来说，到底应该怎么读书呢？


    一位《大权谋家》的典型学员说过：2012 年我就开始探索，整整 10 年。10 年我日夜兼程看书学习，最后得到读书无用的结论，遇到老师之后才真正知道读无用书无用，读有用书有用；今日读今日无用，今后可能有用。读书也是需要学以致用的。


    目前，在工作中可以很顺畅地站在管理者的角度思考和工作。现在开始有部分工作领导没有想到的，自己已做好；领导正在吩咐的，自己已经完成——总之，正学以致用。


    可以站在领导的角度，可以站在下属的角度，可以站在老师的角度，也可以站在孩子的角度，可以站在朋友的角度，也可以站在对手的角度思考问题。这样，方法和得出的结论大致是不会错了。


    所以真正的读书应该是立足于现实，立足于有用，而不是用读书来论证自己'
