  md: '# 2、感情操控


    感情关系当然比亲缘关系要淡一些，所以感情操控比亲缘操控的效果要差些。


    在这里，“感情”可以理解为人们精神生活中的某种情感（以良性居多，也包括恶性情感，比如厌恶、憎恨等），它是人与人之间一种精神的交流和契合。


    众所周知，只要是人，就会有七情六欲。人类的感情非常丰富，不仅有爱情，也有友情；不仅有稳定持久的情感，也有瞬间出现的不稳定的情绪。真正的高手，能够全面考量对方的情感，从竞争对手感情最柔软的地方出发，通过不断实施感情操控从而实现对竞争对手的终极操控。


    下面，笔者按照逻辑顺序，一层层把感情操控手段剥开，全面探讨利用感情实施操控的方法：


    # （1）利用爱情手段操控竞争对手。


    “三十六计”中的“美人计”，就是利用竞争对手感情上的薄弱环节，以爱情（或肉欲）操控对方，使其心甘情愿地为自己所驱策。范蠡用西施迷惑夫差，王允用貂蝉引诱吕布，都是人们耳熟能详的例子。而且，那些中招之人不仅心甘情愿被控制，还要大呼“让美人计来得更猛烈些吧”。官场上的“枕头风”、“夫人路线”，其根本着眼点就是利用感情手段实施操控。


    # （2）利用友情手段操控竞争对手。


    友情是除了亲情和爱情之外人类最重要的感情之一，当然也是人类存在的最普遍的弱点之一。利用友情手段实施操控，是一个古老而常新的话题。下面，我们来看一个利用友情手段实施操控的案例。


    明朝嘉靖期间，一代奸相严嵩和大臣臣大臣夏言同殿称臣。初期，夏言无论是才能、声望还是官职都在严嵩之上。严嵩虽然不服气，却也无可奈何。但这'
