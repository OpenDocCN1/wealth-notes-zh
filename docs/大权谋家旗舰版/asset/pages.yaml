  md: '如果你经历丰富、历史读多了以后，你用人性本善已经无法解释社会和历史中所发生的事情，这就需要跳脱出原来的观念了。


    “舆人成舆则欲人之富贵，匠人成棺则欲人之夭死也”，也就是说：造车的希望人人富贵，卖棺材的希望人多死；按照我们普通的道德看的话，希望别人富贵就是善的，而希望别人早死就是恶的。其实他们本意不是善恶，他们的出发点在自己的利益，希望自己多做生意多赚钱，所以由此可见，善恶并不是根本，利益才是根本。


    人做任何事都是有目的的，也是有利用可图才为之，目的是精神愉悦，或身体舒畅或者物质增加，也正是这样客观追求的存在，才推动个人、家庭、国家甚至人类社会不断向前发展。


    所以我们国家政策，如果只是停留在口号阶段，你就知道他不会很持久，要把这个政策长期执行下去，必须要和每个人的利益挂钩起来，这样才能真正的生根发芽，深入人心。


    对于我们普通人来说：“人行事施予，以利之为心，则越人易和；以害之为心，则父子离且怨。”就是说我们与人相处、合作，一定要照顾对方的利益关切，这样才能慢慢聚拢；如果只想着自己，需要“损人利己”，那么就算是儿子都会远离你。


    权谋家看人性是无所谓善还是恶，而是要以一种自然主义的观点对人性做剖析，权谋家认为人有两面性即善和恶，但是无论善和恶，都存在着积极因素，这种积极因素的表现，就是即便人性恶，实际发挥作用的结果也可以是善的。


    就如卖棺材的人希望人死，这是恶的，可是实际的结果是他的棺材解决了死者死后的问题，这就是善了，如果没有匠人的恶就没有了实际中的善。至于舆'
