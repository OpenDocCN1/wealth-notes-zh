  md: '后来，唐玄宗想起他，问李林甫：“严挺之现在在哪儿？此人可用。”


    李林甫当晚把严挺之的弟弟严损之召到府中“叙旧”，虚伪地以老朋友自居，说：“当授子员外郎。”李林甫又进一步套近乎说：“皇上对你哥哥很关心，须作一计，人城面见，当有大用。”并教严损之为其兄写一状纸，以身体不好为名，请人京就医。


    严损之不知是计，反倒心怀感激，一切照办。李林甫拿着严损之写的状纸，面奏玄宗说：“严挺之年事已高，近患风疾，急需辞官就医。”玄宗听后，叹息良久，只好令严挺之到东京养病去了。


