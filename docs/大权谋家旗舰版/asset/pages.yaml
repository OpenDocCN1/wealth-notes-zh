    有人就要说了，葛婴不是已经把他立的楚王襄强杀了吗，已经改正过失了啊，陈胜还不能放过他吗？没错，权力角度看，一定不能放过。因为权力不仅仅看行为，而是看背后你的权力思维模式，你现在这样做了，证明你没把我放在眼里，完全没有尊重我的权力，日后你一定还会再犯，这次很可能只是形势所迫而已。等条件成熟，你一定还会这样做，与其留隐患，不如先除去隐患。


    在中国职场上，重要的是不是你的能力，而是你的站队，更是站队背后所体现的政治意识，而越权是比站错队更严重的错误，所以职场上，这样的政治错误'
