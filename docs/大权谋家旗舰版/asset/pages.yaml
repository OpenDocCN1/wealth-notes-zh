  md: '回过头来，结合着秦王朝的背景再研究赵高所说的话，就会发现赵高机心之深，用心之险，并日也就知道李斯着丁赵高的道儿，其实是有几分道理的：


    首先，秦国一向有谋杀、驱逐和里免功臣的传统。在秦国有RED树？在秦国有...的文臣和立下赫赫战功的武将，都有遭到疏远、惩罚甚至诛灭的先例。比如秦惠文王时期，车裂了变法功臣商鞅。商鞅是秦国由弱转强的关键人物，其变法使得秦国百姓深受其益，使得秦国国力迅速增强。如此功臣，反遭到国王谋杀，以此可见秦国国内政治生存环境的险恶，以及秦王对臣下的弃如azzi橛的态度。再比如，秦昭王当政，先是驱逐了在乃兄武王时期灭亡周朝的右相甘茂，而后重用其舅舅魏冉。魏冉提出年霸的大战路，使得秦国国力进一步发展，为秦国争地杀敌立下汗马功劳，有效地奠定了秦国争霸的有利态势。然而如此功臣却也被昭王“勒令退休”，以老迈之身踏上千里行程，下场凄惨，老死陶邑。接替魏冉的是范睢，前面已经提到过了。此人年轻时历尽坎坷，具有发达的政治头脑和绝对高的斗争智慧，凭着自己一己之力帮助昭王谋划大事，驱逐魏冉取而代之当上丞相。在此人任上，恢复了秦国“远交近攻”的传统战略，为秦国在六国中纵横捭阖并最终形成泰山压顶必然统一之势奠定了基础。然而此人，前面也提到了，虽然立下大功，却在后期受到昭王猜忌，最后称病辞去相位。以辉煌的顶峰跌落凡尘，范睢同样经历了一场政治灾难，就在辞职的同年，他就死去了。


    这范睢并非政治斗争的俗手。他早年为了活命，装死吃屎，这都暂且不提；单人他设计逼死白起，就看出;他政治斗争水平之高，搏弈之老练。可惜如此之人，也不得不从秦国政坛上黯然陨落。秦国政坛之险恶可见一斑。


    我们刚说到的白起，了解点历史的人都知道他，他在战国史上是绝无仅有的一员大将、杀人机器。在历次作战中，几乎百战百胜，并且长平一战，坑杀赵'
  merge: -1
  img_proc: true
- pgno: 129
  md: '国降卒四十万，极大削弱了赵国战斗力，震慑六国。但即使如此功臣，最终也被秦王下令自裁。白起的功成身死的事例，秦国那些建大功之臣的凄惨下场，熟读史书学究天人的李斯不可能不知道。再之后，秦始皇诛杀吕不韦，则是李斯亲眼所见。感同身受，免死狐悲，本也是人之常情。但李斯能够在如此暴虐的权术教主秦始皇跟前一直混到底，可见他趋利避害的政治本能及见微知著的权力斗争素养并非常人所能及。也正以为如此，李斯对未知有更多的考虑，对灾难有着更敏说的警觉，对变局有着更深刻的体察，也对从权力大锅中火中取栗的艰难和不易有着更复杂的感觉。当我们知道了赵高
    PK 李斯的大背景之后，就能够对李斯之所以在阴谋之祖宦官 “赵高” 的威慑手段下 “中招” 有着比较全面的了解。


    其次，就蒙恬和扶苏的关系来看，也显然是李斯不能比拟的。李斯从政多年，深知政治斗争中以帮派为依托党同伐异结党营私的道理。帮派斗争的种种理论，李斯作为丞相早就参得透得不能再透了；而且，李斯乃是一代伟大的政治家，对于当时时局的把握和权力斗争的动向一清二楚。不然，他大可问一句：“阁下何以得知扶苏用蒙恬为相？”
    相反，他没问，由此可见，赵高说的是实情。退一步讲，即使不是实情，但赵高分析蒙恬之能，以及蒙恬与扶苏关系之密，再及扶苏即位后重用蒙恬为相的可能性之大，显然在理论上是能够成立的。这一点，擅长谋划的李斯想必也能够想见得到。因此，扶苏继位后，李斯能否仍如当前一样占据相位，位高权重，在当时真的是个未知数。这一点双方心知肚明。赵高把这一点挑明了，更加坐实了李斯的担忧，从而有效地对李斯构成了心理威慑。


    最后，如果李斯是无欲则刚之人，则任凭赵高如何威胁，李斯也不会同意其'
  merge: -1
  img_proc: true
- pgno: 130
  md: '阳谋。但是，我们在操控中提到了，如果要操控对手，首先对手必须具备可操控的空间。那么，李斯是无欲则刚的类型么？换向话说，李斯是否能够将自身利益置于脑后一心为国不计得失么？这个问题很好回答。当年李斯不过是上蔡的一个普通百姓，为了追逐权势，我荀子求帝王之术。之后，一路西行入秦，在秦国奋斗数十年，方爬上丞相高位。在攀爬期间，为了迎合始皇帝对自己的恩人吕不韦落井下石，为了确保权势对自己的同门师兄暗下毒手。这些事情都证明了，李斯是一个看重权力贪图权势的人。因此，以失去权力作威胁来说服李斯，是具备可操控的空间的。赵高瞄准李斯弱点出手，以失去权力为威慑假想图，为李斯勾面了一个可怕的场景，一出手，就打中了李斯的痛处。


    分析了这些，我们就明白赵高其实已经抓住了李斯的七寸。他接着说：“我受皇帝诏令教授胡交学习法律条文多年了，还没有见他出过什么差错。他为人慈善仁义，诚实厚道，轻视财务，尊重人才，内心聪慧但不善花言巧语，遵从来礼仪而又尊重贤士。秦朝的各位公子没有比得上他的。我认为可以扶胡交登皇位。您考虑考虑再作史定吧。”
    赵高在这番说辞中，先是撇清了自己和胡交的私人关系，而且又高度赞扬了胡交的基本素质，以及胡交尊重老同志、重感情、诚实厚道的人品，为李斯提供了一条可供选择的化危为安的途径。


    但是，历史记载，李斯深受始皇帝器重，一路提拔，委以重任；现在始皇帝尸骨未寒，如果背叛皇帝旨意，这不仅从感情上说不过去，而且，一个弄不好，反而会遗祸自身。所以，李斯在思考的电光火石的一瞬间之后，对赵高说：“回到你的位置上做你份内的事吧。我奉行皇帝的诏令，听从天意的安排，有什么值得考虑决定的？”
    我们来详细分析这段话。李斯不说赵高的逻辑错误，显然已经听明白了赵高猜度的可能性后果，至于是否真正产生了担心不得而知，但'
  merge: -1
  img_proc: true
- pgno: 131
  md: '是，他并没有反驳赵高的话，可见在一定程度上认同了赵高的立论。然而，我们知道，作为政治家的李斯和作为阴谋家的赵高之最大不同，在于李斯具有一定的政治理念、政治理想和政治抱负，能够深刻认识时代进步的走向，把握政治发展的脉络，并且在一定程度上也愿意为之努力、奉献甚至牺牲。而作为一个纯粹的阴谋家，赵高在政治上则并没有什么建设性理念，他所有的行动全部指向一点，即为了自己最大程度地摄取权力服务。我们说阴谋家是政治大厦的蛙虫，就是因为明谋家是一个解构者而非建构者。他们往往会为了己之私，为了个人之权欲，丝毫不顾国家大局，任意排除异己安插同类，难性影响。所以，就李斯来说，作为一代政治家，还是具有“政治人”一点点驻空国家政权的栋梁，给垫个国家造成灾的基本政治法则和政治良心的。他或许也为自己的前途担忧，但同时又认为，立扶苏是皇帝的决定，自己当以国家为重，不能过多去考虑其他的问题。


    赵高从李斯的迳锷中听明白了李斯的意思，虽然又被拒绝了一次，却更加执著更加顽强。他马上从前面的思路中跳了出来，说：“众所周知，平安可以转变成为危险，危险可以转化为平安。在安危关头拿不定主意，这算得上是尊贵贤明吗？”我们不说赵高人品如何，单从他这几向话，就足以看出他对于世事的把握和洞察，也就明白他一个普通大监深受秦始皇喜爱的原因。赵高用发展的思维，揭示了平安和危险的可转化性，再次提醒了李斯一番，然后转向丛“是否聪明”这个角度上去激李斯。大家都知道，人争一口气，特别是读书人，最怕别人看不起说自己苯。因此，赵高的这番说群，再次打到了李斯争强好胜的弱点上了。


    李斯见赵高如此说，立马接口说：“我李斯，只是上蔡街头巷里的一个平头'
  merge: -1
  img_proc: true
- pgno: 132
  md: '百姓，幸而承蒙皇帝提拔当上了丞相，封为通侯，子孙地位尊贵，享受厚禄，把国家存亡安危的重任交付我。我怎么能够辜负皇上的恩德呢。忠臣不因苟且偷生而逃避死亡，孝子不因为看见危险而不勤奋劳作，我们作臣子的应该各自尽各自的职责，您不要再那样说了，那样会让我犯罪的。


    赵高见李斯念念不忘始皇帝的恩德，而且又把忠君大义搬了出来，最后说害怕由此带来祸患，于是就明白了李斯的真实想法。他说：“听说圣人灵活多变，根据潮流而变化，看到事物的表象就知道它本质，观察事物的动向就知道它的结果。事物本身就有这些变化，哪有一成不变的常规呢？
    现在国家的权力，百姓的性命都掌握在他手里，我是知道他意图的，能够改变和左右他（这里点明了和李斯同谋成功的可能性）。况且居于外面的人想要控制朝廷是犯上作乱，在下面的人想要控制皇上是反叛行为。（这句话的意思是说一日胡亥成了皇帝，扶苏、蒙恬等人在有异动就是犯上作乱了，暗示了李斯立胡亥是具有较大安全系数的。）所以，秋霜降落的时候百花都会调零，春雪消融的时候万物就会生长，这是事物的必然结果。您为什么这么迟钝呢？”
    赵高这句话把自然中常见的现象背后的必然性揭示出来，以此反证自己的推断都是合情合理的，如同霜降花落、水Wat物生一样是事物发展的必然趋势，明白无误地告诉李斯：将来自李斯受制于扶苏和蒙恬是必然的，而拥立胡亥也必然是安全的。


    李斯见其担心的谋划不成祸及自身的顾虑被赵高反驳了，于是说：“我听说晋国改立太子，导致三世都不安定；齐桓公兄弟争位，导致骨肉相残；纣王杀害亲属，不听劝谏，都城夷为废墟，国家最终灭亡。这三件事都违反了天意，造成国家危难，宗庙无人祭祀。我李斯是个堂堂正正的人，岂能作出这样的事呢？”
    我们看李斯说的这番话，显然他已经认同了赵高作出的 “扶苏即位则'
  merge: -1
  img_proc: true
- pgno: 133
  md: '李斯失权”的命题，但是，仍然还有一层顾虑，即担心事情不成功。


    赵高对道：“上下同心协力，可以长治久安，内外君臣一致，就不会有什么乱子了。(这向话等于告诉李斯事情成功的把握很大，并没有多么大的祸患。) 您如果听从我的计策，就能够长期保持侯位，享受王子乔、赤松子（传说中的仙人，笔者注）那样的高寿，具有孔子、墨子那样的智慧。现在如果放弃这种选择而不听从我的建议，就会祸及子孙，这是很可悲的啊。聪明人能够将灾祸转变成福气，你究竟打算怎样？”


    李斯听完，反复考虑了一下-私欲毕竟战胜了理性，所以在本质上他是具有可操控空间的人，而赵高正抓住这一点实施操控--然后，他仰面长叹，流泪叹息说：“唉，我怎么唯独遇到这种乱世呢。既然不能以死报放皇帝，叉往何处寄托我的命运呢？”于是，李斯就听从了赵高的建议。


    赵高回的胡亥身边，把一切隐瞒，从容地回报说：“我以您的命令明白告诉丞相，他哪里敢不听呢？”于是，赵高阴谋得以实施，这段精形绝伦的 PK，以人赵高获胜而告终。


    然系坊典的这者都知道，赵高貌划的这场開谋，纯是从自己手权奇利的角度出发的。他纪是战通了胡交，后叉说服了李斯。想那胡玄乃痴果之人，被赵高操控犹在储迎之中：但那李斯乃绝顶高手，其政治斗争的经验才能和手院，是绝对不可小视的。然而，在李赵
    下 PK 过程中是什么导致了李败赵胜呢？答案当然是威慑。


    下面，我们再把这次对话的思路理顺一下。赵高要李斯扶立胡交，李斯说这样很可能 起国家灾难，推说臣下不能做此事。赵高说如果不做，你李斯就可能就要完蛋。李斯说如果做不成，很可能自己先完蛋。而且，这事儿风险极大，'
  merge: -1
  img_proc: true
- pgno: 134
  md: '有许多干不成的例子摆在那。赵高说那不可能，只要咱哥仁一起联手，这事儿肯定成。李斯做了反复的考志，虽然顾念始皇帝的恩情，而且丢不下自己的政治信条，但是，一旦危及自己的核心利益，也只好把这些东西往后排了。于是，赵高以恐吓威慑手段操控李斯获得成功。大功告成后，赵高奠定了掌握大权的基础，李斯则一手造就了自己无可挽回的命运。

    我们说，如果当时李斯没有听从赵高的建议，不与赵高合作的话，他的下场也未必就能好到哪里去。关于这一点，历史的发展有其逻辑上的合理性，而且两大高手均已看出来了。可是，李斯出于保住自己的权位的考虑，背叛始皇，篡改诏书，这也是他应对可能出现的下坡路的一种理性选择。我们再假设一下，如果没有后来赵高的迫害，李斯很可能功德圆满，那么，李斯的选择则必然是正确的。然而，历史不能假设。赵高为李斯描绘了一种可怕的前景，以此对李斯实施威慑；李斯在反复权衡之后，不得不就范，协同赵高一起进行了沙丘之变。我们洞穿几千年的时空，重新回望这场惊天大阴谋，发现，在整个权力斗争中，赵高操控李斯是整个阴谋中的关键环节，而赵高运用的威慑手段，则是关键中的关键。正是这种威慑手段，使得衣食无忧高高在上的李斯产生了恐惧，并且不得不受赵高操控。

    这段再次历史证明了，威慑操控在权力斗年中起着不可低估的作用。同样，按下来的这段历史，续写了威慑操控的精彩华章。

    主佛依然在李斯和赵高两大高手之间展开，此次分处胜负的关键，依然是威慑手段。下面，我们继续分析：

    赵高设定阴谋，暗害李斯，使得李斯入狱（参见《史记》卷八七《李斯列传》）。李斯自页瓣才，而且叉田攸其功，暗自猜测三世一定不会对他不理不问，'
  merge: -1
  img_proc: true
- pgno: 135
  md: '于是，便将赵商盟加在自己头上的谋区银名全部承认下来。赵商派人在狱中折磨李斯，李斯却受尽酷州而不自吞。他在被中上书一封，历数自己对秦的功结，希望如同当年速秦始皇一般，说服二世四心镜恋救免自己。
    然而，李斯却设料到，他的对手，谋始祖，早 grab对他的咸鱼大翻身提防再三，并且已经胸有成竹地开始摆布他。


    赵高看到了李斯的奏疏，说：“囚犯岂能上书。，然后，命狱卒销毁奏疏。他指使自己的门路十余人很物波佰史、渴者、待中轮香特问李好。（每次李斯都以为是二世派米的使者，手是推翻口供，申诉是赵高迫害自己。赵高听说李斯翻供，便派人去拷打他。


    经过多次反复，李斯被折磨怕了，生怕赵高试探他，以致二世真的派人去验证李斯口供的时候，李斯始终 不敢改变原先屈打成招的供词而自认有罪。判决书呈给二世之后，二世庆幸地说：“如果没有赵高，恐怕就要被丞相骗了。”于是，李斯罪名成立，受尽五种刑罚之后，被腰斩于市。


    我们回过头再来研究这个案例。赵高设计的阴谋，固然是一桩骗术没错，但是，他设计的核心要害，却仍然是威慑手段。他抓佳了李斯的弱点，一而再、再而三地对李斯施谋，而李斯则一而再、再而三地上套，我们不能去批评李斯，只得慨叹这是他人性弱点所致，是他“政治性格决定凄惨命运”的悲衰。赵高是历代阴谋家的祖师爷，他既然第一次能够操控李斯，那就一定能够从中总结成功的经验，分析李斯人性的弱点，特别对李斯易受“威慑”操控的弱点进行了认真分析；果然，到了第二次斗手来临之时，赵高依然按照“威慑”思路，一次又一次地假扮使者套取李斯的翻供，并一次又一次地用刑惩罚李斯的翻供，最后，在李斯的心里形成了一个思维定式，即-如若敢翻供，则赵叔很生气，那'
  merge: -1
  img_proc: true
- pgno: 136
  md: '么后果很严重。故此，等到二世亲自派人来问罪的时候，他依然悯于从前的经历而不敢动弹。看到这里，我们不得不仰天流泪，哀叹一代伟大政治家李斯的可悲。


    这一事例，又一次向人们说明了“威慑”操控的重要作用。


    分析这两大高手对决，人们会提出这样一个疑问：为何赵高的“威慑”手段能够成功操控李斯呢？原因已经前面回答了，是因为李斯具备可操控的空间。那么我们要接着研究，究竟是什么弱点，导致了李斯的受控可能，以致被赵高抓住趁隙而入，从而倾覆了李斯的政治生命，毁灭了李斯的一生呢？


    历史早已告诉了人们答案。《李斯列传》中写道：李斯在和他儿子一起被腰斩的时候，回头对儿子说了这样一向话：“我真想再和你一起牵着黄狗出城到上蔡东门那边去打猎捉兔，这种要求都无法实现了啊。”之后，父于相对痛哭；李斯终被诛三族。


    原来，李斯人性的弱点在于此。


    人们常说：“人之将死，其言也善；鸟之将死，其鸣也哀。”李斯临死的时候，终于暴露出了他的人性中最真实的一面：原来，他对生命是如此之留恋，对生活是如此之向往。他对“生之趣”追求的背面，定然就是对“死之伤”的厌恶和惧怕。李斯父子相对大哭，正是他们喜生恶死、留恋繁华的真实写照。这样，我们也就知道了李斯人性深处的弱点-对生之爱，必反证对死之惧；对富足之好，必反证对贫贱之憎。这就是李斯的根本弱点。赵高从“失去权势富贵”和“失去生命家人”来立论，以此威慑李斯，自是弹无虚发，招招致命。李斯被“威慑”操控的命运，其实就来自于他对功名富贵的留恋和对权势的追求，这在他早年感悟“厕鼠仓鼠之不同”的时候，就已经种下了祸根。'
