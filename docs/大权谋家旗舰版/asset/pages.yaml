- pgno: 227
  md: '那作为皇帝到底需要什么用的素质呢？很简单，从宏观看知道一个政权的兴衰成败，然后把他运用到现实里面来，再从细节着手看怎么操作，其实中国历史上有皇帝操作说明书，这个说明书就是《韩非子》，他里面讲的观念和我们普通人被教育的知识完全不一样，对普通人是一种极大的震撼，不过他的手段非常有效，里面有原理有方法，还有解析，当然后面还有《资治通鉴》这样的大书，如果读懂了，了解到了世事兴衰，也就大概知道当前应该怎么做了。


    但是皇帝如果知道了怎么做了，那些谄媚的周边人就遭殃了，因为太监不像大臣，大臣因为随时能应变，他可以谄媚，也可以贤良，都可以按照领导的需要来，而太监往往不读书的，他不懂世事兴衰的变化的原理，所以也不可能对皇帝提出什么宝贵的意见。所以他们这个群体必须不让皇帝知道治乱兴衰的道理，这样他们才能浑水摸鱼。


    所以，从宏观看一个组织有没有发展前途，看看这个组织的领导人是不是沉迷享受，有没有高瞻远瞩的胆略。如果他被一帮阿谀奉承的小人所包围，那你肯定知道这个组织好不了，你还是赶紧离开吧。


    我们总是认为，只有上司才能操控下属，而实际上，中国历史上能操控上司的下属也很多，本文就是下级操控上级（帝王）的巅峰操作方法指导，直至今日，仍有用武之地，关键看你能不能举一反三！


    # 下属被上级提拔的核心要素是什么？


    最近有个学员问：我们单位有个新空出来的位子，正好我也有资格参与竞争，而且一直以来，自己在当前岗位的表现非常不错，也拿到了几次优秀员工奖，'
  merge: -1
  img_proc: true
- pgno: 228
  md: '所以这时候就给有决定权的上级请客送礼，但这个位置上级最后还是给了别人，自己很是想不通。


    相信这个问题不是个别，很多朋友都遇到过，所以我们必须把这个问题说详细一点，说透一点。


    # 第一、酝酿


    一般情况下，在单位的重要岗位有变动的时候，单位的领导都是预先得知，而且会预先安排相关人等了解、熟悉、准备阶段，而题主预先没有得到任何消息，证明你根本就不在领导的考虑范围，所以一般而言，题主这样的是没有啥机会的。


    # 第二、临时抱佛脚


    题主在得到消息后，临时抱佛脚，赶紧给相关上级请客送礼，这时候其实已经来不及了，因为你的对手，很可能是上级的心腹，或者长期向上级靠拢的，在这个过程中，让上级领导进行了充分的了解，所以功夫在平时。


    # 第三、权力规则


    你的升职，对于领导来说是提拔，提拔的本质是领导权力的延伸，看似是对你进行权力授权，而实际上是上级通过下级的手来实现他的目的，所以如果大家没有长时间的磨合，领导也不敢把这个职位交给你。


    所以，决定你能不能升职的主要因素，不是你能力强，业绩好，而是你对领导有多忠心，而忠心这个判断，领导需要经过长时间的观察乃至于测试，所以指望临时抱佛脚就能拿下心仪的职位，无异于天方夜谭。


    那最后有个问题了，既然领导收了礼物，但又没帮我达到目的，他是不是要把礼品退回来呢？如果你真这样想，那你在这个单位就永远没有机会了。正确'
