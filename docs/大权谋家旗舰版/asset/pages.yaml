- pgno: 113
  md: '是学术问题且不去管它，但是，其中蕴含的大道理，却的确的确是古人的智慧所在。这一点，需要人们去学习。不管怎样，张良以其卓绝的智慧和谋略，辅佐刘邦开汉家四百年江山，继太公立周朝八百年基业之后，成就了又一个强大统一的王朝，其贡献实在非同小可。而张良此人的政治智慧、谋略之术，则在今天，尤有值得人们借鉴并发扬光大的地方。在上面的例子中，张良以书生之躯，区区一计，就使得富有天下、执政江山的老流氓刘邦无可奈何，唯有垂泪大哭而已，其威慑手段之高明，亦可见一斑了。


    话扯远了，我们回过头来，接着谈威慑手段的重要作用。


    秦王焚书坑儒，固然是要禁天下读书人之口，但其用的 “焚” 和 “坑” 的手段，却是威慑心理的实际运用。当然了，秦始皇的焚书坑儒没有能控制住人们的思想，也未能有效慑止人们的造反。“坑灰未冷山东乱，刘项原来不读书。”
    刘邦项羽等人都不要命的主儿，心狠手黑；秦始皇的威慑政策，碰见这种拎着脑袋混江湖的主儿，只好徒唤奈何了。但秦始皇的威慑手段的失败，却并不能证明威慑手段无用。项羽正是凭着
    “力拔山兮气盖世” 的武猛和 “西楚霸王” 的威名，才在秦灭之后压服诸路英雄的。刘邦也是擅长此道的高手。他当了皇帝后，在朝堂上大设礼仪，尊尊卑卑。礼仪制定后，华丽的装束，赫赫的威仪，极力彰显皇帝的尊严，突出刘邦受命于天至高无上的地位手此，才把素日狂安到用剑砍堂柱的一帮哥们，收拾得服服站站。他的这个方法，同样是威慑手段。在竞争中，威慑虽然是刚性的手段，但是，却并不总是传达消极的意思，有的时候，通过消极的威慑，却能够达成积极的进步意义。这样的例子历史上也有不少。


