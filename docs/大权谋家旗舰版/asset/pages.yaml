- pgno: 115
  md: '调的是未来，以未来某一时间段上的可怕境遇到威慑对方，使对方出于对今后或长远考虑，而自觉服从我方操控。


    明朝正德年间，秦王上表请朝廷增加自己采邑（封地），将陕西一带边疆之地封给自己。当时天下有识之士均知此地重要，不可轻易许之于人。无奈当时权臣臣钱宁、江彬等人都受了贿赂，竭力恳恳皇帝答应秦王请求。武宗听从谴言，命令臣臣下起草诏书。朝臣杨廷和与蒋冕都生怕将来留下祸患，于是推托有病不来上班。时任吏部尚书（相当于组织部长）的梁储接下这一棘手的任务，起草了如此一道诏书：“当初太祖下令说‘这块土地不得封给藩镇诸侯’。之所以如此，并非太祖小气吝啬，而是顾念此地广阔富饶，如果藩镇诸王得到它，养蓄众多士卒，积储众多兵马，必然会因为富足强大而愈亦骄横，一旦受了奸邪之人引诱，就可能要作出不轨之事，于朝廷，于诸王不利。如今(秦)王恳请封予此地，王得到此地后，不可收聚奸邪小人，不可蓄养众多武士，不可听信奸佞诱导，不可作出不轨之事，震动边陲，危及社稷。如若不听，到时虽然顾念皇亲眷属之谊也来不及了。王谨记，万万不可轻视。”我们今天展书细观，这哪里是诏书，分明是一份提醒皇帝的进谏书。诏书中把分封秦王的消极后果借太祖之口一一­点明，特别指出了分封可能引发的祸患，揭示了分封的灾难性后果，对皇帝造成了心理震慑。果然，皇帝看到诏书后，大吃一惊，十分弦惧，暗想：“原来分封此地的后果如此可怕，我还是不给他吧。”这件事于是不了了之。在这里，蒋冕没有直接上疏奏明分封的危害，于是也就避开了与钱宁和江彬等人的正面矛盾；他巧妙地将分封的可怕后果写在诏书里，让皇帝自己从中受到震慑，从而有效操控了皇帝的思维，使得皇帝自动终止了此事。这个案例并没有从制止眼下的分封出发，而是从长远着眼，以威慑的时间性状，揭示'
  merge: -1
