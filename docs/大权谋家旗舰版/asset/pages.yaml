  md: 历史的经验告诉我们，权谋对手人。对手社会的作用非常巨大，它决定着一个人的成败得失，决定着一支军队的胜负荣辱，决定着一个国家的盛衰存亡，决定着一个社会的进退治乱。正是所谓“一策而转危局，一语而退千军，一计而平强乱，数言而定国基”。举凡有作为的政治家、军事家、经济家，  毫不重视权谋。
