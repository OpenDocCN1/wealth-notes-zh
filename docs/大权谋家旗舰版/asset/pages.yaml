- pgno: 116
  md: '了分封的可怕后果。这样，皇帝考虑到今后可能引发的政治动荡，于是提前作出了预防性措施——停止分封。


    # (2) 威慑成功 = 能力 × 决心 × 有效传递给对方信息


    首先，要成功实施威慑，必须具有强大的实力。


    众所周知，要想在竞争中构筑有效的威慑状态，必须具有强大的力量，并以此为依凭对方实施威胁。说白了，既然要威要吓，就必须得有力量。力量是威慑的基本条件；如果没有强大的物质基础作支撑，那么威是不可能生效。强大的实力，是实施威慑的第一要旨。


    那么，力量的含义是什么呢？从最低层次来说，力量首先包括肉体消灭的实力。也就是说，掌握了这种力量，就能够消灭对方的肉体，给对方以生命的威胁或伤害。如果具备了这种力量，则能够在必要的时候对对手构成生命的限制。因此，可以在一定程度上令对手胆丧神衰，从而能够有效操控对手。历史上的皇帝对臣下的生杀大权，是低层实力的重要体现。从高一点的层次来说，实力包括限制对方经济和打击对方名誉的力量，比如：控制了经济命脉，就能够使得对手分因交加，无法生存；掌握了舆论工具或话语权，就可能使对方百口莫辩、有苦难言。再高层次的实力，就是使对手在竞争中出局的能力。一般来说，我们把能够剥夺对方肉体生存的能力（合法或非法的暴力）、截断对方经济来源的能力、在名誉上打击和在生活上孤立对方的能力及一些其他能力，统称为“力量”。


    在力量塔的整体架构上，越是处在上层力量越强；越是处在下层力量越弱。而且，根据一个非常奇怪的定律——强者恒强，弱者愈弱。越是上层，由于其掌握的实力强大，资源丰富，他的发展越是乐观；越是处在下层，掌握的资源'
  merge: -1
  img_proc: true
- pgno: 117
  md: '少实力弱，越是要任人宰割，其发展中遇到的阻力就越大。所以，有了力量，就有了 一切；没有力量，一切都会失去。故而，力争上游，努力建设强大的实力，确保自己的存在，这是竞争游戏所必须遵循的原则。


    对于处在力量塔主体上的任何一个级别的角色来说，都需要清醒认识到自己的实力。要盘点自己在竞争中所具备的财权、人权和舆论权，理清自己的实力资产。在正确认清自己的资源后，根据目标，灵活运用这些力量资源展开威慑行动。一方面，处在上层的人物，可资利用的实力强，因此顺利实施威慑操控的可能性也大；另一方面，即使是处在下层的人物，也并非没有用弱小的力量威慑力量强大者的能力。下面我们举例来说明：


    战国时，秦昭王请赵惠文王到渑池相会。秦王喝到痛快之际，想当众侮辱赵王，于是说：“寡人听说赵王你爱好音乐。请你给俺演奏一段助兴吧。”由于是超级大国，自然可以“先发制人”，赵王无奈，迫不得已给秦王弹了一段瑟。秦国史官当场记下这事，念道：“某年某月某日，秦王命赵王弹瑟。”如此一来，赵国颜面顿失。赵王作为堂堂七雄之一，在宴会上成了演奏家，这是很丢人的一件事。赵王臣很愤恨却又无可奈何。只见蔺相如抱着一个瓦缶，走上前去对秦王朗声道：“我家大王听说您擅长秦国的音乐，现在就请您奏一段瓦缶助助兴吧。”秦王连赵国老大都不放在眼里，更别提老大的小弟了，于是大怒，一口回绝。蔺相如抱着瓦缶又向前跨出几步，说：“五步之内，我可以血溅大王。”


    秦王手下见他冒犯大王，马上围上来要杀相如。蔺相如瞪圆眼睛，大声斥责卫士，卫士见其怒发冲冠，形同疯虎，一时间无可奈何。秦王一见这形势，倒也果真担心蔺相如宁为玉碎、不为瓦全，一时冲动之下会伤害到自己的安全，'
