  md: '千万不能犯，只要犯了，就难以翻身！


    # 为什么中国高人说话都不是开门见山，而是先要寒暄一番？


    【韩非子原文】臣闻：“不知而言，不智；知而不言，不忠。为人臣不忠，当死；言而不当，亦当死。虽然，臣愿悉言所闻，唯大王裁其罪。”


    【翻译】我听说：“不知道而发表意见，不明智；知道而不发表意见，是对主上不忠。”作为人臣而对主上不忠，应当处死；发表言论而不得当，也应当处死。尽管这样，我还是愿意把我听说的全都讲出来，希望大王裁决我的罪过。


    【解析】很多人都认为中国人在谈话之前先要寒暄，而不是直接开门见山，这样做是浪费大家的时间，如果我们有了更多阅历之后，就会知道，寒暄不仅不能少，而且是非常重要的，你们的谈话效果往往就取决于寒暄的水平！


    本段材料是《韩非子》开头的第一段，韩非子是中国法家的集大成者，是韩国贵族，只是到他这代已经被边缘化，不过他跟荀子学习了一套治国大法，加上家族的世代传承，形成了一整套治国理政的宝典。当他的文章被雄心勃勃一统江山的秦王看到的时候，秦王被彻底打动了，当即兵发韩国，只为让韩国交出韩非，而韩非在韩国只是边缘人物，韩国就毫不犹豫把韩非让给了秦国。秦国如获至宝，从此走上了一统天下的王者之路。


    本段材料是韩非子先明尊卑、主从，为他接下来的话，尤其是存韩这篇做准备，其实这段材料就是寒暄，套交情，而不是开门见山，为什么？因为是保护自己，因为你说的话，如果是真话，就很容易让人听不进去，如果还有人乘机挑拨，那后果不堪设想，其实韩非子最后也是死于这样的挑唆。'
