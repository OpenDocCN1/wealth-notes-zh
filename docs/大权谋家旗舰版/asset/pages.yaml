  md: '也不是陈岩石应该管的，而是让纪委出面来指出赵立春的问题。当然，陈岩石认为自己一心为公，一心为人民，所以对于权力行使的忌讳也就不那么在乎了。同理，在拆除大风厂的时候，陈岩石的挺身而出，其实他也是一种越权。孔子说，不在其位不谋其政。你已经退休了，这件事情就不是你应该管的了，而且拆除大风厂在当时看来，所有的法律程序已经完备，政府只是在合适的时机进行拆除而已。当然更深的内幕可能是当年陈岩石帮助工人们对大风厂进行股份制改造，很多工人都分到了股份，如果大风厂被拆除，那陈岩石的这个政绩可能会有很大的负面影响。其实大家都知道，企业的股份制改造不一定是好事情，因为股权分散很容易导致于决策缓慢，开会讨论互相掣肘，等到形成决定，市场机会已经失去，大风厂的每况愈下，很可能和股权分散有直接关系。陈岩石只是在这个恶果出来时候阻止，其实已经来不及了。这也是政府官员不懂市场化的典型，介入企业太深，看似为民众谋利，长远看其实是害了民众。


    那陈岩石在拆除大风厂的时候跳出来，用身体阻止拆迁队，此举，得罪了高育良，更得罪了李达康，祁同伟更不用说了。在这些实权派看起来，陈岩石就是搅屎棍；而沙瑞金正好冷眼旁观，基于沙的立场，最好能激化一下矛盾，然后他能更容易看清楚当前汉东的派系纷争和个人的立场。换句话说，沙瑞金是将计就计，利用陈岩石来达到自己的政治目的。


    后面陈岩石公开让沙瑞金照顾大风厂的生意，这点上其实也代表了不太成熟，所以逼得沙瑞金只好表态，要把决定权交给市场。沙瑞金这点的表现非常公正，而如果陈岩石真的想要让沙瑞金帮助大风厂的业务，应该是要在私下没人的场合来提出出来。这样沙瑞金就没有压力，会好好考虑这个提议。


    关于第二个场景，祁同伟来帮助陈岩石除地，这个动作本身的含义是透过陈'
