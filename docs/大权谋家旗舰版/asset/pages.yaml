- pgno: 45
  md: '父母底层，所以我们从小就被灌输了底层的思维模式。


    学校又按照工具的模式来教育、培养你。


    工作后，媒体用情绪化来控制你。


    以上三点，把你培养成了一个情绪化的工具性底层而难以自拔。


    所以我们普通人要底层崛起是难上加难。


    而本文就是提炼出底层崛起的人的共同特质，至少能保证你在无形中能先人一步。


    # 一、嘴巴上糊里糊涂，心里面清清楚楚


    他看起来一定很懂人情世故，很会做人，待人接物让对方感觉非常舒服，碰到有利益冲突的地方也不会表露自己的意思，不树敌。而实际上他内心把利益关系计算的清清楚楚，从来不会被别人算计，只有他算计别人的份，算计别人的同时，别人还感觉不到。


    # 二、懂人性，不动感情


    他非常懂人性，看人际关系的本质，善于和别人进行利益交换。虽然表面上对你很热情，但实际上内心很强硬，外热内冷，他们也更早懂得世态炎凉和人情冷暖，善于通过操控人性来达到了自己的目的。这里面《红楼梦》中的薛宝钗就是典型案例。善于兼容别人的情绪，自己不动情绪，这就需要自有己更高阶的情绪管理能力和共情能力，这样的人对于普通人是碾压式的存在。这个需要我们平时多多锻炼的，至少能要看得懂。


    # 三、自己有基本盘


    早早建立起自己的基本盘，把所有的社会关系都赋能到自己的基本盘来，人家和你合作也有基点，不然仅仅只是一个资源的皮条客，两头在外，自己没有'
