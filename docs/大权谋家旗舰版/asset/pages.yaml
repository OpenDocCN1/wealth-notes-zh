  md: '所以这时候利益分配相对容易，而随着政权的稳定，新兴权力的兴起，这部分权力必然代表了自己的利益，在没法做增量利益的时候，必然只能对存量下手。如果说功臣初代都是杀出来的，对于这种刀光剑影、你来我往丝毫不惧。那么功臣后代就未必能够应付得来了。


    政治和历史的现实是非常残酷的，不会因为我们的喜好就能改变的，因为政治历史自有其内在运行的规则，顺应这个规则的就能昌盛，违反这个规则就会被打击。不管你是作为普通人想要底层崛起，又或者是既得利益者要保护自己，都逃不开这个规则，所以不管你是什么阶层，都需要好好研究权力的规则，才能让自己有所成就！


    # 千古难题，一朝破解！人性究竟是善还是恶？


    一直以来，我们都被教育：人性本善。人性本善尤其是儒家的理论基石，因为立足点在人性本善上面，让我们从小就认为人是善良的。基于这样的认知，我们往往容易把人看错，发生东郭先生的故事。


    在研究过历史之后，突然发现，儒家把人性本善定义成理论基石也是有道理的，他是引导人们向善，用善来规范你的行为，让你不要挑战现有社会制度和秩序，所以我们发现儒家的人性本善其实是一种权谋方法，用所谓的善来引导你，维护社会和体制的稳定！


    不过对于底层穷人来说，如果不能认清这点，甘愿被这样的理论所主导，那就一辈子看不到出路，昏昏沉沉混完一辈子。而如果你想打破这样的规则，那你就会被认为是恶人，要被传统道德所指责。'
