  md: '越艰难。不仅不能上升，而且还可能被边缘化，最后搞不好还要被逼辞职，这一切的背后到底是什么原因呢？


    在规模以上的组织和公司里面，尤其在体制内，因为门槛都比较高，所以大家的业务能力基本上都相差不大。而随着时间的推移，组织也越来越成熟，也都有成熟的套路在运作，所以组织越成熟，需要的能力越弱化，每个人只要机械化的做事就可以了；甚至有些单位，越来越趋于女性化。


    因为工作内容的规范化导致于工作相对轻松，所以就有很多开始把心思转到勾心斗角上来了。


    而业务能力和政治斗争所需要的本领其实是不一样的，很多人在职场中多认为只要做好自己的事情即可，而忘记了组织内的政治站队（当然你也可以说是拍马屁）。


    这里面的我们要注意，组织内的政治站队的天然首选就是一把手所代表的派系，如果你不会站队，那就是孤军奋战，很容易被领导拿捏甚至敲打。


    譬如，领导往往通过安排任务来排斥异己。因为你不是他圈子里面的人，如果有艰难的任务，首先就会派你去，如果你做的不好，那正好就找到了处理你的理由。如果你做好了，快出成绩的时候，他会改派心腹来收割成果，你累死累活什么都没有捞到。


    在这样的情况下，你必然是牢骚满腹，之后传到领导耳朵里，形成了恶性循环，最后你就在单位里面待不下去了。


