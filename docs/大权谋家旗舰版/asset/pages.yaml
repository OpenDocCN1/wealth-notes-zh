- pgno: 44
  md: '# 二、不敢靠近领导


    领导代表了权力，你远离了权力，怎么可能有好的前途。因为各种原因，主要是害怕领导批评，所以不敢靠近领导，就算在等电梯时候看到领导，也不愿意一起乘电梯，这样领导也不会理你，更别说会给你机会了。正确的做法是，心里要认为领导也是人，他也有他的想法和需要，你平时多琢磨他的需要，来满足他的想法，多向领导汇报工作，领导也不是老虎，他不会吃了你的，所以放心大胆地靠近领导吧。


    # 三、斤斤计较


    在工作中，碰到一点点事情内心算盘打的很清楚。譬如有时候见客户，需要自己投入，那非常不愿意，心想这是公司行为，凭什么让我投入？其实客户关系还是你维护的，你的投入可以在譬如提成等方面获得补偿。还有如果你和同事们都斤斤计较，那同事们都会离你远远的，这样如果你丧失了群众基础，剩下的只有离职一条路了。


    所以在工作中不用算的很清楚，如果一定要算，那就算大账，不要算小账，也就是要以目的为导向，符合宏观目的的，大多是值得投入的。


    如果把以上三点烂熟于心，那在职场开始时候遇到的大多数问题就会迎刃而解，从不受欢迎到游刃有余再到前程光辉。其实没有那么难，关键就在于你的思维模式能不能转变，为我们的改变加油！


    # 底层崛起前你需要修炼的特质到底有哪些？（非常反人性）


    绝大多数人一出生，其实就是底层。'
