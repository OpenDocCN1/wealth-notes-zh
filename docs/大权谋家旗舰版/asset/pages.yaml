- pgno: 143
  md: '# 6、惩戒操控


    司马迁在《史记·韩长孺列传》里写道：“虽有亲父，安知其不为虎？虽有亲兄，安知其不为狼？”在历史上，为了争利有时候会父子反目，形同虎狼。还有很多时候，竞争的手段会突破人伦和人性的极限。在历史上，常常能见到那些“父与子无厚，兄于弟无厚”的人，这些人已经超出了常规，不按照常规出牌。此时，再按照前文所说的亲情、感情、收买、说服、威慑等手段，都无法成功将其操控。因此，必须得用更激烈手段，有效地针对对方的弱点实施操控。


    威慑是个重要的操控方法，通过吓阻，可以使得对方改变心思，而不得不屈从于我。但是，在竞争中，还有很多狠角色，根本不惧怕威慑。你的种种威胁他根本不怕，你的劝诚根本不听；另外，也有一些感觉迟钝者，多是些不见棺材不掉泪的人，对于他们，威慑手段就无法送行其任务了。于是，不得不采取实际的行动。这些实际行动不同手威慑手段。威慑是将可怕的后果描绘给受控人，使其在恶果未成为现实之前就已经崩溃；而实际行动则是将刚性的手段变成现实，逼迫对方不得不就范。这种用刚性的方法


    强迫对方执行自己意志的行为，就是我们所说的惩戒。


    其实，关于惩戒的方法，大家都耳熟能详。比如，违反了法律，就要受到法律制裁。这个制裁，就是惩戒手段的运用。再比如，政治生活中的警告、严重警告、开除党籍，甚至是判刑、监禁，等等，也都是惩我手段。竞争过程中的惩戒，比其日常生活中的惩戒多了一些模糊性，少了一些透明性；多了一些复杂性，少了一些单一性。下面，我们仔细研究一下惩戒之术。


    在操控过程中，如果一个人不听招呼，可以用威慑于段；但是，如果威慑手'
