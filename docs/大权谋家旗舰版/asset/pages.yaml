- pgno: 287
  md: '候对一些重大任务却又显得拖拖拉拉，我后来发现了他的思维内核：是否能提升产品的品牌。


    以前我做工作汇报的时候，他总是会挑出很多问题出来，然后从他的角度给出建议和要求。后来我和他的交流和互动中，有意识地从品牌角度来完成分解任务，很多工作就顺畅起来。


    # （2）上下同欲：从目标出发，理解领导的思考角度


    当任务下来的时候，第一件事不是立即安排人员去完成任务，而是分析这个任务的目标和动机是什么，即：


    为什么要做这个任务？


    整体背景是什么？


    希望达成的效果是什么？


    不同的领导有不同的思考角度和侧重点，这能够让你更好地学习到他的思维模式，同时也能让你和他用同样的视角来分析任务，让他觉得你是他的同路人。


    # （3）交流和拔高：尝试着用不一样的角度来思考，带来惊喜


    经常找机会和领导交流，谈谈你对任务、事情的看法，看看他是怎么评判的，他评判的内容就是他的实际思维模式和你理解中的思维模式的差别。


    此外，还可以尝试着用完全不一样的角度来和领导交流，让领导看到更多新鲜而独特的观点，补充他的思维库存。


    注意，这里的“不一样的角度”不是和他对着干，而是站在他的同一侧来分析出不一样的观点和结论。这个很重要，你要让领导知道你是在帮助他，而不是来添堵的。


    以前的一个同事也喜欢发现领导分析过程中的不足，但他采取的方式很不合'
