- pgno: 106
  md: '银铊入狱、身陷图图；还有些人志向远大、身怀绝技，却因为一时浮躁、意气用事，最后功败垂成痛失江山。过往的历史证明了，人性的弱点是决定竞争胜负的关键的短板，若不加设防，很可能危及前途甚至生命。


    反过来説，既然人人都有弱点，那么，如果掌握了对手的人性弱点，就很容易在竞争中操控对方，战胜对手。比如，有的人可诱之以利，有的人可欺之以方，有的人可亲而不可敬，有的人可捧而不可压……如此等等，不一而足。


    心理学，特别是纳粹心理学，将人性的弱点看得一览无遗。当年希特勒在维也纳流浪时，学会的最根本的知识之一，就是用暴力裹挟群众，利用群体无意识心理的影响开展政治运动。当年纳粹心理学的一个基础理论是“依靠暴力，可以摧毁对方的心理防线”；另一个基础理论是“群众的整体性活动，可以产生一种被放大了的集体无意识这也就在一定程度上回答了为何德国在“二战”中可以让那么多无辜的人走上绝境。好笑的是，纳粹心理学的根子缘自法国的社会心理学，等到纳粹学会了社会心理学，却回过头来把法国人杀了个一败涂地。当然这是后话。我们现在重新审视人类历史上这场最严重的灾难，可以发现，纳粹心理学的一个理论基点，就是建立在人性中“害怕暴力、敬畏力量”这一弱点之上。


    根据荣格和弗洛伊德的心理学的研究，人类在追求自由解放的同时，也同时伴生着一种孤独感和不安全感。为此，每个人不仅需要别人的爱，而且更需要别人的统治、压服和命令。尼采在《查拉斯图拉如是说》中说道：“你要到女人中去吗？记得带着你的鞭子。”这话虽然对女性来说不一定对，但是却反映了人性中敬畏力量、崇尚力量和依附力量的本性。


    其实，扪心自问，生活在这个社会上，总是有些东西令人们害怕，比如，那'
