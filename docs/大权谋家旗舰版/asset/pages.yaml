  md: '伴君如伴虎，就算你战战兢兢，如履薄冰，还是容易踩中老虎的尾巴，从而被老虎吃掉，但是又是终吉的，也就是结果是好的，被吃掉还能好吗？为什么会这样呢？


    本段材料里面，田单给齐国的复国立下了汗马功劳，可以说，如果没有田单，齐国就亡国了，而且在打败燕国过程中，田单除了立下盖世功勋之外，也形成了自己很高的威望，更是打造了自己的一个团队。在这样的情况下，被田单请回来做齐王的齐襄王就变得尴尬了，可以说，只要田单一发力，齐襄王的位置就完蛋了，这也是
    “功高盖主” 到 “功高震主” 的一个典型案例。


    而齐襄王也体会到了这样的威胁，所以他一直在思考怎么解决田单的问题，而这次，田单照顾过河被冻坏的老人，变成了一个矛盾爆发的导火索。虽然从老百姓的角度看，田单这样做，无疑是非常好的。但是从齐襄王的角度看，你是在和我抢夺民心；加上你对齐国的功勋，那篡位已经快要水到渠成、昭然若揭了，因为齐襄王祖先的
    “田氏代齐” 也是这样的发展套路。


    这时候，其实齐襄王有点乱了方寸，很可能是在自言自语地说：“田单对别人施恩，是打算夺我的国位，我不早下手，恐怕以后会有变故！” 注意，对于高位的领导来说，这种事情，只能放在肚子里面，不能说出来，因为如果你说出来，就很容易传到对方的耳朵，对方听说后，就只能先下手为强，那如果你没有做好准备，那就立即身首异处。后来南北朝时代的宋文帝就是因为处事不密而被太子消灭。


    而齐襄王在说完这句话后才发现，身边居然有人，从齐襄王的角度来看，肯定倒吸一口冷气，因为一旦泄露就会非常危险，想必这时候齐襄王已经在内心起了杀机。只是先招来问问他的反应，再决定要不要杀他。'
