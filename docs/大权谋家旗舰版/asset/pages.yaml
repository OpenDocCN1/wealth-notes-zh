- pgno: 214
  md: '# 独木难支、孤掌难鸣！那职场上如何无成本制造盟友？


    职场上，如果自己形单影只，那很难做成任何事情，所以权谋家在职场上，一般都要形成自己的派系，然后通过派系的运作来达到自己的目的。


    春秋战国时期的楚国，外来户江乙与本地昭奚恤不对付，江乙一直想要搬倒昭奚恤，但是因为自己是外来户，所以实力达不到，而且昭奚恤当前位高权重，自己在楚国毫无根基，所以这时候江乙首先需要做的是寻找根基和盟友。


    不过盟友也不是那么好找的，搞不好热脸贴了个冷屁股，被外人嘲笑。


    当这种两难的情况下，江乙想出了一个前无古人的招数，没有盟友，那arch制造盟友！


    江乙开始出招，首先江乙收集和研究了昭奚恤的性格和行事风格：昭奚恤敢于在楚王面前直言进谏，他把目光投向了同样来自魏国的外来户：山阳君。江乙想要把山阳君变成自己的盟友，在这里，江乙肯定还研究了山阳君的形势，山阳君肯定和昭奚恤关系不是很好，而和自己因为共同来自魏国，所以有天然的亲近感，江乙就在楚宣王面前说山阳君的好话，夸耀山阳君的能力和对楚国的贡献，同时肯定还说，如果给山阳君奖励的话，可能会鼓励其他国家的人才都来投奔楚国，这样楚国就会傲视群雄，并顺势建议楚宣王赐给山阳君一部分封地。


    昭奚恤知道楚宣王要赐给山阳君封地的事情（这个很可能是江乙故意泄露给昭奚恤的，不然昭奚恤消息这么灵通，江乙也会抓住此事大作文章，会说昭奚恤在楚宣王身边有眼线，细思极恐）马上向楚宣王进谏说：
    “山阳君对楚国没有功劳不大，没有受封资格。” 就这样，山阳君得知此事后（这个肯定也是江乙提前告知 的），山阳君一边非常感激江乙，一边非常痛恨昭奚恤，就这样江'
  merge: -1
  img_proc: true
- pgno: 215
  md: '乙就把山阳君拉到自己这边，一起仇视昭奚恤。


    江乙布的这个局，不但自己卖了山阳君的人情，而且还要让昭奚恤来背锅。在自己没有付出什么实际的成本的情况下，就轻轻松松赚到了一个有力的盟友。


    所以通过示好的手段来拉拢盟友，效果远不如设置一个共同的敌人。


    对比一下那些不断为对方提供需求，希望收买对方，让对方成为自己盟友的例子，江乙的做法实在是高明了很多。


    就如现在美国，他们内部政治派别也很多，树立一个共同的敌人，以前是俄罗斯，现在是中国。这样，最大限度地把自己的力量汇聚起来，以便施展自己的政治意图。


    人类历史上各种各样的牢固同盟，都是被共同的敌人凝聚在一起。历史上的很多高明的领导者，也都很懂得如何制造并且操纵敌方，让他们为己所用。


    毕竟“没有哪一种友谊的基础比有着一个共同的敌人更稳固”，制造共同的敌人，才能引起同仇敌忾！


    # 下属向上级“Extend “悄无声息”窃权的终极阳谋


    【资治通鉴原文】齐王封田婴于薛，号曰靖郭君。靖郭君言于齐王曰：“五官之计，不可不日听而数览也。”王从之；已而厌之，悉以委靖郭君。靖郭君于是得专齐之权。


    【翻译】齐王把薛城封给田婴，号称靖郭君。靖郭君对齐王说：“各主管大臣的报告，您应该每天亲自听取并反复审核。”齐王照此做去，不久就厌烦了，全部委托给靖郭君代办。于是，齐国的大权全部落到田婴手中。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '【解析】现实中，看到很多领导，一步步在不知不觉中丧失自己的权力，而且窃权的往往是他最信任的人，而且对方用的方法也是非常高妙，不懂声色就把你的权力拿过来了，而且你还非常开心，觉得他是来帮了你的大忙。


    田婴被封靖郭君，代表他在齐国的地位又进一步升高了，他整天围绕在领导齐王的身边，这时候，他的目的什么？是需要获得更多的权力，如果他直接向齐王要权力的话，是不是会很容易引起齐王的警觉，你位置已经很高了，还要权力，是不是想和我分庭抗礼进而取而代之呢？


    所以田婴是不能伸手要权力，不然效果适得其反。那他采取了什么方法呢？他采用了“将欲取之，必先予之”，也就是说，给领导很多琐碎的事情做，而且往往还打着为组织好的名义，而齐王是不耐烦躁的人，这点田婴看的很准。几次之后，齐王就觉得太烦，就把这些事情全权委托给了田婴！田婴窃权成功。


    老子道德经很多人都认为是修身养性的高妙经典，其实如果我们仔细研究后发现，他的权谋乃至阴谋的意味非常浓厚，他是给你很多的权谋启发，实战中也非常有效！


    下属使用这招窃权术有两个重要的前提：


    # 一、领导不是权力狂


    历史上也有像诸葛亮、朱元璋这样的权力狂魔，事无巨细都自己一手掌握，如果你碰到这样的领导，那这招就没法用了，弄不好还能弄巧成拙，弄假成真。


    # 二、只有你有资格被委托


    你先要 автор一下形势，在当前形势下，只有你才有资格被领导委托进行代理权的处置，不然你这样殚精竭虑，就是给别人做嫁衣，还被贱笑大方。


    现实中还有一种窃权术，就是“小事天天报，大事不汇报”，就像红楼梦里'
  merge: -1
  img_proc: true
- pgno: 217
  md: '面的王熙凤一样，经常把小事向王夫人汇报，搞得王夫人觉其烦，然后王熙凤在涉及巨额财产的时候，往往自己就做主了！这就是用小事来掩盖大事的决定权。


    最后，对领导来说，权力是领导的生命，领导的职位越高，权力就越重要，乃至于失去权力后立即身败名裂和粉身碎骨。所以所有的领导，要打起十二分的精神，把权力牢牢掌握在自己的手里，人事权、赏罚权是最重要的权力，不然你迟早被架空。


    # 领导因为没听你的建议而栽了跟斗，应该幸灾乐祸还是暗暗补救？


    编者按：有些下属很有能力，对事物的发展也看的很透，而因为权力需要或者其他的原因，领导拒绝这样的建议，事情的发展正好验证了下属的预见性，这时候有些下属就开始幸灾乐祸，这竟然给自己带来了不必要的麻烦甚至灾难，我们从秦国的一个案例着手来剖析这里面的权力规则。


    【资治通鉴原文】王贲久围邯郸不拔，诸侯来救，战数不利。武安君闻之曰：“王不听吾计，今何如矣？”王闻之，怒，强起武安君。武安君称病笃，不肯起。


    【翻译】王贲围困邯郸已久，不能攻克，与各国救兵几次作战，也均失利。武安君白起听说后说：“大王不听我的建议，现在怎么办？”秦王听到此话，恼羞成怒，强令武安君前去统兵，白起又称病重，不肯起身。


    【解析】高位的下属一般都是专业性人才，所谓专业人才，就是对某个方面特'
  merge: -1
  img_proc: true
- pgno: 218
  md: '别擅长，而领导一般是通才，通才的特点就是懂的广，但是在具体的某件事情上往往没有专才的下属精通，所以就会在某个点上产生领导不如下属的情况，而有时候领导因为各种原因，没有听从专才下属的意见，下属应该怎么办？


    本案例里面的秦王因为没有听从白起的意见，可以说是一意孤行攻击赵国，把邯郸围困了很长时间了。这时候，诸侯各国来救，我们很奇怪哦，为什么这些诸侯国开始时候没救呢？因为他们担心，如果秦国快速拿下赵国，就会立即调转枪头来攻打自己的国家。而现在秦国拖在泥潭里面了，就算在赵国打赢了，暂时也没有能力再对其他国家发起攻击，而如果诸侯各国团结一致，把战场就定在赵国，来挽救赵国。这样自己出力不太多，但是可以把强大的秦国给长期拖住，御敌于国门之外，这样自己国家就安全了。


    秦国这时候和赵国作战已经陷入僵局，补给线又长，战争时间一长，士气必然低落，如果其他诸侯国来救，当然就打不过了。


    而战争的发展和白起所料的完全一样。注意，白起作为专业性人才，对政治权力不太精通，他就和大多数下属一样，脑子比较直，按照自己的感觉来说话，所以他说：“大王不听我的建议，现在怎么办？”这句话如果私下说说就算了，现在能载入史册，证明这些话在当时非常公开，甚至传到了秦王的耳朵里面了。这样的情况下，秦王会怎么想？秦王肯定会想，你不帮忙也就算了，还在说风凉话；而且白起这样一说，且不说下属没有资格评判领导，白起的言论必然对秦王的威信是一个巨大的打击，进而影响到秦王的权力稳定性。这时候，秦王已经对白起了怨恨之心了。


    所以这时候秦王还没想要杀掉白起，只是让他出马来顶替王齮，而白起又以生病推脱拒不从命，这样，必然会引起领导秦王的大动肝火。因为这已经触碰'
  merge: -1
  img_proc: true
- pgno: 219
  md: '到了领导的底线。


    这里面要说明一点的是，一个人在领导那的待遇，是跟他对领导有多大的作用成正比的，如果你不能为我所用，那也就没有什么待遇可言。如果你还跟我作对，那你必须被消灭。所以之后白起的结局，我们不要看后面已经可以推测到了。


    领导还有一个办法，就是把项目的失败归结到你的头上，因为你的不配合，造成项目现在的失败，因为你这时候已经被控制了，完全丧失了话语权，所以这个黑锅你也背定了。


    在秦国组织内，秦王具有一言九鼎的实力，而因为攻打赵国是在组织外，所以有些不确定性，虽然秦王作为领导对组织外的事控制力有些弱，但是对组织内的下属，还是有全权处理权的。


    在这样的情况下，作为白起下属，最好的办法是什么呢？应该单独进谏，说：虽然我们这次军事行动不利，但是以后有的是机会，现在我去把现在的部队尽可能完整的带回来！


    这样帮助领导保留未来希望，也没有突出自己的预见性，不会激化矛盾，还给出了具体可操作性的方案，这里最关键就是控制自己的情绪，做于国于己都有利的事情，做到这点，白起依然是领导秦王最倚重的左膀右臂。


    最后，做下属的，自己的能力和对事物未来走向的精准预测，不是你用来挑战领导权威的工具，而是应该把他当做帮助领导维护权力，巩固权力的方法。不然，领导可能对付不了组织外部的敌人，对付组织内部的你还是绰绰有余的。'
