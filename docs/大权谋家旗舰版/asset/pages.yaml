    人际关系的建立，在于会来事，懂交往的潜规则。交往其实就是没事找事，找到小事，扩大成大事，再把大事扩大成联盟的事。


    所以我们需要用语言、兴趣爱好、鼓励、玩笑、甚至冒犯来破除目标对你的生疏感，迅速把他拉到或者你融入他们）广阔交际圈。


    你一定要记住，社会关系是做出来的，不是等出来的，所以，你要主动，而且往往还不打不成交。打，往往意味着打扰、冒犯等等。如果你不积极、不主动，不会赔着脸，没有耐心，那谁会认识你，谁又能来帮你呢？


    有朋友就要说了，老师就不能说正面接近目标人脉的方法么。因为在现在社会阶层接近固化的当下，正常的途径要么被人走过，要么被堵塞了，所以只能独辟蹊径，正话反说。


