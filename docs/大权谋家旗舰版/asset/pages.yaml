  md: '致于亡国（中国）。


    对于价值观的问题，我们的思维模式必须和现实接轨，任何发生的事实用我们的价值观都要能解释，而不是回避这样的事实。换句话说，我们学习和提高的目的就是要一切从实际出发，让我们的价值观兼容所有的历史和事实，这样
    才能有真正的进步。


    对于已经做过选择的情况来说的话，你的投入已经变成沉默成本了，所以守着这样的沉默成本其实已经没有什么用了，而是要重新按照最适合的方式做重新选择，至于别人的看法，给别人一个站得住脚的理由即可。


    对于环境，其实非常有欺骗性，那我们要从事实出发，排除别人传递消息中的主观偏向。当然法家还有“挟知而问”、“倒言反事”等来检测下属是不是说真话。


    学习和进步，其实就是不断否定自己、重塑价值观的过程，这个过程必然会非常痛苦，而真话和真相是学习和进步的基石，所以不仅不能忽视，还要极端重视。在事实的基础上进行深度思考，这样才能不断提高，越来越接近成功。


    # 为什么很多人会认为法家、权谋家都没有好下场？


    很多学员问到一个问题：历史上很多法家人士、权谋家都没有好下场呢？商鞅、韩非、李斯都是如此！这个问题非常重要。因为如果思维不清楚，那很可 能会受到这个观点的影响，对我们学习权谋来说是一个巨大的障碍。接下来我们详细解读一下为什么会产生这样的错觉：


    +   一、对失败者的抹黑'
