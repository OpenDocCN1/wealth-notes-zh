- pgno: 285
  md: '能力还是帮领导解决问题。


    这类员工不多，他们会整天和领导待在一起，以幕僚和副手的角色自居。领导离不开这样的员工（注意，不是企业离不开这样的员工），这样的员工也是优先被提拔的对象。


    在职场中，被快速提拔的员工则是综合了上面两类员工的优点，既能干活，又能出谋划策，要真正做到这点，就需要员工具备一个能力：能够复制领导的思维模式。


    # 认知的误区：踏实干活就可以稳步晋升


    很多的职场人员都会陷入到一个认知误区中去：只要我踏踏实实干活，收入、职位等就会慢慢升上去。


    事实上，你踏踏实实干活，只是你的职业本分而已，没有额外的加分项，凭什么要提拔你呢？


    所以职场要进步，除了踏实干活，还需要多做点其他的东西。


    # 二、如何复制领导的思维模式


    先来回答里另一个问题：“为什么要复制领导的思维模式？”


    +   1、为什么要复制领导的思维模式？


    作为企业的员工，我们其实没有太多的机会去选择领导，这是一个天然的限制（有些互联网企业是可以由员工选择领导的，这类企业极少，不在今天的讨论范围内）。


    尽管领导的能力和性格各有长短，但是能够走到当前岗位上来，必然有自己的优势，其中最大的优势包括两方面：思维方式、人脉圈子。


    他的人脉圈子是他的独有资源，作为下属，我们无法复制，但是他的思维方式'
