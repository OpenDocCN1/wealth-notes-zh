- pgno: 314
  md: '# 绝密！体制内一把手的实战权谋自爆


    某位不想留名的体制内一把手私信说：我一直在看《大权谋家》的公众号，自己也有一些权术上的心得体会，想给大家分享一下。在征得对方同意并匿名处理后，把本文发出来和大家共享。


    我在局机关当头头。在机关，有比我聪明的人，有比我笨的人，有比我年龄小的人；有比我学问高的人，有比我有比我年龄大的人，可是，大家为什么大家都听我的，对我服服贴贴的呢。


    说实话，是因为我善于使用权术。


    什么是权术，说白了就是摆弄人的艺术，就是耍手腕、玩心眼、使花招。我这人对书不太感兴趣，我只相信自己的感觉和经验。我使用的权术是多年来总结和感悟出来的，可以说是得心应手，十分灵验。如果我准备写书，那我准备写的书是我的实际体会，相信会受到很大欢迎的。


    在单位，我最爱说的就是讲民主了，但是最主要的权力我一点也不撒手。权力是什么？我认为，权力是地位，权力是资源，权力是力量，权力是本事，权力是势力，权力是幸福。对于当官的人来讲，应该像对待生命一样对待权力，要懂得对权力的珍惜和爱护。一个个人没有实权，就没有人肯看得上你，有道是“无权大街无人问，有权深山有远亲”，这是千古不变的道理，对此我深有体会。我有几个副手，他们都是我们班子的成员，不给人家权力是不行的。我会表示，让他们大胆地、放手地去工作。但是，有一条我是决不会让步的，那就是单位人权、财权、物权等重要权力，我是坚决要抓在手里的，决不放松。我规定，凡是重要事项的审批，必须由我签字，别
    人谁也不能代替。有人说，你大权独揽，人家副手会不会对你有意见，会不会有人说三道四。我的想法是，'
  merge: -1
  img_proc: true
- pgno: 315
  md: '我才不会那么书呆子气呢。有意见也好，说三四道也罢，我是不会再乎的，我只再乎权力。


    我奉行的是 “顺我者上，逆我者下” 的用人原则。在单位，我把所有的人分为自己的人和非自己的人。对自己的人，不论他能力大小，我都要千方百计地予以重用。对于非自己人，我是坚决不会重用的。不是我有私心，是因为这样做，大家会更为团结，工作会更为顺手。


    在机关，傻瓜和不谙世事的人才把能力和水平当回事，整天把能力和水平挂在嘴上，以为有了能力和水平就了不起。其实，根本不是那么回事。机关在用人方面，实行的 “伯乐相马制”，哪个马好哪个马劣，只有伯乐说的才算数。在局里我就是伯乐，“相马”权掌握在我手里。


    我用你，总该有点理由吧。你说你有能力有水平，该重用，那么谁没能力谁没水平呀。所以，我在用人上就得尊重自己的感觉。我看着你不顺眼，要想让我重用你，那就不太现实了。对于我自己的人，我重用了他们，他们会有一定的感恩报恩的心理，往往很听使唤，一般不会找我的麻烦，这一点十分重要。这样的结果是，虽然我的副手和中层干部不是拥有一流能力的队伍，却是一流忠于我的队伍，这就成了。


    相于而言，忠诚比能力更重用。正因为如此，在单位我处于绝对权威的位置，呼风唤雨，说一不二，我想做什么的事，就做什么事，我想怎么办，就怎么办，大家绝对支持和拥护。如果上级或者外界人士想听听我手下人的反映，那绝对不会有问题。大家一定会异口同声地说我好，说我能干，说我是一个人才，甚至会说我英明和伟大。


    我很注重掌握手下人的一些把柄。古语说：人非圣贤，孰能无过。我手下人'
