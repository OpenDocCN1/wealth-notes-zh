  md: '# 代表人民利益的陈岩石，背后的权力斗争有多凶猛？


    又看來一遍《人民的名义》，突然发现作为代表人民利益的正面形象的陈岩石，背后居然有很多故事，更多内幕都可以通过权力斗争来揭开。


    剧中关于陈岩石的经典的场景有：


    第一，政府准备趁着火灾，把大风厂拆除，陈岩石老先生第一时间赶到现场，和政府代表李达康对峙一天，最后搬出新任省委书记沙瑞金成功阻止政府拆除大风厂。另外陈岩石后来趁着沙瑞金视察大风厂的时候，提出要让政府帮忙采购大风厂的保安服，沙瑞金说，这个只能让市场决定。


    第二，公安厅长祁同伟准备通过帮助住在养老院的陈岩石铲地来向沙瑞金示好，正好沙瑞金这时候到来，陈岩石在沙瑞金面前开坏了祁同伟。


    第三，大风厂工人闹事，陈岩石顶风而上，用自己顶替了大风厂厂长蔡成功 的儿子作为工人的人质。


    第四，陈岩石去世后，王阿姨也是按照陈岩石生前的要求不举办追悼会，一切从简，死后将自己的遗体也是捐献给医疗事业。我们换个角度可以这样认为：陈岩石去世时候，没有一人来问候，非常凄凉。


    我们必须注意到，陈岩石的身份，他在省检察院的常务副检察长退休，而且退休很长时间了（二十年以上），革命年代，他收沙瑞金为义子；后来高育良是他以前的下属，汉东前任省委书记赵立春当时还是京州市长的时候，陈岩石作为搭班的公安局长，因为赵立春吹了空调，被陈岩石强烈要求在班子内部做检讨。赵立春后来官运亨通，陈岩石从此就在厅级干部的岗位上始终无法再进一步。


    赵立春被逼做检讨这件事上，其实陈岩石是越权了，因为就算赵立春违规，'
