  md: '高风亮节、美言懿行，表达我对上级的崇拜和拥戴之心。如果这些话由上级的\n心腹和知己传到上级的耳朵里，那就会起到事半功倍的效果。实践证明，我这\n办法屡屡奏效，上级对我的印象越来越好。所以，晋级啦、提职啦，奖励呀，\n常常会降临到我的头上。有人问我有什么密诀，我只是说，啥密诀呀，是领导\n体察关怀下属呗，我以更加努力的工作报答上级的关爱才是。


    # 领导学秘密：对下属故意放纵、缺陷养成，抓把柄控制你！


    【续资治通鉴原文】允恭与丁谓交接，倚势骄恣。始，宦官以山陵事多在外，允恭独留不遣，自请于太后，太后不许。允恭泣曰：“臣遭遇先帝，不在人后，而独不得效力陵上，敢请罪！”太后曰：“吾虑汝妄有举动，适为汝累。”允恭泣告不已，乃以为山陵都监。


    【翻译】雷允恭一向和丁谓勾结，依仗权势骄横不法。最初，宦官们都因为建造先帝真宗的玫墓出官公干，只有雷允恭留在宫中，雷允恭于是向刘太后请求也让自己前往，刘太后(刘娥)没有同意。于是雷允恭哭着说：“我侍奉先帝并不比别人的时间短，可是现在却不能为先帝尽最后一份力，我深感有罪！”刘太后说：“我担心你会擅自做主张，反而为你带来灾祸。”雷允恭痛哭流涕，坚决要求批准自己的请求，于是任命他为先帝陵墓建造监督官。


    【解析】为什么很多下属没法升职，就是因为他所具备的本领具有单一性，看问题比较片面，所以上级领导不敢把他放到更高的位置上。不过有时候领导还有意识的培养下属的缺陷，这样就可以用缺陷形成把柄来牢牢控制下属。


    从本案例来看，宋朝当时宋真宗刚驾崩，宋仁宗继位，但是年纪还小，由刘'
