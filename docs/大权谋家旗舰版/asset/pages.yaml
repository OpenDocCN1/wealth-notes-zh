- pgno: 258
  md: '个反面典型，他其实就是为我们来e雷的。


    另外一个方面，皇帝拒绝你的低级马屁还能塑造自己更加光辉的形象，你一不小心就被抓了典型，这个比不拍马都差上很多。


    如果过于热衷于升官，很容易造成技术变形，也给你周围的人攻击你留下了机会，而我们上进的机会其实并不多，不要寄希望于毕其功于一役，这样风险就太大了。而是可以采取分步式的方法，看每一步的效果来调整自己的做法，这样就不容易演变成一着不慎满盘皆输的结果。


    # 揣摩领导常用语的潜台词，搞不懂就没法混！


    我们在职场上，经常会听到领导说以下几句话，很多人不知道怎么理解，我们今天就来详细解读一下，帮你准确把握领导的权力心思，做出符合领导和自己的选择。


    # 1、你的提议很好


    当一个下属兴奋地拿着自己的建议汇报的时候，领导为了不打击他的积极性，往往会说，你的提议很好。如果下属追问得紧，那领导就会说，提议是很好，不过现在还要放一放，很多年轻的下属就会有疑问了：明明提议好，为什么不实施呢？这是因为领导的角度和下属的角度不一样，领导要照顾全局，审时度势，而下属往往是从自己的角度出发，容易以偏概全，不过等到宏观的时机成熟，领导会把你的提案来实施，或者修改后再实施。


    # 2、你很有潜力


    领导往往在表扬年轻人的时候，会说，你很有潜力。这句话表面上是对你的'
