- pgno: 120
  md: '年，为天下人而担忧操劳。你们的爵位富贵，都是朕赐予的：天下人的安闲逸乐，都是朕培育的。先帝弃群臣而去，以国家相托。朕不敢爱惜自己，而知道爱民。现在叛乱的主谋都是将相，为什么这么快就辜负朕呢？你们这些接受先帝遗命的辅政老臣中，傲慢跋扈、难于控制，有超过裴炎的吗？将门子孙藏匿收集不法分子的，有比得过徐敬业的吗？老将中英勇善战的，有像程务挺的么？他们都是人中的豪杰，不利于朕，朕一样能够将他们杀掉。你们中有才能超过他们，并且想要造反的，请早点动手。如果不想这样，那就恭恭敬敬地侍奉朕不要让天下人耻笑你们。”
    群臣臣噤若寒蝉，不敢仰视，纷纷说：一切听从陛下吩咐。武则天给了我们提供了一个赤裸裸的威慑的例子，她把她使用实力的决心（包括杀戮、剥夺官位等）统统传达给诸大臣，于是，大臣们感受到了这个娇滴滴的美女皇帝背后毒辣的心肠，只得低头服输，不敢再有异动。上面的这个“威慑”案例如此浅显直白不用我们再多说什么了。


    在武则天时期，还有个大家都熟知的“请君入瓮”的典故。来俊臣之所以能够让周兴服罪，就是用了“请君入瓮”这一招。“入瓮”是周兴构思出来的新招，至于滋味好不好受，他心里清楚得很；所以，来俊臣明确告诉他，有人告发周兴，并提出准备用这招对付他。周兴一听来俊臣要用水如此损招对付自己，马上知道这不是闹着玩的，于是“骇汗”，叩头服罪了。这威慑手段，看来即使用在奸臣臣酷吏头上，也一样是好使的。最后，要让对方察觉到自己的实力和决心。


    在权力斗争中，威慑者必须把自己掌握的实力和一旦对方不听就会使用实力的决心传递给被威慑者，警告他不要玩火。这个传递渠道必须是通畅的。如同电波传递一样，只有信道是通畅的，威慑者此方的威慑意图，才能在彼方受慑'
