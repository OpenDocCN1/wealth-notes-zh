  md: '# 小人物骤然获得大权力，是好事还是坏事？


    在组织内部，因为更高权力的需要，也可能是因为需要在组织内形成鲶鱼效应，保持或者重塑组织的活力，所以，更高级的权力型领导会从底层提拔一些人上来充实中层队伍，而往往这些小人物就突然掌握了比较大的实际权力，我们来看看这样的权力配置一般会产生什么效果。


    远的不看，看最近的十年浩劫中，很多底层人物被提拔到重用的岗位，展开了一轮又一轮的针对原有体系的冲击和对具体人物的批判，表面上是执行更高权力的意志，实际上往往只是为了公报私仇、挟私泄愤而已。


    在《红楼梦》的抄检大观园一回里面，因为王夫人出于整顿纲常的需求，派周瑞家的、王善保家的等一帮下人去搜查主人 room 房间，想查到违反纪律的证据，这样就给了这些下人报仇的机会，因为他们感觉到平时受到主人们的很多气，所以需要借此机会来发泄。


    由此可见很多从底层成长起来的小人物的性格里有一种报复性的戾气，这可能和他们的出身有关，也可能和他长期受到屈辱有关，生活在底层的穷孩子，一旦有机会进入都市，进入上层，如果他自尊心很强，如果又受到过别人的轻视甚至污辱，内心就会生出仇恨来。这就是我们以前经常说的阶级感情，这种感情，如果能上升，就会变成一种关心民意扶贫preuve的道德情操；如果下降，就会变成一股戾气，对整个社会有一种仇视心态，特别是对权贵，不分区别地加以仇恨，甚至谁管到我就恨谁，连提拔他的人都不例外。对提拔他的领导而言，就是一种反噬，从而悔不当初。


    在中国，做人做事都不能太绝了，总之不能脱离中国这个人情社会的基本现实，不然就显得偏执了，底层掌握权力后就很容易自以为拥有道德的先天优势，'
