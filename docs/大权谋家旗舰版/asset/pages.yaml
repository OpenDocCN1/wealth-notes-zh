  md: '气，因为你已经是再三了，代表有一段时间了，所以皇帝对张俭说的话，一方面代表了你知情不报的责怪之意之外，还有代表你翻案很可能会导致于朝廷颜面受损。这很可能也是原来判案的那一方已经找过辽兴宗了，并给预先植入了一些观点。


    这里面我们必须说明一点的是，如果你不是张俭这样德高望重，资深的领导秘书，你必须把这个事情先汇报，并提供好解决方案，让领导知情，不然就容易被对立面告状，自己陷入被动。


    最后，张俭作为资深的政治人物，他老早想好了解决方案，就是抚恤被冤枉者，现在看就是给一些国家赔偿。当然在实践中，还需要舆论的造势，把这个事件的负面影响降到最低。


    综合来看，在中国社会，如果你的案子想平反，那很有可能只是因为有政治斗争在里面，所以如果你受了冤屈，那就必须要仔细研究组织中的各种关系，看看有没有可以利用和合作的方面，只有互相利益一致的情况下，你的案子重申才可能被受理，不然是毫无机会，反而你自己变得非常激动，最终的结果往往是没人敢帮你。


    # 权力更替的关键时刻,权力场中人都如何表态站队？生死一线！


    【资治通鉴原文】光、安世既定议，乃使田延年报丞相杨敞。敞惊惧，不知所言，汗出浃背，徒唯唯而已。延年起，至更衣。敞夫人遽从东厢谓敞曰：“此国大事，今大将军议已定，使九卿来报君侯，君侯不疾应，与大将军同心，犹与无决，先事诛矣！”延年从更衣还，敞夫人与延年参与许诺，“请奉大将军教令！”'
