- pgno: 140
  md: '他们的成，是由于对权力的苦苦执著；他们的败，同样是对权力的苦苦执著。


    正所谓成也萧何，败也萧何。一向话，是因为达不到“超脱权力”的境界。


    那么，读者可能要问，李斯的弱点是无法超脱权力，历史上可有超脱权力的人么？答案当然是有，比如范蠡，比如张良。这样的人，即使深受主上喜爱，受万千人尊崇，高居权力顶层，却弃权力如粪屎，视权势如无物。正因为他们能够超脱权力，所以才能保证生命的安全，也因此才能在权力的舞台上演变成一种神话进而脱离时空的局限，演化为一种更长久的权力。他们不执著于权力，所以权力场上的人把他们视为上智；他们不把权力放在心上，所以权力最终会为他们垂下美丽的头颅；他们甚至虐待权力，而权力却心甘情愿誓死追随。只要能做到了这一点的人，才是真正达到了最高境界。而这种最高境界，则是许多人见所未见闻所未闻想所未想知所未知
    的。当然，我们这样要求李斯过于苛刻，每个人都有他自己的“局”，李斯的“局”，则是死在了他对权力的“执著”上面。


    那么读者可能还要问，如果超脱权力，岂不是都要跟张良范蠡一样放弃仕途急流勇退？非也非也。所谓大隐隐于朝，中隐隐于市，小隐隐于野。朝堂之上的大隐，如郭子仪是也；江湖之远的小隐，历朝历代比比皆是也；蛰伏于市的中隐，则《雍正王朝》中的鄂思道，即是也。


    在历史上，有个超脱亲情、友情、爱情，超脱金钱、名誉、权力的绝世高手，他就是超级实干家李斯和绝顶阴谋家赵高的老板-绝顶高手中的高手秦始皇是也。


    秦始皇，囚母杀弟，亲情于他如无物；不爱美女爱江山，哲要灭六国而一天下，视后宫佳丽如粪土；身为帝王，孤家寡人，孤苦寂寞，身边无一个朋友可'
