- pgno: 37
  md: '的改变，提前适应管理岗位。当然，前提是你要和领导同频共振，这样你就会变得又红又专，领导必然也会非常乐意提拔你！


    # 人生进步最大的绊脚石：不喜欢听真话！


    如果我们在生活和工作中能悉心观察，很容易发现绝大部分人都不喜欢听真话，听到真话的时候，轻则紧皱眉头，重则暴跳如雷，为什么会这样呢？


    # 一、每个人专有的价值观


    在长期的教育和实践中，每个人都会形成一套自己特有的价值观，对于社会上发生的事情，尤其是和自己相关的事情，他们就会利用自己的价值观进行直觉判断。符合价值观的就是开心的，不符合的但已经发生的事情就很痛心等等。


    # 二、前期已经做了选择和投入


    很多时候，我们对自己的发展已经做出了选择和投入，而对于和自己选择与投入决策相反的证据，一般人都是不想听，也不愿听。因为这里面不仅涉及到自己已经投入的沉默成本外，还涉及到自己的形象和尊严。如果做了改变，怕被人看不起。


    # 三、环境的纵容


    对于普通人来说，使用手机和网络，而手机和网络都有一套算法，根据你的浏览记录给你推送你所喜欢的文章，这样你就会越来越觉得自己的观念的正确，其实这是一种作茧自缚。


    对于有权势的人来说，周围人为了不让你生气给自己带来灾祸，所以都完全按照你的想法来说话，所有才有了皇帝的新装（外国），秦二世不愿听真话导致亡国等等。'
