    # 权力斗争为何总是如此无情、冷酷、血腥和疯狂？


    权力是什么东西？我们在上周的文章里面已经写清楚了，权力最重要的就是


    调整组织内部的利益关系，决定资源的分配，所以围绕资源和利益的分配，各


    个权力的势力往往要展开腥风血雨的争夺，而他们争夺的，往往是组织的最高


    权力！这个最高权力，以前叫天子，后来叫皇帝，总体的意思是君权神授，我


    是被老天所指定的，大家不要来抢。


    不过就算有了老天和神仙做后盾，如果你身在权力的高位，想要过太平的日


    子，几乎是不可能的。这个位置就是火山口，就算不想去整别人，别人也会'
