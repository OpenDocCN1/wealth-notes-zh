- pgno: 48
  md: '# 一、外表


    外表有两个方面，首先是这个人的面相。他的性格脾气其实几乎都写在脸上。我们不是生就的相貌，而是长期的心与行为的修炼在脸上的投影，这些相貌也在预示著其未来的命运。相术也就是一种经验积累，相由心生，由脸观心，由心知未来。


    另外一个方面，看他的穿着，如果他穿的比较清爽，干净，或者比较正式，就代表他愿意为了别人来改变自己。如果他经常穿的很随意，参加宴会还是短裤拖鞋这种，那他做什么事情都会比较随意，你和他合作就需要注意了。


    # 二、人际关系处理能力


    这分为两个部分，一个是和同事的关系处理。如果他善于和同事打成一片，那就有了很好的群众基础，这样他在落实上面的命令的时候也会比较便利，同时也会考虑到同事的利益。


    另外一个和领导（泛指比自己地位高，资源多的）善于打关系，攀缘附会、投机钻营，这里我们注意用的似乎是贬义词，但是实际上只要达到效果，别人的褒贬其实没有那么重要。我们要知道，关系好没有用，需要更加紧密的关系才有可能转变到资源互换的程度。


    所以我们看到一个人经常对领导牢骚，和同事关系不好，那大概率这个人已经没有前途了。


    # 三、通过说话发掘喜好


