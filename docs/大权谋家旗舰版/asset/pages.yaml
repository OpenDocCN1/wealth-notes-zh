- pgno: 149
  md: '臣，往往要遭到君主的敲打。这种敲打，在君主来讲是防患于未然的一种必须手段；在臣下，则表现为一种或精神或肉体的惩戒。其目的，无外乎就是要操控下属。当年刘邦打下天下，萧何跟着他忠心耿耿鞠躬尽瘁，却多次被刘邦疑忌。那萧何不知收敛，反倒越发尽忠，手是，惹得刘邦疑心大增，不断加派士兵，名为“保护”相国，实则监督萧何。后来萧何经过高人指点，自己给自己脸上抹黑，才好歹缓和了一下。但是，刘邦最后还是找个理由把萧何给关起来。等到释放出来的时候，刘邦竟然老着脸皮说：“我之所以把相国你抓起来，就是让天下知道，你相国是对的，我皇帝是错的。”萧何跟了这个老流退多年了，早就对刘邦的一举一动了然于胸，于是，白发苍苍的萧何磕头谢罪，把这件事给糊弄过去了。事情虽然过去了，萧何却在刘邦的打击下，更加卖命，也更加收敛了。刘邦的这一招，就是惩戒手段在时间序列中的预先性的体现。


    从具体手段来讲，惩戒操控，主要有以下三种方法：其一，依法惩戒。当对方违反了己方意图，当然可以根据其违反的具体行为，从法理上找到可以依凭的条文，以此来对对方进行惩戒。历史上那些君主，在镇压农民起义的时候，都会给这些人冠以乱臣贼子、草寇强盗的“美称”，把种种罪名加在这些人头上。这样一来，一方面师出有名，另一方面即使受罚者，也可以在心里接受自己受罚的事实，甚至自己主动低头认罪。其一，捏造罪名。当对方的行为并不触犯任何规定，却必须要进行惩戒的时候，就必须通过捏造某些罪名，以此来进行惩戒。捏造罪名是大家都熟悉的手段。抛开道德的角度不谈，“莫须有”真的是致别人于死地的好方法。当年明朝徐阶整死严世藩，用的也是这个方法。其三，小打大拉。惩戒，说到底，还是为了确保操控者的意图得以实现。如果通过惩戒，树立了一大帮敌人，则很可能会得不偿失。为此，惩戒手段，主要'
  merge: -1
  img_proc: true
- pgno: 150
  md: '还是为了要拉拢和操控别人。所以，当实施惩戒的时候，通过小打大拉的手段，给对方以小小惩戒，留对方以颜面和生存的空间，则往往会更好地达到操控的目的。


    # 7、消灭操控


    政治博弈是一种非常激烈的竞争形式。拿破仑说过，政治不具肝肠。《君主论》也讲，为了达到目的，应该不择手段，必须具有豺狼和狮子一样的残忍。政治斗争之所以残酷，就是因为其高雅而雍容的外表之下，隐藏着你死我活的狠辣斗争。


    众所周知，政治博弈区别于一般老百姓的普通生活。在这里，并没有什么温情可讲，一切都可以归结为冰冷的理性计较和利益算计。当敌对双方的利益交织冲突的时候，特别涉及生死攸关的利益时，斗争的狠辣就赤裸裸地暴露出来了。操控与反操控，到了最激烈的程度，就赤裸裸地表露出最狠辣一面，也就是暴力。


    克劳塞维茨说过，战争是政治的继续。我们知道，当两大集团谁也无法说服谁、谁也无法征服谁的时候，就只能拼实力。在和平年代，谁能够得到别人的支持谁就能够获得巨大的实力，从而掌握主动；在战争年代，则只有兵戎相见了——这是集团之间的大规模的暴力冲突。通常，在一般性的操控中，暴力并不表现为集团和集团的火拼，而是表现为蕴涵暴力因素的活动。说直白点，也就是肉体消灭。


    精通竞争的人会发现，在资源角逐中，往往会有这样的人——你对他无论'
  merge: -1
  img_proc: true
- pgno: 151
  md: '是利益收买也好，还是威慑惩罚也好，都无法对其产生作用。只要对方不死，则一定要和你拼下去。笔者认为，在斗争的初期，定然会有那些心软的人，一旦掌握了优势就会罢手。但是，血淋淋的斗争告诉了人们，对于有些人，如果不斩草除根的话，一旦等对方扳过手来，则自己会死得很惨。于是乎，关于肉体消灭的故事便一代又一代流传下来了。其中，秦桧逐陷岳飞，走的就是这个路子。


    先从大的方面讲。历代开国帝王，往往会杀戮功臣。以普通人的角度理解，杀戮别人，是造孽，是行凶。但是，对帝王来讲则不然。帝王自有心术。普天之下，唯有保住自己的天下江山最重要。因此，无论是谁，只要阻挡了自己实现这个目标，则一律杀无赦。远的，有刘邦大杀功臣；近的，则有朱元璋等人屠戮亲近。其实，不必苛责这些人。对于参与到政治博弈中的人来说，这是再自然不过的现象了。臣下不了解这些，则必定被灭掉；帝王不掌握这些，则必然被推翻或者被篡位。历代都有权臣和帝王的博弈：帝王赢了，则坐稳了江山，花花天下，美女锦食，想啥有啥；臣下赢了，则帝王愿作一田舍郎而不可得。赵匡胤篡夺柴氏天下就是一例——等到老赵夺了天下，让他寝食难安的则有人对他或者他的后代也玩这一手。所以，赵宋积弱，堂堂中原，物资富饶，人才辈出，却被几个北虏赶得丢了半壁江山，其根子，可以从这里找到。


    再从小的方面说。在政治中，往往会出现刺客、暗杀等现象。翻开《资治通鉴》会发现，里面记载着许多刺客、游侠之类的人物。一般来讲，当两大集团利益对立的时候，不把对方消灭则无法取得胜利，则诸如刺杀、偷袭等暴力活动就会出现在历史舞台上。其中最著名的案例当然要属荆轲刺秦王。荆轲刺杀赢政一旦得手，则势必会引发秦国内政混乱，燕国即可残喘延喘。可惜，刺'
  merge: -1
  img_proc: true
- pgno: 152
  md: '杀失败，也为燕太子丹招来杀身之祸。由此可见，消灭操控这一手段，至刚至强。其好处是干净利落，绝无后患；弊端是如不成功，必然伤己。读过史书的人都明白这一点。


    在《资治通鉴》中，记载着聂政刺侠累的故事。故事发生在韩国，韩王傀有一个大臣，叫严仲子。严仲子因为受韩王所爱，因此遭到了当时的韩相侠侠累的嫉妒。严仲子害怕侠累会害他，就被迫逃离韩国，开始游历各地，到处欲寻侠士刺杀自己的政敌侠累。后来，他听说有个叫聂政的人，因为杀了人，所以带着母亲和姐姐隐藏在齐国。聂政武功高超，肯定能给他报仇。于是，严仲子赶往齐国，找到聂政的住所，好几次登门拜访，赠给聂政母亲黄金百镒。聂政虽然坚决不受，但是已经感觉到严仲子的诚心。由于母亲还在，所以不能为严仲子去刺杀侠累。过了很长时间，聂政的母亲去世了，严仲子像儿子对待母亲一样，帮助聂政埋葬了老母。


    聂政为人极其孝顺，对严仲子非常感激。母亲死后，聂政服丧三年，并为姐姐找到了很好的归宿，然后，辞别严仲子，孤身赴韩。当时，韩国国相侠累周围护卫森严，根本不好贴近。但是，聂政毫不害怕，提着剑直闯韩府。护卫士兵还不及反应，聂政就以迅雷不及掩耳的速度直奔侠累跟前，一下就刺死了侠累。侠累死后，众人才醒悟过来发生了什么事，于是纷纷围攻聂政。聂政拿剑杀死数十人，自付肯定逃不出去了，于是倒转剑柄，划破自己的面颊，剜出自己的双眼，剖破肚子而死。


    自己的相国死了，韩王很生气。他把聂政的尸体放在集市当中，悬赏购买知情的人。聂政的姐姐聂妾听到了这个消息，就对别人说：这肯定是聂政。当年韩相侠累的仇人严仲子对聂政非常好，聂政肯定会报其知遇之恩的，我必须过'
  merge: -1
  img_proc: true
- pgno: 153
  md: '去看看。于是就动身到韩国去。等到见到了晏政的尸体，晏荪伏尸痛哭，说：

    这个人就是晏政啊！有好心人劝止道，这是刺杀韩相的凶手。韩侯悬赏千金来抓捕他的同犯。你不但不躲，怎么还来辨认？晏荪回答说：我不怕。我弟弟晏政之所以隐迹人群、甘当一个低下的市贩，是因为母亲在世，我尚没嫁。严仲子大人不计较晏政的屠贩身份，屈身和他结交，我弟弟一定会报答严仲子的！

    晏政临死前之所以自毁形体，就是怕被人辨认出来牵连于我，但我又怎能因为害怕被牵连而让我弟弟晏政的英名埋没呢！说完这话，晏荪长呼三声“天啊”，就因悲哀过度、心力交瘁，死在晏政的尸体旁。

    《资治通鉴》里记载的这个故事，就是消灭操控的一个很好的案例。严仲子消灭了侥累，就彻底解决了侥累的问题。一般来说，消灭操控是彻底解决问题的手段。用了此手段，就能够让对手再无还手之力。但是，一般说来，消灭操控在操控方法中很少使用，一是因为消灭手段有伤天害理之嫌，二是因为消灭对手会导致操控链条的断裂。研究消灭对手的理论，最出色的当属兵家。当政治博弈解决不了问题时，就会运用军事手段。从这个意义上讲，政治博弈和军事斗争在一定程度上是相通的。利用刺杀手段或者大规模战争，对对方肉体进行消灭，则定然能够使敌人乖乖被操控——如果死人也有操控价值的话。

    以上，我们对于操控的诸多手段进行了或详或略的分析，分析的结果如下：

    要想在竞争中获得胜利，必须要学会操控对手。操控对手的手段有很多，基本上可以分为“亲缘、感情、收买、说服、威慑、打击、消灭”等方法。在整个控制链条中，从左向右，手段越来越激烈，但是效果却越来越差。以说服为中间点，左手部分，就是我们着重介绍的柔性方法；右手部分，是我们需要了解的刚性手段。一般来说，老子的阴柔智慧，往往从左半部分着力，现在又被'
  merge: -1
  img_proc: true
- pgno: 154
  md: '称作软实力吸引；右半部分，最极端的是兵家的谋略，现在被称为硬实力摧毁。

    但是，无论软硬，无论刚柔，都是想要控制别人所不得不知道的手段。'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# 彻底揭露强者竞争的权谋手段'
  merge: -1
  img_proc: true
- pgno: 156
  md: '# 1、邀名之法


    战国时期，燕国曾出过一个昏庸的国王哙，把国政搞得一塌糊涂。齐国乘机攻陷燕都，杀了燕王哙。哙的儿子昭王即位，很想报仇雪恨、振奋国威。手是，他下令广招人才。但是，命令颁布了很久，也没有招到什么真正的能人。昭王很是迷惑，就把一个叫郭隗的请来询问。郭隗说：“从前有位国王喜欢千里马，他四处派人寻找千里马，宣称只要找到了，就出千金买下它。可是，三年过去了，他连一匹千里马都没有找到。这时有人自告奋勇，领了千金出去买马。可是，三个月过后，他只带回来一具马骨头，而且花了五百金。国王很生气，买马人解释道，‘我花五百金买马骨，是为了让天下人都知道您是真心爱马。连死的千里马都肯出重金买它，何况活马呢。以后您不用再派人到处去找千里马了，自然会有人主动给您送上门来。’”果然，不到一年的时间，国王就得到了好几匹千里马。现在大王您如果真的求贤若渴，那么可以仿照买马骨的方法，从我郭隗开始，把我当作贤人而厚遇我。当天下贤能看见连我这样无能之人都能够得到大王优待，那么他们还会不前来投奔您吗？”昭王听了很赞同，于是尊郭隗为师，建豪宅、送美女，优待有加。不久，昭王爱才求才的名声便广泛传开了。许多贤能之士纷纷前来投奔，魏国的乐毅便是此时被昭王延揽而至。二十年后，燕国国力强盛，兵精粮足。昭王便派乐毅为将，兵出齐国，攻破都城临淄，报了当年的一箭之仇。


    上述这个故事暗含着这样一个道理：在社会竞争中，名望对于拓展势力具有重要的意义。


    众所周知，财富、权势和名誉并称社会的三大稀缺资源。如果一个人想在竞争中有所作为，他就需要有财富作经济资本，需要名誉作文化资本，需要权势'
  merge: -1
  img_proc: true
- pgno: 157
  md: '作政治资本。其中，名望作为必不可少的资本形态发挥着重要的作用。之所以如此说，是因为社会竞争归根结底是人的社会活动。在社会活动中，如果一个人能够得到众人的好评，那么，就会一传十、十传百，在短期内聚集起很高的人气。这样，他就会受到许多人的支持，在做事的时候也会享有很多的便利。相反，如果一个人社会评价不高，那么，他在做很多事情的时候，都会受到人们的提防和猜疑，所以不利于人际关系的拓展。


    古人云：“名不正则言不顺，言不顺则事不成。”自古以来，人们就非常重视名声的作用。从商汤的“网开一面”式的炒作，到刘备打着“大汉皇叔”的招牌攫取政治资本，再到“中国不可一日无湖南，湖南不可一日无左宗棠”之说，这些都是邀名的案例。


    所谓邀名之术，就是要利用宣传炒作，使美好的名声在众人当中传扬，为从事竞争赢得主动。那些长于邀名的人，往往能够搅得风生水起，做到人见人爱，到处受到人们的拥戴。像宋江那样，名传江湖，天下草莽英雄见之倒头便拜，可谓高手中的高手了还有些不擅邀名的人，有的时候虽然做了很多事，但是寂寂无闻，毫无声势，甚至臭名昭著、恶名远扬，比如“司马昭之心，路人皆知”之类，可谓就是等而下之了。同样混迹江湖，是否懂得邀名之术，是否善于运用邀名之术，其分野相当大。


    翻开史书会发现，邀名之术在人类社会中广泛存在。


    唐朝初年著名的文学家、大诗人陈子昂，在其年轻的时候，就已经才华横溢。但是，他刚来到京城的时候，文运并不通畅，没什么人知道他。陈子昂聪明绝顶，决定寻机炒作一下。


    一天，在京城里来了个商人，临街叫卖一架西域乐器，并且索价奇高，开口'
  merge: -1
  img_proc: true
- pgno: 158
  md: '就是上百万。当时京城的贵族、富家们得知，都纷纷前来观看。可是，由于乐器很奇特，大家都看不懂，也不知道究竟值不值钱。正当人们议论纷纷之际，陈子昂拨开众人，对卖乐器的说：“一千缗，我买了。”人们听了十分惊讶，再打量陈子昂，见他衣冠飘飘、风姿俊秀，都暗自赞叹。于是问陈子昂：“你为何要出这么大价钱买这把琴呢？”陈子昂笑着回答：“我很喜欢这把琴，这可是个稀罕物件。”人们一听，忙问：“那能否请您为我们弹上一曲，让我们见识见识它的奇特之处？”陈子昂当即说：“明天在宜阳里，我愿恭候大驾，为大家献上一曲。”第二天，好奇的人们都赶来观看，陈子昂早就摆下酒席，焚香设台，横琴而坐。当人们吃到酒足饭饱之际，陈子昂对人们说：“我是蜀人陈子昂，写下诗文百余首，今天来到京城与大家相会，却无人知晓和理睬。这个乐器是那些乐工们摆弄的玩意，我怎么可能精通它呢？”说完，马上把乐器高高举起，重重摔坏在地上。人们惊得目瞪口呆，而陈子昂从容地拿出自己所写的诗文赠送给在座的诸人。大家看到陈子昂如此高妙的才华，又是如此特立独行不落窠臼，于是
    一天之内，陈子昂的大名就在京城传开了。


    陈子昂是一个炒作的高手，虽然时隔几百年，犹使人们为其高超的包装炒作之术佩服不已。


    在中国历史上，与陈子昂一样善于包装、宣传自己，又混迹于官场之上的奇才，当非王莽莫属。白居易有首诗写得好：“周公恐惧流言日，王莽谦恭下士时。若使当时身便死，千古忠佞有谁知。”王莽当时谦恭谨慎，名满天下，满朝文武、普天下百姓都被他蒙得团团转。而在王莽发迹的过程中，其邀名之术用得尤其神奇。


    王莽还没有得志之前，曾经装出极其谦逊的样子。他非常博学，但是又从不'
  merge: -1
  img_proc: true
- pgno: 159
  md: '待才傲物；他身为贵族，但是一直装出礼贤下士的样子给别人看。他经常去看望自己在官学读书的儿子，但是，每次去的时候，都要带上很多礼物给其他的学生。这样，他爱才敬贤的美名就传开了。史书记载，有一次，人们到王莽家里拜访。等了半天，也不见主人出来，只有一个穿着朴素的夫人在给他们端茶倒水。等到后来，人们才知道，这个穿着朴素的人，竟然就是王莽的夫人。于是，王莽清廉节俭的美名又成了他的美德。后来，王莽为了在天下人面前树立标牌，竟然抓住自己儿子的小错不放，生生逼死了儿子，也获得了一个大义灭亲的美名。即使王莽篡位之时，他也装出迫不得已的架势，让人大献祥瑞，说什么天命移祚，他是上天选择来代汉的天子。


    纵观历史，王莽可谓是官场上将邀名之术用得炉火纯青的第一人。王莽其人其行虽然可以商榷，但是赢得竞争的手段，还是值得人们去思考的。


    历史证明，在竞争中，名声至关重要。有了好名声，就更容易得人心；而得人心者得天下，这是一个再浅显不过的道理。所以，历代统治者，都刻意包装自己：一方面把自己打扮成上天之子，说自己代天行事；一方面广泛施恩，以邀圣上之名。


    汉高祖刘邦也是一个极善于包装自己的人。他从斩白蛇起义，到最后夺取天下，其邀名之术功不可没。楚汉相争早期，刘邦趁项羽不备之际，兵出洛阳，占据了很大一块地盘。一位姓董的乡绅拦住刘邦的马，说：“如果您师出无名，那么大事就不会成功。


    所以说，只有明确了敌人的罪名，才能最后顺利制服他。当初，天下百姓和诸位英雄共同推举怀王为义帝，可是项羽却放逐并杀死了怀王。现在大王您不如让您的部队为怀王戴孝，并通告各路诸侯，以讨逆的名义征讨项羽，这样，'
  merge: -1
  img_proc: true
- pgno: 160
  md: '您就会占据道义上的主动，那么，事情才会成功啊。” 刘邦在片言之下顿悟，于是按照董公的建议，为义帝发丧。同时，传告诸侯：“寡人身为义帝下属，愿意同各位诸侯共同征讨杀死君上的叛逆西楚霸王”。刘邦大旗一举，立马就得到人们的呼应。不少诸侯率众参与征讨行动，刘邦势力大增。


    从以上几则小故事中我们可以看到，邀名之术，大有大用，小有小用。小而用之，可以挣取名声，获得好评；大而用之，可成民心所向、人心所归之势。我们看《三国演义》中刘邦大打皇叔之名行走江湖、诸葛亮用
    “伏龙”之名钓到刘备，用的都是这一手段。总之，对于混迹江湖的人来说，邀名之术不得不学。


    既然名声非常重要，那么，该如何营造良好的名声呢？也就是说，邀名之术究竟如何运用呢？


    第一，邀名之术，其要害在于密。与沾名钓誉不同，邀名之术关键在于要做得不露痕迹。如果邀名之术被人识破，那么下场未免就不妙了。历史上，有不少为了挣个好名头而掉脑袋的主儿。第二，邀名之术要尽可能货真价实。也就是说，如果想要炒作自己，起码要有点硬货。如果出现“盛名之下，其实难副”的现象，可以说就算失败了。当然，要做到货真价实其实不难。术业有专攻。人嘛，总是有点一技之长的。但是，邀名之术运用的关键是要将自己的名声与事业前途联系起来。光大名声，为事业铺路。第三，要学会包装。虽然“包装”这个词只是最近才出现的，但是，包装之术古已有之。当年陈平见刘邦，刘邦一见倾心；陈平使用美男计从白登救出刘邦，把大单于夫人迷得神魂颠倒、这些都得益于陈平包装之术运用得当。根据手段不同，包装可以区别为硬包装和软包装。所谓硬包装，主要是指服饰、车子等看得见的东西；所谓软包装，'
  merge: -1
  img_proc: true
- pgno: 161
  md: '就是修养、气质、背景、地位等看不见的东西。第四，售出。邀名之术，不仅要邀，而且要让慕名而来的有收获，有所感悟，然后，借助他们之口，作进一步宣传。我们看《三国演义》中刘备的待人接物、《水浒传》中的宋江所作所为，就能够从中悟出很多道理了。


    关于邀名之术，其理深，其法妙，非短短几语可以道尽的。人常说《三国演义》是古今谋略第一书。没细看时不以为然，待到读通了之后不禁暗自感叹。书里说诸葛亮是旺汉四百年之张子房，兴周八百年之姜子牙。大家细看，诸葛亮灿刘备与姜子牙约交王，岂非有异曲同工之妙么？


    历史上，也有许多精通谋略之人，其才华、手段、心肠，早都已经具备了成大业做大事的条件；然而，由于不善于邀名，以致寂寂无闻，名不达于诸侯。无奈之下穷则思变，铤而走险，反而自毁前程。其中一个突出的案例就是《宋书》上记载的害死范晔的孔熙先。


    范晔是历史上有名的史学家和文学家。其所著的《后汉书》文笔华丽，见解深刻，可谓是一本难得的史书。范晔认为《后汉书》可以与《过秦论》相媲美，从范晔的才华来看，也并不为过。范晔自小才华横溢、聪明敏说。他有句名言：“常谓情志所托，故当以意为主，以文传意。以意为主，则其旨必见；以文传意，则其词不流。然后抽其芬芳，振其金石耳。”这句话的意思是，文章是感情和志趣的寄托，写文章应该以意为主，行文传意。如果以意为主，文章的主旨就一定能够体现出来；以文传意，文章的词语就会不同凡响。如果达到这个境界，那么文章在思想方面就能芬芳暗吐，在语言方面就能金石有声。懂点文学的都知道，范晔的思想是非常高明的。然而，这样一个杰出的史家和文学家，不仅在社会上而且在官场上享有盛名的才子，竟然死于谋反，让人大跌眼镜。'
  merge: -1
  img_proc: true
- pgno: 162
  md: '而导致他身首异处的，就是阴谋家兼大才子孔熙先。


    孔熙先在历史上不如范晔有名。其实，此人很博学，亦有才华，并且胸怀大略，天文星算、五典三坟，可以说是无一不通。但是，孔熙先不擅邀名之术，其才不为时人了解，所以很久都得不到晋升。古往今来，有志官场而怀才不遇登龙无门，这往往会成为谋逆之人的直接原因。张角是如此，洪秀全亦是如此。孔熙先久不发迹，最后萌生异志。要想在官场上有点作为，单打独斗是不行的，必须要有帮手；何况谋逆如此重大之事。于是，孔熙先开始寻谋高人相助。当其时，寰宇内外，范晔名高权重，世人侧目。


    于是，孔熙先就把目标锁定在范晔身上。可是，范晔才高八斗，轻易看不上别人；而且，范晔一直都看不上孔熙先，要改变这个看法，必须得下一番工夫才行。


    事后来看，孔熙先一定是个高手，并且很是精通当年杨广收买杨素的技术，因为他搞定范晔的路数与杨广基本相同。首先，孔熙先找到了一向为范晔看重的范的姻亲谢综，并且广舍钱财，与谢家弟兄大赂特赂，给谢综尝到许多甜头。同时，又大用说服洗脑和恭维拍马之术，获得了谢综的好感。于是，谢综带着相处“融洽”的孔熙先来找范晔赌博。孔熙先成功运用先给后得的�тели，输给范晔金钱，却赢得了范晔的重视。而且，孔照先平时就擅长
    文辞，且文采斐然，让一向以才子自诩的范晔大生惺惺相惜之感，最终两人结成莫逆之交，感情甚笃。孔照先为了借助范晔的名声来谋大事，就开始游说范晔。但范晔也是高智商人士，并不是那么好忽悠。恰好范晔一直有个心病，那就是他虽然门第高贵，可是国家却并不与他家联姻。孔熙先看准机会，对范晔说：“朝廷如果真的厚待先生，那么为什么不与先生联姻呢，使您得到更加尊贵的门户呢？别'
  merge: -1
  img_proc: true
- pgno: 163
  md: '人对您像猪狗一样，先生您却想为其舍生忘死，这真让人不可思议。” 范晔听后沉默不答，实际上已经被孔熙先说动了。


    按说，能写出《后汉书》的范晔，早就应该看懂个人的得失、看穿世事的取舍、看透人生的荣辱。可是没有，范晔最终落入了帮助孔熙先谋反的罪孽中。可是，谋反失败，宋文帝一纸诏书，范晔和孔熙先的繁华梦也就破灭了。史书记载：范晔小的时候，他的哥哥范晏常对别人说：“这个孩子贪财因利，最终会让我们家破人亡的。”
    最后，事情果然像范晏说的那样。


    其实，在后人看来，范晔谋反实属大谬不道，可是范晏说的也不尽然。因为虽然范晔本身爱财贪利，但是，若没有孔熙先这个外因的诱惑，范晔未必会走上这条自毁之路。而孔照先自己邀名乏术，无奈之下祭起“借力”之法，把范晔绑到同一辆战车上来，借范晔之力与范晔之名同谋“大业”。孔熙先虽然胸怀大略，但是缺了邀名之术，在做官的时候不会炒作，得不到别人的重视不能升官；在谋反的时候借范晔之名以壮行色却最终害了范晔。


    时隔千年，扪案读书，不禁唏嘘：若是孔照先学会邀名之术，有了“钓鱼”的本事，何愁仕途不顺、富贵不致呢？由此看来，邀名之术实属赢得竞争之至关重要之法也。


    # 2、识人之法


    识人之要，识人之难，自古以来就为人们所密切关注。翻开史书，竞技场上刀光剑影密密麻麻；仔细看，也不过是个歪歪斜斜的“人”字罢了。把“人”字弄懂，基本上也就通晓了竞争之略。因为，世事纷繁复杂，归根到底，也逃'
  merge: -1
  img_proc: true
- pgno: 164
  md: '不过这个“人”。社会竞争，归根到底就是个人与个人、群体与群体的斗争。有人参与其中，竞争才会异彩纷呈。所以，研究权谋离不开人。


    # (1) 识人之利


    在人与人构成的力量塔中，人与人被三条线贯穿起来：上行的线、下行的线和平行的线。这三条线，代表了力量场中人们的三种社会关系，上级、平级和下级。这三种关系如同经纬线般综合交错在一起，构成了复杂的社会。那些经天纬地的人才，能够补
    Budap 天地的奇才，能够经路天下的雄才，无一不是在熟练掌握人脉的经纬之后才有作为的。而要把握人脉，正确应对来自不同线索上的不同关系，必须要有过硬的识人本领。


    三国时曹操身边著名的谋臣郭嘉曾经说过，聪明的人应该慎重选择主人，如此才能得心应手、游刃有余地发挥才干，功成名就。众所周知，上级是力量的源泉。如果认人不准，或者不知择人而侍，那么，很可能就会因为跟上了一个倒霉的主子而遭殃。唐伯虎聪明过人，看出了宁王志大才疏、利欲熏心，所以及早装疯卖傻，这才躲过一劫。


    对上须识人，对下亦如此。中国有句话叫做“知人善任”，把“知人”放于善任之前是非常必要的。历来先贤圣君要打天下和坐天下，无不需要贤臣的辅佐。而要得贤才，必须先“知”。有些人，金玉其外却败絮其中，谩切浮名而华而不实；有些人默默无闻却才堪大任，看似愚钝实聪慧异常。这样，就需要主上具有“知人”之才。这样才能在千万cij
    中甄选出真正的可用的之人。


    对上对下要知，对朋友、平级的同事、周围的旁人也要知。斗争也，成者王侯败者贼，所以，只要厕身其中之人，无一不倾尽全力捞一杯羹。所以，来自身旁的明枪暗箭再平常不过了。并且，要“党同”，需要知人；要伐异，更需'
  merge: -1
  img_proc: true
- pgno: 165
  md: '知人。不知人，则必败无疑。


    翻开史书，太多强势豪杰因知人而江山稳固飞黄腾达；太多落魄英雄因不知人而身陷图图惨遭暗算。比比皆是的正反面的例子告诉人们：若要取胜，先要知人。


    历史上泛舟五湖的范蠡，就是一个明于知人的人。春秋时期，范蠡辅佐勾践卧薪尝胆，最终灭掉吴国，称霸一时；之后，范蠡回到越国，上书辞职，带着家人，坐船取海道去了齐国。临行前，范蠡见跟他一起辅佐勾践的大臣文种仍在越国做官，就留了一封信给他，写道：“飞鸟尽良弓藏，狡兔死走狗烹。”范蠡说，越王勾践这人长着长长的脖子，尖尖的嘴，人们只能跟他共患难，而不能与他共富贵。范蠡建议文种赶快辞官，如此才可保全生命。文种或许是留恋官位，或许是躲闪不及，没有弃官自保，最后被勾践杀害。勾践杀文种时说得也很明白，他说，文种你有七条妙计，寡人只用了三条就灭掉了吴国；剩下的四条计谋，除了对付寡人，还有什么用处？寡人不能对付你的四条妙计，不过也不会让你对付寡人。勾践谎称有人揭发文种谋反，要赐文种死罪。文种到了最后关头，或许会想起范蠡那“可与共患难，不可与共乐”的名言来。无论怎样，范蠡因准确认识了勾践的为人，且非常明了急流勇退的道理，所以保全了自己的性命；文种虽然同属一代智识之士，但没有看透勾践的本性，认不清勾践为人，也不懂帝王心术，所以，惨遭屠戮。


    一代雄霸秦始皇，也是个阴狠毒辣的主儿。他手下著名的大臣尉缭曾经评价说秦始皇是鹰视狼顾，他说秦始皇是那种需要时就卑躬屈膝，达到目的就过河拆桥之人，因此只可共患难，不能共富贵。史书记载，尉缭认清秦始皇本性后，公然弃之而去；不过因为秦始皇离不开他，后来派人把他追回来，继续让他担'
  merge: -1
  img_proc: true
- pgno: 166
  md: '任高官。要说尉缭是个极端聪明之人，相信其言不为过。但是，翻开史书我们会看到，中华地大物博，人文鼎盛，奇人代出。与尉缭同一时代的秦人王翦，也是一个有着高智商的人。


    话说王翦这人，不仅政治智慧高超，而且还能征善战，是一个著名的将领。他戎马一生，为秦国立下汗马功劳。年老之后，辞官不做，安享晚年。秦始皇在统一天下的征战中，遇到了楚国这个虎悍的对手。嬴政派李信、蒙恬率军攻楚，结果伤亡惨重，大败而回。秦王欲平楚国，大臣们就力推王翦出山。秦王亲自谦恭下士，跑到王剪府上请王剪。王剪却推群道：“臣年老不堪重用，每日喝茶饮酒还可过活一时，如果带兵打仗恐怕是不行喽。”读过史书的人都知道嬴政为人，他是不达目的决不罢休的。嬴政虽然极不高兴，但是还是反复劝说，坚请王剪出山。最后，王翦推却不过，只得答应嬴政的要求。但是，他提出，要打楚国，需要六十万军队。秦王答应，立刻下诏在全国征召士兵。秦国几乎倾尽全部之力，才凑齐了六十万兵力。于是，王翦挂帅出征。


    奇怪的是，王剪出征前，趁着秦王送行之际，请求秦王赏赐他几处良田美宅。秦王笑道，将军你尽管放心，难道你还担心挨饿吗？王翦说，做大王的将帅，有了功劳也不能封侯。而且我也年老了，今后恐怕也没机会为秦国立功了，这就没法请赏啦。所以现在趁着您还看重老臣，多讨些土地田宅留给儿孙啊。嬴政大笑，立刻答应。


    王翦在出征途中，好像是不放心的样子，连连派人回咸阳询问赏赐地产的事。军队还没出潼关，他就派了五批使者回去。王翦身边的人素来敬重王翦为人，知道他德高望重，却不解为何做如此下鄙之事。有个将领实在忍不住了，就问王翦：将军您如此做，难道不怕别人说您太贪心了么？王翦笑着说：你不了解'
  merge: -1
  img_proc: true
- pgno: 167
  md: '其中的道理啊。大王这个人为我很了解，素来容易猜疑别人，从来不信任在外面出征的将领，生怕他们会挟兵反叛。现在几乎全秦的兵马都在我手上，而且远征在外，以大王的刻薄多疑之性，恐怕早就坐立不安了。我现在多要财产，不过是向大王表明心迹，不仅我要在秦国效忠，而且子孙后代还要蒙秦王栽培，绝不反叛。这样，秦王才能放心啊。手下听了，对王翦心悦诚服。


    王翦以全秦之力，一举-fil灭楚国，俘虏楚王负当，杀死楚将项燕。秦王远在千里之外，对王翦一直信任有加，从不猜忌。王翦正是草着对秦王的深刻了解，才能够取得如此辉煌的战绩。干载之下，我们评价王翦，夸他一向文韬武路是毫不为过的。原因不仅在于他熟知自己的本职业务——军事工作，而且他的行政能力——政治水平也非常之高。再回头看岳飞，虽然也是一代英雄，为后人敬仰，被尊称为圣，但政治悟性却稍嫌不够。他不知道高宗的所思所想，结果同高宗南辕北辙，最后被高宗和秦桧联手设谋陷害。


    以上两个案例都揭示了“识人”之重要。血淋淋的历史告诉人们，识人，则可能顺风顺水；不识人，则可能贻患无穷。当年朱元璋的正妻马皇后生了病，自知时日无多，就拒绝服药。朱元璋与马皇后情深意笃，生怕马皇后一病不起，就劝皇后服药。马皇后说，我的病恐怕已经撑不了多久了。我一死，依照你的脾气，肯定把给我看病的太医全杀光。我已经好不了了，何必因我再多死人呢。朱元璋说，皇后放心吃药，如果有不测，我决不迁怒于人。皇后听了，微微一笑，说，多少年了，我还不了解你的为人么。一直到死，皇后都没有吃药。马皇后凭着对朱元璋入骨入髓的了解，获得了朱元璋对她的敬爱。开个玩笑吧，“识人”不仅包括男人认准男人，而且包括男人认准女人，当然了，女人也要认准男人，而且女人更要认准女人。因为女人一旦对付起女人来，其手段往往'
  merge: -1
  img_proc: true
- pgno: 168
  md: '更毒辣。吕后杀赵姬、武则天杀萧妃，都是毒之至毒。如果当年赵和萧能看出吕和武的为人，肯认低服小，也就不至于这么惨了。当然，话说回来，谁也没有未卜先知的能力，赵姬、萧妃也是命该如此吧。


    # （2）不识人之害


    历史上有个大奸臣安禄山，他之所以能够把盛唐拉上衰败的歧路，其原因就是因为唐玄宗没有识人之明，误把安禄山当了好人。天宝六年，安禄山进京朝贡。时年安禄山四十六岁，体重过人，腹垂过膝，自称肚重三百斤。有一次，玄宗跟他开玩笑：此肚装了什么东西，会撑得这么大呀？安禄山立刻表态说，没有别的，只有对陛下的一片忠心。玄宗听了非常高兴，对安禄山更加信任。安禄山就是凭借此类伎俩骗取玄宗欢心的。其实，安禄山不仅聪明，而且狡诈。但是他会掩饰自己的聪明，在玄宗面前故意装傻，让玄宗对他不加提防。天宝七年，安禄山再次朝贡。一次玄宗让他拜见太子李亨，可是安禄山竟然见面不拜。左右催促他下拜，他却装傻说：我是胡人，不懂朝仪，不知道太子是何官？玄宗以为他真的不懂，就给他解释。安禄山听了，说，我衮得要命，只知道有陛下，不知道还有太子。这话一语双关，肯定是设计好的。在政治斗争中也曾聪明过人、先后斩杀韦后和诛灭太平公主两大政敌的唐玄宗，对安禄山奸诈的为人却放松了警惕。最后，导致了安史之乱，玄宗被迫出逃，全国兵祸罹乱，民不聊生，大唐从此也开始走上了下坡路。


    唐玄宗识人无术害了祖宗江山，孙膑不识庇涓害了自己的健康，这也都还不算什么。历史上，因为不识人、识错人而丢了性命的大有人在。


    东汉历史上有名的高官，经历四朝亲手扶植三个皇帝的骛<|message|>将军梁冀，最后就死在认人不准上。梁冀本是外戚，因为自己妹妹当了汉顺帝的皇后，当上了'
  merge: -1
  img_proc: true
- pgno: 169
  md: '汉朝位高权重的大将军。后来，汉顺帝病死，其子冲帝即位。冲帝才两岁，朝政全由梁冀和皇后妹妹控制。第二年，冲帝患病，眼看就不行了，于是梁冀和皇后妹妹商量立渤海王刘鸿八岁的儿子为帝。渤海王平日对梁冀很是殷勤，因此，关键时刻得到了梁冀的支持。这样，冲帝死后，八岁的质帝被梁冀兄妹扶植即位。梁冀一手扶植皇帝登基，自感功劳最大，于是日渐骄纵，且并不把质帝放在眼里。质帝虽然只是个八岁的孩子，但是，已经开始知道了是非。他对梁冀的飞扬跋扈非常不满，也并不知道自己之登上皇位背后的运作过程。一次，他早朝之后对着离身而去的梁冀说了句
    “哼，这个跋扈将军”。质帝毕竟还是个孩子，不懂权力斗争的险恶。质帝说完这话之后，立刻有人把这话告诉了梁冀。梁冀又气又怕：气的是把你扶植上去，你不仅不感谢反倒口出恶言，是可忍孰不可忍；怕的是小皇帝如此年幼就开始讥厌自己，恐怕将来皇帝一旦懂事亲政后果不堪设想。于是，梁冀杀心顿起，派人在质帝吃的煮饼里下了毒药。小皇帝吃了之后就鸣呼哀哉了。毒死质帝，梁冀害怕选别人再出现意外，于是就立了自己妹夫的曾孙为恒帝。这样，梁冀就把大权牢牢控制在手中。他把恒帝身边的卫士全部换成自己亲信，随时监视恒帝。而恒帝从质帝身上也学会了许多东西。他任由梁冀摆布而不作声。梁冀由此更加不可一世。然而，梁冀并没有认清恒帝这个人，自己还在做着黄粱美梦。几年之后，恒帝趁着梁皇后去世的机会，把梁冀迅速抓捕，将梁家一家满门抄斩。梁冀八十岁老娘倒崩婴儿手，终年打雁反被维雁啄瞎了眼，眼睁睁开采着自己亲手扶植起来的皇帝反手一刀剐了自己脑袋。


    上述几个案例表明，参与到社会竞争中，如果不能识人，则势必会落入处处被动的处境。轻则事业失败，重则身死家亡。所以，害莫大于不识人。'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# （3）识人之难


    既然能识人则利，不识人则害，那么，为什么还会有人一而再、再而三地因为认人不准而下场凄凉呢？其中的关键，就在于识人并非易事。


    “知人知面不知心”，说的就是知人之难。人性复杂多变，所以要真正了解一个人是非常难的；在权力生活中，许多人都是扭曲的：明明喜欢一个人，偏偏要装出讨厌他的样子；明明厌恶一个人，偏偏要亲密无间得像一家人。这种口是心非，甚至口蜜腹剑，没有身居其中很难体会到。因为大家都戴着面具，所以，要想真正了解别人人，可以说就难上加难了。


    虽然知人很难，但是智慧的中国人早就摸索出了许多知人之法。著名的法家代表权谋理论的先驱韩非子就是其中的一个佼佼者。韩非子在其权谋理论体系中，形成了比较成熟的知人思想。比如，他为君主设计了“倒言反事”、“疑诏诡使”“挟知而问”等一系列方法。韩非子认为，君主可以通过故意说错话、颁布莫名其妙的诏令和明知故问的方法，对臣下的为人ásával


    韩非子的知人之法从本质上说是非常高明的。他从君主的角度提出的一整套诡诈之法，后人特别是领导者经常拿来运用。


    然而，即使韩非子这样的权谋大师，一样还是犯了“不知人”之误。


    韩非子才高八斗，且心怀天下。他写的《说难》、《孤愤》、《五蠹》等文章，天下闻名。秦王赢政读了他的书，不禁感叹说：“我若能与这人见上一面，我就死而无憾了。”


    赢政对其推崇欣赏之情可想而知。而人们都知道，赢政是千古一帝，其野心、其手腕，千古以来不作他人之想。而赢政如此推崇韩非，那韩非的水平也就可想而知了。'
  merge: -1
  img_proc: true
- pgno: 171
  md: '接下来的故事大家都知道了。秦王想见韩非，派人到韩国要人。韩王被迫派韩非为使出访秦国。韩非和李斯都是荀子的学生，所以李斯以仁义之表和同学之谊欺骗了韩非，然后反过来在赢政面前挑拨说：“韩非是韩国公子，大王您想吞并诸侯，韩非肯定是偏向韩国，绝不会真心为王上效力。一旦韩非回到韩国，那可就后患无穷了。不如找个罪名杀了他。”李斯的一番话打动了赢政。因为在不久前，韩非确实向秦王建议先攻赵后攻韩，而当时的形势是韩国弱而且近在眼前，赵国远且实力强大，所以，攻韩应先手攻赵。所以，赢政认为韩非的建议确实偏袒韩国，就派人把韩非关进了监狱。李斯深知韩非的才华远胜于己，生怕自己失宠而被韩非取而代之。于是，悄悄派人逼韩非服毒自杀。赢政后来后悔自己听了李斯的话，忙派人去救免韩非，但是，韩非早已被李斯暗害了。


    李斯是历史上非常了不起的一名战略家。赢政正是在李斯的帮助下，才彻底建立起大一统的中国。同时，李斯又是一名非常了不起的权谋家。与韩非相比，他的理论水平虽然屈居韩非之下，但是实践操作水平却远远在韩非之上了。所以，在权术实践家和权术理论家的
    PK 中，权术实践家胜出。


    反观韩非，其权术理论修养水平不可谓不高，但是却栽在了李斯手里。这里面的关键，不在于韩非识人无术，而在于李斯的权谋太精了。韩非如此高手在李斯面前都看走了眼，这是因为：识人之难，一方面难在识人者自己，要求识人者具备识人之法；另一方面难在被识之人，有时被识之人戴着重重面具极难看懂。所以，古往今来许多人都知道识人之法非常重要，但真正能够做到识人有术的却少之又少。


    # (4) 识人之术'
  merge: -1
  img_proc: true
- pgno: 172
  md: '中国浩瀚的历史给人们以许多智慧。要想掌握知人、识人之法，我们还是要回到历史中去，到历史深处去汲取古人的智慧。


    # 一是以相识人。


    曾国藩不仅是一个政治家和军事家，而且还是一个深识相术的人。他依靠相术相人，早https传为佳话。有一部《冰鉴》的书中就专门记载着曾国藩的相人之术。据《清史稿》记载，曾国藩为人威严，长着一副漂亮的髯须，一双三角眼炯炯有神。每当有访客来时，他就注视着来客良久不语，默默地考察来人品相。见过曾国藩的人无不对其肃然起敬，在其锐利目光逼视下手足无措。客人退下后，曾国藩就暗自记下那人的好坏，没有人能逃漏不应验的。


    当然，戎马半生的曾国藩并不是单靠看相来识人的；但是，相人之术博大精深，作为中国传统文化的大智慧之一，当然能够而且必定会用在识人之中。笔者认为，以相术相人，是具有一定合理性的。古往今来许多名人都熟知相术，且能够熟练运用相术。


    中国有句古话叫“相由心生”，讲的是一个人的内在性情能够通过外在相貌体现出来。比如，一个人性格刚强，那么，他的外形大多是剽悍强壮的；一个人性格阴柔，则他的外形多走柔弱纤细的路线。这是基本的相法知识。


    相书中还讲，“男人女相”和“女人男相”的人一般能够成大器。这里面的道理虽然玄妙，但是也不是不可理解的。男人壮硕，女人娇小，这是自然进化的一般结果。但是，如果男人能长成女人那种娇小的样子，那么，则一定证明他性格深处有着极大的柔弱的成分。而男人又以刚硬为基，所以，一般来说，“男人女相”的人性格中兼济刚柔，懂得进退，能屈能伸，这样的性格，在社会竞争中往往会比纯粹刚强或一味阴柔的人占到更多优势。同样，'
  merge: -1
  img_proc: true
- pgno: 173
  md: '“女人男相”的道理也如此。


    相术中还有“南人北相”“北人南相”之说，说的是北方人长成南方人的样子，南方人长成北方人的样子，都是具备成大器的根苗。通常来讲，北方性刚，南方性柔。北方人长成南方人的样子，证明了其性格深处具备了较强的柔的成分；南方人长成北方人的样子，则证明其性格刚强。所以，“南人北相”和“北人南相”者，能有大作为，这是个常识性的道理。


    有人说，中国古代的相术其实是封建的糟粕，不是科学的东西。笔者在一定程度上认同这个观点。但是，人的内心能够通过外在的表象显示出来，则是肯定的。比如，一个人正在走运，则其必然会满面红光；一个人一直倒霉，则必然满面带灰忧心忡忡，等等。既然一个人的内心能够表现在人体的外表之上，那么，反过来，通过人的外表也能够反推人的内心。这就是相术的基本道理。当然，有人把相术弄成玄之又玄的东西，将相术夸张过了头，走向了事物的反面，这就值得商椎了。


    关于以相相人的案例，我们也可以在史书上找到根据。《汉书》中记载着这样一个故事。汉文帝时期，文帝手下有个大臣叫邓通。这个人没有什么才能和本事，但是，由手其办事小心，善于逢迎文帝，所以，邓通讨得了性格宽和的文帝欢心。有一年，文帝背上长了个毒疮，流脓不止，臭不可闻。御医开了疮药，但是敷上之后非常疼痛，所以文帝深受其苦。邓通在文帝身边伺候，见到文帝如此痛苦，就说：“我听说只要把脓液吸出来，就可以缓轻痛苦。求陛下让我来试试吧。”没等文帝拒绝，他就把嘴凑到文帝的疮口上吸了起来。果然，文帝的感觉好了很多。由此，文帝更加喜爱邓通。后来有一次，太子来探视文帝。他闻到文帝身上的病创之臭，很是恶心，但还是强行忍住，而文帝早已看'
  merge: -1
  img_proc: true
- pgno: 174
  md: '在眼里。过了一会，邓通求见，又照例给文帝吸脓。太子看得目瞪口呆，而文帝却感动不已。也许是御医的药发生了效用，也许是邓通的忠心感动了上帝，反正文帝的病还渐好了起来。文帝经过此事之后，开始对邓通另眼相看，频频给子封赏，并加封上大夫之职。


    文帝既然喜爱邓通，当然就关心他的前途了。一次，文帝让一个善于看相的人给邓通相面。史书记载简单，所以这个相面的术士是谁并不知道；但可以确定的是，这是一个非常高明的相士。他仔细看了邓通的面相之后，说：“邓通将来会贫困潦倒，最后将死于贫饿。”
    文帝听了大笑说：“我是皇帝，邓通的富贵皆取决于我，我怎么会让他贫穷呢？” 于是，文帝赐给了邓通一座铜山，许他私自铸币。由此，邓氏钱流通天下，邓通得到了巨额的财富，一时间权倾朝野。


    人世之道，兴衰无常；衰败之中蕴含着新的生机，发达之中往往埋藏着衰亡的种子。就邓通来说，导致他衰亡的种子其实早就埋下，而这一种子一遇到特定条件就会生根、发芽、开花和结果。原来，邓通给文帝吸疮的时候，被太子看在眼里，恨在心里因为，邓通对文帝大献殷勤，一方面把太子置于尴尬之地，另一方面让太子鄙视其为人行事。这些为邓通今后的覆灭埋下了祸根。后来，文帝死了，太子即位，是为景帝。景帝胡乱找了个理由就把邓通的家产全部没收了。邓通顿时穷困潦倒，无可奈何之下，不得不寄食于别人家，最后果然因贫困饥饿而死。


    往事越千年，许多事情 Workers 仍然不可测度。真正高明的是这个案例中的相士，他仅仅通过给邓通相面就准确地预测了邓通的未来，可以说，这个相士才是個真正的高人。当然了，史书或许有夸大和失真的成分。不过，通过相马之术挑选'
  merge: -1
  img_proc: true
- pgno: 175
  md: '千里马，通过相人之术挑选手下，的确是我们古人经常用到的方法。


    相人之术，包括以下几个方面：一是面相，即通过一个人的相貌推测对象的性情。通常所说的相面之术，说的就是靠看人的面相预知别人的未来。二是手相，就是看手的皮肤、纹理等外在特点推知内在性情。有向话叫“男人手要棉，女人手要柴”，其中蕴涵的道理，和上达“男人女相”及“女人男相”是一个道理。三是骨相。古人说，看个人富贵与否，就看他的骨相。骨相饱满者，一般性格浑圆；骨相畸形，则预示心术不正。四是看声相。这个“看”其实是“听”。声音也有相，有人声音宽广浑厚，有人声音高亢有力，有人声音疲软无力，可以通过不同的人的声音大约推断此人性情。五是看动相。行动坐卧走，讲的就是人的动相。古人讲，行如风，坐如钟，卧如松，这既是一种修炼，也是一种修为。相反，从人的动相之中，也可以探知人的品性。在《三国演义》中，有个叫管辂的相士为权臣邓飏相面，结果得罪了邓飏。管辂的舅父得知后大惊，管辂说：“邓飏行步，筋不束骨，脉不制肉，起立倾倚，若无手足：此为‘鬼躁’之相。早晚必有杀身之祸，何足畏也。”其舅不解，大骂而去。结果，邓飏果然被杀。管辂所讲到的“鬼躁”之相，就是从邓飏的坐卧特征判断其人的内心和命运的。


    以相术相人，从正面来说，微妙不可全识；从负面来说，往往带有个别性和偶然性。所以，笔者认为，可以知之、学之，亦可偶以用之，却不能成为识人的唯一依凭，蒋介石通晓相人之术，经常靠相术选将任人，但他许多时候都看走了眼，并没选到什么真正可用之人，结果最后丢了天下。


    # 二是以言识人。


    一个人的谈话可以反映其思想深度、真实水平，还可以反映人内心的情感。'
  merge: -1
  img_proc: true
- pgno: 176
  md: '所以，通过与人的反复交谈，可以对对方作出一个大致的判断。


    在历史上，刘邦是一个非常善于 “以言识人” 的人。汉初三杰中，除了萧何是较早便知之外，张良、韩信都是刘邦一席之谈之后发现并重用的人才。


    张良是韩国贵族后裔，聪明无敌，但是，他为别人出谋划策，别人都不能识。

    后来张良遇到了刘邦，刘邦一席交谈之下，对张良之才大为赏 intent，对张良其人大加推崇，以致于张良也产生 “殆天授也” 之感，认为刘邦知人善任的本领是老天赐给的。在别人都不听张良谋划的情况下，刘邦仅仅通过一番交谈，就认准了张良的水平，这就为今后成功把张良延揽到身边奠定了基础。刘邦未成事之前，混迹市井，成天与贩夫走卒、引车卖浆之流打成一片，凭借多年与各色人等相处的经验，刘邦早就培养了相当高强的相人之术。别人兴许不具备这个本领，但是，从史书上看，刘邦往往通过一席交谈就能够识准人才，这个本领确实是非常
    “殆天授也”。


    刘邦的大将韩信，也是在刘邦与其一席交谈之后而受重用的。韩信在刘邦手下当个小官，一直郁郁不得志。后来又犯了车规，被拉去杀头。一同处斩的十三个人都被杀了，轮到韩信，韩信面不改色地对监斩官夏侯婴说：“汉王是要得天下了？为什么要斩壮士？”
    夏侯婴是追随刘邦多年的老人，听了韩信的话之后，非常惊奇，见他出言豪迈，气宇不凡（相人之术），就刀下留人，救下韩信。两人一席交谈之后，夏侯婴立刻认识到韩信是个人才，便把韩信推荐给刘邦。但是，刘邦并没有接触过韩信，只是听说过韩信就是那个忍胯下之辱的小混子，所以只给了韩信一个小小的
    “治粟都尉”，负责军队后勤管理。韩信任职期间结识了萧何。萧何也是 “以言识人” 的高人。两人交谈之下，萧何看出了韩信正是刘邦夺天下的必需之人，手是把韩信推荐给刘邦。但是，刘'
  merge: -1
  img_proc: true
- pgno: 177
  md: 邦依然没有重视韩信。韩信无奈之下，决定出逃。这样，就上演了历史上учи的“萧何月下追韩信”的故事。萧何追回韩信来见刘邦，刘邦原以为萧何已经离他而去，惊悖之中突然见到倚为股肱的萧何又回来了，不禁又喜又气。萧何趁机对刘邦说，大王您要得天下，必须要用韩信。在此形势下，刘邦决定任命韩信为大将军。读者想必注意到了，刘邦之所以任命韩信，一是出于夏侯婴的推荐，一是出于萧何的引荐，却并没有真正了解韩信的本领。等到拜将仪式结束后，刘邦把韩信叫到跟前详细谈了一番。韩信把自己导弱胜强的谋略跟刘邦一说，刘邦顿生相见恨晚的感觉，同时以韩信的言谈中，认识到韩信是个杰出的人才。这之后，刘邦才开始真正重用韩信，最后在韩信的帮助下平定天下。刘邦以言识人之术，还突出表现在刘邦用陈平这件事上。陈平是从项羽那里逃出来的版臣，通过刘邦的臣僚魏无知引荐给刘邦。了解汉史的人知道，陈平与刘邦一样，都是从草荫中出来的天才。陈平的谋略运用之术，一点不在刘邦之下。话说刘邦召见了陈平之后，就赐给他饭食，让人带他下去休息。刘邦军机繁重，日理万机，如果一旦错过了这个机会，那何时再能得见刘邦，何时再能引起刘邦的重视，那可就不得而知了。我们说陈平是谋略奇才，在这件事情上就充分
    表现出来。陈平见刘邦要安排他去休息马上说：“我有要事来见您，所说的事不能拖过今天。”从史书记载来看，陈平并没有什么非说不可的事情。但是，陈平以此说辞成功得到了和刘邦交谈的机会，于是对刘邦滔滔不绝地谈了一番。
    一个是惊天地泣鬼神的谋略奇才，一个是见微知著识人得法的资深领导人，自然形成了良性的同频共振。刘邦一谈之下，立刻认出陈平是个不可多得的人才。于是，他问陈平：“你在项羽那里担任什么官职？”陈平说：“都尉。”
  merge: -1
