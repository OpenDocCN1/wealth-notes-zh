  md: '于自我打脸，场面上会非常难堪。所以这就需要前期做很多舆论铺垫，形成有错必纠、冤案必反的清明形象，把坏事变成好事。


    # 三、引发官场地震


    因为一个冤假错案的形成，需要很多方面的配合，如果真的深究到底，那这一批人都要受到处理，这样情况一般只有在政治斗争中才会查的非常彻底，不然就最多适可而止。


    所以要翻案，最大的机会是趁着组织内部的权力斗争，不能随意扫射，不要想着追责，不然原来判案的人会想尽一切办法来阻止翻案，而是找到和自己利益一致的权力方。不然有权帮你的人，都被你伤到了，他们怎么还会有动力给你翻案呢？


    回到本案例，基于以上的分析，很可能是因为上述的几个原因形成了冤假错案，掩盖了真凶，而这个真凶因为逍遥法外，反而容易变本加厉，导致于自己暴露，现在很多真凶的查出，是因为相同的作案手法，在其他案子中暴露从而找到线索，就算是这样，其实原来的被冤枉的人也不一定就知道，而现在他们及时获知了信息。这个最有可能是当时的执法机构内部存在权力斗争，一派要通过这个案子搬倒另外一派，让被冤枉者的家属出面即可，自己躲在后面就能达到自己的目的。


    而且这个案子居然到了中书令张俭这里，照理这样的案子由相关部门来处理即可，就算复核也到不了中书令这个层面，因为中书令是皇帝的大秘，而且这时候的中书令是德高望重的张俭。这很可能代表执法机构的另外一派和张俭有关联，他们属于同一个派系。


    这时候皇帝居然出面了，皇帝的出面代表张俭复审这个案子没有和皇帝通过'
