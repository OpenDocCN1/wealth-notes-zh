  md: '最后你会发现，其实他们都是依靠关系、资源、权谋手段上位，而这里面没有一个能细嚼，因为都充满了见不得光的台下交易；而普通读者，因为没有能力破解这些成功人士美化过后的表面文章背后的真相，所以只能被他们所骗，自己还幻想着有朝一日和他们一样成功！


    # 读书无用？那是你不会读！如何避开读书的三个大坑


    对于读书，社会上存在两种完全不同的说法，一种是“读书无用论”，还有一种是，“学好数理化，走遍全天下”！而在现实中，绝大多数人从学校毕业后，就很少读书，问他们为什么不读书，得到最多的回答是：“没有时间”或者是“静不下心”。其实这个还不是本质原因，本质原因是认为读书没有用，所以不愿意花时间精力投入在读书上面！


    那为什么那么多人会觉得读书没有用呢？因为读书路上有以下三个大坑！


    # 一、抵触化


    从学校开始，利用工具化的填鸭式教育，大部分人对这种教育方法有一种内心抵触感，所以等到毕业后，就不愿意学习了，觉得学习都是被动的，而且容易感觉学的内容在现实工作中也用不上，更加降低了读书的意愿。


    # 二、修行化


    有一部分人，比较喜欢学习，很容易就进入了传统文化的儒释道的范畴，而儒释道大部分都是修身养性的，把自己学成一个善人，但是和现实往往容易格格不入，而且因为自己信奉了儒释道在社会和职场上受害，那就只好回来更加修行化，这样读书和实践就脱节了，读书对现实来说就没有用了。'
