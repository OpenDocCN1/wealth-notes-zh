    # 中国人为何爱开会，只因权力需要通过会议博弈！那为何会议又很圆满？


    很多朋友都说，中国人的会议太多了，而且大部分会议都没有实质性意义，时间都浪费在开会上了。其实说这个话的人，大多不懂权力，更不懂权力的运行规则，通过本文我们来彻底解析下，为什么中国人如此喜欢开会？


    会议是一个部门、一个群体决策的主要形式和载体。会议的座位和发言的秩序都非常重要，效果也不大一样。比如发言，如果太早，大家刚进入这个环境，一般说来思想还没有稳定下来，精神还没有集中起来，发言的内容听不太进去，'
  merge: -1
  img_proc: true
- pgno: 312
  md: '效果不会太好;到最后发言时，大家又都疲劳了，效果也不会太好，所以中间偏前一点最理想。


    执政者总是重视文件和会议的。文件和会议是保证权力运行的一个个枢纽；文山会海几乎是权力们不可或缺、并且激情真正所在的生存方式，即便是空话连篇的会议、即便是没有任何实际效用的会议，也往往得到他们本能的喜欢。道理很简单，只有在这种时候，才会设置主席台和听众席，明确区分等级……
    强势者的话语才可以通过众多的耳朵，得到强制性的传播扩散。权势者可以沉浸在自己所熟悉的语言里，感受到权力正在得到这种语言的滋润、哺育、充实和保护。


    在会议中，比较有领导方法和领导艺术的“一把手”，在研究决策之类的会议上是不先发言的。尽管绝大多数“一把手”在会上开的是头阵，实际上是会议组织者的角色，真正的发言很自然地留在了最后。最后的好处，一是拍板定案；二是会议总结。这样，会议就会开得很圆满。


    那么，“一把手”末位发言，又是通过一种什么方式将自己的意志贯彻到会议中的？主要是通过会前的个别酝酿和无形的发言顺序来实现的。


    领导班子民主集中制有四句话，即“集体领导、民主集中、个别酝酿、会议决定”。相当多的“一把手”就充分运用了“个别酝酿”这一环节。在会议召开前，“一把手”有了想法，一般都要与重要的副职领导(包括行政“一把手”)先进行酝酿(即沟通)，形成初步思路(即端盘子)，然后才拿到会上去讨论。党委会议发言，虽然没有明确规定发言的先后顺序，但并不是所有的成员都会随心所欲地无序发言，实际上每个与会人员心里早就放置了一个发言顺序。这个顺序般是行政“一把手”或重要副职打头阵，其他副职依次发言，然后到其他成员'
