- pgno: 319
  md: '于上级的指令吹毛求疵，指指点点。我劝他说，你这样不把上级放在眼里，当心吃亏呀。他说，上级是明辨是非的。于是我行我素。结果，如我所料，不久就听到了他被撤职的消息。其实，这并不奇怪。上级是人不是神，你把上级看成神明，和弥勒佛一样，大肚能容天下万事，那是不现实的。讲求实事求是才是聪明的选择。


    我很重视对上级的态度。和上级相处，最重要的是态度，如果态度掌握得不到位，上级就会对你产生很不好的看法，而且印象极深。往往是一次失误，满盘皆输。所以，我在见上级时，格外注意，递小慎微，尽量不出现不恭的行为。每当见到上级，我总是把腰深深地弯曲着，点头如鸡啄米，并让笑容格外灿烂。其实，这只是表面。事实上，在招待上级方面，我早就做了大量的、细致的工作。比如，上级爱住什么样的宾馆，上级爱吃什么饭菜，上级爱喝什么酒水，上级有什么业余爱好，上级烦的是什么，上级忌讳的是什么，上级在本地有哪些亲属朋友等等，我都要弄得清清楚楚，做到心中有数。在此基础上，我会根据上级的好恶和特点，将吃喝住行玩等安排得周到细致，恰到好处，尽量让上级满意。为了体现自己诚意，我还下功夫练就了烹饪技术，待上级来时，我常常要亲自下厨，为上级做上一两道好菜。我这一招可谓灵验，我的多位上级被我的这一诚心所打动，很快就把双方的距离拉近了。于是，我成为上级心目中的红人。


    我善于和上级拉关系。当今社会就是一张大网，大家都能在网中找到自己。在关系网中，最为重要的是你与上级的 Jesus，如果你与上级的 Jesus 搞不好，那么你再有本事也没有用。一个人能干是好事，但是，以为自己能干就可以忽视与上级的
    Jesus，那就算成了坏事了。在这个世界上不乏能人，但是能人未必能升'
