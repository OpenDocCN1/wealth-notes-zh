- pgno: 118
  md: '只好答应下来，于是老着脸皮敲了一阵瓦缶了事。蔺相如回过头来对赵国史官说：“也把这段记下来。某年某月某日，秦王为赵王击缶。蔺相如针锋相对，使得赵王面上生光，秦王却在被迫要挟下颜面全失。并且，秦王得知赵国大军在附近驻扎，晓得赵国军力强盛，一旦撕破脸皮，也讨不到什么好，于是喝退群臣臣，假装刚才什么都没有发生过，将争执和不快一带而过，继续和颜悦色地与赵王喝酒。最后，两国订下了互不侵犯的和约。


    在这个案例中，蔺相如不顾秦王威势，手抱瓦缶，扬言要“血溅大王”，言下之意就是要用暴力和秦王同归于尽。蔺相如的举动对秦王来说构成了威慑一一如果不听从的话，估计真有可能发生恐怖事件。于是秦王不得不勉为其难。同时，赵国陈兵边境，也是一种很强的兵力威慑，使得秦国无法像扣押楚国国王那样用蛮力硬来。这都是威慑作用在操控方面的体现。


    与此同时的还有毛遂自荐。秦国攻赵，赵平原君奉命至楚议论合纵抗秦之事。可由于秦国的强大，楚国不敢贸然出兵。因此，平原君说了半天，楚王就是不敢派兵攻秦。此时毛遂手提宝剑走上跟前，说：“合纵与否，不过几句话的事儿。怎么这么半天还没完啊？”楚王不快，问：“这是谁啊？”平原君回答说是他的门客。楚王一听说是跟着平原君混饭吃的小弟，立刻觉得和这种上不了台面的下人说话掉价，于是大怒，骂道：“我和你的主人商量国家大事，哪轮到你来插嘴。”要是搁别人，不仅自己会吓得不轻，而且还会给主人惹祸。毛遂不慌不忙持剑又上前一步，说：“合纵抗秦是天下人的事，天下人都有说话的权利，为何说我多嘴？”一边说着，一边把手里宝剑故意晃了几晃。估计毛遂还会用“好剑、好剑”之类赞许的目光瞄瞄剑锋，再看看楚王脖子。楚王看到这阵势，知道眼前这人又是個玩命的主，并鉴于当时政局动荡、刺杀暗害'
  merge: -1
