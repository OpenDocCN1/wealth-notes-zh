- pgno: 46
  md: '资源，那给人以不信任的感觉，人家凭什么和你合作呢？除非你有非常强势的背景和靠山能直接变现(对于普通人来说基本不可能)。成功者在基本盘上都善于死磕自己，非常努力，有恒心、有毅力。


    # 四、 善于攀缘附会，趋炎附势


    攀缘附会和趋炎附势在一般人看来都是贬义词，而实际上如果你要改变自己的阶层、底层崛起，那资源都在权势人物的手里，你不靠近他们，你怎么可能获得机会呢？所以你千万不能官官相护，因为他们才是你要靠拢的目标，在做大自己的基本盘的基础上来和他们合作，帮他们实现自己的价值，这样你才能获得价值。


    以上的四条规律是底层崛起的必要条件，缺一不可。如果你有一番抱负想要改变自己的阶层，为社会做一番事业，不让此生白过，那以上的几条必须牢记在心，过过不用宣传，只做不说！


    # 三观被颠覆！小孩子才分对错，成年人只看利弊？


    我们从小就潜移默化进行了道德教育，不知不觉就被灌输了一套价值观。当我们长大后，也就自动自发的利用整套价值观来判断自己所遇到的事情，符合价值观的就高兴，不符合价值观的就想痛，由此给我们带来了爱恨情仇。


    如果我们踏入社会，原来的三观就很有可能把你牢牢封印在底层，为什么会这样？因为你的道德观念很可能是别人用来控制你的工具。也就是说，你对事情的对错判断其实是别人掌握你的方法。由此你就知道，你对是非对错的判断越明确，人家就越容易掌控你，所以高手都是喜怒不形于色的。'
