    # 为什么领导都希望自己指定接班人？《岁月》深究之六


    在《岁月》的电视剧里面，闻局长指定了梁志远继任局长，联系到以前有很多朋友问起，在体制内，为什么很多领导都希望由自己来指定接班人，自己在这样的权力变动里面又会有什么机会吗？


    首先我们来说明一下，为什么领导都希望指定接班人：


    # 一、路线的延续


    只要领导既定路线能继续执行下去，那自己的政治生命就还在延续。很多领导把这个路线当做性命来抓，为了路线斗争，你死我活，当然路线斗争的背后其实是权力的博弈。


    # 二、既得利益的保障


    这个分为两个部分，一个是自己的在任上就有的既得利益，还有一个是自己的跟班的安排，这些都需要透过自己人才能实现，所以指定接班人有非常现实'
  merge: -1
  img_proc: true
- pgno: 309
  md: '的需要。


    # 三、防止被清算


    一个领导在任时间长了，都会因为各种说情和利益关系，有些账目就很难见得光，所以如果继任者要翻旧账、搞清算是轻而易举的事情，所以为了防止自己被清算，必然指定接班人，而这个天然就带有道德绑架，新上任的领导也不方便来清算前任。


    不过对于更上级的领导来说，肯定是不希望下面的组织铁板一块，所以总是希望能上面空降一把手过来，不过这样组织内部的既得利益派就会牢牢捆绑在一起，和新来的领导进行博弈。


    这时候，如果新领导能<|start|>准机会，找准方法，对他们进行分化瓦解（在这里，组织内原有失意派就能找到机会），这样才能巩固自己的位置，不然肯定就是要被拱走。


