    # 三、面向未来


    这一点是最重要，把晋灭吴说成是天意所归，言下之意就是不管我们东吴君臣如何努力，都逃不过天意，晋朝才是众望所归，衬托出我们东吴的老百姓和老臣不要再有非分之想，妄想东山再起。就算吾彦在这里本意是恭维晋武帝，而如果经过晋武帝的宣传，让吴地的臣民听说后，也会丧失复兴故国的希望，这对于巩固西晋的统治、晋武帝的权力安全都有非常重要的意义。所以说，吾彦这个回答不仅是对过去的总结，更是面向未来。'
