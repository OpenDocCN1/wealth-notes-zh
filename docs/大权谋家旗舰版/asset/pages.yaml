- pgno: 119
  md: '时有发生的现状，只得赔着笑脸问毛遂：“先生有何高见？”接下来，毛遂又雄辩滔滔，宣称赵国与楚国合作之利。在毛遂威慑逼迫及说服之下，楚王当即与平原君歃血为盟。随后，楚王派兵救赵，平原君完成了出使任务。当然，我们不否认，楚王派兵并非简单由手毛遂的威慑，而是从当时天下的战略格局出发考虑的，但是，在这一事件中，毛遂的威慑手段起到了直接的促进作用，对事件的进程造成了积极影响。


    在上面两个类似的例子中，如果拿藺相如、毛遂与秦王、楚王进行实力 PK 的话，不用说，两人会处于绝对的下风。但是，两人也有可资利用的实力肉体消灭力。运用此力量，能够对对手形成有效的威慑。所以，在盘点实力的时候，实力大固然可喜，实力小也未尝可鄙。只要能够正确运用这些力量，一样能够形成有效威慑。


    其次，要有使用此力量的决心。


    众所周知，威慑力量是客观存在的。力量的强大与否，往往能够被对方感知。但是，如果实力主体不具备使用力量的决心，那么所谓威慑只可能流于形式，不能产生使人畏惧的效果。所以，在竞争中，要想用威慑手段操控别人，实力和运用实力的决心，是成功威慑的双翼，缺一而不可。美国老牌国际战略家和谋略家、前国务卿基辛格曾说过：“(实力和使用实力的决心)如果有一种要素不存在，那么，威慑就不起作用。实力不管多大，如果没有诉诸武力的决心，它也无济于事。”


    武则天是威慑操控的高手。她以铁血手段君临天下，镇压徐敬业叛乱，杀死裴炎，诛灭大将军程务挺。为了进一步巩固政权，武后发扬她当年当才人时就已具备的狠辣作风，把众人召集在朝堂上，当众宣称：“朕辅佐先帝超过三十'
  merge: -1
