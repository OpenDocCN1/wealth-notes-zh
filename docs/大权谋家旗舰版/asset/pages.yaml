- pgno: 76
  md: '在电影里面，我们常常看到，一些黑社会反派分子绑架主人公的儿子、爱妻、父母以此来要挟主人公，企图靠此手段操控主人公。这是一个常见的能量传递、借力打力的例子。在现实中，如果人们无法接近一个人，则可以通过接近他的至亲，然后以能量传递的方式，成功接近此人。当年那个富家公子想得到杜十娘却无法实现，于是他接近李公子，通过操控李公子来实现目的。同样，当需要打击竞争对手的时候，如果无法直接对对方发力，可以打击与他具有密切亲缘关系的人。当然，打击效果也会通过某种渠道传递给此人。


    下面，我们来看一个案例。


    《三国演义》中讲到刘玄德在新野县遇到徐庶，拜为车事，用徐庶计袭樊城，败曹仁，震动曹军。曹操叹息徐庶为刘备所用，说：“惜乎贤士归于刘备！羽翼成矣！奈何！”意思是，刘备的帮派中有如此干将，都派热力大增，怎么办啊？他的重要谋士程昱乃出一计，把徐庶老母骗到曹营，并放出风声。徐庶是至孝之人，如今老母被困，方寸大乱；同时亦深知曹操是那种“宁可我负天下人，不叫天下人负我”的人，如果仍然留在刘备身边出谋划策，必然遗祸老母。因此，他不得不亲到曹营救母，后来被曹操强行收走。程昱的这一计谋，其实质就是利用亲缘手段来操控别人。不过，没有以直接的亲缘关系为依托，而是间接用亲缘关系来操控人。


    我们采用前文提到的“阴阳对位”的研究方法分析可知：亲缘关系不仅有你我之分，还有有无之分。因此，不仅可以依靠自己的亲缘关系和别人的亲缘关系为手段展开操控，而且，还可以在“无”中生“有”，把没有亲缘变成有亲缘，通过“认亲”的方法来实现操控。


    “认亲门”事件由来已久。权力场上的认亲不同于风月场上干爹干女儿之间'
