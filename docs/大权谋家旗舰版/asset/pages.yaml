  md: '# 新官上任，应该墨守成规还是另起炉灶？


    【续资治通鉴原文】乙巳，帝与皇太后御承明殿，垂帘决事，始用王曾议也。时冯拯继丁谓为首相，颇欲踵谓故迹，曾独晓以祸福，且逆折之，拯不敢肆。自是事一决于两宫。


    【翻译】乙巳，宋仁宗和皇太后前往承明殿，皇太后开始垂帘听政，这是采用了王曾的意见。当时冯拯继丁谓之后担任首相，很有效仿丁谓专权玩法，王曾私下给他告诫，同时表示自己绝不会赞同，冯拯于是才放弃这个打算。从此国家大事都由皇太后和仁宗决断。


    【解析】官场变幻频繁，大家都为了官位使劲浑身解数，让自己占据某个有利位置，位置拿到后，到底是应该墨守成规还是标新立异、另起炉灶呢？这个问题很是伤脑筋。


    而不管是墨守成规还是另起炉灶，都有成功案例，譬如汉朝开国后著名的萧规曹随，获得了良好统治效果。但是更多的还有另起炉灶，一朝天子一朝臣，后来的皇帝（领导）推翻前面皇帝的很多政策，也不乏成功之处，那到底是墨守成规好，还是另起炉灶好呢？我们从这段材料开始分析起来。


    材料开头说到，宋仁宗和皇太后前往承明殿，皇太后开始垂帘听政，这个听政的方式已经变了，原来是让雷允恭居中联系，朝臣、皇帝、太后是不能直接见面的，而这个听政的形式的改变，敏感的人就应该知道人事或者权势背后的变动，就如我们开会的时候，本来是总经理主持的，现在突然董事长主持了，敏感的下属就应该知道领导层的权力分配发生变化了。所以我们平时要观察现象，更重要的是分析现象背后的原理。


    冯拯几起几落，这次趁着首席宰相丁谓被王曾通过权谋击败，冯拯作为次相'
  merge: -1
  img_proc: true
- pgno: 325
  md: '继任首席宰相的位置，冯拯其实很奇怪哦。他历史上是和丁谓一直搞在一起的，也就是说他们是一伙的，他在继承了丁谓的位置后，还想沿用丁谓的那一套，因为丁谓的那一套对提高首席宰相的权势很有作用，所以他还想恢复这一套，他这个就是萧规曹随。


    其实在新官上任后，都有一种想延续以前的做法的冲动，特别是空降的，对当前的情况不太熟悉，不太方便一下修改原来的政策。而且如果一旦你改了流程，如果出了问题，那就是你的责任了，所以空降领导新上任都不愿意先改矩。


    本段材料里面，王曾私下劝谏冯拯不要那么做。王曾在历史上有一个标签，就是君子起来比君子还要君子，小人起来比小人还要小人。由此可见，他是随时能变化的，我估计他这样对冯拯说，也是为了保护冯拯，没有想把冯拯搞倒，不然他就可以纵容冯拯这样做，然后看着冯拯出错，之后添油加醋、上纲上线把这个出错再向皇太后密报，把冯拯和丁谓打成一伙（其实他们本来就是一伙，冯拯还为丁谓开脱过）欺瞒皇太后，以权谋私等等。这样就可以扳倒冯拯，王曾自己可以直接做首席宰相。


    新官上任，到底是要墨守成规还是另起炉灶，其实没有定数。而是要按照你的前任是正常高升，还是被打倒，如果是正常高升（排除调离后秘密调查的情况），那你萧规曹随还问题不大，通过这样的过程摸清组织体系，拉拢可以拉拢的势力作为自己的权力支撑，然后再慢慢改变。


    如果你 的前任是被打倒的，那他肯定是犯了权力方面的错误，所以你一定要和他撇清关系，甚至拿到原来的材料后深刻揭批，对于被打倒前任所已经形成的流程必须否决，因为这样你才是对更上级的领导做投名状，你才能保住自己'
  merge: -1
  img_proc: true
- pgno: 326
  md: '的位置，不然你和原来的领导还勾勾搭搭、遮遮掩掩，那就正好被潜敌利用来密报上级，那到时候你就悔之晚矣。


    # 中国的领导处理问题为什么总是那么不公平？


    【资治通鉴原文】司隶校尉上党李惠（xi）劾奏故立进令刘友、前尚书山涛、中山王睦、尚书仇射武啖（gdi）各占官稻田，请免涛、睦等官，啖已亡，请贬其谥。诏曰：“友侵剥百姓以谲惑朝士，其考竟以惩邪佞。涛等不贰其过，皆勿有所问。熹亢志在公，当官而行，可谓邦之司直矣。光武有云：‘贵戚且敛手以避二鲍。’其申敕群寮，各慎所司，宽宥之恩，不可数遇也！”睦，宣帝之弟子也。


    【翻译】司隶校尉、上党人李，揭发从前的立进县令刘友、前尚书山涛、中山王司马睦、尚书仇射武啖等都有霸占官府稻田的行为，请求免去山涛、司马射睦等人的官职，武啖已经死亡，请求将他的谥号降级。晋武帝下诏说：“刘友欺凌掠夺百姓，迷惑朝廷官吏，应对其拷问处死以惩罚邪佞之人。如果山涛等人不再重犯已往的过错，对他们就免于追究。李一心为公，对官员行使职责，可称为邦国中之司直了。汉光武帝有言：‘贵戚尚且缩起手以躲避二鲍。’即指整肃百官群僚，使他们各自谨慎于自己的职责。而宽容的恩典是不应该经常使用的！”司马睦是晋宣帝弟弟的儿子。


    【解析】我们大多数人都认为：组织内最正确地处理问题的方式是要一碗水端平，也就是公平；但在实际工作中，绝对正确的事情往往是落实不下去的。在同一个问题上对人的奖罚要做到绝对公平是很难的。'
  merge: -1
  img_proc: true
- pgno: 327
  md: '司隶校尉李惠投诉刘友、山涛、司马睦、武该等官僚贵戚侵占官田，请求皇帝处罚。司马炎的处理意见是：一，李惠敢碰权贵，奖励；二，侵占官田的，如刘友要严查严处；至于表亲山涛嘛，他已经知错了，就不追究了。


    譬如在现在的公司里面两个员工犯同样的错误，一个是业务骨干，一个是“板凳替换”，甚至是准备淘汰炒掉的。老板在处理的时候要考虑这些因素，如果有感情上的亲疏，也会交织到里头。如果这个公司的管理制度非常清晰，不容领导个人裁量，那么这两个员工会同错同罚；但如果领导有一定的裁判空间，他会保护轻判这个骨干，而对另外一个则会不客气。


    赏罚严明是一个国家和社会公平公正的大前提，但如果把这个权力交给了领导（本案例中是皇帝）一个人，这个问题就真是一个问题。比如说，山涛和司马炎有亲戚关系，以前有功劳，以后要重用，这都影响皇帝司马炎的公正处罚。另外，当时的政治环境也对具体事件的处理关系甚大，这个时候是强调安定团结和谐发展呢，还是强调严肃纲纪整顿作风呢？量刑的标准都不一样。政治家考虑的是整体的效果，也就是今天说的“讲政治”、“讲大局”，他们也知道公平的重要性，但他们不会坚持在每一件事情上都做到经得起挑剔的公平。


    司马炎当时强调的是宽松，对曹魏的班底全盘接收，对投降的刘禅都极尽拉拢。有官大家做，有财大家发，这个施政方针也不能算错，这是稳定政权的必须。


    司马炎站在皇帝必须“垂统后世”的高度，认为李惠是对的，所以奖励他；但他对山涛、司马睦的处理又有了其他具体的考量，所以没有处罚，只处罚刘友。其实为了表面的公平，象征性地处罚一下山涛等，又能怎么样呢？领导喜欢的干部重新复出还有困难吗？'
  merge: -1
  img_proc: true
- pgno: 328
  md: '一个人如果能事事公正，那他就不是人，是什么？是圣人。中国自古以来都期待着圣君，几千年的历史证明，不出圣君是绝对正常的，这种期待是幼稚可笑的，期待 的后果是相当严重的。


    我们总以为，领导或皇帝的利益是从全社会均沾而来的，所以他是全体人民的代表，为了自家江山的长治久安，他应该公平公正。而事实上，我们碰到了这么多领导或者皇帝，很少有这样历史责任的，皇帝不会是一个纯粹理性的“经济人”，他们也有感情，有亲疏，看用处。


    司马炎这个时期应该是比较清醒的，也是想有番作为的，历史把他推到这个高通 点和机会点，他是知道的。司马光的“政之大本，在于刑赏；刑赏不明，政何以成”！这样的责问，我们大部分人当然认为皇帝应该必须面对。


    最后，中国的社会制度的核心是伦理，伦理不是讲公平的，而是讲大家的资格、辈分、本事等等的综合，所以千万不要把公平植入脑子里面，看问题要从领导的角度来综合分析和考虑，这样看问题才能真正的客观、全面、透彻和有预见性！


    # 下属尾大不掉，对决同事、挑战领导，怎么办？


    【问题】公司有俩个部门，一个是行政主管，一个是市场主管，行政主管厚道些，市场主管心机较重，目前市场主管霸道的不允许行政主管参与他们部门的事情，但是自己却不停的挑行政主管工作中的瑕疵。对于我来说，两个人都要用，用老师的话说，就是斗而不破，请老师指点，我该怎么做？


    【解析】要解决问題，先要分析现状，然后找到问题的难点（往往是两难抉择），'
  merge: -1
  img_proc: true
- pgno: 329
  md: '之后盘点自己手中的工具，这样才能找到解决问题的办法。


    先看现状，为什么市场主管敢于挑其他部门的主管，一般都是因为前期他带领自己的小团队为公司建立了汗马功劳。在这个过程中，他打造了自己的班底，所以他有功劳有班底，自然就容易膨胀，所以他很容易觉得自己在公司内部比其他部门要重要。当然这个过程中，和领导的放任和纵容有关系的，因为开始的时候对于公司领导来说，只要出成绩，其他都不管。所以造成了有些得势部门的铁板一块，形成水泼不进，针扎不进的独立王国。


    这时候对于领导来说，是投鼠忌器。因为你处理他吧，怕他甩手不干；不处理他吧，他就很可能变本加厉，形势也会变的越来越严峻。


    在这样的情况下，本案例里面提问的领导角色就采取了扶持一派（行政部门）来打击另一派（市场部门），这样不用自己出马，随时还能调和矛盾，不至于失控，而实际上，领导内心是偏向于行政部门的主管，看他比较顺眼，所以说他厚道些。


    在这样的情况下，这个市场主管肯定知道行政主管的背后就是领导，所以通过对行政主管的挑刺来表达自己重要性！


    这样问题就浮现出来了：市场主管给领导的感觉就是桀骜不驯、难以驾驭。但是公司一时半会又少不了他，不然就可能损失很大。


    问题怎么解决，这个非常考验领导的政治智慧！


    因为是领导内心想解决这个隐患（虽然表面上是不会承认的，不然容易逼反对方），所以领导必须来盘点自己的手中的资源：


    # 一、人事权


    就是公司内部的人事安排，不要简单看这个安排，可以涉及到派系区分、'
