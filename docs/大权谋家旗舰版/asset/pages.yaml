- pgno: 111
  md: '也是威慑手段的运用。张良巧借四皓的力量，通过显示太子党的强大，打击了刘邦垂垂老矣之际的政治斗争的信心和决心，也使得刘邦在太子党强大的实力威假面前产生了
    无力驾驭局势的无可奈何的衰弱感。这样，张良运用间接的手段，经过巧妙地运筹和发力，一步步推动事态发展，最终达成直接目的-此谓可高手也。刘邦在张良的攻心战面前一路退败，不敢再言换太子之事了。


    说到这里，笔者要插几向话。


    《史记》中说张良师法黄石公。黄石公乃道家前辈，当年传给张良的为《黄石公三略》，也有人说是《太公兵法》，传说是当年姜太公的治国用兵的心术之一，由黄石公整理并传了下来。我们纵观留侯张良一生，发现此人虽然文弱无武，却心思细腻办事老到，并且能刚能柔，“柔”时卑躬屈膝无所不为，“刚”时摧枯拉朽当者必死。正如《厚黑学》中说的，他卑鄙发处，发而无忌。《太公兵法》是一部具有高深智慧的书，张良从中学会了许多常人所不具备的谋略。后世流传的
    《三略》一书，有人疑为杜撰，可是其中也蕴含着不少经典的谋略思想。兹摘录几句以飨读者：


    “柔能制刚，弱能制强。柔者德也，刚者贼也，弱者人之所助，强者怨之所攻。柔有所设，刚有所施，弱有所用，刚有所加。兼此四者而制其宜。”这是柔弱之谋的总论。大家都羡慕强大和刚劲的好处，却不知柔和与弱小的妙用；都知道高高在上叱咤风云的风光，却不知道默默无闻陡然发力的可怕。在权术上，韬光养晦，要比风光无限更为有用；藏锋露拙，要比才华横溢受人爱戴。


    “莫不贪强，鲜能守微，若能守微，乃保其生。圣人存之，动应时机，舒之弥四海，卷之不盈杯，居之不以室宅，守之不以城郭。藏之胸臆，而敌国服。有这样一种东西，明白了之后，看似微弱，实际强大。大家都很少能够懂得这个'
  merge: -1
  img_proc: true
- pgno: 112
  md: '道理。懂得了这个道理，才能够保存自己。而且，懂得了之后，可以适应事物的干变万化。以之席卷天下可以，以之独善其身可以，以之其居家过日可以，以之其保命全真亦可以。这个东西，伸展开来弥绝四海，蟑缩之去大不盈杯。不用房屋安置自存在，不用城郭保护却长存。看到此时，读者应能想起当年读《三国演义》中青梅煮酒论英雄之时曹操刘备关乎“龙”的一段对话。曹操对刘备说：“龙能大能小，能升能隐；大则兴云吐物，小则隐介藏形；升则飞腾于宇宙之间，隐则潜伏于碧波之内。方今春深，犹人得志而纵横四海。龙之为物，可比世之英雄。”“夫英雄者，胸怀大志，腹有良谋，有保藏宇宙之机，吞吐天地之志。”大家都知道，英雄如龙，见首而不见尾，藏于九地而动于九天；达则横绝四海飞龙在天，塞则深藏不漏潜龙在渊。《易经》乾卦对“潜龙勿用”和“飞龙在天”及“亢龙有悔”等一系列状态作了深刻阐发，其中即蕴含着“舒之弥四海，卷之不盈杯”的道理。在竞争中，如果能够达到收发自如、挥洒如意的境地，就已经逼近龙的境界了。果真那样，也就能横行无敌了。


    “能刚能柔，其国弥光；能弱能强，其国弥彰。纯柔纯弱，其国必削。纯刚纯强，其国必亡。”-这一段话，就是张良一直以来辅导刘邦柔弱立身保存实力的理论根据，也是当刘邦项羽相持不下在荥阳签订合约后，张良却不顾道义力劝刘备务必追击项羽置其于死地的理论来源。我们今天读到这段话，方知道古人的智慧实在不容小觑，从而也就知道，在纷繁复杂险象环生的国际战略格局中，究竟该如何实现国家之战咯崛起，究竟该采用何种智慧确保国泰民安百姓无虞了。


    上文说过，有人认为《太公兵法》已经失传，现存的版本是后人杜撰。这'
  merge: -1
