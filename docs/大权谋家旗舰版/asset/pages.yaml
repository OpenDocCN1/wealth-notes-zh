- pgno: 263
  md: '这样和对方干上的话，那不是和下属就是同一个档次了，传出去遭人耻笑，所以他沉默不语，也没有发怒。我们说，发怒是无能的体现，如果你有办法治得了对方，直接做就可以了，用不着发怒，而且你的发怒还会让对方加强戒备，不利于你以后的出招。


    而对于领导王 şə 来说，欧阳修肯定不能留在自己身边了，但是怎么处理他，还不要让自己溅一身血，那是需要有些智慧的，不过这些都难不倒王曙，因为他既然能做到高位，头脑和手里的资源都是一流的，所以他推荐了欧阳修他们去了馆阁编书，外人不懂的看到这个安排，肯定觉得职位和人才非常匹配。不过从权力的角度看，他是被弃用，被边缘化了（有成语说“束之高阁”），不过舆论还认为王曙做的好，给与很高的评价，不得不说，王曙这手操作非常成功。


    当然本案例欧阳修的遭遇还不算太差，历史上，还有过给你陷阱任务，安排你到脾气暴躁的上级那里去，借对方的刀把你干掉等等。


    职场上，不管你多有才，只要你忤逆领导和权力，那领导和权力一定会想方设法来收拾你，让你痛不欲生，所以我们顺从权力，除了是升职的需要，更是保护自己的需要。通过本案例，你看懂了吗？


    # 没人会告诉你的职场权谋：面对大人物的拉拢，小人物怎么应对？


    相信本公众号的读者大多数都是小人物，而且都应该是 Deport 有才的小人物。如果这个才干得到大人物的认可，大人物想要拉拢你，在这个时候，我们往往缺乏'
