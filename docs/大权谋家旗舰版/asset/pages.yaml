- pgno: 74
  md: '杀猪大哥何进。这何进在灵帝死前由于妹妹的关系得到重用。老皇帝死了，小皇帝年幼，权力出现了真空，急需有人填补，何后自然就要让何进来帮忙。这就如同小妹被人欺负了，大哥要出马砍回来是一个道理。更何况对大哥来说，这个小妹贵为太后，只要搞定小妹，高官厚禄、封妻荫子不在话下。有了功名富贵作饵，何大哥当然要挺身而出，甘为‘何后母子保驾。


    抛开亲情的表象不说，我们用冷静的眼光来审视这一事件的本质：何后母子初登大位，母弱儿孱，无力控制大局，必须得有人支持、帮助和维护。因此，用亲缘关系控制何进，使其为马前卒，这是一个理性博弈的结果。从利益角度分析，何后这一举动显然符合利益成本计算法：自己娘家人，肯定能很好地听自己指挥，为自己坐江山效劳。假如江山被别人夺走，第一个死的是何后母子，第三个死的就是何进。因此，太后命何进“参录尚书事”，以供驱策。


    这何进由于妹妹而掌大权，妥人之恩不相忘，何况是自己的妹妹，更应该努力维护，拼命效力。果然，有一次何太后与董太后在后宫一次宴会上吵起来之后，何进闻讯赶来，把董后驱逐并暗杀，把国舅董重一家老幼良贱尽行杀害。此后，董后一支因着与何后的一次吵架而灭亡了。再后来，何进想杀太监张让等，结果张让做了何后的工作，何后把何进叫来恩威并施，人情人理说了一大套，何进只好乖乖落实上级指示，不敢再造次了。


    可惜的是，何后虽然运用亲情手段驾驭何进为其帮手参赞政务，然而那何进毕竟屠户出身，最终坏了何后的大事。目前虽无证据表明何进作屠户时沾染了职业病，可事实上何进头大无脑、其蠢如猪。他不听朝中谋士反复劝告，无视一帮太监政敌如狼似虎地觎觑他，竟麻痹大意毫无设防，一意孤行走上末路。历史反复证明，太监虽然比常人少了一样欢喜宝贝，却又比常人多了一副恶毒'
