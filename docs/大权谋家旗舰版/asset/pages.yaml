- pgno: 294
  md: '么用，归根结底，还是要看你怎么站队！


    由此我们不难看出沙瑞金通过前期的调研工作，已经编织了一张网，是挖掘各种现任高官（还是自己下属）的信息的大网，有选择性地利用这些信息，对相关官员进行有目的的敲打，能拉拢的拉拢（对易学习的超常规提拔），能分化的分化（对李达康的敲打），这样就能为自己的权力找到根基，这样就能把政治资源和力量对准真正的对手。


    这时候，你觉得李达康还有选择吗？形格势禁，唯一可行的办法就是站沙瑞金的队。那李达康站沙瑞金的队的话，就需要投名状（以李达康的背景，没有投名状沙瑞金不可能相信，敲打还要继续），那就是把以前赵立春和高育良的事情毫无保留地全部揭露出来，给沙瑞金递刀子，在开会时候全力支持沙瑞金！


    剧中，沙瑞金和李达康在私下也交流过几次，从李达康的角度看，就是本文的标题：新任领导私下找你谈话，怎么应对？李达康看到新任的上级，既有中央的支持，也有政治智慧，所以向新领导靠拢无疑是最佳选择。


    由此可见，新任领导找老员工谈话，更多的情况是，他已经掌握了你（尤其是副职）的很多信息，通过和你的谈话（往往是挟知而问），通过你的回答，看出你是不是对我说实话，是不是有向我靠拢的心理趋向；如果和我离心离德，那就被列入不可用的范畴直接打入冷宫；如果向我靠拢，那就在给你机会，看你表现，所以做下属的，在这时候往往是职场乃至人生抉择的关键时刻，不然至少你在新任领导的手下是没有机会的。


    领导想要弄清楚的是：谁是我的朋友，谁是我的敌人，朋友拉拢，敌人打击；老员工何去何从，其实不难选择，怎么应对，其实没得选择！'
