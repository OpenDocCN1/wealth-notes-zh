  md: '人 “杀之无名” 会坏了自己大事，担心自己因为这个无赖而丧失了出人头地的机会。他的害怕和担心在彼时是一种明智，但等到后来刘项相持的时候，就演变成了一种愚笨的观望——他不是没有能力独扛大旗、三分天下，而是畏首畏尾、瞻前顾后（当然刘邦对他的感情操控也起到了效果）。刘邦当然也察觉到这一点，他抓住韩信不敢贸然反叛的弱点，一方面高举义旗示天下，一方面刻意笼络韩信诱以
    “裂土封王”、收买操控，这样，韩信才回到刘邦这条破船上来。等到后来韩信被吕后抓住受诛的时候，他才哀叹后悔没听蒯通之言。没有野心、没有勇气反刘自立的韩信，结果反被吕后剐成肉酱。我们现在推测，韩信的结局其实也是源自他人性中不敢担当的弱点以及他畏惧出头、不具霸气的缺陷。反过来，我们也就看清楚了，人性中
    “恐惧” 的天性在竞争舞台中的种种表演，同时，这也为我们运用 “威慑” 手段，以诱发对方恐惧为途径实施操控提供了一定意义上的借鉴。


    以威慑手段操控对手实在是一种非常重要的操控手段。前人讲的不战而屈人之兵，从柔的角度来理解，当然就是要以亲和力消除矛盾；从刚的角度来理解，就是要用杀伐力来吓阻对手。如果能够在矛盾的暴露和激发状态之前有效实施威慑手段，那么，就能够在相当大的程度上限制矛盾的激化，从而可避免矛盾锋相见的惨剧。


    既然威慑手段如此重要，接下来，我们分析什么是威慑，以及在竞争中如何实施威慑手段操控对手。


    # （1）高级心理战威慑


    总而言之，威慑就是 “吓阻” 的意思。“威” 是 “威胁”，“慑” 是 “慑止”，说穿了，就是通过威胁和恐吓来吓阻对方，使得别人不得不做某件事或者不敢'
  merge: -1
  img_proc: true
- pgno: 109
  md: '去做某件事。


    威慑这个手段其实并不难理解，因为大家在日常生活中，都免不了受到威慑。比如，儿时父母威慑说：“如果不听话，就要打屁股”；长大了，老师威慑说：“如果学不好，就没好工作”；再大了，领导威慑说：“如果不跟着我，就没好前途。”因此说，“威慑”是一种大家都习以为常的现象。说白了，就是老百姓常说的“吓唬”之意。在操控行为中，“威慑”本质上是一种心理战。采用威慑手段，虽然实施主体并未按其宣称的可怕行动诉诸实施，却又能通过提示对手以灾难性后果，使对方心理受到极大压迫和震慑，并使受控者觉察到：他们的反抗，就如同正在孵小鸡的野鸡搏杀猎人，亦如同正在哺乳的山羊攻击老虎一样，虽然都有拼命的决心，却只有必然丧身的结局。所以，如若反抗，绝没有好下场。如此一来，对手做任何事之前都会经过小心的算计，不可能明目张胆毫无顾虑，手是，人们就在一定程度上操控了对方的思想和行动。这就是威慑操控的一般过程。


    下面，我们来看看王莽杀鸡儆猴的案例。


    王莽改制后，天下比较混乱，为了有效操控时局，王莽决定整肃朝廷，特别是整顿朝中大官，以此达成社会安定、法纪畅行的局面。但是朝中臣大臣官高爵重，目无法纪，不可一世。于是王莽决心打击压制他们的气焰，其手段则是重点突破、杀鸡做猴。


    首先，颁布命令，表明心迹。王莽下令，凡报告权臣过失的一律受到提拨。有些人如孔 themselves、费兴等人，秉笔直书揭发权臣不法行迹，都一一受到提拨。如此一来，诸权臣人心惶惶，局面为之一肃。


    其次，重点突破，以点带面。王莽抓住了两个事由，给当时的重臣太傅平晏'
  merge: -1
