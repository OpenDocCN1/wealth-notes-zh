  md: '可以想象，等到夏言丢官罢职之后，那门可罗雀、鬼都不上门的凄凉冷落必然会使他吐血喷天，对严嵩大骂不已；会对自己当年有眼无珠，被小雁啄瞎了眼后悔不迭；同时，也就会对友情特别是竞争场上的友情有了全新的认识。


    后来，等到嘉靖帝觉察到严嵩有点专权，于是把夏言招回来，而且位在严嵩之上。


    这夏言此次回来，再也不如当年一般幼稚；在对严嵩小心提防的同时，独揽大权，把严嵩挤到了一边。严嵩想要再次利用友情手段操控夏言，看来是不行啦。


    在明代，严嵩是头号大奸臣臣。他在明嘉靖时期把持朝政数十年，甚至把儿子严世蕃也拉进内阁都令人无话可说。可以说，严嵩的政治斗争功力在当时是天下一流的，因此，他对付夏言应该不在话下。严嵩见夏言气势汹汹来者不善，决定先行退让一步。他一边施展手段拉拢夏言，一边积蓄力量等待反击。夏言经历了一次惨败，他根本不会再被严嵩迷惑了。对严嵩来说，既然不能玩弄夏言于股掌，剩下的当然就是兵锋相见、你死我活了。


    史书记载，为了倒夏，严嵩采取了以下步骤：


    其一，不断依靠自己侍奉皇帝的本事，大吹其牛，大写“青词”，把皇帝吹捧到天上；同时，抓住皇帝喜好玄学的特点，多多结交得道“高人”，以固宠培爱，立于不败之地。


    其二，利用自己还受皇帝宠爱而高居上位的机会，暗地收买贪财好势的太监，让他们在皇帝身边多说自己的好话；同时，把夏言的一些毛病反复向皇帝灌输。这一招，保证了严嵩在这场斗争中获得了不对称信息优势。


    这两招下来，严嵩已经在这场斗争中占据了稳固的防御优势。'
