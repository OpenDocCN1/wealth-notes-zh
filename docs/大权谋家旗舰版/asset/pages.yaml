  md: '当然，恕戒手段分为肉体和精神两种方法，不过是笔者大略的一个划分。具体的 方法，有经济惩罚、名誉短低和政治除名等方式。这些方法往往是交织在 一起的。其中，以政治恕戒最为严厉，比如开除党籍，就如同剥夺了对方的政
    治生命；以经济惩罚为最终指向- 人在竞争中的一切都是基于利益的；名誉贬 低则是连接政治和经济惩罚必不可少的手段。要惩罚对方，必须在名誉上使其 丧失合法地位，然后，才能够踏上一万只脚。不然，对于一个一直高高在上的
    人，突然把他揪翻在地，人们一下子是无法接受的，也显示出掌权者水平的低 劣。


    关于恕戒操控，不到万不得已，不能轻易使用。精神恕我还偶尔可以运用一 下，肉体恕戒则是一种比较极端的办法了。对于普通大众来说，一是不具备利 用肉体恕戒的条件，另外，如果进行肉体恕我的话，弄不好，将带来一生一世
    的麻烦。当年庞涓把孙膑给剔了，一直过了十多年，孙膑还是把庞涓给弄死了。 可见，如果要动手，就一不做二不休，斩草除根；如果不做，那么，就绝对不 要使用这种激烈手段，从而给自己埋下祸患。


    从理论上讲，恕戒，主要是上级对下级、强势对弱势的一种操控手段。如同 筭络和赏赐一样，恕戒手段运用在驾驭臣僚场合中，往往会起到意想不到的效 果。所以，恕戒方式是上级对下级的一种必不可少的方法。一旦上级与下级发
    生了严重的意见分歧，或者利益冲突，下级拒绝执行上级的意图；那么，则必 然要对下属进行惩罚，不如此，则无法贯彻上级的意图。


    从时间角度来看，恕戒，不仅包括事后的操控手段，也包括预先的恕戒手段。 比如，历代君主都素来忌惮过于能干、富有权势的功臣，特别是那些身居高位 不知收敛的臣大臣，往往会遭到君主的炉忌。一般来讲，那些锋芒毕露的臣大'
