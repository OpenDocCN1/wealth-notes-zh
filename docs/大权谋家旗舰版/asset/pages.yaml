  md: '又觉得很不爽（觉得人家都不如自己，最后变成吃不到葡萄说葡萄酸的感觉），那到底要不要邀功，邀功用什么样的姿势最有效？


    在《雍正王朝》的最后，有一个小片段，宝亲王（后来 的乾隆皇帝）在两江巡视，雍正得到有人要害死宝亲王信息的时候，急招图里琛到两江总督李卫那里去保护宝亲王安危。图里琛从领命后，一路马不停蹄奔向两江总督府，这里
    面，我们值得注意的是，图里琛进入总督府的时候，是大步流星、气定神闲，不过他在见到坐在大堂等候的李卫时候却表现的火急火燎，一下拿起桌上的茶杯（李卫刚会面的人，已经离开）直接喝起来。在通报完事情之后，李卫站起来准备去布置工作之时直接拿起李卫的茶杯又一饮而尽。这个前后的反差之大，体现出图里琛对邀功请赏的门门道道非常精通！


    这里面有个背景要交代一下，李卫，出身寒微，不识字（古代识字不识字往往是区别官民身份的重要标志），偶然被雍正从难民堆里面发掘出来，之后靠着对雍正的忠心耿耿一路被提拔成帝国重镇两江的总督。这里面我们一定要注意的是，李卫不识字，有办事能力，当然他最重要的是对雍正的忠心，是雍正统治集团里面的核心人物。


    从李卫没有出门迎接图里琛看，李卫不管是从心理上还是客观上、还是在雍正的心目中的地位都比图里琛要高，不然朝廷钦差的到来，巴结还来不及，恨不得出城十里相迎。


    接下来我们进入正题，图里琛进入总督府，气定神闲，大步流星，让外人看不出有什么紧急和重要的事情。这个就是做大事者应该有的素质，不然容易产生各种谣言，人多嘴杂，对要办的事情非常不利。


    然后我们必须注意到的是，他进入内堂见到李卫的时候，立即改变了神情，'
  merge: -1
  img_proc: true
- pgno: 239
  md: '变成了一副火急火燎，急火攻心的样子，并直接一口气喝掉了不知道哪位喝过的茶水。这个神情和动作的配合非常绝妙。他真正是抓住了雍正布置任务的魂，就是要快，事情紧急，他通过了他的神情和动作表现了出来，同时在通报完事情的时候，直接拿过李卫喝过的茶杯继续一饮而尽，从这些神态和动作表现出自己对这次差使的重视。


    当然当李卫听说这个事情的时候，觉得这也是向未来的主人邀功的最佳机会，因为当时雍正似乎体力不支，很可能也没几年命了，如果现在能完美为未来主人立下救主大功，自己的官位和荣华在可预见的将来可保无忧！


    我们前面说，李卫对雍正的忠心是他一路高升的法宝，那忠心怎么体现，就是事无巨细要详细汇报，图里琛的一举一动肯定会被李卫详细汇报给雍正，图里琛绕了一个大圈，变相向雍正邀功，邀功于无形。因为如果你直接在领导面前表现邀功，很容易让领导反感，还容易让领导身边人觉得你太谄媚，反而可能对自己不利。


    我们要记得，最好的邀功手法并不是在领导面前的直接表现，而是迂回通过在领导的心腹面前用神情和动作进行配合表演，这样用他人之口在里面面前勾画出自己对工作尽心尽责、忠心耿耿的形象。而对于领导来说，最
    constant 多派眼线，通过各个不同的眼线汇报的信息进行综合评价，才不至于被下属的表演所迷惑。


    # 你为领导立过汗马功劳，是否就能随心所欲？


    【资治通鉴原文】上在东宫，以李辅国专横，心甚不平，及嗣位，以辅国有杀'
  merge: -1
