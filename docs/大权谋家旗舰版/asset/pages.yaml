  md: '十六计” 中叫 “借尸还魂”，用在政治斗争和军事斗争中，能够假借别人的势力来达成威慑他人的目的。其三乃借 “地” 之势。比如，“风声鹤唳”这一典故，说的就是自然之物所构成的威慑效应。总之，假借他势，粗略可以分为借天、借地、借人之势，说的都是借助外力达成威慑。


    综上所达，威慑实施的基本方法是：有实力，展示实力；没实力，假借实力。强者要想方设法把自己的实力展示出来，以此达成威慑效果；弱者要想方设法隐藏实力，以免实力不强的真相被对手探知，并且，要竭力避开自己实力
    “不强” 的弱点，通过 “虚张声势” 和 “借力示形” 而达成威慑。


    以上，我们穿插案例，对威慑操控的理论部分进行了交代。下面，我们进入实战环节。


    当年沙丘政变，赵高说服李斯的办法，用的就是威慑法。大家都知道，李斯和赵高分别是中国政坛上不同类型的绝顶高手之代表，笔者私下把李斯划为业务派教主（当然也大施阴谋，害死过韩非），而赵高是行政派教主（当然也刀笔纯熟、业务精纯）。这两大高手，作为权力格局中不同帮派的两大领袖，在帝王派教主秦始皇的带领下，上演了一幕幕政治斗争的好戏。而且，李斯和赵高开创了中国权力史上的先河——李斯用才华和实干帮助始皇帝打天下，赵高用阴谋和诡计为自己独揽大权作贡献。我们把赵高推崇为一代奸臣的祖师爷和阴谋家始祖绝不为过，他的
    “指鹿为马”，已经逼近甚至突破了人性和道德的底线，把主子胡亥搞得头晕脑涨甚至噩梦连连。而我们反观李斯，则是聪明绝顶、才华横溢、劳苦功高的代表。他帮助秦始皇打江山治天下，设郡县，书同文，车同轨，奠定了秦朝以降中国政权的基本组织模式，为中国文明的昌盛和延续作出了不可磨灭的贡献。因此，这二人的巅峰对决，不得不吸引人们的眼'
