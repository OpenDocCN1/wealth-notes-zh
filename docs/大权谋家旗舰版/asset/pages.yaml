  md: '岩石向沙瑞金示好，却反而遭到了陈岩石的打击。在这样的情况下，对于投诚过来的重权在握的官员，反而给予打击，那其他人一看，那就不敢再过来投诚。这样的话，陈岩石其实也就慢慢丧失了自己的权力基础，因为自己没有人支撑了。


    画面来到第三个场景，为什么陈岩石义无反顾地站在群众一边，以至于被群众扶持，这位绑架者也没有因为你帮过我，就对你手下留情，反而越逼越紧呢？因为群众都是盲目的，短视的，情绪化的，如果官员们受群众的影响，看似代表了他们的利益，往往其实不仅是害了自己，也害了你想要帮助的群众。从组织角度看，陈岩石是无视组织和法律的决定，是典型的无组织无纪律之举，如果陈岩石的生命就结束在绑架者的手里，那才是最具戏剧性的，感觉就是农夫与蛇的故事再版。


    从陈岩石的角度看，因为他做的事情，不断地得罪汉东的各类型的干部，包括自己的下属，在权力场非常失意，所以他把心思用到了群众身上，希望以人民的名义的方式来证明自己的官场价值。


    所以最终的场面，当陈岩石过世，只能丧事从简。因为对于他想帮助的群众，群众没觉得他好（从绑架过程来看，正因为这点，后来陈岩石深受打击一蹶不振），而更是广泛得罪了汉东的干部队伍，丧事必然就冷冷清清；有人说，不是还有沙瑞金么？说的没错。在当时的条件下，沙瑞金和陈岩石的努力方向是一致的，不过当沙瑞金稳住汉东的局面，真正掌握汉东的权力后，而陈岩石做事还是老的一套，沙瑞金再怎么看陈岩石，这个很难说了。


    有人说陈岩石非常清正廉洁，其实也未必，因为他女儿陈阳毕业后直接进入北京国家直属单位工作，而儿子陈海已经是汉东检察院反贪局局长，这是连有'
