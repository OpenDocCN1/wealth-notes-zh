  md: '的修复，关系修复又有许多步骤。今天只讲第一个，我们来看，吴过是怎么做

    的，对我们又有什么启发？


    吴过接着说：“今天晚上，我想和我爱人一起请你们全家一起庆贺一下”；

    梁局长平淡地说：“大家都挺忙的，再说了，有什么好庆祝的？”吴过又热情

    地说“当然得庆贺了，这么大的事，一辈子要碰到一次两次就烧高香了。”梁

    志远拿起烟，吴过立即拿过打火机准备帮助局长点火，梁志远挥了挥手，吴过

    就把火机放下了。吴过接着说“我和我爱人已经把牛吹出去了，肯定我是卫生

    局第一个请梁局长吃饭庆祝的人”。不过梁志远还是轻飘飘的说：“再说吧。”


    到这里，吴过公关基本失败，虽然他在这里是失败的，但是他用的方法未必是不对的。为什么这么说呢？我们来看吴过看似卑微谄媚背后的权谋套路。


    吴过提出要请梁局长吃饭，如果单独请的话，在当下这个时机是不合适的，所以搬出了自己的家人，原因如下：


    # 1、加重自己邀请的分量


    如果自己单独请，在现在的关系情况之下，显然是没有成算的，而如果你纠结单位里面的一波人来邀请的话，就显得在单位里面拉帮结派，似乎有架空领导的嫌疑。除去这两种方法，那
