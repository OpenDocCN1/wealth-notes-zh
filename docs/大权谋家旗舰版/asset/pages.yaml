- pgno: 114
  md: '为真宗祈诗。八大王赵元俨，平素富有权势，为人心机深沉。借着真宗病重，八王以探视皇上为由也留在宫中，多日不出。当时太子年幼，李迪等人担心真宗一旦病危，赵元俨可能利用混乱局势浑水摸鱼危害太子、倾覆江山，于是就想把赵王请出宫中。可是，斗争是残酷无情的，皇帝宝座又极端诱人。从理论上讲，如果赵王真要觊觎帝位，他绝无可能轻易放手，因此，用文的方法不好解决这个问题。那么，究竟如何支开八大王呢？大家一时无策。


    笔者常说，当竞争到了白热化时刻，你死我活就要见出分晓之际。长于智谋者胜，精于算计者胜，熟于谋略者胜，这是一个铁律。正当大家都无计可施之时，一日，李迪偶见有人捧着一盅水进官，问后方知是八王要的水。李迪听后，立刻生出一计，当即拿起书桌上的毛笔，蘸上墨，把盅中水搅得墨黑，然后叮嘱了来人一番应对之词，命此人端给八大王。赵元俨一见，大吃一惊，认为定是有人在自己的水中下了毒。转念一想此时正值时局动荡之际，留在宫中随时可能出现意外，反倒不如自己的王府安全，于是立马出宫。


    李迪利用人性的“恐惧”弱点，巧妙设局，通过一个小的细节，对八大王内心造成了严重的威慑。李迪很清楚八大王的心理：如果他真想有什么动作，对于他来说，为夺江山失了性命，这种赌本的买卖显然是划不来的。因此，只要从局面上去造成威胁于他的态势，八王必然立刻从对王冠的狂热中冷静下来考虑自己的安全问题。果然，李迪的计谋误导了八王，使八王错以为自己陷入潜在的危险之中。靠着这种威慑手段，李迪成功操控了八王，让其不由自主地按照自己规划的方向行事。这是一个运用威慑操控赢得胜利的经典案例。


    需要指出的一点是，在实施威慑操控的时候，所有的威慑都要立足于“时间差”，也就是要通过强调现实与未来的时间序列上的不同而设谋。威慑手段强'
