- pgno: 243
  md: '秦皇汉武这样有作为的皇帝的太子尤其难。强将手下无弱兵，但往往是强势的皇帝之下，太子很难再强势，太子面对的是皇帝，而且是心态不断变化中的皇帝，心理捉摸不定的皇帝，既要表现自己有治国的才能，又不能表现得过分，不能抢了老头子的风头；既要表现出深孚众望，又不能体现出已经有自己的组织和班底，更不能提前组阁。反正是每件事上，不能不表态，又不能表错态，长期在这种战战兢兢的状态下，性格最后都会变成“仁恕温谨”。汉武帝嫌儿子不像自己，反过来看，如果太子刘据和他一样，也是好大喜功，敢作敢为，用不了几天，父子还不打起来？


    做太子安全上垒的，有几种情况：一是独子，舍我其谁。比如咸丰帝死后就是同治，没得选；二是前任皇帝驾崩之时，太子年龄还小，性格还未完全形成或表露出来，即使有些不称心如意，孩子还小，也能原谅；三是前任皇帝也曾委委屈屈做过太子，将心比心，不那么苛责，没有大的过错，也就安全上岗了。


    太子难做，难就难在父皇不仅自己有作为，眼界高，而且身体倍儿好，寿命倍儿长，太子要久经考验，搞不好这个“久经”就是几十年。刘据做太子做了三十四年，另一个在位时间长的是康熙皇帝，他的太子胤初，在储君之位前后两次一共待了三十八年，当三十多年的接班人，其实就是夹着尾巴做三十多年的靶标，让别人攻击，这不是一个好绉的活儿。


    权力是皇帝的，也是太子的，但是皇帝不给，太子不能要更不能抢，甚至连想要的欲望都不能表现出来，如果有表现，就是想让我死。这是帝王到晚年的普遍的心境。臣民们高呼万岁已经五十年了，时间一长，是不是他老人家信以为真了，于是，不愿意承认生老病死的自然规律，把自己身体日渐衰弱归咎于他人的诅咒，然后再从自己死了谁的利益最大反推元凶，可伶的太子就这样被'
  merge: -1
  img_proc: true
- pgno: 244
  md: '推到了他老爹荒唐谬锍的终点。


    # 老领导调走了。你作为老领导心腹，面对新领导，怎么办？


    最近有几位朋友问，我作为老领导的心腹，而老领导年龄到了，被调往清水衙门了，自己作为老领导的心腹，新领导到来之后，感觉自己很尴尬，新领导很是不待见自己，有被边缘化的趋势，怎么办？


    我们要知道，如果是老领导的心腹，一般新领导是不敢用的，而且是被打压的对象，因为这部分人是既得利益群体（占据重要岗位），对新领导上位抓权很不利，所以新领导需要踢开他们，尽量把自己人安排到这些重要岗位上，这样新领导的位置才能坐得稳。


    那这不是意味着老领导心腹群体就只能束手待毙了呢？


    答案是 No!


    具体怎么做才能在新领导的下谋的一席之地呢？


    # 一、和老领导切割关系


    一般而言，我们在内心可能都很难接受这样的做法，而且外界也会认为你见风使舵，没有骨气，给自己不好的舆论形象，所以必须要进行一番动作，让自己在道德角度能站得住脚。具体做法，你可以预先请老领导吃饭讨教，为不能追随老领导痛心疾首，老领导一定会给你支招，因为他们能到领导位置，往往都会为别人考虑，尤其是以前追随自己的心腹，所以他一般就会说，以后你少来找我了，只要有这个心意就够了，你现在要摆正位置，调整姿态，向新领导靠拢，争取得获得他的信任和重用，否则你必然被边缘化。其实在《人民的名义》'
  merge: -1
  img_proc: true
- pgno: 245
  md: '里面，李达康作为前任领导的秘书出身，就是见风使舵得快，牢牢抓住了现在的位置。而且你这样做了，相当于就得到了老领导的首肯，自己一没有道德压力，二也卸掉了舆论压力。


    # 二、立即转变角色、调整心态


    对于老领导心腹来说，这个转变应该问题不大，因为既然你作为老领导的心腹，多少有点权谋水平，肯定懂得角色转变和心态调整。这时候最重要的是，克服路径依赖，仔细研究新领导的做法风格，观察新领导的性格脾气，掌握新领导的喜好，多请示，少做主，对原来的做法进行正反剖析（你具有近水楼台的优势），让新领导来权衡利弊，尊重新领导的权力，切忌和新领导顶撞，绝对不能说：以前就是这么做的，这样做很好之类的话。


    # 三、获得新领导的信任和提携


    新领导上位，一般都是两眼一抹黑的，如果你及时靠近他，给他提供当下每个事情发生的背景材料，善于提供多个选项来让他做选择，切忌自己做主，因为这样会侵蚀新领导的权力。还要善于推功揽过，事情有了好的结果，虽然事情都是你的建议，也是你在干，但是一定要说是领导的英明决策；事情发生了差错，这时候一定要把过错归结在自身，切忌把错误归结到领导身上，不要认为领导不知道，而因为你纾过了，你反而在领导的心目中有功劳了，新领导会在内心感激你的。


    你只要做好以上三点，虽然你是前朝老臣，但是可以做到始终屹立不倒，值得一提的是，以上是次第进行的，不要跳着做，要一步步来，目标是获取新领导的信任，至于以后新领导对你的提携，那就要看以后的发展了。'
  merge: -1
  img_proc: true
- pgno: 246
  md: '# 面对领导的当众批评，自己感觉很委屈，反击还是顺从？


    职场上经常会发生这样的事情，一个下属，因为所负责的事情出现了问题，加上别人的挑拨离间，让领导在开会的时候大发雷霆，当众痛骂了这个下属，下属感觉很委屈，问应该怎么办？


    面对这样的情况，这个下属无非是三种应对方式，我们通过仔细分析看看三种不同应对方式的利弊：


    # 一、当众回怼


    有些下属脾气比较火爆，受不了领导的当众批评，很容易就和领导直接干起来，这里面说不定有职场权谋家先在领导那吹风和挑拨。然后在这个下属这里说你做的对的，让你觉得自己理直气壮，加上你的脾气，就很容易和领导干上，这就是职场权谋家最喜闻乐见的场面，而这个脾气直的下属就这样被利用了。


    就算你和领导的回怼不是有人拱火的，你当众回怼已经超过了事情的范畴，而是触犯到了权力的禁忌，领导如果服输，那他以后还怎么管理其他人，所以你的走人是必然的结果。


    # 二、沉默不语


    面对领导的当众批评，更多的人是沉默不言。在下属看来，我觉得我没错，只是为了照顾你的权力面子，所以我不能反驳，而内心觉得你的批评是不对的，所以我采取了沉默不语的态度。


    不过对于领导来说，你的沉默不言，就是对领导权力的一种软抵制，让他也会觉得非常不爽，他的权力也无法贯彻，所以日后他还是要对你进行其他的处理。


    # 三、承认错误'
  merge: -1
  img_proc: true
- pgno: 247
  md: '承认错误是下属最难的一种表现方式，一个问题的产生往往都是多方面的原因，而我们都不想承认自己有问题，因为承认错误就意味着让自己丢面子，以后会让别人看不起。不过当众承认错误的方式其实是顺从了权力，让领导觉得他是对的，内心往往是感谢你的，因为至少你让他能下得了台。承认错误的方式可以说“领导说的对，我马上整改。”记得当众一定要顺从，不管你心里是怎么想。


    有人就要说了，如果领导冤枉我了咋办？如果真觉得自己没有问题，那就要在私下的场合，或者通过领导身边人，向领导把问题产生的来龙去脉说清楚，这时候注意不要主观，尽量在客观的角度表达，让领导自己做判断，慢慢领导也是会转变过来的。


    所以，就算你被领导当众批评了，你也不用担心，用上最后一招的时候，问题都会演化成对你有利的样子。当然我们还是要注意，尽量提前通过各种方式获得领导的认可，如果直接接触领导有困难，那就打迂回，从领导信任的身边人着手，这样按部就班，脚踏实地，进步会非常明显。


    # 下属给领导提意见？风险很大！怎么规避风险？


    【续资治通鉴原文】甲寅，有芝生天安殿柱，召辅臣观之，退，奉表称贺。乙卯，诏群臣就观，监察御史开封鞠詠言：“陛下新即位，河决未塞，霖雨害稼，宜思所以应灾变。臣愿陛下以擢进忠良、退斥邪佞为国宝，以训劝兵农、丰积仓廪为天瑞，草木之怪，何足尚哉！”


    【翻译】甲寅，北宋天安殿殿柱上长出芝草，宋仁宗召集宰相们参观，宰相们'
