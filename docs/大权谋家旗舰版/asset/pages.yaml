- pgno: 180
  md: '的人：通过对方的朋友来了解对方的为人。所谓“物以类聚，人以群分”，说的就是具有相同脾气秉性兴趣爱好的人往往能够相处融洽。如此，则可以从相处融洽的人们中间反推其共质性，从而识别其人的真面目。


    汉光武帝刘秀在打天下的時候，非常重视招揽人才。他不仅身边聚集了大批人才，而且他礼贤下士，同众人相处融洽，大家都说他的好话。同时，刘秀的士兵与其他军队的残暴截然不同，很少危害百姓。这样，刘秀的名声就广泛传开。当时，有个叫隗嚣的人，想在刘秀和另一个割据势力公孙述之间选择一个投靠，就派马援去观察公孙述。马援同公孙述是同乡且关系一直很好。他来到成都见公孙述，原以为公孙述肯定会像过去一样善待自己。没想到公孙述对马援并不热情。随后，公孙述带着马援去祭祀，所用的物品精致，百官列以盛大，但公孙述对人的态度却很傲慢。


    后来，公孙述准备给马援封爵，任命他为大将军。马援的宾客都主张留下来，但是马援对他们说：如今天下胜负未定，公孙述却不懂禮贤下士、招纳人才共谋大事。看那公孙述，只注重繁琐小节，周围却并没有豪杰辅助，这样的人，怎么能够长久留住天下的贤士呢？于是，马援向公孙述告辞，回去向隗嚣复命说：公孙述是井底之蛙，周围并没有豪杰相助，却还安自尊大。如此看来，公孙达其人ensis不具备夺取天下的能力。我们不如一心和刘秀结交。


    隗嚣听了马援的话后，就派马援带着自己给刘秀的信去洛阳见刘秀。刘秀身边猛将如云，谋士成群，但是自己却谦和谨慎，对人宽容大度。他亲自接见了马援，并笑着同马援谈话。马援说：“如今的天下，不但君主选择臣子，臣子也选择君主。”他这话的意思是，在天下动荡时期，君主想打天下，必须得靠贤能的臣子。而要用人，必须能够识别，然后才能选择。不仅君主要识别和选'
  merge: -1
  img_proc: true
- pgno: 181
  md: '择贤臣，贤臣也要学会识别和选择君主。作为臣子，必须能够看出哪个君主将来能够统一天下，然后就努力辅佐之；如果看不懂，投靠了一个没前途的君主，那么后果不堪设想。这就是他所说的
    “臣子也选择君主” 马援通过考察汉武帝，特别是考察刘秀用人之法及用人之术，发觉刘秀必然能够席卷天下，于是他对刘秀说： “天下混乱，反复不定，盗用帝王称号的人不计其数。今天我见到了您，看到您的宽和大度简直和高祖刘邦一样，才知道已经有了真正的天子了啊。”


    俗话说：良禽择木而栖。这里的关键，是 “择” 而不是 “栖”。马援从刘秀礼贤下士的用人之道，从他身边的谋臣猛将身上，看出了刘秀已经具备夺取天下的基本素质。所以，他毫不犹豫地选择了投靠刘秀。马援提出的
    “不但君主选择臣子，臣子也选择君主” 的观点，即使在今天看来，也是非常正确的。


    # 五是以变识人


    以变识人，就是主动策划一件事情，在事情的发展变化中通过观察对方的表现了解对方之人。关于这一点，历史上也有可资参考的案例。


    战国时期，齐国有个齐威王。齐威王的夫人死了，大臣田嬰想请齐王另立夫人。可是齐王身边有七个年轻貌美的妻子，而且都深得齐王的欢心。那么，到底劝威王立哪个为夫人呢？如果知道了威王心目中的人选，自己主动提出来，不仅会得到威王的好感，而且夫人被立之后也会得到她的感激。所以，这不仅是个辣手的事，而且是个重要的事。聪明过人的田嬰想出了一个办法。他命人找来了七对漂亮的耳环，其中有一对尤其漂亮。田嬰把这七对耳环送给了齐王，齐王果然把这七对耳环送给了七个美人。第二天，田嬰仔细观察，记下了谁戴着那对最华贵的耳环，而后马上奏请齐威王立那位美人为夫人。田嬰深知，威'
  merge: -1
  img_proc: true
- pgno: 182
  md: '王必定把最漂亮的耳环送给了自己最宠爱的美人了，推举他作夫人，自然就是押对了宝。


    在这个故事中，田爰通过自己主动发力，设计了一个小动作，以此准确识别了齐威王的真正想法。田爰的这种方法，就是用的“以变识人”之术。关于以变识人，关键是要做到随机应变，因人设事，不可拘泥。其根本的原则，就是要观察对方在事情变动过程中的应对方法和措施，以此来深入了解对方的真正想法。


    总结识人之术，还要反复强调一下其重要性。三国时期，曹操之所以敢于挑战实力强于他的袁绍，就在于他对袁绍非常了解。《三国志》中记载，官渡之战以前，曹操兵少粮乏，且粮食转运困难；袁绍�…


    兵多将广，粮食补给充足。


    但是就 Roe 在此情况下，曹操还是决心同袁绍进行决战。曹操对袁绍为人认识非常准确，他说袁绍“志大而智小，色厉而胆薄，忌克而少威，兵多而分画不明，将骄而政令不曹…曹操很了解袁绍的为人及才能，了解无能袁绍领导下的军队，所以，曹操才敢于以弱击强并取得最后的胜利。


    在《三国志》中还记载了马谡失街亭的故事。马谡之所以失街亭，罪责当然在马谡。但是，诸葛亮识人不准，没有认清马谡夸夸其谈的为人，这也是一个重要原因。诸葛亮自己上书说：“臣明不知人，恤事多阙，《春秋》责帅，臣职是当。”他自己检讨说没有知人之明，而且考虑事情有时不明智，按照《春秋》的说法，兵败了要责罚将领，自己应该承担责任。诸葛亮认人不准，导致马谡失了街亭，这个故事再次提醒人们，识人之法，非常重要也非常困难。所以，对于此法，务必反复琢磨，力争掌握之。'
  merge: -1
