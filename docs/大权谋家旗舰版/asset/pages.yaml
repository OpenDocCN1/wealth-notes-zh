  md: '当他们讲出这些词句的时候，无形中已经给了自己一个很明确的心理暗示，就是眼前的这件事是必然搞不定的，自己给自己画了个圈，然后把自己限定在了这个圈子里。有这种心态的人，不仅安于接受自己的平庸与无能，还会给这一切找借口。


    另外如果一个人对自己的嗜好乐此不疲，要么他在现实中受到挫折转向自己的爱好来安慰自己；要么他就是放纵了自己的喜好，在喜好上投入了大量的精力，那他在正事和升迁的道路上必然就缺乏投入，在别人都全力以赴的情况下，他必然就丧失先机，前途堪忧。


    通过以上几点，你很容易判断一个人的过去，现在和未来，不仅你可以判断别人，还可以来檢視自己，让我们按照这个标准一起努力，为自己的前途奋斗！


    # 科技 or 思想 or 关系，哪个才是第一生产力？


    我们从小就被教育，科学技术是第一生产力，只有掌握了科学技术，才能更好的改造自然。


    而思想是行动的源泉，是一切行为的指导，所以有人说思想才是第一生产力。


    而今天作者要说的是，社会关系才是第一生产力！


    为什么这样说？


    因为中国是一个伦理社会，一个人一生下来，就在伦理体系里面有了定位。所谓伦理就是一个不平等的社会，在整个伦理体系里面一个个的人和人与人之间，就形成了关系，这个可以说是在组织内部的情况。


    所以如果你要想在组织内发展好，那必须向组织内有权有势的人靠拢，这样


