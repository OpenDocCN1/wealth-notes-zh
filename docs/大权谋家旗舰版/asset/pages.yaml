- pgno: 254
  md: '人物的角度来看，为什么领导是如此难伺候？如果应对失误，那 дат就丢掉性命；如果应对得体，那可能就要连升三级。而本案例中穿珠子的小人物，从维护领导的权力出发，一再提出对领导非常有用的建议，一言挽救了田单、齐襄王、自己的性命，虽然没有看到日后被提拔，但是他已经被载入了历史，这是多少人梦寐以求但就是得不到的荣誉！


    # 职场上，开大会，作为下属的你，怎么选择自己的座位？


    看到很多普通的职工，看到领导就躲得远远的。坐电梯时候，想办法和领导错开，开会的时候，躲的远远的，直接坐到最后，或者坐到角落不被注意的地方。试想，如果我们这样做了，那怎么让领导了解到你呢？领导能放心给你挑担子么？


    首先，为什么开会的时候你会喜欢坐在远离领导的不起眼的角落里面呢？很简单，因为“自由”，避免被领导监视，可以自由的玩手机，刷视频，度过无聊的会议时间。


    但是如果从领导的角度看，你这样做，其实是“自由” + “散漫”，眼里没有领导。领导只要看到你这样一眼，就不会有好印象，你的职场命运也就已经定格了。


    那我们开会时候具体应该怎么做才能获得领导的好感呢？


    首先，一定要记得靠前坐，主席台你肯定坐不上，可以坐台下第一排。如果台下第一排被安排掉了，那可以坐第二排。为什么要往前坐呢？


    首先，你可以进入领导的视野，俗话说，可以混个脸熟。当然，你坐前面，'
  merge: -1
  img_proc: true
- pgno: 255
  md: '肯定不会是混个脸熟那么简单，还要善于为领导们服务，譬如端茶倒水，拍照记录等等。总之，千万不要觉得自己是主人，像佛一样坐定来接受服务，而是要善于寻找机会，为大人物服务。


    其次，在开会的时候，你在做好记录的同时，要善于和台上讲话的领导做好眼神的交流，关键时刻记得带动大家鼓掌；如果能流露出崇拜和学习的目光那就是最好不过。如果次数多了，领导一定会把你牢牢的记录在脑海里面，事后如果你再找机会就会议问题请教领导的话，那你和领导的关系就容易紧密起来了。


    最后，因为你坐在前面的位置，在做会议后宣传的照片里面，说不定你就可以出镜了。如果能被领导看到你全神贯注听领导讲话的神情的话，那你的机会就会慢慢到来了。


    很多人学历不差、能力不差、素质不差，但长时间以来在职场中却很难得到机会和大的发展。他们要么抱怨社会不公，一肚子怨气；要么看破世事，主动“摆烂”，离“职场进步”越来越远；还有一些人，把接近领导、按照领导意图执行的行為为拍马屁、无自我、伤自尊，生怕被别人耻笑，把“积极入世”当作“洪水猛兽”。这些不成熟的想法严重限制了自身职业的发展。


    我们一定要记得，领导不是洪水猛兽，领导也是人，通过本文的方法可以链接、可以靠近、可以信任，一步步走近领导，自己的职场之路也会越走越顺，机会越来越多，职位越来越高！


