    《韩非子》中有 cercano 段话，论述了臣子取得宠幸的手段：“凡奸臣，皆欲顺人主之心以取亲幸之势者也。是以主有所善，臣从而誉之；主有所憎，臣因而毁之。凡人之大体，取舍同者则相是也，取舍异者则相非也。今人臣之所誉者，人主之所是也，此之谓同取；人臣之所毁者，人主之所非也，此之谓同舍。夫取舍合而相与逆者，未尝闻也。此人臣之所以取信幸之道也。”大意是说，凡是臣子都想顺从君主的心意，以取得君主的亲幸和权势。因此，君主所喜欢的东西，臣子就加以赞美、吹捧；君主所憎恶的东西，臣子就加以诋毁、攻击。臣子同君主的好恶完全相同，这正是臣子取得信任和宠爱的途径。


