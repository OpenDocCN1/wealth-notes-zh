    # 为什么你会觉得社会如此复杂？


    社会是由一个个人所组成，而每个人都有欲望。很多人谈欲望色变，其实大可不必。欲望是人类生存和传承的基础，孔子说过“食色性也”，也就是说，吃饭和异性是人生的两大原始追求，一个是自身生存需要，一个是传承的需要。


