    # 这三种思维方式，时刻在拖你工作的后腿！怎么解决？


    经常有学员来咨询职场问题，虽然各种问题可以说是五花八门，但是归根结底，都是以下三点原因造成的：


    # 一、怨天尤人


    在工作中遇到问题，第一时间不是想着怎么弥补，而是怪三怨四推卸责任，要知道如果你只是一个 小职员，那怨天尤人的话，只能让上级加重处罚，同时因为自己没有反省，所以也没法办法提高自己的水平，正常做法是反求诸己，从自己方面找原因，然后才能提高自己解决问题的能力。当然如果你职位已经很高了，那就可以想办法用各种办法来推卸责任，但是心里还是要明白，是自己的责任。


    36'
