  md: '态，这叫做“表态政治”。你表态了，叫做“坚定”；不表态，就是动摇，摇摆不定。对于反对的，一定先下手干掉，对于不表态想保持中立或者独立也几乎是不可能的，最后的结果必然是要团结一致。


    # 职场的最大捷径，就是复制领导的思维模式


    在职场中，有很多俚语，例如“职场中最重要的是跟对人”、“职场中积累人脉是最快的进步通道”等，这些俚语的潜台词都是“寄托他人，借力长高”。这种思路其实很危险，特别容易陷入到阿谀奉承、投其所好、媚骨横生的地步。对于这种的状态的人，其实他的领导也不会真正重用他，最多像对待弄臣一样，偶尔赏根骨头逗乐一下。


    # 一、什么样的员工能够被重要和优先提拔


    企业中，真正能够被重用和提拔的员工，有两种：


    +   (1) 能力突出、态度积极的核心员工


    这种员工是靠着能力和绩效硬生生地挤入到更高层级。他们属于企业的业务骨干，单位一旦少了他们，效率和绩效会瞬间降低一大截。


    每个单位都有这样的骨干员工，属于真正能干活、会干活、肯干活的人。但是，这样的人也不多，如果一个企业的十个员工里面有三个是这样的员工，老板就应该天天笑醒了。


    +   (2) 与领导思维同步、能出谋划策的员工


    这类员工不是靠拍马溜须等方式进入领导的视野的，而是能够真正帮助领导出谋划策、承担压力，尽管有时候他们也会拍拍领导的马屁，但是他们的主要'
