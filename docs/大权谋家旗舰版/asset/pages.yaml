    所以这时候杨敞这边的表态就非常关键，如果你有犹豫，就会把自己陷入被怀疑的境地，如果你被怀疑了，那霍光（代表强权）方面就会先下手为强，把你干掉，以免后患。所以不管你是不是真的心理有其他想法，这时候的坚定表态是必须的，也是保护自己的一个手段。


    在清朝的时候，维新派有光绪帝作为后台，通知袁世凯让他支持维新，袁世凯表面上胸脯拍的邦邦响，背地里却立即向慈禧太后告密，导致于维新派的很多人被干掉，光绪帝被囚禁。


    在本段材料里面，杨敞的夫人特别有才华。也难怪，她是史学大家司马迁的女儿，从小有家学渊源，对历史上的典故了如指掌。所以在这样的情况下，杨敞这边除了坚定表达支持以外，没有第二条路可以走，不然当场就可能身首异处，而且要夷三族。


    所以当有人在被逼着表态的时候，他们几乎都是表面上坚定站在表态的那一边，实际上内心在权衡，站在胜利者也就是权势大的一边（要么真的支持，要么告密）。


    中国政治一直有一种传统，就是在一些大是大非的事情上，关键人物都得表'
