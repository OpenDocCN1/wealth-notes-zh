  md: '源，所以这时候权力就出现了。所以在当前社会，大部分人的追求就变成了权钱色了，这个权钱色就统称利益。


    而很多时候，人们不能赤裸裸得谈利益，尤其是在不熟悉的人面前，所以就有了冠冕堂皇的大公无私，如果你没有洞穿本质的能力，那就必然会上当受骗。


