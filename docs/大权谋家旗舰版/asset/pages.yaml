- pgno: 320
  md: '官。问题就用于有些能人自恃有才，而不去与上级拉关系。你是下级，不主动与上级搞好关系，还等着上级给你拉关系，那就未免太天真了。所以，会不会与上级拉关系，是决定一个人官运的关键。大家都是一个鼻子两个眼睛，你也干工作，我也干工作，你说谁有能力谁没能力呀。无疑，裁判员是上级。上级说你有能力你就有能力，上级说你没有能力你就没有能力。


