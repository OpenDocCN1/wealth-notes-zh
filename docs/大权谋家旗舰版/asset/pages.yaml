  md: '这其实很简单，只要陛下假装外出巡游，到了楚地的时候，就召集韩信前来晋见。那时候，只需要一个力士就能把韩信给抓起来了。刘邦听了龙颜大悦，于是下诏出巡。


    韩信听说这事，直觉感到刘邦是冲着他来的，但是又不能确定。有人劝他说： “不如把钟离昧给杀了，然后去见皇上，那么皇上就会非常高兴，大王您就不会有什么祸患了”。韩信想了想也对，就把钟离昧给杀了。12
    月，刘邦巡幸到了陈地，韩信带着钟离昧的脑袋去拜谒刘邦。他原以为自己把钟离昧给杀了，刘邦就会不计较了。哪里知道刘邦见了他之后，马上破口大骂说： “有人告发你小子谋反。来人，把他给我绑起来。手是，武士一拥而人，把韩信�
    gitti起来，押在跟随皇帝车驾的副车上。到了这时候，韩信才明白刘邦真是冲着自己来的。对刘邦来说，韩信私藏钟离昧没什么大不了的；但韩信功劳太大了，对刘邦是个威胁，这才是刘邦要抓他的根本原因。到了这时，觉悟了的韩信哀叹着说：
    “别人早说过 ‘狡兔死，走狗烹；高鸟尽，良弓藏；敌国灭，谋臣亡’ 我一直不相信。今天天下平定了，我对皇上您已经没什么用处了，所以我自然就应该被杀掉。” 刘邦老脸通红，见韩信一点不给面子，直接就揭了老底，不禁恼羞成怒地重申：
    “有人告你谋反。刘邦用镣铐锁住韩信，将他带回都城，并大赦天下以示庆贺。


    刘邦敲打了韩信，打击了韩信的气焰，让全天下人都知道他才是皇帝，给了韩信个重大的政治打击。完成目的后，刘邦还不想撕破脸，就在达到洛阳时赦免了韩信，把韩信的楚王名号废除，改为淮阴侯。韩信经过了这次打击，政治人气一下子撞到了跌停板。刘邦巧妙地通过用谋，成功挫去了锋芒毕露不可一世的韩信的说气。刘邦用的这个方法，就是精神惩戒的一种。'
