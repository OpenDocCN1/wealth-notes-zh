  md: '# 社会秘籍：怎么结交有用的人脉！


    社会上绝大部分人混不好，是因为没有人脉，或者说没有有用的人脉，也不知道怎么结交有用的人脉，只能一直停留在舒适区，也就是自己的小圈子里面。所以不管自己怎么努力，也只能单打独斗，一直徘徊在社会的最底层，因为个人的资源极其有限，只有合作才能产生核聚变，才能把事情做大。


    所以在中国：人脉关系才是第一生产力！


