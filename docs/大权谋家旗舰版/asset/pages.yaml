  md: '而寒暄更有用的是调整大家对话的气氛，让对话在友好中进行，更高级的甚至可以直接为谈话主题做准备，不知不觉可以把谈话切入正题。这样的话，谈话就很容易取得非常好的效果。


    其次，通过寒暄还可以探的对方现在的心情，如果通过初始的寒暄，记得说话的时候一定要盯着对方的表情，通过对方的回复和微表情，如果还是无法让对方转换心情的话，那最好还是要乘机开溜，不要再说正题，因为效果肯定不会好，还得下次另找时机再说。


    还有为什么中式大户人家都喜欢大宅院？还建有很长的“风雨连廊”，就是让人进通过这段建筑物的时候，能平复心情。就算你情绪很坏，通过这样的过程，加上宅内特制的园林景致，让你心情快速平复下来，让大家能心平气和的对话。


    回到本材料，对于领导来说，他最在乎的是什么？能力？业绩？都不对，其实是忠诚。没有忠诚，对领导来说，能力不能为我所用，反而还会坏我的事情。有业绩没有忠诚，那你就有可能用业绩来裹挟领导，这样领导也会很难做。


    而韩非子率先就说出，我说实话，说直话，只是为了对秦王忠心，这样秦王会展现一定的宽容度，所以韩非子在后面说了，他将要把他所知道的实际情况和全部情况都说出来！以报答秦王的知遇之恩。


    最后一句，希望大王裁决我的罪过，表面上是这样说，其实真正的含义是通过自己退后一步，是让秦王原谅可能存在的过错，中国人说话都比较含蓄，不直接说，你原谅我吧，而是把主动权交给领导，领导就不好意思再处罚你了，谁让你这么懂事呢！


    开门见山，往往代表你涉世未深！高人们谈话之前的寒暄，是谈话的重要组'
