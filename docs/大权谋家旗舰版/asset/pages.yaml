  md: '# 职场上哪些错误是不能犯的？一犯就万劫不复！


    【资治通鉴原文】葛婴至东城，立襄强为楚王。闻陈王已立，因杀襄强还报。


    陈王诛杀葛婴。


    【翻译】葛婴到达东城后，立襄强为楚王。后来闻悉陈胜已立为楚王，就杀了襄强返回陈县奏报。但陈胜仍然将葛婴杀掉了。


    【解析】职场上有哪些错误是难以补救的？这就要看职场上是什么方面最重要，毫无疑问，中国职场，最重要的不是能力，而是政治，政治就是站队，往往站错队后就难以弥补了。


    本段材料里面，是说秦末的陈胜吴广起义后，派葛婴带一支部队出去攻城略地，而葛婴在攻下这些地方后，直接立了襄强为楚王。


    这里面我们要注意一点，从后面葛婴立即杀了襄强来看，葛婴只是把襄强作为一个工具，用这个工具来影响攻打地区的人心，这样不管是收复这些地方，还是巩固这些地方的统治，都对自己会比较有利。


    虽然有这样的解释，但这件事毕竟是严重超出他的职责范围了。当然，如果葛婴觉得他的实力完全可以和陈胜分庭抗礼，而且他下面的部队和将领都听他的，那他就可以自立门户了，而现在他自作主张立楚王，是严重的越权行为，造成非常恶劣的政治后果。因为其他将领也可以向他学习了，有了实力就自己搞一摊了。


    拥立组织领导，一直是最接近最高权力相关人员的职责范畴。在战争时代，谁拥立代表谁的实力最强，权力最大，而被拥立者往往只是一个傀儡，如果葛婴真想拥立组织领导，那应该和陈胜吴广建议。注意，这里只能建议，还不能商量，因为建议是下属对上的态度，商量是大家平等的，而葛婴这时候只能算'
