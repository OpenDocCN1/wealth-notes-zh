    # 权谋角度看是非善恶的标准


    我们绝大多数人，从出生起，就被家长、亲戚、朋友、老师等灌输了一套是非善恶的标准，而我们也从来没有仔细思考过这些是非善恶的标准是从哪里来的。今天我们来仔细研究一下，是非善恶到底是从哪里来的。


    举个例子，一条鱼本来自由自在的在河里游啊游，突然被渔夫捕捞上来，经过好多重的交易，最后到了厨师手里。杀好，进油锅，加佐料，撒上葱，这条鱼是犯了什么罪，需要受到这样的刑罚。从渔夫到贩夫到厨师到食客，是不是都是罪犯（从鱼的角度看），但是从我们角度看，这个再正常不过，我们还要感谢这个利益链的人，不然我们没有鱼吃，我们又认为他们是好人、是善人。


    所以所谓的是非善恶，如果换个角度或者立场，就会发现是完全不一样的结果。


    其实对错、是非、善恶的标准都是人们来定义的，不是原来就有的，所以老子说过：“天地不仁，以万物为刍狗；圣人不仁，一百姓为刍狗”，也就是说，不管是天地还是圣人，他们没有自己的主观判断，而是静观着万物和百姓的演变。所谓对错，是非，善恶，他们都无所谓。


