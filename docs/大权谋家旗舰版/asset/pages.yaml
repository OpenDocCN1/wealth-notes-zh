- pgno: 66
  md: '不直接 掌握这支军队，韩通运用他的合法权力，组织反抗，政变即会流产。

    如何逾越这个障碍？赵匡胤与其智囊都清楚地记得九年前发生的一件大事：后汉隐帝 乾祐三年（公元 950 年）十一月二十八日，“河北诸州驰报，契丹深入”。后汉命枢密使郭
    威率大军北征，当军队到达溳州（在开封北 270 里处）时，郭威发动兵变，打回京城，自立为帝。这个情报，并非完全虚构，是年十月，契丹确曾南下，十一月攻占内丘县，随即屠城而去。郭威由此事得到启示，将契丹北归改成深入。这样，本来枢密使不直接掌握军队，但由于出任北征统帅，则将军队控制在手，从而顺利夺取政权。既然郭威可以将契丹北归改成深入，赵匡胤亦可仿效，制造假情报，演出陈桥兵变的活剧。

    显德七年（公元 960 年）正月初一，镇、定二州来报 “契丹入寇”，朝廷命赵匡胤率兵北征。此时大权在握，可以发动兵变，但是赵没有发动。显然，赵和智囊在考虑，慕容延钧正在海州，万一不支持政变，甚至在拥周势力鼓动下，起兵反对政变，一昼夜即可赶到京城，倘若与韩通势力内外呼应，事情就会复杂化。而万一不能控制局势，外地李重进等联合反扑，政变即有流产危险。尽管这仅是可能性，亦必须事先严加防范，才会万无一失。因此，赵决定命慕容延钧率前军出发，为使人们深信不疑，同时宣布自己次日率大军离京北上。三日晚，赵到达陈桥驿，此时，前军已渡过黄河。四日凌晨，赵在石守信、王审琦等人拥戴下，黄袍加身，率军返回京城，心腹将领王彦升刺杀韩通，罗彦环仗剑胁迫宰相扶赵匡胤升殿。五日，定国号为宋，改元建隆，政变一举成功。此时，慕容延钧仍在一心一意地向北进发。至此，赵匡胤和他心腹发动的
    “陈桥兵变”、“黄袍加身” 就已经完全成功了。

    我们作为围观的第三方，可以从陈桥兵变之前的人事变动反推赵匡胤他们的'
