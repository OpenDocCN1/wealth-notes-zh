  md: '甘愿被因困鲍叔牙没有笑我没有气节，他知道我是为了图谋大业而不在于一时之间的名声。生养我的是父母，但是真正了解我的是鲍叔牙啊！"


    # (3) 害同而交


    有的时候，为了抵制共同的祸患，人们也会走到一起去。因为反对某个共同的对手和敌人而结合，这也是历史上经常出现的现象。较经典的有汉初陈平、周勃为抵制诸吕而结交的故事。


    刘邦死后，吕后掌权，把持国政，对刘氏皇族非常压制。当时的丞相是陈平，他对吕氏家族的势力膨胀而无法压制感到忧心忡忡，害怕将来大难临头，所以就躲在静室里苦思对策。大臣陆贾前去拜访他，因为平时关系好，所以没有通报直接就进屋了。陈平


    正在苦苦思索，竟然没看见他。于是陆贾就问陈平："丞相思虑何事，竟然如此全神贯注啊？" 陈平说："先生猜猜我考虑何事？"


    从《汉书》的记载中人们可以发现，陈平实在是个鬼才。


    他一生靠智慧吃饭，竟然从一个穷得连饭都吃不上的农家小子，最后成长为大汉丞相，当然有他的两把刷子。虽然陆贾关系和他不错，但是，一样也别想牵着他的鼻子走。


    陆贾见陈平耍滑头把皮球踢过来，嘿嘿一笑，说："你现在已经富贵无比了，按说应该是没什么欲望啦。可以你现在仍然忧心忡忡的，显然是在担心什么。我想，你肯定是担心吕氏家族和少帝罢。


    陈平吃了一惊，但瞬间就平息下来。他见面纱已经拆穿，就说："你说得不错。事到如今，我怎么办才好呢？" 陈平是个智慧人物，他考虑得很有道理。当年刘邦让陈平拿着诏书去杀大将樊哙，陈平不仅没杀，反而顾着樊哙和昌后'
