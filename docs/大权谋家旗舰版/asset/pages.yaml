- pgno: 316
  md: '经常犯有这样和那样的错误，有的是明的，有的是暗的，有的是八小时之内的错误，有的是八小时之外的错误，我总是千方百计地掌握清楚，记录在案。对于自己人，我常常会网开一面，大事化小，小事化了。想想看，如果他们犯了错误，我不处罚或从轻处罚他们，就是对他们的一种关照和恩惠，他们会感激我的。同时，如果我掌握了他们的一些过错，他们会变得更加老实和服从。因为，他们知道，如果惹我不高兴，他们就会有麻烦了。对于非自己人犯了错误，我会抓住不放，把他当做反面典型，进行严肃处理，以体现我的从严管理的魄力。我的手下人之间，也常常产生一些矛盾，他们常常会把这些矛盾缴到我这里来，这正是我所需要的。有了矛盾他们就会相互把对方的短处汇报到我这里来，最后，我就掌握了他们双方的把柄。这样，他们双方永远不会有赢家，赢家只有一个，那就是我。我表面上看似漫不经心样子，可我会把每个人的帐都记在心中，这叫心中有数，我想整治谁，也就易如反掌。在关键时候，我会说出某来的要害一二三来，让他心服口服，无话可说。


    我制裁人的时候很讲究策略。我想处罚或收拾一个人的时候，我常常使用“收放法”。你浑身是刺，公开同我对着干，不把我这个局长放在眼里。那好，我装傻，走着瞧。你以为我软弱，我没有办法，我怕了你，你就变本加厉、一意孤行。我就暗自了解、掌握、抓住你的短处，一旦我掌握你的短处多了，我就突然对你进行彻底清查，老帐新帐一齐算，老百姓管这叫“撸鸡毛揪掉子”。你有了一大堆毛病，就别怪我不客气了。我会名正言顺地、狠狠地处分你，一下子让你趴下。这时，你会求我，让我减轻处罚，我会把架子端起来：这事嘛，影响太大了，情不能大于法，不好办呀。这时，我心里想，得罪我，让你吃不了兜着走。'
