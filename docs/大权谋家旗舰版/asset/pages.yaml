- pgno: 286
  md: '确实我们可以实实在在学习、掌握和借用的。


    “物以类聚，人以群分”，每个人都喜欢和同类在一起，复制领导的思维模式，就是将自己划分到领导的“群”中，成为他的“朋友圈”。


    # 2、复制思维模式的三个步骤


    # （1）观察和分解：领导是怎么思考和决策的


    从小到大，我们的学习规律都是“先模仿、后实践、再创新”的过程，无论是牙牙学语还是学习写作，都是如此。


    在复制思维的过程中，同样需要观察对方的整个思考和分析过程，从对方的决策结果中逆推出他的思维方式。


    例如上级突然增加了一个新任务，这与本季度的工作任务有明显冲突，不同的领导有不同的处理思路，了解这些思路，能让你更有效地与他互动：


    有些领导会想办法只做其中一部分，其他推回去：他怎么选择必做的内容、怎么说服他的领导收回去其他任务的？


    有的领导会在部门内设置奖励目标，内部消化掉：这是一个善于使用激励手段的领导，他常用的激励系统和标准是什么？


    有的领导则强压下面的人必须完成：这是一个强势的领导，在强压过程中，他采用哪些手段和策略，如果强压失败了，他会怎么处理？


    有的领导身先士卒，牵头负责起这个新任务：这是一个实干型的领导，在这个任务实现过程中，他主要做了什么，为什么只做这些。


    事实上，在不同的处理场景下，同一个领导可能有不同的处理思路和风格，但是他的思维内核一定是非常稳定的，你需要找到它。


    我的上一个领导就是一个多变型的主管，有时候一件小事就心急如火，有时'
