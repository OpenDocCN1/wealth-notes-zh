- pgno: 265
  md: '而从第二件送毛衣的事件来看，江夫人送毛衣，看你穿不穿，更多是一种对权力的服从性测试，而表演艺术家往往又是很有性格脾气的，所以江夫人作为领导，这样的权力服从性测试也是很有必要，以判断接下来是不是要用；如果穿了，就代表听话，那
    We''ll approximate the first block.


    那有人就会说了，不管是袁世凯还是江夫人，他们的下场都不好呀，不过对于宋教仁和赵燕侠而言，一个丢了性命，另外一个丧失了职业生涯，在黄金年龄没有出任何成绩。


    最后一点，你作为小人物，因为自己的专业水平获得大人物的赏识，虽然你已经想投靠过去，但这时候千万不要心急，因为你还有顶头上司在管着你，如果你没有处理好和顶头上司的关系，那对方可能就会先把你封杀。


