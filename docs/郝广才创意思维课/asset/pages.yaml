  md: '# # 17｜附身术：如何跳脱固有框架？


    你好，我是都广才！欢迎来到我的创意思维课。


    上一讲，我们讲到了软文化，就是在正面跟敌人之间，要么找到一个有趣题，换个思路来解决自己遇到的难题。


    这一讲我要跟你讲的创意思考方法叫附身术。它最大的一个特点，就是能够帮你从原来的思考框架中跳脱出来，跳出固有的思考框架，往往是我们产生创意的关键。


    # ## 巴菲特的附身术


    股神巴菲特，在他的办公室挂了一张照片。这张照片既不是他自己，也不是他的家人，而是一个棒球职业运动员——泰德·威廉斯。


    为什么巴菲特要挂一个棒球职业运动员的照片？


    因为泰德·威廉斯在“教”巴菲特怎么投资。


    看到这儿，你是不是特别疑惑，投资和打棒球有什么关系？


    确实没什么关系，但是，巴菲特也的确的在用泰德·威廉斯打棒球的方法，在投资。


    我们都知道，打棒球的时候，打击手特别重要，它是衡量一个棒球选手的重要标准。


    而泰德·威廉斯，不只打击率高，而且打球有“道”。他写过一本书《打击的科学》。


    在这本书里，泰德·威廉斯介绍了他的打击哲学。


    这个打击哲学一共有三个要诀：


    +   - 一、严格选球；

    - 二、正确思考；

    - 三、练习练习再练习。


    什么意思？我们一个个来看。


    先看第一个，严格选球。


    泰德·威廉斯在打击的时候，特别牛，他把“好球带”分成了7格，每格有一样棒的大小，只有球落在最佳的格子，他才打击。


    落在其它格子的好球，他都不受欢迎，绝不还手。乌云来到，有阴影，不打。观光的球反，右，到眼睛时，不打。反正不是最佳时机，绝不打。


    但是，一旦等到发现自己拿着手的好球，他就会全力去打击。


    第二个要诀：正确思考。


    泰德·威廉斯在打击之前，会先观察投手，所以每次比赛的时候，第一个球，他只观察不挥棒，不挥率高达95%。


    但是，当他了解了投手打算的思路和状态的时候，他就会毫不犹豫地去挥。'
