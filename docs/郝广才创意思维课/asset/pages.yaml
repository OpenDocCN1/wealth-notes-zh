  md: '# 22！聚焦法则：如何在同类中寻找优势？


    你好，我是郝才，欢迎来到我的创意思维课。


    上一讲我跟你讲了第一法则和分类原则，就是在做创意传播的时候，你一定要找到第一的位置，这样才可能更好地公众记住。如果找不到第一，就为我分类，在分类里做到第一。


    但是，如果寻找分类之后，还是不能做到第一呢？这个时侯要如何处理？


    比如宝马与奔驰，都是汽车，同样是德国车。遇到这种情况，怎么设计传播方案？


    这一讲，我就通过聚焦法则来解决这个问题。有了聚焦法则，我们才有办法在同类之间找到自己的位置。


    # 聚焦会在大脑形成固定的反应


    回到我们刚才说的奔驰和宝马，同样是德国汽车，怎么来设计传播方案，让公众对自己有一个清晰的知识呢？


    不妨来比较一下，两家公司的广告。


    奔驰在做广告的时候，传递的信息是追求完美，"The best or nothing"，让消费者感觉，奔驰的车非常棒。


    而宝马，它在做广告的时候，强调的是驾驶乐趣，"Join driving pleasure."


    由于各自传递的信息不同，奔驰的车，越来越大，因为买宝马的人是坐在后排，去享受的。他不是自己开，所以要豪华和大气。


    而宝马的车系定位最好是宝马3系，因为宝马3系定位在最高的轿车，能驾驶汽车的人，带来很大的驾驶乐趣，和宝马的广告宣传相符。


    再来看法尔沃，多年来，法尔沃一直聚焦在安全，传递所有的信息，是，法尔沃很安全。那么，大众对它认知就在那是安全。


    如果你是老板，你想让司机开车，自己坐在后排享受，一般会选择奔驰。


    如果你自己想开车，想要享受驾驶的乐趣，一般会选择宝马。如果你注重安全，你会选择法尔沃。


    你看，这就是聚焦的力量。聚焦在用户的大脑袋，形成一个固定的反应。这个固定的反应，在他们做决定时，就会发挥作用。


    # 聚焦法则的三个心法


    那么，怎么使用聚焦法则呢？我有三个心法：


    第一个心法：要有一个对面。


    比如七喜（Seven-Up），它一开始的定位是柠檬类的饮料，销量很差。后来当它把定位聚焦在"非可乐"后，它在饮料市场的份额一下子飙升到第三名。


    为什么会这样？因为它找到了一个非常好的对立。可乐和。我们都知道，在饮料市场，最大的就是可口可乐和百事。那么，有没有人不喝可乐呢？很明显是有的。所以，当七喜聚焦在"非可乐"这个定位后，就给自己立马找到了大批不喜欢可乐的用户，这样一来，自然也唤起了他们大脑里的反应。


    所以，我们在使用聚焦法则的时候，一定要小心。你要关注你的定位有没有对面，也就是有没有敌人。如果没有对面，这个定位就不靠谱。


    第二个心法：要有焦点活动。


    在台湾宜兰，有一个很有名的节日叫宜兰童玩节。这个日聚焦在儿童身上，做得很成功。看到宜兰童玩节成功后，台湾很多地方都开始举办，各自地方的节日，一年有两百多个。结果后来全部失败了，只有童玩节还在。


    但是后来，童玩节办着办着影响力也下降了。为什么？因为它缺少了一个焦点活动。


    什么叫焦点活动？我们把童玩节和西班牙奔牛节对比一下就清楚了。


    和其它狂欢节不一样，西班牙奔牛节的时候，大家也是大吃大喝、载歌载舞。但是，从1591年开始，西班牙奔牛节经历了四百多年而长盛不衰，为什么会这样？


    因为它有一个焦点活动：一堆人跑在牛的前面，让牛来追，然后看谁比牛快。


    你看，就是这么一个看上去很无聊的焦点，就让西班牙奔牛节有着极高的辨识度和吸引力。而我刚才讲的宜兰童玩节，它的不足之处，在于没有一个焦点活动。如果让它设计一个焦点活动，比如水枪大战，然后设定世界最大的水枪，让大家互相来喷，搞不好会吸引全世界想做水枪的人来竞赛。这样，宜兰童玩节就有焦点了。


    第三个心法：聚焦必须长期坚持。


    比如万宝路香烟的广告。长期以来，万宝路香烟一直把自己聚焦定位在牛仔上。它的广告，从不跟你谈烟草有多好闻，吸了这个香烟有多少美女会注你意。


    长期以来，从头到尾，就是一个牛仔在那躺着，在那一直酷、一直酷，诉诸人心中牛仔情怀。在这种长期聚焦宣传之下，美国人现在再看到万宝路香烟，第一个想到的就是牛仔。


    这就是长期坚持带来的结果。


    最后，我要提醒你的是，不管是我之前介绍的童行创意的方法，还是这个模块说的创意传播的方法，它们都不是孤立的，有时候，我们可以把好几个方法和法则，结合起来使用。


    我们来看一个同时使用了聚焦、分类和第一法则的案列：


    美国有线电视新闻网，也就是CNN，是世界第一家24小时全年无休的新闻电视台。


    它刚开始要这样做的时候，大家都不相信，认为没有人要一直不间断地听新闻。要知道，当时流行的是美国三大电视台，晚间新闻节目只有15分钟。


    但CNN的创办人特德·特纳（Ted Turner）认为，应该有一个全部是新闻的新闻台，即快、不停地向用户播报新闻。他认为观众要随时随地了解这个世界的最新动态。


    后来的发展证明，特纳是正确的，CNN后来的市场占有率也做到了全球第一。


    # 本讲小结


    总结一下这一讲的内容：


    这一讲，我向你介绍了传播创意的聚焦法则。


    在使用这个法则的时候，你有三点需要注意：找到对立面、寻找焦点活动以及长期坚持。


    # 创意训练


    最后，给你留一道创意训练题：


    大年三十的时候，我们中国人都有守岁的习惯。虽然都是守岁，不同的家庭，在守岁的时候，干的事情不一样。有些是一起看春晚、有些是打麻将、有些是聊天等等。


    你能否给你家的春节守岁，设计一个必做的聚焦活动，让你成为你家庭，春节特有的仪式？


    欢迎你给我留言，和我分享你的创意，我们下 一讲再见！'
