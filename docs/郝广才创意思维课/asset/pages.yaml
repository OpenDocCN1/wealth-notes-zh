  md: '所以你看，问题就是创意门的起点，但你需要注意在使用过程中注意三点：


    第一，问题是机会，问题越大，机会越大；


    第二，别人的问题也是你的机会，但一定要区分个别问题和群体问题；


    第三，千万不要问笨问题。


    可能会有人告诉你，要想取得创意，要尽量问，笨问题也不怕。


    错，我要跟你说，千万不要问笨问题。


    什么叫笨问题呢？


    笨问题的简单定义就是，如果这个问题只有一个答案，没有其它的可能，那就是笨问题。


    例如，我们常常会在媒体上看到一些笨问题：


    足球比赛完后，问球员说，“今天你踢进两球，开不开心？”


    或者问观众说，“中国队得到冠军了，你高不高兴？”


    像这种只有一个答案，没有其它的可能的问题，就是笨问题。


    # 本讲小结


    总结一下这一讲的内容：


    问题门，是所有创意的起点，问题是创造之父，可以引发创造的动机和动力，哪怕只是小问题，可能会改变世界。而且生活中小问题的解决，会产生庞大的商机。


    但是提醒你要注意，问问题没那么简单，答案也不会那么简单，所以要一层一层发问。


    此外还要提醒你，要区分个别问题和群体问题，千万不要问只有一个答案的笨问题。


    # ——— 创意训练 ———


    最后，是我们的创意训练时间：


    这一讲我要你思考一个关乎所有人未来的问题。


    历史学家尤瓦尔·赫拉利在《今日简史》里，提出了这样一个问题：


    未来，数据成为了最重要的经济和社会资源，那么数据的所有权到底该属于谁？


    政府、企业还是个人？


    如果数据掌握在少数人手里，如何防止它不被滥用？


    欢迎你给我留言，和我分享你的思考，我们下一讲再见！


    ![](img/ecd73788046f854a7013d9d6a2699547_17_0.png)


    # 创意精选


    叶长东.蛙喔教育

    在澳洲吃鳐鲠壳上的瓢虫到了洛杉矶还是吃了鳐鲠壳老鼠解决了问题。人们用猫鼬代替猫来抓老鼠时，结果因为活动时间没有交集，猫鼬吃了珍贵的鸟。我们不可能去训练老鼠白天出来觅食，去训练野生猫鼬可能是徒劳。两者都有一个共同之处：就是想在创意和实践中间，少了一个“试验田”。就如毛主席的井冈山是根据地的试验田，深圳是改革开放的试验田一样。引进瓢虫的时候，必须先引3到5只到洛杉矶模拟野外环境做一个实验观察记录，再做决策。引进猫鼬也是。再好的创意都要经过试验田过渡一下，才能开始大规模推广应用。


    以上留言由 作者 筛选显示'
