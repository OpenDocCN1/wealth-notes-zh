  md: "# 18｜配角术：如何挖掘创意机会？\n\n你好，我是郝广笑，欢迎来到我的创意思维课。\n\n上一讲我们讲了附身术，就是我们可以附身在那些厉害的人身上，用他们的眼光和思维，去解决问题。\n\
    \n这一讲，我要讲的是配角术。有时候，把我们的注意力，放到配角身上，往往也能产生各种创意。\n\n看到这儿，你是不是有点疑惑。人不都是想当主角的吗？\n\n\
    没错，可问题是，主角往往只有一个，机会少之又少。\n\n而当你把注意力投放到更多的配角上面的时候，你就可以发现各种新的创意和机会。\n\n# 咖啡隔热套的发明\n\
    \n我们先不妨看一下配角的例子。\n\n如果你去星巴克喝过咖啡的话，你会发现星巴克的杯子里面，都套着一个隔热套。\n\n这个隔热套可不是一开始就有的，在隔热套出来之前，星巴克都是用手套杯杯子，来解决烫手的问题。那隔热套是怎么发明出来的呢？\n\
    \n故事还得从上上个世纪说起，1991 年的一天早上，美国一个叫杰·寒瑞森（Jay Crowson）的人，开车到麦当劳汽车餐厅来端来餐食，当他端起热咖啡的时候，因为太烫，失手把咖啡翻倒在大腿上。\n\
    \n虽然狼狈不堪，但寒瑞森的大脑里，冒出了一个直觉：如果能发明一个“隔热环”，那一定会赚到钱！ \n\n想到就敢，寒瑞森动手做了各种试验，试验了各种材料。\n\
    \n他发现，要隔热，材质就得“厚”；杯子厚，就没办法拿。既占空间又很难挑选。\n\n怎么办呢？\n\n陷入僵局时，他想到不应该只是盯着“主角”，是不是可以配个“角”，为杯子做一个“袖子”呢？\
    \ \n\n他发现硬纸板的隔热效果不错，因为硬纸板的表面有凸凹的浮雕花纹，有空隙可以隔热。\n\n于是，他以此为原料设计出凹凸花纹的“波浪”型纸杯，并花了一万五千美金，做了上万个杯子。这个杯子，像手一样，可以套住杯子，取名“Java\
    \ Jacket”。\n\n然后寒瑞森去找咖啡店里的连锁大星巴克。刚才我们说到，星巴克是环保杯子，来人，可以付清手的费用，除了不用杯子，成本也很低，以寒瑞森的杯套正是他们期待的“最佳配角”。\n\
    \n但是星巴克却得到独家授权，而且寒瑞森接受更适应、更低些的钱。就这样，寒瑞森和星巴克从 1993 年说到 1994 年，前后八个月，最后都没谈成。\n\n\
    于是，寒瑞森找到星巴克的竞争手 Coffee People，他们看了一模，立刻下了一个万订单。\n\n后来，寒瑞森参加西雅图咖啡展，接到 100 笔生意，这起到了隔热套的专利。\n\
    \n而星巴克呢，转向 LBP 公司，做出自己的杯套“Coffee Cation”，Basen 上的学习 Java Jacket，不同的 Coffee Club\
    \ 则是用瓦楞纸，Java Jackses 是用木头板。\n\n不过，大家是几乎把同热杯套，叫 Java Jacket，隔热套也几乎成了隔热杯套的代名词。\n\
    \n你看，在发明热咖啡杯套时，寒瑞森没有盯着主角，也就是咖啡杯，而是把注意力转向了配角，像一个搞杯子，不仅给自己创造了巨大的财富，也给这个世界带来了新的创意。"
