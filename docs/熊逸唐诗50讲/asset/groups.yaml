    \ | 为人作嫁的挫折感\n\n![](img/3e79664a0fdf78f5bd10a506f1206c1a_94_0.png)\n\n**秦韬玉《贫女》**\n\
    \n> 蓬门未识绮罗香，拟托良媒益自伤。\n> 谁爱风流高格调，共怜时世俭梳妆。\n> 敢将十步酬犀镜，伴把双眉待画长。\n> 苦恨年年压金线，为他人作嫁衣裳。\n\
    \n你好，欢迎来到《德胜·唐诗50》。\n\n今天留在职场打拼中的你，可能会有这样-种感受：自己懂事处事付出了很多，结果要么比别人差，要么不如对方。不如对方，要么不如，要么不如，要么不如，要么不如，要么不如，要么不如，要么不如，要么不如。\n\
    \n说实话，社会的运转有一套规律，不为谁，不为社会，而是在我们的天性中，存在着一种公平观念，天然认为相同的付出就换来相同的回报。\n\n比如生活中常常有这样的现象：你花一百元买了一件东西，它到值不值，既不在于价格本身，也不取决于这件商品给你带来的愉悦比不，更不在于别人对这件商品的态度，而仅仅取决于别人是否花钱买到同款。\n\
    \n经济学里最有意思的一个原理就是价值是主观的，它之所以最有意思，是因为主观感受可以无穷无穷，可以表现为因为一个女孩子就有一个开始婚姻的话，也可以表现为六月的天，孩孩子的改变，就是说变。\n\
    \n在万变中的不变，就是我们与生俱来的公平意识。这种意识不仅是我们身上有，就连猴子身上也有。猴子看到我们得到同样的食物比自已的多更好，哪怕自已得到的已经够好了，可以经济得到一些声大的马屁了，但是会暴怒如潮，不听话得，大声的哀鸣。\n\
    \n这种天性，会使很多在外人看来并不失败的人生产生严重的挫折感。如果我们好好去诗诗，就会诗诗词到快乐的话。我们在想思维，这样的诗在唐代时代可不缺少诗。秦韬玉写的《贫女》就是这类当中首屈一指的名作。\n\
    \n### 1. 时世妆\n\n诗的标题是《贫女》，写一个贫寒的女人，这是一个很容易想象的形意，但这并不重要，因为这个诗人是借这-形象来告诉我们。\n\n\
    开篇首先交代主人公的身份：“蓬门未识绮罗香”，“蓬门”就是穷家小户，这位女士生长在别样的家庭，一直过着清苦的日子，从没穿过高级的衣。\n\n转面到了谈婚论嫁的年纪，该怎么把自己嫁出去呢？“拟托良媒益自伤”，想想找一个靠谱的媒人，但愿意媒人有着自己的，媒人来给自己做媒，自己就嫁得出去吗？\n\
    \n贫女之所以会有这样的担忧，是因为自已长得丑吗？或者因自己不会干，工作能力不强？都不，她在这三点上都不是不可能力的。\n\n问题是下“谁爱风流高格调，共怜时世俭梳妆”，她很清楚自已虽然有各种各各的优秀品质，但这些品质都这个社会所看重的。\n\
    \n这两句诗被很多人小诗，我可能需要特别解释一下。“风流高格调”在今天我们常用的意思，也不是古人常用的意思，而是一个今天不太常用的意思，指的是文女人的一种装扮风格。\n\
    \n> 我中间这个句构比较有意思：像这样一首古律诗，中间两句分别对两句对，在而对仗的规则里，同位置的同字一定要性质相同。\n\n那么这两句诗里，“风流”对的是“时世”，你可以看到“不仕”不伦类，但白居易的诗里写过“风流高格调，时世眼妆”（《初梦诗一百韵》），还有“风流高眼妆”，也“时世皆”，“代饰诗一百韵前之之”，都是“风流”和“时世”对仗。\n\
    \n“时”是古代官女性名著名的名字，也称包脸，这个“俭”不是“节俭”的意思，而是和“修脸”的“修”相同，形容装束轻修。\n\n时世女装就是著名的装束轻修，包括把眉毛的化妆技巧，下面眉毛有一种装束，题目就叫《时世妆》，详细描述过这个装束的特点：\n"
  mdcn: "\n## 43 李白《行路难》三首 2 | 如果被全世界辜负\n\n**李白《行路难·其二》**\n\n大道如青天，我独不得出。\n羞逐长安社中儿，赤鸡鸣剑紫龙具。\n\
    弹剑作歌奏苦声，曳裾王门强悲。\n淮阴市井素封侯，汉相公卿尽室。\n\n### 讲解\n\n你好，欢迎来到《唐诗·唐诗50讲》。\n\n人在倒霉的时候会生一种错觉，相信全世界都在针对自己，身边的一花一草、一人一事都是天罗地网中的一个齿轮，无一怀着深深的恶意。别人的成功要么是运气好，要么多关系，要么，就是，是太无耻，总之都是不正当地手段得来的。\n\
    \n那些美好的人际关系，只能书上在传说中去寻找，而且要找到了，现实世界非但不去更变，还是天罗地网。除了保留一些所谓的外加铁甲外衣，否则谁都躲不出那光秃秃的刑场。\n\
    \n人性的这种特点，在李白身上表现得淋漓尽致。这一讲我们看他的《行路难》第二首，这首诗里的心境路径和很多人都曾有过。\n\n#### 1. 被全世界辜负\n\
    \n这首诗才一开端，就露出了宏大的格局：“大道如青天，我独不得出。”路明明很宽，很大一片呀，但自己偏偏就走不通，这到底是为什么呢？反思一下原因，原来错不在我，全怪别人不好。\n\
    \n别人都是谁呢？李白一个两个指给你看：“蓬莱长安市中儿，束马自缚缠紫绶。”最可气的是这些小“长安市中儿”，什么都不靠，只会斗鸡赌输赢。\n\n这就带出另一个社会背景：斗鸡，可以说成唐代的贵族会讲的社会游戏，上到皇帝，下到王公贵族，都狂热地迷恋斗鸡运动。风雨所及，斗鸡运动在民间同样如火如荼，堪称唐代第一位的国家级体育项目。\n\
    \n斗鸡场内，是鸡和鸡的生死搏杀；斗鸡场外，是人和人的输赢较量。竞技体育配备赌博，人类对此毫无免疫力。\n\n斗鸡既然成，在“国本，精通斗鸡的人自然名列无双。就在李白的时代里，有一个名叫贾昌的人，因博得唐睿宗和武后的垂青，以至于民间流传着一首民谣：“生小唯斗鸡，学文字，斗鸡去，卖马书楼，贾家小儿年十三，富贵荣华不可言。”\n\
    \n显然斗鸡赢得好彩头读书学诗，学斗鸡的结果比学诗还好，这就是李太白为社会树立了一个读书无用论的榜样：读书不如学斗鸡。\n\n但是说话就顺话，大家并没有意识到：任何一个处在权力顶峰的人，竞争一定是空前激烈的，成功的概率一定是微乎其微。\n\
    \n这就像今天的演艺圈，既有演技又没有才艺的偶像都可以拿到天价片酬，这确实很奇葩，但如果是真的可以，为什么许多有演艺又有才艺，却毫无演艺天分特别敬业的人就赚不到钱呢？\n\
    \n李白当然没有想过这么深，反正他是不满意，一且是“长安小儿”，言下之意是，“正是这些人用卑鄙手段挟持了皇帝的心，皇帝才注意不到自己。”\n\n李白这份怨气其实有点亏，因为他在另一首诗里还明说过：“我斗鸡，进连五百献”……（《易曰》的江陵宫词）那时他的自己也是斗鸡场中的一员，甚至可能是斗鸡赢钱的组织者，为此还开辟了北门禁军，被贬进宫。\n\
    \n大抵在李白的感受里，斗鸡马本身就是豪侠丰富本该有的性情，是斗鸡大赌马去博取荣华富贵，这是可以了。那些不仅喜欢斗鸡赌马还奢享华宴，还沉迷的人，不仅让行路难，就不仅可耻，而且可恨了。\n\
    \n控诉完了斗鸡小儿，李白马上拿治国的大冯道来做对比，自己入冯道官，开启君臣自怜的好模式：“弹剑作歌奏苦声，曳裾白玉不应称。”冯道被圣君的门客被重用，于是弹剑一事，一边发誓，一边提要求。\n\
    \n后来的事太过，萧瑟是众所都知道当中最有本事，也是最有名的一个，问题是，如果当代的孟尝君一直都不被现代的冯道，也就只能把此事搁到以终老。\n\n那么，当代冯道为什么一直不被重用呢？李白给出的答案是：“淮阴市井素佳俗，汉湖公卿旧士。”韩非子有发难的名场，背书市小儿与朝臣不信任的旧俗，生命被给夺。\n\
    \n李白又一次看到了当代的人，要么像“淮阴市小儿”一样说不出看透的恶人，要么像“汉湖公卿”一样，明知道是有本事，所以嫉妒我，排挤我。\n\n大家只要也可以排挤，其实也无所谓，只要皇帝欣赏我排挤我。但是，皇帝受了“淮阴市井”和“汉湖公卿”的裹挟，这能怎么办？\n\
    \n思来想去，还是怪皇帝不该怪。看看古代的明君圣主都是怎样重贤人的吧：“君君不臣时，黄金置箱，捐身归王无解药。”燕昭王筑黄金台真心换人才，子为了取代君王，先托老东家韩非，亲自抱着头去给老东家归乡。\n\
    \n君臣之间同心相印，毫无猜忌，这才赢得“剧手朝中朝中事”的旧俗，副手若为朝中事，朝中无复旧时情，莫为旧时情，朝中无复旧时情，朝中无复旧时情。\n\n燕昭王是怀才不遇的知识分子们最爱崇拜的古代明君，前不见雄霸的《蜀中女仙吟》也是用怀才不遇来借古喻今。但问题在，现下的“君君不臣时”哪里去，燕昭王没有了，还有像燕昭王一样的明君圣主。\n\
    \n剖举、乐毅那样的人才虽然从来不缺（比如李白），却因不被重赏，反而是羡慕项羽的决斗小儿为皇帝前的大红人，这人让人情何以堪呢？\n\n思想前后，怨总不想通；左顾右盼，也总是找不到出路，没办法，只能感叹：“行路难，归去来。”无论如何都得拿出前进，不想像海润河一样回到老地方了。\n\
    \n在这一句诗里，“归去来”的“去”和“归”都是动词，实际表达的只有一个“归”字。\n\n在李白的理想里，“归去来”是人生的极致目标，就是功成退休之后归隐到田园山水的清福。但是首先要有“功成”，然后才能“身退”，否则和普通的隐士有什么区别？\n\
    \n没等功成就先退休，这是彻底放弃人生，是彻底不能甘心的人生。正因为对人生不甘心，所以才会发出，说出“大道如青天，我独不得出”这样牵强到哭的话。\n\n不过，让李白不满足的还有，即使退隐田园，也是他想要的，而是被皇帝赶回去。朝廷也真真地露出了黑霸王觊觎黄金台的嘴脸，皇中终于等来了英雄用尽之时。\n\
    \n接下来的事情大家都知道了，他在政治上的失败决他的感情，都得不有始无终的话，最后落得“世人皆怨欲”的境地，被流放剑远夜阴。\n\n流放后，经过白帝城的时候，他侥幸地“朝发白帝彩云间，千里江陵一日还”去了。\n\
    \n昔日那个挥金去，豪情万里的年轻人忽然变成了一个满脸老朽的老者，眼看着楼窗想望云楼又燃起了一个活生生的生命，即将在冷水重数复夏场。\n\n他死在安徽当涂，传说是在水边饮酒解忧，为了打捞沉入水中的自画像而跌落的。这真是一个‘富于隐蔽色彩’的冷笑话，却比任何记载更多了几分诗人的真实。\n\
    \n### 今日得别\n\n《行路难》三首的第二首换了一种吐苦水的方式，从“大道阔直夫，我亦不得出”的慨叹开始，一路怨怼着苍生不公、环境怀才者的没落，到结尾发出“行路难，归去来”的一声叹息。\n\
    \n李白的惊惧，第一来自缺乏自知之明，第二来自食古不化。\n\n### 今日思考\n\n你觉得李白的这种惊惧在今天还会普遍存在吗？\n\n如果你在一个运行平稳但略呈沉沦的大机构里做事，也有怀才不遇的感觉，有英雄束手无闲的苦情，那么当你面临前途不明、未来不定的小机构时，会有一份“雄飞”或“高英自生”的时候，你会有同样的勇气吗？\n\
