  md: "\n## 今日思考\n\n这两首诗常被视作是他们俩“别”出了寄托？是的，读者们可能没注意到他们读出来的是什么大相径庭。但李商隐确实对爱情和现实表现出惊人的力量和细腻的诗歌不仅感到，甚至带着热切。\n\
    \n到底是不是真的，不惜承受世俗的嘲讽，甚至身败名裂等？还是默默地接受，从此悄然不可说？用轻忽的冷水烫灭滚烫的火，算好？这不是容易做出的选择。\n\n邦妮和克莱德勇敢地生活在了一起，这是一切悲剧的开始。悲悲切切地告别了希特勒和利夫，这也是切，你希望你的恋人会有怎样的态度和心态呢？欢迎留言区分享。\n\
