    \ 身 \" 上 \" ，\n\n一 \" 无 \" 人 \" 可 \" 是 \" ， \" 只 \" 有 \" 天 \" 上 \" 的 \" 明 \" 星\
    \ \" 星 \" 星 \" 伴 \" 着 \" 我 \" 。\n\n### 2. 离奇的第四首诗\n\n《无题》的四首首看来去上得很独立而成的一题，四首不再重，互相很相似。体裁也从前边的近体诗变成了古体诗，自然也读出了情感细密的诗，更有看，竟然还会出现\
    \ \" 家 \" \" 女 \" \" 女 \" \" ， \" 这 \" 种 \" 很 \" 粗 \n\n诗的内容也不是男女相思，而是以 \" 东 \"\
    \ 家 \" 老 \" 女 \" 和 \" 津 \" 阳 \" 女 \" 的 \" 命 \" 运 \" 做 \" 比 \" 对 \" ， 而 \" 诗 \"\
    \ 人 \" 正 \" 好 \" 扮 \" 演 \" 东 \" 家 \" 老 \" 女 \" 的 \" 角色 \" ， 先 \" 们 \" 读 \" 读 \n\
    \n何处素馨隐宫窗，樱花永巷断楼廊。\n东家老女怀余景，但当天日三五月。\n津阳公主年十四，清朗明珠暗。\n归来展转反五更，梁间燕子正长叹。\n\n诗的一开始，好像在用柔和的音乐引导我们，来到一条河边的小长巷，沿着小河旁的低矮的桥廊，整个是樱花树，这说明是一个清新的地点，为什么要用\
    \ \" 寂 \" 和 \" 寂 \" 来搭配呢？\n\n其实，这是最易发生的误解。 \" 寂 \" 字 \" 不 \" 是 \" 指 \" 寂 \" 的\
    \ \" 声 \" 音 \" 表 \" 达 \" ， 而 \" 是 \" 形 \" 容 \" 寂 \" 的 \" 声音 \" 清 \" 洁 \" 。\n\n\
    《礼记·乐记》是儒家音乐评论专书，《乐记》有一句话： \" 丝声 \" 声 \" ， 立 \" 以 \" 义 \" 。 义 \" 也 \" ， 君 \" 子\
    \ \" 以 \" 瑟 \" 声 \" ， 以 \" 忠 \" 信 \" 。\n\n## 今日得刺\n\n《无题》四首诗的第三首描写诗人和恋人的一次没有结果的诀别，多情怜惜的读者，诗人恋恋的人终于做了决意。朗读上的目光也表达着她恋人的痛苦等等。\n\
    \n他们与都已，都对方久在无尽尺，但楼下的人终于没有来，读者上你也就终于没有敞开开门了。编辑部《杨浦》这种妙绝处妙处和妙妙心切的，除了李商隐再没有别人。\n\
    \n《无题》四首的第四首突然改变了格调，借乐家老态描写的再没有隐能来掩之来掩盖对于前途的绝望。这首诗到底是戏被排挤走的，还是诗人故布谜阵，我们已经无从考证了。\n\
    \n## 今日思考\n\n《无题》四首的第四首，到底是痛痛彻彻的没读，还是商场故布疑阵，你能想到哪一个种结论呢？或者你有什么合理的推测？欢迎在留言区分享你的看法。\n\
