    这首诗的题目是《与史郎中钦听黄鹤楼上吹笛》。虽未涉及具体的乐理知识，如琵琶的定弦等，但内容紧扣唐代乐事。诗题中的“迁客”显然是指被贬官降职的人。李白虽自称为迁客，但他说放眼中原并非只有迁客，还有夜郎之人。


    李白在武昌黄鹤楼向西眺望，既看不到长安，也望不到四川的家族和曾在峨眉的生地。而且，“西望长安不见家”字面上看，暗示自己的家就在长安，但李白的家当然不在长安。


    “江城五月落梅花”，这句诗里的“江城”就是武汉，是一座南部城市。五月正值初夏，梅花却要冬天才开，五月的武昌怎么能落下来梅花呢？


    短短四句诗竟然有这么多不合理的地方，但只要从另一个角度来看，不合理会通变为合理。


    “迁客”和“长江”搭配，暗示的也是已熟悉的长安。李白这里讲长江是遥远自由，暗示自己既有志业又有才华，却被远谪贬官。


    “西望长安不见家”在意思上和我们已经熟悉的“长安不见故人”一样，“长安”是政治中心的代称。李白自己不向朝廷低头，但朝廷却不是自己的安身之处。


    笛子曲里有一首《梅花落》。“黄鹤楼中吹玉笛，江城五月落梅花”，指的就是这首曲子。曲中吹落梅花，让人仿佛看到了落满花瓣的景象。


    更深层的解释是：正因为“一为迁客去长沙，西望长安不见家”，所以即便在初夏的五月的江城，诗人也感到了梅花季里的意蕴。但这层深义太不明显，也许是后人的过度解读。


    这就是唐诗的特点，语言有余，尤其是感情的表达。


    即使李白在诗里保持高昂且不羁的情调，但到底意味深长。这样一个被千里流放的人，早在旧年的愁苦当中把长安当成了家园，有家的旧思与感发更深。


    这时候对比一下他早年写下的《春夜洛城闻笛》：“此夜曲中闻折柳，何人不起故园情”，简单说就是人生出现战乱或离乱的感觉。


    ## 今日得列


    李白写过的闻笛有感的诗，以《春夜洛城闻笛》和《与史郎中钦听黄鹤楼上吹笛》最有名，它们分别代表诗人在不同年龄段对思乡与故国的不同认同感。


    每个名篇中，以《折杨柳》和《梅花落》最有名，我们会在诗词录里反复听到它们的名字。


    《折杨柳》的曲调原自北方少数民族，折柳歌的传统源远流长。长安的柳树，作为有着各种情绪调和、和谐和关联的植物，所以特别为诗人喜爱。


