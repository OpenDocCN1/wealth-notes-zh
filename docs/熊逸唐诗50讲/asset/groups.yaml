    \n雨果在最后也忘记交代一下佩斯兰的结局：“他也得到了一个悲剧的收场：他结婚了一个。\n\n### 实与虚\n\n前边讲过，唐诗的题目一般很务实，到了正文再来务虚。这样有一个好处，就是务实的题目会给务虚的正文框定一个合适的解读范围。\n\
    \n比如题目里说这首诗是写给某位闺人的，那么你读到正文里的美人香草之类的意象，甚至“相思”之类的字眼，就不会往爱情的方向理解。\n\n诗人们为了把诗歌的原因后果交代清楚，让读者不至于误解，有时就会把题目取得很长。\n\
    \n比如白居易，一边讲诗题是另一，而丝月有，一兄弟，各色人在处，因里有， 所求那什，奇上浮梁人兄，于（yu）就七十，马十二骑，卖货商百 50 个中，而歌之文又\
    \ 56 个字；\n\n还有一首《元九尚书部时，多与诗为唱和（hè），多为伤古，因题于墨，题于卷后》，就像写家文一样，时间、地点、人物、起因、经过、结果，一般交代清楚。\n\
    \n为什么会这样呢？因为诗歌在古代是有社交属性的，是为了社交大部分的写歌都是社交工具，甚至不以文为尚的，承载着丰富的社会功能。所以这样的诗，本质上是一种沟通工具，而公关语言必须满足一个前提，就是便于理解、便于沟通。\n\
