    # ## 白居易《长恨歌》


    汉皇重色思倾国，御宇多年求不得。


    杨家有女初长成，养在深闺人未识。


    天生丽质难自弃，一朝选在君王侧。


    回眸一笑百媚生，六宫粉黛无颜色。


    春寒赐浴华清池，温泉水滑洗凝脂。


    侍儿扶起娇无力，始是新承恩泽时。


    云鬓花颜金步摇，芙蓉帐暖度春宵。


    春宵苦短日高起，从此君王不早朝。


    承欢侍宴无闲暇，春从春游夜专夜。


    后宫佳丽三千人，三千宠爱在一身。


    金屋妆成娇侍夜，玉楼宴乐醉时醒。


    姊妹侍官皆赐号，可怜同恨独生前。


    遂令天下父母心，不重生男重生女。


    骊宫高处入青云，仙乐风飘处处闻。


    缓歌慢舞凝丝竹，尽日君王看不足。


    渔阳鼙鼓动地来，惊破霓裳羽衣曲。


    九重城阙烟生处，千乘万骑西南行。


    翠华摇摇行复止，西出都门百里的。


    六军不发无奈何，宛转蛾眉马前死。


    花钿委地无人收，翠翘金雀玉搔头。


    君王掩面救不得，回观血泪相和流。


    黄埃散淡风萧索，云栈斜阳登剑阁。


    峨嵋山下少行人，旌旗无光各零落。


    行宫见月伤心色，夜雨闻铃肠断声。


    天街踏尽同庭树，此度陇桥断肠死。


    天长地久有时尽，此恨绵绵无绝期。


