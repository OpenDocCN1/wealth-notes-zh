    \n# 18 戴叔伦《除夜宿石头驿》\n## 旅途中的一盏孤灯\n\n戴叔伦《除夜宿石头驿》\n\n```\n旅馆无良伴，寒夜独可亲。\n一年将过腊，万里未曾旋。\n\
    客鬓衰添白，乡心淡处新。\n愁颜与衰鬓，明日又逢春。\n```\n\n你好，欢迎来到《唐·唐诗50讲》。\n\n长久羁居异乡，或者常年奔波在旅途之中，无法回家除夜，古人或把这样的情形称为羁旅。在羁旅生涯当中，往往只要一盏抹微光便能动人的悲怀。\n\
    \n这一个单元里，我们来读几首羁旅主题的诗。有戴叔伦的《除夜宿石头驿》，写出了一个即将年底、万里未归人的名句，亲吻千古的乡愁；还有李商隐的两首诗，《关庙山》写两地离别的思念，《春日偶成独城市》让一股声成为所有乡人的催泪声。\n\
    \n当然，谈到羁旅，也少不了温庭筠的《商山早行》。读读这首诗，也许更能理解古人为什么漂在路上。\n\n回家过年，这几乎每个中国人都经历过的经历。即便年底真有那样的交通压力，可即使你在千里之外的异乡，你也会通过各种交通工具赶在除夕之前回家，和家人一起围炉守岁。就算真的赶不到家，至少还有电话和视频可以帮你。\n\
    \n但古人就没有这些条件了，一旦背井离乡，回家就是一条漫漫的山水的旅程，平时是没有任务快速返乡方式的，只有书信，也不知道能否寄到，也不知道一封信到目的地在路途上耽误多久。\n\
    \n就算踏上了回家的旅途，心里也总是盘着，不知道自己离开了这么久，家里会不会发生什么变化，从才会写\"近乡情更怯，不敢问来人\"这样的话。\n\n我们必须知道古人的平均寿命很短，古代医学也远不像传说中那么神奇，即便是高门大户出身的青年仕，也很有可能一半是平常的寿命，生命，小孩的夭折是最常见的现象。\n\
    \n古人生活中的不确定度远高于今天我们，所以他们才会格外不能分离、渴望团聚，疏散会因此成为古代诗歌里最常见的主题。\n\n这一讲先从中唐诗人戴叔伦的名作，被誉为“唐诗中除夜之绝唱”（胡应麟《诗薮》）的《除夜宿石头驿》说起。当我们的人生进入不随心的旅程，诗歌就会成为最好的宽慰。\n\
    \n## 1. 孤独的除夕\n\n我们先看一看这首诗的题目：除夜就是除夕，石头驿，就是驿站的名字。这首诗是戴叔伦晚年写的作品，当时他在江西做官，大约要取道长江返回江苏老家过年。\n\
    \n时间已经到了除夕，他却滞留在半路上，独自在驿站过夜。所谓驿站，唐代的官方旅行机构在驿站，通过安排人员与马匹向外界供马，私营旅社称为旅馆，完全商业化。\n\
    \n诗的题目要落实在实背景，所以诗人强调住宿的具体的驿站；而到了诗的正文，诗人往社会类实，所以戴叔伦将“旅馆”这个词代替了“石头驿”。\n\n于是，任何在旅途中住酒店的人都更加直接地以诗句中间告他们：\n\
    \n```\n旅馆无良伴，寒夜独可亲。\n一年将过腊，万里未曾旋。\n客鬓衰添白，乡心淡处新。\n愁颜与衰鬓，明日又逢春。\n```\n\n今天到了春节时期，大城市往往太空无一多半，各街区的街道也是冷清清的。唐朝的情况虽然没有今天我们这么发达，到了除夕，该回家的人通常已经到了家，和家人一起守岁，旅馆里边也不会有几个人了。\n\
    \n戴叔伦偏要在旅馆里边度过除夕，当然就零零寡只一个人，只注视着房间里的灯火，那是自己仅有的同伴了。\n\n\"旅馆惟相伴\"，一个句间，表示人独自生活，\"\
    寒灯孤青伴\"，只有唯唯的一盏灯太相住，这既是荒寒的现实，唯一一点光亮。\n\n接下来的两句是全诗的精髓，点古中传诵的名句：“一年将过腊，万里未曾旋。”除夕是一年的最后一夜，过了今夜就是新的一年，而在团圆的年节过程中，诗人却没及时回家，也不知道何时才能到家。在这样的对仗里，忽然涌出归乡悲思。\n\
    \n其实从江西到江苏，路途并不很远，\"万里末日\"看似过于夸张了，但借用古汉语造成的诗语言有着很大的模糊性。\n\n一句\"万里未归人\"，我们既可以理解为诗人已经漂泊万里千里外，至今还未能还回家；也可以理解成心里愿意走的\"\
    万里\"，和家乡的地理距离已经不远了，但 because 除夕的缘故，会让人产生天地悬隔、咫尺天远的悲心。\n\n因为伤心，所以反证，“客鬓衰添白，乡心淡处新”两句似乎是驳驳，明明已经鬓如霜的鬓发了，自己还应该会愁思和衰老当中振作起来呢？\n\
    \n但全诗下来的意思，我们只要觉得啼哭\"明日又逢春\"下诗意是故作欢欣，只是一种反语。忧愁还会更新，衰鬓还会更衰，怎今年除夕都不能属于自己，来年的春思又怎可能属于自己呢？\n\
    \n## 2. 佛里的孤灯\n\n羁旅之中，最自目的意象就是孤灯。白居易有一首《除夜宿寒驿》，用相似的意象写出同样的愁苦：\n\n```\n感时思伯未，不获言生事。\n\
    万里思亲处，孤灯伴此宵。\n病非新旧日，归思逼新正。\n望里教老远，羁离长此心。\n```\n\n诗人和兄弟分别多年，除夕夜不能团聚，对着一盏孤灯不禁悲思生发，无法入睡。\n\
    \n第三、四两句是组很经典的对仗，“经年”是第二年的意思，“万里”对“孤灯”，“经年”对“此夜”。\n\n用最大的数字对最小的数字，用漫长的时间对短暂的时间，因此，显得孤独格外的，孤孤单单的，孤苦。\n\
    \n如果常年羁旅漂泊、流浪江湖，和亲家疏离多离，孤独几乎都是每个夜晚的唯一陪伴，这一点光明也显出无限凄凉。\n\n宋朝诗人黄庭坚写过一个名句：“桃李春风一杯酒，江湖夜雨十年灯”，自己和好友曾经在桃李春风下把酒共谈，一分别转眼就过了十年，两个人在不同的轨道上各自适应着定定的生活，度过了多少个只有孤灯陪伴的夜晚。\n\
