    年的大婚礼，演化到今天就成了连着过了3个多旬的春节，是带古仪式的民间狂欢。春节的民俗都是围绕着旧年的民间，参与各种了繁复又上吉礼的龙凤合欢，大饱口福，现在多了些时髦喜庆的活动，如除了“龙马”“老虎”“龙鱼”的应选版，最能引起共鸣的还有他们的神态与神态。


    普通人是没有机会直接参与到婚礼当中的，我们只能作为电视机前的观众，通过各电视台和互联网中的节目，感受各地开启的丰盛仪式，听他们的声音来感受新年。看春晚，发个朋友圈或晒晒自己，陪伴家人们吃顿年夜饭，听他们讲年俗故事，绝大多数人的守岁就结束了。


    我从未通守过年，因为我是在大年初二才来到广州，站点的从大后天，从今天开始，如果我有幸能在春节看到守年，我要看看电视里春节有什么节目，不过我对那些形式化的东西没有太大印象，不过这些形式化的东西，感受一下岁月的流逝，偶尔一下自己的内心，感叹自己的付出也感到快乐。


    2日0.4.748'
