    ；\"我欲因之梦吴越，一夜飞度镜湖月\"。\"欲渡黄河冰塞川，将登太行雪满山\"；\"抽刀断水水更流，举杯消愁愁更愁\"；\"人生得意须尽欢，莫使金樽空对月\"\
