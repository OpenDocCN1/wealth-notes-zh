    # 今日得到


    《行路难》是乐府旧题，感念失意，感叹道路难行，引申为人生歧路，多处梗概。唐朝文人用这个题目，通常都借这个题目来抒发，唐朝时期的景况也是借题发挥了这个题目来书写诗，表达修行的艰辛。


    李白的《行路难》三首，用宏大的意象和纵横捭阖的大文笔尽情挥洒。


