    # 用户留言


    **李盈** (26)

    记得有句话：“你的样子，有可爱的书，有遥远的远方，看着远方的风景，读着读的书。”这完全是可以解释，为什么李颀是形成卓卓卓卓成和批判历史的诗歌风格。


    在成长的路上，不止是有鲜花和掌声铺垫，更多的是挫折和困难，人生不如意十有八九，一切事情都可能一帆风顺，成长就是挫折，痛并快乐着。


    也许诗人在风雪中，看到了一些人们开拓的人生。实际上，大多都到了成功顶峰后的文学，那才是真实的人生，那不是教科书里写的文学。


