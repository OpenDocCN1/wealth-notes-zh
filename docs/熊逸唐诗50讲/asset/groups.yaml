  md: "\n## 32 李商隐《碧城》三首21 禁地之恋\n\n你好，欢迎来到《颜歌·唐诗50讲》。\n\n这一讲我们继续梳理《碧城》第一首诗里的冷僻意象。先来复习一下这首诗：\n\
    \n```\n碧城十二曲栏杆，头角端枭锦带官。\n宝月夜开莲眼静，女真香断玉龙寒。\n霜晴野落当开眼，雨过溪湍涨碧澜。\n若此晓珠犹又定，一生长在水晶盘。\n\
    ```\n\n这些意象勾勒出真正的女神气质，归纳起来只有两个字：高、冷。自古至今，当人向往的女神都是高冷的。这是来自天空佳人的道理，所以放在今天照样适用。\n\
    \n女人如果不高不冷，就容易激发男人的征服欲。而在热烈的爱情里，征服从来都是必不可少的。\n\n### 1、没有温度的人间仙境\n\n三国时代的嵇康是当时很闪光的一位知识精英，他聪明，也很有学问。他写过一篇《养生论》，探讨长生不老的问题。他整体很显然对长生里谁也没有见过神，但各种图画、史书里记载过那种神仙样子的总，不可能是瞎编的，所以说神仙一定存在。\n\
    \n我们不该夸嵇康，因为他那时候还不知道人们很容易相信自己愿意相信的东西，市场也特别喜欢满足人们的期望。如果大家都希望地球有两个月亮，那关系到第二个月亮的理论一定会有很多很多。\n\
    \n如果你像嵇康一样喜欢古籍，你会发现关于神仙的奇闻轶事一样记载的很多，相关的记载甚至还可以彼此印证。\n\n比如有一本叫《述异记》的书，说海里有一种神名叫山，名叫赤龙洞。如果把它的耳朵取下来，放到房间里，房间从此一尘不染，再也不用打扫。\n\
    \n还有一本叫《岭南异异》的书，说蛇之属的角被发现用作干净的牙齿，女子涂上这种发青，头发永远干净又亮，再也不怕洗头发。\n\n《杜氏通仙记》也是一本书，说唐玄宗会昌五年，（841年），会昌国卖了一种红色的玉石，叫女牛玉，能发出红光。如果你拿它往器皿里滴满清水，再拿几块玉放到底下，那么很快冷水就会沸腾。\n\
    \n正经一些读书人会咨询这些故事，有学者“子不妄传”之乱，这是古籍，但奇闻异事是很有说服力的。李商隐喜欢读这类书，所以写诗才会有些特特的形象和语言风格。\n\
    \n在《碧城》第一首里，开篇：“碧城十二曲栏杆，丹凤空上端枭官”。简要交叠成双雄城的风格，这种用尾巴的尾巴，还有奇异的异宝，用犀牛角而不是扫麈和拖地还有巨，用火玉而不是柴来取暖。但有什么奇怪的呢，仙家难道不应该是这样子吗？\n\
    \n仙缘当然应该是这样子，但双雄里边一定不是这个样子的，李商隐的《碧城》三首是写观道生活的。\n\n这就是诗歌的艺术，用话接事实的很来说成文字表达，于是诗仙好像写的完全在道观和想象里的仙宫云岛。仙宫云岛一样的仙宫云岛，让人觉得虚的一笔也许是写实，做梦似真，让人难忘。\n\
    \n接下来的两句继续写仙宫：「阁夜有书斜鹤，女真无树不栖鸾」。阁夜和女真是神仙们的两处仙宫区。\n\n你对阁夜也许会很陌生，因为《红楼梦》里有一个是阁夜仙宫，一个是灵虚玉无瑕，林黛玉的世就是阁夜里的一座炼丹房。阁夜的金云叫羽灵之苑，坐落在昆仑山上，是西王母的住处。\n\
    \n女床并不是女人住的，而是女仙山——座仙山。\n\n「阁夜有书」，这里的书不是书籍，而是书信。仙鹤是道教的使者，当信使捎了之后，系在仙鹤的腿上，它送到收信人的手里，这就是「阁夜有书斜鹤」。\n\
    \n而女床上树，根据《山海经》的记录，有一种凤凰，叫青鸾，也叫青。每一棵树上都有鸾凤栖息，这就说「女床无树不栖鸾」。\n\n在道观的世界里，禽往往象征君臣。那么，阁夜里的这些信是神交给这些君子的吗？或者，是写给这些君子的吗？里边到底说说了什么呢？\n\
    \n道教仙有那么多，诗人为什么会偏偏选了女床山呢？又写的是仙女，为了收编仙山，也省了一“山”字便保留了“女床”这两个字吗？阁夜和女床是不是真的有彩影封？因为山看上去像是分别指代男道士的住处和女道士的住处。\n\
    \n但如果阁夜真是阁夜，女床山真是女床山，神仙们每天过的日子就是「雨凝海落当开眼，雨过溪湍涨碧澜」，窗外的雨会纷纷洒下，还可以看到窗外雨水过溪河源头的景象。\n\
    \n李商隐是一个非常精于典故的人，这一组对比充分见出他用典的功力。「雨」真的是一对双源的源头吗？旁边边注说，周院有昆仑之高，蜀唐人认为那里就是黄河的源头。\n\
    \n但黄河的源头又说明黄河，又有一部古书《河图玉册记》，说汉朝打通西域之路的名将张骞经常派进关里去探源寻河识，不知不觉一路走到铁门，还见到了牛、织女。\n\n\
    那么继续探究下去，就可以从黄河之源来到银河，这也就有「昆仑海落当开眼」，银河好像春天可以大海岸，这样的奇观，凡人不敢想象，却更添神性的日常。\n\n诗的最后两句特别让人迷惑：“若是晓珠犹又定，一生长在水晶盘。”晓珠是什么，水晶盘又是什么？这样只引出这两句的诗，解读者只能从每种意象上可以申出到这两句诗，对整首诗有不同的理解。\n\
    \n在我的理解里，当「晓珠」和“水晶盘”两个意象联系起来的时候，我就可以推断，这应该是来自汉或宋的一则歌诀：\n\n```\n汉武帝曾在宫里建造过一座水晶室，顾名忘义，高阶六尺可以云开。又在天然水晶上合承雨露盘，天上来云星辰天的寒露在组合成水珠，和玉石的阵一起服用，相信这样可以成仙。\n\
    ```\n\n唐朝诗人王昌龄写过一首绝句《甘泉歌》：\n\n```\n紫泉望上仙药，雨沾古衣香雾湿。\n时逢玉井冰净，万年长在水晶盘。\n```\n\n这首小诗让汉武帝开水晶宫的场景再现。但在那个充满玄幻的水晶盘里，真的有所谓「万年甘露」吗？甘露一定是有的，但那一滴雨水也并不会长生。\n\
    \n在李商隐的诗句里，「晓珠」就是露水，「水晶盘」就是承载，露珠晶莹剔透，露珠一样动人，无水，不长生。\n\n「若是晓珠犹又定，一生长在水晶盘」的意思是：\n\
    \n如果露珠可以长生，那就说明神仙之遭并不荒唐，那么在水晶盘下耗费一生，天天窗风览道，这样的牺牲一点值得。\n\n但是，露珠既然不能长生，神仙之遭也不一样的虚幻无望，为之不过虚耗青春，青春都是无法的，究竟又怎能值得？如果花半辈子的功夫，不如去追求清规戒律的太玄观，只想做耳畔清露里的小仙童，也许算不得难过。\n\
    \n当然，这些意思诗人都不曾说，但只要读懂了「珠」和“水晶盘”的难题，就不自己提出了这些问题，转而想要现里的青春是不是虚度？\n\n“碧城十二曲栏杆，丹凤空上端枭官”是问有没有女神，对于不高冷的人情？「阁夜有书斜鹤，女床无树不栖鸾」的歧义是观是否有意，是不是非该该遭遗弃，反不应该被祝福呢？\n\
    \n### 2、修仙的迷狂和诗人的态度\n\n这样的意思看上去很有实际的意味，但在道观里迷了青的上去到底实并不相信神仙。\n\n在李商隐生活的时期里，唐宗宗用道金丹发了疯，被官吏害死，外孙宫道是金丹丹死的；唐穆宗是真是服金石亡，唐宪宗也是个金丹狂人，在脱胎换骨的修道里真正的脱胎换骨，只不过是从正常人变成了喜怒无常的疯子。\n\
