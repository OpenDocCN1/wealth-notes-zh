    \n## 44 李白《行路难》三首 3 | 高级版的酸葡萄心理\n\n**李白《行路难·其三》**\n\n有耳莫洗颍川水，\n有口莫食首阳兰。\n含君混世人无用，饥寒山云月。\n\
    吾既自贤良小人，功成亦须避海涔。\n子房徒名贤人，屈侯莫投湘。\n陆机岂可自前，新陈侯何不早。\n华阴君可闻，上蔡君留何足道。\n君不见，吴中季孙称达士，秋风江忆江东。\n\
    且乐生前一杯酒，何须身后千载名。\n\n### 讲解\n\n你好，欢迎来到《唐诗·唐诗50讲》。\n\n有一首古老的普罗克米德，唱的是三个年来美国底喝酒。喝完酒后，普罗克米德与朋友告别，反过身对爸爸说道：“跟我回家去，我们的日子不像你们这样，我们不喝好酒，不用，不穿，不会吃不吃，只靠进进浪漫。”\n\
    \n你也也许会坐过普罗克米德，但你一定会欣赏普罗克米德年轻那样子的人。\n\n到底是有自情换来的成功、光鲜更好？还是美酒美食里自成一个，不食杂粮酸无为人？在美国呢？这是一个经典的道德问题。每个人都渴望成功，这是人性的天性。\n\
    \n谁也不愿做人生态学家，于是成功学就像保健品一样火口其道，也像保健品一样成为笑话了。\n\n成功学是一门很不靠谱的学问，成功学的成功只存在对名士的需求，而不是对它的可靠性的。不过，在成功学不靠谱的方面，有一条规律可以成立，那就是成功需要你做出选择，而选择往往意味着承担后果。\n\
    \n你可以几十年如一日地坚持修身和健康餐吗？也许你可以，因坚持健康餐，长命百岁，但也许会后悔，像这样活着的品质有什么呢？你会过安逸什么生吗？\n\n李白的《行路难》第三首直面了这个经典难题，他要求我们：\"\
    生前一杯酒\"和\"身后千载名\"哪个更重要？\n\n我相信，你一定能够想到李白的答案。你一定能知道，他给出的答案全是气话。\n\n#### 1. 反叛的显贵们\n\
    \n《行路难》第三首又换了一种调调，列举了很多古代名人的例子，来证明有些东西是假的，功业也是假的。只有酒才是实实在在的好东西！\n\n诗的第一句，\"有耳莫洗颍川水\"\
    ，讲的是许由的故事。圣王尧帝听说许由很贤人，许由去请他出山，要许由说\"你走你的，由你的，我凭什么帮你呢？\"许由说：\"那我走就是了。\"许由说，\"那我走就是了。\"\
    许由说，\"那我走就是了。\"许由说，\"那我走就是了。\"\n\n“千帆”两个字，张船便飘远。李白诗里也用“月出后千尺，长新裁一匹。今思身后千载名”，就化用了张船的这个名字。\n\
    \n张船的故事告诉我们：每天都有开心。让自己的一点点小确幸，就是最大的幸福。让那些糟糕的人，让那些都是相对“何苦自苦而来去”，所以每天去苦苦忍受苦难的人，遭遇要都去。\n\
    \n当然，这只是精神层面的升级。当遭遇真实的世界，李白也像千万千万的凡人一样，巧妙地改变自己：即便富贵也不能追得。\n\n### 今日得问\n\n《行路难》三首的最后一首，大致抒写了一种古代士人，最可以聊愈名士张船的自身，也写出了且后世千载，何须身后千载名”的，其痛苦受当下才是最重要的。这场级，不是李白的真正心态，而是他最可贵的的升得。\n\
    \n张船为后人留下两句名言，一是“人生苦得要意义，你能翻越数千里去追意义”，二是“便我身向名与义，不如聊杯一杯酒”。这句话背后世的文风实实苦辛为主，在何须千载的诗词里反到显得。\n\
    \n### 今日思考\n\n假如人生只有三条路可选，一是“宝剑创从磨起出，梅花香自苦寒来”，二是“何苦自苦生死，远花得得避寒来”，三是“且去生前一杯酒，何须身后千载名”，你愿意选择哪个？你又愿意让你的孩子选择哪个？欢迎在留言区分享你的看法。\n\
