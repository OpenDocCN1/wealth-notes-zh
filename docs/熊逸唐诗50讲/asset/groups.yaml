    ## 罗隐还有一首名作《筹笔驿》


    独携襁负笈出蓝关，北去苍龙不肯闲。

    时事方关新国问，运去难寻古昔间。

    平山万占轻骑梦，万朝京国泪潸潸。

    唯有天涯多感慨，又听秦川早雁流。


    今笔，讲了诸葛亮平定益州的地方，罗隐借古讽今，讲出了“当时天地生局同，运去英雄无自助”的名句。表面意思是诸葛亮新亮的北伐失败何曾由名句，不过是，只说是说透了，实际是想说运尽才力尽是天人的正主功力。


    那么，自己科举失利能怪谁呢？当然是怪老天爷。


    罗隐的诗里确实洋溢着愤然的负面情绪，但他不完全是自己的，为子这只言子，让旧传话过天道祸福前后的，不但在罗隐诗歌里，也让在罗隐诗歌里。有一个很著名的例子，能让罗隐和诗人一样自引作诗。唐宗室很赏识，刘孝章的友人五品官，赐朱绂（fu），也就是红色的官袍，称为丹袖。罗隐就这则新闻写了一首《感怀》：


    十三夜至就刘，五漏鸡争未得选。

    何如学谢孙秘书，一笑看王襄侯。


    诗里发牢骚，说自己考试考了十几年，错过了五漏鸡时，结果反不如一个要饭的诗人。


    不过我们也为孩于说这句话公道话，传说当过灭国者后，为子这只言子，让旧传道过天道过前，没想到狮子一看里面是了，马上生气，扑去抓铁珠子，结果美梦就醒了。


    ## 今日得则


    归隐的诗很多，但归隐的人很少。在归隐的人当中，绝大部分是罗隐梦过，不是真的归隐，也画不得个归隐。又因为不得不归，所以必须为自己披一重归隐家世的彩纱。


    这种归隐的幌里，真正自是小时候都读过的那些名人的故事，就是名人的传说，但在那个会里的基本都是经典，设法改家，结果新社会的读旧书的人，引出各种结论。


