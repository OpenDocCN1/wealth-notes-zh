    \n## 33 李商隐《碧城》三首31 一封炽热的情书\n\n![](img/3e79664a0fdf78f5bd10a506f1206c1a_69_0.png)\n\
    \n## 李商隐《碧城三首·其二》\n\n```\n对影闻声已可怜，玉池荷叶正田田。\n不逢叶晚留，莫让洪兰又拍肩。\n紫风放娇衔错语，赤鳞群舞报清涟。\n\
    鄂君长想月中夜，绣被焚香独自眠。\n```\n\n你好，欢迎来到《墨鱼·唐诗50讲》。\n\n请先看一首名诗，一句不以结婚为目的的恋爱都是耍流氓。然后咱们想想情爱的大本质是什么，爱情的本质又是什么，两者在哪些地方合适，又在哪些地方不合适？\n\
    \n### 1. 对影闻声的风凡天涯\n\n《碧城》第一首像是从旁观者的视角写出来的，第二首换成恋人的视角。\n\n如果你读不懂诗里想象的形象，至少也可以朦胧地感觉到欢喜、思念、嫉妒、疯狂、纠结这些热恋中的人通常有过的心情。\n\
    \n如果你读不懂诗里的形象，你就会发现这首诗不得不靠一些解释性逻辑解读，它就跟一封男人与女人写的炽热的情书，因为变得太露骨，连修辞都显得不起来了。\n\n\
    开篇“对影闻声”，是说“望着你的身影，听着你的声音”，有一种死不见得，可遇不可即的意思。“可怜”的意思和现代汉语完全不一样，意思是“可爱”。\n\n“对影闻声已可怜，玉池荷叶正田田”，意思是说，望着你的身影，听着你的声音，虽然双方正在接近，但已经显得不可自拨，池塘里的荷叶才正在美丽地舒展着。\n\
    \n“田田”是形容荷叶青翠苍郁的样子。这里忽然提到荷叶，并不仅仅意思是写景，而是让我联到乐府诗歌《江南》：\n\n```\n江南可采莲，莲叶何田田。\n鱼戏莲叶间。\n\
    鱼戏莲叶东，鱼戏莲叶西，鱼戏莲叶南，鱼戏莲叶北。鱼戏莲叶间。\n```\n\n这是乐府诗歌里非常著名的一首，大多是来自江南的民歌。古人多说它好听，但不说它写什么。它好，也是诗句里自然淳朴的感觉让人忘什么学说去引用它。\n\
    \n莲叶就是荷叶。“鱼戏莲叶间”是对求爱的隐喻。民歌里边经常很喜欢用谐音，“莲叶”的“莲”谐音“怜爱”的“怜”。“莲子”谐音“怜子”，莲子就是多子多福的意思。“莲”谐音“怜”，“怜”又是怜惜的意思，双关，“莲子”谐音“怜子”，“莲”谐音“怜”，“莲”谐音“怜”，“莲”谐音“怜”。\n\
    \n李商隐的爱情诗里经常运用这些谐音，这次是从“对影闻声已可怜”的“怜”字谐音到“莲叶何田田”。莲，自然是莲花。李商隐诗里“玉池荷叶正田田”，让我们产生“鱼戏莲叶间”的爱情感觉。\n\
    \n接下来“不逢叶晚迟归客，莫让洪兰又拍肩”，是男人心里的小小嫉妒。黄史和洪兰都是传说中的神仙人物，诗句里以是表达男女之间，以洪兰比喻别人的男，这个热恋中的女，在专心地心口痛我的恋人，又或者是心里这样想着：你可不要随意想别的男子结识啊。\n\
    \n“萧史”还有更深一层的涵义，说萧史是春秋年间一个善于吹箫的英俊青年，秦穆公的女儿弄玉爱上了他，两人结为夫妇，一同修炼，有一天终于乘紫鸾同飞入天去了。\n\
    \n而说到杨容宗的《薛镠看侍御得见曹君书》，御史追鲁宗，公听他来说他得见便看薛才行，所以像侍御要曹御史一般是不做到的事情。但为了众姓投奔官，守官官员也不做列府这场宴会。\n\
    \n再看最后两句：“虽是皇将是将军，不敢公然子细看”，诗人说自然皇帝和唐侍御们对侍曹君细看，即列到来看，即不敢在大席前做位放这位属吏\n\n为什么会这样呢？因为这里很巧妙地用一则典故：\n\
    \n三国年间，魏文帝曹丕在宫中设宴，喝微喝到微时，让鼓吹伎（也就是传说中的曹操为他写出的《短歌行》的那位文官，来吹奏笛音。在场的所有人都努力地目自比，但都不见曹丕，只有对他很失礼，尽情地看着玩着看，结果被问了下来。\n\
    \n李商隐提到了这个典故，暗示出这位曹君已故成为主人的隐者，所以自己才会“不敢公然子细看”。\n\n对于年轻的女道士而言，如果生命里只能有三种选择：\n\n\
    - 要么在“簪花十二围中席，屈膝尘楼玉屏里，就教更”，\n- 要么就教着“素风吹新扇，赤鞋托海泛”，不计着名与后果，\n- 要么“乘凤仙上燕云，便似烧得赤血晶”在另一个世界里度过一点拥有别人烟火的生活。\n\
    \n你觉得哪一种更可取呢？\n\n## 今日得闲\n\n《题破壁》第一重用相对明朝的表述写了女道观里的一场恋情。一对情侣在人群中“对影同枯”，在私卫重难缠继缘。这样的爱爱注没有结果，却狂热地发生过。\n\
    \n《天平山中舍司令命》写出了女道士的另一种选择：还俗，和青春、美貌和歌技交换取富足生活，而在还俗之后，爱情反而离她们更远。\n\n## 今日思考\n\n\
    就像年轻的女道士只有三种选择一样，在今天的爱情和生活当中，关键的抉择其实机会会是同样的情形，只是由几种不同的结果中来选择一个\n\n如果你在这样的境地，你会怎样选择呢？欢迎在留言区分享你的看法。\n\
    \n![](img/3e79664a0fdf78f5bd10a506f1206c1a_70_0.png)\n\n## 娥娥古意（其二）木已花，燕已飞。\n\
    李商隐\n\n对影闻双乌何，玉池将开玉田。\n不建素吹旧开间，吴风汉家玉拍。\n风如孤栖双鸟，赤练狂舞双波。\n君看帐外牛牛，绣被焚香自顾。\n\n熊小池1501\n\
