    \n## 今日思考\n\n我”对”这”诗”有”一”点”特”殊的”感情：第一次看到它是在小时候，记忆中的景象仍然清晰，虽然不太确切，读起来”得”过”程”来，有一”种”热虎气的节奏感的和形式感的正面。”我”读”到”一”些”节”目”都”能”提”示”我”的”记”忆。\n\
