    # 彩蛋｜卢照邻《长安古意》朗诵完整版


    熊逸·唐诗50讲

    今天


    卢照邻《长安古意》


    长安大道连袂斜，青牛白马七香车。玉辇纵横过主第，金鞭络绎向侯家。

    龙衔宝盖承朝日，凤吐流苏带晚霞。百尺游丝争绕树，一群娇鸟尽啼花。

    游蜂戏蝶恋门侧，双栖绿凤开丹崖。

    复道交窗作合欢，层霄连甍垂珠翼。

    梁家画阁中天起，汉帝金茎云外直。

    楼前相望不相识，陌上相逢詎相识。

    借问吹箫向紫烟，曾经学舞度芳年。

    得成比目何辞死，愿作鸳鸯不羡仙。

    比目鸳鸯真可羡，双去双来君不见。

    生憎辟颜绣孤鸾，好抱筝颜栖凤尾。

    双燕双飞绕画梁，罗袖带金风。

    片片行云着蝉鬓，纤纤初月上鸦黄。

    鸦黄粉白车中出，含娇态语情不一。

    妖童宝马铁连钱，娼妓盘龙金屈膝。


    御史府中乌夜啼，廷尉门前雀欲栖。

    隐隐朱轮临道，遥遥翠幢没金堤。

