    \ 温庭筠《商山早行》\n\n名利路上的失意人\n\n温庭筠《商山早行》\n\n晨起动征铎，客行悲故乡。\n鸡声茅店月，人迹板桥霜。\n槲叶落山路，枳花明驿墙。\n\
    因思杜陵梦，凫雁满回塘。\n\n你好，欢迎来到《韵递·唐诗50讲》。\n\n这一讲聊聊温庭筠（yún）的《商山早行》，诗的题目你可能不太熟悉，但是那句“鸡声茅店月，人迹板桥霜”在汉语诗歌中可是大名鼎鼎。\n\
    \n## 1. 纯用名词的诗\n\n温庭筠生活在晚唐，和李商隐齐名，合称“温李”。在传统的想象里，这两个人都属于“文人无行”的典型：同样才思敏捷，同样人品不佳。\n\
    \n不过，李商隐的不靠谱人品不佳，来自竞争背景下的过度解读，温庭筠却是实打实地不够检点。所以不独是我，他在仕途上一定常常受人打压。\n\n大约在唐宣宗大中十三年（859年），温庭筠再受重创，被赶出了长安。途经商山的时候，他写下了这首《商山早行》：\n\
    \n晨起动征铎，客行悲故乡。\n鸡声茅店月，人迹板桥霜。\n槲叶落山路，枳花明驿墙。\n因思杜陵梦，凫雁满回塘。\n\n诗的开头两个点明确这是一篇的“早行”。所谓“征铎”，就是指在马车旁上的铃铛。在人们牵着马准备踏上路的时候，铃铛就会发出声响。\n\
    \n诗人没设染睡，大约仅是梦醒来，在小客栈的暖阁里便生出了好多念头的悲怆吧。但他真的想乡恋士吗？\n\n这还真不好说，因为从你寄望的很可能不是这山那家，而是那长安。这层意思，要到最后两句才能点明。\n\
    \n这首诗的三、四两句是最有名的句子，也是最耐人寻味最好的句子。鸡声茅店月，人迹板桥霜，这十个字完全是名词的罗列，没有个动词，严格来说根本不构成完整的一句话。\n\
    \n这样的写法其实早已经有了，那就是李白《送友人》里面的名句：“浮云游子意，落日故人情。”还有我们熟悉的“枯藤老树昏鸦，小桥流水人家，古道西风瘦马”（马致远《天净沙·秋思》）。\n\
    \n句子里欠缺的动词必须由我们补充出来，而到底能抽出什么样的语句，最妙都影响着我们对诗句的感受，不同措辞的动词竟然会使差异于读者造成感受上的微妙变化。所以说，这样的诗句是一种美丽的半成品，需要读者去做最后的话头。\n\
    \n“鸡声茅店月，人迹板桥霜”，与其说这是两句诗，不如说这是一幅画。但仅只，或者的话，我们在画面上简单勾出几个最关连的景象，整幅画仍然要我们去做脑补完成：\n\
    \n- 茅店到底是什么样的一间客店，板桥上的霜雪几点凝结着白迹；\n- 人又是怎样的，是在行色匆匆还是兴致盎然，是素衣还是着得得寒；\n- 黎明鸡声中的月色又是什么样的月色，月色和霜的颜色又呈现出如何的恍惚微白；\n\
    - 而那屋舍与板桥又是怎样的还是怎样地寒，是耸立着，还是倾斜地是怎样的情境在徘徊......\n\n但如果有这样的画面，可能任何一座山，任何一处早行的驿站，都有可能长这个样子。\n\
    \n怎样才能知道是“商山早行”，而不是任何其它地方的早行呢？这是写诗的一大要点，也是极易被诗人忽略的地方。\n\n当然，温庭筠这样的高手并不容易犯指，所以接下两句“槲叶落山路，枳花明驿墙”，这就是商山早春所所有的景色。\n\
    \n这首诗里的景物，很容易被读者当成秋景，因为又有霜，又有落叶。\n\n但是走商山路的树叶是一种很特殊的乔木，秋冬季节树叶也只是干枯，到了春天才纷纷飘落，又因为形似圆形、根根带棱容易磨划才白色的花朵，而初落时为黄色的花，所以开门见人的感觉，“明驿墙”三个才真实的有看落。\n\
    \n这样的景色触动你怀了，于是“因思杜陵梦，凫雁满回塘”。如果联系到的开篇“晨起动征铎，客行悲故乡”，我们便说诗人为苦行中而商山的故乡思念杜陵，杜陵也就是家乡的土。但是，而温庭筠是山西人，杜陵却紧邻长安，在长安城南五十里。\n\
    \n这里原本是唐朝的杜陵园，到了汉朝，汉宣帝的陵墓安葬在这里，所以叫杜陵。汉宣帝是一代明君，杜陵也常都政治中中心，所以唐朝诗人笔下的杜陵常常有着丰富的涵义。最著名的例子，就是杜甫寄托杜陵野老。\n\
    \n温庭诗的“杜陵梦”到底是什么意思呢？也许是怀念老杜陵的亲友，也许是想去杜陵找长安，以“杜陵梦”隐晦地表达自己对政治中心的渴望吧？\n\n这场梦到临做于什么时间，依旧说不清。也许是刚刚在西钱里度过的梦，被“晨起动征铎”的声音惊醒，也许是已经动了身，恍恍惚惚地出神。\n\
    \n但毕竟梦，很快就会醒，很快会醒。现实中的景象是“凫雁满回塘”的意象也正是“杜陵梦”里的一幕吧。\n\n要理解这首诗，很有必要先弄清楚句里边完全没有出现过的两个重点：一是商山古藏在唐朝的地位，二是“暮过山西”这个经典的文学语料。\n\
    \n## 今日思考\n\n遥知故国寒烟直层山。\n\n但他明明是被贬出长安的，越去越想回头，为什么还要“思”呢？欢迎在留言区分享你的看法。\n\n![](img/3e79664a0fdf78f5bd10a506f1206c1a_41_0.png)\n\
    \n![](img/3e79664a0fdf78f5bd10a506f1206c1a_41_1.png)\n\n### 商山早行\n\n温庭筠\n\n晨起动征铎，客行悲故乡。\n\
