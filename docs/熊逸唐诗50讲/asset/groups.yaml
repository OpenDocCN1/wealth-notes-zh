    36 李商隐《无题》四首·二：一寸相思一寸灰... 23\n\n## 李商隐《无题四首·二》\n\n飒飒东风细雨来，芙蓉塘外有轻雷。\n金蟾齧锁烧兰露，玉虎牵丝汲井回。\n\
    贾氏窥簾韩掾少，宓妃留枕魏王才。\n春心莫共花争发，一寸相思一寸灰。\n\n你好，欢迎来到《唐诗·唐50讲》。\n\n我们小时候读到的爱情故事里总会沾染都市风貌的标签，只要男女相悦便心心相印，就可以冲破一切的世俗藩篱，历尽坎坷终于赢得幸福的结局。\n\
    \n相反，那些讲究门当户对和成规得体的所谓爱情，只会散发着小市民的庸脂俗气，在戴金珠子的银嘴头里听不出令人厌恶的市侩嘴脸，完全和真挚美无缘。\n\n可当我们长大成人之后，却发现小市民的爱情总是煞风景的，我们的真至反而脱离群众，而自恃清高的自己，偶尔会发痴去从膜子里勉强看到一副市侩嘴脸一闪而过。\n\
    \n那个时候，我们也真会真心希望能有一首在情场诗诗记里翻一翻吧？这一大讲选的是李商隐《无题》四首的第二首，大致要几分这样的功效。这首诗的平字有些生僻，建议你读一下原文。\n\
    \n### 1. 谐音里的相思\n\n《无题》四首的第二首写得很详细、美丽，有几分高妙。虽然原第一首首句是一佳话来，但它的语义隐藏更深，变得不那么容易读懂了。\n\
    \n飒飒东风细雨来，芙蓉塘外有轻雷。\n金蟾齧锁烧兰露，玉虎牵丝汲井回。\n贾氏窥簾韩掾少，宓妃留枕魏王才。\n春心莫共花争发，一寸相思一寸灰。\n\n一开始是温柔的春天味道：东风是春天的风，细雨是春天的雨，“芙蓉”通常是长荷花的池塘。在这里意思是“芙蓉塘外就是轻盈的轻雷。”“轻雷”一词很妙，既可以指天上的雷声，也可以形容远处的车声。\n\
    \n你也许多说，不在古人的分类系统里，车和马是相同的。这“轻雷”在《周礼》里也有出现而且很出名，《周礼》里的雷鼓可以用来征召军队，也可以象征雷动，震而震威，凡是能震动很强大的东西，都是雷击的分量。\n\
    \n今天的轿车宁静静悄悄和减重，新兴的电动汽车更是无声无息，但古代的车没有这种减震消声，又没有橡胶轮胎，更没有珠丝减重，所以开起车来车很响，就像打雷一样。\n\
    \n时代的进步和技术革命会让贾贵先生非常为难，在当年给人算卦的时候，算卦到底还不能表示出来？\n\n李商隐当然不必考虑这个问题，在他的时代里，车马一定可以当炸雷声，所以“轻雷”不会意味着车子经雷，而只会意味着着个车子驶远的地方发生。当你把自己代入这个场景时，就会不由自主地猜测：\n\
    \n为什么会有雷里有这辆车子？为什么这时会车到这位心机重的地方？来干什么？这里到底会发生什么。和诗人一起有着什么关系呢？车子为什么香不下来的时候，为什么要无端地经过呢？这种若无其事的态度，背后一定还有什么事情吧？\n\
    \n诗会雷有什么雷声？读人一听，绕丝绕绕转到底音，“金蟾齧锁烧兰露，玉虎牵丝汲井回。”这是极具诗意的古代生活画面，现代人不容易看懂。\n\n古代的门阈、大厅流行熏香，没有熏香的房间一定是贫寒之地。熏香需要香案和料，香炉有很多种类型，其中一种做成动物样的，蟾蜍的嘴会含着一个小的机关制作的开口，香炉的“金蟾齧锁烧兰露”指的是蟾蜍头上的锁扣里面含着熏香，“烧香”是说香气飘起的样子在房间里面飘荡。\n\
    \n“玉虎”是井口上的铜锁，“玉虎牵丝”指的是提动绳、提皮绳来从水桶从井底提上来。\n\n但是，点燃熏炉也好，从井里汲水也好，这都是什么分的内容，是不是太发条条条条的？诗句描写这些东西到底是什么意思呢？\n\
    \n前边讲过，李商隐写诗很喜欢用回音，所以“烧香”的“香”和“牵丝”的“丝”恰好组成了“音丝”（相思）。\n\n这就是私话才话话里的密码，需要我们这些外人转拜来寻找和心，才可以体会得到。而温馨的感觉就像思念的慢慢浸润，淡淡的愿望又像是心的七分八分。\n\
    \n### 2. 偷香和留枕的故事\n\n接下下的两句，“贾氏窥簾韩掾少，宓妃留枕魏王才。”分别用到两个典故。\n\n韩寿是晋朝人，名叫韩寿，在高管层里手下来干事，“掾”的意思是副官、副官。贾充每次到韩那里，女儿们总会跑过来围观韩掾和女儿，对韩一见倾心。他的诗云这个诗很意思，两个人就开始有热烈的关系，每次总是到了晚上，韩寿凭藉着娇好的身，翻过界高墙，到贾充那里，两人都没有被人发觉。\n\
    \n直到有一天，贾充闻到韩寿身上有一股特殊的香气，马上让他送这很外国的贡品，晋惠帝就把这种香丸赐给了自己女儿跟韩寿两个人，别人家不可能有。\n\n那么，韩寿用的香料可能来处何处呢？这件秘密被识破了，竟充于是在怀疑女儿和韩寿私通，把审察王下人的地方，然后把谢婉婉、索性把女儿嫁给韩寿。\n\
    \n“偷香”这个典故是从这故事来的。故事里的事情也许不太熟悉，但它身上其实关联着重大的历史事件。三百年前，司马氏准备着夺取曹魏政权力时，所有“司马与之马”之人，路人皆知这个成语。\n\
    \n帮助司马篡政的第一功臣就是贾充。正是贾充在斗争白热化时刻果断地助司马氏取代曹氏皇朝，曾于王下杀掉了曹髦。\n\n和韩寿会通的女儿是贾充的大女儿叫贾午，她会有一个同级的配偶，就是西晋著名的晋明帝。晋惠帝大家都很熟悉，\"\
    问什么八王之乱\"这句古语就是出自他的。晋惠帝是个昏聩君主，晋惠帝开创南朝断朝，引发了八王之乱，八王之乱又引发了五胡乱华。\n\n我们再看第二则典故：“宓妃留枕魏王才”。东汉末年，曹操大乱，儿子曹植平定了之后的儿皇姐妹，往加龙宠。等曹曹植死了之后，甄氏因为先帝而有怨气，被曹丕赐死。\n\
    \n曹丕的弟弟曹植在甄氏死后第二年写过一篇非常华美的文章，说自己在水边见到一个年轻绝色的洛水女神，互相倾慕，因为被人所窥视，不敢不合法地。这篇文章，就是曹植最著名的《洛神赋》，传说这篇洛神赋其实就是甄氏。\n\
    \n当时曹植从外地进京，曹丕把甄氏生前用过的玉簪拿给曹植看，曹植一直看曹丕，此时玉簪就顺路送人了。不远处洛水。归途中，曹植在洛水边休息，心里仍然想着甄氏，看到甄氏自己走来，发生了一场美丽而又伤感的婚会。\n\
    \n后来曹植借洛神来比甄氏，写下了那篇名文，原名《洛神赋》。等甄氏到死后，甄氏为原生的儿子曹邕所立，这就太尴尬了。由于避讳上的考虑，《洛神赋》才改名为《洛神赋》。\n\
    \n当你熟悉了这个典故事之后，回头看“贾氏窥簾韩掾少，宓妃留枕魏王才”，就会很容易读懂这两句诗是借在描写男女之情下面的相似。\n\n那么，俊美的韩寿和多才的曹植是不是李商隐的自比呢？多情的贾午和美丽的甄氏又是否在指向着他爱的人？没人给我们留下任何线索。\n\
    \n但这两联典故是表示男女情爱的之间相似，还包含了一种暗示：颜子转朝之中渴望高高在上的阮籍，甄氏和曹植之间隔着君臣与伦理。\n\n这些障碍到底能不能够得过去？答案是否定的，因为诗写的结尾两句却是这样说的：“春心莫共花争发，一寸相思一寸灰。”\n\
    \n这样的结尾，前一句呼应了开头“飒飒东风细雨来，芙蓉塘外有轻雷”的意象，后一句也呼应了“金蟾齧锁烧兰露，玉虎牵丝汲井回”暗含的谐音“相思”。意思嘛，既然春天花开了，花可以自然发，你的春心却不如像花儿一样跳动。\n\
    \n这里的解释看上去很有趣，为什么“相思”可以用“灰”来描述呢？这是新，不是来自成语，因为相思是心里发生的情感，而不是会自然发就“方寸之灾”的说法，形容心上身土上只占据很空间，\n\
    \n“方寸之心”也可以简称为“心”或者“方寸”。如一个人惊慌失措，就是“乱了方寸”，这样的表达在当今还有。\n\n心既是指方寸之地，那么心中萌发的想象自然也可以用“寸”来度量。这是最不讲道理。\n\
    \n心就可以是‘寸方寸’，那么心中萌发的相思自然也可以用‘寸方寸’来衡量。这就是原不讲的道理，但这样的逻辑正是这样的自然。\n\n注意没有相濡的信息，会像一棵干枯的枯草，一寸方寸心里难变成灰烬。\n\
    \n《无题》四句的第二首和第一首有隐秘的承关系，巧妙处运用谐音典故。在唐朝的大诗人里，李商隐是把谐音典故用到最炉火纯青的一个。\n\n“贾氏窥帘韩掾少，宓妃献枕魏王才”，一组对仗里的两个典故解决读书人的关系。\n\
    \n“春心莫共花争发，一寸相思一寸灰”，这两句诗成为千古名句，反复被人引用。\n\n## 今日思考\n\n你有没有同样的经历吗：虽然明知对方的爱慕，有刻骨的相思，却无法面面两开无计可施，眼睁睁看着一寸一寸相思一寸灰，只有徒劳无功劝慰自己“春心莫共花争发？”。\n\
    \n或者你在刚刚可以选择的时候舍弃了，原以为实现了，就像《野玫瑰》的故事里，凯瑞选择了出身边优的佩维任维纳尔男爵夫人，而选择了当门口守卫、各方面条件都不如前也可实实存在着爱着自己的凯兹？决定在留霍尼分享你的经历。\n\
    \n![](img/3e79664a0fdf78f5bd10a506f1206c1a_76_0.png)\n\n# 无题四首（其二）\n李商隐\n\n飒飒东风细雨来，芙蓉塘外有轻雷。\n\
    金蟾啮锁烧香短，玉管牵绳送夜长。\n暗恨平生画，青楼巷陌香。\n春心莫共花争发，一寸相思一寸灰。\n\n![](img/3e79664a0fdf78f5bd10a506f1206c1a_76_1.png)\n\
