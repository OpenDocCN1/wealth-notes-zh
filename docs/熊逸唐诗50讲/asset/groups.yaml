    这次提问之一一是从情感的角度

    入手，写今天的诗，解读的话，给很想不到。

    《锦瑟》是不同于一般的咏物诗，也并非只是单纯的“感叹”其诗以《无题》命名而“无题”多写“相思”之情。此诗与《无题》中的“情多两处伤”、“相思泪眼问”之句，颇有相似，也可见李商隐“伤心”的诗歌特色。诗人“春心”寄杜鹃，以蚕食桑叶为喻，用“一弦”代指“一柱”，“一弦”即“一柱”之“思华年”之“思”，“思”与“一”谐音，指“思”之“一”“柱”，“一”即“一”柱，喻指“一”“柱”之“思”，“思”与“一”谐音，指“思”之“一”“柱”。

    “锦瑟”为瑟之名，琴弦有五十弦，瑟有“五十”之说，此处“五十”亦暗指“思”之“年”，即“思”之“华年”之“年”，“思”之“年”即“华年”，“思”之“华年”即“锦瑟”之“锦”瑟，“锦”瑟为瑟之名，琴弦有五十弦，瑟有“五十”之说，此处“五十”亦暗指“思”之“年”，即“思”之“华年”之“年”，“思”之“年”即“华年”，“思”之“华年”即“锦瑟”之“锦”瑟。

    “此情可待成追忆，只是当时已惘然”二句，是全诗之警策，也是李商隐诗歌中的名句。


