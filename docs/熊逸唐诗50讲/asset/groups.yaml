    \n**叫我这子啊**\n7.42\n\n我是老师！一年又一年，日子总是流逝的，别有风味。新的一年的又过了，先祝老师元旦快乐。\n在2018年的最后一夜，我看了「被评为最成功的文艺之「地球最晚的广播」，这是我在新年最难忘的瞬间。当我新年第一天看到《春江花月夜》，的感觉，我如获至宝的《春江花月夜》，的感觉，我真快乐到在《春江花月夜》的感觉，我真快乐到...\n\
