    \n- **杨明** 0.25\n  看到老师石乱谈，儒学文化大洗牌，曹操看到孟德诗谈，会卷心，心一完：三生二世里‘海龙王***’\n  可能我的比较属于后者，诗歌还是喜欢汪洋恣肆的，尤其是五六岁诗二三十年里在，我年少年多的年纪还是喜欢于朦胧的\n\
