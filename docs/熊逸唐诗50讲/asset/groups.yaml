    \n熊倬：2019年8月\n\n（前一篇）\n\n## 用户留言\n\n- 李盛\n  人不会是一成不变的，不同的时间在人生的境遇，会在完全不一样的人生，生活状态也可能会，在年少的时候，成为了年轻时的时候。在年老的时候，为了一点点的友情，更愿意在清浅池塘里享受平实的爱情，而不去追求爱情的浪漫，而是享受平淡的幸福。\n\
    \n- 何梦琪\n  初读李商隐诗的时候，就感觉有股说不清道不明的愁绪，像《霜月》里的“蓝星宿得最明，不照空城照玉楼”，这种意境，读着让人有说不出的感慨。对于这种愁绪，我更喜欢在夜深人静的时候去品味。对于这种愁绪，我更喜欢在夜深人静的时候去品味。人生就是如此，起起落落，有高潮，也有低谷。人生就是如此，起起落落，有高潮，也有低谷。人生就是如此，起起落落，有高潮，也有低谷。\n\
