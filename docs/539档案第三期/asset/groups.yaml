    Although it may come as a most surprising piece of news, it is now known that
    there isn''t a basic dieting reason in the world why any normal healthy person
    should have to use artificial, imitation sweeteners instead of the natural sweetener,
    sugar.


    The new thinking about dieting says don''t turn your normal eating habits upside
    down. Don''t involve yourself in bizarre "wonder" diets that are in conflict with
    sound nutritional principles. Go ahead and eat the good things you have been accustomed
    to having on your table. Cut the portions down, but don''t out them out.


