    into action. A few seconds later came her mother''s cheery "hello."


    Friendly voices like these are getting through faster today, thanks to a wonderful
    new system of long distance telephony: Direct Distance Dialing, or DDD. This remarkable
    system lets you call a telephone in a far-off city without an operator''s help
    as easily as you can call a neighbor across the street. Today, over 5 million
    telephone users in some 400 communities can dial directly 35 million distant telephones.


    Behind this remarkable system is a maze of intricate telephone equipment – including
    some of the most complex devices ever built by man. And all of this equipment
    is made by Western Electric, manufacturing and supply unit of the Bell System.


