    # 30、每个人只有两只


    # Only two to a customer.


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_128_0.png)


    Ever think about the old saying: "An eye for an eye"? It comes from a code of
    justice developed over 5,000 years ago. A time when the value of an eye was equal
    to the value of life itself.


    Are our eyes any less precious today? We still depend on them, as on no other
    senses, every waking moment of our lives. We still employ them as the basis for
    our entire system of teaching and learning.


    Yet there is a difference between then and now. A tremendous difference. Now we
    ask our eyes to work as they were never intended to.


    Once we used our eyes to sight game at a distance. Or to spot an enemy in time
    to welcome him properly. Now we spend hours in reading, watching TV, sewing, operating
    machinery. All close-up viewing.


    Once we drove horses and buggies. And this activity called for normal distance
    viewing. Now we drive cars. At high speeds. Speeds demanding lightning-fast adjustments
    in eye focusing. Imposing enormous tension, strain, energy output.


    Once we used our eyes almost entirely for long-range daylight seeing. Now we use
    (and abuse) them for long.


    periods in close-up work under artificial light.


    All this, mind you, we require of our one pair of eyes. What’s really incredible
    is that our eyes perform the wonders they do as long as they do.


    Fortunately, help is available when we require it. Modern ophthalmic science and
    techniques now provide an amazing range of visual aids. We can get lenses that
    are anti-reflection coated. Lenses that are impact resistant. Tri-focals. Prescription
    sunglasses. Lenses and glasses custom-designed for the special ways we now work,
    study and play.


    Whether you wear glasses or not, don’t forget a very important thing. Your eyes
    are changing. Gradually, perhaps imperceptibly. So that you can actually be unaware
    of the fact that you’re not seeing as well as you did. Or as you might.


    How do you find out what the change, if any, is? Simply by having your eyes examined
    regularly, once a year, by a qualified eye-care practitioner. Makes sense, doesn’t
    it?


    And above all, remember this: only two to a customer. Treat them accordingly.
    Better Vision Institute.'
