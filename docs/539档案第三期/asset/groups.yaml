    # 14、我不再因为我的假牙而不自在!


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_72_0.png)


    # I stopped being self-conscious about my dental plates!


    I used to be embarrassed to speak with my students. I was certain my dentures
    had an odor they noticed. Finally, I visited my dentist. He told me that as long
    as I kept brushing with toothpaste I''d have a special odor problem called denture
    breath. Here''s his advice on proper denture care.


    "Denture breath is an odor caused by food particles and bacteria that collect
    deep in the cracks and crevices of dentures. Brushing with toothpaste—though it
    seems best—actually does a poor cleaning job on dentures. That''s because toothpaste
    only gets teeth ''surface'' clean. It misses the odor-causing food particles and
    bacteria."


    "The proper cleaning of dentures is really simple when you realize that teeth
    that can be removed are teeth that can be cleaned best, not by brushing them partly
    clean with toothpaste, but by soaking them completely clean with a specially made
    denture cleanser."


    "This special cleanser is called Polident. A recent survey showed 9 out of 10
    dentists recommend Polident over any toothpaste because it cleans most efficiently,
    deodorizes more effectively, and it''s so easy to use. Every day, simply slip
    your plate or partial bridge into water, then add Polident powder. Instantly,
    millions of invisible oxygen bubbles go to work. These bubbles along with other
    cleaning agents go deep into cracks and crevices to thoroughly soak away food
    particles, bacteria, even dissolve away tobacco stains and dulling film. Soon
    your plates will look immaculately clean, even embarrassing denture breath is
    gone—once and for all."


    My dentist was right. Daily use of Polident does such a complete cleaning job,
    now my mouth feels fresh—my dentures look white—and I feel confident with my students.'
