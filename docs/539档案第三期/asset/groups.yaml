    # 24、6-8岁儿童的神奇世界


    # The Wonderful World

    ... of your

    6 to 8-year-old child


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_105_0.png)


    It''s a busy, wonderful world for children aged 6 to 8... and it will become more
    so as they "graduate" from home and begin to live on their own as primary-graders.


    The wider world which the young child enters isn''t always a smooth one... and
    the guidance, sympathy and reassurance of "moms" and "dads" can be as vital as
    when your child was only a toddler.


    Those early years at school, for instance, are often difficult. A child may become
    shy, timid, or worried. Such behavior is a signal for reassurance... rather than
    pushing or prodding. With the right support at home and school, youngsters usually
    make a good adjustment and regain in courage and confidence.


    It''s most important for parents to show enthusiastic interest in a youngster''s
    school work. Take time to listen, to praise and to encourage—children thrive on
    it.


    Even though your youngster may be the picture of health, don''t neglect regular
    medical and dental check-ups. Be sure to ask your child''s physician about any
    "booster" shots that may be needed to renew protection against polio, tetanus,
    diphtheria and other diseases.


    Since your youngster will be away from you more and more, re-emphasize the importance
    of safety. Be sure to show your child where he should cross the street, and emphasize
    crossing only with the green light.


    Should your youngster have special difficulties with school work, an examination
    should be made of the eyes and ears. Defects which can be corrected are often
    the cause of low grades and ultimate dislike of school.


