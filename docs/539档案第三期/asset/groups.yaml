    EXTRA INCHES and pounds are health hazards. ... and they are signals to start
    reducing now. Remember, in 99 percent of the cases, overweight is due to overeating.

    Before you start dieting, consult your doctor ... especially about the protective
    foods that supply proteins, vitamins and minerals.

    Many combinations of foods provide these nutrients. Here is a list to follow every
    day while dieting and daily thereafter:


    Milk ... at least a pint daily—preferably skimmed or buttermilk—including that
    used in cooking, or in milk products like cheese.


    Meat, fish, poultry, eggs or cheese ... two to three servings daily. Have meats
    roasted, broiled or boiled. Use lean meats or cut off the fat.


    Potatoes ... one medium baked or boiled.


    Cereal and bread ... one slice of whole-grain or enriched bread at each meal.


    Vegetables ... eat at least three vegetables every day including one leafy green
    or yellow. Eat all the vegetable salad you want, but use only lemon juice or vinegar
    dressing.


    Fruits ... two servings daily, including citrus or other sources of vitamin C,
    such as tomatoes. Skip the syrup that comes in canned fruit.


    Butter or margarine ... three small pats daily, including that used in cooking.


    If you plan your diet around these foods and avoid rich desserts, fried foods,
    gravies, sauces, cocktail snacks and second helpings, those extra inches and pounds
    will vanish.


