    # 12、因为贪吃，觉得有 “罪恶感” ？


    # Feel “guilty” about

    your appetite?


    # Sugar can help

    you control it!


    Your appetite is directly related to your body’s need for energy.

    Sugar supplies energy

    —satisfies appetite faster

    than any other food


    By helping to overcome hunger that leads to overeating, sugar can save you more
    calories than artificial sweeteners


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_65_0.png)


    # “Scientific Nibbles” – a new way to more effective weight control


    Weight control is a lot easier and more likely to be permanent when your diet
    includes sugar.

    A teaspoonful of sugar supplies only 18 calories, but these quick energy calories
    may make it much easier to stay satisfied on less food.

    The body’s most basic need is for energy. Energy to work, to play, to act… to
    keep the heart beating. This energy comes from sugar in the blood stream, which
    in turn, comes from food.

    This need for energy is so constant that nature protects your brain and your body
    against a shortage. Research at leading universities has shown that when your
    blood sugar level is low you get hungry.

    The fastest way to raise your blood sugar level, to supply quickly available energy
    and to satisfy appetite, is to eat or drink something that contains sugar.


    That’s why many of the newer diets often include a sugar-containing snack or beverage
    between meals to keep hunger from building up. A leading authority on nutrition
    calls these “Scientific Nibbles.”

    By helping to curb a runaway appetite, sugar makes it easier to turn down the
    oversize portions and second helpings that are the real cause of overweight.

    Artificial sweeteners, in pills or any other form, supply no energy. They only
    stimulate the taste of sweet without helping to satisfy appetite.

    The satisfaction you get from using sugar is important in all your meals. It is
    especially important when you’re planning a reducing diet that you can stick to.


    SUGAR INFORMATION, INC.,

    New York 5, New York


