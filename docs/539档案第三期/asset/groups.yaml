    ## 25、不管你开的什么车,这里的方法都能让你更加安全地驾驶!


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_109_0.png)


    ### Whatever you drive, here''s how to drive it more safely!


    Every time you take to the road you have a great responsibility. Only when you
    drive with care, caution and courtesy, at all times, can our roads become safer
    for all. Here are some safety suggestions:


    - ✓ Check your speed—About 3 out of 10 drivers involved in fatal accidents each
    year are guilty of violating speed laws. Always slow down at night and when road,
    traffic and weather conditions are hazardous.


    - ✓ Check yourself—About 1 out of 14 drivers involved in fatal accidents has a
    physical or mental condition—such as worry, fatigue and sleepiness—that is a contributing
    factor in the accident. Never drive when upset or tired.


    - ✓ Check your car—Keeping your car in safe operating condition is your responsibility—not
    your mechanic''s. You can judge for yourself whether brakes, tires, steering wheel,
    lights and windshield wipers are in proper working order. If you notice any defects,
    have them corrected immediately. Don''t wait until your next semiannual car check
    to have even the most minor trouble corrected.


    - ✓ Check your driving habits—Now and then, the most skillful drivers tend to
    become a bit careless. They may become less considerate of other drivers and of
    pedestrians—or take chances on violating this or that traffic law. Remember, all
    rules of the road are made to help you, not to hinder you. When you violate a
    law, you are asking for an accident.


    So, always drive as if your life depended on it. It does!


