    # 6、眼睛里进东西后，我们该怎么做


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_42_0.png)


    Among life''s minor misfortunes, few are more acutely distressing than getting
    something in your eye. Usually the discomfort is brief and the consequences not
    serious, but the danger of injury or infection must not be overlooked. Here, from
    the makers of Murine, are simple, medically approved methods for quick and safe
    removal of these irksome particles.


    # What to do when something gets in your eye


    BECAUSE your eyes must be exposed in order to see, nature has provided them with
    special protection. Eyebrows (unless you have replaced them with pencil) and lashes
    help screen dirt from surrounding air. At the sudden approach of an object, your
    eyelids snap shut involuntarily — much faster than your thought-directed wink.


    But now and then a wind-driven particle is even quicker, and gets in. Instantly,
    sensitive nerves of the eye signal for action. Tears gush, lids flutter in effort
    to flush away the intruder. Meanwhile, the intense discomfort makes all your other
    problems fade in comparison to the urgency of getting the accursed thing out.


    Chances are your built-in, automatic systems will soon do the job; but should
    they fail, you may save yourself a lot of misery by following these few simple
    suggestions:


    3. Twist a corner of a clean handkerchief to a small point. Often the offending
    particle can be lifted away with just a touch of this simple device. Do not attempt
    to use tweezers or any other sharp or hard instrument.


    A particle may be hard to find because it clings to the inner side of the upper
    lid. Grasp the lashes of the upper lid, lift it down over the lower lid and release
    it so that the lower lid''s lashes brush beneath the upper lid. This ready-made
    whiskbroom is surprisingly effective.


    4. If, after trying these simple methods, you still feel that something is in
    your eye, get to an eye doctor as soon as you can.


    A few drops of Murine will help wash away minute particles like powder or ashes.
    Always use Murine in both eyes after you have removed anything from either eye.
    Murine is isotonic in respect to tears, which means that it blends perfectly with
    the natural fluids of your eyes. You''ll find its gentle, soothing effect comforting
    and refreshing.


    +   1. Don''t rub your eye! Rubbing can cause the object in your eye to scratch,
    or become embedded in the lid or surface of the eye. Embedded particles which
    may seem to "go away" can result in serious later infection.


    2. Try to locate the object with a mirror, rolling the eye up, down and to each
    side.


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_42_1.png)


    Keep Murine handy at home, office, in the glove compartment of your car. Use it
    regularly to relieve that "tired-eye" feeling. Murine comes in a handy new squeeze
    bottle as well as the familiar glass bottle with separate dropper.


    The Murine Co., Inc. Chicago, U.S.A. & Trademark Reg. U.S. Pat. Off. #62001'
