    ## 34、对抗“葡萄球菌”的一场战争


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_142_0.png)


    A timely warning about a vicious germ which invades homes and threatens life.


    # The war

    against “staph”


    By Gene Wilburn,

    Medical News Writer, Houston Chronicle


    A virulent organism is rocking the medical world. Its name is Staphylococcus aureus,
    better known as “staph.” It recently came to public attention when it killed 16
    babies in a Texas nursery. Actually, its victims can be any age, male or female.
    Its carriers don’t even have to be sick. Worse still, “staph” is alarmingly resistant
    to many antibiotics and other chemotherapeutic agents. “Staph” has developed into
    a nationwide community problem – a household problem. For it can be tracked into
    any home – the cleanest of homes. There need be no skin lesion for “staph” to
    enter the body. A crawling infant, a bather can pick it up from the cleanest looking
    floor, the whitest bathroom tiles.


    That is why we should renew the old crusade for strict home disinfection. Since
    the bathroom can be a critical area for spread of disease germs, the bathroom
    cleanser should have the power to kill “staph” and other disease-bearing germs
    that may lurk in the bathroom. Published laboratory tests show that neither soap
    suds nor usual pine oil solu-


    tions have the power to kill “staph” – that so-called “sanitizers” are not true
    germicides – that is, they may not kill all disease germs they touch.


    One household product has proved to be an efficient germicide. Lysol Brand Disinfectant
    kills disease germs on contact – even “staph” and many deadly viruses. And, in
    laboratory tests, its anti-germ action was found to last 7 full days. Lysol disinfects
    from one cleaning to the next as nothing else can. Now in pine scent as well as
    regular, a bottle costs as little as 29¢.


    SPECIAL NOTE:

    Whenever there’s sickness in your house, use Lysol. Use it to clean your sickroom,
    bathroom, kitchen. To disinfect dishes and eating utensils. Lysol can help protect
    your family from infection by contact. Be sure you have it on hand. Check your
    medicine chest for other sickroom needs. Your druggist is featuring them now.
    Note: If anyone in the family has a boil (a direct source of “staph” contamination)
    – disinfect bathtub, basin, bowl seat with Lysol after every use.


    ## 对抗“葡萄球菌”的一场战争


    来自：吉恩·威尔伯恩

    休斯顿 Chronicle 医药新闻作家


    一种致命的微生物正挑战着医学界。它的名字就是“金黄色葡萄球菌”，又称“葡萄球菌”。


    最近，这种微生物在德克萨斯州托儿所夺走了 16 名婴儿的生命，引起了公众的关注。实际上，任何年龄，不论男女，都可能感染这种细菌。甚至没有生病的人也可能携带这种病菌。


    更糟的是，“葡萄球菌”对很多种抗生素，以及其化疗药物都有耐药性。“葡萄球菌”已经发展成为一个全国性的社区问题——家庭的问题。


    因为，它可以进入任何家庭——即使是最干净的家里也可能沾染这种细菌。皮肤即使没破损，也可能感染“葡萄球菌”。爬行的婴儿，游泳的人，都可能在看起来最干净的地板上染上这种细菌。


    这就是为什么我们要改变我们之前的消毒方法。由于浴室是病菌传播的关键区域，所以浴室清洁剂，应该有杀死“葡萄球菌”，以及可能潜伏在浴室的其他可能致病细菌。


    发表在权威刊物上的实验室测试表明，肥皂或者一般的松树油，都没有办法杀死“葡萄球菌”——我们所谓的“消毒液”也不是真正的杀菌剂——它无法杀死它接触到的所有病菌。


    有一款家用产品，已经被证明是一种有效的杀菌剂。那就是来苏尔消毒剂。它能杀死所接触到的病菌——甚至包括“葡萄球菌”，以及许多致命病毒。


    实验测试显示，使用它杀菌后，杀菌效果可以持续整整7天。来苏尔消毒剂的效果可以从一个清洁日，持续到下一个清洁日。现在，来苏尔新增了松木香型。原味或松木香型来苏尔，都仅售29¢。


