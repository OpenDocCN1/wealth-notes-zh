    ![](img/4a4110a48dd9dbd39e3d48b14a410300_157_0.png)


    # The invisible

    plastic-glass sandwich

    that rides between

    you and danger


    by John Hayes


    Incredible as it may seem in this automotive age, fewer than 1 in 20 car owners
    know whether or not there is a plastic safety layer in the windshield and side
    windows of their automobiles. Many may know only that their automobile has some
    kind of “safety glass”—but there is a lot more to the story.


    The “Plastic-Glass Sandwich:” is formed by placing a sheet of vinyl butyral, a
    tough adhesive plastic, between two layers of glass (see sketch above). Then all
    three are permanently laminated into one unit.


    Thanks to this plastic safety layer, laminated safety glass reduces the hazard
    of shattering glass. And the optical qualities of this plastic-glass sandwich,
    when plate glass is used, are superior to any other type of automotive safety
    glass. In addition, laminated safety glass is easily cut to any size by glass
    installers.


    Because it meets the optical and safety specifications set up by the American
    Standards Assoc., laminated safety glass with the plastic safety layer has for
    years been the only material used in windshields of all motor vehicles produced
    in the U.S.A. Most of them use laminated safety glass in side windows also.


    Laminated safety glass is performing in many fields outside of transportation—for
    the plastic layer that provides safety can be printed in beautiful colors and
    designs. It can be a shatterproof shower stall, a table or dresser top, a beautiful
    room divider. As for the future—a visit to the Monsanto “House of the Future”
    in Disneyland will give you a hint of the many wonderful ways this “Plastic-Glass
    Sandwich” will contribute to your future living.


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_157_1.png)


    How can you tell if you have the plastic layer of safety around you as you ride?
    You know it must be in the windshield—but what about the door windows? If you
    have laminated safety glass, you can readily see the edge of the plastic safety
    layer by examining the door vents, tops of door windows, or other exposed edges
    of the glass.


    The Monsanto Chemical Company, Plastics Division, supplies plastic used by America’s
    leading glass companies for the plastic safety layer in making laminated safety
    glass.


