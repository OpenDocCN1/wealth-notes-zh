    ## 52、舒适之奖

    ## The prize catch

    in comfort


    A revealing insight on clothes by a man whose leisure hours lead him to the great
    outdoors: C. P. Smith, President of American Airlines


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_203_0.png)


    "I take my annual holiday on the Great Watshishu River in Quebec, Canada, fishing
    for Atlantic salmon. I have learned from long experience that wool clothing is
    needed to make it a pleasant holiday."


    "Wool shirts or sweaters for the cool days. Wool underwear for the cold. Wool
    blankets for the night air. A wool greatcoat for an evening trip up the St. Lawrence.
    Wool pants to keep out the cold of icy water. Wool felt for the soles of the waders
    to avoid slipping on the rocks; wool socks to be worn inside them."


    "Wool serves us well and makes life more pleasant and enjoyable. It would be difficult
    to do without the substantial benefits we derive from wool."


    The reason Mr. Smith can count on wool''s comfort and performance is that nature
    itself builds many unique features into the wool fiber.


    For one thing, it provides every wool fiber with a waxy shield that repels rain
    and snow. And strangely enough, this shield also has tiny pores that absorb moisture
    vapor. That''s why wool clothing protects you against the weather but never gives
    you that clammy, sealed-in feeling.


    Nature also gives the wool fiber a crimp or "permanent wave." These crimped fibers
    form millions of tiny air pockets that provide insulation and keep you warm—protect
    you against temperature changes.


    What''s more, this same crimp gives the wool fiber unique elasticity. It can actually
    be stretched 30% and still return to shape. That''s why wool gives you the freedom
    to swing a golf club or cast your line—without binding or restricting. And why
    wool clothing always looks so good, wears so well for so long.


    Your own experience will tell you—for a quiet walk in the woods or a rugged camping
    trip—American-made wools give you unmatched comfort. Nothing measures up to wool.


    This is a special message sponsored by American Sheep Producers Council.


    ## 舒适之奖


    一个很喜欢户外休闲的人，透露了衣服的秘密：

    C.R. 史密斯，美国航空公司总裁


    “我的假期，选择了在加拿大魁北克大注苏河捕捞大西洋鲑鱼。从多年的经验中，我知道，要度过一个愉快的假期，你需要羊毛服饰。


    “凉爽的天气，需要羊毛衬衫或毛衣。寒冷的天气，需要羊毛内衣。夜里需要羊毛毯子。晚上去圣劳伦斯河旅行，需要一件羊毛外套。还需要一条羊毛裤子抵御冰冷的水。防水靴上需要羊毛毡鞋底，避免在岩石上滑倒；里面要穿羊毛袜。


    “羊毛对我们非常有用，让我们的生活更加愉快。没有羊毛带给我们的这些实质性好处，我们的生活会变得艰难。”


    史密斯先生能如此依赖羊毛的舒适和性能，是因为大自然赋给羊毛纤维很多独特的特性。


    首先，它为每一个羊毛纤维提供了蜡质护盾，可以抵抗雨雪。奇怪的是，这种盾牌还有微小的气孔，可以吸收水分蒸汽。这就是为什么羊毛衣服能够保护你免受天气湿冷，却不会让你感到密不透气。


    大自然还使得羊毛纤维卷曲或“烫卷”。这些卷曲纤维，能形成数以百万计的微小气泡，形成绝缘效应，给你提供保暖效果——抵御外部温度的变化。


    更重要的是，卷曲的纤维，让羊毛具有了独特的弹性。即使被拉伸 30%，仍然会恢复原来的形状。这就是为什么穿着羊毛的衣服，可以让你在打高尔夫时，自由摆动高尔夫不受限制。为什么羊毛衣服总是看起来那么好，那么经久耐穿呢。


    你的经验会告诉你——不管是在树林里安静地徒步旅行，或是在崎岖的地方露营——美国制造的羊毛都会给你无与伦比的舒适。没有什么东西比羊毛更好。


    这是由美国羊毛制品生产商赞助的特别信息。


    ## 笔记


    ## 53、如何在 90°的高温热浪中让自己感觉像春天般温暖

    ## How to keep warm in a 90° heat wave


    Report on a paradox by Jim Bishop, syndicated columnist and author of "The Day
    Christ Died" and "The Day Lincoln was Shot"


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_207_0.png)


    Dallas in the summertime is hot. July temperatures sometimes reach the high 90''s
    and remain there. Still, at that time, the Neiman-Marcus store stages a successful
    sale of wool sweaters. The management has been doing this for the past two years
    and sales have jumped 53% in that time. And in many other cities, the sale of
    lightweight wools has increased.


    Why should this be? One answer is air-conditioning. We are living in the age of
    the fairly constant temperature. All over the nation, from Portland to Portland
    and from Duluth to Brownsville, our offices, theaters, restaurants, stores and
    homes are air-conditioned.


    The idea has now spread to automobiles. The thermal change is a great blessing,
    but it also chills the surface of the body. The antidote to this is wool—lightweight
    wool sweaters, slacks, suits, separates.


    Still, it seemed strange to me that millions of people would turn to wool in summertime
    so I engaged a few experts in conversation. They had the answers. I quote, "Wool''s
    crimpy fibers trap insulating air in fabrics. This blocks out cold and drafts.
    Yet because wool is absorbent—it prevents that sticky feeling in warm, humid weather.
    And wool''s light open-weave fabrics also provide cooling ventilation of the body
    when it''s hot. So lightweight wools are great for heat waves—comfortable in cool
    interiors or on hot streets."


    Since then, I''ve become wool conscious, and I am no longer surprised when I see
    every other man and woman wearing or carrying wool—or find my daughter Ginny wearing
    light wool slacks while pushing her twin children from shop to shop in the high
    heat of the afternoon. She seemed surprised to find that I was surprised that
    anyone would wear wool when even the birds were hiding in the protective foliage
    of the branches.


    She mentioned another point which would not have occurred to me: colors, patterns
    and weights are so varied that any taste can find satisfaction in today''s American-made
    wools.


    Smart kid. Never at the head of her class, but always the best dressed. She learned
    early that "nothing measures up to wool."


    This special message is sponsored by American Sheep Producers Council.


