    # 42、洗衣房的新革命


    A baby''s cries, a mother''s frustrations, started a scientific search that ended
    in—


    # Revolution

    in the

    laundry room


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_169_0.png)


    AT 7:01 a.m., a husband cheerfully stepped from his morning shower. "This will
    be a great day," he reflected. Then he picked up a towel and started to dry. "Janet!"
    he stormed at his wife. "what did you do —wash these towels in sand again?" In
    another city, 2000 miles away, a young mother lifted her 8-month-old from his
    bath. Gingely, tenderly—she diapered her young prince. Here truly, was peace and
    contentment. But only a few minutes had passed when the morning quiet was shattered
    by cries of anguish as the rough, harsh diaper irritated her baby''s tender skin.
    For years, scenes like these were typical. Who was to blame? Certainly not the
    housewives and mothers. For they had tried everything. Even drying outdoors in
    a vigorous spring breeze couldn''t bring back the softness. With discouragement
    and frustration, homemakers stood helpless as they watched their new washables
    become progressively stiffer, scratchier, more matted-down with each ensuing wash.
    To find the answer to this almost hopeless problem, scientists at A. E. Staley
    Mfg. Co., Decatur, Ill., started a search that ended with the discovery of a new
    product, Sta-Puf® Miracle Rinse.


    And it is a miracle, the way Sta-Puf works wonders in your wash. Just a half cup
    of Sta-Puf in the last rinse water restores softness and fluffiness to all your
    washables. Towels fluff up to almost twice their size. Woolens, blankets, knitwear,
    diapers, cardroys, once again feel soft and luxurious. Ordinary woolen sweaters,
    matted down by previous washings, feel like cashmere. What''s more, most flatwork
    dries almost wrinkle-free—requires little or no ironing. Embarrassing nylon cling
    is eliminated from undergarments. To make washday still easier, leading manufacturers
    of washing machines such as Hotpoint, General Electric, Philco-Bendix, Sears''
    Lady Kenmore, have spent millions of dollars to develop new devices which permit
    the adding of Sta-Puf automatically. Whether housewives use Sta-Puf in automatics,
    regular machines, or in hand washes, they agree it''s a great washday discovery.
    The Sta-Puf story is summed up in a letter from a Chicago housewife: "It is hard
    to imagine that only a few short years ago, we homemakers still faced the problem
    of rough, wash-hardened fabrics. But then, that was before Sta-Puf—the miracle
    rinse that started a revolution in the laundry room."'
