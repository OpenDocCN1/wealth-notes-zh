    金克斯舒适的坐在等候室，而我和孩子们则不停地张望，悄悄地看着我们的车，看着忙碌中的麦得斯“团队”。当看到我们之前那个生锈的，冒着烟的老消音器，被一个崭新的取代时，我们内心真的很高兴。最后，我们终于听从了麦得斯维修工的建议，放松了下来。


    “我认为你们15分钟肯定修不好，”我坦诚地说道。“没想到你们的速度这么快？”


