    # 39、一个适合发展的小镇


    # A good town to GROW in


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_160_0.png)


    Austin, Minnesota, is a typical Main Street town of 24,000 people, some of whom
    can still recall the day when George Hormel and his friend, George Peterson, opened
    a butcher shop in 1891. Today more than 4,500 Austin folks work in the big Hormel
    packing plant across the Cedar River, home of Spam, Dinty Moore and Mary Kitchen
    foods, Hormel Hams and Chili and 693 other nationally known meat products.


    Like many industries that grew up in the warm and friendly climate of a true "Home
    Town," the Hormel Company’s affection for Austin is genuine. Hormel men in Texas,
    Nebraska, California and Massachusetts think of Austin as home and take special
    pride in Austin’s progress and achievements.


    Geo. A. Hormel & Company believes that the unique flavor and character of Austin
    deserve to be brought to the attention of other industries and other manufacturers


    looking for the ideal Midwest "Home Town" where they can put down roots and grow
    as Hormel has.


    This, then, is Austin: High-quality people. Productive and understanding labor.
    Underlying spring water. Sewage facilities with surplus capacity for many years.
    On the new Inter-State Highway, coast-to-coast. Adequate rail transportation.
    One of the nation''s best school systems, plus an area vocational school to direct
    training to any need. Moisture average, 29 inches a year. Farm prosperity is high,
    stable, diversified and independent.


    If you want to know more about Austin, its people and its opportunities, please
    write to me or to the Austin Industrial Development Corporation. It''s my home
    town, and I hope I can help to make it yours.


    H. H. Corey, Chairman of the Board

    Geo. A. Hormel & Co., Austin, Minn.


