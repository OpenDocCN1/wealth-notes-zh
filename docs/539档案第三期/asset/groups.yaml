    # 13、你的孩子——不同的心理


    # Your child—and

    the psychology of variety


    ONE OF THE things that 50 years of making cereals has taught us is never to be
    amazed at the many good things that come from the good grains. But we were caught
    a bit off guard recently when psychologists pointed out that one of our products
    is a character-maker.


    They were referring to our Variety Pack. This, as you may know, is an assortment
    of ten individual boxes of our most popular cereals. We have come to look at it
    as a very convenient way for everyone in the family to get his choice. For it
    contains cereals that are flaked, puffed, popped and shredded—of corn, wheat,
    rice—ready-sweetened and not—all the variety anyone could ask for.


    But our psychologist friends pointed out that there’s something else in our Variety
    Pack. You can’t see it, but it’s good for you just the same. It is—“an opportunity
    for character-building freedom of expression in arriving at and making your own
    decisions.”


    ![](img/4a4110a48dd9dbd39e3d48b14a410300_69_0.png)


    What does that mean? (We asked, too!) It simply means that being able to make
    up their own minds—even on little things—helps shape youngsters’ characters. Gives
    ’em confidence, helps ’em make decisions. Helps ’em grow up mentally, while they’re
    growing physically. Helps free ’em from frustrations of always being told what
    and what not to do.


    We not only thought this made a lot of sense, but was interesting enough to pass
    along to you.


    Not that we expect all youngsters who get to make their own decisions from Kellogg’s
    Variety Pack will automatically grow up to be chairmen of boards of directors!
    But isn’t it nice to know, that you are also serving up a little lesson in life
    when you put Kellogg’s Variety Pack in front of your child at breakfast. Why—even
    that big boy at your house may find it tastes extra good to be a man of decision!


