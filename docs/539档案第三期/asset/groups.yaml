    # Are you ready for emergencies like these?


    Now is the time to check your first-aid cabinet... for more accidents occur in
    the summer months than in any other season.


    In fact, during the summer there is a daily average of 280 accidental deaths,
    to say nothing of the almost endless number of burns, cuts, bruises and other
    injuries.


    So, it is important to know what to do and what not to do in situations ranging
    from minor cuts to more serious injuries.


    To treat minor cuts: most cuts heal quickly if cared for promptly, but can become
    serious if infection develops. The first thing to do is to wash the cut under
    warm running water. Then apply a mild antiseptic and sterile compress.


    If iodine is used, remember that it becomes stronger with age and old solutions
    should not be applied.


    To treat more serious injuries: falls can cause serious injuries. If you suspect
    a fall has caused a broken bone, do not move the victim unless absolutely necessary.
    Keep the patient warm and comfortable and get medical care promptly


    If an accident occurs and you cannot determine its extent or seriousness, call
    a doctor. Describe the injury, tell him where the victim is, what you have done,
    and the victim''s apparent condition. The doctor can then offer suggestions, decide
    how urgently he is needed and for see what equipment he should bring.


    To help you give the right care at the right time, Metropolitan offers its new
    first-aid chart. It tells what to do for many common emergencies. It also features,
    with illustrations, the new method of life-saving to apply when someone nearly
    drowned.


