    Growing up and liking it are often two things apart for the adolescent girl. Many
    strange things are happening. Many new emotions are welling up. Many questions
    are piling up—and being left unasked, or worse still, unanswered.


    Why did I turn out to be a girl? What makes me blue every so often? Do I have
    to feel ill on certain days? Will a boy know when those days come around? Do I
    have to put up with problem days for the rest of my life?


