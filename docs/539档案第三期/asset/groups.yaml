    家庭主妇们一直追求清洁彻底的洗衣方法。现在，很多新面料，像晴纶针织衫、免烫床单、增塑便装，男装中的合成纤维等，都需要安全的全面护理。


    现在，许多城市和乡镇上细心的家庭主妇们都发现，新型3环液压泵洗衣机，几乎就是他们理想中的样子。它可以安全地清洗如今的各种面料。这款全新温柔的洗涤呵护机器内部，采用了一款独有的搅拌设备，上下泵没有叶片，不用对面料产生拍打，就能洗涤出深层污垢。


    没有叶片推动或拉扯织物，使得所有的衣服获得了“洗浴般”的护理。不用拉扯，织物就能被清洗干净。床单在被清洗过程中，再也不用被缠绕，拉扯。衣物清洗后，不会变形。


    这款新型洗衣机最近引人注目的表现，来自电冰箱家政部门的一则新闻，新闻上表明，这款洗衣机即使是脆弱的玻璃纤维窗帘也可以清洗，不会带来任何损坏。没有破坏。1960型号的北极牌洗衣机，曾做过多次玻璃纤维窗帘的清洗测试。


    1960型号的北极牌洗衣机它的升级之处还包括，自动水下漂白和染色，自动清除线头。并且，真正做到了免烫。


    美国测试公司，在实验室中对6种知名自动洗衣机进行了测试，北极牌洗衣机在各方面的性能都排行第一。(57761号报告 日期1959年5月21日。)


    北极牌自动洗衣机，以及烘干机，是北极牌高级家电的典型代表，全心全意为你而设计！'
