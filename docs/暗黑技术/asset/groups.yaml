    我在參加她的演講時，提出了這樣的問題：「在公司經營狀況惡劣，股東也不斷施加壓力之際，妳心繫的是什麼？妳懷著什麼樣的信念，度過那段艱辛的日子呢？」她馬上回答：「客戶。」


    「我從來沒去想股東的事情，我只思考，該怎麼做才是對客戶最好的。」她說。雖然也有可能是場面話，但比起短期內提高股東利益，穆凱伊更看重的是公司應該如何回應客戶的期待。對理念貫徹始終，是她厲害的地方。


    沒有人在成為領導者時，就擁有十八般武藝。雖然有許多不足之處，但仍然有比別人優秀的地方，也能夠獲得他人的認可，讓人願意追隨，就能成為領導團隊的角色。也就是說，並不是取得必要的技術後就能獲得升遷，而是先被授予某個職位之後，再慢慢跟別人借重長才，滿足該職位所需的能力。


    ## 掌握清楚自己的不足之處，然後集結能力互補的人才，組成團隊


    掌握清楚自己的不足之處，然後集結能力互補的人才，組成團隊。若無法改變想法，永遠無法當上領袖。而且，你也有可能 會遇到突然被指派擔任領導者的時候，必須隨時做好準備。


    但不是學習到所有技能就會拿到重要的職位，而是職位培育人才。真正的領袖會勇於承認自己的不足，並尋找人才，建立能力互補的團隊。


    ### 諜對諜的情報戰要靠人脈勝出


    想建立能力互補的團隊，平時就必須仔細觀察周邊的人事物：這個人擁有什麼樣的技能、有怎樣的人格特質、在什麼情況下最能發揮實力。同時，也必須經常在腦袋裡模擬團隊組成的樣子，不僅是從數字敏感、說起話來口若懸河、非常有說服力等光明技術來評估，也必須將暗黑技術的緊急應變能力、對他人影響力的大小等考量進來。


    組織當中也有許多不同的作戰方式，例如，空中戰時要拉攏誰到自己的團隊，建立飾團；相反的，在地面戰時，拉攏其他人作為夥伴可能會比較有利等。如同在地圖上進行兵棋推演，要依據不同的戰局，思考各種可能的作戰策略，例如：什麼情況要安排誰上場作戰、戰將分別扮演何種角色。能否沙盤推演各種不同的模式，是改革成功與否的關鍵。


    所以，除了公司的組織圖之外，建構出屬於自己的作戰地圖是非常重要的。假如組織的指揮命令系統是骨架的話，屬於自己的作戰地圖就是滲透組織各個角落的情報網。組織內最關鍵的就是情報戰，擅長間諜活動，也就是擅長蒐集情資的人才是贏家。


    資訊必須從誰的手中取得？自己的情報網在組織當中是否夠廣、夠牢靠？如果無論對上、對下，還是橫向都有情報網，公司所有風吹草動的資訊都能取得的話，便有非常高的機會能獲得勝利。在公司內部人面廣的人，能夠自由運用暗黑技術，讓改革順利進行。


    即便是公司內部，間諜活動就像是美國中央情報局一樣會碰到諜對諜，因此視情況，甚至必須接近自己討厭的人。因為反抗改革的守舊派，擁有豐富的資訊，你必須想辦法從他們口中套出有用的情報。只對合得來的人布下情報網，是無法從敵營竊取到任何資訊的。


    ## 成為經營者的情報網


    想在公司內部布下情報網，細數出自己的不足之處是首要之務。什麼是自已做得到的？什麼是自己做不到的？有誰能夠補足自己做不到的地方？要讓誰跟誰搭上線？該如何做人員配置？能否在策略的關鍵點正確安插關鍵人物？就像在畫作戰地圖一樣，需延伸情報網的突觸。


    ### 圖 10 光明顯著跟暗明顯著


    ![](img/c5f4a27546ec03b05790e1504b0b945b_83_0.png)


    - 普通公司員工

    - 大學時期的高強

    - 認識的創業家


    告：「其實我的部門有這樣的問題」，「那個部門在討論這樣的事情」，你就會成為對方情報網的一部分。


    在公司裡能夠建立怎樣的內部網絡關係，自己能否成為經營者重要情報網交觸之一，需要的，正是高超的暗黑技術。情報網不僅僅只是公司內的人脈，而是遍布、深植組織各角落，有緊急狀況發生時能動員公司、讓上下團結一致，關係緊密的情報網。


    ## 狠角色每天跟不同人吃午餐


    網絡關係會越用越廣，同樣的道理，經常跟他人交換資訊，彼此的關係就會越來越牢固。一起去吃午餐、偶爾吃飯喝酒，都是擴展關係的好機會。


    跟不會喝酒，或是重視私人時間的屬屬一起用午餐，應該是個好選擇，因為總可能不吃午饭。藉著跟情報網的資訊提供者定期一起吃午餐：「話說，那件事情後來怎麼樣了？」隨時更新資訊，一旦遇到緊急狀況就能派上用場。


    在員工餐廳吃飯時，大部分人都固定跟同部門的同事一起吃飯，但是狠角色則會拿著自己的餐點，四處張望，心中盤算今天要跟誰吃飯，跑去問別人：「我可以坐你旁邊嗎？」每天跟不同的人吃午餐。


    聽說日產汽車的執行長高恩在剛到任時，行蹤神出鬼沒，常常突然到工廠巡視，召集大家圍成一圈，詢問員工的想法。像那樣直接到現場，不但可以蒐集到第一手資料，還能拓展情報網。據說，高恩就是依據親自蒐集到的第一手資料，勾勒出「日產復興計畫」的藍圖。


    如此一來，急於延伸網絡關係的主管也會變得戰戰兢兢。因為自己不知道的資訊，會越過自己直接到老闆手上，使主管也不得不經常到現場巡視，蒐集資訊。主管也變得積極的跟現場員工溝通，促成了日產汽車的組織活性化。


    ### 建立自己的人際網絡


    主管如果擁有自己的網絡關係，多次模擬、評估可能的發展，及縝密的沙盤推演，是成為經營者的重要訓練。此時建立的網絡關係，會是一輩子的財產。


    ### 「你手機的通訊錄裡，有幾位自己所屬部門以外的人？」


    時常換工作的人，根本沒有足夠的時間建立網絡關係。擁有豐富的經營管理經驗，以及理性、敏銳觀察力的經營者，在遇到緊急狀況時，能夠冷靜判斷公司的狀況，果斷的決定。另一方面，比起粗暴的單方面決定，平時公司更需要的是活絡基層，因此，沒有內部網絡關係的外來專業經理人，必須從頭開始，因此相當辛苦。當時的日產汽車比較偏向是遇到緊急狀況，但高恩所做的卻是建立公司內部的網絡關係。


    而在公司打拚了十年、二十年的老員工，他們最大的財產就是公司裡穩固的網絡關係。等有了身分地位之後，再來建立網絡關係有其極限。正因爲如此，在三十幾歲、四十幾歲的時候，爲防範未然，必須有意識的建立並拓展屬於自己的網絡關係。然而，擁有自己所屬部門的網絡關係可以說是理所當然，因此，所屬部門之外也擁有穩固的網絡關係，便成爲重要的關鍵。


    細微的資訊大多來自檯面下的關係，因此不會在電子郵件或書面留下紀錄。你手機的通訊錄有幾位所屬部門以外的人呢？你可以從能否馬上打電話問對方：「你知道那件事情後來怎麼樣了嗎？」來判斷，算算看手上有多少可以用的棋子。幾乎沒有可用棋子的人，爲了你的將來，現在最好馬上建立自己的網絡關係。


    ### 走出去尋找願意斥責自己的導師


    另一個補足不足之處的重點，就是找一位好導師。當職位爬升到一定程度之後，就不再會有人提醒自己，一不小心就會變成沒穿衣服的國王，所以最好找幾位願意斥責自己的導師。


    對我而言，無印良品的松井忠三是我的重要導師之一，於本書後半部分便邀請到松井進行對談，敬請期待。


    雖然我們不是每個月都碰面，但只要有機會聊天，導師總是願意說出：「你那邊不對」，這樣的關係相當難得可貴。因爲隨著在公司的職位越來越高，願意斥責你的人會越來越少，奉承的人則越來越多。被奉承的人圍繞，可能會覺得很舒適愉快，但僅止於此而已，所以更應該珍惜願意斥責自己的人。


    然而，在同個組織之下，主管跟部屬之間有直接的利害關係，無論是說的那一方，還是聽的那一方，都難以坦率面對彼此。因此，導師最好從外部去找。這個時候需要的不是垂直或橫向關係，而是斜向關係。想在公司外部找到這種關係的話，就必須自己走出去。


    ### 不善交際也要有意識的拓展外部網絡


    那麼，該如何建立公司外部的網絡關係呢？一般上班族，甚至是在大企業上班的人，跟外部接觸的機會都出乎意料的少。因此，如果不強迫自己走出去的話，就不會有任何改變。


    例如，異業交流的讀書會，只要用心去找，就會發現其實有不少。把參加讀書會當作是投資，最好保留一定的時間投資在自己身上。如果不利用下班時間或週末參加這類活動，想遠離公司的封閉組織恐怕相當困難。即便跟交易對象或客戶之間有聚會，也必須有所自覺。有用的網絡關係不會從天而降，必須自己努力建立。我雖然從管理顧問業跳槽到
    IGPI，但受到擔任顧問時保密合約的限制，跟外部的連結其實並不多。然而，出身投資銀行跟金融機構的人，经常在併購案或投資案上碰面，彼此熟悉，案子許多也已經公諸於世，因此在金雞業當中有横向關係，業界的網絡關係也容易建立。


    在跳槽到 IGPI 後，由於我並未擁有公司外部的網絡關係，便相當積極參加外部的交流會跟讀書會等活動。這樣的外部活動我參加了十幾年，深刻感受到自己的網絡關係變廣了。


    我的個性其實不善交際，對現在的我而言，參加已經形成小團體的讀書會仍有相當的難度。


    一個人闖進大家彼此非常熟悉的團體，一邊自我介紹：「您好，初次見面」，一邊交換名片。即使大家投以「這傢伙是誰？」的冰冷眼神，也要努力想辦法發表精關的意見，讓大家對自己產生興趣。這也是一種訓練。老實說，我到現在仍然不太擅長在新團體交朋友，但是我把它當成是拓展情報網接觸的重要機會，仍持續努力著。


    相信各位工作一定非常忙碌，但如果不想法擠出時間投資自己的話，就無法超越自己既有的格局。對部屬說：「多樣化很重要。」自己卻沒有對外交流的主管，一點說服力也沒有。因此，必須努力對外參加各種交流活動才行。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_91_0.png)


    被討厭是一定的，得到尊敬就夠了


    ## 在資訊不充足的情況下就做得決定


    大家聽到「結構改革」這個詞，就會聯想到「關廠」「裁員」等負面印象。雖然結構改革的確包含了那樣的面向，但原本的意旨是事業跟組織的新陳代謝。結構改革的重點在於，組織因應環境變化，汰舊換新，緩慢但確實的持續著新陳代謝。並不只是指那種會上新聞報紙整個版面，大規模整頓並退出事業，或是併購案等大膽的結構改革。反倒是平時的日常活動當中，有非常多地方需要大量的結構改革，也就是說，有許多必須進行新陳代謝的事物隱藏在組織當中。


    那麼，日常活動的新陳代謝指的是什麼呢？


    各位應該有碰過這樣的情況吧？當部屬請你做決定時，越是合理且容易導出答案的事情，或是腦袋已經大致有答案的事情，反而越不容易果斷下決定。例如，有件事情必須從兩個選項當中擇一，選擇
    A 的話，必須跟某某人說明，感覺很麻煩；而選擇 B 的話，就必須跟隔壁部門的某某人協調，看起來很費事。也就是說，不論選擇哪一個，心裡總有些疙瘩，事後回想起來令人不快。即便如此，主管仍然必須從中做出決定。


    作為帶人、管理部屬的主管，所做的任何決定多少會對其他人帶來影響。當自己還是單打獨鬥時，決策只會對自己一個人造成影響，因此馬上就能做出決定。然而，一旦決定會對他人產生影響時，就會變得無法當機立斷，這樣的狀況難以避免。


    這也是造成「問題拖延症」的元兇之一。而有問題拖延症的人，經常使用的藉口就是「因為資訊還不夠充分」。但我認為，真正的決策，大部分都必須在資訊不充分的情況下做出來。反過來，蒐集好所有判斷事物所需的資訊，引導出合理的答案，稱不上是真正的決策。如果不利用經驗跟直覺，在資訊蒐集到約六、七成的階段就做出決定來，腳步就會停滯不前。


    > 「真正的決策大部分都必須在資訊不充分的情況下做出。」


    ### 不逃避解決日常瑣事


    當我們必須依據不充分的資訊，針對本來就暧昧不清的事情做決定時，容易以「再多觀察一陣子好了」為藉口逃避抉擇，這是人的天性。


    如果被逼到絕境時，不管想不想都必須做出判斷；但日常瑣事，也就是即使現在不做決定，對現狀影響也不大的事情，毫無疑問會讓人想延後處理。然而，每個人都放任小問題不管的話，會使組織新陳代謝的速度變慢。


    反過來看，位於經營第一線的主管，如果不逃避做決策，在正確的時間點做出決斷，自然能促使組織新陳代謝。小小的拖延累積下來，其實會造成事業跟組織的僵化，也是招致公司老化現象的後果。


    ### 做好被貼上壞人標籤的準備


    主管每天面對的日常決策當中，還隱藏著一個自相矛盾的情況。現場的人在前線廝殺，竭盡全力跟眼前的敵人搏鬥，視線最遠只能達到半徑三公尺的範圍，因此只看得清楚今天跟明天的事情。然而，同樣的問題用較為長遠的角度跟宏觀眼光來看，當然會產生不一樣的看法。跳脫本位主義，從整體最佳化的角度思考未來的五到十年時，就會浮現疑問：「一直沿用同樣的工作方式真的好嗎？」


    這時候應該有人已經隱隱察覺到，如果不想辦法做些改變的話，後果恐怕不堪設想。但內心也知道，如果下猛藥進行改革，可能會引發現場人員的激烈反彈。一旦陷入這種混亂的狀態，自己一個人實在無法判斷，就需要請上層做出決定。


    但老實說，主管並不希望上層做出向左或向右的明確決定，會期待延後處理，因此會無意識做出那樣的暗示，傳遞應該延後處理的資訊。因爲那樣對自己而言樂得輕鬆，而且獲得老闆的背書，就可以正當化延後處理問題。


    然而，就像日本菸草公司在獲利達到最高峰的隔年關閉工廠、大規模裁員，出售賺錢的飲料事業一樣；又例如，IBM 在相當早的階段，就將個人電腦事業賣給中國企業聯想電腦。他們決策的時間點都讓人不禁驚呼：「什麼！」


    從長遠的角度跟宏觀眼光來看，為了不讓問題越滾越大，那些都是最佳的決策時機點。


    > 即便決策正確，做出決定的那一方仍然有被討厭的風險。


    只不過，那樣的判斷跟現場人員的立場相異，無論如何，一時之間都會變成顧人怨的討厭鬼。某些情況下，判斷是否正確，有可能要等五到十年後才會知道。在答案揭晓之前，會一直被貼上壞人的標籤。


    決策者跟受影響的人之間的立場不同，即便決策正確，做出決定的那一方仍然有被討厭的風險。另一方面，如同前面所說，不斷延後處理，會使問題如雪球般越滾越大。因此，負責現場營運的主管必須不怕被人討厭，在問題還小的階段，就動快的推動改革，促進組織的新陳代謝是非常重要的。


    ### 你無法同時兼顧平易近人跟受人尊敬


    雖說只是小小的決策，但只要改變現狀，就會發生對一方有利，但對另一方不利的情況。因此，身爲組織的領導人，根本就不可能受到公司全體上下的愛戴。想讓大家開心、討好每個人的人，無法成爲未來領袖。


    然而，一直以來都是尋求全體成員的共識，採取由下而上決定事物的人，擅長聽取所有人的意見，然後從中找到折衷點。這是最受到大家喜愛的決策方式。習慣在大家面前當好人，喜歡受人喜愛的人，很難做出突然與某人爲敵的決斷。如果無法做到即使被討厭，也能堅持立場、正言厲色的話，就會變成看大家的臉色做事，最後讓問題延宕。


    主管和部屬之間的距離拿捏非常重要。作家鹽野七生在《羅馬人的故事》當中提到，親近感跟敬意無法兼顧。受到部屬喜愛，跟受到敬畏是不一樣的。如果雙方距離太近，雖然表示彼此相當親近，但會失去緊張感，就無法在關鍵時刻嚴厲斥責。雖說如此，若雙方距離太遠，便無法建立信任關係，讓部屬成爲自己的左右手。


    以「喜歡」跟「討厭」爲縱軸，「距離近」跟「距離遠」爲橫軸，畫出如下頁圖十一的矩陣圖。過去的領導者跟大部分的人關係良好，靠近「喜歡」位置的非常多。雖然職位越來越高，跟部屬之間的距離也越來越遠，但卻不會偏離受部屬「喜歡」的位置。因為被討厭的人，根本不會獲得升遷。


    ### 圖11 「喜歡×討厭、距離近×距離遠」 矩陣


    ![](img/c5f4a27546ec03b05790e1504b0b945b_98_0.png)


    然而，改變過去的做法、推動改革的領袖，光只想著如何盡如人意，是無法盡到應盡責任的。即便會被討厭，該做的事情還是得去做。所以，即使會被大家討厭，只要讓對方對自己懷抱恐懼與敵意的話，就有辦法影響對方。


    馬基維利在《君主論》中提到，人之所以會受到他人影響，是出於對對方的恐懼或喜歡的情感。喜歡的情感，比較是仰賴對方的心理因素；而讓對方感到恐懼，則比較跟自己有關。


    也就是說，與其倚靠自己無法控制的部分，不如利用能夠控制的地方去影響他人才比較合理（此外，馬基維利也提到，恐懼跟憎恨是不同的情感，讓人憎恨，最後惡果會反彈到自己身上，所以別把恐懼與憎恨混為一談）。「敬畏之心」這個詞，指的正是對方對自己既恭敬又畏懼的複雜情感。


    > 即便會被大家討厭，只要讓對方對自己懷抱恐懼與敵意的話，就有辦法影響對方。


    IGPI 的代表富山和彥正是這種類型的人，只要他一出現，空氣就會瀰漫著緊張的氣氛，欠缺周密思考的發言，很容易被牠叮得滿頭包。跟這種人說話無法隨便呼嚕過去，因此面對他必須認真的發言。好的緊張氣氛，會使團隊變得更強大。


    ### 太陽跟北風，改變組織需要的是？


    我對無印良品前社長、現為名譽顧問的松井忠三處理庫存的故事，印象特別深刻。松井在二〇〇一年剛上任社長時，無印良品的虧損高達三十八億日圓。在必須立即止血的情況下，松井做了好幾件極具象徵意義的事情。其中一個就是把堆積如山、賣不出去的庫存全部集中起來，在員工面前燒掉。雖說是賣不出去的庫存，但是對產品設計師而言，看著自己一手孕育的作品在眼前被燒掉，有些人還忍不住哭了出來。面對公司虧損、缺少可用現金的情況，一般而言，都是想辦法賣掉庫存，拿去補貼虧損的洞，但松井不這麼做。他以燒掉庫存的方式，讓全體員工明白他對半調子態度說不的決心。


    過去採購企畫為避免缺貨，都會大量進貨，這中間造成了許多無謂的浪費。而松井指出這個問題，並以身作則，而且不僅一次，他做了兩次同樣的事情，宣告改革的決心，最後終於讓公司轉型成功。


    結果，原本二○○五年約五十五億日圓的庫存，在幾年後減少到只剩三分之一的十七億。那是相當激烈的手段，讓人留下深刻的印象。如果沒有做好被討厭的心理準備，根本無法做到。


    ### 改革的最大反對勢力就是現場人員


    改革的最大反對勢力就是現場人員。因為組織的慣性，使員工難以改變。半調子的改革無法改變組織，像太陽散發光熱，等大家自己脫掉上衣的方式根本就不夠，有時若不會拿出如狂烈北風般的堅毅態度，組織不會有任何改變。


    在這個過程當中，部屬有可能在被斥責後就離開公司，但絕對不可因此動搖。一旦想要討好部屬，改革的方針就會走偏。能否對自己有信心，面對各種狀況仍然泰然自若、處變不驚，決定了領導力的高低。


    ### 根據情況利用手上的牌


    昔日的威權管理，現在成爲黑心企業的代名詞，大家都避之唯恐不及。現在提到如何提高部屬的幹勁，都說要盡量誇獎員工，笑臉迎人，必須有技巧的激勵部屬。然而，那只是由下而上的協調型領導者才會做的事，不是由上往下的改革派領導者會採取的行爲。


    想讓自己的意見獲得大家的認可，有時必須運用暗黑技術，做好被人討厭的準備，依據不同的情況，靈活運用手上的牌。例如，嚴厲斥責以激勵對方的牌：用誇獎提高對方幹勁的牌；以理服人，深入討論的牌：不容分說，強制實施的牌等。


    總是打出笑容滿面的牌，雖然表面上看似受到部屬愛戴，但大多時候其實是被下面的人看扁了。若想分開使用這幾張牌的話，就必須跟部屬保持適當的距離。距離太遠或太近，都有可能會使手上的牌減少。


