    我認為不逃避踐踏聖像威脅的重點在於，意志力要夠堅強，而且強健的事業體質也相當重要。即便公司規模不大，只要技術跟商業模式等擁有獨特之處，就不會輸給別人。另外，雞蛋不要放在同一個籃子裡，應該要與多間廠商合作。假若跟某間客戶交易'
