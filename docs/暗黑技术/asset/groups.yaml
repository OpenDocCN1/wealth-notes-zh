    # 你有多少领导者魅力？


    們都是排除萬難也要實現改革，擁有強烈信念的人。徹底改變過去的做法，將改革大刀揮向公司的體制結構。在反對改革的保守勢力強勢的威脅下，若經營者沒有堅持改革的執念，很有可能會失敗，輕易恢復原狀。如果沒有想要達成什麼的執著，便無法成為推動改革的真正領袖。


    如果知道自己沒有那種執念，從一開始就不要以成為領導者為目標。現今工作型態多元，像過去那樣在終身雇用制度下，全體員工以成為領導者為目標的時代已經結束了。運用自己的專長成為專業人員也好，成為經營高層的參謀也行，或是順從欲望，過自己想過的人生都可以。生活型態選擇多元，只要找到最適合自己的生活方式，就能讓日子過得很快樂。


    > 「工作完全仰賴頭銜的人，在失去頭銜的瞬間，底下的人就會一一離去。」'
  - '[PAGE 151]


    過去的領導力是以職務權力為基礎。社長或經理的頭銜具有相當的意義，比起因為個人，大家更因為頭銜而選擇服從。然而，現在光只有職務權力，是無法管理部屬的。勝負關鍵在於擁有多少領導魅力。


    利用頭銜的威權管理，容易變成利用部屬產生恐懼心的恐怖政治。但歷史已經證明，恐怖統治無法持久，總有一天民眾會反撲。而且，工作完全仰賴頭銜的人，在失去頭銜的瞬間，底下人便會一一離去。


    如果某位經理問下頭的年輕部屬：「今天要不要去喝一杯？」對方反問：「有加班費嗎？」就表示部屬覺得不值得跟這個人去吃飯喝酒。也就是說，對方對主管沒有期待。若部屬覺得「想聽聽這個人的想法」、「和這個人攀上關係有好處」的話，應該不至於每次都拒絕邀約。


    不利用職務威權讓對方聽話，你的領導魅力是否足以讓別人覺得「如果是這個人的話，我願意幫他做事」呢？那樣的領導魅力必須從平日的言行舉止中不斷累積、培養。


