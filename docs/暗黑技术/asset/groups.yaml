    ## 七個暗黑技術


    這個人是敢於孤注一擲，選擇挑戰呢？還是選擇守勢直到最後？改革代表著改變，過程必然伴隨著風險。充分了解狀況之後，你也能繼續往前邁進嗎？改革是測試領導者決心跟勇氣時刻。


    比起用加分的方式評價事物，在奉行扣分主義的企業，一旦黑掉就很難翻身，所以大家害怕挑戰、討厭冒險。因此，許多組織非常擅長打模糊仗，在做決定或推動新政策的時候，根本看不出來是由誰承擔風險、誰承擔負責執行。例如，即便是在經營決策會議上，也看不出來決議結果是根據誰的發言而決定的。在意見趨於一致的時機點，經營企畫部的人就會跳出來說：『那麼，就照這個方向去做。』漂亮定出了方向。反過來說，擅長解讀並規畫這種流程的經營企畫領袖，便會被視為公司的珍寶。


    當會議後送來的會議紀錄草稿，一字不漏的記載著每位董事的發言時，董事們看了會紛紛以『我所說的並不是這個意思』為藉口修改內容，因此，最終版會議紀錄會被修改得非常含糊不清、模稜兩可。那樣的文件最終獲得全員的認可，使責任歸屬更加無從得知。在許多企業之間，因為大家都迴避風險，所以採取保守策略可能還多少適用。然而，一旦跟不在乎風險、一路進攻的創投公司與外商企業對決時，便不堪一擊。


    改革創新，開闢新事業的時候；為搶攻市占率，跟對手決勝負的時候；因制度陳舊，而引發各種問題，必須改革組織根本上的結構時，必須冒險進攻的局面必定會到來。那時，誰會站出來承擔風險呢？部門的領導者有辦法承擔嗎？部屬正仔細觀察你的一舉一動。


    ### 真正的領導者掌握「不是殺人就是被殺」的暗黑世界


    以人工智慧、物聯網等技術革新爲基礎，自動駕駛汽車跟機器人等，被稱爲第四次工業革命的創新產業。比起孕育自迴避風險傾向強烈、大企業的研發部門，有越來越多技術跟產品，誕生自敢於承擔風險的大學研究室跟新創公司。因此，大企業如何開放創新，對外與新創企業合作，成爲重要的課題。


    然而，傳統的大企業卻經常见不起新創企業。不論公司規模大小，願意以對等關係來往的大公司並不多。


    我曾經參與過多次談判交涉，例如，某一次的經驗是，大企業跟新創公司針對合作議題上了談判桌。大企業這方帶隊的是經理等級的主管，約有三、四人隨行，即便當時是夏天也穿西裝、打領帶，坐成一排。而另一邊的新創公司，只來了一位二十多歲的年輕人，穿著短褲、T恤、涼鞋，手上還拿著星巴克的冰拿鐵之類，一邊走進會議室，一邊跟大家打招呼：「大家好呀！」那位年輕人一進門，大企業這方立刻瀰漫著「這傢伙是瞧不起人嗎？」的氛圍。交換名片時，年輕人說：「有什麼緊急狀況時，用LINE或即時通比較好聯絡，可以告訴我您的帳號嗎？」更使大企業這方感到不愉快。


    這位年輕人非常厲害，雖然跟公司規模也有關係，但是他一個人就可以做主決定十億日圓的合作案。這案子合作與否、合作的內容等，全看他一個人當下的判斷。


    然而，大企業當下卻無法做出任何決定。決策的速度差距太大，根本談不起來。


    承擔風險的人，跟迴避風險、習慣謹慎決策的大企業組織，這之間的差異簡直天壤之別。


    在商場，有著只要做得漂漂亮亮，賣得出去就好的光明世界，以及不是殺人就是被殺，必須實槍實彈決勝負、不擇手段的暗黑世界。頭腦清晰的人活耀於光明世界；另一方面，能解決盤根錯節的人際關係、被捲入麻煩事時也能處變不驚的危機處理能力等，擁有暗黑技術的人，則掌握了暗黑世界。


    考驗領導者信念的時刻不在平時，而是危機來臨之際。面對踐踏聖像的威脅，你是想都不想就踩下去呢？還是有辦法堅持自己的選擇？無時無刻都避開風險的人，一遇到重要時刻就會退縮。雖然有「被討厭的勇氣」能派上用場，但是想對外產生影響力的話，就必須做好相應的心理準備。


    ### 即使暫時黑掉，你也能耐住性子嗎？


    在改變過往的組織結構、經營策略的時候，因為慣性作用，組織會想維持過去的結構與做法，因此在改革初期，短時間內績效為負成長是難以避免的。


    例如，依據公司經營策略的改變，將過去依地區畫分的業務部門，改成以產品別重新畫分時，短時間內一定會產生效率低落、業績呈現負成長的狀況。因此時常導致經營第一線亂成一團，最後舉起白旗：「果然還是原本的方法比較好。」但這其實是組織的慣性，並引發現場反抗改革的情況。但若因為業績變差，抵擋不住反抗聲浪，馬上撤回改革政策的話，根本就不是稱職的領導者。


    即便反彈聲浪再高，承受的壓力再大，領導者也必須耐心等候業績回升。只要堅持自己的信念，情勢轉變的時刻總會到來。但是在那之前，你有辦法咬緊牙關耐心等待嗎？在等待的過程中，當然也會碰到上頭責備：“這到底是怎麼回事？”以及下屬慍：“應該還是以前的做法比較好吧？”這種上下夾擊的情況，即便如此，你也能堅持不屈服嗎？這也是考驗信念的聖業之一。


    承擔風險時，雖然成功後的獲利值得期待，但也有一定的機率會失敗。以足球為例，就採取進攻時，射門前會充滿疲綻，一不小心球就會被搶走，遭到反進攻的機率增加是同樣的道理。


    但實際上，我看過好幾位勇於承擔風險、下賭注一決勝負，但卻不幸未能如願，最後以失敗收場的例子。老實說，在這當中也有人讓我不禁感嘆：“啊，這個人大概再也站不起來了把。”然而，這樣的人在五年後，又會再度回到公司核心的情況更是屢見不鮮。奇特的地方就在於，不知為何，大多組織皆保留著奇妙且健全的“回力鏢作用”。勇於挑戰卻一敗塗地的人，短時間內會黒掉，被踢到不重要的職位，但過幾年之後，又會再度回歸經營核心。


    如果各位也相信這個回力鏢作用，請務必趁現在多多挑戰、冒險。假如不幸失敗，也只是被流放邊疆，至少不會喪失性命，只要去睡一覺冷靜一下，等待東山再起的機會。現在是經歷過大風大浪的人容易獲得賞識的時代，所以那樣的人只要耐住性子，等待風向轉變就好，三、四十歲的人應該要敢於承擔風險、盡量挑戰。


    豐田汽車前會長奧田碩的性格正色敢言、磊落不羈，因此和大企業文化格格不入，實際上，在他四十多歲時，就曾經被左遷至菲律賓分公司。如果奧田因此一蹶不振的話，故事就結束了，但他反而將貶職當作大好機會，做出一番成績，另闢出一條成爲社長的道路，上演了一齣絕地大反攻的精彩戲碼。


    機會不知道會在哪裡出現，被降職的新崗位，搞不好是炙手可熱的新興市場，是鎂光燈的焦點。即便被賦予難題，能夠認真以對的話，事情做起來將有如神助，能夠達到意想不到的成果。


    相反的，如果不願意承擔風險，避免失敗，迴避挑戰而存活下來的人，即便爬到上頭的位置，也無法率領眾人，打造出強大的團隊。因爲逃避踐踏聖像考驗的人，沒有資格擔任領導者。


    ## 暗黑毀術七

    ### 帶人不能靠頭銜，有時得懂得讓自己被利用


    ### 改革之窗的開啓只有一瞬間


    雖然領導者必須看準時機，勇於冒險進取，但是在風平浪靜的狀態下，也就是說，想平時突然進行激烈的改革是非常困難的。而且公司越大越久，維持既有狀態的慣性就會越強，因此想轉換方向並不容易。暫且不論公司的所有者：大公司經理等級的主管，即便本人充滿幹勁，大聲宣示：「改革的時刻到了！」也只會徹底被忽視。想平靜大海掀起一點浪花，就是那麼困難。


    然而，像那樣的大企業，改革之窗也會有開啓的時刻。改革之窗開啓的時刻是指，因外部或內部環境產生變化，使得過去既有的工作習慣不再適用的情況。最近最具代表的就是雷曼兄弟破產引發的全球金融海嘯，以及日本三一1大地震等劇烈的外部環境變化；也就是發生緊急狀況的時刻。在風向轉變、窗戶開啓的瞬間，隱藏著實行大膽改革的機會。


    然而，改革之窗的開啓只有一瞬間，一旦錯過了這個機會，下一秒窗戶馬上就會關上。因此，必須抓緊窗戶開啓的瞬間，擁有讓改革一氣呵成的瞬間爆發力。養兵千日，用在一時，因此需要長時間不斷的累積改善。其中一個重點就是，必須擁有屬於自己的網絡關係。


    針對在公司各角落布下的突觸，不斷傳遞自己的想法跟價值觀，讓更多人對你的想法產生共鳴是相當重要的。唯有平日腳踏實地的宣傳，才能在重要時刻，立即轉換成大膽的改革。不要錯失改革之窗開啟的機會，改革行動必須一氣呵成。


    平時對改革隻字不提的人，突然說：「現在正是大好機會！」也無法立即召集到支持者。光說明自己的想法、獲得他人認同，就很花時間，等到支持改革的勢力逐漸形成時，改革之窗已經關上。正因如此，在平時必須頻繁的向周遭人說明想法，增加享有相同價值觀與改革方向的夥伴是非常重要的。


    ### 增加享有相同價值觀跟改革方向的夥伴是非常重要的


    ### 腳踏實地等待時機成熟


    J R東海的名譽會長葛西敬之，是推動日本國鐵分割民營化三人組的其中一人，也是主管改革成功的知名例子。當時的日本國鐵，從經營高層到工會團體，全體一致反對民營化。而葛西從地方服務時期起，就腳踏實地持續宣傳著改革的理念，擬定改革計畫。他重返總公司之後，便立即著手改革，成功實現了國鐵民營化。


    葛西會長在擔任課長的時代，就組織了非正式的讀書會，集結七、八位年輕員工，一同規畫公司未來的改革計畫。他把第二次臨時行政調查會（日本總理的諮詢機構）的關鍵人物，也就是提出國鐵、日本電信電話公社及日本專賣公社，三大公營事業業營化建議的瀨島龍三（編按：日本企業家，伊藤忠商事會長，在財界擁有極大影響力）拉進來，換掉當時的國鐵總裁，中間過程完全按照葛西的劇本進行，使民營化成功改革。


    一般人在酒酣耳熱之際，可能說說主管的壞話，批判一下體制就結束了。但平時就習慣深度思考的人，能夠冷靜觀察自己所處的狀況，思考該採取何種行動，並從局部最佳化跟整體最佳化之間，洞察出應該前進的方向。


    ### 讓革命不流血就成功的主管


    如果想讓原本採取生產商品銷售給客戶、「賣完就結束」的商業模式製造商，成功轉換為付費服務的商業模式，例如運用網絡技術，讓商品賣出去之後不會就此結束，利用售後服務賺大錢的話，就必須改變公司本身的結構。改革劇烈的程度，視情況甚至必須做好放棄生產的準備，因此無法說變就變。然而，那樣的世界觀，特別是對十年之後就不在公司的經營高層而言，根本無法想像。正因為如此，覺得繼續採用過去的作法，十到二十年後公司恐怕就會消失，對未來感到擔憂的主管，才必須盡早下工夫准備改革。


    核心人物會一邊悄悄進行討論，一邊慢慢增加革命的夥伴。在組織的各個角落，都潛伏著改革派的主管，靜靜等待改革之窗開啓的瞬間，這正是所謂「羅馬不是一天造成的」。十年、二十年之後也還會在公司的的主管，扮演改革的核心角色，腳踏實地推動著改革，所以才有辦法抓住改革之窗偶然開啓的瞬間，徹底改變組織。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_137_0.png)


    如果經營者不理解主管對什麼感到危機的話，主管可以不時傳遞這樣的訊息：「這樣下去恐怕不樂觀。」「不是也有這個方向可以走嗎？」若不時把危機掛在嘴邊，便可漸漸醞釀出「我們公司不改革會完蛋」的氛圍。


    三年前提說公司有危機的時候，有可能會被當成傻瓜，但如果每年都持續跟大家說「公司這樣下去會完蛋」，不知不覺便會有其他人開始跟著說：「公司這樣下去會完蛋。」而且，如果可以做到，讓大家自己說出來是最好的。因為讓人誤以為是自己的想法，更能促使大家主動採取行動。這正是影響他人的暗黑技術。


    即便過去從來沒有人真的跳出來主張改革，當改革的聲音達到某個臨界點時，經營管理階層的人就會開始說：「公司應該要改革。」「這個策略應該要改成這樣。」就像是承受不了重量的翘翘板，最後倒向重的那一邊一樣，風向會徹底改變。風向改變的空間，讓人看了真是痛快。而在改變的瞬間到來之前，必須辛勤持續宣傳改革。


    有間公司正是因為平日累積的小改革，成就了大改革。那間公司是典型又老又大的製造商，業績佳、市場競爭力也沒什麼問題，但很遺憾的，組織內的制度運作發生了問題。


    這樣的窘境，一位主管實在看不下去，寫了一份組織改革的草案，運用自己的網絡關係，讓計畫慢慢成形。但是，在這一階段稱不上是正式的改革計畫，只是網絡關係之間私下進行的祕密計畫。


    然後，一直以來業績表現亮眼的事業，因競爭對手跨入市場，使得原有的競爭環境發生了劇烈的變動，突然之間，大規模的結構改革迫在眉睫。也就是說，改革之窗偶然開啓了。覺得機不可失的那位主管即挺身而出，立刻把原本私下進行的計畫搬上檯面，按照計畫成功推動了改革，過程中幾乎沒有流血。現在這間公司又逐漸重回家界龍頭的寶座。


    我們無法得知改革之窗何時開啓，但無論哪間公司一定都有開啓的時刻。只不過，開啓就只有那麼一瞬間，一旦錯失機會，公司又會恢復原型，變回那個維護現狀、慣性強烈的巨型戰艦。正因爲如此，堅持改革的宣傳，等待時機來臨是非常重要的。


    ### 資訊不會自動上門，你得主動汲取


    主管不但有辦法直接跟經營者聯繫，也可以直接跟現場的人溝通。無論對上還是對下，都能依據第一手資料進行對話。用圖來表示的話，可以畫成如左頁圖十四的關係圖，經營者跟部屬為兩個倒三角形，而連接兩者的接點為中階主管。


    但人都喜歡觀察比自己地位高的人。各位在跟同事吃飯喝酒時，是不是也都用主管的壞話當下酒菜呢？其實當你仔細觀察老闆時，你的部屬也正仔細觀察著你。然而，上面的人會以同樣的角度觀察下面的事情嗎？實則不然。老闆只有一個人，而下面卻有好幾位部屬，無法避免資訊不對稱的發生。


    所以，如何利用老闆跟主管之間的資訊不對稱非常重要。雖然主管能夠依據第一手資料跟老闆、部屬對話，但實際上，即便主管有辦法跟現場直接溝通，也未必能夠掌握一切。因為有的情況是，自己以爲已經拿到現場的第一手資料，但其實真正獲得的資訊微不足道。就跟身為主管的你一樣，跟上層報告時會挑選內容，而部屬在跟你報告時，也會有意、無意的過濾資訊。主管跟部屬之間，也存在著資訊的不對稱。那麼，該怎麼做才有辦法汲取到那些看不到的資訊呢？


    重點在於，資訊不會自己找上門來，因此必須主動汲取。站在部屬的立場，主管沒問的事情當然不會主動報告，對自己不利會隱瞞，對部屬的資訊主管如果會想回報，結果就是什麼事都不做，部屬也不願回報。


    因此，謀報活動不能只是對上、對下也必須進行情境作業。


    雖然有不少人跟組織是採取鼓勵員工主動反映困擾或問題的開放政策，但我很少聽到這樣的策略奏效。坐在那邊等部屬來報告的方法，即使真的有人來反映了，恐怕只能聽到表面話。如果主管不積極汲取資訊，是無法獲得真正想要的情報的。


    ### 問正確的問題，不說正確的答案


    該怎麼做才能從部屬口中挖出資訊呢？


    關鍵在必須傾聽部屬的聲音。重複前面所說，跟年輕人對話時，主管很容易因為自己經驗豐富，加上工作忙碌，就急著說出答案，想趕快結束對話。這時，應該要沉住氣，問對方：「你覺得有哪些做法呢？」刻意讓部屬思考，可以問出意想不到的資訊。打破砂鍋問到底，反覆詢問對方問題是交涉技巧之一。重點在於問正確的問題，而不是說出正確的答案。持續問對的問題，久了之後，過去從來不知道的資訊就會紛紛跑出來。那才是現場人員內心真正的聲音。


    這邊稍微偏題一下，當你跟態度強硬的人持相反意見，而且對方的內容明顯有誤時，若直接否定對方的話，會讓事情一發不可收拾。因此，有技巧的提出疑問，在侃侃而談的同時，對方會自己顯露出破綻，這是交涉時經常使用的技巧。讓對方說話，便能從中找出破綻。只要在那個時候，指出矛盾的地方：「咦，你刚才不是这样说的吗？」對方就會察覺到自己有點硬拗。同樣的道理，問對的問題，讓部屬表達意見是非常重要的情蒐技巧。


    ### 利用部屬的負面回饋增強實力


    如果平時的工作環境能讓員工自由說出自己的發言，就容易從部屬那獲得資訊。


    想打造多元意見相互交流，而非拍馬屁的職場文化，關鍵就在於主管能否當個稱職的傾聽者，利用溝通引導出部屬內心的聲音。


    例如，和部屬一對一面談時，你有辦法輕鬆愉快的獲得回饋嗎？這并不是三百六十度回饋（360-degree feedback）的績效評鑑制度。「經理，我覺得這個地方應該要多注意。」如果雙方可以建立信賴關係，讓部屬能提出真心想建議的話，沒有什麼比這還要有效。


    而如同暗黑技術五也有出現的「周哈里窗」，想要了解「自己不知道，但他人知道的自己」的話，就必須獲得他人的回饋，其中負面回饋更是不可或缺。


    跟自己的長處相關的正面回饋，也就是阿諛奉承參半的讚賞容易取得，但是，想讓別人指出連自己也察覺不到的缺點，難度卻非常高。主管斥責部屬，算是某種負面回饋，但是當自己升到一定的職位之後，大多再也無法獲得他人的指正。想要從部屬口中獲得回饋，就只能有耐心的反覆詢問。


    而部屬當然也無法馬上在本人面前評價主管。如果評價被當成是說壞話的話，可能會損害自己的利益；因此，大家剛開始應該都在拍馬屁。推開那些阿諛奉承的評價，問題一個接一個問下去，最後就會慢慢出現真心話了。如果讓部屬說出：「其實我對經理的地方感到很困擾。」你就成功了。如果，能利用少有的面談機會，問出部屬的真心話，作為自己改善的重要依據，也可以讓對方深刻體會「原來可以跟這個人說實話」。日積月累下來，便能醞釀出自由發表意見的職場文化。


