  md: '

    成爲習以爲常的存在就好。例如，希望全體員工看到人要打招呼，就要求大家力行實踐。只要持續做個五年、十年，打招呼自然而然就會變得理所當然，成爲公司的文化。一旦建立起那樣的公司文化，只要下達一次命令，每間店都會執行，過去兩、三成不願配合的店長便會逐漸消失。


    ## 靈感來自努力模仿，超越模仿


    松井：在自家公司你無法找到改革的靈感，靈感大多來自於其他公司。所以需參考其他公司的經驗，運用到自家公司身上，修改成合身的制度。如果企業沒有足夠的創造力跟強健的體質，是無法模仿其他公司的。過去的松下電器（現有的Panasonic）就是擅長模仿的公司，也因此被嘲諷是「模仿產業」，但這是不懂模仿背後需要多大創造力跟執行力的人，才會說出那種話。松下電器當然知道這個道理，所以才努力模仿，然後超越模仿的對象。若非有能力、傑出的企業，根本模仿不來。


    末村：即便是其他公司的東西，只要是有用的就全部學起來。


    松井：但其實跟其他公司學習並不容易。像我從思夢樂公司身上，學到標準作業手冊必須定期更新。同樣是去思夢樂取經，但最後真的付諸實行的，只有無印良品跟超市伊藤洋華堂而已。也就是說，學習到不斷更新標準作業手冊的，只有這兩間公司。西友也覺得思夢樂是很厲害的公司，租了五台巴士把所有店長載去參訪；參觀了物流中心、到總公司聽簡報說明，還實際參觀了店鋪。我是當時教育訓練的負責人，所以也陪同參訪，問參加的人：「覺得怎麼樣？」也只得到：「很厲害！學到了很多。」然後就結束了。公司沒有任何改變，這就是現實。


    我們到思夢樂參觀之後，也覺得他們很厲害。覺得那樣的制度，無論如何都要想辦法應用在公司身上，所以就請藤原先生擔任公司的外部董事。當對方公司的人成為自家公司的一員之後，董事之間便能自然的開始交流。然後物流就跟物流，董事、經理跟課長等級的主管彼此也不時聚餐，有了交流的機會。


    如此一來，物流的課長想知道思夢樂是如何管理庫存的時候，就能打電話直接問。視情況，還可以直接參觀倉庫。思夢樂的倉庫跟我們截然不同，只存放一點點貨，所以實際陳列了非常多商品。參觀了思夢樂的倉庫之後，就會開始思考為什麼只有這麼點面積的倉庫跟庫存，卻有辦法讓物流運作順暢呢？


    另一方面，我們從中也看到了商品陳列的方式，便大致掌握了思夢樂的物流管理機制。運用學習到的東西，思考如何改善無印良品物流的作業流程，便可以找到應該改善的地方以及方法。也就是說，如果第一線的實務工作者，彼些的關係沒有緊密到可以打電話聯絡交流的話，就無法真正學習到其他公司的智慧。


    ## 阻礙資訊流動的五合目員工跟黏土層


    木村：回到前面的話題，因為經營者無法獲得現場的第一手資訊，所以主管要從整體最優化的角度，向上頭的人打暗號，並透過不同的暗號好好利用經營者。松井先生則是建立「稽查室」的回報機制，以蒐集第一線的資訊。


    松井：如果無法透過業務蒐集第一線資訊的話，就由稽查室來蒐集。但是該如何汲取時人員的意見呢？這就是 MURI/GAMAN 標準作業手冊與時俱進的時候了。而十七萬件的客戶聲音，也是由店鋪全部建檔，然後寄送到員工的電子郵件信箱。顧客室於週一受理所有案件，急件會在週二早上的全體董事會議上進行討論。商品是否暫停生產、銷售，商品是否寄送等判斷，全都在週二早上的全體董事會議處理完畢，下午便聯絡公司內部，回應客戶的要求。這便是二十四小時內回覆的客訴處理機制。


    木村：也就是說，因為主管都是提供篩選過的資訊，所以您建立了一套機制，讓第一線的現場資訊可以直接傳遞到經營者耳中。


    松井：經營學家野中郁次郎致力提倡「由中間向上下管理」的概念。例如，在日產汽車執行長高恩的組織改革當中，以主管為核心的跨部門團隊，便扮演了重要的角色。但也有一「五谷目錄」這個詞彙。谷目是登山時的海拔高度指標，到達富士山的五谷，剛好是雲聚集之處。在雲底下的人，聽到青蛙開始鳴叫時，便知道快要下雨了。而位於雲上的人，只要看上方出現雨雲，就知道不久後就會下雨。也就是說，第一線跟高層清楚狀況，但是在雲當中的中間主管卻不清楚。而這些搞不清楚狀況的人卻必須下指示，這時就可以看出資訊掌握程度的落差。


    J R 則用「黏土層」一詞來形容課長、主任等中階主管。上頭的指示就像是雨水一樣，由上往下滲透。然而，土壤當中有黏土層，雨水遇到黏土層便無法往下滲透。也就是說，這個中間層不會往下傳遞資訊。在組織當中必定會發生這種現象。所以想要改變，就必須有所作爲。


    例如，每個星期一的上半舉行業務會議，這是公司最重要的會議。在這個會議上的決議事項，會在下午於部門會議上，由經理向部屬仔細說明。然後經理再依據決議加上自己的想法之後，思考當週的行動計畫。然而，在說明業務會議決議事項的階段，只有不到一半的內容有正確傳達出去，因爲經理只會傳達自己有興趣的內容。


    如果經理在部門會議上未正確傳遞資訊的話，會讓人非常困擾。因此，公司建立了一個名為「DI NA」的系統，讓總公司的全體員工，在業務會議結束之後，登入系統便可直接看到會議的決議內容。DI
    NA 是取 Dead Line（完成期限）、Instruction（指示）、Notice（聯絡）、Agenda（會議紀錄）的第一個英文字母縮寫。系統的畫面可以一次瀏覽所有內容，已經閱覽的人便會顯示○，部屬全部都看過之後，部門就會顯示○。打×表示部門當中有人沒閱覽內容，部門經理透過系統便能確認是誰還沒看，直接指示那個人盡快閱讀。建立起該系統之後，經理就不需要特地花時間說明業務會議的決議事項。會議結束後三十分鐘左右，就能上系統看會議內容，使得上下溝通的距離變得就近，五合目員工跟黏土層阻礙資訊流動的問題便逐漸減少。


    ## 決定好完成期限後，剩下的就交給底下的人全權處理


    松井：決定任務要在什麼時候完成很重要，訂定好完成期限的案件，就要嚴格遵守交期。如果沒在期限內完成的話，就是在總公司五百五十人全體員上面前打破承諾，所以一定要嚴格遵守交期。任務完成之後就標示「完成」。這麼做能培育員工勇於承擔風險，負責任完成任務的工作態度。


    我認為「報告、聯絡、商議」的做法是不行的，仔細教導、確認進度做出指示的方式，無法培育部屬，而且根本沒有經理有辦法針對細節下指示。所以訂定好完成期限之後，我就不干涉案件，怎麼做讓底下的人自由發揮。相對的，只要決定好在什麼時候之前完成的話，就一定要在那之前做完。


    如果不那樣建立起一套機制的話，溝通到中途就會停下來。上頭的指示到不了下頭，而底下的聲音傳不到上面。雖然大家都期待主管能夠扮演打破部門隔閡的角色，但就像剛才所說，有時在公司中間的人，也會帶來許多負面影響。如果不去除這些障礙的話，公司的指示便無法抵達位於末端的計時人員。例如，文具產品的負責人下指示，請各店人員回收瑕疵品，即便店長不在，工讀生也可以獨立完成作業。如果有標準化作業流程，任何人都能順利完成工作。如果就連清楚指示計時人員工作，也必須依靠經理能力的組織，是無法在市場競爭中存活下來的。


    **木村**：透過標準化的溝通流程，也能活絡溝通點上方的人。而另一方面，時間一久，組織怎樣也無法避免同質化。關於該如何破除同質化的組織，我在書中提到要成爲自如的人。松井先生是向其他公司取經，然後建立標準化的作業方式來處理這類問題的吗？


    **松井**：當初想改變組織而制定的制度，只要放任不管，最後會淒爲守勢，順著組織運作是企業大頭症的现象。每次都依靠個人的努力是有極限的，因此必須建立制度，一開始就要避免組織的同質化。MUGRAM
    手冊之所以會誕生，正是因爲工作內容會隨著第一線員工的智慧跟巧思不斷變化而來。一本標準作業手冊，在誕生的那一刻便開始走向滅亡，想灌輸活力，持續更新手冊的內容就變得非常重要。如果沒有那樣的機制，組織必然會實質化，逐漸走向滅亡的道路。想避免衰敗，就必須制定出預防的機制。


    沒有制度，經營者只好衝鋒陷陣，但衝鋒陷陣也有極限。而且，有辦法徹底改革組織的領袖本來就不多。如果經營者三人當中，出現一位有改革能力的領導者，算很不錯了。如果三人當中，有兩位是改善型領導者也行。但如果三人當中，沒有任何人是改革型領袖的話，那就辛若了。如果一人領導公司六年的話，三人合計起來就十八年。隨著時間的流逝，時代跟環境也會跟著變化，而經營者總有一天必須推翻自己一手建立的商業模式。那個時候，改革型領導者必須擔任推翻既有商業模式的破壞者角色，如果組織當中孕育不出這種領袖的話，毫無疑問的只能等待滅亡。


    另外一點則是，需要豐田汽車的氣勢。在豐田汽車工廠，當生產過程發生異常時，安全燈系統會發出警示，停止生產線。雖然這是個別確認前端工程跟後端工程的狀況，但是大家卻會討論：「現在這個做法符合整體最佳化嗎？」就連生產的第一線也是以整體最佳化為核心來討論事情，這間公司真的非常厲害。這就是公司的「風氣」。


    組織只要放任不管就會同質化，想改變患有大頭症的公司，就像剛才所說的，需要標準化的作業流程、良好的公司風氣，跟優秀的改革型領導者。只要有這三個改革泉源，大部分的公司都能夠持續在商場上存活下去。


    ## 不要交棒給跟自己同類型的人


    木村：一間公司是否會出現改革型的領導者，是不是相當碰運氣呢？想讓三人當中就出一位優秀的領袖，需要什麼條件呢？


    松井：需要很多條件，但我認為最重要的就是，不要交棒給跟自己相似的人。交棒給跟自己同類型的人，對方會聽你的話，也不會背叛你，可以安心把部屬交給他，但遇到的人有非常高的人，能力只有你的七成。


    而只有自己七成能力的領導者，又會交棒給跟自己相似，但能力只有自己七成的人。百分之七十乘上百分之七十，就是百分之四十九，也就是說，後繼領導者的能力不到第一代的一半，可以想見公司恐怕搖搖欲墜。如果選擇交棒跟自己截然不同，人，將有可能會被追過去。但選擇承擔這樣的風險，比較能讓組織健全的運作。公司在交棒的時候，如果無法將九成的權力集中在經營者身上，讓組織動起來的話，便無法順利營運。只是，在交棒時經常會找錯對象，因此必須要有淘汰不適任經營者的機制。所以，魚與熊掌不可得兼，交棒很難。


    木村：這是治理公司會碰到的難題。不要交棒給跟自己同類型的人，也就是避免聚集如金太郎糖果般，切開來通通長一樣的人，如果身邊都是「沒問題先生」的話，應該不太好吧。


    松井：白目的人越多越好。因為組織必然會逐漸同質化，若沒有出現可以打破現狀的人，對組織而言並不是什麼好事。


    木村：松井先生在剛上任社長的時候，是否有意識到要組織經營團隊呢？


    松井：有啊。想要徹底改變過去的做法，就必須換掉奉行過去價值觀的主流派成員。所以我集結了生活雜貨的負責人、管理負責人、西友子公司的前社長、三菱商社纖維部前經理等人，組成經營改革團隊，大力推動改革。在過去的經營基礎基礎上，無法做到真正的改革，想改變組織的價值觀跟行動的話，就必須建立新的經營團隊，這是改革的必要條件。


    木村：日立的川村隆在上任執行長時，也跟您有同樣的想法，建立了新的經營團隊。


    松井：川村先生他從日立的子公司麥克賽爾重回總公司後，帶領日立集團浴火重生。有辦法重新回到總公司的人非常不容易，他回到日立之後，委託副社長招集子公司的幹部，建立經營團隊。他將二十三位實務跟實務，從決策團隊中剔除，改由五位副社長加上川村，共六人的精銳決策小組，針對公司經營做出判斷。因爲原本的團隊都是從事業部門上來的，如果不予剔除的話，每個人都會變成部門利益的代言人，再怎麼討論事業部門的利益，也無法改革組織。


    雖然副社長也是從事業部升任上來的，但他不是主流派，因爲原本爲非主流派，所以有相當長的時間懷才不遇。懷才不遇的經驗可以培育出人才。所以，那六個人知道，當時的日立需要什麼。跨越局部最佳化的障礙，以整體最佳化的經營團隊為核心，並大刀闊斧改革。


    ## 非主流派活躍的時代


    本村：剛才我們也談到了人生態度，也就是說，只要擁有價值觀，知道自己想要達成什麼目標的話，即便被主流排擠、不走過去所謂的菁英路線，也不再暗自愁傷。


    松井：走在非主流的路線，並無走偏敗壞的人，他們通常有一套自己的人生哲學。因為一般來說，只要偏離主流路線，上班族的職業生涯大概就完蛋了。如此一來，不在主流路線的人，很容易走偏了路而敗壞。但是沒有敗壞的人，反而因為從主流退離了一步，更彰顯出個人的本質。同時，那樣的人也非常清楚自家公司哪邊有問題。雖然川村當時可能沒料想到自己會回到總公司，但是走在非主流路線的經驗，應該爲他帶來了相當大的幫助。


    木村：我認爲在改革組織之際，領導者不可以想要討好所有人，必須果斷做出決策。擁有被討厭、正色敢言的勇氣相當重要。


    松井：從結果來看，被大家討厭也好，又或者一開始就以被大家討厭爲目標也罷，我認爲領導者被討厭是無可奈何的。爲什麼呢？因爲當你採取跟以往價值觀完全相反的行動時，大家一開始都會反抗。所以必須抑好反抗改革的力量。那個時候，有由上往下面接鎮壓反抗的方式；也有帶領團隊，使改革順利進行的方法；也有像政治家一樣，刻意樹立敵人，讓大家團結一致的做法。我認爲應該要依據不同的時間點跟領導者的個性，選擇最合適的方法才是最好的。


    經營者也有自己的個性，而領導者的個性會影響團隊的走向。在一九六四年的東京奧運，帶領女子排球隊奪得冠軍，風靡全日本的大松博文總教練，一句「跟隨我就對了！」就能帶著團隊往前走，但是那樣的時代已經結束了。現在需要的是能夠集結各種不同價值觀的人，帶領團隊往正確方向前進的領袖人才。


    木村：也就是說，利用職位權力管理組織的方式，已逐漸不可行。


    松井：沒錯。未來的領導者是行動獲得大家認可的人；以身作則的人；即便沒有高度的領袖魅力，但是平時的言行舉止恰當，貫徹自身信念的人。他們是四處可見的市井小民，但卻是有原則，且具備統合團隊能力的人。那種人對團隊非常重要，而且很有個性。所以，有多少不同個性的領導者，就有多少不同的經營型態。像過去的一夫之勇、野心十足的領導者，能否帶領好團隊呢？答案是絕對沒辦法，因爲那種時代已經過去了。


    木村：我認為，依據自己的信念，參與公司經營時，總有一天會遇到考驗信念，是否踐踏聖像的抉擇。松井先生應該也是直到最後，都堅持著自己的信念吧。


    松井：是啊，我幾乎不太違背自己的信念。但是我聽取了很多人的意見。不聽別人意見的話，便無法溝通。但卻經常被說：「松井先生雖然很努力傾聽，但最後做出的判斷卻總是跟大家的意見不同。」該怎麼辦，我其實內心已經做好決定。公司內部通常不會有反對的意見，但是外部重


    ## 經營者的人格決定了公司的高度


    事會有。我聽取了各種意見之後，最後還是按照自己的意思做出決斷。即便是這樣，有無聽取意見還是差很多。


    世界上有許多讓我望塵莫及的優秀企業經營者，所以我在二〇〇二年引進了外部董事制度，與其說是改善公司的治理，不如說是為公司帶來導師。


    本村：也就是說，身邊是否有願意正色直言的人非常重要。


    松井：我在委託別人擔任外部董事時，一定會找有擔任過高層的人。社長跟副社長之間所累積的經驗落差很大。另外，就是找讓人敬畏的企業經營者。畢竟聘請外部董事，不是為了聽舒服悅耳的話。如果董事會都是公司內部成員組成的話，即便是由社長擔任主席，也不會出現任何意見。然而，一旦董事會有外部董事參加，氣氛就會變得緊張，而這也是我的目的。


    松井：經營者的品格決定了公司的高度，公司的水準不會高過經營者的人格。


    木村：換句話說，也就是不要倚賴權威，而是培養全方位的領導能力，對提高公司的競爭力而言越來越重要。


    松井：對現在的企業經營者而言，最需要的是吸取大家的意見、帶領團隊的能力。打造大家可以順著自己的個性、自由發表意見的職場環境，整合這個充滿多樣化的團隊，是讓組織能夠有效運作必須具備的能力。


    木村：但那並不是單純協調意見的協調型領袖，而是最後做好心理準備，敢於承擔責任，自己做出決定的領導者。


    松井：協調型領袖無法帶領團隊度過難關。凡事按照大家的意見走，是最糟糕、容易失敗的經營模式。必須做決策的人，應該要有九成的權限，如果不這樣的話，公司會營運不順。最不好的做法就是採取多數決，絕對不可以用多數決來決定經營策略。至少不可以由大家討論、共同決定經營方針，因爲這是經營者必須自己決定的事情。


    木村：雖然聽取大家的意見很重要，但最後做決定的是經營者的工作。這正是所謂的暗黑技術呢。


    ## 後記 給下代的領導者


    閱讀本書的 I G P I 同事跟部屬，應該心想：「你哪有資格來談這些！」不由得笑出來了吧。說起來有點丟人，但其實我還在成爲領導者的旅程上，日夜搏鬥著。另一方面，我也覺得這個旅程無法抵達終點，這條路恐怕永無止境。就這個意義來說，將本書奉爲最高圭臬的人可能是我自己。


    「貢獻產業界，爲下一個世代創造更好的未來」，是我的宏願。因此，我的志業是提升這世代的企業競爭力，以及培育下一世代的領導者。


    我看過許多企業的第一線，他們的技術競爭力強，並擁有实行精密作業的組織能力，企業底蘊相當厚實。尤其是歷史悠久企業的公司文化跟價值觀，有許多值得一提的地方。


    如何將企業擁有的能力跟文化導向正確的方向，我認爲這將會成爲企業競爭力的泉源。也因此，主管能否發揮功能，是當今「又大又大的公司」面臨的迫切課題。


    我相信，只要有許多中階主管，能夠不看他人臉色，接納多樣化，即便是小問題也不逃避正面回應的話，未來一定更加光明。爲此，今後我將盡我所能，與更多企業攜手、共同實踐。


    最後，感謝打從心底尊敬的導師松井忠三，在撰寫本書之際，百忙之中仍爽快答應我提出的對談請求。這邊想向每天討論就像是真槍實彈決勝負，總是提供我非常多刺激與建議的IGP代表富山和彥、村岡隆史等夥伴致上謝意。此外，感謝我最愛的家人，謝謝你們爲了讓我專心撰寫本書，爲我空出好幾個週末的時間。最後，感謝本書的責任編輯日本經濟新聞出版社的赤木裕介，以及發行企畫田中幸宏。在此感謝所有協助過我的各位。


