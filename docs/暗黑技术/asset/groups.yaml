    # 越中庸的事業越容易逃過改革


    雖說工作現場大多會反抗改革，但真的病人膏肓的部門，對問題其實已經豎起白旗、束手無策，因此並非無法動刀。然而，在盈利跟虧損之間來回擺盪的中庸部門，即便對自己罹患的生活習慣病有病識感，卻覺得離死亡還很遠、沒有危機感，因此反抗改革，甚至很可能根本就經營者的視線範圍之外。


    從旁觀者的角度來看，讓人深感同情的是，明明公司整體的業績低迷不振，但各個部門卻「請核可這個投資案」「雖然不符合規定，但是請破例通融」，只提出對自己部門最有利的提案。雖然經營者想要的是涵蓋整體的資訊，但由於各事業都交由現場各自處理，而最清楚市場與顧客的主管，若以理論來武裝自己，保護自家部門的話，對經營者而言，因為沒有其他判斷資訊，也只能相信主管所說的話。


    姑且不論業績明顯不佳的部門，如果從整體來看，對於帳面數字沒那麼引人注注意的部門，經營者也不會特地跳出來發表意見。結果就是，表現越中庸的地方，越容易逃過改革的大刀殘存下來。'
