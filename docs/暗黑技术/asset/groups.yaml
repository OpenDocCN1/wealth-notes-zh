    # 『要斬斷所有的欲望很難，但我們可以避欲望而遠之。』


    汗直流，看起來相當狼狽。看到那個場景，會讓人不禁懷疑：「跟著這個人真的沒問題嗎？」下一秒，謠言搞不好就會在公司鬧得滿城風雨。想贏得他人的信任需要很長的時間，但失去卻只要一瞬間。


    牛尾電機的創辦人牛尾治朗曾說，思想家安岡正篤「捨世俗凡欲，爲大志而活」，這句話對他的影響很大。世俗凡欲就是金錢或名聲等世俗的欲望，而大志則是世俗凡欲的另一極，指的是遠大志向或大願。要斬斷所有的欲望很難，但我們可以避欲望而遠之。真正的領導者應該要控制好自己，胸有壯志，帶領部屬前進。'
  - '[PAGE 177]


    # 訪談一


    成爲言行一致的領導者'
  - '[PAGE 178]


    領導者必須有不可動搖的信念。一下往左，一下往右，搖擺不定的主管，沒有人願意追隨。如果沒有自己的中心思想，無法讓周遭的人產生「既然這個人都這樣說了，就只好努力看看」的想法。


    那麼，什麼是貫徹始終的信念呢？該怎麼做才能建立起自己的信念呢？以下三個建議，提供各位在建立不可動搖的信念時參考。


    # 建構非數字目標的願景


    給領導者的第一個建議是，建構未來的願景。


    有別於每年的預算、中期計畫等具體數字的目標，如果可以就組織的核心價值，例如釐清希望打造怎樣的團隊、想達成什麼目標等問題的話，便可以找到率領團隊的原則。沒有原則的人，容易輸給誘惑，或是容易受到誘因的影響而被他人操縱。


    作為部門經理，希望自己的部門成為什麼樣子呢？或是站上更高一個層次，從整體最佳的角度來看，公司應該要是什麼樣子？希望各位藉由閱讀本書，花點時間仔細思'
  - '[PAGE 179]


    考一下自己想成爲什麼樣的人？理想的組織又是什麼樣子？


    # 言行不一致的人不值得信任


    給領導者的第二個建議是，以言行一致爲目標。


    想做到言行一致，積極和部屬溝通是不可或缺的條件。想法必須不時傳達給人道，因爲不再重複、強調重要性的話，是無法滲透人心的。


    而就在持續宣傳理念的某天，踐踏聖像的威脅會突然造訪。「經理嘴巴那樣說，但是真的嗎？」考驗信念的時刻必定到來。那個時候，如果違背了過去講得振振有詞的信念，腳踏聖像的話，過去的努力一夕之間便會化爲烏有。即使你沒有踐踏聖像，卻是假裝沒看到，或躲在看不到的地方，也會正中部屬下懷。


    不逃避踐踏聖像的考驗，光明磊落的主張自己的意見。言行一致的人，值得信任。反過來說，言行不一致的人不值得信任。'
  - '[PAGE 180]


    # 做好心理準備就沒什麼好怕的


    給領導者的第三個建議是，做好心理準備。面對瞬息萬變的市場局勢，雖然朝夕改在所難免，但是必須堅守核心價值。這不僅是保證成果，也是承諾核心價值不會輕易改變。


    事情如自己所願是最好，但現實情況經常事與願違，這時你有辦法堅守承諾嗎？這裡也可以將承諾換作是「保持清高」。


    如果能做好隨時遞出辭呈的心理準備，其實就沒有什麼好怕的了。事業部的成績不如自己預期，也不會因此喪失性命，或失去所有財產。當然有必須調查未能達成目標的原因，但如果原因是自己無法掌握的話，就必須維持清高，一直沉浸於懊悔的情緒裡，什麼也不會改變。做不到的事情就是做不到，勇於承認自己的極限，不回頭向前邁進才重要。


    辭掉工作之後，日子是否過得下去，視冷靜沉著的程度而截然不同。


    假如家計也有固定成本跟變動成本，則盡量壓低每個月固定成本。只要固定成'
  - '[PAGE 181]


    本低，辭職帶來的心理壓力就會降低。即便短時間內失去收入來源，必須動用到預備金，若預備金的金額足以支撐兩、三年的話，其實辭職也不會對生活造成太大的影響。


    然而，如果房貸跟孩子的教育費用負擔重，每個月的固定成本高的時候，失去現 在的收入便會帶來非常大的壓力。家計的固定成本一高，光是維持現狀就會非常辛苦，工作上當然容易偏向明哲保身，一旦面臨抉擇，便會選擇捨棄清高。


    人是脆弱的生物，受到誘因影響而做出錯誤決定的機率並非爲零。若金錢面高度 依賴公司，便難以排除金錢帶來的誘惑，必須注意。


    做不到的事情就是做不 到，勇於承認自己的極限， 不回頭向前邁進才重要。'
  - '[PAGE 182]


    # 退休後也很有用的暗黑技術


    哈佛大學有一項長達七十五年的知名調查研究「哈佛成人發展研究」，針對哈佛大學畢業的二百六十八名男性，以及成長於波士頓的四百五十六名一般男性，進行身心健康狀態的追蹤調查。


    調查對象有事業成功的有錢人、眾人皆知的名人、失敗的窮人、調查中死亡的人，什麼人都有，但是針對「對你而言什麼是幸福？」的問題，最多人回答：「良好的人際關係。」真正能讓人幸福的，不是賺大錢，也不是讓公司規模變大，而是建立良好的關係。相反的，即便社會地位再高，只要人際關係失敗，便無法感受到幸福。


    也有人一離開公司後，就不再有人搭理，孤單一人。六十五歲退休之後，一個人寂寞的度過二十年以上的餘生，這種人過去應該非常依賴頭銜所賦予的職位權力。所以，在失去公司名稱跟頭銜的瞬間，至今圍在身邊的人便會離去。過去之所以被捧得高高的，終究也只是因為握有權力罷了。


    此外，眼中只有賺錢的人，一旦失去財富，身邊的人也會跑光。錢斷緣盡，因錢'
  - '[PAGE 183]


    而結交的朋友，失去了連結彼此的钱之後，身旁值得信任的人也就所剩無幾。因為沒有人會打從心底尊敬，為賺錢毫不在乎捨棄周遭朋友的人。


    我認为，那種人可能沒有磨練好暗黑技術。


    利用領導者魅力影響他人的暗黑技術，必須跟對方建立起信頼關係才得以運作，光有頭銜說話是沒有分量的。雖說如此，雙方不能只是單純的好朋友關係，彼此之間必須伴隨著適度的緊張感。那種人際關係的構築，看重平時的言行舉止，必須透過日常的溝通對話，長時間醞釀信頼關係。


    大家聽到暗黑技術，可能會覺得是運用政治手腕操縱人心。但其實真正的暗黑技術，不僅要懂理與情，而且還必須依據不同對象，施以不同的對策。因此，如果對人性缺乏深刻的理解，是無法靈活運用暗黑技術的。而深刻的理解，則在於加強與對方的羈絆。


