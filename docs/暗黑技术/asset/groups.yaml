    我們到思夢樂參觀之後，也覺得他們很厲害。覺得那樣的制度，無論如何都要想辦法應用在公司身上，所以就請藤原先生擔任公司的外部董事。當對方公司的人成為自家公司的一員之後，董事之間便能自然的開始交流。然後物流就跟物流，董事、經理跟課長等級的主管彼此也不時聚餐，有了交流的機會。


