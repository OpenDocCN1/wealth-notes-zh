    # 你今天的行動跟損益表有關嗎？


    你在公司提出採購單，請老闆做最後裁決時，需要經過多少人蓋章核准呢？採購單上可能有課長、經理等用印的欄位，但大家應該經常遇到這樣的情況。在請經理蓋章之前，如果不先跟隔壁部門的課長說明、獲得同意的話，之後對方如果生氣抱怨：「我可沒聽說要這樣做！」就會變得很難協調。因此，有些人雖然不用請他蓋章，但仍必須口頭取得對方的同意，放進簽核流程當中，這些人就是所謂「口頭簽核」的傢伙。


    如果把口頭簽核也算進去的話，需要簽核的人數就會變得很多。例如，經營企畫部大部分的工作，很有可能變成都在做內部協調。


    請各位回想一下，你今年跟多少公司外部的人交換了名片？姑且不論不須對外交涉的部門，如果理當對外溝通、交涉的部門，但交換到的名片卻寥寥可數，那就是你為公司爭取附加價值的努力不足的證據。雖然協調、事前疏通、安排是組織運作的必要條件，但是把時間都花在無法定孕育價值的內部調整上，根本稱不上是在工作。


