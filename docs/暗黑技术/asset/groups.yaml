    ### 了解心中庸俗的欲望


    內心的核心價值，換個方式來說，也就是行為背後的動機。


    動機大致上可分爲，改變公司或社會這類的「對外動機」，以及成爲理想中的自己這類的「對內動機」。想真正的了解自我，就必須知道這兩種動機爲何。然而，人的行爲有時會受到其他因素影響，這些因素並非自己想要這麼做、想成爲那樣的人等的正向願望，而是流動在內心暗處的庸俗欲望。這裡將這種欲望稱爲「煩惱」，以便跟動機區分。


    例如：沉溺於男女情愛、愛慕虛榮、花錢沒節制、沉迷於賭博、想飛黃騰達等，大家都有庸俗的欲望。但那些「煩惱」，乍看之下對外似乎能夠掩人耳目，但是對自己而言，卻藏也藏不住，假裝沒看到也沒用，因爲它會一直跑出來。所以，必須先弄清楚了「煩惱」是什麼。在意識到「煩惱」之後，必須逆向思考，將之當作已知條件。也就是說，我們要思考的是，該怎麼做才不會讓欲望不受控制、怎樣才不會讓欲望朝向不好的方向發展，而不是煩惱該如何放下「煩惱」。例如，向值得信任的人說明自己的困境，然後請對方在你快走歪的時候及時糾正等，方法有很多。


    我的錢包裡有兩個護身符，一個是每年新年參拜時買的；另一個則是為避免「煩惱」不受控，提醒自己的紙條，上頭寫著要注意的三件事項。雖然我並沒有每天拿出來看，但很幸運的，護身符確實發揮了功效。


    必須管理部屬的主管，工作壓力很大，疲於應付每天的工作事物，導致最後容易鬆懈。也因爲自己對各種事物具有影響力，因此容易輸給誘惑。而且身分地位越高，越容易落入陷阱，如果不清楚自己的弱點在哪，就很容易重摔倒地。


    為避開那些陷阱，就必須經常確認：什麼是自已真正想做的事情、應該追求的目标。必須不時把心自問，那是在僅只一次的人生中，真正想做的事情嗎？還是說，只是想偷懶、享樂而已呢？人一旦疏於自省，很有可能一個不小心就摔跤，輸給誘惑。


    應該也有人怎樣也無法壓抑自己的「煩惱」吧？這樣的人不如選擇可以實現欲望的生活方式，不但能讓自己過得幸福快樂，也不會對周遭人造成困擾。只不過，站在帶領團隊的立場，必須擁有一定的自制力，控制好「煩惱」，帶領團隊向前，要有能駕馭弱點的堅強意志力。「我想要這樣做」「想成為這樣的人」「想以此作為志業」，這些都是讓自己往前邁進的動機。


    ### 暗黑技術幫你面對與控制欲望


    連自己的欲望都控制不好，卻希望他人按自己的意思行動的想法非常貪婪。爲社會、爲眾人，同時也是爲了自己，這種人應該放棄成爲領導者。


    喜歡搞辦公室政治的人，可能自組派系或是周旋於派系之間，政治遊戲玩得心應手。然而，許多只擅長看風向當牆頭草的人，一旦站在必須做決策的立場時，就會做不了決定。


    此外，如果讓千錯萬錯都是別人的錯的人當官，出了問題就怪部屬、怪環境不好，結果就是沒有人會出來負責。那種人恐怕也不適合必須承受壓力的位置。


    個性封閉，無法帶領他人的人，也不是當領導者的料。封閉在自己的世界，不願意與人建立信任關係的，從一開始就負責可以獨立完成的工作，對雙方最有益。


    總之，想出人頭地、權力欲望強的人，通常都獨善其身，遇到危急狀況時，比起爲組織、部屬犧牲自我，更有可能爲了保護自己而犧牲他人。而且，沒有原則的人，信念薄弱，容易受到誘惑。如此一來，很有可能會在某個地方失足。


    暗黑技術可以幫助自己面對並控制欲望。英語能力佳、數學好、擅長行銷等，都是累積工作上的經驗，經由學習獲取知識、藉實務經驗培養直覺而成的光明技術。光明技術當然重要，但黑暗面的強弱才是跟價值觀及欲望有關。因爲價值觀跟欲望源自於內心深處，不是那麼容易改變的東西。也因爲價值觀不容易改變，因此能作爲不可動搖的信念；而欲望也不是容易改變的東西，因此必須學會一套控制的方法。


    ### 用三十分鐘簡報你的人生


    盤點過去，具體而言該怎麼做呢？應該有人充滿疑惑吧。


    我過去在哈佛商學院留學的經驗是，班級分成八人一組，每個人用三十分鐘跟大家分享自己的人生。這不是請大家發表畢業自哪所大學、曾經在哪間公司服務等，如履歷般的內容，而是全體立下君子協定，履行保密義務後，說出自己最不堪、最醜的往事。總之就是毫無隱瞞的把一切攤給大家看。


    三十分鐘很長，若不揭露真正的自己，會剩下很多時間。有嘗試過的人就會知道，在這當中有不少人會講到哭出來。因為大家投入了豐富的情感，真切講述著自己的故事。在說的過程當中，你會逐漸釐清自己的想法：「啊，原來我是這樣的人。」


    作為領導者，如果沒弄清楚自己是怎麼樣的人、對什麼事情有所堅持、什麼是重要的，在重要時刻便無法做出正確的決定。如果一個人怎麼想也想不清楚的話，就試著向他人說明，有時候可以藉此找到答案。


    跟公司同事可能有點難以說出口，所以找參加研討會或讀書會時認識的外部人士比較好。如果有值得信賴的夥伴，願意傾聽自己的糗事，就以簡報的形式，用三十分鐘向他說說自己的人生也不錯。而我過去的留學經驗是，大家分組彼此講述自己的故事，雖然都是第一次見面，國籍也都不同，不是用母語表達，但彼此之間沒有利害關係，反而能敞開心扉說出內心真正的想法。那些經驗為現在的我打下了基礎。


    ## 黑掉的能力


    ### 在事業體不夠強韌時，你有踐踏聖像的勇氣嗎？


    踐踏聖像，是指自己的信念受到考驗的瞬間。


    如果領導者平時向部屬傳達「我是這樣的人」「我重視這個價值」的訊息，當遇到考驗信念的時刻，領導者的行為跟平時的言論一旦稍有偏差，部屬對主管的信任就會瞬間瓦解，大家的心會逐漸背離自己。


    就如同基督教傳教士，無論遭受受到怎樣殘酷的虐待，也不願踐踏聖像，貫徹自己的信仰一樣。在關鍵的時候能否持續堅持自己的價值觀，測試領導者決心的時刻，總有一天會到來。


    就我的經驗，面臨這樣的考驗多半是與客戶起爭執的時候。這種情況通常是，我方並沒有嚴重缺失，但客戶卻提出無理的要求。而且越是老客戶，越容易碰到這種挑戰。最簡單的解決方法就是，先向客戶道歉說對不起，即便對方的要求有點無理取鬧也全盤接受；總之先滿足對方，化解客戶的不滿。因此，即便交涉結果對我方稍有不利，或是發生額外成本，也能與客戶維持良好關係。


    當然，公司有經營上的考量，也必須酌量經濟效益。但另一方面，這樣的行為會使自己言行不一，而且也偏離了公司的方針。若順從自己及公司平時的行事原則，這時就必須跟客戶戰到底。視情況，有時候自己一個人可能解決不了，最後客戶放大絕怒吼：「叫老闆出來！」最壞的情況就是，之後可能會失去這位客戶。但如果就此退縮，便會違背自己的信念。因爲主管的行為，部屬都看在眼裡。


    即便踐踏聖像的威脅當前，能否不退縮、貫徹自己的理念，這也是主管能否持續贏得部屬信任的交界處。


    這邊將話題拉回到我二十八歲的時候。過去我經營的公司規模雖小，但擁有許多法人客戶，獲得許多合作的機會。然而，創業頭幾年公司經營不順，遲遲上不了軌道。


    因此，某種程度上只要有案子就接，即便我方沒有缺失，但對於不合理的客戶抱怨仍照單全收，非常努力維持關係。回想起來，那個時候的我，腦袋似乎都被每個月的資金周转給占據，為了錢，我踐踏了好幾次聖像。


    **「不逃避踐踏聖像威脅的重點在於，意志力要夠堅強，而且強健的事業體質也相當重要。」**


    我認為不逃避踐踏聖像威脅的重點在於，意志力要夠堅強，而且強健的事業體質也相當重要。即便公司規模不大，只要技術跟商業模式等擁有獨特之處，就不會輸給別人。另外，雞蛋不要放在同一個籃子裡，應該要與多間廠商合作。假若跟某間客戶交易量
    大，也要避免產生從屬關係。


    如果事業體質不夠強韌，便會面臨不得不踐踏聖像的風險。因為想在逆境中求生存，有時必須犧牲掉某些東西。


    ### 面對考驗時，部屬正在盯著你


    只要對方一開口抱怨，你是否馬上就道歉賠不是：「服務不周，非常抱歉。」以避免衝突，盡快息事寧人呢？還是說，禮數已經做得很足夠了，若在沒有過失的情況，就明確說出：「那是莫須有的指控。」堅守自己的信念呢？


    在一九八二年，嬌生公司旗下的止痛藥品牌泰倫諾，發生了遭人下毒的事件，膠囊被混入氰化物，造成多位消費者死亡。嬌生公司於獲取資訊的第一時間就馬上展開動作，花費大量的經費回收產品，並更換新的包裝方式，防止毒物混入的情況再度發生。即便責任不在自家公司，嬌生以「保障消費者生命安全」爲原則，快速應對處理問題的態度，獲得大衆的讚賞，將損失壓到最小。


    主張美墨邊界要興建高牆的美國總統川普，於就任後立即簽署了限制移民的行政命令，蘋果公司執行長庫克馬上挺身反對，明確表態：「我們不支持總統的移民政策。多樣化造就了我們強大的團隊。」聽到高層那樣說，不但使蘋果的員工感到安心，同時也讓人覺得「這個人值得信賴」，不是嗎？庫克在威脅面前一點也沒有動搖。


    但是，當踐踏聖像的威脅出現在面前時，並非只有踩或不踩兩種選項。實際上應該有許多情況是，沒有踩下去，但也没明確表示拒絕，態度曖昧不清而選擇逃避。


    若決定貫徹自己的理念，拒絕踐踏聖像的威脅是一種決斷的話，那麼即便違背了自己的信念，咬緊牙關也要用力踐踏聖像，在某種意義上也是相當大的決斷。然而，凡事迴避風險的人，則會假裝沒看到聖像。總是想著該如何粉飾太平，沒有擔當的人，是無法累積男子氣概的。這邊雖然用「男子氣概」這個詞彙，但堅守信念對女性領軍者而言也是同等重要。


    如果累積了相當分量的男子氣概的話，部屬自然會願意追隨你。考驗信念的時刻，大多出現於處理緊急狀況的時候，請切記，這時部屬正仔細觀察著你的行動。


    ### 捨棄「不輸」，擁抱「要贏」


    隨著在公司的職位越升越高，或是員工越來越多的規模越來越大時，無論對個人還是對公司而言，失敗成本都會增加。就跟公司規模變大，影響範圍就會變廣一樣。擁有部屬之後，影響力便會隨之增加，因此，彌補錯誤判斷所需要的成本也會越來越高。如此一來，爲避免失敗，主管判斷事情會盡量謹慎，迴避風險的傾向也越來越強烈。仿佛將這種傾向稱爲「不輸」（Play
    to not lose），並嚴正呼籲應該戒慎，是站立於「要贏」（Play to win）的概念。


    爲避免失敗的行動，以足球為例就是全員採取防守的狀態，雖然這樣的策略的確可以避免失分，但卻無法得分。領導者有時會面臨是否冒險進攻的抉擇，這時能否選擇挑戰，可以說是另一種形式的聖像考驗。

    '
  mdcn: '

    二) 的前會長坂根正弘，就是能夠靈活運用不同牌的高手，一旦決定了就絕不妥協。例如，當公司在導入 ERP 系統 (Enterprise Resources Planning)
    時，便將系統分成兩部分；一個是重視小松才能提供的附加價值，黑箱化過程，依據需求，客製化成自家規格；另一個則是重視成本，徹底實施標準化作業。現場人員不想改變以往的工作方式，所以會期望將系統客製化成自家規格，但對於沒競爭力的產品，坂根則堅守標準化來降低成本，一律將反對意見壓下去。


    此外，坂根決定只裁員一次，一次就把組織的膿包擠乾淨。除此之外，將重心放在產品的開發跟生產上的「頂點經營」策略，也使小松脫胎換骨，成爲真正放眼國際的世界級企業。


    領導者需要的就是那樣的魄力跟鐵腕。另外，總是在意外部評價是不行的，必須要有自己的核心價值。只要有核心價值，即便遇到反抗，也能夠以「那又如何」的態度克服困難。


    在意外部評價的人，雖然不與人爲敵，而與人爲善，但是在決勝負的關鍵時刻，無法做出英明的決斷。


    ## 暗黑技術五


    不要沉溺小欲，

    要胸懷大志


    ### 面對自己的弱點與恐懼


    本章的標題「不要沉溺小欲，要胸懷大志」，以佛教用語來說就是：「捨小欲，發大願。」


    在無法明辨是非、立場迥異的情況下做出的決策，其背後根據大多是不合邏輯的。因為當我們無法用邏輯思考出答案時，便會以自己的價值觀作為抉擇的依據。我們會以自己覺得重要、應該優先的事物為根據，決定要向右轉還是向左轉。這邊所指的價值觀，不僅是個人的，還有公司的價值觀。也就是說，我們會綜合自己的價值觀跟公司的理念，依此決定未來應該走哪一條路。


    因此，必須要「知己」。如果不知道自己的價值觀為何，就無法在資訊有限的條件下，做出不偏離軌道的決定。


    所謂知己，並不是知道自己英文很好、會計很強等光明技術，而是必須了解了自己內心深處的想法。


    對你而言，什麼是重要的？無論如何都要堅守的原則是什麼？面對何種狀況你會變得堅強？而在什麼情況下會感到恐懼？在這當中特別重要的是，正視自己軟弱面的勇氣。了解在什麼情況下你會變得脆弱，或是感到恐懼，進而對抗、控制住弱點和恐懼，這正是暗黑技術。


    想探索自己內心深處的想法，就必須回顧過往的人生；答案就在走過的路當中，因為人生態度反映了你的價值觀。


    賈伯斯在史丹佛大學的畢業典禮演講上說道：「把點連接起來。」也就是，乍看之下沒有關係的事情，之後回頭來看的時候，點跟點之間連接了起來。因為有過去，才有現在的自己。現在的人生態度，是你經歷過艱辛、痛苦的日子醞釀而成。回顧過去，可以摸清清楚自己是怎樣的人。


    **「人生態度反映了你的價值觀。」**


    ### 逆境正是顯露人生態度的時刻


    我在二十多歲時，自己創立了一間小公司，創業當時爲籌措資金傷透了腦筋。也曾經爲了籌備資金，奔波一整晚跟朋友借錢。同樣也在二十多歲的時候，我生了場大病，有段時間甚至必須長期臥床療養，有好一陣子只能躺在牀上，每天盯著醫院的天花板。


    一旦意識到死亡，人就會開始思考各種事情。回顧過去時，想到的都是艱辛日子的回憶，幾乎想不到什麼愉快的往事。但是，當自己被逼到走投無路，精神近乎崩潰時，是如何克服困難的呢？那些經驗，造就了現在的人生態度。


    福岡軟銀鷹隊前職棒選手小久保裕紀曾說：「逆境是展現人生態度的時刻。能展現出自己的，不是一帆風順的時候，而是身處逆境之際。在困頓的時刻，才會顯露出真實的自我。」


    最近，刻意讓員工挑戰困難的工作，指派艱鉅任務的人才培訓方式受到矚目；給予嚴格的考驗，讓員工挑戰、想辦法克服難題。那樣的訓練過程，能夠培育出堅強有韌性的領導者。過去艱辛的日子，應該也跟艱鉅任務一樣，可以帶來相似的效果。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_108_0.png)


    暗黑技術


    ### 定期盤點自己


    日本經濟同友會的理事長、三菱化學控股公司會長小林喜光，在一○○七年剛上任社長之際，便碰到三菱化學鹿島乙烯廠發生爆炸，引發大火的工業事故；隔年二○○八年則遇到全球性的金融海嘯。就在公司禍不單行時，他正顏厲色的說了以下這段話：「如果有強烈的念頭想達成某個目標、想改變公司的話，追求財富跟地位這類枝微末節的慾望，就不會趁虛而入。想改變公司的念頭越是鮮明強烈，你便會像發了狂似的朝目標勇往直前。」


    某種程度上，主管牽領著組織，背負著責任。自己的判斷不僅會影響到部門，甚至也可能會影響到公司全體。站在這樣的立場，應該要為什麼為基準下決策呢？若想找尋判斷基準，我建議各位應該要重新審視自己的過去。如果明確知道立基的價值觀跟信念的話，無論碰到什麼狀況，都可以不偏不倚的做出決斷。


    在剛畢業的求職過程中，大家應該都曾經好好面對過自己，知道強項跟弱點在哪。


    ### 不羞於分享自己的價值觀


    然而，進入社會之後，爲手頭的工作忙得不可開交，鮮少有人能有時間靜下心來、好好的面對自己。然而，學生時期的經驗，根本無法跟主管的時期相比，工作時所累積的經驗既廣且深。正因爲如此，在現在這個時間點重新審視自己是有意義的。


    有部屬的人，必須定期盤點自己。定期盤點自己，對有家庭的人而言也同樣適用，結婚生子的時候，可以跟太太討論：「要以什麼作爲我們家的家訓呢？」我跟太太提案的是，製作兩人的年譜。透過年譜，可以了解彼此是怎麼走過來的、什麼是自已最珍惜的事物，好好盤點父母對自己的教誨、兄弟姊妹的建議、無論如何都想守護的價值觀。


    被父母從小叮嚀到大，受囑咐絕對不可以做的事情，已成爲我們生活的一部分習慣；回首過去，便能逐漸了解自己堅持什麼、珍惜什麼樣的價值，那不是履歷表上的內容，而是根植於內心的核心價值。若能夠在四十歲、五十歲的時間點，定期重新審視自已，可以讓你不迷惘的向前邁進。


    如果弄清楚內心深處的核心價值，換句話說，也就是清楚知道自已的價值觀是什麼的話，就不要藏在心裡，應該勇敢的表達出來，並積極與團隊分享。覺得重要的事情，如果不講出來，是無法傳達給別人知道的。當你的價值觀獲得全體人員認可之後，才有辦法讓團隊按照自己的想法行動。


    這邊必須注意的是，不要將自己的價值觀強壓在他人身上，要做的只是分享而已。我並不是鼓吹大家打造高度同質性的團隊，因為就如同前面所提到，領導者必須接納不同的價值觀，讓組織擁有多樣化。


    但是，如果團隊領袖的價值觀，能夠確實與成員共享（並非強迫他人接受），在關鍵時刻，成員所做的判斷一定跟團隊的大方向一致。正因此而，雖然表達價值觀有點令人難為情，但刻意的宣傳是有必要的。某種程度上，或許有點接近布道傳教吧。


    IGP I 則是透過每年兩次的集训，將公司理念跟方針與員工共享。而共享的內容，並不是每天朝會時唸誦的社訓，而是公司重要的議題。集训時，會集結世界各地的員工，以公司未來的方向作為主題，進行討論。雖然討論未臻成熟，但藉由這樣的過程，可以共享公司的願景。


    雖然我們可能不善於討論這類一本正經的議題，但不要覺得害臊，做就對了。今年預算多少的資訊，當然有必要跟全體員工共享，但欲藉由討論加深大家理解的，並非這種短時間且表面的目標，而是從中期角度訂定的目標，例如：希望三年後公司如何成長、提供客戶什麼樣的價值等。


    **「雖然我們可能不善於討論這類一本正經的議題，但不要覺得害臊，做就對了。」**


    不要用標語或口號傳達自己想守護的價值，而要透過共同討論，釐清並磨合彼此的價值觀。對領導者而言，部屬就是自己的分身，因此，若想讓部屬按自己的意思行動，不要怕麻煩，應好好與對方激烈辯論一番。想讓數十位部屬追求相同的目標，便少不了這樣的過程。


    例如，大家一起思考當工作遇到困境時該怎麼辦、模擬情境，輪流表達想法。「A，如果是你會怎麼做？」「B，你呢？」在討論過程中也放進自己的想法：「碰到這種情況，○○○就很重要，這樣做是不是比較好呢？」如果能讓部屬了解你是怎樣的人，就無須一下指令，對方自然會如自己的手足般行動。


    **「不用說就懂」只是個人的幻想**


    在脫離日常、集訓時的會議討論，總是特別熱烈。作為領導者，必須定期舉辦集訓，掌握團隊。


    想與別人共享價值觀時，「周哈里窗」是相當好用的理論。周哈里窗將自我畫分爲「自己知道」跟「自己不知道」，以及「他人知道」跟「他人不知道」，繪製成如下頁圖十二的矩陣圖。自己知道且他人也知道的地方，只有左上角①的部分。想讓①拓展到③的話，就不得不將內心深處的價值觀化爲言語表達出來（如一一五頁圖十三）。領導者必須想办法擴大①的面積，減少③的範圍。


    不把自己的想法說出來，卻要求別人猜中自己的心思，這是強人所難。


    即便是夫妻，一起生活久了，不用說出來就知道彼此在想什麼，也只是單方面的幻想。大部分的事情，不用言語表達出來的話，是無法讓人理解的。


