    改善損益表，短期內提高利益，就會波及到資產負債表。想保有足夠的現金，卻會影響到損益表。所以在採取措施之前，必須弄清楚哪項措施是否符合自己的目的。


    例如，極力爭取顧客數量的生意（例如：企業通訊服務、辦公室用的多功能事務機等），若想提高未來的營收金額，就必須下工夫爭奪市場大餅，行銷推廣費用也會因此增加。單一年度損益表的數字自然就不好看，但那是為將來的獲利鋪路。另一方面，如果是重視當年度獲利的話，則必須多少對業務擴大踩剎車。雖然如剛才所說，三張財務報表彼此相互影響，依據事業跟公司所處的狀況，優先順序也會有所差異。因此，重點在於必須清楚了解，現在自家公司需要立即改善的地方是什麼？應該實行何種措施？


    ## 影響他人的能力② ―― 軟硬兼施


    操縱他人的第二個能力就是領導者魅力。


    想讓部屬按自己的意思行動時，必須重視的是領導者魅力，而非職務權力。能夠讓對方懷抱敬畏之心的領導者，才是真正的領袖。


    ### 1. 想讓部屬按自己的意思行動時，必須重視的是領導者魅力，而非職務權力


    假如想要增加自己的領導魅力，就必須注意不要太接近對方。如果沒有拿捏好距離，太近就變成單純的好朋友。展現自己美好的一面給別人看，是人類的天性，對部屬也是一樣，主管會想博取他人的歡心。一旦變成那樣，就無法在重要時刻板起面孔斥責部屬。


    總是一臉溫和是不行的，如果不偶爾拿出威嚴，便無法帶領、指導部屬。手中必須要有隨時都可以使用的嚴肅面孔王牌。一旦跟對方的關係過於要好，就會失去嚴肅面孔的王牌。


    假設你跟部屬兩個人一起去喝酒，跟店裡的人說了一堆玩笑話。當部屬樂昏頭，跟你說：「跟經理喝酒真有趣耶，下次再一起去吧！」那瞬間嚴肅面孔的牌便消失了。因為之後即便在重要時刻，以嚴厲的口氣斥責部屬，對方也只會覺得：「幹嘛這麼突然？」也就是說，你被看扁了。


    ### 願意培育部屬的主管才令人安心


    如此一來，讓部屬乖乖聽話的王牌，便只剩下職位權力。對方可能礙於主觀的命令，表面上裝作很順從，但其實內心搞不好正在對你吐舌頭。


    本書前面介紹的暗黑技術，基本上都跟培養領導者魅力有關，而以軟硬兼施的方式影響他人，正是管理的奧妙之處。想讓嚴肅面孔的王牌隨時都能發揮功效的話，就必須維持恰到好處的緊張關係。


    懂得帶人的領導者必須培育、照顧部屬，而不是整天虎視眈眈、緊盯著上頭的位置。


    部屬覺得「這個人滿腦筋只想著如何升官」，還是覺得「這個人很願意栽培部屬」，兩者的安全感差異甚大。如果自己的主管整天只想著如何升官的話，就會讓部屬認為「這個人只顧自己的利益」，搞不好也有人會覺得，「發生事情時主管是不是馬上就會跟我們切割？」而感到不安。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_173_0.png)


    相反的，若主管願意花時間在部屬身上，部屬會覺得「就算發生什麼事情，主管也會站在自己這邊。」如果能獲得對方的信任，便能讓部屬按自己的意思行動。


    但有時候，也會碰到想好好照顧部屬，卻遇到公司經營不下去，不得不做出殘酷決定的狀況。例如，將整個事業部賣給其他公司，或是退出市場等，使部屬在公司內的職涯發展就此中斷。


    這時，只能拿出誠意與對方溝通，動之以情。看清五年、十年之後的動向，思考未來可能的職涯發展。對部屬而言，什麼才是最佳選擇？必須以盡量不損害對方的利益為前提，盡早做出結論。因為決策拖得越久，對方的選擇就會越來越少。


    如果無法在初期階段說服部屬的話，最後只能以理服人了。即便是啟動優退機制，讓員工自願提早退休也好。隨著時間的流逝，公司準備的資金也會逐漸減少，因此主管必須竭盡全力，讓對方盡早做出決定。


    另一方面，工作表現未達標準，或是引發醜聞的部屬離職時，一開始就以嚴厲冷酷的語氣表達會比較好。例如：「很抱歉，你無法繼續待在我們部門了。」那個時候如果動之以情，反而有可能會糾纏不清。所以碰到這種情況，最好從頭到尾都以冷酷的態度對應。


    ## 影響他人的能力③ | 身為領導者的強烈使命感


    操縱他人的第三個能力，就是身為領導者的強烈使命感。


    自以為了不起的人，必須嚴以律己。


    現在這個時代，員工會利用社群網站彼此交換資訊。因此，應該要對「員工正默默觀察著你」這件事有所自覺。底下的人最喜歡聽主管的八卦，壞話也容易四處流竄。而男性主管的問題大多是男女關係或是金錢糾紛。


    有幾萬名員工的公司，沒有男女關係才奇怪。雖然辦公室戀情不會因此被炒魷魚，但如果你的職位達到一定的等級，擁有相當程度的權力跟影響力的話，最好公私分明。


    不潔身自愛的人，很容易被害、扯後腿。


    這是好幾年前的事情，我曾經在某個旅館的大廳，遇到某位口無遮攔、說話犀利的知名企業家。一位年輕女性從電梯走出來，向他說：「久等了。」而那位企業家卻冷汗直流，看起來相當狼狽。看到那個場景，會讓人不禁懷疑：「跟著這個人真的沒問題嗎？」下一秒，謠言搞不好就會在公司鬧得滿城風雨。想贏得他人的信任需要很長的時間，但失去卻只要一瞬間。


    牛尾電機的創辦人牛尾治朗曾說，思想家安岡正篤「捨世俗凡欲，爲大志而活」，這句話對他的影響很大。世俗凡欲就是金錢或名聲等世俗的欲望，而大志則是世俗凡欲的另一極，指的是遠大志向或大願。要斬斷所有的欲望很難，但我們可以避欲望而遠之。真正的領導者應該要控制好自己，胸有壯志，帶領部屬前進。


    ## 訪談一：成爲言行一致的領導者


    領導者必須有不可動搖的信念。一下往左，一下往右，搖擺不定的主管，沒有人願意追隨。如果沒有自己的中心思想，無法讓周遭的人產生「既然這個人都這樣說了，就只好努力看看」的想法。


    那麼，什麼是貫徹始終的信念呢？該怎麼做才能建立起自己的信念呢？以下三個建議，提供各位在建立不可動搖的信念時參考。


    ### 建構非數字目標的願景


    給領導者的第一個建議是，建構未來的願景。


    有別於每年的預算、中期計畫等具體數字的目標，如果可以就組織的核心價值，例如釐清希望打造怎樣的團隊、想達成什麼目標等問題的話，便可以找到率領團隊的原則。沒有原則的人，容易輸給誘惑，或是容易受到誘因的影響而被他人操縱。


    作為部門經理，希望自己的部門成為什麼樣子呢？或是站上更高一個層次，從整體最佳的角度來看，公司應該要是什麼樣子？希望各位藉由閱讀本書，花點時間仔細思考一下自己想成爲什麼樣的人？理想的組織又是什麼樣子？


    ### 言行不一致的人不值得信任


    給領導者的第二個建議是，以言行一致爲目標。


    想做到言行一致，積極和部屬溝通是不可或缺的條件。想法必須不時傳達給人道，因爲不再重複、強調重要性的話，是無法滲透人心的。


    而就在持續宣傳理念的某天，踐踏聖像的威脅會突然造訪。「經理嘴巴那樣說，但是真的嗎？」考驗信念的時刻必定到來。那個時候，如果違背了過去講得振振有詞的信念，腳踏聖像的話，過去的努力一夕之間便會化爲烏有。即使你沒有踐踏聖像，卻是假裝沒看到，或躲在看不到的地方，也會正中部屬下懷。


    不逃避踐踏聖像的考驗，光明磊落的主張自己的意見。言行一致的人，值得信任。反過來說，言行不一致的人不值得信任。


    ### 做好心理準備就沒什麼好怕的


    給領導者的第三個建議是，做好心理準備。面對瞬息萬變的市場局勢，雖然朝夕改在所難免，但是必須堅守核心價值。這不僅是保證成果，也是承諾核心價值不會輕易改變。


    事情如自己所願是最好，但現實情況經常事與願違，這時你有辦法堅守承諾嗎？這裡也可以將承諾換作是「保持清高」。


    如果能做好隨時遞出辭呈的心理準備，其實就沒有什麼好怕的了。事業部的成績不如自己預期，也不會因此喪失性命，或失去所有財產。當然有必須調查未能達成目標的原因，但如果原因是自己無法掌握的話，就必須維持清高，一直沉浸於懊悔的情緒裡，什麼也不會改變。做不到的事情就是做不到，勇於承認自己的極限，不回頭向前邁進才重要。


    辭掉工作之後，日子是否過得下去，視冷靜沉著的程度而截然不同。


    假如家計也有固定成本跟變動成本，則盡量壓低每個月固定成本。只要固定成本低，辭職帶來的心理壓力就會降低。即便短時間內失去收入來源，必須動用到預備金，若預備金的金額足以支撐兩、三年的話，其實辭職也不會對生活造成太大的影響。


    然而，如果房貸跟孩子的教育費用負擔重，每個月的固定成本高的時候，失去現在的收入便會帶來非常大的壓力。家計的固定成本一高，光是維持現狀就會非常辛苦，工作上當然容易偏向明哲保身，一旦面臨抉擇，便會選擇捨棄清高。


    人是脆弱的生物，受到誘因影響而做出錯誤決定的機率並非爲零。若金錢面高度依賴公司，便難以排除金錢帶來的誘惑，必須注意。


    ### 做不到的事情就是做不到，勇於承認自己的極限，不回頭向前邁進才重要


    ## 退休後也很有用的暗黑技術


    哈佛大學有一項長達七十五年的知名調查研究「哈佛成人發展研究」，針對哈佛大學畢業的二百六十八名男性，以及成長於波士頓的四百五十六名一般男性，進行身心健康狀態的追蹤調查。


    調查對象有事業成功的有錢人、眾人皆知的名人、失敗的窮人、調查中死亡的人，什麼人都有，但是針對「對你而言什麼是幸福？」的問題，最多人回答：「良好的人際關係。」真正能讓人幸福的，不是賺大錢，也不是讓公司規模變大，而是建立良好的關係。相反的，即便社會地位再高，只要人際關係失敗，便無法感受到幸福。


    也有人一離開公司後，就不再有人搭理，孤單一人。六十五歲退休之後，一個人寂寞的度過二十年以上的餘生，這種人過去應該非常依賴頭銜所賦予的職位權力。所以，在失去公司名稱跟頭銜的瞬間，至今圍在身邊的人便會離去。過去之所以被捧得高高的，終究也只是因為握有權力罷了。


    此外，眼中只有賺錢的人，一旦失去財富，身邊的人也會跑光。錢斷緣盡，因錢而結交的朋友，失去了連結彼此的钱之後，身旁值得信任的人也就所剩無幾。因為沒有人會打從心底尊敬，為賺錢毫不在乎捨棄周遭朋友的人。


    我認为，那種人可能沒有磨練好暗黑技術。


    利用領導者魅力影響他人的暗黑技術，必須跟對方建立起信頼關係才得以運作，光有頭銜說話是沒有分量的。雖說如此，雙方不能只是單純的好朋友關係，彼此之間必須伴隨著適度的緊張感。那種人際關係的構築，看重平時的言行舉止，必須透過日常的溝通對話，長時間醞釀信頼關係。


    大家聽到暗黑技術，可能會覺得是運用政治手腕操縱人心。但其實真正的暗黑技術，不僅要懂理與情，而且還必須依據不同對象，施以不同的對策。因此，如果對人性缺乏深刻的理解，是無法靈活運用暗黑技術的。而深刻的理解，則在於加強與對方的羈絆。


    ### 1. 如果對人性缺乏深刻的理解，是無法靈活運用暗黑技術的


    ## 切割家庭跟私生活


    以前常我說：『我最近忙於工作、家庭跟私生活』的時候，經常被笑：『家庭跟私生活不是一樣嗎？』但對我來說兩者不同。


    想成為領導者的人，必須要有自己獨處的時間。暫時遠離工作、家庭跟朋友，獨自面對自己，擁有回顧過去的時間，方能鍛鍊、壯大自我。


    「那個時候爲什麼做不到呢？」「如果這樣做就好了。」總是無法好好拿捏如何跟那個人相處，我們的距離可能有點太近了。「冷靜回顧自己的過去，能夠找出下一步應採取的行動。回顧過去，設立半年後、一年後、三年後的目標，確認執行的進度，依據情況不斷修正前進的方向。透過反覆的修改，培育自己不可動搖的核心價值，持續磨練自我。


    雖然是私生活，但並不是指培養嗜好，或是享受孤獨；保留審視自己的時間對提升自我極爲重要。若沒有保留回顧過去的時間，就無法進行 PDCA（Plan・Do・Check・Action）的品質管理循環。反過來說，工作的
    P D C A 品質管理好壞，決定了未來的成長，這樣說一點也不爲過。


    ### 擁有孤獨的時刻


    平日加班到深夜，回家只有睡覺；星期五晚上，則是跟大學時代的朋友喝酒解悶；假日則是跟家人相處，每天生活都如此忙碌的話，根本沒有自己的時間。所以，必須刻意保留一點時間給自己。


    我每週會保留兩、三個小時給自己。例如，星期天早上起床之後，就會到家裡附近的餐廳，一邊吃早餐，一邊回想平日的言行舉止，想到什麼就寫在筆記本上，度過屬於自己的週日早晨。結束回顧的作業，回家後也才九點多，剩下的時間便可以跟家人好好相處。


    如果不刻意保留回顧自己的時間的話，很容易忘記。雖然有些人在泡澡放鬆的時刻，可能比較會有靈感浮現，但是片斷式的回想，無法養成回顧自我的習慣。如果不好做筆記，之後拿出來審視回顧的話，便無法做好自己的
    P D C A 品質管理。


    確認現在計畫實行的狀況，比對之前訂定的目標，決定下一個應採取的行動；藉由反覆的 PDCA 循環，能持續鍛鍊並強化自己。


    如果沒有屬於自己的時間，好好面對自我的話，便容易隨波逐流，難以修正方向。如此一來，就找不到不可動搖的信念。


    ### 打造最強的團隊


    截至今前為止，我們談論的焦點都在「你身上」。最後我想說的是，請務必打造一個屬於自己的最強團隊。那是什麼樣的團隊呢？最強團隊是指，成員擁有相同的夢想、價值觀，無須一一請示主管，自己便可以做決定，彼此的决定自然而然朝著相同方向前進的團隊。


    而身為領導者的你，必須打造願景，言行一致，做好爲達成目的也在所不惜的心理準備。以此爲前提，你必須持續提供部屬：時常照顧部屬的安心感、絕對不動搖的穩定感、絕對不會背叛團隊的信賴感。即便部屬只有一人的小團隊也一樣。即便再小的單位，也能充分發揮領導力的話，當你來到領導大型組織的階段時也不成問題。


    想要強化又久又大的公司，關鍵在於主管靈活運用七個暗黑技術，在公司各處建立起最強的團隊。正因如此，身為主管的，才是公司未來的希望。


    ## 第三部 DARK SIDE KILL 暗黑技術 實踐篇


    暗黑技術在緊急的時刻特別有用。


    本書第三部，邀請到無印良品的名譽顧問松井忠三進行對談。


    在面臨公司業績大幅下滑的危機時，領導者實行了什麼樣的對策呢？


    以下將爲各位介紹，推動大膽改革的「暗黑大師」松井顧問的高超手腕。


    ### 對談


    **IGPI 木村尚敬**


    ![](img/c5f4a27546ec03b05790e1504b0b945b_190_0.png)


    **無印良品 松井忠二**


    ![](img/c5f4a27546ec03b05790e1504b0b945b_191_0.png)


    **Matsui Tadamitsu**

    1973年從東京教育大學（現筑波大學）體育系畢業後，進入西友 Store（現西友公司）服務。1991年被派赴良品計畫，隔年轉調無印良品。曾擔任總務人力資源部門經理、無印良品事業部門經理等職，於2001年起擔任社長。上任後，從改革企業文化著手，成功讓虧損連連的無印良品谷底回升。於2008年擔任會長，2016年起擔任名譽顧問。


    ### 因自負而陷入困境的無印良品


    木村：松井先生於二〇一一年起擔任無印良品的社長，而無印良品的業績也正從那年開始急轉直下。


    松井：公司經營出現問題，大部分是內部因素，我認為有九成以上都是。在業績下滑的前十年，營收跟獲利每年都以三成左右的水準成長，業績年年成長，因此大家充滿了自信。好像一切都如自己所預料，計畫完美無缺，使大家既自傲又自滿。在那種狀況下會發生什麼事呢？大家心態變得安逸，討論的內容也越來越封閉，外頭的世界連看都不看了。反而是越來越多其他公司來參訪交流。無印良品當時的業績非常好，所以有不下百圓店、家具專賣店、文具業、化妝品業、寢具業、沙發展造商等公司，購買無印的商品，排列於會議室，然後下令要求員工：「用更低的成本做出跟無印一樣的東西。」


    當時的無印業績氣勢如虹，目中無人的企業文化蔓延。例如，交易對象的員工於會議結束要回去時，就連送訪客到電梯門口也不願意。明明不是本人的實力，而是受到公司招牌、品牌形象的光環加持，無印的員工卻自以爲是的瞧不起其他人。


    本村：所以產生了錯誤認知。


    松江：就跟從來沒吃過苦頭的人，無法成爲優秀的企業經營者一樣。當公司連續十年來業績不斷成長，就會忘記創業當時的辛苦，變得既自傲又自負。而且，當業績節節上升，公司規模越來越大的時候，組織就會逐漸僵化。也就是罹患企業大頭症，逐漸失去創業初期的危機感，以及組織的活力。那樣會發生什麼事呢？例如，在董事會上只會出現存貨盤點跟開設新店等，這類理所當然的議題，需要思考判斷的議題越來越少。就運董車會都這樣了，更何况是其他組織，大家都停止思考創新了。


    但那是只要把東西放在店裡，就賣得出去的時代。在那個年代，人人可以當上店長，五十人進入公司，五十人全部都可以升店長。那些人只不過剛好在公司業績正旺的時候進公司，卻以爲業績好都是自己的功勞。


    此外，簽核流程的用印數量也增加了。開店計畫書在審核過程中，必須蓋八到九個章。我跟他們說只要有市場開發負責人、市場開發部門的董事跟銷售部門的董事，三個人用印就好，但人力資源部門的董事卻說：「沒有看到開店計畫書就不招人。」經理說：「店鋪數量增加的話，不但必須安排店的編號，還得準備廣告傳單。」系統部門的經理也說：「我們還必須準備新的電腦。」每個人都跳出來反對我簡化流程的提議。


    木村：蓋章感覺就是分散風險，模糊責任歸屬。


    松井：然而，當時開設的新店幾乎全壘覆沒，新開設的十間店當中，有八間的業績未達到計畫，因爲開店的評估太過拙劣粗糙。但也沒有人因此被追究責任，因爲從以前到現在一直都是這樣。


    因爲母集團（季節集團）如此，所以我們也依據同樣的制度，也就是前例主義，參考去年的行程，安排今年的計畫。例如，人力資源部門的新人訓練資料，一個不小心董事的名字可能會寫錯，由此可知新人訓練的內容跟五年前一樣。這種情況如果發生在銷售或產品開發部門的話，會是嚴重的致命傷。但通常這種問題發生在各個部門。


    一堆人蓋章簽核，就跟「大家一起闖紅燈就不怕了」同樣的概念。只要大家蓋章，就代表是公司決定的，不會有人因此被追究責任。如果將用印縮減至三個人的話，當新店鋪經營不善的時候，市場開發的負責人跟該部門的董事一定會被追究責任。如果無法鎖定是誰的主意、計畫是如何實行的話，便無法找出問題出在哪。所以，必須減少蓋章的數量。


    木村：雖然是非常簡單的道理，但弄清楚措施與結果的因果關係，劃分好責任歸屬，對事業的營運而言相當重要。


    松井：當時組織未臻成熟，也是業績低迷的原因之一。在服飾用品、居家用品跟食品三個部門當中，業績最早開始下滑的是服飾用品部門。有客人反應，商品設計跟西友超市賣的衣服一樣沒品味。如同客戶指出的，負責設計製造的人的確是前西友的員工。當服飾用品部門的業績往下掉的時候，不成熟的組織開始尋找犯人了。大家覺得服飾用品的業績不好都是部門經理的錯，所以部門經理三年內就換了五個人。也就是說，這三年當中，對策是治標不治本。大家覺得只要把主管換掉，應該多少會有效果，當時的組織就是這麼幼稚不成熟。

