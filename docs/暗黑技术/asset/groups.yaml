    七億元以上的營業額，但商品卻沒有足夠的吸引力。因為展店的方式相當拙劣，使得七億的銷售目標，只賣出三億左右。會出現千坪的店鋪，是因為站前的丸井百貨在搬遷、擴大營業面積的過程中，多出空店面。幾乎沒有品牌有能力租借千坪店面，所以丸井就跑來找當時最潮的無印良品洽談。結果，營業額卻只有三億元，嚴重虧損。


    另一個錯誤就是，對加盟店採取放年吃草的政策。如果商品開發的背後沒有足夠的銷售能力，也只是空談。沒有銷售，就做不成生意。所以必須展店，擴大規模。無印良品在創立當時沒有什麼資金，所以是靠加盟店打下江山，鞏固了事業版圖。


    然而，當加盟店成長到某種程度之後，就會逐漸不受控制。例如，過季出清之類的商品獲利低，所以不願意進貨。如此一來，自有品牌專業零售商的命脈「庫存管理」，就必須由直營店負責。因為負擔過度沉重，公司便將展店策略從加盟店，切換到以直營店、大型店鋪爲主去展店。在加盟店的附近也開設了新店鋪，結果造成同品牌之間自家互打的問題。我擔任社長的時候，正值公司內部風暴來臨之際。


    背後都是有原因的，因爲當時無印良品的母集團季節集團面臨解體危機，其手中握有的最後資金來源，就是全家便利商店跟無印的股份。後來全家便利商店順利賣給了伊藤忠商社，而無印的股份則是賣給一般投資人。因此，無印不得不採取提高股價的策略，'
  - '[PAGE 199]


    所以才會大量展店。爲提高獲利，不處分不良存貨。到最後，紙包不住火，終於從二○○○年獲利開始逐漸衰退。


    這些是造成業績衰退的內部因素。公司開始走下坡的時候，內部體制的敗壞通常是最 大的原因。過去以展店提高營業額，帶動商品的開發，但這個方法在開設坪店鋪時到 達了臨界點。在那之後，銷售再也無法帶動新商品的開發，因爲公司既沒有能力，也
    失了創意。


    # 推卸責任的下場就是蓋不完的章


    本村：本書的主要討論對象是又久又大的公司，也就是患有大頭症的企业。而那樣的症 狀，明顯反映在員工的時間管理上。處理公司內部事務的時間比例越來越高，也可以說
    有許多時間是花在辦公室政治上吧。


    松井：沒有錯。正因爲自傲跟自滿，使大家討論的內容越來越封閉，不再看外頭的世界。'
  - '[PAGE 200]


    不把眼光放在外頭世界的公司是不行的。


    木村：結果會發生什麼事呢？當公司業績衰退的時候，便會引發部門之間彼此卸責的鬥爭，「問題是其他部門造成的。不是我們，都是誰誰誰的錯。」


    松井：就像你說的，互推責任的結果，簽核必須蓋一堆章。我在西友時曾經待過人力資源部，在規畫人才培訓計畫的時候，必須事前跟常務董事、專務董事、相關部門的全體董事說明。董事會上也只是形式上的討論，當場不會做出任何決定。


    無印良品剛開始時也會做事前疏通。但如此一來，工作就容易受到公司內部的政治角力影響。所以我禁止所有的事前疏通，有什麼事情就拿到會議上光明正大的討論。一旦進行事前疏通，在會議上提出時，事情其實都已經決定好了，事務局便能安心聽取報告。如果沒有事前疏通，會議上有可能會遭受反對。因此在明哲保身的思維下，大家自然會進行事前疏通。事前疏通的風氣最盛行於公務體系，其次是金融機構等歷史悠久的企業。'
  - '[PAGE 201]


    木村：如此一來，大家都害怕失敗，沒有人願意承擔風險。特別是經理、課長等主管，模糊責任歸屬的弊病多。


    松井：大家都是上班族，不喜歡惹上頭的人生氣，畢竟會影響到升遷。但如果是這樣的話，就會變成看上頭的臉色做事。所以我的第二本書《無印良品培育人才祕笈》的副標題就是「乖乖牌上班族會毀掉公司」。過去無印的企業文化就是善於事前疏通、懂得看上司臉色行動、企畫書寫得漂亮的人升遷機會多。不改變那種職場文化，就無法成為體制健全的公司。


    木村：我則是用另一個說法：「把時間花在底下的人身上。」不要把時間花在看上頭的臉色，而是要花時間在部屬身上。'
  - '[PAGE 202]


    # 行動不變，思維就不會變


    松井：我任職於西友的時期是負責教育訓練，在創立二十週年跟二十五週年時，分別提出了行動二十跟行動二十五。每個人都知道綜合百貨公司的經營型態正面臨危機，必須尋求突破。該怎麼尋求突破呢？大家第一個想到的是必須改變思維。而改變思維是人力資源管理部門負責的範圍，所以這份工作就落到我頭上。


    當時經理等級以上的主管有三百人，我採取了開發自美國的「敏感度訓練」方法，爲這些主管舉辦了難度相當高的思維改革研習營。然而，大家並沒有因爲這個研習營而改變想法。因爲思維是來自公司根深柢固的價值觀，想改變這個價值觀需要相當大的能量。從結論來說，不改變行動，就無法改變思維。不是改變思維，所以行動改變了，而是改變行動，所以思維改變。這個順序顛倒的話便行不通。


    行動只能從日常中的政策改變。藉由日常工作的政策去改變行動，等大家逐漸接受那些政策之後，思維才會發生變化。所以，思維改革運動一開始都不會成功。當時，西友的問題便是出一開始就推動思維改革運動。我因爲在最前線，受委託執行改革，所以'
  - '[PAGE 203]


    非常清楚這樣做是不通的。


    綜合百貨公司之所以經營不振，是因爲支撐著百貨公司的中央集權管理、大量進貨大量銷售、一站式購物服務、自助式銷售等商業模式，逐漸崩解所致。如果不對症下藥，是無法脫離困境的。但當時卻沒有任何人著手商業模式的改革，所以西友的業績遲遲不見好轉。


    木村：另外，我認爲個人的誘因源自於何處，也是其中重要因素。就像剛才提到的升遷競爭，大部分上班族努力工作動機之一，應該也是因爲想要往上爬吧。


    松井：對對對，想讓生活變得更好。


    木村：但像松井先生，您雖然是上班族社長，卻成功推動了改革，完全是反例。您應該對升官發財沒有太多欲望吧？'
  - '[PAGE 204]


    # 越難搞的人在緊急時刻越有用


    松井：對啊。想要往上爬，某些時候就必須違背自己的信念。也就是說，當你向各部門事前疏通，看大家臉色做事而獲得升遷的時候，可能會發生某一天被商品部門的事務叫去，請你把最好的人才安排到他部門之類的事情。無法公平分配公司的資源，行動終究會偏向局部最佳化。因爲你不那樣做的話，便無法在公司裡生存。


    獲得升遷、調新，想過好生活的人占大多數。採取跟大家一樣的做法比較安全，所以向各部門事前疏通，以討高層次人爲行動準則的人非常多。這樣的人是多數，因此便容易成群結黨。不只是會議上，就連吃飯喝酒也是集體行動。然後，經理說什麼就做什麼。我非常討厭那種價值觀，所以別人找我去吃飯喝酒，我全部都拒絕。當然也被認爲是難搞的人。


    因爲我在公司不是多數主流，所以一直待在人力資源部。四處露臉、八面玲瓏，討高層歡心的人能獲得升遷的公司，一定哪裡有問題。就像是西鄉隆盛所說，不要錢、不要名，而且不要命的人最難搞。因爲那種人擁有自己的一套人生哲學，而那非常重要。'
  - '[PAGE 205]


    木村：我認爲，自己想獲得什麼、成爲什麼的價值觀，才是真正的慾望。


    松井：所以，最大的問題出在人生態度。不計得失，跟阿諛奉承扯不上關係的人，才有辦法持續堅持信念。過去我因爲想成爲教師，而進入大學。但因爲參加全學運的學運抗議游行時被逮捕，在警察局的拘留室待了三週，我二十歲的生日也是在那邊度過。我從以前就非常討厭對威權低頭、唯唯諾諾，不敢抵抗的制度。雖然被逮捕對父母很不孝，最後更是不得不放棄成爲教師，這失敗是非常大的致命傷。


    後來不得已，只好進人民間企業工作，但是在那邊，我也是不喜歡一個命令一個動作。應該採取行動而不去做的話，我就覺得難受。在上頭的人眼中，我是個難纏的傢伙，所以被派到無印良品。東證一部上市公司的課長，被調派到無印良品的子公司卻還是課長，一般來說至少也要是部長級。我很明顯是被左遷，但也是無可奈何。不過，多虧了左遷，讓我看盡了各種職場的腐敗。


    剛才談到推諉責任，但職位調動，是自己無法做決定的。雖然這麼說，但覺得自己沒有獲得公司公正的評價，所以才被迫降職而心有不滿的人，最後也是看不到這些人的身'
  - '[PAGE 206]


    影。所以我很清楚，把問題都推給別人的想法，理論上是不可行的。還有一點就是，我非常討厭不好好分內工作。因此，即便待遇多差，在被左遷、轉調到無印良品之後，我也勇於背負風險，對每項工作盡心盡力。


    我是在良品計畫創立之初被派過去的，也就是說，當時公司的營運狀況是虧損的，所以對公司沒幫助的人難以立足，非常現實。公司沒有餘裕聘請做不出實績的人。我當時職務轉調的獎金為十四萬元，而隔年就要我擔任部門經理，再隔年則是董事。


    木村：您不到三年就從課長、部門經理，一路升到董事。


    松井：當然也有其他狀況。例如，有一個人從母公司被派赴來擔任總務的職位，我跟他說：「店裡有很多老鼠，請防治業者來消毒防治。」對方回答：「不好意思，要做老鼠防治，必須經過維修部門、行政部門跟總務部門。」總務必須聯絡防治業者，也必須跟房東溝通交涉。如果建築設施有孔洞的話，就必須請維修部門補洞。而建築設施則是由行政部門管理。西友的總務約有六個部門，只是簡單的老鼠防治就必須勞動到三個部門。剛分割出去成為子公司的無印良品，人手嚴重不足由此可見。'
  - '[PAGE 207]


    負責行銷宣傳的人也一樣。JR原宿車站軌道兩側的廣告立牌非常醒目，所以我們簽下了一年的合約，每個月更換廣告內容。我問行銷宣傳的負責人：「看板什麼時候做好？」對方回答：「下週就會弄好。」但是過了一週、兩週，廣告都還沒登上去。雖然負責人說：「已經指示廣告代理商了。」但廣告宣傳的看板依舊空蕩，這樣稱不上是有在工作。


    因為母公司是季節集團，刊登廣告當然是透過大型廣告代理商。大家都把那種工作交代給下頭的承包商的。如果負責人有交代好的話，自然沒問題。問題就是沒有交代好，所以廣告看板一直沒有刊登出來。但負責人卻說：「我有做好分內的工作。」如果是在西方的話，他可能已經算做好分內工作了。但是對在資金拮據的情況下，仍撥出行銷預算的無印良品而言，說下週要刊出，下週就一定要刊登出來。即便那中間必須跟很多間廠商協調，也必須在一週後確實讓廣告上去。


    本村：也就是說，小公司工作的方式跟上市公司不同。


    松井：但那種人最容易被派赴或轉調。如此一來，從經營者的角度來看，無論是總務負'
  - '[PAGE 208]


    責人還是行銷負責人，基本上都沒有發揮功效。而我不是那樣。雖然我在西友任職時，被認為是不聽話的人，但是來到無印良品之後，別人叫我做什麼，我就盡力完成，成果有目共睹。如此一來，工作便獲得相當高的評價，結果就是快速升遷。成熟的企業跟還有許多發展空間的企業，兩者之間果然有許多不一樣的地方。


    本村：想要做些什麼的時候，因為部門之間的互不侵犯條約發生作用，使大家在權限範圍之外的事便不插嘴干涉，這種情況經常可以在大企業裡看到。但是否有人能打破這樣的潛規則，敢於冒險進取呢？


    # 關鍵在於能做出成果的人


    松井：對公司而言，最重要的就是擁有能做出成果的人才。若非如此，公司便無法營運。想要做出成果，就必須承擔責任，堅持做到最後。如果連這樣都做不到，是不可能做出成果的。但就像剛才說的，在大企業的體制裡，「我的工作只負責到這裡」，是普遍的'
  - '[PAGE 209]


    工作態度。即便如此，如果公司的體制是有能力、做出成果的人可以往上爬的，那沒什麼大問題。如果連這種制度都沒有的話，公司就會逐漸衰敗、無法振作。


    木村：松井先生在成為社長之前所看到的公司樣貌，跟成為社長之後看到的公司樣貌，不一樣對不對？


    松井：嗯，可能跟職位不同有關。我剛進入無印良品時，最初的任务是建立人力資源管理制度、自行招募員工、計算薪資、成立工會，而且還必須處理職位調動的业务。我努力完成了那些工作，也因此獲得升遷，擔任業務部門的部門經理。那是我第一次擔任事業部門的經理，部門底下有產品部、銷售部等，有八成員工都隸屬於業務部門。


    我在西友任職的時期，其實有三年的賣場經驗，所以大致上懂一點銷售。但是我完全不懂產品部跟品管部等領域的東西，雖然不懂，也不能就放著不管。所以我首先掌控了四位關鍵人物，他們分別是負責關東跟關西的兩位銷售經理、產品經理，以及統籌整體的事業部課長。然後，再往下延伸，經理掌控底下的課長，課長再往下掌控底下的店長。因為一個人要掌握全部實在是種不可能。'
  - '[PAGE 210]


    木村：松井先生在擔任業務部門經理時，來不及從零開始學習產品部跟品管部的知識，所以必須集結有能力的人，建立團隊。用得上的人才就盡量用，想辦法做出成果。想請問松井先生是如何「馴服」那四位主管，讓他們按照你的意思行動呢？


    # 蒐集現場意見時的副作用


    松井：自己有辦法掌握的範圍，大約是七到十人。如果可以掌握到十人的話，有事情的時候就直接找那十個人就好。如果那十個人底下還有十人單位的組織，全部就是百人規模的組織。如果往下還有十人單位，就是千人規模的組織。公司就是以這樣的方式在管理。中國的騎兵隊，大多也是用這種方式管理。不這麼做的話，是無法管理好公司的。


    我也是在擔任無印良品的事業部經理時才發現，經營者沒辦法掌握所有的事情。如果銷售部經理有兩位，分別負責關東跟關西的話，就個別跟他們吃飯喝酒、直接溝通交流。然後，那兩位銷售部經理再跟底下的課長溝通交流。像那樣，只要掌握好兩位經理，大'
  - '[PAGE 211]


    致上便能掌握銷售部門。直接跟課長溝通交流，當然也是可以。可是到了店長等級，便難以掌握一人就掌握全部。而且，一旦脫離了指揮命令系統，更無法完全掌控。

    最糟糕的是，老闆直接跑去店裡蒐集現場人員的意見，然後帶著第一手資訊回總公司，直接對董事或經理下指示。而董事或經理有可能會覺得有人向老闆打小報告，便會把犯人揪出來後，在工作上處處為難對方，那樣的副作用時常可見。


    木村：也就是說，不允許有人越過自己，直接向老闆打小報告。


    松井：季節集團的創辦人堤清二也曾經做過同樣的事情。各董事在董事會上報告時雖然沒有說謊，但講的內容好像跟實際情況有落差。但那也是沒辦法的事，因為大家都想保護自己。堤先生的個性十分謹慎，所以他找出各家店鋪年輕、有活力且優秀的主任，找到機會就直接跟他們溝通交流。如此一來，就會產生現場問到的資訊，跟董事會上大家報告的內容有出入的現象。堤先生是公司的老闆，脾氣也比較不好，所以在董事會上狠狼斥責了大家一頓。被罵的人就循著堤先生的足跡，找出提供資訊的主任，那個人後來被修理得很慘。我在無印良品直接聽取店長的意見，對其他主管下指令時，也發生過同'
  - '[PAGE 212]


    樣的事情。


    所以我發現，想要獲取現場第一手資訊的話，從特定人物身上汲取的方法是不行的。


    特別是要求業務部門蒐集現場資訊時，往往無法聽到第一線人員真正的意見。回報告的資訊都是篩選過的內容，大家的報告聽起來就是聽從指示、執行工作而已。所以，上頭的人無法完全掌握現場的狀況。


    實在是沒辦法，我只好利用每天都會到店鋪訪查的組織「稽查室」。這個組織的人員除了原本的督導工作之外，還必須負責到現場拍照，確認現場人員如何執行業務部門下达的指示等業務。每次確認的內容都不同，例如，想確認現場擺放商品的有效期限時，因爲透過現場人員的回報無法了解實際情況，所以會請稽查室的人員確認再回報。後來我便將制度改爲，請稽查室的人於每週一的十二點半回報確認結果。如此一來，現場資訊的蒐集並非透過個人，而是組織，銷售部門也就無法針對個人找碴了。


    木村：原來如此。某間公司的經理將提供資訊的員工稱爲「間諜」，也就是說，有別於官方的正式組織，在公司內部建立屬於自己的網絡關係。那位主管的意思是，因爲上頭的人無法每天走訪現場，所以擁有可以掌握現場的情資網相當重要。'
  - '[PAGE 213]


    松井：個人的資訊取得管道，總有一天會曝光。職位爬得越高，下頭的線民也越容易曝光。如此一來，就會發生堤先生跟我在初期蒐集資訊時同樣的狀況，讓提供資訊的人被刁難找碴。


    本村：因爲提供資訊者的身分曝光了。


    松井：一定會曝光。所以我才會選擇官方正式的組織，讓「稽查室」這個官方組織走訪現場，而不是利用自己的情報網絡。而且，稽查室是以提供店長意見、商量煩腦的角色採訪，而不是以「奉命行事」的態度去找碴。如此一來，原本討人厭的稽查室，反而變成備受信賴的組織。而且報告的時候，銷售經理等主管也會同桌。也就是說，藉由利害關係人同席溝通，減少資訊提供人做事後追究的情況發生。公司最大的目的是改善現場的運作，所以讓利益互斥的人站在同一個地方的話，即便表面上關係對立，最終利害關係仍會逐漸趨向一致。如果有辦法讓大家團結一致，提升公司整體能力的話，就能減少內部彼此反目成仇的情況。'
  - '[PAGE 214]


    木村：聽您說起來似乎簡單，但實際做起來應該相當不容易吧。那是非常暗黑的技法。


    # 讓標準像空氣一樣


    松井：若無法掌握現場的樣貌，經營就會出錯。所以，從過去的失敗經驗中記取教訓，建立起一套機制，這讓我雖然人在總公司，也能夠掌握第一線發生的事情。


    我之所以會認爲公司必須制定一套標準的作業流程，是因爲當時依賴直覺跟經驗的職場文化蔓延。隔天早上十點有新店鋪開幕時，前一天晚上六點會到賣場進行最後確認，這樣的流程確實有建立起來。然而，前來支援的老鳥店長卻按照自己的方式調整賣場的擺設。每個來現場幫忙的人，都按照自己的方式改變擺設，如此一來根本沒完沒了，賣場的擺設永遠弄不好。原因是源自經驗主義，一百位店長就有一百種賣場的布置方法，但那樣的做法並不好。爲了讓無論是誰來做，都可以做出同樣的結果，公司便編輯了『MUIGRAM』標準作業手冊。'
  - '[PAGE 215]


    然而，一旦編纂出標準作業手冊，組織就會僵化，員工變成一個口令一個動作、被動執行指令的機器人。這個做法很快面臨到，工作內容變化快速，但標準作業手冊卻未與時俱進的問題。所以我便向思夢樂的藤原秀次郎討教學習，發現他們的標準作業手冊會不斷編修。標準作業手冊不是編撰完成後就結束了，而是要不斷更新編修，當我了解到這點之後，便依據現場人員的智慧跟客人的意見修改手冊內容，建立起定期更新手冊內容的機制。


    木村：關於工作從製作標準作業手冊開始的概念，您在著作《無印良品成功九○％靠制度》當中也有提到。


    松井：但更新了標準作業手冊的內容之後，如果現場未能百分之百執行的話，更新就沒有意義。在一般的組織，下達指令後，大約七、八成的店長會確實執行，但是剩下兩、三成的店長則不會執行。如果無法讓這兩、三成的店長確實執行的話，便無法提升公司的營運能力。


    那麼該怎麼做呢？這個時候不是依據標準作業手冊按表操課，只要讓手冊如空氣般，'
  md: '

    因爲換掉服飾用品的部門經理也沒有效果，所以這次大家覺得必須換掉採購企劃，而且出身西友的人實在無法改善業績，便決定對外招募。然而，外部招募進來的人，竟然跟廠商收取回扣。原本公司沒有的外來文化，造成內部混亂。結果證明了，只要換掉某個人的想法，是極爲短視的對策。


    例如，在我擔任事業部的部門經理時，向業務部課長問道：「爲什麼這間店的業績不好？」對方回答：「那是人禍，因爲店長沒能力。」這個回答就讓我也束手無策。在正面迎接優衣庫跟宜得利的挑戰之際，僅憑店長的力量一決勝負的想法，才是真正的人禍根源。想憑藉店長的力量贏得勝利是不可能的。雖然店長可能占整體力量的二、三％，但是在必須集結製造力、銷售力、企業文化、執行力等總體戰上，不可能僅憑店長一人之力就能決定勝負。


    木村：所以必須運用組織整體的力量迎接挑戰。


    松井：無印良品誕生於一九八○年，是走在流行尖端的品牌。無印良品是由季節集團的堤清二、田中一光以及小池一平代表日本的創意大師所創立。成立當時的理念相當創新，使得無印連續十年不斷成長。然而，組織卻沒有跟著成長，自傲自滿、前例主義蔓延，改革的思維只停留在換人來做，因此推出的商品漸漸失去客戶的心。無印不再走在尖端，而是在後頭追趕。只是，無印的商品種類變多了。無印以網羅兩房一廳、三房一廳住宅的生活用品為概念，開始生產家電、西裝、女用內衣等，商品包羅萬象。但全都是在人家後頭苦苦追趕，這成了致命傷。


    ## 快速擴大規模帶來的反效果


    松井：再來就是經營策略也出了問題。當時採取了快速擴大規模的策略，但其實際經營上最難的就是進攻。


    二〇〇〇年時店面積增加了四〇％，一般增加的比例大約為四、五％。無論是無印良品，還是優衣庫、宜得利、思樂樂等同業，大家就像說好似的，新店鋪的比例只占總面積的四、五％，這是一般的巡航速度。但無印良品卻以十倍的速度展店。過去大型店鋪的面積只有五百坪，當時卻一口氣擴大到千坪。千坪店鋪的銷售計畫，必須達到年間七億元以上的營業額，但商品卻沒有足夠的吸引力。因為展店的方式相當拙劣，使得七億的銷售目標，只賣出三億左右。會出現千坪的店鋪，是因為站前的丸井百貨在搬遷、擴大營業面積的過程中，多出空店面。幾乎沒有品牌有能力租借千坪店面，所以丸井就跑來找當時最潮的無印良品洽談。結果，營業額卻只有三億元，嚴重虧損。


    另一個錯誤就是，對加盟店採取放羊吃草的政策。如果商品開發的背後沒有足夠的銷售能力，也只是空談。沒有銷售，就做不成生意。所以必須展店，擴大規模。無印良品在創立當時沒有什麼資金，所以是靠加盟店打下江山，鞏固了事業版圖。


    然而，當加盟店成長到某種程度之後，就會逐漸不受控制。例如，過季出清之類的商品獲利低，所以不願意進貨。如此一來，自有品牌專業零售商的命脈「庫存管理」，就必須由直營店負責。因為負擔過度沉重，公司便將展店策略從加盟店，切換到以直營店、大型店鋪爲主去展店。在加盟店的附近也開設了新店鋪，結果造成同品牌之間自家互打的問題。我擔任社長的時候，正值公司內部風暴來臨之際。


    背後都是有原因的，因爲當時無印良品的母集團季節集團面臨解體危機，其手中握有的最後資金來源，就是全家便利商店跟無印的股份。後來全家便利商店順利賣給了伊藤忠商社，而無印的股份則是賣給一般投資人。因此，無印不得不採取提高股價的策略，所以才會大量展店。爲提高獲利，不處分不良存貨。到最後，紙包不住火，終於從二○○○年獲利開始逐漸衰退。


    這些是造成業績衰退的內部因素。公司開始走下坡的時候，內部體制的敗壞通常是最 大的原因。過去以展店提高營業額，帶動商品的開發，但這個方法在開設千坪店鋪時到達了臨界點。在那之後，銷售再也無法帶動新商品的開發，因爲公司既沒有能力，也
    失了創意。


    ## 推卸責任的下場就是蓋不完的章


    本村：本書的主要討論對象是又久又大的公司，也就是患有大頭症的企业。而那樣的症狀，明顯反映在員工的時間管理上。處理公司內部事務的時間比例越來越高，也可以說有許多時間是花在辦公室政治上吧。


    松井：沒有錯。正因爲自傲跟自滿，使大家討論的內容越來越封閉，不再看外頭的世界。不把眼光放在外頭世界的公司是不行的。


    木村：結果會發生什麼事呢？當公司業績衰退的時候，便會引發部門之間彼此卸責的鬥爭，「問題是其他部門造成的。不是我們，都是誰誰誰的錯。」


    松井：就像你說的，互推責任的結果，簽核必須蓋一堆章。我在西友時曾經待過人力資源部，在規畫人才培訓計畫的時候，必須事前跟常務董事、專務董事、相關部門的全體董事說明。董事會上也只是形式上的討論，當場不會做出任何決定。


    無印良品剛開始時也會做事前疏通。但如此一來，工作就容易受到公司內部的政治角力影響。所以我禁止所有的事前疏通，有什麼事情就拿到會議上光明正大的討論。一旦進行事前疏通，在會議上提出時，事情其實都已經決定好了，事務局便能安心聽取報告。如果沒有事前疏通，會議上有可能會遭受反對。因此在明哲保身的思維下，大家自然會進行事前疏通。事前疏通的風氣最盛行於公務體系，其次是金融機構等歷史悠久的企業。


    木村：如此一來，大家都害怕失敗，沒有人願意承擔風險。特別是經理、課長等主管，模糊責任歸屬的弊病多。


    松井：大家都是上班族，不喜歡惹上頭的人生氣，畢竟會影響到升遷。但如果是這樣的話，就會變成看上頭的臉色做事。所以我的第二本書《無印良品培育人才祕笈》的副標題就是「乖乖牌上班族會毀掉公司」。過去無印的企業文化就是善於事前疏通、懂得看上司臉色行動、企畫書寫得漂亮的人升遷機會多。不改變那種職場文化，就無法成為體制健全的公司。


    木村：我則是用另一個說法：「把時間花在底下的人身上。」不要把時間花在看上頭的臉色，而是要花時間在部屬身上。


    ## 行動不變，思維就不會變


    松井：我任職於西友的時期是負責教育訓練，在創立二十週年跟二十五週年時，分別提出了行動二十跟行動二十五。每個人都知道綜合百貨公司的經營型態正面臨危機，必須尋求突破。該怎麼尋求突破呢？大家第一個想到的是必須改變思維。而改變思維是人力資源管理部門負責的範圍，所以這份工作就落到我頭上。


    當時經理等級以上的主管有三百人，我採取了開發自美國的「敏感度訓練」方法，爲這些主管舉辦了難度相當高的思維改革研習營。然而，大家並沒有因爲這個研習營而改變想法。因爲思維是來自公司根深柢固的價值觀，想改變這個價值觀需要相當大的能量。從結論來說，不改變行動，就無法改變思維。不是改變思維，所以行動改變了，而是改變行動，所以思維改變。這個順序顛倒的話便行不通。


    行動只能從日常中的政策改變。藉由日常工作的政策去改變行動，等大家逐漸接受那些政策之後，思維才會發生變化。所以，思維改革運動一開始都不會成功。當時，西友的問題便是出在一開始就推動思維改革運動。我因爲在最前線，受委託執行改革，所以非常清楚這樣做是不通的。


    綜合百貨公司之所以經營不振，是因爲支撐著百貨公司的中央集權管理、大量進貨大量銷售、一站式購物服務、自助式銷售等商業模式，逐漸崩解所致。如果不對症下藥，是無法脫離困境的。但當時卻沒有任何人著手商業模式的改革，所以西友的業績遲遲不見好轉。


    木村：另外，我認爲個人的誘因源自於何處，也是其中重要因素。就像剛才提到的升遷競爭，大部分上班族努力工作動機之一，應該也是因爲想要往上爬吧。


    松井：對對對，想讓生活變得更好。


    木村：但像松井先生，您雖然是上班族社長，卻成功推動了改革，完全是反例。您應該對升官發財沒有太多欲望吧？


    ## 越難搞的人在緊急時刻越有用


    松井：對啊。想要往上爬，某些時候就必須違背自己的信念。也就是說，當你向各部門事前疏通，看大家臉色做事而獲得升遷的時候，可能會發生某一天被商品部門的事務叫去，請你把最好的人才安排到他部門之類的事情。無法公平分配公司的資源，行動終究會偏向局部最佳化。因爲你不那樣做的話，便無法在公司裡生存。


    獲得升遷、調薪，想過好生活的人占大多數。採取跟大家一樣的做法比較安全，所以向各部門事前疏通，以討高層次人爲行動準則的人非常多。這樣的人是多數，因此便容易成群結黨。不只是會議上，就連吃飯喝酒也是集體行動。然後，經理說什麼就做什麼。我非常討厭那種價值觀，所以別人找我去吃飯喝酒，我全部都拒絕。當然也被認爲是難搞的人。


    因爲我在公司不是多數主流，所以一直待在人力資源部。四處露臉、八面玲瓏，討高層歡心的人能獲得升遷的公司，一定哪裡有問題。就像是西鄉隆盛所說，不要錢、不要名，而且不要命的人最難搞。因爲那種人擁有自己的一套人生哲學，而那非常重要。


    木村：我認爲，自己想獲得什麼、成爲什麼的價值觀，才是真正的慾望。


    松井：所以，最大的問題出在人生態度。不計得失，跟阿諛奉承扯不上關係的人，才有辦法持續堅持信念。過去我因爲想成爲教師，而進入大學。但因爲參加全學運的學運抗議游行時被逮捕，在警察局的拘留室待了三週，我二十歲的生日也是在那邊度過。我從以前就非常討厭對威權低頭、唯唯諾諾，不敢抵抗的制度。雖然被逮捕對父母很不孝，最後更是不得不放棄成爲教師，這失敗是非常大的致命傷。


    後來不得已，只好進人民間企業工作，但是在那邊，我也是不喜歡一個命令一個動作。應該採取行動而不去做的話，我就覺得難受。在上頭的人眼中，我是個難纏的傢伙，所以被派到無印良品。東證一部上市公司的課長，被調派到無印良品的子公司卻還是課長，一般來說至少也要是部長級。我很明顯是被左遷，但也是無可奈何。不過，多虧了左遷，讓我看盡了各種職場的腐敗。


    剛才談到推諉責任，但職位調動，是自己無法做決定的。雖然這麼說，但覺得自己沒有獲得公司公正的評價，所以才被迫降職而心有不滿的人，最後也是看不到這些人的身影。所以我很清楚，把問題都推給別人的想法，理論上是不可行的。還有一點就是，我非常討厭不好好分內工作。因此，即便待遇多差，在被左遷、轉調到無印良品之後，我也勇於背負風險，對每項工作盡心盡力。


    我是在良品計畫創立之初被派過去的，也就是說，當時公司的營運狀況是虧損的，所以對公司沒幫助的人難以立足，非常現實。公司沒有餘裕聘請做不出實績的人。我當時職務轉調的獎金為十四萬元，而隔年就要我擔任部門經理，再隔年則是董事。


    木村：您不到三年就從課長、部門經理，一路升到董事。


    松井：當然也有其他狀況。例如，有一個人從母公司被派赴來擔任總務的職位，我跟他說：「店裡有很多老鼠，請防治業者來消毒防治。」對方回答：「不好意思，要做老鼠防治，必須經過維修部門、行政部門跟總務部門。」總務必須聯絡防治業者，也必須跟房東溝通交涉。如果建築設施有孔洞的話，就必須請維修部門補洞。而建築設施則是由行政部門管理。西友的總務約有六個部門，只是簡單的老鼠防治就必須勞動到三個部門。剛分割出去成為子公司的無印良品，人手嚴重不足由此可見。


    負責行銷宣傳的人也一樣。JR原宿車站軌道兩側的廣告立牌非常醒目，所以我們簽下了一年的合約，每個月更換廣告內容。我問行銷宣傳的負責人：「看板什麼時候做好？」對方回答：「下週就會弄好。」但是過了一週、兩週，廣告都還沒登上去。雖然負責人說：「已經指示廣告代理商了。」但廣告宣傳的看板依舊空蕩，這樣稱不上是有在工作。


    因爲母公司是季節集團，刊登廣告當然是透過大型廣告代理商。大家都把那種工作交代給下頭的承包商的。如果負責人有交代好的話，自然沒問題。問題就是沒有交代好，所以廣告看板一直沒有刊登出來。但負責人卻說：「我有做好分內的工作。」如果是在西方的話，他可能已經算做好分內工作了。但是對在資金拮據的情況下，仍撥出行銷預算的無印良品而言，說下週要刊出，下週就一定要刊登出來。即便那中間必須跟很多間廠商協調，也必須在一週後確實讓廣告上去。


    本村：也就是說，小公司工作的方式跟上市公司不同。


    松井：但那種人最容易被派赴或轉調。如此一來，從經營者的角度來看，無論是總務負責人還是行銷負責人，基本上都沒有發揮功效。而我不是那樣。雖然我在西友任職時，被認為是不聽話的人，但是來到無印良品之後，別人叫我做什麼，我就盡力完成，成果有目共睹。如此一來，工作便獲得相當高的評價，結果就是快速升遷。成熟的企業跟還有許多發展空間的企業，兩者之間果然有許多不一樣的地方。


    本村：想要做些什麼的時候，因為部門之間的互不侵犯條約發生作用，使大家在權限範圍之外的事便不插嘴干涉，這種情況經常可以在大企業裡看到。但是否有人能打破這樣的潛規則，敢於冒險進取呢？


    ## 關鍵在於能做出成果的人


    松井：對公司而言，最重要的就是擁有能做出成果的人才。若非如此，公司便無法營運。想要做出成果，就必須承擔責任，堅持做到最後。如果連這樣都做不到，是不可能做出成果的。但就像剛才說的，在大企業的體制裡，「我的工作只負責到這裡」，是普遍的工作態度。即便如此，如果公司的體制是有能力、做出成果的人可以往上爬的，那沒什麼大問題。如果連這種制度都沒有的話，公司就會逐漸衰敗、無法振作。


    木村：松井先生在成為社長之前所看到的公司樣貌，跟成為社長之後看到的公司樣貌，不一樣對不對？


    松井：嗯，可能跟職位不同有關。我剛進入無印良品時，最初的任务是建立人力資源管理制度、自行招募員工、計算薪資、成立工會，而且還必須處理職位調動的业务。我努力完成了那些工作，也因此獲得升遷，擔任業務部門的部門經理。那是我第一次擔任事業部門的經理，部門底下有產品部、銷售部等，有八成員工都隸屬於業務部門。


    我在西友任職的時期，其實有三年的賣場經驗，所以大致上懂一點銷售。但是我完全不懂產品部跟品管部等領域的東西，雖然不懂，也不能就放著不管。所以我首先掌控了四位關鍵人物，他們分別是負責關東跟關西的兩位銷售經理、產品經理，以及統籌整體的事業部課長。然後，再往下延伸，經理掌控底下的課長，課長再往下掌控底下的店長。因爲一個人要掌握全部實在是種不可能。


    木村：松井先生在擔任業務部門經理時，來不及從零開始學習產品部跟品管部的知識，所以必須集結有能力的人，建立團隊。用得上的人才就盡量用，想辦法做出成果。想請問松井先生是如何「馴服」那四位主管，讓他們按照你的意思行動呢？


    ## 蒐集現場意見時的副作用


    松井：自己有辦法掌握的範圍，大約是七到十人。如果可以掌握到十人的話，有事情的時候就直接找那十個人就好。如果那十個人底下還有十人單位的組織，全部就是百人規模的組織。如果往下還有十人單位，就是千人規模的組織。公司就是以這樣的方式在管理。中國的騎兵隊，大多也是用這種方式管理。不這麼做的話，是無法管理好公司的。


    我也是在擔任無印良品的事業部經理時才發現，經營者沒辦法掌握所有的事情。如果銷售部經理有兩位，分別負責關東跟關西的話，就個別跟他們吃飯喝酒、直接溝通交流。然後，那兩位銷售部經理再跟底下的課長溝通交流。像那樣，只要掌握好兩位經理，大致上便能掌握銷售部門。直接跟課長溝通交流，當然也是可以。可是到了店長等級，便難以一人就掌握全部。而且，一旦脫離了指揮命令系統，更無法完全掌控。


    最糟糕的是，老闆直接跑去店裡蒐集現場人員的意見，然後帶著第一手資訊回總公司，直接對董事或經理下指示。而董事或經理有可能會覺得有人向老闆打小報告，便會把犯人揪出來後，在工作上處處為難對方，那樣的副作用時常可見。


    木村：也就是說，不允許有人越過自己，直接向老闆打小報告。


    松井：季節集團的創辦人堤清二也曾經做過同樣的事情。各董事在董事會上報告時雖然沒有說謊，但講的內容好像跟實際情況有落差。但那也是沒辦法的事，因爲大家都想保護自己。堤先生的個性十分謹慎，所以他找出各家店鋪年輕、有活力且優秀的主任，找到機會就直接跟他們溝通交流。如此一來，就會產生現場問到的資訊，跟董事會上大家報告的內容有出入的現象。堤先生是公司的老闆，脾氣也比較不好，所以在董事會上狠狼斥責了大家一頓。被罵的人就循著堤先生的足跡，找出提供資訊的主任，那個人後來被修理得很慘。我在無印良品直接聽取店長的意見，對其他主管下指令時，也發生過同樣的事情。


    所以我發現，想要獲取現場第一手資訊的話，從特定人物身上汲取的方法是不行的。特別是要求業務部門蒐集現場資訊時，往往無法聽到第一線人員真正的意見。回報告的資訊都是篩選過的內容，大家的報告聽起來就是聽從指示、執行工作而已。所以，上頭的人無法完全掌握現場的狀況。


    實在是沒辦法，我只好利用每天都會到店鋪訪查的組織「稽查室」。這個組織的人員除了原本的督導工作之外，還必須負責到現場拍照，確認現場人員如何執行業務部門下达的指示等業務。每次確認的內容都不同，例如，想確認現場擺放商品的有效期限時，因爲透過現場人員的回報無法了解實際情況，所以會請稽查室的人員確認再回報。後來我便將制度改爲，請稽查室的人於每週一的十二點半回報確認結果。如此一來，現場資訊的蒐集並非透過個人，而是組織，銷售部門也就無法針對個人找碴了。


    木村：原來如此。某間公司的經理將提供資訊的員工稱爲「間諜」，也就是說，有別於官方的正式組織，在公司內部建立屬於自己的網絡關係。那位主管的意思是，因爲上頭的人無法每天走訪現場，所以擁有可以掌握現場的情資網相當重要。


    松井：個人的資訊取得管道，總有一天會曝光。職位爬得越高，下頭的線民也越容易曝光。如此一來，就會發生堤先生跟我在初期蒐集資訊時同樣的狀況，讓提供資訊的人被刁難找碴。


    本村：因爲提供資訊者的身分曝光了。


    松井：一定會曝光。所以我才會選擇官方正式的組織，讓「稽查室」這個官方組織走訪現場，而不是利用自己的情報網絡。而且，稽查室是以提供店長意見、商量煩腦的角色採訪，而不是以「奉命行事」的態度去找碴。如此一來，原本討人厭的稽查室，反而變成備受信賴的組織。而且報告的時候，銷售經理等主管也會同桌。也就是說，藉由利害關係人同席溝通，減少資訊提供人做事後追究的情況發生。公司最大的目的是改善現場的運作，所以讓利益互斥的人站在同一個地方的話，即便表面上關係對立，最終利害關係仍會逐漸趨向一致。如果有辦法讓大家團結一致，提升公司整體能力的話，就能減少內部彼此反目成仇的情況。


    木村：聽您說起來似乎簡單，但實際做起來應該相當不容易吧。那是非常暗黑的技法。


    ## 讓標準像空氣一樣


    松井：若無法掌握現場的樣貌，經營就會出錯。所以，從過去的失敗經驗中記取教訓，建立起一套機制，這讓我雖然人在總公司，也能夠掌握第一線發生的事情。


    我之所以會認爲公司必須制定一套標準的作業流程，是因爲當時依賴直覺跟經驗的職場文化蔓延。隔天早上十點有新店鋪開幕時，前一天晚上六點會到賣場進行最後確認，這樣的流程確實有建立起來。然而，前來支援的老鳥店長卻按照自己的方式調整賣場的擺設。每個來現場幫忙的人，都按照自己的方式改變擺設，如此一來根本沒完沒了，賣場的擺設永遠弄不好。原因是源自經驗主義，一百位店長就有一百種賣場的布置方法，但那樣的做法並不好。爲了讓無論是誰來做，都可以做出同樣的結果，公司便編輯了『MUIGRAM』標準作業手冊。


    然而，一旦編纂出標準作業手冊，組織就會僵化，員工變成一個口令一個動作、被動執行指令的機器人。這個做法很快面臨到，工作內容變化快速，但標準作業手冊卻未與時俱進的問題。所以我便向思夢樂的藤原秀次郎討教學習，發現他們的標準作業手冊會不斷編修。標準作業手冊不是編撰完成後就結束了，而是要不斷更新編修，當我了解到這點之後，便依據現場人員的智慧跟客人的意見修改手冊內容，建立起定期更新手冊內容的機制。


    木村：關於工作從製作標準作業手冊開始的概念，您在著作《無印良品成功九○％靠制度》當中也有提到。


    松井：但更新了標準作業手冊的內容之後，如果現場未能百分之百執行的話，更新就沒有意義。在一般的組織，下達指令後，大約七、八成的店長會確實執行，但是剩下兩、三成的店長則不會執行。如果無法讓這兩、三成的店長確實執行的話，便無法提升公司的營運能力。


    那麼該怎麼做呢？這個時候不是依據標準作業手冊按表操課，只要讓手冊如空氣般，

    '
  mdcn: '

    因爲換掉服飾用品的部門經理也沒有效果，所以這次大家覺得必須換掉採購企劃，而且出身西友的人實在無法改善業績，便決定對外招募。然而，外部招募進來的人，竟然跟廠商收取回扣。原本公司沒有的外來文化，造成內部混亂。結果證明了，只要換掉某個人的想法，是極爲短視的對策。


    例如，在我擔任事業部的部門經理時，向業務部課長問道：「爲什麼這間店的業績不好？」對方回答：「那是人禍，因爲店長沒能力。」這個回答就讓我也束手無策。在正面迎接優衣庫跟宜得利的挑戰之際，僅憑店長的力量一決勝負的想法，才是真正的人禍根源。想憑藉店長的力量贏得勝利是不可能的。雖然店長可能占整體力量的二、三％，但是在必須集結製造力、銷售力、企業文化、執行力等總體戰上，不可能僅憑店長一人之力就能決定勝負。


    木村：所以必須運用組織整體的力量迎接挑戰。


    松井：無印良品誕生於一九八○年，是走在流行尖端的品牌。無印良品是由季節集團的堤清二、田中一光以及小池一平代表日本的創意大師所創立。成立當時的理念相當創新，使得無印連續十年不斷成長。然而，組織卻沒有跟著成長，自傲自滿、前例主義蔓延，改革的思維只停留在換人來做，因此推出的商品漸漸失去客戶的心。無印不再走在尖端，而是在後頭追趕。只是，無印的商品種類變多了。無印以網羅兩房一廳、三房一廳住宅的生活用品為概念，開始生產家電、西裝、女用內衣等，商品包羅萬象。但全都是在人家後頭苦苦追趕，這成了致命傷。


    ## 快速擴大規模帶來的反效果


    松井：再來就是經營策略也出了問題。當時採取了快速擴大規模的策略，但其實際經營上最難的就是進攻。


    二〇〇〇年時店面積增加了四〇％，一般增加的比例大約為四、五％。無論是無印良品，還是優衣庫、宜得利、思樂樂等同業，大家就像說好似的，新店鋪的比例只占總面積的四、五％，這是一般的巡航速度。但無印良品卻以十倍的速度展店。過去大型店鋪的面積只有五百坪，當時卻一口氣擴大到千坪。千坪店鋪的銷售計畫，必須達到年間七億元以上的營業額，但商品卻沒有足夠的吸引力。因為展店的方式相當拙劣，使得七億的銷售目標，只賣出三億左右。會出現千坪的店鋪，是因為站前的丸井百貨在搬遷、擴大營業面積的過程中，多出空店面。幾乎沒有品牌有能力租借千坪店面，所以丸井就跑來找當時最潮的無印良品洽談。結果，營業額卻只有三億元，嚴重虧損。


    另一個錯誤就是，對加盟店採取放羊吃草的政策。如果商品開發的背後沒有足夠的銷售能力，也只是空談。沒有銷售，就做不成生意。所以必須展店，擴大規模。無印良品在創立當時沒有什麼資金，所以是靠加盟店打下江山，鞏固了事業版圖。


    然而，當加盟店成長到某種程度之後，就會逐漸不受控制。例如，過季出清之類的商品獲利低，所以不願意進貨。如此一來，自有品牌專業零售商的命脈「庫存管理」，就必須由直營店負責。因為負擔過度沉重，公司便將展店策略從加盟店，切換到以直營店、大型店鋪爲主去展店。在加盟店的附近也開設了新店鋪，結果造成同品牌之間自家互打的問題。我擔任社長的時候，正值公司內部風暴來臨之際。


    背後都是有原因的，因爲當時無印良品的母集團季節集團面臨解體危機，其手中握有的最後資金來源，就是全家便利商店跟無印的股份。後來全家便利商店順利賣給了伊藤忠商社，而無印的股份則是賣給一般投資人。因此，無印不得不採取提高股價的策略，所以才會大量展店。爲提高獲利，不處分不良存貨。到最後，紙包不住火，終於從二○○○年獲利開始逐漸衰退。


    這些是造成業績衰退的內部因素。公司開始走下坡的時候，內部體制的敗壞通常是最 大的原因。過去以展店提高營業額，帶動商品的開發，但這個方法在開設千坪店鋪時到達了臨界點。在那之後，銷售再也無法帶動新商品的開發，因爲公司既沒有能力，也
    失了創意。


    ## 推卸責任的下場就是蓋不完的章


    本村：本書的主要討論對象是又久又大的公司，也就是患有大頭症的企业。而那樣的症狀，明顯反映在員工的時間管理上。處理公司內部事務的時間比例越來越高，也可以說有許多時間是花在辦公室政治上吧。


    松井：沒有錯。正因爲自傲跟自滿，使大家討論的內容越來越封閉，不再看外頭的世界。不把眼光放在外頭世界的公司是不行的。


    木村：結果會發生什麼事呢？當公司業績衰退的時候，便會引發部門之間彼此卸責的鬥爭，「問題是其他部門造成的。不是我們，都是誰誰誰的錯。」


    松井：就像你說的，互推責任的結果，簽核必須蓋一堆章。我在西友時曾經待過人力資源部，在規畫人才培訓計畫的時候，必須事前跟常務董事、專務董事、相關部門的全體董事說明。董事會上也只是形式上的討論，當場不會做出任何決定。


    無印良品剛開始時也會做事前疏通。但如此一來，工作就容易受到公司內部的政治角力影響。所以我禁止所有的事前疏通，有什麼事情就拿到會議上光明正大的討論。一旦進行事前疏通，在會議上提出時，事情其實都已經決定好了，事務局便能安心聽取報告。如果沒有事前疏通，會議上有可能會遭受反對。因此在明哲保身的思維下，大家自然會進行事前疏通。事前疏通的風氣最盛行於公務體系，其次是金融機構等歷史悠久的企業。


    木村：如此一來，大家都害怕失敗，沒有人願意承擔風險。特別是經理、課長等主管，模糊責任歸屬的弊病多。


    松井：大家都是上班族，不喜歡惹上頭的人生氣，畢竟會影響到升遷。但如果是這樣的話，就會變成看上頭的臉色做事。所以我的第二本書《無印良品培育人才祕笈》的副標題就是「乖乖牌上班族會毀掉公司」。過去無印的企業文化就是善於事前疏通、懂得看上司臉色行動、企畫書寫得漂亮的人升遷機會多。不改變那種職場文化，就無法成為體制健全的公司。


    木村：我則是用另一個說法：「把時間花在底下的人身上。」不要把時間花在看上頭的臉色，而是要花時間在部屬身上。


    ## 行動不變，思維就不會變


    松井：我任職於西友的時期是負責教育訓練，在創立二十週年跟二十五週年時，分別提出了行動二十跟行動二十五。每個人都知道綜合百貨公司的經營型態正面臨危機，必須尋求突破。該怎麼尋求突破呢？大家第一個想到的是必須改變思維。而改變思維是人力資源管理部門負責的範圍，所以這份工作就落到我頭上。


    當時經理等級以上的主管有三百人，我採取了開發自美國的「敏感度訓練」方法，爲這些主管舉辦了難度相當高的思維改革研習營。然而，大家並沒有因爲這個研習營而改變想法。因爲思維是來自公司根深柢固的價值觀，想改變這個價值觀需要相當大的能量。從結論來說，不改變行動，就無法改變思維。不是改變思維，所以行動改變了，而是改變行動，所以思維改變。這個順序顛倒的話便行不通。


    行動只能從日常中的政策改變。藉由日常工作的政策去改變行動，等大家逐漸接受那些政策之後，思維才會發生變化。所以，思維改革運動一開始都不會成功。當時，西友的問題便是出在一開始就推動思維改革運動。我因爲在最前線，受委託執行改革，所以非常清楚這樣做是不通的。


    綜合百貨公司之所以經營不振，是因爲支撐著百貨公司的中央集權管理、大量進貨大量銷售、一站式購物服務、自助式銷售等商業模式，逐漸崩解所致。如果不對症下藥，是無法脫離困境的。但當時卻沒有任何人著手商業模式的改革，所以西友的業績遲遲不見好轉。


    木村：另外，我認爲個人的誘因源自於何處，也是其中重要因素。就像剛才提到的升遷競爭，大部分上班族努力工作動機之一，應該也是因爲想要往上爬吧。


    松井：對對對，想讓生活變得更好。


    木村：但像松井先生，您雖然是上班族社長，卻成功推動了改革，完全是反例。您應該對升官發財沒有太多欲望吧？


    ## 越難搞的人在緊急時刻越有用


    松井：對啊。想要往上爬，某些時候就必須違背自己的信念。也就是說，當你向各部門事前疏通，看大家臉色做事而獲得升遷的時候，可能會發生某一天被商品部門的事務叫去，請你把最好的人才安排到他部門之類的事情。無法公平分配公司的資源，行動終究會偏向局部最佳化。因爲你不那樣做的話，便無法在公司裡生存。


    獲得升遷、調薪，想過好生活的人占大多數。採取跟大家一樣的做法比較安全，所以向各部門事前疏通，以討高層次人爲行動準則的人非常多。這樣的人是多數，因此便容易成群結黨。不只是會議上，就連吃飯喝酒也是集體行動。然後，經理說什麼就做什麼。我非常討厭那種價值觀，所以別人找我去吃飯喝酒，我全部都拒絕。當然也被認爲是難搞的人。


    因爲我在公司不是多數主流，所以一直待在人力資源部。四處露臉、八面玲瓏，討高層歡心的人能獲得升遷的公司，一定哪裡有問題。就像是西鄉隆盛所說，不要錢、不要名，而且不要命的人最難搞。因爲那種人擁有自己的一套人生哲學，而那非常重要。


    木村：我認爲，自己想獲得什麼、成爲什麼的價值觀，才是真正的慾望。


    松井：所以，最大的問題出在人生態度。不計得失，跟阿諛奉承扯不上關係的人，才有辦法持續堅持信念。過去我因爲想成爲教師，而進入大學。但因爲參加全學運的學運抗議游行時被逮捕，在警察局的拘留室待了三週，我二十歲的生日也是在那邊度過。我從以前就非常討厭對威權低頭、唯唯諾諾，不敢抵抗的制度。雖然被逮捕對父母很不孝，最後更是不得不放棄成爲教師，這失敗是非常大的致命傷。


    後來不得已，只好進人民間企業工作，但是在那邊，我也是不喜歡一個命令一個動作。應該採取行動而不去做的話，我就覺得難受。在上頭的人眼中，我是個難纏的傢伙，所以被派到無印良品。東證一部上市公司的課長，被調派到無印良品的子公司卻還是課長，一般來說至少也要是部長級。我很明顯是被左遷，但也是無可奈何。不過，多虧了左遷，讓我看盡了各種職場的腐敗。


    剛才談到推諉責任，但職位調動，是自己無法做決定的。雖然這麼說，但覺得自己沒有獲得公司公正的評價，所以才被迫降職而心有不滿的人，最後也是看不到這些人的身影。所以我很清楚，把問題都推給別人的想法，理論上是不可行的。還有一點就是，我非常討厭不好好分內工作。因此，即便待遇多差，在被左遷、轉調到無印良品之後，我也勇於背負風險，對每項工作盡心盡力。


    我是在良品計畫創立之初被派過去的，也就是說，當時公司的營運狀況是虧損的，所以對公司沒幫助的人難以立足，非常現實。公司沒有餘裕聘請做不出實績的人。我當時職務轉調的獎金為十四萬元，而隔年就要我擔任部門經理，再隔年則是董事。


    木村：您不到三年就從課長、部門經理，一路升到董事。


    松井：當然也有其他狀況。例如，有一個人從母公司被派赴來擔任總務的職位，我跟他說：「店裡有很多老鼠，請防治業者來消毒防治。」對方回答：「不好意思，要做老鼠防治，必須經過維修部門、行政部門跟總務部門。」總務必須聯絡防治業者，也必須跟房東溝通交涉。如果建築設施有孔洞的話，就必須請維修部門補洞。而建築設施則是由行政部門管理。西友的總務約有六個部門，只是簡單的老鼠防治就必須勞動到三個部門。剛分割出去成為子公司的無印良品，人手嚴重不足由此可見。


    負責行銷宣傳的人也一樣。JR原宿車站軌道兩側的廣告立牌非常醒目，所以我們簽下了一年的合約，每個月更換廣告內容。我問行銷宣傳的負責人：「看板什麼時候做好？」對方回答：「下週就會弄好。」但是過了一週、兩週，廣告都還沒登上去。雖然負責人說：「已經指示廣告代理商了。」但廣告宣傳的看板依舊空蕩，這樣稱不上是有在工作。


    因爲母公司是季節集團，刊登廣告當然是透過大型廣告代理商。大家都把那種工作交代給下頭的承包商的。如果負責人有交代好的話，自然沒問題。問題就是沒有交代好，所以廣告看板一直沒有刊登出來。但負責人卻說：「我有做好分內的工作。」如果是在西方的話，他可能已經算做好分內工作了。但是對在資金拮據的情況下，仍撥出行銷預算的無印良品而言，說下週要刊出，下週就一定要刊登出來。即便那中間必須跟很多間廠商協調，也必須在一週後確實讓廣告上去。


    本村：也就是說，小公司工作的方式跟上市公司不同。


    松井：但那種人最容易被派赴或轉調。如此一來，從經營者的角度來看，無論是總務負責人還是行銷負責人，基本上都沒有發揮功效。而我不是那樣。雖然我在西友任職時，被認為是不聽話的人，但是來到無印良品之後，別人叫我做什麼，我就盡力完成，成果有目共睹。如此一來，工作便獲得相當高的評價，結果就是快速升遷。成熟的企業跟還有許多發展空間的企業，兩者之間果然有許多不一樣的地方。


    本村：想要做些什麼的時候，因為部門之間的互不侵犯條約發生作用，使大家在權限範圍之外的事便不插嘴干涉，這種情況經常可以在大企業裡看到。但是否有人能打破這樣的潛規則，敢於冒險進取呢？


    ## 關鍵在於能做出成果的人


    松井：對公司而言，最重要的就是擁有能做出成果的人才。若非如此，公司便無法營運。想要做出成果，就必須承擔責任，堅持做到最後。如果連這樣都做不到，是不可能做出成果的。但就像剛才說的，在大企業的體制裡，「我的工作只負責到這裡」，是普遍的工作態度。即便如此，如果公司的體制是有能力、做出成果的人可以往上爬的，那沒什麼大問題。如果連這種制度都沒有的話，公司就會逐漸衰敗、無法振作。


    木村：松井先生在成為社長之前所看到的公司樣貌，跟成為社長之後看到的公司樣貌，不一樣對不對？


    松井：嗯，可能跟職位不同有關。我剛進入無印良品時，最初的任务是建立人力資源管理制度、自行招募員工、計算薪資、成立工會，而且還必須處理職位調動的业务。我努力完成了那些工作，也因此獲得升遷，擔任業務部門的部門經理。那是我第一次擔任事業部門的經理，部門底下有產品部、銷售部等，有八成員工都隸屬於業務部門。


    我在西友任職的時期，其實有三年的賣場經驗，所以大致上懂一點銷售。但是我完全不懂產品部跟品管部等領域的東西，雖然不懂，也不能就放著不管。所以我首先掌控了四位關鍵人物，他們分別是負責關東跟關西的兩位銷售經理、產品經理，以及統籌整體的事業部課長。然後，再往下延伸，經理掌控底下的課長，課長再往下掌控底下的店長。因爲一個人要掌握全部實在是種不可能。


    木村：松井先生在擔任業務部門經理時，來不及從零開始學習產品部跟品管部的知識，所以必須集結有能力的人，建立團隊。用得上的人才就盡量用，想辦法做出成果。想請問松井先生是如何「馴服」那四位主管，讓他們按照你的意思行動呢？


    ## 蒐集現場意見時的副作用


    松井：自己有辦法掌握的範圍，大約是七到十人。如果可以掌握到十人的話，有事情的時候就直接找那十個人就好。如果那十個人底下還有十人單位的組織，全部就是百人規模的組織。如果往下還有十人單位，就是千人規模的組織。公司就是以這樣的方式在管理。中國的騎兵隊，大多也是用這種方式管理。不這麼做的話，是無法管理好公司的。


    我也是在擔任無印良品的事業部經理時才發現，經營者沒辦法掌握所有的事情。如果銷售部經理有兩位，分別負責關東跟關西的話，就個別跟他們吃飯喝酒、直接溝通交流。然後，那兩位銷售部經理再跟底下的課長溝通交流。像那樣，只要掌握好兩位經理，大致上便能掌握銷售部門。直接跟課長溝通交流，當然也是可以。可是到了店長等級，便難以一人就掌握全部。而且，一旦脫離了指揮命令系統，更無法完全掌控。


    最糟糕的是，老闆直接跑去店裡蒐集現場人員的意見，然後帶著第一手資訊回總公司，直接對董事或經理下指示。而董事或經理有可能會覺得有人向老闆打小報告，便會把犯人揪出來後，在工作上處處為難對方，那樣的副作用時常可見。


    木村：也就是說，不允許有人越過自己，直接向老闆打小報告。


    松井：季節集團的創辦人堤清二也曾經做過同樣的事情。各董事在董事會上報告時雖然沒有說謊，但講的內容好像跟實際情況有落差。但那也是沒辦法的事，因爲大家都想保護自己。堤先生的個性十分謹慎，所以他找出各家店鋪年輕、有活力且優秀的主任，找到機會就直接跟他們溝通交流。如此一來，就會產生現場問到的資訊，跟董事會上大家報告的內容有出入的現象。堤先生是公司的老闆，脾氣也比較不好，所以在董事會上狠狼斥責了大家一頓。被罵的人就循著堤先生的足跡，找出提供資訊的主任，那個人後來被修理得很慘。我在無印良品直接聽取店長的意見，對其他主管下指令時，也發生過同樣的事情。


    所以我發現，想要獲取現場第一手資訊的話，從特定人物身上汲取的方法是不行的。特別是要求業務部門蒐集現場資訊時，往往無法聽到第一線人員真正的意見。回報告的資訊都是篩選過的內容，大家的報告聽起來就是聽從指示、執行工作而已。所以，上頭的人無法完全掌握現場的狀況。


    實在是沒辦法，我只好利用每天都會到店鋪訪查的組織「稽查室」。這個組織的人員除了原本的督導工作之外，還必須負責到現場拍照，確認現場人員如何執行業務部門下达的指示等業務。每次確認的內容都不同，例如，想確認現場擺放商品的有效期限時，因爲透過現場人員的回報無法了解實際情況，所以會請稽查室的人員確認再回報。後來我便將制度改爲，請稽查室的人於每週一的十二點半回報確認結果。如此一來，現場資訊的蒐集並非透過個人，而是組織，銷售部門也就無法針對個人找碴了。


    木村：原來如此。某間公司的經理將提供資訊的員工稱爲「間諜」，也就是說，有別於官方的正式組織，在公司內部建立屬於自己的網絡關係。那位主管的意思是，因爲上頭的人無法每天走訪現場，所以擁有可以掌握現場的情資網相當重要。


    松井：個人的資訊取得管道，總有一天會曝光。職位爬得越高，下頭的線民也越容易曝光。如此一來，就會發生堤先生跟我在初期蒐集資訊時同樣的狀況，讓提供資訊的人被刁難找碴。


    本村：因爲提供資訊者的身分曝光了。


    松井：一定會曝光。所以我才會選擇官方正式的組織，讓「稽查室」這個官方組織走訪現場，而不是利用自己的情報網絡。而且，稽查室是以提供店長意見、商量煩腦的角色採訪，而不是以「奉命行事」的態度去找碴。如此一來，原本討人厭的稽查室，反而變成備受信賴的組織。而且報告的時候，銷售經理等主管也會同桌。也就是說，藉由利害關係人同席溝通，減少資訊提供人做事後追究的情況發生。公司最大的目的是改善現場的運作，所以讓利益互斥的人站在同一個地方的話，即便表面上關係對立，最終利害關係仍會逐漸趨向一致。如果有辦法讓大家團結一致，提升公司整體能力的話，就能減少內部彼此反目成仇的情況。


    木村：聽您說起來似乎簡單，但實際做起來應該相當不容易吧。那是非常暗黑的技法。


    ## 讓標準像空氣一樣


    松井：若無法掌握現場的樣貌，經營就會出錯。所以，從過去的失敗經驗中記取教訓，建立起一套機制，這讓我雖然人在總公司，也能夠掌握第一線發生的事情。


    我之所以會認爲公司必須制定一套標準的作業流程，是因爲當時依賴直覺跟經驗的職場文化蔓延。隔天早上十點有新店鋪開幕時，前一天晚上六點會到賣場進行最後確認，這樣的流程確實有建立起來。然而，前來支援的老鳥店長卻按照自己的方式調整賣場的擺設。每個來現場幫忙的人，都按照自己的方式改變擺設，如此一來根本沒完沒了，賣場的擺設永遠弄不好。原因是源自經驗主義，一百位店長就有一百種賣場的布置方法，但那樣的做法並不好。爲了讓無論是誰來做，都可以做出同樣的結果，公司便編輯了『MUIGRAM』標準作業手冊。


    然而，一旦編纂出標準作業手冊，組織就會僵化，員工變成一個口令一個動作、被動執行指令的機器人。這個做法很快面臨到，工作內容變化快速，但標準作業手冊卻未與時俱進的問題。所以我便向思夢樂的藤原秀次郎討教學習，發現他們的標準作業手冊會不斷編修。標準作業手冊不是編撰完成後就結束了，而是要不斷更新編修，當我了解到這點之後，便依據現場人員的智慧跟客人的意見修改手冊內容，建立起定期更新手冊內容的機制。


    木村：關於工作從製作標準作業手冊開始的概念，您在著作《無印良品成功九○％靠制度》當中也有提到。


    松井：但更新了標準作業手冊的內容之後，如果現場未能百分之百執行的話，更新就沒有意義。在一般的組織，下達指令後，大約七、八成的店長會確實執行，但是剩下兩、三成的店長則不會執行。如果無法讓這兩、三成的店長確實執行的話，便無法提升公司的營運能力。


    那麼該怎麼做呢？這個時候不是依據標準作業手冊按表操課，只要讓手冊如空氣般，

