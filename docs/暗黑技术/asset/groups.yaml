    # 什麼才是明日領袖的需求？


    我經常為大企業舉辦領導培訓營，學員涵蓋董事到課長階層。這邊所指的大企業是指又久又大的公司；歷史悠久且組織龐大，自很久以前就開始從創立公司的「所有者管理模式」，轉型為選賢舉能的「上班族管理模式」的企業。


    因為是知名企業的未來領袖培訓營，所以經常邀請聲望很高的企業經營者為大家演講。但是對來聆聽的學員而言，台上頂尖領導者的演講內容，好像跟台下的自己沒什麼關係。「演講的內容非常精彩，但是遠在天邊遙不可及，不是要緊、迫切的課題。」這是我經常聽到的學員感想。


    因此，我不斷思考，什麼樣的主題才符合這些明日領袖的需求，最後得到的結果就是暗黑技術。本書之所以以主管為對象，正是因為夾在老闆跟實際工作現場之間的中間管理者，才是改革的關鍵。'
  - '[PAGE 17]


    你是增加公司利潤的勝利組，還是在低利潤中掙扎的失敗組？


    一覽前幾大企業的業績變化，便可發現自一九八〇年之後，各大企業的營業額不斷增加，但是獲利能力、也就是「賺錢能力」，卻不斷衰退。


    但一九頁這份資料的數據只更新到二〇一二年，問題便是在那之後。日本在政權轉移到安倍內閣，安倍經濟學政策開始實施之後，部分如日立、索尼跟松下電器等公司，徹底改革事業結構，利潤立即有了顯著的改善。


    而另一方面，雖然有部分是像夏普等必須緊急熱車、動手術的公司；但真的情況非常危急，必須緊急開刀動手術的急症公司，其實並沒有那麼多。雖然放著不管，總有一天會危及性命，但大部分的公司現階段症狀並不明顯，就像是生活習慣病的慢性疾病一樣，只是微微的影響著健康。


    二〇〇八年雷曼兄弟破產引發的全球金融海嘯、二〇一一年日本三一一大地震等外部環境急遽惡化，再加上公司治理守則的導入，強化了經營管理的監督功能，每間公


    017


    序章 「光明技術」無法生存的時代'
  - '[PAGE 18]


    司都想盡辦法，著手開發原本相當棘手、不熟悉的事業、產品功能、市場跟產品線等。例如，早期的綜合電器製造商，將電視視部门的生產模式，轉變為垂直整合模式；藉由數位化跟商品化，針對容易陷入價格競爭的B2C
    (Business to Consumer，指企業直接提供消費者商品或服務的經營模式) 事業，實施合縱連橫的策略等，都是典型的例子。像這樣，將結構改革的成果，投資到主力事業上，使公司持續成長爲主要的目的。


    # 不好也不壞的中庸事業群，才是公司的絆腳石


    假如我們算出事業群的利潤平均值跟標準差，畫出常態分布曲線，現在有問題的既不是右側的高收益事業群，也不是左側的低收益事業群，而是被夾在中間、獲利能力中庸的事業群。


    這還爲方便說明，全部都用「事業」來指稱。事業是指管理會計上的收益單位，如果是綜合型企業的話，事業就有可能是指事業單位；如果是單一事業體的話，事業便爲地區單位，視情況也可以視作顧客或產品單位。不管怎樣，中庸事業群不是核心事'
  - '[PAGE 19]


    # 圖 1 日本主要企業的業績變化


    ![](img/c5f4a27546ec03b05790e1504b0b945b_19_0.png)


    資料出處：參考各家公司公開資料製圖'
  - '[PAGE 20]


    業，也不是必須馬上展開改革的垂死事業，企業中有非常多這種半調子的事業。


    大企業裡有許多營業額約數億到數十億，最多少超過六十億元，底下員工人數從數十人到五百人程度的中庸事業群。業績好的時候，也只能賺進數億元的利潤；業績不好的話則有可能虧損。這個中庸事業即是問題的癥結，能否徹頭徹底改革中庸事業的結構，決定了企業的命運。是踏上上升氣流谷底翻身呢？還是持續低收益的事業結構，如慢性病一樣任由時間流逝而消失？光明或黑暗的道路一分爲二。


    但這並不是說應該要裁撤所有這樣的事業。即便是中庸事業，卻擁有對核心事業而言不可或缺的关键技術，而且應該也有能夠和其他公司組成聯盟，擴大規模的事業。也就是說，管理者必須果斷的決定對策；決定擴大事業的話就好擴展，決定合併的話就好併購。


    最糟糕的就是什麼都不做，放著不管。中庸事業每年都沒有嚴重虧損，或多或少能有些盈利，對公司而言沒有一擊斃命的影響力，因此問題自然不會浮現。如果不採取任何措施的話，問題永遠不會消失。那樣的結果就是，規模越大的公司，中庸事業越是滿坑滿谷，並造成低收益的主因。如果問題很明顯，公司當然不得不著手對策，但問題就是收益不好也不壞，即便盈利或虧損，也不是什麼大不了的金額，因此實在沒有積極'
  - '[PAGE 21]


    解決問題的動機。


    通常，大企業在公布財報時，各事業群會分開公布，但問題就在於，大部分的中庸事業群會被分類到「其他」的類別。例如，零組件公司的財務報表中，有用車零組件、工業機器零組件等主要事業群，但唯獨中庸事業被悄悄歸類到「其他」，這就是問題所在。正因爲被分類到「其他」，所以不引人注意，優先順序也因此被排到後面。


    然而，即便核心事業的營業利益高達百億元，若其他零碎的事業分別有數十億虧損的話，最後正負相互抵消，結果公司整體營業利益率算下來少得可憐。所以，解決中庸事業的問題，是改善公司經營的重要因素之一。


    # 想改變事業結構不該從變動成本下手


    當公司遇到營業收益低的情況，另一個常見的做法就是，像擦抹布一樣，從各個地方削減成本，而最好下手的就是削減管銷費用。例如：減少出差次數、削減無急迫需求的經費等。但那些削減成本的方式效果有限，因此想一口氣降低成本，首當其衝、最容'
  - '[PAGE 22]


    易被開刀削減經費的，就是研發部門。雖然核心事業當前的產品開發，以及稍微眼光長遠的高階技術研發等經費會被保留，但緊急度越低的投資，越容易被延遲擱置，例如：須花費十年才能見到成果的基礎研究，以及與現在核心事業無關的new技術等研究開發。


    下一個容易被拿來開刀的，是人才培育經費。因爲人才培育，基本上也是非急需的需求，容易成爲拿來削減經費的對象。


    然而，研發部門跟人才培育，都是幫公司生金蛋的金雞母。削減未來的重要投資，也就是在摘掉未來搖錢樹的樹苗。將節省下來的經費補貼公司的現金流量，從中長期的角度來看效果無法持續。


    從別的角度來看，研發跟人才培育的投資經費，某種程度上是屬於「變動費用」，因此刪減了那些投資經費，事業結構本身其實沒有任何改變。想要改革事業結構的根本，強化賺錢能力的話，如果不從固定費用下手，恐怕沒有效果。但是，一旦要對固定費用開刀的話，大家就容易聯想到營運據點的整編、事業的重整、相關人員裁撤等，因此會盡量閃避這樣的問題。所以大多是不會有反對意見的變動費用開始刪減，藉此度過難關。但一旦減少對未來的投資，公司便會陷入中長期競爭力落後的惡性循環。


