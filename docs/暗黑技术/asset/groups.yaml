    告：「其實我的部門有這樣的問題」，「那個部門在討論這樣的事情」，你就會成為對方情報網的一部分。


    在公司裡能夠建立怎樣的內部網絡關係，自己能否成為經營者重要情報網交觸之一，需要的，正是高超的暗黑技術。情報網不僅僅只是公司內的人脈，而是遍布、深植組織各角落，有緊急狀況發生時能動員公司、讓上下團結一致，關係緊密的情報網。


    # 狠角色每天跟不同人吃午餐


    網絡關係會越用越廣，同樣的道理，經常跟他人交換資訊，彼此的關係就會越來越牢固。一起去吃午餐、偶爾吃飯喝酒，都是擴展關係的好機會。


    跟不會喝酒，或是重視私人時間的屬屬一起用午餐，應該是個好選擇，因為總可能不吃午饭。藉著跟情報網的資訊提供者定期一起吃午餐：「話說，那件事情後來怎麼樣了？」隨時更新資訊，一旦遇到緊急狀況就能派上用場。


    在員工餐廳吃飯時，大部分人都固定跟同部門的同事一起吃飯，但是狠角色則會'
  - '[PAGE 85]


