    # 成功引導老闆裁員的經理


    這邊我無法透露對方的名字，但某間當時搖搖欲墜的公司，有位經營企畫部門的經理，成功利用了上層進行改革。經營團隊的立場是希望盡量避免裁員：「能否盡量不進行人事重整，想辦法讓公司熬過去呢？」他們向我提出這樣的期望。


    但那位經營企畫部門經理對整體局勢掌握得非常清楚，自己寫了一個完整的故事，親自跟老闆促膝長談：「這樣下去公司會倒閉。」並成功說服了老闆。挑出現存僅有的選項，從中排列優先順序，如此一來就只能按照那樣的順序執行。不這樣的話，就只能等死。


    > 「即便是對自己不利的資訊，也有必要讓上層了解實際情況。」'
  - '[PAGE 51]


    那間公司有非常多位經理，但大家都是本位主義，只在乎自己的部門，覺得自己沒問題。而財務長則認爲，只要到銀行哭一下總會有辦法。就在其他主管因本位主義而忽視問題的時候，一位主管自導自演了一場激烈的打鬥，徹底改變了公司。那個人相當有能力，之後成爲了該公司的董事。


    這邊再介紹一位事業經理的故事，這是選擇在事業部門的業績表現亮眼之際裁員的案例。


    這間公司有ดี幾箇事業部，而業績最好、公司最賺錢的事業部門經理來聯絡說：「有事情想要商量。」在拜訪時，他跟我說：「雖然現在業績看起來很好，但冷靜想想，這個事業根本沒有未來。如果是這樣的話，這個部門會成爲公司的負擔，必須趁早實施對策。」因此，那位事業經理決定開響第一槍，藉由和其他公司合作，大規模的改革事業結構。在業績惡化之前，推動了具正面意義的裁員。


    從老闆的立場來看，根本不會想動公司最賺錢的金雞母。然而，公司最亮眼部門的王牌經理竟然親自來商量：「照這樣下去，事業部五年後會出大問題，應該要在還賺錢的時候果斷裁員。」老闆最後聽從了該經理的意見，決定大刀闊斧實行改革。'
  - '[PAGE 52]


    而該事業部，因為事業結構在很早的階段就進行轉型，部門因此存活了下來。而那位經理最後也成爲公司董事的一員。


    若公司現階段沒有特殊狀況，一般人根本做不到在最賺錢的時候推動事業結構的改革。而且改革的建議，並不是透過經營企劃部等其他部門傳達，而是該事業部的經理親自向老闆說明，這個策略真的是相當精準，讓人留下深刻的印象。


    # 暗黑的「協疏安」才能讓公司賺錢


    主管想好好利用經營者的話，就要巧妙運用協調、事前疏通、安排，以下簡稱「協疏安」。任何一個組織、每個人的工作都不離協疏安。


    只不過，潔身自愛的協疏安沒有意義。就跟在經營會議上被斥責：「根本就不行嘛！」馬上澄清：「老闆，那其實是……」一樣，爲了自保的協疏安孕育不出任何價值。而暗黑的協疏安才是讓公司賺錢的策略。想拿到更多客戶的訂單、增加部門的附加價值，就必須做好協疏安，讓老闆如自己的期望行動。'
  - '[PAGE 53]


    # 檯面下的議論正是推動改革的主力


    另一方面，改革派的主管大張旗鼓，在公司內部提出了許多改革專案，但老闆根本沒時間擔任所有專案的領袖，很有可能以一句「這個麻煩你執行」，就把改革案丟給經營企劃部的經理。然而，被委託的現場人員若沒有動力，根本不會有任何動作。因此經常發生看起來似乎在進行，但改革腳步卻緩慢無比的情況。特別是當改革可能會帶來各種風險時，更是如此。因為與其冒著風險，結果跌個大跤，不如做做樣子、敷衍了事，反而不會被扣分。


    經營者無法在每次的戰爭都親自上陣指揮，也沒辦法拿到所有第一手資料。重復「暗黑版的協調、事前疏通、安排是讓公司賺錢的策略。」'
  md: '

    ## 改革的最大反對勢力——現場工作人員


    層當是有辦法自己下判斷。但是，業績不高的事業跟地區，就是很難顧及到。「我有辦法完全掌握的，大概只有整體的四成到五成左右。」不少執行長都吐露這樣的心聲。


    但是，經營者即便不清楚狀況，也必須下決定。老闆的判斷依據只有間接資訊，而提供那些間接資訊的，正是主管。因此，主管是企業決策機制能否順利運作的重要關鍵。


    主管不但掌握現場，同時也握有直接跟高層溝通聯絡的管道，處於相當優越的位置，有辦法同時取得現場與經營的第一手資料。並且，能依據兩邊的第一手資料提供意見的，也只有位處中間的主管才做得到。


    老闆有辦法掌握到的第一手資料，只有整體的一半，剩下的另一半只能藉由二手資料來判斷。因此，掌握上下資訊的主管，能否提供精準的資訊，會對經營判斷帶來非常大的影響。


    ### 圖 4 複雜的協調


    - 因顧客增加、技術提升等因素，使得組織複雜化。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_29_0.png)


    - 溝通所需的時間增加，根本無法協調，再加上組織層層階級，資訊的準確度下降。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_29_1.png)


    - 負責人和部門之間相互協調，由下往上的決策模式。


    現在的一般企業，任何改革都必須經過這樣的過程：經營高層決議、達成共識後，董事會開會表決通過，最後才正式於現場實行改革。而相對的，在所有者管理的企業，「高層決議、董事會會議通過、於第一線實行」，這樣的過程可以在短時間內完成。也就是說，公司老闆都開口說了，也只能按照他的意思做。正因爲如此，所有者管理的企業改革速度才快。


    然而，即便上班族社長突然說：「公司必須改革！」就像剛才提到的，現場人員未必會聽話。如果弄巧成拙，不但可能改革不成，還引發叛變被趕下台。想要巧妙把反對的董事牽扯進來，讓改革案通過決議，最後使現場按計畫進行，必須研擬縝密的理論根據、做好事前疏通跟萬全的準備。即便決策過程順利，進入了實行階段，雖然現場不會直接否定公司的改革方針，但是維持現狀的慣性，會使現場人員態度消極、對應緩慢、花費了大量的時間推動，改革卻遲遲未有進度，這樣的狀況時有所聞。而且短時間內，負面效果大於正面效果，因此必須要有耐心，挺過執行初期的劇烈震盪。


    ## 越中庸的事業越容易逃過改革


    雖說工作現場大多會反抗改革，但真的病人膏肓的部門，對問題其實已經豎起白旗、束手無策，因此並非無法動刀。然而，在盈利跟虧損之間來回擺盪的中庸部門，即便對自己罹患的生活習慣病有病識感，卻覺得離死亡還很遠、沒有危機感，因此反抗改革，甚至很可能根本在經營者的視線範圍之外。


    從旁觀者的角度來看，讓人深感同情的是，明明公司整體的業績低迷不振，但各個部門卻「請核可這個投資案」「雖然不符合規定，但是請破例通融」，只提出對自己部門最有利的提案。雖然經營者想要的是涵蓋整體的資訊，但由於各事業都交由現場各自處理，而最清楚市場與顧客的主管，若以理論來武裝自己，保護自家部門的話，對經營者而言，因為沒有其他判斷資訊，也只能相信主管所說的話。


    姑且不論業績明顯不佳的部門，如果從整體來看，對於帳面數字沒那麼引人注目的部門，經營者也不會特地跳出來發表意見。結果就是，表現越中庸的地方，越容易逃過改革的大刀殘存下來。


    ## 需要暗黑技術的乖乖牌


    在企業經營上，有更多必須優先改革的地方。中庸事業即便不立即開刀，也不會馬上死亡。也因此，改革中庸事業的優先順序就變得越來越後面，最後拉低了公司的獲利能力。而想要把中庸事業的問題拿到桌面上討論、進行改革的話，主管是否採取行動是重要的前提條件，因爲他們握有經營者掌握不到的資訊。


    大企業最常見的升遷模式就是，把過去所謂的菁英分子，安排到主力部門或北美市場等地方累積經驗，盡量不讓他們的經歷產生污點，完美無缺、漂漂亮亮的最好。


    然而，在溫室中成長，讓經歷完美的人成爲領導人的時代已經結束。想培養有改革能力的經營高層，光只是把員工訓練成「乖乖牌」是不夠的。關鍵在於是否累積了足夠的實務經驗；能否培養廣闊的視野、累積判斷能力；能否不依靠組織職位賦予的權力，改變當面反對、靜靜反抗自己的人的想法；讓組織採取行動等。


    因此，針對未來的領導人，也就是現在的中階主管，本書彙整了和光明技術相較之下不被注意，但卻是改革成功不可或缺的因素：暗黑技術的訣竅。


    本書所說的光明技術，是指邏輯思考能力、財務與會計知識、業務行銷類的技能，也就是MBA的基礎科目，但只會這些已經不管用了。相信擁有MBA學歷的讀者，應該對光只有基礎技能，已經無法讓組織動起來的狀況有深刻的體會。


    經歷完美無缺的乖乖牌，無法痛下決心，實行會伴隨陣痛的改革。在汰舊換新的時候，碰上走歪了、遭受反對、進度延誤等情況是理所當然的。因此，領導者必須擁有促使大家採取行動的能力、影響組織的能力、掌握局勢的能力，以跨越改革的障礙。大刀闊斧的改革，需要的是暗黑技術。


    這些能力跟反應靈敏、對數字敏銳、口條好等一目了然、引人注目的能力相比，如光與影般，因此我將之稱為暗黑技術。


    ### 在溫室中成長，讓經歷完美的人成為領導人的時代已經結束


    光明技術和暗黑技術，如果用其他詞彙來說的話，例如：太陽跟月亮、光跟影、正面跟反面、平時狀態跟緊急狀態，無論欠缺哪個面向，都無法成為真正的領導者。在公司裡被稱作菁英的人之中，表面的光明技術出眾，但是卻無法掌握人心、公司內部的資訊取得能力差、受到挫折便一蹶不振的，比比皆是。那樣的人是無法貫徹改革的。


