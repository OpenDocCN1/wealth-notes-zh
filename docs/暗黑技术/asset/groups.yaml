    # 第一部


    ## 七個暗黑技術


    ![](img/c5f4a27546ec03b05790e1504b0b945b_37_0.png)


    ![](img/c5f4a27546ec03b05790e1504b0b945b_37_1.png)


    ### DARK SIDE SKILL


    第一部將為大家介紹主管必須具備的七個暗黑技術。


    - 暗黑技術一：成為檯面下的暗黑領袖。

    - 暗黑技術二：成為有話直說的白目。

    - 暗黑技術三：人脈不能只往內建，你要往外擴張。

    - 暗黑技術四：被討厭是一定的，得到尊敬就夠了。

    - 暗黑技術五：不要沉溺小欲，要胸懷大志。

    - 暗黑技術六：黑掉的勇氣。

    - 暗黑技術七：帶人不能靠頭銜，有時得懂得讓自己被利用。


    如序章所說，只有光明技術是無法在變化劇烈的時代下生存下來。希望大家除了光明技術之外，也能徹底運用本書介紹的七個暗黑技術，成為推動改革的領導人。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_39_0.png)


    #### 成爲檯面下的暗黑領袖


    ## 操縱數字交出漂亮的成績單


    如序章所說，即便是老闆，也無法完全掌握公司的所有事業。如左頁圖六，假設公司有ABCD四個事業部，而各個事業部又將市場劃分成日本、美洲、歐洲、中國和亞洲等地區。社長至少要有辦法掌握主力事業「A」跟主力市場「日本」，因此能夠獨自下判斷。然而，規模較小的非核心事業跟地區，則難以顧及。


    像這樣，經營者需要主管提供正確的資訊，以便針對無法直接掌握的事業做出正確的判斷，然而在這當中有幾個阻礙因素。


    每當到了第四季，在下個年度的預算會議上，總是會有人逞強不服輸，對年年苦於低收益的部門經理說：「下個年度一定沒問題，就快有大單進來了。」大部分B2B (Business
    to Business，指企業與企業之間直接交易的经营模式)的事業計畫，都是上半年虧損，下半年拿大單的厚尾型態居多。因此，即便大家對這種每年都會出現的搏鬥宣言感到懷疑，但面對只有事業部門的人才懂的邏輯跟細膩分析，則無力公開反駁。結果就是，因為沒有人表示反對，預算案就這樣通過了。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_41_0.png)


    ![](img/c5f4a27546ec03b05790e1504b0b945b_41_1.png)


    然而，爲了通過預算所做出來的計畫，數字跟煙火一樣漂亮，但一點也不實際，實現的可能性極低。因此，到了新年度，主管們心中便開始盤算著何時該如實招出，就此開啓了懦夫賽局（the
    game of chicken，指衝突當中雙方僵持不下的局面，選擇讓步保全性命的人會被稱作懦夫，但雙方都不讓步則會兩敗俱傷）。


    膽小的人會在下半年修正預算時，說出：「今年果然還是做不到。」而真的堅持到最後的人，則會一直拖到年度結算的前一個月，才爆出來說做不到。每年都不斷重複上演相同的戲碼。


    當預算執行的實際情況跟計畫有落差時，削減成本、拜託總部裁撤人員等作業實在太麻煩。因此，當數字不好看的時候，業績灌水是最簡單輕鬆的方法。經營者只能相信懂現場的人提供的資訊，因此掌管現場的主管只要說：「沒問題，第四季營業額會回升。」畫大餅拿預算是最容易的。但是，在毫無勝算的地方，再怎麼灌水充數，也無法達成目標。這樣的戲碼就這樣不斷重複。


    雖說數字灌太多水會做不到，但若不要求現場拉高目標的話，事業便無法成長。特別是上市公司，經營者爲保障股東權益，必須達到一定的業績目標，預算就會因此產生產限制。然而，在公司的預算及營運計畫編制過程，即便彙整了各事業部提出的預算案，也達不到整體目標的情況，本來就很常見。


    因為各事業部提出的目標保守，都是有辦法達成的數字，因此老闆會不斷要求提高目標。然而，拉高目標做過頭，就會重演東芝的「挑戰」悲劇（東芝於二〇一五年爆出財務造假的事件，事業部在強烈的目標達成壓力下灌水造假爲原因之一）。但雖說如此，也不能不要求各事業部提高目標。因此，具挑戰性的目標究竟該如何訂定，才能夠在業績成長和逼死員工之間取得平衡，這也是經營者展現實力的地方。


    而相反的，也有情況是，先訂定一個做不到的計畫，等計畫好像真的準備要無疾而終的時候，來個戲劇性的大逆轉。


    有些公司因管理會計操作的關係，有別於各事業的直接成本，間接部門成本的管理費用會依據各事業部的業績跟盈利用分配。因此，提出數字漂亮的計畫，部門就會被分配到豐厚的管理費用。所以才會有多主管，故意擬定不賺錢的計畫，勉強通過預算，只拿少少的費用，然後在年度結束前喊達不到目標，結果業績竟然超出預期。雖然拿到管理費用少，但相對容易交出漂亮的成績單。


    ## 利用「互不侵犯條約」


    為什麼這樣的戲碼每年都會上演呢？最大的理由就在於「互不侵犯條約」，不干涉其他部門事務的潛規則。


    假設公司各事業部的經理排排坐在一起開會，這時，某個業績不佳的事業部經理，又在預算會議上說著萬年台詞：「下年度一定沒問題。」即使大家心裡都在想：「又在講空話。」也絕對不會有人真的說出來。因為如果開口說了些什麼，當自己部門業績低落時，對方有可能會因此加倍奉還。而且人大多是自掃門前雪，只要自己部門好就好。


    日產汽車的執行長高恩，在剛上任的時候，聽說當時在公司「U型溝通方式」橫行。U型溝通方式也就是，各事業部經理在會議上不會質疑彼此，但是在會議結束後會跟部屬抱怨：「那傢伙理由一堆。」經理跟部屬抱怨完之後，資歷最淺的部屬因為跟其他部門的同期有交流互動，便會向對方透露：「我們經理說了這樣的話。」然後，接到資訊的人就會往上回報給自己的主管。像這樣，「互不侵犯條約」使溝通變得迂迴、窒礙難行。


    但這樣的溝通方式，不見得一定不好。假如我是某主力事業的部門經理，我最重要的責任就是，從長遠的角度使事業不斷成長，除此之外，還必須守護底下員工跟家人的生活。因此，在不得不考量公司整體利益的同時，也必須思考如何讓自己負責的部門持續成長。


    也就是說，沒有多餘的心思去顧及其他事情。但如此一來，同樣的事情又會重複發生，因此必須想法斬斷這樣的惡性循環。


    在由上往下管理、權力全部集中在執行長身上的組織，即便有不批評彼此的不成文規定，只要老大一句「不行」，事情就定案了。因此「互不侵犯條約」是上班族管理組織常見的現象。


    ## 利用資訊的不對稱來達到目的


    是要咬牙苦撐，戰到最後玉石俱焚呢？還是先提出無可非議的數字，然後再逆轉大反攻？不管怎樣，若實際掌管事業營運的主管，未能提供正確資訊的話，就無法脫離低收益的惡性循環。


    對只能掌握公司整體四、五成資訊，卻必須決定整體方向的經營者而言，資訊掌握不足的地方，必須仰賴主管的暗號來判斷。因此，主管暗號打得不好，有可能會改變公司的營運方向。


    反過來說，如果主管希望組織能按自己的意思行動的話，只要有意的打暗號就好。


    雖然決定權在經營者手上，但提供判斷素材的則是主管。如果主管都本位主義，只提供對自己部門有利的資訊，老闆也是防不勝防，因為經營者與主管握有的資訊落差非常大。因此，只要巧妙利用資訊的不对称，隨心所欲操縱上層並非不可能。


    > 「希望組織能按自己的意思行動的話，只要有意的打暗號就好。」


    ## 打暗號時得考慮時間軸的差異


    主管是不是只要關心自己部門的事情就好了？並非如此。因為老闆跟主管的時間軸不一樣。社長跟董事長等高階經理人，在公司最多也才待五年到十年，但中階主管視情況，可能還要在公司工作十到二十年。


    雖然公司偶爾會出現想把高階經理人拉進來，一起討論長期經營策略的專案計畫，但大部分，討論沒激起火花便無疾而終。因為跟十年後可能已經不在公司的高階經理人討論，實在很難切中核心議題。


    所有者管理的家族企業，因為自己的失敗會影響到下一代，爲避免債留子孫，反而會相當篤定長期經營策略。而上班族管理的企業，因爲經營高層不是世襲制，不像所有者管理的企業那麼有危機感。因此，還要在公司奮鬥十到二十年的人，如果被眼前短期的利益蒙蔽，眼光放得不夠遠的話，很有可能會害到自己。


    即便多麼喜愛自己的部門，業績擺爛、不正視問題的話，小傷口最後可能會變成致命傷。如此一來，頭疼的是自己。一旦出事了，經營者可以落跑，但下面的人跑不掉。


    從長遠的角度來想，提早準備好對策，有好處的反而是主管。


    因此關鍵就在於，主管能否不被情緒左右，靜觀戰局，在適當的時刻喊停。但是，絕對不可以在大家都在的場合喊停，例如：在業績報告會議上說出來，只會被臭罵：「不要說喪氣話，努力到最後！」這是走在外面大馬路上的光明角色容易犯的錯誤，這時候就輪到走跳巷小路的暗黑角色上場，偷偷跑到老闆耳邊說悄悄話。


    重點在於，你能否泰然自若的跟老闆說：「這樣下去會完蛋。即使用盡各種方法絕對會有問題，必須盡快想辦法。」雖然老實說出：「對不起，今年也是虧損。」無法獲得好評價，但即使對自己不利，也必須讓上層知道實情。


    主管需要的就是這種表面上維持打鬥的架式，但私底下溝通協商的暗黑策略能力。雖然自己部門的業績遲遲未改善是問題，但隱瞞問題才更有問題。我看過許多隱匿問題，最後壓不住爆發出來，斷送了大好前程的例子。反而是在適當的時機點拋出問題的人，雖然多少繞了點遠路，但就大多數的情況，這樣做不僅解決了問題，也保住了自己的地位。


    關鍵在於能否正確的掌握局勢，預測未來，並拿出勇氣向經營者報告：「今年雖然勉強通過了預算，但是照這樣下去，老實說兩、三年後恐怕不樂觀，應該要趁早擬定對策。」這與說喪氣話、逃避現實不同。正是因為對狀況非常了解，才能夠冷靜思考如何在遙遠的未來生存下來、從激烈的競爭中勝出，在適當的時機點向經營者打暗號。


