    # 未來屬於能打一場漂亮撤退戰役的暗黑領袖


    主管之所以死命撐著問題重重的事業，有部分原因是因爲自己部門的業績跟個人考績有直接關係。也就是說，讓業績成長的人，評價自然就高，容易獲得升遷；而打了一場漂亮撤退戰役的人，明明應該也要獲得同等評價，卻會被視爲「沒有做出成果」（因爲沒有反映在業績上）。


    然而，在動盪的時代，比起走在保守路線的菁英，反而走旁道的人，例如主導過事業的退出、重建子公司，讓日本老牌企業日立重新站起來的川村隆元會長，反而比較可能成爲有領導力的領袖。


    大多企業奉行減分主義，只要失敗了就會被扣分，所以大家都盡量避免失敗、不冒險踩地雷，造成了現在的避險文化。因此，不容易在經歷上留下污點的主力事業、北美市場，才容易成爲升遷的標準模式。


    若想要振奮、激勵主管，就必須改變這種人事考核制度。只走過光鮮亮麗大馬路的人，很難在變化激烈的時代領航掌舵。'
