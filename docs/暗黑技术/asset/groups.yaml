    主動出擊的部屬，決定了主管的實力，一點也不爲過。部屬就是自己的借鏡。


    ## 花七成時間在部屬身上


    進一步闡釋各種回饋的聲音，可以發現有許多部屬表示：「希望主管花更多時間在自己身上。」「部屬都希望主管能將注意力放在自己身上。」


    將七成的時間用在部屬身上剛好用。雖說規畫三成時間用在客戶應對與公司內部協調，剩下的七成用在部屬身上，但實際上會有各種突發狀況跟業務需要調整，因此自己的工作跟培育部屬的時間，兩者比例最後應該會差不多各半。但如果一開始就決定只把一半時間分給部屬的話，最後只會花兩到三成的時間。如果變成那樣，就無法解決部屬的不滿了。


    同事聚會上的話題，大多是在講主管的壞話：「經理總是嘴巴這樣說，但卻不那樣做。「這樣的話，經理本人根本不會聽到。然而，如果主管有辦法聽到部屬的不滿，兩者的關係便會產生劇烈的變化。這就是為什麼主管必須藉由一對一的面談，問出部屬對什麼感到不滿。


    「從部屬的多樣性，便可看出主管的氣度。」


    內心安排七成，實際花費五成时间在部屬身上的話，「原來經理這麼在乎我」，便能建立起信賴感，培育出發生緊急狀況時，如左右手般行動的部屬。改用暗黑方式也可以說是表現得好像是為了部屬花費七成的時間，但實際上是為了達成目的，而投資自己七成的時間。


    大家都知道奇異公司投資非常多資源在培育人才。例如，奇異有一種名叫「就職會制度」的職務輪調制度，員工每兩年可以依據個人意願，調任至其他部門，經理沒有阻止員工的權限。也就是說，哪個部門的人可以用、哪個不行，哪個部門的經理培育不出好部屬，經理之間全部都都知道。部屬全跑光，而且沒有其他人願意進來的主管，根本不配當部門經理。


    好主管培育出來的有能部屬，在下個地方也會表現活躍。部屬之間會交流資訊，


    ![](img/c5f4a27546ec03b05790e1504b0b945b_148_0.png)

    ![](img/c5f4a27546ec03b05790e1504b0b945b_148_1.png)


    討論哪位主管最熱心教育。經理之間的討論更是熱烈，誰是怎样的人，彼此會認真交流資訊。奇異公司這個制度巧妙的地方在於，主管跟部屬之間，產生了上下相互監督的正向效果。


    ## 沒有執念的人請放棄成為領導者


    在日常從事間諜戰的人，隨著位置爬得越高，就會越加孤獨。即便身旁有追求相同目的的夥伴，彼此關係卻淡如水，不會像學生時代的朋友那樣水乳交融。


    原本愉快的午餐時間，也隨著職位的爬升，逐漸變成一個人囫圇扒嘬、草草結束。但如此畫分清楚是有必要的。


    而且，有能力的人很多都是怪人。他們不是什麼都會的全方位人才，而是專精某一領域的知識與能力，對該領域有非比尋常的執念。那不是普通的願望，而是不論別人怎麼說，都要想盡辦法實現的執念。


    ## 你有多少领导者魅力？


    剛上任就遇到危機的小松製作所坂根正弘社長，或是日立的前川村隆社長等，他們都是排除萬難也要實現改革，擁有強烈信念的人。徹底改變過去的做法，將改革大刀揮向公司的體制結構。在反對改革的保守勢力強勢的威脅下，若經營者沒有堅持改革的執念，很有可能會失敗，輕易恢復原狀。如果沒有想要達成什麼的執著，便無法成為推動改革的真正領袖。


    如果知道自己沒有那種執念，從一開始就不要以成為領導者為目標。現今工作型態多元，像過去那樣在終身雇用制度下，全體員工以成為領導者為目標的時代已經結束了。運用自己的專長成為專業人員也好，成為經營高層的參謀也行，或是順從欲望，過自己想過的人生都可以。生活型態選擇多元，只要找到最適合自己的生活方式，就能讓日子過得很快樂。


    > 「工作完全仰賴頭銜的人，在失去頭銜的瞬間，底下的人就會一一離去。」


    過去的領導力是以職務權力為基礎。社長或經理的頭銜具有相當的意義，比起因為個人，大家更因為頭銜而選擇服從。然而，現在光只有職務權力，是無法管理部屬的。勝負關鍵在於擁有多少領導魅力。


    利用頭銜的威權管理，容易變成利用部屬產生恐懼心的恐怖政治。但歷史已經證明，恐怖統治無法持久，總有一天民眾會反撲。而且，工作完全仰賴頭銜的人，在失去頭銜的瞬間，底下人便會一一離去。


    如果某位經理問下頭的年輕部屬：「今天要不要去喝一杯？」對方反問：「有加班費嗎？」就表示部屬覺得不值得跟這個人去吃飯喝酒。也就是說，對方對主管沒有期待。若部屬覺得「想聽聽這個人的想法」、「和這個人攀上關係有好處」的話，應該不至於每次都拒絕邀約。


    不利用職務威權讓對方聽話，你的領導魅力是否足以讓別人覺得「如果是這個人的話，我願意幫他做事」呢？那樣的領導魅力必須從平日的言行舉止中不斷累積、培養。


    領導能力不是與生俱來的。如果能夠盤點過去的經驗，掌握自己的強項跟弱點之後，避開容易落人的陷阱，不斷與部屬溝通交流的話，自然可以發揮出領導能力。


    雖然說領導能力是培養出來的，但培養方式因人而異、千差萬別，因此即便想要模仿某人的做法，也未必可行。隨著不同的性格與人生態度，每個人培養領導力的方法當然也就不同，只能不斷尋找適合自己的方法。


    你重視什麼樣的價值觀？是依據什麼信念，想往哪個方向前進？你到最後是怎麼樣的人？想要實現什麼夢想？從目標回推出應執行的項目，是靈活運用暗黑技術，真正領導者應有的樣子。領導能力的培養方法沒有唯一的標準答案，只能靠自己去尋找出屬於自己的方法。


