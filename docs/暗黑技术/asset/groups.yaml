    人脈不能只往內建，你要往外擴張'
  - '[PAGE 76]


    # 用「借物接力」偷別人的技能


    本書的讀者應該有不少是經驗豐富的主管，然而一旦年過四十，即便想要克服自身的弱點，學習能力卻大不如前，而且現在要改變個性也很困難。年輕時，會去學新東西、挑戰新事物，上進心強、求知欲旺盛，但到了一定的年齡之後，就變得怎麼追求驚人的技能提升。


    人即便再怎麼努力，也無法成為全知全能的神，所以必須捨棄什麼事都自己來的想法。主管必須採取的策略就是「借物接力」，把可以使用的東西統統用上，集結團隊的力量一決勝負。


    將公司以功能別區分來看的話，有業務、生產、行銷、財務、採購等部門。各種部門各司其職，公司經營必須仰賴各式各樣的部門跟員工，沒有人有辦法做全部的工作。


    而業務的運作除了上述硬體面的功能之外，在溝通時，有時需要態度強硬、扮黑臉，有時則需要讓對方產生共鳴、扮白臉。也就是說，如果無法用北風把上衣吹走的話，就用太陽的光熱讓對方自己脫掉上衣。如果經營管理能力精通到一定程度，能夠一人分飾'
  - '[PAGE 77]


    多角的話，那當然是最好。但在現實世界中，讓一位領導者負責所有事情是有困難的。


    當領導者想採取行動時，如何集結有能力的者便是成敗關鍵。想借助他人的能力和智慧，不要什麼都自己來，就必須改變想法。也就是說，能否成功竊取別人的技術。


    這個時候，想使對方放下心防不介意被模仿的話，就必須從認可部屬能力的暗黑技術開始做起。光只會說：「乖乖聽我的話就對了」的人，不是個稱職的主管。


    若部屬擁有自己沒有的技能，應該由衷賞識，並引導對方發揮出實力，才有辦法建立合作無間的團隊。現在需要的是除了威權式的領導之外，新的團隊管理型態。


    「能否成功竊取別人的技能是成敗關鍵。」'
  - '[PAGE 78]


    # 成為「我不知道」的專家


    全錄的前會長安·穆凱伊，在二○○○年時突然被指名接任營運長。當時的全錄面臨倒閉危機，負債高達兩兆日圓。股價也從穆凱伊就任前一年的六十五美元，一路跌到穆凱伊接任時只剩十分之一左右，大家都認為全錄應該要申告破產。


    穆凱伊過去主要是執掌人力資源管理，當然不可能精通事業的營運。她在接任營運長之後，做的第一件事就是組織團隊跟查明事實。也就是說，她非常了解自己什麼都不懂，因此，上任後便開啟了「連串「我不知道」的策略。如果不懂就跟懂的人請教，具體來說，例如，集結精通財務、研發、產品開發等領域的人，組織團隊。那樣的策略奏效，成功扭轉情勢，讓全錄起死回生。


    當身分地位越來越高時，「我不知道」就變得難以說出口。身分地位越高，為了維護自己的面子，會無法開口說：「不知道」「請教我」，但穆凱伊放下了無謂的自尊，不恥下問。她的綽號是「『我不知道』的專家」。只要是派得上用場的人就善用之，因而做出了成果。'
  md: '

    ## 老闆與主管的緊張關係


    前面所說，老闆只能依據二手資料間接統治，所以某種程度上，是在手腳行動受限的狀況下經營事業。因此，第一線人員若不願意順著上層的意圖行動，改革便無法順利進行。


    然而，當改革失敗的時候，必須負責的是主張改革的經營者。利害關係人會追究主張改革者的責任，所以我非常能理解說出：「現場是改革的反對勢力」的經營者心情。可見願意協助自己改革的主管，有多麼重要。相反的，對主管而言，在改革時讓經營者按自己想法行動的機會便出現了。兩者之間呈現出某種緊張關係。因此，經營者跟主管彼此之間沒有緊張感並不是件好事。


    也就是說，如果經營者對未來十年后的事情無感的話，對公司有長期展望的主管，就必須想辦法讓對方往那個方向移動。


    無論哪間公司都存在著有理念、有高度危機意識的主管，也有公司暗自以那些人為中心，召集志同道合的夥伴，討論十年後可能會發生的問題。那樣的行動應該在什麼時間點、以何種形式檯面化，依據各公司的不同狀況而異。但正因為平時就暗自討論著無法公開的議論，才能在關鍵時刻推動改革。


    ## 未來屬於能打一場漂亮撤退戰役的暗黑領袖


    主管之所以死命撐著問題重重的事業，有部分原因是因為自己部門的業績跟個人考績有直接關係。也就是說，讓業績成長的人，評價自然就高，容易獲得升遷；而打了一場漂亮撤退戰役的人，明明應該也要獲得同等評價，卻會被視為「沒有做出成果」（因為沒有反映在業績上）。


    然而，在動盪的時代，比起走在保守路線的菁英，反而走旁道的人，例如主導過事業的退出、重建子公司，讓日本老牌企業日立重新站起來的川村隆元會長，反而比較可能成為有領導力的領袖。


    大多企業奉行減分主義，只要失敗了就會被扣分，所以大家都盡量避免失敗、不冒險踩地雷，造成了現在的避險文化。因此，不容易在經歷上留下污點的主力事業、北美市場，才容易成為升遷的標準模式。


    若想要振奮、激勵主管，就必須改變這種人事考核制度。只走過光鮮亮麗大馬路的人，很難在變化激烈的時代領航掌舵。


    # 暗黑技術


    ## 成為有話直說的白目


    ![](img/c5f4a27546ec03b05790e1504b0b945b_57_0.png)


    ## 你今天的行動跟損益表有關嗎？


    你在公司提出採購單，請老闆做最後裁決時，需要經過多少人蓋章核准呢？採購單上可能有課長、經理等用印的欄位，但大家應該經常遇到這樣的情況。在請經理蓋章之前，如果不先跟隔壁部門的課長說明、獲得同意的話，之後對方如果生氣抱怨：「我可沒聽說要這樣做！」就會變得很難協調。因此，有些人雖然不用請他蓋章，但仍必須口頭取得對方的同意，放進簽核流程當中，這些人就是所謂「口頭簽核」的傢伙。


    如果把口頭簽核也算進去的話，需要簽核的人數就會變得很多。例如，經營企畫部大部分的工作，很有可能變成都在做內部協調。


    請各位回想一下，你今年跟多少公司外部的人交換了名片？姑且不論不須對外交涉的部門，如果理當對外溝通、交涉的部門，但交換到的名片卻寥寥可數，那就是你為公司爭取附加價值的努力不足的證據。雖然協調、事前疏通、安排是組織運作的必要條件，但是把時間都花在無法孕育價值的內部調整上，根本稱不上是在工作。


    JFE控股公司的前社長數士文夫，是我敬佩的企業經營者之一。聽說他經常對


    ## 圖 8 口頭簽核


    ![](img/c5f4a27546ec03b05790e1504b0b945b_59_0.png)


    ![](img/c5f4a27546ec03b05790e1504b0b945b_59_1.png)


    部屬大聲問道：「請問各位今天的行動跟損益表的什麼地方有關呢？有辦法說明嗎？」他的意思是指，大家今天一整天的工作是提升業績的行動？還是降低成本的行動呢？如果都不是的話，那麼這一天就沒有為公司帶來附加價值。


    我跟負責既有客戶、也就是業務活動僅限於奔走幾間公司的業務聊天，發現原本應該和外部接觸機會最多的業務部門，竟然有不少人一年當中交換到的新名片屈指可數。如果主要的工作內容就是負責照顧好舊客戶的話，那自然另當別論，但假如工作也必須開發新客戶，只能說是把自己關在舒適圈，不願意踏出去挑戰外面的世界了。


    ## 以默契解決所有問題的組織


    一直跟同一個人合作配合，彼此最後會同質化。而製造業一直以來相當擅長的相互配合，用另一種說法就是默契配合。彼此相當有默契，不需要開口就能相互配合，因此，「不在大家前面說出來」便成為相互配合的企業文化。


    請想像一下這個情境，假如有位課長底下有三位部屬，而他們手上有個稍有難度的案子需要課長核准。大家進公司後，看了看課長的臉色，感覺他今天心情似乎不太好。「今天先不要那個案子給課長」，即便這句話沒有人說出口，大家彼此交換眼神就馬上明白。一直跟相同的成員一起工作，彼此逐漸同質化，不需要特地開口說明，就能夠配合無間。


    同質化有好也有壞，因為無須開口，就能知道彼此的想法，溝通非常輕鬆簡單；但如此一來，不屬於該團體的人可能會被排除在外。


    例如，幾位新上任的董事，參加每個月的經營會議。其中一位董事幹勁十足，針對每個案子都發表意見、提出問題，但那些問題卻被忽視。雖然那位董事確實提出了一些具有建設性的發言，但大多都是狀況外跟雞蛋裡挑骨頭的問題。不管怎樣，他的確擾亂了會議的氣氛。像這種情況，組織可能會啟動自淨作用，將那種說話大聲、發言不合時宜的人調到鄉下或海外，不知不覺中從組織的核心消失。


    ## 創新只會出現在未重疊的邊緣地帶


    雖然團隊同質化之後，溝通成本降低了，但觀察事物的角度也因逐漸同質化，因此挖掘不出新點子，甚至殺風景的話也漸漸不說了。即便大家心裡都覺得：「這太難了，根本做不到。」但，「這話說出口就完蛋了」的氣氛瀰漫，因此沒有任何人說出來。


    互不侵犯條例的現象也出現在部門內的成員之間。


    哈佛大學商學院的課堂上，針對團隊同質化有個簡要明瞭的說明，以下簡單介紹。


    - 如果三個人的想法用圓形來表示的話，同質化就是三個圓重疊在一起的同心圓狀態，如圖九左上角的圖形。彼此之間沒有偏移，因此溝通容易，決策過程也快。

    - 另一方面，多樣化就是三個圓彼此錯開的狀態，如圖九右上角的圖形。在這種情況，三個人都可以接受的地方，只有彼此重疊的交集部分。而且重疊的部分跟前述的同圓相比小很多，因此必須做好溝通，找出彼此都能接受的部分。因為彼此之間的默契不足，溝通跟管理成本都比較高。也就是說，很不好溝通。


    許多公司都在推動組織內的多樣化，但就如剛才所說，短期內的溝通成本相當高。


    ## 圖 9 同質圈跟多樣圈


    ![](img/c5f4a27546ec03b05790e1504b0b945b_63_0.png)


    資料來源：哈佛商學院 (AMP) 講義


    > ─許多公司都在推行組織內的多樣化，但短期內的溝通成本相當高。─


    舉例來說，假設企業某部門來了位年輕的外籍新員工。


    這時經常會發生這樣的情況：每當經理說了什麼，外籍員工就會認真問：「為什麼？」如果雙方都是同樣國家的人，進公司第二年的員工逐一詢問經理：「請問是為什麼呢？」恐怕經理一句：「不要囉嗦，乖乖做就對了！」對話就結束了。但如果提問的是外國人，如果不回答的話，對方就不會動作。這對經理來說實在是很麻煩。


    在默契配合環境下成長的人，不用說就能明白。對這樣的人說明不但浪費時間，還會造成對方的負擔。所以只要放任不管，就會回到原本的同事狀態。


    但是在圓完全重疊的同事世界，不會出現多元的意見：多樣化的組織，短期內又非常沒有效率。而一次全部使用三個圓的觀點，便能解決這樣的窘境。也就是說，不只是三個圓的交集，而是將所有面積都納進來使用，因此決策的範圍變廣了（如圖九的下方圖形）。


    而且，創新根本就不會從三個圓的交集孕育出來，因為創新的點子是由大家不斷的腦力激盪，最後在未重疊的邊緣地帶找到的。


    只要放任不管，就會有股力量推動著組織回復到原本舒適的同質世界。而這個時候，主管的工作就是想辦法阻止組織走回頭路，盡量維持組織的多樣化。


    ## 組織的度量展現於部屬有多白目


    位在第一線的主管，如何讓自己的部門擁有多樣性呢？我認為，所謂的組織多樣化，並不是指聘用了多少位外籍或女性員工，而是指組織當中人數最多的新進員工中，有多少人能夠光明正大的提出跟大家不一樣的意見，同時組織又能夠容忍這種「白目」員工到何種程度。


    在同質化的組織，越是不懂得察顏觀色，不時理直氣壯提出反對意見的人，越容易因組織（不好）的自淨作用而被排擠。即使如此，組織裡能夠聽到多少這樣的白目發言，又能夠有幾分容忍，便決定了組織有幾分度量。


    反過來說，由於組織多少都有同質化的傾向，凡事跟自己請示的部屬不但不會被加分，還會被扣分。因此，組織必須做好禮讓自主人的事先準備。


    重點在於，面對問題時主管不要自己回答。


    當部屬提問時，最輕鬆的應對方式就是直接回答。雖然做出指示並沒有錯，但如果直接回答，對方就會直接照做。由於主管的發言容易對底下的人造成影響，因此若想让部屬說出真正的想法，就必須持續不斷的詢問對方：「你有什麼想法？」「資歷豐富的人可能早就知道答案，但即便麻煩，也要把「你就這樣做」這句話給忍住，讓部屬說出自己的意見。像這樣，忍住不直接下指示，給部屬發揮空間，才能够培育自主人才，打造不看主管臉色，自由說出新意見的職場文化。


    > 「組織裡能夠聽到多少自己發言，又能夠有幾分容忍，便決定了組織有幾分度量。」


    ## 越級報告行不行？當然可以！


    日產汽車的跨部門團隊就是巧妙利用白目人才的最佳實例。


    雖然大家都知道，日產汽車的執行長高恩於一九九五年到任之際，便馬上成立跨部門團隊，打破部門間的藩籬，讓日產汽車谷底回升，但跨部門團隊並非一開始就運作良好。因為組織龐大，本位主義橫行，而八人制的跨部門團隊，成員又來自不同的部門，大家維護部門利益的意識強烈，因此聽說團隊的運作是從互罵開始。


    那麼，是做了什麼才讓跨部門團隊的運作變順暢的呢？其中一個方法就是「越級報告」。例如，負責產品生產的跨部門團隊的報告，不是提給專管生產的董事長，而是直接提交給執行委員會。也就是說，負責的董事也是本位主義，因此越級直接跟經營者報告，能防止負責的董事從中作梗，而且過程透明，反而讓公司變成能夠自由表達意見的體制。


    此外，高恩本身對跨部門團隊的運作也下了許多工夫。他集結跨部門團隊的成員，熱血沸騰的說明這個團隊有多重要，聽說成員當中真的有有人聽到感動流淚。


    另一個成功因素就是成員的年齡，團隊成員都是四十多歲課長級的主管。如果是二十多歲或三十多歲的人，因為經驗不足，還無法掌握公司整體面貌。但如果是五十多歲經理等級的主管，因為有各種限制而難以動彈，不太有辦法認真思考十年、二十年後的事情。如此一來，四十多歲是團隊成員的最佳年齡。


    部門內的同質化現象無法避免，無論是研發部門、生產部門，還是銷售部門統統都有同質化現象，所以日產汽車才會引進跨部門團隊策略，進行改革。但不僅如此，高恩也要求公司整體推動相同的改革。


    日產汽車的公司治理守則於二〇一五年完成導入，新增了多名獨立董事的席位，為經營團隊帶來不同的視野。下一步就是爲經營第一線的現場帶進新思維。最好懂的應該是，以提高女性主管的人數達到多少比例以上爲目標，但本質上則是不侷限於性別跟國籍，努力增加能夠提出不同意見的員工。


    讓部屬勇敢直言的同時，有時自己也必須提出白目的意見。成爲白目的人，要具有堅持已見的涵義，因此看社長臉色、請求的話，就代表沒有真正做到白目。當社長說往右，不是想都沒想就跟著往右，而是若覺得應該要往左的時候，能夠說出「我覺得應該要往左」，才是做到真正的白目發言。


    當然白目也有分好壞，天真無邪的白目發言若毫無節制的話，會讓自己的立場變得很詭異。也就是說，勝負決定於是否事先做好協調、事前疏通、安排等表達方式，以及挑對時機點。只要事前悄悄跟老闆報告的話，乍聽之下極爲白目的發言，也不會因此被忽視、駁回。


    一旦營造出「那樣伙平常就是那樣，就原諒他吧」的氣氛，就可以光明磊落的闡述自己的想法。想有話直說卻不被忽略，平時打好協調、事前疏通、安排的基礎，是成爲白目人的必備暗黑技術。


    > 「想有話直說卻不被忽略，平時打好協調、事前疏通、安排的基礎，是成爲白目人的必備暗黑技術。」


    ## 自由發言的職場創造組織的多樣化


    在高度多樣化的組織，即便是白目的人也能夠表現耀眼。某位社長說：「所謂的組織多樣化，不是只有現場或經營者某一邊有就好，而是兩邊都必須多樣化。」公司上下都積極努力，才有辦法打造大家都能自由發言的職場文化。


    經營者的多樣化改革，成敗關鍵在於能否好好運用獨立董事的角色。而經營第一線的現場，則經常以女性員工的活躍程度等作為多樣化程度的績效指標（KPI）。但如同前面所述，即便部門內有不少女性或外籍員工，一旦落入同質化的陷阱，就不是多樣的組織了。雖然白目程度難以量化評估，但部屬對自己陳述反對意見的次數或頻率，應該可以作為績效的評估指標。


    另外，又久又大的企業經常看到這樣的現象。職場來了位外籍員工，在會議上說了白目的話，大家表面上看起來似乎都贊同：「你說的對。」但實際上，私底下卻決定了所有的事情。由此看來，是否只要增加外籍員工就能增添組織的多樣化呢？未必如此。不接受白目發言的職場文化，是無法維繫組織多樣化的。


    像那種「自己的未來自己決定」的公司治理思維，有可能是根源於「我們好棒棒」的想法。也就是以彼此的默契配合為基礎，藉由工作現場自發的磨合、調整，不斷累積改善活動，然後成為世界第一，榮耀國際的想法。


    然而，現在大部分領域，光那樣已經行不通了。例如，只有少部分的人在研究人工智慧。即便想聘請史丹佛大學或麻省理工學院的頂尖研究人員，如果沒有讓大家自由發表意見的環境，一流人才根本不會願意過來。世界級的優秀人才有很多選擇，想讓他們選擇本國企業，就必須有足夠的度量，放手讓人才自由發揮。


    最不幸的就是，僱用了優秀的外籍工程師，卻無法好好利用的情況。雖然頭腦清晰且優秀，但講話結結巴巴，彼此無法順暢溝通。對被聘請的人而言，在自己不熟悉的地方，所有事情都被人決定，也不知道自己會被如何評價，只能做不重要的工作。導致雙方最後走向不幸的結局。像這樣的文化差異，本質上的問題比想像的複雜。


    ## 想打進國際市場，總司令部作戰模式行不通


    即便是已經進入國際市場的公司，基本上也是「總司令部作戰模式」，也就是總公司決定一切，然後將之推展到全世界，不太會本土化。「你自己過來做做看」，曾經是派駐海外人員之間的流行語，批評總公司不清楚當地情況，就想要方面下達命令，拓展海外市場根本沒那麼簡單。隨著全球化日益顯著，同質化的思維逐漸無法與國際競爭。


    現在亞洲市場越來越大，但「亞洲」這個詞無法概括全部的国家，例如，中國跟越南的情況不同，泰國跟印度的需求也不一樣，民族性當然也有差異。想跟多元的世界做生意時，同質化的思維是因應不來的。


    例如，在試圖打入印度市場時，重點不僅在於低價競爭，還必須跟產品的品質和性能沒有很好但堪用的當地廠商競爭。以已開發國家為客群的產品，品質跟功能佳，價格也相對高，比較專攻有高階產品需求的客戶，但這樣的產品在大眾市場完全沒有勝算。因此，站在當地子公司的立場，若不能微降低產品的品質跟性能，讓價格有辦法跟當地廠商對抗的話，根本就做不起來。但是把這樣的期望丟給總公司，大部分的品保部門都不會點頭同意，『怎麼可以用我們公司的名字生產那種廉價的產品！』


    只要是○○品牌就不可以生產品質低劣的產品，也可能有其道理。這邊稍微偏離主題，我個人認為，企業的挑戰在於，能否生產出價格與性能跟當地廠商差不多等級，但品質卻能夠維持水準的產品。正因爲如此，維持現狀的改善找不到突破點，若沒有從改革的角度重新思考設計跟生產方式，問題恐怕無解。解決問題的第一步，就是不要沿襲以往總司令部所做的決定，而是依據當地的思考模式跟需求生產產品。因此，吸取多元意見的職場文化是不可或缺的必要條件。


    我在二十多歲時是美國車的超級粉絲，車身長五公尺以上、寬兩公尺以上，美國的左駕大型車是我夢寐以求的車種，但是卻一點也不適合狹窄的道路。從一九九〇年代中期開始，美國的通用汽車跟福斯汽車爲配合亞洲市場，有策略的推出小型車種，但我看來，還是跟心思細膩、較感性的亞洲人不太相襯。


    而現在亞洲企業在各國市場實施的策略，恐怕跟美國車在亞洲市場的策略沒什麼兩樣。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_75_0.png)


    人脈不能只往內建，你要往外擴張


    ## 用「借物接力」偷別人的技能


    本書的讀者應該有不少是經驗豐富的主管，然而一旦年過四十，即便想要克服自身的弱點，學習能力卻大不如前，而且現在要改變個性也很困難。年輕時，會去學新東西、挑戰新事物，上進心強、求知欲旺盛，但到了一定的年齡之後，就變得怎麼追求驚人的技能提升。


    人即便再怎麼努力，也無法成為全知全能的神，所以必須捨棄什麼事都自己來的想法。主管必須採取的策略就是「借物接力」，把可以使用的東西統統用上，集結團隊的力量一決勝負。


    將公司以功能別區分來看的話，有業務、生產、行銷、財務、採購等部門。各種部門各司其職，公司經營必須仰賴各式各樣的部門跟員工，沒有人有辦法做全部的工作。


    而業務的運作除了上述硬體面的功能之外，在溝通時，有時需要態度強硬、扮黑臉，有時則需要讓對方產生共鳴、扮白臉。也就是說，如果無法用北風把上衣吹走的話，就用太陽的光熱讓對方自己脫掉上衣。如果經營管理能力精通到一定程度，能夠一人分飾多角的話，那當然是最好。但在現實世界中，讓一位領導者負責所有事情是有困難的。


    當領導者想採取行動時，如何集結有能力的者便是成敗關鍵。想借助他人的能力和智慧，不要什麼都自己來，就必須改變想法。也就是說，能否成功竊取別人的技術。


    這個時候，想使對方放下心防不介意被模仿的話，就必須從認可部屬能力的暗黑技術開始做起。光只會說：「乖乖聽我的話就對了」的人，不是個稱職的主管。


    若部屬擁有自己沒有的技能，應該由衷賞識，並引導對方發揮出實力，才有辦法建立合作無間的團隊。現在需要的是除了威權式的領導之外，新的團隊管理型態。


    > 「能否成功竊取別人的技能是成敗關鍵。」


    ## 成為「我不知道」的專家


    全錄的前會長安·穆凱伊，在二○○○年時突然被指名接任營運長。當時的全錄面臨倒閉危機，負債高達兩兆日圓。股價也從穆凱伊就任前一年的六十五美元，一路跌到穆凱伊接任時只剩十分之一左右，大家都認為全錄應該要申告破產。


    穆凱伊過去主要是執掌人力資源管理，當然不可能精通事業的營運。她在接任營運長之後，做的第一件事就是組織團隊跟查明事實。也就是說，她非常了解自己什麼都不懂，因此，上任後便開啟了「連串「我不知道」的策略。如果不懂就跟懂的人請教，具體來說，例如，集結精通財務、研發、產品開發等領域的人，組織團隊。那樣的策略奏效，成功扭轉情勢，讓全錄起死回生。


    當身分地位越來越高時，「我不知道」就變得難以說出口。身分地位越高，為了維護自己的面子，會無法開口說：「不知道」「請教我」，但穆凱伊放下了無謂的自尊，不恥下問。她的綽號是「『我不知道』的專家」。只要是派得上用場的人就善用之，因而做出了成果。

