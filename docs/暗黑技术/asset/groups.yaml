    # 前言


    ## 中階主管是企業向上發展的最大關鍵


    二十一世紀之後，從二○○八年雷曼兄弟破產引發全球金融海嘯、二○一一年日本三·一大地震的劇烈外部環境變化，乃至人工智慧與大數據分析等技術創新，非連續性的變化接二連三發生。而且那樣的變化，很多都是同時發生於世界各地，但地球另一端發生的事情，也多少會影響到我們。在這樣的環境下，企業該如何從逆境中勝出？面對非連續性的變化，企業也必須以非連續性的改革應對。而改革的關鍵是什麼呢？


    我所任職的經營共創基盤顧問公司（Industrial Growth Platform, Inc.，以下簡稱 IGP）專門輔導企業的重整跟再造。IGP 從經營管理顧問、企業併購諮詢、投資新創公司跟大企業到製造業的生產流程改善，甚至是地方巴士公司的經營等，業務內容非常廣泛。而我的主要工作，則是協助歷史悠久的企業打進國際市場，也就是針對「又久又大的公司」提供經營管理的協助。


    如果用來比喻的話，我的客戶有：不馬上動手術就會危及生命的公司；雖然沒有攸關性命症狀，但是必須徹底改善生活方式的公司；身體狀況非常良好，但是想維持並持續增進健康，而不斷鍛練體魄的公司；想在奧運贏得金牌般，以世界第一為目標努力訓練自我的公司。我協助過非常多種類的公司。


    然而，在這類如此多元廣泛，擁有不同問題的公司之間，卻有著相似的共同點。例如：大家彼此協調，共同決定事物，「以和為貴」為一切行動宗旨；視默契配合為溝通的基本原則，認為察言觀色是美德；用強烈的歸屬感使員工對公司產生高度忠誠，但同時有排除外人的傾向。


    無論是有經營危機的公司，還是以世界第一為目標的公司，雖然有程度上的差異，但他們幾乎都擁有上述的特徵。而且，據企業經營大老所言，他們從很久以前就有這些特質。


    在本書，我並不是主張這樣的價值觀已經跟不上時代，應該徹底改變、捨棄。就像是硬幣有正反兩面一樣，任何特質都有好的一面和壞的一面。若想讓公司擁有的價值觀朝向正面發展，應該怎麼做才好呢？就我多年來接觸過許多企業經營的經驗來說，關鍵就在於公司的主管，也就是經理、課長等職位的主管身上。


    ## 用「見不得人」的工作技能助你一臂之力


    本書的目的是想助這些主管一臂之力。


    應該有很多人看到書名有「暗黑」兩個字，腦袋就浮現出邪惡中心、黑暗世界等意象吧？雖不盡然如此，但也沒有相差太遠。說到推動事業時所需的技能，我們可以舉出邏輯思考能力、財務會計知識等硬體面的技能，本書將之稱為「光明技術」。


    當然，那些是實際推動事業時的重要技能，無須爭辯。然而，想要說服血肉之軀的人，幫助組織動起來，並改變擁有強烈慣性的大公司的行進方向，就必須用上見不得人的「暗黑技術」。利用人際關係影響他人，有時甚至必須操縱對方，讓別人按自己的意思行動。


    這些技術並不是指溝通或是軟性技能這類光鮮亮麗的東西。你必須好好的面對自己，跳進內心深處的黑暗沼澤，才有辦法習得。甚至必須想像，並巧妙的利用他人的黑暗面。


    本書將介紹各種暗黑技術，提供主管一些實用的概念，協助他們打造強健的體制，讓公司在五年、十年後也能從競爭中勝出。


    如果本書能夠陪伴未來頂尖領袖的希望種子，在成為領導者的旅程上提供一些幫助的話，將會是我的榮幸。


    木村尚敬


    # 序章「光明技術」無法生存的時代


    ## 什麼才是明日領袖的需求？


    我經常為大企業舉辦領導培訓營，學員涵蓋董事到課長階層。這邊所指的大企業是指又久又大的公司；歷史悠久且組織龐大，自很久以前就開始從創立公司的「所有者管理模式」，轉型為選賢舉能的「上班族管理模式」的企業。


    因為是知名企業的未來領袖培訓營，所以經常邀請聲望很高的企業經營者為大家演講。但是對來聆聽的學員而言，台上頂尖領導者的演講內容，好像跟台下的自己沒什麼關係。「演講的內容非常精彩，但是遠在天邊遙不可及，不是要緊、迫切的課題。」這是我經常聽到的學員感想。


    因此，我不斷思考，什麼樣的主題才符合這些明日領袖的需求，最後得到的結果就是暗黑技術。本書之所以以主管為對象，正是因為夾在老闆跟實際工作現場之間的中間管理者，才是改革的關鍵。


    ## 你是增加公司利潤的勝利組，還是在低利潤中掙扎的失敗組？


    一覽前幾大企業的業績變化，便可發現自一九八〇年之後，各大企業的營業額不斷增加，但是獲利能力、也就是「賺錢能力」，卻不斷衰退。


    但一九頁這份資料的數據只更新到二〇一二年，問題便是在那之後。日本在政權轉移到安倍內閣，安倍經濟學政策開始實施之後，部分如日立、索尼跟松下電器等公司，徹底改革事業結構，利潤立即有了顯著的改善。


    而另一方面，雖然有部分是像夏普等必須緊急熱車、動手術的公司；但真的情況非常危急，必須緊急開刀動手術的急症公司，其實並沒有那麼多。雖然放著不管，總有一天會危及性命，但大部分的公司現階段症狀並不明顯，就像是生活習慣病的慢性疾病一樣，只是微微的影響著健康。


    二〇〇八年雷曼兄弟破產引發的全球金融海嘯、二〇一一年日本三一一大地震等外部環境急遽惡化，再加上公司治理守則的導入，強化了經營管理的監督功能，每間公司都想盡辦法，著手開發原本相當棘手、不熟悉的事業、產品功能、市場跟產品線等。例如，早期的綜合電器製造商，將電視生產部门的模式，轉變為垂直整合模式；藉由數位化跟商品化，針對容易陷入價格競爭的B2C
    (Business to Consumer，指企業直接提供消費者商品或服務的經營模式) 事業，實施合縱連橫的策略等，都是典型的例子。像這樣，將結構改革的成果，投資到主力事業上，使公司持續成長為主要的目的。


    ## 不好也不壞的中庸事業群，才是公司的絆腳石


    假如我們算出事業群的利潤平均值跟標準差，畫出常態分布曲線，現在有問題的既不是右側的高收益事業群，也不是左側的低收益事業群，而是被夾在中間、獲利能力中庸的事業群。


    這還為方便說明，全部都用「事業」來指稱。事業是指管理會計上的收益單位，如果是綜合型企業的話，事業就有可能是指事業單位；如果是單一事業體的話，事業便為地區單位，視情況也可以視作顧客或產品單位。不管怎樣，中庸事業群不是核心事業，也不是必須馬上展開改革的垂死事業，企業中有非常多這種半調子的事業。


    大企業裡有許多營業額約數億到數十億，最多少超過六十億元，底下員工人數從數十人到五百人程度的中庸事業群。業績好的時候，也只能賺進數億元的利潤；業績不好的話則有可能虧損。這個中庸事業即是問題的癥結，能否徹頭徹底改革中庸事業的結構，決定了企業的命運。是踏上上升氣流谷底翻身呢？還是持續低收益的事業結構，如慢性病一樣任由時間流逝而消失？光明或黑暗的道路一分為二。


    但這並不是說應該要裁撤所有這樣的事業。即便是中庸事業，卻擁有對核心事業而言不可或缺的關鍵技術，而且應該也有能夠和其他公司組成聯盟，擴大規模的事業。也就是說，管理者必須果斷的決定對策；決定擴大事業的話就好擴展，決定合併的話就好併購。


    最糟糕的就是什麼都不做，放著不管。中庸事業每年都沒有嚴重虧損，或多或少能有些盈利，對公司而言沒有一擊斃命的影響力，因此問題自然不會浮現。如果不採取任何措施的話，問題永遠不會消失。那樣的結果就是，規模越大的公司，中庸事業越是滿坑滿谷，並造成低收益的主因。如果問題很明顯，公司當然不得不著手對策，但問題就是收益不好也不壞，即便盈利或虧損，也不是什麼大不了的金額，因此實在沒有積極解決問題的動機。


    通常，大企業在公布財報時，各事業群會分開公布，但問題就在於，大部分的中庸事業群會被分類到「其他」的類別。例如，零組件公司的財務報表中，有用車零組件、工業機器零組件等主要事業群，但唯獨中庸事業被悄悄歸類到「其他」，這就是問題所在。正因為被分類到「其他」，所以不引人注意，優先順序也因此被排到後面。


    然而，即便核心事業的營業利益高達百億元，若其他零碎的事業分別有數十億虧損的話，最後正負相互抵消，結果公司整體營業利益率算下來少得可憐。所以，解決中庸事業的問題，是改善公司經營的重要因素之一。


    ## 想改變事業結構不該從變動成本下手


    當公司遇到營業收益低的情況，另一個常見的做法就是，像擦抹布一樣，從各個地方削減成本，而最好下手的就是削減管銷費用。例如：減少出差次數、削減無急迫需求的經費等。但那些削減成本的方式效果有限，因此想一口氣降低成本，首當其衝、最容易被開刀削減經費的，就是研發部門。雖然核心事業當前的產品開發，以及稍微眼光長遠的高階技術研發等經費會被保留，但緊急度越低的投資，越容易被延遲擱置，例如：須花費十年才能見到成果的基礎研究，以及與現在核心事業無關的新技術等研究開發。


    下一個容易被拿來開刀的，是人才培育經費。因為人才培育，基本上也是非急需的需求，容易成為拿來削減經費的對象。


    然而，研發部門跟人才培育，都是幫公司生金蛋的金雞母。削減未來的重要投資，也就是在摘掉未來搖錢樹的樹苗。將節省下來的經費補貼公司的現金流量，從中長期的角度來看效果無法持續。


    從別的角度來看，研發跟人才培育的投資經費，某種程度上是屬於「變動費用」，因此刪減了那些投資經費，事業結構本身其實沒有任何改變。想要改革事業結構的根本，強化賺錢能力的話，如果不從固定費用下手，恐怕沒有效果。但是，一旦要對固定費用開刀的話，大家就容易聯想到營運據點的整編、事業的重整、相關人員裁撤等，因此會盡量閃避這樣的問題。所以大多是不會有反對意見的變動費用開始刪減，藉此度過難關。但一旦減少對未來的投資，公司便會陷入中長期競爭力落後的惡性循環。


    如二五頁圖三所示，日本電子產業相關企業的投資金額，遠低於其他國外企業。


    ![圖 1 日本主要企業的業績變化](img/c5f4a27546ec03b05790e1504b0b945b_19_0.png)

