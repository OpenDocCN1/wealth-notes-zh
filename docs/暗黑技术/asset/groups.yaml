    ## 從「改善」到「改革」，公司的經營模式改變了


    那麼，該怎麼做才好呢？與其回首昨天，不如過好今天；比起今天，不如想辦法讓明天更好，這樣的改善措施對業績持續成長的公司效果最好。例如，品管圈（Quality
    Control Circle, QCC，也稱作團結圈）這種企業內部改善方法，便是典型的例子。品管圈是由相同或相近工作場所的員工，自發性組織，一同找出工作現場的問題，並持續改善的團體；是由下往上的企業改善活動。透過品管圈的活動，現場的生產力日益提升，固定費用的結構在不知不覺中獲得相當大的改善，最後也连带強化了公司的獲利能力。


    然而，現在企業需要的，不是這種由工作現場發起，必須長時間不斷累積的改善活動，而是需要：「要痛下決心投資嗎？」「要和其他公司結盟嗎？」「要把這部分的業務分割出去，獨立成新的核心事業嗎？」等判斷，需要的是與改善成對比的改革。


    改革跟延續昨天的基礎，讓今天變得更好的改善不同，是徹底改變昨天的工作方式，因此改革必然伴隨著龐大的壓力。如果以人為例的話，就像是為了減肥，把每餐飯量減為平時的七成，這相對容易執行。但另一方面，如果是每天早上五點起床晨跑三十分鐘，徹底改變過去的生活方式，那樣的判斷便會帶來相當大的負擔。即使最後決定實行，在剛開始的執行階段，可能會因為睡眠不足，或是對長期運動不足的身體造成重擔，導致免疫力下降，結果變得容易感冒等，在初期階段必定會引發劇烈的震盪。


    正因為如此，如果當事人沒有強烈的決心，就不會做出這樣的判斷，更不用說實行了。我們把話題拉回公司的經營。雖然改革需要公司高層或經營者的強烈決心才有辦法執行，但本書提到的又大又大的企業，事情根本不是高層一句話就可以決定、推動的。


    由上而下的管理型態，經營得相當出色的例子有：優衣庫的柳井正、日本電產的永守重信，他們都是所有著管理型的企業。公司老闆說的話，跟上班族社長說的話，份量就是不一樣。


    就跟人的身體一樣，即便大腦下指令叫雙腿跑起來，但雙腳卻沉重得動不了。換作是工作現場，今天你突然跟現場人員說要改變做法，那麼麻煩的事情，沒有人會願意做。組織越老越大，慣性就會越強，越是難以改變。


    各位置中是不是有人礙於上下服從關係，雖然表面上聽從主管的指示，但做事時卻慢慢來，甚至惡劣一點根本魚目混珠、打混摸魚呢？


    ## 主管能否提供有價值的資訊是關鍵


    許多企業最擅長的現場自發性改善活動，進行方式主要是這樣的形式：現場人員彼此交換意見，負責人和部門之間相互協調，最後往上報告給高層。公司規模不大，或者是市場僅限於國內的話，這樣的改善活動應該能順利進行。但是，當公司規模越來越大，組織橫向發展，體制複雜階級增多，協調所需時間越來越長時，便會遇到協調不完的問題。結果就是，過去由下而上的決策模式所需的溝通時間多到令人咋舌，或是協調不成、無法達成共識的狀況頻繁發生，最終無法運作。


