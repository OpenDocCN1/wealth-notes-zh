    # 資訊不會自動上門，你得主動汲取


    主管不但有辦法直接跟經營者聯繫，也可以直接跟現場的人溝通。無論對上還是對下，都能依據第一手資料進行對話。用圖來表示的話，可以畫成如左頁圖十四的關係圖，經營者跟部屬為兩個倒三角形，而連接兩者的接點為中階主管。


    但人都喜歡觀察比自己地位高的人。各位在跟同事吃飯喝酒時，是不是也都用主管的壞話當下酒菜呢？其實當你仔細觀察老闆時，你的部屬也正仔細觀察著你。然而，上面的人會以同樣的角度觀察下面的事情嗎？實則不然。老闆只有一個人，而下面卻有好幾位部屬，無法避免資訊不對稱的發生。


    所以，如何利用老闆跟主管之間的資訊不對稱非常重要。雖然主管能夠依據第一手資料跟老闆、部屬對話，但實際上，即便主管有辦法跟現場直接溝通，也未必能夠掌握一切。因為有的情況是，自己以爲已經拿到現場的第一手資料，但其實真正獲得的資訊微不足道。就跟身為主管的你一樣，跟上層報告時會挑選內容，而部屬在跟你報告時，也會有意、無意的過濾資訊。主管跟部屬之間，也存在著資訊的不對稱。那麼，該怎麼'
