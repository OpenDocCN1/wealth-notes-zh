    # 「理解什麼是情與理的中間點，才有辦法影響他人。」


    「人只看看自己想看的現實」，這句凱薩大帝的名言其實呈現了人類的本性。只看自己想看的現實，可能會讓人感到舒適自在，但是無法從中獲得任何成長。你有辦法正視不想面對的現實，保持客觀而束手足無措嗎？借用擁有這勇氣的
    IGPI 富山社長的話：「理解什麼是情與理的中間點，才有辦法影響他人。」


    合乎經濟理性的判斷，冷靜思考商場局勢的時候，最能夠引導出客觀、有邏輯的解答方法。這個事業持續下去業績也不會回升，所以必須賣掉或進行組織重整，思考下一步應該怎麼走等，不用外面的人來說，在公司工作數十年的人當然知道這點道理。即使大家內心清楚，但卻沒有任何人說出口，因為職場上瀰漫著「這話講出來就完了」的氛圍。'
