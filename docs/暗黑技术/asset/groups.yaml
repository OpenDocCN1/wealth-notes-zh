    # 聽不到真話的職場


    面臨倒閉危機的企業，力挽狂瀾進行組織重整、再造時，必須決定要把哪個事業收起來、要關掉哪間工廠。其實只要是該企業的員工，大家都知道應該從哪邊下刀改革，但卻害怕說不出口。從日本產業振興機構曾經出手協助過的佳麗寶等多間公司都是如此，大家從不想面對的現實移開視線，知道事實卻不明講。明明很清楚，但卻沒有人公開說出來。


    爲什麼大家說不出口呢？最大的理由就是明哲保身。因爲在指出問題的瞬間，很可能自己就會因此消失，所以沒有人敢飛蛾撲火。當人職位越爬越高，就會變得越來越無法容忍失敗，心想：「要是在這個場合說了真話，職位恐怕不保，我才不幹這種傻事呢。」便決定噤口不言。


    經理之間相約吃飯喝酒，即便席上大家都說：「不那樣做是不行的。」但是卻沒有人在公開場合說出來。


    這是我爲日本代表性國際企業，數十位熱行董事等級的學員舉辦研習營時發生的'
  - '[PAGE 158]


    故事。上午請學員以「我們公司應該如何經營，以建構下一個五年、十年」爲主題，進行分組討論，下午則請各小組向老闆以下的經營高層做簡報。有趣的是，大家上午跟下午所說的內容完全不一樣。


    上午大家熱烈討論的時候，其實出現了不少激進的意見，但是一到了老闆面前，就變成只說好聽話的乖寶寶。我們這些輔助討論的第三方引導者，雖然以「今天打破上下關係，从零思考開始」來循循善誘，但最後尖銳的聲音還是消失了。


    而打破這個局勢的，則是不看人臉色說話的外籍董事。一反而自家人會看對方的臉色，最後有頭無尾、沒有結論的草草結束。


    本來就應該要有健全的意見表達機制，讓主管可以正視不想面對的現實，大聲說出：「這是問題！」如果可以做到那樣，公司就會改變。但是他們做不到，因爲大家平時有意無意的避免提出自目的言論。平時就做不到的事情，不可能突然在老闆面前做得到。


    希望各位能夠擁有正視現實、敢於表達想法的勇氣，不要因爲過度察言觀色，使 自己成爲可有可無、如空氣般的角色。'
  - '[PAGE 159]


    # 拖延一點好處也沒有


    有句股市名言這麼說：「股市下跌（上升）不需要任何理由。」指的是以為股價會繼續漲（或繼續跌），但局勢說變就變，無法預測。只要一拖延決斷，機會就會從手中溜走。


    日常工作上的小問題，你也能夠不拖延、當場做出決定嗎？「做決定之前還要問過某人，不然之後會很麻煩。」「晚點再報告應該還好吧？」「正因為不逃避、面對麻煩的決策，才有辦法在關鍵時刻，不迷惘的立即採取行動。


    如果不那樣認真動畫累積小小的決策，當遇到一九八九年底的泡沫經濟破滅、二〇〇〇年網際網路泡沫化、二〇〇八年雷曼兄弟破產引發全球金融海嘯等改革之窗開啟的瞬間，便無法抓緊機會行動。改革順風的吹拂時間很短，當改革降溫，大家就會逐漸淡忘。「那個時候如果這麼做就好了」，現在後悔也來不及，只能耐心等待下一次改革順風的到來。'
  - '[PAGE 160]


    # 「等我當上○○再說」只是逃避的藉口


    「我還只是課長而已」、「等我當上經理之後就會好好做決斷」、「等我當上董事再說」，找各種理由推延做決定的人，即便真的當上了經理、董事，恐怕也無法做出決斷。


    只有在雙方有上下服從關係時，才有辦法管理部門的人，如果沒有名片上的頭銜，就無法影響他人。但即便不倚靠職務權力，也能做決定、影響他人，所以不要再因「等我當上經理」、「等我當上董事」等藉口拖延決斷，從做得到的地方開始，盡早開始訓練自己是非常重要的。


    無法立即做決定的人，會一直維持打鬥架式到最後關頭，然後拖到最後一刻突然舉白旗投降。


    在某間公司任職經營企劃部門的主管，碰巧被調到業績最差的事业部擔任經理。這個人經營企劃部的時期，對該事业部的批評砲火強烈，曾經抱怨：「你們打算要虧損到什麼時候啊？」然而，當他變成該事业部的主管之後，態度竟然三百六十度轉變，改口說：「我對部門的業績感到樂觀。」後來該事业部因為經營不善，決定收起來退出'
  - '[PAGE 161]


    市場，而那位部門經理直到最後仍然說著：「我們部門沒問題。」使事業在退出的過程中血流成河。


    經營者搞不好原本是希望那位部門經理，能擔任撤退戰役的重責，但當事人卻為了明哲保身，開始畫起吃不到的大餅。


    反倒是歐美企業，因為有問題的事業不會擺爛到不可收拾，因此進行組織重整時大多冷酷平淡。即便決定切割事業，賣給其他公司，原部門經理轉任到新公司的情況，也是稀鬆平常。如果交接做得好，工作評價也會提高。


    但很多人都非常眷戀原本的公司。我認為應該要好好思考一下，你是眷戀公司？還是事業部？孕育利潤，為社會提供附加價值的不是公司，而是事業部的經營。如果是對事業部感到眷戀還能理解，但如果只是眷戀公司的話，一點也不值得回首顧盼。而且，許多企業的人事考核制度，只有待在業績亮眼部門的「菁英」，才有辦法升官，即便在業績差的部門打了一場漂亮的撤退戰役，也無法獲得良好的評價。


    正因為這種制度，即便心想「等我當上經理就要這樣做」，也未必能成為主管。以「等我當上董事」「等我當上社長」為藉口，延遲做決定會讓機會溜走。現在可以做的決斷，就不要拖到以後再做，從平常應該養成立下決斷的習慣。'
  - '[PAGE 162]


    # 主管面臨的現實狀況——時間有限且少


    馬基維利在《君主論》提到，君主最感興趣的就是軍事。而企業的交戰前線就是現場，所以持續到現場巡視是非常重要的。


    一旦升到經理等級的職位，一整天的行程有大半都在開會，而且還是事有蹺蹺的會議。許多大企業的組織文化非常擅長打模糊仗、迴避風險，幾乎所有會議都只是彼此尊重的進度報告。共享資訊本身就有意義，只要大家知道了，就可以讓責任分擔的界線變得模糊。公司規模越大，曖昧不清越被视为美德。


    請回想一下你一天的工作。假如從早到晚，你一共參加了五場會議，在那當中你總共發言了幾分鐘呢？光聽部屬的報告，一整天就結束的情況，應該並不少見。然而，隨著職位爬升，一旦成為經營者之後，在會議上的認真程度會遠遠超過其他人。經營者擁有的資訊根本就不充足，因此必須一字不漏的仔細聽取報告，而且被詢問意見時，還得立即回覆，根本沒有時間可以打瞌睡。'
  - '[PAGE 163]


    自己工作上的時間會越來越少。但即便如此，也必須將七成的時間花費在部屬身上。如此一來，若工作生產力未有顯著的提升，恐怕連自己的工作也會做不好。


    對沒有時間的主管而言，零碎的五分鐘、十分鐘也是很寶貴的，因此根本沒有閒暇可以瀏覽網路，再加上超過五十歲後體力會逐漸衰退，也無法承受長時間工作。所以，若不提升工作生產力，不但無法好好完成工作，最糟的情況甚至會生病倒下。這些都是主管面臨的現實狀況。


    為了隨時隨地都能站上前線，即便時間有限，也必須保留戰鬥力以備不時之需。因此對主管而言，必須盡量保留時間，親自到現場巡視，跟第一線現場人員對話、溝通，不要讓自己離現場太遠。


    在過去，主管只要在現場提供的採購單上蓋章核可，就能讓組織運作。公司高層只要在會議上露臉，於會議結束後招待客戶吃飯喝酒，跟客戶維持良好關係就好，但現在的公司沒那麼多閒暇時間。想成爲組織中發揮功能的主管，就必須提高工作生產力，並保留親自造訪現場，汲取最新資訊的時間。如果平時不把牙齒磨得又尖又利，讓自己隨時都能用利牙在戰場上廝殺的話，遇到關鍵時刻便會無法戰鬥，好不容易練就一身的全黑技術，也只是白費工夫罷了。'
  - '[PAGE 164]


    <!-- no content -->'
  - '[PAGE 165]


    ![](img/c5f4a27546ec03b05790e1504b0b945b_165_0.png)


    # 操縱人心的三種能力'
  - '[PAGE 166]


    暗黒技術是影響他人，對組織帶來影響，支配局勢的能力。操縱老闆，掌握部屬，運用分布於組織中網絡關係的突觸，按計畫取得勝利，讓他人按自己的意思行動是首要之務。


    影響他人的能力，可以細分成下面三種。


    # 影響他人的能力①——雙面溝通


    溝通是影響他人不可或缺的步驟。若雙方溝通不足，自目的發言便容易产生誤解。組織領導者的任務不在於打造有默契、不需要說出來就能相互配合的職場文化，而是提供一個不需要看彼此臉色，可以自由發表意見，將想法化爲言語表達出來，相互溝通的工作環境。


    溝通能力有光明跟黑暗兩面。光明面的溝通能力是用道理說服他人，而黑暗面的溝通能力則是動之以情。只要缺少某一種溝通能力，就無法讓別人按自己的意思行動。利用演繹推理思考事物，首先假設結論，然後說明理由…：像這樣口若懸河、有'
  - '[PAGE 167]


    邏輯的說明，有時效果十足，但有時候光用邏輯也無法說服所有人。這個時候，先逐步表達，了解並同情對方的處境，然後再以誠懇的語氣說：「但這個地方改成這樣會更好喔。」來說服對方會比較有效果。特別是在公司不得不裁員等情況，比起一開頭就說：「下個月工廠就要關閉，因為……」與其開始說明理由，不如先跟員工低頭道歉：「現在公司面臨到這樣的狀況，我們用盡了各種方法，但還是不得不關閉工廠，懇請各位諒解。「反而比較能讓對話順利進行。


    相反的，當斥責對方時，與其動之以情，不如說之以理。例如：「你這邊有問題，為什麼呢？因為……」「有邏輯的斥責，比較能讓對方接受。所以必須依據不同的情況，切換不同的溝通型態。領導者必須擁有分開運用情與理的能力。


    # 看懂財務三表是領導者的必備技能


    對數字敏銳是另一個光明面的溝通能力，同時也是領導者的必備技能之一。特別是損益表、資產負債表和現金流量表，是領導者必須看懂的財務報表。如果連這三張表'
  - '[PAGE 168]


    都看不懂的話，還真是無計可施，所以不太有把握能看懂這三張表的人，最好現在就開始學習如何閱讀財務報表。


    看懂這三種財務報表有什麼好處呢？第一，可以了解自己所屬部門的獲利機制；第二，嗅出其中的不對勁；第三，進而找出因應的對策跟數字。


    負責經營事業的人，應該對損益表很熟悉。收入是多少、成本是多少、利益又是多少，腦中總是想著這些數字，所以沒問題。但換成是資產負債表，就沒那麼清楚了。公司投入了多少現金、投資多少金額的設備跟營運資金，那些資金跟設備的投入有讓公司正常運作嗎？還是營運不良呢？如果你只顧著看損益表，沒去看資產負債表，很容易忽略延伸自這兩張報表的現金流量表。如此，便無法經營好一間公司。公司營運狀況的好壞也要看現金流量多寡。只看損益表營運的公司，容易引來明明賺錢，卻因為資金周轉不靈導致倒閉的危機。


    某間公司要求新上任的事業部經理，閱讀並分析過去十年的財務報表，向經營高層報告。那位經理雖然大概懂收入、成本跟利益，但是從來沒看過財務報表，所以非常焦急。


    在《重回賺錢企業的舞台！（富山和彥著）》書中，詳細說明了公司的獲利機制。


    168

    暗黑祕術'
  - '[PAGE 169]


    例如，某間公司的外部變動成本占了成本的七成，如果是這樣的話，即便以規模經濟為目標，擴大生產規模，成本也降不下來。反而是做好個別產品的收益管理，區分有獲利跟沒獲利的產品，然後淘汰沒獲利的產品，繼續生產可以獲利的產品，就像是車子的煞車跟油門，將產品區分開來才能夠提高獲利。


    但那間公司業務部的績效評核，卻是以營業收入為基準。如此一來，業務人員心中便將利益置之處外，滿腦筋都是想著該如何衝高營業額。結果，營業收入的確有成長，但營業利益率卻降低了。


    在這個例子，若公司重視利益的話，雖然短期內營業收入可能會減少，但是營業利益率會顯著提升，大大提高公司的賺錢能力。像這樣，如果搞不清楚自己公司的獲利機制，就很有可能會做出「再衝高營業額」的錯誤指示。


    # 嗅出不對勁的數字，找出對策


    能否讀懂財務報表的第二個判斷指標，就是在評估交易對象或併購對象的時候，


    ![](img/c5f4a27546ec03b05790e1504b0b945b_169_0.png)'
  - '[PAGE 170]


    「重點在於能否找出矛盾的地方，從數字當中嗅出不對勁。」


    也就是閱讀其他公司財務報表時，能否敏銳嗅出「好像有點不對勁」的地方。不是像教科書分析營業利益率（營業利益佔總營收的比例）是多少，而是找出不合理的地方。重點在於能否找出矛盾，從數字當中嗅出不對勁。


    例如，與去年同期比較，若庫存降低，應收帳款減少的話，可以推測現金應該是相對增加的。如果現金增加了，負債會降低，但短期借款卻增加了。原本應該是增加的現金跑去哪了呢？嗅出不對勁的你，繼續往下調查……這聽起來好像是在追查會計假帳，但即便不是在調查假帳，只要仔細觀察現金的流動，應該會找到讓人覺得「嗯？」的地方。當數字違背常理時，原因出在什麼地方呢？如果能夠從單純的疑問出發，透過仔細來回閱讀這三張財務報表，找出蹊蹺之處的話，就算是合格了。


    第三個必須具備的能力就是，找出改善措施。但其實讓損益表、資產負債表和現金流量表，這三張報表的數字變漂亮的方法，各有微妙的差異，三者無法同時兼顧。想'
  md: '

    主動出擊的部屬，決定了主管的實力，一點也不爲過。部屬就是自己的借鏡。


    ## 花七成時間在部屬身上


    進一步闡釋各種回饋的聲音，可以發現有許多部屬表示：「希望主管花更多時間在自己身上。」「部屬都希望主管能將注意力放在自己身上。」


    將七成的時間用在部屬身上剛好用。雖說規畫三成時間用在客戶應對與公司內部協調，剩下的七成用在部屬身上，但實際上會有各種突發狀況跟業務需要調整，因此自己的工作跟培育部屬的時間，兩者比例最後應該會差不多各半。但如果一開始就決定只把一半時間分給部屬的話，最後只會花兩到三成的時間。如果變成那樣，就無法解決部屬的不滿了。


    同事聚會上的話題，大多是在講主管的壞話：「經理總是嘴巴這樣說，但卻不那樣做。「這樣的話，經理本人根本不會聽到。然而，如果主管有辦法聽到部屬的不滿，兩者的關係便會產生劇烈的變化。這就是為什麼主管必須藉由一對一的面談，問出部屬對什麼感到不滿。


    「從部屬的多樣性，便可看出主管的氣度。」


    內心安排七成，實際花費五成时间在部屬身上的話，「原來經理這麼在乎我」，便能建立起信賴感，培育出發生緊急狀況時，如左右手般行動的部屬。改用暗黑方式也可以說是表現得好像是為了部屬花費七成的時間，但實際上是為了達成目的，而投資自己七成的時間。


    大家都知道奇異公司投資非常多資源在培育人才。例如，奇異有一種名叫「就職會制度」的職務輪調制度，員工每兩年可以依據個人意願，調任至其他部門，經理沒有阻止員工的權限。也就是說，哪個部門的人可以用、哪個不行，哪個部門的經理培育不出好部屬，經理之間全部都都知道。部屬全跑光，而且沒有其他人願意進來的主管，根本不配當部門經理。


    好主管培育出來的有能部屬，在下個地方也會表現活躍。部屬之間會交流資訊，


    ![](img/c5f4a27546ec03b05790e1504b0b945b_148_0.png)

    ![](img/c5f4a27546ec03b05790e1504b0b945b_148_1.png)


    討論哪位主管最熱心教育。經理之間的討論更是熱烈，誰是怎样的人，彼此會認真交流資訊。奇異公司這個制度巧妙的地方在於，主管跟部屬之間，產生了上下相互監督的正向效果。


    ## 沒有執念的人請放棄成為領導者


    在日常從事間諜戰的人，隨著位置爬得越高，就會越加孤獨。即便身旁有追求相同目的的夥伴，彼此關係卻淡如水，不會像學生時代的朋友那樣水乳交融。


    原本愉快的午餐時間，也隨著職位的爬升，逐漸變成一個人囫圇扒嘬、草草結束。但如此畫分清楚是有必要的。


    而且，有能力的人很多都是怪人。他們不是什麼都會的全方位人才，而是專精某一領域的知識與能力，對該領域有非比尋常的執念。那不是普通的願望，而是不論別人怎麼說，都要想盡辦法實現的執念。


    ## 你有多少领导者魅力？


    剛上任就遇到危機的小松製作所坂根正弘社長，或是日立的前川村隆社長等，他們都是排除萬難也要實現改革，擁有強烈信念的人。徹底改變過去的做法，將改革大刀揮向公司的體制結構。在反對改革的保守勢力強勢的威脅下，若經營者沒有堅持改革的執念，很有可能會失敗，輕易恢復原狀。如果沒有想要達成什麼的執著，便無法成為推動改革的真正領袖。


    如果知道自己沒有那種執念，從一開始就不要以成為領導者為目標。現今工作型態多元，像過去那樣在終身雇用制度下，全體員工以成為領導者為目標的時代已經結束了。運用自己的專長成為專業人員也好，成為經營高層的參謀也行，或是順從欲望，過自己想過的人生都可以。生活型態選擇多元，只要找到最適合自己的生活方式，就能讓日子過得很快樂。


    > 「工作完全仰賴頭銜的人，在失去頭銜的瞬間，底下的人就會一一離去。」


    過去的領導力是以職務權力為基礎。社長或經理的頭銜具有相當的意義，比起因為個人，大家更因為頭銜而選擇服從。然而，現在光只有職務權力，是無法管理部屬的。勝負關鍵在於擁有多少領導魅力。


    利用頭銜的威權管理，容易變成利用部屬產生恐懼心的恐怖政治。但歷史已經證明，恐怖統治無法持久，總有一天民眾會反撲。而且，工作完全仰賴頭銜的人，在失去頭銜的瞬間，底下人便會一一離去。


    如果某位經理問下頭的年輕部屬：「今天要不要去喝一杯？」對方反問：「有加班費嗎？」就表示部屬覺得不值得跟這個人去吃飯喝酒。也就是說，對方對主管沒有期待。若部屬覺得「想聽聽這個人的想法」、「和這個人攀上關係有好處」的話，應該不至於每次都拒絕邀約。


    不利用職務威權讓對方聽話，你的領導魅力是否足以讓別人覺得「如果是這個人的話，我願意幫他做事」呢？那樣的領導魅力必須從平日的言行舉止中不斷累積、培養。


    領導能力不是與生俱來的。如果能夠盤點過去的經驗，掌握自己的強項跟弱點之後，避開容易落人的陷阱，不斷與部屬溝通交流的話，自然可以發揮出領導能力。


    雖然說領導能力是培養出來的，但培養方式因人而異、千差萬別，因此即便想要模仿某人的做法，也未必可行。隨著不同的性格與人生態度，每個人培養領導力的方法當然也就不同，只能不斷尋找適合自己的方法。


    你重視什麼樣的價值觀？是依據什麼信念，想往哪個方向前進？你到最後是怎麼樣的人？想要實現什麼夢想？從目標回推出應執行的項目，是靈活運用暗黑技術，真正領導者應有的樣子。領導能力的培養方法沒有唯一的標準答案，只能靠自己去尋找出屬於自己的方法。


    ## 第一部：暗黒技術の使用訣竅 DARK SIDE KILL


    ## 第二部：DARK SIDE SKILL


    第二部將為各位解說，實練、運用暗黑技術時應具備的心態。


    - 訣竅一：做好隨時上戰場的準備。

    - 訣竅二：操縱人心的三種能力。

    - 訣竅三：成為言行一致的領導者。


    暗黑技術一旦用錯方法，容易招致不好的結果。希望各位能夠清楚理解以下列舉的訣竅，避免一不小心跌入黑暗深淵。


    ## 訣竅一：做好隨時上戰場的準備


    ### 「理解什麼是情與理的中間點，才有辦法影響他人。」


    「人只看看自己想看的現實」，這句凱薩大帝的名言其實呈現了人類的本性。只看自己想看的現實，可能會讓人感到舒適自在，但是無法從中獲得任何成長。你有辦法正視不想面對的現實，保持客觀而不手足無措嗎？借用擁有這勇氣的
    IGPI 富山社長的話：「理解什麼是情與理的中間點，才有辦法影響他人。」


    合乎經濟理性的判斷，冷靜思考商場局勢的時候，最能夠引導出客觀、有邏輯的解答方法。這個事業持續下去業績也不會回升，所以必須賣掉或進行組織重整，思考下一步應該怎麼走等，不用外面的人來說，在公司工作數十年的人當然知道這點道理。即使大家內心清楚，但卻沒有任何人說出口，因為職場上瀰漫著「這話講出來就完了」的氛圍。


    ### 聽不到真話的職場


    面臨倒閉危機的企業，力挽狂瀾進行組織重整、再造時，必須決定要把哪個事業收起來、要關掉哪間工廠。其實只要是該企業的員工，大家都知道應該從哪邊下刀改革，但卻害怕說不出口。從日本產業振興機構曾經出手協助過的佳麗寶等多間公司都是如此，大家從不想面對的現實移開視線，知道事實卻不明講。明明很清楚，但卻沒有人公開說出來。


    爲什麼大家說不出口呢？最大的理由就是明哲保身。因爲在指出問題的瞬間，很可能自己就會因此消失，所以沒有人敢飛蛾撲火。當人職位越爬越高，就會變得越來越無法容忍失敗，心想：「要是在這個場合說了真話，職位恐怕不保，我才不幹這種傻事呢。」便決定噤口不言。


    經理之間相約吃飯喝酒，即便席上大家都說：「不那樣做是不行的。」但是卻沒有人在公開場合說出來。


    這是我爲日本代表性國際企業，數十位熱行董事等級的學員舉辦研習營時發生的故事。上午請學員以「我們公司應該如何經營，以建構下一個五年、十年」爲主題，進行分組討論，下午則請各小組向老闆以下的經營高層做簡報。有趣的是，大家上午跟下午所說的內容完全不一樣。


    上午大家熱烈討論的時候，其實出現了不少激進的意見，但是一到了老闆面前，就變成只說好聽話的乖寶寶。我們這些輔助討論的第三方引導者，雖然以「今天打破上下關係，从零思考開始」來循循善誘，但最後尖銳的聲音還是消失了。


    而打破這個局勢的，則是不看人臉色說話的外籍董事。反而是自家人會看對方的臉色，最後有頭無尾、沒有結論的草草結束。


    本來就應該要有健全的意見表達機制，讓主管可以正視不想面對的現實，大聲說出：「這是問題！」如果可以做到那樣，公司就會改變。但是他們做不到，因爲大家平時有意無意的避免提出自目的言論。平時就做不到的事情，不可能突然在老闆面前做得到。


    希望各位能夠擁有正視現實、敢於表達想法的勇氣，不要因爲過度察言觀色，使自己成爲可有可無、如空氣般的角色。


    ### 拖延一點好處也沒有


    有句股市名言這麼說：「股市下跌（上升）不需要任何理由。」指的是以為股價會繼續漲（或繼續跌），但局勢說變就變，無法預測。只要一拖延決斷，機會就會從手中溜走。


    日常工作上的小問題，你也能夠不拖延、當場做出決定嗎？「做決定之前還要問過某人，不然之後會很麻煩。」「晚點再報告應該還好吧？」正因為不逃避、面對麻煩的決策，才有辦法在關鍵時刻，不迷惘的立即採取行動。


    如果不那樣認真動畫累積小小的決策，當遇到一九八九年底的泡沫經濟破滅、二〇〇〇年網際網路泡沫化、二〇〇八年雷曼兄弟破產引發全球金融海嘯等改革之窗開啟的瞬間，便無法抓緊機會行動。改革順風的吹拂時間很短，當改革降溫，大家就會逐漸淡忘。「那個時候如果這麼做就好了」，現在後悔也來不及，只能耐心等待下一次改革順風的到來。


    ### 「等我當上○○再說」只是逃避的藉口


    「我還只是課長而已」、「等我當上經理之後就會好好做決斷」、「等我當上董事再說」，找各種理由推延做決定的人，即便真的當上了經理、董事，恐怕也無法做出決斷。


    只有在雙方有上下服從關係時，才有辦法管理部門的人，如果沒有名片上的頭銜，就無法影響他人。但即便不倚靠職務權力，也能做決定、影響他人，所以不要再因「等我當上經理」、「等我當上董事」等藉口拖延決斷，從做得到的地方開始，盡早開始訓練自己是非常重要的。


    無法立即做決定的人，會一直維持打鬥架式到最後關頭，然後拖到最後一刻突然舉白旗投降。


    在某間公司任職經營企劃部門的主管，碰巧被調到業績最差的事业部擔任經理。這個人經營企劃部的時期，對該事业部的批評砲火強烈，曾經抱怨：「你們打算要虧損到什麼時候啊？」然而，當他變成該事业部的主管之後，態度竟然三百六十度轉變，改口說：「我對部門的業績感到樂觀。」後來該事业部因為經營不善，決定收起來退出市場，而那位部門經理直到最後仍然說著：「我們部門沒問題。」使事業在退出的過程中血流成河。


    經營者搞不好原本是希望那位部門經理，能擔任撤退戰役的重責，但當事人卻為了明哲保身，開始畫起吃不到的大餅。


    反倒是歐美企業，因為有問題的事業不會擺爛到不可收拾，因此進行組織重整時大多冷酷平淡。即便決定切割事業，賣給其他公司，原部門經理轉任到新公司的情況，也是稀鬆平常。如果交接做得好，工作評價也會提高。


    但很多人都非常眷戀原本的公司。我認為應該要好好思考一下，你是眷戀公司？還是事業部？孕育利潤，為社會提供附加價值的不是公司，而是事業部的經營。如果是對事業部感到眷戀還能理解，但如果只是眷戀公司的話，一點也不值得回首顧盼。而且，許多企業的人事考核制度，只有待在業績亮眼部門的「菁英」，才有辦法升官，即便在業績差的部門打了一場漂亮的撤退戰役，也無法獲得良好的評價。


    正因為這種制度，即便心想「等我當上經理就要這樣做」，也未必能成為主管。以「等我當上董事」「等我當上社長」為藉口，延遲做決定會讓機會溜走。現在可以做的決斷，就不要拖到以後再做，從平常應該養成立下決斷的習慣。


    ### 主管面臨的現實狀況——時間有限且少


    馬基維利在《君主論》提到，君主最感興趣的就是軍事。而企業的交戰前線就是現場，所以持續到現場巡視是非常重要的。


    一旦升到經理等級的職位，一整天的行程有大半都在開會，而且還是事有蹺蹺的會議。許多大企業的組織文化非常擅長打模糊仗、迴避風險，幾乎所有會議都只是彼此尊重的進度報告。共享資訊本身就有意義，只要大家知道了，就可以讓責任分擔的界線變得模糊。公司規模越大，曖昧不清越被视为美德。


    請回想一下你一天的工作。假如從早到晚，你一共參加了五場會議，在那當中你總共發言了幾分鐘呢？光聽部屬的報告，一整天就結束的情況，應該並不少見。然而，隨著職位爬升，一旦成為經營者之後，在會議上的認真程度會遠遠超過其他人。經營者擁有的資訊根本就不充足，因此必須一字不漏的仔細聽取報告，而且被詢問意見時，還得立即回覆，根本沒有時間可以打瞌睡。


    自己工作上的時間會越來越少。但即便如此，也必須將七成的時間花費在部屬身上。如此一來，若工作生產力未有顯著的提升，恐怕連自己的工作也會做不好。


    對沒有時間的主管而言，零碎的五分鐘、十分鐘也是很寶貴的，因此根本沒有閒暇可以瀏覽網路，再加上超過五十歲後體力會逐漸衰退，也無法承受長時間工作。所以，若不提升工作生產力，不但無法好好完成工作，最糟的情況甚至會生病倒下。這些都是主管面臨的現實狀況。


    為了隨時隨地都能站上前線，即便時間有限，也必須保留戰鬥力以備不時之需。因此對主管而言，必須盡量保留時間，親自到現場巡視，跟第一線現場人員對話、溝通，不要讓自己離現場太遠。


    在過去，主管只要在現場提供的採購單上蓋章核可，就能讓組織運作。公司高層只要在會議上露臉，於會議結束後招待客戶吃飯喝酒，跟客戶維持良好關係就好，但現在的公司沒那麼多閒暇時間。想成爲組織中發揮功能的主管，就必須提高工作生產力，並保留親自造訪現場，汲取最新資訊的時間。如果平時不把牙齒磨得又尖又利，讓自己隨時都能用利牙在戰場上廝殺的話，遇到關鍵時刻便會無法戰鬥，好不容易練就的一身全黑技術，也只是白費工夫罷了。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_165_0.png)


    ## 操縱人心的三種能力


    暗黒技術是影響他人，對組織帶來影響，支配局勢的能力。操縱老闆，掌握部屬，運用分布於組織中網絡關係的突觸，按計畫取得勝利，讓他人按自己的意思行動是首要之務。


    影響他人的能力，可以細分成下面三種。


    ### 影響他人的能力①——雙面溝通


    溝通是影響他人不可或缺的步驟。若雙方溝通不足，自目的發言便容易产生誤解。組織領導者的任務不在於打造有默契、不需要說出來就能相互配合的職場文化，而是提供一個不需要看彼此臉色，可以自由發表意見，將想法化爲言語表達出來，相互溝通的工作環境。


    溝通能力有光明跟黑暗兩面。光明面的溝通能力是用道理說服他人，而黑暗面的溝通能力則是動之以情。只要缺少某一種溝通能力，就無法讓別人按自己的意思行動。利用演繹推理思考事物，首先假設結論，然後說明理由…：像這樣口若懸河、有邏輯的說明，有時效果十足，但有時候光用邏輯也無法說服所有人。這個時候，先逐步表達，了解並同情對方的處境，然後再以誠懇的語氣說：「但這個地方改成這樣會更好喔。」來說服對方會比較有效果。特別是在公司不得不裁員等情況，比起一開頭就說：「下個月工廠就要關閉，因為……」與其開始說明理由，不如先跟員工低頭道歉：「現在公司面臨到這樣的狀況，我們用盡了各種方法，但還是不得不關閉工廠，懇請各位諒解。」反而比較能讓對話順利進行。


    相反的，當斥責對方時，與其動之以情，不如說之以理。例如：「你這邊有問題，為什麼呢？因為……」有邏輯的斥責，比較能讓對方接受。所以必須依據不同的情況，切換不同的溝通型態。領導者必須擁有分開運用情與理的能力。


    ### 看懂財務三表是領導者的必備技能


    對數字敏銳是另一個光明面的溝通能力，同時也是領導者的必備技能之一。特別是損益表、資產負債表和現金流量表，是領導者必須看懂的財務報表。如果連這三張表都看不懂的話，還真是無計可施，所以不太有把握能看懂這三張表的人，最好現在就開始學習如何閱讀財務報表。


    看懂這三種財務報表有什麼好處呢？第一，可以了解自己所屬部門的獲利機制；第二，嗅出其中的不對勁；第三，進而找出因應的對策跟數字。


    負責經營事業的人，應該對損益表很熟悉。收入是多少、成本是多少、利益又是多少，腦中總是想著這些數字，所以沒問題。但換成是資產負債表，就沒那麼清楚了。公司投入了多少現金、投資多少金額的設備跟營運資金，那些資金跟設備的投入有讓公司正常運作嗎？還是營運不良呢？如果你只顧著看損益表，沒去看資產負債表，很容易忽略延伸自這兩張報表的現金流量表。如此，便無法經營好一間公司。公司營運狀況的好壞也要看現金流量多寡。只看損益表營運的公司，容易引來明明賺錢，卻因為資金周轉不靈導致倒閉的危機。


    某間公司要求新上任的事業部經理，閱讀並分析過去十年的財務報表，向經營高層報告。那位經理雖然大概懂收入、成本跟利益，但是從來沒看過財務報表，所以非常焦急。


    在《重回賺錢企業的舞台！（富山和彥著）》書中，詳細說明了公司的獲利機制。


    ![](img/c5f4a27546ec03b05790e1504b0b945b_169_0.png)


    例如，某間公司的外部變動成本占了成本的七成，如果是這樣的話，即便以規模經濟為目標，擴大生產規模，成本也降不下來。反而是做好個別產品的收益管理，區分有獲利跟沒獲利的產品，然後淘汰沒獲利的產品，繼續生產可以獲利的產品，就像是車子的煞車跟油門，將產品區分開來才能夠提高獲利。


    但那間公司業務部的績效評核，卻是以營業收入為基準。如此一來，業務人員心中便將利益置之處外，滿腦筋都是想著該如何衝高營業額。結果，營業收入的確有成長，但營業利益率卻降低了。


    在這個例子，若公司重視利益的話，雖然短期內營業收入可能會減少，但是營業利益率會顯著提升，大大提高公司的賺錢能力。像這樣，如果搞不清楚自己公司的獲利機制，就很有可能會做出「再衝高營業額」的錯誤指示。


    ### 嗅出不對勁的數字，找出對策


    能否讀懂財務報表的第二個判斷指標，就是在評估交易對象或併購對象的時候，


    「重點在於能否找出矛盾的地方，從數字當中嗅出不對勁。」


    也就是閱讀其他公司財務報表時，能否敏銳嗅出「好像有點不對勁」的地方。不是像教科書分析營業利益率（營業利益佔總營收的比例）是多少，而是找出不合理的地方。重點在於能否找出矛盾，從數字當中嗅出不對勁。


    例如，與去年同期比較，若庫存降低，應收帳款減少的話，可以推測現金應該是相對增加的。如果現金增加了，負債會降低，但短期借款卻增加了。原本應該是增加的現金跑去哪了呢？嗅出不對勁的你，繼續往下調查……這聽起來好像是在追查會計假帳，但即便不是在調查假帳，只要仔細觀察現金的流動，應該會找到讓人覺得「嗯？」的地方。當數字違背常理時，原因出在什麼地方呢？如果能夠從單純的疑問出發，透過仔細來回閱讀這三張財務報表，找出蹊蹺之處的話，就算是合格了。


    第三個必須具備的能力就是，找出改善措施。但其實讓損益表、資產負債表和現金流量表，這三張報表的數字變漂亮的方法，各有微妙的差異，三者無法同時兼顧。想

