    # 中階主管是企業向上發展的最大關鍵


    「前言」


    二十一世紀之後，從二○○八年雷曼兄弟破產引發全球金融海嘯、二○一一年日本三·一大地震的劇烈外部環境變化，乃至人工智慧與大數據分析等技術創新，非連續性的變化接二連三發生。而且那樣的變化，很多都是同時發生於世界各地，但地球另一端發生的事情，也多少會影響到我們。在這樣的環境下，企業該如何從逆境中勝出？面對非連續性的變化，企業也必須以非連續性的改革應對。而改革的關鍵是什麼呢？


    我所任職的經營共创基盤顧問公司（Industrial Growth Platform, Inc.，以下簡稱 IGP）專門輔導企業的重整跟再造。IGP 從經營管理顧問、企業併購諮詢、投資新創公司跟大企業到製造業的生產流程改善，甚至是地方巴士公司的經營等，業務內容非常廣泛。而我的主要工作，則是協助歷史悠久的企業打進國際市場，也就是針對「又久又大的公司」提供經營管理的協助。


    如果用來比喻的話，我的客戶有：不馬上動手術就會危及生命的公司；雖然沒'
  - '[PAGE 12]


    有攸關性命症狀，但是必須徹底改善生活方式的公司；身體狀況非常良好，但是想維持並持續增進健康，而不斷鍛練體魄的公司；想在奧運贏得金牌般，以世界第一爲目標努力訓練自我的公司。我協助過非常多種類的公司。


    然而，在這類如此多元廣泛，擁有不同問題的公司之間，卻有著相似的共同點。例如：大家彼此協調，共同決定事物，「以和爲貴」爲一切行動宗旨；視默契配合爲溝通的基本原則，認爲察言觀色是美德；用強烈的歸屬感使員工對公司產生高度忠誠，但同時有排除外人的傾向。


    無論是有經營危機的公司，還是以世界第一爲目標的公司，雖然有程度上的差異，但他們幾乎都擁有上述的特徵。而且，據企業經營大老所言，他們從很久以前就有這些特質。


    在本書，我並不是主張這樣的價值觀已經跟不上時代，應該徹底改變、捨棄。就像是硬幣有正反兩面一樣，任何特質都有好的一面和壞的一面。若想讓公司擁有的價值觀朝向正面發展，應該怎麼做才好呢？就我多年來接觸過許多企業經營的經驗來說，關鍵就在於公司的主管，也就是經理、課長等職位的主管身上。'
  - '[PAGE 13]


    # 用「見不得人」的工作技能助你一臂之力


    本書的目的是想助這些主管一臂之力。


    應該有很多人看到書名有「暗黑」兩個字，腦袋就浮現出邪惡中心、黑暗世界等意象吧？雖不盡然如此，但也沒有相差太遠。說到推動事業時所需的技能，我們可以舉出邏輯思考能力、財務會計知識等硬體面的技能，本書將之稱為「光明技術」。


    當然，那些是實際推動事業時的重要技能，無須爭辯。然而，想要說服血肉之軀的人，幫助組織動起來，並改變擁有強烈慣性的大公司的行進方向，就必須用上見不得人的「暗黑技術」。利用人際關係影響他人，有時甚至必須操縱對方，讓別人按自己的意思行動。


    這些技術並不是指溝通或是軟性技能這類光鮮亮麗的東西。你必須好好的面對自己，跳進內心深處的黑暗沼澤，才有辦法習得。甚至必須想像，並巧妙的利用他人的黑暗面。


    本書將介紹各種暗黑技術，提供主管一些實用的概念，協助他們打造強健的體制，


    013


    前言 中階主管是企業向上發展的最大關鍵'
