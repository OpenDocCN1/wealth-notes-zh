    二) 的前會長坂根正弘，就是能夠靈活運用不同牌的高手，一旦決定了就絕不妥協。例如，當公司在導入 ERP 系統(Enterprise Resources Planning)時，便將系統分成兩部分；一個是重視小松才能提供的附加價值，黑箱化過程，依據需求，客製化成自家規格；另一個則是重視成本，徹底實施標準化作業。現場人員不想改變以往的工作方式，所以會期望將系統客製化成自家規格，但對於沒競爭力的產品，坂根則堅守標準化來降低成本，一律將反對意見壓下去。


    此外，坂根決定只裁員一次，一次就把組織的膿包擠乾淨。除此之外，將重心放在產品的開發跟生產上的「頂點經營」策略，也使小松脫胎換骨，成爲真正放眼國際的世界級企業。


    領導者需要的就是那樣的魄力跟鐵腕。另外，總是在意外外部評價是不行的，必須要有自己的核心價值。只要有核心價值，即便遇到反抗，也能夠以「那又如何」的態度克服困難。


    在意外部評價的人，雖然不與人爲敵，而與人爲善，但是在決勝負的關鍵時刻，無法做出英明的決斷。'
  - '[PAGE 104]


