    J R 則用「黏土層」一詞來形容課長、主任等中階主管。上頭的指示就像是雨水一樣，由上往下滲透。然而，土壤當中有黏土層，雨水遇到黏土層便無法往下滲透。也就是說，這個中間層不會往下傳遞資訊。在組織當中必定會發生這種現象。所以想要改變，就必須有所作爲。


    例如，每個星期一的上半舉行業務會議，這是公司最重要的會議。在這個會議上的決議事項，會在下午於部門會議上，由經理向部屬仔細說明。然後經理再依據決議加上自己的想法之後，思考當週的行動計畫。然而，在說明業務會議決議事項的階段，只有不到一半的內容有正確傳達出去，因爲經理只會傳達自己有興趣的內容。

    如果經理在部門會議上未正確傳遞資訊的話，會讓人非常困擾。因此，公司建立了一個名為「DI NA」的系統，讓總公司的全體員工，在業務會議結束之後，登入系統便可直接看到會議的決議內容。DI
    NA 是取 Dead Line（完成期限）、Instruction（指示）、Notice（聯絡）、Agenda（會議紀錄）的第一個英文字母縮寫。系統的畫面可以一次瀏覽所有內容，已經閱覽的人便會顯示○，部屬全部都看過之後，部門就會顯示○。打×表示部門當中有人沒閱覽內容，部門經理透過系統便能確認是誰還沒看，直接指'
