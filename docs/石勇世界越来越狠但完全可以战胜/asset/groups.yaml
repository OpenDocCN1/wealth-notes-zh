    # 自序


    越变，越狠


    我们生活、工作于其中的世界，正变得越来越狠。无论是否承认，这就是现实。


    你见过很多狠人，被他们在利益上和伤害上伤害；也许你自己本身就是一个狠人，或在受伤后，正强迫自己变狠。


    这种狠，既可能是对别人狠，也可能是对自己狠。无论哪一种，我们都不会有什么安全感、幸福，以及自我成长可言。


    因为我们活在这个世界上，不是为了对别人或自己狠的——对别人狠，一个人已经先对自我下了狠手；而一个人如果是对自己狠，更是和自己过不去。


    透过这种狠，我看到了它背后的心理、社会机制。我还看到它已经变成了一种社会性格。


    在今天，既保持我们的自我、人性不丢，同时又能在一个狠世界中保护好我们自己的利益和心理不被伤害，是一个必须面对、解决的问题。'
  - '[PAGE 4]


    # 我们如何来对付一个狠世界？


    该分析和揭秘的，以及该说的方法论都在书里了。在这里，我只想提示一下我们应该具备的思维。


    曾有人把我的一本书《世界如此险恶，你要内心强大》和李宗吾的《厚黑学》、吴思的《潜规则》相提并论。它们确实都残酷地说出了各自关注领域的真相。我还阐述了一个破译我们为什么内心弱小，容易被害人在心理上吞食的机密的概念——“社会价值排序”。


    但我有我的独特性。我的思维从来就是：冷静地，甚至恶狠狠解剖可能伤害我们的某些东西，然后，给出一个方法论去战胜它们。


    战胜它们的前提，是看清楚它们的本质，是怎么玩的，然后，获得智力优势和心理优势，培养战胜它们的能力


    解决问题的最好方式就是具有解决问题的能力，这就是我们面对一切要对付的东西时应该具有的思维。这种能力包括头脑上的，心理上的——比如头脑的洞察力、心理的洞察力、分析能力、强大的内心。这一点，在《世界如此险恶，你要内心强大》(1、2)这两本书里，我讲得够多了。


    当我们直面世界变狠的问题，这一思维同样管用。


    意大利政治学家马基雅维利在写《君王论》，英国哲学家霍布斯在写《利维坦》时，都分别说到了“政治世界”，以及“自然状态”的狠。霍布斯甚至非常形象地说，在自然状态下，“人对人是狠”。


    今天我们所处的，不是社会的“自然状态”，也不是纯粹“政治世界”，而是一个生活和工作、利益和心理被裹入其中的现实世界。


    哲学家赵汀阳说，霍布斯只是在教人变坏。我想说，马基雅维利更是在教人变狠。而真正的问题是：我们必须学会对付一个狠世界。


    懂得一些道理是必需的，但如果一个人不懂如何运用这些道理来武'
  - '[PAGE 5]


    装头脑和内心，从而让这些道理变成他的存在的一部分，它们并没有什么用。用来揭示变狼背后的心理机制、社会机制的方法，是一门艺术的 同时，也应该是一种技术。


    石勇


    2013年7月20日'
  - '[PAGE 6]


    # # 导 言

    ## 对付一个变狠的世界


    # ## 今天，人们正在变狠


    有两个不一样的中国。


    一个是新闻联播里的中国。活在新闻联播里，我们是多么幸福，充满希望和信心，每天都可以做“中国梦”。但时间只有 30 分钟。


    30 分钟之外，是另一个中国，现实、真实、残酷。


    小白领王君几乎每天都要面对这样的中国。


    她对我说，她的上司是一个施虐狂，经常冲她发脾气，还喜欢刁难她。她被折磨得快疯了，但又不敢辞职，谁知道能不能找到一个比现在不差的工作呢？作为资浅房奴，她还要和老公一起还房贷呢！


    不知道为什么，那天，这个问题突然让我感到痛苦。她明显碰到了


    我们的命运不一定比王君好。和她一样，在一个真实而残酷的中国'
  - '[PAGE 7]


    要接触到上司、同事、同学、小贩、城管、警察、陌生人、精神病患者……你会感觉到，这些人，变得越来越狠。


    这意味着，今天每个人在职场上、生活上从接触或接触不到的人那儿受到伤害的几率大大增加——无论是利益的伤害、心理的伤害还是生命的伤害。


    说白了，我们活在一个无论人心、利益结构还是社会机制，都已经变狠的社会中。


    我们必须学会对付变狠的人心，变狠的社会。


    # ## 狠到了什么程度


    狠到了什么程度呢？


    英国政治哲学家霍布斯在他的著作《利维坦》中，曾经描述过没有国家存在的“自然状态”的可怕状况，他经典地表述为“每个人对每个人的战争”。在这样的社会里生活，人们“孤独、贫困、卑污、残忍而短寿”。


    现在的中国社会，当然远没有书中描述的那么夸张。在我们的身后，虽然社会早已不能“路不拾遗，夜不闭户”，沉疴难治，弊端丛生，但秩序并没有乱，维护秩序的国家力量让人生畏。“每个人对每个人的战争”即使不是一个伪命题，至少还远着呢。


    但现在的中国社会，确实是“每个人在心理上对每个人的战争”。具体会在后面的章节中讲到。


    在“自然状态”里，你不残忍，你不狠，就无法生存；而在今天，你不狠，当然可以生存，但会感觉在利益上很难保护自己，在心理上很难生存。


    自然状态的狠，是人的行为的残忍，对别人生命的冷漠。而今天中


    一手绝版更新微信ipip131 微信公众号 【重构文字】'
  - '[PAGE 8]


    国社会的狠，不仅包括行为的残忍，对别人生命的冷漠，还包括对正义的伤害，对道德底线的突破，对自己人性、生命的不尊重，对他人、社会的恨的大杂烩。它们不仅仅是个人的行为，同时还是社会和心理的一种机制。


    今天的中国社会，已经到了无论是心理还是社会机制都在强迫一个人变狠的程度，并演变成人们的一种“社会性格”。这一点，后面我还要继续深挖掘，一直挖到人的内心深处，社会结构的深处


    # 个人的狠，制度的狠


    现在让我们看一下，人们都狠在何处。


    因为这辈子活得很失败，不想活了，于是厦门的陈水总纵火烧公交车，拖着别人和他一起玩完。这非常狠。


    因为权力支持了一个人施虐的冲动，于是延安的城管跳着踩小贩的头。


    因为你的同事嫉妒成性，你被推下楼了；因为你的室友在心理和性格上变畸形，你被投毒了；因为你抢着理单伤了同学面子，你被同学杀了；上小学的时候，因为你长得比同学漂亮，你被她杀了，还被分尸！


    这些，都够狠！


    我曾经说过，一个人的性格和心理问题，不仅可以决定自己的命运，也可以决定别人的命运！


    还有形形色色的暴力。政府部门的“临时工”对老百姓施暴，穷人对穷人施暴，人渣们对所有人施暴。他们都是狠角色。


    以上狠行为无论是谁干的，都是具体的行为，是一个人的身体暴力，伤害的往往是别人的身体甚至生命。


    还有隐藏在制度、社会结构后面的狠行为。'
  - '[PAGE 9]


    比如，富人、垄断国企高管年收入可以达上千万，而一个普通人的年收入不过区区三四万。这不仅仅是能力的问题，而是社会利益分配机制的问题。只要他在社会结构的那个节点，在那个位置上，一年就可以拿那么多，而你在社会结构的这个节点上，就只能拿这么少，可能还会被媳妇骂“没本事”。


    又比如，公务员在福利和社会待遇上，远比普通老百姓好，不必缴养老金，退休还可以领超过普通人几倍的养老金，而他办事给你冷着张脸，甚至强拆你，你都拿他没办法。


    这些狠行为，用一个术语来说，乃是一种制度的、社会的结构性暴力。这是制度、政策的狠。


    # 社会变狠，其实是一种自杀


    以上两种狠都是对别人狠，人们其实对自己也变得越来越狠。


    抄一个数字，都会让人吓一跳。中国每年自杀人数在28万以上，自杀未遂的至少200多万人。这是N年前的统计数字，近几年，人们的心理问题、精神问题越来越严重，三岁小孩都能感知这一点。


    而且，谁都知道，中国的统计数据喜欢玩夸张或淡化的修辞手法，好的使劲注水，不好的使劲往少里说。


    即使如此，按N年前的统计数字，根据一般规律，实际自杀人数可能是统计人数的3到5倍。那就是说，实际自杀人数至少每年60万，绝对数量和人口比例都是世界第一。


    自杀是对自己狠到极端，正如杀人，是对别人狠到极端。


    但无论是对自己狠，还是对别人狠，在两个极端之间，都有大片的中间地带。'
  - '[PAGE 10]


    这些中间地带，构成了今天中国的无数社会问题，还有每个人的痛苦。


    这些社会问题，可以用阶层固化、贫富悬殊、道德沦丧、有毒食品泛滥、政府权力不受约束、不同的群体相互斗狠等等来描述。而每个人的痛苦，则可以用压力巨大，充满了焦虑、不安，甚至出现心理问题来描述。中国2亿多人有心理问题，而发展为重度精神病的，至少有1600万。


    这就是对别人狠和对自己狠的后果。某种意义上，这是一个社会的自杀。


    # ## 对别人狠和对自己狠


    对别人狠的人，可能天生就不是什么好人，更可能是，在既有的社会机制下，道德感并不强的他，必须强迫自己变成一个狠角色。


    一个人对自己狠呢？


    对自己狠的人往往是道德上的好人。当别人对他们狠的时候，他们尽管心理上很受伤，但做不到对别人狠，于是，把账算到自己头上，通过对自己狠来疗伤。


    正因为如此，对自己狠的人，最容易患有神经症，但很少会心理变态。


    一个铁的心理规律是：一个对自己狠的人，往往不可能去对别人狠；而对别人狠的人，一定已经先对自己下了狠手。对别人狠的人，往往心理扭曲、心理变态，而不是得神经症。


    原理是很简单的。我们是人，有人性，和另一个人有 人性的联系。所以，当我们看到别人痛苦时，会有同情心，会痛苦。同时，我们也有自我，如果我们尊重自己的自我，必然也会尊重别人的自我。


    如果一个人，看到别人痛苦并不同情，甚至为了满足自己的利益和心理需求，还去对别人狠呢？那只能说明他在新断了和别人在人性上'
  - '[PAGE 11]


    的联系，甚至已经没有了人性。他不尊重别人的自我，也意味着在此之前，他已经杀死了他的自我。


    所以，成为一个狠人，是有代价的，他必须先干掉自我和人性。这辈子他注定在心理上是一个残废。


    而这样一来，后果就相当严重了，别人要持续为他对自己的狠埋单，他要持续不断地去对别人狠。对别人狠，不再仅仅是为了利益，更重要的是，这是治疗他的心理问题的方式！


    因为自我和人性哪怕被扼杀，但永远不死，它们还会潜伏在一个人的内心最深处，谴责他，折磨他，惩罚他。他为了在心理上活下去，必须证明自己的狠是对的，必须不能听到内心深处自我和人性的声音。这一点，只有不断地狠，才可能做到。


    很多贪官都停不下贪婪的手，哪怕他贪的钱已足够他用几辈子。这种非理性的行为，说明贪污已经不仅仅是为了钱，而是为了消除恐惧感，获得占有的快感。一个狠人无法停手，同样如此。


    # 变狠的心理和社会机制


    现在，我们来考察一下让人变狠的心理机制。


    先看一下穷人为什么会变狠。


    这很容易理解。看过《世界如此险恶，你要内心强大》（1、2）的读者都知道，要打开人的心理问题的密室，看透一个人或一群人的内心，我们需要一把钥匙——“心理保护”。


    在心理上活下去，是人最大最深远的内驱力。如果他在心理上受到威胁，就必须用行为来保护自己，或者产生其他的心理问题来保护自己。


    穷人在利益上一直处于社会食物链的底层，因为穷，在这个社会的'
  - '[PAGE 12]


    心理食物链上，一直在被别人从心理上进行吞食。如果一点改变的希望都没有，他就会说服自己认命，就像奴隶社会的奴隶、中世纪的欧洲农民那样。


    但只要还有一点希望，或者说，如果他一受到刺激，就会感受到巨大的挫折，心理上会觉得活不下去。他要在心理上保护自己，怎么办？变狠！在心理可以防御，可以进攻，能够得到心理优势。


    变狠解决不了穷人的处境，但看上去却可以解决他的心理问题！


    富人为什么变狠呢？


    实际上，变狠就是先从富人开始的。他们可能没有对别人进行人身伤害的狠，但利用制度的、政策的、社会博弈的优势地位“掐穷”，占有更多的钱，本身就是一种狠。在房地产利益集团洗劫“中产”和“草根”时，看一下某知名房地产商“穷人就不该买房”的那副论调就明白了。


    按理，你变狠洗劫别人后，应该感到害怕，怎么还变得更狠？


    富人确实感到了害怕，但在心理上并没有示弱。


    当你欺负一个人时，因为在道德上是错的，所以你一定有一种罪恶感。如果一个人意识到了欺负别人在道德上是错的，罪恶感就会惩罚他，他就不可能再去欺负别人，否则知道是错的又继续干，道德的压力会让他人格分裂。


    这一点，在心理上必须有一个解决办法。怎么办呢？就是把欺负别人合理化，认为欺负别人是对的，别人活该被欺负，或者这根本就不是欺负。在心理上，要贬低、蔑视、仇恨别人，利用心中充满的这些情绪来掩盖罪恶感。


    到这里，仍然没完。


    因为富人清楚，他们变狠剥夺穷人，穷人会恨他们，说不定穷人会报复。所以仅仅说服自己“剥夺穷人是对的”或者“这并不是剥夺”并不够，






    ![](img/f0502657e0e411adb97ccb25c15a5fc1_12_0.png)'
  - '[PAGE 13]


    他们还必须更狠，加剧剥夺穷人的力度。也就是说，更狠，是对变狠产生的道德问题、心理问题的解决办法。


    一个人杀了人，消除恐惧和罪恶感的办法就是继续杀人。在一个心理畸形的人那儿，更加疯狂的行动，就是对原先的行动所产生的问题的治疗。


    而从语言、行动和心理的关系上，一个人只要变狠，在伤害别人时，由于心理保护，也反过来破坏了自己的心理和人性，他会继续更狠，继续在人性上更像是一个“残废”。


    当穷人和富人的狠相遇的时候，就产生了这样的社会机制：他们基于对方的防御，行为会相互强化，即一起变狠，没有谁肯或者敢于弱。


    为什么那么多年了，我们还看不到一点“公平正义比太阳还要有光辉”呢？就在于，有权和有钱的人根本不可能让步。因为一让步，就证明他们压榨无权者、穷人不正当的，这在心理上就威胁到了他们的地位和利益；而且，在让步后，他们对无权无钱的人会对自己干什么，根本没有预期，没有人有能力给他们一个保证。


    变狠，给所有人，给中国都下了一个套，一个越来越收紧的套。


    # 变狠变成了一种社会性格


    变狠不仅仅是个人行为和社会机制，在今天，已经变成了一种社会性格。


    “社会性格”是精神分析大师埃里希·弗洛姆首先使用的一个概念。


    这个概念奇怪吗？不。想一下，为什么中国有如此漫长的专制统治呢？为什么很多人特别能忍呢？老百姓身上普遍有着“羊性”：软弱、忍耐、温顺。这种存在于大多数人身上上的“羊性”，正是社会性格。'
  - '[PAGE 14]


    狼是需要羊体现出“羊性”的。换句话说，“羊性”具有维持狼吃羊的食物链的功能。正因为如此，专制统治者千方百计要培养老百姓软弱、忍耐、温顺的社会性格，并且不仅是强迫他们这样想，还要让他们自动地这样想、这样做。


    弗洛姆这样解释社会性格：社会性格是指同一文化中的大多数人所共同具有的性格结构的核心……它不是一个统计学意义上的概念，不是在一个确定的文化中的大多数人身上能够找到的性格特点的简单总和……


    要知道什么是社会性格，得先说一下它和个性性格的区别。


    我们都知道个性性格是什么：一个人可能孤僻，可能自卑，可能偏执，可能喜欢炫耀，可能喜欢表演……关于个性性格是什么，有什么秘密，我在《世界如此险恶，你要内心强大》里已经讲了，这里不再重复。


    个性性格属于人的“第二本能”，不是天生的，而是一个人在成长过程中形成的。某种程度上，一个人的性格和既定的社会结构、政治制度、生产生活方式没有什么关系。性格的功能，乃是让一个人以某种心理—行为模式固定地与世界打交道，在心理上保护自己。


    换句话说，个性性格，类似于本能一样，其实是一个人人身上的某套自动保护装置。这就是改变一个人的性格如此之难的原因，因为要解除他内心深处的武装。


    社会性格呢？是社会上大多数人身上所共同具有的性格特点，这些性格是人被既定的社会结构、政治制度、生产生活方式所改变，同时去适应的结果。


    专制制度的运行，必须把老百姓变成“羊”。而老百姓为了生存下去，不得不让自己像“羊”一样，这一点和老百姓在个性性格上是否孤僻、是否自卑并没有多大关联。


    说白了，社会性格就是一种功能。为了政府能够维持秩序，工厂能






    ![](img/f0502657e0e411adb97ccb25c15a5fc1_14_0.png)'
  - '[PAGE 15]


    够生产，商品能够销售。人们被塑造和引导应该这样想这样做，而不是那样想那样做，他们的心理能量，被调动起来维持整个社会的运转，而不是破坏它。


    今天中国人的社会性格，有一些是支持这个体制、这个社会的运作的，比如还残存的“羊性”、对部分专政机构的盲目认同，对体制内的艳羡等。但有的社会性格，正在企图让这个社会玩完。


    这就是“狠”的社会性格。


    用地沟油炒菜给我们吃的餐馆老板，种“毒蔬菜”的菜农，生产、贩卖有毒大米的人，他们在狠劲上比一些人差远了，在一个功利、不公正的社会氛围里，他们已经培养了“狠”的社会性格。推而广之，当一个社会变狠的时候，人们要在利益和心理上保护自己，就必须对他人充满防御，充满冷漠甚至敌意，必须具有“狠”的社会性格才能够适应和胜出。


    这是我们每一个人在今天碰到的，也是在我们身上出现的大问题。要透视变狠的人性，变狠的社会，我们必须进入人的内心和社会深处。'
