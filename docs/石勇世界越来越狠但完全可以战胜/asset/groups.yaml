    他不明白，具有自卑型性格的萨科齐，在欧洲近乎于“特级残废”的身材、“病夫”的形象，嵌人法国历史的荣耀之中，就一定会玩“铁血”手段来体现一个强大的“自我”，包括对付吉普赛人，也包括对付卡扎菲。而什么称兄道弟，不过是低劣的、人人都应该知道的表演，根本不能指望他。


    在表演之中进入了角色，把自己和对方的那个角色都当成自己和对方的“自我”，缺乏对对方的心理防御，以致对方向自己下手时，都还没反应过来，这正是卡扎菲悲剧的地方。


    更可怕的是，他也不明白自己。


    不错，和萨达姆先生一样，卡同学也是表演型性格。对于一个国家来说，由一个表演型性格的人把持，其实是非常危险的。就现在来说，这种性格，只有在俄罗斯这种国家当老大才符合实际，才能吃得开。美国倒是有实力，但这不是二战的时候，并不需要表演型领导者，谁要这样玩只是跟自己过不去。而在并不牛的阿拉伯国家，一个老大要玩这种性格，结局只有一个，就是找死，而且在劫难逃。


    看一下卡扎菲同学多年来的表现：


