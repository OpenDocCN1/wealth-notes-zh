    ### 几篇相关的文章


    ### 1. 一个行业的畸形发展足以引爆一场社会危机


    一个行业的畸形发展可以重创一个国家的经济，引爆社会危机，这不是奇迹，而是房地产经常干的事情。比如曾经在美国，在日本，在阿根廷，在西班牙——或许还有不久后的中国。


    不清楚中国巨大的房地产泡沫何时能被超出政府“调控”能力的不可抗力“刺破”，但十几年来，它充当了瓦解社会基础的冲锋队队员角色，却是冷酷的事实。其可怕之处，并不仅仅是“绑架”政府决策和中国经济，而是在社会团结、信任纽带、价值观念等方面，对一个社会釜底抽薪。


    一百多年前，马克思描述了工人在阴郁灰暗的资本主义社会中“异化”的社会机制。而在今天的中国，“异化”在房地产的唯我独尊中演变成一个社会的“自我套牢”。这里面的政治、社会、经济、心理机制，并不复杂。


    #### 官民


    出乎很多人意料，因为有了房地产，中国的“社会转型”并没有按照“公民社会”之类的方向走。事实上，与其说我们是在进行社会转型，倒不如说是在消解变成一个美好社会的种种可能性。


    从 1998 年开始，房地产开始成为中国发展过程中的政府追求发展、满足权力美学冲动和土地财政渴望的一种利益最大化、成本最小化的方式。假如预设政府是发展的主导者，还有什么比支持房地产的发展更有利于自己呢？


    这真是“黄金十八年”。政绩、利益的巨大诱惑，使政府角色悄然变异。它成为房地产利益链条中最重要的一环，而且与房地产商的利益形成“一损俱损”的关系。在这种情况下，有些地方政府变成一个“带刀的生意人”，冲在了诸如强制拆迁、征地最前线——而按照改革的意义和民主政治的推进，这本来应该是一个各利益主体平等谈判、最终达成交易的过程。


    在国家和社会的二元结构中，政府定位不对，这一二元结构一定是紊乱的。房地产，因此加剧了社会的第一种冲突：官民冲突。


    据中国社会科学院所发布的 2013 年《社会蓝皮书》披露，每年因各种社会矛盾而发生的群体性事件多达数万起甚至十余万起，而征地拆迁引发的群体性事件占一半左右。当政府被房地产“绑架”，其在社会冲突上的杀伤力，尤其是对官民关系的破坏，由此可见一斑。


    即便是一个迟钝的观察者也能够看到：中国的改革，包括土地产权方面的改革，一旦威胁到政府部门在房地产利益链中的巨额分成，遭到抵触的可能性远大于支持推进的可能性。


    比如，房地产本来应该是一个市场化的行业，但土地这一稀缺资源，

