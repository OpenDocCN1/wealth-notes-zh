    在当时很多人的解读中，社会不公、贫富悬殊、心理变态、教育体制的恶性代价在马加爵事件上折射了出来。这个事件，由此也成为人们情绪的发泄口。而在媒体上，无论评论者对他的行为进行怎样的评价，都表现出一种沉重和压抑，也都表现出对社会、心理和教育问题的控拆。


