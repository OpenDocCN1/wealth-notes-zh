    \  \n开玩笑，你看，证据在这里。\n\n+   3. 他继续控诉父母，继续上图，回复网友一句“没有灵魂地活着，  \n就像行尸走肉”。\n\n他一直在按自杀的表演程序走：提供理由，提供证据，在众人的关\
