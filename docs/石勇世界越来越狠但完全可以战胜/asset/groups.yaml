    ## 14. 贝卢斯科尼：征服女人就筑牢了权力


    体政治、以炸弹来展示其“肌肉”的千载难逢的机会。在战机起飞的那一瞬间，萨科齐一定感觉到，法国在他手中，也像美国那么牛 13。


    自从在第二次世界大战中侵略一个非洲弱国埃塞俄比亚都感到吃力后，意大利人已经明白，必须把恢复古罗马帝国荣耀的想法视为彻头彻尾的梦呓——正如现在的希腊人，也把恢复古希腊思想文化的那种辉煌看成是一场春秋大梦一样。


    但是，在与别人的心理竞争中，人骨子里都有着用强大谋求自尊的冲动，何况是“曾经阔过”的人。既然现实已无可能，那就改变心理结构，寻求一种替代性的满足吧。二战后，意大利人的性格悄然改变。在国际事务中，他们变得低调、冷淡。


    这里的心理逻辑是：一个男人的“枪”体现了他的力量，无论是用某种枪来征服他者，还是用另一种“枪”来征服女人。如果我无法从国家的强大中体验到我的强大，我可以从对女人的征服中得到强大的快感。当然，我不一定有这么大的本事，但我可以把我的这种欲望投射到一个有这种本事的人身上，获得变相的满足。


    于是，贝卢斯科尼同志闪亮登场，并且一直没有离去。


    作为意大利总理，贝卢斯科尼最为人所知的并不是他在国际国内事务中做出了什么了不得的成就，而是频频曝出的“性丑闻”。对美女伸出一只咸猪手、和多名女子有染、嫖雏妓，足证他风流成性。当然，有必要纠正，意大利人虽然承认“性丑闻”这一说法成立，但并没有过多的道德色彩，至少看不出他们对贝卢斯科尼有多么的义愤填膺。


    甚至准确地说，他们需要贝同志作为他们的理想寄托者和形象代言人。


    贝卢斯科尼也挺配合。无论他没有肌肉，意大利人对此不感兴趣。他必须做的，是展露出一个猎艳高手的身体形象和行动，筑牢自己的权力，而在外国人看来这简直是一个笑话。


    无论在哪儿，贝卢斯科尼的头发总是梳得贼亮贼亮，皮肤刮得非常干净，看上去很光滑。对自己的身体，他极为自恋。


    在内心深处，这是一种焦虑：如果不能像一个花花公子那样，在心理上他就有失去权力和面子的危险。所以，最大限度地炫耀他对女人的征服就成为显示和维护权力的最好的方式。他已经垂垂老矣，但是，他还要表明自己很厉害：“即使我一天只睡三小时，我也有足够的精力去追求三小时的性福生活。”


    当然，这是身体权力的表演，虽然不排除有这种可能性，就是他在心理上已彻底投入进去，真诚地相信自己是那么牛 13。


    ## 15. 卡扎菲：玩狠不够彻底的他完蛋了


    早在法国总统萨科齐在西方国家里挑头向他头顶上扔炸弹时，卡扎菲同学的反应居然是惊呼：“我的朋友萨科齐疯了！”在这个世界上，有


    很多人一心要卡扎菲死，很大程度上，卡扎菲的性格和心理弱点，成全了这些人的伟大抱负。


    他的失败太明显了：对于“老朋友”萨科齐到底是什么人，作为法国总统他会干什么，卡同学居然都不了解！


    他不明白，具有自卑型性格的萨科齐，在欧洲近乎于“特级残废”的身材、“病夫”的形象，嵌入法国历史的荣耀之中，就一定会玩“铁血”手段来体现一个强大的“自我”，包括对付吉普赛人，也包括对付卡扎菲。而什么称兄道弟，不过是低劣的、人人都应该知道的表演，根本不能指望他。


    在表演之中进入了角色，把自己和对方的那个角色都当成自己和对方的“自我”，缺乏对对方的心理防御，以致对方向自己下手时，都还没反应过来，这正是卡扎菲悲剧的地方。


    更可怕的是，他也不明白自己。


    不错，和萨达姆先生一样，卡同学也是表演型性格。对于一个国家来说，由一个表演型性格的人把持，其实是非常危险的。就现在来说，这种性格，只有在俄罗斯这种国家当老大才符合实际，才能吃得开。美国倒是有实力，但这不是二战的时候，并不需要表演型领导者，谁要这样玩只是跟自己过不去。而在并不牛的阿拉伯国家，一个老大要玩这种性格，结局只有一个，就是找死，而且在劫难逃。


    看一下卡扎菲同学多年来的表现：


    1969年9月，他领导一帮军人发动政变，推翻伊德里斯王朝，建立了阿拉伯利比亚共和国，并当上老大。按理说，在利比亚这种和欧洲隔海相望、有丰富石油资源、完全处于大国阴影之下、一不小心就要被人灭掉的地方，这么牛×，已经够了。如果不招谁惹谁，而对大国尤其是西方国家笑脸相迎，他会像专制的国家沙特一样活得好好的。在利益面前，什么“推广民主”之类的说辞都是扯淡。美国的政客可不像中国的网民那么喜欢意淫，而且还自我感觉良好。


    胡锦涛有句话叫“不折腾”，可惜，隔了漫长的时空，卡同学听不进去。


    准确地说，“不折腾”并不符合卡扎菲这种表演型性格的人。“革命”和“解放”的理想主义，让他无法停下来。事实上，对于表演型性格的人来说，占有权力和巨额财富、能够控制一个国家，在心理上来说，仅仅是实现他的理想、让他成功地扮演一个角色的手段。只有他在心理上体验到自己已经成功地扮演了一个什么角色，并且构成了他的“自我”，他在心理上才能消除自我认同的焦虑。


    一句话，你要卡同学停下来，在心理上等于要他的命。


    从1948年以色列建国以来，中东的阿拉伯国家都笼罩在美国和西方的威慑之下。所以，卡同学要扮演一个“解放者”，一个“不屈服于强权”的角色，就必然要跟美国以及整个西方对着干。洛克比空难，被视为是一个标志性事件。


    而如此一来，仅仅当一个利比亚的老大已经不够了，远不能实现他扮演一个地区霸主的宏图大业。他要当一个阿拉伯世界甚至非洲世界的老大——而且，这个老大要和西方分庭抗礼，唯我独尊。


    危险的预兆马上降临，阿拉伯世界和非洲一片嘘声，而西方则怒目相向。20世纪80年代，他被当时的美国总统里根同志骂为“疯狗”，炸弹马上扔了下来；后又被小布什同学说是在“支持恐怖主义阵营”。这意味着，对于西方来说，卡同学已经被判处死刑，至少要终身剥夺他当利比亚老大的权利。


    具有某种理想主义的表演型性格的人有一个特点：一旦他在扮演什么角色的伟大征途中遭遇到了阻碍，就会自我催眠，幻想自己是一个和邪恶作战的英雄，借此在心理上强化自己扮演这一角色的崇高正义感，并激发出前进的勇气。在“9·11”事件前，卡扎菲在这一点上做到了。也因此，他虽然大大地得罪了西方，但无人能置他于死地。


    委内瑞拉前总统查韦斯就是这样玩的，他在反美上，在玩“社会主义”上都是多么的牛×，而且是光荣地死去，死后还留下如此巨大的影响。和他相比，卡扎菲简直就是一个小丑级的人物。


    卡扎菲的致命错误是不能始终保持自我的同一性。一旦不能坚持自我同一性，而且被现实利益劫持，性格就会成为表演型性格的人的绞索。


    “9·11”事件后，卡扎菲突然向美国表示友好，要求提交拉登同学。在此后，萨达姆同学的命运让他更看到了自己的命运，向美国大声喊话，要求乖。终于，他好像已经“华丽转身”，从西方的心头之患变成听话的小朋友。危险似乎已经过去。


    但直到那个时候，性格才真正把他害了。


    卡扎菲似乎已经明白，他在这个世界上完全是孤家寡人。利比亚的国家实力以及政治地缘，根本不足以支撑他当一个什么阿拉伯世界和非洲的老大。而如果要当利比亚国家的老大，就不能有性格。因此，“9·11”之后，当“反恐”可以让美国做掉而且也愿意做掉任何一个小国家时，乖是聪明的，属于“识时务者为俊杰”。


    但是，在此前既得罪了西方，而在“9·11”之后又得罪了伊斯兰世界的激进势力的情况下，向美国示好，就必须彻底乖，绝不允许拖泥带水。否则，在骨子里，别人仍然认为你此前没什么不同，乖只是害怕了而已。


    而一旦卡同学被西方认为害怕了，他所有的弱点就暴露无遗，恰恰加速了他走向坟墓的进程。在这方面，和卡扎菲同一性格的萨达姆同学已经提供了血的教训。他的妥协——放联合国的人来检查武器，其实


    是一种自杀。


    表演型性格的人，在没有足够实力的时候，要扮演一个得罪人的角色，就必须强硬到底，有一种大不了大家一起玩完的气概。否则，就要彻底变乖，抹去此前的符号，让别人不再觉得你是一个威胁。一句话，你要么在心理上镇住别人，要么就必须给别人一种安全感，绝不能模棱两可。


    遗憾的是，卡扎菲没有。在变乖的时候，他并没有跪下来喊美国“大爷”，让美国获得重要利益，进而感觉到如果和卡扎菲过不去其实是和自己的利益过不去。聪明的美国人绝不会跟自己，以及自己的钱过不去。


    那么如果在内部出了事，有人起来要取而代之，有谁能保他卡扎菲同学？用脚指头想都想得到，原来得罪的人，一定会借助这个机会干掉他！这样的机会实在太难得了。


    对于一个依靠强权维持统治的独裁者来说，最害怕的事情，其实就是内部起火。一旦形成气势，马上会引发多米诺骨牌效应，众叛亲离，死无葬身之地。因为他会成为内外所有不满的公共污水沟。


    在情势危急的时候，卡扎菲还有下台保全自己一家人性命甚至财产的机会。可惜，这不符合他的性格。明知离完蛋已经不远，他还要顾及自己所扮演的那个强狠老大的光辉形象，不肯流亡，不肯下台，在气势上藐视内外敌人，斥之为“鼠辈”，期待奇迹发生。


    无论你是否相信，反正，卡同学相信了。


    这和萨达姆同学又是何其相似。萨同学在被审判的时候，还坚称自己是“伊拉克现职总统”，因为如果不活在自己还是伊拉克老大这一幻觉世界里，他在心理上都玩完了。


    确实，让卡扎菲同学这种人走出自己性格的牢笼是困难的。因为，


    就当时的情境来说，表演型性格驱动他追求心理上的生存，而不是生理上的生存——在美国面前耍乖在心理上还可以找到辩护理由，毕竟美国太牛，而向国内自己瞧不起的那帮人服软，这比杀了他还要让他难受。性格就是命运。


