    去和别人玩追逐权力、金钱的游戏，对于他们来说已无法想象。但他们还有更好的机会：占有更为稀缺的资源——幼女。


    性侵幼女，使他们在心理竞争中突然找到了心理优势，并完成了对社会的“报复”，使自己觉得这辈子公司并没有那么失败。其内心的声音是：“太阳你妈，你们得到，老子也得到，而且是更有价值的东西！”


    著名的权威时政刊物《南风窗》有报道说，广西武宣县的一个70来岁农村老头，性功能早已退化，其老婆说“我那老头已经不行好多年了”。但这并不妨碍他性侵幼女，因为这样做并不是为了解决生理问题，而是为了治疗自己的心理失衡。


    心理失衡的远不只是农村老人。某些教师、民工等，直接是这个社会残酷的利益和心理竞争的出局者，心理的挫败感、怨恨感更为蚀骨。


    虽然“食草动物”们没有机会换来利益，但他们和“食肉动物”们在心理上其实是一类人，都具有占有倾向，都希望处在被人吃的地位的不是自己，都随时打算把自我和人性卖出去。他们的心理后果和“食肉动物”的区别只是，不是恨自己卖了自己，而是恨自己的无能。


    而为了补偿自己，他们必须具有“被迫害感”，以便为自己突然突破道德底线找到心理依托和理由。


    好，在占有权力、金钱、房子、情妇上，“食草动物”们玩不过“食肉动物”们，那怎么办？和农村老人一样，出老千！盯住幼女！


    # 6. 狼，需要一个借口！


    ◆ ◆ ◆


    > “老人”的狼，不仅仅是在性侵幼女上。有的人还在公交车上打小女孩，在地铁上打年轻人呢。


    > 同样，在这里要说清楚，我指的“老人”，特指变狠的老人，不是全部老人哈，就像我谆谆教导你们：绝大多数官员还是好的。


    ◆ ◆ ◆


    在郑州有一个女孩，仅仅因为在公交车上没有给一个老头让座，就遭其拽住头发暴打。真的佩服这位老头，身体那么好，那么狠，还要别人给你让座？


    就这件事，写时评这一“脑残文体”的人和网民一拥而上，废话般地重复“不让座不对，打人更不对”“不让座是道德问题，打人是法律问题”。


    我终于吐了。


    ## ◇ 一个狠人，总喜欢在认知上“出老千”


    衡量一个社会变态到什么程度，有两个指标：它的老年人无赖、乖戾到什么地步，人们是非不分、认知混乱到什么地步。


    翻一下变狠的老年人干的好事，让人震惊。讹诈“彭宇”的有他们，抢盐有他们，嫖娼有他们，猥亵、强奸幼女有他们，公交车上对累得快趴下的年轻人横加指责甚至暴打的，也有他们。


    我看到了一种恨，一种对年轻人、对这个社会的恨。心理失衡的他们要报复，以便补偿自己。而社会认知的混乱，让他们在报复时显得理直气壮。


    先澄清一下“让座”的问题。一个恶人，同时也是一个认知混乱的人。而社会的认知混乱，只会鼓励作恶。


    不让座不对吗？是道德问题吗？这要看情境。


    乘客购买了车票上车，和公交公司达成了一项契约，按照“先到先得”的原则，如果有空位，乘客有权利坐下去。这一权利是有道德分量的。无论是放弃，还是取消这一权利，都意味着乘客要做出牺牲。


    但你要一个人做出牺牲，只可能是基于这个理由，即你要别人让座的要求的道德分量压倒别人权利的道德分量，从而别人有让座的道德义务。因为放弃权利并不是义务，而是一种美德。


    当女孩在车上坐下的时候，她“可以”让座，“可以”主动放弃这一权利，而不是就被动地“应该”“必须”让座。“应该”“必须”在道德哲学上是进行道德判断的词语，表明一个人具有做什么的道德义务。


    但这个社会的主流舆论，却偏偏用“应该给老弱病残让座”的混乱表述，在道德上取消、否决年轻人坐下的权利。把年轻人向老人让座这一美德弄成了年轻人的道德义务，搞得不让座就是道德问题！就像脑残的时评写手认为的那样，把让不让座从一个权利问题弄成一个道德问题。


    不错，当老人没有座位坐，预期会有安全问题时，从自然义务的角度上讲，年轻人应该让座，因为安全的道德分量，足以压倒他坐下的权利的道德分量，而年轻人让一下也没损失什么。


    但是，要搞清楚，这是基于预期此老人会有安全问题而让座，而不是因为他是一个老人这一身份，别人就应该让座。对孕妇、小孩、残病人让座也同样如此。事实上，任何一个人，包括年轻人，如果预期有安全问题，别人也应该让座。


    如果看不到这一点，把让座和身份联系起来，那就是偷换概念，在认知上“出老千”了，把享受年轻人的让座当成了老年人的特权！似乎，就像主流舆论和脑残时评写手认为的那样，只要有老人上车，年轻人就应该让座。


    但一个人绝不仅仅因为他是老年人，就享有让别人让座的特权。除非他预期会有安全问题，否则，他只能请求别人放弃坐下的权利，而绝无资格“要求”。如果别人不让，他也没有资格说什么；让了，享受了别人因放弃权利做出的牺牲，就具有表示感谢的道德义务。


    可惜，这么简单的认知，很多人愣是不懂。当然，对于某些老人来说，在心理上，他们愿意不懂。


    看一下暴打女孩的那位老东西，身手如此矫健，还需要坐下？他要别人让座，别人不让就暴打的底气，不就是“女孩不让座不对”“年轻人应该给老人让座”的社会认知给的吗？时评写手和一些糊涂的人，永远不知道自己其实也是恶行的合谋者。


    ## ◇ 权力最喜欢看到“狗咬狗”


    有媒体似乎想为这个无辜被暴打的女孩辩解，说就像杭州公交车上一位被扇耳光的小伙事后证明是残疾人那样，女孩是不是也因为身体不方便而不让座呢？


    维护自己的权利，需要一个身体不好的理由吗？就算女孩身体方便得很，她也有权（即道德上的理由）不让座，而且可以大声地说出来！


    这个社会有两个有病的现象：一是鼓吹美德，却把美德往下拉，以致把美德变成道德义务，挤压个人的权利空间；二是以一些其实是由变态的心理驱动却以道德名义喊出来的口号来强迫他人，取消他人的权利。


    动物保护者的“拦车救狗”就是如此。因为自己爱狗的偏好，就强迫别人按自己的偏好来玩，无视别人的财产权，以及别人满足自己偏好（吃狗）的权利。


    奇怪的是，正如公交车上因不让座而引发的暴行那样，对于这类侵犯他人权利的事情，公权力机构好像并不积极去维护公民的权利。暴打别人的老头，其性质完全就是寻衅滋事，伤害他人，完全可以按法律来处理，但因为“应该给老年人让座”使得老人的行为似乎有理，后果也似乎并没那么严重。


    而动物保护者因为打出了“爱心”的名义，即使危害公共秩序、强买强卖，也没见被抓起来。


    这简直真是袒护了。而如果这样的行为是冲着公权力机构来，比如维权的人，权力绝对不会手软。“钱云会”们的下场就是榜样。


    对这种反差解释一下的话，那就暴露了现在权力治理社会的一个思路：狗咬狗，谁也不尊重谁的权利，没事，社会越分裂成相互对立的原子越好，因为一群相互不尊重对方权利的社会原子最好控制。但是，这股祸水，绝不能引向政府。


    把老头暴打女孩、动物保护者拦车救狗等考察一下，发现他们在这一点上是一样的：某个人、某个群体所主张的“权利”“特权”，针对的都是其他公民的权利，而绝非针对公权力。既然如此，为什么要去管，而不乐得在一边收获得子呢？


    # ∞ 狠，也需要一个借口


    按照规建，在认知上进行澄清之后，就要进行心理分析，走进乖戾、耍无赖的老人的内心世界。


    前面说了，老头暴打女孩，得到了“应该给老年人让座”的混乱道德命令的支持，正如动物保护者们拦车救狗、强买强卖，也得到了“爱心”这一具有道德优势的口号所支持那样。但这只是病变的心理发作时的一个借口，大概相当于“自由，自由，多少罪恶假汝之名以行”。


    要洞烛心理秘密，从直觉上不对头的地方开始。一个人年老了，按理应该变得宽容、淡然，同时也有点老人的样子，让人尊重。但他们居然耍无赖，打女孩、讹诈扶自己的人、强奸幼女之类事都干得出来。这样人活了一辈子，不觉得失败？


    他们一定有这样做的心理上的原因。


    因为年老，因为混得也不怎么样。一般而言，现在人们享受的东西比过去要好得多，老年人都会有失落感，因为这个时代不属于他们，他们只是在看戏。这是正常的心理。


    问题在于，很多老年人的成长环境本就不利于人性的生长。那是一个玩阶级斗争的年代，受过苦、被洗脑过、没有尊重他人权利的意识、对他人缺乏信任。


    对人性的破坏带来了这样的心理后果：恨自己，恨那个时代，但这样等于否定了自己，所以不能恨自己、恨过去，只能把恨投射到现在的人以及社会身上。而如果这一点和自己占有得少的现实结合在一起，他就一定会在心理上、行为上把恨表现出来。


    暴打女孩的老头就是如此。对一个女孩施暴，是因为在他的心理背景中，就对现在的年轻人看不顺眼。“应该给老年人让座”，不过是让他合理化了她的恨。


    讹诈扶自己一把的人的老人仍然如此。这远不只是老人老眼昏花，或需要找一个人付医药费那么简单。当一个人恩将仇报没有任何犹豫时，他的潜意识就愿意去对别人狠！


    # 7. 变狠的人有大量的心理同伙


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_53_0.png)


    某一天，一个重庆女人手里拿着两个鸡蛋一边走一边剥，并将蛋壳扔在地上。一个环卫女工上前劝阻说：“妹儿，下雨天蛋壳在地上不好扫，你剥到我簸箕里面嘛。”此女回应：“我不甩到里面，要甩到外面。”并喝道，“快，给老子扫了。”


    这个事一曝出，网上一片谴责之声。但也有人这样为她辩护：环卫女工不仅不应该生气，还应该感谢她，要不然连饭都没得吃。


    似乎，被狠人伤害了的我们，还得感谢伤害我们的人。


    好吧，让我们走进这些狠人的内心世界，顺便揭穿中国社会的一些秘密。


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_53_1.png)


    ## ◆ 人吃人的心理食物链


    在“大鱼吃小鱼，小鱼吃虾米”的心理食物链中，“扔蛋姐”在环卫女工上面，足以在心理上吃定后者。除非环卫工内心很强大，否则无论有无反击，都会有屈辱感，而“扔蛋姐”则可从中找到快感。


    但从羞辱一个最底层的人中找到快感，已经说明了“扔蛋姐”的档次，也就比最底层的人在社会价值排序上高一点而已，换言之，她不过是一个小市侩。而一边走一边剥鸡蛋吃，对于自己的身份也是一种自我招供。那些从社会中掠取了巨大利益的分利阶层，当然是不屑于这样做的，环卫工也非他们表演“上等人”时的配角，那太“跌份”了。


    就阶层和社会利益结构而言，小市侩其实也是被剥夺者，从心理食物链而言，她也是被分利阶层在心理上吞食的无名大众中的一员，在后者眼中她和环卫工的区别并不大。


    但幻想她不去鄙视、羞辱环卫工只能是做梦。因为在心理上，这些人已经扭曲变狠：更高档的人吃她，她就去吃更低档的人！


    ## ◆ 谁干掉道德，道德一定会干掉他


    “扔蛋姐”已经向我们招供：一个内心被破坏而变狠的人，一定会找机会羞辱、攻击、损害一个因为善良、诚实、弱小、低贱而在心理上显得弱势的人。


    这恰恰是中国社会道德沦丧的一个真相。


    大家都知道，一个假期过后，风景区几乎被中国人蹂躏了一遍。遍地垃圾和乱踩乱画的背后，有什么秘密吗？


    我在广州白云山上曾经目睹过，无数的游客在从上下来时，在拐弯处放着好好的马路不走，仅仅是为了多省几步路，群起踩烂篱笆，扯断树木，跌跌撞撞地从一条“新路”上下来。在马路边，有很多人在仰头望着他们，并拿出手机拍照，就像是迎接英雄的归来。


    我仔细地看了他们的表情，发现充满了破坏秩序、践踏景物的快感。那一瞬间，我明白他们为什么这样干了：篱笆、植被对于他们的破坏毫无防御能力，他们的心理和“扔蛋姐”看到“低贱”的环卫工就羞辱一模一样。


    看着一张张欢乐而毫无愧色的脸，我发现说他们“素质低”几乎毫无意义。“素质低”仅仅是对他们的行为的外在描述。而真相是，他们的行为是受到心理动力驱动的。“素质低”，不过是他们的内心已变狠，再以破坏的行为表现出来的结果。


    一个社会的道德沦丧也一样。说一个人没道德，只是我们对他的行为的外在评价。但是，在他做出不道德的行为之前，他的心理结构已经被破坏了。道德问题，不过是心理问题的结果。也就是说，一个社会越是道德沦丧，人的心理就越扭曲、变态，反过来也一样。


    原理很简单：谁干掉道德，道德一定会干掉他，让他心理扭曲、变态；而心理扭曲、变态的人，最大的渴望就是干掉道德！


    ## ◆ 变狠的人总会说出混账话


    如果你问我，一个内心已经变狠的人，会有什么样的心理反应？我的回答是：他不敢听到自己内心的声音，因此他一定自我感觉良好。而自我感觉良好，在心理上的唯一意思就是对自己装
    13。


    而装 13 在心理上的唯一意思，就是他需要去掩盖什么。因此一个聪明的人，根本不会被别人装 13 镇住，而是马上可以看到装 13 背后要掩盖的东西。


    同时，这些人还有这样一个心理反应：使自己的行为“合理化”。他们倾向于找一堆歪理来为自己的行为辩护。


    中国社会的是非不分，恰恰就是这帮内心变态且必须合理化自己的行为的人搅出来的。从药家鑫师妹李某颖“我要是他，我也捅”，到今天为“扔蛋姐”辩护的“环卫工不仅不能生气，还要感谢她，要不然连饭都没得吃”，都是如此。当然，这也相当于药师妹等不打自招，承认自己心理变态。


    这些歪理值得一驳吗？从本质上，它们不是头脑的产物，而是心理的产物。当我们说一个人“脑残”时，其实真正的意思是他心理出问题了，导致了大脑功能的丧失。


    我想说，你在网上所看到的无数脑残回复，无一不是背后的那个缩头乌龟心理出了问题的结果。因为，一个人如果真的智力不行，或者无知，他一定不会显得那么自我感觉良好，真理在握。正因如此，分析一下为“扔蛋姐”辩护的歪理还是挺有意义的。


    看一下“环卫工不仅不能生气，还要感谢她，要不然连饭都没得吃”。这段话犯了三个逻辑错误，仅仅从智力上看，只有脑残才能说岀来：


    - A. 环卫工这一职业的存在和有人乱扔垃圾这两者之间在逻辑上并不存在对应关系，乱扔垃圾需要打扫，仅仅是环卫工工作的一个内容，除此之外她还要干其他事情。换言之，有人乱扔垃圾，只是加重了环卫工工作的负担而已。把减轻环卫工工作负担叫作让环卫工没饭吃，这在逻辑上是错乱的。

    - B. 环卫工只是叫“扔蛋姐”把蛋壳扔到簸箕里，换言之，她只是希望对方不要故意加重自己的工作负担。她有权利这样做吗？当然有，因为不乱扔垃圾，是一个人的道德义务。一个人不履行自己的道德义务，逻辑上无法被理解或解释成是对另一个人的帮忙，帮环卫工保住饭碗。

    - C. “扔蛋姐”拒不履行自己的道德义务，故意加重环卫工的工作负担，实际上已经对环卫工构成一种利益上的损害。非但如此，她还以语言进行挑衅、辱骂，更是构成精神上、人格上的伤害。把对一个人利益和精神、人格的伤害说成是帮别人保住饭碗，还要别人感谢，一个人的内心要被破坏到什么程度，才能说出这种混账话？


    “扔蛋姐”有大量的心理同伙。他们可能是用钱羞辱屌丝的官商利益结构的寄生虫，可能是仇视工农的权贵走卒，可能是鄙视农民、穷人的城市市侩，也可能只是一个随便在风景区扔垃圾的游客。


    在今天的中国，他们以不可阻挡之势，始害无穷地繁衍开来。


    # 8. “狠”经过包装，也可以变成名利


    “狠”是可以用语言、姿态来包装的。一个狠人完全可以躲在“自由”“民主”“正义”“良知”的招牌之下。


    比如对弱者的痛苦的消费以及炒作，摆出“被权力迫害”的pose，就能把一个人内心的“狠”变成名利。


