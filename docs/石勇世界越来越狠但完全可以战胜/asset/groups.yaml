    社会的主流价值观念来赋予自己以某种存在价值的论证，他的自我并没有化为社会自我。


    但在一个存在心理竞争的等级社会中，具存在生存方式的人寥寥无几，大街小巷都是“占有狂”。在弗洛姆看来，占有几乎体现在社会的每个角落，体现在人类生活的每个领域。在语言中，比如“我爱”是一种存在的体验方式，而“我有爱”则是一种占有的体验方式——“爱”不再是我的体验，而是我所占有的东西；在学习中，一个死记笔记而去理解的学生只是在企图占有某种知识，而一个理解和思考的学生则是力图将自己的存在与某种知识进行联系；在信仰中，上帝在“占有狂”那儿是一尊偶像，在“存在者”那儿则只是一种内心倾向，一种态度……当然，弗洛姆没有说到，在中国，“人”已被具有社会的价值属性的“身份”取代，每个人似乎都想去占有某种有价值的身份，逃避某种没有价值的身份，比如，介绍一个人，必是“××局长”“××主任”之类。人们既通过这种占有物来体验自己，也通过这种占有物去体验他人。


