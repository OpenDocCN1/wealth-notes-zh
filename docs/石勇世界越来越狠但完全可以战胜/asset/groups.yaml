  md: "\n避的苦役，生活已经成为一座难熬的炼狱时，他就有卸掉这副重担的冲动。既然承受痛苦的是自己的存在，那么，把这种存在消灭，痛苦也就跟着被消灭了。压力型自杀就是良心在不堪承受的压力面前寻求解脱。\n\
    \n## 31. 抑郁，是因为世界开始发狠\n\n在当前的中国，自杀率居高不下，频繁发生，最能典型地说明社会的病态和危机。压力，无论是生活的还是精神的，都来自于外界，即社会。\n\
    \n贫穷导致一个人自杀，除了社会保障不到位，还有巨大的贫富悬殊构成的刺激。\n\n弱势群体面对的除了物质上的穷困，还得承受制度上、观念上、阶层上强势群体的精神压力。对于他们来说，整个生存处境岌岌可危，充满了辛酸与煎熬，面对生命无法承受之重，只有一死了之。\n\
    \n相对并不算弱势群体的白领、研究生自杀，则是因为面临学习上、工作上、就业上、人际关系上的巨大压力。而且他们对自己未来的预期难以确定，他们感觉生命像沙子一样无奈地流逝，自己逐渐被压力吞没，却又无法摆脱痛苦，只有一死方能解脱。\n\
    \n压力型自杀的人在精神上都不健全，有点接近于一些心理学家和精神病学家所说的“精神疾病性自杀”。原因很简单，在巨大的压力下，他们或多或少地都有心理、精神上的问题，多数都患有抑郁症、强迫症、恐惧症，而其中又以抑郁症最为突出和普遍。而恰恰是这种心理、精神上的问题，使他们丧失了一定的理性思维能力，任由心理逻辑主宰，与病态的社会合谋，把自己拖入了自杀的黑暗。\n\
    \n在中国，抑郁症患者最集中的人群恐怕就是高级白领。他们拥有较高的收入，在高档写字楼里从事着高贵的工作，良好的工作环境、光鲜的衣着以及潇洒的生活，是蓝领劳工、贩夫走卒、苦力民工们羡慕的对象。但他们在获得这一切的同时，却承受着巨大的工作压力，并且处在一个没有温情、只有冷冰冰的制度和冷漠的人际环境的环境，压抑自己的精神需求，承受着超出心理承受力的压力。\n\
    \n但能够“抽身而退”的毕竟只是极少数人，而且是后顾无忧的人。大多数白领已经接受了社会的游戏规则，认同“成功”之类的概念，被社会价值排序的观念俘虏，他们只能像一架机器一样高速运转。当他们心理上不堪承受之时，只有自杀才是解脱之道。\n\
    \n我们在媒体上经常可以看到这样的报道，很多品学兼优的学生跳楼、投河自杀，看起来让人难以置信，其实也能够理解。这些人头上无一不有着光环，有着荣耀，他人对这些光环和荣耀的羡慕让他们获得了心理满足，变成了他们的一种依赖于别人“认同”的自我认同。他们就是靠这些东西活着，因此在心里面，他们非常害怕失去这些“无形资产”，因为一旦失去，就失去了别人的羡慕和认同，他们在心理上就要崩溃。而同时，获得和保持这些东西，又让他们承受了巨大的精神压力，严重透支了他们的心理能量。这样的焦虑、恐惧和心理能量的透支，让他们在心理上变得极为脆弱，于是许多人患上了严重的抑郁症。这样的心理状态经受不了任何挫折与打击，一旦遭遇挫折或失败，他们就感觉自己被否定了，在心理上就难以生存下去，抑郁到了极点就只有通过死来解脱。\n\
    \n自然地看着待别人的成功与失败，自然地对待自己的成功与失败，实在太重要了。这是避免精神崩溃和抑郁，保持心理健康的有效方法。\n\n## 第7章\n\n#\
    \ 自杀是人类的败笔\n\n### 32. 活着，勇气可嘉！\n\n法国著名存在主义作家加缪曾经说过：自杀是唯一值得严肃思考的哲学问题。\n\n也有一种观点认为：文人的痛苦来自于思考。表面上看是这样的，思考让一个人痛苦，因为一个人意识到了让他陷入痛苦的东西，他体验到了痛苦。但不思考虽然可以让一个人体验不到痛苦，然而内心被破坏却可以使他出现心理变态。\n\
    \n我想纠正“思考会让一个人痛苦”的流行观点。根据人们说话语境和我们要说的意思，思考的内容应指两种：一是思考各种给人们造成痛苦的社会现象，比如贫富悬殊、社会不公、虚假腐败等等，人们认为，这是无法避免的，因为根本无法改变，如果总是想这些问题，就随时会遭受痛苦；二是思考关于人生价值之类问题，进行这样的思考，难免要让人怀疑生命的意义，因为生活太沉重了，活着透着悲哀和无奈，所以思考是痛苦的、危险的。所以，他们拒绝思考。\n\
    \n然而对于文人、知识分子来说，敏感的他们无法不进行这样的思考，他们并不像大多数人那样是一个随时可以把自己的大脑和心灵交出去的俗人。但问题并不在于他们的思考，而在于面对这些问题时，他们的心灵、他们的情感比他们的头脑更为活跃。在思考时，他们实际上并没有从痛苦、荒谬的现象开始追问，一直追下去，从而看穿痛苦和荒谬本质上的虚无，而是马上被情感、价值观念所打断、缠绕。他们更多的是在感受世界的痛苦和荒谬，而不是思考它们。他们的理性被非理性淹没，从而只能被世界的痛苦和荒谬淹没。\n\
    \n事实上，自杀的文人、知识分子，多数人并没有真的看清这个世界的本相。荒谬也好，罪恶也好，污浊也好，的确都是表现出来的世界的真相。然而，这并不是世界的本相。也就是说，这只是存在的病态或变态，而不是它的本真状态。如果自杀者能够看清这一点，触摸到自己的存在，在他面前，痛苦和荒谬都成了暴露自己的秘密的客体，由他的理性来加以剖析，他就有心理优势，就没有什么能够打垮他。\n\
    \n进行这番精神分析，我无意于否定很多人，特别是赋予自杀以对抗黑暗的价值的人。但我想作一下对比，为什么穷困潦倒而又坚持进行哲学思考的人不自杀？他们要承受没有多少人能够同时承受到的四重痛苦：一是精神与物质的压力；二是众人的排斥、侮辱和攻击；三是因思维方式、价值观念与大多数人不一样而产生的孤独与折磨；四是看清了世界的虚妄而产生的痛苦。\n\
    \n还有，那些受尽磨难依然坚持自己的理想和信仰、争取实现人类普世价值的自由民主斗士，如曼德拉、甘地、昂山素季等政治家、思想家，他们为什么不会崩溃，没有自杀？\n\
    \n他们心理优势，具有“存在的勇气”。在心理上，他们已经超越了这个摧残他们的现实。他们的心在另一个世界。\n\n如何在这个世界上具有心理优势，呼唤出存在的勇气，获得个人救赎呢？\n\
    \n### 33. 一次“直播自杀”的心理分析\n\n有的人自杀是静悄悄的，那说明他真的想死。但有的人要“直播自杀”，说明他并不真的想死，这类人还可以挽救。\n\
    \n如果看到一个人“直播自杀”，作为观众，我们如何通过他的话判断他是炒作还是真的有自杀倾向？\n\n他是一心求死，谁也拦不住，还是其实骨子里并不想死（不同人程度不一样，可以通过语言进行判断），“直播”的目的就是让自己有一个勇气去死，或找个理由不死？\n\
    \n如果一个其实骨子里并不想死的人，在观众的围观中最终自杀了，那么，他的死，有没有被观众的一些不友好的话“逼死”的因素？如有，这里面的心理机制是什么？\n\n\
    面对“直播自杀”的人，如果搞懂了他心里到底是怎么想的，我们又该怎么办？\n\n![](img/f0502657e0e411adb97ccb25c15a5fc1_134_0.png)\n\
    \n#### ◇ 心理分析的原理，我们先记住几个规律\n\n- 1. 排除炒作，凡是在网上“直播自杀”的人，他绝对（注意，是绝对）在骨子里还有生的留恋，无论他痛苦、绝望到什么程度。\n\
    \  - 原理：一心求死的人，已经对这个世界无话可说，既不想有人看到，也不想看到别人了。所以，他如果“直播自杀”，说明即使求死的程度很强烈，仍然想和这个世界打交道，即仍有生的留恋。\n\
    \n- 2.a. 一个人在网上“透露”要自杀时，如果语焉不详，所用的词语没有具体的信息，需要你去想象，比如“永别了，这个世界”、“我想我只能离开这个世界了”，可以断定，他或者是为了炒作，或者是为了逗大家玩，或者只是心情不好时发泄一下，这三种情况，都没有表明他在那个时候想自杀。而且，这种情况下，也没有“直播”，因为一“直播”，他所说的话一定会含有具体的信息，而这是他做不到的。\n\
    \  - b. 一个人如果在网上说要自杀，并且所说的话含有具体的信息，比如，“安眠药”“父母”“工作”之类，那么，可以断定，他有玩真的倾向，而如果形成了“直播”，不只是扔一段话就走人，倾向就更强烈。如果连图片都上了呢？不用想了，他自杀的心已经非常强烈，因为他已经和自己、和大家在心理上赌上了。\n\
    \  - 原理：一个人如果真的想死，无论他痛苦、绝望到什么程度，都不会忘记给自己一个死的理由，即要对自己结束生命的行为选择一个合理的交代。对于一心求死的人来说，他已经挣扎过无数回，在心里说过无数回了。\n\
    \  - 而对于“直播自杀”的人来说，在无意识层面，他正需要把这些理由说出来。而这些理由，必须是具体的，不能玩空无所指的那一套忽悠自己（一个人可以在别的方面成功地忽悠自己，但在选择死时，绝对无法忽悠）。他说得越多，甚至还上了图，死的理由就越充分，因为他已经给自己断了后路，逼自己选择死。\n\
    \n- 3. a. 所有的“直播自杀”，有一个基本的功能，就是想自杀的人，因为对生还有留恋，因此有一个期待，希望大家安慰他或有一个突然破门而入去阻止他。直播本身就是在向大家发出一个“安慰我！阻止我！救救我！”的信号。\n\
    \  - 原理：当一个人把自杀公之于众时，如果不是出于对大家的报复（这种情况下他的语言是蔑视大家，而不是感谢、祝福之类），已经暗示了给大家阻止他、救他的期待，因为直播行为背后有两种东西：一种是，当一个人把自己的自杀公开说出来的时候，不可能大家毫无反应；另一种是，他对并不是所有人都会喊“你快死啊，你怎么还不死”有一个期待。\n\
    \  - b. 任何“直播自杀”，还有另一个功能，就是他在这一时刻，因为对生还有留恋，还没有足够的勇气去死，因此通过直播营造了一个剧场情境，在大家的关注中，让自己进入角色，从而获得一种自杀的悲壮感和勇气。直播本身是在完成一个表演程序。这个表演程序实际上已经留够了让大家阻止他、救救他的时间。\n\
    \  - 原理：对于一个对生还有留恋的人来说，在没人知道的情况下，是很难选择死的，因为他没有勇气，也无法说服自己。要成功地做到这一点，他必须对自己进行催眠。最有效的办法就是完成一套表演程序，让自己进入一个事件，最好还在大家的关注中成为主角。这样，他就不再是一个没人关注的孤独的自杀者，而是一个真正的表演者：通过表演来完成真正的自杀。\n\
    \n- 4. 任何一种“直播自杀”，无论求死的程度如何，因为还有生的留恋，一个人多少都会在观众对他说什么，不可能做到只按自己的表演程序走，而完全不会理会别人对他说什么。所以，如果观众极不友好，也不人性的话，如果被“直播自杀”的人看到，一定会刺激他，强化他的自杀倾向。可以说，有时候，一个人本可以不死的，但观众那些没人性的话，让他已经没有退路。\n\
    \  - 原理：当一个人“直播自杀”时，对于他来说，他的表演本身相当于对观众的一种承诺：我说话算数，不是在耍大家。只有观众尽力安慰、规劝他，即观众表现得不是承诺中的另一方，而是非常有爱心的人，才可能使他心理上赦免自己的“言而无信”，合理化自己最终不选择死的行为。\n\
    \  - 所以，一旦观众没有爱心，在一边拍着手等着看热闹，甚至喊出没人性的话，“直播自杀”的人和观众就有一个心理竞争，观众这种做法就会给他一个履行承诺的压力。如果最终不自杀，他会害怕丢脸，害怕被人鄙视。当“直播”的时候，他已经把自己的尊严、人格等作为赌注押上去了，相当于断了自己的后路，在观众做法不当的时候，即使他骨子里并不想死，为了尊严，也不得不死。这种死，已然是对那些喊“快死啊”的人的报复。所以，有时候，一个人最终自杀，其动机，可能已不是当初的动机，而是具体情境中的心理保护所致。\n\
    \n![](img/f0502657e0e411adb97ccb25c15a5fc1_136_0.png)\n\n#### ◇ 分析隐秘的心理语言，不是事后诸葛亮\n\
    \n接下来以一个网名叫“祭奠逝去的暖”的自杀者为例子进行具体的分析。这是事后诸葛亮，但没办法，心理分析和社会科学的其他分析一样，就是通过事后诸葛，找到规律后，让我们去做事前诸葛，或避免事后诸葛的情况再出现。\n\
    \n- 1. 先看一下“祭奠逝去的暖”的语言。\n  “说真的，还没有自杀的勇气，买来了半打啤酒，我相信醉了，我就能义无反顾了。谢谢这个世界曾经爱过我，珍惜我，帮过我，想念我，祝福我的朋友们，祝你们快快乐乐，健健康康成长。”\n\
    \  \n  假定我们在网上看到有人这样预告自杀，从哪儿可以判断他有这个倾向，而不是炒作或逗大家玩？\n  - a. 很简单，“半打啤酒”，这是有具体所指的信息。当一个人说自杀提到了具体的东西时，他已经把自己的信誉押上去了，因为具体的东西无法通过语言游戏等来辩解。\n\
    \  - b. “谢谢这个世界……”这段话更是暴露了他的自杀心理。它的功能其实只是通过抒情让自己进入角色，得到一种死前的悲壮感。\n\n- 2. 8分钟以后，他说了下面这番话，并且上了图：\n\
    \  “第三瓶了，我相信六瓶下肚我一定会有死的勇气。不要问我为什么。本来一个人在外面就很累了，可家人却还是嗜钱如命，把我个人置之度外，这样的父母实在让我太难过了。”\n\
    \  - a. 他说出了自杀的理由。一个人如果说“我好痛苦啊，好想自杀啊”，但并不说明是什么人什么事让他这样想，那证明他只是有这种“感觉”而已，并不会玩真的，因为这可以合理地归结为心情不好，而谁都有心情不好的时候。但如果说到了具体的人和事，我们就必须高度注意了，他是要玩真的，因为这些事情可能在别人看来根本没什么大不了的，但在他看来却足以致命：他冒了被人视为缺乏处理某些关系和心理问题的能力\
    \ 的风险。\n  - b. 上图是一个最能说明是玩真的的标志。相当于说：我不是和大家开玩笑，你看，证据在这里。\n\n- 3. 他继续控诉父母，继续上图，回复网友一句“没有灵魂地活着，就像行尸走肉”。\n\
    \  他一直在按自杀的表演程序走：提供理由，提供证据，在众人的关注中投入角色。这表明，他自杀的心很强烈。\n\n对网友的回复“没有灵魂地活着，就像行尸走肉”，是强化自己选择自杀的合理性。但即使这样，他仍有对生的留恋，因为他并不是全然沉浸在自己的表演程序中，还在关注围观网友的评价。\n\
    \n- 4. 终于，在网友说“楼主噶个地址呗，我们去拯救你，一起陪你喝两杯”后，他说出了自己的地址，很具体。\n  这表明，到这个时候，他还对生有留恋，还期待有人去阻止他（据说他住的地方离派出所步行不过\
    \ 5 分钟）。\n\n- 5. 一个好事的围观者问他：“死了没有啊？还不快点。”他几分钟后回复：“你急什么。等我喝得差不多的时候。”此后，再无回复。\n\
    \  他在回复这个好事围观者的时候，已经进入角色，显得很平静，因此对这种质疑他是不是真自杀的言论具有一种平静的蔑视。\n  \n  而恰恰因为如此，说完了这句话后，他不再说话，因为再说话会再遭到是不是真自杀的质疑。他明显已经和质疑言论开始了心理竞争。他继续按自己的表演程序走。\n\
    \  \n  但仍然可以肯定，哪怕是在那个时候，他仍有对生的留恋。无法想象他最后是怎么自杀的。近一个小时后，版主才看到并意识到问题的严重，马上报警。但警察赶到时，一切都已经晚了。\n\
    \n#### ◇ 看到一个人说要自杀甚至“直播自杀”，我们该怎么办？\n\n- 1. 一个人说要自杀，如果含有具体的信息，无论是什么，我们必须假定他是真的想自杀，进行安慰、规劝。如果他回复，并且所说的话仍然含有具体的信息，那么我们的安慰、规劝就要继续。如果他还给出了理由，不要犹豫了，想办法确定他的地址并报警！绝对禁止任何不友好和刺激性的话。\n\
    - 2. 如果一个人直播自杀，那就证明，他对于自杀已经有了一个表演程序，这个表演程序至少会持续一段时间，从我们第一时间发现起，到警察破门而入终结他自杀的表演程序，时间是足够的。我们要做的，是一边安慰、规劝一边第一时间确定他的地址并报警。同时，绝对禁止任何不友好和刺激性的话。\n\
    \n世界越来越狠，但完全可以战胜\n\n## PART THREE\n下部\n战胜\n这个世界\n\n## 第8章\n\n# 一只靴子: 变狼的心理机制\n\
    \n### 34. 对于狠角色来说, 一切都要从童年时讲起\n\n在分析变狼的机制时, 我想起了件往事。\n\n一个冬天, 一网友在网上披露: 复旦大学研究生张某某在半年内以帮忙收养流浪小猫为由,\
    \ 从学校同学手中骗取小猫大约 20 只, 平均 9 天换一只, 全部挖眼后丢弃, 任小猫自生自灭。另外他还从宠物市场等渠道收集小猫, 供自己虐待。\n\n\
    此事在网上披露后, 立即掀起轩然大波, 轰动一时的“硕士虐猫”事件浮出水面。\n\n据报道, 这位虐猫者刚开始是由于小猫的可爱而领养, 直到有一次因为猫调皮,\
    \ 吵得他无法休息, 就用力打了这只猫。这只猫原本是他最喜欢也是养的时间最长的, 有个可爱的名字叫皮皮。用张某某的话来说,\n\n“皮皮是我唯一正常对待的小猫”，不过“皮皮被我打得也很厉害，我把它打得奄奄一息，然后再放到草丛里面，我不确定它能够活多久，但那个时候它已经大小便失禁了”。\n\
    \n后来这种行为成了他发泄的一种方式，并且打猫时的感觉更让他产生了快感。对于那只眼睛被戳瞎的白猫，他解释为，主要是猫叫得太厉害，所以就开始打它。最后想用东西吸引这只猫的注意，就用上了剪刀。“开始不停戳它，直到把它戳得出了很多血。我当时戳的时候并没有目的，并没有想到要戳它什么地方。”说起事情的经过，虐猫者面无表情。\n\
    \n此后，虐猫成了张某某的一种乐趣。\n\n面对虐猫者的暴行，网络上对他进行了声势浩大的声讨。很多人谴责他，称其“冷血”“心理变态”“残忍”“你不该活在世上”“没人性”“应该开除”，并向被虐待的猫表示了他们的同情心。更有甚者，闻知张某某虐猫前已申请留学牛津大学，有网友还声言要搜集各种报道写邮件给英国使领馆，请使领馆予以“严格审核”；给世界各大国发邮件，请他们拒绝虐猫者的留学申请。人们对虐猫者的痛恨和对猫的同情，其反应之激烈，让人吃惊。\n\
    \n从心理分析层面来看，虐猫者的心理形成是有原因的。\n\n据报道，张某某是学数学的，较少与人沟通，比较冷漠孤僻。这就有可能导致他在心理上并不把猫视为一个有生命的动物，他会像处理没有感情参与的数学问题那样处理猫。更有可能的是，因为张某某本人曾遭受过一些挫折或打击，导致他产生了变态的心理，以虐待比他更弱小的生命来获得心理上的补偿。\n\
    \n一切都要从童年讲起。了解精神分析的人都知道，要看清一个人“得病”的原因，必须追溯他的童年史，因为他成年后的种种症状，正是早年心理创伤的结果。据说张的父母对他要求极严，他曾有过心理创伤：\n\
    \n在他被迫重修中学某一年级课程的时候，其父当晚不许他回家，让他在门前的草地上待了一夜，令他“被遗弃在外的感觉”。这种感觉是不好受的，威胁到了他的心理生存。\n\
    \n由于父亲不属于体验他的痛苦，而只需要他服从，他的心理结构产生了变异。在不符合父亲的要求就要遭受痛苦的情况下，他必须服从父亲的权力，并且不能让自己再意识到自己的痛苦和在父亲面前弱小的心理处境。所以，当可怜的小猫出现在他面前时，在无意识层面，他实际上是仇恨它们的，猫在他面前，正如自己在父亲面前。\n\
    \n张某某虐猫，既是追求一种心理补偿——父亲曾虐待他，同时也是通过制造猫的痛苦来避免体验自己的痛苦。施虐者往往也是或曾经是受虐者，这大概是一种宿命。同时，这样的人如格鲁恩所说，他的生活目标就是“掠夺自我以外的东西，就像占有别的生命和物品。这种对外的方式也是一种逃避手段，以避免同伤害的自我进行对峙”。不仅如此，正如我们在前面分析一个人的自我憎恨时指出的，一个出卖自我的人，为了逃避内心的谴责，必须认同一个强大的人，并寻找一个外在的敌人，制造一个牺牲品。如果没有一个外在的敌人，他就不得不和自己被伤害的内心面对，但这是他无法忍受的。\n\
    \n而暴力和占有的心理逻辑是：体验自己的内心痛苦没有安全感→只有服从大人的权力、符合大人的期待才有安全感→安全感与不体验自己的内心绑在一起→失去自己内心的体验，把与内心无关的一切看成现实→生命遭受挫折，为了逃避内心被伤害的自我谴责尽力去占有外物，制造一个外部的敌人→形形色色的占有狂和暴力者。\n"
  mdcn: "\n避的苦役，生活已经成为一座难熬的炼狱时，他就有卸掉这副重担的冲动。既然承受痛苦的是自己的存在，那么，把这种存在消灭，痛苦也就跟着被消灭了。压力型自杀就是良心在不堪承受的压力面前寻求解脱。\n\
    \n## 31. 抑郁，是因为世界开始发狠\n\n在当前的中国，自杀率居高不下，频繁发生，最能典型地说明社会的病态和危机。压力，无论是生活的还是精神的，都来自于外界，即社会。\n\
    \n贫穷导致一个人自杀，除了社会保障不到位，还有巨大的贫富悬殊构成的刺激。\n\n弱势群体面对的除了物质上的穷困，还得承受制度上、观念上、阶层上强势群体的精神压力。对于他们来说，整个生存处境岌岌可危，充满了辛酸与煎熬，面对生命无法承受之重，只有一死了之。\n\
    \n相对并不算弱势群体的白领、研究生自杀，则是因为面临学习上、工作上、就业上、人际关系上的巨大压力。而且他们对自己未来的预期难以确定，他们感觉生命像沙子一样无奈地流逝，自己逐渐被压力吞没，却又无法摆脱痛苦，只有一死方能解脱。\n\
    \n压力型自杀的人在精神上都不健全，有点接近于一些心理学家和精神病学家所说的“精神疾病性自杀”。原因很简单，在巨大的压力下，他们或多或少地都有心理、精神上的问题，多数都患有抑郁症、强迫症、恐惧症，而其中又以抑郁症最为突出和普遍。而恰恰是这种心理、精神上的问题，使他们丧失了一定的理性思维能力，任由心理逻辑主宰，与病态的社会合谋，把自己拖入了自杀的黑暗。\n\
    \n在中国，抑郁症患者最集中的人群恐怕就是高级白领。他们拥有较高的收入，在高档写字楼里从事着高贵的工作，良好的工作环境、光鲜的衣着以及潇洒的生活，是蓝领劳工、贩夫走卒、苦力民工们羡慕的对象。但他们在获得这一切的同时，却承受着巨大的工作压力，并且处在一个没有温情、只有冷冰冰的制度和冷漠的人际环境的环境，压抑自己的精神需求，承受着超出心理承受力的压力。\n\
    \n但能够“抽身而退”的毕竟只是极少数人，而且是后顾无忧的人。大多数白领已经接受了社会的游戏规则，认同“成功”之类的概念，被社会价值排序的观念俘虏，他们只能像一架机器一样高速运转。当他们心理上不堪承受之时，只有自杀才是解脱之道。\n\
    \n我们在媒体上经常可以看到这样的报道，很多品学兼优的学生跳楼、投河自杀，看起来让人难以置信，其实也能够理解。这些人头上无一不有着光环，有着荣耀，他人对这些光环和荣耀的羡慕让他们获得了心理满足，变成了他们的一种依赖于别人“认同”的自我认同。他们就是靠这些东西活着，因此在心里面，他们非常害怕失去这些“无形资产”，因为一旦失去，就失去了别人的羡慕和认同，他们在心理上就要崩溃。而同时，获得和保持这些东西，又让他们承受了巨大的精神压力，严重透支了他们的心理能量。这样的焦虑、恐惧和心理能量的透支，让他们在心理上变得极为脆弱，于是许多人患上了严重的抑郁症。这样的心理状态经受不了任何挫折与打击，一旦遭遇挫折或失败，他们就感觉自己被否定了，在心理上就难以生存下去，抑郁到了极点就只有通过死来解脱。\n\
    \n自然地看着待别人的成功与失败，自然地对待自己的成功与失败，实在太重要了。这是避免精神崩溃和抑郁，保持心理健康的有效方法。\n\n## 第7章\n\n#\
    \ 自杀是人类的败笔\n\n### 32. 活着，勇气可嘉！\n\n法国著名存在主义作家加缪曾经说过：自杀是唯一值得严肃思考的哲学问题。\n\n也有一种观点认为：文人的痛苦来自于思考。表面上看是这样的，思考让一个人痛苦，因为一个人意识到了让他陷入痛苦的东西，他体验到了痛苦。但不思考虽然可以让一个人体验不到痛苦，然而内心被破坏却可以使他出现心理变态。\n\
    \n我想纠正“思考会让一个人痛苦”的流行观点。根据人们说话语境和我们要说的意思，思考的内容应指两种：一是思考各种给人们造成痛苦的社会现象，比如贫富悬殊、社会不公、虚假腐败等等，人们认为，这是无法避免的，因为根本无法改变，如果总是想这些问题，就随时会遭受痛苦；二是思考关于人生价值之类问题，进行这样的思考，难免要让人怀疑生命的意义，因为生活太沉重了，活着透着悲哀和无奈，所以思考是痛苦的、危险的。所以，他们拒绝思考。\n\
    \n然而对于文人、知识分子来说，敏感的他们无法不进行这样的思考，他们并不像大多数人那样是一个随时可以把自己的大脑和心灵交出去的俗人。但问题并不在于他们的思考，而在于面对这些问题时，他们的心灵、他们的情感比他们的头脑更为活跃。在思考时，他们实际上并没有从痛苦、荒谬的现象开始追问，一直追下去，从而看穿痛苦和荒谬本质上的虚无，而是马上被情感、价值观念所打断、缠绕。他们更多的是在感受世界的痛苦和荒谬，而不是思考它们。他们的理性被非理性淹没，从而只能被世界的痛苦和荒谬淹没。\n\
    \n事实上，自杀的文人、知识分子，多数人并没有真的看清这个世界的本相。荒谬也好，罪恶也好，污浊也好，的确都是表现出来的世界的真相。然而，这并不是世界的本相。也就是说，这只是存在的病态或变态，而不是它的本真状态。如果自杀者能够看清这一点，触摸到自己的存在，在他面前，痛苦和荒谬都成了暴露自己的秘密的客体，由他的理性来加以剖析，他就有心理优势，就没有什么能够打垮他。\n\
    \n进行这番精神分析，我无意于否定很多人，特别是赋予自杀以对抗黑暗的价值的人。但我想作一下对比，为什么穷困潦倒而又坚持进行哲学思考的人不自杀？他们要承受没有多少人能够同时承受到的四重痛苦：一是精神与物质的压力；二是众人的排斥、侮辱和攻击；三是因思维方式、价值观念与大多数人不一样而产生的孤独与折磨；四是看清了世界的虚妄而产生的痛苦。\n\
    \n还有，那些受尽磨难依然坚持自己的理想和信仰、争取实现人类普世价值的自由民主斗士，如曼德拉、甘地、昂山素季等政治家、思想家，他们为什么不会崩溃，没有自杀？\n\
    \n他们心理优势，具有“存在的勇气”。在心理上，他们已经超越了这个摧残他们的现实。他们的心在另一个世界。\n\n如何在这个世界上具有心理优势，呼唤出存在的勇气，获得个人救赎呢？\n\
    \n### 33. 一次“直播自杀”的心理分析\n\n有的人自杀是静悄悄的，那说明他真的想死。但有的人要“直播自杀”，说明他并不真的想死，这类人还可以挽救。\n\
    \n如果看到一个人“直播自杀”，作为观众，我们如何通过他的话判断他是炒作还是真的有自杀倾向？\n\n他是一心求死，谁也拦不住，还是其实骨子里并不想死（不同人程度不一样，可以通过语言进行判断），“直播”的目的就是让自己有一个勇气去死，或找个理由不死？\n\
    \n如果一个其实骨子里并不想死的人，在观众的围观中最终自杀了，那么，他的死，有没有被观众的一些不友好的话“逼死”的因素？如有，这里面的心理机制是什么？\n\n\
    面对“直播自杀”的人，如果搞懂了他心里到底是怎么想的，我们又该怎么办？\n\n![](img/f0502657e0e411adb97ccb25c15a5fc1_134_0.png)\n\
    \n#### ◇ 心理分析的原理，我们先记住几个规律\n\n- 1. 排除炒作，凡是在网上“直播自杀”的人，他绝对（注意，是绝对）在骨子里还有生的留恋，无论他痛苦、绝望到什么程度。\n\
    \  - 原理：一心求死的人，已经对这个世界无话可说，既不想有人看到，也不想看到别人了。所以，他如果“直播自杀”，说明即使求死的程度很强烈，仍然想和这个世界打交道，即仍有生的留恋。\n\
    \n- 2.a. 一个人在网上“透露”要自杀时，如果语焉不详，所用的词语没有具体的信息，需要你去想象，比如“永别了，这个世界”、“我想我只能离开这个世界了”，可以断定，他或者是为了炒作，或者是为了逗大家玩，或者只是心情不好时发泄一下，这三种情况，都没有表明他在那个时候想自杀。而且，这种情况下，也没有“直播”，因为一“直播”，他所说的话一定会含有具体的信息，而这是他做不到的。\n\
    \  - b. 一个人如果在网上说要自杀，并且所说的话含有具体的信息，比如，“安眠药”“父母”“工作”之类，那么，可以断定，他有玩真的倾向，而如果形成了“直播”，不只是扔一段话就走人，倾向就更强烈。如果连图片都上了呢？不用想了，他自杀的心已经非常强烈，因为他已经和自己、和大家在心理上赌上了。\n\
    \  - 原理：一个人如果真的想死，无论他痛苦、绝望到什么程度，都不会忘记给自己一个死的理由，即要对自己结束生命的行为选择一个合理的交代。对于一心求死的人来说，他已经挣扎过无数回，在心里说过无数回了。\n\
    \  - 而对于“直播自杀”的人来说，在无意识层面，他正需要把这些理由说出来。而这些理由，必须是具体的，不能玩空无所指的那一套忽悠自己（一个人可以在别的方面成功地忽悠自己，但在选择死时，绝对无法忽悠）。他说得越多，甚至还上了图，死的理由就越充分，因为他已经给自己断了后路，逼自己选择死。\n\
    \n- 3. a. 所有的“直播自杀”，有一个基本的功能，就是想自杀的人，因为对生还有留恋，因此有一个期待，希望大家安慰他或有一个突然破门而入去阻止他。直播本身就是在向大家发出一个“安慰我！阻止我！救救我！”的信号。\n\
    \  - 原理：当一个人把自杀公之于众时，如果不是出于对大家的报复（这种情况下他的语言是蔑视大家，而不是感谢、祝福之类），已经暗示了给大家阻止他、救他的期待，因为直播行为背后有两种东西：一种是，当一个人把自己的自杀公开说出来的时候，不可能大家毫无反应；另一种是，他对并不是所有人都会喊“你快死啊，你怎么还不死”有一个期待。\n\
    \  - b. 任何“直播自杀”，还有另一个功能，就是他在这一时刻，因为对生还有留恋，还没有足够的勇气去死，因此通过直播营造了一个剧场情境，在大家的关注中，让自己进入角色，从而获得一种自杀的悲壮感和勇气。直播本身是在完成一个表演程序。这个表演程序实际上已经留够了让大家阻止他、救救他的时间。\n\
    \  - 原理：对于一个对生还有留恋的人来说，在没人知道的情况下，是很难选择死的，因为他没有勇气，也无法说服自己。要成功地做到这一点，他必须对自己进行催眠。最有效的办法就是完成一套表演程序，让自己进入一个事件，最好还在大家的关注中成为主角。这样，他就不再是一个没人关注的孤独的自杀者，而是一个真正的表演者：通过表演来完成真正的自杀。\n\
    \n- 4. 任何一种“直播自杀”，无论求死的程度如何，因为还有生的留恋，一个人多少都会在观众对他说什么，不可能做到只按自己的表演程序走，而完全不会理会别人对他说什么。所以，如果观众极不友好，也不人性的话，如果被“直播自杀”的人看到，一定会刺激他，强化他的自杀倾向。可以说，有时候，一个人本可以不死的，但观众那些没人性的话，让他已经没有退路。\n\
    \  - 原理：当一个人“直播自杀”时，对于他来说，他的表演本身相当于对观众的一种承诺：我说话算数，不是在耍大家。只有观众尽力安慰、规劝他，即观众表现得不是承诺中的另一方，而是非常有爱心的人，才可能使他心理上赦免自己的“言而无信”，合理化自己最终不选择死的行为。\n\
    \  - 所以，一旦观众没有爱心，在一边拍着手等着看热闹，甚至喊出没人性的话，“直播自杀”的人和观众就有一个心理竞争，观众这种做法就会给他一个履行承诺的压力。如果最终不自杀，他会害怕丢脸，害怕被人鄙视。当“直播”的时候，他已经把自己的尊严、人格等作为赌注押上去了，相当于断了自己的后路，在观众做法不当的时候，即使他骨子里并不想死，为了尊严，也不得不死。这种死，已然是对那些喊“快死啊”的人的报复。所以，有时候，一个人最终自杀，其动机，可能已不是当初的动机，而是具体情境中的心理保护所致。\n\
    \n![](img/f0502657e0e411adb97ccb25c15a5fc1_136_0.png)\n\n#### ◇ 分析隐秘的心理语言，不是事后诸葛亮\n\
    \n接下来以一个网名叫“祭奠逝去的暖”的自杀者为例子进行具体的分析。这是事后诸葛亮，但没办法，心理分析和社会科学的其他分析一样，就是通过事后诸葛，找到规律后，让我们去做事前诸葛，或避免事后诸葛的情况再出现。\n\
    \n- 1. 先看一下“祭奠逝去的暖”的语言。\n  “说真的，还没有自杀的勇气，买来了半打啤酒，我相信醉了，我就能义无反顾了。谢谢这个世界曾经爱过我，珍惜我，帮过我，想念我，祝福我的朋友们，祝你们快快乐乐，健健康康成长。”\n\
    \  \n  假定我们在网上看到有人这样预告自杀，从哪儿可以判断他有这个倾向，而不是炒作或逗大家玩？\n  - a. 很简单，“半打啤酒”，这是有具体所指的信息。当一个人说自杀提到了具体的东西时，他已经把自己的信誉押上去了，因为具体的东西无法通过语言游戏等来辩解。\n\
    \  - b. “谢谢这个世界……”这段话更是暴露了他的自杀心理。它的功能其实只是通过抒情让自己进入角色，得到一种死前的悲壮感。\n\n- 2. 8分钟以后，他说了下面这番话，并且上了图：\n\
    \  “第三瓶了，我相信六瓶下肚我一定会有死的勇气。不要问我为什么。本来一个人在外面就很累了，可家人却还是嗜钱如命，把我个人置之度外，这样的父母实在让我太难过了。”\n\
    \  - a. 他说出了自杀的理由。一个人如果说“我好痛苦啊，好想自杀啊”，但并不说明是什么人什么事让他这样想，那证明他只是有这种“感觉”而已，并不会玩真的，因为这可以合理地归结为心情不好，而谁都有心情不好的时候。但如果说到了具体的人和事，我们就必须高度注意了，他是要玩真的，因为这些事情可能在别人看来根本没什么大不了的，但在他看来却足以致命：他冒了被人视为缺乏处理某些关系和心理问题的能力\
    \ 的风险。\n  - b. 上图是一个最能说明是玩真的的标志。相当于说：我不是和大家开玩笑，你看，证据在这里。\n\n- 3. 他继续控诉父母，继续上图，回复网友一句“没有灵魂地活着，就像行尸走肉”。\n\
    \  他一直在按自杀的表演程序走：提供理由，提供证据，在众人的关注中投入角色。这表明，他自杀的心很强烈。\n\n对网友的回复“没有灵魂地活着，就像行尸走肉”，是强化自己选择自杀的合理性。但即使这样，他仍有对生的留恋，因为他并不是全然沉浸在自己的表演程序中，还在关注围观网友的评价。\n\
    \n- 4. 终于，在网友说“楼主噶个地址呗，我们去拯救你，一起陪你喝两杯”后，他说出了自己的地址，很具体。\n  这表明，到这个时候，他还对生有留恋，还期待有人去阻止他（据说他住的地方离派出所步行不过\
    \ 5 分钟）。\n\n- 5. 一个好事的围观者问他：“死了没有啊？还不快点。”他几分钟后回复：“你急什么。等我喝得差不多的时候。”此后，再无回复。\n\
    \  他在回复这个好事围观者的时候，已经进入角色，显得很平静，因此对这种质疑他是不是真自杀的言论具有一种平静的蔑视。\n  \n  而恰恰因为如此，说完了这句话后，他不再说话，因为再说话会再遭到是不是真自杀的质疑。他明显已经和质疑言论开始了心理竞争。他继续按自己的表演程序走。\n\
    \  \n  但仍然可以肯定，哪怕是在那个时候，他仍有对生的留恋。无法想象他最后是怎么自杀的。近一个小时后，版主才看到并意识到问题的严重，马上报警。但警察赶到时，一切都已经晚了。\n\
    \n#### ◇ 看到一个人说要自杀甚至“直播自杀”，我们该怎么办？\n\n- 1. 一个人说要自杀，如果含有具体的信息，无论是什么，我们必须假定他是真的想自杀，进行安慰、规劝。如果他回复，并且所说的话仍然含有具体的信息，那么我们的安慰、规劝就要继续。如果他还给出了理由，不要犹豫了，想办法确定他的地址并报警！绝对禁止任何不友好和刺激性的话。\n\
    - 2. 如果一个人直播自杀，那就证明，他对于自杀已经有了一个表演程序，这个表演程序至少会持续一段时间，从我们第一时间发现起，到警察破门而入终结他自杀的表演程序，时间是足够的。我们要做的，是一边安慰、规劝一边第一时间确定他的地址并报警。同时，绝对禁止任何不友好和刺激性的话。\n\
    \n世界越来越狠，但完全可以战胜\n\n## PART THREE\n下部\n战胜\n这个世界\n\n## 第8章\n\n# 一只靴子: 变狼的心理机制\n\
    \n### 34. 对于狠角色来说, 一切都要从童年时讲起\n\n在分析变狼的机制时, 我想起了件往事。\n\n一个冬天, 一网友在网上披露: 复旦大学研究生张某某在半年内以帮忙收养流浪小猫为由,\
    \ 从学校同学手中骗取小猫大约 20 只, 平均 9 天换一只, 全部挖眼后丢弃, 任小猫自生自灭。另外他还从宠物市场等渠道收集小猫, 供自己虐待。\n\n\
    此事在网上披露后, 立即掀起轩然大波, 轰动一时的“硕士虐猫”事件浮出水面。\n\n据报道, 这位虐猫者刚开始是由于小猫的可爱而领养, 直到有一次因为猫调皮,\
    \ 吵得他无法休息, 就用力打了这只猫。这只猫原本是他最喜欢也是养的时间最长的, 有个可爱的名字叫皮皮。用张某某的话来说,\n\n“皮皮是我唯一正常对待的小猫”，不过“皮皮被我打得也很厉害，我把它打得奄奄一息，然后再放到草丛里面，我不确定它能够活多久，但那个时候它已经大小便失禁了”。\n\
    \n后来这种行为成了他发泄的一种方式，并且打猫时的感觉更让他产生了快感。对于那只眼睛被戳瞎的白猫，他解释为，主要是猫叫得太厉害，所以就开始打它。最后想用东西吸引这只猫的注意，就用上了剪刀。“开始不停戳它，直到把它戳得出了很多血。我当时戳的时候并没有目的，并没有想到要戳它什么地方。”说起事情的经过，虐猫者面无表情。\n\
    \n此后，虐猫成了张某某的一种乐趣。\n\n面对虐猫者的暴行，网络上对他进行了声势浩大的声讨。很多人谴责他，称其“冷血”“心理变态”“残忍”“你不该活在世上”“没人性”“应该开除”，并向被虐待的猫表示了他们的同情心。更有甚者，闻知张某某虐猫前已申请留学牛津大学，有网友还声言要搜集各种报道写邮件给英国使领馆，请使领馆予以“严格审核”；给世界各大国发邮件，请他们拒绝虐猫者的留学申请。人们对虐猫者的痛恨和对猫的同情，其反应之激烈，让人吃惊。\n\
    \n从心理分析层面来看，虐猫者的心理形成是有原因的。\n\n据报道，张某某是学数学的，较少与人沟通，比较冷漠孤僻。这就有可能导致他在心理上并不把猫视为一个有生命的动物，他会像处理没有感情参与的数学问题那样处理猫。更有可能的是，因为张某某本人曾遭受过一些挫折或打击，导致他产生了变态的心理，以虐待比他更弱小的生命来获得心理上的补偿。\n\
    \n一切都要从童年讲起。了解精神分析的人都知道，要看清一个人“得病”的原因，必须追溯他的童年史，因为他成年后的种种症状，正是早年心理创伤的结果。据说张的父母对他要求极严，他曾有过心理创伤：\n\
    \n在他被迫重修中学某一年级课程的时候，其父当晚不许他回家，让他在门前的草地上待了一夜，令他“被遗弃在外的感觉”。这种感觉是不好受的，威胁到了他的心理生存。\n\
    \n由于父亲不属于体验他的痛苦，而只需要他服从，他的心理结构产生了变异。在不符合父亲的要求就要遭受痛苦的情况下，他必须服从父亲的权力，并且不能让自己再意识到自己的痛苦和在父亲面前弱小的心理处境。所以，当可怜的小猫出现在他面前时，在无意识层面，他实际上是仇恨它们的，猫在他面前，正如自己在父亲面前。\n\
    \n张某某虐猫，既是追求一种心理补偿——父亲曾虐待他，同时也是通过制造猫的痛苦来避免体验自己的痛苦。施虐者往往也是或曾经是受虐者，这大概是一种宿命。同时，这样的人如格鲁恩所说，他的生活目标就是“掠夺自我以外的东西，就像占有别的生命和物品。这种对外的方式也是一种逃避手段，以避免同伤害的自我进行对峙”。不仅如此，正如我们在前面分析一个人的自我憎恨时指出的，一个出卖自我的人，为了逃避内心的谴责，必须认同一个强大的人，并寻找一个外在的敌人，制造一个牺牲品。如果没有一个外在的敌人，他就不得不和自己被伤害的内心面对，但这是他无法忍受的。\n\
    \n而暴力和占有的心理逻辑是：体验自己的内心痛苦没有安全感→只有服从大人的权力、符合大人的期待才有安全感→安全感与不体验自己的内心绑在一起→失去自己内心的体验，把与内心无关的一切看成现实→生命遭受挫折，为了逃避内心被伤害的自我谴责尽力去占有外物，制造一个外部的敌人→形形色色的占有狂和暴力者。\n"
