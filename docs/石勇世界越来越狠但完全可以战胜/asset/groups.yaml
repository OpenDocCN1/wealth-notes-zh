    # 第4章


    # 狠角色的后台


    16. 狠角色的隔代接班人


    权责、富豪阶层（或自认为非平民阶层）的装13在现在的中国是如何培养一个狠人的？


    有些狠角色是父母培养的，而在这背后，还有更深的背景。

    比如药家鑫，比如歌唱家李某某之子“轮流发生性关系”。

    李父曾经说，儿子是国家的，舍不得打。

    这虽然很装13，但也诚实，绝不把自己及自己的儿子混同于没有“国家”罩着的屌丝们。我想说，装13，恰恰是中国所谓“上流社会”（或自称上流社会）的一种本能。'
  - '[PAGE 82]


    装13背后潜藏着暴力。


    李某某的斑斑劣迹，总是让我想起药家鑫。一样的有一个体制内的爸，一样的从小就被父母训练去学音乐艺术，一样的有一双会弹钢琴的手，出了事后，一样的有上流社会的人帮腔袒护。区别只在于，药家鑫残忍地杀了人，而李某某只是开宝马打人、轮奸。


    但他们对社会的祸害只是五十步笑百步。


    按照一般人的想法，从小就受音乐艺术“熏陶”，这是多么高雅和文明啊，几乎无法和打人、轮奸这类事情联系起来。我只能说，这很无知。


    先问一下，音乐艺术之类是用来干吗的？是用来装13的，还是用来陶冶人的心灵的？


    很清楚，很多音乐艺术如果出自天然，就像很多贫困地区的“原生态”唱法那样，对于人的心灵是有所改善的，因为它本身就是让人和自己的存在相遇。但唱民族美声唱法，弹钢琴之类是什么玩意？那只是一种技艺，一种上流社会的装13，和人的心灵没什么关系。


    更何况，在现在的中国，体制内的所谓音乐艺术还不仅仅是装文明13。


    在两种情况下，音乐艺术类玩意不仅改善不了人的心灵，反而对心灵是一种破坏。


    一种情况是，以“艺术”的名义，在家庭或上层社会鄙视底层的风气下，赋予弹钢琴之类玩意以高档的地位，由此形成对下层社会的心理优势，从而把弹钢琴者变成一个高级势利的俗货，一个只对阿猫阿狗有爱心却对底层屁民冷漠之极的装13者。不独药家鑫、李天一，这类人在当今中国的上流社会，以及小资白领阶层中比比皆是。


    另一种情况是，家庭和阶层教育，构成了对弹钢琴者的心灵的破坏。无论看起来多么风光，但我能够想象到李某某的心理痛苦。从一开始，他的人生就不是在由自己决定，而是由他的父母，他所在的阶层的风气'
  - '[PAGE 83]


    决定。李双江确实给了李某某 “正面” 的东西，但这些东西无论是否装13，都是强行灌输给李某某的，即把暴力的种子种进了李某某的心理结构深处。另外，体制内的优越感，这个体制对下层的剥夺和鄙视，一并把暴力渗进了李某某的生命里。


    一个人在心理上受到破坏，一定会对自己或外界进行攻击，这是心理铁律。以李某某的家庭氛围和阶层氛围，已经明确地建立了对臣民的心理优势，当然不会对他的自我进行攻击，而是对外，对更弱者。


    可以说，体制对权力者的溺爱，和李爹对儿子的溺爱、上流社会对自己子女的溺爱是一体两面。他们稳固自己的权力、利益、身份和对平民的心理优势，但让自己的子女延续、加剧对平民的祸害。


    只是，这造成了两个后果：


    +   A. 虚伪传递到下一代，使下一代很难面对自己的内心，因此心灵容易被破坏。


    +   B. 老年得子之人，几乎都有一种近乎变态的溺爱，这加剧了对孩子心灵破坏的程度。


    这里的心理很简单：一个人年老 了，死亡恐惧日益逼近，生命的意义逐渐丧失，而有了一个小孩，尤其还是年轻老婆生的，则在和别人的对比中，在和自己过去的对比中，恍然有了年轻的感觉，生命似乎有了格外的意义。这对于老去、死去焦虑的治疗，比装嫩的心理效果好得太多了。而为了抓住这种感觉，就必须在心理上把自己和子女绑定，把自己的很多想法投注到子女那儿，对其包容溺爱。总之，要在心理上构成两位一体。


    一个普遍的心理规律是：对子女溺爱，几乎就是在培养一个人渣。不同的只是，平民对子女的溺爱只能自食其果，让子女埋怨为什么他爸不是李刚而是你，甚至恨你，成为家庭的祸害；而上流社会对子女的溺爱，'
  - '[PAGE 84]


    则是在祸害平民。


    无论何种溺爱，结果无一例外，都是在培养子女在社会价值排序上和别人的对比，培养子女的自私、自大、冷酷无情。他会认为任何人都欠他的，如果他的要求得不到满足，就会对弱者（父母或他人）下手。


    我们来看两个版本。


    A. 平民的版本：当一个人对小孩溺爱时，在他心理上会发生什么？发生的是：“你们对我好是理所当然的，而如果不能满足我的要求，让我混得比别人惨，你们就对不起我，我会恨你们，我要报复！”极端的情况是：“为什么别人的爸是李刚，而你不是？”


    这样的孩子在和别人的比较中受挫时，会归罪于父母的没出息，会恨父母让自己的存在如此耻辱。他挑战不了强者，但父母的窝囊却是他下手的对象。


    B. 权贵富人阶层的版本：当一个人对子女溺爱时，在子女心理上发生的是：“好啊，你让我觉得我多么牛 13，多么伟大，我想要什么都可以，想做什么都可以。而且，你还可以罩着我，我还有什么可怕的呢？”


    按这个逻辑一推，他在家里是老大，也要在外面耍威风才能爽。父母和背后的东西，是支撑他要威风的一切，是他强大的后台，他当然不会去挑战，而是去对那些可以让他有心理优势的东西下手。'
