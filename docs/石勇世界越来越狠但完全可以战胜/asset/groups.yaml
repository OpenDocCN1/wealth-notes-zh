    “尽管超声介入开展得如火如荼，还是有不少局限性，经常只是干些搭把手的活。而且，离开了机器，就没办法为病人解决一丁点问题。”


    当然逃离不了。他既无法上其他专业的博士，找的工作也仍是超声科。没有出口。


    于是，只能投射、转移到恋爱、婚姻以及其他事情（做生意）上。这意味着，他再一次要面对自己的无力、自我否定，向“现实”露出伤口。


    这些，同居一室的黄洋显然没有读懂。


    不清楚他们在2012年末，因何事而在QQ上互删好友，但可以肯定，以黄洋的性格（表演型），既和林某合不来，同时黄洋在专业上或别的方面一些充满优越感的语言，也会直接间接地刺激到敏感且处于心理灾难区的林某。


    黄洋可以读在专业上有“价值”的博士，而林某不能，林某不会嫉妒，但会受伤。黄洋在交际上包括和女性的交往上游刃有余，林某也不会嫉妒，但会感觉被贬损。总之，同居一室，黄洋的存在，对于林某的心理来说，是一种威胁。


    是很多交往中的细节，包括一些敏感的语言的积累，而不只是某一句话，使得林某萌生了杀机。但最值得分析的，是“凤凰男”这一句。


    “凤凰男”既曾经是林某的自嘲，也是黄洋对他的界定。但正如我们前面分析的，自嘲只是先踩自己以防止别人来踩，不等于接受自己这样说自己，这和别人这样说自己心理上是完全不一样的。


    林某一度因专业自信（不仅有心理优势，而且意味着以后的事业自信）而让自己和“凤凰男”的思维、价值观划清界限，在那个时候，说他是“凤凰男”，打击的只是农村出来的身份，不是整个存在，心理上冲击不太大。但当他在专业上产生自我怀疑、自我否定，并且把自己在思维、价值观上变成了一个自己讨厌的“凤凰男”后，再说他是“凤凰男”，杀伤力就太大了，等于他已溺水了，还使劲再打一杆子。


    这足以化为不可阻挡的仇恨，且化为行动。


    还原投毒的过程和现场，那是警方的事情。我只大致描述一下林某的心理轨迹：


    - 1. 早就想报复黄洋，早就偷了 N-二甲基亚硝胺，但当时并没有决定就是用 N-二甲基亚硝胺来报复，因为报复可以有多种方式，而且，当时偷 N-二甲基亚硝胺还有一个心理功能，就是给自己谋取心理优势，因为有这种毒药可以让自己在心理上对黄洋形成威胁。这就像一个人喜欢拿一把刀在身上壮胆，并不见得要去杀人一样。


    - 2. 投毒前的一段时间里，黄洋和林某语言不和。林某决定报复黄洋。


    - 3. 尽管已丧失对生命的神秘感、神圣感，但杀人和杀大白鼠毕竟不一样，仍要克服心理障碍。林某选择在 4 月 1 日这一天投毒，正是为了利用“愚人节”“一个玩笑”这类文字游戏来克服自己的心理障碍。所以，他在向警方交代时，自称投毒是一个愚人节玩笑。报道说，办案人员对此很难采信。


    我请办案人员相信，他说的是真话。


    ## 3. 同事？一不小心，在有心理问题的人面前，你就会中枪


    ◆ ◆ ◆


    官场、职场中，在同事面前中枪的人不少，尤其是在同事的内心早已变狠，而你还不知道的时候。


    计生委办公室主任李琢同志就中枪了，这件事是成都市计生委研究室调研员孟立联同志干的。他在微博上假冒李琢之名，大曝官场腐败生态的事情，作为一个轰动事件，曾被全国人民强势围观。


    一直到现在为止，没有更多的秘密漏出来，但就心理分析而言，足够了。因为一个人的真实心理，并不需要用他的嘴巴说出来。就像破案一样，我们还是可以从蛛丝马迹中进行心理分析的。


    ◆ ◆ ◆


    ### ◆ 假面的心理逻辑


    我能够理解，李官员为什么表示“很受伤”。因为他是拿我们的孟兄当兄弟看待的，没有想到孟兄居然干这种不讲兄弟情义的事。


    但对孟兄的行为，我也表示理解——就是说，在心理上可以理解他为什么这样。


    无数消息证实，孟立联在成都市计生系统内，被公认颇有才气。在当官的同时，他还兼职西南财经大学中国西部经济研究中心人口研究所教授，出席过论坛，发表过论文，属于“知识型官员”。这么有才的人，在越来越讲究“知识化”的官场，在仕途上却不甚顺利，两度群众测评不过关。而他那个“调研员”牌牌显然是个处级，但已属于没有实权的人，被晾到一边了，估计折算了多少钱或女人。


    我想强调一下，孟立联绝不是从一开始就故意要整李琢，并没有什么精心策划的阴谋。李琢倒霉只倒霉在恰好孟立联坐在他旁边，因为孟的心理问题，一不小心就被当枪使了。


    可以复原一下孟立联的心理逻辑。


    他觉得自己很有才，自命清高，但在官场里得不到升迁，无法说服自己这是合理的，不爽，郁闷。而在其他人都得到升迁的情况下，受到刺激，羡慕嫉妒恨。他有一种被伤害感。因为不能把处境归罪于自己“没本事”，于是便归罪于抽象的官场，尤其是那些刺激到他的人。在心理上，他要报复他们，当然，这些人也包括李琢。


    就是说，孟立联得了“官场神经症”。他要“疗伤”。


    一个声音高叫着：“都是你们造成的，我恨你们！”


    注意，李琢等官员在行为上不一定得罪了孟立联，但他们升迁、优越游戏本身就是对他的得罪。而孟立联的报复，也只是心理上的报复，以他的自命清高，断不会采取一封信搞到纪委这类革命行动。


    心理上报复一个人或一堆人，有多种方式可供选择，比如不屑于理会别人，比如背地里骂几句。这些方式孟立联也干过，比如不去和他在微博中点到名的官员接触，在食堂吃饭也很少坐在一起。在心理上，这是一种故意表现出来的鄙视。


    在微博，一开始他用的是“派高 2455712653”这个 ID，发牢骚专用，对自己得不到升迁所产生的不爽、郁闷进行排泄——发牢骚属于“官场神经症”的简易形式，同时也是对它的初级疗法。


    后来，他偶然听到了李琢那些“不可告人”的秘密，精神为之一振。当李琢陶醉在对诸如玩情人、收礼金、玩女人等“官场神经症”绘声绘色的描述中时，他没有想到，有一个“兄弟”正在一边“窃听”！


    “偷窥”“窃听”能给一个人以阴暗的快感，因为玩“偷窥”“窃听”的人在明处，而被“偷窥”“窃听”的人在暗处，前者在心理上解除了后者的武装，具有强大的心理优势，恰恰适合孟立联这类自命清高的人来玩。


    而如果让自己去扮演被“窃听”对象的角色，以他的身份、口气、姿态、表情等把情境再重演一道，然后让自己去欣赏这个角色的演出，那就不仅仅是有心理优势，而且有作弄、羞辱别人的伟大而阴暗的快感了。对于孟立联来说，这几乎可以达到在心理上报复李官员、王官员等人的最高境界。所以，他在微博上对李琢的话进行了忠实的描述，而且形象生动，同时，还把ID最终改成了“李琢19961003”。


    可以想象，当李琢和别人讲话，孟立联一边听一边发到“李琢19961003”的微博上时，他在内心里是多么的兴奋和激动。其心理语言是：“你们这帮龟儿子，干的这些×事以为老子不知道？哈哈……”


    强调一下，孟立联对李琢的话进行“微博直播”，不是用来给网民看的，而是用来给自己看、让自己爽的。不幸的是，网民看到了，真是悲剧。


    ### ◆ 官场神经症


    孟立联怎么会有这种“官场神经症”？而其他官员的包二奶、微博开房、写“性爱日记”等其他形式的“官场神经症”，又如何理解？


    来看一下官场。简单地说，官场就是官员们活动的一个场域，这个“场”，英文的对应词是field，不仅仅指“空间”，还兼有“田地”的意思，暗示有“生长”，有“收获”。


    收获的是利益，生长的是“官场神经症”。


    如果不用利益把一大帮人召唤到官场，是玩不转的。但仅仅用利益，它也转不了了。所以今天的官场有它坚不可摧的组织逻辑：科层化。科层化特别讲究官僚机构的权力等级划分、规章制度管理、文凭、证书等。


    所以，“有才”还当“兼职教授”的孟立联得不到升迁，当然不会服气。


    除此之外，官场还有一套生存逻辑，比如要学会钻营拍马。


    利益、科层化、生存逻辑，共同组合成官场强大的游戏规则，直接的后果就是导致对官员的“非人格化”：要在官场混下去，你必须隐藏真实的自己，压抑自己的内心。你在官场上，所看到的每一张脸可能都戴着面具，包括自己。李琢太不小心了，只顾说得痛快，明显忘记了这一点。


    这样一来，官场就成为一个“致病情境”，也就是说，会让人产生某些病态的心理特征，这些病态的心理特征即为“官场神经症”的正式解释。而一个人要进入官场，不能像普通群众那样思考，必须把自己“豁出去”。


    作为一种有自我意识的存在，人本质上其实最害怕失去自我，失去的话，他一定会有自我憎恨，因为有一种“存在的声音”告诉他，人不应该是这个样子的。因此，在这个世界上，有些人是无法去信仰宗教的，因为他珍视那个独立的自我，做不到让自己完全投身进去。很多“不适应官场”的人，也是如此。


    当一个人“豁出去”了，意味着什么呢？意味着在官场上，他至少付出了压抑自己内心的沉重代价，那就必须给自己一个“合理的”交代。在信仰和理想主义存在于官场的时候，这不是问题。因为，当一个人投身进去时，心理可以体验为是在信仰和理想的召唤之下，将其看成是“为人民服务”，是一种崇高的“献身”。他通过廉洁奉公、兢兢业业，给了自己和想象中无数看着他的人一个交代。


    但当一个官员进入官场主要是受利益驱动时，情况就不同了。如果不听党和政府的教育，他很可能会得“官场神经症”，早已存在的“官场神经症”也会传染给他。孟立联正是如此：不具有革命前辈们那种不计较职务高低的崇高精神，让自己郁闷到捅出了这么一个大娄子。


    这个事件，把“官场神经症”暴露得栩栩如生。我们可以进一步梳理一下几类常见的症状：


    一类就是发牢骚性质的。“李琢 19961003”代表了一些官员，表述得非常清楚：“整天假话空话套话大话，老子心里太苦太累了，只有在这里说点真话。”发牢骚追求的是发泄，其功能是让官员排解郁闷，以便少些心理负担，继续投入到说假话空话套话大话的事业中去。


    在酒桌上说黄段子其实也是一种另类的发泄。大概一些官员在这方面比人民群众更有才华。这与智力关系不大，只是因为他们平时都不能放开，因此“解除压抑”时更猛烈。


    另一类“官场神经症”，属于补偿性质，靠“占有”来解决心理问题。当一个人压抑自己的内心就是为了得到利益时，追求利益就是他补偿自己的手段。这种“官场神经症”往往比较疯狂，因为任何东西都无法补偿、挽救一个人对自我的出卖，所以有这种症状的官员，根本停不了手，占有本身已经成为一种自我“治疗”，一停下来他就有恐惧。这方面的经典例子太多了，比如写“性爱日记”的广西烟草局销售处原处长韩峰、杭州市原副市长许迈永“许三多”。


    还有一类，已经不仅仅是具有病态特征的“官场神经症”，而是泡在官场，官员得了痛苦的心理疾病，比如抑郁症。它的心理逻辑是“我受不了了，结束吧”。于是，内向攻击，自杀。


    所有这些“官场神经症”有一个共同的特征：用嘴儿说出来，用行动玩出来，既是症状的表现，同时又是它的“语言疗法”“行为疗法”。这种“治疗”当然是无效的。


    ## 4. 亲人？自私的人，往往用“梦想”来包装自己


    亲人变狠后，也会伤害我们，无论是精神上，还是人身（安全）上。硕士研究生苗某，毕业后找不到想要的好工作，回家种地，父亲承担不了各种压力，服毒自杀了。但他没有死成，被救活了。他对自己如此下狠手。但他没有看到其子在内心的变狠。网上那些只知道骂教育体制的人，同样也失去了看到的能力。


    ### ◆ 变狠的标识之一是失去责任


    在这个世界上，一个人可以自私，但是，如果用“梦想”来包装自己的自私，那就很可怕。


    硕士研究生苗某，正是这种人。


    悲剧并不是他找不到工作（他曾在某双语学校工作过，也有中学联系他工作事宜），而是想找“收入稳定”的工作，且工作环境又适合他实现“文学创作”的伟大梦想。


    而这种理想的“收入稳定”的工作，就是所谓的“铁饭碗”——当公务员或进事业单位。做一个教师或做其他，好像就会挡了他实现“梦想”的道。


    多么具有中国特色的伟大梦想啊。但纳税人拿钱去养一个在政府机关、事业单位搞“文学创作”的公务员，显然不太好，这比养一个饭桶好不了多少。能够名正言顺的，就是想办法混进文联，这是合法的“包养”，可惜他又拿不出具有足够分量的文学作品。


    我注意到，苗某说了这样一句话：“每个人都有一生人生梦，我的梦就是创作文学。”


    “创作”这个词，属于具有体制“包养”特征的文联、作协的话语体系，在20世纪90年代以前非常流行。一个自我言说“创作”的人，对应着他被体制“包养”的作家身份或对这一身份的向往。苗某在今天还用它来表达，无异于一种自我暴露：一个清高迂腐、自卑自恋、自怨自怜、思维还停留在上个世纪的小文人。


    一个人有“创作文学”的梦想当然也没什么不好。但是，对于苗某来说，他已经超过40岁，家里一贫如洗，老父有病，正期待他来改善家庭的贫困状况，能够找到一点钱治病。对于他来说，毕业后要做的，就是担当起一个儿子、一个男人的责任，先找个工作养家糊口——而这样，也并没有妨碍他的“创作文学”！


    但他好像不知道有这样的责任。


    同时，他好像也不懂得预知回乡务农可能对父母的伤害。他不愿意去理解父母对自己投入了多少期望，以及自己这样会不会成为别人嘲笑父母的把柄。


    这是一个从来就不愿意为别人考虑的人！


    而更让人悲哀的是，在不能混进政府和事业单位搞“创作文学”后，当上了“农民研究生”“农民作家”，他还可以将其想象是为了文学的梦想、理想，他受到了这个社会的漠视，但始终坚持着理想。经由这种想象，自己的人格瞬间崇高起来。我曾经说过，一个没有道德的人，一定是一个内心被破坏的人，一个强迫自己变狠的人。这里指的，是那些羞辱穷的人的人，是那些暗算别人的人。还有一类人，他们不会去主动攻击别人，却无视自己对于他人的道德义务，从而消极地对他人构成伤害，这类人，无一例外地是有人格缺陷的人。


    ### ◆ 把亲人押上赌桌


    苗父的自杀，除了绝望，还有巨大压力。它就来自于“社会价值排序”这个恶魔。


    一个人只要屈服于社会价值排序，心理问题的门就会向他打开，他就会不得安宁。如果社会价值排序的挤压让他在心理上难以生存，他甚至可能通过自杀来逃避。


    屈服社会价值排序的人，最喜欢和别人进行心理竞争赌一把，所有可以衬托自己价值的东西都可以是赌资。很多人喜欢比谁的儿子有出息就是这个道理，儿子出息就意味着他比对方社会价值排序高，在心理上就可以压倒对方。


    但如果儿子最终还是没有出息，在社会认知中成了一个笑柄呢？


    - 1. 我们还愿一下苗某刚考上研究生时的情境：


    文凭在社会价值排序中是处于高端的，可以转化为其他稀缺资源。一个研究生，可能在城市社会价值排序已经不高，但对于一个小山村来说，还是很不得了的。而苗某是他们那个村有史以来的第一个研究生。


    所以，他考上研究生，村民一定有这样的想象：哇，有出息了。像北大一位研究生，刚找到工作（注意，还只是刚工作）时月薪 8000，他父母嫌丢脸，称年薪应该百万，从中可以想象到这样的父母的认知水平，以及把儿子作为赌资产押上心理竞争的赌桌时是如何地坚定。


    对于苗父来说，苗某考上研究生，心里肯定是乐翻了天。因为“儿子是研究生”这个属性，给了他希望，在众乡亲面前，也具有了心理优势。


    有的村民无论嘴巴说什么，多少会因为自己和苗父在心理上的关系有了一点改变而产生心理落差。从苗某回乡后的“闲言碎语”中还可以判断，有的人甚至在当时羡慕嫉妒恨。


