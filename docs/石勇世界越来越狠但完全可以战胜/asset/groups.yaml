    '
  mdcn: '

    人来管自己本来可以管好的事情。当然，更没有谁傻到去委托一个靠自己养活的人来和自己争利，不通过立法机构就让自己掏钱，甚至侵害自己。


    人们成立政府，无非是委托它去做公民个人以及社会都无法做或无法很好地做到的事情。


    概括起来，政府要干的是四件大事：提供公共产品、保障公民自由、监管调控市场、维护社会公正。对它的边界约束，就是宪法和法律约束；依法执政，找不到宪法和法律依据的行为，不能去干。这和公民的自由相反，没有法律禁止的，公民就可以去干。


    ## ◇ 国家 = 政府 + 人民


    追根究底一下，政府缺位、越位最重要的根源，就在于当它以国家权力的面目出现时，把自己简单地等同于国家。但事实上，国家 = 政府 + 人民，国家的意志，必须体现人民的意志，但政府的意志有时候体现的仅仅是执法者自己的意志而已。


    在这个混淆下，政府权力轻易就会越出自己的边界，冒充国家意志和人民意志，在干自己要干的四件大事时，常常干不好，或者一有利就上。比如，一方面，政府提供的公共产品严重不足，但另一方面，那些因为垄断了很多稀缺资源，看起来应该提供半公共产品的国有企业，却又赚得盆满钵满，与民争利，这个问题到现在仍然没有解决。


    办国有企业，首要目的就是提供公共或半公共产品，这和从纳税人那儿收税用来提供公共或半公共产品的性质是一样的。按道理，国有企业越多，越能赚钱，对纳税人的税收应该越少，政府提供的公共产品也应该越好才对。但事实恰恰相反，纳税人的税负极重，公共产品稀缺，而国有企业的红利远不能被全民分享，变成了政府的收益和利益集团的收益，这相当于把国家所有的企业变成了政府甚至利益集团所有的企业。


    既然如此，凭什么要让某些国有企业垄断很多稀缺的资源呢，这不是政府在办公司，让自己公司化么？


    又比如，政府轻易就能把属于“国家所有”的自然资源收归给自己，但“国家所有”，逻辑上也可以是“人民所有”，国家的收益权并不只归于政府。以行政法规的方式收税，这也是把政府的行政权力等同于国家权力中的立法权。而人民从未赋予政府那么多的权力。


    政府的功能缺失、越位，在于角色混乱，一会儿把自己看成是一个国家，一会儿把自己看成是一个公司，一会儿又把自己看成是一个家长。但事实上，这几个角色它都不全是或根本不是。它不是市场中的主体，不能行使所有的国家权力，不是凌驾于社会之上控制、压抑社会的一个庞大权力机构。它的权力是有限的，能力也是有限的。


    ## ◇ 政府不是公司


    当然，问题远没那么简单。现代政府虽然是有限政府，但主动被动地，显然不可能只干前面所说的那四件大事。


    在经济风险轻易就会引发社会、政治风险的现代社会情境中，至少从美国的罗斯福新政开始，促进经济发展、防止经济衰退等也成了政府的职能，毕竟爆发经济危机对一个国家、一个社会的打击是沉重的，似乎也关乎公共福祉，在强大的民意压力下，搞不好政府就得下台。


    中国政府尤其放大了这一职能。从思路上看，它自觉承担起“发展经济”的“重任”，既是过去全能政府的残余，同时也是改革开放后维护政治认同的手段，因为经济停滞，会涉及政府本身治理的合法性。


    不同的是，北美、欧洲还有日本、韩国等并不把自己视为是经济发展的主体，或是主导经济发展，因为它们既不像中国政府能够控制那么多的经济资源，各自的民主政治制度也使它们无法把政府公司化。但中国政府占有太多的经济资源，同时，它的权力畅通无阻。大到制订经济发展计划，中到控制经济资源、干预经济运行，小到出动政府工作人员招商引资，政府作为经济发展的“主体”，对经济的干预是全方位的。它是主导者，出台的政策、控制的资源决定了经济发展的速度和经济的结构，以及利益在经济和社会领域的分配。


    很多人喊政府不要干预、扭曲市场，界定好公共权力市场的边界，喊了很多年，到现在成效不大，原因就在于此。只要政府还自我定位为经济发展的主体或主导者，它怎么可能放弃对经济资源的控制，放弃以行政手段去干预经济呢？更何况，通过对经济领域的介入，权力可以获得最方便的利益变现。


    就中国复杂的现实来说，的确可以认为，政府承担发展经济的职能，把让一个国家变得富强视为自己的责任没有问题。它在社会管理领域、在公民权利领域可以也应该消极无为，但在提供公共产品、保障公民权利、监管调控市场、维护社会公正、促进经济发展上，是应该积极作为或可以有所作为的。


    但在经济发展上有所作为时，理念必须澄清，和简单把政府等同于国家一样，问题就出在理念的混乱上。政府本身不是也不应该是经济发展的主体，它不是创造财富的主体，创造财富的主体是企业和公民。如果政府把自己视为是经济发展的主体，结果就是把自己公司化，这是公共权力的异化，人们成立政府，并不是为了把它变成一个公司。政府主导经济发展时，也应有明确的边界意识。它只能是在宏观上主导，控制风险，而不能一边控制各种资源要素、分配和输送利益、一边以各种行政手段来干预市场，满足权力的冲动。


    合理的职能是：政府在经济领域的有所作为，是对提供公共产品职能的进一步延伸，即为经济发展创造良好的制度环境、法律环境，激发人们的创造力，保证公平竞争，同时监管好经济秩序，控制住经济风险。它发挥的，应该是制度和法律的规范手段，保持公共权力的中立性和非利益化。


    拥有强大的资源控制能力，政府确实可以做很多事情，但如果不该做的，只能给社会带来麻烦，也带来对自己的认同风险。厘清混乱的角色，回归到自己的本位比什么都重要，也是接下来要进行的一系列政府改革的基本原则。


    ## **20. 我们呼唤政治家，也呼唤良善**


    无论是解决社会变狠，还是政府改革的问题，我们都需要呼唤一种人的出现：政治家。


    眼下紧迫的现实问题是：要超越于坚固的既得利益结构，改革者已不可能仅仅从具有保守性、自利性的官僚机构那儿得到支持，而是要转型成为具有超越性的政治家，打通政治社会理想和群体心理之间的神秘通道。


    ## ◇ **政治家的舞台**


    从近代以来，一直到今天，几乎任何一个位于政治结构核心，或者想进入政治结构核心的人物，无论做什么，都要考虑到无以计数的一堆人的存在，哪怕并不想顾及他们的感受。


    这堆人就是“群众”。


    这也是从勒庞开始，包括托克维尔在内的敏锐的观察者的发现——几乎和现代政治尤其是民主政治一起起步，群众突然从历史的黑暗中冒了出来，昂首阔步地向前方迈进。


    而掌握群众的心理，几乎就是一种“政治巫术”。群众心理的利用，早已改变了现代世界的政治版图。几百年来，它或使革命获得成功，或使法西斯主义上台，或使各殖民地得以独立，或使各个国家和地区的政治民主化得以顺利推进。无论是把群众视为一帮“乌合之众”，根本不可能假装没有群众心理影响政治进程这回事。


    人是一种非常古老的存在，但“群众”却是一个“现代性”的发明。在古代，哪儿都有一堆人，但这堆人都归属于诸如城邦、公社、宗族之类的大大小小共同体，是一个同质性的“整体”，没有“个人”的概念。


    近代以来，随着共同体的瓦解，以及“权利”观念的宣扬，“个人”的概念被造出来了。但后果却是，他成了一个与别的人分裂的社会原子，“共同体”不再是他心理上的庇护所。于是，在“逃避自由”的心理机制下，他又和别人重新结合。大家通过利益、信仰、理想、情绪等构成一个稳定或临时的心理共同体，即“群众”。


    古代的共同体成员可以关心政治，但现代的“群众”不关心政治是不可能的。一方面，权利和利益是他们的痛点和敏感点，而这是由政治分配的；另一方面，政治系统不利用他们的心理能量，明显成不了大事，这使他们哪怕被当成台下“沉默的多数”，也不会按捺太久。


    群众心理的介入，使近代以来的政治图景，大致可以分为两个画面：


    - 一个画面是在剧烈的政治转型时期或国家里，群众心理的存在，构成了政治领袖产生的沃土。像拿破仑、列宁、林肯、毛泽东等，虽然他们政治理想不同，但都善于听懂人们内心的声音，而且一呼百应。

    - 另一个画面，则是在政治结构已相对稳定的时期或国家里，各种政治理念，已经变成人们的日常观念，并且可以通过基于“公共选择”的制度来达成——或者，政府、政党已控制住政治结构，个人的魅力相形暗淡，在这样的时期或国家，卡里斯马型领袖退场，常态下的政治家则走到舞台的中央。


    就是说，在这个画面里，没有一个政治家仅凭个人魅力就可以扭转乾坤，政治家更加需要焕发的是勇气、智慧、决断等美德。


    无论奥巴马如何做，他已经不可能是第二个林肯，美国民主制度的成熟运作，不会依赖“奥巴马”这个符号。但他碰到的问题，和很多国家的政治人物碰到的问题是一样的：要获得执政合法性，必须要民意支持；而要推进某个施政目标，遇到阻碍，也必须用民意帮一把。


    ## ◇ 玩 “精英政治”“民粹政治”都会搞砸


    今天，民众身上的“热情或激情”，包括愤怒、希望，一直在中国社会弥漫，寻找着出口，对政治、社会结构不时地冲击一下。


    面对渴望公平，渴望没有腐败，渴望吃得上安全放心的食品，渴望拥有平等权利，渴望扩大政治参与的群众心理，该怎么办？


    有两个极端是应当避免的。一个是保守、维护既得利益的“精英政治”，另一个是激进的“民粹政治”。


    在民众迫切要求变革的国家，精英政治的恶果尽人皆知，曾经的南美、东南亚一些国家的“独裁资本主义”即是如此。


    比如统治印度尼西亚长达31年的苏哈托政府。在其任内，印尼经济得以大幅增长，但同时也引发了巨大的贫富悬殊，社会矛盾尖锐。苏哈托家族及其亲信，几乎垄断了印尼最赚钱的行业。政府出台的一系列政策，一个重要的功能就是用来掠夺没有受到政府庇护的企业和民众。仅仅是


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_94_0.png)


    他的家族，从其独裁统治所得到的收益就超过150亿美元。


    结果是，1997年的一场金融危机，把印尼打回原形。无论一个国家的经济发展程度如何，只要“发展成果”被少数特权阶层独占，它一定是脆弱的，在“危机”中不堪一击。


    一些人所鼓吹的“精英政治”，对于中国来说，也只能是一服毒药。30多年的改革，逐渐坐大的“特殊利益集团”，对维护一个具有剥夺性的利益秩序可谓殚精竭虑，办法就是让“精英俱乐部”垄断对制度、政策的影响。这是以制造问题的方式，来加剧问题的爆发。


    既然对抗群众心理只是在火上浇油，那么，一味地迎合群众心理，走向“民粹政治”，又会如何？南美的一些国家，尤其是查韦斯时期的委内瑞拉，就是这样操作的。


    民粹政治，是对精英政治的一种强烈反弹，相当于从一个极端走到另一个极端，因为剥夺得越深，对公平的渴望就越蚀骨。处于政治社会转型时期而且贫富悬殊的国家，最容易发生民粹政治，善于利用群体心理的政治家，甚至可以把自己打造为一呼百应的领袖。


    饱受精英政治折磨的委内瑞拉给了查韦斯机会。在“民主”的制度外壳下，他描画了一幅“剥夺剥夺者”的图景，让“受够了”的人们激动万分。此后，在“民意”的支持下，他的“政治理想”频频得手，民粹政治也因此符合逻辑地走向威权主义的政治。


    民粹政治的多种弊端无须阐述，但有两点对于中国来说，可能是灾难性的，一是固然满足了民众当下的胃口，却给未来留下了隐患；二是民粹政治依靠的是个人魅力，而不是政治结构的稳定，因此风险极大。


    ## ○ 小心别被利益集团绑架了


    基于以上分析，可以反思一下：在中国，改革的政治家群体在和群众心理“互动”时，可以在哪些方面有所作为，又应避免些什么？


    首先，当一种有助于实现政治理想、施政目标的制度或改革措施，在其出台或推进的过程中，同时碰到“既得利益集团的阻碍”和“有强大的民意支持”这两个变量时，应果断顺民意。因为这正是召唤出政治家气魄的时候。官员财产申报制度就是这样。


    从群众心理这个变量上看，民众是腐败的受害者，具有一种“被害心理”。解决腐败问题，就是对他们“心理问题”的一种治疗。但很清楚，官方的各种反腐表态，从语言的功能上，最多只是安慰，而不是治疗；而在很多时候，这些语言和腐败的现实映衬起来，在心理上还构成一种欺骗。


    在一个连“二奶”、网民都充当了“反腐先锋”的国家，还有什么能让群众对腐败问题的解决抱有预期呢？只有这两点：或者真的在很大程度上遏制了腐败，或者群众一直期待的被视为反腐的万应灵丹的制度出台了。而这样的前提，是他们预设了一个条件，只有超越了官僚集团利益的政治家才能解决腐败问题，因为他们对官僚机构已经不信任。


    在官员财产申报制度迟迟不出台的情况下，群众心理会经历这样的演化：在“被害感”中，先是满怀期待，等着它来“治疗”自己的心理挫败，然后，一直等不来，在腐败的刺激中，变为失望，最后，为了在心理上保护自己，变为根本的不信任，政府再说什么、再做什么也不信了。到这个时候，官僚机构在群众的心理上，真正具有了绑架整个政治结构的功能。


    而从“既得利益集团”这个变量上看，他们所要做的，恰恰就是绑架整个政治结构来维护自己的利益。他们的博弈手段就是：改革的政治家群体要想实现政治理想要“靠”他们。但事实是，这是全民的事业。


    改革需要“杀开一条血路”，政治和社会理想的现实，最怕的就是被利益结构牵制，和民意期待的距离越拉越大。反过来，如果一项制度、政策的出台或修改，有和民意对着干的意思，那么，官僚的思维必然挤压政治家思维的空间，导致人们在认同上和政治结构渐行渐远。


    比如“延迟退休”的争议。官方一直想修改现行的退休制度，让中国人延迟退休。为此有各种辩护性的意见，比如和国际“接轨”，比如进入老龄化社会，比如“发挥人的作用”。但显然，所有意见，都不足以说服人们就应该这样干。相反，它极容易被这些事实驳倒：延迟退休的受益者是公务员，而相对于企业员工等无异于一场噩梦；养老金亏空的责任在政府，不能转嫁给在利益上本来就受损的人。


    为了推进这个制度的修改，官方一直在试探群众心理的反应，想先在舆论上做好铺垫。但引起的反弹当然是巨大的。在这种情况下，如果具备政治家的眼光，绝对不是再和群众玩一场对抗性的心理游戏，而是先暂时搁置，因为只有解决好诸如废除养老双轨制、履行国家责任这一系列问题，延迟退休才算是满足了这项制度推行的前提。


    在改革的政治家群体和群众心理互动时，还有一个问题很重要。这就是能否吊民众的胃口。任何一个政治家的身上，都寄托着民众的政治社会理想，他要说出来让大家知道、支持，凝聚社会共识，因此显然是要吊民众胃口的，因为就算不吊群众的胃口，群众也会有这个胃口。


    所以问题根本不在于是否吊群众胃口，而在于政治家不能只是说说而已，也不能空无所指，否则，不会有人太当回事。政治认同，最终还是建立在做了什么的基础上。另外，要考虑到群众的心理。世俗的政治目标和信仰的东西不一样，在现代社会，群众的胃口被吊起来之后，有一个心理倾向，就是要求立即满足，至少等待的时间不能过长，过长就不信了。


    ## 第5章


    变狼是如何炼成的？


    ### 21. 一个人走不出过去，就一定和现在过不去，甚至和别人过不去


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_98_0.png)


    这是一个让人不寒而栗的故事，源于一个疯狂男人的报复行为，没有人知道他的真实身份，他也从未因为自己的暴行而受到过法律的制裁。他难以捉摸，善于制造谜题，他曾让整个美国都陷入恐慌之中。


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_98_1.png)


    一个人变狼的极端，恐怕就是成为冷血的杀手。


    很久了，当我看到中国社会中那些杀人者大多“性格孤僻”的时候，我就会想起一个人：周克华。


    我比较得意的事情有几件，一件是在 2012 年的云南巧家县爆炸案中，针对当地官方提供的“证据”，以及公安局长拿前程担保，通过心理分析断定，嫌疑人赵登用绝对不是官方所说的那样是“报复社会”，后来事实证明，心理分析不是吃素的，对语言的心理分析可以起到意想不到的作用。


    另外一件，就是在南京“爆头哥”（即周克华，当时还没有证据证明是周克华）事件中，我对华人神探李昌钰的挑战，他怀疑“爆头哥”有同伙，我则仅仅从警方披露的有限信息断定他绝对没有同伙。


    2012 年 1 月，南京警方最早披露的周克华的特征如下：


    - A. 不喜欢与人交流，购买早点时用手指指点，直接给钱，不说话，常戴帽子，尤喜欢鸭舌帽、墨镜与手套。

    - B. 喜欢上。

    - C. 性格孤僻，沉默少语，独来独往。


    好，从以上有限信息中，我们可以看出什么？


    马上就可以做出判断，他属于我在《世界如此险恶，你要内心强大》一书里讲的自卑型性格，属于自卑型中的“冷血杀手”类型。


    - 1. 他获得心理生存的方式是向外攻击，无道德焦虑，故不可能自首。心理极为强大，故不可能投降；

    - 2. 他可能曾受到贫穷刺激或他人羞辱，自认为不该混得惨，或自认为有能力，因此绝不像很多自卑型的老实人那样认命，而是要通过伤害有钱人或抢钱来报复；

    - 3. 他的心理模式是：把自己隐藏在黑暗之中，窥视这个世界，让这个世界看不见自己，然后突然给予致命一击；

    - 4. 他不对世界开口说话，但在心里面，一直对世界说话；

    - 5. 他极为自负，并且不会信任任何能够给他带来威胁的人，尤其是男人。


    2012 年 3 月，华人神探李昌钰到南京，谈到“爆头哥”时，说他可能有同伙掩护逃跑。但他错了。


    因为：


    从“爆头哥”心理和性格上分析，这绝无可能！


    他的心理和性格决定了他一定是单打独斗，独来独往，不可能有同案犯，因为有同案犯就意味着对他能力的贬低，有同案犯就意味着有人知道他，可能把他暴露，如此一来他在心理上就陷入了灾难。


    后来的事实证明，周克华没有同伙。他唯一信任的人，不过是一个女人张贵英，但她只是他心理和情感寄托的一个对象，再在内心里对世界说狠话的人，也不可能完全孤独，而是要通过某一个让他感到安全的人和这个世界建立心理的联系。


    再看下周克华从小表现出来的心理特征，我们就会知道他为什么成为“爆头哥”。


    - 1. 父亲曾是城里人。从小极少与人交流，向世界封闭自我、保护自我的心理模式，对贫穷不甘“认命”。

    - 2. 爱看武侠和侦探小说：通过幻想自己有力量窥探这个世界来获得心理优势。

    - 3. 体育锻炼，甚至“练武”：不仅在心理上幻想自己有力量，也让自己在身体上有力量感，以对世界造成震慑。


    这种心理发展的极端，就是玩枪。他在心理上，把自己变成一把枪。


    以上几点，已经注定了自卑又自负，但又无法通过“奋斗”改变命运的周克华，一定会对这个世界出击。


    一个人走不出过去，就一定和现在过不去。而周克华，同时还和别人过不去。


