    ## 9. 出卖自己越彻底，对别人就会越狠


    一说到有点权力的人的狠，我们马上想到的就是城管打人、计划生育工作队牵牛拆屋的画面，这是行为上的狠。至于心态上，不用我说，你去买张火车票，去政府部门办事就知道。


