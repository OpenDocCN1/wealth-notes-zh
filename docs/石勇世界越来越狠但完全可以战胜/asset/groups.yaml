    世界越来越狠，但完全可以战胜


    程序，这个表演程序至少会持续一段时间，从我们第一时间发现起，到警察破门而入终结他自杀的表演程序，时间是足够的。我们要做的，是一边安慰、规劝一边第一时间确定他的地址并报警。同时，绝对禁止任何不友好和刺激性的话。


