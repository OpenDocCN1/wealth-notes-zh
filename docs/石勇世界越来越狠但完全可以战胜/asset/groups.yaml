    # ◇ 一个狠人，总喜欢在认知上“出老千”


    衡量一个社会变态到什么程度，有两个指标：它的老年人无赖、乖戾到什么地步，人们是非不分、认知混乱到什么地步。


    翻一下变狠的老年人干的好事，让人震惊。讹诈“彭宇”的有他们，抢盐有他们，嫖娼有他们，猥亵、强奸幼女有他们，公交车上对累得快趴下的年轻人横加指责甚至暴打的，也有他们。


    我看到了一种恨，一种对年轻人、对这个社会的恨。心理失衡的他们要报复，以便补偿自己。而社会认知的混乱，让他们在报复时显得理直气壮。


    先澄清一下“让座”的问题。一个恶人，同时也是一个认知混乱的人。而社会的认知混乱，只会鼓励作恶。


    不让座不对吗？是道德问题吗？这要看情境。


    乘客购买了车票上车，和公交公司达成了一项契约，按照“先到先得”的原则，如果有空位，乘客有权利坐下去。这一权利是有道德分量的。无论是放弃，还是取消这一权利，都意味着乘客要做出牺牲。


    但你要一个人做出牺牲，只可能是基于这个理由，即你要别人让座的要求的道德分量压倒别人权利的道德分量，从而别人有让座的道德义务。因为放弃权利并不是义务，而是一种美德。


    当女孩在车上坐下的时候，她“可以”让座，“可以”主动放弃这一权利，而不是就被动地“应该”“必须”让座。“应该”“必须”在道德哲学上是'
