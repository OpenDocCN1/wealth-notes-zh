    ## 26. 冷血杀手们仍在“潜伏”


    > 总结一下，狼角色们因为内心已经被破坏，社会的不定时炸弹——冷血杀手们仍在“潜伏”


    ### ◇ 存在的败笔：有人偏偏把自己弄成这样


    一部人类史就是一部暴力史和破坏史：无法统计的杀人放火、盗窃抢劫、结怨复仇、绑架谋杀；惨烈异常的世界大战，此伏彼起的局部战争，遍布全球的恐怖活动，令人发指的种族屠杀，没完没了的宗教冲突……人类似乎不从事破坏便无法享受快感。


    正如心理问题不仅仅是心理学问题，同时还和政治、社会、哲学、文化、道德等密切相关一样，社会中的暴力也不仅仅是心理问题，也是政治、经济、社会问题。


    但是，从心理学特别是精神分析角度来讨论暴力具有特别重要的意义。一个人如果出现心理异常，往往会通过向内攻击（谴责自己，神经症）和向外攻击（向别人施虐，心理变态）来求得解决。严重的话，它还会导致心理杀人——杀人或者自杀。


    换言之，心理问题会演变成狠角色的“炸弹”。


    这些“炸弹”在未爆炸前一直潜伏，难以察觉和判断。但它随时可能爆炸，只要有所刺激，或者是自行引爆，或者是扔向人群。


    人变狠，他的破坏性是生命受挫的结果。弗洛姆对这一点作了精辟的论述：


    > 生命有其自己的内在动力；生命有生长及表现自己的倾向。如果这种倾向受到阻碍，以发展生命为目的的动力，便会走上分解的过程，并且转变为以破坏为目的的精力。换句话说，求生的冲动与要破坏的冲动，并不是相互依赖的因素，而是一种相互交替的关系。求生的冲动受阻越大，想要破坏的冲动就越强烈；生命实现得越多，则破坏行为的力量越小……压抑生命的种种个人和社会环境，产生了想要破坏的欲望。


    一个人来到这个世界上，有一种自由、独立以及发挥他的生命潜力的天性。如果一个人在理性、情感等方面遭受破坏，不能自由地生长，就会出现生命挫折，可能会扭曲心理发展的方向。正如我在前面讨论自我的问题时说过的，如果自我被出卖（不管是主动还是被动），人就有一种自我憎恨，他不能允许自己意识到这一点，他会憎恨世界：自己被破坏了，就要别人也跟着自己一起被破坏，正如有的人倒霉了，恨别人不能和他同样倒霉一样。


    这些人是非常典型的“存在的败笔”。一个人本来不应该这样存在，但他们却把自己弄成这样。


    ### ◇ 在所有的动物中，只有人类是屠夫


    可以用两种人来对比生命受挫和实现生命的两个极端：一种是杀人狂魔，一种是得道高僧。杀人狂魔或许本来就是人渣，或许原来也是无辜的受害者，他们或主动地破坏了自己作为一个人的健全精神，或者被动地被他人和社会摧残，但结果是一样的——生命受阻导致了他们对世界进行疯狂的攻击行为，只有毁灭才能让他们找到一点自我的力量感。而与此完全相反的是，高僧在心理上摆脱了各种虚假的自我的侵袭，看清了人生和世界的真相，实现了自己的生命。他们与世界和谐地融为一体，不会存在对世界的攻击性——连一点恶念都不存在。


    正如法律上有“正当防卫”的杀人，也有“故意杀人”一样，人的攻击性也有两种。弗洛姆区分了这一点。他把防卫性的攻击叫作“良性攻击”，而把基于心理扭曲、人格障碍、心理变态的攻击称为“恶性攻击”。


    需要澄清的是，防卫性的攻击也是生命受阻的结果，但它只是指向对他进行攻击的外界对象，没有出现心理扭曲甚至心理变态；恶性攻击则是在生命受阻后，出现了心理扭曲和心理变态，它表现为一系列的行为甚至杀人，指向的是外部世界，并不一定指向导致他生命受阻的具体对象。


    自杀，则是指向一个人的内部。它是另一个问题，虽与生命受阻有关，但更多的只是一个人无法承受这种生命的受阻和生存的压力，寻求自我解脱。这些年我们所看到的政客、企业家、大学生、研究生、下岗工人、受虐妇女、血汗农民工等社会各领城从业者的自杀，都是这样的情况。


    在弗洛姆看来，“良性攻击”是人与动物所共有的防卫性攻击，是用来维系生命与种族生存的。它是一种“生存适应”性的攻击，是一种人或动物在生存利益受到威胁时的攻击，它内在于生理—心理结构，由种族发生史演化出来。这种攻击是个体和种族的生存所必需的，一旦威胁不复存在，它也跟着消失。比如公园中的猴子受到人的调戏时会对人施行攻击，一个人在受到威胁时亦会进行反抗。


    “恶性攻击”则是人所持有的攻击。它不是种族发生史演化出来的，也不是生存适应性的，它无目的可言，除了满足人的凶残欲望外，别无意义。


    的确，在所有的动物中，只有人类是屠夫。


    人类社会的统治结构、权力体系、制度安排、价值观念、人际关系最容易导致一个人的生命受阻。它会制造出大量的狠角色和施虐狂，制造出形形色色的暴力。不同的社会和时代，人的攻击性不尽相同，并不在于人性的不同，而在于环境的演变。


    ## 中部


    ## 对自己狠


    ## 第 6 章 为什么对自己狠?


    ### 27. 连痛苦都无法逃避的人生不要奢谈幸福


    没有道德感的人对别人狠，而有道德感的人对自己狠。


    对自己狠的极端，就是自杀。


    自杀是一个过于沉重的话题，我不想说得太多。


    德国哲学家叔本华说：“除以受苦为生活的直接目的之外，人生就没什么目的可言。我们观察世界，见事事处处，都充满痛苦，都源于生活本身之需要，且不可分离，真可谓毫无意义可言，不合于道理。个别的不幸，固然似为不期而遇的事物，但作为通常的不幸，则事出一辙，可见是必然的。”叔本华的哲学被人视为“披上了欧洲外衣的佛教”。按佛教的说法，人生即苦。只有看穿自我的幻象、摆脱了“我执”，人才能解脱痛苦。


    我们为何遭受痛苦？弗洛伊德在他的《文明与不满》中列举了痛苦的几个来源：


    - 我们的肉体。弗洛伊德认为，我们的肉体注定要衰老和死亡。我们可以补充的是，还有疾病和不能得到满足的欲望（本能）。

    - 外部世界。包括自然灾害和社会、他人带来的伤害，可能会毫不留情地伤害我们。

    - 人际关系。弗洛伊德认为，人际关系的痛苦比肉体和外部世界带来的痛苦更厉害。我们可以说的是，它更普遍，更平常。


    那么，对这些痛苦，人又如何解决呢？弗洛伊德也列举了几种方法。


    这些方法都是我们经常看到的，也是很多人所采取的方式。


    - 一是离群索居，躲开外部世界的威胁。如世外高人，看破红尘，淡泊名利。如果做不到这一点，可以在心理上自我封闭，做个孤家寡人。

    - 二是成为人类集团的一分子。这就是与大家保持一致，融入社会，躲进国家、民族、群体的怀抱。“愤青”以及很多“正常人”都是这样。

    - 三是心灵麻醉。正如我先前强调过的，对于人来说，事实是什么并不重要，重要的是个人心理感觉如何。假如痛苦不被感觉到，它也就不存在。这样的人实在太多，比如酗酒者、吸毒者。

    - 四是扼杀本能。这是一种禁欲主义的方法，在各国历史上和现代社会都不乏存在，比如欧洲中世纪的苦行僧，现代出家修行的和尚、喇嘛等等。

    - 五是转移利比多，把本能升华。这样的例子多不胜数，比如一个人出身贫寒或经历了巨大挫折，就发愤学习，刻苦训练，拼命奋斗，终于功成名就，成为世界冠军、学术泰斗、政坛明星、军界强人、著名作家、商业传奇、演艺红人等等。

    - 六是沉迷幻想，思维脱离现实世界，精神陷入迷幻状态，就是人们所说的头脑有病、精神不正常之类。


    事实上，弗洛伊德所说的那些痛苦都是一种生活化的“形而下”的痛苦，是凡夫俗子碰到的现实刺激。还有一种精神层面的“形而上”的痛苦，这就是本书第二章中所讲的存在的双重。这种痛苦至少有两种表现：


    - 对存在本身的绝望——一个人的这种痛苦既不是因为生活压力，也不是因为人际关系，更不是外在世界的攻击，是一个人看穿了存在的虚妄，体会到了命运的荒诞，他在精神上痛苦不堪。一般来说，知识分子、思想家、文人们才能体验到这种痛苦。

    - 空虚、无聊这种痛苦同样不是来自生活压力、人际关系和外部世界。“非存在”威胁到了一个人，但他并没有由此体验到存在，因此他丧失了一个稳定的精神中心。这种痛苦是存在本身带来的，但它却“生活化”了，表现为一个人在生活中无所追求，充满焦虑，郁郁寡欢，没有兴趣做什么，只感觉到生命像沙子一样流逝。许多心理比较脆弱、抑郁的人都或多或少地有过或体验过这种痛苦。


    ### 28. 无法向别人施暴的人，就会把暴力施向自己


    所有的这些痛苦，对于人来说都是生命的挫折，都会产生破坏性。它们威胁到人的心理生存，为了维护心理生存，人必须寻求解脱。


    而对太多的人来说，这种解脱的极端方式之一就是自杀。中国的自杀状态，我在导论已经说了。


    19世纪的法国社会学家杜尔凯姆曾以社会学的视角研究过自杀。他把自杀分为利他性自杀、自我性自杀、失调性自杀和宿命性自杀。还有很多人把自杀分为精神疾病性自杀（比如抑郁症导致的自杀）和非精神疾病导致的自杀（比如生活压力、致命打击等诱发的自杀）。更有情绪性自杀和非情绪性自杀这样的区分。这些自杀都是在无意识里发生的，如果发生在意识层面就有救了。当你知道了支配你的诸种行为的心理秘密，你就跳出了那个要吞没你的心理旋涡，你可以冷静地审视它，在世界面前你就有了心理优势，没有什么能够打垮你。精神分析的原则是，把无意识换成意识，只有这样才能拯救一个人。


    而一个人也只有这样才能自救。


    我不想讨论形形色色的自杀，比如畏罪自杀之类，也不想从社会学、精神病学等学科的视角去界定不同类型的自杀，更无法一一列举所有的自杀类型。我对自杀的分类标准是心理动机，是从心理分析的角度来界定的，而且只关注我们常见的自杀者以及自杀的原因和方式。我相信这样更有利于看清自杀的真相，从而唤起人们存在的勇气，对自杀大声说“不”！也提请人关注身边不幸的自杀和想自杀的人。


    ### 29. 做父母的请注意：子女的极端行为可能就是对你的报复


    儿女谈恋爱，似乎很爱儿女的一方或双方父母对儿女的对象不满意，以爱的名义坚决反对儿女的恋爱自由。由于儿女不能忍受父母的干涉，在无法解脱的情况下，选择了自杀，有的还是双双赴死。或者，似乎很爱子女的父母对子女管束过严，希望子女百分之百按他们的意志行动，为此与子女争执不休，子女一气之下以死相抗。


    在这些例子中，子女自杀是为了报复父母。父母对孩子的爱是一种施虐狂的爱，严格地说这不是真正的爱，没有对他人独立性和自由的尊重就没有爱，他们只是把子女看成附属品，是可以按自己的意志随意塑造的对象，这阻碍了子女的自由发展，子女难以承受这种爱的重负。


    在某件事情上，当子女独立和自由的需要被父母挫败，特别是父母严重挫败了子女的自我时，子女实际上也感觉到了生命的挫折。这种痛苦是父母带来的，他们对父母会产生一种爱恨交加的感情，因此为了追求心理生存，在这个时候他们和父母就有了一种心理上的较量：父母否定自己，把自己视为不重要，就一定要让父母知道自己的重要——你们不是干涉让我痛苦吗？我就死给你们看，看你们痛苦不痛苦，让你们后悔都来不及。潜台词：我抗争不过你们，但我要让你们为自己的行为付出代价，我要用死来惩罚你们！


    由于家长对子女的期望值过高，或者给予了过多的关爱，很多子女从小生活在赞美声中，一旦得不到他们想要的东西，达不到他们的意愿或理想，也会以死来报复所有的人和世界。从心理上讲，这是因为家长给子女的一切“爱”都被子女视为理所当然的，是应该的，这种“爱”不断超越“爱”的表达所构造的基准线，永远无法得到满足。


    于是只要没有达到他们的要求，就被认为是“不爱”，他们便会报复“不爱”他们的家长和所有人。


    在诸多报复型自杀中，子女的自杀还可以解读为通过杀死自己从而在心理上杀死父母。向内攻击不仅仅是向内攻击，它还是向外攻击的一个中介或手段。


    但如果子女感觉自己既不爱父母，也感觉父母不爱他——无论父母实际上是否对他表示过爱，而且又发生了与上面描述类似的情境，结果会怎样？可以肯定地说，这时候不是子女用自杀来报复父母，而是直接杀死父母。因为子女感觉自己不爱父母，没有一个内心的声音可以阻止他杀死父母。又因为感觉父母不爱他，因此他的死根本报复不了父母。这个时候，他遵循的心理逻辑虽然仍是生命受挫后的攻击，但动机不再是在心理上杀死父母，而是在实际上杀死父母，也就是说不再是向内攻击，而是向外攻击，向带给他们不可忍受的生命挫折的对象攻击。


    比如，常常有些家长对孩子过分溺爱和有過高的期望值，让孩子产生了一种自己被家长当成一个工具的心理，感觉自己没有了独立性，像木偶一样被操纵，目的只是为了家长的面子或理想。这给他们一种被愚弄、不受尊重的感觉。在这种氛围中，家长越“爱”他们，他们越感觉到被家长伤害，越倾向于报复。我们常常看到或听说一些被父母溺爱、管束的青少年杀父母的事件，就是典型的例子。


    当然，这不再是自杀，而是杀人了。


    ### 30. 崩溃，是因为心理上活不下去


    压力型自杀也可以叫作“生存困境型自杀”，它是中国社会最普遍的一种自杀，这一点恰好与人们在这个时代普遍承受着巨大的压力相对应。这几年我们不时听到有大学生、硕士、博士、公司白领、教授、讨薪不成者、贫病交迫的下岗工人自杀……他们都属于这种自杀类型。在压力下自杀的人中既有白领、研究生，也有民工、农妇，还有学者、名流。他们的生存境遇并不一样——有人衣食无忧，有人生活无着；有人尊养处优，有人穷困潦倒。他们在社会上的价值排序也不一样——民工、农妇位于低端，白领、研究生位于中端，教授、明星位于高端。


    压力型自杀又可以分为两种：精神压力型自杀和生活压力型自杀。它们的共同之处是在压力下都走到了绝境，前一种主要是精神压力，后一种主要是生活压力。


    这样的分类只是为了说明痛苦、压力的来源是以物质生活还是精神层面为主，有时很多人身上痛苦、压力的来源是混合的。比如农妇自杀既是因为生活压力，也是因为精神上无法解脱同样的痛苦。而博士自杀，主要是因为精神压力，但这与他相对的生活困窘、找不到期望的工作等不无关系。


    我必须在此指出一点，压力型自杀的人绝大多数都是好人，善良之辈。正因为他们内在的良心相当强大，当他们遭受巨大压力，出现严重的生命挫折时，不会去攻击外界，只是攻击自己。而那些流氓恶棍、穷凶极恶的杀人狂徒等，则是道德上的白痴，他们没有内在良知的约束，有了压力只可能去杀人，而不会自杀。


    内在的良心分为如下几种：


    - 一种是存在上的良心，这就是我前面说过的，一个人对自己成为什么样的人负有义务。他来到这个世界上不是要成为一个“存在的败笔”，不是想出卖自我，而是希望发挥自己的生命潜能，真正成为一个独立、自由的人。如果他做不到这一点，这种内在的良心就要惩罚他，他就有一种自我憎恨。然而，除了哲学家、跳出红尘外的隐修者，很少有人能体验到这种内在的良心，包括所谓的文人知识分子。所以，我们会看到这样的现象：在历史上，很少有隐修者或哲学家自杀，因为这种内在的良心无法被压抑，在他们身上起作用，阻止他们对自己不负责任。自杀，无论有怎样的理由，都是对自己不负责任的做法，因此存在上的良心会阻止他这么做。

    - 另一种是道德上的良心。它是社会道德规范的内化，这种内在的良心就是弗洛伊德所说的那种“超我”。外在的宗教观念、道德观念经过内化，变成了人内心的一部分，它就驻扎在人心里面监督人、控制人。这种良心亦有可能是假的，因为宗教观念、道德观念有可能是错的或违反人性的。我们社会中的很多人都拥有程度不同的这种良心，压力型自杀的人这种良心最严厉。然而，压力型自杀的人和不自杀的大多数人一样，都难以体验到存在上的良心。他们可以不杀人，因为有道德上的良心阻拦。然而他们却不会爱惜自己的存在，因此选择了自杀。因为在他们的意识里，没有存在上的良心阻拦他们。

    - 还有一种是权威的内化的良心，从父母、老师到以后的权力者、领袖人物、崇拜的神明或偶像，都可以构成这种权威良心的来源。他们内化到人的心里以后，人做什么事都不能违反他们的意志，否则就要遭受权威良心的惩罚。可以点明，受这种良心驱使的人其实是一个在理性和心理上都不是自己的主人的受虐狂。那些在屠杀犹太人时说“我只是在服从命令”的纳粹分子，那些在“文革”中打人、斗人、抄家、武斗时叫喊“誓死捍卫×××”的红卫兵，受的就是这种良心的支配。在我们的社会里，经常说“我只是按规定办事，我也没办法”的人，没有“上头指示”就浑身不自在、不知干什么的人，也具有这种良心。压力型自杀的人有些也具有这种良心，在“执行命令”的时候，这种良心会起作用。但在偶像或权威失去之时，这种良心就消失了。


    对良心的分析可以看到，当一个人感觉生命已经变成一场无法逃

