    # 砸牌坊的人


    人类社会从古至今，牌坊无处不在。一个压榨人民的政府，可以自称为“民主政府”；一种奴役人的意识形态，大言炎炎是人的“解放”的“理论武器”；“自由”这个词被抽掉具体的所指，把贵族们的自由说成是所有人，包括受贵族们支配和掠夺的人的自由；一个人对金钱、权力等具有神经症患者般的迷恋，却把对它的追逐说成是“实现自我价值”；一个人对他人具有一种施虐倾向，却以对他人“爱护”和“关心”的样子出现；一个人分明是想利用流行的衣着打扮来引人注目，论证其价值，却硬说这是对美的追求，是一种似乎很高雅的时尚……


    有牌坊存在，当然就有砸牌坊的人。从逻辑上梳理，从心理上分析，是砸牌坊的两种主要方式。


    一般来说，倾向批判的知识分子喜欢砸牌坊，而标榜科学的实证研究的学者似乎兴趣不大。很有趣的是，在经济学家中，托斯丹·本德·凡勃伦是个难得一见的砸牌坊的人。或许是有所忌惮，他在抡起大锤朝“有闲阶级”的奢侈消费砸过去的时候，不忘了说一句：我不是在砸牌坊，我只是在陈述事实。的确，他是在陈述事实。其实砸牌坊的人，不过是把会让一些人受不了的真相揭示出来而已。


    人类社会有很多东西表面上看起来是正常的。人要生活，就要消费，'
  - '[PAGE 202]


    有了钱就要想尽办法消费好的物品，追求“更高一层享受”，这看起来并没有什么不正常，正有人总想抢夺权力、金钱，往上爬一样。然而，这种“正常”至少也要在人们的消费不超过他们的消费能力的前提下才能得到证明，也即消费的确只是为了满足人们的“正常需要”本身。而如果一个穷人哪怕少吃饭也要穿得好一些，这就很有探究的必要了，证明消费已远离“正常需要”，人们所消费的实际已不是商品的使用价值，而是它的社会价值，也就是说，它已脱离经济学范畴而进入社会心理学领域。


    这种行为可以看出受占支配地位的某种社会心理所影响，这背后一定隐藏着什么深刻的心理动机。在凡勃伦的那个时代，他观察到：在社会上没有个阶级——甚至极度贫困的也不例外——对惯常的明显消费完全断念。这些人除非处于直接需要的压迫之下，否则对于消费的这一范畴的最后一点一滴是不会放弃的。人们宁可忍受很大的痛苦与不安，而不肯在非同不得已的情况下放弃金钱礼仪上最后剩下的一些小零小碎或最后的门面装点。连最贫困的阶级都是如此，富人阶级当然就不用说了，他们的奢侈消费让人瞠目结舌。比如，一支钢笔可能是用金子做的，但它和普通钢笔虽然价格如此悬殊，在功能上并没有多大差别。


    到底是什么让人们追求一种炫耀性消费？还有，是什么原因让人们认为一个细腰、皮肤白皙的女人是美的？是什么让人认为一个有钱的人是档次很高的？是什么让神的身边总要有些随从，并且这些随从穿的衣服都很光鲜？是什么让猫、狗成为人类的宠物，而猪、鸡则不可能有这种荣幸？是什么让大学要给拥有某种学位的人以某种标志，比如博士服？用我们的话来问：是什么让上流社会的人热衷搞什么沙龙、舞会？是什么让一些根本与生产劳动无关的东西比如插花、调酒'
  - '[PAGE 203]


    成了所谓的“艺术”？


    这一系列现象背后的秘密都不难破译。理解这些现象的一个关键性概念是“歧视性对比”。凡勃伦认为，所谓的“歧视性”是用来形容人与人之间的对比，而这种对比的目的在于按照人们在审美上或道德观念上的相对价值来分等分级，从而确定他们自己所设想的或别人所设想的相对的他们在心理上的自得程度。歧视性对比是对人们的价值的一种评价方式。在这里凡勃伦就羞用“心理竞争”这个概念来表达人们在一个给价值排序的社会中对价值的争夺了。但这种歧视性对比是从哪里来的，凭什么认为一个皮肤白皙的女人价值要高一些，皮肤黑红的女人价值要差一些？又凭什么认为一个有钱有势的人的价值就要高一些，而人们居然梦想成为这样的人？


    凡勃伦认为，这是未开化时代的遗风。人们看到，凡是与直接的生产劳动有沾染的东西，总会引起人们的厌恶感，这既是它不能满足审美上的雅观，同时也因为它是低贱的标志，而在以后的发展中，这两个因素已经合二为一了。


    而非生产性的一切，则因首先对应于未开化时代的“荣誉性”业务，因而总是与“有价值”有关。换言之，在凡勃伦看来，生产业务和非生产业务之间的现代区别方式不过是未开化时代侵占与劳役的区别的变形。


    在未开化时代，“列入侵占一类的业务是可敬的，光荣的，高贵的；而其他不含侵占成分的业务，尤其是含有奴性或屈服意味的那些业务，是不值得尊敬的，低贱的，不体面的”。


    自然，政治、战争、宗教这样的业务总是能给从事者带来价值的论证，而直接从事生产劳动的则毫无价值可言。因此不难理解，从事劳动'
  - '[PAGE 204]


    的妇女和奴隶总是受到歧视。一个自认为有档次的人对妇女和奴隶从事的行为自然深恶痛绝。通过侵占，不从大自然里索取而是从他人那里掠夺，被当成英雄行为认为是美的，这种美学是一种典型的“暴力美学”。而人们因这种行为的掠夺成果赋予其价值，则是对暴力的颂扬。必须承认，对力量的崇拜和对生产劳动的厌恶，是人类的很多价值观和审美观的深层逻辑。一个有钱的人之所以让人羡慕，是因为钱是一种力量的象征，它具备一种支配性；同时，有钱的人必然远离那种劳苦而低贱的生产劳动，他们能够满足人们的美学期待。


    至此已很明显了：拥有金钱等社会稀缺价值资源的人，因其所拥有的东西的支配性而给其带来了某种优势地位，给他进行了价值论证。用凡勃伦的话说，就是金钱在起初只是被看作一种能力的证明，现在则内在地具有了荣誉性。


    这就给人们的心理竞争确定了一个方向，尽力去抢那些被社会奉为价值的东西：凡是与别人作对比时可以占有优势的成就，就是努力的正当目的。如果不能做到这一点，很显然他就会处于心理上的劣势，威胁到他心理上的生存。


    基于此，人们必须对自己的行为赋予道德论证，使其具备足够的合法性，而这反过来又对生产劳动构成了价值上的蔑视和美学上的厌恶感：凡是与生产劳动有所沾染的一切，在价值上总是要比不与生产劳动沾染的低。这种对生产劳动的厌恶渗透于整个社会的价值观念中。一个皮肤白皙的妇女之所以看起来是美的，高贵的，就是因为她身上没有从事直接的生产劳动的痕迹。一只猫、一只狗之所以成为一些人的宠物，也是因为它们不像鸡那样有生产上的实用性。有了对暴力美学的渴望，游戏就可以变换规则玩。






    ![](img/f0502657e0e411adb97ccb25c15a5fc1_204_0.png)'
  - '[PAGE 205]


    随着社会的发展，起初的侵占这种已得不到道德支持的野蛮现象消失了，但它所折射出来的那种力量却通过一个似乎公平的游戏规则（比如对财富的追逐已不用暴力掠夺的方式，而是用做生意的方式）时时在召唤着人们。人们抢夺的也不再仅仅局限于金钱权力等东西，而是任何一种可以证明他们有价值的社会物品与社会资源。


    一个人的存在价值总是必须通过外界的反应，或者说通过这个人对外界反应的判断来证明。因此，一个有钱的人，必须让社会上的人看到这一点，这就必须通过炫耀性消费，以及他的“有闲”来展示。这种展示既可以通过自己，也可以通过与自己有附属关系的人，而在凡勃伦看来，后者更有意义。


    一个人炫耀有钱和有闲还不够，要是他的老婆和奴才也能炫耀的话，那就证明他比只能通过自己来展示的人更有钱有势。凡勃伦由此提出了“代理消费”“代理有闲”这两个概念，在他看来，奴才们、没有独立性的妇女们的华丽衣着并不仅仅是为自己而穿，而是为主子而穿，他们只是“代理者”。不难想象，在一个具有等级结构特征的社会中，有力量的上层阶级的价值观念总会辐射到全社会范围内，在软弱无力的贫困阶层身上获得共鸣。有钱和有闲的上层社会的“派头”，会引起下层社会的艳羡，并竞相模仿。因此，炫耀性消费并不仅仅是富人阶层的事，贫困阶层也乐于参与，只不过在消费的程度和标准上有所不同。


    一般来说，像凡勃伦所说的，人们总会与比自己高一层的人相比较。这当然主要不是他们能理性地认识到自己没有能力和最高层的人相比，而是基于这个心理上的原因：比自己高一层的人与自己具有更多的存在属性，即比较的东西，同时又给比较定出了意义，因此如果能超越于他之上的话，就能实实在在证明自己的价值。在全民参与的心理竞争中，'
  - '[PAGE 206]


    消费成为一种主义，一种意识形态，它界定着人们的价值。心理竞争与商品的更新换代相互激化。


    当代社会的炫耀性消费程度，以及“消费者”的“异化”远超出台勃伦的那个时代。心理竞争之惨烈也远远超出了他的想象。由于很多“先天”地标明人的价值和档次的东西，比如血统、门弟都已被打破或不再重要，消费品已等同于存在价值的展示，对它们的消费也陷入疯狂。“时尚”“流行”像魔术一样控制着人们，因为成为“时尚”“流行”的阐述者就意味着自己“存在”的凸显，相反如果不能跟上“时尚”和“流行”的话，则意味着一个人根本就不存在——这就别谈存在的价值了。


    一个人要是穿衣打扮土一点，就意味着他对自己心理劣势的承认，连他对自己都没自信——因为他实在只能通过这一点来证明自己的价值。不能怪人们“狗眼看人低”，因为现代社会就是这么来看待人的。


    而随着社会的急剧变动，它对确定性的消解，心理竞争也进入了一个旋涡之中，一个人必须赶快抓住可抓住之物，并且必须不停地变换可抓住之物才能避免自己存在的虚无化——当你还在用这种物品来满足自己的心理优势的时候，别人已经在用另一种更新也更“高档”的物品来证明他比你有价值了。


    # 变狠的温床


