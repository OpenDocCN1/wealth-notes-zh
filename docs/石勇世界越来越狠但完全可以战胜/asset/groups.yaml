    质恰恰是价值比较。


    很明显，在心理竞争中，既然物只是人用以证明自己的价值的手段，那么只要能让这个人陷入被羞辱、被支配的境地，那么他拥有再多的价值物也毫无意义，在羞辱者的心理感受中，似乎已证明不了这个人的价值。


    因此，在心理竞争中，很多没有能力用物来和他人比较的人，非常容易变成一个施虐狂。在某种情况下经常会对他人的贬损和攻击来否认别人的物品的价值属性及所折射出来的别人的心理优势，以维护自己的心理生存。而那些拥有稀缺资源或仅仅是拥有一般的价值物的人，因其物品不纳入比较结构就毫无意义，他们需要在炫耀他们的东西的同时攻击和贬损他人，如此才能获得牢固的对自已的物品和自已的价值的确定义论证。


    在一个等级社会里，握有一定的权力或仅仅是某种支配力的人，为确保自已的权力或支配力（且不说背后的利益），以及只能透过权力或支配力而体现的自已的存在，就要让它们能够尽情地发挥，越越具施虐特征，越能证明它们以及拥有权力或支配力的人的存在。而在一个社会中，由于价值资源的稀缺性，以及具有社会价值属性的物品在特定时期的不能普及，在同一个比较层面，能够在心理竞争这个游戏中胜出的只是少数人。


    大多数人为了心理生存，就具有施虐和（或）受虐倾向。一方面，他们不能和一些人比，却可以和更弱的人比；只能被一些他们不敢惹的人施虐，但他们可以向比他们更弱小的人施虐来寻求补偿。而另一方面，同样是为了心理生存，对于向他们施虐、具有某种价值的人，他们努力合法化这种施虐，努力将自己纳入施虐者的存在中，力图通过自己的受'
  - '[PAGE 213]


    虐而消除被侮辱和损害之感，并分沾施虐者的价值属性。心理竞争不是一个好玩的游戏，而是充满了破坏性。它既释放出人类的某些能力，也展现出人类足够阴暗的心理。


    # 4. 富人和穷人的“共同语言”


    人是社会心理的奴隶。在一个社会中，由于无论如何都要维护自己的心理生存，穷人和富人不仅像凡勃伦所讲的那样在“明显消费”上有共同语言，从而都认同于富人的价值观，而且有着共同的性格结构。这就是弗洛姆所说的“社会性格”。


    “社会性格”的含义是对弗洛伊德性格理论的扩展。它最初见之于弗洛姆在 20 世纪 30 年代初一篇叫《心理分析性格学在社会学中的运用》的论文，后来，他又对此进行了新的阐述。按弗洛姆的意思，社会性格这个概念意指一个社会中大多数人所具有的性格结构的核心，它的功能是在一个确定的社会中塑造和引导人们的能量，使这个社会能够继续正常运转。


    在弗洛姆的分析中，社会性格与“社会经济结构”有极大的关系。但他马上指出，这是一种相互作用的关系。而不仅仅是社会经济结构影响到人的思维模式、性格结构，社会的价值观念也参与了这种影响。反过来，一个社会的社会性格又对社会经济结构和价值观念等产生作用。情况往往是这样：某个社会的经济结构总是需要某种社会性格与其对应，而后主流价值观念对被呼唤出来的社会性格加以合法性论证；已形成的社会性格又参与对社会经济结构的塑造和对主流价值观念的维'
  - '[PAGE 214]


    护。当一个社会的经济结构改变时，滞后的社会性格将对它产生破坏作用。即使与社会经济结构配套的主流价值观念已经改变，社会性格也会“编码”它。


    就此而言，在苏联和中国所发生的事情并不会让弗洛姆感到吃惊：“许多政治家认为，首先必须彻底改变社会经济结构，第二步几乎自然而然会发生人的心理的转变。换言之，一个新的社会只要一经实现，似乎就会自动产生出新人。他们忽视了，和旧贵族具有同样行为动机的新生贵族阶层也一心想在革命所创造的新的社会政治机构中恢复旧社会的种种条件，而革命的胜利恰恰意味着这些人的失败。”


    我们观察到，苏联和中国的社会经济结构和旧社会相比已面目全非，主流价值观念（由意识形态所编码的公开的那种主流价值观念）也是全新的另一套，但即使是在最“革命”的那个年代，我们还是会发现，官僚干部等上层贵族对工人农民（他们给予无限赞美的人，并认为其统治的合法性是出之于这些人）这些下层人还是掩饰不住骨子里的蔑视。最常见的是现象，当一个官僚干部的女儿破天荒地爱上了某个工人或农民时，他们总是尽力阻挠，并泄露天机地说上这么一句：“你是干部的女儿，怎么能去嫁给一个工人（农民）？”上层贵族骨子里的价值观念，与旧贵族毫无二致。整个社会的社会性格也与旧社会如出一辙。而如果我们破除社会经济结构和由意识形态所编码的主流价值观念的迷雾，就会发现一部分人利用权力及各种稀缺资源支配大多数人的统治结构并没有什么大的变化（且不说它与旧的统治在某些方面的比较），整个社会还是推崇一种等级秩序，以及与这种等级秩序对应的价值上的排序——一个工人、农民不管在意识形态中其价值被吹捧到何等的高度，但在实际的社会中，其价值排序是很偏低的。这样的“革命”实际上是失败的，它最明显的'
  - '[PAGE 215]


    功能不过是换了一批统治者而已。


    如果我们从心理竞争的角度考察，对这一点就看得更为清楚。“革命”无疑提出了一种似乎可以让人很激动的未来的社会图景——这个图景似乎还可以终结心理竞争（“按需分配”）。但是，第一，“革命”只是找到了理论上的逻辑基点，但没有一场“革命”发生在与“旧社会”断裂的心理一性格结构中。所谓“最新最美的图画”再如何描绘，它也不可能消除人的社会差别和资源的稀缺性——它毕竟要有一个以权力支配为特征的组织机构，而这恰恰是描绘未来社会图景的前提。


    因此，即使我们假定，革命在一开始是由一群在心理上超凡入圣的人所发起的，但只要它一运行，即自动生成了一种价值排序的逻辑。此后随着参与的人越来越多，它的机构化作越具有管理、统治机构的特性，其价值排序的逻辑渗透的领域也就越多：如果“革命”可以为它的领导者，或仅仅是参与“革命”的人带来一些在社会价值排序上较高的地位、特权，它有什么理由不沦为旧的统治机构的另一种变相存在形式呢？


    第二，无论参与还是不参与“革命”的人，也无论是在“旧社会”还是在“新社会”，人不仅要对抗人类几千年来形成的关于价值排序的观念体系，而且还要对抗由人的社会差别所激化的存在结构，这个存在结构决定了人必须谋求他心理上的优势——这显然是不可能的。


    因此，无论“革命”前、“革命”中还是“革命”后，人们无法逃避心理竞争，从而也没有任何一种力量能够阻止人们尽力去追求稀缺资源，去追求可以让自己在社会上的价值排序能够得到提升的东西，甚至仅仅去表现自己可以表现的东西，以寻求心理上的优势。换言之，“革命”只可能铲除与心理竞争关系不大的一些东西，这些东西可以包括政治结构、经济结构，甚至社会制度，而根本不能铲除与心理竞争对应的那些东西，'
  - '[PAGE 216]


    比如一个决定了价值排序的等级秩序。


    倒不如说，至今没有一场“革命”做到这一点：改变的不仅仅是“谁来玩？怎样玩？”，而是“有没有人玩别人这种现象？”。人类几千年来，经历无数改朝换代，至今仍然无法避免一个等级秩序对人的存在进行价值上的排序，一个重要的原因就在于上层社会和下层社会看起来在很多方面对立，但在尽力让自己的价值排序得到提升这一点是很一致的。


    换言之，上层社会和下层社会具有精神上的同构性，他们在对等级秩序的维护上具有“共同语言”经常看到的情况是：一个雇员可能会去恨一个老板，但是，他实际上恨的并不是老板，而是自己没有机会当老板；除非他已彻底绝望，否则他不会真的去恨那个让人有老板和雇员之别的制度。而如果有人要打烂这个制度的话，他有可能比老板更英勇地跳出来维护这个制度，因为尽管他现在被人剥削，但只要制度不改变，他还有机会去剥削别人。如果他彻底绝望，渴望打烂这个制度，他也只是希望打烂这个特定的由一部分人剥削另一部分人的制度，而不是人可以剥削别人的制度，否则，他就彻底没有机会体验一下剥削别人的滋味，以补偿自己被人剥削的耻辱了。


    当然，也不能排除受虐的心理冲动对此的反应：雇员在受虐于老板时，为了维护自己的心理生存，必须把老板对他的施虐合理化，进而也让把老板得以施虐的那个制度合理化，而如果否定这个制度，则无异于是对他的一种否定，这在他心理上是无法接受的．在这个过程中，老板对这个制度的维护自不必说，为了能成功地利用这个制度施虐，他既会论证这个制度的合理性，将雇员受虐的命运只归结于他没本事，而且会确立他对雇员施虐行为本身的合理性。在心理竞争中上层社会和下层社会走到了一起：前者想尽办法维护这个给他们以炫耀'
  - '[PAGE 217]


    自己的存在价值和施虐的现实，而后者则不会放弃可以用来补偿现实耻辱的未来的希望。


    很多理想主义者常常只看到上层社会和下层社会现实中的对立，而看不到他们在精神上的同构性；只看到他们的相互仇视，而看不到他们在心理竞争中对权力、财富、支配别人等共有的渴望，看不到他们其实都是一个等级秩序的“同路人”。在这个世界上，能够让上层社会和下层社会走到一起的东西很多，比如“爱国主义”，但即使没有这些东西，只要有心理竞争，他们也会走到一起。


    可以看到，在上层社会和下层社会对稀缺资源、对心理优势的热衷中，心理竞争已遭到编码，克服凌乱的无序状态而模式化、机制化，并对应于社会的结构和等级秩序。心理竞争并没有“社会历史性”，但在特定社会中，它的表现方式，也即游戏内容为何，怎样才算是不违反游戏规则，都有一些或隐或显的标准。


    在弗洛姆看来，有一个真相是：一个社会必须培养一种能够与它对应的思维模式和社会性格，人们必须“想他所应该想，做他所应该做”。同理，心理竞争也必须符合一个社会的期待，即不能冲撞这个社会的等级秩序，而只能强化它的逻辑。


    在这种意义上，能够让心理竞争更活跃的需要、欲望和愿望都必须予以合法化。一个将权力、财富奉为价值的社会最害怕的不是下等人在一个被大家所认可的游戏规则中也参与对权力、财富的争夺，而恰恰是大多数人破坏这个游戏规则，或者对权力、财富毫无兴趣。如果说破坏了游戏规则，大不了惩罚破坏者而已，但大多数人如果对权力、财富不感兴趣，这个游戏就可能玩不下去了。


    反过来说，如果大多数人对权力、财富都有兴趣，那么，不管他们'
  - '[PAGE 218]


    身份为何，处境为何，他们都是心理竞争这个游戏的参与者，都是等级秩序的维护者。


    # 游戏能玩下去吗？


    在弗洛姆看来，“占有”和“存在”的生存方式的区别从有私有制开始。卢梭也在其《论人类不平等的起源和基础》中放大这样的论调：“谁第一个把一块土地圈起来并想到说，‘这是我的’，而且找到一些头脑十分简单的人居然相信了他的话，谁是文明社会的真正奠基者。”


    在他们看来，处于“自然状态”的人与世界是和谐的。在某些方面这的确不假，不过心理竞争这个游戏的开局并非从私有制产生开始，而恰恰是从人有“自我意识”与“对象意识”的分野开始。在上面已说过，人存在的“主体—客体二元结构”使人形成了一种借他和外界区分、对比来证明或凸显自己的存在的“存在性冲动”。


    由于人与人之间相比具有更多的属性，这种区分和对比当然发生在人与人之间才有意义。因此，即使是在毫无“所有权”观念的原始社会，心理竞争的游戏也开始玩了，只是还处于朦胧的状态。虽然穿得极端简陋，但原始人也不会忘记用花花草草把自己打扮得更炫目一些，以此吸引异性或在同性面前炫耀——这一点和当今穿衣打扮的“时尚”并没有本质区别。


    从逻辑上讲，一个越与世界和谐的人，一个对其“自我”越有体验、越不与世界冲突的人，比一个“自我意识”和“对象意识”分裂得很彻底、其“自我”更多是“社会自我”的人，对心理竞争更没有兴趣。


    因此，历史的发展只能让人得出这样的一个结论：随着从古到今人类的“自我”越来越变成“社会自我”，人类的历史构成了一个心理竞争'
