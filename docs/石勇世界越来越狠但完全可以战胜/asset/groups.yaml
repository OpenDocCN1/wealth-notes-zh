    地说，一旦他们与自己独处，在心理上是很难生存的。


    很多年前，我曾经在贵州中部一个高山河谷的半山腰里待过一段时间。


    刚开始去的时候，我以为我开始了净化心灵的朝圣之旅。但没过多久，我就感觉到了一种不适。我以为是习惯了社会，还无法适应这种生活，心理模式还没有改变。但慢慢地，这种不适感越来越强烈，我才知道，这是一种焦虑。


    我开始思考很多问题。


    第一个想到的，是现代人可能在心理上永远无法返回古代了。古人的心是安宁的，他们静默着，可以真切地感受到自然的美，听到花开草长的声音。但现代人的心眼里、耳朵里充斥着金钱、物欲、人与人之间争吵的噪音，在很大程度上已经丧失了领悟自然之美妙、感悟天籁之声的能力。他们的心理模式，已经和现代社会的结构、精神、游戏规则同构。因此，即使一个人跳离了社会，他的心还在社会。


    第二个想到的问题，是古代和现代在社会结构上的不同决定了不同的心灵状态。在古代，由于交通的不便，人口不多，通信落后，人们之间的联系并不那么紧密，甚至相对隔绝，特别是在农村——古人绝大多数都是农民，在心理上每个人都有一个独立的空间。而且，他们从出生开始，在身份上就依附于家族、村社共同体中，在心理上有一个确定的秩序可以依归。因此，他们的心灵是安宁的，一切都是自然的。


    也许，古人居住的环境差不多就是我所在的那种地方，我却不能像古人一样获得心灵的安宁。这不仅仅说明我的心理模式不同于古人的心理模式，从而根本不能体验到对于古人来说习以为常的心灵状态，而且还说明，当我远离了社会时，在长期的独处中我触摸到了存在本身。


    我的焦虑，恰恰就来自于这种对独自存在的体验。'
