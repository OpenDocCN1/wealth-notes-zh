    # 对别人狠'
  - '[PAGE 22]


    # 第 1 章


    # 身边有哪些狠角色？


    1. 还需要感谢谁的“不杀之恩”？


    同学？一个人和自己过不去，就一定和别人过不去


    同事？一不小心，在有心理问题的人面前，你就会中枪


    亲人？小心他恨你，为什么不是“×二代”


    一个人在对别人狠之前，已经先对自己下了狠手


    有一种狠角色，狠到让别人对自己狠


    狠经过包装，还可以变名变利


    变狠的世界里，得到最多和得到最少的人最狠'
  - '[PAGE 23]


    十年前，我有个“穷矮矬”同事，在他面前我完全不敢说诸如“矮”“低”“丑”之类的词语，而且一直小心防备。两年后，因乱开玩笑，另一同事死于其手。


    在复旦研究生投毒事件中，我们已经感谢过同学的不杀之恩。在一个变狼的社会，不知道还要感谢哪些人的不杀之恩？


    我需要感谢当年这位同事的不杀之恩吗？


    错！我要感谢的，只是我对他的心理的洞察能力。


    不说废话。在定位哪些人是狠角色时，为了保护我们自己，我要先提倡大家在平时要注意防御哪些人。心理分析的作用可大可小，起码可以让你用来保命。


    在这里，我只是罗列特征，对不同的人进行具体心理分析，在我的心理分析方法著作《世界如此险恶，你要内心强大（2）》中已经详细介绍了，在这里不再自我抄袭。


    # 第一种人：性格孤僻的人


    我老家有句话：“三天不讲一句话，肚皮鬼怪大。”指的就是性格孤僻不爱说话的人。这类人虽然没有开口对世界说话，但心里一直在对世界说狠话。


    不是每个性格孤僻的人都是潜在的杀手，但冷血杀手往往出自这类人，尤其是在他没什么出息或遭受很大挫折的时候。


    如果你身边有这种人，你惹不起的，躲吧！因为你哪怕说“请吃饭”，他都会理解成“请吃屎”！如果躲不过怎么办？那就要面带微笑，不要对他的事情表现出任何关心，要充分给他面子，讲话一定不要直视他的眼睛，绝对不能开他的玩笑。而且，一定要有心理防御和身体防御，这非常重要！'
  - '[PAGE 24]


    # 第二种人：极度自卑的人


    一般来说，极度自卑的人既可能性格孤僻，也可能不那么孤僻。孤僻就是，他因为自卑，从世界上撤了，不和你们玩，只有在心理上玩不下去的时候，突然跳出来给世界致命一击。而不孤僻，则是为了克服自卑，要和世界玩，要凸显自己的存在。所以，如果你的存在让他的存在相形见绌，他为了在心理上得到生存，就可能让你在生理上得不到生存。


    极度自卑而又想开口对世界说话的人，最恨别人在某方面盖过他。


    如何识别极度自卑的人呢？很简单，看一下他的家庭背景，是否有过悲惨的过去；看他的一些语言，是否具有攻击性；看表情，当某件事别人盖过他时，他的反应是不是失望、嫉妒。如果具备其中的2点以上，你就要高度注意了。


    遇到极度自卑的人，要保持低调、低调再低调，如果你不想得罪他的话。有时候，你的确没有得罪他，但你的存在，本身就是对他的得罪。所以，如果发生交往，还有必要狠狠地贬低一下自己。如果他在心理上能够鄙视你，你就安全了。


    千万别说会触到极度自卑者的痛处的事情，比如家境、容貌。


    # 第三种人：心理阴暗的人


    人生最大的倒霉事，就是有一个心理阴暗的人出现在身边，你无论做什么，都会成为他阴暗心理的受害者。而如果你比他优秀、比他漂亮，那就更危险了。被投毒的清华大学生朱令，还有广西那位因为比同学漂亮而被同学分尸的小学生，就倒霉在有这样的同学上，而且完全不知道别人的心理，也从未防御。


    遇到这样的人，你也惹不起的，躲吧。'
  - '[PAGE 25]


    躲不起？那就必须学会在他面前真诚地贬低自己，让他找到存在感、价值感，千万千万记住，不要在他面前表现自己多么优秀，多么快乐，多么漂亮，否则他会在心理上活不下去，而他在心理上活不下去，你在生理上就活不下去！


    对这种人，一定要有心理和身体上的防御！


    # 第四种人：面目阴沉的人


    说要防御这种人，几乎是废话，因为他的面目、眼睛就是一个信号：他充满仇恨，而且要通过发泄仇恨来补偿自己，而你，一不小心就会成为发泄目标。


    如果是你的同学、同事，且不是性格孤僻和心理阴暗的人，那么，他可能要杀的不是你，你要预防的是不要去惹怒他，以及防止他去杀别人。而如果他是一个你在大街上碰到的陌生人，你就必须第一时间做出心理和身体的防御，躲远一点，不要对他有任何刺激。万一实在躲不开，也要做好万一他一刀下来你就回击或逃跑的准备。


    # 第五种人：面目阴沉目光呆滞的人


    这种人就是疑似精神病，而且是攻击性极强的人。他最善于发动突然袭击，一跃而起，一刀就来，这几年，中国社会所发生的“精神病人”在大街上杀人事件，主要就是这种人干的。


    看到这种人，既不要快跑也不要慢慢地走，要保持正常的速度；不要大声说话或有其他太大的动作，因为这些都是刺激这种人的信号。


    同时，千万记住，看到这种人，第一时间就要保持警惕，做好身体防御，万一他发动突然袭击，或者还击，或者逃跑，更重要的是逃跑！'
  - '[PAGE 26]


    # 第六种人：没出息但又自我感觉良好、心胸狭隘的人


    这种人往往自视甚高，但又没什么出息，内心里有无可救药的挫败感。怎么办？一方面他会认为自己多么牛，另一方面，他又会嫉妒或贬斥别人，双管齐下维护自己的心理高度。所以他非常敏感，心胸狭隘，一不小心，你就会得罪他。对这种人，千万记得贬低自己，但不要流露出刻意。同时，少说话，少接触，时刻保持心理和身体的防御。


    +   2. 同学？一个人和自己过不去，一定和别人过不去


    似乎最需要防御的，是身边的人，同学、同事、朋友、在街上碰到的人，诸如此类。


    先看一下同学。我在这里说的，是复旦大学研究生投毒案中，受害者最可能碰到的那种“同学”，不是说所有的同学都可能害我们哈。


    事实证明，大学宿舍成了众多狼角色自我修炼的地方。


    “感谢室友不杀之恩”固然只是一种调侃，但我们从表象上看不到的真实的心理世界，有时候也是让人不寒而栗的。我曾看过多少颗挣扎多年、称得上善良的心灵，在“心理保护”的运作下就像中了魔咒一样，扭曲变形，最终修炼成“狼角色”——毁灭他人且自我毁灭。


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_26_0.png)'
  - '[PAGE 27]


    更可怕的是，一个人变成什么样，在心理上无法阻止自己，才会把自己变成那样的。和我们的心理相比，狠角色们并不是另一个物种的生物，他只是放大了这一点：如果一个人在某种心理问题中不具备自我澄清能力，他一定会会自己以及他人过不去。


    # 成长的精神分析


    心理分析的过程，就是去理解（指进入内心感触其挣扎，不做道德判断，而非体谅）一个人的过程。下面我来给复旦大学研究生投毒案的投毒者林某做一个心理分析的肖像描画。


    性格：自卑型。


    性格驱动的心理保护模式：


    A. 隐藏自己，内向，孤僻，避免把自己投入世界、自我暴露从而带来心理伤害；


    B. 努力，严谨，偏执，完美主义，智力上把控这个世界，把对世界的智力优势转化为心理优势，借此来克服自卑。


    心理保护模式A本身就是一个人对自己内心的杀伤。因为一个人在心理上的成长，只有建立在和世界的联系中才能做到，这么干是在压抑自己，抽干自己的生命活力。所以，在有安全感的氛围中，他会解除自己的这种心理保护模式，变得健谈、放开；在没有安全感的氛围中，他会立马用这种心理保护模式来建立一道防线，避免可能的心理伤害——就是说，他是以自己杀伤自己内心的方式，来避免别人对自己内心的杀伤。


    心理保护模式B几乎是以自为牛×的自卑型性格的人采取的主流策略，这也就是这个世界主要是由他们玩的原因，从康德到海德格尔，从乔布斯到马云，都是如此。在网上，文青和公知们共同仇恨的一个人其实也是自卑型性格——方舟子。'
  - '[PAGE 28]


    自卑型性格的人，几乎很难和占有型、表演型的人合得来，像方舟子和李承鹏（表演型）、韩寒（占有型）、于建嵘（表演型）等就势同水火。他们之间的吵架，在很大程度上是由于性格因素：骨子里就排斥、不爽。


    这是题外话，言归正传。心理保护模式 B 不能停下来，也不能受打击，否则，一个人的心理生存就会受到威胁，麻烦就来了。


    最大的麻烦的经典例子，就是希特勒，他无法用创造来克服自卑，就会用破坏来代替。方舟子则是因自我怀疑科研能力，才用“打假”来找存在感、价值感。这些人，都是你惹不起的。


    林某呢？同样惹不起。


    可以说，自卑型性格中，那些企图用智力优势来谋取心理优势的人，只要他在擅长的领域具有自信，在这方面，你就不要抱着击垮他的幻想了。他的致命弱点在于：他不得不和你玩那些他并不擅长的游戏，且不得不认同游戏的规则。比如，他不得不谈恋爱，不得不接受“你多帅？有多少钱？”的质问，不得不忍受高帅富和浅薄女人们的羞辱。再扯句题外话：如果一个女生，发现男朋友或老公是自卑型性格，对智力优势很在乎，建议你让他感觉到他能
    hold 得住你。


    我还想说，这类自卑型性格的人，更不可能去嫉妒别人，因为他具有足够的心理优势。一开始，有传言说林某是因嫉妒黄洋而痛下杀手，网上传得到处都是，我把这当成一个低级笑话来听。


    但如果他在存在感、价值感方面严重受挫呢？可怕的转折点就在这里。林某是一个善良的人，但杀机恰恰产生于他对自已的专业感觉没有价值（“只是借助机器分析而不是治疗，帮人不能帮到底”），并且，投射到恋爱和婚姻上（想找一个家庭条件好的女生，女方可以出钱让他做生意，但又自己的想法感到痛恨）的时候。


    学业那么优秀，但对人心理的洞察那么差劲的受害者黄洋，倒霉就'
  - '[PAGE 29]


    倒亏在了这一点上。开玩笑，闹矛盾，也得先看一下对方的心理背景是什么。


    这里需要揭开一个秘密。当林某为自己“嫌贫爱富”的价值观感到痛恨，认为自己人生观和价值观出问题时，他其实是在骗自己。不管你信不信，反正我不信。


    骨子里自信的他根本就不屑于成为一个“凤凰男”。之所以有“做生意”等想法，是因为专业、事业都让他产生怀疑，对未来感到迷茫，然后心理保护机制启动，投射、转移到“做生意”上。由此可见他内心的受挫和自我否定程度。这个时候，谁要去惹他，就成了压倒他的最后一根稻草了，惹他的人在他心中的可恶程度会放大N倍，仇恨也会放大N倍。


    心理后果：敏感、记仇、冷漠、缺乏对他人痛苦的体验能力。


    林某的敏感是显而易见的，一个人内向孤僻，把自己封闭起来，正是为了避免可能的伤害，而敏感的意思恰恰是：我怕被你伤害、就假定你所说的某些话具有伤害我的嫌疑，这样，我就可以防了。内向、孤僻和敏感，在一个人的心理结构中是一起出现的。


    记仇，则是内心的一种公正感：为了防止伤害，我都把自己在心理上养成这样了，你居然还伤害我？记仇，是企图以攻击别人获取“公正”来疗伤，但后果是强化了自己的受伤感。


    冷漠：如果对世界产生兴趣和感情会让自己受伤的话，那么，就撇吧。冷漠，没有兴趣和情感，就不会受伤。


    缺乏对他人痛苦的体验能力：体验到自己的痛苦是让人痛苦的，逃避痛苦的方式就是压抑自己，而如果一个人丧失了面对自己内心的能力，也就体验不到他人的痛苦。'
