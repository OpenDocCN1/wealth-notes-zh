    仍然是通过经济手段做到的。


    房地产越是把社会结构弄得畸形、紧张，瓦解社会团结，它继续这样玩下去的基础，就越会丧失。既得利益者看起来很精明，但其实已经陷入非理性的疯狂。


    # 人心


    就一个社会的构成来说，社会结构的畸形、紊乱，相当于“外伤”，修复相对容易一些，用一系列制度和政策强有力地去“重构”即可。但如果人心被破坏，那就是“内伤”，要治疗就难得多了，它威胁到了社会构成的基础：价值导向、信任、公序良俗。


    有一份调查显示，中国社会的诚信状况总体偏低，而医药卫生、房地产业的诚信度最低。一个失控的、把全民押到赌桌上的赌博性的行业，其牟利的模式，原本就是需要排除诚信的选择。它强有力的竞争力就是垄断、强制、操纵和欺骗，而这，就需要把社会解构成一个不讲道德的竞技场，或者说，只有社会变成这样的一个竞技场，房地产才能让既得利益者赚得盆满钵满。这是一种竞争优势。


    这一竞争优势因房地产在利益导向上的呼风唤雨，影响千家万户而在中国社会被大规模地模仿，诱导、刺激人们也学会玩房地产利益链上的玩家们玩的那一套。社会因此而“房地产化”，变得浮躁、功利、投机心理盛行，对道德顾虑毫不在乎。


    一部中国的房地产发展史，也是一部中国社会的道德底线不断地往下降低的历史，它甚至威胁到社会最基本的构成单元：家庭。历次的调控，尤其是“限购”“20%个税”这类政策，都引发了大量的“假离婚”。仅仅是为了钻合法性存在疑问的政策的空子，或者规避地产政策带来'
  - '[PAGE 188]


    的伤害，原本神圣的婚姻，可以抵押给利益的考虑，而且看上去没有什么不正常。一个行业，"规范"这个行业的政策，当它可以轻易地瓦解一个社会的基本单元，像赶一群鸭子那样迫使人们拿婚姻当儿戏，其杀伤力，可谓深入骨髓。


    不需要和20世纪80年代比。只要和前些年比就会发现，中国社会在道德信念、精神气质上，越来越很琐化、下流化。这里有房地产的一份功劳。当年做出"不买房"姿态、抵抗房地产掠夺的人，在今天全变成了傻子。他们对政府的信任、对市场的判断、对一个社会基本道德导向的坚守，遭到无情的嘲讽。那么，这样的一个社会，不会再有这样的"傻子"出现。因为这意味着，他还没有去参与一场集体堕落的游戏，就已经被宣布出局。


    和房地产对政治结构、经济结构的"绑架"一样，它对社会基础的破坏，也形成了一种正反馈机制：高房价重构社会阶层结构和利益分配→形成巨大压力和利益诱惑→驱使人们参与房地产的利益狂欢→社会结构更畸形，道德更堕落→更推高房价……直到房地产的掠夺游戏终于玩不下去，而社会结构也会被连根拔起。


    任何一个形成恶性正反馈的游戏都无法持续。全面反思多年来房地产政策的政治、经济和社会后果，剥离它作为商品（市场）和居住（保障）的功能，定位好政府的角色，这正是新一届政府被寄予的厚望。这也是一种社会拯救。






