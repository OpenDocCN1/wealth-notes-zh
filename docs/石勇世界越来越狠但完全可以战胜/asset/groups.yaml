    有权力的人玩“狠”，我一律以“公务化暴力”称之。这个概念不是我发明的。


    什么叫“公务化暴力”呢？


    指的是在一个对社会具有公共的统治或管理职能的机构内，它的权力支配关系从单纯的秩序—意识的形态里逸出，体现为人（统治者、管理者、执法者）对人（被统治者、被管理者、老百姓）进行施虐的一种状况。而因为这种施虐是动用公共权力以执法（执行公务）为名，它被纳入了维护秩序的范畴而合法化。它与刑事犯罪等暴力行为的区别在于它的体制化特征。


    定义往往都高深莫测，很不亲民。但没关系，我们只分析有权力的人为什么会变狠。


    要一头狼在一头羊面前不狠，是不可能的。这是食物链使然。


    权力和被权力管治的人，构成了一种食物链。


    但和狼与羊的关系不同，有权力的人变狠，不仅仅是本性或食物链使然，毕竟，我们哪一条制度规定城管、警察、计划生育工作队可以打人？哪一条规定你去政府部门办事，公务员们可以给你不好的脸色，可以对你咆哮？


    是权力对没有权力的人的管治，内化到了有权力的人的心理结构里，从而，变成了他们的心态，他们的人格，他们的行为！


    所以，城管一看到小贩，就会两眼放光。


    还有很重要的一点，就是当一个人进入体制内，在一个权力等级中服从时，他必须压抑自我以及自己原来的角色，再以社会角色取代真实的自我。这会让他在一种把自己给卖了的感觉。所以，在被权力管治的人面前，他内心会有一种声音：“我TM
    都把自己给卖了，你还要怎样？找死啊！”他必须变狠，才能对自己做出补偿。


    说到卖掉自我的感觉，必须说一下和它有区别又有联系的一个现象，就是把自我交出去。


    在权力体系中的狠人们把自我交出去了吗？没有，如果他们把自己交出去，对权力体系中的意识形态就会有狂热的信仰，会按照制度的规定来操作的，会是一个好的执法者或“临时工”。


    他们把自我卖掉，仅仅是在服从等级的权力时压抑真实的自我，让这个等级权力破坏自己的内心，从而换取利益。后果是虚伪，心理畸形，变狠。


    而如果是把自我交出去，是以信仰作为基础的，只有你全心全意地信一种东西，觉得它多么伟大，你才能把自我交给他。为什么某些宗教徒看起来很狂热，对异教徒非常狠，但个人道德上好像并无污点？原因就在这里。


    某些佛教徒例外。他们宣称信佛，但并没有把自我交出去。


    ## 10. “斗狠”是变狠的升级版本


    个人变狠，群体也会这样，而且，他们还会相互斗狠。


    在今天的群体斗狠中，既可以看到“仇官”“仇民”，看到“仇富”“仇穷”，同样也可以看到偏好群众、价值观念群体之间的互掐，比如“狗粉”和吃狗者，比如“左派”和“右派”，比如这个明星大
    V 的粉丝和那个明星大 V 的粉丝。


    斗狠，是变狠的升级版本。


    ### 就狗展开的斗狠，隐含着对人的狠


    《南风窗》有一篇标题叫《群体和阶层的“斗狠”》的报道（作者张墨宁），写得很不错，捅出了很多秘密。在这里抄一下：


    > “今天杀狗的时候发现这条狗皮非常柔软，所以我决定把皮剥下来做皮垫，然后就在狗腿上割一刀，再把皮活扒下来，然后准备做烤全狗，可是当我把皮都给剥下来的时候这条狗竟然没死，还在欢乐地叫着，所以我只能再用刀把它的头给割下来，然后大卸八块。”


    7月9日，广西人韦一鸣在他“专门用来杀狗”的微博上写下这段骇人的“战书”，鲜血淋漓的配图引来别人要“人肉”他的威胁。但他不以为意，反而遗憾血腥程度仍然不够刺激眼球。因为拍照的时候，狗其实已经死了，没有展现出从活物到餐看的全过程。


    事实上，这段文字只是韦一鸣的夸张描述，他既没有每天专门杀狗，也没有按照微博上说的的那样虐杀活狗。渲染暴力和残忍只是为了挑衅他口中的“狗粉”，以达到泄愤的目的。


    愤怒，已经成为社会大众的普遍体验。群体的隔阂与分裂使得任何一个问题、一起事件、一种价值，都足以为引爆点，惊雷乍起，人们迅速站队、做好斗争姿态。“狗粉”“脑残粉”……贴给对立阵营的贬损式标签像一条无法弥合的裂缝。“粉”，已经从一种膜拜和崇尚变成了认同切割。愤怒弥漫，每个人似乎都需要寻找一个出口，韦一鸣的出口就是“杀狗”给别人看。


    ……


    28岁之前，韦一鸣从来都不觉得吃狗肉有什么问题，他的柳州农村老家每家每户都养着好几条狗，逢年过节，“不听话”的狗就会成为当地人的盘中之物。


    虽然在一个以此为风俗的环境中长大，但是韦一鸣并不爱吃狗肉，他嫌“硬”“容易上火”。每次看到杀鱼宰猪的场景，也会“心里不舒服一下”。曾经养过的一条宠物狗被朋友带到外地走丢了，他为心疼了很久。“我觉得爱狗和吃狗肉一点也没有冲突。”韦一鸣说，现在他就养着一只白色的东洋犬。


    情绪的转折点是从今年的广西玉林荔枝狗肉节开始的，素有“荔枝狗肉夏至菜”说法的玉林，遭到了全国反对杀狗的爱狗者的批评和抵制，一群来自四川成都、广元，贵州、吉林、河北等地的爱狗者来到该市宣传动物保护。他们还呼吁当地政府予以取缔，激愤者开始在网络上问候食狗者的祖宗八代。


    “他们太嚣张了，我们这里的人从小就没吃过狗肉，为什么要受到他们的设骂，甚至对我们全家的诅咒？”韦一鸣感到怒不可遏，以前虽然也厌恶“狗粉”的做法，但是这一次针对的是他们广西人，这让他觉得不可忍受。“如果他们敢当着我的面说那番话，我肯定会出手教训的。”


    不仅愤怒，他还付诸行动。当晚，他回去吃了一顿狗肉。自己吃仍觉得不够解气，他还把谩骂的内容转述给了那些平时不怎么上微博的朋友。“我的朋友说，那就让我们用吃更多的狗来反击吧，这样才能破除他们的诅咒。”于是，韦一鸣和他的伙伴们现在以平均每两天吃一次狗肉来纾解自己的情绪。


    “我觉得那些‘狗粉’都是未成年、年纪大的人或者那些被包养的女孩子，他们整天没事干，很多都是价值观扭曲的，都是一些没有修养的人。”韦一鸣眼里的“狗粉”应该就是这么一群人。而在对方看来，他这样不加掩饰的“非文明”行为肯定是生活在社会底层，需要用杀狗来表达对生存现状和社会现实的不满。


    观念分歧的背后是对立双方互相的身份想象和认定，近几年，随着反对杀狗的爱狗者声势渐长，他们越来越倾向于诉诸直接行动，比如在高速公路上拦车救狗，而最近的几起恶狗伤人事件和是否应该禁养大型犬的争论，则进一步激起了矛盾。


    似乎占据了道德优势的爱狗者把他们的“敌人”看作蛮荒不化、挣扎于底层的失败者，而沿袭并维护特定传统的人则把极端爱狗看成缺乏基本权利意识的暴力行为，他们爱狗，不过是因为生活的舒适和优越感，衣食无忧，从而有闲心对他人的选择横加指责。


    观念之争已经不仅仅属于动物保护的范畴，更像是阶层分野的标志。按照争端两方的逻辑和对不同阶层的一贯印象，是否吃狗，对应着想象中两种不同的社会身份。


    好，信息量够了。我们来看看，“狗粉”和吃肉或者不吃肉但特别反感“狗粉”干预别人吃肉权利的人，为什么能斗起来。


    需要说明的是，爱狗者既是自以为占据了道德优势的一方，也是频频挑衅的一方。没有他们的“拦车救狗”、没有他们骂狗肉节，干预别人吃狗的权利，“韦一鸣”们不可能恶狠狠地回击。


    我本人对“狗粉”们的心理和行为，抱以最大限度的遗憾。


    我不想说这些人得了“恋狗癖”，我只想说，围绕狗而展开的斗狠，实际上隐含着对人的狠。


    ### 爱狗，可能正是因为对人有恨


    爱狗、吃肉，不过就是不同的偏好而已，有谁的偏好伟大到可以干预别人的偏好吗？


    我们来分析一下“狗粉”不准别人吃肉的逻辑：


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_64_0.png)


    A. 狗是人类的朋友。推论：吃朋友在道德上是错误的。


    辨析：人类是一个整体。一个人可以认为狗是他的朋友，但不能认为狗也是或应该是别人的朋友。因为你的狗忠诚于你，但并不忠诚于别人，它甚至还会咬别人呢。


    更何况，把狗当朋友和把人当朋友并不是一回事。因此，根本不能推出因为你把狗当朋友，你就不准别人吃狗。你最多只能管好你自己不吃。


    B. 很多狗是偷来的。推论：吃狗在法律上都存在错误。


    辨析：那只是指控，而不是对事实的认定。凭一个指控就不准别人吃狗，那么别人是不是可以凭一个指控认为你是精神病而强迫你在精神病院里治疗？


    更重要的是，吃狗和狗是偷来的并不是一回事。从狗是偷来的，并不能推出人不能吃狗。


    而按照这个逻辑，如果狗不是偷来的，是不是可以吃了？


    C. 狗肉缺乏严格的检验检疫。推论：吃狗对人身体有害。


    辨析：“狗粉”一边辱骂吃狗者祖宗十八代，甚至认为被狗咬死的两三岁小孩该死，因为他们惹了狗，一边又关心吃狗者的身体健康，确实难得。


    但这仍然只是一种指控，同样不是对事实的认定。如果一个人真的认为狗在这方面有问题，可以向防疫部门报告，请他们来检验。同样，按照这个逻辑，如果狗在防疫上没什么问题，显然人们是可以吃狗的。


    D. 吃狗不文明，是杀死别的生命。推论：吃狗残忍，没人性，在道德上是极端错误的。


    辨析：这是“狗粉”所有指控中看起来最靠谱和有力的。吃狗至少确实不高尚，因为狗真的是一条生命。但问题在于，我们是人类，我们的食物，主要就依赖于动物和植物，它们都是生命。我们是否文明，判断的前提条件恰恰就植根于我们生存的饮食结构里。所以，按照“狗粉”们的这个逻辑，如果吃生命就不文明，就没人性，那会带来这样一个逻辑上的自我挫败：什么动物和植物都不能吃，于是，人全饿死，什么文明，什么人性，也就没了。


    所以，这个看似有力的指控，其实是一个伪问题。在人类既有的生存条件下，你很难把饮食——把吃猪、吃狗这类问题道德化，扯到什么文明人性的高度。真正的问题不是我们是否吃狗，而是是否虐狗！


    而在这里，“狗粉”们就显得伪善了。无论是挽救他们在逻辑上的自我挫败，还是内心的真实想法，他们都不是预设我们不能吃猪吃鸡吃鸭吃鱼吃狗等一切动物和植物，而只是不能吃狗！事实上，他们也大量吃猪吃鸡吃鸭吃鱼，而且不仅自己在吃，还拿来喂狗粮！


    这就奇怪了。难道是所有动物一律平等，狗比其他动物还要平等？为什么预设狗比其他动物特殊？难道是它高档，难道是它是“狗粉”的宠物，是“狗粉”对它有特殊情感？可是，爱狗者怎么认为是爱狗者的事，又关其他人什么事？


    E. 吃狗的人，对狗残忍，对人也残忍。


    辨析：准确地说，是虐狗的人对狗残忍，对人也残忍，因为他已经心理畸变。但一个人是否残忍，和是否吃狗没什么逻辑上的关系。事实可能恰恰相反：在心理上，很多“狗粉”爱狗、对狗有感情，不是他们爱人，对人有感情的延续，而正是对人对冷漠，对人对没有爱的结果！期待他们爱狗从而也爱人无异于做梦！人间的苦难不会触发他们的任何同情心，但一条狗如果受伤，他们会无比难受。


    ### 在别人的权利面前，我们的偏好运不那么大


    我曾经说过，一个人变狠之前，他在头脑上已经变蠢了。


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_66_0.png)


    正如一个人如果不懂礼貌，没有道德，他一定有心理问题。来看一下就狗展开的斗狠，能给我们什么样的思考。


    一个人爱狗是他的偏好，在道德上，是他的权利，别人管不着，但另一个人吃狗也是他的偏好，在道德上，也是他的权利，别人同样管不着。在这里，没有谁比谁更高尚。相互尊重、相互共存即可。


    人有无数的偏好，爱狗，吃狗，听音乐，踢足球，喜欢坐在咖啡馆里装13，喜欢打小报告。


    有些偏好在道德上是错误的，比如喜欢暴力，喜欢打小报告。对于这种偏好，别人没有尊重它们的道德义务。


    但很多偏好在不存在道德上的问题，比如爱狗和吃狗。这些偏好如果只是局限在私人领域，不对他人提出什么要求，也不妨碍他人，那就是一个自由的领域，偏好可以变成一种“涉己的权利”。比如一个人爱狗，想怎么爱都可以，叫宝贝儿子都行，别人不能干涉。


    但在涉及别人时，如果一个人的偏好的满足，需要对别人提出一个“规范性要求”，比如因为你爱狗，所以别人不能吃狗，要求别人牺牲自己的偏好，那就必须先证明，你的这种偏好，同时也就是一个“涉他的权利”，别人有道德上的义务来成全你，为你限制、取消自己的偏好。也就是说，你必须给你的偏好一个道德上的理由，并且，这种偏好在道德上的分量压倒了对别人的偏好的道德分量。


    能证明吗？


    正如前面所驳斥的，根本无法证明！


    把狗特殊化是不行的，因为你是你，别人是别人，别人不具有你对狗那样的情感和偏好，你也不能证明自己的偏好就比别人的偏好伟大，并且可以强迫别人服从你的偏好。这是专制主义的思维。


    那么，只有一条路，就是把爱狗行动宗教化，即把狗当成一种信仰，一个神圣的图腾，这样，似乎别人就有一个道德上的义务，尊重他们的宗教信仰，至少是不能冒犯，从而不能吃狗。


    但这条路仍然不通。凭什么你可以把一种你并不拥有所有权并且具有普遍化色彩的东西给予宗教化，按照你的偏好，预设得多么神圣，然后用来要求别人？这在逻辑上仍然是自我挫败的，你把狗当成信仰崇拜，不允许别人吃狗，别人是否也可以把狗当成罪恶的东西，不允许你爱？或者，是否可以崇拜鸡，崇拜鱼，不允许你和你的狗吃？


    如果一个人心理没问题，具有尊重别人的修养，那么，他应该明白：每个人都可以认为自己的偏好是多么伟大，但一个理性的人，一个理性的社会，不会认为它伟大到可以无视他人的权利。


    ## 第3章


    # 大人物也是狠角色


    对于大人物来说，必须让别人知道自己的狠。


    狠角色太多了。


    我们来看一下老外，看一下大人物们。


    ## 11. 普京：肌肉提供的是安全和自尊


    1999年12月31日，人类进入21世纪的前一天，俄罗斯总统叶利钦突然“传位”给弗拉基米尔·弗拉基米罗维奇·普京，让世界震惊不已。


    世界越来越狠，但完全可以战胜。


    这真是一个负责任的决定。身体臃肿、已显衰弱之态的叶利钦把俄罗斯命运的掌控权交到精力十足、身体强健的普京手里，象征着俄罗斯这只北极熊将一改其笨重无力的形象，变得敏锐、强健，具备足够的威慑力。


    苏联解体后，将近十年，一个曾经雄霸天下的超级大国像被掏空了一般，内部四处起火，在外交上居然沦落到要向他人摇尾乞怜的地步，俄罗斯人的民族自尊心蒙受空前羞辱。像奥巴马的竞选名言一样，这一点必须“改变”。必须有一个铁腕人物，让俄罗斯人重温沙皇和苏联时代的荣光，这个人的身体必须给人信心和强列感。身体强健、表情冷酷的普京由此被推到历史的前台。


    一个大人物的肌肉只是权力、力量的象征，在没有用行动和态度表达他重振山河的伟大抱负，放射出权力、力量，从而给人一个强烈的印象之前，亮出肌肉是愚蠢的。普京当然不会这样干。他冷酷的表情、干脆的动作，都在给俄罗斯人一个心理暗示：他有足够的力量消除恐怖主义、分裂主义的威胁，并在西方面前捍卫俄罗斯的王者地位。


    但随着这类表情、动态的一再重复，在有些威胁仍没有消除的情况下，它便会给人一种审美疲劳。在心理上，大人物的力量感被褪去，他掌控权力的合法性也受到威胁。2007
    年 8 月 13 日，往来莫斯科与圣彼得堡之间的一列特快列车遭遇爆炸袭击。对于普京来说，这一身体政治的模式走到尽头，它必须升级。10 天后，他与访问俄罗斯的摩纳哥王子一起外出骑马时，赤裸上身的照片曝光。


    在这些照片中，普京身着车装、肌肉结实得让人惊叹。有媒体认为，许多妇女把他当成性感偶像，男上更是大受刺激锻炼身体。这浅薄得令人发指。普京露肌肉并不只是为了给俄罗斯妇女看，也不是为了给俄罗斯男人一个锻炼身体的榜样。他是在用自己的身体告诉全体俄罗斯人：


    相信我，作为“硬汉”，我有力量给你们安全和自尊。同时，他也是 在告诉全世界，尤其是西方：俄罗斯绝不是好惹的。


    ## 12. 奥巴马：也是一个“肌肉男”


    语言和身体都可以变成一种政治摄魂术。知道这一点的人不少，但没有谁像奥巴马那样具有魅惑性，似乎可以让另一个世界显灵。


    不幸的是，他是美国总统。一个人的魅惑性如果和现实经验拉开了太大的距离，似乎要与屋大维、拿破仑、希特勒这些幽灵在不可预知的未来相会，美国人就会警惕。在内心 里，他们始终害怕自己抗拒不了“致命的诱惑”，那些不着边际的话语，对于他们来说就像是来自于地狱的声音。


    在古 代社会，一个念念有词的巫师，其语言必须具有神秘性，且要通过身体构造出一个独特的仪式，才能让部落成员确认它可以和鬼神交流。马克斯·韦伯所说的“奇里斯玛”，就产生于语言的奇怪编码和身体不同于常人的扭动中。


    奥巴马不必这样玩。2008 年，他竞选美国总统。一开始就不用怀疑，民主党内的对手希拉里·克林顿只能被推到一边。一个国家有女总统一件不是 一件奇怪的事情，但是，女总统不可能产生在美国这样必须在世界上扮演老大的国家。共和党的对手麦凯恩更是必输无疑——他并不具有用语言和身体暗示删除布什留下的那个烂摊子、唤起人们看到另一个美国的能力。


    拥有催眠般的语言魔力，这是奥巴马的杀手锏。他那时扮演的角色实际上是一个政治牧师。在“改变”的狂欢中，他似乎可以带领美国人踏上一片应许之地。


    但奥巴马看上去显得单薄的身体，和他语言的魔力构成了一种撕裂。对于大国来说，一个总统“头脑简单，四肢发达”和“头脑复杂，四肢简单”都很可怕。不必怀疑奥巴马的精力或者智慧，但是，人们有理由怀疑，他这一身体能否构成强大美国的象征。


    奥巴马迅速捕捉到了这一微妙的社会心理。2008 年 12 月下旬，就在离他就任美国总统还有一个月之际，他携妻子、两个女儿前往夏威夷度假。在海滩上，他脱掉上衣，向美国人展示其肌肉。类似于普京，他并不单纯是为了在美国人面前证明自己是
    个“肌肉男”，或表明自己身体健康，而是要通过身体的展示对自己的权力进行合法性论证：自己的肌肉造型，就是在心理上和美学上人们认为的美国总统的造型。他不仅可以提供安全感，还能满足美国人的征服欲。


