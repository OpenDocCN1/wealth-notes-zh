    但从羞辱一个最底层的人中找到快感，已经说明了“扔蛋姐”的档次，也就比最底层的人在社会价值排序上高一点而已，换言之，她不过是一个小市侩。而一边走一边剥鸡蛋吃，对于自己的身份也是一种自我招供。那些从社会中掠取了巨大利益的分利阶层，当然是不屑于这样做的，环卫工也非他们表演“上等人”时的配角，那太“跌份”了。


    就阶层和社会利益结构而言，小市侩其实也是被剥夺者，从心理食物链而言，她也是被分利阶层在心理上吞食的无名大众中的一员，在后者眼中她和环卫工的区别并不大。


    但幻想她不去鄙视、羞辱环卫工只能是做梦。因为在心理上，这些人已经扭曲变狠：更高档的人吃她，她就去吃更低档的人！


    ## ◆ 谁干掉道德，道德一定会干掉他


    “扔蛋姐”已经向我们招供：一个内心被破坏而变狠的人，一定会找机会羞辱、攻击、损害一个因为善良、诚实、弱小、低贱而在心理上显得弱势的人。


    这恰恰是中国社会道德沦丧的一个真相。


    大家都知道，一个假期过后，风景区几乎被中国人蹂躏了一遍。遍地垃圾和乱踩乱画的背后，有什么秘密吗？


    我在广州白云山上曾经目睹过，无数的游客在从上下来时，在拐弯处放着好好的马路不走，仅仅是为了多省几步路，群起踩烂篱笆，扯断树木，跌跌撞撞地从一条“新路”上下来。在马路边，有很多人在仰头望着他们，并拿出手机拍照，就像是迎接英雄的归来。


    我仔细地看了他们的表情，发现充满了破坏秩序、践踏景物的快感。那一瞬间，我明白他们为什么这样干了：篱笆、植被对于他们的破坏毫无防御能力，他们的心理和“扔蛋姐”看到“低贱”的环卫工就羞辱一模一样。


    看着一张张欢乐而毫无愧色的脸，我发现说他们“素质低”几乎毫无意义。“素质低”仅仅是对他们的行为的外在描述。而真相是，他们的行为是受到心理动力驱动的。“素质低”，不过是他们的内心已变狠，再以破坏的行为表现出来的结果。


    一个社会的道德沦丧也一样。说一个人没道德，只是我们对他的行为的外在评价。但是，在他做出不道德的行为之前，他的心理结构已经被破坏了。道德问题，不过是心理问题的结果。也就是说，一个社会越是道德沦丧，人的心理就越扭曲、变态，反过来也一样。


    原理很简单：谁干掉道德，道德一定会干掉他，让他心理扭曲、变态；而心理扭曲、变态的人，最大的渴望就是干掉道德！


    ## ◆ 变狠的人总会说出混账话


    如果你问我，一个内心已经变狠的人，会有什么样的心理反应？我的回答是：他不敢听到自己内心的声音，因此他一定自我感觉良好。而自我感觉良好，在心理上的唯一意思就是对自己装
    13。


    而装 13 在心理上的唯一意思，就是他需要去掩盖什么。因此一个聪明的人，根本不会被别人装 13 镇住，而是马上可以看到装 13 背后要掩盖的东西。


    同时，这些人还有这样一个心理反应：使自己的行为“合理化”。他们倾向于找一堆歪理来为自己的行为辩护。


    中国社会的是非不分，恰恰就是这帮内心变态且必须合理化自己的行为的人搅出来的。从药家鑫师妹李某颖“我要是他，我也捅”，到今天为“扔蛋姐”辩护的“环卫工不仅不能生气，还要感谢她，要不然连饭都没得吃”，都是如此。当然，这也相当于药师妹等不打自招，承认自己心理变态。


    这些歪理值得一驳吗？从本质上，它们不是头脑的产物，而是心理的产物。当我们说一个人“脑残”时，其实真正的意思是他心理出问题了，导致了大脑功能的丧失。


    我想说，你在网上所看到的无数脑残回复，无一不是背后的那个缩头乌龟心理出了问题的结果。因为，一个人如果真的智力不行，或者无知，他一定不会显得那么自我感觉良好，真理在握。正因如此，分析一下为“扔蛋姐”辩护的歪理还是挺有意义的。


    看一下“环卫工不仅不能生气，还要感谢她，要不然连饭都没得吃”。这段话犯了三个逻辑错误，仅仅从智力上看，只有脑残才能说岀来：


    - A. 环卫工这一职业的存在和有人乱扔垃圾这两者之间在逻辑上并不存在对应关系，乱扔垃圾需要打扫，仅仅是环卫工工作的一个内容，除此之外她还要干其他事情。换言之，有人乱扔垃圾，只是加重了环卫工工作的负担而已。把减轻环卫工工作负担叫作让环卫工没饭吃，这在逻辑上是错乱的。

    - B. 环卫工只是叫“扔蛋姐”把蛋壳扔到簸箕里，换言之，她只是希望对方不要故意加重自己的工作负担。她有权利这样做吗？当然有，因为不乱扔垃圾，是一个人的道德义务。一个人不履行自己的道德义务，逻辑上无法被理解或解释成是对另一个人的帮忙，帮环卫工保住饭碗。

    - C. “扔蛋姐”拒不履行自己的道德义务，故意加重环卫工的工作负担，实际上已经对环卫工构成一种利益上的损害。非但如此，她还以语言进行挑衅、辱骂，更是构成精神上、人格上的伤害。把对一个人利益和精神、人格的伤害说成是帮别人保住饭碗，还要别人感谢，一个人的内心要被破坏到什么程度，才能说出这种混账话？


    “扔蛋姐”有大量的心理同伙。他们可能是用钱羞辱屌丝的官商利益结构的寄生虫，可能是仇视工农的权贵走卒，可能是鄙视农民、穷人的城市市侩，也可能只是一个随便在风景区扔垃圾的游客。


    在今天的中国，他们以不可阻挡之势，始害无穷地繁衍开来。


    # 8. “狠”经过包装，也可以变成名利


    “狠”是可以用语言、姿态来包装的。一个狠人完全可以躲在“自由”“民主”“正义”“良知”的招牌之下。


    比如对弱者的痛苦的消费以及炒作，摆出“被权力迫害”的pose，就能把一个人内心的“狠”变成名利。


    我要说的是性侵幼女所引发的事件。海南万宁的校长找女生开房后，“校长，开房找我，放过小学生”的行为艺术引起了一片“良知啊”的赞美。但当一个模特也这样玩时，我终于吐了。


    消费也要有个度。


    我们来看一下这帮表演艺术家的“狠”在哪里。


    首先进行语言分析。


    “校长，开房找我，放过小学生”的语境谁都清楚，就是海南万宁以及其他地方的校长性侵小学女生。这句话是由这个语境里引出来的，没有这个语境，玩这种行为艺术的人不要说什么抗议了，压根就是一个神经病。


    那么这个行为艺术针对的，是已经性侵了小学女生的校长们。“潜在性侵”的校长不行，你哪知道人家会不会找小学女生开房？举着牌对人家这样是十足的冒犯。


    行为艺术更不是针对微博上的观众。他们是一群围观起哄的消费者，不是校长！这意味着，如果你真有种，真是玩行为艺术，而不是低级的炒作，你应该去有校长们的地方玩，或者，跑到事发地点（酒店）里去玩。最不济，也应该是跑到教育局门口去玩！


    但是有几位是去这些地方玩？他们的行为艺术，是做给微博上的网民看的。正因为如此，没有哪一位炒家，在举牌叫“校长”找TA时，把自己的联系方式（电话）写上。如果说有几位还写了几位阿拉伯数字（比如“110”）的话，那么，刚才提及的那位“模特”什么都没有写。你不是叫别人找你吗？怎么找？


    所以还抗议什么！


    来看一下成本和收益。


    在中国，当一个英雄，是要付出沉重代价的。但这种行为艺术让炒家们付出了什么代价？有一个叫“流氓燕”的女人，据说是最先去海南搞这种行为艺术的，后来砍人，被警察抓了，于是被解读为她是玩这个行为艺术而被“迫害”了。


    可是，媒体早就披露，她砍人的事和举牌“校长，开房找我”八竿子打不着！


    而且，预设广西某个县的警察，有那么大的无私精神去为海南万宁的烂事擦屁股，这已经超出了正常人的想象。

