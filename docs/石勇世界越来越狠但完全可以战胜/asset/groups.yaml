    但是，要搞清楚，这是基于预期此老人会有安全问题而让座，而不是因为他是一个老人这一身份，别人就应该让座。对孕妇、小孩、残病人让座也同样如此。事实上，任何一个人，包括年轻人，如果预期有安全问题，别人也应该让座。


    如果看不到这一点，把让座和身份联系起来，那就是偷换概念，在认知上“出老千”了，把享受年轻人的让座当成了老年人的特权！似乎，就像主流舆论和脑残时评写手认为的那样，只要有老人上车，年轻人就应该让座。


