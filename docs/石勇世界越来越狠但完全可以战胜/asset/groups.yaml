    \n+   a. 很简单，“半打啤酒”，这是有具体所指的信息。当一个人说自杀  \n提到了具体的东西时，他已经把自己的信誉押上去了，因为具体的东西  \n\
    无法通过语言游戏等来辩解。\n\n+   b. “谢谢这个世界……”这段话更是暴露了他的自杀心理。它的功  \n能其实只是通过抒情让自己进入角色，得到一种死前的悲壮感。\n\
    \n+   2. 8分钟以后，他说了下面这番话，并且上了图：\n\n“第三瓶了，我相信六瓶下肚我一定会有死的勇气。不要问我为什么。  \n本来一个人在外面就很累了，可家人却还是嗜钱如命，把我个人置之度外，\
