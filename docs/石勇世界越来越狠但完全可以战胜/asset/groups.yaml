  md: '

    对心理优势的争夺，这种心理优势对应着一个人社会中的地位、档次、品位等——它们在一个给价值进行排序、使价值呈现等级特征的社会中，说明了这个人的价值。进行心理竞争的目的，就是为了在价值排序上尽力往上攀登。


    弗洛姆曾运用“心理生存”这个概念来说明人类诸多变态行为背后的深层动机。正如人在生理上要活一样，在心理上也必须活，所谓的自尊、面子等，不过就是要谋求心理生存的通俗表达。一旦一个人在比较机制的驱动下在一个比较领域或结构中被证明自己没有能力、地位、金钱、品位、礼貌等，他的存在价值就会遭到否定，他就有一种强烈的挫败感，在心理上就很难生存。


    人们之所以要在心理竞争中获取心理优势，就是因为心理劣势的处境将让人不堪承受。故而，人生下来，就像是被投入了一场在他人面前显示自己有价值，至少也是在和比自己更惨的人相比有价值的战斗中。在很多时候，除非他在心理上能成功地制造幻觉，才能确认自己的价值，否则这种价值必须通过外在的证明，即通过社会物品、社会资源的占有与他人进行比较。


    人的社会行为的背后可以找到心理上的动机，但心理上的动机来自何方？它只是一套生而具有的“本能装置”吗？如果“本能”不是在生物学的意义上，而是在哲学层面上，即在人的存在本体论层面上的“存在性冲动”来理解，那么这种表达不算是种谬误。很多不能承受生活中的痛苦的人都对猪艳羡不已，一个重要的原因就是猪没有那种感受痛苦的意识机制。它的存在是是世界自在地同一的，其存在结构已被嵌进了世界的存在中，它就是世界中的一部分。这是一种已被规定好了的存在，其“存在性冲动”只是生物本能。所以，其痛苦只是生理上的痛苦，而谈不上有“心理上的痛苦”。


    而人则不一样，一方面他是动物，逃避不了生物本能的主宰，但另一方面，他又有意识，对世界具有一种超越性和反思性，即他不仅仅是世界的一部分，同时世界也是他的对象，世界也会成为其存在的一部分。这使得其存在挣脱了那种与世界的自在同一，摆脱了被规定的命运。用一个比喻来说，人的存在在世界上的位置，介于动物和神仙之间，他摆脱了动物的被规定性，但其意识上的超越性根本不能导致他在生理结构上摆脱动物性而达到神仙的那种超越性。他从动物状态出发，向神仙的存在进军，但永远到达不了神仙居住的地方。因此，他既摆脱了与世界的自在同一，也根本不可能达到与世界的和谐统一，他只是一个弗洛姆、舍勒等人所说的“宇宙的畸形儿”。


    这样的一个“宇宙畸形儿”的存在最大的一个本体论特征就是存在意识的分裂——即“自我意识”与“对象意识”的分裂。这种分裂预先决定了人对“自我”的确认离不开一个外在的对象：人对“我”的意识。


    即使不是通过与外界的对比，也是通过外界所提供的诸多材料、信息、符号参照来进行。猪与世界的存在合二为一，它只是世界的一部分，不是“主体”，没有“主体一客体”这一结构，而人的存在结构却具有鲜明的“主客二元结构”的特征。即，他的存在依赖于一种对自身的确认并指向外界。这是一种弗洛姆所说的“方向性结构”：没有一个方向，人就会找不着北。当人因其“自我意识”和“对象意识”的出现而被从世界中剥离后，其存在就丧失了确定性和附着感，他只有依赖于“主客二元结构”才能将自身与世界联系起来。在这种联系中，“主客二元结构”被加以秩序化，形成人独有的“存在性冲动”。


    因此，“宇宙畸形儿”的命运决定了人的很多植根于存在性命运而非生物本能的心理反应机制。人承受无尽的孤独和恐惧，迫使他出现类似于心理上的“退行”的“逃避自由”的现象，尽力想让自己融入群体之中，使自己化为世界的一部分，从而摆脱威胁；或者尽力用意识将世界吞没，使世界化为自身的一部分——这两种方式在表面上都可以克服人与世界的分裂。这是受虐和施虐的最原始的“存在性冲动”。而主客二元结构决定了人对其存在的确认离不开外界，即除非是在一个人已经“无我”（像出家那样），也即已消失了“主体”而解构了这一“主客二元结构”的情况下，才有可能摆脱外界的制约和影响。大多数人做不到这一点，惯常的方法就是加剧主客的对峙，使“主客二元结构”恶化为“主客二元对立结构”，通过主客的对立而凸显“我”的存在。


    尽力在这个世界上证明自己的“存在”，构成了人的一种最深远也最强大的内驱力。人对死亡的恐惧实际上是一个有自我意识的生命体对于虚无化的恐惧的一种最深刻的反应。人对虚无化的反应还有很多，比如害怕别人对自己的忽略。


    而作为“社会人”，他不仅要证明自己的存在，还要证明这种存在是有价值的，否则他在心理上就很难生存。而我们知道，一个人对自己的存在的论证离不开一个“主客二元结构”，因此在社会中，绝大多数人对其存在价值的论证，也即维护心理生存的方式都带有人际联系和人际比较的色彩，即严重依赖于他与人发生的关系。而对一个人的存在的把握，在绝大多数人的思维方式中，在社会所给予的认知模式中，只有通过对他的存在属性的把握才可能实现。


    因此，存在分解为一系列存在属性，一个人的存在就是性别、年龄、职务、民族、国籍、信仰、地位等一系列东西的总和。这样，存在是否有价值就体现为存在属性在一个给价值进行分等分级的社会中的价值判定。一个人对其存在价值的论证，也就是对他是否拥有对应于其存在属性的社会物品和社会价值资源的证明。争夺“存在价值”就表现为人与人之间的竞争，也就表现为实质上是一种对权力、地位、金钱等的竞争。一个人炫耀自己有这些东西，也等于证明自己比别人更有档次，更有价值。不再是人自己，而是人所拥有的东西，决定了人的价值。


    ## 砸牌坊的人


    人类社会从古至今，牌坊无处不在。一个压榨人民的政府，可以自称为“民主政府”；一种奴役人的意识形态，大言炎炎是人的“解放”的“理论武器”；“自由”这个词被抽掉具体的所指，把贵族们的自由说成是所有人，包括受贵族们支配和掠夺的人的自由；一个人对金钱、权力等具有神经症患者般的迷恋，却把对它的追逐说成是“实现自我价值”；一个人对他人具有一种施虐倾向，却以对他人“爱护”和“关心”的样子出现；一个人分明是想利用流行的衣着打扮来引人注目，论证其价值，却硬说这是对美的追求，是一种似乎很高雅的时尚……


    有牌坊存在，当然就有砸牌坊的人。从逻辑上梳理，从心理上分析，是砸牌坊的两种主要方式。


    一般来说，倾向批判的知识分子喜欢砸牌坊，而标榜科学的实证研究的学者似乎兴趣不大。很有趣的是，在经济学家中，托斯丹·本德·凡勃伦是个难得一见的砸牌坊的人。或许是有所忌惮，他在抡起大锤朝“有闲阶级”的奢侈消费砸过去的时候，不忘了说一句：我不是在砸牌坊，我只是在陈述事实。的确，他是在陈述事实。其实砸牌坊的人，不过是把会让一些人受不了的真相揭示出来而已。


    人类社会有很多东西表面上看起来是正常的。人要生活，就要消费，有了钱就要想尽办法消费好的物品，追求“更高一层享受”，这看起来并没有什么不正常，正有人总想抢夺权力、金钱，往上爬一样。然而，这种“正常”至少也要在人们的消费不超过他们的消费能力的前提下才能得到证明，也即消费的确只是为了满足人们的“正常需要”本身。而如果一个穷人哪怕少吃饭也要穿得好一些，这就很有探究的必要了，证明消费已远离“正常需要”，人们所消费的实际已不是商品的使用价值，而是它的社会价值，也就是说，它已脱离经济学范畴而进入社会心理学领域。


    这种行为可以看出受占支配地位的某种社会心理所影响，这背后一定隐藏着什么深刻的心理动机。在凡勃伦的那个时代，他观察到：在社会上没有个阶级——甚至极度贫困的也不例外——对惯常的明显消费完全断念。这些人除非处于直接需要的压迫之下，否则对于消费的这一范畴的最后一点一滴是不会放弃的。人们宁可忍受很大的痛苦与不安，而不肯在非同不得已的情况下放弃金钱礼仪上最后剩下的一些小零小碎或最后的门面装点。连最贫困的阶级都是如此，富人阶级当然就不用说了，他们的奢侈消费让人瞠目结舌。比如，一支钢笔可能是用金子做的，但它和普通钢笔虽然价格如此悬殊，在功能上并没有多大差别。


    到底是什么让人们追求一种炫耀性消费？还有，是什么原因让人们认为一个细腰、皮肤白皙的女人是美的？是什么让人认为一个有钱的人是档次很高的？是什么让神的身边总要有些随从，并且这些随从穿的衣服都很光鲜？是什么让猫、狗成为人类的宠物，而猪、鸡则不可能有这种荣幸？是什么让大学要给拥有某种学位的人以某种标志，比如博士服？用我们的话来问：是什么让上流社会的人热衷搞什么沙龙、舞会？是什么让一些根本与生产劳动无关的东西比如插花、调酒成了所谓的“艺术”？


    这一系列现象背后的秘密都不难破译。理解这些现象的一个关键性概念是“歧视性对比”。凡勃伦认为，所谓的“歧视性”是用来形容人与人之间的对比，而这种对比的目的在于按照人们在审美上或道德观念上的相对价值来分等分级，从而确定他们自己所设想的或别人所设想的相对的他们在心理上的自得程度。歧视性对比是对人们的价值的一种评价方式。在这里凡勃伦就羞用“心理竞争”这个概念来表达人们在一个给价值排序的社会中对价值的争夺了。但这种歧视性对比是从哪里来的，凭什么认为一个皮肤白皙的女人价值要高一些，皮肤黑红的女人价值要差一些？又凭什么认为一个有钱有势的人的价值就要高一些，而人们居然梦想成为这样的人？


    凡勃伦认为，这是未开化时代的遗风。人们看到，凡是与直接的生产劳动有沾染的东西，总会引起人们的厌恶感，这既是它不能满足审美上的雅观，同时也因为它是低贱的标志，而在以后的发展中，这两个因素已经合二为一了。


    而非生产性的一切，则因首先对应于未开化时代的“荣誉性”业务，因而总是与“有价值”有关。换言之，在凡勃伦看来，生产业务和非生产业务之间的现代区别方式不过是未开化时代侵占与劳役的区别的变形。


    在未开化时代，“列入侵占一类的业务是可敬的，光荣的，高贵的；而其他不含侵占成分的业务，尤其是含有奴性或屈服意味的那些业务，是不值得尊敬的，低贱的，不体面的”。


    自然，政治、战争、宗教这样的业务总是能给从事者带来价值的论证，而直接从事生产劳动的则毫无价值可言。因此不难理解，从事劳动的妇女和奴隶总是受到歧视。一个自认为有档次的人对妇女和奴隶从事的行为自然深恶痛绝。通过侵占，不从大自然里索取而是从他人那里掠夺，被当成英雄行为认为是美的，这种美学是一种典型的“暴力美学”。而人们因这种行为的掠夺成果赋予其价值，则是对暴力的颂扬。必须承认，对力量的崇拜和对生产劳动的厌恶，是人类的很多价值观和审美观的深层逻辑。一个有钱的人之所以让人羡慕，是因为钱是一种力量的象征，它具备一种支配性；同时，有钱的人必然远离那种劳苦而低贱的生产劳动，他们能够满足人们的美学期待。


    至此已很明显了：拥有金钱等社会稀缺价值资源的人，因其所拥有的东西的支配性而给其带来了某种优势地位，给他进行了价值论证。用凡勃伦的话说，就是金钱在起初只是被看作一种能力的证明，现在则内在地具有了荣誉性。


    这就给人们的心理竞争确定了一个方向，尽力去抢那些被社会奉为价值的东西：凡是与别人作对比时可以占有优势的成就，就是努力的正当目的。如果不能做到这一点，很显然他就会处于心理上的劣势，威胁到他心理上的生存。


    基于此，人们必须对自己的行为赋予道德论证，使其具备足够的合法性，而这反过来又对生产劳动构成了价值上的蔑视和美学上的厌恶感：凡是与生产劳动有所沾染的一切，在价值上总是要比不与生产劳动沾染的低。这种对生产劳动的厌恶渗透于整个社会的价值观念中。一个皮肤白皙的妇女之所以看起来是美的，高贵的，就是因为她身上没有从事直接的生产劳动的痕迹。一只猫、一只狗之所以成为一些人的宠物，也是因为它们不像鸡那样有生产上的实用性。有了对暴力美学的渴望，游戏就可以变换规则玩。


    随着社会的发展，起初的侵占这种已得不到道德支持的野蛮现象消失了，但它所折射出来的那种力量却通过一个似乎公平的游戏规则（比如对财富的追逐已不用暴力掠夺的方式，而是用做生意的方式）时时在召唤着人们。人们抢夺的也不再仅仅局限于金钱权力等东西，而是任何一种可以证明他们有价值的社会物品与社会资源。


    一个人的存在价值总是必须通过外界的反应，或者说通过这个人对外界反应的判断来证明。因此，一个有钱的人，必须让社会上的人看到这一点，这就必须通过炫耀性消费，以及他的“有闲”来展示。这种展示既可以通过自己，也可以通过与自己有附属关系的人，而在凡勃伦看来，后者更有意义。


    一个人炫耀有钱和有闲还不够，要是他的老婆和奴才也能炫耀的话，那就证明他比只能通过自己来展示的人更有钱有势。凡勃伦由此提出了“代理消费”“代理有闲”这两个概念，在他看来，奴才们、没有独立性的妇女们的华丽衣着并不仅仅是为自己而穿，而是为主子而穿，他们只是“代理者”。不难想象，在一个具有等级结构特征的社会中，有力量的上层阶级的价值观念总会辐射到全社会范围内，在软弱无力的贫困阶层身上获得共鸣。有钱和有闲的上层社会的“派头”，会引起下层社会的艳羡，并竞相模仿。因此，炫耀性消费并不仅仅是富人阶层的事，贫困阶层也乐于参与，只不过在消费的程度和标准上有所不同。


    一般来说，像凡勃伦所说的，人们总会与比自己高一层的人相比较。这当然主要不是他们能理性地认识到自己没有能力和最高层的人相比，而是基于这个心理上的原因：比自己高一层的人与自己具有更多的存在属性，即比较的东西，同时又给比较定出了意义，因此如果能超越于他之上的话，就能实实在在证明自己的价值。在全民参与的心理竞争中，消费成为一种主义，一种意识形态，它界定着人们的价值。心理竞争与商品的更新换代相互激化。


    当代社会的炫耀性消费程度，以及“消费者”的“异化”远超出台勃伦的那个时代。心理竞争之惨烈也远远超出了他的想象。由于很多“先天”地标明人的价值和档次的东西，比如血统、门弟都已被打破或不再重要，消费品已等同于存在价值的展示，对它们的消费也陷入疯狂。“时尚”“流行”像魔术一样控制着人们，因为成为“时尚”“流行”的阐述者就意味着自己“存在”的凸显，相反如果不能跟上“时尚”和“流行”的话，则意味着一个人根本就不存在——这就别谈存在的价值了。


    一个人要是穿衣打扮土一点，就意味着他对自己心理劣势的承认，连他对自己都没自信——因为他实在只能通过这一点来证明自己的价值。不能怪人们“狗眼看人低”，因为现代社会就是这么来看待人的。


    而随着社会的急剧变动，它对确定性的消解，心理竞争也进入了一个旋涡之中，一个人必须赶快抓住可抓住之物，并且必须不停地变换可抓住之物才能避免自己存在的虚无化——当你还在用这种物品来满足自己的心理优势的时候，别人已经在用另一种更新也更“高档”的物品来证明他比你有价值了。


    ## 变狠的温床


    尽管人们在心理竞争中的确是通过其拥有什么来证明他的存在，利用物的价值来论证他的价值，但严格来讲，这根本不是他的存在，也不是他的价值，而是物的存在，是社会所赋予的物的价值。


    道理很简单，如果他所拥有的东西没有引人注目和艳羡的品质，也即在社会的感知和评价模式中不存在和没有价值，那这个人就不会让人正眼看他，其在社会的价值排序上也偏低。当年，谁会对梵高的画看一眼？谁会认为他是伟大的画家？而在他死后，又有多少人认为他的画一钱不值，他什么都不是？


    社会的价值观念总是在变化，即，总会有某些东西获得和丧失价值属性。但有些稀缺资源的价值却似乎总是超越时空的，比如权力、金钱。


    前者不必说，在一个存在统治和管理的等级社会里，它具有有一种支配的力量。后者只要人们不退回到原始社会，其支配力也不会丧失。换言之，它们比什么都更能切入一个社会的结构。人们通过炫耀性消费来证明他们的档次，通过对占有什么来证明自己的存在价值，一个前提就是可供来炫耀和占有的东西在社会中是一种力量，进而是价值的证明。


    消费的狂热意味着物品获得和丧失价值属性的进程的加快，也意味着人们证明自己的存在价值的焦虑的加剧。这里需要说的是，消费的异化不太像是弗洛姆和马尔库塞所说的那样是把消费当成了目的，因为消费严格来讲仍是一个手段，它不进入人的心理结构和社会的评价系统，其意义仍无法获得。


    但很显然，一个卷入心理竞争这个热门行当的人，其“自我”更多是“社会自我”，正是由于此他的“存在”无法被自己所体验到，而只能通过他人的目光才能显现出来。故而，一个由心理竞争所主宰的社会，人们的生存方式恰如弗洛姆所说的，是一种占有的生存方式，而不是存在的生存方式。


    弗洛姆对“占有”和“存在”有大量的论述。按他的意思，这两种生存方式意味着它们与世界之间完全迥异的指向；它们意味着两种不同类型的性格结构，各以其优势支配着一个人的所想、所感受、所行动的全部内容。


    占有的生存方式意味着人与世界的关系是占有者与被占有者的关系，人想把一切，包括其自身都变成其占有物。而存在的生存方式意味着生气勃勃和与世界的真实关系，意味着一个人的真实天性，真正的实在性。


    初看起来弗洛姆的这种分类有些武断：我们人类不可能不占有某种东西，比如我们的生活物品。而如果为了维护他的理论认为占有这些生活物品不是“占有”的生存方式，那么又凭什么认为占有更多的生活物品，能占有更多的钱，进行奢侈的享受就是“占有”的生存方式呢？


    问题显然不在于一个人能否占有某种东西（无论这是一种什么样的东西）这个事实，而是人在占有时他与自己和世界的关系，他的心理指向和性格特征。我用我的笔写字，我的笔只是在帮助我的能力的发挥，它并不能评判我的价值。但是，我若是用他来向别人炫耀，我的价值就被剥夺，而由它是否有社会所认为的价值来决定。


    在前一种生存方式中，我是存在的，我不需要去占有一支笔的社会价值属性，我对它的占有只是一种弗洛姆所说的功能性占有；而在后一种生存方式中，我则是占有的，属于弗洛姆所说的性格类型的占有，我无法找到我的存在价值，我必须依靠一支笔的社会价值来证明。


    换言之，是占有还是存在，最关键的是看：我的存在是通过自己的体验，还是通过对某种被我所占有的物品的体验？我的价值是独立于物的，还是转化成了物所代表的社会价值？


    因此，一个具有存在的生活方式的人，并不一定是一个愿意两手空空、一无所有的人，但是，他的确不屑于像许多人那样去炫耀性消费，去用社会的主流价值观念来赋予自己以某种存在价值的论证，他的自我并没有化为社会自我。


    但在一个存在心理竞争的等级社会中，具存在生存方式的人寥寥无几，大街小巷都是“占有狂”。在弗洛姆看来，占有几乎体现在社会的每个角落，体现在人类生活的每个领域。在语言中，比如“我爱”是一种存在的体验方式，而“我有爱”则是一种占有的体验方式——“爱”不再是我的体验，而是我所占有的东西；在学习中，一个死记笔记而去理解的学生只是在企图占有某种知识，而一个理解和思考的学生则是力图将自己的存在与某种知识进行联系；在信仰中，上帝在“占有狂”那儿是一尊偶像，在“存在者”那儿则只是一种内心倾向，一种态度……当然，弗洛姆没有说到，在中国，“人”已被具有社会的价值属性的“身份”取代，每个人似乎都想去占有某种有价值的身份，逃避某种没有价值的身份，比如，介绍一个人，必是“××局长”“××主任”之类。人们既通过这种占有物来体验自己，也通过这种占有物去体验他人。


    占有的来源是匮乏。一个具占有生存方式的人，很少能够与自己的内心进行联系，而且从童年时代开始，就远离“自我”。这既给他带来背叛自我的自我憎恨，也使他将对这种憎恨投向外界。


    而同时，他必须努力把社会自我化为他的自我，只有这样的一个假自我系统才能挽救他的心理生活。但正因为他对社会自我的体验不是他真正的自我体验，占有无法转化为存在，他只能被心理竞争的游戏吞没——他深刻地认同这一点：在心理竞争中，不是存在，而是占有成为取胜的必备杀招。


    这样，“占有”的心理指向不仅决定人感知和理解世界的模式，比如

    '
  mdcn: '

    对心理优势的争夺，这种心理优势对应着一个人社会中的地位、档次、品位等——它们在一个给价值进行排序、使价值呈现等级特征的社会中，说明了这个人的价值。进行心理竞争的目的，就是为了在价值排序上尽力往上攀登。


    弗洛姆曾运用“心理生存”这个概念来说明人类诸多变态行为背后的深层动机。正如人在生理上要活一样，在心理上也必须活，所谓的自尊、面子等，不过就是要谋求心理生存的通俗表达。一旦一个人在比较机制的驱动下在一个比较领域或结构中被证明自己没有能力、地位、金钱、品位、礼貌等，他的存在价值就会遭到否定，他就有一种强烈的挫败感，在心理上就很难生存。


    人们之所以要在心理竞争中获取心理优势，就是因为心理劣势的处境将让人不堪承受。故而，人生下来，就像是被投入了一场在他人面前显示自己有价值，至少也是在和比自己更惨的人相比有价值的战斗中。在很多时候，除非他在心理上能成功地制造幻觉，才能确认自己的价值，否则这种价值必须通过外在的证明，即通过社会物品、社会资源的占有与他人进行比较。


    人的社会行为的背后可以找到心理上的动机，但心理上的动机来自何方？它只是一套生而具有的“本能装置”吗？如果“本能”不是在生物学的意义上，而是在哲学层面上，即在人的存在本体论层面上的“存在性冲动”来理解，那么这种表达不算是种谬误。很多不能承受生活中的痛苦的人都对猪艳羡不已，一个重要的原因就是猪没有那种感受痛苦的意识机制。它的存在是是世界自在地同一的，其存在结构已被嵌进了世界的存在中，它就是世界中的一部分。这是一种已被规定好了的存在，其“存在性冲动”只是生物本能。所以，其痛苦只是生理上的痛苦，而谈不上有“心理上的痛苦”。


    而人则不一样，一方面他是动物，逃避不了生物本能的主宰，但另一方面，他又有意识，对世界具有一种超越性和反思性，即他不仅仅是世界的一部分，同时世界也是他的对象，世界也会成为其存在的一部分。这使得其存在挣脱了那种与世界的自在同一，摆脱了被规定的命运。用一个比喻来说，人的存在在世界上的位置，介于动物和神仙之间，他摆脱了动物的被规定性，但其意识上的超越性根本不能导致他在生理结构上摆脱动物性而达到神仙的那种超越性。他从动物状态出发，向神仙的存在进军，但永远到达不了神仙居住的地方。因此，他既摆脱了与世界的自在同一，也根本不可能达到与世界的和谐统一，他只是一个弗洛姆、舍勒等人所说的“宇宙的畸形儿”。


    这样的一个“宇宙畸形儿”的存在最大的一个本体论特征就是存在意识的分裂——即“自我意识”与“对象意识”的分裂。这种分裂预先决定了人对“自我”的确认离不开一个外在的对象：人对“我”的意识。


    即使不是通过与外界的对比，也是通过外界所提供的诸多材料、信息、符号参照来进行。猪与世界的存在合二为一，它只是世界的一部分，不是“主体”，没有“主体一客体”这一结构，而人的存在结构却具有鲜明的“主客二元结构”的特征。即，他的存在依赖于一种对自身的确认并指向外界。这是一种弗洛姆所说的“方向性结构”：没有一个方向，人就会找不着北。当人因其“自我意识”和“对象意识”的出现而被从世界中剥离后，其存在就丧失了确定性和附着感，他只有依赖于“主客二元结构”才能将自身与世界联系起来。在这种联系中，“主客二元结构”被加以秩序化，形成人独有的“存在性冲动”。


    因此，“宇宙畸形儿”的命运决定了人的很多植根于存在性命运而非生物本能的心理反应机制。人承受无尽的孤独和恐惧，迫使他出现类似于心理上的“退行”的“逃避自由”的现象，尽力想让自己融入群体之中，使自己化为世界的一部分，从而摆脱威胁；或者尽力用意识将世界吞没，使世界化为自身的一部分——这两种方式在表面上都可以克服人与世界的分裂。这是受虐和施虐的最原始的“存在性冲动”。而主客二元结构决定了人对其存在的确认离不开外界，即除非是在一个人已经“无我”（像出家那样），也即已消失了“主体”而解构了这一“主客二元结构”的情况下，才有可能摆脱外界的制约和影响。大多数人做不到这一点，惯常的方法就是加剧主客的对峙，使“主客二元结构”恶化为“主客二元对立结构”，通过主客的对立而凸显“我”的存在。


    尽力在这个世界上证明自己的“存在”，构成了人的一种最深远也最强大的内驱力。人对死亡的恐惧实际上是一个有自我意识的生命体对于虚无化的恐惧的一种最深刻的反应。人对虚无化的反应还有很多，比如害怕别人对自己的忽略。


    而作为“社会人”，他不仅要证明自己的存在，还要证明这种存在是有价值的，否则他在心理上就很难生存。而我们知道，一个人对自己的存在的论证离不开一个“主客二元结构”，因此在社会中，绝大多数人对其存在价值的论证，也即维护心理生存的方式都带有人际联系和人际比较的色彩，即严重依赖于他与人发生的关系。而对一个人的存在的把握，在绝大多数人的思维方式中，在社会所给予的认知模式中，只有通过对他的存在属性的把握才可能实现。


    因此，存在分解为一系列存在属性，一个人的存在就是性别、年龄、职务、民族、国籍、信仰、地位等一系列东西的总和。这样，存在是否有价值就体现为存在属性在一个给价值进行分等分级的社会中的价值判定。一个人对其存在价值的论证，也就是对他是否拥有对应于其存在属性的社会物品和社会价值资源的证明。争夺“存在价值”就表现为人与人之间的竞争，也就表现为实质上是一种对权力、地位、金钱等的竞争。一个人炫耀自己有这些东西，也等于证明自己比别人更有档次，更有价值。不再是人自己，而是人所拥有的东西，决定了人的价值。


    ## 砸牌坊的人


    人类社会从古至今，牌坊无处不在。一个压榨人民的政府，可以自称为“民主政府”；一种奴役人的意识形态，大言炎炎是人的“解放”的“理论武器”；“自由”这个词被抽掉具体的所指，把贵族们的自由说成是所有人，包括受贵族们支配和掠夺的人的自由；一个人对金钱、权力等具有神经症患者般的迷恋，却把对它的追逐说成是“实现自我价值”；一个人对他人具有一种施虐倾向，却以对他人“爱护”和“关心”的样子出现；一个人分明是想利用流行的衣着打扮来引人注目，论证其价值，却硬说这是对美的追求，是一种似乎很高雅的时尚……


    有牌坊存在，当然就有砸牌坊的人。从逻辑上梳理，从心理上分析，是砸牌坊的两种主要方式。


    一般来说，倾向批判的知识分子喜欢砸牌坊，而标榜科学的实证研究的学者似乎兴趣不大。很有趣的是，在经济学家中，托斯丹·本德·凡勃伦是个难得一见的砸牌坊的人。或许是有所忌惮，他在抡起大锤朝“有闲阶级”的奢侈消费砸过去的时候，不忘了说一句：我不是在砸牌坊，我只是在陈述事实。的确，他是在陈述事实。其实砸牌坊的人，不过是把会让一些人受不了的真相揭示出来而已。


    人类社会有很多东西表面上看起来是正常的。人要生活，就要消费，有了钱就要想尽办法消费好的物品，追求“更高一层享受”，这看起来并没有什么不正常，正有人总想抢夺权力、金钱，往上爬一样。然而，这种“正常”至少也要在人们的消费不超过他们的消费能力的前提下才能得到证明，也即消费的确只是为了满足人们的“正常需要”本身。而如果一个穷人哪怕少吃饭也要穿得好一些，这就很有探究的必要了，证明消费已远离“正常需要”，人们所消费的实际已不是商品的使用价值，而是它的社会价值，也就是说，它已脱离经济学范畴而进入社会心理学领域。


    这种行为可以看出受占支配地位的某种社会心理所影响，这背后一定隐藏着什么深刻的心理动机。在凡勃伦的那个时代，他观察到：在社会上没有个阶级——甚至极度贫困的也不例外——对惯常的明显消费完全断念。这些人除非处于直接需要的压迫之下，否则对于消费的这一范畴的最后一点一滴是不会放弃的。人们宁可忍受很大的痛苦与不安，而不肯在非同不得已的情况下放弃金钱礼仪上最后剩下的一些小零小碎或最后的门面装点。连最贫困的阶级都是如此，富人阶级当然就不用说了，他们的奢侈消费让人瞠目结舌。比如，一支钢笔可能是用金子做的，但它和普通钢笔虽然价格如此悬殊，在功能上并没有多大差别。


    到底是什么让人们追求一种炫耀性消费？还有，是什么原因让人们认为一个细腰、皮肤白皙的女人是美的？是什么让人认为一个有钱的人是档次很高的？是什么让神的身边总要有些随从，并且这些随从穿的衣服都很光鲜？是什么让猫、狗成为人类的宠物，而猪、鸡则不可能有这种荣幸？是什么让大学要给拥有某种学位的人以某种标志，比如博士服？用我们的话来问：是什么让上流社会的人热衷搞什么沙龙、舞会？是什么让一些根本与生产劳动无关的东西比如插花、调酒成了所谓的“艺术”？


    这一系列现象背后的秘密都不难破译。理解这些现象的一个关键性概念是“歧视性对比”。凡勃伦认为，所谓的“歧视性”是用来形容人与人之间的对比，而这种对比的目的在于按照人们在审美上或道德观念上的相对价值来分等分级，从而确定他们自己所设想的或别人所设想的相对的他们在心理上的自得程度。歧视性对比是对人们的价值的一种评价方式。在这里凡勃伦就羞用“心理竞争”这个概念来表达人们在一个给价值排序的社会中对价值的争夺了。但这种歧视性对比是从哪里来的，凭什么认为一个皮肤白皙的女人价值要高一些，皮肤黑红的女人价值要差一些？又凭什么认为一个有钱有势的人的价值就要高一些，而人们居然梦想成为这样的人？


    凡勃伦认为，这是未开化时代的遗风。人们看到，凡是与直接的生产劳动有沾染的东西，总会引起人们的厌恶感，这既是它不能满足审美上的雅观，同时也因为它是低贱的标志，而在以后的发展中，这两个因素已经合二为一了。


    而非生产性的一切，则因首先对应于未开化时代的“荣誉性”业务，因而总是与“有价值”有关。换言之，在凡勃伦看来，生产业务和非生产业务之间的现代区别方式不过是未开化时代侵占与劳役的区别的变形。


    在未开化时代，“列入侵占一类的业务是可敬的，光荣的，高贵的；而其他不含侵占成分的业务，尤其是含有奴性或屈服意味的那些业务，是不值得尊敬的，低贱的，不体面的”。


    自然，政治、战争、宗教这样的业务总是能给从事者带来价值的论证，而直接从事生产劳动的则毫无价值可言。因此不难理解，从事劳动的妇女和奴隶总是受到歧视。一个自认为有档次的人对妇女和奴隶从事的行为自然深恶痛绝。通过侵占，不从大自然里索取而是从他人那里掠夺，被当成英雄行为认为是美的，这种美学是一种典型的“暴力美学”。而人们因这种行为的掠夺成果赋予其价值，则是对暴力的颂扬。必须承认，对力量的崇拜和对生产劳动的厌恶，是人类的很多价值观和审美观的深层逻辑。一个有钱的人之所以让人羡慕，是因为钱是一种力量的象征，它具备一种支配性；同时，有钱的人必然远离那种劳苦而低贱的生产劳动，他们能够满足人们的美学期待。


    至此已很明显了：拥有金钱等社会稀缺价值资源的人，因其所拥有的东西的支配性而给其带来了某种优势地位，给他进行了价值论证。用凡勃伦的话说，就是金钱在起初只是被看作一种能力的证明，现在则内在地具有了荣誉性。


    这就给人们的心理竞争确定了一个方向，尽力去抢那些被社会奉为价值的东西：凡是与别人作对比时可以占有优势的成就，就是努力的正当目的。如果不能做到这一点，很显然他就会处于心理上的劣势，威胁到他心理上的生存。


    基于此，人们必须对自己的行为赋予道德论证，使其具备足够的合法性，而这反过来又对生产劳动构成了价值上的蔑视和美学上的厌恶感：凡是与生产劳动有所沾染的一切，在价值上总是要比不与生产劳动沾染的低。这种对生产劳动的厌恶渗透于整个社会的价值观念中。一个皮肤白皙的妇女之所以看起来是美的，高贵的，就是因为她身上没有从事直接的生产劳动的痕迹。一只猫、一只狗之所以成为一些人的宠物，也是因为它们不像鸡那样有生产上的实用性。有了对暴力美学的渴望，游戏就可以变换规则玩。


    随着社会的发展，起初的侵占这种已得不到道德支持的野蛮现象消失了，但它所折射出来的那种力量却通过一个似乎公平的游戏规则（比如对财富的追逐已不用暴力掠夺的方式，而是用做生意的方式）时时在召唤着人们。人们抢夺的也不再仅仅局限于金钱权力等东西，而是任何一种可以证明他们有价值的社会物品与社会资源。


    一个人的存在价值总是必须通过外界的反应，或者说通过这个人对外界反应的判断来证明。因此，一个有钱的人，必须让社会上的人看到这一点，这就必须通过炫耀性消费，以及他的“有闲”来展示。这种展示既可以通过自己，也可以通过与自己有附属关系的人，而在凡勃伦看来，后者更有意义。


    一个人炫耀有钱和有闲还不够，要是他的老婆和奴才也能炫耀的话，那就证明他比只能通过自己来展示的人更有钱有势。凡勃伦由此提出了“代理消费”“代理有闲”这两个概念，在他看来，奴才们、没有独立性的妇女们的华丽衣着并不仅仅是为自己而穿，而是为主子而穿，他们只是“代理者”。不难想象，在一个具有等级结构特征的社会中，有力量的上层阶级的价值观念总会辐射到全社会范围内，在软弱无力的贫困阶层身上获得共鸣。有钱和有闲的上层社会的“派头”，会引起下层社会的艳羡，并竞相模仿。因此，炫耀性消费并不仅仅是富人阶层的事，贫困阶层也乐于参与，只不过在消费的程度和标准上有所不同。


    一般来说，像凡勃伦所说的，人们总会与比自己高一层的人相比较。这当然主要不是他们能理性地认识到自己没有能力和最高层的人相比，而是基于这个心理上的原因：比自己高一层的人与自己具有更多的存在属性，即比较的东西，同时又给比较定出了意义，因此如果能超越于他之上的话，就能实实在在证明自己的价值。在全民参与的心理竞争中，消费成为一种主义，一种意识形态，它界定着人们的价值。心理竞争与商品的更新换代相互激化。


    当代社会的炫耀性消费程度，以及“消费者”的“异化”远超出台勃伦的那个时代。心理竞争之惨烈也远远超出了他的想象。由于很多“先天”地标明人的价值和档次的东西，比如血统、门弟都已被打破或不再重要，消费品已等同于存在价值的展示，对它们的消费也陷入疯狂。“时尚”“流行”像魔术一样控制着人们，因为成为“时尚”“流行”的阐述者就意味着自己“存在”的凸显，相反如果不能跟上“时尚”和“流行”的话，则意味着一个人根本就不存在——这就别谈存在的价值了。


    一个人要是穿衣打扮土一点，就意味着他对自己心理劣势的承认，连他对自己都没自信——因为他实在只能通过这一点来证明自己的价值。不能怪人们“狗眼看人低”，因为现代社会就是这么来看待人的。


    而随着社会的急剧变动，它对确定性的消解，心理竞争也进入了一个旋涡之中，一个人必须赶快抓住可抓住之物，并且必须不停地变换可抓住之物才能避免自己存在的虚无化——当你还在用这种物品来满足自己的心理优势的时候，别人已经在用另一种更新也更“高档”的物品来证明他比你有价值了。


    ## 变狠的温床


    尽管人们在心理竞争中的确是通过其拥有什么来证明他的存在，利用物的价值来论证他的价值，但严格来讲，这根本不是他的存在，也不是他的价值，而是物的存在，是社会所赋予的物的价值。


    道理很简单，如果他所拥有的东西没有引人注目和艳羡的品质，也即在社会的感知和评价模式中不存在和没有价值，那这个人就不会让人正眼看他，其在社会的价值排序上也偏低。当年，谁会对梵高的画看一眼？谁会认为他是伟大的画家？而在他死后，又有多少人认为他的画一钱不值，他什么都不是？


    社会的价值观念总是在变化，即，总会有某些东西获得和丧失价值属性。但有些稀缺资源的价值却似乎总是超越时空的，比如权力、金钱。


    前者不必说，在一个存在统治和管理的等级社会里，它具有有一种支配的力量。后者只要人们不退回到原始社会，其支配力也不会丧失。换言之，它们比什么都更能切入一个社会的结构。人们通过炫耀性消费来证明他们的档次，通过对占有什么来证明自己的存在价值，一个前提就是可供来炫耀和占有的东西在社会中是一种力量，进而是价值的证明。


    消费的狂热意味着物品获得和丧失价值属性的进程的加快，也意味着人们证明自己的存在价值的焦虑的加剧。这里需要说的是，消费的异化不太像是弗洛姆和马尔库塞所说的那样是把消费当成了目的，因为消费严格来讲仍是一个手段，它不进入人的心理结构和社会的评价系统，其意义仍无法获得。


    但很显然，一个卷入心理竞争这个热门行当的人，其“自我”更多是“社会自我”，正是由于此他的“存在”无法被自己所体验到，而只能通过他人的目光才能显现出来。故而，一个由心理竞争所主宰的社会，人们的生存方式恰如弗洛姆所说的，是一种占有的生存方式，而不是存在的生存方式。


    弗洛姆对“占有”和“存在”有大量的论述。按他的意思，这两种生存方式意味着它们与世界之间完全迥异的指向；它们意味着两种不同类型的性格结构，各以其优势支配着一个人的所想、所感受、所行动的全部内容。


    占有的生存方式意味着人与世界的关系是占有者与被占有者的关系，人想把一切，包括其自身都变成其占有物。而存在的生存方式意味着生气勃勃和与世界的真实关系，意味着一个人的真实天性，真正的实在性。


    初看起来弗洛姆的这种分类有些武断：我们人类不可能不占有某种东西，比如我们的生活物品。而如果为了维护他的理论认为占有这些生活物品不是“占有”的生存方式，那么又凭什么认为占有更多的生活物品，能占有更多的钱，进行奢侈的享受就是“占有”的生存方式呢？


    问题显然不在于一个人能否占有某种东西（无论这是一种什么样的东西）这个事实，而是人在占有时他与自己和世界的关系，他的心理指向和性格特征。我用我的笔写字，我的笔只是在帮助我的能力的发挥，它并不能评判我的价值。但是，我若是用他来向别人炫耀，我的价值就被剥夺，而由它是否有社会所认为的价值来决定。


    在前一种生存方式中，我是存在的，我不需要去占有一支笔的社会价值属性，我对它的占有只是一种弗洛姆所说的功能性占有；而在后一种生存方式中，我则是占有的，属于弗洛姆所说的性格类型的占有，我无法找到我的存在价值，我必须依靠一支笔的社会价值来证明。


    换言之，是占有还是存在，最关键的是看：我的存在是通过自己的体验，还是通过对某种被我所占有的物品的体验？我的价值是独立于物的，还是转化成了物所代表的社会价值？


    因此，一个具有存在的生活方式的人，并不一定是一个愿意两手空空、一无所有的人，但是，他的确不屑于像许多人那样去炫耀性消费，去用社会的主流价值观念来赋予自己以某种存在价值的论证，他的自我并没有化为社会自我。


    但在一个存在心理竞争的等级社会中，具存在生存方式的人寥寥无几，大街小巷都是“占有狂”。在弗洛姆看来，占有几乎体现在社会的每个角落，体现在人类生活的每个领域。在语言中，比如“我爱”是一种存在的体验方式，而“我有爱”则是一种占有的体验方式——“爱”不再是我的体验，而是我所占有的东西；在学习中，一个死记笔记而去理解的学生只是在企图占有某种知识，而一个理解和思考的学生则是力图将自己的存在与某种知识进行联系；在信仰中，上帝在“占有狂”那儿是一尊偶像，在“存在者”那儿则只是一种内心倾向，一种态度……当然，弗洛姆没有说到，在中国，“人”已被具有社会的价值属性的“身份”取代，每个人似乎都想去占有某种有价值的身份，逃避某种没有价值的身份，比如，介绍一个人，必是“××局长”“××主任”之类。人们既通过这种占有物来体验自己，也通过这种占有物去体验他人。


    占有的来源是匮乏。一个具占有生存方式的人，很少能够与自己的内心进行联系，而且从童年时代开始，就远离“自我”。这既给他带来背叛自我的自我憎恨，也使他将对这种憎恨投向外界。


    而同时，他必须努力把社会自我化为他的自我，只有这样的一个假自我系统才能挽救他的心理生活。但正因为他对社会自我的体验不是他真正的自我体验，占有无法转化为存在，他只能被心理竞争的游戏吞没——他深刻地认同这一点：在心理竞争中，不是存在，而是占有成为取胜的必备杀招。


    这样，“占有”的心理指向不仅决定人感知和理解世界的模式，比如

    '
