    # ◇ 一个害羞、偏执、完美主义的普通生


    知道了林某在心理上是什么人后，我们来还原一下他一路走过来的心理过程。


    尽管无法知道林某小时候的情况，但从媒体只言片语的披露中，我看到，在中学时候，他的自卑型性格已经非常明显：沉默、害羞、认真、偏执、完美主义。


    这类人，处理不好和人的关系。他们在需要用头脑去思考的世界面前游刃有余，但在需要用心理去面对的人面前，感到拘谨和不适应。


    据林某一个同学向媒体爆料，林在高中时，有一次进行一分钟的英语演讲，他“站在讲台上，身姿很不自然，声音越来越小，甚至听不清，有时不自觉地就转过身，面对黑板”。这完全可信。


    好在中学时代，一个学生除了学习，不需要想得多。自卑的性格，可能会因为别人的父母有身份或有钱而被激活成心理、情绪上的自卑，但不会形成严重的问题，学习好带来的巨大荣耀，可以弥补林某在家境好的同学面前的心理劣势。


    在这里要解释一下，什么叫性格上的自卑，什么又叫心理、情绪上的自卑。


    性格上的自卑位于人的心理结构的深层，是对抽象世界的自卑，它驱动一个人，但很难被体验到。我们体验到的自卑，是心理上（一直郁积的自卑）、情绪上的自卑（瞬间涌上又消失的自卑），就是一个具体的人、一个具体的事件、某个情境刺激到了我们——或者把性格里的自卑呼唤出来，或者和性格无关，是一个屈服于社会价值排序的人和别人进行心理竞争的结果，就是我们面对具体的人或人群感到自卑。






    ![](img/f0502657e0e411adb97ccb25c15a5fc1_30_0.png)'
  - '[PAGE 31]


    现实激活了自卑


    大学远比中学复杂得多，游戏规则也不一样，因此，一个人所处的心理情境当然也不一样。


    进入大学，林某遇到的第一个挑战，一定是优越感的失去：有那么多在考试上不逊色于自己的人站在面前，中学的优越感不复存在。而因为他爸不是“李刚”，所以“李刚”的儿子足以在心理上压倒他。


    他在日记里写道：“我在本科以前一直也有这么一种自卑的身份心理，每次听说谁谁谁的父母是什么医生、大官的，我就会内心小羡慕一番。”本科以前肯定只是小羡慕而已，而本科时，则不可能只是这样了。我可以断定，林某肯定有过对父母为何不是李刚的怨恨，但罪恶感马上又掐灭了他的想法。后来，他说服母亲不再收废品，还把两万块钱交给了母亲，并不仅仅是道德意义上的孝顺，还有弥补罪恶感的动机。


    现实激活了自卑，问题就来了，一个在心理上很难活下去，心理保护因此启动。我们可以看到林某采取的心理保护有五种模式。除了前面讲的心理保护模式 A 和 B，还有心理保护模式
    C：对家乡眷恋；心理保护模式 D：发泄；心理保护模式 E：自嘲。


    A 没有取得成功（这一模式本身就不会成功），这是因为他得和人交往，同时他是一个男人，还想谈恋爱。结果，正是在谈恋爱上，他自尊心受到了伤害。


    B 则取得了成功。他成为一个学习极为优秀而且有科研能力的人。而这一，一直是支撑他那么多年来保持心理优势的拐杖。


    C 没有取得成功。它是心理分析上讲的“退行”。儿时的故乡，给我们足够的安全感和世界一体感，所以，我们在心理上想重返故乡。但当我们长大时，儿时的故乡早不在了。我们会失望地发现它早不是我们心'
  - '[PAGE 32]


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_32_0.png)


    世界越来越狠，但完全可以战胜


    理的避难所。林某就是这种情况。


    D 同样也没有取得成功。发泄确实是把郁积的心理情绪排出去，是自我疗伤的一个好办法，但那是在论坛，不是在一个现实的环境里，否则就意味着自我暴露，把自己放在别人的枪口下。


    E 更不成功。自嘲其实是在心理上对自己耍赖：先踩自己，以避免别人来踩自己。这在精神上先灭了自己。


    尽管只有 B 成功，但已经可以让林某的心理问题拖到以后来解决了。


    # ### ◆ 我已经够惨了，不要惹我


    没有人能够读懂，他在这个时候，已经和世界签订了一个心理契约：


    > 我已经够惨的了，不要再来惹我！从此他带着这样的心理背景来和世界打交道。


