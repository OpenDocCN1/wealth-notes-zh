    # 第4章


    # 狠角色的后台


    ## 16. 狠角色的隔代接班人


    权责、富豪阶层（或自认为非平民阶层）的装 13 在现在的中国是如何培养一个狠人的？


    有些狠角色是父母培养的，而在这背后，还有更深的背景。


    - 比如药家鑫，比如歌唱家李某某之子“轮流发生性关系”。

    - 李父曾经说，儿子是国家的，舍不得打。


    这虽然很装 13，但也诚实，绝不把自己及自己的儿子混同于没有“国家”罩着的屌丝们。我想说，装 13，恰恰是中国所谓“上流社会”（或自称上流社会）的一种本能。


    装 13 背后潜藏着暴力。


    李某某的斑斑劣迹，总是让我想起药家鑫。一样的有一个体制内的爸，一样的从小就被父母训练去学音乐艺术，一样的有一双会弹钢琴的手，出了事后，一样的有上流社会的人帮腔袒护。区别只在于，药家鑫残忍地杀了人，而李某某只是开宝马打人、轮奸。


    但他们对社会的祸害只是五十步笑百步。


    按照一般人的想法，从小就受音乐艺术“熏陶”，这是多么高雅和文明啊，几乎无法和打人、轮奸这类事情联系起来。我只能说，这很无知。


    先问一下，音乐艺术之类是用来干吗的？是用来装 13 的，还是用来陶冶人的心灵的？


    很清楚，很多音乐艺术如果出自天然，就像很多贫困地区的“原生态”唱法那样，对于人的心灵是有所改善的，因为它本身就是让人和自己的存在相遇。但唱民族美声唱法，弹钢琴之类是什么玩意？那只是一种技艺，一种上流社会的装
    13，和人的心灵没什么关系。


    更何况，在现在的中国，体制内的所谓音乐艺术还不仅仅是装文明 13。


    在两种情况下，音乐艺术类玩意不仅改善不了人的心灵，反而对心灵是一种破坏。


    一种情况是，以“艺术”的名义，在家庭或上层社会鄙视底层的风气下，赋予弹钢琴之类玩意以高档的地位，由此形成对下层社会的心理优势，从而把弹钢琴者变成一个高级势利的俗货，一个只对阿猫阿狗有爱心却对底层屁民冷漠之极的装
    13 者。不独药家鑫、李天一，这类人在当今中国的上流社会，以及小资白领阶层中比比皆是。


    另一种情况是，家庭和阶层教育，构成了对弹钢琴者的心灵的破坏。无论看起来多么风光，但我能够想象到李某某的心理痛苦。从一开始，他的人生就不是在由自己决定，而是由他的父母，他所在的阶层的风气决定。李双江确实给了李某某
    “正面” 的东西，但这些东西无论是否装 13，都是强行灌输给李某某的，即把暴力的种子种进了李某某的心理结构深处。另外，体制内的优越感，这个体制对下层的剥夺和鄙视，一并把暴力渗进了李某某的生命里。


    一个人在心理上受到破坏，一定会对自己或外界进行攻击，这是心理铁律。以李某某的家庭氛围和阶层氛围，已经明确地建立了对臣民的心理优势，当然不会对他的自我进行攻击，而是对外，对更弱者。


    可以说，体制对权力者的溺爱，和李爹对儿子的溺爱、上流社会对自己子女的溺爱是一体两面。他们稳固自己的权力、利益、身份和对平民的心理优势，但让自己的子女延续、加剧对平民的祸害。


    只是，这造成了两个后果：


    - A. 虚伪传递到下一代，使下一代很难面对自己的内心，因此心灵容易被破坏。

    - B. 老年得子之人，几乎都有一种近乎变态的溺爱，这加剧了对孩子心灵破坏的程度。


    这里的心理很简单：一个人年老了，死亡恐惧日益逼近，生命的意义逐渐丧失，而有了一个小孩，尤其还是年轻老婆生的，则在和别人的对比中，在和自己过去的对比中，恍然有了年轻的感觉，生命似乎有了格外的意义。这对于老去、死去焦虑的治疗，比装嫩的心理效果好得太多了。而为了抓住这种感觉，就必须在心理上把自己和子女绑定，把自己的很多想法投注到子女那儿，对其包容溺爱。总之，要在心理上构成两位一体。


    一个普遍的心理规律是：对子女溺爱，几乎就是在培养一个人渣。不同的只是，平民对子女的溺爱只能自食其果，让子女埋怨为什么他爸不是李刚而是你，甚至恨你，成为家庭的祸害；而上流社会对子女的溺爱，则是在祸害平民。


    无论何种溺爱，结果无一例外，都是在培养子女在社会价值排序上和别人的对比，培养子女的自私、自大、冷酷无情。他会认为任何人都欠他的，如果他的要求得不到满足，就会对弱者（父母或他人）下手。


    我们来看两个版本。


    - A. 平民的版本：当一个人对小孩溺爱时，在他心理上会发生什么？发生的是：“你们对我好是理所当然的，而如果不能满足我的要求，让我混得比别人惨，你们就对不起我，我会恨你们，我要报复！”极端的情况是：“为什么别人的爸是李刚，而你不是？”


    这样的孩子在和别人的比较中受挫时，会归罪于父母的没出息，会恨父母让自己的存在如此耻辱。他挑战不了强者，但父母的窝囊却是他下手的对象。


    - B. 权贵富人阶层的版本：当一个人对子女溺爱时，在子女心理上发生的是：“好啊，你让我觉得我多么牛 13，多么伟大，我想要什么都可以，想做什么都可以。而且，你还可以罩着我，我还有什么可怕的呢？”


    按这个逻辑一推，他在家里是老大，也要在外面耍威风才能爽。父母和背后的东西，是支撑他要威风的一切，是他强大的后台，他当然不会去挑战，而是去对那些可以让他有心理优势的东西下手。


    ## 17. 分赃游戏的公平，并无法改变它是一场分赃游戏


    我们不是为了破坏体制，也没有能力破坏体制，我们只是为了给自己找一条出路。


    和药家鑫、李某某不一样，档次更高的变狼是在暗处的。


    针对各种“官二代世袭”，我想说，别表示震惊了，我们不是外交部。看清楚为什么“官二代”集体世袭，也许更为重要。


    毫无疑问，当一个“官二代”在考公务员的名义下被安排进体制内，或是在官场里被安排当官，在某些程序上“犯规”的话，肯定会违背我们的道德直觉，我们会感觉受到伤害。


    但是，那又怎么样呢？


    假如换一个平民子弟挤进去，或是被安排当官（注意，在既有体制下，首先是组织的“安排”，其次才是你被“当选”！），民众被吃的命运，就能得到改变么？


    不错，“官二代”世袭公务员职位或官位，如果程序不正当的话，就挤掉了平民子弟考公务员的机会和体制内其他人的上升空间，机会根本就不公平。但是，这只是利益集团的某个位置，归根结底是拿给了谁坐的问题。


    请问，对于无法挤进体制内改变命运的平民百姓来说，谁当公务员，谁被安排当官，有区别么？


    说实话，我真看不出区别在哪儿。


    世界越来越狠，但完全可以战胜


    我们的愤怒确实是真的。但如果要给这种愤怒泼一下冷水，那就是，我们只是在愤怒成为狼的机会不公平而已！


    我不认为这种愤怒有什么伟大的。它最好的结果无非是成为狼的机会公平些，让羊也有一个狼亲戚，但绝大多数的羊仍然是被吃定了！


    分赃游戏的公平，并无法改变它是一场分赃游戏。


    ## 18. 变狼的世界里，人们总会有“被迫害妄想”


    被迫害狂坚信自己受到迫害、欺骗、跟踪、下毒、诽谤或阴谋对待等，往往会变得极度谨慎和处处防备，小小的轻侮可能就被放大，变成妄想的中心，时常将相关的人纳入自己妄想的世界中。这种人自己总认为有个别人或个别团伙要加害于他，每天都感到痛苦不堪。他抓住一些极为脆弱的事实充当蓄意谋害他的证据，这种情绪逐渐蔓延到他的生活，迫使他做出荒谬的举动，甚至是产生杀人的冲动。


    当某些“官二代”“富二代”“军二代”“星二代”祸害平民时，要别人不愤怒是不可能的。


    不仅愤怒，还有戾气。


    我清楚地看到了一种心态：被迫害妄想。上层社会的人有，底层也有。


    被迫害妄想最集中的体现，是厦门陈水总纵火案。明明死的就是平民，但网络上无数人居然同情陈水总，因为他在没有活路后反抗了，好像他受到了政府和社会的迫害。


    这些人好像看不到相关事实：46条无辜生命被残忍剥夺，纵火者有性格缺陷，他并不是无法依赖自己或国家而活下去。


    为什么现在无论既得利益集团，还是利益被剥夺的中下层社会，都有被迫害妄想？


    对于既得利益集团来说，他们的被迫害妄想有特定的内容，担心被“清算”，被“打土豪分田地”。此前他们对中下层的剥夺，在积累起来的社会情绪中，引发了自身的恐惧。作为可能被“清算”的神经过敏的预先防御，被迫害妄想就是治疗恐惧的药方。它还具有另一功能：固化既得利益集团对中下层的恨以及由他们所主宰的剥夺秩序。


    利益被剥夺的中下层所产生的“被迫害妄想”，内容和功能恰恰相反。


    这种“被迫害妄想”的背景就是实际的“迫害”，诸如强拆、限制上访者的人身自由、贪腐、权力资本的掠夺、机会不平等，等等。作为“公共经验”，中国人已经非常熟悉。在这个背景下，中下层会产生一种被剥夺、被伤害、看不到希望又反抗不了的感觉。为了在心理上防止受到伤害或再受到伤害，把与自己生活处境所对应的责任给推出去，以及获得有正义感支撑的道德优势，人们就会强迫自己产生“被迫害妄想”。它相当于一种另类的“弱者的武器”。


    ## 19. 政府最先变狠


    一切好像又要扯到改革的问题，扯到政府该怎么干的问题了。

    最关键的是，政府不能变狠。就是说，要进行正确的定位，回归职能。


    ### ◇ 谁愿意掏钱去请一个人来强制自己呢？


    改革说穿了，无非就是要“政府的归政府，市场的归市场，社会的归社会，个人的归个人”。但30多年了，时至今日，在政府权力的越位下，摆在我们面前的，仍是一个脆弱的市场、一个深度分裂的社会、一个原子式却又容易被情绪聚合在一起的个人。


    能否真把政府权力“关进制度的笼子里”，是对新一届执政高层、新一届政府的严峻考验，也是显示他们政治诚意的试金石。其中的政府机构改革、行政审批改革、社会管理改革等，无一不指向对政府角色的重新定位，对政府权力边界的清晰划分。


    政府并不是一种自然的存在，是人为为了某种目的成立的，因此它的存在是否合理，需要通过做了什么和不做什么来进行评估。它不是公司，不是强盗团伙，不是协会组织，不是公民个体，其边界划分，决定了它的定位。越界，只能引起功能紊乱，作为一种“必要的恶”，也许就没那么必要了。


    作为行使公共权力的机构，政府的功能说来很简单，人们要成立它，委托它来干什么？


    很显然，除非有病，没有谁会去委托一个拥有强制力的人来不准自己这样做那样做，强迫自己这样做那样做。同时，也没有谁去委托一个


