    这样，这种心理竞争的游戏原则上可以在很多领域展开，并且不排斥任何人。大家都有了“共识”，都“同意”这个游戏规则。尽管谁都知道能够享有稀缺资源的人只是极少数，但似乎大家都有机会。在这样的游戏规则中，失败者能怪谁呢？他又如何能怪“市场规律”呢？


    可以看到，仅仅从心理竞争的角度考察，前现代社会和专制社会也不可能不被冲垮。任何一个社会的制度从长远来讲都很难与心理竞争的强大动力对着干，它必须利用一个公平的形式来引导人们的心理能量，使其不朝自己发泄。


    既然心理竞争是全民性的，那么，稀缺资源从逻辑上讲也应该破除垄断，至少在某种程度上，它应该有一个允许下层人士通过某种形式流动到上层，获得某些稀缺资源的形式和通道——这样，心理竞争才不致固化成一个上层社会对下层社会进行单向侮辱而使下层社会将耻辱归于上层社会和制度的游戏。无可怀疑，在人们的心理和精神问题频发的现代社会，心理上的风险非常容易转化为社会的风险，这对社会公平提出了更高的要求。


    心理竞争不仅可以冲垮与其动力机制对立的社会制度，而且还能让某种试图与其对着干的经济体制“改邪归正”。所谓的“社会主义计划经济”明显就没有考虑到人的“占有”渴望，不管人们对那种“大家的”理想曾经是何等的向往，骨子里人们并没有忘记尽力让自己在他人面前“档次”高一些。一旦理想主义的狂热过后，心理竞争的逻辑就会像瘟疫一样扩散，就一定要分个“你的”“我的”，也一定想办法把“大家的”变成“我的”。


