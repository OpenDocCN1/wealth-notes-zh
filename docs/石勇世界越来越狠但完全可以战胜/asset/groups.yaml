    而人则不一样，一方面他是动物，逃避不了生物本能的主宰，但另一方面，他又有意识，对世界具有一种超越性和反思性，即他不仅仅是世界的一部分，同时世界也是他的对象，世界也会成为其存在的一部分。这使得其存在挣脱了那种与世界的自在同一，摆脱了被规定的命运。用一个比喻来说，人的存在在世界上的位置，介于动物和神仙之间，他摆脱了动物的被规定性，但其意识上的超越性根本不能导致他在生理结构上摆脱动物性而达到神仙的那种超越性。他从动物状态出发，向神仙的存在进军，但永远到达不了神仙居住的地方。因此，他既摆脱了与世界的自在同一，也根本不可能达到与世界的和谐统一，他只是一个弗洛姆、舍勒等人所说的“宇宙的畸形儿”。


