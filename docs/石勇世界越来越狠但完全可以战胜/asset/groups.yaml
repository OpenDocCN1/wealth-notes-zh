    无论是周克华、霍尔姆斯、赵承熙，还是马加爵，虽然杀的人多，但并非连环杀手。中国的连环杀手也不多，最经典的，就是邱兴华了。他的凶残和变态已经远远超出了很多人的想象，2006年以来，没人能“超越”他。


    同样，让我们走进他的内心世界看一看。


    - **要注意不甘屈服于命运但又屡屡失败的具有施虐倾向的人**


    2006 年 7 月 16 日 夜，月黑风高，一件特大凶杀案发生在陕西省安康市汉阴县高山上的 一座道观里，共有 10 人被杀，包括寺庙住持及管理香火事务人员
    6 名，香客 4 名。


    凶手的凶残令人发指，居然把道观住持的双眼挖掉，把他的心、肝、肺掏出，切成片下锅炒熟，摆放在盘中……变态至极，让人毛骨悚然，连公安人员都被这只有一恐怖小说里才能出现的血腥诡异场景吓坏了。


    犯罪嫌疑人很快锁定为邱兴华。案发后他立即潜逃，在逃亡中又杀死一人。数百人经过一个多月的艰难搜捕，8 月 19 日才终于将邱兴华抓捕归案。


    那段时间里，邱兴华杀人事件以及此后关于他“是否有精神病”的法律与心理学争论轰动中国。至今，对于许多人来说，这个案件仍是一个超级变态的恐怖噩梦。


    他当然不是精神病人。


    和马加爵一样，邱兴华之所以沦为变态杀人狂魔，遵循的仍然是这样的心理逻辑：生命受挫导致破坏性的转向；越受挫，越有妄想，同时破坏性的能量也越大。当生命受挫达到极端时，一个导火索就会把他引爆。


    邱兴万家境不好，缺乏关爱，但又有小聪明。这对他意味着什么？意味着他从一开始就不断受挫，导致内心自卑，但又有对于自尊的强烈需要。这种人不干于屈服自己在社会价值排序上偏低的命运，一定要证明自己有“价值”。


    邱兴华存在着“自尊焦虑”和“成功焦虑”症。他所谓的自尊和成功，就是想占有社会上大多数人普遍认为有价值的东西：权力、美女、金钱等，拥有权力感，让别人羡慕他、怕他，甚至怕他的马屁。可以看出，邱兴华的生命受挫和“自尊需要”，让他养成了一种以自我为中心的、倾向于占有的、具有施虐狂特征的性格。无论是他耍小聪明给人修理机器时设置障碍，盗窃，还是杀人后称自己的尊严比
    10 条命重要，担心自己被鉴定成精神病后在监狱内所写的书，都可以看出这一点。


