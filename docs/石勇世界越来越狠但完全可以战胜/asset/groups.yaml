    ## 阶层


    房地产不仅可以让某些权力狂热，恶化国家和社会这一二元结构，它同时也是社会财富的收割机。它不是用来重构、恶化阶层关系的，但很不幸，在各利益集团的推波助澜中，它具有了这样的功能。


    中国的贫富悬殊，从来不仅仅是经济发展的自然结果。房地产在其中的能量，让包括股市这一吸钱的“黑洞”在内的任何行业都望尘莫及。说它通过把人们分成“有房阶级”和“无房阶级”，并在相互冲突的利益预期中构造出了第二种社会冲突——围绕房子的利益冲突和心理对峙，这并不夸张。


    2013年4月初，深圳。刚买房不久的“房奴”林天，和他的朋友、30岁的“屌丝”刘哲雄结束了两年的友情。


    原因几乎不值一提：在一次聊天中，林天表示出希望房价能够继续上涨（尽管上涨下跌对于只有这套房子的他本人来说其实毫无实际意义），他明显还沉浸在终于告别无房的耻辱、跻身于“有房一族”的狂喜中，而没有顾及连首付的钱都没有的刘哲雄的感受。这刺激到了痛恨高房价的刘哲雄。双方争吵，分道扬镳。


    这只是房地产撕裂中国社会的无数例子之一。从“房叔”“房婶”“房姐”到“房奴”，到“没有房子结婚”的无数屌丝，有无房子，有多少套房子，因为它的财富分量、利益预期、身份认同、婚恋选择时的排序，整个社会出现深深的裂痕。


    这并非房地产本身有原罪。但它确实已经非常过分地被弄成一种资本，一种房子的“资本主义”：牟利的资本、抗通货膨胀的资本、娶老婆的资本、跻身于市民阶层的资本。这是对一个人的身份认同。与此相反，买不起房子的人，实际上在利益预期上、社会认同上、婚恋选择上，都处于一个被剥夺、被排斥的地位。依赖于高房价这一经济手段，房地产行业在对社会洗牌的同时，也完成了对底层社会的社会排斥。


    那些看上去不处于底层社会的中产阶层，又能好到哪儿去呢？按照中国的社会转型路径，以及一个社会稳定的需要，中产阶层应该越来越“壮大”才对，但高房价让这一切成为泡影。房价越高，中产阶层在房子，以及其他事项上越是要支付更大的成本，房子也就越成为少数有权有钱的人的游戏。所以并不奇怪，中产阶层发育的社会空间压缩的幅度，和房价上涨的幅度几乎同步：2003年前，中产阶层很风光，但随着2003年后房价上涨，逐渐褪去光环，而在房价已高得离谱的今天，这个社会群体已经灰头土脸了。和对底层的社会排斥一样，对中产阶层的这种打击，仍然是通过经济手段做到的。


    房地产越是把社会结构弄得畸形、紧张，瓦解社会团结，它继续这样玩下去的基础，就越会丧失。既得利益者看起来很精明，但其实已经陷入非理性的疯狂。


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_186_0.png)


    ## 人心


    就一个社会的构成来说，社会结构的畸形、紊乱，相当于“外伤”，修复相对容易一些，用一系列制度和政策强有力地去“重构”即可。但如果人心被破坏，那就是“内伤”，要治疗就难得多了，它威胁到了社会构成的基础：价值导向、信任、公序良俗。


    有一份调查显示，中国社会的诚信状况总体偏低，而医药卫生、房地产业的诚信度最低。一个失控的、把全民押到赌桌上的赌博性的行业，其牟利的模式，原本就是需要排除诚信的选择。它强有力的竞争力就是垄断、强制、操纵和欺骗，而这，就需要把社会解构成一个不讲道德的竞技场，或者说，只有社会变成这样的一个竞技场，房地产才能让既得利益者赚得盆满钵满。这是一种竞争优势。


    这一竞争优势因房地产在利益导向上的呼风唤雨，影响千家万户而在中国社会被大规模地模仿，诱导、刺激人们也学会玩房地产利益链上的玩家们玩的那一套。社会因此而“房地产化”，变得浮躁、功利、投机心理盛行，对道德顾虑毫不在乎。


    一部中国的房地产发展史，也是一部中国社会的道德底线不断地往下降低的历史，它甚至威胁到社会最基本的构成单元：家庭。历次的调控，尤其是“限购”“20%个税”这类政策，都引发了大量的“假离婚”。仅仅是为了钻合法性存在疑问的政策的空子，或者规避地产政策带来的伤害，原本神圣的婚姻，可以抵押给利益的考虑，而且看上去没有什么不正常。一个行业，“规范”这个行业的政策，当它可以轻易地瓦解一个社会的基本单元，像赶一群鸭子那样迫使人们拿婚姻当儿戏，其杀伤力，可谓深入骨髓。


    不需要和20世纪80年代比。只要和前些年比就会发现，中国社会在道德信念、精神气质上，越来越很琐化、下流化。这里有房地产的一份功劳。当年做出“不买房”姿态、抵抗房地产掠夺的人，在今天全变成了傻子。他们对政府的信任、对市场的判断、对一个社会基本道德导向的坚守，遭到无情的嘲讽。那么，这样的一个社会，不会再有这样的“傻子”出现。因为这意味着，他还没有去参与一场集体堕落的游戏，就已经被宣布出局。


    和房地产对政治结构、经济结构的“绑架”一样，它对社会基础的破坏，也形成了一种正反馈机制：高房价重构社会阶层结构和利益分配→形成巨大压力和利益诱惑→驱使人们参与房地产的利益狂欢→社会结构更畸形，道德更堕落→更推高房价……直到房地产的掠夺游戏终于玩不下去，而社会结构也会被连根拔起。


    任何一个形成恶性正反馈的游戏都无法持续。全面反思多年来房地产政策的政治、经济和社会后果，剥离它作为商品（市场）和居住（保障）的功能，定位好政府的角色，这正是新一届政府被寄予的厚望。这也是一种社会拯救。


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_188_0.png)


    ## 2. 失意者正成群结队走来


    有党刊的声音，要一些“现实境遇不佳的网民”明白这样一个道理：骂，骂不倒党和政府，也骂不来自己的幸福生活和光明前途。


    有些网民是要教育教育


    这个声音概括了大家都体验得到的一种社会情绪，就是“不满”——说这些网民“社会阅历浅，生存压力大，在现实生活中感到不得志、不如意，有挫折感、失落感”。用一个有点政治心理学色彩的词来表达，他们是一群“失意者”。


    公正地说，不满的并不只处于社会食物链底端的人，境况稍好些的中产阶层，一些有钱人，甚至从体制中分享了一杯羹的人，也是牢骚满腹。可以说，失意者已大量涌现，而且情绪在社会中相互传染。


    这暗合了当下中国的背景：逛一圈微博，好像就要发生“起义”一样；各利益群体、官民矛盾不断，“群体性事件”频发；很多人都没有安全感，神经过敏地患上了“被迫害妄想症”，总担心有人对自己勒紧脖子；各种“崩溃论”不断，“暴力革命”的隐忧从未消除。


    接下来，到底会发生什么呢？换一个问题问就是：今天的社会心态到底是什么？具备了“暴力革命”的心理基础和现实基础吗？还是在一群失意者的撞击中，“现在”仍可以不变地维持下去？


    ### 神经过敏


    很多事情，不是我们想象怎么样就会怎么样。


    我的分析，可能会让具有“失意者”心理特征的人失望：现在只是一手绝版。[注：此处“微信 ipip131 微信公众号 【重构文字】”为OCR识别干扰或水印，已去除]


    具备了发生“群体性事件”的心理和现实基础，并不具备“暴力革命”的心理和现实条件。而富有讽刺意味的是，骨子里，最害怕“暴力革命”的，除了既得利益者，还有那些因为失意而渴望骂几下、闹几下的人。


    看起来很奇怪，但真相并不浮在社会情绪那儿，而是存在于政治结构、社会结构和心理结构中。


    观察一下今天弥漫的社会情绪，可以发现，除了“不满”之外，还有诸如不安、焦虑、狂躁、愤恨、恐惧等。对应的社会心态，大致可以用“失意感”“挫败感”“丧失确定性感”“被迫害感”来概括。


    心理事件，只是政治、社会事件的心理层面。搞成这样，原因大家都很清楚。就政治结构和社会结构的关系而言，“社会”被“国家”拍得喘不过气；就社会结构自身来说，洗牌已大致完成，阶层固化光临多时了；而在社会分配方面，“马太效应”持续存在，不公正不是在缓解，而是在加剧；还有阶层关系，心理对峙越来越严重，而且扩展到每个原子似的个人和抽象社会的心理对峙。


    不用怀疑，这样的社会背景，谁能活得自在，心理上的不受刺激？


    正如有毒的环境会摧残人的身体健康一样，不公正、不友好的环境也会破坏人的心理结构和人性。被剥夺的失意者自不必说，既得利益者虽然得到了在道德上不应得的利益，但也有心理后果，就是把自己的心理结构，可能还有自我、人性，弄得畸形和病态。


    解释一下就是：剥夺别人，对别人不公平，在道德上当然是错误的，心理上产生的一个后果就是会有罪恶感。一个人如果让自己意识到这一点，绝对是一件可怕的事情，因为他不可能在罪恶感中继续剥夺别人，这会人格分裂的。在心理上必须有一个解决办法，就是把剥夺合理化。这个办法非常简单：贬低、蔑视、仇恨被剥夺者，说他们懒、素质低、可恶之类，从而说服自己剥夺他们是正确的，或者根本就不是剥夺。


    但活还没有干完。剥夺别人，自然惹人恨，别人随时可能会忍受不了而报复，既得利益者当然能体验和预知到这一点，这又激起他们的恐惧。而消除恐惧，除了继续强化剥夺，别无他法。


    就是说，要维护有利于自己的利益格局，中国的既得利益者，必须付出让自己在心理上“残废”和弥漫着恐惧、不安、仇恨的代价。伤害别人的人，首先在心理上、人性上杀伤自己。干掉道德的人，道德也会干掉他。


    这引起了一个社会的大麻烦：无论是谁从“现在”得益或受损，心理上，大家都觉得“现在”难以忍受，充满风险，是不可持续的，而未来是什么？根本就没有确定性。这样，就分别形成了两种截然不同的倾向：失意者渴望发泄、闹点事，而既得利益者对于失意者的发泄、闹事异常地神经过敏。


    他们在心理上共同制造了“暴力革命”的假想敌，把频发的群体性事件，看成是假想敌来临前的征兆，而不是这个假想敌还远着的证据。


    ### 先验渴望


    群体性事件，是今天世界上绝大多数国家都有的现象。中国有，印度有，非洲有，土耳其有，美国有，欧洲也有。看上去，显然不都是“体制问题”。


    事实上，首先就是一个“现代性”的问题。“现代性”所主宰的人类社会，无论是否会发生“暴力革命”，一定会发生群体性事件。


    在现代性社会之前，人们以具体的共同体成员诸如村社、族群成员的身份存在。在共同体中生活，他受到了共同体的庇护。换言之，共同体或者不会让他的心理问题产生，或者就是对他的心理问题进行治疗。他的认同来自于共同体，而非“自我认同”。


    同时，更重要的是，人与人的关系，不是靠契约和钱来维系的，没那么俗。在具有神圣感的共同体里生活、生存之外，还存在一个鬼神世界。因此无论生活多苦，那只是体现在衣食住行层面，而非精神层面。在精神层面上，共同体的生活，具很多超越衣食住行的日常仪式，可以让一个人超越世俗生活的重压。而且，这种仪式感是日常生活化的，本身就是一出戏剧的上演。


    在心理层面上，群体性事件、暴力革命和祭神、唱歌、跳舞、搞运动会的功能一样，就是借助它们的戏剧性元素，让一个人忘记孤立的自我，融入一个抽象的群体、氛围或世界中，超越或者逃避世俗生活。再说得露骨一点，无论是群体性事件，还是“暴力革命”，在心理功能上，不过是对前现代性社会人们具有戏剧性元素的生活的替代。


    所以，除非被逼得活不下去，暴力革命是前现代性社会人们很难想象的。而“群体性事件”，也不是一堆社会原子聚集起来干，而是不同的共同体成员的矛盾冲突所致。


    但现代性主宰下的社会，尤其是今天，情况完全不同了。


    共同体的瓦解，使人们就是一堆相互离散的社会原子。个人，不得不以一个孤立的自我去面对陌生而危险的世界。这些社会原子，通过契约，重新去与别人结合，通过利益，去维系社会关系，但这些都是原子与原子的关系。他没有了共同体的庇护，作为一种心理保护，便放大他的“自我”，因为他只能抓住这一唯一能抓住的东西。


    鬼神世界的消失，以及共同体生活的消失，使一个人的世俗生活还原成衣食住行，生活中的戏剧性元素还有仪式感荡然无存，只能靠看小说、看煽情电视剧、追星、旅游、在咖啡馆里装13等来补偿。但所有这些，都无法挽救他没有一个共同体在精神上可以栖息，使日常生活具有戏剧元素、和一个不变的世界牢固结合在一起的命运也不复存在。他终要面对渺小无力的自我。


    正因为如此，人们具有了一种忘记孤立的自我，去参与某种具有戏剧性元素的活动先验渴望。


    有几种情况：如果生活不受影响，人们想到的只是去参与各种对秩序没有冲击的活动；当生活中有不满，郁闷，渴望就已经升级，他们希望社会能“乱”一下，但不能“乱”到打破生活秩序；而如果心理上变成一个失意者，事情就起变化了，他们将容易变成群体性事件甚至暴力革命的忠实粉丝。


    这是现代性条件下的问题，相当于是心理上的背景。


    群体性事件当然更有现实的体制和社会背景，是各种不公平、腐败、权力的施虐、政策对某些人的掠夺，等等，刺激、强化了人们对具有戏剧性元素，且能获得力量感，能发泄破坏性的活动的渴望。对此，中国人已经非常熟悉。


    一点都不奇怪，一场群体性事件，最先引燃导火索的，不一定是当事人，而可能是旁观者。而如果发生一次围攻政府机构的事件，在一些人去围攻时，一定有人趁机去打砸商店。


    你有公信力点，让我相信你，你文明点，让我配合你，你讲道理点，让我和你谈。


    回到前面的问题，为什么说现在只是具备了群体性事件的心理基础和现实基础呢？


    看一下美国政治心理学家霍弗的揭示。按他的说法，一个“群众运动”（可以变成“暴力革命”）要发生，有几个条件，一是社会中普遍有烦闷感；二是失意者们感觉到他们的自我已经一败涂地，无可挽救，只有砸烂现在才能救赎自己；三是有具有领袖气质的狂热者的出现。


    霍弗看得很准，虽然他的思维习惯就是不去解释。但可以确认：今天的中国，还没有群众运动（暴力革命）的土壤。


    很容易就能看清，无论是官方还是民间，对社会情绪和社会心态都有过度反应的倾向。比如不信任政府机构，抗拒城管野蛮执法，抗拒强拆中的过激反应等，不必往“对抗”上联想。人们之所以这样，其实是一种弱者心态，是面对具有单边优势的一方时，在心理上、行动上主动防御的表现。


    尤为重要的是，一个弱者在这样的社会场景中展示其弱者心态，正是他只是打算这样来“表达”的一种暴露。内心的声音不过是“你有公信力点，让我相信你，你文明点，让我配合你，你讲道理点，让我和You谈”罢了。


    不安、焦虑、狂躁、愤恨、恐惧等社会情绪，还有失意感、挫败感、丧失确定性感、被迫害感的社会心态，同样不是看上去那么可怕，如果不再激化它们的话。


    就心理而言，情绪、心态是受到刺激后一个人在心理上保护自己的结果。它们表现出来了，也就表明，一个人是希望消除这些不良情绪、心态所产生的条件，而非不依不饶要去干什么。同时，这些情绪和心态也表明，他还处于受到刺激后心理受伤的阶段，而非绝望的阶段。咬人的狗是不叫的。一个因绝望而想要做什么的人，不会再有这些情绪和心态。


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_194_0.png)


    因此，这些情绪和社会心态，只是支持发泄，而发泄是短时的，影响注定也有限，发泄过后，一个人就会收手，因为没有心理能量支撑了，除非蓄积心理能量下一次再来。


    现实也恰恰如此。改革开放30多年，无论现在怎么贫富悬殊、不公平，人们起码是享受到了它的好处的。多数人再失意，他的自我、生活确实并没有坏到一塌糊涂，对于改变命运，改变处境，仍怀有希望。也就是说，骨子里，人们对于现在有着眷恋。


    另外，未来是不确定的，谁知道会更好还是更坏呢？也许坏得一塌糊涂也说不定。


    在这种情况下，对现在骨子里有着眷恋的人们，虽然渴望发泄，渴望有一个具有戏剧性元素的事件让自己参与，但在内心里，他会无意识地阻止自己，以避免把事情闹到不可收拾。砸烂了现在，在暴力革命下，他等于抛弃了熟悉和眷恋的世俗生活，等于全面抛弃他尚珍视的自我，面对的将是无序化的恐惧，首先他自己都不会答应。


    所以我们经常可以看到，一个群体性事件从发生到消除，除非不断地刺激，否则人群闹一下就散了。这不仅仅是维稳力量的强大，还在于，一个人参与群体性事件，更多的是一种心理疗伤，他并不是抱着砸烂现在的目的而来。


    还不仅仅如此。一系列的报复社会事件，也在从反面表明，即使一个人的自我已经无可挽回地败坏，即成为彻头彻尾的失意者，他也只是要拖着别人，尤其是容易下手的弱者和他一起玩完。无论是郑民生屠童，还是陈水总纵火，皆是如此。


    和那些容易参与群体行动，骨子里却并不想砸烂现在的人不同，郑民生、陈水总等人从心理上最容易成为砸烂“现在”的坚定信徒，但他们对参与一个群体去行动并无意识和兴趣。


    既然现在只是具备了群体性事件的心理和现实基础，那么，假如要发生暴力革命，需要哪些条件呢？至少需要这样一个条件：召魂机制。第一，它要把未来确定化；第二，像霍弗所讲的，还要把未来拉近、美化，有一套教义信誓旦旦地告诉人们，你只要砸烂了现在，马上就可以进入那个美好的天堂了。这样现在不仅无法忍受，而且真没什么好眷恋的——问题在于，在中国的现实中，不可能有这样的教义去发挥它的功能。


    理解现实——无论是官方还是民间——是必要的。而理解是为了改善。无论是社会情绪、社会心态，还是群体性事件，都是解铃还须系铃人，责任主体是政府和整个社会。


    ## 3. 人类“变狼游戏”的心理分析


    ### 悲剧性的命运


    在这个世界上，没参与过心理竞争这个游戏的人恐怕不多。


    不夸张地说，除了早已“跳出三界外”的隐修者、意识混沌一片的疯子等少数人，任何一个有自我意识的人都逃避不了这个游戏。


    在现实生活中，心理竞争可谓泛滥成灾。人们在消费上竞相攀比，唯恐自己穿的用的没别人的有档次；当一种流行被大众所效仿时即迅速贬低，人们必须开发新的款式和方式；日常交往中，人们尽力维持一种体面，力图让自己的寒酸不见诸于世；在发生各种联系时，人们努力让自己的行为和语言符合社会公认的标准，免得被人视为怪物。无论是工作、学习、玩乐，人们都在暗暗较劲，不甘人后；而打架骂娘，相互贬损，目的都是在心理上占赢头。


    心理竞争不仅发生于行为范畴，也发生于观念范畴，可以这样说，文化与文化之间在价值上的比较，民族与民族之间各自对民族图腾的神圣化，国与国之间在各方面的较劲，都是心理竞争的反映。甚至连文人学者的论争也有很多心理竞争色彩，观点的较量常常被转化为存在价值上的较量而发生心理竞争。人们在争论时常常不理性，一个重要的原因即在于此。


    心理竞争这个游戏老少皆宜，是一个全民参与的热门行当。从理论上讲，当一个人在大约三四岁有初步的“我”的意识时，就被卷入了游戏中。这个游戏贯穿于人的一生，至死方休。游戏内容可以随着社会结构的改变而改变，游戏规则却很难改变，或者说起“王牌”作用的那个核心规则几乎无法撼动。人类可以把地球搞得乌烟瘴气，但作为一种高级动物和一个社会人，他只能乖乖地被一些生物本能和社会本能驱动而运转。


    正如弗洛伊德所说的人在“自我”的房子里都不是自己的主人那样，在心理竞争这个游戏中，人也不是主动者。即使能在游戏中胜出，也被游戏规则牵着鼻子走。


    何谓心理竞争？简单地说就是人与人之间在心理上的相互较量，其目的是保证自己在心理上处于优势。它和竞争心理表达的不是一个意思，后者竞争的不是“心理”，而是一些被人奉为价值的东西，比如职位，但竞争后果可以在心理上反映出来。它也不是心理博弈，心理博弈主要是一种达到某种目的的策略，它只是表现了对心理规律的利用，与心理竞争不是一回事。心理竞争也不能顾名思义理解为是对心理的竞争，而是

