    ## 第三种需要是认同


    认同的需要几乎每天都伴随人们，它是一种身份感，没有这种身份感，一个人就不知道自己是谁。当一个人从自然那儿走出，在三四岁以后，他就有了一个“我”，他必须认同它。所以，无论是不是真实的，他都必须相信那个说话的、走路的人是“我”，而不是别人。当然，如果他不愿面对真实的自己，害怕面对他的存在本身，他也可以把民族、国家、职业、宗教之类的东西看成是“我”的一部分。比如，他可以用“我是一个中国人”“我是一个律师”这类存在属性和社会角色来取代它，尽管这存在属性和社会角色根本无助于说明他到底是一个什么“人”。


    ## 第四种需要是寻根


    中国人讲究叶落归根，人类也有返祖倾向，直到现在，动物、祖先仍然作为图腾受到人类的祭拜。童年让我们眷恋，我们总想返回童年；而我们对自然故土也总是涌上一种家园之感，这就是人类寻根的需要。我们不仅仅需要知道我们从哪儿来，更重要的是，我们需要在心理上返回与自然和生存环境和谐相处的状态，重获安全感。这一需要如果不能得到满足，我们也会追求一种虚假的、变态的、替代性的满足，精神分析学家称之为“乱伦固恋”。弗洛姆认为，人对血缘和土地的依恋即是一种“乱伦固恋”，它的极端形式是种族主义和国家主义。


    ## 第五种需要是定向


    人自从终结了意识的混沌，就有了自我意识和对象意识之别，有了“我”和“世界”的区分。这就形成了一个结构。在这个结构里，人必须确认一个方向，他有了定向的需要。如果他的思考、行动不能有一个明确的指向，他的理智就无法生长，他的思考、行动就会陷入瘫痪。而如果他外在的可以确认的对象，就无法寄托理想。人的定向就是需要一个弗洛姆所说的“方向性结构”，只有这样他才不会迷失。


    人的这五种需要，一定要在他的精神上、心理上“表达”出来——不管他采取了什么样的表达方式。也正是如此，弗洛姆多次说，人的存在其实是宗教性的。人无论是信仰一种宗教，还是躲入民族、国家寻找安全感，或成为一个“消费狂”，都是一种带有宗教色彩的对存在问题的解答。所有的文化都是宗教。神经症或精神病是个人的宗教。


    ## 44. 世界逐渐变狼，我们爬出“洞穴”


    柏拉图有一个非常著名的“洞穴隐喻”是这样表述的：


    想象有一个洞穴式的地下室，有一条长长的通道通向外面，可让和通道一样宽的微弱亮光照进来。有一些人从小就住在洞穴里，头颈和腿脚都被绑着，不能走动也不能转头，只能背对洞口面壁而坐。


    再想象在他们背后远处高些的地方有东西燃烧着发出火光。在洞外上面有一条路，沿着路边筑有一带矮墙。矮墙的作用就像傀儡戏演员在自己和观众之间设的一道屏障，他们把木偶举到屏障上头去表演。


    接下来，再想象有一些人拿着各种器物举过墙头，从墙后面走过，有的还举着用木料、石料或其他材料制作的假人和假兽。这时，囚徒们就会看到这些东西投射在他们面前洞壁上的阴影。他们只能看到这些阴影，并且把这些阴影当成了真实的事物。


    在这个时候，其中有一人解除了桎梏，跑到洞外，看到了阳光，看到真实的事物，知道原来先前所看到的一切都是阴影，都是幻象，他们完全活在虚假之中。但是，如果他试图返回去解除其他囚徒的桎梏，告诉他们以往的一切都像在做梦一样，他们所看到的是假的，跑出去看才是真的，他一定会遭到还被蒙蔽的囚徒们的围攻。


    囚徒们为什么会围攻这个要让他们看到世界的真相的人？这样的现象在历史上已经重复了无数次。答案很简单：人类在心理上已经习惯了做梦、他不能承受清醒的生活，因此仇恨惊扰他的美梦的人。


    正是这样，战争、仇杀、自杀、施虐……在各个时代都无法避免。它们构成了人类的历史。而在今天的中国，心理危机之所以如此严重，一个主要的原因就在于人在心理上活在虚假之中，受着莫名的力量操纵，而他却浑然不觉。


    必须承认这样的事实：我们是柏拉图所说的“穴居人”，是“柏拉图洞穴”里的“囚徒”。


    我们需要有这样的心理准备，认识自我和进行精神修炼并不太容易。它需要我们像哲人那样思考，换一种思维模式认识世界，并加以训练。在“柏拉图洞穴”中，假如第一个挣脱了桎梏的人，由于已经习惯了洞里微弱的光线，习惯了所看到的阴影和假象，他跑到外面，刚开始一定承受不了阳光的照射，也无法相信他所看到的真实事物就是真的，他可能又退回洞里去，继续过那种“穴居人”的日子。但是，只要他忍受住阳光的刺眼，忍受住看到真实事物时对他的心理冲击，他就会获得解放。


    同样，因为我们的认知模式、情感模式都是社会性的，我们已经习惯社会，在心理上无法离开社会的结构，要改变就意味着我们要从这里分裂出来，刚开始改变肯定不太适应，甚至会有焦虑阵阵袭来。但没关系，像哲人那样思考和实践，你并没有离开这个世界。你只是尝试着比以前更清醒地看这个世界而已。


    ## 45. 为什么总有一些纠结难以说出口？


    让我们先看一下古往今来，基于人的存在困境，人解除痛苦的原理。


    既然人的心理问题的最终祸根是他的自我意识与对象意识的分裂，那么，要消除痛苦，原理就有以下几种：


    - 要么让意识混沌一片，从而自我意识和对象意识的分裂得到了消除，比如疯子。

    - 要么尽力消除自我意识，将自己完全融入外界，努力让自己变成外界的一部分，从而把外界纳入自我结构，这样，外界也就不存在对自己的威胁了。

    - 要么努力将自我意识无限放大，仿佛自己就是这个世界上的神，在自己面前，世界多么渺小。这样自己囊括了宇宙，外界成了自身的一部分，所谓的外界对自己的威胁也不存在了，比如“自恋狂”。

    - 要么尽力压抑对自我构成否定的经验，使自己意识不到自我与外界的冲突，比如大多数普通人所采取的方式。

    - 还有一种方式，不压抑自我意识也不压抑对象意识，通过对自我系统的建构来抵御外界的威胁，消除之间的矛盾，使人与世界重新获得统一，比如哲学家、思想者、大德高僧。


    综观以上种种逃避痛苦的方式，第一种是不可取的，虽然有时很难幸免；第二种看起来是成功的，虽然人遭受了奴役；第三种似乎也是成功的，但这样的人已经可以被认为是一个典型的神经过敏患者甚至精神病患者了；第四种不算成功，因为痛苦仍然挥之不去，而且人会产生心理变态。只有第五种才是人努力的目标。这不是叫大家都在身份上变成哲学家和思想者，而是在心理结构上，通过自我认识和精神上的修炼，向那种存在状态努力。这种努力会让我们获得两个结果：心理上的优势、对存在真相的洞悉。而面对非存在的威胁，我们可以焕发出存在的勇气。


    假设有一个人在你面前凶神恶煞地指着鼻子骂你，无论你和他的力量对比如何，你都有情感反应——愤怒。只不过，当你并不怕他时，你把你的情感表现出来，你回骂他甚至把他打了；而如果你怕他，或者担心你骂他、打他会带来日后的麻烦，你就会压抑这种情感。


    无论怎样，他骂你都引起了你的心理逻辑的运作，无论你压抑不压抑自己的愤怒，你都不会愉快。


    你无法不痛苦，因为在所有让你痛苦的人、现象、事物面前，你遵循着那一套从小习得的情感模式、认知模式、价值判断，它们会自动控制你。你并没有心理优势。


    ## 46. 不要让恐惧把你淹没


    心理优势是使你免受伤害的武器。要具有心理优势的方法也很简单。用理性控制情绪。


    在我们假设的例子中，当那个人凶神恶煞地指着你的鼻子骂你时，你的反应应该是控制好自己的情绪，不要认为他对你友好或不友好，不要认为他是一个好人或坏人，也不要思考他为什么骂你。不，你只是在静静地观察他，看他那张因骂你而显得扭曲的脸，看他的表情变化。


    让他的话、他的表情刺激你的心理，如果你能够控制好自己的情绪，那么，这个时候你就不是在用心理和他发生联系，而是用你的眼睛和他发生联系。你的心理已经“不在场”，他骂你对你来说已经没有效果。相反，是你在看他，他成了你面前的一个客体，在这个客体面前，你作为主体是“主动者”，转变成心理上的优势，你会感觉到他的虚弱和可怜。


    ### ❖ 观察心理活动


    在日常生活中，我们还可以这样训练自己，比如，当你因某事而焦虑、而恐惧，你变得抑郁时，你就要控制自己不要去感觉这些情绪，而是观察它，观察你的心理活动。因为感觉和观察不能共存，当你观察时，你就感觉不到你的焦虑、恐惧、抑郁，它们在你的观察中慢慢消散。这个时候，你实际上已经跳出了给你带来痛苦的心理情境，你是在另一边观察那些奴役你的东西。你会发现，焦虑、恐惧、抑郁实际上并没有什么力量。


    用以上两种方法，慢慢地社会上的那些认知模式、情感模式在你身上消散，在心理上你可以摆脱价值观念对你的奴役。在你面前，你看到的是某一个东西本身，而不是它所附带的那些被强加的符号。当一个人开着名车在相对穷酸的你面前晃过时，这一幕并不会给你以心理上的焦虑和挫折。因为，你所看到的并不是什么名车，不是在价值排序上证明车主排序比你高、比你有价值的东西，它只是一个交通工具而已。


    训练自己获得心理优势，只是让我们的心理世界获得独立性不让社会上通行的那一套影响自己，让理性逻辑控制住心理逻辑，不被各种自己无法意识到以及虽意识到但无法抗拒的心理逻辑吞没。它是我们获得心灵解放的第一步。


    第二步就要训练我们洞悉存在真相的能力，通过认知的改变达到心理模式和人格的改变。这里有三个步骤：静心、对生活具有反思性、看穿各种观念的虚妄。


    关于静心有多种方法，禅宗和印度的灵性大师们，比如克里希那穆提、奥修在这方面讲得很多，他们的话处处闪着智慧的灵光。我们可以像他们所提倡的那样，训练静坐和直观。


    比如，我们先花上一分钟，静静地看着我们面前的任何一种东西，电脑、桌子、书、树木等都可以。在静坐时，不要试图做什么，只是双眼看着前面的东西，大脑什么都不要想，不要思考。当禁不住有念头涌上来时，一定不要理会它。如果在这一分钟之内，你能够做到直观不为心理活动干扰，你就会发现，你感觉到了你的呼吸，度过难挨的大脑一片空白和可怕的不适感后，你会变得更清醒。而这就意味着，你和你的内心开始建立了联系。好了，你可以再花上两分钟、五分钟、十分钟……循序渐进地训练，慢慢地，你的心就会静下来。此后，你做出什么选择，就会更多地听从内心的声音，面对人生荣辱，你会心如止水，波澜不惊。


    第二步是对生活具有反思性。一个俗人与进行哲学思考的人最大的差别就在于，前者对生活没有反思性，他一生主要就是受两种本能——生物本能和社会本能——驱动，像一架机器一样被操纵，而他从未尝试去意识这一点。正因为如此，在认知上他没有超越给定的社会现实，在心理上也只能受奴役。而进行哲学思考的人因为对生活具有反思性，在认知上可以超越现实甚至时代的限制，能够看清支配一个人的各种心理和社会力量的真相。


    方法非常简单，恰如我们在第一章中所举例的，这种培养反思性的训练并不需要一个人去思考哲学家们所思考的那类高深问题，而只是学会像哲学家那样思考，就是面对某个现象不要满足于它“是什么”。不，你对“是什么”并不感兴趣，你感兴趣的是它的原因、理由，它为什么会是这样而不是那样。正如真正重要的并不是某个观点，而是支撑这个观点的理由、论证一样，你需要追问下去。比如，当我们的偶像被攻击时，我们往往会攻击那个攻击我们的偶像的人，这个时候，我们就要问一下：为什么？是因为攻击到了偶像，就等效于攻击到了我们吗？为什么会发生这种现象？到底是什么把我和偶像拴在了一起？难道离开了他，我们在心理上真的不能活吗？


    ### 看穿各种观念的虚妄，其他什么都不要想


    在前面，我们已经分析过，我们经常对世界进行人格失调性歪曲。各种支配我们的观念似乎具有很大的力量。然而它们真的很有力量吗？


    佛教一直强调，自我并没有一个牢固的形态。我们痛苦的来源是无知，是无法看穿自我的欺骗。这也就是我们第一章所讲的，我们的自我更多的是社会自我、假自我，正是我们把它们体验为“我”，我们一直活在虚假、幻觉之中，遭受各种痛苦。


    从哲学上说，我们看到的世界并不是世界的本相，它只是一个现象世界。而鸟、狗等看到的世界又是另一个样子。人类灭亡了，那只是人类所看到的现象世界不在了，鸟、狗所看到的另一个样子的现象世界并没有消失，世界的本相更没有消失。


    同样，支配、奴役我们的各种观念，很多时候也不是世界本有的，它们只是我们的心理的产物，本质上其实是一种幻象。在《和尚与哲学家》这本书中，和尚曾经举了一个例子：当人在昏暗中看见一根杂色的绳子时，他很有可能误以为是一条蛇，并产生恐惧。他也许想跑，也许会用棍棒把蛇弄走。但是，如果有人打开灯光，他就会看到根本不是一条蛇，他的恐惧感来自于对事物的错误认知。正是生活在虚假、幻象之中，让人产生了痛苦。


    你也许会说说，把绳子看成蛇这个例子说明不了什么，因为那只是一种错觉。不错，但像一个人的存在属性，比如哪国人、哪个民族的、哪个地方的人、哪种职业、男人或女人、信仰什么政治观点……尽管也是可以用符号客观地界定的，但它们之所以变成我们的自我的一部分，在心理上仍然是一种虚妄，仍然是基于我们追求心理生存的错觉。因为在我们的心理上，它们的存在不是本有的，只是我们追求安全感、认同感、归属感的产物。正因为如此，我们用它们来获取安全感的结果不是真的获得了安全感，而是带来了痛苦，使我们受到操纵，甚至心理变态。


    这就是自我迷失的真相。看穿存在于我们身上的各种观念的虚妄，以及它们所对应的“实体”的虚妄，是我们找回自己、走向真实、解除痛苦的真正道路。它就是驱散人的恐惧的灯光。在这方面，没有哪一种认识和精神训练比佛教更深刻、更博大自然。


    也许你会有这种感觉，十年前狂热地捍卫某种东西，而现在这种东西对我们已没有一点影响。这就意味着，十年前的那个“自我”消散了。时间让我们得到了改变。要看穿各种奴役我们的观念的虚妄，粉碎自我的虚假，我们可以不求助于时间，而是求助于佛教所推崇的精神训练。


    最主要的方法就是不要将注意力集中在各种情绪状态上、集中在启动它们的原因和环境上，而上要溯到它的源头。


    否则，一个观念出现，他就任自己被牵着走，第一个观念生出第二个、第三个观念，然后是一根由众多维持心灵混乱的观念形成的无穷无尽的链条。


    因此，一个人必须转向观念的源头，并考察观念在他的精神中出现的原始机制。这意思就是说，当你在工作中出了某种差错时，你产生了悔恨、恐惧，这个时候，千万别去想你可能会被领导训斥，会让你丢人，会影响到你的奖金，甚至影响到你的升职等，也就是说，你不要去进行观念上的推论，让一个观念产生另一个观念，最终让恐惧把你淹没。不，你根本不要理睬这一切，你只是追问观念的源头，非常简单，就是你犯了错。那么，解决问题太简单了，你只需要告诉自己以后不要再重犯错误，其他什么都不要想。


    ## 47. 世界越来越狠，可以战胜吗？


    是否具有“存在的勇气”，一个人是否可以不寄生在偶像崇拜上，是否可以不崇拜权力，是否可以不自杀，是这个时代的严峻问题。


    我们曾经论述过，因为一个人的存在被界定为各种存在属性，存在不见了，他见到的只是存在属性，存在属性作为表象、假象遮掩了存在这一本体。而各种存在属性变成人的自我，会使人的心灵极为狭窄，因为每一种存在属性对于这个世界来说都是一种狭窄化。而每一种观念对于这个世界来说也都是一种偏见。如果人跳不出这些东西，他就被束缚死了，他所看到的世界更多的只是一种幻象。


    这一切，通过反思性认识，可以慢慢让我们的存在属性在心理上消散，从而逼近我们的存在本身。而逼近存在本身也就意味着，我们意识到了非存在。


    另外，人类的存在还有这样一个问题，那就是弗洛伊德曾经讲过，人的意识只是冰山一角，无意识则是海面下的庞大。人受着诸种无法意识到的心理力量主宰。甚至他并不知道他自杀的真正原因是什么。


    在心理分析中，要治好一个人，最常用的就是把他原来压抑的东西通过“自由联想”呼唤出来。一旦一个人回忆起了造成他现在的心理痛苦的事件，伴随着他的情感释放，他的症状也就消除了。真正的问题并不是造成症状的那个事件有什么力量，而是病人不敢面对它，只是压抑它。因此，弗洛伊德认为，“哪里有无本我，哪里就必须有自我(ego)”。这就是说，哪里有无声的欲望和情感，哪里就得有有意识的自我审视。弗洛姆将它准确地表达为“把无意识变成意识”，并认为它不仅仅在临床诊疗上，而且在人类的精神救赎中具有更大的意义。


    通过艰苦的精神训练，我们也可以做到这一点，意识到此前我们从未意识到的东西，让心灵变得开放、自由。这个时候，人的存在得到了澄明。


    同样，在这个过程中，我们也会遭遇非存在的威胁。要把人压抑的无意识呼唤出来，就要遇到阻抗。特别是在生活中，人是否有存在的勇气？


    假如你想购买一款高档商品，这个时候，如果你已学会对生活具有反思性，你就要观察一下自己购物的动机：是真需要，还是为了抬高身价、不让自己看起来很失败而产生的需要？这个时候，你是听从内心的声音还是他人、社会的声音？如果是前者，你就和内心建立了联系，你的行动与内心没有分裂。如果是后者，那就意味着你并不是自家屋子的主人，但你现在知道了这一点。


    从某种意义上说，当你意识到你购物的动机是听从于他人、社会的声音，你不听从就很不自然，在这种情况下不购物很难让你获得一种有身价的感觉时，你逼近了你的存在，听到了内心的声音，但同时你也面临着非存在的威胁。这个时候，如果你能够听从自己内心的声音而不是他人、社会的声音，并且在世界面前具有我上面所讲的心理优势，你就具有存在的勇气；如果不能，则你并没有存在的勇气。


    保罗·蒂利希在他的《存在的勇气》这本书中曾深入地分析过人的存在困境。他特别指出，存在的勇气就是不顾任何非存在的威胁也要肯定自身。如果人具有理性的自我，能够用理性逻辑控制住心理逻辑，面对任何逃避自由的心理、命运的打击，甚至死亡的威胁，他都无所畏惧，都敢于自我肯定。


    是的，我们在一个狠世界里，要做的，就是成为一个敢于自我肯定的人、具有存在的勇气的人。


