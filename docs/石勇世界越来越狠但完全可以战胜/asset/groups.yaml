    ![](img/f0502657e0e411adb97ccb25c15a5fc1_102_0.png)


    心理上是另一个物种。


    霍尔姆斯、加藤智大、赵承熙有一个共同的特征：性格孤僻，对世界隐藏自我。


    显然霍尔姆斯、加藤智大在心理上更像是同伙：只有扮演成一个恶魔，杀人就像是演戏，他们才敢杀人。


    ## 狼人在暗处，就感到安全了


    还是看一下他们是什么样的人吧。


    霍尔姆斯深居简出，不和人说话，晚上也不开灯；加藤智大是宅男，而且早前就离群独处；赵承熙更有意思，别人问他话他不理睬，他写自己的名字只是写一个问号，上课时总是戴着帽子且不与人交谈。


    大多数人都有把真实的自我隐匿起来的倾向。如果我们在明处，别人在暗处，在心理上是很危险的，这意味着别人可以随时进攻，而我们无从防御。但这几位玩得太夸张了，很不正常。而这就意味着，对于懂一点心理分析的人来说，他们恰恰把自己给暴露了。


    很清楚，他们这样玩，意味着从心理上认为外界是一个危险源，他们撤了，退回到了自我的家里。


    我们是什么样的人，在很大程度上取决于在心理上是如何和世界打交道的。一个表演型性格的人，把世界看成是一个表演的舞台，最希望获得关注，他只有把自我凸显出来才能找到存在感。但一个自卑型性格的人，如果心理弱小，出现在人群中时，心理上往往没有安全感，只有躲在一边他才自在。


    极端之处，就是一个人会有一种“吞没焦虑”：如果和别人有联系，如果感觉有人看他，就是说，如果他的自我暴露在世界的方面，他就感觉到有被吞没、融化、毁灭的危险。


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_102_1.png)


    因此，为了在心理上保护自己，他要做的就是不说话，玩“隐身”，斩断和别人的联系，似乎这样，别人就不认识他，因此当然也无法在心理上打击他，他就安全了。


    ## 内心被破坏的人找存在感的方式就是攻击


    不知道是童年或少年的什么经历让霍尔姆斯变成了这样的人。也许他母亲清楚。


    如果一个人为了在心理上保护自己，仅仅是把自我隐匿起来不让世界看到，那就不会发生什么了。致命的是，他撤了，但还没有变成一个完全活在自我世界的疯子，因此在心理上，仍然要和世界玩。


    无论是杀手本人，还是其他无辜者，就栽在了这上面。


    对于加藤智大来说，他想挣钱，混得好一些。对于赵承熙来说，他屈服于主流价值观，对贫穷敏感，仇恨富人。霍尔姆斯到底想干吗暂时不清楚，但从心理上讲，当一个人因为外界的危险而撤退回自我世界时，只是在心理上可以保护自己，但一定激起了存在感、自我价值感的焦虑，并且还有力量瘫痪的感觉。


    而一个没有存在感、自我价值感、力量感的人，在心理上是无法生活的。这一点，网络上中国的低级“文青”们可以证明。他们没什么能力，却又自我感觉非常良好，找存在感的方式就是以小说诋的腔调骂书、骂电影、骂人。


    对于霍尔姆斯来说，祸根就在这里埋下：他要找到存在感、自我价值感、力量感，不可能一直待在黑暗里，必须把自己亮出来让别人看到，即和别人打交道，但是，由于他的心理保护，不可能这样玩，那么怎么办？唯一的一条路，就是攻击、毁灭这个世界，给它心理震慑。


    换句话说，他骨子里有从黑暗中冲出来，震慑这个世界，迫使它重视自己的存在的冲动。


    然而，本质上，一个逃回自我世界的人，都是心理弱小的人，他要敢对这个世界痛下杀手，最起码必须获得仇恨这一情绪的强有力支持，还要借助于其他心理策略，把自己想象、扮演成一个英雄或坏蛋，进入某种“剧场心理”中。


    扮演成英雄，杀人时就充满了“正义”赋予的力量；扮演成坏蛋，则是让人害怕。在心理上让人害怕，自己也就有胆了。


    让自己最有胆子的一个情境，也是这些杀手追求的最高境界，就是把“剧场心理”搞得很真：比如，他想象着自己是一个坏蛋，突然从黑暗中冲出来大开杀戒，人群猝不及防，受到他巨大的心理震慑，然后，他成为世界关注的中心，充分体验到存在感、自我价值感、力量感。


    加藤智大就是这样干的。


    ## 扮演一个角色后，狼人才敢杀人


    在杀人前，加藤就在网上预告，写日记，其实就是在预演，在心理上进入角色。而杀人时先驾驶卡车撞向人群，相当于一个开场白。


    他的日记忠实地表达了自己的抱负：“梦想——独占新闻头条”。


    霍尔姆斯玩得更真，更有剧场心理，可以说，他把杀人的戏剧化推向了巅峰。


    当他出现在《蝙蝠侠前传3：黑暗骑士崛起》首映现场时，一袭黑衣，穿着防弹背心，戴着防暴头盔和护目镜。这反映出他仍然把自我隐匿于黑暗之中，并强化了心理上对外界的威胁。


    和加藤智大一样，他也先来了个开场白，以更好地进入角色：投掷了催泪弹或烟雾弹。


    进入角色后，他朝天开枪，在心理上表明，自己完全控制了局面，占据了心理优势，接下来想怎么干都可以。然后，他向人群开枪。


    开始人群以为是玩电影音效或恶作剧，后来人们的惊恐、死亡，彻底暴露了他们在霍尔姆斯面前的心理弱势。他可能终于找到了梦寐以求的那种快感。


    当他被警察抓到时，还沉浸在自己所扮演的角色中，回答警察的第一句话就是“我是小丑”。


    ## 23. 狠人在暗处


    这是一个经典的案例。2007年的春天，一个平常的下午，赵承熙持枪冲进学生宿舍和教室，射杀了32个师生并开枪自杀。


    ## 你在暗处，就可以解除别人的武装


    据媒体披露，赵承熙一家移民美国前，曾在韩国首尔道峰区仓洞地区租房生活。当时的房东任凤爱说：“赵承熙一家当时住在半地下房间，虽然不知道他父亲做什么工作，但可以看出他们一家生活非常艰难。他们移民前曾说，因为生活实在太难过，所以他们觉得倒不如去陌生国家闯一闯。”到美国后，他们家开了间洗衣店。


    比之霍尔姆斯，赵承熙的心理世界更怪诞，难以理解。他性格十分孤僻，过着独来独往的生活，行为诡谲。不仅如此，他一直玩“隐身”。


    据他的同学回忆，在2006年文学课新开课第一天，学生当时都自我介绍，而赵承熙一句话也不说。学生都在签名册上写下了自己的名字，但赵承熙只写了一个问号。当老师问：“你是叫问号吗？”他什么也不说。


    他的同学朱莉·普尔说，赵承熙上课时总是坐在后面，戴着帽子，很少参与班级和学校的活动。他们所在的系不大，但赵承熙“像个匿名者，从不与人交谈”。尽管这样，赵承熙在2005年上大学二年级的时候，曾经尾随和骚扰了两名女同学，受到校方的警告。


    制造“校园枪击案”前，赵承熙给美国全国广播公司(NBC)寄去了一份包裹，里面有他手写的23页宣言、43张照片和28份录像资料。他在宣言里发表了对富人和享乐主义的仇恨，并扬言“报复”，说自己“死得就像耶稣基督那样”，“以激励未来的弱者和那些无防备能力的人”。照片里呈现的是他各种暴力的姿势。


    为什么赵承熙不与人交往，宁愿别人不知道他的名字，宁愿别人不知道有他这么一个人存在？这一切和他最后杀人有心理上的逻辑联系吗？他的心理问题，仅仅从心理学的角度来分析已经不够了，我们必须深入到“人的存在”这一层面。


    我想先请问：你是否有过这样的体验，躲在黑暗中窥视他人时，感到一种难以言喻的快感？偷窥已成了一种普遍的心态和社会病。这种“我在暗处，他在明处”的窥视，之所以让偷窥者感觉很爽，是因为在偷窥者的心理上，他感觉被窥视者毫无防御地暴露在面前，除了获取了某些满足感，也许还有一种巨大的心理优势。


    被偷窥是一个烦扰人、主要针对女性的问题，“窥视癖”总是容易被认为是“变态”。在心理上的确可以这样说，但剥去“变态”的外衣，它其实就是一个“人的存在”的问题。它作为心理问题，不过是对存在的问题不正常的折射或表现罢了。


    ## 在心理上撤了，并没有结束


    按心理分析的思路，要理解赵承熙的心理世界，解释他那些“怪异”的行为，就有必要追溯他的童年史。他的孤僻性格其实很容易明白，可以肯定地推断，他在成长过程中曾因贫穷而经历过某种心灵上的创伤。


    这样的心理创伤在后来如果不能得到克服，在外部世界面前就会持续处于一种心理弱势的状态。如果他的自我仍然具有社会自我的内容，甚至更多的是一种假自我，在潜意识里仍然认同社会主流价值观念，那么，他要么通过社会公认的成功来获得心理强势地位，就像韩国前总统李明博那样，从赤贫奋斗到人生的巅峰；要么就切断与外界的联系，退回自我的躯壳，自我封闭，仇视他人，最终成为变态的杀手。


    从赵承熙的一系列表现看，他显然属于后一种情况。别人问他话他不理睬，写名字只是写一个问号，上课时总是戴着帽子，且从不与人交谈……这一切都表明，他企图把自己的存在从现实世界剥离出去，让自己在别人面前消失。如果别人不注意到他，如果别人不知道他是谁，他的存在就没有暴露在别人面前，他就不会被别人吞噬。显然，为了避免自己处于心理弱势，他必须不被别人看见。


    但并不是所有的性格孤僻者都像赵承熙那样是基于心理弱势。事实上有另一类避世者，比如“世外高人”，则恰恰是基于心理强势。他们的自我要么已是一种虚妄，要么已抽去了社会自我的内容，看穿了世界的幻象。因此，他们切断与世界的联系的心理动机并非恐惧，而是轻蔑或厌恶。这一点决定了他们对外部世界很难具有攻击性。


    而赵承熙不是。外部世界的存在总会给他以强烈的刺激，因为在心理上他与外部世界仍然是同构的，仍被社会自我主宰，比如他还想上大学，还想接近女生，还按贫富对应的社会评价标准仇恨富家子弟。在这样的情况下，只是退回自我的躯壳内，仅仅是向内攻击，如自杀，并不能解决他的问题，他还必须否定和反抗外部世界，利用对外部世界的攻击来获得心理强势，保证心理上的生存。


    所以，在玩“隐身”时，他仍然尝试着与他人一样行动，比如上学读书、追求异性等等。而这么一来，却又恰恰意味着他在外部世界面前已经把自己“暴露”了，解除了他对自己心理弱势的防御。在这个时候，如果他并没有收获成功，就会有一种强烈的挫败感和羞辱感，产生强烈的自我憎恨。而这种自我憎恨只能更加使自己处于心理弱势，在心理生存的指令下它又逻辑地外化为一种强烈的攻击性，并且这种攻击必须被合理化。


    于是，史上最严重的校园枪击案不幸地发生了。


    ## 24. 狼人杀人的心理逻辑


    马加爵的5000元学费，是从家到学校借了一路借来的


    为读大学马加爵家里已经负债1万元，马加爵靠打零工补贴生活费，没钱买鞋穿，不敢去上课，直到学校发了救济才买了双便宜拖鞋走进了课堂


    马加爵在监狱中穿上了他这一生中穿过的最好的衣服——囚服“这是我穿过的最好的衣服。”马加爵说的这句话让在场看押他的警察都落泪了。


    说到中国人，必须回顾一下马加爵杀人事件。


    具体事件可以问一下百度，我不再抄了。


    在当时很多人的解读中，社会不公、贫富悬殊、心理变态、教育体制的恶性代价在马加爵事件上折射了出来。这个事件，由此也成为人们情绪的发泄口。而在媒体上，无论评论者对他的行为进行怎样的评价，都表现出一种沉重和压抑，也都表现出对社会、心理和教育问题的控拆。


    马加爵变成一架杀人机器，真的如很多人所说的是因为贫穷产生自卑，导致脆弱的自尊，然后在某一事件的刺激下杀人吗？如果仅仅是这样来看问题，那就太简单化了，完全没有进入马加爵的内心世界。


    好，让我们走进他的内心世界。


    ### 狼人都以自我为中心的


    马加爵杀人的心理逻辑可以这样表达：贫穷的无文化的农村家庭背景→形成自我中心性格→学习好论证其关于“自我”的自恋→遭受现实挫折，生命力受挫，内心产生破坏性→为维护心理生存，关闭自己，减少与外界接触→仍然遭遇各种挫折，破坏性加剧→偶发事件刺激，破坏性剧烈释放。


    要走进马加爵的心理世界，就必须如精神分析所做的的那样走进他的童年史。媒体曾经披露过他的一些日记，它们真实地记录了他的心理嬗变轨迹。这里引述其中一篇：


    1996年7月19日 晴


    今天我非要写日记不可……


    大概是六点钟吧，我被一阵阵寒心刺骨的吵闹声吵醒了！原来是爸跟妈在争论，气势非凡。爸说一大堆脏话，很臭、很臭的脏话，看来爸是发疯。


    他们是围绕是否用抽水机抽井水等问题闹的。爸说：“你这个蠢货，用抽水机抽井水都不行么？你说用电多，多少？用现在那个有窟窿漏水（的桶），一装上（水）马上就漏完了，这样好？到冬天打水脚就湿，你们更不愿打了。既然小钱不用，那就用大钱，等下又说到那
    220 元的烧瓷炉……”哦，妈妈也对抗起来：“当然，做错了就得讲。那个火炉还不跟我商量，就私自去买，现又不好用，这不白赞 220 元么？现在后悔有什么用，人家还钱给你不成？现又想用抽水机，我看你又花几百块买个后悔，有什么用？这一小缸水，用什么抽水机？七八桶就满了，以后我们都勤快些就行了，抽水机开关一次多少钱？用多少电？我看是做不成的。”


    爸咆哮起来：“你这蠢货，丫电，去电就去电，去钱就去钱，每次想买东西你都不同意，害得我也不好受，你我对敌，合不来的！看来你想死了，不是我死就是你死，我想这样好多了，我、我变、我变、我变坏，脾气坏，我想杀人、杀死！”


    爸爸真是太狠毒了，我真是太气愤了，真想一刀杀了他……但我会坐牢的，我又不想坐牢，如果是 10 年，我将是 25 岁，真不好！要知道我的前途是光明无比的，我不能轻生，不能这样做……我无奈……


    不知什么时候爸妈不吵了，但很久，很久就听到一声“畴”，我想是爸用熨斗吧，我真恨！接着，“畴”的一声更刮骨，我控制住杀人的念头，我想无论如何我都要考上宾中、考上重点大学，迎来新生活，现在毕竟此事与我无关，这是姐夫救我的……


    在这篇日记中，马加爵内心的痛苦和产生破坏性的根源已经一览无遗。这个时候，他只有 15 岁。而这种破坏性恰恰根源于挫折：贫穷、不睦的家庭，父母的争吵，父亲对母亲的暴行，严重地刺激了他的心灵和神经，同时也在他人格倾向中留下了凶狠暴戾的基因。在另一篇日记中，也仅仅是因为看电视时与奶奶发生冲突，马加爵就
    “恨死” 了奶奶。


    马加爵的这种以自我为中心是成长过程中逐渐形成的。虽然他家非常贫穷，但由于他是独生子，除父母的疼爱外还有两个姐姐的呵护，加上他学习出色，自小就是家庭的中心。


    这种以自我为中心，就是一种过度的自恋。因为从小受到的关爱，小时候的优秀，在心理上，这样的人往往会认为世界应该为他而转，他也是最优秀的。也就是说，他对世界有一种
    “人格失调性歪曲”，不是客观地看待世界和自己，而是以 “我” 为中心，以 “我的需要” “我的想法” 为中心看待世界。一旦现实不是如此，他就会产生失落感，甚至在心理上产生生命的挫折感。


    ### 逃避还是攻击？


    不幸的是这样的人注定要遭受现实的挫折，何况马加爵家里很贫穷。这样的挫折一部分是客观的，无法避免，一部分是主观的，是以自我为中心的人的心理产物。而当挫折降临，他又无法逃避时，这样的人常常会变得极端的敏感，而且具有一种
    “被迫害妄想”，把一切归罪于外界。


    也就是说，以自我为中心的人，在心理上难以接受挫折。他常常会用到两种心理防御机制，一是逃避，二是攻击。当逃避解决不了问题，破坏性就会淹没他。


    逃避是因为 “自我” 得不到外界的支持——不是所有人都像父母家人一样疼爱他，也不是所有人都不如他成绩好，更不是所有人都以他为中心，并且还有一个让他感到耻辱的贫穷压得他无法抬起头。这时，一个自我膨胀的人会陷于自闭，不想与人交流，封闭自己，切断与外界的联系，这样，外界就不容易伤害他那个自恋的自我。马加爵高中时有过出走经历，在大学里独来独往，不参加社团活动，他性格孤僻、不善交流的秘密就在这里。


    而攻击则是一个以自我为中心的人遭受现实挫折后的反应，上述几点已经在他心理上引起了生命的挫折。一个人的自恋如果遭到他所感觉的外界的伤害、破坏性就会侵入他的心灵，他就要报复。进入大学后，作为一个贫困学生，马加爵无论在哪个方面都处于明显的心理劣势。他不断地逃避与外界的交流，但他并不处在真空环境里，因此以自我为中心的意识总是遭受挫折，他自恋的自我总是遭到伤害。


    在这里必须说一句，贫穷仅仅是导致马加爵等以自我为中心的人遭遇生命挫折的因素之一，即使贫穷不构成挫折，也会有人际关系上的挫折，以及其他形形色色的挫折。它们都是对一个以自我为中心的人的威胁。在马加爵事件中，贫穷的家境仅仅是他的一个心理背景，它只是让他变得更加敏感，更加感受到“易受伤害”而已，它只是参与了他的以自我为中心对客观世界的歪曲。


    恰恰正是这种不断遭受挫折的自我中心主义，把马加爵拖入了破坏性的道路。当某个偶发事件的刺激与他当时的心境结合起来，破坏性被剧烈地触发，这颗“心理炸弹”便爆炸了。


    一颗“心理炸弹”的爆炸，或者一种心理症状的表现，都有内外两个原因：一是个人的心理结构，二是外在的现实刺激。为什么有那么多同样贫穷甚至更加艰苦的学生不像马加爵这样做人，更不像他那样去杀人？原因就在于，他们的心理结构与马加爵不一样。但我们也不能说，马加爵的变态、杀人与贫穷和社会不公没有关系。无论如何，外在因素都会给一个人带来生命的挫折，不管这个人是不是以自我为中心。


    ## 25. 发狠前，心里早就预演了无数次


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_113_0.png)


    > 一根稻草，没有什么分量。谁也不会把一根稻草放在眼里。可是如果你把稻草一根一根地往骆驼背上码放起来，最终总有一根稻草会把骆驼背压垮的。

    >

    > 再小的分量，积累起来，也可以沉重如山：切勿做添放最后那根稻草的事情！


    ![](img/f0502657e0e411adb97ccb25c15a5fc1_113_1.png)


    无论是周克华、霍尔姆斯、赵承熙，还是马加爵，虽然杀的人多，但并非连环杀手。中国的连环杀手也不多，最经典的，就是邱兴华了。他的凶残和变态已经远远超出了很多人的想象，2006年以来，没人能“超越”他。


    同样，让我们走进他的内心世界看一看。


    - **要注意不甘屈服于命运但又屡屡失败的具有施虐倾向的人**


    2006 年 7 月 16 日 夜，月黑风高，一件特大凶杀案发生在陕西省安康市汉阴县高山上的 一座道观里，共有 10 人被杀，包括寺庙住持及管理香火事务人员
    6 名，香客 4 名。


    凶手的凶残令人发指，居然把道观住持的双眼挖掉，把他的心、肝、肺掏出，切成片下锅炒熟，摆放在盘中……变态至极，让人毛骨悚然，连公安人员都被这只有一恐怖小说里才能出现的血腥诡异场景吓坏了。


    犯罪嫌疑人很快锁定为邱兴华。案发后他立即潜逃，在逃亡中又杀死一人。数百人经过一个多月的艰难搜捕，8 月 19 日才终于将邱兴华抓捕归案。


    那段时间里，邱兴华杀人事件以及此后关于他“是否有精神病”的法律与心理学争论轰动中国。至今，对于许多人来说，这个案件仍是一个超级变态的恐怖噩梦。


    他当然不是精神病人。


    和马加爵一样，邱兴华之所以沦为变态杀人狂魔，遵循的仍然是这样的心理逻辑：生命受挫导致破坏性的转向；越受挫，越有妄想，同时破坏性的能量也越大。当生命受挫达到极端时，一个导火索就会把他引爆。


    邱兴万家境不好，缺乏关爱，但又有小聪明。这对他意味着什么？意味着他从一开始就不断受挫，导致内心自卑，但又有对于自尊的强烈需要。这种人不干于屈服自己在社会价值排序上偏低的命运，一定要证明自己有“价值”。


    邱兴华存在着“自尊焦虑”和“成功焦虑”症。他所谓的自尊和成功，就是想占有社会上大多数人普遍认为有价值的东西：权力、美女、金钱等，拥有权力感，让别人羡慕他、怕他，甚至怕他的马屁。可以看出，邱兴华的生命受挫和“自尊需要”，让他养成了一种以自我为中心的、倾向于占有的、具有施虐狂特征的性格。无论是他耍小聪明给人修理机器时设置障碍，盗窃，还是杀人后称自己的尊严比
    10 条命重要，担心自己被鉴定成精神病后在监狱内所写的书，都可以看出这一点。


