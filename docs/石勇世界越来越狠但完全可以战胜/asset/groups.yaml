    一直垄断在政府手里，“农村土地集体所有制”作为土地的提供主体，在进入“市场”时缺席了。又比如，农民自建的小产权房一直被“打击”，尽管它的客观效果，可以通过它的低价位冲击而降低房价，从而让买得起房，也减轻政府在建保障房上的负担。而似乎与此遥相呼应，直到现在，一些地方政府对于“商品房”的热衷，远大于建保障房这一本属于自身的职能。


    当一些地方政府用一切手法维持房地产具有剥夺性的利益秩序时，不难想象会对民众形成何种诱导，又会让他们做出何种防御性的反应。在现代社会，一方面，假定政府权力应该被关进制度的笼子里，但在伦理层面，又假定政府应比民众更具有“道德血液”。如果这两种假定中的一种，更不用说两者，在现实中都没有兑现，要一个社会不变坏，不处于官民冲突的风险之中，如果说不可能，至少也是极为困难的。


    # 阶层


    房地产不仅可以让某些权力狂热，恶化国家和社会这一二元结构，它同时也是社会财富的收割机。它不是用来重构、恶化阶层关系的，但很不幸，在各利益集团的推波助澜中，它具有了这样的功能。


    中国的贫富悬殊，从来不仅仅是经济发展的自然结果。房地产在其中的能量，让包括股市这一吸钱的“黑洞”在内的任何行业都望尘莫及。说它通过把人们分成“有房阶级”和“无房阶级”，并在相互冲突的利益预期中构造出了第二种社会冲突——围绕房子的利益冲突和心理对峙，这并不夸张。


    2013年4月初，深圳。刚买房不久的“房奴”林天，和他的朋友、'
  - '[PAGE 186]


    30岁的“屌丝”刘哲雄结束了两年的友情。


    原因几乎不值一提：在一次聊天中，林天表示出希望房价能够继续上涨（尽管上涨下跌对于只有这套房子的他本人来说其实毫无实际意义），他明显还沉浸在终于告别无房的耻辱、跻身于“有房一族”的狂喜中，而没有顾及连首付的钱都没有的刘哲雄的感受。这刺激到了痛恨高房价的刘哲雄。双方争吵，分道扬镳。


    这只是房地产撕裂中国社会的无数例子之一。从“房叔”“房婶”“房姐”到“房奴”，到“没有房子结婚”的无数屌丝，有无房子，有多少套房子，因为它的财富分量、利益预期、身份认同、婚恋选择时的排序，整个社会出现深深的裂痕。


    这并非房地产本身有原罪。但它确实已经非常过分地被弄成一种资本，一种房子的“资本主义”：牟利的资本、抗通货膨胀的资本、娶老婆的资本、跻身于市民阶层的资本。这是对一个人的身份认同。与此相反，买不起房子的人，实际上在利益预期上、社会认同上、婚恋选择上，都处于一个被剥夺、被排斥的地位。依赖于高房价这一经济手段，房地产行业在对社会洗牌的同时，也完成了对底层社会的社会排斥。


    那些看上去不处于底层社会的中产阶层，又能好到哪儿去呢？按照中国的社会转型路径，以及一个社会稳定的需要，中产阶层应该越来越“壮大”才对，但高房价让这一切成为泡影。房价越高，中产阶层在房子，以及其他事项上越是要支付更大的成本，房子也就越成为少数有权有钱的人的游戏。所以并不奇怪，中产阶层发育的社会空间压缩的幅度，和房价上涨的幅度几乎同步：2003年前，中产阶层很风光，但随着2003年后房价上涨，逐渐褪去光环，而在房价已高得离谱的今天，这个社会群体已经灰头土脸了。和对底层的
    社会排斥一样，对中产阶层的这种打击，






