    # 40. 剥去衣服，我们仍然知道自己是谁


    许多人对“精神分裂”都有过体验，哪怕是微弱的体验。


    比如说，一个人在上司面前，由于利害关系，由于害怕，不得不把真实的自我、真实的想法掩盖起来，戴上“人格面具”，用另一张脸言不由衷地对应上司。他的那张脸其实只是一个伪装出来的面具（当然上司也不是用本来面目和他打交道）。实际上，我们在社会上所看到的每一张脸都有可能仅仅是面具。


    假自我就是这样取代人的真实自我，进而控制我们的心理生活，主宰我们与世界的联系。


    精神病学家莱恩认为，人与世界的关系只可能处于以下两种不同的状态：


    一种是自我真实地感知对象，自我体现出来的感情是生动的、有要点的、可把握的；自我所承诺的行动是真实的、真诚的。你和你的朋友讨论问题时，就是这样。


    而在另一种状态中，个体把自己与他人的所有交往都推诿于一个假自我系统。这个系统包括在他的存在之内，可并不等同于“他”，这个假自我系统只能体验到不真实的世界。这也就是说，在人和世界的关系中，知觉和行动的大门钥匙并没有掌握在自我手里，而是被假自我所控制。这假自我作为一个心理系统，阻碍、排斥真自我与世界联系的参与。


    莱恩将人与世界关系的第二种状态称为“精神分裂症”。准确地说，多数人处于这两种状态之间，并偏向第二种状态。在心理上，我们往往不是自己的主人。




    ![](img/f0502657e0e411adb97ccb25c15a5fc1_160_0.png)'
  - '[PAGE 161]


    这也就是说，在这个世界上，有很多人实际上是用一个假的自我在与自己和他人打交道。从哲学上讲，这种存在就是“异化”；从心理分析上讲，它既是一种神经症的“症状”，又是各种“心理症状”的根源。


    如果镜子中看到的不是自己，或者说一个人并不是真实的自己，那么，那个被他体验和表达为“我”的东西是什么，就非常值得玩味了。


    我曾经就同一个问题向三个人提问，他们分别为大学生、公司白领、公务员：假如有个人无端地辱骂了你的朋友，你站在一边，骂人者并没有看到你，也没有骂你，你会生气吗？如果你生气，为什么？


    这是一个“思想实验”，这类实验在政治哲学上屡见不鲜。为了说明问题，我出题有些极端，并把它搬到了精神分析上。


    一开始，我没想过这种“思想实验”会让他们都受不了，纷纷说“这个人变态”“他神经病”等。我再三解释，请他们不要作任何好坏之类的价值判断，只是正视这样的事实：自己到底生不生气？如果生气，追问一下自己生气的原因。


    他们都说自己肯定很生气。但解释为什么生气却让我啼笑皆非，都是“因为他骂了我朋友”。我告诉他们这不是答案，只是提供的“事实前提”，把已经提的事实前提当成答案，这是答非所问。


    我告诉他们，如果能够把这些日常生活中的现象当成一个真正的问题进行思考，一个人就会逐渐打开认识自我的大门。


    我说：如果一个人骂了你的朋友，我们可以观察到，这个人是在向你朋友“发送”有价值判断的语言指令，他并不是在向你“发送”，所以应该只会在你朋友那儿激起反应，怎么可能让你很生气呢？学生和白领脱口而出：这相当于是在骂我。


    不错，这就是答案。骂他们的朋友，在心理上等效于骂他们，因为他们已经把朋友纳入到了自我结构，朋友变成了自我中的一部分。'
  - '[PAGE 162]


    正是通过把朋友纳入自己的自我结构这一心理机制，他人对朋友的“刺激”才可能会在自己心中引起反应。也就是说，在心理上，个人刺激的并不仅仅是他们的朋友，还有他们自己。不管自己或朋友在不在现场，在他们的心理上都是“在场”的。


    我们常常听到有人说“他和我无关”之类的话。这意思有时候是“他并没有被纳入我的自我结构”。朋友可以变成我们的自我，亲人当然更是如此，那么，还有什么东西可以变成我们的自我？


    人是存在者。我们确定一个人的存在的思维方式是：他叫张三，是一个男性，是南方人，是大学生，身高一米七，很胖，穿夹克……这些，就是一个人的存在属性，它包括一个人的生物属性和社会属性。


    一个人拥有无数种存在属性，它们绝大多数都是社会属性，也就是说是通过一个人在某个社会的存在而获得或被强化属性。比如，我生在中国，当然我就拥有一个“中国人”的存在属性了；我是南方人，“南方人”也是我的存在属性。对于很多人来说，他们体验自己和他人的方式不是体验存在本身，而是体验存在属性。人们只是在用名字或“那科长”“这医生”去指称一个人。换言之，只是在说一个人的存在属性，不是在说他这么一个人。


    剥去了存在属性的皮子，人们将不知道这么一个人是谁。


    他被抽空了。他一无所有，也就一无所是。


    如果一个人是医生，他就会把“医生”这种存在属性体验为他的存在。慢慢地，“医生”也就变成了他的自我。有人骂医生，哪怕不是在骂他，他也生气了。同样，有人赞美医生，哪怕不是在赞美他，他也高兴。


    不仅仅是“医生”，所有的存在属性都可以被一个人体验为自我，因为正是这一切界定了他的存在。同样，价值观、偶像、物品甚至宠物……一切在心理上对他有意义的东西，都可以纳入他的自我结构。'
  - '[PAGE 163]


    为什么两个争论问题的人容易从争论上升为谩骂？争论原本只涉及观点，而没有涉及人格。然而，一旦他们认同自己的观点，这类观点就会内化，变成他们的自我。自己的观点被质疑、否定，在心理上也等于自己被质疑、否定。因此，不涉及人格的观点的较量，常常会变成人格上的相互攻击。不要说这种现象在网络上泛滥成灾，就是在正襟危坐的知识分子那儿，也屡见不鲜。


    我在网上曾经看到有个女人谈她的心理问题。


    她的男朋友才华横溢，但长得实在让人不敢恭维，不单其貌不扬，而且个子比她还矮。他们感情不错，但有一个问题，就是长得很漂亮的女方很少答应和男友一起走到大街上。有时候一同出去，她眼光总是怪怪的，低垂着头，似乎害怕别人扫向他们的目光，陪他逛一次街对她来说简直是一种要命的折磨。然而在家里，她却表现得感情非常热烈。


    她说自己是一个很爱关注别人的意见的人，凡事都太过谨慎，比如要做什么事总是会先考虑别人对她的看法。


    我强烈地感觉到，她只要一出家门，就再也不是她自己。她的生存是一种“无我化生存”的典型，他人的目光已经完全主宰了她对自我价值的确认。她活在他人、社会的意见中，没有一个独立的自我来肯定自身。要获得心理生存，她要么必须把自己和外界隔离开，要么期待获得外界的肯定性评价。可是，她的男朋友的外貌实在拿不出手——最主要是在大街上，别人只看见他的外貌，看不见他的才华，和他走在一起，在别人的目光中，她实在难以找到自身有价值的感觉。


    换言之，只有在家里，她才有自我认同，一出门，这种自我认同就崩溃了，换成了社会认同。她的自我急剧萎缩，被社会自我取而代之。'
  - '[PAGE 164]


    # 41. 魔鬼和陌生人都让我们不安


    在我们的日常生活中，最难以解释的一种现象是：当一个陌生人出现在我们的生活中时，我们总有一种不适感，一种不安。我们一定要弄清他是谁，想界定他，终结他的陌生状态。而在很多时候，一个人对于另一群人来说，要么就成为朋友，要么就成为敌人，没有中间状态。从古至今，人们遇到某种他们无法解释的神秘现象时，都倾向于将它认为神仙或者魔鬼所为，总之是一种神力或魔力的展示。


    美国从立国开始，直到现在，随时都需要一个敌人。开始是英国，后来是德国，再后来是苏联，现在则是“无赖国家”和“恐怖主义”。至于中国和俄罗斯，表面上不叫敌人，在战略上则是防御对象。


    对“敌人”的渴望简直就是美国的一种“先验渴望”。


    这些现象都指向了人与世界的基本结构：主体一客体结构。蒂利希说：“自我—世界(self—world)的相互关联是实所具有的基本结构，如若世界一方消失，那么另一方自我也就消失了，留下的只是它们共同的基础而不再是结构性关联。”人是一种二元化的存在。有自我，就有他者，有自我世界，就有他者世界。“自我—世界”的结构是一种方向性结构，没有这样一个结构，人就会找不着北。


    于是，这种“自我—世界”的方向性结构在人的精神那儿建构了一种秩序。这是一种心灵的秩序。如果这种秩序崩溃，人理解世界的方式就会失效，焦虑就会袭击他。


    陌生人之所以让我们不安，是因为他的存在已经逸出了我们心灵的秩序，让我们理解世界的方式失效。当他已经进入我们的心理生活，而不只是在街上一闪而过的时候，只要我们无法确定他是谁，他对我们来'
  - '[PAGE 165]


    说就是危险的。极端一点，他要是我们的朋友，要是我们的敌人，否则，我们不知道该怎么样和他相处。


    同样，如果一种神秘的现象超出了我们的理解能力，我们就会倾向于认为它是神仙或魔鬼干的。由于它是无法理解的现象，没有来头，无法确定，就威胁到了我们的心灵秩序。因为如果它不是一种可以确定的客体，作为主体的我们的自我就会受到威胁，风雨飘摇。所以，我们一定要把它拉人到这个心灵秩序里来。不管是神力还是魔力，总可以确定（当然是想象性的确定），总在我们的心灵秩序之内。


    没有秩序的保护，对于我们来说是何等可怕的心理灾难。


    不知你是否有过这样的体验，当你等待影响你命运的考试成绩时，简直可以说是一种漫长的煎熬。在考试之前，你的存在是在一个秩序中的，很多东西都可以确定。考完试，在结果出来之前的这段时间里，你就被抛入了一种没有确定性的心理生活中，成绩如何你无法确定。这个时候，不确定性对于你就构成了一种焦虑。


    为了摆脱这种焦虑，你或者设想自己考得不错，借此来说服自己不要担忧；或者设想自己考得很差，从而把焦虑转化为恐惧，并通过预先接受这一设想的结果的方式来消除恐惧。总之，你一定要从焦虑中摆脱出来。因此，在等待很漫长，或者说由于你投入了过多的关注而使等待显得很漫长时，你会急切地希望结果快点出来，哪怕不是好的结果——因为你可以解脱了。


    人，在心理上已经被这种“自我—世界”的心灵秩序所控制。要瓦解这种秩序，只有两种可能，要么成为精神病、痴呆傻，要么成为已经开悟、“四海为家”的高人。看起来，精神病、痴呆傻倒是有一大堆；据了解，在世界各地的隐修者中，这样的高人没有几个。'
  - '[PAGE 166]


    # 42. 被世界分裂成两半之痛


    “自我一世界”的存在结构、心灵秩序对于人来说既是福音，也是咒语。准确地说，它对人的认知是福音，对人的心灵是咒语。


    如果没有“我”，也就没有世界，正如没有世界也就没有“我”一样，因为世界就是“我”，“我”就是世界，混沌一片。所以，人类要想发展生产力，创造出物质财富，就必须认识世界，而认识世界的前提是他必须从世界那儿分裂出来，使自己与世界区别开，并把世界当成认识的对象。“不识庐山真面目，只缘身在此山中”。如果没有“跳出庐山”，如果没有“自我意识”“对象意识”之分，不要说现在有汽车电脑，恐怕人类还待在树上呢。


    所以，人与世界分裂得越彻底，越能认识世界。很多人已经认识到，从近代起，中国之所以落后于西方，是因为“天人合一”这种关于人与世界的理解模式的严重制约，中国人没有很好地在意识上跳出世界之外看世界——用“天人合一”的眼光看世界，必然模糊一片。


    随着文艺复兴，启蒙运动，几次工业革命，再到现代高科技的兴起，人类创造了古人根本无法想象的巨大生产力，上天入地无所不能。地球似乎真成了一块“流着奶和蜜的土地”，可以让人类恣意地索取甚至掠夺。在“自我一世界”的存在结构中，作为主体的人早已把自然当成征服的客体了。他与自然之间的关系越来越彻底地成为一种敌对关系。地球再也没有精神的灵性，它不再是一个家园，而是一个巨大的工地。


    这一切反映在人的心灵上，构成了一种巨大的灾难。在认知上他的自我越是与世界分裂，在心灵上他对世界、对自己、对他人就越感觉到陌生和对立。在认知上他越是能把自己与外界区别开，在心灵上他就越'
  - '[PAGE 167]


    感觉自己被分为两半。因此，富有讽刺意味的是，在人为呼唤出巨大的生产力的同时，也呼唤出战争、屠杀和敌对；在人享受古人想象不到的物质财富的同时，他们也被古人无法理解的心理危机、精神危机淹没。


    1947 年，法兰克福学派的两位哲学家霍克海默和阿多尔诺说过这样的一句话：“神话把非生命与生命结合了起来，启蒙则把生命和非生命结合了起来。”


    他们的意思是：神话召唤着人敬畏自然，亲近自然，把自然变成有生命的精灵，融入人的精神世界；而启蒙则让人抹掉自然的神秘，征服自然，把自然变成死的客体，带入人的精神世界。正是启蒙，呼唤出了现代社会异化的幽灵。


    一旦人将自然当成思想和行动的对象，主客体之间出现权力支配关系，那么人与世界的分裂就变成了人本身的分裂。在世界的客体化过程中，人也日益客体化，即从人变成物。


    人与世界的异化，同时就是与自已、与他人的异化。正是这一点，决定了现代人由人的存在所产生的焦虑有可能演变成病理性的焦虑，而且每个人都无法逃避的存在性神经症在现代社会演变成了形形色色的病理性神经症——包括社会上的、临床上的。'
  - '[PAGE 168]


    # 43. 猪和神仙为何同样逍遥自在？


    从人的角度来看，猪和神仙都没有痛苦，而人则被痛苦折磨。我们有时候挺羡慕猪，也幻想成为神仙。这真让人不知是想哭还是想笑。


    可以看一下猪、人、神仙在宇宙中的存在定位。也就是说，作为一种存在，猪、人、神仙是怎么样的嵌入这个宇宙的结构中的，反映在三者的精神结构上又有什么不同。


    猪的存在定位相当于人还在伊甸园时的存在定位，作为一种隐喻，对应于人的动物状态。那时人没有思想，没有自我意识，却无忧无虑，严格来讲还不能称之为“人”，还没有从世界中分裂出来。这样，它就只靠本能驱动，其存在是被规定好了的。我们可以说，猪与世界是一体的，它是世界的一部分，与世界处于自在同一的状态。由于没有在意识上把自己和外界严格区别开来，猪也就会感受到世界的威胁。它没有存在的焦虑，没有痛苦。


    神仙似乎不受任何限制，在天空中飞来飞去，极度的自由，这种状态和没有自由的猪形成了鲜明的对比。而且神仙也没有一点痛苦，这种存在状态，是一种完满的存在状态，神仙已经和世界统一了。我们把这种存在状态称为“完满统一”的状态。一旦和世界实现了完满的统一，那么神仙不仅有完整的自我意识，而且没有一点痛苦，因为世界在心理上也威胁不了他，他突破了有限性，他就是世界。


    而人在宇宙中的存在定位，恰恰就夹在猪和神仙这两者之间。一方面，他变成了人，超越了自己的动物状态，不再像动物那样是一种被规定的存在。但另一方面，他又永远无法摆脱自己的动物状态，永远成不了神仙，永远被有限性所主宰。他从自然之家那儿走出来，永远地失去了那个家园。'
  - '[PAGE 169]


    他向神仙走去，却永远走不到神仙居住的地方。


    这就是人的悲剧性命运，或者说人的存在困境。哲学家们把人的这种存在称作一种“缺陷”——人是“宇宙的畸形儿”。


    我们大都有这样的体验：小时候渴望长大，长大后又想回到童年。很多人为此在心理上拒绝成长，有些人还“装嫩”。这种“装嫩”除了有意识的作秀以外，实际上还有一种无意识的强烈需要，就是重返或体验童年。


    有一种心理现象叫作“退行”，就是人在心理上想退回童年的那种状态。现实太危险了，而在心理上退回童年，则要安全得多。在童年时代，年少无知带给我们欢歌笑语，而在成人社会，到处都是陷阱和威胁。自从有人类起，几千年来就一直在讲述关于“从前”的故事。在这些故事中，《圣经》的故事特别忧伤、凄美，也特别深入人心。


    《圣经》里这样记载：从前，在上帝的伊甸园里，人类的祖先与自然和谐地融合在一起。后来，毒蛇引诱夏娃偷吃了智慧树上的果子，夏娃又拿给她丈夫亚当吃。于是，他们二人的眼睛就明亮了，看到自己赤身裸体，感到羞耻。上帝知道后，便将他们赶出了伊甸园。从此，女人要经受怀胎生育的痛苦，男人要终身劳苦工作，这就是上帝对人类的惩罚。从此，人类诞生。人类再也不能返回伊甸园，两个手持发出火焰的剑的神挡住了人类的“回家之路”。人走出给予他安全感和温暖的伊甸园，被抛弃到一个陌生而危险的世界，在心理上备受煎熬，便无时无刻地想“回家”。这个“家”，首先是精神上的家园，人毕生都要寻找，没有这个“家”，人在心理上都存活不下去。


    “回家”，从哲学、精神分析上说就是人基于存在所产生的需要。弗洛姆认为，人有五种发源于存在的基本需要。不管这些需要是真实的还是虚假的，都要满足，否则人就要发疯。焦渴难忍的人一定需要液体来'
  - '[PAGE 170]


    滋润自己，不管是清泉还是毒酒，他都要喝下去，而很多时候他甚至根本不知道自己面对的是救命的水还是致命的毒液。


    # 第一种需要是联系


    人走出伊甸园后，就失去了与安全世界的天然联系，他的孤独、渺小、焦虑迫使他重新建立与世界的联系。人无法不与世界联系，有的只是不同的联系方式。如果我对这个世界怀着一种爱，就用爱和世界建立了联系。在爱中，我既没有丢失自己，也肯定了他人。同样，我也可以沉迷在民族、国家、明星这样的偶像崇拜中，通过把自己变成他们的一部分来获得世界的联系。然而这种联系往往会否定我作为一个人的独立性，从而破坏我的健全的精神结构，导致我心理上产生畸变。马克思说，人是一切社会关系的总和。一个人投入社会关系之网，就是与世界建立联系。


    # 第二种需要是超越


    人从“动物性”向“神性”走去，要求人必须自我超越，肯定自己的力量。人是被造出来的，但同时他必须证明自己是创造者。如果他不能通过创造性来肯定这种力量，也会通过破坏性来肯定它。小小孩子在最小的时候喜欢撕东西，即是一种“超越”的“本能冲动”。人们搞艺术、创造思想体系，即是一种超越自我的需要在驱动。在这些活动中，人体验到人的力量。同样，有的人虐待别人、虐待动物，也是这种需要的变态满足，在这种虐待行为中，人同样感觉到了人的力量。还有更极端的人制造各种暴力事件，如绑架谋杀、黑社会血腥复仇、恐怖组织自杀式爆炸袭击等等，也都是在通过破坏性来证明自己的力量。






    ![](img/f0502657e0e411adb97ccb25c15a5fc1_170_0.png)'
  md: '

    利益联系在一起，后来慢慢地就和你的心理联系在一起，你必须捍卫它，必须唾弃、遗忘甚至仇恨当初的那个自我，因为它无论对你现在的利益还是心理都是一种威胁。


    所以，每个人似乎都有一种“本能”，在照镜子时阻止自己，不要让自己感觉自己很陌生。


    如果发现了自己很陌生，他也不敢再追问下去。因为他只要把“谁是我？”追问下去，那个维持他心理生活的社会自我就会分崩离析，像烟一样散去。


    他会感到一种不可忍受的虚无感，焦虑和恐惧会吞噬他。


    而被扼杀的自我此时仍然在黑暗的地下室里，等着他去唤醒，也随时准备谴责他。


