    # 19.政府最先变狠


    一切好像又要扯到改革的问题，扯到政府该怎么干的问题了。

    最关键的是，政府不能变狠。就是说，要进行正确的定位，回归职能。


    # ◇ 谁愿意掏钱去请一个人来强制自己呢？


    改革说穿了，无非就是要“政府的归政府，市场的归市场，社会的归社会，个人的归个人”。但30多年了，时至今日，在政府权力的越位下，摆在我们面前的，仍是一个脆弱的市场、一个深度分裂的社会、一个原子式却又容易被情绪聚合在一起的个人。


    能否真把政府权力“关进制度的笼子里”，是对新一届执政高层、新一届政府的严峻考验，也是显示他们政治诚意的试金石。其中的政府机构改革、行政审批改革、社会管理改革等，无一不指向对政府角色的重新定位，对政府权力边界的清晰划分。


    政府并不是一种自然的存在，是人为为了某种目的成立的，因此它的存在是否合理，需要通过做了什么和不做什么来进行评估。它不是公司，不是强盗团伙，不是协会组织，不是公民个体，其边界划分，决定了它的定位。越界，只能引起功能紊乱，作为一种“必要的恶”，也许就没那么必要了。


    作为行使公共权力的机构，政府的功能说来很简单，人们要成立它，委托它来干什么？


    很显然，除非有病，没有谁会去委托一个拥有强制力的人来不准自己这样做那样做，强迫自己这样做那样做。同时，也没有谁去委托一个






