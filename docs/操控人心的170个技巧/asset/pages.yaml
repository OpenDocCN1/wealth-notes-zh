    # 二、


    像《哆啦A夢》裡頭的骨川小夫，這種討厭的傢伙比比皆是。斜眼竊笑別人的失敗：「這種事也做不到啊？！」或對自己的功勞感到自豪：「嗯，反正你們是辦不到的。」「總之三兩句話就能惹人生氣。


    想和這種人相安無事，首先得調查對方的身家背景。故鄉、出生年月日、興趣、喜歡的人類型、喜歡的音樂、討厭的東西、家庭成員、朋友關係、腳的尺寸、愛車等等，總之鉅細靡遺地收集資訊。


    如此，之前只覺得是「討厭的傢伙」，不知不覺間變成「雖然討厭卻有興趣的傢伙」。


    這是愈瞭解對方愈增添親近感的心理作用。既然都得往來，與其勉強為其難地見面，多少對對方表示興趣，才能相處愉快。'
