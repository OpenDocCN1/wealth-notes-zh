    對比自己地位低的人以高壓方式說話，或採取攻擊性態度。這種問題人物，其實度量非常狹小。


    例如對於總是嚴厲斥責的主管感到氣憤，但是對方是上司又不能直接抗議；或是老是被嚴格的雙親支配，無法隨心所欲而累積壓力。


    換言之，**原本這種煩躁感應發洩的對象是比自己強的人物，因此積在心裡說不出口。**


    所以才對弱者發洩不滿、消愁解悶。


    如此，**怒氣轉向對象以外，在心理學稱為『置換』，至於被發洩的對象，只覺得蠻橫無理。**


