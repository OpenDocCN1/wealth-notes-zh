    # 想封鎖反對意見時

    請利用「同調」的技巧


    小孩在纏著要東西時，總是會說：「這套遊戲我的朋友都有！」如此聽來，有些父母會害怕只有我家小孩被排擠，出於不安而不由得買給孩子。


    若指責這樣會寵壞孩子則言之過早。因為所有人都無法反抗「大家」或「多數」這種詞語。團體中的異議分子會被討厭早已是定論。所以，有些人不想掀起風波，不由得順從多數。這種行動稱為「同調」。


    只要利用這個心理法則，就能輕易封鎖對立的意見。

    比如說有個對手會反駁你的提案。這個時候，不妨事先疏通招集贊同者。在會議上如果大家一齊贊成，這名對手勢必難以提出反對意見。只要有多數人支持自己，


    對「敵人」強力施壓。

    附帶一提，事先疏通時最好優先說服會贊同的人。如果告知連誰都「贊成」了，再難應付的對象也能輕易說服。


    > 勾起目標對象的

    心理術'
