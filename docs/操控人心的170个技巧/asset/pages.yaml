    # 常用擬態語的人談話內容


    # 欠缺具體性


    「秤」、「咻」、「滿滿滿」、「霹靂啪啦」等擬態語，大家都會在對話中使用。


    但是，我們不妨說常用這些詞的人談話內容欠缺具體性。


    譬如當你確認：「工作的截止日期是何時？」此時對方回答：「霹靂啪啦把工作完成。」


    # 你想要具體的答案


    期限，卻只得到抽象的回答。


    想從這種人得到具體的答案時需要一點訣竅。


    假如對方說：「霹靂啪啦把工作完成。」，「霹靂啪啦嗎……？」「你也同樣霹靂啪啦嗎？」「霹靂啪啦」


    # 具體回應


    於是他會改成具體地回答：「嗯，麻煩在傍晚前完成。」


    雖非以眼還眼，不過「以擬態語回應擬態語」是很有效的對應方式。


