    # 以一句「我們」

    使對方無法違逆


    被朋友拜託：「你能幫我一個忙嗎？」如果你無法抽空就會拒絕：「不好意思，今天不行。」


    可是，「你能幫我一個忙嗎？」後面要是接一句：「咱們是朋友吧？」結果會如何呢？當下變得難以拒絕吧？


    這是因為「咱們」或「我們」這些詞，具有拉攏他人變成「當事者」的力量。經這麼一說，總覺得無法違抗。


    所以，假如公司裡有不合作的職員，不妨使用「○○們」的詞語。所有人分頭趕工時，如果他匆忙地準備回家，就對他說：「再堅持一下，藉由我們的力量在今天完成吧。」於是大家也點頭稱是，再怎麼特立獨行的人也會無法違逆團結一致的氣氛。


    +   *   評價：★★

    *   效果：★★★★

    *   程度：★★★★'
