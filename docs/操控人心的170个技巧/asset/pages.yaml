    # 禁斷的心理測驗 No 17


    Q. 你常夢見什麼？


    +   A．浴室

    B．警察

    C．醫院


    +   D．小偷

    E．正在洗東西

    F．正在吃東西


    # ★診斷★

    從本測驗可得知…

    你隱藏的欲望


    …選擇 A 的人…

    想排除自己的煩惱。


    …選擇 B 的人…

    希望受到保護不替自己或他人的衝動情感傷害。


    …選擇 C 的人…

    想逃離不安。


    …選擇 D 的人…

    想像小時候那樣被寵愛。


    …選擇 E 的人…

    希望罪行被饒恕。


    …選擇 F 的人…

    想得到愛。'
