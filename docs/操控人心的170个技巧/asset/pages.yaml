    # 「一般而言……」後面隱藏了那個人的真心話


    拚了命地做簡報，最關鍵的負責人卻面無表情，猜不到他的心思。


    如果得面對這樣的人，不要直接問：「您覺得如何？」反正問了對方只會冷冷地迴避：


    「因為我無法判斷，我們回去後再回覆您。」他絕不可能說出自己的真心話。


    不過，這種人倒是很愛講關於自己真心話的事情，「一般而言看法如此」或「主管或許會如此判斷」，他擅於置身事外地批評。也許他想表達的自己頗有見識。


    並且有趣的是，他的批評至少包含了個人意見。


    所以，如果他吐露真心話，不妨改口問：「一般而言會是如何？」、「若是○○部長會如何判斷？」「如此一來，他應該會吐露真心話。


