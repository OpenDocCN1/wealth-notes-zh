  md: '# 若想拉擻對方

    只須說「的確」即可


    世界上絕對有意見的分歧與對立。理應互相讓步試圖解決，但若是可以，內心還是希望堅持己見。


    此時最好使用「的確」這一詞。對於異議與反論先點頭稱是：「的確。」看似接受對方的意見。對方聽了以後誤以為你贊同他的意見，其實續與正好攔反。


    好比對方詢問：「這個交期很趕呢。」你先認同：「的確很趕。」於是對方就會語氣和緩。


    然後你再提出替代方案：「可是在這天之前完成，之後的發展會更順利。」結果就能巧妙換論點，保有自己步調。正面反駁不算有能力。利用「的確」先表現出接受的樣子，就能巧妙拉擻對方。


    【評價】效果★★★

    禁忌度★★'
