    各位聽過「心錨」這詞嗎？這是指由於被一開始所給予的訊息所束縛，只能依此標準判斷的心理狀態。下錨的船隻，只能在一定範圍內活動。便由此產生這個比喻。


    而心錨的技巧，在日常生活中處處可見。身邊最常見的，特實品的價格標籤也是心錨的一種。


    比方說寫了1萬日圓的定價數字用線劃掉變成5000日圓，多數人會覺得很划算。


    刻意標出原價正是趣旨所在，1萬日圓發揮了心錨的作用。首先，定價植入意識中，特賣品能給人更便宜的印象。然後驅使顧客衝動購物。


    因此，若想操控對方的情感，只須在心中拋下心錨。


    價格標籤是非常易懂的例子，在談話時也能偷偷拋下心錨。這時要將肢體動作當成心錨使用。


    聊到高興處就揮動右手，談到傷心事或金錢話題時只動左手。'
