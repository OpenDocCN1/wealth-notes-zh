    # 讓自己的夥伴坐在中意的位子

    主導會議的流程


    參與會議的人很多。開會時事先確認誰坐在哪裡會有很大的幫助，這件事你知道嗎？乍看之下漫不經心地隨意入座，其實座位的選擇反映出每个人的心理。在此假設會議使用的是長桌，先來瞧瞧此處隱藏了何種心理。長桌的短邊大多是領導者或會議主席的座位，反之如果決定了領導者，其他人應避開這個座位。另一方面，積極發言的人或想掌握主導權的人，傾向於選擇長桌的正中間。附帶一提，接近領導者的座位是輔佐領導者的人，或者多半是想巴結領導者的人。反之離領導者較遠的座位，通常是不太積極參與的人，或是沒什麼意見的人。無論如何，可以想成對會議不感興趣的人。因此若想讓自己的意見通過，搶個好位子非常重要。不僅得搶到中間的位子，也須注意坐在正前方的人物。其實，意見對立的人，很有可能刻意選擇正對面。


    ![](img/8b80f1c1c51775592ad72214b19a6753_38_1.png)'
