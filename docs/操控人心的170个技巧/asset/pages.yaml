    # 對於頭髮稀疏與白頭髮的處理方式

    可以得知他的性格


    年歲增長最在意的事情之一，就是頭髮的問題。男性很在意秃頭或頭髮稀疏，女性也有人很在意白頭髮，從面對頭髮問題的處理方式，也能得知這個人的個性與生活態度。


    首先，不遮蓋稀疏的頭髮或白髮，呈現原原本本的自己，這種人適應性強，面對任何事都能自然的趨勢中接受。對於目前自己的人生也有一定程度的滿足，不假修飾、坦率而受到周遭人們的仰慕。


    相反地，將白髮染黑顯得不自然，利用假髮或髮型掩飾頭髮稀疏的人，有點華而不實的心向。總是在意自己在旁人眼中的模樣，即使違反年齡也想保有年輕的自己。這種人積極進取，無論幾歲總是持續挑戰新興趣與新工作。


    另外，反正頭髮稀疏就乾脆將頭髮全部剃掉的人，或者把白頭髮染成紅色或紫色的人，非常正派，善於交際。對於自己稀疏的頭髮或白髮，能夠樂觀自嘲、一笑置之的也是這種人。


