    如果想探聽下屬的真心話，不妨選擇能舒服坐下的店。如果有舒適的沙發就更無可挑剔了。儘管一開始很緊張，柔軟的沙發能讓人慢慢地放鬆身體，具有舒緩緊張感的效果。


