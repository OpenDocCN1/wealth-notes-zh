  md: '另外，無論如何都想讓對方說出「Yes」時，只須詢問：「何者較好？」就能從對方心中消除「拒絕請求」的選項。或者在語尾加上「吧」表示親暱；對方就難以說出「No」。


    > 要學這麼簡單，就能自由操控他人。要是懂得訣竅，無論遇上多麼難搞的人也不怕。


    本書所介紹的方法都非常簡單，希望各位從今天起開始實行。各章末尾都有心理測驗，能以遊戲般的感覺嘗試。


    當然嚴禁濫用，究竟要在哪些场面中如何運用這些技巧，完全操之在你。


