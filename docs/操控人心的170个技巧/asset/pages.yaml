    # 拒絕時不想被討厭

    只須「部分迴避」


    想表達「No」的意思時得十分小心。「辦不到」、「沒辦法」，如果斷然拒絕雖簡單明瞭，卻要擔心是否引起對方不快。


    想迴避責任避免造成不愉快，只同意一部分最後再拒絕才是聰明的作法。


    「雖然我想承接，但是我不瞭解這個領域，可能會造成您的困擾。」——如此婉轉表示，


    這麼一來，對方也無法再強求。附帶一提，「拒絕的部分」若表現出和自己扯上關係就會有負面影響的語氣，將更有效果。


    當然，對方未必能夠認同。老是找藉口迴避責任，只會被貼上「不可靠的傢伙」的標籤。


    另外請注意，千萬不要強迫如此拒絕的人。假如失敗時，責任反而會被推到身上：「所以我才說辦不到嘛！」


