  md: '# 以時間順序談話的人


    # 很在意他人的評價


    有些人說話從發生順序一一五十地說明：「對方先是這麼說，接著變這樣……」這種人通常很在意他人的評價。


    因為他認為如此仔細地說明對方會覺得親切。他深信如此對方便會高興，自己的評價也會提高。


    可是，如果對方想要先聽結論，反而會降低評價：「說話拐彎抹角的，又臭又長！」因此，反倒拚命地想提高評價，讓談話變得更囉嗦。


    和這種人對話時，不妨先擺出時間限制：「等一下我有事，時間不太夠。」如此一來，他會努力盡量簡明扼要地對話。


    或者在對話途中插嘴：「原來如此！結果最後怎麼了？」「一邊表現出很感興趣，一邊引出結論，便能不傷他的自尊心縮短談話時間。


