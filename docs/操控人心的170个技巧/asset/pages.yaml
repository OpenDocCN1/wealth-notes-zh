    # ### 頗願叫對方的名字

    ### 是因為想要拉攏人


    很多人在場的場面中，「○○先生，這個就拜託你了。」

    如此指名道姓是很自然的事。可是，

    儘管是兩人會面，如果仍沒必要地直呼名字：「這也拜託你了，○○先生。」或「關於這件事我想聽聽你的意見，○○先生。」

    對方肯定想拉攏你。


    因為**被人叫名字**，會**提高對對方的好感度**。

    的確，比起呼喚「喂」或「那個」，叫名字較有親近感，也會覺得自己的存在受到理

    解。


    換言之，連呼名字的人，很有可能瞭解這種心理，想拉攏你到自已這一方。

    不過，這個效果只限於某種程度，太頻繁地直呼名字也會讓人覺得討厭。呼喚名字太超過的人，或許並不十分理解他人的心理。


