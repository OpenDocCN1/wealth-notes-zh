    # 與其直接稱讚當事人，

    不如用傳話的方式稱讚


    課長對你說：「最近你很努力喔！」和部長說：「○○課長說你最近很努力喔！」後者更令人加倍喜悅吧？


    這是因為間接被稱讚，**表示至少被2個人稱讚**。而且**也想要獲得更多好評**。


    因此，如果想激勵自己的下屬，就在與下屬有較多機會接觸的人面前提起：「他是能夠整合團隊的出色領導者。」如此一來，對方就會傳話：「○○先生說你能夠『出色地整合團隊』喔。」


