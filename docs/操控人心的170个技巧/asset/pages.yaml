  md: '# chapter3


    # 讓對方說出「Yes」的技巧


    Skills psychology technics


    # 無理的請求藉由「所以」能使對方說出「Yes」


    明明在趕時間，眼前的隊伍卻沒什麼動靜令人煩躁。當然，此時強行插隊絕對會惹人討厭。因此，要教大家聰明插隊的方法。


    # 就是清楚表明理由。


    「我趕著要影印，可以先讓我印2頁嗎？」


    「不好意思，可以讓我排前面嗎？火車在10分鐘後就要發車了。」


    如此傳達意思，聽者便容易接受。


    一般人不想回應理由不清不楚的要求，「我想要」、因為「若揭示理由，對方就不會認為你在無理取鬧，而是因為你有正當理由，所以請你幫我。",


    # 瞭解你行動的正確性便會認同


    此時無需特別的理由，只須使用「因為」、「所以」等語句，聽起來就煞有其事。


    在談判的場合也可以加上一句：「務必請您協助。因為我們很想和你們一起共事。」成功的機率就會一舉提高喔。


    +   - 評價：★★☆☆☆

    - 效果：★★★☆☆

    - 惡意度：★★☆☆☆'
