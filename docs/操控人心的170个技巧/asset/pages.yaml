    如果談話時對方屢屢中斷，很有可能他正在說謊。


    因為說一個謊，就必須說其他謊言來圓謊。不僅如此，又用新的謊言來避免穿幫……而開始修飾謊言的作業。


    譬如朋友約你出門，你謊稱頭痛而拒絕了。過了幾天，朋友問：「你有去醫院嗎？」你又說謊：「有。」結果他追問：「那你有做MRI（核磁共振）的檢查吧？」你又謊稱做了。


    可是，實際上你連MRI是什麼檢查都不知道。從這時起你不知該如何替自己的謊言善後。


    **絞盡腦汁也想不到該如何圓謊，結果談話斷斷續續導致中斷，附帶一提，如果途中突然轉變話題，那就是謊言完全辦不下去的證據。**


