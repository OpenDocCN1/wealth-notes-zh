  md: '![](img/8b80f1c1c51775592ad72214b19a6753_18_0.png)


    # 商量內容不用當真，

    只需同意即可


    假如有人對你說：「我有事找你商量。」而約你出來，即使是私人的話題，也不用認真以對。不同於工作的「報告、連絡、商量」，一般而論，個人的商量是當事人左思右想後才開口的。


    其實，煩惱不已後再開口找你商量，此時當事人心中也早已有了答案。那他為何還要找人商量呢？那是因為他想要別人堅定自己的決心。


    當他詢問：「我想要○○，你覺得如何？」若是你回答：「我覺得不錯啊！」他被推了一把就能向前踏出一步。之所以找你商量就是為了這「一步」。


    所以，**認真地提出建議，奉勸他改變主意是毫無意義的**。只需同意對方的想法，他就會心滿意足：「找你商量真是太好了。」


