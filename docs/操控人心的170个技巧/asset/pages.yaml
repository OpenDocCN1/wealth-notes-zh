    即使心裡覺得：「那個人真討厭」，你是否認為說出口就不會有人發現？可是即便沉默，行動與動作也會表現出情感。


    譬如兩人在長椅上比鄰而坐，雖然臉對著你，膝蓋卻朝著反方向，會覺得很疏遠。


    面對面坐下時，如果對對方懷有好感，說話時身體會往前傾；若是心裡厭惡，則會擺出倨傲的「後傾姿勢」。


    換言之，面對想保持距離的對象，採取略為誇張的後傾姿勢，用不響說出口，也能顯現出拒絕的態度。


