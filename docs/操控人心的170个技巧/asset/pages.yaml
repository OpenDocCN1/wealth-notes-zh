    # 穿插對方的名字使他專注於自己的談話


    +   “評價” 二顆☆  “效果” 三顆★  “易用度” 四顆★


    像派對會場或聚會場合等，有大批人群的場合充滿了說話聲與聲響，想在這種地方好好交談十分困難。可能會被熟人叫住，或在意旁人的對話，彼此都容昜分心。


    這時不妨利用「雞尾酒效應」。


    無論多麼嘈雜的場所，都能發覺有人叫自己的名字，總是能聽到在意的話題。


    當然也能聽到其他聲音，但人會在無意識中揀選訊息。而只有關心的訊息會被當成重要事項挑出來。


    特別是人是會敏感地反應。所以，在談話時要不經意地穿插對方的名字。


    如此一來，對方將不會被分心，能專注於自己的對話中。'
