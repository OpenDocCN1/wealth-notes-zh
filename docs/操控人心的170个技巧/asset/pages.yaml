    ![](img/8b80f1c1c51775592ad72214b19a6753_161_0.png)


    # 委婉拒絕邀約時

    「Yes-But法」很有效


    ![](img/8b80f1c1c51775592ad72214b19a6753_161_1.png)


    沒興趣的對象邀你「去喝一杯」時，有個方法能夠和平委婉地拒絕。那就是「Yes-But法」。


    至於該怎麼做呢？首先說：「喝一杯嗎？不錯耶！」「表現出贊同對方意見的態度。


    然後徐徐地說：「可是最近我的胃不舒服……這次就不去了。」找個藉口拒絕邀約。


    一味地堅持「我不能去」，對方也會心情不悅。可是，Yes-But法在一開始肯定了邀約，之後找個理由拒絕，對方也比較不會不愉快。


    「評價」：「效果」★★★

    「禁忌度」★★


