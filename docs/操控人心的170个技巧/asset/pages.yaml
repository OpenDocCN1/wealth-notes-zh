  md: '# 利用違背期待的言語

    使對方服從


    ![](img/8b80f1c1c51775592ad72214b19a6753_16_0.png)


    即使被極力稱讚，聽久了也不覺得高興。最好的例子就是對著美女說：「妳真美。」對當事人而言這種事一目瞭然，如今聽到這種話只會覺得：「那又如何？」


    另外，對著將工作圓滿完成的人說：「你真能幹。」對當事人而言只是理所當然，沒什麼值得高興的。**意料之中的言語，無法打動對方的心。**


    如果想讓這種笨敖不馴、令人討厭的人順從，該如何是好呢？應該對他們說出違背期待的言語。


    譬如對嬌貴的美女說：「妳太任性了。」她會把你當成斥責自己的貴人，反而因此受到依賴。另外，對工作能力強卻強勢的人，以擔憂的語氣給他忠告：「再這樣下去，你在我們部門將不被需要。」他就會软化態度接近你。


    **若對方並不意識到，無法觀測他的姿態，對方就等於落入自己手中了。**


    +   一評價一

    二效果★★★

    三參考度★★★'
