  md: '# 使對方與自己的心思無所遁形


    # 奈斷的心理測驗


    ![](img/8b80f1c1c51775592ad72214b19a6753_222_0.png)


    Q. 有 3 張形狀不同的椅子。

    你會選哪 1 張？


    +   A．折疊式鐵椅

    B．沒有椅背的木凳

    C．有扶手的氈髀椅子


    # ★診斷★

    從本測驗可得知…

    你在團體中的地位


    # ……選擇 A 的人……


    開心果

    只要你在團體內，氣氛就會很熱烈，在宴會中不可缺少的人，

    但也有容易得意忘形的一面。


    # ……選擇 B 的人……


    地下領導者

    平常並不顯眼，但緊急時非常可靠的人。


    # ……選擇 C 的人……


    討厭曖昧不明的好事者

    大家意見分歧時，不自覺地就想歸納的班長型人物。'
