    # 面對不懷好意的邀約

    先停止思考


    某天老朋友突然聯絡你：「有一門能賺錢的生意……」


    仔細一聽只覺得古怪異常，因為十分清楚：「這絕對是陷阱。」應該不會有人上當，但實際上受騙的人不在少數。


    這是因為被心理學所謂的「催眠效果」控制了。


    所謂催眠效果，就是反覆聽到：「這真的很不錯」、「現在正是好機會」，這些訊息在腦中揮之不去，隨著時間經過你開始相信：「該不會那個消息是靠譜的？」


    「世上沒有那麼好的事」、「這絕對是詐騙」，即使一開始冷靜地拒絕，「且記憶覆蓋」


    # 聽後，不知不覺間抗拒感就會變弱。


    於是，儘管你口頭拒絕：「可是我沒興趣。」卻依然很在意：「他都這麼說了，或許是真的？」


    此時又聽到「這可是大好機會」，這次就真的被說動了。


