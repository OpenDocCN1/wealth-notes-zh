  md: '![](img/8b80f1c1c51775592ad72214b19a6753_96_0.png)


    # 藉由一指示＋指示，隨心所欲操控對方


    即使拜託別人，通常對方也不會答應。可是，有個說法能讓任何人不自覺地聽從。方法就是指示加上指示。


    譬如要求製作報告書的時候，對方也許會當場拒絕，但如果說：「坐到電腦前，去寫報告書。」對方便很有可能依此行動。人一次接收２個指示就會混亂，不知該拒絕何者，結果就變成兩者都無法拒絕。這時的重點是注視對方的眼睛，以自信滿滿的態度下指示。


    附帶一提，這可以應用在各種場面。下屬犯下錯誤而驚慌失措，就算叫他報告也顫三顫四。這時可以叫他：「喝杯咖啡再報告吧。」喝了咖啡便能冷靜下來，報告就會有條理。當然並非任何場面面對誰都能用。２個指示其中之一不被同意時，恐怕會被拒絕。此時應換個說法或選擇容易接受的指示，必須下點工夫。


    > 評價 ★★★★

    效果 ★★★★

    禁忌度 ★★★'
