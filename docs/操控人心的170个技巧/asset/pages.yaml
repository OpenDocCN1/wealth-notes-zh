    # 「禁止穿鞋」上愛車的男人

    害怕活生生 female ?


    愛車如命的人，男性鐵定多於女性。結果將愛車視如至寶更甚情人，成了滿足自己的重要存在，而且絕對不可弄髒。當然不準穿著髒鞋上車，就算女友也要嚴守「禁止穿鞋」的規矩。車上「禁止穿鞋」的男性，為何會有如此執著的想法呢？


    那是因為對於活生生的女性感到恐懼。可能在嚴格的家庭中長大，從小被灌輸對女性懷有下流情感是「惡」，長大後將女性視為性對象感到罪孽深重。遵從父母絕對的命令壓抑欲望的結果，性愛對象變成了沒有體溫與感情的機械。就心理層面的觀點，裡面空洞的車子也是女性性器官的象徵。在此穿鞋上車，等同於自己所愛的人遭到踐踏。


    如果毫不知情穿著鞋子上車的女友被痛罵，那他肯定是機械戀物癖。假如想要一般的戀愛，最好停止和他交往。


