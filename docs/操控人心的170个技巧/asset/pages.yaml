    # 用「咦」、「嗯」開頭的人

    想掌握主導權


    說話方式的習慣十分有趣，能流露出內心的想法。


    其實有不少人都從「呃」、「嗯，這個」、「唔嗯」、是啊這些詞開始起頭。當然，有時只是在煩惱該如何用字遣詞，若是平時強硬的人進入這個模式，最好注意一下。


    因為與其說只是單純的口頭禪，這也是**想掌握主導權的心理表徵**。先隨聲附和讓談話有個空檔，閃躲對方的攻擊，爭取思考下一步的時間。擅於演說的政治人物大多是這種類型，想必各位能夠理解吧。


    換言之，對方**可不是等閒之輩**，應小心防範。請牢牢記住，若是疏忽大意會不知不覺被捲入對方的步調，可能被算計而吃虧喔。


