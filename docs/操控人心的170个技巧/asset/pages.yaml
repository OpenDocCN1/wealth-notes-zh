  md: '# 語尾加上「∵吧」

    讓對方產生關係不錯的錯覺


    提案時有個語詞能讓商談對自己有利益。


    就是「∵吧」的語尾，只要加上這個，對方就會老實地接受你的提案。


    譬如詢問：「對A公司的簡報內容這樣好嗎？」和「對A公司的簡報內容這樣可以吧？」請思考一下有何不同。


    聽到：「這樣好嗎？」聽者會開始思考你的提案是否有問題？有時無法獲得正面的回覆。


    不過，要是確說：「這樣可以吧？」會陷入宛如自己代言對方意見的錯覺，應該可以吧。」能夠輕易地獲得同意。


    語尾加上「吧」，能產生我們簡直意見相同的親密氣氛，因而容易獲得贊同。


