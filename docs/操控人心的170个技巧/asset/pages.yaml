- pgno: 92
  md: '# 想讓對方說出「Yes」

    就問：「何者較好？」


    無論多麼瑣碎的內容，開口拜託別人時可不能弄錯方式。


    尤其像「我想交給你一件麻煩的工作」、「我想變更約定的行程」，雖然難以開口，若被拒絕可傷腦筋了，做出這種請求時需要「一點技巧。


    就是先別給對方回答Yes、No的選項。其中關鍵是，應以對方會接受請託為前提再詢問。


    比如說你向對方開口：「我負責的客戶能分一些給你嗎？」結果通常只會被拒絕：「不行，我也是忙得不可開交。」


    你應該換個說法：「A公司與B公司，你能接手哪一邊？」如此以接受為前提，便能引導對方回答：「A公司比較好吧。」


    同樣地，「我想變更下次見面的行程……」也應換個說法：「我想變更週日的行程，換成何時較好？」不能給予對方否定的機會。這種帶有前提的問法非常好用，不妨記住這個訣竅。


    ![](img/8b80f1c1c51775592ad72214b19a6753_92_0.png)'
