    # 面對不服從的人 要表現出「你是特別的人」


    +   定價: 效果: 禁忌度:


    原本以為只不過是工作夥伴或遊伴的異性，突然說出家庭環境或生長過程等私人的煩惱，這時你會怎麼辦？


