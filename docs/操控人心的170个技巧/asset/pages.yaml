  md: '# 對於愛潑冷水的人

    只傳達結果


    ![](img/8b80f1c1c51775592ad72214b19a6753_159_0.png)


    ![](img/8b80f1c1c51775592ad72214b19a6753_159_1.png)


    想理解別人的話之時，不同的人有各種特徵。


    先大致掌握理解整體的人；對談話細節等具體的來龍去脈打破砂鍋問到底的人；執著於事情開端的人；總之只想聽結論的人，真是五花八門。


    其中最被旁人質疑人性的就是只想聽結論的人。


    人的思考有種種個性，即使逐一說明過程，有些人也會完全沒聽進去。只想聽結論的人就是這種人，當他聆聽為何如此時，腦中飄盪著懸疑緒，所以急著想知道結論。


    結果，他會不自覺地潑冷水：「所以你想說什麼」、「所以結論是？」


    聽者可能會想反駁：「用不著這麼說吧？」當事人卻自認口氣並沒有旁人想得那麼糟，就算頂撞他也只是破壞心情。


    對這種人只須淡淡地告知結論，以求明哲保身。'
