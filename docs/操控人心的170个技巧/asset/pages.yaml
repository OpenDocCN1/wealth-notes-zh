  md: '# “空白郵件”沒收到回覆，

    表示自己在對方心中可有可無


    有的人總是和藹可親，卻有些裝模作樣，令人無法完全信任。儘管表裡分明，卻看不透他的真正心思。

    儘管不信任別人親切待己內心會感到愧疚，但是實在心有疑惑時，不妨寄出空白郵件確認對方的真意。

    假如認識的人寄給你一封空白郵件，你會有何反應？若是交情不錯的人或在意的對象，儘管你心想只是按錯了，大概也會回覆：「你寄了空白郵件喔。」反之，若是不好應付或可有可無的人，你應該不會特地回信。

