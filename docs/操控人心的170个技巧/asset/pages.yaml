  md: '# 以一大拍賣—這3個字


    # 呈現划算的感覺


    見到「大拍賣」這3個大字，任何人都会覺得絕對划算。而且看到價格標籤定價被紅線劃掉，再標出折扣價格，不自覺地就想伸手拿起商品。


    可是，真的買得划算嗎？也許是以破盤價採購，再標上正式售價而已。


    不過，姑且不論業界人士，**客人並不清楚店家的潛規則**。總之，「大拍賣」確實是能刺激購買意願的詞語。


    並且，**如果大拍賣的理由簡單明瞭，更能增加划算的感覺**。


    譬如「清倉大拍賣」，可以想像是不想將庫存留到下期；「倒店大拍賣」則是為了處理庫存，都很清楚易懂。


    另外，「有理大拍賣」明示實際上是「有理由的」，倒也能夠令人理解。


    清楚定出大拍賣的理由，光這樣便能招攬客人。


