  md: '# 又開始自吹自擂時

    讚美幾句趕緊離去


    明明做不到卻狂吹牛皮說大話，或許當事人爽快無比，聽者卻鬱悶難耐。可是如果對方是主管，又不能視而不見。

    若想盡早逃離這種話題，就極力稱讚吧。

    這種人希望別人注意自己，大多抱著想獲得認同的欲望。換句話說，就是變臉變藥。「好厲害」、「真了不起」、「你是第一名」等等，怎樣稱讚都行，別忘了假裝打從心底感動，如此就能滿足對方的自尊心。

    不過，稱讚過頭會有反效果。連續不斷地讚美，會讓他更加得意忘形，很有可能得聽他滔滔不絕說個沒完。

    讚美幾句就趕緊離去。可得堅守這一點。


    ![](img/8b80f1c1c51775592ad72214b19a6753_162_0.png)'
