    # 想讓事情有利進行

    就把對方拉到主場


    有份資料指出，不管棒球或足球比賽，比起深入敵陣的客場比賽，主場比賽能使賽況更有利。


    就主場球隊而言，比賽場地是平時熟悉的空間，相對來說交手球隊則是「客人」。儘管想要放鬆，面對比賽仍舊不免有些緊張。結果便無法發揮平日的實力。


    這種「主場優勢」不僅限於運動。在商場上若想讓談判有利進行，只要把對方拉到自己的主場就行了。


    尤其距離遙遠的客戶，就請對方來自己的公司。當然，既然特地邀請了對方，也別忘了熱情款待。


    如此一來對方將更是惶恐，而打亂平時的步調。此時機不可失，應挾帶地利乘勝追擊。一定能讓對方接受對己方有利的條件。


