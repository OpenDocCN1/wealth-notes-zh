    # 模仿『纏人精』的口頭禪

    讓他安靜


    對於用心聽自己說話的人，任何人都會有好感。


    可是，不管對方有無興趣，只顧著央求「聽我說」的人可不值得讚許。而且，對這種人略有輕蔑之意，他就會不高興，總之非常難搞。另一半所謂「纏人精」的人，是杏心理裡有數呢？


    這時，模仿對方的表情和語氣，可以**一舉擾亂對方的步調**。


    假如他說：「昨天發生了一件驚人的事，」你就以同樣的表情回覆：「喔，昨天發生驚人的事啊！」他接著說：「你懂我的心情吧？」「你就用相同的口氣回應：「懂你的心情是什麼意思？」


    如此對方會很掃興，陷入沉默。並且，若他稍微懂得察言觀色，就會


    **後悔了**。


    不過，若有半步差池，露出愚弄的態度，可能會惹對方生氣。另外請注意，就算對方是「纏人精」，也不可對主管等長輩有如此舉動。


    +   評價    ★★★

    效果    ★★★★★

    基礎度  ★★


