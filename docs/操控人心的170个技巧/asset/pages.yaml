    # 偷偷觀察找出巴結對方的題材


    工作上或私底下有「想接近」的人時，首先應仔細觀察他的攜帶物品與身邊的事物。


    話雖如此，並不是看牠拿什麼名牌包，或穿了多少錢的西裝來秤斤兩、品頭論足。而是若無其事地確認他的攜帶物品。


    例如，觀察他辦公桌上隨手亂放的電影票根，夾在筆記本裡的商店優惠券或傳單，就能看出他對什麼有興趣。然後不經意地提起話題：


