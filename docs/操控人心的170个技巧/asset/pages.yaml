    # 以ㄧ之前你説過了？！",


    # 擺脫談話內容重複的人


    無論談話內容是好是壞，總是重複相同內容的人令人不敢領教。雖然很想明講：「那件事我聽過好幾次了。」但對方可能會生氣，所以也行不通。


    而且當事人也沒有惡意，隨便對待打斷對方的話反而會惹惱他，真是難以處理。


    如果不想引起對方的不快，就一語道破：「喔，這是上次那件事的後續吧？」或「和上次的切入點不同呢。」


    如此，對方將認清「已經説過了」，便能冷靜下來，改變話題的切入點，或是早早結束。


    另外，反覆説同一件事，表示心中無法忘懷，純粹希望有人願意聽，這點也請一併記住。若是時間心情有餘裕，不妨聽他把話說完。


    評價  ★★

    效果  ★★★

    禁忌度 ★★'
