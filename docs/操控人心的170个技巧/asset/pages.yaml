    聽人說話、思考時、講話時也一直旋轉、旋轉、旋轉……看著的人真想大叫：「你給我適可而止！」

    為何轉筆的人停不了這個動作呢？而且轉筆究竟是什麼？根據心理學家佛洛伊德表示，筆是象徵男性生殖器的一種東西，玩弄筆等同於「自慰行為」。


    原本與其轉筆更應該自慰。可是，由於在家庭教育中這是「不能做的事」，而抑制了這種欲望。總之就藉由轉筆來壓抑欲望。


