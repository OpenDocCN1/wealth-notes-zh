  md: '![](img/8b80f1c1c51775592ad72214b19a6753_164_0.png)


    # 想拉攏討厭的人時

    不妨利用「暗示的力量」


    與不合的對象為敵，並非明智之舉。再怎麼討厭的人，對自己而言仍是可以利用的人。但是大多數的情況，你討厭的人也討厭你。因此，想拉攏這種人的時候，「暗示的力量」能派上用場。


    想施加更具效果的暗示，最好利用對方眼中的權威者。一般人有種傾向，會輕易地相信比自己優秀，社會地位較高的人所說的話。比方說對主管或長輩事先疏通，請他們美言幾句。結果受到「獲得眾人的高度評價」這個暗示，對方的態度不知不覺也會改變。暗示的力量不可輕侮。正如「水也能變成藥」的「安慰劑效應」，有時對人的身體也能造成影響。或許操控人心並非難事。


    +   *   評價：★★★

    *   效果：★★

    *   禁忌度：★★'
