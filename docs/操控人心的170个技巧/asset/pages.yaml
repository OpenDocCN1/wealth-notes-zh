  md: '# 前言


    無論在職場上或私生活中，你身邊肯定有一、兩位不喜歡的人，或是不對盤的人。


    譬如幾杯黃湯下肚就兩眼發直找人吵架的人，或是在電車上與公司裡扯開嗓子說話的人。沒有人會想與這種類型的人為伍吧？


    相反地，也有人總是自言自語，但問他怎麼了，對方也只會回：「沒事……」


    若碰上這種人，任何人都會煩惱該如何和他相處。


    大多數人面對難相處的人會盡量保持距離，但這只會讓自己費心勞神。如此便會覺得吃虧，變得更加討厭對方。


    而本書正是能分析難相處的人與難搞的人的心情，再隨心所欲地操控他們。


    不用重新學習，或使用特別的道具。見到麻煩人物時只須仔細觀察他的言行舉止，再採取行動即可。


    對於不願說出真心話的人，就試探一下：「一般來說會有何看法？」在他提起一般論的發言中，有時可以看透他的真心話。


    ![](img/8b80f1c1c51775592ad72214b19a6753_2_0.png)'
