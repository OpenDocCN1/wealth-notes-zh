  md: '# 從就座時以何種角度

    入座可窺知人際關係


    在開會等場合，許多人到會議桌就座時，對於不合或不擅於應付的人，你是否有挑距離遠一點的座位？


    其實，選座位是探求對方心理的線索。

    譬如你坐在長桌一邊的角落。假設除了你沒有入座的人。

    首先，隔著桌角彼此呈90度的座位，是能夠非常放鬆方便交談的位置。

    選擇這裡的人是友好的人物。假如一起工作，他將會爽快地協助。

    另外，同一邊並排的座位目光不會相對，不容易產生緊張感。是俗稱「戀人位置」的座位。距離上親密度較高，想必對你帶著善意。或者有心想商量的人，也多半會選擇這個座位。

    另一方面，正面的座位看似是傳統的位置，但彼此目光相對的緊張感最高。

    其中也有想認真商談的人，但要注意和你持有對立意見的人也有選擇這裡的傾向。


    ![](img/8b80f1c1c51775592ad72214b19a6753_76_0.png)'
