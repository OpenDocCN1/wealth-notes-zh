    # 利用「否定的雙重束縛」

    自由操控懦弱的人


    送生日禮物給交往中的女友，她卻不滿地抱怨：「你怎麼不先問我想要什麼？」

    於是到了耶誕節，為避免重蹈覆轍而事先詢問：「妳想要什麼禮物？」結果她又抱怨：「既然你喜歡我，應該不用問也知道吧！」

    以旁人的觀點會想大叫：「趕快跟這種任性的女人分手啊！」可是這種「兩邊都不對」的情境卻很常見。


    這在心理學上稱為「否定的雙重束縛」。

