    # 腹背受敵時

    以一對一瓦解對方


    推翻新多派的意見極其困難。縱使正面挑戰，結果也只會被忽略。這種情況下，各個擊破反而更順利。


    雖說是多數派，其中也有各式各樣的人。懦弱的人儘管並非全面贊成卻難以啟齒，也有人只要跟隨別人就覺得安心。其中或許也有人未經深思熟慮，只是因當下的氣氛而贊成。


    換言之，可以斷言多數派未必堅如磐石。


    在團體中難以說出自己的意見。可是，“1對1”就容易引出真心話。


    結果，他真是這樣想的嗎？也許他無法贊同這個部分，你將會得到各種意見。個別的話，是讓對方察覺自己有不同想法的機會。


