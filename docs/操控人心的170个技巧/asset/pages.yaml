    # 話中出現「這個」、「那個」是感到棘手之表現


    有些人談話時經常使用「這件事」、「上次的事」、「那個人」等代名詞，這種表現反映出對棘手事物的抗拒感。


    +   因為不想說出具體的名字，逃避地使用「這個」、「那個」等詞語。

    譬如聊到某人的時候，不說「○○先生」的名字，要是說：「那個人」或「他」，可以想像成他對那個人有抗拒感。

    假如對方提起：「關於那件事……」就可以嗅出情況不妙。

    這種說話方式很常見，不過可以看出對方的抗拒感，最好注意一下。有時會陷入負面的發展，巧妙地轉換話題自我防衛才是上策。


