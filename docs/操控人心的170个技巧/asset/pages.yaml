    譬如搭電車時，儘管空出了座位，其他乘客立即在身旁坐下，你是否會感到不快呢？


    這是因為個人空間受到侵犯。個人空間指的是別人踏入就會感到不快的範圍，與對方的關係將會改變空間的大小。


    關係愈親密，個人空間就愈小。若是能接受少於50公分，就是非常交心的朋友。


    這種心理能反過來利用，其實與對方的距離愈近，愈容易接受請託。接近的距離能表現出親近感，所以店員走近客人身邊搭話，也是期待這種效果。


    此時各位得注意有意識接近自己的對象。或許他別有用心，想要你接受某些要求。這時冷靜地應對可是關鍵。


    附帶一提，也有人毫無任何意圖，卻無視個人空間無禮地闖進來。對於這種遲鈍的人，就若無其事地保持距離吧。


