  md: '# **持續探索自我的人**

    **正在尋找認同自己的人**


    「這份工作不適合我」、「我想尋找自己更想做的事」，有不少人因此辭去工作或一直跳槽。


    並且，也有不少太一生下孩子後便傾全力養兒育女，似乎忘了丈夫的存在。

    這兩種人其實有一種共通的深層心理。那就是「壓抑」。


    兩者皆壓抑著不被他人與社會認同的不滿。

    接連更換工作與容身之處，就當事人而言是尋找自我之旅，但再怎麼更換場所尋找自我，結果自我只存在於自己心中。

    結果這種人所做的並非尋找自我，而是尋找認同自己的人與環境之旅。

    另一方面，過度熱衷於養兒育女的人，大多是同樣正在與想獲得認同的欲望奮鬥。

    新婚時期丈夫對自己不理不睬，只顧著工作和自己的興趣，老是不在家，把空蕩蕩的房子交給自己……。


