    # 說出一總之 的人

    只想要結論


    在公司裡呈報進行中的工作，依序報告時總會有人插話：「總之是這一回事吧？」打斷別人的話擅自下結語，會被當成「性急的人」或「愛出風頭的人」捨棄，但若干瞭解，就能得知他想要總結的理由。這種人不是個性上，而是思考方面有色。使用「總之一」或「結果」等「結論」的人，傾向於重點思考資訊與想法。並不重視中間的過程與背景，只將結果逐條列出來記在腦海中。


    所以，即使他聽了事情的來龍去脈與之前的過程，也無法體會和理解真正的意思。結果就只想要結論：「因為○○所以××。」換句話說，對這種人特別想讓談話內容簡單易懂也沒用。請記住一件事，只傳達應掌握的「重點，對方反而會比較高興。


    +   【評價】★★★

