    三 適應度


    企劃提案時，事先瞭解對方是樂天或悲觀的人便容易推動。不過，究竟要從何處分辨呢？


    其實，觀察對方對於初次造訪的場所有何反應，或如何對待初次見面的人便容易明白。


    樂天的人在出發前很積極，「好想快點出發！」或「很期待和他見面！」即使在第一次去的地方迷路了，也是一副無憂無慮的態度：「總會有辦法的。」對於初次見面的人也積極努力地建立關係。


    另一方面，悲觀的人總是言語中流露不安與擔憂：「真擔心能否到達目的地？」或「如果對方不好相處就慘了。」無論到哪裡總是接二连三揮規不安要素，對於初次見面的人也無法立刻相處融洽。


    明白對方的類型後，接下來只須依賴類型對應。對於樂天的人提案時強調實際面，對方就容易配合；對於悲觀的人應該包含風險都仔細說明，留意要去除不安的要素。'
