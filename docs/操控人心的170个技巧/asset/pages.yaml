    # 以一句「原來如此」說服麻煩人物


    即使稱不上客訴，世上也有人要求很多，愛出意見。


    這樣的人也很愛找碴，要是應對得不好，很有可能瞬間變成怪獸客人。


    為避免如此，必須展現帶有誠意的態度應對。此時「原來如此」這句話非常好用。


    「原來如此」，的確如您所說。「」「原來如此，謝謝您寶貴的意見。」像這樣，每次都從「原來如此」開始回應。


    這句話帶有「確實聆聽了你的意見」的語感，藉此可展現包容力。若是覺得自己的主張確實被對方接受，言語上將不再咄咄逼人。


    不過必須注意，要是因為對方嘮叨不休，就一味地反覆：「原來如此，原來如此。」這樣反而會給人一種嫌麻煩的語感。


