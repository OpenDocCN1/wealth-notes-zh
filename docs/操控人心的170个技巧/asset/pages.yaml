  md: '![](img/8b80f1c1c51775592ad72214b19a6753_156_0.png)


    # 讓頑固大叔型的主管

    暢所欲言


    自己一旦決定後，無論如何絕不讓步的頑固大叔型的主管，如果你想讓他接受自己的意見，就先從自然的對話切入。


    假如你想將之前的作法改成更有效率的方法，直接提出自己的意見時，結果只會被冷淡地駁回：「不需要改變。」


    可是，如果你假裝和他商量：「關於○○我有一些想法……」在充分聽取主管的意見後，再進入主題，對方也將無法置若罔聞。


    「的確，也能有這樣的想法。」他自然會敞開心胸。


    一般而言，頑固大叔型大多是注重形式的保守型，對於上下關係也很嚴格。


    所以尊重他的這一面，多少花點時間，不屈不撓，相處時心懷敬意，就不是太麻煩的對象。


    +   - 評價：★★★

    - 效果：★★

    - 難易度：★★★'
