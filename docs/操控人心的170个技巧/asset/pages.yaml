    # # 以人品判斷別人的

    # 討厭謊人歧途


    必須作出重大決策的時候，以什麼為基準決定事情因人而異。有人以價格或效率為基準，也有人以美觀漂亮為優先。


    其中「我相信他的人品才交給他。」或「那位社長有點那個，所以我不會採購那間公司的產品。」以人品為基準下決定的人，是重視人際關係的類型。


    這種人大多傾向於重視對方的情義、親切或強烈的責任感，平時也努力讓自己在旁人眼中是人格高尚的人。如果受到周遭人們依賴，他也是能身先士卒的可靠人物。


    但是，正因以人品為判斷基準，如果不符基準可就不得了。


    必須注意一旦他覺得：「我無法原諒這種人。」就很有可能無法得到他的原諒。


