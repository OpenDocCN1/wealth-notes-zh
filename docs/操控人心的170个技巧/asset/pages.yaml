    # 設定容許範圍

    別人就會口風不鬆


    向口風緊的人套話難如登天。就算逼迫他說出一切，對方反而更是閉口不談。


    對這種人說：「講可以說的範圍就好，告訴我吧。」「會很有效果。因為限定分量與時間，一般人就會容易接受要求。


    順帶一提，這個問題的重點是詢問「哪幾項是容許範圍？」


    前提條件並未包含No的選項，經此一問，對方會不由得思考：「哪些事情可以說？」


    同樣地，「一點點就好了」、「只要30分鐘」、「只有形式也好」，如此降低難度，對方接受要求的機會也會提高。


    +   評價★★★

