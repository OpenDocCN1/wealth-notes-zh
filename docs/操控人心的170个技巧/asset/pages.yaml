    # 從眨眼次數

    得知對方內心的動搖程度


    一般人1分鐘內眨眼20幾次。這是無意識的動作，連當事人也幾乎不會察覺，其實藉由眨眼能推測對方的心理狀態。


    譬如有時會看到遠遠超出平均値，眼睛眨個不停的人，眨眼次數多的人可視為非常緊張。自己感覺到立場岌岌可危，有不可告人的事，或出現不想觸及的話題時，總之覺得不舒服，內心便會開始動搖。


    此時看似能一舉進攻的機會，但也未必要斷言。如果對方是懦弱的人，可以威逼對方。但是有的人過於緊張，反而會有攻擊性。對這種人採取強硬的態度可能會起爭執。


    反之，若不想被察覺自己的緊張可以睜大眼睛，減少眨眼的次數。


