    # 把麻煩事推給人之術


    先表示親切


    假如你身邊有人面臨危機，即使那是討厭的人也不妨出手相助。正如「做人情並非為了別人」，這份親切必定會成為自身的利益。


    人在身陷困境獲得解救時，即使與對方處在對立關係，在安心的同時也會深深感激。因此，或許對方會說：「哎呀，真是幫了我一個大忙。太感謝你了。以後如果你有困難請儘管開口。我一定会會幫你。」


    有了這句話就是一個機會。你可以趁機說：「那我可不可以拜託你○○嗎？」「把麻煩事推給他」。


    既然他方才說了：「我一定會幫你。」就絕對無法拒絕。即使他後悔不該表達謝意，也覆水難收了。


    不過，要是過於頻繁地使用這個方法，將被視為危險人物，使用時須小心翼翼。


    | 評價 | ★★★★★ |

    | 效果 | ★★ |

    | 禁忌度 | ★★ |'
