  md: '![](img/8b80f1c1c51775592ad72214b19a6753_22_0.png)


    # 想讓對方迷上自己

    就讓視線集中一處


    曾在寺院裡打坐的人就會明白，打坐時眼睛不能東張西望或完全閉住。正確的作法是，採取「半睜眼睛」的狀態。


    因為凝視一點具有使思考停止，屏蔽雜念的效果。換言之，固定視線會剥夺思考權力。


    掌權者的演說與現場販售等，都應用了這一點掌控聆聽者的心理。將聚光燈打在說話者身上，大聲呼唤吸引聽眾的目光與內心，使之陷入一種陶醉狀態。


    尤其，在神經更敏銳的黑暗中更容易呈現效果。


    例如女性在夜晚兜風時容易被男性打動，不單單是因為當下的氣氛，也受到了這種效果的影響。


    假如下定決心求婚，夜晚比白天更合適。這樣至少能提高成功率。


    +   - [評價] ★★★☆☆

    - [效果] ★★☆☆☆

    - [易懂度] ★★★★☆'
