    # 愛說人壞話或聊八卦的人是因為欲求不滿


    若有人愛說人壞話或聊八卦，周遭的人會感到不太愉快。確實任何人對八卦多少都有興趣，若太過度可能會破壞人際關係，也會疑神疑鬼哪天自己也變成八卦主角。


    儘管如此，如果有人總是愛聊八卦或說人壞話：「他被拔擢為領導者是因為向部長獻媚。」或「那兩人偷偷地交往。」那就是欲求不滿的表現。


    這種人不滿於自己的 生活，非常羨慕別人的生活。明明很努力卻未被稱讚的不滿；對於生活過得比自己快樂的人的羨慕；以及對於比自己有能力的人的嫉妒等，內心鬱積了相當多的不平不滿。


    這些糾葛的情感變成以講壞話聊八卦的形式宣洩，變得無藥可救。若當事人無法獲得幸福滿足的生活，就無法停止聊八卦。


