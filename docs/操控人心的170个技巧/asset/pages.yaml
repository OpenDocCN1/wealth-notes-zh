    # 處。


    若有人反覆聲稱：「絕對沒問題！」、「絕對行！」最好質疑他身為大人的成熟


    話說，能確實完成一件事的人，不用如此宣稱也深受別人信賴。


    特意強調：「絕對！絕對！」是因為自己也清楚旁人並不這麼想。而且自己也缺乏自信，所以才得發出聲音強調。


    面對這種人，若被氣勢壓過而把事情交給他會很危險。一有機會就應確認情況，不過他很


    有幹勁也是事實，若能善加掌控就能派上用場。


    雖然外表是大人，卻有不成熟又孩子氣的一面，相處時別忘記這一點，或許會意外地順利


    喔。'
