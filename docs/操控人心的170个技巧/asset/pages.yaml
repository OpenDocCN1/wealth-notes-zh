  md: '![](img/8b80f1c1c51775592ad72214b19a6753_170_0.png)


    # 無視人格維持同調就能和討厭的對象拉近距離


    討厭一個人，覺得很難相處時，這和難以言喻的心理變化有關。就算如此，一個成熟的人可不能說：「討厭的人就是討厭！」尤其對方若是廠商的負責人，也得壓抑討厭的心情，想辦法好相處。


    可是，如果勉強封閉自己的心，滿臉堆笑作陪，心裡將逐漸累積壓力，可能因某個導火線而一口氣爆發。


    在局面無法挽回之前，試著與對方的主張同調。就算是討厭的對象，任何事都一一反對，反而只會累積壓力。


    不過，同意對方的意見和主張，表現出接受的態度，對方覺得和你「意見一致」，便能拉近距離。如此一來，便會陷入彼此有好感的錯覺。這時便無關對方的人格。盡量在相處時減少壓力，利用這種錯覺也是一種手段。


