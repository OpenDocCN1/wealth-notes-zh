    # 借用名人的頭銜

    增加真實感與說服力


    | 評價 | 效果 |

    | :---: | :---: |

    | ★★★★★ | ★★ |


    有根據的話和毫無根據的話，何者較有說服力自不用說。數據與調查結果是常用的證據，不過頭銜也是重要的因素。


    這是稱為「光環效應」的心理法則，地位與身份等頭銜具有影響人類情感的力量。


    例如談話中只須加上一句：「據經濟學家○○表示……」或「××大學△△教授的研究中……」發言便會增添真實感與說服力。換言之，就是借花獻佛。


    引證時最好舉出對方佩服的人物。如此，便會覺得這個意見是正確的。此時一舉掌握內心，便成功說服了一半。


    不僅專家與地位高的人物，也可以借用對方喜歡的作家或藝人所說的話。總之要讓對方覺得：「既然他都這麼說了，肯定沒錯。」'
