    你可別期待他會興致高昂地回答：「好啊！」因為習慣玩弄東西的人大多脾氣彆扭。他不會老實地贊成提案，而是先說：「喔。」表現出沒興趣的態度。可是，他也不是真的反對，假如你問：「唱卡拉OK和打保齡球，你選哪一個？」他可能會回答：「唱卡拉OK好了。』


