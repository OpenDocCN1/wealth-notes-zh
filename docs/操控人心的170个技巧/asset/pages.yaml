    # 賣點人情拉攏對方


    有些人在百貨公司地下美食街，試吃後不買會覺得過意不去，因此絕不試吃。


    這是因為受到他人的恩情或恩惠，想盡力回報的心理作用。


    「互惠性法則」


    這裡說的恩情或恩惠，並非多大的程度，正因是「點小恩惠」，才覺得應「盡力回報」或「報恩」。


    在職場上想增加自己的夥伴時，不防利用這一點。


    替忙碌的同事去買便當，或者幫犯錯的後輩緩頰，賣點人情。如此一來，當自己身陷危機時，他們肯定會出手相助。


