    人心就是如此，會因給某人貼上的標籤而輕易改變。


    因此，假如你身邊有人並沒有出色的表現；只是因為深得要領而獲得名不副實的評價，與其到處散佈：「他根本沒在工作。」不如若無其事地貼上標籤。「他很懂得如何工作呢。」總是把同事與後輩當成拉馬車的馬使喚。」只要貼上這種標籤，他就會被認定為：「很愛使喚別人的人」。


