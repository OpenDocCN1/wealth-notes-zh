    # 掌握點頭方式


    # 比對方更占上風


    與生意往來的對象建立良好關係，重點還是在於順暢的意思溝通。說者再怎麼口若懸河，若是聽者毫無反應，就連印象都會變差：「這個人到底想不想聽？」換句話說，我想表達的是，在對話中「附和」非常重要。


    聽話時點頭的作為，表現出「我有在聽」、「有聽進去」的意思。當然我要說的內容是另一回事。


    聽者點頭，能讓對方誤以為兩人的距離一舉拉近了。對自己的話點頭如搗蒜，自己也會解釋成得到接納。


    假如中途突然停止動作，說者就會感到不安。為了再拉近距離，會說一些對方愛聽的話。反之若能巧妙地利用這種心理，掌握點頭的重點，自己在兩人的關係中也容易占上風。


