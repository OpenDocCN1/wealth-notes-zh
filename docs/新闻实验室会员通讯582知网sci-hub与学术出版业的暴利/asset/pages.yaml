    At the time of the merger, Charkin, the former Macmillan CEO, recalls advising
    Pierre Vinken, the CEO of Elsevier, that Pergamon was a mature business, and that
    Elsevier had overpaid for it. But Vinken had no doubts, Charkin recalled: “He
    said, ‘You have no idea how profitable these journals are once you stop doing
    anything. When you''re building a journal, you spend time getting good editorial
    boards, you treat them well, you give them dinners. Then you market the thing
    and your salespeople go out there to sell subscriptions, which is slow and tough,
