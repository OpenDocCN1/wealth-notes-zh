- pgno: 23
  md: 'At the time, Elsevier’s behaviour seemed suicidal. It was angering its customers
    just as the internet was arriving to offer them a free alternative. A 1995 Forbes
    article described scientists sharing results over early web servers, and asked
    if Elsevier was to be “The Internet’s First Victim”. But, as always, the publishers
    understood the market better than the academics.


    In 1998, Elsevier rolled out its plan for the internet age, which would come to
    be called “The Big Deal”. It offered electronic access to bundles of hundreds
    of journals at a time: a university would pay a set fee each year - according
    to a report based on freedom of information requests, Cornell University’s 2009
    tab was just short of $2m - and any student or professor could download any journal
    they wanted through Elsevier’s website. Universities signed up en masse.


    Those predicting Elsevier’s downfall had assumed scientists experimenting with
    sharing their work for free online could slowly outcompete Elsevier’s titles by
    replacing them one at a time. In response, Elsevier created a switch that fused
    Maxwell’s thousands of tiny monopolies into one so large that, like a basic resource
    - say water, or power - it was impossible for universities to do without. Pay,
    and the scientific lights stayed on, but refuse, and up to a quarter of the scientific
    literature would go dark at any one institution. It concentrated immense power
    in the hands of the largest publishers, and Elsevier’s profits began another steep
    rise that would lead them into the billions by the 2010s. In 2015, a Financial
    Times article anointed Elsevier “the business the internet could not kill”.


    Publishers are now wound so tightly around the various organs of the scientific
    body that no single effort has been able to dislodge them. In a 2015 report, an
    information scientist from the University of Montreal, Vincent Larivière, showed
    that Elsevier owned 24% of the scientific journal market, while Maxwell’s old
    partners Springer, and his cross-town rivals Wiley-Blackwell, controlled about
    another 12% each. These three companies accounted for half the market. (An Elsevier
    representative familiar with the report told me that by their own estimate they
    publish only 16% of the scientific literature.)


    > “Despite my giving sermons all over the world on this topic, it seems journals
    hold sway even more prominently than before,” Randy Schekman told me. It is that
    influence, more than the profits that drove the system’s expansion, that most
    frustrates scientists today.


    Elsevier says its primary goal is to facilitate the work of scientists and other
    researchers. An Elsevier rep noted that the company received 1.5m article submissions
    last year, and published 420,000; 14 million scientists entrust Elsevier'
