    \ Editor-in-Chief, Science suite of journals*\n- **It's a Sci-Hub world data set**\n\
    \  - *Data set and details on Sci-Hub server*\n\nLike so many of Kazakhstan's\
    \ brightest, Elbakyan left the country to pursue her dreams. First she worked\
    \ in Moscow in computer security for a year, and then she used the earnings to\
    \ launch herself to the University of Freiburg in Germany in 2010, where she joined\
    \ a brain-computer interface project. She was lured by the possibility that such\
    \ an interface could one day translate the thought content from one mind and upload\
    \ it to another. But the work fell short of her dreams. \"The lab activity was\
    \ spiritless,\" she says. \"There was no feeling of pursuing a higher goal.\"\n\
    \nElbakyan did find a community of like-minded researchers in transhumanism, a\
    \ lofty field that encompasses not just neuroscience and computer technology but\
    \ also philosophy and even speculative fiction about the future of humanity. She\
    \ discovered a transhumanism conference in the United States and set her heart\
    \ on attending, but she struggled to get a U.S. visa. She was rejected the first\
    \ time and only barely made it to the conference. With the remainder of her summer\
    \ visa, she did a research internship at Georgia Institute of Technology in Atlanta.\
    \ When she got back to Kazakhstan, frustration with the barriers that scientists\
    \ face would soon lead her to create Sci-Hub— an awe-inspiring act of altruism\
    \ or a massive criminal enterprise, depending on whom you ask.\n\nPublisher paywalls\
    \ are the bane of scientists and students in Kazakhstan, she says, and the existing\
    \ solution was cumbersome: Post a request on Twitter to @IcanhazPDF with your\
    \ email address. Eventually, a generous researcher at some university with access\
    \ to the journal will send you the paper.\n\n![](img/5045c6e2edc03ff9c31671072a380124_30_0.png)\n\
    \nWhat was needed, she decided, was a system that allowed that paper to be shared—with\
    \ absolutely everyone. She had the computer skills—and contacts with other pirate\
    \ websites—to make that happen, and so Sci-Hub was born. Elbakyan sees the site\
    \ as a natural extension of her dream of helping humans share open ideas. \"Journal\
    \ paywalls are an example of something that works in the reverse direction,\"\
    \ she says, \"making communication less open and efficient.\"\n\nRunning a pirate\
    \ site and being sued for what is likely to be millions of dollars in damages\
    \ hasn't stopped Elbakyan from pursuing an academic career. Her neuroscience research\
    \ is on hold, but she has enrolled in a history of science master's program at\
    \ a \"small private university\" in an undisclosed location. Appropriately enough,\
    \ her thesis focuses on scientific communication. \"I perceive Sci-Hub as a practical\
