    NEWS · PEOPLE & EVENTS


    # # The frustrated science student behind Sci-Hub


    Alexandra Elbakyan founded Sci-Hub to thwart journal paywalls


    28 APR 2016 · BY JOHN BOHANNON


    ![](img/5045c6e2edc03ff9c31671072a380124_29_0.png)


    Alexandra Elbakyan, Sci-Hub founder. APNEET JOLLY/FLICKR


    Beyond being the founder of Sci-Hub, the world''s largest pirate site for academic
    papers, and risking arrest as a result, Alexandra Elbakyan is a typical science
    graduate student: idealistic, hard-working, and relatively poor. In 1988, when
    Elbakyan was born in Kazakhstan, the Soviet Union was just beginning to crumble.
    Books about dinosaurs and evolution fascinated her early on. "I also remember
    reading Soviet science books that provided scientific explanations for miraculous
    events thought previously to be produced by gods or magic." She was hooked.


    At university in the Kazakh capital, she discovered a knack for computer hacking.
    It appealed to her because "unlike higher programming languages that are created
    by people and are volatile," making and breaking computer security systems requires
    a deeper knowledge of mathematics and the primitive ''assembly language'' that
    computers use to move information.'
