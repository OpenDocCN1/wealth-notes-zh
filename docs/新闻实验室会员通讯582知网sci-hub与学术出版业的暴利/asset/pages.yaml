  md: '![](img/5045c6e2edc03ff9c31671072a380124_12_0.png)


    Illustration: Dom McKenzie


    Aspesi was not the first person to incorrectly predict the end of the scientific
    publishing boom, and he is unlikely to be the last. It is hard to believe that
    what is essentially a for-profit oligopoly functioning within an otherwise heavily
    regulated, government-funded enterprise can avoid extinction in the long run.
    But publishing has been deeply enmeshed in the science profession for decades.
    Today, every scientist knows that their career depends on being published, and
    professional success is especially determined by getting work into the most prestigious
    journals. The long, slow, nearly directionless work pursued by some of the most
    influential scientists of the 20th century is no longer a viable career option.
    Under today’s system, the father of genetic sequencing, Fred Sanger, who published
    very little in the two decades between his 1958 and 1980 Nobel prizes, may well
    have found himself out of a job.


    Even scientists who are fighting for reform are often not aware of the roots of
    the system: how, in the boom years after the second world war, entrepreneurs built
    fortunes by taking publishing out of the hands of scientists and expanding the
    business on a previously unimaginable scale. And no one was more transformative
    and ingenious than Robert Maxwell, who turned scientific journals into a spectacular
    money-making machine that bankrolled his rise in British society. Maxwell would
    go on to become an MP, a press baron who challenged Rupert Murdoch, and one of
    the most notorious figures in British life. But his true importance was far larger
    than most of us realise. Improbable as it might sound, few'
