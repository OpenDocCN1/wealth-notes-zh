  md: 'friends abroad, saying, Can you send me a copy of this or that paper? ... The
    arrival of Sci-Hub, which democratized access to scientific literature, was very
    welcome." For the better part of the last decade, the world''s largest academic
    publishers have been playing a global game of legal whack-a-mole with Sci-Hub,
    trying to get it shut down in various countries on the grounds that it infringes
    their copyright. The publishers have won legal cases in several countries. To
    stay ahead of them, Sci-Hub has bounced from domain to domain, using mirrors from
    Taiwan to São Tomé, in order to continue operating. But in late 2020, four publishers
    — Elsevier, Wiley India, Wiley Periodicals, and the American Chemical Society
    — opened a case in India. For once, the case isn''t clear cut. Legal experts say
    that Sci-Hub could have a fighting chance under India''s unique copyright laws.
    And even if they lose, the case has prompted dozens of prominent Indian scientists
    to speak up about an issue that has divided the academic community for years:
    who gets access to, and therefore benefits from, published research.


    The publishers'' case in India alleges that Sci-Hub infringes on their copyright
    and threatens the security of personal data, and that Sci-Hub uses phishing attacks
    and stolen user credentials to gain access to copyrighted material. They have
    asked the court for a dynamic injunction — effectively requiring any internet
    service provider in India to block the platform in whatever incarnation it might
    appear in the future. The suit names Sci-Hub''s founder Elbakyan, its frequent
    partner electronic books platform Library Genesis, eight Indian internet service
    providers, and India''s Department of Telecommunications and Ministry of Electronics
    and Information Technology.


    In an emailed statement, the publishers told *Rest of World* that Sci-Hub threatens
    the academic research process because the site has no incentive to ensure the
    accuracy of scientific articles, while academic publishers "safeguard the scholarly
    record." The publishers work closely with the Indian research community, said
    the statement: "More than 1,500 academic and research institutions across India
    responsibly access scholarly articles through subscriptions to academic journals
    published by ACS, Elsevier, and Wiley." Sci-Hub did not respond to requests for
    comment by publication time.


    As the case has dragged on — across 20 hearings through 2021 — it''s become clear
    that it''s about more than just copyright law. Several groups of scientists, Ramaswamy
    among them, have applied to formally intervene in the case (a process where a
    group that is not party to a case can request to submit information akin to an
    amicus brief for the judge''s consideration), arguing that open access to scientific
    research is a matter of public importance with implications for the entire scientific
    community.


    According to Sci-Hub''s logs, 1.8 million papers were downloaded in India during
    the month of February 2022 alone. The same month, over 10 million were downloaded
    in the U.S., and nearly 30 million in China.


    > "The arrival of Sci-Hub, which democratized access to scientific literature,
    was very welcome."'
