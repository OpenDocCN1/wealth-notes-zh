- pgno: 25
  md: 'Elbakyan is an unabashed utopian. “Science should belong to scientists and
    not the publishers,” she told me in an email. In a letter to the court, she cited
    Article 27 of the UN’s Universal Declaration of Human Rights, asserting the right
    “to share in scientific advancement and its benefits”.


    Whatever the fate of Sci-Hub, it seems that frustration with the current system
    is growing. But history shows that betting against science publishers is a risky
    move. After all, back in 1988, Maxwell predicted that in the future there would
    only be a handful of immensely powerful publishing companies left, and that they
    would ply their trade in an electronic age with no printing costs, leading to
    almost “pure profit”. That sounds a lot like the world we live in now.


    Illustrations by Dom McKenzie


