- pgno: 16
  md: 'societies, desperate to get their work published in English, gave Maxwell the
    rights to their members’ results for free.


    In a letter celebrating Pergamon’s 40th anniversary, Eichi Kobayashi, director
    of Maruzen, Pergamon’s longtime Japanese distributor, recalled of Maxwell that
    “each time I have the pleasure of meeting him, I am reminded of F Scott Fitzgerald’s
    words that a millionaire is no ordinary man” .


    The scientific article has essentially become the only way science is systematically
    represented in the world. (As Robert Kiley, head of digital services at the library
    of the Wellcome Trust, the world’s second-biggest private funder of biomedical
    research, puts it: “We spend a billion pounds a year, and we get back articles.”)
    It is the primary resource of our most respected realm of expertise. “Publishing
    is the expression of our work. A good idea, a conversation or correspondence,
    even from the most brilliant person in the world ... doesn’t count for anything
    unless you have it published,” says Neal Young of the NIH. If you control access
    to the scientific literature, it is, to all intents and purposes, like controlling
    science.


    Maxwell’s success was built on an insight into the nature of scientific journals
    that would take others years to understand and replicate. While his competitors
    groused about him diluting the market, Maxwell knew that there was, in fact, no
    limit to the market. Creating The Journal of Nuclear Energy didn’t take business
    away from rival publisher North Holland’s journal Nuclear Physics. Scientific
    articles are about unique discoveries: one article cannot substitute for another.
    If a serious new journal appeared, scientists would simply request that their
    university library subscribe to that one as well. If Maxwell was creating three
    times as many journals as his competition, he would make three times more money.


    The only potential limit was a slow-down in government funding, but there was
    little sign of that happening. In the 1960s, Kennedy bankrolled the space programme,
    and at the outset of the 1970s Nixon declared a “war on cancer”, while at the
    same time the British government developed its own nuclear programme with American
    aid. No matter the political climate, science was buoyed by great swells of government
    money.'
