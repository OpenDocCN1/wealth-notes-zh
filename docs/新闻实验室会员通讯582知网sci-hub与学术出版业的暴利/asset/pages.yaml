    governments.”


    On the question of why so many scientists are so critical of journal publishers,
    Tom Reller, vice president of corporate relations at Elsevier, said: “It’s not
    for us to talk about other people’s motivations. We look at the numbers [of scientists]
    who trust their results to Elsevier] and that suggests we are doing a good job”.
    Asked about criticisms of Elsevier’s business model, Reller said in an email that
    these criticisms overlooked “all the things that publishers do to add value -
    above and beyond the contributions that public-sector funding brings”. That, he
    said, is what they were charging for.


    In a sense, it is not any one publisher’s fault that the scientific world seems
    to bend to the industry’s gravitational pull. When governments including those
    of China and Mexico offer financial bonuses for publishing in high-impact journals,
    they are not responding to a demand by any specific publisher, but following the
    rewards of an enormously complex system that has to accommodate the utopian ideals
    of science with the commercial goals of the publishers that dominate it. (“We
    scientists have not given a lot of thought to the water we’re swimming in,” Neal
    Young told me.)


    Since the early 2000s, scientists have championed an alternative to subscription
    publishing called “open access”. This solves the difficulty of balancing scientific
    and commercial imperatives by simply removing the commercial element. In practice,
    this usually takes the form of online journals, to which scientists pay an upfront
    free to cover editing costs, which then ensure the work is available free to access
    for anyone in perpetuity. But despite the backing of some of the biggest funding
    agencies in the world, including the Gates Foundation and the Wellcome Trust,
    only about a quarter of scientific papers are made freely available at the time
    of their publication.


    The idea that scientific research should be freely available for anyone to use
    is a sharp departure, even a threat, to the current system - which relies on publishers’
    ability to restrict access to the scientific literature in order to maintain its
    immense profitability. In recent years, the most radical opposition to the status
    quo has coalesced around a controversial website called Sci-Hub - a sort of Napster
    for science that allows anyone to download scientific papers for free. Its creator,
    Alexandra Elbakyan, a Kazakhstani, is in hiding, facing charges of hacking and
    copyright infringement in the US. Elsevier recently obtained a $15m injunction
    (the maximum allowable amount) against her.'
