- pgno: 19
  md: '"At the start of my career, nobody took much notice of where you published,
    and then everything changed in 1974 with Cell," Randy Schekman, the Berkeley molecular
    biologist and Nobel prize winner, told me. Cell (now owned by Elsevier) was a
    journal started by Massachusetts Institute of Technology (MIT) to showcase the
    newly ascendant field of molecular biology. It was edited by a young biologist
    named Ben Lewin, who approached his work with an intense, almost literary bent.
    Lewin prized long, rigorous papers that answered big questions - often representing
    years of research that would have yielded multiple papers in other venues - and,
    breaking with the idea that journals were passive instruments to communicate science,
    he rejected far more papers than he published.


    What he created was a venue for scientific blockbusters, and scientists began
    shaping their work on his terms. "Lewin was clever. He realised scientists are
    very vain, and wanted to be part of this selective members club; Cell was ''it'',
    and you had to get your paper in there," Schekman said. "I was subject to this
    kind of pressure, too." He ended up publishing some of his Nobel-cited work in
    Cell.


    Suddenly, where you published became immensely important. Other editors took a
    similarly activist approach in the hopes of replicating Cell''s success. Publishers
    also adopted a metric called "impact factor," invented in the 1960s by Eugene
    Garfield, a librarian and linguist, as a rough calculation of how often papers
    in a given journal are cited in other papers. For publishers, it became a way
    to rank and advertise the scientific reach of their products. The new-look journals,
    with their emphasis on big results, shot to the top of these new rankings, and
    scientists who published in "high-impact" journals were rewarded with jobs and
    funding. Almost overnight, a new currency of prestige had been created in the
    scientific world. (Garfield later referred to his creation as "like nuclear energy
    ... a mixed blessing".)


    It is difficult to overstate how much power a journal editor now had to shape
    a scientist''s career and the direction of science itself. "Young people tell
    me all the time, ''if I don''t publish in CNS [a common acronym for Cell/Nature/Science,
    the most prestigious journals in biology], I won''t get a job''," says Schekman.
    He compared the pursuit of high-impact publications to an incentive system as
    rotten as banking bonuses. "They have a very big influence on where science goes,"
    he said.


    And so science became a strange co-production between scientists and journal editors,
    with the former increasingly pursuing discoveries that would impress the latter.
    These days, given a choice of projects, a scientist will almost always reject
    both the prosaic work of confirming or disproving past studies, and the decades-long
    pursuit of a risky "moonshot", in favour of a middle ground: a topic that is popular
    with editors and likely to yield regular publications. "Academics are'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'incentivised to produce research that caters to these demands,” said the biologist
    and Nobel laureate Sydney Brenner in a 2014 interview, calling the system “corrupt.”


    Maxwell understood the way journals were now the kingmakers of science. But his
    main concern was still expansion, and he still had a keen vision of where science
    was heading, and which new fields of study he could colonise. Richard Charkin,
    the former CEO of the British publisher Macmillan, who was an editor at Pergamon
    in 1974, recalls Maxwell waving Watson and Crick’s one-page report on the structure
    of DNA at an editorial meeting and declaring that the future was in life science
    and its multitude of tiny questions, each of which could have its own publication.
    “I think we launched a hundred journals that year,” Charkin said. “I mean, Jesus
    wept.”


    Pergamon also branched into social sciences and psychology. A series of journals
    prefixed “Computers and” suggest that Maxwell spotted the growing importance of
    digital technology. “It was endless,” Peter Ashby told me. “Oxford Polytechnic
    [now Oxford Brookes University] started a department of hospitality with a chef.
    We had to go find out who the head of the department was, make him start a journal.
    And boom – International Journal of Hospitality Management.”


    By the late 1970s, Maxwell was also dealing with a more crowded market. “I was
    at Oxford University Press at that time,” Charkin told me. “We sat up and said,
    ‘Hell, these journals make a lot of money!’” Meanwhile, in the Netherlands, Elsevier
    had begun expanding its English-language journals, absorbing the domestic competition
    in a series of acquisitions and growing at a rate of 35 titles a year.


    As Maxwell had predicted, competition didn’t drive down prices. Between 1975 and
    1985, the average price of a journal doubled. The New York Times reported that
    in 1984 it cost $2,500 to subscribe to the journal Brain Research; in 1988, it
    cost more than $5,000. That same year, Harvard Library overran its research journal
    budget by half a million dollars.


    Scientists occasionally questioned the fairness of this hugely profitable business
    to which they supplied their work for free, but it was university librarians who
    first realised the trap in the market Maxwell had created. The librarians used
    university funds to buy journals on behalf of scientists. Maxwell was well aware
    of this. “Scientists are not as price-conscious as other professionals, mainly
    because they are not spending their own money,” he told his publication Global
    Business in a 1988 interview. And since there was no way to swap one journal for
    another, cheaper one, the result was, Maxwell continued, “a perpetual financing
    machine”. Librarians were locked into a series of thousands of tiny monopolies.
    There were now more'
