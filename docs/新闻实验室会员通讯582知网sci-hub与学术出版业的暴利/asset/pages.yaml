- pgno: 21
  md: 'than a million scientific articles being published a year, and they had to
    buy all of them at whatever price the publishers wanted.


    From a business perspective, it was a total victory for Maxwell. Libraries were
    a captive market, and journals had improbably installed themselves as the gatekeepers
    of scientific prestige - meaning that scientists couldn''t simply abandon them
    if a new method of sharing results came along. “Were we not so naive, we would
    long ago have recognised our true position: that we are sitting on top of fat
    piles of money which clever people on all sides are trying to sniffer on to their
    piles,” wrote the University of Michigan librarian Robert Houbeck in a trade journal
    in 1988. Three years earlier, despite scientific funding suffering its first multi-year
    dip in decades, Pergamon had reported a 47% profit margin.


    Maxwell wouldn’t be around to tend his victorious empire. The acquisitive nature
    that drove Pergamon’s success also led him to make a surfeit of flashy but questionable
    investments, including the football teams Oxford United and Derby County FC, television
    stations around the world, and, in 1984, the UK’s Mirror newspaper group, where
    he began to spend more and more of his time. In 1991, to finance his impending
    purchase of the New York Daily News, Maxwell sold Pergamon to its quiet Dutch
    competitor Elsevier for £440m (£919m today).


    Many former Pergamon employees separately told me that they knew it was all over
    for Maxwell when he made the Elsevier deal, because Pergamon was the company he
    truly loved. Later that year, he became mired in a series of scandals over his
    mounting debts, shady accounting practices, and an explosive accusation by the
    American journalist Seymour Hersh that he was an Israeli spy with links to arms
    traders. On 5 November 1991, Maxwell was found drowned off his yacht in the Canary
    Islands. The world was stunned, and by the next day the Mirror’s tabloid rival
    Sun was positing the question on everyone’s mind: “DID HE FALL ... DID HE JUMP?”,
    its headline blared. (A third explanation, that he was pushed, would also come
    up.)


    The story dominated the British press for months, with suspicion growing that
    Maxwell had committed suicide, after an investigation revealed that he had stolen
    more than £400m from the Mirror pension fund to service his debts. (In December
    1991, a Spanish coroner’s report ruled the death accidental.) The speculation
    was endless: in 2003, the journalists Gordon Thomas and Martin Dillon published
    a book alleging that Maxwell was assassinated by Mossad to hide his spying activities.
    By that time, Maxwell was long gone, but the business he had started continued
    to thrive in new hands, reaching new levels of profit and global power over the
    coming decades.'
