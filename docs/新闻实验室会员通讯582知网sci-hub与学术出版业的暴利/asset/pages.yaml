    And then we buy it and we stop doing all that stuff and then the cash just pours
    out and you wouldn''t believe how wonderful it is.'' He was right and I was wrong.”


    By 1994, three years after acquiring Pergamon, Elsevier had raised its prices
    by 50%. Universities complained that their budgets were stretched to breaking
