- pgno: 17
  md: '![](img/5045c6e2edc03ff9c31671072a380124_17_0.png)


    In its early days, Pergamon had been at the centre of fierce debates about the
    ethics of allowing commercial interests into the supposedly disinterested and
    profit-shunning world of science. In a 1988 letter commemorating the 40th anniversary
    of Pergamon, John Coales of Cambridge University noted that initially many of
    his friends “considered [Maxwell] the greatest villain yet unhung”.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'But by the end of the 1960s, commercial publishing was considered the status
    quo, and publishers were seen as a necessary partner in the advancement of science.
    Pergamon helped turbocharge the field’s great expansion by speeding up the publication
    process and presenting it in a more stylish package. Scientists’ concerns about
    signing away their copyright were overwhelmed by the convenience of dealing with
    Pergamon, the shine it gave their work, and the force of Maxwell’s personality.
    Scientists, it seemed, were largely happy with the wolf they had let in the door.


    “He was a bully, but I quite liked him,” says Denis Noble, a physiologist at Oxford
    University and the editor of the journal *Progress in Biophysics & Molecular Biology*.
    Occasionally, Maxwell would call Noble to his house for a meeting. “Often there
    would be a party going on, a nice musical ensemble, there was no barrier between
    his work and personal life,” Noble says. Maxwell would then proceed to alternately
    browbeat and charm him into splitting the biannual journal into a monthly or bimonthly
    publication, which would lead to an attendant increase in subscription payments.


    In the end, though, Maxwell would nearly always defer to the scientists’ wishes,
    and scientists came to appreciate his patronly persona. “I have to confess that,
    quickly realising his predatory and entrepreneurial ambitions, I nevertheless
    took a great liking to him,” Arthur Barrett, then editor of the journal *Vacuum*,
    wrote in a 1988 piece about the publication’s early years. And the feeling was
    mutual. Maxwell doted on his relationships with famous scientists, who were treated
    with uncharacteristic deference. “He realised early on that the scientists were
    vitally important. He would do whatever they wanted. It drove the rest of the
    staff crazy,” Richard Coleman, who worked in journal production at Pergamon in
    the late 1960s, told me. When Pergamon was the target of a hostile takeover attempt,
    a 1973 Guardian article reported that journal editors threatened “to desert” rather
    than work for another chairman.


    Maxwell had transformed the business of publishing, but the day-to-day work of
    science remained unchanged. Scientists still largely took their work to whichever
    journal was the best fit for their research area – and Maxwell was happy to publish
    any and all research that his editors deemed sufficiently rigorous. In the mid-1970s,
    though, publishers began to meddle with the practice of science itself, starting
    down a path that would lock scientists’ careers into the publishing system, and
    impose the business’s own standards on the direction of research. One journal
    became the symbol of this transformation.'
