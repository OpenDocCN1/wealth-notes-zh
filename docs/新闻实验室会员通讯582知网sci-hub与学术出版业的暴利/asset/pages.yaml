  md: 'The Indian scientists'' argument boils down to fairness. Researchers at wealthy
    universities, disproportionately located in North America and Europe, indirectly
    benefit from restricted access to published papers. "Since they can easily pay
    these charges, this gives them a competitive advantage over academics from other
    countries who cannot pay," theoretical physicist Suvaraj Raju, who spends his
    days untangling the mystery of what happens inside black holes at the International
    Centre for Theoretical Sciences in Bengaluru, told Rest of World.


    Raju said there are better models out there for distributing academic research.
    There''s SciPost, a publication portal for several open-access journals based
    in the Netherlands, which he edits. As a physicist, he rarely needs to pay for
    access to any paper he wants: they''re all on arXiv, the 30-year-old original
    open access digital repository for pre-prints of scientific articles in specific
    fields like physics, mathematics, and computer science. Use of pre-print platforms
    like bioRxiv and medRxiv to access the latest infectious disease research has
    exploded during the coronavirus pandemic. Articles don''t have to be peer reviewed
    or published by a journal to appear on a pre-print platform, although many are
    updated post-publication. They''re available faster but haven''t always received
    the same level of scrutiny.


    "One of arXiv''s early intents, over 30 years ago, was to level the playing field
    for researchers ... and it was possible to do so without breaking copyright or
    other law," arXiv founder Paul Ginsparg told Rest of World. Ginsparg says Sci-Hub''s
    model isn''t sustainable. "If you don''t like the game, rather than break the
    rules, it''s preferable to change them."


    Some scientists hope that Sci-Hub''s case in India could change the rules. Sci-Hub
    lost a similar case in the U.S. in 2015 (and was ordered to pay $15 million in
    damages just two years later), but India''s laws include a provision for "fair
    dealings," also known as fair use, an exception under the Copyright Act, which
    permits the use of copyrighted work for research, according to Tanmay Singh, a
    counselor at the Internet Freedom Foundation, which is providing legal advice
    to a group of social science researchers who have applied to intervene in the
    case. The Internet Freedom Foundation says this provision could be read in such
    a way that the researchers'' ability to access the material is a right.


    If Sci-Hub doesn''t win, it''s unlikely to stop publishing anyway. A dynamic injunction
    won''t stop the site from constantly moving between mirrors, said Arul George
    Scaria, associate professor of law at National Law University, Delhi. And, deciding
    to block Sci-Hub permanently from India won''t change the underlying dynamics
    that created a need for the platform in the first place: rising costs and disagreement
    over the value of open access, said Koushika at Tata Institute of Fundamental
    Research. "Until those issues are resolved, Sci-Hub meets a need," said Koushika.
    "No matter what you do, I don''t know where [in the world] you can squelch it,
    because you will have a mirror site coming up somewhere else."


    Meaghan Tobin is a reporter at Rest of World.'
