  img_proc: true
- pgno: 13
  md: 'people in the last century have done more to shape the way science is conducted
    today than Maxwell.


    In 1946, the 23-year-old Robert Maxwell was working in Berlin and already had
    a significant reputation. Although he had grown up in a poor Czech village, he
    had fought for the British army during the war as part of a contingent of European
    exiles, winning a Military Cross and British citizenship in the process. After
    the war, he served as an intelligence officer in Berlin, using his nine languages
    to interrogate prisoners. Maxwell was tall, brash, and not at all content with
    his already considerable success - an acquaintance at the time recalled him confessing
    his greatest desire: “to be a millionaire”.


    At the same time, the British government was preparing an unlikely project that
    would allow him to do just that. Top British scientists - from Alexander Fleming,
    who discovered penicillin, to the physicist Charles Galton Darwin, grandson of
    Charles Darwin - were concerned that while British science was world-class, its
    publishing arm was dismal. Science publishers were mainly known for being inefficient
    and constantly broke. Journals, which often appeared on cheap, thin paper, were
    produced almost as an afterthought by scientific societies. The British Chemical
    Society had a months-long backlog of articles for publication, and relied on cash
    handouts from the Royal Society to run its printing operations.


    The government’s solution was to pair the venerable British publishing house Butterworths
    (now owned by Elsevier) with the renowned German publisher Springer, to draw on
    the latter’s expertise. Butterworths would learn to turn a profit on journals,
    and British science would get its work out at a faster pace. Maxwell had already
    established his own business helping Springer ship scientific articles to Britain.
    The Butterworths directors, being ex-British intelligence themselves, hired the
    young Maxwell to help manage the company, and another ex-spook, Paul Rosbaud,
    a metallurgist who spent the war passing Nazi nuclear secrets to the British through
    the French and Dutch resistance, as scientific editor.


    They couldn’t have begun at a better time. Science was about to enter a period
    of unprecedented growth, having gone from being a scattered, amateur pursuit of
    wealthy gentleman to a respected profession. In the postwar years, it would become
    a byword for progress. “Science has been in the wings. It should be brought to
    the centre of the stage - for in it lies much of our hope for the future,” wrote
    the American engineer and Manhattan Project administrator Vannevar Bush, in a
    1945 report to President Harry S Truman. After the war, government emerged for
    the first time as the major patron of scientific endeavour, not just in the military,
    but through'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'newly created agencies such as the US National Science Foundation, and the
    rapidly expanding university system.


    When Butterworths decided to abandon the fledgling project in 1951, Maxwell offered
    £13,000 (about £420,000 today) for both Butterworth’s and Springer’s shares, giving
    him control of the company. Rosbaud stayed on as scientific director, and named
    the new venture Pergamon Press, after a coin from the ancient Greek city of Pergamon,
    featuring Athena, goddess of wisdom, which they adapted for the company’s logo
    – a simple line drawing appropriately representing both knowledge and money.


    In an environment newly flush with cash and optimism, it was Rosbaud who pioneered
    the method that would drive Pergamon’s success. As science expanded, he realised
    that it would need new journals to cover new areas of study. The scientific societies
    that had traditionally created journals were unwieldy institutions that tended
    to move slowly, hampered by internal debates between members about the boundaries
    of their field. Rosbaud had none of these constraints. All he needed to do was
    to convince a prominent academic that their particular field required a new journal
    to showcase it properly, and install that person at the helm of it. Pergamon would
    then begin selling subscriptions to university libraries, which suddenly had a
    lot of government money to spend.


    Maxwell was a quick study. In 1955, he and Rosbaud attended the Geneva Conference
    on Peaceful Uses of Atomic Energy. Maxwell rented an office near the conference
    and wandered into seminars and official functions offering to publish any papers
    the scientists had come to present, and asking them to sign exclusive contracts
    to edit Pergamon journals. Other publishers were shocked by his brash style. Daan
    Frank, of North Holland *Publishing* (now owned by Elsevier) would later complain
    that Maxwell was “dishonest” for scooping up scientists without regard for specific
    content.


    Rosbaud, too, was reportedly put off by Maxwell’s hunger for profit. Unlike the
    humble former scientist, Maxwell favoured expensive suits and slicked-back hair.
    Having rounded his Czech accent into a formidable posh, newsreader bass, he looked
    and sounded precisely like the tycoon he wished to be. In 1955, Rosbaud told the
    Nobel prize-winning physicist Nevill Mott that the journals were his beloved little
    “ewe lambs”, and Maxwell was the biblical King David, who would butcher and sell
    them for profit. In 1956, the pair had a falling out, and Rosbaud left the company.


    By then, Maxwell had taken Rosbaud’s business model and turned it into something
    all his own. Scientific conferences tended to be drab, low-ceilinged affairs,
    but when Maxwell returned to the Geneva conference that year, he rented a house
    in nearby'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'Collonge-Bellerive, a picturesque town on the lakeshore, where he entertained
    guests at parties with booze, cigars and sailboat trips. Scientists had never
    seen anything like him. “He always said we don’t compete on sales, we compete
    on authors,” Albert Henderson, a former deputy director at Pergamon, told me.
    “We would attend conferences specifically looking to recruit editors for new journals.”
    There are tales of parties on the roof of the Athens Hilton, of gifts of Concorde
    flights, of scientists being put on a chartered boat tour of the Greek islands
    to plan their new journal.


    By 1959, Pergamon was publishing 40 journals; six years later it would publish
    150. This put Maxwell well ahead of the competition. (In 1959, Pergamon’s rival,
    Elsevier, had just 10 English-language journals, and it would take the company
    another decade to reach 50.) By 1960, Maxwell had taken to being driven in a chauffeured
    Rolls-Royce, and moved his home and the Pergamon operation from London to the
    palatial Headington Hill Hall estate in Oxford, which was also home to the British
    book publishing house Blackwell’s.


    Scientific societies, such as the British Society of Rheology, seeing the writing
    on the wall, even began letting Pergamon take over their journals for a small
    regular fee. Leslie Iversen, former editor at the Journal of Neurochemistry, recalls
    being wooed with lavish dinners at Maxwell’s estate. “He was very impressive,
    this big entrepreneur,” said Iversen. “We would get dinner and fine wine, and
    at the end he would present us a cheque - a few thousand pounds for the society.
    It was more money than us poor scientists had ever seen.”


    Maxwell insisted on grand titles - “International Journal of” was a favourite
    prefix. Peter Ashby, a former vice president at Pergamon, described this to me
    as a “PR trick”, but it also reflected a deep understanding of how science, and
    society’s attitude to science, had changed. Collaborating and getting your work
    seen on the international stage was becoming a new form of prestige for researchers,
    and in many cases Maxwell had the market cornered before anyone else realised
    it existed. When the Soviet Union launched Sputnik, the first man-made satellite,
    in 1957, western scientists scrambled to catch up on Russian space research, and
    were surprised to learn that Maxwell had already negotiated an exclusive English-language
    deal to publish the Russian Academy of Sciences’ journals earlier in the decade.


    “He had interests in all of these places. I went to Japan, he had an American
    man running an office there by himself. I went to India, there was someone there,”
    said Ashby. And the international markets could be extremely lucrative. Ronal
    Suleski, who ran Pergamon’s Japanese office in the 1970s, told me that the Japanese
    scientific'
