  md: '# REPORTS


    Sci-Hub, the site for pirated

    academic papers, is on trial in India


    Dozens of Indian academics say blocking the site would have catastrophic consequences.


    By MEGHAN TOBIN


    3 MARCH 2022


    The doctoral researchers in Sandhya Koushika’s neuroscience lab have something
    that sets them apart from students at some of India’s other universities. It’s
    not just that they’re top students who earned spots at one of the premier public
    universities in India’s competitive education system, the Tata Institute of Fundamental
    Research, or that they’re conversant enough in the neurobiology of Caenorhabditis
    elegans (roundworms) to draw comics full of worm jokes. It’s that they can access
    scientific research published in some of the world’s largest academic journals.


    Academic journals are expensive. Each department might need access to several
    journals, each costing a few thousand dollars for annual access — and bills can
    easily reach into the hundreds of thousands per year across an entire university,
    prices even some of the world’s wealthiest universities have complained are untenable.
    “It’s so much money, the kind of money with which I could run my lab here — it
    seemed wrong in a fundamental way,” Koushika told Rest of World. “After all, the
    research is largely funded by public money. And we all [peer] review for free.
    Yet we pay so much?”


    But for students at the many research institutions around the world that can’t
    afford the subscriptions, there’s Sci-Hub. Created and operated by the Kazakhstani
    computer scientist Alexandra Elbakyan, Sci-Hub is a free repository for academic
    papers — more than 87 million of them at the time of publication. The overwhelming
    majority of these papers have already been published in copyrighted journals elsewhere.
    The site was explicitly created as a way to circumvent the journals’ paywalls,
    bringing millions of researchers access to published articles they couldn’t otherwise
    afford. Now, a court case in India threatens to block access. Rest of World spoke
    with almost a dozen academics who told us that the decision to permanently block
    access to Sci-Hub could have catastrophic consequences for learning and scientific
    development in the country.


    “Different institutions have very different access to funds, so for many people,
    myself included, Sci-Hub was offering access to a lot of scholarly material that
    my library would not have subscribed to,” said Ram Ramaswamy, a retired scientist
    who was president of the Indian Academy of Sciences, Bangalore, from 2016 to 2018.
    “It gets tiring after a while to be writing to'
