  md: '# 学术出版行业背后的英国大亨


    学术出版业是如何一步步走到今天这般田地的？《卫报》的一篇文章对这个过程做了详尽的梳理。


    二战之后，英美等国的科学研究腾飞，出现大量研究成果。而当时的学术出版主要还是依靠各个学科的学会自行印制一些刊物。这些刊物不仅纸张和印刷质量很差，而且出版滞后。英国政府决定让一家本土出版商和著名的德国出版商Springer合作，建立一套商业化的流程，以支持学术作品的出版。


    英国富豪Robert Maxwell正是抓住了这个机会，赚到了大钱。他在1951年花1.3万英镑（相当于现在的42万英镑）买下了英德合作的这部分出版业务，并建立了新的公司，名为Pergamon。


    他采用了非常激进的商业策略：不断去说服知名学者创办新的学术刊物（1959年有40份，到1965年已经有150份，而它的主要竞争对手只有50份），然后将刊物卖给大学图书馆。那时，在各
    国政府大力发展科研的背景下，大学图书馆突然有了大笔政府经费，正好可以用于购买这些期刊。


    那么，不断办新刊，真的有那么论文可以发表吗？Robert Maxwell对此并不担心，因为他洞察了学术出版的本质——新办刊物并不会稀释市场，因为这个市场根本就没有边界。在《核物理》之外再办一份《核能学刊》，并不意味着《核物理》就办不下去了，因为科学发现就是靠论文的方式承载的，而每一篇论文都有着独特的发现，很难相互替代。因此，一旦有知名学者创办了一份严肃的新刊物，学者们就会要求自己的大学图书馆订阅。只要政府投入的科研经费还在，Robert
    Maxwell就根本不担心销路，他的主要精力都用于接近那些知名学者，请他们吃好喝好，签他们给自己办刊物。


    为了办更多的刊物，Robert Maxwell的“魔爪”不仅伸到了日本、印度这样的国家，甚至还伸到了苏联。1957年，当苏联发射了人类第一颗人造卫星之后，西方科学家还在奋力追赶苏联的太空研究，而大家惊讶地发现：Robert
    Maxwell已经在10年之前就 跟苏联科学院谈好了出版英文刊物的合同。


    就这样，到1960年代时，学术出版的模式已经成了人们默认的规则。科学家可谓是引狼入室，不过这匹狼确实让学术出版变得更有效率，因此很多学者也发现自己...（内容被截断）'
