  md: '# / 第一版序¹ /


    時間是一種客觀存在，在東方人史觀中，意謂著四季更替，或是太陽在黃道上的運行。然而，從近代物理來看，時間涵蓋了運動過程的連續狀態與瞬間狀態；就相對論而言，時間與空間組成四維時空，成為宇宙的基本結構，而且時間與空間並非絕對，而是相對的。


    在金融市場中，技術分析的構成元素，也和時間與空間有關，只是一般在探討技術分析時，大多只針對空間進行討論，對於時間的探討卻是少之又少。《對稱理論》應該算是少數討論時間的技術分析書籍之一。


    縱使如此，筆者所提供的討論資訊，依然以空間（價格）為主；因為礙於時間的不可逆性，使得進入研究時間的門檻較空間高，畢竟我們可以利用力學討論股價下墜後，會出現反彈的慣性作用，卻無法解釋時間為何總是一去不復返，至於科幻小說中的回到過去，就目前科技而言只是夢想。本書對於時間的研究，總算成為一個小小的開端，希望能藉由本


    1 本書第一版的书名为《對稱理論》，由大悠出版有限公司於 2010 年出版。'
  merge: -1
  img_proc: true
