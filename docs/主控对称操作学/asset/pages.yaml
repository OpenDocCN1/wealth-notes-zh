- pgno: 179
  md: '任何金額商品的操作，最重要的是價格，而非價值。價格是基於供需原理，買賣雙方同意的代價，屬於一種商品交換關係。許多技術分析的研究者認為，成交量的變化重於價格的變化。然而，追根究柢，交易仍然是以價格多寡為取向，而非成交量，其他技術分析的方法皆然。因此，研究價格的變化才是市場技術分析的主流。


    雖然本章討論的是價格的對稱，但型態與價格之間的關聯性相當高，兩者難以切割。在前幾個章節討論型態的對稱時，不免會運用到價格計算；而在本章討論價格對稱時，仍脫離不了型態對稱的運用。如果因為章節區分不夠精確而造成讀者的閱讀困擾，請大家見諒。


    # 平衡中軸原理


    平衡中軸又稱為主控樁線，是「主控理論」中最具代表精神的關鍵運用之一，同時代表三種對稱的涵義：時間、空間與型態。也就是說，操作者可以據此評估未來可能的波動時間、價格目標，與走勢模型。目前坊間出版的書籍中，與平衡中軸有異曲同工之妙的理論是《亞當理論》。《亞當理論》探討價格對稱，該書作者在探討時間轉折時，以「三角洲理論」（DELTA
    Phenomenon）為主。

    部分操作者非常推崇亞當理論，卻排斥波浪理論。其'
  merge: -1
  img_proc: true
- pgno: 180
  md: '實，亞當理論所描述的走勢，就是波浪理論的攻墜走勢模型，而且波浪理論所描述的走勢模型更為完整——包含了攻墜模型與調整模型。排斥波浪理論的操作者如果不是無知，就是未能完全瞭解波動的真實意涵，因為波浪理論不但說明了順勢操作可能出現的走勢模型，也描述了進入「混沌」時可能出現的走勢模型，並闡述層級之間的差異，只是一
    般使用者沒有深入理解而導致誤用。筆者可以肯定地告訴各位投資人：亞當理論、波浪理論、道氏理論，以及其他股市中的理論，都是在描述股價波動的行為，只是運用的方法不同。一旦理解，自然就會發現這些理論之間的相似性。


    或許有人會問：「如果我不懂波浪理論，是不是就無法操作？」當然不是，只要能確實執行既定的操作策略，通常都可以獲得不錯的投資報酬率，因為操作時產生的嚴重虧損，往往不是源自於技術分析的能力出了問題，而是因為操作心態出了問題。


    《亞當理論》開宗明義就說：「亞當理論告訴操作者，市場未來最可能行進的方向。運用亞當理論的預測技術，操作者可以預估並確實看見行進的路線。」實際上，以上所述都是主觀的預測，操作者主觀評估走勢即將上漲或下跌，然後根據眼前所見的事實進行操作。至於後續走勢是不是真的如預測般上漲或下跌，只有上帝才知道。因此，這種「順勢操作」的理論，與市場上所有技術分析的理論相同，都充滿臆'
  merge: -1
  img_proc: true
- pgno: 181
  md: '測、猜想與期待，所以更需要策略的協助，規避各種不確定性所帶來的風險。這一章將嘗試整合這些觀念，幫助投資人更進一步認識股價波動。


    平衡中軸和亞當理論一樣，可以提供完整的操作系統，除了方向性，針對停利與停損的設置、目標的評估等等，都能夠提供良好的研判依據。但是，利用亞當理論的觀念進場時，在操作策略上屬於追買法或追賣法，所以面對操作的市場週轉率不高、胃納量太小，或部位較大的投資人、法人機構等，使用時必須更加謹慎。對於這一點，解決方法是：


    利用平衡中軸理論的不同輪廓層級進場操作，或是在盤底或盤頭期的發動訊號成立時就進場。


    利用平衡中軸進行操作時，必須明白下列幾點：


    +   1. 理論形成的依據。\n2. 進行操作的原則。\n3. 停損點的設置。\n4. 目標與時間的評估。\n5. 中軸的移動。\n6. 定位與操作的邏輯。\n7.
    走勢完成的定位與推演。


    其中第四點有關目標與時間的評估，僅能提示基本的觀念，而第五至七點的詳細內容，牽涉到主控理論中；關於一'
  merge: -1
  img_proc: true
- pgno: 182
  md: '轉三、三合一，推浪、轉浪與箱子移轉，是三個箱子還是兩個箱子的堆疊，或時間與型態的評估等等關鍵，其中定義或操作邏輯都無法在書本中或網站論壇上公開討論，請投資朋友們見諒。


    # 理論形成的依據


    什麼是價格對稱？因投資人對亞當理論較為熟悉，因此筆者借用亞當理論中的論述加以說明：在上漲走勢時，第三象限與第一象限成倒影；在下跌走勢時，第四象限與第二象限成倒影。圖
    6-1 顯示上漲走勢中的對稱，而圖 6-2 顯示下跌走勢中的對稱。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_182_0.png)


    先以圖 6-1 為例進行說明。如果股價呈現底部墊高、高點也創高的多頭波動，並出現「突破」的行為時，在突破點之前的股價波動，將被定位在第三象限（III）。未來走勢的模'
  merge: -1
  img_proc: true
- pgno: 183
  md: '型，將以十字軸線的中點為映射點，將第三象限走勢圖，翻轉到第一象限（I）的位置。


    第三象限代表實際已經完成的走勢波動，經過翻轉映射到第一象限的走勢圖，則是預估未來可能發生的走勢。圖中標示的數字如果相同，表示彼此為對稱點；也就是說，利用翻轉映射所形成的對稱，可以揭示走勢未來可能完成的時間、價格與型態。


    例如，在第三象限的時間距離是 T1，對稱點 P 後的時間距離是 T2，在正常情形下 T1=T2，屬於時間對稱；在第三象限的上漲幅度是 P1，對稱點 P 後的未來上漲幅度是
    P2，在正常情形下 P1=P2，屬於價格對稱；在第三象限出現 1、3、5 的波谷，對稱點 P 後出現 5、3、1 的波峰，屬於型態對稱。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_183_0.png)


    圖 6-2 第二象限與第四象限的對稱


    圖 6-2 中的走勢圖呈現高點越來越低、低點也越來越低'
  merge: -1
  img_proc: true
- pgno: 184
  md: '的空頭波動。當走勢出現「突破」行為時，在突破點之前的股價波動，將被定位在第二象限（II），未來走勢的模型，將以十字軸線的中點為映射點，將第二象限走勢圖翻轉到第四象限（IV）的位置。圖中第二象限代表實際已經完成的走勢波動，經過翻轉映射到第四象限的走勢圖，則是預估未來可能發生的走勢。圖中標示的數字如果相同，表示彼此為對稱點。


    如果在第二象限的時間距離是 T1，對稱點 P 後的時間距離是 T2，在正常情形下 T1＝T2，屬於時間對稱；在第二象限的下跌幅度是 P1，對稱點 P 後的未來下跌幅度是
    P2，在正常情形下 P1＝P2，屬於價格對稱；在第二象限出現 1、3、5 的波峰，對稱點 P 後出現 5、3、1 的波谷，屬於型態對稱。


    無論是第三象限與第一象限的對稱，或第二象限與第四象限的對稱，這些翻轉走勢圖進行評估的方法是非常理想化的模型，實際走勢不可能如此標準地呈現。因此，在實務操作上，只需要利用這種觀念確立停利與停損點。


    如果要評估走勢未來可能出現的模型，只要能找到對稱位置的關鍵點，並加以思考推演即可，不需要利用投影片或電腦程式將圖形翻轉映射。在本章的運用範例，初期會將圖形翻轉映射，協助投資人建立觀念，後續的範例將略過這個動作。至於如何直接在圖形上觀察並模擬想像映射圖形，請讀者自行練習。'
