    本書是《主控戰略》系列完整最後一本，書中不但保留傳統型態學的完整面貌，更增添了坊間沒有提及的關鍵技巧。透過本書的介紹必能使投資人更深入認識《型態學》，從而掌握獲利關鍵，其實用性將是學習技術分析愛好者的最佳選擇之一。


