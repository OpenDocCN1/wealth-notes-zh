    # 圖 6-21 大同股價的運用圖例（資料來源：奇狐勝券）


    請看圖 6-21，操作思維如下：


    +   1. 取標示 P 為對稱軸，在標示 A 完成 P1=P2 的價格對稱，依價格優先原則，多單應先行出場，以規避震盪走勢浪費持股時間，甚至出現反轉導致多單利潤被嚴重侵蝕。


    +   2. 標示 A 完成價格對稱的時間 T2，以及標示 B 完成型態對稱的時間 T3，這兩者都遠遠小於 T1 的時間對稱。


    +   3. 如果要完成時間對稱，走勢圖必然會在價格與型態對稱結束後，再出現多頭續訊號；沒有訊號就不需要考慮。'
