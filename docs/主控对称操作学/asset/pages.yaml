  md: '書拋磚之舉，激發投資人更多智慧火花，並能讓金融市場中對於時間的研究再開拓出一番新局。


    《對稱理論》的寫作對象是略具基礎操作經驗的投資人，最好是對筆者的前幾本著作有一些基本概念，閱讀時才不會感到艱澀。在此，筆者仍要苦口婆心地對各位投資朋友強調：技術分析或許可以速成，心態與策略的養成絕對需要時間。放慢在市場中學習的腳步，穩紮穩打，才是在這詭譎多變的市場中，求生保命之道。


    感謝各位投資朋友對筆者的支持，也歡迎到筆者架設的網站討論有關技術分析的種種問題。進入本網站請先註冊成為網站會員，註冊完全免費；所有關於註冊方法與各種注意事項的資訊，均在網站首頁的相關連結中詳細說明。假設在註冊過程中出現問題，請寄
    email 給我，我的信箱公布在網站首頁。同時，大陸網友在瀏覽網站時常常發生無法連線或瀏覽速度很慢的現象，這是因為網站被屏蔽了，請使用代理伺服器解決這個問題。


