    長久以來，閱讀拙作《主控戰略》、《實戰手記》與《主控戰略筆記》書系的朋友都知道，筆者的技術分析師承李進財教授與謝佳穎老師。我們師徒三人從未強調技術分析有什麼派別，因為各種技術分析技巧的研究到最後都殊途同歸，只是運用的方法有所不同罷了。從
    2003 年以來，由於筆者鬥膽寫了幾本書後，逐漸被冠上「主控派」的名號。這個名號在我們心中，有也好，沒有也罷，並無礙李教授與謝老師推廣這套技術分析的心願，且筆徒在傳承這一技術分析邏輯系統時，無論是技術分析，還是為人處世，從未敢忘兩位老師對筆者的指導。


    當然，經過這樣的推廣，這套系統難免會被過度渲染，或者被穿鑿附會、加油添醋，但這些都不是我們的本意，卻也無法一一澄清解釋，因此需勞煩有心學習這套技術系統者自行辨識；畢竟傳承這套技術系統者，可以加入自己的獨到見解，或是對原始定義做不同的詮釋——我們對此都樂觀其成，只要能妥適運用於股價波動的研判，都是好方法。


    然而，筆者必須說明的是：對技術分析有興趣的朋友，'
