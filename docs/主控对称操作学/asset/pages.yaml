    1 個康德拉季耶夫週期，或是將 2 個尤格拉週期視為 1 個庫茲涅茨週期。


    # 五、基欽週期


    基欽週期（Kitchin cycle）是由美國經濟學家約瑟夫・基欽（Joseph Kitchin）在 1923 年提出。所謂基欽週期，是指利率、物價、生產、就業人數等統計資料，在
    40 個月內（約 3 至 4 年）會呈現有規則的波動。這個循環的主要原因，在於廠商生產過多時就會形成存貨，從而減少生產，當原本存貨被消耗殆盡後，就會激起存貨更新而帶動循環，因此又稱短波理論或存貨週期。


    如果基欽週期暫時以 3 年為期（36 個月），正好符合費波納奇係數中的 3，而 3 個基欽週期可構成 1 個尤格拉週期，18 個基欽週期構成 1 個康德拉季耶夫週期。也就是說，可以將基欽週期視為尤格拉週期、班納理論、十年價格型態，以及康德拉季耶夫週期的小循環週期。


