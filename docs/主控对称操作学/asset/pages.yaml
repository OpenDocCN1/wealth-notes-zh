- pgno: 11
  md: '是否選擇這套邏輯系統，或是選擇跟隨哪位老師學習，純粹是讀者的個人喜好，與我們無涉。同時，也請對自己的選擇負責，不該要求我們回應所有冠上這些理論名稱的相關問題，因為其所學的原始定義可能已經過修改，也有可能是名稱相同。萬一我們的回答與其所學不同，只會增加困擾與紛爭；為了避免這些情況，我們懇請這些朋友的諒解。


    至於其他正在推廣這套邏輯系統的老師，如果不願意聲明其師承，必有其苦衷與考量，也請參與者無需忿忿不平。只要能在市場上找到一個適合自己的方法，然後讓自己逐漸邁向經濟自由，這就是我們推廣技術分析的心願了。


    # 關於「推浪三部曲」


    如何明確、簡易地詮釋「道氏理論」與「波浪理論」，或如何理解整體股價波動的結構，並落實在實際操作の運用，是筆者從學李進財教授以來一直在思考的問題。終於，在閱讀無數線圖之後忽然靈光乍現，以前所有學習累積的能量爆發，讓筆者匯聚出一條清晰的思路，從而歸納演繹出一套系統，即「推浪三部曲」，並在教學相長的過程中不斷淬煉出系統的完整性與實用性。


    「推浪三部曲」包含兩大系統：一是行進間隨著走勢調整的推演；一是走勢告一段落後的評估與定位。這些系統同時'
  merge: -1
  img_proc: true
- pgno: 12
  md: '包含了買賣點、滿足目標與風險的評估、相對位置的定位等功能。縱使走勢是隨機與不可預測的，利用這套系統依然無礙上述功能運作。無論波段操作者或短線當沖客，都可以使用這套系統，差異在於：觀察的層級越高，相對的風險就越低。當然，要達到運用自如，除了必須將傳統波浪、型態學、指標等觀念導入，還要不斷練習、閱讀歷史線圖，並加強自己的思考邏輯，才能熟悉這套系統的推演。


    運用「推浪三部曲」進行股價波動的推演時，難免會帶有主觀認知，由此導出該股是否適合操作（風險較低）或不適合操作（風險較高）的主觀斷定；這與方法的有效度無關，而是操作者對這個市場與方法的認識程度深淺不同所導致。經由不斷練習與調整，在理想的行為模型下，操作者對未來走勢的判斷可以趨近於實際走勢的輪廓，同時也可以利用這套方法推演或模擬未來許多可能出現的不同走勢，然後根據這些心得擬定相對應的操作策略、進場資金的控管與比例，同時清楚了解停損與停利的位置。這是一個非常完整的操作邏輯系統。


    運用這套系統更可以擺脫「波浪理論」對於延伸波不易定位的困擾；也就是說，該理論由最小的漣漪開始，推演到波浪或潮汐的變化，然後定位走勢的可能輪廓。既然能夠定位波動的可能輪廓，相對位置就很容易掌握了，因此我們可以配合
    K 線的訊號如酒田 K 線、黑白無常訊號或 N 字理'
  merge: -1
  img_proc: true
- pgno: 13
  md: '論，執行買賣細節；也可以利用指標如均線、RSI、KD、MACD 與 DMI 指標等等，協助篩選可締的買賣訊號。以上這些買賣訊號將因為相對位置經過定位，買賣的風險得以降低，且停損與停利的設定也會相對適當、明確。


    事實上，這套系統的基礎理論非常簡單。雖然這是化繁為簡的精髓佳作，運用起來卻是千變萬化。如果沒有逐步且系統性的引導與推演，這套系統很容易被認為是糟糠之作，而這也是筆者不願意在書中公開的原因之一。唯有口授心傳，才能有效傳承這套系統的堂奧。筆者也不否認這套系統還有一些細節需要微調，而微調的關鍵需要時間做為催化劑，如果一知半解的人誤用或錯用，那就不枉可惜。


    筆者給這套系統的定位是：「推浪三部曲」是趨近於自然律波動的運用法則。就算法人與主力莊家，也不能擺脫自然律的運作。無論讀者真的相信這項論點，或認為這是筆者的自我意識過度膨脹與誇大，總之，這套系統述說的是事實的客觀存在，筆者不過是僥倖發現了。而且，「推浪三部曲」對走勢的研判確實契合國外的「亞當理論」、「波浪理論」等等，更加證明了所有技術分析技巧與理論都是在詮釋自然律的波動。


    至於未經筆者以引導的方式認識「推浪三部曲」，因而無法產生認同感，這種情況是正常的，畢竟技術分析的運用技巧有千萬種，只要能夠讓自己賺錢的方法就是好方法。如果'
