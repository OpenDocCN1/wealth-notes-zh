- pgno: 39
  md: '筆者在前一章不斷強調宇宙中充滿了對稱；相對的，本章卻要告訴讀者，更多事物呈現的是不對稱狀態，或是看似對稱但實際上並不完美的狀態。換言之，在我們強調對稱的過程中，也要接受沒有對稱或對稱不完美的事實。


    對稱的不完美性，會有什麼影響？首先來看 2008 年諾貝爾物理學獎三位得主的研究：自發對稱性破缺（spontaneous broken symmetries）。自發對稱性破缺是指當一個對稱性系統進入非對稱真空態時，這個系統的行為不再具備對稱性特徵。


    這三位科學家分別是日裔美國科學家南部陽一郎（Yoichiro Nambu）及二位日本科學家小林誠（Makoto Kobayashi）和益川敏英（Toshihide
    Maskawa）。南部陽一郎於 1961 年首次指出：在基本粒子的世界中，對稱性會自動消失，而自發對稱性破缺的研究解決了基本粒子理論的諸多謎題。自發對稱性破缺、夸克和基本粒子品質的起源都是近代物理學的重要概念，諾貝爾獎委員會表示：「我們的世界未能完美對稱運作，係因最微小等級的對稱偏差。」


    宇宙每產生 100 億個反物質粒子的同時，就有一個額外物質粒子的偏離，正是這種偏離導致對稱性破缺，才使得現今宇宙能夠持續存在。也就是說，如果宇宙沒有產生「對稱性破缺」，我們恐怕就無法存在於世。這種不完美的偶然與幸運，只能推說是造物者另一項神奇傑作。'
  merge: -1
  img_proc: true
- pgno: 40
  md: "另一種不完美的對稱，是源自於平衡（balance，又稱為均衡），也可以稱為感覺對稱：雖左右非完全相等，但在視覺上也能產生對稱的感覺。我們可以藉由重量、空間、顏色、大小等等分佈，造成視覺上產生均衡的感覺，因此筆者對此定義為「和諧的不完美對稱」。\
    \ \n\n對稱的形式必定均衡，但是均衡的形式卻不一定對稱。相較於對稱，均衡有更大的變化性與彈性，容易給人活潑、優美的感覺。在生活中的各個面向，比如繪畫的構圖、雕塑的結構安排、建築景觀的造形布置，或舞蹈動作的設計，往往可見均衡的運用痕跡。\n\
    \n細查汽車的結構，便可以發現那並不完全對稱。如果打開引擎蓋，我們可以看見汽車引擎的位置必定偏向駕駛座，而汽車的駕駛座也沒有正好放置在中間位置，反而是偏向左側或右側。同樣的，人類的臉龐雖然看似左右對稱，但如果仔細分辨，仍有些許差異。人類的心臟位於胸腔左側（極少數人會在右側，但都不是在正中央），人體則是由左旋胺基酸與右旋醣類所構成。化學中有不對稱合成（Asymmetric\
    \ synthesis），大自然中更是常見不對稱的現象，例如豹、狗、貓等動物身上的斑點與花紋。\n\n此外，還有一種有趣的不對稱現象：時間上的不對稱。例如，大多數鳥類飛行時都是同時拍打雙翅，但若仔細觀察，就可發現燕子和蝙蝠是交替拍打雙翅。"
  merge: -1
  img_proc: true
