    上述這種走勢稱為「常態行情」，投資人可以根據歷史圖形中的明顯轉折，找到可靠的參考值。以圖 5-6 為例，標示 A 的水平線為指標正乖離過大，標示 B 的水平線為指標負乖離過大；當
