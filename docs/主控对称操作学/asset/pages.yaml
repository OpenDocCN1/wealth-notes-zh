    以雙重底（頂）的型態為例，請看圖 1-15 左圖，股價往下突破時，應取 L0 的谷底為頸線，當做對稱軸計算未來可能目標。這時候可以利用第二頭 H1 進行計算，也可以取第一頭
    H0 進行計算。至於右圖，股價往上突破時，應取 H0 的峰頂為頸線，當做對稱軸計算未來可能目標，這時候可以利用第二腳 L1 進行計算，也可以取第一腳 L0
    進行計算。公式分別如下：


    用第二頭計算往下突破目標區＝L0×2−H1

    用第一頭計算往下突破目標區＝L0×2−H0

    用第二腳計算往上突破目標區＝H0×2−L1

    用第一腳計算往上突破目標區＝H0×2−L0'
