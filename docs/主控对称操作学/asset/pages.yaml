- pgno: 111
  md: '股價可能略微震盪便再持緩上漲，也可能就此回折。無論後緩的走勢如何，既然在當下的研判是賣出，就應該執行策略。截至目前為止，這都是成功的操作。萬一走勢在賣出後又持續上漲，那已經屬於另一個階段的研判範圍，無需因為當時的決策與後緩走勢是否相符，而產生自滿或自責的情緒。


    假如股價從標示 A 出現回折時，必須觀察回檔後的低點是否與標示 H 的頸線重疊。如果無法重疊，暗示走勢圖可以將「波浪理論」中攻嘜波的觀念帶入觀察。走勢既然可以滿足基本幅度，那麼標示
    L2～A 的段落，必然大於標示 L1～H 的段落，符合「波浪理論」中第 3 波不是最小波的鐵律；再加上未與標示 H 的頸線重疊，當再度出現可靠的買進訊號時，便可以假設走勢會有另一波上漲，且將突破標示
    A 的高點。屆時，上漲目標便可以考慮使用黃金螺旋法則加以測量。


    假如股價從標示 A 回折時，回檔低點與標示 H 的頸線重疊，就暗示暫時沒有第 5 波上漲的結構，同時代表這並非多頭的攻嘜走勢；未來走勢如果仍然要呈現 5 波的架構，走勢必定是以延伸浪的結構表現。在無法研判走勢將出現多頭延伸時，多方操作者頂多只能先以「浪潮盤堅」的模型定位。


    請看圖 4-12，當走勢在標示 A 滿足評估的目標區之後，雖然出現短暫的止漲訊號，卻沒有明顯的回檔走勢，而且再'
