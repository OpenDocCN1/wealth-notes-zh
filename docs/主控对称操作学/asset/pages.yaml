  md: '單地說，太陽曆可以觀察氣候的變化，太陰曆可以觀察潮汐的變化。


    # 二十四節氣的運用


    有些人堅信，股市高低轉折與二十四節氣有某整程度的關聯；其理論的依據是，太陽運行將會對地球生物產生影響，其中包含地球上的人類經濟活動。他們同時提出甘氏（又稱為江恩）的理論做為佐證：「資本市場中存在著宇宙自然法則，股票價格運動受自然力的影響，進行著有係不紊的週期性運動，因此是完全可以預測的。而預測的關鍵是運用與曆法相關的數學模式。這種數學模式基本內容是價格和時間的關係，其中時間因素是決定價格因素的根本所在。」而且，甘氏交易年並分成
    24 等份，又正好與二十四節氣相同，因此相信這項論述的人認為：節氣與股市運行的聯繫是有科學依據的，並非迷信。


    節氣是每年固定的日子，若說每年的特定日子都會出現股價轉折，實在難以讓人信服；但是，實際上的確有轉折點落在節氣日上。如果使用者改變對節氣變盤的刻板印象，將變盤轉折調整為價格測量之後的參考，或是針對實際走勢的歷史谷底、峰頂進行時間推算，再取推算結果與節氣的交集做為輔佐研判，以分辨當時走勢的風險程度，這種做法亦無不可。但是，若將其視為操作的準則圭臬，筆者認為是萬萬'
