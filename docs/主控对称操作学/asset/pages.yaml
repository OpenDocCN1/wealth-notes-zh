  md: '# Chapter


    # 5


    # 時間的對稱'
  merge: -1
  img_proc: true
- pgno: 139
  md: '對於任何的研究而言，時間永遠是難以破解解析的課題。以物理學的角度來看，時間是一條無限延伸的直線；也就是說，時間具有不重複性，當某一個座標點被通過之後，永遠不會再回到原來的時間點上。許多科幻電影想像出許多理論，描述可以突破時間限制的方法，回到或前進到某一個特殊的時間點。就目前的科技而言，這是不可能實現的。正因為如此，你在某一個時間點進行了某個動作（決策）之後，就無法回到過去重新驗證：如果施以不同的動作（決策），是否會更好？


    任何問題的決定只要牽涉到時間，便不可被驗證，無法重複測試決策的優劣。以 1944 年二次世界大戰法國諾曼第（Normandie）登陸為例，聯軍選擇的登陸日期（D-Day）就受到天氣因素的影響，不但要求
    D-Day 當天英吉利海峽需風平浪靜，而且之後連續三天都必須是好天氣。問題是，到了 1944 年 6 月 5 日，天氣仍然相當惡劣，聯軍氣象專家預測：6 月
    6 日拂曉前天氣會好轉，聯軍統帥艾森豪將軍於是決定 6 月 6 日為 D-Day。


    最後戰果是老天爺幫忙，聯軍搶灘成功，在 8 月 25 日光復巴黎，宣告結束諾曼第戰役。現在我們回頭思考相關問題：如果艾森豪將軍延後 D-Day 幾天，戰況是否會更佳？氣候是否會更好？在
    6 月 6 日當時決定登陸後，萬一隨後的天氣沒有好轉，戰況會產生什麼變化？這些問題永遠無解，因'
  merge: -1
  img_proc: true
- pgno: 140
  md: '為歷史無法回到當時的時空再進行一次不同決策的驗證，以求取戰爭結果的最佳化。


    同理，當我們在執行股票操作的買賣決策時，無法真切知道明天的股價走勢變化，更別說未來幾天的變化了（有人說他可以知道，這要不是無知，就是自大到了極點）。因此，當下執行的決策，都是以已知的事實（而且是以前的舊資訊）為根據，進行主觀的決定。若說自己的決策是絕對客觀，那是不可能的事。因此，我們無法證明當下的買賣是否為最佳化的決策，只能等待後來股價的實際走勢告訴我們決策的對錯。唯一能夠保持客觀的，就是面對實際股價變化時的態度：假如不符合預期，如何調整與面對？總之，無論操作者使用什麼方法進行決策，都會面臨相同的問題；程式交易也是一樣，因為決定程式的，是根據以前的舊資訊所計算出來的參考結果。


    看到這裡，投資朋友可能會覺得沮喪——如果是這樣，那麼所有技術分析或基本分析的研究豈不是白費力氣？筆者認為並非如此。只要是經過實際操作的驗證，任何適合市場變化的操作方法，都值得學習與研究；因為這些方法可以幫助我們在面對不確定的未來時，進行可能適合當時走勢變化的決策，並且在決策後根據實際走勢進行調整，然後再擬出下一個可能更適合當時走勢變化的決策。


    如果讀者發現自己使用的方法無法幫助你達成上述目'
  merge: -1
  img_proc: true
- pgno: 141
  md: '的，那就表示現實的情形正在告訴你：或許該調整目前使用的方法了。


    既然在金融市場中運用時間進行研判的難度頗高，是否另有適當的方法可以運用呢？是的，在某些特定的走勢模型中，將時間的因素與股價波動合併考慮，有助於投資人規避一些不確定的風險，同時幫助投資人變得更有耐心。然而，金融市場中有關時間的技巧相當多，包含費波納奇係數與甘氏矩陣圖等等，而且就像一般的技術指標，並非一體適用。操作者不該妄想以某一種技術指標掌握每種股價波動的過程，技術指標有此困難，時間的研判技巧也是如此。


    本章節將探討市場中比較常討論的時間運用，其中包括十年價格型態、經濟循環理論、節氣、太陽黑子、費波納奇係數，以及神奇 T 理論。這些時間運用的效度仍有待積極驗證，因此筆者強烈建議讀者：在金融市場中，運用任何有關時間的法則進行研判之前，請先對價格走勢做出恰當的定位，然後再輔以時間法則的運用，亦即「價格優先」原則。


    # 十年價格型態


    美國的技術分析大師，同時也是「威廉指標」的創始人賴瑞·威廉斯（Larry Williams），在其著作《選對時機買對股》（The Right Stock at
    the Right Time）一書中提出：投資致'
  merge: -1
  img_proc: true
- pgno: 142
  md: '富可以很容易，只要做對兩件事：（一）選對時機進場，（二）買對股票。在有關於進場時機的論述中，賴瑞·威廉斯提到「十年價格型態」是投機利器之一。他認為，這種循環不會被市場中的金融風暴或泡沫現象改變，也不會被突然崛起的新經濟體，或原物料漲跌而改變，因為上述種種現象，都已包含在「十年價格型態」之內，縱使出現可能被改變的跡象，在尚未確認以前仍應該參考原來的循環。


    據賴瑞·威廉斯自稱，「十年價格型態」遵循的是古德（Edson Gould）的研究結果。古德的研究顯示：美國股市具有十年價格型態的慣性，在每個十年的第一年，投資人都會碰到股市激烈震盪或下跌，如
    1981、1991 和 2001 年的情況。有時候，市場會在西元年份尾數為 2 的時間起飛，如 1982 或 1932 年，而在西元年份尾數為 3 的時間，多頭市場已經開始，如
    1983 或 1993 年；在西元年份尾數為 5 的時間，代表多頭絕佳的買進機會。資料清楚顯示，播種和收穫都各有時節，考慮長期投資策略、決策與進場時機，將協助投資人獲取長期的投資報酬。


    僅將賴瑞·威廉斯的「十年價格型態」整理如下：


    +   1. 尾數 2 或 3 的年份是最好的買進時機：這時候往往是長線修正結束後的谷底期。


    +   2. 尾數 5 的年份漲勢強勁：此處經常是某一個主攻段上漲的起點，就算不是攻㮽波，也是強勁的反彈波。'
  merge: -1
  img_proc: true
- pgno: 143
  md: '3. 尾數 7 的年份是大好買點：通常出現在尾數 7 的下半年，或者遞延到尾數 8 的年份。


    4. 尾數 0 的年份頭部出現：此為十年循環的上漲終點，通常會出現轉折，造成股價劇烈修正。


    賴瑞·威廉斯建議投資人：市場似乎傾向於重複過去的變化，未來的價格型態也會遵循這種十年的指引，這種觀念將會進一步強化，投資人應該更有信心，把這種觀念當成未來歲月，甚至是未來數十年投資活動的基本方針，以此尋找最適合買賣的特定時點。


    經過筆者驗證，「十年價格型態」的循環觀念輔以價格測量與浪潮推演，再搭配「同型態比較」，的確能 tackles 長線投資人以更充分的耐心等待長線型態完成，並尋找安全的進場時機。因此，筆者建議投資人，在長線操作的決策過程中，可以考慮將此觀念列入參考條件。


    # 經濟循環理論


    經濟週期（Business Cycle）又稱商業週期、經濟循環或景氣循環，週期內包含了經濟成長時期（擴張或繁榮），與經濟停滯或下降時期（收縮或衰退）。儘管冠以「週期」之名，但這些波動無法確切表現出統一性或可預測的週期性。因'
  merge: -1
  img_proc: true
- pgno: 144
  md: '此，部分主流經濟學觀點認為：景氣循環在本質上，純粹是對經濟產生隨機衝擊的總和，儘管看起來很像，但實際上並不是週期。然而，也有一些學派提出了其他理論，表明週期確實存在。


    此處關於經濟循環週期的描述，是以維基百科（zh.wikipedia.org）、百度百科（baike.baidu.com）與 MBA 智庫百科（wiki.mbalib.com）的相關資料整理而成，是否能適切運用於技術分析操作，仍有待積極驗證。也就是說，投資人不宜僅僅依賴這樣的時間週期來進行操作，避免錯失在週期內的重要轉折點。同時，運用時間序列研判股價可能產生的轉折時，宜利用「價格優先」的原則，也就是先判斷價格的走勢，再套用時間轉折的概念，同時不妨將多種週期組合套入，據此減低研判的誤差。相關理論分述如下：


    # 一、班納理論


    美國俄亥俄州的農夫班納（Samuel T. Benner），根據長年觀察生鐵價格與財經恐慌的循環週期，包含玉米、棉花、小麥、肉豬價格走勢的循環模式，在 1875
    年寫了一本書《未來物價漲跌的商業預言》（Business Porpheci es of the Future Ups and Downs in Prices），書中指出：商品價格的高點會遵循
    8－9－10 的時間序列重複循環，將 8－9－10 的循環數字兩兩相加，便可以得到 17－18－19 的大循環高點；而商品價'
  merge: -1
  img_proc: true
- pgno: 145
  md: '格的低點，則會遵循 11－9－7 的時間序列重複循環，將 11－9－7 的循環數字兩兩相加，便可以得到 20－18－16 的大循環低點。


