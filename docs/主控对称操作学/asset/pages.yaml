- pgno: 156
  md: '請看圖 5-3，從加權指數月線圖中取出轉折高低點，似乎與費波納奇係數產生對應，但這是事後諸葛，當走勢在行進過程中，如何判斷要定位使用 3、5、8、13……中的哪一個數字？尤其在月線圖中，縱使只出現一個月的誤差，也很有可能蒙受鉅額的交易損失。另外，如果想要將日線圖上的轉折點對應到費波納奇係數，複雜程度更超越想像。


    在此，筆者提出一個經驗法則：由於長期觀察主力操作慣性，發現日線圖中最常被使用的時間係數是 34 筆的循環，且此數字又有前後 5 筆緩衝，所以 29 筆與 39
    筆的時間數字也常常出現。操作者不必刻意拘泥於這幾個數字，只要時間進入這些數字的範圍時，注意實際走勢變化即可。根據經驗，在中長期時間週期的整理型態中，較容易出現這些關鍵數字。


    既然節氣、費波納奇係數，以及股價的轉折，有時候吻合，有時候卻不吻合，意味著這些時間轉折的依據不但不神秘，實用性還有待更強而有力的數據驗證。筆者強烈建議，如果真的要使用這些觀念進行研判，必須以價格判斷為優先，然後才以時間數據做為輔助參考；這就像使用一般指標的判斷，縱使沒有出現訊號，但價格（趨勢）已經產生變化，應以價格為主，不可以將指標或時間的判斷凌駕在價格之上。'
