  md: '格走勢的數學基礎，認為費波納奇數列與動態系統的成長具有錯綜複雜的關聯。由於群眾是一個動態系統，而且金融市場又展現群眾行為，因此可以推論在金融市場中存在費波納奇系統。


    黃金矩形被用來建構黃金螺旋（請參閱《主控戰略移動平均線》第六章），若將該螺旋轉換到價格與時間的兩度空間，在標準化的情形下，每一對連續擺動的比率正常應為 2.618，請看圖
    2-14。由於這種計算方法與順向計算並不相同，而是在順勢市場中反應衝擊走向，因此筆者稱為：衝擊螺旋。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_59_0.png)


    圖 2-14 價格震盪的黃金螺旋比例


