- pgno: 109
  md: '請看圖 4-9，假如領先操作者在主觀認定第二隻腳成立時介入操作多單，並同時設下停損觀察點以保證進場的多單；當走勢不如預期時，必然會觸發停損機制，此時便可以讓進場的多單先行退出。觀察點的設置與每位操作者的認知成正相關，而操作者的認知是否恰當，又與所學的技術分析成正相關。無論如何設定屬於自己的觀察點，一旦被觸及，就必須確實執行既定的操作策略，以規避底部失敗的風險。至於後續走勢如何變化，不在執行停損時的考慮範圍之內，絕對不能心存僥倖地假設價格還有繼續上漲的機會。


    操作者在領先介入後，最常見的缺點是過度期待與樂觀，即使出現底部失敗的訊號，仍然不斷說服自己相信倒楣的事情不會發生在自己身上，或嘗試為已經失敗的走勢辯解：「以前曾經出現這樣的訊號，之後股價仍然持續上漲，所以這一次應該也會如此。」操作者沒有察覺的是，上次的操作經驗其實是一種錯誤認知，只是當時運氣好，讓錯誤的決策成為成功的經驗。


    如果在類似的操作過程中，經常發生價格觸及停損觀察點後，卻仍然往原先假設的方向前進，那就意味著操作者設定觀察點的方式需要改進、調整，甚至應該重新學習技術分析，揚棄舊有的觀念。'
  merge: -1
