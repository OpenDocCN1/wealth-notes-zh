  img_proc: true
- pgno: 45
  md: '一般投資人在市場中拙門求生存的最佳工具。訊息不對稱其質是市場經濟的弊病，其中隱藏了道德風險。如果想要減低訊息不對稱對經濟產生的危害，政府機構應該在市場中扮演監督與控管的角色，確保市場運作公平，並維護投資人的權益。


    至於在金融市場上慣用的圖表分析，其中的對稱性可以簡單區分為：空間、型態與時間的對稱。空間指的是價格，在圖形上以縱座標（Y 軸）表示，而時間則是以橫座標（X
    軸）表示；至於型態，則是空間與時間的混和。本書的第三、四、六章將探討股價在波動過程中較常出現的空間對稱，第五章則探討時間的對稱。空間的對稱較容易理解，時間的對稱較為抽象，型態對稱的出現機率較低。投資人研判股價行為的目的，在於賺取價差（空間），因此應先以空間的訊號為主，之後才考慮型態或時間的現象。


    雖然我們討論的是對稱的行為，但是無論在空間、型態或時間，要呈現完美的對稱是相對不可能的；即使偶爾出現，也只可視為巧合。市場的絕大多數走勢都是不完美的對稱，但這樣的不完美對稱卻會呈現「視覺均衡」的效果。也就是說，我們將以對稱的理論來判斷股價波動，但同時必須接受其中不完美對稱的事實；因此，必須再次向投資人強調：操作是一種藝術，而不是科學。


    以測量為例，上漲或下跌的幅度應該是對稱的，但實際'
