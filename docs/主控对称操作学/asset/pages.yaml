- pgno: 218
  md: '在金融市場中，技術分析的構成元素與「時間」和「空間」有關，一般在探討技術分析時，大都只針對空間進行討論，對於時間的討論少之又少，《主控對稱操作學》是少數探討時間概念的技術分析書籍。


    縱使如此，本書提供的方向依然是以空間（價格）為主，不過對於「時間」的研究，總算有一個開端，希望能藉拋磚之舉，激發投資人更多智慧火花，也讓金融市場中，對於時間的概念能開拓出一番新局；因此在時間對稱的運用上，書中不但網羅常用的時間序列觀念，也將神奇
    T 理論轉化為適合投資人運用的操作技巧。


    本書的重點，除了針對〈和諧的不完美對稱〉加強說明與演繹，並將〈K線的對稱〉獨立成一章進行說明，列出適用於酒田 K 線對稱計算的型態組合；投資人只要按圖索驥，自然就能夠在實際走勢中靈活運用。


    在〈型態的對稱〉章節中，保留原本道氏型態推演計算，另外再加強了力道、虛擬對稱與支撐壓力交換的闡述；最後壓軸的則是〈平衡中軸的運用〉，其內容是目前坊間對《亞當理論》最完整的詮釋。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_218_0.png)


    ![](img/3c84e6cd103643aff54a814e5a9d9319_218_1.png)


