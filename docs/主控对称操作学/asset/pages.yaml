  md: '# / 第二版序¹ /


    自從本書於 2010 年推出後，經過這幾年，深覺當時的章節編排與內容深度有調整和加強的必要，同時為了區隔市場同名書籍所導致讀者選擇的困擾，因此決定重新改寫，並將書名改為《主控對稱理論》。


    這次再版，筆者針對〈和諧的不完美對稱〉加強說明與演繹，接著再將〈K 線的對稱〉獨立成一章進行說明，列出酒田 K 線能使用對稱計算的型態組合，投資人只要按圖索驥，自然就能夠在實際走勢中運用。


    至於〈型態的對稱〉，則保留「道氏型態」原本的對稱計算，也加強力道、虛擬對稱與支撐壓力交換的闡述，再增加 Tony Plummer 對於型態自然律對稱的計算觀點；而在〈時間的對稱〉中，則以
    MTM 指標搭配「神奇 T 理論」進行走勢的評估，最後壓軸的則是〈平衡中軸的運用〉，該章節是目前坊間對於「亞當理論」最完整的詮釋。謝謝大家。


    韋中 僅識


    2015 年 9 月 30 日


