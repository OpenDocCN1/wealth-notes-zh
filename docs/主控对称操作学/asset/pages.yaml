- pgno: 47
  md: '至少要回檔到全波幅度的 0.382 以下。如果可以回檔到 0.236 以下或更低，就更為完美了。但無論如何，回檔走勢通常都無法達成完全的對稱，只可能具有視覺或感覺得均衡對稱，也就是和諧的不完美對稱。


