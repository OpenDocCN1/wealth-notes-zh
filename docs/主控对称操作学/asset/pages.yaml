  md: '與費波納奇係數和甘氏時間序列所呈現的不完整對稱不同。歷經春秋、戰國時代，直到西漢劉安所著《淮南子》的〈天文訓〉，才首見與目前完全相同的二十四節氣。


    # 二十四節氣的由來


    地球繞著太陽公轉所產生的軌道（稱為黃道），與地球自轉時產生的自轉軸並非垂直，此種現象造成太陽光直射地球的位置，會隨著地球的公轉而產生變化。在公轉繞行 360
    度的過程中，太陽光會有兩次直射赤道，分別為春分與秋分，春分點定為黃經 0 度，秋分點定為 180 度。當太陽光直射地球的北迴歸線時，定為黃經 90 度，稱為夏至，是北半球白晝最長的日子。當太陽光直射地球的南迴歸線時，定為黃經
    270 度，稱為冬至，是北半球白晝最短的日子。


    人們把整個黃道平均分為二十四個區段，每一個區段為 15 度，並且配合一年四季氣候變化，定出了二十四節氣，因此節氣在陽曆的日期基本上是每年固定的，間隔約為十五天，上半年出現在
    6 日、21 日，下半年出現在 8 日、23 日。又由於地球公轉軌道略為橢圓形，導致運行時間快慢不均，使得節氣的日期有前後 1 至 2 天的差異。


    節氣與農事活動的關係密切，所以一般人與二十四節氣的接觸通常都與「農民曆」有關；但是，農民曆不是太陰曆，也不是太陽曆，而是陰陽混和的曆法（又稱為夏曆）。簡'
