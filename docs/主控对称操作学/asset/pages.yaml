  md: '+   1. 每 3.5 年有一個太陽熱輻射循環，又稱為厄爾尼諾循環，在經濟週期理論中對應基欽週期。 2. 每 10 至 11 年有一個太陽黑子循環，又稱為施瓦貝循環，在經濟週期理論中對應尤格拉週期。
    3. 每 20 至 22 年有一個太陽磁極循環，又稱為海爾循環，在經濟週期理論中對應庫茲涅茨週期。 4. 每 55 至 60 年有一個太陽活動大週期循環，被稱為吉村循環，在經濟週期理論中對應康德拉季耶夫週期。


    我們不能否認，自然界所產生的循環（含節氣），需要更多時間、資料來驗證其關連性與可靠度，而不是一味盲從遙循，畢竟現有的技術分析工具已經足夠因應我們的需求，不需要再標新立異。


