- pgno: 185
  md: '![](img/3c84e6cd103643aff54a814e5a9d9319_185_0.png)


    圖 6-3 上漲時的對稱。


    以圖 6-3 為例，說明對稱走勢運用的技巧。在標示 A 的區間，股價的震盪呈現對多方有利，也就是趨勢已經轉為多方掌控；隨後在標示 P 出現多方攻擊訊號時，應該進場操作，同時利用鏡射倒影的方法，以標示
    P 為對稱軸，將標示 A 區間的 K 線圖繪製於對稱軸 P 的右上方，也就是標示 B 區間所示的圖形。理想的狀況是，未來走勢應與評估的走勢產生一致的現象。


    利用對稱原理進行的操作法，屬於攻擊買進（追買法），不是佈局買進（逢低佈局買法）。對於部位較大的操作者，運用過程中難免會受到交易標的部位多寡的影響，出現想買卻'
  merge: -1
  img_proc: true
- pgno: 186
  md: '買不到的窘境；或在追逐過程中因需求強勁導致成交價格提高，致使操作成本提高而增加了短線風險。這些現實狀況所產生的條件限制，並非技術分析可以解決，調整某部分的操作策略會有所幫助，但需因地制宜，不能一概而論。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_186_0.png)


    圖 6-4 上漲五波的對稱。


    筆者先前曾大膽地說：亞當理論所描述的走勢，只是波浪理論某一部分的走勢模型，請看圖 6-4。如此立論的理由是：波浪理論描述，因為市場投資者信心恢復，成交量大幅上升，第三波呈現的時間與幅度往往是最大的，也是最具有爆發力的上升波。由於走勢強勁，在第一波高點所呈現的突破訊號，經常是以技術分析中的長紅收高、跳空缺口等多頭積極行為表態。因此，在突破第一波的高點時，是最強烈的買進訊號。


    這樣的描述與亞當理論的操作重點，即趨勢與突破，有何不同？嚴格來說，波浪理論的嚴謹度更高，因為波浪理論'
  merge: -1
  img_proc: true
- pgno: 187
  md: '除了描述攻啄走勢，也描述了不同的修正走勢，並且告訴投資人必須適當地假設與調整；這兩者都屬於順勢操作的觀念，同時也包含了方向的預測。


    若以波浪理論的鐵律討論，當走勢圖以突破第一波高點的水平軸進行對稱後，第二波的谷底將對應到第三波的峰頂，此時必然會符合「第三波不會是推動波中最短的一波」這條鐵律。但是，波浪理論的另一條鐵律要求「第四波的低點和第一波的高點不會產生重疊」，而亞當理論並沒有這項要求；這是在描述攻啄走勢時，兩者之間最大的差異。


    至於修正波當中會不會也有對稱的行為呢？當然有。第三版新增「調整走勢的對稱」單元，將在後續為各位讀者說明。


    # 進行操作的原則


    利用平衡中軸進行操作時，最好先認識虛擬 K 線的取法，同時要瞭解盤態轉換交替與多空互換的原理。所謂虛擬 K 線，是指控盤者（一般稱為主力或莊家）實際觀察的
    K 線型態，這種 K 線型態與傳統 K 線的差異在於高低點可能不同。換言之，取虛擬低點時，需將某一根 K 線的實際低點與前一根 K 線的收盤價進行比較，取其最小者為虛擬低點；而取虛擬高點時，就將某一根
    K 線的實際高點與前一根 K 線的收盤價進行比較，取其最大者為虛擬高點。利用這個方法畫'
  merge: -1
  img_proc: true
- pgno: 188
  md: '出來的 K 線，就是虛擬 K 線，而虛擬 K 線在任何層級的線圖中都可以使用。


    觀察股價波動的操作者要能夠分辨多空互換，必須先將傳統 K 線轉換成虛擬 K 線，再利用虛擬 K 線畫出「高低折線」，並從正反轉高點與負反轉低點，定位「未升低點」與「未跌高點」。所謂的「未升低點」是指：創新高時往前數第一個正反轉的低點。所謂的「未跌高點」是指：創新低時往前數第一個負反轉的高點。上述的關鍵點在任何層級的線圖都可以運用，讀者可參閱《主控戰略開盤法》一書中較詳細的說明。


    有了上述的觀念後，操作時只要注意兩個關鍵即可：趨勢與突破。當走勢可能或確定轉成多頭時的突破，宜進場操作多單；當走勢可能或確定轉成空頭時的突破，宜進場操作空單。


    假設操作者研判的是 1 分鐘或 5 分鐘 K 線圖，那麼只要針對當時的 K 線圖進行趨勢定位即可。如果能夠在更高層級線圖如 30 分線、90 分線或日線的保證下，進行多空研判，操作者的安全性將更為提高。至於分線單位多寡，必須以所交易市場的交易時間合理取用；例如，台灣期貨交易時間是
    08:45 至 13:45，共交易 300 分鐘，那麼 300 的公因數才能當成分線的單位時間。以中國金融指數期貨為例，交易時間是 9:15 至 11:30、13:00
    至 15:15，每個時段 135 分鐘，所以只'
  merge: -1
  img_proc: true
- pgno: 189
  md: '能取 135 的公因數當成分線的單位時間。

    如果以圖 6-5 做為說明，任何短線的向上訊號都可以視為短線買點，任何短線的向下訊號都可以視為賣點，但這些短線買賣訊號不一定會成為中線或長線的買賣訊號；因此，在未確定上一個層級的方向時，操作只能以當時觀察的短線層級為之。但是，如果操作者研判中，長線的趨勢可能對當時操作的方時有利，短線的買賣訊號將會是波段操作最有利的訊息，如同圖中標示
    B 的位置，是長線進場操作的最佳時機之一。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_189_0.png)


    假設中長線訊號告訴操作者趨勢向下，當時出現的買進訊號必然先定位為短線，同時定義短線多方的走勢為「空頭'
  merge: -1
  img_proc: true
- pgno: 190
  md: '反彈」，所以操作時的技術分析技巧必須以短打為主。同理，當時中長線趨勢經研判為向上，出現的賣出訊號依然先定位為短線，同時定義短線空方的走勢為「多頭回檔」。如果能夠清楚區分短、中、長期的走勢，操作策略的擬定就不再是困難的事了。


    以平衡中軸或亞當理論的觀點來說，當操作者研判趨勢已經改變，形成多轉空或空轉多的訊息時，不是立即進場的訊號，而是等待下一個「突破」的訊號。


    因為當走勢形成多轉空的可能現象後，空頭的力道可能已經用盡、衰竭，所以空方需要時間重新整軍，才能儲備充足的力道「向下突破」；反之，當走勢形成空轉多的可能現象後，多頭的力道可能已經用盡、衰竭，所以多方需要時間重新整軍，才能儲備充足的力道「向上突破」。


    在圖 6-6 中，標示 A 的位置顯示走勢可能形成多轉空的現象，標示 B 出現的反彈是空頭走勢中的慣性。若走勢無法再創新高，暗示空方能夠重新整軍；標示 C
    的位置所呈現的突破，即為「向下突破」。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_190_0.png)


    圖 6-6 轉空後的向下突破。'
  merge: -1
  img_proc: true
- pgno: 191
  md: "![](img/3c84e6cd103643aff54a814e5a9d9319_191_0.png)\n\n圖 6-7 轉多後的向上突破。\n\n\
    在圖 6-7 中，標示 A 的位置顯示走勢可能形成空轉多的現象，標示 B 出現的回檔是多頭走勢中的慣性。若走勢無法再創新低，暗示多方能夠重新整軍；標示 C\
    \ 的位置所呈現的突破，即為「向上突破」。 \n\n# 停損點的設置\n\n任何操作都需要設下停損點，利用平衡中軸或亞當理論的方法進行操作也是一樣。有鑑於書中討論關鍵所產生的限制，並避免投資人未明其義時操作過於急躁而導致頻繁進出，因此本單元所介紹的停損觀察點，將較貨戰掛驛時來得寬鬆。這麼做的好處是，可以避免盤勢劇烈震盪，或主力洗盤強勁時觸及停損點，導致投資人在走勢發動前被洗出場。\n\
    \n那麼，停損點如何設置呢？請看圖 6-8，當標示 P 出現向"
  merge: -1
  img_proc: true
- pgno: 192
  md: '上突破時，依鏡射原理，應該將第三象限的走勢圖經過上下、左右翻轉到第一象限，這時候預估的走勢圖將會出現明顯的回檔，如標示 A 所示，並從這裡開始上漲讓股價創高。也就是說，在正常情形下，標示
    A 的正反轉低點必須讓走勢維持多頭趨勢，即谷底必須越來越高。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_192_0.png)


    圖 6-8 停損點的設置。


    雖然標示 A 尚未在實際走勢圖上呈現，但依理研判，在未來的實際走勢中，標示 A 的正反轉低點應大於標示 P 的左側圖形中任何一個正反轉低點，因此操作者可以選擇標示
    B 箭頭所指的正反轉低點，當成多方操作的停損觀察點；或以更低的正反轉低點如標示 C，做為停損觀察點。兩者的差異在於操作者對走勢圖波動原理的認識深淺、實戰操作經驗的多寡，以及能忍受停損範圍的大小程度有關。'
  merge: -1
  img_proc: true
- pgno: 193
  md: '# 中軸的移動


    操作者認知的對稱軸（即平衡中軸）並不一定是未來走勢中所真實呈現的，只能算是自己的主觀認定。有時候，走勢可能不符操作者的預期而表現為弱勢，那麼停損機制將會啟動，協助規避風險。走勢也有可能超乎預期而表現為強勢，那
    dem 表示股價走勢所反映的並不是原本主觀所認定的對稱軸。這時候，操作者就需要移動平衡中軸，進行下一波走勢的觀察。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_193_0.png)


    圖 6-9 中軸移動的時機。


    請看圖 6-9，在標示 C 的位置，代表以標示 P 為對稱軸進行鏡射的對稱後，所完成的相對高點，也就是標示 C 對應到標示 L。當實際走勢已經完成原本評估的目標，或者初始型態被完全複製結束後，就需要移動觀察的平衡中軸。上述原則只是眾多移動中軸的方法之一，也是最簡易並容易操作'
  merge: -1
  img_proc: true
- pgno: 194
  md: '的方法。除此之外，移動平衡中軸的關鍵，與操作者定位為兩個箱子移動，或定位為三個箱子的移動有關，只是這方面牽涉的討論範圍實在太廣，又與實戰操作環環相扣，本書只好省略不談。


    另外，需要移動平衡中軸的情形是：不管對未來走勢的評估如何，只關注「突破」的行為，亦即當走勢出現有效的突破時，便可以移動平衡中軸，並且決定新的停損觀察點。這是機械式操作原理中的「移動式停利法則」之一。


    本章所探討的對稱觀念，不但可以使在價格的對稱，也可以使在指標的對稱，例如以均線定位出的「成交集中點」、KD 或 MACD 指標的走勢對稱等等。只要觀念正確，是能夠變化出很多使用法則；但建議投資人暫時不要在此耗費心力，先將本書所描述的基本原則運用熟嫻，簡單且堅定地在市場中操作，並且讓盈虧維持大賺小賠的結果，才是操作者應該努力追求的方向。


    # 調整走勢的對稱


    前面單元描述了攻?走勢過程中關於對稱的運用，然而在操作過程中，同一個層級的線圖裡，調整走勢出現的頻率也相當高。對於積極的短線操作者或槓桿倍數較大的商品，這些走勢也能擷取不少操作利潤。面對調整走勢，在操作時可以調整操作策略、改變操作的技術分析技巧或工具。如果'
  merge: -1
  img_proc: true
- pgno: 195
  md: '需要使用對稱技巧進行評估，筆者有兩點建議供投資人做為運用時的參考。


    第一點是降低操作的層級。比如，當採用週線觀察多空方向時判定是調整盤，操作時就切換到日線或 90 分線，在低一層級的線圖就可以看見攻啖走勢。第二點是利用本單元介紹的基本原則進行評估。比如，當採用週線觀察多空方向判定是調整盤時，就依對稱原理評估時間、價格與型態；這時侯如果能再配合第一點的技巧，就可以大幅提高操作與判斷的把握。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_195_0.png)


    圖 6-10 調整走勢對稱軸的定位。


    請看圖 6-10，當股價從標示 H1 回檔到 L2 時，畫出 H1 高點與 L2 低點連接的切線，再針對 H1 高點與 L2 低點取 0.5 的水平線，兩者產生的交點即為對稱點
    P。如果使用的股票軟體有「安德魯音叉」的劃線工具，依序點啖 L1 低點、H1 高點、L2 低點的位置，就會產生音叉線，其中線交點就是對稱點 P。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '![](img/3c84e6cd103643aff54a814e5a9d9319_196_0.png)


    圖 6-11 調整走勢的對稱應用。


    取出對稱點 P 後，就可以看到根據對稱點，進行時間、價格與型態的對稱評估，請看圖 6-11。在正常情形下，T1=T2 是時間的對稱；P1=P2 是價格的對稱；L1
    上漲到 H1 的走勢會對應 L2 上漲到 H2，且 L1 對應 H2、H1 對應 L2，是屬於型態的對稱。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_196_1.png)


    圖 6-12 複雜調整走勢的對稱。


    請看圖 6-12，如果調整走勢相對較為複雜，那麼對稱點應取 H1 高點與 L3 低點連接的切線，與 L2 上漲到 H2 的股價相交即為對稱點 P。在正常情形下，T1=T2
    是時間的對'
  merge: -1
  img_proc: true
- pgno: 197
  md: '稱；P1=P2 是價格的對稱；L1 上漲到 H1 的走勢會對應 L3 上漲到 H3 ，且 L1 對應 H3 、H1 對應 L3 、L2 對應 H2 ，是關於型態的對稱。


    如果在圖 6-12 中，股價從 L3 開始上漲，時間已經完成對稱，但價格或型態卻還沒有完成對稱，而且股價依然維持多頭走勢，這表示走勢所反映的不是原本主觀認定的對稱點
    P 。這時候，對稱點就需要進行調整，調整的原則就是把對稱點移動到 H2～L3 這段走勢內，請看下一張圖例說明。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_197_0.png)


    請看圖 6-13，利用對稱點 P 評估完成時間對稱在標示 A，但是實際走勢滿足時間對稱，卻沒有完成價格對稱；這時候就可能必須針對 H2～L3 重新設定對稱點，即取
    H2 高點與 L3 低點連接的切線，再針對 H2 高點與 L3 低點取 0.5 的水平線，兩者產生的交點即為新的對稱點 S 。在正常情形下，T3=T4 是時間的對稱；P1=P2
    是價格的對稱；L3 上漲到 H3 的走勢會對應 L1 上漲到 H2 。'
