  md: '# 二、康德拉季耶夫週期


    康德拉季耶夫週期（Kondratieff cycle）是由俄羅斯經濟學家康德拉季耶夫（Nikolai D. Kondratieff）在 1926 年提出。所謂康德拉季耶夫週期，是指因為人口成長、資源開發、資本累積與戰爭等長期因素，所構成的資本主義經濟循環，週期約為每隔
    50 年到 60 年就會經歷一次高低峰的循環，又稱長波理論，其缺點是長期的歷史資料相當欠缺，不足以透過統計來確認這類長期經濟循環。


    如果將費波納奇係數以年為單位，55 的數字便落在這個循環週期內。若將「班納理論」的大循環高點 17－18－19，與大循環低點 20－18－16 相加，分別可以得到
    54 的數字，與費波納奇係數的誤差是 1，同時也落在康德拉季耶夫週期內。


    # 三、庫茲涅茨週期


    庫茲涅茨週期（Kuznet cycle）是由俄裔美籍經濟學者西蒙·史密斯·庫茲涅茨（Simon Smith Kuznets）在 1930 年提出。所謂庫茲涅茨週期，是指各類基礎設施的經濟週期；例如，道路、海港、機場等大型基礎設施的建設，通常需要
    15 至 20 年的週期，又因為基礎建設投資的密集，將伴隨著高就業率，並促進大宗商品交易價格上漲。'
