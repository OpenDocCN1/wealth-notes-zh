- pgno: 155
  md: '許多人將費波納奇係數的數字運用在分線、小時線或是日線中。根據博奕原理，在越短的時間週期內，無論採用哪種參考依據（包含指標），其效度都會變差。所以，我們經常看見許多當沖高手能夠在市場上成功，所依賴的是紀律，以及對盤勢反應的敏銳程度，而這些技能確實不容易透過學習、模仿得來，是屬於人格特質的層面。若將費波納奇係數的數字運用在週線、月線或年線上，在實際操作上會有走勢偶合的現象，但並非每次轉折都必然發生在費波納奇係數的數字上。


