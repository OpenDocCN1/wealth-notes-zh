  md: '由於阿哲霍夫數字顯示市場非漲不可，因此「求是」先生建立了不小的多頭倉位。不幸的是，買入沒多久，市場便開始下跌。雖然「求是」先生相信市場終究會上漲，卻事與願違，市場一跌、再跌、又跌。


    「求是」先生五歲的女兒「眼前」發現父親整天愁眉苦臉，便走上前去問到底發生了什麼事。


    「這種事情你是不會懂的，簡單地說，市場本該上漲，結果沒有。」


    「爹地，你所說的市場是不是就是這條線？」


    「對。」


    「我不知道什麼是市場，但從這條線來看似乎只跌不漲。」


    「笨貝，這就是你不懂的地方，阿哲霍夫數字、墨林沙頻率都說市場非漲到這裡不可。」


    「但現在看起來就是往下走嘛。」


    ......


    ......


    終於，某種靈感迅速閃入「求是」先生腦中，他馬上把手上的多單平倉，並建立了空倉，然後順勢操作賺了錢。以前，「求是」先生埋頭鑽研阿哲霍夫數字和其他理論，現在，「求是」先生能騰出更多'
