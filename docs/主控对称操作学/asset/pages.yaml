- pgno: 80
  md: '# 單根 K 線的對稱


    股價走勢波動過程中，必然出現許多高低轉折，轉折間則由大小幅度不同的 K 線所串連。如果轉折當筆與行進間的 K 線，有相對較大的高低震幅，且具有表態意義的內涵，那麼這些
    K 線在短線上也可以進行測量，同時根據測量幅度的多寡，分別代表不同的意義。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_80_0.png)


    圖 3-15 為比較具有可測量意義的單根 K 線。研判時通常會取當時高低振幅較大的 K 線為主，同時以型態或紅黑定位多空，比如圖中標示的 A、B、E 屬於多頭攻哨表態，圖中標示的
    C、D、F 則屬於空頭攻哨表態。


    出現股價轉折時，如果呈現組合 K 線型態，則應以組合 K 線型態為優先進行測量。如果是具有意義的單筆 K 線型態，則可以採用黃金螺旋進行測量，測量的基準幅度為該筆
    K 線的高低點，如圖 3-16 所示。公式如下：'
  merge: -1
  img_proc: true
- pgno: 81
  md: '在多頭時，目標＝L＋(H－L)×黃金比例數字

    在空頭時，目標＝H－(H－L)×黃金比例數字


    ![](img/3c84e6cd103643aff54a814e5a9d9319_81_0.png)


    圖 3-16 單根 K 線轉折的目標評估


    請注意，計算目標的主要目的是評估走勢強弱，其次才是做為短線進出的參考。比如，隔日出現向上攻堅，僅穿越 1.236 倍後在低一個層級的線圖就出現止漲與修正訊號，代表多頭攻堅力道極為弱勢，因此定位為「多頭極弱」。其餘目標也相仿，滿足
    1.382 倍為「多頭超弱」、滿足 1.618 倍為「多頭弱勢」、滿足 2 倍為「多頭正常」、滿足 2.618 倍為「多頭強勢」，其他以此類推。


    利用單根 K 線轉折計算目標時，在正常情形下，筆者建議投資人的測幅計算到 2.618 倍即可；超過這個倍數之後，'
  merge: -1
  img_proc: true
- pgno: 82
  md: '儘管可行，但是風險已經逐漸提高，而且股價走勢也應該已經從短線逐漸擴大層級。這時候，可以搭配其他方法輔助觀察，或者改用其他測量方式。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_82_0.png)


    圖 3-17 單根 K 線未滿足的思想


    另一方面，如果在股價行進間出現相對較有意義的單根 K 線，其力道強弱評估僅採用 2 倍幅，也就是取高低點為對稱軸後，計算等幅的距離。以多頭攻擊走勢為例，請看圖
    3-17，其對稱軸應取標示 H 為基準；若該筆 K 線攻擊有效，那麼上漲幅度應穿越目標 S。計算公式如下：


    多頭目標 S = H × 2 − L

    空頭目標 S = L × 2 − H'
  merge: -1
  img_proc: true
- pgno: 83
  md: '然而，在多頭行進間，不是每一次攻堅都會成立。假設正常目標 S 在上漲過程中無法滿足，股價反而回折並跌破支撐點，代表攻堅失敗，多方操作者應盡速於極短線反彈中退出觀望。至於支撐點的評估，可以利用不同的方法進行定位（比如，退到下一個層級的線圖中），而最後的支撐點必然是圖中長紅
    K 線的低點。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_83_0.png)


    圖 3-18 單根 K 線滿足的思維


    請看圖 3-18，如果在多頭行進間，多頭以長紅 K 線攻擊，並且滿足目標 S，那麼就代表這根長紅 K 線具有支撐力道，而最低點代表最後的支撐。這個支撐具有兩種涵義：


    +   1. 股價在行進間沒有跌破最後支撐以前，表示中短期多頭走勢沒有被破壞。既然如此，投資人便可以利用這種特性，做為中短期多頭走勢的移動式停利觀'
  merge: -1
  img_proc: true
- pgno: 84
  md: '察點。


    2. 股價走勢如果出現回折並跌破支撐點，表示攻擊結束，多頭定勢暫告一個段落。在上漲或反彈末端，這屬於「誘多出貨盤」，未來可能進入股價反轉或中短期修正，因此多方操作者應積極於反彈過程中退出多單。至於退出點應取
