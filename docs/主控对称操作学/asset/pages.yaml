- pgno: 22
  md: '「亞當理論」也提出投資人務必遵守的十大操作守則，這與筆者在著作中反覆強調的操作重點有異曲同工之妙，詳列於下：


    +   1. 賠錢的部位絕不要加碼或攤平。

    2. 在開始操作或加碼時，務必同時設下停損，以便在出錯時帶你出場。

    3. 除非是朝向對操作有利的方向，否則絕不要取消或移動停損點。

    4. 絕不要讓合理的小損失演變成一發不可收拾的大損失；情況不對便立即退場，留得青山在，不怕沒柴燒。

    5. 一筆操作，或任何一天，都不要讓自己虧損操作資金的 10%以上。

    6. 不要抓頭部或底部，讓市場自動將它呈現出來。

    7. 不要擋在列車前面。如果市場往某個方向爆炸性發展，千萬不要逆勢操作，除非有強烈證據，顯示反轉已經發生（請注意，是「已經發生」，而不是「將發生」或「應發生」）。

    8. 保持彈性。記住，你可能會出錯，「亞當理論」也可能出會錯，世界上任何事情都會偶而出差錯。「亞當理論」所說的是發生機率很高的事，而不是絕對會發生的事。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '+   9. 操作不順時，不妨縮手休息。如果一再發生虧損，請退場到其他地方渡假，讓情緒冷靜下來，等頭腦清醒過來再說。

    10. 問問你自己，你全身從裡到外是不是真的想從市場中賺一筆錢，並仔細聆聽自己的答案。有些人心理上渴望著賠錢，也有些人只想找個事情做。務必「認清你自己」。


    這十項守則已經成為市場的老生常談，但投資人賠錢的情形依舊，所以，問題的癥結在哪裡？與技術分析的運用一樣，是使用的人有問題，而不是理論本身有問題。'
  merge: -1
  img_proc: true
