- pgno: 210
  md: '# / 結語 /


    有三隻青蛙一起在一片葉子上順流而下，其中一隻青蛙決定要跳進河裡。請問：葉子上還剩幾隻青蛙？


    大部分的人都會回答兩隻。


    答錯了。


    那片葉子上還是 låg 三隻青蛙。


    為什麼？


    因為「決定要跳」跟「其的跳」是兩回事。


    > ——摘自《別急著吃棉花糖》


    這個故事道盡了市場中散戶操作者的心態，行情是這麼迷人，決定進場操作和實際進場操作，卻是兩碼子事。同理，想要學好技術分析，與真的學好技術分析，也是兩碼子事。


    筆者以前是指標操作的忠實信徒，對於均線、KD、MACD 等等指標所發生的訊號，均有相當程度自信；至於 K 線邏輯、波浪定位這些玩意兒，說實話，是嗤之以鼻。在運'
  merge: -1
  img_proc: true
- pgno: 211
  md: '用指標操作的期間，自然有做得好與做得不好的時候。做不好時，通常是發生在多空轉折的位階，那時候還不懂得定位相對位置；做得好時，通常會犯了大頭病，認為自己的方法無敵，不認同別人提出的方法。幸好，這些要不得的心態，都是放在自己心裡面洋洋自得而已。


    後來為什麼會認同 K 線、波浪這些技術分析，真的對操作有絕對性的幫助呢？那是因為謝佳穎老師引我拜見李進財老師。兩位老師給我一個重要觀念：對任何學問、方法或技巧，都應該以開闊的胸懷去認識、包容。所以，筆者就重新認識
    K 線和波浪的運用技巧，並且嘗試將這些觀念與指標串聯運用。整合之後，對技術分析的種種方法，便感覺容易上手了，因為所有的技術分析都是在探討股價波動，也都是在描述相同的走勢，只是以不同的技巧或不同的方法進行詮釋。


    曾經聽過業內的朋友說過一些市場上神奇的賺錢方法與技巧，仔細思考推敲，發現這些方法並不適合自己，而且這些方法也不容易被複製與學習。各位朋友，這就是重點：沒有人知道你適合採用什麼方法，也沒有人可以替你找出什麼方法適合你，這些全部需要自己花時間摸索。


    市場上有那麼多關於技術分析的著作（包含拙作），那麼多可以提供學習的技術分析技巧，這是不是代表只要看看幾本書、學學一些操作技巧，便可以在市場上穩定獲利了呢？'
  merge: -1
  img_proc: true
- pgno: 212
  md: '恐怕沒有那麼容易，但也好像沒有那麼困難。這就如同花了許多時間與金錢，終於從學校畢業，你可能很快可以找到工作，也可能一事無成。在成功與失敗之間，一定存在某個關鍵原因；僅僅看到表象而未能深入追究，就永遠不會跳脫失敗的輪迴。


    請試著找到適合自己的操作方法吧！別看我寫了幾本書，就認定我是所謂的專家，以為我的方法會適合你；也別看某人寫了幾篇好文章，就認定他是所謂的投資高手，以為他的方法適合你。不管你相信誰，只要不是屬於你的，就不會變成你的。如果你不願意投注心力在其中，就不可能有機會成功。


    想要怎麼收穫，就先怎麼栽；有栽都不一定會有收穫，更何況沒有栽。


    我也常提醒自己，永遠對市場保持謙卑，別認為做對了幾檔行情，就是贏家。我更常鼓勵自己：「市場永遠有的是機會，只要懂得把握，不要急！」對於市場的認識與摸索，不要因為操作告一個段落而停止。不管是技術、心態與策略，市場上需要不斷修練的事物太多了，而且每一次面臨的情境都不見得會相同，惟有不斷努力、再努力，才有持續進步的空間。


    因此，各位投資朋友不管是透過大量閱讀書籍、參加網聚、拜求名師，或是瀏覽各大財經網站來學習操作，都必須'
  merge: -1
  img_proc: true
- pgno: 213
  md: '想辦法將適合自己的技巧融入操作當中；至於不適合的，就應當成糟糠拋棄。絕對不要以為到處聽聽看看，學幾句口訣，就可以獲利。學習任何在市場上操作的方法，頂多只能幫助你減少摸索的時間，完全沒有終南捷徑。


    在操作過程中，我們經常發現三種情緒如影隨形，分別是：客觀、恐懼，與貪婪。不幸的是， Sujet 於正面能量者僅占三分之一。儘管恐懼可以幫助我們提高風險意識，貪婪也可以促使我們積極追逐利潤，這些負面情緒的能量卻總是在我們不需要它們的時候，對我們產生影響——尤其是當操作不再是一種樂趣，而是生活中主要經濟來源的時候。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_213_0.png)


    如果把操作當成一種樂趣，我們便能以輕鬆的態度面對；如果操作是主要的經濟來源，是唯一的事業時，代表需要獲勝才可以生存，這種壓力是非常大的。偶而出現失誤，雖然是正常的情況，但難免嚴重影響操作者的心態；經歷幾'
  merge: -1
  img_proc: true
- pgno: 214
  md: '次之後，表現就會開始變差，最後終將拖垮所的一切。雖然市場中的確存在將操作當成謀生工具的贏家，但畢竟這些人是鳳毛麟角，絕對不是筆者，也有可能不是正在閱讀這本書的你。我們總是希望世界的焦點投射在自己身上，或者幻想自己將成為冒險小說中的主角；可惜的是，往往事與願違。


    更有不少人，在業餘的操作上獲利幾次，便開始勾勒美好的願景，認為既然已經在市場中操作順遂了，應該不必那麼辛苦工作，只要專心操作就可以過生活，因此將穩定的工作辭退，變成專職的操作人。這種行為的確可能成功，但失敗者更是不少，請投資人體
    инфекции任何行業都存在「二八法則」。

    《亞當理論》一書提出導致失敗的原因，其中包含了大部分恐懼與貪婪的因子，可以隨時做為證者在金融市場操作的警惕：


    +   1. 建立太大的部位。

    2. 停損點設得太遠。

    3. 冒太大風險。

    4. 想要證明自己操作得比別人好。

    5. 跟別人比賽。

    6. 向別人吹噓自己的部位，當然也包含自己的獲利。

    7. 相對於操作利潤，過分提高自己的要求。

    8. 必須靠操作維生。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '我們不能否認，過度的操作與期望，都是墜力來源。當恐懼與貪婪的比重增加時，客觀的研判就會降低，操作就會完全走樣了。


    筆者的經驗是：別妄想將這些負面的能量從自己的生命中擺脫，那不是我們這些在金融市場中廝殺的凡夫俗子所能做到的。既然無法消除，只好嘗試與之共處；同時，盡力提高客觀的比重，恐懼與貪婪的情緒就會自動減少。


    讓我們共同期勉。'
  merge: -1
