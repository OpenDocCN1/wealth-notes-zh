  md: '不至於使自己陷入自以為是、井底觀天之弊。人類思維的擴張總是有限度，難免有思慮不周之處。無論是否在金融市場中操作，人生的態度也應該如此，切忌因為一時成功而志得意滿，便否定與自己不同的論調。筆者以往年輕氣盛，無論在操作或處事為人，都吃了不少這方面的虧，期盼在此一角與同好們共勉。


    # 太陽黑子


    與二十四節氣有異曲同工，同樣是利用自然界週期變化的觀念，還有太陽黑子理論。太陽黑子是太陽表面上的氣體旋渦，溫度比鄰近的區域稍低，看上去就像一些深暗色的斑點。目前對於太陽黑子理論的研究相當多，最早由英國經濟學家傑文斯（W.S.
    Jevons）於 1875 年提出，他認為：太陽黑子的活動週期會影響氣候週期的變化，而氣候又對農業收成產生影響，農業的收成會影響工業生產和整體經濟，所以太陽黑子活動的週期性決定了經濟活動的週期。


    哈佛大學的科學家謝夫納等人於 1934 年發表論文《太陽和經濟的關係》，分析從 1876 年到大蕭條的 1932 年，太陽黑子的數量變動與美國工礦業生產展現顯著的相關性。他們得到的結論是：太陽黑子的週期性變化會影響太陽對地球的紫外線輻射，這種週期性增減有可能透過生物學途徑影響人類'
  merge: -1
  img_proc: true
- pgno: 153
  md: '心理。


    因為太陽黑子的出現週期有規律可循，大約每 10 年左右出現一次（精算後為 11.2 年），而經濟週期恰好也大約每 10 年一次。這種把經濟週期的原因歸於太陽黑子的活動，是典型的外生經濟週期理論。現代經濟學家認為太陽黑子對農業收成的影響非常有限，而農業收成對經濟的影響更是有限，所以認定太陽黑子理論在現代工業社會中沒有依據。


    筆者對此理論抱持極大的好奇心，畢竟其週期與十年理論相當吻合，再加上許多統計發現：當太陽黑子活躍時，的確會對地球磁場產生影響，進而導致天氣惡劣，也會對各類電子產品和電器造成損害。甚至有些研究認為，氣候暖化、洪水、地震、流感、出生人數、天才人物的出生時間，都與太陽黑子活動週期脫離不了關係。NASA
    科學家曾經預測，強度最大的太陽黑子活動發生在 2014 或 2015 年（第 24 次循環）。根據美國《科學》雜誌網站的報導，科學家的研究發現，太陽黑子的磁場在過去
    20 年內呈穩步下降趨勢，到 2016 年，太陽表面的黑子就會變得了無蹤跡，並將維持至少數十年。上一次發生這種現象，正是在 17 世紀地球的長時間低溫期。


    另外，日本早稻田大學教授島中雄二於 1987 年出版《太陽景氣經濟學》，書中詳細闡述四種不同的太陽黑子活動週期分別和經濟景氣循環對應，說明如下：'
