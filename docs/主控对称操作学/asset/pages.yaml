    ![](img/3c84e6cd103643aff54a814e5a9d9319_54_0.png)


    圖 2-12 波浪理論中完整的市場週期


    辨識混沌中存在的秩序，是研究與學習技術分析的目的所在。研究與學習的對象（方法）並沒有侷限，重點在於合乎邏輯且適合自己。操作者無需迷信任何權威。


    綜上所述，探討股票價格的波動時，可以得到幾點結論：


    +   1. 任何股價波動都是隨機的，無法精確評估，只能勾勒出大概輪廓與可能的進行方向。操作成功的機率高低，與使用的方法、運氣，以及操作者的耐心有關。\n2.
    價格在隨機震盪的過程會觸發明顯的方向，但往這個方向前進時，漲益仍然是隨機的。'
