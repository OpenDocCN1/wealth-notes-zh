  md: '+   3. 在隨機震盪的過程中，定位可以是極小的輪廓，也可以是極大的輪廓。在極小的震盪中可以找到觸發方向的關鍵；相同的判斷原則，在極大的震盪中仍然可以運用。\n4.
    操作時，應該先定位想要操作的輪廓與層級，再找到被觸發方向的關鍵點介入。\n5. 極小的輪廓可能會激發成為極大的輪廓，使大輪廓產生明確方向。當走勢往我們認為的方向前進時，其過程仍然是隨機的。\n6.
    這些隨機的變化，將周而復始，或不斷被複製。因此，我們可以不斷地從大小不同的輪廓中，找到被觸發方向的關鍵點。


    理解上述原則後，再對照本章所探討的內容，讀者將會發現：其實技術分析就是設法在任何不同週期的隨機中，找到對應的關鍵點，然後進場；這就是順勢操作法。在操作過程中，為了避免另一次隨機所產生的方向轉折，必須利用停損機制控制風險，也需要停利機制維護操作產生的利潤，更需要善用測量以評估可能面臨的風險。換個角度說：如何使用恰當的技術分析技巧，幫助我們在觸發點適時介入，並且在之後的隨機走勢中，掌握適當的投資報酬，將是我們學習的重點。'
