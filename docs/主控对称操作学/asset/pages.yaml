- pgno: 49
  md: '# 隨機與相似性


    有人說：「任何股價走勢的波動都是隨機的。」換句話說，未來的走勢根本無法預測。如果這種說法是真的，那麼我們都不必研究技術分析或基本分析了；以此論調推想，一家公司的營收與成長不也是隨機的嗎？產品在市場上是否能夠受到消費者青睞，銷售量是否能夠如預期成長，有誰可以百分之百斷定？


    筆者主觀地認為：有些隨機現象是可以被觀察的，並且可以依據已經完成的現象來判斷，以合理的角度進行推論與評估（或者預測）未來可能的結果。就像池塘的水面被激起了漣漪，我們無法得知是誰扔下那顆小石塊，但既然事實已經發生，我們可以根據漣漪的形狀、大小，評估波動方向。


    即使又有人往池塘丟進一顆小石塊，我們依然無法事先得知哪一個頑皮的人做了這件事，但事實是，池塘又呈現了另一個新的漣漪。縱使新的漣漪會影響前一個漣漪的行進與波動，導致池塘的波紋互相干擾而顯得更複雜，但水面的波動行為依然是可以被評估的。經驗豐富或經過訓練的人，仍然可以從錯綜複雜的波紋中找出徵兆，然後再據以研判。


    目前全球的金融市場已經息息相關，遠在千里外的一點漣漪，很容易就擴散到全球，進而產生影響，而且參與金融市場的人口難以估計。如果將全球金融市場比喻成一個大池塘，其中分布著不同的水域；資金較大的法人進出市場時，'
  merge: -1
  img_proc: true
- pgno: 50
  md: '就如同在池塘裡丟下大石塊，換言之，世界各地有許多大石塊被丟進池塘裡，引發相當複雜的波紋，彼此間不僅相互干涉，也可能會產生共振效應。


    至於散戶投資人投入市場的資金，對池塘而言恐怕只是滄海一粟，因為產生的波紋對原本交錯縱橫的影響非常有限，很容易被明顯且強大的水紋所牽引，甚至融入其中。既然散戶的波紋如此細微，無法對強大的波紋產生影響，那麼求生之道就只能順著波紋的方向，掌握在能力範圍內可以獲取的利潤，千萬不要妄想要螳臂擋車改變波紋的方向。


    這些表面雜亂無章的波紋看似隨機產生，無法辨識，然而都有其源頭與可循之跡。只要學習如何分辨這些交錯的關鍵方法，就可以使投入的石頭所產生的波紋，不容易被其他強大的波紋溶入，反而能夠產生共同前進的效應。換句話說，在看似隨機的波紋中，如果能夠找到突破的關鍵點，並且確定波紋的前進方向，縱使前進的過程仍是隨機，卻可以在這樣的隨機中獲取利益。


    能夠恰當詮釋隨機的理論，是「混沌理論」（Chaos theory）。該理論說明了非線性系統在一定條件下可能產生隨機結果，但所呈現的結果並非雜亂無章，而是亂中有序。研究者發現隨機現象可以由碎形結構（fractal
    structure）組成。所謂碎形結構，是指不論圖形大小，其形狀永遠維持一致，亦即碎形具有「自我相似性」。如果將圖形中某個部分隨意放'
