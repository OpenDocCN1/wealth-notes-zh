  md: '費波納奇係數中的 21，與班納理論中的 17−18−19 或 20−18−16 的大循環，均落在庫茲涅茨週期內。這項週期在美國的許多經濟活動中，尤其是建築業，表現得特別明顯，正好符合美國房地產業
    18.33 年週期循環的慣性，所以又稱為建築業週期。一般上，可以將 3 個庫茲涅茨週期視為 1 個康德拉季耶夫週期。


    # 四、尤格拉週期


    尤格拉週期（Juglar cycle）是由法國經濟學家克萊門·尤格拉（Clément Juglar）在 1860 年提出。所謂尤格拉週期，是指生產設備機器等更新而帶動的循環，一般從設備投資占
    GDP 的比例做推估。這項週期理論的重點是：經濟事物具有規則性的波動，由繁榮、危機與蕭條三個階段，產生週期的反覆現象。至於政治、戰爭、農業欠收，以及氣候惡化等因素，並非影響週期波動的主要根源，只是加重經濟惡化的趨勢。影響週期波動的主要因素，是經濟自動發生的現象，與人民的行為、儲蓄習慣，以及他們對可利用的資本與信用的運用方式有直接聯繫。


    這個週期是被學者主張具有效度的經濟理論，大約每 9 至 10 年為一週期；使用英國 1795 年至 1937 年的統計數據，計算出平均週期長度 8.35 年，又被稱為中波理論、主要經濟週期、投資週期，或資本主義經濟週期。在費波納奇係數中'
