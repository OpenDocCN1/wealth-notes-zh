  md: '如果走势图形成整理型態或轉折型態，比如雙重底（頂）、三重底（頂）或頭肩底（頂）等等，一旦股價突破型態頸線，就可以取頸線為對稱軸，利用對稱原理進行評估。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_36_0.png)


