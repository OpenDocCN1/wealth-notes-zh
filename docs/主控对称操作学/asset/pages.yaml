- pgno: 19
  md: '對眼前的走勢做出最佳反應呢？書中建議參考三個線索，分別是：突破、趨勢改變、缺口或當日高低差價大。¹


    # 線索一：突破


    原始定義：多頭趨勢時，市場漲到圖形中以往許多高點或所有高點之上；空頭趨勢時，市場跌破圖形中可見的許多低點或所有低點之下。這兩種情況都顯示，這波移動的背後有足夠的力量推動價格進入新的境界。突破前的盤整時間越長，移動越明顯。


    根據筆者的操作經驗，必須選擇有效的高點做為觀察，而非採用任意高點進行研判；強烈建議投資人閱讀拙作《主力控盤原理與箱型操作》，並配合本書第六章〈平衡中軸的運用〉，自然能清楚瞭解使用的訣竅。此外，無論盤整時間長短，判斷時必須先注意回檔或反彈幅度的深淺。以多頭走勢為例，如果回檔幅度太深，突破高點時的攻堅力道容易衰竭，導致多頭走勢的結束；如果回檔幅度較淺，雖然看似對多頭有利，主力卻會藉此做出「誘多盤」，吸引投資人在突破時追逐，趁機進行倒貨而導致突破失敗，形成所謂的「假突破」。唯有藉「潮汐理論」與「推浪三部曲」的運用，才能有


    ¹ 作者發現，縱使不在「潮汐速度較快的時候」，也介產生對稱。詳見第六章的討論。'
