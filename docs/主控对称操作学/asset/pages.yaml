    「波浪理論」是一套大家耳熟能詳的理論，對波浪、層級定位，與走勢、目標推演而言都相當實用，然而許多技術分析研究者卻因為未經有識者正確指導，致使理念不清，對這套理論又愛又恨。其實，只要適當分解，就不難發現「波浪理論」是以一種碎形結構呈現，充滿了自我相似性與對稱性。圖
