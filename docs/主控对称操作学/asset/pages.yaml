    # 市場價格的不完美對稱


    回頭觀察金融市場的操作，投資人最常遇見的不對稱是：訊息不對稱（Asymmetric Information）。這是由美國經濟'
  merge: -1
  img_proc: true
- pgno: 43
  md: '學家約瑟夫·尤金·斯蒂格利茨（Joseph Eugene Stiglitz）、喬治·阿克洛夫（George Akerlof）、邁克·史賓斯（Michael
    Spence）於 1970 年提出的概念，指交易市場中的一方訊息超過另一方。訊息不對稱的市場不是一個完全競爭的市場，因為掌握訊息比較充分的投資人往往處於比較有利的地位，而訊息貧乏的一方則顯然不利。前者多為投資大戶，如公司派、法人、外資、主力（業內與業外）等等，而後者則通常是一般投資人。


    訊息不對稱的理論認為：


    +   1. 市場中賣方比買方更瞭解有關商品的各種訊息。\n2. 掌握更多訊息的一方可以透過向訊息貧乏的一方傳遞可腎訊息，而在市場中獲益。\n3. 買賣雙方中，擁有較少訊息的一方會努力從另一方獲取訊息。\n4.
    市場信號顯示，在一定程度上可以彌補訊息不對稱的問題。


    以股市現象說明訊息不對稱的情況，有助於瞭解上述理論。第一點通常指的是公司派。公司派往往掌握公司營運好壞的訊息，同時對產品的未來瞭解最深，因此在有利於公司的訊息尚未公開之前，公司派會先行吸納市場中的籌碼。等到消息公布時，股價早已經拉升到相當高位的距離，這時第'
  merge: -1
  img_proc: true
- pgno: 44
  md: '二點的作用就可以顯現。在消息曝光之前，事先得到消息的投資者也可以先行卡位順勢坐轎；消息見報後，一般散戶投資人才開始積極搶進，此時公司派與事先知情的投資者便可以利用眾多散戶投資人想要追買的心態，順利將手中籌碼轉換到散戶手上。


    經過市場的幾次教訓後，散戶投資人也不知不覺地被所謂的「內線」吸引，這時候第三點的效應就會出現：擁有較少訊息的一方會努力從另一方獲取訊息。因此，不斷有人在營業大廳、財經論壇、報章媒體等等釋放消息，另一些人則不斷地打聽消息。然而，筆者認為這對一般投資人而言沒有任何幫助，因為真正的訊息根本不會輕易公開，市場上流傳的耳語只是另一種訊息不對稱的戰爭。


    因此，一般投資人想要擺脫訊息的不對稱，唯有嘗試利用第四點所描述的現象：市場信號顯示，在一定程度上可以彌補訊息不對稱的問題。也就是說，研究市場中的可靠信號，總比道聽塗說的訊息更可靠。另外，市場信號也不會因為操作者的身分地位不同而有所差異，信號是相對公平的，而且會忠實地呈現；最大的差異在於使用者能不能恰當地判讀。


    市場信號包含：基本分析、財經分析，以及技術分析。除了傳統的圖表分析，機械式操作與程式交易也屬於技術分析的範疇。相較於其他分析方法，技術分析較容易學習，是'
