  md: '# 神奇 T 理論


    所謂時間對稱，是指上漲時間與下跌時間具有左右對稱的規律。這種規律有其特定的使用位置，同時這是屬於不完美的對稱，也可以說是視覺上的感覺對稱。對於時間對稱，筆者僅需單純觀察
    K 線圖的波動，便可以在特定的走勢模型下進行研判與運用；而國外的交易者則曾經提出「神奇 T 理論」（Magic T Theory）的運用觀念，其最大優點是採用指標輔助定位，減輕了初學者進行研判時的負擔。


    神奇 T 理論由泰瑞・隆德利（Terry Laundry）提出，是一種根據漲跌波動長度對等的特性，藉以分析股市趨勢的方法，又稱為多空週期對等理論。換言之，投資人能獲取高報酬的時間，與之前只能獲取低報酬的時間等長。至於運用神奇
    T 理論的目的，在於評估獲取高報酬的時間。理論的命名由來是：因為相信市場上漲和下跌的時間相等，當市場準備就緒，並蓄積足夠的能量後，走勢開始揚升，在價格型態上便可以取出「中軸」，同時在走勢上可以取出左右兩邊等長的「T」字母。「冠軍交易員」馬丁・舒華茲（Martin
    Schwartz）曾讚美說：「這個理論符合左右對稱、達爾文主義、演化，以及事物的自然規律。」


    泰瑞・隆德利的研究報告使用騰落指數（ADL）作為神奇 T 理論的參考指標，但該指標僅能針對大盤指數類的線圖呈現，因此筆者建議可以參考動量指標（MTM）作為輔助參'
  merge: -1
  img_proc: true
- pgno: 158
  md: '考。為了使初探「時間對稱理論」的投資朋友能夠快速進入基本的研判運用，因此先介紹動量指標的意義與基本的運用法則。


    # 動量指標的公式


    動量指標又稱為 MTM 指標（Momentum Index），是專門研究股價波動的中短期技術分析工具。雖然這項指標名為動量，但是在計算過程中，僅單純使用收盤價，與成交量毫無關聯，所以屬於震盪指標的一種。


    公式為：


    (X)MTM＝當筆的收盤價－前(X)筆的收盤價


    (Y)MTMA＝計算 MTM 的(Y)簡單移動平均


    本書採用此公式計算，所使用的參數為 X＝13，Y＝6。若使用《奇狐勝券》股票軟體，公式語法如下：


    ```

    MTM:CLOSE-REF(CLOSE,X);

    ```


    ```

    MTMA:MA(MTM,Y)

    ```


    另外一種計算的公式是：'
  merge: -1
  img_proc: true
- pgno: 159
  md: '(X)MTM = 當筆的收盤價 ÷ 前(X)筆的收盤價 × 100 − 100


    (Y)MTMA = 計算 MTM 的(Y)簡單移動平均


    若使用《奇狐勝券》股票軟體，公式語法如下：


    MTM:(CLOSE/REF(CLOSE,X))×100-100;


    MTMA:MA(MTM,Y)


    雖然這兩種算法出現的數據不同，但波動完全一致，所以無需使用第二種較為複雜的公式。另外，採用第一種公式，有利於推算轉折、生死叉等訊號的參考價格。


    # 動量指標原理


    動量指標原理與動力學原理有相似之處，探討的是股價波動中各種加速、減速到停止的慣性作用，以及由靜到動或由動轉靜的多空易位現象。在多頭行情中，當上漲的速度逐漸減緩，便容易呈現回檔整理或見高反轉的行情；在空頭行情中，當下跌的速度逐漸減緩，便容易呈現反彈整理或見低反轉的行情。簡言之，就是利用「扣抵」的觀念，觀察證券價格波動的速度——在走勢圖中，就是以「斜率」表現速度的快慢。


    請看圖 5-4，如果在顯示時間的橫座標，取固定的時間距'
