    # 主控戰略 K 線／主控戰略開盤法


    作者：黃韋中（阿民）


    《主控戰略 K 線》探討陰線的主力控盤技巧；《主控戰略開盤法》則延續《主控戰略 K 線》，將開盤法技巧首度公開。想要一窺陰陽線、開盤法與技術分析的奧秘，這兩本是最佳的參考書籍。


    技術分析 F190/F194  定價：350/380 元


