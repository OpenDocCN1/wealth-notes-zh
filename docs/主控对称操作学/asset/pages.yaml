- pgno: 110
  md: '在圖 4-10 中，若標示 L2 的正反轉點促使股價上漲超過標示 H 的頸線，表示底部已經成立，但必須等到基本幅度滿足後，才算完成整個型態。一般操作者都會將走勢穿越頸線設定為安全的買進點，只要維持「真突破」訊號，就應當認定底部型態不會被破壞。在真突破訊號出現後，並且未滿足評估的目標之前，都可以尋找恰當的點位進場。不過，越靠近滿足區，買進的風險越高，所獲取的利潤越少，但走勢方向卻相對明確。


    走勢往假設的目標區前進的過程中，並沒有人可以保證非到達目的地不可，走勢可能在中途夭折，所以此時需要利用「移動式停利法則」，協助操作者規避風險。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_110_0.png)


    圖 4-10 第二隻腳成功


    ![](img/3c84e6cd103643aff54a814e5a9d9319_110_1.png)


    圖 4-11 穿越滿足點


    圖 4-11 顯示走勢在標示 A 滿足評估的目標區。如果在當時的時空背景下，多方走勢的定位為反彈，那麼在實戰操作策略上，應義無反顧地在價格滿足目標且出現止漲訊號時，順勢出脫多單。當然，在止漲訊號出現並執行賣出動作後，'
