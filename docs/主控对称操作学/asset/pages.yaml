- pgno: 25
  md: '> 對稱是一種思想，多少世紀以來，人們希望借助它來解釋和創造秩序、美和完善。

    ——維爾


    什麼是對稱（symmetry）？在物體或圖形上，以一條假想的線為軸，在其上下或左右排列的大小、形狀、距離、排列等等完全相同，就是對稱的形式。如果假想軸是垂直線，就會呈現左右對稱；而如果假想軸是水平線，那就是上下對稱了；但是，偶而也會有上下左右均呈現對稱的情形。此外，也可以將假想軸旋轉，使物體或圖形呈現左下與右上，或左上與右下的對稱。


    在視覺的畫面中，對稱可以使人感受到平衡，這種作用能使人們產生安全與穩定的心理感受。如果對週遭的人事物稍加注意，就會發現生活中充滿了對稱性，其中有的是自然界神奇的傑作，有的則是人們為了某種目的而進行的創作。


    為什麼自然界如此偏愛對稱？科學家們曾經嘗試找尋答案：宇宙中有深層的數學結構，為了在無窮無盡的宇宙中製造出各式各樣的零件，以形成自然界中所有可能呈現的組合，因此遵循了最優化的原則——對稱。所以，人類在各種創作中採用對稱，只不過是承襲了宇宙自然的規律，並加以模仿運用。'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# 對稱原理


    從幾何圖形的角度探討對稱原理，我們可以將對稱區分為：點對稱與線對稱。


    點對稱的特徵是，對稱點和對稱點之間的連線會被對稱中心平分。


    請看圖 1-1，標示 O 的位置稱為對稱中心，如果點 A 想要在平面上呈現一個對稱點，則應該在 A～O 的延伸線上，找到異於點 A 的另一個點 B，並使 A、O、B
    三點共線，而且 A 到 O 與 O 到 B 的距離相等，此時 A 是 B 的對稱點，反之 B 也是 A 的對稱點。同理可證，點 C 與點 D 亦互為對稱點。


    點對稱有另一項特點，就是將原圖形以順時針或逆時針旋轉 180 度後，依然能夠與原來的圖形完全重疊。中國的太極圖便是將點對稱旋轉的代表圖形，如圖 1-2 所示。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_26_0.png)


    ![](img/3c84e6cd103643aff54a814e5a9d9319_26_1.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '![](img/3c84e6cd103643aff54a814e5a9d9319_27_0.png)


    圖 1-3 線對稱圖形


    線對稱的特徵是，對應點和對應點之間的連線，會與對稱軸垂直並且平分。


    如何分辨線對稱圖形？請看圖 1-3，先在圖形中央找到一條假想的直線，如圖中所標示的 S。沿著這一條直線將兩邊圖形對摺，如果圖形能完全疊合，就是線對稱圖形。圖形中對摺的直線稱為對稱軸，重疊的任兩點互為對稱點。


    # 自然界的對稱


    只要細心觀察自然界中的各種現象，就會發現對稱無所不在，無論是浩瀚的宇宙或是微小的粒子，像是飛禽走獸、草木花卉、雪花晶體、海浪起伏、分子現象，甚至連染色體序列都是呈現對稱的結構。以人類來說，以一條經過<|start|>鼻樑到肚臍的直線當成對稱軸，不正是完美的對稱形態？


    科學家的研究指出：一般人的臉型形成的對稱程度越高，就具有比其他人更吸引人的條件，身體也較容易散發出吸引異性的賀爾蒙。雖然筆者不清楚這些研究的目地，但呈現對稱的臉型的確會讓人感覺比較舒服。中國的面相學也一'
  merge: -1
  img_proc: true
- pgno: 28
  md: '樣重視眼、耳、眉、鼻翼與臉型的對稱。


    大部分植物的樹葉也具有對稱的結構，這種特性不但美觀，也可以增加葉子的強度，並且讓葉子均勻地接受陽光照射，甚至提高接受微波或生物輻射時的效度。


    仔細觀察圖 1-5，可以清楚看見樹葉背面的葉脈呈現對稱的結構。當然，這也具有增強樹葉強度的作用，並且使菸分的輸送能夠更均勻。在動物界中，昆蟲與鳥類的翅膀也都是左右對稱的，這樣的結構對稱是為了生存所需，也是演化的結果，有利於飛翔的動作。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_28_0.png)


    ![](img/3c84e6cd103643aff54a814e5a9d9319_28_1.png)


    美國科學家華森（James Watson）與英國生物物理學家克里克（Francis Crick）在 1953 年發現了 DNA（deoxyribonucleic
    acid，去氧核糖核酸）的分子結構，DNA 是由雙股螺旋狀巨大分子所組成，兩股 DNA 並排的鹼基彼此之間形成氫鍵，且某一股鹼基會與另一股鹼基配對，如此才能保持兩股骨架'
  merge: -1
  img_proc: true
- pgno: 29
  md: '間隙一致，並形成有規律的螺旋狀。簡單地說，DNA 就是呈現對稱狀的螺旋。


    更令人訝異的是，銀河星系也存在著螺旋形狀的漩渦結構，這是bed於星系的對稱；而人體內的 DNA 螺旋，是否在細胞誕生之初便受到宇宙神秘力量的影響，產生相仿的螺旋結構呢？或是說，宇宙的起源是基於相同的原理，於是誕生在宇宙間的事物就會產生類似的對稱結構。至於這種假想是真是假，我們就留給科學家去研究，謎真相大白。


    在物理學領域中，相對論、量子力學、標準模型理論、規範場論，超對稱理論等等，也都採用了對稱性做為重要論點。尤其是電磁現象的對稱性，甚至被認為是現代物理學的美學基礎。除此之外，帶正電的反電子與帶負電的電子、磁場的南極和北極，都具有對稱性。


    化學領域中同樣充滿了對稱，如分子與分子軌道、共價鍵極性、分解和合成反應、光譜學等等。尤其是拉曼（Raman）光譜學，明顯運用了對稱觀念：利用光子被分子散射時可與之交換能量的特性，採用高強度的單色雷射為光源，用以產生許多的散射光子，在入射頻率為
    Vo 的散射光譜兩逕，對稱地出現一系列新線 Vi，藉此測量微小樣品，並直接繪出散射光譜。這種方法目前已經被廣泛應用在生化研究上，包括碳水化合物、蛋白質、脂質、核酸、核蛋白、細胞膜、類胡蘿蔔素、葉黃素與金屬離子在生物中的角色等'
