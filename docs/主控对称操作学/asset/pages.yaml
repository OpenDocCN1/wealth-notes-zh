- pgno: 63
  md: '簡單地說，股價波動的過程就是多空力道較勁。至於市場中誰的力道多一些，籌碼又流向哪位主力手中，企圖以簡單的統計數據或指標來一窺究竟，實在是異想天開。與其花費許多時間與精力鑽研指標，不如回歸到價格變化。筆者的意思並非認為不該使用指標，而是說，如果沒有經過嚴謹的邏輯訓練，不能恰當地分辨相對位置高低，那麼再好的指標也會慘遭誤用。指標就如同兵器，使用的成效好壞，關鍵在於使用者。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_63_0.png)


    圖 3-1 K線收盤價的思考


    無論操作者以哪種理由進場，舉凡觀察籌碼流向、分析財務數據，使用了神奇指標或自己優化過的交易程式等等，最終仍然以「價格」呈現交易結果。既然如此，每一筆 K 線顯示的就是：在當時的單位時間裡，記錄買賣雙方（或說是多空力道）較勁的過程與結局。'
  merge: -1
  img_proc: true
- pgno: 64
  md: '在此以圖 3-1 說明收盤價的重要性。第一根 K 線的收盤價 C1，就好比多頭軍隊向上攻堅後，軍隊駐紮的位置。但是，第二回合才一開戰，多方軍隊立刻退守在標示
    O2 的位置；如果多方軍隊要維繫其氣勢，首要關鍵便是將原本失守的 C1 位置搶回來。縱使搶回 C1，也不過是維持原本的局面，無法真正顯現多方軍隊的企圖心。所以，多方必須再往上推進相當距離，這段距離當然是越遠越好，不過最起碼也要「雪恥」；也就是說，被空方趁虛而入的距離，必須等幅要回來。


    等到第三根 K 棒開盤時，如果是高開，那麼標示 O3 的位置將攸關多方軍隊接下來可能的動向。如果離多方想要攻占的目標還有一點距離，那麼在「正常」的情形下，多方軍隊應依賴前兩根
    K 線的氣勢，往目標挺進。過程中，只需要關注多方是否出現錯誤訊號；如果沒有出現錯誤訊號，代表多方走勢無慮，出現錯誤訊號時則應反向思考。假如剛開盤的位置，就已滿足多方軍隊想要攻占的目標，那麼接下來應該關心的是：多方軍隊達成目的後，將會把軍隊拉回後方補給？或趁勢追擊擴大多方版圖？還是會遭遇空方軍隊伏擊而導致無功而返？


    我們將多方軍隊一開始就滿足目標的現象分別描述如下：


    +   1. 如果是拉回補給，那麼應該以留有下影線的紅色 K'
