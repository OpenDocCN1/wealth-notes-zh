  md: '# / 導讀 /


    「亞當理論」探討的是內部對稱，屬於價格的範疇；「三角洲理論」探討的是外部對稱，屬於時間的範疇，這兩套理論都是由威廉·史洛門先生發現並歸納，其中「亞當理論」以
    100 萬美元（這在 1985 年是非常大的數字）賣給了威爾斯·威爾德（Welles Wilder JR.），而威爾德創辦三角洲國際學社，販售利用「三角洲理論」預測市場未來反轉點的資料，同時以極低的價格出版《亞當理論》：在華人的世界裡，沒有人會去質疑販售、出版相關理論的動機，或嘲諷這種神奇的內容本應留著當傳家寶。


    不過，《亞當理論》中依然有論述不夠完整之處（筆者對「三角洲理論」尚未參透，不敢妄言），期盼藉由本書的討論，將相關用語轉化成台灣讀者或筆者慣用術語，讓讀者能更深入運用價格對稱的觀念。


