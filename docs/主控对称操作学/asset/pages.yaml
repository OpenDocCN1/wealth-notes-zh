- pgno: 112
  md: '次出現多頭攻堅。這表示當時走勢的多頭相對強勁，甚至表示這段波動出現了多頭延伸走勢，上漲幅度將會被擴大。假設操作者在標示 A 的位置已經出脫股票，那麼看見出現攻堅訊號時，是否應再度介入？從技術面來說，這是無庸置疑的，然而在這個位置最常遇到的困難並非技術，而是心態。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_112_0.png)


    圖 4-12 穿越滿足點後走勢再攻堅


    試想：剛剛出脫股票沒有多久，再度出現的買進訊號可能會使持股的成本超過先前賣出的價格，而持股的水平也不容易與在低檔買進時的部位相當，甚至會懷疑這是不是假突破？


    因此，這時需要克服的通常不是技術面問題，而是心理面問題；技術面的訊號非常簡單，出現買進訊號就該買，出現賣出訊號就該賣，但是操作者經常因為多餘的考慮，被貪婪與恐懼的心態影響，導致操作全無章法。這是筆者認為不易修練的地方之一，能不能成為一個成功操作者，也往往決'
  merge: -1
  img_proc: true
- pgno: 113
  md: '定於此。


    倘若操作者根據當時的時空背景研判，或是以更大輪廓觀察，推論走勢有機會呈現更大格局的上漲波動，那麼在標示 A 出現止漲訊號時，便可以暫時忽略，繼續持有手中的股票。但是，為了保護手中持有的多單，縱使當時呈現獲利的狀態，仍然需要設下一個觀察點，做為多單的安全氣墊；此時非技術分析不能竟其功。


    觀察點如果設定得過於嚴苛，很可能被較大的震盪幅度震出場，而設定過於寬鬆，有時又會侵蝕原本的獲利。以筆者的經驗，放大觀察的輪廓有絕對幫助；除此之外，操作經驗的累積與對技術分析細節的深入研究，也能提供相對的助力。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_113_0.png)


    圖 4-13 未完成評估的滿足點


    請看圖 4-13，當走勢在標示 A 尚未滿足評估的目標區，就出現折返，並往下跌破底部成立的觀察點，如標示 B 所示，此時暗示底部型態失敗。若技術分析運用得當，理應在'
  merge: -1
  img_proc: true
- pgno: 114
  md: '尚未跌破底部成立的觀察點以前，便可以得知走勢轉弱的訊息，並且出脫手中持股。


    暫時不論後續走勢的變化，在當時出脫手中持股時，應該還有微薄的利潤，不至於虧損；除非操作者是在突破頸線時介入，並且在跌破底部成立的觀察點之後，才考慮出脫手中持股，這種情形出現虧損的機會就相對較高。


    # 目標與走勢強弱觀察


    當股價走勢往預期方向前進時，操作者經常會設定目標參考價，以做為停利與走勢強弱參考，而評估目標的基本原理都是以「翹翹板原理」與「槓桿原理」變化而來，再從這兩大系統中，區分出順向與逆向結構。


    例如，利用第一段上漲計算「黃金螺旋」，就是翹翹板原理的延伸運用，而且是順向系統。如果以等幅（也就是 2 倍）為正常攻堞幅度，那麼 1.618 倍就屬於弱勢攻堞幅度，2.618
    倍則屬於強勢攻堞幅度。至於「衝擊螺旋」，也是翹翹板原理的延伸運用，但這是逆向系統。如果以等幅（也就是 2 倍）為正常攻堞幅度，那麼 1.618 倍就屬於弱勢攻堞幅度，2.618
    倍則屬於強勢攻堞幅度。


    當逆向系統出現攻堞走勢時，表示股價嘗試克服反方向力道。如果攻堞到 2.618 倍以上，表示反方向力道兵敗如山'
  merge: -1
  img_proc: true
- pgno: 115
  md: '倒，這時候就可以改換成順向系統進行測量。然而，在實際走勢行進間，投資人並無法立即分辨股價將會先反映哪一個方向的力道，因此可嘗試將不同的目標取出，以實際情況辨別走勢的意圖。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_115_0.png)


    圖 4-14 下降型態的衝擊螺旋滿足點


    請看圖 4-14，當股價以下降型態進行中繼整理時，走勢突破下降趨勢線為領先買進訊號。如果這個訊號沒有被破壞，投資人應該假設股價將往原始方向前進。在股價上攻過程中，投資人可以取標示
    H1～L 為測量基礎，以「衝擊螺旋」計算短線目標；當股價穿越經過 H 的水平頸線，同時又滿足以 H1～L 計算衝擊螺旋的 2.618 倍（也就是標示 A）之後，則可以改用
    H～L 計算衝擊螺旋，標示 B 為 2.618 倍的位置。


    當然，在股價上攻過程中，除了以衝擊螺旋進行目標評'
  merge: -1
  img_proc: true
- pgno: 116
  md: '估，也可以 impon原始上漲翹翹板、黃金螺旋攻啄與型態學中所描述的測量方法，合併運用。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_116_0.png)


    圖 4-15 上升型態的衝啄螺旋滿足點


    請看圖 4-15，當股價以上升型態進行中繼整理時，走勢突破上軌道線時視為修正結束，如果這個突破訊號沒有被破壞，代表股價將往原始方向前進。由於型態向上調整，因此利用「衝啄螺旋」計算短線目標時，只能取標示
    H1～L 為測量基礎，當 2.168 倍的標示 A 被滿足後，則應考慮改用其他測量方法進行評估。'
  merge: -1
  img_proc: true
- pgno: 117
  md: '![](img/3c84e6cd103643aff54a814e5a9d9319_117_0.png)


    圖 4-16 底部型態的順向與逆向測量


    請看圖 4-16，當股價嘗試盤出底部時，以第二隻腳（標示 H～L2 進行測量時，屬於逆向測量原則，也就是「衝擊螺旋」計算法，標示 A 為正常攻 Pharm的等幅目標，標示
    B 為 2.618 倍的強勢攻 Pharm目標。如果以第一隻腳（標示 H～L1）進行測量，則屬於順向測量原則，也就是「黃金螺旋」計算法，標示 C 為正常攻
    Pharm的等幅目標，標示 D 為 2.618 倍的強勢攻 Pharm目標。


    請看圖 4-17，當股價嘗試盤出底部時，以第二隻腳（標示 H～L2）進行「衝擊螺旋」計算目標，如果走勢尚未觸及標示 A 的 1.618 倍（也就是從頸線上漲
    0.618 倍），股價就回檔並呈現「假突破」訊號，表示這只是個調整或反彈波，投資人應假設未來將會再度跌破標示 L1 的低點，又稱為「破底」。如果走勢能觸及標示
    A，但是還沒有滿足正常攻 Pharm幅'
  merge: -1
  img_proc: true
- pgno: 118
  md: '度，股價便進入回檔，那麼代表股價進入整理洗盤的行為，走勢還有再攻高的機會。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_118_0.png)


    # 虛擬對稱


    虛擬對稱的原理是利用心理與事實的客觀存在，但卻未在 K 線圖上留下訊息，必須由操作者嘗試找出實際走勢經過後所留下的痕跡，做為觀察的運用法則。此法可以當成壓力、支撐的參考，也可以計算參考目標。但是，這個方法偏向於散手操作原則，只適用於特定的行為。本單元僅介紹「支撐與壓力交換律」以及「消失的頸線」這兩種操作原則。


    # 支撐與壓力交換律


    簡單地說，支撐與壓力的交換，即為支撐變成壓力，壓力變成支撐。利用此觀念與多空攻守訊號，配合測量學，就'
  merge: -1
  img_proc: true
- pgno: 119
  md: '可以定位出可能止漲或止跌的關鍵點，並依此擬出恰當的操作策略。


    決定壓力以前，必須能夠分辨出這個壓力是在多頭走勢中形成的，還是空頭走勢中形成；同時也必須分辨這個壓力所處的層級大小與其相對位置。這些定位都關係到後續突破壓力時，研判攻堅是否能夠成功的關鍵所在。我們先在圖
    4-18 的空方下跌走勢中，取出下跌過程中最後一個負反轉高點 H，當成壓力觀察參考點，同時畫一條經過 H 的水平頸線。


    接著請看圖 4-19。無論多頭用什麼模式往上攻堅，突破了經過標示 H 的水平頸線之後，這條水平頸線的壓力作用就會消失；取而代之的是水平頸線將轉變成為支撐。這就是壓轉撐的支撐壓力交換原則。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_119_0.png)


    ![](img/3c84e6cd103643aff54a814e5a9d9319_119_1.png)


    以多頭的角度而言，穿越壓力之後的慣性就是拉回修正。如果多頭能夠拉開到距離原始壓力更遠的水準，才開始'
  merge: -1
  img_proc: true
- pgno: 120
  md: '拉回，或者回檔的幅度較淺，表示多頭的力道較強。拉開距離的好處是：未來進行回測支撐的動作時，多方將擁有足夠的防守空間，可供空方進行壓盤或洗盤的動作，而且不至於產生破壞支撐的情況。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_120_0.png)


    圖 4-20 跌破支撐出現反彈


    請看圖 4-20，當股價從標示 P 的位置開始回檔修正，以該折線圖進行觀察，面臨的第一個重要支撐，便是由壓力轉為支撐的水平頸線。當價格在標示 X 的位置穿越這條水平頸線，代表跌破支撐，股價的正常反應是出現反彈。請注意，支撐壓力交換的原則只能夠使用兩次。


    換言之，原本是壓力的水平頸線被突破後，壓力的作用消失，轉變成支撐，這是第一次的使用。當股價再跌破這條支撐線時，則是第二次使用，因此後續這條頸線就必須從線圖上拿掉，不能夠再使用了。


    所以，從標示 Q 的反彈開始，走勢的壓力觀察就不再考慮經過標示 H 的水平頸線，而必須從線圖上重新定位。以圖'
  merge: -1
  img_proc: true
- pgno: 121
  md: '4-20 的折線圖而言，反彈走勢所需要觀察的壓力，是指經過標示 P 的水平頸線。


    投資人運用支撐壓力交換律時，所選擇的壓力可以是任何一個負反轉高點，且任何層級的 K 線圖都可以使用。至於支撐，則只需要將上述原則反轉過來使用。


    # 消失的頸線


    消失的頸線又稱「虛擬頸線」，一般是針對型態學來進行定位運用。本單元只說明頭部行為的虛擬頸線，投資人也可以運用在底部型態與整理型態，尤其是經由整理型態所畫出的平行軌道線，往往與走勢波動的轉折產生吻合。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_121_0.png)


    圖 4-21 頭部的虛擬頸線


    圖 4-21 標示 H 是短期頭部第二頭，經過標示 L 的水平線為頭部頸線，當走勢跌破頸線完成頭部後，股價正常的跌幅利用「型態對稱」原理，可以計算出滿足點在標示
    X 的位置。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '結果實際走勢超乎預期，空頭氣勢強勁，使股價穿越標示 X 的位置後續跌。這時候，貿戰操作的策略是改採其他測量工具進行評估，例如黃金螺旋測量。


    當時經由「型態對稱」計算而被評估的數據 X，就是所謂的「虛擬頸線」。該頸線可被視為壓力的參考，當股價反彈時，可將此數據與黃金分割空間計算出的數值合併觀察。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_122_0.png)


    請看圖 4-22，所謂走勢段落的虛擬對稱，是消失的頸線運用的延伸技巧之一，其原理為：股價向上漲升的過程中，如果走勢出現明顯回檔，未來股價無論是反彈或回升，最起碼的幅度應維持某種程度的對稱，達到圖中所標示的
    X 位置。這樣的技巧在頭肩頂的運用中最為常見，這不僅侷限於盤頭過程，行進間的續漲走勢也可以適用。


    而最起碼的幅度對稱，是指下跌段（標示 H1～L1）應等於反彈段（從 L2 開始），即是將 L2～L1 的價差 A，從 H1 往上加等幅。也可以說，修正的低點
    L2 既然離前一個波谷底'
  merge: -1
  img_proc: true
- pgno: 123
  md: '還有 A 的距離，那麼正常的漲勢（或反彈），理應超過 H1 高點，且幅度應相當於 A 的距離。


    這種情形也是一種對稱，只是對稱點是利用型態決定，而非固定的觀察點。簡單的計算方法是：X=L2+(H1−L1)。


    至於走勢到達標示 X 的位置後，將形成轉折或續攻盤，或續攻的上漲幅度多寡，必須以其他的研判法則進行觀察，尤其是在浪潮的相對位置研判上，決不可偏廢。然而，這些觀念並非透過書中的論述便能完整建立，因此沒有列入本書的討論範圍。


    ![](img/3c84e6cd103643aff54a814e5a9d9319_123_0.png)


    圖 4-23 走勢段落的虛擬對稱


    請看圖 4-23。如果股價在向上漲升的過程中，走勢出現回檔跌破上漲波谷 L1 時，代表股價未來呈現反彈走勢的機率比較高，呈現回升走勢的機率較低。縱使是反彈，也應維持最起碼的反彈幅度，完成某種程度的對稱。換言之，下跌段（標示
    H1～L1）應等於反彈段（從 L2 開始），也就是將 L2～L1 的價差 A，從 H1 往下扣減等幅。'
  merge: -1
  img_proc: true
- pgno: 124
  md: '也可以說，修正的低點 L2 既然跌破前波谷底 A 的距離，那麼正常反彈走勢的高點，與 H1 高點的距離理應相等於 A。簡單的計算方法是：X=L2+(H1−L1)。


    無論是圖 4-22 或圖 4-23，經由計算而評估的數據 X，都可以在實際走勢中，與黃金分割空間所計算出的數值合併觀察。不過，必須注意的是，如果運用此方法計算出來的空間價差極小，則必須考慮是否合理的問題。


    # 同型態對稱


    在自然界中，仔細觀察山脈、海岸、河流、蕨葉、浮雲、閃電、雪花，甚至動物的血管，都會呈現自我相似性的分形，這些變化具有規律性與重複性，尺寸大小雖然不同，卻會呈現相似形態；因此，這是自然界中型態對稱的行為。由於人類是自然界的一環，而股價波動反映的是人類的思想與行為，因此股價波動自然也會出現可辨識且重複出現的走勢與型態。


    也就是說，觀察歷史走勢線圖，比對目前的走勢圖，如果有符合之處，就可根據歷史線圖的軌跡，規劃未來走勢可能發生的相對應軌跡。這種判斷法則稱為「同型態對稱」，又稱為「同型態比較」。使用這種方法時，在不同的週期、商品都可以產生對應，但原則上會優先考慮相同商品與相同週期'
  merge: -1
  img_proc: true
- pgno: 125
  md: '的對應。另外，與同型態對稱頗為類似的對稱觀察法，則有頭底型態對稱、左右型態對稱等等。


    利用同型態比較的觀察法則，除了需要相當的操作經驗，更需要仰賴大量閱讀不同層級的線圖，才能累積深厚功力。建議投資人在不影響正常操作的情形下，利用時間多看線圖練習、比對；就算無法真正進行同型態比較，也能夠更深入瞭解與體會走勢波動。久而久之，就能適切地對未來走勢進行規劃與推演，並且能擬定恰當的操作策略。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# 範例


    ![](img/3c84e6cd103643aff54a814e5a9d9319_126_0.png)


    圖 4-24 光磊股價週線圖之一（資料來源：奇狐勝券）


    請看圖 4-24，操作思維如下：


    +   1. 標示 A 跌破頸線 L，頸線支撐轉變成壓力。


    +   2. 標示 B 已站上壓力，表示壓力消失，未來不需要參考這條頸線。


    +   3. 標示 L1 是利用頭部計算等幅的參考價，標示 C 穿越，使 L1 形成「消失的頸線」，是未來壓力參考值。


    +   4. 股價修正到標示 D 才結束，可以利用其他測量方式評估。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '![](img/3c84e6cd103643aff54a814e5a9d9319_127_0.png)


    圖 4-25 光磊股價週線圖之二（資料來源：奇狐勝券）


