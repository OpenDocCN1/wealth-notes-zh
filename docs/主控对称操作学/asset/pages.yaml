    Valence）是四價，為後來的有機化學開創新局。接著到了 1865 年，凱庫勒提出苯的六角形結構，通常呈現對稱形態。據說，他在某一次夢中看到幾條蛇彼此咬著對方的尾巴形成一個環，醒來時靈感泉湧，於是推導出苯環的結構式。苯是芳香化合物分子，分子中的原子以對稱形式組成閉合的環形聯接的鏈。圖
