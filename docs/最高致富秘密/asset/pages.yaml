    現在我把時間都拿來「當下擁有」。正如妫玦教我的那樣，閉上眼睛，集中意識在自己的呼吸上，提醒自己所擁有的一切。我有一副健康的身體，丈夫和兒子也都很健康。我慶幸自己下班後有個家可以回，現在的我也吃飽了。我還擁有揹著的包包、腳上米黃色的鞋子，還有身上這件黑色短上衣也是我的。


