    當下擁有


    叙玹一字一字有節奏感的強調著，她的聲音在房裡迴盪。


    「如同字面意思，感受妳當下所擁有的一切。」


    這是什麼禪語嗎？我大概要回答叙玹看似不相關的問題，直到我找到當中的隱喻才能得出答案。我擔心叙玹問的問題會太困難。


    叙玹靜靜看著窗外的湖面。我集中注意力盡可能配合她。華麗天鵝絨的布簾背後，可以盡覽整片鈷藍色的湖水，在陽光照耀下閃閃發光；像是成千上萬的玻璃珠撒在大銀盤上。


    「這個世界上有數不盡的財富，就像妳把手伸進水裡，能感受到水的沁涼；妳能用相同的辦法去感受財富本身。這就是『當下擁有』：能夠加速或是改變流水的內在力量。不管再怎麼蜿蜒的河流，終歸大海。『當下擁有』，能讓妳自然聚集更大的財富。」'
