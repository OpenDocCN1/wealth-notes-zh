    身上的使命感讓我迫不及待想見到她。我找出她的電子郵件，對她傾訴心聲，問她是否記得十年前的一面之緣，也訴說自己的喪親之痛，為了實現父親的遺願，熱切尋求致富之道；現在她是唯一能幫我的人。回想起來，寫了這麼多，實在不像只見過一面。


