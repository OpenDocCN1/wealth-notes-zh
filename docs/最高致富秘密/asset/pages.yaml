    # 比預期中少的遺產


    有一天，一位小商人的父親叫他回老家。父親得了一種慢性病，病情正在惡化，父親把小商人和他的哥哥叫到眼前分遺產。父親在這地方有許多地產，是前幾代祖先留下來的。父親留給經濟狀況較差的哥哥更值錢的農地，小商人則繼承了難以出售的山地。小商人又氣又急地來找叙玭。


    「我哥的經濟狀況是不好，可是父親也太過分了。我繼承的土地一文不值。雖然我可以當作什麼都沒得到，但還是氣不過。我嫉妒哥哥，也恨我父親；他從小就對哥哥偏心，一直到快去世都是。」


    這商人從沒對任何人說出心中的想法，但他在導師面前一股腦兒全說出來。他父親從小就偏愛哥哥，兒時回憶對他傷害很大，負面情緒愈來愈強烈。導師聽了他的故事，給出建議。


    「客觀點來看，你繼承的那山地時機非常好。那土地現在值多少錢不重要，它在三年內會讓你賺很多錢；可是有個先決條件，你得先控制好負面情緒。你現在處於的水流會讓你致富，要是你被負面情緒淹沒，就會沒辦法順著財富的水流前進。」


    商人把叙玭的話放在心上，真誠地對待自己的身心。完成每日工作，便早早回家。一個人獨自和負面情緒搏鬥。'
