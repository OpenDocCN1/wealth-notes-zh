  md: '# 逃離母體


    我把從叙玆那聽到的東西做一番整理，仔細得出一個結論：「依機械論的世界觀，我們只是世界組成的部分，有機世界觀，似乎暗示我們可以改變這世界，我說得對嗎？」


    「是，沒錯。還記得我們談過真富人是怎麼看待世界的嗎？」


    「喔……妳說真富人創造世界就像在揉麵團一樣，對吧？他們利用情緒在創造世界。所以他們生活在有機世界觀裡，可以隨心所欲改變世界。」


    此時我才明白，為什麼我會覺得自己跟真正富人不是生活在同一個世界裡，不是因為他們有名車、豪宅，而是他們的世界觀和我的不同。理所當然了，散發出的能量也不一樣。我嘆了口氣，「唉，我從來沒想過，在自己被教導的人生道路外，還有另一個世界，我一直努力扮演好一個大機械裡的小齒輪。”'
