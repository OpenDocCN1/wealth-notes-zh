- pgno: 240
  md: '幾天後，我用箱子打包自己的私人物品離職了。回到家，我寫了信給叙珣讓她知道我的決定，我睡得比以往都安穩。


    ![](img/581bfd262c39a785428ec7c872cbfaa8_240_0.png)


    第二天很早就醒來，我沒趕著上班，沒有排得滿滿的行程。平常手機常常響個不停，現在像是罷工了一樣。現在，時間完全屬於我自己了。我默默煮了咖啡，香氣瀰漫整個房間，好像叙珣就在眼前，看著她神秘的笑容，自己像在跟她一起喝咖啡，手捧著杯子品味香氣。


    然後我電話好像又復工了，開始響鈴，我看了一眼，是視訊電話。「咦？叙珣打來的！」


    這是她第一次打電話給我，視訊裡的她在燦爛的陽光下笑得開心。她身後是美麗的山和湖水，身穿白色T恤和牛仔褲。她說自己在紐西蘭的湖邊小屋，那裡天氣很好，她看起來也比前一段時間更健康更有活力。


    通完話，我能感受到她強大的能量。我得到導師的支持，我立刻坐在電腦前開始寫下出書企劃，然後寄到美國各大出版社。


    ![](img/581bfd262c39a785428ec7c872cbfaa8_240_1.png)


    兩個星期過去，我收到很多拒絕我的信，但我沒動搖，我確信正走在好運的道路上。'
  merge: -1
  img_proc: true
- pgno: 241
  md: '某天早上，我醒來，像往常一樣滑著手機。一封陌生的電子郵件引起了我的注意，是一名著名的經紀人從美國寄來的，她說她看了我的企劃書，想跟我簽約。我像彈簧一樣從床上跳起來，就像我第一次接獲叙玟的回信一樣。我沒預期會收到這封信，但我並不驚訝，我知道我在「當下擁有」的世界開創了自己的未來。


    我現在走在那條幽徑上，通往前方未知的森林。我並不擔心，而且知道這條路會通往真正的財富。陽光普照空氣清新，還有蟲鳴鳥叫。轉頭看看身邊，有叙玟溫暖的笑容在為我加油，我活在當下，這就是當下擁有。'
