    我忍不住把自己實踐的經歷跟她說。我講了在咖啡店決定開始「當下擁有」、看到稅單的小危機、機場買的涼鞋。叙玹時而微笑、時而點頭。她舒服地靠在沙發，不時啜飲咖啡。我感覺她完全同意我。在講經歷時，感覺自己有點忘形。


    「自從我實踐『當下擁有』後，我感覺自己都改變了。在之前，就算是發薪水，也總是覺得不夠。現在光是買個小東西，自己就很高興。怎麼之前從來沒意識到錢可以讓我這麼快樂？我還想知道更多『當下擁有』的秘密。為什麼它會讓我有更多錢？」


    叙玹歪著頭，一隻手放在脖子上，像在思考要怎麼解釋我才聽得懂。幾秒後，她眼中發出鑽石般的光芒，看著我。


    「洪女士，要是讓你和人工智能相比。想像一下你們都在購物，你在網路上搜尋要買什麼，然後完成購物。那麼在這個過程中，誰更接近致富：是你還是人工智能？」


    「呃，你是說，比較我還是人工智能？靠買東西來看誰更接近富有？」


