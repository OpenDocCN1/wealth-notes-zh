  md: '「當下擁有」沒有多久，運氣也開始好轉。最先反映在自己的身體上。我慢性消化不良、頭痛、抽筋慢慢好轉，晚上也不再輾轉反側睡不好。我長久以來都感到精疲力盡，肩膀好像總是壓著很重的東西。但這些都消失了，我整個人輕飄飄的，像剛運動完一樣精神很好。頭腦清醒更能在工作上專心。


