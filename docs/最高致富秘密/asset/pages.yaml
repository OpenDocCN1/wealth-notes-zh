    # # 太過欲求，弄巧成拙


    「在妳實踐『當下擁有』時，很容易落入一個陷阱。」


    敘珫說。


    自從我計劃處理內心焦慮後，整個人輕得像羽毛，我覺得自己無所不能。充滿希望和渴望。我確信財富很快就會到來。


    敘珫似乎注意到我內心的想法。此時她的眼神和之前安撫我焦慮時截然不同，反而十分嚴峻，她坐直身子，莊重地說：「妳太想要得到了。」


    「啊？」太突然了，不懂什麼意思，我提高了嗓音。和敘珫會面的過程中，對致富的渴望一步步增強。不管是工作、開會甚至是睡覺，都一直在想著自己會成為富人。


    我結結巴巴地問：「但我⋯⋯我看過很多自我⋯⋯自我成長的書⋯⋯都說要是真心想要一個東西，它就會成真。我日夜不停，全心全意想都想著自己要成為富人，我這樣錯了嗎？」'
