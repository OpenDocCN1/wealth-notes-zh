  md: '她安慰說：「這個時代，每天都有激烈的生存之戰。妳被洗腦成只有理性才能在這世上生存。於是妳戴上面具，不讓情感流露。但能讓妳脫離現在窘境往更好地方前進的關鍵，正是妳內心的情感。情感才是答案，它是這宇宙給妳的能量。」


