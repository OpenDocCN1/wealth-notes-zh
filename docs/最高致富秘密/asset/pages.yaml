    # 峇里島


    這一週是我一生中最美好的假期。好運不斷發生，一開始是在機場，一位梳著整齊馬尾的空服員和諷笑著說：「今天經濟艙都滿了，如果您願意的話，我們可以把你們一家三口都升級到商務艙？」


    八個小時飛往峇里島的航班，我舒舒服服坐在商務艙裡。可能是因為座位舒適，我四歲的兒子在飛行過程中一次也沒鬧過。我在飛機上看書、看電影，還小睡了三個小時。


    到了飯店裡的SPA也很幸運。我這輩子沒享受過飯店的SPA。那裡按摩的錢比兒子每個月上畫畫課的錢還貴了一百多美元。但我一直很好奇。每次度假總是會去SPA的門口晃一下然後又折返。


    但現在沒必要糾結。我檢查了信號，「我有錢去SPA，我值得每年一次的享受。啊……這感覺真棒。」我比出了「當下擁有」的劍指在眼前。幸福感從手指開始蔓延到頭頂和腳趾。'
