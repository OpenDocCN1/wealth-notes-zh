  md: '釋：「妳可以這樣想，人們順著水流前進的時候是看不清航向的，但可以透過沿途做記號，看出自己前進的路線和大致的流向。妳的筆記就是記下這些錨點，當妳這麼做的時候，就能看到正往什麼方向走。」


