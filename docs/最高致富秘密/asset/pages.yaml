  md: '214 「正如笛卡兒所假設的那樣，精神和物質之間不同，運作方式也有根本性的區別。物質世界就像一台機械，遵守機械規律，牛頓的運動定律；而心靈有辦法透過內在理性，理解這些規律。自然本身也遵從機械法則，所以在自然界裡的生物，只是複雜機械。這樣理解典範有一種中產階級式對個人和社會關係的理解，以及人類和自然關係的理解。」大衛．胡克斯，〈馬克斯政治經濟學的量子力學觀，及其可能發展〉（暫譯，The''Quantum
    Theory''of Marxian Political Economy and Sustainable Development），「http://pcwww.liv.ac.uk/-dhookes/Kingstonl.pdf」2009


    214 「新的典範可以稱為『統合視野』，把世界視為一個整體，而不是部分的集合。所以『生態』這一詞會更常出現，也有更深的含義；也可以稱之為『生態觀』。從此觀點可以深刻了解到，所有現象底下，都有很深的相互性，而人與社會之間也是以一種循環的方式運動（以及高度依賴）。」佛瑞肖夫．卡普拉，《生點之網：對生命的新科學觀點》（暫譯：The
    Web of Life:A New Scientific Understanding of Living Systems）（Anchor Book,1996）'
