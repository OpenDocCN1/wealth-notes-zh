- pgno: 7
  md: '我父親生前最喜歡小黃魚了。手掌大小又鹹又乾的魚，大約三百五十韓元十條，節慶時才會拿出來吃。每次問父親最喜歡吃什麼，他總是說小黃魚。然後會沉浸在兒時的記憶，曾經在親戚家嚐過的鹹鹹味道，不久後又會再述說他滾瓜爛熟的小故事。


    「很久以前，有個小氣鬼很愛吃小黃魚。有天他發財了，也仍捨不得吃昂貴的佳餚，所以他把一條魚掛在天花板上，吃一口白飯看一眼黃魚，嘴裡說著：『啊……好鹹啊。』就這樣日復一日，最後那條魚一口也沒吃到就腐爛了。」


    你也許會覺得這故事是要告訴我們，盡可能享受當下。不，父親之所以會牢記這故事，是因為他很欣賞那小氣的守財奴。他教導我們，錢就是用來存的，必須限制花費。


    我們家小時候的家訓是：「省一分錢就是賺一分錢。」吃飯的時候父親也不允許我們剩下一粒米、一滴湯，也不能花一分錢買糖，衛生紙一次不能使用超過三張，連洗澡都要注意不能浪費水。我父親對這樣的節約引以為傲，就算他財力負擔得起，也不願意買最愛的黃魚來吃。


    父親在二次世界大戰結束那一年出生在韓國首爾。一九五〇年爆發朝鮮戰爭，家裡一貧如洗，祖父為了逃避兵役躲了起來，找食物的工作落在當時六歲的父親和他哥哥身上。白天時兄弟倆會在街上賣冰淇淋賺錢，晚上會偷偷到街道上收集穀皮和穀粒。父親那時只靠很稀的粥填肚子，幾乎快餓死了。但少吃一餐還好，要是冰淇淋賣不出去那才麻煩，回到家會被斥責。'
