  md: '# 「相生？」


    「是的，最確定能放大『當下擁有』效果的，就是『相生』。當你對擁有的幸福感，多到滿溢時，你就會想要『相生』。」她又強調，「投資人際關係、分享自己的擁有，可以鞏固你的『當下擁有』，這樣的態度會帶給你更大的財富。換句話說，『相生』是對妳自己財富最可靠的投資。」


    這樣聽來，『相生』似乎讓每個人或多或少可以受益。我記者魂的好奇心又被激起。「我不太懂『相生』的概念，這不就是我們常說的『分享』嗎？」


    導師慢慢地搖頭。


    「『分享』是單向的，只是一條單行道。要認識『相生』，就要知道它不單是給予和索求。簡單來講比較像是雙贏，讓妳和你的同伴受益，你的同伴也會對妳有益，付出愈多收穫也愈多，這樣的回饋已是默契。只是『相生』的回饋並不一定是一比一，妳得到的和妳付出的不見得完全一樣。」


    「啊……似乎是不一樣。」


    「『相生』可以這麼理解，我先有所付出，那宇宙能量就會回饋妳好運。」透過五行可以很好理解，木、火、土、金、水。木頭成了火的燃料在燃燒、火生成了灰燼變成土、土裡面蘊藏了堅硬的岩石和金屬、水在岩石之間流動，而水又滋養了樹木；這便是天意的自然運行。」


    我邊聽邊想像，感覺自己像在接受宇宙能量。我分享出去少量的能量慢慢在增長，累積成巨大能量把它回饋給我。我覺得精力愈來愈充沛，身邊這些慢慢形成巨大的良性循環。'
