  md: '怕等待，因為最後結果一定是好的。要等到天地人都到位才行。人就是人和，會有貴人來幫助妳；地是地利，貴人出現的場合和地點；天是天時，貴人出現的時機。那個時候妳的等待就會結束，有機會一躍升天。最重要的是，當時機出現時，妳得先做好準備，不要錯失良機。恭請貴人，尊敬他並榮耀他的希望，自然就會有好事發生。（觀念來自《易經》，中國重要經典之一。）


    > 「『等待』還有一點要注意，妳要時時小心孽緣的引誘。」


    我立刻回應，「孽緣？」


    紋妗瑞著茶杯，望向窗外，然後又回頭看我。「人們必須珍視善緣，但要是連孽緣也一起珍視，那就會引來惡運。很多時候，人的命運好壞，取決於他的人際關係。就像貴人會帶來好運一樣，孽緣則會帶來惡運。」


    以前當記者，常常去警察局採訪一些被孽緣拖下水的人。有一個人替他朋友當債務保人，弄到自己賠一大筆錢。還有人因為家裡財產繼承，發生暴力衝突被抓到警察局，或是被告上法院。


    我還想起大學時代認識的一個人。我在幾年前有遇到他，他交了個新女朋友，那時他投資股票失利，賠了不少也十分絕望，但對自己女友卻百依百順，可能是想從她身上忘記自己的壓力。幾個月後，聽說那女友向他的朋友借了幾千美元，而自己也曾借給她好幾萬元，之後女方消失不見；當然，欠的'
  merge: -1
  img_proc: true
- pgno: 209
  md: '錢也找不到人要。他現在才發現那女的跟他在一起是為了錢，他現在人財兩空。


    孽緣真是太可怕了。我顫抖地問：「呃……我實在不想要有那種關係。為什麼在『等待』時，要特別小心孽緣？」


    叙玹遺憾的口吻，「孽緣就像是惡魔的糖果，會潛入人心靈脆弱的地方，就像是垃圾食物一樣，初嚐時是甜，但長期下來有害健康。一旦妳意志不堅，很容易就屈服。」


    「那要怎樣才能避免這陷阱？」


    「會落入陷阱是因為在關係中，對他人期望過高，想著要從別人身上得到好處，進而盲目。反過來講，要是妳的心態是『我會先對朋友付出』或是『我付出的要比得到的多』，那就可以避開這些孽緣，吸引善緣。」


    我想起自己一位朋友，我跟她好一陣子沒聯絡了，但有天她卻突然打電話跟我借幾千美元，也沒說為什麼。幾個月過去也沒還我。我討厭借錢，但也沒辦法拒絕她。「要是我已經有孽緣了……」


    叙玹目光變得銳利，我身子縮了一下，導師以平靜但十分果斷的語氣說：「切斷。」


    想到很多人在孽緣中痛苦無助，便有所感悟：我們的意志比自己想像的還要強大，我們有能力擺脫孽緣。只要下定決心並堅強起來。


    談話結束。我很慶幸又能見到叙玹。看到她我就很高興，我歡呼：「我真幸運，能在這裡遇到像妳這樣的貴人，我相信我的等待期已經結束，因為妳就是我的貴人。」


