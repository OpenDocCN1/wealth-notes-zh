    現在我明白為什麼好運都圍繞在有錢人身上，「我想我懂了，妳說過有錢人會強迫把一些詞彙彙編在頭腦裡，他們就是透過這個方式找到通往好運的道路。」


    她雙手緊握，眼中透露出欣喜。「太棒了，妳理解得很正確！說得沒錯，有錢人會把自己有錢的想法放到潛意識裡，我們大腦會決定命運的流向，所以妳放什麼在大腦裡，就會影響妳的命運。」


