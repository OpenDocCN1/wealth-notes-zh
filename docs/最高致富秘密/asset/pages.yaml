    # 峰迴路轉


    一位年輕的商人，三十幾歲透過專利代理外國品牌服飾，賺了很多錢。他自信滿滿，把生意擴展出連鎖餐廳。但事情沒他想像的順利。新的事業投資了數百萬美元，過了一年都還沒開始賺錢。他壓力很大，連作夢都夢到錢飛走了。於是他跑來找導師。


    叙琮問他：「你錢包裡通常帶多少錢？」


