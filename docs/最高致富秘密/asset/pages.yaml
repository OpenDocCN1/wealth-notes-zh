    我停下思考，看著叙珣。她靜靜地等我思考，一邊看著昏暗幽靜的庭園，一隻麻雀在錯落有致的林間鳴叫，打破了寧靜。叙珣溫柔地望過去，此情景和她融為一體。


    我開口：「我在回想的時候，世界上還是有一些白手起家的人。那我們又為何要固執地相信，不再有人能靠自己的力量發家致富的說法？」


    叙珣沒有立刻回應，只是又把茶壺加熱，把壺身傾斜釀了茶，輕輕捧著杯子，沉默了幾分鐘。我的好奇心居然沒有按捺不住。叙珣不再專注在飲茶，終於抬頭，凜冽的目光向我投射。'
