  md: '我還想到另一篇有錢人的統計報導。彼得森國際經濟研究所曾對《富比士》商業雜誌列出二十.year來.的億萬富翁進行分析，白手起家的富豪比例在上升。一九九六年是百分之四十四點七，但到了二○一四年，這比例在富人圈裡已達到百分之六十九點六。


