    「喔，所以我當時沮喪，是因為那是我的土星回歸？」


    她點頭說道：「佛家語有句話叫『啐啄同時』，它的意思是，小雛要從蛋裡孵出來，得靠自己跟母雞同時從內和外打破蛋殼才行。這和土星回歸的概念是一樣的。妳想要突破外殼的欲望，和宇宙要打破它的能量同時相遇。在這期間裡，所有的痛苦都是幫助妳昇華的能量。當妳衝破外殼後就會進入真正的世界中，妳有很大的能力可以掌握妳的生活。
    」


    有關土星回歸的東西，我事後又補查了一些資料，找一些利用土星回歸達到昇華的真實案例。釋迦牟尼佛貴為王子，但在二十九歲拋開一切，開始離家修行；安德魯·卡內基也在三十歲時離開他工作十二年的鐵路公司，專心自己的事業，後來成為鋼鐵大王，打造無數的煉鋼廠和熔爐。湯瑪斯·愛迪生二十九歲建造實驗室，開始他的發明之路；同年他發明了碳帶式麥克風並成功投入市場，第二年又發明了留聲機。


    但那個時候我在和導師聊天，沒心思去管歷史上成功度過土星回歸的人，我急得想哭，我覺得我想突破的欲望碰壁後，自己卻沒有勇氣打破蛋殼，愚蠢地選擇放棄希望。沒有希望的生活是黑白的，就像早已註定好的一切，我只是照表操課，人生沒有樂趣。


    我緊張地問：「我該怎麼辦？我已經過了土星回歸的時候，沒有面對它，打破蛋殼，早知道那時候就不該放棄希望，該去實踐『當下擁有』。我現在該怎麼辦，要等到六十歲嗎？」


