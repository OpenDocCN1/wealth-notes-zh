  md: '以及往後各種可能局勢，還計算出更多步數。另一方面，人類會焦慮、會煩躁，所以容易下錯。人工智能連續勝了好幾局。報紙都說，未來人工智能會取代許多職位，大多數人會愈來愈窮。這是讓人沮喪又驚悚的報導。


    我說：「我覺得人工智能會更富有。它會檢視能花多少錢，比較需要的東西是什麼，然後找到最符合價位的東西，找到最值得的商品。人工智能很理性有效率。人類則容易衝動，過多情感。沒辦法做出完美判斷。」


    她清脆地大聲說：「妳提到了關鍵字。」


    感覺好像答錯了，我困惑地問：「什麼關鍵字？效率？最值得的？」


    「不是，是情感。」


    「什麼？但人在情感中，要做正確決定不是很難嗎？」


    她溫柔地看著我，抿著嘴慢慢搖頭。


    「大多數人並不知道，情感具有寶貴能量，甚至能改變現實。這種能量和生命力相連，這是人工智能無法模仿也無法擁有的，要是能善用它，便能找到財富的泉源。」


    我簡直不敢相信我的耳朵。情感可以讓人比人工智能更富有？我再三確定地問：「真的嗎？」


    叙珏揚起眉毛，眼睛睜得大大的。


    「是的。改變環境的關鍵不是思維而是情感。隨著科技發展，我們對理性產生盲目信仰，若不想被理性支配，成為社會的一顆螺絲釘；那情感就是邁向更美好未來的秘密。『當下擁有』就是用情感來創造財富。」'
