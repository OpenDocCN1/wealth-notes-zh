    我看了看時鐘，我們已經聊了兩小時，和叙玟談話總會聊到忘我。夜幕降臨這座歷史老城，我們離開餐廳。


    走在羅馬時期所建的佩雅托石橋，在橋上望向河的另一邊。橘色的夕陽餘暉落在紅色屋頂上，填滿了整片天空。河水在橋下激出漩渦，奔流向前。晚風撫過面頰，讓我神清氣爽。叙玟雙臂從橋上垂下，看向河面，沉浸在維洛納的夜色，絲質衣襬在微風中飄蕩。


    「我喜歡這裡……這裡的風，這裡的日落。」我說，「《羅密歐與朱麗葉》就發生在這浪漫的地方嗎？不過我沒有很喜歡那故事，結局太悲慘了……妳覺得那故事怎樣？」


    叙玟慢慢轉向我，眼中反射出紅色夕陽。「如果你把它看成兩個世仇的家族和解，妳會發現它不全然是悲劇，這兩個家族最後找到了快樂的結局。」


