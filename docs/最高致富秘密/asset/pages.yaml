  md: '「當你想發財想得太過時，妳會覺得舒服嗎？」


    「舒服？呃……那……好……」感覺被潑了一盆冷水。事實.toUpperCase上那並不舒服。痴迷於發大財的同時，恐懼和焦慮也在心中偷偷發芽，理想和現實的差距被拉大。一天中我時不時都會想到，我已經在實踐「當下擁有」了，不知道多久後會變有錢？我這樣真的好嗎？會不會永遠沒有成功的一天？我不能失去希望……


    我知道叙珐想表達的意思，要是我太急著想致富，就算我一直實踐「當下擁有」，但內心也會愈來愈不舒適。我嘆了口氣，「妳真是當頭棒喝。我太急著想要錢的時候，的確會覺得不舒服。我愈是想發大財，就愈是覺得自己賺的錢不夠，然後害怕自己發不了財。」我終於知道為什麼有時在實踐「當下擁有」時，也會有不適的感覺了，知道後心裡反而平靜了些。


    叙珐靜靜地喝茶，她平靜得像澄清的湖面一樣。「妳以前有沒有太過想要什麼東西過？」


    我回想自己高中時，很想上某一所大學，我還把校名寫在筆記本上，非上不可。我當時迷戀的學長就是那所大學的，我決定要跟他上同一所學校。現在回想起，我對那學校太痴迷了。看書都不能專心，一直在擔心：「非上那所學校不可，但要是沒成功怎麼辦？我沒辦法想像要是……」


