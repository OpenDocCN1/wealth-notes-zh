    # 裝滿杯子


    一位擁有一億多不動產的人來找叙玭。他出身貧寒，靠經營業和投資地產白手起家。他在家鄉的房地產多到只要回鄉就不可能不踩到自己的土地。他一見叙玭就開門見山說出自己的擔憂。


    「我想把家鄉的土地賣掉，但一直賣不出去。煩到好幾天都食不下嚥。我是不是要降價出售？」


    叙玭回答：「有大好機會來了。」


    那人聽了導師的話，下巴都合不攏。「等等，妳是說，我地賣不出去，是個大好機會？請幫我解釋一下……」


    導師以穩如泰山的口吻向那不耐煩的人解釋：「你現在有機會可以把你的杯子裝滿，恭喜你。」


