  md: '父親去世不久，我邁入四十歲。沒有父親的四十歲，生活變得不同。我來自一個中產階級的家庭，頂級大學畢業，在全國最大的報社當了十年記者，然後在賓州大學華頓商學院拿到工商管理碩士學位，目前在美國一家公司公關部門工作。生活不算失敗也不算成功，我有穩定的薪水，職業也上得了檯面，老公是熱心的公務員，育有一名兒子；我不用擔心過窮苦日子，但仍沒到能不擔心錢的地步。


    日子過得其實很吃緊。我那些跟有錢的醫生、律師結婚，或是繼承了不少遺產的朋友，他們都過著悠閒的生活，但我連花個十美元都得考慮再三。我會收集報紙折價券、在超市快休息時搶購打折的肉品魚類，在不同加油站貨比三家，幫兒子買禮物時也會在網路上比價，就怕買貴了；我有時會花好幾個小時在電話上，要求商家退款，並把收據寄給百貨公司或是商場。'
  merge: -1
  img_proc: true
- pgno: 16
  md: '雖然生活節儉，但銀行戶頭上的薪水總是不知覺消失。與其說穩定收入，不如說只要穩定沒赤字我就謝天謝地了。我一直很焦慮，總是為了明天犧牲今天。可是所謂的「明天」又是什麼時候到來？如果有人問我要不要繼續過這樣的日子，我會很堅決地回答：不要！


    所以在父親過世後，我致力尋找致富的途徑。不但博覽群書，還利用記者背景拜訪各類專家，請教致富之道。但是，他們給出的答案都一樣：能夠致富的途徑已經崩潰了。


    > 正如湯瑪斯·皮凱提書裡寫的，資本積累的速度已經超過經濟增長。不管多努力工作，都不可能超越那些繼承龐大遺產的人。」


    > 人工智能和機器人的發展，會減少就業機會。只有一些資本家會得利，變得更富，一般人只會變得更窮。」


    在我找尋答案的過程中，碰到許多年輕人。他們拚命在找尋和我一樣的目標。


    > 上一代總是說，要努力工作，存下來的錢要準備退休生活。但我不想為了未來犧牲我的青春。」


    > 才拿到薪水就去繳房租、助學貸款，還有一些生活費，之後就所剩無幾了。結婚生子還得花更多錢，我不能在自己身上花錢，未來也買不起房子。」


    > 為什麼都說了很難致富，可是突然發財的人卻變多了？他們的祕密是什麼？我也能像他們一樣嗎？」


    經過四處碰壁的察訪，有人告訴我，世界上只有一個人能給我確定的答案：「財富導師」。當下我只怪自己怎麼沒想'
