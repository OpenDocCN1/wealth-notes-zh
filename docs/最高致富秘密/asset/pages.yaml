  md: '出社會選擇工作，選擇結婚對象，選擇出國留學。這些選擇是否通往財富？我不確定自己是否選對了。


    「我要怎麼知道自己選的對不對？」


    「恐怕妳說得沒錯，在抉擇點上是不會知道。要是自以為知道哪條路是正確的，反而危險，答案藏在我們內心深處，不會輕易暴露出來。」


    叙珩停頓一下又繼續說：「心理學家卡爾．榮格說，人的一生是個潛意識自我充分發揮的歷程。潛意識裡的內容，會透過人的一生或外部現象展現出來。所有作的夢，都是潛在的可能性，潛意識會對宇宙能量做出詮釋。」


    在那次交談後，我後來又對潛意識做進一步的研究。根據《今日心理學》裡的內容，潛意識並不是一些藏在心底伺機而動，想要搞破壞的原始衝動；反而更像是一個人的信念、恐懼，同時也影響一個人日常生活態度表現。如果用冰山比喻，一個人的意識只是冰山一角，而潛意識才是水面下看不見的巨大冰塊。


