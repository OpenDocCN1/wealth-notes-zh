    # 那些殺不死你的，會讓你更強大


    「要是能好好利用土星回歸，人生會有非常驚奇的事情發生。困在蛋殼裡的小雞和破蛋而出的小雞，不可能作著同樣的夢，後者在更寬廣自由的世界裡。在這轉變的過程，接納自己的期盼，想像未來自己，並調整自己的行動。」叙珣解釋道。


    我研究了一些成功克服土星回歸的名人案例。


    美國前總統，比爾·柯林頓從耶鲁法学院畢業後，回到阿肯色州去競選眾議院的議員，那時他已二十八歲。後來以五千票差距落選。四年後他競選州長成功，成為美國歷史上最年輕的州長。


    現代汽車創始人鄭周永也是在二十八歲碰到困難，他的A-do Service汽車修理廠被日本公司強行收購。但他轉化這經驗往前，三十一歲利用自己對汽車的了解及經驗，創立了現代汽車，之後還成立現代民生工業。現代集團如今已經是跨國大集團。


    軟銀總裁孫正義二十六歲被診斷出有慢性肝炎，壽命很難超過五年。但他有著想要建立全球IT產業的夢想，帶著強烈的欲望，在住院期間裡讀了四千多本書。他從肝炎中康復，二十九歲重返工作崗位。克服自己的苦難後，很快拓展自己業務，成就今天的軟銀。'
