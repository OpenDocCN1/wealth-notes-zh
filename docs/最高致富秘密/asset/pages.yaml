  md: '# 【案例】


    # 夢想愈大，等待愈長


    「我想我就快升副總裁了。我該怎麼辦？」一家國際電子公司的主管問。


    此人被大家視為明日之星，工作無可挑剔，言行也合宜，他因為有擢升的機會而十分興奮。


    導師勸他：「現在最好拒絕升職。你應該利用這時間耕耘對上和對下的人際關係。這時候你應該讓你的玻璃杯更堅固，而不是急著填滿杯子，你要是接受了，那反而會面臨崩潰。」


    她又補充：「但我不是要你被動什麼都不做，躺在地上等樹上的蘋果自己掉下來。你在等待的時候應該要積極投資自己。記住，夢想愈大，等待愈長。只有在時機成熟時，才會摘到最大的果實。」


    那人後來拒絕了升職，被他的競爭對手抓住機會。大家都好奇他為什麼會放棄，但他因為信任叙琨，所以心中波瀾不驚，平靜地等著，努力不懈怠，自我反省警惕。實踐「當下擁有」。


    果不其然，他的競爭對手因為前任副總犯下的錯誤，連累到官司纏身，一天到晚被叫去問話或報告，沒機會運用自己的管理技能。也因為官司的關係，該公司股價下跌，業績也受影響。


