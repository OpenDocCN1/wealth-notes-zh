  md: '錢，也不是一時衝動，更不是看到別人買什麼我也跟著買。而且也不會浪費時間去尋找最便宜的價格。我花錢的時候，情緒很平穩，更平和也更健康在消費。


    同時，我的正向情感還吸引更多錢。我以前那種小偏財運從來沒超過五十美元過，但現在，幾百幾千的一下子就出現。回顧我之前的擔心，我跟自己說：「我以為實踐『當下擁有』後會花更多錢，但看看實際開支，錢進來得比出去得還多，太棒了！」'
