  md: '# 生活改變


    在學會「當下擁有」前，我的生活就像戰場。每天早上起床吃飯，帶著兒子去幼稚園後便趕去上班。就算忙得不可開交，我也仍是媽媽，好幾次，幼稚園打電話通知我兒子發燒後，我放下手邊的工作趕去幼稚園。不管是在公司還是回家，身上總帶著壓力。回到家時已累得像條狗，但還是覺得自己沒多花時間陪他而感難過。


    晚上撫摸兒子熟睡的臉，都會想著乾脆辭職算了，長久以來的得自己的工作不值得，對工作內容也不感興趣，每天忙碌不知道在追趕什麼，這樣的生活又是為了誰，連我自己都不知道。


    但我沒這勇氣，不知道要是沒這薪水怎麼過活。身上仍有許多貸款，退休金沒存夠，兒子的學費也只會愈來愈貴。光靠丈夫公務員的薪水很難撐起我們的生活費，我每天想過後都只有一個結論：就算再困難，也得咬著牙捱過去。我安慰自'
