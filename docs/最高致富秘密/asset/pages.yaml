  md: '# 導師的故事

    註定是要讓別人富有的人


    有錢人跟著叙琬的指引，平步青雲、戰勝對手、克服危機、資產加倍。許多人都是在人生交岔口時認識叙琬；甚至很多人是面臨巨大危機或轉換跑道。叙琬幫助他們抓住千載難逢的機會，或是改變眼前龍捲風的路徑。追隨她的人後來才明白，叙琬引導他們踏上正確的道路，因此追隨她的人數暴增。


    叙琬快三十歲時，開始懷疑她的建議是否會產生蝴蝶效應。追隨她的富人因她而獲勝，那輸家怎麼辦？要是執行長聽了她的話進行人事重組，那被開除的人又何去何從？要是有人在她指引下在股市賺大錢，那賠錢的人呢？一隻蝴蝶振翅能在世界另一頭引起風暴，她開始擔心更多人，自己給的建議會改變這些人的人生。她對自己存在的意義產生了懷疑。


    她被壓力壓垮，身體健康出現狀況，她在一次演講中昏厥，身體虛弱得好幾天動不了。醫生幫她做了檢查，但找不出哪裡有問題。


    她的身體愈是虛弱，洞察力就愈強。對很多事情的感受更加清楚。就像人站在戶外，更能體會暴風雨的風強雨驟。她能感覺得出這時代是怎麼開啟，會往什麼方向走，還有每個人該如何在這時代立足。這些不是從哪裡學來的，而是親'
