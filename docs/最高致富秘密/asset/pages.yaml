- pgno: 214
  md: '說：「那時工作也五年了，也開始有了想要致富的夢想，積極存錢。有一天我計算了一下，存個十年二十年會有多少。但發現不管怎麼存都買不起夠大的房子，還有小孩的學費、退休金。那時我才發現，靠自己努力是沒辦法致富的。夢想很快破滅也很沮喪，出於逃避的心態來到京都。」


    叙玟再次同情地點點頭，「那是妳的『土星回歸』。」


    導師向我解釋，整個世界一般會把三十年當成是一代人。據說這是因為土星繞行太陽公轉一周需要二十九點四五年。在西方占星術裡，繞一週被稱為「土星回歸」。它差不多發生在一個人二十八到三十歲之間。土星就像一位嚴格的老師，會要求妳放棄幼稚和不切實際的幻想，去面對現實和自我意識跟責任感。要是妳好好利用它，妳可以克服苦難，在現實中覺醒成長，變成真正的成年人。


    「土星回歸通常是在二十八到三十歲，還有五十八到六十歲之間，這個時期幻想和自以為的聰明會破滅。要是能好好利用，妳會產生質變。這時候更需要專注自己內在聲音和實踐『當下擁有』，而且效果會十分顯著。」


    她釋道：「土星回歸是嚴酷考驗時期。面對它，不要逃避。土星也被人稱為嚴格的老師，如果要用棍子和胡蘿蔔比喻的話，它更像用棍子來教導人的老師。土星回歸時會面臨嚴格的考驗，像是身體的病痛、家庭成員的糾紛或是其他難'
