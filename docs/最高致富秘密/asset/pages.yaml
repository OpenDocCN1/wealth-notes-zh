    「要是覺得太多，那就從一千元開始吧，之後再一點一點增加。你會慢慢改變對錢的情感。」


    一開始，那男子不解叙琮奇怪的建議，但仍信任她。之後在皮夾放了一千美元。他緊張得每天都會檢查數次皮夾，'
