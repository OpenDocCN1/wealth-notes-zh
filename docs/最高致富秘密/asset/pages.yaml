  md: '我想起了前一天的談話，「很多人一起在這太陽下，陽光無盡地傾瀉在我們身上。但要是我轉過身子，便不能感受這能量的注入。說不定致富的能量也跟這太陽一樣，早就無盡地在對我們傾瀉。」


    「是的，不管我們轉不轉身，太陽一直都在那裡。只要能轉個方向，隨時能享受陽光。」她站在以歌劇聞名的圓形劇場上，說話的聲音就像音樂般悅耳。


    我們經過廣場往公園走去，一旁的叙玹突然駐足。我轉頭順著她視線看過去。一名戴著紳士牛仔帽的街頭音樂家，用吉他彈奏著義大利歌謠，腳還不時跟著拍子輕敲。叙玹笑著觀賞，看得出來她十分享受，細細品味這一刻。演奏完畢，她不含笑著鼓掌，還放了一些鈔票在吉他箱裡。叙玹正在實踐「當下擁有」。


    要是只有我一人來到廣場，我會浪費這美好的時刻，杞人憂天地擔心那些還沒發生的事。平常我旅遊的時候，總是不斷想著下一步要做什麼，或是假期結束後有哪些工作要忙；但現在，學會什麼是「當下擁有」後，我隨時都能轉過身來面對太陽，為什麼從來沒發現這是件這麼容易的事？


