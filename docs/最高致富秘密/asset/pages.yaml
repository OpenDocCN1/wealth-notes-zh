    # 日本「經營之神」的三個祝福


    松下幸之助在日本被譽為「經營之神」。他出生在富裕的家庭，但因為父親破產的關係，家道中落，在小學四年級就被迫輟學，到一家自行車店當店員。到了晚上，常常想起去世的母親哭著睡著。


    他後來克服了童年的困境，二十三歲時，用一百日圓創辦了「松下電氣器具製作所」。這家公司的銷售後來成長到五百萬兆，變成日本最知名的公司，「國際牌」也是旗下的子公司。


    有一天，一位記者訪問他：「松下先生，請問你成功的秘訣是什麼？」


    他回答：「上天賜給我三項祝福：貧窮、虛弱、失學。多虧了它們，成就了現在的我。」


    「上天的祝福？這些聽起來像是不幸啊。」


    「你說得沒錯。但貧窮在我小時候就教會我努力工作的重要，虛弱讓我體會到健康的可貴，所以我學會了怎麼照顧自己，過著健康的生活。而我讀到四年級就退學，讓我對學習產生了源源不絕的求知渴望。」松下就是這樣體現他自己的「當下擁有」，就算他處在大家都認定是不幸的環境中，也使他成為日本最富有的人之一。'
