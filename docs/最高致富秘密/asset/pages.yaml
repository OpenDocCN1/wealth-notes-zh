  md: '是擔心有一天錢會不夠用，時時警惕自己亂花錢的下場。


    他晚年生活很簡單，早上醒來做點運動，在電腦上下下圍棋，然後去老人福利中心吃免費午餐，下午到河邊散步。他幾乎不消費，所以當他的朋友們去打高爾夫或是出國時，他都不參加。父親唯一的愛好是健行，一個禮拜兩次，一大早就穿上健走鞋出門。他總說：「沒有什麼比健走更省錢的了，只要一雙強壯的雙腳，和一個水瓶。」


    我父親盡可能不去理會天氣變化。在連奶油都能融化的高溫堅持不開空調；天氣冷的時候也是，他會穿上毛衣和外套，不願使用暖氣；刷牙洗臉的水會收集起來沖馬桶，水費能省則省。


    父親另一個嗜好是撿別人不要的東西，他會從垃圾堆或是空屋裡搜集衣服、鞋子、家具和電器用品。父親家有一個房間堆滿了雜物，像是個舊貨商店。但那裡對他來講像是個寶箱。每次他打開那房間門，那張七十歲的老臉都會漾出孩童般的笑容。


    這樣的日子，在突如其來的某天發生了改變。


    父親去醫院做檢查，醫生面無表情地告知：「是胰腺癌，已經擴散 了，我們沒什麼能做的了。」


    父親聽到後嚇得腦袋一片空白。他語無倫次，結結巴巴地問：「那……我……還剩……多久……」


    甚至說不出最後那一個字。


    醫生回避父親的目光，含糊地回應：「很難說，每個人不一樣。以你的情況，通常是三到六個月。」


