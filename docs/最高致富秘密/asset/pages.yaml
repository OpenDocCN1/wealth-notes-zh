  md: '# # 結束等待


    主菜送上來，和牛牛排還在盤子裡滋滋作響，野菇香氣更是濃郁。還有那糯米飯，吃下口後也是極致美味。我開口問心裡最後一個問題。


    「說真的，最近我覺得我『當下擁有』的魔力快用完了。已經有兩個星期沒什麼好運。起初我有點動搖，但翻開筆記又恢復信心，我從筆記中看得出來，財運往正確的方向流動，所以我沒有被自己的焦慮淹沒，成功自我克制。」


    叙琬溫馨地笑著，「是的，所有人都會有瓶頸，就像妳在讀書時也多少會意志消沉。我先得稱讚妳，在這停滯時期妳沒有放棄，也知道如何克服消極情緒，這是練習『當下擁有』的成果，妳在這方面進步不少。」


    叙琬接著提到有關「等待」的部分——


    等待時不要心急，要有堅定的信心和把握。這樣就不會害'
