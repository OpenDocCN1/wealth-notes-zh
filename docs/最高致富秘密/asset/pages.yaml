- pgno: 17
  md: '到，其實十年前我就跟這位導師見過面。


    二〇〇六年底我還在報社工作，我們的團隊負責開發有關週末輕鬆閱讀的新聞素材。在一次記者的酒會上，我聽到人們談論「財富導師」的故事，每位富人都想見這位名叫李叙玪的女子。她二十多歲就有名氣，六歲時已經精通「四柱論命」，透過生辰論斷人的一生。她熟讀東方和亞洲經典，分析了數千人的資料，得出自己的結論。她著作的財富書本本都登上暢銷排行榜。


    「哇噻！真有趣。再多說一點這位導師的事。」我說。


    我同事喝了一口酒說：「妳知道最有趣的是什麼嗎？每個見過她的都說她與眾不同。」這樣一說，我更是好奇，他繼續說：「有人說她像是睿智的導師，也有人說她有不可言說的吸引力，也有人覺得她只是個純真的女孩。我聽過有幾個男生敗倒在她的石榴裙下對她無比敬仰。當然，她沒有給這些男人任何機會。」


    「喔，真的嗎？」


    「是的，但所有見過她的人都一致表示自己的人生改變了。依他們的說法，他們抓住了機會和運氣，最後都成功了。」


