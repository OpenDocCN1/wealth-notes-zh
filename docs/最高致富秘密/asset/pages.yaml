  md: '# CHAPTER 38


    逃離母體


    216 《駭客任務》在一九九九年上映，華卓斯基姊妹導演，主角湯瑪斯·安德森是一名平凡的上班族，後來成為名叫尼歐的傳奇駭客。他遇到了駭客墨菲斯，發現了驚天動地的事實，他所在的生活世界一切都是虛擬的，是一個以人類當作能源的母體機械創造出來。尼歐意識到現實後便逃離母體，加入反抗組織，投入對抗巨型母體的戰爭中。當在母體內和電腦特工作戰時，尼歐意識到他像有超能力般，可以任意操控母體裡的事物。


    216 在電影裡，墨菲斯張開雙手給尼歐看，分別有一顆紅色藥丸和藍色藥丸。「你吃了藍色藥丸，那事情就結束了，你會在床上醒來，相信你想相信的一切。你吃了紅色藥丸，你會待在仙境裡，我會讓你看看兔子洞有多深。」'
