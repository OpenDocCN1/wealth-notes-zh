- pgno: 11
  md: '他在醫院裡一天比一天虛弱。瘦到只剩皮包骨了，雙腳還水腫。有一天他似乎預感到是時候了，拉著我的手跟我說話。


    「我這一輩子都想要發財，所以不斷存錢，但到頭來卻沒有變得富有。回顧過去，我好後悔。為了擔心錢不夠，錯失很多美好的時刻……忘掉所有我講過關於節儉的事，不要浪費力氣在儲蓄上，去找到真正發財的路，去找到我沒找到的答案。」


    這是我成年來，父親第一次握我的手。小時候輕易就把我舉起來的手，現在乾瘦得像根木柴。


    「爸，我發誓，我會找到的。我不會讓你這輩子白活。」


    然後我說了我這輩子一直想说但從沒說過的話，「爸爸，我愛你。」


    他茫然地望著天花板，但我能看到他眼眶裡的淚水。


    他在一月的晚上去世。我看著父親的遺體被安放在停屍間後走到外面，漆黑的夜裡飄起了雪。我想像是這個世界在對他的靈魂致意，抬頭凝視著夜空，一陣刺骨的寒風刮著臉頰，就在那時，才意識到父親真的離世了。


    喪禮結束後，我在父母家收拾父親的遺物。我打開冰箱，看到五條冰冻的小黃魚，再也沒人吃它。


    一直憋在心底的淚水終於爆發了。我像小孩一樣倒在地上痛哭。才知道自己有多麼愛父親，我為他連這種輕而易舉的享受都拒絕感到痛心，沒有好好吃完一條小黃魚就過世。然後


