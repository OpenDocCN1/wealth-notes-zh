  md: '義大利，維洛納的布拉廣場，這浪漫的城市因莎士比亞的《羅密歐與茱麗葉》而聞名。我在這裡等待叙玠。前一天和她暢聊，被她的洞察力與充沛能量吸引，在她的春風話語裡不知不覺經過了幾個小時。聽她說話，我感覺自己充滿信心和希望，相信自己也能致富。心裡有希望的時候，整個世界都跟以前不一樣。


