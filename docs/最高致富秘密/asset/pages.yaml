  md: '踐，我幾乎一整天都處在意識清醒的狀態。


    我邊走邊想，快到約好地點時，就看到叙玭站在遠處的竹林中。她穿著印有黑色花紋緊身連衣裝，感覺很像和服，加上玫瑰色的口紅，背後襯著飄著霧氣的綠色竹林，充滿了東方美。


    我們高興地寒暄，這時下起了雨，我們撐著傘走在林道上，雨點滑落回大地前，在葉子上敲出悅耳的滴答聲。


    叙玭向前走了半步，微微把雨傘斜一邊，抬頭看著竹林。我也停下腳步，「能在雨中漫步真是太好了，不花半分錢就有這樣的享受，我正處於『當下擁有』的狀態！」


    可能是因為身邊的人是叙玭，我那情感更加強烈。她帶著微笑轉過來看我一眼。


    走出竹林後雨慢慢變小。我們在渡口等著接駁船隻，開向叙玭落腳的旅館。下了船，沿著緩坡走，進入一間四百年曆史的房子，穿過優雅的日式花園和池塘，來到餐館，在這寧靜的景色中，未飲已醉。


    懷石料理開始上菜，哇喔！太精緻了：茄子上沾芥末，接著是鱈魚捲，盤子上還有竹子做裝飾、迷你烤魚、日式涼粉，擺盤擺得很漂亮。


    讓人賞心悅目的食物，漂亮到我捨不得吃。叙玭先從煙鱈鱈魚捲開動，我也跟她一樣，鱈魚捲包著米粒，一起進到嘴裡。我閉上眼睛細細品味，然後才開口：「妳上次建議多點機會獨處。我獨處時邊思考邊寫下筆記，然後感覺腦袋裡好像有聲音……」後面幾個字已經含著食物說不清楚了。'
