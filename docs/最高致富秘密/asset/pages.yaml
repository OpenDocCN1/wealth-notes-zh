  md: '我清醒了，我買這雙鞋一點都不高興，反而只會讓我緊張，事後我一定會後悔。我把信用卡收回包包，兩手空空地離開百貨公司。我很高興自己實踐了「當下擁有」，雖然這次並不是用在買東西。我的不安消失了，輕鬆許多。「啊，真高興自己沒有買下手！不然現在會覺得很糟糕。」


    下次「當下擁有」的機會很快又出現。在去巴黎的機場裡，免稅店裡很多名牌的區域，有一排飾帶的黑色平跟涼鞋七折特價，打完折只要三百美元。這設計根本百搭，我看了好喜歡，試穿後對著鏡子反覆照著，很滿意。當下拿出信用卡，高興地簽了自己的名字，我覺得這正是我有錢的證明，也投資了自己的未來，嘴角不自覺上揚。


    如果是還沒學會「當下擁有」的我，這次的購買經驗不會這麼愉快。把錢花在不是急需的東西上只會讓我內疚。但我還是會買，只是會擔心自己是不是又衝動購物了。現在不同，我不會對自己的決定感到焦慮不安。


    這次和百貨公司那次不一樣；百貨公司那次我感到緊張，也有點頭痛；可是這次完全相反，心情輕鬆也很快樂。我知道自己真正想要什麼，也讓我精神煥發。


    「各位女士先生，航班馬上就要起飛……」我聽到廣播，閉上眼睛，舒適的商務艙座位在等我，感覺自在在椅子上融化了，這就是有錢的感覺。'
