  md: '# 序言


    「她註定是要讓人們變富有的女人。」


    這句話在我腦中迴盪。目前正飛往歐洲，去見人稱「財富導師」的李叙珮。飛機窗外是一望無際的群山，大概在亞洲大陸上空。我父親去世前花光了畢生積蓄，在死前還對我耳提面命，懇求我找到不用犧牲當下的方式致富。在我過去當記者的生涯中，知道唯有這位導師能給我答案。我望向窗外，自問：「當我看到她後……我也能致富嗎？」


    心靈導師、洞察女皇、聖者、希望綠洲、命運瞭望者……別人幫她取的外號多到數不清，簡直是《權力遊戲》裡的龍母。而這些外號指向的是一位三十幾歲漂亮又迷人的女子——李叙珮。她從六歲就開始了終生志業，畢生致力研究致富的秘密，十幾歲就替許多富人提供諮詢服務，二十多歲就已經在諸多商業大亨、房地產集團、投資界中樹立自己的名聲。聽說光是要聽取她的建議就要等上一年多，總統候選人和全球企業領袖都會徵求她的意見。她研究超過十萬多個有錢人的案例，透過分析找到了發財的秘密。'
  merge: -1
  img_proc: true
- pgno: 6
  md: '報紙上對她的報導令人印象深刻。傳統上，中國商人要做生意前，會替彼此占卜。叙珣的祖母曾和中國商人有織品生意上的往來，也跟他們學了占命的方法，還幫自己許多孫子算命。驚訝地發現叙珣很不簡單，這位六歲的小孫女有驚人的天賦，能替人帶來財富和幸運，並說：「這小孩註定會讓許多人富有，治癒人們的心靈。」


    經過這麼久的時間，我突然開始擔心。要是叙珣跟我說，現在的世界已經關閉發財的道路，叫我不要再作夢時，該怎麼辦？或是她給我的建言不管用，甚至讓我更窮呢？又會不會我誤解她的意思，她並不是真的要我去找她？


    為了不讓自己胡思亂想，我打開頭頂上的燈，拿出筆記本寫下見面時要問的問題。


    +   - 要怎樣才能致富？

    - 如果有機會，我也能變有錢嗎？

    - 我什麼時候可以成為富人？

    - 我會有多少財富？


    有沒有無須犧牲當下生活的致富方式？

    此時，飛機正在下降，我手腳也跟著機身輕顫。

    「我不知道，但我想我的人生將會改變。」


