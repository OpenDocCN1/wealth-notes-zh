    叙琮手指捧著咖啡杯，啜了一口，用棕色的眼睛看著我，說話的音量幾近氣音。


    > 「妳現在最自然的情感。」


    頓時，我心涼了半截。已經很久沒人問我感覺了。在這個競爭激烈的世界，我一直把情感當成是多餘的；流露情感代表著在別人面前示弱。我只要每天上班、賺錢、競爭。然後情感慢慢變鈍，變得愈來愈像個機械。父親死後，我心裡的情感變得扭曲，就算心再怎麼痛，也沒那麼容易哭出來。


    我對叙琮說：「在這之前，我一直認為情感是要被壓抑的。但我想我錯了。」'
