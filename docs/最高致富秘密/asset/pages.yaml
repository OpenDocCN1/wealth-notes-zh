  md: '線，對外發出能量，像磁鐵一樣把錢吸引過來，再次睜開眼晴後會對自己說：「是了，錢正在過來，我正通往財富的道路。」「當下擁有」的幸福愈來愈勉強，我對金錢的態度也跟著轉變。以前每次上超市結帳，收銀台在刷條碼時，我心裡都很凝重，牛里脊肉怎麼那麼貴？我真的需要這個嗎？不吃鱈魚也不會怎樣……家裡冰箱裡還有雞。怎麼才這些東西就超過一百美元了？家裡有很多可以代替橄欖油的東西……這個我最好放回去。每次離開超市的心情都很沉重，雖然我也沒做什麼錯事，仍會有罪惡感。


