  md: '# 揮霍與炫富


    我心中仍有放不下的石頭困擾著，「我說一下我朋友的故事。她是一家化妝品公司行銷經理，她把薪水全部拿來消費，那花錢的方式好像沒有明天一樣。買名牌包包、衣服、鞋子……一大堆東西，好像買上癮了，有時候一個包包的錢比她一個月薪水還多，她還會貸款買名車。就算被信用卡帳單和銀行債務壓得喘不過氣，她也一樣花錢不手軟。像這樣的人在享受消費時，會因此致富嗎？」


