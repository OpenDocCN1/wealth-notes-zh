  md: '心裡愈來愈焦躁，就快輪到我了。全身不受控制在發抖，手腳也抖個不停。焦慮和害怕，蒼白的兩手在冒汗。進入播放室時，我覺得自己完蛋了。聚光燈照耀下，眼睛一片空白，緊張得什麼都看不到。開始沒幾秒，本來練到很順暢的句子，被我結結巴巴地唸了出來。


