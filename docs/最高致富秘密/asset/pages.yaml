  md: '像是有塊重石壓在胸口，耳邊像有狂風在吹一般的噪音，這絕對是紅色信號。我說道：「喔！是紅燈，我的焦慮和擔心是虛假的聲音！」


    我用這種反向測試幫我找到了方向。我持續實踐「當下擁有」的世界，似乎在告訴我通往財富的幽徑。


    就在叙玳回信沒多久後，我接到房地產經紀的電話，問我有沒有意願出售我的公寓。聽到它現在的市值時，差點從椅子上跌下來。比我去年買時又漲了三十萬美元。相當於我連續五年每個月存五千！我沒多花一分錢，「當下擁有」就替我帶來這筆意外之財！我到簽下出售同意時也仍在驚訝中。


    「『當下擁有』的奇蹟！這就是我擁有的世界！」


    我賣掉公寓後，當天和家人在一家著名的法國餐廳大吃一頓，幫我丈夫買了套漂亮的西裝，給我兒子買了一套他想要的火車玩具組。我太高興了；花這筆錢證明我有很多錢，嘴裡喝著昂貴的紅酒，心想：哇喔！突然一大筆錢冒出來……太不可思議了！


    幾天後，我像往常一樣，在公司對面的咖啡廳實踐「當下擁有」。但手邊有個東西感覺很怪——公司的通行證莫名其妙裂成兩半，裂口十分平整，像被刀切斷一樣。它沒有摔到，也沒撞到什麼東西，但塑膠卡就是裂開了。有種晴天霹靂的感覺。這答案再明顯不過，我想，「這是來自『當下擁有』世界的暗示，我需要傾聽自己內心的聲音。」


    我去公司上班，毫不猶豫和首席執行長會面，跟他說我要辭職去寫書。我離開公司時，心如止水，充滿平靜的幸福。'
