  md: '# 導師的故事


    # 展翅高飛


    新的千禧年來臨，叙玟對世界展開雙臂。她不再侷限於東亞；也從美洲、歐洲、南亞地方尋求人類智慧。她在這時期去了美國、加拿大、法國和印度，會見其他哲人智者，與之辯論交流。叙玟向他們分享自己的所得，也從中得益，更具洞見。


    她兼顧學業，大學時主修工商管理，到了研究所主修公共管理，進一步學習企業和國家管理之道。她也學基礎社會科學，像是社會學和心理學；科學也沒忘掉，像是物理和生物；還自學了自然邏輯。才二十出頭羽翼已成，精通東西方經典著作、現代化理論，以及無數的真實個案研究。


    她展翅高飛，被稱為「富人的導師」。所謂慧眼識英雄，叙玟專門找跨國企業第一代的創始人，這些人也立刻發現她的不凡，口耳相傳之下，名聲很快就傳開。許多有錢人都想見她，她為韓國前一百強企業的老闆和首席執行長提供諮詢，以及韓國四分之三最有錢的投資人和地產大亨，另向收入和金融資產排名前三萬的人提供服務並分析他們的資料。


    這些有錢人和叙玟談過後，都對她精關的建議讚不絕口。獨立投資人想問她股票、債券、大宗商品和不動產的投資時機；企業管理者想問她管理策略、人力部署和危機管理'
