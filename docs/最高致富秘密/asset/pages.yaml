    我想到曾在報紙上看到有一家叫瓦比派克的眼鏡品牌報導，瓦比派克成立於二〇一〇年，由華頓商學院的四名研究生成立。剛開始時只做網路通路，以市面上三分之一的低價策略殺出，並向客戶免費寄送眼鏡試戴。但剛開始時，獲得資金也很不容易，無數次向銀行申請貸款都被拒絕。創始人從未動搖，深信自己一定會成功。六年後，這家公司價值超過十億美元。二〇一五年，被《快公司》評為最具創新公司之一，超過谷歌和蘋果。


    瓦比派克的創始人中，有兩位也是我讀管理碩士的同學，我們在同一間教室一起修了一年的課。我記得他們還寄了調查郵件，表示想在畢業前就創業，問我目前的眼鏡花了多少錢、最討厭訂購服務的那幾點、我覺得合理的眼鏡價格是多少。'
