  md: '方針。她會混合微觀和宏觀的角度和企業趨勢的方式，來說明一些買賣，像是外匯、期權，還有各地方不動產情況。


    她言談中讓人聯想到東方宇宙觀的陰陽學說，彼此相生相剋的制衡原理。不管來的人所求為何，她總是用一種鳥瞰世界的觀點，提出最有可能實現的方式。其他的智者只會教自己的弟子要屈服命運，自我克制；但她不一樣，會提出最佳的實踐方式。和她見過面的人，因為她的關係資產倍增，躲過破產危機，或是抓住千載難逢的機會發財。


    她又更加聲名大噪：年僅二十二歲，就成為韓國全國經濟人聯合會最年輕的講師。名字連續好幾年都出現在名講師的名單上。差不多二十五歲出版個人理財書，登上暢銷排行，接受好幾次各大報的採訪。


    和她光彩奪目的職業生涯相比，這位導師內心仍對人生意義存在許多問題。到了三十出頭，她開始認真研究這新課題。'
