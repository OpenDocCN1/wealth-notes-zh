- pgno: 228
  md: '「因為我們把自己監禁起來了。」


    「什麼？監禁？」


    她後面的解釋，又一次顛覆了我。「我是說，我們被自己看世界的方式侷限，鎖上自己的潛力。任何人只要能掙脫，都能依靠自己的潛力致富。」


    可是她的回答仍有不足，「什麼看世界的方式？」


    叙玑後來講了機械論和有機論的觀點，我打開手機上網搜尋。


    依照機械論的觀點，世界就像一台巨大的機器，可以用數學的因果來解釋。個體和世界完全分開，這個世界沒有我也照常在運轉。相對地，有機論的世界觀認為，我們不是置身事外的觀察者，我們是這個世界的參與者，和世界並不是分離的，還會相互影響，彼此給予和接受能量。


    我把網路上搜尋到的看完後，想起了高中時似乎有學過。叙玑補充道：「有機世界觀是東亞世界的傳統，道家有『天地與我並生，萬物與我為一』的觀點，佛教也有『地與我同根，萬物與我一體』的說法，還有儒家的『天地萬物一體之仁』一說。在東方哲學，生命是在自然界的有機體，人們和萬物相互依存和諧共處。」'
