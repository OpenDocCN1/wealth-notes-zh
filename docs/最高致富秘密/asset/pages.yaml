- pgno: 10
  md: '父親拖著身體走出醫院。八月的陽光燦爛，世界充滿生機，街上人們來來往往，講電話的講電話，玩耍的玩耍。但父親的世界已經停滯不前，他茫然地遊蕩好幾個小時；等到回過神來，手機裡已經有二十幾通母親的未接來電。他虛弱地按下通話鍵，遲疑地說：「我得了癌症，胰腺癌。」


    ![](img/581bfd262c39a785428ec7c872cbfaa8_10_0.png)


    聽到父親罹癌的消息，我驚慌失措。這輩子沒見過他生過病，連感冒都沒有。對我來講，父親像磐石般堅強，像山一樣巨大，不敢相信這樣的人會說離開就離開。我能做什麼？我幫得上忙嗎？我第一個想到的就是小黃魚：父親最愛的魚，但他一直捨不得吃。我跑到一家雜貨店尋找黃魚時，止不住的淚水像從胃裡湧出一樣。


    為什麼自己會這麼蠢，非得到最後關頭，才買父親最喜歡的食物給他；過去我有多少機會？


    不幸的是，這是我買給他第一份，也是最後一份小黃魚。母親把菜飯端上桌，但父親連十條中的半條都吃不完。癌細胞擴散速度極快，連他的胃口都佔據了。


    就算他病倒，都沒放棄他的金錢觀——堅持住在一間六張床的癌症病房裡。因為有醫療險，這張床一天花不到十美元。同寢的人發出噪音，他會戴耳塞閉上眼睛。那裡沒有電視可看，而且還很難跟家人交談。不管母親怎麼懇求要他搬到單人病房，他都堅決不答應。


