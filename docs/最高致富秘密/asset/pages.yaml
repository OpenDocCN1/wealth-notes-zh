  md: '午飯後，我們面對面坐在日本榻榻米上，中間有一張矮桌子。敞開的日式拉門外，有寧靜流水和綠樹。下完雨，風很涼，夾雜著森林和清泉的味道。我們喝著綠茶，聽著鳥叫，十分幽靜。叙玑看著窗外也醉心在這當下，自顧自地吟誦：


    > 「諸法空相。凡所有相，皆是虛妄。

    若見諸相非相，則見如來。」


    當然，這是叙玑自己的時光。我輕聲開啟談話，「我在三十歲之前到過京都，但跟現在的愜意不同，那時我狀況不好又很沮喪。」


    叙玑端著杯，斟茶，儀態莊嚴。茶水流至杯中，發出清脆水聲。「快到三十歲之前，是妳人生中重要的課題。」


    這好像跟「當下擁有」沒什麼關係，我很自然地繼續'
