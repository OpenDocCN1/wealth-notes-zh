  md: '「當下擁有」的狀態下我感覺到的東西更多了。使用擁有信號會在心裡探索自己要什麼，慢慢地內心目標也逐漸清晰。一開始會比較花時間，也努力在想該怎麼花錢。但現在我已經過了那一階段，現在開始思考自己想要什麼樣的生活，會聽到自己腦子裡的聲音，但還不夠清楚。


    「我們的目光往往都盯著這世界和別人。」叙琮說，「但當妳獨處時，妳會把目光轉向自己，妳要學會和自己溝通。」


    此時，生魚片送上來了，還有新鮮美味的鯖魚沾著芥末醬在我口中融合。我很喜歡這裡的食物，然後想到我飛來日本之前發生的事。當時信用卡帳單寄來，我開始進入「當下擁有」的狀態。


    那時我以為我信用卡帳單會比平常高。但我跟自己說沒關係，我用自己正向情緒吸引來的錢更多，我會有錢付帳單。


    打開看後，它居然比上個月少了五百多美元！我把開始實踐「當下擁有」之前月分的帳單拿出來比對。


    我自言自語，之前的帳單因為壓力大，一時衝動買了七十美元的牛仔褲。電視購物頻道的限時特價，也買了兩百九十九元的寢具，還分期付six個月。這些買來也沒真的在用。對了，我還買了一百八十美元的特價零食，但我也吃不完。現在我知道，那些都是紅色信號。


    已經很能分辨「當下擁有」和「揮霍」。我可以因為自己有一筆錢而感到高興，而且也不用花費更多。反而因為只專注真正想要的東西，不會瘋狂購物。我是真正在購物，而不是浪費'
