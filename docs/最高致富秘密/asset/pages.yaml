  md: '自己家人圍在桌邊的快樂時光就覺得高興。


    我童年時很喜歡畫虛線畫。那是一種依序把很多點連起來的一種畫，最後會畫出一條魚、一隻企鵝或是大象。「當下擁有」的筆記和畫這種畫很像。當我回顧這些紀錄，就像把這些點連上一樣，可以看到之前未曾注意到的流向。我可以看到自己正在替家人和朋友建立一種幸福又舒適的生活。「當下擁有」的幸福愈來愈強，錢跟好運也以不同的方式向我走來。我會利用信號手勢來節省不必要的開支，不會衝動購物。我很清楚自己要什麼，而且每次花錢的幸福感的與日俱增。重新閱讀筆記後，我知道自己正通往富足的道路。


