    # 八月一日


    我擁有：我的錢讓我能在峇里島享受美妙的假期。


    我感覺：我覺得自己真的很幸運，不但有錢能支付度假費用，好運還接二連三到來，「當下擁有」還藏了多少驚喜？


    之後手機跳出一封電子郵件，是總公司寄來的。雖然在度假，但我對那封信的預感特別好。


    「公司政策異動，現在四十歲以上的員工健康保險費用將會由公司支付。」


    我在幾個月前才剛過完四十歲生日。我立刻打開郵件附件，看了後差點從椅子上跳起來。下個月會有五千美元的退款匯到我帳戶，太意外了！要是我沒過生日，那一分錢也拿不到。這筆錢用來支付這次的度假綽綽有餘。


