  md: '卡爾·榮格認為，心靈不僅僅是個人潛意識，更是所有人集體潛意識的集合，它是人類智慧的寶庫。艾瑞克·弗洛姆在《以往的語言》中提到過，透過夢，可以到達潛意識更深一層的智慧。二十世紀心理學導師，米爾頓·艾瑞克森也說過，人類問題的解答，就存在人的潛意識裡。他相信潛意識是一個人積極力量和恢復力的來源。


    我們可以透過夢來窺見潛意識裡的內容。我差不多十歲時，母親說她夢到暴風雨中握著我去世祖母的手。第二天一大早，我父母開車上街，母親把她夢裡的情節轉告父親，叮噹他開車要小心。天雨路滑的彎道，輪胎打滑，但父親慢慢踩下煞車，避免了一起交通事故。母親相信是祖母託夢，幫她避過一次災難。


    幾年前，我嫂嫂夢見一條紫色的大魚進到家中。我父母聽到這個夢很高興，認為我們家很快就有喜事。不久後，我得知自己懷孕了。在我認識導師前幾年，也曾夢到父親給了我一面金牌，那時我就有預感，叙玹會回我信。


    我早就對潛意識裡的智慧深信不疑，我小心地問：「所以，你是說我的潛意識，已經知道哪條路會通往財富了？」


    「是的，潛意識可以幫助我們得到好運，它會創造財富的流動，我們只要跟在它後面便能獲益。天道運行的運勢不會像氣象預報告訴你明天會不會下雨。它有完全不同的方式，就像因果循環裡的「因」，要是我們在潛意識裡種下善因，等到時機成熟就會收成善果。」


