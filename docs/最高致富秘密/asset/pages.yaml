    和叙玟談話時，我想起了母親，她的兩次土星回歸已經過了。她仍陷在我父親死亡的悲傷中，但身體還是很健康。如果以平均壽命來看，她還有二十年左右的時間。但母親依然無法自在花錢，我懇求她放心享受生活，她回：「我一輩子都在省錢，妳要我怎麼說放心就放心？」


