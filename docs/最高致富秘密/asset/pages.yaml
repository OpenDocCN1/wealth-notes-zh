  md: '# ## 竹林


    火車在京都郊外停下，嵐山站到了。許多人在這一站下車，前往古代日本貴族的度假勝地。我一離開車站，便嗅到明顯的潮濕氣味。抬頭看著天空說：「就快下雨了。」烏雲低垂在九月的天空下，清風吹散夏日的炎熱。我深吸一口新鮮空氣到肺裡。


    上次和導師見面已過了兩個月。《藝伎回憶錄》曾在這地方取景，而我和叙玿也約在這裡碰面。我穿過一座古老的木橋來到竹林中，稍作駐足，感受這裡的氣氛。傳統日式木屋和諧地融入綠色小林中。風中夾雜竹林的香氣。我閉上眼，吸一口氣，那清新在我體內擴散，自動處在「當下擁有」的狀態，不多想便被這一切感動。「啊……真是舒暢。」


    「當下擁有」這感覺一開始練習會覺得陌生，我還時常忘記實踐。就像嬰兒學步一樣，但這嬰兒如今已都會跑了。我已經把擁有的態度完全融入生活裡。甚至不在消費時也可以實'
