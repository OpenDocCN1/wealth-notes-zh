    真正的富有


    我們點的丁骨牛排滋滋作響地端上來了。小小的油滴，在煎得恰到好處的牛排表面上跳躍，我已不禁流滿口水。


    叙玒拿著刀叉，「試著充分體驗牛排的味道、香氣，還有口感，當成這是妳第一次吃牛排一樣。」


    我吃了一口，用鹽和胡椒調味得剛剛好，宜人的氣味，略有彈性的肉質。「嗯，真好吃。」嘴角自然而然揚起。我閉上眼睛，細細品味它的味道，然後嚥下去。我打開半睜的眼睛看著叙玒。


    「哇，真好吃！光是『美味』好像還不足以形容………但我不確定那會是什麼。」我還在思索適當的詞彙。


    「這就是實踐『當下擁有』的開始，很好的開始。現在全神貫注，忘情地去享受嘴裡的味道。這就是百分之百讓妳處在此時此刻的當下感受。」她眼睛睜得大大的，向我比了個讚。'
