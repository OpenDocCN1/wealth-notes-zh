  md: '說得我一頭霧水。我專注在她所說的那詞彙，「所以，『當下擁有』是什麼？」


    叙珇神秘地笑笑，輕輕碰了咖啡杯，啜飲的時候杯柄抓得更緊了。她安詳地沉默片刻，沒有回應我的問題，而是指著我放在桌上的手機：「這支手機是什麼時候買的？」


    「嗯，買了大概一年吧？買的時候還是全新的。」


    不解地回，但仍樂意繼續這樣的啞謎。


    「那就讓我們回到一年前，妳買這支手機的心情是什麼？」


    ——這支手機啊，我買的時候心裡非常焦慮。這是店裡最熱門也是最貴的產品，我覺得它會讓我看起來像成功的職業女性；另一方面我其實很擔心，買這麼貴的手機真的好嗎？便宜一點的功能也都一樣啊。再三考慮後，我用信用卡分六期支付。印收據的時候心跳得很快，感覺花這麼多錢是件不對的事。之後每個月看到帳單，都會責怪自己太過浪費。


    我把過程告訴她，「嗯，我先是考慮它多少錢，覺得有點太貴，猶豫自己是否買得起。付款後，我感到內疚，很後悔自己買了。」


    「所以妳當時並不開心。」


    「我當時覺得糟透了。我試著把它合理化，但心裡的疙瘩一直都在。」


    叙珇開口，聲音清脆。


    「『當下擁有』就是在花錢的時候，充分感受當下妳所拥有的。雖然妳的問題：『要怎樣才能變有錢？』有很多種方'
