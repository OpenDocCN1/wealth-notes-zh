    「什麼？怎麼會？」

    「當下擁有」，從昨天起，這字句就刻在我心頭，她說我已經在實踐了？但我還沒開始花錢啊。

    「現在的妳正在享受，全身心地感受這廣場和受祝福的陽光。妳正在把喜悅分享給我。活在當下是『當下擁有』的第一步。」

    「好吧，這比我想的還容易！」這概念用說的好像很難理解，但其實真的這麼簡單。

    我們漫步在美妙的天氣裡，手裡拿著香草冰淇淋，就像《羅馬假期》裡的奧黛麗．赫本。踩在廣場地上，我鞋子像樂器一樣發出咯噠聲響。這樣的當下，很難不樂在其中。我舔了一口冰淇淋，不管它是在陽光下融化，還是在我嘴裡消失，這甜甜的香氣最終都會充斥在我整個體內。


