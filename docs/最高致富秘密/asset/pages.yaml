- pgno: 8
  md: '從那時候他就一直擔心錢的問題。他晚年時也常說道：「我寧願死，也不要窮。」對年幼時的父親來講，沒錢意味著飢餓、恐懼，甚至死亡。


    他小時候的某個晚上餓到哭，哭著哭著就睡著了，後來，他被某個聲音吵醒……


    「對不起，讓你挨餓了，真的很抱歉。」


    祖父握著父親的手，那張因飢餓而削瘦的臉，像小孩一樣哭得涕淚縱橫。


    父親在述說那段往事時，老臉也緩緩滲出淚水，這讓我更難過了。


    ![](img/581bfd262c39a785428ec7c872cbfaa8_8_0.png)


    父親小時候就非常勤奮。他有四個兄弟，他是五人中唯一大學畢業的，曾在韓國重工業公司擔任工程師一職。七、八〇年代相關產業的經濟起飛，父親跟其他人一樣，時常週末也要加班工作。不管他再怎麼忙，總是說照顧我跟弟弟能讓他充飽再拚工作的動力。身為一家之主，他任勞任怨、竭盡全力，從沒讓我們因飢餓而哭泣過。


    他還分享了他對錢的看法。他告訴我：「人隨時都可能破產，落得身無分文，亂花錢會毀了妳一生。錢是用來存，不是用來花的。」


    他退休時生活算過得去，買了房子，有了人壽保險，也負擔得起出國的旅費，孩子們在經濟上都獨立了。可是父親總'
