    我感覺看到那張桌子的時候不舒服，那並不是我想找的餐桌。我想到的是一位朋友在Instagram上的照片，他在炫耀自己的義大利餐桌，所以我遲疑了。我想在Instagram上貼我自己選的餐桌，上面擺放些盤子。信號告訴我，那不是我要的餐桌。要是買了，一定會後悔！


    # 六月十九日


    我擁有足夠的錢買這張漂亮的桌子。今天終於看到我一直在找的胡桃原木桌。雖然比想像中貴，但信號燈是綠色的。正要付款時，店主給了我四百美元的折扣。


    我感覺自己很幸運，用更低的價錢買到！雖然它仍比我預期的貴，但我不後悔。我很高興自己有能力買自己真正想要的東西。這張桌子讓我開心，光是想到和'
