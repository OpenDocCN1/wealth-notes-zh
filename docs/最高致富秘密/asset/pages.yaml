  md: '己，自己的父母和大多數人都是這樣過日子的，我已不記得上次開懷大笑是何時。


    看著那些嫁給有錢老公或是繼承父母大筆遺產的朋友，每天都不用上班，就覺得自己很慘。他們的生活和我的有天壤之別，只要照顧好自己，送小孩去學校，早上做做皮拉提斯或上芭蕾舞課。手裡拿著當季的包包，在時髦的餐廳裡悠閒地吃午餐，洗衣打掃一類的事也不用操心，會有傭人處理。小孩放假後，全家大小會去歐洲或東南亞旅行。我在他們臉書上的笑容，看不到一絲財務上的煩惱。我其實非常羨慕他們，只是從沒說出口。


    後來遇到導師，我的生活改變了。日子並沒有那麼難過，看到別人的打卡照也不再羨慕。畢竟，我走在正確的道路上，不用為了明天犧牲今天，一步步往未來致富的路上前進，希望在我胸口跳動，而我每天活在當下。


    從巴黎飛回韓國的途中，心裡還惦記著叙珣，她身體不適也一樣全心全力把精力分給我，使我更相信自己。我決心為了她，更要徹底實踐「當下擁有」。


    回韓國後，我卯足全力在實踐「當下擁有」。我在巴黎學會了看信號，花錢的時候會做出手勢，找出這是否真的是自己想要買的。我愈是實踐，便愈感自在。如叙珣說這就像在重量訓練一樣，我也愈來愈容易得到綠燈的訊號。


