    身為個人商業模式的改造者，雖然通用的都是類似的工具，但每個人的改造過程及結果卻大異其趣。


    這一章的最後，要介紹的是四則翻新個人商業模式的故事，透過它們，我們可以豐富並延伸對個人商業模式的了解，並將這些方法運用在自己身上。


