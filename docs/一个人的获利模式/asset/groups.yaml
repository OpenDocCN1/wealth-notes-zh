    # 打造你的


    勞諺認為「學會在力爭奮鬥時仍保持沉穩，

    非常重要」，他聲稱他的主張並非原創。他所表達所陳述的，

    全都來自千百年來的心靈哲學傳統，這些全是用以處理人類問題的基

    本原則。

    或許，這就是為什麼他的話會讓 Google 員工

    （這家公司正是好是現代科技的翹楚）聽得刺耳

    的頑固。即便在光速的數位時代，形塑我們

    生活與工作的，似乎依然是那些恆久不變的

    人性因素。

    而當我們準備要調整個人的商業模式圖時，

    這些人性因素是必須好好處理的。每個人都

    渴望從那些帶來挫折感的內心對話中解脫，

    誰不曾夢想過重新形塑自己呢？

    讓我們從一個美麗的實驗開始，這個實驗最

    早是由英國哲學家伯特蘭・羅素（Bertrand

    Russell）在二十世紀初提出。


    想像二十個人同時從不同方向觀察一張椅子

    （A），每個人都對這張椅子有不同的看法。

    有些人眼中的椅子是（B），也有人看到的是

    （C），高檔子的人可能看成（D）。換句話說，

    對於同一張椅子，二十個人可能會有二十種不

    同的看法。

    那麼，所有這些看法都正確嗎？沒錯！

    可是，如果他們都對，到底哪一個才是

    這張椅子呢？

    真正的答案是？以上皆非。每一種看法都只

    是代表這張椅子的一个角度，而非這張椅子

    本身。當椅子本身做為一個單獨的存在時，

    人們對它的體驗各自截然不同。'
  - '[PAGE 164]


    事實上，我們對這張椅子的理解（perception），影響我們的程度超過椅子本身。因 此，對椅子有意義的經驗只是基於一個象徵（亦即我們的看法），而非其實體。


    羅素的主張是，我們永遠無法看見或知道這張椅子完整的實體——即使我們知道這個別體確實存在。我們的知識始終受限於我們的觀點。


    然而，如果你繞著椅子走一圈，在每個人的後方停留一下仔細看，就能看到這張椅子的不同角度，因而有了全新的觀點。


    所以，倘若二十個人對同一張椅子有二十種不同的觀點，只要你移動位置、障礙物，就能改變你原來的觀點。


    簡言之，你可以運用換位思考的力量，來重新設定現實。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_164_0.png)'
