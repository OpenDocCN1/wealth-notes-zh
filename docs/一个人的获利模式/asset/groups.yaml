    # 實收薪資的

    真正意義


    看看右欄下面艾蜜莉的個人損益表，請留意她真正拿到手的實領薪資（take-home pay）是 2,880美元，比起她的薪資總額（gross salary）4,000美元明顯少了很
    多。扣繳稅額、社會保險以及其他醫療保險等扣繳項目就占了 1,120美元。


    我們可以把這筆 1,120美元的扣繳項目視為一種「收入成本」，是艾蜜莉為員工及美國公民所必須支付的費用（身為員工，她享有健康保險及退休福利；身為公民，她享有警察、消防、教育及其他公共服務）。


    就艾蜜莉的立場來說，扣繳的錢越少、實領到的錢越多，她當然越開心，但如果她沒有選擇餘地：如果她要以員工身分賺取收入（並且和稅捐機關保持良好關係），她就必須接受稅費福利等各種扣繳項目。因此對她而言，所謂「收入成本」就占了薪資的
    28%。


    現在，請注意，我們接著要來探索實領薪資的真正意義。


    艾蜜莉可以用來支付她所生活開銷的錢是 2,880美元，而不是 4,000美元的薪水。這個明顯的事實，是了解基本商業運作（以及如何決定薪資）的關鍵，讓我們來解釋一下：


    就好像艾蜜莉一樣，公司支付各種開支的錢必須須來自「實領薪資」——亦即扣除所有創造營收所必須投入的成本費用後，所剩下來的資金。


    在第 216 頁，我們可以看到大腳鞋業公司的「實領薪資」是如何產生的，以了解實務運作的情況。


