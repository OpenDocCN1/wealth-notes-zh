    ## 徵求進一步深入說明的機會


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_236_0.png)


    ## 轉向，不損害你的商業模式


    轉向（Pivoting），指的是針對潛在顧客的回饋所採取得行動，在適當時候發現錯誤，並重新審視你的商業模式，調整其中一個或多個要素以便更貼近現實。一旦發現自己所採擇的商業模式無法讓消費者滿足時，轉向是最適當的做法。


    你的轉向應該包括尋找全新的客戶（如同224頁的龐德），或者調整你的通路（如同67頁的提愛蒙），此外，你也可能需要重新思考更多的要素，就像右頁謝丹尼所做的。


    轉向會把你拉回到發掘顧客的階段，此時你已更新新的個人的商業模式，並且再次開始與介紹人會面的過程。一旦你覺得已經為推銷新商業模式做好準備了，就可進入驗證客戶的階段再次試一次。保持信心，你一定能夠爭取到客戶。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_237_0.png)


    ## 切合現有的商業模式


    ## 人員

    電腦技術的人員


    因為工作壓力太大，賴賴電腦技術人員謝丹尼選擇提早退休。希望能獨立工作並掌握自己的命運。


    他喜歡技術工作，因此在他人繪製的商業模式圖中，勾勒出的藍圖是買下並經營一家電腦零售店。


    為了驗證他的想法是否可行，謝丹尼拜託了一位商業經紀人、對方建議：1) 檢視每家要脫手的電腦零售店的財務狀況，以及 2) 去進行性格測試。


    做了這兩件事情後，謝丹尼了解到：1) 電腦零售店是低毛利、高周轉的薄利事業，以及 2) 他欠缺客服的人格特質，比較適合不用處理人際關係的後勤技術工作。


    於是，他進行了策略轉向，重新檢視及修改他的商業模式，並把目標客戶改為「企業對企業」(B-to-B) 的科技公司。


    很快的，有個機會冒出來了，這在他的第一個商業模式中鐵定會被略過：那是一家銷售商用終端並提供調校、認證及售後服務的公司。這家公司既能讓謝丹尼施展他的專業能力，又不用面對不識技術的顧客有太多接觸，能在有限的壓力下獨立工作，賺取不錯的報酬。


    沒錯，謝丹尼買下了這家公司，現在他很享受當老闆的生活，經常性穿著丁字褲短褲。


    ## 面對未來的信心


    一旦客戶雇用了你，或你找到想要的客戶時，你的個人商業模式就生效了。現在你已通過驗證及測試的階段，往前來到了執行階段，你的新商業模式已經起飛。做得好！


    你已經走了一段很長的一段路。無論是否完成了本書中的所有練習，我們都希望你能繼續著用你自己的商業模式。最起碼，我們希望你面對自己的職業生涯時，所採用的方式是建立模式（modeling），而不是傳統的做規則（planning），這樣才能找出適作的核心原則做為持續的方向。


    你也許注意到了，就某種意義來說。個人的商業模式圖就像是一張「關係地圖」。從圖中可以看出「你是誰」與「你做哪些事」，以及「你做哪些事」與「你如何幫助顧客」之間的關聯。最重要的，是。從個人的商業模式圖中，你可以清楚看出你所說「你要做的那些人」之間的關係，以及透過你的，人產生目標，可以為更大的社區群體服務。就像一張好的地圖可以讓探險家持續使用多年，個人商業模式圖也可能反覆運用。讓你不論工作或生活都能獲得成為及滿足。


    ## 第10章

    接下来呢？

    What''s Next?


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_243_0.png)


    更多適用BMY的例子


    職涯轉換有時並非出於自願。當某個組織繼續修改改善它的商業模式，員工通常也需要跟著調整他們的個人商業模式。我們論壇的成員馬科斯·馬琉瑞（Makis Malioris）就是一個真實例子。


    馬科斯長期在一家大型國際金融服務公司擔任程式設計師和分析師的主管，一直以來只為一個客戶服務，也就是他在雅典辦公室的上司。然而，現在必須面對職涯轉換挑戰，因為公司要求他同時為在各地辦公室外的八個新區域辦公室提供服務，這表示他需要經常且密集的飛行出差。馬科斯很不安，他的第一個念頭是：「我害怕搭飛機！」


    這個新職位促使馬科斯重塑製他的個人商業模式圖。雖然他欠缺跨文化的經驗，還是立刻接手了八個新的國際客戶，全都位於不同國家，工作文化、風格、道德標準各異。


    以前他可以輕鬆地規畫及協調老同事的工作、但現在他必須說服新客戶採納並維護 IT基礎建設資料庫（Information Technology Infrastructure
    Library, ITIL）流程。這需要新的關係維護活動，包括「行銷」、經常飛行、長期的旅館住宿，以及用電話和電子郵件來取代面對面的顧客關係。


    這個新職位在收益上略有增加，但卻擁有巨大的專業發展利益。馬科斯說其中大部分是國際曝光度，以及成為「新流程」擁有者的機會，而不只是原先的管理者。他成功扮演了新角色，並進一步晉升到承擔更多責任的職位。


    可惜的是，他的老闆受到希臘金融危機波及，只能讓馬科斯領取遲繳的薪金離開公司。幸好，他從商業模式學到的方法持續協助他過得還不錯。


    「團隊需要第二個假設...」

    必要時，必須...」，這些說法...的創新...必須...

    ...

    ...一個...的這個...

    ...但...的圖像...1...1...「下面...」


    正如馬科斯也表贊同的（我們在第1章也討論過），商業模式創新沒有停止的一天，無論是對於組織或個人來說都如此。某個商業模式也許能用上幾年，但總有一天會被迫非改變不可。你的個人商業模式也會有所演化，就算不是因為時移境遷，也會因為你個人的經驗成長而改變。當你需要重新編製新的商業模式時間時，我們希望這本書的觀念能再次啟發及鼓舞你。


    ## 運用個人商業模式的其他方式


    關於個人的終極隱私與創造力


    設計與個人的商業模式圖


    至全球的商學院研究課程，很多人都見識過使用商業模式圖來教授策略、創業及設計。我們相信商業模式圖也適合用在大大學部，讓更多人學習商業的基本原理，因為商業模式圖是一種簡明易懂的方式，可用來了解創業的各項基本元素。同樣的，我們也相信個人商業模式圖是追求個人生涯的強大工具，連中學生都能夠運用在個人生涯及／或基本的財務規劃上面。


    關於個人的終點


    我們的目標的很多成員，已經發現個人商業模式是非常有用的教練工具。本書中的很多案例就是取自他們的真實例子。


    關於個人的終點


    本書第96頁提及的個人商業模式圖，是用來描述非工作方面的角色，比如另一半、朋友及父母。論壇有許多成員也成功地把商業模式圖運用在這方面，專業的諮商師也可以透過繪製和檢驗個人的商業模式圖，發展出一套供客戶使用的練習來做為諮商參考。


    關於個人的終點


    對負責年度績效管理的專案主管而言，個人商業模式圖可以提供一個架構，用以檢視員工如何為組織提供附加價值。受到啟發的企業甚至可以延伸個人商業模式圖的用途，拿來為員工的私人生活創造出更多價值。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_246_0.png)


    個人商務經營遊戲的瞬間改變

    以白報紙、海報、麥克筆和便利貼來繪製個人的商業模式圖，有趣又有效率，但有時候多加一個點就貼到一個全新的層次。使用商業模式工具箱iPad版和網路版，可以繪製、估算、註解、分享、合作、重述及翻新的商業模式。這些工具既能做到手繪的速度，又有試算表的精明效率。


    這個工具箱也能讓使用者修改九大要素的標籤及內容，以配合個人商業模式的描述。個人商業界模式圖的應用程式提供了本書提到的各種工具的電子版，幫助使用者評估自己的興趣、能力以及個性傾向（關鍵資源）。


    你可以到下列網址開立免費帳戶，並在線上建立自己的個人商業界模式（目前只有英文版）：www.businessmodeltoolbox.com


    最後要提醒的是：所有的知識與資訊只有透過實踐才會產生價值，BMY（個人商業模式）的理念與架構能否產生結果，要靠你的身體力行。


    我們相信書中所提到的想法與案例，應該能為你帶來某種程度的省思與啟發。透過有系統的思考，去探索自己的個性、興趣、能力，發現自己的優勢可以運用在哪裡，在生活的各種角色中可以發揮什麼影響力，以及在變化快速的職場中，可以有什麼因應之道。在繪製個人商業模式圖後，你的眼睛會全然不同，不管是針對職涯的發展，或是對自己人生的期許。


    接下來，踏出改變的第一步才是重點。本書只是旅程的起點，看到新的觀點及可能性之後，你需要再次把自己放回真實的世界，客觀的去測試及驗證。看看該做什麼改變或調整，要如何開始，是否朝著你所期待的方向邁進，以及是否需要重新定義方向和目標。


    做不一樣的事情除了勇氣與毅力，也需要建立支持體系。除了需求（或逃離）你周遭親朋好友的建議之外，你還需要導師、教練、夥伴一起分享這整個歷程，以提供你持續的動能。我們也希望能從專業的角度，透過本書的帶領及真實案例，提供你一些不同程度的協助、鼓勵及支持。


    有關個人商業模式的討論。一直在BusinessModelYou.com網站（也是這本書開始的地方）持續進行著。你可以考慮加入BusinessModelHub.com的論壇，這是一個個領域、專注於組織商業模式思維的同好社群（目前只有英文版）。


