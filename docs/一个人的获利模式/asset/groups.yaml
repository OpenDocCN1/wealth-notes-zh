    # 九大要素如何相互影響


    評估你對九大要素所做的變動，是有一個有趣又有某些複雜的過程，因為所有要素都被此相關，環環相扣：改變一個要素的某個項目，同時也必須更動另一個要素的內容。我們在第2章談及組織商業模式圖時曾稍微微接觸，在此將針對變動部分及由此產生的影響，進一步深入探討。


    請先想像一下「收入與好處」要素的一個常見問題：收進來的錢不夠用。想要增加更多錢，你會需要(1)吸引更多/更好/不同的顧客，或(2)提供更強/不同/更高的價值主張。


    在表格中加上新顧客，夠簡單了，不是嗎？但是，你不能期望新顧客會自動冒出來。新顧客通常需要額外的行銷或業務活動，因為你應該在「你做哪些事」那一列的「新增」或「擴展」格子中，寫上行銷或業務活動。


    假設你決定透過增加新顧客來增加收入，你可以回到前一頁的表格，在「新增」那欄下或「擴展」格子中，寫上行銷或業務活動。


    # 九大要素


    | 你是誰 你擁有什麼 | 你做哪些事 | 你需要的是哪些人 | 你如何幫助顧客 | 別人是如何知道你的... | 你如何與顧客互動 | 誰能幫你 | 你會獲得什麼
    | 你要付出什麼 |


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_187_0.png)


    當你在「你做哪些事」那列中填入新增內容後，就會動到其他要素。比如果，假設你欠缺的就是行銷技巧，可能會想要接受行銷訓練或參加行銷課程，就需要在「你是誰」這另外的「新增」一格中填入相應的內容。


    相反的，你也不用類似力親為，而是找個具備行銷技巧的關鍵夥伴來幫你，同樣也能達到擴展業務的目標。此時，你就要在「誰能幫你」那列的「新增」格子中，填入「找個新的行銷夥伴」。


    找出這項變動對其他要素造成的影響。然後再根據你的變動，——修改其他要素中相對應的內容。


    這就是有效修正個人商業模式的方式；當你更動某項要素來達到想要的結果時，就必須現在，好好檢視你的商業模式中所有需要更改的要素，然後進行適當的調整。


