    用這張圖，探索你未來要走的路


    ## 你的事業模式


    BUSINESS MODEL YOU

    A One-Page Method for Reinventing Your Career


    作者——根·克拉克 Tim Clark・亞歷山大・奧斯瓦爾德 Alexander Osterwalder & 伊夫·皮涅爾 Yves Pigneur

    設計——亞倫・史密斯 Alan Smith & 帕屈提科斯 Trish Papadakos

    編輯——布萊恩・福格 Megan Lacey

    協力製作——派克克・范德史塔 Patrick van der Pijl

    創作協力——43頁 328個職涯建築家

    譯者——看光進等


    ## 讓天賦與工作對齊


    《Cheers快樂工作人》雜誌特寫

    劉珮玲


    這是資訊最充足的年代，卻也是年輕人比以前更困惑的年代。

    七、八年級生間，為什麼要找到理想的工作這麼困難？

    他們的四、五年級父母也不解，為什麼下一代把工作當體驗，公司一家一家換，追求快樂重於事業成長、經濟安穩。


    我常有機會到企業中向中高階主管分析跨世代管理難題，針對前面這兩個問題，我給這些同時也是身兼父母角色的高階主管的建議是，答案其實就在「自己身上」。

    回想八年級生的成長歷程，他們在政治威權解體、貿易自由化、教改過程中或之後陸續誕生，不管是家庭或學校教育的氛圍，都比以前更開放、包容。從小在父母與老師的鼓勵下，他們被灌輸的是：「相信自己」、「勇於實踐」、「勇敢追夢」。但這些態度在進入職場後，看在大人眼裡，卻往往成了負面標籤：「過度自信」、「被寵壞」、「不切實際」或「好高騖遠」。大人們希望教出跟自己不一樣的一代，可是最後在管理角色上，還是輸給自己的僥倖主張。


    在包容環境、經濟條件無虞下長大的新一代，對工作的困惑感之所以比上一代更強烈，則源自「意義感」的追尋。他們不用為了溫飽而跟工作、上司妥協，他們更在乎的是，做什麼事可以跟興趣結合，讓自己更快樂？這份工作可以帶給我什麼意義？我為什麼要為公司奮戰？我存在目的又是為了什麼？


    當工作的目的從物質報酬轉向心靈層次，生涯也成了一場體驗之旅。有人因此更加認識自己，但有更多人揮舞著意義感的旗幟，卻一路迷茫地跌跌撞撞，揮霍了青春紅利，卻還是找不到實質真諦。


    在出版業多年，接觸過不少探討生涯的書籍，今年初得知《一個人的獲利模式》（Business Model You）中文版即將問世，內心是充滿期待的。原因有兩點。

    首先，這本書所採取的方法是近幾年在商管界非常受歡迎的Canvas，也就是書中所介紹的「商業模式圖」，利用九宮格的思考，為產品建立清晰的策略地圖。這套方法論我自己也很有機會用在工作上，收穫頗大。聽到商業模式圖也可以運用在個人生涯定位上，我當下的反應是，這一定可以幫助許多人認識自己、發現優勢，而且適用對象不只是初次求職的年輕人。如果你正計畫轉職、創業或開拓第二人生，這張「個人的商業模式圖」也同樣能帶給你啟發。

    其次，本書的譯者曾允進（Arthur）不同於一般專業者，他非常豐富的管理經驗，在台積電、中華汽車、台哥大等企業擔任過高階主管，而且是少見橫跨行銷與人力資源兩個領域的專業經理人。目前除了在香港大學授課外，他也在兩岸三地為許多企業授課或指導年輕人。為了讓本書更貼近台灣讀者，書中一些案例都是他親自接觸過的年輕人。

    接到書稿後，我第一時間很快就看完了。這應該是近年來，我看過最有系統的一本書，可以引導讀者按圖索驥一步一步找出自己的天賦跟工作契合，讓求職不再是抽象的代名詞。我也很高興，Arthur未來將與《Cheers》合作，將這套系統以工作坊的形式，協助年輕人透過實作練習的引導，發現自己的優勢。

    最後，希望每位閱讀這本書的人，都能夠發現自我、勇敢追夢，不再是大 人眼中恍惚不安的一代。


    ## 找到個性、興趣與能力的「甜蜜點」


    曹先進


    科技正在改變你的工作方式與組織關係，有些舊職業漸漸被淘汰，有些新職業不斷冒出，更多職業雖然沒消失，但工作內容也不斷變化。

    如果我們不能體會當前職場的結構性變遷，就難以妥善因應。華頓商學院近年的研究指出，現在的大學畢業生在專業生涯中將從事11-14個工作，以每人平均工作40-45年來說，這表示每二十到四年就會換一次工作，包括自願性及非自願性轉換。那麼，到底是誰，以及要在哪麼時候，為下一個職位做好準備呢？答案當然是「每個人」「隨時」都要做好準備。


    職場結構變遷既造成威脅，又帶來機會。今天，每一位求職者都要體認產業與職業不斷變化的事實。本書譯者群雖然各自擁有不同的專業背景，但都非常認同本書的理念與價值觀，希望能結合我們對於在地社區文化理解及實務經驗，創造出一套適合讀者的思維方式與工作工具，想改變卻苦無頭緒的人可以有明確的起步方法。我們特別感謝林妍希及前雲昂兩位識人育才專家，豐富了這本書的內容；也要感謝徐倆倫多次給予寶貴建議，以及參與內容驗證的李孟璇與林信丞兩位年輕夥伴的回饋。


    我們相信台灣年輕人最需要的，是面對就業、轉職、創業的自信與自知；而台灣企業最需要的是，則是設法讓人在自己最擅長的領域發揮最大的價值。我們期待這本書的思考架構，能夠協助讀者有系統地評估自己的職業生涯選擇，找到自己個性、興趣與能力交會的甜蜜點，一步步解除困惑、建立自信，得到成就與滿足。同時，我也希望書中許多經典的職業理論與案例，能夠幫助大家悠遊於理論與實務中，自行融會運用。


