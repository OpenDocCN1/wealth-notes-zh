    我是那種很容易覺得無聊的人。踏上美術設計這一行之後，我常常換工作，很少待在同一個職位太久，尤其我抓住每個從家中小公司，通常無法容忍我這種細節沒耐心、對團隊合作沒熱情的員工，往住幾個月後不是他們把我炒了，就是我自己求去。由於我沒有創業的經驗，因此也沒有想過其他我非常適合接案子，當個自由工作者——直到一位剛除掉的老闆這樣提醒我。


    我對商業模式一點概念也沒有，也不懂得怎樣去行銷自己。但我現在知道除了設計方面的專業能力，我還有兩項強項：-是 我喜歡結交新朋友，二是可以同時做好幾個案子。


    舉例來說，我可以走進一家從來沒去過的公司處處告部門，然後很快就跟大家打成一片，就像是住在這家公司待了很久似的。因為我懂得看人，也懂得這個部門的工作流程。


    像我這種個性——容易覺得無聊、喜歡認識新朋友、喜歡接新案子——的人，很難當全職上班族。因此，當我的「通路」從「上班」變成「按案子」之後，所有的問題全都變為我的強項。此外，我的人際關係技巧也變好了。不過，這可能是因為我在一個新環境下通常不用等待太久，而且我發現自己更容易手可熱了。'
