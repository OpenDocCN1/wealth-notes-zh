    \n# 姓名：史提夫·布魯克斯\n(Steve Brooks)\n\n| 人物： | 關鍵活動： | 探索： |\n| --- | --- | --- |\n\
    | 工程師 |  | 從培養能力轉變為創造價值 |\n\n從我念書剛開始上班那幾年，我一直很認真培養自己的能力，但總覺得自己懷才不遇。畢業後我名列前茅，連拿了兩個電機碩士學位，在海軍當過核子工程師，等等上了MBA，但體管我這麽努力，仍然沒有遇到理想的工作，感覺自己就是個普普通通的工程師。\n\
    \n為了增加成就感，我一直不斷尋求各種方法，終於找到了「一個人的獲利模式」，我畫了自己的商業模式圖，立刻就發現問題在哪裏了。我終於明白，我只顧著培養自己的能力，卻從來沒想過這些能力可以用來幫助哪些人。當我看著「你做哪些事」、「你要幫的是哪些人」這兩個欄位時，我竟然想不出可以填上什麼。\n\
    \n不過，要從原先專注於培養能力轉變為專注於創造價值，卻是一段痛苦艱難的過程。這也是為什麼「一個人的獲利模式」會讓此商業模式圖式更複雜。無論如何，這張圖幫助我找到了自己真正有熱情、有興趣，而且能同時幫助別人\
    \ 的事。\n\n再加上我現在當爸了，我還在思考要如何仿效好好這個角色，要如何跟老婆分工，例如我應該也學做那些我原本不熟悉的家事嗎？我猜想，應該絕大多數當爸的人都在想同樣的問題。此刻，我正在為新增加的爸爸角色重新填寫一份商業模式圖。\n\
    \n# 目標客層\n\n你要幫助的是哪些人\n\n接下來，將目標客層（你要幫助的是哪些人）加到你的個人商業模式圖上。回想一下先前提到的，上述的「顧客」有兩種：一種是那些付費過的，所謂「顧客」有兩種：一種是那些付費買好處的人，另一種是那些不用付費就能獲得好處的人（因為有第一種顧客的資助）。\n\
    \n以個人角度來說，你的顧客或者客戶就包括了那些在公司裡必須仰賴你的協助來完成工作的 人（如果你是自由工作者，可以直接將自己願為公司，所服務的對象就是顧客）。\n\
    \n這包括你的老闆、直屬主管，以及其他直接影響你薪資的那些人。他們 收你的工作、同寮公司支付報酬給你，因此他們形成了一組顧客。\n\n所以，請在目標客層的那個區塊中，寫下你直屬主管的名字。\n\
    \n請再想想，你還要對哪些人報告或負責？把他們的名字或角色也寫在同一個區塊中。\n\n然後回過頭來再想想：在工作上擔任了哪些角色？是否也為組織裡的其他人提供服務？是否將工作交接給同事（以接續完成）？\n\
    \n哪些人在工作上需要仰賴你的協助，或因為你的工作而受惠？這些人也許不是直接給你報酬的人，但是你之所以能持續拿到薪資，取決於你的整體工作表現，也就是你「服務」特定同事項的品質。\n\
    \n比如說，如果你是IT部門的員工，就代表你必須對所謂的「內部顧客」了解得很清楚！在公司裡面，還有其他人或其他部門，是你應該視之為「顧客」的嗎？也許是某個專案領導人或是其他專案成員？如果有的話，請把他們的名字寫下來！\n\
    \n接著，你要考慮的是那些與公司往來的企業，也就那些使用你公司的服務或購買你公司的產品的客戶。你有直接跟他們打交道嗎？即使沒有，你也可以將他們視為你的目標客層。此外，你有跟公司內部任何的關鍵合作夥伴配合過嗎？或許他們也值得列在你的顧客清單上。\n\
    \n最後，想想那些你因工作而間接服務到的處大社群，包括了社區或城市，或是因相同的商務、專業與興趣而聚集的團體，以上這些也可能是你的目標客層。\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_61_0.png)\n\
