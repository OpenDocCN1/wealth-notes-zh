    # 了解自己


    # 人物：程式設計師


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_115_0.png)


    有時候調整工作者與機械這兩者之間的搭配關係，可以出人意料地提升漸意度，就像西恩·巴克斯（Sean Backus）的真實經驗一樣。


    念大學時，巴克斯除了是全職的學生外，每週還以程式設計師的身分工作15到20小時。不論是主修的電腦領域或是兼職的工作，他都有出色的表現；教授欣賞他的專業能力，鼓勵他繼續深造；雇主美商科頓系統（Credence
    Systems）也滿意他的工作成果，邀請他畢業後直接去上班。


    巴克決定去科頓系統工作。他了解也喜歡程式設計，對於這個機會識他，在畢業後就能發揮所長而且興奮不已。


    但令他驚訝的是，這個工作卻讓他筋疲力竭。他以為自己進錯了公司，所以離開到另一家軟體公司做程式設計，但很快地，同樣的挫折感又來了。於是，他又換到第三家公司上班。現在，他又體驗到了類似的感覺。


    至此，巴克斯生氣又絕望。畢業兩年，他就換了三個工作，他開始質疑自己選擇科系入錯行，並要求專業職涯諮商師的協助。對方建議他放下來發個星期先不要去找新的工作機會，而是冷靜下來了解西恩·巴克斯這個
    titres。他同意了。


    職涯諮商師運用面談及評估工具，幫巴克斯認識了他強烈的社交傾向。事實上，他發現自己骨子裡就是個善於<|message|> 交際、很有親和力的人，碰巧天生又具備了自
    然科系與機械方面的能力。念大學時，跟同學和教授的互動滿足了他的社交需求；而兼職的程式設計工作則滿足了他的興趣及收入。然而，當他成為了一名全職員工，整天坐在電腦前只會讓他感到挫折又無力。'
  md: "\n## 克莉絲如何繪製個人的商業模式\n\n## Key Partners\n關鍵合作夥伴\n\n護士版駕駛員\n\n## Key Activities\n\
