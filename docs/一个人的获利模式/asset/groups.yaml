    \n創意\nIdeas\n\n資料\nData\n\n事務\nThings\n\n## 個性與環境\n\n以下的練習，是根據一套著名的生涯評量與諮商方法，協助你了解如何依據自己的個性來選擇工作，以及工作環境是否與個性相合（或衝突）。\n\
    \n美國心理學家約翰·霍蘭德（John L. Holland）的職業選擇理論（參 Making Vocational Choices 一書），數十年來經歷過許多少研究者的測試與驗證。至今世界最廣泛使用的職業興趣（vocational\
    \ interest）資料庫，以及美國勞工部的多種職業分類及相關文獻，都是以他的理論為基礎。\n\n數十年前，霍蘭德就提出了一個今天看起來理所當然的洞見：職業興趣是一種個性的表現。換句話說，職業表達的是一種生活方式、一種環境感，而不單單是指一份工作職業或技能（參\
    \ Manual for the Vocational Preference Inventory 一書）。\n\n這表示人們透過職業選擇來展現他們的個性，正如選擇朋友、嗜好、消遣及學校一樣。同樣的，職業滿足感也決定於工作者個性與工作環境的「適配」程度。（重要提示：這裡的「工作環境」指的是主要工作場所的其他人，而非我們常認為的硬體環境。人們對工作環境的滿意或不滿意，其實大多都來自工作夥伴，而不只是舒適的辦公室或免費咖啡。）\n\
    \n為了更好地解釋選擇是個性的一種表現，霍蘭德確定了六種不同的個性傾向（人格特質型），並強調每個個性都傾向這六種傾向的獨特組合（精確地說，共有 720 種組合），只有過某些傾向會比較明顯顯現。\n\
    \n導展與能力\n分析問題\n創造發想\n開發解決方案\n展開行動\n增長與他合作\n\n科技／軟體\n學習新技術\n個人成長\n探索\n多元\n\n問題\n\
    屬於研究型、社交型、\n藝術型及企業型的組合，\n喜歡與有分析、調查、\n拆解雜題能力的人共事\n\n## 了解自己\n\n## 人物：程式設計師\n\n\
    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_115_0.png)\n\n有時候調整工作者與機械這兩者之間的搭配關係，可以出人意料地提升漸意度，就像西恩·巴克斯（Sean\
    \ Backus）的真實經驗一樣。\n\n念大學時，巴克斯除了是全職的學生外，每週還以程式設計師的身分工作15到20小時。不論是主修的電腦領域或是兼職的工作，他都有出色的表現；教授欣賞他的專業能力，鼓勵他繼續深造；雇主美商科頓系統（Credence\
    \ Systems）也滿意他的工作成果，邀請他畢業後直接去上班。\n\n巴克決定去科頓系統工作。他了解也喜歡程式設計，對於這個機會識他，在畢業後就能發揮所長而且興奮不已。\n\
    \n但令他驚訝的是，這個工作卻讓他筋疲力竭。他以為自己進錯了公司，所以離開到另一家軟體公司做程式設計，但很快地，同樣的挫折感又來了。於是，他又換到第三家公司上班。現在，他又體驗到了類似的感覺。\n\
    \n至此，巴克斯生氣又絕望。畢業兩年，他就換了三個工作，他開始質疑自己選擇科系入錯行，並要求專業職涯諮商師的協助。對方建議他放下來發個星期先不要去找新的工作機會，而是冷靜下來了解西恩·巴克斯這個\
    \ titres。他同意了。\n\n職涯諮商師運用面談及評估工具，幫巴克斯認識了他強烈的社交傾向。事實上，他發現自己骨子裡就是個善於\n交際、很有親和力的人，碰巧天生又具備了自\
    \ 然科系與機械方面的能力。念大學時，跟同學和教授的互動滿足了他的社交需求；而兼職的程式設計工作則滿足了他的興趣及收入。然而，當他成為了一名全職員工，整天坐在電腦前只會讓他感到挫折又無力。\n"
