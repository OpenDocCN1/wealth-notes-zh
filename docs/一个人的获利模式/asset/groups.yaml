    # 品牌或身分地位


    有些公司提供的價值是幫客戶打造尊爵不凡的形象。全球各地都有人願意高價購買路易·威登（Louis Vuitton）的奢侈皮件及其他時尚產品，就 是因為為 LV
    將品牌打造॥成品味高尚、著重以品質的形象。


    # 降低成本


    有些企業可藉著幫其地公司降低成本而增加營收。例如，大部分的公司會發現，與其自行購買並維修電腦伺服器和高端電腦信設備，更划算的做法是外包給第三方遠端伺服器（雲端服務）廠商。


    # 降低風險


    企業型:nil的客戶當然想降低風險也很有意，尤 其是與投資相關的風險。例如 如 IT 市場與顧問公司顧問（Gartner），便藉由銷售研究報告和諮詢服務來幫其他公司項增加科技支出的潛在效益。'
  - '[PAGE 37]


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_37_0.png)


    # 通路


    通路具備以下五項功能：


    +   1. 創造對於產品或服務的關注度。\n2. 幫助潛在顧客評估產品或服務。\n3. 方便且標靶顧客購買。\n4. 傳遞價值主張給目標客群。\n5. 透過售後服務，確保客戶購買之後的滿意度。


    # 典型的通路包括以下幾類：


    +   • 面對面或電話\n• 現場或超市店內服務\n• 實體配送\n• 網路（社群媒體、部落格、電子郵件等）\n• 傳統媒體（電視、收音機、報紙等）'
  - '[PAGE 38]


    # 顧客關係


    組織必須清楚定義目標客屬所偏好的關係維持形式，例如：是不是個別服務？自動化或自助式？單次服務或會員式？


    此外，組織也必須清楚顧客關係的主要目的和策略：是要爭取新顧客？維持既有顧客？還是從現有顧客中獲得更多收益？


    以上不論是哪種策略，都需要與時俱進。以行動通訊產業為例，早期 的電話公司為了開發新顧客，通常採較積極的手段（例如提供免費手 機）。然而，當市場漸趨成熟，他們會轉而將重點移到留住現有客戶，
    並設法提高每個顧客的平均收益。


    還有另一個重點：現在有更多公司（像是亞馬遜、YouTube、Business ModelYou 及 LLC）會跟顧客一起創造產品或服務。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_38_0.png)'
  - '[PAGE 39]


    # 收益流


    組織必須：1) 找出每個且標<|start|>顧客真確意付錢購買的價值；2) 用目標顧客偏好的方式接受付款。


    收益流有兩種類型：1) 由顧客支付的一次性收益；2) 透過產品、服務或售後服務持續收取的經常性贌用。以下是幾個特定類型的收益流：


    # 資產銷售


    這是指顧客購買某項資產品的所有權。例如豐田（Toyota）銷售汽車，顧客購買後，就可任意駕駛、轉賣、拆卸，甚至毀損。


    # 租賃


    這種方式是指顧客付費取得在一個固定期間內，其項特定資產的獨立使用權，例如飯店房間、公寓或是出租汽車。承租人不必負擔所有的全 部成本，而出租者則享有經常性收益。


    # 服務使用費


    這種收益流是透過顧客使用某種服務的「量」而產生的，用越多就付越多。例如，電信公司依據使用時間計費；物流配送公司根據包裝分量收 多。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_39_0.png)'
  - '[PAGE 40]


    費；醫生、律師及其他服務業者則以小時或是流程計費；廣告商（例如 Google）則以點擊數或是曝光率等收取費；保全服務根據值勤時間及特殊行動收取費。


    # 會員費


    這種收益流是銷售某種服務的持續使用權。例如，雜誌、健身房、線上遊戲通常會採會員訂閱方式，讓消費者付費取得在特定期間內持續使用某些服務的權利。


    # 授權


    願<|start|>支付授權金給暫時財產產權的持有者，以取得使用特定知識或技術的許可。


    # 仲介（媒合）費


    例如工二一世紀等下廣告公司，靠著媒合買賣雙方求職媒取仲介費，而線上人力銀行Monster.com則藉由媒合雇主和求職者來收取費。'
  - '[PAGE 41]


    # 關鍵資源


    關鍵資源有以下四種類型：


    # 人力資源


    每家公司行號都需要人，但有些商業模式特別<|message|> 依賴人力資源。例如，至球著名醫療機構梅約診所（Mayo Clinic），就需要許多具備尖端醫學知識的醫生和研究人員，而羅氏（Roche）等製藥廠則需要許多一流的科學家和專精的銷售人丁。


    # 實體資源


    土地、建築、機器設備和交通工具，在許多商業模式中都占有重要的一席之地。以網路書店亞馬遜（Amazon.com）來說，會需要一個安裝上大 型物流輸送帶的龐大倉儲系統，以及其他許多價格不菲的裝置設備。


    # 智慧資源


    智慧資源是無形的資產，包括品牌、自行開發的工法、系統、軟體、專利或版權。以擁有許多家連鎖店的機油更換公司捷羚來說，可授權的品牌以及獨有的顧客服務流程，就是該公司的智慧資源；至於通訊技術研發商高通（Qualcomm）的商業模式，則植基於可帶來巨額授權費的設計專利。


    # 財務資源


    財務資源包括現金、信貸額度或是財務擔保。電信設備製造商愛立信（Ericsson）有時會向銀行借款資金，再將部分資金融資給客戶來採購其設備，以確保這些客戶的採購對象是愛立信，而非其他競爭者。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_41_0.png)


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_41_1.png)'
  - '[PAGE 42]


    # 關鍵活動


    一個組織有效地推展其商業模式，這是最重要的環節。


    生產：包括產品的製造、設計／研發／送交貨服務，以及解決問題。對服務業來說，「生產」指的是從準備至提供服務的過程，這是因為服務性質的產品（例如剪髮）是在提交到客戶手中時就被消費掉了。


    銷售：指的是促銷、廣告、以及向潛在消費者推廣產品或服務的價值。其專屬任務可能包括電話銷售、擬定並執行廣告或促銷活動，以及教育或訓練。


    支援：指的是幫助整個組織順利運作、但與生產或銷售沒有直接相關的活動。例如，招募員工、執行會計帳務或其他行政工作等。


    在談到我們所從事的「工作」時，我們想到的往往是在任務（關鍵活動），而大小是它們所產生的價值。但顧客在選擇一家公司時，通常更在意的是公司能夠提供哪些價值，而不是否他們做了什麼事。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_42_0.png)


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_42_1.png)'
  - '[PAGE 43]


    # 關鍵合作夥伴


    建立一個合作夥伴網絡，有助於商業模式更有效運作。


    光憑一家公司不可能完全掌握每一種資源或自行履行各項任務，尤其有些工作需要另高層的設備或特殊的專業能力。這就是為什麼 Paychex 這樣 的公司會存在，在美國，大部分的公司會將放薪資等事項外包給這類
    公司；而在台灣，常見的外包事項則是清潔及保全等非核心功能。


    然而，合作夥伴也可能超越「買賣往來」的雙向關係。例如，婚紗公司、花店、專業攝影師也許能約分分享顧客名單、共同舉辦促銷活動，好讓三 方都能受惠。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_43_0.png)'
  - '[PAGE 44]


    # 成本結構


    取得關鍵資源、執行關鍵活動、與關鍵夥伴合作，都會產生成本。


    創造並饋價值、維持顧客關係、產生收益，全部需要成本，而清箋界定關鍵資源、關鍵活動及關鍵合作夥伴之後，成本就能大致估算出來。


    「規模化」（Scalability）是一個關於成本效益和商業模式的重要概念。能夠規模化，表示一家企業可以有效處理擴增的需求，亦即能夠同時服務更多顧客卻仍須維持性品質。如果以財務角度來看，能夠規模化，意味著每個服務一個顧客的額外成本是下降的，而非上升或不變，此時企業就能有規模經濟（Economy
    of Scale）。


    軟體公司就是規模化的一個好例子。一旦研發完成，程式就能夠以低廉的成本複製及配銷。於是，為一個下載載模式的新增顧客服務，所產生的費用幾乎是零。


    相反的，顧問公司和專人服務的企業則很難享有規模經濟。這是因為每多服務客戶一小時，就會得多消耗服務者一個小時的時間，亦即每多服務一個客戶所增加的額外成本是固定的，而非下降的。單從財務角度來看，能夠規模化的商業模式更可能吸引投資者。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_44_0.png)'
