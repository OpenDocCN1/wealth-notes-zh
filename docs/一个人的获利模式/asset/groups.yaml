    # 團隊領導人


    人物：

    納特·林利是電子工程師，在一家全球定位服務（GPS）軟體開發商負責帶領一群軟體工程師。他對這個工作逐漸喪失熱情，卻難以找到到底是哪裡出了問題。他向商業教練布魯斯·哈森（Bruce
    Hazen）尋求協助，他建議納特試試倒推法：先想像他理想的未來職涯是什麼樣子，再往回推演到現在。


    一開始，哈森要納特寫下四個簡短的電影情節，每個情節都要描述他自己和另外兩位專業人員如何愉快地工作，這就是他心目中理想的工作。


    這些情節都顯示出一個共通性：納特始終都在扮演建立及領導團隊的角色。更進一步分析則顯示，雖然每個情境的背景都不一樣，但納特在描述自己建立團隊的細節，這比描述每個產業環境都要詳細得多。


    接著，哈森和納特一起「解構」了他現在和過去的工作，結果發現完全跟納特所想像的電影情境相契合：納特對於組織及管理團隊的嗜好一直都沒變。他喜歡帶領人，幫助他們改變對工作的僵化看法，並為他們去除過程中所遇到的障礙。


    在倒推個人商業模式一個月後，納特進入了奇異公司（GE），這是一家以卓越管理與培育領導者聞名的大企業。


