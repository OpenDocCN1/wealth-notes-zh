    \  |  |  |  |\n| 10 |  |  |  |  |  |  |  |  |  |  |\n\n## 她希望的自我剖析\n\n最令我滿足的，是在成效導向的數據圈中，運用自己的創意與分析能力（邏輯推理能力），針對不同的問題之發想並執行解決方案。我曾經在一些專案中，與一群擁有共同回饋、協力工作的夥伴共同學習，就算與顧客一起務力來解決他們的問題，這些都是成為充實了成就感。最終，也是這些成績就啟發使我更加多元化發展及持續鏡學習——不僅在技能方面，也包括個人的自我成長。\n\
