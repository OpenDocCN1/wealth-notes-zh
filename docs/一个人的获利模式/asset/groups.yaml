    # 人物：電台主持人


    當馬丁·鮑休斯加入「商業新聞電台」的製作部門時，他很難想像有一天自己會成為廣播界的一號人物。但幾個月後，他開始思考：「為什麼我不能也擔任主持人？」於是他設定了這個目標。


    在成為廣播主持人的路上，馬丁努力開發自己的聲音技巧、發音及訪談風格。直到最近，他考慮個人的商業模式時，還把這些技能及其他外顯特徵當成他的關鍵資源。


    但電台主持人的薪資不高，馬丁開始體認到這些關鍵資源的價值有限。隨著日子一天天過去，同事及聽眾的回饋都顯示，他的訪談及評論經驗已經為他打造了一套全新的技能，包括掌握、營銷趨勢的能力，以及將這些趨勢快速、清晰並充滿渲染力地傳達給聽眾的特殊技巧。


    這些新技能為馬丁帶來全新的性質的工作，比如在商業論壇增加或其他活動引導討論或擔任引言者。現在的他，有時出場合一次就能賺到相當電台主持人一個月的薪水。


    「絕對不要把關鍵資源的定義，局限在成就你過去的那些因素裡。」馬丁說，「你個人商業模式的運作，永遠都是現在進行式。」


