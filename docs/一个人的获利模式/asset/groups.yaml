    # 艾塞莉的所得


    艾塞莉（Emily）是大陆鞋业公司的供应链分析师，月薪 4000 美元。付完每个月帐单后，  她剩下 450 美元可以存在投资帐户裡。 请問，有誰認為每個個月存
    450 美元算厲害 的？請舉手！


    雖然 450 美元看起來不多，但用商業術語 來說，那可是超過 11% 的利润（450 除以 4000）。很少公司可能保有收入的 11% 做為利润。信不信由你，从百分比来看，艾塞莉的
    利润率比世界上大多数的公司都高！


    事實上，「利润」二字往往被誤解了。很多人 印象中所謂的利润，不是二手手指專業務員把 一部剛買的高價質給購車新手，就是銀行理專 鼓勵不懂得投資的客戶買高風險的連動債券。


    # 利润与盈余


    利润（profit），简单说是收入减去支出费 用后的净额。以艾塞莉来说，她的利润就是 努力工作、诚实缴税、扣除所有生活开销之 后的金额。她之所以会有利润，是因为她最
    責的服务顾客。對她而言，有利润是重要 的，否则要如何存退休基金，或准备足够的 錢供孩子上大学？


    经营一家公司也一样，如果不能创造利润， 試问要如何有钱投资新设备或雇用新员工？


    如果创造的收入刚好刚好用来支付所有的费用， 没有剩下分红（这裡利润為零的情况，商 业術語稱為「损益平衡」），对個人或組織而 言，都只能図個勉強苟延残喘而已。


    雖然「利润」和「盈余」指的是一件事，不 過我们認為為「盈余」比較精確。絕大多数 的企业就跟艾塞莉一样，努力经营、专注於 創造盈余。當公司有盈余，me会拿來配發
    給股東、再投资或是還債務。


    拿個人與大企業相比，你會覺得不恰當嗎？ 放心，你不是唯一這麽想的人！即使在資本 主義的世界裡，很多人還是認為，一個人 的職業生涯和工作目标，跟一般企業的商業
    行為是截然不同的。


    某種意義來說，的确如此，人和企業確實不 同。然而，員工、承包商、約聘人員，其實 都和企業一家樣，都是在「銷售」服務給客 戶，用商業術語來思考这些工作關系，其實
    大有用處。


    本書的核心觀點，就是把我们自己想成一 人 公司：一家同時為所属組織及自己創造盈餘 的公司。


    接下来，議我们來討論關於一個人的資金流 入與流出。只要懂得一點簡單的數學，就能 打开你的限制。


    # 損益表


    損益表從上至下共有三個類別：(1)收進來的錢、(2)付出去的錢及(3)剩下的錢。用商業術語來說，這三項目分別叫做銷售額、費用，以及盈餘。


    簡單吧？

    一般來說，企業每年至少會編製一次損益表，用來：


    +   - 描述獲利績效

    - 尋找（有無）過高的成本

    - 分析銷售額在不同時間的起落


    當然，企業的損益表比起簽署的個人收支要複雜多了。不過，這只是因為公司有更多的費用項目、稅賦等林林總總的開支，而且這些內容在我們建構個人商業模式時都都可以很開心地忽略。不管是公司或個人，基本公式其實是一樣的，就是：


    銷售營額（營收）- 費用 = 盈餘


    參考右頁「公司如何運用資金」，你就會了解損益表的思考模式適用於任何組織，無論是否營利、非營利或政府都一樣。


    # 三.盈餘


    一 費用 信貸銷售額（營收）（言產業商）

    （一說法）

    收進來的錢

    一付出去的錢

    二剩下的錢


