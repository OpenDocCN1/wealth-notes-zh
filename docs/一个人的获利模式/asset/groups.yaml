    # 運用個人商業模式的其他方式


    關於個人的終極隱私與創造力


    設計與個人的商業模式圖


    至全球的商學院研究課程，很多人都見識過使

    用商業模式圖來教授策略、創業及設計。我

    們相信商業模式圖也適合用在大大學部，讓更

    多人學習商業的基本原理，因為商業模式圖

    是一種簡明易懂的方式，可用來了解創業的

    各項基本元素。同樣的，我們也相信個人商

    業模式圖是追求個人生涯的強大工具，連中

    學生都能夠運用在個人生涯及／或基本的財務

    規劃上面。


    關於個人的終點


    我們的目標的很多成員，已經發現個人商業模

    式是非常有用的教練工具。本書中的很多案

    例就是取自他們的真實例子。


    關於個人的終點


    本書第96頁提及的個人商業模式圖，是用來

    描述非工作方面的角色，比如另一半、朋友

    及父母。論壇有許多成員也成功地把商業模

    式圖運用在這方面，專業的諮商師也可以透

    過繪製和檢驗個人的商業模式圖，發展出一

    套供客戶使用的練習來做為諮商參考。


    關於個人的終點


    對負責年度績效管理的專案主管而言，個人

    商業模式圖可以提供一個架構，用以檢視員

    工如何為組織提供附加價值。受到啟發的企

    業甚至可以延伸個人商業模式圖的用途，拿

    來為員工的私人生活創造出更多價值。'
