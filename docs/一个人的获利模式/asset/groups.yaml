    # 商業模式圖範例（以大型免費分類廣告網站Craigslist為例）'
  - '[PAGE 50]


    # 顧客關係


    Craigslist提供網站分類廣告服務，幫助人 們尋找工作、住所、交換或買賣商品，此外 與他會員交流。這家公司在70個國家擁有 700個據點，每個月登錄在網站上的工作機會超過一百萬個。即使Craigslist的組織文化
    不像大企業，根據產業分析師的說法，它 仍是全世界平均員工獲利最高的公司之一： 30名員工每年的產值超過1億美元。


    用戶創造、編輯及發布需求時，使用的是全 自動化流程，不需Craigslist工員介入。員工 主要似類用戶自發性的調整風氣，以及 鑑別許可將活動。Craigslist所專心致力的是將
    現有用戶的使用經驗最佳化，而不是吸引新 用戶。


    個工程師，其實並不會有什麼立即的損失； 但如果它的網頁當掉一天，那就會絕對是個災 難！其過程來説，這也適用於Craigslist。 除了開發及維護平台，Craigslist的員工還必
    須花時間處理顧客、垃圾郵件以及其他非法 用戶的干擾。


    # 目標客層


    Craigslist的大部分客戶都是不用付費的，但 有些城市的雇主或房東需要支付上架費。這 些付費客戶資助了免費付費客戶。


    # 價值主張


    做為一個線上服務提供者，Craigslist提供的 價值是促進會員之間在離線後互相交流；另 一個價值則是提供免費的分類廣告，幾乎涵 蓋了顧客所能想到的每種產品或服務。這些
    價值吸引了大批的忠實顧客群，凝聚Craigslist 能夠提供第三個價值：對雇主和房東而言， 高性價比（高CP值）的僱才和租賃廣告。


    # 關鍵資源


    Craigslist最重要的資源就是它的「平台」，這 是一個自動化的方法（或引擎），讓目標客 層之間能夠產生交易。Craigslist創辦人葛瑞 格·紐馬克（Craig
    Newmark）的聲望、公眾 服務理念，以及該網站的經理人和員工，也 都是關鍵資源。（按，葛瑞格·紐馬克是程 式設計師出身的網路創業家，活躍於許多公 益慈善事務團體）


    # 收益流


    只有雇主和房東（左頁圖表的第三目標顧客 群）能為Craigslist帶來收益。


    # 關鍵合作夥伴


    免付費用戶是Craigslist最重要夥伴，他們 努力地維持社群成員之間的話誠信和禮貌， 以確保平台運作順暢。


    # 成本結構


    由於不是上市公司，Craigslist沒有義務揭露 它的財務數字，但它的員工只有30名，相較 於臉書、推特（Twitter）或其他他線上 公司，成本支出相對極低。重要的是經常性支
    出，包括員工薪資、伺服器和通訊設備費用 以及辦公室租賃費用。依其在業界的知名度 及眾多行專樞推如，這家公司在法律和其 他專業費用的支出也談不小。專實上，有
    些觀察家認為這些費用加總起來，可能遠超 過其他成本的總合。


    # 關鍵活動


    開發並維護網站平台是Craigslist最重要的活 動。這應該好了，假設Google至少了100


    # 通路


    所有服務都只有在網路上進行。'
