    正如馬科斯也表贊同的（我們在第1章也討論過），商業模式創新沒有停止的一天，無論是對於組織或個人來說都如此。某個商業模式也許能用上幾年，但總有一天會被迫非改變不可。你的個人商業模式也會一所演化，就算不是因為時移境遷，也會因為你個人的經驗成長而改變。當你需要重新編製新的商業模式時間時，我們希望這本書的觀念能再次啟發及鼓舞你。'
