    # 關鍵資源


    # 你是誰 & 你擁有什麼


    如同一前一述所述，企業組織能夠吸引大量的 人力、財務等實體或無形的關鍵資源，例如人才、資金、設備、不動產及智慧財產等。相較之下，個人的資源頗得「搭據」，因為我們大都只能靠自己。一般說來，個人的關鍵資源包括了「你是誰」，這指的是：1)
    你的興趣；2) 你的才能和技能；3) 你的性格特質；以及 4) 你所擁有的知識、經驗、人脈，還有其他形無形的資源和資產。


    你的興趣，也就是最能讓你感到振奮的事，將會是你最珍貴的資源，因為這是生活滿足感的主要驅動力。將你最感興趣的事列在「關鍵資源」的區塊裡。


    其次，是才智和技能。「才智」(ability) 是天生的，與生俱來的能力：那些你做起來輕鬆自然、毫不費力的事，例如空間推理、小組導引、機械才能等。將這些天賦才能具體描述、放在關鍵資源的區塊裡。另一方面，「技能」(skill)
    是指必須經由學習或培養而來的能力：那些你必須不斷練習或學習才會漸入佳境的事，例如護理、財務分析、建築工程、程式設計等，將這些技能也列在關鍵資源的區塊中。


    接著是關於人格特質。想象著，你的人格特質是什麼？請逐一寫下來，例如高 EQ、勤奮、冷靜、自信、體貼、活潑外向、精力充沛、注意細節等等。


    當然，關於「你是誰」，除了上述這些，還有價值觀、理解力、幽默感、教育、目標、企圖心、意志力等等。但在此，我們先不細分，而大抵用這三個類別來涵括，例如，理解力和意志力可以先歸入「才能」、教育納入「技能」，而價值觀和幽默感則可歸類為「人格特質」。


    接著，讓我們來列出「你擁有什麼」，這包括有形和無形的資產。比如說，你跟許多專業人士都往來，可以寫下「人脈廣」；同樣地，你也可以列出深厚的產業經驗、專業證照、特定領域的意見領袖，或任何你親身參與的出版品或智慧財產。


    最後，寫下你實際擁有的有形資產（對工作有實質或潛在的效益），例如車輛、工具、專業服務、資金或其他能投資於職業生涯的實質資產。


