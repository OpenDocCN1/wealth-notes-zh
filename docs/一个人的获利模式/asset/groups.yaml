    ## 商業模式立心維


    ## 為什麼


    ## 是幫你適應世界


    ## 變動的


    ## 最好方法


    讓我們來個大膽猜測：

    你正在看這本書，因為。。。

    你有點想轉換職涯跑道了。


    不是只有你這樣。根據2010年萬寶菲（Manpower Group）就業發展調查，每六個成年人裡頭，就有五個人正在考慮換工作。此外，本書來自43個國家的會員們也紛紛回應，這是個全球性的現象。


    我們必須承認，談到職涯轉換，大部分的人都缺乏有系統的思考方式。面對這個複雜而混亂的議題，我們需要一個簡單有力的方法，既可以跟得上時代，又能夠吻合我們個人需求。


    歡迎來到「個人的獲利模式」：這是一個能幫你描繪、分析及重建成功職涯的好架構。


    如果你置疑的，你很可能早就聽過「獲利模式」（business model，下稱「商業模式」）這四個字，不過，那麼到底是什麼啊？


    在最根本的經濟層次上，商業模式就是能否讓一個組織獲得財務支撐以持續運作的邏輯*。


    如同字面解釋，這個詞彙原本是用在一般企業。不過，在我們的設定裡，希望你能先將自己視為「一人公司」，然後我們會提供你一個方法，將你定義並修正「個人的商業模式」。換句話說，就是充分運用你的長處和天賦，讓你在無論是個人或是職業生涯上都有所成長。


    維持競爭力，就必須改變、甚至創造出新的商業模式。


    結果就是，這些新的商業模式帶來了破壞也引發改變，導致某些人失去業，但同時也為某些人創造出新的機會。


    讓我們來舉些例子說明。


    ## 變動的時代，變動的商業模式


    當前就業市場的饑動不安，大都是由非個人所能掌控的原因所驅動，包括經濟衰退、人人口結構改變、日新月異的全球競爭以及環境議題等等。


    絕大部分的企業也無力掌控這些改變。然而，這些改變確實影響了公司所使用的商業模式，因為他們無法改變所處的環境，為了維持競爭力，就必須改變、甚至創造出新的商業模式。


    讓我們來舉些例子說明。


    還記得百視達（Blockbuster Video）吧？這家公司在網飛（Netflix）和紅盒（Redbox）出現之後宣告破產了，因為後面這兩間公司透過網路、自動相片機、電子郵件，改變了電影和電玩的配送模式，比實體店面提供更快的服務。


    夜的在電腦或遊戲機上收看電視節目，而且沒有任何廣告干擾（感謝網路）！試想這對傳統電視產業的意義，他們廣告時段給業主以獲取收益的商業模式早已行之有年：1）廣告會在特定日子、特定時段被等插入節目中，放送給大量的觀眾；2）收看電視的觀眾無法跳過廣告。


    網路改變了其它的產業的商業模式，例如如音樂、廣告、零售業和出版業（比如說沒有有線網路，就不會有這本書）。


    另外一個例子，是高階獵頭公司。傳統上，獵頭公司主要靠著全隊、技巧嫻熟的員工每週打數百通的電話、飛越不同的國家跟潛在候選人吃飯；但如今招聘行業與以往大不相同。一更多情形是，那些在
    chamber 網頁的非職工作者取代了全職員工。


    一個新商業模式的出現，也可能影響其他的產業。


    例如，超過二千萬的Netflix用戶可以不分日


    ## 創新的商業模式


    正 在改變全世界的職場， 無論是營利或非營利組織 都同樣受到影響。 企業為了要生存下來， 必須持續評估 並改變他們的商業模式。


    ## 人，也必須改變


    雖然人跟公司不同，但兩者卻有個重大的共通點：就像大部分公司一樣，你也被許多自已無法掌控的環境、經濟因素所影響。


    在這種情況下，你要如何維持成功和成就感呢？首先，你必須判斷出對自己有效的運作方式，然後再因應環境的變動而不斷調整自己的方式。


    從這本書中，你將會學到如何清楚描繪並思考自己的商業模式，好讓你能夠達到上述的目的。


    能夠理解並描繪出個人系統的商業模式，將有助於你了解，在這個動盪的經濟環境下，要如何才能獲致成功。不可諱言的，那些在營企業整體成功（並且知道如何達成）的人是最有價值的員工，也最有可能得到較好的職位。


    一旦你知道如何將商業模式運用到職場，並且找到你在這個模式中的定位，你就能夠使用同樣有力的思考方式去定義、強化及發展你的職業生涯。從第3章開始，你會學著去定義你個人的商業模式，隨著職涯往前邁進，你將能運用這個策略來調整自己，更加適應這個變動的環境。


    *參見亞歷山大·奧斯瓦爾德與伊夫·比組赫合著的《獲利世代：自己動手，畫出你的商業模式》（Alexander Osterwalder & Yves Pigneur,
    Business Model Generation [Hoboken, NJ: John Wiley & Sons, 2010] 中文版：早安財經文化）。


    閱讀《一個人的獲利模式》

    會帶給你一個顯著的優勢，

    因為大部分的上班族

    只會定義、記錄組織的實務案例。

    很少人會正式地去定義或記錄組織的商業模式。

    至於能夠將商業模式思維套用在個生意涯上的，

    那更是屈指可數了。


    ## 第2章

    商業模式圖

    The Business Model Canvas


    我們將「商業模式」定義為：

    讓一個組織獲得財務支持

    以持續運作的邏輯，

    簡單來說，

    就是企業的「謀生」方式。


    我們可以將商業模式guard為描述企業如何營運的藍圖。就?

    建築師在建

    造房子前，必須準備好工程藍圖一樣，創業者也必須設計一套商業模

    式，做為企業創建的指導方針。同樣的，經理人也必須能夠描繪出商

    業模式，以便將組織現有的經營方式具體化。


    要理解現行的商業模式，首先必須提出兩個問題：


    +   1. 你的顧客是誰？

    2. 你的顧客原本需要做哪些工作？


    為了闡述這個概念，讓我們來看看下面三個例子。


    第一個例子是捷飛輪胎（Jiffy Lube），這是北美最大的機油更換公司，提供快速換油服務。

    現在的人很少會親自更換引擎機油，因為大部份的人不但缺乏相關知識與工具，也想省麻煩，不想自己搞得一團糟亂（更別提後續還有繁瑣的廢油回收處理了）。只要花個25或30美元，捷飛輪胎便會提供專業級的換機油服務。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_25_0.png)


    第二個例子是「社群網站產生器」線上平台 Ning，這家公司讓顧客能簡單且相對便宜地 製作並管理客製化的社群網站。很少公司（或個人）有足夠的資本或技術，去認知、經
    營及管理一個如同臉書（Facebook）一樣成功 能齊全的社群網路，而 Ning 提供了一個簡 易又貨值得替代方案：能夠多層次編輯 修正其中的一個社群網站模板。


    最後是微時達（Vesta），這家虛擬支付服務商 每天要代管數十萬名客戶完成電子交易。要 處理如此大量的交易也非常複雜，而且必須具有 最先進的保全和反詐騙措施——這兩個系統
    都很難在一間一般公司內自行發展和維護。


    那麼，這三家公司有什麼共同之處？ 它們都因將顧客完成工作而獲得報酬：


    • 替飛絡替車主完成了重要的維修工作，也 保持了他們車庫和衣服的整潔。 • Ning 的寄戶是那些需要推出售出及宣傳某個理 念的人，Ning 幫他們打造了一個社群，成
    本低廉且不需要雇用技術專家。 • 儘時達協助企業專注在本身專業，卻須在 收到貨款這項種種與本業無關的事情上多費時 開和精神。


    聽起來很簡單，對吧？ 但是，不同於這三個案例，在某些產業裡要 界定「顧客」的「工作」這兩者，卻是極具挑 戰性的事，例如教育、健康照護、政府、金 融、科技和法律等。


    學習「商業模式思維」的重要性之一，就 是幫你辨識、描述「客戶」和「工作」。更精 確來說，你會從中學到如何協助客戶去完成 他們必須做的工工作，並找出能賺更多錢及獲
    取更多成就感的辦法。


    ## 每個組織都需要有商業模式


    既然商業模式是指一個組織獲得財務支撐以 持續運作的邏輯，那是否表示只有營利事業 才需要商業模式？ 並非如此。 每個事業都有它的商業模式。 這是因為幾乎每個現行替代組織、非論是否營利專
    業、非營利事業或政府機關，都需要錢才能 執行任務。 每個事業都有它的商業模式。 這是因為幾乎每個現行替代組織、非論是否營利專 業、非營利事業或政府機關，都需要錢才能
    執行任務。


    比方說，假設你現在正是「紐約路跑協會」 （NYRR）工作。這是個推廣社區健康概念 的非營利組織，專辦路跑、路跑相關課程、 課程、賽前訓練以及賽會等活動。然面，即
    使它是非營利單位，還必須： • 支付員工薪水 • 購置道路使用許可，支付水電、法務、維 修和其他費用 • 購買活動所需設施，例如計時系統、 背號、飲料，以及完整紀念T恤和獎牌
    • 設立準備金以供未來擴展服務之用


    即使這個協會的主要動機和目標並不是賺 錢，而是服務那些想要保持健康體態的社區 「客戶」，依然需要資金來執行任務。 因此，就像許多其他企業一樣，紐約路跑也 必須因爲將顧客完成工作而獲得報酬。
    誠我們來看套用兩個問題，看看它的商業模式 是什麼。


    ## 顧客是誰？


    紐約路跑協會的主要客戶是跑者，以及其他想要保持健康和藉比較找到同好夥伴的人。


    他們的會員分成兩種，一種是年度會員——付費加入團體，並獲得某些優惠；另一種是非年度會員——只要費參加某些特定的活動和路跑。


    ## 顧客原本需要做哪些工作？


    協會主要是紐約地區舉辦路跑相關的活動，因此，該協會是一個顧客付錢購買服務的非營利單位。


    那麼，對於提供免費服務給客戶的那些組織呢？他們也同樣需要一套商業模式嗎？


    答案：是的。


    試想有個非營利組織，我們姑且稱之為「孤兒看護」，這是一個為孤兒提供住所、食物和教育的慈善機構。如同紐約路跑協會，「孤兒看護」也需要資金來執行及推動它的工作，例如：


    +   • 購買食物、衣服、書籍和各種必需品

    • 支付員工薪水

    • 租用宿舍、學校設施，以及支付水電、維修、法規和其他費用

    • 設立準備金以供未來擴展服務之用


    讓我們再回到商業模式的那兩個問題，在「孤兒看護」這個案例中，答案稍有不同。


    ## 顧客是誰？


    「孤兒看護」的客戶有兩種：1) 孩子們，他們是實質上的受惠者；2) 捐贈者，以及出錢購買孩子們手工藝品的支持者，這些人讓「孤兒看護」得以完成它的工作。


    ## 顧客原本需要做哪些工作？


    「孤兒看護」有兩種不同的工作：1) 照顧孤兒；2) 提供更多通路，讓大型慈善機構及個人捐贈者都能實現他們的善意和愛心，透過各個不同的「支付」方式金援「孤兒看護」，例如儲物、獎學金、捐款、購買產品等等。


    這裡有一個關鍵點：對任何組織來說，提供免費服務給某一顧客群，勢必會有另一個組織顧客出錢補貼那些未付費的顧客。


    我們可以看到，就跟任何營利事業一樣，商業模式的兩個命題同樣也適用於非營利的「孤兒看護」。


    ## 殘酷的現實


    那麼，當一「孤兒看護」不再收到捐贈和補助助，會發生什麼事？


    這個組織將會無法完成它的使命。即便「孤兒看護」全體員工都同意在不支薪的狀況下繼續工作，這個「志業」也將會因為無法支付其他必要開銷而被迫關閉。


    在現代經濟中，幾乎所有企業（包括政府）在內）都面臨了一個殘酷的現實：當資金燒完，遊戲也就結束了。


    不同的企業有不同的目的和願景，但所有企業都必須服務「獲得財務支援以持續運作」的邏輯。因此為了生存壯壯，必須具備一個可行的商業模式。


    至於如何定義「可行」呢？答案很簡單：資金流入必須大於（或至少等於）支出。


    你已經知道 了商業模式的基本原則

    顧客和資金如何支援企業的存續。

    然而，商業模式不僅僅牽涉到顧客和資金而已。

