    # 貼上便利貼


    # 描述你公司的

    九個要素


    | Key Partners 關鍵合作夥伴 | Key Activities 關鍵活動 | Key Resources 關鍵資源 | Value Provided
    價值主張 | Customer Relationships 顧客關係 | Channels 通路 | Customers 目標顧客 | Revenue 收益流
