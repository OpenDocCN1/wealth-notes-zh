    # 姓名：安娜貝·史林格蘭醫生 (Dr. Annabelle Slingerland)


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_58_0.png)


    # 59


    | 關鍵研究：關鍵資源 | 人物：醫生 | 原文：你，就是資源 |


    史林格蘭醫生（Dr. Annabelle Slingerland）專攻 affili 兒糖尿病的研究與治療，她發現很多小病患經常被灌輸「外面很危險」「很多事情你不!
    呢?」等等錯誤觀念。為了提倡她的理念，她發起了一場糖尿病兒童馬拉松賽，並取名為「孩子圈」(Kids Chain)。


    不幸的是，就在馬拉松賽前不久，意外發生了：史林格蘭醫生出了嚴重車禍。雖然馬拉松賽如期地成功舉行，並引起政府、企業與媒體的高度關注，但史林格蘭醫生卻再也無法執業了，未來的日子，怎麼辦？


    後來，她發現企業與媒體似乎仍然持續關注「孩子圈」的後續發展。「當初發起這活動時我沒想太多，她回憶：「我甚至一度想放棄這活動，但「孩子圈」沒有放棄我。」


    就在這時，有位同事教她利用「商業模式圖」，設計了一個支援「孩子圈」的非營利組織。當她寫到「關鍵資源」這一欄時，史林格蘭醫生頓時鬆然開朗。「我必須把自己視為這個非營利組織的重要的資源，然後後這個組織應該為我的投入而支付我薪水，她說：「我過去從來沒有這樣想過。」


    如今，史林格蘭醫生是糖尿病非營利組織「孩子圈」的主門主管。

