    你的顧客期待你建立並維持的是哪種類關係？


    你跟顧客溝通是用他們偏好的方式，還是你自己偏好的方式？ 考慮增加、刪減或加強某些溝通方式。


    對你來說，顧客關係的主要目標是維持舊顧客或吸收新顧客？ 如果主要目標是維持，那應該你的關鍵活動是否包括衡量顧客滿足度（倘若滿足度低，請參考價值主張的診斷問題）？如果主要目標在吸收新顧客，你是否需要增加一項與業務或行銷相關的關鍵活動？


    建立或加入使用者社群，能改善你與顧客之間的溝通嗎？ 你能否與顧客一起創造商品或服務？


    你的顧客群能透過使用社群互相幫忙嗎？或者你能讓顧客關係 你能自動化到某些程度（參見第38頁透過相關關鍵說嗎）？ 考慮跟你的顧客一起修改或創造全新的價值主張。


    # 問題


    誰是你的關鍵合作夥伴？


    如果你目前沒有關鍵合作夥伴，是否該考慮找一個？


    # 解決問題的起點


    你的關鍵合作夥伴能否替你負責一項關鍵活動，或者反之亦然？


    你能否透過與關鍵合作夥伴的策略關係來降低成本？


    你能否經由與關鍵合作夥伴的結盟來修改或創造共同的價值主張？


    你能否從關鍵合作夥伴裡取得成本更低、品質／效能更佳的關鍵資源，而不是從內部尋找？


    能否把一位同僚或某人轉換成或重新定位為關鍵合作夥伴？


    反之，你是否需要刪除一位既有的關鍵合作夥伴？


    | 收入好處問題 | 解決問題的起點 |

    |---|---|

    | 收入與好處是靠成功提供價值給顧客而產生的，你的收入足夠嗎？ | 若否，可能需要增加行銷活動來改變或更新贈禮呢。顧客對價值主張的解讀和你一樣嗎？若是，可以考慮提高價格降低成本；若否，則請回頭審視182頁的價值主張診斷問題。
    |

    | 你是否因低估你的價值主張而接受低薪的收入？ | 檢查你自己或顧客是否把價值主張看成是關鍵活動，或將需要完成的工作有所誤解？顧客真正確實付出了代價要你幫他完成的是什麼工作？好好想想顧客和價值主張的診斷問題，看看是否有機會提升與價值主張相對等的收入。
