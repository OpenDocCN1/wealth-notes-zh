    \n重新審視你的人生方向，\n並好好思考如何讓你的人生且目標和職業抱負能夠更協調一致。\n\n## 第四章\n認識自己\nWho Are You?\n\n\
    ## 你是誰？你能幫助誰？\n\n## 人物：\n遛狗師\n\n商業攝影師安卓雅·威蔓（Andrea Wellman）被資遣後，試著讓自己不要慌張，她沒有第一時間就急著找工作、沒有去找兼差，也沒有跟家人借錢。相反的，她趁著被開除之後的空檔，去進行一件她耽擱了很久的事：與自己共處。\
    \ 她承認，她心裡也知道粗粗粗略從業界的角度來說，多賺一點錢，但此時的她更想讓自己想清楚，這輩子要做什麼。「在丟掉工作之前，我就好像一部設定自動駕駛的車子，」她說：「但是現在，我覺得是拿回人生控制權的時候了。」\
    \ 她非常喜歡兩件事：跑步與狗。從小她就是個汪星人，一路走來都有狗狗作伴，後來迷上跑步，從短跑到長跑都愛。事實上，就在被開除的幾個月前，她開始跟愛犬Molly一起去跑步。有時候，她還會順道帶著鄰居的狗兒一起跑。\
    \ 沒有工作之後的那段期間，她與狗兒們常常去跑步，而且也因為不上班後時問變多了，她開始幫朋友遛狗。「遛狗讓我感到平靜，」她說：「不，不只平靜，還有快樂，跟牠們一起跑步，我非常開心。」\
    \ 有一天，她翻閱運動雜誌《跑者世界》（Runners’ World），讀到一則轉換人生跑道的故事。「芝加哥有位老兄，至職獸家長遛狗，」她說：「他每天的工作竟然只是遛狗！」剛開始，她不是很相信光是幫人家遛狗就能養活自己，但進了進一步了解後證明：真的可行！他真的是\
    \ 「一個陪狗狗跑步的全職工作者。\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_81_0.png)\n\n於是，她立刻打電話給朋友，告訴朋友們芝加哥有人專門幫人家遛狗，如果她也做這一行，大家是否願意付錢給她？沒想到的，大家都願意！「她們告訴我，自從我幫大家帶狗去跑步之後，他們都發現狗寶貝們有了很棒的改變。他們認為為跑步有助於狗寶貝們的成長，因此都願意付費給我。」\n\
    \n安卓雅大受鼓舞。\n\n剛開始，她只是把這筆收入當作短期應急而已，沒想太多。但意外的是，朋友將對她的服務非常滿意，而且愈到人人推薦，後來狗來越來越多的陌生人來詢問，讓她受寵若驚。「我真的沒想過，這狗件事可以當成一門生意來做。」她說：「我通常求者不拒，但那是因為我喜歡做這件事，也看到狗狗飽有更多人找上門，安卓雅的收入不斷增加，而遛狗也從原本打發時間的活動，轉變為一門事業。幾個個月後，她開始能狗狗打下關聯，這也意味著，她必須把這件事當成一門生意來做。於是，她增加了另一項業務：寵物保險。同時她還取得寵物急救證照，也有了自己的專屬網站。\n\
    \n今天，安卓雅也成了一個陪狗狗跑步的全職工作者，而且因為有五十名客戶，得聘請更多人來幫她才行，這也讓她覺得這次轉變太值得了。」這份工作不只是讓我實現夢想，」她說：「也為其他跟我一樣的人開闢了一條路，我真在太高興了！」\n\
    \n## 發現自我\n\n「大部分的求職者找不到夢幻工作，並不是因為就業市場的情報不足，而是因為他們對自己的認識不夠。」四十年來最暢銷的就業指南《這樣求職才能成功》（What\
    \ Color is Your Parachute？）的作者迪克·鮑利斯（Dick Bolles）說。夢幻工作很少是透過傳統求職方式得到的，它們更多是「創造」出來、而不是「找到」的。要有這樣的創造，需要很深入的自我認識。\n\
    \n然而，就像攝影師安迪拍的例子一樣，會開始認識真探索自我、省思職涯，通常都是因為面臨危機，例如失敗或創業失敗，要不然一般人很少會不斷地往內在探索，鏡子待你像大迴避自我中心。但鮑利斯不這應該認為，因為這幾週的探索，為的是要發掘「這個世界最需要我貢獻的是什麼」。\
    \ \n\n此外，在危機發生前深沉入自我省思，不管是對你、對雇主或是對顧客來說都很有利。消極面而言，它能防止身心狀態因工作而耗竭，以及避免夢想破滅；積極面來說，當你處於滿足的狀態中，更能夠發揮所長去幫助他人。\n\
    \n然而，如果沒有危機當頭的迫切感，我們要如何進行有意義的自我反思呢？\n\n## 培養核心興趣\n\n## 捲發展\n\n現 在的你，依然沉醉於那些令你快樂的活動或類似的事情嗎？它們還列在你生命之輪的項目中嗎？\n\
    \n如同白金漢的觀察，很多人放棄了「兒時」的活動，轉而從事比較「嚴肅」的事情，像是讀書、工作，或其他可以負起成人人生責任的事務。也許我們放棄兒時熱情、轉向傳統目標，是因為覺得那些熱情無法滿足成人世界的需求。\n\
    \n儘管為了順應環境，我們確實會隨著時間而改變，然而湯姆·雷斯（Tom Rath）在《StrengthsFinder 2.0》一書中卻指出，我們從孩提時期以來的性格特質、熱情與興趣，會相對穩定的保留著。\n\
    \n所以，即使我們達到了傳統認定的成功（如同後面126頁凱洛的例子），通常還是會有隱藏版的未竟夢想，是植基於兒時的生活動取向。如果長大成人後沒有認出來，並用某些方式追求那個核心興趣，我們就難以體驗到一個圓滿及自我實現的人生。\n\
    \n我們每一個人都有某種神祕的渴望，\n隨著時間流逝，\n這様的渴望往往會潛入內在，\n成為一種秘密不可宣的哀傷。\n每個人的渴望當然不會一樣，\n它是 deepest\
    \ 層層需要求的自己我表現出來。\n只有當內心的渴望開花結果如果時，\n我們才會覺得生命是圓滿且有意義的。\n——喬治．金德（George Kinder,\
    \ Lighting the Torch）\n\n## 1. 孩子\n\n愛、性、態度直心、障礙情緒\n\n## 2. 父親\n\n在孩子的发展過程中 減緩刺激、\
    \ 愉悅及滿足， 也著他們的成就 感到驕傲\n\n## 3. 老師\n\n幫助他人、 覺察自己對社會有貢獻、 依家／揭開與納少／真理、 運用規籃 與表達的能力、\
    \ 學習、育作\n\n## 4. 創業看\n\n從創造新事物 獲得獎賞感、 被訓與風險、 神秘性、 自我表達\n\n## 6. 兒子\n\n家庭的連結、 透過父母及教子\
    \ 認識自己、 倚系\n\n## 7. 兄弟\n\n家庭的連結、 陪伴情緒、 倚系\n\n## 8. 證者\n\n特殊的運用、 語言的運用、 擔任文化的媒介、\
    \ 協助婚姻當世頌值 或文化上不可知的真實、 寫作及編輯\n\n## 9. 演講人\n\n受到注意、 認同感、 棍笛及傷害訊息、 常監\n\n我的嚮往處處運用\
    \ 或具備什麼，\n才能讓我獲得快樂、\n有用及有價值？\n\n用語言文字去 表達含有真理與 美感的訊息，\n要能面對面的溝通，\n運用有饋之間 的 情商與互動\n\
    \n共同點？\n探索及揭露\n身心／真實、\n親重與表達、\n喜作、\n自我表達、\n學習、\n發展專長、\n情值\n\n## 5. 作家\n自我表達、認同感、\n\
    運用自己的快感，\n優雅的表達與展現\n\n## 10. 音樂人\n美聲社會的\n創意藝術家、\n需要...與...對...\n付出 或\n\n## 克莉絲汀娜的個人商業模式圖\n\
    \n## □ 商機模式 □ 新模式\n\n克莉絲汀娜 (Kristina Šmigun-Vahi) 是愛沙尼亞的越野滑雪選手，在2010年冬季奧運奪下自由式銀牌後知道自己無法兼顧滑雪和家庭，於是她以成為「世界第一的媽」為目標，重新繪製了一張新的個人商業模式圖。\n\
    \n關鍵夥伴（關鍵合作夥伴）\n媽\n父親的人 太太\n父親角色的 太太\n母親 母親\n你需要付出什麼（成本結構）\n大力凸力\n奔波旅行\n旅遊 全職滑雪\
    \ 生涯\n你做哪些事（關鍵活動）\n照顧孩子\n自我訓練\n你提供什麼（價值主張）\n世界頂尖 滑雪選手\n世界第一的 媽媽！\n你如何服務（顧客）\n\
    內在心靈的交流\n人與人間的互動\n你如何與顧客互動（顧客關係）\n別像是知道你的服務卻透過何種一\n渠道\n你賣給哪些人（目標客層）\n自己 家人 三歲女兒\n\
    收入好嗎（收入來源）\n你會獲得什麼\n渠道策略\n勞人父母的 親友及廠商\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_97_0.png)\n\
    \n職涯甜蜜點 \"Career Sweet Spot\"\n\n專業與能力 （能夠輕鬆掌握的能力，也接近天賦的才能）\n\n性格 （個人偏好的工作方式）\n\
    \n興趣 （...）\n\n## 生命的歷史框架\n探索\n\n大部分的職業專業家庭都同感，工作滿足感受到三個因素共同驅動：興趣、專業與能力，以及其性。\n\
    \n生命歷程探索（Lifeline Discovery）就是幫助你界定並驗證這些因素的一種工具。\n\n## 安妮絲的生命歷程圖\n\n+喜愛\n-厭惡\n\
    \n時間\n\n加入中學學習\n高中畢業\n在特殊學校到\n搬到阿婆家。再搬到\n社區大學畢業\n結婚\n在E公司工作\n副包裝旅遊\n在M公司工作\n升職\n\
    休職\n生產\nMBA畢業\n在S公司工作\n在特別的學校一份工作\n父親過世\n新居搬家\n中立大學就讀一星期\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_100_0.png)\n\
    \n時間\n\n## 2. 描述事件\n\n為每個事件寫下一兩句簡單扼要的描述，方便你勾勒出，是什麼驅動的關鍵因素在驅動工作的滿意度，例如興趣、能力/技術、價值等。\n\
    使用至少兩個動詞（像是設計、帶領或召集等）\n次描述每個事件。舉例來說，你在學校活動中唱了首歌，如果你只寫「唱歌」，無法精確表達真實的狀況。更仔細方法是透過描述：『透過唱歌、排練及演出後，在全校對愛表演大會中得到（愛情限時外），獲得滿足。』\n\
    \n這個步驟需要清楚交代當時的背景因素，換句話說，愛要了解事件發生的時間點及背景，例如何面接到的「老爺對家長交談之會」。\n\n# 如希如此描述她人生的五個代表事件：\n\
    \n+   1. 加入畢業紀念冊編輯委員會：\n在設計紀念冊的過程中，學到正確向思考的重要性和，也建立起自信心。\n\n2. 從波特爾社區大學畢業，拿到電腦資訊系學位：從運用電腦解解決問題的過程中，獲得撼大的成就感，學會設計/發想解決方案，樂於限有共同目標的團隊一起工作並實現想法。\n\
    \n3. 在ET公司擔任重要的調訊人員：偏臉內部關系描述問題/機會，透過發揮技術及分析技能去關發出解決方案而充滿了成就感。經由於在不同領域工作，持續學習專業技能和體驗，享受樂趣有能力的攀登。\n\
    \n4. 由賴之放：探索自我獨特文化，除了享受旅行樂趣之外，也增加了個人對西藏人的民及歷史的了解。這是一個自我省思及個人成長的階段。\n\n5. 困伴關係轉換屬主：體驗一個團隊負重前已常常變遷。技術相關的機會很少，策略及策略夥伴子點的機會有限。有一年個人成長的機會，但能夠紮公的文化非常的不同。納公司的文化把管理風格淡薄，重視金錢而非價值導向，少了些正能量。\n\
