    摄影 Paresh Gandhi


    「創造力與自我超越」專家斯瑞庫瑪·勞歐（Srikumar Rao）2008年在Google的一場演講中，以極具感染力的笑容解釋，我們是如何活在噪嚷不休的內在自我對話中，這種話會強化我們來理解世界違作的「心智模式」。看著聽眾肩膀、斜眼、強硬等等不以為然的動作，他只是理解地點頭並繼續說道：「你們全都活在一個夢中的世界。」


    低語聲如同瀰漫游般在聽眾中散播開來。


    「你整個人生，包括你正在經歷的現實，」他說，「都是你給自己聽的一系列故事，而且你還在持續地說著。」


    語畢，幾位學員顯然發現手機上有緊急訊息而離開了，但大部分的人還留在房間裡。四十分鐘後，不少人離開時已經徹底改變了他們的人生觀。


    ## 打造你的


    勞諺認為「學會在力爭奮鬥時仍保持沉穩， 非常重要」，他聲稱他的主張並非原創。他所表達所陳述的， 全都來自千百年來的心靈哲學傳統，這些全是用以處理人類問題的基
    本原則。 或許，這就是為什麼他的話會讓 Google 員工 （這家公司正是好是現代科技的翹楚）聽得刺耳 的頑固。即便在光速的數位時代，形塑我們 生活與工作的，似乎依然是那些恆久不變的
    人性因素。 而當我們準備要調整個人的商業模式圖時， 這些人性因素是必須好好處理的。每個人都 渴望從那些帶來挫折感的內心對話中解脫， 誰不曾夢想過重新形塑自己呢？
    讓我們從一個美麗的實驗開始，這個實驗最 早是由英國哲學家伯特蘭・羅素（Bertrand Russell）在二十世紀初提出。


    想像二十個人同時從不同方向觀察一張椅子 （A），每個人都對這張椅子有不同的看法。 有些人眼中的椅子是（B），也有人看到的是 （C），高檔子的人可能看成（D）。換句話說，
    對於同一張椅子，二十個人可能會有二十種不 同的看法。 那麼，所有這些看法都正確嗎？沒錯！ 可是，如果他們都對，到底哪一個才是 這張椅子呢？ 真正的答案是？以上皆非。每一種看法都只
    是代表這張椅子的一个角度，而非這張椅子 本身。當椅子本身做為一個單獨的存在時， 人們對它的體驗各自截然不同。


    ## 意識的力量


    事實上，我們對這張椅子的理解（perception），影響我們的程度超過椅子本身。因 此，對椅子有意義的經驗只是基於一個象徵（亦即我們的看法），而非其實體。


    羅素的主張是，我們永遠無法看見或知道這張椅子完整的實體——即使我們知道這個別體確實存在。我們的知識始終受限於我們的觀點。


    然而，如果你繞著椅子走一圈，在每個人的後方停留一下仔細看，就能看到這張椅子的不同角度，因而有了全新的觀點。


    所以，倘若二十個人對同一張椅子有二十種不同的觀點，只要你移動位置、障礙物，就能改變你原來的觀點。


    簡言之，你可以運用換位思考的力量，來重新設定現實。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_164_0.png)


    重點來了：重新設想現實，可以改變現實。


    你所認知的任何事情，包括你的觀察、你的愛情、你的家庭和朋友，未必是真正的現實，賞，而只是你對現實的「理解」。這個理解只代表現實的一種可能性，只是我們觀看椅子的幾十種不同觀點之一而已，不是獨一無二的箇相。


    顯然，我們感官所體驗的這個世界不是真實的，而是如同旁觀在《Are You Ready to Succeed》一書中所說的：


    我們創造了這個世界，我們一種一瓦把它建造出來。我們按照我們的心智模式（mental model）設想出世界的模樣，然後再聽命行事地在其中生活。由此之後，我們照常過日子，未曾了解我們的心智模式只是建構在某種看法上，並非真相與事實。


    問題在於，我們總是假設我們所理解的實相（如同內在對話一再強調的：「我的事業面臨失敗」、「老師討厭我」、「忌妒我的同事爭功 svo...）


    疑過」等等），就是真正的現實。


    ## 趣趣 心智模型有


    當你準備建立個人商業模式時，練習不自我的設限的開放式思考是很實用的。你可能對接下來的的練習很熟悉，它可以協助我們開始思考心智模式（內在的認知框架、預設立場）為何無法有效運作。


    拿一枝筆準地右圈九個圓點蓋在一張白紙或止，或直接使用右圈也可以。


    - 1. 把九個點連起來

    - 2. 最多只需要四條直線

    - 3. 曲筆不能離開頁面（即一筆畫到底）

    - 4. 可以從任何角度畫線

    - 5. 完成時，每個點必須有一個直線穿越


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_167_0.png)


    解答關鍵就是：「跳出思考框架。」 太多數人對這個題目的預設場景（即我們的心智模式）是：把線畫在幾個點圍起來的框框之內（結果不論怎麼組合，都會有一個、兩個點串不起來），而沒有想到線可以繞出框外。就象山德爾夫婦（Benjamin
    and Rosamund Zander）合著的《A級人生》（The Art of Possibility）一書所說的，這種限制是自己獨造出來的： 人類心智裡隱藏著無限可能的藍圖，我們的潛意識已經設限了我們可以做的事情，我們只要將尺寸縮小到可以的範圍，就能…

