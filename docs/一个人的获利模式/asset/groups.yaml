    # 商業模式圖範例（以大型免費分類廣告網站Craigslist為例）


    # 顧客關係


    Craigslist 提供網站分類廣告服務，幫助人們尋找工作、住所、交換或買賣商品，此外與會員交流。這家公司在 70 個國家擁有 700 個據點，每個月登錄在網站上的工作機會超過一百萬個。即使
    Craigslist 的組織文化不像大企業，根據產業分析師的說法，它仍是全世界平均員工獲利最高的公司之一：30 名員工每年的產值超過 1 億美元。


    用戶創造、編輯及發布需求時，使用的是全自動化流程，不需 Craigslist 員工介入。員工主要監督用戶自發性的調整風氣，以及鑑別許可將活動。Craigslist
    所專心致力的是將現有用戶的使用經驗最佳化，而不是吸引新用戶。


    個工程師，其實並不會有什麼立即的損失；但如果它的網頁當掉一天，那就會絕對是個災難！其過程來說，這也適用於 Craigslist。除了開發及維護平台，Craigslist
    的員工還必須花時間處理顧客、垃圾郵件以及其他非法用戶的干擾。


    # 目標客層


    Craigslist 的大部分客戶都是不用付費的，但有些城市的雇主或房東需要支付上架費。這些付費客戶資助了免費付費客戶。


    # 價值主張


    做為一個線上服務提供者，Craigslist 提供的價值是促進會員之間在離線後互相交流；另一個價值則是提供免費的分類廣告，幾乎涵蓋了顧客所能想到的每種產品或服務。這些價值吸引了大批的忠實顧客群，凝聚
    Craigslist 能夠提供第三個價值：對雇主和房東而言，高性價比（高 CP 值）的僱才和租賃廣告。


    # 關鍵資源


    Craigslist 最重要的資源就是它的「平台」，這是一個自動化的方法（或引擎），讓目標客層之間能夠產生交易。Craigslist 創辦人葛瑞格·紐馬克（Craig
    Newmark）的聲望、公共服務理念，以及該網站的經理人和員工，也都是關鍵資源。（按，葛瑞格·紐馬克是程式設計師出身的網路創業家，活躍於許多公益慈善事務團體）


    # 收益流


    只有雇主和房東（左頁圖表的第三目標顧客群）能為 Craigslist 帶來收益。


    # 關鍵合作夥伴


    免付費用戶是 Craigslist 最重要夥伴，他們努力地維持社群成員之間的話誠信和禮貌，以確保平台運作順暢。


    # 成本結構


    由於不是上市公司，Craigslist 沒有義務揭露它的財務數字，但它的員工只有 30 名，相較於臉書、推特（Twitter）或其他線上公司，成本支出相對極低。重要的是經常性支出，包括員工薪資、伺服器和通訊設備費用以及辦公室租賃費用。依其在業界的知名度及眾多行專樞推如，這家公司在法律和其他專業費用的支出也談不小。專實上，有些觀察家認為這些費用加總起來，可能遠超過其他成本的總合。


    # 關鍵活動


    開發並維護網站平台是 Craigslist 最重要的活動。這應該好了，假設 Google 至少了 100


