    \n# 姓名：米卡·内崎\n(Mika Uchigasaki)\n\n### 65\n\n## 研究员：价值主张\n\n## 类别：体现真正的价值\n\n\
    ## 人物：专业译者\n\n米卡（Mika Uchigasaki）是個全職的英日文譯者，她最主要的客戶是律師事務所。\n\n她報名參加「個人商業模式」工作坊，開始學習繪製「個人商業模式圖」。課堂上，她在「價值主張一欄，寫的是「把文件從日文翻譯成英文」。\n\
    \n講師問她：「把文件從日文翻譯成英文，跟你的關鍵活動有什麼不同？」她一臉困惑。\n\n講師繼續問她：「律師事務所雇用你，最主要的目的是否要幫他們完成什麼工作？」\n\
    \n米卡想了一下，回答：「打贏官司。」\n\n「要幫他們達到目標，把文件從日文翻譯成英文是一種——項關鍵活動。」講師繼續說，「但是，你最重要的價值在於『產生有說服力的文件，來幫助他們打贏上百萬美元的訴訟』。千萬不要讓客戶把關鍵活動和價值主張畫上等號。」\n\
    \n米卡的眼睛亮了起來，她說：「對我來說，這是一種全新的思考方式。長久以來，我一直在尋找一個能夠重塑工作模式的方法，我想，現在我終於找到它。」\n\n# 通路\n\
    \n別人怎麼知道你的 & 你透過何種方式服務\n\n一旦你能清楚定義目標客群和價值主張，就已經完成給個人商業模式的大部分工作了。按下來，我們要繼續來關心其他部分。\n\
    \n在這項中，我們要談的是商業術語「行銷流程」(Marketing Process)的五個階段。要描繪這五個階段，最恰當的方式是詢問以下這些問題：\n\n\
    + 1. 潛在顧客如何發現你能如何幫助他們？\n+ 2. 他們如何決定是否購買你的服務？\n+ 3. 他們將會用何種方式購買？\n+ 4. 你將如何遞交顧客所購買的服務或商品？\n\
    + 5. 你將如何追蹤以確保顧客滿意？\n\n想要定義通路，最直接的方式就是問你自己：你要「如何遞交」顧客所購買的服務或產品，其中可能包括： giao 書面報告、畫面訪問、談、程式放在伺服器、畫面或線上簡報，或是重輔運送實體商品。\n\
    \n但是，就如同上述的五個階段所呈現的，以通路這個要素而言，更有而且重要的議題是：如何讓潛在顧客知道你這個人，以及你的價值主張？是口耳相傳？網站或部落格？文章或演講？電話拜訪？電子郵件或線上討論區？還是廣告？\n\
    \n通路對於個人商業模式相當重要，原 於：1) 你必須定義「如何幫助顧客」(價值提案)，才能向他們傳達這項服務；2) 你必須傳達「如何幫助顧客」，以銷售你的服務；3)\
    \ 你必須銷售「如何幫助顧客」，以獲得報酬。\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_65_0.png)\n\
    \n![](img/495607eaa94eb1caeeb01e66aa6c08a9_65_1.png)\n\n# 美術設計師\n\n| 關鍵研所：通路 |\
    \ 建議：改變你的通路很重要 |\n|---|---|\n| 人物： | |\n\n我是那種很容易覺得無聊的人。踏上美術設計這一行之後，我常常換工作，很少待在同一個職位太久，尤其我抓住每個從家中小公司，通常無法容忍我這種細節沒耐心、對團隊合作沒熱情的員工，往住幾個月後不是他們把我炒了，就是我自己求去。由於我沒有創業的經驗，因此也沒有想過其他我非常適合接案子，當個自由工作者——直到一位剛除掉的老闆這樣提醒我。\n\
    \n我對商業模式一點概念也沒有，也不懂得怎樣去行銷自己。但我現在知道除了設計方面的專業能力，我還有兩項強項： - 是 我喜歡結交新朋友，二是可以同時做好幾個案子。\n\
    \n舉例來說，我可以走進一家從來沒去過的公司處處告部門，然後很快就跟大家打成一片，就像是住在這家公司待了很久似的。因為我懂得看人，也懂得這個部門的工作流程。\n\
    \n像我這種個性——容易覺得無聊、喜歡認識新朋友、喜歡接新案子——的人，很難當全職上班族。因此，當我的「通路」從「上班」變成「按案子」之後，所有的問題全都變為我的強項。此外，我的人際關係技巧也變好了。不過，這可能是因為我在一個新環境下通常不用等待太久，而且我發現自己更容易手可熱了。\n\
    \n# 顧客關係\n\n你如何與顧客互動\n\n你會如何描述你與顧客的互動方式？是提供個人化、面對面的服務，還是仰賴電子郵件或其他書面溝通方式？你與顧客的關係是一次性的，還是持續性的？在策略方面，你著重的是擴張客群基礎（開發），還是滿足現有的客戶（維繫）？請將你的答案寫在這個橫式圖上。\n\
    \n![](img/495607eaa94eb1caeeb01e66aa6c08a9_67_0.png)\n\n# 客戶經理\n\n關鍵研究：顧客關係\n\n\
    標題：語言溝通的力量\n\n潔西 (Jessica Ho) 任職於一家辦公及紙類用品製造商，一開始從事的是業務工作，分配給她的客戶中，包括了辦公用品連鎖店史泰博\
    \ (Staples) 和 OfficeMax 等幾個美國 大客戶。然而，工作了幾個個月，她還在為如何發展良好的顧客關係傷腦筋，於是透過老闆的居中牽線，她向腳踏車綾綺米·懷利\
    \ (Jim Wylie) 尋求協助。\n\n一開始，吉米就把問題聚焦在商業模式圖的「顧客關係」一項上。他發現潔西言行舉止對人客歉，也損長口語溝通，但拜訪了顧客戶取得或履行訂單外，她平時很少打電話給他們。潔西承認自己是「數位時代世代」，覺得電子郵件比較自在，不習慣價面對面或電話交談。\n\
    \n吉米建議她只要有機會就會用手機打給客戶，潔西從了他建議。很快的，潔西與客戶的關係就升溫了。打電話往往會讓潔西情緒更容易進展，而且氣氛會更融洽，有利於進一步的會面商談。\n\
    \n# 關鍵合作夥伴\n\n誰能幫你\n\n你的關鍵合作夥伴就是那些支持你的專家達人，他們會協助你順利完成工作。關鍵合作夥伴會提供前進的動力、建議和成長機會，也可能提供幫你完成特定任務的其他資源。合作夥伴可能是工作上的同事或導師、專業人士的成員、家人朋友，或是專業顧問。現在，把你想到關係合作夥伴一一寫下來。稍後，你可以選擇是否要擴大你對關鍵合作夥伴的定義。\n\
    \n![](img/495607eaa94eb1caeeb01e66aa6c08a9_69_0.png)\n\n# 頂尖業務高手\n\n## 個案研究：關鍵合作夥伴\n\
    \n## 案例：顧及内部夥伴的合作感受\n\n強恩（Jon Taylor）是個有20年經驗的業務代表，負責把塑膠原料賣給產業內 的客戶。他在管理客戶上享有極大的自主權，能夠自行設定價格與付款條件，\
    \ 也很少提報銷售活動有關的内部報告。不過，當他的公司被一类大型的 國際公司收購時，這一切都改變了。\n\n在這個新的大型組織中，強恩發現他的行事風格激怒了某些同事。這些同事\
    \ 負責提供行政與行銷支援給業務人員，把報價及付款條件的指導原則交給業 務員，要求他們提交活動到文件以便監控銷售行為，並向管理層報告。\n\n強恩重新審視自己的個人商業模式，意識到這次收購帶來了一批新的内部關\
    \ 鍵合作夥伴，而這批新同事和外部客戶對他的成功都有一樣重要。同時他也解 釋到，自己不容許別人問題的行事風格已經過時了。\n\n於是，他決定開始提交活動報告給新的内部夥伴，並且常常和他們及業務經理\
    \ 電話聯繫。這些銷售單的行為改變讓他的同事們感到驚喜，也得到了他們的支 持與配合。\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_70_0.png)\n\
    \n# 收入與稅項\n\n你會獲得什麼\n\n寫下你的收入來源，例如薪資、承擔收入或專業費用、股票選擇權、權利金，以及任何其他的現 金收入。然後再加上福利項目，例如健康、退休金或是學費補助。口後當你想要調整個人的商業模式圖時，可以考慮將「收入」收集到列推去，例如收心或、減產、露，行\
    \ calcu 並會貢獻。\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_71_0.png)\n\n# 執行秘書\n\
    \n潔（Jet Barendregt）是資誠聯合會計師事務所（PwC）歐洲分部一位資深合夥人的執行秘書。\n\n隨著業務成長，資誠新增了一些類似職位的職位，但新人流動率很高，她發現不僅要負責帶新人，甚至還要扛下更多的責任。在公司待了十年後，她雖然成為公司不可或缺的一員，卻覺得自己已有的專業及價值被視為理所當然。\n\
    \n因此，當老闆宣布搬遷辦公室，而且這會大幅增加她的通勤時間時，她決定要離開自己的個人商業模式。\n\n她離開資誠並設立一家處理個人的服務公司，完全透過電子郵件、電話、Skype和雲端工具來服務客戶。她的關鍵創新及變動是「收入與好處」這一欄：用收費來代替薪水。\n\
    \n今天，潔必須通勤，有更多的時間分給小孩和追求個人興趣，而且收入比在資誠時高出三倍。此外，她還可以選擇客戶。「我的經驗顯示，你可以在增加收入的同時，還能降低成本。」她說，「所需要的只是承諾、信任，以及正確的商業模式。」\n\
    \n提示顯示：收入做好處\n\n問題：重新思考收入\n\n# 成本結構\n\n你需要付出什麼\n\n成本是指為了工作所付出的時間、精力及主要的金錢支出。\n\
    \n列出每一項尚未回收的「硬」成本，例如：\n\n+ - 訓練資源或知識\n+ - 通勤、旅行或社交支出\n+ - 車輛、工具或專業工作服\n+ - 在家或在客戶端工作時所產生的網路、電話、交通、水電等費用\n\
    \n你所付出的成本，也包括因為執行關鍵活動或與關鍵夥伴合作，所產生的壓力和不滿。這類的「軟」成本（間接成本），我們會在下一章繼續討論。\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_73_0.png)\n\
    \n![](img/495607eaa94eb1caeeb01e66aa6c08a9_73_1.png)\n\n# 姓名：馬克·戴辛格 (Mark Degginger)\n\
    \n## 人物：廣志 AE\n個案研究：成本結構\n問題：關鍵活動成本\n\n「當馬克（Mark Degginger）走進我的辦公室時，整個人散發的感覺強烈地告訴我說：他找不到工作了。」喉嚨的問題法則、芙加（Fran\
    \ Moga）說。「他的情況很糟，有六位數的年薪、漂亮的房子和一艘小艇，卻必須每天拋棄著去上班，還得用長時間的午餐來撐過難熬的下午。」\n\n「他在一家非常獲利等向的廣告公司工作，工作壓力很大而且競爭殘酷。他還有背痛的毛病，明白此我年輕，看起來卻比我老。」\n\
    \n「最大的問題是，雖然他很能幹，但他的工作卻違背了他的核心價值。他擁有各種成功的標記，但想追求的，卻是更高尚的理想。」\n\n「所以，有一天我問他：『為什麼你還要繼續做這樣的工作？你曾經想過你要付出的代價嗎？』他什麼都沒說就離開了，但下次見面時，他似乎想通了。『我付出的代價包括關係、健康，還有生活沉悶。』他說。」\n\
    \n「再見到馬克時，他還沒開口，我就知道這事情改變了。他看起來神采奕奕，整個人也變輕鬆了。」\n\n「我問他：『你好嗎？』他說：『非常好。』已經辭掉廣告公司工作，他，在和妻子達成共識要簡化生活後，目前在一家非營利組織工作，負責培訓弱勢及殘障人士。他的收入比以前少很多，但快樂卻比以前多很多。』\n\
    \n![](img/495607eaa94eb1caeeb01e66aa6c08a9_74_0.png)\n\n# 即使是顧客，也有他們該做的事\n\n##\
    \ 人物：\n博士生\n\n克莉絲（Chris Burns）是個新聞工作者，有扎實的訓練及媒體經驗，她一路看著傳統出版業的商業模式（包括她所服務的公司）衰敗下來。當她被資遣時，她已經在念博士班，目標是在取得學位後改行當教授。\n\
    \n基於對企業永續這個研究主題的興趣，同時也經由博士班教授職員網路的協助，克莉絲找到了一份兼職工作：替教授編輯學術論文。出版宣告的，她發現自己非常喜歡這樣的工作。\n\
    \n有一天，她體認到自己真正的工作不單只是個編輯，而是更有價值的事：「讓顧客的論文能順利在首屈一指的學術期刊上發表。」所以，她決定大幅調高自己的鐘點費，並且把查找資料的研究時間也納入計費。\n\
    \n結果呢？她有了更多的顧客。\n\n回顧收時路，克莉絲指出自己原先的商業模式犯的兩個常見錯誤：\n\n## 貓把關鍵活動當成價值主張\n\n克莉絲貓把編輯及改寫的工作（關鍵活動）當成自己為顧客提供的價值。她應該站在一個制高點跳脫求看，先界定顧客需要達成的工作，再從那個任務來定義她所提供的價值。\n\
    \n## 貓把所有任務都攬在自己身上\n\n起初，克莉絲把案子一手包，將所有事情都攬在自己身上，反而使她的工作被顧客窄化成「潤飾及改寫」。當她開始提高顧客，發表論文是他們自己的任務，而她是協助他們完成任務的人，她的價值及聲譽才能得以攀升。\n\
    \n# 姓名：克莉絲·伯恩斯\n（Chris Burns）\n\n![](img/495607eaa94eb1caeeb01e66aa6c08a9_75_0.png)\n\
    \n# 76\n"
