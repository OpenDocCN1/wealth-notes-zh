    # 如何測試你的商業模式


    請跟你的潛在顧客會面，以便測試你在個人商業模式中所做的假設。如果對方的修建議確實有必要，請回去修正九大要素中相對應的部分（這就是前面提到的轉向）。然後再與其他潛在顧客重複這個步驟。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_226_0.png)


    一旦你的商業模式以可調整到定位後，要測試著去把它「賣」給顧客，來驗證它是否可行。如果顧客不買，你要 nt 測試著轉向（pivot），用他們不買的原因來修正商業模式。等到有顧客願意買單了，就表示你更賺錢是被公司鎖取雇用，只要你成為準創業伎者，準備尋找下一個顧客了。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_226_1.png)'
  - '[PAGE 227]


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_227_0.png)


    要發掘顧客，得從布蘭克斯所謂的「走出辦公室」開始，生涯專家稱之為「建立人脈」。他們其實說的都是同一些事：跟留在顧客、專家，或是能幫你引見其他的人脈關係及紮面，並透過雙方面動來了解你的商業模式能否行得通。


    記住，個人商業模式圖的九大要素中，很多都是你單方面的假設，都需要經過顧客檢驗，例如：


    +   • 倘若要提供你所承諾的價值，顧客對你擁有關鍵資源及／或關鍵合作夥伴是否 trapezoid？

    • 顧客在乎你想幫他們代勞的工作嗎？他們會願意為這樁的協助，付出你在收益欄上填寫的代價嗎？（例如營蘋，她一開始根本找不到這樣的顧客）


    +   • 你急於得起來執行這個商業模式所需要的成本嗎？

    • 顧客希望透過什麼管道得到聯繫及服務？你提出的顧客關係模式適當嗎？


    要回答上述這些問題，唯一的方法是親自前往潛在顧客工作和生活的地方，跟他們面對面。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_227_1.png)'
