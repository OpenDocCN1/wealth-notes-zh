    # 問題


    # 解決問題的起點


    你對你的工作感興趣嗎？


    若是，很好！若否，可能是關鍵資源（你是誰 & 你擁有什麽）和關鍵活動（你做哪些事）根本不相符。你也可能需要重新思考你的人生目標。參考第4章和第5章。


    你沒有發揮（或只是低度運用）你重要的專長與能力嗎？


    專長及能力被忽略或低度運用，會產生壓力或不滿等情緒成本。你能夠增加運用這些專長的關鍵活動，以提升你的價值主張嗎？參考第4章和第5章，找出為什麼你的專長沒有發揮。


