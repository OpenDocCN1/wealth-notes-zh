    ## 定義工作，定義自我


    關於動機，工作是為什麼？

    我們也許不在資源匱乏時單純中，也從未感受過身心耗竭。然而，無論是何種理由，許多人其冀正處在職涯「自我導航」之下，如同江翊睿投身音樂製作之前的狀況。我們或許平穩前進，或許粗糙頓挫，但方向和速度卻大都由外在趨勢決定，而非依據自己的意圖。我們短期可能會因為工作符合自己的核心興趣而感到心滿意足，但如果不是由自己掌舵，這種滿足感還是會逐漸淡化。


    要疑惑自己是否處於自動導航模式，並進一步探索自我，可以這麼做：先思考工作在你生活中所處的位置，以及這個位置是否符合工作對你的真正意義。


    即使我們已經對自己做過各種分析，但是許多人還是會用職業來定義自己，正如初識的人通常會問對方的第一個問題是：「你目前在哪高就？」


    雖然工作的意義因人而異，而且可能天差地遠，但事實上，工作對你來說卻是形塑「你是谁」很重要的一環。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_123_0.png)


    ## 傳統上，專家把工作的意義歸為三類：


    單純把工作當工作，意味著你工作只是為了薪水，沒有太多的個人投入及滿足感。社會心理學家羅伊．鮑梅斯特（Roy Baumeister）在《生命的意義》（Meanings
    of Life）一書中，描述為薪水而工作的想法：「這樣的工 作是一種工具性的活動，也就是說，做一件 事基本上是為了另外一件事情。」


    然而，透過工作展現專長，還是否夠讓我們個重要來源。


    ## 作者簡介 珍．史密斯 Jane Smith


    獲得滿足感，更不需用說得到的實質報酬，就可以讓我們追求其他層面的生命意義。


    第三：工作是一面自我塑造鏡，為了生涯規劃而工作，是受到成功、成就及地位等渴望所激勵。鮑梅斯特認為，這種工作動機並非對工作本身的熱情，而是「強調在工作上得到對自我的回饋，對他們來說，工作的意義是一種創造、定義、表達、證明，以及榮耀自我的手段」。把工作當成生涯規劃，可以是實現生命意義的一個


    反思：工作是關於服務

    如同下一頁提到的號召，召喚（calling）一詞源自於「被號召」（called upon）去從事某種工作概念，包括來自宗教或社群的外在呼喚，或是內心想展現天賦的動機。觸發特殊說，這是「出個人義務、責任，或甚至是天命」。除了上述這種傳統分類之外，我們建議上第四種。


    把工作當成自我實現，最好的描述是：工作由強烈的興趣（或至熱情）所驅動，但不具體來自「召喚」的高度使命感。經由工作追求自我實現的人，可能會選擇與傳統的生涯之路，重現個人的興趣越高於財務報酬、地
    位或聲望。這樣的 工作可以是生命意義的重要來源。


    顯然，這四種定義會有重疊之處，而且每個人的工作通常也包含四種類似的元素，只是比重不同而已。這樣的分類只是提醒我們，工作至少可以提供我們人生的意義。


    例如，以工作謀生的人可能從家庭、嗜好、宗教或工作以外的活動得到人生意義。追求事業的人會把大部分的人生投注在求取更多的財富、地 位或名聲；甚至機構家庭生活或
    其他興趣。受到召喚的人則可能夠略到高深的心靈滿足及專業成就，但也有可能 會得到傳 統雇僱僱價值的肯定，因而產生被 剝奪感（我想到的角色是藝術家及傳教士）。最後一種是追求自我實現的人，他們有可能在工作中找到生命意義，而且不用做到繼性家庭及其他有趣的地方步。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_124_0.png)


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_124_1.png)


    ## 接觸的人，生

    俗語的心


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_125_0.png)


    當稅務會員會師凱洛忍不住低聲說話時，在偷聽就執業的心裡及嘆詭謔師席蒙斯只能一臉同情地微笑看著她。

    席蒙斯先生剛問了他的客戶一個觸發情緒的敏感問題：「小時侯那個自動自發、充滿熱情的女孩，後來成了怎麼樣的人？」


    席蒙斯表示，這樣的場景年復一年，已經重演過無數次了。

    凱洛和其他人類似的情緒反應，背後的原固是什麼呢？席蒙斯解釋：

    ……來找我求助的客戶皆普遍都做一種想汰磨，就是還在他們完成學業、建立家庭、買房買車或是爬上高階主管之前，就直覺的認定自己「應該」如何過日子*。

    席蒙斯這樣描述他的客戶：「因為自己的愚味或錯誤而錯過了人生真正的召喚，所以被殘留的意志煎熬著」。

    換句話說，人們相信自己注定要遵循一條特定的、能夠發揮所長並感到滿足的生涯路徑，但往往無法找到。


    為什麼大家會這麼想？

    「召喚」的概念源自歐洲中世紀，指的是突然 ():

    收到上天的旨意，要求(使徒)把單奉獻於傳遞基督教義。根據席蒙斯的說法，召喚的概念即使在非宗教領域也說得通，甚至持續擴張因覆許許多現在的工作者。席蒙斯描述這類的因素：

    ……往往被自己未實現的期望所折磨，期待生命的意義能在特定時間點以決定的形式顯現，使我們得以永久免於困惑、忌妒及後悔*。

    很多人覺得，即使沒有真正被「召喚」，他們的工作生活也稱不上理想。如何解決這種的疑慮？席蒙斯以專業職業諮商師的立場指出，著名心理學家亞伯拉罕·馬斯洛(Abraham
    Maslow)的話最足以說明：

    *摘錄自艾倫·狄波頓《工作！工作！》(Alain de Botton, The Pleasures and Sorrows of Work)。


    > 我們通常不知道自己真正要的是什麼，

    那是一種罕見又難得的心理成熟。

    ——亞伯拉罕·馬斯洛


    ## 我們走到哪裡了？


    到目前為止，我們已經討論了商業模式是什麼、維持生存的財務基礎，以及為何有所維、維持生存的財務基礎，以及為何有所組 織（不論是否盈利或非盈利組織）都是必須有的營生的邏輯。有營生的邏輯。有營生的邏輯。我們看到商業模式似乎維如何幫助組織及個人重新出發，以面對不斷變化的社會、經濟及科技趨勢。再來，我們談到如何運用商業模式圖來說述你的個人商業模式。


