    # 你的公司業績精準度? 你的公司產品實際開發流程?


    如果你像賽德一樣，正在規模重大的搬遷換換，那麽測試商業模式的要素及可行性，是非常重要的。在紙上作業階段，個人商業模式的要素中包含許多未經驗證的假設：對你來說是做好的事，但未經測試，能否幫助到別人，不是你說了算。


    想知道你的個人商業模式是否行得通，可以去找你的「潛在顧客」來測試。最好的測試方式，就是仿效一般企業測試新產品或新服務模式的方法：與潛在顧客對話。


    我們建議採用創業大師史蒂夫·布蘭克（Steven Blank）發展出來的客戶開發方法論，他描述如何找出顧客需求，並讓他們願意花錢購買。這個顧客觀能重複運用的過程之所以重要，是因為很多公司（以及不成功）


    的創業者）在還沒徹底了解顧客之前，就全心全意在開發及銷售商品或服務了。


    例如，當摩托羅拉（Motorola）還沒搞清楚顧客是否需要一個全球衛星電話系統前，就浪費了50億美元（對，50億）開發及推出通訊服務系統「銥計畫」；同樣的錯誤也發生在RJR薩草草公司，他們在Premier和Eclipse牌無煙香菸上損失了4.5億美元：這個點子不抽於的人喜歡，問題是他們的顧客（抽菸的人）根本不在乎。


    窮明的創業家會徹底測試及評估組織的商業模式，然後才進行動員。我們如果學習他們的方法來驗證個人的商業模式，成功機會也能大大提高。'
