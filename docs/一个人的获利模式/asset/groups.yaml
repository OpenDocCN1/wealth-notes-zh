    從幾個可能客戶中，你可以挑選一、兩個為他們繪製商業模式圖，並試著新增、移除、擴展或減少九大要素的內容。


    盡量將價值主張定義得越簡單明白越好，並且找出哪個要素可能是痛點。想像這些客戶可能面對的競爭壓力，他們可能調熟商業模式來有效面對嗎？（有時候，他們的競爭者可能也是好的潛在客戶。）


    一般來說，財務是大家普遍的痛點：大部分的約束都希望增加收益或降低成本。盡量把雇用的你的所有好處理量化（可以不用太精準），強調兩個的個人價值主張為對方帶來那些正面經濟效益。


    當你為潛在顧客繪製商業模式圖時，可以把你能幫助他們做的那個工作（同時也是對方必須完成的工作）當成起點，然後再一個個倒推出來：什麼價值主張可以協助這個客戶完成這項工作？你可以從哪些關鍵活動來提供這些價值主張？你有必須具備的關鍵資源嗎？如果沒有，能從關鍵合作夥伴那裡取得嗎？你能否說明外部分量會如何影響客戶的商業模式嗎？你能幫他們調整嗎？現在或許商業模式圖發揮他的思維力量，看它能為你的潛在顧客以及你自己分析到什麼程度。


