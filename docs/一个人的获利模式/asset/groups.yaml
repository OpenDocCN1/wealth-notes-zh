    # 人物：

    歌手


    自從17歲在電視上成功露面後，來自阿姆斯特點的歌手Hind就被德國音樂巨擘BMG簽下，首張唱片就賣了四萬多張，並得到艾迪生獎(Edison Award，表揚創新產品、服務與設計的獎項)最佳潛力藝術新人頭銜。然而，BMG巨星如雲，她要推廣自己的作品顯得無以為繼。


    就在此時，下載歌曲的爆量成長，迅速削弱了傳統音樂產業的商業模式：BMG、EMI等許多唱片品牌不再是推廣和傳送音樂的獨占通路了。


    Hind了解到，要跟上快速變化的音樂產業並贏得追求自己願景的自由，意味著她必須翻新個人的商業模式。於是，她開始自問關於通路的難予問題：粉絲要如何找到她？購買和遞送她的音樂都要透過粉絲喜好的方式嗎？有何後續行動可以確保終端者的滿足呢？


    回答這些問題引導出一個清楚的決策：Hind和她的經紀人創造了他們自己的品牌B-Hind，也創造了一個全新的商業模式可以完全掌握創作、推廣及配送她的音樂。


