    「要幫他們達到目標，把文件從日文翻譯成英文是一種——項關鍵活動。」講師繼續說，「但是，你最重要的價值在於『產生有說服力的文件，來幫助他們打贏上百萬美元的訴訟』。千萬不要讓客戶把關鍵活動和價值主張畫上等號。」


