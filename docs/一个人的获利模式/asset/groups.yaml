    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_167_0.png)


    解答關鍵就是：「跳出思考框架。」

    太多數人對這個題目的預設場景（即我們的心智模式）是：把線畫在幾個點圍起來的框框之內（結果不論怎麼組合，都會有一個、兩個點串不起來），而沒有想到線可以繞出框外。就象山德爾夫婦（Benjamin
    and Rosamund Zander）合著的《A級人生》（The Art of Possibility）一書所說的，這種限制是自己獨造出來的：

    人類心智裡隱藏著無限可能的藍圖，我們的潛意識已經設限了我們可以做的事情，我們只要將尺寸縮小到可以的範圍，就能…'
  md: '

    ## 案例2


    我開了一家公司，專門替想要進軍亞洲——尤其是日本——的企業做市場研究與顧問。辛苦工作了六年之後，有人要用一筆好幾百萬美元的金額收購我的公司。對我來說，是想都沒想過的一件事，我從來不曉得原來還有「賣公司」這回事。


    總之，賣掉公司之後，我還剩三筆房貸，存了孩子們的教育基金，帶著全家人去旅行，然後把剛到手的錢拿去做最安全的投資。但即便如此，我仍覺得面對一個人生問題：這輩子，接下來怎麼過？


    而且，正因為我已經卸下經濟上的重擔，不必再為了餬口而工作，這個問題也顯得格外重要起來。在尋找答案的過程中，我越來越明白一件事情：工作，不只是為了賺錢、獲取財務上的獨立而已。


    我相信大多數事業成功的創業家，都有同樣的體悟。我跟好多同樣賣掉公司的創業家聊過，他們出售的金額有高有低，從一百萬美元到超過四千萬美元，但是沒有一個人告訴我，他們工作的最重要目的是賺錢。


    通常，那種一心只想賺大錢的人，很難保持經營的熱情，因此遇到困難時也很難撐下去。相對的，成功創業家比較關心的是如何為顧客創造價值。要知道，創業精髓的關鍵不在於你，而在於你是否能有效地面服務顧客。


    ## 高舉人生目標的大大旗！


    讓我們回頭看看第2章用過的譬喻：商業模式就好像工程藍圖一樣，前者引導一個事業的建構，而後者引導一個建築工程。現在我們進一步來延伸這個譬喻。


    要繪製一張藍圖，建築師必須了解這個建築物的「使用目的」。比如說，建造醫院或診所，就跟建造住宅及工廠截然不同，要特別設計候診區、檢查室、大量的洗手間和醫療室，以及用厚重牆壁隔開的儀器室（例如X光室）。


    同樣的道理，釐清「目標」對創建一個組織或一家公司也極為重要。組織成立的目的或是宗旨，引導著商業模式的設計。在商業模式圖以外，目標是最關鍵的要素，同樣的，它也存在著一個明顯的限制：沒有一種組織或一種建築物的設計，能夠適合所有人或所有用途。


    個人商業模式也是一樣的道理，修正或重建個人商業模式，首先必須釐清背後的目標，讓它從高處引導你，協助你高舉人生目標的大旗。


    如果你的工作和人生目標不一致，那就只是把問題掛到另一張辦公桌而已。——布魯斯·赫茲(Bruce Hazen) 反之，工作與人生目標一致，不僅能讓你突破狹隘，還能從中得到滿足。


    從何開始 在前面「創業家」的人物側寫中，李學宜認為自己的創業精神在於為他人服務。我們也建議你：人生主要目標應著眼於幫助他人。成功的創業家都知道，即便創業目的是在累積財富，也需要透過銷售「能夠幫助他人」的產品或服務來達成目標。


    話說回來，你要如何認識並形塑你的首要人生目標呢？接下來的三個實驗，可以幫你回答這個關鍵問題。


    ![](img/495607eaa94eb1caeeb01e66aa6c08a9_138_0.png)


    ## 雲端管理平台創辦人


    ## 你的封面故事


    - 1. 我接受《哈佛商業評論》採訪，該成功建立「人際網」（internet of people, IoP）的經過，將與人相對應的各種工作與生活需求連結在一起。

    - 2. 目前台灣近六成企業都忽略管理系統的重要性，但大型管理模組所需費用驚人。通常只有大企業用得起，98% 的中小企業很難有升級機會。於是我和朋友創立「華雲」（2017年更名為Mayo），目標是讓企業不花錢就能使用最先進的管理模組，並透過app實施行動管理。


    從開始提供人員資料庫起，陸續推出企業入口網站、招募服務，進而發展出員工福利、團購等社群功能，最後串聯成一個可以滿足員工各項需求的IoP體系。目前這個平台已占據80%企業工作的屏幕，成為他們不可或缺的工具。

