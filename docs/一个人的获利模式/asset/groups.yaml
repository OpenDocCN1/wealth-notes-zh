    # 切合現有的商業模式


    # 人員

    電腦技術的人員


    因為工作壓力太大，賴賴電腦技術人員謝丹尼選擇提早退休。希望能獨立工作並掌握自己的命運。


    他喜歡技術工作，因此在他人繪製的商業模式圖中，勾勒出的藍圖是買下並經營一家電腦零售店。


    為了驗證他的想法是否可行，謝丹尼拜託了一位商業經紀人、對方建議：1) 檢視每家要脫手的電腦零售店的財務狀況，以及 2) 去進行性格測試。


    做了這兩件事情後，謝丹尼了解到：1) 電腦零售店是低毛利、高周轉的薄利事業，以及 2) 他欠缺客服的人格特質，比較適合不用處理人際關係的後勤技術工作。


    於是，他進行了策略轉向，重新檢視及修改他的商業模式，並把目標客戶改為「企業對企業」(B-to-B) 的科技公司。


    很快的，有個機會冒出來了，這在他的第一個商業模式中鐵定會被略過：那是一家銷售商用終端並提供調校、認證及售後服務的公司。這家公司既能讓謝丹尼施展他的專業能力，又不用面對不識技術的顧客有多太多接觸，選能在有限的壓力下獨立工作，賺取不錯的報酬。


    沒錯，謝丹尼買下了這家公司，現在他很享受當老闆的生活，經常性穿著丁字褲短褲。'
  - '[PAGE 239]


    # 面對未來的信心


    一旦客戶雇用了你，或你找到想要的客戶時，你的個人商業模式就生效了。現在你已通過驗證及測試的階段，往前來到了執行階段，你的新商業模式已經起飛。做得好！


    你已經走了一段很長的一段路。無論是否完成了本書中的所有練習，我們都希望你能繼續著用你自己的商業模式。最起碼，我們希望你面對自己的職業生涯時，所採用的方式是建立模式（modeling），而不是傳統的做規則（planning），這樣才能找出適作的核心原則做為持續的方向。'
