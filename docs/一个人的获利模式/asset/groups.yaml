    # 你的新假設


    到目前為止，你個人的商業模式大部分

    還是在紙上談兵嗎？


    如果像你也跟大多數人一樣，答案應該是肯定的。我要提醒你的是，紙上談兵只是個個人商業模式，只能代表你對工作的意願的一種主張，充其量只是一種未經體驗到的假設。

    科學家和創業家透過實驗與製作原型來測試假設，我們也應該這樣做。


    因此，接下來的章節將會包括分享你的（人生）目標、尋求回饋以改善你的商業模式、鑑別並分析將在顧客，以及把你個人新的商業模式內對行動。

    首先，我們們要從你對顧客有共同「商業集體價值」著手。這樣做能夠提供你有力的觀點及洞察力，了解顧客如何做雇用決策，以及他們如何決定薪水或費用。


