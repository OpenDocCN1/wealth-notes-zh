    在個人的商業模式中，關鍵資源通常就是你自己，包括你的興趣、技術、能力、性格，以及你所擁有而且能夠控制的資源；但在企業裡，關鍵資源的領域通常涵蓋較廣，例如包含其他的工作者。


    在個人的商業模式裡，通常會將某些無法量化的「軟」成本（例如壓力）及「軟」收益（例如成就感）列入考量；而在企業組織裡，商業模式通常只考慮金錢層面的成本和收益。


