    \ | 人物：婚禮攝影師 | 摘要：重寫客戶的故事 |\n\n崔娜（Trina Bowerman）參加了「個人商業模式」的工作坊，在上亮商業模式之後，她去到講師面前，說她實在找不到講師才講的話，但不知道如何套用在自己身上。\n\
    \n> 講師問：「你從事的是什麼樣的工作？」\n> \n> 她回答：「我是婚禮攝影師。」\n> \n> 「所以，你是用照片來講述婚禮的故事。」\n> \n\
    > 「嗯，從某方面來說……算是吧！」\n> \n> 「那麼，除了婚禮之外，你何不嘗試看看去講述其他故事呢？」\n> \n> 停了片刻，崔娜說道：「謝謝你，今天晚上我會興奮得睡不著了。」\n\
    \n# 價值主張\n\n你如何幫助（顧客）\n\n現在該來定義一下你所提供的價值了。所謂「價值主張」，就是你如何幫顧客完成他們原本要做的工作。如同前面所說的，這是在思考你的職業時最重要的一部分。\n\
    \n定義價值的一個好方法，就是問自己以下這些問題：顧客「雇用」我去執行什麼工作？如果我完成這項工作，顧客會得到什麼好處？\n\n就以我們先前提到的捷飛絡為例，這家公司的價值主張，並非我們表面上看到的、輕鬆更改機油（關鍵活動）的工作；而是由專業人員提供協助所需來的種種好處：解決車子的問題、避免劈割り、減少麻煩。\n\
    \n理解關鍵活動為顧客提供了哪些價值，是個人商業模式最重要的部分。\n\n無論是組織或個人的商業模式，實務上最容易搞錯誤的，就是把關鍵活動當成價值主張。因此，思考所從事的工作或所提供的服務時，要把服務的「內容」和顧客因此得到的「好處」區分清楚。比如說，祕書的工作（關鍵活動）不外乎安排主管的行程、協調會議（人事時地）、處理文書行政等，而其提供的價值主張則是讓老闆（顧客）在日常行政上無後顧之憂，可以專注在營運上。\n\
