    # 4. 如何带孩子进入“量的测量”


    说到量的测量，主要指对事物的长度、面积、轻重、角度等做出的量化描述。


    测量的结果通常由数和计量单位组成。比方说，铅笔长 10 厘米，或者是大石头重 10 千克。


    我要特别提醒你的 是，“量的测量”问题可不是你简单地丢给孩子一把尺子，他就能立马丈量世界这么简单。


    测量的核心意义体现在：当孩子学会用数字和计量单位表达事物的量之后，他们的理解也深化了，学会了“差异的精准化”。


    上一讲是“直觉的主观比较”，而这节课，重点是“准确测量的客观比较”，从主观到客观，这是一个从感性到理性的巨大的思维飞跃。


    为什么说是巨大的思维飞跃呢？'
  - '[PAGE 32]


    我们都知道，人类在进化史上最显著的进步之一就是学会使用工具。孩子们测量的方法从视觉上的“比较”，进化为使用“测量工具”，这是孩子智慧水平的提升，他们对周围世界的理解也更加深刻了。


    # 一、测量能力的四个发展阶段


    第一阶段：目测


    也就是凭直觉用眼睛来观测比较。3-4 岁的孩子已经能够比较出大小、长短、高矮等不同的物体，你只要确定了一种属性，比如“高度”，他们能从 3 个，甚至是 4
    个当中找到“最高”“最矮”和“两个一样高”的物体。


    这时候的孩子并不企图使用任何测量工具，你就算递给他一根木棒，问他“这木棒能帮上忙吗”，他也还是不会用。


    第二阶段：按“量的特征”给物体排序


    “排序”是建立在“比较”的基础上的思维活动。


    3-4 岁的孩子最多能给 4 个以内的物体排序；


    4-5 岁时能增加到 7 个物体；


    5-6 岁的孩子就能给 10 个左右的物体按照某一顺序排序了。


    排序一旦出来，就有一点点“标准”或“单位”的意思了，这就进入了第三阶段。'
  - '[PAGE 33]


    # 第三阶段：自然测量


    自然测量就是利用自然物，比如用一根小棍、一只手或一辆车来测量物体的长短、高矮、粗细等。


    比如我们常说的“一拃一拃”地去测量，就是借助手来自然测量。


    自然测量是要建立在孩子“数概念”的发展，特别是“指着物体说出个数”的能力基础之上的。


    多数孩子到了 **4-5 岁**，就都已经有自然测量的经历了。这个年龄段的孩子恰好“指着物体说出个数”的能力也是显著提升的。


    自然测量让孩子真正从“直觉比较”迈入了“准确测量的客观比较”；自然测量让他们有了参照系，有了他们认为顺手的“工具”。


    在“自然测量”发展稳定之后，把那些自然工具换成尺子，比如“一指宽”换成“厘米”，孩子就有了 厘米“的概念，这样就可以进入第四阶段。


    # 第四阶段：真正意义的测量


    实际上，真正意义的测量大概要到孩子 **5-6 岁**才能理解。


    这一阶段不仅要求孩子具备“指着物体说出个数”的能力，常常还需要有“**10 以内加减**”的计算能力。所以，如果这两部分基础没有打牢，不建议过早地让孩子接触这一阶段。'
  md: '

    在孩子具备“多少”的意识之后，对于同一件事物，增加和减少的动态意识开始萌芽。


    比如孩子会这么说：“我喜欢吃豆子，再多来点好吗？”“我不喜欢吃米饭，少来点行吗？”


    ### 第二阶段

    从任意一个指定数开始口头数数。可以理解为第一讲中“口头数数”的升级版。


    一般孩子学数数都是从 1 开始，当他逐渐熟练之后，就可以引导他从指定数开始。


    比方说从“2”开始，正着数能让孩子知道“2 之后是 3，3 之后是 4”，这是学“+1”计算的基础；


    再比方说从“5”开始，倒着数，就能让孩子知道“5 之前是 4，4 之前是 3”，这是学“-1”计算的基础。


    这一阶段的重点是让孩子养成习惯，碰到某数加 1 的时候，能够脱口而出，而不是再从 1 开始找一遍位置。


    你可不要小看这一步，按照心理学规律，记忆的时候人们更容易记住开头的部分，如果把中间内容调整到开头，就比每次从头记忆更容易记住中间的部分。


    ### 第三阶段

    计算某数+1 和某数-1。


    有了上面这一步，第三阶段计算“某数+1”和“某数-1”孩子通常就会比较轻松地掌握了。


    ### 第四阶段

    数的一般加法。


    也就是在“+1”基础上，解决“某数加几”的问题。


    孩子普遍会对两个相同数的相加有自发的关注，会优先掌握比如1+1，2+2或5+5，这可以成为你在本阶段加法启蒙的突破点。


    ### 第五阶段

    数的一般减法。


    也就是“某数减几”，是第四阶段的逆向过程。


    ## 二、应该怎么教孩子数的计算呢？


    和上一讲一样，仍然要把数学知识和数学思维融入生活和游戏中，反复练习，潜移默化。下面我就教你几招：


    ### 第一招：用聊天启发孩子的计算意识


    平时你和孩子的对话，就可以通过提问和回答，激发孩子去思考，让“数的计算”走进孩子的世界。


    比如“宝贝，给你三瓣橘子，还要吗？”“你已经吃了2块糖了，再给你1块儿，不能再要啦！”


    刚开始启发孩子计算意识的时候，你并不需要很严格地用标准词汇，只要能表达出增加和减少的意义来，怎么方便让孩子理解，就怎么交流。


    ### 第二招：用手指操学习 10 以内加减法


    在孩子知道了左手 5 根手指，右手 5 根手指以后，就可以教 5 以内的加法运算了。


    让孩子左手握成拳头，伸长大拇指，然后再伸出食指，这就是“1+1”，这时要让孩子大声数一数伸展的手指个数，是“2”，孩子就知道了“1+1 = 2”。


    如果在只伸展大拇指的情况下，再同时伸出其他两根手指，就是认识“1+2”了……


    像这样，利用一只手不仅可以学到“1+4”，其他 5 以内的加法计算都可以搞定。


    同理，如果左手、右手联合起来，用上面的方法就可以学到 10 以内的加法计算了。


    我在第一课中教了“手指操”，如果双手举起对称着玩儿，就衍生出相同数相加的游戏了，它们就是 2，4，6，8，10。


    用手指教孩子减法，就是上面加法的逆过程。


    比如十个手指都伸展，让孩子说出伸展的手指数，然后你说“弯曲左手大拇指，再数数看”。


    如果孩子说是“9”，进一步问“10比9多多少？”这就教孩子认识了“10-9”的减法计算。


    用双手学加减的好处在于：孩子可以直观地感受到增加、减少的过程，干扰因素极少，孩子的学习效果就会很棒，也减少了你寻找其他工具的麻烦。


    另外，用小手指学计算，还可以锻炼孩子手指的精细动作能力，强化脑区各个部分的感觉综合。


    ### 第三招：画一画找答案


    每个孩子都喜欢涂一涂、写一写、画一画，这个方法也是目前国际上非常推崇的数学教育法。


    如果你的孩子喜欢画圆圈，你可以给孩子示范画1个圆圈、2个圆圈，多至10个圆圈，还可以按指定数目画圆圈；通过圆圈的数量变化掌握10以内的加减法。


    如果指定好格式：2个一组，3个一组地画圆圈，孩子还会慢慢发现“2个2是4，2个3是6”的规律，甚至更复杂的规律他们也能看出来。


    你也可以在圆圈旁边写上阿拉伯数字，让他们越来越熟悉数字这种抽象的符号和个数的这种对应关系。


    当然，圆圈也可以用竖线、小星星等代替，来增加趣味性。


    ### 第四招：在游戏中观察加减结果


    教你两个百搭游戏，可以视情况运用到孩子不同的发展阶段。


    #### 1. 帮妈妈分豆子


    首先，你和孩子各拿一只碗，你的碗里盛着黑豆，孩子的碗里盛着黄豆。


    在不同的数的计算的发展阶段，你就可以提出不同的问题了。


    比如，你可以说“妈妈不够，我给自己再来一些黑豆”，这是教孩子理解“更多”；


    如果孩子可以脱口而出自己碗里豆子的个数，你可以问：“从妈妈碗里再拿1颗，你碗里变成多少颗了？”这是教他们“某数+1”；


    当你跟他说“给我3颗吧，这样我就有6颗了，不信你数数？”这就是教他们“某数加几”了。


    这个游戏的要点是：语言提示要配合作，准确简练，方便孩子理解。


    如果是第一次做这样的游戏，妈妈要先示范，以后逐步让孩子去拿取、观察豆子是怎么增加的，同时说出他们观察到的结果。


    #### 2. 捉迷藏


    几乎没有孩子不喜欢捉迷藏，在捉迷藏中也可以融入“数的计算”。


    比如找毛绒玩具，游戏前，你可以和孩子先确定好规则，比如“谁先找到3个谁就获胜”。


    妈妈当裁判，爸爸和孩子一起找，每找到一个，妈妈就高兴地宣布“又增加了 1 个，2 个变 3 个啦！”


    也可以让孩子当裁判，让他说出这个增加的过程。


    你可以随时根据孩子的能力调整规则，并鼓励孩子在碰到大数的时候，依靠数手指找到答案。


    这个亲子游戏的好处在于让孩子的身体也活动起来，避免总是在家坐着不动，边动身体边动脑，孩子兴致会更高，对数的加减结果印象也更深。


    我要提醒你，数的计算是很消耗脑力的活动，游戏的时间不宜过长，十几分钟就是够了，否则孩子对游戏产生疲倦和厌恶就不好了。


    ### 第五招：利用绘本学习数的计算


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_19_0.png)


    我给你推荐一个非常好用的绘本，叫《9 只小猫呼呼呼》，故事是这样开始的：


    “9 只小猫呼-呼-呼.”


    “1 只小猫睡醒了。叭！几只小猫在睡觉？”


    怎么样，是不是很自然、很形象地就让孩子理解了“某数-1”呢？


    接下来每翻一页，孩子都能体会数字又减少了 1，结果变成了几。这个故事念不了几次，孩子基本就可以独立阅读、独立讲出减少的过程了。


