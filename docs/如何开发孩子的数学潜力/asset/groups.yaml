    # 3. 猜猜这是谁？


    这个游戏最适合在家里玩。游戏的规则是，让一个人不能说话，在很短的一分钟内扮演一种动物，其他人根据表演，来猜这是什么动物。


    游戏既可以是“你演孩子猜”，也可以是“孩子演你来猜”。这其中，孩子表现出的知识量和思维能力，经常会给你意外的惊喜。


    同时，在这个扮演、推测的过程中，也能不断巩固孩子对动物特征的理解，并且在理解的基础上进一步判断和推理。


    第四招：在童谣中提升


    利用童谣的有趣情节和朗朗节奏，发展“逻辑思维”。


    这样的童谣有很多，比如：


