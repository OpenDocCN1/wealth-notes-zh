  - '[PAGE 21]


    最后我还要跟你强调一点，千万别一看到孩子在生活中偶尔掌握了“几加几”的结果，就着急地让他练习符号上的算术。


    从事物的增加减少，到事物数量的加减，最后到符号上的加号和减号，要经历一个比较长的过程，一定要视孩子的接受情况而定。


    拔苗助长，让孩子对数学失去兴趣，或者留下“数学很难，我根本学不会”的消极心理，那样就得得不偿失了。


    # 本讲小结


    今天我讲了怎样教孩子10以内的加减，有两个游戏非常好，画圈圈和捉迷藏，这些游戏对“数字的计算”启蒙非常有益，把10以内的加减学扎实，对后面的数学学习非常重要。


    # 3. 如何教孩子认识“量”


    什么叫“量”呢？


    从本质上说，“量”表示的是事物的一种属性，比如长短、高低、大小、粗细、轻重等，都属于量的概念。


    比方说“你的身高是2米”，它表示：人人都有身高，而你不同于其他人的是，你有2米高。从属性到差别，再到数值，这才是“一个量”所代表的完整含义。'
  - '[PAGE 22]


    所以，“量概念”的启蒙首先是识别物体的属性，然后就同一属性进行比较，这是“从属性到差别”这一步。


    在比较中会进一步产生“标准”和“单位”，于是就有了“测量”；测量出相对精确的数值后，就可以进行“量的计算”了，这就完成了“从差别到数值”的理解升级。


    孩子对“量”的启蒙，基本上就遵照这样的过程。


    这一讲，我就先跟你谈谈“从属性到差别”这一步，这一步的核心是通过“比较”让孩子理解“量的大小”。


    比如知道两根铅笔谁长谁短，两个房间谁大谁小，两袋面粉谁轻谁重等，从无到有地建立起量的概念。下一讲再讨论量的测量与计算。


    # 一、孩子对物体属性的认识


    孩子在 1-2 岁的时候，“量”的意识就开始萌芽了。但你要注意的是，孩子对不同属性的理解并不是均衡发展的。


    一般 2 岁左右的孩子，能对不同大小的物体做出反应；


    到了 3 岁，不仅能区分大小，对长短也可以简单表达了；


    而 对于物体重量上的不同，大多数孩子在 3 岁时还不能判断出明显差异，直到 4 岁才基本能用正确词汇表达出来。'
  - '[PAGE 23]


    大部分孩子在 4-5 岁已经能掌握很多的属性概念，知道怎么比较事物的大小、轻重、高矮、粗细、厚薄等，靠目测，就能够从五六根长短不同的铅笔中，选出两根一样长的来。


    不同的孩子在“量概念”的发展方面早晚快慢是不同的，如果你能够在适当的阶段，给孩子有益的引导，就可以帮助他们更好地认识高矮、大小、长短这些事物的属性。


    这不仅能让孩子更有效地理解和掌握“量的概念”，也能极大地提升孩子认识和判断周围环境的能力。


    # ## 二、如何帮孩子理解“量”？


    教你 4 招给孩子建立“比较”的意识，理解“量的大小”。


    第一招：串珠游戏


    准备几根细线、几组大小不同的串珠，你就可以和孩子一起玩起来了，亲手制作一串漂亮的珠链，同时又启蒙孩子的长短、大小意识。


    在孩子量概念发展的不同阶段，你可以有不同的玩法：


    如果你是一串，孩子一串，你就可以问孩子“你的长还是妈妈的长？”这是让孩子从事物的单一属性中，找出差别来。


    如果有 2 串大珠，孩子有了 2 串小珠，你可以问孩子“两串大珠哪串长呢？”或者是，“找出小的那两串，看看它们中哪条长哪条短？”'
  - '[PAGE 24]


    这样的发问，不仅能引发孩子对事物属性大小、长短的思考，还在某一种属性中锻炼了他们找出差别的能力。


    当你问孩子串珠的长度时，如果孩子伸出小手指开始数“1 个、2 个、3 个、4 个”，通过串珠的个数告诉你答案，那说明孩子已经找到了准确的测量方法，用串珠的个数这个数学概念来描述长度这个属性了。


    在这个游戏中，串珠不仅在数量上可以由少变多，种类上也可以不断增加。这样，随着孩子思维能力的提高，游戏可以不断玩出新花样。


    小手动一动，让串珠对准细线的过程还是绝妙的手指操运动，对锻炼孩子的精细动作能力也非常有用。


    第二招，充分利用身边事物。


    用“你问我答”的方式，帮助孩子认识不同的属性，建立“量的概念”，同时完善孩子的量词词汇。


    一个很好的活动就是整理玩具。相信每个有孩子的家里都绝对少不了琳琅满目的玩具，那就赶快和孩子玩个分类游戏吧。


    你可以通过分类标准的设计，让孩子在其中积累长短、粗细、厚薄，甚至是轻重有关的“量概念”的属性特征，让孩子收获“量”的最直接的“感性经验”。


    你还可以通过提问，随时了解孩子的分类水平，比如“为什么把这根笔放这个盒子里？”“小的球都找回来了吗？”……'
  - '[PAGE 25]


    另外，生活中的“量概念”比比皆是，只要留心都可以为我所用。


    比如包饺子的时候，给孩子一点面团，揉一揉抻一抻再拍扁，长短大小自然就来；


    吃饭的时候，两根黄瓜可以比一比长短，两个盘子也可以比一比大小；


    妈妈和爸爸站在一起，就可以问孩子了：“我俩谁高、谁矮呀？”


    如果孩子一时答不出来，你可以边用手比划，边提示孩子：“你看，妈妈的最高刚刚到爸爸的肩膀。可是爸爸却这么高！”


    这时候孩子就会跟着你说出“爸爸高，妈妈矮！”你还可以继续引导他说，“那你和爸爸也比一比吧。”


    有很重要的一点要特别提醒：越是早期的启蒙，越是要注意你选取的物体属性要比较突出，没有过多的干扰因素。


    比如两根铅笔的粗细颜色都相同，只比较长短；


    两块面团比大小，也要注意厚度尽量一致，只比较面积。


    这样，孩子才能迅速抓住问题的关键，建立“量的概念”。


    第三招，让童谣来帮忙。


    比如，对于“重量”的理解，一个特别好的活动就是和孩子去玩跷跷板。你可以一边玩一边教给孩子这段童谣：'
