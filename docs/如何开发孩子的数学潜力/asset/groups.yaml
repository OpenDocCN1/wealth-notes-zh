    今天我讲了怎样教孩子10以内的加减，有两个游戏非常好，画圈圈和捉迷藏，这些游戏对“数字的计算”启蒙非常有益，把10以内的加减学扎实，对后面的数学学习非常重要。


    # 3. 如何教孩子认识“量”


    什么叫“量”呢？


    从本质上说，“量”表示的是事物的一种属性，比如长短、高低、大小、粗细、轻重等，都属于量的概念。


    比方说“你的身高是2米”，它表示：人人都有身高，而你不同于其他人的是，你有2米高。从属性到差别，再到数值，这才是“一个量”所代表的完整含义。


    所以，“量概念”的启蒙首先是识别物体的属性，然后就同一属性进行比较，这是“从属性到差别”这一步。


    在比较中会进一步产生“标准”和“单位”，于是就有了“测量”；测量出相对精确的数值后，就可以进行“量的计算”了，这就完成了“从差别到数值”的理解升级。


    孩子对“量”的启蒙，基本上就遵照这样的过程。


    这一讲，我就先跟你谈谈“从属性到差别”这一步，这一步的核心是通过“比较”让孩子理解“量的大小”。


    比如知道两根铅笔谁长谁短，两个房间谁大谁小，两袋面粉谁轻谁重等，从无到有地建立起量的概念。下一讲再讨论量的测量与计算。


    ## 一、孩子对物体属性的认识


    孩子在 1-2 岁的时候，“量”的意识就开始萌芽了。但你要注意的是，孩子对不同属性的理解并不是均衡发展的。


    一般 2 岁左右的孩子，能对不同大小的物体做出反应；


    到了 3 岁，不仅能区分大小，对长短也可以简单表达了；


    而 对于物体重量上的不同，大多数孩子在 3 岁时还不能判断出明显差异，直到 4 岁才基本能用正确词汇表达出来。


    大部分孩子在 4-5 岁已经能掌握很多的属性概念，知道怎么比较事物的大小、轻重、高矮、粗细、厚薄等，靠目测，就能够从五六根长短不同的铅笔中，选出两根一样长的来。


    不同的孩子在“量概念”的发展方面早晚快慢是不同的，如果你能够在适当的阶段，给孩子有益的引导，就可以帮助他们更好地认识高矮、大小、长短这些事物的属性。


    这不仅能让孩子更有效地理解和掌握“量的概念”，也能极大地提升孩子认识和判断周围环境的能力。


    ## 二、如何帮孩子理解“量”？


    教你 4 招给孩子建立“比较”的意识，理解“量的大小”。


    ### 第一招：串珠游戏


    准备几根细线、几组大小不同的串珠，你就可以和孩子一起玩起来了，亲手制作一串漂亮的珠链，同时又启蒙孩子的长短、大小意识。


    在孩子量概念发展的不同阶段，你可以有不同的玩法：


    如果你是一串，孩子一串，你就可以问孩子“你的长还是妈妈的长？”这是让孩子从事物的单一属性中，找出差别来。


    如果有 2 串大珠，孩子有了 2 串小珠，你可以问孩子“两串大珠哪串长呢？”或者是，“找出小的那两串，看看它们中哪条长哪条短？”


    这样的发问，不仅能引发孩子对事物属性大小、长短的思考，还在某一种属性中锻炼了他们找出差别的能力。


    当你问孩子串珠的长度时，如果孩子伸出小手指开始数“1 个、2 个、3 个、4 个”，通过串珠的个数告诉你答案，那说明孩子已经找到了准确的测量方法，用串珠的个数这个数学概念来描述长度这个属性了。


    在这个游戏中，串珠不仅在数量上可以由少变多，种类上也可以不断增加。这样，随着孩子思维能力的提高，游戏可以不断玩出新花样。


    小手动一动，让串珠对准细线的过程还是绝妙的手指操运动，对锻炼孩子的精细动作能力也非常有用。


    ### 第二招：充分利用身边事物


    用“你问我答”的方式，帮助孩子认识不同的属性，建立“量的概念”，同时完善孩子的量词词汇。


    一个很好的活动就是整理玩具。相信每个有孩子的家里都绝对少不了琳琅满目的玩具，那就赶快和孩子玩个分类游戏吧。


    你可以通过分类标准的设计，让孩子在其中积累长短、粗细、厚薄，甚至是轻重有关的“量概念”的属性特征，让孩子收获“量”的最直接的“感性经验”。


    你还可以通过提问，随时了解孩子的分类水平，比如“为什么把这根笔放这个盒子里？”“小的球都找回来了吗？”……


    另外，生活中的“量概念”比比皆是，只要留心都可以为我所用。


    比如包饺子的时候，给孩子一点面团，揉一揉抻一抻再拍扁，长短大小自然就来；


    吃饭的时候，两根黄瓜可以比一比长短，两个盘子也可以比一比大小；


    妈妈和爸爸站在一起，就可以问孩子了：“我俩谁高、谁矮呀？”


    如果孩子一时答不出来，你可以边用手比划，边提示孩子：“你看，妈妈的最高刚刚到爸爸的肩膀。可是爸爸却这么高！”


    这时候孩子就会跟着你说出“爸爸高，妈妈矮！”你还可以继续引导他说，“那你和爸爸也比一比吧。”


    有很重要的一点要特别提醒：越是早期的启蒙，越是要注意你选取的物体属性要比较突出，没有过多的干扰因素。


    比如两根铅笔的粗细颜色都相同，只比较长短；


    两块面团比大小，也要注意厚度尽量一致，只比较面积。


    这样，孩子才能迅速抓住问题的关键，建立“量的概念”。


    ### 第三招：让童谣来帮忙


    比如，对于“重量”的理解，一个特别好的活动就是和孩子去玩跷跷板。你可以一边玩一边教给孩子这段童谣：


    《跷跷板》

    宝宝轻，爸爸重；

    跷跷板，一起上；

    秤，一个跌地下；

    秤，一个飞天上。


    另外，很多童谣中都有量的概念和比较，比如走在户外时，可以用下面两首童谣。


    《大马路，宽又宽》

    大马路，宽又宽，

    小胡同，窄又窄，

    大汽车，小汽车，来来往往跑得欢。

    小朋友，站路边，

    要去对面幼儿园。

    左瞧瞧，右看看，

    交通法规不能忘。


    《绕口令》

    扁担长，板凳宽，

    扁担没有板凳宽，

    板凳没有扁担长。

    扁担要绑在板凳上。

    板凳不让扁担绑在板凳上。

    扁担偏要绑在板凳上。

    板凳偏不让扁担绑在板凳上。


    ### 第四招：发掘绘本中量的元素


    我给你推荐两个启蒙“量概念”非常好用的绘本。


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_26_0.png)


    一个是《我爸爸》，在丰富孩子对事物属性的认知方面，这个绘本再好不过了。


    故事中的爸爸就是孩子眼里的爸爸：他是那样高大，那样强壮，以至于爸爸的每一个镜头，都是我们在仰视他。


    绘本用这样的文字介绍着这位“独一无二”的爸爸：


    “我爸爸吃得像马一样多。


    游得像鱼一样快。


    我爸爸像房子一样高大。”


    你瞧，每一句话，都可以延展出丰富的“量概念”：大与小、多和少、快和慢……


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_27_0.png)


    还有一个绘本我猜你家也有，《猜猜我有多爱你》。这个故事很流行，相信你给孩子读的时候是告诉他这是一个“爱”的故事。


    这个故事从小兔子的提问“猜猜我有多爱你”开始，大兔子和小兔子不断用各种各样的“量”，来表示“爱”的程度。


    比如“我的手举得有多高，我就有多爱你。”


    “我跳得多高，就有多爱你。”


    可以说，这简直就是给“量”打造的一本绘本。


    ## “强概念”启蒙的绘本清单


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_29_0.png)


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_29_1.png)


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_29_2.png)


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_29_3.png)


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_29_4.png)


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_29_5.png)


    这节课的最后，我再说一点很多家长可能会犯的小毛病。有时候，你可能觉得呀呀学语的小孩子很好玩儿，就开始逗他。


    比如明明你的孩子比另一个孩子高，你却非说“哎呀！你怎么这么矮呀！”


    明明你给了孩子最大的一个苹果，你却故意说“这是最小的”。


    这些不经意的逗趣，最容易混淆孩子一开始对某些量概念的理解。如果你这样做过，那么今天回到家就要改一改了。


    对于大一点的孩子，一旦他掌握了其中的玄机，反过来用反义词逗你，这倒是一件好玩有趣的事情。那你就抓住这个机会和孩子干脆来个“量”的反义词游戏吧。


    ## 本讲小结


    首先，“量”从本质上来说表示的是事物的一种属性，比如长短、高低、大小、粗细、轻重等等。


    从属性到差别，再到具体数值，才是“一个量”所代表的完整含义。


    我反复强调：“量”的启蒙离不开“比较”，要随时结合孩子的日常活动和身边事物，在比较中让孩子理解量的大小。


    你一定要记得多和孩子玩串珠游戏，这不仅可以帮助孩子理解“量的概念”，还可以锻炼手指精细动作。


    你也一定已经有《猜猜我有多爱你》这个绘本，现在你可以再找出来，和孩子读一读，和孩子一起玩“量”的游戏。


    可以这样说，越早给孩子启蒙“量”的知识，孩子就越能更早、更准确地去认识自己生活的这个世界。


    # 4. 如何带孩子进入“量的测量”


    说到量的测量，主要指对事物的长度、面积、轻重、角度等做出的量化描述。


    测量的结果通常由数和计量单位组成。比方说，铅笔长 10 厘米，或者是大石头重 10 千克。


    我要特别提醒你的 是，“量的测量”问题可不是你简单地丢给孩子一把尺子，他就能立马丈量世界这么简单。


    测量的核心意义体现在：当孩子学会用数字和计量单位表达事物的量之后，他们的理解也深化了，学会了“差异的精准化”。


    上一讲是“直觉的主观比较”，而这节课，重点是“准确测量的客观比较”，从主观到客观，这是一个从感性到理性的巨大的思维飞跃。


    为什么说是巨大的思维飞跃呢？


    我们都知道，人类在进化史上最显著的进步之一就是学会使用工具。孩子们测量的方法从视觉上的“比较”，进化为使用“测量工具”，这是孩子智慧水平的提升，他们对周围世界的理解也更加深刻了。


    ## 一、测量能力的四个发展阶段


    ### 第一阶段：目测


    也就是凭直觉用眼睛来观测比较。3-4 岁的孩子已经能够比较出大小、长短、高矮等不同的物体，你只要确定了一种属性，比如“高度”，他们能从 3 个，甚至是 4
    个当中找到“最高”“最矮”和“两个一样高”的物体。


    这时候的孩子并不企图使用任何测量工具，你就算递给他一根木棒，问他“这木棒能帮上忙吗”，他也还是不会用。


    ### 第二阶段：按“量的特征”给物体排序


    “排序”是建立在“比较”的基础上的思维活动。


    3-4 岁的孩子最多能给 4 个以内的物体排序；


    4-5 岁时能增加到 7 个物体；


    5-6 岁的孩子就能给 10 个左右的物体按照某一顺序排序了。


    排序一旦出来，就有一点点“标准”或“单位”的意思了，这就进入了第三阶段。


    ### 第三阶段：自然测量


    自然测量就是利用自然物，比如用一根小棍、一只手或一辆车来测量物体的长短、高矮、粗细等。


    比如我们常说的“一拃一拃”地去测量，就是借助手来自然测量。


    自然测量是要建立在孩子“数概念”的发展，特别是“指着物体说出个数”的能力基础之上的。


    多数孩子到了 **4-5 岁**，就都已经有自然测量的经历了。这个年龄段的孩子恰好“指着物体说出个数”的能力也是显著提升的。


    自然测量让孩子真正从“直觉比较”迈入了“准确测量的客观比较”；自然测量让他们有了参照系，有了他们认为顺手的“工具”。


    在“自然测量”发展稳定之后，把那些自然工具换成尺子，比如“一指宽”换成“厘米”，孩子就有了 厘米“的概念，这样就可以进入第四阶段。


    ### 第四阶段：真正意义的测量


    实际上，真正意义的测量大概要到孩子 **5-6 岁**才能理解。


    这一阶段不仅要求孩子具备“指着物体说出个数”的能力，常常还需要有“**10 以内加减**”的计算能力。所以，如果这两部分基础没有打牢，不建议过早地让孩子接触这一阶段。

