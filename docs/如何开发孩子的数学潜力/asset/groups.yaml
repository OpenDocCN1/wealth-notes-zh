    \n## 1. 如何教孩子理解“数的概念”\n\n首先我要提醒你，“数的概念”并不仅仅是教孩子会数数。“数概念”的核心是要理解事物与数的对应。\n\n比方说，“3”既可以对应\
    \ 3 个橘子，也可以对应 3 颗葡萄，还可以对应 3 只杯子，这是数的实际意义。\n\n而会数数，只是记住了数的顺序，比如知道 1 之后是 2，2 之后是\
    \ 3。如果孩子能流利地从 1 数到 10，却不知道 1、2、3 分别对应多少物体，并不表示理解了数的概念。\n\n通过上面的解释，我相信你能够看出来，一个孩子如果理解了“数的概念”，知道“3”既可以表示\
    \ 3 个橘子、3 颗葡萄，也可以表示 3 只杯子，那就说明他的抽象思维开始发展了。\n\n所以，“数概念”可以说是幼儿数学思维启蒙的开端，也是孩子后续开展一切数学活动的基础。\n\
    \n在第一课，我就给你讲讲怎样给孩子启蒙“数的概念”。\n\n### 数概念发展的五个阶段\n\n### 第一阶段：分辨多和少\n\n早在孩子 1 岁左右的时候，对于自己爱吃的食物、爱抓的玩具，就开始表现出“我要多的那一碗”，“我喜欢多的那一堆”。\n\
    \n不管是用动作还是语言来实现自己的目的，都说明他们已经有了“多和少”的概念。\n\n### 第二阶段：口头数数\n\n也就是会数 1、2、3、4、5，一直到\
    \ 10、20，或者到 100。\n\n两到三岁是孩子口头数数的关键期。“口头数数”的能力与孩子的语言发育以及家庭教育紧密相关。很多孩子在家长的引导下，利用数的节奏性和循环重复的韵律感就可以轻松学会数数。\n\
    \n一般来说，绝大多数孩子到了 5~6 岁都能数到 100。\n\n靠着第二阶段“口头数数”的桥梁作用，在孩子能“分辨多和少”的基础上，你稍微做一些问答引导，或者对物体做一些类似“多\
    \ 1 个”“少 1 个”的变换互动，孩子就会迅速发展到第三阶段。\n\n### 第三阶段：凭直觉报数\n\n“凭直觉报数”通常指对于 5 以下的数字，孩子能够凭直觉瞬间说出物体的个数。\n\
    \n### 第四阶段：指物说数（即“点数”）\n\n也就是一边用手指一个物体，一边口头对应说出一个数。大多数孩子在 2 岁半左右都能够指物说到 2 或 3。\n\
    \n### 第五阶段：按数取物\n\n也就是给孩子说个数，让他取出对应个数的物体。这个阶段其实是第四阶段“指物说数”的逆向过程。\n\n掌握了第四和第五个阶段，孩子对于“数的概念”基本上就建立起一个清晰的认知了。\n\
    \n大多数孩子在五到六岁这个年龄段都可以数到 100，掌握到对于接近 100 的数字指着物体可以说出数字和按照数字可以拿对事物。\n\n但是孩子的整个学习节奏并不均匀。通常，1、2、3、4、5\
    \ 掌握起来相对容易，而 6、7、8、9、10 却比较难。\n\n而 1-10 掌握好了，再学习 10 以上的数字，由于数字有节奏的重复性和规律性，更大的数字反而不会花费孩子更多的精力，就可以比较快地掌握。\n\
    \n所以，让孩子理解数的概念，你要把重点放在数字 1-10 上。\n\n具体应该怎么教孩子理解数的概念呢？\n\n你首先要记住一点，给孩子做数学启蒙，千万不要像我们上数学课一样，郑重其事地坐下来，你教他学；或者做了几遍练习之后，就指望他能跟你数下来。\n\
    \n这些都不要做，那么该做什么呢？\n\n给孩子做数学启蒙，最好的办法是把数学概念和数学思维巧妙地融入生活和游戏中，然后和孩子反复练习，潜移默化，千万不要贪多求快。\n\
    \n这一点，适用于我们今天教孩子理解“数的概念”，也同样适用于后面的课程。\n\n怎么在游戏中给孩子启蒙“数的概念”，下面我就教你几招：\n\n### 第一招：在聊天中学数字\n\
    \n平时，你在和孩子说话的时候，可以有意识地加入数字。比如：\n\n“门口有两只鞋，你拿过来穿上怎么样？”\n\n“刚刚飘走的是什么？是不是 1 个红气球，3\
    \ 个黄气球？”\n\n“哦，爸爸抢走了所有的皮球。看你能抢回来几个？”\n\n在一岁六个月左右，孩子就可以试着理解和思考这样的语言了。而且，语言发育初期是孩予非常乐意模仿的年龄。\n\
    \n如果你刚才的话还伴随高兴、惊讶等情绪的变化，孩子就更有兴致了，他会乐此不疲地在这样的交流和模仿中，提高数字的表达力和理解力。\n\n### 第二招：用手指操认数字\n\
    \n几乎所有的孩子都会有一个掰着手指头数数的阶段，这其实就是最简便易行的“指物说数”了。人类的数学最终选择了十进制，跟我们有 10 根手指有很大关系。\n\n\
    所以，让双手参与到数概念发展的每个阶段，是一个非常直观且孩子容易接受的办法。比如，一组简单易学的手指操就可以让孩子手、口、眼协同起来认识数字 1-5：\n\n\
    > 《手指操》\n> 一只小狗汪汪叫，\n> 两只小兔跳跳跳，\n> 三只孔雀真骄傲，\n> 四只小猫喵喵喵，\n> 五只小鸟飞得高。\n\n“一”的时候竖起大拇指，这是小狗的耳朵；\n\
    “二”的时候竖起食指和中指，这是小兔的耳朵；\n“三”的时候拈起大拇指和食指，这是孔雀的嘴巴；\n“四”的时候四指弯曲，这是猫爪；\n“五”的时候五指伸展，这是鸟的翅膀。\n\
    \n1-5 熟练了，第二只手参与进来就可以玩 6-10 了，比如可以让“10 个兄弟排排队”。\n\n如果把你的大手也加上，开动脑筋创造出更多有趣的游戏，就可以让孩子对\
    \ 20 甚至更大的数字都有最直观的感受了。\n\n总而言之，手指人人自带，不需要借助其他工具，随时随地都可以玩起来，是学数学非常有利的教具。\n\n在后面的课程中，手的作用也可以一直贯穿其中，我会教你更多手的妙用。\n\
    \n### 第三招：用游戏练习点数\n\n教你百搭小游戏，这两个游戏的灵活度和开放性非常强，在我们前面讲的五个阶段都能用起来。\n\n**游戏一**：帮妈妈分豆子。当然，爸爸也可以玩。\n\
    \n拿两只碗，一只空碗，另一只盛着黑豆和黄豆。你可以先给孩子布置一个任务来开启数概念的启蒙，比如“把所有黑豆，拿到另一个碗里。”\n\n孩子完成以后，在不同的数概念发展阶段，你就可以提出不同的问题了。\n\
    \n比如问他“哪只碗里的豆子多？”就可以考验孩子分辨多少的意识；\n再问他“这只碗里有几颗黄豆？”“宝贝，给妈妈数数看，是不是 4 颗？”可以锻炼孩子“指物说数”的能力；\n\
    如果你再跟他说：“给妈妈拿 3 颗黄豆和 6 颗黑豆。”就可以锻炼孩子“按数取物”的能力。\n\n**游戏二**：搭积木\n\n第二个游戏非常常见，和上一个游戏一样，同样可以根据积木的多少和点数，来帮助孩子发展数概念。\n\
    \n此外，“口头数数”也可以贯穿到孩子搭积木的全过程。积木数量越多，这个游戏的趣味性、互动性就越强。\n\n你可以和孩子说：\n\n“我们来搭一座高高的塔！”\n\
    “给你，1、2、3、4、5、6，好，6块吧！”\n“哇！1、2、3、4、5、6，你竟然搭出一座6层的高塔！”\n\n不断重复这个过程，孩子就自然而然地开始模仿你口头数数了。\n\
    \n### 第四招：唱数字童谣，加强数字记忆\n\n童谣富有韵律和节奏感，孩子往往特别爱听，而且爱跟着学唱。不少童谣都含有数字元素，而且是重复出现，对孩子发展概念、记忆数字非常有效。\n\
    \n比如：“酸酸的草莓1、2、3；长长的香蕉1、2、3；红红的苹果1、2、3。”\n\n这样的童谣听几遍，不用你教，孩子自然会数123了。\n\n类似的还有：\n\
    \n> 《拍手歌》\n> 你拍一，我拍一，一个小孩开飞机；\n> 你拍二，我拍二，两个小孩梳小辫；\n> 你拍三，我拍三，三个小孩爬大山；\n> 你拍四，我拍四，四个小孩写大字；\n\
    > 你拍五，我拍五，五个小孩敲锣鼓；\n> 你拍六，我拍六，六个小孩吃石榴；\n> 你拍七，我拍七，七个小孩穿新衣；\n> 你拍八，我拍八，八个小孩吃西瓜；\n\
    > 你拍九，我拍九，九个小孩齐奔走；\n> 你拍十，我拍十，十个小孩吃甜食。\n\n这里配合数字还加入了动作，孩子会很喜欢。\n\n### 第五招：发掘绘本中的数字元素\n\
    \n我给你推荐两个启蒙数概念非常好用的绘本。\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_9_0.png)\n\n\
    《好饿的毛毛虫》，这是一本很容易让孩子对数产生兴趣的绘本。故事是这么讲的：\n\n“星期一，它吃了一个苹果。可是，肚子还是好饿。\n星期二，它吃了两个梨。可是，肚子还是好饿。\n\
    星期三，它吃了三个李子。可是，肚子还是好饿。”\n\n如果是第一次读，你可以问孩子：“猜猜接下来可能发生什么？”如果孩子已经熟悉了故事，你可以和孩子你一天、我一天地讲述毛毛虫吃掉什么，或者干脆把故事变成数字填空来和孩子玩儿。\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_10_0.png)\n\n另一个是格林童话《狼和七只小羊》。对于大一点的孩子来说，可以用这本书进行角色扮演，创造数字情境游戏。\n\
    \n比如，召集几个小伙伴到家里来，你给他们读这个故事，然后让孩子们扮演小山羊，排成一排，你当山羊妈妈进行点数，同时让小山羊报数。\n\n或者让孩子们自己行动，给每只小羊分一块蛋糕、一瓶水。还可以让爸爸当大灰狼，丰富情节。\n\
    \n这样一来，数字就趣味盎然地走进了孩子们的世界，不管是让孩子指着物体说数字，还是按照数字取物品，都可以这么有意思！孩子会很热熟悉和喜欢上数字，它们一点都不枯燥！\n\
    \n这节课的最后，我还想纠正一个误区：**数概念的核心是事物和数的对应，但这个“数”不仅仅是指阿拉伯数字 1、2、3。**\n\n一般来说，阿拉伯数字符号的书写和应用，要放到孩子掌握了数的实际意义以后再引入会比较合适。\n\
    \n过早教孩子认或者写阿拉伯数字，不但没必要，而且可能会干扰孩子对“数概念”的理解。\n\n### 本讲小结\n\n这一讲，我讲了孩子“数的概念”的启蒙。“数概念”的核心是理解事物与数的对应，而不仅仅是会数数。\n\
    \n孩子“数概念”的发展大致要经历 5 个阶段，在这五个阶段中，我教了你很多游戏，还告诉你怎么用手指操、童谣来和孩子一起玩数学。\n\n在日常交流中你要常常提及数字，用绘本和孩子一起进入数字的世界，让孩子充满趣味地和我们一起玩数学，打好“数概念”基础。\n\
    \n## 2. 如何教孩子“数的计算”\n\n在第二讲，我要跟你谈谈怎样教孩子理解“数的计算”，对于 6 岁以前的孩子，“数的计算”仅限于加法和减法。\n\n\
    大多数孩子在 3-4 岁的时候，可以掌握到 5 以内的加减法；4-5 岁可以掌握到 10 以内；如果正确启蒙，5-6 岁，应该可以掌握 20-25 以内的加减法。\n\
    \n所以，按照 1-5、6-10 和 10 以上，来分组来学“数的计算”是比较科学的启蒙办法。\n\n这一讲，主要说“10 以内加减法”的启蒙。\n\n本质上，数的加减就是事物数量的增加和减少。\n\
    \n这里我着重强调“事物数量”，而不仅仅是“数量”，就是想提醒你，刚开始教孩子加减法的时候，要充分利用实物，让他们在操作中理解加减。\n\n比方说，“3+1”要尽量让孩子从\
    \ 3 颗草莓加上 1 颗草莓、3 只杯子加上 1 只杯子、3 本图画书加上 1 本图画书，这样去理解。\n\n过早地丢开实物，去训练孩子抽象的加和减，对孩子而言是比较困难的，也不能达到好的效果。\n\
    \n### 一、计算能力发展的五个阶段\n\n10 以内的“数的加减”，孩子主要经历这样几个阶段：\n\n第一阶段，分辨更多或更少。\n"
