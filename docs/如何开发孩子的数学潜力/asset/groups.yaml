  md: '

    了解了孩子在“量的测量与计算”能力上的几个发展阶段，相信你已经对如何引导孩子一步一步进阶，有一些自己的想法了。


    ## 二、怎样引导孩子进行“量的测量”？


    教你5个简单易学的方法，你可以在此基础上继续发挥。


    ### 第一招：用手、脚做测量工具


    前几讲我已经大力推荐过双手的妙用，在这一讲，我仍然要拿出这个法宝，另外还要加上双脚。


    双手双脚就是世界上最便捷又好用的测量工具。而且孩子一旦发现手脚的测量功能，他们通常会用得根本停不下来。


    比如你教给他“一拃一拃”地量桌子，他就会自动想要“一拃一拃”地量椅子；


    你教给他形容“小手掌一样的面团”，他很可能会再跟你要一块“两个手掌那么大的面包”；


    想看看雪下得有多厚，他们就会把指头伸进雪中量一量深度；


    想知道马路上的水泥砖有多长，他们会用小脚丫“一脚一脚”地去测；


    想知道家里的小院有多大，他们会用“脚步”亲自丈量一遍长和宽……你看，是不是这人人自带的工具最好用呢？


    ### 第二招：玩具总动员


    平时孩子玩玩具的时候，你都可以有意识地加入一点测量和孩子互动。


    如果孩子在玩大大小小的皮球，你可以说“找出最大和最小的皮球吧！”


    这是提示他们用目测的方式解决问题；


    如果孩子在摆弄高高低低的机器人，你可以说“我们来把机器人按照个子的高低排一排吧。”这是要他们通过“量的特征”给物体排序；


    如果孩子把大小不同的玩具娃娃堆在一起，你可以提示他“把娃娃的个子和自己的小手比比长短，每个娃娃有几个小手长呢？”


    这是提示他们“手”作为自然测量工具该如何使用。这同时也给了他们整理玩具的分类方法。


    再比如，“桌子上可以排几辆车？那你的小凳子上呢？”这就引导孩子去发现桌子长 5 辆车，凳子长 2 辆车的秘密。


    如果在沙滩上，或是孩子洗澡时，孩子喜欢往不同大小的瓶里灌水，你可以说“这个瓶子只能灌 1 杯水，那个瓶子却能灌下 5 杯水！”这样的点拨通常会启发孩子新的发现。


    ### 第三招：搭积木


    给你介绍一个积木的新玩法：


    首先，你刻意选择两个不同高度的桌面，你和孩子在这两个高度上各搭一座积木塔，然后你问他：我们俩谁搭的更高呢？


    接下来就开始引导孩子寻找解决方案了，他可能会有下面几种办法：


    - 他想方设法把积木塔挪到相同的高度去。这是在把底座找平，说明孩子已经有测量比较的方法意识了。但这个办法常常会让整个积木塔轰然倒塌；

    - 如果其中一座塔能找到同样高度的现成的模型呢？他们可能会拿过来比一比，然后再和另外一个比一比，这是他们寻找参照物的过程；

    - 如果积木塔都是用一模一样的积木块堆成的，他们可能会想到，直接数一数哪个积木塔用到的积木多，哪个就更高；

    - 上面的办法都失败后，他们可能又会探索出新的办法来，什么手边的小棍啊，或者直接上“手”啊，再或者用身体的某一个部分啊，都可以成为他们的解决思路。


    很多孩子都会有“不达目的不罢休”的表现。


    在这个过程中，你要注意，可千万不要表现得“太聪明”。


    孩子有可能会从你看起来“最笨”的方法中寻找答案，这时你千万别急着告诉他更简便的办法，一定要让孩子充分享受独立解决问题的游戏过程。


    大人的启发要点到为止，这样的思考过程对孩子而言是尤为重要的。


    ### 第四招：测身高


    你经常给孩子测身高，你也可以鼓励孩子学着我的样子，给小动物、洋娃娃测量身高。


    孩子的测量学习就这样在模仿中开始了。


    ### 第五招：在绘本中找出带有测量和计算意义的元素


    我推荐两个绘本。


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_37_0.png)


    一个是《一寸虫》，这是一本真正的“测量”主题绘本。故事把测量的基本单位设计成了一条可爱的“一寸虫”。


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_38_0.png)


    一寸虫有一句著名的话叫：“我很有用，我会量东西。”这让他既避免了被鸟儿吃掉，又交到了许多朋友，值得和孩子反复读一读。


    另一个是经典故事《曹冲称象》。


    这个故事用了大象作为测量对象，还巧妙地找到了测量办法，非常有益于孩子理解“部分相加就是整体”这样的逻辑相加过程。


    ## “量的测量与计算”启蒙的绘本清单


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_39_0.png)

    《一寸虫》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_39_1.png)

    《青蛙搬家》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_39_2.png)

    《一厘米的毛毛》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_39_3.png)

    《斜坡书》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_39_4.png)

    《测量万物的小魔女》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_39_5.png)

    《数学魔咒》


    这节课的最后我提醒你，在学前阶段，尽管孩子可以达到精确测量的水平，但由于计算水平所限，他们还无法进行单位换算。


    比如把“米”换成“分米”等。上了小学之后，以一定的计算能力作为后盾，孩子才能真正理解并接受单位的换算。


    ## 本讲小结


    这一讲，讲了如何教孩子“量的测量与计算”。你一定要多鼓励他用自己的小手小脚，以及身边的小杯子、碗来测量。


    到了这一步，孩子就有了一个更好的判断和推理工具，他认识世界的逻辑能力又进步了。


    # 5. 如何教孩子认识时间


    一说到时间，你可能马上想到的是手表，但对孩子而言，时间其实很抽象，在他们眼里，“10分钟”既可以对应一部动画片的时长，也可以对应一个游戏的时长……


    孩子了解的时间是与言语能力发展齐头并进的，比如，“天亮了我去幼儿园”“我刚刚洗过手，现在干净了”“我马上就来”“今天要休息”等。


    作为一类特殊的量，让表述的时间与客观事实相吻合是“时间”启蒙的核心。因为“过去的时间”永远无法和“现在的时间”同时出现，因此“时间”的启蒙中，寻找恰当的客观事实就是重点，这与孩子的观察力、记忆力、判断力和推理能力是协同发展的。


    ## 一、时间概念的四个发展阶段


    2 岁之前，孩子描述事物时只涉及当前存在的事物或当前的需要；


    2 岁以后，他们就可以表达不同时间范畴的事情了：


    3-4 岁时能利用身边发生的事，掌握一些最初级的时间概念，如早上、晚上、白天、黑夜、马上、刚刚……但有些时候比较含糊，缺乏清晰的认识；


    4-5 岁开始，他们能理解并说出早晨、白天、晚上、夜里等词汇，而且知道早晨、白天、晚上、夜里就是一天。在此基础上，逐步能够认识今天、明天和昨天。知道昨天是刚刚过去的一天，今天过去了就是明天。


    如果在生活中有好的提示和点拨，大多数孩子在 5-6 岁，就可以认识钟表上的整点和半点了。


    > 孩子最初理解的“时间”，更准确地说，不是数学上的“时间”，而是生活中的“时间”。


    千万不要抛开实际的情境和孩子谈论“时间”。你和孩子探讨的“时间”应该像“好吃的东西”一样令他熟悉，怎么做到呢？


    ## 二、在聊天中学习时间


    时间看不见摸不着，为“时间段”起名字，这可能是认识“时间”最好的入手方式了。比方说，你可以用“太阳升起的时候”来替换“早上”；“4 点钟要去什么地方”表达为“睡好午觉我们就去楼下玩”。


    事实证明，从具体事件中和孩子讨论时间，孩子能更快地认识时间。等孩子熟悉以后，再有意识地用更准确的时间词汇替换回来。


    平时，一些时间词汇一旦出现，你也要严格执行，让孩子在“时长”上获得准确的理解。比如：


    - 早晨出门，你可以和孩子说“来，把鞋穿上。我们马上就要出发了。”

    - 和孩子一起阅读，你可以说“再看 5 分钟，就结束。”

    - 孩子睡午觉起来，可以说“宝贝真棒，睡了两个小时。”

    - 过生日了，可以说“今年宝宝 2 岁，明年就 3 岁了。”


    等孩子对一组时间概念达到了有一定的理解水平，就可以在聊天中加入时间的先后顺序，这可以强化时间发生的先后关系。


    如，“早上起床，你先穿衣服，然后再洗脸，最后刷牙”，“你先去洗手，然后再吃东西。”


    等孩子掌握了“数的概念”，那么今天是星期几，早晨几点出门，现在是几月份，那么接下来是几月份等，在家里，你们都可以频繁地谈论时间。


    ## 二、在游戏中渗透时间观念


    推荐两个游戏：


    1. **翻翻牌**


    这个游戏你可以两个人玩，也可以和全家人一起玩。


    游戏开始的时候，准备好三组卡片，一组写时间，一组写人物，还有一组写干什么（当然也可以用图画来表示卡片上的内容）。三组卡片，内容朝下分别放好。


    这个游戏你可以和孩子两个人玩，也可以组织全家人一起玩。


    游戏开始时，每个人要分别从三组中任意抽出一张牌，然后将抽到的内容连成一句话。


    如果你抽到的时间卡片是“晚上”，人物卡片是“爸爸”，干什么卡片是“晒太阳”，连起来就是“晚上爸爸晒太阳。”


    这样的时间笑料不仅可以强化时间意识，也一定会让你和孩子开怀大笑。这个游戏可以从最开始的设计阶段就让孩子亲自参与进来。


    你可以根据孩子的水平，在不同的发展阶段设计出不同深度、广度的“翻翻牌”来玩儿。


    2. **计时游戏**


    你随时随地就可以和孩子来玩儿。


    比如，孩子数10下，看看你能做完什么事：能不能穿好一件衬衣？能不能至少拍球8次？


    或者，你开始数数，看孩子搭好一座积木塔需要数几下；穿鞋需要数几下，有没有比上一次更少......


    玩儿这个游戏的时候可以随时交换角色，让孩子从“数数”的轻松角色开始，体会到乐趣了再交换角色。


    需要注意的是，既然是游戏，就千万不能变成“命令”，或是“任务”，这样有趣的成分就一扫而光了。


    熟悉了游戏形式以后，“计时游戏”可以换成看着钟表的秒针来计时，时间概念就这样悄然走进孩子的生活了。


    ## 三、培养时间管理意识


    1. **从生活中的简单规则做起：**


    比如，要让孩子知道，一件事情什么时候开始、什么时候结束，让孩子做事情有开始和结束的概念，而不是这个事情做一下，就去做另外一件事。


    再比如，当你说“今天起晚5分钟，你上学要迟到了哦！”这样的话时，你是让孩子知道“他迟到了”，而且“迟到”这个事情不好。


    相反，如果孩子“准时”或“提前”了，要及时给反馈和鼓励。


    2. **从不同角度去了解时间的长度，树立时间意识：**


    同样的一段时间，只能择其一时，让孩子自己去做选择，是看动画片，还是看书。


    这样孩子能自己体会出，用同样的时间做不同的事情，所带来的是不同的价值；


    购物的时候，有意识地让孩子和你一起看看食品的生产日期、食用期限等，从中体会时间就是资源，不在期限内去食用，就是一种浪费。这也算是最基础的环保意识吧。


    在管理时间的具体做法上，如果你希望孩子做事有首有尾，可以用孩子喜欢的贴纸和孩子一起记录，比如用“笑脸”表示“开始”，“大拇指”表示“结束”，而用“哭脸”来代表半途而废；


    如果孩子上幼儿园了，需要提前准备东西，你可以用几条任务卡纸来提醒孩子。可以是一件事一条卡纸，并且按需要的时间长度把卡纸设计成不同长度。


    一开始可以孩子拿着卡纸，你帮孩子完成，慢慢地过渡到让孩子自己拿着卡纸去完成。这是用视觉的方式让孩子知道他有多少事，这跟我们大人自己在生活、工作当中列一个任务清单一回事。


    ## 四、用绘本帮孩子理解时间


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_45_0.png)


    比如，在绘本《怪物王国的难题》中，作者就用特别具体的方式让孩子体会到了时间的长和短。故事中有这样的描述：


    太阳升起又落下，月亮升起又落下，就是一整天。


    如果装满一桶水，用一天的时间，那么换成用可以装满一桶水的 24 个杯子，分开接水，装满一个杯子的时间就是 1 小时。


    故事中，那个聪明的小朋友就是这样，解决了巨毛怪的大问题，让自己逃离了怪物王国。


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_46_0.png)


    而在绘本《甜蜜小仓鼠》系列中，每一个故事都是以“一大早……中午……这天晚上……”这样的三段式结构铺展开来，比如：


    > “一大早，萝拉醒来，发现嘴里藏着好多甜蜜的话。”

    > “中午，在橘色餐厅里，大家都在低头吃东西。”

    > “吃晚饭的时候，萝拉觉得肉不好吃，蔬菜不好吃，苹果不好吃……”


    这样的故事安排非常有利于孩子了解一天和一天中的不同时段和顺序。对于时间认识零起步的孩子尤其重要。


    想一想，孩子的读物中，这样的故事一定不少吧？而现实中，你的孩子是不是每天也有类似的经历呢？


    ## “时间”启蒙的绘本清单


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_48_0.png)

    《怪物王国的难题》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_48_1.png)

    《甜蜜小仓鼠》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_48_2.png)

    《古利和古拉的十二个月之歌》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_48_3.png)

    《时钟的书》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_48_4.png)

    《一年的光游》


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_48_5.png)

    《最完美做的故事》


    这节课的最后，我还想纠正两个大人常常忽略的问题：


    1. 千万不要善意地去欺骗孩子，延误他们对于时间的认识，比如明明孩子只玩了5分钟的玩具，你却说“半小时已到”；

    2. 你要尽量“说到做到”，为孩子能够自我管理时间树立好的榜样。不论这些时间管理是“妈妈马上就和你玩儿”，还是“几点睡觉”“几点起床”这样的小事情。


    ## 本讲小结


    给孩子进行时间启蒙，你别急着让孩子认表，反而日常聊天你要有意识多用“早上”“晚上”“现在”“然后”这样的时间概念。


    在游戏中多用口头数数的办法帮孩子理解时间的长短。带孩子学习时间管理，也是真的立足数学，从小提升孩子的生活质量。


    # 6. 如何教孩子认识空间中的图形


    说到“空间中的图形”，既有平面图形，也有立体图形；既有数学意义很明显的图形，比如圆、正方形、三角形、球形、正方体等，更有生活中遇到的各式各样复杂的，或者不规则的图形。


    当孩子们能够区分出空间中不同图形的时候，就说明他们具有了“图形识别能力”，这就是孩子们空间智能发展的起点。


    ## 一、理解图形，不要记图形


    你可能会觉得，“这不是太简单了嘛？还需要花力气去启蒙？就这几个图形，是个孩子都能很快记住。”


    如果这样理解的话，那你一定是把“图形”问题当成了不需要动脑筋思考、只需要靠记忆来解决的问题。


    比如你可能有过这样的经历：拿着一块三角形拼图告诉孩子，这是三角形。孩子的记忆力通常是很强的，他很快就记住了。


    但是如果你下次变成在纸上画一个形状不太一样的三角形，问他这是什么形状，他很可能又不认识了。


    这是为什么呢？因为孩子记住的只是那个特定的图形，靠的是他们强大的照相机制的记忆力，但是他们并不理解满足什么特征的图形叫三角形，所以你再给他一个变化了的三角形，他们又不知道了。


    单纯的记忆并不叫完成了图形的启蒙。


    在 6 岁以前的幼儿阶段，我们给孩子图形启蒙的目标是让他们通过反复观察、交流、思考，甚至是想象，来真正掌握图形的特征和含义。


    比如三条边组成三角形，正方形的四条边是相等的……这是给孩子以后学几何打下基础。


    那么孩子认识和理解图形，要经历哪些发展阶段呢？


    ## 二、孩子理解图形的三个阶段


    **第一阶段**：能识别出一个完整的封闭图形，并且开始逐渐认识有数学意义的图形，比如圆形、正方形等。


    这时，孩子们会有一个典型的行为，就是会用手顺着实物四周的轮廓去触摸，然后再把手伸进去，这是他们对图形的一种探索行为。


    在这个阶段我们要多创造这样的机会给他们，比如给他们找来不同形状的积木，或者在一个盒子上挖不同形状的洞，让他们去感受。


    一般来说，3 岁的孩子基本可以找出最易识别的圆形、正方形和三角形；可以完成图形配对，还能从若干图形中找出指定图形，并说出图形的名称来。


    **第二阶段**：可以区分直线图形和曲线图形。


    这时，他们在第一阶段的基础上可以认识长方形、半圆形、菱形、梯形，知道它们是直线图形，而圆、椭圆是曲线图形。


    一般到了 4 岁以后，孩子们掌握平面图形的能力有了很大的提升。他们能够不受颜色、大小、位置的影响，从环境中准确辨认出这些图形，并说出图形的名称来。


    **第三阶段**：开始知道平面图形和立体图形不一样，可以认识基本的立体图形，比如球、圆柱、正方体和长方体。


    5 岁的孩子已经能够准确说出已知图形的名称和特征；能根据事物的几何特征进行筛选、分类和排列。


    这三个阶段，是孩子认识不同图形的一个发展规律。但对于每一个具体的图形而言，孩子的学习过程也是有规律可循的。


    一般来说，孩子认识一种图形是按照“配对——指认——命名”的顺序来掌握的。


    比方说，认识圆形。


    - 最开始，他们只是能从很多图形中找出两个圆形，他们能够意识到这两个图形是相同或者相似的；

    - 慢慢的，你跟他说“宝宝，哪个是圆形？找个圆形出来吧。”他就能够找出来，这叫做“指认”；

    - 最后才是看到实际的图形，能够说出这是“圆形”。


    所以，配对最容易，接下来是指认，而看到图形说出名称的命名则是最难的。


    你需要做个细心的家长，随时关注孩子的发展水平，调整自己的启蒙手段。


    ## 三、怎么教孩子掌握空间中的图形呢？


    教你 5 招能充分激发孩子兴趣的培养手段：


    **第一招：鼓励孩子多看、多摸、多用去去摆弄物体**


    研究人员发现，自婴儿期开始，孩子就已经在用视觉去区分图形的形状了，他们喜欢看妈妈的脸庞、喜欢看有图案的画，这可以从孩子注视的时间长短上判断出来。


    当孩子小手伸出来想要摸一下的时候，你最好满足孩子的这个愿望；


    随着孩子能手眼协调地把握物体，那些有着物体形状的橡胶玩具或模型卡片就再好不过了，比如苹果、皮球、香蕉，他们会通过触摸，放到嘴边尝一尝等方式去积极地感受物体形状；


    直到两三岁，孩子才能结合语言的表达发展出看得见的配对和指认形状的能力，但正是更早期的这种体验，才给了他们识别物体形状最稳定的判断能力。


    **第二招：我教你两个好玩的游戏**


    这两个游戏最大的魅力在于，孩子在游戏中不是简单无聊地重复形状，但却一直在进行着和形状有关的思考。


    1. **剪折纸游戏**


    你可以和孩子从好认又好折的正方形纸开始。小一点的孩子可以直接撕纸，然后是折纸，大一点能使用剪刀就可以剪折纸了。


    你可以在纸上撕一个圆形的洞，这时候很多孩子喜欢继续把圆形的洞撕烂，在这个过程中，孩子能体验到完整的圆形这个封闭图形是如何变化，最终被撕烂变成开放图形的。

