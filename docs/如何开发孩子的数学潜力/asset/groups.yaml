    这就给你提供了很大的方便：它省去了你自己去创设数学情境的麻烦。那些看似没有数学情境的环境，只要稍加设计，就能这样创造出意外的数学情境来。我觉得特别适合做阅读后和孩子讨论的内容。


    ![](img/1d3dd3156cdd013d8b512f727b5f5426_85_0.png)


    《牙齿大闯关》是一个很有名的科普绘本，讲的是两兄弟哈克和迪克在人类牙齿上干坏事的故事，很受孩子喜爱。如果孩子对故事已经非常熟悉了，你就可以和他多少引申一下。


    比如，看到哈克和迪克修建了龇牙大街，你可以多问一句：“哇，看看他们一共改造了多少颗牙齿啊？”“他们修建的泳池是方的还是圆的？”


    这样的互动，会让孩子在兴致勃勃中加深对数学概念的理解。


    ### 总结


    简单帮你回顾一下，我从数的概念、测量、形状、时间、空间以及逻辑思维的培养六个方面为孩子全面开发数学潜力。


    在每一个启蒙主题中，我都给你介绍了三方面内容：


    - 1. 在某个数学主题领域，不同年龄孩子的能力发展时间表，你可以拿来和自己孩子的实际情况进行对比。

    - 2. 我给了简单实用的亲子游戏，你随时随地都可以和孩子玩起来，不光增进亲子关系，还能潜移默化地提升数学能力。

    - 3. 每节课我都为你提供了一个绘本清单，你可以充分利用。


    不夸张地说，对于绝大多数孩子而言，小学阶段最重要的数学习惯养成和数学启蒙都可以在家庭得到发展。


    你听完我的课，应该能意识到，这样的家庭数学启蒙，我们花费一点点努力都可以达成，可是相对于我们所投入的时间、精力和金钱而言，这个收益是巨大的。


    尤其是“每日家庭游戏时间”，对于孩子早早形成积极的数学习惯，更轻松有效地获得有用的数学基础来说，非常重要。


    只要坚持一段时间，你就会发现，孩子会持续给你惊喜，数学也会变得越来越容易。


    好了，听了这么多，不如就从现在开始，从今晚开始，选择一项游戏和孩子玩起来吧！

