    # 本讲小结


    这一讲，我讲了如何给孩子启蒙“空间中事物之间的关系”。带孩子经常出去玩，让他感受空间方位的变化。拼图也是一个重要的手段。


    # 8. 如何培养孩子的逻辑思维


    “逻辑思维”属于抽象思维，是智力活动的高级形式。任何学习的终极目标其实都是提高“逻辑思维”，而数学知识通常具有强逻辑性，所以逻辑思维的养成在数学领域特别重要。


    # 一、数学知识中的逻辑思维


    什么是逻辑思维？


    举个最简单的例子：桌上放着一盘水果，你让孩子想办法把它们分给到场的客人，怎么办呢？


    解决这个问题的过程就需要逻辑思维了。'
  - '[PAGE 71]


    首先，孩子认识“水果”“客人”，想在水果和客人之间建立联系；接下来，孩子就要思考解决办法了。


    孩子可以利用“数的概念”，结合“对应的概念”，利用水果和客人之间的联系，直接“判断”出结果，比如每人分一个苹果。


    在这个基础上，他还可以结合你对“客人的年龄”“喜好”这些信息进行“判断”的基础上，进一步“推理”，找出更加符合实际情况的分配方案来，比如小孩子爱吃甜的，就多给几个草莓等等。


    通过这个例子，你能看出来“逻辑思维”就是在概念的基础上，通过对事物的“理解”“判断”“推理”来揭示事物联系的过程。说白了，它就是问题的“详细解决方案”。


    这其中，对“事物的理解”是最基本的，然后才有“判断”，才有“推理”。


    # 1. 对事物的理解的三条规律


    +   - 先理解个别事物，再理解事物之间的关系，比如先理解苹果、橘子、香蕉，再理解综合一点的“水果”这个概念。


    +   - 先理解具体形象，再理解抽象的词汇，比如先理解了水果，再理解“大”和“甜”的感觉。


    +   - 先形成对事物简单表面的评价，再实现复杂深刻的评价，比如先理解苹果是红的，再理解它很好吃。


    # 2. 判断推理


    大多数 3 岁的孩子还不能进行判断推理活动；4 岁时，判断推理能力开始发展；到了 5 岁，大部分孩子都可以进行简单的推理活动了。'
  - '[PAGE 72]


    有研究发现，学龄前的孩子完全具备“逻辑思维”的能力。但常常因为“知识经验”的不足，引发可笑的推断。


    比如中国心理学界的泰斗朱智贤教授就说过这样一个例子：


    一个五六岁的孩子被妈妈问，为什么车一开起来就有风呢？孩子说，“风是从轮子里出来的！”因为在孩子看来，轮子一动就有风，轮子停了就没风。


    这种时候，孩子即便说错了家长也不用着急，只要孩子有良好的思考习惯，随着他们的年龄增长，知识经验不断丰富，一般到小学的时候，对于生活中的常见事物，孩子都能很好地进行合乎逻辑的判断和推理。


    # 二、怎样帮助孩子发展逻辑思维能力？


    下面我就教你 5 招实用的家庭互动游戏，给孩子的“逻辑思维”发展添砖加瓦。


    # 第一招：充分利用日常生活中和孩子的聊天


    比如，和孩子吃苹果，孩子会形成关于苹果的直观印象，如果你注意引导孩子观察苹果的形状、颜色、口感，孩子就会理解这些表象，并把它们和苹果建立起联系，逐渐找到这个食物的本质特征，这是教他们理解苹果这个事物。以后再遇到，就可以判断出来。


    再比如，当你第一次和孩子说“苹果是果实，胡萝卜是根”这样的判断时，你最好让孩子看一眼苹果在树上、胡萝卜在土里的样子，让他们眼见为实地知道“果实”和“根”的区别。'
  - '[PAGE 73]


    有的时候，你的言语表述中流露出的某种情感，也会直接影响孩子对事物的理解和判断。


    比方说，你指着小猫说“小猫经常踢翻咱家的花盆”，那么孩子听到了，即使以前喜欢，也会对猫的理解、评价发生改变。


    你可以观察一下，当孩子不断地追问你“为什么”的时候，说明孩子进入了逻辑敏感期，你要给孩子确切的答案。


    同时，如果孩子开始使用类似“因为，所以”“如果，就”这样的复式句，就说明孩子开始抽象分析问题 了，已经意识到了事物和事物之间的关联。


    为什么在数学上，我始终强调在情境中、在事物的摆弄中让孩子去了解概念呢？


    比如认识三角形，就是要利用实际存在的物体发展孩子的直观形象思维，之后将直观形象与抽象词语建立起牢固的关系，这些都是逻辑思维的根基。


    第二招：在规律中提升


    事物的“规律”说白了就是事物之间的内在逻辑关系。


    比如，把一组积木按照正方体、长方体、圆柱的顺序排好，当你抽去几块时，让孩子根据已有的积木找出规律，把适当的积木再放回恰当的位置，这是空间图形的规律。'
  - '[PAGE 74]


    类似的还有平面图形的规律、故事的发展顺序、数字的规律、事物颜色的规律等等。这些看似表面的规律，孩子能利用摆一摆的“行动”去思考，就为直观形象上升到抽象的“逻辑思维”打好了基础。


    # 第三招：在2个小游戏中提升


    这两个游戏中的规则因为通常包含理解、判断与推理，特别有利于培养孩子的逻辑思维。


    # 1. 接龙


    这个游戏就是利用前后某种关系，以续接的方式来玩儿，游戏本身可以像长龙一样一直玩下去。


    刚开始玩这个游戏的时候，可以侧重概念的理解：


    比如，可以和孩子玩“你拿水果，孩子报数字”这样的一对一接龙；


    也可以“你说动物种类，比如天上飞的，孩子说具体动物名称，看谁说得多”这样的一对多接龙；


    还可以是“食物接龙”，比如，一堆糖果放在一起，按照糖纸“红蓝黄红蓝黄”接龙。


    等孩子对游戏熟悉了，语言也更丰富了，就可以玩有词义关联的抽象接龙了，比如，词语接龙、造句接龙、问题接龙，甚至是故事接龙等。'
  md: "\n## 2. 给形状涂色\n\n顾名思义，就是画出形状的外框，让孩子来个涂色游戏。\n\n做这个游戏，我要提醒你，最好结合孩子生活中可见的各种事物，把形状赋予现实名称和意义，比如一朵花、一杯饮料、一颗苹果。可以你来画边框，孩子来涂色；如果孩子很喜欢这样的游戏，也可以让孩子来创造图形边框，由你完成涂色。\n\
    \n这个游戏中，你和孩子会有很多的话题：关于颜色的话题、线条的话题、事物名称的话题，一直到形状的话题，只要你多加引导和交流，孩子掌握起来会觉得相当轻松好玩。\n\
    \n## 第三招：让玩具来帮忙\n\n这里，积木又要派上大用场了，各种立方体、长方体，以及其他立体图形，在摆弄中强化了孩子的图形意识。\n\n每一种玩具再仔细观察观察，又能从积木的每一个面找出“正方形、长方形”等平面图形来。\n\
    \n玩具玩完了，还可以根据图形来分分类、收放好，既培养了良好的习惯，又能让孩子从图形属性中学到东西。\n\n另外还有一些现成好用的玩具，比如，用几根雪糕棍体验三角形、正方形和长方形的构成特征；用形状拆装车、七巧板、形状积木串珠等进一步区分图形之间的不同；还有安全的橡皮泥，也可以帮上大忙。\n\
    \n## 第四招：快乐的形状童谣\n\n朗朗上口的童谣和形状结合在一起，既有韵律，又有画面感，特别有益于孩子主动去理解图形，拓展空间想象力。\n\n比如：\n\
    \n> **《神奇三角形》**\n> 三角形，三条边，三个角，\n> 变条小鱼水里游，变只小鸭嘎嘎叫。\n> 三角形，三条边，三个角，\n> 变只狐狸咪咪笑，变只袋鼠蹦蹦跳。\n\
    \n再比如：\n\n> **《形状变变变》**\n> 圆形圆形变变变，\n> 变个车轮地上跑，\n> 变个皮球跳得高，\n> 我是圆形的好宝宝；\n> 正方形，变变变，\n\
    > 变个盒子找一找，\n> 变个枕头抱一抱，\n> 我是正方形好宝宝；\n> 三角形，变变变，\n> 变个风筝天上飞，\n> 变个帽子头上戴，\n> 我是三角形好宝宝。\n\
    \n这些形状的童谣都非常有画面感，如果唱童谣的同时，再动手画一画，找来相关的道具设计表演一番，效果会更好。\n\n## 第五招：发掘绘本中的图形元素\n\n\
    我给你推荐两个非常好用的绘本。\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_56_0.png)\n\n一本叫《建筑工地》，书中讲了一座房子是如何建好的，你和孩子能从图画中学到不少建筑技巧，而每一个技巧都离不开建筑中的图形设计：\n\
    - 梯子按什么形状架设才稳当；\n- 立方体的砖块怎样才能砌成一堵墙；\n- 长方形的天窗是怎么安装好的；\n- 水泥车的形状又有什么特点等。\n\n一旦翻开这本书，不识字的孩子也能从自己的角度讲出一个丰富的故事来。故事中让他们思考最多的除了建筑过程，当然就是这些形状问题了。\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_57_0.png)\n\n另一本是《我的百变浴缸》。故事开始于小主人公的一句发问：“就不能偶尔换个不一样的浴缸吗？”\n\
    \n于是，他想象自己有了球形浴缸、迷宫浴缸，还有蜂窝浴缸、布丁浴缸、金字塔浴缸。不仅如此，他还给爸爸妈妈，还有哥哥都设想了适合他们的奇妙浴缸……\n\n故事通过小男孩对浴缸的幻想，展现了一个空间图形的美妙世界！\n\
    \n## 图形概念启蒙的绘本清单\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_0.png)\n\n《建筑工地》\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_1.png)\n\n《我的百变浴缸》\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_2.png)\n\
    \n《积木大营救》\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_3.png)\n\n《奇妙图书》\n\n\
    ![](img/1d3dd3156cdd013d8b512f727b5f5426_59_4.png)\n\n《形状游戏一起玩》\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_5.png)\n\
    \n《埃姆斯的几何花园》\n\n提醒你一个问题：启蒙图形概念，并不是只启蒙数学意义下的图形，而是要将生活中的各种形状都带入孩子的思考空间，让孩子理解空间关系。\n\
    \n这样做的意义在于，孩子可以通过这种前期的培养，让空间想象能力得到充分发展，从而具备思考和再现物体形状、位置和结构关系的能力。而这种能力是拥有创造力所必须的。\n\
    \n为什么这么说呢？我们以正方体为例。\n\n孩子刚开始看到正方体时，你问他有几个面，他只能说岀看得見的那几个面；渐渐的，他从各个角度认识了正方体，幷在头脑中形成了正方体的完整印象，即使眼睛看不到，他也知道那些面是存在的。这就需要空间想象能力发挥作用，是需要之前的空间体验作为积累的。\n\
    \n一旦哪一天，他需要创新时，他就会在大脑中检索已经理解和存储的图形，如果恰好需要正方体，他就可以结合正方体的特性创造岀自己需要的东西来。\n\n## 本讲小结\n\
    \n给孩子启蒙“空间中的图形”，幷不是简单地记住图形的名字，而是要在充分观察、思考的基础上，理解图形的特点。\n\n一定要让孩子多看、多摸、多动手，剪纸、积木都是非常好用的。\n\
    \n以“图形”为基础的空间想象能力对孩子非常重要，除了数学应用外，孩子的创意思维，以及语文中图形“汉字”的识别能力都离不开它。\n\n# ## 7. 如何教孩子理解空间方位关系\n\
    \n每一个物体都存在于空间之中，通过占有位置，而与其他事物发生空间关系。\n\n这里，“关系”一词的含义是指物体之间的“空间方位”，它既与位置有关，也与距离、方向密切相关，是这些生活经验的集中表现，一般用“上下”“前后”“左右”“远近”等词语表示。\n\
    \n“空间关系”的核心是“参照物”，参照物不同，物体的空间位置就截然不同。\n\n孩子的能力是以自身为中心逐渐发展起来的，因此，能够认识并理解“以自身为中心”，还是“以其他物体为中心”直接决定了孩子“空间关系”的能力水平。\n\
    \n“空间关系”与“情境”关系密切，是相对和可变的：相同的情境下，“角度”不同，就可能得出完全不同的空间关系。\n\n这对孩子而言是一个难点。\n\n比方说，“桌子在你前面，椅子在你后面”，一旦你身体向后转了，桌子和椅子相对于你的前后关系也反转了，如果还用原来的结论那就错了。\n\
    \n空间中，事物之间的关系决定了我们理解和表述世界的能力，因此，要创造一切机会帮助孩子获得充分的认知发展。\n\n# 一、认识空间关系的四个阶段\n\n-\
    \ 第一阶段：辨认上下方位\n  大多数 3 岁的孩子仅能达到这个水平。\n- 第二阶段：辨认前后方位\n  尽管“距离”“深度”这种空间能力从婴儿期已经开始发展，但直到三四岁时，他们才能发展出准确判断“距离远近”的能力。\n\
    \  这时，他们对看到的景物，能表达出“房子在树木的前面”这样的结论。而到 4 岁以后，他们就可以辨认出前后关系了。\n- 第三阶段：以自身为中心辨认左右方位\n\
    \  大多数孩子到 5 岁时可以达到第三阶段的水平。\n- 第四阶段：以客体为中心辨认左右方位\n  6 岁以后，孩子们就可以熟练运用前三个阶段了，但是第四阶段能力的发展却并不均衡。甚至对于有些孩子来说，这种能力始终是一种障碍。\n\
    \  在这里，孩子判断自身对面物体的“左右关系”尤为困难，只有帮助孩子实现了“空间旋转”的思考，他才能理解对面事物与自身反向的关系。\n\n尽管孩子们都是以“自身为中心”发展出“空间方位”的，但是当某个事物的标记特别明显时，他们也能第三阶段和第四阶段同时发展。\n\
    \n这说明，当你抛给孩子一个“空间方位”问题要他思考时，问题的设计至关重要。\n\n比方说，让孩子认识左右的时候，你可以说成“左手、右手”，更可以告诉他右手就是拿勺子的那只手，孩子会很容易记住与具体事物结合的方位词。\n\
    \n有了这样的对应，吃饭时你就可以和孩子说：“看见奶奶拿勺子的右手了吗？把奶奶右手边的碗递给妈妈。”\n\n而由于我们本身的生活空间是三维空间，而孩子又常常同时接触到二维的和三维的，因此孩子“空间方位”能力的发展是：先认识一个笼统的三维空间，然后再认识其中的二维、一维空间；在能力逐步发展，掌握了一定的概念和表达之后，又反过来从部分到整体，继续发展一维、二维和三维的空间关系。\n\
    \n也就是说，“空间关系”能力的认知发展过程是沿着整体到局部，再由局部到整体，呈螺旋式上升的。\n\n拿三维空间和二维空间来说：孩子认识“前后”方位时，先是在自己生活的空间，也就是三维空间中掌握，然后才能识别出照片上的“前后”关系，这是因为观察照片有一个二维向三维转换的过程；这个能力具备之后，他们才能根据照片去逆向完成三维空间中的某件事，比如，照着说明书上的图片搭积木就是更高级的能力。\n\
    \n# 二、怎么教孩子理解空间关系呢？\n\n教给你 5 招。\n\n**第一招：在聊天和观察中激发孩子说出“空间关系”**\n\n生活在空间中，各种事物无时无刻呈现着各种空间关系，稍加提醒孩子就能学到很多。比方说，他收到了漂亮的礼物，你可以和孩子一起打开，同时说“哇，好酷的汽车！快把它拿到盒子外面。”\n\
    \n孩子不玩儿了，可以说“把它放回盒子里面。”再比方说“图画书在桌子上面”“皮球在桌子下面”。孩子垒个高高的积木塔，上下关系、前后关系等可以一边搭一边用起来。\n\
    \n在孩子语言发育的关键时期，帮孩子说出来，还能丰富他们的词汇量，提升他们在“空间关系”方面的语言表述能力。\n\n等孩子语言达到了一定水平，你可以干脆和孩子来个反义词游戏。一有机会就可以把什么上对下、前对后、里对外、左对右玩个遍。从词汇上对“空间关系”加以熟悉和巩固。\n\
    \n**第二招：充分利用好出门玩耍的一切机会**\n\n带孩子走出家门，那些需要识别的“位置”“距离”“方向”自然就来了。这时，你可以让“空间关系”发展的每个阶段走进你们，这是孩子最容易接受的方式。\n\
    \n在公园里，和孩子坐一坐轨道车吧。孩子不仅一下子看到了更多的景物，你还可以一路让孩子观察，什么还在“上面”，什么已经在“脚下”了。\n\n随着景物位置发生的明显变化，还有了行进的方向，前后车的关系等等；如果一个玩具需要排队才能玩上，这时候，可以让孩子观察，谁排在自己的前面和后面。\n\
    \n当然，如果你们一家真的去远行，火车上不同方位风景的变化、飞机上那些极端的高空远景更是最好的素材，随着孩子自身位置的转换，有不少的上、下、前后、左右关系可供观察和交流；也非常容易找到从“自身”转换到“典型参照物”，并进一步提升对这些空间关系的理解。\n\
    \n**第三招：我教你两个游戏**\n\n游戏中，可以根据孩子的不同“空间关系”水平玩出不同的花样。\n\n1. **贴鼻子**\n   顾名思义，就是画一张人脸，只空出“鼻子”来；游戏时需要蒙着眼把“鼻子”贴到准确的位置，孩子在这个过程可以得到声音提示。你可以说，“上一点”，“下一点”，“左一点”，“右一点”等。\n\
    \   刚开始玩的时候，这个游戏可以简化为“摸五官”。就是当你说“鼻子”时，让孩子立刻摸到自己的鼻子；当你说“耳朵”时，立刻摸到“耳朵”……慢慢的，可以让孩子去摸别人的五官，比如让爸爸和孩子面对面，你来说五官的名称，让孩子在“爸爸”的脸上指出对应的位置。这是让他们通过触觉和声音感受事物位置关系。\n\
    \   接下来，就可以玩真正的“贴鼻子”游戏了。游戏的过程可以由近及远，画面可以由大到小。但需要注意的是，一定要等到孩子能够睁着眼完成后，再蒙着眼玩儿。\n\
    \n2. **捉迷藏**\n   这个游戏最厉害的地方是，每一次玩儿，“空间关系”都可以玩出不同的花样来。\n   “藏的人”可以知道什么里面最安全，什么下面不安全；“捉的人”则猜想着，什么后面、什么上面可以一下捉到人。\n\
    \   寻找一个安全的空间，你们可以一家人玩，也可以让孩子和小朋友一起玩，既要“捉”也要“藏”。\n   正是这样的角色变换可以带来最自然的“空间旋转”，让孩子在游戏中不自觉地体验各种空间关系，包括“以自身为中心”还是“以其他东西为中心”去辨别左右关系等。\n\
    \n**第四招：充分利用好拼图**\n\n拼图对孩子的数学能力培养是非常深刻的，它既有对于任意形状的观察，更有形状之间的关系思考，平面拼图涉及二维的空间关系，立体拼图则是三维的空间关系。\n\
    \n你既可以直接购买，也可以亲手制作。\n\n我建议刚开始玩的时候，用孩子熟悉的图自己制作是最适合孩子的。拼图的块数可以由少到多，这样，孩子需要处理的空间关系就会由易到难，针对性会更强。\n\
    \n另外，在孩子有了一定的拼图能力和技巧以后，你们就可以去挑战更难的地图拼图了。\n\n**第五招：发掘绘本中的“空间关系”元素**\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_67_0.png)\n\
    \n这里，我给你推荐绘本《谁藏起来了》，可以说这本书就是纸上的捉迷藏。\n\n翻开绘本，在每一页：狗、老虎、河马、斑马、袋鼠、狮子、兔子……孩子们喜欢的 18\
    \ 个动物逐个登场亮相，瞪大眼睛看着你。而每页的文字只有一句话：“猜猜看，谁藏起来了？”\n\n如何找到答案，找到了如何描述？这个过程中你们是如何寻找参照物的？相信你一定可以和孩子在共读中找出许多办法来。\n\
    \n## “空间关系”启蒙的绘本清单\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_0.png)\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_1.png)\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_2.png)\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_3.png)\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_4.png)\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_5.png)\n\
    \n这节课的最后，我想就自己遇到过的现象做一个解释。\n\n有妈妈反映，怎么我的孩子老是不听老师的话。老师说向东他朝西，愁死了。上体育课，孩子左右分不清，总搞错。\n\
    \n其实，这个不能全怪孩子，确实有孩子是因为“空间方位”启蒙的滞后而导致相应的能力发展滞后，于是就因为对方位不敏感，从而造成了“不听话”的后果。\n\n##\
    \ 本讲小结\n\n这一讲，我讲了如何给孩子启蒙“空间中事物之间的关系”。带孩子经常出去玩，让他感受空间方位的变化。拼图也是一个重要的手段。\n\n# 8.\
    \ 如何培养孩子的逻辑思维\n\n“逻辑思维”属于抽象思维，是智力活动的高级形式。任何学习的终极目标其实都是提高“逻辑思维”，而数学知识通常具有强逻辑性，所以逻辑思维的养成在数学领域特别重要。\n\
    \n# 一、数学知识中的逻辑思维\n\n什么是逻辑思维？\n\n举个最简单的例子：桌上放着一盘水果，你让孩子想办法把它们分给到场的客人，怎么办呢？\n\n\
    解决这个问题的过程就需要逻辑思维了。\n\n首先，孩子认识“水果”“客人”，想在水果和客人之间建立联系；接下来，孩子就要思考解决办法了。\n\n孩子可以利用“数的概念”，结合“对应的概念”，利用水果和客人之间的联系，直接“判断”出结果，比如每人分一个苹果。\n\
    \n在这个基础上，他还可以结合你对“客人的年龄”“喜好”这些信息进行“判断”的基础上，进一步“推理”，找出更加符合实际情况的分配方案来，比如小孩子爱吃甜的，就多给几个草莓等等。\n\
    \n通过这个例子，你能看出来“逻辑思维”就是在概念的基础上，通过对事物的“理解”“判断”“推理”来揭示事物联系的过程。说白了，它就是问题的“详细解决方案”。\n\
    \n这其中，对“事物的理解”是最基本的，然后才有“判断”，才有“推理”。\n\n### 1. 对事物的理解的三条规律\n\n- 先理解个别事物，再理解事物之间的关系，比如先理解苹果、橘子、香蕉，再理解综合一点的“水果”这个概念。\n\
    - 先理解具体形象，再理解抽象的词汇，比如先理解了水果，再理解“大”和“甜”的感觉。\n- 先形成对事物简单表面的评价，再实现复杂深刻的评价，比如先理解苹果是红的，再理解它很好吃。\n\
    \n### 2. 判断推理\n\n大多数 3 岁的孩子还不能进行判断推理活动；4 岁时，判断推理能力开始发展；到了 5 岁，大部分孩子都可以进行简单的推理活动了。\n\
    \n有研究发现，学龄前的孩子完全具备“逻辑思维”的能力。但常常因为“知识经验”的不足，引发可笑的推断。\n\n比如中国心理学界的泰斗朱智贤教授就说过这样一个例子：\n\
    \n一个五六岁的孩子被妈妈问，为什么车一开起来就有风呢？孩子说，“风是从轮子里出来的！”因为在孩子看来，轮子一动就有风，轮子停了就没风。\n\n这种时候，孩子即便说错了家长也不用着急，只要孩子有良好的思考习惯，随着他们的年龄增长，知识经验不断丰富，一般到小学的时候，对于生活中的常见事物，孩子都能很好地进行合乎逻辑的判断和推理。\n\
    \n# 二、怎样帮助孩子发展逻辑思维能力？\n\n下面我就教你 5 招实用的家庭互动游戏，给孩子的“逻辑思维”发展添砖加瓦。\n\n**第一招：充分利用日常生活中和孩子的聊天**\n\
    \n比如，和孩子吃苹果，孩子会形成关于苹果的直观印象，如果你注意引导孩子观察苹果的形状、颜色、口感，孩子就会理解这些表象，并把它们和苹果建立起联系，逐渐找到这个食物的本质特征，这是教他们理解苹果这个事物。以后再遇到，就可以判断出来。\n\
    \n再比如，当你第一次和孩子说“苹果是果实，胡萝卜是根”这样的判断时，你最好让孩子看一眼苹果在树上、胡萝卜在土里的样子，让他们眼见为实地知道“果实”和“根”的区别。\n\
    \n有的时候，你的言语表述中流露出的某种情感，也会直接影响孩子对事物的理解和判断。\n\n比方说，你指着小猫说“小猫经常踢翻咱家的花盆”，那么孩子听到了，即使以前喜欢，也会对猫的理解、评价发生改变。\n\
    \n你可以观察一下，当孩子不断地追问你“为什么”的时候，说明孩子进入了逻辑敏感期，你要给孩子确切的答案。\n\n同时，如果孩子开始使用类似“因为，所以”“如果，就”这样的复式句，就说明孩子开始抽象分析问题了，已经意识到了事物和事物之间的关联。\n\
    \n为什么在数学上，我始终强调在情境中、在事物的摆弄中让孩子去了解概念呢？\n\n比如认识三角形，就是要利用实际存在的物体发展孩子的直观形象思维，之后将直观形象与抽象词语建立起牢固的关系，这些都是逻辑思维的根基。\n\
    \n**第二招：在规律中提升**\n\n事物的“规律”说白了就是事物之间的内在逻辑关系。\n\n比如，把一组积木按照正方体、长方体、圆柱的顺序排好，当你抽去几块时，让孩子根据已有的积木找出规律，把适当的积木再放回恰当的位置，这是空间图形的规律。\n\
    \n类似的还有平面图形的规律、故事的发展顺序、数字的规律、事物颜色的规律等等。这些看似表面的规律，孩子能利用摆一摆的“行动”去思考，就为直观形象上升到抽象的“逻辑思维”打好了基础。\n\
    \n**第三招：在2个小游戏中提升**\n\n这两个游戏中的规则因为通常包含理解、判断与推理，特别有利于培养孩子的逻辑思维。\n\n### 1. 接龙\n\n\
    这个游戏就是利用前后某种关系，以续接的方式来玩儿，游戏本身可以像长龙一样一直玩下去。\n\n刚开始玩这个游戏的时候，可以侧重概念的理解：\n\n比如，可以和孩子玩“你拿水果，孩子报数字”这样的一对一接龙；\n\
    \n也可以“你说动物种类，比如天上飞的，孩子说具体动物名称，看谁说得多”这样的一对多接龙；\n\n还可以是“食物接龙”，比如，一堆糖果放在一起，按照糖纸“红蓝黄红蓝黄”接龙。\n\
    \n等孩子对游戏熟悉了，语言也更丰富了，就可以玩有词义关联的抽象接龙了，比如，词语接龙、造句接龙、问题接龙，甚至是故事接龙等。\n"
  mdcn: "\n## 2. 给形状涂色\n\n顾名思义，就是画出形状的外框，让孩子来个涂色游戏。\n\n做这个游戏，我要提醒你，最好结合孩子生活中可见的各种事物，把形状赋予现实名称和意义，比如一朵花、一杯饮料、一颗苹果。可以你来画边框，孩子来涂色；如果孩子很喜欢这样的游戏，也可以让孩子来创造图形边框，由你完成涂色。\n\
    \n这个游戏中，你和孩子会有很多的话题：关于颜色的话题、线条的话题、事物名称的话题，一直到形状的话题，只要你多加引导和交流，孩子掌握起来会觉得相当轻松好玩。\n\
    \n## 第三招：让玩具来帮忙\n\n这里，积木又要派上大用场了，各种立方体、长方体，以及其他立体图形，在摆弄中强化了孩子的图形意识。\n\n每一种玩具再仔细观察观察，又能从积木的每一个面找出“正方形、长方形”等平面图形来。\n\
    \n玩具玩完了，还可以根据图形来分分类、收放好，既培养了良好的习惯，又能让孩子从图形属性中学到东西。\n\n另外还有一些现成好用的玩具，比如，用几根雪糕棍体验三角形、正方形和长方形的构成特征；用形状拆装车、七巧板、形状积木串珠等进一步区分图形之间的不同；还有安全的橡皮泥，也可以帮上大忙。\n\
    \n## 第四招：快乐的形状童谣\n\n朗朗上口的童谣和形状结合在一起，既有韵律，又有画面感，特别有益于孩子主动去理解图形，拓展空间想象力。\n\n比如：\n\
    \n> **《神奇三角形》**\n> 三角形，三条边，三个角，\n> 变条小鱼水里游，变只小鸭嘎嘎叫。\n> 三角形，三条边，三个角，\n> 变只狐狸咪咪笑，变只袋鼠蹦蹦跳。\n\
    \n再比如：\n\n> **《形状变变变》**\n> 圆形圆形变变变，\n> 变个车轮地上跑，\n> 变个皮球跳得高，\n> 我是圆形的好宝宝；\n> 正方形，变变变，\n\
    > 变个盒子找一找，\n> 变个枕头抱一抱，\n> 我是正方形好宝宝；\n> 三角形，变变变，\n> 变个风筝天上飞，\n> 变个帽子头上戴，\n> 我是三角形好宝宝。\n\
    \n这些形状的童谣都非常有画面感，如果唱童谣的同时，再动手画一画，找来相关的道具设计表演一番，效果会更好。\n\n## 第五招：发掘绘本中的图形元素\n\n\
    我给你推荐两个非常好用的绘本。\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_56_0.png)\n\n一本叫《建筑工地》，书中讲了一座房子是如何建好的，你和孩子能从图画中学到不少建筑技巧，而每一个技巧都离不开建筑中的图形设计：\n\
    - 梯子按什么形状架设才稳当；\n- 立方体的砖块怎样才能砌成一堵墙；\n- 长方形的天窗是怎么安装好的；\n- 水泥车的形状又有什么特点等。\n\n一旦翻开这本书，不识字的孩子也能从自己的角度讲出一个丰富的故事来。故事中让他们思考最多的除了建筑过程，当然就是这些形状问题了。\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_57_0.png)\n\n另一本是《我的百变浴缸》。故事开始于小主人公的一句发问：“就不能偶尔换个不一样的浴缸吗？”\n\
    \n于是，他想象自己有了球形浴缸、迷宫浴缸，还有蜂窝浴缸、布丁浴缸、金字塔浴缸。不仅如此，他还给爸爸妈妈，还有哥哥都设想了适合他们的奇妙浴缸……\n\n故事通过小男孩对浴缸的幻想，展现了一个空间图形的美妙世界！\n\
    \n## 图形概念启蒙的绘本清单\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_0.png)\n\n《建筑工地》\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_1.png)\n\n《我的百变浴缸》\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_2.png)\n\
    \n《积木大营救》\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_3.png)\n\n《奇妙图书》\n\n\
    ![](img/1d3dd3156cdd013d8b512f727b5f5426_59_4.png)\n\n《形状游戏一起玩》\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_59_5.png)\n\
    \n《埃姆斯的几何花园》\n\n提醒你一个问题：启蒙图形概念，并不是只启蒙数学意义下的图形，而是要将生活中的各种形状都带入孩子的思考空间，让孩子理解空间关系。\n\
    \n这样做的意义在于，孩子可以通过这种前期的培养，让空间想象能力得到充分发展，从而具备思考和再现物体形状、位置和结构关系的能力。而这种能力是拥有创造力所必须的。\n\
    \n为什么这么说呢？我们以正方体为例。\n\n孩子刚开始看到正方体时，你问他有几个面，他只能说岀看得見的那几个面；渐渐的，他从各个角度认识了正方体，幷在头脑中形成了正方体的完整印象，即使眼睛看不到，他也知道那些面是存在的。这就需要空间想象能力发挥作用，是需要之前的空间体验作为积累的。\n\
    \n一旦哪一天，他需要创新时，他就会在大脑中检索已经理解和存储的图形，如果恰好需要正方体，他就可以结合正方体的特性创造岀自己需要的东西来。\n\n## 本讲小结\n\
    \n给孩子启蒙“空间中的图形”，幷不是简单地记住图形的名字，而是要在充分观察、思考的基础上，理解图形的特点。\n\n一定要让孩子多看、多摸、多动手，剪纸、积木都是非常好用的。\n\
    \n以“图形”为基础的空间想象能力对孩子非常重要，除了数学应用外，孩子的创意思维，以及语文中图形“汉字”的识别能力都离不开它。\n\n# ## 7. 如何教孩子理解空间方位关系\n\
    \n每一个物体都存在于空间之中，通过占有位置，而与其他事物发生空间关系。\n\n这里，“关系”一词的含义是指物体之间的“空间方位”，它既与位置有关，也与距离、方向密切相关，是这些生活经验的集中表现，一般用“上下”“前后”“左右”“远近”等词语表示。\n\
    \n“空间关系”的核心是“参照物”，参照物不同，物体的空间位置就截然不同。\n\n孩子的能力是以自身为中心逐渐发展起来的，因此，能够认识并理解“以自身为中心”，还是“以其他物体为中心”直接决定了孩子“空间关系”的能力水平。\n\
    \n“空间关系”与“情境”关系密切，是相对和可变的：相同的情境下，“角度”不同，就可能得出完全不同的空间关系。\n\n这对孩子而言是一个难点。\n\n比方说，“桌子在你前面，椅子在你后面”，一旦你身体向后转了，桌子和椅子相对于你的前后关系也反转了，如果还用原来的结论那就错了。\n\
    \n空间中，事物之间的关系决定了我们理解和表述世界的能力，因此，要创造一切机会帮助孩子获得充分的认知发展。\n\n# 一、认识空间关系的四个阶段\n\n-\
    \ 第一阶段：辨认上下方位\n  大多数 3 岁的孩子仅能达到这个水平。\n- 第二阶段：辨认前后方位\n  尽管“距离”“深度”这种空间能力从婴儿期已经开始发展，但直到三四岁时，他们才能发展出准确判断“距离远近”的能力。\n\
    \  这时，他们对看到的景物，能表达出“房子在树木的前面”这样的结论。而到 4 岁以后，他们就可以辨认出前后关系了。\n- 第三阶段：以自身为中心辨认左右方位\n\
    \  大多数孩子到 5 岁时可以达到第三阶段的水平。\n- 第四阶段：以客体为中心辨认左右方位\n  6 岁以后，孩子们就可以熟练运用前三个阶段了，但是第四阶段能力的发展却并不均衡。甚至对于有些孩子来说，这种能力始终是一种障碍。\n\
    \  在这里，孩子判断自身对面物体的“左右关系”尤为困难，只有帮助孩子实现了“空间旋转”的思考，他才能理解对面事物与自身反向的关系。\n\n尽管孩子们都是以“自身为中心”发展出“空间方位”的，但是当某个事物的标记特别明显时，他们也能第三阶段和第四阶段同时发展。\n\
    \n这说明，当你抛给孩子一个“空间方位”问题要他思考时，问题的设计至关重要。\n\n比方说，让孩子认识左右的时候，你可以说成“左手、右手”，更可以告诉他右手就是拿勺子的那只手，孩子会很容易记住与具体事物结合的方位词。\n\
    \n有了这样的对应，吃饭时你就可以和孩子说：“看见奶奶拿勺子的右手了吗？把奶奶右手边的碗递给妈妈。”\n\n而由于我们本身的生活空间是三维空间，而孩子又常常同时接触到二维的和三维的，因此孩子“空间方位”能力的发展是：先认识一个笼统的三维空间，然后再认识其中的二维、一维空间；在能力逐步发展，掌握了一定的概念和表达之后，又反过来从部分到整体，继续发展一维、二维和三维的空间关系。\n\
    \n也就是说，“空间关系”能力的认知发展过程是沿着整体到局部，再由局部到整体，呈螺旋式上升的。\n\n拿三维空间和二维空间来说：孩子认识“前后”方位时，先是在自己生活的空间，也就是三维空间中掌握，然后才能识别出照片上的“前后”关系，这是因为观察照片有一个二维向三维转换的过程；这个能力具备之后，他们才能根据照片去逆向完成三维空间中的某件事，比如，照着说明书上的图片搭积木就是更高级的能力。\n\
    \n# 二、怎么教孩子理解空间关系呢？\n\n教给你 5 招。\n\n**第一招：在聊天和观察中激发孩子说出“空间关系”**\n\n生活在空间中，各种事物无时无刻呈现着各种空间关系，稍加提醒孩子就能学到很多。比方说，他收到了漂亮的礼物，你可以和孩子一起打开，同时说“哇，好酷的汽车！快把它拿到盒子外面。”\n\
    \n孩子不玩儿了，可以说“把它放回盒子里面。”再比方说“图画书在桌子上面”“皮球在桌子下面”。孩子垒个高高的积木塔，上下关系、前后关系等可以一边搭一边用起来。\n\
    \n在孩子语言发育的关键时期，帮孩子说出来，还能丰富他们的词汇量，提升他们在“空间关系”方面的语言表述能力。\n\n等孩子语言达到了一定水平，你可以干脆和孩子来个反义词游戏。一有机会就可以把什么上对下、前对后、里对外、左对右玩个遍。从词汇上对“空间关系”加以熟悉和巩固。\n\
    \n**第二招：充分利用好出门玩耍的一切机会**\n\n带孩子走出家门，那些需要识别的“位置”“距离”“方向”自然就来了。这时，你可以让“空间关系”发展的每个阶段走进你们，这是孩子最容易接受的方式。\n\
    \n在公园里，和孩子坐一坐轨道车吧。孩子不仅一下子看到了更多的景物，你还可以一路让孩子观察，什么还在“上面”，什么已经在“脚下”了。\n\n随着景物位置发生的明显变化，还有了行进的方向，前后车的关系等等；如果一个玩具需要排队才能玩上，这时候，可以让孩子观察，谁排在自己的前面和后面。\n\
    \n当然，如果你们一家真的去远行，火车上不同方位风景的变化、飞机上那些极端的高空远景更是最好的素材，随着孩子自身位置的转换，有不少的上、下、前后、左右关系可供观察和交流；也非常容易找到从“自身”转换到“典型参照物”，并进一步提升对这些空间关系的理解。\n\
    \n**第三招：我教你两个游戏**\n\n游戏中，可以根据孩子的不同“空间关系”水平玩出不同的花样。\n\n1. **贴鼻子**\n   顾名思义，就是画一张人脸，只空出“鼻子”来；游戏时需要蒙着眼把“鼻子”贴到准确的位置，孩子在这个过程可以得到声音提示。你可以说，“上一点”，“下一点”，“左一点”，“右一点”等。\n\
    \   刚开始玩的时候，这个游戏可以简化为“摸五官”。就是当你说“鼻子”时，让孩子立刻摸到自己的鼻子；当你说“耳朵”时，立刻摸到“耳朵”……慢慢的，可以让孩子去摸别人的五官，比如让爸爸和孩子面对面，你来说五官的名称，让孩子在“爸爸”的脸上指出对应的位置。这是让他们通过触觉和声音感受事物位置关系。\n\
    \   接下来，就可以玩真正的“贴鼻子”游戏了。游戏的过程可以由近及远，画面可以由大到小。但需要注意的是，一定要等到孩子能够睁着眼完成后，再蒙着眼玩儿。\n\
    \n2. **捉迷藏**\n   这个游戏最厉害的地方是，每一次玩儿，“空间关系”都可以玩出不同的花样来。\n   “藏的人”可以知道什么里面最安全，什么下面不安全；“捉的人”则猜想着，什么后面、什么上面可以一下捉到人。\n\
    \   寻找一个安全的空间，你们可以一家人玩，也可以让孩子和小朋友一起玩，既要“捉”也要“藏”。\n   正是这样的角色变换可以带来最自然的“空间旋转”，让孩子在游戏中不自觉地体验各种空间关系，包括“以自身为中心”还是“以其他东西为中心”去辨别左右关系等。\n\
    \n**第四招：充分利用好拼图**\n\n拼图对孩子的数学能力培养是非常深刻的，它既有对于任意形状的观察，更有形状之间的关系思考，平面拼图涉及二维的空间关系，立体拼图则是三维的空间关系。\n\
    \n你既可以直接购买，也可以亲手制作。\n\n我建议刚开始玩的时候，用孩子熟悉的图自己制作是最适合孩子的。拼图的块数可以由少到多，这样，孩子需要处理的空间关系就会由易到难，针对性会更强。\n\
    \n另外，在孩子有了一定的拼图能力和技巧以后，你们就可以去挑战更难的地图拼图了。\n\n**第五招：发掘绘本中的“空间关系”元素**\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_67_0.png)\n\
    \n这里，我给你推荐绘本《谁藏起来了》，可以说这本书就是纸上的捉迷藏。\n\n翻开绘本，在每一页：狗、老虎、河马、斑马、袋鼠、狮子、兔子……孩子们喜欢的 18\
    \ 个动物逐个登场亮相，瞪大眼睛看着你。而每页的文字只有一句话：“猜猜看，谁藏起来了？”\n\n如何找到答案，找到了如何描述？这个过程中你们是如何寻找参照物的？相信你一定可以和孩子在共读中找出许多办法来。\n\
    \n## “空间关系”启蒙的绘本清单\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_0.png)\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_1.png)\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_2.png)\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_3.png)\n\
    \n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_4.png)\n\n![](img/1d3dd3156cdd013d8b512f727b5f5426_69_5.png)\n\
    \n这节课的最后，我想就自己遇到过的现象做一个解释。\n\n有妈妈反映，怎么我的孩子老是不听老师的话。老师说向东他朝西，愁死了。上体育课，孩子左右分不清，总搞错。\n\
    \n其实，这个不能全怪孩子，确实有孩子是因为“空间方位”启蒙的滞后而导致相应的能力发展滞后，于是就因为对方位不敏感，从而造成了“不听话”的后果。\n\n##\
    \ 本讲小结\n\n这一讲，我讲了如何给孩子启蒙“空间中事物之间的关系”。带孩子经常出去玩，让他感受空间方位的变化。拼图也是一个重要的手段。\n\n# 8.\
    \ 如何培养孩子的逻辑思维\n\n“逻辑思维”属于抽象思维，是智力活动的高级形式。任何学习的终极目标其实都是提高“逻辑思维”，而数学知识通常具有强逻辑性，所以逻辑思维的养成在数学领域特别重要。\n\
    \n# 一、数学知识中的逻辑思维\n\n什么是逻辑思维？\n\n举个最简单的例子：桌上放着一盘水果，你让孩子想办法把它们分给到场的客人，怎么办呢？\n\n\
    解决这个问题的过程就需要逻辑思维了。\n\n首先，孩子认识“水果”“客人”，想在水果和客人之间建立联系；接下来，孩子就要思考解决办法了。\n\n孩子可以利用“数的概念”，结合“对应的概念”，利用水果和客人之间的联系，直接“判断”出结果，比如每人分一个苹果。\n\
    \n在这个基础上，他还可以结合你对“客人的年龄”“喜好”这些信息进行“判断”的基础上，进一步“推理”，找出更加符合实际情况的分配方案来，比如小孩子爱吃甜的，就多给几个草莓等等。\n\
    \n通过这个例子，你能看出来“逻辑思维”就是在概念的基础上，通过对事物的“理解”“判断”“推理”来揭示事物联系的过程。说白了，它就是问题的“详细解决方案”。\n\
    \n这其中，对“事物的理解”是最基本的，然后才有“判断”，才有“推理”。\n\n### 1. 对事物的理解的三条规律\n\n- 先理解个别事物，再理解事物之间的关系，比如先理解苹果、橘子、香蕉，再理解综合一点的“水果”这个概念。\n\
    - 先理解具体形象，再理解抽象的词汇，比如先理解了水果，再理解“大”和“甜”的感觉。\n- 先形成对事物简单表面的评价，再实现复杂深刻的评价，比如先理解苹果是红的，再理解它很好吃。\n\
    \n### 2. 判断推理\n\n大多数 3 岁的孩子还不能进行判断推理活动；4 岁时，判断推理能力开始发展；到了 5 岁，大部分孩子都可以进行简单的推理活动了。\n\
    \n有研究发现，学龄前的孩子完全具备“逻辑思维”的能力。但常常因为“知识经验”的不足，引发可笑的推断。\n\n比如中国心理学界的泰斗朱智贤教授就说过这样一个例子：\n\
    \n一个五六岁的孩子被妈妈问，为什么车一开起来就有风呢？孩子说，“风是从轮子里出来的！”因为在孩子看来，轮子一动就有风，轮子停了就没风。\n\n这种时候，孩子即便说错了家长也不用着急，只要孩子有良好的思考习惯，随着他们的年龄增长，知识经验不断丰富，一般到小学的时候，对于生活中的常见事物，孩子都能很好地进行合乎逻辑的判断和推理。\n\
    \n# 二、怎样帮助孩子发展逻辑思维能力？\n\n下面我就教你 5 招实用的家庭互动游戏，给孩子的“逻辑思维”发展添砖加瓦。\n\n**第一招：充分利用日常生活中和孩子的聊天**\n\
    \n比如，和孩子吃苹果，孩子会形成关于苹果的直观印象，如果你注意引导孩子观察苹果的形状、颜色、口感，孩子就会理解这些表象，并把它们和苹果建立起联系，逐渐找到这个食物的本质特征，这是教他们理解苹果这个事物。以后再遇到，就可以判断出来。\n\
    \n再比如，当你第一次和孩子说“苹果是果实，胡萝卜是根”这样的判断时，你最好让孩子看一眼苹果在树上、胡萝卜在土里的样子，让他们眼见为实地知道“果实”和“根”的区别。\n\
    \n有的时候，你的言语表述中流露出的某种情感，也会直接影响孩子对事物的理解和判断。\n\n比方说，你指着小猫说“小猫经常踢翻咱家的花盆”，那么孩子听到了，即使以前喜欢，也会对猫的理解、评价发生改变。\n\
    \n你可以观察一下，当孩子不断地追问你“为什么”的时候，说明孩子进入了逻辑敏感期，你要给孩子确切的答案。\n\n同时，如果孩子开始使用类似“因为，所以”“如果，就”这样的复式句，就说明孩子开始抽象分析问题了，已经意识到了事物和事物之间的关联。\n\
    \n为什么在数学上，我始终强调在情境中、在事物的摆弄中让孩子去了解概念呢？\n\n比如认识三角形，就是要利用实际存在的物体发展孩子的直观形象思维，之后将直观形象与抽象词语建立起牢固的关系，这些都是逻辑思维的根基。\n\
    \n**第二招：在规律中提升**\n\n事物的“规律”说白了就是事物之间的内在逻辑关系。\n\n比如，把一组积木按照正方体、长方体、圆柱的顺序排好，当你抽去几块时，让孩子根据已有的积木找出规律，把适当的积木再放回恰当的位置，这是空间图形的规律。\n\
    \n类似的还有平面图形的规律、故事的发展顺序、数字的规律、事物颜色的规律等等。这些看似表面的规律，孩子能利用摆一摆的“行动”去思考，就为直观形象上升到抽象的“逻辑思维”打好了基础。\n\
    \n**第三招：在2个小游戏中提升**\n\n这两个游戏中的规则因为通常包含理解、判断与推理，特别有利于培养孩子的逻辑思维。\n\n### 1. 接龙\n\n\
    这个游戏就是利用前后某种关系，以续接的方式来玩儿，游戏本身可以像长龙一样一直玩下去。\n\n刚开始玩这个游戏的时候，可以侧重概念的理解：\n\n比如，可以和孩子玩“你拿水果，孩子报数字”这样的一对一接龙；\n\
    \n也可以“你说动物种类，比如天上飞的，孩子说具体动物名称，看谁说得多”这样的一对多接龙；\n\n还可以是“食物接龙”，比如，一堆糖果放在一起，按照糖纸“红蓝黄红蓝黄”接龙。\n\
    \n等孩子对游戏熟悉了，语言也更丰富了，就可以玩有词义关联的抽象接龙了，比如，词语接龙、造句接龙、问题接龙，甚至是故事接龙等。\n"
