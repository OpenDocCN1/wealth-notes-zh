    # 第十五課 保持開闊的心，尊重別人的經驗


    一九七○年代晚期，當我剛開始想辦法要累積財富的那段日子，奧黛莉和我會開車去西罕普敦海灘的房子，遠離城市塵囂。我們住在西罕普敦海灘時，我會到洛博（Rob &
    Rob）去，洛博是當地一家小型經紀商，由西罕普敦當地的有錢人和一群交易所的作價者所擁有，做爲他們度假時，吃完午餐、打完高爾夫球後可以看盤的地方。


    洛博給人的感覺就像是一群剛復興用的投機客的俱樂部，而不像是一個做生意的地方。它的


    辦公室只不過是一個擺了六張辦公桌的小房間，在營業大廳的西面窗戶下則放著一條長板凳。大廳東面高處可以俯瞰整個大廳的地方，是一面顯示著最新市場報價的跑馬燈報價揭示板。任何人只要想看市場行情，都可以自由地走進去，很輕鬆地坐在那條長板凳上看盤，而那裡也總是有一群過了氣的傢伙在看盤並交換市場裡的小道消息。不論何時只要他們之中有人要賣出一個賺錢的部位時，就會驕傲地走到一個無人的辦公桌前拿起電話大聲吆喝著賣出指令。相反的，如果他們之中有人輸了錢，那個人就會吹著口哨，偷偷地走到最遠的角落，在眾人耳力範圍之外悄悄歎氣。我很喜歡坐在那張長板凳上，看著揭示板上的報價，同時冷眼看著那些過氣的傢伙互相胡說八道，我心裡的優越感高得不得了。


    我一直把自己控制得很好，但是有一天我和一個叫做約翰的傢伙聊了起來。約翰七十來歲，每隔好一陣子才會在號子裡出現。像我一樣，約翰也隨身帶了一疊技術圖。他會走進營業大廳，在長板凳上找個位子坐下，開始盯著行情揭示板，然後蒐集資料來計算他的技術指標。在他畫著圖時，約翰告訴我他已經退休，但是由於他在華爾街工作了許多年，所以現在靠華為紐約證券交易所裡的操盤手提供諮詢來增加一些額外的收入。然後他教了我一些我從未（之後也不曾）聽聞的東西。我後來發現，他說的那些都是事實。


    那段日子，市場狀況和現在大不相同。市場中多頭和空頭出現的頻率，比現在要來得均衡，不會出現像我們從一九八二年开始所經歷的大多頭走勢。約翰告訴我，在空頭市場中，市場領


    向於在每天早盤或是一週的頭幾天上漲，但是是在尾盤或者是一週的後幾天，則會出現明顯的賣盤。為什麼會這樣？根據約翰的說法是：如果當沖的操盤手處於虧損狀態，而且市場仍持續疲軟的話，那些當沖客會在每天收盤前軌平部位，然後在下個交易日再重新進場。而且，隨著日子接近一週的尾聲，那些稍微中線的交易者常會想在週末之前結清部位。如此一來，這些中線操盤手就不會在週末這兩天休市、價格也停止波動的時候，在保證金帳戶中掛兩天的赤字。但是在是一個多頭市場中，約翰認為操盤手已經習慣於賺錢，這時主導交易行為的就是貪婪，而非恐懼。所以操盤手不會輕易出場，會傾向於持有隔夜或是跨週末的部位。約頓說的話讓我頗為受用，明白了空頭市場中操盤手在每天早盤或是一週的頭幾天時買進，或是在每天尾盤及週末前賣出的習性，幫我在空頭市場中賺了好幾次錢。


