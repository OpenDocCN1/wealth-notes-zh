    地的许多小型存放款机构从事附买回交易。资产管理公司在四月八日因为无法履约和客户的附买回协定而宣布破产，毕维尔、布列斯勒公司和它所有的分支机构也都在周三宣布进入受破产管理人监管的状态。证管会控告该公司及其负责人涉嫌欺诈，并指称他们“取得客户帐户中证券的控制权，加以利用以牟取私利”。


    ### 这里是芝加哥，什么事都有可能发生


    我不知道拉萨尔和这些小丑之间的往来有多密切，但是马库锡兄弟本身就有债券生意，而且必然会透过拉萨尔公司的名义从事附买回交易。但是在附买回交易之中，拉萨尔会把现金交付给对方，然后取回国库券作为保障。如果我都受到波及的话，最可能的就是他们在从事反方向交易时，把我账上的国库券交付给对方换取现金，但却把现金亏掉了。


    不过照理说他们应该无法这么做，因为我的国库券是放在法令管制帐户中。但话又说回来，这里是芝加哥，什么事都有可能发生。


    我心里思考着各种可能，我不断试着和杰克联络，最后终于和他连上了线。“杰克，这到底是怎么回事？我要你马上把我的国库券汇回来给我。”


    > [马丁，你冷静一下。一切都没问题，坐下来喝一杯我送你的好酒放松一下。]


    [去你的烂葡萄酒，杰克！我要我的钱！我那些国库券都是放在法令管制下的帐户里的，你这浑球怎么可以动用它们？这是违法的！你马上把国库券汇回来给我，否则我把你那该死的头给砍下来！]
    顺道一提，杰克的身材和强尼一样，都是大块头。


    “马丁，我们电脑当机了，强尼会尽快搞定，相信我，一切都会没问题的。”


    “放屁！我告诉你……”


    嘟嘟嘟……杰克把电话挂了。妈的！我感觉得出来，他们一定把我的国库券给吞了。我不能损失这一百二十万美元，至少不能在这个节骨眼。我们才刚搬进这豪华公寓，而且奥黛莉马上要生了，我要怎么去弄到那笔每月管理费？百般无奈，我又打电话给CME的法国部门。


    “是你们核准这些家伙的注册申请的，”我暴跳如雷：“你们必须为他们的行为负责，你们得马上摆平这件事，这是你们的问题。”“他们草率地敷衍我，说他们会‘重视这种事情’。”


    我打电话给我的律师：“我要告这些混蛋！我要拿回我的钱！我要他们好看！”律师建议我，没掌握直接证据前先稍安勿躁。


    我也打电话给从前在贝尔·斯滕公司的经纪人麦克·马格利斯（Mike Margolis），因为我知道他们公司在芝加哥的生意不少，我也知道贝尔·斯滕的大老板之一吉米·凯恩（Jimmy
    Kane）和米尔兰是老哥儿们。“马格利斯，你一定要帮我这个忙。芝加哥的那些混蛋想坑我一百二十万美元。请你找凯恩打几个电话，帮我问问这一切到底是怎么回事？”马格利斯答应他会帮这个忙。


    我在一一片混乱下试图找出事情的来龙去脉，但直到那天很晚的时候，还是一点也不能肯定是否能再看到我那价值一百二十万美元的国库券。我一夜无法成眠，第二天一大早开始打更多的电话。


    在行业内，有污点是家常便饭……

    “黛比，事情怎么样了？有新消息吗？”

    “杰克和强尼什么都没说，但有很多传闻。看起来拉萨尔公司好像是宣告倒闭了，他们所有的帐户都已经转到其他结算公司去了，今天的《华尔街日报》上报道得很详细。”

    “可是我的钱呢？”

    “唉呀！马丁，我也不知道。”


    我到楼下大厅去拿《华尔街日报》，那老先生又正好站在旁边。他正和另一个住户委员会聊天，两个人边看着金融投资版边摇头。该死！他们一定正读到有关毕维尔、布列斯勒公司这件事。他们知道我的经济状况出了问题，而且准备要把我们一家全都赶出去。我躲在一座屏风后面等他们离开。


    等他们走了之后，我赶紧拿了报纸跑回楼上。那篇有关拉萨尔公司的报道，读起来像是芝加哥商会的新闻稿。“拉萨尔公司，一家小型的政府证券交易商。该公司和毕维尔·布列斯勒公司从事附买回交易时产生了一百至两百万美元的亏损。……在拉萨尔公司的请求下，该公司所有客户的帐户都已经转到其他芝加哥地区的结算公司。……交易所表示在拉萨尔公司将客户帐户转到其他结算公司的过程中，所有客户资金都没有任何问题。……商品期货管理委员会的发言人表示，所有的迹象显示，该公司客户的资金都完整无缺，并未遭到不法挪用。”


    我打电话给 CME 的法务部门。“《华尔街日报》上说所有拉萨尔公司客户的帐户都转到其他结算公司，而且客户的资金都完好无损，未遭到不法挪用。那我的帐户现在是在哪一家结算公司？我那‘一百二十万资金又在哪里？’”他们说不知道，交易所和
    CFTC 都在“深入了解中”。


    “少跟我去这套！”我对着电话大声叫：“我的钱是放在法令管制的帐户里，应该谁都没办法动用。你们要知道，你们不是唯一在华盛顿特区有影响力的人。如果你们在今天下班以前没把我的钱还给我，我就打电话到
    CFTC，告诉他们你们这些家伙在这里干的好事！”


    我打电话给律师、打电话给马格利斯、打电话给黛比、打电话给佐尔纳，甚至打电话给 AMEX 的桑坦吉罗，问他们是否还知道谁可以联络帮忙。终于，在五点之前，有人打电话给我，他是索尔·史东公司
    (Stall & Co.) 的业务代表，是芝加哥的一家结算公司。这家伙听起来是个爽朗的人。他说他们接管了我的帐户，而我那价值一百二十万美元的国库券也转到他们公司，他们也愿意请黛比继续担任我的场内接单员。


    “马丁，我们很高兴能和你做生意，你明天一大早就可以开始交易了。”


    我简直不敢相信这是真的。两天来，我第一次觉得全身紧绷的情绪松懈下来，我终于还是毫发无伤。我拿起了专线和黛比联络。“是啊，黛比，他们把我的钱找回来了。看来我们可以重新开工了。你现在为索尔·史东工作啦！”


    “什么？”


    “我的帐户被转到索尔·史东公司去了，我告诉他们如果不是你来合作，我就不跟他们做生意了！”


    意，所以你就和我的资金一起转到他们那里了。你同意吗？”


    “好啊，我想没问题，马丁。但这到底是怎么回事？”


    “我也不知道，我想你也不会想知道。大概有某个人为了某种原因做了一切。这一百二十万对他们来说算得了什么？他们早晚会从另一个家伙身上削回来的。他们这么做只是要让这些游戏能够继续下去罢了。”


    我一直都不知道到底是谁帮了这个忙，但无论如何我总算把钱拿回来了。我不知这是否意味着其他拉萨尔的客户无法拿回他们的资金，不过在我的想像中，一定是CME里的大人物找到那些结算公司，然后把一切搞定。他们无法承受交易所名声被毁损的后果，所以就和那些结算公司找出这样的解决方法，让我的钱回到帐户里。


    那天晚上我睡得像个木头似的。第二天早上我下楼去拿日报时，那位老先生站在走廊上。“早安，早安。”我用非常愉快的语气向他问候。


    “早安，舒华兹先生。”当我经过时，他说：“所有的东西都搬好了吗？”


    “是啊，是啊，一切都很好。我又重新开工啦！”


    至于杰克和强尼后来还是回到这个行业来。他们的结算公司是倒闭了，但他们还在C BOT从事债券期货的交易。在职业生涯中留下小小的污点，说起来也是在这行业打滚的人的家常便饭吧！


    ## 问问自己，是否具备这三项特质


    我有个朋友马克·库克（Mark Cook），是住在俄亥俄州的农夫，同时也是一个很好的操盘手，他甚至发展出一些有趣的交易策略，并透过传真服务把这些策略卖出去。我很喜欢和其他优秀的操盘手聊天，因为我热切想和他们交流资讯。我一点也不介意在得到资讯的同时，分享我所知道的给别人，而库克也会把他的传真稿给我，我们会根据这些策略进行交易。


    一九九七年一月二十三日，我收到了一封库克的传真稿，那篇稿的标题是：“什么东西使人成为成功的操盘手？”一般人总是喜欢问我，要怎样才能成为伟大的操盘手，所以我非常有兴趣看一看库克对这件事有什么想法。


    根据库克的说法，想要成为成功的操盘手，你必须：


    - 一、全心投入，并且全职从事交易

    你必須將操盤視為職業，因為如果不這麼做，其他把操盤當職業的人，就會在很短的時間內把錢從你身邊拿走。庫克整天都盯著市場行情，從開盤直到收盤為止，並且保有一本有時甚至長達四十個要點的交易日記，不間斷地記載著每天行情的變動狀況。如果他不能做，獲利就會顯著衰退。「在操盤手這一行裡沒有任何捷徑，如果你鬆懈懶散，市場馬上就會發現。」


    - 二、要將你自己的個性融入操盤習慣中

    如果你是一個對事情很容易做情緒性反應的人，那就承認自己是情緒化的人，並將你的交易習慣架構於這一點之上，讓你的情緒成為交易的助力，而非阻力。如果你生性貪婪或膽子很小，都將影響你從事交易時的決策力。如果你無法察覺出左右情緒的原因，決策將會發生錯誤。庫克是一個有恐懼傾向、膽小的人，每當他最感到恐慌而裹足不前時，都因為他對自己情緒的認知，總能克服心理障礙而大膽作多。「無論何時，每當我快搖擺不佳恐懼時，我受過的訓練會告訴我作多，而我深信訓練和紀律一定會勝出。如果做不到這點，任何人都註定失敗。」


    - 三、計畫是交易行為中最客觀的一部分

    事先模擬好最糟結果，並針對它進行充分的演練。在你執行每一筆交易前都保持最客觀的心態。一旦你已經執行交易、建立部位後，情緒將掌控一切，你必須在之前就將計畫準備好。知道什麼樣的條件可以證明自己已經犯錯，並在那些條件成立後馬上承認錯誤。「乾平部位、撤退，保留實力準備另一天的戰鬥。這些做法看起來怯懦，卻能有效防止你在市場上陣亡。」


    我完全同意。


    另一个我常想问的问题是，到底操盘是不是一种天生的行为，还是一种可以经由学习而得的能力？我的答案是——两者皆是。从天性来看，我对数字向来感觉敏锐、个性喜好竞争，而且好赌。大学的教育让我学会如何努力工作，哥伦比亚大学商研所给我完整的商学知识，而海军陆战队则训练我在枪林弹雨下如何因应状况。


    一个伟大的操盘手就和伟大的运动员一样，必须具有先天的条件，但也必须训练自己如何以最有效的方式运用它们。


    ## 第10章


    # 第一次买画就上手

    进军艺术品市场


    一九八五年八月五日，奥黛莉生下了我们的儿子，一个漂亮、六磅十一盎司重的小绅士。同年十一月，奥黛莉被医师诊断罹患了乳癌。这个打击，就如同我们在一九八一年失去第一个孩子一般沉重。


    但我们也因此更加确信一件事：人生在世，要及时行乐。在接下来的春、夏季里，奥黛莉决定把家全部重新装潢。她打掉墙壁、放进了一个新厨房、重新装修浴室、把所有窗户换新，并全部重新粉刷。这次整修，花掉大把的钞票，但我并不介意，我仍然是冠军操盘手，仍然能够赚得比花得快。


    事实上，我正准备要花更多钱。


    一旦你往上爬到某个高度，就绝对不会缺乏一些昂贵的嗜好。泰德·透纳（Ted Turner）为自己买了一艘十呎长的比赛用游艇，乔治·史坦布瑞纳（George Steinbrenner）为自己买下洋基队，韦恩·牛顿（Wayne
    Newton）为自己买了正统的阿拉伯种马，而查尔斯王子则替自己找了个情妇。但是我对于游艇、职业棒球队、种马都没兴趣，加上有奥黛莉在身边，市场就是我唯一的情妇。如果我要投入一大笔钱在某个嗜好上的话，我希望把钱花在艺术品上。


    ## 用最好的价钱，买进最好画家的最佳作品


    小时候，母亲会带着我到纽约市，然后我们会花一整天的时间参观现代艺术博物馆、大都会博物馆、古根汉博物馆以及惠特尼博物馆。虽然我比较想去柯汉家的地下室玩牌，但是这些经验却在我心中种下喜好艺术的种子。父亲会买一些仿名家画家如莫内、马奈等人的画作回家，把它们挂在房子里。所以我习惯在家里看到墙上挂着名家画作，就算不是真迹也无所谓。


    现在，我赚了那么多钱，我想是买点真迹来收藏的时候了。家里的整修一完工，奥黛莉和我马上去找佛雷斯哥与柏雷特画廊的老板─亚尔．佛雷斯哥（Alfredo）和克利夫．柏雷特（Clifford）。佛雷斯哥是我在哥伦比亚商研所的同班同学，他和柏雷特是表兄弟，两人从长辈的手中接管这家画廊。他们的祖母和美国早期的印象派画家约翰．托契曼（John
    H. Twachtman）有亲戚关系，后来嫁入杜邦（Du Pont）家族，所以佛雷斯哥和柏雷特有足够天赋和钞票，来经营这家位于高级商圈的画廊。


    当我在一九八零年代开始赚很多钱之后，奥黛莉和我便开始在周六下午到各个画廊去探访，佛雷斯哥与柏雷特画廊成了我们常常造访的地方。当时虽然我们很喜欢那里的艺术品，但是我的财力


    还不够。但现在，可就不能同日而语了。


    一八八六年十月，我们用十万美元向佛雷斯哥与柏雷特画廊购买了厄尼斯特．劳森（Ernest Lawson）的《冬季的投影》。以劳森的作品而言，这幅画可算是相当昂贵了。另外，我们又以四万美元的价格买下罗伯．沃诺（Robert
    Vounot）的《花园里的农夫》。在另一个下午，我花了五十万美元买下了两幅画。为了感谢我这笔五十万美元的生意，佛雷斯哥送了我一本书，书名是《美国的印象派作品》，这本书的作者是纽约市立大学研究所的艺术史教授威廉．哲兹（William
    Cates）。


    从小，我就特别喜欢印象派画家的作品。一八八四年，奥黛莉和我第一次去欧洲旅行，我们在巴黎雇了一位司机，要他带我们去参观莫内家和吉维尼（Giverny）的花园。那是五月初，我和奥黛莉就像那些十九到二十世纪初的画家一样，尽情饱览法国的田野风光。可是当我们回到纽约，想要找一些值得收藏的作品时，才不知道想收藏法国最高级印象派名家画作的点子是多么愚蠢——我怎么可能付得起那么高的价钱去买像马奈、雷诺瓦、窦加或莫内这些一流画家的作品？


    如果一定要买，我只能找次一级的法国画家作品，或是那些已经深得法国名家画风精髓的美国本土印象派画家，像希欧多尔．罗宾逊（Theodore Robinson）、斐德利克．佛利锡克（Frederic
    Fitz）、温斯洛．霍姆（Winslow Homer）、玛莉．卡塞特（Mary Cassatt）以及罗伯．沃诺等，他们的作品就在我的财力范围之内。


    在参观更多的画廊和仔细研究过哲兹的书后，我下了一个结论，那就是所有画家们都和其他人一样，都经历过好与不好的时期。至少在我眼中，玛莉・卡塞特鼎盛时期的作品，和窦加在未达到巅峰时的画作相比，只有过之而无不及。加上法国画家的作品更具有满足虚荣心的吸引力，所以一幅一流美国画家作品的售价，通常只有法国二线画家作品售价的三分之一。


    换言之，美国的印象派画家就像我早些年在 AMEX 操作的期权，或是一九八零年代早期的 S&P 期指契约一样，正好符合我的作风和个性。它们的价格合理、具有增值的潜力，仍然处于新兴市场之中，而且我了解它们。如果我准备进军艺术品市场的话，美国印象派画家的作品会是我最想介入的标的。


    当我开始花更多时间在佛雷斯特哥与柏雷特画廊后，发觉佛雷斯特哥和柏雷特具有和我非常相似的市场哲学，他们只会以最好的价钱买进最好画家的最佳作品作为存货。由于总是有一大堆想要买最高级艺术品的富有客人来画廊参观，因此这个策略使他们的库存作品享有很好的变现性。


    当我从事交易时，一定会以大型蓝筹股作为我主要的交易标的，因为这些大型绩优股提供最佳的流通性和变现性。如果我卖了五万股的 IBM、全录或杜邦股票，却在一个小时后改变了对市场的看法的话，我可以在市场上很轻松地把手中持股抛出，因为这些股票的交易总是够热络。这就是佛雷斯特哥柏雷特画廊的生意经，他们手中总是保有和蓝筹股一样具有良好流通性的存货，以便于随时可以出清。


    我唯一的问题是，画廊总是以零售方式出清库存，而我与生俱来的犹太人天性告诉我，该去


    “大批发商”那里买进我要的东西才对。我知道自己在找什么样的作品——美国的印象派名家画作，而且我没打算要收藏什么特别了不起的玩意儿，只想以最好的价格买到最好画家的最佳作品。这表示：我必须到拍卖会场去。


    ## 选画，就像选股——先剔除你不喜欢、不熟悉的标的


    在五十九街与公园大道交叉口的佳士得（Christie''s）和在七十二街与约克街交叉口的苏富比（Sotheby''s）是美国本土艺术品最主要的两个拍卖公司。其中，苏富比每年会举办两次美国印象派画家作品拍卖会，一次在十二月初，另一次在五月下旬。我们决定要参加苏富比在一九八六年十二月四日举办的拍卖会。


    对我来说，艺术品拍卖会是一个全新的战场，要面对一大堆艺术品拍卖身经百战的老手，我非常没把握，因此在拍卖会举行的三周前，我跑去找佛雷斯哥和柏雷特。“奥黛莉和我想要开始建立美国印象派画家作品的收藏，但是我们不能一直向零售商买，付那么高的零售价。”我说：“我们想参加苏富比举行的拍卖会，因此我们需要你们的建议。我的想法是这样的：如果你们可以教我，我可以帮你们买下一些你们感兴趣的作品，如果将来哪天你们有客人对这些作品有兴趣，你们可以来找我买。你知道，我是一个操盘手，只要价钱合适，我们就可以做些买卖。这么一来，你们可以将现金先放在别的地方，而不需要先购买这些存货，你们觉得怎么样？”

