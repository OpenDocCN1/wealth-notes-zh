    著這本型錄散步到銀行，用十美元紙鈔換取一卷二十五美分的硬幣或兩卷十美分的硬幣。然後走到銀行大廳的一角，撕開硬幣的包裝紙，將硬幣攤在桌上，開始找寻尋特殊的硬幣。


    我會不斷地走向櫃檯，重複換取更多硬幣，再次發揮起喜當偵探的天性。當我終於找到一枚想要的硬幣時，會檢查製造日期、哪個鑄幣廠製造的，然後再與型錄比對。我會查看這枚硬幣有多少在市面上流通以及目前的市價，接著就向不同的盤商兜售。如果我蒐集到一個個系列的硬幣時，會在《硬幣世界》（Coin
    World）或《貨幣新聞》（Numismatic News）這兩份刊物中登廣告，把它們直接賣給硬幣收藏家。


    我靠著硬幣交易賺了不少錢，但是我的最愛仍然是黃金。能夠找到一些特殊的硬幣固然不錯，但是這根本比不上我輕輕鬆摸摸雙鷹金幣那種愉悅感。我熱愛黃金，但是沒有財力購買，而且技術上除非你是貨幣收藏家，否則私自持有金幣在當時仍然是非法的行為。


    # 黃金類股的股價，是金價的領先指標？


    一九七四年十二月三十一日，美國人才再度被允許購買黃金當投資標的。但是當時我在市場上的操作老是輸錢，所以沒有能力買太多黃金。直到我和奧黛莉結婚，並開始在美國證券交易操作自有資金後，才真正開始經常性地購買金幣。當時，黃金價格已經漲到每盎司超過五百美元的水準，但只要我手上有一點閒錢，就會購買一些南非克魯格金幣（Krugrand）或是加拿大楓葉金幣'
  - '[PAGE 112]


    (Canadian Gold Maple Leaf)。當我買了將近一打金幣後，我會拿來攤在枕頭上，並把它們拋向空中，感覺真是棒透了。


    後來黃金價格持續上漲，愈來愈多人因為恐懼通貨膨脹而把錢用來投資黃金。一本本金融投資暢銷書都在預測全世界經濟已經面臨崩潰邊緣，道格·凱西（Doug Casey）寫了《危機投資學》（Crisis
    Investing），傑洛米·史密斯（Jerome F Smith）寫了《即將崩潰的貨幣制度》（The Coming Currency Collapse），哈利·布朗（Harry
    Browne）寫了《如何在即將來臨的資產縮水中獲利》（How you can Profit from the Coming Devaluation）以及霍華德·魯夫（Howard
    J. Ruff）寫的《如何在未來幾年的不景氣中成功》（How to Prosper During the Coming Bad Years）……每一本書都以獨具一格的方法來散播恐懼，並預期金融體系將以他們預言的方式崩潰。


    我在一九七九年的下半年，對黃金簡直到了神魂顛倒的地步，當我在美國證交所賺進了第一個十萬美元後，曾考慮要賣掉我的會員席位，然後在紐約商品交易所（New York
    Commodity Exchange, COMEX）買一個會員席位。我想要成為「金手指馬丁」——一個黃金期貨的操盤手。我和奧黛莉討論了這個想法，結果我們都認為這不是什麼好主意。「馬丁，你在美國證交所的操作一直都很順利，」奧黛莉說：「如果你想操作黃金的話，就操作黃金股（產製黃金的產業股）吧！」


    說得比較容易。市場上根本沒有幾家上市公司是生產黃金的，只有幾家黃金股在美國證交所掛牌上市。在紐約證交所有一檔叫 ASA 的股票，它是一家專門投資店頭市場南非金礦股的封閉型投資公司，「小雞」那一組人，除了在美國證交所當梅沙石油選擇權的作價員之外，也是
    ASA 選'
  - '[PAGE 113]


    擇權的作價員。A S A的交易圈就在海沙選擇權交易圈的旁邊，而小雞的手下「小鬍子彼德」就負責A S A選擇權交易。


    如同往常一般，我在開始介入A S A選擇權之前做了很多功課。我的原則之一就是，如果對某檔股票沒有做過透徹研究，並且完全符合我的操作邏輯之前，絕不輕易介入。在研究A
    S A的過程中，我發現加拿大和美國黃金類股與金價之間存在著一種有趣的相关性。黃金類股的價格通常會先於金價上漲或下跌，因而使它們成為金價的領先指標。A S A這家公司是投資在南非的黃金製造商上，其股價通常會隨著金價同時波動，所以我看出來當加拿大和美國的黃金類股上漲時，A
    S A的股價毫無疑問的會隨後跟進。


    # 買黃金，一年賺超過一百萬美元


    我在1979年的十二月開始操作A S A選擇權。金價仍然持續飆漲，而在小雞負責的交易圈中，交易相當快速而熱烈。黃金是當時最新的熱門商品，所以在那個交易圈會聚集著一大堆穿著藍色工作服的交易者在那裡推擠、喊叫。「25元叫出五十張。」小鬍子彼德大聲喊著。「買進！」「買進！」一群人同時尖叫著，然後在同時叫進的交易員之間，就會為了到底最後誰能夠買到而出現一番爭執，直到一切都擺平後，繼續交易。


    基本上，我總是在市場中作多，買進A S A股票的買權，預期A S A的股價會隨著加拿大和美'
  - '[PAGE 114]


    國的黃金類股走強。


    我穿著藍色工作服，把兩本成交單放在口袋裡，紅色的是賣單，藍色的是買單；另一個口袋則放著 ASA 的技術圖，站在圍繞在小雞四周的人群之中。我吞下幾顆止咳喉片，因為我整天都在交易場裡大聲吼叫，不吃喉片簡直是在謀殺自己的喉嚨。我看著
    ASA、黃金現貨，以及加拿大和美國黃金類股前一天的最高最低價及收盤價，等著 ASA 的股價突破前一天的最高價，然後就會全力搶進 ASA 買權。我會對著小鬍子彼德大喊：『買進！買進！我要買進！』這檔股票的選擇權履約價是以五美元為間隔，而在交易熱絡的日子裡，ASA
    股價可以很輕易地突破這個履約價區間。


    『彼德！總共有多少張要叫出？三十張嗎？我要買進！』我以每張四．二五美元買進了三十張買權，總值為一二七五〇美元。我渾身大汗、熱得不得了，腳上的橡膠鞋簡直快要著火了。我覺得這檔股票還會繼續漲，從我的眼角餘光中看到金價正在上揚，其他的黃金類股也在上揚，我在心裡對自己說，老天爺！我得多買進一些
    ASA 才行。


    我有兩名助理，蘇珊和吉米，每個月付給他們幾百塊錢，而他們則在我完成交易後，把成交單輸入到我得交給貝爾．史騰結算公司的資料卡上。


    『蘇珊！吉米！』我從人群中高聲喊著。『你們死哪兒去了？把我的部位表拿來，弄清楚我的部位，我賣出了多少履約價四十五的買權？買進了多少履約價五十的買權？』我滿口白色泡沫。


    ASA 股價的波動真是激烈，操作 ASA 股選擇權，跟在拉斯維加斯的賭桌上豪賭沒有兩樣。


    感謝 ASA 股和其他股票選擇權，讓我在一九八〇年靠操作它們賺了六十萬美元，並在一九八'
  - '[PAGE 115]


    一年賺進了一百二十萬美元。隨後在一九八二年，雷根政府開始控制通貨膨脹，黃金價格也開始下滑。當黃金類股價格波動減緩後，我在這個市場的優勢漸漸消失，所以我不再像以前那樣，操作那麼多
    ASA 股選擇權了。


    黃金熱潮退燒後，每一個穿著藍色工作服的市場老手都知道該開始尋找新的操作標的了。我們全都在一九八二年开始的新多頭市場中，轉戰美林證券的選擇權市場。但無論如何，我依然熱愛黃金。對我而言，它代表了財務安全的保障。誰曉得舒華茲家族什麼時候又要開始逃難？黃金已經是我體內基因不可或缺的一部分了。


    # ## 第5課 一定要做好最壞的準備——即便別人笑你


    一九八二年八月，我正過著夢想中的生活。當時是星期五的下午，我們正在新買的海灘別墅度假，我在游泳池邊披著浴巾，看著報價螢幕，並用專線電話和紐約的黛比·洪（Debby
    Hong）連線，在波動劇烈的市場中操作、賺錢。這時另外一線電話響起，來電者是內線史基尼，以一種我從沒聽過的興奮語氣和我說話。


    「馬丁，代誌大條了！」他以沙啞的聲音小聲地在電話裡說：「聯準會主席沃爾克（Vol'
  - '[PAGE 116]


    2010)〕，正緊急把所有銀行的總裁從假期中召回。墨西哥要發生債務危機啦，這些銀行貸它太多錢了，有很多銀行都會因此遇上大麻煩。這是一個最危險的緊急警報啊！


    在整個夏季中，有關墨西哥將要破產的謠言早已甚囂塵上。每一個股票操盤手中最正確的恐懼，就是另一個像一九二九年那樣的崩盤和經濟大蕭條。許多人都認為這些年所建立的金融安全機制，諸如保證金的限制、自動執行的部位停損、銀行的準備金制度、聯邦存款保險，以及其他各種查核程式，應該可以防止這種混亂狀況再次發生。不過，在我們這些操盤手的內心深處，可一點兒也不相信這套說詞。


    以那些大型銀行把資金往拉丁美洲猛砸的大手筆來看，誰曉得事情會糟到什麼地步，而如果史丹尼認為他知道真相，我可絕對不敢掉以輕心。他可不是普通的理監事或計程車司機，他和國內各個產業的首腦以及政府官員都有很密切的聯繫。他的消息一向具有極高的準確性，聽從史丹尼的消息在過去讓我賺了不少錢，而他的專長就是在事情還沒發生前預先知道內幕消息。他操作股票、債券，更重要的是，他也和人交易資訊。如果你夠分量、也夠幸運能成為他傳播消息的對象，而且也能偶爾回饋消息，十次當中可能有七次，他能讓你賺到錢。


    我看著手錶，已經是下午兩點三十分了。我得在銀行週末關門前把黃金提領出來。如果內線史丹尼的消息正確的活，銀行在星期一早上可能沒有辦法關門營業了。


    我自從三年前開始操作自有資金以來，就開始建立自己的儲備黃金。不論何時，只要我在市'
  - '[PAGE 117]


    場賺了很多錢，總會拿出部分資金來買一些克魯格金幣或楓葉金幣，然後將它們放在幾個不同的地方，像是廁所的抽水馬桶裡。這聽起來或許有點誇張，不過我也不是全放在這種地方，有些黃金也被我存放在幾個不同的保箱裡。我認爲它們就像我買的保險一樣，是在危急時可以用來救命的東西。


    這正是一般有錢人都在做的事，他們總是把財富分散各處，這裡藏一點、那裡也藏一點，使得他們在面臨突發意外時隨時有備胎可用。我就常常在離開紐約市時帶個一打左右的克魯格金幣在手提箱裡。現在，在三點銀行關門前，我只剩下半個小時能趕去提領出來。


