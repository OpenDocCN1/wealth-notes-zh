    自從我開始從事 S & P 期指交易後，幾乎每個月都能獲利──除了六月回母校參加同學會的那一次。


    參加同學會，是觀察一個人是否事業有成的最有效指標。通常，當你畢業十年後，多少能看出誰在將來會成功──學醫的人選擇專科並且已經開始實習；學法律的，則選定專業科目和未來的合夥人；那些做軍間的人已經拿到博士學位和助理教授的職位，並開始考慮要不要拿終身職；從商的人也已經完成了在生產和行銷部門輪調的階段，到了升部門主管的年紀了；而那些從事金融業的人，則已經完成建立客戶和人脈的工作，開始採取更進一步的行動了。


    等到你畢業十五年時，有些同學會漸漸成氣候。他們不是發現新的醫療技術、贏了一件大訴訟、出版了著名的學術論文、升上了副總裁，就是圓滿完成了一筆大交易；等你畢業二十年時，就幾乎能完全確定誰是那功成名就的人了；到畢業二十五年時，一切都已塵埃落定，你不是坐在總裁辦公室裡邊啜飲雪莉酒邊簽署著捐錢給校友會的巨額支票，就是躲在同學會的花落裡喝著啤酒，找人拉拉關係，期待著突如其來的好運。


