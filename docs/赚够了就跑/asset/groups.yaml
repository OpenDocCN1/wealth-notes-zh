  - '[PAGE 268]


    必須向投資人提出報告，而這也對我產生短期性的壓力。我原本認為，這些套利部位能夠在一個沒有明顯趨勢的市場中提供較好的收益率，但我的想法錯了，這些獲利沒有出現，五週後，我的虧損已經達我募集的四千萬美元資金的六％，高達二百四十萬美元。


    我以前從來沒有虧損過這麼多錢，自信心也隨著我的錢而每下愈況。我開始縮減部位、保護資金，然後盡量在有機會時就實現獲利。這些做法果然奏效，到了三月底，這兩個基金的淨值已經轉為獲利七．六％；反觀同一時段，我的比較基準——紐約證券所綜合指數（New
    York Composite Index）——則是下跌了四．二％。在短短三個月裡能夠有高於大盤指數一一．八％的表現，在任何投資人眼裡都應該是非比尋常的操作績效。許多投資人也的確這麼認為，因而衍生出我的第三個問題。


    當我開始為基金操作時，最主要的考量之一，就是我能否像操作自己的一千萬美元規模的資金一樣，有效率地操作這兩個總額四千萬美元的資金。在前兩次經驗中，我發現操作較大金額的資金會改變我對部位的持有時間。我傾向於持有部位更長一段時間，而這改變了我在短時間內實現獲利的交易風格，但是我在八九○年第一季的表現，讓我相信我有能力管理金額更大的基金。所以在四月一日，我再度開放新資金投入基金裡，並成功募集到三千萬美元的資金。


    大部分操作七千萬美元資金的操盤手都會打散資金，尋找適當的投資標的，以分散風險，然後讓手下年輕的職員幫他們執行交易指令，那些操盤手則高高在上，縱觀全局並主導全盤策略的大方向。但這不是我的風格，我是個控制欲極強的人，我的手下也沒有幫忙的小弟——我早就把之'
  - '[PAGE 269]


    前的兩名員工辭掉了，完全由自己進行交易工作。


    我一直採取防守性策略，並在四月份又增加了一·五％的獲利，但是在五月及六月當中，市場的走勢卻和我的部位背道而馳。我沒有搭上任何一波重要多頭走勢的列車，壓力立刻從四面八方蜂擁而至。在整個上漲趨勢當中，投資人不斷問：「我的錢運作得如何？」


    當你全心投入操作的時間超過了結算年度的三分之一時，投資人只想聽到一個答案：「簡直棒呆了！」但是我沒辦法說出這句話。每個月初，我都會寄一封信給投資人，向他們說明基金的操作狀況，而在六月份的那封信裡只能這麼說：


    身為基金裡最大的投資人，我個人覺得維持每個月獲利，要比試圖在市場上靠少數幾次交易大撈一票來得重要。我的投資績效是基於持續性的獲利能力，並使複利成長得以有機會發揮它神奇的力量。


    這對任何人來說，都不會是什麼振奮人心的話。客戶繼續打電話、传真、寫信或用其他方式來抱怨他們的報酬率，並且拿其他操盤手的績效和我比較。那些引介國外資金的捐客就更糟糕了，他們幾乎每天都在我正交易的時段打三次電話給我：「馬丁，我的錢操作得怎麼樣了？」我簡直不能相信這些傢伙會幹出這些事。既然他們把資金以一年的固定期限投入，這麼在乎每天的損益幹什麼？難道他們不知道我在各式各樣的市場狀況下，已經連續維持了十年的二位數獲利嗎？他們不知'
  - '[PAGE 270]


    # 道我是冠軍操盤手嗎？


    七月份，我試著在報告六月份績效的信裡提醒投資人他們是以長線的眼光投入資金，並附上一份長達兩頁，從理查・羅素（Richard Russell）的《道氏理論通訊》上摘錄下來的文章。這篇摘錄顯示複利成長的效果是多麼強大，並且一直以來都是聰明投資人用來累積巨額財富的最佳方法。緩慢但持續地獲利，才是這個遊戲的真諦。我在七月份的那封信中再次以防御性的方式寫道：


    > 當我創立這個基金時，我知道總會有某段時期會超越其他操盤手的績效，而有些時候又會表现得比別人遜色。這就是我為什麼要求諸位以最低一年的期限來投資，而這也是我認為應該被諸位評估的方式。當這一年的期限結束時，諸位將可以決定是否繼續把資金投資於此，甚至提高投資金額。我只希望諸位能在適當的期限時再評估我們的操作績效，並以相對和絕對的觀點把我們的表现和其他操盤手及投資機會做比較。


    在信中我沒有告訴投資人的是，我已經準備好要採取攻擊性的策略了。我馬上就要來個長打。


    # 你狠行還不夠，因為別人比你厲害


    奧黛莉決定在暑假期間，再度裝潢我們在公園大道的公寓。我們把東西都打包好，然後搬到避'
  - '[PAGE 271]


    晷小屋。有一天我和一個避險基金的經理人打網球時，他對我說：「嘿，馬丁，你有聽到什麼普強（PuFo）的消息嗎？」

    「普強？」我一副好像很了的樣子：「那你聽到了什麼呢？」

    「聽說有一家瑞士公司打算購併他們，所以我已經買賣進普強了。」

    我馬上打電話給內線史基尼。史基尼在華爾街到處都有眼線，如果有人對普強這個位於密西根的大型藥廠採取了什麼行動的話，他一定會知道。

    「馬丁，」史基尼語氣輕鬆地在電話裡說：「我正想要打電話給你！我在瑞士的眼線剛剛告訴我這筆交易已經完成了，而且有很多歐洲方面來的買盤，看起來真的是有那麼一回事，大家都想藉著這個購併搶一票。」史基尼說話有一套他自己的方式，而他已經把我想知道的告訴我。如果我想來個全壘打的話，普強就是我會介入的標的。

    我開始大量買進普強。

    我一直很喜歡精巧的小電器用品，終於也買了一部行動電話，雖然它看起來就像是一個又大又笨重的汽車電瓶。我可以邊坐在球場旁邊看著奧麗莉打網球，邊對著電話大喊：「再幫我買進一萬股，買進一萬股！」整個七月，普強一直不斷小幅上漲，我也不停地買進。我有時會在週五下午坐在海灘上看著孩子們堆砌沙堡，一邊對著那個汽車電瓶手機大吼：「收盤前幫我買進三千股！買進！」我的多頭部位愈來愈大，整個資金都投到普強去了。到了八月初，我正在前往中國大陸途中，但還是持續作多。我買進了超過四千萬美元的普強，超過了基金總額的一半，總共買進了將近'
  - '[PAGE 272]


    一百萬股。


    八月二日，海珊派兵入侵科威特。市場開始下挫，而原油期貨的價格則一飛沖天。股市很快重挫了一○%，普強的股價也不可避免地加入下跌走勢中。我開始賣出 S & P
    指數期貨來規避部分的股股風險，但這卻讓我陷入另一個星期的困境中，因為普強的 beta 值（單一股票和大盤指數之間的連動關係係數）已經因市場的變動而成為 S
    & P 指數的兩倍，但我卻在後來才察覺到這個變化。基本上，這表示大盤每變動一%，普強的价格就會變動二%。以前市場下跌的狀況來說，普強會下跌二%，所以如果我賣出總值四千億美元的
    S & P 指數期貨，還是不夠，我應該要賣出總值八千萬美元的 S & P 指數期約才對。


    在八月中旬某個星期一早晨，我賣出了四百口 S & P 指數期約，而市場從開盤就跳空下跌。我在五分鐘內就賺進了一百八十萬美元，但是普強的股價也下跌了 1% ，使得基金在當天的整體表現只是打平而已。問題是，拜海珊之賜，讓原油和其他大宗物資的價格瘋狂飆漲，結果鐘斯、考夫納和貝肯那些沒有買進普強的期貨市場玩家，都因為作多期貨而賺翻了。


    由於《金融怪傑》這本書的介紹，我得到了期貨市場玩家的封號，但是我從來沒有純粹專做商品期貨交易。我真正的專業是在 S & P 指數期貨，而它則代表了那個目前正在狂跌的股票市場。所以當那些市場高手們因為買進商品期貨，趁著通貨膨脹預期心理高漲之際大賺其錢的同時，我卻只能以賣出
    S & P 期指來鎖住那一百萬股普強所面臨的風險，勉強打平而已。


