  - '[PAGE 357]


    所以我的移動平均線系統，是我能夠在從事交易時站在正確一方的重要關鍵：在市場處於上漲走勢時作多。下一個步驟就是選定一個進場點，並明確定義你所願意承擔的風險。我通常尋找的進場點是市場轉折點，因為你將是首先辨識出趨勢變化的操盤手，這也通常是讓你賺到最多錢的進場點。我也使用軌道線和振動指標來幫我選擇價位並辨別市場的狀況。未來資訊單機幫我做好了這些運算工作，而我的工作就是設定參數。我會觀察一二〇、六十及三十分鐘的技術圖。我可以看到價格的條狀圖，在條狀圖上下各有一條軌道線，而這兩條軌道線是利用十個時點的移動平均線上下各加減一％所計算而來。我把這兩條軌道線比擬為兩條被崩得Very緊的橡皮圍籬，它們終究會彈回原點。舉例來說，如果市場正處於偏多的格局，而價格開始向軌道的下緣接近時，我就會找機會在那附近作多。這可不是一種機械式的操作策略，但軌道線確實提供了很好的進場點。'
