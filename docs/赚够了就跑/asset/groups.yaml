    ### 紅燈、綠燈：讓趨勢成為你的朋友


    十日指數移動平均線（EMA）是我最喜歡用來判斷主要趨勢的技術指標。我第一次學得這個有價值的工具是從隆德利那裡聽來的（有興趣者可到www.marshall.com一探究竟）。我偏好奇數移動平均線，基於簡單移動平均線或其他各種權算術平均指數，這是因為它強調了最近期的價格波動所帶來的影響，讓我在決定進出場點時有一個更快速的指標。在簡單移動平均指數的計算過程中，每天都具有相同的權值
    0.1。你可以取最近十天的價格加總後再除以十，就得到了第一個平均值。到了第十一天，你加上這一天的資料，再減掉第一天的資料，然後除以十。日復一日，重複這個過程，就會得到一系列的簡單移動平均指數。


    我所使用的指數移動平均數中，會賦予最近一天的資料0.18的權值，然後賦予前一天的指數平均值0.82的權值。如此一來，它對於最近期的資料變動狀況將較為敏感，這對短線操作者來說非常重要。我稱這個指標為「紅燈、綠燈」，因為在交易時讓自己站在正確的一方是非常重要，而指數移動平均線可以讓你站對邊的機率大幅提升。


    在我辦公室的地板上有兩幅巨大的技術圖，大約寬四呎、長十呎，內容還在增加中。第一張圖是道瓊工業指數的小時圖；另外一張則是紐約綜合指數的收盤價和它的十日指數移動平均數值，在它們的下方是神奇T振動指標，其中的十日指數移動平均數值是以黑點來標示。


    不論何時，只要紐約綜合指數在十日指數移動平均線上時，我就用綠色的實線畫上去。當它低於十日指數移動平均線時，我就以紅色實線來畫它。當市場在十日指數移動平均線以上時，你看到的是綠燈，代表市場正處於上漲狀態，而你應該考慮買進。相反的，市場在指數移動平均線以下是紅燈，代表市場正處於下跌狀態，你應該考慮賣出。這並不是說當市場出現紅燈時你絕對不應該作多，只是在這種狀況下作多，一定要有一個非常合理的原因來支持你持有這個部位。


    從事交易時最困難的，就是當你的標的物價格在它的移動平均線上下徘徊時。這是提供你最大潛在獲利機會的時候，但其中也存在著極大的風險。就算你可能會面臨上沖下洗的行情，在趨勢發動時所產生的獲利潛力仍然相當可觀。舉例而言，市場可能指數移動平均線底下停留幾天，然後開始向上漲升，愈來愈接近指數移動平均線。如果市場收盤能夠站到指數移動平均線之上，這通常是一個趨勢改變的開端，而你可能就是第一個能夠發現這個年輕、全新且威力十足的上漲趨勢的人。


    但是通常指數移動平均線就像一面彈力板，價格由低檔接近或觸及移動平均線後通常會反轉回跌，移動平均線就等於市場到達短期均衡狀態的那一點。


    我在操作股票和期貨時會使用這個方法。每天收盤後我會記下當天標準普爾五百指數、紐約綜合指數、OEX指數、XMI指數、債券、歐洲美元以及S&P指數期貨的十日指數移動平均值。


    這些資料都是從我的未來資訊單機(Future Office Machine)獲得，這部單機有能力替我計算並繪出指數移動平均線。

    '
