    斷輸錢的狀況。


    我曾經在佛蒙特州的糖楓林（Sugarbush）參加一個滑雪俱樂部，但還是沒辦法因此和異性建立什麼特別的關係。二月初時，我已經在卡邁因那裡輸了兩千美元了，這對我来说可是一大筆錢。某個星期五的晚上，我正開著小轎車往滑雪俱樂部去，那時我已經差不多要宣告破產了。我在那週稍早時，曾經南下到路易斯維爾（Louisville）和一家公司的總裁開會。


    卡邁因有一種很奇特的賭法，叫做「如果反轉就加倍」（Double if it reverses）賭法。在這種賭法裡，你可以在四種結果中任一種出現時贏錢，有機會以五百美元賺回四千美元。我一直用自已記錄賽馬、騎師，以及輪盤的方法來記錄美國大學籃球賽的比賽結果。在那一季接近尾聲時，我已經很清楚知道誰會贏得單場勝利、誰會贏得連續勝利，或者誰只會贏得主場勝利。我挑出四場比賽來玩這種「如果反轉就加倍」的賭法。我在第四場比賽賭路易斯維爾會贏曼菲斯三、五分。因為我在路易斯維爾開會期間，每個人都在談論主教練，而我對路易斯維爾的感覺也很棒。所以我打電話給卡邁因下注。


    星期六下午到晚上，我開著車在山路裡繞來繞去，想要讓收音機調出最清楚的收訊，聽一聽比賽結果。當時正在下雪，我的手凍得不得了的，靜電嚴重干擾收訊，但過了午夜後，我很確定我贏了第一場和第三場比賽的賭局。只要路易斯維爾能贏四分，我就能脫離困境，大賺一票。我好像聽到中場休息前路易斯維爾落後十一分，或者七分，但不管他們落後多少分，聽來似乎都不大妙。


    我快瘋了，我得知道路易斯維爾有沒有後來居上。時間已經是清晨一點，我還把車停在滑雪俱'
  - '[PAGE 71]


    樂部的屋外，調整著收音機。我收聽到鹽湖城摩門教堂的唱詩班歌聲、魁北克的冰上曲棍球比賽、渥斯堡（Ole Wyso）的牲口價格以及拉斯維加斯的拳賽結果，但是沒有聽到路易斯維爾或曼菲斯的球賽結果報導。除了我，每個人都在俱樂部裡參加派對。難怪我總是沒有辦法和異性發展穩定的關係了。


    到了凌晨兩點，我的汽油快用光了。我放棄希望，回屋裡睡覺。第二天早上除了我之外，每個人都去打滑雪。我坐上車，開進城裡，買了一份《紐約時報》。路易斯維爾最後絕地大反攻，從落後十五分急起直追，最後以七十五比七十一大獲全勝。


    我贏了！我贏了四千美元！我完全脫離困境了。


    回到城裡，我立刻打電話給卡邁因，問他該約在哪裡見面付錢。通常每週的賭局在星期日結束後，賭金的支付日都是下個星期二。卡邁因告訴我，他下個星期二下班後會在第八十六街和第三街的交叉口和我碰面，就在電影院門前。要去拿四千美元的現金，我感到很緊張。在紐約街頭，有很多人會因為四十美元而丟了小命。


    當時《教父》這部電影才剛上映，排隊買票的長龍繞過了街角。當卡邁因拉高衣領、壓低帽簷走過來時，我正站在戲院的屋簷下。他推開排隊的人群走上前來，塞了四十張百元大鈔在我的手心。每敵人都盯著我們看。我就站在大幅的電影海報旁，從一個叫卡邁因的馬票商手中接過一大疊現金。我開始想像在我到家前，會有一個身材魁梧的彪形大漢來搶劫我，甚至把我給幹掉。我禁不住汗流浠背，直到把那四千美元放進聯邦稅制的書中，才安下心來。'
  - '[PAGE 72]


    # 賭馬場上的內線消息……


    瑞奇有一個朋友叫比利（Billy），他是在漢茲公司（Hinz & Co.）工作的一名營業員。比利總是有不少的花樣好搞。一九七一年的八月，我們三個人開車到沙拉多加（Scaroga）去玩。比利說他認識一個宣稱可以控制比賽結果的賽馬訓練師。我懷疑這個事情的真實性，但是基本上不管你是賭馬或是在市場上操作，其實都一樣，每個人都夢想能未卜先知。「比利，」我說：「如果那個傢伙有什麼動作的話，讓我知道一下。」

    到了下個月我們開會時，瑞奇把我拉到一旁去。「比利說他的朋友又報出明牌了。有一匹馬星期四會在水道賽馬場跑第六場比賽，牠的名字叫『我的旋律』，他說賭這匹馬穩贏。你要一起賭一把嗎？」

    「當然好啊！」

    星期一我去銀行領出了一千美元，然後把它夾到我的稅制書中。星期二，我告訴秘書瓊安，我在星期四下午有場重要的會議，所以不要再幫我安排其他行程。星期三，我買了一份《每日賽馬報》，並歡天喜地發現「我的旋律」的賭盤竟然是四比一，但是在星期四的早晨，我接到一通瑞奇打來的電話。「算了吧！」他說：「我們玩不成了，我們的馬剛剛受傷了。」

    接下來的星期一是哥倫布紀念日，但即使銀行都沒有開門，市場還是照常開盤，所以我還是進了辦公室。我正準備要出門去吃午餐時，電話鈴聲響起，是瑞奇打來的。「我們又可以進場玩了，'
  - '[PAGE 73]


    比利剛才聽說我們的馬要在第四場比賽時出賽，我們得馬上趕到賽馬場才行。但有個麻煩，銀行沒開門，所以我們領不出錢，你手上有現金嗎？


    「有啊，大約一千美元吧！但錢放在家裡，給我一個鐘頭回去拿。」


    「把錢全部拿來，如果有更多的話也一起拿過來吧！我們下午一點在比利辦公室等你。」


    賭馬的機會又回來了。我打電話給哥哥傑瑞，問他手上有沒有更多現金，結果他說也想參一腳。「和我在地鐵站碰面，半個鐘頭後見。」我說。我抓起西裝外套，告訴瓊安：「我現在得趕去開上星期四被取消的那場會議，這是很重要的會。告訴訪客我大約會在三點半左右回來。」


    我下樓跑到地鐵站，搭上了往城郊的列車。我在四十二街那站下車，和傑瑞碰面，跟他拿了一百美元，然後又跳上地鐵。我在七十七街那站下車，跑步回家，從聯邦稅制書中抓起一千美元，再跑回地鐵站，搭車回頭到第五十九街下車。我的錶上顯示時間是一點零五分，漢茲公司的辦公室就在五十九街和公園大道的轉角上，瑞奇和比利正在大門外的階梯上等我。


    「拿到錢了嗎？」比利問。


    我拿出那疊鈔票給他看，隨後跳上一部計程車。我丟了一張二十美元的鈔票給司機，告訴他：「水道賽馬場，請開快點！」


    我們趕到賽馬場時，第三場比賽才剛剛結束。我借給瑞奇和比利三百美元，然後自己在「我的旋律」身上下注八百美元。那場比賽是我看過最棒的一場，「我的旋律」以二、五個馬身的距離贏得了比賽，在過程中我們不停地大聲喊叫、尖叫，互相拍著彼此的背，上下跳躍個不停。我贏了二'
  - '[PAGE 74]


    千八百美元，這是我第一次靠內線消息而獲利，更讓我覺得勝利的滋味格外甜美。


    瑞奇和比利還要留下來下注，而我還要趕回辦公室。我拿出一個二十五分的硬幣，漫步走向地鐵站。我看到場外的車道停滿了一排排大型禮車，心裡想，「慢著，你剛剛才贏了二千八百美元，口袋裡放了超過四千一百美元的現金，還去撘什麼鬼地鐵？」我花了五十美元為自己雇了一輛禮車，然後愉快、風光地坐車回到辦公室。


    我的賭場筆記：無論結果如何，人人都想未卜先知。


    # 一心只想著賭錢的渾蛋


    一九七二年，我發現了拿騮（Negro）群島裡的天堂島（Paradise Island）。從紐約只要飛兩個半鐘頭，再付個幾塊錢過橋費就可以抵達。那裡簡直就是水道賽馬場、笛翁和拉斯維加斯的混合體，有相當多的綠蔭和流水，也有很多穿著西裝、打著領帶的歐洲人與很多好玩的活動。但是天堂島不像拉斯維加斯，去那裡的人多是成雙成對，並非單身漢的天堂。我從來都沒辦法和任何一個看起來像樣的異性約會，所以在我沒結婚前，去天堂島玩的次數就遠低於拉斯維加斯。


    後來我認識了奧黛莉。當我們討論去哪裡度蜜月時，我心中除了天堂島外，沒有第二個選擇。


    一九七八年三月二十六日，我們在紐約度過新婚之夜，第二天一大早就搭上前往拿騮的班機。我在勞斯飯店訂了一間面海的蜜月套房。我們在中午時住進飯店，當奧黛莉打開行李時，我已經抓起電'
  - '[PAGE 75]


    話開始和貝爾·史鷹的營業員連上了線。我連在度假月時都不忘要繼續賺錢。


    那裡的賭場在下午一點開始營業，所以在十二點五十五分時我結束了電話，然後歡呼一聲：


    「奧黛莉，該是我們找點樂子的時候了！」


    「我馬上就出來。」她以性感的語調從浴室回應。


    我看了看手錶，「好吧！快點，親愛的我現在可正在興頭上呢！」


    浴室的門打開了，奧黛莉穿著一件薄紗睡衣站在門口，左手拿著一瓶香檳，右手拿著一盒草莓巧克力。


    「嘿，你在幹什麼？」我說：「你幹嘛穿成這樣？賭場在一點整就開始營業了，我們會來不及去玩幾把的。」


    奧黛莉一句話也沒說，轉身走回浴室，放下巧克力和香檳，把門鎖起來。她想像中那個羅曼蒂克的天堂島蜜月之旅，剛剛被我搞砸了。她現在才發現，她所嫁的那個渾蛋心裡所謂的享樂，只不過是想跑去賭場贏錢而已。


    # 我的賭場筆記：把自己的優先順序弄清楚！


    我已經不再常去玩牌、賭馬或去賭場賭泥了。打從訂下「計畫」之後，我把賭局轉移到股票、選擇權以及期貨市場上。但是我並沒有忘記自己在柯漢家的地下室、水道賽馬場、欣斯岱爾、歐洲、拉斯維加斯、阿瓜維特餐廳，以及天堂島那裡學到的人生課程。'
  - '[PAGE 76]


    愈來愈多嶄新的金融工具在這場金錢遊戲中出現，操作行爲也漸漸從交易場轉移到電腦系統，愈來愈多的操盤手出身哈佛大學、賓大華頓商學院（Wharton）、巴黎索邦大學（Sorbonne），還有倫敦政經學院（London
    School of Economics）。學歷固然重要，但是全世界所有名校的學位在交易場開盤鐘聲響起時都嫌不足，我從許多向我尋求建議的年輕人身上看出這一點。除非他們在內心深處已經有深刻的體會，否則沒有辦法遵守操作紀律，沒有辦法在關鍵時刻扣下扳機，也沒有辦法成為真正的市場贏家。


    我的賭場筆記：一個偉大的操盤手，一定也是一個懂得如何賭博的人。


    # ### 第四堂課


    想贏，就要懂得自律！


    操作期貨和在賭桌上賭骰子，有非常多相似之處，所以拉斯維加斯是一個想要成功的操盤手磨練如何遵守操作紀律最佳的地点。


    沒有人能持續在拉斯維加斯贏錢，但如果你真的是個中好手的話，可以在一定的時間裡贏錢，而且控制虧損，每一回都樂在其中，不至敗興而歸。但這必須是在你能夠自律的狀況下才行。賭場都希望你靠勇氣和直覺，而非用頭腦來賭博，而且會想盡一切辦法來打斷你的專注'
  - '[PAGE 77]


    力。他們會無限制的提供酒精飲料、穿著清涼的女人，以及無止盡的娛樂，一天二十四小時，每週七天，一年三百六十五天從不間斷。


    我最喜歡的賭博是擲骰子。這非常像你在交易場中做交易──節奏快、噪音大、人群擠，而且也都有很多的錢在流動。十二個玩家斜靠在賭桌旁看著每一擲，急著要看出誰是贏家。當有人開始擲骰子時，籌碼在空中飛舞，人群會向前擠得更緊，每個人的呼吸都變得很沉重，呼喊聲更加大了分貝。這感覺真的好像我在交易場裡站在「小雞」、法蘭尼和肥麥克的身旁一樣。


    我是一個總是和擲骰子的人對賭的玩家。其實不論你是否和擲骰子的人對賭，獲勝的機率其實都是相同的，但大部分的人到下注擲骰子的人會贏。我之所以這麼做，是因為不希望和那些穿著藍色休閒衫、在胸前掛著一塊大金牌的鄉巴佬，或是穿著亮片迷你裙、總在擲骰子前往手裡吐一口唾沫的胖女人站在同一陣線上。我希望他們都擲得很糟，這樣我才能贏錢。所以基本上，每個在骰子賭桌旁的人，甚至包括那些靠贏錢者打賞的賭場職員都討厭我。不過這一點我並不在意，不管是在骰子賭桌上或是在交易場裡，輸家永遠痛恨贏家。


    在拉斯維加斯賭骰子的經驗，讓我學到三個自我對於金融操作絕對重要的規則：


    # 一、把自尊心和賭戲（操作行為）分開


    絕不讓情緒因素介入操作。當你在和別的賭客對賭時，不應該把事情個人化，而應該對事不'
  - '[PAGE 78]


    對人。如果你讓自尊心浸入賭局，可能會在鄉巴佬贏了幾盤後把賭注加倍，或是當穿著亮片裙的胖女人擲不好時降低賭注。我發現這是一種自我毀滅的行為，必然會把事情搞砸。你必須完全不做任何情緒性的反應，要不動如山。


    # 二、管控你的資金


    我一進賭場，會先到兑幣處前租一個保管箱來放我的錢。我把所有的錢都放在那裡，身上只留幾百塊。如果手頭上的錢輸光了，我就得去打開保管箱取錢。去保管箱拿錢的動作，可以使我暫時離開賭桌，自動中止一直輸錢的爛手氣，也讓我有時間輕鬆一下，然後思考下一步要怎麼做比較好。這個動作的效果，就像往自己臉上潑盆冷水一樣。這對金融操作同樣適用：把你的錢放在另外一個獨立戶頭，除非你緊急把錢轉過去，否則營業員是無法動用的。如此一來，你就不會因為一時的情緒激動，而輕易把手中的子彈一下子用完。


    # 三、在一連串勝利後，換張賭桌吧


    你在過去一段時間中愈幸運，運氣就會愈可能馬上消失無蹤。換張賭桌並不是件容易的事，尤其是在手氣一直都很順的狀況下更是如此。人類的天性會告訴你，如果在一張賭桌上贏錢的話，就該留在那裡賺更多的錢。但是你真正該做的是，拿著剛剛贏的錢，起身回到兌幣處，把'
  - '[PAGE 79]


    多餘的錢存起來，手上仍然只留下幾百塊錢。週期性地帶著贏來的錢離桌，是你避免被賭場的優勢給拖累的唯一辦法。之後，如果你還是覺得手氣正旺，仍然有足夠的專注力，而且還想玩的話，還是換張桌子玩吧！如果你的狀況真的那麼好，換張桌子還是可以繼續贏錢的。


    這些心理上的自律法則或許不能保證你成為市場中的大贏家，但是如果沒有的話，毫無疑問的，你一定會成為一個大輸家。'
  - '[PAGE 80]


    # 第4章


    # 穿著鱷魚皮鞋的富豪


    我的分析師生涯


    一九七〇年初我刚從研究所畢業，就很清楚知道自己想要投入股票市場。我認為，有三種方式可以進入這個市場：成為一名投資銀行家、操盤手，或證券分析師。


    我很清楚，自己的個性並不適合擔任投資銀行家的工作。投資銀行家都是一些靠著創業投資、承銷股票，和一些巨額投資案賺錢的上流社會人士。但我並沒有這方面的經驗，也沒有資本，更不具備當投資銀行家的背景。那時候，我也不想成為操盤手，因為當時的操盤手只不過是中間人而已，他們從客戶那裡收到交易指令後，再把這些指令放到交易場裡。


    所以，我決定要成為證券分析師，那是當時最吸引我，也最適合我個性的工作。


    讀小學一年級時，老師問班上每個人長大後的志願，我說：「我要當偵探。」身為一個出身猶太家庭的聰明小孩，我不想成為醫生或律師，只想當偵探。


    我父母一定很懷疑自己到底是哪裡做錯了，但是我從'
  md: '

    玩家賭，但是現場並沒有其他的賭客可以一起玩。所以我決定和自己對賭。我曾設定了一個嚴格的規定，限制自己不能讓同一個玩家連續贏我兩次，一旦發生這種狀況，我就會收手，等待下一個玩家出現再上場。但是在這裡，下一個玩家就是我自己。我當時一定是神智不清了，在對手是自己的狀況下連贏了七場。「太厲害了！」賭場經理讚歎地說：「沒看過有人像你這樣賭骰子。」


    當天晚上回到旅館房間後，我寫道：


    > 一九六七年八月十八日。今天晚上，我希望能從這個學費高昂的一課中學到一些東西，而且從財務觀點上來看，我希望所學到的能比自己所付出的代價來得多。今天晚上，我賭輸了四百美元，對一個年紀比我大的人來說，這都不算一筆小数目，對一個剛滿二十二歲、沒工作的人來說更是嚴重的損失。我在情緒仍未平復的狀況中寫下這篇日誌，希望今天晚上我所學到的事情，應該讓自己據此而設下餘生中都不可打破的戒條：


    - 一、絕不再用太大的金額下賭注。靠努力工作來賺錢，再也不要妄想撈那種不勞而獲的錢，因為世界上根本沒這麼好的事。


    - 二、絕不在度假期間做大金額的賭博。如果真的忍不住的話，也只能拿一些小錢來賭，而且如果缺乏自律，就不要帶太多錢出門。事實上，只該帶你輸得起的錢去賭場，而這筆錢的金額也應該非常小。


    - 三、拿大把鈔票投入賭場或賽馬是件很荒唐的事。以後只要拿小小的賭資當作消遣就好了。


    今晚學到的教訓，將在日後顯現出真正的價值。我該記取今晚的經驗，未來就可以證明我付出的代價到底是昂貴或便宜。該是讓自己免於這種瘋狂行徑的時候了，我該回到從前相信努力工作才是追求成功和快樂的信念中。我只應該從具生產性的成就裡得到滿足。我必須在為時已晚前學到這個教訓。


    為了幫助自己消弭個性中的弱點，我認為必須在就讀研究所期間加倍用功，以減輕這種好賭的習性。


    當然，我寫的這些都是狗屁。我才不想放棄賭博呢！第二天我就重回賭桌了。而且在我離開倫敦之前，還贏回不少先前輸掉的錢，只不過最後剩下的錢並不夠還給父母就是了。


    我的賭場筆記：不要打擊自己的信心。如果擁有一個有效計畫，你就堅持到底吧！


    ## 從拉斯維加斯，一路賭到球場去


    瑞奇（Rich C）把我帶到另一個賭博層次。


    一九七〇年冬天，當時我剛從商學研究所畢業，並開始為昆恩・勞伯（Ken Lobo）公司工作。我也從位於紐海文的陸戰隊補給部，調到布魯克林的俄羅斯偵察部。瑞奇是我所屬單位招募而來的兵，他簡直可說嗜賭成性。由於當時在布魯克林實在沒有什麼俄羅斯人好調查，所以我們把大部分空間的時間都用來玩牌，並討論有關賭博的話題。


    在我們執行為期兩週、位於加州潘達頓（Prudon）的訓練任務時，有一整個週末沒事做，瑞奇對我說：「想去拉斯維加斯嗎？」


    我從來沒去過，所以很自然回答說：「當然好啊！」


    那是八月初，天氣仍然十分炎熱，而且沙漠中不時會吹起沙暴。我們像小貓一樣被塞在一個像烘乾機似的小飛機上，駕駛員甚至不確定是否能順利降落。他總共試了三次才順利降落，我當時還以為我們真的會機毀人亡呢！當我們終於走進沙城飯店時，我看到了吃角子老虎、牌桌、飲料、食物、招待小姐以及各種賭戲，立刻覺得自己好像又活了過來。


    我們住進飯店時，服務生說：「你們這些小伙子需要什麼，儘管告訴服務臺。我的意思是說，如果需要『任何』服務，只要打電話給我們就行了。」還沒打半通電話，拉斯維加斯就已經成為世界上我最喜愛的地方了。我下樓賭博、回到房間、休息一下、吃點東西、再度下樓，繼續賭博。對一個有良好工作的軍身漢來說，拉斯維加斯簡直是天堂。


    從那時開始，我只要一有機會就會去拉斯維加斯玩一趟。對一個純粹的賭徒而言，世界上沒有任何其他地方比得上拉斯維加斯。


    同年秋天，我們在布魯克林的部隊開了一次會，瑞奇要我幫忙鑑定他的足球明星卡。他說他想打電話給他的馬票商（以賭馬和開賭盤維生的人）卡邁因（Carmine），我說：「真巧！我也想找一個馬票商和我合作。」


    但馬票商是不隨便跟人配合的，得有人作保才行，所以瑞奇就幫我和卡邁因安排了一次面談。我們在位於楊克斯市（Yonkers）的阿瓜維特餐廳見面。

    卡邁因是一個皮膚黝黑、身材矮小、行爲舉止鬼鬼祟祟的西西里人，他的領子總是拉得高高的，帽簷又總是壓得低低的，還會不停地回頭張望。我想我大概看起來像聯邦調查局的探員，因為不一會兒的功夫，卡邁因已經開始和我說起行話來了。例如，想要下注五百美元就是一「元」，而一百美元的賭注則以「一角」代表。他給了我幾個電話號碼，讓我在需要時能找到地方下注，最後他對我說：「馬丁，你需要一個代號，就叫你楓樹（Map）好了。


    就這樣，「楓樹」成了我的代號。我會在星期日的早晨出門找公共電話，拉高衣領、壓低帽簷，鬼鬼祟祟地四處張望，然後打電話給卡邁因。「我是楓樹，」我會對著電話小聲地說：「巨人隊的賭盤如何？底特律超過分八・五分嗎？好，我喜歡這個賭盤，幫我在獅子隊上面買個五分錢（五百美元）。」


    卡邁因不接受支票或信用卡，所以我在公寓裡找了地方藏錢。所有賭徒都有自己怪異的藏錢地點，我選的是一本我在讀研究時所買的有關聯邦稅制的書，做爲我藏錢的地方——因爲我覺得不會有人注意到那本書，而且把賭資藏在這本書裡，夠諷刺吧？


    「楓樹」在足球方面賭得還算順利，但在籃球季就失準了。如果楓樹當時曾經找過精神科醫生的話，他就會知道賭博可能是一種和異性建立穩定關係的替代品。當楓樹的感情世界愈糟，就愈有進場賭博的渴望，而更糟的是在一九七二年年初，他不但沒有任何穩定的異性關係，同時也處於不斷輸錢的狀況。


    我曾經在佛蒙特州的糖楓林（Sugarbush）參加一個滑雪俱樂部，但還是沒辦法因此和異性建立什麼特別的關係。二月初時，我已經在卡邁因那裡輸了兩千美元了，這對我来说可是一大筆錢。某個星期五的晚上，我正開著小轎車往滑雪俱樂部去，那時我已經差不多要宣告破產了。我在那週稍早時，曾經南下到路易斯維爾（Louisville）和一家公司的總裁開會。


    卡邁因有一種很奇特的賭法，叫做「如果反轉就加倍」（Double if it reverses）賭法。在這種賭法裡，你可以在四種結果中任一種出現時贏錢，有機會以五百美元賺回四千美元。我一直用自已記錄賽馬、騎師，以及輪盤的方法來記錄美國大學籃球賽的比賽結果。在那一季接近尾聲時，我已經很清楚知道誰會贏得單場勝利、誰會贏得連續勝利，或者誰只會贏得主場勝利。我挑出四場比賽來玩這種「如果反轉就加倍」的賭法。我在第四場比賽賭路易斯維爾會贏曼菲斯三、五分。因為我在路易斯維爾開會期間，每個人都在談論主教練，而我對路易斯維爾的感覺也很棒。所以我打電話給卡邁因下注。


    星期六下午到晚上，我開著車在山路裡繞來繞去，想要讓收音機調出最清楚的收訊，聽一聽比賽結果。當時正在下雪，我的手凍得不得了的，靜電嚴重干擾收訊，但過了午夜後，我很確定我贏了第一場和第三場比賽的賭局。只要路易斯維爾能贏四分，我就能脫離困境，大賺一票。我好像聽到中場休息前路易斯維爾落後十一分，或者七分，但不管他們落後多少分，聽來似乎都不大妙。


    我快瘋了，我得知道路易斯維爾有沒有後來居上。時間已經是清晨一點，我還把車停在滑雪俱樂部的屋外，調整著收音機。我收聽到鹽湖城摩門教堂的唱詩班歌聲、魁北克的冰上曲棍球比賽、渥斯堡（Ole
    Wyso）的牲口價格以及拉斯維加斯的拳賽結果，但是沒有聽到路易斯維爾或曼菲斯的球賽結果報導。除了我，每個人都在俱樂部裡參加派對。難怪我總是沒有辦法和異性發展穩定的關係了。


    到了凌晨兩點，我的汽油快用光了。我放棄希望，回屋裡睡覺。第二天早上除了我之外，每個人都去打滑雪。我坐上車，開進城裡，買了一份《紐約時報》。路易斯維爾最後絕地大反攻，從落後十五分急起直追，最後以七十五比七十一大獲全勝。


    我贏了！我贏了四千美元！我完全脫離困境了。


    回到城裡，我立刻打電話給卡邁因，問他該約在哪裡見面付錢。通常每週的賭局在星期日結束後，賭金的支付日都是下個星期二。卡邁因告訴我，他下個星期二下班後會在第八十六街和第三街的交叉口和我碰面，就在電影院門前。要去拿四千美元的現金，我感到很緊張。在紐約街頭，有很多人會因為四十美元而丟了小命。


    當時《教父》這部電影才剛上映，排隊買票的長龍繞過了街角。當卡邁因拉高衣領、壓低帽簷走過來時，我正站在戲院的屋簷下。他推開排隊的人群走上前來，塞了四十張百元大鈔在我的手心。每敵人都盯著我們看。我就站在大幅的電影海報旁，從一個叫卡邁因的馬票商手中接過一大疊現金。我開始想像在我到家前，會有一個身材魁梧的彪形大漢來搶劫我，甚至把我給幹掉。我禁不住汗流浠背，直到把那四千美元放進聯邦稅制的書中，才安下心來。


    ## 賭馬場上的內線消息……


    瑞奇有一個朋友叫比利（Billy），他是在漢茲公司（Hinz & Co.）工作的一名營業員。比利總是有不少的花樣好搞。一九七一年的八月，我們三個人開車到沙拉多加（Scaroga）去玩。比利說他認識一個宣稱可以控制比賽結果的賽馬訓練師。我懷疑這個事情的真實性，但是基本上不管你是賭馬或是在市場上操作，其實都一樣，每個人都夢想能未卜先知。「比利，」我說：「如果那個傢伙有什麼動作的話，讓我知道一下。」


    到了下個月我們開會時，瑞奇把我拉到一旁去。「比利說他的朋友又報出明牌了。有一匹馬星期四會在水道賽馬場跑第六場比賽，牠的名字叫『我的旋律』，他說賭這匹馬穩贏。你要一起賭一把嗎？」


    「當然好啊！」


    星期一我去銀行領出了一千美元，然後把它夾到我的稅制書中。星期二，我告訴秘書瓊安，我在星期四下午有場重要的會議，所以不要再幫我安排其他行程。星期三，我買了一份《每日賽馬報》，並歡天喜地發現「我的旋律」的賭盤竟然是四比一，但是在星期四的早晨，我接到一通瑞奇打來的電話。「算了吧！」他說：「我們玩不成了，我們的馬剛剛受傷了。」


    接下來的星期一是哥倫布紀念日，但即使銀行都沒有開門，市場還是照常開盤，所以我還是進了辦公室。我正準備要出門去吃午餐時，電話鈴聲響起，是瑞奇打來的。「我們又可以進場玩了，


    比利剛才聽說我們的馬要在第四場比賽時出賽，我們得馬上趕到賽馬場才行。但有個麻煩，銀行沒開門，所以我們領不出錢，你手上有現金嗎？」


    「有啊，大約一千美元吧！但錢放在家裡，給我一個鐘頭回去拿。」


    「把錢全部拿來，如果有更多的話也一起拿過來吧！我們下午一點在比利辦公室等你。」


    賭馬的機會又回來了。我打電話給哥哥傑瑞，問他手上有沒有更多現金，結果他說也想參一腳。「和我在地鐵站碰面，半個鐘頭後見。」我說。我抓起西裝外套，告訴瓊安：「我現在得趕去開上星期四被取消的那場會議，這是很重要的會。告訴訪客我大約會在三點半左右回來。」


    我下樓跑到地鐵站，搭上了往城郊的列車。我在四十二街那站下車，和傑瑞碰面，跟他拿了一百美元，然後又跳上地鐵。我在七十七街那站下車，跑步回家，從聯邦稅制書中抓起一千美元，再跑回地鐵站，搭車回頭到第五十九街下車。我的錶上顯示時間是一點零五分，漢茲公司的辦公室就在五十九街和公園大道的轉角上，瑞奇和比利正在大門外的階梯上等我。


    「拿到錢了嗎？」比利問。


    我拿出那疊鈔票給他看，隨後跳上一部計程車。我丟了一張二十美元的鈔票給司機，告訴他：「水道賽馬場，請開快點！」


    我們趕到賽馬場時，第三場比賽才剛剛結束。我借給瑞奇和比利三百美元，然後自己在「我的旋律」身上下注八百美元。那場比賽是我看過最棒的一場，「我的旋律」以二、五個馬身的距離贏得了比賽，在過程中我們不停地大聲喊叫、尖叫，互相拍著彼此的背，上下跳躍個不停。我贏了二千八百美元，這是我第一次靠內線消息而獲利，更讓我覺得勝利的滋味格外甜美。


    瑞奇和比利還要留下來下注，而我還要趕回辦公室。我拿出一個二十五分的硬幣，漫步走向地鐵站。我看到場外的車道停滿了一排排大型禮車，心裡想，「慢著，你剛剛才贏了二千八百美元，口袋裡放了超過四千一百美元的現金，還去撘什麼鬼地鐵？」我花了五十美元為自己雇了一輛禮車，然後愉快、風光地坐車回到辦公室。


    我的賭場筆記：無論結果如何，人人都想未卜先知。


    ## 一心只想著賭錢的渾蛋


    一九七二年，我發現了拿騮（Negro）群島裡的天堂島（Paradise Island）。從紐約只要飛兩個半鐘頭，再付個幾塊錢過橋費就可以抵達。那裡簡直就是水道賽馬場、笛翁和拉斯維加斯的混合體，有相當多的綠蔭和流水，也有很多穿著西裝、打著領帶的歐洲人與很多好玩的活動。但是天堂島不像拉斯維加斯，去那裡的人多是成雙成對，並非單身漢的天堂。我從來都沒辦法和任何一個看起來像樣的異性約會，所以在我沒結婚前，去天堂島玩的次數就遠低於拉斯維加斯。


    後來我認識了奧黛莉。當我們討論去哪裡度蜜月時，我心中除了天堂島外，沒有第二個選擇。


    一九七八年三月二十六日，我們在紐約度過新婚之夜，第二天一大早就搭上前往拿騮的班機。我在勞斯飯店訂了一間面海的蜜月套房。我們在中午時住進飯店，當奧黛莉打開行李時，我已經抓起電話開始和貝爾·史鷹的營業員連上了線。我連在度假月時都不忘要繼續賺錢。


    那裡的賭場在下午一點開始營業，所以在十二點五十五分時我結束了電話，然後歡呼一聲：


    「奧黛莉，該是我們找點樂子的時候了！」


    「我馬上就出來。」她以性感的語調從浴室回應。


    我看了看手錶，「好吧！快點，親愛的我現在可正在興頭上呢！」


    浴室的門打開了，奧黛莉穿著一件薄紗睡衣站在門口，左手拿著一瓶香檳，右手拿著一盒草莓巧克力。


    「嘿，你在幹什麼？」我說：「你幹嘛穿成這樣？賭場在一點整就開始營業了，我們會來不及去玩幾把的。」


    奧黛莉一句話也沒說，轉身走回浴室，放下巧克力和香檳，把門鎖起來。她想像中那個羅曼蒂克的天堂島蜜月之旅，剛剛被我搞砸了。她現在才發現，她所嫁的那個渾蛋心裡所謂的享樂，只不過是想跑去賭場贏錢而已。


    ### 我的賭場筆記：把自己的優先順序弄清楚！


    我已經不再常去玩牌、賭馬或去賭場賭泥了。打從訂下「計畫」之後，我把賭局轉移到股票、選擇權以及期貨市場上。但是我並沒有忘記自己在柯漢家的地下室、水道賽馬場、欣斯岱爾、歐洲、拉斯維加斯、阿瓜維特餐廳，以及天堂島那裡學到的人生課程。


    愈來愈多嶄新的金融工具在這場金錢遊戲中出現，操作行爲也漸漸從交易場轉移到電腦系統，愈來愈多的操盤手出身哈佛大學、賓大華頓商學院（Wharton）、巴黎索邦大學（Sorbonne），還有倫敦政經學院（London
    School of Economics）。學歷固然重要，但是全世界所有名校的學位在交易場開盤鐘聲響起時都嫌不足，我從許多向我尋求建議的年輕人身上看出這一點。除非他們在內心深處已經有深刻的體會，否則沒有辦法遵守操作紀律，沒有辦法在關鍵時刻扣下扳機，也沒有辦法成為真正的市場贏家。


    我的賭場筆記：一個偉大的操盤手，一定也是一個懂得如何賭博的人。


    ## 第四堂課


    想贏，就要懂得自律！


    操作期貨和在賭桌上賭骰子，有非常多相似之處，所以拉斯維加斯是一個想要成功的操盤手磨練如何遵守操作紀律最佳的地点。


    沒有人能持續在拉斯維加斯贏錢，但如果你真的是個中好手的話，可以在一定的時間裡贏錢，而且控制虧損，每一回都樂在其中，不至敗興而歸。但這必須是在你能夠自律的狀況下才行。賭場都希望你靠勇氣和直覺，而非用頭腦來賭博，而且會想盡一切辦法來打斷你的專注力。他們會無限制的提供酒精飲料、穿著清涼的女人，以及無止盡的娛樂，一天二十四小時，每週七天，一年三百六十五天從不間斷。


    我最喜歡的賭博是擲骰子。這非常像你在交易場中做交易──節奏快、噪音大、人群擠，而且也都有很多的錢在流動。十二個玩家斜靠在賭桌旁看著每一擲，急著要看出誰是贏家。當有人開始擲骰子時，籌碼在空中飛舞，人群會向前擠得更緊，每個人的呼吸都變得很沉重，呼喊聲更加大了分貝。這感覺真的好像我在交易場裡站在「小雞」、法蘭尼和肥麥克的身旁一樣。


    我是一個總是和擲骰子的人對賭的玩家。其實不論你是否和擲骰子的人對賭，獲勝的機率其實都是相同的，但大部分的人到下注擲骰子的人會贏。我之所以這麼做，是因為不希望和那些穿著藍色休閒衫、在胸前掛著一塊大金牌的鄉巴佬，或是穿著亮片迷你裙、總在擲骰子前往手裡吐一口唾沫的胖女人站在同一陣線上。我希望他們都擲得很糟，這樣我才能贏錢。所以基本上，每個在骰子賭桌旁的人，甚至包括那些靠贏錢者打賞的賭場職員都討厭我。不過這一點我並不在意，不管是在骰子賭桌上或是在交易場裡，輸家永遠痛恨贏家。


    在拉斯維加斯賭骰子的經驗，讓我學到三個自我對於金融操作絕對重要的規則：


    ### 一、把自尊心和賭戲（操作行為）分開


    絕不讓情緒因素介入操作。當你在和別的賭客對賭時，不應該把事情個人化，而應該對事不對人。如果你讓自尊心浸入賭局，可能會在鄉巴佬贏了幾盤後把賭注加倍，或是當穿著亮片裙的胖女人擲不好時降低賭注。我發現這是一種自我毀滅的行為，必然會把事情搞砸。你必須完全不做任何情緒性的反應，要不動如山。


    ### 二、管控你的資金


    我一進賭場，會先到兑幣處前租一個保管箱來放我的錢。我把所有的錢都放在那裡，身上只留幾百塊。如果手頭上的錢輸光了，我就得去打開保管箱取錢。去保管箱拿錢的動作，可以使我暫時離開賭桌，自動中止一直輸錢的爛手氣，也讓我有時間輕鬆一下，然後思考下一步要怎麼做比較好。這個動作的效果，就像往自己臉上潑盆冷水一樣。這對金融操作同樣適用：把你的錢放在另外一個獨立戶頭，除非你緊急把錢轉過去，否則營業員是無法動用的。如此一來，你就不會因為一時的情緒激動，而輕易把手中的子彈一下子用完。


    ### 三、在一連串勝利後，換張賭桌吧


    你在過去一段時間中愈幸運，運氣就會愈可能馬上消失無蹤。換張賭桌並不是件容易的事，尤其是在手氣一直都很順的狀況下更是如此。人類的天性會告訴你，如果在一張賭桌上贏錢的話，就該留在那裡賺更多的錢。但是你真正該做的是，拿著剛剛贏的錢，起身回到兌幣處，把多餘的錢存起來，手上仍然只留下幾百塊錢。週期性地帶著贏來的錢離桌，是你避免被賭場的優勢給拖累的唯一辦法。之後，如果你還是覺得手氣正旺，仍然有足夠的專注力，而且還想玩的話，還是換張桌子玩吧！如果你的狀況真的那麼好，換張桌子還是可以繼續贏錢的。


    這些心理上的自律法則或許不能保證你成為市場中的大贏家，但是如果沒有的話，毫無疑問的，你一定會成為一個大輸家。


    ## 第4章


    ### 穿著鱷魚皮鞋的富豪


    #### 我的分析師生涯


    一九七〇年初我刚從研究所畢業，就很清楚知道自己想要投入股票市場。我認為，有三種方式可以進入這個市場：成為一名投資銀行家、操盤手，或證券分析師。


    我很清楚，自己的個性並不適合擔任投資銀行家的工作。投資銀行家都是一些靠著創業投資、承銷股票，和一些巨額投資案賺錢的上流社會人士。但我並沒有這方面的經驗，也沒有資本，更不具備當投資銀行家的背景。那時候，我也不想成為操盤手，因為當時的操盤手只不過是中間人而已，他們從客戶那裡收到交易指令後，再把這些指令放到交易場裡。


    所以，我決定要成為證券分析師，那是當時最吸引我，也最適合我個性的工作。


    讀小學一年級時，老師問班上每個人長大後的志願，我說：「我要當偵探。」身為一個出身猶太家庭的聰明小孩，我不想成為醫生或律師，只想當偵探。


    我父母一定很懷疑自己到底是哪裡做錯了，但是我從

    '
  mdcn: '

    玩家賭，但是現場並沒有其他的賭客可以一起玩。所以我決定和自己對賭。我曾設定了一個嚴格的規定，限制自己不能讓同一個玩家連續贏我兩次，一旦發生這種狀況，我就會收手，等待下一個玩家出現再上場。但是在這裡，下一個玩家就是我自己。我當時一定是神智不清了，在對手是自己的狀況下連贏了七場。「太厲害了！」賭場經理讚歎地說：「沒看過有人像你這樣賭骰子。」


    當天晚上回到旅館房間後，我寫道：


    > 一九六七年八月十八日。今天晚上，我希望能從這個學費高昂的一課中學到一些東西，而且從財務觀點上來看，我希望所學到的能比自己所付出的代價來得多。今天晚上，我賭輸了四百美元，對一個年紀比我大的人來說，這都不算一筆小数目，對一個剛滿二十二歲、沒工作的人來說更是嚴重的損失。我在情緒仍未平復的狀況中寫下這篇日誌，希望今天晚上我所學到的事情，應該讓自己據此而設下餘生中都不可打破的戒條：


    - 一、絕不再用太大的金額下賭注。靠努力工作來賺錢，再也不要妄想撈那種不勞而獲的錢，因為世界上根本沒這麼好的事。


    - 二、絕不在度假期間做大金額的賭博。如果真的忍不住的話，也只能拿一些小錢來賭，而且如果缺乏自律，就不要帶太多錢出門。事實上，只該帶你輸得起的錢去賭場，而這筆錢的金額也應該非常小。


    - 三、拿大把鈔票投入賭場或賽馬是件很荒唐的事。以後只要拿小小的賭資當作消遣就好了。


    今晚學到的教訓，將在日後顯現出真正的價值。我該記取今晚的經驗，未來就可以證明我付出的代價到底是昂貴或便宜。該是讓自己免於這種瘋狂行徑的時候了，我該回到從前相信努力工作才是追求成功和快樂的信念中。我只應該從具生產性的成就裡得到滿足。我必須在為時已晚前學到這個教訓。


    為了幫助自己消弭個性中的弱點，我認為必須在就讀研究所期間加倍用功，以減輕這種好賭的習性。


    當然，我寫的這些都是狗屁。我才不想放棄賭博呢！第二天我就重回賭桌了。而且在我離開倫敦之前，還贏回不少先前輸掉的錢，只不過最後剩下的錢並不夠還給父母就是了。


    我的賭場筆記：不要打擊自己的信心。如果擁有一個有效計畫，你就堅持到底吧！


    ## 從拉斯維加斯，一路賭到球場去


    瑞奇（Rich C）把我帶到另一個賭博層次。


    一九七〇年冬天，當時我剛從商學研究所畢業，並開始為昆恩・勞伯（Ken Lobo）公司工作。我也從位於紐海文的陸戰隊補給部，調到布魯克林的俄羅斯偵察部。瑞奇是我所屬單位招募而來的兵，他簡直可說嗜賭成性。由於當時在布魯克林實在沒有什麼俄羅斯人好調查，所以我們把大部分空間的時間都用來玩牌，並討論有關賭博的話題。


    在我們執行為期兩週、位於加州潘達頓（Prudon）的訓練任務時，有一整個週末沒事做，瑞奇對我說：「想去拉斯維加斯嗎？」


    我從來沒去過，所以很自然回答說：「當然好啊！」


    那是八月初，天氣仍然十分炎熱，而且沙漠中不時會吹起沙暴。我們像小貓一樣被塞在一個像烘乾機似的小飛機上，駕駛員甚至不確定是否能順利降落。他總共試了三次才順利降落，我當時還以為我們真的會機毀人亡呢！當我們終於走進沙城飯店時，我看到了吃角子老虎、牌桌、飲料、食物、招待小姐以及各種賭戲，立刻覺得自己好像又活了過來。


    我們住進飯店時，服務生說：「你們這些小伙子需要什麼，儘管告訴服務臺。我的意思是說，如果需要『任何』服務，只要打電話給我們就行了。」還沒打半通電話，拉斯維加斯就已經成為世界上我最喜愛的地方了。我下樓賭博、回到房間、休息一下、吃點東西、再度下樓，繼續賭博。對一個有良好工作的軍身漢來說，拉斯維加斯簡直是天堂。


    從那時開始，我只要一有機會就會去拉斯維加斯玩一趟。對一個純粹的賭徒而言，世界上沒有任何其他地方比得上拉斯維加斯。


    同年秋天，我們在布魯克林的部隊開了一次會，瑞奇要我幫忙鑑定他的足球明星卡。他說他想打電話給他的馬票商（以賭馬和開賭盤維生的人）卡邁因（Carmine），我說：「真巧！我也想找一個馬票商和我合作。」


    但馬票商是不隨便跟人配合的，得有人作保才行，所以瑞奇就幫我和卡邁因安排了一次面談。我們在位於楊克斯市（Yonkers）的阿瓜維特餐廳見面。

    卡邁因是一個皮膚黝黑、身材矮小、行爲舉止鬼鬼祟祟的西西里人，他的領子總是拉得高高的，帽簷又總是壓得低低的，還會不停地回頭張望。我想我大概看起來像聯邦調查局的探員，因為不一會兒的功夫，卡邁因已經開始和我說起行話來了。例如，想要下注五百美元就是一「元」，而一百美元的賭注則以「一角」代表。他給了我幾個電話號碼，讓我在需要時能找到地方下注，最後他對我說：「馬丁，你需要一個代號，就叫你楓樹（Map）好了。


    就這樣，「楓樹」成了我的代號。我會在星期日的早晨出門找公共電話，拉高衣領、壓低帽簷，鬼鬼祟祟地四處張望，然後打電話給卡邁因。「我是楓樹，」我會對著電話小聲地說：「巨人隊的賭盤如何？底特律超過分八・五分嗎？好，我喜歡這個賭盤，幫我在獅子隊上面買個五分錢（五百美元）。」


    卡邁因不接受支票或信用卡，所以我在公寓裡找了地方藏錢。所有賭徒都有自己怪異的藏錢地點，我選的是一本我在讀研究時所買的有關聯邦稅制的書，做爲我藏錢的地方——因爲我覺得不會有人注意到那本書，而且把賭資藏在這本書裡，夠諷刺吧？


    「楓樹」在足球方面賭得還算順利，但在籃球季就失準了。如果楓樹當時曾經找過精神科醫生的話，他就會知道賭博可能是一種和異性建立穩定關係的替代品。當楓樹的感情世界愈糟，就愈有進場賭博的渴望，而更糟的是在一九七二年年初，他不但沒有任何穩定的異性關係，同時也處於不斷輸錢的狀況。


    我曾經在佛蒙特州的糖楓林（Sugarbush）參加一個滑雪俱樂部，但還是沒辦法因此和異性建立什麼特別的關係。二月初時，我已經在卡邁因那裡輸了兩千美元了，這對我来说可是一大筆錢。某個星期五的晚上，我正開著小轎車往滑雪俱樂部去，那時我已經差不多要宣告破產了。我在那週稍早時，曾經南下到路易斯維爾（Louisville）和一家公司的總裁開會。


    卡邁因有一種很奇特的賭法，叫做「如果反轉就加倍」（Double if it reverses）賭法。在這種賭法裡，你可以在四種結果中任一種出現時贏錢，有機會以五百美元賺回四千美元。我一直用自已記錄賽馬、騎師，以及輪盤的方法來記錄美國大學籃球賽的比賽結果。在那一季接近尾聲時，我已經很清楚知道誰會贏得單場勝利、誰會贏得連續勝利，或者誰只會贏得主場勝利。我挑出四場比賽來玩這種「如果反轉就加倍」的賭法。我在第四場比賽賭路易斯維爾會贏曼菲斯三、五分。因為我在路易斯維爾開會期間，每個人都在談論主教練，而我對路易斯維爾的感覺也很棒。所以我打電話給卡邁因下注。


    星期六下午到晚上，我開著車在山路裡繞來繞去，想要讓收音機調出最清楚的收訊，聽一聽比賽結果。當時正在下雪，我的手凍得不得了的，靜電嚴重干擾收訊，但過了午夜後，我很確定我贏了第一場和第三場比賽的賭局。只要路易斯維爾能贏四分，我就能脫離困境，大賺一票。我好像聽到中場休息前路易斯維爾落後十一分，或者七分，但不管他們落後多少分，聽來似乎都不大妙。


    我快瘋了，我得知道路易斯維爾有沒有後來居上。時間已經是清晨一點，我還把車停在滑雪俱樂部的屋外，調整著收音機。我收聽到鹽湖城摩門教堂的唱詩班歌聲、魁北克的冰上曲棍球比賽、渥斯堡（Ole
    Wyso）的牲口價格以及拉斯維加斯的拳賽結果，但是沒有聽到路易斯維爾或曼菲斯的球賽結果報導。除了我，每個人都在俱樂部裡參加派對。難怪我總是沒有辦法和異性發展穩定的關係了。


    到了凌晨兩點，我的汽油快用光了。我放棄希望，回屋裡睡覺。第二天早上除了我之外，每個人都去打滑雪。我坐上車，開進城裡，買了一份《紐約時報》。路易斯維爾最後絕地大反攻，從落後十五分急起直追，最後以七十五比七十一大獲全勝。


    我贏了！我贏了四千美元！我完全脫離困境了。


    回到城裡，我立刻打電話給卡邁因，問他該約在哪裡見面付錢。通常每週的賭局在星期日結束後，賭金的支付日都是下個星期二。卡邁因告訴我，他下個星期二下班後會在第八十六街和第三街的交叉口和我碰面，就在電影院門前。要去拿四千美元的現金，我感到很緊張。在紐約街頭，有很多人會因為四十美元而丟了小命。


    當時《教父》這部電影才剛上映，排隊買票的長龍繞過了街角。當卡邁因拉高衣領、壓低帽簷走過來時，我正站在戲院的屋簷下。他推開排隊的人群走上前來，塞了四十張百元大鈔在我的手心。每敵人都盯著我們看。我就站在大幅的電影海報旁，從一個叫卡邁因的馬票商手中接過一大疊現金。我開始想像在我到家前，會有一個身材魁梧的彪形大漢來搶劫我，甚至把我給幹掉。我禁不住汗流浠背，直到把那四千美元放進聯邦稅制的書中，才安下心來。


    ## 賭馬場上的內線消息……


    瑞奇有一個朋友叫比利（Billy），他是在漢茲公司（Hinz & Co.）工作的一名營業員。比利總是有不少的花樣好搞。一九七一年的八月，我們三個人開車到沙拉多加（Scaroga）去玩。比利說他認識一個宣稱可以控制比賽結果的賽馬訓練師。我懷疑這個事情的真實性，但是基本上不管你是賭馬或是在市場上操作，其實都一樣，每個人都夢想能未卜先知。「比利，」我說：「如果那個傢伙有什麼動作的話，讓我知道一下。」


    到了下個月我們開會時，瑞奇把我拉到一旁去。「比利說他的朋友又報出明牌了。有一匹馬星期四會在水道賽馬場跑第六場比賽，牠的名字叫『我的旋律』，他說賭這匹馬穩贏。你要一起賭一把嗎？」


    「當然好啊！」


    星期一我去銀行領出了一千美元，然後把它夾到我的稅制書中。星期二，我告訴秘書瓊安，我在星期四下午有場重要的會議，所以不要再幫我安排其他行程。星期三，我買了一份《每日賽馬報》，並歡天喜地發現「我的旋律」的賭盤竟然是四比一，但是在星期四的早晨，我接到一通瑞奇打來的電話。「算了吧！」他說：「我們玩不成了，我們的馬剛剛受傷了。」


    接下來的星期一是哥倫布紀念日，但即使銀行都沒有開門，市場還是照常開盤，所以我還是進了辦公室。我正準備要出門去吃午餐時，電話鈴聲響起，是瑞奇打來的。「我們又可以進場玩了，


    比利剛才聽說我們的馬要在第四場比賽時出賽，我們得馬上趕到賽馬場才行。但有個麻煩，銀行沒開門，所以我們領不出錢，你手上有現金嗎？」


    「有啊，大約一千美元吧！但錢放在家裡，給我一個鐘頭回去拿。」


    「把錢全部拿來，如果有更多的話也一起拿過來吧！我們下午一點在比利辦公室等你。」


    賭馬的機會又回來了。我打電話給哥哥傑瑞，問他手上有沒有更多現金，結果他說也想參一腳。「和我在地鐵站碰面，半個鐘頭後見。」我說。我抓起西裝外套，告訴瓊安：「我現在得趕去開上星期四被取消的那場會議，這是很重要的會。告訴訪客我大約會在三點半左右回來。」


    我下樓跑到地鐵站，搭上了往城郊的列車。我在四十二街那站下車，和傑瑞碰面，跟他拿了一百美元，然後又跳上地鐵。我在七十七街那站下車，跑步回家，從聯邦稅制書中抓起一千美元，再跑回地鐵站，搭車回頭到第五十九街下車。我的錶上顯示時間是一點零五分，漢茲公司的辦公室就在五十九街和公園大道的轉角上，瑞奇和比利正在大門外的階梯上等我。


    「拿到錢了嗎？」比利問。


    我拿出那疊鈔票給他看，隨後跳上一部計程車。我丟了一張二十美元的鈔票給司機，告訴他：「水道賽馬場，請開快點！」


    我們趕到賽馬場時，第三場比賽才剛剛結束。我借給瑞奇和比利三百美元，然後自己在「我的旋律」身上下注八百美元。那場比賽是我看過最棒的一場，「我的旋律」以二、五個馬身的距離贏得了比賽，在過程中我們不停地大聲喊叫、尖叫，互相拍著彼此的背，上下跳躍個不停。我贏了二千八百美元，這是我第一次靠內線消息而獲利，更讓我覺得勝利的滋味格外甜美。


    瑞奇和比利還要留下來下注，而我還要趕回辦公室。我拿出一個二十五分的硬幣，漫步走向地鐵站。我看到場外的車道停滿了一排排大型禮車，心裡想，「慢著，你剛剛才贏了二千八百美元，口袋裡放了超過四千一百美元的現金，還去撘什麼鬼地鐵？」我花了五十美元為自己雇了一輛禮車，然後愉快、風光地坐車回到辦公室。


    我的賭場筆記：無論結果如何，人人都想未卜先知。


    ## 一心只想著賭錢的渾蛋


    一九七二年，我發現了拿騮（Negro）群島裡的天堂島（Paradise Island）。從紐約只要飛兩個半鐘頭，再付個幾塊錢過橋費就可以抵達。那裡簡直就是水道賽馬場、笛翁和拉斯維加斯的混合體，有相當多的綠蔭和流水，也有很多穿著西裝、打著領帶的歐洲人與很多好玩的活動。但是天堂島不像拉斯維加斯，去那裡的人多是成雙成對，並非單身漢的天堂。我從來都沒辦法和任何一個看起來像樣的異性約會，所以在我沒結婚前，去天堂島玩的次數就遠低於拉斯維加斯。


    後來我認識了奧黛莉。當我們討論去哪裡度蜜月時，我心中除了天堂島外，沒有第二個選擇。


    一九七八年三月二十六日，我們在紐約度過新婚之夜，第二天一大早就搭上前往拿騮的班機。我在勞斯飯店訂了一間面海的蜜月套房。我們在中午時住進飯店，當奧黛莉打開行李時，我已經抓起電話開始和貝爾·史鷹的營業員連上了線。我連在度假月時都不忘要繼續賺錢。


    那裡的賭場在下午一點開始營業，所以在十二點五十五分時我結束了電話，然後歡呼一聲：


    「奧黛莉，該是我們找點樂子的時候了！」


    「我馬上就出來。」她以性感的語調從浴室回應。


    我看了看手錶，「好吧！快點，親愛的我現在可正在興頭上呢！」


    浴室的門打開了，奧黛莉穿著一件薄紗睡衣站在門口，左手拿著一瓶香檳，右手拿著一盒草莓巧克力。


    「嘿，你在幹什麼？」我說：「你幹嘛穿成這樣？賭場在一點整就開始營業了，我們會來不及去玩幾把的。」


    奧黛莉一句話也沒說，轉身走回浴室，放下巧克力和香檳，把門鎖起來。她想像中那個羅曼蒂克的天堂島蜜月之旅，剛剛被我搞砸了。她現在才發現，她所嫁的那個渾蛋心裡所謂的享樂，只不過是想跑去賭場贏錢而已。


    ### 我的賭場筆記：把自己的優先順序弄清楚！


    我已經不再常去玩牌、賭馬或去賭場賭泥了。打從訂下「計畫」之後，我把賭局轉移到股票、選擇權以及期貨市場上。但是我並沒有忘記自己在柯漢家的地下室、水道賽馬場、欣斯岱爾、歐洲、拉斯維加斯、阿瓜維特餐廳，以及天堂島那裡學到的人生課程。


    愈來愈多嶄新的金融工具在這場金錢遊戲中出現，操作行爲也漸漸從交易場轉移到電腦系統，愈來愈多的操盤手出身哈佛大學、賓大華頓商學院（Wharton）、巴黎索邦大學（Sorbonne），還有倫敦政經學院（London
    School of Economics）。學歷固然重要，但是全世界所有名校的學位在交易場開盤鐘聲響起時都嫌不足，我從許多向我尋求建議的年輕人身上看出這一點。除非他們在內心深處已經有深刻的體會，否則沒有辦法遵守操作紀律，沒有辦法在關鍵時刻扣下扳機，也沒有辦法成為真正的市場贏家。


    我的賭場筆記：一個偉大的操盤手，一定也是一個懂得如何賭博的人。


    ## 第四堂課


    想贏，就要懂得自律！


    操作期貨和在賭桌上賭骰子，有非常多相似之處，所以拉斯維加斯是一個想要成功的操盤手磨練如何遵守操作紀律最佳的地点。


    沒有人能持續在拉斯維加斯贏錢，但如果你真的是個中好手的話，可以在一定的時間裡贏錢，而且控制虧損，每一回都樂在其中，不至敗興而歸。但這必須是在你能夠自律的狀況下才行。賭場都希望你靠勇氣和直覺，而非用頭腦來賭博，而且會想盡一切辦法來打斷你的專注力。他們會無限制的提供酒精飲料、穿著清涼的女人，以及無止盡的娛樂，一天二十四小時，每週七天，一年三百六十五天從不間斷。


    我最喜歡的賭博是擲骰子。這非常像你在交易場中做交易──節奏快、噪音大、人群擠，而且也都有很多的錢在流動。十二個玩家斜靠在賭桌旁看著每一擲，急著要看出誰是贏家。當有人開始擲骰子時，籌碼在空中飛舞，人群會向前擠得更緊，每個人的呼吸都變得很沉重，呼喊聲更加大了分貝。這感覺真的好像我在交易場裡站在「小雞」、法蘭尼和肥麥克的身旁一樣。


    我是一個總是和擲骰子的人對賭的玩家。其實不論你是否和擲骰子的人對賭，獲勝的機率其實都是相同的，但大部分的人到下注擲骰子的人會贏。我之所以這麼做，是因為不希望和那些穿著藍色休閒衫、在胸前掛著一塊大金牌的鄉巴佬，或是穿著亮片迷你裙、總在擲骰子前往手裡吐一口唾沫的胖女人站在同一陣線上。我希望他們都擲得很糟，這樣我才能贏錢。所以基本上，每個在骰子賭桌旁的人，甚至包括那些靠贏錢者打賞的賭場職員都討厭我。不過這一點我並不在意，不管是在骰子賭桌上或是在交易場裡，輸家永遠痛恨贏家。


    在拉斯維加斯賭骰子的經驗，讓我學到三個自我對於金融操作絕對重要的規則：


    ### 一、把自尊心和賭戲（操作行為）分開


    絕不讓情緒因素介入操作。當你在和別的賭客對賭時，不應該把事情個人化，而應該對事不對人。如果你讓自尊心浸入賭局，可能會在鄉巴佬贏了幾盤後把賭注加倍，或是當穿著亮片裙的胖女人擲不好時降低賭注。我發現這是一種自我毀滅的行為，必然會把事情搞砸。你必須完全不做任何情緒性的反應，要不動如山。


    ### 二、管控你的資金


    我一進賭場，會先到兑幣處前租一個保管箱來放我的錢。我把所有的錢都放在那裡，身上只留幾百塊。如果手頭上的錢輸光了，我就得去打開保管箱取錢。去保管箱拿錢的動作，可以使我暫時離開賭桌，自動中止一直輸錢的爛手氣，也讓我有時間輕鬆一下，然後思考下一步要怎麼做比較好。這個動作的效果，就像往自己臉上潑盆冷水一樣。這對金融操作同樣適用：把你的錢放在另外一個獨立戶頭，除非你緊急把錢轉過去，否則營業員是無法動用的。如此一來，你就不會因為一時的情緒激動，而輕易把手中的子彈一下子用完。


    ### 三、在一連串勝利後，換張賭桌吧


    你在過去一段時間中愈幸運，運氣就會愈可能馬上消失無蹤。換張賭桌並不是件容易的事，尤其是在手氣一直都很順的狀況下更是如此。人類的天性會告訴你，如果在一張賭桌上贏錢的話，就該留在那裡賺更多的錢。但是你真正該做的是，拿著剛剛贏的錢，起身回到兌幣處，把多餘的錢存起來，手上仍然只留下幾百塊錢。週期性地帶著贏來的錢離桌，是你避免被賭場的優勢給拖累的唯一辦法。之後，如果你還是覺得手氣正旺，仍然有足夠的專注力，而且還想玩的話，還是換張桌子玩吧！如果你的狀況真的那麼好，換張桌子還是可以繼續贏錢的。


    這些心理上的自律法則或許不能保證你成為市場中的大贏家，但是如果沒有的話，毫無疑問的，你一定會成為一個大輸家。


    ## 第4章


    ### 穿著鱷魚皮鞋的富豪


    #### 我的分析師生涯


    一九七〇年初我刚從研究所畢業，就很清楚知道自己想要投入股票市場。我認為，有三種方式可以進入這個市場：成為一名投資銀行家、操盤手，或證券分析師。


    我很清楚，自己的個性並不適合擔任投資銀行家的工作。投資銀行家都是一些靠著創業投資、承銷股票，和一些巨額投資案賺錢的上流社會人士。但我並沒有這方面的經驗，也沒有資本，更不具備當投資銀行家的背景。那時候，我也不想成為操盤手，因為當時的操盤手只不過是中間人而已，他們從客戶那裡收到交易指令後，再把這些指令放到交易場裡。


    所以，我決定要成為證券分析師，那是當時最吸引我，也最適合我個性的工作。


    讀小學一年級時，老師問班上每個人長大後的志願，我說：「我要當偵探。」身為一個出身猶太家庭的聰明小孩，我不想成為醫生或律師，只想當偵探。


