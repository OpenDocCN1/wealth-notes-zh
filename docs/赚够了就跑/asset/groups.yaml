    # **結語**


    # 人生中最棒的交易


    擁抱你心裡真正想要的生活


    一九九一年一月二十六日，也就是沙漠風暴行動展開的十天之後，我正躺在客房裡那張病床上，發著華氏一〇一度的高燒。病毒性心包炎正在我的體內進行第三次反撲。我再一次讓自己勞累過度，使得病毒有機可乘。我確信病毒這回來勢洶洶，鐵定會讓我再度住院。我的私人看護依莎幫我洗了個酒精浴，而醫生也將我的強胰松服用劑量調高到每天四十毫克。我平常和列文都會做的紐約街頭散步，也在沙漠風暴行動開始後就中斷了。


    醫生的治療這回果然奏效，我的高燒也慢慢退，但我還是非常虛弱，我對強體松的依賴性愈來愈重，這使我感到非常害怕。每一次我想像以前一樣進場交易時，體溫就開始升高，讓我覺得好像隨時得向醫院報到似的。我的情況並沒有太大的改善，而更可怕的是我開始懷疑自己將永遠沒辦法好起來。


    我的情緒一直不穩定，哈克曼醫師也不斷試著要我降低我的藥量。我一直想要進場交易，但卻沒有辦法'
  md: '

    海珊對波斯灣及原油供應將不再造成威脅時，原油和黃金價格就會像一對過熟的椰子一樣雙雙墜落下來。我得馬上放空原油和黃金，我在椅子裡把身體前傾，拿起電話打到奇德與皮博迪公司的夜間接單部。


    「我是馬丁·舒華茲。我在你們那裡有開戶，戶名是沙伯林納合夥基金。什麼？你說找不到是什麼意思？沙……伯……林……納……沙伯林納，沙伯林納！我要放空原油和黃金！馬上幫我找一個有盤的市場，快點！」


    一會兒之後。


    「我母親婚前的名字？（譯註：用來辨別身分之用）史妮……德，狗屎！史……妮德……，史妮德，史妮德！」


    又過了一陣子。我看一下手錶，時間是下午六點四十二分。價格馬上就會飆漲上去了，我沒有時間再等，我改打電話到芝加哥期貨交易所（CBOT）去。CBOT的債券期貨在六點二十分到九點零五分之間，有一個額外的盤後交易時段。我和折扣公司、LIT期貨公司這兩家結算公司之間有交易專線，庫許和高費德接起了電話。折扣公司的庫許和LIT公司的高費德（現在我給他取了個外號叫「大夫」，以感謝當我在加護病房時他給我的建議），是我最主要的兩個債券期貨經紀商。在沙漢風暴行動展開的新聞傳到市場後，這兩個身經百戰的接單人馬上就跳上計程車，回到他們在CBOT的工作崗位上。好極了！現在我已經和我的兩個哨兵連上無線電，該是和敵人交戰的時候了！


    最近三天內，我一直感覺到債券市場一階要上漲的樣子。在每日工作表裡，我對每一筆交易都有親手寫的操盤日誌，在每一筆交易紀錄旁，寫下我的感想做為日後的參考。我在這幾週以來的筆記中不斷寫道：「注意利率可能重挫，該建立大量的多頭部位」、「計畫買進債券」、「可能是美國公債市場的主要底部」這類的話。我一直保持良好的部位，而且我開的交易帳戶讓自己可以隨時買進想要的足量契約。在日間交易時段，我已經在我認為是絕佳買點的價位區派出了前哨偵察隊，在九三·一五（意謂93%，或大約是九三·四七）買進八十口三月到期的三十年期美國政府公債期貨。如果原油和黃金價格會因為市場中的不確定性消除而下挫的話，表示其他的商品和利率也將出現下跌走勢，反之，債券的價格將要勁揚。一般而言，利率下跌則債券價格上升，反之亦然。


    血、血、血，殺！殺！殺！


    「庫許！給我一個USH的報價！」USH是一九九一年三月到期的三十年期美國政府公債期貨契約的代號。一口CBOT的美國政府三十年期公債期貨契約到期的面值是十萬美元。


