    的人，就愈需要考慮期貨交易，因為從期貨交易裡，你賺到的每一塊錢都可以少繳十八美分的稅（六○％以長期收益計×稅率二○％＝一二％；四○％以一般所得計×稅率五○％＝二○％；總計三二％，而非五○％），這對專業操盤手來說，可是不小的數目！


    如果我要在芝加哥進行期貨交易，就得找一個結算公司合作。當時紐約的經紀商都還沒有涉足期貨交易。S.L.&K.是一家在紐約有辦公室的的大型結算公司，所以我在-一九八二年三月二日正式在那裡開戶，並買了市值十二萬美元的國庫券放在帳戶中充當保證金。期貨紐約的總值通常是原始保證金的十五到二十倍，所以我存進帳戶、市值十二萬美元的國庫券，讓我能夠操作總值達一八○到二四○萬美元的期貨契約。


    如果財務槓桿是二十倍的話，期貨價格只要反向變動五％，我就會把錢輸光；而期貨價格順向變動五％，我帳戶的淨值就會增加一倍到二十四萬美元，我將因而可以操作總值四八○萬美元的期貨契約。


    更令人感興趣的是，如果用國庫券來充作保證金，在操作期貨的同時還可以享受國庫券的利息收入（免稅喔）。這真是世界上最棒的事啦！換作在股票市場，我得拿錢繳股款，這會增加我的（資金）成本，而在期貨市場中，只要我贏錢，就沒有資金成本的問題。


    ## 倒在地上喊痛，等於把先機拱手讓人


    一九八一年十一月，我的人生陷入嚴重低潮。當時，奧黛莉懷了二十週的身孕（我們的第一個孩子），但產檢時醫生發現她沒有羊水，因此很快就流失了那個孩子。我們簡直不知所措，我的祖父以前總是喜歡唱著：「如果沒有夢，哪來的美夢成真？」但祖父從來沒告訴我們，當夢想硬生生地從手中被奪走時，你會有多心痛！


    失去孩子後，我們感歎人生苦短。如果無法享受，賺那麼多錢又有什麼用？該是花些錢及時行樂的時候了。


    奧黛莉和我都喜歡位在海邊的房子，可是我們結婚以來卻一直困在一幢兩房的公寓裡。所以，該是買一幢的時候了。一九八二年一月一日，我們用手中擁有的一百二十萬美元其中三分之一，在西罕普敦買了一間海濱別墅。


    以財務的觀點而言，把這麼多資金放在這種沒生產力的資產上似乎很蠢，但在我心中一直嚮往著整個夏天都待在海邊，每天坐在游泳池邊交易的美夢（我後來發現，在游泳池邊曬整天太陽可真難受，還得圍著一條大浴巾，躲在報價螢幕的陰影下）。


    當我被擊倒時，我絕不會等著人家倒數讀秒，一定會馬上站起來。我相信「塞翁失馬，焉知非福」這句話，如果我還倒在地上喊痛，就等於失去先機。


    一九八二年四月二十一日，買下別墅的兩個月後，CME宣布開放標準普爾五百股價指數期貨契約（Standard & Poor’s 500 Stock-Index
    Futures Contracts，簡稱 S&P）的交易。這是一個米爾蘭稱為「終極契約」的新金融工具，是以五百家大型企業的股價為基礎的契約。我直覺地認為，S&P
    期貨將會是最適合我的操作工具，因為它是從股價衍生出來的工具。而我長久以來用來從事股票交易的技術，例如神奇的 T 理論、十日移動平均線、動量指標、KD 指標都可以用在這個新工具的交易上。這就好像突然間，我可以在所有的二十一點賭桌上下注一樣令人興奮。


    一九八二年四月二十九日早上，我下了第一張 S&P 期貨的交易單，買進二十口六月的期貨契約，結果輸了三七〇美元。第二天，我又試了一次，在一一七．二的價位買進四十口六月期貨契約。一口
    S&P 期貨契約的總值等於指數乘以五百，所以我所買進的六月期貨契約總值是二三四萬四千美元（45 x 500 x 117.2），但我可以不必動用這麼多資金，因為我存在期貨交易帳戶中那價值十二萬美元的國庫券，足以滿足保證金所需。這才叫作財務槓桿，乖乖——買真價貴的財務槓桿！僅僅幾個小時後，我在——七．七賣出所有的部位，賺進了一萬美元（45
    x 500 x 0.5）！


    在那年的整個春夏季裡，我不停地用 S&P 期貨做試驗。雖然我對這個契約非常有興趣，但仍舊十分小心。當任何一種新金融工具剛上市時，都很不穩定，每個人只抱著姑且一試的心態，使得交易量很不規律，而交易所也很難馬上使交易情況導入正軌。和
    CME 一樣，我把每個交易日都以半小時為單位加以分割，每半小時我就把價格的變動率畫下來。我把盤中的動能看作潮汐一般，有高有低、有漲有退、忽前忽後。如果 S&P
    指數在三個時間單位中，連續上漲○．五點、○．三點及○．一點的話，我就察覺到價格動能正在轉變，而價格的正弦曲線將要轉而向下，市場的紅燈馬上就要亮了，此時就該換檔、停車（平掉多頭倉），等到綠燈亮時，採取行動，轉頭作空。


    我在 S＆P 的市場中看到好多機會。除了迷人的財務槓桿、不需買進一堆現股就能投資五百大企業股指數這兩大好處外，S＆P也是一種絕佳的避險工具。如果我認為股市將下跌但不想賣出現股時，賣出總值相同的指數期貨契約就可以幫我規避掉大部分的风险，同時別忘了，還能節稅呢！


    另外，我也發現了另外一種交易輔助工具，那就是道瓊德勵（Dow Jones Tase，譯註：在臺灣通常稱為美聯社）的報價單機，這對我在國庫債券的交易上確實提供了不少幫助。雖然
    CBOT 提供了一個穩定的國庫債券交易市場，但真正的政府公債現貨卻沒有一個集中交易市場。公債現貨經由聯邦政府發行後，投資人只能經由經紀商從事買賣。當利率上漲或下跌時，公債現券的價格也隨之往反向波動，當某經紀商以一○○的價位叫出公債時，另一家卻可能以九八叫出同一期公債，各經紀商的出價完全根據自身的部位和籌碼而定。所以債券交易者就得和農人買賣新鮮牧草一樣，必須四處詢價以找出最好的報價。


    尼爾·赫舍（ZE·Hersh）曾經擔任肯特債券經紀商（Kenet-Begard）的營業員。他發現，公債現貨市場的玩家們一直希望能有一個提供所有公債報價的服務機構，所以就成立了德勵公司，向各家經紀商收集政府發行各種不同天期公債的最新報價，然後將這些價格立即顯示在德勵出租的單機螢幕上。所有租用德勵報價機的交易者，從此可以很有效率地掌握最新現券報價。


    自從我花了更多時間從事 AMEX 以外的交易後，就租了一部德勵單機。在我們這行中最主要的工作，就是找出市場的不均衡狀態並從中獲利，而德勵的報價機在債券期貨的交易上提供我相當的助益。此外，我本來就很喜歡這些科技產物，也總是在新玩意兒推出後買來嘗鮮。雖然我比較少在
    AMEX 場內進行交易，交易所仍然規定會員必須每天到場內亮個相。有一陣子我還是天天早上去晃一下，但是由於 AMEX 只有股票交易，在場中並沒有任何的德勵單機可以看到公債行情，所以我總是在下午三點後回到辦公室查看公債報價。公債期貨在下午三點收盤，但是現券市場則只要經紀商想交易都一直有報價，而德勵單機上的公債報價讓我得以藉由於這些盤後交易，感受第二天的行情走勢。


    ## 努力做功課，果然挖到大金礦！


    九月十日，一個星期五的下午，當我回到辦公室查看公債報價時，發現了一些有趣的事。


    「奧黛莉，來看看這個！」我說：「我發現，現貨公債和 S&P 指數間有一種互動關係耶！」


    「我正在忙，等一下。」奧黛莉回答。自從我很清楚自己想成為操盤手，奧黛莉就辭去了工作，和我並肩作戰。她幫我繪製技術圖，完成一些文書工作，傾聽我對行情的看法。過不了多久，她已經能夠分辨出我是很認真在討論一個交易機會或者只是閒話幾句。


    「不，趕快過來看一下啦！我想我可能發現了什麼。」


    奧黛莉正在做一些文書工作，並不想被打斷。我們才剛剛從市區搬到新買的海濱別墅，她還在適應當中。她很不情願地把椅子滑到剛好瞄得到德勵報價機的位置。


    「我一直把現貨公債看作是公債期貨的先行指標，」我指著報價螢幕說：「但是，股價也會因為利率波動而漲跌。」這是因為當利率上揚時，企業必須付出更多的資金，因而提高了經營成本而侵蝕獲利。高漲的利率使得消費者不願擴張信用來買東西，這會減緩企業營收而更不利於獲利，股價會因而下跌。


    「所以呢？」


    「所以如果國庫債券價格在盤後交易中上漲，代表利率在下個交易日會下跌，那 S&P 期貨就該上漲。」


    我拿起一疊技術圖，「給你看個例子，八月三十日，公債現券的價格在最後一小時下跌了〇・七五點，」我又拿出了十日移動平均線圖，「你看這裡，八月三十一日的 S&P
    指數開盤就下跌了〇・八點。但是上週公債價格上漲了〇・五點，而 S&P 第二天開盤就上漲了〇・六五點。」


    「那又怎樣？」


    「奧黛莉，這會是一個很棒的指標啊！」我感到非常興奮。「公債期貨三點就收盤了，但 S&P 期貨要到四點十五分後才收盤。如果公債現貨價格在三點到四點十五分之間上漲的話，我就可以在收盤時買進期指。如果公債現貨下跌，我就賣出期指。」


    我指著報價機的螢幕。「聽著，前幾個小時公債現券的價格已經上漲了〇・五點，如果我的推論對的話，這表示 S&P 下週一會開高。」


    奧黛莉看了一下錶，「現在已經四點十分了，你只剩下五分鐘，如果你想試，那就試試吧！」


    我走到電話旁邊，「如果公債現券在最後一小時上漲〇・五點，我可能就太遲了。我看一下 S&P 的價位……，黛比！」我打給我在 S L & K 的營業員，「我是馬丁。十二月的
    S&P 期貨現在在哪裡？……漂亮！沒有動，幫我市價買進三十口。」


    整個週末我仔細地研究線圖，試著找出公債現券在盤後交易的價格變動，和隔天的S&P期貨價格之間，到底有什麼樣的連動關係，也試著看看我其他的指標能不能提供更多的線索。結果並不算完美，但大致上，只要債券在盤後交易的價格變動很明顯，第二天S&P指數也會有類似的波動。更重要的是，這些波動都和我的主要指標：T指標、十日指數移動平均線、動量指數以及KD線等配合得很好。


    我等不及要看過一早上的開盤。奧黛莉和我起了個大早，在報價機前定。我很確定市場會開高，而事實也的確如此，開在一九一四。「這就對啦！」我馬上打電話給黛比，『全部賣掉！』


    ## 連續二十天，每天印鈔票……


    接下來幾天，公債現券在盤後交易時段都沒有明顯的波動。直到九月二十日星期一，我的公債現券指標在盤後上漲了3%。


    「奧黛莉，」我說：「機會來了，S&P指數明天會開高。」


    「開高多少？」


    「我不知道，得仔細推算一下，我認為至少會開高○・一。」


    我在四點十分拿起電話，『黛比，十二月S&P期貨在哪裡？』二三・四……好，幫我市價買進五十口。


    黛比在四點十一分回報說我成交在二二三・四五，我等於是買進了總值三○八六二五○美元（50 × 500 × 123.45）的期貨契約。不過－我不需要投入那麼多的資金，只要用我放在期貨帳戶的國庫券充作保證金就夠了。第二天，我買進的期貨契約開在二二三·六五，並且立刻又上漲了〇·七五。我又對了，並且馬上擁有七千五百美元的帳面獲利。我檢查了一下其他的指標，所有的指標都看漲。


    「我該怎麼做呢？奧黛莉，我該獲利了結，還是加碼買進？」


    「先等一下，今天已經開高，所以你有本錢多等一會。」


    十二月期指的價格一路漲到二二四·四才暫時打住。我在二二四·三獲利出場，賺了〇·八五點，相當於二二五〇美元。當天下午，公債現券的價格又在盤後交易中上漲了〇·二六。所以在四點十分，我又買進了五十口十二月S&P期指。第二天指數開高〇·七點，而我又賺了一八七五〇美元，真過癮！


    九月二十三日，公債現券在盤後交易時段下跌了〇·二八。這是該試一試反向操作策略的時候了。


    「黛比，十二月S&P在哪裡？二二三·八五？幫我賣出二十五口。」


    我看了奧黛莉一眼，她對我點了點頭。


    「不，重來，我要賣出五十口，市價賣出！」我對黛比喊道。


    第二天早上十點零一分，S&P指數開在二二三。我一開盤又賺進了一八七五〇美元。真棒，我的理論在正反兩面都有效。


    在九月剩下的交易日裡，我在市場中進進出出，一下買進五十口，一下又反手賣出五十口，利用獎勵的報價機大進大出。雖然在那段時間股價指數整體來說根本水波不興，指數在九月十三日開在一一九·四，在三十日收在一九·三五。但我卻在這段時間內賺了十六萬美元！


    一個月之內，我們的財產增加了一倍。


    那年十月股市簡直熱鬧極了。十月六日星期三，道瓊工業指數以歷史第二高的漲幅向上勁揚三七・〇七點。每一個在AM＆EX交易的人都欣喜若狂，大賺其錢。交易場內成交率滿到連地板幾乎都找不到，我更利用選擇權交易海削了一票。但是當其他人在收盤後手舞足蹈地去酒吧慶祝時，我回到辦公室看報價機。


    「奧黛莉！你看公債現券在搞什麼鬼？不知道十二月S＆P現在價位如何？」奧黛莉馬上詢問黛比。


    「瑪丁，S＆P指數漲到一二六・四五了，而公債現券價格也正在往上走。」我的情緒也隨之高昂。我們看著公債現券價格在接下來的半小時內持續走高，到三點半時已經上漲〇・三點四十五分已經上漲〇・三了，而且漲勢看來沒有要停止的樣子。我得採取行動了，因為四點時公債已經上漲〇・五了！


    「黛比！幫我市價買進十二月S＆P指數期貨一百五十口！不，買二百口！盡快向我回報成交價。這一票夠我們去拉斯維加斯好好度假了。」


    我掛了電話，「奧黛莉，如果這次也像以前一樣有效的話，我們又向前邁進一大步啦！」


    第二天早上，S＆P指數期貨開高在一二八・七，而我以平均價位一二六・五三總共買進了二百口契約（300×50×27＝217000美元）。天啊！這真是我的一項新紀錄！


    在整個十月份中，我來回炒作S＆P指數期貨。十月二十二日那天，市場謠傳聯準會直到大選前都不會調降貼現率。公債現券價格在盤後交易中重挫，而第二天S＆P期指開低一・八五點時，我手中已經持有一百五十口契約。我在開盤時以市價出場，在一分鐘內賺了三八七五〇美元。到了十月底，我已經賺了一四○萬美元。我的腿因為雀躍不止而感到痙攣。二月，我們才剛從窘境中爬了出來，而且剛剛花了四十萬美元買了我們的海濱別墅，當時我們的財產淨值只有一百二十萬美元。現在，在一個月之內，我就把它增加了一倍，在這個月中我所賺的比前半生都要多。我無法形容這種感覺。曾經連續二十天，我們每天從辦公室開車回家時都比前一天富有七萬美元。如果我還繼續當證券分析師的話，一年也不過才賺七萬美元。


    突然間，我成了一個三十七歲的一數百萬富翁，同時還擁有在未來累積更多財富的無限潛力。為什麼？只因為我找到了一個適合自己個性的金錢遊戲，而且從中培養出一套屬於自己的獲利策略。


    我是第一個發現公債現券價格和S&P指數期貨價格有運動關係的人，也是少數同時涉足股票、債券、貨幣市場的操盤手。大部分交易者都只在個別交易所操作同種類的金融工具，因此無法發現不同市場間的互動關係。我也是最早利用德勵報價機發現額外獲利機會的S&P期指交易人，真感謝德勵公司，我體現了每個賭徒的美夢——未卜先知！


    這是運氣嗎？你可能會這麼想，但這可是在我全心投入研究後所得的智慧結晶！我用所有的時間，找出一些別人看不出來的事，現在我可比約瑟要快樂多了。我有能力照顧家人，並且提供他們終生的財務保障了。


    這風聲傳到法老的宮裡，說：約瑟的弟兄們來了，法老和他的臣僕都很喜歡。


    法老對約瑟說：你吩咐你的弟兄們說，你們要這樣行，把馱子抬在牲口上，起身往迦南地去。將你們的父親和你們的眷屬都搬到我這裡來，我要把埃及地的美物賜給你們，你們也要喫這地肥美的出產。


    《聖經·創世記》第四十五章十六節


    ## ⑥ ⑦ 需要改變方向時，別猶豫


    我下定決心，但是我在兩方面都下足決心。——洋基名教練凱西·史坦格（Casey Stange）


    在交易場內，我總是無法找到所需的所有資訊。通常只有那些支付報價機器租金的報價員，才有權決定螢幕上該顯示哪些報價。「小雞」在他的螢幕上只放梅沙石油，喬伊只放德士古石油，桑坦吉羅只放迪吉多電腦，沒有一個人在他的報價螢幕上放所有我需要的報價。


    「馬丁，我在樓上的辦公室裡有報價機，」桑坦吉羅說：「只要你用用，隨時歡迎。隨你怎麼用都行。」桑坦吉羅也是一個大操盤手，在盤中總是待在樓下的交易場中忙著執部位，他雇了幾個助手在樓上，替他管理部分的資金，也做些較小的交易。當桑坦吉羅認定我是會贏錢的場內操盤手後，他覺得把我留在樓上會是一個好主意。他覺得當他在樓下做交易時，他的助手或許可以從我這兒得到一些好主意和資訊。


    我感到很滿意。每天午餐時間，當大部分人外出吃速食的時候，我就拎了個三明治到樓上辦公室裡研究線圖，並讓自己在下午開盤前調整好情緒。辦公室裡，有能提供所有資訊的報價機和一個專線電話，當我想下單的時候，可以直接打電話給營業員。


    桑坦吉羅的助手們看到我持續獲利，也開始對我友善了起來。我知道桑坦吉羅叫他們在背後監視我，但是既然可以免費用他的辦公室，而且那些小伙子人也不壞，我就待下來了。既然我下我的單，他們也管不了我，那又有什麼好計較的？在他們監視之下，反而鼓舞了我的士氣。


    在梅沙股票選擇權後，我開始操作南非金商股票（ASA）。當時通貨膨脹率完全失控，各地的金價都急速上揚，這對擅長抓時機的我是再好不過了。


    有一天，我下單給我的營業員肥麥克，叫他買進五十張五月的 ASA 買權，桑坦吉羅的助手們在旁邊偷聽。我從不過問他們在幹什麼，也不確定他們有沒有跟著我下單。當麥克回報成交後，我決定走到樓下的交易場內看看盤面情況如何。我對場內的交易員打招呼時，特別留意了一下成交紀錄，「不對勁，」我對自己說：「我得改變部位才行。」於是，我把我的多頭部位平倉並反手作空，然後走回樓上的辦公室。當我走進去時，桑坦吉羅的助手傑瑞正盯著報價螢幕，他看起來非常憂心忡忡。「天啊！馬丁，市場看起來好像不太對勁呢！」


    我看著報價機：「我知道，所以我放空啦！」


    「放空！你什麼時候放空的？你剛剛不是還作多嗎？」


    「是啊，但是剛剛我到樓下去的時候覺得不對勁，就把部位反轉過來了。」


    傑瑞的臉漲成了豬肝色。「你這個混帳！」他咆哮著，從椅子上跳了起來。他拿起辦公桌旁的球棒走向我：「我要宰了你！」他那濃濃的愛爾蘭腔顯得很尖銳。


    「傑瑞，冷靜點！」


    「你怎麼可以反轉你的部位？」他仍然一直走向我，瘋狂地揮舞著那根球棒。


    「我只是做了該做的事。」我迅速躲在椅子後面：「我得照顧家人，而我的家人中沒有愛爾蘭人啊，你明白嗎？」


    他平靜下來，把球棒放回原位後，我告訴他：「聽著，傑瑞，我之所以能賺到錢，就是因為我是一個常改變打法的打擊者。就像打棒球的時候，如果球從右邊來，我就往左邊打。如果發覺市場換邊走，我會馬上改變操作策略。」


    如果你是一個著重進出場時機的操盤手，不論作多或作空都要一樣在行。當市場的趨勢轉變時，你不能死抱著部位，然後巴望市場會回到原點。如果你對這點還沒有辦法很自然地掌握，那你能做的只有不斷地練習、練習、再練習了。


    這個建議對生手和業餘投資者並不適用，只對充滿抱負的專職操盤手有效。一般的投資人要學會買進股票就夠了，他們不必放空，也不需要對此了解太多。放空是業內高手玩的遊戲。


    ## 第 7 章


    # 太害怕虧損，就不會有贏家心態


    設定停損的知易行難


    還記得那是一九八二年的國會選舉日，奧黛莉和我坐在辦公桌前等著開盤。我們剛剛投完票，卻為自己投的票有著深深的罪惡感。我一直是最民主黨的支持者，從小，老羅斯福總統的肖像就掛在我家牆上。但自從我開始賺大錢後，就有點忘本了，這回，我投票給共和黨的候選人。


    身為紐約市的居民，我每年的收入中有五七％得拿去繳稅。對我來說，政府貪得無厭地 A 走我的錢之後，又拿這些錢幹了什麼好事？馬路上還是到處坑洞，地鐵兩旁隨處可見髒亂的鴉子，到處有人被搶，市政府員工還不停罷工。如果他們真的把錢用在刀口上，我不在意繳多點稅，但當我看到他們把稅金浪費或花在不當的地方時，我決定為自己的荷包投一票——而不是為良心投票。天啊，我愈來愈像個共和黨員了！不過當你開始賺錢賺得像我一樣多的時候，也一樣會這麼做。感謝
    S & P 指數期貨，我可真靠它賺了不少啊。

