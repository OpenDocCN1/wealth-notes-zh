  mdcn: "\n我真的必須好好賺一票才行。\n\n但首先我得去看高德醫師，他要星期一幫我拆線，想起又要再回到醫院就讓我感到痛苦。我確信一旦進了醫院，他們又會把我給留下來，然後那個痛苦的過程就會再來一遍。可是我猜錯了。\n\
