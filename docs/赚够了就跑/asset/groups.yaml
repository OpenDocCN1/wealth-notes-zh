    # 推薦序

    ## 不做强盤手，仍可做投資人

    在十八年的證券經歷中，我曾經面試過許多想要進入這一行的年輕人，先嘗試以其所學預估未來一年國內外經濟景氣或金融環境的變化，為了避免過度天馬行空，再要求：「假若你擁有一千萬的資金、不限任何金融商品，會如何進行投資組合的規畫呢？」


    - 一、產業分析師：平時工作是拜訪公司、參加法說會、各種經濟及財務資料數據整理，寫出專業的分析報告，文章應有一定水準。

    - 二、證券投資顧問：把所獲得的各種資訊，經過理性的分析，適當地向許多不同型態的投資人報告，通常口才理應不差，與投資人（客戶）的互動密切！

    - 三、操盤手及基金經理人：其性格走向需要具備「強烈的賭性」與「敢愛敢恨的決斷力」，文章及口才都不重要，但以輸贏論英雄。


    雖有三種不同屬性，真正的高手也可以融合為一體，或兼具兩種特色，因為本質是一樣的。由本書可以觀察到作者舒華茲的性格取向，非常適合成為一個操盤手。原本是擔任產業證券分析師的舒華茲，因為賭性超強，三十三歲決定轉變為操盤手，他的投資遍及各種金融商品，甚至賭馬、賭足球，一九六七年大學畢業就去歐洲賭場來一趟賭博之旅，有點像麥特·戴蒙（Matt
    Damon）演的電影《賭王之王》（Rounder），但他決定把賭場改成專長強項的指數、期貨及選擇權等領域。也因爲舒華茲的性格好賭以及愛門又敏感的特質，加上狂熱的投入，力爭一九八三年投資競賽「最佳操盤人」，他積極經營自己，才有這本書問世，讓人看到傳奇的成功過程！


    在閱讀本書時，讀者可以透過作者的眼睛接觸到美國許多一流的證券專家、技術派波浪大師，或者是套利操盤手等各種生態；不過書中最諷刺的是，作者舒華茲最後卻好像患了「股票癌」一樣，需要看「心理治療師」，甚至在看病時，還衝到洗手間打電話下單，得意地告訴醫生又賺了三百萬元！他是天生的操盤手，也的確病得不輕！


    誠如我多年來每一次對應徵者的呼籲：「人生並不是以當操盤手為證券市場的唯一成功途徑，投資是條條大路通羅馬。」如果你夠細心的話，會發現舒華茲在蘇富比拍賣會買藝術品及畫作，也許賺得更多。重點是，所有的投資商品都有共通的基本規律，例如：要有良好的基本面、配合物以稀為貴的籌碼面、與人性博弈的心理面，或能繪製成圖形的技術面……這都很重要。


    最後，我提出自己四個與舒華茲全然不同的投資哲學與大家分享：


    - 1 選擇最好的時機，搭配最好的潛力股。

    - 2 鎖定大波段成長股，不作短打及期指。

    - 3 以GODS投資策略規畫投資組合。

    - 4 尋找能卡位全球IT產業供應鏈的公司。


    投資界的巴菲特是「股神」，他與舒華茲的性格不同，重視價值投資基本分析！不以內線操作為主的巴菲特，是一位生活單純、空間下來與朋友打打橋牌的老先生，他猶如圓轉如意的武當張三豐；而穿著亞曼尼西裝、BAIY鱷魚皮鞋，囂張走進芝加哥商品交易所，心想「我是此地主宰」的舒華茲，則好像是金庸筆下四處找人比劍的獨孤求敗。誰會贏呢？


    在「華山論劍」的世間股林高手眾多，有一句話：「長江後浪推前浪，後浪死在沙灘上！」除非您也如作者「賺夠了就跑」，在急流中因為身體健康亮紅燈的頓悟而退休，否則美好的仗，永遠打不完！更何況，我深信「投資是可以一生耕耘的事業」，又何必急於立刻「結帳」，不做操盤手，仍可以做投資人！


    本文作者為萬寶投顧董事長。


    # 推薦序

    ## 彼可取而代之

    高子鈞


    在交易的領域中，看準行情買進或賣出的單邊交易，通常是操盤者入門的第一個策略。雖然在交易的範疇裡也包括了套利、價差等其他較為複雜卻較低風險的策略，但無論哪一種交易策略，交易者都應先具備的基本條件就是要能克服人性的弱點，而這方面特質的學習，可以藉由多涉獵市場上知名操盤人撰寫的心路歷程得到很大的助益。


    國外有許多與交易有關的書籍，但在譯成中文時卻很少淺顯易懂，主要原因在於翻譯者沒有交易的實務經驗，因此無法深刻體會原作者之精髓，在遣詞用字上也常與實務上使用的名詞有所不同。因此，若這類作品能由有多年實務交易經驗者翻譯，將能讓讀者受益良多。


    《賺夠了就跑》這本書，我在幾年前就曾仔細閱讀過，該書譯者鄧詩珩本身就是一位市場上有名的交易者，因此能將原作者在交易過程的想法與做法，以及承受的壓力充分表露無遺。對於一個剛踏入交易領域的人，或是希望在交易領域中有所突破的人，都能有打通任督二脈的效果。


    很多人以為，要成為市場上成功的操盤手，第一件事就是要找到一個每次都對的神奇指標。事實上並不是這樣。第一件事，應該是先學習前人的經驗，將人性的弱點完全克服，而《賺夠了就跑》這本書，就是能提供讀者這方面經驗的寶典。


    我極力推薦所有有志於擊敗市場的交易者應先熟讀這本書，充分學習書中作者想表達的精神後再開發交易策略，將會有事半功倍的效果。


    秦始皇南巡，饒仗萬千，威風凜凜。少年時的項羽，面對橫掃六國、四方臣服的秦始皇，不是被懾服，而是遙指秦始皇說：「彼可取而代之之。」所有希望擊敗市場的交易者在看過本書之後，能否在充分學習前人的優點、摒棄人性的弱點後，也有此等氣概能大聲喊出「彼可取而代之之」！


    本文作者為期貨高手、知名專欄作家。


    # 推薦序

    ## 操作心法，萬變不離其宗

    張松允


    在股票及期貨市場來回打轉了十多年，很多人都問我，一個成功的操作家究竟應該具有什麼樣的特質？其實說穿了很簡單，就是必須具有正確的操盤觀念，堅持「紀律」，並且搭配最嚴格的資金控管，每一次出擊，都要把自己當作是帶兵打仗的主帥一般，不只是想著打勝仗而已，還要能在眾兵圍城的困境中逆轉戰局。


    第一次看到這本書的書名《賺夠了就跑》，讓我直呼絕妙好名！雖然我過去並不熟稔作者舒華茲的故事，可是當我不斷深入書中，細讀他點點滴滴所累積的操作哲學，一窺其操作世界之後，心中一陣與我心有戚戚焉的感動油然而生，果然英雄所見略同！投資操作的技巧或許也是千變萬化，可是在操作的世界裡，最重要的心法，卻是萬變不離其宗。


    亚当·斯密（Adam Smith）在《金錢遊戲》（The Money Game）中曾形容：「市場就像是一個漂亮的女人——無限迷人、無限複雜、總是不停改變，也總是那麼神祕。」正所謂窈窕淑女君子好逑，想贏得佳人芳心，的確需要一些耐心與努力，想要累積財富，當然也必須擁有正確的投資策略與心法，經過一次又一次的磨練之後，才能享受成功的果實。


    「賺夠了就跑」，乍聽之下好像鼓勵大家「短線交易」？其實不然，它的箇中真諦是要投資人不要過分貪婪，掌握獲利契機罷了。君子愛財，取之有道，進入股票或期貨市場，最重要的就是為了累積財富。大家們心自問，投資的最終目的究竟是為了什麼？我想九九％的人都是想要大贏一場，抱走現金，可是在追求財富的過程中，人類潛在的欲望與貪婪往往會不斷被誘發出來，買了股票、期貨或選擇權，總想要它漲個一倍、二倍甚至十倍。欲望的無限蔓延，造成投資人愈追愈高，身陷危機而不自知，看著股價或指數上上下下，從賺錢變虧錢，最後淪為紙上富貴一場。


    投資操作在某種程度上與在賭城拉斯維加斯擲骰子有異曲同工之妙，同時也是整個投資操作哲學的小縮影。的確，也許沒有人能持續地在拉斯維加斯贏錢，但一個成功的操盤手，必須能在賭桌上廝殺並遵守操作紀律，在一定的小時間裡贏錢，而且還要能控制虧損，賺夠了就跑，如此才能一回都樂在其中，累積自己的個人財富。


    舒華茲和我一樣，認為做好資金控管、設好停損、承認錯誤，是整個投資操作的最高指導原則。因為天有不測風雲，人有旦夕禍福，市場無時無刻都充滿著無法預知的變數，如何面對不可預知的不確定性因子，往往是決定優勝劣敗的重要關鍵。正因如此，「資金控管」就顯得非常重要，很多投資人為什麼容易陣亡，大都是因為希望能一夜致富，而忽略了資金控管的重要性，一旦市場出現重大利空的時候，因為已經沒有餘力，就只能眼睜睜看著部位一一再虧損，更別說要反敗為勝。可是若能充分做好資金控管，手上還有子彈，即使有天大的利空發生，還能有餘力趁機進場布局，反敗為勝。在股市最令人愉悅的事，莫過高檔有股可賣、低檔有錢可買。


    海軍陸戰隊出身的舒華茲，也將其在軍隊時所受的嚴格訓練，融入操盤心法當中。在遭遇敵人攻擊的時候，絕對不要只是站著不動，要不就前進，要不就後退；同樣的，投資操作也是如此，結束一連串虧損的最好方法就是馬上停損，並且把自尊心完全排除。如果操作錯誤、不執行停損的話，多數投資人的下場就會像鱷魚的囊中物，唯有斷尾求生才有一線生機。所以想賺錢，先要學會停損，這就是投資市場中所謂「鱷魚法則」（Alligator
    Rule）的精髓。


    成功絕對不是偶然的，舒華茲在成為成功的專業交易員之前，曾經有長達十年的時間在市場中載浮載沉，我自己本身也有多次極為驚險的投資經驗，面對投資市場的驚濤駭浪，要如何化險為夷，化危機為轉機？除了閱讀這些成功的故事外，各位不妨將這些成功者的投資經驗轉化為自己的操作策略，再透過一次又一次的市場試煉，建立適合自己的投資策略與心法，如此一定能掌握成功契機，創造屬於自己的億元人生。


    本文作者為知名期貨高手。


    # 譯者序

    ## 有為者亦若是

    鄧詩珩


    我和作者有著一些相似的背景。我們都是學院派出身，擔任過研究分析的工作，最後再踏進專業操盤手的領域。我們都曾經以基本面做為操作基礎，但最後也都回歸技術面，成為反應迅速的「技術派」操盤手。以專業操盤手的眼光來看，本書真是道盡了我們生活中的一點一滴。


    專業操盤手的生活，是充滿壓力和痛苦的，但是其中所能夠產生的財務回報卻也最大，尤其以衍生性金融商品為主的操盤手更是如此。而更重要的是，你的心理狀況和判斷力也因為賺錢（快樂）和賠錢（痛苦）而上下起伏。有趣的是，過於樂觀或過於悲觀的心理狀況，對於你的判斷力都有極負面的影響。唯有理性的投機客，才能控制風險、賺多賠少，否則便流於濫賭，下場只有虧損累累、黯然出場了。


    因此，專業操盤手的第一要務，就是要了解自已，控制自已的情緒，訓練堅強的意志。坊間關於基本或技術分析的書籍汗牛充棟，但深入探討操作心態的書籍屈指可數。而本書，就是需要訓練操作心態者案頭不可少的精神食糧。


    許多操盤手，從專業交易員到散戶投資人，都在尋找能夠讓他們一歩登天的『武功祕笈』。而若要以此為喻，本書可算是一『心法』，而非一『劍譜一』。事實上，對於基本分析和技术分析學有專精的人不在少數，但是能夠成為像作者這種一冠軍操盤人一的卻寥寥無幾。這證明成功的金融操作，絕不僅是機械性的技術指標，或者對財務報表深入研究就足以達成。操盤手的觀念和心態才是左右勝敗的關鍵。


    本書以輕鬆的語法，藉著作者自己的故事，將操盤手所面臨的問題完全揭露，使讀者由非教條式的法門，得以一窺超級操盤人成功的奧祕。作者舒華茲，跟彼得·林區及華倫·巴菲特這些偉大的基金操盤人最大的不同之處，除了舒華茲是一名以技術分析爲主的操盤手之外，他以操作自有資金起家的傳奇故事更是發人深省。舒華茲從一名小小的證券分析師，以不到十萬美元的資金，成為每年可以賺進六、七百萬美元的操盤手，爲像我這樣的操盤手立下了不朽的典範。如果您也有心想跨入這個領域，達到舒華茲那種境界的話，本書無疑是您必讀的指南。


    毫無疑問的，舒華茲是一名技術派的高手，但是他也同樣將基本分析做爲一項決策參考的依據，只不過最後的決策底線仍然 是以技術面爲主。如果你是一名以基本·面爲主的操盤手，本書或許可以成爲你觀摩技術派操盤手心法的文獻。如果您是一名技術派操盤手，那麼本書的內容將可以幫助你重新了解在技術指標之外，操作心態對一名成功操盤手是多麼重要的一件事。如果你是一名業餘投資人或是普羅大眾，本書對於專業操盤手生涯的生動介紹，可以使你更加了
    解這個在過去對你來說可能相當陌生的神祕世界。如果你是一名專業操盤手，本書深具臨場感的第一人稱語法，將使你深入了解超級操盤整人的成功祕訣，在你尋求不斷自我成長的路程中，發揮醍醐灌頂之效。


    在翻譯本書的過程中，令我產生深深的感觸，除了在作者輕鬆的語調中深解其中義趣，並以數年以來的實戰經驗印證學習之外，更產生「有為者亦若是」的強烈想法。在金融操作的領域中投入了這些，我從成功者身上學到不少，但從失敗者身上學到更多。本書中值得我和諸位共同分享和體會的觀念實在太多，留待各位細讀之後自當分曉，小弟在此不敢贅言。


    我的操作標的多年來包括外匯、股權、債券和利率衍生性商品交易。翻譯這本書之後，我深深體會到，不論是什麼樣的金融商品，交易的心法和本質是不變的。深入揣摩成功者的正確心態和做法，是邁向自我提升的最佳途徑。每次隨手拿起的書翻譯，我總有新一層的體會。希望各位讀者也能有相同體驗，在金融操作的領域中一路順風。


    # 賺夠了就跑


    # 第1章

    ## 師父引進門

    ### 踏上華爾街交易大廳現場


    三元買進十張，三元買進十張，三元買進十張。「這句話好像咒語般，在我心裡一遍又一遍重述。如果梅沙石油股價到了3%的話，我準備要在市場上以每張三百元的價格，買進十張十月到期、履約價為65元的買權。這將是我在美國證券交易所(American
    Stock Exchange, AMEX)場內的第一筆交易。我心裡怕得要命，擔心搞砸了。


    穿上藍色制服，我是正式會員了……


    那是一九七九年八月十三日星期一的早晨。三一 大道(Trib Place)上擠滿了穿著西裝、準備上班的人。紐約的金融市場正要開始另一個嶄新的一天。我站在門牌號碼八十六號的入口前，深深吸了一口氣，拿出我的徽章，第一次走進了那扇寫著「會員專用」的門。警衛看了一下我的徽章，上面寫著「馬丁·舒華茲公司，935號」，對我點了點頭、道了聲早安，就讓我進去了。


    我走下階梯到衣帽間，會員都在櫃檯前面排隊，拿著他們的運動夾克向櫃檯換成美國證券交易所的藍色制服。由於這是我第一天報到，還沒有自己的藍色制服，只好向服務員喬伊·迪(Joy
    Dee)自我介紹，告知我的會員號碼，才領了一件。我穿上制服、別起徽章，確定自己帶了筆。其他人都換上皺紋橡膠底鞋，把原來穿的皮鞋放在靠牆的方型小櫃子中。我找不到座位，決定等一會兒再換鞋。有沒有皺紋橡膠底鞋可穿，是我此刻最擔心的事。


    我走上樓到大廳等待開盤。美國證券交易所的會員大廳，比起哈佛或耶魯大學的學生俱樂部大不相同。廳裡充滿了香菸（而不是菸斗）散發的濃濃煙霧；家具用的是假皮，而非高貴的真皮；會員大部分是愛爾蘭人、義大利人和猶太人，而不是益格魯撒克遜系的白人新教徒（Vogessen，就算有，也都不像是讀過什麼好學校的人。這些傢伙都是金融界的二流人物，场外證券市場(Curbs)的譯註：指的是由一群非法交易者，於一九〇一年間在紐約證券所外形成的非正式市場）交易者的衣鉢傳人。


    我泡了一小杯茶，走進交易場內。早晨的陽光從遠處一面牆上無數的窗戶中流瀉進來。這真是一個占地寬廣的房間，大約有一座足球場的四分之三，足足有五層樓高，設計得好像一座室內的跳蚤市場。場中的幾名作價員(Spotter)，一個暱稱是「小雞」(Chick)，另外兩個是法蘭尼．桑坦吉羅（Francie
    Santangiro）和唐尼（Dormie），通通坐在馬蹄形交易圈內的高腳凳上，翻著手中的客戶交易指令。在交易場中有許多不同的交易圈，以供各種股票以及不同到期日、履約價的選擇權交易使用。一般操盤手或經紀商也在四處遊走，手裡拿著筆和紙，準備要在開盤後進場買賣。


    在交易場三面牆的上方，一層層階梯式的小隔間裡坐著各個經紀商的場內代表，他們檢查著自己的電話，並指揮場內的跑單員。在比較接近交易場那一區裡，有不少參觀者正等著登記進入訪客區。場中有一些巨大的羅馬式石柱，上面刻著一隻牛和一隻熊，相互對立。而在高處，有一個順著牆面而造、大型的走馬燈報價螢幕，閃爍著股票價格，上方則播放道瓊提供的即時市場新聞。雖然還沒有開盤，但場內所有人的眼睛都開始四處張望，找尋市場報價或任何能讓自己占到一點優勢的資訊。


    你要嚇成交，要嚇滾一邊去！


    十一點一到，開盤的鐘聲讓每一個人都動了起來，好似賽馬群衝出起跑線般，而我现在也身在其中了。


    我目不轉睛地看著遠處梅沙選擇權的交易圈旁，有一小群交易員吵鬧地圍著作價員「小雞」。所謂作價員，就是在股票或選擇權交易所中，負責維持市場交易活絡順暢的人；「小雞」則是負責梅沙選擇權作價員的綽號。


    「小雞！」一個拿著客戶委託單的美林證券經紀商，從擁擠的人群中叫著他，「現在十月到期、65元的梅沙買權價錢多少？」

