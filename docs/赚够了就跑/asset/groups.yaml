    # | 第9章 |


    # 保護自己，避免提早陣亡


    什麼事都可能發生的期貨市場


    「所以，舒華茲先生，如果我們批准了您的申請，您計畫採用什麼方式來付每月的管理費？」說這話的人，是公園大道大廈住宅管理委員會的主席。


    「每月的管理費？他到底在說什麼？我們正打算砸下三百萬美元的現金來購買一個位於七樓、有十二個房間的公寓，而現在這傢伙竟然想知道我們是否負擔得起每個月管理費？」


    「您從事商品期貨交易的工作，」「這傢伙繼續發表高論：「那不就像賭博一樣？我們只是想確定這裡所有的屋主財務狀況夠穩定，我們不想到時候得要您搬出去。」「


    我望著奧黛莉。她臉上憂心忡忡的表情，就像看著我去玩高空彈跳時一樣。


    我深深吸了一口氣，然後說：「從我的申請表裡，你可以看出我在過去五年來每年都維持七位數的收入，而我們的淨值目前是九百萬美元，我一點也不覺得在未來會出什麼差錯。」「'
  - '[PAGE 171]


    「不過，什麼事都可能發生啊！市場是非常難以捉摸的。」天啊！我真討厭這種悲觀論者，他們都是標準的輸家。「這樣吧，」我說：「如果會發生什麼事的話，我想你只好要求我們搬走。畢竟，你做得該做的事嘛！」


    那是一九八四年十一月，我們坐在那個主席家的客廳裡，在座的還有住戶委員會另兩位資深委員。這三個老傢伙是新住戶資格審查委員，如果沒有他們的批准，誰也別想搬進這幢大樓。他們在深度鏡片後面眯著眼看，像老船長挑選水手一樣地打量著。如果我們被接受的話，奧黛莉和我就會是這幢大廈裡最年輕的住戶。


    # 享受辛苦工作的甜美果實


    奧黛莉那時已經懷了三個月的身孕，那是我們的第二個孩子，也是為什麼我們決定搬家。


    老實說，把三百萬美元的現金──相當於所有資金的三分之一──用在買這幢公寓上，不是太'
  - '[PAGE 172]


    聰明的財務決策。但話說回來，這也不是我們第一次幹這種事了。在過去的兩年中，我常常對自己說：「哎呀！我怎麼會把三分之一的資金用來買那種海濱別墅？如果我把這些錢拿去投資基金，現在就增值到一百萬美元以上了。


    這是一個許多操盤手常會掉進去的陷阱：大部分風雲人物型的操盤手在真正到達事業頂峰前，很少有機會嘗到辛苦工作後的甜美果實。而且在大多數的例子中，他們根本從來都沒有機會享受交易的成果。對他們而言，賺錢本身就是最大的回報了，因為在他們的心目中，金錢就代表了力量，而這種力量是滿足自尊心的唯一方法。


    但我的權利可一點興趣都沒有，我只想在一路向上攀升之時，同時享受我努力的成果，所以一點也不介意花大錢。我想，這有什麼大不了的？我在 S & P 期貨交易中找到了我的印鈔機，而且我印鈔的速度愈來愈快。當有一天你拿著自己親手賺來的錢，大把大把消費時，就會知道那感覺有多棒。老實說，我一點也不介意讓別人知道我的確賺了很多錢。


    一九八五年四月四日那個星期四早晨，是我們預定搬家的日子。排在那天搬，是因為第二天是復活節假日，市場都停止交易，我可以利用這個機會把新家整理好，以便在下週一就可以用來做交易。但沒想到，公寓的原住戶通知我，搬家人沒來，希望我能延一天再搬進去。


    我是那種在和別人簽了契約後就言出必行的人，不過顯然不是每個人都如此。我們雇的搬家工人帶著家具，呆坐在公寓大樓外，我能怎樣？我簡直氣壞了，他們一天沒搬走，我們就一天沒辦法搬進新家，而我也沒辦法在下週一開盤前把辦公室準備好，而且還得聯絡電話公司和報價系統公司'
  - '[PAGE 173]


    的工程人員重新安排架線裝機的時間。照這樣看來，我下週末能開始在新辦公室工作就該偷笑了。


    幸好，我本來就不打算在那段期間做太多的交易。經驗告訴我：不要在老婆生產前一個月到後兩個月之內做太多交易。當老婆的荷爾蒙發生重大變化的時候，你得把自己保持在最佳狀況。如果你是一個好丈夫，不會在那種節骨眼，還在晚上回家後研究圖表和技术指標。在她生產前一個月，你得陪著她去上拉梅茲無痛分娩課程，學著在生產時要面對的種種狀況。在她生產後的兩個月內，孩子變成你生活的重心，日常的生活規律都因此不正常。你沒有時間吃晚餐，沒有辦法睡得好，什麼事都沒辦法做。一個晚上要起床一至四次，你也搞不清楚有沒有把尿布穿反了。你總是感到疲倦，同時也無法集中意志思考。我們的女兒是在一九八三年六月七日出生的，而我在五至七這三個月份中，總共輸了十五萬美元。


    現在，不但第二個孩子即將出生，我們還正為了搬家的事忙得天昏地暗，亂成一團。但我们終於還是在星期五的下午搬了進去，奧黛莉已經懷了八個月身孕，但整個週末她還是馬不停蹄地打開紙箱、挪動家具、發號施令，試著在小傢伙誕生前把家整理好。


    我漸漸開始感覺到，這個房子可真要花掉我一大筆錢才能搞定。不過我並不擔心，只要一切安排妥當，讓我可以重新開始交易，我確信可以從 S & P 指數期貨這棵搖錢樹上，賺到我的新廚房、新浴室、新窗戶，還有每個月都得付的管理費。'
  - '[PAGE 174]


    有人找我打架，結果原來是要我去芝加哥做期貨


    有一個老掉牙的笑話說：「某天有人找我打架，結果原來他是要我去芝加哥做期貨。」芝加哥基本上仍然是草莽氣息很重的地方，CME 的交易規則也不像賽拳規則那樣明確，交易場內的那些傢伙更不是什麼善男信女。作風強硬和人脈良好，比為人誠懇和名校學歷更重要。


    此外 CME 也不是局外人玩得了的。如果你不是圈內人，常常就得付出代價。在紐約，如果你是金主，就自己進行交易；而如果你是經紀商，就替客戶下單然後賺取佣金，這是紐約的遊戲規則。但是芝加哥可就完全不是這麼回事了，芝加哥的交易所允許一種名為「雙重交易」（Duality）的行為，所以一個經紀商可以同時扮演金主和經紀人的角色。就因為他們可以同時擁有自己的帳戶，並接受客戶的下单委託，其中就造成了嚴重的利益衝突，並且使得一種名為「偷跑」（Front
    Running）的交易手法大行其道。


    所謂偷跑，就是經紀商偷偷把自己的交易指令，比委託客戶的指令更優先執行，通常他們會找一個自己人站在身旁作為內應，在確定客戶的委託指令排在自已的指令後時，從旁接應圖利。最簡單的例子，就是當經紀商從客戶那裡接到一個買進十口
    S & P 期貨的委託後，那個內應馬上就會在同樣價位喊價買十口，只要買到了，馬上可以用同價位賣給接到委託的經紀商，最糟的狀況下，那個內應也可以損益兩平。可是如果在他買到後價位往上涨，則他馬上就有一筆無風險的獲利，而客戶則會收到經紀商最常給的「未成交」（Noting-does
    ND）交易回報——這時那個內應想必已經'
  - '[PAGE 175]


    和同謀在分錢了。（譯註：此經紀商是指「場內」經紀商，而非仲介經紀商。）

    所以，你常常會在下了單後，明明看到價位被觸及好幾次，但是那份蓋著大大的「未成交」的交易回報還是會到你手上。長此以往，大把的鈔票就進了那些傢伙的口袋，直到你換掉經紀商為止。如果你的經紀商有點良心的話，可能會回報部分成交，這起碼表示他還有幫你盡點力。

    你或許以為，場內經紀人一定會使出全力幫你執行交易指令，因為他們應該是靠執行交易來賺取佣金才對，但其實他們以偷跑的方式賺到的錢，可比幫你執行交易所拿到的佣金多太多了。在紐約，偷跑是很罕見的行爲，但在芝加哥，這種行爲簡直已經發展成為一門藝術了。

    在CME剛推出S&P期指的頭三年裡，價格波動並不像現在那樣迅速，而我總喜歡使用一種我稱之為「手風琴」式的操作策略。當我認爲市場價格已經接近我的買點時，我會放一個五十口的買單，分成十筆，以每筆間隔的方式，試圖在市場探底時在不同價位逐步建立部位，而不是把所有的量數都放在同一價位上。如果在多頭部位建立後，市場果如我所料的上漲，我就會設定一個合理的目標價位，並且也以分批分價的方式獲利了結，試著讓市場的最高價恰好只高過最後一筆賣單一點點而已。我甚至可能在獲利價附近用同樣的方式漸近放空期指，然後在低檔再以同樣方式獲利了結，並一再重複使用相同的方法進行交易。如果指標正確的說，我都會使用同樣的分批分價方式從事交易，分批分價式的操作手法是可行的賺錢妙方，而且如果我的核心部位方向正確的說，它的操作風險是非常低的。'
  - '[PAGE 176]


    狗屎！站在我背後的是你小舅子！


    我曾經和一個名叫東尼(Tony)的經紀人合作，他有個叫桑尼(Sunny)的小舅子，是東尼身邊的內應。在我們合作不久後，我就開始懷疑當我使用分批分價交易時，桑尼總會在我之前搶先建立部位。我盯著報價螢幕，看到我設定的買價成交了好幾次，但是東尼卻一直沒有打電話回來做成交割。


    這種情況不斷發生，我開始奇怪為什麼我下的單總是最後才成交。我並不是菜鳥，我在AMEX交易場內做過好幾年交易，但是在AMEX做交易和芝加哥比起來，就好比玩寶果一樣單純。在CME場內，並沒有像「小雞」那樣的作價者創造市場價格，所以在CME你根本沒辦法確定交易指令是否按照秩序在執行。


    場內經紀人的偷跑行為為，只是你想在CME賺錢所必須面臨的障礙之一。在CME，所有的交易都透過公開喊價的方式完成的，場內操盤手都會喊出他們的買賣價，並利用手勢來進行交易。這種交易方式造成許多糾紛，特別是在市場變動非常劇烈的時候。「藍尼，我們不是已經成交了嗎？」「沒有啊，我剛剛是和你身後的那位老兄成交耶！」「狗屎！站在我背後的是你小舅子。」


    交易所的會員就因為如上的糾紛和衝突不斷，各種醜陋和不規矩的行為時有所聞，但這是你在這裡做生意一定得付的成本，如果不小心的防範，那些傢伙可真會找機會狠狠咬你一口。


    在CME還設有交易場內委員會，成員通常是由那些交易所內的大人物擔任，並藉由委員會來'
  - '[PAGE 177]


    制裁不法的行爲。可是很不幸的，這就好像讓球員兼裁判一樣荒謬。


    有一天，我認爲市場即將見頂，所以打電話給經紀商叫他幫我放空，「在〇．五幫我賣出十口」，我看著報價螢幕顯示著〇．五五成交、〇．五五成交，表示市場已經至少在〇．五五成交了兩次，但是我卻一直沒有得到成交回報。然後，就如同我的指標告訴我旳，市場價格開始下滑，〇．四、〇．三、〇．二……。我那十口空單是怎麼搞的，爲什麼沒有成交？不能在最好的價錢成交是一回事，可是一口也沒成交就太離譜了！何況，市場價格已經跑掉了。


    足足有十分鐘，對我來說就像一輩子那麼久，沒有人能告訴我到底委託指令成交了沒有。我對著電話那端的經紀人瘋狂地大吼大叫，因爲市場已經跑了那麼遠，而我竟然還沒辦法知道我的部位到底怎麼樣。最後，我的場內經紀人告訴我那兩個在〇．五五價位的成交已經被「取消」，而且我放在〇．五價位的委託單也沒有成交。


    我打電話給CME的法務部門，告訴他們我受夠了被他們惡搞，並且要求這件事列入紀錄。他們說會調查，不過可想而知，我並不是他們那個圈子裡的人，當然石沉大海。


    從事交易這三年，我了解到CME是個自成一格的獨立世界，而我也開始接受一個事實，那就是除了賺錢養活自己的家庭外，我還真幫助了很多芝加哥家庭呢！除非我搬到芝加哥，並且親自到CME交易場內做交易，否則對我所面臨的狀況可是一點辦法也沒有，還是得在交易時承擔相當的交易差價。這種交易差價，就是你在芝加哥做生意得付出的代價。'
  - '[PAGE 178]


    # 第一年，就成了期貨交易場的大玩家


    為了要在CME從事交易，我還得找一家結算公司。一直以來，想要找一家理想的結算公司就不是一件容易的事。在期貨市場裡，所有的交易都是以市價評估的方式處理，也就是說在每一天收盤後，結算公司將當天所有的交易都傳送到交易所的中央結算所進行結算，並將所有的帳戶都以現金基礎加以結算。如果你產生虧損，帳戶就會被扣帳；如果你今天有獲利，則帳戶中就有進帳。不同於股票交易的是，你是否還持有部位並不會造成任何差異，因為每天每個帳戶都是以現金基礎結算，到了次日，所有的帳戶損益狀況都將歸零，依該營業日當天的損益再做市場評估，然後結算。這種現金結算的功能，也是S
    & P指數期貨之所以能夠推出的主因。試想，如果沒有現金結算制度，我們怎麼可能在期貨到期時，拿一個S & P指數的股票組合進行實物交割，那可不是一個包含了五百檔股票的投資組合呢！


    黨比在SL & K這家結算公司真的做得很好，也幫了我很多忙，但是SL & K的佣金收費實在太高了。在我從事期貨交易的第一年裡，我已經成為S & P期指交易場內的大玩家。我總共成交了二萬五千口的來回交易（round
    turn），一趟進出稱為一個round turn），這是當年S & P期指年成交量的○.五％，一個十分驚人的數字。我就是靠著在市場裡不停進出操作而獲利，SL
    & K收我每個來回二十五美元的佣金，一年下來總額超過六十萬美元，相當於我從S & P期指交易獲利的二○％。第一年過後，我向他們要求更優惠的費率，但是SL &
    K不答應轉換成別人願意提供給我的'
  - '[PAGE 179]


    低費率，所以我只好換個結算公司。


    事實上，在場內交易商的成交差價和經紀商的高額佣金之下，我仍然能夠淨賺三百萬美元，正代表了我的交易方法有多麼好。S&P期指是最我擅長的遊戲，芝加哥也成了我不得不交易的地方。我在
    一九八三年拿下一席指數選擇權交易會員(Lite Options Market, IOM)資格。對一般的操盤手，CME在每一筆成交後都收取一美元的規費，而一個交易會員席位的收費是五萬三千美元，這對交易量龐大的操盤手而言真是划得來，因為以每筆交易收一元計算，我一年就能把會費賺回來。不過就算具有交易會員的資格，我還是要找一家結算公司來結算我的交易。


    # 一個在期貨市場播種的農夫


    有一些小型的結算公司經常打電話給我，想跟我做點生意。基本上，你只要在交易所買下一個交易會員資格，弄幾支電話，再籌足一些營運資金就可以開一家結算公司。所以許多CME裡的小操盤手都乾脆自己開結算公司。藉著這個方法，他們就可以省下自己交易時的手續費，同時還可以從別人的交易中賺上一票。我卻喜歡把我的錢放在一家大型、資本雄厚，並且設在紐約的結算公司裡，而且這家公司愈少涉足期貨市場愈好。對那些不懂期貨的大型結算公司而言，期貨只不過是西部農夫在搞的玩意兒。而我正是一名農夫，一名正打算在芝加哥期貨市場開始播種的農夫。


    一九八四年三月，我接到黛比打來的電話。她已經回到她的老家芝加哥，並在當地一家小型債'
  - '[PAGE 180]


    券操盤手馬庫錫（Marcus）兄弟所成立的結算公司工作。這家公司的名字做拉薩爾（Entre Lassalle Street），之所以取名叫拉薩爾，大概和芝加哥最重要的金融區地標拉薩爾街有關，而這條街就是以上七世紀法國籍的開拓者拉薩爾（Savol
    de La Salle）命名的。他靠著奪取原住民的動物毛皮，建立了芝加哥的交易典範。


    拉薩爾公司同時擁有CBOT和CME的交易會員資格。黛比和馬庫錫兄弟認識也有相當長的一段時間，她告訴我，這家公司的人都是好人，絕對不會占便宜。所以我和總裁傑克．馬庫錫談了一下，他告訴我如果把單子下到拉薩爾的話，他們就指定黛比為我的專賣場內接單員，而且每一趟來回交易只收七．五美元。這可是我在芝加哥所知道最好的價錢了，更何況我和黛比這些年來合作愉快，也清楚她的人品和能力，更無法抗拒這麼有吸引力的費率。


    雖然芝加哥那些傢伙在華盛頓頗有影響力，但是期貨交易的主管機關商品期貨交易管理委員會（Commodity Futures Trading Commission,
    CFTC）很清楚芝加哥那種草莽氣息。在該委員會批准期貨交易可以採用現金結算而不一定要實物交割後，他們很擔心投資人會被結算公司給坑殺了。大部分規模的結算公司都以有限的資金設立，肩負著保證期貨市場財務穩定的重責大任。CFTC要求每個投資者存入履約保證金來保證帳戶資金充足。這種履約保證金分成兩大部分，其中一種是用來結算實際交易的現金帳戶。這種帳戶不受法令規範，這表示雖然帳戶中的現金屬於客戶，但是結算公司卻有權動用。


    結算公司對於「筆資金最好的投資方式，就是從事『附買回交易』（Repurchase Agreements.'
  - '[PAGE 181]


    ago）。所謂附買回交易就是一個投資者藉著買進證券，並事先約定在未來到期時，借錢的一方將以較高價格買回該證券的方式進行投資。許多銀行和存貸款機構都利用附買回交易，來配合美國聯合會的存款準備金和相關規定。這些附買回交易都非常短期，通常是隔夜的交易行為，但它們倒是為結算公司提供了另一個賺錢的管道。


    第二種型態是「履約保證金」（regulation account），這就屬於主管機關所管轄的範圍。這種帳戶是以在結算所裡存入證券的方式存在，一旦現金帳戶的資金不足以結算當天收盤後的帳戶損益，或客戶保證金不足時，結算所就有權動用這個帳戶。在這個法令管制下，帳戶內通常都以短期國庫券為主，所以穩定性相對較高。此帳戶可算是期貨市場的救生艇，如果市場發生嚴重財務危機，帳戶中的國庫券就提供了各種款項的支付保證，而且根據
    CFTC 的規定，芝加哥的傢伙可沒有辦法動用這些帳戶裡的任何一毛錢。只有在客戶沒有按時支付追繳保證金時，結算公司才可以動用這個帳戶。


    除了較低的稅賦和較高的財務槓桿外，履約保證金是期貨交易更吸引我的另一個重要因素。我是一個一直保持獲利的贏家，所以從來都不必在現金帳戶中放一毛錢，而根據我和拉薩爾公司達成的協議，我可以和他們協商存在法令管制帳戶中的最低金額。以我的個案為例，我只要存一百二十萬美元的國庫券在帳戶中，更棒的是，我還可以從這些國庫券上面賺取利息。如果我操作的是股票，就得付錢支付價款，因而產生了資金成本負擔。但是在期貨市場裡，只要我保持獲利，就一點也不用擔心資金成本的問題。對我來說，這可算是一個雙贏的結果：我一方面從充作保證金的國庫券中'
