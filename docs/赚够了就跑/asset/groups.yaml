    # | 附錄 2 |


    操盤手的一天


    你想過這樣的生活嗎？


    > 打棒球有九○％靠心理戰，其他則屬物理現象。


    ——尤奇·貝拉（Yogi Berra）


    6:45 AM


    鬧鐘響起，我不情不願地起床。小時候，我一天能夠睡上十二個鐘頭。現在，能睡八個鐘頭就要偷笑了。若睡不滿八個鐘頭，我會覺得根本還沒準備好開始工作，就像被自己給［放空］了似的。


    6:45-7:20 AM


    我洗個澡、刮鬍子。我曾經擁有一個像呼叫器般大小的二十四小時隨身型報價機，通常會把它放在鏡子旁，以便我刮鬍子時能看到市場報價。但搬到佛羅里達三年之後，我的心理醫師要我把這些東西都丟到屋子外，所以我就把那個小型報價機給廢了。我得承認，當手上拿著一把刮鬍刀，眼睜睜看著報價機中顯示部位沉到抽水馬桶底，的確不是一件好事。


    7:20-7:30 AM


    把我的肚子清乾淨。我的祖父總是說一個人一天'
  - '[PAGE 375]


    一定要把腸子清兩遍，才能真正準備好開始一天的工作。「當我像你一樣還是個孩子時，有一次我們在紐海文冬天寒冷的街頭散步時，他對我說：「我們就住在基輔市的郊區，你們得到氣溫低到華氏三度以下的公廂去。想想看，在那麼冷的冬天蟋曲在公廂裡的滋味可真不好受，你會想如果能在溫暖的屋子裡上廁所該有多好。「所以啦，我就聽他的話，每天絕對清倉兩次。


    # 7:30-7:40 AM


    吃早餐。通常是一碗燕麥粥、一杯新鮮的現榨葡萄汁，和兩片全麥土司。我吃東西是為放鬆，不是為了填飽肚皮。我在用餐時會閱讀《紐約時報》，特別是體育版。我還是喜歡看看我最愛的洋基隊戰績如何。


    # 7:40 AM


    我坐在辦公桌後整理著晚間傳真進來的各種檔案。我每天從結算公司貝爾·史臘那裡收到一份長達三十頁的報告，其中詳細著我所有帳戶的損益狀況，以及前一天所有的成交明細。我也從幾個不同的期貨經紀商那裡收到一些成交明細，如果那些明細的內容有問題，我會馬上打電話到那家經紀商開罵，因為所有前一天的交易明細都待在市場閉盤前核對清楚才行。當市場波動特別劇烈時，只要我的帳戶狀況沒有和那些經紀商核對清楚，很可能一開盤就因而損失數十萬美元。這就是為什麼我總是把每筆交易都記錄得一清二楚。如果你的情緒不穩，就無法交易，所以我一定要在上午八'
  - '[PAGE 376]


    點以前把帳戶裡的部位弄清楚。我每天都是以損益歸零的狀況重新開始。


    我不想把前一天所遺留下來的情緒包袱帶到今天，每天成續都各自獨立、互不干擾。我每天傍晚收盤後耗費心力工作的習慣幫我把昨天的一切拋到腦後，如此才能夠真正把心集中在今天的盤勢。對我來說，不這麼做會是件危險的事。我最慘重的虧損總是發生在大賺一塀之後，這是因為過度自信總是讓我做出自以為是、漫不經心的操作行爲。操作S&P指數期貨時也可以套用這種心理層面的法則，因為期貨交易每天都會由結算公司加以市場評估，所有未平倉部位都會依它們市值的增滅，而使你的帳戶淨值在每天收盤後增加或減少。所以，每個期貨市場的操盤手每天早上都是損益歸零的狀況。我試著每天都能賺錢，也會保留我在每週、每月及每年中的操作績效紀錄。


    # 8:10-8:15 AM


    我跑下樓去拿《華爾街日報》。上第二次廁所，把腸子清乾淨。要是我的祖父沒說錯的話，現在我應該已經準備好面對一天的工作了。


    # 8:15 AM


    我打電話給我的債券經紀商，向他們詢問今天債券價格的支撐和阻力價位區，並把這些價位記錄在我的工作表裡。把所有的指標都計算完畢，其中包括隆德利的神奇T振動指標、前一天資料所算出的十八天期振動指標、幾種股價指數（OEX、標準普爾五百和
    XMI 指數）的高/低收盤價。'
  - '[PAGE 377]


    8:20-8:30 AM


    第一回合開始，債券市場開盤。我觀察一下決定是否要進場。我通常會操作債券，因為我覺得這是放鬆心情的好方法。除非政府正公佈一些經濟資料，否則債券價格的波動通常比股票、選擇權或其他各種期貨契約慢得多，而且對我來說債券也比較容易操作。操作債券讓我有機會感覺市場狀況，揣摩進場時機。但不幸的，政府破壞了債券市場。為了某些奇怪的理由，政府總是喜歡在星期五的上午八點半公布重要經濟資料。當年過五十後，你要在星期五起個大早來看這些資料，是一件愈來愈不容易辦到的事。你會希望政府能大發慈悲，之前就公布重要資料，好讓我們這些老頭子還有力氣爬起床來看這些資料。


    8:30-9:45 AM


    除非有什麼重要資料剛剛公布，不然在這個時段中我會操作債券。當一個新聞事件公布後，期貨交易所內通常會出現他們所謂「快市」(Flash trade)的情況，報價螢幕上也會在商品代碼旁加上「F」，代表這個商品正處於快市中。快市表示所有原來的市場交易規則都暫時無效，而交易場內的那些傢伙成了主宰你命運的人。我絕不在快市中進場操作債券，因為你永遠無法預期將發生什麼事，而且在快市中你很容易被場內操盤手惡搞。'
  - '[PAGE 378]


    8:45-9:27 AM


    我收到一大堆來自四面八方的傳真：高文公司（Craig & Co.）、貝爾·史騰、幾個大師級人物的市場分析、我在俄亥俄州的朋友庫克的報告，以及《迪克·魏斯特晨論》。我把這些資訊和前一天晚上的報價比對了一下，然後調查根據我前一天在
    S & P 指數期貨線圖上畫的軌道線所找出來的買進和賣出價位區之後，就算是已經完成開盤前的準備工作了。


    完善的準備靠的就是扎實的工作。如果你的事前就已經有了一份作戰計畫，它就能夠在猛烈炮火下賦予你足夠的勇氣。


    9:28 AM


    我回顧了一下檢查表。那是一張手稿，用塑膠護貝起來，貼在辦公桌右手邊的角落，一個我定看得到的位置上。其中記錄著準備建立部位前需要注意的事項，和一般操作策略準則的備忘錄。


    在交易前檢查技術圖和移動平均線，是我所有的技術指標之中最有效的一種。千萬不能和移動平均線逆向操作。現在市場在移動平均線之上或之下？換言之，市場是處於多頭或空頭？現在市場處於主要趨勢線之上或之下？最近的市场價格是否會突破新高或是新低？目前的神奇
    T 指標是處於多頭或空頭狀態？


    在建立部位前，總要問自己一個問題：我真的很想要這個部位嗎？


    永遠要在建立部位前知道你準備承受多少虧損。清楚地知道你的認輸點，並且切實執行它。'
  - '[PAGE 379]


    在一連串獲利頗豐的操作過程後，降低你的操作部位規模。經過一段很順利時期後，可以休息個一天，犒賞自己一下。


    我正在和S&P期貨交易場內連線的電話上。S&P指數期貨交易場內最狂亂的時刻就是開盤後的第一分鐘和收盤前的最後一分鐘，我得在這些時候保持完全的注意力。


    # 9:39 AM


    第二回合到第七回合。股票市場開盤了，芝加哥商品交易所（CME）的S&P指數期貨也開盤了。我把所有的交易指令都記錄在我的表格上，當它們成交後我就在上面打個圈。如果它們並沒有成交，我可能會繼續留單，或者乾脆把它們取消。如果我取消掉一個交易指令，我會在表格上那筆紀錄旁邊寫個大大的「取消」。我利用這種方式，來紀錄我在一天當中已經成交以及想要進行的交易。每隔半個小時，我會用新的開盤價來結算表格上所有部位的損益。我隨時想知道我的部位確實賺或賠了多少，如果我的帳戶今天表現不佳，我的情緒也會因而大受打擊。我有一個畫著十三個方塊的表單，其中每一塊都記錄著CME每半個小時的變動狀況。我也記錄紐約證交所綜合指數每半個小時的變動率，我隨時都在尋找市場中的型態。辨識市場的型態是我宿命的工作。


    # 9:30-12:30 PM'
  - '[PAGE 380]


    12:30 PM

    吃午飯。「海岸超市嗎？我是馬丁·舒華茲，我要四號餐外帶。「市場曾經是一群老傢伙的地盤，營業時間從十點到十二點半，然後這些老傢伙會出去吃個午餐，喝兩杯馬丁尼，再回來從兩點工作到三點。這看起來真是文雅。不過由於我不喝酒，所以我只會買個三明治，然後找個地方畫我的技術圖。而現在，我都在辦公桌上邊吃邊畫圖。


    1:00-4:00 PM

    第八到第十四回合。沒什麼不同，我還是忙著發動攻擊。


    4:00-4:45 PM

    第十五回合。股市收盤後，市場仍然存留著激情，但是S＆P期貨在這十五分鐘之內仍然繼續交易。這是你真的可能被市場狠狠修理的時候。經紀商所收到的大筆收盤市價單，和市場對於明天走勢所形成的預期心理，將使期貨和現貨之間的價差呈現戲劇性的變化。


    4:45-6:00 PM

    我讓自己的情緒平復下來，接著做一些睡前殺日後的分析工作。計算今天的損益狀況，把交易表格中的買賣紀錄加以比對查核，然後去健身房或出門跑步。'
  - '[PAGE 381]


    6:00-6:30 PM

    吃晚餐。


    6:30-7:00 PM

    畫技術圖。我有一份由證券市場研究公司SMR（一家位於科羅拉多州的股票技術圖編製公司）為我特製的圖集。我會補畫七十檔股票的線圖，並在SMR把資料傳真給我後也振動指標畫上去。


    7:00-8:30 PM

    資料的蒐集和研究。我會打電話到所有我訂的市場分析電話熱線去，把他們的說法記錄下來，研究移動平均線等……


    8:30-10:30 PM

    準備明天的工作。補畫我的大幅技術圖、在我的紙卡上做筆記、擬定明天的交易策略。我會畫上價位的轉捩點、軌道線，研究進出場價位和趨勢線。'
  - '[PAGE 382]


    這是盤後交易的時段。時至今日，市場上的爭戰已永不停歇。市場像太陽一樣繞著地球走。美國的主要市場在上午九點半開盤直到下午四點，但是還有各種商品交易仍然在盤後時段中繼續進行，像債券、股票、期貨等。S&P指數期貨（我吃飯的傢伙），則幾乎沒有收盤的時候。CME的S&P期貨市場在下午四點十五分收盤，但是它隨後又以下一個名為GLOBEX的電子交易盤的型態於四點四十五分再度開盤。GLOBEX交易的時段，橫跨整夜到第二天早上的九點十五分，緊接著CME又在九點三十分開盤。這表示每天只有四十五分鐘的時間不能交易S&P指數期貨。為了製造更多的成交量，GLOBEX現在在星期天下午六點半就開盤了。今天的交易所就像是一個超級賭場，他們希望你可以全天候交易。這些延長交易時段，可以讓你在很短的時間內迅速老化。


    10:30 PM

    忙了一天，該是睡覺的時候了。

    奧黛莉：你今天過得怎麼樣？

    我：應該可以做得更好。

    奧黛莉：每個操盤手都一樣。你們總是希望買低賣高，好好大賺幾票，然後在人生的高點收山不幹。

    我：是啊，一點兒也沒錯。'
