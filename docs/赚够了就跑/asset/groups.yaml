  - '[PAGE 373]


    噩夢成真時：我先前曾經說過，不論何時當你最害怕的噩夢沒有成真，而且市場回到一個比你預期更好的情況時，這可不是因為你運氣好所造成的。你很可能會想要在市場一回來時馬上軋平部位，逃出生天。但是我卻認為當事情不如原先所想的那麼糟時，你真正該做的或許是加碼，而非砍倉。


    自尊心中漫畫主角普高（Pogo）說過：「我們見到了敵人，才發覺原來敵人就是自己。」我在前面已經說過，現在再跟各位強調一次，因為這實在是操盤手最重要的認知。那就是：我在這些年的交易生涯中，最重要的改變是在學會把自尊心與操作隔離之後發生的。交易是一種心理遊戲。大部分人認為他們是在和市場抗衡，但是市場才不在乎他們呢！你真正對抗的是你自己。你一定要停止期待事情照你所想的樣子發生，以便證明你的想法是正確的這種思考模式。你只應該傾聽市場現在告訴你的是什麼。忘掉五分鐘前的想法，面對現在的市場狀況吧！畢竟金融操作的唯一目的，不是為了要證明你的想法是正確的，而是為了要多聽聽收銀機的鈴聲才對啊！'
