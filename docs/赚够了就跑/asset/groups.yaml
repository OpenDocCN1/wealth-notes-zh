    ## 第11章 那一仗，我打敗索羅斯


    人都以瘋狂的速度在交易場中進行交易。這裡看起來就像尖峰時段的中央車站一樣人潮洶湧。我得找人幫個忙，所以就抓住第一個從我身旁走過的跑單員。「嘿！我是馬丁·舒華茲！到底
    S & P 期指的交易場在哪裡？」「嘿！我才不管你是誰，不過 S & P 期指的交易場在那裡。」他很快地走開，並向人群中擠了進去，設法走進這個擁擠的交易場。我身旁是一個個十角形的高臺、向中間以階梯形式級級下降的個別期貨契約交易場。這就是所謂的交易圈（pit）。每個人都在大聲吼叫，揮動著手臂瘋狂地打著手勢，借著所謂的公開喊價方式進行交易。掌心向內就是買進，掌心向外就是賣出，而手指則不斷比畫著買價和賣價。「〇八六買十口」「給我六月豬腩的報價」「我要九月活豬的報價」…………看來我到了肉品期貨的交易區。我繼續在交易場裡漫無目的地走著。「瑞士法郎的報價在哪裡？」「〇〇〇八五我要叫出三十口德國馬克」「披索到底在搞什麼鬼？」…………終於，我聽到了一些熟悉的東西。我終於找到
    S & P 期指的交易區了。要找到黛比不是一件很困難的事，因為在 C M E 的交易場中，女性接單員的人數實在是屈指可數。她開始向身旁的人介紹我，而更令我高興的是，人們開始注意到我的存在。我就好像進到大觀園的劉姥姥一樣。「你好啊」「很高興見到你，聽過很多關於你的事。」「這是第一次到交易場內參觀？」「想做些交易嗎？」


    我能說什麼？在過去的五年期間，我在S＆P指數期貨市場簡直像秋風掃落葉般地超越大部分交易員的表現。我像是西部出手最快的快槍俠，而現在每個在交易場裡的人都等著看我露一手。『那有什麼問題，看我的！』我走到黛比身邊。根據交易所的規定，我並沒有得到在交易場內交易的許可，所以還是得透過黛比和她所屬的結算公司進行交易。


    整個市場為之沸騰，而突然間我才意會到自己惹了大麻煩。我這個快槍俠這回可是忘了把槍備好對掏槍，而我的處境就像光著身子站在大街上一樣無助。我對市場唯一的感覺只能來自於交易場中充斥的喊叫聲和手勢，但我對那些喊叫聲和手勢可幾乎是一點兒也看不懂。就我所看到和聽到的來觀察，市場似乎正在上漲，但走勢又似乎搖搖欲墜。『〇，二叫進五口』，有個滿臉面皰小子從交易場的另一邊向我喊著。『得了吧！舒華茲，你是來看戲的，還是來做交易的？』


    去你的，渾球！我低聲喃喃自語。那該死的五口！『黛比，讓我們來教訓那個小混混。五十口！〇，二叫出五十口！』如果那個傢伙想作多，我就偏偏要做空。


    交易場中響起了一片同調的聲浪。『成交！成交！〇，二叫進十五口。』『〇，二叫進十口！』『〇，二再多叫進二十口！』『嘿！舒華茲，再多賣出一些給我們嘛！』『對啊！來嘛，細約仔。讓我們看看你有多大的本領。〇，二再多叫進二十口！』『舒華茲，你想做做看九月的契約嗎？○．六叫進二十口！該死！這裡到底是怎麼一回事？


    接下來的半個小時，對我來說簡直度日如年。我一直執意堅持我的空頭部位，但是我已經彈盡援絕了。市場簡直一去不回。當我的虧損累積到九萬美元時，我剋平所有的部位，然後宣布投降。當我努力推擠著走出交易場時，一個老操盤手對著我大喊，「嘿！舒華茲，你給我回來！這麼些年來你一直透過電話交易賺盡了我們的錢，我們要當面跟你要回來！」


    一九八九年，我再度到CME拜訪，但是這回我拒絕再在交易場裡做交易。我已經得到了應得的教訓，那就是如果你忘了把你的槍帶出來，就千萬別站到槍林彈雨的火線上。市場不是一個用來娛樂任何人的地方，如果你想要使人印象深刻，唯一的方法只有站穩腳步、保持原則，並且依照自己的理性來從事交易。把我捐給鳳城博物館和在交易場裡輸的錢加起來一算，想在芝加哥當大人物的念頭花了我十萬美元。


    ### 黑色星期一，你在幹嘛？


    當年在華爾街，你最常會聽到人們問的問題是：「一九八七年十月十九日那天，你在幹嘛？」那天，我手上持有的是多頭部位，結果也證明是錯的。可是如果還有機會重來一遍，我還是會作多，還是會犯同樣的錯誤。


    那正是蓬勃發展的一九八〇年代，就算沃爾克於一九八二年從墨西哥灰頭土臉地撤退，市場還是一路持續多頭走勢。在一九八二到八七這五年中，道瓊工業指數從七九〇點上漲到二千六百點，共飆漲了二三〇%——光是八七年的前九個月，就上漲了六五〇點，相當於三三%的漲幅。華爾街就像西班牙奔牛節的情景一樣，每個人都跟著牛群跑。我在那年賺了八百萬美元，在那樣的多頭市場中賺錢是多麼容易，只有傻瓜才會認為多頭市場即將結束。


    我手上的持股不但多，而且數量持續加大。我對市場非常有信心，所以在哥倫布紀念日的那個週末我帶著奧黛莉，與職業網球選手安德列和他老婆蓋比·起到天堂島度假。紀念日當天市場正常交易，但AMEX裡那些猶太和義大利裔的操盤手通常不上班，只有北歐裔、英裔和愛爾蘭裔的操盤手不放假。八年來，我自己則一如往常地交易，並不休息。所以當奧黛莉、安德列和蓋比坐在海洋俱樂部的吧臺上喝著雞尾酒時，我拿著電話繼續進行交易。「再幫我買一萬股的田納科（Tennco）。……什麼？你說市場傳聞田納科就要被別的公司併購？那再幫我買進二萬股。幫我買就對了！……等一下，奧黛莉，賭場什麼時候開始營業？」


    在這個哥倫布紀念日，市場狀況相當敏感。週四（十月八日）道瓊跌了三十點，並在週五（九日）接著跌三十四點；緊接的週一（十二日）跌十點，週二（十三日）漲三十六點，週三（十四日）重挫九十五點，週四（十五日）跌五十八點，接著就來到了黑色星期五（十六日）。後來《華爾街日報》這樣描述週五破歷史上紀錄的跌幅：「道瓊以破紀錄的一〇八．六五點跌幅重挫，成交量也創下史無前例的三億三千八百萬股。這是道瓊指數連續第三天重挫，但部分技術分析師表示，從週五的跌幅與成交量來看，顯示未來盤勢將有機會出現較佳表現。」


    ### 純種狗和雜種狗有什麼不同？


    這就是大部分市場專家對週五那種戲劇性跌幅大致上的共同看法。大家都認為，週五的走勢是多頭向下修正的末跌段。


    貝爾·史騰公司的傑克·所羅門（Jack Solomon）宣稱「市場的大幅下跌總是以死亡性的殺盤作結束]，奇德公司（Kirk''s）的鄧尼斯·加瑞特（Dennis
    Garrett）的意見則是「市場已經到了『投降點』」。大部分的分析師都同意，星期五盤中的走勢是一種典型的『空頭頂峰』。


    至於我自己呢？我也認為市場已經見底了，雖然在我自己設立的交易法則中顯示，週五出現的跌勢通常都會延伸到下個週一，但我還是在週五收盤前開始建立多頭部位。畢竟，下檔還能有多少空間？市場還能跌到哪裡去嘛！週五收盤前我打電話給黛比：「幫我用市價買五十口
    S & P 期指。」她幫我買進了，成交價在二八三·五。這對我來說根本不算什麼了不起的大部位，但是直覺告訴我在這樣的市場狀況下五十口已經夠了。


    可是接下來的週末，發生了兩件使我真的緊張起來的事。


    週五晚間，我如同往常一樣快累垮了，奧黛莉幫我煮了豐盛的晚餐。我躺在沙發上邊吃邊看電視上由路易士·洛基瑟（Louis Reysse）主持的「華爾街週報」。洛基瑟向當天的來賓、著名的基金經理人及市場預測專家馬提·崔格（Matt
    Czog）詢問對週五這一〇八點的重挫有什麼看法，崔格說：「市場目前正在很危急的狀況中，我認為在短期內將往下跌至至少五百點。」


    崔格和我住在同一幢大樓裡，所以星期天一大早我就打電話給他，他下樓到我的公寓談了大約一個小時。當時債券價格也已經在很短的期間出現重挫，而且他說所有的貨幣市場指標都明顯偏壞，他再一次以相當肯定的態度表示，市場將再下跌至少五百點。


    當然，他說這個結果可能在未來幾個月內發生，我們萬萬沒有想到，這一切竟然在接下來的二十四小時內成真。


    另外一件令我感到不妙的，是美国财政部長詹姆斯·貝克（James Addison Baker）在週末指責德國當局任由馬克利率走高的一番話。貝克一直以來都想藉由控制美元的匯價，來改善美國貿易赤字問題，也認為波昂當局所採取的行動已經違反了他在當年二月和德國達成的協定。貝克的強硬談話等於向市場放出美國即將調高利率的風聲，令市場相當不安。所以當我聽到貝克的談話後，就知道麻煩大了。


    星期一開盤前我很緊張。在崔格發表對市場的看法以及貝克對德國開罵後，我認為當天的市場從一開盤就不會讓人好過。我通常對任何部位都會設一個「認輸點」——我心中的停損點，但現在的問題是：我有沒有足夠的勇氣承認自己犯的錯誤並停損。在心裡設下停損價位是一回事，而真正執行它，在市場把多頭部位砍掉並實現一大筆的損失是另一回事。在華爾街，切實執行停損就像分辨純種狗和雜種狗有什麼不一樣一般困難。


    開盤鐘聲響起，市場馬上進入瘋狂狀態，道瓊工業指數好像垂死般，在開盤十五分鐘內立刻下挫了一五〇點。我坐在辦公室陷入恐懼中，因為我手上那四十口S & P指數期貨、一卡車的選擇權和兩卡車的股票，轉眼間都跌破了我心裡的停損點，我的部位已經虧損太多了。我沒有辦法動手執行停損，也無法做任何因應動作。陸戰隊的教官告訴我，在戰場的火線下，不管前退或撤退，千萬不能停滯不前。總之，不要呆坐原地等著挨炮彈。不過他們所教的只適用於一般的戰鬥，而我現在卻像是被核子彈轟炸了一樣。


    我的眼睛從一個螢幕換到另一個螢幕，天哪！所有的線圖和技術指標都直直向下──道瓊在半個小時內跌了兩百點；S＆P指數一開盤就重挫了十九點，而且還正在極速下滑中。NYSE指數？幾乎崩盤了。那斯達克指數？就像滿目瘡痍的戰場。芝加哥交易所的選擇權？全倒！我喃喃自語：「搞什麼鬼？這不是真的！下一個支撐在哪裡？反彈吧！寶貝，你一定得反彈！」


    終於在十點半左右，市場暫時停止下滑，甚至出現了小幅反彈。我開始到處打電話打探市場狀況，試著為我的部位找方向。「今天的成交量是多少？」「一買進和賣出家數是多少？」「有多少買家？他們只是在建立新倉，還是軋平部位？」「狗屎！你能相信默默（M&M）竟然跌了十二美元，到了一七二美元一股嗎？再看看迪吉多，下跌了二十美元，到一五二美元一股。這些都是多好的價位啊！一定有很多人會進場搶進。「在下個鐘頭裡，道瓊指數回暖，並從低點向上回漲了一百點。


    我開始採取行動了。我打電話到芝加哥，「黛比，把我那四十口S＆P期貨賣掉。市價賣掉。現在就賣！」我賣在二六七・五，當場賠了三千一萬五千元美元，但那是我這一生中最棒的交易之一。


    我一向以擅於掌握市場的進出時點而自豪，但萬萬沒想到這次賠錢，會是我這一生中時點掌握得最棒的一筆交易。我在只比當天最高價低一・五點的價位，賣出了那四十口S＆P期指。從我賣出的價位開始，市場再度陷入快速跌勢當中。我開始努力作空，賣出了所有的部位。到了當天上午十一點半，我除了在哥倫布紀念日度假喝瑪尾酒時所買進的那幾個選擇權外，幾乎清乾淨了所有部位。我不是不想清掉那些選擇權，而是因為它們那時已經停止交易，根本沒有任何買盤了。


    到了中午，道瓊指數又下跌了大約一五〇點。我想我已經賠了大約兩百萬美元，這可是一筆大數目，但是至少我已經停損出場，不會再輸更多錢了。這回我受了重傷，但我當機立斷地幫自己止血。根據海軍陸戰隊的訓練，即使撤退也可視爲一項具攻擊性的行動，因爲你藉由撤退而保留了來日再度反攻的實力。這正是我當時的做法，我從市場中撤退，保留了他日再進場放手一搏的實力。


    ### 氣氛詭謨，銀行快要倒了……


    問題是，我從戰場上撤退得夠遠了嗎？我開始擔心，整個金融體系是否就此一蹶不振？情況會不會像一九二九年那次一樣糟糕？我一邊想著經濟大蕭條可能來臨，一邊浮現出父親的樣子──爲了讓家裡收支相抵，他同時兼兩份工作，卻還是入不敷出。我開始思考：我得採取什麼行動來保護我的家人？


    對我來說，保護家人永遠是最重要的一件事。我離開辦公室直接回到家裡。「奧黛莉，」我說：「市場要垮了。我要去把黃金領出來。」


    奧黛莉開始試我的心理狀態。「馬丁，你真的認爲情況已經糟到這個地步了嗎？」


    「市場重挫了一五〇點。我覺得情況還會更糟！」


    「那你的部位怎麼樣？」


    「除了一些已經暫停交易的選擇權契約外，我已經把所有的部位都斬平了。」我看得出來奧黛莉正回想起一九八二年那次，在海邊度假時我逼她去看黃金提領出來的舊事。該死！那些黃金還真是重得不得了，我真不想再做一次同樣的事。


    我走進臥室，看到兒子吸著手指、正在小床裡睡覺，再想想自己目前面臨的狀況，如果一切真的如我想的那麼糟糕，進而危害家人的話，我該怎麼辦？如果孩子們知道我可以的事前做好防備措施而沒做時，我有什麼臉面對他們？


    我還是決定把黃金提領出來。


    我跑到衣帽間，拉出一個破舊的皮箱，然後往電梯走去。我是個操盤手，對於所有事情都相信自己的直覺，而現在直覺告訴我，市場快崩潰了。如果我是對的，雷根就可能像胡佛在一九二九年的所做的那樣，宣布銀行暫停營業，而我的黃金將被困在銀行裡，我得先下手為強，把銀行的保險箱都清乾淨。


    「你要去哪？」奧黛莉說。


    「去把黃金領出來。」


    「如果你真的覺得不對勁，就去吧！不過一切小心啊！」


    我們的公寓坐落於六十五街和公園大道的轉角上，而東紐約儲蓄銀行則位於六十四街和第三街的交叉口，就在下一個路口。我在這麼一個美麗的秋午後衝出門，急忙地向那個街口走去，皮箱在我身旁晃來晃去。大通銀行的董事長大衛·洛克斐勒（David
    Rockefeller）在搬到紐澤西賽鐸市（Saddle River）前，也在六十五街的南邊擁有一幢加寬式的房子，就位於尼克森住過的房子旁。大約十二點半左右，我走到洛克斐勒的房子旁時，看到屋外有六部大轎車雨、三排地停放著。


    「喔！」我自言自語：「發生了什麼事？他們一定在開什麼緊急會議。」


    在這種狀況下，我很容易就可以想像到像副總統布希、季辛吉·喬治·舒茲（George Stults）、密爾頓·傅利曼（Milton Friedman）、馬格莉特·柴契爾（Margaret
    Thatcher）、海慕特·柯爾（Helmut Kohl）等人都可能正齊聚在洛克菲勒的房子裡，商量如何在真正拯救全世界前，先保住老本。我加快了腳步趕到保險箱前，這些混球只要從這幢房子打一通電話到白宮，就足以讓銀行從此關門大吉。


    當我回到所住的公寓大樓時，胸前皮夾裡放了二萬美元的現金，而我臉上則掛著詭異的笑容。

    「一切都好嗎？」門僮對我問候：「您剛剛離開時看起來心情不太好呢！」

    「一切都好，很好！」我說：「到了明天，住這棟大廈裡的人恐怕有一半以上都沒有辦法付得出個月的管理費了，但我可不會這樣！」我拍著胸前的皮夾。「銀行馬上就要倒了，而我可一點都不在乎，因為我身上有的是現金。


    我把現金和黃金一起放在家中的保險箱裡，時間是下午兩點半，我查看了一下市場的狀況。正如我所預期的，下跌了四○九點，並持續下滑中。我抓起電話打給哥哥：「傑瑞！你只剩半小時的時間了，現在馬上去銀行把現金領出來！明天這些銀行可能都沒辦法開門營業了。」

    「馬丁，我現在沒有時間趕去銀行。我很忙，手邊有一大堆客戶。」

    「傑瑞，去那些客戶的！你得聽我說，銀行現在正面臨結構性的問題。它們就快要像三哩島核電廠的爐心一樣熔解掉了，你一定得去銀行，現在就去！」

    「馬丁，你聽起來好像有點歇斯底里。回想一下一九八二年那次，你發了瘋似的叫我們去提領黃金那件事吧！我現在沒空跑銀行，手邊有太多事要做了。』


    『好吧！可是如果銀行真的都關門大吉，而你手邊一點錢都沒有的話，怎麼辦？』


    『我會到你家向你借。』喀搭一聲，他掛上了電話。


    在市場向下跌五〇八點作收之後，我打電話給佐爾納。『佐爾納，你怎麼看？』


    『我不知道，但是你知道我一向怎麼說的：『當市場的狀況壞到你覺得反胃到極點時，或許就是該加碼的時候了！』


    ### 把手放在口袋裡，盯著報價盤觀看


    星期二早上，市場狀況就像颱風過後，人們開始巡視海邊並評估災情。到底市場的跌勢是一時的，還是長期結構性的？謠言充斥華爾街，有人說紐約證交所可能暫停開市、CME也可能暫停開市、所有的交易所今天都暫停開市等等，而最天大的謠言，則是所有投資銀行的龍頭老大——摩根·史坦利可能要宣告倒閉了。


    我馬上打電話給內線史基尼。


    『馬丁，那些傢伙……』史基尼用尖銳的音調說：『他們手上持有一大堆的套利部位，他們放空現股，然後作多S&P指數期貨，可是由於市場出現恐慌性賣壓，所以他們就虧大啦！指數期貨契約的價格出現四十點的逆價差（期貨價格低於現貨價格），可是股票根本有行無市。他們欠了CME高達十億美元以上的保證金，更糟的是，他們沒有能力支應追繳保證金的壓力。』


    我打電話給黨比，探一探CME那邊的狀況。CME就像瘋人院般，黨比過去從來沒有看過這樣的情況。交易場委員會光是為了處理錯帳和交易糾紛，就搞得臉都綠了，一大堆操盤手不承認他們所成交的交易。在我和黨比說話的同時，米爾蘭正在S
    & P期貨的交易場上，向大家宣示一切沒問題，可是沒人相信他的話。許多經紀商和操盤手乾脆不來了，許多交易所的會員席位都在跳樓大拍賣—因為有不少會員指望拿買席位的錢去支付保證金的追繳。


    在股票市場中，作價員創造市場價格，但是如果買盤和賣盤相差太遠時，他們也可以暫停交易，而這正是星期一天天很多檔股票所面臨的窘境。指數期貨是利用公開喊價的方式進行交易，在相同的價位叫進或叫出，這就是S
    & P期指之所以會和現貨指數出現如此巨幅價差的主要原因。操盤手會針對目前市場上叫出的賣盤喊出叫進的價格，但是這些價格都比現貨指數的最後成交價來得低。用來計算S
    & P指數的股價，都只是星期一收盤時所取得的價格而已。


    在這麼一個供需完全失衡的市場中，我決定停止交易。如果現在跳進S & P期指市場的話，那我真的是頭殼壞去了。在那個市場中價格波動得愈厲害，場內操盤手就越有機會惡搞你。就算在平常一切都沒問題的狀況下，我都免不了被他們瞎整一番，更何況在一個像今天這麼亂的市場，他們不把我咬成碎片才怪呢！整個星期二早晨，我都把手放在口袋裡，盯著報價盤看。股票市場以極大的成交量上下振盪。黨比在十一點三十分時打電話給我，米爾蘭和CME的主席傑克·山德納
    (Fed Sued) 剛剛才走進 S&P 指數期貨的交易場，宣布暫時停止所有的交易活動。他們擔心紐約證交所可能馬上會宣布停止交易，而如果這件事真的發生，CME
    就會成為操盤手蜂擁而上、全力擠壓的地方。


    但是中午過後，道瓊新聞社開始報導，許多續優藍籌公司已經開始買回自家的股票。這個利多消息馬上讓所有的藍籌股強勁反彈，而 CME 隨後也重新開始交易。那天道瓊工業指數收盤上揚一〇二．二七點，是有史以來的單日最大漲幅。


    我完全錯過了這一波漲勢，因為我整天都在場外觀望。我在當時仍然擁有六百萬美元的年度獲利，而且我的神經不再緊繃，最重要的是，我的黃金都放在保險箱裡。這就像在拉斯維加斯大贏之後的心情：我得休息一段時間才行。


    ### 一手加碼買進，一手把黃金領出來


    星期三，有更多股票跟隨藍籌股的漲勢上揚，到了下午三點，股市已經上漲了一七五點，輕易超越了星期一的單日漲幅紀錄，並且收復了星期一那五〇八點跌幅的大半失土。市場進入瘋狂狀態。我一定會回到這場遊戲裡。


    我看著我的神奇 T 指標、移動平均線、相對強弱指標和趨勢軌道線，在市場經過了我一生僅見的大幅波動過後，我的指標都無法使用了。在有的指標中顯現不出半點規律、沒有任何對稱的形

