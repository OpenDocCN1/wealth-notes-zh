    在找當紅的操盤手來幫他賺錢。我會給他個電話，然後幫你跟他安排一次會面。』而現在，我正在波奇的辦公室外面呆坐著等他。


    每個在華爾街混過的人對波奇都知之甚詳。他是一個名副其實的市場高手，一個超級大人物，基金規模高達數十億美元。波奇最大的樂事，就是在別人人面前趾高氣揚大顯威風。之前我從未沒和他見過面，但是我並不喜歡他。他在市場上以態度粗暴、常與人起衝突聞名。自以爲是說笑話能手的他，總喜歡跟旁人吹噓自己如何折騰那些經紀商。因為經紀商總是打電話問波奇要生意，所以他就會在市場收盤前幾分鐘打電話給那些經紀商，然後說：「好吧，你們想跟我要生意是吧？幫我買進五萬股的※※&*#。」然後馬上掛斷電話。


    接到他電話的倒楣經紀商，根本聽不懂他說的股票名稱是什麼，於是馬上回電話想問清楚，但是波奇會交待祕書告訴經紀商他正在洗手間，沒法接聽電話。經紀商就會急得發狂，大聲要祕書查一下他到底要買什麼股票。他們會懇求波奇的祕書：「甜心，拜託幫個忙吧？只要請你探個頭問他一下股票的名字就好了！」


    一般而言，和波奇做生意的經紀商佣金大約是每股六美分，以五萬股來計算就是三萬美元的佣金，而負責這個帳戶的營業員可以得到二○%，或是六千美元的佣金。可是現在他根本搞不清楚股票的名稱（他也不可能搞清楚），眼見市場就要收盤了，營業員如果買不到股票就完蛋了，不但賺不到佣金，更可能會失去和波奇這個大人物做生意的機會。波奇就是喜歡玩這種遊戲，我可一點也不欣賞！'
