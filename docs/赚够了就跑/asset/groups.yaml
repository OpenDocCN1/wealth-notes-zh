    # 你是冠軍操盤手，so？


    為有錢人操盤，沒想像中容易


    我躺在床上，把鬧鐘調到傍晚七點，然後閉上眼


    睛昏睡過去。那是一九九〇年十月二十九日星期一，


    下午六點半，我才剛從辦公室回到家裡。


    真是忙亂得不得了一個月，我正打算和客戶在


    全紐約最棒的魯提斯義大利餐廳共進晚餐前，先小睡


    片刻。我已經要求沙伯林納合夥基金和沙伯林納海外


    基金的投資人在十一月前讓我知道，他們是否在下個


    年度還會繼續投資。所以整個十月份當中，我除了要


    做例行工作外，還要不停地向客戶解說，過去一年中


    我為他們賺了多大的一筆財富。如果你正在操作一個


    基金，可無法承受損失任何一個客戶所帶來的後果。


    在某種程度上，他們就像是一羣生命共同體，一旦有


    人跳船，其他人會馬上跟進。


    不賺錢，誰管你是冠軍操盤手？


    當時我在股票市場的績效是一八％，高出大盤許'
  - '[PAGE 267]


    多，但在和客戶的會談當中我發現，自己面臨三個問題。第一是我收取的費用。我是史瓦格書中指的「金融怪傑」之一，同時也是市場高手，但我發現如果我要承受為別人操作資金的重大壓力，就一定要收取更高的報酬。我想把基金管理費調高到和鐘斯、考夫納和貝肯那些人一樣的水準，問題是，這三個人操作的都是期貨基金，而我不是。


    沙伯林納合夥基金和沙伯林納海外基金都設定只以資金的二五％從事期貨交易，另外七五％則從事股票交易，所以這兩個基金都不是期貨基金，只能算是股票基金，而大部分的股市基金經理人收取的是「一加二〇」型的報酬。所謂「一加二〇」，就是總資金一％的固定年管理費再加上獲利二〇％。只有市場上的頂尖高手，也就是那些操作純粹期貨基金的傢伙，才有這個條件要求「四加二〇」的報酬──而那正是我想要的價碼。這表示，若以一八％的報酬率來計算的話，我會得到比總獲利的三分之一還要多。所以有很多投資人發現，這對他們來說，不是很划算的買賣。


    我的第二個問題，是當時的市場狀況。市場整年都呈現非常不規則的走勢，一九八九年十一月我開始為兩個基金操盤時，市場在我的移動平均線上下沖刷洗盤，所以我採取了比較保守的策略，並根據市場上一些企業接收的計畫或小道消息建立了幾個部位，希望藉此產生一些穩定的獲利來支援我在Ｓ＆Ｐ指數期貨交易上的困境。我買進了一些林傳播公司（Lin
    Broadcasters）和喬治亞海灣公司（Georgia G）的股票，但只要市場出現謠言，那些個股的買賣價差都會明顯拉大，而資金調度的考量會破壞我在短線上的獲利。由於我的基金有一部分算是期貨基金，依照期貨法規，每個月'
  md: '

    回想一九六〇年代，當我還在商學院念書時，避險基金是一種有限的合夥關係（Limited Partnership），其中的基金經理人屬於一般的合夥人，而那些擁有一百萬美元以上資金、所謂多角化投資的富有投資人就屬於有限合夥人。按照美國的法令，基金不能接受超過九十九位、投資金額低於五十萬美元的投資合夥人，而且必須以美國股票為主要投資標的。


    到了一九八〇年代末期，一切都改變了。傑索羅斯、朱利安·羅伯森（Julian Robertson）以及麥可·史丹哈特（Michael Steinhardt）之類的避險基金經理人都募集了數十億的資金，如此龐大的金額使他們無法選出足夠的美國國內股票當投資標的，所以他們就把注意力轉移到廣大的國際市場，使他們得以有更大的舞臺發揮並運用更高的財務槓桿。他們設立了美國證管會無法管理的海外基金，並開始在全球的外匯和利率市場從事投機交易。他們會介入美元兌日幣的市場，或者是美國公債對德國公債的價差交易。


    為了要和這些真正大型的投资機構競爭，我必須要設立兩個基金。其中的國內基金，名稱是沙伯林納合夥基金（Stanina Partners L.P.），而海外基金則稱為沙伯林納海外基金（Stanina
    Offshore Fund L.P.）。我將這兩個基金的最小投資金額都設為一百萬美元，而且資金投入後一年內不得領回，這個做法可以讓我不必擔心有人會干涉我的操作，使我享有更多的自主性。


    良機當前，我不去倫敦了……


    由於我是冠軍操盤手，所以我收取4%的固定基金管理費，再加上總獲利的20%。而由於投資人其實是投資在我個人身上，所以有必要把我的操作風格和方法詳細介紹。在營運計畫書中，我強調我的做法和一般的資金操盤手不同，我同時操作股票、選擇權以及期貨，而且從過去的紀錄可以知道，我在這三種領域都能保持持續獲利的績效。在同一段時間中，我可能無法和個別市場中的特定操盤手賺同樣多的錢，但是以長遠表現來看，我在各方面都勝過他們。我是冠軍操盤手，專欄作家約翰·李休曾經在《巴倫週刊》這麼說過，而傑克·史瓦格也在《金融怪傑》一書中表示過同樣的意見。


    為我的國內基金募集資金，還算是我能力所及的事。就像我在安默斯特寫畢業論文一樣，我拿起一疊紙卡做紀錄，但這回上面寫的可不是凱因斯或亞當·斯密的經濟學理論，而是我腦海中所能想到擁有一百萬美元資金的人名和他們的電話號碼。我一一打電話給他們、寫信給他們、和他們見面喝一杯、寄給他們營運計畫書，也寄給他們所有介紹我成為冠軍操盤手事蹟的媒體剪輯，其中包括李休那篇文章的副本及史瓦格的書。


    我一再打電話、重複寫信，贊助他們的慈善捐款，寄給他們另一份營運計畫書以及那些剪報。我懇求他們到我那位於雷克辛頓街七五〇號新建大廈的頂樓、能以完善角度俯瞰中央公園的新辦公室參觀一下。當他們出現時，我就邀請他們到奧黛莉精心布置的會客室，裡面有後文藝復興風格的家具、巴洛克時期立體派畫風的古墳作品，以及佛雷斯哥和柏雷特提供的現代藝術品。就這樣，到了十月時，我已經為沙伯林納合夥人募集了二千二百萬美元（包括我自己投入的五百萬美元，並擔任常任合夥人）。


    不過為沙伯林納海外基金募集資金，並不是憑我一己之力可以辦到的。我曾經到過歐洲幾次，但是對那些國際型的大投資者一個都不認識。一般而言，美國的資金經理人找尋國際投資者方法，都是由一些具有國際良好關係的掮客來進行，並經由他們將資金操盤手引入給那些國際投資人。


    這個方式所面對的問題是：可能有些掮客會要求巨額佣金，但無論如何我還是決定一試。有一個來自添惠公司（Dan Weiss）的傢伙是第一個和我接觸的人，他宣稱自己有一些「了不得」的國際聯繫管道。我可不打算把我獲利的25%給他，或其他任何一個和他一樣的寄生蟲。所以我在外頭散話，說我最多只願意依客戶的多寡支付佣金，只要他們幫我介紹客戶，我就付他們定額佣金，這就是我的條件。


    有兩家經紀公司接受了我的條件。奇德（Kide）公司的保羅·桑德斯（Paul Sanders）和皮博迪（Pebody）公司的凱文·布蘭特（Kevin Brant）和我接上了頭，兩家都是經營資金募集業務的公司。他們有個印度籍同事名叫拉柯許·巴加瓦（Rakesh
    Baggawa），他和印度、巴基斯坦的許多富豪有很好的關係。


    我一直認為印度人和巴基斯坦人是很难纏的敵人，但當我很顯然的可從中得到賺錢的機會時，那又有什么關係？布蘭特和桑德斯請巴加瓦於十月中旬在倫敦安排幾個會議，也為我排定了倫敦這一系列會議的時程。


    我很期待這趟旅程。我非常喜歡倫敦，記得一九六七年那次暑假在倫敦的日子，以及當年想像著能到倫敦經濟學院拿一個經濟學碩士的夢想。我曾經走進當地的賭場，期望有一天能夠在賭桌上大撈一票；曾經搭乘火車到愛普森去看那頭小馬；曾經搭乘雙層巴士到哈洛德百貨公司，並期待哪一天能有機會再回到那裡大肆採購。


    我還曾經經過麗池飯店、康諾特飯店、伯克萊飯店以及克萊麗奇飯店，夢想著哪一天能夠住在這些全英國最金碧輝煌的旅館，並從一部勞斯萊斯轎車中走出來，由打著領結、穿著紅色短禮服外套及閃亮黑皮鞋的門僮為我開門。克萊麗奇飯店是我這次行程最想住的飯店，所以我透過關係幫我弄到了一個房間。


    十月十三日星期五的早晨，我轧平了所有的部位，在司機來接我去機場前無聊地看著報價螢幕解悶，當時市場正在重挫中。那一陣子市場中的話題是聯合航空的融資收購案（UAC
    takeover Bid, UAC TBO），在這個融資收購案中聯合航空的每股叫價是三百美元，但是突然間融資者縮手，使這筆交易頓時化為泡影。這個案子，正是垃圾債券（Junk
    Bond，信用評等較差的企業所發行的高收益率債券）風光年代的產物。市場的反應告訴我們，該是為一九八○年代的過度擴張付出代價的時候了。


    我馬上覺得這筆融資收購案的失敗是一個重要的訊號，代表一個操盤手十年當中都難得碰上幾回的賺大錢良機，即將要來臨了。而我就坐在這裡，準備好隨時採取必要的行動。我所有的部位都已轧平，就像是坐在一堆現金上面似的。我打電話給布蘭特和桑德斯。「取消這次行程，」我說：「在這種市場狀況下，我哪兒都想去。他們完全了解。對一個操盤手來說，那種個人的緊急狀況——諸如死亡、結婚或生病，都不是用來取消會議的理由，但是為了賺錢而取消和客戶的約會，是絕對可以被接受的。他們打電話給巴加瓦，把我的會議行程延到下個禮拜。巴加瓦說沒問題，為了不對我有利的市場狀況而取消和客戶的會議，只會加強我的名聲。我就是那個擁有點石成金術的傢伙，我也是華爾街的優勝者，一名冠軍操盤手。


    ## 晚一點去歐洲，多賺了五十萬美元


    我看到市場重挫了一整天，下午稍晚時，道瓊指數已經下跌了一九〇點。每一個人心裡想的都是：「又來了！」大家都相信，市場將會出現像一九八七年一樣的崩盤局面。


    好極了！我知道該怎麼做。在一九八七年的股市崩盤當中，投資人因為認為股市已經泡沫化，所以搶進債券市場，把公債的價格拉高。換言之，投資人會把資金從股票市場拉出來，轉而投入固定收益資產的證券。債券期貨市場在下午三點收盤，所以，在兩點五十八分時我開始買進債券；股票市場到四點才收盤，而當股市繼續下挫的當口，債券價格一飛沖天。我很快地在債券期貨的第二交易時段（直到下午四點十五分）結束前，轧平所有的債券期貨部位，賺了七萬美元——成果算不錯，但我確定最好的狀況還沒出現。收盤後，我接到專欄作家李休打來的電話（他常打來問我對市場的看法），我告訴他，我強力看多，而且已經持有多頭部位了。到了十六日星期一，我在《巴倫週刊》上看到以下這篇短文：


    > 我在上週五市場收盤後訪問傳奇操盤手馬丁·舒華茲時，他表示對於當天股市重挫一九〇點的原因一無所知。「真正開始令我感到煩心的，」他說：「是每一個人都股市賺到了錢。從過去的事實來看，當市場在一年當中上漲超過三〇%的時候，情勢就變得相當危險了。」但舒華茲，這位我們所知市場上少數富而有又誠實的操盤手，告訴我他在當天稍早才剛剛軋平所有部位。「但我真的不認為市場的狀況會糟到什麼樣的地步，」他表示：「目前的利率水準比起一九八七年要來得低，而且本益比也比一九八七年要低得多。就期貨市場的表現來看，或許股市在星期一要開低六十或七十點都很難。我目前傾向於仔細研究我的技術圖，然後找進場點作多。」


    李休簡直像我的發言人。不過，當你在市場上享有極高的知名度時，你說的話最好是對的。幸好，這一次我真的說對了。星期一早晨起床後，我第一件事就是搶進那些我已經計畫好要買的股票，像是菲利普·莫里斯（Philip
    Morris）、房利美（Fannie Mae）和房地產（First Eagle Real Estate）等。這些都是在上周五的跌勢中抗跌性甚強的個股，當市場反彈時，它們就會是帶領一飛沖天的超強股。根據一九八七年崩盤的經驗，我預期市場會開低，但是當市場稍後出現反彈並收高八十八點後，我就開始軋平我的多頭部位。到星期二下午我開始將部位轉向，放空
    S & P 指數期貨。如果每個都在買進，就是賣出的最好時機，而我又對了一次。我在星期三把所有部位軋平。就在我赴歐洲行程延後的一星期當中，我賺了五十萬美元。


    ## 有錢賺，把靈魂賣給魔鬼也不在乎的人


    我終於要出發去歐洲，為我的海外基金籌集資金。舒適地坐在前往倫敦的頭等艙中，我開始專心思考要怎麼樣才能說服那些國際投資人，把資金投入我的基金裡。


    在克萊麗奇飯店的早餐會議進行得順利極了。除了巴加瓦、桑德斯、布蘭特和我之外，還有一位大型不動產開發國際性企業家謝克（Shaich）參加，他的父親曾經是某個我從來沒聽說過的地方的市長；然後是一位至今我都不知道他是何許人的地毯大亨；此外，還有歐瑪·凱揚（Omar
    Khayyam），他是某個主要中東銀行的倫敦分行經理；以及施德霖·席克史潘斯（Sterling Six-Percent），他在美國以惡意購併著稱的英國控股公司前任總裁。我一點也不知道他們是怎麼被找來的，但我很清楚他們每個人都是那種只要有錢賺，把靈魂賣給魔鬼都不在乎的人——這是國際性商業行為的常態。


    我第一眼就對席克史潘斯很有好感，因為我覺得他和我一樣，是那種白手起家、靠自己努力成功的人。而且他還買下過一支職業足球隊，一九六七年的暑假我曾經看過那支球隊的比賽，那時我還只能坐在便宜的席位上，吃著洋芋片。而現在，在二十二年的後，我可是坐在克萊麗奇飯店裡和這些大亨們一起享用著豐盛的早餐。


    巴加瓦介紹完他的客戶後，桑德斯正式介紹我。「如果諸位曾經讀過《金融怪傑》這本書，」桑德斯手裡拿著那本書向他們說：「就一定聽過馬丁的大名。如果沒有看過，這裡有一份《巴倫週刊》的文章，可以從中看到一篇有意思的報導。」


    說完，他就伸手從桌子底下拿出六份十月二十三日《巴倫週刊》的影本。那篇文章的標題是「向上挑戰高峰，或是小心下檔風險」，標題下方是以粗體字印刷的五位偉大操盤手姓名，這些都是該週刊曾經訪問過的對象。鐘斯是第一人選，而我則是第五個。在場的每個人都開始讀起這篇報導。我的照片被放在第十五頁的一個標題旁邊，那個標題是「兩位賺錢一位賠：看三位超級操盤手在十三號星期五的表現」，文章接下來敘述我如何在那週賺了五十萬美元，而雖然我不想和平部位，但由於必須飛到歐洲為我的海外基金籌集資金而被迫平倉。文章最後以我的一句話作結尾：「我正要前往歐洲，可是市場在出發前給了我臨別一吻，我想在這種匆忙的狀況下，我這次的表現算是夠好的。」


    「好啦！現在他就在諸位的面前了，」桑德斯說：「請讓我向各位鄭重介紹，馬丁·舒華茲。」


    這真是令人頭痛的事。現在我站在這裡，靠著販賣我最滿意的商品──我自己，華爾街的冠軍操盤手──來募集資金。《巴倫週刊》才剛剛為我打上品質保證的正字標記，我頓時覺得自己好像地產大亨唐納·川普
    (Donald Trump)。你聽川普講話，語氣總是那麼具有說服力，他賣的就是他最棒的產品—自己—即使他的心理醫生知道他真正的狀況，可是川普的言談總讓人覺得他是世界上最厲害的人。


    這就是當我描述自己將如何打造金融王國時的感覺。我的基金將會成為最大和績效最好的，每個在場的人也都能感受到這份信心。真要感謝《巴倫週刊》那篇報導，使我成為像川普一樣響噹噹的名人。在地毯商人、凱揚和席克史潘斯那種凡事向「錢」看的人眼中，我就是那個能幫他們賺到錢的人。


    會議結束，巴加瓦把我拉到一旁，「馬丁，你今天晚上要幹嘛？」他問。我沒什麼計畫，正打算到處逛逛，因為桑德斯和布蘭特要趕到歐陸去，我直到下週才會前往日內瓦和他們會合。」「我被邀請去參加一個聚會，」巴加瓦說：「凱揚的女兒要和謝克的兒子結婚，根據我們的習俗，新娘的父親要在婚禮一週前辦宴會。我和謝克談過，他說如果你能來參加，他將感到非常榮幸。」


    「當然沒問題啊！」我回答。那場宴會將是我進入另一個世界一窺究竟的大好機會，那個世界裡有著我前所未見的財富。


    「很好，」巴加瓦說：「新娘的哥哥卡姆蘭·凱揚會在晚上七點打電話給你。你會和一些很有意思的人見面，我想你會很喜歡那個場合。」


    ## 錢匯進來了……可是全部沒名字！


    開車到謝克在鄉間的房子，就像開車到一個傳奇故事中才會出現的地方。


    他的房子坐落在倫敦市區外二十英里的一片起伏丘陵上，在出城的路上，我聽說了卡姆蘭在他父親的銀行中擔任分行經理的職務。我們在一片大停車場中，把車停在席克史潘斯那部豪華的房車後面。那部名貴的賓利房車是那麼華麗，至少值個幾十萬美元，不過在謝克的停車場裡停放的車子，全都是那種車。謝克站在入口處歡迎客人，他真是一個親切的主人。他主動走向我，並把我介紹給家人和朋友。「馬丁，這是我的弟弟，他是世界橋牌冠軍呢！」「馬丁，這是酋長，他控制了奈及利亞境內大部分的油田。」……


    謝克帶我在屋內四處參觀。他告訴我，這幢房子至少有三百五十年曆史，是由查理一世國王建造、用來金屋藏嬌的祕密處所。他帶我來到一間餐廳，裡面有一張極大的桃木餐桌，周圍放置著喬治三世時代風格的雕花銀質椅子。「來吧，試坐一下這種椅子。」謝克說；我上前拉了一張椅子，但幾乎沒辦法拉動。「它們都是實心的，每把椅子重八十磅。」


    我們接著走到起居室。「馬丁，」謝克挽著一位非常美麗的女人，「我希望你來認識一下班納姬·布托（Bernadino Buto），她是我們家族的好朋友。」她看起來一點也不像我常在電視上看到的那位女政治家（布托曾任巴基斯坦總理，二〇〇七年返回巴基斯坦參選總統期間遇刺身亡），她裹著一塊黑褐色的布篷，像苦行僧一樣削瘦的臉龍脂粉未施，又直又黑的頭髮用一條黑布頭巾綁在後面，充滿光澤的身上穿著閃爍著金銀光芒的長袍，一條金鏈掛在線條分明的肩膀上，而鏈子上則懸著黑色的香奈兒小筆記本。香奈兒的珠子、鞋子和香水都是她的最愛。這個女人身上，散發著一股濃濃的暴發戶氣息。


    「馬丁才剛剛上了《巴倫週刊》的頭版。」謝克驕傲地說，布托點頭稱許，我簡直不敢相信，我這個紐海文來的鄉下小子，竟然成了這一屋子大人物中的大人物。


    我穿過花園走到草地上，那裡已經搭起了兩座帳篷。其中一個供應雞尾酒，另外一個則供應食物，有來自全世界各地的名產：鯽魚子醬、鵝肝餅、烤乳豬、龍蝦，數量多到遠超過實際所需，而且極盡奢華之能事。我等不及要好好嘗嘗這些人間美味，現場還有跳肚皮舞、吞劍以及噴火等表演，都是非常精彩的餘興節目，再加上無與倫比的美食，我真的從沒有看過像這樣的場面。


    凱揚送我回飯店時已經是凌晨兩點了，但是我根本無法入睡。我不需要睡眠，因為美夢已經成真了。我本來還在為海外基金擔心，但現在我已經成為市場的明星。整個晚上都不停地有人將名片遞給我，他們都相信我可以讓他們變得更富有。


    接下來的行程也進展得幾乎同樣順利，日內瓦、蘇黎士、巴黎，我每到任何一個地方，都是那個榮登《巴倫週刊》頭版的風雲人物。當我在甘迺迪機場落地時，我一刻不停地直奔我那間華麗的新辦公室，然後把這次行程中拿到的名片加以分類和排序。


    幾週之後，銀行匯款開始源源湧入，但都只有數額而沒有匯款人名字。我沒有辦法從這些匯款的背景、新整理好的名片，跟那些剛結交到的外國富豪朋友們找出關聯性。這些匯款都來自百萬達、根西島（Guernsey）、曼島（the
    Isle of Man）和開曼群島等地的銀行。我們一天當中會收到五萬、一百萬或二百萬美元的匯款，但是卻一點也看不出到底是誰匯的。我們打電話給那些匯款銀行詢問，但是沒有人願意給我們任何一個名字。他們說他們只管數字，其他什麼都不知道。


    就這樣，沙伯林納海外基金成為一個總額二千萬美元，卻沒有出資人名單的基金。就我所知，我的投資人有可能是巴拿馬強人諾瑞加、格達費、阿敏，或許也可能是某個更糟糕的邪惡之徒。他們告訴我，不必為此擔心，我並不需要知道投資人到底是誰，只要負責賺更多的錢，每個人就可以各取所需、皆大歡喜了。


    ## 你是冠軍操盤手，so？


    ### 為有錢人操盤，沒想像中容易


    我躺在床上，把鬧鐘調到傍晚七點，然後閉上眼睛昏睡過去。那是一九九〇年十月二十九日星期一，下午六點半，我才剛從辦公室回到家裡。


    真是忙亂得不得了一個月，我正打算和客戶在全紐約最棒的魯提斯義大利餐廳共進晚餐前，先小睡片刻。我已經要求沙伯林納合夥基金和沙伯林納海外基金的投資人在十一月前讓我知道，他們是否在下個年度還會繼續投資。所以整個十月份當中，我除了要


    做例行工作外，還要不停地向客戶解說，過去一年中我為他們賺了多大的一筆財富。如果你正在操作一個基金，可無法承受損失任何一個客戶所帶來的後果。在某種程度上，他們就像是一羣生命共同體，一旦有人跳船，其他人會馬上跟進。


    ### 不賺錢，誰管你是冠軍操盤手？


    當時我在股票市場的績效是一八％，高出大盤許多，但在和客戶的會談當中我發現，自己面臨三個問題。第一是我收取的費用。我是史瓦格書中指的「金融怪傑」之一，同時也是市場高手，但我發現如果我要承受為別人操作資金的重大壓力，就一定要收取更高的報酬。我想把基金管理費調高到和鐘斯、考夫納和貝肯那些人一樣的水準，問題是，這三個人操作的都是期貨基金，而我不是。


    沙伯林納合夥基金和沙伯林納海外基金都設定只以資金的二五％從事期貨交易，另外七五％則從事股票交易，所以這兩個基金都不是期貨基金，只能算是股票基金，而大部分的股市基金經理人收取的是「一加二〇」型的報酬。所謂「一加二〇」，就是總資金一％的固定年管理費再加上獲利二〇％。只有市場上的頂尖高手，也就是那些操作純粹期貨基金的傢伙，才有這個條件要求「四加二〇」的報酬──而那正是我想要的價碼。這表示，若以一八％的報酬率來計算的話，我會得到比總獲利的三分之一還要多。所以有很多投資人發現，這對他們來說，不是很划算的買賣。


    我的第二個問題，是當時的市場狀況。市場整年都呈現非常不規則的走勢，一九八九年十一月我開始為兩個基金操盤時，市場在我的移動平均線上下沖刷洗盤，所以我採取了比較保守的策略，並根據市場上一些企業接收的計畫或小道消息建立了幾個部位，希望藉此產生一些穩定的獲利來支援我在Ｓ＆Ｐ指數期貨交易上的困境。我買進了一些林傳播公司（Lin
    Broadcasters）和喬治亞海灣公司（Georgia G）的股票，但只要市場出現謠言，那些個股的買賣價差都會明顯拉大，而資金調度的考量會破壞我在短線上的獲利。由於我的基金有一部分算是期貨基金，依照期貨法規，每個月

    '
  mdcn: '

    回想一九六〇年代，當我還在商學院念書時，避險基金是一種有限的合夥關係（Limited Partnership），其中的基金經理人屬於一般的合夥人，而那些擁有一百萬美元以上資金、所謂多角化投資的富有投資人就屬於有限合夥人。按照美國的法令，基金不能接受超過九十九位、投資金額低於五十萬美元的投資合夥人，而且必須以美國股票為主要投資標的。


    到了一九八〇年代末期，一切都改變了。傑索羅斯、朱利安·羅伯森（Julian Robertson）以及麥可·史丹哈特（Michael Steinhardt）之類的避險基金經理人都募集了數十億的資金，如此龐大的金額使他們無法選出足夠的美國國內股票當投資標的，所以他們就把注意力轉移到廣大的國際市場，使他們得以有更大的舞臺發揮並運用更高的財務槓桿。他們設立了美國證管會無法管理的海外基金，並開始在全球的外匯和利率市場從事投機交易。他們會介入美元兌日幣的市場，或者是美國公債對德國公債的價差交易。


    為了要和這些真正大型的投资機構競爭，我必須要設立兩個基金。其中的國內基金，名稱是沙伯林納合夥基金（Stanina Partners L.P.），而海外基金則稱為沙伯林納海外基金（Stanina
    Offshore Fund L.P.）。我將這兩個基金的最小投資金額都設為一百萬美元，而且資金投入後一年內不得領回，這個做法可以讓我不必擔心有人會干涉我的操作，使我享有更多的自主性。


    良機當前，我不去倫敦了……


    由於我是冠軍操盤手，所以我收取4%的固定基金管理費，再加上總獲利的20%。而由於投資人其實是投資在我個人身上，所以有必要把我的操作風格和方法詳細介紹。在營運計畫書中，我強調我的做法和一般的資金操盤手不同，我同時操作股票、選擇權以及期貨，而且從過去的紀錄可以知道，我在這三種領域都能保持持續獲利的績效。在同一段時間中，我可能無法和個別市場中的特定操盤手賺同樣多的錢，但是以長遠表現來看，我在各方面都勝過他們。我是冠軍操盤手，專欄作家約翰·李休曾經在《巴倫週刊》這麼說過，而傑克·史瓦格也在《金融怪傑》一書中表示過同樣的意見。


    為我的國內基金募集資金，還算是我能力所及的事。就像我在安默斯特寫畢業論文一樣，我拿起一疊紙卡做紀錄，但這回上面寫的可不是凱因斯或亞當·斯密的經濟學理論，而是我腦海中所能想到擁有一百萬美元資金的人名和他們的電話號碼。我一一打電話給他們、寫信給他們、和他們見面喝一杯、寄給他們營運計畫書，也寄給他們所有介紹我成為冠軍操盤手事蹟的媒體剪輯，其中包括李休那篇文章的副本及史瓦格的書。


    我一再打電話、重複寫信，贊助他們的慈善捐款，寄給他們另一份營運計畫書以及那些剪報。我懇求他們到我那位於雷克辛頓街七五〇號新建大廈的頂樓、能以完善角度俯瞰中央公園的新辦公室參觀一下。當他們出現時，我就邀請他們到奧黛莉精心布置的會客室，裡面有後文藝復興風格的家具、巴洛克時期立體派畫風的古墳作品，以及佛雷斯哥和柏雷特提供的現代藝術品。就這樣，到了十月時，我已經為沙伯林納合夥人募集了二千二百萬美元（包括我自己投入的五百萬美元，並擔任常任合夥人）。


    不過為沙伯林納海外基金募集資金，並不是憑我一己之力可以辦到的。我曾經到過歐洲幾次，但是對那些國際型的大投資者一個都不認識。一般而言，美國的資金經理人找尋國際投資者方法，都是由一些具有國際良好關係的掮客來進行，並經由他們將資金操盤手引入給那些國際投資人。


    這個方式所面對的問題是：可能有些掮客會要求巨額佣金，但無論如何我還是決定一試。有一個來自添惠公司（Dan Weiss）的傢伙是第一個和我接觸的人，他宣稱自己有一些「了不得」的國際聯繫管道。我可不打算把我獲利的25%給他，或其他任何一個和他一樣的寄生蟲。所以我在外頭散話，說我最多只願意依客戶的多寡支付佣金，只要他們幫我介紹客戶，我就付他們定額佣金，這就是我的條件。


    有兩家經紀公司接受了我的條件。奇德（Kide）公司的保羅·桑德斯（Paul Sanders）和皮博迪（Pebody）公司的凱文·布蘭特（Kevin Brant）和我接上了頭，兩家都是經營資金募集業務的公司。他們有個印度籍同事名叫拉柯許·巴加瓦（Rakesh
    Baggawa），他和印度、巴基斯坦的許多富豪有很好的關係。


    我一直認為印度人和巴基斯坦人是很难纏的敵人，但當我很顯然的可從中得到賺錢的機會時，那又有什么關係？布蘭特和桑德斯請巴加瓦於十月中旬在倫敦安排幾個會議，也為我排定了倫敦這一系列會議的時程。


    我很期待這趟旅程。我非常喜歡倫敦，記得一九六七年那次暑假在倫敦的日子，以及當年想像著能到倫敦經濟學院拿一個經濟學碩士的夢想。我曾經走進當地的賭場，期望有一天能夠在賭桌上大撈一票；曾經搭乘火車到愛普森去看那頭小馬；曾經搭乘雙層巴士到哈洛德百貨公司，並期待哪一天能有機會再回到那裡大肆採購。


    我還曾經經過麗池飯店、康諾特飯店、伯克萊飯店以及克萊麗奇飯店，夢想著哪一天能夠住在這些全英國最金碧輝煌的旅館，並從一部勞斯萊斯轎車中走出來，由打著領結、穿著紅色短禮服外套及閃亮黑皮鞋的門僮為我開門。克萊麗奇飯店是我這次行程最想住的飯店，所以我透過關係幫我弄到了一個房間。


    十月十三日星期五的早晨，我轧平了所有的部位，在司機來接我去機場前無聊地看著報價螢幕解悶，當時市場正在重挫中。那一陣子市場中的話題是聯合航空的融資收購案（UAC
    takeover Bid, UAC TBO），在這個融資收購案中聯合航空的每股叫價是三百美元，但是突然間融資者縮手，使這筆交易頓時化為泡影。這個案子，正是垃圾債券（Junk
    Bond，信用評等較差的企業所發行的高收益率債券）風光年代的產物。市場的反應告訴我們，該是為一九八○年代的過度擴張付出代價的時候了。


    我馬上覺得這筆融資收購案的失敗是一個重要的訊號，代表一個操盤手十年當中都難得碰上幾回的賺大錢良機，即將要來臨了。而我就坐在這裡，準備好隨時採取必要的行動。我所有的部位都已轧平，就像是坐在一堆現金上面似的。我打電話給布蘭特和桑德斯。「取消這次行程，」我說：「在這種市場狀況下，我哪兒都想去。他們完全了解。對一個操盤手來說，那種個人的緊急狀況——諸如死亡、結婚或生病，都不是用來取消會議的理由，但是為了賺錢而取消和客戶的約會，是絕對可以被接受的。他們打電話給巴加瓦，把我的會議行程延到下個禮拜。巴加瓦說沒問題，為了不對我有利的市場狀況而取消和客戶的會議，只會加強我的名聲。我就是那個擁有點石成金術的傢伙，我也是華爾街的優勝者，一名冠軍操盤手。


    ## 晚一點去歐洲，多賺了五十萬美元


    我看到市場重挫了一整天，下午稍晚時，道瓊指數已經下跌了一九〇點。每一個人心裡想的都是：「又來了！」大家都相信，市場將會出現像一九八七年一樣的崩盤局面。


    好極了！我知道該怎麼做。在一九八七年的股市崩盤當中，投資人因為認為股市已經泡沫化，所以搶進債券市場，把公債的價格拉高。換言之，投資人會把資金從股票市場拉出來，轉而投入固定收益資產的證券。債券期貨市場在下午三點收盤，所以，在兩點五十八分時我開始買進債券；股票市場到四點才收盤，而當股市繼續下挫的當口，債券價格一飛沖天。我很快地在債券期貨的第二交易時段（直到下午四點十五分）結束前，轧平所有的債券期貨部位，賺了七萬美元——成果算不錯，但我確定最好的狀況還沒出現。收盤後，我接到專欄作家李休打來的電話（他常打來問我對市場的看法），我告訴他，我強力看多，而且已經持有多頭部位了。到了十六日星期一，我在《巴倫週刊》上看到以下這篇短文：


    > 我在上週五市場收盤後訪問傳奇操盤手馬丁·舒華茲時，他表示對於當天股市重挫一九〇點的原因一無所知。「真正開始令我感到煩心的，」他說：「是每一個人都股市賺到了錢。從過去的事實來看，當市場在一年當中上漲超過三〇%的時候，情勢就變得相當危險了。」但舒華茲，這位我們所知市場上少數富而有又誠實的操盤手，告訴我他在當天稍早才剛剛軋平所有部位。「但我真的不認為市場的狀況會糟到什麼樣的地步，」他表示：「目前的利率水準比起一九八七年要來得低，而且本益比也比一九八七年要低得多。就期貨市場的表現來看，或許股市在星期一要開低六十或七十點都很難。我目前傾向於仔細研究我的技術圖，然後找進場點作多。」


    李休簡直像我的發言人。不過，當你在市場上享有極高的知名度時，你說的話最好是對的。幸好，這一次我真的說對了。星期一早晨起床後，我第一件事就是搶進那些我已經計畫好要買的股票，像是菲利普·莫里斯（Philip
    Morris）、房利美（Fannie Mae）和房地產（First Eagle Real Estate）等。這些都是在上周五的跌勢中抗跌性甚強的個股，當市場反彈時，它們就會是帶領一飛沖天的超強股。根據一九八七年崩盤的經驗，我預期市場會開低，但是當市場稍後出現反彈並收高八十八點後，我就開始軋平我的多頭部位。到星期二下午我開始將部位轉向，放空
    S & P 指數期貨。如果每個都在買進，就是賣出的最好時機，而我又對了一次。我在星期三把所有部位軋平。就在我赴歐洲行程延後的一星期當中，我賺了五十萬美元。


    ## 有錢賺，把靈魂賣給魔鬼也不在乎的人


    我終於要出發去歐洲，為我的海外基金籌集資金。舒適地坐在前往倫敦的頭等艙中，我開始專心思考要怎麼樣才能說服那些國際投資人，把資金投入我的基金裡。


    在克萊麗奇飯店的早餐會議進行得順利極了。除了巴加瓦、桑德斯、布蘭特和我之外，還有一位大型不動產開發國際性企業家謝克（Shaich）參加，他的父親曾經是某個我從來沒聽說過的地方的市長；然後是一位至今我都不知道他是何許人的地毯大亨；此外，還有歐瑪·凱揚（Omar
    Khayyam），他是某個主要中東銀行的倫敦分行經理；以及施德霖·席克史潘斯（Sterling Six-Percent），他在美國以惡意購併著稱的英國控股公司前任總裁。我一點也不知道他們是怎麼被找來的，但我很清楚他們每個人都是那種只要有錢賺，把靈魂賣給魔鬼都不在乎的人——這是國際性商業行為的常態。


    我第一眼就對席克史潘斯很有好感，因為我覺得他和我一樣，是那種白手起家、靠自己努力成功的人。而且他還買下過一支職業足球隊，一九六七年的暑假我曾經看過那支球隊的比賽，那時我還只能坐在便宜的席位上，吃著洋芋片。而現在，在二十二年的後，我可是坐在克萊麗奇飯店裡和這些大亨們一起享用著豐盛的早餐。


    巴加瓦介紹完他的客戶後，桑德斯正式介紹我。「如果諸位曾經讀過《金融怪傑》這本書，」桑德斯手裡拿著那本書向他們說：「就一定聽過馬丁的大名。如果沒有看過，這裡有一份《巴倫週刊》的文章，可以從中看到一篇有意思的報導。」


    說完，他就伸手從桌子底下拿出六份十月二十三日《巴倫週刊》的影本。那篇文章的標題是「向上挑戰高峰，或是小心下檔風險」，標題下方是以粗體字印刷的五位偉大操盤手姓名，這些都是該週刊曾經訪問過的對象。鐘斯是第一人選，而我則是第五個。在場的每個人都開始讀起這篇報導。我的照片被放在第十五頁的一個標題旁邊，那個標題是「兩位賺錢一位賠：看三位超級操盤手在十三號星期五的表現」，文章接下來敘述我如何在那週賺了五十萬美元，而雖然我不想和平部位，但由於必須飛到歐洲為我的海外基金籌集資金而被迫平倉。文章最後以我的一句話作結尾：「我正要前往歐洲，可是市場在出發前給了我臨別一吻，我想在這種匆忙的狀況下，我這次的表現算是夠好的。」


    「好啦！現在他就在諸位的面前了，」桑德斯說：「請讓我向各位鄭重介紹，馬丁·舒華茲。」


    這真是令人頭痛的事。現在我站在這裡，靠著販賣我最滿意的商品──我自己，華爾街的冠軍操盤手──來募集資金。《巴倫週刊》才剛剛為我打上品質保證的正字標記，我頓時覺得自己好像地產大亨唐納·川普
    (Donald Trump)。你聽川普講話，語氣總是那麼具有說服力，他賣的就是他最棒的產品—自己—即使他的心理醫生知道他真正的狀況，可是川普的言談總讓人覺得他是世界上最厲害的人。


    這就是當我描述自己將如何打造金融王國時的感覺。我的基金將會成為最大和績效最好的，每個在場的人也都能感受到這份信心。真要感謝《巴倫週刊》那篇報導，使我成為像川普一樣響噹噹的名人。在地毯商人、凱揚和席克史潘斯那種凡事向「錢」看的人眼中，我就是那個能幫他們賺到錢的人。


    會議結束，巴加瓦把我拉到一旁，「馬丁，你今天晚上要幹嘛？」他問。我沒什麼計畫，正打算到處逛逛，因為桑德斯和布蘭特要趕到歐陸去，我直到下週才會前往日內瓦和他們會合。」「我被邀請去參加一個聚會，」巴加瓦說：「凱揚的女兒要和謝克的兒子結婚，根據我們的習俗，新娘的父親要在婚禮一週前辦宴會。我和謝克談過，他說如果你能來參加，他將感到非常榮幸。」


    「當然沒問題啊！」我回答。那場宴會將是我進入另一個世界一窺究竟的大好機會，那個世界裡有著我前所未見的財富。


    「很好，」巴加瓦說：「新娘的哥哥卡姆蘭·凱揚會在晚上七點打電話給你。你會和一些很有意思的人見面，我想你會很喜歡那個場合。」


    ## 錢匯進來了……可是全部沒名字！


    開車到謝克在鄉間的房子，就像開車到一個傳奇故事中才會出現的地方。


    他的房子坐落在倫敦市區外二十英里的一片起伏丘陵上，在出城的路上，我聽說了卡姆蘭在他父親的銀行中擔任分行經理的職務。我們在一片大停車場中，把車停在席克史潘斯那部豪華的房車後面。那部名貴的賓利房車是那麼華麗，至少值個幾十萬美元，不過在謝克的停車場裡停放的車子，全都是那種車。謝克站在入口處歡迎客人，他真是一個親切的主人。他主動走向我，並把我介紹給家人和朋友。「馬丁，這是我的弟弟，他是世界橋牌冠軍呢！」「馬丁，這是酋長，他控制了奈及利亞境內大部分的油田。」……


    謝克帶我在屋內四處參觀。他告訴我，這幢房子至少有三百五十年曆史，是由查理一世國王建造、用來金屋藏嬌的祕密處所。他帶我來到一間餐廳，裡面有一張極大的桃木餐桌，周圍放置著喬治三世時代風格的雕花銀質椅子。「來吧，試坐一下這種椅子。」謝克說；我上前拉了一張椅子，但幾乎沒辦法拉動。「它們都是實心的，每把椅子重八十磅。」


    我們接著走到起居室。「馬丁，」謝克挽著一位非常美麗的女人，「我希望你來認識一下班納姬·布托（Bernadino Buto），她是我們家族的好朋友。」她看起來一點也不像我常在電視上看到的那位女政治家（布托曾任巴基斯坦總理，二〇〇七年返回巴基斯坦參選總統期間遇刺身亡），她裹著一塊黑褐色的布篷，像苦行僧一樣削瘦的臉龍脂粉未施，又直又黑的頭髮用一條黑布頭巾綁在後面，充滿光澤的身上穿著閃爍著金銀光芒的長袍，一條金鏈掛在線條分明的肩膀上，而鏈子上則懸著黑色的香奈兒小筆記本。香奈兒的珠子、鞋子和香水都是她的最愛。這個女人身上，散發著一股濃濃的暴發戶氣息。


    「馬丁才剛剛上了《巴倫週刊》的頭版。」謝克驕傲地說，布托點頭稱許，我簡直不敢相信，我這個紐海文來的鄉下小子，竟然成了這一屋子大人物中的大人物。


    我穿過花園走到草地上，那裡已經搭起了兩座帳篷。其中一個供應雞尾酒，另外一個則供應食物，有來自全世界各地的名產：鯽魚子醬、鵝肝餅、烤乳豬、龍蝦，數量多到遠超過實際所需，而且極盡奢華之能事。我等不及要好好嘗嘗這些人間美味，現場還有跳肚皮舞、吞劍以及噴火等表演，都是非常精彩的餘興節目，再加上無與倫比的美食，我真的從沒有看過像這樣的場面。


    凱揚送我回飯店時已經是凌晨兩點了，但是我根本無法入睡。我不需要睡眠，因為美夢已經成真了。我本來還在為海外基金擔心，但現在我已經成為市場的明星。整個晚上都不停地有人將名片遞給我，他們都相信我可以讓他們變得更富有。


    接下來的行程也進展得幾乎同樣順利，日內瓦、蘇黎士、巴黎，我每到任何一個地方，都是那個榮登《巴倫週刊》頭版的風雲人物。當我在甘迺迪機場落地時，我一刻不停地直奔我那間華麗的新辦公室，然後把這次行程中拿到的名片加以分類和排序。


    幾週之後，銀行匯款開始源源湧入，但都只有數額而沒有匯款人名字。我沒有辦法從這些匯款的背景、新整理好的名片，跟那些剛結交到的外國富豪朋友們找出關聯性。這些匯款都來自百萬達、根西島（Guernsey）、曼島（the
    Isle of Man）和開曼群島等地的銀行。我們一天當中會收到五萬、一百萬或二百萬美元的匯款，但是卻一點也看不出到底是誰匯的。我們打電話給那些匯款銀行詢問，但是沒有人願意給我們任何一個名字。他們說他們只管數字，其他什麼都不知道。


    就這樣，沙伯林納海外基金成為一個總額二千萬美元，卻沒有出資人名單的基金。就我所知，我的投資人有可能是巴拿馬強人諾瑞加、格達費、阿敏，或許也可能是某個更糟糕的邪惡之徒。他們告訴我，不必為此擔心，我並不需要知道投資人到底是誰，只要負責賺更多的錢，每個人就可以各取所需、皆大歡喜了。


    ## 你是冠軍操盤手，so？


    ### 為有錢人操盤，沒想像中容易


    我躺在床上，把鬧鐘調到傍晚七點，然後閉上眼睛昏睡過去。那是一九九〇年十月二十九日星期一，下午六點半，我才剛從辦公室回到家裡。


    真是忙亂得不得了一個月，我正打算和客戶在全紐約最棒的魯提斯義大利餐廳共進晚餐前，先小睡片刻。我已經要求沙伯林納合夥基金和沙伯林納海外基金的投資人在十一月前讓我知道，他們是否在下個年度還會繼續投資。所以整個十月份當中，我除了要


    做例行工作外，還要不停地向客戶解說，過去一年中我為他們賺了多大的一筆財富。如果你正在操作一個基金，可無法承受損失任何一個客戶所帶來的後果。在某種程度上，他們就像是一羣生命共同體，一旦有人跳船，其他人會馬上跟進。


    ### 不賺錢，誰管你是冠軍操盤手？


    當時我在股票市場的績效是一八％，高出大盤許多，但在和客戶的會談當中我發現，自己面臨三個問題。第一是我收取的費用。我是史瓦格書中指的「金融怪傑」之一，同時也是市場高手，但我發現如果我要承受為別人操作資金的重大壓力，就一定要收取更高的報酬。我想把基金管理費調高到和鐘斯、考夫納和貝肯那些人一樣的水準，問題是，這三個人操作的都是期貨基金，而我不是。


    沙伯林納合夥基金和沙伯林納海外基金都設定只以資金的二五％從事期貨交易，另外七五％則從事股票交易，所以這兩個基金都不是期貨基金，只能算是股票基金，而大部分的股市基金經理人收取的是「一加二〇」型的報酬。所謂「一加二〇」，就是總資金一％的固定年管理費再加上獲利二〇％。只有市場上的頂尖高手，也就是那些操作純粹期貨基金的傢伙，才有這個條件要求「四加二〇」的報酬──而那正是我想要的價碼。這表示，若以一八％的報酬率來計算的話，我會得到比總獲利的三分之一還要多。所以有很多投資人發現，這對他們來說，不是很划算的買賣。


    我的第二個問題，是當時的市場狀況。市場整年都呈現非常不規則的走勢，一九八九年十一月我開始為兩個基金操盤時，市場在我的移動平均線上下沖刷洗盤，所以我採取了比較保守的策略，並根據市場上一些企業接收的計畫或小道消息建立了幾個部位，希望藉此產生一些穩定的獲利來支援我在Ｓ＆Ｐ指數期貨交易上的困境。我買進了一些林傳播公司（Lin
    Broadcasters）和喬治亞海灣公司（Georgia G）的股票，但只要市場出現謠言，那些個股的買賣價差都會明顯拉大，而資金調度的考量會破壞我在短線上的獲利。由於我的基金有一部分算是期貨基金，依照期貨法規，每個月

    '
