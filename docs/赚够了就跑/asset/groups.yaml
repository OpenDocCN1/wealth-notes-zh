    任何變化、能讓波奇先生賺錢時馬上打電話過去。波奇馬上就接了那通電話。


    「是啊，考林斯，你聽到了什麼能賺錢的消息嗎？」


    「是的，馬丁·舒華茲說你一定要趕快買進一些※*&#*。＃。」「然後考林斯把電話掛斷。


    如同我所預料的，波奇馬上就回電給考林斯。「考林斯，你這個渾球，你在用誰的電話？我要找你算帳！我要把你從那裡揪出來！你用的是誰的電話？我是重要人物，膽敢如此對我！我一定要找你算帳！」——從電話裡的語氣，我們可以想像波奇的前額血脈貫張，話筒被他那汗濕的手掌給淹沒。波奇已經完全失去了他的幽默感。


    能夠把波奇的情緒給搞壞，哪怕只有幾分鐘的時間，都讓我感到非常愉快。我設定了目標，未來所操作的基金一定要超過波奇這個傢伙，我一定會擊敗他，也一定會擊敗他所有的人。我要成為市場中的頂尖高手，就算付出再大的代價也在所不惜。


    這個目標果然讓我付出慘痛的代價，連老命都差點賠了進去。


    # 謝謝你，書店裡的老太太


    我終於承認，我真的不適合操作別人的資金。我不喜歡向任何人報告，也不喜歡有人在我的背後指揮我做那，更痛恨別人老是拿其他操盤手的績效和我做評比。我是一個靠掌握市場脈動而進場操作的人，我喜歡在市場裡短時間內進進出出，可是當你操作一大筆資金時，這一切都會變得'
  - '[PAGE 334]


    相當困難。更別提我喪失了多少操作上的自主性，而自主性卻是我當初之所以決定要自立門戶，獨力操作自有資金的主要原因。


    但是當我跳上吉普車，把帆布頂篷收起來，開車經過亞斯本機場時，內心的另一個部分又開始提醒自已，如果放棄操作別人的資金，我也會損失很多東西。


    那些我到目前為止還不曾擁有過的——那些停放在亞斯本機場停機坪上的豪華私人飛機，如果我放棄操作別人的資金，就不可能享有像那些市場頂尖高手一樣的風光模樣。


    我得去小尼爾飯店的那家書店買本《金融怪傑》，給那幾個在俱樂部裡的網球高手看。在我想要靠著打網球來重新恢復體力的當下，這個傢伙很有耐心地拍幾百球往我身上打來。他對市場很感興趣，所以我想他一定會很喜歡讀這本《金融怪傑》，尤其是我的大名也在這本書裡被詳細地介紹。


    我在書店裡拿了書，排隊等著付帳。排在我前面的，是一位頭髮裝飾得很考究的六十多歲老婦人，她轉過頭來，瞄見我手上拿的書，於是問我：『原來你也想成為『金融專家』呀？』


    我不知道該說些什麼，只是看著這位婦人。她的衣著光鮮整潔，家裡一定有某位祖先是乘坐五月花號到美洲來的早期移民。她大概六十開外，恐怕在我還沒出生以前就已經在收取股利或是剪集商店的折價券了。


    她看起來非常自在、沉靜、健康，一副與世無爭的樣子，令人感到相當舒服。突然之間一切都變得很清楚。我不想當金融專家，我想要當一個和她一樣的人。


    「不，女士，」我說：「我已經是個金融專家了。而且，相信我，這可不像您所想像的那麼'
  - '[PAGE 335]


    好。「就在那一刻之間，我完全地把自己從那些壓力中釋放出來，不再想如何在這個資金操作的遊戲中打敗波奇。當年我是在亞斯本下決定心要開始經營基金的，現在我也在亞斯本決定要把基金給收起來。在我的心中、腦海中，清楚地知道我剛剛做了一生中最棒的一筆交易。


