  - '[PAGE 168]


    種自我保護的投資，因為只要你對行情的看法是錯誤的，停損將使你免於因保留虧損部位而遭受更嚴重的損失，讓你不至於掉進一個可能愈挖愈深的無底洞，更可以保留東山再起的實力。停損會自動把你的腦袋從負面思考拉回中性的思路中。雖然在停損後，你的錢不會回到原點，但是心智將回到能夠重新組織和產生新點子的狀態，不再因為虧損部位而使腦袋停滯不前。你在一筆交易中虧損愈多，客觀性就變得愈低。迅速地从一個賠錢的交易中脫身，可以使頭腦清醒，並使客觀性得以重建。在片刻的喘息後，如果你能夠客觀而理性地證明原先的想法依然可行，可以重新建立同樣的部位，但要隨時提醒自已，市場上多的是機會，不一定非要單戀一朵花。藉著停損，你的交易資金得以保護周全，你也因此爭取到下一個高獲利、低風險交易機會的參與權。'
