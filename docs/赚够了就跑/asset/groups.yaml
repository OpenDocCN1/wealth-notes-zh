    # 誠心感謝


    # 嗚……我把報價機藏在高爾夫球袋裡


    一九九一年八月，我回到罕普敦的海邊別墅，披著海灘浴衣，操作著自己的資金。這種感覺真好。蘭迪斯說服我重拾很久沒打的高爾夫球，奧黛莉和我甚至加入當地的一個高爾夫俱樂部。高爾夫球並不是我自己挑選的活動，想要打好高爾夫，需要花很多時間去練習，而且打高爾夫本身也是一件很費時的事，幾乎要花上一天的時間。但這是蘭迪斯建議我做的運動，他要我試著在球場上打發時間。


    我們加入高爾夫俱樂部沒有多久，奧黛莉就找到一位銀行家和他的老婆來當我們的球伴。我們約定在上午十點半開球，但就在我們出門前，我看到S＆P指數突破了我預想的超勢軌道。我知道市場已經呈現超買狀態，所以打電話給考林斯並賣出了五十口S＆P指數期貨。我把我的行動式報價機和行動電話放進球袋裡，然後出發前往球場。


    馬丁·舒華茲'
  - '[PAGE 337]


    我們四個人再球場上揮著桿，聊著一些無關緊要、言不及義的話題。照說，我們應該是耍享受一些快樂时光的，但我心裡想的只有那五十口S & P期指，以及如果市場反轉時我該如何處置這個部位。每一洞開球時，我都假裝在球袋裡找新球，實際上卻是在查看報價機上的市場價位。到了第六洞，狀況果然來了，市場開始反轉。我得打電話給考林斯，叫他亂平我的部位，而且馬上就得打這通電話，我沒有辦法等到第九洞休息時才打。如果那時才打，一切就太晚了。但是我不能讓任何人看出我在幹什麼。人在球場上還在做生意是一件很不禮貌的事，更何況當時奧黛莉還不知道我偷偷地做了這筆交易。


    奧黛莉和那位銀行家太太站在我們左手邊遠處的女上開球區，所以現在只有我和那個銀行家在一起。「該你了，馬丁。」他說。


    我站上開球的位置，擺好了球。這將是我今天最重要的一擊，我得好好打這一球。我回想著教練在上課時對我說的話：「把球對準你的左肩放好，頭部保持瞄球姿勢，把球桿慢慢向後拉高，左肘肘不要打彎，直揮向球。」我把球放在對齊我右肩的位置，抬起頭，把球桿胡亂向後舉，打彎左手，然後猛地揮向小白球。


    咻一聲，球飛進了樹林裡。好極了，打得好！「哇，真糟！」那個銀行家說：「你能找到球就算幸運了，馬丁。要我和你一起去找嗎？''


    「不，不，不用麻煩了。我想我知道那顆球飛到哪裡去了，而且萬一我真的找不到的話，只要再拿一顆出來就好了，像我這種爛技術再多加兩桿也沒什麼差別。"'
  - '[PAGE 338]


    我鑽進樹林裡，躲在一棵樹後面，拿出行動電話，撥了考林斯的電話號碼。「軋平那五十口，現在就賣掉。」「我在那筆交易上賺了六萬美元。沒有人比我更聰明的了，至少蘭迪斯就看得出來。」「馬丁，」他說：「你知道嗎？你真是一個不尋常的人。」「尋常？」我說，「誰會想當一個尋常的人？」從五歲開始，我就一直想要與眾不同、出人間地，心裡想的只有前進、前進、前進。我是一個操盤手，而沒有任何一個操盤手是平凡無奇的。如果我想當個平凡人，當初就會把錢放在指數基金裡，安安然穩地當個證券分析師。「馬丁，你就像個酗酒成性的酒鬼。操盤行為讓你情緒亢奮且精神狂亂，根本沒辦法拒絕這種感覺的誘惑，你也因此變得筋疲力盡、情緒低潮，就像是宿醉一樣。而當你感到沮喪、情緒低落、唯一能讓你從這種感覺中恢復過來的，就是再度進場交易，這種惡性循環就這樣一直下去，直到你病倒為止。但是，你得要找出你真正需要的是什麼才行。「心理治療師就像矯正器一樣。這正是接下來六個月中，我和蘭迪斯努力的目標。我一直在嘗試錯誤，直到開始看出什麼是我真正想要的為止。當我躺在手術臺上為自己的生命和病魔奮戰時，我就和自己約定，只要能夠活著離開醫院，以後就會花較少的時間從事交易，花更多時間來陪陪奧黛莉和孩子。'
  - '[PAGE 339]


    # 在人生的高點，急流勇退


    我現在已經擁有足夠的金錢，而且我相信，只要我需要更多，隨時可以從市場上賺到。這是上天給我的天賦。我知道如何在每天早上起床後，保持清楚的頭腦，然後從市場裡賺取二萬、四萬或八萬美元。就算我在操作基金方面沒有贏過波奇，那又怎樣？我可以在別的地方擊敗他。在我從鬼門關走過一回、失去一個孩子，和奧黛莉一同面對乳癌的威脅後，該是我停止和人一較長短，開始享受人生樂趣的時候了。我決定要在人生的最高點，急流勇退。


    但是，下一步該怎麼走？我得離開紐約。


    蘭迪斯是對的，我已經對操盤這檔事完全上癮到不可自拔了。如果我還留在紐約，保持原來的生活型態，繼續和那些老朋友來往的話，會不由自主地想走回頭路，繼續沉溺在和波奇那種人競爭的狀態裡。反正，我對紐約那寒冷而灰暗的天氣也感到厭倦，希望能夠到一個溫暖而風光明媚的地方去。我決定要把自己從谷底拯救出來，我要舉家搬到佛羅里達去。


    要改變生活型態，並完全切斷和紐約之間的關聯，對我而言是一件非常需要勇氣的事情。奧黛莉和孩子們都不想搬家，他們這一輩子都住在紐約這個大都市，對佛羅里達能有什麼了解？佛羅里達是個適合退休人士居住的地方，而我才四十八歲而已。其實我心裡也有一大半是不想去的。對我來說，搬家是個大麻煩，我得把公寓賣掉、把公司和辦公室搬走、搬運塞滿了十二個房間的家具、買間新房、重新裝潢，在房子沒弄好前我沒有固定的地方可以交易，還得再買幾部新車、替孩子們'
