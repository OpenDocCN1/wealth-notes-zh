    態，也毫無高低價的限制。現在市場的價格波動，就像暴風雨中飄浮在大海裡的救生艇一般劇烈。我得靠自己的市場感覺來操作，而我對市場的直覺告訴說，這個戲劇性的強烈反彈不可能一直持續。「黛比，」我大喊：「幫我用手價賣出一些指數期貨，然後看看接下來會怎麼走。」


    接下來發生了什麼事？市場繼續往上漲，而我持續不斷地以一次一到兩口的數量加碼放空，交易所場內的那些傢伙不斷地延遲我的成交回報，一路在執行我的交易指令前偷跑，在這兒偷我○·一點，在那兒又偷我個○·一五點。S&P指數期貨收盤在二五八·二五，而我在當天收盤時總共賣出了十二口契約，平均放空成本價為二五五美元。這對我來說算是小事一椿，我平常每天收盤時總會作多或放空個一百或一百五十口的期貨契約，但是在這種市場狀況下，我才不這麼幹呢！


    到了下午五點，我打電話到艾略特波浪理論學會（The Elliott Wave Theory）的熱線去聽聽看鮑伯·普瑞契特（Bob Prech）怎麼說。普瑞契特住在喬治亞州的甘斯維爾（Gainsville），他印行了一份名為《艾略特波浪理論學家》（The
    Elliott Wave Theories）的市場行情分析報導。普瑞契特曾經成功地預測了一九八二年開始的大多頭市場，並因此成為一九八○年代市場的大師級人物。他擁有一大堆信徒，唯他馬首是瞻。除了那份市場分析報導之外，他還設立了一個每週一、三、五下午五點更新一次內容的熱線電話。在一九八七年十月二十二日星期三那天的熱線電話中，普瑞契特表示悲觀的看法。根據熱線電話中的內容，雖然市場歷經了兩天的強烈反彈，可是行情仍然無可避免地要再度開始下挫。


    星期四早晨開盤，我和黛比通電話。普瑞契特是大師中的大師，只要他說市場會往下跌，就很可能會成為事實。不管市場是上漲或下跌，在這麼巨幅的波動行情中，我可得要時時加以掌握。


    噹！開盤的鐘聲響起。「馬丁！」黛比在電話中高聲叫著：「席爾森（Strausson，大型投資銀行）剛在市場裡下了一個一千口的賣單，他們賣出——


    「價位！價位！該死的！給我一個報價！」


    「二四〇叫出！」


    「狗屎，昨天不是收在二五八的嗎？這到底是在搞什麼鬼啊！讓我想一下，我得好好想一下。」我已經賺了多少？十二口成本在二五五的空頭部位，而現在市場上是二四〇叫出。12×500×15=90000。「馬丁」現在是二三〇叫出！一二五叫出！一二五叫出！一二五叫出！


    「契約量呢？一二五叫出多少口？」


    「如果以一二五來計算的話，只要我馬上軋平那十二口部位，就已經穩賺十八萬美元了。「到底叫出多少口？」


    「馬丁，市場上沒有任何買盤，我不知道有多少口叫出！一二〇叫出！一二五叫出！一二五叫出！」我的老天！這到底是怎麼回事啊？S＆P指數期貨的交易場成了無底洞，沒有任何人叫進。在我從事S＆P期指交易的五年來，從來沒有見識過如此陣仗。「二一〇！二〇五！马丁，市場剛剛在二〇二成交！」


    「多少口？到底成交多少口？」


    「我不知道，我沒看清楚！二〇〇成交！又成交在一九八！」


    「平倉！」我大喊著。場內那些傢伙已經開始買進了。「軋平我那十二口契約，然後馬上把成交紀錄輸入結算所的電腦裡。我不要那些渾蛋把我的成交紀錄拿去亂搞！」在市场上出现如此劇烈的波動時，不管是無心或是故意，這些傢伙會常常忘掉一些他們執行過的交易。「馬上幫我執行！」喀擦，我掛上了電話。


    我轉頭看著報價螢幕。上面出現了二〇二這個價位，接著是二〇〇，然後是一九八、一九七、一九五。過了一分鐘後，一九七、二〇〇、二〇四。市場已經開始轉向了。但這都沒有關係，我一定已經在二〇〇以下的價位軋平所有的部位了，我又大賺了一票！


    鈴······，「黨比！黨比！你幫我軋平了嗎？」


    「我在二○○幫你軋平了五口，但是他們不給我另外七口的成交回報！」


    「現在市價在哪裡？二一○嗎？價格變動得太快了，如果他們還不把那七口在二○○成交的單子回報給你，就馬上用市價幫我買進另外五口。現在就買！」那些天殺的渾蛋！他們拿我的交易指令去應付另外七口單子，讓我在這七口契約上每口起碼少賺了十點，等於三萬五千美元，搞不好，他們還要吃我更多點數。


    鈴······，「馬丁！我拿到成交回報了，五口成交在二一○，而另外二口成交在二一五。這是我能做到的最好的價格了，市場價格變動實在太快了。」「我激動得發抖，我不知道該感到高興還是不爽。我在這次十二口契約的交易中，總共賺了二十九萬美元，而那些在CME交易場內的傢伙則假借所謂「執行差價」的名義從我口袋裡拿走了五萬美元。僅僅靠著十二口契約就賺了二十九萬美元，真是不可思議！市場到底是怎麼回事？


    最後大家才知道，席爾森那一千口的賣單是幫操盤高手喬治·索羅斯（George Soros）的量子基金下到交易場的。很明顯，索羅斯對市場的看法和普瑞契特相同，並決定把他的基金所持有的二千四百日
    S & P 期指契約，在開盤時以市價殺出。根據《巴倫週刊》事後的報導，當第一波為數一千口的賣單下到交易所時，「交易場內的操盤手們聽出了鯨魚陷入困境的叫聲」。


    他們把所有的買盤撤掉，直到叫出價格掉到大約二二○○時才開始發動攻擊。索羅斯的部位大部分都軋平在一九五到二一○之間，而在短短幾分鐘之內，市場價格又彈回到二三○附近，讓一大堆新誕生的百萬富翁在交易場內狂歡慶祝。這是
    CME 曆史上最著名的一筆交易，而許多相關細節都是日後由美國地方法院的芝加哥分院傳出來的，因為索羅斯控告席爾森公司並求償一億六千萬元（隨後雙方於庭外和解）。根據內線史基尼的說法，索羅斯實際上損失了八億美元。「馬丁，他老早就已經作多了，而且是在不得已的狀況下被迫停損。「我只記得那一天我的操作績效「超越」了偉大的索羅斯。


    二三日星期五，我把那些黃金又存回了東紐約儲蓄銀行。當我獨自站在銀行專為貴賓客戶所關的房間裡，把黃金一塊塊放回保險箱時，不禁想到，這是我第二次把黃金提領出來。在這兩次經驗中，市場都回到正常狀況，而我也因此賺了不少。或許佐爾納說的對，當情況壞到我們想把部位不計一切拋出時，反而應該把部位加倍加碼。我已經有十年沒有這樣的感覺了，但是當下一次我的直覺告訴自己世界末日將要來臨時，或許我會真的照樣加倍加碼，然後還是要把我的黃金領出來。


    ## 別鐵齒，市場永遠是對的


    鮑伯·普瑞契特是所有市場分析師中最有天命的一位。他以全額獎學金進入耶魯大學就讀，並在一九七一年拿到心理學學位，然後花了幾年的時間自學技術分析相關領域，這使得他在美林證券得到一個技術分析專員的職位，就在那時開始接觸並學習洛夫·尼爾森·艾略特（Ralph
    Nelson Elliott）。


    艾略特原本是會計師和技術分析者，他在二〇和一九三〇年代中發展出一套波浪理論來分析市場，並在一九四六年出版了他一生中唯一的嘔心瀝血之作《自然的法則：宇宙的祕密》（Nature''s
    Laws: The Secret of the Universe）。從那時開始，波浪理論的操作哲學吸引了一群爲數不多、但忠誠度頗高的追隨者，其中包括了哲學家、數學家、心理學家、理則學家以及投資者。


    一九七七年時，普瑞契特從美林證券辭職，搬到喬治亞州的甘斯維爾市，開始發行市場行情報導刊物《艾略特波浪理論學家》。一九七八年，他和佛洛斯特（A. Frost，一名會計師，同時也是波浪理論的資深信徒）合寫了一本名爲《艾略特波浪理論》（Elliott
    Wave Principle）的書，並在其中以神奇的精確度，成功預測出一九八〇年代的大多頭行情。


    我也訂閱了《艾略特波浪理論學家》，因爲我總是不停地找尋一切有助於改進操作方法的資訊，而艾略特的波浪理論正好彌補了神奇T指標的不足。波浪理論根基於數學理論之上，正好滿足我對於對稱、漲潮、退潮和宇宙規律等課題的好奇心和想像力，對一個像我這樣的操盤手而言，它就像宇宙的奧祕一樣吸引人。


    一九八三年秋季某一天，我打了一通電話給普瑞契特。普瑞契特也參加了查德舉辦的全美冠軍操盤手大賽，所以認得我的名字。我很喜歡他提出的看法，而隨後我們也達成了的一個協議，由他提供諮詢服務，而我則每月付他些許費用。我真的非常敬重普瑞契特的智慧，所以每天都和他談好幾句話，就像以前每天和佐爾納交換意見一樣。


    一九八七年的股市大崩盤前，他認為那是大多頭市場的結束，並對前景轉為完全悲觀。雖然市場在稍後回穩並開始上漲，但仍然無法改變他的看法。他認為我們正處於波浪的頂峰，而市場的情勢就像大浪即將打在岩石上一樣危急，我們根本沒有辦法做任何事來加以挽救。


    一九八九年，普瑞契特榮任金融市場技術分析師協會（Market Technician Association）總裁，這是一個由全國依技術分析方法從事交易的專業人士所組成的團體，而他邀請我和另一名頂尖的操盤手保羅．都鐸．鐘斯共同參與一項市場分析講座談會。當時普瑞契特長時間站在空方，所以漸漸失去了人氣，在那次座談會開始之前，我把他拉到一邊。我說：「就算市場真的會崩盤，你也等一等再發表看空的想法吧！等到市場真的下跌了，再告訴他們你看空。」


    不過他似乎沒聽進我的話。他強烈認為我們現在正處於浪潮的頂峰，並且應該抱持居高思危的想法，隨時要有跳進救生艇裡的心理準備。我仍然對普瑞契特的智慧相當尊敬，但是在那之後我們就不那麼常聯絡了。我是一個操盤手，不能什麼都不做，坐等世界末日的來臨。


    一九九五年，普瑞契特送給我一本他所寫的新書，書名是《在浪潮的頂端》(At the Crest of the Tidal Wave)，書中對後市的看法消極且悲觀，但是卻當具有吸引力。普瑞契特真是天才，也是一位極具說服力的作者。我有一個朋友讀完了這本書之後，甚至嚇得一個星期都不敢出大號。可是這又怎麼樣？市場還是繼續上漲。


    讀那本書時，我不斷思考，普瑞契特真的是瘋了。或許你很確信自己的想法沒錯，但市場卻永遠是對的。只有在你不得不做時才該把沙袋堆在河邊，而不是在之前就動手。華爾街可不會買裸體國王的帳，或許他又老又肥，但是人們可對這些一點也不感興趣，他們想看到的是他坐在王位上尊貴威嚴的模樣。只要他們一直覺得國王是這麼高貴，他的形象就會一直維持下去，因為人們會持續地認同他（買進）。那麼，這個大球就會繼續滾動下去。


    普瑞契特就是那種典型型認定自己對，而市場錯的人。他的理論冠冕堂皇，他的聰明才智足以贏得諾貝爾經濟學獎，而我也希望他哪一天真的能得獎，但是市場才不在意這些呢！普瑞契特現在總算公開承認他在這麼長的一段時間裡的確看錯了，他對於自己找尋市場頂部的能力失去了自信，但是在在他認同追隨市場潮流才是獲利的較佳做法前，他還是會坐在湖邊，靜靜地等待著浪潮的來臨。


    市場剛剛收盤，我正忙碌地補畫技術線圖和計算技術指標。我在趕時間，因為門僮隨時會通知我，商品公司（Commodities Corp.）派來的大轎車是否已經在樓下等待，準備好載我到普林斯頓去。我知道自己會待到很晚才回家，所以得趕快把手邊工作做完，不然明天交易可就會大受影響了。


    通常，我在工作日裡都不會太晚上出門。想成爲一位成功的操盤手需要休息，而且至少需要在晚上工作三個鐘頭來完成充分的準備。不過今晚算是例外。今晚是商品公司每半年舉辦一次的操盤手晚宴，這是讓所有頂尖操盤手齊聚一堂的難得機會，我可不想錯過和其他頂尖操盤手互相較勁的大好良機。這是我第一次參加這種晚宴，正期待藉著這個機會去發掘偉大操盤手的成功祕訣，並讓他們知道我也是一個和他們一樣棒、甚至更棒的操盤手。


    「鈴……，鈴……」門鈴響了起來。加長型的禮車已經到了。我穿上那套新買的亞曼尼西裝外套和56寸鱷魚皮鞋，繫緊Nemo1領帶，然後站在鏡子前檢查自己的穿著。好極了！我已經準備好去和那些頂尖高手過招了。一個半鐘頭後，我們駛進紐澤西州的普林斯頓。我是在耶魯大學的地盤——康乃迪克州的紐海文市長大的，這是我一生中第二次造訪普林斯頓。普林斯頓讓我回想起像安默斯特（我是在那裡讀大學的）那樣的新英格蘭式小城，我實在很難想像在紐澤西州也會有這麼棒的地方。


    禮車緩緩駛進商品公司雄偉的總部大樓，秋夕夕陽的光芒正逐漸消失在晴朗的天空中。精心布置過的樹上閃耀出紅色和金色光芒，反射在商品公司超現代化大樓的玻璃帷幕上。然而當我走過那扇超大玻璃門時，卻覺得胃好像打結般難受。這種晚宴總讓我感到緊張，我不喜歡和陌生人談無聊話題，平常都是奧黛莉幫忙應付這些場合，但是商品公司這場半年一度的操盤手晚宴只限男性參加，配偶並未獲邀。


    ## 為自己操盤，太大材小用了


    我在門口環視著會場，試圖找出熟悉的面孔。第一個被我認出來的人，是麥可．馬可斯（Craig Marcus）。馬可斯畢業自約翰．霍普金斯大學，擁有克拉克大學心理學博士學位，是第一個被商品公司延攬成為旗下操盤手的學院派人士，在接下來的十八年中，馬可斯將他最初只有三萬美元的部位，成功擴大為總市值八千萬美元。目前住在南加州一幢可以俯瞰一片私人海灘的豪宅裡的他，現在手上拿著一瓶礦泉水——或許有人告訴他洛磯山以東的水受到嚴重污染吧！我在幾個月前才和他共進過一次晚餐，很好奇他是不是已經度過了危機，但你永遠無法知道這些操盤手心裡在想什麼。我們這類人，通常都在某些方面有着奇怪的想法。


    商品公司的總裁巴布·伊斯頓（Bob Erston）上前來和我寒暄。伊斯頓以前曾經在美國律師協會任職，畢業於普林斯頓大學，擁有哥倫比亞大學企管碩士和喬治城大學法學博士學位。他本身並不是操盤手，是那種無論在哪種社交場合都能輕鬆愉快地應對的人，他的社交手腕就像商品公司那幢大樓外面的玻璃帷幕一樣平順圓滑。伊斯頓向我介紹布魯斯·考夫納（Bruce
    Kohn），他是市場上最有名的操盤手之一，然後伊斯頓就溜到一旁去歡迎其他不擅交際應酬的操盤手，試著讓每個人在今天的晚宴中都能有賓至如歸的感覺。


    就跟馬可斯一樣，考夫納是另一位被商品公司網羅的學院派操盤手。這位前哈佛大學和賓州大學的政治學教授在一九七〇年代中期，從學術領域跳到金融市場。考夫納相信他在經濟學和政治學方面的專業知識，在從事期貨市場分析時很有用，事實證明他的想法是正確的。光是在一九八七年，考夫納就幫自己和投資者賺進超過三億美元。


    考夫納滔滔不絕地敘述著自己如何喜愛在殖利率曲線（yield curve）方面的研究，以及他如何把市場的研究工作和利率期貨操作相互配合，但我的心思已經飛回到去年的秋天。那時剛好有個席爾森公司的經紀人哈利·丹尼（Harry
    Denny）試著說服我和商品公司談談，商品公司付給像丹尼這樣的經紀人相當多的佣金來找尋像我這樣的操盤手合作。這並非因為我需要和任何人合作，而是由於我在查德所舉辦的全美冠軍操盤手大賽中取得了一連串的勝利，再加上一九八八年二月十五日發行的《巴倫週刊》裡有篇專文以「市場上最棒的」標題來介紹我，讓我在華爾街享有相當的聲望。


    有段時間我曾經考慮過操作別人資金的可能性。對我來說，操作別人的資金會是一件好事，因為雖然我開始操作自有資金以來一直相當成功，自己還是覺得並沒有把所有該賺的錢都竭盡所能地賺到。我在挑選進場時機方面通常都能做出正確的決定，但是對於損失自有資金的恐懼和急於實現獲利的心理，卻使得我無法創造最佳的操作績效。如果我是用別人的錢進行操作的話，我確信自己會採用更積極的手法進出，並持有獲利部位更久。這就是為什麼丹尼來的正是時候。當他告訴我商品公司有意找我操作部位，並想和我談談的時候，我一口就答應了。


    在快速成長的一九八○年代過後，大型基金簡直成了大怪物。共同基金快速成長，退休金計畫的相關規定和國稅局，將数以百萬計的新投資人推向市場。一九八○年代早期後，通貨膨脹相當嚴重，所以大筆投資基金都要求高額的報酬率。新的金融工具一直被發明出來，而那些擁有大筆資金的人，也一直在向外找尋有能力操作這些新金融工具的專業操盤手，像我這樣的冠軍操盤手，當然是最好的人選了。


    商品公司長久以來一直都是海默·威瑪（Haim Weis）的腦力創作。一九六九年，在他三十歲那年，威瑪從一個麻省理工學院畢業的電腦專家，成為納貝斯克（Nabisco）公司的商品經濟學者。威瑪是首先發現商品交易資訊特別適合利用電腦來分析的少數人之一，在那之前，大部分的商品交易都是經由類似早先倫敦金屬交易所（貴金屬）、芝加哥期貨交易所（穀物）以及芝加哥商品交易所（內協及性口）所採用的老式人工方法來進行的。那些老操盤手大部分靠直覺，而非理論來從事交易。他們會注意一些事物，像是氣候、政治以及經濟狀況，作為操作的指標。他們沒有辦法分析影響商品價格變動的神祕市場力量，而這也是為什麼商品市場是如此波動劇烈且難以預測。


    威瑪覺得自己可以利用電腦的模型，為他的操盤手帶來更多的優勢。他的計畫是徵選一批有天才的操盤手，把他們放在擁有最先進科技支援的環境下，提供一筆操作資金，借由這個方法訓練出新品種的操盤手——能夠充分利用現代科技帶來的優勢，而非採用老式做法的人。他的計畫相當成功，到一九八八年時，商品公司已經成為全球商品市場最大的交易者了。


    ## 玩別人的錢，跟玩自己的錢完全不一樣


    一九八八年四月二十六日，我和我的律師柯恩斯坦一起開車到普林斯頓，和伊斯頓、依蓮、克魯克（Marc Crocker，負責為商品公司募集操盤手的人）以及其他幾個衣著光鮮、彬彬有禮的公司人員共進午餐。直覺告訴我，這些人都不是市場的玩家。他們都太斯文了，根本不像操盤者——他們只是幫商品公司招攬像我這種操盤手的業務人員。


    他們陪著柯恩斯坦和我進入一間布置豪華的貴賓室，我們享用了一頓由專屬廚師精心調製的美味午餐。商品公司的品味和美國股票交易所，顯然有很大的差異。在交易所裡，我的午餐通常是从工作服口袋裡掏出來的牛肉三明治。


    柯恩斯坦和我在享用午餐的同時，伊斯頓和業務員們輪番告訴我商品公司是怎樣的一個好地方，如何善待旗下的操盤手。我想知道的只是他們到底要付我多少錢，以及我得為他們賺多少錢。所以當我吃完善份甜點後，我說：「好吧，你們的條件是什麼？」


    「由於你是新加入本公司的操盤手，」伊斯頓說：「我們會提供二十五萬美元的保證金給你，然後你能得到操作獲利的三〇%。」


    我大聲笑了出來。「二十五萬美元，」我說：「少了吧！我光操作自己的資金一年就可以賺進六、七百萬美元了。我明白告訴你們吧，我給你們二十五萬美元讓你們來替我操作好了。」


    「馬丁，拜託聽我說。」伊斯坦拉了拉他的名牌領帶，說：「馬可斯、考夫納，甚至保羅·都鐸．鐘斯都是從這麼小的金額開始的。這是我們公司一直以來的做法。」


    「這對他們來說管用，」我說，然後站起來，從椅背上拿起西裝外套。「我現在要去洗手間，等我回來的時候，希望你們已經考慮清楚，再給我一個更好的提案吧！」


    柯恩斯坦給了我一個眼色，暗示我「你在幹什麼？你快要把這筆生意給搞砸了」。但我是一個操盤手，我知道自己是對的。這些傢伙需要我比我需要他們更多，而且更令我確定的是，當我回來的時候他們一定會提高條件。


    果然，商品公司最後讓我為他們操作一千萬美元保證金的部位，而我仍然可以得到這個部位總操作獲利的三〇%。我離開之前，他們要我和公司創辦人兼總裁威瑪見一面。威瑪也是一個操盤手，很喜歡我的操作方法。「電腦是很棒的工具，」他告訴我：「但是你還是得親自處理這些資料。」

    '
