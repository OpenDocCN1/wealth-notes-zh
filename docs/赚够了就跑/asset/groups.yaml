    ## 第一次參加蘇富比拍賣會


    這個提議，顯然很合佛雷斯哥和柏雷特的胃口。他們不願意教我，而且我們在拍賣會中可以和他們坐在一起，甚至可以協助我們喊價。我要離開畫廊時，佛雷斯哥從抽屜裡拿出一本有關這次蘇富比拍賣會的全新型錄。「拿去吧，」他說：「好好研究！」


    這就像是教授把期末考卷發到我手中一樣，我馬上回家坐在奧黛莉身旁說：「在這次的拍賣會，我們將和佛雷斯哥和柏雷特坐在一起，他們希望我們先把這本型錄看過一遍，並選出所有喜歡的作品，然後他們會幫我們決定該針對哪一個作品出價。」


    奧黛莉和我在接下來的兩個星期，很仔細地研究了那本型錄與裡面列的所有美國印象派畫家，試著找出一些最好畫家所畫的最佳作品，尤其是那些底價很合理的作品。找一幅好畫和找一檔好股票非常相似。在一九八六年的蘇富比拍賣會型錄中，列有三百四十九項藝術品，其中包括多項雕刻作品，以及大約有五十幅美國印象派畫家的作品。就和挑股票一樣，我們馬上就排除掉大部分的作品。在選擇股票時，我們可能不喜歡某家公司的獲利性、不滿意它的產品、不滿意它的市場占有率，或許我們不欣賞它的管理階層。而當我們在選擇一幅畫時，我們可能不滿意它的價格、不滿它的色彩組合、不喜歡它的出處，也可能不喜歡那幅畫的創作者。


    經過了一個星期的研究，我們把目標縮小到五幅畫：

    - 哈桑姆（Chad Hazzah）的《往大海的路》（底標十五萬～二十萬美元）

    - 羅賓森的《夏日的山坡風光》（底標四十五萬～五十五萬美元）

    - 蔡斯（William Merritt Chase）的《塞考克的風景》（底標十五萬～二十萬美元）

    - 普倫德加斯特（Maurice Bravll Prendergast）的《花園》（底標十四萬～十八萬美元）

    - 佛利錫克的《在河面之上》(底標二十五萬～三十五萬美元)


    挑好作品，該是我去找佛雷斯哥和柏雷特談談的時候了。


    拍賣會舉行的日期是在十二月四日星期四，我在十一月二十八日週五收盤後到佛雷斯哥與柏雷特畫廊待了一下。正如我所預期的，佛雷斯哥和柏雷特對於奧黛莉和我挑中的那幾幅畫簡直瞠若指掌。「你們的眼光真不錯，」佛雷斯哥說：「不過你們不能光憑型錄上面的介紹就做決定，一定要親眼鑑定過才行。」


    所有的拍賣品都將在十一月三十日到十二月三日公開展示。《花園》是所有我們感興趣的作品中，唯一沒有放在蘇富比展示的，它當時正在東八十二街的柯克（Cork）畫廊中展示。奧黛莉和我在週六時到柯克畫廊看了那幅畫，它遠比在蘇富比型錄中所看到的要好太多了。我們不只希望在拍賣會中出價，甚至開始想像一個星期後把這幅畫掛在我們家牆上的美好景象。


    第一次走進蘇富比在紐約大道的總館時，我一點也不知道接下來該怎麼做。我原本以為，參觀畫展的人會放輕腳步、輕聲細語，但事實上完全不是這麼回事。走進蘇富比展覽館的大廳，就像走進了一九四八年的共和黨年會般吵雜。一堆看起來像是長春藤名校學生的白人熱情假意地互相打招呼，在展覽廳中四處走動，設法讓大家都認為他們是行家。「不必懷疑，這一定是瑞菲爾德最好的一件作品。」「這是裴克斯頓雙眼視覺法的最好範例。」「沒錯，注意看他的焦點有多特別，而且他從遠景轉移到近景的手法簡直讓這幅畫活了起來。」「看看這幅《少女與狗》當中所展現出來的活力和強度。」「羅賓森把平凡無奇的東西給處理得多麼棒啊！看看他對空間的濃縮處理手法，這柔和的光線是怎麼畫出來的？他的筆法真是不可思議。」「真是鬼話連篇——但這些鬼話至少比我天天在華爾街聽到的要好聽多了。


    佛雷斯哥和柏雷特不停地揮手和人打招呼，畢竟這是他們的市場，而且他們認識在這個市場裡的每個人。他們也不停地把我介紹給不同的人，但我可不是來這裡搞社交活動的，我到這裡是要研究畫作和觀察周遭的人，就像在水道賽馬場研究馬匹，或是在
    AMEX 觀察那些作價買賣行為的道理一樣。


    我仔細看著每一幅我們選出來的畫，並詳細地傾聽其他參觀者如何評論，然後把他們所說的加以歸納，試著從中找出任何可以依循的脈絡。


    回家後，奧黛莉和我坐下來一起翻著我們的筆記，做最後的回顧。我們已經為明天的拍賣會做了萬全的準備、確定明天的策略、檢查我們的價格調整點，並且設定進場和出場的價位。我希望我那陸戰隊式的作戰原則能清楚地放在腦袋裡，並希望在拍賣會開始前準備好——從事交易，本來就必須在一切發生前，先做好心理建設和沙盤演練。拍賣是一種競標者情緒充斥的遊戲，所以在競標時絕對不能失控，一定要設定明確的退出點，並且堅守此一計畫。


    就寢前，我們拿起那本已經翻爛並做滿筆記的型錄，小心地做最後決定要出價的三幅畫所在的頁角折起來，做上記號。


    ### 蘇富比拍賣會現場


    眨眼、摸鼻、點頭、擊槌間，幾十萬美元的交易所，完成！


    蘇富比舉行的拍賣會分為兩個階段。上午時段從十點十五分開始進行編號一到一五〇號的拍賣，下午兩點則開始進行一五一到三四九號作品的拍賣。所有的藝術品都是以年代遠近的顺序排列，所以美國印象派作品屬於第二時段，不過我還是想利用上午時段來熟悉拍賣會場的環境。我們在週四早上走進紐約第五大道的蘇富比公司總部，在警衛的指引下下來到大廳，和佛雷斯哥及柏雷特會合，然後跟著他們上樓，來到拍賣會場所在的大廳。


    我們進入一個和百老匯街道小戲院差不多大小的房間，並且在前排找了四個位子。佛雷斯哥安排我坐在柏雷特的左邊，因為他負責喊價。佛雷斯哥自己坐在我的左邊，而奧黛莉則坐在佛雷斯哥的左邊。在我們的前方有一張上面放了很多電話的桌子，旁邊坐著六位年輕男女。


    「那些人是接受電話喊價的人員，全世界收藏家都可以透過電話參加競標。」佛雷斯哥告訴我。年輕男女的左前方是一個電腦控制的電子匯率揭示板，上面明列著所有貨幣的匯率，以便出價者能很方便地換算成本國貨幣，其中包括：美元、英鎊、法國法郎、瑞士法郎、日元以及德國馬克。我們的前方則有一個架高的展示箱，裡面有光亮的腳燈由上往下照射，而它的四周都以毛氈包覆。


    「那就是他們展示畫作的地方。」佛雷斯哥說：「這個展示臺分成三個部分，當一個拍賣品正在競標時, 他們就在布幕後面把前一個拍賣品拿下來, 並把下一個拍賣品準備好。」展示臺的右邊是一個講臺,
    現在是空著的, 但顯然那是拍賣員要站的地方。


    大廳的兩旁及後方都有以深色玻璃隔開的小包廂, 我猜想那一定是為拍賣會的大買主所準備的房間。拍賣會場裡的人都在聊著天, 場面顯得更有些鬧哄哄的, 但是當十點十五分一到,
    每個人都立刻就座並且安靜了下來。接著蘇富比的首席拍賣員約翰．馬里恩 (John Marion) 走上講臺。場中只有蘇富比公司的工作人員站著, 分佈在拍賣場四周監督著一切。


    馬里恩以一種上流社會人士的語調, 將拍賣的相關規定做了簡單的介紹, 他檢查了一下麥克風並確定每個工作人員都就定位後, 便開始第一件拍賣品的喊價。在一陣如連珠炮般的喊價聲中,
    巴特溫斯 (Buttworth) 那幅〈擊敗英國戰艦的五月花號〉(畫著兩艘在怒海中航行的單桅帆船)被放在一個旋轉的展示架上拍賣。每個與會者都把身子往前傾,
    以便能看得更清楚。那些年輕的電話接單員則對著電話輕聲講話, 匯率揭示板也開始顯示各國貨幣的兌換匯率, 而負責監視的工作人員則開始四處穿梭, 突然間整個房間裡充滿了緊張的氣氛。


    「有人出價六千了, 有人出價七千嗎?」那個充滿磁性和高貴氣息的聲音大聲宣布。「七千美元, 有人出價八千嗎? 好的, 謝謝您, 八千。現在, 有人出價九千嗎?」不停地有人提高投標價,
    但是我一直沒有辦法看出來這些買盤是從哪裡來的。


    這裡一點也不像 AMEX, 沒有人會搖著他的手大聲喊價, 出價的動作是非常安靜且不引人注目的方式進行的。「九千美元, 第一次...; 第二次...; 成交!」砰地一聲,
    馬里恩用一個金屬材質的槌子敲打在桌面上。展示架的轉軸仍然在轉動，匯率揭示板也繼續運作，在我把第一筆交易記錄下來之前，馬里恩已經開始第二個拍賣品的喊價了。


    在上午的時段中，柏雷特對幾個作品出過價。根據蘇富比印行的型錄中所附的「未來買主指南」的規定，出價是經由舉牌方式進行，不過很顯然這並不適用於那些職業買家。佛雷斯哥與柏雷特畫廊的牌子，一直沒有離開過柏雷特的衣服下襠。柏雷特只要眨個眼、輕拍一下鼻子、拉個耳朵、點一下頭、拉拉領帶或是做一些其他的小動作，馬里恩那銳利的眼睛都看得到。我緊張得動都不敢亂動。就在這眨眼、摸鼻、點頭和擊槌的動作間，二十或三十萬美元的交易就完成了。這樣的景象讓我有很強的親切感：電話、數位、揭示板、出價、成交確認的動作以及金錢的快速流動，在我眼中簡直就像一個乾淨又文雅的
    AMEX，而馬里恩看起來就像交易場裡的桑坦吉羅，只不過馬里恩穿著較好的衣服，又一副彬彬有禮的樣子。馬里恩用他的金屬槌敲定交易，而桑坦吉羅則靠他的蠻力完成交易。


    上午時段結束後，我們出去吃了一頓簡便的午餐，但是我太緊張，根本食不下嚥。上午時段的大部分拍賣品，都以比型錄上底價更高的價位成交。「天啊，柏雷特，你會不會覺得我訂的價位太低了？」


    「你永遠不會知道，」柏雷特說：「有的时候你訂的價位恰到好處，而有的时候你又和你要買的東西擦身而過。我想最好是先看下午的情況，再決定是不是要改變出價策略。」


    ### 競標美國印象派


    耶！只花二十四萬美元，我們就加入「文化人」的行列了……


    我們在一點五十分回到座位。兩點整，馬里恩準時回到展示臺上的講臺旁。砰！開始第一五一號拍賣品的出價。第一五一號是約翰·拉法吉（John La Farge）的《審美家》，底價是四千到六千美元，結果以一萬三千美元拍出，比預期價格多出兩倍以上。這對我來說，可不算是在好消息，得標價錢都偏高。匯率揭示板繼續翻動，展示架也不停轉動，每件美國畫家的作品都像旋轉木馬，平均展示兩分鐘就被賣出。它們流通的速度，比梅沙股的選擇權還要快。


    十二分鐘後，第一七六號作品《往大海的路》被推出來放在展示架上──該是是我把這幅哈桑姆的畫買下來的時候了。我們為這幅畫所訂的最高出價是二十萬美元，而這也是蘇富比型錄中較高的預估價。「有人出價十五萬嗎？」馬里恩雄厚的嗓音喊道。柏雷特拉了一下自己的耳朵。「有人出價十五萬了，有人出價十七萬五千嗎？」馬里恩這傢伙真懂得怎樣抬高價碼，「有人出價十七萬五了，有人要出價二十萬嗎？」


    是那些希臘人出的價。佛雷斯哥低聲說。


    有人出價二十萬！有人要出價二十二萬五千嗎？」會場一片安靜，有人願意出價二十一萬嗎？」


    柏雷特看著我，等著我的許可。「去吧，去吧，給他們二十一萬。」我小聲地說。柏雷特對前面眨了一下眼。


    「有人出二十一萬了，有人出價二十二萬嗎？有人出二十一萬了！」

    「這是那些荷蘭佬。」佛雷斯哥說。

    「放手去做！」我喃喃低語。柏雷特摸了一下鼻子。

    「有人出價二十三萬，好的，請問有人出價二十四萬嗎？」

    「又是那些希臘人。」佛雷斯哥說。


    狗屎！我不能讓那些希臘人贏過我。可是當我正想告訴柏雷特出價二十四萬美元時，我感覺到奧黛莉正用她的指甲掐著我的大腿。「放棄吧，」她說：「這幅畫沒有那麼好看，更何況你還有另外兩個競價對手。真是見鬼！但奧黛莉是對的，接下來我們一路看著希臘人和荷蘭佬把價錢哄抬到二十八萬美元。靠，這個拍賣會還真不是開著玩的！我不喜歡輸給別人，但小輸總比濫賭輸光後被丟出場外來得好。


    七分鐘後，現場開始第一九〇號作品的拍賣，那是羅賓森的《夏日的山坡風光》，以四十七萬五千美元拍出。這個價錢真的滿高的，但還好它至少還在蘇富比型錄的預估範圍內，而且看起來真的是一幅好畫。三分鐘後，編號一九六號，蔡斯的《塞考克的風景》以三十萬美元的價位賣出，整比蘇富比型錄中預估的價位高出五〇%。這對我來說是個壞消息，「慘了！」我輕聲地說。「別擔心，」佛雷斯哥說：「這是英國漢普敦來的傢伙，他是個情緒化的買主，他們出的價太高了。準備好接下來的出價吧！」


    我的心怦怦地跳。二〇一、二〇二、二〇三號拍賣品都成交了。「第二〇四號，普倫德加斯特的《花園》，「充滿磁性的嗓音再度響起：「十四萬，有人出價十四萬嗎？好的，十四萬，有人出價十六萬嗎？謝謝您，十六萬，現在，十八萬呢？有人出價十八萬嗎？」柏雷特點點頭，「十八萬，謝謝您，現在有人出價二十萬嗎？有人出二十萬了，二十二萬呢？」


    「那是費城的一家畫廊，」佛雷斯哥輕聲告訴我：「可能是為他們自己或某個客戶在出價，我不是很確定。」


    「我才不管他們是為了誰出價。這幅畫我要定了，幫我出價吧，柏雷特。」馬里恩看著柏雷特，柏雷特對他點頭。


    「二十二萬，有人願意出二十四萬嗎？」會場一片安靜。「這是一幅很好的佳作，有人要出價二十三萬嗎？」馬里恩向會場後方看著。「二十三萬，謝謝您，現在有人出二十四萬嗎？」他又回頭看著柏雷特。


    「還是那些費城來的傢伙，」佛雷斯哥說：「沒有其他的競標者了。」


    柏雷特看著我，我看著奧黛莉。她點了點頭。


    「放手出價吧！」我說。柏雷特拉了自己的領帶。


    「二十四萬，有人出價二十五萬嗎？」我把拍賣品型錄放在膝上，把頭埋在雙手之中盯著這幅畫，它正在我的面前閃閃發光。拜託！請讓我買到這幅畫。「二十四萬元，第一次……，第二次……，成交！」


    砰地一聲，拍賣臺上的槌聲，讓我興奮地站了起來。


    這是我這一生中最瘋狂的一次搶購行動，我彎過佛雷斯哥身前，緊緊擁抱著奧黛莉，然後趕忙握佛雷斯哥的手，再轉身去握柏雷特的手。我們座位後面的人，都向我和奧黛莉恭賀著。這感覺真不賴，只花了二十四萬美元（當然還得另外加上給蘇富比的二萬四千美元），我們就加入了文化人的行列了！


    砰！糟糕，我忘了我們還在拍賣會場。編號二○六號的作品剛剛成交，而佛利錫克的《在河面之上》已經被拿到展示架上了。奧黛莉小聲說：「這真是燦爛美麗的一幅畫。」她並沒有參加前一晚上的展示會，所以在這之前，她還沒有機會看到這幅畫的真面目。「買下它！買下它！」她命令著。


    嗯！我是一個優秀的陸戰隊員，而現在我接到了一个向前推進的命令。「現在有人出價二十四萬元，有人願意出價二十六萬元嗎？」柏雷特開始拉拉扯扯地做手勢。「二十六萬，……二十八萬，有人要出價二十九萬嗎？」「買下它！買下它！」我說。柏雷特急急忙忙地動作，扯動身體各個部位，好像得了癲癇症似的。「一次，……，二次，……，成交！」拍賣槌砰地一聲敲下。終於，我們擁有了這幅《在河面之上》。我可以感覺到人們在後面拍著我的背，恭賀我們買下了第二件優秀的作品。


    這真是令人難以相信，二十九萬美元（外加二萬九千美元佣金）以及二十四萬美元（外加二萬四千美元佣金），在我這一生中，還從來沒有在這麼短的時間裡花這麼多錢呢！


    ## 買畫，讓我學到禮貌、謙遜和人性


    六個月後，佛雷斯哥哥和柏雷特來拜訪我。「馬丁，」他們說：「我們有一個你可能會感興趣的建議。我們有一個大客戶，願意以七十萬美元買下你那幅沃諾的畫，我們認為以沃諾的畫而言，這是一個很好的價錢。」


    「我也這麼覺得。」我說。那是我們九個月前花四十萬美元買進的一幅畫，持有九個月後能享有七五％的報酬率，這對奧黛莉和我們來說是很不錯的績效，所以我們把《花園裡的農夫》賣給了那位收藏家，現在那幅畫正掛在法國的美國藝術博物館中。


    在這些年當中，只要價錢合適，我們也透過佛雷斯哥哥與柏雷特畫廊賣出其他的畫作。好的藝術品，是一種投資標的物，一種可以像金融工具一樣被買賣的商品。蘇富比和佳士得這兩家公司很清楚這點，而其他數以千計和佛雷斯哥哥與柏雷特畫廊一樣的藝術品商也是如此，他們是真正造就這個市場的參與者。但藝術品不只是一種投資標的物，它們具有更高尚的意義。不同於買賣債券、期貨或其他證券，在我買進一幅畫之前，我就已經知道擁有這幅畫的前手是誰，而在我打算把一幅畫賣掉前，我也希望知道誰是買主。這是一種情感、道德上的差異。


    我買的畫就像家裡的客人一樣。一早醒來我就可以看到厄尼斯特·勞森的畫，我和斐德利克·佛利錫克的畫一起共進晚餐，我看書的時候則有溫斯洛·霍姆和查爾德·哈桑姆的畫作為伴，而在我的座位旁則是普倫德加斯特、威廉·格列肯斯和瑪莉·卡塞特的作品。正如同我母親在很多年前就知道的一樣，這些畫教給我許多在艾迪．柯漢家地下室或交易場中沒辦法學到的事——禮貌、謙遜和人性。這些畫，讓我了解到賺錢並不是這個世界上最重要的事；這些畫，造就我成為一個更好的人。


    在我們搬進公園大道的幾年後，我被選為大樓管理委員會總幹事，隨後又馬上當選管理委員會主委。有一天，我在辦公室裡接到一通在大樓裡住了二十多年的住戶打來的電話。「舒華茲先生，」他說：「我可以去拜訪你嗎？」


    我們在我家的客廳坐了下來。「舒華茲先生，」他眼睛看著地板，然後說：「我最近發生了一些不順利的事，我相信只要給我一些時間，事情就可以解決。但是以目前的狀況，我恐怕沒有辦法按時支付這個月的管理費了。」


    起初我不知道該說些什麼。我實在很難相信能住在這棟大樓裡的人，會沒有辦法按時付他們的管理費。就法律上的觀點，我可以對外宣布他無法付款，並逼他賣掉資產來支付積欠的管理費，這是那些管理委員在七年前會採取的行動。但是我是一個從紐海文來的街頭小子，和那些人不大相同。當他們擁有權力時，隨時可以修理我，可是當我擁有同樣的權力時，我會用人性化的做法相待。因為我曾經被別人欺壓，我知道被欺壓的感受。


    「這樣吧，」我說：「您已經在這幢大樓住了有二十五……還是三十年？慢慢來，先把你的事情處理好，不用擔心你欠的管理費。我相信你有能力解決問題，然後再把管理費付給我們，我們在合理的時間內，不會向你追討這筆錢。」


    他大大鬆了一口氣。當他站起來準備告辭時突然停住片刻，仔細端詳我的客廳。那時掛在牆上的畫，價值比我們所住的公寓還要高。「您的畫作收藏真是一時之選。」他說。


    「謝謝誇獎！」我說：「我的家人喜歡這些畫，而保有這些畫也是一件好事，你知道，尤其當有什麼意外發生的時候。」


    ## 第10章 沒帶武器，千萬別上戰場


    當你從事交易時，隨身攜帶武器是很重要的件事。你不能用兩手空空就在華爾街闖蕩，尤其當你對地形也不熟悉的時機，你就只能等著送命了。


    這就是為什麼我每天要花那麼多時間來研究自己的操作方法，並且每次進場前要和我在AMEX交易場內的朋友海斯．諾爾保持聯繫的主要原因。可是很不幸的，我在一次赴芝加哥的旅途中忘記了這條守則。


    記得那是一九八七年的春天，奥黛莉和我開始跨足藝品收藏領域的六個月之後，我們正準備參加一場藝術界的宴會。當佛雷斯哥和柏雷特告訴我們，如果我們提供相當的捐款，就可以受邀参加芝加哥風城博物館（Windy
    City Museum）的開幕式時，我馬上就把支票簿和筆掏了出來。這座博物館的發起人和他太太是著名的美國印象派畫作收藏家，而這座博物館的開幕式可說是藝壇的年度盛事。滿場都會是繫著黑領帶、來自世界各地的藝文界人士。我送出了支票，擦亮了我的鱷魚皮鞋，準備好要參加這場盛會了。


    我們在開幕式舉行的前一晚住進德瑞克飯店，由於第二天早上無事可做，我決定到 CM 去，順道拜訪一下我的場內接單員黛比。在過去五年中，我已經成為 S&P 期貨最大的個人操盤手之一，可是我卻從來未曾到
    S&P 的交易場參觀。更何況，去看看那裡的傢伙在幹些什麼，應該會是一件很有趣的事。我叫了一部計程車到威克大道，然後在 CME 門前下車，抬頭來仔細端詳這幢雙座、外層包覆著花崗岩的四十層大樓，心中不禁想著：『我是這個地方的主宰者！』


    我昂首闊步地走到會員服務臺前。「我是馬丁·舒華茲，是交易所的會員，我可以領取我的會員徽章嗎？謝謝。」


    我以爲服務臺後面那位小姐，在聽到我報出舒華茲的名號後，會有什麼特殊的反應，但相反的，她白了我一眼，然後說：「舒華茲？這個字怎麼拼？」嗯！她能知道些什麼？她又不是市場的玩家。等我走到交易場裡，那些人可就要抬起頭來把注意力放到我這邊來了。


    我穿著亞曼尼西裝、鱷魚皮鞋，戴著那閃亮的新徽章走進交易場內。我的天，這個地方可真是大！這裡就像一座足球場一樣大，我根本不知道要怎樣才能找到黛比。市場已經開盤，每個

