    小就喜歡分析事物，而這正是證券分析師的工作內容。他們分析企業，和公司管理階層訪談面談，然後寫報告。他們必須在國內到處旅行，而我很喜歡旅行。


    一九七〇年春末，美國正處於經濟衰退，在那個年代畢業的人，想在華爾街找工作是很困難的一件事，但這並沒有使我停下腳步。我是一個有才幹的人，而且要向華爾街推銷的是我最滿意的產品——我自己。在那年年初，當我結束哥倫比亞大學研究所的畢業，並開始到處打電話時，我就像個偵探一樣，到處調查市場中居領導地位的公司，查出他們研究部門主管的名字，一致電。他們總是說：「我們沒有僱用新進人員的計畫，尤其是剛從學校畢業，一點經驗都沒有的小伙子。你不知道現在經濟非常不景氣嗎？」


    「是的，或許有人給了你一些壞印象。」我會這麼說。我總是盡量把他們留在電話線上。通常我都有辦法讓談話繼續，然後試著和對方約個時間面談，因為即使這次接觸並不能馬上生產效果，但在未來卻仍然可能有意想不到的發展。最後，總共有六家公司提供我工作機會。


    ## 他是上流人士，還是……騙子？


    最後我選擇了昆恩．勞伯（Kennon Lof）公司。


    昆恩．勞伯是家族企業，且是一個老字號、廣為人所尊敬的猶太裔公司。傑克．法維亞（Jack Favre）是研究部主管，他決定給我一萬六千美元的年薪，這在當時可是一個相當高的數字。法維亞把我分配到亞伯·布朗契頓（Albe
    Broadstron）的手下工作，他是麻省理工學院的畢業生，擔任藥品類股分析師。布朗契頓是我入行的指導者，他專門研究製藥產業，而他指定我去研究藥品連鎖店的行銷通路。我因此進入醫療產業的研究領域。


    除了藥品連鎖店之外，布朗契頓也讓我接觸其他醫療產業裡的公司。我最早被分配到的工作，是拜訪四季看護中心（Four Seasons Nursing Centers）。那時老人醫療保險制度才剛開始施行，這些看護中心類股便因此大行其道，成為股市最風行的主流股。


    四季看護中心由傑克·克拉克（Jack Q.Cla）所創辦，他曾經專程到紐約，向華爾街的分析師舉辦法人說明會，布朗契頓和我則到他下榻的旅館做過早餐會談。克拉克是典型的「花花公子」，一個不折不扣的上流社會人士。當我走進他的房間時，第一個注意到的就是他腳上那雙鱷魚皮鞋。我這輩子還真的從來沒看過這麼好看的鞋子，它們看起來閃閃發亮，簡直就像天空中流瀉下來的光芒一樣。


    當時，世界上沒有任何一個有理性的人會花一千五百美元買這麼昂貴的消耗品，在華爾街上開晃。但是我還是忍不住盯著克拉克的腳，然後心裡想者：「嗯，鱷魚皮鞋滿適合我的，我以後一定要替自己買幾雙來穿穿。」我對於那次的面談內容已經不復記憶，但是心中永遠留著那雙鞋的樣子。難怪沒有人想雇用二十五歲以下，剛從學校畢業、少見多怪的毛頭小伙子。


    幾週之後，布朗契頓和我飛到伊利諾州的久利特市（Cale）去拜訪四季公司，想看一看他們所經營的其中一處看護中心。很自然的，我們被帶到一所全新的看護中心，但是我們稍後卻發現，四季公司的獲利不是由經營看護中心而來。他們的獲利都是來自營建方面的生意。搗半天，克拉克其實是個騙子。他不斷蓋新的看護中心，然後虛增營建方面的獲利，再把獲利灌到看護中心的營利利潤上。靠著這個手法，他們的股價才能成為高本益比的「概念股」。就如美國曾經發生的
    S & L 危機一樣，企業可以利用虛增利潤的方式來產生巨額獲利。（譯註：作者指的應該是一九八九年美國儲蓄協會破產危機。（一九七○年四月二十七日，四季公司的股票被停止交易，而克拉克則和他那雙漂亮的鱷魚皮鞋一起進了監獄。


    後來，醫院管理成了我最專精的主要領域。我全心投入，寫了一篇對這些公司有利的研究報告，推薦他們的股票，並讓昆恩．勞伯公司在紐約市的俱樂部主辦一場法人機構的午餐說明會，所有公司的大頭們都搭私人飛機前來，而我則擔任主持人。我和他們一同坐在主桌上，並將他們介紹給我們的法人客戶。


    「大衛．鐘斯是耶魯法學院畢業的高材生，他和肯塔基上校隊的新老闆溫德爾．雪利兩人合力經營，使延伸醫療保健 (FirstCare) 公司成為全國成長最快的公司。」我滔滔不絕地說：「僅僅兩年中，湯姆．佛斯特博士和傑克．麥西已經使得美國醫院公司
    (Hospital Corporation of America) 成為同業中的翹楚，」我極力宣傳著。「伯尼．柯曼和巴布．高桑特是首先看出醫院整合性管理產業潛力的人，而且由於他們的努力，使得美國醫療公司
    (American Medical) 得以成為該領域的先驅。」我為他們吹噓著。


    這真是一場精美而熱鬧的演出，而我則是這場秀的靈魂人物。這些公司的股價馬上勁揚。我愈賣力討好那些客戶，公司就可以吸收更多大型投資機構的資金，最後也讓我自已賺進大筆的佣金。投資銀行是真正大型資金的來源，想要從他們手中拿到生意，就必須隨時以和顏悅色、正面積極的態度來面對。


    一九七二年春季，我已經在昆恩·勞伯公司工作兩年了，薪水調到年薪三萬美元，而我則是不停在國內當中飛人、分析藥品連鎖店產業、四處推銷醫院管理公司的股票，還不時跟我在安默斯特讀書時的朋友炫耀一番。有一天，在一場哥倫比亞大學的校友餐會中，我遇到一個同班同學。他當時正在「金字塔公司」上班。（譯註：作者不願意公布原公司名稱，故均以金字塔代稱。其中人員全部以代號稱呼。）


    ## 世界每一個角落，都會有拍立得相機……


    那個時期有許多小型的證券經紀公司，正因為研究部門裡的熱門分析師而受到市場矚目。金字塔也是其中之一。朋友告訴我，金字塔準備召募更多的分析師，他可以幫我安排和主管面談。能夠和金字塔的头頭們面談，就像能獲選參加達拉斯牛仔隊的球員選拔一樣令人興奮。「真的假的？好啊，幫我安排一下吧！」我說。


    金字塔公司位於貝特利公園（Bethly Park）旁邊一棟令人目眩的建築物，設立於這個全新鋼骨大樓的三十三樓，直接可以俯瞰史坦頓島（Staten Land）後方的整個港區。我和他們整個法人投資部門的主管，以及負責法人研究業務的一名董事會面，且相談甚歡。他們提供我五萬美元的年薪。我同意了。


    金字塔公司在很短的時間內，成為華爾街最令人印象深刻的企業。公司裡最大的頭頭是古夫王（King Kufu）和加佛利王（King Kaure）。他們兩人是公司的神，共同建立了這個金融界奇蹟。就如同古埃及文明中的偉大君主一樣，他們在自己建造的古堡中堆滿了寶藏和各種貴重的物品。


    在古夫王和加佛利王之下的是「大祭司」，負責金字塔公司的法人業務推展及研究部門的管理工作。當初就是大祭司決定把我挖角到金字塔來的。接下來，直接隸屬在大祭司底下的，則是「先知」。先知是研究部門的主管，技術上來說他是我的直屬老闆，但是我一到金字塔上班後，就發現大祭司和先知沒有辦法成為我的指導人，他們沒有辦法像昆恩・勞伯公司的法維亞和布朗契頓那樣教我這麼多東西。


    先知的手下，包括我在內，一共有三十名分析師在工作。研究部門主管的職務是和分析師們開會，了解分析師正在進行的研究報告、督導進度、向大祭司做簡報，並確定研究報告都已經分送給客戶及其他同業。先知將研究部重新改為三個小組，每組各有十名分析師，還指派一名資深分析師擔任小組長。現在先知根本就不再參加會議，只要「紙莎草」幫他代勞就好了。


    紙莎草是負責督導這個小組的研究部副主管，年紀沒有比我大多少，但是在華爾街已經是一名人傳奇人物了。他負責研究航空產業。有一段日子，航空公司在市場上最熱門的類股，但是退燒速度也和它們上漲的速度一樣快。更不巧的是，紙莎草對於航空類股的投資建議也搞砸了，同時還讓金字塔的散戶營業員，和他們的客戶一起掛在這些股票上。他自己也因此成了金字塔公司最大的一個笑話。


    「象形文字」也是我這個小組的成員，公司裡也流傳著不少關於他的笑話。象形文字曾經在每股一七○美元的價位推薦買進寶麗來股票，他看不出來寶麗來的快速顯像技術專利，並沒有讓一般相機和底片的銷售受到嚴重影響，也沒有因此賺大錢。相反的，他深信未來寶麗來每股將會迅速飆漲，讓大家賺到每股起碼八十三美元。根據象形文字的說法，全世界的每一個角落，包括你家的廁所裡，都會有拍立得相機的存在。當他所預估的每股獲利被證明完全錯誤後，金字塔的營業員和他們的客戶又血流成河、哀鴻遍野。


    ## 專門拿著放大鏡，看財報上小字的人


    人面獅身是我這個小組中的另外一名成員，會計師出身，專門研究獲利快速成長且成立不久的公司。在研究小組中，能夠有一名像人面獅身這樣會計方面的偵探是很重要的 一件事，因為那些在企業財務年報中的資料，尤其是那些新興產業中的新公司的數字，可能具有相當多的陷阱和誤導。


    那些為企業查帳的獨立會計師，通常會在報表中加註如下的保留意見（Caveats）。


    > 我們針對該公司的各種財務報表所進行的各項複核，均以一般公認會計原則為依據。以我們的意見，本年報中所附之資產負債表、損益表以及保留盈餘表均相當地表現了該公司的財務狀況。


    可是這種保留意見，如果翻譯成白話文，其實是這樣的：


    > 我們大致上看過了這家公司的官方數字，但是你最好了解一般公認的會計原則，不要太相信所謂的獲利。此外，這家公司付給我們一大筆錢為這些數字認證，如果不願意，他們馬上會換一家願意背書的獨立會計師。


    這就是為什麼每一份企業年報的每一頁裡，都有用小字體印刷的「附註」列在財務報表後面。而且這些附註的字體是那麼小，內容又是如此模稜兩可，以致一般投資大眾根本「有看沒有懂」。只有像人面獅身這種會計師出身的人，才能看出其中值得留意的重點。他會把各家公司的年報攤在面前埋頭苦讀，一旦消化了其中的內容後，那些附註就可以讓他清楚了解這家公司的真實狀況：某公司的存貨可能缺乏流通性，留在倉庫的時間太久；某公司過度提列折舊項目；銷貨毛利被過度低估；應收帳款可能被打了折扣；公司的商聲可能已經開始走下坡等等，諸如此類。


    到了一九七二年的勞工節時，我已經在金字塔工作三個月了。我仍然負責研究醫院管理產業，而且我仍然非常地看多。由於老人醫療保險和國民醫療補助制度的實施，大筆金錢流進了醫療產業，加上醫療產業的積極整合，這些醫院管理公司勢必從中得到相當多的好處。我正凝視著史坦頓島，心裡想著自己將要成為一個發現全新熱門產業的年輕當紅炸子雞時，人面獅身走進我的辦公室。人面獅身是金字塔中會計方面的偵探，所以只要他認為從會計觀點來看可能是好標的的公司或產業，他都有特權加以深入研究。當他完成研究之後，就會直接去找負責的分析師，告知他的發現。


    「我一直在注意那些醫療管理公司，」人面獅身說：「我認為他們的每股票餘簡就是狗屁不通。」他接著告訴我醫療管理這個產業快速成長的獲利來源，是政府對老人醫療保險和國民醫療的補助，但是這些錢只不過是根據習慣上的費率所預估出來的應收基礎數字。真正由政府方面支付的金額，會根據稽核查帳後的結果而定，而查帳通常需要花上二到三年的時間才会有結果。所以，人面獅身認為這些公司目前都以過度樂觀的態度來預估應收帳款，結果也使得獲利過度虛估。


    「這聽起來很有趣。」我說，同時不安地改變坐姿。我是金字塔公司裡最頂尖的醫療管理產業分析師，他告訴我這些公司利用應收帳款大玩數字遊戲，就好像告訴啦啦隊長，他支持的球隊的後衛已經和賭賭組頭勾結一樣令人沮喪。


    人面獅身接著說：「應收帳款還只是問題的冰山一角而已。真正嚴重的是，這些公司現在正是市場最熱門的類股，所以本益比目前都已經高達三十到四十倍了，但這是不對的。」


    「以老人醫療保險和國民醫療補助可能流入醫療產業的金額來看，政府將來可能會採用緊縮政策。政府終究會提高給付標準，並減少補助金的給付，如此一來，這些醫療管理公司的毛利率就會立刻直線下滑。這些公司的股價不應享有這麼高的本益比，他們的本益比應該和公用事業類股差不多才對。」


    ## 對抗人們心中根深柢固的觀念


    我從來不需要質疑人面獅身對於政府的法規了解多少。他年紀比我大，比我更德高望重，當他說出建議時，你最好洗耳恭聽。我非但沒有告訴他不必擔心這些公司會有什麼問題，或是他們可以很順利地應付政府修改法規的趨勢，反而非常認真地思考他說的話。我開始問自己，到底漏掉了什麼，或許我和這個產業貼得太近，也可能我並沒有很客觀地檢視眼前的證據。


    我決定不要再讓自已繼續當醫療管理產業的啦啦隊長，最好開始撰寫一篇報告，深入探討產業所面臨的問題，尤其是政府法規對這個產業可能形成的衝擊，然後預估這些問題對未來的獲利到底有什麼樣的影響。


    我草擬了研究報告的大綱，然後送給先知看。九月底，我收到一份先知回覆給我的備忘錄：


    > 公司內部備忘錄

    > 日期：一九七二年九月二十八日

    > 收文者：馬丁・舒華茲

    > 發文者：先知

    > 副本：人面獅身

    >

    > 我很喜歡你對醫療管理產業的研究報告大綱，希望你能全心全力完成此份報告。這份報告很有

    > 可能成為一篇非常、非常傑出的作品。隨時請人面獅身撥出時間協助你。我想他很樂意，也很有能力提供必要的支援。


    就這樣，我開始和人面獅身一起合作，幾乎把全部時間花在撰寫報告上。連續幾個週末，我都開車到位於西徹斯特郡（Westchester County）的美麗房子，兩個人待在地下室，攤開所有公司的財務報表和年報，深入研究其中的資料。我們繪製各類圖表，想從中找出任何可能不利於醫療管理產業的各種因素以及趨勢。


    我們所繪的圖中有醫療費用占國民生產毛額百分比分析圖（感謝老人醫療保險和國民醫療補助制度，這項百分比正在上升中）；有病床占用率走勢圖（那些成立三到四年的醫院中占床率並沒有增加）；有病人住院天數圖（這項數字在全國各地都下降，這可能是因為低出生率和門診設備的改善有關）；有醫療費用圖（在過去幾年中，價格年增率均被限制在六%以內）；也有新醫院增加率圖、醫療薪資占總支出百分比圖、醫院總支出占國民生產毛額百分比圖，以及一張總成本圖。我們針對毛利、淨利、總支出、每天每名病患對稅前淨利的貢獻額加以假設，而人面獅身則不停口中念念有詞：『馬丁，馬丁，這些公司的本益比不該這麼高，應該要和公共事業產業股一樣才對。』


    在初步完成的草稿中，我們根據過去五年的資料，討論了一些可能造成未來獲利成長從一五%到二〇%的高點開始下滑的因素。我們說明成本正在增加，而這項因素所形成的負面效果，將在該產業中兩大龍頭股美國醫院公司和美國國際醫療公司最新的季報中顯現出來。這兩家公司的股票本益比都相當高，如果預估正確的話，這兩檔會是首當其衝、受傷嚴重的股票。我們在這份報告最後用以下的警告作結：「雖然投資人對醫療管理產業的本益比倍數已具有共識，我們仍須指出，在未來如果這些公司的獲利出現任何令人失望的數字，將導致此一類股本益比的快速下滑。」


    到了十月底，人面獅身和我也已經準備好要把初步研究報告給小組成員。每一個小組都有週會，聚集所有分析師共同發表看法。基本上這根本是浪費時間，因為每個分析師不會在乎別人負責的公司到底怎樣，他們招呼自己負責的產業就忙不完了。


    週會裡唯一在平分分析師在做什麼的，只有營業員，因為分析報告——尤其像金字塔這麼有影響力的公司的報告——對於股價將具有直接而立即的影響。營業員通常是不准參加分析師會議的，在營業員和分析師之間依法有一道「萬里長城」（Chinese
    Wall，英美證券制度的術語），如此才能確保每一份研究報告都能公平地傳達到客戶、同業以及一般大眾的手中。雖然如此，營業員還是喜歡在分析師身邊打轉、攀關係，試圖從中得到一兩個小道消息，好占一些優勢。


    我對這份報告興奮異常。我還記得在研究所念書時，看著那些民主社會學生聯盟的怪人舉行反越戰示威時，覺得他們根本是沒種打仗的傢伙。但後來我進了陸戰隊才了解，或許抗議戰爭和參戰一樣，都需要勇氣。


    我提醒自己，對抗人們心中根深柢固的觀念，要比順從它需要更多勇氣。而現在，在人面獅身的幫助下，我將要面對人們根深柢固的想法。就像那些反越戰的示威者一樣，我也確信自己的想法是對的。


    ## 草稿外洩，代誌大條了……


    一如預期，沒有人對我們的報告發表任何意見，根本沒有人在乎醫療管理產業，他們唯一關心的，是我們的報告到底會不會損龜。金字塔和昆恩·勞伯公司不同，在這裡，團體作戰並不存在，每個人只針對自己負責的領域而工作。大祭司與先知也和法維亞與布朗契頓不一樣，甚至從來不會在週會中露面。


    每個參加這次會議的分析師都拿到一份報告的草稿。每個人都知道初步的研究報告是高度機密的，在討論過後，手上那份草稿都必須銷毀。保羅·史坦迪許（Paul Standish）是與會的分析師中唯一看起來對這份報告有興趣的人，史坦迪許是負責製藥產業的分析師。如果我們的假設都不確的話，那些製藥公司同樣也會面臨嚴重的壓力。


    我並不知道這一點，但結果是史坦迪許離開會議後，並沒有把手中的草稿銷毀。他把草稿帶走，並在幾天後從加州出差不程的飛機上，和另外一位製藥產業分析師討論起這份報告，那位分析師任職於史庫達（Scudata
    Stevens & Otz）——一家位於波士頓的老牌投顧公司。


    把報告內容告訴史庫達公司的分析師，無異將我們推向一個危險的局面，隨後在一九七二年十一月七日，史坦迪許更把我們推入毀滅的深淵：他把一份草稿寄給了史庫達公司的那個險小人。


    直到今天，我都想不通史坦迪許的腦袋裡到底在想些什麼。但毫無疑問的，把報告影本寄給另一家公司的人不只愚蠢，更違反了職業道德。


    十一月十三日那個星期，耳語開始在市場中傳開。史庫達那個卑鄙渾蛋把我們的草稿在他們公司內部廣為散發，史庫達的客戶開始賣出手中各家醫療管理公司的股票。到了十一月二十一日，消息洩漏的新聞出現在報紙上，而美國國際醫療公司的股票下挫了3%。一週之內，美國醫院公司股價重挫了二二%，有人意圖操縱行情的謠言在華爾街甚囂塵上。金字塔公司裡開始電話鈴聲不斷，感謝那道高里長城讓我們的客戶還一直被隔離在蒙古大草原上，但他們顯然為了沒有得到這些訊息而相當不悅。我們的散戶營業員甚至更為沮喪，怎麼會讓史庫達的客戶比他們更早拿到我們自己的研究報告？這到底在搞什麼鬼？大祭司和先知在搞什麼飛機？金字塔的經紀部門開始變得群情激憤。


    下層的一塊磚而已。我相信古夫王和加佛利王會叫大祭司和先知保護我，不讓我受到伤害。


    法律顧問向我簡要說明可能會遇到的狀況，並且向我保證我是整個部門裡非常重要的一員。「只要你告訴我事實，」他說：「就什麼事都不會有。」然後，當他站起身離開時，再補充了一句：「哦，馬丁，順道一提，如果在任何時候你的利益和公司利益衝突時，我們會聲明你再也不是一分子，而你也必須自己聘請辯護律師。」


    他一離開，我馬上抓起電話，撥給我哥哥傑瑞。傑瑞是戴維斯與吉伯特事務所（Davis & Gilroy）負責廣告業的律師，但現在他是我唯一能夠信任的律師了。「傑瑞，那些渾球剛剛把一個拉掉保險的手榴彈丟給我。我該怎麼辦？自己找律師還是怎麼樣？」


    「不。你什麼錯事都沒有做，而且只不過是去參加一個聽證會而已。如果你帶著自己的辯護律師出席反而不好，你只要出席，並告訴他們事實就好了。」


    這就是我在聽證會所做的事。十二月二十四日星期五，我走路到紐約證交所，接著在宣誓後作證六小時。我曾經通過海軍陸戰隊的拷問訓練課程，但這並不能幫助我面對這場嚴酷的考驗。會場中有一名法庭速記員記下每一句證詞，而且對方不斷壓迫我，一再重複問我同樣的問題。


    為什麼我以前那麼看好這個產業，卻會突然寫出一篇如此負面的研究報告？我從哪裡蒐集到資訊？我和誰討論過這篇報告？誰有機會看過報告？我曾經把複本交給同組人員以外的人嗎？我或任何人知道誰在過去一年當中，放空過美國國際醫療公司、美國醫院公司，或醫院管理產業中任何一家公司的股票？

    '
