    搞清楚自己的價值感是真實的，還是藥物的化學反應所造成的。我感到疲憊、氣憤，而且開始覺得自己可能不久於人世。


    哈克曼建讓我去找心理諮詢師，所以我跑去看伯納·蘭迪斯（Bernard Landy）醫師。蘭迪斯把我的身體和一部儀器連上線，檢查我的呼吸模式，想知道我一分鐘呼吸多少次。他要我從六百開始以每次減十三的方式倒數回來：五八七、五七四、五六一、五四八、五三五、五二二……。


    我以極快的速度倒數著，數到六七時蘭迪斯叫我停住。他說從來沒看過有人能在一分鐘內倒數得那麼快。


    「你這是什麼意思？」我向他抗議：「我數到一半你就把我打斷了。你根本就沒有給足一分鐘的時間。我可以在一分鐘之內倒數完的，讓我再試一次。」


    「馬丁，我不在乎你到底能數多快，我只是要趁你集中思慮倒數時，測量你的呼吸模式。大部分的人在集中意誌時，每分鐘的呼吸頻率是十二次，但你卻呼吸了二十次。」


    「是啊，那又怎樣？我要贏得這個測驗。我還是覺得可以辦得到，來嘛，讓我再試一次。」


    我就此和蘭迪斯醫師建立了長期的良好關係，那年整個冬季到次年春天，他持續教我一些能夠更放鬆，並且變得更健康的技巧。


    療程一直持續到六月份，才真正讓我擺脫對強體松的依賴。蘭迪斯建議我去度個假，慰勞一下自己。奧黛莉和我決定再去亞斯本度個兩週的假，自從兩年前決定開始募集沙伯林納合夥公司後，我們就沒再造訪過那裡。


