    我現在只想好好睡上一覺，但是今天可不行。我可以隨時找到時間睡覺，但是像這麼棒的機會二十年內只會出現那麼三、四次而已，而我可不想錯過這次的大好良機。我沖了個澡，換上乾淨的睡袍，吃了一點早餐，然後在早上六點三十分又回到了我的作戰指揮中心。傳真機整個晚上都有東西傳進來，把我的帳戶進出資料傳到我手上。我把前一天的交易和結算公司的資料仔細比對了一下，因為今天和以往完全不同，我得在市場開盤前把一切都安排妥當。市場的狀況將會波濤洶湧，所以任何一個輕微的小錯誤都可能讓我賠上天文數字的金額。我約略把《紐約時報》和《華爾街日報》以及其他市場行情報導刊物瞄了一遍，歷史悠久的《紐約時報》頭版上以顯著的標題寫著「開戰了！」。


    到了七點半，聯軍指揮官施瓦茲科夫 (Norman Schwarzkoff) 將軍舉行了一場簡報。這是歷史上最密集的一次攻擊行動。巴格達簡直被炮火轟成人間煉獄，而所謂的共和衛隊也被消滅了，伊拉克的空軍戰鬥機還沒從基地起飛就被擊毀。海珊躲了起來。沒有任何一架美軍飛機遭到擊落，也沒有任何的傷亡發生。


    這一切都告訴我該馬上軋平手上的債券期貨多頭部位，然後買進股票和 S&P 指數期貨。我打電話到倫敦。黃金和原油期貨持續保持在穩定的狀態，這表示債券和歐洲美元也將隨之走穩。該是聽聽收銀機鈴聲的時候了。我決定一開盤就開始賣出我的債券和歐洲美元期貨。上午八點整，我跟康許及高費德連上了線。芝加哥的債券期貨賣在二十分鍾後就要開盤了。


    「舒華茲，你為什麼要加入我心愛的陸戰隊？」


