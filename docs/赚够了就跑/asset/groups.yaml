    ## 我如何應付程式交易


    對一般的操盤手而言，程式交易（Program trading）實在是一場災難。我暫稱程式交易為「任天堂維加斯」（Nintendo Vegas），因為目前它平均每週都占紐約證券交易所一五％到二〇%的成交量。在一九八七年十月美國股市戲劇性重挫之後，由於程式式交易毫無理性的賣盤，對原本就已經疲軟的市場造成極大傷害，所以市場掀起一陣廢止程式式交易的聲浪。但是最後，有關當局引進了一種重點控制（circuit
    breakers）制度來限制程式式交易在單一交易日中對股市可能造成的破壞。所有在一九八七年崩盤那天參與程式式交易賣盤的大型經紀商，都誓言不再從事這種可憎的行為。但隨著時間流逝以及貪婪之心作崇，大部分的玩家又再度回到這種賭戰中。大盤當中每天有一五%到二〇%的成交量是這些大單子做出來的，金錢和權力在華爾街永遠能夠大行其道。


    不過呢，雖然情勢這麼惡劣，還是有辦法可以生存，甚至維持獲利。你必須知道市場的趨勢，然後耐心等待這些科技主義者把市場壓低到你的軌道線上。除了可以用馬克·庫克的紐約證券交易所股價淨變動指標（TICK）和道瓊股價淨變動指標（TKI）操作法之外，也可以在程式式交易接近尾聲時反操作，以便在它所造成的極端走勢結束後獲利。就像任何一名優秀的戰士一樣，你要耐心等待，直到這些機械性的惡毒賣盤告一段落後，再用反向部位加以反擊，但是在採取這種策略時，一定要很有紀律地設定停損點。


    這就是我一向採用且有效的策略。雖然我不是很喜歡使用這種游擊隊式的操作法，但是這種做法可以幫我調整自己在面對不斷改變的市場時所需要的技巧。我在對付程式式交易所帶來的亂象這方面相當成功，我一直在我的作業系統中加進新的工具，並持續地用我的軌道線和移動平均線來嚴格執行停損。


    ## 操作中的小把戲


    在我就讀小學一年級時，老師問班上的同學長大後想要做什麼。我說：「我想當偵探。」這種喜好探究的天性伴隨著我一起長大。我喜歡尋找事情的線索，綜合大量看似無關的資料，然後從中歸納出一個合理的結論。雖然這些觀察結果不見得完全科學，但許多年來，它們仍讓我在重複出現的現象中受惠。我通常不會將這些觀察結果當作另外一種工具或分析模式，但是絕對會在這些現象出現時，把它們列為我操作決策的重要影響因素之一。


    那些能夠幫我發現低風險、高獲利機率的技術指標，是我操作方法的核心的核心。但是我一直很用心在尋找市場中的各種型態、結構，以及重複發生的狀況，不論它們是多麼細微，都能讓我在某些交易中掌握到市場的異常狀況，並且因而獲利。


    ### 圖形中的跳空缺口


    跳空缺口是我在操作股票和期貨，特別是股票時的一項重要工具。所謂的跳空缺□，就是當標的物的開盤價明顯高過或低於前一天收盤價，並在當天盤中維持此項差異所形成的技術型態（見下頁圖）。


    ![](img/38fedf09758cbfe4a48e355e6bd158cb_367_0.png)


    這種情況通常出現在某則新聞公布後，或是有出乎投資人意料之外的情緒發生時。在技術圖形中，它的樣子就像是一個缺口。如果這個缺口沒有在二或三個交易日中被填補起來，那我們就得得到一個強烈的訊號，顯示應該建立一個和該缺口跳空方向相同的部位。這種變化常常可以持續一段很長的時間，並且成為一種非常好的操作決策輔助工具。


    一般而言，跳空缺口可以分為三種型態。第一種是突破缺口（Breakaway Gap），這種缺口發生在股票或期貨跳空脫離一個盤整區間時，代表一個很強的趨勢正開始發動。第二種是持續缺口（Continuation
    Gap），它發生在股票或期貨已經漲升或下跌一段時間之後。第三種是竭盡缺口（Exhaustion Gap），它發生在一個上升或下跌趨勢將要結束時，而且通常價格會在這種缺口出現後，由原來的主趨勢反轉。


    共同基金投入資金時：另一個有趣的型態是由共同基金投資股票的自動交易所造成的。市場通常會在前一個月份的最後一個交易日，和新月份第一個交易日的前幾個小時中有較強勁的表現，這是有新的資金投入共同基金，使得共同基金自動進場所致。這種型態也會在每月中旬出現，因為那時也會有新資金投入指數基金當中。我會在我的記事本中寫著「月中買盤」，來提醒自己注意這個現象。在空頭市場中，觀察這些資金流出對股市大盤的影響，也是我覺得很有趣的一件事。


    三日定律：不論何時，只要像微軟或英特爾這種股票出現連續三天同一個方向的價格變動時，你就不應該在多頭走勢的第三天作多，或是在空頭走勢的第三天放空。因為這通常是一種短暫性的盤勢。通常股票若出現連續三天的相同走勢，第一天會是由市場裡先知先覺的玩家發動的，而後知後覺的操盤手則在第二天跟進，然而到了第三天，連那些原本不知不覺的操盤手都開始進場時，這個走勢就已經接近尾聲了。這是一條重要的定律。如果一檔股票遇到利空消息而下跌時，在跌勢進入第三天就應該開始尋找買點，因為那些壞消息可能已經在過去三天中被市場消化掉了。


    **賣權／買權比率：** 我的朋友崔格是第一個發現可以利用芝加哥選擇權交易所的動態，作為測量市場氣氛反向指標的人。他的理論是：如果連一些比較不專業的投資人都開始利用買進選擇權交易來達到賺大賠小的目的，通常這就表示市場的头部和底部已經快要出現了。


    **賣權／買權比率**，顯示出市場中比較不專業的投資人對後市的空頭或多頭的預期心理。當市場中出現一個極端的賣權／買權比率時，市場經常都會往相反方向修正。理論上，一個非常高的比值通常代表市場中的恐慌心理已經到達極點，而空方的賣盤即將結束，市場出現反彈的機會也不遠了。例如，一個高於二的賣權／買權比率，顯示市場中空頭氣焰十分高漲（代表買進訊號）；而當賣權／買權比率低於○·四五時則顯示很高的買權成交量，也意味著市場中多頭氣氛濃烈（代表賣出訊號）。就像其他所有指標一樣，這個指標也必須和其他指標或資料搭配來看，才能幫你找到最佳的進場點。


    **市場對新聞的反應：** 佐爾納曾經教我一個非常重要的指標，用來分析市場對新聞的反應。如果出現利空消息，但市場並未做出任何反應，反而持續上揚時，這就是一個強烈的多頭訊號，這代表市場已經吸納了這個利空消息。從另一方面來說，市場如果對利多新聞無動於衷的話，也代表市場已經完全吸纳了这个利多消息。以股票市场而言，不少投资人会因为利多不涨，甚至利多反弹而感到困惑，此时这个所谓的「利多消息」，可能已经被市场完全反应了。


    我从鲍伯．佐尔纳那裡学到最重要的一课是，当市场糟到让你觉得开始反胃时，或许就是你该再度加码摊平的时候了。但是这种做法只该在你已经设下严格的停损指令，并且有决心执行停损时才可使用。


    新高／新低：专门报导金融市场的报纸都有股票新高／新低清单。根据牛顿第一定律，一个活动中的物体会持续它原来的运动方向，直到有外力介入为止。同理，一档下跌中的股票会持续下跌，直到有显著的买盘介入为止。一档上涨中的股票也会持续走高，直到卖盘使它停住为止。所以新高／新低的个股清单，是你可以用来找寻新的操作想法的良好参考。


    週一效应：我在过去几年来发现到一个现象，那就是随著投入指数型基金的资金愈形庞大，使得星期一再也不是以前那个无聊的交易日了。共同基金经理人会在星期一将他们再週末收到的新资金投入市场，因为他们有义务要完全运用那些资金。由于星期一的成交量通常会低於一週中其他的交易日，所以共同基金的动作会加大週末股市上扬的效应。


    市场的机率日曆：每天我都会去了解历史上的今天发生了什麽事，并把这些事实牢记在心裡。虽然這些歷史並不會讓我去建立部位，但是它們會使我更小心應付歷史型態重現的可能性。


    我會隨時放一本「股票操盤手市場機密日曆」（Stock Trader''s Almanac Market Probability Guide）在桌上，這本日曆提供了市場在一年中每個交易日內上漲的機率，而我則將其中最高和最低的數值做上記號。如果現在的市場處於多頭當中，而當天市場上漲的機率又高達七五%時，就應該考慮作多了。


    選擇權到期效應：我一向會在衍生性金融商品（如選擇權和期貨）的到期日當天小心因應，此外我也注意到市場通常會在到期前一週的週四開始持續下跌到週五，然後反轉走高並上漲到到期日當天為止。如果我看見這種型態正在形成時，會很注意不要讓自己的空頭部位被軋到。通常在選擇權到期日裡，買進和賣出的程式式交易會讓市場上沖下洗，把你的部位震出場去，甚至引誘你建立錯誤的部位。


    此外，我也發現那些程式式交易者常常會在到期日當天，讓市場在最後半小時內以強勁漲勢作收，並在下一個交易日的最後一個鐘頭建立相反的部位。我將這個現象稱為「舒華茲交錯法則」（Schwartz
    Rule of Alternation）。在選擇權和期貨的到期日操作是一件很困難的事，由於市場在當天會因為衍生性商品到期而出現假突破，所以建議投資人還是在那天退場觀望為妙。


    利用半小時效應：我最近發現不知道為了什麼原因，程式式交易通常是以半小時為單位時間點而發動。這或許是因為某個頭腦簡單、四肢發達的傢伙把鬧鐘定在十一點整，時間一到，他就按鈕啟動買進程式，而另一個程式操盤手的錶則設在一點三十分。我也發現在接近中午時分，會出現一種我稱之為「午間漲勢」的買盤，這也可能是因為這些程式操盤手趕著在午餐前把部位買齊所造成的。每個交易日的最後半個小時，市場波動總是特別劇烈，因為所有的機構操盤手都急著在收盤前採取動作。


    掃蕩高點，掃蕩低點：在平靜無波的交易日裡，市場只是緩慢地在一個狹窄的區間內上下波動，而期貨交易所的場內操盤手們，則計算著要如何利用掃掉別人停損單的機會來大賺其錢。通常停損單都會放在前日的高點以上或前日的低點以下，所以在市場沒有特別趨勢的交易日中，這些知道別人停損單放在哪裡的場內操盤手，就會商量好一起把高點附近的停損單給掃光。一旦他們得逞後，就會反向急殺，把低點附近的停損單也一併解決。


    想要應付他們這種做法，就要在前日的低點以上放買單、在前日的高點以下放賣單，跟隨著這些場內操盤手來賺些錢。


    休假後的第一筆交易：在你休息一段時間後，第一次重回市場時，請務必放慢下單動作，並且調整身心狀況和眼睛，好讓自己重新熟悉市場的韻律。每当我迫不及待地上戰場廝殺時，都難免在反應前就惹上麻煩。必須在你回復理性思考並排除所有情緒性因素後，才進行休息後的第一筆交易。

    '
