  - '[PAGE 52]


    作過的十幾檔股票有偏多的看法。我操作過的都是一些大型企業股，如辛德仕、IBM、漢威聯合(Honeywell)、特利電(Truene)、寶麗來，以及全錄(Xerox)等，以一個證券分析師的眼光來看，這些股票都有良好的基本面因素作支撐。它們每天的成交量都非常大，流通性也極佳。流通性非常的重要，因為我是一名當沖顧客，在幾個鐘頭，甚至幾分鐘之內都可能會在市場中殺進、殺出好幾趟。此外，選擇權的價格波動比股票高得多，這表示以同樣的資金，我可以享受更多股價上漲帶來的好處。我通常會同時保有三到四個買權部位，而且大多數的賭注都在五千到一萬五千美元之內，這正好符合我的營運資金規模。一般而言，我希望能夠在每一筆交易中賺進一千到三千美元。


    自從在一九七六及一九七七年年當中維持損益兩平的局面後，我現在已經開始穩定獲利了。以前當我憑著小道消息或自己的直覺進場交易時，只要市場發生任何意料之外的狀況，我就好像踏入了從未涉足、不知名的地方般孤立無援。但是現在，我每天晚上固定研究技術圖形、回顧並更新趨勢線、計算移動平均指標、推算出價格的轉折點、設定我的進出場價位，這些動作都使我充滿自信，就像一個棋手在棋盤上依照自己的想法來移動棋子，並隨時能預見接下來至五至七步可能要怎麼走。我的操作並沒有太大的改變，但是我用一種更聰明的方法交易。


    研究市場的過程成為我內心力量的來源，幫助我將頭腦中潛藏的智慧與能力充分發揮。它幫助我做出更好的決定。你不能呆呆地站在原地不動，在市場裡你沒有足夠的時間仔細思考，必須馬上決定要進攻或撤退，要加碼或把部位砍光。擁有一套操作方法給予我更多的力量，因為在心中就能看清楚自己所做的每一個動作。這套方法讓我有足夠的信心在必要時機馬上扣下扳機、做出決定。'
  - '[PAGE 53]


    在一九七九年第一季當中，我的營運資金累積到五萬美元，這已經是所有資金的半數了。我深信自己能夠在一九七九年的第二季，再賺到另一個五萬美元。到時就該是展開下一個階段工作——取得某個交易所會員席位的時候了。


    一九七三年，芝加哥選擇權交易所（Chicago Board Options Exchange）成立，專門交易各種掛牌的选择權。它的快速成功促使其他交易所，像太平洋證交所、費城證交所及美國證交所，都開始努力增加選擇權契約成交量，以期在選擇權市場中分一杯羹。根據我原本的計畫，是搬到芝加哥去，但是如果我可以在美國證交所取得會員席位的話，又何必非要離開紐約搬到芝加哥去呢？


    # 找門路，正式在交易所卡位！


    巴布·傅利曼（Bob Freeman）是蒙哥馬利證券（Montgomery Securities）一位知名醫療用品的產業分析師，也是我的舊識。我們曾經一起在一九七六年組成《機構投資人》（Institutional
    Investors）雜誌的「全美研究團隊」（All America Research Team），所以常在會議中碰到面。有一天傅利曼向我提起他有一個同母異父的弟弟叫丹尼·魏斯可夫（Danny
    Weisskopf），是一個在美國證交所工作的作價者。


    當我提起想要買一個會員席位時，他就把我介紹給他。魏斯可夫負責交易的是貝理娛樂公司（Bally Entertainment）的選擇權，這是當時交易場內最熱門的一檔選擇權，當我去見他時，他忙得'
  - '[PAGE 54]


    像個正在照顧四胞胎的保母似的，所以他就把我轉介紹海斯、諾爾。


    諾爾為魏斯克夫工作，年紀和我和相當，而他從一九七〇年起就已經在交易場內工作了。像我一樣，諾爾也沉醉在技術分析的領域中，而且，他也和我一樣希望能夠操作自己的資金。我們很快就變成好朋友。每週總有幾天，我會告訴在赫頓公司的祕書員佛莉說我要出去吃一個長時間的午餐，然後直奔交易所。我在訪客櫃檯登記，拿到臨時訪客證，然後櫃檯就會廣播：「海斯、諾爾」海斯、諾爾」上拜斯·諾爾！櫃檯有你的訪客。」「諾爾下樓來，然後我就戴上訪客證跟著他進入交易場。在那幾次拜訪中，我像個陸戰隊員似的偵察著新環境，思考著自己要如何在這裡求生存。我會跟在諾爾身後，看他如何作業，觀察周遭的地形，記下誰負責什麼契約的交易，誰又是哪裡的職員，電話在哪裡，廁所又在哪裡。


    「馬丁，你一開始應該先租一個會員席位。」有一天諾爾對我說。「這樣的話，你可以省下一些資本，直到確定你做得來時再說。


    「這是個爛主意！」我說。「我已經確定自己可以做得了。我就是要買下一個會員席位。「想擁有會員席位，必須直接向交易所辦理買賣事宜。交易所會從中收取一筆他們喜歡稱為「轉換費」（Transfer）、為數不少的佣金，而會員席位的行情也分買盤和賣盤。交易所總是有空下來的會員席位待價而沽。在一九七九年夏天時，一個席位的買盤大約是八萬五千美元，賣盤則大約是九萬美元。這表示我大約可以用九萬美元買到一個席位，另外再加上二千五百美元的轉換費，不過首先我得先登記成為全國證券交易商協會（National
    Association of Securities Dealer）認可的'
  - '[PAGE 55]


    合格交易所，並上過美國證交所一個如何操作選擇權的課程。到了六月底時，我已經賺到了十萬美元，終於一切準備就緒，開始準備行動。


    # 在華爾街，辭職最點選在禮拜一


    這時，我迫不及待想要從赫頓公司離職。在幾乎長達一年的時間當中，我把工作設定在「自動定速駕駛」的狀況下，告訴祕書攬掉所有電話，躲在辦公室裡，關上門，打開報價器，然後開始交易。我一天中曾經執行過三、四、五，甚至六筆交易。


    在我的辦公室裡安裝一部即時報價器，是一件很重要的事。我是赫頓公司裡唯一擁有個人報價單機的證券分析師，這部報價單機是我在一九七七年跳槽到赫頓時和他們談的條件之一。在我最早的幾份工作中，整個研究部門都只有一部報價單機，而且還設在大廳裡。我總是不斷地走去看那部機器，老闆看到我一直站在大廳裡看報價，便開始懷疑我到底在搞什麼東西。


    我從很久以前就學到華爾街的遊戲規則：想要增加收入，最簡單的方法就是換工作。華爾街老闆都一個樣，就是：付你愈少薪水愈好，只要能夠把你勉強留下來就可以了。但當別家公司需要你，就會願意付更高的薪水，因為他們知道這是你換工作的唯一理由。我被赫頓公司的法人研究部門負責人丹·墨菲（Dan
    Murphy）挖角時，就向他要求在我的辦公室裡裝上一部報價單機，做為跳槽的條件之一。就這樣，我可以在別人不知情的狀況下，隨時掌握市場動態。'
  - '[PAGE 56]


    我覺得，要向墨菲辭職的最好時機，是星期一 的早晨――一週和一天剛剛開始的時候。我選擇了七月九日星 期一的早晨。我原本想直接走進他的辦公室遞辭呈，然後馬上走出去，這是我
    們在華爾街常用的招數，但奧黛莉建議我採取不同的做法。


    「對墨菲據實以告，說明你的計畫。讓他知道你不是跳槽，只是想出去當 一名操盤手，管理自己的資金。他會尊重你的想法，如果有一天你還得回去的話，也留下一條後路，有利無弊。」


    所以，那天當我進去見墨菲時，我說：「很感謝你在赫頓對我的照顧，但是我決定改變自己的生涯規劃。我九年半以來，一直擔任證券分析師，我去年剛剛結婚，希望建立一個家庭，再也不想到處出差了，那不是我想要過的日子。我一直想自己當老闆，所以現在，我想要自己去操盤。」


    墨菲聽完，起身關上辦公室的門。才剛有兩名證券分析師跳槽到別家公司，現在情勢有點敏感。「好吧，」他說：「但是你得幫我個忙。請你暫時保密，因為我需要一些時間來找新的分析師。如果你現在就對外宣布你要離職，同事們會覺得這個部門就快垮了。」


    我答應墨菲，甚至還替他多出了幾趟差。我們安排了一個到費城的行程，分別到六場不同的公司做六個商務拜訪，其中一場在上午九點、一場在上午十點三十分、一場午餐會報、一場在下午兩點、一場在下午三點三十分，最後一場在下午四點三十分，然後趕搭快速火車回紐約。我痛恨這種行程，但是墨菲說：「請你幫我這個忙，當一天和尚撞一天鐘吧！」


    我離職那天，發生了一件前所未聞、令人驚訝的事情，那就是：墨菲讓我在離職後的六個月內，仍然在赫頓保有一間辦公室。在華爾街，通常當你告知老闆要離職的那一刻起，他們會馬上封'
  - '[PAGE 57]


    鑽你的所有檔案，檢查你的公事包，把你抓起來照相個直腸鏡，然後由警衛「送」出大門。但是由於這次我做了徹底的生涯改變，出門開創自己的事業，所以我覺得自己走得像個英雄。


    我的計畫成功了。我發展出一套適合個人風格的操作方法，讓佐爾納成為指導人，並經由操作賺進了十萬美元。我在美國證交所買了一個會員席位，離開了赫頓公司，正式成為一名操盤手了。


    一九七九年八月十三日，星期一早晨，我駐足在美國證券交易所的入口處，深深吸了一口氣，拿出了會員徽章，然後走進那扇寫著「會員專用」的大門。該是我大展身手，鋒芒畢露的時候了。


    # ⑫⑳② 花一年時間，準備一筆夠多的資金


    我常幻想自己是一個文藝復興時期的人。我喜歡回到過去某段歷史時期，想像自己如果生在那個時代會是怎樣。如果我是十九世紀的年輕人，可能會成為一個因為淘金熱而湧向加州的拓荒者。我會想辦法籌一筆錢，然後向西到加州去尋找黃金。


    我在一九七九年創業，一直在股票、債券、選擇權和期貨市場中淘金。我需要十萬美元做為營運資金，但其實我應該訂下更高的資金標準，只是我非常急著要出外闖蕩，而十萬美元是我估計要達到獲利目標所需的最低營運資金了。如果你想要以操作維生，一定要給自己一年的時'
  - '[PAGE 58]


    間。有足夠的營運資本操作，才能支應日常生活開銷。足夠的資金也可以讓你可以相當的規模從事交易，並使你持續保持獲利。


    如果你另外還有一份「正職」，就不需要為生活開銷另做準備，但仍然要有足夠的資本讓自己有機會成功，並以一個自己感到順手的規模從事操作。想要控制你的操作行爲，最簡單的方法，就是在經紀商那裡開一個專為操作而設的帳戶，而且千萬不要把超過你不能賠掉的資金放進這個帳戶裡。


    我無法告訴你該放多少金額，這是一個非常個人化的決定，但不論多少，你就只能放這麼多錢進去。然後，要有把這筆資金輸光的心理準備。


    在自行創業之前，你一定要能夠完全控制自尊，並且了解「獲取利潤」遠比「決定正確」重要。在你準備藉由金融操作維生前，必須經由活躍的操作行爲來求證明能力，並測試操作方法。這表示，我得不斷用營運資金積極操作。如果我已經由操作累積十萬美元，就顯示自己已經發展出一套可以成功的方法。我不認為借錢充作營運資本是正確的決定，戒賭中心裡多的借錢當賭本的人。


    沒錯，我是向小男子們借了五萬美元，但那些只是備用資金，而且我下決定絕不動用，事實上也沒用過這筆錢。對我來說，那五萬美元就像小飛象（Dumbo）的神奇羽毛一樣，只
    是用來作飛行時心理上的保障，一旦需要用它時，就表示我已經失敗了。而我絕對不能失'
  - '[PAGE 59]


    敗，至少這次不能。

    賺到十萬美元是一回事，要保住它又是另一回事了。奧黛莉和我犧牲享受、努力儲蓄使我可以順利創業，我因而深深體會到資金管理的重要性。讓營運資金在操作過程中持續成長，需要充分的自律，而且，如果你能在賺錢的同時把它維持住，你就比較不會把事情搞砸。優秀的操盤手每天都可能獲利或虧損數千美元，通常讓人有「錢來得容易，去得也快」的印象。這並不正確。我們不因獲利而欣喜若狂，也不會因虧損而哀哀啜泣，但這並不代表我們視金錢為無物。

    傑克·史瓦格（Jack D. Schwager）在《金融怪傑》（Market Wizards）一書中所提到最有趣的一個論點，就是：幾乎每一個他所訪問過的操盤手都會提到自己曾經如何歷經失敗，但最後終於成為市場贏家的故事。你的營運資本一定要大到讓你有足夠的時間邁向成功，並且大到足可以不讓你在一筆交易後就被淘汰出局才行。當我剛開始在美國證交所操作時，我在幾個鐘頭內就輸掉了所有營運資本的一〇%，但是因為營運資金夠多，而且我的停損點也夠接近，所以我在市場轉向有利於我的方向前，並沒有砍掉部位。此外，我是一個專打一壘安打的人，我不期望擊出全壘打。我的操作風格就是累積許多的小額獲利，而非趕上一波大行情，所以我的營運資本並不需要像那些總想把球擊往外野圍牆的人那麼高。

    正如那些因為淘金熱而湧向加州、占下土地和財富的人一樣，最有機會致富的操盤手是那些能夠自己賺到營運資金的人。'
  - '[PAGE 60]


    # 第3章


    # 贏很多了？換張賭桌吧！


    賭局救我的操盤道理


    汗如雨下。我抬起頭看著牆上的報價螢幕，查看我的部位狀況。我受夠了，我得轧平這個部位，否則可能會把一切輸光，所有努力的成果都將化成泡影。四周的人不斷吔喊：「來嘛！馬丁，別放棄這大好機會！」「是啊，進場玩玩嘛！拍下扳機吧。」「對，別站在那兒發呆！」「採取行動吧，你這個懦夫。懦夫……。」。


    我一刻也不願再等。我站在線上準備好，看著尤基（Joe）那張又肥又黑，上面有個大鼻子的臉龐。我向他打出手勢，擁擠的人群逼使尤基的身體一下子靠左、一下子靠右、一下子被擠下走道，然後又斜靠在牆上。我在空中揮舞著拳頭。我做到了，轧平了我的部位。控制權再度回到手中。


    小時候和別人交換棒球明星卡，是我接觸賭博的開始。我會在星期六的早晨，從車庫中把腳踏車騎出來，然後在我家附近收集汽水瓶，一個十二盎司的瓶值三分錢，而一個三十二盎司的則值五分錢。到了'
  - '[PAGE 61]


    中午，就有價值四到五毛錢的瓶子在我的小車上叮噹作響，這在一九五三年，對孩子來說可以算是一筆大錢了。我會把瓶子拿到街上的雜貨店，換取一包包的棒球明星卡。


    每一包卡片索價五分錢，裡面裝有五張棒球明星卡片。我扯開其中一包，拿出裡面的口香糖。沒有人會去吃那個口香糖，它的味道嘗起來像是牆上的壁紙，口感簡直就像是製皮鞋用的牛皮，只有很小的小孩子才會笨到去吃它。接下來我會把卡片外面一層粉紅色的包裝紙拿掉，仔細檢視每張卡片，找出我已經擁有的，期待著能找到一張曼多（Mickey
    Mantle）或是李茲都（Pifi Rizzuto）的卡片，同時又禱告我不要拿到像匹茲堡海盜隊和華盛頓參議員隊那些爛隊球員的卡片。最後，我和朋友會找個地方對著牆壁交換卡片。


    我的賭場筆記：想要成為贏家，必須遵守規則、果斷行動。


    # 我愛賭，但並不打算毀了自己的一生


    我十歲開始，就靠鑰匙打工。冬天時暴風雪從加拿大直吹而下，學校會因此停課，而我則抓著鐵鑰出門。我會鑰一個早上的雪，每條走道收費一美元，每條車道收費二、五美元。那可是很吃力的工作，而且常常當我快要完工時，鑰車一經過，又耙雪給推回原位。我不斷努力鑰雪，到中午時我的口袋裡大概就有個七、八美元了，這在當時可真是一筆大錢了。


    鑰完雪後，我會直衝艾迪·柯漢（Eddie Cohen）家的地下室去玩牌。我們通常會玩一種名叫'
  - '[PAGE 62]


    「大逆轉」的牌，有時候我一個下午玩下來，可以賺進十或十二美元，這比起鐘雪來說當然是好太多了！


    等我到十五歲時，我們也從玩大逆轉進階成打撲克了。星期六的早晨，我會去當外祖父的褓弟。雖然外祖父的高爾夫球打得並不高明，小費倒是給得很大方。他會遞給我一張十美元的鈔票，這在一九六〇時也算是一筆大錢。然後我還是會直奔柯漢家的地下室，和幾個老哥兒們見面。


    其中一個傢伙是唐尼（Donny K.），他父親在西海文市（West Havre）經營一家汽水公司。我喜歡和唐尼玩牌，因為他身上總帶著很多錢。他的父親開了部凱迪拉克，而且是木橋鄉村俱樂部的會員，但唐尼顯然不是個多聰明的人，他永遠搞不清「不要拆掉對手來湊順子」這個基本原則。我藉著修理唐尼得到不少樂趣，因為當我和比自己有錢的人對抗時，就會有一種亢奮的情緒在心中激盪著。


    我的父母似乎對我的賭博行為不怎麼在意，可能是因為我從中贏了很多錢的緣故，但是當外祖父知道我用他的錢幹了什麼好事後，他簡直氣瘋了。他向我的母親抱怨：「你怎麼可以讓他去玩牌，還賭成這樣子呢？要是他現在染上賭癮，這輩子的確辦到了。


    我的確沉迷於賭博，但是我並不打算毀了自己的一生。在我拿到汽車駕照後，我會帶著五十美元開車到水道賽馬場（Aqueduct）去混，試著在回家時能夠贏個一百美元或更多錢。有很多次，我就像玩牌一樣，我發現自己對賭馬也很有有一套。而且我到賽馬場純粹「做生意」，不是去吃喝'
  - '[PAGE 63]


    或搞社交活動，而是去賺錢的。我會研究馬的跑姿、研究訓練師、把騎師的狀況製表研究，並深入了解馬場裡跑道的狀況。我會注意馬匹的血統是否純正，以及最近一次比賽的結果如何，希望從中找出一些線索。我會翻閱《每日賽馬快報》(Daily
    Racing Form) 的評等報告，來衡量哪一匹馬在哪天的哪一場比賽中最有可能勝出。我也計算每匹馬的速度，用來決定要怎麼下注。最後，我會仔細審查賭金計算器的顯示板，找出其中異於平常的狀況、確認下注的機會，並等到最後一分鐘，然後下注。


    我喜歡水道賽馬場。那裡環境清潔、綠草如茵，那些馬匹是如此美麗，而且沒有人會在意我父親的爛工作、我的猶太裔身分，或是我沒有錢加入木橋鄉村俱樂部。如果有人想進入水道賽馬場的俱樂部會館，只需要多付點錢就行了。


    # 我的賭場筆記


    事前的充分準備絕對可以讓你得到回報。比其他玩家知道更多，是非常重要的。


    一件事。


    在安默斯特學院讀書時，我下課後最喜歡做的事就是跑到賽馬場，通常獨自前往。在一九六三年時，安默斯特並沒有太多學生會去賭馬。星期五的足球訓練結束後，我會徒步走到位於校園書店旁的車站，搭上巴士，直接趕往位於新罕普夏州欣斯代爾市(Hinsdale)
    的小型跑馬場。巴士經過美麗的新英格蘭區農場，我看著窗外秋天的樹木，心中想著如果我將來能擁有一個種著黃橙橘樹、蓋著暗紅色穀倉、圍著白色圍籬、種滿綠色牧草的農場，並養著屬於自己的好馬，那該有多好。在'
