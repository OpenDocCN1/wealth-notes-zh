    # 慘遭犧牲，但也讓我變得更堅強


    那些醫療管理產業的高級主管和我往日的哥兒們，都不再提供任何資訊給我。我成了一個沒有題材可以研究的分析師。更糟的是，當時整個市場都處於空頭狀態中。小型股票價在一九七二年下半年開始下跌，在一九七二年秋季，唯一還能上漲的股票只剩下所謂的「靈巧的五十檔」（Zifty
    Fifty），那些都是法人投資機構的最愛，如寶麗來、柯達和雅芳等等。這五十檔股票擔任了當時多頭的主秀，本益比都高達五十到六十倍。


