    # 第8章

    ## 我爹地是冠軍操盤手！


    ### 為自信與自尊而戰


    為自信與自尊而戰


    在《老千騙局》（Liar''s Poker）一書中，麥可·路易斯（Michael Lewis）提到操盤手總是喜歡想像自己是「賭場裡最神氣的贏家」，但直到一九八三年為止，一般大衆還是無法看出，到底誰才算得上是真正的贏家。


    一九八〇年代早期，操盤手是一群活在狹小、隱密又具有宗教神祕色彩生活圈中的人。對一般大衆而言，我們並不存在。我們在市場中殺進殺出，在短數小時內用別人一輩子都不會拿來做交易的錢，在市場中搏鬥，但這一切並不為人所知。偶爾有一些特殊的案例，像杭特（Hunt）兄弟或比利·索依斯特（Bill
    Stoss）這些人，其實都是在市場輸了大錢才會被媒體報導出來。大致上來說，我們的所作所為都是在別人無法知曉的狀況下進行。除非我們破產或大發特發，否則無法得到一般大衆的注意。


    可是在一九八三年，我卻在一份金融期刊裡看到了這樣的一篇廣告：


    誰是全國最頂尖的經紀人、投資顧問及操盤手？

    和全國最棒的好手一起爭奪這個榮銜吧！


    比賽簡章：經紀人、投資顧問或投資大眾均可參加。參賽者將於二月一日被指派一個交易帳戶，如果操作績效優良，可提出個人交易的損益評估表以供評鑑。領先者名單於每月公布，並自二月一日起，以交易帳戶市值增加的百分比作為評審的標準。在交易帳戶的金額方面，股票、股票暨選擇權，以及商品期貨三個項目的參賽者帳戶起始餘額為五千美元，選擇權項目參賽者則為一千美元。


    想參加比賽嗎？請電金融操盤手協會。

    電話：（213）827-2503


    看第一眼，我就知道這是一場為我而辦的比賽。這真要感謝我那值得信任的德勵報價機，它讓我確信沒有任何人像我一樣能成功地操作S&P指數期貨，而這個比賽將給我一個機會向世人證明這一點。我喜歡競爭，也需要競爭來為我的生活製造活力。我已經準備好向全世界宣示，自己就是那個最神氣的贏家。


    我打電話給主辦單位，對方說：「金融操盤手協會您好，我是諾姆·查德（Norm Zahd）。」


    我從來沒聽過查德這號人物，也壓根兒沒聽說過金融操盤手協會這個組織，我確信整個華爾街也沒聽過，但那又怎樣？「查德，」我說：「不管你是誰，我要報名，我是全國最棒的操盤手，而且也準備好痛宰每一個參賽者。


    後來我才知道，諾姆·查德活脫就像是交易界裡的唐·金恩（Don King，拳壇傳奇經紀人）。就像金恩，禿頭的查德也是一個擁有良好背景又天生擅長於自我推銷的人。查德曾經被《賭博時報》（Gambling
    Times）譽為「全國最著名的四大賭徒」之一，他曾經是跑馬場的職業賭客，也是職業撲克牌及運動項目賭徒。他在──九七四年出版的《撲克牌必勝賭技》（Winning
    Poker Systems）一書，曾被許多撲克牌玩家視為經典名著。查德曾經引起拉斯維加斯媒體的廣泛報導，不過由於加州大學洛杉磯分校大力延攬，所以他決定待在學術界裡當一名打著領帶的數學家。


    根據一篇一九八九年七月十日發表在《巴倫週刊》，由約翰·李休（John Ligaro）所寫的文章中指出：「舉辦股票投資競爭的構想，是在一九八○年代早期由查德提出，他是加州大學洛杉磯分校的客座教授。查德有感於財務學術界人士的實際貢獻非常微不足道，於是決定用這個方法讓那些迂腐的老學究們，了解他們所珍愛的效率市場理論是完全錯誤的。他開始教授一門交易實務課程，利用一個實際存在的期貨交易帳戶讓他的學生操作。當這個交易帳戶的保證金餘額成長了一四○%，選修這門課的學生人數也由原來的十人增加為八十五人後，查德從此開啟了一道嶄新的大門。」「查德把他所舉辦的全美交易及投資大賽分為四大專案：股票、選擇權、股票暨選擇權，以及真正屬於重量級的期貨組。


    我參加了期貨和股票暨選擇權這兩個項目的競賽。


    就算沒参加比赛，對我来说交易本来就像是一场职业举重。我把自己的一天从早上九点债券市场开盘，到下午四點十五分S&P指數期貨收盤為止，分為十五回合。這種想法是模仿CME的做法。CME把每個交易日用半小時為單位來區分時段，並在每個時段結束時，公布該時段中交易所的統計數字。由於成交量常會在整點或半點的統計數字將要發布前提高，所以每一個人都在CME從事期貨交易的人，不論持有部位時間的長短，都曾價以每半小時為單位來思考當天市場的動態。


    我的交易手法，就像一個專打拳賽的拳手一樣，掌握時機是我最重要的致勝關鍵。我會在開盤時以市價敲進、發動攻勢，然後跳回原位。殺進、殺出，在這裡賺一些、在那裡又賺一些。我絕不獲取勝利，以累積出優於市場表現的操作績效，如果我能的話，絕不輕易把自己陷在一個容易被掃出場的情況中。


    我採用的，是一種安全而又一點也不特別的操作方式，藉著這個方式，我既不會有太多金額的獲利，也不會有太多金額的損失。在一年中大約兩百個交易日裡，我是累積著合理的小虧損和金額相當的獲利，在這兒賠個五千美元、在那兒賺個六千美元，一輪接著一輪，每天二十、三十、四十次的交易著。而在其他五十二個交易日中則靠明確而一致的決斷力，從債券賺個七萬五千美元、從股票又削個十二萬五千美元，在S&P期指又砍個十五萬美元。時間的累積使我成為一個大贏家，保持每年賺五百萬美元的實力。


    ### 你告訴喬，我要給他一 點顏色瞧瞧


    其實查德設計的這個競賽規則，是違背我的交易邏輯的。這個比賽是開放給所有人，而且規 中限定交易帳戶中的起始金額：在期貨、股票、股票暨選擇權等三個項目中是五千美元，而在選擇
    權項目中是一千美元。以這麼低的起始資金，在短短的四個月裡，再加上參賽者不限資格，任何一 個門外漢都可以把他的五千美元孤注一擲，期待自己能逮到一次好運。


    門外漢可以把我不會承擔的損失風險置之度外，放手一搏。當然，我也可以為參賽而操作一個 小金額的帳戶，試著用孤注一擲的方式得勝，但那意味著我得改變操作手法，這也是我所不願意
    的——這種操作方式曾經讓我連續九年屢戰屢敗、虧損累累。現在我已經發展出一套適合我個性的 操作方法，不論是五千美元或五十萬美元的資金，我都決定要用自己的方法。


    參加比賽的報名費，從股票組的一五〇美元到其他三組的一九五美元不等，第一次比賽只有七 十四名參賽者，所以查德沒有因為舉辦這個比賽所收取的報名費而撈到什麼好處。當我問他，如何
    防止參賽者作弊時，查德告訴我，除了每個月要將操作的損益評估表交回主辦單位外，每個參賽者 在進行交易時，都必須打電話到主辦單位，並在電話錄音中留下交易紀錄。


    啊！想必這就是他真正想要的東西了。查德真正想做的，或許就是找出國內最棒的操盤手，然 後跟著他建立部位。但我哪會在乎這一點？或許除了在 CME 交易所的那些小伙子外，任何人都沒
    法從我這裡偷走任何東西。查德或許會想從我這裡偷學些什麼，但是當他發現我在 S&P 期指進出的速度有多快、交易的次數有多頻繁之後，他就免了我必須每天打電話報告進出場紀錄的要求，只需每個月交回我的損益評估表就可以了。


    在每一輪的比賽結果裡，我在期貨組排名第三，在股票暨選擇權組也排名第三。七十五名參賽者中得到第三名，也不算壞了，可是對我而言顯然不夠好，我要當世界重量級冠軍。於是我馬上參加了第二輪的比賽，時間是從一九八三年的八月一日到十二月一日，共有一百三十三名參賽者，我以六九．二％的報酬率在期貨組中排名第六（第一名是一個門外漢，他的報酬率是三三八．四％）。但是我贏得了年度獲利金額最高獎，而根據最後結算，我所賺的錢比其他所有參賽者的總合都要多。查德不放過這個宣傳的機會，在《巴倫週刊》、《期貨月刊》（Futures
    Magazine）、《投資人日報》（Investors Daily）、《股票與商品雜誌》（Stock and Commodities）以及《華爾街通訊》（Wall
    Street Letter）等媒體裡刊登一篇廣告宣布比賽的贏家，並且遊說參賽者參加下一輪的比賽。我喜歡看到自己的名字出現在媒體上，但仍然不滿足，我一定要成為一個期貨實價的「冠軍操盤手」。


    榮登一九八三年最佳操盤手寶座的，是四十二歲的法蘭基．喬（Frankie Joe）。他是在紐約證券交易場所內工作的接單員，在期貨組的競賽中以一八一．三％的報酬率得到第二名，在股票暨選擇權組則以七○．六％的報酬率得到冠軍。我不知道他投資了多少或賺了多少，我只知道他將因此而可以大吹大擂。


    我一定要幹掉他！我打電話給查德，告訴他我要報名參加下一次比賽：「你告訴喬，我要給他一點顏色瞧瞧。」


    ### 如果你不能相信自己會贏，就不該進這個圈子


    自信心，是從事交易時最重要的元素。如果你不能相信自己會贏，就不該進這個圈子。


    但要注意的是，自信心很快就會轉變成強烈的自尊心。自尊心就像一個疲憊的戰士，需要被按摩、撫慰，並且受到溫和的照顧。而查德這個集騙子、賽馬賭徒、撲克賭徒以及數學家幾種身於一身的傢伙，對此顯然非常清楚。取得勝利本身就是對自信心受損的最佳止痛劑，但是只有功成名就，才能最有效地撫慰自尊心。


    這頂全美冠軍操盤手大賽已然成為華爾街的熱門話題。在一九八四年二月一日開始的比賽裡，參賽者多達一百八十五人。《紐約時報》在二月十八日當天的商業版頭版，也大幅報導這項比賽。這篇文章的標題是：「為了趣味和獲利而投資」，並把喬和我的相片刊登出來，標明我們分別是一九八三年的冠軍操盤手以及最賺錢的操盤手，並附上我們的聯網電話。喬臉上帶著詭異的微笑，而我的相片看起來是個苦瓜臉的猶太人。至於查德，才是這篇報導真正的明星人物，報導中描述他是一個「來自加州的數學家」和「前大學教授」，並說他創辦了這項交易競賽，藉著報名費賺錢。


    我才不在乎呢！文章中也有整段提到我——在一九八三年全美操盤手冠軍賽交易中賺到最多錢——一四○萬美元——的人是馬丁．舒華茲。他的期貨交易帳戶成長了一七五．三％。舒華茲先生是三十八歲的前證券分析師，目前在美國證券交易所擁有一個交易會員席位。他向本報表示：『成為一個贏家的先決條件是，先學會如何輸錢！』


    有一句義大利俗諺說：「報復的最好方法，是為仇人端上一盤冷掉了的炒菜。」我迫不及待地想把《紐約時報》上的這篇報導影印數百份，然後把它們很醒目地貼在金字塔公司的各處，我要確定他們看到這篇報導，希望他們在知道我有機會為他們賺到那麼多錢，可是他們卻在背後捅我一刀、把我趕走時，會痛哭流涕。可是我其實並不需要這麼做，因為二月十九日我接到了內線史基尼的電話。史基尼和金字塔公司的人通過電話並不知道了一切。『馬丁，我跟你講一個笑話。那個人和先知兩個人正在商量，怎樣可以讓你看作一些資金呢！』

    「告訴他們，如果哪天他們把紅海分開的話，打個電話給我。」好一個查德，謝謝他辦了這個比賽，這真是長久以來對我的自尊心目最棒的撫慰。


    這項比賽後來愈來愈受歡迎，以至於查德開始每個月在著名的財務金融期刊上刊登廣告，報導比賽現況。這個做法吸引了更多人的興趣並創下知名度，特別是我和喬開始為冠軍頭銜而激戰的事為人所知後。


    我們的成績非常接近，艱苦纏鬥了幾平三個月。直到五月中旬，喬打電話給我——在這之前我們從來都沒有交談過——「馬丁，」他說：「我受夠了，我投降，我一定得去度個假才行。」這回我贏了！我跟奧黛莉說：「我們去慶祝吧！」喬現在要去度假，我们也可以跟著休息一陣子、度個假了。


    但我萬萬沒想到的是，原來喬用卑劣的手法偷襲我！他在號稱投降、跑去度假的這段期間內，其實一直繼續交易，在只剩下一天比賽就截止的狀況下，他領先了我〇．一個百分點。〇．一？這看來令人不敢相信，但已經夠讓他拿來大肆宣傳了。我再度被人從背後捅了一刀！我打電話給查德：「我正式宣戰！」查德當然高興得不得了，他馬上打電話給《華爾街日報》，說我和喬之間的纏鬥已經演變成私人恩怨了。


    最後一個比賽日，我全力反擊。直到四點十五分收盤為止，我不停地放空S&P指數期貨。當收盤鐘聲響起時，我以三．四％的差距擊敗了喬。經過四個月的交易，我將原先帳戶裡四十八萬二千美元的起始資金，增值為一百二十萬美元，總報酬率二五四．九％。喬則將他原來五千萬美元的資金增值了二五一．五％。一九八四年六月七日，《華爾街日報》在一篇報導中以下面這句話作結語：「查德先生計畫在八月一日開始下一輪競賽。喬，這位四十二歲的職業操盤手說他可能不會再參賽了，他表示『我的內心已經像一個八十六歲的人一樣蒼老了』。但是舒華茲先生將再度試圖衛冕，他說：『我將會擊敗所有人！』」


    我的確辦到了！我在下輪比賽中以期貨項目四四三．七％的報酬率擊敗了二百六十二名參賽者。喬並沒有參加那次的比賽，並在不久後因為心臟病而過世。從事交易是一件充滿壓力工作，尤其當你知道每個人都盯著你的一舉一動時更是如此。看來，喬所說「內心已經像八十六歲那般蒼老」的話所言不虛。不管在任何時候，每個操盤手都有相同的感受。


    ### 把他鎖在一個房間裡，再給他幾支電話……


    隨著日子一天天過去，我發現，查德不只是利用比賽、跟在別人後面建立部位，在舉辦這個全美交易競賽後，他很快便在全美國人面前成為研究成功操盤手的專家。擁有這個名聲，至少可以為他帶來三大好處：第一，他可以藉著替投資人媒介資金操盤手而收取高額費用。第二，他成立了自己的基金，並且招攬參賽的年輕操盤手幫他操作募得的資金。第三，他發行了一份名為《頂尖操盤手彙報》（Summary
    of Top Winners）的市場行情分析刊物。


    但我一點也不在意他幹了什麼。因為藉著這項比賽所建立的名聲，我在一九八九年也成立了自已的基金。當我开始操作投資大眾的資金後，就放棄繼續角逐冠軍了——操作OPM（Other
    People’s Money，別人的資金）對我來說，已足以提供我所需要的激勵。一直到一九九二年，我決定重出江湖。


    我打電話給查德，告訴他我將像所有偉大的拳手一樣重新回到擂臺上，準備贏回我的冠軍頭銜。李休在《巴倫週刊》上宣布我重回戰場的消息，在報導這件事的專文結尾寫道：「在花了一個星期的時間和馬丁閒談並觀察他的交易狀況後，令人無可置疑地，這個曾經被大家推崇為S
    & P期指交易場內的巴比·費雪（Bobby Fischer，世界西洋棋冠軍）的人，依然是一代宗師。只要把這位偉大操盤手鎖在一個房間裡，給他幾支電話、幾個報價螢幕和少量的現金，一天之內（通常不需要那麼久），他仍將擊敗對手、登上顶峰。」


    他是對的。一九九二年我重出江湖，並在五十萬美元資金以上的期貨交易專案中，再度奪回我的重量級王冠――全美投資總冠軍。查德仍然不改他完美的宣傳者作風，總是不停地在各個項目上再衍生出更多的小項目，因為更多的贏家意味著更激烈的競爭、更多的參賽者、和更多的收入。奪得這次的冠軍頭銜後，我決定正式退休，急流勇退。


    沒多久，查德也突然毫無預警地把這項比賽給停辦了。根據一九九六年十二月二十六日，一篇刊登在《華爾街日報》上標題為「馬路消息」的文章中指出，「證管會對於該項比賽主辦單位的一連串調查，和競賽的停辦時間相當接近。一般相信，證管會的調查是造成競賽停辦的主因。」「很顯然地，查德之所以引起證管會的關切，是因為他「未能對投資人的財務狀況深入了解，就引薦給資金經理人」。此外，他對外宣稱交易競賽的結果都是「可資查證」這點，也替他惹了麻煩。


    在交易競賽進行期間，查德自己也是交易圈裡的主要玩家。但由於他同時扮演了多重角色 ――比賽的主辦者、投資顧問、資金經理人、行情報導刊物的發行人，以及投資者 ――
    留下太多值得讓人仔細調查或批評的地方了。查德，這個被《華爾街日報》形容為「一個在史丹佛大學和加州大學洛杉磯分校擔任客座學者的應用數學家」，承認他在查證競賽結果時可能產生了一些疏失，「但查德先生堅稱他個人的多角化事業並不影響比賽的客觀性。」


    我才不在乎呢！許多財務金融專業刊物裡有介紹我的文章，我的名字廣為社會大衆所知；而對我的自尊心目最具安慰作用的，是我在競賽中的表現讓自己在家人、朋友及投資界裡都奠定了深厚的名望。查德將我從黑暗、孤獨的辦公室裡猛然推向舞臺中心，成為眾人注目的焦點。


    一九八九年七月，我剛結束在亞斯本（Aspen）的假期，正在紐約拉瓜地亞（La Guardia）機場大廳等著拿行李袋。我拿起一本《巴倫週刊》不經意地翻閱時，看到一篇由李休所寫的專文，介紹查德的交易競賽，頁面正中央有一張我坐在辦公室裡的大幅相片。我把那張相片拿給我的兩個孩子看，他們分別是四歲和六歲，正好大到會開始奇怪我為什麼不像別人的爸爸一樣穿著西裝、打著領帶，做著「正經的工作」。而我問他們：「那是誰？」他們說：「爹地！爹地！」


    當他們漸漸長大，別的孩子開始問起他們的老爸是做什麼維生的時候，他们可以回答：「我爹地是冠軍操盤手！」這才是最我有意的事。


    # 第⑱堂課 贏之前，先找到自己的「認輸點」


    最棒的交易工具之一就是停損。停損表示你能將情緒性反應和自尊心分開，並且承認自己的錯誤。大部分的人在做這件事時都相當困難，而通常他們不會把輸錢的部位賣掉，反而雙手合十、期盼市場會反轉回來，照他們認為「應該出現」的走勢發展。這種態度通常會造成自我毀滅，因為就像資深技術分析員喬·格蘭威爾（Joe
    Granville）說過的：「市場根本不知道你作多是作空，它對此毫不在意。」你是那個唯一會對自己的部位滲入情緒性反應的人。市場的走勢，只不過單純反映供給與需求的變動而已。如果你為市場的走向而歡呼，就必然有某個人為市場走勢不利於你的時候歡聲雷動。


    接受虧損是一件非常困難的事，因為停損不管承認自己犯了錯誤。但是在金融市場裡，犯錯是不可避免、必然會發生的事。在進行每一筆交易的同時，你一定要預先設立「認輸點」，只要這個價位一到，就停損出場，而你必須要修練自己在這個點達到時，切實執行停損。


    有一天，我和朋友出門打高爾夫球，打球時他不停為自己在臺灣網路 (TWEN) 這支股票賠了大錢而唉聲歎氣，一直表示他不知道哪裡做錯了。他在那支股票的市價還在三十幾美元時就聽到風聲，但是他忙著找這檔股票的各種報告研究時，股價已經漲到四十幾美元。他在股價拉回到四十三美元時進場承接，在股價續跌至三十五美元的時候，他犯下了操作大忌，加倍加碼買進。然後就坐在那兒无助地看著他心愛的股票，跌到十幾美元一股的價位。「更讓我氣昏的是，」他說：「這檔股票在跌勢中曾經強勁反彈過幾次，而我卻沒有砍掉部位，只是坐在那兒看著我的錢縮水。」


    「你原來的計畫是什麼？」我問他。


    「我的計畫？我要抱著這支股票直到它回到五十元為止啊。不然要怎麼樣？」


    這就是門外漢的問題所在了。他們只有一半的計畫——簡單的那一半。他們知道自己預計要賺多少錢，但是對於準備輸多少可是一點概念都沒有。他們就像上錯了馬路的鹿，眼睜睜看著迅速接近的車燈發愣、不知所措，只是呆呆地站在原處等著被車轢過去。他們對處於虧損部位的唯一計畫就是：「老天爺，求求你！讓我能夠逃過這一劫，我再也不會犯同樣的錯了……」但這完全是狗屎！因為如果好死不死他們的部位又回到原價，他們馬上就會把老天爺忘到九霄雲外，開始覺得自己真是天縱英明、交易奇才，然後再度犯下同樣的錯誤。這表示他們一定又會再度套牢，而且被套得更慘。


    大部分人沒有辦法了解的一點，就是當你正在輸錢的時候，也開始喪失客觀性。就好像在拉斯維加斯的骰子賭桌上，當你正在輸錢時，一個穿著亮片裝的胖女人搖著骰子準備出掌，而你下定決心不讓她贏你的錢一樣。你忘了她才不管你是輸是贏，只是在玩她自己的骰子賭戲罷了。不管任何時候，當你開始感到嫉妒、情緒化、貪婪或憤怒時，你的判斷力就會大打折扣。


    市場就像那個搖著骰子的胖女人，它才不在乎你在幹什麼呢！這就是為什麼當你到達停損點時就該放下自尊、軀干賠錢部位的主要原因。如果你和大多數的人一樣，在這方面有無法克服的困難，就該學學希臘神話裡的奧德修斯（Odysseus），把自己綁在船的桅杆上，利用自動執行的停損指令來幫你把情緒阻隔在這場遊戲之外。（譯註：奧德修斯把自己綁在桅杆上，以防被海妖迷失心智而跳海。）


    停損可採兩種方式執行：在你的經紀商那裡放一個設定價位的停損指令單，或在你自己心中設定一個價位，不管發生什麼事，只要價位一到就執行停損。不論你使用哪種方法，停損是一

