    自己可以方便穿脫，以減輕胸口開刀部位的疼痛。我的心跳很快，對於受夠了病毒性心包炎的我，這可不是我想要再次面對的狀況。我渾身大汗地躺在床上，滿腦子想的都是我的部位。


    「舒華茲，你跑步的樣子像是老頭子做愛。你知道嗎？舒華茲。跑快點，跑快點，不管你做什麼，都不准給我停下來！這會讓我對你很失望。舒華茲，跑快點，跑快點！你想要放棄了嗎？是不是？如果你敢，我就扒了你的皮。我會盯著你，舒華茲。你聽清楚我說的話了嗎？


