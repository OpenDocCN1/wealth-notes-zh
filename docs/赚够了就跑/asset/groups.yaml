    #### 方法論


    在擔任了九年的證券分析師後，我決定將我的決策依據從基本分析（一種運用經濟資料來預測股價的方法），完全轉換為技術分析（一種不研究經濟資料，而只重視價位與成交量的股價預測方法）。你的交易方法必須完全配合自己的個性，你必須了解自身個性上的長處與短處。我花了九年的時間才真正發掘出自己個性上的特質。


    我的長處是能夠一心一意地辛勤工作、能夠持續遵守自己的原則、能夠長時間集中精力，以及痛恨失敗的天性。我的弱點則是具不安全感的個性、害怕虧損的心理，以及需要別人持續的支持、希望經常獲勝的強烈需求。一個操盤手，就像一條鍊子，是由一個個脆弱的環節串連起來的，而最常左右操作風格的，就是你個性上的弱點。


    我是一個帽客，這表示我進場和出場的速度總是、總是、總是非常快！我經常在五分鐘或更短的時間內進出場，從來不持有部位超過幾個鐘頭。基本上，我採用的是一種短線的作業系統，因為我只有相當有限的資源，所以我必須利用一連串小額的獲利來累積資本。但是當愈來愈成功之後，我發現短線的操作方式能夠給我最多心理上的支持以及經常性的滿足感。我就是喜愛聽到收銀機的鈴聲（獲利了結），彷彿聽到市場告訴我『你是一個贏家』，一次、一次、又一次。


    大部分談到有關交易方面的書都會說，如果你能夠快速停損，然後長抱獲利部位的話，只需要在十次交易中做對了三或四次決策就可以了。但這對我來說，一點都不管用。我砍掉虧損部位的動作非常快，但是我獲利了結的動作也差不多一樣快。


    我就像是一個還擊型的拳手一樣，看出對手的破綻後立刻跳上前，出拳、得分，然後馬上跳回出拳前的位置。就這樣跳前、跳後，跳前、跳後，這裡得一分，那裡得一分。我並不打算要擊倒對手，但是在不停得分的同時，我很確定愈來愈不可能被對手給擊倒。這就是我的操作風格，而我將所學到的技術分析和操作策略加以量身改造，以符合自己的風格。


    當你踏上拳擊擂臺上時，一定要很清楚自己打算怎麼打這場拳。就拿我的老朋友－內爾史基尼－來說吧，當我在辦公桌上計算著各種資料，他就在外頭靠著和別人喝喝馬丁尼、釣釣魚或打打屁來獲取市場中的小道消息。努力工作並不是史基尼的一項長處，而他也不是一個還擊型的拳手，他的目標就是想要擊倒對手，他總是這樣，每次都是這樣。他會進行十筆交易，也許其中八筆都輸錢，但是他一點也不在乎，因為他在另外兩筆中能夠賺足了錢，結果到頭來還是獲利。或者拿波奇來說好了，他的資金相當龐大，所以對任何機會都能夠把握。他的長處就是資金規模、組織團隊力量，以及對所有賺錢機會無止盡的胃口。我曾經試圖和他一較長短，結果差點送掉自己的小命。


    ### 操作工具


    我是帽客，也是一個掌握市場時點的操盤手，所以我就根據這些特性，設計了屬於自己的工具。它們是：


    - 1 道瓊工業指數（Dow Jones Industrial Averages DJIA），這是最廣泛使用，作為美國股市價格波動指標的指數。其變動狀況，讓我對股市的方向和波動性有一個快速的觀察依據。

    - 2 紐約證券交易所股價淨變動指標（New York Stock Exchange Net Ticks NTNX），告訴我的是在紐約證交所掛牌股票最後成交價上漲或下跌檔數的差異值。我的朋友庫克發展出幾種用這個股價淨變動指標為依據的操作策略，這些策略應用在現代化的程式交易中相當有幫助。例如，一個非常極端的負面指標，像負一千出現時，常常就會是空頭走勢中反手作多的最好時機。因為過於極端的負值代表市場中出現了過於迅速的賣盤（可能是由突發的新聞或是程式交易所引發），在這種狀況下，市場很可能出現強勁的反彈走勢。情況反過來時也適用，當這個指標值為正一千時，通常是由電腦程式執行大筆買單所導致。等這個程式買盤結束時，市場很可能出現一個短線上的回檔。另外一個交易上的小技巧是當DJIA開高，而TICK值為負二百時，這通常代表股市整體的賣壓較重，DJIA只是受到少數幾檔股票的支撐而暫時走強，所以你通常可以在這個時點作空。

    - 3 短線操作指標（Short-Term Trading Ideas, TRI）


    主要是短線操作工具。它的計算方法是取以下公式的比值而來：


    TRI = （上漲檔數／下跌檔數） ÷ （上漲成交量／下跌成交量）


    如果上漲股票的成交量比下跌股票的成交量大的話，TRI指數值將會小於一，如果下跌股票的成交量比較大的話，則TRI指數值將會大於一。當TRI指數值低於0.8時，就顯示市場整體力量比較大；反之，如果TRI指數值大於1.2時，顯示市場空方的力量比較大。這個指標可以幫你了解市場是不是處於強勁的多頭或空頭當中。


    - 4 道瓊股價淨變動指數（Dow Jones Net Change, DJIA），這是道瓊指數三十檔成分股上漲與下跌檔數的差額。當它的值是正二六到正三〇或是負二六到負三〇時，通常暗示市場中剛有大筆的程式交易買盤或賣盤出現過。因為除非程式化交易指令同時買賣所有的成分股，否則道瓊這三十檔成分股要同時上漲或下跌並不是一件尋常的事。

    - 5 標準普爾五百（S&P 500）股價指數（SPX），相當重要的指標，因為它是 S & P 指數期貨的标的物。這個指數涵蓋了四百檔產業股、四十檔公共設備股、二十檔運輸類股，以及四十檔金融股，總計達五百檔股票的投資組合。SPX
    是一種加權股價指數，它提供了更廣泛的股價波動指標作用。

    - 6 紐約綜合股價指數（New York Composite Index，NYA），這是以紐約證交所所有掛牌股票為基礎計算出來的股價指數，也是以每檔股票市價加權計算而得。

    - 7 QCHA 指數（發音為 gocha），是以非加權方式計算所有交易所掛牌股票價格變動百分比所得出的指標，涵蓋整個市場的這個指標幫我辨別背離（divergence）走勢。舉例來說，如果道瓊指數下跌二十點，但是
    QCHA 指數是正0.12% 時，這顯示市場整體來說走勢很堅穩，而這就是一個稍縱即逝的進場機會。你通常可以作多並在道瓊指數開始向上反彈時，在很短的時間內獲利。


    請各位隨意使用我的這些工具，但是可別以為只要用了它們，你就能開始賺錢。想要讓自己成為熟練的操盤手，必須找到順手的工具，並且一再使用它們，直到你清楚知道它們的作用何在、如何發揮它們的功用，以及如何完全發揮它們的效率為止。


    ### 市場分析


    想要聆聽市場在說什麼，你必須擁有非常高的專注力。就像醫生用醫療儀器診斷病人的健康狀況一樣，我都是自己動手繪製技術圖及計算技術指標，並在盤中每十分鐘就重新檢查一次，用這種方式來監測市場脈動。


    每半個鐘頭，我就在指標周圍畫上框線來記錄市場的動態。然後我會在每個框框之間加上金色或綠色的箭頭來反映過去三十分鐘內，紐約證交所綜合指數到底是上漲或下跌，並且記錄它的漲跌幅度（見左頁圖）。


    這個做法強迫我把注意力放在市場試圖往哪個方向移動，以及如何移動。當市場出現大幅波動時，這個工作尤為重要。我很可能持有一個錯誤的部位，如果沒有這項資訊，就會喪失機動性，而無法在第一時間採取必要的措施停止虧損。


    我是一個喜歡參考各方意見的人，喜歡從各種消息來源所得到的訊息來質問自己。我會重複閱讀在一週中所收到的傳真，然後試著以自己獨特的看法來詮釋別人提出的意見，將別人的意見摻雜到我對每一檔特定股票、某個產業，或市場整體未來走向的研判上。我使用了幾種資訊服務。事實上，市場上充滿了各式各樣、多不勝數的資訊服務業者，每個人都有從其中找出最適合本身持有部位的期限、操作哲學、操作目標，或個人價值觀的資訊來源。以下是我經常參考的資訊：


    - 《安夏管理報告》(Amsbar Management Report)……由泰瑞·隆德利 (Terry Lamdy) 出版，電子郵件信箱為amsha@worldnet.att.net。網址為http：//www.amsha.com。隆德利從事的是長期的總體研究（以月或年計），他的研究基礎是他自創的「神奇T理論」，這個指標是我用來研究許多不同市場的重要基礎。

    - 《勞瑞紐約證券所市場趨勢分析》(Lowry''s NYSE Market Trend Analysis)：勞瑞每天會更新當天市場中各檔股票的波動狀況，並且公布長線和短線的買進、賣出訊號。他的報告中會刊出買盤力道、賣盤的壓力以及短線買盤力道等多項資料。每週，這份刊物會寫出他們就一週走勢所推論的中線市場展望，以及其短線可能出現的變數，其分析依據便是前述的三種指標。

    - 《史丹·溫斯坦的全球趨勢警報月刊》(Sam Weinstein''s Global Trend Alert Detecting Opportunities
    for the International Investor)：這本刊會中具有市場的整體分析，以及對標準普爾五百指數和二線股票的分析報告。其中也表列最值得買進的標準普爾五百成分股、走勢最弱的
    S & P 成分股、各類股走勢分析、最強類股分析、全球股市分析、海外基金以及美國存託憑證（ADR）分析等。他所採用的階段分析（Stages）方式，試圖決定股票走勢正處於何種階段：築底、漲勢、作頭或跌勢，並將這四個主要階段各分為三個副階段，做更詳細的分析。

    - 《圖學家》雜誌（The Chartist）：編輯是丹·蘇利文（Dan Sullivan），每三週發行一次。其中利用一個實際的交易帳戶，以及操盤手的投資組合，來發表對於目前市場的進出場建議。

    - 《克勞佛觀點》（Crowford Perspectives）：每週一、三、五更新一次的電話語音服務。如果道瓊指數出現超過一百點的波動時，該公司也會在次日做特別更新。該公司還發行一份市場行情報導，以黃金、標準普爾五百指數以及債券期貨市場為主。

    - 《迪克·大衛斯文摘》（Dick Davis Digest—Investment Ideas from the Best Minds on Wall Street）：雙周刊，這份刊物中發表許多投資界大人物對市場趨勢、個股展望以及共同基金的看法和投資建議。

    - 每日傳真資訊：包括《史考夫論壇》（Schaffer on Sentiment）、《投資研究報告》（Investment Research Institute）、網址http://www.options-tv.com…《高文起床號》（Cowan
