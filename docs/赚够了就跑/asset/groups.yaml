    # 正式發表前，報告被大修特修


    不論如何，如果先知或大祭司等高層人士在報告外洩前讀過的話，它根本就不可能會被刊印出來。實際上，我們的研究報告等於是對醫療管理產業做出了「賣出」的建議，而在華爾街，沒有任何㑹寫一篇建議投資人「賣出」持股的報告。


    通常，「長期持有」已經是最糟的評語了。「長期持有」，代表請投資人趕快跑去找營業員（不是用走的哦！）賣掉手中的持股。如果先知很盡責地做了他該做的工作，就會從頭到尾監督人面獅身和我在做些什麼，而且也會出席那次的會議，聽到我們的口頭報告。如果他當時出席的話，會馬上就把這篇報告壓下來。但是先知並沒有堅守崗位，只是躲在辦公室裡看自己的盤，而現在想


    要收拾這篇報告造成的風波，可就太遲了。


    現在，在大祭司和先知嚴密的監督下，人面獅身和我必須重寫這份報告。我們把所有來自美國


    我的記憶力很好，而且我只是不斷告訴他們我所知道的每件事。六個鐘頭後，事實應該已經很明顯，我並沒有將任何報告內容洩漏出去，而且即使報告外洩真的是金字塔公司想要操縱股價的整體策略之一，也和我個人一點關係都沒有。


    我充滿自信地離開交易所，以為沒事了，但事實上，還有一個大問題需要解決，那就是：金字塔公司還沒有正式發表這份研究報告。'
