    「接到交易所內找黛比。」「黛比，近來可好？？…是啊，我們搬進來了，但是這個地方可讓我花了不少錢呢！奧黛莉列了一份採購清單，好像快有一哩長耶！看來，我得回來多賺點錢了。」


    「馬丁，」黛比說：「我們今天不能交易。」


    「什麼？」


    「你最好和傑克談一談。公司發生了一點問題。這一定和畢維爾·布列斯勒有關。」


    「畢維爾·布列斯勒？你在說什麼？」


    「畢維爾·布列斯勒（Peer, Brer & Staller）公司，那是在紐澤西州專做政府證券的公司，它剛剛宣布倒閉。你沒看今天《華爾街日報》的頭版嗎？傑克和他們有些生意上的往來。」


    「搞什麼鬼？黛比，那我的錢呢？我要我的錢！」


    「馬丁，冷靜一下。打個電話給傑克。你得和他談談，他說每一個客戶的錢應該都沒問題。」


    「好吧，見鬼了。我對芝加哥的那些傢伙一點也不信任。我要拿回我的錢！」我氣得摔電話，然後拿起另一線電話，撥到拉薩爾去，總機小姐聽起來似乎相當忙碌而且緊張，好像隨時等著被打電話去的人大吼一番似的。這點她倒是對了。「我是馬丁·舒華茲。傑克死到哪裡去了？」


    「很抱歉，馬庫錫先生不在。」


    「那把強尼找我來！」


    「很抱歉，他也不在這裡。如果你不介意的話可以留話，我會請他們盡快回電。」


    「留話？我當然要留話。告訴那兩個渾球，我不知道也不管他們在搞什麼鬼，我要我的錢，叫'
  - '[PAGE 184]


    他們馬上把錢匯回來給我。」


    我把手機放回原位，氣得雙手顫抖。這到底是怎麼一回事？


    其實，我在拉薩爾公司的現金帳戶裡一毛錢都沒有。我在搬家前已經亂乎所有的部位，並且把錢轉到貨幣市場基金，以便在這個週末賺一點利息。現在留在拉薩爾公司裡的，只不過是我存在保證金帳戶那些面值一百二十萬美元的國庫券。感謝CFTC
    的規定，除非我沒有履行追繳保證金的要求，否則結算公司一點也沒有辦法碰我那些國庫券。如果拉薩爾遇到了財務危機，那他們只可能動用到客戶現金帳戶中的資金。所以，看來我應該是安全過關了，但是在芝加哥，除非你已經把錢穩穩地裝回自己的口袋裡，否則永遠無法確定自己是否全身而退。


    我到達櫃檯拿我的《華爾街日報》，因為黨比告訴我，有關華維爾布列斯勒公司的事情刊登在上面。恰巧任戶委員會的主席也正在拿他的報紙，「早安，舒華茲先生。」他説：「一切都好嗎？」


    「是，當然，一切都好。」媽的，他是不是聽到了什麼風聲。「怎麼會不好呢？」


    「搬家總是一件很麻煩的事，更何況你太太又快要生產……」


    「一切都很好，好得不能再好了。謝謝您的關心！」我抓起我的《華爾街日報》迅速衝回電梯。這個老裁縫師是我最想見到的人，他一直在等著把我們趕出這幢大廈。


    根據《華爾街日報》上的說法，畢維爾布列斯勒公司是一家以政府和市政公債市場為主的合格經紀商，他們的總部設在紐澤西，和姊妹公司——資產管理公司（Asset Management）與全國各'
  - '[PAGE 185]


    地的許多小型存放款機構從事附買回交易。資產管理公司在四月八日因為無法履約和客戶的附買回協定而宣布破產，畢維爾、布列斯勒公司和它所有的分支機構也都在週三宣布進入受破產管理人監管的狀態。證管會控告該公司及其負責人涉嫌詐欺，並指稱他們「取得客戶帳戶中證券的控制權，加以利用以牟取私利」。


    # 這裡是芝加哥，什麼事都有可能發生


    我不知道拉薩爾和這些小丑之間的往來有多密切，但是馬庫錫兄弟本身就有債券生意，而且必


    然會透過拉薩爾公司的名義從事附買回交易。但是在附買回交易之中，拉薩爾會把現金交付給對方，然後取回國庫券作為保障。如果我都受到波及的話，最可能的就是他們在從事反方向交易時，把我帳上的國庫券交付給對方換取現金，但卻把現金虧掉了。


    不過照理說他們應該無法這麼做，因為我的國庫券是放在法令管制帳戶中。但話又說回來，這裡是芝加哥，什麼事都有可能發生。


    我心裡思考著各種可能，我不斷試著和傑克聯絡，最後終於和他連上了線。「傑克，這到底是怎麼一回事？我要你馬上把我的國庫券匯回來給我。」


    > [馬丁，你冷靜一下。一切都沒問題，坐下來喝一杯我送你的好酒放鬆一下。]


    [去你的爛葡萄洒，傑克！我要我的錢！我那些國庫券都是放在法令管制下的帳戶裡的，你這]'
  - '[PAGE 186]


    渾球怎麼可以動用它們？這是違法的！你馬上把國庫券匯回來給我，否則我把你那該死的頭給砍下來！」順道一提，傑克的身材和強尼一樣，都是大塊頭。


    「馬丁，我們電腦當機了，強尼會盡快搞定，相信我，一切都會沒問題的。」


    「放屁！我告訴你……」


    嘟嘟嘟……傑克把電話掛了。媽的！我感覺得出來，他們一定把我的國庫券給吞了。我不能損失這一百二十萬美元，至少不能在這個節骨眼。我們才剛搬進這豪華公寓，而且奧黛莉馬上要生了，我要怎麼去弄到那筆每月管理費？百般無奈，我又打電話給CME的法國部門。


    「是你們核准這些傢伙的註冊申請的，」我暴跳如雷：「你們必須為他們的行為負責，你們得馬上擺平這件事，這是你們的問題。」「他們草率地敷衍我，說他們會『重視這種事情』。


    我打電話給我的律師：「我要告這些渾蛋！我要拿回我的錢！我要他們好看！」律師建議我，沒掌握直接證據前先稍安勿躁。


    我也打電話給從前在貝爾·史騰公司的經紀人麥克·馬格利斯（Mike Margolis），因為我知道他們公司在芝加哥的生意不少，我也知道貝爾·史騰的大老闆之一吉米·凱恩（Jimmy
    Cane）和米爾蘭是老哥兒們。「馬格利斯，你一定要幫我這個忙。芝加哥的那些渾球想坑我一百二十萬美元。請你找凱恩打幾個電話，幫我問問這一切到底是怎麼回事？」馬格利斯答應他會幫這個忙。


    我在一一片混亂下試圖找出事情的來龍去脈，但直到那天很晚的時候，還是一點也不能肯定是否能再看到我那價值一百二十萬美元的國庫券。我一夜無法成眠，第二天一大早開始打更多的電話。'
  - '[PAGE 187]


    在這一 row，有污點是家常便飯……

    「黛比，事情怎麼様了？有新消息嗎？」

    「傑克和強尼什麼都沒說，但有很多傳聞。看起來拉薩爾公司好像是宣告倒閉了，他們所有的帳戶都已經轉到其他結算公司去了，今天的《華爾街日報》上報導得很詳細。」

    「可是我的錢呢？」

    「唉呀！馬丁，我也不知道。」

    我到樓下大廳去拿《華爾街日報》，那老先生又正好站在旁邊。他正和另一個住戶委員聊天，兩個人邊看著金融投資版邊搖頭。該死！他們一定正讀到有關畢維爾、布列斯勘公司這件事。他們知道我的經濟狀況出了問題，而且準備要把我們一家全都趕出去。我躲在一座屏風後面等他們離開。

    等他們走了之後，我趕緊拿了報紙跑回樓上。那篇有關拉薩爾公司的報導，讀起來像是芝加哥商會的新聞稿。「拉薩爾公司，一家小型的政府證券交易商。該公司和畢維爾·布列斯勘公司從事附買回交易時產生了一百至二百萬美元的虧損。……在拉薩爾公司的請求下，該公司所有客戶的帳戶都已經轉到其他芝加哥地區的結算公司。……交易所表示在拉薩爾公司將客戶帳戶轉到其他結算公司的過程中，所有客戶資金都沒有任何問題。……商品期貨管理委員會的發言人表示，所有的跡象顯示，該公司客戶的資金都完整無缺，並未遭到不法挪用。」

    我打電話給 C M E 的法務部門。「《華爾街日報》上說所有拉薩爾公司客戶的帳戶都轉到其他'
  - '[PAGE 188]


    結算公司，而且客戶的資金都完好無損，未遭到不法挪用。那我的帳戶現在是在哪一家結算公司？我的「一百二十萬資金又在哪裡？」他們說不知道，交易所和 CFTC 都在「深入了解中」。


    「少跟我去這套！」我對著電話大聲叫：「我的錢是放在法令管制的帳戶裡，應該誰都沒辦法動用。你們要知道，你們不是唯一在華盛頓特區有影響力的人。如果你們在今天下班以前沒把我的錢還給我，我就打電話到
    CFTC，告訴他們你們這些傢伙在這裡幹的好事！」


    我打電話給律師、打電話給馬格里斯、打電話給黨比、打電話給佐爾納，甚至打電話給 AMEX 的桑坦吉羅，問他們是否還知道誰可以聯絡幫忙。終於，在五點之前，有人打電話給我，他是索爾·史東公司
    (Sthal & Co.) 的業務代表，是芝加哥的一家結算公司。這傢伙聽起來是個爽朗的人。他說他們接管了我的帳戶，而我那價值一百二十萬美元的國庫券也轉到他們公司，他們也願意請黨比繼續擔任我的場內接單員。


    「馬丁，我們很高興能和你做生意，你明天一大早就可以開始交易了。」


    我簡直不敢相信這是真的。兩天來，我第一次覺得全身緊繃的情緒鬆懈下來，我終於還是毫髮無傷。我拿起了專線和黨比聯絡。「是啊，黨比，他們把我的錢找回來了。看來我們又可以重新開工了。你現在為索爾·史東工作啦！」


    「什麼？」


    「我的帳戶被轉到索爾·史東公司去了，我告訴他們如果不是你來合作，我就不跟他們做生意了！」'
  - '[PAGE 189]


    意，所以你就和我的資金一起轉到他們那裡了。你同意嗎？「」


    「好啊，我想沒問題，馬丁。但這到底是怎麼一回事？「」


    「我也不知道，我想你也不會想知道。大概有某個人為了某種原因做了這一切。這一百二十萬對他們來說算得了什麼？他們早晚會從另一個傢伙身上削回來的。他們這麼做只是要讓這些遊戲能夠繼續下去罷了。「」


    我一直都不知道到底是誰幫了這個忙，但無論如何我總算把錢拿回來了。我不知這是否意味著其他拉薩爾的客戶無法拿回他們的資金，不過在我的想像中，一定是CME裡的大人物找到那些結算公司，然後把一切搞定。他們無法承受交易所名聲被毀損的後果，所以就和那些結算公司找出這樣的解決方法，讓我的錢回到帳戶裡。


    那天晚上我睡得像塊木頭似的。第二天早上我下樓去拿日報時，那位老先生站在走廊上。「早安，早安。「」我用非常愉快的語氣向他問候。


    「早安，舒華茲先生。「」當我經過時，他說：「所有的東西都搬好了嗎？「」


    「是啊，是啊，一切都很好。我又重新開工啦！「」


    至於傑克和強尼後來還是回到這個行業來。他們的結算公司是倒閉了，但他們還在C BOT從事情債券期貨的交易。在職業生涯中留下小小的污點，說起來也是在這行業打滾的人的家常便飯吧！'
  - '[PAGE 190]


    # 問問自己，是否具備這三項特質


    我有個朋友馬克·庫克（Mark Cook），是住在俄亥俄州的農夫，同時也是一個很好的操盤手，他甚至發展出一些有趣的交易策略，並透過傳真服務把這些策略賣出去。我很喜歡和其他優秀的操盤手聊天，因為我熱切想和他們交流資訊。我一點也不介意在得到資訊的同時，分享我所知道的給別人，而庫克也會把他的傳真稿給我，我們會根據這些策略進行交易。


    一九九七年一月二十三日，我收到了一封庫克的傳真稿，那篇稿的標題是：「什麼東西使人成為成功的操盤手？」一般人總是喜歡問我，要怎樣才能成為偉大的操盤手，所以我非常有興趣看一看庫克對這件事有什麼想法。


    根據庫克的說法，想要成為成功的操盤手，你必須：


    +   一、全心投入，並且全職從事交易

    你必須將操盤視為職業，因為如果不這麼做，其他把操盤當職業的人，就會在很短的時間內把錢從你身邊拿走。庫克整天都盯著市場行情，從開盤直到收盤為止，並且保有一本有時甚至長達四十個要點的交易日記，不間斷地記載著每天行情的變動狀況。如果他不能做，獲利就…'
  - '[PAGE 191]


    會顯著衰退。「在操盤手這行程裡沒有任何捷徑，如果你鬆懈懶散，市場馬上就會發現。」


    # 二、要將你自己的個性融入操盤習慣中


    如果你是一個對事情很容易做情緒性反應的人，那就承認自己是情緒化的人，並將你的交易習慣架構於這一點之上，讓你的情緒成為交易的助力，而非阻力。如果你生性貪婪或膽子很小，都將影響你從事交易時的決策力。如果你無法察覺出左右情緒的原因，決策將會發生錯誤。庫克是一個有恐懼傾向、膽小的人，每當他最感到恐慌而裹足不前時，都因為他對自己情緒的認知，總能克服心理障礙而大膽作多。「無論何時，每當我快搖擺不佳恐懼時，我受過的訓練會告訴我作多，而我深信訓練和紀律一定會勝出。如果做不到這點，任何人都注定失敗。」


    # 三、計畫是交易行為中最客觀的一部分


    事先模擬好最糟結果，並針對它進行充分的演練。在你執行每一筆交易前都保持最客觀的心態。一旦你已經執行交易、建立部位後，情緒將掌控一切，你必須在這之前就將計畫準備好。知道什麼樣的條件可以證明自己已經犯錯，並在那些條件成立後馬上承認錯誤。「乾平部位、撤退，保留實力準備另一天的戰鬥。這些做法看起來怯懦，卻能有效防止你在市場上陣亡。」


    我完全同意。'
  - '[PAGE 192]


    另一個我常想問的問題是，到底操盤是不是一種天生的行為，還是一種可以經由學習而得的能力？我的答案是——兩者皆是。從天性來看，我對數字向來感覺敏銳、個性喜好競爭，而且好賭。大學的教育讓我學會如何努力工作，哥倫比亞大學商研所給我完整的商學知識，而海軍陸戰隊則訓練我在槍林彈雨下如何因應狀況。


    一個偉大的操盤手就和一個偉大的運動員一樣，必須具有先天的條件，但也必須訓練自己如何以最有效的方式運用它們。'
  - '[PAGE 193]


