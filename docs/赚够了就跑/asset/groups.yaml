    國際醫療公司的參考資料全部刪除，放寬了我們的假設，也軟化了我們的語氣，把一大堆」將會一改成「可能」；「很可能」改成「有機會」；而把「因此」改成了「或許」。更重要是強調我們預期這個產業，在一九七二年結束前到整個一九七三年，還是會維持一五%到二〇%的獲利成長。我們很清楚地表明這篇報告絕對不是一個「賣出」的建議，而只是
    一個「警報」，讓我們的客戶了解醫療管理業，在長期觀點上可能會面對的潛在問題。


    這篇正式報告在一九七二年十二月一 日星期五正式刊出，但是那時已經沒有人相信它的內容了。稍早，在十一月二十七日星期一《華爾街日報》的丹·朵夫曼（Dan Dowman）「華爾街耳語」專欄中，談到了這個報告外洩事件，並提到原版的內容比正式出版的要不面了許多。「這對金宇塔公司來說真是一場『噩夢』，至少有一個內部消息來源這樣形容。」朵夫曼以這句話做為開頭。他表示原版報告在未授權的狀況下外洩，造成醫院管理業股票投資人的慘重損失，而由於市場上空軍不少，令人懷疑金宇塔公司是否意圖操控市場。朵夫曼最後引用了紐約證交所一名資深交易員的話作結尾說：「我想這些股票是完蛋了。根據金宇塔公司原版報告的描述，未來這個產業的獲利能力有相當嚴重的問題。沒有人知道報告是對是錯，不過如果是正確的，那這些股票真的就毀了。


    難怪亞培爾和其他這個產業裡的總裁，要一直壓迫紐約證交所展開調查了。在亞培爾看過原版的研究報告後，向媒體指稱原始的報告內容相當「不專業」，而且「顯示出對醫療產業領域所知甚少」。他並憤怒地說：「股價重挫已導致一項重大的購併計畫取消。」而紐約證交所也開始透過股票交易監視系統，觀察從十一月十三日以來幾週裡醫療管理類股票的'
