    # | 第10章 |


    # # 第一次買畫就上手


    進軍藝術品市場


    一九八五年八月五日，奧黛莉生下了我們的兒子，一個漂亮、六磅十一盎司重的小紳士。同年十一月，奧黛莉被醫師診斷罹患了乳癌。這個打擊，就如同我們在一九八一年失去第一個孩子一般沉重。


    但我們也因此更加確信一件事：人生在世，要及時行樂。在接下來的春、夏季裡，奧黛莉決定把家全部重新裝潢。她打掉牆壁、放進了一個新廚房、重新裝修浴室、把所有窗戶換新，並全部重新粉刷。這次整修，花掉大把的鈔票，但我並不介意，我仍然是冠軍操盤手，仍然能夠賺得比花得快。


    事實上，我正準備要花更多錢。


    一旦你往上爬到某個高度，就絕對不會缺乏一些昂貴的嗜好。泰德·透納（Ted Turner）為自己買了一艘十呎長的比賽用遊艇，喬治·史坦布瑞納（George Steinbrenner）為自己買下洋基隊，韋恩·牛頓（Wayne
    Newton）為自己買了正統的阿拉伯種馬，而查爾斯王子則替自己找了個情婦。但是我對遊艇、'
  - '[PAGE 195]


    職業棒球隊、種馬都沒興趣，加上有奧黛莉在身邊，市場就是我唯一的情婦。如果我要投入一大筆錢在某個嗜好上的話，我希望把錢花在藝術品上。


    # 用最好的價錢，買進最好畫家的最佳作品


    小時候，母親會帶著我到紐約市，然後我們會花一整天的時間參觀現代藝術博物館、大都會博物館、古根漢博物館以及惠特尼博物館。雖然我比較想去柯漢家的地下室玩牌，但是這些經驗卻在我心中種下喜好藝術的種子。父親會買一些仿名家畫家如莫內、馬奈等人的畫作回家，把它們掛在房子裡。所以我習慣在家裡看到牆上掛著名家畫作，就算不是真跡也無所謂。


    現在，我賺了那麼多錢，我想是買點真跡來收藏的時候了。家裡的整修一完工，奧黛莉和我馬上去找佛雷斯哥與柏雷特畫廊的老闆─亞爾．佛雷斯哥（Alfredo）和克利夫．柏雷特（Clifford）。佛雷斯哥是我在哥倫比亞商研所的同班同學，他和柏雷特是表兄弟，兩人從長輩的手中接管這家畫廊。他們的祖母和美國早期的印象派畫家約翰．托契曼（John
    H. Twachtmann）有親戚關係，後來嫁入杜邦（Du Pont）家族，所以佛雷斯哥和柏雷特有足夠的天賦和鈔票，來經營這家位於高級商圈的畫廊。


    當我在一九八○年代開始賺很多錢之後，奧黛莉和我便開始在週六下午到各個畫廊去探訪，佛雷斯哥與柏雷特畫廊成了我們常常造訪的地方。當時雖然我們很喜歡那裡的藝術品，但是我的財力'
  - '[PAGE 196]


    還不夠。但現在，可就不能同日而語了。


    一八八六年十月，我們用十萬美元向佛雷斯哥與柏雷特畫廊購買了厄尼斯特．勞森（Ernest Lawson）的《冬季的投影》。以勞森的作品而言，這幅畫可算是相當昂貴的了。另外，我們又以四萬美元的價格買下羅伯．沃諾（Robert
    Vounot）的《花園裡的農夫》。在另一個下午，我花了五十萬美元買下了兩幅畫。為了感謝我這筆五十萬美元的生意，佛雷斯哥送了我一本書，書名是《美國的印象派作品》，這本書的作者是紐約市立大學研究所的藝術史教授威廉．哲茲（William
    Cates）。


    從小，我就特別喜歡印象派畫家的作品。一八八四年，奧黛莉和我第一次去歐洲旅行，我們在巴黎雇了一位司機，要他帶我們去參觀莫內的家和吉維尼（Giverny）的花園。那是五月初，我和奧黛莉就像那些十九到二十世紀初的畫家一樣，盡情飽覽法國的田野風光。可是當我們回到紐約，想要找一些值得收藏的作品時，才不知道想收藏法國最高級印象派名家畫作的點子是多麼愚蠢——我怎麼可能付得起那麼高的價錢去買像馬奈、雷諾瓦、竇加或莫內這些一流畫家的作品？


    如果一定要買，我只能找次一級的法國畫家作品，或是那些已經深得法國名家畫風精髓的美國本土印象派畫家，像希歐多爾．羅賓森（Theodore Robinson）、斐德利克．佛利錫克（Frederic
    Fitz）、溫斯洛．霍姆（Winslow Homer）、瑪莉．卡塞特（Mary Cassatt）以及羅伯．沃諾等，他們的作品就在我的财力範圍之內。'
  - '[PAGE 197]


    在參觀更多的畫廊和仔細研究過哲茲的書後，我下了一個結論，那就是所有畫家們就和其他人一樣，都經歷過好與不好的時期。至少在我眼中，瑪莉・卡塞特鼎盛時期的作品，和竇加在他未達顛峰時的畫作相比，只有過之而無不及。加上法國畫家的作品更具有滿足虛榮心的吸引力，所以一幅一流美國畫家作品的售價，通常只有法國二線畫家作品售價的三分之一。


    換言之，美國的印象派畫家就像我早些年在 AMEX 操作的選擇權，或是一九八〇年代早期的 S&P 期指契約一樣，正好符合我的作風和個性。它們的價格合理、具有增值的潛力，仍然處於新興市場之中，而且我了了解它們。如果我準備進軍藝術品市場的話，美國印象派畫家的作品會是我最想介入的標的。


    當我開始花更多時間在佛雷斯特哥與柏雷特畫廊後，發覺佛雷斯特哥和柏雷特具有和我非常相似的市場哲學，他們只會以最好的價錢買進最好畫家的最佳作品作為存貨。由於總是有一大堆想要買最高級藝術品的富有客人來畫廊參觀，因此這個策略使他們的庫存作品享有很好的變現性。


    當我從事交易時，一定會以大型藍籌股作為我主要的交易標的，因為這些大型績優股提供最佳的流通性和變現性。如果我賣了五萬股的 IBM、全錄或杜邦股票，卻在一個小時後改變了對市場的看法的話，我可以在市場上很輕鬆地把手中持股拋出，因為這些股票的交易總是夠熱絡。這就是佛雷斯特哥柏雷特畫廊的生意經，他們手中總是保有和藍籌股一樣具有良好流通性的存貨，以便於隨時可以出清。


    我唯一的問題是，畫廊總是以零售方式出清庫存，而我與生俱來的猶太人天性告訴我，該去'
  - '[PAGE 198]


    「大盤商」那裡買進我要的東西才對。我知道自己再找什麼樣的作品——美國的印象派名家畫作，而且我沒打算要收藏什麼特別了不起的玩意兒，只想以最好的價格買到最好畫家的最佳作品。這表示：我必須到拍賣會場去。


    # 選畫，就像選股——先剔除你不喜歡、不熟悉的標的


    在五十九街與公園大道交叉口的佳士得（Christie''s）和在七十二街與約克街交叉口的蘇富比（Sotheby''s）是美國本土藝術品最主要的兩個拍賣公司。其中，蘇富比每年會舉辦兩次美國印象派畫家作品拍賣會，一次在十二月初，另一次在五月下旬。我們決定要參加蘇富比在一九八六年十二月四日舉辦的拍賣會。


    對我來說，藝術品拍賣會是一個全新的戰場，要面對一大堆藝術品拍賣身經百戰的對手，我非常沒把握，因此在拍賣會舉行的三週前，我跑去找佛雷斯哥和柏雷特。「奧黛莉和我想要開始建立美國印象派畫家作品的收藏，但是我們不能一直向零售商行買，付那麼高的零售價。」我說：「我們想參加蘇富比舉行的拍賣會，因此我們需要你們的建議。我的想法是這樣的：如果你們可以教我，我可以幫你們買下一些你們感興趣的作品，如果將來哪天你們有客人對這些作品有興趣，你們可以來找我買。你知道，我是一個操盤手，只要價錢合適，我們就可以做些買賣。這麼一來，你們可以將現金先放在別的地方，而不需要先購買這些存貨，你們覺得怎麼樣？」'
