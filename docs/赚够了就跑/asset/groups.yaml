    # 倒在地上喊痛，等於把先機拱手讓人


    一九八一年十一月，我的人生陷入嚴重低潮。當時，奧黛莉懷了二十週的身孕（我們的第一個孩子），但產檢時醫生發現她沒有羊水，因此很快就流失了那個孩子。我們簡直不知所措，我的祖父以前總是喜歡唱著：「如果沒有夢，哪來的美夢成真？」但祖父從來沒告訴我們，當夢想硬生生地從手中被奪走時，你會有多心痛！


    失去孩子後，我們感歎人生苦短。如果無法享受，賺那麼多錢又有什麼用？該是花些錢及時行樂的時候了。


    奧黛莉和我都喜歡位在海邊的房子，可是我們結婚以來卻一直困在一幢兩房的公寓裡。所以，該是買一幢的時候了。一九八二年一月一日，我們用手中擁有的一百二十萬美元其中三分之一，在西罕普敦買了一間海濱別墅。


    以財務的觀點而言，把這麼多資金放在這種沒生產力的資產上似乎很蠢，但在我心中一直嚮往著整個夏天都待在海邊，每天坐在游泳池邊交易的美夢（我後來發現，在游泳池邊曬整天太陽可真難受，還得圍著一條大浴巾，躲在報價螢幕的陰影下）。


    當我被擊倒時，我絕不會等著人家倒數讀秒，一定會馬上站起來。我相信「塞翁失馬，焉知非福」這句話，如果我還倒在地上喊痛，就等於失去先機。


    一九八二年四月二十一日，買下別墅的兩個月後，CME宣布開放標準普爾五百股價指數期'
  - '[PAGE 127]


    貨契約（Standard & Poor’s 500 Stock-Index Futures Contracts，簡稱 S&P）的交易。這是一個米爾蘭稱為「終極契約」的新金融工具，是以五百家大型企業的股價為基礎的契約。我直覺地認為，S
    & P 期貨將會是最適合我的操作工具，因為它是從股價衍生出來的工具。而我長久以來用來從事股票交易的技術，例如神奇的 T 理論、十日移動平均線、動量指標、KD
    指標都可以用在這個新工具的交易上。這就好像突然間，我可以在所有的二十一點賭桌上下注一樣令人興奮。


    一九八二年四月二十九日早上，我下了第一張 S & P 期貨的交易單，買進二十口六月的期貨契約，結果輸了三七〇美元。第二天，我又試了一次，在一一七．二的價位買進四十口六月期貨契約。一口
    S&P 期貨契約的總值等於指數乘以五百，所以我所買進的六月期貨契約總值是二三四萬四千美元（45 x 500 x 11720），但我可以不必動用這麼多資金，因為我存在期貨交易帳戶中那價值十二萬美元的國庫券，足以滿足保證金所需。這才叫作財務槓桿，乖乖——買真價貴的財務槓桿！僅僅幾個小時後，我在——七．七賣出所有的部位，賺進了一萬美元（45
    x 500 x 0.5）！


    在那年的整個春夏季裡，我不停地用 S&P 期貨做試驗。雖然我對這個契約非常有興趣，但仍舊十分小心。當任何一種新金融工具剛上市時，都很不穩定，每個人只抱著姑且一試的心態，使得交易量很不規律，而交易所也很難馬上使交易情況導入正軌。和
    CME 一樣，我把每個交易日都以半小時為單位加以分割，每半小時我就把價格的變動率畫下來。我把盤中的動能看作潮汐一般，有高有低、有漲有退、忽前忽後。如果 S&P
    指數在三個時間單位中，連續上漲○．五點、○．三點及○．一點的話，我就察覺到價格動能正在轉變，而價格的正弦曲線將要轉而向下，市場的紅燈馬'
  - '[PAGE 128]


    上就要亮了，此時就該換檔、停車（平掉多頭倉），等到綠燈亮時，採取行動，轉頭作空。


    我在 S＆P 的市場中看到好多機會。除了迷人的財務槓桿、不需買進一堆現股就能投資五百大企業股指數這兩大好處外，S＆P也是一種絕佳的避險工具。如果我認為股市將下跌但不想賣出現股時，賣出總值相同的指數期貨契約就可以幫我規避掉大部分的风险，同時別忘了，還能節稅呢！


    另外，我也發現了另外一種交易輔助工具，那就是道瓊德勵（Dow Jones Tase，譯註：在臺灣通常稱為美聯社）的報價單機，這對我在國庫債券的交易上確實提供了不少幫助。雖然
    CBOT 提供了一個穩定的國庫債券交易市場，但真正的政府公債現貨卻沒有一個集中交易市場。公債現貨經由聯邦政府發行後，投資人只能經由經紀商從事買賣。當利率上漲或下跌時，公債現券的價格也隨之往反向波動，當某經紀商以一○○的價位叫出公債時，另一家卻可能以九八叫出同一期公債，各經紀商的出價完全根據自身的部位和籌碼而定。所以債券交易者就得和農人買賣新鮮牧草一樣，必須四處詢價以找出最好的報價。


    尼爾·赫舍（ZE·Hersh）曾經擔任肯特債券經紀商（Kenet-Begard）的營業員。他發現，公債現貨市場的玩家們一直希望能有一個提供所有公債報價的服務機構，所以就成立了德勵公司，向各家經紀商收集政府發行各種不同天期公債的最新報價，然後將這些價格立即顯示在德勵出租的單機螢幕上。所有租用德勵報價機的交易者，從此可以很有效率地掌握最新現券報價。


    自從我花了更多時間從事 AMEX 以外的交易後，就租了一部德勵單機。在我們這行中最主要的工作，就是找出市場的不均衡狀態並從中獲利，而德勵的報價機在債券期貨的交易上提供我相當'
  - '[PAGE 129]


    的助益。此外，我本來就很喜歡這些科技產物，也總是在新玩意兒推出後買來嘗鮮。雖然我比較少在 AMEX 場內進行交易，交易所仍然規定會員必須每天到場內亮個相。有一陣子我還是天天早上去晃一下，但是由於
    AMEX 只有股票交易，在場中並沒有任何的德勵單機可以看到公債行情，所以我總是在下午三點後回到辦公室查看公債報價。公債期貨在下午三點收盤，但是現券市場則只要經紀商想交易都一直有報價，而德勵單機上的公債報價讓我得以藉由於這些盤後交易，感受第二天的行情走勢。


    # 努力做功課，果然挖到大金礦！


    九月十日，一個星期五的下午，當我回到辦公室查看公債報價時，發現了一些有趣的事。


    「奧黛莉，來看看這個！」我說：「我發現，現貨公債和 S&P 指數間有一種互動關係耶！」


    「我正在忙，等一下。」奧黛莉回答。自從我很清楚自己想成為操盤手，奧黛莉就辭去了工作，和我並肩作戰。她幫我繪製技術圖，完成一些文書工作，傾聽我對行情的看法。過不了多久，她已經能夠分辨出我是很認真在討論一個交易機會或者只是閒話幾句。


    「不，趕快過來看一下啦！我想我可能發現了什麼。」


    奧黛莉正在做一些文書工作，並不想被打斷。我們才剛剛從市區搬到新買的海濱別墅，她還在適應當中。她很不情願地把椅子滑到剛好瞄得到德勵報價機的位置。「我一直把現貨公債看作是公'
  - '[PAGE 130]


    債期貨的先行指標，「我指著報價螢幕說：「但是，股價也會因為利率波動而漲跌。」這是因為當利率上揚時，企業必須付出更多的資金，因而提高了經營成本而侵蝕獲利。高漲的利率使得消費者不願擴張信用來買東西，這會減緩企業營收而更不利於獲利，股價會因而下跌。


    「所以呢？」「所以如果國庫債券價格在盤後交易中上漲，代表利率在下個交易日會下跌，那 S & P 期貨就該上漲。」「我拿起一疊技術圖，「給你看個例子，八月三十日，公債現券的價格在最後一小時下跌了〇・七五點，「我又拿出了十日移動平均線圖，「你看這裡，八月三十一日的
    S & P 指數開盤就下跌了〇・八點。但是上週公債價格上漲了〇・五點，而 S & P 第二天開盤就上漲了〇・六五點。」「那又怎樣？」「奧黛莉，這會是一個很棒的指標啊！」我感到非常興奮。「公債期貨三點就收盤了，但
    S & P 期貨要到四點十五分後才收盤。如果公債現貨價格在三點到四點十五分之間上漲的話，我就可以在收盤時買進期指。如果公債現貨下跌，我就賣出期指。」我指著報價機的螢幕。「聽著，前幾個小時公債現券的價格已經上漲了〇・五點，如果我的推論對的話，這表示
    S & P 下週一會開高。「奧黛莉看了一下錶，「現在已經四點十分了，你只剩下五分鐘，如果你想試，那就試試吧！」「我走到電話旁邊，「如果公債現券在最後一小時上漲〇・五點，我可能就太遲了。我看一下
    S & P 的價位……，黛比！」「我打給我 在 S L & K 的營業員，「我是馬丁。十二月的 S & P 期貨現在在哪裡？……漂亮！沒有動，幫我市價買進三十口。」'
