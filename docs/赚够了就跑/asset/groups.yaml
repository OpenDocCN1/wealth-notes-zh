    # 第15章


    # 原來，我想要自由，以及健康


    # 鬼門關前走一遭的領悟


    如果能在十一月份有良好的績效表現，或許可以保住大部分的投資人。


    十二月二日星期五下午三點半，我再也撐不下去了。在那個星期中，我和貝克瀝（Alber Baard）、巴福（Bernard LeBuffoo）、謝斯可夫（Helmur
    Schsskopf）以及莫德（Piere Tere du Merle）等幾位最重要，也是平常最支持我的客戶見面。現在我的時間被分割得零零散散的，我以前為自己的資金操作時，從來不在營業日晚間出門，而那場在週一於魯提斯餐廳舉行的餐會，以及十月份以來和客戶的密集會談，簡直把我累壞了。我整個白天都投入S＆P期指的交易，並在那週之中賺了十萬美元，但以其所承受到的壓力來看，這種獲利根本算不了什麼。十二月三日的早上我收到一封由喬治·葛蘭諾里斯（Georges
    Grossill es）從日內瓦發來的傳真，裡面只寫著…'
  md: '

    必須向投資人提出報告，而這也對我產生短期性的壓力。我原本認為，這些套利部位能夠在一個沒有明顯趨勢的市場中提供較好的收益率，但我的想法錯了，這些獲利沒有出現，五週後，我的虧損已經達我募集的四千萬美元資金的六％，高達二百四十萬美元。


    我以前從來沒有虧損過這麼多錢，自信心也隨著我的錢而每下愈況。我開始縮減部位、保護資金，然後盡量在有機會時就實現獲利。這些做法果然奏效，到了三月底，這兩個基金的淨值已經轉為獲利七．六％；反觀同一時段，我的比較基準——紐約證券所綜合指數（New
    York Composite Index）——則是下跌了四．二％。在短短三個月裡能夠有高於大盤指數一一．八％的表現，在任何投資人眼裡都應該是非比尋常的操作績效。許多投資人也的確這麼認為，因而衍生出我的第三個問題。


    當我開始為基金操作時，最主要的考量之一，就是我能否像操作自己的一千萬美元規模的資金一樣，有效率地操作這兩個總額四千萬美元的資金。在前兩次經驗中，我發現操作較大金額的資金會改變我對部位的持有時間。我傾向於持有部位更長一段時間，而這改變了我在短時間內實現獲利的交易風格，但是我在八九○年第一季的表現，讓我相信我有能力管理金額更大的基金。所以在四月一日，我再度開放新資金投入基金裡，並成功募集到三千萬美元的資金。


    大部分操作七千萬美元資金的操盤手都會打散資金，尋找適當的投資標的，以分散風險，然後讓手下年輕的職員幫他們執行交易指令，那些操盤手則高高在上，縱觀全局並主導全盤策略的大方向。但這不是我的風格，我是個控制欲極強的人，我的手下也沒有幫忙的小弟——我早就把之前的兩名員工辭掉了，完全由自己進行交易工作。


    我一直採取防守性策略，並在四月份又增加了一·五％的獲利，但是在五月及六月當中，市場的走勢卻和我的部位背道而馳。我沒有搭上任何一波重要多頭走勢的列車，壓力立刻從四面八方蜂擁而至。在整個上漲趨勢當中，投資人不斷問：「我的錢運作得如何？」


    當你全心投入操作的時間超過了結算年度的三分之一時，投資人只想聽到一個答案：「簡直棒呆了！」但是我沒辦法說出這句話。每個月初，我都會寄一封信給投資人，向他們說明基金的操作狀況，而在六月份的那封信裡只能這麼說：


    身為基金裡最大的投資人，我個人覺得維持每個月獲利，要比試圖在市場上靠少數幾次交易大撈一票來得重要。我的投資績效是基於持續性的獲利能力，並使複利成長得以有機會發揮它神奇的力量。


    這對任何人來說，都不會是什麼振奮人心的話。客戶繼續打電話、传真、寫信或用其他方式來抱怨他們的報酬率，並且拿其他操盤手的績效和我比較。那些引介國外資金的捐客就更糟糕了，他們幾乎每天都在我正交易的時段打三次電話給我：「馬丁，我的錢操作得怎麼樣了？」我簡直不能相信這些傢伙會幹出這些事。既然他們把資金以一年的固定期限投入，這麼在乎每天的損益幹什麼？難道他們不知道我在各式各樣的市場狀況下，已經連續維持了十年的二位數獲利嗎？他們不知道我是冠軍操盤手嗎？


    七月份，我試著在報告六月份績效的信裡提醒投資人他們是以長線的眼光投入資金，並附上一份長達兩頁，從理查・羅素（Richard Russell）的《道氏理論通訊》上摘錄下來的文章。這篇摘錄顯示複利成長的效果是多麼強大，並且一直以來都是聰明投資人用來累積巨額財富的最佳方法。緩慢但持續地獲利，才是這個遊戲的真諦。我在七月份的那封信中再次以防御性的方式寫道：


    > 當我創立這個基金時，我知道總會有某段時期會超越其他操盤手的績效，而有些時候又會表现得比別人遜色。這就是我為什麼要求諸位以最低一年的期限來投資，而這也是我認為應該被諸位評估的方式。當這一年的期限結束時，諸位將可以決定是否繼續把資金投資於此，甚至提高投資金額。我只希望諸位能在適當的期限時再評估我們的操作績效，並以相對和絕對的觀點把我們的表现和其他操盤手及投資機會做比較。


    在信中我沒有告訴投資人的是，我已經準備好要採取攻擊性的策略了。我馬上就要來個長打。


    # 你狠行還不夠，因為別人比你厲害


    奧黛莉決定在暑假期間，再度裝潢我們在公園大道的公寓。我們把東西都打包好，然後搬到避曬小屋。有一天我和一個避險基金的經理人打網球時，他對我說：「嘿，馬丁，你有聽到什麼普強（Pfizer）的消息嗎？」


    「普強？」我一副好像很了瞭的樣子：「那你聽到了什麼呢？」


    「聽說有一家瑞士公司打算購併他們，所以我已經買進普強了。」


    我馬上打電話給內線史基尼。史基尼在華爾街到處都有眼線，如果有人對普強這個位於密西根的大型藥廠採取了什麼行動的話，他一定會知道。


    「馬丁，」史基尼語氣輕鬆地在電話裡說：「我正想要打電話給你！我在瑞士的眼線剛剛告訴我這筆交易已經完成了，而且有很多歐洲方面來的買盤，看起來真的是有那麼一回事，大家都想藉著這個購併搶一票。」史基尼說話有一套他自己的方式，而他已經把我想知道的告訴我。如果我想來個全壘打的話，普強就是我會介入的標的。


    我開始大量買進普強。


    我一直很喜歡精巧的小電器用品，終於也買了一部行動電話，雖然它看起來就像是一個又大又笨重的汽車電瓶。我可以邊坐在球場旁邊看著奧麗莉打網球，邊對著電話大喊：「再幫我買進一萬股，買進一萬股！」整個七月，普強一直不斷小幅上漲，我也不停地買進。我有時會在週五下午坐在海灘上看著孩子們堆砌沙堡，一邊對著那個汽車電瓶手機大吼：「收盤前幫我買進三千股！買進！」我的多頭部位愈來愈大，整個資金都投到普強去了。到了八月初，我正在前往中國大陸途中，但還是持續作多。我買進了超過四千萬美元的普強，超過了基金總額的一半，總共買進了將近一百萬股。


    八月二日，海珊派兵入侵科威特。市場開始下挫，而原油期貨的價格則一飛沖天。股市很快重挫了一○%, 普強的股價也不可避免地加入下跌走勢中。我開始賣出 S & P
    指數期貨來規避部分的股股風險，但這卻讓我陷入另一個星期的困境中，因為普強的 beta 值（單一股票和大盤指數之間的連動關係係數）已經因市場的變動而成為 S
    & P 指數的兩倍，但我卻在後來才察覺到這個變化。基本上，這表示大盤每變動一%, 普強的价格就會變動二%。以前市場下跌的狀況來說，普強會下跌二%, 所以如果我賣出總值四千億美元的
    S & P 指數期貨，還是不夠，我應該要賣出總值八千萬美元的 S & P 指數期約才對。


    在八月中旬某個星期一早晨，我賣出了四百口 S & P 指數期約，而市場從開盤就跳空下跌。我在五分鐘內就賺進了一百八十萬美元，但是普強的股價也下跌了 1% ，使得基金在當天的整體表現只是打平而已。問題是，拜海珊之賜，讓原油和其他大宗物資的價格瘋狂飆漲，結果鐘斯、考夫納和貝肯那些沒有買進普強的期貨市場玩家，都因為作多期貨而賺翻了。


    由於《金融怪傑》這本書的介紹，我得到了期貨市場玩家的封號，但是我從來沒有純粹專做商品期貨交易。我真正的專業是在 S & P 指數期貨，而它則代表了那個目前正在狂跌的股票市場。所以當那些市場高手們因為買進商品期貨，趁著通貨膨脹預期心理高漲之際大賺其錢的同時，我卻只能以賣出
    S & P 期指來鎖住那一百萬股普強所面臨的風險，勉強打平而已。


    到了九月中旬，我和一位主要的投資人做了一次年度操作績效回顧。除了沙伯林納合夥基金和沙伯林納海外基金之外，我另外替豪斯曼海外基金（Hamilton Overseas
    N.V.）——一家註冊於荷蘭安特列斯（Aruba）的基金——操作五百萬美元。我將這筆錢分開操作，是因爲豪斯曼不希望將這筆資金和其他投資人的混在一起。他們希望所有交易都經由路博博（Zurich
    & Basel）資產管理公司來進行。每個人都想和豪斯曼合作，看在五百萬美元的份上，我同意他們的交易都經由這家荷蘭籍的大公司來完成。


    豪斯曼公司的十二位高級主管，在六十五街和公園大道西南角的麗晶飯店訂下了一個小會議室，然後邀請所有的基金經理人和他們仔細檢討操作績效。我的房子就在離那兒不遠的地方，所以我只要走一小段路就可以到達會場。


    我挺著胸膛、昂首闊步走進會議室說：「我爲各位操作得很棒。我在普強上面虧損了八％，但是以年度而論，我還是保有一二％的淨獲利。以我目前持有的部位，如果一切順利的話，今年將可以出現三〇％到四〇％的獲利率。目前唯一的狀況是，只有我的部位沒有立即達到預期的表現。」


    那些豪斯曼的高級主管並不想聽到這些關於普遍的話題，他們開始拿我的操作績效和鐘斯、考夫納、貝肯以及其他期貨市場的明星操盤手做比較。聽著，「我對他們說：「我操作的不是期貨基金。當初你們把資金投入時我就告訴過你們，保護資金是我的第一要務。我只投入二五％的資金到期貨市場，如果我把所有的資金都投入的話，可以把財務槓桿放大十五倍，然後替你們賺取一〇〇％的報酬率，也可能把你們的錢全部輸光，然後去坐牢。」他們根本不買我的帳，因爲我收的基金管理費和期貨基金一樣高，他們繼續拿我和那些期貨基金的經理人比較。然後，同樣的戲碼一直重複上演到十月份。在市場收盤後，我躺在辦公室的沙發上，等著國外投資人到來。我們坐在由奧黛莉精心挑選、圍繞在大理石桌旁的名牌皮椅中。我告訴他們，我為他們操作得有多好，但他們卻告訴我，鐘斯、考夫納、貝肯和其他人的績效有多厲害。真令人沮喪。


    ## 不能反敗為勝，就只能吃麥當勞了


    鬧鐘響，已經七點了。我起牀，在臉上拍了拍水，清理了一下亞曼尼套裝、擦亮皮皮牌鱷魚皮鞋、拉直領帶，然後動身前往魯提斯餐廳。奧黛莉陪我坐電梯下樓，然後走出門去攔了一部計程車。


    「馬丁，你媽打電話來，想知道我們什麼時候回去過感恩節。」


    「什麼？我們不可能在感恩節回去，我還有一堆事要辦呢！」


    「這樣啊，那麼那幾天假期我們要幹什麼？如果不去滑雪，只好回佛羅里達了。」


    「滑雪？誰要去滑雪？」


    「我們在假期一向都會出去度假的啊！」


    「今年不行，聽著，奧黛莉，我沒法度假，我得想辦法改善操作績效，不然我的投資人都要跑光了。」


    在魯提斯的這頓晚餐，是由威利·韋伯（William Weber）作東。他是一位瑞士掮客，專門為歐洲的富有投資人尋找熱門的基金經理人。韋伯介紹了一些大客戶給我，代價是他想在沙伯林納海外基金的董事會中取得一個席位。我真的不知道董事會的成員除了收錢和報費用之外還做些什麼，但還是勉為其難地同意了他的要求，因為韋伯的確控制了不少國外投資人的資金。我和韋伯是經由我的老兄弟尼爾·魏斯曼（Neil
    Weisman）介紹認識的，但是魏斯曼今年並沒有受邀參加韋伯的晚餐聚會。魏斯曼的基金是純粹的股市基金，而他今年的表現顯然不像前三年平均年報酬率七五%那麼好。韋伯希望他來往的操盤手都是當紅炸子雞，而他顯然認為我夠紅，這也是我很希望能參加這個餐會的主要原因。經過和投資人長達一個月的艱苦溝通後，我很想找個機會到那種高手雲集的場合去和別的操盤手打打交道。


    韋伯在魯提斯的樓上保留了一個隱密的房間。當我走進那裡時，可以看到在場有許多市場中的後起之秀。朱利安·羅勃森（Julian Robertson）正和史坦利·朱肯米勒（Stanley
    Druckenmiller）談話。羅勃森是安靜又謙遜的南方人，他在１９８１年離開奇德與皮博迪公司後，在四十七歲創立了一個只有八百萬美元規模的基金，而現在他操作的基金規模已經超過十億美元了。朱肯米勒是索羅斯的左右手，而奧德西合夥基金（Odyssey
    Partners）的里昂·李維（Lion Levy）正加入他們的談話。


    韋伯上前來歡迎我。「馬丁真高興看到你。來，跟我去見見幾個客戶。」客戶的名字對我來說一點意義也沒有。在沙伯林納海外基金之中，我的客戶就是一堆位於百慕達、巴哈馬、瑞士、開曼群島和其他免稅天堂的銀行帳戶號碼。當我走到房間的另一頭時，韋伯向我解釋客戶們正在進行一種創新式的生意，並已經從中賺取巨額利潤。「馬丁，告訴他們，你的基金操作得很棒，真的很棒。」韋伯在我身旁輕聲說著。


    等到真的可以坐下來的時候，我被安排坐在菲奧娜·畢格斯·朱肯米勒（Fiona Biggs Duckett）的旁邊。由於我是這個交際圈的新人，對這些人並不是很熟悉，但是在用餐當中，我知道菲奧娜不但是朱肯米勒的太太，也是巴爾頓·畢格斯（Baron
    Biggs，嗎根斯坦利公司首席策略分析師）的姪女。她和斯坦利是在他們任職於德瑞弗斯（Driftet）公司時認識的，在我們的談話中，我發現菲奧娜顯然很懂得怎麼和這些高手打交道。


    這場餐會比起先前商品公司的操盤手餐會要有意思得多，甚至比在謝克那個位於查理一世別墅裡的聚會還要棒。在那兩個餐會中，會場中的大咖很多，但在這個餐會中，我卻是少數的菁英人士之一。整個晚餐當中，我不斷對自己說：「這裡是真正屬於我的地方，這裡是我真正想到的地方，這是我想要為別人操作用金的原因。」但是，整個用餐期間，另一個細小的聲音卻也在耳邊沒間斷過：「馬丁，除非你今年能夠反敗為勝，否則明年你會在麥當勞和魏斯曼一起吃晚餐。」


    # 想繼續待在領先群，就要改變策略！


    午夜過後我才回到家，累得要命卻沒法人睡。我的思緒飛騰。


    如果我繼續待在市場高手的陣營裡，必須做些重大改變。羅勃森、朱肯米勒、李維、鐘斯、考夫納、貝肯、索羅斯都是市場高手，我能夠和他們任何一個人平起平坐，我的基金規模可以和他們的一樣大、甚至超越他們。我得多賺點錢，我需要改善操作績效。


    第二天早上，我告訴我的交易助理愛麗森．布朗（Allison Brown）：「幫我每天賣出一萬五千股」。包袱還在我身上，我鐵定沒有辦法達成投資人期望的報酬率。如果我以每天二萬五千股的幅度來調節掉這個部位，我想不會把普強的股價打壓得太嚴重，此外，如果這家瑞士藥廠真的開始購併行動，我還是有機會享有部位的漲幅。內線史基尼不停告訴我：『這事馬上就要宣布了，馬丁，不買賣掉那些股票。我知道這的確是拖得久了這一點，但這些事不是都會一直拖得比較久嗎？』


    接著，我坐下來為十一月一日要寄給投資人的信打草稿。如果他們希望我操作的是期貨基金，我就幫他們把基金轉型為期貨基金，我在信中寫道：


    展望一九九一年的發展計畫，我已經決定要為沙柏林納基金進行幾項改變。首先，同時也是最重 要 的 ， 就 是 將 基 金 在 期 貨 市 場 及 股 票 市 場
    的 投 資 分 配 比 例 ， 分 別 由 一 九 九 ○ 年 的 二 五 % 比 七 五 % 改 變 為 五 ○ % 比 五 ○ % 。 我 們 有 幾
    個 理 由 做 這 項 改 變 ： 其 一 ， 我 們 今 年 的 獲 利 絕 大 多 數 來 自 於 期 貨 交 易 ， 我 們 以 一 六 五 ○ 萬
    美 元 的 投 入 資 金 賺 得 了 一 二 二 ○ 萬 美 元 的 獲 利 ， 相 當 於 六 一．八 % 的 報 酬 率 。 其 二 ， 是 來 自
    許 多 基 金 投 資 人 的 要 求 ， 他 們 希 望 投 資 有 更 高 的 波 動 性 ， 並 且 願 意 承 受 隨 之 而 來 的 風 險 ，
    以 追 求 更 高 的 潛 在 獲 利 。


    第二個重要的改變是由於經濟環境的快速變動，投資人只要支付一％的帳務費用，就可以在年中抽回投入的資金。


    第三個重要的改變是一個「到價出場」的運作模式，一旦基金的操作產生年初資金總額三五%的虧損時，基金將自動停止運作。


    我有計畫地出清所持有的普通股股票部位，並將投入期貨和股票市場的比例加以調整。我已經準備好，全心投入接下來兩個月的交易了。


    # 投資就是投資，別談感情


    尼爾·魏斯曼是我最好的朋友之一，我第一次和尼爾見面可以回溯到一九七二年我到金宇塔工作的那個時候。魏斯曼是金宇塔公司的股票經紀人，總喜歡到處蒐集一大堆資訊，也一直都試著和市場裡的好手打交道，我在公司是負責熱門產業的新進人員，所以他很自然地就和我成為朋友。


    認識魏斯曼，是我在金宇塔公司的工作經驗中唯一對我有幫助的事。當我在排隊領失業救濟金，而華爾街沒有一個人願意給我工作时，魏斯曼為我打電話給傑瑞·法柏（Gary
    Taffa）。


    法柏是金宇塔公司的前任分析師，當時他正擔任愛德華與韓利公司的研究部主管。魏斯曼告訴法柏我被人惡整的事，並向祂極力推薦我。感謝魏斯曼，法柏真的雇用了我，我也因而認識了佐爾納。多虧了魏斯曼，把我從人生最嚴重的低潮中拉了出來，並且再度回到了市場。


    一八六六年初天，我終於有機會報答他。魏斯曼是一個很棒的操盤手，也一直都想成立自己操作的基金，但需要有人幫他一把，所以我就對他說：「我把我和奧黛莉的退休基金都交給你，你放手幫我操作這筆錢吧！」


    這筆錢的總額大約有七十五萬美元。以這筆錢作為基礎，魏斯曼募集到了另外的一千二百萬美元，這已經足夠讓他開始操作他的基金了。他在基金募集完畢後，很高興地在1967年的第一個月，動身前往加勒比海的一個遙遠小島度假，並在這一年的前五個交易中完全斷絕了和市場的聯繫。在這幾天當中，市場突然狂飆上漲，而魏斯曼卻完全沒有掌握到這次機會。當我們在二月中一起參加某個晚餐聚會時，市場已經上漲了20％，魏斯曼的基金報酬率卻只有九％，所以我對他說：「魏斯曼，你在搞什麼東西？怎麼會在新年一開盤的時候跑去度假？你完全沒有把握到這次的漲勢。我真不敢相信我竟然把錢交給你操作。如果我能夠把錢抽回來，一定馬上這麼做！」這就是我對魏斯曼，這個把我從人生低潮中拉出來，而且剛剛才開始操作他第一個基金的好朋友所說的話。


    魏斯曼或許可以對我說：「去你的！馬丁，我不需要你的錢，拿走你的臭錢然後滾蛋。」但是他沒有這麼做，因為他知道市場的規矩。身為一個成功的生意人，不論你是操盤手、投資人、企業家或是其他什麼身分，絕不能讓友誼或家族關係介入你和金錢相關的重要決策。魏斯曼當時給我的回答是：「馬丁，如果你想的話，可以狠狠揍我一頓，因為沒有人能比我給自己更大的壓力。」魏斯曼回去後努力操作，在那年創造了七五%的優秀績效。


    在接下來的三年當中，他把我投入的資金增加為原來的三倍。到了一九九四年，他的基金已經成長為五億美元的規模。我現在仍有一些資金放在他的基金裡，但我們兩個人都很清楚，如果我在別的地方能夠找到更高的報酬率，我會毫不考慮地和魏斯曼說拜拜。這無關任何私人恩怨，只不過是這個市場的遊戲規則罷了！


    # 第15章


    ## 原來，我想要自由，以及健康


    ### 鬼門關前走一遭的領悟


    如果能在十一月份有良好的績效表現，或許可以保住大部分的投資人。


    十二月二日星期五下午三點半，我再也撐不下去了。在那個星期中，我和貝克瀝（Alber Baard）、巴福（Bernard LeBuffoo）、謝斯可夫（Helmur
    Schsskopf）以及莫德（Piere Tere du Merle）等幾位最重要，也是平常最支持我的客戶見面。現在我的時間被分割得零零散散的，我以前為自己的資金操作時，從來不在營業日晚間出門，而那場在週一於魯提斯餐廳舉行的餐會，以及十月份以來和客戶的密集會談，簡直把我累壞了。我整個白天都投入S＆P期指的交易，並在那週之中賺了十萬美元，但以其所承受到的壓力來看，這種獲利根本算不了什麼。十二月三日的早上我收到一封由喬治·葛蘭諾里斯（Georges
    Grossill es）從日內瓦發來的傳真，裡面只寫著…

    '
  mdcn: '

    必須向投資人提出報告，而這也對我產生短期性的壓力。我原本認為，這些套利部位能夠在一個沒有明顯趨勢的市場中提供較好的收益率，但我的想法錯了，這些獲利沒有出現，五週後，我的虧損已經達我募集的四千萬美元資金的六％，高達二百四十萬美元。


    我以前從來沒有虧損過這麼多錢，自信心也隨著我的錢而每下愈況。我開始縮減部位、保護資金，然後盡量在有機會時就實現獲利。這些做法果然奏效，到了三月底，這兩個基金的淨值已經轉為獲利七．六％；反觀同一時段，我的比較基準——紐約證券所綜合指數（New
    York Composite Index）——則是下跌了四．二％。在短短三個月裡能夠有高於大盤指數一一．八％的表現，在任何投資人眼裡都應該是非比尋常的操作績效。許多投資人也的確這麼認為，因而衍生出我的第三個問題。


    當我開始為基金操作時，最主要的考量之一，就是我能否像操作自己的一千萬美元規模的資金一樣，有效率地操作這兩個總額四千萬美元的資金。在前兩次經驗中，我發現操作較大金額的資金會改變我對部位的持有時間。我傾向於持有部位更長一段時間，而這改變了我在短時間內實現獲利的交易風格，但是我在八九○年第一季的表現，讓我相信我有能力管理金額更大的基金。所以在四月一日，我再度開放新資金投入基金裡，並成功募集到三千萬美元的資金。


    大部分操作七千萬美元資金的操盤手都會打散資金，尋找適當的投資標的，以分散風險，然後讓手下年輕的職員幫他們執行交易指令，那些操盤手則高高在上，縱觀全局並主導全盤策略的大方向。但這不是我的風格，我是個控制欲極強的人，我的手下也沒有幫忙的小弟——我早就把之前的兩名員工辭掉了，完全由自己進行交易工作。


    我一直採取防守性策略，並在四月份又增加了一·五％的獲利，但是在五月及六月當中，市場的走勢卻和我的部位背道而馳。我沒有搭上任何一波重要多頭走勢的列車，壓力立刻從四面八方蜂擁而至。在整個上漲趨勢當中，投資人不斷問：「我的錢運作得如何？」


    當你全心投入操作的時間超過了結算年度的三分之一時，投資人只想聽到一個答案：「簡直棒呆了！」但是我沒辦法說出這句話。每個月初，我都會寄一封信給投資人，向他們說明基金的操作狀況，而在六月份的那封信裡只能這麼說：


    身為基金裡最大的投資人，我個人覺得維持每個月獲利，要比試圖在市場上靠少數幾次交易大撈一票來得重要。我的投資績效是基於持續性的獲利能力，並使複利成長得以有機會發揮它神奇的力量。


    這對任何人來說，都不會是什麼振奮人心的話。客戶繼續打電話、传真、寫信或用其他方式來抱怨他們的報酬率，並且拿其他操盤手的績效和我比較。那些引介國外資金的捐客就更糟糕了，他們幾乎每天都在我正交易的時段打三次電話給我：「馬丁，我的錢操作得怎麼樣了？」我簡直不能相信這些傢伙會幹出這些事。既然他們把資金以一年的固定期限投入，這麼在乎每天的損益幹什麼？難道他們不知道我在各式各樣的市場狀況下，已經連續維持了十年的二位數獲利嗎？他們不知道我是冠軍操盤手嗎？


    七月份，我試著在報告六月份績效的信裡提醒投資人他們是以長線的眼光投入資金，並附上一份長達兩頁，從理查・羅素（Richard Russell）的《道氏理論通訊》上摘錄下來的文章。這篇摘錄顯示複利成長的效果是多麼強大，並且一直以來都是聰明投資人用來累積巨額財富的最佳方法。緩慢但持續地獲利，才是這個遊戲的真諦。我在七月份的那封信中再次以防御性的方式寫道：


    > 當我創立這個基金時，我知道總會有某段時期會超越其他操盤手的績效，而有些時候又會表现得比別人遜色。這就是我為什麼要求諸位以最低一年的期限來投資，而這也是我認為應該被諸位評估的方式。當這一年的期限結束時，諸位將可以決定是否繼續把資金投資於此，甚至提高投資金額。我只希望諸位能在適當的期限時再評估我們的操作績效，並以相對和絕對的觀點把我們的表现和其他操盤手及投資機會做比較。


    在信中我沒有告訴投資人的是，我已經準備好要採取攻擊性的策略了。我馬上就要來個長打。


    # 你狠行還不夠，因為別人比你厲害


    奧黛莉決定在暑假期間，再度裝潢我們在公園大道的公寓。我們把東西都打包好，然後搬到避曬小屋。有一天我和一個避險基金的經理人打網球時，他對我說：「嘿，馬丁，你有聽到什麼普強（Pfizer）的消息嗎？」


    「普強？」我一副好像很了瞭的樣子：「那你聽到了什麼呢？」


    「聽說有一家瑞士公司打算購併他們，所以我已經買進普強了。」


    我馬上打電話給內線史基尼。史基尼在華爾街到處都有眼線，如果有人對普強這個位於密西根的大型藥廠採取了什麼行動的話，他一定會知道。


    「馬丁，」史基尼語氣輕鬆地在電話裡說：「我正想要打電話給你！我在瑞士的眼線剛剛告訴我這筆交易已經完成了，而且有很多歐洲方面來的買盤，看起來真的是有那麼一回事，大家都想藉著這個購併搶一票。」史基尼說話有一套他自己的方式，而他已經把我想知道的告訴我。如果我想來個全壘打的話，普強就是我會介入的標的。


    我開始大量買進普強。


    我一直很喜歡精巧的小電器用品，終於也買了一部行動電話，雖然它看起來就像是一個又大又笨重的汽車電瓶。我可以邊坐在球場旁邊看著奧麗莉打網球，邊對著電話大喊：「再幫我買進一萬股，買進一萬股！」整個七月，普強一直不斷小幅上漲，我也不停地買進。我有時會在週五下午坐在海灘上看著孩子們堆砌沙堡，一邊對著那個汽車電瓶手機大吼：「收盤前幫我買進三千股！買進！」我的多頭部位愈來愈大，整個資金都投到普強去了。到了八月初，我正在前往中國大陸途中，但還是持續作多。我買進了超過四千萬美元的普強，超過了基金總額的一半，總共買進了將近一百萬股。


    八月二日，海珊派兵入侵科威特。市場開始下挫，而原油期貨的價格則一飛沖天。股市很快重挫了一○%, 普強的股價也不可避免地加入下跌走勢中。我開始賣出 S & P
    指數期貨來規避部分的股股風險，但這卻讓我陷入另一個星期的困境中，因為普強的 beta 值（單一股票和大盤指數之間的連動關係係數）已經因市場的變動而成為 S
    & P 指數的兩倍，但我卻在後來才察覺到這個變化。基本上，這表示大盤每變動一%, 普強的价格就會變動二%。以前市場下跌的狀況來說，普強會下跌二%, 所以如果我賣出總值四千億美元的
    S & P 指數期貨，還是不夠，我應該要賣出總值八千萬美元的 S & P 指數期約才對。


    在八月中旬某個星期一早晨，我賣出了四百口 S & P 指數期約，而市場從開盤就跳空下跌。我在五分鐘內就賺進了一百八十萬美元，但是普強的股價也下跌了 1% ，使得基金在當天的整體表現只是打平而已。問題是，拜海珊之賜，讓原油和其他大宗物資的價格瘋狂飆漲，結果鐘斯、考夫納和貝肯那些沒有買進普強的期貨市場玩家，都因為作多期貨而賺翻了。


    由於《金融怪傑》這本書的介紹，我得到了期貨市場玩家的封號，但是我從來沒有純粹專做商品期貨交易。我真正的專業是在 S & P 指數期貨，而它則代表了那個目前正在狂跌的股票市場。所以當那些市場高手們因為買進商品期貨，趁著通貨膨脹預期心理高漲之際大賺其錢的同時，我卻只能以賣出
    S & P 期指來鎖住那一百萬股普強所面臨的風險，勉強打平而已。


    到了九月中旬，我和一位主要的投資人做了一次年度操作績效回顧。除了沙伯林納合夥基金和沙伯林納海外基金之外，我另外替豪斯曼海外基金（Hamilton Overseas
    N.V.）——一家註冊於荷蘭安特列斯（Aruba）的基金——操作五百萬美元。我將這筆錢分開操作，是因爲豪斯曼不希望將這筆資金和其他投資人的混在一起。他們希望所有交易都經由路博博（Zurich
    & Basel）資產管理公司來進行。每個人都想和豪斯曼合作，看在五百萬美元的份上，我同意他們的交易都經由這家荷蘭籍的大公司來完成。


    豪斯曼公司的十二位高級主管，在六十五街和公園大道西南角的麗晶飯店訂下了一個小會議室，然後邀請所有的基金經理人和他們仔細檢討操作績效。我的房子就在離那兒不遠的地方，所以我只要走一小段路就可以到達會場。


    我挺著胸膛、昂首闊步走進會議室說：「我爲各位操作得很棒。我在普強上面虧損了八％，但是以年度而論，我還是保有一二％的淨獲利。以我目前持有的部位，如果一切順利的話，今年將可以出現三〇％到四〇％的獲利率。目前唯一的狀況是，只有我的部位沒有立即達到預期的表現。」


    那些豪斯曼的高級主管並不想聽到這些關於普遍的話題，他們開始拿我的操作績效和鐘斯、考夫納、貝肯以及其他期貨市場的明星操盤手做比較。聽著，「我對他們說：「我操作的不是期貨基金。當初你們把資金投入時我就告訴過你們，保護資金是我的第一要務。我只投入二五％的資金到期貨市場，如果我把所有的資金都投入的話，可以把財務槓桿放大十五倍，然後替你們賺取一〇〇％的報酬率，也可能把你們的錢全部輸光，然後去坐牢。」他們根本不買我的帳，因爲我收的基金管理費和期貨基金一樣高，他們繼續拿我和那些期貨基金的經理人比較。然後，同樣的戲碼一直重複上演到十月份。在市場收盤後，我躺在辦公室的沙發上，等著國外投資人到來。我們坐在由奧黛莉精心挑選、圍繞在大理石桌旁的名牌皮椅中。我告訴他們，我為他們操作得有多好，但他們卻告訴我，鐘斯、考夫納、貝肯和其他人的績效有多厲害。真令人沮喪。


    ## 不能反敗為勝，就只能吃麥當勞了


    鬧鐘響，已經七點了。我起牀，在臉上拍了拍水，清理了一下亞曼尼套裝、擦亮皮皮牌鱷魚皮鞋、拉直領帶，然後動身前往魯提斯餐廳。奧黛莉陪我坐電梯下樓，然後走出門去攔了一部計程車。


    「馬丁，你媽打電話來，想知道我們什麼時候回去過感恩節。」


    「什麼？我們不可能在感恩節回去，我還有一堆事要辦呢！」


    「這樣啊，那麼那幾天假期我們要幹什麼？如果不去滑雪，只好回佛羅里達了。」


    「滑雪？誰要去滑雪？」


    「我們在假期一向都會出去度假的啊！」


    「今年不行，聽著，奧黛莉，我沒法度假，我得想辦法改善操作績效，不然我的投資人都要跑光了。」


    在魯提斯的這頓晚餐，是由威利·韋伯（William Weber）作東。他是一位瑞士掮客，專門為歐洲的富有投資人尋找熱門的基金經理人。韋伯介紹了一些大客戶給我，代價是他想在沙伯林納海外基金的董事會中取得一個席位。我真的不知道董事會的成員除了收錢和報費用之外還做些什麼，但還是勉為其難地同意了他的要求，因為韋伯的確控制了不少國外投資人的資金。我和韋伯是經由我的老兄弟尼爾·魏斯曼（Neil
    Weisman）介紹認識的，但是魏斯曼今年並沒有受邀參加韋伯的晚餐聚會。魏斯曼的基金是純粹的股市基金，而他今年的表現顯然不像前三年平均年報酬率七五%那麼好。韋伯希望他來往的操盤手都是當紅炸子雞，而他顯然認為我夠紅，這也是我很希望能參加這個餐會的主要原因。經過和投資人長達一個月的艱苦溝通後，我很想找個機會到那種高手雲集的場合去和別的操盤手打打交道。


    韋伯在魯提斯的樓上保留了一個隱密的房間。當我走進那裡時，可以看到在場有許多市場中的後起之秀。朱利安·羅勃森（Julian Robertson）正和史坦利·朱肯米勒（Stanley
    Druckenmiller）談話。羅勃森是安靜又謙遜的南方人，他在１９８１年離開奇德與皮博迪公司後，在四十七歲創立了一個只有八百萬美元規模的基金，而現在他操作的基金規模已經超過十億美元了。朱肯米勒是索羅斯的左右手，而奧德西合夥基金（Odyssey
    Partners）的里昂·李維（Lion Levy）正加入他們的談話。


    韋伯上前來歡迎我。「馬丁真高興看到你。來，跟我去見見幾個客戶。」客戶的名字對我來說一點意義也沒有。在沙伯林納海外基金之中，我的客戶就是一堆位於百慕達、巴哈馬、瑞士、開曼群島和其他免稅天堂的銀行帳戶號碼。當我走到房間的另一頭時，韋伯向我解釋客戶們正在進行一種創新式的生意，並已經從中賺取巨額利潤。「馬丁，告訴他們，你的基金操作得很棒，真的很棒。」韋伯在我身旁輕聲說著。


    等到真的可以坐下來的時候，我被安排坐在菲奧娜·畢格斯·朱肯米勒（Fiona Biggs Duckett）的旁邊。由於我是這個交際圈的新人，對這些人並不是很熟悉，但是在用餐當中，我知道菲奧娜不但是朱肯米勒的太太，也是巴爾頓·畢格斯（Baron
    Biggs，嗎根斯坦利公司首席策略分析師）的姪女。她和斯坦利是在他們任職於德瑞弗斯（Driftet）公司時認識的，在我們的談話中，我發現菲奧娜顯然很懂得怎麼和這些高手打交道。


    這場餐會比起先前商品公司的操盤手餐會要有意思得多，甚至比在謝克那個位於查理一世別墅裡的聚會還要棒。在那兩個餐會中，會場中的大咖很多，但在這個餐會中，我卻是少數的菁英人士之一。整個晚餐當中，我不斷對自己說：「這裡是真正屬於我的地方，這裡是我真正想到的地方，這是我想要為別人操作用金的原因。」但是，整個用餐期間，另一個細小的聲音卻也在耳邊沒間斷過：「馬丁，除非你今年能夠反敗為勝，否則明年你會在麥當勞和魏斯曼一起吃晚餐。」


    # 想繼續待在領先群，就要改變策略！


    午夜過後我才回到家，累得要命卻沒法人睡。我的思緒飛騰。


    如果我繼續待在市場高手的陣營裡，必須做些重大改變。羅勃森、朱肯米勒、李維、鐘斯、考夫納、貝肯、索羅斯都是市場高手，我能夠和他們任何一個人平起平坐，我的基金規模可以和他們的一樣大、甚至超越他們。我得多賺點錢，我需要改善操作績效。


    第二天早上，我告訴我的交易助理愛麗森．布朗（Allison Brown）：「幫我每天賣出一萬五千股」。包袱還在我身上，我鐵定沒有辦法達成投資人期望的報酬率。如果我以每天二萬五千股的幅度來調節掉這個部位，我想不會把普強的股價打壓得太嚴重，此外，如果這家瑞士藥廠真的開始購併行動，我還是有機會享有部位的漲幅。內線史基尼不停告訴我：『這事馬上就要宣布了，馬丁，不買賣掉那些股票。我知道這的確是拖得久了這一點，但這些事不是都會一直拖得比較久嗎？』


    接著，我坐下來為十一月一日要寄給投資人的信打草稿。如果他們希望我操作的是期貨基金，我就幫他們把基金轉型為期貨基金，我在信中寫道：


    展望一九九一年的發展計畫，我已經決定要為沙柏林納基金進行幾項改變。首先，同時也是最重 要 的 ， 就 是 將 基 金 在 期 貨 市 場 及 股 票 市 場
    的 投 資 分 配 比 例 ， 分 別 由 一 九 九 ○ 年 的 二 五 % 比 七 五 % 改 變 為 五 ○ % 比 五 ○ % 。 我 們 有 幾
    個 理 由 做 這 項 改 變 ： 其 一 ， 我 們 今 年 的 獲 利 絕 大 多 數 來 自 於 期 貨 交 易 ， 我 們 以 一 六 五 ○ 萬
    美 元 的 投 入 資 金 賺 得 了 一 二 二 ○ 萬 美 元 的 獲 利 ， 相 當 於 六 一．八 % 的 報 酬 率 。 其 二 ， 是 來 自
    許 多 基 金 投 資 人 的 要 求 ， 他 們 希 望 投 資 有 更 高 的 波 動 性 ， 並 且 願 意 承 受 隨 之 而 來 的 風 險 ，
    以 追 求 更 高 的 潛 在 獲 利 。


    第二個重要的改變是由於經濟環境的快速變動，投資人只要支付一％的帳務費用，就可以在年中抽回投入的資金。


    第三個重要的改變是一個「到價出場」的運作模式，一旦基金的操作產生年初資金總額三五%的虧損時，基金將自動停止運作。


    我有計畫地出清所持有的普通股股票部位，並將投入期貨和股票市場的比例加以調整。我已經準備好，全心投入接下來兩個月的交易了。


    # 投資就是投資，別談感情


    尼爾·魏斯曼是我最好的朋友之一，我第一次和尼爾見面可以回溯到一九七二年我到金宇塔工作的那個時候。魏斯曼是金宇塔公司的股票經紀人，總喜歡到處蒐集一大堆資訊，也一直都試著和市場裡的好手打交道，我在公司是負責熱門產業的新進人員，所以他很自然地就和我成為朋友。


    認識魏斯曼，是我在金宇塔公司的工作經驗中唯一對我有幫助的事。當我在排隊領失業救濟金，而華爾街沒有一個人願意給我工作时，魏斯曼為我打電話給傑瑞·法柏（Gary
    Taffa）。


    法柏是金宇塔公司的前任分析師，當時他正擔任愛德華與韓利公司的研究部主管。魏斯曼告訴法柏我被人惡整的事，並向祂極力推薦我。感謝魏斯曼，法柏真的雇用了我，我也因而認識了佐爾納。多虧了魏斯曼，把我從人生最嚴重的低潮中拉了出來，並且再度回到了市場。


    一八六六年初天，我終於有機會報答他。魏斯曼是一個很棒的操盤手，也一直都想成立自己操作的基金，但需要有人幫他一把，所以我就對他說：「我把我和奧黛莉的退休基金都交給你，你放手幫我操作這筆錢吧！」


    這筆錢的總額大約有七十五萬美元。以這筆錢作為基礎，魏斯曼募集到了另外的一千二百萬美元，這已經足夠讓他開始操作他的基金了。他在基金募集完畢後，很高興地在1967年的第一個月，動身前往加勒比海的一個遙遠小島度假，並在這一年的前五個交易中完全斷絕了和市場的聯繫。在這幾天當中，市場突然狂飆上漲，而魏斯曼卻完全沒有掌握到這次機會。當我們在二月中一起參加某個晚餐聚會時，市場已經上漲了20％，魏斯曼的基金報酬率卻只有九％，所以我對他說：「魏斯曼，你在搞什麼東西？怎麼會在新年一開盤的時候跑去度假？你完全沒有把握到這次的漲勢。我真不敢相信我竟然把錢交給你操作。如果我能夠把錢抽回來，一定馬上這麼做！」這就是我對魏斯曼，這個把我從人生低潮中拉出來，而且剛剛才開始操作他第一個基金的好朋友所說的話。


    魏斯曼或許可以對我說：「去你的！馬丁，我不需要你的錢，拿走你的臭錢然後滾蛋。」但是他沒有這麼做，因為他知道市場的規矩。身為一個成功的生意人，不論你是操盤手、投資人、企業家或是其他什麼身分，絕不能讓友誼或家族關係介入你和金錢相關的重要決策。魏斯曼當時給我的回答是：「馬丁，如果你想的話，可以狠狠揍我一頓，因為沒有人能比我給自己更大的壓力。」魏斯曼回去後努力操作，在那年創造了七五%的優秀績效。


    在接下來的三年當中，他把我投入的資金增加為原來的三倍。到了一九九四年，他的基金已經成長為五億美元的規模。我現在仍有一些資金放在他的基金裡，但我們兩個人都很清楚，如果我在別的地方能夠找到更高的報酬率，我會毫不考慮地和魏斯曼說拜拜。這無關任何私人恩怨，只不過是這個市場的遊戲規則罷了！


