    到了晚上九點零五分，當CBOT公債期貨的盤後交易時段結束時，我已經做了整整兩個半小時的交易，並且買進了總共五百口的公債期貨契約。我查看報價機裡的即時新聞。我們的科技真是派上了大用場，我們的部隊把伊拉克殺得落花流水，就像我在債券期貨市場痛宰空頭一樣的戰果燦煌。這場戰爭在它開始之前，就已經勝負分明了。


    # 贏得勝利之前，是沒有資格休息的


    奧黛莉拿著三明治和茶走進房間。「馬丁，今天如何？」


    「太棒了！我完全抓到今天的行情。我沒有可以在海外交易的帳戶，所以沒辦法作空原油和黃金，但是我在債券市場大有斬獲。'','
