- raw:
  - '[PAGE 240]


    六月中旬，我正式開始為商品公司操盤。但我很快就感到不對勁：擁有如此龐大的資金，迫使我必須改變操作風格，以及時持有很短的時間。


    如果我在操作自己的部位時犯了任何錯誤，會馬上斬平並實現虧損，但是當我持有意大利以百計的契約部位時，我就會傾向等待更長時間、並給部位更久的觀察期。不幸的是，如果我犯了錯，這其中造成的損失將高達數十萬美元，甚至數百萬美元，而我必須重新開始，努力把賠掉的錢賺回來。


    此外，我不喜歡別人仔細檢查我的操作績效。當我虧損的是自己的錢時，只要接受賠錢的事實，然後繼續操作就可以了，可是當我賠的是別人的錢，就覺得好像全世界的人都在盯著我的虧損看。


    我為商品公司做了幾筆小額交易後，就幾乎沒有為他們的帳戶做任何交易了。有一天下午，我接到一通威瑪打來的電話，他在丹佛機場準備前往亞斯本中心度假的路上。「嗨，馬丁，」他說：


    「怎麼搞的？你都沒有為我們做一筆交易。」


    「我試過用你們的資金做交易了，但是我得用一種不同的風格來操作，我得持有更長期的部位，而我對於這一點感到不怎麼舒服。我一直都是一個短線操作者。」


    「你想太多了！就用你操作自有資金的方法來操作我們的帳戶就好了，」他說：「這才是我們請你來的原因啊！」威瑪接著和我講了一大堆有關他們對我有多大的期待、他們認為我是最棒的操盤手，以及透過共同合作我們可以賺多少錢之類的話。


    「好吧，」我說：「我會再幫你們試一次。」


    威瑪說的話正是我所需要的。在接下來的兩個月中，我為商品公司的帳戶賺進了七十萬美元。'
  - '[PAGE 241]


    我的表現，使我立刻成為商品公司的大紅人。在他們每半年一度的操盤手晚宴中，我覺得自己成了會場中的高手。考夫納正在發表高見：“在目前經濟情勢以及景氣循環中，利率理論告訴我，們近天期的期貨契約價格應該高於遠天期的期貨契約。”突然間，他停了下，看著窗外說：“那是什麼？”


    # 悄悄埋下石油市場的大地雷……


    會場內每個人都在商品公司超摩登大樓的大型玻璃窗移動。一架直升機正降落在大樓外的草坪上，機身上的燈光在傍晚的夜色中閃閃發亮。


    “那是鐘斯。”有人以恭敬的語氣說著。


    鐘斯到達會場了。我必須承認，鐘斯是一個重量級人物，不只因為他是一個偉大的操盤手，同時也因他是很會表現自己的人，一個斯文、外表好看又總是走在時代尖端的南方佬。


    鐘斯從一九八○年開始從事棉花期貨的交易，並從中賺到了數百萬美元，但是在這場商品公司半年一度的晚宴餐會之際，他最為人所知的事蹟是他在一九八七年的股市崩盤中，反讓自己的資產增加了一倍。鐘斯喜歡研究一套他稱之為類比式的數學模型，而他的技術圖形在一九八七年的十月份顯示出市場將會出現和一九二九年一樣的崩盤走勢。結果，他從十月十九日起一路放空，而當市場真的開始崩盤時，他更趁勢加碼放空來加深市場的崩跌。我從來都不相信鐘斯的那一套模型，尤'
  - '[PAGE 242]


    其是我們根本就沒有出現像一九二九年那樣的經濟大蕭條，而且經濟狀況也仍然不錯。但是鐘斯模型的確為他賺進了大把鈔票，所以人們都很崇拜他。


    鐘斯走到接待區，場面就像著名影星勞勃·瑞福走進會場一樣轟動。每個人都想湊到他身邊，他八面玲瓏的樣子和伊斯頓頗為相似，而精明幹練的模樣則和威瑪不相上下。當然，他可不是专程來吃頓晚餐的，他是要搭直升機回去契莎皮克灣（Chesapeake
    Bay）那幢占地三千畝的豪宅，經過這裡順道進來致意罷了。鐘斯可不需要向這個會場裡的任何一個人假以辭色，他的財力足以買下這整座大廈。


    到了準七點半，當鐘斯的直升機起程飛向夜空後，伊斯頓請我們進入商品公司的餐廳。我不想坐在一些言語乏味的人旁邊，所以就抓著路易士·貝肯（Louis Bacon）不放。貝肯和丹尼在席爾斯是同一間辦公室的同事，但他在當時並不是什麼知名人士。如果那時我夠聰明的話，就該馬上雇用貝肯，讓我幫我分擔部分資金的操作工作，可是貝肯和鐘斯一樣，是來自美國南方的男孩，而我对這些南方佬可是一點都不了解。雖然鐘斯非常成功，但我還是直覺地認為他們說話慢、思考也很慢。


    我萬萬沒想到在接下來的五年中，貝肯的獲利竟然凌駕於我九倍以上。如果我當時就雇用他，他現在已經幫我賺進幾百萬了。


    伊斯頓舉起了杯子。「威瑪和我誠摯地歡迎諸位蒞臨晚宴，」他宣布著：「感謝諸位傑出的工作表現，使我們擁有另一個豐收的年度。」伊斯頓接著說我們是一個多麼優秀的團隊、如何在本市場中扮演主流的角色，以及我們如何利用電腦交易系統成功地預測市場走勢，並成為佼佼者。「你們'
  - '[PAGE 243]


    是世界上最棒、操作規模最大的團隊。』他在結論中說：『根據我的統計，國內商品交易市場有一半以上的資金是由這個屋子裡的人所操作的。』這真是令人印象深刻。我懷疑有沒有其他的產業，可以像今天的晚宴這樣把五○%的參與者齊聚一堂。


    伊斯坦說完，我們享受了一頓美餐，其中包括：塞滿了魚子醬的雞蛋、大蒜奶油焗生蠔、鹿肉排……。穿著燕尾服的侍者不停地在我們的杯中加滿最高級的法國葡萄酒。當巧克力甜點送上來的時候，伊斯坦再度起身並舉起酒杯。『這是商品公司在每次餐會中的傳統，』他說：『每個人都有機會發表演說，並告訴我們他對自己所專精的市場最近有什麼看法。』就這樣，他開始依照某次向每個人詢問他們對不同商品市場的看法，其中包括貨幣、穀物、糖、豬腩、牲口、黃金、白銀、精銅、歐洲美元、國庫券、長期政府公債以及股價指數期貨等等。每個操盤手依序作答。


    商品公司從事一百三十五種商品交易，照這個情況看來，我們好像真的得把所有市場的狀況都聽一遍。


    終於，輪到油晶期貨的操盤手發表意見了。我覺得這個話題應該會很有趣，因為石油價格在最近呈現崩跌的走勢。原油價格目前大約在每桶十二．五美元，這是自石油輸出國組織（OPEC）成立後所出現的最低油價，而更有趣的是，沒有人想得出來油價到底為什麼下跌。市場上有些投機客謠傳可能是中情局向沙烏地阿拉伯施壓，造成石油過量供給以幫助美國平衡國際收支帳，或是藉此來扯俄羅斯、伊朗或伊拉克的後腿。誰曉得事情是不是真的這樣？


    談到原油市場，伊斯坦點名某個從德州來的牛仔發表高見。在我看來，這傢伙就像電影裡典型'
  - '[PAGE 244]


    西部牛仔──穿著高統馬靴和裝飾著小金屬片的絲質襯衫，釦子扣得很低，胸前敞開，一條斤兩十足的金項鍊掛在脖子上。他那滿是橫肉的臉漲得血紅，還不停冒汗。「我不是很清楚，」他吞吞吐吐地說：「過去六個月以來，西德州原油的價格已經每桶跌了六美元。我想告訴各位的是，那些油井還是一直不停地在大量抽取原油。但是我想在六個月內，情況應該能夠得到改善。」


    「謝謝你，」伊斯頓說：「現在讓我們聽一聽目前歐洲市場發生了什麼事。」他叫起了一個外表整潔、個子矮小的法國人。這個傢伙很瘦而且形容枯槁，穿著手工訂製的藍色西裝、襯衫配上名牌領帶。「在未來的五年中，」皮耶·列佛利特（Pierre
    Riveliere）輕聲地哼著：「歐洲的石油供應將會遠高於需求。」


    當皮耶說完後，威瑪突然出乎意料之外地叫我。「我們很幸運，馬丁·舒華茲先生也參加了今天的晚宴。」他說：「馬丁是新加入商品公司的操盤手，是我們操作績效最好的操盤手之一。馬丁，你對剛剛所聽到的有什麼看法？」


    我輕輕地喘了一口氣。我並不時常從事原油期貨的交易，但我想這對我来说會是為市場製造一些高潮的好機會，我是新人，現在該是展現本領的時候了。「威瑪，」我說：「非常感謝你邀請我參加這個餐會，但我的看法可能和前面幾位不同。我一點也不清楚在未來五年內，歐洲地區的原油供給是不是真的高於需求，也不知道未來的六個月內，西德州原油的價格會跑到什麼價位，基本上，我對這些事根本不在乎。我是一個每天以市價評估損益的操盤手，只想知道明天市場的價格會到哪裡，而且我得告訴各位，今天當我離開辦公室前在補畫我的技術圖、檢查技術指標以及計算各'
  - '[PAGE 245]


    項比率時，原油的價格在我的移動平均線之上。至少以我目前的觀察，原油的價格正處於一個向上的格局中。


    # 失火啦！失火啦！汪！


    這場餐會直到晚上十一點才結束，我回到家已經累得沒法再檢查一遍技術圖了。第二天，我就為此付出了代價。


    我一直站在和市場走勢不對盤的那一邊，這讓我感到非常疲倦。上午過了一半時，電話響起，是席爾森的丹尼打來的。「馬丁，」他說：「你看到石油的價格了嗎？簡直是太瘋狂了。」我把原油的價格叫到我的報價螢幕上。一九八八年十二月的原油期貨價格在十三美元一桶，而且正向上攀升。跳到十三．一○，又跳到十三．一五。


    「哼！真是令人難以置信。」我說：「我們昨天晚上在商品公司的晚宴餐會上才剛談到原油呢！我說原油價格會漲，但只不過是隨便說說而已。」


    我完全忘掉了原油市場的事，繼續專心於自己的操作。當天我在S＆P期指上面輸了一筆錢。第二天，丹尼又打電話給我。「馬丁，」他說：「你看到原油價格了嗎？一定是謝克·阿曼尼（Sheik
    Yaranit·沙烏地阿拉伯的石油部長）命令石油輸出國組織關閉了一些油井，或是發生了其他什麼事。油價簡直是直線上升！」我把原油期貨的價格叫到報價螢幕上，原油價格跳到十四．三'
  - '[PAGE 246]


    ○，又跳到十四、三五。


    當油價在次日飆漲到每桶十五美元時，我才終於明白事情是怎麼一回事。真正把原油價格在三天內拉升二○％的人不是阿曼尼，而是一個來自紐海文的小子——馬丁．舒華茲！這件事情我早該想到，如果全國五○％的期貨基金操盤手在同一時刻齊聚一堂，其中大部分是原油期貨市場的老手，而他們大部分都持有空頭部位，當我在會場中提到技術圖形顯示原油價格正處於上升格局當中時，無異在一個擁擠的房間中向人群大喊「失火啦！」，現在這些傢伙正手忙腳亂地試著補回他們的部位。


    我真想踢自己一腳。到底那個說話慢條斯理的鐘斯、長袖善舞的考夫納或是緊抱著礦泉水不放的馬可斯，在接到我傳達的訊息後做了什麼動作？我確信他們一定不花三天就把情況想通，他們很可能早就已經大展身手，作多原油期貨，加入原本就很強勢的價格走勢中，並賺取數以百萬計利潤了。這就是我們這些訓練有素的獵犬的作風，而這也正是我應該採取的做法：汪！汪！汪！


    # 第貳堂課 每天用十分鐘讀《華爾街日報》


    《華爾街日報》是一份自一八八九年由道瓊斯公司發行，並在日後成為金融刊物方面佼'
  - '[PAGE 247]


    俊者的報紙。每個市場玩家都必須每天閱讀，以獲取最新的金融市場資訊。


    我通常都只「瀏覽」，而非真的「閱讀」。小時候，我習慣在星期一大早起床後和哥哥偉瑞爭奪著《紐約時報》體育版。我會把報紙拿來看看個二十分鐘再給他；他則會拿一些報紙上的內容來考我，像是球賽的比分、球員的平均打擊率、誰可能是今天比賽的先發投手等，而他從來未曾難倒過我。


    如果你想成為一個成功的操盤手，就得學著用這種方式來閱讀《華爾街日報》。那裡面有這麼多的資訊，你只能訓練自己用瀏覽的方式在短時間內加以吸收。


    我通常會在每天早上查對完每個戶頭的餘額後，趕在八點二十分債券開盤前翻一翻《華爾街日報》。我會直接看第一頁的第二個專欄「市場要聞」（Market News），拿著筆和速記簿把每一件我認為有趣的東西記下來。


    每一件我寫下來的東西都會存檔以備未來參考。在陸戰隊裡，一個有責任感的好軍官會隨時保持大量的紀錄備查。


    然後我會瞄一眼最右下角那一欄的「頭條新聞」內容。我在高中和大學時都是學校刊物體育版的主編，所以我習慣性只瀏覽新聞標題，而且只閱讀極少的內容。我沒有那麼多時間。我從《華爾街日報》的首頁裡，只想培養一些對今天市場脈動的感覺而已。


    接下來我會直接翻到「金錢與投資」，這是所有市場資料彙集的地方。我會看「與市場同'
  - '[PAGE 248]


    「師」專欄，這裡提供了前一天股票市場中發生的所有點點滴滴，以及來自不同經紀商、分析師、基金經理人以及其他華爾街專業人士的評論。我會仔細查看自己所注意的約七十檔股票是否在這個專欄中被提及，如果有的話，再看看別人用什麼觀點來評論我選的股票。然後再翻到「華爾街耳語」，這個單元通常會介紹某個產業、公司，或是個人，在其中可以發現一些有趣的內線報導。不過這些消息常常都是我在兩、三天前就已經從內線史基尼「我的「謠（言）指（揮）」部」那裡聽過了。


    在確認完內線史基尼在華爾街還算是消息靈通之後，我會查閱索引，然後翻到「上市股票選擇權收盤價」來感覺一下買權和賣權在市場的成交狀況。我想由此知道前一天選擇權市場中的動態，提供我今天進出場的指標。當賣權／買權比率連續二或三天高達一○○%時，對我而言就是一個買進訊號。當這項指標低於五○%時，表示市場已經太過樂觀，而使我開始考慮作空。我會把這項指標記錄在我的速記簿中，全部白紙黑字地寫下來。


    在「金錢與投資」這個單元中，還有另一項我很喜歡看的指標就是「紐約證交所新高／新低股票名單」，在這個表中列下了所有在前一個交易日裡，創下最近十二個月以來新高和新低的股票，這些股票總是依字母順序，排列在四個同樣大小的欄位中。一九七四年當我還在愛德華與韓利公司上班時，那裡有一位技術分析師約翰·布魯克斯（John
    Brooks）教我非常簡單而很有趣的指標，他告訴我：「馬丁，不管什麼時候，你拿一把尺放在新低或新股的欄位'
  - '[PAGE 249]


    中，如果發現其中任何一個名單的長度超過十二英寸時，就準備採用逆勢操作的策略吧！「一九七四年創下新低的股票名單長度超過十二英寸的那幾天，幾乎都是本世紀最佳的買點。到了一九八七年的黑色星期一來臨前，市場中創下新高的股票名單長度也已經超過十二英寸好幾次了，那可真是放空的絕佳時機。這是一個我從來沒有在其他地方看到或聽到過的小技巧，而且這種情況也實在很少發生，一旦真的出現時，把你的尺拿出來仔細量一量吧！

    當我查看完「紐約證交所新高／新低股票名單」後，就把目光轉到「債券專欄」，看看有什麼廣人對債券市場做怎樣的評論。就這樣我算是把「金錢與投資」這個單元看完了，然後我會把這個部分放在左邊的地板上。再回頭仔細搜尋一遍，找找看有沒有什麼針對最近經濟情勢和個別企業經營狀況的特別報導，看完後再把這個部分放在右邊的地板上。

    有時我會快速翻閱一下「市場動態」，那裡有一些我或許會感到興趣的較小型企業相關報導。不過對一個操盤手而言，這個單元很少有什麼值得研究的東西。

    我通常花不到十分鐘的時間來閱讀《華爾街日報》，但是在一大早起床後馬上花幾分鐘來瀏覽，卻能使我立刻對當天市場的脈動產生最原始的感覺，而其中一些指標也可以迅速地進入我當天對市況的思維中。在加入其他各種資訊後，我不用花更多時間去閱讀《華爾街日報》就能建立當天的操作邏輯。任何一個認真的操盤手，都不會花更少的時間來閱讀《華爾街日報》。'
  - '[PAGE 250]


    # 第13章


    # 一大筆錢湧進我的帳戶


    # 我創立自己的基金了


    艾爾德期貨公司（Eldes Futures Inc.）是一家期貨經紀商，它在商品公司舉行半年度操盤手晚宴之前的幾個月就開始和我協商。艾爾德公司希望我為他們操作一個總額二十億美元的基金，並提出最低基金管理費六%外加總獲利二〇%的優厚條件。這等於每月保障我有十萬美元的固定收入，再加上我為他們所賺金額的二〇%，而且我無須負擔任何風險。


    這筆買賣，比起商品公司開始給我的條件要好得多了。所以在一年八八年的第四季，我停止與商品公司合作，改為艾爾德公司操盤。不過，我還是覺得為別人操作資金是一件很不對勁的事。


    就像我在替商品公司操盤時所面臨的問題一樣，管理金額龐大的部位改變了我持有部位的時間長短，我會傾向持有虧錢的部位更久，期待有更多的時間可以拗回來。


    我和奧黛莉談起這個問題。「我就是不想替這些人操盤，他們每兩個小時就打電話問東問西的，嚴重'
  - '[PAGE 251]


    干擾我的操作。這或許是一筆很不錯的收入，但我希望保持操作方面的自主性。」


    沒有人能告訴我該怎麼辦，奧黛莉說我應該照自己的方式操作，我也仍然擁有操作的自主性。但到底問題出在哪呢？


    「我不喜歡那些傢伙成天在背後監視我的操作狀況，艾爾德公司擁有一大堆每個月匯進、匯出的國外資金，當這些資金抽出去時，艾爾德公司就會把其他資金轉過來，但每次有這樣的情況出現時，我就會覺得自己被投資人否定了，覺得好像自己沒把工作做好似的。」


    「他們一天到晚不停打電話給我，這應該是一年才發生一次的事才對，现在我得每天應付他們。我不喜歡任何人懷疑我，我希望擁有自己作主的自由，這也是為什麼我會出來創業啊。」


    「那你為什麼要幫他們操作這筆錢？」奧黛莉問：「你光是操作自己的帳戶就賺了那麼多錢了，幹嘛還要幫別人操作？」


    「我想多賺數以千萬計的錢啊！我要當市場上最大也最棒的操盤人，而要達到這個目標，就需要別人拿錢出來。」


    「那……」奧黛莉說：「你乾脆成立自己的基金算了！訂自己的規矩、投入自己的資金，然後當自己的老闆。自己控制部位的持有期間，每個月只需要照主管機關的要求發行一次公報。你不會有任何內心衝突，沒有人會來打擾你，也不會再那麼多問題了。」


    於是，一九八九年初，我停止為艾爾德公司操盤，並告訴那個專精於設立避險基金相關事宜的修華與柯塞爾（Steuer & Kaiser）律師事務所的約翰．塔維斯（John
    Tavis），我要開始計畫自己的'
  - '[PAGE 252]


    基金創設作業。


    回想起從一九七九年開始在AMEX為自己的帳戶操作以來，我沒有一年產生虧損。我連續五十五個月保持無虧損的操作績效，在家裡設立了一個辦公室，得到我夢寐以求的一切——完全的自主性。那麼，為什麼我還需要操作其他人的錢？然後我想起前面提到的操盤手餐會中，在馬可斯和考夫納這些人面前昂首闊步的感覺，以及鍾斯在會場中打個照面後，就搭私人直升機前往度假別墅的情景。


    我總是喜歡和那些市場上的能手比個高下，要達到這個目的，我就需要別人的資金。


    # 花很多錢，哼，誰怕誰？


    六月，孩子們開始放暑假後，我們到亞斯本度了一個假。


    我從來沒有去過亞斯本，但亞斯本是威瑪和其他大人物們最常去充電的地方，所以我怎麼可以沒去過？在距離紐約市和金融市場兩千英里外的地方享受清新、乾淨的山間空氣，使我有機會重新思考一些問題。我曾花了九年半的時間當一個證券分析師，又花了九年的時間從事操作，並且創造了自己作夢也想不到的成就。現在，我必須決定自己是否要再向前邁進一大步。


    每天早晨我會走出位於山腳的度假小屋，跳上我的吉普車，把帆布頂篷放下來，呼吸著新鮮的山間空氣，然後像一個牛仔似的開車到亞斯本市區買一份《華爾街日報》。經過機場時，我可以看'
  - '[PAGE 253]


    見停機坪上停放著屬於電影明星、大企業家的豪華私人飛機。我希望加入他們的行列，而為了達到這個目標，我需要別人的資金。


    回到紐約後，我所做的第一件事，就是去租一間我所能找到的最大、最豪華的辦公室。這個辦公室位於雷克辛頓街七五〇號一幢新建大廈的頂樓，能夠以完美的角度俯瞰中央公園。


    租金可不便宜，但那又怎樣？我簽下了為期三年的租約，以每月一萬二千五百美元的價格租下了這個占地三千平方英尺的辦公室，等於一年十五萬美元的租金，那又怎樣？這和將我賺錢的大把鈔票比起來，可說微不足道。我讓奧黛莉挑選辦公室具，她選了一些具有後印象派主題、強調立體派畫風，並且隱含後巴洛克時期風格的作品。而這些總共花了我七萬五千美元，那又算得了什麼？我們得要把辦公室弄得好看些，而我總是想像自己坐在豪華的辦公室裡把腳蹠在辦公桌上。


    我的朋友，佛雷斯哥與柏雷特畫廊的兩位老闆，借給我一系列的現代藝術作品。走進我的新辦公室就像走進古根漢藝術館一樣。我另外又花了三萬美元買進最先進的電腦設備和電話系統，這又算得了什麼？所有的東西都得是最好的我才要。然後我又在外面僱用了兩個新員工，付每人每個月二萬美元的薪水，這可是一大筆錢，但是又怎樣？只要在我手底下做事，他們很快就會變成明日之星。到了那年夏天快結束時，我的感覺和外表也開始像個場上的高手了。現在我需要去找一些願意付高價給我的有錢投資人。


    事實上，我需要兩組投資人，一組投資在我的國內基金，另外一組則投資在我的海外基金。市場上的高手都擁有兩種基金，而我也很想趕快變成大玩家。兩種基金代表多兩倍的資金。'
  md: '

    ## 六月中旬，我正式開始為商品公司操盤


    但我很快就感到不對勁：擁有如此龐大的資金，迫使我必須改變操作風格，以及及時持有很短的時間。


    如果我在操作自己的部位時犯了任何錯誤，會馬上斬平並實現虧損，但是當我持有意大利以百計的契約部位時，我就會傾向等待更長時間、並給部位更久的觀察期。不幸的是，如果我犯了錯，這其中造成的損失將高達數十萬美元，甚至數百萬美元，而我必須重新開始，努力把賠掉的錢賺回來。


    此外，我不喜歡別人仔細檢查我的操作績效。當我虧損的是自己的錢時，只要接受賠錢的事實，然後繼續操作就可以了，可是當我賠的是別人的錢，就覺得好像全世界的人都在盯著我的虧損看。


    我為商品公司做了幾筆小額交易後，就幾乎沒有為他們的帳戶做任何交易了。有一天下午，我接到一通威瑪打來的電話，他在丹佛機場準備前往亞斯本中心度假的路上。


    「嗨，馬丁，」他說：「怎麼搞的？你都沒有為我們做一筆交易。」


    「我試過用你們的資金做交易了，但是我得用一種不同的風格來操作，我得持有更長期的部位，而我對於這一點感到不怎麼舒服。我一直都是一個短線操作者。」


    「你想太多了！就用你操作自有資金的方法來操作我們的帳戶就好了，」他說：「這才是我們請你來的原因啊！」威瑪接著和我講了一大堆有關他們對我有多大的期待、他們認為我是最棒的操盤手，以及透過共同合作我們可以賺多少錢之類的話。


    「好吧，」我說：「我會再幫你們試一次。」


    威瑪說的話正是我所需要的。在接下來的兩個月中，我為商品公司的帳戶賺進了七十萬美元。


    ## 我的表現，使我立刻成為商品公司的大紅人


    在他們每半年一度的操盤手晚宴中，我覺得自己成了會場中的高手。考夫納正在發表高見：「在目前經濟情勢以及景氣循環中，利率理論告訴我，短天期的期貨契約價格應該高於長天期的期貨契約。」突然間，他停了下，看著窗外說：「那是什麼？」


    ### 悄悄埋下石油市場的大地雷……


    會場內每個人都在商品公司超摩登大樓的大型玻璃窗移動。一架直升機正降落在大樓外的草坪上，機身上的燈光在傍晚的夜色中閃閃發亮。


    「那是鐘斯。」有人以恭敬的語氣說著。


    鐘斯到達會場了。我必須承認，鐘斯是一個重量級人物，不只因為他是一個偉大的操盤手，同時也因他是很會表現自己的人，一個斯文、外表好看又總是走在時代尖端的南方佬。


    鐘斯從一九八○年開始從事棉花期貨的交易，並從中賺到了數百萬美元，但是在這場商品公司半年一度的晚宴餐會之際，他最為人所知的事蹟是他在一九八七年的股市崩盤中，反讓自己的資產增加了一倍。鐘斯喜歡研究一套他稱之為類比式的數學模型，而他的技術圖形在一九八七年的十月份顯示出市場將會出現和一九二九年一樣的崩盤走勢。結果，他從十月十九日起一路放空，而當市場真的開始崩盤時，他更趁勢加碼放空來加深市場的崩跌。我從來都不相信鐘斯的那一套模型，尤其是我們根本就沒有出現像一九二九年那樣的經濟大蕭條，而且經濟狀況也仍然不錯。但是鐘斯模型的確為他賺進了大把鈔票，所以人們都很崇拜他。


    鐘斯走到接待區，場面就像著名影星勞勃·瑞福走進會場一樣轟動。每個人都想湊到他身邊，他八面玲瓏的樣子和伊斯頓頗為相似，而精明幹練的模樣則和威瑪不相上下。當然，他可不是专程來吃頓晚餐的，他是要搭直升機回去契莎皮克灣（Chesapeake
    Bay）那幢占地三千畝的豪宅，經過這裡順道進來致意罷了。鐘斯可不需要向這個會場裡的任何一個人假以辭色，他的財力足以買下這整座大廈。


    到了準七點半，當鐘斯的直升機起程飛向夜空後，伊斯頓請我們進入商品公司的餐廳。我不想坐在一些言語乏味的人旁邊，所以就抓著路易士·貝肯（Louis Bacon）不放。貝肯和丹尼在席爾斯是同一間辦公室的同事，但他在當時並不是什麼知名人士。如果那時我夠聰明的話，就該馬上雇用貝肯，讓我幫我分擔部分資金的操作工作，可是貝肯和鐘斯一樣，是來自美國南方的男孩，而我对這些南方佬可是一點都不了解。雖然鐘斯非常成功，但我還是直覺地認為他們說話慢、思考也很慢。


    我萬萬沒想到在接下來的五年中，貝肯的獲利竟然凌駕於我九倍以上。如果我當時就雇用他，他現在已經幫我賺進幾百萬了。


    伊斯頓舉起了杯子。「威瑪和我誠摯地歡迎諸位蒞臨晚宴，」他宣布著：「感謝諸位傑出的工作表現，使我們擁有另一個豐收的年度。」伊斯頓接著說我們是一個多麼優秀的團隊、如何在本市場中扮演主流的角色，以及我們如何利用電腦交易系統成功地預測市場走勢，並成為佼佼者。「你們是世界上最棒、操作規模最大的團隊。」他在結論中說：「根據我的統計，國內商品交易市場有一半以上的資金是由這個屋子裡的人所操作的。」這真是令人印象深刻。我懷疑有沒有其他的產業，可以像今天的晚宴這樣把五○%的參與者齊聚一堂。


    伊斯坦說完，我們享受了一頓美餐，其中包括：塞滿了魚子醬的雞蛋、大蒜奶油焗生蠔、鹿肉排……。穿著燕尾服的侍者不停地在我們的杯中加滿最高級的法國葡萄酒。當巧克力甜點送上來的時候，伊斯坦再度起身並舉起酒杯。「這是商品公司在每次餐會中的傳統，」他說：「每個人都有機會發表演說，並告訴我們他對自己所專精的市場最近有什麼看法。」就這樣，他開始依照某次向每個人詢問他們對不同商品市場的看法，其中包括貨幣、穀物、糖、豬腩、牲口、黃金、白銀、精銅、歐洲美元、國庫券、長期政府公債以及股價指數期貨等等。每個操盤手依序作答。


    商品公司從事一百三十五種商品交易，照這個情況看來，我們好像真的得把所有市場的狀況都聽一遍。


    終於，輪到油晶期貨的操盤手發表意見了。我覺得這個話題應該會很有趣，因為石油價格在最近呈現崩跌的走勢。原油價格目前大約在每桶十二．五美元，這是自石油輸出國組織（OPEC）成立後所出現的最低油價，而更有趣的是，沒有人想得出來油價到底為什麼下跌。市場上有些投機客謠傳可能是中情局向沙烏地阿拉伯施壓，造成石油過量供給以幫助美國平衡國際收支帳，或是藉此來扯俄羅斯、伊朗或伊拉克的後腿。誰曉得事情是不是真的這樣？


    談到原油市場，伊斯坦點名某個從德州來的牛仔發表高見。在我看來，這傢伙就像電影裡典型西部牛仔──穿著高統馬靴和裝飾著小金屬片的絲質襯衫，釦子扣得很低，胸前敞開，一條斤兩十足的金項鍊掛在脖子上。他那滿是橫肉的臉漲得血紅，還不停冒汗。「我不是很清楚，」他吞吞吐吐地說：「過去六個月以來，西德州原油的價格已經每桶跌了六美元。我想告訴各位的是，那些油井還是一直不停地在大量抽取原油。但是我想在六個月內，情況應該能夠得到改善。」


    「謝謝你，」伊斯頓說：「現在讓我們聽一聽目前歐洲市場發生了什麼事。」他叫起了一個外表整潔、個子矮小的法國人。這個傢伙很瘦而且形容枯槁，穿著手工訂製的藍色西裝、襯衫配上名牌領帶。「在未來的五年中，」皮耶·列佛利特（Pierre
    Riveliere）輕聲地哼著：「歐洲的石油供應將會遠高於需求。」


    當皮耶說完後，威瑪突然出乎意料之外地叫我。「我們很幸運，馬丁·舒華茲先生也參加了今天的晚宴。」他說：「馬丁是新加入商品公司的操盤手，是我們操作績效最好的操盤手之一。馬丁，你對剛剛所聽到的有什麼看法？」


    我輕輕地喘了一口氣。我並不時常從事原油期貨的交易，但我想這對我来说會是為市場製造一些高潮的好機會，我是新人，現在該是展現本領的時候了。「威瑪，」我說：「非常感謝你邀請我參加這個餐會，但我的看法可能和前面幾位不同。我一點也不清楚在未來五年內，歐洲地區的原油供給是不是真的高於需求，也不知道未來的六個月內，西德州原油的價格會跑到什麼價位，基本上，我對這些事根本不在乎。我是一個每天以市價評估損益的操盤手，只想知道明天市場的價格會到哪裡，而且我得告訴各位，今天當我離開辦公室前在補畫我的技術圖、檢查技術指標以及計算各項比率時，原油的價格在我的移動平均線之上。至少以我目前的觀察，原油的價格正處於一個向上的格局中。」


    ### 失火啦！失火啦！汪！


    這場餐會直到晚上十一點才結束，我回到家已經累得沒法再檢查一遍技術圖了。第二天，我就為此付出了代價。


    我一直站在和市場走勢不對盤的那一邊，這讓我感到非常疲倦。上午過了一半時，電話響起，是席爾森的丹尼打來的。「馬丁，」他說：「你看到石油的價格了嗎？簡直是太瘋狂了。」我把原油的價格叫到我的報價螢幕上。一九八八年十二月的原油期貨價格在十三美元一桶，而且正向上攀升。跳到十三．一○，又跳到十三．一五。


    「哼！真是令人難以置信。」我說：「我們昨天晚上在商品公司的晚宴餐會上才剛談到原油呢！我說原油價格會漲，但只不過是隨便說說而已。」


    我完全忘掉了原油市場的事，繼續專心於自己的操作。當天我在S＆P期指上面輸了一筆錢。第二天，丹尼又打電話給我。「馬丁，」他說：「你看到原油價格了嗎？一定是謝克·阿曼尼（Sheik
    Yaranit·沙烏地阿拉伯的石油部長）命令石油輸出國組織關閉了一些油井，或是發生了其他什麼事。油價簡直是直線上升！」我把原油期貨的價格叫到報價螢幕上，原油價格跳到十四．三○，又跳到十四、三五。


    當油價在次日飆漲到每桶十五美元時，我才終於明白事情是怎麼一回事。真正把原油價格在三天內拉升二○％的人不是阿曼尼，而是一個來自紐海文的小子——馬丁．舒華茲！這件事情我早該想到，如果全國五○％的期貨基金操盤手在同一時刻齊聚一堂，其中大部分是原油期貨市場的老手，而他們大部分都持有空頭部位，當我在會場中提到技術圖形顯示原油價格正處於上升格局當中時，無異在一個擁擠的房間中向人群大喊「失火啦！」，現在這些傢伙正手忙腳亂地試著補回他們的部位。


    我真想踢自己一腳。到底那個說話慢條斯理的鐘斯、長袖善舞的考夫納或是緊抱著礦泉水不放的馬可斯，在接到我傳達的訊息後做了什麼動作？我確信他們一定不花三天就把情況想通，他們很可能早就已經大展身手，作多原油期貨，加入原本就很強勢的價格走勢中，並賺取數以百萬計利潤了。這就是我們這些訓練有素的獵犬的作風，而這也正是我應該採取的做法：汪！汪！汪！


    ## 第貳堂課 每天用十分鐘讀《華爾街日報》


    《華爾街日報》是一份自一八八九年由道瓊斯公司發行，並在日後成為金融刊物方面佼者。每個市場玩家都必須每天閱讀，以獲取最新的金融市場資訊。


    我通常都只「瀏覽」，而非真的「閱讀」。小時候，我習慣在星期一大早起床後和哥哥偉瑞爭奪著《紐約時報》體育版。我會把報紙拿來看看個二十分鐘再給他；他則會拿一些報紙上的內容來考我，像是球賽的比分、球員的平均打擊率、誰可能是今天比賽的先發投手等，而他從來未曾難倒過我。


    如果你想成為一個成功的操盤手，就得學著用這種方式來閱讀《華爾街日報》。那裡面有這麼多的資訊，你只能訓練自己用瀏覽的方式在短時間內加以吸收。


    我通常會在每天早上查對完每個戶頭的餘額後，趕在八點二十分債券開盤前翻一翻《華爾街日報》。我會直接看第一頁的第二個專欄「市場要聞」（Market News），拿著筆和速記簿把每一件我認為有趣的東西記下來。


    每一件我寫下來的東西都會存檔以備未來參考。在陸戰隊裡，一個有責任感的好軍官會隨時保持大量的紀錄備查。


    然後我會瞄一眼最右下角那一欄的「頭條新聞」內容。我在高中和大學時都是學校刊物體育版的主編，所以我習慣性只瀏覽新聞標題，而且只閱讀極少的內容。我沒有那麼多時間。我從《華爾街日報》的首頁裡，只想培養一些對今天市場脈動的感覺而已。


    接下來我會直接翻到「金錢與投資」，這是所有市場資料彙集的地方。我會看「與市場同」專欄，這裡提供了前一天股票市場中發生的所有點點滴滴，以及來自不同經紀商、分析師、基金經理人以及其他華爾街專業人士的評論。我會仔細查看自己所注意的約七十檔股票是否在這個專欄中被提及，如果有的話，再看看別人用什麼觀點來評論我選的股票。然後再翻到「華爾街耳語」，這個單元通常會介紹某個產業、公司，或是個人，在其中可以發現一些有趣的內線報導。不過這些消息常常都是我在兩、三天前就已經從內線史基尼「我的「謠（言）指（揮）」部」那裡聽過了。


    在確認完內線史基尼在華爾街還算是消息靈通之後，我會查閱索引，然後翻到「上市股票選擇權收盤價」來感覺一下買權和賣權在市場的成交狀況。我想由此知道前一天選擇權市場中的動態，提供我今天進出場的指標。當賣權／買權比率連續二或三天高達一○○%時，對我而言就是一個買進訊號。當這項指標低於五○%時，表示市場已經太過樂觀，而使我開始考慮作空。我會把這項指標記錄在我的速記簿中，全部白紙黑字地寫下來。


    在「金錢與投資」這個單元中，還有另一項我很喜歡看的指標就是「紐約證交所新高／新低股票名單」，在這個表中列下了所有在前一個交易日裡，創下最近十二個月以來新高和新低的股票，這些股票總是依字母順序，排列在四個同樣大小的欄位中。一九七四年當我還在愛德華與韓利公司上班時，那裡有一位技術分析師約翰·布魯克斯（John
    Brooks）教我非常簡單而很有趣的指標，他告訴我：「馬丁，不管什麼時候，你拿一把尺放在新低或新股的欄位中，如果發現其中任何一個名單的長度超過十二英寸時，就準備採用逆勢操作的策略吧！」一九七四年創下新低的股票名單長度超過十二英寸的那幾天，幾乎都是本世紀最佳的買點。到了一九八七年的黑色星期一來臨前，市場中創下新高的股票名單長度也已經超過十二英寸好幾次了，那可真是放空的絕佳時機。這是一個我從來沒有在其他地方看到或聽到過的小技巧，而且這種情況也實在很少發生，一旦真的出現時，把你的尺拿出來仔細量一量吧！


    當我查看完「紐約證交所新高／新低股票名單」後，就把目光轉到「債券專欄」，看看有什麼廣人對債券市場做怎樣的評論。就這樣我算是把「金錢與投資」這個單元看完了，然後我會把這個部分放在左邊的地板上。再回頭仔細搜尋一遍，找找看有沒有什麼針對最近經濟情勢和個別企業經營狀況的特別報導，看完後再把這個部分放在右邊的地板上。


    有時我會快速翻閱一下「市場動態」，那裡有一些我或許會感到興趣的較小型企業相關報導。不過對一個操盤手而言，這個單元很少有什麼值得研究的東西。


    我通常花不到十分鐘的時間來閱讀《華爾街日報》，但是在一大早起床後馬上花幾分鐘來瀏覽，卻能使我立刻對當天市場的脈動產生最原始的感覺，而其中一些指標也可以迅速地進入我當天對市況的思維中。在加入其他各種資訊後，我不用花更多時間去閱讀《華爾街日報》就能建立當天的操作邏輯。任何一個認真的操盤手，都不會花更少的時間來閱讀《華爾街日報》。


    # 第13章


    ## 一大筆錢湧進我的帳戶


    ### 我創立自己的基金了


    艾爾德期貨公司（Eldes Futures Inc.）是一家期貨經紀商，它在商品公司舉行半年度操盤手晚宴之前的幾個月就開始和我協商。艾爾德公司希望我為他們操作一個總額二十億美元的基金，並提出最低基金管理費六%外加總獲利二〇%的優厚條件。這等於每月保障我有十萬美元的固定收入，再加上我為他們所賺金額的二〇%，而且我無須負擔任何風險。


    這筆買賣，比起商品公司開始給我的條件要好得多了。所以在一年八八年的第四季，我停止與商品公司合作，改為艾爾德公司操盤。不過，我還是覺得為別人操作資金是一件很不對勁的事。


    就像我在替商品公司操盤時所面臨的問題一樣，管理金額龐大的部位改變了我持有部位的時間長短，我會傾向持有虧錢的部位更久，期待有更多的時間可以拗回來。


    我和奧黛莉談起這個問題。「我就是不想替這些人操盤，他們每兩個小時就打電話問東問西的，嚴重干擾我的操作。這或許是一筆很不錯的收入，但我希望保持操作方面的自主性。」


    沒有人能告訴我該怎麼辦，奧黛莉說我應該照自己的方式操作，我也仍然擁有操作的自主性。但到底問題出在哪呢？


    「我不喜歡那些傢伙成天在背後監視我的操作狀況，艾爾德公司擁有一大堆每個月匯進、匯出的國外資金，當這些資金抽出去時，艾爾德公司就會把其他資金轉過來，但每次有這樣的情況出現時，我就會覺得自己被投資人否定了，覺得好像自己沒把工作做好似的。」


    「他們一天到晚不停打電話給我，這應該是一年才發生一次的事才對，现在我得每天應付他們。我不喜歡任何人懷疑我，我希望擁有自己作主的自由，這也是為什麼我會出來創業啊。」


    「那你為什麼要幫他們操作這筆錢？」奧黛莉問：「你光是操作自己的帳戶就賺了那麼多錢了，幹嘛還要幫別人操作？」


    「我想多賺數以千萬計的錢啊！我要當市場上最大也最棒的操盤人，而要達到這個目標，就需要別人拿錢出來。」


    「那……」奧黛莉說：「你乾脆成立自己的基金算了！訂自己的規矩、投入自己的資金，然後當自己的老闆。自己控制部位的持有期間，每個月只需要照主管機關的要求發行一次公報。你不會有任何內心衝突，沒有人會來打擾你，也不會再那麼多問題了。」


    於是，一九八九年初，我停止為艾爾德公司操盤，並告訴那個專精於設立避險基金相關事宜的修華與柯塞爾（Steuer & Kaiser）律師事務所的約翰．塔維斯（John
    Tavis），我要開始計畫自己的基金創設作業。


    回想起從一九七九年開始在AMEX為自己的帳戶操作以來，我沒有一年產生虧損。我連續五十五個月保持無虧損的操作績效，在家裡設立了一個辦公室，得到我夢寐以求的一切——完全的自主性。那麼，為什麼我還需要操作其他人的錢？然後我想起前面提到的操盤手餐會中，在馬可斯和考夫納這些人面前昂首闊步的感覺，以及鍾斯在會場中打個照面後，就搭私人直升機前往度假別墅的情景。


    我總是喜歡和那些市場上的能手比個高下，要達到這個目的，我就需要別人的資金。


    ### 花很多錢，哼，誰怕誰？


    六月，孩子們開始放暑假後，我們到亞斯本度了一個假。


    我從來沒有去過亞斯本，但亞斯本是威瑪和其他大人物們最常去充電的地方，所以我怎麼可以沒去過？在距離紐約市和金融市場兩千英里外的地方享受清新、乾淨的山間空氣，使我有機會重新思考一些問題。我曾花了九年半的時間當一個證券分析師，又花了九年的時間從事操作，並且創造了自己作夢也想不到的成就。現在，我必須決定自己是否要再向前邁進一大步。


    每天早晨我會走出位於山腳的度假小屋，跳上我的吉普車，把帆布頂篷放下來，呼吸著新鮮的山間空氣，然後像一個牛仔似的開車到亞斯本市區買一份《華爾街日報》。經過機場時，我可以看見停機坪上停放著屬於電影明星、大企業家的豪華私人飛機。我希望加入他們的行列，而為了達到這個目標，我需要別人的資金。


    回到紐約後，我所做的第一件事，就是去租一間我所能找到的最大、最豪華的辦公室。這個辦公室位於雷克辛頓街七五〇號一幢新建大廈的頂樓，能夠以完美的角度俯瞰中央公園。


    租金可不便宜，但那又怎樣？我簽下了為期三年的租約，以每月一萬二千五百美元的價格租下了這個占地三千平方英尺的辦公室，等於一年十五萬美元的租金，那又怎樣？這和將我賺錢的大把鈔票比起來，可說微不足道。我讓奧黛莉挑選辦公室具，她選了一些具有後印象派主題、強調立體派畫風，並且隱含後巴洛克時期風格的作品。而這些總共花了我七萬五千美元，那又算得了什麼？我們得要把辦公室弄得好看些，而我總是想像自己坐在豪華的辦公室裡把腳蹠在辦公桌上。


    我的朋友，佛雷斯哥與柏雷特畫廊的兩位老闆，借給我一系列的現代藝術作品。走進我的新辦公室就像走進古根漢藝術館一樣。我另外又花了三萬美元買進最先進的電腦設備和電話系統，這又算得了什麼？所有的東西都得是最好的我才要。然後我又在外面僱用了兩個新員工，付每人每個月二萬美元的薪水，這可是一大筆錢，但是又怎樣？只要在我手底下做事，他們很快就會變成明日之星。到了那年夏天快結束時，我的感覺和外表也開始像個場上的高手了。現在我需要去找一些願意付高價給我的有錢投資人。


    事實上，我需要兩組投資人，一組投資在我的國內基金，另外一組則投資在我的海外基金。市場上的高手都擁有兩種基金，而我也很想趕快變成大玩家。兩種基金代表多兩倍的資金。

