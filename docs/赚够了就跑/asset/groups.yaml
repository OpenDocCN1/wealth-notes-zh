    # 我如何操作股票


    這些年來，我發展出一些例行的工作方式。我在做事方面一向是屬於捲起袖子、苦幹實幹的那種人。我堅持每天親手繪製七十檔股票的技術圖，並在計算過各項資料後，親手更新及繪製大量技術指標，來實際看到和感覺到價格的變動狀況。這樣的工作方式要花掉我相當多的時間。


    每個週末，我會經由快遞收到兩本技術圖表。第一本是〈S&P股票趨勢線及每日動態圖集〉（Standard and Poor''s Trendline Daily
    Action Stock Charts），裡面有超過七百檔股票的日線圖，每張圖包含長達一年半的歷史資料。我會在其中超過一百五十檔比較強勢的股票走勢圖中，自行標出趨勢線和支撐價位區。我這麼做是想要去感覺一下哪一家公司或者哪一個產業目前表現比較好。在這本圖集的第一頁中我會寫下一些評語，比如「石油類股很強」、「大型高科技公司偏弱」等。即使目前許多操盤手都利用電腦來從事產業分析，我還是要親手做這些工作，以便真正感受到企業金錢流


    這個指標更實用，我建議在資料長度許可的狀況下往回推至少二十天，以使得計算出來的數值更為平滑可用。如此一來，它將有很短的時間內成為你從事交易時最可靠的工具。


    一般大概需要花上十天的時間，才能使我們所計算出來的指數移動平均值更為平滑。為了要讓'
  - '[PAGE 361]


    向的變動狀況。我也會寫下長約一頁的評論來描述我動手畫過線的公司，在它們的股票代碼旁寫下它們的支撐價位區。


    接下來我會繼續看第二本圖集，這本圖集是由證券市場研究公司（Security Market Research, SMR）為我做的，包含了我平常觀察的七十檔大型公司股價的日線圖和專有的振動指標，另外再加上道瓊工業股價指數、道瓊運輸類股指數（Dow
    Jones Transportation Averages Dilt）、標準普爾五百指數、紐約綜合股價指數，以及那斯達克股價指數的技術圖形。每三個月，我會把其中某些股票換成我目前最感興趣的個股，但基本上我的股票名單包括了足以代表所有產業特性的個股，主要都是大資本額且流通性極佳的個股，例如康柏克、可口可樂、默克及大通銀行等。


    在圖集的每一頁，我會為每檔股票畫上幾條支撐線和阻力線，並且查看線圖下方的振動指標。支撐線是由圖形上的幾個重要低點連接而成，它標明了一些特定的價位區，在股價下跌到那些價位區時可能會減緩跌勢或者出現反彈。壓力線則是由圖形上的幾個重要高點連接而成，當股價上漲至它所標明出的價位區時很可能會止升回跌。由於我是短線操盤手，所以也會使用前一週或兩週的高點和低點來當作較具攻擊性的趨勢線。我會將圖形中近期主要支撐區的價位圈起來，然後把這些價位區記錄在一個長約一頁的紙上，就寫在該股的股票代碼旁，同時在那裡我也記錄著該股短線振動指標的方向。我會將這張張紙傳真給我的助理，然後她會將那些支撐價位資料輸入電腦。當盤中這些支撐價位區被觸碰及時，我就可以決定是否要建立這個部位。這項準備工作讓我在市場波動快速時，能在最短時間內做出反應。'
  - '[PAGE 362]


    # 1：冠軍操盤手入門守則


    當我想採取較長線的操作策略時，就會操作標準普爾一百及標準普爾五百股價指數的選擇權。對我來說，所謂的較長線可能是幾天到一個星期。選擇權的流通性比較低，波動也比期貨來得緩和。我會買進三個月後到期、深度價外的實權，例如當S&P指數現貨在九一○點時，買進三個月後到期、履約價在九○○的S&P指數實權。通常我會在期貨市場的波動狀況大劇烈時轉戰選擇權。如果我有一個較長線的想法時，買進選擇權讓我可以比較安心地等待較長的一段時間。因為當我買進一個實權或賣權時，至少我的風險（選擇權的買進成本）是確定的，相對而言，期貨的風險可能會因為高度的財務槓桿而變得非常大。


    當我在買實股票時，我也是操盤手而不是投資人。我的SMR技術圖集中的七十檔大型股，反映了我目前正在注意的公司。我需要這種股票所具有的流通性和波動性，使我可以很方便地在市場中進出。由於我的操作方式是如此短線，可能會在市場中反覆買進或賣出一萬股到二萬股的股票，只為了賺取其中幾檔的價差。如果我的操作計畫沒有在一或二天中產生效果，我就會清掉這個部位。因為我操作的部位很大，我可不願意承受抱著股票、看著它們下跌三美元的風險。而且由於我操作的都是較大型、流通性和波動性都比較高的股票，它們一天中的價格波動超過三美元是家常便飯的事，因此風險控管對我而言更形重要。我也不會選擇弱勢股或被蹂躪過的股票。我會在強勢股出現暫時性弱勢時挑選進場點，這個做法和我利用股價跌至軌道線附近時進場的做法不謀而合，這也是為什麼對我來說，我平常所畫的趨勢線和所記錄的支撐價位區資料那麼重要了。


    我的助理會依照我交給她的資料在電腦中設定警示，如果股價跌到這些支撐價位區，她就會提'
  - '[PAGE 363]


    醒我，如果我看到的是綠燈，也覺得那檔股票的圖形看起來不錯，就會準備買進。如果一檔股票已經跌到主要的支撐線以下時，我就會退觀場望。


    由於股市在過去幾年當中表現相當強勁，所以我想作空時都是去做空期貨，而不是放空個股。


    # 我如何操作期貨


    自從S&P指數期貨首度出現在市場之後，它就成為了我吃飯的傢伙。我每天都在期貨市場中進進出出。為了監視期貨市場的風吹草動，我每天都必須仔細研究從未來資訊報價單機上印下來的兩組技術圖。我所有與期貨有關的資料，都是從未來資訊單機上取得的。在我桌上的單機接出四個螢幕，兩兩相疊，所以我總共可以同時看到二十種我所預先選定的技術圖。我的助理在週末時會將含有不同技術指標的圖，依不同的期貨契約（標準普爾五百、歐洲美元、貨幣、債券、美元指數、CRB物價指數以及油品），及不同的時間點（三十、六十、一二○分鐘線，以及日線、週線和月線）列印出來。我在這些技術圖上畫出趨勢線，來幫我感覺每一個期貨市場目前的狀況；同時也藉著檢查它們的指數移動平均線來決定每個期貨市場是在多頭或是空頭的走勢中。在期貨價格高於指數移動平均線時作多，或在期貨價格低於指數移動平均線作空，是最符合那個古老的定律——「讓趨勢成為你的朋友」這句話的做法。


    第二組圖表則包括每一個我正在注意的期貨市場的週線圖，這種圖表使得我得以站在一個更廣的'
  - '[PAGE 364]


    角度，以較長線的觀點來研判市場的趨勢。


    在研究過這些期貨的技術圖之後，我會拿一張紙卡，將標準普爾五百和債券期貨的軌道線（十天期指數移動平均線上下各加一％之值繪製而成（記錄下來（見下圖）。


    根據我所記錄的這些價位，我會設定下一個交易日的買點和賣點。所有這些在事前所做的筆記，讓我在第二天戰況激烈的市場中能勇氣十足採取因應措施。就是這些準備動作，讓我在情緒恐慌時保持堅強的決斷力。


    # 我如何應付程式交易


    對一般的操盤手而言，程式交易（Program trading）實在是一場災難。我暫稱程式交易為「任天堂維加斯」（Nintendo Vegas），因為目前它平均每週都占紐約證券交易所一五％到二


    ![](img/38fedf09758cbfe4a48e355e6bd158cb_364_0.png)


    Courtesy of FutureSource'
  - '[PAGE 365]


    〇%的成交量。在一九八七年十月美國股市戲劇性重挫之後，由於程式式交易毫無理性的賣盤，對原本就已經疲軟的市場造成極大傷害，所以市場掀起一陣廢止程式式交易的聲浪。但是最後，有關當局引進了一種重點控制（circuit
    breakers）制度來限制程式式交易在單一交易日中對股市可能造成的破壞。所有在一九八七年崩盤那天參與程式式交易賣盤的大型經紀商，都誓言不再從事這種可憎的行為。但隨著時間流逝以及貪婪之心作崇，大部分的玩家又再度回到這種賭戰中。大盤當中每天有一五%到二〇%的成交量是這些大單子做出來的，金錢和權力在華爾街永遠能夠大行其道。


    不過呢，雖然情勢這麼惡劣，還是有辦法可以生存，甚至維持獲利。你必須知道市場的趨勢，然後耐心等待這些科技主義者把市場壓低到你的軌道線上。除了可以用馬克·庫克的紐約證券交易所股價淨變動指標（TICK）和道瓊股價淨變動指標（TKI）操作法之外，也可以在程式式交易接近尾聲時反操作，以便在它所造成的極端走勢結束後獲利。就像任何一名優秀的戰士一樣，你要耐心等待，直到這些機械性的惡毒賣盤告一段落後，再用反向部位加以反擊，但是在採取這種策略時，一定要很有紀律地設定停損點。


    這就是我一向採用且有效的策略。雖然我不是很喜歡使用這種游擊隊式的操作法，但是這種做法可以幫我調整自己在面對不斷改變的市場時所需要的技巧。我在對付程式式交易所帶來的亂象這方面相當成功，我一直在我的作業系統中加進新的工具，並持續地用我的軌道線和移動平均線來嚴格執行停損。'
  - '[PAGE 366]


    # 操作中的小把戲


    在我就讀小學一年級時，老師問班上的同學長大後想要做什麼。我說：「我想當偵探。」這種喜好探究的天性伴隨著我一起長大。我喜歡尋找事情的線索，綜合大量看似無關的資料，然後從中歸納出一個合理的結論。雖然這些觀察結果不見得完全科學，但許多年來，它們仍讓我在重複出現的現象中受惠。我通常不會將這些觀察結果當作另外一種工具或分析模式，但是絕對會在這些現象出現時，把它們列為我操作決策的重要影響因素之一。


    那些能夠幫我發現低風險、高獲利機率的技術指標，是我操作方法的核心的核心。但是我一直很用心在尋找市場中的各種型態、結構，以及重複發生的狀況，不論它們是多麼細微，都能讓我在某些交易中掌握到市場的異常狀況，並且因而獲利。


    # 圖形中的跳空缺口


    跳空缺口是我在操作股票和期貨，特別是股票時的一項重要工具。所謂的跳空缺□，就是當標的物的開盤價明顯高過或低於前一天收盤價，並在當天盤中維持此項差異所形成的


    技術型態（見下頁圖）。


    這種情況通常出現在某則新聞公布後，或是有出乎投資人意料之外的情緒發生時。在技術圖形中，它的樣子就像是一個缺口。如果這個缺口沒有在二或三個交易日中被填補起來，那我們就得得到一個強烈的訊號，顯示應該建立一個和該缺口跳空方向相同的部位。這種變化常常可以持續一段很'
  - '[PAGE 367]


    ![](img/38fedf09758cbfe4a48e355e6bd158cb_367_0.png)'
  - '[PAGE 368]


    長的時間，並且成為一種非常好的操作決策輔助工具。


    一般而言，跳空缺口可以分為三種型態。第一種是突破缺口（Breakaway Gap），這種缺口發生在股票或期貨跳空脫離一個盤整區間時，代表一個很強的趨勢正開始發動。第二種是持續缺口（Continuation
    Gap），它發生在股票或期貨已經漲升或下跌一段時間之後。第三種是竭盡缺口（Exhaustion Gap），它發生在一個上升或下跌趨勢將要結束時，而且通常價格會在這種缺口出現後，由原來的主趨勢反轉。


    共同基金投入資金時：另一個有趣的型態是由共同基金投資股票的自動交易所造成的。市場通常會在前一個月份的最後一個交易日，和新月份第一個交易日的前幾個小時中有較強勁的表現，這是有新的資金投入共同基金，使得共同基金自動進場所致。這種型態也會在每月中旬出現，因為那時也會有新資金投入指數基金當中。我會在我的記事本中寫著「月中買盤」，來提醒自己注意這個現象。在空頭市場中，觀察這些資金流出對股市大盤的影響，也是我覺得很有趣的一件事。


    三日定律：不論何時，只要像微軟或英特爾這種股票出現連續三天同一個方向的價格變動時，你就不應該在多頭走勢的第三天作多，或是在空頭走勢的第三天放空。因為這通常是一種短暫性的盤勢。通常股票若出現連續三天的相同走勢，第一天會是由市場裡先知先覺的玩家發動的，而後知後覺的操盤手則在第二天跟進，然而到了第三天，連那些原本不知不覺的操盤手都開始進場時，這個'
  - '[PAGE 369]


    走勢就已經接近尾聲了。這是一條重要的定律。如果一檔股票遇到利空消息而下跌時，在跌勢進入第三天就應該開始尋找買點，因為那些壞消息可能已經在過去三天中被市場消化掉了。


    **賣權／買權比率：**我的朋友崔格是第一個發現可以利用芝加哥選擇權交易所的動態，作為測量市場氣氛反向指標的人。他的理論是：如果連一些比較不專業的投資人都開始利用買進選擇權交易來達到賺大賠小的目的，通常這就表示市場的头部和底部已經快要出現了。


    **賣權／買權比率，**顯示出市場中比較不專業的投資人對後市的空頭或多頭的預期心理。當市場中出現一個極端的賣權／買權比率時，市場經常都會往相反方向修正。理論上，一個非常高的比值通常代表市場中的恐慌心理已經到達極點，而空方的賣盤即將結束，市場出現反彈的機會也不遠了。例如，一個高於二的賣權／買權比率，顯示市場中空頭氣焰十分高漲（代表買進訊號）；而當賣權／買權比率低於○·四五時則顯示很高的買權成交量，也意味著市場中多頭氣氛濃烈（代表賣出訊號）。就像其他所有指標一樣，這個指標也必須和其他指標或資料搭配來看，才能幫你找到最佳的進場點。


