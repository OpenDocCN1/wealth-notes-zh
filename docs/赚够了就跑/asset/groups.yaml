    第一次走進蘇富比在紐約大道的總館時，我一點也不知道接下來該怎麼做。我原本以為，參觀畫展的人會放輕腳步、輕聲細語，但事實上完全不是這麼回事。走進蘇富比展覽館的大廳，就像走進了一九四八年的共和黨年會般吵雜。一堆看起來像是長春藤名校學生的白人盧情假意地互相打招呼，在展覽廳中四處走動，設法讓大家都認為他們是行家。「不必懷疑，這一定是瑞菲爾德最好的'
