    「馬丁，我現在沒有時間趕去銀行。我很忙，手邊有一大堆客戶。」

    「傑瑞，去那些客戶的！你得聽我說，銀行現在正面臨結構性的問題。它們就快要像三哩島核


    電廠的爐心一樣熔解掉了，你一定得去銀行，現在就去！」

