    “現在價格是多少？小雞！”


    “4元對1/2元，二十張以上都行，新來的小伙子。”


    “賣出！四元賣出二十張！”我尖叫著。


    價格一跳，梅沙的股價漲到4又3/4元了。


    有人在我的背後用手肘頂我。“我叫進三十張。”是美林證券的那個傢伙。


    “賣出！”我邊轉向他邊大聲喊叫，口水噴在他的臉上。我的交易都成交了，手中的買權也清光了。


    當我從人群中慢慢走出來時，汗水從鼻子上滴了下來。交易場中的職員接過我手中的成交單，並加以確認。我拿出筆，在成交單上寫下編號05。


    現在，是計算獲利的時候了。


    我在4元賣出了二十張，在20元賣出了三十張。第一筆得到八千美元的權利金，第二筆則收到了二千七百五十美元的權利金，總計收到二千七百五十美元的權利金。


    我原先的買進成本是一千五百美元（$3.00+$2.75+$4.375），所以我的獲利是二千五百美元。天啊，在我的感覺，這就像賺到一百萬美元那般甜美！


    ## 我會一直待在這裡，下次總有機會整到你


    我終於找到成功之路了。我沒搞砸，我不必再回頭當證券分析師，不用再拿熱臉去貼別人的冷屁股了。我再也不用到那片墓地，坐在漢彌爾頓的墓碑旁。更重要的是，我不會步上父親的後塵。


    我擁有了自由，我已經能夠和那些贏家們並駕齊驅了。


    我昂首闊步走到迪吉多電腦（Digital Equipment）選擇權的交易圈，那裡的作價員是桑坦吉羅。他是城裡最難搞的一個渾球，曾經打過韓戰，總喜歡在交易場的另一頭抽著駝鴉牌香菸，真是一個難搞的人。


    “新手，你想幹嘛？”


    “桑坦吉羅，我想進場玩玩。十月份到期、履約價85元的迪吉多買權你怎麼報？”


    “2元買進，1.75元賣出。對你的話嘛，新兵，我可以在2.25元賣你十張。”


    “我出價3.50元買進十張。”


    “門兒都沒有，菜鳥。如果你要像個娘們似的做交易，就給我滾遠點。門兒都沒有！”這個難搞的渾球連5.5元都不肯讓我還價。


    “好吧，桑坦吉羅。我就用3.50元向買進十張十月份到期、履約價85元的迪吉多買權。”我在心裡想，你現在占了我50元的便宜，桑坦吉羅，這等於500美元。我了解你想讓我知道誰才是這裡的老闆，你這個狗屎比薩店的爛老闆！今天你整到了我，但是你給我小心點，我會一直待在這裡，下次總有機會整到你。


    ## “靜堂練”：冷靜千萬別得意忘形


    “這是最後一次機會，這是最棒的一次機會，來吧，寶貝，這很容易辦到。哦，馬鈴薯泥，馬鈴薯泥，你也辦得到。馬鈴薯泥，耶！耶！耶！……”


    時間是下午三點五十九分。諾爾和我踮起腳尖，在交易場內邊跳舞，邊唱著迪迪·夏普（Didi Shaw）這首一九六二年的暢銷歌。就像日後我的小兒子所說的：“這真是忙得團團轉的一天。”


    我們沒理會散落滿地的成交傳票，在地板上滑來滑去地玩樂。我們情緒高昂。我在那天創造了一萬美元的帳面獲利，而當時離收盤只剩下分鐘了。我才剛剛操作了幾個月，心裡正為能夠在短期間內就創造這麼好的績效而高興不已，我的部位價格走勢都對我有利，以至於我沒察覺到應該把這一萬美元的帳面獲利換成現金。


    第二天開盤後市場就一路下滑，由於我在前一天收盤前只顧著跳舞慶祝而忘了轧平部位，所以我最後出場時把那一萬美元的帳面獲利全吐還給市場了。從那時起，我總是在真正聽到收銀機的鈴聲響起前，全力克制想要跳舞慶祝的衝動。


    當你覺得心情像正在做馬鈴薯泥那般興奮過度時，就是一種發自內心的警訊。它正在告訴自己：你已經失去了看事情的客觀性，已經太過情緒化，而且會因此付出代價。另一件同樣愚蠢的事，就是你會真的以爲自己的舞跳得很好。事實上……你跳得很爛！


    “奧黛莉，我們錯過出口了啦！我們現在還在八十四號公路往西的方向，等一下就會直直開到紐堡 (Niobara) 去了。你到底會不會看地圖啊？”


    “怪我？誰叫你開那麼快！”


    “就一件事，我只要你做小小的一件事，你都辦不好。你怎麼會錯過往六八四號公路的交流道呢？”


    “你開太快了啦，我根本來不及看路標。而且我哪知你要轉六八四號公路？”


    “因為你昨天研究過地圖啊！這就是計畫，奧黛莉，你一定要預先計畫！”


    “地圖給你，你自己去計畫個夠吧！”


    當地圖攤在租來的克萊斯勒轎車的方向盤前時，我急忙低頭查看。當我開始感到慌亂時，總是不由自主地再度陷入自己那個“陸戰隊人格”中，還會要求奧黛莉表現得像一個優秀軍人的妻子。


    但這通常是錯的，今天也不例外。奧黛莉可一點也不想接受我大吼大叫、對她下命令，其實我也不能怪她。那時是一九七八年的七月，當天的氣溫升高到華氏一百度左右，我們熱得要命，也累得不得了，而現在又錯過了交流道的出口，我們正飛車開向一個位於哈德遜河畔，距離紐約市北方五十哩，又破舊又落後的老城鎮。


    ## 勇敢讓自己的人生，轉個大彎


    我們剛和瑞奇·白德利（Rick Dolle）及他太太蘇珊共度一個週日下午。白德利夫婦是我們以前在西部普敦（Westfarado）、海邊避暑小屋俱樂部的夥伴，去年冬天結婚後，在康乃狄克州的坦柏利（Darien）買了一幢四層、漂亮的殖民時代風格的房子，並邀請我們北上參觀新房。


    我看到那幢房子時，既替他們高興也有點嫉妒。蘇珊是電腦工程師，而白德利是聯合碳化物公司（Union Carbide）的業務員，現在擁有自己的房產、享受稅賦減免，然後坐看新房子不斷增值。反觀我們，奧黛莉是美國紙業協會（American
    Paper Institute）紙張回收部門的主管，我則是赫頓公司當紅的證券分析師，一年收入加起來至少十萬美元，比他們多得多，但我們卻買不起一幢像這樣的房子。


    我問：“你們怎麼買得起這麼漂亮的房子呢？”我們四個人坐在二樓喝著冰紅茶，房間窗戶完全打開，卻感覺不到空氣的流動。我已經汗流浹背，很顯然，白德利和蘇珊的理財秘訣之一，就是不開空調，省下一些小錢。


    “計畫，”蘇珊說，“你們一定得做計畫。”

    “計畫？”我說，“我每天起床、上班，回家後希望還有足夠的精力做愛，然後上床睡覺，這就是我的計畫。”

    “這正是我們的問題，請你們再多說一些。”奧黛莉說。


    於是他們就說啦，滔滔不絕地講，而奧黛莉和我也仔細聽。聽得愈多，我就愈覺得自己這下真得坐下來，好好訂出一套計畫才行。雖然我擁有碩士學歷與多年工作經驗，但還沒有曾過成功的滋味。訂計畫、安排明確的時間表，至少可以讓我想好自己想自己做什麼。但我討厭設定任何目標的想法，想到這裡，我已經感覺自己的胃打結了。設定目標，代表承諾；承諾，代表義務；而義務，則等於房貸、二胎房貸、汽車貨款、汽車保險、人壽保險、健康保險、房屋產險，以及使用空調的電費帳單。而最令我害怕的，是父親給我的記憶，他陷在一連串沒前途的工作中，住在還有貸款的房子裡，面對一大疊的帳單，擔心錢要從哪裡來。


    我最害怕的，就是像這樣困在中產階級的牢籠裡，下場變得和我父親一樣。我不能讓這種事發生在我身上。我用袖子擦了擦額頭上的汗，老天，白德利的房子真快熱出人命了。


    自由，我一定要擁有自由，但隨著那天下午的時光逝去，我開始覺得自由或許並不是那麼重要了。我是一個三十三歲、無路可走的證券分析師，剛結束一趟商務旅行，從德州飛回來。我向法人的客戶推薦熱門股票，我的行程從休士頓的早餐會報開始，隨後進行了四場會談，然後又趕到機場飛往聖安東尼奧參加晚餐會報，最後才在一場暴風雨黑夜的飛行後，腳步蹣跚地住達拉斯旅館，那時已經凌晨一點了。第二天我在睡眠不足的狀況下，繼續另一個類似的行程。現在已經糟到每次出差時，奧黛莉都得把我從前門推出去，才能迫使我繼續這樣的生活。離開白德利家時，我想或許這對夫妻說得對，我需要的是ㄧ個計畫，ㄧ個成功的藍圖。


    “這是用來付過路費的錢。”奧黛莉邊說邊把兩個二十五分的硬幣塞到我手裡。我們正堵在收費站前的車陣裡，等著通過哈德遜河到紐堡。路面被曬得浮起熱氣，車上的空調也開到最強，但我還是ㄧ身汗。前方的十八輪大卡車噴出陣濃濛廢氣，後面那部車子沒來由地亂按喇叭。我到底在這裡幹什麼？我不想卡在ㄧ這個車陣裡，我也不想到紐堡去。ㄧ定要讓我的人生轉個向。


    “抓緊了，奧黛莉！”我用力把方向盤打到最左邊，橫切過收費站前的空地，直直開上對面的車道。奧黛莉大聲尖叫，輪胎在地面上嘎嘎作響，四周一片喇叭聲響。管他的，我在乎什麼？終於，我開上了正確的方向。


    回到家後，我拿出ㄧ疊紙和ㄧ枝筆，坐在飯廳的桌子旁。“這就是了，奧黛莉，”我說，“拉張椅子過來，我們來設定ㄧ些目標，該是我揚名立萬的時候了。”


    ## 失敗了，頂多是回歸現狀而已，怕什麼？


    奧黛莉是唯一可以幫我設定目標的人，也是唯一真正了解我的人。在遇見奧黛莉之前，我和女人的關係不但短暫，而且總讓我覺得難以應付。我完全無法和異性健康、正常地交往。ㄧ有ㄧ度，我


    已認定女人對我來說真的是太複雜了，覺得自己比較適合過單身生活。


    直到我遇見了奧黛莉。她是個美麗、充滿自信的成熟女人，重點是她愛我。她告訴我，我是她認識的人當中最聰明的一個。這話發自內心，我簡直不敢相信她會這麼說。一九七六年夏天，我遇見的奧黛莉，正是我等了好久的另一半。


    一九七七年夏天，奧黛莉談到了結婚的事——這是我們之間很合理的結果。問題是，我剛跟妳交往時，正陷於長期的負債中，而且操作股票一直在虧錢。一年後，我雖然解決了債務，還賺了五千元，但哪來的條件結婚？


    八月，奧黛莉提起訂婚戒指，我感到腸胃痙攣，渾身不舒服；九月，她要跟我討論結婚日期，我已經腸胃無力到得吃嬰兒食品了。到了十月，她終於對我發出最後通牒：“馬丁，我的公寓租約明年三月就要到期了，不管是不是會和你住，我都要搬家。所以請你馬上做決定。”當時她正準備前往雪城——她們整個家族都要去，而且他們期待與奧黛莉會戴著一顆大鑽戒，在我的陪伴下出現在教堂。我沒錢買大鑽戒，就沒辦法加入他們家族。


    我决定，認真面對腸胃痙攣的毛病。


    我去找雷蒙·哈克曼（Raymond Hogan）醫生做乙狀結腸鏡檢查。“哇！來看看你大腸裡的硬塊！”醫生邊說邊把鏡頭轉過來，讓我看仔細。


    “這就是毛病所在，”他用筆指著螢幕對我說，“那硬塊是造成你腸胃嚴重壓迫感的東西，約有一分錢硬幣那麼大。我們得馬上把它處理掉才行。”


    小心翼翼把褲子穿回去時，我問哈克曼醫師，是否可以借用他的電話和營業員聯絡。去年辛苦存下來的五千美元，被我全數拿去買進一個月份到期、履約價七十八元的辛德仕（Sears）股票權。營業員告訴我，辛德仕股價勁揚，而我的五千美元已經變成一萬五千美元了。“賣掉！”我對著電話大喊。該是我賺錢，是我腸治大腸，是我買一顆大鑽戒給奧黛莉，更是我該長大的時候了！於是隔年三月，當與黛莉的房屋租約到期時，她成了舒華茲太太。結婚四個月後的此刻，她告訴我，我將會成為明日之星。


    > “你已經三十三歲，一直都希望自己出來闖闖，所以儘管放手去闖吧！你擁有很好的學歷，這是誰都奪不走的。最糟的狀況就是你最後破產，然後再回去當證券分析師罷了。去當一個操盤手吧，這是你的第一個目標。來，把它寫下來。”


    我拿起鉛筆。奧黛莉說得對，我一直都知道自己想成為操盤手。沒有任何其他的工作更適合我的個性，而且也沒有任何一件事比交易更能使我樂在其中。我的數學很好，對於數字反應也快，我喜歡賭博，而且熱愛市場。“成為一名操盤手”，我用又大又粗的字體把它寫下來，這看起來很棒。


    > “這就是我的第一個目標。我要怎麼做才能達成這個目標呢？”


    ## Step-by-step 成為一位專業操盤手


    “馬丁，計畫，你一定得要有個計畫。記得白德利他們是怎麼說的嗎？現在你已經有了目標，你一定要想一個計畫來達成它。”


    我坐下來想。“好吧！我必須做的第一件事，就是發展出一套符合自己風格的操作方法。”


    “把它寫下來！”奧黛莉說。


    在“成為一名操盤手”的下面，我寫下：

    - 1. 發展一套符合自己風格的操作方法


    “好，”奧黛莉說，“如何發展？”


    “最近一期的《巴倫週刊》（Barron''s）在哪裡？”


    接下來的兩個鐘頭裡，我們都在談論我的計畫。我們剪下一些市場分析報告，以及索取試閱技術圖形出版品的印花。當計算需要多少營運資本，才足夠支持我獨立操作部位時，我們決定至少需要十萬美元。我不覺得能用更少的資金達成目標。所以我寫下：


    - 2. 累積十萬美元的營運資金


    “這要花多久的時間？”奧黛莉說，“記住，你一定要設定達成目標的時間表。”


    “二年。”


    “一年？你在一年內怎麼有辦法弄到十萬元？你已經操作了九年的股票，卻從來沒有賺過這麼多錢，你得實際點。”


    “嘿！我是你所認識最聰明的人，不是嗎？如果我要成為操盤手，就必須證明自己能從操盤賺到錢。不是靠投資、不是靠借貸、不是靠寫市場行情分析報告，而是靠操盤。”我在紙上加上：“一年之內”。


    ### 3. 找佐爾納當我的指導人


    我們繼續談到，我需要一個指導人。每一個頂尖操盤手，都有一位指導人。他應該是一個更年長、更有智慧，且願意教導後輩的人。麥克·馬科斯（Michael Marcus）的指導人是艾德·史柯達（Ed
    Secura），保羅·都鐸·鍾斯（Paul Tudor Jones）的指導人是艾禮·杜利斯（Bill Dulles）。佐爾納！對了，就是佐爾納。他是我在市場中所認識最棒的操盤手。


    ### 4. 在某個交易所取得會員席位


    還有，要成為操盤手，我需要擁有某個交易所的會員席位。有了會員席位，我的操作成本才能大幅下降。一來，會員交易時不用付很高的佣金，再者，他們有 3M—— 也就是“創造市場保證金”（Market
    Maker Margin）的好處，因此比一般市場參與者占有更多的優勢。當我以一般交易者的身分用每股三美元的價格買進一張（一百股）股票買權時，必須付出全額三百美元，但是交易會員只要付一半的金額，也就是一五○美元就可以了。這使得交易所的會員享有較高的財務槓桿，可以用兩倍以上的速度賺（賠）錢。此外，交易所也替會員保了條件優厚的健康險。


    ### 5. 在未來一年中利用公司的時間做自己的事


    “馬丁，談到工作，你要如何維持工作，同時又靠操作賺進十萬美元？我們沒辦法光靠我的薪水過日子。”


    “別擔心！公司一點也不知情，但是我要在這一年中好好休息，替自己打算打算。我待在這家公司有八年半了，對企業和產業動態簡直瞭若指掌。公司想盡辦法壓榨我，但是大部分人得花一個星期的工作，我只要一天就能完成了。”


    “如果這也是計畫的一部分，那就把它寫下來吧！”


    我把鉛筆丟下。“夠了。這就是我的計畫！”


    ## 市場就像正妹 —— 迷人，但也複雜


    第二天，我關上辦公室的門，要祕書把所有電話擋掉，然後開始擬定操作方法。


    發展一套適合自己個性的操作方法，是我計畫中最重要的一部分。如果沒有一套方法，我就沒有獲利的優勢。一直以來，我都是注重基本面的人，我留意通貨膨脹率、利率、公司成長率、本益比、股利收益率、毛利率、市場占有率、政府的政策，以及其他一切會影響股價的長期因素。但從此刻起，我要把自己轉型成為技術分析者
    —— 一個市場時機的掌握者、一個操盤手、一個注意市場價格變動所發出的買賣訊號的人。這就是投資者和操盤手基本上最大的不同，操盤手會把市場看作一個有生命、會呼吸的個體，而非僅是許多個別股票的集合而已。


    正如同亞當·斯密（Adam Smith）在《金錢遊戲》（The Money Game）中所說的：“市場就像是一個漂亮的女人——無限迷人、無限複雜、總是不停改變，也總是那麼神祕。”這句話一直在我的腦中，揮之不去。在認識奧黛莉之前，我一直是個情場敗將，所以不難了解為什麼我在市場裡也是常敗將軍。但現在我有了奧黛莉，可以馬上弄清楚其他漂亮女人在搞什麼花樣。


    我開始閱讀各式各樣有關市場分析的刊物：理查·羅素（Richard Russell）的《道氏理論通訊》（Dow Theory Letters）、《巴倫週刊》、《商業週刊》、史坦普趨勢線圖（S&P
    Trendline Charts）、曼斯費爾德技術圖（Mansfield Charts）以及CMI技術圖集（CMI Charts）。其中我最喜歡的是《收割者》（The
    Reaper）通訊，這是由亞歷桑納州的一個好人麥克麥斯特（R. E. McAlister）所出版的商品期貨市場報導。我是一個喜歡綜合考量事情的人，所以把各種不同的理論混合、加以裁長補短，是很合乎我個性的做法。


    我同樣喜歡花時間找尋可以解開市場之謎的數學模型。在我閱讀的各種刊物中，泰瑞·隆德利（Terry Lund）的“神奇T理論”（Magic T Theory）最能讓我心領神會，所以我打電話給他，說明自己對他的研究如何著迷。隆德利是一個與眾不同的天才，住在麻州的南塔特克島（Nantucket
    Island）。他也是一名陸戰隊員，畢業於麻省理工學院，之後他就利用深厚的工程學識來分析市場。隆德利相信市場上漲和下跌的時間一樣長，而且在開始上漲前一定會某種前兆，或是一個資金累積的階段，當市場準備就緒，能量也蓄積完畢之後，就會開始揚升。


    T 這個字母在字型上左右兩邊的长度都是相等的，所以隆德利稱自己的理論為“神奇 T 理論”。我一看受到這個理論，就了解它將會成為我的新操作方法中重要的一環。這牽涉到我對人類的認知：左右對稱、達爾文主義、進化、事物的自然規律。所以我完全接受這個理論。


    我每天工作十四個鐘頭，一週工作七天。在週末時我研究趨勢線，並擬定下週操作策略。每天晚上我都會回顧自己的技術圖、重新計算移動平均數值、推算出轉損點，並設定我的進場和出場價位。有了神奇
    T 指標，我彷彿發現宇宙的規律，以及每十二個鐘頭交替的浪潮和退潮。


    神奇 T 指標已經和我合為一體，市場以最原始的方式上下起伏，而我就像一隻生活在沙裡的軟體動物一樣，根據本能直覺地和市場一起上下漂流。就這樣，我找到了我的操作方法。


    ## 看懂價格跳動中的玄機


    我一直都知道誰會是我的指導人。我開始一天打三、四次電話給佐爾納。在一九七五年，當愛德華與韓利公司因為一九七四年的空頭市場而發生問題時，佐爾納跑到哈肯薩克市（Hacks
    Gg），在那裡設立了一家小型的避險基金。我在紐澤西拜訪一家醫療器材公司時，曾經順道去那裡拜訪他。奧黛莉和我結婚後，我們會在週末時開車到紐澤西去，我和佐爾納打網球，而奧黛莉則和他的老婆薇琪聊天。


    當佐爾納開始操作基金時，在哈肯薩克市弄了間兩房的辦公室。他用其中一間，薇琪則坐在另一間。辦公室裡放著一部道瓊的紙條式報價機，是那種頂上有一個玻璃燈泡的直立式古老機型，牆上掛著一隻大西洋鮭魚的標本，兩者明白表現了佐爾納一生中的兩樣最愛——交易和釣魚。我會坐在他身邊，看著他花幾個小時的時間，溫和地檢視著手上那一長條連續的報價紙條，他的指尖上總會因此泛著淡淡的紫色墨水印。


    “馬丁，你一定要感覺報價的變動，”他會這麼說。“這告訴你你需要知道的一切。它們可能正好消息揭露後下跌，或在壞消息公布後上漲。如果你有能力看出價格跳動中的玄機，你就能夠知道目前市場健康與否。”他突然停頓下來，長達數碼的紙條堆在腳邊，停留在祂沾了油墨的手指下。“等一下，我們找到了一個例子。你看這種，寶麗來（Polaroid）又上漲了。結果已經很明顯，他們一定在耶誕節假期前賣出了許多照相機，這表示第四季的表現應該會很好。檢查一下你的移動平均線。現在可能是我們買進一月份到期權的大好時機。”


    到了一九七九年初，我可以看出自己的計畫開始有了成效。我對神奇T指數的細微變化愈來愈精通，並從中發現了一些新的用途，也屏棄一些不能用的部分，經過多方嘗試後，我漸漸將神奇T理論和我的個性，以及自己在數學方面的想法結合在了一起。經過這個過程，我推演出一套獨一無二的操作方法，再配合佐爾納對我的指導，我開始嚐到獲利的滋味。我的自信心愈來愈充足，準備讓大魚上鉤。


    我主要的操作標的是選擇權，其中大部分是買權，這是因為我對過去兩年市場中，自己曾經操

