    # 人生中最棒的交易


    擁抱你心裡真正想要的生活


    一九九一年一月二十六日，也就是沙漠風暴行動展開的十天之後，我正躺在客房裡那張病床上，發著華氏一〇一度的高燒。病毒性心包炎正在我的體內進行第三次反撲。我再一次讓自己勞累過度，使得病毒有機可乘。我確信病毒這回來勢洶洶，鐵定會讓我再度住院。我的私人看護依莎幫我洗了個酒精浴，而醫生也將我的強胰松服用劑量調高到每天四十毫克。我平常和列文都會做的紐約街頭散步，也在沙漠風暴行動開始後就中斷了。


    醫生的治療這回果然奏效，我的高燒也慢慢退，但我還是非常虛弱，我對強體松的依賴性愈來愈重，這使我感到非常害怕。每一次我想像以前一樣進場交易時，體溫就開始升高，讓我覺得好像隨時得向醫院報到似的。我的情況並沒有太大的改善，而更可怕的是我開始懷疑自己將永遠沒辦法好起來。


    我的情緒一直不穩定，哈克曼醫師也不斷試著要我降低我的藥量。我一直想要進場交易，但卻沒有辦法

