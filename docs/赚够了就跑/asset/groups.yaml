    \n芝加哥期貨交易所的債券期貨在星期日晚間也開盤。前往醫院途中，我打了一通電話給高費德，留話要他立刻回電話給我。或許在沒有心包囊的狀況下我還是可以過日子，但是我可不能確定我的身體狀況能不能受得了再動一次大手術。我必須轧平那個債券期貨部位，當那些贪婪的投資人打電話來想知道他們的錢操作得怎樣時，奧黛莉可以告訴他們一切都很好，即使我死掉了也一樣。\n\
    \n我躺在床上，仔細聽著身旁儀器嘈雜的聲響，心裡想的卻是我的債券期貨部位到底怎麼樣了。有一位護士拿了一支電話走到我床邊。「舒華茲先生，這是你的『私人醫生』高德德醫師從芝加哥打來的電話。我們把你的狀況向他報告過了，但是他堅持要和你說話。」高德德醫師？\n\
    \n「馬丁，他們不肯把我的電話接進來。沒有人能打電話進加護病房，所以我告訴他們我是你的私人醫生，而你想從我這裡聽聽意見。」\n\n「哦，你真是個好醫師。」我輕聲地說：「那你的診斷如何？」\n\
    \n「你已經賺了十點，大約是二十萬美元。你想要怎做？賣出嗎？」\n\n「這聽起來是個好主意。謝謝你啦，高費德醫師。」\n\n第二天早上，我真正的醫生幫我注射類固醇，這個療法真的有效。我的高燒開始神奇地滅退，心跳速度也從每分鐘一百四十下到每分鐘九十余。我終於在十二月四日離開了醫院。從十一月七日開始，我總共進了醫院三次，總住院時間長達二十六天。在這段期間內我為我的投資人賺進了五十萬美元，但是代價又是什麼？我的醫院帳單超過了十萬美元，但這終究只是金錢上的花費。真正讓我感到心痛的是，雖然在過去的一年中我為投資人盡心盡力賺錢，但是生病住院的這段期間，竟然沒有一個客戶寄任何一張簡單的卡片給我，關心一下我的健康或是安慰一下我的家人。\n\
    \n我回想起這場惡夢開始前的那天晚上，我和施密斯會面的談話內容。如果時空換成是現在的話，我會對他想要募集基金的計畫有什麼評語？我會告訴他，為了操作別人的資金而付出太多心血並不是一件值得的事，我也會告訴他，不管得到金錢上多大的報酬，為那些對你一點也不關心，甚至不在乎你死活的人工工作是毫無價值的。\n\
    \n我一直都想和市場中的高手們一較長短，而在某段時間內我也的確辦到了，但結果卻幾乎要了我的命。金額龐大的基金，對鐘斯、索羅斯、朱肯米勒、羅勃森、貝肯以及考夫納這些操盤手來說不成問題，但對我來說不是。我發現，我是一個非常純粹的操盤手，不喜歡任何人來干涉我在操作上的決策，也不想為那些我一點也不喜歡的人負責。我只想要享有自由自在的生活，並保有健康。\n\
    \n雖然如此，我還是決定繼續維持基金的運作，我還是相信我可以找到一些欣賞我和我操盤能力的投資人，並在這樣的狀況下操作一個金額具規模的基金。\n\n在寄給投資人的十一月份績效報告中，我寫道：\n\
    \n一九九〇年十二月十四日（我最後一次住院的出院日）\n\n親愛的夥伴們：\n\n我對於十一月份的操作續效延到今日才送交給您感到萬分抱歉，但正如同部分投資人所知，我在上個月感染了一種神祕的病毒，起先像是肺炎，但最後卻蔓延到我的心包囊。為了挽救我的生命，我在十一月十六日的清晨進行了一項必要的外科手術……\n\
    \n我預期一九九一年將是一個遠比今年來得更有生產力的年度。我們的基金規模將在一九九一年下降為四千五百萬到五千萬美元左右，如此一來，應該可以使諸位投資人的報酬率更為提高。將資金繼續留在本基金的那些人們，現在就像是我的一家人，我將在一九九一年更加倍用心為您服務，特別是在我從死神手裡走過一遭之後。\n\
    \n## 管理壓力，保持健康\n\n### 一、在壓力摧毀你之前，先把它化解\n\n雷·古拉是一個古板、有著一頭白髮又固執的選擇權操盤手。他坐在一間擁擠吵鬧，充滿著不成氣候、一心只想混口飯吃的操盤手辦公室裡。我是在一九八○年代初，剛離開AMGX到場外自行操盤時認識他的。貝爾·史騰公司給了我一間位於交易所附近的私人辦公室，而古拉的辦公室就在我辦公室門外。\n\
    \n有一天我正在S&P指數期貨上建立一個很大的部位，壓力正開始慢慢在我心中堆積起來。市場正在下跌，而我仍繼續在那個本來就不小的部位上加碼攤平，在一路下滑的走勢中加碼買進是我幾乎從不做的事，但是我的技術指標一直告訴我市場已經超賣，應該會出現一個反彈走勢。此外，奧黛莉在那一天休假，所以並沒有在我身邊提醒我已經違反了自己最優先、也是最重要的守則：絕不讓自尊心控制你的交易行為。\n\
    \n當汗水從額頭上滴下來時，我開始找一些方法來解除壓力。我笨拙地在桌上摸索著，找到一個鉛筆盒，把它放在頭頂上，然後跑到古拉的辦公室，跳到他的桌子上，開始輪流踩每張桌子，拿著那個鉛筆盒跳舞並大叫：「我買進喽！我買進喽！我是他媽的死多頭哦！」\n\
    \n當你正處於輸錢的狀況，而且開始腦袋空空的的時候，應該盡快採用任何一種可行的方法來幫你理清思緒。不管你是市場老手或初出茅廬的菜鳥，都不能失去客觀性。\n\n\
    我藉著跳到桌子上跳舞來紓解壓力，因为我害怕停止思考、呆若木雞。然後我回到座位上坐下來，重新思考策略。我依然得到同樣的結論——作多是正確的決定。但是這一回，我還是為我的部位設立了一個停損指令。不久市場果然開始回轉，到了那天收盤時我賺了十萬美元。\n\
    \n第二天早上，古拉走進我的辦公室，手裡拿著一個棒球，上面有一九六○年美國聯盟冠軍紐約洋基隊全體球員的簽名。他把那顆球拿給我：「我希望你收下它，因為你是那樣迷洋基隊。」我看著那顆球，上面滿布著我心目中偶像球員的親筆簽名。我從小就是這些人的球迷。\n\
    \n我說：「我不能收你的球！你為什麼要送我？」\n\n「因為你讓我和家人賺了很多錢啊。」古拉回答我：「昨天當你拿著那個鉛筆盒在我們的桌子上跳舞，並大叫著你持有很大的多頭部位時，我打電話給我在交易場所內工作的兒子和女婿，告訴他們如果你作多，我們最好也跟著作多。馬丁，昨天是我們在這裡長一段時間以來獲利最多的一天，我們希望把這顆球送給你做為我們最誠摯的禮物。」\n\
    \n我仍然不願意收古拉這個具有二十三年歷史的紀念球，但經過他一再堅持後，我還能說什麼？我不想無禮，而且也真的深深被這個禮物所感動。今天，這顆球裝在一個玻璃盒中，放在我兒子的房間裡，就擺在他的書桌\n\
    \n### 二、沒有人能死到臨頭，還拚命工作\n\n一九九二年，有一個名叫肯．庫希（H. B. Keeney）從芝加哥來的債券操盤手打電話給我，問我是否想和他一起去看一匹賽馬。我當時正想讓自己和市場切斷往來，並且培養一些新的興趣，而且我一直夢想著能擁有一匹賽馬，所以我說：「好啊，我們去吧！」\n\
    \n庫希幫我們買了一匹四歲大，名叫普利班的小母馬。普利班一跑出起跑線就一路落後，她有各式各樣的毛病，而且大部分時間都跟在別的馬身後喘氣。庫希曾經飛到各地去看她參加各項比賽，然後總是打電話給我說：「馬丁，別擔心，她是一匹很棒的馬，只是她的訓練師沒把她照顧好。」或者是「馬丁，那個訓練師說他發現了一種新藥可以讓她變成贏家。」又或者是「馬丁，她剛剛才跑出第三名的成績。這真刺激。你一定要來看她。」\n\
    \n我並不打算撘飛機跑去看普利班，然後把我的錢浪費掉。但是有一天庫希打電話來，說：「馬丁，好消息。下星期三我們幫普利班報名參加一項比賽，她可不是昔日的吳下阿蒙了！訓練師幫她找了一種剛剛由馬里蘭州賽馬協會核准使用的新藥，她現在訓練時的成績好得不得了，你一定要來看她。」\n\
    \n我覺得如果從來沒去看自己的馬參加重要比賽的話，那養馬根本就失去意義，所以我決定趕去巴爾的摩看這場比賽。「好吧！」我告訴庫希：「我會專程撥出一天的時間飛去看她。」\n\
    \n我得趕上早上十點半的火車，但是當市場開盤時，我建立了一些有趣的部位。當我發現到了該出發的時候了，頓時覺得何必花一整天到馬里蘭去看普利班？如果她輸了，我不但會相當失望，而且也浪費了一整天的時間。此外，我並不需要去馬里蘭，只需要走到最近的\
    \ O T B 去下注就好了。\n\n所以我沒有去，結果普利班竟然贏了。更糟糕的是，我在OTB下了兩千美元的注，只贏回五千五百美元而已。在賽馬場裡，普利班的賭盤是十二比一，意思是我每下兩百美元可以拿回二萬五千二百美元。當我沒有出現在賽馬場時，庫希簡直不敢相信我竟然會不去。「馬丁，」他說：「你得好好把握你的權利啊！」\n\
    \n後來，普利班哮喘的毛病愈來愈嚴重，我們最後把她賣掉時只拿回一點點錢，比起她贏得那場比賽時的價碼要差得多了。我再也沒有買進任何一匹賽馬，但或許哪天我又會手癢也說不定。如果我真的又買了一匹賽馬，我一定也會好好享受我的權利。有許多人像我因為失去了客觀的看法而在市場中施展不開，花更長的時間工作並不能讓你更聰敏地把工作做好。事實上，結果很可能適得其反。\n\
    \n在這麼多年的經驗中我學到了一點，那就是當你在市場中經過一段很順利的日子後，休息幾天慰勞自己一下是很重要的。一般人都會自然而然地傾向於繼續交易，直到再度遇到操作瓶頸為止。但是經驗告訴我們，在一連串的勝利中休息一下，通常都能讓你的表現延續下去。\n\
    \n保持均衡狀態。當你的馬起跑時，你一定要在場。坐在馬主專屬的包廂裡，盡情下注，享受一下快樂的時光，並完全忘掉市場的存在。\n\n# 第16章\n\n# 關鍵時刻，別猶豫不決\n\
    \n真正殺敵致勝的不是武器，是堅毅的心\n\n「因為我很難纏，所以你們不會喜歡我。但是愈恨我，學得就愈多。我很難纏，但是也很公平，我心裡沒有種族偏見，沒有黑人、猶太人、義大利人或是愛爾蘭人之分。在我看來，你們都是一樣毫無價值。我接到命令，要把那些沒有能力為我所愛的陸戰隊效力的雜碎趕出去。從現在起，我沒有叫你們說話就沒人可以說話。你們開始和結束每一句話時，都要給我加上「長官」這兩個字。你們這些笨蛋聽懂我說的話了嗎？」\n\
    \n「長官，是，長官。」\n\n「狗屎，我聽不到你們在哼些什麼。給我大聲回答！」\n\n「長官，是，長官！」\n\n「我還是聽不到！」\n\n「長官！是！長官！」\n\
    \n一九六八年二月五日，我來到維吉尼亞州匡提科\n\n（Camp）鎮的美國海軍陸戰隊基地，開始我在預備軍官學校的受訓生活。我在哥倫比亞大學企研所就讀的第二個學期，就和陸戰隊簽下了志願軍官役。當時校園裡盛傳美國國防部準備取消研究所學生的緩徵辦法，我可不想被徵召到越南去當大頭兵。\n\
    \n陸戰隊的訓練為期十週，在這段期間，他們嚴格控制你的一舉一動，目的是把你的思想完全摧毀，再把它塑造成他們要的那個樣子。他們讓你從清晨五點半開始就不斷忙碌，先用一個鋼質的垃圾桶在水泥地上滾動，把我們從睡夢中驚醒，開始馬不停蹄的一天，直到晚上十點鐘，在他們關掉燈，並且說：「晚安，小姐們。」之後我們才能休息。但是我們還是得隨時保持警戒、內心充滿恐懼，筋疲力竭地蜷曲在行軍床上。不過我還是在那種環境中生存下來了。「恭喜你，舒華茲少尉，你現在是正式的陸戰隊員了。」\n\
    \n一九九〇年十一月七日，我開始那長達四週和病毒性心包炎的纏鬥，一直住在醫院裡直到十二月十四日才康復出院。從那時開始，我一直都在家裡的辦公室工作，試著慢慢恢復健康。午餐時段，我的助理羅伯·列凡（Rob\
    \ Leve）會從我位於雷克辛頓街七五〇號的辦公室過來，陪著我在附近街上走走。哈克曼醫師堅持我必須要每天出門走走，呼吸一下新鮮空氣，即使外面氣溫只有華氏二十五度也得照辦。我穿上一九八七年到俄羅斯旅行時買的喀什米爾羊毛外衣，再圍上一條亞曼尼圍巾、拉高外衣的領子，最後穿上我在莫斯科買的貂皮大衣，慢慢地冬季冰冷的紐約市街頭散步。\n\
    \n我們決定在新的一年來臨時開始照目前的路線散步，這是因為每當新年到來時，我總會精神振奮，充滿勇往直前的幹勁。即使我在這場大病中幾乎喪命，而且在住院期間有幾乎一半以上的投資人遺棄了我，但我依然是沙伯林納基金公司的龍頭老大，仍然有相當多的投資人信賴我，再加上我自己也投入了相當多的自有資金，所以回到工作崗位是一種責任，也是一項自我保護的行動。我必須開始為賺大錢而努力奮戰。\n\
    \n我熱愛為山姆大叔效命。\n讓我們了解自己是什麼東西。\n+ 一、二、三、四、美國海軍陸戰隊。\n  一、二、三、四、美國海軍陸戰隊。\n  一、二、三、四、我愛海軍陸戰隊。\n\
    \  一、二、三、四、我愛海軍陸戰隊。\n  一、二、三、四、我愛海軍陸戰隊。\n+ 我的陸戰隊、你的陸戰隊，我們的陸戰隊、陸戰隊！\n\n一月二日，我幾乎連在住家附近走都没有力氣。我無精打彩，體力盡失。從胸部開刀處一直到肋骨一帶實在疼痛難當,此外,我還會服用一種名叫強體松(腎上腺皮質類固醇)的藥。強體松對操盤手而言並不是好藥,因為它的副作用之一是擾亂服用者的精神狀態。根據我的醫學百科全書所載,強體松會「造成耳鳴及情緒波動、改變性格,使服用者產生嚴重的沮喪感,還可能激化服用者的內在不安定情緒」。哈克曼醫師試著讓我漸漸減少藥量,為了達到這個目的,我就必須慢慢加強體力。\n\
    \n我每回和列凡散步回來時都滿身大汗,累得跟狗一樣,但是體力也因此一天天有進展。從四條街、八條街,到十二條街,隨著我散步的距離逐漸加長,我服用強體松的劑量也慢慢降低,從三十毫克、二十五毫克,一直降到二十毫克。\n\
    \n自從一九九〇年八月二日牙買加派兵入侵科威特起,市場就一直處於劇烈的波動中。股價大致上來說都呈現下跌走勢,而商品價格,特別是油品價格則呈現勁揚走勢。只要伊拉克向以色列發射飛彈,紐約那些程式操盤手就會按下他們的買進或賣出發動鈕,然後市場就會陷入一陣混亂當中。\n\
    \n一九九一年一月九日,美國國務卿貝克在日內瓦和伊拉克官員會面,試圖達成某種政治性的妥協方案。市場預期他們將會達成協議,但是當貝克走出會場,面對記者們的攝影機時,他所說的第一句話竟然是「很遺憾的……」。S&P指數在貝克說完那句話之前就已經重挫了十點,市場的賣壓在那一瞬間猛烈爆發出來。我開始努力建立空頭部位,在市場中拚命賣出S&P指數期貨,然後再以更低的價格把它們買回來,鈔票又開始流進來了。\n\
    \n在那個星期三,我問奧黛莉：「你知道，市場對於戰爭真正開打的預期只能反應幾次而已，我覺得現在市場的底部已經出現了。我所有的技術指標都顯示市場的超賣狀況很嚴重，一定有什麼情況會發生，我應該在它發生前買進一些股票。「現在，聽取奧黛莉的意見比以往任何時候都重要。我沒有辦法確定現在的感覺是基於市場的現貨狀況，還是因為強體松的彈性正在發作。\n\
    \n「馬丁，如果你喜歡，就買吧」\n\n我開始敲進。安進（Anagen）、必治妥施貴寶（Bristol-Myers Squibb）、康柏電腦、達美航空、哈利美、GAP、吉列、家得寶（Home\
    \ Depot）、嬌生、默克、微軟、耐克、網威（TiVo）、非利普、莫里斯、德州儀器、聯合航空、沃爾瑪百貨等都是我買進的標的。我深信美國政府一定會採取必要的行動來解決波灣危機，一旦美國真的採取行動，市場將會做出正面的反應。由於在星期二、我就已經買進了一百六十口的S＆P指數期貨契約，所以在三天之內就動用了二〇〇〇〇美元的資金，讓我的基金能在漲勢發動前取得良好的攻擊位置。\n\
    \n一月十六日星期三的傍晚，我正躺在書房沙發，看著美國國家電視網的湯姆·布洛考（Tom Brokaw）所主持的夜線新聞。我那天累極了，距離我最后一次出院才不過五週而已，而且那天傍晚，我才剛進行了一趟近來最棒的散步，總共走了有一英里之遠，足足有二十條街的距離。我握著搖控器，看著電視螢幕上的布洛考。今天他的特寫鏡頭特別多，而這通常是有重要消息發生時電視臺愛用的播報手法。果然，就在幾分鐘之前，根據白宮橢圓形辦公室發布的新聞，布希總統宣布美軍已經對伊拉克發動全面攻擊。沙漠風暴行動展開了。\n\
    \n我要放空原油…………你母親娘家姓什麼？\n\n我並不希望戰爭真的發生，我可不是一個死亡部部长，更何況現在我正為了復原而努力和病魔奮戰。但是當一九九一年一月十六日戰爭爆發後，我彷彿回到身為陸戰隊員的時刻，隨時準備應戰。現在該是我好好打一場仗的時候了。我從沙發上站起來，走回辦公室，輕鬆地坐在椅子上，戴好電話耳機，看一下時鐘。時鐘顯示著東岸時區下午六點四十分。我還沒有完全做好進行操盤的準備，但是我很悍，我是陸戰隊員，就算有一半的投資人從我的基金撤資又如何？身為陸戰隊軍官，我還是決定要奮力一搏。\n\
    \n- 「後備軍官舒華茲。讓我看看你用什麼臉孔面對敵人。」\n- 「長官，您的意思是…………？」\n- 「你有戰鬥臉嗎？這就是戰鬥臉。殺！」\n- 「殺！」\n\
    - 「狗屎！你這樣根本嚇不倒任何人！讓我看看真正的戰鬥臉！」\n- 「殺！殺！殺！」\n- 「你還是嚇不倒我！馬上給我好好練習，否則你會吃不完兜著走！」\n\
    - 「長官，是，長官！」\n\n美國派出了戰鬥機擔任攻擊任務，它可以發射像外科手術一樣精準的精準炸彈和雷射導向飛彈。毫無疑問的，我們將把海珊這個騎駱駝的人，和他那所謂的共和衛隊深深埋在沙漠裡。不如此，我們將在很短的時間內獲勝，所以我得加快動作。\n\
    \n「九點整有一場魔術表演，查理．卓別林將告訴你們自由世界如何靠著上帝和幾名陸戰隊員就取得勝利。上帝會幫助陸戰隊，因為我們會消滅目光所及的敵人。上帝玩他的遊戲，我們玩我們的。為了感謝上帝賜予我們這麼多力量，就讓無數清新的靈魂來捍衛天堂。上帝隨時保估陸戰隊員，所以你們可以全心信賴上帝，但是你們的小命還是屬於陸戰隊的。你們這些小姐們聽懂了嗎？\
    \ 」\n\n「長官，是，長官！ 」\n\n現在美國已經加入這場戰爭，在過去四個月當中主導了油品和黃金市場的恐懼與不確定性，一夕之間消失得無影無蹤。我得找一個還在交易時段的市場，我想要放空原油和黃金契約，然後在價格下跌時馬上補回來。\n\
    \n你或許會問我，為什麼？當波灣戰爭爆發後，市場上每一個操盤手第一個想到的就是放空原油期貨，但是，為什麼要放空那個在危機發生時每個人都會拿來當作避險工具的黃金呢？\n\
    \n我的理由是，自從伊拉克入侵科威特以來，原油和黃金就已經呈現超買狀態，一旦市場了解到\n"
