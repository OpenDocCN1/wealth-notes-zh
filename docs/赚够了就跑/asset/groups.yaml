    # | 第 6 章 |


    # 前一刻看好，下一秒放空


    全心投入研究，練習帶來自信


    叫他們把將來豐年一切的糧食聚斂起來，積蓄五穀，收存在各城裡作食物，歸於法老的手下。所積蓄的糧食，可以防備埃及地將來的七個荒年，免得這地被饑荒所滅。

    ——《聖經．創世記》第四十一章三十五至三十六節


    自從約瑟為法老王解夢，認為他的夢境象徵埃及接下來會有七個豐年，以及隨後的七個荒年，期貨契約一直是保障農人和購買農產品者免於價格波動風險的最佳工具。一直以來，芝加哥都是期貨交易的重心。這是因為兩個位於芝加哥最主要的期貨交易所：芝加哥期貨交易所（Chicago
    Board of Trade, CBOT）及芝加哥商品交易所（Chicago Mercantile Exchange, CME），最早都是因農產品期貨交易而出名的。


    所有交易所，不管位於芝加哥、紐約、費城、波士頓、舊金山，甚至堪薩斯市，說穿了不過是大型的賭場。只要有更多人下單，交易所就能賺更多錢。一般賭場靠著輸贏概率上的先天優勢賺取利益，而交易所則是靠收取會員費維生。這兩者都存在著同樣的特性，只要量愈大，他們就削愈多。這就是為什麼交易所總是像賭場一樣，一直想盡辦法吸引新的玩家，投入期貨交易。


    但是在1970年初期，CBOT與CME的交'
  - '[PAGE 121]


    易量都出現了明顯衰退。主要是因為二次大戰後嬰兒潮中成長的這一代，不再對農產品期貨交易感興趣。他們對於小麥、玉米、黃豆、活牛、瘦豬、豬髕這些商品根本一無所知；就算是那些較精明的交易者，也搞不懂商品期貨。所以，新一代的投資者根本不想玩商品期貨；真的非玩不可的話，他們對那些可以整齊地存放在保險箱裡的玩意兒，可能會更有趣些。換言之，他們只對股票或債券這類金融工具感興趣，這使得他們的資金往紐約移動。


    眼看大筆資金跑到紐約去，身為美國金融重鎮的CBOT與CME若再不做一些改變，遲早要大大好江山拱手讓人。一九六九年，李奧·米爾蘭（Leo Marnac）成為CME的新任主席，成為芝加哥在風雨飄搖中的一線希望。他和家人逃過了二次大戰期間納粹在波蘭對猶太人進行的大屠殺、橫越西伯利亞、逃到日本，並幸運地在珍珠港事變前抵達美國，定居在芝加哥。米爾蘭的父母在猶太人學校找到教授意第緒語的工作，而米爾蘭這個標準的猶太人則在CME找到了生財之道，豬髕這項商品更是他致富的關鍵。


    不過，米爾蘭可不只把聰明的頭腦放在判斷豬肉價格的波動上，這對CME、CBOT以及整個芝加哥來說，真是一件再幸運不過的事了。米爾蘭很有遠見，他看出在投資人眼裡，CBOT與CME是農人的交易市場。投資人一想到牛或玉米的買賣，會關心的只有紐約老字號餐廳達摩尼科（Damo-no）的菜單價格。他很清楚，如果不趕快變出一些新把戲，把紐約的資金吸回來，CME很快就會乏人問津，甚至關門大吉。但是，有什麼新東西可以提供給投資者呢？


    於是，他在一九六九年就任董事長一職後，積極研發金融期貨的可行性，而且終於等到了期待'
  - '[PAGE 122]


    已久的大好良機。一九七一年八月十五日，美國總統尼克森做出令國際金融市場為之震驚的舉動：宣布美國不再履行將境外美元兌換成為黃金的承諾。


    這個出人意表的聲明，象徵金本位制徹底瓦解。而世界上各種原本盯住美元的投資人，轉而盯住黃金（當時每盎司三十五美元），而貨幣幣值也開始浮動。突然間，貨幣也變成一種商品。米爾蘭在他的書《逃向期貨》（Escape
    to the Futures）中這樣寫著：「別再想著豬腩跟農業了，要向錢看——各式各樣的錢——這才是至高無上的商品。」


    # 賭場提供免費大餐，期貨市場有……減稅優惠！


    米爾蘭很清楚，一定有人的想法和他一樣，於是決定先下手為強。在一九七二年一月，CME成立了一個專為貨幣期貨交易而設計的交易所——國際貨幣市場（International
    Monetary Market, IMM）。


    在此同時，CME的最大競爭對手CBOT也不甘示弱，聘請加州大學柏克萊分校的知名經濟學者理察·桑德（Richard Sandor）擔任CBOT的總顧問。就好像電影《窈窕淑女》（My
    Fair Lady）裡的亨利·辛吉斯（Henry Higgins）教授一樣，桑德教授的最大挑戰就是如何把CBOT從一個純樸的村姑（只提供農產品期貨）轉型為迷人的都會女郎（提供各種創新的金融期貨）。經由這樣的轉變，CBOT才可望超越CME，並把投資人從紐約拉回來。'
  - '[PAGE 123]


    桑德教授認為，既然CME已經在貨幣期貨交易上搶得先機，他乾脆把重點放在利率上面。首先，他於一九七五年發展出抵押貸款債券（Mortgage-Backed）期貨，但並不十分成功。所以在一九七七年，桑德教授又發展出三十年期國庫債券（Thirty-year
    Treasury Bond）期貨契約。他覺得在美國政府發行的各種債券中，三十年期的公債將有可能把CBOT變成現代灰姑娘。


    直到一九七○年代末期，雖然CME和CBOT分別在貨幣和國庫債券期貨的交易中跟上時代的腳步，也從紐約搶回了一些投資人的資金，但是它們要從傳統的農產品交易所成功轉型，也非一朝一夕之功，市場中的大玩家仍然沒興趣把真正的大錢挪回芝加哥。當你習慣在華爾街和一流企業的菁英分子玩股票和債券的時候，哪會有興趣跟一群農夫和鄉巴佬玩期貨？


    最後，讓CME和CBOT得以從業績不佳的陰影中走出來，大賺其錢，靠的是避稅交易—一種盛行於一九七○年代、由稅務專家為高收入者規避龐大稅賦支出的操作手法。


    在美國，投資人不可以在年底最後交易日賣出持股以認列損失（如果有的話），然後在隔年度第一天馬上補回。但是當時，這項限制並沒有涵蓋期貨上的投資。於是，許多搖滾歌星、影星、運動明星等高所得的人，以及像我一樣收入很多的操盤手，都可以在期貨市場利用這個方法，延展繳交上百萬的稅金。這種交易受歡迎的程度，可由美林證券設立獨立部門來服務客戶看出端倪，直到一九八○年代，國稅局忍無可忍，才把這個漏洞給堵了起來。


    國稅局的新措施，等於大大擋了期貨交易所的財路，於是米爾蘭和CBOT的主席列斯．羅森（Les Rosenthal）聯手，去找了來自芝加哥的參議員丹．羅登考斯基（Dan
    Rostenkowski）幫忙。'
  - '[PAGE 124]


    果，羅登考斯基利用他在委員會擔任主席的機會，給了這些芝加哥業者一個很不錯的甜頭，在一九八一年的稅制法案中加入一條不起眼的條款，允許自同年六月二十三日起，「所有的期貨交易均須在年底以市價評估，任何利得或損失，都必須將其中四〇%以短期資本損益認列，六〇%以長期資本損益認列。」這對期貨業來說，真是天大的好消息。因為，過去如果你在前市場交易賺到錢，得按一般所得稅（最高稅率五〇%）課稅，現在則可將其的六〇%改列「長期資本利得」課稅（稅率只有二〇%）。


    這個甜頭真是好得不像話，也違反了所有的邏輯，不過，芝加哥這些傢伙才不在意什麼邏輯。原本灰頭土臉的這些業者，在羅登考斯基幫了這個大忙後不但全身而退，甚至演出大逆轉。在拉斯維加斯，賭場會提供客人免費的食宿、飲料、籌碼和秀場歌舞女郎；現在起，芝加哥的期貨交易所卻能提供更誘人的東西——稅賦減免。


    開始在AMEX擔任場內操盤手後，一九七九年我在四個月內賺了十萬美元，一九八〇年賺了六十萬美元，而且一九八一年開始以破百萬美元的速度獲利。我在股票、債券、套利以及非常多的選擇權交易中大撈了一票，其中尤其是提供我高財務槓桿的選擇權交易貢獻最大。


    我交易時，部位的進出頻率通常以小時計，有時甚至以分鐘計，所以大部分的收入都是短期資本利得，而且課以普通所得稅率，聯邦和紐約市政府聯手，總共會對我課徵五七%的所得稅。你可以想像，辛苦所得中的五七%得拿去繳稅有多麼令人心疼。於是，我只好轉戰期貨市場。玩得愈大'
  md: '

    ## 黃金類股的股價，是金價的領先指標？


    著這本型錄散步到銀行，用十美元紙鈔換取一卷二十五美分的硬幣或兩卷十美分的硬幣。然後走到銀行大廳的一角，撕開硬幣的包裝紙，將硬幣攤在桌上，開始找寻尋特殊的硬幣。


    我會不斷地走向櫃檯，重複換取更多硬幣，再次發揮起喜當偵探的天性。當我終於找到一枚想要的硬幣時，會檢查製造日期、哪個鑄幣廠製造的，然後再與型錄比對。我會查看這枚硬幣有多少在市面上流通以及目前的市價，接著就向不同的盤商兜售。如果我蒐集到一個個系列的硬幣時，會在《硬幣世界》（Coin
    World）或《貨幣新聞》（Numismatic News）這兩份刊物中登廣告，把它們直接賣給硬幣收藏家。


    我靠著硬幣交易賺了不少錢，但是我的最愛仍然是黃金。能夠找到一些特殊的硬幣固然不錯，但是這根本比不上我輕輕摸摸雙鷹金幣那種愉悅感。我熱愛黃金，但是沒有財力購買，而且技術上除非你是貨幣收藏家，否則私自持有金幣在當時仍然是非法的行為。


    一九七四年十二月三十一日，美國人才再度被允許購買黃金當投資標的。但是當時我在市場上的操作老是輸錢，所以沒有能力買太多黃金。直到我和奧黛莉結婚，並開始在美國證券交易操作自有資金後，才真正開始經常性地購買金幣。當時，黃金價格已經漲到每盎司超過五百美元的水準，但只要我手上有一點閒錢，就會購買一些南非克魯格金幣（Krugrand）或是加拿大楓葉金幣（Canadian
    Gold Maple Leaf）。當我買了將近一打金幣後，我會拿來攤在枕頭上，並把它們拋向空中，感覺真是棒透了。


    後來黃金價格持續上漲，愈來愈多人因為恐懼通貨膨脹而把錢用來投資黃金。一本本金融投資暢銷書都在預測全世界經濟已經面臨崩潰邊緣，道格·凱西（Doug Casey）寫了《危機投資學》（Crisis
    Investing），傑洛米·史密斯（Jerome F Smith）寫了《即將崩潰的貨幣制度》（The Coming Currency Collapse），哈利·布朗（Harry
    Browne）寫了《如何在即將來臨的資產縮水中獲利》（How you can Profit from the Coming Devaluation）以及霍華德·魯夫（Howard
    J. Ruff）寫的《如何在未來幾年的不景氣中成功》（How to Prosper During the Coming Bad Years）……每一本書都以獨具一格的方法來散播恐懼，並預期金融體系將以他們預言的方式崩潰。


    我在一九七九年的下半年，對黃金簡直到了神魂顛倒的地步，當我在美國證交所賺進了第一個十萬美元後，曾考慮要賣掉我的會員席位，然後在紐約商品交易所（New York
    Commodity Exchange, COMEX）買一個會員席位。我想要成為「金手指馬丁」——一個黃金期貨的操盤手。我和奧黛莉討論了這個想法，結果我們都認為這不是什麼好主意。「馬丁，你在美國證交所的操作一直都很順利，」奧黛莉說：「如果你想操作黃金的話，就操作黃金股（產製黃金的產業股）吧！」


    說得比較容易。市場上根本沒有幾家上市公司是生產黃金的，只有幾家黃金股在美國證交所掛牌上市。在紐約證交所有一檔叫 ASA 的股票，它是一家專門投資店頭市場南非金礦股的封閉型投資公司，「小雞」那一組人，除了在美國證交所當梅沙石油選擇權的作價員之外，也是
    ASA 選擇權的作價員。ASA 的交易圈就在海沙選擇權交易圈的旁邊，而小雞的手下「小鬍子彼德」就負責 ASA 選擇權交易。


    ### 買黃金，一年賺超過一百萬美元


    如同往常一般，我在開始介入 ASA 選擇權之前做了很多功課。我的原則之一就是，如果對某檔股票沒有做過透徹研究，並且完全符合我的操作邏輯之前，絕不輕易介入。在研究
    ASA 的過程中，我發現加拿大和美國黃金類股與金價之間存在著一種有趣的相關性。黃金類股的價格通常會先於金價上漲或下跌，因而使它們成為金價的領先指標。ASA
    這家公司是投資在南非的黃金製造商上，其股價通常會隨著金價同時波動，所以我看出來當加拿大和美國的黃金類股上漲時，ASA 的股價毫無疑問的會隨後跟進。


    我在 1979 年的十二月開始操作 ASA 選擇權。金價仍然持續飆漲，而在小雞負責的交易圈中，交易相當快速而熱烈。黃金是當時最新的熱門商品，所以在那個交易圈會聚集著一大堆穿著藍色工作服的交易者在那裡推擠、喊叫。「25
    元叫出五十張。」小鬍子彼德大聲喊著。「買進！」「買進！」一群人同時尖叫著，然後在同時叫進的交易員之間，就會為了到底最後誰能夠買到而出現一番爭執，直到一切都擺平後，繼續交易。


    基本上，我總是在市場中作多，買進 ASA 股票的買權，預期 ASA 的股價會隨著加拿大和美國的黃金類股走強。


    我穿著藍色工作服，把兩本成交單放在口袋裡，紅色的是賣單，藍色的是買單；另一個口袋則放著 ASA 的技術圖，站在圍繞在小雞四周的人群之中。我吞下幾顆止咳喉片，因為我整天都在交易場裡大聲吼叫，不吃喉片簡直是在謀殺自己的喉嚨。我看著
    ASA、黃金現貨，以及加拿大和美國黃金類股前一天的最高最低價及收盤價，等著 ASA 的股價突破前一天的最高價，然後就會全力搶進 ASA 買權。我會對著小鬍子彼德大喊：「買進！買進！我要買進！」這檔股票的選擇權履約價是以五美元為間隔，而在交易熱絡的日子裡，ASA
    股價可以很輕易地突破這個履約價區間。


    「彼德！總共有多少張要叫出？三十張嗎？我要買進！」我以每張四．二五美元買進了三十張買權，總值為一二七五〇美元。我渾身大汗、熱得不得了，腳上的橡膠鞋簡直快要著火了。我覺得這檔股票還會繼續漲，從我的眼角餘光中看到金價正在上揚，其他的黃金類股也在上揚，我在心裡對自己說，老天爺！我得多買進一些
    ASA 才行。


    我有兩名助理，蘇珊和吉米，每個月付給他們幾百塊錢，而他們則在我完成交易後，把成交單輸入到我得交給貝爾．史騰結算公司的資料卡上。


    「蘇珊！吉米！」我從人群中高聲喊著。「你們死哪兒去了？把我的部位表拿來，弄清楚我的部位，我賣出了多少履約價四十五的買權？買進了多少履約價五十的買權？」我滿口白色泡沫。


    ASA 股價的波動真是激烈，操作 ASA 股選擇權，跟在拉斯維加斯的賭桌上豪賭沒有兩樣。


    感謝 ASA 股和其他股票選擇權，讓我在一九八〇年靠操作它們賺了六十萬美元，並在一九八一年賺進了一百二十萬美元。隨後在一九八二年，雷根政府開始控制通貨膨脹，黃金價格也開始下滑。當黃金類股價格波動減緩後，我在這個市場的優勢漸漸消失，所以我不再像以前那樣，操作那麼多
    ASA 股選擇權了。


    黃金熱潮退燒後，每一個穿著藍色工作服的市場老手都知道該開始尋找新的操作標的了。我們全都在一九八二年开始的新多頭市場中，轉戰美林證券的選擇權市場。但無論如何，我依然熱愛黃金。對我而言，它代表了財務安全的保障。誰曉得舒華茲家族什麼時候又要開始逃難？黃金已經是我體內基因不可或缺的一部分了。


    ## 第5課 一定要做好最壞的準備——即便別人笑你


    一九八二年八月，我正過著夢想中的生活。當時是星期五的下午，我們正在新買的海灘別墅度假，我在游泳池邊披著浴巾，看著報價螢幕，並用專線電話和紐約的黛比·洪（Debby
    Hong）連線，在波動劇烈的市場中操作、賺錢。這時另外一線電話響起，來電者是內線史丹尼，以一種我從沒聽過的興奮語氣和我說話。


    「馬丁，代誌大條了！」他以沙啞的聲音小聲地在電話裡說：「聯準會主席沃爾克（Volcker, Paul A.），正緊急把所有銀行的總裁從假期中召回。墨西哥要發生債務危機啦，這些銀行貸它太多錢了，有很多銀行都會因此遇上大麻煩。這是一個最危險的緊急警報啊！」


    在整個夏季中，有關墨西哥將要破產的謠言早已甚囂塵上。每一個股票操盤手中最正確的恐懼，就是另一個像一九二九年那樣的崩盤和經濟大蕭條。許多人都認為這些年所建立的金融安全機制，諸如保證金的限制、自動執行的部位停損、銀行的準備金制度、聯邦存款保險，以及其他各種查核程式，應該可以防止這種混亂狀況再次發生。不過，在我們這些操盤手的內心深處，可一點兒也不相信這套說詞。


    以那些大型銀行把資金往拉丁美洲猛砸的大手筆來看，誰曉得事情會糟到什麼地步，而如果史丹尼認為他知道真相，我可絕對不敢掉以輕心。他可不是普通的理監事或計程車司機，他和國內各個產業的首腦以及政府官員都有很密切的聯繫。他的消息一向具有極高的準確性，聽從史丹尼的消息在過去讓我賺了不少錢，而他的專長就是在事情還沒發生前預先知道內幕消息。他操作股票、債券，更重要的是，他也和人交易資訊。如果你夠分量、也夠幸運能成為他傳播消息的對象，而且也能偶爾回饋消息，十次當中可能有七次，他能讓你賺到錢。


    我看著手錶，已經是下午兩點三十分了。我得在銀行週末關門前把黃金提領出來。如果內線史丹尼的消息正確的活，銀行在星期一早上可能沒有辦法關門營業了。


    我自從三年前開始操作自有資金以來，就開始建立自己的儲備黃金。不論何時，只要我在市場賺了很多錢，總會拿出部分資金來買一些克魯格金幣或楓葉金幣，然後將它們放在幾個不同的地方，像是廁所的抽水馬桶裡。這聽起來或許有點誇張，不過我也不是全放在這種地方，有些黃金也被我存放在幾個不同的保箱裡。我認爲它們就像我買的保險一樣，是在危急時可以用來救命的東西。


    這正是一般有錢人都在做的事，他們總是把財富分散各處，這裡藏一點、那裡也藏一點，使得他們在面臨突發意外時隨時有備胎可用。我就常常在離開紐約市時帶個一打左右的克魯格金幣在手提箱裡。現在，在三點銀行關門前，我只剩下半個小時能趕去提領出來。


    「奧黛莉！奧黛莉！」我尖叫著。「你現在馬上到銀行，把我們的黃金全部領出來。我得留下來把我的部位弄清楚，並且放出停損指令。墨西哥馬上就要破產了，那些銀行都要倒大楣了。」


    「馬丁，你到底在說些什麼？你哥哥才剛剛到我們家度週末，我們等一下就要出發去海灘了，爲什麼你突然大呼小叫地要把黃金領出來？」


    「奧黛莉，別和我辯，去把黃金領出來就對了。帶傑瑞一起去，他可以幫你一些忙，快去！」


    我繼續在市場中交易，對著筆記喊叫交易指令。「買進！該死的！」「賣出！」「等一下！」「幫我買進更多這個期貨契約。」「黃金！」「石油！我要買更多石油。」叮、叮、叮，股票、選擇權、期貨，我披著毛巾瘋狂地交易著。當我抬起頭時，奧黛莉和傑瑞還目瞪口呆地站在我面前。「你們在搞什麼鬼！為什麼還站在那裡發呆？你們聽到我說的話了吧？馬上趕去銀行把黃金領出來。我不知道情況會糟到什麼樣的地步，我們得要拿那些黃金來保命。」


    他們看著我，以爲我發瘋了。「我是舒華茲上尉，」我大吼著：「照著我的命令去做就對了，二等兵！」


    「馬丁，你瘋了嗎？」


    「到時候你就知道是誰瘋，」我尖叫著。「等到銀行都關門大吉，每個人都在喝西北風時，只有我們擁有黃金，才能保障我們在狀況最糟的時候還買得到生活必需品。」


    於是奧黛莉和傑瑞出發去銀行，大約一個鐘頭後，帶著黃金回來了。「馬丁，這裡是你的黃金。」奧黛莉說，順手把手提箱砰一聲丟到地板上。她揉著肩膀說：「我的手臂快斷了，不過還是把它們給提回來了。你現在準備把它們藏在哪裡？」


    「放在床底下就好，我可以睡在這些黃金上面。如果有人想要拿走，就得先過我這一關。」


    「哼！他們可不必要通過我這關，」奧黛莉說：「你可以自己一個人睡！」


    在整個週末中，沃爾克都在和銀行家們開會，他們決定由聯邦準備資金援助墨西哥，這個危機因而解除。星期一早晨，銀行一如往常開門營業。而除了內線史丹尼、我，以及少數在華爾街消息靈通的人之外，絕大部分的美国人從來都不知道這些銀行家，差點讓我們全都陷入極為嚴重的金融風暴中。


    到了星期二，債券價格暴漲，而公債率則出現歷史上最大的單日跌幅。星期二下午，我對奧黛莉說：「親愛的，我想這次的危機已經算是雨過天青了。我可以請你幫我把這些黃金送回保管箱裡嗎？」


    「哈！」奧黛莉說：「我為了提那些黃金，弄得手臂到現在還在痛呢！我替你把黃金提回來，該你自己把它們提回去才對。」


    這就是我想要保護家人所得到的回報。但是當你面臨危急狀況，或在危難當中做決策時，不管在別人眼中你的舉動多麼荒唐可笑，都必須立即付諸行動。經紀商裡的營業員、投資顧問、基金經理人、理財諮詢專家、家庭中的成員，以及其他支援者，都必須全力配合這個行動決策，否則最好請他們站一邊去、不要礙事。


    謨言的可信度視來源而定，但若你確信得到的資訊相當可信，就得馬上採取因應的行動。家庭的安全是我心中最重要的事，所以我總是預先推想最壞的狀況，並預做周密的準備，使我和家人可能受傷害的程度降至最低。


    ## 第 6 章 前一刻看好，下一秒放空


    ### 全心投入研究，練習帶來自信


    叫他們把將來豐年一切的糧食聚斂起來，積蓄五穀，收存在各城裡作食物，歸於法老的手下。所積蓄的糧食，可以防備埃及地將來的七個荒年，免得這地被饑荒所滅。

    ——《聖經．創世記》第四十一章三十五至三十六節


    自從約瑟為法老王解夢，認為他的夢境象徵埃及接下來會有七個豐年，以及隨後的七個荒年，期貨契約一直是保障農人和購買農產品者免於價格波動風險的最佳工具。一直以來，芝加哥都是期貨交易的重心。這是因為兩個位於芝加哥最主要的期貨交易所：芝加哥期貨交易所（Chicago
    Board of Trade, CBOT）及芝加哥商品交易所（Chicago Mercantile Exchange, CME），最早都是因農產品期貨交易而出名的。


    所有交易所，不管位於芝加哥、紐約、費城、波士頓、舊金山，甚至堪薩斯市，說穿了不過是大型的賭場。只要有更多人下單，交易所就能賺更多錢。一般賭場靠著輸贏概率上的先天優勢賺取利益，而交易所則是靠收取會員費維生。這兩者都存在著同樣的特性，只要量愈大，他們就削愈多。這就是為什麼交易所總是像賭場一樣，一直想盡辦法吸引新的玩家，投入期貨交易。


    但是在 1970 年初期，CBOT 與 CME 的交易量都出現了明顯衰退。主要是因為二次大戰後嬰兒潮中成長的這一代，不再對農產品期貨交易感興趣。他們對於小麥、玉米、黃豆、活牛、瘦豬、豬髕這些商品根本一無所知；就算是那些較精明的交易者，也搞不懂商品期貨。所以，新一代的投資者根本不想玩商品期貨；真的非玩不可的話，他們對那些可以整齊地存放在保險箱裡的玩意兒，可能會更有趣些。換言之，他們只對股票或債券這類金融工具感興趣，這使得他們的資金往紐約移動。


    眼看大筆資金跑到紐約去，身為美國金融重鎮的 CBOT 與 CME 若再不做一些改變，遲早要大大好江山拱手讓人。一九六九年，李奧·米爾蘭（Leo Marnac）成為
    CME 的新任主席，成為芝加哥在風雨飄搖中的一線希望。他和家人逃過了二次大戰期間納粹在波蘭對猶太人進行的大屠殺、橫越西伯利亞、逃到日本，並幸運地在珍珠港事變前抵達美國，定居在芝加哥。米爾蘭的父母在猶太人學校找到教授意第緒語的工作，而米爾蘭這個標準的猶太人則在
    CME 找到了生財之道，豬髕這項商品更是他致富的關鍵。


    不過，米爾蘭可不只把聰明的頭腦放在判斷豬肉價格的波動上，這對 CME、CBOT 以及整個芝加哥來說，真是一件再幸運不過的事了。米爾蘭很有遠見，他看出在投資人眼裡，CBOT
    與 CME 是農人的交易市場。投資人一想到牛或玉米的買賣，會關心的只有紐約老字號餐廳達摩尼科（Damo-no）的菜單價格。他很清楚，如果不趕快變出一些新把戲，把紐約的資金吸回來，CME
    很快就會乏人問津，甚至關門大吉。但是，有什麼新東西可以提供給投資者呢？


    於是，他在一九六九年就任董事長一職後，積極研發金融期貨的可行性，而且終於等到了期待已久的大好良機。一九七一年八月十五日，美國總統尼克森做出令國際金融市場為之震驚的舉動：宣布美國不再履行將境外美元兌換成為黃金的承諾。


    這個出人意表的聲明，象徵金本位制徹底瓦解。而世界上各種原本盯住美元的投資人，轉而盯住黃金（當時每盎司三十五美元），而貨幣幣值也開始浮動。突然間，貨幣也變成一種商品。米爾蘭在他的書《逃向期貨》（Escape
    to the Futures）中這樣寫著：「別再想著豬腩跟農業了，要向錢看——各式各樣的錢——這才是至高無上的商品。」


    ### 賭場提供免費大餐，期貨市場有……減稅優惠！


    米爾蘭很清楚，一定有人的想法和他一樣，於是決定先下手為強。在一九七二年一月，CME 成立了一個專為貨幣期貨交易而設計的交易所——國際貨幣市場（International
    Monetary Market, IMM）。


    在此同時，CME 的最大競爭對手 CBOT 也不甘示弱，聘請加州大學柏克萊分校的知名經濟學者理察·桑德（Richard Sandor）擔任 CBOT 的總顧問。就好像電影《窈窕淑女》（My
    Fair Lady）裡的亨利·辛吉斯（Henry Higgins）教授一樣，桑德教授的最大挑戰就是如何把 CBOT 從一個純樸的村姑（只提供農產品期貨）轉型為迷人的都會女郎（提供各種創新的金融期貨）。經由這樣的轉變，CBOT
    才可望超越 CME，並把投資人從紐約拉回來。


    桑德教授認為，既然 CME 已經在貨幣期貨交易上搶得先機，他乾脆把重點放在利率上面。首先，他於一九七五年發展出抵押貸款債券（Mortgage-Backed）期貨，但並不十分成功。所以在一九七七年，桑德教授又發展出三十年期國庫債券（Thirty-year
    Treasury Bond）期貨契約。他覺得在美國政府發行的各種債券中，三十年期的公債將有可能把 CBOT 變成現代灰姑娘。


    直到一九七○年代末期，雖然 CME 和 CBOT 分別在貨幣和國庫債券期貨的交易中跟上時代的腳步，也從紐約搶回了一些投資人的資金，但是它們要從傳統的農產品交易所成功轉型，也非一朝一夕之功，市場中的大玩家仍然沒興趣把真正的大錢挪回芝加哥。當你習慣在華爾街和一流企業的菁英分子玩股票和債券的時候，哪會有興趣跟一群農夫和鄉巴佬玩期貨？


    最後，讓 CME 和 CBOT 得以從業績不佳的陰影中走出來，大賺其錢，靠的是避稅交易—一種盛行於一九七○年代、由稅務專家為高收入者規避龐大稅賦支出的操作手法。


    在美國，投資人不可以在年底最後交易日賣出持股以認列損失（如果有的話），然後在隔年度第一天馬上補回。但是當時，這項限制並沒有涵蓋期貨上的投資。於是，許多搖滾歌星、影星、運動明星等高所得的人，以及像我一樣收入很多的操盤手，都可以在期貨市場利用這個方法，延展繳交上百萬的稅金。這種交易受歡迎的程度，可由美林證券設立獨立部門來服務客戶看出端倪，直到一九八○年代，國稅局忍無可忍，才把這個漏洞給堵了起來。


    國稅局的新措施，等於大大擋了期貨交易所的財路，於是米爾蘭和 CBOT 的主席列斯．羅森（Les Rosenthal）聯手，去找了來自芝加哥的參議員丹．羅登考斯基（Dan
    Rostenkowski）幫忙。果，羅登考斯基利用他在委員會擔任主席的機會，給了這些芝加哥業者一個很不錯的甜頭，在一九八一年的稅制法案中加入一條不起眼的條款，允許自同年六月二十三日起，「所有的期貨交易均須在年底以市價評估，任何利得或損失，都必須將其中四〇%以短期資本損益認列，六〇%以長期資本損益認列。」這對期貨業來說，真是天大的好消息。因為，過去如果你在前市場交易賺到錢，得按一般所得稅（最高稅率五〇%）課稅，現在則可將其的六〇%改列「長期資本利得」課稅（稅率只有二〇%）。


    這個甜頭真是好得不像話，也違反了所有的邏輯，不過，芝加哥這些傢伙才不在意什麼邏輯。原本灰頭土臉的這些業者，在羅登考斯基幫了這個大忙後不但全身而退，甚至演出大逆轉。在拉斯維加斯，賭場會提供客人免費的食宿、飲料、籌碼和秀場歌舞女郎；現在起，芝加哥的期貨交易所卻能提供更誘人的東西——稅賦減免。


    開始在 AMEX 擔任場內操盤手後，一九七九年我在四個月內賺了十萬美元，一九八〇年賺了六十萬美元，而且一九八一年開始以破百萬美元的速度獲利。我在股票、債券、套利以及非常多的選擇權交易中大撈了一票，其中尤其是提供我高財務槓桿的選擇權交易貢獻最大。


    我交易時，部位的進出頻率通常以小時計，有時甚至以分鐘計，所以大部分的收入都是短期資本利得，而且課以普通所得稅率，聯邦和紐約市政府聯手，總共會對我課徵五七%的所得稅。你可以想像，辛苦所得中的五七%得拿去繳稅有多麼令人心疼。於是，我只好轉戰期貨市場。玩得愈大

