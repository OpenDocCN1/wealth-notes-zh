    「所以你是個殺手？」


    「長官，是，長官！」


    「那你就給我滾出來讓他們好看，你這個軟弱的米蟲！」


    「大夫，讓我們賣掉那些歐洲美元期貨，現在價位在哪裡？」


    「馬丁，歐洲美元現在價位在九二八九。」


    「把它們全部賣掉。」


    「成交，馬丁。」轉眼之間就是六萬美元進帳。


    「幹得好。那三月的債券期貨價位在哪裡？九六一二嗎？賣出五十口。大夫！」


    「賣出五十口。庫許，再幫我賣出五十口。「乒、乒、砰！當我把最後一口債券期貨在九六一九出脫時，一線清晨的陽光正從我的觀景窗照了進來。


    「全世界最致命的武器，就是一個陸戰隊員和他的步槍。如果你想要在一場戰鬥中生存下來，就得發揮你殺手的天性。你的步槍只是工具，真正能夠殺敵的是堅毅不拔的心。如果你的殺手天性不夠強烈，你將會在關鍵時刻有所猶豫。你將無法消滅敵人，你就會成為一個陣亡的陸戰隊員。然後你會一文不值，因為陸戰隊員沒有得到允許是不准陣亡的。你們這些米蟲聽懂了嗎？


