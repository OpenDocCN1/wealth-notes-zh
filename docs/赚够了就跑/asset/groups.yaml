    ## 「3 元對 3 ½ 元，50 以上！」


    他的回答讓我好好思考了一下。這句話的意思是，他可以在單價 3 元買進五十單位以上的十月、65 元的梅沙買權，且可以在單價 3 ½ 元賣出五十單位以上同樣的買權。由於每一張買權代表一百股，所以我可以每張
    3 ½ 元買進五十單位以上的梅沙買權。


    這種美式的買權，讓我可以從現在開始、一直到十月第三個星期五這段期間，隨時以每股 65 元 的價格，買進梅沙普通股一百股。如果股價一路上揚，我的買權就更有價值。


    但是我覺得 3 ½ 元太貴了，我想等價格掉到 3 元時再買，所以腦子裡一直響著「三元買十張，三元買十張」。


    「3 ½ 元買十張」— 美林證券那個傢伙喊著。


    「賣了！」一個交易員賣了十張，給叫進的美林證券交易員。如果他沒這麼做，身為作價員的小雞也可以直接賣給叫進者，或是把自己的買價提高到 3 ½ 元。我真希望我能趕快搞清楚狀況，聽懂他們在說什麼。


    我看了一下牆上的報價燈幕，梅沙在紐約證券交易所以 3 ½ 開盤。我試著向前擠，希望能在交易員中搶到好一點的位子。我盡力向前緩慢移動。小雞的耳朵上，掛了連接電話的耳機，聽著梅沙股票在紐約證券交易所的股價狀況。


    價格跳了一下，他上方的螢幕報價變成了 3 ½ 元。


    人群熱鬧起來，梅沙的股價開始動了。「三元買進十張，三元買進十張，三元買進十張。」我繼續喃喃自語著。


    清了清喉嚨，我說：「嘿，小雞。你在三元要賣出多少張十月到期、履約價 65 元的梅沙選擇權？」


    「三元賣出三十張，新來的。」


    「三元買進二十張！」一個站在我身旁的人高喊。


    「三元賣出二十張！」小雞說。


    「現在你三元還有幾張？」我說。


    「三十張。」


    「呃……我……呃……」


    「你要幹嘛，新來的？你要成交還是滾一邊去？」


    這就是了，成交或滾蛋。


    在美國證券交易所買下一個會員席位，是我在十二個月前所訂下的計畫中一個重要的里程碑。


    這個計畫是我和奧黛莉·波洛克夫 (Audrey Pollock) 結婚後決定的。和我認識的其他女人不同，奧黛莉相信我有潛力，但是她也很清楚，我在過去二十一事無成。「你已經三十四歲了，而且一直都希望自己出來闖闖，」她告訴我：「努力去闖吧，你擁有好學歷，大不了破產，再回來做現
    證券分析師的工作就是了。」


    ## 為什麼我人聰明成績好，買股票卻一敗塗地？


    市場正在波動。交易場的人擠得更緊了，嘈雜的聲浪開始升高。小雞的電話掛在耳朵上，隨時準備改變買賣。如果我的資訊正確，他正要把價格抬高，而我就快要喪失這次交易機會了。


    「三元買進十張！」我尖聲大叫。


    「成交！三元賣出十張。」


    我拿出小筆記本寫下「藍字是買進，紅字是賣出」。我小聲地自言自語：「千萬別搞砸了。」


    我把交易指令寫在紙上，然後交給結算公司的職員，他的職責就是拿著我的成交紀錄進行後續處理。成交單一份由我自己保留，另一份則交給我的結算公司貝爾·史騰（Bear
    Stearns）。結算公司每天會經由交易所的會計系統確認成交紀錄，並依據紀錄提供操盤手損益報表。


    我在單上簽下會員編號 SOL。現在，這份成交單成為正式檔案，我的第一筆交易總算順利成交了。我放下心中大石，開始等著梅沙的股價上漲。


    現在不過上午十點三十分，但我身上那件嶄新的藍色制服，兩邊腋下卻泛著一圈汗水。我覺得筋疲力盡，後背下方有痠痛的感覺，腳也開始刺痛。我的皮鞋好像鉛塊那麼重，真想找個地方坐下，但是交易場裡根本沒有可以坐的地方。這對在交易所買到所謂「席位」的人來說，還真是矛盾。你得到的並不是一個「席位」，只是在場內晃來晃去的權利，而且老鳥都知道，你只能穿著舒適的皺紋橡膠底鞋在場內走動。


    梅沙的成交量放得很大。小雞在場中不斷叫進叫出，價格也上下大幅波動。我聽得到聲音，但不懂他們到底在說些什麼。我抬頭看了一下跑馬燈的報價。


    價格一跌，3%。


    梅沙朝著與我預期相反的方向前進。奧黛莉的話在我腦海中不斷閃過：「大不了破產，再做回以前的工作就是了。」


    但我真的不想重執舊業。過去九年來，我都在飛機上度日，一個城市接著一個城市飛，與各地的基金經理人見面，提供我在股票方面的看法，希望他們能給我所屬的經紀公司一點生意，不停地拿熱臉貼冷屁股。這就是證券分析師的工作。


    我們在證券經紀商的研究部門工作，得花大量時間四處拜訪各地的公司、與經理人見面、挖掘財務報表中的線索、找尋熱門股票讓公司推薦給客戶……。這些事，我已經厭倦透頂。當你二十五歲，能在國內到處旅行，並拿著公司的信用卡消費是一件很酷而且值得炫耀的事，但是當你接近三十五歲，這一切就變得非常乏味而無聊。


    你的朋友都已經忙於自己的生活，父母也開始懷疑你是不是有什麼毛病。他們幫你付了那麼多年學費，現在開始會問你：「為什麼還不結婚？你什麼時候才要長大、開始自己的人生？」


    價格一跌，8%。啊！他媽的。


    我擔任證券分析師的那幾年，一直有買股票，但每一次都以賠錢收場。我很聰明，又擁有很好的學歷，一直算是在人生勝利組，怎麼就沒辦法在股票操作中賺到錢？我真的想不透。我的家人也同樣想不透。難道舒華茲家族的歷史又要重演了嗎？難道我真的很搞砸了，餘生將和我父親一樣充滿挫折？


    價格一跳，62%。價格繼續向下。


    ## 失敗，總比什麼都不做好


    父親是家中四個孩子中的老大。祖父母是隨著家族從東歐逃難到美國的移民。在一九○年代早期，祖父在康乃狄克州紐海文市（New Haven）當裁縫師，他一針一線辛勤工作、努力儲蓄，但從來沒存下多少錢。


    家中真正有主導權的人，其實是祖母蘿絲。她擁有一間糖果店，並決定讓我父親進大學就讀，希望他在日後能夠成為一名專業人士。身為長子，我父親受到最深的期盼——能把家族帶到更好的境地，把美國夢帶給家中每一分子。


    父親的確盡過最大的努力，卻沒有達成家人的期盼。畢業於雪城大學（Syracuse University）的他，拿到畢業證書的那一年是一九二九年，所謂的美國夢已經變成了美國噩夢——他遇上經濟大蕭條。直到一九三八年和我母親結婚之前，他和其他數以百萬計的美國人一樣，都過著沒有長期正職的日子。


    然後第二次世界大戰爆發，由於年紀已大再加上有了兩個孩子，我父親並沒有被徵召入伍。直到一九二五年，他才終於做了一項重大的轉變——他拿了所有的積蓄，將房子拿去二胎抵押貸款，在紐海文郊區的威利大道上買下一間傳統式的雜貨店。


    那時我才七歲，但就連我都知道，這不是什麼明智之舉。我父親拒絕去面對一個事實——他的雜貨店和全國第一超市相距不到一個街口。為什麼他會認為小雜貨店能與新英格蘭區最大型的連鎖超市競爭？這是我們所有人都想不透的一件事。當我年紀漸長，也曾經問過我母親怎麼能容許他做這麼愚蠢的事。她只告訴我：「他那麼灰心喪志，我得給他一個機會嘗嘗失敗的滋味。就算是失敗，也比什麼都不做要好。」


    價格一跳。


    好歹我父親經歷的是史上罕見的大蕭條，而我卻一點藉口也沒有。我擁有安默斯特學院（Amherst College）學士和哥倫比亞大學商學研究所碩士的學歷；我參加過海軍陸戰隊；我有足夠的經驗；我也擁有奧黛莉。我擁有了一切。現在這裡是他媽的怎麼回事？為什麼梅沙的股價還在繼續下跌？到底什麼時候才會開始上漲？


    價格一跳。


    真是該死！


    我該怎麼辦？該停損出場？還是買進更多？該是打個電話給佐爾納的時候了。我就是聽了他的建議，才進場買進梅沙實權的。


    鮑伯·佐爾納（Bob Zolna）是我的良師，也是我所認識最優秀的操盤手。我和佐爾納第一次見面是一九七三年，我跳槽到愛德華與韓利公司 (Edgars and
    Hall)，這家小型、專做散戶生意的經紀公司工作時。當時我才剛剛在商品期貨市場輸得灰頭土臉，但馬上就看出佐爾納是一個非常、非常偉大的操盤手。一九七四年，當愛德華與韓利公司在經紀業務上虧損甚鉅時，單單靠著他放空股票就為公司的自營帳戶賺進數百萬美元，獨力讓公司生存下來。


    所謂放空，就是賣出並不屬於你的股票，但日後你必須由市場中買回。如果買回價格較低的話，你就賺錢了。在這方面，沒有人比佐爾納更高竿。我拿起電話，接線生問我要接什麼號碼。腦中一片空白的我，向接線生嘟囔了幾個號碼，電話那端鈴響了。


    「佐爾納，你好嗎？你對市場有什麼看法？是啊，我也這麼想。只是有一點緊張而已。我看價格的走法好像有點疲軟。對了，我剛買了一些海沙的買權，你怎麼看？」


    「我也買進了很多海沙，馬丁。這檔股票看起來很不錯，公司總裁也有心繼續推動組織重整。我覺得這檔股票有很好的潛在價值，只不過市場似乎還沒有看出這一點而已，我強烈地認為這檔股票馬上就要漲了。」


    「真的嗎？你真的這麼想嗎？謝謝你。你對這檔股票真的很有信心吧？對了，哦，我不知道自己該加碼買進，還是該做些什麼。」


    「這檔股票看起來很好，馬丁。」


    「老天！我希望你是對的。我待會兒再和你談，多謝了，真的很感激。」


    能和佐爾納談談話是很好的。我又找回了一些勇氣，然後再度走回圜在海沙選擇權交易圈的人群裡。


    價跌一跳，6.1%。


    小雞！小雞！嗚……「我幾乎沒有辦法把話清楚地說出口。「現在在十月到期、履約價65的梅沙買賣權價位如何？


    「新來的小子，現在的買盤是$3元，賣盤在$8元。」


    「$8元買進二十張，小雞！$8元！」我提高我的買價又叫進了二十張選擇權，每張選擇權讓我有权買進一百股梅沙的股票，所以每張買賣權價值二五五·二五美元，二十張選擇權的總值則是五二五美元。


    「成交！$8賣出一十張。」


    我的十月份梅沙選擇權，現在是以$作為最小跳動單位了。在美國證券交易所裡，當一檔選擇權的價格掉到三元以下時，最小的價格跳動單位就會從$降為$8。


    價格一跳，6.1%。


    天啊！我簡直看不下去了！


    我現在已經買進了三十張十月到期、履約價65元的梅沙買權。天啊！我從來沒想到這會變成一件讓人如此難受的事，我得離開交易市場才行，待在場裡唯一的目的，是讓我的資金得以充分運用，我一直看好梅沙石油股會讓我省財。我原先的計畫是想先跑個短線，再拿賺到的錢去投入金額更大、獲利更佳的交易機會。可是現在，市場走勢完全和我作對，我連一毛錢都沒有賺到。我開始思考要如何在沒有薪水的狀況下過日子。我得離開交易場，出去喘口氣、冷靜一下。


    ## 優秀的人，不一定會有好下場


    我步履沉重地走上階梯，推開門，走到陽光普照的戶外，身上仍然穿著藍色制服。我徒步穿過街道，漫無目的地逛到三一教堂旁的公墓裡。我在教堂的角落發現一張長凳，坐了下來。當時天氣很熱。這片墓地是酒鬼、流浪漢，以及各式各樣失敗者聚集之地。這裡是他們唯一可以閒晃而不會被驅趕的地方，因為這裡的「居民」不會抗議。


    我發現，自己正好坐在亞歷山大·漢彌爾頓（Alexander Hamilton）的墓前。白色墓碑上寫著：


    > 「亞歷山大·漢彌爾頓，死於一八〇四年七月十二日，得年四十七歲。」


    而我呢？現年三十四歲。


    七月十二日，正是漢彌爾頓和艾倫·伯爾（Aaron Burr，美國前副總統）決鬥被射殺的那天。漢彌爾頓寫了一篇批評伯爾貪汙腐敗的文章，且聲稱伯爾不適任紐約州州長的職務，於是伯爾就殺了他。漢彌爾頓是美國第一任財政部長，有美國金融之父的美譽，但卻在一七九五年因為個人財務問題被迫辭職。我記得在安默斯特學院修美國通史課程時讀過他的文章，還曾驚訝如此優秀的人為何落得淒涼的下場。現在我開始了解，優秀的人的確不一定會有好下場了。我站起來，拍拍身上制服，慢慢往回走，穿過三一大道，回到交易場看看梅沙現在的價位。


    價格一跳，6 %。


    我快步走到小雞面前。「十月份、65元的梅沙買權現在價位如何？」小雞對我露齒一笑。「新來的小子，現在買盤在 $2\frac{1}{2}$，賣盤在 $3\frac{1}{4}$。」


    我的老天！我的梅沙股價像石頭一樣往下墜。我在三塊錢買進了十張（總值三千美元），然後又在 $2\frac{1}{2}$ 美元時買進二十張（總值五十二美元）。而現在它們的買盤價只有
    $2\frac{1}{2}$ 元（總值六七五O美元）。光就未實現損益來看，我已經虧損了一三七五美元，在幾個小時內，我已經輸掉了一七％的資金。我再也無法承受。我得好好想一想，回家去冷靜一下。


    第二天，十四日星期二，奧黛莉幫助我平靜下來。她說，我是她所認識的人當中最聰明的一個，既然我已經擬定了計畫，那麼就該按照計畫行事，耐心等待。我已經深入研究了技術圖，並計算了所有的技術指標，而且梅沙目前看起來仍然很好，真的很好。就像伐爾納說的，只不過市場還沒有看出它的好處罷了。


    當我走到三一大道時，太陽正閃閃發光，寫著「會員專用」「門後的警衛居然叫出我的名字。當喬伊·迪把我的藍色制服遞給我時，我那枚上面寫著「馬丁·舒華茲公司」 $25$
    號一字樣的徽章已經別在上面了。我記起要換上皺紋橡膠底鞋，向貝爾·史騰的職員拿我的日報表。我泡了杯茶，放進一片檸檬來保護我的嗓子，然後走進交易場裡。我以輕鬆的腳步在場內四處走動，這都要感謝那雙皺紋橡膠底鞋。我檢查了一下報價螢幕和道瓊即時新聞。開盤鐘聲響起。梅沙以
    $2\frac{1}{2}$ 的價位開出。好吧，不要慌。這一定就是底部了，奧黛莉說得對，我得要有耐心。


    我向朋友海斯·諾爾（Haras Zood）揮手打招呼。諾爾是南方人，一個從納許維爾（Zeg-1 來的金髮男孩，操著濃濃的鄉音，很有幽默感。諾爾擁有大學學歷，一九七○年就在場內工作了。我在買入交易所會員席位前，就是他先帶我到交易參觀，看看這裡如何運作。


    我和傑瑞·莫爾敦（Jerry Maltoun）點了點頭，他也是一位老前輩。莫爾敦曾經在一九七三年和七四年間因為市場交易太清淡，在交易之餘用卡車載運蔬菜到各處販賣，兼差賺外快。在他的左邊是唐尼·吉（Donnie
    Gee），他是操作德士古石油公司（Texaco Inc.）股票選擇權的作價員。在他的身後是亞倫·亞伯邦（Alan Appleban）和艾迪·史騰（Eddie
    Stern），這兩個人是交易所裡穿著最講究的人。亞伯邦身材瘦長，總是穿著漿過的襯衫。史騰的父親在紐約證交所也擁有會員席位，他總是穿著自己的西裝而不穿藍色制服。


    我該怎麼辦？


    價格一跳，65。


    天哪！小雞！十月份、履約價65元的梅沙買權現在多少錢？


    「新來的小子，你還在？」


    「是啊，告訴我現在價位如何？」


    「買盤在66元，賣盤在67元。」


    「可惡！買、賣盤的量各是多少？」


    「五十對三十。」這表示小雞願意在66元買進五十張，或是在67元賣出三十張。


    再跌，我就砍掉它！


    我該怎麼辦？怎麼辦？什麼都不做？再加碼買進？再打電話給佐爾納吧。


    「佐爾納，你怎麼看？我帳面已經虧損一七五〇美元，我覺得自己好像快死掉了。你確定你是對的嗎？」


    「馬丁，聽著。我在過去做了無數筆的交易，曾經贏過很多次，也輸過很多次，我確信這次一定會賺錢。你緊抱著就好，這檔股票的價值被低估了，一定會漲回來。」


    「謝了，佐爾納。我知道可以相信你。我知道你很行。」我快步走回小雞身邊。


    「現在十月份、65元的買權價位如何？小雞。」


    「和剛剛一樣。28買進，28賣出。五十對三十。」


    「28買進二十張，小雞——」


    「成交！新來的小子。賣給你啦——」


    我在525又買進了二十張選擇權，總值四三七五美元，而現在我總共買進了五十張買權了。


    那天晚上我整夜不能成眠，輾轉反側，一再思考著我的部位。梅沙的股價當天收在60元。我的選擇權價格因此跌到二元以下。那句古老的諺語「斷尾求生」一直在我的腦海中縈繞。我還能抱著賺錢的買權檔多久？我該把自己長久以來研究的結果放棄嗎？


    在過去的十二個月裡，我都待在赫頓（E·F·Hutton）公司的辦公室裡，鎖著門狂熱地做著自己的研究工作，同時試著操作。因為我必須在轉到交易所前，靠操作自己的資金賺更多錢，以累積足夠的資本。更重要的是，我要向自己證明我的確可以成功地靠實際操作獲利。


    有些分析師認為自己能夠賺大錢，因為他們的虛擬模型，或說是他們的紙上交易模型，顯示自己可以從中獲取利潤，但他们只是用「空包彈」和市場搏鬥，根本不會受到任何傷害。除非真
    置身火線，否則將永遠不會知道自己是不足真 性，訂了至少十二種以上的期刊，和諾蘭一起研究交易場內的運作情況，向大舅子麥克和沙利借了五萬美元。我想通了，交易場就是我想待的地方。


    我跳下床走到書桌旁，重新回顧我的計畫。我到底哪裡做錯了？我花了一年半的時間來計畫這筆交易，設計了一整串的交易規則，而現在我已經嚴重違反了其中兩項。


    我的第一條規則是：絕不冒無法承受的風險，而我現在已經把一半以上的營運資金投入這筆交易。但是沒有辦法，我的資金和資訊只夠投入兩種標的物的操作，而對我來說，把一半的資金投入梅沙這檔股票，是最好的——場賭局。


    第二條規則是：試著讓每天的操作都能獲利。但現在我已經連續兩天虧損，卻無計可施。我的第三條規則是「斷尾求生」，這也是此刻最讓我為難的。我什麼時候該動手停損？什麼時候該承認我做錯了而認賠殺出？即使是最好的操盤手，即使是佐爾納，都會有面臨停損的時候。他們都利用分散投資組合來規避操作風險，可是我並沒有那麼多錢建立一個分散的投資組合——梅沙是我唯一的投資組合。


    最後，早晨一線曙光從臥室的窗戶投射進來，我下定決心：如果梅沙今天開盤再開低的話，我就砍掉它。


    漲了漲了……我愛死股票市場了！


    八月十五日，星期三的早晨，我走進三二大道八十六號，穿過「會員專用」大門，換上藍色制服，套上皺紋橡膠底鞋，拿著顯示我已經有二〇〇〇美元帳面虧損的貝爾．史騰公司損益報表，準備一杯泡著檸檬片的茶，走進交易場大廳，看著報價螢幕和道瓊即時新聞，等著開盤鐘聲響起。


    梅沙開盤價格是68%，上漲了8%。


    這就對啦！寶貝，我可是一直守著你呢！我跑到小雞身旁，一群人在他身旁推擠著，想搶占有利的位置。四周的噪音不斷升高。


    價格一跳，61。


    周圍噪音更大聲，人群也愈緊愈多了。人們開始大聲喊叫著：「現在價格多少？」「賣出價怎樣？」


    價格一跳，61¾。


    佐爾納，我愛你。我就知道你是對的。


    「有多少張？」「量有多少？」「買價如何？有多少買盤？」「賣盤有多少？」「到底有多少張？」


    時間慢慢過去，我簡直興奮得吃不下午餐。我真是愛死這個市場了。


    「3元對3½元、3¼元叫出五十張——「買啦！我買啦！」有人大叫著。


    「3½元叫進五十張—3¼元再叫進五十張——「賣出！」「賣出！」「賣出！」


    梅沙的現股價格已經跳到每股33元了。而十月份到期、履約價65元的梅沙買權價格也再度上揚。「3½元、3¼元，成交」「1¾÷7元對4元！」周圍的噪音升到了最高點。


    「3元叫出一百張十月份到期、履約價65元的梅沙股買權！——「4元成交兩百張」「這檔選擇權的價格正快速移動。現股的價格朝我們預期的方向前進。所有陰霾一掃而空。


    我不斷查核手中的部位。在3元買進十張、%元買進二十張，然後又在¼%買進了二十張。


    我現在該賣出嗎？該獲利了結嗎？還是再加碼買進？我該打電話給佐爾納嗎？去他的！該是讓我聽一聽收銀機聲響的時候了。


    我緩緩移動到人群的前面。「小雞—給我梅沙的價格！」


    「十月到期、65元的買權，¼%元對¼%元，十張以上都可以。」「他的口水噴到我的外套上。


    我清了清喉嚨，想向他喊賣出，可是一個滿面通紅、全身肥肉的傢伙越過我的肩膀大喊：「賣出！賣出！賣出十張¥¼元！』他身上那股波本威士忌的味道直沖著我的鼻子。媽的！這肥仔搶了我的價格。


    「現在價格是多少？」小雞正在講電話。

