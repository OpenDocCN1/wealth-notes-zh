    # 第1章


    # 師父引進門


    踏上華爾街交易大廳現場


    三元買進十張，三元買進十張，三元買進十張。「這句話好像咒語般，在我心裡一遍又一遍重述。如果梅沙石油股價到了3%的話，我準備要在市場上以每張三百元的價格，買進十張十月到期、履約價為65元的買權。這將是我在美國證券交易所(American
    Stock Exchange, AMEX)場內的第一筆交易。我心裡怕得要命，擔心搞砸了。


    穿上藍色制服，我是正式會員了……


    那是一九七九年八月十三日星期一的早晨。三一 大道(Trib Place)上擠滿了穿著西裝、準備上班的人。紐約的金融市場正要開始另一個嶄新的一天。我站在門牌號碼八十六號的入口前，深深吸了一口氣，拿出我的徽章，第一次走進了那扇寫著「會員專用」的門。警衛看了一下我的徽章，上面寫著「馬丁·舒華茲公司，935號」，對我點了點頭、道了聲早安，'
  - '[PAGE 19]


    就讓我進去了。


    我走下階梯到衣帽間，會員都在櫃檯前面排隊，拿著他們的運動夾克向櫃檯換成美國證券交易所的藍色制服。由於這是我第一天報到，還沒有自己的藍色制服，只好向服務員喬伊·迪(Joy
    Dee)自我介紹，告知我的會員號碼，才領了一件。我穿上制服、別起徽章，確定自己帶了筆。其他人都換上皺紋橡膠底鞋，把原來穿的皮鞋放在靠牆的方型小櫃子中。我找不到座位，決定等一會兒再換鞋。有沒有皺紋橡膠底鞋可穿，是我此刻最擔心的事。


    我走上樓到大廳等待開盤。美國證券交易所的會員大廳，比起哈佛或耶魯大學的學生俱樂部大不相同。廳裡充滿了香菸（而不是菸斗）散發的濃濃煙霧；家具用的是假皮，而非高貴的真皮；會員大部分是愛爾蘭人、義大利人和猶太人，而不是益格魯撒克遜系的白人新教徒（Vogessen，就算有，也都不像是讀過什麼好學校的人。這些傢伙都是金融界的二流人物，场外證券市場(Curbs)的譯註：指的是由一群非法交易者，於一九〇一年間在紐約證券所外形成的非正式市場）交易者的衣鉢傳人。


    我泡了一小杯茶，走進交易場內。早晨的陽光從遠處一面牆上無數的窗戶中流瀉進來。這真是一個占地寬廣的房間，大約有一座足球場的四分之三，足足有五層樓高，設計得好像一座室內的跳蚤市場。場中的幾名作價員(Spotter)，一個暱稱是「小雞」(Chick)，另外兩個是法蘭尼．桑坦吉羅（Francie
    Santangiro）和唐尼（Dormie），通通坐在馬蹄形交易圈內的高腳凳上，翻著手中的客戶交易指令。在交易場中有許多不同的交易圈，以供各種股票以及不同到期日、履約價的選擇。'
