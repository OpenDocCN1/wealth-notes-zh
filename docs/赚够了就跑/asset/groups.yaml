    # ⑥ ⑦ 需要改變方向時，別猶豫


    我下定決心，但是我在兩方面都下足決心。——洋基名教練凱西·史坦格（Casey Stange）


    在交易場內，我總是無法找到所需的所有資訊。通常只有那些支付報價機器租金的報價員，才有權決定螢幕上該顯示哪些報價。「小雞」在他的螢幕上只放梅沙石油，喬伊只放德士古石油，桑坦吉羅只放迪吉多電腦，沒有一個人在他的報價螢幕上放所有我需要的報價。


    「馬丁，我在樓上的辦公室裡有報價機，」桑坦吉羅說：「只要你用用，隨時歡迎。隨你怎麼用都行。」桑坦吉羅也是一個大操盤手，在盤中總是待在樓下的交易場中忙著執部位，他雇了幾個助手在樓上，替他管理部分的資金，也做些較小的交易。當桑坦吉羅認定我是會贏錢的場內操盤手後，他覺得把我留在樓上會是一個好主意。他覺得當他在樓下做交易時，他的助手'
  - '[PAGE 136]


    或許可以從我這兒得到一些好主意和資訊。

    我感到很滿意。每天午餐時間，當大部分人外出吃速食的時候，我就拎了個三明治到樓上辦公室裡研究線圖，並讓自己在下午開盤前調整好情緒。辦公室裡，有能提供所有資訊的報價機和一個專線電話，當我想下單的時候，可以直接打電話給營業員。

    桑坦吉羅的助手們看到我持續獲利，也開始對我友善了起來。我知道桑坦吉羅叫他們在背後監視我，但是既然可以免費用他的辦公室，而且那些小伙子人也不壞，我就待下來了。既然我下我的單，他們也管不了我，那又有什麼好計較的？在他們監視之下，反而鼓舞了我的士氣。

    在梅沙股票選擇權後，我開始操作南非金商股票（ASA）。當時通貨膨脹率完全失控，各地的金價都急速上揚，這對擅長抓時機的我是再好不過了。

    有一天，我下單給我的營業員肥麥克，叫他買進五十張五月的 ASA 買權，桑坦吉羅的助手們在旁邊偷聽。我從不過問他們在幹什麼，也不確定他們有沒有跟著我下單。當麥克回報成交後，我決定走到樓下的交易場內看看盤面情況如何。我對場內的交易員打招呼時，特別留意了一下成交紀錄，「不對勁，」我對自己說：「我得改變部位才行。」於是，我把我的多頭部位平倉並反手作空，然後走回樓上的辦公室。當我走進去時，桑坦吉羅的助手傑瑞正盯著報價螢幕，他看起來非常憂心忡忡。「天啊！馬丁，市場看起來好像不太對勁呢！」

    我看著報價機：「我知道，所以我放空啦！」'
  - '[PAGE 137]


    「放空！你什麼時候放空的？你剛剛不是還作多嗎？」


    「是啊，但是剛剛我到樓下去的時候覺得不對勁，就把部位反轉過來了。」


    傑瑞的臉漲成了豬肝色。「你這個混帳！」他咆哮著，從椅子上跳了起來。他拿起辦公桌旁的球棒走向我：「我要宰了你！」他那濃濃的愛爾蘭腔顯得很尖銳。


    「傑瑞，冷靜點！」


    「你怎麼可以反轉你的部位？」他仍然一直走向我，瘋狂地揮舞著那根球棒。


    「我只是做了該做的事。」我迅速躲在椅子後面：「我得照顧家人，而我的家人中沒有愛爾蘭人啊，你明白嗎？」


    他平靜下來，把球棒放回原位後，我告訴他：「聽著，傑瑞，我之所以能賺到錢，就是因為我是一個常改變打法的打擊者。就像打棒球的時候，如果球從右邊來，我就往左邊打。如果發覺市場換邊走，我會馬上改變操作策略。」


    如果你是一個著重進出場時機的操盤手，不論作多或作空都要一樣在行。當市場的趨勢轉變時，你不能死抱著部位，然後巴望市場會回到原點。如果你對這點還沒有辦法很自然地掌握，那你能做的只有不斷地練習、練習、再練習了。


    這個建議對生手和業餘投資者並不適用，只對充滿抱負的專職操盤手有效。一般的投資人要學會買進股票就夠了，他們不必放空，也不需要對此了解太多。放空是業內高手玩的遊戲。'
