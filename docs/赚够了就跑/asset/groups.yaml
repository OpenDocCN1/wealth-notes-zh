    # 那一仗，我打敗索羅斯


    黑色星期一，你在幹嘛？


    當年在華爾街，你最常會聽到人們問的問題是：「一九八七年十月十九日那天，你在幹嘛？」那天，我手上持有的是多頭部位，結果也證明是錯的。可是如果還有機會重來一遍，我還是會作多，還是會犯同樣的錯誤。


    那正是蓬勃發展的一九八○年代，就算沃爾克於一九八二年從墨西哥灰頭土臉地撤退，市場還是一路持續多頭走勢。在一九八二到八七這五年中，道瓊工業指數從七九〇點上漲到二千六百點，共飆漲了二三〇%——光是八七年的前九個月，就上漲了六五〇點，相當於三三%的漲幅。華爾街就像西班牙奔牛節的情景一樣，每個人都跟著牛群跑。我在那年賺了八百萬美元，在那樣的多頭市場中賺錢是多麼容易，只有傻瓜才會認為多頭市場即將結束。


    我手上的持股不但多，而且數量持續加大。我對市場非常有信心，所以在哥倫布紀念日的那個週末我帶著奧黛莉，與職業網球選手安德列和他老婆蓋比'
  - '[PAGE 217]


    起到天堂島度假。紀念日當天市場正常交易，但AMEX裡那些猶太和義大利裔的操盤手通常不上班，只有北歐裔、英裔和愛爾蘭裔的操盤手不放假。八年來，我自己則一如往常地交易，並不休息。所以當奧黛莉、安德列和蓋比坐在海洋俱樂部的吧臺上喝著雞尾酒時，我拿著電話繼續進行交易。「再幫我買一萬股的田納科（Tennco）。……什麼？你說市場傳聞田納科就要被別的公司併購？那再幫我買進二萬股。幫我買就對了！……等一下，奧黛莉，賭場什麼時候開始營業？」


    在這個哥倫布紀念日，市場狀況相當敏感。週四（十月八日）道瓊跌了三十點，並在週五（九日）接著跌三十四點；緊接的週一（十二日）跌十點，週二（十三日）漲三十六點，週三（十四日）重挫九十五點，週四（十五日）跌五十八點，接著就來到了黑色星期五（十六日）。後來《華爾街日報》這樣描述週五破歷史上紀錄的跌幅：「道瓊以破紀錄的一〇八．六五點跌幅重挫，成交量也創下史無前例的三億三千八百萬股。這是道瓊指數連續第三天重挫，但部分技術分析師表示，從週五的跌幅與成交量來看，顯示未來盤勢將有機會出現較佳表現。」


    # 純種狗和雜種狗有什麼不同？


    這就是大部分市場專家對週五那種戲劇性跌幅大致上的共同看法。大家都認為，週五的走勢是多頭向下修正的末跌段。


    貝爾·史騰公司的傑克·所羅門（Jack Solomon）宣稱「市場的大幅下跌總是以死亡性的殺盤'
  - '[PAGE 218]


    作結束]，奇德公司（Kirk''s）的鄧尼斯·加瑞特（Dennis Garrett）的意見則是「市場已經到了『投降點』」。大部分的分析師都同意，星期五盤中的走勢是一種典型的『空頭頂峰』。


    至於我自己呢？我也認為市場已經見底了，雖然在我自己設立的交易法則中顯示，週五出現的跌勢通常都會延伸到下個週一，但我還是在週五收盤前開始建立多頭部位。畢竟，下檔還能有多少空間？市場還能跌到哪裡去嘛！週五收盤前我打電話給黛比：「幫我用市價買五十口
    S & P 期指。」她幫我買進了，成交價在二八三·五。這對我來說根本不算什麼了不起的大部位，但是直覺告訴我在這樣的市場狀況下五十口已經夠了。


    可是接下來的週末，發生了兩件使我真的緊張起來的事。


    週五晚間，我如同往常一樣快累垮了，奧黛莉幫我煮了豐盛的晚餐。我躺在沙發上邊吃邊看電視上由路易士·洛基瑟（Louis Reysse）主持的「華爾街週報」。洛基瑟向當天的來賓、著名的基金經理人及市場預測專家馬提·崔格（Matt
    Czog）詢問對週五這一○八點的重挫有什麼看法，崔格說：「市場目前正在很危急的狀況中，我認為在短期內將往下跌至至少五百點。」


    崔格和我住在同一幢大樓裡，所以星期天一大早我就打電話給他，他下樓到我的公寓談了大約一個小時。當時債券價格也已經在很短的期間出現重挫，而且他說所有的貨幣市場指標都明顯偏壞，他再一次以相當肯定的態度表示，市場將再下跌至少五百點。


    當然，他說這個結果可能在未來幾個月內發生，我們萬萬沒有想到，這一切竟然在接下來的二十四小時內成真。'
  - '[PAGE 219]


    另外一件令我感到不妙的，是美国财政部長詹姆斯·貝克（James Addison Baker）在週末指責德國當局任由馬克利率走高的一番話。貝克一直以來都想藉由控制美元的匯價，來改善美國貿易赤字問題，也認為波昂當局所採取的行動已經違反了他在當年二月和德國達成的協定。貝克的強硬談話等於向市場放出美國即將調高利率的風聲，令市場相當不安。所以當我聽到貝克的談話後，就知道麻煩大了。


    星期一開盤前我很緊張。在崔格發表對市場的看法以及貝克對德國開罵後，我認為當天的市場從一開盤就不會讓人好過。我通常對任何部位都會設一個「認輸點」——我心中的停損點，但現在的問題是：我有沒有足夠的勇氣承認自己犯的錯誤並停損。在心裡設下停損價位是一回事，而真正執行它，在市場把多頭部位砍掉並實現一大筆的損失是另一回事。在華爾街，切實執行停損就像分辨純種狗和雜種狗有什麼不一樣一般困難。


    開盤鐘聲響起，市場馬上進入瘋狂狀態，道瓊工業指數好像垂死般，在開盤十五分鐘內立刻下挫了一五〇點。我坐在辦公室陷入恐懼中，因為我手上那四十口S & P指數期貨、一卡車的選擇權和兩卡車的股票，轉眼間都跌破了我心裡的停損點，我的部位已經虧損太多了。我沒有辦法動手執行停損，也無法做任何因應動作。陸戰隊的教官告訴我，在戰場的火線下，不管前退或撤退，千萬不能停滯不前。總之，不要呆坐原地等著挨炮彈。不過他們所教的只適用於一般的戰鬥，而我現在卻像是被核子彈轟炸了一樣。


    我的眼睛從一個螢幕換到另一個螢幕，天哪！所有的線圖和技術指標都直直向下──道瓊在半'
  - '[PAGE 220]


    個小時內跌了兩百點；S＆P指數一開盤就重挫了十九點，而且還正在極速下滑中。NYSE指數？幾乎崩盤了。那斯達克指數？就像滿目瘡痍的戰場。芝加哥交易所的選擇權？全倒！我喃喃自語：「搞什麼鬼？這不是真的！下一個支撐在哪裡？反彈吧！寶貝，你一定得反彈！」


    終於在十點半左右，市場暫時停止下滑，甚至出現了小幅反彈。我開始到處打電話打探市場狀況，試著為我的部位找方向。「今天的成交量是多少？」「一買進和賣出家數是多少？」「有多少買家？他們只是在建立新倉，還是軋平部位？」「狗屎！你能相信默默（M&M）竟然跌了十二美元，到了一七二美元一股嗎？再看看迪吉多，下跌了二十美元，到一五二美元一股。這些都是多好的價位啊！一定有很多人會進場搶進。「在下個鐘頭裡，道瓊指數回暖，並從低點向上回漲了一百點。


    我開始採取行動了。我打電話到芝加哥，「黛比，把我那四十口S＆P期貨賣掉。市價賣掉。


    現在就賣！」我賣在二六七・五，當場賠了三千一萬五千元美元，但那是我這一生中最棒的交易之一。


    我一向以擅於掌握市場的進出時點而自豪，但萬萬沒想到這次賠錢，會是我這一生中時點掌握得最棒的一筆交易。我在只比當天最高價低一・五點的價位，賣出了那四十口S＆P期指。從我賣出的價位開始，市場再度陷入快速跌勢當中。我開始努力作空，賣出了所有的部位。到了當天上午十一點半，我除了在哥倫布紀念日度假喝瑪尾酒時所買進的那幾個選擇權外，幾乎清乾淨了所有部位。我不是不想清掉那些選擇權，而是因為它們那時已經停止交易，根本沒有任何買盤了。


    到了中午，道瓊指數又下跌了大約一五〇點。我想我已經賠了大約兩百萬美元，這可是一筆大數目，但是至少我已經停損出場，不會再輸更多錢了。這回我受了重傷，但我當機立斷地幫自己止'
