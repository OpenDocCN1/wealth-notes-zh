  mdcn: '

    子也被你們教成一個樣子。你們現在是在佛羅里達，去打打高爾夫，到海邊坐坐、讀本書，放鬆一下吧！”


    「我們當然很嚴肅，」我說：「人生本來就是嚴肅的。你知道，你可能贏也可能輸，但是贏比較可要好得多了。你得取得勝利，才付得起錢找個心理治療師來修理你。」


    過去幾年，我一直都在付錢、付錢、再付錢給心理醫師來發掘我內心深處的問題。我從這當中發現到，一個人沒有辦法在一天中同時當一個好兒子、好兄弟、好丈夫、好父親，而且還同時當個好操盤手。我是一個完美主義者，希望把每一件事情都做好，但是要照我的方法來從事交易的話，每天就得花十四個鐘頭在工作上。隨著我年紀愈來愈大，我開始試著用一些取巧的方法，例如找個助手來幫我畫技術圖、打專線電話，或是和結算公司查核我的部位，可惜這些取巧的方法都沒有用。我擬定計畫，建立了一個理想中的機制，並且調整它試圖使它臻於完美，可是到头來，我反而受制於它。


    我也曾經試著把目標訂得低一點，玩得更小一點，或者在身為操盤手之外也試著當一當投資人；我也參加了一支由一群寡養、老金度日的律師所組成的歐式棒球隊。我每週至少花兩個下午在高爾夫球場上，有時也會跑去海灘，躺在椅子裡看著潮來潮往。常常，我會懷疑這到底是不是自己想要的生活，我是不是做了正確的決定，然後我會想起二月時曼哈頓寒冷的天氣，以及當年為了和那些傢伙一較長短而付出的代價。我知道，離開紐約的決定是正確的。


    哎，我可是天生的操盤手啊！


    內線史基尼參加了丹·朵夫曼的婚禮回來後，打了個電話給我，告訴我他在那場婚禮中遇到了波奇。「這傢伙的體重一定超過三百五十磅，」史基尼說：「他把那肥胖的身軀『放』在一張自助餐檯旁，根本運動都沒辦法動一下，其他客人得勉強從他身旁擠過去夾取食物。而他所能談論的只有一堆接收、購併、融資購併，和股票首次公開發行（IPO）的案子，以及他如何從這些案子里賺到大錢，簡直囂張到了極點。朵夫曼真怕波奇會有人在背後用槍轟出個大洞，然後慘叫著倒臥在現場。」史基尼說的是一個聽來熟悉的老故事。


    就在同一天，我早上剛和兒子打了一場高爾夫，中午和母親享用了一頓午餐，下午和女兒一起去游泳，然後和老婆共進燭光晚餐。我壓根兒沒想過操盤這回事。從這個觀點來說，或許我已經擊敗波奇了。如果我還繼續操作我的基金且留在紐約的話，我就會在那場婚禮中坐在他身旁，因為每個市場上的高手都會參加朵夫曼的婚禮。想想和波奇一起吃飯，還得聽他胡說八道，會是多麼令人不愉快的一件事。


    不過，雖然我盡了一切努力，還是沉迷在操盤交易中。我打電話給考林斯，買進了一口S & P指數期貨契約，並告訴他在市場反轉時馬上通知我。我把那支平常打高爾夫時隨身攜帶的震動型行動電話拿出來，放在外衣的胸前口袋裡，然後前往診所門診。


    當我正和醫師談話時，電話振動了。一定是考林斯打來的。「對不起，」我對佛羅里達的那位心理治療師說：「我得上個洗手間。」


    我快步衝進洗手間，鎖上門，然後回電給考林斯。正如我所預期的，S & P 期指已經上漲，而漲勢正接近尾聲。「賣掉！」我輕聲對著話筒說。我剛剛賺進了三萬美元，我覺得自己好像是美國總統。


    「看吧，」當我一臉笑容回到心理醫師的辦公室時，他對我說：「你看起來好多啦！你所需要的就是好好休息一個禮拜。」


    我能說什麼？我是一個天生操盤手啊！


    ## 致謝


    我要感謝我的家人，謝謝他們在我一生中對我一貫的支持和鼓勵。感謝我的父母親，他們總是犧牲自己，讓我能夠受最好的教育，並且能在一個充滿了愛和誠實的家庭中成長。感謝我的哥哥傑瑞，他花了很多時間教我如何成為一名更好的運動員和一個更好的人。感謝我的祖父，他教我如何保持樂天知命的人生觀，並且把他的家譜留給我，讓我能延續家族的故事」。感謝我的太太奧黛莉，她是我們家庭的基石，也展現了高尚的人格與智慧。感謝我的孩子史黛西和鮑伊，他們讓我們知道當一對好父母是多麼具有挑戰性，卻又充滿了喜悅的一件事。


