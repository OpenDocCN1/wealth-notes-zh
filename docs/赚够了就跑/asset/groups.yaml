    工作到晚上，補畫技術圖形、計算技術指標，試著讓一切回復到我能控制的狀態下。我在大約十點上床就寢，並且馬上進入夢鄉，但是在星期三的凌晨一點半時，卻因胸劇痛從睡夢中醒來。這種疼痛是我以前從來沒有經歷過的，一陣強烈的刺痛從我的心臟穿刺而過。我不認為是心臟病發作，但每呼吸一次，就會引起一陣陣深入脊骨的疼痛。奧黛莉開始為我按摩胸部，試著減輕我的痛苦，但似乎沒有什麼效果。我們打電話給哈克曼診所裡的服务人員。醫生總算在凌晨四點回電，奧黛莉向他詳細敘述我的情況。「先讓他吃兩顆止痛藥減輕疼痛，再吃兩顆鎮靜劑幫助入睡，拿一張電熱毯放在胸口保溫，我明天一早再打電話給你們。」我終於入睡，然後在早晨七點半醒來，全身都被汗水浸透。


    # 他住哪家醫院？我想去問他績效如何......


    到了九點，哈克曼打電話來。「馬丁，我不希望你四處走動。」他說：「我已經安排好十點四十五分時，由克利浦多杜羅醫師為你做心電圖，這位醫師的辦公室就在你住的那幢大樓裡。我們那四個被病毒感染的人，最後都驗出來有心包炎反應。心臟超音波證實了我們最害怕的事，我得了心包炎。我的心包大量積水，在心臟四周包圍著膜狀纖維，並壓迫到心臟，引起強烈的疼痛。所以我又住回醫院去了。哈克曼再一次動用了關係幫我弄到一間私人病房，而奧黛莉也再度請依莎夫當我的全天私人看'
  - '[PAGE 290]


    護，而那些如潮水般進進出出的醫生和護士再度穿梭在我的房間中，每個人都拿著針頭在我身上抽血。上一次住院時，我很介意這些事，但是現在我嚇壞了。之前有毛病的是我的肺，現在有問題的是我的心臟。


    我的體溫一直往上竄升，從華氏一○○．三、一○○．九到華氏一○－．六度。我的身上插滿了各種注射針管，其中一條插在右手臂上注射著加入紅黴素的生理食鹽水，另一條插在左手臂上則注射著頭孢菌黴素。第三條插在身上的針管是一根導尿管，只是用來收集我膀胱中的尿液，卻是我最痛恨的一條針管。


    高德醫師是胸腔外科醫師，向我解釋目前可以選擇的治療方式。「舒華茲先生，」他說：「我們準備要試用抗生素來控制你體內的感染狀況，但如果你的心臟四周還是繼續積水的話，就必須動外科手術加以治療。「這是我最不想選擇的方案。


    當天晚間七點，奧黛莉來看我。在說完孩子們的事後，她提醒我尚·克勞德（Jean Claude）今天打了一整天電話找我。克勞德是不折不扣的寄生蟲，他是另一個專門介紹歐洲有錢人和熱門基金經理人接觸的掮客。不同於威利（在蘇黎世幫我找客戶的另一個掮客）的是，克勞德的辦公地點就在紐約市的世貿中心。如此一來，他可以隨時留意與他合作的基金經理人的動態，而他在瑞士當銀行家的哥哥尚·皮耶（Jean
    Pierre）則在歐洲幫他挖掘客戶。在過去的十個月當中，克勞德是一個令我討厭到極點的頭痛人物。他總是不斷打電話給我，在我做交易的時候打擾我，多嘴多舌地跟我說要怎樣才能讓基金操作得更好。「馬丁，你要好好操作，你的基金比起別的基金表現較'
  - '[PAGE 291]


    差，你的績效得更好才行！”


    克勞德告訴奧黛莉，他得立刻和我談一談，他希望知道我住的是哪家醫院，說要來看我。但他擔心的絕對不是我，他擔心的是自己的錢。奧黛莉不願意告訴他我住在哪家醫院，他開始有點發火了。


    「如果馬丁在本週結束前沒和我聯絡，我就要把客戶的錢轉到另一個願意回我電話的人那裡去。」


    我告訴奧黛莉不要理他。大約晚間九點，我突然覺得眼前一陣天旋地轉。「依莎，救命啊！」我尖聲叫著：「我快要死了！」接下來我只知道一部急救推車進了我的病房。


    依莎按下了緊急求助鈴。那些藥對我都沒有效果，我包裡的積水已經急速增加，直接壓迫到心臟。我的臉色發青，血壓降到只剩四〇·五。幾分鐘之內，一個急救小組已經圍繞在我床邊。我的頭旁邊有一位麻醉師、一位胸腔外科醫師伏在我的身體上，床腳則有一位心臟專家監看著心電圖，甚至有一位醫生連電擊器都準備好了。我身邊的人不停地大聲說話，喊叫著儀器上的讀數，並且下達指令。「血壓六〇∣八〇，還在下降中。」「給我五CC。」「血壓五五∣七〇。」「心跳一六〇，非常急促而微弱。」「血壓四〇∣五〇，我們快要失去他了。「搞什麼！失去我？」


    「救我，救我，請不要讓我死！」我氣若游絲地說著。腦海中浮起女兒和小兒子的臉孔。「求你，不要讓我死。」醫生開始將我的血壓穩定下來，但我的雙腿卻因為醫生將一些冰冷的液體打入體內而開始劇烈顫抖。我再度昏厥。


    我在一張往加護病房途中的擔架床上醒來，身上滿是連接管子的注射筒。一根導管從我脖子上切開的一個口子中接出來，在外面搖晃著。很幸運的，高德醫師也是工作狂。他剛剛才動完心臟'
  - '[PAGE 292]


    手術，一直忙到深夜，然後睡在醫院裡。當我看到他時，他只說了一句：「我們馬上動手吧！」


    高德醫師通知奧黛莉，準備馬上為我動手術，但是她必須照顧孩子無法抽身，只好打電話給她姊姊琳達，把她從睡夢中挖起來，等著她到我們家來。在此同時，我可能已經開始動手術，並且可能再也看不到她了。就在我要被推進手術室之前，一個非常美麗的護士對我說：「舒華茲先生，很抱歉，但是我們必須把你的結婚戒指拿下來，你不能戴著戒指進開刀房。」


    我是一個很傳統的人，平常總是隨身戴著結婚戒指。就算有些特殊狀況不得不拿下來時，心裡還是覺得我戴著它。婚後我的體重一路上升，手指頭上已經留下明顯的戒痕，我試著把戒指拿下
    來，但是沒有辦法。我被注射了太多的液體，而且臂膀和手指都因為吃藥而有些浮腫。那位護士用一些肥皂和水，很溫柔地把戒指從我手指上拿下來。我強忍著淚水，對她說：「拜託你把戒指拿給我太太，並且告訴她，我希望她能夠有機會把戒指再戴回我的手上。」


    # 那是報債機，還是我的心電圖？


    凌晨四點半，他們把我推進手術室。我平躺看著手術臺上的燈光逐漸放亮，心裡懷疑自己還能不能再看見陽光。他們把我從活動病床移到一個小小的手術臺上，我碩大的身軀幾乎沒有辦法配合它的大小。他們注射了另外一個針管到我左手背下面的靜脈裡。一位麻醉師開始用低沉、自信又平穩的語調在我耳邊說：「馬丁，我們現在要把你的手包起來。」我的右手臂被包裹起來並固定在'
  - '[PAGE 293]


    床單上，左手臂被包裹後放在我的身邊。「現在我們要把一個支架放在你的背部下方，這樣可以讓高德醫生看清楚下刀的部位。」當他們把那個支架放在定位時，我可以清楚感覺到它的堅硬和冰冷。「現在我們要在你的頭上蓋上保護巾。麻醉開始時，你會昏迷幾秒鐘。現在我要你從一百開始倒數。好，開始吧！九九、九八、九七……」當我數到九六時，身體裡有一陣瘋狂的感覺直衝到每一條神經。我看到白色的磁磚從面前飛過，速度愈來愈愈快，好像坐在一列不斷加速的雲霄飛車上。一陣乾渴的感覺將我從睡夢中喚醒，我的嘴巴比沙漠還要乾，腦子裡唯一想的就是能馬上喝一口水。我根本不管身上插滿的針管，那些針管和我身上的疼痛告訴我自已還活著。一個護士靠上前來。「早安，舒華茲先生。很高興你平安動完手術了。覺得怎麼樣？」「水。」我沙啞地說著。


    「不行，不行，還不能喝水。醫生馬上會來看你，然後我們會把你轉到加護病房去。」


    「痛！啊……好痛啊……」


    「這樣就好。疼痛表示你已經好多了。等一下你被送到加護病房時，他們會馬上幫你注射一些嗎啡。」


    我再度感到頭暈，在他們移動我的過程中，我只覺得四周叮噹聲響不絕於耳，就像身處於一個電動彈珠臺遊樂場裡，然後才發覺自己已經被送到加護病房，而那些嘈雜的聲音是來自病房中用來觀察每個生命垂危病人狀況的醫療儀器。掛在牆上的大型時鐘顯示十一點半。現在，我感覺好多了。一定是嗎啡發揮了藥效。'
  - '[PAGE 294]


    我開始觀察四周，檢查每一部放在我身旁的機器，試著看看機器上所顯示的數字到底代表什麼意義。雖然我身上安裝了一根導尿管，不管目前我能爭取回來的有多少，我還是不放棄重新建立一些對自己人生的控制權。我的注意力轉移到床邊的一個大型電視螢幕，上面顯示了五個子母畫面。一個心電圖持續在螢幕上跳動，下面是一個小格子，裡面用綠色的數位顯示著我的血壓（八二—一三四）、心跳速度（九八）、血液含氧量（九七），和血壓（八〇—一〇〇）。這些數字讓我想起了我的Qoura和Mepile報價機。我開始做一些呼吸練習，來測試一下我是不是能控制自己的血壓。我不停吸氣、吐氣、憋氣，眼睛盯著機器上的讀數，七八—一三，八六一三八。


    「馬丁，停止這麼做！」我太專注於那些儀器的螢幕，以至於沒有看到奧黛莉已經走進病房。她轉頭對跟著她一起進來的護士說：「你們這些人在幹什麼？他平常就是盯著螢幕過日子的。你們如果想讓他的血壓降下來的話，就快把這些該死的機器挪開。」那個護士照辦了。


    當你只能躺在床上盯著時鐘看時，時間似乎過得更慢了，而這正是我接下來五天裡唯一能做的事。當我在做交易時，從來不覺得有足夠的時間，總是希望時鐘能夠停下來等等我。現在，我在心裡不停催促時鐘走快一點，因為我知道隨著時間逝去，我的情況就會逐漸恢復正常。我的目標是先把體溫降下來，然後回家過感恩節。


    而我真的辦到了。二十二日是星期四，感恩節當天奧黛莉來接我回家。我沒有力氣坐在餐桌旁用餐，藥物治療使我仍然不很穩定，但是至少已經出院和家人團聚。我已經很心滿意足了。'
  - '[PAGE 295]


    其實，他們並不在乎你的死活


    整個週末，我都在整理上週不在時所堆積下來的郵件。一封蘇黎塞來的信說道：「請貴公司照本人先前指示，將本人所持有之沙伯林納海外基金全數贖回……」巴格瓦、奇德與皮博迪公司的來信說：「本人在此請貴公司贖回本人持有之沙伯林納海外基金……」開曼群島來的信中提至：「請照本人於十一月十三日去電中之指示，確實贖回所有持份……」來自巴哈馬的郵件也寫道：「謹以此信通知您本人將要求贖回本人之持份……」「我們要求「立即「贖回所有持份，最晚期限為一九〇年十二月三十一日……」「本人將於年底取回所有投資於貴處之資金，本人對貴基金操作風險之高深感不安……」最後，有一封來自芝加哥的信說：「請將本信視為豪斯曼國際公司之正式通知，本公司已決定將貴處之帳戶完全結清，並終止原先之協定……」又有另外七個投資人，包括豪斯曼和另外總額達五百萬美元的資金從我的基金中抽走。你想像不到其中竟然沒有一封信寫道：「附註：希望你早日康复。」他們真正在意的只是自己的錢罷了。


    我希望他們是最後一批要贖回沙伯林納海外基金的投資人，可惜我又錯了。十二月二十六日星期一早上，又有一堆傳真、信件和快遞送到雷克辛頓街七五〇號，裡面全都是壞消息。巴基斯坦的客戶要求贖回。我在巴拿馬的投資人用西班牙文告訴我：「再見！」來自世界各地的投資人都用他們的母語告訴我一句話：「再見！」我的基金在一個月之內從七千萬美元的規模一下子縮水成四五百萬美元，而我還得繼續撐過十二月。'
  md: '

    請惠予協助將本人於沙伯林納海外基金中之持份贖回。万分感謝。


    其實有兩個投資人在十月份就已經通知我，準備贖回他們的基金持份，但是他們都有其他的理由。這封傳真代表的是第一個因為對我的投資績效不滿，而決定贖回基金持份的投資人。


    我累得倒在沙發裡，連起身看市場收盤狀況的力氣都沒有，只想好好睡一覺，但是我的老友麥克·施密斯（Mags Smith）正要來拜訪我。施密斯打算要經營自己的基金公司，想向我尋求一些建議。他在五點半到達，我告訴他自己之前如何募集資金，還讓他看一看我過去一年的操作績效，當他準備離開時，我說：「利用他人的資金是你想要賺大錢的不二法門，但其中也有一些難以避免的壞處。每個人都在身後監視著你的一舉一動，而永遠沒有一個人會對你的績效感到滿意。他們總是不斷打電話來問東問西：『我的資金操作得怎樣啦？』不管你對他們說什麼都沒有用。他們總是貪得無厭。」


    到了週末，我一直睡到上午十一點才起床。奧黛莉已經帶孩子們去參觀書展了，而我打算中午和他們會合，但是我一點力氣都沒有，覺得自己好像快要因感冒而病倒了。我知道必須努力對抗病魔，因為我沒時間生病，有太多事情要做。我得補畫技術圖、計算各項技術指標，並且想好星期一要採取的操作策略。


    我到達書展現場時，氣溫上升到暖和的華氏七十五度，但我出了一身汗。我走進會場時，覺得頭暈暈，而且頭痛得不得了，幾乎沒有辦法繼續邁出腳步。書展上到處是老師和閱覽者光臨的人潮，裡面一點空調都沒有，一堆小孩在我四周奔跑、嬉戲、推擠、尖叫著。我不知道是否有力氣走上階梯，這些年來，我的體重已經增加到二○八磅，比在陸戰隊時苗條而結實的體型重了二十三磅，我現在可是清清楚楚地感受到每一磅肉在我身上所造成的負擔。


    那天晚上我們到六十八街的戲院去看電影，戲院裡的空氣令人窒息。戲院大廳有一個寫著因為歲修關掉空調而向觀眾道歉的告示牌。在等電影開演時，我已經汗流浹背，或許我應該在看到告示牌時，就推算出進戲院後會遇到的狀況，但我已經病得沒有辦法做任何聯想了。奧黛莉想帶我回家，但我不想。「算了吧！」我說：「我們已經付了電影票錢了，我能挺得住，我是陸戰隊員。」


    星期日，我躺在沙發上研究技術圖，為星期一的操作做準備，但身體狀況糟糕透了。我該去度假的，但如果我想保住投資人，就沒有時間去度假。星期一，我一起床就感到喉嚨沙啞、全身痠痛。「去他的陸戰隊！」我跟奧黛莉說：「我得去看醫生。」我和家庭醫生哈克曼約好十點鐘門診。他說我被病毒感染，開了一些含抗生素的藥，命令我躺在床上休息。


    我吃了抗生素，卻沒有辦法休息。我得繼續為沙伯林納基金操盤，得在這個月賺到一筆大錢。可是我根本累得沒辦法交易，所以倒在沙發上收看「金融新聞網」（Financial
    News Network）。


    ## 病了？我們要把資金贖回，謝謝


    到了星期二，我還是只能整天倒在沙發上看金融新聞網。我試著做了幾筆交易，但都不成功，總共賠了三萬美元。下午五點半，後背和前胸的疼痛已經到了難以忍受的狀況，這是我一生中頭一回覺得自己快要死了。奧黛莉打電話給哈克曼，但因為已經超過五點，他的同事安排我在六點半給急診醫生辛（Singer）看門診。我掙扎著從床上爬起來、穿上衣服，然後鑽進一部計程車裡。


    辛醫師直到七點十五分才出現。他看到我時，我的體溫已經高達華氏105度，心電圖讀數也相當不正常，他勸我最好住院做深入檢查。諷刺的是，正如我和人面獅身在十八年前所預測的一樣，真要感謝健康保險和醫療給付制度，讓每個掛急診的人都得待在急診室外面等待，即使我付了數以百萬計的稅，而且只住在八條街的距離外，還是因為沒有病房而無法住進紐約市立醫院。我被推進急診室時，他們根本什麼都沒做，除非你遭到槍擊、被刀刺傷或是發了精神病，否則急診室裡的工作人員根本連正眼都不會瞧你一下。


    辛醫師照理應該在我們到達後立刻想到醫院的，但他再一次遲到了，直到九點十五分左右，他仍然沒出現。到了十點整，我已經氣得沒有心思去害怕了。「讓我們離開這個鬼地方。」我告訴奧黛莉：「我恨這個鳥城市！」那一夜，我就在廚房的桌子上抱著四個枕頭勉強入睡，姿勢看起來就像一個虔誠禱告的修士，但這卻是我在當時唯一能夠用來克服肺部壓力的方法。


    到了星期三，我的病情一點也沒有好轉，在讀完兩封傳真後，覺得更糟了。其中一封傳真來自倫敦的亞伯特·貝克渥，另一封來自巴黎的皮耶·莫德。第一封的內容很唐突：


    - 請將本傳真視為本人贖回所持有之沙伯林納海外基金持份之正式通知。生效日為一九九一年一月一日。


    第二封的開頭客氣多了：


    - 早安。我們想賣出一〇二九．八五五單位的沙伯林納海外基金。請以傳真或電報告知我們應採取哪些手續以配合貴處之作業，謝謝。


    水手們已經開始棄船了。我真想回覆他：「早安，拿著你們的一〇二九．八五五單位的基金，塞到你們的臭嘴巴裡，這就是我要請你們配合的事。」但是我沒有力氣去回這封傳真。


    你這個白癡，你不是住院了嗎？


    當天早上，我們又到哈克曼的診所去看病。壞消息是我的感冒已經轉為肺炎了，而且兩個肺葉都有積水。好消息則是哈克曼動用了一些關係，幫我弄到一間私人病房。奧黛莉雇用了全天候的私人護士，要價每天七千五百美元，但在那種情況下，我才不在乎！我得要有人仔細地照顧我，需要專門幫我戰勝病魔的人。通常這個人會是奧黛莉，但她沒辦法整天寸步不離地守著我，她得在家裡陪著孩子們。


    現在我終於住進了病房，一大堆的醫生和護士川流不息地進進出出，每個人手上都拿著注射針筒，開始不停在身上抽血、抽血、再抽血。他們在我身旁放了一個架子，以便我如果病情好轉想起床時可以支撐。一直問醫生到底怎麼一回事，而他們根本不理我，他們不在乎我是不是冠軍操盤手，在這裡，我不過是另一個病人。感謝私人看護依莎，依莎從來不會讓那些醫生不看我一眼就走開，在她了解醫生要採用什麼樣的醫療程序前也不會讓他們碰我一下。她不停地看著我的心電圖、檢視醫療儀器、仔細地向醫生詢問、對付那些護士，並且持續問我感覺怎麼樣。


    醫生和護士一直在我身邊來來去去，打針、打針、再打針。依莎告訴我，他們之所以要抽這麼多血，是因為要確定病因是細菌或病毒。紐約市立醫院傳染性疾病科的主任親自檢驗我的病例，依莎說這位主任之所以這麼關心，是因為在過去四個月中，他已經在醫院裡看過四個相同的病患，這四個病例都是病毒性感染。


    「舒華茲先生，」依莎向我解釋：「如果你的病因是細菌性感染，他們可以利用抗生素來治療。但如果是病毒感染的話，就只能任由病毒自由發展下去了。」


    「那，他們準備怎麼做？」我說。


    「他們會開始由靜脈注射紅黴素，那是一種用來治療呼吸道感染的抗生素，另外也會幫你注射頭孢菌黴素，那是一種用來治療支氣管和喉嚨感染的抗生素，還有……」好了，好了，事情已經很清楚，在依莎向我說明完畢前，我的手臂上已經多了幾支針筒。


    藥物終於發生作用了。整個晚上直到次日早晨，它們開始擊退病魔。到了九月星期五下午，我已經覺得好一些了。兩點四十五分，依莎還沒推我樓下去照X光之前，我打電話給芝加哥的經紀商艾維．高費德（Ar.
    Goldfield）。因為當時的利率水準很低，所以我相當看多，而我也帶著Newer隨身型報價機，這個像呼叫器一樣的小東西，可以提供二十四小時不間斷的期貨報價，所以我知道目前的市場狀況如何。「高費德，」我試圖以平常的聲調說話：「幫我用市價買進四百口十二月的契約。」


    「我剛剛買進了四百口三十年美國政府公債期貨契約。根據報價機上所顯示的價格，我的進場價可能會在九二二四，這表示價格是92-24，或者可以說契約總值為九二七五○美元。」


    「馬丁，你確定嗎？」高費德說。「你是不是應該在休息中？」


    「是啊，我很確定。事實上，幫我改成買進六百口吧！」


    「馬丁，你這個白癡！你不是已經住院了嗎？你在搞什麼鬼啊？嘿，你最不需要的東西就是額外的壓力。」通常，我會對高費德大吼一頓，然後叫他照我的話做，但是現在我已經虛弱到沒有力氣爭論了。


    「好吧，那只要幫我買進四百口就好了。可是我要你馬上就給我買進。」


    整個週末，我的身體狀況不斷改善，當體溫下降到華氏九九．八度時，公債期貨的價格也上漲到九三○一了。當市場在十二月十二日星期一開盤時，我賣出了那四百口期貨契約，並賺進十一萬二千五百美元的利潤。果然，賣出了那些債券期貨讓我臉上恢復了血色，我告訴哈克曼醫生自己希望回家。又有另外兩個沙伯林納海外基金的投資人通知我要贖回資金了，因為新的資金分配（五○%投入期貨市場，五○%投入股票市場），對他們來說風險太高。我得開始想辦法賺一些真正的大錢。


    哈克曼同意讓我出院，所以奧黛莉在十三日星期二的早晨到醫院接我回家。那天我一直從下午工作到晚上，補畫技術圖形、計算技術指標，試著讓一切回復到我能控制的狀態下。我在大約十點上床就寢，並且馬上進入夢鄉，但是在星期三的凌晨一點半時，卻因胸劇痛從睡夢中醒來。這種疼痛是我以前從來沒有經歷過的，一陣強烈的刺痛從我的心臟穿刺而過。我不認為是心臟病發作，但每呼吸一次，就會引起一陣陣深入脊骨的疼痛。奧黛莉開始為我按摩胸部，試著減輕我的痛苦，但似乎沒有什麼效果。我們打電話給哈克曼診所裡的服务人員。醫生總算在凌晨四點回電，奧黛莉向他詳細敘述我的情況。「先讓他吃兩顆止痛藥減輕疼痛，再吃兩顆鎮靜劑幫助入睡，拿一張電熱毯放在胸口保溫，我明天一早再打電話給你們。」我終於入睡，然後在早晨七點半醒來，全身都被汗水浸透。


    ## 他住哪家醫院？我想去問他績效如何......


    到了九點，哈克曼打電話來。「馬丁，我不希望你四處走動。」他說：「我已經安排好十點四十五分時，由克利浦多杜羅醫師為你做心電圖，這位醫師的辦公室就在你住的那幢大樓裡。」我們那四個被病毒感染的人，最後都驗出來有心包炎反應。心臟超音波證實了我們最害怕的事，我得了心包炎。我的心包大量積水，在心臟四周包圍著膜狀纖維，並壓迫到心臟，引起強烈的疼痛。所以我又住回醫院去了。哈克曼再一次動用了關係幫我弄到一間私人病房，而奧黛莉也再度請依莎夫當我的全天私人看護，而那些如潮水般進進出出的醫生和護士再度穿梭在我的房間中，每個人都拿著針頭在我身上抽血。上一次住院時，我很介意這些事，但是現在我嚇壞了。之前有毛病的是我的肺，現在有問題的是我的心臟。


    我的體溫一直往上竄升，從華氏一○○．三、一○○．九到華氏一○一點六度。我的身上插滿了各種注射針管，其中一條插在右手臂上注射著加入紅黴素的生理食鹽水，另一條插在左手臂上則注射著頭孢菌黴素。第三條插在身上的針管是一根導尿管，只是用來收集我膀胱中的尿液，卻是我最痛恨的一條針管。


    高德醫師是胸腔外科醫師，向我解釋目前可以選擇的治療方式。「舒華茲先生，」他說：「我們準備要試用抗生素來控制你體內的感染狀況，但如果你的心臟四周還是繼續積水的話，就必須動外科手術加以治療。」這是我最不想選擇的方案。


    當天晚間七點，奧黛莉來看我。在說完孩子們的事後，她提醒我尚·克勞德（Jean Claude）今天打了一整天電話找我。克勞德是不折不扣的寄生蟲，他是另一個專門介紹歐洲有錢人和熱門基金經理人接觸的掮客。不同於威利（在蘇黎世幫我找客戶的另一個掮客）的是，克勞德的辦公地點就在紐約市的世貿中心。如此一來，他可以隨時留意與他合作的基金經理人的動態，而他在瑞士當銀行家的哥哥尚·皮耶（Jean
    Pierre）則在歐洲幫他挖掘客戶。在過去的十個月當中，克勞德是一個令我討厭到極點的頭痛人物。他總是不斷打電話給我，在我做交易的時候打擾我，多嘴多舌地跟我說要怎樣才能讓基金操作得更好。「馬丁，你要好好操作，你的基金比起別的基金表現較差，你的績效得更好才行！」


    克勞德告訴奧黛莉，他得立刻和我談一談，他希望知道我住的是哪家醫院，說要來看我。但他擔心的絕對不是我，他擔心的是自己的錢。奧黛莉不願意告訴他我住在哪家醫院，他開始有點發火了。


    「如果馬丁在本週結束前沒和我聯絡，我就要把客戶的錢轉到另一個願意回我電話的人那裡去。」


    我告訴奧黛莉不要理他。大約晚間九點，我突然覺得眼前一陣天旋地轉。「依莎，救命啊！」我尖聲叫著：「我快要死了！」接下來我只知道一部急救推車進了我的病房。


    依莎按下了緊急求助鈴。那些藥對我都沒有效果，我包裡的積水已經急速增加，直接壓迫到心臟。我的臉色發青，血壓降到只剩四〇∣五〇。幾分鐘之內，一個急救小組已經圍繞在我床邊。我的頭旁邊有一位麻醉師、一位胸腔外科醫師伏在我的身體上，床腳則有一位心臟專家監看著心電圖，甚至有一位醫生連電擊器都準備好了。我身邊的人不停地大聲說話，喊叫著儀器上的讀數，並且下達指令。


    - 血壓六〇∣八〇，還在下降中。

    - 給我五CC。

    - 血壓五五∣七〇。

    - 心跳一六〇，非常急促而微弱。

    - 血壓四〇∣五〇，我們快要失去他了。


    「搞什麼！失去我？」


    「救我，救我，請不要讓我死！」我氣若游絲地說著。腦海中浮起女兒和小兒子的臉孔。「求你，不要讓我死。」醫生開始將我的血壓穩定下來，但我的雙腿卻因為醫生將一些冰冷的液體打入體內而開始劇烈顫抖。我再度昏厥。


    我在一張往加護病房途中的擔架床上醒來，身上滿是連接管子的注射筒。一根導管從我脖子上切開的一個口子中接出來，在外面搖晃著。很幸運的，高德醫師也是工作狂。他剛剛才動完心臟手術，一直忙到深夜，然後睡在醫院裡。當我看到他時，他只說了一句：「我們馬上動手吧！」


    ## 那是報價機，還是我的心電圖？


    高德醫師通知奧黛莉，準備馬上為我動手術，但是她必須照顧孩子無法抽身，只好打電話給她姊姊琳達，把她從睡夢中挖起來，等著她到我們家來。在此同時，我可能已經開始動手術，並且可能再也看不到她了。就在我要被推進手術室之前，一個非常美麗的護士對我說：「舒華茲先生，很抱歉，但是我們必須把你的結婚戒指拿下來，你不能戴著戒指進開刀房。」


    我是一個很傳統的人，平常總是隨身戴著結婚戒指。就算有些特殊狀況不得不拿下來時，心裡還是覺得我戴著它。婚後我的體重一路上升，手指頭上已經留下明顯的戒痕，我試著把戒指拿下來，但是沒有辦法。我被注射了太多的液體，而且臂膀和手指都因為吃藥而有些浮腫。那位護士用一些肥皂和水，很溫柔地把戒指從我手指上拿下來。我強忍著淚水，對她說：「拜託你把戒指拿給我太太，並且告訴她，我希望她能夠有機會把戒指再戴回我的手上。」


    凌晨四點半，他們把我推進手術室。我平躺看著手術臺上的燈光逐漸放亮，心裡懷疑自己還能不能再看見陽光。他們把我從活動病床移到一個小小的手術臺上，我碩大的身軀幾乎沒有辦法配合它的大小。他們注射了另外一個針管到我左手背下面的靜脈裡。一位麻醉師開始用低沉、自信又平穩的語調在我耳邊說：「馬丁，我們現在要把你的手包起來。」我的右手臂被包裹起來並固定在床單上，左手臂被包裹後放在我的身邊。「現在我們要把一個支架放在你的背部下方，這樣可以讓高德醫生看清楚下刀的部位。」當他們把那個支架放在定位時，我可以清楚感覺到它的堅硬和冰冷。「現在我們要在你的頭上蓋上保護巾。麻醉開始時，你會昏迷幾秒鐘。現在我要你從一百開始倒數。好，開始吧！九九、九八、九七……」當我數到九六時，身體裡有一陣瘋狂的感覺直衝到每一條神經。我看到白色的磁磚從面前飛過，速度愈來愈快，好像坐在一列不斷加速的雲霄飛車上。


    一陣乾渴的感覺將我從睡夢中喚醒，我的嘴巴比沙漠還要乾，腦子裡唯一想的就是能馬上喝一口水。我根本不管身上插滿的針管，那些針管和我身上的疼痛告訴我自已還活著。一個護士靠上前來。「早安，舒華茲先生。很高興你平安動完手術了。覺得怎麼樣？」


    「水。」我沙啞地說著。


    「不行，不行，還不能喝水。醫生馬上會來看你，然後我們會把你轉到加護病房去。」


    「痛！啊……好痛啊……」


    「這樣就好。疼痛表示你已經好多了。等一下你被送到加護病房時，他們會馬上幫你注射一些嗎啡。」


    我再度感到頭暈，在他們移動我的過程中，我只覺得四周叮噹聲響不絕於耳，就像身處於一個電動彈珠臺遊樂場裡，然後才發覺自己已經被送到加護病房，而那些嘈雜的聲音是來自病房中用來觀察每個生命垂危病人狀況的醫療儀器。掛在牆上的大型時鐘顯示十一點半。現在，我感覺好多了。一定是嗎啡發揮了藥效。


    我開始觀察四周，檢查每一部放在我身旁的機器，試著看看機器上所顯示的數字到底代表什麼意義。雖然我身上安裝了一根導尿管，不管目前我能爭取回來的有多少，我還是不放棄重新建立一些對自己人生的控制權。我的注意力轉移到床邊的一個大型電視螢幕，上面顯示了五個子母畫面。一個心電圖持續在螢幕上跳動，下面是一個小格子，裡面用綠色的數位顯示著我的血壓（八二—一一四）、心跳速度（九八）、血液含氧量（九七），和血壓（八〇—一〇〇）。這些數字讓我想起了我的Quora和Mepile報價機。我開始做一些呼吸練習，來測試一下我是不是能控制自己的血壓。我不停吸氣、吐氣、憋氣，眼睛盯著機器上的讀數，七八—一三，八六一三八。


    「馬丁，停止這麼做！」我太專注於那些儀器的螢幕，以至於沒有看到奧黛莉已經走進病房。她轉頭對跟著她一起進來的護士說：「你們這些人在幹什麼？他平常就是盯著螢幕過日子的。你們如果想讓他的血壓降下來的話，就快把這些該死的機器挪開。」那個護士照辦了。


    當你只能躺在床上盯著時鐘看時，時間似乎過得更慢了，而這正是我接下來五天裡唯一能做的事。當我在做交易時，從來不覺得有足夠的時間，總是希望時鐘能夠停下來等等我。現在，我在心裡不停催促時鐘走快一點，因為我知道隨著時間逝去，我的情況就會逐漸恢復正常。我的目標是先把體溫降下來，然後回家過感恩節。


    而我真的辦到了。二十二日是星期四，感恩節當天奧黛莉來接我回家。我沒有力氣坐在餐桌旁用餐，藥物治療使我仍然不很穩定，但是至少已經出院和家人團聚。我已經很心滿意足了。


    ## 其實，他們並不在乎你的死活


    整個週末，我都在整理上週不在時所堆積下來的郵件。


    - 一封蘇黎塞來的信說道：「請貴公司照本人先前指示，將本人所持有之沙伯林納海外基金全數贖回……」

    - 巴格瓦、奇德與皮博迪公司的來信說：「本人在此請貴公司贖回本人持有之沙伯林納海外基金……」

    - 開曼群島來的信中提至：「請照本人於十一月十三日去電中之指示，確實贖回所有持份……」

    - 來自巴哈馬的郵件也寫道：「謹以此信通知您本人將要求贖回本人之持份……」

    - 「我們要求『立即』贖回所有持份，最晚期限為一九九〇年十二月三十一日……」

    - 「本人將於年底取回所有投資於貴處之資金，本人對貴基金操作風險之高深感不安……」

    - 最後，有一封來自芝加哥的信說：「請將本信視為豪斯曼國際公司之正式通知，本公司已決定將貴處之帳戶完全結清，並終止原先之協定……」


    又有另外七個投資人，包括豪斯曼和另外總額達五百萬美元的資金從我的基金中抽走。你想像不到其中竟然沒有一封信寫道：「附註：希望你早日康复。」他們真正在意的只是自己的錢罷了。


    我希望他們是最後一批要贖回沙伯林納海外基金的投資人，可惜我又錯了。十二月二十六日星期一早上，又有一堆傳真、信件和快遞送到雷克辛頓街七五〇號，裡面全都是壞消息。巴基斯坦的客戶要求贖回。我在巴拿馬的投資人用西班牙文告訴我：「再見！」來自世界各地的投資人都用他們的母語告訴我一句話：「再見！」我的基金在一個月之內從七千萬美元的規模一下子縮水成四五百萬美元，而我還得繼續撐過十二月。

    '
  mdcn: '

    請惠予協助將本人於沙伯林納海外基金中之持份贖回。万分感謝。


    其實有兩個投資人在十月份就已經通知我，準備贖回他們的基金持份，但是他們都有其他的理由。這封傳真代表的是第一個因為對我的投資績效不滿，而決定贖回基金持份的投資人。


    我累得倒在沙發裡，連起身看市場收盤狀況的力氣都沒有，只想好好睡一覺，但是我的老友麥克·施密斯（Mags Smith）正要來拜訪我。施密斯打算要經營自己的基金公司，想向我尋求一些建議。他在五點半到達，我告訴他自己之前如何募集資金，還讓他看一看我過去一年的操作績效，當他準備離開時，我說：「利用他人的資金是你想要賺大錢的不二法門，但其中也有一些難以避免的壞處。每個人都在身後監視著你的一舉一動，而永遠沒有一個人會對你的績效感到滿意。他們總是不斷打電話來問東問西：『我的資金操作得怎樣啦？』不管你對他們說什麼都沒有用。他們總是貪得無厭。」


    到了週末，我一直睡到上午十一點才起床。奧黛莉已經帶孩子們去參觀書展了，而我打算中午和他們會合，但是我一點力氣都沒有，覺得自己好像快要因感冒而病倒了。我知道必須努力對抗病魔，因為我沒時間生病，有太多事情要做。我得補畫技術圖、計算各項技術指標，並且想好星期一要採取的操作策略。


    我到達書展現場時，氣溫上升到暖和的華氏七十五度，但我出了一身汗。我走進會場時，覺得頭暈暈，而且頭痛得不得了，幾乎沒有辦法繼續邁出腳步。書展上到處是老師和閱覽者光臨的人潮，裡面一點空調都沒有，一堆小孩在我四周奔跑、嬉戲、推擠、尖叫著。我不知道是否有力氣走上階梯，這些年來，我的體重已經增加到二○八磅，比在陸戰隊時苗條而結實的體型重了二十三磅，我現在可是清清楚楚地感受到每一磅肉在我身上所造成的負擔。


    那天晚上我們到六十八街的戲院去看電影，戲院裡的空氣令人窒息。戲院大廳有一個寫著因為歲修關掉空調而向觀眾道歉的告示牌。在等電影開演時，我已經汗流浹背，或許我應該在看到告示牌時，就推算出進戲院後會遇到的狀況，但我已經病得沒有辦法做任何聯想了。奧黛莉想帶我回家，但我不想。「算了吧！」我說：「我們已經付了電影票錢了，我能挺得住，我是陸戰隊員。」


    星期日，我躺在沙發上研究技術圖，為星期一的操作做準備，但身體狀況糟糕透了。我該去度假的，但如果我想保住投資人，就沒有時間去度假。星期一，我一起床就感到喉嚨沙啞、全身痠痛。「去他的陸戰隊！」我跟奧黛莉說：「我得去看醫生。」我和家庭醫生哈克曼約好十點鐘門診。他說我被病毒感染，開了一些含抗生素的藥，命令我躺在床上休息。


    我吃了抗生素，卻沒有辦法休息。我得繼續為沙伯林納基金操盤，得在這個月賺到一筆大錢。可是我根本累得沒辦法交易，所以倒在沙發上收看「金融新聞網」（Financial
    News Network）。


    ## 病了？我們要把資金贖回，謝謝


    到了星期二，我還是只能整天倒在沙發上看金融新聞網。我試著做了幾筆交易，但都不成功，總共賠了三萬美元。下午五點半，後背和前胸的疼痛已經到了難以忍受的狀況，這是我一生中頭一回覺得自己快要死了。奧黛莉打電話給哈克曼，但因為已經超過五點，他的同事安排我在六點半給急診醫生辛（Singer）看門診。我掙扎著從床上爬起來、穿上衣服，然後鑽進一部計程車裡。


    辛醫師直到七點十五分才出現。他看到我時，我的體溫已經高達華氏105度，心電圖讀數也相當不正常，他勸我最好住院做深入檢查。諷刺的是，正如我和人面獅身在十八年前所預測的一樣，真要感謝健康保險和醫療給付制度，讓每個掛急診的人都得待在急診室外面等待，即使我付了數以百萬計的稅，而且只住在八條街的距離外，還是因為沒有病房而無法住進紐約市立醫院。我被推進急診室時，他們根本什麼都沒做，除非你遭到槍擊、被刀刺傷或是發了精神病，否則急診室裡的工作人員根本連正眼都不會瞧你一下。


    辛醫師照理應該在我們到達後立刻想到醫院的，但他再一次遲到了，直到九點十五分左右，他仍然沒出現。到了十點整，我已經氣得沒有心思去害怕了。「讓我們離開這個鬼地方。」我告訴奧黛莉：「我恨這個鳥城市！」那一夜，我就在廚房的桌子上抱著四個枕頭勉強入睡，姿勢看起來就像一個虔誠禱告的修士，但這卻是我在當時唯一能夠用來克服肺部壓力的方法。


    到了星期三，我的病情一點也沒有好轉，在讀完兩封傳真後，覺得更糟了。其中一封傳真來自倫敦的亞伯特·貝克渥，另一封來自巴黎的皮耶·莫德。第一封的內容很唐突：


    - 請將本傳真視為本人贖回所持有之沙伯林納海外基金持份之正式通知。生效日為一九九一年一月一日。


    第二封的開頭客氣多了：


    - 早安。我們想賣出一〇二九．八五五單位的沙伯林納海外基金。請以傳真或電報告知我們應採取哪些手續以配合貴處之作業，謝謝。


    水手們已經開始棄船了。我真想回覆他：「早安，拿著你們的一〇二九．八五五單位的基金，塞到你們的臭嘴巴裡，這就是我要請你們配合的事。」但是我沒有力氣去回這封傳真。


    你這個白癡，你不是住院了嗎？


    當天早上，我們又到哈克曼的診所去看病。壞消息是我的感冒已經轉為肺炎了，而且兩個肺葉都有積水。好消息則是哈克曼動用了一些關係，幫我弄到一間私人病房。奧黛莉雇用了全天候的私人護士，要價每天七千五百美元，但在那種情況下，我才不在乎！我得要有人仔細地照顧我，需要專門幫我戰勝病魔的人。通常這個人會是奧黛莉，但她沒辦法整天寸步不離地守著我，她得在家裡陪著孩子們。


    現在我終於住進了病房，一大堆的醫生和護士川流不息地進進出出，每個人手上都拿著注射針筒，開始不停在身上抽血、抽血、再抽血。他們在我身旁放了一個架子，以便我如果病情好轉想起床時可以支撐。一直問醫生到底怎麼一回事，而他們根本不理我，他們不在乎我是不是冠軍操盤手，在這裡，我不過是另一個病人。感謝私人看護依莎，依莎從來不會讓那些醫生不看我一眼就走開，在她了解醫生要採用什麼樣的醫療程序前也不會讓他們碰我一下。她不停地看著我的心電圖、檢視醫療儀器、仔細地向醫生詢問、對付那些護士，並且持續問我感覺怎麼樣。


    醫生和護士一直在我身邊來來去去，打針、打針、再打針。依莎告訴我，他們之所以要抽這麼多血，是因為要確定病因是細菌或病毒。紐約市立醫院傳染性疾病科的主任親自檢驗我的病例，依莎說這位主任之所以這麼關心，是因為在過去四個月中，他已經在醫院裡看過四個相同的病患，這四個病例都是病毒性感染。


    「舒華茲先生，」依莎向我解釋：「如果你的病因是細菌性感染，他們可以利用抗生素來治療。但如果是病毒感染的話，就只能任由病毒自由發展下去了。」


    「那，他們準備怎麼做？」我說。


    「他們會開始由靜脈注射紅黴素，那是一種用來治療呼吸道感染的抗生素，另外也會幫你注射頭孢菌黴素，那是一種用來治療支氣管和喉嚨感染的抗生素，還有……」好了，好了，事情已經很清楚，在依莎向我說明完畢前，我的手臂上已經多了幾支針筒。


    藥物終於發生作用了。整個晚上直到次日早晨，它們開始擊退病魔。到了九月星期五下午，我已經覺得好一些了。兩點四十五分，依莎還沒推我樓下去照X光之前，我打電話給芝加哥的經紀商艾維．高費德（Ar.
    Goldfield）。因為當時的利率水準很低，所以我相當看多，而我也帶著Newer隨身型報價機，這個像呼叫器一樣的小東西，可以提供二十四小時不間斷的期貨報價，所以我知道目前的市場狀況如何。「高費德，」我試圖以平常的聲調說話：「幫我用市價買進四百口十二月的契約。」


    「我剛剛買進了四百口三十年美國政府公債期貨契約。根據報價機上所顯示的價格，我的進場價可能會在九二二四，這表示價格是92-24，或者可以說契約總值為九二七五○美元。」


    「馬丁，你確定嗎？」高費德說。「你是不是應該在休息中？」


    「是啊，我很確定。事實上，幫我改成買進六百口吧！」


    「馬丁，你這個白癡！你不是已經住院了嗎？你在搞什麼鬼啊？嘿，你最不需要的東西就是額外的壓力。」通常，我會對高費德大吼一頓，然後叫他照我的話做，但是現在我已經虛弱到沒有力氣爭論了。


    「好吧，那只要幫我買進四百口就好了。可是我要你馬上就給我買進。」


    整個週末，我的身體狀況不斷改善，當體溫下降到華氏九九．八度時，公債期貨的價格也上漲到九三○一了。當市場在十二月十二日星期一開盤時，我賣出了那四百口期貨契約，並賺進十一萬二千五百美元的利潤。果然，賣出了那些債券期貨讓我臉上恢復了血色，我告訴哈克曼醫生自己希望回家。又有另外兩個沙伯林納海外基金的投資人通知我要贖回資金了，因為新的資金分配（五○%投入期貨市場，五○%投入股票市場），對他們來說風險太高。我得開始想辦法賺一些真正的大錢。


    哈克曼同意讓我出院，所以奧黛莉在十三日星期二的早晨到醫院接我回家。那天我一直從下午工作到晚上，補畫技術圖形、計算技術指標，試著讓一切回復到我能控制的狀態下。我在大約十點上床就寢，並且馬上進入夢鄉，但是在星期三的凌晨一點半時，卻因胸劇痛從睡夢中醒來。這種疼痛是我以前從來沒有經歷過的，一陣強烈的刺痛從我的心臟穿刺而過。我不認為是心臟病發作，但每呼吸一次，就會引起一陣陣深入脊骨的疼痛。奧黛莉開始為我按摩胸部，試著減輕我的痛苦，但似乎沒有什麼效果。我們打電話給哈克曼診所裡的服务人員。醫生總算在凌晨四點回電，奧黛莉向他詳細敘述我的情況。「先讓他吃兩顆止痛藥減輕疼痛，再吃兩顆鎮靜劑幫助入睡，拿一張電熱毯放在胸口保溫，我明天一早再打電話給你們。」我終於入睡，然後在早晨七點半醒來，全身都被汗水浸透。


    ## 他住哪家醫院？我想去問他績效如何......


    到了九點，哈克曼打電話來。「馬丁，我不希望你四處走動。」他說：「我已經安排好十點四十五分時，由克利浦多杜羅醫師為你做心電圖，這位醫師的辦公室就在你住的那幢大樓裡。」我們那四個被病毒感染的人，最後都驗出來有心包炎反應。心臟超音波證實了我們最害怕的事，我得了心包炎。我的心包大量積水，在心臟四周包圍著膜狀纖維，並壓迫到心臟，引起強烈的疼痛。所以我又住回醫院去了。哈克曼再一次動用了關係幫我弄到一間私人病房，而奧黛莉也再度請依莎夫當我的全天私人看護，而那些如潮水般進進出出的醫生和護士再度穿梭在我的房間中，每個人都拿著針頭在我身上抽血。上一次住院時，我很介意這些事，但是現在我嚇壞了。之前有毛病的是我的肺，現在有問題的是我的心臟。


    我的體溫一直往上竄升，從華氏一○○．三、一○○．九到華氏一○一點六度。我的身上插滿了各種注射針管，其中一條插在右手臂上注射著加入紅黴素的生理食鹽水，另一條插在左手臂上則注射著頭孢菌黴素。第三條插在身上的針管是一根導尿管，只是用來收集我膀胱中的尿液，卻是我最痛恨的一條針管。


    高德醫師是胸腔外科醫師，向我解釋目前可以選擇的治療方式。「舒華茲先生，」他說：「我們準備要試用抗生素來控制你體內的感染狀況，但如果你的心臟四周還是繼續積水的話，就必須動外科手術加以治療。」這是我最不想選擇的方案。


    當天晚間七點，奧黛莉來看我。在說完孩子們的事後，她提醒我尚·克勞德（Jean Claude）今天打了一整天電話找我。克勞德是不折不扣的寄生蟲，他是另一個專門介紹歐洲有錢人和熱門基金經理人接觸的掮客。不同於威利（在蘇黎世幫我找客戶的另一個掮客）的是，克勞德的辦公地點就在紐約市的世貿中心。如此一來，他可以隨時留意與他合作的基金經理人的動態，而他在瑞士當銀行家的哥哥尚·皮耶（Jean
    Pierre）則在歐洲幫他挖掘客戶。在過去的十個月當中，克勞德是一個令我討厭到極點的頭痛人物。他總是不斷打電話給我，在我做交易的時候打擾我，多嘴多舌地跟我說要怎樣才能讓基金操作得更好。「馬丁，你要好好操作，你的基金比起別的基金表現較差，你的績效得更好才行！」


    克勞德告訴奧黛莉，他得立刻和我談一談，他希望知道我住的是哪家醫院，說要來看我。但他擔心的絕對不是我，他擔心的是自己的錢。奧黛莉不願意告訴他我住在哪家醫院，他開始有點發火了。


    「如果馬丁在本週結束前沒和我聯絡，我就要把客戶的錢轉到另一個願意回我電話的人那裡去。」


    我告訴奧黛莉不要理他。大約晚間九點，我突然覺得眼前一陣天旋地轉。「依莎，救命啊！」我尖聲叫著：「我快要死了！」接下來我只知道一部急救推車進了我的病房。


    依莎按下了緊急求助鈴。那些藥對我都沒有效果，我包裡的積水已經急速增加，直接壓迫到心臟。我的臉色發青，血壓降到只剩四〇∣五〇。幾分鐘之內，一個急救小組已經圍繞在我床邊。我的頭旁邊有一位麻醉師、一位胸腔外科醫師伏在我的身體上，床腳則有一位心臟專家監看著心電圖，甚至有一位醫生連電擊器都準備好了。我身邊的人不停地大聲說話，喊叫著儀器上的讀數，並且下達指令。


    - 血壓六〇∣八〇，還在下降中。

    - 給我五CC。

    - 血壓五五∣七〇。

    - 心跳一六〇，非常急促而微弱。

    - 血壓四〇∣五〇，我們快要失去他了。


    「搞什麼！失去我？」


    「救我，救我，請不要讓我死！」我氣若游絲地說著。腦海中浮起女兒和小兒子的臉孔。「求你，不要讓我死。」醫生開始將我的血壓穩定下來，但我的雙腿卻因為醫生將一些冰冷的液體打入體內而開始劇烈顫抖。我再度昏厥。


    我在一張往加護病房途中的擔架床上醒來，身上滿是連接管子的注射筒。一根導管從我脖子上切開的一個口子中接出來，在外面搖晃著。很幸運的，高德醫師也是工作狂。他剛剛才動完心臟手術，一直忙到深夜，然後睡在醫院裡。當我看到他時，他只說了一句：「我們馬上動手吧！」


    ## 那是報價機，還是我的心電圖？


    高德醫師通知奧黛莉，準備馬上為我動手術，但是她必須照顧孩子無法抽身，只好打電話給她姊姊琳達，把她從睡夢中挖起來，等著她到我們家來。在此同時，我可能已經開始動手術，並且可能再也看不到她了。就在我要被推進手術室之前，一個非常美麗的護士對我說：「舒華茲先生，很抱歉，但是我們必須把你的結婚戒指拿下來，你不能戴著戒指進開刀房。」


    我是一個很傳統的人，平常總是隨身戴著結婚戒指。就算有些特殊狀況不得不拿下來時，心裡還是覺得我戴著它。婚後我的體重一路上升，手指頭上已經留下明顯的戒痕，我試著把戒指拿下來，但是沒有辦法。我被注射了太多的液體，而且臂膀和手指都因為吃藥而有些浮腫。那位護士用一些肥皂和水，很溫柔地把戒指從我手指上拿下來。我強忍著淚水，對她說：「拜託你把戒指拿給我太太，並且告訴她，我希望她能夠有機會把戒指再戴回我的手上。」


    凌晨四點半，他們把我推進手術室。我平躺看著手術臺上的燈光逐漸放亮，心裡懷疑自己還能不能再看見陽光。他們把我從活動病床移到一個小小的手術臺上，我碩大的身軀幾乎沒有辦法配合它的大小。他們注射了另外一個針管到我左手背下面的靜脈裡。一位麻醉師開始用低沉、自信又平穩的語調在我耳邊說：「馬丁，我們現在要把你的手包起來。」我的右手臂被包裹起來並固定在床單上，左手臂被包裹後放在我的身邊。「現在我們要把一個支架放在你的背部下方，這樣可以讓高德醫生看清楚下刀的部位。」當他們把那個支架放在定位時，我可以清楚感覺到它的堅硬和冰冷。「現在我們要在你的頭上蓋上保護巾。麻醉開始時，你會昏迷幾秒鐘。現在我要你從一百開始倒數。好，開始吧！九九、九八、九七……」當我數到九六時，身體裡有一陣瘋狂的感覺直衝到每一條神經。我看到白色的磁磚從面前飛過，速度愈來愈快，好像坐在一列不斷加速的雲霄飛車上。


    一陣乾渴的感覺將我從睡夢中喚醒，我的嘴巴比沙漠還要乾，腦子裡唯一想的就是能馬上喝一口水。我根本不管身上插滿的針管，那些針管和我身上的疼痛告訴我自已還活著。一個護士靠上前來。「早安，舒華茲先生。很高興你平安動完手術了。覺得怎麼樣？」


    「水。」我沙啞地說著。


    「不行，不行，還不能喝水。醫生馬上會來看你，然後我們會把你轉到加護病房去。」


    「痛！啊……好痛啊……」


    「這樣就好。疼痛表示你已經好多了。等一下你被送到加護病房時，他們會馬上幫你注射一些嗎啡。」


    我再度感到頭暈，在他們移動我的過程中，我只覺得四周叮噹聲響不絕於耳，就像身處於一個電動彈珠臺遊樂場裡，然後才發覺自己已經被送到加護病房，而那些嘈雜的聲音是來自病房中用來觀察每個生命垂危病人狀況的醫療儀器。掛在牆上的大型時鐘顯示十一點半。現在，我感覺好多了。一定是嗎啡發揮了藥效。


    我開始觀察四周，檢查每一部放在我身旁的機器，試著看看機器上所顯示的數字到底代表什麼意義。雖然我身上安裝了一根導尿管，不管目前我能爭取回來的有多少，我還是不放棄重新建立一些對自己人生的控制權。我的注意力轉移到床邊的一個大型電視螢幕，上面顯示了五個子母畫面。一個心電圖持續在螢幕上跳動，下面是一個小格子，裡面用綠色的數位顯示著我的血壓（八二—一一四）、心跳速度（九八）、血液含氧量（九七），和血壓（八〇—一〇〇）。這些數字讓我想起了我的Quora和Mepile報價機。我開始做一些呼吸練習，來測試一下我是不是能控制自己的血壓。我不停吸氣、吐氣、憋氣，眼睛盯著機器上的讀數，七八—一三，八六一三八。


    「馬丁，停止這麼做！」我太專注於那些儀器的螢幕，以至於沒有看到奧黛莉已經走進病房。她轉頭對跟著她一起進來的護士說：「你們這些人在幹什麼？他平常就是盯著螢幕過日子的。你們如果想讓他的血壓降下來的話，就快把這些該死的機器挪開。」那個護士照辦了。


    當你只能躺在床上盯著時鐘看時，時間似乎過得更慢了，而這正是我接下來五天裡唯一能做的事。當我在做交易時，從來不覺得有足夠的時間，總是希望時鐘能夠停下來等等我。現在，我在心裡不停催促時鐘走快一點，因為我知道隨著時間逝去，我的情況就會逐漸恢復正常。我的目標是先把體溫降下來，然後回家過感恩節。


    而我真的辦到了。二十二日是星期四，感恩節當天奧黛莉來接我回家。我沒有力氣坐在餐桌旁用餐，藥物治療使我仍然不很穩定，但是至少已經出院和家人團聚。我已經很心滿意足了。


    ## 其實，他們並不在乎你的死活


    整個週末，我都在整理上週不在時所堆積下來的郵件。


    - 一封蘇黎塞來的信說道：「請貴公司照本人先前指示，將本人所持有之沙伯林納海外基金全數贖回……」

    - 巴格瓦、奇德與皮博迪公司的來信說：「本人在此請貴公司贖回本人持有之沙伯林納海外基金……」

    - 開曼群島來的信中提至：「請照本人於十一月十三日去電中之指示，確實贖回所有持份……」

    - 來自巴哈馬的郵件也寫道：「謹以此信通知您本人將要求贖回本人之持份……」

    - 「我們要求『立即』贖回所有持份，最晚期限為一九九〇年十二月三十一日……」

    - 「本人將於年底取回所有投資於貴處之資金，本人對貴基金操作風險之高深感不安……」

    - 最後，有一封來自芝加哥的信說：「請將本信視為豪斯曼國際公司之正式通知，本公司已決定將貴處之帳戶完全結清，並終止原先之協定……」


    又有另外七個投資人，包括豪斯曼和另外總額達五百萬美元的資金從我的基金中抽走。你想像不到其中竟然沒有一封信寫道：「附註：希望你早日康复。」他們真正在意的只是自己的錢罷了。


    我希望他們是最後一批要贖回沙伯林納海外基金的投資人，可惜我又錯了。十二月二十六日星期一早上，又有一堆傳真、信件和快遞送到雷克辛頓街七五〇號，裡面全都是壞消息。巴基斯坦的客戶要求贖回。我在巴拿馬的投資人用西班牙文告訴我：「再見！」來自世界各地的投資人都用他們的母語告訴我一句話：「再見！」我的基金在一個月之內從七千萬美元的規模一下子縮水成四五百萬美元，而我還得繼續撐過十二月。

