    找學校、辦保險、開新的銀行戶頭，還有其他幾百樣數不清的事要辦。況且我真的很想念紐約，那些美術館、博物館、我那幢海濱別墅、華爾街的市場脈動、內線史基尼，以及其他的老朋友們。


    但從另一方面來看，在紐約，如果我出門想叫部計程車，除非老天幫忙且不下雨，否則就得等上一輩子的時間才叫得到。除此之外，紐約市也充滿了噪音、垃圾，隨時有人會擋住你的路向你借個火，每個街角隨處可見要飯的乞丐，警笛聲整天在街上呼嘯而過，而且除了磚塊和柏油路之外，你幾乎看不到別的東西。磚塊和柏油路，那就是紐約的代表性景觀。


    一九九三年六月，我們賣掉了公寓，正式搬到佛羅里達。那裡安靜又乾淨，開車的人總是謙讓有禮（大概是因為他們大都已經八十多歲了吧）。那裡沒有攔路的搶匪，沒有滿街的乞丐，沒有水泥叢林，沒有垃圾，放眼望去都是一些穿著輕鬆服裝的老先生、老太太們，以及翠綠的棕櫚樹和湛藍的海水。


    但是，我沒有辦法適應這樣的環境。奧黛莉有一幢新房子可以忙，孩子們有新的學校和新的朋友要適應，而我則搬進了一間明亮、乾淨，可以瞻望大海的新辦公室裡。我放下所有的窗簾、看著螢幕，繼續打電話給芝加哥交易所以裡的考林斯。


    這看起來好像不太對勁。我打電話給蘭迪斯：「醫生，我這麼大費周章，結果好像只是讓我自已從紐約那個黑漆漆的辦公室，搬到佛羅里達的另個黑漆漆的新辦公室而已嘛！」


    蘭迪斯给了我另一個心理治療師的電話，他想要或許能給我一些幫助。我和這位新的佛羅里達心理醫生約了時間見面。經過幾次門診後，他對我說：「馬丁，你活得太嚴肅了，你太太也是，孩'
  md: '

    ## 哈克曼建議我去找心理諮詢師


    搞清楚自己的價值感是真實的，還是藥物的化學反應所造成的。我感到疲憊、氣憤，而且開始覺得自己可能不久於人世。


    哈克曼建議我去找心理諮詢師，所以我跑去看伯納·蘭迪斯（Bernard Landy）醫師。蘭迪斯把我的身體和一部儀器連上線，檢查我的呼吸模式，想知道我一分鐘呼吸多少次。他要我從六百開始以每次減十三的方式倒數回來：五八七、五七四、五六一、五四八、五三五、五二二……


    我以極快的速度倒數著，數到六七時蘭迪斯叫我停住。他說從來沒看過有人能在一分鐘內倒數得那麼快。


    「你這是什麼意思？」我向他抗議：「我數到一半你就把我打斷了。你根本就沒有給足一分鐘的時間。我可以在一分鐘之內倒數完的，讓我再試一次。」


    「馬丁，我不在乎你到底能數多快，我只是要趁你集中思慮倒數時，測量你的呼吸模式。大部分的人在集中意誌時，每分鐘的呼吸頻率是十二次，但你卻呼吸了二十次。」


    「是啊，那又怎樣？我要贏得這個測驗。我還是覺得可以辦得到，來嘛，讓我再試一次。」


    我就此和蘭迪斯醫師建立了長期的良好關係，那年整個冬季到次年春天，他持續教我一些能夠更放鬆，並且變得更健康的技巧。


    療程一直持續到六月份，才真正讓我擺脫對強體松的依賴。蘭迪斯建議我去度個假，慰勞一下自己。奧黛莉和我決定再去亞斯本度個兩週的假，自從兩年前決定開始募集沙伯林納合夥公司後，我們就沒再造訪過那裡。


    ## 你告訴我，我在上廁所⋯⋯


    我對這個狀況早已心知肚明，不禁回想起當初在一九九九年夏天我第一次到亞斯本度假，決定創立沙伯林納合夥公司後，和從布朗克斯（Bronx）來的波奇（Bogey）之間的會談內容。


    我在波奇門外等了將近一個鐘頭，心中不是很痛快。我希望盡快回去繼續交易。但是當你開始經營一個基金時，就得乖乖去找其他在這個領域中有經驗的人，求他們幫你介紹一些有大爺們來投資基金。


    幾天之前，我才打了一通電話給艾萊澤（A.Z. Algo），他是沙伯林納合夥基金及沙伯林納海外基金的結算公司研究部負責人。艾萊澤曾經答應要自掏腰包出錢投資我的基金，所以我認為他會是一個很好的介紹人。〔當然可以啦，馬丁。〕艾萊澤對我說：〔我和波奇是好朋友，而波奇一直是個很好的介紹人。在找當紅的操盤手來幫他賺錢。我會給他個電話，然後幫你跟他安排一次會面。』而現在，我正在波奇的辦公室外面呆坐著等他。


    每個在華爾街混過的人對波奇都知之甚詳。他是一個名副其真的市場高手，一個超級大人物，基金規模高達數十億美元。波奇最大的樂事，就是在別人人面前趾高氣揚大顯威風。之前我從未和他見過面，但是我並不喜歡他。他在市場上以態度粗暴、常與人起衝突聞名。自以爲是說笑話能手的他，總喜歡跟旁人吹噓自己如何折騰那些經紀商。因為經紀商總是打電話問波奇要生意，所以他就會在市場收盤前幾分鐘打電話給那些經紀商，然後說：「好吧，你們想跟我要生意是吧？幫我買進五萬股的※※&*#。」然後馬上掛斷電話。


    接到他電話的倒楣經紀商，根本聽不懂他說的股票名稱是什麼，於是馬上回電話想問清楚，但是波奇會交待祕書告訴經紀商他正在洗手間，沒法接聽電話。經紀商就會急得發狂，大聲要祕書查一下他到底要買什麼股票。他們會懇求波奇的祕書：「甜心，拜託幫個忙吧？只要請你探個頭問他一下股票的名字就好了！」


    一般而言，和波奇做生意的經紀商佣金大約是每股六美分，以五萬股來計算就是三萬美元的佣金，而負責這個帳戶的營業員可以得到二○%，或是六千美元的佣金。可是現在他根本搞不清楚股票的名稱（他也不可能搞清楚），眼見市場就要收盤了，營業員如果買不到股票就完蛋了，不但賺不到佣金，更可能會失去和波奇這個大人物做生意的機會。波奇就是喜歡玩這種遊戲，我可一點也不欣賞！


    ## 你ㄧ定要趕快買進※%＆＃……


    終於，接待員告訴我可以進去了。走進波奇的辦公室就像走進電器大賣場，裡面充滿了螢幕、美聯社單機、路透社單機、傳真機、電話、影印機，和一大堆各式各樣的電腦用品。波奇的電子小玩意，足足比我的多出了三倍有餘。一名年輕助理因為犯錯而罰站著，波奇本人則坐在一張椅背極高、手工製造的真皮旋轉椅中責備著他。那張椅子的前面是一張像餐桌一樣大的辦公桌，桌面上也像餐桌似的擺滿了許多食物。


    波奇的頭像顆保齡球似的掛在肩膀上——如果他有脖子的話，一定完全被那個誇張的下巴給遮住了。他那張紅光滿面、像月亮一樣圓的臉，因為口中塞滿了食物而看起來更臃腫。「呃，」他口齒不清地向我說話，肥胖多毛的手隨意地指向遠處的一張沙發。我在那裡坐了下來，而波奇則繼續責備那名助理。「我才不管你在外面聽到了什麼可靠來源給的小道消息，你得自己動動腦筋思考才行！」我很確定，在波奇的想法裡，他在給那年輕人上了偉大的一課，要他自己動腦筋思考。波奇看來顯然樂在其中，享受著罵人的快感。


    這場演說足足又進行了二十分鐘，波奇在罵完了他的助理後轉頭跟我說話。「呃，舒華茲是吧，你找我有什麼事嗎？」


    我告訴他，我在過去有十分輝煌的操作績效，而我剛剛才設立了自己的基金，我只是送一些跟基金有關的文件和投資計畫，想了解一下他是不是有可能投資一些資金由我來操作。


    「你的基金管理費怎麼算？」


    「四和二十（意味四％的固定管理費，加上獲利的二〇％）。」我說。


    波奇的臉漲得更紅，瞪大的眼珠彷彿要從眼眶裡噴出來似的。


    「四和二十！」他低聲咆哮著，從椅子裡站了起來。「比我收的還要高！你好大的膽子，竟敢收得比我高！我只收客戶一和二十，而且我還是市場上最棒的操盤手。你以為你是什麼東西？給我滾出去！」他從桌子上拿起食物塞進嘴裡，奶油從下巴淌了下來。


    我沉默以對。他怎麼會這樣？這次的會談是由我們共同的朋友促成的，他先是讓我等了將近一個鐘頭，現在和我說不到一分鐘的話就要把我趕出去。如果他不接受我的管理費率，大可以說「對不起，太高了」或「讓我再考慮一下」就好了。我又不是他身邊那些搖尾乞憐的狗，他們是被波奇花錢雇來修理著玩的。我真想跳上他的桌上，把那顆傲慢的腦袋打進那個幾乎看不見的臭肚子裡，但是我控制不住自己的情緒。如果我揍了波奇，他一定會告我，而我剛剛才開始經營自己的基金，不想和波奇之間惹出什麼麻煩。


    我起身離開，但是當我走進電梯時，我的情緒愈來愈激動。回到辦公室後，我簡直氣炸了。我想做交易，但是思考沒辦法集中，因為我無法把波奇從腦海裡除去。我只能在心裡告訴自己：「怎麼給這粗魯傲慢的渾蛋胖子一點顏色瞧瞧。」


    電話鈴響，是我在芝加哥商品交易所的接單員湯米．考林斯（Tommy Collins）打來的，他是我先前那位營業員黨比介紹的。一九八七年十月二十二日，也就是索羅斯在
    S & P 期貨交易場慘遭場內操盤手修理之後，黨比受夠這一行了，加上我在那天為了要在那個混亂的狀況中肅平我的空單，對黨比施加了太多壓力，她終於發覺她該找一個比較輕鬆的工作，再也不要聽我在電話裡整天對她大呼小叫。


    她離開時，向我推薦考林斯做為我的新任場內營業員。「你會喜歡這條伙的，他塊頭夠大、身材夠壯，很聰明，更重要的是夠悍，有足夠的能力在場內為你執行交易指令。」黨比說的一點也沒錯。我還是一天到晚為了被場內那些渾球惡搞而大呼小叫，但是我很清楚，考林斯絕對已經在交易場內使出渾身解數，為了執行我的交易指令而努力。


    「考林斯，」我說：「你有没有和一個叫波奇的死胖子打過交道？」


    「波奇？有啊。我和他講過幾次話，他總是對我說：『聽著，考林斯，你如果聽到什麼可以讓賺钱的訊息時，要打個電話給我。你知道什麼，馬上告訴我，我會給你一些好處的。』」


    「考林斯，這就是要你幫我做的，」我說：「我要你在市場收盤前打電話給波奇，告訴他剛剛聽到一些第一手的重要消息，然後當他問你是什麼消息時，你就跟他說：『馬丁·舒華茲說%%&*#，』然後馬上掛掉電話。』」


    「說什麼？」


    「%%&*#。別擔心，波奇聽得懂。他會馬上回電給你，然後當場氣炸。』


    所以在三點五十九分時，考林斯打電話到波奇的辦公室。他告訴祕書，波奇先生要他在市場有任何變化、能讓波奇先生賺錢時馬上打電話過去。波奇馬上就接了那通電話。


    「是啊，考林斯，你聽到了什麼能賺錢的消息嗎？」


    「是的，馬丁·舒華茲說你一定要趕快買進一些※*&#*。＃。」「然後考林斯把電話掛斷。


    如同我所預料的，波奇馬上就回電給考林斯。「考林斯，你這個渾球，你在用誰的電話？我要找你算帳！我要把你從那裡揪出來！你用的是誰的電話？我是重要人物，膽敢如此對我！我一定要找你算帳！」——從電話裡的語氣，我們可以想像波奇的前額血脈貫張，話筒被他那汗濕的手掌給淹沒。波奇已經完全失去了他的幽默感。


    能夠把波奇的情緒給搞壞，哪怕只有幾分鐘的時間，都讓我感到非常愉快。我設定了目標，未來所操作的基金一定要超過波奇這個傢伙，我一定會擊敗他，也一定會擊敗他所有的人。我要成為市場中的頂尖高手，就算付出再大的代價也在所不惜。


    這個目標果然讓我付出慘痛的代價，連老命都差點賠了進去。


    ## 謝謝你，書店裡的老太太


    我終於承認，我真的不適合操作別人的資金。我不喜歡向任何人報告，也不喜歡有人在我的背後指揮我做那，更痛恨別人老是拿其他操盤手的績效和我做評比。我是一個靠掌握市場脈動而進場操作的人，我喜歡在市場裡短時間內進進出出，可是當你操作一大筆資金時，這一切都會變得相當困難。更別提我喪失了多少操作上的自主性，而自主性卻是我當初之所以決定要自立門戶，獨力操作自有資金的主要原因。


    但是當我跳上吉普車，把帆布頂篷收起來，開車經過亞斯本機場時，內心的另一個部分又開始提醒自已，如果放棄操作別人的資金，我也會損失很多東西。


    那些我到目前為止還不曾擁有過的——那些停放在亞斯本機場停機坪上的豪華私人飛機，如果我放棄操作別人的資金，就不可能享有像那些市場頂尖高手一樣的風光模樣。


    我得去小尼爾飯店的那家書店買本《金融怪傑》，給那幾個在俱樂部裡的網球高手看。在我想要靠著打網球來重新恢復體力的當下，這個傢伙很有耐心地拍幾百球往我身上打來。他對市場很感興趣，所以我想他一定會很喜歡讀這本《金融怪傑》，尤其是我的大名也在這本書裡被詳細地介紹。


    我在書店裡拿了書，排隊等著付帳。排在我前面的，是一位頭髮裝飾得很考究的六十多歲老婦人，她轉過頭來，瞄見我手上拿的書，於是問我：『原來你也想成為『金融專家』呀？』


    我不知道該說些什麼，只是看著這位婦人。她的衣著光鮮整潔，家裡一定有某位祖先是乘坐五月花號到美洲來的早期移民。她大概六十開外，恐怕在我還沒出生以前就已經在收取股利或是剪集商店的折價券了。


    她看起來非常自在、沉靜、健康，一副與世無爭的樣子，令人感到相當舒服。突然之間一切都變得很清楚。我不想當金融專家，我想要當一個和她一樣的人。


    「不，女士，」我說：「我已經是個金融專家了。而且，相信我，這可不像您所想像的那麼好。」就在那一刻之間，我完全地把自己從那些壓力中釋放出來，不再想如何在這個資金操作的遊戲中打敗波奇。當年我是在亞斯本下決定心要開始經營基金的，現在我也在亞斯本決定要把基金給收起來。在我的心中、腦海中，清楚地知道我剛剛做了一生中最棒的一筆交易。


    沙伯林納合夥公司

    雷克辛頓大道七五〇號

    紐約州紐約市，一九九一年七月三十一日


    親愛的合夥人：


    我寫這封信是要通知諸位，我決定在一九九一年七月底終止我們之間的合夥關係。我將把諸位在一九九一年度的起始資本退還給諸位，至於其他款項則將於會計師稽核完竣之後退還諸位。


    我的醫生建議我，如果想要完全復原，擺脫从去年十一月起就一直威脅我生命的疾病，最好的方法就是讓自己處於一個壓力較小的環境中，況且我也需要時間放鬆心情並享受人生。以積極的方式全職操作一筆龐大的資金所帶來的壓力，對於目前剛剛從病中康復、極需平靜生活的我來說，是非常沉重的負擔。我的復原狀況遠較原先預期緩慢許多，而我不想因為缺乏調養而再度發病。我在上個月才剛剛結束服用強體松的療程，如果可以避免，我不想再被迫服用此種藥物。過去的八個月是我人生中最難苦的一段日子，為了對自己和家人有更好的交待，我決定停止交易、暫時休息一下，享受一些人生中比較輕鬆簡單的事物，這是我長期以來為了追求名聲和財富而沒有辦法做到的事。我要深深地感謝諸位在過去對我的信任與支持，對此銘感於心。


    六月份我們虧損了一．三六％，使得本年度獲利績效降低為九．三九％。七月份也是小幅虧損。我們將盡速完成會計师的稽核報告，並將剩餘的金額歸還諸位。


    ## 誠心感謝


    ## 嗚……我把報價機藏在高爾夫球袋裡


    一九九一年八月，我回到罕普敦的海邊別墅，披著海灘浴衣，操作著自己的資金。這種感覺真好。蘭迪斯說服我重拾很久沒打的高爾夫球，奧黛莉和我甚至加入當地的一個高爾夫俱樂部。高爾夫球並不是我自己挑選的活動，想要打好高爾夫，需要花很多時間去練習，而且打高爾夫本身也是一件很費時的事，幾乎要花上一天的時間。但這是蘭迪斯建議我做的運動，他要我試著在球場上打發時間。


    我們加入高爾夫俱樂部沒有多久，奧黛莉就找到一位銀行家和他的老婆來當我們的球伴。我們約定在上午十點半開球，但就在我們出門前，我看到S＆P指數突破了我預想的超勢軌道。我知道市場已經呈現超買狀態，所以打電話給考林斯並賣出了五十口S＆P指數期貨。我把我的行動式報價機和行動電話放進球袋裡，然後出發前往球場。


    我們四個人再球場上揮著桿，聊著一些無關緊要、言不及義的話題。照說，我們應該是耍享受一些快樂时光的，但我心裡想的只有那五十口S & P期指，以及如果市場反轉時我該如何處置這個部位。每一洞開球時，我都假裝在球袋裡找新球，實際上卻是在查看報價機上的市場價位。到了第六洞，狀況果然來了，市場開始反轉。我得打電話給考林斯，叫他亂平我的部位，而且馬上就得打這通電話，我沒有辦法等到第九洞休息時才打。如果那時才打，一切就太晚了。但是我不能讓任何人看出我在幹什麼。人在球場上還在做生意是一件很不禮貌的事，更何況當時奧黛莉還不知道我偷偷地做了這筆交易。


    奧黛莉和那位銀行家太太站在我們左手邊遠處的女上開球區，所以現在只有我和那個銀行家在一起。「該你了，馬丁。」他說。


    我站上開球的位置，擺好了球。這將是我今天最重要的一擊，我得好好打這一球。我回想著教練在上課時對我說的話：「把球對準你的左肩放好，頭部保持瞄球姿勢，把球桿慢慢向後拉高，左肘肘不要打彎，直揮向球。」我把球放在對齊我右肩的位置，抬起頭，把球桿胡亂向後舉，打彎左手，然後猛地揮向小白球。


    咻一聲，球飛進了樹林裡。好極了，打得好！「哇，真糟！」那個銀行家說：「你能找到球就算幸運了，馬丁。要我和你一起去找嗎？''


    「不，不，不用麻煩了。我想我知道那顆球飛到哪裡去了，而且萬一我真的找不到的話，只要再拿一顆出來就好了，像我這種爛技術再多加兩桿也沒什麼差別。"


    我鑽進樹林裡，躲在一棵樹後面，拿出行動電話，撥了考林斯的電話號碼。「軋平那五十口，現在就賣掉。」「我在那筆交易上賺了六萬美元。沒有人比我更聰明的了，至少蘭迪斯就看得出來。」「馬丁，」他說：「你知道嗎？你真是一個不尋常的人。」「尋常？」我說，「誰會想當一個尋常的人？」從五歲開始，我就一直想要與眾不同、出人間地，心裡想的只有前進、前進、前進。我是一個操盤手，而沒有任何一個操盤手是平凡無奇的。如果我想當個平凡人，當初就會把錢放在指數基金裡，安安然穩地當個證券分析師。「馬丁，你就像個酗酒成性的酒鬼。操盤行為讓你情緒亢奮且精神狂亂，根本沒辦法拒絕這種感覺的誘惑，你也因此變得筋疲力盡、情緒低潮，就像是宿醉一樣。而當你感到沮喪、情緒低落、唯一能讓你從這種感覺中恢復過來的，就是再度進場交易，這種惡性循環就這樣一直下去，直到你病倒為止。但是，你得要找出你真正需要的是什麼才行。「心理治療師就像矯正器一樣。這正是接下來六個月中，我和蘭迪斯努力的目標。我一直在嘗試錯誤，直到開始看出什麼是我真正想要的為止。當我躺在手術臺上為自己的生命和病魔奮戰時，我就和自己約定，只要能夠活著離開醫院，以後就會花較少的時間從事交易，花更多時間來陪陪奧黛莉和孩子。


    ## 在人生的高點，急流勇退


    我現在已經擁有足夠的金錢，而且我相信，只要我需要更多，隨時可以從市場上賺到。這是上天給我的天賦。我知道如何在每天早上起床後，保持清楚的頭腦，然後從市場裡賺取二萬、四萬或八萬美元。就算我在操作基金方面沒有贏過波奇，那又怎樣？我可以在別的地方擊敗他。在我從鬼門關走過一回、失去一個孩子，和奧黛莉一同面對乳癌的威脅後，該是我停止和人一較長短，開始享受人生樂趣的時候了。我決定要在人生的最高點，急流勇退。


    但是，下一步該怎麼走？我得離開紐約。


    蘭迪斯是對的，我已經對操盤這檔事完全上癮到不可自拔了。如果我還留在紐約，保持原來的生活型態，繼續和那些老朋友來往的話，會不由自主地想走回頭路，繼續沉溺在和波奇那種人競爭的狀態裡。反正，我對紐約那寒冷而灰暗的天氣也感到厭倦，希望能夠到一個溫暖而風光明媚的地方去。我決定要把自己從谷底拯救出來，我要舉家搬到佛羅里達去。


    要改變生活型態，並完全切斷和紐約之間的關聯，對我而言是一件非常需要勇氣的事情。奧黛莉和孩子們都不想搬家，他們這一輩子都住在紐約這個大都市，對佛羅里達能有什麼了解？佛羅里達是個適合退休人士居住的地方，而我才四十八歲而已。其實我心裡也有一大半是不想去的。對我來說，搬家是個大麻煩，我得把公寓賣掉、把公司和辦公室搬走、搬運塞滿了十二個房間的家具、買間新房、重新裝潢，在房子沒弄好前我沒有固定的地方可以交易，還得再買幾部新車、替孩子們找學校、辦保險、開新的銀行戶頭，還有其他幾百樣數不清的事要辦。況且我真的很想念紐約，那些美術館、博物館、我那幢海濱別墅、華爾街的市場脈動、內線史基尼，以及其他的老朋友們。


    但從另一方面來看，在紐約，如果我出門想叫部計程車，除非老天幫忙且不下雨，否則就得等上一輩子的時間才叫得到。除此之外，紐約市也充滿了噪音、垃圾，隨時有人會擋住你的路向你借個火，每個街角隨處可見要飯的乞丐，警笛聲整天在街上呼嘯而過，而且除了磚塊和柏油路之外，你幾乎看不到別的東西。磚塊和柏油路，那就是紐約的代表性景觀。


    一九九三年六月，我們賣掉了公寓，正式搬到佛羅里達。那裡安靜又乾淨，開車的人總是謙讓有禮（大概是因為他們大都已經八十多歲了吧）。那裡沒有攔路的搶匪，沒有滿街的乞丐，沒有水泥叢林，沒有垃圾，放眼望去都是一些穿著輕鬆服裝的老先生、老太太們，以及翠綠的棕櫚樹和湛藍的海水。


    但是，我沒有辦法適應這樣的環境。奧黛莉有一幢新房子可以忙，孩子們有新的學校和新的朋友要適應，而我則搬進了一間明亮、乾淨，可以瞻望大海的新辦公室裡。我放下所有的窗簾、看著螢幕，繼續打電話給芝加哥交易所以裡的考林斯。


    這看起來好像不太對勁。我打電話給蘭迪斯：「醫生，我這麼大費周章，結果好像只是讓我自已從紐約那個黑漆漆的辦公室，搬到佛羅里達的另個黑漆漆的新辦公室而已嘛！」


    蘭迪斯给了我另一個心理治療師的電話，他想要或許能給我一些幫助。我和這位新的佛羅里達心理醫生約了時間見面。經過幾次門診後，他對我說：「馬丁，你活得太嚴肅了，你太太也是，孩

