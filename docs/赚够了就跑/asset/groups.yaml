    ### 老婆坐在我旁邊，是我最大的優勢


    那個時候，奧黛莉和我在交易所附近一棟大樓擁有一間辦公室，是我的結算經紀商貝爾·史騰公司提供給我們的。辦公室後面，有一堆抽著雪茄的小操盤手擠在一個牛欄似的空間裡，他們和其他操盤手一樣喜歡大呼小叫。「聽著，混球，他媽的給我報價！」「我才他媽的不管你，我要賣出！」「真他媽的爽，我剛賺了一大票！」……真是一群粗俗到了極點的傢伙。我對於味非常敏感，對奧黛莉來說也不是一件好受的事，但我們受不了行情的誘惑，更何況我們靠這個可賺了大堆的錢。


    我和奧黛莉的桌子擺成L形，好並肩工作。奧黛莉總是靜靜做著自己的事，傾聽我、觀察我的一舉一動，分享我的感受。她像先知一般，能從我些微的動作和肢體語言中，看出我想要說什麼或做什麼。


