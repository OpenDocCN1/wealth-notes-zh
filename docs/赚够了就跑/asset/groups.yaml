    正在訪問剛剛轟炸完伊拉克後，返回沙烏地阿拉伯基地的空軍駕駛員。現在是美國時間凌晨兩點了，在沙漠那裡，太陽還高高掛在天上，雖然那些駕駛員試著強作鎮定，但還是沒有辦法掩飾心裡的興奮之情。沙颺風暴行動進行得比我們任何一個人想像得都要順利，我們轟炸了伊拉克的國會大廈，擊毀了一座煉油廠、癱瘓了巴格達國際機場，並且精確地把炸彈投射在海珊總統府前的階梯上，這是一個完美無缺的行動。真該死！我得放空原油和黃金才行。


