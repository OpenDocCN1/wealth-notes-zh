    發文者：先知


    副本：人面獅身


    你這個白癡！我恨透了這篇關於醫療管理產業研究報告的大綱，我命令你馬上停止這項工作。'
  - '[PAGE 102]


    這份報告很可能對我們兩個人的事業產生永久且具有毀滅性的影響。沒有人想看負面的研究報告。信託部門需要能幫他們解套的報告。他們會把報告放進檔案中，一旦股價下跌，就拿了出來說：「看吧！寫這玩意兒的傢伙比我聰明，薪水也比我高，我是看了他們的報告才買了這檔股票的。」


    此外，我奉勸你離人面獅身遠一點。人面獅身很想、也很有能力毀了你。為了你自己，好好想想吧！


    # 第⑨堂課


    # 別靠小道消息，因為它會讓你就沒力量


    我很喜歡說自己是一個完全不靠小道消息或謠言來操作的人，因為利用謠言來操作，達不到了。


    我認為想要在市場中成功最重要的一個基礎——努力工作。努力工作使你堅強；當你依靠小道消息操作時，一點力量也沒有。


    通常當你聽到一則小道消息時，已經慢了一步，而且手中不會有足夠的資訊。如果股價下跌，你就一點退路都沒有。在智能上你將會形衰弱，而當你衰弱時，將處於最容易受到傷害的環境地。和每一個市場中的玩家一樣，我也免不了因為聽了市場傳言而吃虧。'
  - '[PAGE 103]


    最糟的小道消息，似乎總是在你操作最不利時候出現。當你手氣很背時，甚至可能會聽從擦鞋童無聊的小道消息。這就好像你在跑馬場裡，一整天都沒贏過錢時，你會側過身去，問身旁那個領社會救濟金度日的傢伙：「第八場裡你最看好哪匹馬？」然後他會說：「嗯，第六匹馬，傑瑞．貝理是他的騎師，所以牠一定會贏。」結果他今天表現糟透了，第六匹馬也只跑出第四名的成績。


    小道消息充斥的股票最常出現的走勢，就是劇烈震盪，它們上沖下洗，好像被採收者猛力搖晃的蘋果樹一般。當股價開始下跌，就是你最脆弱的時刻，也是最有可能恐慌性殺出持股的時候，因為你根本無法預期股價會跌到哪裡。你如果不衰弱，一定是正在賺錢，而如果你感到無力、無助的話，一定是處於虧損狀態。就像老人家常說，鍊子總是會在它最脆弱的那一點斷裂。在那個點上，你內心深處最可怕的恐懼控制了理智，然後你會說：「我是個笨蛋，為什麼又犯了同樣的錯？我以前就犯過這種錯，為什麼這些事會發生在我身上？」你感到驚慌而恐懼、覺得想吐，然後毫無理性、不計成本地拋出手中的股票。


    如果你想要靠某個謠言來操作，會希望是從一個成功率比較高的來源聽來的消息。我主要的來源就是「內線史基尼」（Larry Skin）。內線史基尼是一個喜歡在華爾街到處探聽消息的優秀股票分析師，他常當和各大企業的執行長共進午餐，和那些上市公司董事交換情報，這裡聽一點，那裡又聽一些，四處搜刮小道消息。'
  - '[PAGE 104]


    所以，內線史基尼來電時總是有消息可報。為什麼他要給別人這些消息？有些人就是喜歡幫助別人，這讓他們覺得很有權力、很有雅量，就像以消息來做慈善捐獻一樣，但是史基尼這麼做，其實另有原因。首先你必須了解內線史基尼可不只打了一通電話，他早就已經建立了部位，所以他会打個二十通電話。史基尼希望和每個人都成為好朋友，但他也要別人幫他的部位抬轎。只要股價向上跳個1/4元，你和其他人就會趕著上車，然後內線史基尼扮演的角色就不一樣了。他成為大家的操作顧問，每個人想要小道消息時，第一個就會想到他。

    「史基尼，怎麼搞的？到底發生什麼事了？」

    「沒怎麼樣，都很正常啊！」史基尼說。

    「在蘇黎世的會議進行得如何？」

    「哦，都很順利。是啊，我知道時間是久了點，不過這些事通常都要花比較長的時間，他們總得要做做姿態嘛！每件事都在預定的情況下發展，不要擔心，不要再緊張了，你老是這麼緊張。」

    等到你被市場修理時，你會進場加碼買進更多的股票，而另外十九個人也會同樣這麼做，所以股價的變動看起來似乎又回到穩定的狀況。每個人都鬆了一口氣，因為有人報給他們消息，而這檔股票的表現看來也不錯。可是接下來，股價會突然開始下滑，直到你心悸噁心、停損出場為止。'
  - '[PAGE 105]


    這時，當你打電話給史基尼，問他到市場在搞什麼鬼，他才不想聽你跟他抱怨呢。「我也賠錢啦！」他說。「我賠得比你還要多！」但事實上，史基尼早已經出貨，正等著低接你們手中拋出來的股票。


    事實就是如此。你再一次發誓從此不聽任何小道消息，但是幾個月後，就在你的操作出現一連串虧損時，電話鈴聲響起，是內線史基尼打來的。「嘿！」他用一種神祕的語氣小聲地說：「我跟你講一個賺錢的大好機會。」'
  - '[PAGE 106]


    # 第 5 章


    # 買黃金，讓我有安全感


    財富要這裡藏一點，那裡藏一點


    「要多來點爆米花嗎，愛倫？」我低聲問，再次不經意地將手背掃過她的毛衣前面。那是一九六四年的聖誕假期，我們正坐在紐海文大學街上羅傑·雪曼戲院最後一排的座位上。


    我在安獸斯特學院念大二，社交生活簡直乏善可陳。當初我之所以決定要到這麼好的學校就讀，就是想提升我的社交層次。我曾經花時間研究，譬如我會仔細閱讀一年級新生的相本和通訊錄，從中挑出一些長得正、曾在名校念大學預科的女孩，然後一一打電話給她們，但最後總是被我拙劣的技巧搞砸。


    「嗨，你是蘇西嗎？我是馬丁·舒華茲。你今天過得好嗎？」嘟嘟嘟……。


    「麗茲，你好。我是安獸斯特學院的馬丁·舒華茲。這個週末你有沒有興趣來玩牌？你可以打橋牌？當然好啊，一墩賭多大？」嘟嘟嘟……


    「哈囉，金芭莉嗎？我是馬丁·舒華茲。你從維'
  - '[PAGE 107]


    吉尼亞的密德堡來，我聽說那裡可是養馬勝地，是吧？一嘟嘟嘟⋯⋯。


    於是，我又回到屬於自己的社交圈。愛倫·範恩是當時我約會的對象，是我高中同班同學，畢業後去念瓦薩（Vassar）學院。


    戲院裡燈光昏暗，銀幕上出現的是詹姆士·龐德那张英俊而溫文有禮的臉，充滿魅力的身影被框在一個槍管之中，正要為皇家祕密行動小組動，和另外一個犯罪集團的首腦對抗。龐德總是讓一群美女動心，這也不是什麼祕密了，這就是為什麼我約愛倫來看《金手指》（Goldfinger），—
    希望龐德能夠幫我擔任破冰的任務。他在銀幕上怎麼把妹，我就在座位上如法炮製。


    我並不需要等太久。因為這部電影一開始就是一段火辣劇情，龐德和漂亮的金髮女郎吉兒·麥斯特森（Evangelina）裹在一床被子裡。當鏡頭裡的龐德在邁阿密楓丹白露飯店的陽臺上摟抱著吉兒時，我也正在紐海文市羅傑．雪曼戲院的最後一排座位裡摟著愛倫。當龐德把手臂環繞著吉兒時，我也把手臂環繞著愛倫。當龐德攻上一壘時，我也攻上二壘。在同一个時間裡，吉兒和愛倫都在我們的耳邊輕聲細語。


    真感謝〇〇七，事情順利極了，所以我決定試試看有沒有辦法盜向二壘。我慢慢地、平緩地，就像〇〇七一樣，開始採取行動，把手悄悄從她的肩膀向上滑動。「嘿，慢一點，」愛倫低聲說：「你以為你是誰？詹姆士．龐德嗎？」


    她掙脫，讓我感到有一些突兀，我猜想她應該是不想進展得太快。我得保持鎮靜，就像〇〇七'
  - '[PAGE 108]


    # 黃金為什麼充滿魅力


    一樣。我抬頭看著銀幕，龐德正在和金手指打高爾夫球，他們打球的地點是一個風光明媚的英式鄉村俱樂部。我立刻喜歡上金手指這個角色，他讓我回想起當年自己充當外祖父桿弟的情景。龐德和金手指站在第十六洞的果嶺上，而金手指正準備要打一個很簡單的推桿。「您到底有何貴幹呢？」他邊把球放好，邊對龐德說：「我想你可不是專程來和我打高爾夫球的吧？」


    噗通一聲，龐德故意把球桿放倒在球洞旁的草地上。金手指的身體略微抽動，這次的推桿也失準了。


    我眼睛一亮！我從來沒有看過任何一個比在草地中閃耀光芒的純金球桿更迷人的東西，我開始深深地融入這個描述金手指準備備用核子武器攻擊諾克斯堡的劇情之中。這真是高明的計畫，如果你能用核子武器摧毀諾克斯堡裡儲存黃金，何必大費周章地打主意去偷它？如果全世界黃金儲存量最大的地方受到攻擊，使得裡面存放的黃金成為廢物，那麼金手指手中持有的黃金，自然就會身價暴漲。當然，電影最後，龐德適時阻止了金手指的計畫，但即使這個計畫並沒有成功，金手指已經成為我的新偶像了。


    長久以來，我一直深深對黃金著迷。從法老王時代開始，猶太人就喜愛黃金，因為黃金一直是逃難者最容易隨身攜帶的貴重財物。當摩西從山上把「十誡」帶下來時，他的追隨者就是把誡文刻'
  - '[PAGE 109]


    在黃金上。在接下來的中古時期、西班牙的天主教時代、東歐的共產革命，甚至二次大戰期間希特勒大屠殺之中，猶太人一直在逃難。我的祖父從東歐的動亂中逃亡到美國後，只要手上攔下了一點錢，就會拿去買黃金。我對黃金的渴求，根本是遺傳來的。


    黃金不會受空氣、熱度、濕氣和大部分溶劑的影響。在人類的歷史中，它不只是因為美麗和抗腐蝕性而享有高度價值，更因為比其他金屬更容易加工、保存成條塊狀態，也因爲稀少性而廣受收藏者的青睞。因為這些原因，黃金自古以來就已經被人類當作貨幣使用。


    長久以來，每個國家都以黃金作為衡量幣值的標準，也就是所謂金本位制（Gold standard）；當商業活動在十九世紀末急速增加，用來結算國際貿易帳的制度廣爲各國所需，黃金也成爲國際貨幣交易的基礎。


    一九三三年四月，老羅斯福總統（Franklin Delano Roosevelt）曾經命令美國人向政府繳出手中的金幣，大部分的人聽話照辦，但很多人還是把黃金私藏起來，包括我祖父在內。他才不願意交出那些二十美元面值的金幣呢！他偷偷把那些金幣存放在不同的地方，一直到一九五七年，有一天他什麼話也沒說，走到位於噴泉街底的首城儲蓄銀行（Seattle
    Savings Bank），拿他所收藏的金幣，向銀行要求以二十美元的面值來兌換。


    那時祖父的腦袋可能還停留在二十四年前，老羅斯福總統下達回收金幣令的那個年代。其實在一九五七年，一枚雙鷹金幣的市值早就已飆漲到一百美元了。'
  - '[PAGE 110]


    # 我愛黃金，也收藏硬幣


    我祖母蘿絲也偷偷藏了幾枚金幣，在我十三歲生日時，給了其中的一枚，那是一枚一九二五年「D版」的雙鷹金幣（Saint-Gaudens Double Eagle）。


    那枚金幣是由奧格斯特·聖高登斯（Augustus Saint-Gaudens）在一九○七年所設計的，其中一面鑄著一隻飛向太陽、姿態雄偉的老鷹，太陽的光線打在牠的身上，老鷹上方刻著幾個字：美利堅合眾國、二十元。在那隻老鷹下方，沿著太陽的周圍，看起來像是光環的，則是「我們信靠神」（In
    God We Trust）幾個字。


    硬幣的另一面，則是一個留著濃密長髮的女人，穿著薄紗紡製的長袍，右手握著象徵自由的火炬，左手則拿著象徵和平的橄欖樹枝。她的左腳踩在一塊石頭上，使得身上的薄紗長袍因而繃緊，看起來美麗極了。石頭的上方刻著日期「一九二五」，而在兩道太陽的光線之間，鑄著它的版本「D」。畫面背景的下方，在幾道幾乎看不見的光線中，是一個微小的美國國會大廈圓樣。金幣的最上方是「自由」這個字，而四周則滿布著小星星。


    我愛死這枚金幣了，當時我輕輕地撫摸它好幾個小時，之後，就養成了收集貨幣的習慣。


    一九五八年，我買了第十版的《美國硬幣指南》（*A Guide Book of United States Coins*），那是尤曼（R. S. Yeoman）在一九五二年所寫的。這本型錄是研究貨幣者必讀的經典之作，每年都會再版。其中詳細記載了一種美國硬幣目前約略的市值，根據其品質和稀有性加以分類排序。我會拿'
  md: '

    ## 正式發表前，報告被大修特修


    不論如何，如果先知或大祭司等高層人士在報告外洩前讀過的話，它根本就不可能會被刊印出來。實際上，我們的研究報告等於是對醫療管理產業做出了「賣出」的建議，而在華爾街，沒有任何機構會寫一篇建議投資人「賣出」持股的報告。


    通常，「長期持有」已經是最糟的評語了。「長期持有」，代表請投資人趕快跑去找營業員（不是用走的哦！）賣掉手中的持股。如果先知很盡責地做了他該做的工作，就會從頭到尾監督人面獅身和我在做些什麼，而且也會出席那次的會議，聽到我們的口頭報告。如果他當時出席的話，會馬上就把這篇報告壓下來。但是先知並沒有堅守崗位，只是躲在辦公室裡看自己的盤，而現在想要收拾這篇報告造成的風波，可就太遲了。


    現在，在大祭司和先知嚴密的監督下，人面獅身和我必須重寫這份報告。我們把所有來自美國國際醫療公司的參考資料全部刪除，放寬了我們的假設，也軟化了我們的語氣，把一大堆「將會」改成「可能」；「很可能」改成「有機會」；而把「因此」改成了「或許」。更重要的是強調我們預期這個產業，在一九七二年結束前到整個一九七三年，還是會維持15%到20%的獲利成長。我們很清楚地表明這篇報告絕對不是一個「賣出」的建議，而只是一種「警報」，讓我們的客戶了解醫療管理業，在長期觀點上可能會面對的潛在問題。


    我的記憶力很好，而且我只是不斷告訴他們我所知道的每件事。六個鐘頭後，事實應該已經很明顯，我並沒有將任何報告內容洩漏出去，而且即使報告外洩真的是金字塔公司想要操縱股價的整體策略之一，也和我個人一點關係都沒有。


    我充滿自信地離開交易所，以為沒事了，但事實上，還有一個大問題需要解決，那就是：金字塔公司還沒有正式發表這份研究報告。


    這篇正式報告在一九七二年十二月一日星期五正式刊出，但是那時已經沒有人相信它的內容了。稍早，在十一月二十七日星期一，《華爾街日報》的丹·朵夫曼（Dan Dowman）「華爾街耳語」專欄中，談到了這個報告外洩事件，並提到原版的內容比正式出版的要不面了許多。「這對金字塔公司來說真是一場『噩夢』，至少有一個內部消息來源這樣形容。」朵夫曼以這句話做為開頭。他表示原版報告在未授權的狀況下外洩，造成醫院管理業股票投資人的慘重損失，而由於市場上空軍不少，令人懷疑金字塔公司是否意圖操控市場。朵夫曼最後引用了紐約證交所一名資深交易員的話作結尾說：「我想這些股票是完蛋了。根據金字塔公司原版報告的描述，未來這個產業的獲利能力有相當嚴重的問題。沒有人知道報告是對是錯，不過如果是正確的，那這些股票真的就毀了。」


    難怪亞培爾和其他這個產業裡的總裁，要一直壓迫紐約證交所展開調查了。在亞培爾看過原版的研究報告後，向媒體指稱原始的報告內容相當「不專業」，而且「顯示出對醫療產業領域所知甚少」。他並憤怒地說：「股價重挫已導致一項重大的購併計畫取消。」而紐約證交所也開始透過股票交易監視系統，觀察從十一月十三日以來幾週裡醫療管理類股票的交易狀況。這個報告外洩案追溯源史庫達公司的那個渾蛋那裡，最後才又追查到史坦迪許身上。史坦迪許起先否認他把這份報告外洩，但是在1973年十二月十二日，他終於承認自己把那
    份初稿私自帶走，並拿給了一個外人。到了十二月十四日，史庫達的總裁喬治·強生（George Johnson）承認有一名他公司的分析師曾經拿了研究報告的草稿，而且有
    部分客戶可能在報告廣為流傳、造成股價下挫前，就已賣出 手中的持股。這終於證明我在這個事件是清白的，至少我自己這麼認為。


    1973年二月二十六日，一群美國國際醫療公司股票投資人向法院控告金字塔公司和我個人，他們在訴狀中寫道：


    該公司的一名合夥人以及證券分析師聯手策劃了一個「放空」該檔股票的計畫。在這個計畫中，他們假借「內線消息」的名義散播不實訊息，反映出不利於美國 國際醫療公司財務狀況的各種資料。結果，導致這家擁有廣大投資人的公司股票
    重挫，而被告得以在低價買進以轧平其早先放空的部位。這是一件串謀好的計畫，是 為了打壓美國國際醫療公司而進行的陰謀。


    他們要求七四二〇〇美元的損害賠償以及七四二〇〇美元的懲罰性賠償， 共計八一六二〇〇美元的賠償金。金字塔的法律顧問表示我們不必擔心，這個 案子根本不會成立。不過，事情也並不需要那麼好解決。至少亞培爾不肯善罷甘休。
    到了一月底，美國國際醫療公司的股價已經跌到二三，總共下滑了將近五〇%。


    一九七三年二月二日，在紐約證券分析師協會所舉辦的一場會議中，亞培爾痛罵金字塔公司、那篇報告和我。他讚揚美國國際醫療公司在上一季獲利成長二○%的表現，「從來沒有發展過如此強勁的成長潛力。」他猛烈地指責這篇報告外洩的過程，指稱這是一份「地下刊物」，其中至少包含了七個最基本的錯誤，並且具有許多「模棱兩可、誤導事實且嚴重疏漏」的內容。他強調「這份不精確的報告，是兩名年輕的分析師在和前面談了兩個鐘頭後的草率作品」。


    ## 慘遭犧牲，但也讓我變得更堅強


    那些醫療管理產業的高級主管和我往日的哥兒們，都不再提供任何資訊給我。我成了一個沒有題材可以研究的分析師。更糟的是，當時整個市場都處於空頭狀態中。小型股票在一九七二年下半年開始下跌，在一九七二年秋季，唯一還能上漲的股票只剩下所謂的「靈巧的五十檔」（Zifty
    Fifty），那些都是法人投資機構的最愛，如寶麗來、柯達和雅芳等等。這五十檔股票擔任了當時多頭的主秀，本益比都高達五十到六十倍。


    一九七三年一月，道瓊工業指數在6000點作頭，然後進入了美國開國以來最嚴重的空頭市場。三月十五日，那個訴訟案因為缺乏犯罪地點而被判不起訴，但幾乎沒有人知道這件事。整個市場都陷入了低迷的氣氛，而醫療管理類股只不過是眾多慘跌股票中的一分子罷了。


    一九七三年一月，先知把我叫進他的辦公室，告訴我由於市場陷入空頭走勢，金字塔公司也面臨裁減人事的壓力。「馬丁，我很遺憾，但是我們只能請你另謀高就了。」


    我驚訝地呆站原地。我還以為我們是並肩作戰的合作夥伴，而在這六個月當中，我也一直為金字塔盡心盡力，現在他們竟然翻臉不認人。


    但老實說，我早該想到這一天遲早會來臨。再一次的，他們為了自身的利益出賣了我。在史坦迪許被抓起來，並承認自己就是那個把我的報告外洩出去的人後，華爾街裡像朵夫曼這一類的評論家開始公開質疑，到底金字塔公司的管理階層有沒有善盡監督的責任，大祭司和先知自然而然成為首當其衝的人。


    我是寫了那份研究報告的傢伙，自然成了管理階層的眼中釘。但是在那樁訴訟案還沒有結束前，他們暫時不會辭退我，因為他們很清楚我知道太多可以毀掉金字塔的內幕消息，所以寧願多付幾個月的薪水，等到訴訟案塵埃落定後再把我開除。


    我當時只有二十八歲，在華爾街裡還是一個想法天真的小伙子。我是商學研究所的畢業生，但是在學校裡，卻從來沒有人教過我什麼是真正的「商學」。我的父親是一個名不見經傳的小商人，母親則是高中輔導老師。我在安默斯特主修的政治學和經濟學那一套紳士般的教育，在這裡派不上用場。


    我在海軍陸戰隊學的是永遠忠實、真誠待人。在昆恩·勞伯公司，我是整個團隊的一員，法維亞和布朗契頓則在背後監督、照顧我。我完全無法適應像金字塔那樣的公司在金字塔，你不能把防禦背心穿在前面，得把它穿在背後才行。


    我大概還有四萬多美元的積蓄，所以並不急着另找工作。我決定整個夏天休息一下，前往我在西罕普敦的度假屋住一陣子。我在海灘上碰到了幾個操作商品期貨的傢伙，他們說服我到芝加哥商品交易所去參觀。接著我投資五千美元和一個叫保羅·高斯坦（Paul
    Goldstein）的電腦狂合作，他靠著和别人合租一部電腦期貨作業系統來賺錢。高斯坦沒有自己的電腦，所以只好利用凌晨三點時便宜時段使用電腦。我也投資了二萬美元在一筆俄羅斯的小麥期貨交易上，這筆交易是我的老賭友瑞奇介紹給我的。瑞奇的期貨營業員比利有一個大靠山，和華盛頓的某個傢伙之间有熱線電話，因為那個傢伙認識到過俄羅斯的美國農業部官員，他們常常交換一些內線消息。


    二十年當中，因為美國國內醫療支出從國民生產毛額的6％暴增為16％而持續成長。在如此利多的背景下，雖然目前這些股票的本益比都比當年低很多，但是價格仍在這些年當中增值了好幾倍。所以我們那份報告的結論可說對了一半，也錯了一半。


    至於我，在這次事件後，職業生涯轉淡了好幾年之後，卻變得更堅強，得以磨練成為一名更好的操盤手。我也因為這個事件才有機會認識佐爾納，這對我來說未嘗不是塞翁失馬，焉知非福。


    事後想起來，我當時應該要繼續當一個合群的人，寫一些對醫療管理產業利多的報告才對。先知不可能不明白這一點，我真搞不懂當他要我和人面獅身一起寫那篇負面報告時，心裡到底在想些什麼？


    站在申請失業救濟金的隊伍中，我腦中清楚地浮現當先知看到我們的研究提案時，他真正要說的應該是：


    ## 公司內部備忘錄


    - 日期：一九七二年九月二十八日

    - 收文者：馬丁·舒華茲

    - 發文者：先知

    - 副本：人面獅身


    你這個白癡！我恨透了這篇關於醫療管理產業研究報告的大綱，我命令你馬上停止這項工作。


    這份報告很可能對我們兩個人的事業產生永久且具有毀滅性的影響。沒有人想看負面的研究報告。信託部門需要能幫他們解套的報告。他們會把報告放進檔案中，一旦股價下跌，就拿了出來說：「看吧！寫這玩意兒的傢伙比我聰明，薪水也比我高，我是看了他們的報告才買了這檔股票的。」


    此外，我奉勸你離人面獅身遠一點。人面獅身很想、也很有能力毀了你。為了你自己，好好想想吧！


    ## 第9堂課


    ### 別靠小道消息，因為它會讓你沒力量


    我很喜歡說自己是一個完全不靠小道消息或謠言來操作的人，因為利用謠言來操作，達不到目的。


    我認為想要在市場中成功最重要的一個基礎——努力工作。努力工作使你堅強；當你依靠小道消息操作時，一點力量也沒有。


    通常當你聽到一則小道消息時，已經慢了一步，而且手中不會有足夠的資訊。如果股價下跌，你就一點退路都沒有。在智能上你將會顯得衰弱，而當你衰弱時，將處於最容易受到傷害的環境地。和每一個市場中的玩家一樣，我也免不了因為聽了市場傳言而吃虧。


    最糟的小道消息，似乎總是在你操作最不利時候出現。當你手氣很背時，甚至可能會聽從擦鞋童無聊的小道消息。這就好像你在跑馬場裡，一整天都沒贏過錢時，你會側過身去，問身旁那個領社會救濟金度日的傢伙：「第八場裡你最看好哪匹馬？」然後他會說：「嗯，第六匹馬，傑瑞·貝理是他的騎師，所以牠一定會贏。」結果他今天表現糟透了，第六匹馬也只跑出第四名的成績。


    小道消息充斥的股票最常出現的走勢，就是劇烈震盪，它們上沖下洗，好像被採收者猛力搖晃的蘋果樹一般。當股價開始下跌，就是你最脆弱的時刻，也是最有可能恐慌性殺出持股的時候，因為你根本無法預期股價會跌到哪裡。你如果不衰弱，一定是正在賺錢，而如果你感到無力、無助的話，一定是處於虧損狀態。就像老人家常說，鍊子總是會在它最脆弱的那一點斷裂。在那個點上，你內心深處最可怕的恐懼控制了理智，然後你會說：「我是個笨蛋，為什麼又犯了同樣的錯？我以前就犯過這種錯，為什麼這些事會發生在我身上？」你感到驚慌而恐懼、覺得想吐，然後毫無理性、不計成本地拋出手中的股票。


    如果你想要靠某個謠言來操作，會希望是從一個成功率比較高的來源聽來的消息。我主要的來源就是「內線史基尼」（Larry Skin）。內線史基尼是一個喜歡在華爾街到處探聽消息的優秀股票分析師，他常和各大企業的執行長共進午餐，和那些上市公司董事交換情報，這裡聽一點，那裡又聽一些，四處搜刮小道消息。


    所以，內線史基尼來電時總是有消息可報。為什麼他要給別人這些消息？有些人就是喜歡幫助別人，這讓他們覺得很有權力、很有雅量，就像以消息來做慈善捐獻一樣，但是史基尼這麼做，其實另有原因。首先你必須了解內線史基尼可不只打了一通電話，他早就已經建立了部位，所以他会打個二十通電話。史基尼希望和每個人都成為好朋友，但他也要別人幫他的部位抬轎。只要股價向上跳個1/4元，你和其他人就會趕著上車，然後內線史基尼扮演的角色就不一樣了。他成為大家的操作顧問，每個人想要小道消息時，第一個就會想到他。


    - 「史基尼，怎麼搞的？到底發生什麼事了？」

    - 「沒怎麼樣，都很正常啊！」史基尼說。

    - 「在蘇黎世的會議進行得如何？」

    - 「哦，都很順利。是啊，我知道時間是久了點，不過這些事通常都要花比較長的時間，他們總得要做做姿態嘛！每件事都在預定的情況下發展，不要擔心，不要再緊張了，你老是這麼緊張。」


    等到你被市場修理時，你會進場加碼買進更多的股票，而另外十九個人也會同樣這麼做，所以股價的變動看起來似乎又回到穩定的狀況。每個人都鬆了一口氣，因為有人報給他們消息，而這檔股票的表現看來也不錯。可是接下來，股價會突然開始下滑，直到你心悸噁心、停損出場為止。


    這時，當你打電話給史基尼，問他到市場在搞什麼鬼，他才不想聽你跟他抱怨呢。「我也賠錢啦！」他說。「我賠得比你還要多！」但事實上，史基尼早已經出貨，正等著低接你們手中拋出來的股票。


    事實就是如此。你再一次發誓從此不聽任何小道消息，但是幾個月後，就在你的操作出現一連串虧損時，電話鈴聲響起，是內線史基尼打來的。「嘿！」他用一種神祕的語氣小聲地說：「我跟你講一個賺錢的大好機會。」


    ## 第 5 章


    ## 買黃金，讓我有安全感


    ### 財富要這裡藏一點，那裡藏一點


    「要多來點爆米花嗎，愛倫？」我低聲問，再次不經意地將手背掃過她的毛衣前面。那是一九六四年的聖誕假期，我們正坐在紐海文大學街上羅傑·雪曼戲院最後一排的座位上。


    我在安默斯特學院念大二，社交生活簡直乏善可陳。當初我之所以決定要到這麼好的學校就讀，就是想提升我的社交層次。我曾經花時間研究，譬如我會仔細閱讀一年級新生的相簿和通訊錄，從中挑出一些長得正、曾在名校念大學預科的女孩，然後一一打電話給她們，但最後總是被我拙劣的技巧搞砸。


    - 「嗨，你是蘇西嗎？我是馬丁·舒華茲。你今天過得好嗎？」嘟嘟嘟……。

    - 「麗茲，你好。我是安默斯特學院的馬丁·舒華茲。這個週末你有沒有興趣來玩牌？你可以打橋牌？當然好啊，一墩賭多大？」嘟嘟嘟……

    - 「哈囉，金芭莉嗎？我是馬丁·舒華茲。你從維吉尼亞的密德堡來，我聽說那裡可是養馬勝地，是吧？」嘟嘟嘟⋯⋯。


    於是，我又回到屬於自己的社交圈。愛倫·範恩是當時我約會的對象，是我高中同班同學，畢業後去念瓦薩（Vassar）學院。


    戲院裡燈光昏暗，銀幕上出現的是詹姆士·龐德那张英俊而溫文有禮的臉，充滿魅力的身影被框在一個槍管之中，正要為皇家祕密行動小組動，和另外一個犯罪集團的首腦對抗。龐德總是讓一群美女動心，這也不是什麼祕密了，這就是為什麼我約愛倫來看《金手指》（Goldfinger），希望龐德能夠幫我擔任破冰的任務。他在銀幕上怎麼把妹，我就在座位上如法炮製。


    我並不需要等太久。因為這部電影一開始就是一段火辣劇情，龐德和漂亮的金髮女郎吉兒·麥斯特森（Evangelina）裹在一床被子裡。當鏡頭裡的龐德在邁阿密楓丹白露飯店的陽臺上摟抱著吉兒時，我也正在紐海文市羅傑·雪曼戲院的最後一排座位裡摟著愛倫。當龐德把手臂環繞著吉兒時，我也把手臂環繞著愛倫。當龐德攻上一壘時，我也攻上二壘。在同一個時間裡，吉兒和愛倫都在我們的耳邊輕聲細語。


    真感謝〇〇七，事情順利極了，所以我決定試試看有沒有辦法盜向二壘。我慢慢地、平緩地，就像〇〇七一樣，開始採取行動，把手悄悄從她的肩膀向上滑動。「嘿，慢一點，」愛倫低聲說：「你以為你是誰？詹姆士·龐德嗎？」


    她掙脫，讓我感到有一些突兀，我猜想她應該是不想進展得太快。我得保持鎮靜，就像〇〇七一樣。


    ### 黃金為什麼充滿魅力


    我抬頭看著銀幕，龐德正在和金手指打高爾夫球，他們打球的地點是一個風光明媚的英式鄉村俱樂部。我立刻喜歡上金手指這個角色，他讓我回想起當年自己充當外祖父桿弟的情景。龐德和金手指站在第十六洞的果嶺上，而金手指正準備要打一個很簡單的推桿。「您到底有何貴幹呢？」他邊把球放好，邊對龐德說：「我想你可不是專程來和我打高爾夫球的吧？」


    噗通一聲，龐德故意把球桿放倒在球洞旁的草地上。金手指的身體略微抽動，這次的推桿也失準了。


    我眼睛一亮！我從來沒有看過任何一個比在草地中閃耀光芒的純金球桿更迷人的東西，我開始深深地融入這個描述金手指準備備用核子武器攻擊諾克斯堡的劇情之中。這真是高明的計畫，如果你能用核子武器摧毀諾克斯堡裡儲存黃金，何必大費周章地打主意去偷它？如果全世界黃金儲存量最大的地方受到攻擊，使得裡面存放的黃金成為廢物，那麼金手指手中持有的黃金，自然就會身價暴漲。當然，電影最後，龐德適時阻止了金手指的計畫，但即使這個計畫並沒有成功，金手指已經成為我的新偶像了。


    長久以來，我一直深深對黃金著迷。從法老王時代開始，猶太人就喜愛黃金，因為黃金一直是逃難者最容易隨身攜帶的貴重財物。當摩西從山上把「十誡」帶下來時，他的追隨者就是把誡文刻在黃金上。在接下來的中古時期、西班牙的天主教時代、東歐的共產革命，甚至二次大戰期間希特勒大屠殺之中，猶太人一直在逃難。我的祖父從東歐的動亂中逃亡到美國後，只要手上攬下了一點錢，就會拿去買黃金。我對黃金的渴求，根本是遺傳來的。


    黃金不會受空氣、熱度、濕氣和大部分溶劑的影響。在人類的歷史中，它不只是因為美麗和抗腐蝕性而享有高度價值，更因為比其他金屬更容易加工、保存成條塊狀態，也因爲稀少性而廣受收藏者的青睞。因為這些原因，黃金自古以來就已經被人類當作貨幣使用。


    長久以來，每個國家都以黃金作為衡量幣值的標準，也就是所謂金本位制（Gold standard）；當商業活動在十九世紀末急速增加，用來結算國際貿易帳的制度廣爲各國所需，黃金也成爲國際貨幣交易的基礎。


    一九三三年四月，老羅斯福總統（Franklin Delano Roosevelt）曾經命令美國人向政府繳出手中的金幣，大部分的人聽話照辦，但很多人還是把黃金私藏起來，包括我祖父在內。他才不願意交出那些二十美元面值的金幣呢！他偷偷把那些金幣存放在不同的地方，一直到一九五七年，有一天他什麼話也沒說，走到位於噴泉街底的首城儲蓄銀行（Seattle
    Savings Bank），拿他所收藏的金幣，向銀行要求以二十美元的面值來兌換。


    那時祖父的腦袋可能還停留在二十四年前，老羅斯福總統下達回收金幣令的那個年代。其實在一九五七年，一枚雙鷹金幣的市值早就已飆漲到一百美元了。


    ### 我愛黃金，也收藏硬幣


    我祖母蘿絲也偷偷藏了幾枚金幣，在我十三歲生日時，給了其中的一枚，那是一枚一九二五年「D版」的雙鷹金幣（Saint-Gaudens Double Eagle）。


    那枚金幣是由奧格斯特·聖高登斯（Augustus Saint-Gaudens）在一九〇七年所設計的，其中一面鑄著一隻飛向太陽、姿態雄偉的老鷹，太陽的光線打在牠的身上，老鷹上方刻著幾個字：美利堅合眾國、二十元。在那隻老鷹下方，沿著太陽的周圍，看起來像是光環的，則是「我們信靠神」（In
    God We Trust）幾個字。


    硬幣的另一面，則是一個留著濃密長髮的女人，穿著薄紗紡製的長袍，右手握著象徵自由的火炬，左手則拿著象徵和平的橄欖樹枝。她的左腳踩在一塊石頭上，使得身上的薄紗長袍因而繃緊，看起來美麗極了。石頭的上方刻著日期「一九二五」，而在兩道太陽的光線之間，鑄著它的版本「D」。畫面背景的下方，在幾道幾乎看不見的光線中，是一個微小的美國國會大廈圓頂。金幣的最上方是「自由」這個字，而四周則滿布著小星星。


    我愛死這枚金幣了，當時我輕輕地撫摸它好幾個小時，之後，就養成了收集貨幣的習慣。


    一九五八年，我買了第十版的《美國硬幣指南》（*A Guide Book of United States Coins*），那是尤曼（R. S. Yeoman）在一九五二年所寫的。這本型錄是研究貨幣者必讀的經典之作，每年都會再版。其中詳細記載了一種美國硬幣目前約略的市值，根據其品質和稀有性加以分類排序。我會拿

