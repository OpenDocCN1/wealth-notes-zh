    # 買畫，讓我學到禮貌、謙遜和人性


    六個月後，佛雷斯哥哥和柏雷特來拜訪我。「馬丁，」他們說：「我們有一個你可能會感興趣的建議。我們有一個大客戶，願意以七十萬美元買下你那幅沃諾的畫，我們認為以沃諾的畫而言，這是一個很好的價錢。」


    「我也這麼覺得。」我說。那是我們九個月前花四十萬美元買進的一幅畫，持有九個月後能享有七五％的報酬率，這對奧黛莉和我們來說是很不錯的績效，所以我們把《花園裡的農夫》賣給了那位收藏家，現在那幅畫正掛在法國的美國藝術博物館中。


    在這些年當中，只要價錢合適，我們也透過佛雷斯哥哥與柏雷特畫廊賣出其他的畫作。好的藝術品，是一種投資標的物，一種可以像金融工具一樣被買賣的商品。蘇富比和佳士得這兩家公司很清楚這點，而其他數以千計和佛雷斯哥哥與柏雷特畫廊一樣的藝術品商也是如此，他們是真正造就這個市場的參與者。但藝術品不只是一種投資標的物，它們具有更高尚的意義。不同於買賣債券、期貨或其他證券，在我買進一幅畫之前，我就已經知道擁有這幅畫的前手是誰，而在我打算把一幅畫賣掉前，我也希望知道誰是買主。這是一種情感、道德上的差異。


    我買的畫就像家裡的客人一樣。一早醒來我就可以看到厄尼斯特·勞森的畫，我和斐德利克·佛利錫克的畫一起共進晚餐，我看書的時候則有溫斯洛·霍姆和查爾德·哈桑姆的畫作為伴，而在我的座位旁則是普倫德加斯特、威廉·格列肯斯和瑪莉·卡塞特的作品。正如同我母親在很多年前'
  - '[PAGE 210]


    就知道的一樣，這些畫教給我許多在艾迪．柯漢家地下室或交易場中沒辦法學到的事——禮貌、謙遜和人性。這些畫，讓我了解到賺錢並不是這個世界上最重要的事；這些畫，造就我成為一個更好的人。


    在我們搬進公園大道的幾年後，我被選為大樓管理委員會總幹事，隨後又馬上當選管理委員會主委。有一天，我在辦公室裡接到一通在大樓裡住了二十多年的住戶打來的電話。「舒華茲先生，」他說：「我可以去拜訪你嗎？」


    我們在我家的客廳坐了下來。「舒華茲先生，」他眼睛看著地板，然後說：「我最近發生了一些不順利的事，我相信只要給我一些時間，事情就可以解決。但是以目前的狀況，我恐怕沒有辦法按時支付這個月的管理費了。」


    起初我不知道該說些什麼。我實在很難相信能住在這棟大樓裡的人，會沒有辦法按時付他們的管理費。就法律上的觀點，我可以對外宣布他無法付款，並逼他賣掉資產來支付積欠的管理費，這是那些管理委員在七年前會採取的行動。但是我是一個從紐海文來的街頭小子，和那些人不大相同。當他們擁有權力時，隨時可以修理我，可是當我擁有同樣的權力時，我會用人性化的做法相待。因為我曾經被別人欺壓，我知道被欺壓的感受。


    「這樣吧，」我說：「您已經在這幢大樓住了有二十五……還是三十年？慢慢來，先把你的事情處理好，不用擔心你欠的管理費。我相信你有能力解決問題，然後再把管理費付給我們，我們在合理的時間內，不會向你追討這筆錢。」'
  - '[PAGE 211]


    他大大鬆了一口氣。當他站起來準備告辭時突然停住片刻，仔細端詳我的客廳。那時掛在牆上的畫，價值比我們所住的公寓還要高。「您的畫作收藏真是一時之選。」他說。

    「謝謝誇獎！」我說：「我的家人喜歡這些畫，而保有這些畫也是一件好事，你知道，尤其當有什麼意外發生的時候。」


    # 第10章 沒帶武器，千萬別上戰場


