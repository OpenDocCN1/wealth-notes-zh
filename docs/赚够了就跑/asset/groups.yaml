    我預期，這次的國會選舉日會是一個忙碌的交易日。在美國，總統選舉日通常會休息，國會選舉日則照常交易。但往往由於銀行休市，加上選舉結果的不確定性，華爾街會瀰漫著一股觀望的氣氛。再加上，投資者並不真的確定就算共和黨贏了，算不算一項市場利多。


    那次選舉，算是對雷根政府滿意度的檢驗。當時，白宮和參議院都是共和黨的天下，而經濟是選舉的重大議題之一。民主黨大力抨擊雷根主政後，創下美國大蕭條時代以來最嚴重的失業率，並且宣稱一旦共和黨獲勝，將大砍社會福利預算。共和黨呼籲選民「維持現狀」，而民主黨則嗆聲說那根本是「維持慘狀」。民意調查顯示，共和黨將在參議院選舉中有優勢，而民主黨則在眾議院保持領先。我認為結果應該相去不遠，也不期待市場會有什麼出乎意料之外的結果。


    但是，令我驚訝的事發生了。


    股市一開盤就跳高，而且道瓊工業指數在收盤時也穩穩地收高一六．三八點。成交量從前一個七三三五萬股上升為一○四七七萬股，算是非常大的成交量。後來果如預期，選民決定維持現狀，讓共和黨繼續控制參議院而民主黨控制眾議院。顯然，不管哪一黨獲勝，多頭已成定局。


    我在那天早上就已經作多，然後在收盤前轉而放空，因為當市場突然勁揚時，我總是在收盤前漸漸作空，等著獲利賣盤出現。當時道瓊工業指數從那年八月以來，已經上漲了三○%，而且剛剛破了一九七三年以來的千點關卡。當天S＆P指數開盤在一三七·七，走高到一四○·九，最後拉回收在一三八·八五，以一四○·九點收攏。我所有的指標都顯示市場處於超買狀態，而事實也的確如此，當天股市先漲後回的走勢，讓我的操作得心應手。而當天報價機上的盤後交易中，公債期貨價格並沒有顯示什麼明確的結果，所以我不打算留下任何隔夜部位。


    「馬丁，我想要買一件新外套。」奧黛莉在我們準備收拾回家的時候說。我並不感到意外，她才剛和我的岳母大人通過電話。「我明天想休息一天，和我媽一起去逛街。她知道有個皮草商正在跳樓大拍賣，我想去挑一件貂皮大衣。」


    奧黛莉穿起貂皮大衣來了？這可真像共和黨的格調啊！沒關係，想要就讓她買吧，這是她應得的。何況，我們才剛剛知道她又懷孕了，就讓這貂皮大衣幫她和我们的孩子抵擋紐約的寒冬吧！


    「當然好啊！」我說：「我想明天不會有什麼了不起的行情，你就休息一天，和媽一起去買件溫暖的大衣吧！」


    ### 大家都說會漲，難道就一定會漲嗎？


    第二天早上，我輕鬆地開車上班，因為我不認為今天市場會出現明顯的多頭或空頭走勢。股市開盤，漲跌互見，債券則大漲。原先市場上一直猜測，聯準會將會在選後宣布降息，《經濟學人》雜誌也預測貼現率會關降，所以我就買進了一百五十口
    S & P 期指。


    不過，我一直有點不確定，因為我所有的指標都顯示市場正處於短線超買的狀態，而且誰知道聯準會最後會做出什麼樣的決定。我往椅背一靠，想和奧黛莉說說話，才想起她並不在我身後。我真正希望她會打個電話進來，但看來機會不大。奧黛莉和她老媽逛街，才不會想到我。


    十一點了，我開始感到有點緊張，市場不停地往上衝。我清楚地聽到身後那些粗俗的鄉巴佬又開始製造噪音。 「大頭鬼！一定有北洋電訊（Toshiba）網上了火箭。」
    IBM 在動嘍！這列藍色火車也該動了！「你看看電機股，看看證券股，連那爛爛的股票都在漲耶，動得快到報價盤幕都跟不上！”「「快報價給我，你這個笨蛋！」「「去你的，幫我市價買進五千股
    AT&T ！” …………………


    我看了一下報價機，看到市場迅速上揚。我該怎麼做？“就像昨天一樣，”我自言自語：“我想平倉。指標告訴我市場已經超買，待會兒就會開始回軟。奧黛莉，我該怎麼做？”當然，不會有人回答我。沒有人能告訴我，我是不是真的想這麼做。


    我拿起電話，然後開始下單、放空 S & P 期指。 「黛比，每支股票都在漲，不過我覺得撐不了多久，現在價位在哪裡？“三百九十二？賣掉我昨天早上買的那十五口，再幫我賣出另外五十口。」


    可是，市場還是一直往上涨。中午過後，我又在“四百〇〇五放空了另外二十五口，到了下午一點十分，又賣出一百五口在“四〇〇四。到了下午兩點，市場開始稍微回軟。「黛比，價位現在在哪裡？“一四〇〇九五？太好了，我就知道市場已經超買了。再賣出五十口。”


    沒想到，下午三點，市場來了個回馬槍，向上勁揚。


    ### 完全的、不可思議的自我毀滅


    在我的報價螢幕上，公債現券也正在飆漲，而S＆P期指則已經鎖在一四三．八五的漲停價。根據交易所規定，S＆P期指一天只能向上或向下波動五點，一旦觸及漲跌停價，當天就不能繼續交易。


    我坐在位子上詛咒奧黛莉和我的岳母大人。買件破貂皮大衣，怎麼會需要花這麼長的時間？我愈焦慮．就愈想說服自己的看法是正確的。我看著報價螢幕，債券價格仍在上漲。那又怎樣？市場不可能就這樣漲到底吧？市場明明就是超買了呀！到了三點四十七分，離收盤還有二十八分鐘的時候，我打電話給黨比。「現在價錢在哪裡？我問你現在價錢在哪裡？該死！」


    「馬丁，市場現在仍然鎖在一四三．八五的漲停價。」


    「再賣出五十口！」


    「在漲停價？」


    「你聽到我說的！不要再跟我廢話，照我說的去做就對了！」我已經失控了。如果奧黛莉在我身邊的話，一定會給我個耳光，阻止我做出在漲停價加碼放空這麼無比愚蠢的事。在這樣的情況快被市場多頭幹掉了，她都不在乎？為什麼她没有在我身邊告訴我：「馬丁，你知道自己在做什麼嗎？馬上停止放空，然後把所有的空單補回！現在就補！」


    更糟的是，我的另一項指標明白顯示，市場走勢完全與我的部位相左，儘管這個指標的可信度幾乎無懈可擊，我竟然全然無視於它的存在。當紐約客看到芝加哥的哥兒們靠著 S&P
    指數期貨大撈一票後，跟著也成立了自己的生財工具——紐約期貨交易所（別稱小刀）。雖然它推出了幾乎完全抄襲 S&P 指數概念的紐約證交所指數（NYSE Arca
    Stock Exchanges, Inc.（NYSE））期貨，但是交易量從來都沒有辦法趕上芝加哥交易所 S&P 期指的業績。NYSE 期貨的價位變動，大約和
    S&P 期指成四比七的比例，所以如果 NYSE 上漲了四點，S&P 期指就大約會上漲七點，反之亦然。


    通常我對於這把「小刀」的動靜並不在意，因為它和 S&P 期指相較，簡直微不足道。


    不過現在，S&P 期指已經漲停了，要不是有漲停板的限制，價格恐怕不知道會飆到哪裡去？如果奧黛莉現在也在場的話，一定會冷靜地下單到還沒漲停的 NYSE 交易場內，把我的部位砍掉。但是她現在正和她老媽逛街買貂皮大衣。


    過去的就算了？過去的就算了？


    到了三點五十八分，根據我的報價機，NYSE 期貨上漲了四．○五，而且因為它的成交量比較小又沒什麼人注意，所以並沒有漲跌停限制。雖然如此，我卻加碼賣出了五十口的
    S&P 期指。


    ### 太害怕虧損，就不會有贏家心態


    我要讓交易場那些人瞧瞧，知道誰是交易圈的大哥大！雖然 S&P 期貨實際上可能已經漲了七點到一四五以上，但我還是在漲停價一四三．八五加碼賣出這五十口。我在轉眼間就每口損失了一千美元，總計五萬美元，真是狗屎。


    我完全失去理性。對我而言，所有不利的證據都清楚地擺在我面前的報價螢幕上，而我卻拒絕相信。「NYSE期貨的市場流通性太低了，」我咆哮著：「去他的，它的價格不可能是對的！毫無疑問的，NYSE
    的價格當然是正確的，我自己其實也知道這點，但是奧黛莉並沒有在身邊提醒我這個事實。她和她老媽上街去買大衣，我真是快氣瘋了。


    等到市場終於收盤的時候，我已經持有二百五十口 S&P 指數期貨的空頭部位。我真不敢相信這個事實！當我收拾公事包準備回家時，已經頭昏腦脹，我穿上大衣往門口走去。一個坐在我後面叫雷・古拉（Ray
    Gura）的鄉巴佬，還在他的座位上結算部位。「嗨！馬丁，」古拉說：「你覺得今天的市場怎麼樣？在三天內就上漲了 8%，光是今天就飆了四三．四一點。這可是歷史最大漲幅，你一定是崩了把！」


    「是啊！今天可真是個大日子。」古拉是個好人，也是洋基隊的忠實球迷。他比其他那幾個鄉巴佬年紀都大些、也客氣些，而且總是對奧黛莉非常禮遇。


    「我們今天看你在座位上跳來跳去一整天。嘿，你還好嗎？你看起來臉色不好看呢！」


    「喔，我很好。我只是忙了一整天，有點累罷了。」


    「嘿，賺錢怎麼會覺得累呢？要是我有一天能賺這麼多，再累都沒問題。」


    可惜，我是站在和市場對立的一邊！開車回家的路特別漫長。我從來沒有輸過那麼多錢，也從來沒想過自己會輸這麼多錢。如果以每日市價評估的方法來看我的交易帳戶餘額，光是今天，我就輸了六十萬美元。而且由於
    S & P 期貨在收盤前半小時就已經鎖住漲停，而NYSE則一路繼續上揚，所以明天早上一開盤，我的損失還會持續擴大。


    我怎麼會幹出這麼愚蠢的事？


    「奧黛莉，你怎麼沒打電話給我？」「回到家裡時，我大聲咆哮。「我放空了二百五十口期貨，我們可能會輸掉一百萬美元！」


    「好噓，過去的就算了。明天我們再去面對、解決問題吧。反正都已經放空了，你今晚再煩也無濟於事。」


    「過去的就算了？說得輕鬆啊！奧黛莉，我在一個小時內賠了快一百萬。你為什麼沒有打電話給我？」


    「我和媽整天都忙著挑選皮衣。等到你看見我買的皮衣，你一定會愛死。」


    妙極了！我被市場剌皮的時候，她正忙著挑皮衣。這正是奧黛莉最教我感到驚奇的地方：她對我所做的交易，從來不會有情緒性的反應。對她而言，金錢好像並不真的存在，賺錢和賠錢只是我做了一堆交易所產生的結果。而她往往能假設當我做完所有交易後，賺的會比輸的多，就算其中有一筆交易輸了一百萬美元。


    ### 馬丁，你只能接受這個事實了


    我得找個懂得交易的人談談，而這個人就是佐爾納。


    「佐爾納，你怎麼看？我放空了二百五十口S & P期指，我真的覺得快掛了。我該怎麼辦？」


    「馬丁，你並沒有針對問題來思考。你不能再還沒把車先排進空檔，就要從倒車檔直接進一檔。你必須改變部位的方向，你一定得馬上停損。平掉所有的空倉，回到沒有部位的中立狀態。只要你把欄部位先清掉，就能把情況看清楚。」


    「佐爾納，但是市場就要反轉了呀。我所有的指標都顯示市場已經超買了，我不能現在砍掉部位，市場一定要快要反轉回來了。」


    「得了吧！控制一下下自己，你不可能比市場更精的。你的指標錯了，價格走勢顯示，市場認為選舉已經結束，而聯準會將會調降貼現率。利率一調降，所有的基金經理人就會開始把資金從貨幣市場轉回股市。當然市場可能會向下掉一點，但你可不能指望著這點，你得平掉所有的部位。相信我，接受這次的虧損。你要記住，留得青山在，不怕沒柴燒！」


    「謝謝。我知道你是個了不起的操盤手，也知道你是對的。但是一百萬美元的損失……，這可是一大筆錢。」


    「馬丁，你只能接受這個事實了。」


    我整夜翻來覆去，不能成眠。為什麼在一切都要上軌道時，總是發生這種事？就在幾天前，我覺得自己像先知約瑟，現在我覺得自己像受到仇視的約伯。而奧黛莉是怎麼搞的？她一點也不知道明天一早我們就要損失一百萬美元嗎？她怎麼能睡得那麼四平八穩？


    第二天早上，我對於進辦公室後要平掉所有賠錢部位這件事，簡直憂慮不堪。真希望S&P期指能夠開低，這樣我就能夠再觀望一下。搞不好我的指標都錯了，更搞不好市場馬上就要證明自己是对的，它已經嚴重買超了。但不管怎樣，知道奧黛莉會陪在我身邊的感覺真好。


    S&P期指開盤跳空在一四五，比前一天的收盤價上漲了一．一五點。「狗屎！」不過沒我想到麼糟。「我說：『當昨天NYSE期指收高四．一點的時候，我推算S&P期指開盤至少會跳高到一四五．五，所以市場好像比我想得要弱。也許我該在這裡再加碼一倍。』昨天的我或許真的會這麼做，但現在起我要聽聽奧黛莉的意見。「趕快減碼吧，馬丁，快減碼！」我們已經討論過這件事了，你得做你必須做的事，現在就做吧！」


    當奧黛莉站在我旁邊不停告訴我「降低部位，降低部位」的同時，我開始在市場轧平我的空頭部位。我每多買進一口契約，表示自己可能損失的就更少。在開盤後的四十五分鐘內，我把爛部位完全清乾淨了。我一直想著損失了一百萬，但事實上當我轧平所有部位時，我的總損失才八十萬美元而已。而佐爾納是對的，就在我把部位轧平的同時，開始覺得舒服多了，也鬆了一口氣，氣色也好了起來。


    接下來的四週裡，我和市場全力奮戰，把損失的錢幾乎都賺了回來。到了十一月底，我的當月損失只剩下五萬七千美元。而在十二月份，我賺了九十二萬八千美元，總計在那年靠期貨交易賺了超過三百萬美元。我的確犯了大錯，當奧黛莉不在的時候，我失去了自我控制，發瘋似的賣出期貨，直到市場漲停了還不罷手。


    這並不重要，重要的是奧黛莉和佐爾納讓我了解到自己的錯誤，並在一切還沒太遲前加以修正。如果當時我沒有軌平那些賠錢的部位，恐怕得花好長一段時間才能恢復元氣。


    年底假期來臨前，奧黛莉帶著她的皮大衣回家。那件黑貂皮大衣真是美極了，她把大衣從盒子裡拿出來穿上，像個模特兒般走來走去。「瞧！馬丁，好得沒話說吧！」


    我走過去用手背摩撩著大衣上的毛皮。毫無疑問，這件黑貂皮大衣正好可以幫我的寶貝們保暖。「棒極了，」我說：「它可是花了我們八十萬美元呢！」


    ## 第四章


    不要在輸錢後，再把更多錢送出去！


    每個操盤手都得面對它，卻只有真正的贏家知道如何處理它。在短期內發生一連串惱人的虧損，這種現象總是一再出現，深深困擾著偉大的操盤手。它使你喪失判斷力，逐步消耗自信心。有時候，它能讓你掉到一個永遠無法跳脫的低潮中。你很確定一定有什麼事不對勁，使自己喪失了對市場的敏感度，再也無法在市場中求取勝利。一旦你身陷其中，會覺得一切的不順利像是永無止境。在大部分這類情況中，你的判斷力和市場節奏都會消失無蹤，這時你唯一該做的，就是暫時停止交易，先冷靜下來再說。


    結束一連串虧損的最好方法，就是馬上停損，並且把自尊心完全從這場金錢遊戲中排除。多年前在拉斯維加斯的賭桌上，我就已經學到了這一課。賭場有句老話：「不要在輪盤後，再把更多錢送出去。」雖是老生常談，卻是至理名言。你必須審慎地管理所擁有的有限資源，並且絕不讓自己產生太大的虧損。許多人在輸錢時會加倍賭注，希望下一把骰子能將所有虧損彌補回來，採用這種策略的下場通常都很慘痛。要停止繼續虧損，最好的方法是停止交易！馬上停損，立刻停止流血般的虧損！休息一下，讓你的理智控制住情緒性反應。任何時候當你準備再出發時，市場都還會在那裡。


    但是請相信我，這麼簡單的建議可真是知易行難啊！一九九六年八月，我正陷入交易生涯中最糟的一連串虧損中，更讓我抓狂的是，雖然我很認真檢討那些造成虧損的交易，但是因為太害怕虧損，以至於我無法以贏家的心態來思考。這種對虧損的恐懼使我的反應速度大幅減低，而一旦我的應對愈來愈遲緩，又讓我面臨更大的交易風險。我所必須做的就是暫時退場、重新充電，但是當時我做不到。當時有個傢伙約我去打高爾夫球，我知道自己得休息一下，於是答應和他打個十八洞，但就在我準備出門時，竟不自覺地想做些什麼——我就是無法眼睜睜地看著市場一路上揚，自己卻未能插上一腳。於是我在出門前買進了十口S＆P期貨契約，然後因為這個爛部位又輸了二千五百美元。不但毀了我愉快的一天，還再度折損了自信心。


    你永遠不該在還沒把車子排進空檔前，直接從倒車檔排進一檔。同理，你得先軌平所有的部位，才能使惡劣的交易情況有所改善。你必須懂得停損！當你對虧損的恐懼逐步上升時，情緒會開始使理智短路，而你对自己的所作所為將不再有信心。停止情緒性反應！冷靜下來！並且靠你的理智重建動能。記住，時間永遠是你的盟友。利用時間來放鬆心情、澄清思緒，重新找回你的能量。


    一旦已經執行停損，就坦然接受你所承受的虧損，經過一陣準備階段，等你對交易習慣和操作方式再度感到認同後，就能準備好重出江湖了。重新出發的最好方式就是先少量操作，並把重心放在獲利的穩定性上。千萬不要在重新出發時，馬上想大撈一票。


    當我回到市場上時，會找一個很滿意的交易機會，然後少量操作，並且設定嚴謹的停損。如此一來，如果我又犯錯，就馬上砍掉出場。我隨時都在提醒自己「賺小錢、賺小錢」、「獲利、獲利、獲利」。這些都是心理層面的問題，我覺得自己在這方面生了病，而應該借著這些方法使自己得以復原。我極需恢復自信心，因為自信心是成功操盤手不可或缺的要素。我在另一天建立了三口契約部位，這對我是說小到微不足道的部位，但是我最後卻靠著這三口契約賺了一萬五千美元。我拿著這筆錢在次日又把總盈餘增加為四萬美元，突然間，我再度找回了從事交易的熱度，這感覺真棒！

    '
