    \ 2.总结成长收获：在经历这些阶段后，在各方面素养的收获，如务实，耐心，思考方式，执行力等各方面的收获，包括薪酬如何涨到目前这个阶段。让新人知道未来会有那些收获，对未来充满期望。\
