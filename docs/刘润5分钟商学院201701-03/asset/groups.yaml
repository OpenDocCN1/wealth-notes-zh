    # 给《5分钟商学院》加个餐


    作为一个商业顾问，我接触过很多企业的管理者，发现他们普遍面临一个比较大的挑战，就是没搭建起系统性的商业认知框架，这就使他们的归因能力很成问题。


    # 什么叫归因能力？就是做了一件事，做成功了，但是未必知道自己是怎么成功的。于是，当面临企业转型或者再次创业时，他们往往很难获得二次成功。而那些获得二次成功甚至是三次成功的企业家，通常都被认为是战略家，因为他们具备基础的商业认知框架，能够理解商业行为的规律，能做正确的归因。


    如何训练自己获得这个能力呢？最近，我和得到APP的知识新闻工作室聊了一些个人感悟，想听的话，来首页的知识新闻，直接收听《刘润：商业最重要的归因能力》。 （2.28号零点上线）


