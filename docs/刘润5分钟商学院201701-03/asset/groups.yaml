    跟我们看创业者一样，投资人通常也会倾向于从自己相对比较熟悉的相对有竞争优势的行业入手。我个人原来看企业服务和硬件比较多，理解这两个行业的投资逻辑，所以会在这两个领域有相对多的案例。但是早期投资有趣的地方就是创新和变化很多，所以投资人也需要不断的学习，不断的提升自己的认知，拓展自己的能力圈。我过去两年，在看到新媒体的结构性机会之后，在这个领域也做了不少投资，另外，在数字医疗、金融技术和消费升级方面，也做了一些尝试。


    从分配精力的角度，对于已经一定认知的行业，我经常会关注一些最新的动态，但是判断逻辑相对稳定；对于新的感兴趣的行业，则需要去花不少时间进行主题研究。通常争取一年能够对一两个新的领域有相对深入的理解。而从时间分配的角度来看，跟不同领域的创业者见面可以拓展对新领域的认知，对特定的专题则会做系统的研究，另外，我每天也花不少时间听得到APP。


    ## 要进入一个新的领域，纸上谈兵、仅仅做逻辑推演远远不够，第一手的产品体验至关重要。


    如果我们看一个新领域，我就会把市场上这个品类所有的产品都细致的体验一遍，从一个很挑剔的用户角度去看问题。比如在投资平衡车之前，我就买了市场上所有的平衡车产品，每天用平衡车上下班，每天换个品牌，感受这个产品究竟做得怎么样。产品能反映出很多问题，包括创始人的人格、对用户的理解、对用户需求的优先级排序等等。像用户一样去体验产品是一个很有效的判断方式。


