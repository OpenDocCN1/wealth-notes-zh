    企业的三个不同阶段，实际上对应着产品生命周期，也就是润总所说的：“人无我有，人有我优，人优我廉，人廉我转”。当公司主业产品行业走到打价格战的时候，是考虑企业转型的时候了。

    拿通用来说，杰克韦尔奇的多元化战略使GE走向了高峰，壮大了GE Capital。到了杰夫伊梅尔特时代，考虑到金融部门带来的波动和不确定性，将会影响GE工业服务业务，伊梅尔特决定砍掉GE金融部门，回归工业本质。这就是企业转型，此一时，彼一时。

    关于如何让企业永续经营，Google创始人拉里佩奇的观点值得借鉴。这点吴军老师在硅谷来信中有讲到：佩奇认为全世界有一种海蛞蝓可以不死，这种海蛞蝓在正常情况下也会生老病死，但是如果刻意用针去刺激它，它会长出新的细胞，当母体死亡时，新生的细胞会发育成完整的海蛞蝓。

