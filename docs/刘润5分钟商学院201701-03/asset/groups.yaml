    3.18号，《5分钟商学院》商业篇第二次线下大课将在上海开课。这次大课，我将依焕然整整一天的时间，好好与大家分享我对商业世界的看法，以及如何抓住这个时代的商业机遇。


    我会从四个角度分享我的看法：


    # 第一，洞察变化：感知正在生成的未来。


    所有的商业，都要顺势而为，一定 要理解时代的变化，才能正确抓住变化。到底是什么在推动最近这几年商业世界翻天覆地变化的底层逻辑？我希望带领大家感受这个逻辑，并且根据这个逻辑，感知未来。


    # 第二，抓住不变：深刻回归商业的本质。


    看清变化的，是观察家，而看清不变的，才是战略家。我会在这部分把大家从变化中拉回来，回到商业的本质，找到那个没有变的基  ，思考我们应该如何应对。


    # 第三，创造价值：必须脱离人口红利。


    回到一个企业的微观，任何一个企业，在商业大环境中都是微观个体。从个体角度看，我们如何做出改变？我会从创造价值的角度，分析我们看到的三个红利，其本质，是创新的机遇。


    # 第四，传递价值：尽量短路用户距离。


    互联网今天对传统行业到底产生了哪些影响，又给了我们哪些机遇？为什么互联网对中国线下机构如破竹，但对美国影响不大？我们应该如何利用互联网，提升传递价值效率？我将好好分享我的观点。


