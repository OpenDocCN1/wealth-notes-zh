    主讲人：刘润


    作为管理者，你的优秀员工离职，你会安排一次离职面试吗？分手了，现在还在做朋友吗？作为员工，你是带着感激离开上一家公司的，还是带着怨恨呢？来和我一起过过招吧。


    如果你听说朋友中有人正在焦虑员工离职的问题，不妨把今天的课程推荐给他，帮他解决燃眉之急。点击右下角“请朋友读”，一键分享知识红包。


    3.18号，《5分钟商学院》商业篇第二次线下大课将在上海开课。这次大课，我将依托花整整一天的时间，好像与大家分享我对商业世界的看法，以及如何抓住这个时代的商业机遇。（从周日在专栏内发布消息之后，不到24小时，“白天十晚上私享会”的10个名额已经被一抢而空，到今天下午，白天大课仅剩不到90个席位。）


    我会从四个角度分享我的看法：


    # 第一，洞察变化：感知正在生成的未来。所有的商业，都要顺势而为，一定要理解时代的变化，才能正确抓住变化。到底是什么在推动最近这几年商业世界翻天覆地变化的底层逻辑？我希望带领大家感受这个逻辑，并且根据这个逻辑，感知未来。


    # 第二，抓住不变：深刻回归商业的本质。看清变化的，是观察家，而看清不变的，才是战略家。我会在这部分把大家从变化中拉回来，回到商业的本 Ips，找到那个没有变的基础，思考我们应该如何应对。


    # 第三，创造价值：必须脱离人口红利。回到一个企业的微观，任何一个企业，在商业大环境中都是微观个体。从个体角度看，我们如何做出改变？我会从创造价值的角度，分析我们看到的三个红利，其本质，是创新的机遇。


    # 第四，传递价值：尽量短路用户距离。互联网今天对传统行业到底产生了哪些影响，又给了我们哪些机遇？为什么互联网对中国线下机构如破竹，但对美国影响不大？我们应该如何利用互联网，提升传递价值效率？我将好好分享我的观点。


    这次的大课，内容会保证和第一次一样的原汁原味。同时，也做了几个升级。第一，我们增加了场地的容量，希望能满足更多学员；第二，晚上的10人小规模的封闭的私享会，将会把晚饭、讨论合二为一，留出更充裕的交流时间；第三，为了鼓励大家集体学习，对于2月12日~3月12日这一个月的内，一次性购买《5分钟商学院》200张电子卡或者实体卡的同学，赠送一个这次线下大课的名额。


