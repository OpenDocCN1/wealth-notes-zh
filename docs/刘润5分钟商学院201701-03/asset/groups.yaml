    # 123｜“大企业病”有得治吗？


    假如你是一位中层管理人员，你渐渐发现，自己不能胜任现在的工作了，总是被老板批评，你非常担心万一失去工作，如何支付你儿子国际学校的高昂费用？


    你现在有三个选择。第一，主动辞职，把职位让给更优秀的人；第二，雇一位更优秀的人，协助自己工作；第三，任用两个水平比自己稍低的人当助手，一起把事情做好。你会选哪一个？


    # 概念：帕金森定律


    大部分人会选择第三条。为什么？第一条路显然不能走，一辞职，立刻陷入经济危机；第二条路也不能走，那个人很可能成为你未来的竞争对手。只有第三条路。你找人分担了你的工作，儿子的国际学校也保住了。


    然后，你的两个平庸的下属，再为自己找到更多的下属，下属的下属再找下属。如此往复，最终产生臃肿的管理层。


    这是著名的“帕金森定律”。


    1958年，英国历史学家、政治学家西里尔·帕金森出版了《帕金森定律》一书。他说，组织一旦形成，就会受到“增加下属法则”和“增加工作法则”的影响，开始自我膨胀。


    # 法则：增加下属法则


    我先来解释一下“增加下属法则”。回到最开始的问题。为什么大部分人会选择第三条，也就是“增加下属”？那是因为：权力的危机感。


    # 法则：增加工作法则


    帕金森说，一个人可以在10分钟内看完一份报纸，也可以看半天；一个忙人20分钟可以寄出一叠明信片，但一个无所事事的老太太为了给远方的外甥女寄张明信片，可以足足花一整天。这主要是看，你有多少时间。有多少时间，你就会忙多久，而且还觉得自己忙得很
    unraveling。


    # 运用：对症下药的两个建议


    第一，严格控制用人权。


    第二，严格控制人头数和成果的关系。


    # 小结：认识帕金森定律


    帕金森定律，就是组织一旦形成，就会受到“增加下属法则”和“增加工作法则”的影响，开始自我膨胀。


    怎么办？第一，严格控制用人权，第二，严格控制人头数和成果的关系。


