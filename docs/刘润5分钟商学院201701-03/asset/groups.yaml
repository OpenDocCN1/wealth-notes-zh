    \n## 留言精选\n\n彤彤爸爸 63 未来公司，除了在找人，招人方面需要竞争，接下来就是培养人。培养人才这个模块好比人体的造血器官，为公司输送新鲜血液，保障公司的正常运营。重要性不言而喻。我们公司是典型的人力型企业，所以对人才培养非常重视。我们有套培养新人的《天龙八部》可以分享给大家：\n\
    \n- 一、HR暖心会：\n  目的：破冰，熟悉环境，帮助融入。 1.认可优点：告知新人哪些地方具备潜力。 2.互相了解：了解对方成长细节及需求。 3.介绍团队：介绍直属领导和团队。\
