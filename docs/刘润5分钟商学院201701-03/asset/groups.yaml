    ## 概念：战略思考


    你想从上海去珠穆朗玛峰。珠峰是愿景，从上海到珠峰画条直线，就是方向。但如果你恰好不是超人，不能顺着这条直线飞过去，那这个直线就不是路径。


    你必须深刻了解地面环境，选择可行路径，曲线到达目的地。这条曲线路径，就是战略。


    > 作为CEO，最重要的工作，不仅仅是定愿景、指方向，然后激励大家前行，更要懂得战略思考，画出曲线路径。这是CEO不能推卸的责任，不可没有的能力。

    ——7号写过想法


