    # 周末小结｜谷歌的目标管理方法


    《5分钟商学院》的同学们，


    大家周末好！


    本周我们进入“反求诸己 从经理到总监”的部分，我们讲了管理者必须清晰知道收入来源和成本结构，要保持战略专注、如无必要、勿增实体，要懂得抓大放小管细，还讲到了管理者要先把企业的使命和任务转化为经营目标，再用KPI、OKR等绩效管理工具分解执行考核。尤其是绩效管理和目标管理这两块，值得同学们反复琢磨。


    目标管理是一项非常重要的技能，谷歌的OKR是一个非常有效的做目标管理的方法，外面有很多关于谷歌OKR的方法论的传言，但不少都是道听途说。这里分享一篇我最近看到的，《硅谷来信》的主讲人吴军老师关于谷歌的目标管理方法的介绍。吴军老师曾供职于谷歌，是谷歌中、日、韩搜索算法的发明人，对于谷歌的目标管理有非常多的亲身实践。在征得他本人的同意后，我节选了这篇文章的一部分，一起来听听看他的亲自解答，我会在第四季度专门抽一期来讲解这块。


    # 节选自《硅谷来信》第114封信


    Google的每个员工每个季度都需要给自己定一个或者几个目标（Objectives），以及衡量目标是否达成的关键结果（Key Results），这几个词合在一起被称为“OKR”。

    每个人的OKR会放到自己的网页上，大约半页纸长，大家都可以看到。如果谁没有制定OKR，一目了然，即使没有人催你，大家看到你的网页上面是一片空白，你自己都不好意思。到了季度结束时，每一个人会给自己的目标完成情况打分。完成了，得分是1。部分完成，得分是0到1之间一个数字。

    Google强调每一个人制定的目标要有挑战性，因此如果一个 人完成目标的得分情况总是1，并不能说明他工作好，而是目标定得太低。大多数情况下，大家完成目标的得分在0.7-0.8左右。当然，一个季度开始的时候的想法，和后来完成的任务可能会有差异，早期没有想到的事情后来可能做了。

    因此，在总结季度工作时，可以增加当初没有制定的目标，对于不打算完成的目标，或者已经过时、不再有意义的目标，不能删除，但是可以说明为什么没有做。


    今天我就按照Google制定OKR的习惯，介绍我在2017年的目标。

    目标1. 完成《数学之美》的英文版和韩文版，《大学之路》第二版

    关键结果1.1 找到英文版的出版商；

    关键结果1.2 寻找合适的、母语是英语的合作者，修改英文版的书稿；

    关键结果1.3 完成英文版的写作

    关键结果1.4 争取年底前出版

    关键结果1.5 配合韩文版的出版商，争取年底前出版

    关键结果1.6 完成《大学之路》第二版，补充公立教育的内容，增加关于“伯克利”的一章，增加有关大学申请的内容。更换一些照片。四月底完成修改，争取9月份之前面世。

    （篇幅问题，我只节选了一部分，感兴趣的同学可以去《硅谷来信》的专栏找到第114封信，还有更多精彩内容）


    刚进3月，有心的同学们可以根据这个目标管理计划，写下自己的打算，祝小目标都实现！


    # ｜本周留言精选


    我带学生团队时候常常给他们打鸡血：“你们总抱怨毕业后工资太少，但却不去想自己究竟能创造了多大的价值。你们加入我们这个创业团队本来就是九死一生，我们不能给你们太多的金钱，但是我们绝对可以让你更值钱！”我专门把我们片区的每日流水账单开放，邀请愿意参与的队员共同做每日、每周、每月损益表，大家热情很高。倒有些像阿米巴，当员工清楚的理解利润来源与成本支出时，团队的积极性创造力就会得以更多的激发。我们不是为工作本身而工作，而是为了自身增值而努力。


    +   抓住根本，解决实质，不需要人为地把事情复杂化，这样才能更有效率地将事情做好。分享一个设计领域的案例:

    1)、只放置必要的东西。简洁网页最重要一个方面是只展示有作用的东西。

    2)、减少点击次数。让你的用户通过很少的点击就能找到他们想要的东西，不要让他们找一个内容找得很累。

    3)、“外婆”规则。要让外婆年龄的人，也能轻松的使用你的页面。

    4)、减少段落的个数。每当你的网页增加一段，页面中主要的内容就会被挤到一个更小的空间。

    5)、给予更少的选项。做过多的决定也是一种压力，总体来说，要努力减少用户的思维负担，这样就会使浏览者使用更顺畅。


    在这些方面，苹果官网做的很好。它用一种有效、有礼貌的方式提供了足够多的信息，所有的文字、链接和图片都很集中。


