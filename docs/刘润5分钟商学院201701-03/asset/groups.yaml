    我们知道，态度 x 能力 = 绩效。态度，也就是“自己灰飞烟灭也要干”；能力，也就是“把对手干到灰飞烟灭”。但这世界上没有完美的选择，美女的头，鱼的身体，或者鱼的头，美女的身体，如果必须只能有一个，你会选哪一个？


