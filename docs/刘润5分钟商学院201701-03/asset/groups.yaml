    # 周末小结 | 第二季度

    度 “管理篇” 线下大课，来了！


    ![](img/5bc03606054caee6e4ef8bff8979929a_148_0.png)


    周末小结 | 第二季度 “管理…


    前人的思考，我们的阶梯，欢迎收听 “刘润 · 5分钟商学院” 周末特别版。


    今天，上海，龙之梦酒店，我再次感受到了400位从全国各地飞来相聚的《刘润 · 5分钟商学院》同学的热情。谢谢你们。我常常觉得，自己是如此幸运，这一年能面对如此专注，好学，充满朝气的你们，分享自己对商业的理解。我的眼光望向你们，你们的眼光望向未来。那是你们的未来，是中国商业的未来。


    ![](img/5bc03606054caee6e4ef8bff8979929a_148_1.png)


    ![](img/5bc03606054caee6e4ef8bff8979929a_148_2.png)


    ![](img/5bc03606054caee6e4ef8bff8979929a_148_3.png)


    ![](img/5bc03606054caee6e4ef8bff8979929a_148_4.png)


    不知不觉，《刘润 · 5分钟商学院》第二季度 “管理篇”，也要接近尾声了。经过和得到团队认真商量、慎重思考，我决定继续为《刘润 · 5分钟商学院》的学员们，提供第二季度
    “管理篇” 的线下大课，让大家有更加深入学习，面对面过招的机会。


    如果说 “商业” 是讲如何对外，“管理” 就是讲如何持家，两者缺一不可。我相信，很多学员在这一季度的学习中，已经深刻感受到了 “不当家不知柴米油盐贵”，原来CEO真不好做，举手投足皆学问。所以，我打算在管理篇的大课中，分享这四个方面的逻辑：


    第一，企业生命周期。这个世界上 судьи之四海而皆准的管理方法论吗？这世界上有能帮助企业基业长青的战略和组织吗？为什么管仲，陶朱公的企业，没有活到今天？企业的发展有三个阶段：创业期，成熟期，转型期。我将在这个部分，帮助大家定位自己的阶段，并寻找合适的管理方法。


    第二，创业期管理。为什么小米说没有KPI，罗辑思维说没有组织架构，很多创业者甚至说他们痛恨管理？创业期真的不需要管理吗？那他们需要什么？创业者成功，到底是靠努力，还是靠运气？我会在这一部分与大家分享，创业期企业的成功特征。


