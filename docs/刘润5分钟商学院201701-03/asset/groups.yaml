    # 概念：变招为抢


    我在第32课 “合伙人制度” 里讲过，资本和人才，是两个永不停止的博弈。今天，人才的重要性明显上升。对应到管理的角度看，我们 “选人” 的逻辑，也必须从 “招人”
    心态，变为 “求人”，甚至 “抢人”。


    雷军在2010年创立小米时，已经非常有名了，但在 “招人” 这件事上，一样遇到了很大的困难：他总是被质疑，这事靠谱吗？所以，在最初的半年，雷军很不得每天挤出150%的时间来招人。他曾经在一周内有5天、每天超10小时说服一位跨国公司高管加入小米，但到最后对方还是拒绝了。他也曾为了说服一位资深硬件工程师加入，让几个合伙人轮流上，终于用12个小时说服了对方：“好吧，我已经体力不支了，还是答应你们算了！”


    所以，雷军说：找人，是天底下最难的事情。


    一个CEO，在企业的成熟期，其实是个COO，中间那个O是Operation，主要负责运营。在企业的转型期，其实是个CSO，中间那个S是Strategy，主要负责战略。在企业的创业期，其实是个CHO，中间那个H是Human
    Resource，主要负责人才。


    # 运用：如何重视招人并发现合适的人才？


    第一、从招人，到抢人。


    2015年3月，雅虎宣布关闭北京全球研发中心，350人即将被裁。消息一出，无数互联网公司蜂拥而至，上演了“双十一”一般抢人的戏码。雅虎建立了一个招聘群，二维码公布的2小时内，涌入了300多家互联网公司和猎头。有些公司派人在雅虎的楼下蹲守，另外一些公司则在大厦附近“游击式”推广，甚至有人追到地库抢人。有人1分钟内收到10余家公司的邀请，还有员工一天内增长400位微信好友，都是求推荐工程师。


    第二、使用创新的方法。


    著名的营销人小马宋在暴风影音时，公司急缺产品经理，所以请他设计一个招聘广告。他想，这么久都没有找到合适的产品经理，再做一个广告，就能找到吗？于是，他和西少爷肉夹馍联合，在所有连锁餐厅推出产品经理套餐，拿产品经理的名片，就可以1元吃个产品经理套餐。结果收集了大量产品经理的名片，然后让HR去打电话了。'
