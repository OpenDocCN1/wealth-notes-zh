    职业生涯，是人生规划的一个部分。也许在一些管理者眼中，员工，是你管理系统中的一个精妙的部件；但如果你能站在员工的角度看，职业，可能只是他人生历程中一个精彩的环节。他走进了你的公司，其实更是你的公司走进了他的生命。


    理解职业：


    如果有人对我说：“润总，我认识一个18岁的男孩，高三了，学习成绩还不错，我让他帮你算算命，看看你这辈子应该从事什么职业吧。”我一定觉得我这个朋友疯了。但是，我们几乎每个人在18岁的时候，都在报考大学的志愿上，“慎重地”选择了自己一生的“专业”。


    大学毕业时，大部分学生并不真知道咨询顾问每天做什么，客户经理有哪些职责，客户服务和技术支持有什么区别，银行和保险不一样在什么地方的时候，就必须根据自己的“专业”，选择一个“职业”。


    ### 运用：丰富的“职业生涯”的三个建议


    第一，不要设立“户口制度”。


    很多人提起户口制度，都会吐槽，觉得这限制了中国公民在自己国家的自由流动。但是，一旦成为了企业的管理者，他们很多也会在公司里设立“户口制度”，限制员工在不同的部门之间流动。


    ### 小结：认识职业生涯


    站在管理者的角度看，员工，是你管理系统中的一个精妙的部件；站在员工的角度看，职业，是他人生历程中一个精彩的环节。


    ![](img/5bc03606054caee6e4ef8bff8979929a_79_0.png)


    ## 得到专栏 · 5分钟商学院


    主讲人：刘润


    ## 刘润


    作为管理者，你的公司在执行严格的户口制度，还是允许员工在内部自由迁徙呢？作为员工，对你来说，工作是为了生活，或者工作是生活的一部分呢？如果内部有职位机会，你会考虑内部跳槽吗？来和我一起过招吧。


    3.18号，《5分钟商学院》商业篇第二次线下大课将在上海开课。这次大课，我将依然花整一天的时间，好好与大家分享我对商业世界的看法，以及如何抓住这个时代的商业机遇。（从周日在专栏内发布消息之后，不到24小时，“白天+晚上私享会”的10个名额已经被一抢而空，白天的大课名额也已售出248个，仅剩152个席位。）


    要理解时代的变化，才能正确抓住变化。到底是什么在推动最近这几年商业世界翻天覆地变化的底层逻辑？我希望带领大家感受这个逻辑，并且根据这个逻辑，感知未来。


    ### 第二，抓住不变：深刻回归商业的本质。


    看清变化的，是观察家，而看清不变的，才是战略家。我会在这部分把大家从变化中拉回来，回到商业的本质，找到那个没有变的基础，思考我们应该如何应对。


    ### 第三，创造价值：必须脱离人口红利。


    回到一个企业的微观，任何一个企业，在商业大环境中都是微观个体。从个体角度看，我们如何做出改变？我会从创造价值的角度，分析我们看到的三个红利，其本质，是创新的机遇。


    ### 第四，传递价值：尽量短路用户距离。


    互联网今天对传统行业到底产生了哪些影响，又给了我们哪些机遇？为什么互联网对中国线下机构势如破竹，但对美国影响不大？我们应该如何利用互联网，提升传递价值效率？我将好好分享我的观点。


    这次的大课，内容会保证和第一次一样原汁原味。同时，也做了几个升级。

    第一，我们增加了场地的容量，希望能满足更多学员；

    第二，晚上的10人小规模的封闭的私享会，将会把晚饭、讨论合二为一，留下更充裕的交流时间；

    第三，为了鼓励大家集体学习，对于2月12日～3月12日这一个月内，一次性购买《5分钟商学院》200张电子卡或者实体卡的同学，赠送一个这次线下大课的名额。


