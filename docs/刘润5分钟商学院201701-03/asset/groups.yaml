    彤彤爸爸 46

    说到师徒制很容易让我想到父辈。像过去国企老厂的“师徒制”甚至有着“一日为师，终身为父”的传统。我父亲现在还和他师傅经常来往。并且嘴上还是喊着师傅。演绎一代人工作到生活的关系。

    但是到现代，“传统”的师徒制有优点，也有一定弊端，我们需要辩证的来分析及运用。


    +   一、师徒制 优点：

    1.对新人：更快更好融入公司。

    2.对团队：形成团队梯队建设。

    3.对师傅：让体验更多职业成就感。

    4.对麾下：锻炼师傅领导力，储备管理人才。


    +   二、师徒制 缺点：

    1.易样条：因缺乏标准化，徒弟容易模仿师傅各种个性的工作方式，每个徒弟学出来可能都会有不同。每个师傅教出来也会有不同。

    2.留一手：师傅会保留性的带教徒弟，因为担心教会了徒弟饿死师傅。


    +   三、思考及运用：结合现代企业需求，“现代师徒制”孕育而生。

    1.重点明确：A.师傅3个重点： a.提供工作技术指导， b. 传递企业价值观， c.解答企业管理制度和流程。 B新人3个重点：多问、多学、多做。 2.统一培训内容：保障每个师傅教出来的合格徒弟都是标准化技能和价值观。
    3.培训考核师傅：不是每个老员工天生都会教人。自己做和教人做是不同的两个技能。师傅也需要培训和考核如何带徒弟。通过了才能上岗带人。 4.激励政策：物质激励，对于徒弟考核达标的师傅设置奖金。精神激励，根据带合格徒弟的数量设置师傅等级，大会上颁发荣誉勋章。


    最后，我想说一下做师傅的意义。一个 人能通过自己阅历来帮助别人一起成长是...非...常有德无量。


    佛教有三个不同境界布施：第一是财布施，施人钱财替人解难；第二是法布施，教人做人做事方法道理；第三是无畏布施，给人希望，让人无所畏惧的生活。 我觉得，一个合格师傅，必然是一个能够很好的做到“法布施”和“无畏布施”的人，而这也需要师傅严格要求自己的言行，不断精进提升。


    对于企业，只有精神+物质的系统化激励，才能让员工都想努力做好师傅，从而保证公司的新 01-23 22:13:15


