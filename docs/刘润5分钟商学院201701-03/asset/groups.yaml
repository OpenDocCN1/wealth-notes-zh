    ## 客座教授 | 大数据如何进行商业变现？


    ![](img/5bc03606054caee6e4ef8bff8979929a_24_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们迎来了脉脉创始人兼CEO，林凡。他曾任搜狗CTO，负责搜狗输入法，搜狗浏览器等客户端的研发项目，以及大街网技术副总裁。2013年10月创业研发职场社交平台脉脉。目前脉脉注册用户已超过2500万，越来越多的职场精英将脉脉作为日常重要的职场交流和人脉拓展平台。


    很多人都想找他讨教，脉脉是如何获得这么大的高质量用户？它的商业变现模式又是怎样的呢？这一周，我们请他来分享一下其中的门道。


    ![](img/5bc03606054caee6e4ef8bff8979929a_24_1.png)


    脉脉拥有很多的优质用户，这么庞大的“数据源”，如何挖掘其中的价值？


    ## 任何一种规模化的商业变现成立，需求和场景是两个前提条件。


    如果只是单纯的“大数据”变现，大部分都很难形成规模化的商业价值。比如，一家招聘网站可以获取、沉淀、呈现大规模的用户简历和各种信息，但因为招聘网站的用户目的和预期都很明确，动机和结果之间的反馈链条非常短，用户很容易会被其它的诉求、以及相关度不太高的信息打动。所以这种模式很难吸引到除了招聘之外的公司和品牌来投广告。


    相比而言，脉脉在需求和场景这两个维度上，都给用户提供了充分的铺垫。用户对脉脉的最大预期是职业品牌建设，而脉脉也提供了非常多和用户所处的行业极其相关的内容，同时用了多种形式来呈现这些内容，用户在浏览这些消费行业内容的时候，有点类似于“购物”的消费场景，所以品牌广告之类的变现方式就会显得水到渠成。


    未来，脉脉最需要做两件事，一是继续不断强化需求、场景这两个商业变现前提；二是找到更多的、能把需求和场景完美融合的卖点。比如，通过用户的行为分析，预测出用户可能有学习、跳槽、招聘、合作、融资的需求，并在恰当的场景下，为该用户展现相应的服务：招聘、培训、融资等等，这将是脉脉商业变现的更高级形态。


    56人笔记


    脉脉作为职场社交平台，做了哪些特别的设计，能让个人通过脉脉建立职业品牌，让市场通过脉脉准确地发现人才？


    人的能力是全方面、多维度的，所以打造和展现个人职业品牌确实是有比较缜密的学问。从我们目前的经验来看，主要是展现手段和曝光量：


    - 1、展现手段：对于一些名校毕业、在知名公司工作过的白领来说，只要把头像设计的专业一些，公司和职位经过系统的认证，就能比较好地展现职业品牌了。对于没有这样经历的用户，如果能获得一些背景好的朋友的背书和推荐，那么同样也能展现职业品牌。


    - 2、曝光量：如果用户在社区里，多产生一些有价值的内容，比如，你对行业事件、干货等等的深度点评，表达出实际能力，就会得到更多职场人的认可和转发，就会有足够的曝光量。也有一些人是通过结交好友的方式，增加自己在其他同行面前的曝光。


    其实从更宏观的角度来看，企业竞争市场化的程度越高，城市化进程越充分，整个市场对人才的诉求就越高，这十年来趋势越来越明显（以前企业竞争主要靠老板能不能搞定某些资源，人才又集中在几个城市里）。尽早建立个人职业品牌，就会被更多的职场机会找到，更早拥有一个好的职业履历，迅速拉开和其他人的差距。


    用什么方法获得高质量用户，而不是成为一个泛泛社交软件？


    口碑从来说都是获取高质量用户的最佳方式。脉脉刚上线时，最早是我的朋友在使用，然后传播给朋友的朋友，在非常长的一段时间内，完全依赖于口碑传播获取高质量的用户。


    ## 与一些高价值渠道方的对接合作和相互背书也很重要。


    比如最近脉脉和滴滴顺风车的合作，很多顺风车的车主和乘客都是白领，一来大家有在车上进行社交的需求，二来通过脉脉这样的第三方平台，可以在一定程度上快速建立起彼此间的信任关系，所以大家很愿意在滴滴里绑定脉脉的职业资料，并由此成为脉脉的用户。这类合作方式，其实相当于是帮脉脉的新增用户做过滤和筛选。


    近两年来，大家都在讨论整个移动时代的红利逐渐消失，但对于任何一家仍然在这领域内坚守的创业公司而言，其生存和发展的根本，仍然在于产品能否给用户持续提供足够独特的值。持续、足够独特、价值，是你的产品区别于泛泛之辈的三个关键词。


