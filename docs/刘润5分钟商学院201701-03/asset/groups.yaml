    雷军曾经说过：不要用战术的勤奋，掩盖战略的懒惰。战略思考，是每个CEO不能推卸的责任，不可没有的能力。


    那什么是战略？就是通往目标的曲线路径。怎么设计战略？四步法：绘制地图、选择路径、当下一步、抬头看路。


