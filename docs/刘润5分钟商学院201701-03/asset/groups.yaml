    主讲人：刘润


    刘润


    作为管理者，你的公司有前员工俱乐部吗？他们是自发组织的，还是有你官方的支持呢？作为员工，如果你的前任公司有前员工俱乐部，你愿意加入吗？你希望前任公司，给前员工俱乐部提供什么福利呢？

    来和我一起过过招吧。


    3.18号，《5分钟商学院》商业篇第二次线下大课将在上海开课。这次大课，我将依然花整整一天的时间，好好与大家分享我对商业世界的看法，以及如何抓住这个时代的商业机遇。（目前，白天大课仅剩不到50个席位，感兴趣的同学要尽快下手了。）


    我会从四个角度分享我的看法：

    第一，洞察变化：感知正在生成的未来。所有的商业，都要顺势而为，一定要理解时代的变化，才能正确抓住变化。到底是什么在推动最近这几年商业世界翻天覆地变化的底层逻辑？我希望带领大家感受这个逻辑，并且根据这个逻辑，感知未来。

    第二，抓住不变：深刻回归商业的本质。看清变化的，是观察家，而看清不变的，才是战略家。我会在这部分把大家从变化中拉回来，回到商业的本质，找到那个没有变的基石，思考我们应该如何应对。

    第三，创造价值：必须脱离人口红利。回到一个企业的微观，任何一个企业，在商业大环境中都是微观个体。从个体角度看，我们如何做出改变？我会从创造价值的角度，分析我们看到的三个红利，其本质，是创新的机遇。

    第四，传递价值：尽量短路用户距离。


