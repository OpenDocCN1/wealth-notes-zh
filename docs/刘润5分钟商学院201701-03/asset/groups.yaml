    宝洁制定了著名的“多品牌战略”。你想买洗发水？飘柔怎么样？飘柔不喜欢，那潘婷呢？伊卡璐呢？沙宣？海飞丝？在渠道为王的货架时代，宝洁利用多品牌战略，自己与自己竞争合作，占领了更多的超市货架，最终实现了公司的愿景。


