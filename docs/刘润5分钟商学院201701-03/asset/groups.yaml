    # 113 | 组织，就是信息流动的方式


    113 | 组织，就是信息流动...


    ## 概念：组织


    组织，就是信息流动的方式。


    当你管理“个人”的时候，你与他的大脑打交道。他的大脑怎么把信息传递给双手，你是不用管的。事实上，那个传递的效率，高到让你惊叹，信息损耗可以忽略不计，信息延迟也可以忽略不计。


    但作为CEO，你管理“组织”时，信息怎么传递到最底层员工，再怎么反馈回来，就不是自然发生的了。它必须有个传递的路径，这些路径，就是“组织架构”。可是，一旦有了组织架构，它的层次，就会导致信息的延迟；它的节点，就会导致信息的损耗。这些延迟和损耗，会降低组织从决策到执行的速度，从反馈到调整的灵活性，让组织显得臃肿，降低战斗力。


    网上曾流传过一组漫画式的组织架构图。亚马逊是看上去最中规中矩的树状架构；谷歌在树状架构间，增加了很多跨部门连接，甚至有些中层一管到底；微软把树状的架构，分成了几个相互竞争的事业部；苹果的架构，根本就没有树，而是以乔布斯为核心的无数闭环；Facebook，则是一张去中心化的网，你找不到CEO的位置。


    首先，这五家公司的组织架构真的是这样吗？你千万别当真，苹果怎么可能没有“树”，Facebook怎么可能不给CEO“Face”。你权把它这5张图，当成是漫画好了，通过夸张的手法，赞扬，或者讽刺这五家公司的管理问题。


