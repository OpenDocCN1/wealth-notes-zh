    \n企业转型，并不一定是转行，一定程度是基于现有业务的变革，在做深现有池塘的基础上如何挖掘新池塘，拓展新市场、挖掘新需求、获取新客户、赢得新增长。因此转型必须要获得企业上下的高度认同，上下同欲方可胜，否则现有组织格局和员工都会成为转型的阻碍因素。\n\
