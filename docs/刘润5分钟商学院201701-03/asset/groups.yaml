    # 留言精选


    彤彤爸爸 50

    现在新一代的企业家，对培训普遍非常重视。但是在培训落地时，会出现一系列问题。如果培训落地没有处理好，培训完之后，甚至有些员工的抱怨会更多。


    我关于企业培训有套《六脉神剑》可以分享给大家。让大家在培训中，可以少走弯路。


    +   一、紧扣企业战略和制度

    如果培训与企业战略、制度不协调，很容易导致培训偏离主线，调研HR需从企业战略、岗位需求入手，才能助推企业发展主题。


    +   二、宏观分析培训需求：

    有时容易被表面现象迷惑，认为觉得绩效差就该赶紧培训。事实上，培训不能解决所有问题。很多人员绩效不高，很多情况不是由于知识能力欠缺，而是因为态度或其他原因所致，如流程、激励等，不是培训所能解决的，越培训可能越糟。这时最有效解决方式可能是改变激励方式或改变流程。


    +   三、微观分析培训需求：

    培训调研是否抓住人员真正需求；许多HR培训调研时，往往把简单调研问卷一发，员工直接填写上交，HR一汇总就成了培训需求，这样样本率调研随意性很大，员工真正需求没有调研出来。


    +   四、细化培训计划：

    这需要对企业内容分类分级，要了解员工应该掌握什么知识技能？应该掌握到什么程度？其中每一步都可继续细分。


    +   五、培训现场有效控制：

    许多培训组织HR往往认为；讲师请来了，学员也来了，都准备好了，培训就可以万事大吉，放松对培训现场的调控，甚至都不到现场。殊不知，培训现场执行也是问题多多，这时的工作不到位，也会使培训效果大打折扣。


    +   六、培训后跟踪：

    培训之后不了了之或简单现场打分后就结束了。这都是虎头蛇尾。会导致培训效果锐减。为了保障培训效果，应该追踪反馈培训效果，甚至纳入绩效考核培训效果。


    最后，提前祝刘润老师和各位同学们，新年快乐！新年大家都更上一层楼！

