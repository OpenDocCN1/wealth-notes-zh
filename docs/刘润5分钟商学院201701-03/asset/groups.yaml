    商业篇行为经济学谈到过人的几种常见偏见，就是先入为主、以偏概全和眼见为实，而到了管理篇同样如此，对应着首因效应、光环效应和近因效应。所以说这些是人性的本能，也就是我们很多情况下，感性脑会先于理性脑更快地做出反应。

    而为了让结果更加趋于正确和具有适用性，那就那就需要像《思考快与慢》中卡尼曼谈到的系统1和系统2的思考方式，而且在面试特别是对于关键岗位的挑选更加需要使用系统2思考，也就是理性的慢思考。从而就要求我们不要被面试者的表面，包括简历和个人行为举止所影响和迷惑。

