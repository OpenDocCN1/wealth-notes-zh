    # | 本周留言精选


    刘老师昨天说管理可以用在每个关系里，作为一个妈妈，在管理孩子上也可以这样做：


    +   1、满足孩子的生理需求，让他吃饱穿暖。满足物质层面的需求。

    2、满足安全感需求。家庭关系稳定，亲情和睦。创造一个安全的成长空间。

    3、满足他的社会需求，有朋友的肯定，老师的认可，又随着年龄的变化有所不同。

    4、从心里尊重孩子，信任他，关注他在做的事情。

    5、协助孩子实现自我。如果一个孩子从父母手里越早能实现自我价值，应该证明父母教育越成功。


    这样梳理下来，作为一个妈妈就没那么无端的纠结了。


    游戏在这些因素的应用上很娴熟。签到就是保健因素，俗称“低保”，每个玩家都有机会领取，一天不领就相当于吃亏，由于损失厌恶，可以让玩家固定时间上线，保证活跃度和留存率。另外一些需要玩家通过消耗时间或者金钱的系统才能获得的就是激励因素（如竞技场），但是申明的是，物质奖励（主要是虚拟物品）其实是副产品，排名之类的荣誉奖励才是真正能触动玩家的因素。


    2015年底，CEO下指标要我们RD开发一款新产品，时间紧，技术难度大，价格低的要命，当时说做成了送我们澳洲游，老板一口气答应的爽快。到6月份，项目要求的所有目标我们都实现了，澳洲游一拖再拖，到现在也没兑现，现在的结果是当初项目的成员有30%都离职了。想想老板最要紧的恐怕就是说话算话，绩效和奖励之间的关联性这一环，怎么都不能动。一旦剪断，以后所有激励，就没人信了。


    恩宜先淡后浓，严宜先严后宽。


    工资是为员工的责任买单，奖金是为他的优秀买单。在我看来，这些都可以用公开，只有规则明确，权力才能锁进牢笼，也才能发挥激励的真正力量。但年终奖原则上严格保密，这属于打破适应性偏见，属于“意外的惊喜”。我们是这样处理的，说年终奖每人5000元，结果其实每个人都大于5000，高者可以达到几万，然后再巧妙运用“排名的对比”，给最优秀的和具有潜力的员工透露一下他年终奖的排位，以此激励。


