    \n### 运用：如何培养新员工\n\n第一、做务实的事情。\n\n对于年轻的新员工，应该给他们足够的关怀、温暖和鼓励，但要尽量从最简单、务实的事情做起，甚至比如贴发票、复印、装订商业计划书、写会议纪要等等，然后，对他们严格要求，促进成长。\n\
