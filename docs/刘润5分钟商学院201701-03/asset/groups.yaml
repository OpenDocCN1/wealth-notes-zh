    # 客座教授 | 如何持续保持领先优势？


    ![](img/5bc03606054caee6e4ef8bff8979929a_90_1.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这一周，我们请到了上海太太乐食品有限公司、东锦国际集团创始人荣耀中，他是“太太乐”、“日加满”、“金格勒”等知名品牌奠基人，30多年来，他以鲜味科学为理论基础，肩负“让十三亿人尝到更鲜美的滋味”、“让十三亿人生活更美好”的历史使命，缔造了世界级的消费量。


    很多人都佩服于他不仅独创了一个市场，而且在这个市场里持续保持了多年优势。这一周，我们请他来分享一下互联网时代，太太乐是如何应对新变化的？


    ![](img/5bc03606054caee6e4ef8bff8979929a_90_2.png)


    太太乐做为一家大众品牌的食品企业，有考虑过在未来迎合日趋分化，但数量庞大的小众化细分群体吗？在如今大城市几乎人人叫外卖的时代，如何精准传递品牌价值？对于未来有哪些战略层面的思考呢？做为年轻消费者，对于食品更加关注的不仅仅是食蕾上的刺激，更注重健康低盐低脂无添加剂等一系列新的需求跟变化，如何打动这群年轻的消费人群呢？


    在“互联网+”时代，消费者和市场都发生了急剧的变化。针对我们的目标消费群，我们提出市场三分法：老 계획이다：老客户群为四亿“大妈”群、新客户群为四亿农民群和四亿网民群。


    在这三类目标人群中，我们的品牌和产品在4亿大妈群中根深蒂固，占有率达到72%以上，基本处于饱和，这部分用户我们要服务好；在农民群里，我们的工作也已经非常深入，整体比例也达到了33%；目前比较薄弱的是4亿年轻网民，也是我们将来营销和品牌宣传的重点。“互联网+”时代，我们品牌的新营销思路，就是要加强和年轻一代、年轻妈妈们的沟通，要侧重于新的家庭消费。


    我们分析过，这部分消费者会更加理性，对食品安全、营养和健康更加关注。所以在品牌宣传方面，我们要大力宣传鲜味科学，让消费者明白鲜味来自于蛋白质；鲜味是人的基本味觉，代表着人类生命的基本需求；另外，经过中西方科学反复验证，鲜味物质是安全健康的物质，人类从母体孕育开始，就已经在接触鲜、品尝鲜，羊水和母乳中都含有丰富的鲜味物质。


    我们会注重用90后的语言和90后进行沟通，打造调味品行业的段子手，不断用鲜味科学的原理和贴近生活的案例加强与消费者的互动，而不是用价格战、简单推销等老的营销方式。


    同时，我们还会改进步装，增加使用的简便度，增加年轻人对厨房烹饪的热情，形成价值观的共鸣，满足他们追求更高生活品质的需求。例如迎合年轻人追求便捷美味的需求，推出“宴会蘸酱汁”，只需要把肉、水放入电饭煲，45分钟后就可以吃到鲜美酥嫩的红烧肉。目前，这部分市场的销售量在不断上升。


