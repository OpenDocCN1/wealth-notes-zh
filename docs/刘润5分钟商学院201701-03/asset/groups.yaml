    # 第二、使用创新的方法。


    著名的营销人小马宋在暴风影音时，公司急缺产品经理，所以请他设计一个招聘广告。他想，这么久也没找到合适的产品经理，再做一个广告，就能找到吗？于是，他和西少爷肉夹馍联合，在所有连锁餐厅推出产品经理套餐，拿产品经理的名片，就可1元吃个产品经理套餐。结果收集了大量产品经理的名片，然后让HR去打电话了。


    熊节在Thoughtworks组建成都分公司团队时，也发愁招聘的问题。于是，他花了几个晚上写程序，抓取豆瓣上读过他认为的那些好书的人。然后不断递归，再抓取这些人还读过什么其他书，抓了几万人后再分析，最后筛选出几十个技术大牛，然后让HR一个个去联系了。


    摇摇租车创立时，公司缺人，早期员工张涛想去大公司挖人。两种人比较好挖：一种是钱少的了，另一种是受委屈的。于是张涛手写了一块招聘广告牌，像机场接人那样，天天站在某互联网公司门口。不少受委屈的员工看见了广告牌，纷纷上前和他聊天说苦。就这样，他挖来了几个核心员工，完成了早期团队组建。


    # 小结：认识变招为抢


    随着时代发展，资本和人才的重要性，正ان剧烈地向人才倾斜。用资本，像购买生产资料一样地去“招人”，变得越来越困难。


    怎么办？第一，管理者要转变心态，变招为抢；第二，管理者要转变方法，不断创新。


