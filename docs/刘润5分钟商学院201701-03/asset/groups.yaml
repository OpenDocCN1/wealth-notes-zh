    其次，就是在面试之前我们可以因时、因地、因岗位需求来制定“面试清单”，尽可能在之前先做好选拔人才的关注点，从而重点放在冷静之前的清单上面，尽可能地避免了在面试过程中很多外界和来自于面试者的干扰。

