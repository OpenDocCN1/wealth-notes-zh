    阿米巴经营模式是基于京瓷哲学这一“道”下的“术”，是“道”的外在表现形式。不能看着人家就照搬照用，不基于自身文化基石下的拿来主义都是东施效颦。我认为阿米巴模式（或者说任何组织形态或管理模式）终究只是外在模式，没有优劣之分，毕竟“外因”终究需要“内因”方能起作用。与其盲目向外求“速效药”不如潜心“找内结”。


    企业遇到发展困境，肯定在经营管理过程中存在“违背事物发展客观规律的现象”，通过“人、机、料、法、物”逐一剖析，定能找到症结所在。然后通过借势（企业、行业、国家政策的内外之势）、明道（企业文化与经营哲学）、优术（中长期战略战术）打造“适合于企业自身特性”的经营策略方案为上策。


    从投资角度理解手表定理，有些公司不能投：


    +   1、股权平均的公司不能投资：股权平均会导致权力争夺，然后让公司变得混乱不堪。所以股权设计上需要主负责人有绝对控股权，保证管理人的一致性。 2、CEO有越级管理习惯的公司不能投：会导致下属工作混乱，打击下属管理的积极性。投资人要懂得识别会通过别人完成工作的CEO。这样公司的管理才能最大化调动其他管理岗位工作的积极性。
    3、CEO有不一致的管理习惯的公司不能投：会导致内部不公平，然后员工抱怨丛生，工作懈怠。所以投资人要了解 CEO平时在绩效和制度的一致性管理原则，是否有清晰的公平意识和知行合一的管理能力。


