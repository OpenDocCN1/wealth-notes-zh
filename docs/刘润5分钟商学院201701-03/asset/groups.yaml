    ## 客座教授 | 如何精准找到和企业高匹配度的人才？


    ![](img/5bc03606054caee6e4ef8bff8979929a_42_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了史宾沙Spencer Stuart大中国区科技互联网行业的高管人才寻聘负责人Ken Qi。他有着包括Oracle、微软、思科、SAP在内的、15年的业务总经理经验与流程咨询管理经验。后来，转行进入国际最顶尖猎头公司-史宾沙Spencer
    Stuart，负责大中国区科技互联网行业的高管人才寻聘。他帮助众多本土企业找到国际化转型期的CXO（核心高管），还帮助十多家初创公司找到了合伙人，深入了解外企、民企、互联网与初创企业的业务与人才需求。


    这一周，我们请他来分享一下，如何精准找到和企业高匹配度的人才？


    ![](img/5bc03606054caee6e4ef8bff8979929a_42_1.png)


    请问您作为寻聘人才这方面的佼佼者，在发现企业目前所遇到的问题，找能力属性与企业契合度高的高管时，主要看重哪些方面？是研究他们之前的经历吗？对于我们普通公司而言，怎样才能多快好省地招到能力与问题契合度高的人呢？


    我们招聘人才，特别是高管人才，都是为了短期解决业务/运营或者技术问题，中期实现业务/运营或者技术目标，远期帮助公司的业务/运营或者技术的远景，以此从业务倒推需要什么样的组织与岗位，以及需要什么样的经验与能力来实现。
    63人笔记


    经验是打勾打叉的必选，没有就不能通过，比如必须有B2B的解决方案销售经验或者有会计证等。能力是通过评估来判断，核心只能基于他们过去的经历、取得的成就来判断他的能力，来推断他是否能够胜任并完成招聘岗位所需。


    我们不会基于任何候选人的知识或者了解，包括任何假设性场景性理论性的面试问题的回答来判断该候选人的能力，任何书本上、互联网上可以通过学习回答的面试问题都是加分项，而非能力判断的必选项，我们最终只能也应该给予对候选人能力的判断来招聘


    加分项，而非能力判断的必选项，我们最终只能也应该给予对候选人能力的判断来招聘。


    正如我上述而言，业务匹配到岗位，岗位匹配到所需经验与核心能力，然后通过经验迅速匹配到目标人才池，通过经验筛选，通过能力评估，是最快速找到正确所需高管人才的不二法门。


    您做的人才寻聘的服务，是否能够理解为招聘市场的高端服务升级？在您的服务产品中，如何让用户切身体会到您的这份独特价值、并且愿意为此付出不菲的花费呢？


    如果只是问客户你要找条件1、2、3的人，猎头公司通过人才库与人脉圈，甚至是LinkedIn找到可能人选，并将人选推荐给客户，作为一个简单的“人才资料”的二传手，这在国内可以有成千上万家猎头公司提供此类服务，没有差异没有增值很难取增价值价格。


    但是如果你对客户的行业与业务有深入的了解，可以帮助客户梳理他的战略与业务模式，并且匹配到相应所需要的未来的组织能力与架构岗位，推演到岗位职责与所需人才的经验能力，同时在寻聘中可以评测候选人，并且事后证明你的给客户的咨询建议与对候选人的评测是正确的，该候选人事后确实帮助客户的成功，这个自然可以收到增值与预付的费用。因为相对找不到或者找错高管所带来的机会错误成本，同时比较客户所期望达到的业务愿景汇报，付给猎头的费用是小头。所以总结而言，必须提供业务增值+寻聘增值，才能收取增值价格。


    以前听过一个空降的职业经理人，需要三个月甚至更久的时间来与公司的员工和部门磨合，那么在寻找核心高管或合伙人的时候，怎样判断企业与高管之间的匹配度呢？


    我们做过调研，有些高管加入公司后会失败的原因，主要是文化融入。所以，特别是在跨界跨文化与空降的寻聘中，除了我们60年不变的黄金法则：业务来推导，然后通过经验来筛选，能力来考评，背调来验证以外，必须要额外增加两个维度：初创精神、学习能力与文化特质，这两个维度需要成为跨界寻聘的额外必选评估维度，才能帮助客户找到合适的可以跨界或者可以空降的候选人。

    比如：初创精神就是具备企业家气质，喜欢创新愿意冒险，极具好奇心而乐于学习，愿意加入一家规模不大但有创新有梦想的公司，一起all in打造未来。


    推荐一本我最近正在读的书：《全球风口-积木式创新与中国新机遇》，通过对外投资，结合我国的庞大市场以及大规模制造的优势，与硅谷的世界科技创新的源头形成全面深入合作，可以达到双赢的结果。


    刘润老师的新书《趋势红利》的签名版


