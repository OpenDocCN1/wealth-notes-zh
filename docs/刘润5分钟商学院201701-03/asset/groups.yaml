    # 129｜因为你是微软的，所以减一分


    ![](img/5bc03606054caee6e4ef8bff8979929a_175_0.png)


    129｜因为你是微软的，所…


    前段时间，我受一家机构的邀请，通过微信直播的工具，给据说近1万人在网上分享我对管理的观点。其中有一家机构，提了一个问题：


    我们是初创公司，40人的团队，分为6个部门，部门之间有很多交集，有些工作同时涉及到3个部门。但是，这6个部门都有自己的KPI，所以跨部门协作很困难。所以，我们做了几件事：第一，先制定出公司季度目标，然后用鱼骨分析法，拆分目标，以及各部门的岗位责任；第二，有交集的部门，KPI共担、共享；第三，绩效考核中，30%来自于团队协作；第四，梳理企业文化，塑造价值观。但是斟总，这么做了后，KPI越来越严格，员工负面情绪很多，怎么办？


    我听到这里顿了一顿，想怎么回答这位同学最合适。我实在一时想不到更合适的表达方法，只好直接对他说：我虽然还不太了解你的机构，但我直觉的感受是，问题出在了KPI上。忘了KPI吧。


    ## 概念：KPI


    KPI 全称是：Key Performance Indicator，中文叫：企业关键绩效指标，是一种把企业战略目标分解为可操作的工作目标的工具。


    你听到这里，可能就会立刻想起，我在第77课讲“分权制度”时说过，一个机构，应该用联邦分权制度考核“最终结果”，还是用职能分权制度考核“自身行为”，关键是，你是否能在自身行为和最终结果之间，找到必然的因果关系。KPI，就是梳理这个因果关系的工具。


    ## KPI是怎么梳理出来的？


    - 首先，你要大概知道怎么做就能成功，是为战略；

    - 然后把战略，分解为不同职能部门的职责；

    - 然后为职责，找到衡量其是否达成的维度；

    - 然后给维度，制定相应数字做为指标；

    - 然后把指标，和每个人的薪酬挂钩起来。


    这就是KPI的基本逻辑。但是，回到这一系列步骤的最开始，你真的知道怎么做就能成功吗？作为创业期的企业，你真的找到了自身行为和最终结果之间的必然关系了吗？如果找到了，那其实就标志着：你已经进入成熟期了。


    # KPI，是一个成熟期企业常用的管理工具，你把它用于创业期，很可能不但不能帮到企业发展，还会起到反作用。


    2013年，我离开微软后，很快就签约成为晨兴资本的高级顾问。晨兴资本是一家非常知名的风险投资机构，投资过搜狐、迅雷、九城游戏、携程、小米手机等。签完顾问协议后，有次聊天，晨兴资本的一位合伙人对我说：“你知道吗，请你做顾问前，我们做过激烈的讨论，给你打分。因为你是微软的，我们给你减了一分；因为你在微软待了三年以上，我们又给你减了一分。”


    我当时很震惊，让我引以为豪的在微软近14年的工作经历，居然不但没有给我加分，反而还让我减了两分。我问：“为什么？”他说：“因为微软是一家成熟期的企业。而成熟期的管理方法，不一定适合我们投资的创业期公司，所以减一分；而你在微软待了三年以上，这套成熟期的方法论可能已经流淌在你的血液里，成为你认为唯一正确的东西了，所以再减一分。”


    ## 运用：创业期的管理注意事项


    正如我在第126课“企业生命周期”里讲到，企业在创业期、成熟期、转型期，企业阶段目标不同，管理手段也会不同。那么基于我们整个季度“管理篇”的基础管理理论，在创业期的管理，有哪些需要特别注意的地方呢？


    第一，警惕KPI。


    企业在创业期的主要目标，是不断试错，找到真正打动用户的产品，和能因此盈利的商业模式。也就是说，我们还在寻找自身行为和最终结果之间的因果关系，设计过于具体的、基于行为指标的KPI的基础还不具备。雷军，张小龙都说过，要警惕KPI。但一定要明白，他们说警惕KPI，不是因为他们是互联网公司，而是因为他们是创业公司。


    第二，管理人心。


    不能用管理行为指标，那管理什么呢？管理人心。这个阶段，用远景，用对未来收益的预期，激发善意，更为重要。这需要真正的领导力。让人想“追随”的管理者，更容易在创业期成功。


    第三，用成长治愈一切。


    去健身房锻炼，肌肉拉断，这问题；肌肉会酸痛，这只是成长的烦恼。第75课讲的“激励不公”的现象，是问题，但如果不特别严重，可能也只是成长的烦恼。随着创业企业的成长，会出现很多职业发展机会，解决这些不公。用成长治愈一切。


    ## 小结：认识创业管理


    创业期和成熟期有什么不同？创业期，是探寻自身行为，和最终结果之间的因果关系的过程，一旦找到，就进入了成熟期。


    那创业期应该怎么管理呢？第一，警惕KPI，第二，管理人心；第三；用成长治愈一切。


    因为你是微软的，所以减一分

    陪你成长的第129天


    ![](img/5bc03606054caee6e4ef8bff8979929a_175_1.png)


    企业在创业期的主要目标是不停试错，要警惕过于具体的KPI，要用远景、对未来收益的预期来管理人心，用成长治愈一切。


