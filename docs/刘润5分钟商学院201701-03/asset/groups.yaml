    # 周末小结｜如何用商业思维做出聪明决定？


    《5分钟商学院》的同学们，


    大家周末好！


    本周三晚上，我在得到APP直播“如何用商业思维做出聪明选择”，感谢3万多名热爱学习的同学们同时在线、全程参与。我在后台看到了非常多的留言，一些同学说因为各种原因没能及时看到，很希望有机会回看这次直播，我特别要到了这场直播的完整文字记录，介于篇幅太长，想看完整版的可以去我的公众号“runliu-pub”查看（从今天晚上开始，分5天连载）。这里梳理了一些重点内容，供大家复习回顾。


    ## 5个话题：


    - 1、行业不同、成长速度完全不一样。怎么找到飞速上升的行业和公司？

    2、老板最牛的就是能提前看清行业状况、制定战略，怎么获得这种“上帝视角”？

    3、怎么利用时间、团队、资本的杠杆尽快达到百万年薪？

    4、怎么能够向上管理老板，让他心甘情愿帮你成功？

    5、怎么进行时间管理更高效？


    ## 精选内容：


    - 1、什么叫边际时间成本？比如说我今天去生产一个iPhone的手机，这iPhone你可以在中国生产100万只，你也可以生产1000万只。我今天做《5分钟商学院》，我有2000个学员，我也可以有7万个学员。所以每一个手机它交付到你手上的时候，它所投注的时间，边际交付时间几乎为0，所以我们把这种东西我们统称为叫产品。

    什么叫产品？什么叫服务？你用一个基本概念把它切割开来，这个概念叫做边际交付时间。边际交付时间近乎为0的是产品，比如iPhone手机。边际交付时间越大的，越在服务业这端。


    2、任何一个行业的发展都会经历这么几个阶段，人无我有、人有我优、人优我廉，人廉我转。善用用商业看行业，用行业看企业，用企业看个人的事业的方法，能够帮助你做出一些关于人生的一些聪明的决定。


    3、当你理解了一个公司里面核心的商业逻辑，它最重要的创造价值部分，你就会有机会去选择你在那个公司里面占据哪个位置会是最有发展的。你要去那家公司最核心的部门，这样才能与公司一起走得更长远。


    4、老板真正强的是战略。他能选择正确方向，选择正确的商业模式，选择正确的打法，所以他可以做老板。作为一个员工，作为一个手工艺人，不管做什么，都要培养自己的战略能力。什么叫幸存者偏差


    4、老板真正强的是战略。他能选择正确方向，选择正确的商业模式，选择正确的打法，所以他可以做老板。作为一个员工，作为一个手工艺人，不管做什么，都要培养自己的战略能力。什么叫幸存者偏见？就是往往那些成功的企业家不知道自己怎么成功的，而且他喜欢讲，到处讲我是怎么做成功的。这个时候如果你没有独立的战略思考能力，你就听了，你很有可能你就相信了，你相信之后你用这样的方法来指导你，你未必能够获得下一次的成功。


    5、什么叫系统化思考能力？三个关键词，第一个叫做关联的思考问题。第二叫动态的思考问题。第三叫整体的思考问题。你真的要学谷歌吗？请你学2000年的谷歌。你真的学淘宝吗？学2003年的淘宝。你把时间轴加进去之后。你要学微软吗？请学1985年的微软。所以你就把这时间轴加进去之后，你才会理解一个事情的因果的这个逻辑和关系，你才会有
    一个独立的战略思维。


    6、当你心中存储了无数的因果关系之后，再加上系统性的思维，你就有机会在任何一个可能性的结果出现之后有一个真正的归因能力，这就是一种独立的战略思考。然后用这种战略思考你就拥
    有一种可能超越，甚至超越你的同事，超越你的经理，一种我们称之为上帝视角的东西来看待整个商业，你这个时候就有机会与你的老板，或者你的老板的老板有一个平等对话的能力，未来甚至有可能你比他做得更成功。


    7、一个人他要赚很多钱也好，要走向财务自由也好，都必须得应用杠杆。


    最基本的杠杆是叫专业。什么叫专业？就是我做的这件事就是比你好，我就可以拿到更高的单价。你应该把公司付你的钱只 是当成一个额 外的赠送，当成一个福利，想尽一切办法让自己更专业。我就是这个领域做得最牛的人，没有第二个了。


    你更专业之后，你一个人的时间是有限的，你必须要借助别人的时间，也就是用团队来跟你一起来干活，这个时候你就拥 有一个巨大的杠杆。你管十个人这个杠杆就乘十，你管2000个，你杠杆就乘2000，你一旦拥有真正的管人的能力，你的杠杆就巨大地放大了。


    45岁之后，你真正要想获得财富，资本是终极杠杆，把钱投在合适的项目上，投在合适的人上面。但你必须要对商业的洞察，要有你在管理期间积累的对人的洞察。用这些东西，加上你的积累的人脉，你才有机会让钱最终来生钱。


    8、所有管理者一定要做的事，就是要把战略流程化，流程工具化，最终一定要分部门，一定要要有KPI，一定要要有这个过程。


    9、权利是由接收者来定的。我决定不听你的，你在我这就没有权利。


    真正的权利是来自于动力性权利。一种叫做表率权，一种叫做专家权。什么叫做专家权，这事我就干得比你好，人家就愿意听你的，这叫专家型。还有一种权利叫做表率权。我是一个非常严于律己的人，我是非常苛求自己的人，我要把事情做得最好，我这种表率就会影响你。你向上管理老板的目的并不是拍马屁，你向上管理老板的目的是老板手上掌握了一些资源，你要把这件事做成你需要他手上的资源，你只有用这样的方法你才能把手上的资源拿过来为你所用，影响你周围的所有人。所有的管理本质上都是一种影响力。


    10、时间是你最重要的价值，节省一切你可以用的时间去做更有价值的事情。

    如果《刘润·5分钟商学院》每位学员每天节省1小时，每小时时间成本100元，一年260天，那我每天把挂钟塞进怀表的拼命蘸蘸，一共帮助8万学员节省了价值20亿人民币的“国民总时间”，大家用这个时间、商业知识，再去创造更大的社会价值。想想就觉得，再辛苦也不抱怨了。值了。


    ## ｜本周留言精选


    排名第一的管理学原则是“ No Asshole”，即将公司里的搅局者尽快识别和排除。搅局者往往就是“破窗”的始作俑者，搅局者的产生除了员工个人素质（和教育程度无关）、道德诚信观的缺乏之外，最重要的因素是制度。不完善的制度有时候是最大可能“破窗”的那块多米诺骨牌。


    比如，二战美军降落伞合格率总是在99%，军方（也有人说是巴顿将军）就改变了检查制度，每次交货前从降落伞中随机挑出几个，让厂家负责人亲自跳伞检测。从此，奇迹出现了，降落伞的合格率达到了百分之百。一个好的制度可以使人的坏念头受到抑制，而坏的制度会让人的好愿望四处碰壁。一个好的制度可以让坏人变好人，坏制度可以让好人变坏人。犯错不可怕，可怕的是仅仅从错误中负责和惩罚，而没有从制度、流程上找原因，从而失去改变核心内容的
    机会。


    集团董事长指定我负责一个跨部门认证项目，该项目几乎涉及集团所有部门和分公司，而他们都不归属我管理，该项目必须在限定时间内完成。


    - 为了使工作顺利开展，我向董事长要求：

    1、成立“项目组”，我为组长；

    2、给我挑选人 员、奖罚人员权利；

    3、根据最后时限，制 订各项工作时间推进表，并为每项工作挑选一个责任人进入项目组；

    4、为每个项目组成员申请项目补贴金；

    5、请董事长出席项目组启动会为 大家加油，并见证每个人与我签订“五定表”（定事、定人、定时、定果、定责）；

    6、定期召开碰头会，对照“五定表”检查各项工作进度，兑现奖罚；

    7、根据完成情况，及时调整各项工作进度。通过以上几项，保证质 、按量、按时完成项目工作。


    权力的危机感，是产生帕金森现象的根源。一个既得权力的拥有者，存在权力危机，不会轻易让自己的权力，也不会轻易给自己树立对手。会选两个不如自己人作助手，这种行为是自然而然。


    - 1.建立学习型组织。当成员都善于学习、不断进步时，才能保证管理者能够持续的满足管理岗位的需求。

    2.招聘要公平公开透明。避免了用人者出于私人目的而任用比自己能力低下的员工。

    3.建立人才培养机制。组织内部要建立积极的人才培养或储备制度。对于一定级别的管理者，再其绩效考核中要加入下属员工的培养指标。向上层输送管理人才的指标，防止管理者只用能力比自己低的人。

    4.定期对人事综合费用进行考核监督。


    低的人。4. 定期对人事综合费用进行考核监管。


    再次印证了老师一直说的战略性思维，看清本质，而不是用直觉做判断。激励的本质是给利益，而晋升的本质是给责任，是要优化人与岗位匹配，利益是副产品，不能为了给副产品，就把本质忽略了。自己还不是管理者，不过今天的课让我想到，好的职业球队，往往一个球队的队长并不是球技最好，最大牌的球员，足球场上最常见的队长很多是后卫和守门员，比如曾经德国队的门将卡恩，意大利队的卡纳瓦罗，因为队长肩负着凝聚整个球队的责任，而不是得分。


    我们企业是给石油勘探行业做注塑类特种连接器的。最近两年，国际原油市场持续低迷，原油价格从最高150美元/桶已经跌到现在的50美元/桶。每次给车子加油的时候心理很“美观”，但想想自己的生意却很“悲观”。原油价格的大幅下降使得石油勘探的业务量骤减，自然就影响到了我们的订单。鉴于目前的状况：


    1. 已知的风险是短期内原油价格持续低迷，订单不多，企业难以继续维持。解决方案是:延伸我们的注塑类业务到汽车行业，向外扩展。2. 已知的未知风险是:电动汽车发展势头迅猛，何时能取代汽油汽车？对此我们的解决方案是:利用注塑类产品的优势，提供电动汽车线束类产品，弥补因电动汽车的发展所带来的石油用量的减少而导致我们的订单数量的减少所带来的损失。3.
    未知的未知风险:世界各国都在研究替代石油的新型能源，不知道何时实现。我们能做的是时刻关注，并适时调整企业发展方向。


