    # 第21期客座教授预告：梁小虹


    ![](img/5bc03606054caee6e4ef8bff8979929a_90_3.png)


    中国运载火箭技术研究院原党委书记、研究员，长期在中国航天领域工作，在探索企业内部管理规律方面有着独特的见解，在企业党的建设、企业文化见解和人力资源管理等方面，有着丰富的实践经验。系中国航天科技集团公司“2518核心人才”、国防科技工业“511工程”高级管理人才。


    刘润


    我个人特别想向梁书记请教的问题是，这个技术上必须突破创新，但工程上又必须万无一失的“行行业”，是如何把美国的创新文化、和德国的工匠精神，合二为一，然后参与国际竞争，每年创造可观利润的？


    你这位CEO有什么问题想问他，欢迎在留言区提出出来，我们将从大家的提问中挑选一个最有价值感的问题，请梁老师认真回答，并在本周学习结束的时候，公布这个CEO问CEO的结果。


    另外，3.18号，《5分钟商学院》商业篇第二次线下大课将在上海开课。这次大课，我将依然花整整一天的时间，好好与大家分享我对商业世界的看法，以及如何抓住这个时代的商业机遇。

    （400个名额，目前仅剩不到20个，感兴趣的同学们要尽快下手了。）


    # 第一，洞察变化：感知正在生成的未来。


    所有的商业，都要顺势而为，一定要理解时代的变化，才能正确抓住变化。到底是什么在推动最近这几年商业世界翻天覆地变化的底层逻辑？我希望带领大家感受这个逻辑，并且根据这个逻辑，感知未来。


    # 第二，抓住不变：深刻回归商业的本质。


    看清变化的，是观察家，而看清不变的，才是战略家。我会在这部分把大家从变化中拉回来，回到商业的本质，找到那个没有变的基础，思考我们应该如何应对。


    # 第三，创造价值：必须脱离人口红利。


    回到一个企业的微观，任何一个企业，在商业大环境中都是微观个体。从个体角度看，我们如何做出改变？我会从创造价值的角度，分析我们看到的三个红利，其本质，是创新的机遇。


    # 第四，传递价值：尽量短路用户距离。


    互联网今天对传统行业到底产生了哪些影响，又给了我们哪些机遇？为什么互联网对中国线下机构势如破竹，但对美国影响不大？我们应该如何利用互联网，提升传递价值效率？我将好好分享我的观点。


