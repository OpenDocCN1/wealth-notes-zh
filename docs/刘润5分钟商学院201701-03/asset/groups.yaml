    十月天 22 关于满意决策，有一个故事与大家分享。波斯公主到了适婚年龄，要选驸马。候选男子100名，都是公主没有见过的。百人以随机顺序，从公主面前逐一经过。每当一位男子在公主面前经过时，公主要么选他为驸马，要么不选。如果选他，其余那些还没有登场的男子就都遣散回家，选驸马的活动也就over了。如果不选，当下这名男子就离开，也就是pass掉此人，下一个人登场。被pass掉的，公主不可以反悔再从选。规则是，公主必须在百人中选出一人做驸马，也就是说，如果前99人公主都看不中的话，她必须选择第100名男子为驸马，不管他有多么丑陋。


    那我们的任务就是，给公主设计选择方法，让她有最高概率选到百人中最英俊的男子为驸马。


    最佳选法是 pass 掉最开始的 100/e 名男子（e = 2.718... 是自然对数，即100/e 约等于 37）。但是记录下这37名男子中最英俊者。之后鱼贯而来的男子中，出现的第一位英俊程度超越所有前37人者，即为驸马。如果人都走光了，也没出现这么一位
    Mr. Right，那么就只好选择第100位男子。


