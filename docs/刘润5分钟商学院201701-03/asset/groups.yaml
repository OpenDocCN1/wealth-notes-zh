    # 周末小结｜如何用商业思维做出聪明决定？


    《5分钟商学院》的同学们，


    大家周末好！


    本周三晚上，我在得到APP直播“如何用商业思维做出聪明选择”，感谢3万多名热爱学习的同学们同时在线、全程参与。我在后台看到了非常多的留言，一些同学说因为各种原因没能及时看到，很希望有机会回看这次直播，我特别要到了这场直播的完整文字记录，介于篇幅太长，想看完整版的可以去我的公众号“runliu-pub”查看（从今天晚上开始，分5天连载）。这里梳理了一些重点内容，供大家复习回顾。


    # 5个话题：


    +   1、行业不同、成长速度完全不一样。怎么找到飞速上升的行业和公司？

    2、老板最牛的就是能提前看清行业状况、制定战略，怎么获得这种“上帝视角”？

    3、怎么利用时间、团队、资本的杠杆尽快达到百万年薪？

    4、怎么能够向上管理老板，让他心甘情愿帮你成功？

    5、怎么进行时间管理更高效？


    # 精选内容：


    +   1、什么叫边际时间成本？比如说我今天去生产一个iPhone的手机，这iPhone你可以在中国生产100万只，你也可以生产1000万只。我今天做《5分钟商学院》，我有2000个学员，我也可以有7万个学员。所以每一个手机它交付到你手上的时候，它所投注的时间，边际交付时间几乎为0，所以我们把这种东西我们统称为叫产品。

    什么叫产品？什么叫服务？你用一个基本概念把它切割开来，这个概念叫做边际交付时间。边际交付时间近乎为0的是产品，比如iPhone手机。边际交付时间越大的，越在服务业这端。


    2、任何一个行业的发展都会经历这么几个阶段，人无我有、人有我优、人优我廉，人廉我转。善用用商业看行业，用行业看企业，用企业看个人的事业的方法，能够帮助你做出一些关于人生的一些聪明的决定。


    3、当你理解了一个公司里面核心的商业逻辑，它最重要的创造价值部分，你就会有机会去选择你在那个公司里面占据哪个位置会是最有发展的。你要去那家公司最核心的部门，这样才能与公司一起走得更长远。


    4、老板真正强的是战略。他能选择正确方向，选择正确的商业模式，选择正确的打法，所以他可以做老板。作为一个员工，作为一个手工艺人，不管做什么，都要培养自己的战略能力。什么叫幸存者偏差'
  - '[PAGE 166]


    4、老板真正强的是战略。他能选择正确方向，选择正确的商业模式，选择正确的打法，所以他可以做老板。作为一个员工，作为一个手工艺人，不管做什么，都要培养自己的战略能力。什么叫幸存者偏见？就是往往那些成功的企业家不知道自己怎么成功的，而且他喜欢讲，到处讲我是怎么做成功的。这个时候如果你没有独立的战略思考能力，你就听了，你很有可能你就相信了，你相信之后你用这样的方法来指导你，你未必能够获得下一次的成功。


    5、什么叫系统化思考能力？三个关键词，第一个叫做关联的思考问题。第二叫动态的思考问题。第三叫整体的思考问题。你真的要学谷歌吗？请你学2000年的谷歌。你真的学淘宝吗？学2003年的淘宝。你把时间轴加进去之后。你要学微软吗？请学1985年的微软。所以你就把这时间轴加进去之后，你才会理解一个事情的因果的这个逻辑和关系，你才会有
    一个独立的战略思维。


    6、当你心中存储了无数的因果关系之后，再加上系统性的思维，你就有机会在任何一个可能性的结果出现之后有一个真正的归因能力，这就是一种独立的战略思考。然后用这种战略思考你就拥
    有一种可能超越，甚至超越你的同事，超越你的经理，一种我们称之为上帝视角的东西来看待整个商业，你这个时候就有机会与你的老板，或者你的老板的老板有一个平等对话的能力，未来甚至有可能你比他做得更成功。


    7、一个人他要赚很多钱也好，要走向财务自由也好，都必须得应用杠杆。


    最基本的杠杆是叫专业。什么叫专业？就是我做的这件事就是比你好，我就可以拿到更高的单价。你应该把公司付你的钱只 是当成一个额 外的赠送，当成一个福利，想尽一切办法让自己更专业。我就是这个领域做得最牛的人，没有第二个了。


    你更专业之后，你一个人的时间是有限的，你必须要借助别人的时间，也就是用团队来跟你一起来干活，这个时候你就拥 有一个巨大的杠杆。你管十个人这个杠杆就乘十，你管2000个，你杠杆就乘2000，你一旦拥有真正的管人的能力，你的杠杆就巨大地放大了。


    45岁之后，你真正要想获得财富，资本是终极杠杆，把钱投在合适的项目上，投在合适的人上面。但你必须要えた对商业的洞察，要有你在管理期间积累的对人的洞察。用这些东西，加上你的积累的人脉，你才有机会让钱最终来生钱。


