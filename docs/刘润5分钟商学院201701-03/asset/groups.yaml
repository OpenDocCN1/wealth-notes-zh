    # 108 | 如何防止：一放就乱，一管就死？


    作为经理，和作为总监（总监大多数是经理的经理），从管理的角度来看，有什么不同？也许你可以举出很多。我想从管“人”，而不是管“事”的角度列举一条，那就是：信息传递的方式，截然不同。


    ## 概念：抓大放小管细


    ### 例外原则：


    提出“科学管理”的那个美国管理学家泰勒认为：“为了提高效率和控制大局，上级只保留处理例外和非常规事件的决定权和控制权，例行和常规的权力由部下分享。”也就是说，大事，就是“例外的、非常规事件”。这句经典名言，在管理学上被称为“例外原则”。


    ### 洛克忠告：


    所谓管细，就是一套严格的监督制度。英国教育家洛克说：没有有效的监督，就不会有满意的工作绩效。明智的管理者会利用监督这把利剑，促使员工们既心有紧迫感，又满怀热情地投入到工作中去。


    这就是著名的洛克忠告，这也是为什么军队里有宪兵，党派内有纪委，政府中有监察院。


    ## 运用：六字真言：抓大、放小、管细


    第一，抓大。


    抓大的意思就是：只管大事。


    执行“例外原则”：财务上的预算制，管理上的流程化，都是不错的方法。


    # 第二，放小


    放小，就是授权。授权，不是一句“这件事交给你”就完了。我在第94课“拜伦法则”里讲过，“你那不叫授权，你那叫授权。”


    # 第三，管细。


    很多管理者都在说“抓大放小”，但常常忽视“管细”。


    ## 小结：认识抓大放小管细


    从经理到总监，最大的不同，就是你不直接管理最一线员工了，所以，必须从“兄弟们跟我上”式的“单层管理”，过渡到“隔层管理”。


    记住六字真言：抓大、放小、管细，克服“一放就乱、一管就死”的状态。


    企业高层无为，中层有所为，基层无所不为，企业才能大有所为。


