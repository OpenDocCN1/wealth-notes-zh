    第三，成熟期管理。企业越来越大，这到底是好事还是坏事？那些创业期要的聪明、抖的机灵，必须被抛弃？游击队如何变成正规军，游猎如何变成农耕？战略必须流程化吗，流程必须工具化吗？我会在这一部分与大家分享，参天大树，和破土幼苗，到底不同在哪里。


    第四，转型期管理。没有成功的企业，只有时代的企业。这就像人一样，死因各不相同，但死是必然的。健康长寿，不代表永生；医疗先进，不代表免死。那应该怎么办？我会在这一部分与大家分享，真正的转型，重获新生，到底怎么做。


