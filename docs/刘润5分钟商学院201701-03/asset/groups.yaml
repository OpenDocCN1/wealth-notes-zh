    一、通常职业生涯路线选择须考虑3个问题：

    1.我想往哪一路发展？

    2.我能往哪一路发展？

    3.我可以往哪一路发展？

    回答这3个问题是综合分析过程，以此确定自己最佳职业生涯路线。


    第1个问题是通过对自己的价值、理想、兴趣分析，确定自己目标取向。

    第2个问题是通过对自己的性格、特长、经历、学历专业分析，确定自己的能力取向。

    第3个问题是通过对自己所处的社会、经济、组织环境分析，确定自己的机会取向。


    二、职业生涯规划还有3个维度：

    员工、上级管理和人力资源管理部，一个完整的职业生涯规划应由三者共同努力完成，各有相应责任：


    + 1、员工责任：

    自我评估。设定个人职业生涯发展目标，包括理想职位、工作安排、技能获取等目标。制定相应的行动计划，并在实践中不断修正。


    + 2、上级管理责任：

    充当员工职业生涯规划的顾问。为职业目标的设定和行动计划的制定提供指导和建议，帮制定现实可行的规划目标。


    + 3、人力资源部责任：

    在公司内部建系统的员工职业生涯规划制度。对员工及其上级管理进行培训，帮掌握员工职业生涯规划的必要技能。向员工准确传达公司不同职业历程的相互关系，帮员工确定合理的职业发展路径。及时向员工传达公司职位空缺或晋升信息。


