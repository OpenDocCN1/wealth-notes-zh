    三种共同体的形式，很好的解释了在企业发展过程中，为何总是出现高管抱怨员工不努力，员工抱怨高管不分钱的现象，根本原因就在于出现了期望的错位。这里有高管或员工不懂三种共同体的概念，不知在企业发展阶段的当下应该是哪种共同体的问题，另一方面，更有高管或员工根本就是还没适应企业的当下发展阶段，超出了本阶段的共同体期望，比如，创业期本来就是缺钱的，希望大家更多的是事业或命运共同体，但自身却在一味强求利益，就一定是没有看好企业的发展，也是没有担当的提现。

    再者，对一个企业来说，对不同的人群，应该是需要运用不同的共同体概念来凝聚人才。对最普通的员工来讲，就是来企业上班拿工资养家糊口的，就要用利益共同体来激励，多干活就多得钱。对于骨干精英或是中层来说，期待的已经不仅仅是温饱，按照马斯洛需求理论来讲，至少都是在追求社交甚至尊重的需求，这时就要运用事业共同体的概念来笼络他们，让他们把工作当成自己的事业。对于高层或是核心来讲，自身的追求更多的是自我实现了，钱或是地位似乎是不能满足需求，就是需要用命运共同体的概念来激励，共同去改变世界。当然，对一个具体的个人来讲，我觉得除了在企业的所处的位置要考虑，另一方面，他自身的需求也不可忽视的，例如，蚂蚁金融的彭蕾，当年跟马云刚开始做阿里巴巴时，就是一个再普通不过的前台，马云也没有钱开工资，就分了0.02%的股份，还描绘未来蓝图，如果阿里上市后，市值过千亿，你就是亿万富翁。结果，一个前台竟然成了阿里的命运共同体，帮助了阿里发展，阿里也成就了她的人生。所以，我认为，做老板的人，如果能切实了解或激发出一个个体内心的期望，就能横跨三个共同体，成就一个伟大的企业。
