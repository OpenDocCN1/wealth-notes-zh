    ## 客座教授 | Twitter究竟是怎么运行的？


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了前Twitter大中华区董事总经理陈葵，她曾领导公司在中国大陆、香港及台湾的业务发展。在此之前，她于微软亚太研发集团出任微软云端及企业产品部策略合作伙伴生态系统总经理，专责制定微软云端在中国大陆的发展策略及业务管理事宜。曾经为微软、思科及冠群等跨国企业开拓大中华区市场，并建立高增长的企业业务。


    很多人都很好奇，备受推崇的Twitter到底是怎么运行的，为什么会受到包括比尔·盖茨、特朗普在内的诸多名人的追捧。这一周，我们换了一种特别的方式，邀请“得到知识新闻工作室”专访了这位大牛，干货满满，分享给同学们。


    ### 1、知识新闻工作室：很多人感兴趣，Twitter是怎么运行的，它和Facebook、和新浪微博到底什么区别？


    陈葵：Twitter创立的初衷，就是让每个人都在这个上面发声。它就像一个广场，每个人都可以上去讲话。这时候，那些有独到见解的意见领袖，他们更容易得到关注，他们的声音也会被更多人听到。相对来说，Facebook更像一个咖啡馆，大家是认识或者间接认识，才约到咖啡馆里相互聊天，聊天的内容更偏重生活化。所以在業界，我们有时候会说Twitter更像是一个社交媒体，Facebook更像是一个社交网络，这是一个很大的区别。


    对于Twitter而言，它一开始就是去寻找意见领袖，也就是我们说的大V，来它的平台，发表他们的意见主张。像埃隆·马斯克、比尔·盖茨，大概80%的世界五百强的CEO们都有Twitter帐号。当然几乎所有的体育和娱乐明星也都有帐号。有很多人来这个平台，也是为了来追看大V的，因为原则上，任何人在Twitter上面发表的推文，其他人都能看到，不管是不是他的朋友，只要他加关注就能看到。


    另外，Twitter自己的定位就是此时此刻现在在发生什么事。这个平台就是AR，它不是虚拟现实，是增强现实。这个世界天天都在发生新闻，有大事时大家的第一个念头就是去看
    Twitter。因此吸引了很多主流新闻媒体，像BBC、CNN、新华社，也在Twitter平台上非常活跃。所以自然地，大家来这个平台主要就是来看新闻，找朋友还在其次。


    新浪微博刚起步的时候也是这样的模式，后来微博发生了一些变化。除了大V，微博细分了几十个行业，邀请不同行业的达人，比如很多人喜欢做蛋糕、喜欢拍照，就能在微博上找到会做蛋糕、精通摄影的达人，每天发一些相关的好内容，慢慢就会有一批追随者聚集，相应地，也会有一些细分领域的企业注意到这个平台，他们会邀请这些达人做一些软广告，这个趋势慢慢加强，微博也就出现了很多人和很多共同的兴趣小组，这样微博的变现模式也就更丰富了，包括付费阅读、电商、广告等等，这是一个很大的变化。而Twitter现在这十年还是基本上没变，依旧是大V在广场上对某些事件发声，所以Twitter还是原来的Twitter，微博已经不是原来的Twitter了。


    ### 2、知识新闻工作室：相比其他平台，Twitter在商业运营上，有没有一些特别的尝试？


    陈葵：Twitter有它的价值，它的用户群体质量很高，Twitter的平均年龄群大概是33岁，都是有思想、有经济能力的人。所以在美国，有很多大公司愿意在Twitter上投放品牌广告，它的广告收入大部分也来源于此。在这里，你可以讲自家品牌的精髓，比如Visa公司，它开一个Twitter账号，就可以看到每天发一些Visa的企业文化、Visa出了什么新活动、Visa的用户评价，它每天都可以推各种各样的内容，吸引更多的用户群。


    当然，Twitter也在探索视频流，既然有媒体属性，那是不是可以把电视上一些好的节目，比如说大选、比赛、球赛之类的，直接放在Twitter上播出，然后大家一边看一边评论，这会是未来的一个方向。对于广告商而言，投放电视广告并不知道播放时是谁在看电视，但在Twitter的平台上，我们不仅知道是谁看了，还知道它看了多久，数据都是可以收集的，这是Twitter现在在尝试的地方，但关于这块的应用，Twitter确实也非常谨慎。


    当然不可否认，Twitter也有一些需要解决的问题。全世界大V的增长是有限的，不会源源不断地生产新大V出来，而这些大V又有事情要忙，也有很多平台去分流他们，所以目前Twitter的用户群增长幅度有所减缓。这是一个问题。毕竟对于广告商而言，还是希望能够看到大幅度的用户增长，这方面Twitter也会不停地探索更多变现的方式。


    ### 3、知识新闻工作室：您觉得社交网络的下一个风口在哪里？离开Twitter后，您下一步的计划是什么？


    陈葵：在Twitter时，我们会做很多未来的研究，到2018年底，预计整个互联网上的流量，80%以上会是视频的流量。


    这些年来，已经有很多做短视频的创业公司，但受限于带宽、OA、智能手机普及的限制，而且用视频讲故事相对图片而言门槛更高，所以一直没有真正成功的。但我相信，在不远的将来，这个市场会爆发。现在国内国外的互联网公司、社交媒体也都在往这方面转型，Instagram也在升级用短视频去讲故事。


    所以我原本是想来一个Gap Year（间隔年），想去学习影视，了解一下，电影电视剧是怎么讲故事的，能不能提炼一些共同性出来，做成一个类似于美图这样的APP，或者是美拍的一个升级版本，能帮助大家把自己的故事编成一个短视频。


    结果没想到，你往一个方面想，机会就来 了，我后来遇到几个做投资的朋友，他们 在整合一个电视剧公司、一个电影公司和 一个做纪录片的公司，他们也很希望 往“互联网+”方面去做一些跨界的探
    索，往网剧和短视频去做更多的尝试。正 好我们几个合作伙伴有做电影的、做电视 剧的、做金融的、做互联网的，都是各方 面的专才，完全互补，现在就在一起做公 司，看看跨界能跨出什么。


    说到用“互联网+”的方式去整合影视， 我举个例子，传统的电影电视剧的制作周 期是很长的，先找一个IP、再找制作团 队、找投资人、再到开始拍，差不多要一 年半到两年的时间。电视剧的周期甚至比
    电影还长，但在前期拍的整个过程中，其 实风险是非常难控制，比如说演员不拍了、 故事有问题、中间资金链的断裂等等。但 是如果我们能够在影视和电影前期制作的 时候就引入互联网，一开始就和大家有足
    够多的互动，不停地根据大家的反馈改 编，这样就可以提高受欢迎程度、降低风 险。这就像《纸牌屋》一边拍、一边播、 一边再创作。


    我们目前碰到的一个很大挑战就是内容的 质量，大家都在说现在烂片太多，没有好 的故事、高质量的拍摄，以后会越来越难 把人带进影院，而现在很多视频播放平 台，也在探讨付费收看这个风口。但付费
    收看，前提一样也是好内容、好故事，可 见好内容是现在整个市场最大瓶颈。


    只是，好内容需要匠人精神，耗时长、不 容易被复制，如果想提高产量，就有可能 影响质量。我们想要做的事情，就是如何 用互联网的思维去标准化其中的一些创作 流程，拓宽国内外IP孵化的能力，实现
    质量和数量的平衡。


    我做IT多年，很多思维方式都是流程化、 模块化的，这个可能和文化圈里的电影人 会不一样。我很擅长了解一个东西之后， 把其中的环节标准化和模块化，提炼出它 的流程、技术，再把它们重新组合搭建，
    这样就能把方法论做出 来、提升整体效 率。


    再比如，我还会用互联网的方式，想办法 在兼顾质量的前提下提高产量。其实很多 公司拍电影，一年拍几部大片就完了，过 程中很多的材料就都浪费了。但是如果有 一套体系，遇到质量高的剧本可以拍成电
    影，有些不够成熟的别扔掉，拍成高质量 的短视频，有些觉得拿不稳的，卖给其他 人做进一步深化，这样就做出层次了。


    这就是跨界的好处，对我的新工作，我很 期待。


    ### 4、知识新闻工作室：这样的跨界组合下，每个人都是各领域的专才，你们相互之间会怎么合作呢？


    陈葵：跨界做的好，会非常成功，做不 好，就可能会变成权力斗争，这个要特别 注意。


    这次对我很大的挑战就是，之前我是绝对 的领导，我说什么，即使其他人有不同意 的，但也都要听我的。但在新团队里，大 家都是各个行业的牛人，这时候，就特别 需要转换心态、忘掉曾经的成功，把自己
