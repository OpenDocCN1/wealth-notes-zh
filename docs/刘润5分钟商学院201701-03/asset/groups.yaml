    你这位CEO有什么问题想问他，欢迎在留言区提出出来，我们将挑选一个最有价值感的问题，请王总认真回答，并在本周学习结束的时候，公布这个CEO问CEO的结果。


    # 帮你当好自己的CEO


    # 留言精选


    刘英姿 43

    刘老师昨天说管理可以用在每个关系里，作为一个妈妈，看完今天的内容在想，对于孩子也可以这样去做。1满足孩子的生理需求，让他吃饱穿暖。满足物质层面的需求。2满足安全感需求。家庭关系稳定，亲情和睦。创造一个安全的成长空间。3满足他的社会需求，有朋友的肯定，老师的认可，又随着年龄的变化有所不同。4从心里尊重孩子，信任他，关注他在做的事情。5协助孩子实现自我。如果一个孩子从父母手里越早能实现自我价值，就应该是证明父母教育越成功。这样梳理下来，作为一个妈妈就没那么无端的纠结了。01-01
