    # 客座教授 | 公司是为什么存在？


    ![](img/5bc03606054caee6e4ef8bff8979929a_8_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了百姓网创始人&CEO，王建硕。他曾是微软最年轻的部门经理和渠道经理，还曾以项目经理的身份带领团队创建了微软亚洲技术社区，组建了微软高级培训（MAT）团队。2005年创立国内第一家分类信息网站百姓网，成功将百姓网打造为月活跃用户数过亿、覆盖全国367个城市的本土分类信息网站，并带领百姓网于2016年成功挂牌新三板。


    这一周，我们请他分享一下，在跳槽频繁的互联网公司，百姓网是用什么方式激励优秀人才的？


    ![](img/5bc03606054caee6e4ef8bff8979929a_8_1.png)


    相对而言，资本市场更喜欢快公司，发展速度缓慢的公司，公司内部和整个市场在看待它时难免都会焦虑。百姓网作为一家稳扎稳打的慢公司，您一定是有自己的打算的，问题是，如何说服公司的优质人才留下？用什么方式激励他们？


    最根本的问题是，到底一个公司是不是为了资本市场存在的。


    如果选择迎合资本市场，那是完全另外一条路。同时资本市场的波动性非常大，一年前趋之若鹜的模式，一年后就门可罗雀。如果公司的价值是为了迎合资本市场，不但不能创造价值，而且优秀的人才无法长期留下的。


    任何一家公司都有自己的文化，相信什么，找什么样的人都是多样的。所以我们也没有什么独特的吸引人和留人的招数，只是坚持自己相信的，创造一个独特自己喜欢的环境，自然有相信同样的东西，喜欢同样的环境的人加入。我们无法说服任何不是这样的人加入，也无法改变人，能做的只有坚持自己的，并且严格的选择一起走的人。


    很多人都说百姓网是一个低调的公司，确实，我们一直坚持以效率为优先指标，而不是规模优先，也不着急扩张，我们把所有的成本砍到极致，把人数控制到公司可以存活的数量，因而保证了百姓网可以持续盈利的情况下稳步扩张。所以，我们吸引的人才，很多都是这样低调、踏实、能干的人。


    现在，市场上不缺钱，不缺主意，最缺的就是耐心。所有人都觉得我这个项目已经干了三个月了，怎么还没上市？是不是要换一个？这其实是很浮躁、不成熟的。最终，经济周期会让所有人都冷静下来，回归本质，创造价值。


    刘润老师的新书《穿越红利》的签名版和价值398元的百思美羽绒枕


