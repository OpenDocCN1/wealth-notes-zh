    ## 客座教授｜内容付费的核心是持续提供有价值的信息和分析


    ![](img/5bc03606054caee6e4ef8bff8979929a_146_0.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了上海第一财经传媒有限公司CEO周健工，他早年曾参与多家财经媒体的创办与管理工作。2004年作为始编委参与创办《第一财经日报》，2009年到2015年在福布斯中文版担任总编辑。


    很多人都好奇，他如何看待现在内容付费的风口，作为传统媒体的掌舵人，一财在商业变现上有什么新的尝试。这一周，我们请他来分享一下其中的门道。


    ![](img/5bc03606054caee6e4ef8bff8979929a_146_1.png)


    ![](img/5bc03606054caee6e4ef8bff8979929a_146_2.png)


    刘润

    互联网时代，内容有两种模式：免费内容，通过广告或者电商模式变现；另一种是直接的内容收费，而《第一财经》的杂志都有点像两种模式的集合，杂志本身卖钱，里面也有广告，从您的角度，您如何看今天的内容收费？


    在垂直领域通过个人的专业化知识和洞察，直接帮助订阅户创造价值，从而收取订阅费用，这在前互联网时代就存在了，比如美国有很多个人的newsletter，尤其是在股市、投资、财富管理领域，他们服务于一批小众的投资者，每年收取几百美元的订阅费。这种模式很容易移植到互联网上，譬如目前第一财经成功推出移动应用“有看投”，一些有关投资的文字及视频内容取得了很好的收费效果。


    另一种是原有的高品质机构媒体，在其网络建立付费墙。如纽约时报，华尔街日报，金融时报等。中国内地目前最成功的付费墙是《第一财经周刊》的app，在苹果中国市场的新闻类与报刊类的阅读，均一度排名第一，最近也稳居第二名。同时杂志本身因其内容及设计品质，有一批忠实的订阅户和零售用户，同时也能卖出广告。


    最近新兴起的内容付费和知识分享，是互联网用户逐步形成了对优质内容付费习惯的结果，也是互联网上充斥低劣内容劣币驱逐良币的结果。付费内容的作者，需要好的平台与场景，持续提供有价值和帮助决策的信息和分析
    (intelligence & analysis)，对个人是个比较大的挑战。


    想请问周总，内容与流量之争由来已久，请问对于内容制造商来讲，如何从内容生产单点切入到构建完整商业模式的转型？


    一财目前有五个新兴的业务：第一财经app和移动媒体矩阵；第一财经互联网视频（大直播和短视频）；移动投资社区“有看投”；英文财经新媒体YicaiGlobal；以及第一财经商业数据CBNDatacity，会对数据进行媒体化、商业化、自动化的处理。


    优秀媒体有很高的公信力，品牌效应，加上为客户提供多种内容解决方案，巧妙地利用与流量平台的合作关系，也建立起商业模式，但管理的难度加大了。另外，从优秀的内容及其忠实的用户群出发，可以建立起生态，衍生新业务。


    目前来说，广告仍然是一财最重要的收入来源，但传统的广告模式在萎缩，内容的核心竞争力有多种变现方式，从而也让媒体的收入和业务模式变得多元化起来。毕竟，市场化的媒体也是商业机构，商业的本质都是一样的，目的都是为了赚钱。


    请问周总，在这个信息过载的年代您所在的媒体是如何过滤信息？您认为商业财经类的媒体所提供的信息是深度重要还是广度重要？


    财经内容关系到管理者和投资者进行决策，我们与互联网上流行的许多财经内容保持距离，因为要对用户的真金白银负责。第一财经通过专业的内容团队和行业高标准进行内容筛选。对于一财这样一个拥有多个产品线的全媒体集团来说，我们追求速度、深度、广度，但对每个产品来说，我们会强调深度。


    这方面我们特别庆幸自己拥有一个中国最优秀的财经媒体团队，无论是资讯、视频，还是数据，无论是新媒体还是经典媒体。我们也会想办法吸引和留住那些真正喜欢财经媒体的人。


    我们不再以“传统媒体”称呼自己。第一财经已经拥有全新的媒体产品矩阵，同时，我们把依然领先市场的电视、日报、周刊称为“经典媒体”。


