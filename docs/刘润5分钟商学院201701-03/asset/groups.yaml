    # 125｜只要可能出错，就一定出错


    周三晚上我在得到APP直播“如何用商业思维做出聪明选择”，感谢3万多名热爱学习的同学们同时在线、全程参与，想说的内容太多，自带1.5倍语速，还是讲了1.5小时，以后有机会再和大家“面对面”交流。


