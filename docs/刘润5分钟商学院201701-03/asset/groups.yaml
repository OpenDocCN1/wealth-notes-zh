    阿米巴是通过把员工从“执行者”变为“经营者”来实现整体的效益最大化。但是因为阿米巴是一个个独立经营的小团体，团体之间必然存在着竞争。而团体之间因为自利性，如果出现恶性竞争的话，就有可能造成团体盈利，整体亏损；团体高效，整体内耗的情况。这就好象中国有很多恶性竞争的行业，因为市场不错，有大量的同业竞争者进入。然后不断的打价格战，造成整个行业无法健康运行，最后自己把自己这个行业做死了。如果采用阿米巴的这种模式出现这样的内耗和恶性竞争的话，注定会失败。


