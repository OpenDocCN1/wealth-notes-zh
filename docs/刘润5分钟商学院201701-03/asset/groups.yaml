    关于关于组织模式的两块积木，我的理解如下：联邦分权制的核心在于对结果负责，对于过程和行为具有自主性；职能分权制的核心在于对自身行为负责，对于最终结果没有概念；现在流行的阿米巴也好，老师之前讲的代理两难、合伙制、股权激励也好，其实核心就是要调动人的主观能动性，或者说叫主人翁精神，而主人翁精神的核心应该就是对团队的经营结果负责，向经营业绩要回报，而不是向自身行为要回报；强调要功劳不要苦劳其实也是一样的逻辑。从这个角度来讲，联邦分权制是更优的一种方式，只是当组织规模较大的情况下，实现联邦分权制的难度较大，同时在组织外部环境相对处于稳态的时候，使用职能分权制也能在一定程度上实现组织的目标，或者说职能分权制其实是联邦分权制在某种程度上的过度和替代。所以现在龚树衣舍也好，稻盛和夫先生的阿米巴也好，海尔的最新变革也好，其核心就是实现组织内部越来越小单元的联邦分权制，激发每一个单元的活力。换个角度来看，企业最大的资本就是人力资本，从这个维度上来看，哪个企业将人力资本发挥的更出色，就更容易在激烈竞争中胜出。显而易见，联邦分权制中在目标/结果导向下的过程和行为自主性对于人力资本的发挥更具有优势。综上，联邦分权制本质上优于职能分权制，职能分权制某种程度上是实现联邦分权制的一种过渡形式。

