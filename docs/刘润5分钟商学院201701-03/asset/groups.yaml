    ## 概念：墨菲定律


    墨菲是美国爱德华兹空军基地的上尉工程师。1949年，他和他的上司斯塔普少校，在一次火箭减速超重试验中，因仪器失灵发生了事故。墨菲发现，测量仪表被一个技术人员装反了。由此，他得出的教训是：如果做某项工作有多种方法，而其中有一种方法将导致事故，那么一定有人会按这种方法去做。


    后来，墨菲的这段话被广泛传播，不断演绎，最终变成了一句大家可能更加熟知的表述：凡事只要有可能出错，那就一定会出错。


    “墨菲定律”，和我们在第123课讲的“帕金森定律”，第124课讲的“彼得原理”一起，被并称为二十世纪西方文化的三大发现。


    ## 延伸：顺利的事儿，你记不住


    虽然“墨菲定律”有这么高的地位，但在继续往下讲之前，作为数学系毕业的我，还是必须要先说一句：墨菲定律没有数学依据，它其实是一个心理学现象。


    如果火箭上天有可能失败，就一定会失败的话，那火箭永远上不了天；如果情人节送花，你有可能写错名字，就一定会写错名字的话，那你永远找不到老婆。根据墨菲定律，人类已经灭绝几千次了。墨菲定律不是一个数学规律。墨菲定律，是一种“选择性记忆”的心理学现象。一路绿灯，按时到公司；洗完车后，天空万里无云；重要的东西没掉，或者就掉在脚边……这些事情太顺利，不会给你深刻记忆，而只有那些让你挫折和痛苦的记忆，最难磨灭。墨菲定律的原理是：顺利的事儿，你记不住。


    但虽然墨菲定律不是客观的数学规律，它依然具有其重大意义。人脑的这种更能记住挫折的机制，其实是一种保护机制，一种从生理和心理上，抑制“盲目乐观”，保护我们免受重大伤害的机制。


    ## 运用：免受意外风险的两点建议


    第一，心理上：不能忽视小概率事件。


    我想这是墨菲定律对管理者们最大的意义：提醒我们保持“谨慎乐观”，而不是“盲目乐观”。还记得第119课讲的“风险管理”吗？泰坦尼克号的管理层，就是因为盲目乐观，在救生准备严重不足的情况下，出发远航。


    如何重视？默念墨菲定律的四个推理，激发你的心理保护机制：第一、任何事都没有看起来那么简单；第二、所有的事都会比你预计的时间长；第三、会出错的事总会出错；第四、如果你担心某种情况发生，那么它就更有可能发生。


    第二，行动上：做最好的计划，做最坏的打算。


    管理者应善用项目管理，做最好的计划；同时善用风险管理，做最坏的打算，应对风险。


    从可识别的角度看，风险有三种：已知的风险，已知的未知风险，和未知的未知风险。


    ## 小结：认识墨菲定律


    墨菲定律就是，凡事只要有可能出错，那就一定会出错。墨菲定律不是一项数学规律，而是一个心理学现象，人们更容易记住挫折和痛苦。但墨菲定律，还是给了我们重要警示，管理者不要“盲目乐观”，要“谨慎乐观”。


    怎么做？第一，心理上，不能忽视小概率事件；第二，行动上，做最好的计划，做最坏的打算。针对已知的风险，已知的未知风险，未知的未知风险，做好风险管理。


    本周，我们讲了五个管理常见病：破窗效应，旁观者效应，帕金森定律，彼得原理，和墨菲定律。忽视任何一个，都可能导致你的企业面临意想不到的挑战。你记住了吗？


