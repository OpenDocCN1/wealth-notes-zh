    # 客座教授｜我为什么会大规模开实体店？


    ![](img/5bc03606054caee6e4ef8bff8979929a_162_1.png)


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了汇美集团董事长兼CEO、茵曼品牌创始人方建华。他在1998年创立汇美集团前身，2008年创建第一个品牌茵曼，目前旗下拥有十余个时尚服饰品牌，年交易规模近20亿。他在业内首创的“茵曼+千城万店”一年多时间销售业绩突破约2个亿，成为引领品牌线上线下融合的先行者。


    很多人都很好奇，为什么在很多人看衰实体经济的当下，茵曼会大规模地开设线下门店，这背后有什么样的战略思考。这Sa周，我们邀请“得到知识新闻工作室”专访了这位大牛，干货满满，分享给同学们。


    ![](img/5bc03606054caee6e4ef8bff8979929a_162_2.png)


    1、得到知识新闻工作室：我们看到很多实体店在一家一家地关，但汇美集团最近在全国开了近400家实体店。为什么要选在这个阶段去开实体店？


    方建华：正因为很多人关店，我才觉得我们有机会。


    大家可能普通认为线下的成本很高，事实上线上的流量和人员费用也不低，现在两者的获客成本差不多到了一个同样的临界点，拼的是谁的效率更高。


    我先说说为什么传统线下零售店的模式已经很难适应新形势下的变化。因为传统的服装品牌，更多是层层分销制，到零售店时候已经经过了数倍加价，几乎是5～10倍的加价率，价格一定很高。另外，分销商只有订货以后，品牌商品才能下单给他，也就是你要把钱打给我，我才把货发给你。这样就会导致终端的经销商和加盟'
  - '[PAGE 163]


    他，也就是你要把钱打给我，我才把货发给你，这样就会导致终端的经销商和加盟商的压力很大，最终变成库存积压。第三，传统服装门店还面临一个问题：货品款式固定，更新周期长。再加上很多品牌商在网上开了旗舰店后，价格都会比加盟店便宜，很多顾客会到线下店去试穿完衣服，再到网上购买，这就导致线下店沦为了线上的“试衣间”，生意越来越难做。


    # 我们打造了一套独特的茵曼开店模式，来对传统的零售店铺经营方式进行“重构”。


    首先，我们所有体验店都不需要店铺订货，只有样衣和少量的各种尺码的现货，顾客买走某个尺码之后，在茵曼的系统里，加盟店缺什么能立刻体现出来，然后系统会自动补货，加盟商也可以进行选货，茵曼的广州总仓每天都会发快递补货。这样加盟店的店主只用1/3的投入资金，就能开好茵曼的体验店，也解决了库存问题。第二，用柔性化的供应链，对好销的货进行快速返单。第三，茵曼开发了一个全网打通的会员系统，能够掌握所有用户的信息和订单。在线下门店注册的会员（以初始注册门店为准），如果在天猫等平台产生购买行为，线下门店也能分享收益，大概是线下服务费的一半，10%~15%。而且只要这个店还在跟茵曼合作，就可以持续获得收益。


    而且我们线上线下的商品都是同款同价，这就实现了线上和线下的利益一致性，把品牌的利益和体验店加盟商的利益捆绑在了一起，门店就会更积极地开发新会员。


    这个重构的本质就是在提高商业效率，提高零售效率，提高消费体验。这也是我们在这个阶段大规模开实体店的原因。


    # 2、得到知识新闻工作室：在您的战略里，未来几年，实体店会占到一个什么样的地位？


    方建华：未来5年，不管是电商传统品牌，如果不走线上线下融合这条路，终究会被时代抛弃。这是我的观点。未来我们计划是双线并行，线上线下好比人的两条腿，只有这两条腿都很健壮，才有可能跑得更快更远。线下我们还是刚刚开始，未来我们会开更多的店铺，而且集团有十几个品牌，未来我们还会启动其他品牌的开店计划，进行“茵曼模式”的复制。未来线上线下，我想应该是整个的销售占比是50%、50%，可能线下的销售占比会更大，有可能达到60%。


    这不是说我们不重视线上，而是线上已经过了高速的增长期，原来可能是100%、200%的增速，但去年整个中国线上的零售增速是25.5%，整个在放缓。这也是我们为什么要走到线下的一个背景。


    其实线上线下本来就是一家，互联网早期把这一家拆成了两个不同的渠道而已。但所有的消费行为都是在不断创新，谁体验做得好，最后谁就能留住顾客。'
