    留言精选


    徐一 一 29

    破窗效应，就像多米诺骨牌一样，看似很小，但其破坏作用有时候往往却是牵一发而动全身。


    林子大了，什么鸟都有。排名第一的管理学原则是“No Asshole”，即将公司里的捣局者尽快识别和排除。捣局者往往就是“破窗”的始作俑者，捣局者的产生除了员工个人素质（和教育程度无关）、道德诚信观念的缺乏之外，最重要的因素是制度。


    不完善的制度有时候是最大可能“破窗”的那块多米诺骨牌。比如，二战美军降落伞合格率总是在99%，军方（也有人说是巴顿将军）就改变了检查制度，每次交付前从降落伞中随机挑出几个，让厂家负责人亲自跳伞检测。从此，奇迹出现了，降落伞的合格率达到了百分之百。一个好的制度可以使人的坏念头受到抑制，而坏的制度会让人好的愿望四处碰壁。一个好的制度可以让坏人变好人，坏制度可以让好人变坏人。犯错不可怕，可怕的是仅仅从错误中指责和惩罚，而没有从制度、流程上找原因，从而失去改变核心内容的机会。

