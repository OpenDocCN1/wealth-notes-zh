    互联网KPI与传统企业KPI的不同：以往企业考核的是利润、产值、产品规模，现今互联网企业考核的是用户的数量、留存率、活跃度、获客成本以及客单价。传统意义的企业是以商品为目标进行考核；互联网企业考核是以用户为目标展开的。KPI目标和指向物发生了变化。


