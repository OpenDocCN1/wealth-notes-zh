    # 100｜你的公司有“前员工俱乐部”吗？


    100｜你的公司有“前员工…”


    ## 概念：前员工俱乐部


    前员工俱乐部，是员工从一家公司离职后，完全自发，或者在原公司支持下，半自发、半官方组成的一个联盟组织。这种联盟，很像不少大学都有的校友会。中国有个“清华帮”，他们一见面就询问“你是几字班的？”，完全不在乎旁人听不听得懂。同样，商业界也有个“宝洁系”，宝洁的前员工一见面就问“你是哪一级的？”
    这个“帮”、那个“系”背后，是强大的归属感和自豪感。


    在互联网时代，公司对员工的“终身雇佣”，员工对公司的“单向忠诚”，都一去不复返了。员工和公司之间，用LinkedIn创始人里德·霍夫曼的话说，是一种“联盟”关系。员工虽然离开了公司，但你们的“联盟”关系并未散去，只是换了一种方式。“前员工俱乐部”，就像“校友会”一样，是个非常有效的、承载这种“新联盟关系”的容器。


    回顾：


    在昨天第99课“离职面试”里，我们聊了聊，如果一个深受重用的员工离职，我们如何借助“离职面试”这个工具，和他重新建立关系，从上司级，变为朋友，虽然留不住他的人，也要留住他的心，并借此机会，反观自己，发现公司和个人的问题。


    那么，然后呢？然后就站起来来，握手告别？当然不。你还有一件非常重要的事情没做，在站起来之前，你可以对他说：喂，对了，我们有一个前员工俱乐部，从今天开始，你可以开始享受前员工的福利。


    ## 运用：提供给前员工的三项福利


    第一，各种聚会活动。


    微软在中国有两个前员工俱乐部，一个在北京、一个在上海。我是上海俱乐部理事会的理事。这两个俱乐部，都经常在线上、线下办各种活动。北京俱乐部举行过盛大的前员工聚会，我们上海俱乐部也不甘示弱，专门组织大家坐游轮去韩国，畅谈人生。我还作为前员工，被邀请回微软，给老员工们做演讲。


    第二，员工推荐奖金。


    有职位开放招聘，你可以把职位需求发到前员工俱乐部中，求推荐。物以类聚，人以群分。优秀的人周围，通常都是优秀的人。很多公司有“推荐奖金”，比如我在微软推荐一名员工加入，可以得到不菲的奖金。可以把这个奖金政策，也开放给前员工，比猎头费便宜很多。


    第三，自家产品试用。


    你可以邀请一些你的前员工来提前试用自己的新产品，并且给予他们购买成熟产品的折扣。我常常试用微软的新产品，并且直接给微软西雅图总部的产品部门一些反馈。这种福利，会增加前员工的荣誉感，你也能得到不少专业反馈，他还会很自豪地帮你宣传产品。


    ## 小结：认识前员工俱乐部


    前员工俱乐部，这是一种全自发、或者有半官方参与的、离职员工的联盟组织。公司对员工的“终身雇佣”，员工对公司的“单向忠诚”，都一去不复返了。通过前员工俱乐部建立一种新联盟关系，可以：第一，获得传教士；第二，获得大猎头；第三，获得内测员。


    具体怎么做呢？除了不断给前员工俱乐部发布公司信息外，可以对应地做三件事：第一，举办“各种聚会活动”，第二，给出“员工推荐奖金”，第三，提供“自家产品使用”。


    你也许没法组织“前女友俱乐部”，但可以组织“前员工俱乐部”。


