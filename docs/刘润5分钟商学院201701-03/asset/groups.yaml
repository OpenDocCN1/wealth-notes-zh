    # 客座教授｜投资人最大的价值是提高赢的概率


    《5分钟商学院》的同学们，


    大家周末好！


    这周，我们请到了真格成长基金管理合伙人李剑威。他曾是红杉资本的副总裁，投资过销售易、Ninebot-Segway、华米等明星企业。现在，他是真格成长基金的管理合伙人，也是罗辑思维、小鱼办公、有车以后、老虎证券、亿航、云洲智能、军武次位面等行业领先企业的投资人。他在新媒体、企业服务、云计算、大数据、智能硬件、移动医疗以及网络安全方向等投资方向经验丰富。


    很多人都好奇，他究竟有什么独特的看项目的方法，能一直保持那么高的成功率。这一周，我们请他来分享一下其中的门道。


    ![](img/5bc03606054caee6e4ef8bff8979929a_117_0.png)


    对于风险投资，你会比较关心项目，还是关心做项目的人？你是怎么看某个领域未来的发展性，又如何看某个人 的可靠度呢？


    作为早期的投资机构，在我们的投资哲学里面，人，或者说创始人，始终是第一位的。尤其是天使阶段，可能只有几个合伙人和一个业务构思，没有产品可以看，更没有数据可以分析，做判断只能够看人。


    在对人的判断上面，徐小平和王强老师给投资团队传承了很多经验。我们非常强调团队的authenticity，也就是团队创业的动机，以及过去的经历与目前所做事情的匹配程度。


    关于创业的动机，根据我们的观察，一流的创始人去创办一个公司，首先考虑的是要去解决一个他们非常希望解决的实际问题，而不是“要赚多少钱”或者“要做一个xx平台，打败BAT”，他们对解决这个问题有强烈的兴趣，会想出各种创造性的办法去突破常规。有这样想法的创始团队，通常会在创业的道路上走的更远，未来即使遇到困难和低谷期（这几乎是必定会发生的），也会更加有韧性。


    而过去的经历与目前所做事情的匹配程度，则是我们常说的团队的DNA。创业本身其实是九死一生的事情，竞争极为激烈，成功机会其实很小。徐小平老师提到一个观点，创业是团队过去资源的总爆发。我个人很相信一万小时定律，一个团队在创业之前，如果在所在的领域有足够的积累，对产品和业务模式有深刻认识，那么他们在创业这个时间点，相对于其他对手会有很大的竞争优势。


    对于团队，我们还归纳出了几个原则，就是看他们的学习能力、工作能力，还有影响力（3L）。学习能力很好理解，工作能力就是团队之前在该领域的经验积累和所达到的水平，影响力指的是影响他人的能力，这里面包括了你的合伙人、合作伙伴、供应商、投资人等等。理想的团队组成，最好有是团队成员之间有化学反应，优势互补，而且能够相互妥协。


    当然，除了看人的一些原则和经验之外，我们平时也会对各个行业的发展情况提前做一定的了解和研究，形成一些初步的观点。但是，我们从心底里认为好的创业者肯定比投资人了解的更多，思考的更深入，所以每一次与创业者的交流，对我们来说都是一个学习的过程。


    ![](img/5bc03606054caee6e4ef8bff8979929a_117_1.png)


    每个投资机构都有它各自鲜明的特色，也有它各自的局限。就真格基金而言，你们区别与其他投资机构的特色是什么？你现在投资和关注的行业和领域是否跟你们自身经历的行业背景有关？如何分配精力，持续深入关注新领域？


    创投行业竞争很激烈，不同的基金有不同的定位。真格基金的哲学是比较鲜明的，可以分别用徐小平老师和王强老师的两句话来描述：“我赌的不是市场机会，我是赌人，是那些真诚、勤勉、有创业基因的创业者”、“我们秉承自己的价值观，要做全世界最大的小基金”。


    当很多机构都在赌赛道的时候，我们希望非常专注在赌那些最优秀的人，那些最热爱他们事业并为之做好充分准备的团队。


    真格有比较强烈的对创业者友好的文化，希望“做创业者的垫脚石”。围绕着这个核心，我们在具体流程上做了不少创新，比如在2015年我们推出了一页纸的投资意向书（之前行业一般来说需要七八页），两页纸的最终投资协议（之前行业标准都是几十页），这点对于创投行业来说是史无前例的。


    为了支持天使阶段的创业公司，真格还建立了机构化专业化的投后服务，在营销、人力资源方面争取提供帮助。我们的营销总监之前是奥美的高管，人力资源顾问原来是规模很大的创业公司的人力资源总监。


    以上这些，都是希望尽可能降低创业者的信任成本，提高他们的行动速度，增加团队赢的概率；目前看起来，我们在创业者群体中的口碑应该还是很不错的。


