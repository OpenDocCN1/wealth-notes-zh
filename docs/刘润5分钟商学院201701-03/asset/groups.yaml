    在一家企业创造价值的过程中，会有20%的 人创造80%的价值，在每一位员工身上也存在着“二八原理”，80%的工作任务由20%的关键行为完成。所以，必须抓住20%的关键行为，对之进行分析和衡量，这样可以有效抓住业绩评价的重心。'
