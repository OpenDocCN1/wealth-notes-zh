    ## | 本周留言精选


    设计上有个三原色，是要快，要好，要便宜。快和好要舍得花钱。快和便宜是丑。便宜和好需要等。三个都满足不可能。人通常纠结，选择困难，是因为执着追求完美，追求完美通常是更大的贪婪，什么都不想舍，什么都想要，那是为了难为老天爷呢。


    关于质量控制，日本企业有很多很好的范例。比如优衣库，希望做出低价高品质的产品。优衣库在中国有不少加工厂，业界的平均次品率是2%~3%，也就是每百万有2~3万个次品，而优衣库要求工厂把次品率降到0.2~0.3%。而且优衣库评价次品率的规则非常严格，一件T恤表面如果有一个0.5毫米的线头，这就算次品。最开始，中国的工厂都没法接受这样的标准，优衣库就从日本招聘有丰富经验的技术人员进行指导，并淘汰那些不达标的代工厂。经过严格的质量管理，中国工厂慢慢提高了产品质量，并且开始能为其他世界大牌代工。


    对于标准行业，6sigma管理是适用的。比如机械加工行业，对于公差的控制代表了一个工厂的加工能力和质量管理水平。在这方面，中国企业还有很长的路要走。有 Would...
    中国产品质量的提高，除了企业学习质量管理方法之外，还有一个很大的因素是行业消费观念的制约。比如下游的企业就是希望用便宜产品，即使存在着一些质量问题，长此以往，劣币驱逐良币，重视质量的上游企业产品卖不出去，最后不得不调整产品质量标准以避免破产。从中国制造转为中国智造，中国企业的整体升级转型，尤其在工业制造行业，需要我们的企业家转变思路，重视质量控制，提升产品质量。因为精益创业之后，必然会面临着精益管理的挑战！


    在最初学习财务分析与决策时，一直想知道为什么是偏偏是这三张表呢？资产负债表是家庭，好比人的骨骼，骨质疏松企业就老龄化了；利润表是衡量企业长期发展的体检表，好比人的肌肉，虚胖在长跑中就总是气喘吁吁，还会得高血压心脏病；现金流是公司运营的现状，好比人的血液，供血不足总会体力不支、头晕气短。这三张表一定要配合使用，才能认清审视企业健康状况。流动比率、资产收益率、周转天数这三个视角很赞。


    如果有300万，是买房还是创业呢？选择创业，买房所得的收益就是创业的机会成本，这几乎是必然要花掉的成本。况且创业九十九死才一生，这时选择创业的风险是不是就要规避掉，安心买房，或者是折中，一半买房一半创业，把可能的损失控制在自我所能承受的范围内。


    德鲁克曾说管理者有听觉型和阅读型两种，针对自己的老板，有针对性的报告方式，可以更快达成沟通效果，节约老板的时间，提高效益。如果老板是听觉型，而下属提交邮件或方案文档长篇大论，老板不一定会喜欢，他需要的简明扼要的口头汇报。如果老板是阅读型的，如果下属说个不停，不如一篇结构清晰思路严谨的报告来得更缜密。


