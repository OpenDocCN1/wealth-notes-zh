    问：小弟从高中开始就对易经道德经感兴趣，平时非常喜欢看书，很享受那种收获知识的快感，那种三观升级的快感。对历史也很感兴趣，读史亦能通今。微信公众号冯学荣和冬川豆关注过了，您还可以推荐一些了解正史的书或平台给我么？（PS：虽然问了很多没关于房产的问题，但是平时不忘库圈内功心法，不忘实操）


    答：其实知乎历史版，水平非常高。苏沉船。


