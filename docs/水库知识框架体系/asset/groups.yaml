    # 水库知识星球 T-1（注：底层规律）系列


    这一系列共 514 个问题，17 篇


    如果说水库在家学建构上提供了 T-1（底层规律）的框架，那在一线桃李满天下的教育革新者，就是看房 200 套的践行者，他们的经验和细节是丰满家学的拆骨法。


    在需要耗费更多心神去填充家学的细节之前，知晓世界和社会 T-1 的逻辑无疑更重要。今天花了十几个小时看完 7 万字水库知识星球问答“T-1”系列（托做多娃家学公众号的福，我也是第一次系统看星球问答），发出第一千零一次惊叹：我神不愧是我神啊！真乃真理的百科全书~


    请原谅一个孕 33 周的二胎妈妈为了保持日更，只是按照时间倒叙对问答进行发布，并没有进一步细分主题，比如 T-1 是什么，怎么获得 T-1 的能力，T-1
    的功力表现，经济学、政治学、房产、爱情、婚姻等各行各业 T-1 的分类等等。虽然降低了大家的阅读体验，但更能实现前后文呼应（好吧，这是借口，有时间的话我还是会更细致地分类录，让自己也更清晰些）。


    **01-10**

    问：几次看到 T-1，求教具体是什么？感觉错过了一个重要原理。T 代表什么？那-1 什么意思？+1 又是什么意思？


    **答：如果你掌握了 100 条道理，却过不好人生。你需要一条 T-1 更底层的公理。T 是“现有”的简称。来自于股市中，T+1，T+0。-1 更底层，+1
    衍生定理。**


    问：底层逻辑是什么意思，t-1 是什么意思？


    答：你高考做了几千道题。但是理清楚出题老师思路的话，50 题就够了。


    问：你当爸之后，功力有没有打七折？自己难道不矛盾吗？她们是掀桌子的一代人啊！什么东西最珍贵，这个社会可能会教给她？


    **答：T-1 的意思，就是时代在变，而底层规则不变。**


    问：您说的 T-2，甚至 T-3 是什么？


    答：生物的 T-1 是化学，化学的 T-1 是物理。我发现在一些人的脑海里，是不是从来都没有过 T-1 的概念。


    **问：我们看很多知识，如何把她串起来，而不是忘记了？**


    **答：只记忆 T-1。**


    问：闭圈不意味着停摆，但其 t-1 是什么？如果不方便可不作答。


    答：收费太便宜了，不够成本。


    问：接受不完美的 t-1 是什么？


    答：完美代价太大。


    问：请问商业运行的 t-1 是是付费者补贴白嫖者吗？


    答：你家门口卖煎饼果子的，谁白吃了。


    问：西港付尾款愁了 2 个月，两鬓白了四根头发，心里压力重，上周突然想通了，路要向前走，心态放平衡，谋事在人。请问欧神若干年后如果月供+0 或者尾款翻十倍的时候如何想通一些事情，您是如何解压的？（重要）压力山大的
    T-1 底层道理是什么？


