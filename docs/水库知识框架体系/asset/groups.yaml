    \n**67**\n问：能否推荐三本对你的价值观世界观的形成影响最大的书？\n答：《宏观经济学》《阿里布达年代祭》《碧血剑》。《碧血剑》是我看的第一本武侠小说，在非常长的时间里，是唯一的武侠小说。阿里你们大部分人既没看过，去看一遍比较好。阿里的价值观其实就是“关我屁事”。\n\
    \n**68**\n问：可以推荐影响你最大的五本书吗？\n答：初中物理，初中数学，高等数学，数据结构，宏观经济学。\n\n**69**\n问：想了解真实的世界和社会法则，除了看欧大你写的和你推荐的文章外，还应该看什么读物？奥派经济学的书？哲学书？\n\
    答：“辉格”的水平极高。堪比阿姨（注：刘仲敬）。\n\n**70**\n问：你写的哪些篇章有利于提高T-1能力？或者哪些书？可以推荐下吗？\n答：所有的文章，都是都围绕同一套思考体系。\n\
    \n**71**\n问：推荐本构建 T-1 思维的书？\n答：见《欧绅 5.16 朋友圈内容》（注：指公众号 sk 论坛）。\n\n**72**\n问：能否请怡空推荐一些政治、历史、经济、军事、金融、天文等学习渠道或书籍？\
    \ 更多分享加微信:zsyx0001\n怡空：找到这个领域的牛人，请他推荐 1) 入门级 2) 初中级的两套阅读书目，每套 5-10 本即可。之所以不推荐看中高级的，是因为看了也看不懂，而且很枯燥，通识教育不需要那么细。\n\
    \n**73**\n问：您推荐的书一本都没有看过，以前也没有看书的习惯，能推荐下看的顺序吗？是买纸质版还是网上下载免费电子书？谢谢。普通本科工科毕业。\n\
