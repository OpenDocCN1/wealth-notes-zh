    \n## 348\n\n问：生活中有的人很能搞定人，比如申请更好的贷款，找更好的工作。但自己一直被欺负，很难说服别人搞定别人。要搞定人或事的t-1的道理是什么？\n\
    \n答：懒。遇屁不行就退缩了，而不是克服困难。整个流程，其实拆解成一百个小困难。你一个都过不了。\n\n问：一语道破啊。除此之外，如果我很勤奋还是搞不定事情，原因是什么？没有掌握什么技巧么？\n\
    \n答：没学会绕路。\n\n## 349\n\n问：大娃女孩7岁，从小觉得特别漂亮聪明可爱活泼，对任何事物都新鲜好奇，与陌生人相处也非常活泼。小娃男孩，从小觉得长得一般就算了，男孩子毕竟不看颜值。但总感觉什么都慢一拍，尤其跟姐姐对比差距太大。学说话从小特别迟，现在3岁多了只说常用的话，跟着读绘本只能读两个词语，读三个就跟不上。比如我读，塞尔跟着妈妈去山上采蓝莓。他只能说：去山上采蓝莓。父母都上班，白天奶奶一个人带。不喜欢和陌生人相处，到陌生环境就害怕要抱，一直坚决的说不想上幼儿园，打算9月份送。去医院看了说没有自闭症，但还是避免不了焦虑。\n\
    \n担心他的未来。有时候会焦虑的想要不要辞职照顾他，但没确凿理由说服家人和自己，家人说我瞎担心。\n\n答：纯属瞎操心。自闭症症状很明显的。智商越高，开悟越晚。因为他需要通盘理解\
    \ T-1\n\n问：不止智商慢一拍，情商方面也有点奇特。从出生起，就厌恶别人（家人）亲近他，不管亲他，抱他，都是一脸嫌弃和推开。按理母乳喂养应该可以促进母子关系，可是他只有喝奶的时候要妈妈抱在怀里，喝完母乳，就一把推开妈妈，要单独放在床上睡觉。现在大了，可以亲我了，但有条件才行。比如，他要我讲绘本，我说很累没有力气讲，要亲一个才有力气。他就很勉强无奈的说，好吧！火速亲一个，然后说：有力气了，快点讲啊！小孩子们不应该都是从小很粘人的吗？\n\
    \n答：没问题。伟人特质。\n\n## 350\n\n问：接上一个圈友的问题，您说“智商越高，开悟越晚。因为他需要通盘理解 T-1”，我总觉得，苦难只是人生底色，是向上奋进的原动力，但对于普普通通的我们，经历的苦难再多，真正的顿悟也是极小概率的，幸运被高人指点才是最重要的吧？真正标志着一个人开悟的界限又是什么呢？\n\
    \n答：知道自己是 SB。\n\n## 351\n\n问：在得到上学了好多知识，听着有道理的不得了，可就一条大部分和赚钱联系不上，时间一长又忘了大半，是我悟性太差还是犯了方向性错误，求老师指点迷津？\n\
    \n答：把所有道理都忘光，只剩下 T-1。\n\n## 352\n\n问：求明示，屌丝层该怎样教育子女。您说追求真正的知识，现如今我夫妻俩已是水库三观，那么对孩子应该如何投入？目前既没有追求学区房，也没有学英语学钢琴，只是简单熏陶。\n\
    \n答：真正的 T-1，应该是简单清晰，而不是复杂繁琐。只有父母自己掌握 T-1，父母才能传授给子女啊。\n\n## 353\n\n问：我对如何教养小孩产生了极大的怀疑。买学区房学钢琴考一本，然后五千块一个月，都是歧途。甚至多陪伴小孩，似乎也是歧途。应该赚钱，爬阶，用自己积累的优势，给孩子铺好路，然而有的工作对孩子并无帮助，否则祖帅爷的先辈也不会留下“不当穷教书匠”的祖训了。所以要么跳出舒适区重新出发，要么教会孩子用\
    \ t-1 思考，才是最重要的财富吧？\n\n答：每个人的学习能力都是有限的。越是 T-1 的规则，越是精简。则学生单位时间学到的东西越多。\n\n## 354\n\
    \n问：很好奇您的可以称之为家学的不传外人之秘，是自己悟的更多还是家族传下来的更多，您能想明白这么多 T-1 的深层远离，真的是太厉害了~\n\n答：其实第一，第二个路标最宝贵。后面就容易推算了。\n\
    \n## 355\n\n问：你写的哪些篇章有利于提高 T-1 能力?或者那些书？可以推荐下吗?\n\n答：所有的文章，都是都围绕同一套思考体系。\n\n##\
