    # 水库终身学习群


    水库，是一个认识的新大陆。

    我们进入知识框架，不仅学习的是欧神

    的框架更是一种文化，一种精神，帮助了更多人，也成就了更多人。


    进水库体系学习10年，已完成体系如下：

    1. 历时4年完成欧神的水晶室文集，及瑞泽会等号《可控思维框架》等书。

    2. 历时200张，36张PPT欧神投资核心框架内容绘制思维导图，覆盖他的99%95%内容，以及我理解延伸的他者核心认知。

    3. 历时10个月完成，1999到2019年全部投资交易全记录研究学习，且建立2021年全面的新。我2021年19张投资备忘录，2022年是欧神投资备忘录。

    4. 欧神的交易模型：历史到经济哲学到《新产业探索》，如何对行业研究到Nuaqing到投资交易。

    5. 欧神时下（持续研究中）如何，近年以来的核心思想，一直工作欧神MBS文章深度复盘及学习，目前已经15100条阅读，有价110条put，且继续增加13万条。

    6. 欧神投资交易及欧神框架，我根据欧神资源框架总结归纳为10大体系（投资，商业，技术，架构），Lingma+欧神的框架投资的框架3000篇学习。（投资、框架投资），以及他框架的体系。


    8. 重构知识体系，持续打磨，覆盖宏观到微观，地产，商业，技术，投资理念体系，架构，技术，投资，金融资本，生产力模型，行业模型，行业模型及模型，商业人思维，商业模式，架构，模型及模型，商业资本，架构，投资模型，行业模型，资本，架构，投资模型。商业资本，架构，投资模型，行业模型，资本，架构，投资模型，商业资本，架构，投资模型。


