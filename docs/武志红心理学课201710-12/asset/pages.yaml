    有一部电影叫《超脑48小时》，讲的是通过手术将一名死去的特工的记忆，传递到了一个反社会型人格患者的头脑中，这个一直活在混沌的一元世界中的人，开始发现情感是一个多么美妙的东西。我觉得这个电影讲出了一元世界和二元乃至三元世界的不同。


    今天，我们讲了常规的心理疾病分类，明天会讲非常有特色的一种说法，你会发现原来对心理健康及疾病 的理解，可以这么简单。


    # —◆ 今日得到 ◆—


    依照精神分析，心理疾病可以分为三大类：


    +   1. 精神病：最严重的精神疾病，典型症状有幻觉、妄想、怪异行为和怪异想法。从“一元、二元和三元关系”的角度，精神病是活在最原始的一元世界中，他们严重缺乏“别人独立存在”的这个感觉，而把自己的内部想象当成别人的外部现实来对待，失去了现实检验能力，无法和别人建立起关系。


    +   2. 人格障碍：人格障碍患者，是三岁前的养育问题，他们被认为是一岁到三岁间未能得到很好的呵护，他们的人格，也就是自我还没完整形成，因此他们的病情仍相当严重而不容易治愈。人格障碍患者的世界，是介于一元世界和二元世界中，他们明确意识到，别人是独立存在的，但他们还没有对别人产生情感。


    +   3. 神经症：这是最轻级别的心理疾病。神经症患者的世界是介于二元世界和三元世界中，他们意识到我和你是好的，但我爱你的时候，我担心会对第三个人产生伤害。这一类的患者会主动寻求治疗。


    我们要放下一 种认识：并非心理虚弱的人才去找心理医生，主动寻求心理咨询与治疗的人都是能承认自己有问题的，这是心理发展水平比较高的表现。


