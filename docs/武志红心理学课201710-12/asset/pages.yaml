  md: '# 预告：锤炼生命的韧劲


    武志红


    这是我們专栏的第十七周，也是“动力”主题 的第四周，这周的主题是“锤炼生命的 韧劲”。


    前两周讲全能自恋和攻击性，按说这周该 讲“性”的主题了。不过，看到全能自恋和攻 击性的话题引起了很多用户的焦虑，我想 这周临时加一个关于生命韧劲的主题。


    攻击性，容易变成破坏性；全能自恋，讲起 来很迷人，真体验到的时候，更是迷人。但 它非常脆弱，一旦遇到阻碍，一样会有摧 毁欲望产生。有些人的破坏性和摧毁欲望
    指向外界，给其他存在带来了伤害；而更 多人是将破坏性和摧毁欲望指向自己，结 果导致了自己各种脆弱。


    # 人该如何存在？


    这个话题可以用各种方式来论述，而在“动 力”这一章中，我一直试着表达的是让你内 在的能量涌动起来，和外界的各种存在去 碰触、去建立关系，用一生的时间去活出
    这种感觉——带着主体感展开你的生命。


    这个过程是在拿全部的“我”，与全然 的“你”相遇。如果“我”没有展开，那也就无 从知道“你”的存在。


    “用一生的时间去活出自己”，其中的“一 生”这个词看似简单，但实际上它涉及到 一个极其重要的因素——时间感。脆弱的生命 和有韧劲的生命，其中一个重要区别是
    后 者知道有时间 的存在，所以能从一生的 整体角度去看一切，因此有了耐心；而前者 感受不到时间的存在，于是觉得每一个瞬 间的挫败，都像是可以致命一般。


    那些总是活在严重焦虑中的人，真的可以 反思一下，你真的有 时间感这个东西吗？ 你是不是总恨不得立即就把愿望实现， 不 然就会担心这个愿望会被挫败？


    除了时间感，还有空间感，而深藏于其中 的是更深刻的生死感。这三个主题结合在 一起就可以这样来理解：一旦你形成了成 熟的时空感，你就可以通过对时空的掌 握，来驯服你的“生本能”和“死本能”。


    按照惯例，我再发起我们的每周调查。这 周的调查是：你什么时候有了时间的概念？就是说你发现愿望即便在当下不能实 现，但随着时间的积累，因投入的增加，一个特定愿望实现的概率会越来越高。并且，这个概念的形成，立即降低了你的焦
    虑，增强了你的耐心。


    分享一段鲁米的诗：


    > 任何你每天持之以恒在做的事情， 都可以为你打开 一扇通向精神深处， 通向自由的门。


