    # —— 今日得到 ——


    +   1. 全能感或全能自恋的特点是：当一个人受全能自恋驱使时，会觉得自己一无往 前、势如破竹、无所不能，因此思维和行动力都非常厉害，什么都敢想敢做，这推动着他们启动了很多不可思议的东西；可它缺乏理性，非常脆弱，一旦出现一个关键挫败，他们发现自己的全能神是个幻觉，然后会从全能自恋感跌落成彻底无助感，觉得自己什么都不是，也会表现得非常糟糕。


    +   2. 最好的情况是这样的：全能感并没有从你身上消失，而是转换成了更为成熟坚韧的动力，你能够发起一个又一个的愿望，这时你胆大妄为，但在具体实施时，你又有良好的理性和韧劲，让自己能一直推动这件事的发展，事情就会变得很不同。


    +   3. 全能自恋，是一元世界的东西，受它驱使时，你是很有动力，但必然会有严重的自我中心，而对别人有忽略，它的韧劲会是问题；但当你进入了二元世界和三元世界，并没有牺牲你的全能感，而你认识到了世界的复杂性，原初的全能感也变成了更为复杂的攻击性和性
    等生命动力，你的力量没有丧失，而你的心灵变得复杂而成熟。你就能达到那种感觉：世界准备好接受你的本能排山倒海般涌出。这也是人的发展历程。


