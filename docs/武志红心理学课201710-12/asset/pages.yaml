    说到延迟满足，我觉得自己走到了一个极端，比如说买车，买不起的时候想想要，后来刚刚买得起车时，我却不原意买了，心想以后有更多的钱了我再买，可当我的心提前长到五十辆车的时候，我仍然不愿意去买，因为我希望我能买得起100辆的时候再买，这是什么心态呢？是因为内心不安
    车吗？


    # ### 武志红


    很可惜这不是延迟满足的好故事。因为，比起买车来，可能有个东西更能给我们带来满足，那就是现金。


    我在之前讲欧效斯的章次中讲到，我们对待金钱的态度，常常是来自欧效斯对待父母的态度，我认为有这样一个危险，欧根金钱，就像欧根斯的孩子回锅孩子一样的感觉，那种感觉即便有了十亿资产，被丰满的感觉，会给孩子带来充实感和满足感。


    所以，我变得一股入欧洲戏，是在于拿钱去满足其金钱需求，而期望在尼欧根斯心理的人喜欢钱，就是喜欢钱本身。


    # 自我效能感等于同于自信吗？


    # ### 武志红


    自我效能感高的人，肯定自信高，但看起来自信很高的人，未必有高自我效能感。


    自我效能感，更像是个体自信，所以是真实的自信。而自信是有各种各样的表现形式，有些人的自信只是表象，内在很自卑。如果带着带带全能的自信，有时看上去也是很真实的，但没有韧劲也不行，一遇到大的挫败，就会崩溃。


    当痛苦已经远远超过自我承受力，无法再经受任何关系，只能把门门修，在在一个最小的个人空间才能喘息。这种状况怎么办？


    # ### 武志红


    这样的状态，也是一种重要的自我保护方式，可以待它定。


    只是，这样待有的时候，要弄明白这是怎么回事，等觉得可以的时候，再永远走出去。


    我给太多个过度的留学生做过咨询，有几就这样自闭了几个甚至十几 年后，重新走了 出来。不过他们这样做时，他们的父母经过咨询都知道，在外面给孩子提供一个保护和满意
    的满意空间，而此前这些父母基本没做到这一点。孩子内在多了一个稳定性 量，又终于感到外面是安全满意的，然后才能走出去。


    也有些人这样自闭，不是一辈子，人生就被毁了。在封闭的一代世界里，全能自足不断生成成熟的自色能量，而这些黑色能量自然都会转过来击节压制自己，所以太长时间的自闭，是一种恶性循环。


    赞同 人与人，人与环境，真是互为镜子，这可能比，可遇到可怕的东西时，有没有可能会让自己更坏？


    # ### 武志红


    当然也有可能，因为可怕的东西，有可怕的“杀死”你。在肉体的意义上的死亡，也有精神意义上的死亡。


    我得说实话，最近看的这几期专栏感受到的令人难以的痛苦，很多留言都说很痛，让人自然不自然就停，很多留言，原来很多原生家庭 教我的人生原则都是错的。是不是痛苦过后，就是重生了？


    # ### 武志红


    朝闻道，夕死可矣。我不知道你的年龄，从 中间来说，现在在三十许，以后的几十年可以再来自己的人生，岂不快捷了！


    我 想说，这种痛苦就是因为没有时间感 啊。孔子说，人有三种：知而知之，学而知之，固之而学之。他把第一 种人视为至高级，我觉得，好像哪些大师们也都是固知类。比如弗洛伊德，受限于自己的
    恋物主义的心结，提出了俄狄浦斯情结；人本主义心理学家马斯洛，本要孤独至极，后来走了出来，就成为了人际关系大师。


    所以这个道理是很普遍的：痛苦就像死本的一种自我突破，而你为力化智中，并 用它的去 的腰肢，裹和与死亡，最终它们化生本能时，你就变强了。


    现在常常是老人 带孩子，老人家不懂这些，喜欢给孩子喂饭，帮孩子越起代自，但是我下 班回去 都要按按照我的方式自己带孩子。老人家这样对孩子影响大吗？


    # ### 武志红


    我认为当然会有影响，至于影响小程度，就看老人代位做法 的轻重量程度。一般来说，他们只能 自己的，只能接 受一个现实：他们不能用自己的方式带 带孩子。


    但如果可以沟通， 那么在一些 方式上，比如你说的 喂饭上，也可以平和地告诉老人，并且对他们给与足够的尊重与认可。


    当然也可以， 你在一些事情上培养了孩子的自我效能感，孩子那份自 信与活力会非常有感染力，那时候再有事求 老人沟通，会好很多。


    所谓 帮助，就是生命可以拿时间与空间，做生 前事与死前事的转换


