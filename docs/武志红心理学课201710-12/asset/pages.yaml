    攻击性是非常非常宝贵的东西，做心理治疗的精神分析师知道，一个人是否能够修通自己的攻击性，这是一个的源头。弗洛伊德说，一个人必须合理或者象征性地表达自己的攻击性，否则这个人就会生病。为什么这么说呢？无论自恋、性、攻击性都是一样的，我要展开我的生命，我要带着主体感，所谓主体感的感觉，在世界上争取一些东西，活出我的使命，活出我的东西来。而且大家要知道，我要把我展现在这个世界上，其实这个世界上有各种各样的存在，有无数的⼈，还有各种各样其他的动物，或者是这个世界，或者你的事业。


    当你带着一种主体感，强烈的去展开你的动力，展开你的生命。在这个世界丰富的碰撞中，可能就会发生这样的事情，你会发现我和你紧密地结合在一起，我和我相互地照料，这时候你才明白，我就是你，你就是我，我就是万物，万物都是我。这时候你就会深刻地明白到，除我之外，再无其他。但是似乎宇宙又有其切着，但是这一切都必需要建立在这个⼀个基础上，展开你的动力，展开你的生命。如果你不展开你的动力，如果你不展开你的生命，那么一切都不会发生。


    # ——● 连续和断裂 ●——


    连续的事物，我们就会感觉到它像是生的东西，所以我们就会喜欢。而断裂的东西，我们经常感觉像是死的东西，所以我们就会倾向于不喜欢。


    当然我们一直都在活着，我们从生活了几十年，去世甚至上百年，这时候我们觉得死是断裂。死了好像就彻底断裂了。这个生死的感觉会引起很多生命谜题。比如说我们为什么会不喜欢思维？因为你经常能够体验到你的思维是连续的，所以你会觉得思维像是生的东西，但是这些生命动力，自恋、性、攻击、潜意识，你经常体验不到，感知不到。或者说我们说理性是连续的，而感性经常是断裂的，所以你会觉得因为感性是断裂的，倾向于不喜欢感性，特别是对男性来讲。


    当然，这个连续和断裂有很多很多地方。比如说经常是我们主动制造断裂，我和你们之间如何发生了⼀个冲突。冲突叫什么呢？其实就叫做你和我之间出现了死能量。当我兜不住这个死能量的时候，我怎么办呢？或者攻击你，或者攻击我自己，除了这个之外，我还要攻击一个东西，就是攻击我和你的之间的关系。


    关系要起一个特别大的作用，我们把死亡焦虑扔出来，其实我们期待着或者死能够帮我们转化死能量，或者我们能够转化死能量，或者我和你一起来转化这样的东西。


    坏的关系是出现死能量的作用，关系就会往坏的方向走，根本无法修复。好的关系是一旦出现冲突，出现死亡焦虑，两个人能够想办法修复这个东西，结果以至于他们有一段关系出现问题，但是每一次死亡焦虑、每一次冲突都会让这个关系变得更好，这就叫做好的关系。


    一张纸，想象它足够大，这张纸可以不断地折下去，会达到很厚的厚度。如果你在⼀个对的方向上，一直持续地做努力，那么你的努力就会是一个叠加的功能，你的人生就会达到不可思议的高度。


    武志红


    最后总结一下，我们怎么来修练有韧劲的生命呢？我想了三句话：


    +   1. 从一生的长度去看你的事情；

    2. 坚持完整地做好一些事情；

    3. 不管你如何感觉，你的生命都在被锤炼的过程中。


    最后想念一首鲁米的诗：


    > 任何你每天持之以恒在做的事情


    都可以为你


    打开一扇通往精神深处


    通向自由的门


    用这首诗跟大家共勉，希望大家形成不仅是有韧劲的，而且是很幸福的生命。祝福大家！


