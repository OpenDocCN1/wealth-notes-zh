  md: '# 思维11 | 滥好人 和诱惑者


    武志红

    我今天的主题是 “滥好人和诱惑者”，这是第四讲 | 滥好人和诱惑者


    投射性认同有四种，前两天的内容中我们讲了依赖游戏和攻击游戏，今天我们来讲另外两种，迎合游戏和诱惑游戏。


    # 迎合者与依赖


    迎合游戏的主体逻辑是：我这么为你考虑，你必须爱我，否则你就是个坏人，我们不如分手。更直接的表达是，我为你做了这么多，你必须爱我，否则你就是个大坏蛋。


    不过，迎合者和支配者、依赖者、诱惑者不同，迎合者太想做个好人，在关系中很长时间都意识不到自己有威胁性的C信息存在，他们无注意到攻击性存在。


    但是非常可悲的是，迎合者虽然容易被人夸说这个人真好，但他们很难收获深层关系，因为大家和他们相处时会有各种不舒服。因为他们不真实，毕竟带着攻击性的生命力像从他们身上剥离掉一样。也是因为，迎合者特别容易给别人制造负疚感，他们会自觉地使用一些办法，提醒接受者：“你欠我的。”


    迎合者，在我们身边广泛存在，比如配合依赖的强者依赖。我爸爸是个大饭桶，热心的例子。妈妈辛苦地做了饭，等全家人都坐到桌子上时，却发现妈妈自己碗里是一碗剩饭剩菜，她不能装成食物。这个时候，她最容易说出一句冷话，但如果你是一个不能承受内疚的人，那你可能会生出一股恨怒。


    卡什丹在他的著作《客体关系心理治疗》中谈到了这样一个例子：


    > > 玛丽达塔是一个中年单身母亲，有两个10多岁的孩子。她每天开车把孩子上学和放学，当孩子坐车上车后，她会提醒两个儿子钥匙给门上。然而，当孩子试图这样做时，却发现车门已关好。


    这位妈妈在做什么？她为什么多此一举？对此，卡什丹的解释是，这是迎合者的经典行为模式。钥匙门是意识层面的贡献，海瑞图难以此显示，她是一个无所不至的妈妈，而是孩子想去锁车门以泄泄对妈妈的，她渴望孩子希望孩子们发现，妈妈已经做了奉献。


    国内知名的心理学家曾奇峰说过一句非常有趣的话：和在一起时感觉自己很坏，于是我就爱上了你，可是，迎合者有一种，虽然容易收获好感，但你容易觉得自己在他面前那个混蛋，如你不接受这种自我感觉，那好勿必须远离他们。


    默式可能是我们最不愿意面对的一种感觉，尤其是有些人意识到了我原本可以轻松到位的情绪后，还巧妙地地使我们感到默式，这会让我们非常绝望。然而，迎合者不仅在助人时细致入微，还会非常谦卑小心，他们不需要你做些什么，他们只想帮你而已，不需要任何回报，你不必有压力。


    面对这样的人，一开始我们很难表达愤怒，我们甚至会对自己内心的怒气而感到内疚； “我怎么会这么大的生气？” 不过，如果这样的情绪越来越多，你的愤怒会越来越大，以到，
    你可能会向别人表达怒气，来远离这一个迎合者。


    海瑞困的两个儿子就是这样做的，他们成了问题少年，在学校和社会上制造一些麻烦，而这是他们对表达愤怒的代价。这种本来就表现表达表示，妈妈这么好，他们怎么可以生妈妈的气，于是他们拒绝愤怒到别处去了。
    两个孩子为了妈妈的关系越来越疏远，这两种孩子是为了减少妈妈的自己机会，那样就可以少一些默式感了。


    迎合者为什么这样委屈自己？这也是喜欢者为什么钟情依赖，依赖者为什么喜欢依恋的原因。我们都想与别人亲近，但很多人只学会了单一的与别人亲近的方式，支配者学会了权力的方式，依赖者学会了示弱的方式，而迎合者学会了奉献的方式。


    更糟糕的是，因为迎合者只相信迎合的方式，当对方开始远离他时，迎合者在恐慌中会对对方更加执着，但越执着，对方越疏远，由此形成了一种恶性循环，最终迎合者最在乎的关系反而断裂了。


    这就是海瑞困和她两个儿子的互动过程。在也没有改变和她的两个行为方式，她越努力，孩子们就越远离她，不过，迎合者的戏力不是永久有效的。实际上，在迎合者的童年时期，这常常是他们能够靠近父母或其他养育者的唯一方式。


    我见过很多堪称“恩人”的迎合者，其中女性居多，而且他们的父母基本上都是重男轻女，对于这样的女性而言，她们最能亲近父母的方法就是去奉献，为父母或作为兄长。


    我们文化中的迎合者被我称为“中国式好人”，我自心也是一个典型的中国式好人，对此我有非常多的思考，以后我会再仔细讲述，今天先介绍到这里。


    # 性感的投射性认同


    接下来，我们来谈谈投射性认同的第四种，性感的投射性认同， 具体代表我们是他们为诱惑者。性感游戏的具体逻辑是：我如此性感迷人，如有性能量，你当然会喜欢我，否则你就是性无能，我们不如分手。'
