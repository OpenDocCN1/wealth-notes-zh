    接下来，我们再来说说理性这个词。我很喜欢斯多葛哲学的“世界理性”这个说法，不过我不认为人的内在欲望，也就是所谓的非理性，和世界理性是冲突的。从根本上我认为，一个在关系中活出了自己的人，他的一切也就符合了所谓的“世界理性”，如果斯多葛哲学说的这个玩意真存在的话。


    # 今日得到


    +   1. 理性信念，可以理解为洞察到并顺应了世界理性的信念，是个人顺应世界理性；非理性信念则是个人自恋的执念，是个人试图把自己的意志强加在世界之上。通俗地说，非理性信念就是不符合客观现实的想法，理性信念是符合现实的想法。


    +   2. 艾利斯提出的非理性信念可以概括为三类：绝对化要求、过分概括化和糟糕至极。这三类其实可以用全能自恋解释得更为深刻、直接。


