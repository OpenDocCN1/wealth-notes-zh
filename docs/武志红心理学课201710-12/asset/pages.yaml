  md: '所以甚至可以 说是别人的。比起头脑来，身体更靠近你的灵魂，头脑可以被灌输、被蒙骗，但身体很难不忠于自己。如果没有身体的作证，一个道理对你而言就可以说是一个谎言。所以，要和头脑的信条保持距离，学会用各种方式去聆听身体。


