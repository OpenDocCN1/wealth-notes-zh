  md: '+   1. 保护层、感受层和真我，是心灵的三层结构；思维过程、情绪过程和身体过程，是心灵的三种过程。保护层主要针对着思维过程，感受层则针对着情绪过程和身体过程，而真我就是灵魂。


    +   2. 当一个人的身体过程和情绪过程是打开的，他也就能感受到别人的身体过程和情绪过程，它们可以在两个人之间建立链接；而思维过程虽然看似有力量、很可靠，但它不能在两个人之间建立链接。


    +   3. “我与你”的相遇是灵魂层面的关系，它可以超越肉身，但这份超越是先肯定了肉身。但太多的纯粹，很可能并不是进入了灵魂层面，而是持有这种逻辑——头颅是高贵的、身体是鄙俗的，陷入到头脑的心灵捷径中。有些人，特别是有些男性貌似可以很好地活在孤独的思维和逻辑世界里，说起话来很有条理，却常常不能理解别人是怎么回事，容易活得干瘪。愿我们能感觉到：我并不是孤零零地活在这个世界上的一个幽魂，我可以和另一个人感受彼此。


