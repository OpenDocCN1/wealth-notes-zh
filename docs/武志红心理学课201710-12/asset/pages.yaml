  md: '# 复盘: 关于“动力”主题的回顾


    ![](img/b1f130f8dcc22f8708e07351a742fd6f_69_0.png)


    “我们的专栏已经讲述了‘命运’、‘自我’、‘关系’和‘动力’这四大主题。今天我们来对‘动力’这个主题进行一次复盘。


    在“关系”主题的复盘中，我讲了专栏的十三章，一章一个方法，这些方法构成了一个整体。


    所谓关系，就是指指向：所谓动力，就是“我”的“结构”，动力是能量，是情感，是精力的方向。我的表达方式是“自我+动力+客体”，这种结构组成了你的内心。


    我最近常做噩梦，在深度冥梦中，我发现自己内心会浮出一个“消失”的影子。它像一个无底的洞，让你感到恐惧。


    我会这样理解，自我，客体和动力，这三者都是指向性的，它们可以合在一起，也可以分开。当你把三者合在一起的时候，你就变成了一个完整的“动力”系统。


    在这样的情形下，我可以说每个人的动力都是不同的。所以不要轻易指鹿为马、自以为是，要懂得去共情。


    “动力”这一章，我建议大家结合自己的生命经验去阅读。


    这是一个关于全能力的章节，包括自恋、全能自恋、攻击性。


    很多读者反应，这一周的内容比较难懂。


    我建议大家用两周的时间去消化。


    这一周的内容主要讲的是全能力量中的全能自恋部分。


    # ### 心理健康的标准


    在这一个章节中，我们讲述了心理健康关于全能力量的标准。


    全能力量的标准包括：1. 能够感知和表达自我；2. 能够建立和维持客体关系；3. 能够进行自我调节。


    当自体和客体的关系是和谐的，当自体和动力是和谐的，这就是心理健康。


    如果自体和客体的关系是敌对性的，这就是心理健康问题。


    在讲这两种能力中，我提到了一个核心概念：动力。


    动力是一个能量的方向，它指向客体。


    如果把动力从客体身上移开，投射到自己身上，这就是自恋。


    如果把动力指向客体，这就是爱或者恨。


    如果自恋是真实的，这就是成熟自恋。


    如果自恋是虚假的，这就是全能自恋。


    自恋、动力和客体永远都是绑在一起的，所以寻找动力的过程，也是在寻找自体的过程。


    我用了一些案例来说明全能自恋的表现。


    +   - 回顾本周内容

    - 预告：心理健康的标准

    - 动力011 心理疾病的分类

    - 动力021 自恋与恨情

    - 动力031 两种生命力

    - 加餐：人该如何存在？

    - 问答：自体都在寻找客体，客体都在寻找自体


    # ### 全能自恋


    这是我觉得最深刻的部分。我们之前讲过，全能自恋是最高级的自恋。


    全能自恋的核心是全能感，认为自己无所不能。


    全能自恋是动力最纯粹的形式。


