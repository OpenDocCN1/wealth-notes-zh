  md: '2. 用身体去聆听对方的感受的方法是: 我会全神贯注地听对方讲话，同时留一部分注意力在我的身体上，去留意我身体的各种感受以及各种情绪，并通过身体感受和情绪情感，一起去判断对方在向我传递什么信息。这就是有意识地在聆听对方的思维、身体和情绪这三种过程中的信息。思维可以骗人，而身体和情绪不会，所以当能聆听到身体和情绪的信息时，就可以更好地去判断。


    3. 无论是想听到对方的思维，还是情绪与感受，你都需要放下你的自恋，就是放下你的所有预期和目的，这时才可能发生与对方的相遇。如果你在这个过程太着急太自恋，那么你遇到的，就只是你的东西，而不是别人的。


