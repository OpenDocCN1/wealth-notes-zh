  md: '由此可引出一个假设：当能量被看见后，一切能量都可以转化成好的。这个假设可以具体成：可以想象你作为一个能量球，和另外一个生命作为一个能量球，当你们两者之间建立了充分的链接后，你们作为两个能量球，就都被全然照亮了。


    当这种全然照亮的事情发生，两个人就从二元关系进入了一元关系。这种照亮，或者说全然看见，在两个人的二元关系中发生，太难了。但如果把整个世界视为“你”，视为一个客体，那么就可以认为，“我”和“你”这整个外部世界的互动，就是为了被全然照亮这个终极目标。


    在我看来，这就是生命的意义所在。


