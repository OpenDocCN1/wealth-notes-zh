  md: '非常不一样的。


    现实中如果遇到困难又解决不了，思维就会受阻，那就会在情绪层面表达，例如各种负面情绪：愤怒、低落等；如果在情绪层面表达受阻，例如强制自己逃避，那就会在身体表达。这一层一层的关系太奇妙了。如果连身体层面表达受阻是不是就要在灵魂找层面表达呢？


    +   - 武志红


    西方哲学家和心理学家说，真我不可触碰。东方哲学家则说，真我不生不灭、不增不减。所以，真我从理论上讲，是一种根本性的存在。我们要从论到它、接近它，要么远离它、觉知不到它。所以，我一再讲，生命是为了更好地成为自己，而不是成为更好的自己，因为自己就是最好的。这里就是我说的，自己，就是真我。


    真我也被称为大我，而自恋性的自我，则被称为小我。情绪痛苦，是因为小我的自我受到挫折，因为它太不现实了。而证到真我，从小我的自恋幻觉中走出来，情绪痛苦和身体痛苦也许都会消失。这是修行的逻辑，我只是耳闻，不敢说对错。


    身体和情绪的感觉一定要在面对面的接触中才能感受到吗？能不能通过电话或者短信感受到呢？


    +   - 武志红


    当然可以，不然我们为什么看小说时，会容易有那么强烈的共鸣呢，微信、短信中的文字，一样会带来强烈的情绪情感。


    只是，如果只有文字，那就意味着主要是思维过程，在这一文字的身体和情绪要是足够敏感，才能感受到对方更多的身体信息和情绪信息。


    关系、身体、认知是一个递进的关系还是循环的关系？


    +   - 武志红


    在我的理解中，这既是递进的过程，也是循环的过程。关系、身体和认知有各自的独立性，同时也有深刻的彼此影响，同时它们简直又是彼此的镜像，所以从根本上，也许它们是一回事。


    所以有鲁米那首诗：


    > 每一秒钟，他都会对着镜子鞠躬。

    如果有一秒钟，他能从镜子里看出里面有什么，

    那他会爆炸。

    他的想象，他的所有知识，乃至他自己，

    都将消失。他将会新生。


    我感觉自己随着所处的环境和气氛的变化，说话的声音和方式也会改变，表达的欲望也不不一样。当我处在一个陌生的环境，面对一群陌生的人时，我说话的声音会很小，很沉默；当我处在一个熟悉的环境，面对的是自己喜欢的人时，我会很有表达的欲望，并且感觉特别良好。说话的声音大小和气息是不是也属于身体表达？


    +   - 武志红


    这绝对是非常深刻的表达，我写过一篇文章《你对谁发出自己的声音？》你也回应过，就阐释了这个观点。我的微博最近转了这篇文章，感兴趣的用户可以去读读。


