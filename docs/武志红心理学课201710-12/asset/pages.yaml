    # 性的动力


    性是对关系的渴望；性的模式，是一个人在关系模式中的呈现。


    这是我我一直以来对性的理解的总结。


    依照弗洛伊德的理论，性无处不在，看音像书的东西，都是男性生殖器的象征，而像容器一样的东西都是女性生殖器的象征。男人潜意识深处渴望成为“界限之主”，击败所有竞争，占有所有性权力，一旦失败就会变成“伤疤之王”。所以，人性的确是让人类最不安的东西，甚至超过死亡。人类因此要遏制性，或者希望把它升华，而文明就是原始欲望升华的结果。


