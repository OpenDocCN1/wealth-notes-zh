  md: '# 我思故我在？


    这一周，我主要介绍了埃克哈特·托利的两个概念——“向思维认同”和“痛苦之身”。


    向思维认同是一个很微妙但每时每刻都在发生的心理过程：思维对自己内部和外部的事件进行分析、总结和认识，由此形成了一些判断，这时“我”对自己完成的这些判断有了自恋性的认同，然后这些判断就成了自我实现的预言，我们会受认同判断的驱动，而去做事情朝它们预言的方向去推动……


    这不就是一个循环过程吗？它真的不是那么有意思。


    然而，更有问题的是，我们引以为傲的能力，常常是为了处理痛苦的，而一旦我们爱上了自己的思维层面的能力，很容易带来的问题是我们还会去追求制造一些类似的痛苦，作为养料去供养我们的能力。这样一来，我们不仅是陷在循环中，我们还像是受虐狂一样。


    所以，当看到痛苦一再轮回时，我们需要去看看内心有什么钩子，然后试着去抚平它。


    +   ↓ 一键回顾当周内容


    预告：我思故我在？


    +   思维12 | 向思维认同


    +   思维13 | 痛苦之身


    +   思维14 | 抚平你内心的钩子


    问答：怎样做到只接纳生命中的“好”？


    思维的本质是自恋，自恋的本质为了控制，而控制的根本则是因为死亡焦虑。


    如果事情都在“我”的控制之下，那自然会有一个假设是，“我”是不会去“杀死”我自己的，这样我就貌似在最大程度上保证了我的生存。这样做时，一是难以做到，失控必然会不断发生，二是如果真做到时，你就活在一元世界中，然后感觉到致命的孤独。


    所以真正的答案不是自恋和控制，而是能看到这样的一个关系世界：在“我”不能控制的边界之外，有一个善意的“你”存在。既然“你”是善意的，“我”何非要去控制一切，何不让自己处于失控中呢？


    下一章讲“身体”这个主题时，我会讲很多主动让自己处于思维惧怕的失控的故事，那时我们会看到，失控也可以很美。


    当你往下跌落时，你很担心会掉入无尽的黑暗深渊，但其实，你会发现，你会掉入如同大地母亲的怀抱。


    根本的控制，是全能自恋的幻觉：

    “我可以控制这个世界”


    ![](img/b1f130f8dcc22f8708e07351a742fd6f_114_0.png)


    和痛苦对抗，会构成复杂的心理防御机制，就像让自己陷入迷宫


    ![](img/b1f130f8dcc22f8708e07351a742fd6f_114_1.png)


    小心那些你引以为傲的品质，它们多是用来处理痛苦的。太爱它们，就会因滋养它们而重复痛苦。


    ![](img/b1f130f8dcc22f8708e07351a742fd6f_114_2.png)


    穿越痛苦之身，也许就能抵达真我。


