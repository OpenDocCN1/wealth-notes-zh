    +   2. 精神分析有个说法：儿童需要获得这种感觉—母亲或客体可以在他发出攻击后而得以幸存。孩子因为有全能自恋加攻击性，所以天然地认为家里的所有不幸都是他的攻击性导致的结果，从而会压抑自己的攻击性，或者即便释放，也是以破坏性的方式呈现。父母需要特别提醒孩子，家里的这些事情不是他导致的。


