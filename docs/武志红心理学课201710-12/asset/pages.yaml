  md: '# 思维05| 控制信念，在力所能及的范围内奉行


    武志红


    我们今天讲的主题是“认识你的非理性信念”，这是第一讲“控制信念，在力所能及的范围内奉行”。


    上周我们一直在强调，每个人要找到自己的真性，当一个真性还没有得到你的身体的验证时，对你而言就像是有一个谎言。


