  md: '# 预告:心灵的三层结构


    这是我們专栏的第二十周，进入一个新的大主题“思维”，这周的主题是“心灵的三层结构”。


    从这周开始，我们来依次谈谈心灵的三个内容: 思维、身体和情感。


    也许你会想, 难道不应该是身体、心理和灵魂吗? 灵魂这个东西, 科学没法验证, 或者说, 是极难验证, 即便有了验证多数人也拒绝相信, 而情感却无限的内容可以谈。不过,
    在我看来, 情感就是灵魂的证明。


    这一周, 我们先来概括性地谈谈这三者的关系。不过, 我不是从非常大的心理学或者哲学范畴来谈, 而只是从心理咨询与治疗的角度入手来谈这个问题。


