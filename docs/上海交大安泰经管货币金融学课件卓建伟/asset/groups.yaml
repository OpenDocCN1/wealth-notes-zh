    # 法定存款准备金要求


    +   - 1980的《存款机构放松管制和货币控制法》对所有存款性金融机构设定了相同的存款准备金要求

    +   - 支票存款总额低于 4830万美元的部分法定存款准备金率为3%；超过 4830万美元的部分法定存款准备金率为10%

    +   - 美联储可以改变 10%的要求，在8% -14%之间调整'
  - '[PAGE 289]


    # 传统的货币政策工具在金融恐慌的失效


    +   - 当经济经历一场全面的金融危机时，传统的货币政策工具不再有效，原因有两个。

    +   - 首先，金融体系失灵了，无法分配资本的生产性用途，因此投资支出和经济崩溃。

    +   - 第二，对经济的负面冲击会导致零下限问题。'
