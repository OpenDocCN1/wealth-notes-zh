    - 到2014年6月，这些证券的购买导致了美联储资产负债表的扩大了5倍，基础货币增长了377%。\n\n## 量化宽松与货币供给，2007–2014\n\n\
    - 这些贷款和资产购买计划导致了基础货币的巨大扩张，并被赋予了“量化宽松”的名称。\n- 基础货币的增长并没有导致货币供应量的相应变化，因为超额准备金大幅上升。\n\
