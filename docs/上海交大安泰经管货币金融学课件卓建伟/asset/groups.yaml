  - '[PAGE 152]


    # 流动性溢价理论与期限优先理论


    +   - 具有不同期限的利率随着时间的推进会出现相同变动特征；上述公式的第一项为此提供了解释

    +   - 如果短期利率较低，那么收益率曲线通常向上倾斜；而如果短期利率较高，那么收益率曲线更多是反转的；通过第一个事例中的流动性溢价理论以及第二个事例中较低的预期利率平均值对此进行解释

    +   - 收益率曲线通常是向上倾斜的；通过投资者偏好于短期债券，流动性溢价随着债券到期期限的延长而提高对此进行解释'
