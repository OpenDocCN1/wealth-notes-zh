    \ second round of quantitative easing）。美联储发行货币购买财政部发行的长期债券，每个月购买额为750亿美元，直到2011年第二季度，这就是QE2。相反，以中国为代表的新兴经济体2009年之后复苏强劲。2010年底中国CPI为4.6%左右，GDP增速为10.3%，出现明显的经济过热。\n\
