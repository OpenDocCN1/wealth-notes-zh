    \ increase aggregate demand in response ...\n\n## Figure 11 Inflation and Unemployment,\
    \ 1965–1982\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_423_0.png)\n\n## 零下限下的货币政策\n\
    \n- 美联储可以通过降低联邦基金利率来试图降低实际利率。\n- 不过，联邦基金利率是以名义上的，因此不能降到零以下。\n- 联邦基金利率的零下限被称为零下界。\n\
    \n## 用零下限推导总需求曲线\n\n- MP（monetary policy rule, 罗默；Inflation adjustment line, IA曲线，泰勒）曲线通常向上倾斜。\n\
