    \nFigure 3 Credit Spreads During the Great Depression\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_213_0.png)\n\
    \n### 2007-2009 全球金融危机\n\n- 2007-2009 金融危机的起因：\n  - 按揭市场出现金融创新\n    - 次级和Alt-A级住房抵押贷款\n\
    \    - 抵押债权支持证券\n    - 担保债务凭证（CDOs）\n  - 房产价格泡沫形成\n    - 流入美国的现金流量增加\n    - 发展次级抵押贷款市场刺激住房需求和住房价格\n\
    - 危机成因（续）：\n  - 代理问题浮现\n    - 借款者没有动力去披露关于其支付能力的信息\n    - “发起——配售”模式严重受制于委托（投资者）——代理（房产经纪人）问题\n\
    \    - 商业银行和投资银行（以及评级机构）缺少动力去精确评价证券的质量\n  - 信息不对称问题显现\n  - 房地产价格泡沫破裂\n\n**担保债务凭证**（P233）\n\
    \n- 2007-2009 金融危机的影响\n  - 在持续的繁荣之后，房价从2006年开始长期下跌。\n  - 房屋价格的下降导致了抵押贷款拖欠的增加和金融机构资产负债表的恶化。\n\
    \  - 这种发展反过来又导致了影子银行系统的挤兑。\n- 金融危机向全球蔓延Crisis spreads globally\n  - 欧债危机是一个重要标记\n\
