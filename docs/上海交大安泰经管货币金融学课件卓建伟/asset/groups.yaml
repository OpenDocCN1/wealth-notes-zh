  - '[PAGE 259]


    # 推导货币乘数 I


    假设公众意愿持有的现金水平 C 及超额准备金 ER 与支票存款 D 同比例增长那么，

    $c = \{C/D\} = 现金比率$

    $e = \{ER/D\} = 超额准备率$'
  - '[PAGE 260]


    # 推导货币乘数 II


    准备金总额（$R$）等于法定存款准备金（$RR$）和超额准备金（$ER$）之和


    $$R = RR + ER$$


    法定存款准备金总额等于法定存款准备金率乘以支票存款总额


    $$RR = r \times D$$


    用上式替换第一个公式中的 $RR$


    $$R = (r \times D) + ER$$


    美联储制定的 $r$ 小于 1'
