    \ 2004. The data are from 1970-2000 and are gross flows as percentage of the total,\
    \ not including trade and other credit data, which are not available.\n\n## 8个基本谜团\n\
    \n- 1. 对于工商企业而言，股票不是最为重要的外部融资来源\n- 2. 在企业为其经营活动进行融资过程中，发行可流通债务工具和股权证券不是主要的融资方式\n\
    - 3. 与直接融资相比，间接融资的重要性要大得多\n- 4. 金融中介机构，特别是银行是企业外部融资的最重要来源\n\n## 交易成本\n\n- 金融中介机构的经营活动与减少交易成本有关\n\
    \  - 规模经济\n  - 专门技术\n\n## 信息不对称\n\n- 逆向选择是在交易之前产生的\n- 道德风险实在交易之后产生的\n- 代理理论分析了信息不对称问题影响经济行为的运行机制\n\
    \n## 逆向选择：次品车问题\n\n- 如果难以评估质量，那么买主所付的价格所反映的是市场上所有商品的平均质量\n- 优质商品的卖主不愿意按照这一反应平均质量的价格出售其商品\n\
    - 由于市场上剩下的都是劣质商品，所以买主根本就不会购买任何商品\n- 这一问题解释了第2个基本谜团的原因，并且部分解释了第1个基本谜团的原因\n\n##\
    \ 逆向选择：解决办法\n\n- 信息的私人生产和销售\n  - 搭便车问题\n- 旨在增加信息供给的政府监管\n  - 并非总是可以解决逆向选择问题，由此为第5个基本谜团提供了解释\n\
    - 金融中介机构\n  - 能够为第3、4和6个基本谜团提供解释\n- 抵押品和净值\n  - 能够为第7个基本谜团提供解释\n\n## 股权合约中的道德风险问题\n\
    \n- 称为委托——代理问题\n  - 委托人：缺乏信息（股东）\n  - 代理人：拥有更多的信息（经理）\n- 公司所有权和控制权的分离\n  - Managers\
    \ pursue personal benefits and power rather than the profitability of the firm\n\
    \n## 委托——代理问题：解决办法\n\n- 监督（高成本核实行为）\n  - 搭便车问题\n  - 第1个基本谜团\n- 旨在增加信息的政府监管\n \
    \ - 第5个基本谜团\n- 金融中介机构\n  - 第3个基本谜团\n- 债权合约\n  - 第1个基本谜团\n\n## 债务合约中的委托——代理问题\n\
    \n- 借款者具有执行那些违背贷款者（风险）意愿项目的动力\n  - 这会导致借款者无法偿还贷款\n\n## 道德风险：解决方法\n\n- 净值和抵押品\n\
    \  - 激励相容\n- 限制性条款的监督和强制执行\n  - 限制不符合贷款者意愿的行为\n  - 鼓励符合贷款者意愿的行为\n  - 抵押品保值\n \
    \ - 提供信息\n- 金融中介机构\n  - 第3和第4个基本谜团\n\n## 简要小结：表8-1信息不对称问题及其解决方法\n\n| Asymmetric\
    \ Information Problem | Tools to Solve It | Explains Fact Number |\n|---|---|---|\n\
    | Adverse selection | Private production and sale of information | 1, 2 |\n| \
    \ | Government regulation to increase information | 5 |\n|  | Financial intermediation\
    \ | 3, 4, 6 |\n|  | Collateral and net worth | 7 |\n| Moral hazard in equity contracts\
    \ (principal–agent problem) | Production of information: monitoring | 1 |\n| \
    \ | Government regulation to increase information | 5 |\n|  | Financial intermediation\
    \ | 3 |\n|  | Debt contracts | 1 |\n| Moral hazard in debt contracts | Collateral\
    \ and net worth | 6, 7 |\n|  | Monitoring and enforcement of restrictive covenants\
    \ | 8 |\n|  | Financial intermediation | 3, 4 |\n| Note: List of facts:\n1. Stocks\
    \ are not the most important source of external financing.\n2. Marketable securities\
    \ are not the primary source of finance.\n3. Indirect finance is more important\
    \ than direct finance.\n4. Banks are the most important source of external funds.\n\
    5. The financial system is heavily regulated.\n6. Only large, well-established\
    \ firms have access to securities markets.\n7. Collateral is prevalent in debt\
    \ contracts.\n8. Debt contracts have numerous restrictive covenants.\n\n## 转轨国家和发展中国家的信息不对称问题\n\
    \n- 由于下述制度性环境特征形成的“金融抑制”：\n  - 产权体系不完善（无法有效使用抵押品这一工具）\n  - 落后的法律体系（使贷款者难以执行限制性条款）\n\
