    \ EDITION\n\n# Chapter 18\n\n## 货币政策工具\n\n## 预览\n\n- 本章考察美国联邦储备系统用于控制货币供应量和利率的工具\n\
    \n## 学习目标\n\n- 图解准备金市场并证明货币政策工具如何影响联邦基金利率。\n- 总结常规货币政策工具如何实施和每个工具的优缺点。\n- 解释在常规的政策工具不再有效时使用的特殊货币政策工具。\n\
