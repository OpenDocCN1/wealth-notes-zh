    - NAIRU\n  - 通货膨胀率没有变动趋势时的失业率\n\n## 图5 联邦基金利率的泰勒规则，1970 - 2014\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_323_0.png)\n\
    \n来源: 圣路易斯联邦储备银行，FRED数据库: http://research.stlouisfed.org/fred2/.\n\n## MISHKIN\n\
