    - 超额准备金是银行预防存款流出的保障措施\n  - 持有超额准备金的成本,是把这些超额准备金贷放出去所能获得的利率与作为超额准备金可以获得的利率之间的差额，$i_{or}$\n\
    \n## 准备金市场的需求\n\n- 2008年秋季开始，美联储开始对准备金存款支付利息,利率等于联邦基金利率目标减去一个固定的值.\n- 当联邦基金利率高于超额准备金的收益率$i_{er}$时,随着联邦基金利率的降低,持有超额准备金的机会成本下降，准备金的需求上升\n\
    - 向下倾斜的需求曲线在$i_{or}$处变得平坦(无限弹性)\n\n## 准备金市场的供给\n\n- 两个组成部分：非借入准备金和借入准备金\n- 向美联储借款的成本是贴现率\n\
    - 从其他银行借入联邦基金可以替代向美联储的借款\n- 如果 $i_{ff} < i_d$，银行不会向美联储借款，借入准备金为 0\n- 供给曲线是一条垂线\n\
    - 随着 $i_{ff}$ 上升直至超过 $i_d$，银行将按照 $i_d$ 尽可能多地借入资金，并以 $i_{ff}$ 的利率再借出\n- 供给曲线在 $i_d$\
    \ 处变得很平坦（完全弹性）\n\n## 图 1  准备金市场的均衡\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_274_0.png)\n\
    \nWith excess supply of reserves, the federal funds rate falls to i_ff*.\n\nWith\
    \ excess demand for reserves, the federal funds rate rises to i_ff*.\n\n## 影响联邦基金利率（续）\n\
    \n- 如果准备金的供给曲线与需求曲线相交于供给曲线的垂直部分，贴现率的变化对联邦基金利率没有任何影响\n- 如果准备金的供给曲线与需求曲线相交于供给曲线的水平部分，贴现率的变化会使供给曲线的水平部分发生位移，联邦基金利率可能上升也可能下降，上升还是下降取决于贴现率的变动方向\n\
    - 当美联储提高法定存款准备金率时联邦基金利率上升，当美联储降低法定存款准备金率时联邦基金利率下降\n\n## 图 2 公开市场操作的影响\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_277_0.png)\n\
    \n**Step 1.** An open market purchase shifts the supply curve to the right …\n\
    \n**Step 2.** causing the federal funds rate to fall.\n\n**(a) Supply curve initially\
    \ intersects demand curve in its downward-sloping section**\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_277_1.png)\n\
    \n**Step 1.** An open market purchase shifts the supply curve to the right …\n\
    \n**Step 2.** but the federal funds rate cannot fall below the interest rate paid\
    \ on reserves.\n\n**(b) Supply curve initially intersects demand curve in its\
    \ flat section**\n\n## 图4 法定存款准备金率变动的影响\n\nStep 1. Increasing the reserve requirement\
    \ causes the demand curve to shift to the right . . .\n\nStep 2. and the federal\
    \ funds rate rises.\n\n## 图5. 准备金利率变动的影响\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_280_0.png)\n\
    \nStep 1. A rise in the interest rate on reserves from i_or^1 to i_or^2 ...\n\n\
    Step 2. leaves the federal funds rate unchanged.\n\n(a) initial i_ff^1 > i_or^1\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_280_1.png)\n\nStep 1. A rise in the\
