    - 随后，我们将运用上述分析框架来解释包括最近发生的全球金融危机在内的全世界范围内数次金融危机的产生过程。\n\n### 学习目标\n\n- 金融危机的定义\n\
    - 了解金融危机三个阶段的特质\n- 描述2007—2009年全球金融危机的原因和结果\n- 总结2007—2009年全球金融危机对监管方面带来的影响和变化\n\
    - 了解当下金融监管的缺口以及对未来的影响\n\n### 什么是金融危机？\n\n金融摩擦：信息不对称加剧，表现出对资本高效配置的阻碍，即无法有效地将资金从储蓄者转移到那些具有生产性投资机会的居民和企业手中，导致经济活动减少。\n\
    \n当完善的金融市场信息系统瓦解，并导致金融摩擦大幅增加同时金融市场无法正常运转，金融危机将爆发。同时，经济活动将会急剧紧缩。\n\n### 金融危机发展的几个阶段\n\
    \n- 第一阶段：金融危机的爆发\n  - 信贷泡沫及其毁灭\n  - 资产价格泡沫及其破灭\n  - 不确定性上升\n- 第二阶段：银行危机\n- 第三阶段：债务紧缩\n\
    \n图12-1 美国金融危机中的事件顺序\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_210_0.png)\n\n\
    ### 金融危机的典型案例：大萧条\n\n在大萧条期间，金融危机是如何发生的，以及它如何导致美国历史上最严重的经济衰退？\n\n主要事件：\n\n- 股市崩盘\n\
    - 银行恐慌\n- 债务紧缩\n\nFigure 2 Stock Price Data During the Great Depression Period\n\
