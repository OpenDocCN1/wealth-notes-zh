    \n- 1. 具有不同期限的利率随着时间的推进呈现出相同的变动特征\n- 2. 如果短期利率较低，那么收益率曲线通常向上倾斜；而如果短期利率较高，那么收益率曲线更多是向下倾斜的，即反转的收益率曲线\n\
    - 3. 收益率曲线通常是向上倾斜的\n\n## 解释这三个事实的三种理论\n\n- 1. 预期理论能够解释前面两个事实，但是无法解释第三个事实\n- 2.\
