    Indirect Finance


    +   - Conclusion:

    +     - Financial intermediaries allow “small” savers and borrowers to benefit
    from the existence of financial markets.'
  - '[PAGE 45]


    # 金融中介机构的功能：间接融资


    +   结论：

    +   - 金融中介机构能够使得小额储蓄者和借款者能够从现存的金融市场中获利。因为金融中介机构能够提供流动性服务、发挥风险分担的作用以及解决信息不对称的问题，从而使得小额储蓄者和借款者能够从现存的金融市场中获利，所以它们在经济生活中发挥了重要的作用。'
