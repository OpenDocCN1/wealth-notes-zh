    Step 2. decreasing output and inflation.


    Step 3. Autonomous easing of monetary policy shifts the aggregate demand curve
    back to AD₁ and the economy returns to long-run equilibrium, with inflation stabilized
    at π*.


    ## 对永久性供应冲击的反应


    - 对永久性供应冲击有两种可能的政策反应：

    - 不应对政策

    - 稳定通货膨胀政策


    ## 图3 永久性供应冲击：不应对应策


    Step 3. the economy returns to long-run equilibrium, with output failing and inflation
    rising.


    Step 2. and the short-run aggregate supply curve shifts upward until ...


    Step 1. A permanent negative supply shock shifts the long-run aggregate supply
    curve leftward ...


    ![](img/a21e92e825486cd1c3cd05a9b06cd2e8_407_0.png)


    ## 对临时供应冲击的反应


    - 当供应冲击是暂时的，政策制定者在稳定通货膨胀和经济活动之间面临短期的权衡。

    - 决策者可以以三种可能的方式对临时供应冲击作出反应：

    - 不应对政策

    - 在短期内稳定通胀政策

    - 在短期内稳定经济活动政策


