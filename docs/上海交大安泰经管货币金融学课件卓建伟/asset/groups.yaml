    # 传统的货币政策工具


    +   - 在正常情况下，美联储使用货币政策的三个工具 —— 公开市场操作，贴现贷款，和准备金制度 —— 实现对货币供应量和利率水平的控制，而这些被称为传统的货币政策工具（三大法宝）。'
  - '[PAGE 284]


    # 公开市场操作


    +   - 主动型公开市场操作（主动变动存款准备金和基础货币水平）

    +   - 防御型公开市场操作（被动抵消其他影响存款准备金和基础货币水平）

    +   - 一级交易商

    +   - TRAPS（交易室自动处理计算机系统）

    +   - 回购协议

    +   - 再买回交易'
  - '[PAGE 285]


    # 公开市场操作的优点


    +   - 美联储能够完全控制交易的规模

    +   - 操作灵活而且精确

    +   - 具有可逆性,易于反向操作

    +   - 可以快速执行'
  - '[PAGE 286]


    # 贴现政策


    +   - 贴现窗口

    +   - 一级信贷：经常性贷款便利（优质银行100bp）

    +     - 伦巴第贷款便利

    +   - 次级信贷（困难银行，利率再加50bp）

    +   - 季节性信贷（有取消倾向）

    +   - 作为最后贷款人防止金融恐慌的发生

    +     - 产生道德风险问题'
