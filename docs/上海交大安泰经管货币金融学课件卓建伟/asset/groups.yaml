    \n## 非常规货币政策工具之三\n\n- 前瞻指引和未来政策行动承诺：流动性供给、资产购买以及未来货币政策行动承诺。\n\n## 图 7 联邦资产负债表的扩张，2007-2014\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_295_0.png)\n\n## 欧洲中央银行货币政策工具\n\n-\
    \ 公开市场操作\n  - 主要再融资操作\n    - 每周的反向交易\n  - 长期再融资操作\n- 向银行发放贷款\n  - 边际贷款便利/边际贷款利率\
    \ 边际贷款便利/边际贷款利率（类似美联储贴现贷款，利率一般比目标利率高100点）\n  - 存款便利（商业银行存入央行的资金，利率比目标利率低100点）\n\
    - 法定存款准备金要求\n  - 将支票存款及其它短期存款的2%作为准备金存放于中央银行\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_298_0.png)\n\
    \nMISHKIN\n\n《货币、银行与金融市场的经济学》\n\n商学院版\n\n第四版\n\n## 第19章\n### 货币政策的实施：战略与策略\n\n\
    ## 预览\n\n- 本章考察货币政策的目标，然后提出货币政策最重要的战略之一——通货膨胀目标制。\n\n## 学习目标\n\n- 定义和识别名义锚的重要性。\n\
    - 确定货币政策制定者可能追求的六个潜在目标。\n- 总结层级使命和双重使命之间的区别。\n- 比较并对比通货膨胀目标制的优缺点。\n- 分析美联储货币政策战略随时间发生的关键变化。\n\
    - 列出全球金融危机的四个教训，并讨论它们对通货膨胀目标制的意义。\n- 总结支持与反对中央银行对资产泡沫政策反应的论点。\n- 描述并评价选择一种政策工具的四个标准。\n\
    - 解读并评估作为假设性政策工具的泰勒规则对制定联邦基金利率的表现。\n\n## 价格稳定目标与名义锚\n\n- 在过去几十年中，全世界的决策者越来越认识到通货膨胀的社会和经济代价，更加关注将物价水平稳定作为经济政策的目标。\n\
    - 名义锚的作用：名义变量（例如通货膨胀率或货币供应量）将价格水平与实现价格稳定的目标联系在一起。\n- 时间不一致问题。\n\n## 货币政策的其它目标\n\
    \n5个其他货币政策目标常被提及：\n\n1. 高就业率和产出稳定性\n2. 经济增长\n3. 金融市场稳定\n4. 利率稳定\n5. 外汇市场稳定\n\n\
    ## 物价稳定应该是货币政策的首要目标吗？\n\n- 层级使命与双重使命：\n  - 层级使命：在首要目标（如物价稳定）的前提下完成其他目标。\n  - 双重使命：有两个平等的政策目标，如美联储的物价稳定和充分就业。\n\
    - 物价稳定作为货币政策首要的长期目标：\n  - 物价稳定和自然失业率之间长期来看并不存在矛盾。如果过度关注短期表现，就会产生层级使命与双重使命的偏向；如果把物价稳定作为长期而非短期内的首要目标，无论哪种类型的任务模式都是可以接受的。\n\
    \n## 通货膨胀目标制 I\n\n- 公布中期通货膨胀率的目标数值。\n- 将物价稳定作为首要和长期的货币政策目标，使之成为一种制度性的承诺，并承诺实现这种通货膨胀治理目标。\n\
    - 使用信息综合方法，即在制定货币政策时使用许多变量。\n- 提高货币政策战略的透明度。\n- 明确中央银行在实现通货膨胀目标过程中所担负的责任。\n\n\
    ## 图 1 新西兰、加拿大和英国的通货膨胀率与通货膨胀目标，1980 - 2014\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_306_0.png)\n\
    \n## 通货膨胀目标制 III\n\n- 优点：\n  - 减少时间不一致问题\n  - 增加透明度\n  - 增加责任约束\n  - 与民主原则的一致性\n\
    \  - 政策表现良好，实行通货膨胀目标制的国家物价水平普遍较低。\n- 缺点：\n  - 信号迟滞\n  - 过于僵化\n  - 增加产出波动的潜在可能\n\
    \  - 缓慢的经济增长\n\n"
