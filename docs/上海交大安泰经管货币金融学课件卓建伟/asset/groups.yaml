    ## 美联储内部：美联储该为房价泡沫负责吗？\n\n- 一些经济学家认为，美联储在2003-2006 时期的低利率政策导致了房价泡沫。\n- 泰勒认为，低的联邦基金利率导致了低抵押贷款利率，刺激了住房需求，并鼓励了次级抵押贷款的发放，这两者都导致了房价上涨和泡沫。\n\
    - 美联储主席伯南克反驳了这一观点，他说，罪魁祸首是创新抵押贷款产品的激增，降低了抵押贷款的支付，放宽了贷款标准，使更多的购房者进入了房地产市场，资本来自新兴市场国家的资金流入。\n\
    - 关于货币政策是否支持房价泡沫的争论一直持续到今天。\n\n## 全球：欧洲主权债务危机\n\n- 在2007-2009 金融危机之后，预算赤字的增加导致了对政府违约和利率飙升的担忧。\n\
    - 从希腊开始的主权债务债务转移到了爱尔兰、葡萄牙、西班牙和意大利。\n- 这种和相关事件造成的压力继续威胁着欧元的生存能力。\n\n## 2007-2009\
    \ 全球金融危机\n\n- 2007-2009 金融危机的高潮\n  - 2008年秋季，股市崩盘的速度加快，本周从2008年10月6日开始，显示出美国历史上最糟糕的每周跌幅。\n\
    \  - 借款人面临的利率飙升导致消费支出和投资大幅下降。\n  - 失业率达到自二战以来最大的衰退，超过了10% 的水平。\n\n## 图6信用利差与2007-2009年金融危机\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_226_0.png)\n\n## 2007–2009 全球金融危机\n\
    \n- 政府干预与复苏\n  - 由于政府和中央银行的干预，经济衰退的规模远远小于大萧条。\n  - 陷入困境的资产救助计划（TARP）是布什政府2008年10月通过的《紧急经济稳定法案》中最重要的条款，授权财政部动用7000亿美元购买次级抵押贷款资产，向金融机构注资。\n\
    \n## 金融监管方面的应对\n\n- 宏观审慎监管与微观审慎监管\n- 2010年的多德-弗兰克华尔街改革与消费者保护法案\n  - 消费者保护\n  -\
    \ 清算授权\n  - 系统性风险监管\n  - 沃尔克法则\n  - 衍生品\n\n## 未来监管的其他问题\n\n- 金融服务业的薪酬\n- 政府赞助企业\
    \ (GSEs) P242\n- 信用评级机构\n- 过渡监管的危险\n\n## 新兴市场经济体中金融危机的发生机制\n\n- 第一阶段：金融危机的起始\n\
