    \ Step 2. leading to a rise in inflation and a fall in output.\n\n> Step 3. Autonomous\
    \ easing of monetary policy shifts the AD curve rightward.\n\n> Step 4. Output\
    \ has stabilized at potential, but inflation is higher than the target level.\n\
    \n## 底线：稳定通货膨胀与稳定经济活动的关系\n\n我们可以从上面的分析中得出以下结论：\n\n- 1. 如果对经济的冲击是总需求冲击或永久性总供给冲击，那么稳定通货膨胀的政策也将稳定经济活动，即使是在短期内亦如此。\n\
    - 2. 如果更多的是表现为临时供应冲击，那么中央银行必须在短期内选择两个稳定目标之一。\n- 3. 从长期来看，稳定通货膨胀和经济活动在应对冲击方面没有冲突。\n\
    \n## 时滞与政策实施\n\n- 几个类型的时滞阻止政策制定者即时改变总需求曲线：\n  - **数据时滞**：政策制定者获取经济正在发生变化数据的时间。\n\
    \  - **认识时滞**：政策制定者为确定数据在未来经济发展过程中的趋势所花费的时间。\n  - **立法时滞**：通过立法实施特定政策所需的时间。\n\
    \  - **执行时滞**：政策制定者一旦决定新政策，就需要改变政策工具的时间。\n  - **作用时滞**：政策对经济产生实际影响所需的时间。\n\n##\
    \ 关于奥巴马财政刺激计划，相机抉择和非相机抉择的争论\n\n- 许多相机抉择者辩称，政府需要通过实施大规模的财政刺激方案来做更多的事情。\n- 另一方面，非相机抉择者反对财政刺激方案，认为财政刺激计划要花很长时间才能奏效，因为存在长期的执行时滞。\n\
    - 奥巴马站在了相机抉择者一边。\n\n## 通货膨胀：无论何时何地都是一种货币现象\n\n- 米尔顿·弗里德曼这句名言得到了总需求和总供给分析的支持，证明了货币政策制定者可以通过自主性货币政策移动总需求曲线达到任意设定的长期目标通胀率。\n\
    \n## 图8 目标通胀率的上升\n\nStep 2. and inflation rises to the new, higher target.\n\n\
    Step 1. Autonomous monetary policy easing shifts the AD curve to the right, and\
    \ over time, the short-run aggregate supply curve shifts upward ...\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_418_0.png)\n\
    \n## 通货膨胀货币政策的根源\n\n- 高就业目标和通货膨胀：\n  - 成本推动型通胀 主要由暂时的负面供应冲击，或者是工人推动加薪超过了生产率上涨的合理性。\n\
    \  - 需求拉动型通胀 政策制定者追求增加总需求的政策的结果。\n\n## 图9 成本推动型通货膨胀\n\nInflation Rate, π\n\nAggregate\
