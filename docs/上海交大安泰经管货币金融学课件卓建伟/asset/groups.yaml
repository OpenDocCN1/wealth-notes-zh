    ```\n\n股权回报率：每一美元股权（银行）资本的税后净利润\n\n```\nROE = 税后净利润 / 股权资本\n```\n\n资产回报率和股权回报率之间的关系可以表述为：\n\
    \n股本乘数：每一美元股权资本所对应的资产数额\n\n```\nEM = 资产 / 股权资本\n```\n\n```\n税后净利润 / 股权资本 = 税后净利润\
    \ / 资产 × 资产 / 股权资本\n```\n\n```\nROE = ROA × EM\n```\n\n## 资本充足性管理：安全性\n\n- 银行资本使得银行股东们的投资更为安全，从而使他们由此受益\n\
    - 由于银行资本越多，股权回报率就越低，所以银行资本金也是有代价的\n- 两者之间的选择取决于整体经济的状态和市场信心的水平\n\n## 银行资本管理战略\n\
