    \ Y 的水平将保持在充分就业水平。\n\n- 两边除以 $\\bar{Y}$ ， 等式可以写成如下：\n\n$P = \\frac{M \\times \\\
    bar{V}}{\\bar{Y}}$\n\n## 数量论与通货膨胀\n\n- (x × y) 中的百分比变化 = (x 的百分比变化) + (y 的百分比变化)\n\
    - 利用这一数学事实，我们可以改写的交换方程如下：\n\n%ΔM + %ΔV = %ΔP + %ΔY\n\nπ = %ΔP = %ΔM + %ΔV − %ΔY\n\
    \nπ = %ΔM − %ΔY\n\n## 图1 通货膨胀与货币增长之间的关系\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_333_0.png)\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_333_1.png)\n\n*来源:* 对于图(a)，Milton Friedman\
    \ 和 Anna Schwartz，《1867–1975年美国和英国的货币趋势：其与收入、价格和利率的关系》；圣路易斯联邦储备银行，FRED数据库: http://research.stlouisfed.org/fred2/.\
    \ 对于图(b)，《国际金融统计》。国际货币基金组织，http://www.imfstatistics.org/imf/.\n\n## 图2 1965–2015年美国通货膨胀和货币增长率\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_334_0.png)\n\n来源: 圣路易斯联邦储备银行，FRED数据库:\
