  md: "\n## 图7 对短期供给冲击的响应：稳定经济活动的货币政策\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_412_0.png)\n\
    \nInflation Rate, π\n\nLRAS\n\nAggregate Output, Y\n\n> Step 1. A temporary negative\
