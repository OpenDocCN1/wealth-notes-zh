    | 货币供给量 | ↑ | Mˢ ↑ | ↓ |\n\n*注：表中只显示了变量的增加。变量减少对需求变动的影响与其余各列所示相反。*\n\n### 其他条件会保持不变么？\n\
    \n- 根据流动性偏好理论将会得出这样的结论：货币供应量的上升将会促使利率下降：流动性效应\n- 由于货币供应量的提高将会对于整体经济产生扩张性影响，所以其收入效应将会导致利率的上升（需求曲线向右方移动）\n\
    - 物价水平效应是指作为对于物价水平提高的反应，货币供应量的提高将会导致利率的上升（需求曲线向右方移动）\n- 预期通货膨胀效应是指由于货币供应量的提高将会导致人们未来预期通货膨胀率的提高，从而将会导致利率的上升（需求曲线向右方移动）\n\
    \n### 物价水平效应和预期通货膨胀效应\n\n- 今天暂时的货币供应量增长能够导致物价水平在下一年之前上涨到一个永久的较高水平。利率也将会由于物价水平上涨的影响而提高\n\
    - 即使在物价停止上涨之后，物价水平效应依然存在\n- 由于人们将会预期下一年的通货膨胀率将会更高，所以物价水平的持续提高将会提高利率。在物价水平停止上升的情况下，对于通货膨胀率的预期值将会回落至零点\n\
    - 只有在物价水平持续提高的情况下，预期通货膨胀效应才会持续\n\n### 图5-11 随着时间推移，提高货币供应量增长率产生的影响\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_124_0.png)\n\
    \n### 图12 货币增长率（M2，年率）与利率（三个月期国库券），1950–2014\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_125_0.png)\n\
    \n资料来源：圣路易斯联邦储备银行 FRED 数据库：http://research.stlouisfed.org/fred2\n\n米什金\n《货币、银行与金融市场的经济学》\n\
    商学院版\n第四版\n\n## 第6章 利率的风险和期限结构\n\n### 利率的风险结构\n\n期限相同的债券具有不同的利率是因为：\n\n- 违约风险\n\
    - 流动性\n- 所得税因素\n\n### 图1 长期债券收益率，1919–2014\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_128_0.png)\n\
    \n资料来源：美国联邦储备系统理事会，《银行与货币统计》，1941–1970；圣路易斯联邦储备银行 FRED 数据库：http://research.stlouisfed.org/fred2\n\
    \n"
