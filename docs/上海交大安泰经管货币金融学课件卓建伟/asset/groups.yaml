    \n- 第二阶段：货币危机\n  - 银行资产负债表情况的恶化诱发货币危机：\n    - 政府不能够提高利率（这样做会迫使银行倒闭）......\n  \
    \  - ......投机者预计会出现贬值情况\n  - 严重的财政失衡诱发货币危机的运行机制：\n    - 国内外投资者抛售该国货币\n\n## 新兴市场经济体中金融危机的发生机制\n\
    \n- 第三阶段：全面金融危机\n  - 以本币计值的债务负担加重（净值降低）\n  - 预期发生和实际发生的通货膨胀将会减少公司的现金流\n  - 银行破产的可能性提高：\n\
    \    - 个人的债务能力降低（资产价值降低）\n    - 以外币计值的债务水平提高（负债价值提高）\n\n## 1997-1998年东亚金融危机\n\n\
    - **20世纪90年代初期的金融自由化：**\n  - 信贷激增，同时缺乏监管和专门技术\n  - 银行积累了大量坏账，其净值降低\n- 不断提高的不确定性（股票市场下跌和主要大新企业的破产）\n\
    - **1997年的本币贬值**\n- 实际的和预期的通货膨胀率提高\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_236_0.png)\n\
    \n## 17章\n\n## 货币供应过程\n\n## 货币供给过程中的参与者\n\n- 中央银行（联邦储备体系）\n- 银行（存款类金融机构；金融中介）\n\
    - 存款者（个人和机构）\n\n## 联邦储备体系的资产负债表\n\n| 联邦储备体系 |  |  |\n|---|---|---|\n| 资产 | 负债\
    \ |  |\n| 政府债券 | 流通中现金 |  |\n| 贴现贷款 | 准备金 |  |\n\n- 货币性负债\n  - 流通中现金: 社会公众手中的货币数量\n\
    \  - 准备金: 商业银行在美联储的存款和库存现金\n- 资产\n  - 政府债券: 美联储持有政府债券会影响货币供给，同时获得利息\n  - 贴现贷款:\
    \ 为商业银行提供准备金，同时按照贴现利率收取利息\n\n## 基础货币\n\n## 基础货币\n\nMB = C + R\n\nC = 流通中现金\n\n\
    R = 银行体系中的准备金总额\n\n## 向非银行公众进行的公开市场购买 I\n\n| 银行体系 |  |\n|---|---|\n| 资产 | 负债 |\n\
    | 准备金 +$100 | 支票存款 +$100 |\n\n| 联邦储备体系 |  |\n|---|---|\n| 资产 | 负债 |\n| 证券 +$100\
    \ | 准备金 +$100 |\n\n- 向美联储出售债券的个人将得到的美联储的支票存入银行\n- 结果和向银行进行的公开市场购买的最终结果相同\n\n##\
    \ 向非银行公众进行的公开市场购买 II\n\n| 非银行公众 |  |  |\n|---|---|---|\n| 资产 | 负债 |  |\n| 证券 |\
    \ -$100 |  |\n| 现金 | +$100 |  |\n\n| 联邦储备体系 |  |  |\n|---|---|---|\n| 资产 | 负债\
    \ |  |\n| 证券 | +$100 | 流通中现金 | +$100 |  |\n|  |  |  |  |\n\n- 向美联储出售债券的个人将美联储的支票兑现\n\
    - 准备金没有变化\n- 流通中现金增加，增加的数量等于公开市场购买的金额\n- 基础货币增加，增加的数量等于公开市场购买的金额\n\n## 公开市场购买：小结\n\
    \n- 公开市场购买对准备金的作用，取决于债券出售人将所得的款项以现金形式持有还是以银行存款的形式持有\n- 公开市场购买总是会导致基础货币增加，增加额等于公开市场购买的金额\n\
    \n## 公开市场出售\n\n| 非银行公众 |  |  |\n|---|---|---|\n| 资产 | 负债 |  |\n| 证券  +$100 | \
    \ |  |\n| 现金  -$100 |  |  |\n\n| 联邦储备体系 |  |  |\n|---|---|---|\n| 资产 | 负债 |  |\n\
    | 证券  -$100 | 流通中现金  -$100 |  |\n|  |  |  |\n\n- 减少了基础货币，减少额等于公开市场出售的金额\n- 准备金保持不变\n\
    - 相比对准备金的影响，公开市场操作对基础货币的影响更具确定性\n\n"
