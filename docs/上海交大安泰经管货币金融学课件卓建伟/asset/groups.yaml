    - 在这种情况下，当零下限问题出现时，中央银行必须转向非常规货币政策。\n\n## 非常规货币政策与量化宽松的应用\n\n- 非常规货币政策采取三种形式：\n\
    \  1. 流动性注入\n  2. 资产购买\n  3. 前瞻指引\n\n## Figure 14 提升通胀预期的措施\n\nInflation Rate,\
