    \n货币流通速度和交易方程式：\n\nM = the money supply\nP = price level\nY = aggregate output\
    \ (income)\nP × Y = aggregate nominal income (nominal GDP)\nV = velocity of money\
    \ (average number of times per year that a dollar is spent)\nV = P × Y / M\nEquation\
    \ of Exchange\nM × V = P × Y\n\n## 货币数量理论\n\n- 从交易方程式到货币数量论：\n  - 费雪的观点是，货币流通速度在短期内是相当恒定的，因此，交易方程式可以转化为货币的数量理论，其中规定名义收入（支出）仅由货币数量的变动决定。\n\
    \n$P \\times Y = M \\times \\bar{V}$\n\n## 数量理论与价格水平\n\n- 由于古典经济学家（包括费雪）认为工资和价格是完全弹性的，他们认为在正常时期，经济生产的总产出\
    \ Y 的水平将保持在充分就业水平。\n\n- 两边除以 $\\bar{Y}$ ， 等式可以写成如下：\n\n$P = \\frac{M \\times \\\
    bar{V}}{\\bar{Y}}$\n\n## 数量论与通货膨胀\n\n- (x × y) 中的百分比变化 = (x 的百分比变化) + (y 的百分比变化)\n\
    - 利用这一数学事实，我们可以改写的交换方程如下：\n\n%ΔM + %ΔV = %ΔP + %ΔY\n\nπ = %ΔP = %ΔM + %ΔV − %ΔY\n\
    \nπ = %ΔM − %ΔY\n\n## Figure 1 Relationship Between Inflation and Money Growth\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_333_0.png)\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_333_1.png)\n\
    \n*Sources:* For panel (a), Milton Friedman and Anna Schwartz, *Monetary Trends\
    \ in the United States and the United Kingdom: Their Relation to Income, Prices,\
    \ and Interest Rates, 1867–1975*; Federal Reserve Bank of St. Louis, FRED database:\
    \ http://research.stlouisfed.org/fred2/. For panel (b), *International Financial\
    \ Statistics*. International Monetary Fund, http://www.imfstatistics.org/imf/.\n\
    \n## Figure 2 Annual U.S. Inflation and Money Growth Rates, 1965–2015\n\n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_334_0.png)\n\
    \nSources: Federal Reserve Bank of St. Louis, FRED database: http://research.stlouisfed.org/fred2/.\n"
  mdcn: "\n\n## 美联储货币政策战略的演进\n\n- 在全球金融危机爆发之前，美国已经取得了出色的宏观经济表现（包括低和稳定的通货膨胀），而没有使用明确的名义锚定，例如通货膨胀目标。\n\
    - 演变历史：\n  - 1975年美联储开始公开宣布货币供给量增长的目标\n  - 保罗·沃尔克（1979）更关注非借入准备金的数量\n  - 格林斯潘在1993年7月公开声明，美联储不再使用任何货币总量目标作为货币政策执行的导向\n\
    \n- 不存在表现为联邦储备体系视为高于一切的任务的显性名义锚\n- 货币政策要具有前瞻性并采取周期性的“先发制人”的策略\n- 目标是在通货膨胀刚刚出现苗头时就及时加以抑制\n\
    \n## 带有隐性名义锚的货币政策\n\n- 优点\n  - 使用多种来源的信息\n  - 避免了时间不一致性问题\n  - 现实证明的成功\n- 缺点\n\
    \  - 缺乏透明度和问责机制\n  - 强烈依赖于掌握中央银行大权的个人的偏好、技术和信誉\n  - 与民主原则不相一致\n\n## 伯南克对通货膨胀目标制的主张\n\
    \n- 增加美联储货币政策目标的透明度\n- 朝通货膨胀目标制方向的改变\n\n## 全球金融危机对货币政策战略的启示\n\n- 1. 金融部门的发展对经济活动的影响比以前更大。\n\
    - 2. 利率的零下限可能是一个严重的问题。\n- 3. 清理费用很高\n- 4. 价格和产出稳定不保证金融稳定。\n\n## 金融危机对通货膨胀目标制的影响\n\
    \n- 通货膨胀目标水平\n  2%还是4%，与实际利率、零下限问题\n- 通货膨胀目标制的灵活性\n\n## 中央银行应该对泡沫做出反应吗？\n\n- 有观点强烈主张不应该对单纯由非理性繁荣驱动的泡沫采取应对措施\n\
    - 当资产价格快速上升的同时信贷规模急剧扩张时，泡沫很容易识别\n- 不应该运用货币政策来刺破泡沫 （P383，三原因）\n\n- 宏观审慎监管：能够影响信贷市场总体走势的监管政策\n\
    - 中央银行和其他监管机构不应该采取自由放任的态度，任凭信贷驱动型泡沫产生和发展而不作出任何反应\n\n## 策略：政策工具的选择\n\n- 工具\n  -\
    \ 公开市场操作\n  - 法定存款准备金率\n  - 贴现率\n- 政策工具（也称操作工具）\n  - 准备金总量\n  - 利率（联邦基金利率）\n \
    \ - 能够导致中间变量变动的其他操作\n- 联邦基金利率和非借入准备金作为政策工具不能同时兼得（必须二选一）\n\n## 图2 中央银行工具、政策工具、中介目标和货币政策目标之间的关系\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_318_0.png)\n\n## 图3 将非借入准备金作为政策目标的结果\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_319_0.png)\n\n## 图 4 将联邦基金利率作为目标的结果\n\
    \n![](img/a21e92e825486cd1c3cd05a9b06cd2e8_320_0.png)\n\n## 选择政策工具的标准\n\n- 可测性和可计量性\n\
    - 可控性\n- 对目标可预订的影响\n\n## 泰勒规则, NAIRU和菲利普斯曲线\n\n联邦基金利率目标=\n通货膨胀率+均衡的实际联邦基金利率\n\
