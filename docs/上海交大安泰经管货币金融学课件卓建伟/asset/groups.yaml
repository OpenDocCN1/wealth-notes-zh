    \ of the interest rate on reserves.\n\n## 传统的货币政策工具\n\n在正常情况下，美联储使用货币政策的三个工具——公开市场操作、贴现贷款和准备金制度——实现对货币供应量和利率水平的控制，而这些被称为传统的货币政策工具（三大法宝）。\n\
