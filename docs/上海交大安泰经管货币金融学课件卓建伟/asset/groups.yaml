  - '[PAGE 336]


    # 预算赤字和通货膨胀


    +   - 政府可以通过两种方式弥补赤字：增加收入或借贷

    +     - 通过增加税收来增加收入或通过发行政府债券增加负债

    +   - 其实政府还有第三选项可以弥补赤字，增发货币并用它来支付购买的商品和服务。'
  - '[PAGE 337]


    # 预算赤字和通货膨胀


    +   因此，政府的预算赤字揭示了两个重要事实：

    +   - 如果政府的赤字是由公众购买国债解决，对基础货币和货币供应量并无影响。

    +   - 但是，如果赤字不是由公众增加的债券所提供资金，那么货币基础和货币供应量就会增加。'
  - '[PAGE 338]


    <!-- no content -->'
  - '[PAGE 339]


    # # 凯恩斯货币需求理论


    +   - 凯恩斯的流动性偏好理论

    +   - 为什么个人持有货币？三动机：

    +     - 交易动机

    +     - 预防动机

    +     - 投机动机

    +   - 严格区分货币的真实需求和名义需求'
  - '[PAGE 340]


    # 交易动机


    +   - 凯恩斯继承了货币交易学说的观点，认为交易规模与收入成正比。

    +   - 后来，他和其他经济学家认识到，被称为支付技术的新的支付方式，也可能影响到货币的需求。'
  - '[PAGE 341]


    # 预防动机


    +   - 凯恩斯也认识到，人们把货币作为一个缓冲，以防止意料之外的需求。

    +   - 凯恩斯认为，人们希望持有的预防性货币需求也与收入成正比。'
  - '[PAGE 342]


    # 投机动机


    +   - 凯恩斯也认为人们选择把货币作为财富的储备，他称之为投机动机。'
  - "[PAGE 343]\n\n# 综合三个动机\n\n$$\frac{M^d}{P} = f(i, Y)$$ where the demand for real\
    \ money balances is\nnegatively related to the interest rate $i$, \nand positively\
    \ related to real income $Y$\n\nRewriting\n$$\frac{P}{M^d} = \frac{1}{f(i, Y)}$$\n\
    \nMultiply both sides by $Y$ and replacing $M^d$ with $M$\n$$V = \frac{PY}{M}\
    \ = \frac{Y}{f(i, Y)}$$"
  - '[PAGE 344]


    # Putting the Three Motives Together


    +   - 货币流通速度不是一个常数：

    +     - i上升（i，Y）下降，从而货币流通速度上升，由于利率波动剧烈，流通速度波动也剧烈。

    +     - 随着对未来正常利率水平变化的预期，流通速度将会改变'
  - '[PAGE 345]


    # 货币需求的资产组合理论


    +   - 资产组合选择理论与凯恩斯流动性偏好

    +     - 可以证明资产组合选择理论和凯恩斯的流动性偏好函数得出的结论是相同的，对实际货币余额的需求与总收入正相关，与名义利率负相关。'
  - '[PAGE 346]


    # 货币需求的组合理论


    +   - 影响货币需求的其他因素：

    +     - 财富

    +     - 风险

    +     - 其他资产的流动性'
  - '[PAGE 347]


    # Summary Table 1 Factors That Determine the Demand for Money


    SUMMARY TABLE 1


    Factors That Determine the Demand for Money


    | Variable | Change in Variable | Money Demand Response | Reason |

    |---|---|---|---|

    | Interest rates | ↑ | ↓ | Opportunity cost of money rises |

    | Income | ↑ | ↑ | Higher value of transactions |

    | Payment technology | ↑ | ↓ | Less need for money in transactions |

    | Wealth | ↑ | ↑ | More resources to put into money |

    | Riskiness of other assets | ↑ | ↑ | Money relatively less risky and so more
    desirable |

    | Inflation risk | ↑ | ↓ | Money relatively more risky and so less desirable |

    | Liquidity of other assets | ↑ | ↓ | Money relatively less liquid and so less
    desirable |


    Note: Only increases (↑) in the factors are shown; the effects of decreases in
    the variables on the exchange rate are the opposite of those indicated in the
    "Response" column.'
  - '[PAGE 348]


    # 关于货币需求的实证分析


    +   - 预防货币需求：

    +     - 类似于交易需求

    +     - 随着利率上升，持有预防性余额的机会成本上升

    +     - 对货币的预防性需求与利率负相关'
  - '[PAGE 349]


    # 利率和货币需求


    +   - 如前所述，如果利率不对货币需求产生影响，那么货币流通速度更可能是恒定的-或至少可以预测的，因此，货币数量理论认为，总支出是由货币的数量决定的观点很可能是正确的。

    +   - 然而，对货币需求对利率越敏感，货币流通速度就越不容易预测，货币供给和总产出之间的联系就越不明朗。'
  - '[PAGE 350]


    # 货币需求的稳定性


    +   - 如果像凯恩斯认为的，货币需求函数是不稳定且可能发生不可预知的变化，那么货币流通速度是不可预测的，而货币数量可能不会如现代数量论认为的那样与总产出紧密相连。

    +   - 货币需求函数的稳定性对于美联储是否应该针对利率或货币供应量也至关重要。'
  - '[PAGE 351]


    # 货币需求的稳定性


    +   - 如果货币需求函数不稳定，因此货币供应量与总支出没有紧密联系，那么，美联储设定的利率水平将提供货币政策立场的更多信息，而不是货币供应。

    +   - 1973年前的实证完全支持需求函数稳定的观点。1973年之后，金融创新的飞速发展改变了货币所包含的内容，导致估计的货币需求函数表现出极大的不稳定性。'
  - '[PAGE 352]


    # MISHKIN


    # The Economics of Money, Banking,

    and Financial Markets


    BUSINESS SCHOOL EDITION


    FOURTH EDITION


    # Chapter 23


    总需求与总供给分析'
  - '[PAGE 353]


    # Preview


    +   - 本章阐述总需求-总供给分析工具，这一工具有助于我们研究货币政策对于产出和价格的影响。'
  - '[PAGE 354]


    # Learning Objectives


    +   - 概括并阐述总需求曲线和影响其移动的因素。

    +   - 描述并解释短期和长期总供给曲线。

    +   - 描述并解释短期和长期总供给曲线的移动。

    +   - 描述并解释短期、长期均衡以及自我调节机制的角色。

    +   - 描述并解释短期和长期总需求的冲击效应。

    +   - 描述并解释短期和长期的暂时性供给冲击和永久性供给冲击效应。

    +   - 解释2007-2009年金融危机中主要经济体的商业周期波动'
  - '[PAGE 355]


    # Aggregate Demand


    +   - 总需求由四部分组成：

    +     - **消费支出**：对消费品和服务的总需求

    +     - **计划投资支出**：商业公司在新机器、工厂和其他资本品（capital goods）上的总计划支出，以及新住宅的计划支出

    +     - **政府支出**：各级政府（联邦、州和地方）对商品和服务的支出

    +     - **净出口**：商品和服务出口与进口差'
  - '[PAGE 356]


    # Aggregate Demand


    $Y^{ad} = C + I + G + NX$


    The aggregate demand curve is downward sloping because


    $P \downarrow \Rightarrow M / P \uparrow \Rightarrow i \downarrow \Rightarrow
    I \uparrow \Rightarrow Y^{ad} \uparrow$


    and


    $P \downarrow \Rightarrow M / P \uparrow \Rightarrow i \downarrow \Rightarrow
    E \downarrow \Rightarrow NX \uparrow \Rightarrow Y^{ad} \uparrow$'
  - '[PAGE 357]


    # Aggregate Demand


    +   - 总需求曲线向下倾斜的事实也可以从货币需求的数量理论中得出。

    +   - 如果货币流通速度保持不变，确定的货币供给量意味着名义总支出也是确定的，这种情况下价格水平的下降对应着总需求的增加。'
