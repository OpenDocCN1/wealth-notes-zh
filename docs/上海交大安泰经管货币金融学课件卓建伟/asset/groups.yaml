    # 金融中介机构的功能：间接融资


    +   - 降低交易成本（即在金融交易过程中消耗的时间和金钱）。

    +     - 规模经济

    +     - 流动性服务

    +   - 减少投资者的风险暴露程度

    +     - 风险分担（资产转换）

