- pgno: 193
  md: '# 资本充足性管理： 股票持有者的收益


    资产回报率：每一美元资产的税后净利润


    ```

    ROA = 税后净利润 / 资产

    ```


    股权回报率：每一美元股权（银行）资本的税后净利润


    ```

    ROE = 税后净利润 / 股权资本

    ```


    资产回报率和股权回报率之间的关系可以表述为：


    股本乘数：每一美元股权资本所对应的资产数额


    ```

    EM = 资产 / 股权资本

    ```


    ```

    税后净利润 / 股权资本 = 税后净利润 / 资产 × 资产 / 股权资本

    ```


    ```

    ROE = ROA × EM

    ```'
  merge: -1
  img_proc: true
