- pgno: 83
  md: '# 10%息票利率的10年期息票债券的到期收益率（面值为1000美元）


    | Price of Bond ($) | Yield to Maturity (%) |

    |---:|---:|

    | 1,200 | 7.13 |

    | 1,100 | 8.48 |

    | 1,000 | 10.00 |

    | 900 | 11.75 |

    | 800 | 13.81 |


    +   - 如果债券的现期价格和面值相等，那么到期收益率就等于息票利率

    +   - 债券的现期价格与到期收益率之间存在负相关关系

    +   - 当债券的现期价格低于其面值的时候，到期收益率要高于其息票利率'
