- pgno: 57
  md: '# Meaning of Money


    +   - （从存量意义上讲）货币与以下概念存在区别：

    +     - 财富：能够储藏价值的各种财产的总和

    +     - 收入：每一单位时间内收入的数额（从流量意义上讲）'
  merge: -1
