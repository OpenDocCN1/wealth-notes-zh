- pgno: 263
  md: '# 货币乘数背后的感性知识


    r = 法定存款准备金率 = 0.10

    C = 流通中现金 = $400B

    D = 支票存款 = $800B

    ER = 超额准备金 = $0.8B

    M = 货币供给 (M1) = C + D = $1,200B

    c = $400B / $800B = 0.5

    e = $0.8B / $800B = 0.001

    m = (1 + 0.5) / (0.1 + 0.001 + 0.5) = 1.5 / 0.601 = 2.5

    货币乘数小于简单存款乘数

    虽然存款存在多倍扩张效应

    但对现金来说这一效应并不存在'
  merge: -1
