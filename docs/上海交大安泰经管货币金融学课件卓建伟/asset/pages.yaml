- pgno: 73
  md: '# 现值


    +   - 1年之后获得的1美元的价值要低于现在获得的1美元的价值

    +   - 原因何在？

    +     - 现在1美元的存款能够获得利息，并且在1年之后变成1 x (1+i) 美元'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 未来价值的折现计算


    令 i=0.10


    1年之后为 100美元×(1+0.10)=110美元


    2年之后为 110美元×(1+0.10)=121美元


    或者是 100美元×(1+0.10)²=121美元


    3年之后为 121美元×(1+0.10)=133美元


    或者是 100美元×(1+0.10)³=133美元


    N年之后为 100美元×(1+0.10)^n'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 简单现值


    $PV$=今天的价值（即现值）


    $CF$=未来的现金流（支付额）


    $i$=利率


    $$PV=\frac{CF}{(1+i)^n}$$'
  merge: -1
  img_proc: true
