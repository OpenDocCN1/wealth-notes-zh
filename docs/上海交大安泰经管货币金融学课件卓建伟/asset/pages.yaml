- pgno: 436
  md: '# 安倍与2013年日本货币政策的转变


    +   - 安倍晋三当选日本首相之后货币政策发生了重大转变。

    +   - 首先，日本央行被迫将其通胀目标加倍。

    +   - 其次，中央银行实施了量化宽松政策。

    +   - 这种双管齐下的政策将降低实际利率，同时提高通胀预期。'
