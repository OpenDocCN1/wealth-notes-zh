- pgno: 58
  md: '# 货币的功能


    +   - 交易媒介：

    +     - 消除由寻找需求之间的双重匹配状态所产生的问题（降低交易成本）

    +     - 提高专业化水平

    +   - 作为交易媒介的物品必须：

    +     - 易于标准化

    +     - 被普遍接受

    +     - 易于分割

    +     - 易于携带

    +     - 不会很快腐坏变质'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# 货币的功能


    +   - 记账单位：

    +     - 用来衡量经济运行过程中的价值

    +     - 降低交易成本

    +   - 价值储藏：

    +     - 用来实现购买力的长期储存

    +     - 其他形式的资产也能够实现这一功能

    +     - 货币是所有资产中流动性最强的资产，但是在通货膨胀期间会贬值'
  merge: -1
  img_proc: true
