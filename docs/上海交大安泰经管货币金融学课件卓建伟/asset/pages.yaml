  md: '# 金融市场的国际化


    +   - 外国债券是在境外发行的、以发行国货币计价的债券

    +   - 欧洲债券是一种以发行国以外的货币计价的债券

    +   - 欧洲货币是存放在货币发行国境外银行之中的外汇存款

    +     - 欧洲美元是存放在美国境外的外国银行或者美国银行境外分支机构里的美元存款

    +   - 世界股票市场

    +     - 也有助于联邦政府进行融资'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 金融中介机构的功能：间接融资


    +   - 降低交易成本（即在金融交易过程中消耗的时间和金钱）。

    +     - 规模经济

    +     - 流动性服务

    +   - 减少投资者的风险暴露程度

    +     - 风险分担（资产转换）

    +     - 多样化'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# 金融中介机构的功能：间接融资


    +   - 应对信息不对称问题

    +     - （在交易发生之前的）逆向选择： 力图避免选择那些风险水平较高的借款者

    +       - 收集潜在借款者的信息

    +     - （在交易发生之后的）道德风险： 确保借款者不去从事那些导致其无法偿还贷款的经营活动

    +       - 签订具有限制性条款的合约'
  merge: -1
  img_proc: true
