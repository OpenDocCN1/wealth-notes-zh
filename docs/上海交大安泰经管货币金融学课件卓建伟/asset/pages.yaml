- pgno: 303
  md: '# 物价稳定应该是货币政策的首要目标吗？


    +   - 层级使命与双重使命：

    +     - 层级使命 首要目标（如物价稳定）前提下完成其它目标

    +     - 双重使命 有两个平等的政策目标，如美联储物价稳定和充分就业

    +   - 物价稳定作为货币政策首要的长期目标

    +     - 物价稳定和自然失业率之间长期来看并不存在矛盾。如果过度关注短期表现，产生层级使命与双重使命的偏向，如果把物价稳定作为长期而非短期内的首要目标，无论哪种类型的任务模式都是可以接受的。'
  merge: -1
  img_proc: true
