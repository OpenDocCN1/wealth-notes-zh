- pgno: 432
  md: '# 增加流动性


    +   - 中央银行可以通过增加贷款来直接降低金融摩擦，以便向受损市场提供更多的流动资金，使它们能够恢复正常运作。

    +   - 金融摩擦的下降降低了投资的实际利率。'
  merge: -1
  img_proc: true
- pgno: 433
  md: '# 资产购买和量化宽松


    +   - 货币当局还可以通过购买私人资产来降低信贷息差，从而降低金融摩擦。

    +   - 虽然美联储采取了行动，但力度不足。全球金融危机对经济的总需求冲击是如此之大，以至于美联储的量化（信贷）宽松政策不足以克服它，美联储无法将总需求曲线转变为正常向右下倾斜的曲线，而经济仍遭受严重的衰退。'
  merge: -1
  img_proc: true
- pgno: 434
  md: '# 预期管理（前瞻指引）


    +   - 中央银行承诺长期保持低利率的远期指导，是降低相对于短期利率较高的长期利率的一种有效方法，是降低金融摩擦和实际利率的另一种方式。

    +   - 这可能导致总需求的向右移动，并通过提高通胀预期来改变短期总供给曲线。'
  merge: -1
  img_proc: true
