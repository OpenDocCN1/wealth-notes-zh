- pgno: 9
  md: '# 为什么要研究金融机构和银行？


    +   - 金融中介机构：是指那些吸纳存款资金、并且向需要资金的人提供贷款的机构

    +     - 银行：吸收存款并且发放贷款

    +     - 其他的金融机构：保险公司、财务公司、养老基金、共同基金以及投资银行等

    +   - 金融创新：开发新的金融产品和服务。

    +     - 通过提高金融系统的效率成为重要角色。'
  merge: -1
