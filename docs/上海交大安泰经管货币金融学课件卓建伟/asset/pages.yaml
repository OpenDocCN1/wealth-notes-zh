- pgno: 102
  md: '# 市场均衡


    +   - 市场均衡是指在给定价格条件下，人们愿意购买（需求）和出售（供给）的数量相等时的状态

    +   - Bᵈ = Bˢ 定义了均衡（或者市场出清）的价格和利率

    +   - 在Bᵈ > Bˢ 的情况下，出现了超额需求，价格将会上升而利率将会下降

    +   - 在Bᵈ < Bˢ 的情况下，出现了超额供给，价格将会下降而利率将会上升'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 债券需求的变动


    +   - 财富：在经济周期的扩张阶段，随着财富的增加，债券需求量也会随之提高，需求曲线向右方移动

    +   - 预期回报率：长期债券的预期利率越高，其预期汇报率就会越低，导致债券需求减少、债券需求曲线将会向左发生位移

    +   - 预期通货膨胀率：预期通货膨胀率的提高将会降低债券的预期收益率，导致债券需求减少，债券需求曲线向左发生位移：

    +   - 风险：债券风险水平的提高将会导致债券需求的下降、债券需求曲线向左发生位移

    +   - 流动性：债券流动性的提高会导致债券需求上升、债券需求曲线向右发生位移'
  merge: -1
  img_proc: true
