- pgno: 79
  md: '# 普通贷款


    PV=借款金额=100美元


    CF=1年之后的现金流=110美元


    n =年数=1


    100 美元 = 110 美元 / (1+i)^1

    (1+i) 100美元=110美元


    (1 + i) = 110 美元 / 100 美元

    i=0.10=10%


    对于普通贷款而言，单利率就等于其到期收益率'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# 固定支付贷款


    这种贷款在期限内的每一个时期都要进行等额偿付


    LV = 贷款金额

    FP = 每年固定偿付的金额

    n = 到期前的年数


    LV = FP/(1+i) + FP/(1+i)^2 + FP/(1+i)^3 + ... + FP/(1+i)^n'
  merge: -1
  img_proc: true
