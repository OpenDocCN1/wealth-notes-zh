- pgno: 429
  md: '# 非常规货币政策与量化宽松的应用


    +   - 有时，负面的总需求冲击是如此之大，以至于在某种程度上，中央银行不能进一步降低实际利率，因为名义利率触及了零下限，就像在2008下半年雷曼兄弟破产后所发生的事情。

    +   - 在这种情况下，当零下限问题出现时，中央银行必须转向非常规货币政策。'
  merge: -1
  img_proc: true
- pgno: 430
  md: '# 非常规货币政策与量化宽松的应用


    +   - 非常规货币政策采取三种形式：

    +     1. 流动性注入

    +     2. 资产购买

    +     3. 前瞻指引'
  merge: -1
  img_proc: true
