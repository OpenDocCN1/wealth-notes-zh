- pgno: 18
  md: '# 货币政策与财政政策


    +   - 货币政策是指对于货币和利率的管理

    +     - 在美国，货币政策是由联邦储备体系（Fed）来执行的

    +   - 财政政策是对于政府支出和税收问题的管理

    +     - 财政赤字是指在特定的一年中政府的支出超过税收收入的差额

    +     - 财政盈余是指在特定的一年中政府税收收入超过支出的差额

    +     - 必须通过借款来弥补预算赤字'
  merge: -1
  img_proc: true
