- pgno: 339
  md: '# # 凯恩斯货币需求理论


    +   - 凯恩斯的流动性偏好理论

    +   - 为什么个人持有货币？三动机：

    +     - 交易动机

    +     - 预防动机

    +     - 投机动机

    +   - 严格区分货币的真实需求和名义需求'
  merge: -1
  img_proc: true
- pgno: 340
  md: '# 交易动机


    +   - 凯恩斯继承了货币交易学说的观点，认为交易规模与收入成正比。

    +   - 后来，他和其他经济学家认识到，被称为支付技术的新的支付方式，也可能影响到货币的需求。'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 预防动机


    +   - 凯恩斯也认识到，人们把货币作为一个缓冲，以防止意料之外的需求。

    +   - 凯恩斯认为，人们希望持有的预防性货币需求也与收入成正比。'
  merge: -1
  img_proc: true
- pgno: 342
  md: '# 投机动机


    +   - 凯恩斯也认为人们选择把货币作为财富的储备，他称之为投机动机。'
  merge: -1
  img_proc: true
- pgno: 343
  md: "# 综合三个动机\n\n$$\frac{M^d}{P} = f(i, Y)$$ where the demand for real money balances\
    \ is\nnegatively related to the interest rate $i$, \nand positively related to\
    \ real income $Y$\n\nRewriting\n$$\frac{P}{M^d} = \frac{1}{f(i, Y)}$$\n\nMultiply\
    \ both sides by $Y$ and replacing $M^d$ with $M$\n$$V = \frac{PY}{M} = \frac{Y}{f(i,\
    \ Y)}$$"
  merge: -1
  img_proc: true
- pgno: 344
  md: '# Putting the Three Motives Together


    +   - 货币流通速度不是一个常数：

    +     - i上升（i，Y）下降，从而货币流通速度上升，由于利率波动剧烈，流通速度波动也剧烈。

    +     - 随着对未来正常利率水平变化的预期，流通速度将会改变'
