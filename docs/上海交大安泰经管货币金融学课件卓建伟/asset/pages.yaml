- pgno: 65
  md: '# 货币的计量


    +   - 我们如何计量货币？哪一种特定的资产能够称为“货币”？

    +   - 使用流动性的概念建构货币总量：

    +   - M1（流动性最高资产） = 现金 + 旅行支票 + 活期存款 + 其他可开具支票的存款

    +   - M2（M1 加上流动性较低的其他资产） = M1 + 小额定期存款 + 储蓄存款和货币市场存款账户 + 货币市场共同基金份额'
  merge: -1
  img_proc: true
