- pgno: 82
  md: '# 息票债券


    使用与固定支付贷款相同的计算方法


    P = 息票债券现期价格

    C = 每年支付的息票利息

    F = 息票债券的面值

    n = 到期前的年数


    P = C/(1+i) + C/(1+i)² + C/(1+i)³ + ... + C/(1+i)ⁿ + F/(1+i)ⁿ'
  merge: -1
