- pgno: 253
  md: '# 多倍存款创造的公式推导


    假设银行不持有超额准备金


    法定存款准备金(RR) = 准备金总额(R)


    RR = 法定存款准备金率(r) 乘以 支票存款总额(D)


    替换


    r × D = R


    等式两边同除以 r


    D = 1/r × R


    等式两边同时变动可以得到


    ΔD = 1/r × ΔR'
  merge: -1
  img_proc: true
