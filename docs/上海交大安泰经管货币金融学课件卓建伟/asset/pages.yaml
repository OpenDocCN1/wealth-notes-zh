  md: '# Fisher Equation


    i = i_r + π^e


    i = nominal interest rate


    i_r = real interest rate


    π^e = expected inflation rate


    When the real interest rate is low, there are greater incentives to borrow and
    fewer incentives to lend.

    The real interest rate is a better indicator of the incentives to borrow and lend.'
