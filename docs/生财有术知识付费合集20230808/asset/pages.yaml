  md: '![](img/00c8ed3105ac934755346b58149acc95_1005_0.png)


    # 3、优秀学员嘉宾分享


    可以说，培训老师工作的直接任务就是培养标杆案例，实现学员的成才和赚钱。通过有仪式感的邀请学员分享的动作，也可以激活群里潜水的学员，让大家被身边的牛人鼓舞，推进操作项目和创造产出。有了学员的真实案例，团队还能更好地招商赚钱，形成良性循环。


    # ①提前约稿


    虽然学员嘉宾的分享内容基本是自由发挥，但是他们一般都缺乏对外分享的经验，不知道把握重点和如何表达。比如把不重要的东西反复说，把很重要的东西忽视掉。'
  merge: -1
  img_proc: true
- pgno: 1006
  md: '又比如自己本来业绩很牛但是在分享内容里没有体现出来。名正才能言顺，人是更倾向于听牛逼的人的话，越牛逼的人说的话他们越愿意听，得把嘉宾的牛逼也彰显出来。


    ![](img/00c8ed3105ac934755346b58149acc95_1006_0.png)


    这些方面都需要带队老师这个经验更加丰富的人去帮忙，所以最好让分享嘉宾写一份分享稿初稿，然后发给老师看一下帮助修改完善，争取达成最佳的“节目效果”。这样嘉宾说出来的话比较有水平，最后他也信有面子。


    当然，邀约嘉宾来做分享，这件事本身也是非常难的事情，需要你拿出哄女朋友的技能和技能，“连蒙带骗”最后征得嘉宾的同意。有些嘉宾真的就不给面子，那没办法只能换一个学员、'
