  md: '时间过短，就说明你的干货内容逻辑链条不行，用户听了这个就不想接着听了。同时也可能你的钩子放的不到位，因为我们主播如果要一直把用户留下来，是需要不断的给用户放钩子的，告诉他们现在这个内容虽然很好，但是你听了这个还不够，后面的内容更好。


    那如果时间过长（我看到过有停留10几分钟的），那就是你讲的太实在了，光把人留下来白赚了。所以直播讲干货，要讲几分留几分，让用户知道花钱买课更能解决问题。


    商品点击率：就是你卖课时候，你的用户看到你的商品卡片跳出来之后去点击商品的比例，这个比例参考值是大于20%。


    如果你的数据不达标，那就是说明你缺少话术引导用户点击，你催单的话术还需要优化。（优化的思路就是去拆解对标，很多同行是做的非常到位的，譬如会现场演示如何点击商品查看等），这个数据之所以重要，是如果你的数据好看，系统会默认为你的产品会比别人更有吸引力，所以也会给你推更多流量。


    订单创建率 & 订单支付率：这两个现在在巨量里面看到的是合成了一个指标，叫做“商品点击-成交转化率”，就是用户在查看了商品之后选择最终付款的比例，这个商品点击-成交转化率的参考值目前我没有，我自己的比例一般在25%左右，仅做参考了。


    如果你的这个比例过低，那就是用户查看了你的商品，但是并没有付款。那就是要去找没有付款的理由，可能是你的催单话术不过关让他觉得没必要现在下单，或者他查看了你的商品，发现不够吸引人。


    所以我们要去做自查，可能是催单不行，或者我们商品详情页的内容不行，或者我们商品的评论不行，这些都需要去优化。'
