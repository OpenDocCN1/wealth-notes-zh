- pgno: 331
  md: '# 1. 为什么新手学新媒体文要找高手学习？


    高手比你更懂变现市场，有高手带，学习和初期变现过程中不容易踩坑。


    高手有资源和人脉，作为老师可以在初期拉你一把手，比你闷头探路变现快。


    去年在我没有老师的时候，曾经连续看书三个月学习写新媒体文，自己在公号写宠物文练习，那时我没有市场读者思维，写作功底一直是进展不大，也不知如何投稿变现。


    # 2. 高手指路和刻意练习，陪伴式成长


    有的人觉得，写新媒体从文字到变现要用很久。从我的变现经验和观察一些人的结果来看，通常是 3-6 个月内出文字变现成绩，无论平台和金额大小。


    我正式学写稿和到收到第一篇稿费，只用了一个月多。那个时间里每天高强度学习很累，全部的空闲时间都在做功课，有时写到凌晨两点多，但也是我在新手期成长最快的阶段，为了证明写作能力，试着投稿。


    虽然我的第一篇投稿（[陈冠希人物文](https://mp.weixin.qq.com/s/xp3vBbgU2eyQyAUtjjP5W)）因为不知道市场风向，四处碰壁，很久后投在一个小号发表，磨砺了意志，虽然这篇没有很快过稿，但投稿过程中得到流量大号编辑的约稿多篇（后面展开讲），就此打开了新媒体变现之门，成长和变现比一部分新人快得多。第一个月写稿
    8 篇，过稿 6 篇，稿费总共 2000（有一篇过了很久发布）。第二个月出了一篇十万加，单篇稿费 800 。'
