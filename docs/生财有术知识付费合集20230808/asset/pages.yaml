- pgno: 158
  md: '打开飞瓜（前期可以淘宝买一个），选择抖音商品榜，选择你所需要查询的类目，按照销量排名。这样就可以快速筛选爆品或者是正在崛起的品了。


    这个选品法有三个好处：


    1）可以实时观察有哪些品忽然崛起出现在榜单中；


    2）可以敏锐的察觉这个类目大的风向标；


    3）每天分析竞品的销售状态、运作的难度，核心出单逻辑等资料，做好登记并做出决策（我们能不能做，风险评估，投产比评估等）。


    如下图，抖音虚拟常用的两个类目【本地生活】跟【图书音像】，我每天都会去看这个排名，这样能保持我选品的敏感度，并及时对新崛起的品进行研究和跟进。


