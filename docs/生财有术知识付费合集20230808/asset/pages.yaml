- pgno: 348
  md: '问编辑要选题前，先把自己想写的选题和大纲（简写）写好发给编辑。次数多了，编辑看到你的诚意，内部有选题可能考虑你。


    其实理由简单，在平台编辑这里，一个人有好的写作态度比文笔的分量重，好的文章是改出来的。


    注：可以把自荐信一次投几家号。


    # 2. 为什么一定要自己投稿？


    这里多说一些，如果你的写作变现是从学习班开始的，那么由人代投稿的行为对新人来讲短期内是助力，长远看不利于培养投稿的独立作战力，而独立投稿能力是和做好个人影响力紧密相连的：


    第一，你接触不到市场的一手反馈，因为代投，编辑对于稿子有哪些问题和改进的点在哪里，这家号调性如何，还有一些过稿后的代投人可能不会一一跟你转达。'
  merge: -1
  img_proc: true
- pgno: 349
  md: '![](img/00c8ed3105ac934755346b58149acc95_349_0.png)


    而通过编辑的市场反馈来调整自己，写作进步，更有利你挑战大平台搞变现。


    第二，不利于建立自己的投稿资源库，没有和编辑建立联系，编辑也没有对你的初步印象，其实每次和账号编辑对话都是展示你的机会，再就是编辑的意见有利你增进对账号的理解，有利后续投稿。


    这步非常重要，是个长期纵深链接关系：先建立联系，由点成线（优秀者由一家号推荐介绍给另一家号写，或者推荐关键节点人脉），最后横向发展成关系网，新手期先有“点”有1才有后面N个0的可能性。


    大家都去做同一个事，效果又不一樣。


    350/1029'
