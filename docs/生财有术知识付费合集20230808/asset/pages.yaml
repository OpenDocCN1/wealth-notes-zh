    # 如何通过


    +   【创业知识博主】

    原始积累800万


    # 一、我有老婆了


    领飞大学毕业，之后分配到老家国企煤矿单位（现在叫国家能源），在一线井下做区队技术员，早晨5点半起床做通行车，晚上7点到家，井下300米一呆就是几个小时，这种工作我一干就是3年，北漂族感觉都没我这么辛苦。


    我们行业有句话说：赚着白面的钱，操着卖白粉的心'
