- pgno: 577
  md: '在短视频带货培训领域，我的多维打击是：

    跨平台+流量+品牌+培训+社群。


    +   1、我在微博上销售短视频带货课，是跨平台销售，几乎没有 人这样做。


    +   2、我微博有百万粉丝，有超强个人品牌，一个月阅读量1.5亿， 根本不缺流量。


    +   3、我做的不是简单的课程，而是真正的“训练营”，培训+社群+1对1辅导，确保学员有收获。


    +   4、短视频带货训练营的底层逻辑是自媒体爆款逻辑，这是我的强项，也是多数电商人不擅长的。


    这些擅长加在一起，就是多维打击。

    我没有同行。

    我只要踏实做自己的事就好了。


    # 【第七章】 培训宇宙的尽头是训练营


    这部分是超级干货。我犹豫了很久要不要写出来，最后还是决定写一下。就算是给生财的答谢吧。


    培训其实是一门专门的学问。很多实干家做培训，会把自己懂的一股脑儿教给学员，确实很良心，但学员基础差，是很难学会的。


    我做的不是单纯的培训，而是训练营。让小白也能轻松学会的训练营。


    +   1、小鹅通学习。


    课程是录播，放在小鹅通上，方便随时学习。

    课程设置由易到难，循序渐进。


    +   2、知识星球答疑。


    经验贴，答疑，放在“抖音内参”知识星球里，学员可以在知识星球提问。

    已经积攒了1000多篇经验帖，方便学员查询，这样就会越做越轻松。


    +   3、社群服务。


    微信群做通知，互动。

    每期学员都拉群，通知，一些重要资料放在群里。这样也可以在一定程度上防止被 盗版。


    +   4、助教一对一对一辅导，诊断。


    这是我们的杀手锏。我培训了一个助教团队，每个人都是爆过单的，然后做了助教sop，大家按统一标准做客服。学员有问必答，而且还要主动出击，确保学员出单。

    我们承诺“听话照做，保证出单”，这是很容易做到的。'
  merge: -1
  img_proc: true
- pgno: 578
  md: '对认真努力的学员，我们还要尽最大可能，让他们持续出单、爆单。

    培训宇宙的尽头是训练营。训练营才是最出能出成绩的，也是最不可能被盗版的。


    # 【第八章】让盗版为我所用


    知识付费领域，最让人头疼的就是盗版。我的盗版课程，在拼多多上是同类销量第一。

    我的想法是，既然打不过，那就加入；既然无法杜绝盗版，那我就让盗版为我引流。

    我有很多学员，都是听了盗版课，收获巨大，然后发现有些地方还是卡着做不好，就跑过来报正版训练营的。


    这里面也有一些技巧，择要说一下：


    +   1、课程不断升级。

    每期都优化30%，每期都重新讲。


    +   2、课程里有些内容不讲。

    只在知识星球和群里发资料；


    +   3、还有些重要资料不公开发。

    助教一对一服务时，根据学员进度发放。也就是说你做得越好，给你的内容就越多。进

    来盗课不做事的，永远不可能接触到核心机密。


    +   4、助教一对一诊断、答疑。

    很多不出单的被诊断后马上出单。爆单后给二次爆单方案，正常能多赚30%左右。听盗

    版课，自己去琢磨吧。


    +   5、学员专属高佣链接。

    我们申请了抖音团长，以团长身份去跟商家谈合作，筛选出高佣、安全、容易出单的产品，让学员直接带，很容易出单，而且赚钱更多。


    比如某品牌产品，达人自己带货分佣只有10%，用我们给的带货链接，分佣就是20%。

    有人爆单没用我们的链接，结果少赚了几万元，肠子都悔青了。


    +   6、在课程里留联系方式

    这就是常规操作，没什么特别可说的了。


    # 【第九章】让黑子给我打工


    我在知乎上看到了一些黑生财的帖子，老实说黑我的也有，不过不多。

    不知刘亦仁是什么心态，反正我不在乎。黑我，也是在帮我做宣传。黑我的人越多，就

    说明我越有影响力（羡慕生财ing）。

    黑子们往往脑回路非常清奇：'
  merge: -1
  img_proc: true
- pgno: 579
  md: '有人黑我，说，“不是每个学员都能爆单赚几万！要非常努力才行！”


    我当时都笑喷了：当然要非常努力才行。不努力就想赚到大钱，我是神仙啊？


    知乎黑我的那个帖，说，“保证出单”是我派人下的单。这个我还真没办法反驳，因为真


    有这个可能，是吧？


    但我爆单赚了几万、十几万的学员没办法忍，就纷纷过态晒收益图——“这也是鲸叔派人买的？他收我几千块钱学费，买我几十上百万产品，他是不是傻？”


    陆续有人从那个黑我的帖子里摸过来付费。黑我的人要是知道了，估计气得得生癌吧？


    当然，肯定有人看了黑我的帖子，决定不付费，那说明他就不应该对我的客户。


    实话实说吧，这个世界上是有一群这样的人存在，他们根本就没准备付费，只想白嫖：他们花几元钱就像割肉，别说一次性付几千了；他们又想赚钱，又怕受骗，根本舍不得花钱。他们看黑料，只是为了坚定自己不付费的决心。


    这样的人群，千万不要让他们成为我们的客户。太麻烦了。


    # 【第十章】要拒绝客户，不要说服客户。


    做知识付费，要紧的不是说服客户，而是拒绝客户。


    你不应该努力提高成交率。相反，你应该努力降低成交率。


    如果你努力提高成交率，那就会成交不应该被成交的客户，后期服务就很困难，而且会影响口碑。


    那些学习能力很差的，没有行动力的，没有抗挫折力的，根本不会做事的，情绪不稳定的，交几千块钱非常心疼的，负债累累的，幻想一夜暴富的……就是不应该被成交的客户（学员）。成交这样的人，就是在给自己埋雷。


    拒绝客户的利器是设置门槛。我专门写过一个帖子，说什么样子的人不应该报名短视频带货训练营。然后世界就清静多了。


    成交不是说服，而是筛选。双向选择，客户在筛选我们，我们也在筛选客户。


    我们刚开始做训练营的时候，每期都有十几个非常麻烦的学员；后来开始设置门槛拒绝客户，最近几乎已经没有了。


    当然，降低成交率需要建立在做大客户基数之上的。


    我微博每个月阅读量约1.5亿。这让我有足够的底气去拒绝客户。'
  merge: -1
  img_proc: true
- pgno: 580
  md: '# 【第十一章】为什么你在生财赚不到钱？


    因为赚钱是一个人所有能力、努力和运气的总和。


    你没有能力，不够努力，运气来了也抓不住。然后你还要抱怨别人不给你机会，割你韭菜。


    你能力强，自然能赚到钱；能力不强，自然多交学费——我每年交学费也有几十万啊各位。


    没有人天生是什么都会的。学任何东西，都是需要交学费的。创业、赚钱也一样。


    学费分两种。第一种是付费跟人学，比如买书、买课、咨询、进社群之类，其实花钱极其有限。


    第二种是自己不懂，瞎折腾，结果赔钱赔时间，才能得到一点经验教训。这可就没数了。


    成功的捷径，就是找到有结果的人，向他学习。不要自己瞎折腾。


    总想白嫖，不肯为价值买单，结果肯定是要交更多的学费。


    我自己有流量，有品牌，会做事，来生财只是为了找项目，我赚钱就简单：


    如果你什么都不会，也不肯努力，交几千块钱就想轻松年赚百万——您这个需求，只有骗子才能满足。


    您千万别来生财，当然也千万别报我的课。


    # 【第十二章】做终身学习者


    学习其实是风险投资。


    不要指望某次学习一定能有多大收获，能有一两句有用就很好了。有时候，真是一两句话就足以改变人生命了。


    多去学，养成学习的习惯；多去做，多试错，才是最重要的。


    多学习，多努力，能力就会强，运气也会好，就容易赚到更多的钱。


    不断变化的时代，在不断奖赏善于学习的人。


    我今年给公司员工都买了生财。我的想法是，让他们分别测试一下生财推荐的项目，如果合适，就来放大。


    只是最近事情太多——说实话就是短视频带货训练营做得太好，大家忙不过来，加上我也不太会做管理，所以这个想法还没有来得及落实。但未来是会落实的。


    我已经确定，或者说事实已经证明，生财就是一座金矿，你会做事，你肯做事，就能得到巨大的财富。'
  merge: -1
  img_proc: true
- pgno: 581
  md: '# 【第十三章】赚想赚钱的人的钱


    赚想赚钱的人的钱，从来是门好生意。


    生财做的是这个生意，我做的也是这个生意。只不过，生财做得大，我做得小；生财做社群，我做训练营；生财什么都做，我专注一个小领域，做到极致。


    你会一个赚钱的法门，自己亲自去做，可以赚到钱；但如果你去把这个方法交给别人，就可能赚到更多的钱。


    关键点有四：


    +   1、你自己要能赚到钱；

    2、你要有足够的流量来源；

    3、你要会做成交；

    4、你要擅长教人，能让学员出结果。


    凡尔赛一点说，这四点我都比较擅长。


    所以我才能把短视频带货训练营连做9期，而且越做越好。


    我想赚更多钱，当然会尽量让学员都赚到钱。


    学员赚到钱，跟我赚到钱，目标是一致的。我要努力让学员赚到钱，我才可能赚到更多的钱。


    聪明、努力、诚实、靠谱，才是赚钱之道，才能持续赚钱。


    # 【第十四章】死磕流量


    谁能低成本解决流量问题，谁就几乎可以做好任何生意。


    无论你是做实体，做电商还是做知识付费，流量都是绕不过去的坎儿。


    你必须解决流量问题，才能赚到钱。你的流量越多，就越能赚到更多的钱。


    生财里有很多项目，你学会了，用流量去放大，就能赚到钱，就这么简单。


    关于流量，我可能跟很多人想法不一样，我建议大家更努力去做公域流量，而不是私域流量。


    公域流量是海洋，私域流量只是池塘。


    有些知识付费达人，忽然很轻松就赚了一两百万，然后再也赚不到钱了，就是因为他的流量枯竭了，没有新的流量进来。


    我之前也是做私域流量，一样遇到过这样的困境。后来认真经营微博，获得源源不断的公域流量，就做得很轻松了。'
  merge: -1
  img_proc: true
- pgno: 582
  md: '# 【第十五章】该不该去做微博？


    公域流量有很多平台。


    我当时选择微博，是因为我发现微博大佬都不怎么赚钱，我就认为微博的流量便宜，值得去做。


    事实证明我是正确的。


    但我并不太建议大家去做微博。原因有二：


    1、微博并不适合割韭菜。


    微博是个“希腊广场”式的社交平台，或者干脆说是个斗兽场。你很容易被扒皮。如果你的产品和服务不够过硬，分分钟会崩盘。


    2、再好的培训产品，也不可能让所有人都满意。


    学员的素质、努力程度、收入水平、期望值，甚至夫妻关系、精神状态，都会影响他的满意度。一个处理不好，在微博上就可能成为大事件。


    我在微博上做了两年多知识付费，短视频带货训练营做了9期。我现在还是很少负面——我干脆直说了吧，口碑算很好了。


    我每天都小心翼翼，如履薄冰，如临深渊。


    当然，如果你的产品和服务都很好，做微博是没问题的，微博也非常有利于积攒口碑。


    我有学员会在微博上晒单，晒经验，这是非常好的客户见证。


    客户说你好，比你自己说自己好有用的多。


    # 【第十六章】长期主义与赚快钱


    到2022年7月，短视频带货训练营做了9期。还能做多久？我不知道。我只是尽可能把它做好，做得长久一些。


    我也跟蒋晖请教过——他的《怎样做好淘宝》也是我是出版的，他给了我一些非常有益的建议，比如继续专注做微博，比如做好爆单营。他说电商培训不如有以前做，因为现在大家的注意力都在抖音快手。


    所以李辉短视频带货训练营做得好，其实也是吃到了时代红利。


    做超级个体，无论是知识付费，还是分销带货，赚的都是红利期的钱，风口的钱。就是要赚快钱。


    不断有人问我：你说短视频带货还是红利期，红利期过了怎么办？


    这问题就很奇怪：你想那么多干嘛？好不容易有个红利期，难道不是应该抓住机会，拼命去赚钱吗？等红利期过了，再找新的红利呗。


    当然也有另一个极端：我看到一些人，一直都在赚快钱，赚琐碎的钱，不停地换项目，非常辛苦，很难放大。'
  merge: -1
  img_proc: true
- pgno: 583
  md: '赚快钱与长期主义矛盾吗？我的想法是，不矛盾。


    首先你要赚到快钱，活下去，然后才能长期主义。


    其次，你要有赚钱的主项目，能帮你赚到超过80%的收入，同时也要不断测试项目，储备项目。


    最后，也是更重要的，不断学习，死磕流量，打造个人品牌。


    “我”才是最好的产品。


    不断投资自己，做好自己，让自己更聪明、更能干、更有影响力，就是最好的长期主义。


    __________________


    【最后】感谢，还是感谢


    感谢亦仁，感谢生财。


    感谢贡献了优质内容的圈友们。


    感谢大程，感谢临西，没有你们，我大概还要很久才能来到生财这个宝地。


    我可能比生财大部分圈友年纪都要大一点。我的经验是，过去几十年，从来没有任何时代，像今天一样有这么多赚钱的机会，像今天一样适合个人逆袭。


    我们进入生财，就是进入了宝库。


    我们一起努力，一起生财。


