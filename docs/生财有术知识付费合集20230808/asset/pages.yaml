  md: '大家都知道，我们本期抖音商业 IP 大航海 2.0 已正式开船，但我们也发现有不少圈友因为时间的问题，没办法跟着我们一起学习。没关系，我们这期「生财合伙人」专栏，请来了
    @突围一只鹰 老师，来为我们分享另外一个切入知识付费赛道的方式：录播课。


