  md: '这一点，非常适合家庭教育这门实操专业。比如：有学员觉得他教育理念很好，但是孩子理解不了，那通过一些具体的事件，我可以分析出来，不是孩子理解不了，是他没有用对方法，并且给他举例，对的方法怎么操作。


