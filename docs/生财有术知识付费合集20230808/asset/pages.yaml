- pgno: 279
  md: '# ## 怎样发现自己的优势？


    # ### 醒醒同学


    职场优势咨询师，盖洛普认证教练，手工书作者


    寻找优势，就是提高找到人生“高光时刻加速器”的概率。有四个发现优势的思路：


    +   1. 从成就事件中寻找优势动力。

    2. 从重复行为中寻找优势动力。

    3. 从独特性中寻找优势动力。

    4. 借助专业测评工具，如盖洛普优势识别器。


    在成长过程中，找到优势就是找到正确的方向，通过持续训练，让天赋可视化；依靠优势，也就能更快找到自己擅长并喜欢的事业。


    随之，物质上更容易获得回报，精神上也更容易获得成就感。


    > （图片来源于 2022 年《生财日历》）


    # # （3）市场需求


