    # # 2.3 实用有干货的内容有人藏


    如上图所示，我的频国内排名第二的大师课是FBI首席谈判专家Chris Voss的课，仅次于超级篮球明星--库里的课。这个课程的主讲人并不是什么大明星，甚至在他所在的领域当中，都是比较小众。但是这个课程干货十足，非常落地和实用，我翻译的时候获得很大的收获。


    所有看过这个课程的同学，都会在弹幕中说：厉害，马上学会，是怎么回事……我在这里想要表示的是，该课程是我发布的内容当中，极其有干货含量的课。


    B站的用户对于学习和求知的渴望，远远大于你们的想象。不要通过一些不够实在的干货内容，做成好看的视频，就以为可以唬住用户。在B站，用户可以花很多心思去研究和分
    析你所分享的内容，甚至会出现评论区总结里面的要点和学习笔记，成为“课代表”。'
