  md: '__________


    # 【序章之前】我的至暗时刻


    我是2014年创业的，刚创业时公司主营业务是出版。


    创业之前我就职于《中国图书商报》，出版了《畅销书浅规则》系列，也是当时出版界最贵的培训师。


    做自己擅长的事，自然顺风顺水。我先后策划出版了几百本图书，特别是电商、微商领域的图书，很多都是各自领域最具代表性的作品。


    借由出版，我对创业领域有了更多了解。2016做微商文案培训，也是当时行业前列的，四个月赚了200万吧。


    2019年，我投资了一部电影，因为政策原因，一直未能上映；出版业务同样因为政策原因，成本增加，很多坏账。两项相加，这一年我损失了700万。


    2019年是我的至暗时刻，也是我对创业、赚钱进行深度思考的一年。


    __________


    # 【第一章】多赚一倍


    2019年，我一边思考，一边开始写《多赚一倍》。


    写这本书时我已经明确“把公司做小，把利润做大”，后来给临西策划《轻创业》，给大鹏策划《就想做个小公司》，跟这个思路是一脉相承的。


    这本书里，我总结了100多种多赚一倍的方法，我先后做过1000多个创业个案咨询，很多人只需要优化两三个点，就可以轻松多赚一倍了。


    但是我对多赚一倍并不满足，我开始思考，怎样才能多赚十倍？


    __________


    # 【第二章】多赚十倍


    怎样多赚十倍？这个问题，我整整思考了两年。


    最后结论很简单：找到边际成本几乎为零的产品，然后拼命堆流量。


    核心是两点：


    +   1、产品


    首先不能做实物产品，因为要实现十倍增长，供应链、物流、管理都容易出问题。


    其次不能做一对一服务，比如咨询、策划类。


    最终结果，是只能做边际成本低的虚拟产品，做一对多服务。比较高客单价的培训产品，是很符合的。


    +   2、流量'
