  md: '你好，我是突围一只鹰，程序员出身，从 2014 年开始创业，做过 App、软件外包，目前专注于自媒体。


    我做 IT 录播课已经有 4 年多了，出过爆品课程，也有 0 销量课程，目前能做到每月 5W+ 收入，高峰期月收入超 20W。同时我也在帮助一些朋友通过技术类录播课变现，最高的已经做到年销售额大几十万。


    本文约一万字，整篇分享围绕以下话题展开：


    ![](img/00c8ed3105ac934755346b58149acc95_809_0.png)


    # —Part 1—


    # 录播课是个好的副业吗？'
  merge: -1
  img_proc: true
- pgno: 810
  md: '好的副业应该满足以下 3 个条件：


    +   * 收入有潜力，长期来看有机会超过主业。


    +   * 与主业互相促进，主业的经验能给副业带来竞争优势，副业带来的个人影响力可以反哺主业。


    +   * 最好可以长期做，有积累、有复利。


    对于录播课而言：


    1）它是一个可以把时间售卖多次的好生意。大部分垂类录播课的收入天花板虽然不高（百万级），但对个人来说是个不错的选择。


    2）它可以打造你的个人 IP，提高你在整个技术生态中的地位，以及增强日后你在职场中的竞争力。


    3）长期来看，教育行业会是一个持续存在的行业，只要你做的内容符合未来趋势，就能长期持续地做。


    如果你也是程序员，或者是技术类职业，这个副业方向将会非常适合你，不仅能带来额外收入，还能帮助你的主业更好地发展，甚至超过你的主业。


    **Q：我是怎么走上录播课这条路的呢？**'
