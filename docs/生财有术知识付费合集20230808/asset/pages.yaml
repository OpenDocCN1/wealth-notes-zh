  md: '![](img/00c8ed3105ac934755346b58149acc95_69_0.png)


    无论是经济金融我的本专业，还是政治历史，我都能融会贯通，拥有自己的底层框架并做到准确预判。（曾和200W粉丝的时政大V有过预判类合作，也跨专业考上过清北的政治学博士）


