  md: '比如：为什么公司会裁掉35岁大龄基层设计师？


    解决问题思路是：


    35+设计师被裁后出路是什么？


    解决方案：挖掘自己核心优势，通过流量放大个人价值，转化目标客户，达到一定收入。


    这个解决方案就是一个产品，有目标群体，有需求价值，就有赚钱的路径。


    这个有商业价值的解决方案路径总结一下就是：


    +   1、挖掘用户需求（需求）

    2、根据需求创建解决方案或产品（产品）

    3、找到有付费能力的目标用户，让他们知道这个方案或产品（引流）

    4、成交转化目标客户（收入）


    # 3、努力不等于赚钱


    普通人习惯用战术上的勤奋，来掩饰战略上的懒惰。


    努力只是一个行为，这个行为不等于结果。很多人习惯低效率的勤奋，就是没有目标的悲量产，并苦苦日复一日坚持，盲目的相信大力出奇迹。'
