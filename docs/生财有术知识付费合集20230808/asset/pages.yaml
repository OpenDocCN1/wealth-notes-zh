  md: '![](img/00c8ed3105ac934755346b58149acc95_846_0.png)


    2020年疫情，我被困在家，无法前往澳洲上学。我自己开始在B站做自己的日常分享，就有了下面的账号【内森的日常】。我在里面会分享读书学习，正念冥想，英语演讲等内容，也会搬运一些外网的课程资源，逐渐开始形成了第一波粉丝群体，吸引了同频的小伙伴关注。


