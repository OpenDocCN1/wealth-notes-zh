  md: '# # (精华帖)(78赞)互联网项目培训从业者保姆级教程


    作者： 黄勤文


    日期： 2023-01-03


    大家好我是黄勤文，第九公社联合创始人。之前分享的2篇文章《视频号三千粉、内容规范、违规、官方认证等技巧分享》以及《互联网小白上岸避坑指南》在圈友中反响良好，今天我写下了这第3篇文章《互联网项目培训从业者保姆级教程》，这篇是从知识付费培训老师的视角去分享心得。全文一共1.2万字，内容有点长，希望大家耐心看完。


    我从2019年大二开始带队抖音培训，连续做了4年的互联网项目培训，目前我团队积累了几千个学员，项目交付效果获得97.8%的好评率，也帮助了很多普通人在互联网上稳定赚到钱，见证了很多人从新手到老司机的蜕变。


    培训本身是一个不讨喜的职业和工作，容易背负骂名，被视为“割韭菜”的“镰刀手”。培训做得不好容易损阴德，甚至赔上自己的职业生涯。


    但是相对应的，现在越来越多的行业大佬都入局知识付费行业，卖起了自己的课程和社群，比如分众传媒的江南春、新消费王岑等等老师。这也说明培训行业受到了强者们的肯定，并且成为普通人向上管理和晋升的重要途径。


    从业培训行业4年，我虽然没什么大成绩，但是今天想把自己一些比较好的培训心得分享出来，给培训新手做个参考，期待更多有格局、有职业素养的培训老师的诞生！


    # 一、培训行业火爆的原因'
  merge: -1
  img_proc: true
- pgno: 997
  md: '+   1.讲师的自我成长。最强的学习方法是费曼学习法，最好的学就是教别人，你在教别人的过程中，也在一遍又一遍重新梳理认知和经验，最后讲师自己就成了行业专家，获得自身成长。教别人的过程，本身就是自我成长的过程。


    +   2.轻资产模式。培训不需要像传统行业那样，砸几十万开店和投入巨大成本和风险，只要后端培训交付做得好，讲师团专业度有保障，就可以引流收钱，利润率很高。而且费用是提前预支的形式，等于是先收钱后干活，这点跟理发店充卡是一样的。


    +   3.普通人向上晋升的通道。做培训具有极强的积累性，你做10年培训下来会有很多精准的学员数量，做生意的核心要素就是用户数，当你手上有“人”时，做什么生意都会顺风顺水，能够增加一个人连续成功的概率。并且在对外社交时，培训老师的身份就是你最好的社交名片，能够在外面撬动很多资源和帮助，良性循环。


    # 二、培训行业现有不足


    +   1.培训从业者良莠不齐，90%的从业者都想纯割韭菜，入这一行之前没有经过系统的职业素养和职责范围学习，缺乏对于用户的敬畏之心，什么钱都想赚。


    +   2.培训付费用户甄别能力有待提升，连最基本的哪些团队的项目交付靠谱还是不靠谱都无法判断，只凭别人的一张收益图就敢贸然付费入场。


    +   3.更多的这里就不列举了，懂的都懂。


    # 二、培训后端交付体系'
  merge: -1
  img_proc: true
- pgno: 998
  md: '根据我对“培训的交付性”的理解，我列举了5个最重要的组成部分，分别是课程、微信群优秀学员分享、直播连麦辅导和保姆式解决问题。我团队目前全部执行了这5个部分。


    一个基础的项目培训交付体系，最少要包含下面罗列的1和2。目前市面上大数数是只有1，其他的4点都是缺乏的。你们带队培训的时候，自行做加法或者减法，根据自身实际情况来。


    新手做培训，不一定我这5点全部要做到，但是如果你真的全部都做到了，并且项目也是跑通了，那么项目交付水平起码也是95分了。


    # **1.基础课程**


    这个不用说，如果连课程都不做，或者直接发别人的课程，那肯定是割韭菜。做得好不好是一回事，你有没有花时间用心去做是另一回事。


    # **①思维导图PPT**


    录课程之前最好做出详细的思维导图或者PPT课件，这样录课程的时候会减少磕巴，思路更加清晰流畅，这方面可能需要占你做课程总时长的50%。思维导图用Xmind软件来做就行。


    # **②真人出镜**


    课程属于讲师的原作品，能真人出镜的尽量真人出镜。如果一个讲师没有勇气露脸和真人出镜，那么他的发展会非常受限制。当然，如果你是奔着割韭菜走的，那么你露脸会增加风险，现在人脸识别功能很强大。'
  merge: -1
  img_proc: true
