  md: '主要是用户巨便宜，当时我平均一个进群用户的成本在 5 元左右，注意，是垂直的兴趣粉，不是泛流量。


    而同期，是幼儿教育赛道和 K12 神仙打架的几年，当时优质的母婴流量从几十一个快速攀升到一两百我当时这个项目整个的启动资金，仅仅是小鹅通的平台费 + 找老师录制的体验课费用（最开始卖期货，有体验课和长期课大纲就开始卖）+
    第一个月的投放费用，整体成本不超过 5 万，就滚到了第一年营收两百多万。


    我总结这一切得益于我前前几年做幼儿赛道的经验，可以说如果做过 K12 或者幼儿教育，进到老年赛道，那些做课方法、服务方式和营销手段简直是降维打击。


    最近两年，随着大厂商入场来普及用户认知，更多的垂直方向的知识付费都迎来了更大的机会。


    # Part04


    咱们不能说一提到银发赛道，能做的项目就都是开个养老院、弄点高毛利的保健品、走步送鸡蛋、针灸广场舞等。


    现在的银发族可不像前几年了，移动互联网都发展多少年了，现在大部分赛道都可以银发人群重做一遍的，银发族的社交、健康、衣食住行、兴趣爱好、线上工具等，很多维度都蕴含着很大的机会。'
