  md: 'B2B的人不知道自己需要知道。让他们跟竞争对手产生差异化。价格战不是卖十万的产品卖一万，是这个行业的对手被我们杀没了，改变了产品的形态。解决了用户同一个需求。


    我也凭空想不到这个，我也是通过用户的反馈想到这个，我们原来容易想当然。你可以理解为这是一个信息，但不是别人能告诉你的信息，


    因为别人整合不出这个信息的价值，这是你在你这个行业里面发现了这个信息的价值，这个用户群是很大的，这又涉及到你用什么样的商业模式去变现，米课最早做的模式，米课做了十年依旧没倒。


    你这个模式的设计，就决定了你这个钱能赚多久。学我们的也有，但是活不过两三年，模式出了问题。


