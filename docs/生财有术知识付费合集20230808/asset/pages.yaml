    74.5%）


    第二步：从定位开始拆


    IP 万能公式：为 3-10 岁左右孩子家长，提供 10-200 元平价书及 1000 元以上套装书的推荐服务，以满足这个年龄段的家长（通过买书给孩子看或者亲子阅读）培养孩子让孩子更优秀的需求。


    这个是我当时拆解“清华妈妈马兰花”的部分内容截屏


    我的心得就是一定要多拆几个，你会发现用上面那10个问题拆同行拆的多了，你就知道了这个行业类目下的大概玩法。这个玩法你总结出来，才知道你自己能不能做好。


    （就像我当时一开始是准备做带书的，然后拆了几十个对标之后，发现原来带书真正赚钱的只是头部博主，中腰部赚的其实都不咋样。而且直播带书是需要团队运营的，没有团队基本上玩不起来。同时，因为要涉及到供应链，你的供应链谈判能力要够强，或者你是大号或者你特别能卖，你才能拿到一手货源和信息，这些要求对新手其实都不友好，也是我后面放弃这条路径的原因）


    第三，了解好同行有了细分定位之后，就要明确自己的IP定位。'
