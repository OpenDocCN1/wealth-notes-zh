  md: '引流产品：比如小样/中样体验装，一方面能作为引流的钩子，另一方面，客户体验后觉得不错，就很容易购买正装产品


    信任产品：比如面膜、面霜等口碑很好的爆款产品，客户体验后，觉得超预期，不断回购，且愿意付费更高价格产品


    利润产品：比如精华、套装、胶原蛋白肽等，利润高，且容易形成周期复购


    如果你是做微商，比如减脂类产品，那么产品形式有：


    引流产品：比如小样/中样体验装，或者99元减脂打卡营，可以获得一份体验装产品，同时在社群里，会分享减脂干货，用户在群里满30次一日三餐的减脂餐打卡，可以退还99元，同时还可以获得一份赠品，购买正价产品可以带走这份赠品


    信任产品：比如减脂产品套餐，客户买回去后，你可以给到一些针对性指导，他体验不错，就很可能升级你更高价格的产品，甚至升级为代理商


    利润产品：比如代理商，成为事业合伙人，这是主要的利润来源，也是你应该重点花精力的地方


    总结一下5个关键点：


    （1）如果你的流量有限，想高变现，那么得要有高利润产品，不要只卖低利润产品'
