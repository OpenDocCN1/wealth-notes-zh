- pgno: 1000
  md: '![](img/00c8ed3105ac934755346b58149acc95_1000_0.png)


    # ⑤ 向下兼容，通俗易懂。


    在讲课的难度控制方面，你千万不要高估任何人的理解能力，很多知识点和认知只是你自己知道，你的学员都是一无所知的。如果他们都 知道的话，也不需要给你付费了。


    所以在讲解的时候，你要把学员当做幼儿园的小朋友那样对待，起码要像白居易那样做到通俗易懂，最好达到一个学员只要听得懂中文，就能 听懂学会你的课程的地步。


    你也不用担心自己说的过于白痴和啰嗦，录制课程最方便的一点，就是学员可以拖动进度条，选择性的听讲，查缺补漏便捷双方。


    # ⑥ 不定期更新课程'
