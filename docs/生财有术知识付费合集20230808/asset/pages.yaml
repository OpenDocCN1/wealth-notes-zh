- pgno: 116
  md: '# 一、学员成功


    生财有术的兰卡老师在知识星球分享过：训练营的指标是数量*口碑。


    数量，是指你影响了多少人，比如有多少人加入；口碑，是指让想学想干的人真正学到一些方法，拿到结果。


    好口碑的关键是打造好案例，而打造好案例的关键是筛选好客户。


    因为想大幅改变一个人很难，但是可以找到离改变就差一口气的人，给他临门一脚。


    顺下来就是：「高潜学员→学员成功→有口碑→训练营/大航海成功」


    这很像很多高中的搞法——「掐尖子生→考上清北北大→学校名声大振→学校越办越好」


    说到这，大航海/训练营的「底层逻辑」，应该聊得比较透了。


    作为大航海志愿者，我们真正能影响的，是「学员成功」这一环。


    因此，通过优化「督学陪伴」促进「学员成功」，是志愿者最重要的交付。


    「学员成功」不做好，其他的花活儿大概率是无用功，如果可以，一定要聚焦。


    | 学员成功（打造好案例） |

    |---|---|---|

    | 过程指标 | 过程内容 | 评分标准 |

    | 反馈成果 | 打卡数量 | 带人数量 | 督学陪伴 | 督学打卡 | 评分标准 | 过程性反馈 | 结果性反馈 |

    | 7月份 | 带1名学员打卡 | 打卡数量 | 带1名学员，打卡3天 | 带1名学员，打卡5天 | / | 打卡数量 | 学员+打卡+反馈 | 及时完成打卡任务5次以上，完成打卡
    | 更多成果... |

    | 8个月 | 带3名学员打卡 | 打卡数量 | 带1名学员，打卡3天 | 带3名学员，打卡5天 | 督学陪伴 | 督学打卡 | 学员+打卡+反馈 | 完成打卡3次，学员...
    |

    | 10月份 | 带5名学员 | 打卡数量 | 带1名学员，打卡3天 | 带5名学员，打卡5天 | 督学陪伴 | 督学打卡 | 学员+打卡+反馈 | 完成打卡10次
    | 优秀志愿者分享一次，或推荐学员 |


    # 二、学员/志愿者自驱


    《驱动力》一书说，驱动力已经经历了3个阶段：


    +   在驱动力1.0时代，类似避险、寻求饮食之类的「生物冲动」是主要的驱动力；'
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   ● 在驱动力2.0时代，胡萝卜加大棒即奖励与惩罚成为驱动力，这建立在「工作本身没意义」的基础上，解决机械性问题；

    ● 而在驱动力3.0时代，自主、专精和超越自身的渴望成为驱动力的三大要素，这建立在「某些工作很有趣，很有挑战性，需要大量探索工作」的基础上。


    这意味着面对一件真正有挑战性的事情时，我们驱动员工/学员/志愿者的核心做法应该是：


    「充分信任他，放手让他去干，并给他提供充足的资源」，并且引导他在技能上臻于郅治，激发他不断超越自身，达到新高度的渴望。


    简而言之：当我们希望他能完成一件重要的挑战时，请给他充分赋能，引导他充分自驱。


    ![](img/00c8ed3105ac934755346b58149acc95_117_0.png)


    不同于一般训练营，大航海更多是探索，真正是一件重要的挑战。


    因此，不存在一套万年不变的SOP；过往所谓的成功经验/方法论，也不见得适用于新的航海。


    我们的工作重点，应该是营造一个能够激发各种内在心理需求的环境。'
