- pgno: 889
  md: '# 面试真题


    # 2022年6月18日安徽省巢湖市事业单位面试题


    1、现在很多年轻人选择当外卖员、送快递，没有人愿意去工厂当工人，导致制造业招工难。造成这种现象的具体原因有哪些？


    2、单位开展“四史”学习教育活动，领导让你统筹规划，你怎么做？单位有同事因为工作繁忙不愿意参加，你怎么劝说？


    3、有群众情绪激动，来单位反映同事办事不认真，让他跑了很多次。你恰好看见，你会怎么做？


    发面试真题笔记的时候，会有考生在评论区咨询面试题目怎么答，我就在评论区认真回复：这个题目怎么建立框架，从哪些角度思考，怎么展开这道题。


    这个时候就会有个问题，小红书评论区最多只能发300字，我写的解析很长，还得分段发送，感觉花了很多时间在评论区的回复上，也太浪费时间了，而且性价比不高。


    所以，这个阶段，只持续了一周左右。'
