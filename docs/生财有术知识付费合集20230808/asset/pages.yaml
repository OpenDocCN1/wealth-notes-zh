  md: '今晚的分享马上开始喽，各位小伙伴赶紧拍好小板凳，邀请来了我们非常优秀的问卷调查学员，Shen 同学！


    Shen 同学入群8个月以来一直坚守在问卷项目，横跨手机端和电脑端两个历史阶段。目前他每天晚上利用下班2小时操作月入5000，时薪80元+，并且创造性发现了同步器8开的方法，他是工新副业群体优秀代表！


    Shen 在批量化矩阵操作方面非常坐得住，之前在我们视频号带货项目最高一天利润1600元，属于做项目连续成功者，很值得普通工薪族学习！


    准备好了的小伙伴回复一波666，回复的越多，今晚分享得越精彩，8点准时开始，接下来的时间我们交给Shen!


