- pgno: 336
  md: '写投稿的第一个月，我在潮流号的第一篇过稿：7 万阅读


    +   - 演员刘亚仁 ([https://mp.weixin.qq.com/s/5BbxGojjdeIvs8yjaC1NbA](https://mp.weixin.qq.com/s/5BbxGojjdeIvs8yjaC1NbA))

    - 辣妹Kelsey Calemine ([https://mp.weixin.qq.com/s/0BlePIOQ9NmYtG52IjpPEHQ](https://mp.weixin.qq.com/s/0BlePIOQ9NmYtG52IjpPEHQ))

    - 盘点文 ([https://mp.weixin.qq.com/s/BPwVKsc4eP4Xse60tWlkAa](https://mp.weixin.qq.com/s/BPwVKsc4eP4Xse60tWlkAa))


    实战对于新人很重要，直接面对市场。在实战中积累写作经验，和编辑一对一沟通，比写文自贤进步快。


    # 2. 问：新人投稿如何权衡稿费高低和影响力？


    各家大中小号稿费有差异，小号稿费一般 200-300，少数 500-800，大号稿费通常 500-2000+。


    新人投稿，我的观点是初期不追求高稿费，而是追求过稿篇数和影响力，因为文字变现是个细水长流长期的事，而且这个圈子做越久越吃香。


    有一定过稿经验，输出稳定的，有自己喜欢的号可以先投，或者持续向几家大号投稿，没有过稿经验的，初期以积累过稿篇数为主，写新媒体适合越级打怪，不建议一直投小号。接着以过稿大号和出爆文数量为主，这阶段以追求稿费性价比和融入写作圈子为主。'
  merge: -1
  img_proc: true
- pgno: 337
  md: '先从投大平台号做起，大号没过再投小号，有时因为选题的缘因，新人有机会大号过稿。玻璃心的，先从阅读量 1000-3000 的号开始投。先积累信心和过稿经验，再向中号大号发起挑战。


    # 3. 海投的真正意义：


    有的新人投稿为了追求中稿率四处海投，被拒收后沮丧。在我看来，海投是用来筛选合适的账号，本质是前期试错。而不是胡乱地投，会被编辑拉黑。


    通过海投筛出适合你的写作水平，并且编辑欣赏你的账号。


    **我是如何从新人写稿变现起步的：** 我先写出一篇稿，得到一家潮流号试稿，还拿到另一家同类号的多份约稿：


    那时我拿着第一篇长文《陈冠希》一家家投，由于选题没有大热点，文章倾向粉丝向，屡次被拒。


    这篇文章原本只是打算试水市场，那时我是一张白纸的新人，对过稿压力来源于想证明自己的写作能力可以。


    # 4. 如何找收稿号：


    新榜公号榜；微信搜征稿函；或者在各家号菜单栏输入“投稿”看回复；日常点赞文章时，弹出的系统推荐阅读号；朋友推荐。'
