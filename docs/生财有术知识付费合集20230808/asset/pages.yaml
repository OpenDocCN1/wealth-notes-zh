  md: '那后来我又做了什么呢？我做了盖洛普优势测试，书写了近 20 年的成就事件，写了一段时间的优势观察日记。（图）在这个过程中，也回想了很多具体的事件。于是我发
    现，我的优势大概是：


    +   名校背景做家庭教育，让人觉得信任度较高


    +   我更爱分享和讨论家庭教育话题，生活里每天发生那么多事儿，我就关注家庭教育话 题多，愿意为此写点啥或者说点啥，并且希望更多人看到听到，当然，在这个过程中，
    收到了很多反馈，这让我知道，有一些人原因听我关于家庭教育的分享，有问题愿意来 找我帮助他们。


    +   在帮助家长教育好孩子，缓解自身养育焦虑，解决实际问题这事儿上，收获的正反 馈，让我特别有成就感、满足感、价值感。


    比如，有家长反馈，孩子从每天睡前要看动画片，变成了每天睡前主动拿绘本让妈妈 读，比如，有朋友因为跟老公教育理念不合经常愎气，到放下焦虑跳出了抱怨，比如， 天天因为孩子写作业墨迹忍不住上火发脾气，到找到了解决问题的办法然后母慈子孝.....


    这些反馈都让我特别开心和满足。这些正反馈，一方面说明我有能力为别人解决这方面 问题，另一方面，也说明我的满足点在这里，我可以专注持续的做法下去。


    +   也因为擅长学习，关联能力比较强，细心，对喜欢的事情能深入研究，这些优势，使 得我在分享和讨论家庭教育问题的时候，能够做到学以致用，而不是空谈理论。


