  md: '所以，提升认知，就要把自己原有的圈子撕开一道口子，打破这个舒适圈，向外链接更多的信息，付出实际行动，来改变固有的思维习惯。


    # 5、如何开眼？


    赚钱不是越来越难，而是没有找到机会，机会真是到处都有。世界远比我们想象的大，有那么多我们不知道的东西，哪怕只是旁观学习下，也觉得受益匪浅。


    为什么需要开眼？


