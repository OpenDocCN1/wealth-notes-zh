- pgno: 1001
  md: '不要想着录制一次课程就一劳永逸，那是不可能的。项目每隔1-3个月都要更新玩法，或者有些变化最大的行业比如短视频带货，可能一个月要数次更新玩法和教程。


    多去主动积极更新迭代，自己革自己的命，比被同行革你的命更好。没事就有多去超越自己，一直保持最前卫的玩法。


    同时你多次更新迭代的行为，也会被学员看到。自己付费的老师这么负责任，他们也会感动和受鼓舞，各方面都产生良性循环。'
