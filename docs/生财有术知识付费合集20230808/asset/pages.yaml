    # # (精华帖)(186赞)体制内从 0-1 突破舒适圈，

    副业年赚 20W+ 的心得


    作者： 爱折腾的土豆妈


    日期：2023-03-22


    时不时会看到一些朋友在搞副业、赚钱的时候，总有很大的焦虑、犹豫，比如朋友圈不

    敢发，怕领导同事发现；微商不敢做，卖货不合适；视频不敢拍，露脸不太好……


    体制内、公务员、一些特殊工作岗位，总有这些那些的顾虑，这些包袱越背越沉，甩不

    开严重阻碍了前进的步伐。如果你也有这种困惑，不妨看看这篇，土豆妈用自己的实战

    经验分享，帮你开拓一下思路。


    # ## 【个人介绍】


    我是爱折腾的土豆妈，一个爱折腾房子的专业幼教，上海公办幼儿园体制内的幼教，工

    作14年，中层岗位分管招生等工作。5年内买卖房子6次，装修改造3套。


    [职场宝妈5年6次房屋买卖赚百万的血泪经验](placeholder_link_1) 万字长文复盘，有兴趣的可以看看


    https://tzsxq.com/0cE7ISGkM'
  merge: -1
  img_proc: true
- pgno: 262
  md: '# # 【副业介绍】


    # 1、进口母婴海淘


    2012年孕期的时候开始尝试的项目，纯粹是从自己想囤货，朋友圈找人一起拼单，口碑相传，自己从国外网站海淘采购、国内销售，边买边卖赚了第一桶金，养娃的一切开支都是靠海淘赚来的，具体赚了多少也没细细算过账。由于一些原因，大概在18年左右就慢慢停了所有业务，现在想想当时解散了一个超高复购率的300+精准客户微信群是多么愚蠢的事情。


    # 2、民宿个人房东


    斜杠的民宿房东，手上最多的时候也就4套房在运营，目前2套在运营中，个人小房东。盘活了一下自己家的郊区房和40平学区房，房租收入实现翻倍。


    过去的三年非常艰难，民宿圈里也淘汰了相当多，尤其是过去一年日子确实不好过，好在都熬过来了，从2022年12月慢慢恢复。2023年3月最近的20天单一个平台的房租收入已经7000+。'
  merge: -1
  img_proc: true
- pgno: 263
  md: '![](img/00c8ed3105ac934755346b58149acc95_263_0.png)


    # 3、 家居社群创始人


    2021年6月开工装修自住二手房，同步开通了装修围观群，2023年2月把群从免费群升级成付费社群，有了第一笔社群付费收入。一周拉新了30+，目前社群成员120+，199限时优惠中。


    # 4、 一对一咨询


    2022年年底开始尝试私人咨询服务，主要是房产购买、学区规划、装修建议等方面，从一开始不收费，到红包随意，再到199/h，最近涨价到单次999/3h。把自己的时间和精力越卖越贵。


    就在前几天接到了 紫菜 大神圈友关于房产、装修方面的咨询，体制内怕啥，跨领域的知识付费真的可以！'
