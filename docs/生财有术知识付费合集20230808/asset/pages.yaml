- pgno: 212
  md: '# 一、我做最小 MVP 测试产品的过程


    在腾讯游戏内部，一个产品要正式上市之前，会经历立项、很多次的测试（内测、封测、公测），用户调研、数据分析、用户留存、付费率、不断调整，反复验证才可以正式公测。


    那我们知道知识付费也是产品，也一样需要做选方向（选题）、立项（定选题）、用户调研、市场分析、测试。


    我在做知识付费课程之前是做营销策划的，营销策划的特点是喜欢做用户调研和数据分析，洞察用户的真实需求和分析市场需求。


    我在做第一个正式的录制课程之前，其实我做了很多个测试型的知识付费产品。


    # 1. 免费公开课


    最开始，我也不知道自己可以做什么产品，我看到别人做知识付费一个月十万，我垂涎欲滴，但是我作为一个「刚失业」的职场妈妈，没有粉丝没有流量，怎么办呢？


    当时有唯库、职场充电宝等一些职场平台，最开始想到的是积累讲课案例，积累讲课经验。因为虽然我在腾讯负责过培训工作，但我实际上是没有讲课经验的，于是我就毛遂自荐当讲师，免费给别人讲课。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '当时，我每个知识付费平台的公众号都会去留意看有没有申请讲师的，申请讲师需要写清楚你的工作经验、擅长的领域，讲课经验或者有没有现成的课程，大家要提前思考一下。


    我申请了好几个平台，第一个联系我的是职场充电宝，我和他们的运营一起碰了一下分享方向和分享时间，我结合自己的工作经验想了一个选题叫做《如何策划一场刷爆朋友圈的营销活动》，当时有
    1600 多人听。如果你拿捏不准，请你一定要认识几个知识付费平台的运营，多跟他们聊天，是问一下最近什么课卖的好，什么课有市场。


    # 2. 付费咨询（699 元 1 小时）


    我申请了在行的行家，设置了 2 个话题：


    +   - 如何转型互联网

    - 如何线上线下营销


    这两个话题都是几百块一个小时，两个对比下来，如何线上线下营销约我的人更多。


    约我如何转型的大部分是传统行业想转型互联网的职场新鲜人，约我线上线下营销的要么是公司里的营销策划要么是创业者、老板。


    我们通过单个的付费咨询，其实也可以洞察你的「产品」有没有人愿意付费，他们付费以后你可以通过问答聊天，了解到你客户都是什么样的人群、他们的真实痛点，以及你能不能很好地解决他们的问题。


    通过付费咨询，我发现我不是很喜欢解决小白的转型问题，但是对于怎么做营销、怎么获客、怎么转化，我特别信手拈来，那说明这是一个好的方向。'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 3. 付费授课（1万1小时）


    通过几次免费分享，有更多的平台看到了我，虎嗅和91运营联系到我，愿意付费1万1小时邀请我讲课，讲课的方向是运营，听课的人是多少钱我忘记了，最后是2个小时分了2万多给我，但是课程反馈不是特别好。


    通过这个产品，我又发现我的价值，很多人想学习运营知识，提升自己的职场技能。但是这块我不是很擅长，我自己做起来有点吃力，也不是我很喜欢方向。


    所以pass这个方向。


    # 4. 19.9元21天打卡付费社群


    我看到有人做时间管理社群和时间管理打卡社群，我觉得很简单，这个时候，公众号和微信都积累了一些粉丝。我试了一下招募，居然有几十个人付费。但是运营下来其实我并不是很享受，所以这个产品，后来也被我pass了。


    # 5. 99元销量10W+营收1000W+


    如果我们没有做课经验，一上来就想做一个大而全，又贵又好的课程是不现实的。


    第一你没有经验，第二你没有案例，第三客户需要漏斗，第四你需要验证你的策划和进行进一步的数据分析，所以我们最佳的选择是先做一个最小可行性（MVP）课程产品。


    我们创业要去很远的地方，不是一上来就先选汽车，先做轮子再做车身。而是先做一个滑板车，先跑起来，再换单车、摩托车、汽车。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '![](img/00c8ed3105ac934755346b58149acc95_215_0.png)


    ![](img/00c8ed3105ac934755346b58149acc95_215_1.png)


    所有的产品都需要测试验证，最小的验证方法，就是通过引流课、公开课、付费咨询的方式，30 分钟到 1 小时。大家也可以参考我在做第一个录播课之前那 4 个 MVP
    测试的经历，如果有粉丝积累也可以通过直播验证。


    设计公开课/直播海报，通过朋友圈/社群宣传，看看有多少人对这个公开课/直播感兴趣，如果来的人很多，恭喜你，这个选题很好。如果来的人很少，最后还没什么人愿意为他付费，那么你就得调整，通过和粉丝、学员、用户聊天、访谈等方式挖掘他们最迫切需要的。


    我最早验证朋友圈课程可行，是综合了几个数据：


    +   * 我做了一场 1600 人的 45 分钟公开课，说明需求是存在的；

    * 偶然发现有一个人单节 45 分钟的朋友圈课程卖了 1000 多份，验证大家愿意付费；'
  merge: -1
  img_proc: true
- pgno: 216
  md: '+   - 发现一个线下的企业内训老师，他一年 260 天都在上课，90% 都是微信营销，企业花几万一天请他讲课；

    - 当当京东上微信营销的书卖的很好，还有人出了系列书。而知识付费平台目前并没有成体系的课程，微商自己做的课程则都是内训，并且授课质量很低，都是文字语音+图片，没有很好的理论体系知识体系；

    - 在荔枝微课测试了 banner 和大纲，连课都没有，转化率在 30% 以上，数据奇好，于是才开始做课件。


    所以，你也可以先做一个海报，咨询、直播都可以，看看朋友圈有没有愿意咨询、付费。有人愿意付费了，再考虑下一步。不要一上来就开发一个课，花了几个月开发了几十节课录好了发现没人买，这就太尴尬了。


    # 二、如何打造爆款课程


    如何打造爆款课程，我总结起来有以下六个步骤。


    +   - 第一：选题定位——选题 90% 决定了你的课程能不能卖得好。

    - 第二：数据分析——市场分析、用户调研都做好了你才能找到一个能爆的选题。

    - 第三：用户调研——如何让你的课程更符合学员预期，如何拥有高满意度。

    - 第四：内容填充——体系的知识理论模型、契合的案例、PPT、实操练习。

    - 第五：MVP测试——转化率怎么样？市场反馈怎么样？有人愿意买吗？

    - 第六：营销推广——如何让你的课程卖得更好更多。'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 打造爆款课MVP流程


    ![](img/00c8ed3105ac934755346b58149acc95_217_0.png)


    # 1. 如何进行选题定位


    前 4 个测试产品测试下来，我发现，我最擅长、最多人买单、我最喜欢的，就是营销。但是营销这个领域这么大，我肯定干不过已经有名气的呀，于是，我就正式分析营销有哪些细分领域，我有哪些领域是可以进入的，我自己分析一圈下来就是微信营销。


    那么作为小白，你也是一样，要先分析自己的优势：


    你毕业于哪个名校？不是名校有没有在哪个名企工作过？没有名企工作过有没有为名企服务过，有没有名企客户？都没有的话，你有没有在哪个领域做出过什么成绩？有没有经常被人夸的地方？参加过什么培训，拿过什么证书，哪个领域有多年的经验？会买房？会理财？懂财务？英语特别好？特别会聊天？求职能拿很多
    offer，面试特别厉害等。


    每个你觉得没什么了不起的地方，其实都是有需求的。你觉得很简单的事，可能别人觉得特别难，觉得你特别厉害，所以你的优势是需要梳理的。'
  merge: -1
  img_proc: true
- pgno: 218
  md: '当然，也不是所有的优势出一门课程都能卖得好，这是一个事实。因为有的知识特别小众，受众面不广，但是作为想做课程的人，他往往当局者迷，因为掌握的数据不够多，导致可能做了几个课程发现都不火。


    一个课程能不能卖得好，跟它的受众、市场需求、热点有关。比如瑜伽课和杠铃课，副业课和 Java 课，受众和需求就有很明显的差别。


    如果你想做一个爆款课，首先，你选的方向受众就不能过窄，最好能是大众，绝大部分人都有需求的。比如变美：减肥、瑜伽；技能：PPT、Excel、销售、文案；赚钱：副业、理财。


    但是这些我列举的关键词不一定是适合你的，你能做的。所以，还需要结合你的自身或者你的讲师，挖掘讲师身上可以讲的又需求大众众广的方向，刚好还切合当下的趋势和热点那就更好再好了。


    我们如何去挖掘这些关键词呢？你可以根据下面这张图写下属于你的关键词。


    可以从学习经历、工作经验、业绩荣誉、兴趣爱好、特长、成功经历这 6 个方向入手，写下 6-10 个你擅长能输出的关键词。挖掘自身的优势、经验、经历，看看爆款选题中是否有跟自己的经历经验背书背景相匹配的。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '![](img/00c8ed3105ac934755346b58149acc95_219_0.png)


    因为我在腾讯工作过，做过几次副业、卖羽绒服 8 天赚 5 万、24 岁通过信用卡买了 2 套房，我曾经做过地产置业顾问销售出身，在腾讯做的是 BD 经理，品牌营销传播等工作。


    我梳理的的关键词是：副业、时间管理、营销、销售、商业模式、信用卡、房产、社交、人脉、升职加薪、创业、新媒体、短视频、直播等等。


    注意：非常重点，梳理你过去的成绩、成果、经验，请数据化表达。


    +   *   几岁（多长时间）做了什么事得到了什么样的成绩

    *   你帮助过多少人做了什么事

    *   你过去服务过有多少客户

    *   过去在公司做出了多少业绩

    *   过去你在学习中多短时间做出了多厉害的结果

