- pgno: 30
  md: '够穷。极强的改变自己的驱动力。


    六、商业思维，投资思维，本质上是一件事情。


    用商业的思维去做投资，用投资的思维去做商业。


    做过生意的人会知道什么样的是好生意。当然好生意是有指标的，比如毛利率，现金流，可持续性。


    ROE是个数据指标，往住看的是过去的，判断一个企业高效指标。一个好的商业模式，数字是不可以给你答案的。但看不到企业未来的发展。


    好的商业模式可以穿越很久的商业周期，不是单纯一个ROE看得出来。


    具不具备可穿透的可持续性。


    # 02 10万 投机，N万 投资


    当你认知提升的时候你才能变得钱多。


    当你钱很多的时候你的认知在各个维度是有提升的。


    当只有十万的人去质疑有更大财富的人的投资方法的时候，不适合自己，太慢的时候，他的理解力根本无法拥有下面这个段位的人的财富。


    想变慢还要问问自己有无资格变慢。


    我劝人不要炒股。他能通过十万赚20万，他的认知没跟上，他永远赚不到N万这个级别。


    投资的效率不如创业。


    投机是快生快死。投资是慢。不会让人暴富。


    投资是复利，过十年二十年你看到惊叹的回报，我也五十岁了我要这钱干什么。


    大道至简。很多人不相信，对所有事情不相信，


    我相信符合逻辑的东西。'
