- pgno: 96
  md: '那细分市场是什么？就是消费者们的消费需求。


    咱把细分切的越细，就越能让消费者明确的掏钱，譬如教育市场，有学龄前，有K12，还有考研考公各种细分，但是我如果说是做小学生教育的，那这个类目还是太大了，对于家长们来说，你跟我说我是做小学生教育的，那就等于啥也没说。他没办法在脑海里给我们做个定义，那他就没理由为咱掏钱。


    所以，在细分市场定位上，我觉得有个小小的诀窍，咱可以去做逆向工程，我们去看我们的对标，像我当时就在抖音上搜索了几十位在我当时看来跟我定位差不多的博主，我去拆解他们，带着这几个问题去拆解：


    +   1. 他们是谁？（他们给自己贴的标签）


    +   2. 他们的专业能力是在哪里？


    +   3. 他们的标签和专业能力是如何挂钩的？


    +   4. 他们是如何火起来的？（这个很难复原，但是靠抖音视频能看个大概）


    +   5. 他们的加分项在哪里？


    +   6. 他们的目标群体是谁？（目标群体一定要够细，细化到年龄、省份、收入、职业、收入这些）


    +   7. 他们是怎么实现商业闭环的？


    +   8. 他们的定价如何？


    +   9. 他们的利润如何？


    +   10. 他们的产品解决了什么问题？'
  merge: -1
  img_proc: true
