    # 中药有什么推荐


    +   - 分享我个人的经历：身边好多七、八十岁，八九十岁的老人都因为新冠而走了，还有能够住进医院的，现在还在医院里没恢复。


    +   - 我们用的是京都念慈庵川贝枇杷膏，二陈丸，加上自己炖的冰糖果。


