- pgno: 356
  md: '在保证正常写作频率，输出有深度有观点的质量文的同时，适当接单一些流量文赚稿费。经验不多的人写流量文一个月 2000-3000 块，一年下来也是一笔钱。


    # -03-


    # 用流量思维积累粉丝，用内容扩大影响力，


    找到合适自己的圈子，让更多知道你


    我在文章的前半部分主要是分享如何快速投稿变现，积累代表作，如何和编辑打交道，新人初步建立自己的写文人脉圈子。


    接下来，我提一个问题，你想每月用文字赚多少钱？


    一个人的精力有限，就算不睡觉，每个月能写出的文字量是固定的，同样是写文字赚钱，为什么有的人每个月只赚到一点钱，有的人赚几万呢？


    单纯靠文字赚钱，没有圈子资源支持的话，赚的钱是很有限的。一个写作变现半年的人，如果只是写几个号的稿而不从圈子资源来裂变赚钱途径，每月变现的钱大约 1000-6000
    。


    很多人只是闷头写稿或者自己写平台赚钱，没有和编辑，平台运营交道的意识，没有把文字变现做大的打算（可能每月赚 5000 就满足了），或没有把文字赚钱作为长期的技能看待。'
  merge: -1
  img_proc: true
- pgno: 357
  md: '和编辑，平台运营打交道是其中一个了解市场的方式，其实也是敲开他们背后资源的途径之一。


    有流量思维的人和闭门造车的人，随着时间的推移，发展方向必然不同，成长速度和赚到的钱也差距大：


    闭门造车的人：不做推广，或者用传统花钱买流量的方式慢慢做推广。


    流量思维的人：借势平台或与**大v**合作，借力资源为自己赋能，用价值换价值。


    > 如果你长期用文字赚钱，从最开始就要有意识地用作品积累背书和打造私域流量，并加入一些合适的圈子，用写作技能结合你的专业领域来赚更多的钱。


    现在我讲讲新人如何用内容扩大影响力，一边用文字赚钱，一边结合个人优势和所处阶段找到合适的圈子。


    下面说的的方法也适用于新人学流量增长、品牌营销，视频营销等。


    ![](img/00c8ed3105ac934755346b58149acc95_357_0.png)'
  merge: -1
  img_proc: true
- pgno: 358
  md: '# 一、内容分发多平台：


    知乎，抖音，视频号，小红书等。无论是否过稿，日常写的内容坚持做分发，投稿过稿的内容在账号发表后，和编辑申请转载（简称“开白”）。


    # 二、有的账号有作者群，在你投稿账号过稿后，编辑会邀请你加入该群，可能经常有内部选题放出（有的号没有）。


    第一，进群增加变现的机会；第二，通过链接群友，发展成共同好友转介绍，有机会加入新圈子和推荐你链接新账号平台（资源优势度根据你所在的写作阶段和人脉质量而定），得到更多投稿渠道加快变现。


    ![](img/00c8ed3105ac934755346b58149acc95_358_0.png)'
  merge: -1
  img_proc: true
- pgno: 359
  md: '![](img/00c8ed3105ac934755346b58149acc95_359_0.png)


    图片是我在加入某号作者群后链接群友，从相知道相交，得到想要的收稿平台编辑微信。你要主动一点，用得到新朋友的形式做裂变获得新资源。


    # 三、和账号编辑，平台运营深度链接：


    第一是约稿量增多意味变现金额增多；第二是优秀者可能被推荐给其他号写，也是资源裂变的一个方式；第三是编辑引荐你做文字类的兼职工作，例如兼职责任编辑等。'
  merge: -1
