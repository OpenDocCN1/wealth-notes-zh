- pgno: 220
  md: '小结：课程无论是线上课，训练营还是线下课，选题定位是核心中的核心，第一步中的第一步。短视频也是一样，选题 90% 决定了这个视频会不会火。卖货也是一样，选品决定了能不能爆。


    # 2. 验证关键词，全网挖掘关键词并进行数据分析


    我在确定选题「微信营销」时，我同样还做了很多的数据分析、市场需求分析和用户分析，证明这个是市场上非常热的需求和非常痛的痛点，并且清楚知道这个课程的受众人群是谁。


    我们有了关键词，但是你并不知道他们的需求到底是个大哪个小，这个时候我们需要一些辅助的工具，帮助我们验证这些关键词的数据情况。


    大家可以列出自己的行业关键词，通过京东、当当、淘宝、微信指数、百度指数、阿里指数、线下企业内训等等找到属于你的行业的搜索爆款、销量爆款、需求爆款。


    如果一个选题只在一个地方火 不一定大火 但是大家都在用、都在搜、都在买、都有需求，那么他肯定会爆。人群、关键词也会反复验证，看看哪个关键词更好，类似百度指数。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# ## 数据分析


    有效的数据分析可以让我们的决策更准确


    ![](img/00c8ed3105ac934755346b58149acc95_221_0.png)


    比如我在做微信营销这个选题时，我通过微信指数搜索「微信」「朋友圈」「社交」「人脉」哪个的关键词更热。我通过搜索当当、京东、淘宝发现微信营销的书销量特别高，通过讲师网发现「微信营销」的内训课需求量特别大。


    我知道的一位讲师，一年讲 260 多堂课，就是讲微信营销，一年课酬几百万。但是通过用户调研发现用户认为「朋友圈」跟自己更有关系一些。所以正式的录播课程的选题定的是「你的朋友圈价值百万」「朋友圈营销」也是这个课最后卖了十几万份，销售额超过了
    1000W。


    在建立我的直播间的时候，搜索了副业、业余、兼职这几个关键词，哪个词更热。我发现副业更热，于是直播间的名字起的是「副业赚钱商学院」，这个直播间也成为所在知识付费平台比较爆款的直播间。


    当然，我认为这种成功是不可以复制的，但是经验是可以迁移的。我认为可以迁移的能力是：数据分析能力、搜索能力、成功案例的拆解能力、分析爆款共性的能力，最重要的是行动力，去测试最小
    MVP，不要怕试错。'
  merge: -1
  img_proc: true
