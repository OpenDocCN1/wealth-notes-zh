  img_proc: true
- pgno: 475
  md: '所以，你的产品设计应该有 三个梯度：引流产品、信任产品、利润产品


    那么，不同行业具体该如何设计产品梯度？我继续给大家举 3 个例子（注意，以下只是举例子，并不局限于此，不以偏概全哈）


    如果你是做知识付费类的，那么常见的产品形式为：


    引流产品：比如免费资料、9.9 公开课、99 元年度会员、知识星球等，作为用来引流的钩子，同时让客户对你建立初步的信任，愿意付费更高价格的产品


    信任产品：比如 1V1 咨询、训练营、年度付费社群等，这类中等价格的产品，客户体验后，觉得超预期，愿意付费更高价格产品


    利润产品：如私教、私董、弟子班等高价格产品，是帮你真正做利润的，不可或缺！


    就像我当时给自己设计的 3 个梯度产品：


    引流产品：免费的私域干货资料包、15 分钟轻咨询


    信任产品：1V1 咨询 500 元，28 天训练营 1980 元


    利润产品：全年私教 9800 元


    如果你是做零售类产品的，比如护肤品，那么产品形式有：'
