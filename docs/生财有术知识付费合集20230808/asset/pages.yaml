    # # (精华帖)(316赞)我的十年自媒体之路


    作者: Crossin


    日期: 2023-06-15


    各位星友大家好。


    本文是应小灰老师的邀请, 写的一篇关于自媒体运营的经验分享。


    算了, 下我做自媒体也有十年了, 确实也想做个总结, 但原本并不打算在现在这个时间点做。因为从结果上来说, 目前我的公众号流量大不如前两年, 加上一些个人原因,
    几乎处于半躺平式运营的状态; 另外我正在向视频方向尝试, 但目前尚处在起步阶段, 还没形成有效的流程或方法论。所以客观来看, 此时既谈不上是一个成功案例的分享,
    也不能说是失败案例的总结。'
  merge: -1
  img_proc: true
- pgno: 129
  md: '但择日不如撞日，来都来了，那就随便聊聊吧。讲讲我个人在自媒体方面的一些经历和由此得出的经验教训。


    分以下几部分谈谈：


    +   一、我的自媒体经历

    二、爆款内容复盘

    三、收入水平

    四、我做对了哪些

    五、我做错了哪些

    六、对新入局者的建议


    对了，先介绍下我自己的号：**Crossin的编程教室**。以Python编程相关的内容为主，包括教程、案例等。


    先讲讲我个人在这个过程中的一些重要时间节点和复盘。但其中很多情况跟当下已经不一样了，同样的操作现在恐怕很难复制。对这部分不感兴趣的朋友可以直接跳过后面的建议。


    # 一、我的自媒体经历


    粗略地理一下时间线：


    2013年 - 注册公众号，开始连载Python入门教程；注册知乎，回答Python、编程相关问题。'
  merge: -1
  img_proc: true
- pgno: 130
  md: '此时公众号刚诞生不久，算是偏小众，更谈不上什么商业模式，甚至“自媒体”这个词都还没有。但小众有小众的好处，只要你的内容确实不错且持续更新，很容易联系上一些大号帮你推荐。不少号主也会主动搜罗一些优质号进行推荐。


    而知乎在那个时候也是处在初创上升期，用户群体以大学生、刚毕业的职场人为主，内容氛围也不错，主要都是知识技能向。且早期对作者引流几乎没有限制，可以随意在回答里放公众号二维码。另外还有一点，当时百度对知乎的问答收录权重很高。所以综合下来，当时在知乎做技能向的内容分享，再引流到公众号，真的是一个非常大的红利时间窗口。


    接下来的几年，我本职是做游戏行业，公众号一直兼职在做，更新频率很低，但用户却在一直增长。期间接过两家广告合作，费用不高，差不多1k/次（甚至有家最后还有一期没给我结清），但也算是零的突破。


    # 2016年-开始全职做自媒体，年中推出付费服务，下半年开始注册公司、组团队、参与创业孵化。


    这个时候正是知识付费刚刚兴起的时候，移动支付普及，大众在网上付费的意愿大大增强，而机构还没有来及大规模介入这个赛道。当时还没有太多甲方投放公众号广告，所以只能想办法自己搞变现服务，一般是做课程或者训练营。知识星球（当时还叫小密圈）和生财有术都是这个时期出现的，我是最早期的用户之一。我的付费服务前后经过很多版调整，这其中也从生财有术里学到不少。


    我最早一版的付费会员推出时，甚至没有任何自己的课程，就是提供QQ群答疑服务。但当时放出的几十个名额直接被秒杀。这给了我坚持做下去的信心。'
  merge: -1
  img_proc: true
- pgno: 131
  md: '后来感觉有希望，就开始着手开公司、组团队。直到2017年一直在尝试团队化运营，想搭建一个从内容引流到培训服务的闭环。但个人经验不足，一直无法将团队作用充分发挥出来，反倒我个人的内容输出受到影响，两边都没做好。虽然总体来说没怎么亏，用户也在增长，但始终很拧巴，不管是对团队的小伙伴还是对我个人来说，感觉都不是一个好的状态，最终选择在2018年初解散了团队。


    # 2018年-尝试视频创作。


    此时抖音兴起，于是也尝试了一下短视频，竟然在一周后就做出了一个爆款，千万播放。但这个视频跟编程无关，且我在短期内也没找到可以跟编程很好结合的内容方向。与此同时，公众号的甲方投放开始井喷，于是重心依然保持在了公众号图文上，抖音就这么搁置了。


    # 2019年-有意识向视频转，但不够重视。


    这段时间，公众号的广告市场也很繁荣，甲方商单不断。这段时间可以算是做公众号非常舒服的一个时期。所以这时候又找到了几个小伙伴来辅助，其中大部分是远程兼职。


    继抖音之后，B站也由二次元逐渐出圈，我本人其实是B站老用户（准确来说应该是A站），但之前没想过在B站上也可以发编程内容，于是同抖音一样，起个大早赶个晚集。虽然也有过几期播放量不错的视频，但始终没当做主要渠道来重视。


    # 2020年-正式转为“自媒体”'
