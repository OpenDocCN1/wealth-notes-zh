  md: '# ## （1）第一阶段：发面试真题


    我第一次在小红书发笔记是在**22年的4月份左右**，当时我在微博搜索“面试”相关的内容，发现很多公考机构每天都在分享最新的面试真题，我就想着能不能做成图片的方式分享。


    然后我找了找作图工具，把真题做成了图片，同步发送到小红书、头条号、微博、公众号、知乎等各个平台，这段时间**只有小红书**反馈和互动最好，每天都有几百到一两千的小眼睛，有了这种正向的反馈，就一直激励着我更新面试真题。'
