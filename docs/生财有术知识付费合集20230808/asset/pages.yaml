  md: '所以新志愿者一定要主动抓住有经验的志愿者，结成一对一的帮扶关系。


    （此处欢迎链接，我的微信号是 yangchangpku，就是杨昌的拼音加上pku，我争取知无不言、言无不尽）


    另外，要高度重视往届船员的作用，从你所服务过的热心船员中发展自己的“幕僚团”。本届学员不仅是你的服务对象，也是你编织支持网络的重要一环，从学期开始前就应该重点研究和发展以下几类学员：年长且阅历丰富的船员、热心互动的船员、往届学员推荐的新学员、“生财”学霸。这几类学员通常更愿意为班级建设出主想办法，是很好的倚重对象。


    # 5、志愿者要想取信于船员，不是靠讨好，而是让他们被看见。


    必须让船员能感受到志愿者为他好、想他成、看见他的努力。他们就会愿意按照你的节拍，高质量地完成学习任务。志愿者点亮船员的标准动作包括：


    每个船员都应该至少经历一次一对一称赞（非居高临下的表扬），题材不限，只要是挖掘他的一个亮点即可。


    对突出船员进行群内的公开夸奖，典型的方法是作业的亮点提取，你不需要点评作业，你只需要完整地看一遍作业，把学员的名字放大，把其中的亮点提取出来即可。


    在知识星球的生财茶馆部分发自己的工作笔记，赞美船员。或者哪怕每天为船员/志愿者写一封汇报工作的日报，让他们知道航行的全貌和你的付出及思考，也别吝啬对表现突出船员/志愿者的夸奖。


    特别优秀的船员和行为，志愿者可以积极的、不停地向生财有术官方等推荐，为船员整理宣传案例，让更多人都能看到你支持的优秀船员。


    可以的话，用专门的文档记录小组一起完成过的事情，记录整个航程你们的成绩，在毕业的那一天作为一封峰终体验的信呈现给船员们。


    # 6、无论有多少具体方法，最重要的其实只有一条：没有任何道路能够通往真诚，真诚本身就是道路。


    对于志愿者来说，真诚的对待船员就是最好用的工具。真诚并不是一句口号，是有具体的行为体现的：'
