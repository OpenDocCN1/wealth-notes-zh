  md: '在进入家庭教育高级研修班学习之前，也知道教育不是随心所欲说两句那么简单，而是需要学习和掌握科学有效的方法，但这也仅仅就局限于有这样一个初始的简单的想法而已，自己并没有想过要去具体的学习什么怎么实践。


    正是因为没有具体的实践行动，所以每每遇到孩子的问题，不是批评指责就是发脾气训斥，很难以一个平和的心态去对待孩子，就像咱们课程里说到的，孩子犯错误了就认为孩子是错的，整个人都是错的，不懂得孩子只是做错了件事，而不是孩子是个错误的道理。随着孩子的成长，发现遇到的很多问题自己处理不了，不知道该怎么
    做，所以就只剩下发脾气大喊大叫了。


    在家庭教育高级研修班学习之后才发现，原来教育真的需要好好学习，系统学习，里面蕴含着很多的理论和方法，而且是经过实践的有科学依据并且是成体系的，不是简简单单某音上刷到的几个视频说的几个零星的碎片式的点。


    通过学习并在青艳老师和晶晶的引导和带领下，自己会在生活中时不时去练习和实践，尝试用科学有效的方法去处理和孩子之间的矛盾、问题。在这个过程中，孩子逐渐对我多了一些理解，同时孩子也看到妈妈愿意学习，坚持学习，愿意去探索跟他沟通的方法，他自己也挺有感触的。'
