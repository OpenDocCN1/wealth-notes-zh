  md: '流量，我们也追求持续稳定，就是最好今天干一天，接下来10年都有的吃的那种，我比较懒，哈哈。


    所以对流量渠道，我的要求是一件事情我做了，最少能持续给我提供3-5年的流量。于是我选择了3条主要流量渠道：百度SEO，视频流量，课程流量。


    +   1、百度SEO：我做了一个“我是钱博客”的网站，目前每天的流量在8000IP左右，可以被动加50个粉左右，这个加粉量已经持续了3年多。


    关于SEO，我们做的比较简单，我们要的是微信私域流量，所以网站所有的文章，都是直接搬运的，安排一个客服每天更新即可，这样每天的工作是简单机械化的，只需要投入基本的人工，简单高效。（SEO很多大神，我就是不进门弄疼了，我只会这一点。）


