- pgno: 931
  md: '# # 1.尽量不做低客单价


    不管是高客单价还是低客单价，都有沟通成本，而且低客单价的时间成本一点不比高客单价低，所以能做高客单价就不做低客单价。


    ![](img/00c8ed3105ac934755346b58149acc95_931_0.png)


    拿我写的面试解析和作答逐字稿来说，我期间也尝试过卖我写的解析资料PDF版，价格**19-39**左右，也会有很多人私信购买，但是太浪费时间了，每个都得回复，即使一天卖个**10**份**10**份的，还不如我一节课的客单价高，搞的自己很累，后来我就基本不怎么做卖资料的引流了。


    和低客单价比，高客单价会更加省心，粉丝素质也更高，变现也更多。


    # # 2.优化好付费资料引流


    因为我的面试学员，大多数是看我的小红书笔记私信我的。还有一小部分，是通过资料找到我的，所以把引流资料做好，也可以拓展一些学员。'
  merge: -1
