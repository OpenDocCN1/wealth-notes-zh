  md: '除了每年的国考、省考、事业单位等大规模的考试，还有很多其他考试，像 2022 年，因为疫情很多地方简化了事业单位人才引进的招考方式，只要满足招考条件，不需要笔试，直接面试就可以了。


    而且，每个省、每个市、每个县、疾控、医院等事业单位自己组织的考试有很多，可以这么说，全国几乎每周、甚至每天，都有地方在组织体制内的面试。


    # (2) 高考客单价刚需


