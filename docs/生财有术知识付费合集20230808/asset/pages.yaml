    # # (精华帖)(227赞)抖音虚拟类目玩法：半年在

    抖音卖出 50 万份课程，营收三千多万


    作者： 不甩


    日期： 2022-10-09


    虚拟类目其实由来已久，淘系/咸鱼/拼夕夕上会玩的人很多，但是抖音平台上玩的人不多。抖音虚拟类目玩法是指：依托抖音平台，销售虚拟产品（即非实物产品，如课程、服务等）。


    关于这个玩法，我认为相对于商业IP打造或者制作课程来说，会更加的低门槛与灵活，也更适合小团队切入。


    大家好，我叫百晓，智客科技负责人，94年的中老年创业者。我们公司目前主营是育儿课程的研发与销售，主要渠道是抖音，产与销都是自有运营。


    我的合伙人@华南虎 从事传统电商已经11年，从淘宝转战各大平台一直到抖音，所以目前我们定义自己是一家电商公司，而不仅是教育公司。


    2021年年中公司基本砍掉了原有的传统电商业务，全力all in抖音赛道。由于具备电商基因，我们先从抖店开始切入抖音，经历了很多坑之后才选定了主营赛道跟生态位。'
