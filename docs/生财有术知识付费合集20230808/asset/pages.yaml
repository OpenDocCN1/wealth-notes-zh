- pgno: 229
  md: '用户分析主要用于分析你的用户需求，让你的课程内容可以更好的匹配你用户的需求，一般我会做用户调研。用户调研分为定量、定性、访谈。


    最简单的方法我们可以收集用户的问题找出共性，帮助你优化大纲和课程内容。


    举个例子：


    我在做朋友圈课程的时候，我先把买了课程的人引流到微信群，通过群接龙问题收集的方法，挖掘他们共性的问题、底层痛点、根本性需求。所以再最后通过这群人收集上来的问题针对性开发课程，最后呈现出来的课程口碑和反馈非常好，好评率
    97%。


    ![](img/00c8ed3105ac934755346b58149acc95_229_0.png)


    如何洞察用户的需求大家通过痛点问题收集、收集马斯洛需求层次理论，Kano 模型，多维度尺度方法，用户画像，客群定位，用户标签，角色细分等方法。'
  merge: -1
  img_proc: true
