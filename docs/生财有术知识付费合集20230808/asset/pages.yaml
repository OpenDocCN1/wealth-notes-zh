  md: '# （口直播）限大分量的防空识别音，1小时后改口


    ![](img/00c8ed3105ac934755346b58149acc95_793_0.png)


    一个优质的账号和直播间素材会帮助你**更快起号**。


    # 如何判断账号活跃度足够了？


    可以发布一条视频，正常会有不少于500的播放量；或者任意开播1小时，一般账号会有200-500的场观，如果场观不足100，那就属于异常账号了，不解除异常几乎不可能做起来。


    账号异常的原因主要有3种因素导致。


    +   ① 自然因素（之前没有做过直播），建议第二天第三天再开播尝试；**解决不了建议注销账号**。


    +   ② 账号不活跃，可能是太久没有使用，或者是开过直播并且违规过；**建议停播几天养号后再开播**。'
  merge: -1
  img_proc: true
- pgno: 794
  md: '③ 人为因素，如互关互赞，大量刷粉、刷在线、刷互动；建议停播几天养号后再开播。


    当账号和直播素材都准备好之后，就可以开始起号了。


    对于1个新号，我们开播的流量肯定是少并且不精准的。起号的前3天，建议每天定时定点开播（精确到分钟），不同类目直播间会有不同开播时间段。


    比如助眠直播间建议在凌晨**0点到2点**之间开播。前三天播1小时内就行，根据直播间流速判断下播时间，如果开播**40分钟**后就已经不进人了，那就可以下播了，整场直播不要低于**30分钟**。


    坚持3天后到了第4天，理论上开播会迎来极速流，在线会有几十人。当在线高于百人时，直播间可能会出现直播间不能加热的现象，说明本场直播被限流了（账号开始启动），开播时长2小时内下播。


    过**10分钟**后再开播一场基本会再有极速流量，且较上一场流量有所增长，第2场还是会出现直播间无法加热的现象，此时根据在线人数决定下播时间。


    如果在线高可以一直播到上午**8-9点**，如果在线不高，播1小时就可以下播了。往后就按正常开播时间节点开播即可，不断重复上述步骤。


    当然，由于众所周知的原因，运营期间恰逢上海市民生活较为无聊，因此账号稳定后，每晚我都会开启同城定位~此时同城流量可能帮助我们放大了直播间的流量。'
  merge: -1
  img_proc: true
