  md: '这种知识付费的边学边教变现，是很多普通人就可以尝试的，但是开始变现，需要突破两大心理卡点：


    +   1. 在私域里，都是信任自己的朋友，很多人不好意思向朋友开口谈钱。


    那我们可以反问自己，为什么你要把自己知识和经验分享给你信任的朋友？一定是因为这个知识的本身对朋友是有价值的。


    而我们要明白，付费是一种筛选的过程，所以朋友圈里定价自己的，对这个课程有兴趣的朋友圈自动会报名。另外，付费才会让自己和用户更加重视，而双方都重视，效果才会更好。


    +   2. 就是觉得自己目前的水平，还不够高，对自我提供的价值不肯定。


    我知识付费的开启模式，就是99元打卡返现，后续一期一期涨价。当自己的水平不够，可以通过打卡返现的方式，找到自己的种子用户。


    # # 二、平台推广-流量互通变现


    去年7月， 群买买开始在朋友圈刮风的时候，那会儿我刚从香港回到宁波，正在宁波维也纳酒店集中隔离。'
