    得到高研院的班主任岗位是一个挑战性和高的工种，要代表得到公司全体同事直接为学员、而且是高价值学员提供面对面服务。班主任期间面对多种挑战：与学员相比社会经验不足导致自信心不足；远离总部导致的后台支持不足；一个人同时要处理多种问题导致的精力不足等等。如果班主任不能建立起自己的一套有效的工作方式，就会陷入疲于奔命的状态，这样不仅会给自己压力增大影响健康，同时还可能造成学员的学习体验不佳，严重的还会影响公司声誉。


    合格的得到班主任，不是事无巨细的服务员，而是要展现出一条终身学习者的样子，甚至成为学员心目中终身学习者的样板。


