- pgno: 43
  md: '如果有什么事曾经特别困扰你，而你投入很多时间和精力，去研究、学习，最终找到了解决办法，那它就是值得分享给别人的，一定也是有价值的。


    她有两个学员的案例给我触动很大，一个德国女生，小时候因为不会跳舞，每次参加party时都不敢靠前，导致一度很自卑。


    后来她自己研究了一些简单易学的舞步，慢慢地就能自信而优雅地面对社交生活了。它在Sunny的帮助下做了一个网课，教成人跳这种舞步，卖火了，每个月都收入5万美元。


    另一个美国的大男生，父母离婚给他带来了心理阴影，他和妻子的感情也出现了危机，于是他研究了很多资料，最后总结了一套沟通改善的方法。


    他不仅挽救了自己，也在Sunny帮助开了一门网课，就这么一个看上去就是嘴上没毛的小伙子，愣是打败了很多情感专家，一年就卖了一百多万美金。


    她的学员有很多案例，什么领域的都有，有食疗治癌症每个月卖3万多的，有教人怎么做木头船的，也能卖1万多。


    但有一点是相同的，就是，都是亲身经历过的痛苦，然后深入研究、总结出来了解决方案。


    因为你自己知道在说什么，所以你心不会虚，你敢要更高的价。


    我看了她讲的这些以后，茅塞顿开，就重新选了题。


    去年夏天，我的英语听力无意中突破了，到了那种一听就懂、不用过脑子的境界，看美剧不用字幕了。


    我当时很欣喜，但没想过要做课。因为我一心钻在钱眼里，就想做儿童财商的东西，因为我看得清客户多，而且门槛低，需求更刚。


    但看了Sunny的内容，我突然意识到，这才是我应该做的方向。于是我开始研究，花了好多时间，弄明白了语言习得的科学原理，也根据自己的经历，总结了一套有操作性的方法。


    然后，我就住院了……


    我能坐起来以后，在病床上闲聊无事，就跟着朋友传授了我的方法（其中一个在四个月后也突破了），他们给我的反馈都非常好。'
