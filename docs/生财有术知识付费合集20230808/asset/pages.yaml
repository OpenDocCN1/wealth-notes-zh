  md: '其实做竞价最赚钱的还是医疗和美业，领飞的老师他从教我第一天起，就没有告诉我他做什么竞价产品，害怕竞争。


    但还是在话里话外中，我找到了他的产品库，专注于"小吃教程"；这也就导致我什么，起步也做教程的原因。


    其实这样看来，在现如今，就是知识付费、虚拟变现。


    大力出奇迹，第一单我通过【30天足球教学教程】赚了300元，抛出去竞价广告费50元+邮寄费23+10元U盘+3%的货到付款服务费，说实话我这个产品，还是比较有产品力的，虽然单量不高，但是成本低，属于冷门细分。


    之后陆陆续续其他教程也出单，温饱月入5000也就基本实现。


    通过"百度竞价"让我打开了互联网创业的一扇窗，之后就开始操作各类网赚项目。


    说实话，是你们无法想像的一种疯狂，见到任何项目我都去尝试一遍，这也就促成了，领飞报名了很多老师的课程，比如：电影资源公众号、淘宝虚拟变现、朋友圈看看广告赚钱程序、卖微信群网站、菠菜套利、微聊流量、脚本引流、、。。等等，老战友是不是感觉都非常熟悉啊！呵呵呵！


    总结出：玩虚拟变现去山东，玩电商去杭州、玩套路去广州、玩竞价去福建、玩讲师去深圳。


    有钱了，就开始各种投资实体店、开公司等等，这些就不说了；'
