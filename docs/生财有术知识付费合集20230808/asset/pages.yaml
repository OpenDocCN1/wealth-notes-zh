  md: '先介绍一下，我是照明邦刘滔，做亮化设计的，我从决定做知识付费开始，一共录制了五套课程，这五套课程录制了好几年，也售卖了好几年，特地统计了一下，这五套课程这几年带来的总收入是52万。


