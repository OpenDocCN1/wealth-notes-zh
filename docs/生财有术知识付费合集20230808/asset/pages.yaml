- pgno: 813
  md: '# —Part 2—


    # 如何制作一门录播课？


    如何做出—门爆款录播课呢？


    首先要回答一个问题：**别人为什么会买你的课？**


    你的课一定是能让学员解决遇到的困难、更好地完成工作、找到更好的工作、挣更多的钱，然后你从他们挣到的钱中分走一部分，你的课才能做得更好。


    让买课的同学高效学会你讲授的知识技能，更进—步则是帮他们解决问题、找到工作、升职加薪。这些是录播课的原则，将这些话记在心中，遇到问题时这个就是答案。


    下面我们就开始讲具体的录播课制作流程。


    # 第一步：做好选题


    2018 年初，我在第—门小课上尝到甜头之后，就开始准备疯狂录课，目标是—年录制100 门课程。然后开始制作我拍脑门想到的—些选题的课程并逐步上架，定价都是
    200 元以内的小课。但是随后上架的 3、4 个课程，销量很差。'
  merge: -1
  img_proc: true
- pgno: 814
  md: '另外，还发现了一个问题：课程生产速度并没有那么快。第一门课程虽然只用了两三天就录完了，但是在录制前是花了很多时间做准备工作的。当时觉得一年能做 100
    门课程，可实际上一年想做 50 门课程都非常困难。


    既然课程的产量做不到那么高，就得从质量入手，得研究一下为什么有的课程卖得好，有的课程就卖得差呢？经过仔细分析以后，发现卖得好的课程有两个原因：


    # 1）跟上了一个热点


    当时微信刚出来跳一跳小游戏，那门课程是跳一跳小游戏的教程。但是后来出的几个课程既没有热点加持，也忽略了市面上已经有类似的课程，而且这些课程有数据和评价支持，我的课程并没有差异化，学员自然会去选择那些课程。


    # 2）目标人群精准


    这在当时是误打误撞的，后来才发现 80% 购买此类小课的学员都是为了完成自己的课程设计而购买，刚好课程的内容、难易程度、价格非常符合此类人群的需求。


    所以，一门录播课能否成功赚到钱、赚到大钱，选题占了一半以上。选题选好了，后面会事半功倍。这个环节是你的课程能不能卖好的最关键一环！最关键一环！最关键一环！


    # 一、选题类型


    在开始选题之前，你先要了解录播课的几种课程内容类型：'
  merge: -1
  img_proc: true
- pgno: 815
  md: '# 1.0 基础入门课


    这类课程主要面向小白用户，他们的核心需求是快速入门。课程内各个知识点需要详尽讲解，否则后续的答疑压力会非常大。


    在这个阶段，学员主要不是为了课程视频付费，而是买个能随时帮忙答疑的老师。所以，讲师不需要有很强的技术背景，现学现卖都可以。即使将很多技术官方出的图文教程通过视频课演绎一遍，也会有人买。


    此类课程的缺点是门槛低、竞争激烈，而且B站中有很多免费基础教程。


    这类课程的机会在于一些新兴技术的教程，由于国内暂时没有系统性的入门教程，如果早期能从国外网站学习并用中文重新演绎，并在垂直领域站住脚，也可以取得不错的收入。缺点是选择太早期、变化太快技术版本做教程是一把双刃剑：


    早期技术的教程还没人做，你做可以快速占领市场，但是维护成本非常高，可能在教程录制的过程中，技术就发生变化了，学员跟着你的教程学习，会遇到很多问题，答疑压力会非常大。


    如果你想做一门课长期获得被动收入，个人并不推荐这种类型的选题。


    # 2. 专题进阶课


    什么是专题？《0 基础入门 Excel》属于入门课，而《如何在 Excel 中使用 VBA》则属于专题进阶课。'
  merge: -1
  img_proc: true
- pgno: 816
  md: '此类课程面向有一定基础的用户，他们的需求通常是解决工作中的问题，增加自己的核心竞争力，争取升职加薪。


    此类课程的大课可以做到较高的客单价，但需要比较强的技术背景，对专题技术熟悉度很高。


    # 3. 项目实战课


    此类课程有自身的优势，即使你两门课包含的技术点大体相同，但是用不同的实战项目串起来，就可以作为两个课程售卖。


    课程主要可以定位 3 类人群：在校学生、应届毕业生、求职者。


    在校学生：实战项目作为课程设计的作业，课程内容不需要太多，重点不在技术讲解，而是跟着你的视频操作就能把项目做出来。用户对定价敏感。


    应届毕业生：实战项目作为毕业设计或求职作品集的展示项目，课程内容需要相对完整，有一定的技术难度，符合最新的职场技术方向。用户对定价不太敏感。


    求职者：实战项目需要作为项目经历写入简历。课程内容需要完整，看起来是一个商业项目案例，有较多的技术难点讲解，能经得起面试官的提问。用户对定价不敏感。


    # 4. 系统就业课


    此类课程主要面向应届毕业生以及求职者。学员的需求是掌握此门技术达到特定岗位的要求，可以通过笔试面试找到工作。'
  merge: -1
  img_proc: true
- pgno: 817
  md: '课程内容需要完整且系统化，包括基础知识原理的讲解，也包括实战项目，可以说涵盖了上述 3 种课程的内容，但不是简单拼凑，而是需要系统化的设计。


    4 类课程类型的对比如下：


    | 课程类型 | 用户基数 | 制作难度 | 价格 | 优点 | 缺点 |

    | :--- | :--- | :--- | :--- | :--- | :--- |

    | **0基础入门课** | 高 | 低 | 低 | 制作难度低，可以作为初期练手的课程类型 | 售价偏低<br>竞争激烈 |

    | | | | | 目标用户基数大，可以作为引流品 | 由于课程中存在大量细节内容，答疑压力大，课程容易过时 |

    | **专题进阶课** | 中 | 中 | 中 | 课程整粗相对较高，容易占据细分头部 | 对技术要求较高 |

    | | | | | 定价可以较高 | 由于过度细分，单课收入天花板明显 |

    | **项目实战课** | 中 | 中 | 中 | 最受欢迎的一类课程 | 需要有项目实战经验或很强的技术能力（拆解并复制项目） |

    | | | | | 可以用不同的项目，套在相同的技术体系上，就能成为不同的课程 | 大多数学员是为了实战项目，而不是背后的技术来的，如果实战项目过时课程销售会有较大影响（比如18年的跳一跳课程，目前已无人问津，但技术没变）
    |

    | | | | | 根据项目体量，定价可低可高 | |

    | **系统就业课** | 低 | 高 | 高 | 定价极高（对应岗位1-3月薪资） | 课程制作工作量巨大，学员运营工作量巨大，不建议一上来就选择此类课程，个人做此类课程要逐步搭建一个运营团队
    |


    # 二、选题原则


    了解了课程类型后，在具体选题之前，先分享我总结的 4 个选题原则：


    +   1. 力出一孔'
  merge: -1
  img_proc: true
- pgno: 818
  md: '如果**可以，尽量集中精力做一门优质大课**。比如项目实战课或就业课（如果对课程有信心可以包就业），为什么呢？


    学员对低价课和高价课的品质与服务要求是一样的，低价课会有很多的客服、答疑成本，综合算下来可能并不能赚钱。但是是一个**5000 元左右的高价课，一方面可以减少精力分散，另外一方面高价课所产生的收入足以让你做好课程的各个方面**。


    # 2. 选题查重


    在选题基本确定后，一定要去市面上查找看看有没有类似的课程。


    如果有，一定要想好你的差异点、竞争点在哪里，为什么用户买你的课而不是友商的课？如果没有明确答案，这个课程选题就要放弃掉。


    # 3. 强获得感


    课程学完后，学员要能跟着你做出一个实际案例出来，能作为他学业、求职升职的一个作品。这种类型的课程对学员才有获得感，不至于学完之后什么都没留下。


    # 4. 蹭热点


    如果可以，尽量跟上一一些当下的热点，这样会有流量加持。但是也不要为了蹭热点而蹭热点，核心还是课程内容本身。


    比如最近《原神》游戏比较火，你就出一门《原神渲染实战课》，但你的课程核心还是渲染技术。'
  merge: -1
  img_proc: true
- pgno: 819
  md: '比如最近拼多多爆火，你就出一门《从 0 开始开发一个拼多多 App》，但课程核心还是 App 开发技术。相当于铁打的技术（内核），流水的项目（外表）。


    然后要避开「选择太早期、变化太快 的技术做教程」。这是一把双刃剑，早期技术还没人做教程，你做可以快速占领市场，但维护成本非常高。在教程录制的过程中，可能技术就发生变化了，学员跟着你的教程学习，会遇到很多的问题，答疑压力会非常大。


    # 三、选题步骤


    +   1）根据自己的技术储备，确定课程大体的技术方向。比如你擅长 Android 开发，那就大方向是 Android。


    +   2）定位目标用户。根据自己的实际情况，定位你的课程要卖给谁，解决他们的什么问题（学生的课程作业、毕业生的就业、在职人员的转行等），基本确定课程类型。


    +   3）通过下述的数据驱动选题法，找出 20 个关注度高的技术、项目作为备选主题，依次执行 4-7 步。


    +   4）在搜索引擎中搜索是否已有类似的课程。如果有且与你定位的目标用户冲突，则排除该主题。


    +   5）评估该主题所涉及的技术范围是否是你力所能及的。如果是，选用该主题，如果不是，进入下一步。'
  merge: -1
  img_proc: true
- pgno: 820
  md: '6）如果主题涉及的技术范围太大，评估能否缩小课程范围到能力圈。比如你讲不了《拼多多系统架构实战》，你可以讲《拼多多 iOS App 开发实战》。如果能缩小范围，选用该主题；如果不能，进入下一步。


    7）评估能否现学现卖。很多技术通过自学，然后录视频二次演绎，能取得非常好的效果。因为你能从初学者的角度，去讲解课程中内容。如果能，选用该主题，如果不能，放弃该主题，回到第
    2 步。


    现在拿到的选题就可以作为下一步课程设计的题目了。


    再举几个具体选题的例子：


    +   一门技术如果你也刚入门，刚好你可以从初学者的角度制作 0 基础课，初学者视角对于技术大牛来说很难做到。


    +   如果你对某项技术研究的非常深，专题进阶课适合你。


    +   如果你项目经验丰富，实战课适合你。


    +   如果你在一个技术岗位有超过 5 年的经验，系统就业课适合你。


    **Q：什么是数据驱动选题？**


    找一个你想要录课技术领域的规模最大的公众号，扒下来它最近一年内的推送数据，分析阅读量、点赞量、转发率最高的文章。身为程序员，数据当然不是手动扒了，把数据爬下来。'
  merge: -1
  img_proc: true
- pgno: 821
  md: '如果不熟悉爬虫，可以看看新榜、拓途数据等工具里面的公众号回采服务。新榜贵一些，拓途数据 500 篇 30 元。如果你还觉得贵，可以看看某宝，关键词是「公众号回采」。


    同理，还可以分析各个博客网站、课程平台的数据，分析当下热门的话题，更要分析几年内都很热门的话题（说明这类技术关注度一直很高，此类话题的课程更不容易过时）。


    还有一个选题数据来源，就是找各个在线课程平台的类目经理，他们会给你提供一些选题的建议，毕竟他们手里的数据是平台实时一手的数据，有很大的参考价值。


    # 四、选题验证


    选题完毕就开始制作课程了么？NONONO。


    我们还需要验证选题是否真的是用户感兴趣的选题，进而会买你的课，同时找到一些种子用户。怎么操作呢？


    +   - 根据选题写一篇相关图文教程，教程内容是你想做的选题中的部分知识点。文末留下 QQ 群号（XXX 技术交流 Q 群：1234567XX），发到各大技术博客中（CSDN、博客园、知乎、简书等）。


    +   - 分享文章到你已加入的相关技术群中。


    +   - 如果大家对你的内容感兴趣，会有一些人加入 Q 群。'
  merge: -1
  img_proc: true
- pgno: 822
  md: '+   * 持续在群中讨论相关技术 3 天，在第 3 天分享课程大纲，关注大家的反馈。


    +   * 第 4 天发布课程预售信息，1 元定金（课程上线后可抵 XXX 元）。如果入群 > 交定金转化率能超过 20%，说明你的选题是用户真正有需求的，
    可以继续进行课程制作。


    选题验证环节就是要通过真实用户的反馈，来验证你的选题不是一厢情愿，并且通过早期的验证可以积累起一部分种子用户。


    这里用到了一种精益创业的方法：假设验证法。这种方法能避免我们的产品做出来，才发现用户根本不需要，没人买的场面出现。


    先做假设：一个创业项目要做成，有许多先决条件，这些先决条件就是我们做出的假设，只有这些假设经过验证可成立之后，我们的创业项目才可能成功。


    再验证：验证的方法成本从低到高依次是：常识 < 数据分析 < 调研 < MVP。


    这个话题后续我会再详细总结分享一下。


    # 第二步：课程设计


    现在我们的选题经过了验证，也有了一些种子用户，可以开始课程设计了。'
  merge: -1
  img_proc: true
- pgno: 823
  md: '课程设计最开始要做的是什么？查阅资料，寻找对标，还是设计大纲？这些都是课程设计的必要环节，但我认为最开始需要做的不是这些。


    # 一、先定价


    最开始要做的是定价。


    你可能会很诧异，怎么会是定价呢？现在什么都还没有，怎么定价呢？


    价格决定产品！价格决定产品！价格决定产品！


    同样是一瓶洗发水，定价 20 和定价 200 的产品设计方案完全不同，主打卖点不同、包装不同、渠道不同等等。


    所以，在你选定题之后，你就应该结合自己的能力，先对课程做一个初步的价格预估。


    比同一个选题，你要做一个 200 元的小课还是做一个 2000 元的大课，在课程设计上一定是不同的。200 元的小课可能只包含主题相关知识点，很少做技术延伸讲解，大概
    10-20 小时。但是 2000 元的大课，除了课程内容更丰富、系统化之外，还提供更多的增值服务，比如答疑、督学、直播加餐等等。


    但是一定要记住，即便是不同价位的课程，用户对课程质量和答疑的需求都是没有太大差别的，如果有能力，建议多做高价课，高价课和低价课引流、服务的成本几乎一样，但是高价课能让你更专心地去提升课程内容质量和服务。


    如果你对一门课程能卖多少钱没有什么概念，以下几点可以作为参考：'
  merge: -1
  img_proc: true
- pgno: 824
  md: '1）可以参考同类型课程确定价格范围，并在课程上架时先从较低的价格试验（早鸟价、首发价），后续可以逐步提高价格。


    2）如果是独有的课程，差异较大且是刚需，可以定高价（根据课程内容甚至可以过万元）。


    3）还有一个定价角度：你的课程能给学员带来多少收入增量，比如学完你的课包就业 8K 以上，那你可以收他 1-3 个月薪酬也就是 8K-24K 作为学费。


    # 二、 大纲设计


    下面就要具体设计课程中需要包含什么内容了，大纲设计和优化贯穿在整个课程制作过程中，初版大纲可以按照如下步骤去设计：


    1）使用思维导图（大鹰用的飞书文档），暂不查阅资料，拍脑子列出选题所涉及的需要讲解的内容点。


    2）验证所列出的内容点能否支撑目标用户的需求以及课程定价（如不确定可以在各课程平台搜索，对标同类型相近价位的课程）。


    3）如果不能，需要进一步扩展内容点或者增加实操案例。


    4）细化整个大纲思维导图，有些课程（实战课）可以直接拿思维导图录课，不需要再额外做 PPT。'
  merge: -1
  img_proc: true
- pgno: 825
  md: '5）开发大纲中涉及到的实战项目。


    ![](img/00c8ed3105ac934755346b58149acc95_825_0.png)


    定价和大纲有初版之后，可以继续在种子用户群中分享验证一下。


    # 三、课程制作


    课程制作一般要包含以下几块内容：


    1）PPT 制作，是否制作 PPT 需要根据课程内容来定。'
  merge: -1
  img_proc: true
- pgno: 826
  md: '如果理论知识偏多，建议用 PPT 图文搭配讲解；如果课程是实战项目，很少有原理讲解，主要是实际操作，可以直接用思维导图大纲将课程串起来。PPT 中尽量不要包含二维码等内容，有些课程平台审核严格，严禁向站外导流。


    2）配套实战项目开发。


    3）几篇图文干货（用于图文平台的推广）。


    4）提供几节试听课。


    +   为什么要学这个课？讲遇到的问题、技术背景、前景、学好之后的收获（升职加薪等等）。


    +   我能得到什么？尽请展示本节课的直观最终成果，比如实战课最终成


    +   为什么要跟你学？一两节吸引人的课程内容。


    5）后面是正常的课程内容。


    # 四、录制


    录课所基于的技术版本，尽量使用最新的稳定版本来录制课程。优先使用最新的 LTS（Long Term Support，长期支持）稳定版本（因为企业中通常会使用
    LTS 版本开发，而且 BUG 更少）。


    1）最新可以保证课程的寿命，不会因为技术过时而过早淘汰。'
  merge: -1
  img_proc: true
- pgno: 827
  md: '2）稳定版可以保证课程质量，避免因基础技术、SDK 版本不稳定带来问题，可以减少售后以及答疑的压力。


    录制、剪辑工具顺手即可，我用的工具如下：


    +   录音设备：罗技 H340 头戴耳麦


    +   录制工具：OBS 或 Camtasia（Camtasia 有个问题就是录出来的视频特别大，比较占空间，但好处是可以录制中加一些标记，比如在你卡壳地方加标记，这样你可以有重点地剪辑）


    +   录制配套小工具：PointerFocus（高亮显示光标位置）、Carnac（显示你按下的快捷键）


    +   剪辑工具：Camtasia（如果不会 Pr，可能 Camtasia 是一个比较好的选择，简单够用）


    +   如果从来没有录过课，建议先录几个短视频教程传到 B 站练手


    # 五、讲解


    在录课讲述时，要有目标感。你要想象面前是你的一个学生，你要一对一将知识经验传授给他。你所讲的内容一定是连续的，有前后逻辑的。


    图文内容在某处作为补充内容可以放一个超链接，如果用户想了解更多详细信息可以点击超链接去阅读另外一篇文章。


    但由于视频课是线性前进的，要根据你的目标用户在课程讲解中及时对可能大多数人不清楚的内容进行补充说明。补充说明要简洁明了说清楚两件事：这个名词是什么；如果你要详细了解应该去哪里？


    # 六、注意事项'
  merge: -1
  img_proc: true
- pgno: 828
  md: '录制过程中注意以下几点，可以大幅减少后期的剪辑工作量：


    +   - 有意识的控制自己不必要的语气词，比如「嗯、然后」等等。


    +   - 熟练使用录制工具的暂停功能，某些时候，会发现没办法表述清楚或者突然大脑一片空白，可以先暂停，好好梳理后再继续讲。


    +   - 在说错的地方做记号，方便后期剪辑。Camtasia 录制工具可以在录制中加标记，使用其他录制软件的时候可以拍手做记号，剪辑时能在音波图上看剌到一个尖刺。


    ![](img/00c8ed3105ac934755346b58149acc95_828_0.png)


    # — Part 3 —


    # 如何卖出第一份录播课？


    课程制作完毕，下一步就要开始想办法卖出这份课了。'
