- pgno: 681
  md: '随便举几个最近比较火的例子：老年Keep、老红书、老年家政、老年睡眠、老年文娱、营业健康管理，正骑带孙子的课程等등等，太多了，说不完！


    从我的角度，个人觉有几点原因


    （1）流量侧：更多元的触达用户的形式，视频号等中老年人居多的短视频平台，还有类似美篇这种垂直平台的兴起，带来了更多的机会


    （2）用户侧：大公司进场，用户认知和习惯逐渐培养起来，还有就是中老年对于服务的感知和认可，超过品牌加持。


    哪怕你是大公司的课程，我服务做的好，我课程更贴近用户需求，一样可以卖的很好，在中老年眼里，这些大公司和你没区别，并且现在的都市银发，已经能很熟练的下载APP、转发评论、小程序打开、各种支付玩的很溜。


    （3）产品侧：现在中老年赛道的产品很匮乏，你在其他赛道做到 120 分才能有机会，可能在这个赛道做到 60 分就有点机会了，毕竟见过曾经的音乐相册软件和天气软件几个月可以获取几百万的流量。


    不过需要注意的是，流量获取阵地和产品形态要选好，说句实话，我测过很多主流渠道，有用户之后，测试过很多种形态的打法。


    测试下来，基本上微信体系内和视频号是路径最顺的抖音和线下也还可以（这里不包含银发电商玩法）'
