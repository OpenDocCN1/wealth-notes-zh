  md: 因为我们公司是知识付费转型电商，所以我们把知识付费的团队里面优秀的操盘手都优先调到了电商团队，而且他们都非常的开心，因为很多做知识付费做久了的运营，他发现你的公司依然没有更大增长空间的时候，他自己也会感觉到迷茫。而进了电商对他们来说又是一个全新的赛道，有更大的天花板，所以完全不用担心你这里会不会有很多人人员的变动，优秀的人才，当你告诉他这个事情的发展前景，他是能跟上你的，而如果他看不见看不懂不听甚至不信任你，这种人也不是能够跟你并肩作战的你的新团队的战友。优秀知识付费的操盘手进入电商赛道也是降维打击，因为知识付费卖空气，本身就对用户敏感度、销转细节体系要求更高，他们进入短平快的电商不仅能够快速适应，还能够做的比一直在电商的还要好。那团队需要多少人呢？我们在转型过程中把20%的人调进电商团队，保留40%在原先知识付费团队，精简了40%的人。如果一个知识付费的博主月销300万，他基本上后端配置的人员至少是10~20个，因为它涉及到课程的制作，私域的运营，甚至私域的销转，课程非标的交付非常多，复杂的前前后后的人。但是电商博主非常的简单，如果你月销300万，你做的是我讲的这种三高赛道，你不需要直播间人数很高，你最少你只需要两个人就可以：一个人做你的中控运营，直播间的时候，帮你配合强产品讲解，帮你配合直播间的气氛，给你发福袋，给你看数据，给你做场控。中控的核心画像是细致、聪明、数据能力强。第二个做用户运营，包括私域的引流，公域的回复，对vip用户的一对一触达。用户运营的核心画像是负责、耐心、学习能力强。电商带货是个很扁平的事情，老板供应链和直播全部都把握住，然后有优秀的人上来配合跟你干，没有优秀的人招基础的人能够帮助你把活给你干仔细了就足够了，先有再优。
