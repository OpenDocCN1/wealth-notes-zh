- pgno: 88
  md: '那我还是算喜欢折腾的一个人，在我每天无所事事在家带娃的日子里（也不算无所事事，我入了一个微商，但是挣不到钱，哈哈），我卯上了抖音。


    之所以我这么一个完全没有“网感”的人能盯上抖音，是抖音在持续发力商业版图推出的抖音小店，他们那时候专门会有工作人员打电话让你在抖音开抖音小店，虽然我都不知道这个啥小店到底是怎么回事，反正就随便玩玩，花了2000买了1500个抖音的粉，然后就开始琢磨怎么变现了。


    我当时做抖音做的是无货源，**20**年年初开始做其实不算晚，但是我愣是没整明白这个无货源到底咋回事，所以这个小店就杵着啥也没干。


    那时候，我对新媒体的所有认知只有微信，我自己有在微信开过公众号，虽然没变现，但相对于抖音，微信还是我的“舒适区”（见笑见笑）。


    所以我一心想着能不能在微信能赚到点钱，当时有事没事就拼命找各种技术贴去看，然后**21**年时候通过@铭则 他的引流贴（哈哈）入了他的群，刚好是在**4.18**之前入的，到了**4.18**铭则跟大家推荐生财有术，当时也是舍得掏钱，花了**1500**多入了生财。


    （真的是稀里糊涂入的，当时也真的是舍得掏钱，毕竟**1500**多对于我们这些对新媒体没概念的人，入这么一个群真的是觉得好贵）


    # **阶段三：**


    入了生财以后，发现里面都是大牛，干货太多，都看花眼了，看了两三个月都找不到自己的定位。我尝试着去做过饿了的**CPS**，但是发现自己根本不适合，也考虑过**shopee**这一类的境外电商，但是自己没经验，也没团队，所以也没开始。'
