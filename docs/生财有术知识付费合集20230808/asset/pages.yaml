  md: '# 识，并且可以直接上手操作！


    我们竞价开课是2个月开一期，以上的动作做完，一期招生在30个人左右，基本能完成招生目标。


    # 四、交付：


    交付也是我们非常重视的，一个知识付费的课程能长期做，交付一定要做好。所以我把交付分为：直播课程+课程回放+QQ空间日志+社群大佬分享+社群日常交流+赠送课程+一对一辅导。立体式来做交付，保证效果和服务。


    +   1、直播课程：我们课程每2个月举办一期，每天晚上20:00-21:30开课，一期6天左右，老学员免费复训。尽量把课程都讲得非常详细，这样学员只需要看课程，就可以把大部分问题都解决掉，减少后续一对一再讲知识点的工作。


    +   2、课程回放：直播课程我们会录制成视频，上传到我们加密的播放器里，学员可以在我们的播放器里随时看回放，因为竞价涉及大量实际操作，所以每个学员本身也需要反复看课程。


    这里还有一个好处，因为课程有回放，所以新学员不必等开课才报名，随时可以报名，报名后直接看上一期的课程回放，就可以直接开始操作。


    +   3、QQ空间日志：学员普遍会遇到的一些问题，我们会整理在学员内部的QQ空间日志里，这样减少学员犯同一个错误的几率。


    +   4、社群大佬分享：不定期会邀请一些群里做得好的小伙伴，在群里分享，一方面是经验的学习，另一方面也是对其他成员的激励。


    +   5、社群日常交流：平时有问题可以随时在群里交流。


    +   6、赠送课程：因为我们做网络比较久，基本上很多项目都涉及过（淘宝，天猫，闲鱼，拼多多，抖音，视频号等），所以我们会把很多项目我们实际操作的经验整理成课程，免费送给学员，这样丰富大家的项目库和知识面，来更好的提升自己。'
