    # # (精华帖)(661赞)创业 20 周年的思考


    作者：mrhua


    日期：2022-04-27


    创业20周年的思考


    我在商业思维直播里聊的，分享给各位


    01 分享


    一、为什么现在的人创业成功之后他赚钱的速度远远大于以前的人？比80后70后60后要快十倍百倍？


    原因：效率。


    商业周期分为4个：


    +   1. 实体

    2. PC互联网（通过浏览器）

    3. 移动互联网APP

    4. 短视频、直播'
