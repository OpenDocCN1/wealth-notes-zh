    # —— **Part 4** ——


    # **普通女性适合做哪些副业？**


    没有专业，没有兴趣，也没有经验的普通女性在赚钱路上，首要明白自己在这一段时间里，想要做的是**创业**，**主业**，**副业**，还是**兼职**。'
