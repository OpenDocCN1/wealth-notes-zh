    # ②预热—介绍—正式分享—感谢—嘉宾答疑


    分享的前一天要先在群里预热，说明什么时候在什么地方请到什么同学分享什么内容，并且进行嘉宾的推崇。在当天分享前的1小时要进行倒计时，在分享开始前10分钟要介绍嘉宾并且带动群里的氛围，比如打666等等，把队形刷起来。'
