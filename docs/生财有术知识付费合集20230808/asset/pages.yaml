  md: '我们最近也在跟机构合作，通过抖音这个平台，把许多行业老师多年的知识沉淀，传播给更多有需要的人。


    # 六、避坑指南


    # 1. 法律层面


    如果你的产品是盗版或者侵权的，那就要特别要注意了。因为这种擦边球的产你能赚钱，但是会很焦虑不安，你不知道什么时候平台会搞你。所以不建议都搞擦边球。我们很多违规是平台层面违规，尽量是要触犯法律这个层面。


    # 2. 资质层面


    资质要齐全，例如营业执照经营范围、特定类目资质许可、ICP、出版物经营许可、各种报白等


    关于执照注册。icp注册这些，也没必要自己瞎研究，会的直接干，不会的，花点钱就完事了，战略资源要花 在战略位置上。


    # 3. 操作交付层面


    客服3分钟回复，品质退货CCR指标，各种售后疑难杂症的处理等'
