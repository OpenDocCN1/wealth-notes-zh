  md: '“丽丽，昨天和你沟通完后，我后来又想了一下，你这个情况我建议你第一步可以先把你社群的内容安排优化好，你现在社群里全都是广告，以你目前的社群情况，如果没有把内容安排这块优化好的话，你就很难成交客户，这也是为什么你目前客户成交率很低的其中一个重要原因”


    “但是如果你先把社群内容安排这块优化好了，客户看了你社群种草内容后，就会很心动，很想要购买，那你的成交率就会大大提升，当你社群内容安排这块优化好后，你再去重点做活动成交，这样你的变现速度就会变得很快”


    “我这里有一份社群运营资料，你要的话我发给你参考”


    然后，你就等对方回复吧，至少 90% 以上都会回复的哈哈哈


    （剩下的 10% 没回复，要么就是对方忙忘了，要么就是电话沟通完后，对方完全没兴趣，那你也不用在意，说明当下他不是你的目标客户）


    当对方说需要这份资料时，这时，你把资料发给他，然后说，有问题可以随时联系我，我可以给到你一些相关建议


    你看，我在干嘛？我在“处理钩子”哈哈哈，你发给他资料，他看了资料后，又对你的产品再次心动，（当然，资料也是需要设计过的，资料里除了干货分享外，还要留你的成功案例、产品介绍、微信二维码）


    然后呢，因为你又说了一句“有问题可以随时联系我，我可以给到你一些相关建议”，所以当他再次联系你的时候，你们不是又建立了继续沟通的机会了吗？那不就等于再次有了成交机会了吗？'
