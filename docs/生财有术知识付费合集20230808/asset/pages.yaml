  md: '就这样，在家呆了半年，几乎不出门，每天就是研究各类产品，整理各类资料，设计各类网站。


    当时我所有的产品，全部围绕“虚拟变现”也就各种教程，比如：30天足球教学教程、零基础90天钢琴教程、修车技术大全教程、小白理财教程、街舞教程、太极拳教程。。。等
    等，我做了50多款，基本所有的内容，都是网上整理的。


