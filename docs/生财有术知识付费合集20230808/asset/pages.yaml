  md: '# 6、普通人赚钱方式是信息差


    赚钱的方式一般有这3种方式：


    +   1、信息差赚钱


    +   2、资源赚钱


    +   3、技术赚钱


    对于大多数普通人来说，没本钱、没权势、没响亮 的身份标签、没吸人眼球的光环。


    那么，最好的方式就是通过信息差获利。信息差不是走捷径，而是在不同圈层让需求价值流通起来。


    因此，所谓信息差，本质上是圈层之差。


    举个例子：我们在a圈层的掌握的信息，对我们来说太普通了，习以为然。但换到b圈发现目标人群，以及他们的需求，再进行圈层之间的价值流通。


    拿设计师来说，我们的专业优势是视觉造型审美，这对我们来说在设计圈里再普通不过了。但我们换到自媒体博主圈里，会发现很多人在内容营销上很懂，但不懂视觉美感。


