- pgno: 503
  md: '# 为什么要出来创业？


    不是因为工作干不下去，而是因为工作当中有2次距离死亡擦肩而过！


    觉得做为一个男人，不管成功不成功，先要把老婆搞到手，就这样结婚了！


    兜里有5万存款，没有房贷，开始打算着如何出来创业！（因为找到老婆了，哈哈！！！）


    # 二、能糊口养活自己就行


    一天在百度搜索“1万元如何创业”，发现了一个讲述“百度产品竞价”的帖子。（那年还没自媒体的概念，也没有这么多的媒体信息渠道）


    之后联系到这个老师，进入他的QQ空间，看到一些发单视频，实在太吸引人，就这样他成为了我第一位互联网创业师傅，花费了3000元。


    “百度产品竞价”需要设计网页，需要设计产品文案、宣传广告；对于我这个二把刀大学生来说，几乎是从零开始学习。


    其实也算是万幸中的万幸，这位老师还是很靠谱的，通过QQ远程协助，一步步的教我如何做网站，传授产品思维。


    可是咱做为一枚互联网创业小白，内心对于钱的渴望，想必大家都经历过，就好像报名一个老师的课程，老师就能给钱一样；说实话当时不理解，没少折磨我老师。'
