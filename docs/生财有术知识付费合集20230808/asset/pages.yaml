- pgno: 364
  md: '这里有个名头叫“面霸”，到处花钱学，学一年半载，还是没有价值


    说学习认真很认真，但是没去化做价值


    市面上写作班林林总总，优秀的老师很多，你能够学到一定的写作技巧和部分实战经验。前期可以依靠写作班多写和学习，多写多过瘾做背书。如果你想长期文字变现，扎根写作领域，就要追求更高的地方。


    在写作班里，出成绩八分靠自己，二分是你选择的老师和背后资源优劳，选择写作班只是学写作的一个动作。


    我在写作班学过一段时间，后来自己写投稿接稿，写文案，7 月开了付费咨询，一边写稿，一边自己接单，后来做写作班。


    # 写作班的正确玩法：


    开局：选 2 个学员做假想敌（不要告诉对方），结交 3-5 个高频交流的好友（从学员的自我介绍里选出你感兴趣的，或者有成绩的人），链接在精不在多，这几个人是要一直陪你成长的，最好都是追求变现方向的人，后面能一起做事。


