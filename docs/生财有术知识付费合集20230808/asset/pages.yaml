  md: '# 四、做写作分享会或你的专业领域经验分享会：


    分为自主开办和借用他人平台做宣传。


    +   1. 主动开分享会：  做一个细分的分享会主题（一定要有明确的主题，关系到招来多少人听），例如让朋友们转发直播信息，听分享有抽奖等。


    +   2. 自荐或者受邀参加行业里，圈子里的大小各种分享会（不限于写作社群）：  把自己推广出去。'
