- pgno: 1020
  md: '# 3.遇到学员维权退费怎么办？


    ①先了解清楚是什么原因导致他想退费。


    是项目本身交付有问题，还是售前信息沟通误会，夸大宣传，还是他遇到了什么困难等等。以及确定是真的走不下去了，还是只是他遇到挫折后的想法，想跟你抱怨和获得帮助。另一方面，如果确实是项目后端交付有问题，那么你就要思考自身的问题，要么就做好整个交付闭环，要么就不要再招募学员，别做培训了。


    ②安抚和解决问题。


    如果你的项目后端全部都可以跑通而且有成功的学员案例，那么80%以上的可能性是因为他遇到了挫折，需要心态建设和安抚，以及你给出方案如何让他继续走下去。那么这时候你就得扮演一个保姆和心理医生，安慰他，像个男朋友一样哄哄他，然后用自己手头的资源和人脉去倾斜给他，帮他更快的获得正反馈和走上正轨。


    ③复盘售前介绍细节。


    如果经过你的安抚和引导后，学员还是无条件要求退款，那么就复盘一下当时他付费的售前是怎么沟通的。比如发他的介绍内容里，有没有承诺包退包赚钱这些。如果介绍和售前沟通里说明了收费后概不退款，那么你可退也可不退，都没有是非对错，因为已经明确权责关系了。


    相反，如果你售前说了包赚钱包退款，那么这个政策你就得自食其果，本身制定的对你就是不利，但是承诺就是承诺，如果你不想暴雷，就直接退了。'
  merge: -1
  img_proc: true
- pgno: 1021
  md: '还有一种，就是售前没有明确说明，到底是包退款还是坚决不退款，存在争议的，那这一块就比较麻烦了。这种情况，我是比较倾向于退款的，就当带队老师自己买个教训，下次招募的时候提前说明白写上去就行了，格局大点，为以后做大事赚大钱做准备。


    # ④按照具体情况退款。


    如果争议过大，矛盾冲突过大，那么最后还是建议退款。因为一旦信任消失了，那么双方就没有必要继续走下去，再纠缠会造成更大的损失，不符合长远利益。


    如果实在不想退款的，也可以协商退50%的款，或者换个别的项目给他免费做（也就是退款+补项目），这样你自己的损失也会降低一点。当然，全款退费还是解决问题最彻底的，事后就没有纠结了。


    售后维权方面的处理方式，涉及到整个项目和团队的持久性问题。虽然在市面上有很多团队用不切实际的诱饵夸大承诺去吸引别人付费，并且还赚到钱了，但是这个钱最终能不能平稳落地，那还是另说。


    如果作恶多了，可能最后全部都得吐出来，赔进去罚金，甚至进去。所以，割韭菜行为短期能挣钱，但是会放大一个人的罪恶和邪念，最后还无法靠着陆和持久运作。


    君子爱财，取之有道。赚钱不仅要有短期爆发力，还得有长期持续力，这样才能立于不败之地！


    4.学员人数太多了，每天提问数量特别多我忙不过来，心很累怎么办？


    这涉及到信息和沟通的工作效率问题，可以通过以下几个方法解决：'
  merge: -1
  img_proc: true
- pgno: 1022
  md: '①在课程里面，把知识点说得尽可能全面，在课程这一步就解决学员95%的问题，并且引导学员去课程里查漏补缺。


    针对那些不知道知识点在哪的学员，你可以截图画圈圈让他们找到位置进度。课程本身就是一个长期内容沉淀的作品，你只需要录制一次，就可以批量化解决N个学员的问题，所以你把课程做好，就等于在节约自身的答疑时间。


    ②能在群里答疑的，尽量不要私聊。


    同一个问题，你私聊解答一个同学是解答，在群里公开解答他也是解答。两者对于这个同学角度的问题解决，其实效果都是一样。但是对带队老师来说，在群里解答了一个问题，其实是顺带同时帮助群里其他遇到相同问题的学员解决了问题。这样的话可以提前避免问题出现，能够节约带队老师的时间。如果一个问题老师在群里说一遍就能让所有的人学到，那么信息传递效率是最高的。“偷懒”也得有技巧。


    但是如果学员的问题非常的隐私，比如涉及收入岗位等等那些，还是得私下帮他解决问题，不该偷的懒坚决不偷。


    ③引导老人带新人。


    社群氛围和价值观培养好了，新人在群里问的问题都不需要你回答的，很多老学员会直接帮你回答。因为“好为人师”是每一个老司机基本心理特征。也可以通过发小红包去引导老人带新人，引导群里真诚利他的氛围。红包金额虽然不大，但是正反馈效果拉满，这点就跟你写的文章被读者打赏了1元钱一样的心理。'
  merge: -1
  img_proc: true
- pgno: 1023
  md: '弱化官方人员的角色，该放手的多放手，创造社群自动化发动机，让充满价值的信息在群里高效率地转动起来。培训做到最后卖的不是标品，而是社群圈子，是信息差。


    # 5.做培训最后暴雷的人，是什么原因导致的？


    培训后端交付的安全性，最重要的是3个指标，一是售前承诺，二是售后退款，三是能不能跑通变现闭环


    +   ①售前夸大承诺，没有筛选人群。


    在回答售前咨询的时候，没有的东西坚决不承诺，坚决不保证人人赚钱，不虚假夸大 数据，甚至要把数据往小了说，尽可能降低对方的期望值。并且针对不适合的资金短缺的人，要敢于劝退和筛选掉，减少自身风险，尽量对双方都负责任。


    暴雷的培训团队，在售前恨不得把世界上最拙劣的骗术都说一遍，生怕对方不转账付费，比如包赚钱，包回本，包XXX，然后案例全部都用最高水平，甚至把数字夸大个几倍，这无疑极大的抬高了学员的期望值，等到进来后发现并不是那么回事，就很容易有矛盾了。


    这一点抖音海参哥做的就很好，虽然他的视频风格饱受争议，但是他不收穷人的钱，也不做任何保证承诺，所以现在还能稳定在抖音上招商。


    +   ②售后不及时退款。'
  merge: -1
  img_proc: true
- pgno: 1024
  md: '如果在售前没有做好人群筛选，把不适合做项目和花钱的人收进来了，那么很容易出现退款售后的事情。如果金额不大还好，金额一旦大了可能会被发到互联网上传播，并且对簿公堂，造成丑闻。在互联网上事情被进一步放大，最后小事变成大事。比如抖音的小小如（张曼如）收了孕妇6万元，没有做好退款，导致的公关危机，最终也是以退款收场。


    所以在售前就得筛掉那些不适合做项目的人群，比如负债的人，眼高手低的人，急于求成的人，磨磨唧唧的人等等。售后该退款的就果断退掉，承担责任。


    # ③项目无法跑通变现闭环


    做培训你最少先自己做到从0到1的闭环，再去复制别人的从1到100. 如果自己都没跑通变现流程就去招募，那这是人品问题，我不多说了。


    # 六、后记


    1.对于普通人做生意来说，做培训这种业务利润最高，也最赚钱。


    我在2019年大二第一次组建公司团队的时候，当时商业模式变现模式不成熟，没有专注和聚焦。当时有3个业务并行，分别是短视频带货、抖音培训，和企业抖音号代运营。


    第一个业务是有必要做的，毕竟自己有业绩才能带培训。但是对于第三个业务，我就像抖音陈厂长一样做得非常累，钱少事多。比如一个月只收费1万块，我需要满足甲方各种要求，并且当时作为大学生的我，对于合同的内容和权责划定也没有敏感性，最后辛苦干一个月还得给甲方退钱，也牵扯了团队成员大量的精力，少赚了很多钱。'
  merge: -1
  img_proc: true
- pgno: 1025
  md: '最后的结果是，我把一个能赚100万的红利赛道，只赚了30万。对我这个生意人来说，这是个耻辱和重大失误。


    后来我复盘，我大学在抖音短视频行业的收入一半都是来自第二个业务—抖音培训。如果当时我有做培训最赚钱这个重要的商业认知，那么我会果断的把第三个业务企业号代运营砍掉，专注于前端引流+后端做好培训交付。


    > 所以你永远挣不到认知之外的钱，哪怕只是一句话的窗户纸，你没有把它捅破，也终究会失败。


    # 2.知识付费行业本身就是客观存在的大行业，跟直播带货和网红接广告是一样的。


    > 商业的底层逻辑是什么？就是你有需求，正好我很专业。


    交易过程使得双方各自都产生溢价，付费学习的学员获得了知识或者赚到了更多的钱，节约了自己的时间成本，带培训的老师赚取了相应的合理范围内的学费，双方都达成了自己的需求和目标，实现了双赢，这就是良性的商业行为。


    既然是合法的商业行为，那么做项目培训只是社会分工的不同，本身不存在对错好坏之分。不能说别人只要收钱和实现盈利就是罪恶的。这种观念本身就是一种受害者的弱势视角，如果长期持有这种观念，对一个人自身的发展有巨大的阻碍作用。


    市面上骂知识付费培训从业者的人，很多是因为自身没有能力去做培训，想去“割韭菜”赚钱都收不到别人的学费。因为无法完成“信任度”的传递行为，没有人相信他。'
  merge: -1
  img_proc: true
- pgno: 1026
  md: '这种心理，就好比很多骂那些在国外留学和生活的人怎么样怎么样，原因却是因为他自己没有能力出国和享受更好的生活一样。


    另一方面，偏见源自误会。培训行业就是因为有太多没有职业素养道德的从业者，所以才导致了很多不愉快和误会，最后让很多人对做培训的人产生了偏见和抵制。


    # 3.有良性的商业行为，肯定也有恶性的商业行为。


    比如带队老师自身团队很不专业，恶意夸大宣传和作出承诺，却无法提供给学生相应的专业性服务和培训，但是培训费已经提前收取，而且无法退还。这就造成了学生单方面的利益受损，俗称“割韭菜”，并且产生后续一系列的售后维权恶性行为，这就不符合生意人的职业道德，以及商业的本质。


    足够的量变，也会产生质变。当带队老师作恶达到一定的数量，可能导致学生集体维权，对簿公堂，严重的可能会导致带队老师钡销入yu，最后自食其果。市场终会达成平衡，作恶者终将反噬。


    这提醒我们这些知识付费培训的从业者要怎么做？


    # 1.要持续保持对于项目的专业度，投入足够的精力和资金。


    比如花足够的时间去研发项目，或者花足够的金钱去外面付费学习最新玩法，这样才能持续保持专业度和时效性。


    # 2.要有职业素养和职业道德，不要什么钱都收。'
  merge: -1
  img_proc: true
- pgno: 1027
  md: '收培训费是一种提前预支的行为，所以，**收钱应该是带队老师责任承担的开始，而不是交易行为的结束。培训从业者应心存敬畏，敬天地，敬众生，敬自己，小心才能驶得万年船。**


    **3.严格筛选人群。**


    贷款和负债的人尽量不收，别赚穷人的钱。**抛弃渡人的思想，少做给别人雪中送炭的美梦，多做锦上添花的事情。**比如，你的学生赚到钱了，那是因为他自身能力强，你对他做的培训只是锦上添花的作用。


    拿好你该拿的钱，凭良心做好职责范围内的事情。尽量多去输出和利他，把反馈的期望值降低。


    **愿天下没有割韭菜的发生，愿市场经济最终能惠及每一个用户！**


