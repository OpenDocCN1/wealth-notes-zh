  md: '每个字幕组成员在这个模式下，都得到了不同的提升，也通过前面所说的例会制度，分享和交流自己的收获，让整个团队的凝聚力得到了大幅度地改善，加强了组员之间的深度链接。


    在与字幕组的深度链接和共创中，也孵化出了后面的一系列内容栏目和社群产品。这个是某一次会议当中的分享和总结，启发了我后面去做更大的社群服务。


    # 字幕组访谈


    | 对MC的内容评价 | 满足了何种需求 |

    | :--- | :--- |

    | **1. CC字幕对听说障碍人士不友好，有明显的错误** | 零碎时间消遣娱乐 |

    | | 适合初学者入门 |

    | | 满足对于某些行业的好奇心 |

    | | 英语学习的需求 |

    | **2. 有一些大师个人的表达能力欠佳和前期大师课的内容框架不稳重** | 基于MC的社群服务构想 |

    | **具体例子是：Ushe表演课和Jemes写作课** | **1. 让同样聚集的社群交流活动** |

    | | 垂直社群的建设，打卡学习大师课，分享有价值的周边资料，领学大师课的精选片段，解析和讨论特定主题 |

    | **3. 内容大部分是分享大师个人经历和所处行业感悟** | **2. 练习口语的英语提升活动** |

    | **没有过多的专业技能分享，例子主要是：丹尼听夫曼的电影配乐课** | 普泛性的课程作为英语锻炼口语的素材，定期进行直播和口语交流的活动 |

    | **4. 理念和哲学层面的东西对学习者不友好** | **3. 相关专业的字幕君成为大师课的学习粉丝KOL** |

    | **因为大师要更多的是一些很的东西，不是很干净，所以能够听的用户** | 通过社群活动“大师课”导读，带领报告专业大课，建立以粉丝KOL为核心的垂直社群，拓展大师课本身的影响力，打造非中心化的网络型社群
    |

    | **一般是领域的实践者或者专业人士到一定水平的用户，小白用户可能难以汲取知识** | |

    | **具体例子是：安知的领导力课程与内容的领导者经历有共鸣，沃尔的导演课与字幕君——徐杨晓雷的电影创作有共鸣** | |

    | **5. 知识点被剪辑碎片处理的较为零碎，缺乏由浅入深的体系** | |

    | **具体例子是：Ushe表演课** | |

    | **好的范例是卡巴金的冥想课，有一个由浅入深的体系串联** | |

    | **6. 缺乏全球视野的多样性** | |

    | **大师课主要大师都来自美国本土或者是美国闻名的其他文明大师，缺乏多样性，导致价值观和美国观念深在其中** | |


    最后，我还增加了一个额外的内容栏目，就是大师课十日谈。这个栏目旨在邀请优秀的字幕组成员，可以分享自己的翻译收获，并且通过B站的大平台进行直播，吸引流量来到频道里。


    这个活动持续了好几期，也同步邀请了频道粉丝里的KOL做分享，让这个大师课翻译的项目变成一个综合型的分享交流活动。'
