- pgno: 249
  md: '这样很辛苦，真的超级辛苦，当时我才带了4个学员，就已经忙得不行，每天除了自己**做**视频，还要直播，晚上还要给学员解决问题。


    但这样的效果也很明显，我的学员开始一个个出成绩，有减肥学员两个月涨粉1万的，有育儿学员1个月涨粉**6000**，变现小1万的，有同城摄影服务学员，业绩**20万的**。


    这些案例让我对做小红书越来越有信心，**因为它证明了，我做小红书的逻辑是对的。**


    于是，我开始整理自己的经验以及带学员的经验，花两个月的时间，做出了一门课程


    有了课程之后，我的陪跑价格也水涨船高，目前涨到了**3899元**。


    就这样，账号诊断+课程与陪跑，让我在**3个月**的时间里，从**0赚到5万元**。


    # 四、细节


    这就是我的整段小红书起号变现经历，很多小伙伴肯定有疑问，账号定位怎么做的，笔记怎么发的，爆款怎么来的，引流怎么引的，变现话术怎么说的等等。


    现在我来分享一下做小红书的操作细节。'
