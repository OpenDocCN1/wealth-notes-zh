  md: '刚开始直播的时候，为了能快速的拿到正反馈，拿到结果，每天都是 5 点半起床，眯着眼睛打开电脑，然后开启直播，有的时候因为还没有睡醒，讲话都是磕磕巴巴，为此还闹过不少笑话，


