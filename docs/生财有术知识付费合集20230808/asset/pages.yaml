    无论是个人还是小团队，其实这个产品我觉得都算比较优秀的，每个环节都能获得流量，天花板也有一丢丢，一年搞几十**个W**还是容易实现的。


    因为我们团队战略方向已经明确，22年年初已经开始不再操作这个产品。而虚拟市场很大，选品之初，在我们的产品池里有很多类似的品，后面有机会再给大家分享。


