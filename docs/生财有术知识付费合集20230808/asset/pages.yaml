  md: "+   阶段1：主业供应链，投资教培机构  \n阶段2：遭遇双减，疫情，以及二宝出生，失业，试水抖音小店失败告终  \n阶段3：加入生财，定位个人IP\
    \  \n阶段4：明确赛道，做知识付费，抖音卖课  \n阶段5：开启抖音直播卖课  \n阶段6：入选抖音金牌老师\n\n# 阶段一：\n\n我的主业并不是一开始就做教育。我原来的经历背景是在供应链管理，但是自从有了娃，我的心思就在娃身上了，我大娃现在是11岁，就等于在11年之前我就对教育这件事产生了浓厚的兴趣。\n\
    \n15年我考上交大硕士，毕业之后，我就把精力花在了教育相关的工作上。我趁当时线下教培还挺火热的时候，同时投资了上海两家教育培训机构，那两机构主要是做幼儿园和小学以及初中生的相关课程的，幼儿园做兴趣，小初做提分，当时是作为兴趣投资，也确实赚到了一些钱。\n\
    \n# 阶段二：\n\n这个阶段的故事基本上是每一个教育人都会讲的故事，19年开始，教育行业遇到了双减，之后又遇上了口罩事件，同时我家有了二宝，这一连串的事情成了我人生的一个转折点，我们投资的两家教培实在时撑不下去，直接关门了，同时因为二宝太小外加疫情，我就成了一个失业中年人。"
