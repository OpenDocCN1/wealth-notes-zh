- pgno: 1010
  md: '# ①主讲人


    一般是带队老师或者助理。带队老师能出面的还是由本人直播比较好，毕竟是定心丸和灵魂人物。主讲人确定后，开播寒喧——安排学员代表连麦提问——实时答疑——总结引导


    # ②安排代表嘉宾


    开播之前要在微信群里征集积极学员，作为连麦嘉宾进行提问和答疑。当然为了直播的效果和质量，还是得提前让候选人们把自己的问题列举出来给你过目，因为有些问题的质量很差，可能会耽误直播的时间，简单问题你就直接告诉他答案就行了，有一些很有价值的代表性的问题可以入选到连麦互动正式内容中，作为代表性案例进行答疑和讲解。


    # ③实时进行答疑互动


    除了回答嘉宾的代表性问题，也要照顾好其他学员的实时提问，注意好时间节奏，努力做到寓教于乐，妙趣横生。'
  merge: -1
  img_proc: true
- pgno: 1011
  md: '![](img/00c8ed3105ac934755346b58149acc95_1011_0.png)


    # 5、保姆式解决问题


    ①培训老师的尽头是保姆和家长。


    别以为做项目培训只是谈项目本身怎么怎么样，其实你作为带队老师，更多的是一个灵魂人物的作用，你需要学会安慰、协调、插科打诨、活跃气氛、引导三观等方面的能力。


    最主要的是，锻炼你的解决问题的能力。学员有需求和遇到了困难，你如何保质保量的去解决他的问题，并且达成比较满意的结果，既考验办事效率，也考验情商智商逆向思考等。'
  merge: -1
  img_proc: true
- pgno: 1012
  md: '所以做培训是一个独立承担责任的过程，是了解社会和人性以及自我提升的极佳工作，如果你全部都坚持下来了，那么你本身也算个人物了。


    # ②学会分工和运筹，以结果为导向。


    一个项目培训规模做大了，不可能所有的问题解决都由带队老师本人来负责，人的精力很有限。所以就涉及到专业化分工的问题。如果基础的底层工作能够安排给员工和助理做，那么老师就能释放出双手去做更重要、不可替代性更强的事情，比如对外社交获取资源、付费学习研发、前端引流进人等等。


    学员付费进来需要的是什么？是你帮他解决学习过程中的问题。至于是不是哪一个人帮他解决，其实并不重要！


    只要你能最终帮学员切实解决问题了，那么不管什么方式什么办法都可以，要以结果为导向。比如请一些优秀的老学员跟新人分享一下，比如让助理解答一下，比如花钱去获得解决方法等等，法无禁止即可为。


    小作坊有小作坊的玩法，大团队有大团队的玩法，要结合自身实际情况来解决 问题。


    # 二、前端引流


    引流就是去微信之外的平台吸引你的目标客户，方法分为免费流量和付费流量。前期钱不够的建议搞免费流量，虽然要研究平台规则花时间，但是剩下来的钱全部都是利润。'
  merge: -1
  img_proc: true
- pgno: 1013
  md: '后期如果规模大一点，时间资源比较稀缺，那么就花钱去买别人的流量，算好投产比ROI，比如引流1个人的成本是30元，结果平均下来一个人给你产出了60元利润，那么投产比就是1:2.然后不断地买流量和成交，获得稳定的流量来源。


    为什么很多人招不到人，或者招募几个学员后就停滞不前，最后项目培训不了了之？就是因为没有稳定的源源不断的流量来源，不知道如何搞流量。


    # **1. 免费流量**


    引流和搞免费流量，本质上就是农民工项目，需要的不是学历和思维，而是执行力和体力。本质上还是搬砖的体力活，就看每天能不能去其他平台发大量的作品，数量大于质量，量大出奇迹。


    你在公域流量平台（抖音快手小红书等等）上，输出有价值的图文/短视频内容，对别人有帮助，那么这个内容就自带流量，给你带来用户。你再去把用户导流到你的微信里，就成为你的私域流量，平台带不走，你可以一直吃。


    比如你想吸引想发家致富的创业粉，那么你就去输出发家致富的内容。如果你想吸引育儿教育的宝妈，那你去输出教育培训的内容，以此类推。


    目前最好的免费流量平台就是抖音，来人的质量也是最好的。前期做好免费流量，剩下来的钱全部都是利润，适合小白操作。


    # **2. 付费流量**'
  merge: -1
  img_proc: true
- pgno: 1014
  md: '这一块适合专业化团队或者至少少经验的个体玩家操作，因为有一定的风险承受能力。然后每个平台都不一样，同个平台的每个流量主号主都不一样，需要广泛去投放和测试数据，有亏有赚。


    具体的引流方式我不多说了，你去付费给有结果的人学习，并且严格执行下去就行了。方向对了，细枝末节的方式方法也就没什么大问题。


    # 三、个人IP转化率


    个人IP就是个人的品牌。比如海参哥，广东夫妇等等，都是个人IP。个人IP本质上就是解决信任度的问题，做好个人IP就是积累更多的信任度。


    为什么很多人想做培训但是招不到学员呢？就是因为没有做个人IP，解决不了信任度的问题。比如那些天天在朋友圈发项目的人，但是他只发项目广告，没有文章内容输出，没有专业度，也没有真人出镜，有的就只有朋友圈广告。说今天又赚钱了，多少多少钱，风格跟骗子无疑。


    有时候他还会忍不住发一些抱怨的负能量的吐槽内容，更加让人觉得他这个人格局很低，信任度进一步下降。


    其实转化率更多是跟个人IP挂钩的，而不是跟某一个项目。一个成熟的个人IP，推不同的项目都能成交和招募到学员。一个不成熟、做得很烂的个人IP，再好的项目也很难推出去。


    个人IP要做好以下几个方面：内容输出、定位、项目后端变现、前端引流。大多数人做培训招募只做到了“项目后端变现”这一点，每天没有内容输出，没有专业度，给别人提供的价值和印象很一般，所以也招不到人。'
  merge: -1
  img_proc: true
- pgno: 1015
  md: '# 四、年费和复购


    目前市面上做的比较专业的知识付费团队，很多都是采取“年费制”的收费模式，比如樊登读书会，生财有术，比高研习社等等。


    永久服务学员和客户是很难的。因为只收一次学费，后端如果再没有进行利益捆绑和后端被动收益，那么这种组织形式是不长久的，而且没有复购。任何一个产品没有复购，都是不值得做的。


    所以我建议按照3个月、6个月、或者年费制来收费，尽量设定一个可量化的时间。


    反过来说，如果你不设置时长，永久服务，但是学员他们真的有耐心一直做下去吗？并不会。


    一般学员付费后，对于项目的新鲜感只有3-6个月，持续一年以上的激情和积极性是很难的。所以，顺应人性，同时也放过自己，设定合理的时间和价格，完成交付，成全彼此，是更好的策略。


    同时，第二年的续费数据，就是对于第一年服务和工作的考核。如果续费率低，你就会想着怎么去优化提升，如果续费率高，你就会坚持你觉得正确的事情，放大自身优点。


    普通人付费互联网项目，其实是为了稳定地获得赚钱渠道和享受高质量的社群服务，只要你能满足他的需求，价格控制在合理范围内，收费方式都是可以他们接受的。'
  merge: -1
  img_proc: true
- pgno: 1016
  md: '# 五、常见问题答疑


    # **1.遇到课程盗版外泄怎么办？**


    作为原创作者的你可以选择维权，也可以选择不维权，没有对错之分，只有利弊。


    # ①本身是好事情


    如果你发现自己的课程被盗版和外泄，甚至白嫖的人加到你微信让你帮他解答问题，那么我首先恭喜你——你做出成绩了！起码你在这个项目和行业里面有了一点点影响力。


    因为如果你招募的人数比较少，那么你的课程连被盗版外泄的机会和资格都没有。


    评判一个培训做的有没有足够的影响力和成绩的重要标准，就是你去淘宝、拼夕夕、咸鱼等等方面搜一下你的名字，看看有没有人卖他的课程或者作品。


    现在市面上影响力大的培训大师，电商平台上面随便能搜到他们的全套课程。


    那么，为什么那些大师没有选择维权打假，任凭这些卖家猖狂呢？难道是因为盗版课程外泄并不重要，对他们无关痛痒吗？


    没错，正是这样。而且两者的定位人群也是不同。


    买盗版课程的人是什么群体？大多数是白嫖党，他们不懂付费，不懂付出和感恩，所以这种群体最终也不会做出什么成绩，甚至买了课程后就放在网盘里积灰了，全过程只是逗自己开心罢了，乐呵乐呵。'
  merge: -1
  img_proc: true
- pgno: 1017
  md: '真的，你有没有听过哪个大佬是通过学别人的盗版网盘课程起来的？我没有听过，相信你也很少遇到过。因为，学课程本身没有用，只有拿出执行力去实操，跟老师及时沟通答疑迭代，才能做出结果。


    相反，如果真的有人通过看我的盗版课程，最后做出了业绩，那么我很恭喜他，因为他本身就是能人。可以在众多白嫖的失败者中杀出一条血路获得成功，这本身就需要通天的本事！


    以上是对于学员角度的分析，那么你的课程盗版和外泄对你就只有坏处吗，有没有什么好处？答案是肯定的。


    一个品牌能不能做大做强，不在于它卖出去多少个产品，而在于有多少个人帮它卖产品！


    相应的，你做培训成不成功，不在于你自己卖出去多少个学员，而在于有多少人在市面上帮你推广和宣传！


    如果市面上有很多人拼了命要卖你的东西，你还需要担心销路和宣传辐射范围吗？根本不需要担心，你的影响力马上也会打出去！


    如果你的课程上面打了水印，比如留了微信，那么随着你的课程外泄，学习者也会加到你的微信，旁观朋友圈。高能量的人朋友圈都是有巨大的吸引力的，搞不好一个白嫖党最后就能成为你的付费客户。


    # ②维权的结果不尽人意'
