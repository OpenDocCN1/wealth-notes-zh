- pgno: 487
  md: '因为你电话结束后，对方是需要思考时间的，他会思考自己到底需不需要你的产品？你到底是不是真的值得他信任？


    所以在电话结束后，你需要在 **15** 分钟内，趁对方热度还在的时候，微信私聊给到他你的成功案例、个人故事、销售信（产品介绍），让他了解一下，这一步很关键，能进一步帮助他了解，加强他对于的信任，以及对你产品的需求度


    然后，如果当天客户没有做出决策，你可以在第 **2** 天的时候做个回访（选个对方休息的时间，比中午、晚上）


    > 注意！这个回访不是让你去问对方“你考虑的如何了？”


    千万别！这是大忌！你这么一问，对方只会觉得自己是在被推销，就会有抵触心理，大概率前功尽弃！


    所以第 **2** 天的回访，你应该再次进一步提供价值，然后放大痛苦和好处，最后给对方留一个钩子


    回访公式：进一步提供价值+放大痛苦和好处+留个钩子


    回访我建议你可以给对方发语音，因为你们之前电话沟通过了，所以相对来说信任感会更强一点，这时候你发语音，对方不会反感，反而能拉近距离。


    我举个话术的例子（为了你们内容阅读的完整性，这里我就不一句一句发了）'
