- pgno: 970
  md: '# #抖音


    在生财整整潜水了一年，决定发一次贴。（文章最后有直播带货的大坑，最少让我赔了五百万）。


    大家好我是骏马小叔儿，以前在互联网上的名字是申老板，当年与现在的海参个当时是同一时期产物，但是没干过他，然后转向短视频孵化ip与直播带货运营ip等等


    在接下来的半小时里我会跟大家深度地去剖析我如何从一个月销200wGMV的知识博主半年转型成为月销500wGMV的带货达人，并且创立电商公司每月总营收超3000w。目前又把一百多人的团队解散，准备重新塑造，主打重新开始。


    为什么转型、如何转型、踩了多少坑、交了多少学费、有哪些经验心得……在今天跟大家好好分

    享下，我希望也能够激发大家的思考和讨论。


    我们先讲第一个话题，创业五年，作为一个知识博主，单月稳定GMV200万，为什么要转型电商带货？


    第一个原因，选择做知识博主并不是一个商业上审慎的考量。


    我之前一直是上市公司的管理岗位，也一直有一个创业梦，我希望能够赚更多的钱，纯粹是从我当下立刻就能变现的角度出发，我选择了卖我的时间，也就是去做咨询，从一个小时收500块，到演变成一个小时2000块钱，再到可以带一些大课课，一个小时5000块钱，再到我决定卖一些录播课，把我的时间去形成复制。


    后来当我们一个月稳定变现大概60万的时候，我跟我当时的同事决定出来创业。起初18年开始做直播带货但是到了21年初我们的创业时机刚刚好赶上了抖音知识付费爆发，也就是在2021年的时间，我们在抖音从零起号把我们的四个合伙人的账号都做20左右粉丝的层级，我也很快达到了单月稳定GMV200w+。


    做了两年，我发现了一个很可怕的事实，从20年到21年到22年，每一年我们的营收都在200%以上增长，但是我们的利润并没有显著增加，反而人越来越累。在我发现我们做的很累的时候，我就去看我们的同行。结果更可怕的事情发生了，我发现我们已经是赛道里面很少的在赚钱的公司，我们的同行都比我们更累，甚至烧着投资人的钱，到现在都从来没有实现过盈利。我发现这个赛道很奇怪，好像没有人是在这个里面能轻轻松松的赚钱。'
  merge: -1
  img_proc: true
- pgno: 971
  md: '这件事儿同步在启发我。在21年的时候我们孵化了一个账号，他当时想做一个玩具类目赛道的拆箱ip，但是在给他起号的过程中，我们发现用户的诉求——看着好的产品就想要的到。所以我们直接给他定位他的为带货达人，主带高端玩具定向高消费男士人群，后期我们引入了一些非常好的供应链给他之后，他的账号越做越好。在21年刚起步的时候，年底他开始带货，一场可能三万gmv，然后一个月他可能播20场，一个月就60万，当时谁都没有在意他的量级。可是到了22年他反而像滚雪球一样，在618的时候当日直接做到了几十万，到了双11的时候当日甚至做到了百万级！他越做越轻松，在到单月千万级的时候他的团队只有5个人，而我们公司月销300万的时候已经有了接近50个人。为什么会有这种差异？知识博主和带货达人的商业模式有什么区别？我不断问自己这两个问题，发现了三个关键点。


    第一，复购！


    要不是k12，知识付费的复购率都是很低的，尤其是像我们这样的成人教育，整体不超过20%。这注定了我们想增长必须要去抢流量，而流量越来越贵新人越来越少，赛道越做越卷。电商带货如果选对赛道，比如高端产品，复购率可以做到70%以上，用户只要相信了博主，拿到产品吃了或用的有结果，他会持续在这购物，甚至会在这锁死一辈子。


    第二，可复制！


    知识付费公司增长最难的就是IP的不可复制性。往往一个公司就是围绕1-2个IP的个体户，再想复制发展特别难，因为用户买的就是你这个人，对人的信任的建立是需要漫长的时间。当这个IP不在，用户就不买单了。可是电商更多的是货，你的货足够好，人就没那么重要。我们孵化的这个带货博主双十一的时候一天播了16个小时，他自己播了8小时，另外8小时都是副播完成的。培养一个带货主播上手只需要一个月，但培养一个知识博主至少要半年。这种可复制性的差异决定了公司天花板的上限。


    第三，团队配置！


    我的朋友他双11做到单日百万时，他的团队只有5个人（1负责人+2跟播+1私域+1剪辑），而当我们知识付费做到全年3000+万量级的时候，我们的团队已经70我相信所有的老板都明白，团队人多不仅代表着你的业务重，代表着你的支出高，同时代表着你的风险更大。换句话说，我这个朋友如果这月想休息，只要付5个人的工资，而我们要付50个人的，自己真的变成了生产队的驴。


    这张表格是我整理出的电商和知识付费在这三点上的差异化


    这三个原因让我21年末毅然决然带着全公司转型。


    接下来分享的内容就非常的实操了，这半年我们做了哪些事情，让团队可以达成这种超高幅度的增长，让我一个完全的新人进入电商带货赛道，可以能够稳定的月销500w+？'
  merge: -1
  img_proc: true
- pgno: 972
  md: '【第一点，我觉得最重要、也是新手最容易犯的错，就是选品。】


    在我转型带货的时候，其实我看过蛮多的账号，都在尝试转型带货，但他们都犯了一个最大的问题，就是他以为的带货是他自己见过的带货——找一些销量高的品，看起来好卖的，先卖起来把人攒起来再说。然后你上了一堆9.9、29.9、99，辛辛苦苦卖了好几天也没卖出去几千块钱。


    错在哪儿了？我们经常刷到明星带货直播间，明星在上面扭一扭说9块9，然后直播间10w+，然后销量刷的特别疯，一场一天可能带个几千万几个亿，不都是这样带的吗？


    但是那不是我们普通人可以选择的带货，目前的带货已经进入了后半场，如果你这个人不是自带流量，你不是张柏芝，你根本不要想这种9块9带货的方式，这种方式必须是强流量支撑，加上你的直播间非常的热闹才能够满足。


    而我们普通人能选择的一定要是那些明星直播间卖不了的货或他不愿意卖的货。抖音就像是一个大的游乐场，这个游乐场里面有很多摊位，最中间几个大舞台里面卖大众的东西，而你如果想在这个游乐场竞争，你要到旁边去开一家精品店，从这个集市里面分流出来的人群，他有付费能力的，对这个感兴趣的，他会走进你的精品店，在这里买你的东西。所以给大家的第一个经验：放弃低客品，选品永远只选高三高类型的产品——高客单！高口碑！高复购！第一个选品原则就是——高客单！如果你想开一家精品店，精品店要在游乐场活下去，你必须锁定一群有高付费能力的人！什么是高客单？平均客单价3000以上，GPM做到1万以上，也就是抖音给你推进来1000个人，他们要至少完成1万块钱的销售额。


    很多人就会说这种品怎么卖？这种品根本卖不动。你太小看抖音了，我们有很多人在抖音消费过几千元客单价的产品，抖音覆盖了一半的中国人，有消费能力的人一点都不少，而当你一个人收3000块钱，你今天晚上能收30个人的钱，你是不是直接就有了9万的GMV，你一个月是不是就接近300万了。而这种高客单我们可以想象到底哪种类型的产品？比如说保健品、电子产品、首饰以及高端女装，或者精品家居家具等等，这种店才是真正的闷声发大财。又会有人问，那我一开始卖贵的卖不出去，我能不能先卖9.9积累点人气再卖高客单？绝对不可以！因为抖音直播间是基于标签的推荐，你卖便宜的，来的就是买便宜货的，你卖贵的，才能推进来真正有消费能力的。所以最开始就要高客单起号。第二个选品原则就是——高口碑！很多主播我们看着他起来，又看着他塌房。原因都是因为他不爱惜自己的羽毛，把用户当韭菜。都是卖保健品，都宣称抗衰，但是有的产品它根本做不到，有的产品你吃完真的能抗衰，很多主播自己都不懂，哎呀看哪个品牌方对我热情一点，哪个佣金高一点我就选哪个。结果你发现你带的差的产品，它可能第一波让你赚到了钱，然后接下来就还没有任何的水花，甚至你的口碑分会被直接拉低，导致你一波一波的用户对你失去信任，所以高口碑这件事情它跟前面一个高客单是衔接的，当你做高客单生意'
  merge: -1
  img_proc: true
- pgno: 973
  md: '意，你必须要要有对这个行业的专家认知，这是大家一定要培养的。如果我今天去卖个可乐，我卖可乐我不需要认知，因为可乐就是可乐。但当我今天卖3000块钱的保健品，我需要极强的认知，3000块的保健品它必须得有用心，要不然用户买完骂你，你觉得你的号还能做多久？所以我们是跟供应链深度合作，这里面也有一些机缘巧合，就是得到了非常多业内信息，我们直接深度绑定了—个品牌，这个品牌也是在后来给他做了完整的店铺自播，不仅做达播，帮他把自播去起盘。一句话，什么叫高口碑？就是主播千万不要想赚快钱，这个东西我觉得差不多，我试了两天我就上了。第三个选品原则就是——高复购！这个也是三高里面最有难度一点。所以为什么很多人带货会觉得很难，第一步就在选品这上面踩了大坑，大家都可以用三高原则去审视一下自己的货盘—一高客单、高口碑、高复购能不能做到？如果你能做到，那你一定可以把你的直播做起来，只要你不傻，只要你团队不傻，我觉得我们团队能够做得很顺利的原因，不是因为我们的直播能力强，其实就是因为有选品这一块，我PK掉了99.99%的人，我们直接选中了保健品赛道，并且是高端保健品，并且是抗衰老类保健品，而且是真正有用的抗衰老类保健品。你选择了一条难的路，越走越简单，如果选择一条简单得路，你越走越难。最后强调一下，好的选品是成功的一半，千万不要贸然转型，不选好品永远不要转。


    # 【选品之后的第二个经验——专家人设的塑造。】


    选品跟达人设它形成一种天然的联系，当你选到了三高产品，你这个主播他就一定是专家型的人设！这也是知识博主转型的一个优势，知识博主天然就是要专家，你空气都能卖出去，这么好的产品还能卖不出去吗？什么是好的专家人设？比如你卖保健品，你是营养学专家、院校博士、中医世家、健康达人，这都是极好的人设。如果没有这么专业怎么办？和赛道&品牌建立联系！我转型到保健品赛道，本身也不是营养学专家，那我就直接说我是这个品牌在国内合作的运营公司老板，我跟这个品牌已经深度合作xx很多年，我全家人都在吃。这也是一种信任的背书。同理，你是某个品牌的推广大使/营销负责人，或者是长期xx产品的重度爱好者，自己测评和尝试过xx种种都是专家人设，总之，给用户一个相信你的理由。再举一个例子，我是一个英语老师，转型带货护肤品怎么立人设？我在xx高校做了xx年的老师，因为自己的皮肤问题研究测评了xxx种护肤品，最终选择了xx这个产品，甚至小众品牌联系上并建立了合作，也帮助他们完成xx市场的推广。（举例作为参考，以真实情况为准）知识博主的表达力是天生的优势，人设稍微到位一点，辅助专业知识的讲解，用户的信任会很快建立。当然在转型过程中要学习很多新行业的知识，我相信对知识博主来说不是难事。这里再补充一点，知识博主转型电商一定要把自己绷的精致一点！看起来像在用好东西的样子！很多知识博主特别朴素，但是咱们真的是高客单，你要看起来是真的用得过的才行。所以发型妆容衣服都要精心搭配下，看起来越低调的贵气越好。'
  merge: -1
