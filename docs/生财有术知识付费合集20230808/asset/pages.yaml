  md: '例如苹果通过一款丝滑的手机，给予消费者价值，然后通过独特的操作系统完成绑定， 让全世界30%的消费者离不开它，于是便只能给苹果不断上缴“苹果税”。


    在爱与恨的交织中，痛并快乐地“上供”。


    而这种心法，则不仅仅是在“财富”领域，在人际和情感领域都可以广泛复用。


    因为这种心法的实质，是在教你如何获得权力。


    而人世间的一切，本质都与权力有关。


