    小结：没有流量怎么办？不会包装怎么办？不认识平台运营怎么办？刚开始做课程课程没数据怎么办？\n\n没有流量我们就要去创造流量，一定要主动出击。你没有流量谁有呢？平台有，有那么我们想办法找到运营，问一下他们的合作标准，再努力去达到。看看公众号有没有商务联系方式，招募讲师，合作联系方式等等。\n\
