- pgno: 480
  md: '这时我会问他：那你目前有遇到什么困难点吗？我看下哪个资料更适合你，有不同的资料类型


    通常这个时候，对方会直接告诉他遇到的困难，你可以从他的回答，就大概能判断你是否能帮助到他，他是不是你的潜在客户，


    如果这个时候他的回答，你觉得你帮不了他，不是你的潜在客户，那么你直接把资料发给他，后续在微信里通过朋友圈、社群、直播等方式养着就行


    如果这个时候他的回答，你觉得你能帮到他，那么你就给他一个大概的方向建议，


    注意，这里只给大概的方向建议，不要给具体的解决方法。因为这里的目的，是为了吊他胃口，引发他想要进一步了解的好奇心。


    如果这时候你直接给他很具体的方案，那么他 就会很有获得感，觉得已经得到了，不需要再继续和你咨询了。这点很重要，一定要注意！给大家举个我的例子


