- pgno: 517
  md: '**比如：领飞创业IP**相关的内容什么都讲，也可以只讲开店创业，抖音创业、咸鱼创业、自媒体创业、写文章赚钱、拍视频赚钱、地推赚钱。。。等等


    # 项目应对趋势可随时变化


    **比如：**


    抖音小店流行、知识博主流行、咸鱼无货源流行、书单号流行等等，这些都是可以变的，也许是买来的项目，也许是合作的项目，也许是自己实操的项目。


