  md: '之前写了 10 个知识付费行业新心法，最近又更新了一些，把后续的内容整理上来，希望大家有些启发。


    https://t.zsxq.com/0ed2pc8Q5（之前1-10链接）


    **11、其实我尝试过很多新的玩法和项目，但是80%都失败了，而我这几年赚到的钱，其实是 20% 成功的结果。**


    我认为创业失败是必然的，成功才是偶然的，而知识付费创业的好处就是帮你把成本降到了最低，而很多人不明白这个逻辑，既然成本最低了，就算失败你也不会付出太惨痛的代价，那为什么不多去尝试一下呢？


    **12、做知识付费创业，一定要保留边界感**，其中最重要的边界就是：这事我不做，这个用户我不收。


    劝退其实是一种营销方式，劝退用户，然后广而告之，让大家看到你有什么生意，不做什么生意，你服务什么客户，不服务什么客户，这样喜欢你的人一定会越来越喜欢，继而找你来付费，不喜欢你的人，就会更加远离你，也省了你的时间精力。


    所以，保持边界感，既然帮自己赚钱，也是帮自己节省精力。


    **13、永远记住一件事：除了阅读、构建知识体系和生产内容这3件事自己做，其他的一定要尽可能外包出去。**


    以前没有团队的时候，我总想着什么事情都自己做，聊用户啊，拉群啊，在群里活跃气氛啊，结果你的大部分时间都会被这种重复性的工作占用，根本没时间提升自己。


    ![](img/00c8ed3105ac934755346b58149acc95_4_0.png)'
  merge: -1
