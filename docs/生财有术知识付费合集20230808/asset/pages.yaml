    # 一、如何做一个无人直播助眠号


    助眠账号主要就是通过直播间中放一些助眠的白噪音，吸引用户停留在直播间，且这类直播间停留时长普遍较长，系统很容易判断这是优质直播间，便会继续推流。


    ![](img/00c8ed3105ac934755346b58149acc95_777_1.png)


    通过圈友大佬们分享的一些无人直播保姆级教程，我们启动了账号。


    778/1029'
  merge: -1
  img_proc: true
- pgno: 778
  md: '# 主要流程：


    1. 注册账号并养号3-5天，期间可刷一下同行直播间。养号主要为了过风控，让系统判定账号为真人使用。因此我们要尽己所能让其像正常使用。


    一号一机一IP，注册时使用移动网络；每天在不同时间不同地点使用，如通勤路上、午休时间在办公室短时间使用；


    看的内容可以多样一些，泛娱乐、旅游、美食之类不同内容；


    点赞关注评论加粉丝团以及购买商品等，每天累积养号1.5h即可。


    2. 准备直播素材，可到油管下载一些睡眠场景图片，在[喜马拉雅]APP中搜索助眠白噪音音频，通过剪映等剪辑软件制作一段直播间里循环播放的素材。


    以下会详细讲解素材制作过程的避坑点，个人总结的经验是素材需遵循以下几个要点：


    +   1. 画面素材有看点

    2. 音乐素材不杂乱

    3. 音画匹配较和谐

    4. 文案具有互动点


    3. 企业号半蓝v认证+1000粉丝开通电脑直播权限。首先需要提前办理个人营业执照，若账号使用个人实名认证就不需要企业号半蓝v认证。'
  merge: -1
  img_proc: true
- pgno: 779
  md: '营业执照可以自行在当地工商局网站线上自助办理，或在淘宝等电商网站找商家代办，没有类目要求，选择【互联网服务】即可。


    打开抖音—我—右上角三条杠—企业服务中心—点亮蓝v，按照提示完成前2步，到达第三步点击空白处退出，即可完成半蓝v认证。


    1000粉丝是抖音使用直播伴侣开播的硬性要求，在直播伴侣中，开播按钮处会有相应提示需要解锁开播权限，如果粉丝量不够可以在网上找刷粉渠道，价格视市场风控情况会有所调整。


    当解锁开播权限后，即使开播时粉丝不到1000了，也是不影响开播的。


    +   4. 在晚上21点到次日上午8-9点这一期间直播。


