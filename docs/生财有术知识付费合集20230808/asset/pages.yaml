- pgno: 98
  md: '这个定位用一句话概括之后，就应该能让你的客户为你掏钱。如果他没有动心，说明咱没敲到痛点。


    那我这个学霸课的定位，概括出来就是：


    为3-15岁家长，用299的价格，以录播课的形式，提供从幼儿园启蒙一直到中考这条路径上的学习攻略，让家长思路清晰的知道每个年龄段的学习重点和安排，同时给到他们实操，助力家长把孩子养成学霸，最终实现轻松跨过中考，不被55分流的目标。


    这个定位里面包含了这些要素：1.我的目标客户 2.价格 3.我提供什么样的服务？4.我能帮他解决什么问题（痛点）。


    这几个要素是最基本的要素，当然如果你还能更加明确，譬如用什么样的路径，什么样的亮点这些都想明白了，我觉得基本就能着手去做了。


    第四，最好还有一些PLUS.


    因为给人IP是一个活生生的人，所以我们如果一直只秀专业性是不够的，你要用你的真实性去打动用户。如果你的用户能说出来你是个什么样的人，那基本上也算成功了。


    所以我们看到很多IP特别能怼人，有些IP特别能哭，有些特别贴心，这些是在专业性之外贴的个人标签，互联网时代，能有这样的标签更容易火是不是？（这个点我没及格，哈哈）


    那这个就是我的个人定位的历程。'
