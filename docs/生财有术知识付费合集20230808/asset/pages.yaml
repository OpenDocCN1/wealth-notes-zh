  md: '我们母子二人，每天睡觉睡到自然醒，起床吃饭后各玩各的。我躺在床上看看小说和连续剧，孩子自己画画和玩，可是不知道为什么这样相互不打扰，并且毫无压力的情况下，亲子关系却没有变得更融洽。


    > 圣诞节前夕的一天，我在看小说，孩子在画画，


    > 他问我：“妈妈，你能在旁边陪着我画画吗？”


    > 我说：“我现在不是在沙发上坐着陪你吗？”


    > 我不理他，孩子在家里一遍又一遍地大叫：“你能别看手机吗？就坐到我的边上来看着我吗？”


    > 不知为什么，我心里特别生气，我觉得孩子不理解我，我在沙发上看手机，不是也是陪在他的身边吗？为什么一点点小事而大叫呢？


    > 我觉得自己孩子的个性非常自私偏激，心里的火越烧越旺，在他大叫地时候，我走过去狠狠地打了他一巴掌，并恶狠狠地盯着他说：“你不能好好说话吗？你再叫，我就再打你。”


