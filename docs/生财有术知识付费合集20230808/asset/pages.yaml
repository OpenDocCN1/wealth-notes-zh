- pgno: 50
  md: '日期：2023-04-04


    大家好，我是咪舍、13年经验设计师


    自媒体创业者


    经过2022年一年的自媒体创业，我虽然没有特别惊人结果，但也跑通了一个知识付费流程，这个经历让我对赚钱认知有了更深 的理解。


    我是去年在公司经历了被裁员，当时的状态十分纠结内耗，也十分不适应，既想去上班，又想像生财的大佬一样开启赚钱模式。


    去年的整体市场环境还有自己的大龄处境，很难有好的机会。


    于是4月份参加大航海直播，我开始尝试知识付费，写文章、直播、找自己定位，也出了一些不太好的成绩，公众号文章数据历史最高，小红 书内容10w+，被很多大平台转载，被媒体采访，但我一直找不到一个好的方向去变现。


    我以为自己全网1w+的粉丝，怎么还不能变现呢？


    事实上我发现一个9.9元的引流内容也十分难做成交转化，我变得异常沮丧。


