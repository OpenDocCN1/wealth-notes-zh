- pgno: 462
  md: '在流量变现的最大卡点，就是当你频繁在推荐不同的产品时，你是否会迷失自己的定位？打破这个卡点的方式，我觉得公域平台里的内容输出，是需要垂直，细分，精准。


    可是在私域里，普通人不需要有太垂直的定位，更重要的是从工具里脱离，突出你自己的真实，有血有肉的人，因为私域的变现核心，就是信任。


    所以即使我不断地变化不同的副业项目，只要有信任在，我的产品可以满足用户的需求，就可以做到流量互通变现。


