  md: '# ## (精华帖)(144赞)直播售卖中考规划课程，一年变现 40W+ 的经历分享


    作者： 汤鱼儿


    日期：2023-02-03


    Hi，我是汤鱼儿，上海交大双硕士，抖音学浪金牌老师，6年+学习规划师，有培养过3000多名线下学霸的经验。


    但去年我也经历着加入生财2-3个月找不到方向、教育行业遭遇双减，疫情，以及二宝出生，失去工作等一系列事件。


    这一年多，我从入生财时完全不知道线上是怎么回事，到现在差不多1年多的时间线上变现40w+，很多东西确实该梳理一下。


    为什么切入家庭教育赛道，也是跟着 @沐文 和 @花爷 学习打造个人商业IP，确认了教育博主的定位以及卖课的变现方式，又跟着抖音IP直播航海实操，当时变现很快，基本上面10场就开始陆续有家长买我的课程。


    课程的逻辑是：为3-15岁家长，用299的价格，以录播课的形式，提供从幼儿园启蒙一直到中考这条路径上的学习攻略，让家长思路清晰的知道每个年龄段的学习重点和安排，同时给到他们实操，助力家长把孩子养成学霸，最终实现轻松跨过中考，不被55分流的目标。


    转化路径是：抖音直播卖课-->客户进入粉丝群-->部分引流到个人私域。


    那接下来就把我的故事详细给大家听一听，以及一些经验和感悟也可以分享给大家。'
