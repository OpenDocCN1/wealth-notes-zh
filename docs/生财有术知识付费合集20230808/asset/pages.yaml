- pgno: 355
  md: '第一篇文章十万加发表后，我把所有能发链接的群转发遍，也让朋友转发文章链接（变现成绩少时候最好不让家属们知道你在做写作变现，易打击写作积极性），把链接发在朋友圈让编辑们刷屏时看到。


    随后就有我之前有加过微信，但是没写过稿的编辑约我写，从这时开始，不用四处开发新号投稿，集中在几个号写（注意性价比），一边积累过稿数量，顺顺利利赚钱，把阅读量数据好的文章链接整理一个文档，投向优质账号编辑要题写，进了搜渡人作者群，百万粉丝号inslay作者群等，渐渐地写的稿子也多了，稿费也上了台阶。


    > 用你的 10 万加作品和优质文章作为跳板，挑战更高级别的号，获得更多文字变现机会和荣誉感。


    > 人往往因为看到成果而受益，愿意做得更多。


    其实写作变现这块，一些按年统计，变现总金额高的人，并不是单一的保持高质量文章输出，而是质量文和流量文通吃。


    用文字或带给他正能量，输出深度思考，或提供饭后闲聊吃热搜的流量文，两者本身没有对错。'
