  md: '# 怎么获取客源？


    还是一件代发，整理全网那么多的创业相关内容，用自己的方式分享，获取认同你的粉丝，信息差永远存在，你说的就是你的。


    # 为什么要做


    # 【创业知识博主】


    # 多久能赚钱


    为什么要做创业知识博主，多久能赚钱？


    这是2个问题


    先回答下为什么要做创业知识博主？


    其实创业知识博主属于商业IP


    商业IP与创业IP具体的划分不是特别明显，关键在于你如何细化分；


    **商业IP侧重：** 营销策略、商业模式、创业方向、经济宏观、创业案例。。。


    **创业IP侧重：** 具体项目、赚钱渠道、创业类目、个人经济、创业案例。。。'
