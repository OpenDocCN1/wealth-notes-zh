  md: '比如，拿刚才的截图举例子，我会这么说：丽丽（最好称呼对方昵称或姓名，更加拉近距离），你目前核心要先解决的，是用户对你信任度的问题，


    你现在直接在群里推商品广告的方式，用户对你的信任感是很差的，如果你持续按现在的方式在群里直接只推商品，那么用户对你的信任感就会越来越差，你的业绩是不可能做得起来的。


    但是如果你解决了信任感的问题，那么用户就会很关注你在群里推的商品，很容易被你种草，自然而然会更容易成交，那么你的业绩很快就能做上去了


    当他认同以后，你再提你能够帮助如何帮助他解决这些问题，并且这里可以举 2~3 个你的成功案例，更吸引对方，同时加强对方对你的信任感


    （注意，在对方没有进一步问你产品时，你不要急于介绍自己的产品，否则推销感就会很重，对方会有防备心理）


    当对方进一步问你产品，或者问你如何得到你的帮助时，你再和他介绍具体产品


    以上就是电话销售的 3 个关键步骤


    当你做好以上 3 步后，有的爽快的客户，会立马选择购买，但是，绝大多数客户其实没那么爽快的，毕竟你的产品价格不便宜，他也才加你好友不久，你们建立的信任感，还没有那么强，想要让对方当下立马做出决策没那么容易


    接下来，有个很关键的步骤来了，就是回访，可以这么说，电话成交的客户，有 70% 左右，其实是通过回访成交的'
