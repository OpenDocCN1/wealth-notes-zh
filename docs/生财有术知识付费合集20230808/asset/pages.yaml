- pgno: 199
  md: '1）买家年龄段中学生居多，白嫖多，相对其他品退款率偏高。


    2）同行倒卖：同行店铺游戏账号不够用拿不到货，直接倒卖我们的账号，而且没有底线，一个号给很多客户使用，一旦账号出风控，使用这个账号的所有人都无法使用。


    3）后端交付重：因为国内没上架，使用美区苹果ID，导致产品账号不稳定甚至失效，客户使用繁琐。


    基于这些缺点，店铺体验分容易掉，特别是新版ccr。但我们也是要努力维持店铺评分的，最好维护在4.8以上，低于4.6投流受限，低于4.0精选关闭。


    另外这个品的售后处理难度对比我们其他品是更难的，因为客服大多是小姐姐，不容易理解手机跟电脑的设置，所以最好有个技术宅之类的组长，负责解答各种疑难杂症，维护好售后。


    已经过新手期是最好的，新手期不限制单量，新手期内的店铺单日单量限制1000单，回款周期：新手期T+10，过了新手期T+4。


    如何维护好店铺体验分？找到对标达人，深度沟通，佣金到位，基本问题都不大。


    拉店铺体验分，一般是找第三方代办，上架福利产品去拉分，价格3.5-10元不等，看资源对接。


