  md: '# ⑤产品如何交付


    阿奇索或者极速发货把卡密设置好卡密，自动发货。不清楚的，可以看官方教程。


    成交的客户，飞鸽也同步发货，使用方法跟注意事项也是需要发送的。


    # 5. 产品运营


    产品后端交付搭建完成后，接下来就是运营出单。


    # ①自然流打法


    上架后3天内做十几单评价，精心晒好图，当时我们直接就有自然成交了，而且是滚雪球增长，节假日流量和成交比较高。但是这个自然流量相对其他流量来讲太少了，没太多意思，这里不建议花时间在上面。


    # ②达人流打法


    首先要寻找对标店铺的出单达人。


    所谓知己知彼方能百战不殆，去淘宝/拼多多买个飞瓜，直接搜索商品名称或者对标店铺可以看到具体产品情况了。然后找到该产品出单多的带货主播，点进去达人主页可以有二维码直接跳转抖音首页，做好表格登记，然后联系，开挖。'
  merge: -1
  img_proc: true
