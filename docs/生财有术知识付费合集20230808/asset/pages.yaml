  md: '品质退货绝对是抖店圈内最头疼的一个事情，一堆人吐槽，虚拟也是一样的，只能是从客服端引导好消费者进行售后处理。


    做虚拟类目心态要好，对比实物的30-50%的退款率，我们虚拟还是比较容易接受的，基本是5%-15%，售后相对简单，对于比较频繁发生的问题，直接做个视频教程或者图片教程就能降低很多售后问题。


    对于疑难杂症的，能退就退，没必要浪费时间纠缠，你今天没给他退款，明天还是会找其他问题烦你。


    # 4. 抖店平台政策层面


    尽量不要去对抗平台，基本虚拟类目最大的变数就是平台政策打压。


