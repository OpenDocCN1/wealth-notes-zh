  md: '这怎么理解呢？其实B站的最特别功能就是弹幕和三连。弹幕是一群人在异步的时空里面进行交流，UP主的视频内容重要吗？重要，但是最重要的是提供了一个虚拟的抓手，让大家可以在上面玩梗和分享，这就是B站的特殊地方。


    ![](img/00c8ed3105ac934755346b58149acc95_863_0.png)


