  md: '![](img/00c8ed3105ac934755346b58149acc95_925_0.png)


    所以呢，在选择项目的时候，不要过于纠结，也不用想的太多太杂，也不用过多考虑是否是蓝海红海，想得再多，没有行动，那也是0，尽快行动起来，边行动边思考。


    # 四、新人如何做知识付费


    知识付费是一个长久可做的赛道，如果选择正确，沉淀越久越吃香，收入也越高。知识付费通常有两种玩法，一种是分销别人的知识产品，另一种是自己生产知识产品。


    第一种 方式优点是不用花时间生产产品，只需要分销别人的产品就行了，缺点是销售权、定价权、产品所有权都在对方，分销者很被动，获得的收益也有限。


    第二种 方式就是先通过学习、掌握并进行运用、验证、整理，总结出一定的经验，再传授给更多用户，虽然制作产品的时间比较长，但是适合长期做，自己可以掌握销售权和定价权，将收益最大化。


    我做的就是第二种变现方式。'
  merge: -1
  img_proc: true
- pgno: 926
  md: '![](img/00c8ed3105ac934755346b58149acc95_926_0.png)


    # ## 1.知识付费门槛


    知识付费的门槛**并不是很高**，只要做好**向下兼容**就好了，如果不知道能做什么项目，我推荐从自己的经历出发，因为自己的经历才是我们熟悉、擅长的领域，比如：


    1. 所学专业。专业一般是自己学习时间比较长的，这些是我们已有的技能，拿计算机专业来说：


    +   1. 如果擅长各种编程，可以教：编程的技巧、编程的理念、怎么制作小程序、怎么制作小工具等等。'
  merge: -1
  img_proc: true
- pgno: 927
  md: '+   1. 如果擅长各种视频制作软件，像剪映操作、PR操作，可以教：怎么制作短视频，怎么让视频更吸引人等等。


    +   1. 如果擅长各种办公软件，像EXCEL、PPT，可以教：EXCEL和PPT的常用技巧、快捷方式等等。


    +   1. 如果考了某个证书，比如计算机软考，不要光考完就拉到了，可以看着别人的教程，翻译一些考证的视频，讲解考证的知识点。


    ②从事行业。自己长时间从事的行业也有很多知识可以传输，比如我从事的是机关工作，不做面试培训，我还可以做公文写作、笔试、面试、职场经验等等领域。


    其他领域也是类似的，先专注一个领域，高认知打中认知，中认知打低认知，低认知打零认知，其实也是知识付费的市场下沉，只要你有优质内容输出，总会有需求的人来买单。


    # # 2.要喜欢传输知识


    知识付费需要个人有喜欢传输知识的欲望，起码不反感讲课。有的人天生是不能静下心来讲课的，如果硬要从事知识付费行业，就会感觉很累，浑身不舒服，每个人的天赋是不同的，有的人天生适合做销售，有的人天生适合做科研，有的人天生适合讲课。


    根据自己擅长的方向去努力，才会有做知识付费的动力。找到自己可以传输知识的领域，深耕下去，时间长了必定有收获。'
  merge: -1
  img_proc: true
- pgno: 928
  md: '# # 3.知识付费难点


    # （1）自己做和教别人是两码事


    就拿考试来说，让考进清北的人去中小学讲课，也不一定比普通老师讲的好多少。


    所以，「自己能考好」和「教的学生考得好」是两种技能，前者靠「自己学习的天赋和努力」，后者靠「给别人传输知识的水平」。很多人自己做一件事能做好，但是并不能讲的很清楚。


    我一开始讲面试的时候，就是无偿和进入面试的考生陪练，有时候自己心里知道是什么意思，但是表达的不是很清楚，或者自己讲的内容对方吸收的比较慢，我就花了一些时间来提升我讲课的能力，思考怎么把知识点讲明白、讲通透。


    讲课能力呢，说难也不算太难，讲得多了，自然就有经验了。


    # （2）难以做出差异性


    目前我们常见到的知识付费课程，大多数是以快速入门、快速见效为噱头，吸引用户为之买单。但是细看之后就会发现，课程内容与市面上课程雷同较多，内容质量也是令人堪忧，没有太多值得的干货。


    929/1029'
  merge: -1
  img_proc: true
- pgno: 929
  md: '所以，用户重视的不是知识的数量多少，而是知识的含金量，特别是**稀缺的、优质的、有价值的**的知识。


    所以，做知识付费要想打造壁垒，做出差异性，就更要专注这个领域，时间长了，对这个行业和认识会更深，小白也会逐渐成为这个领域的专家。


    ![](img/00c8ed3105ac934755346b58149acc95_929_0.png)


    # （3）复购率较低


    知识付费很多时候是一次性交易，不像食品之类的消耗品可以多次复购，知识付费一般用户购买一次后就告一段落了，想做二次或者多次转化，往往是比较难的，所以需要不断引流新的学员。


    # （4）需要持续推广'
  merge: -1
  img_proc: true
- pgno: 930
  md: '很多人做课程就只是埋头把课程做好，但是做出来发现，根本没人去买，就是引流的方式方法有欠缺。只有用户知道你的产品好，才会有你这里消费，不管是知识付费还是其他行业，都是需要持续去引流的：


    +   ① 付费引流： 一般机构、团队运用这种比较多，就是打广告，买流量，1元或者9.9元低价课来吸引用户进入私域，从而转化高价课，这种适合一定规模的团队，个人初期并不适合。


    +   ②内容引流： 通过持续输出有质量的文章、视频，让用户了解你能提供的价值，从而在有需求的时候第一时间能想到你。我的引流更多属于这种，我在引流方面，从来没有花过1分钱，都是通过自然流量来吸引用户。


    其实，做任何赛道都没有那么简单，都需要对这个赛道认知上的积累，了解越深入，就会有越多变现和引流的方向。


    # ## 五、10个知识付费经验


    生财有很多小红书和知识付费经验，圈友分享比较多的，我就不重复分享了，我说下我认为比较重要的内容吧。'
