  md: '用白话说就是，你觉得自己要讲的东西，根本不值钱。你在准备素材、制作课程、研究市场的过程中，越来越发现，一大群人讲得比你好，而且人家甚至是免费的。谁脑袋进水了，会花钱买你的网课啊？


    这个病其实好多人都 有，不只是做网课的人，任何一个人，在做任何一个产品的时候，都有可能产生这种担忧。


    这种担忧有时并非无的放矢，所以你出现这个症状要仔细分析一下，看自己心虚在哪儿。


    我一开始想做一个培养孩子财商的课。我也给大女儿根据她的特长喜好，设计了两个项目，她也很兴奋。


    我确信这个话题有市场。因为首先去年初我曾经做过50天的视频日更，到各个平台上讲生财日历的案例，配合的主题是教会女儿赚钱，让她在20岁前赚100万。


    完全冷启动，在西瓜视频上曾经每天都给几万的流量，很快有了几百个关注者，还有好多人给我私信请教问题。


    另外我老婆还在抖音上买过好几本给孩子提升财商的书，说得天花乱坠的，实际上奇烂无比，但至少证明当爸妈的认可在这上面花钱。


    但我女儿的项目三分钟没到就放弃了。我凭借在生财上看到的案例，加上自己学习和研究的东西，倒是录了一些素材。但讲着讲着，自己就觉得也没太说服力了。


    我自己女儿都没培养出来，难道我要做卖书那种骗子吗？


    我现在想，那时候心虚是对的。


    对于我们这种价值观端正的人来说，真不是什么钱都能赚的。


    我在udemy上看过一个中国人专门拼讲凑课，从tiktok一直讲到nft，开了好几十门课，什么热门讲什么。差评无数，但也卖了十几万份。真地替中国人丢脸，这种事我们做，肯定心虚。


    那选什么题材才能不心虚呢？


    这方面对我影响最大的是一个叫Sunny Lenarduzzi的加拿大美女人，一个不仅漂亮，而且特别实诚的人。她的油管频道很值得一看。


    她的选题哲学是，不用想市场，只要选你自己亲身经历过的巨大转变，叫zero to hero。'
