    好，接下来正文开始，我会纳级复盘，我一个自媒体小白，如何从0到1在小红书起号8000粉并且变现5万的（全文约5500字，阅读需要8分钟）


    # 一、背景


    其实说我是自媒体小白，这个不完全对，只能说我小红书上是完全完全的小白，在这次做小红书之前，我甚至都没有刷过它。基本上我算是有5年的自媒体经验。以下为比较简单的个人介绍。'
