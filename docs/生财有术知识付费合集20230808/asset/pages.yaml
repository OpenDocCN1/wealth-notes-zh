  md: '你在成长中接触的牛人，或是受过对方恩惠的，在你出成绩及时和对方汇报下，类似里程碑见证人的意思。像这样时不时把亮点 show 给大佬，让大佬记住你（对方不回复也没关系，重在积累成绩）。


    学写作的人多，写作变现的人也多，一边文字变现一边做出影响力的人不多，在早期有意识的做好初步人脉积累和随意做是不一样的结果。


    # 四、毛遂自荐，让投稿变现雪球滚动起来


    毛遂自荐，或通过朋友链接牛人，特别是新手，一定要主动出击，闭门造车写作是最使不得的，有时变现机会，能力提升机会就在这里，所以我主动接近有助于达成我的目标的人。


    先和新编辑建立联系，再拿题写稿变现。


    +   1. 投稿邮箱自荐，怎么介绍自己？


