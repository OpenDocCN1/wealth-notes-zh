    # #(精华帖) (108赞) 如何优化「督学陪伴」促进「学员成功」？


    作者： 杨昌


    日期： 2022-01-26


    上周五“北京龙珠年夜饭”聚会上，遇到了两位在「抖音商业IP大航海」大放异彩的龙珠圈友。


    「首批出爆款、首批获扶持、变现10w+」的大黑哥，和群界隔三差五会分享他做号建议的亮亮教练。


    临走前，大黑哥开玩笑道，这次带的是哪个队，到时候我们选你们队啊。


