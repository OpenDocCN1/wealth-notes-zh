  md: '如果还是担心没有内容写，可以考虑用一些数据工具，比如极客增长，5118之类的，搜和你产品有关的关键词，搜索量大的选题，就是可以写的。我最野的时候，曾试过写两版文案，问用户哪个会更心动，或者让人帮我想怎么提高转化率，都是在朋友圈讨论的。聊着聊着有人甚至会帮我去转介绍。


    我想说的真实也在这，做宣传可以用一些技巧，但不要藏着掖着，有时候真实一点用户反而接受。就像那种：我现在要参加一个7天万元销售挑战赛，在朋友圈卖xxx，希望大家多给我建议反馈的活动不止不让人烦，有时候还能得到支持。这就说明卖东西本身不是槽点，让人讨厌的语言才是。


    真实的案例：


    案例是朋友圈里不可缺少的，我大概每周都能产出案例，和大家分享一下我的做法。一般我做咨询会顺手截图存在flomo里，会在问卷里单独设置一个模块问用户，假如我分享他们案例到朋友圈，他们介意不？（目前大多选的不介意，毕竟是帮他们发现优势，也说不出啥不好听的话哈哈）


    那么，任何一个case或聊天记录都能总结出内容，例如：


    ![](img/00c8ed3105ac934755346b58149acc95_399_0.png)


    我记录了不少人在找到自己擅长路上的故事，其中有一类人很特别，特别在哪呢？他们连“想找自己的优势而非不停补短板”都要花很大的勇气。甚至可能从没想过我是不是最擅长的事？


    这对有些人来说是不可理解的，为什么老盯着自己的短板内耗而不是做自己擅长的事呢？


    可能是从小在挫折教育里长大，可能是“补短”的习惯在某个时刻也是一个优势来源。'
