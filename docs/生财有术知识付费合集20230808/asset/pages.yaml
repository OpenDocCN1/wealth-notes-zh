    # 2.被培训同行竞争了怎么办？


    +   ①一个行业有同行和竞争，这是好事情。


    尤其在中国，如果你发现你的生意没有同行，那么你就要重新思考一下这个生意能不能跑 得通。如果跑得通，为什么没有其他人做呢？


    就像你在一个外地城市投资，要先调查一下外地人同行在这边投资情况怎么样，外地人过 得怎么样。像北方的一些城市，外地人100%被赶走，走的时候都是哭的。投资不过山海
    关。


    所以如果有同行跟你竞争，跟你卷怎么办？很简单，不要怕，你卷死他们就行了。卷不死 他们，那么你就被卷死，市场总是动态平衡的。


    只有竞争，才能不断迭代和前进，最后成为最强大的自己，达到新的高度。


    +   ②不要诋毁和评价同行。'
