  md: '③手机、电脑等多种形式。


    电脑录屏我用的是班迪，手机投屏用微软投屏，这些便宜的会员都可以在拼夕夕上找到。在录制课程前要调试好声音和流畅度，争取一遍过。投屏的效果图如下：


