- pgno: 981
  md: '用户的疑问点可能也就 10 个、20 个，通过沟通，了解用户需求和可接受产品的价格区间，然后给用户打标签，后续维护起来，就能更好地切中用户痛点。


    高客单的产品一定是需要时间来养的，不可能加了马上成单，所以说转化路径的设计是很重要的。


    # ②意向人群的锁定


    我引了1万3的用户，成单大概是80多个，剩下的12920可能都不是我的意向用户。但是我能保证这13000都是我这个业务的，就是考研的学生，但不能保证这些都是一些能消费的起我的产品的学生。


    所以说用户分层很重要，能够极大的节省时间，针对不同层级的用户去推荐不同层级的产品。


    # ③做好长期维护和服务的准备


    我觉得 5000 以上就算是高客单价，一定要沉下心来做长期维护。像我这边1万以上的产品，成单时间最短转化周期都是一个月，一般是 1-3 个月。


    # ④人设


    人设就等于信任，你的朋友圈，你的头像，你的签名，还有你的社群维护，这些细节是很重要的。


    我建议大家坚持发 5 条朋友圈，时间要定好，分类要定好。朋友圈配图一定要考究一些，一张好的宣传图，是用户没有点开放大时，就清晰的知道大概有哪些东西，然后被吸引进来。


    其实跟咱们小红书封面设计是一个道理，你打开小红书，信息流一个页面是 4 篇笔记，你怎么做到在这四篇笔记里，让用户点到你的笔记里，而不是其他人的笔记。


    要把这个思考点也用到你的朋友圈里，因为朋友圈也是一个信息流。


    # 二、再聊管理，承上启下


    接下来是团队管理这块，它其实是一个承上启下的动作。我觉得我们在座的每个人，多多少少会涉及到管理方面，因为不管在公司上班还是自己创业，你不可能一直是一个人。


    +   - 关于团队管理，也是先问大家几个问题，然后我们再来聊团队管理sop。

    - 你觉得管理最重要的工作是什么，人or事？

    - 从月度、周度、日度来看，管理sop如何制定？

    - 工作流、业务流、绩效、培训是否都定好？

    - 1、会不会做'
  merge: -1
  img_proc: true
- pgno: 982
  md: '# ①工作流


    从早上9点上班到晚上6点下班，具体的工作安排。工作安排最好以半个小时为单位去规划，上图是我们公司内部的一些工作流。


    因为我们的引流路径已经跑通了，所以没必要按照半小时去卡点，但是新业务或新创建的团队，最好以半小时为单位去规划。


    # ②业务流：


    相当于咱们星球以及实战营的课程，教给大家平台规则、发文要求、爆文技巧，以及引流方法这些硬核技能知识。


    我每周都会带着部门20多个人去听课，听完课我要求每个人都输出手写的笔记和思考，这里就涉及到了培训。


    # ③培训


    培训又分为四块：


    +   1 部门内部的业务能力培训，比如我让他们听课，听完课后运用到日常工作，提高工作效能。


    +   2 外部的跨部门协作培训，比如职场上你怎么沟通，怎么说话。


    +   3 公司层面的培训，你要对这个企业有一定的认同感，而不是说是和公司对立的。


    +   4 职场技能层面的培训，比如职业礼仪、职业素养等。


    这样从各个方向把员工的素质打造起来，他就不是一个单纯的引流工具人。我们做矩阵账号，不管用的兼职还是全职，它都是一个可复制的岗位。但我还是希望成员能在工作中找到一些意义，学到一些东西，而不只是简单的工具人，在这个过程中他能知道自己的不足，也知道了该往哪个方向去弥补自己的缺陷。


    # ④学习氛围


    运营岗位一定要不断输入，比如说我们加入无敌的星球，是因为对知识有一定的渴望，这种品质我们要去影响给团队其他成员。这里要注意一点，就是培训之后一定要有考核或者审查。


    记住一句话：员工只会做你检查的事，不会做你安排的事。


    就跟学生做作业一样，你不规定明天要交，他今天肯定不做，但你说明天要交，而且还有打分制，达不到几十分，就会怎么样？他就会更上心。


    培训也一样，一定要让员工自己去思考如何优化手上的工作，不能为了培训而培训。


    # 2、如何自主做'
  merge: -1
