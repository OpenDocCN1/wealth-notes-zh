- pgno: 461
  md: '当时我的学习重心是视频号直播，在勃勃悬悬地直播了31天后，我获得了很多流量，可是发现知识付费课程的复利性不好，而要产生复利，最好的方式，就是让用户可以重复的购买。


    就这样，我把群买买当作是我初探社交电商的一次学习，从微商模式，到淘客的变现逻辑，还有社交电商平台的制度和佣金体系。


    ![](img/00c8ed3105ac934755346b58149acc95_461_0.png)


    跨行业的学习，短短几天的学习，又进一步打开了我的思维。就这样，**2021年8月2号**我正式入局群买买，把它作为**8月**重要的一个副业项目去做。


    **我想如果我可以0成本投入1个月赚1000元，这个项目可能也适合别的宝妈。** 没有想到我一个月内竟然可以赚到**3000元**。到目前为止，我就拥有近**3000位**宝妈店主团队。'
