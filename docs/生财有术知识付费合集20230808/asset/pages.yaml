  md: '2021年1月，我报名了9个线上课程，建立了妈妈增值的微信社群，通过输出的方式倒逼自己输入知识，而这也是我的线上副业的正式启航，同时现在回头看，也是正确的一步，就是学习。


    普通人比大咖有的优势是什么？比专业，比资源，比能力，比技术，比经验，我们真的都不行。


    那能弯道超车的优势是什么，我觉得就是时间。


    用更多的时间去学习，提升自己的技能，尝试大咖或是厉害的人没有时间赚的小钱，夹缝里总会有些闪闪星光。


