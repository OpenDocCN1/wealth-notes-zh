  md: '![](img/00c8ed3105ac934755346b58149acc95_369_0.png)


    我进入的第一个写作圈资源群，是一位编辑介绍给我的老编辑拉我进入的，她所在的圈子只和成熟作者，编辑，自媒体大v等接触，由于这个信息断层，所以普通菜鸟不知道，也难联系她。


    进入圈子一周，我便主动链接到牛人作家李月亮，这家情感号知名度高，过稿难度也高，我投了两篇，第一篇因为热点事件发展不明朗，发文时机不合适所以没过。第二篇写的古天乐过成功过稿，稿费1000+（[https://mp.weixin.qq.com/s/iYzX5fGPfjc2lYVqAu1IzVw](https://mp.weixin.qq.com/s/iYzX5fGPfjc2lYVqAu1IzVw)
    ）。这篇爆文首发李月亮，被十点读书转截（ [https://mp.weixin.qq.com/s/rvrEEfY2AB4y8jIFS WuEu6g](https://mp.weixin.qq.com/s/rvrEEfY2AB4y8jIFS
    WuEu6g) 百万阅读，点赞1万）和多家百万级号转载，全网阅读累计近千万，也因此成为我的大背书。


    自从链接李月亮老师后，经过她不时的指导和交流，我的写作也在进步。


    做文字赚钱多了解圈子，加入这类写作圈变现资源群可以让你大跨步走：链接账号平台的高层，得到更好的变现扶持;和平台牛人贴身学习，精进写作。


    **3）其他行业的群：** 资源较多，链接力中高等。通过加入多个高质量社群展现自己，链接他人，一边为社群贡献价值，一边做影响力，把自己当做一个品牌来运营，既是增加变现机会，也是链接不同圈层的资源，找到合适的合伙人共赢。


    怎么做：根据不同行业群的定位和不同需求，做不同的分享主题：例如在生财商业社群谈"如何通过写作增加圈子影响力"，在写作圈就要谈"如何写出十万加，变现经历"。用信任和价值做个人
    ip 。'
