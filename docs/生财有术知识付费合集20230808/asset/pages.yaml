  img_proc: true
- pgno: 811
  md: '大鹰自从大学本科毕业以来，就一直从事软件开发工作，也就是程序员。我有写技术博客的习惯，会把工作中遇到的问题或者学到的新知识技进行总结记录。


    经常有小伙伴在博客留言问一些非常基础的操作问题，比如 XX 功能的入口在什么位置，XX 的设置在哪？还有小伙伴问：博主有没有视频教程？


    刚开始我并没有当回事儿，不觉得这是一个机会风口。后来我开始发现图文表达的方式有局限，因为当时自己的写作能力也有限，经常会出现文章内容表述不够精准的情况。而且，自己在学习技能的时候也更倾向于看视频教程，我这才渐渐意识到：视频教程有得天独厚的优势。


    图文是有选择地表达，总会有遗漏的地方，而视频能记录下所有的操作，其他同学在学习的时候可以根据看到的步骤进行操作、模仿学习，减少学习中遇到的问题。


    2018 年初，我尝试录了一个简短的视频教程，定价 38 元。这个视频上架到腾讯课堂（抽成 10%）之后，反响还不错，前几个月每月都能有一千多块的收入。


    当时我心想这门生意不错，如果我能录 100 门视频教程，那相当于每个月就能有 10W 收入。当然，这是异想天开，具体原因后面再说。


    我从 2018 年初到 2021 年底，总计制作课程 50+ 门，目前还在售卖的课程有 20 门。在全网多平台自然流量下，月收入稳定在 5W+。


    **Q：对讲师有什么硬性要求吗？**'
