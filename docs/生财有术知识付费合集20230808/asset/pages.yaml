- pgno: 575
  md: '谁能低成本解决流量问题，谁就几乎可以做好任何生意。


    2020年，我花了四个月时间，把微博从4万粉丝写到了84万粉丝，这是纯粹的内容粉，没花一分钱。


    最近半年我也测试了一些付费流量，作为内容的加速器。


    我现在是微博教育十大博主，100多万粉丝。这些流量，几乎可以支持我做任何项目了。


    # 【第三章】生财使用手册


    创业的逻辑有二：


    +   1、先研发产品，然后找流量，去销售。


    +   2、先做好流量，然后去找合适的产品。


    这两种逻辑都对，我做不同的项目，也用过不同的逻辑。


    但我现在以为，第二种显然更安全，更容易成功，也更容易做大。


    我已经有了流量，就去做几个培训产品，包括微博爆款写作课、吸金文案课之类，卖得都还不错，口碑也很好。2020年还做了个创读会社群，一两千块钱年费，收了一千多人。


    所以我来生财的目的很明确，就是寻找更好的产品，确切地说，是知识付费项目。


    我的生财使用手册是：开眼界，找项目，学方法；不赚流量。


    我在生财里研究了大量项目，最终决定，最后确定做抖音短视频带货培训。后来又升级为“短视频带货训练营”（抖音内参是短视频带货的资料库，这两个是一回事），抖音、快手、视频号一网打尽。


    # 【第四章】年赚百万的超级个体


    知识付费领域，大部分人都在做写作、读书、时间管理、自媒体之类的培训，我也做过，但始终兴趣不大。


    我更感兴趣的是创业、副业、赚钱，是“超级个体”。


    所谓超级个体，就是一个人可以抵得上一家运营良好的公司，一个人也可以年赚百万。


    以我个人经验，超级个体收入上限是300万，再想做大就必须有团队加持——当然团队也可以做到极致的小。


    超级个体有两个方向：


    +   1、知识付费。


    你擅长做内容，有个人品牌，会教人，就可以做知识付费。'
