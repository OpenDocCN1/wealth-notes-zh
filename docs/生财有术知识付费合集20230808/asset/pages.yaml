  md: '# 三、收入水平


    这可能是很多人会关心的问题。但这个问题的参考价值真心不大，因为自媒体的收益水平真的是千差万别，而且并不和流量完全正相关。


    就我个人来说，最初几年是几乎没有收益的。后来在顶峰的时候可以做到年入百万。但这个百万其实是营收，其中还要算上课程研发和运营的成本。并且后来也没能持续。


    如果把 2013~2022 看做一个整个项目周期的话，整体收入大约是两百万。但从 2023 年往后看，我觉得我短期可能还恢复不到这个收入水平。


    单从绝对值来看的话，这也差不多相当于一个打工人的薪资了。但如果我老老实实去大厂做程序员，显然是可以更高的。不过以我的性格，不喜欢领导别人也不喜欢被人领导。做自媒体最起码给了我这样一个机会，至于是不是能比找个厂上班赚更多，我只能说看缘分了。


    # 四、我做对了哪些


    能靠一个自媒体账号做到不上班，我觉得这中间还是做了一些正确的事情。


    +   1. 踩上了公众号和知乎的风口，包括知识付费的风口。这有很大的运气成分，但运气偏爱有准备的人，如果当时没有积极去尝试，风口也只会从面前吹过而已。'
  merge: -1
  img_proc: true
- pgno: 137
  md: '2. **持续输出**。虽说是风口，也还是等了好几年才算是起飞。这期间不管频率高低，始终也还是在更新输出，这点也是后来能随风口吃到红利的重要保证。另外，出爆款内容其实是一个概率事件，你只有不停更不停更，基数够大，才更有机会出爆款。说实话，我的公众号运营算不上激进，内容也不是多独特，主要还是靠写得久。


    3. **冷启动寻求外部助力**。很多人尝试自媒体，都停在了最初的冷启动阶段，因为每次辛辛苦苦写完文章发出去，只有个位数的阅读，这样想继续坚持是很难的。前面说到，早期的大V推荐，还有虎扑上的引流，让我很快就跳过了这个阶段，我基本算是直接从500粉丝起步的，这样创作体验就好多了。


    4. **从用户的角度思考创作内容**。写公众号也好，做视频也好，是要给别人看的，跟我们自己平常发个朋友圈不一样。我会比较注意不同内容的数据情况，以及做一些问卷，调整内容方向。最终我是把内容定位在偏初级、短篇幅，要么得有趣、要么得实用这个方向之上。


    5. **专业内容结合热点**。现在“蹭热点”几乎是自媒体的基本功，但在早年其实并没有太多人意识到这个概念，至少我一开始是不知道的。但在运营的过程中，我自己也慢慢摸索到了这个门道，做出了几篇还不错的内容。


    6. **完整的变现闭环**。我因为自带开发能力，所以在最开始就自己搭了教程网站，后来在其上做了付费课程和学员系统。所以从内容中的钩子导流，到公众号里的文章转换，再到后续的课程服务，整个过程我是可以自己掌握的。即使在大环境不好的情况下，一样可以有靠谱的变现途径。


    # ## 五、我做错了哪些'
  merge: -1
  img_proc: true
- pgno: 138
  md: '讲了做对的事情，再来谈谈做错的或者说错过的事情。当然，所谓做错也是一种假设，也并非那样做了就一定会更好。


    **1. 流量(内容)、变现(服务)都想做。** 前面做对的事里面提到完整的闭环，但反过来看，这个闭环也在一定程度上阻碍了我的增长。个人做自媒体精力有限，什么都想自己来，相当于牺牲了一定的增速来换取稳健。如果把这部分时间省下来都投入在内容创作上，可能性价比会更高，说不定可以再上一个流量台阶。


    **2. 过早谋求团队化。** 团队化运作不是不行，只是对于我的情况来说不适合。同上一点一样，在这方面牵扯了大量的精力，最后效果却不及预期。也许是缺一个互补的合伙人吧。


    **3. 没有尽早转型视频。** 很早意识到视频对于图文的替代，但却没有像当初积极尝试公众号、知乎时候那样去积极转型视频。不过必须承认，视频的门槛确实是要大于图文的，尤其对于我们这种习惯文字写作的人来说，面对镜头是非常需要勇气克服的一件事。


    # 六、对新人入局的建议


    前面都是在啰嗦个人经历，如果听建议直接看这里就好。但因为我的建议都是基于自己的经验，所以看了上面那部分你会理解我为什么这样建议。


    我先帮各位理一下我认为做自媒体的 一些选择：'
  merge: -1
  img_proc: true
- pgno: 139
  md: '![](img/00c8ed3105ac934755346b58149acc95_139_0.png)


    一部分建议是围绕上面这些选择的。


    +   1. 首先想清楚为什么要做自媒体，大方向的不同决定了你策略上的不同。做自媒体是一件门槛很低，同时天花板又很高的事情。听上去不错，但另一方面，通往天花板的路非常拥挤，且越来越挤。


    如果你是本职工作干得不爽，想裸辞全职做自媒体赚大钱，那我要说你盆冷水。目前来说，好做的时间窗口已经过去了，如果你不是有过人天分，是很难出头的。'
  merge: -1
  img_proc: true
- pgno: 140
  md: '但如果你是想开拓副业，多一种尝试，那我是强烈推荐的。我这两年就间接帮助了一位朋友成功转型自媒体。但请记住：不要辞职！不要辞职！不要辞职！想做就先做起来再说，立刻就做，今天就去做。如果你说不辞职就没时间做，那相信我，你辞职了很可能也更不了几期。等你做到稳定更新之后，再考虑是不是要全职做。


    就算不能做成一个能赚钱的副业，只是通过自媒体来输出个人的专业知识和独家观点，对于你的职业发展也是很有帮助的，往往会给你带来意想不到的机会。


    另外一种很适合做自媒体的情况就是，有现成的生意，通过自媒体来宣传和获客。在当下这个阶段，我觉得做纯网红大V是很难了，但是把自媒体作为一个专业性展示渠道是很有机会的。现在很多平台的流量机制也在往这方面倾斜。举个例子，你开了家饭店，然后你再做个体自媒体，你想纯靠自媒体养家可能不容易，但认真做点美食相关内容，把你店的销量翻一倍并不是难事。如果你的业务可以线上进行，比如培训、咨询、卖保险之类，那效果就更好了。


    当然不排除有人做自媒体是出于兴趣，为爱发电，那这个也就不需要我给建议了，做得开心就行。


    2. 发布视频肯定是几个平台都同步更新，但风格上需要有所侧重。新手建议优先从 B 站、抖音、小红书 中选择最适合自己风格的。这几个平台都会有用户推荐机制，即使冷启动，坚持更新一段时间，通常都会得到反馈。并且这几个平台是有IP这种概念的，你做得好，别人会关注你，追更，慢慢积累粉丝，良性循环。


    头条这种重内容轻IP的平台，适合批量做营销号。公众号我把它归到“私域”，这个说法不严谨，但我是想表达，它是没有公共推荐流量的。不过目前似乎公众号机制有些改变，也开始重推荐了。但毕竟图文是过去式了，除非你文字功底真的很强，或者实在无法做视频，才考虑公众号。现在的公众号，因为平台规则相对宽松，更是作为最终变现的渠道。'
  merge: -1
  img_proc: true
- pgno: 141
  md: '3. **你的内容要和你的大方向、你的变现模式相一致。** 如果你是拍搞笑短剧，虽然受众广，可以流量做得大，但多半只能靠内容激励或者直播带货变现。如果你做业内内容，比如像我一样的编程教学，那注定流量不会很大，但来的都是垂直细分用户，给他们提供需要的服务，可以做到更高的客单价。


    还有就是前面说到的，你有自己的生意，那就容易多了，只要吸引到潜在客户就OK了，他们会主动联系你的。


    如果你想在抖音卖课，但天天跟风拍一些搞笑段子，那即使出了爆款也没有价值。做垂直内容的不用羡慕别人的爆款，他的十万播放可能只带来几十块钱收入，你的十个播放说不定就给你带来一个高价值的客户。


    4. 前面也说了，做内容是要从观众角度来选择内容。但我还是要反过来说下，如果自己都不喜欢自己做的内容，也是很难做下去的，至少你得讨讨厌吧。所以**一个理想的方向，是用户需求（可能是爱看也可能是实用）、自己擅长、自己喜欢这三者的综合。**
    如果不能兼顾，至少取一个可接受的平衡。


    5. 最后，在做自媒体的心态上，尤其是新手的心态，要做到：**先做起来再说，然后坚持、不要脸、坚持不要脸。**


    做自媒体不需要什么准备，你今天想做就可以立刻去做。如果你不放心，就先拿个小号去做，边做边想边调整。如果你觉得我要怎样怎样之后再开始，那么你的想法有问题，要么你就是在给自己找借口拖延。很多事情，预先设想的和实际情况会有很大不同，不亲自动手做一做你不会切身体会到其中的细节。有人会完美主义，觉得我这个视频做得不够好，我不想发，我得继续改，甚至重新拍、换选题。对此我送一句话：**永远在下一条视频里改进。**
    一条视频，做好了就发，发出去就是最大的成功。'
  merge: -1
  img_proc: true
- pgno: 142
  md: '坚持不必多说，大家都懂。但很多人会在潜意识上忽略坚持的作用，更多的归因到能力、环境、运气等上面。但在自媒体这条路上，坚持是第一位的，是其他各种因素的先决条件。如果你没有做够一定的量，其他的方法论都没有展现的机会。而另一方面又会低估坚持的难度。殊不知在初期缺少正向反馈的阶段，放弃实在是太容易了，可能今天加个班，明天朋友喊你吃个饭，你就彻底断更了。


    我之前跟一位想要尝试自媒体的朋友说你得不要脸的时候，她不出意料地想歪了。确实现在网上有大量“不要脸”的内容，但我不是说要做那种，而是即便你正常地去写文章表达观点，拍视频做节目效果，都难免会面临镜头恐惧，感到尴尬。这种尴尬再配上上寥寥无几的播放数据，对新手的打击几乎是毁灭性的。这时候你就得硬着头皮上，别管那么多，继续更。


    我们过去接受的教育给我们一种凡事只有一-次机会的错觉，觉得一旦出错了就可能带来很大的问题。但在自媒体上，我觉得不存在，至少对于新手不存在。只要你别做什么违法违纪的内容，尽管放手去试吧，不停地更新，你会在更新中不断找到感觉，而不是在纸面的学习和思考中。


