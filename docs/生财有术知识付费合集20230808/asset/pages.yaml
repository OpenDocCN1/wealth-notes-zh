  md: '# 《如何写出既能吸金、又能深入人心的心金文案》


    大家好，我是李思念，是一名9年的创业老玩家。


    我身上被人广为记忆的个人IP标签中，首当其冲的应该就是我的文案力。朋友圈坚持更新，累计输出百万字，写的文案在微商圈/创业圈疯狂传播，在小红书上也通过文案吸粉无数，变现超过7位数。


    我有时会觉得，文案，它真的是一个逆天改命的武器。


    当你开始亲自原创文案时，你会发现，自己学会了在字里行间思考，自己慢慢拥有了核心思想，这种思想，通过文案的传播，吸引、影响、感染了更多同频的人。


    而这种影响力，也反之加持了你的个人IP，会直接作用于你的事业成绩。


    写作多时，去年我给我的文案风格，终于敲定了一个名字，叫做「心金文案」，寓意是既能吸金、又能深入人心的文案。


    文案不同于文章，文案本身就带有一层商业变现属性，所以能够吸金才是关键，而文案又需要蕴藏感情、给人能带来触动，所以深入人心的写法，也是必要。


    那么接下来就来分享下，我是如何写出既能吸金、又能深入人心的心金文案的。


    全篇将分为以下四部分：


    +   一、写文案前的3重思考


    +   二、文案写的道与术


    +   三、写作方法论


    +   四、如何培养文案持续输出能力


