- pgno: 473
  md: '你觉得，如果我卖的只是几十块钱，或者几百块钱的课程，我有可能做到第一个月就变现 10 万吗？对于当初我这样的自媒体小小白来说，几乎不可能，对吧？


    所以这也是我想要和你分享的第一个变现的关键要素：首先你得有高利润产品


    +   请不要只卖低利润产品


    请不要只卖低利润产品


    请不要只卖低利润产品


    这句重要的话我要重复三遍！


    甚至，用户量越少，你就越应该卖高利润产品！如果你用户量很少，你还在那边只卖低利润的产品，那你几乎不可能赚到大钱！


    我那时候给自己设计了 3 款付费产品：


    +   1 V 1 咨询 500 元


    28 天训练营 1980 元


    全年私教 9800 元


    可以看到，刚开始做，我的产品价格设置都不算便宜。而且，告诉你个实话...我当时重点就是卖 9800 元私教产品的，所以这也是为什么我能这么快速做到 10 万变现的核心原因


    那如何设计高利润产品呢？'
