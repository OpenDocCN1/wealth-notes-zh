    # 阶段四：


    开启这个阶段的标志性事件是因为蝉妈妈数据的一次分析。通过生财我知道原来抖音是有数据分析平台的，因为自己是供应链出身，对数字还是有点感觉的，所以有一阵子非常喜欢泡在蝉妈妈里面看数据。


    当时做了一个非常有意思的事情，就是我把我认为的对标账号的数据都去做了一个归整，印象里是找了100个左右抖音里面做教育和母婴这一块的博主，然后去看他们的销售数据以及他们销售的利润，然后我惊讶的发现，原来在抖音里面带书的博主，真正赚钱的就是头部博主，而且“头”非常大，行业集中度非常的高，到了中腰部的博主，真的赚的money也不算很多。


    但是有一个人的数据非常的抢眼，就是“博士晴妈”。博士晴妈当时的粉丝量还不算很多，印象里是10几万的粉丝量，但是她的利润要比很多粉丝量在三四十万，甚至七八十万的带书博主的利润还要高。'
