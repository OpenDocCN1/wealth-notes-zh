- pgno: 106
  md: '我研究过很多博主，都有这7小步的影子，我自己学了之后是按这7步来走的，我把这个卖课前洗脑加进我的直播稿以后，收效非常显著，所以大家也可以试一试。


    第四阶段卖课催单。催单的目的是啥？一是让想买的尽快下单，二是让犹豫的人减少犹豫时间，今天一定要买！


    留在我们直播间的客户，可以分成三类，一类是必买的（5%-10%），第二类是犹豫的（90%-95%），第三类是不买的（不是精准用户），在我们的卖课催单环节，就是要把第一类和第二类的用户都拿下来。


    所以，其实我们的重点应该是在那些犹豫的客户身上，要去研究他们到底犹豫什么事情。基于你的研究，然后给客户上催单的话术。


    催单话术一般是促销话术或者情感话术，促销话术包括：限时话术、限量话术、秒杀话术、加赠话术、额外服务话术、售后话术、倒计时话术、库存告警话术。情感话术包括：换位思考话术、血泪史话术这些。


    这些话术一定一定要背熟，然后要灵活运用。我自己的经验，就是每一场直播你碰到的人是不一样的，如果你把这个流程写死的话，基本上效果有限，所以一定要基于互动灵 活的去使用这些话术！！


    ok，跟大家简单介绍了一下自然流下的标准直播流程。我这么泛泛的来写，你如果希望从我这里拿到上手就用的方法基本是做不到的（当初我们学这个学了一个月，每个礼拜2个小时），我根本没办法把这些东西都给大家详细的写在这里。


    同时我自己也是个三脚猫，很多地方我做的估计都未到及格分。'
