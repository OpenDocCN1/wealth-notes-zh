- pgno: 554
  md: '现在，任何的细分行当，都可以用超垂直的个人知识IP打发重新搞一遍。这一个单一的技能匹配单一的人群，全国的市场无限大，你总能通过你的一亩三分地建立你的王国，而且竞争也没有那么强烈。


