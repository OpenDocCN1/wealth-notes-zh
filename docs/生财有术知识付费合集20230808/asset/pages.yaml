  md: "# # 你认在工作中要讲苦干，还是讲巧干？\n\n2021年山东青岛市青选计划结构化面试真题\n认真题有人没工作中要讲“苦干，有人说工作中要讲“巧干”，谈谈你的理解。\n\
    \n+   - **题目类型**：综合分析（态度观点）\n- **态度**：一分肯定\n- **【参考要点】**\n  - 题目【核心词】：苦干、巧干\n\
    \  - 题目【本质】：对待工作的态度\n  - 题目【目的】：了解考生对工作的定位\n\n给定原理，更好服务发展，成长成才。\n\n+   - **分析**：有人说在工作中要讲“苦干，\
    \ 扎实强调了苦干的重要性，对于工作态度能刻苦，苦干实干必不可少。只有发扬苦干精种和作风，才能攻坚克难，实现长远发展目标，苦干精神是中华民族的传统美德。\n\
    - 有人说“巧干” 强调思路灵活，不同系统的人， 同系统的人， 不同岗位的人， 形成小康社会，在此过程中也有很多先进榜样值得我们学习。如黄文秀等年轻干部，他们不挑艰苦条件，恶劣环境，一心一意，埋头在...才独有今天的幸福生活。\n\
    \n但是，在工作中我们不仅要做低收入者，还要抬头走路，既要不干， 又要巧干，在工作中要讲巧干，...可以 达到事半功倍的效果，可以提高工作效率、节省工作时间，节省地方金钱，所以巧干也是必须的。正所谓俗\
