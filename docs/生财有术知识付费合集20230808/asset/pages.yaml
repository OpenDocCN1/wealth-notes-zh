- pgno: 350
  md: '例如：我会在投稿第二天问新编辑，文章质量怎么样，素材和观点可以吗，大纲结构可以吗，我下次直接写大纲发你可以吗……等等，等编辑回复，进而拿到后面可以不写全文，先发大纲确认再写，节省彼此精力，同时给编辑留下好印象。


    如果没有过稿，还要问出是什么原因，知己知彼百战不殆，这都是为后面文字赚钱和积累人脉获得圈子影响力服务。


    新手在和编辑沟通过程里要多注意细节，多复盘总结。


    # 3. 我的投稿骚操作：


    有时可以另辟蹊径，像我通过微信号 把鸡汤文投给心理号编辑（投微信比邮箱反馈快），或者把职场文投给个人成长号，励志文投给情感号。这时候，编辑看的不是文章主题，而是你的文字基础，如果基础可以，可能给选题写或者试稿（沟通见上面）。'
