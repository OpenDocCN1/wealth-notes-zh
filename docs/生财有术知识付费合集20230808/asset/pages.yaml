- pgno: 862
  md: '【大师课十日谈】关于家装设计师Kelly Wearstler的分享会 | 嘉宾：大玮Fleur：

    https://www.bilibili.com/video/BV1pU4y1P7BQ?zw&vd_source=26bbd5c99a86d984e07264d4c57d74e5


    # 二、B站生态和入局建议


    # 2.1 一个年轻人的聚集地


    这个部分，我希望和大家聊聊自己对B站的看法，这只是我的主观感受，并且多年来在B站知识区混迹，也是获得了一些体感，希望分享给大家，带来一些启发。


    B站是一个年轻人聚集地，在这里可以看到新的Z时代，90和00后在这里玩梗和畅聊，在优秀的作品和Up主的引领下，形成一个弹幕的虚拟空间。


    敢杀我的马？！： https://www.bilibili.com/video/BV1yt4y1Q7SS?zw


    B站重要的不是UP主有多牛逼，曾经我记的有一个财经UP主，在B站分享自己月入千万，如何炒股成功等牛逼的案例，在B站并不欢迎这样的“狂人”。不管这个UP主他是不是真的月入千万，在B站这个社区里，平等和去魅是两个很重要的特质。


    UP主并不是高高在上的人设，不用去搞特别高大上的标签，没有什么需要去包装，而只要做真实的自己，分享自己的思考和观点，做让用户可以基于你的内容表达观点的事情，这就足够了。'
