- pgno: 56
  md: '# 普通人努力路径：行动—坚持—数量


    在商人的世界里，检验的唯一标准就是赚了多少钱这个结果。


    所以，检验努力的结果不是数量，而是数据结果，直截了当：赚了100w、1000w


    真正的优秀的人是这样的高效努力路径:


    +   第一轮：行动（先试试）—拿到初步结果（看看市场反馈）


    +   第二轮：反思初步结果总结（为什么做的不够好，总结原因1、2、3）—优化（优化问题、吸纳内容）—结果


    +   第三轮：反思第二轮结果—优化—结果


    +   第四轮：


    +   第五轮：


    +   ......


    一轮不行，再接着一轮又一轮的行动、努力、反思、学习、优化、验证、直到拿到好的结果


    所以努力不一定赚到钱的原因是：是在于执行效率的问题，对执行路径的错误。


    # 4、认知不到位必定赚不到钱'
