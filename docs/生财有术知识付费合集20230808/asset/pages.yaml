  md: '# 【公考课程】2篇


    # # (精华帖)(160赞)公考通过内容差异化，在小红书上变现30W+的经验分享


    作者: 哆啦


    日期: 2023-02-16


    一年1-2次的公考，以及数以万计的考生，都说明了公考项目是一个可持续做的知识付费赛道。


    那怎么能在这个红海赛道里分一杯羹？我希望通过今天的分享，给大家提供一些思路。


    大家都知道，知识付费变现有两种方式:


    第一种方式是分销别人的产品，不过销售权、定价权、产品所有权都在对方，分销者很被动，获得的收益也有限；


    第二种方式则是先通过学习、掌握并进行运用、验证、整理，总结出一定的经验，再传授给更多用户。虽然制作产品的时间比较长，但是适合长期做，自己可以掌握销售权和定价权，将收益最大化。


    我做的就是第二种变现方式。


    下面，我会完整拆解出我在公考红海赛道中通过差异化，在各大公考机构激烈厮杀中获取30W+收益的经历。


    生财有术的圈友好，我是哆啦，3次考入不同体制内单位，副业在做「公考面试培训」知识付费，之前一直在知乎引流，从22年4月份开始转战小红书，在小红书累计变现了30W+。'
