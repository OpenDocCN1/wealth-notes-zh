- pgno: 876
  md: '# 内森の共学群 【导演】


    # 内森の共学群 【表演】


    # 内森の共学群 【写作】1群


    从整个转型的过程来看看，我在从免费到收费的转变时，遇到了掉粉和评论区的负面评价，压力还是比较大。虽然，当前大师课翻译有别的b站UP主在做，不管他们是用机翻还是人工翻译，内容的深度和广度都没有完全超越我们的产出。所以，我还是有信心做成付费，仍然能获得用户的支持。


    同时，开始进行一定的商业化是为了更好地可持续运转下去，让我这个副业可以扩大规模，提升产能，帮助更多年轻人成长。


    客单价一开始我不敢收太高，并且觉得收费是一个很无耻的行为。本身搬运翻译盗版的大师课来盈利，让我一开始非常地不舒服。我在开始收费的时候，还是和字幕组同学做了深度的沟通，并且得到了他们的认可和支持。


    同时，我也保证一定数量的大师课，会全部放在频道免费供观看，保证字幕组的成果得到充分地展示，而不是仅仅作为商业化的用途。'
  merge: -1
  img_proc: true
- pgno: 877
  md: '我的第一个共学群是商业，因为本身这个行为就是商业化行为，所以我把商业类型的大师课做了分类，开出了第一个共学群。后面也陆续开出了关于写作，运动，冥想，艺术，表演，导演等其余9个共学群，让用户开始分流。


    在进群的定价和涨价策略上，我用了-一个比较简单的模式，就是人越多，定价越高。


    因为，我相信只要进来的人越多，产生地链接和丰富度将会逐渐变多，社群的价值也会越高。当然这个理论后面得到了证伪，一个社群不是人越多越好，而是链接越深越好。我认为是有-一个社群人员临界值，突破了那个临界值后，社群的活跃度将会平稳甚至下降。


    第一个社群的单价是29元，每增加100人，涨价10元。为了让这个商业群的价值提升，我甚至去拉赞助，希望获得更多有价值的资源来扩充商业群的内在价值。


    从商业群开始，我每个月都会策划新的共学群，并且搭建好的社群所需要的打卡体系和内容规则，在这个过程中，我也学到了不少社群管理的知识，让-一个付费社群运营逐渐形成。


    最终我在一年内，通过做垂直付费社群，共获取到了优质的付费用户私域流量3200多人，并且总共变现14万。


