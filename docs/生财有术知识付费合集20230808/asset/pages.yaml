  md: '![](img/00c8ed3105ac934755346b58149acc95_147_0.png)


    # **一、什么是抖音虚拟类目玩法**


    虚拟产品：一切没有实物的产品，例如课程、服务等。'
  merge: -1
  img_proc: true
- pgno: 148
  md: '抖音虚拟类目玩法：依托抖音平台，销售虚拟产品。


    生财的两次大航海，对于个人IP的打造与课程的制作销售，总结的很详细和系统了，也带领了很多圈友取得不错的成绩，这里强烈建议大家去拜读两次大航海的资料。（我们公司读书会就专门把两次生财的资料包进行拆解学习）


    我把个人IP跟课程销售也归纳到虚拟类目的范畴，从销售的产品属性来讲这是包含的关系。我对虚拟类目的定义相对会更广泛，包含了所有非实物的产品。所以我们没有从IP打造和课程制造这个点开始做起，实话这个对于普通人来讲难度系数还是太高，变现周期也很长。


    而我提出的这个抖音虚拟类目玩法就更加的低门槛与灵活，相对低成本就能运作并实现营收，更适合小团队切入。


    众所周知，我们常说的虚拟类目由来已久，并不是什么新鲜的玩意，淘系/咸鱼/拼夕夕玩的溜的大神一抓一大把，但是抖音虚拟类目这个概念，很奇怪，根本没有人提起这个（或者不全面）。


    往下之前先明确几个基本概念：


    在抖音卖货的两种角色：①抖店卖家 ②达人


    抖店卖家：产品的供应链，运营承载方。


    抖店卖家的两种载体：①抖店 ②学浪（抖音官方学习平台，数据直接与抖店互通），我们的产品根据实际情况会选择放在抖店或者学浪进行销售。'
  merge: -1
  img_proc: true
- pgno: 149
  md: '达人：渠道方、流量主。


    达人主要销售方式：①图文短视频 ②直播 ③私域


    我本次分享的内容是从抖店卖家的角度去分析。


    两句话跟大家共勉：


    +   ①对于大部分人而言，看见了路才会相信，相信才有决心，决心是做好事情的开始。


    +   ②所有的生意都适合在抖音再做一遍，虚拟类目说：俺也一样。


    # 二、项目优点


    # 1. 利润高（更赚钱）


    这里先聊聊兴趣电商与搜索电商的区别，我们做了10年传统电商，一年多的兴趣电商，特别理解两者的差异。


    简单一句话总结就是兴趣电商靠的是推荐流量，系统算法会根据客户标签推荐他们喜好的内容。而搜索电商就是自发性行为，我需要什么产品就直接搜索比价购买。'
  merge: -1
  img_proc: true
- pgno: 150
  md: '所以作为兴趣电商，抖音可以卖的比淘宝、拼夕夕更贵，千金难买心头好。平台给客户推送他们喜欢的内容，例如推荐了某个喜欢的卖货直播间，那直接就下单了，较少进行比价。所以看明白没，我们不能用传统电商那一套思维去给抖音产品做定价，要勇于往高去定价，越贵越爽。


    特别是那些我们自研发的课程，我们掌握着定价权的，那简直就是我的草原我的马，我爱咋耍就咋耍。


    所以，我们产品的售价与毛利都要远高于其他平台，高到什么程度？那种搬运的品，可以十倍甚至几十倍以上的销售定价！


    # ### 2. 爆发力强（卖的更多）


    # #### ①众人拾柴火焰高


    抖音的商家跟达人都能触达到消费者。怎么理解？就是说除了商家自己的内容视频跟直播，行业的达人也能同时帮我们带货。


    在精选联盟的系统里面，相当于你有很多个业务员，每个业务员通过他的渠道帮你卖东西。每个达人都有他的铁粉与能撬动的自然流量，当一大波达人同时帮你推的时候，就很容易形成一个现象级的爆款，全网都在推。


    对比传统电商的商家流量推送，达人玩法足以刷新你对天花板的认知。至于达人为什么要带你的货，我下面再分析。


    # #### ②流量大，未开发'
  merge: -1
  img_proc: true
- pgno: 151
  md: '抖音日活7个亿，只有一亿有在抖音买过产品的，那意味着平台的大趋势就是有很多未开发过的优质流量会形成消费群体，这就是风口。而虚拟类目我掐指一算，估计6.872亿都没有消费习惯。


    # 3. 竞争相对小


    # ①有能力的在偷撸


    抖音虚拟玩法，现在在牌桌的玩家就没几个团队，专业的就更少，有能力的也是偷偷玩不出声。


    # ②店铺运作门槛高


    抖店虚拟的门槛高，各项指标考核也是非常严格，可以说是最严格的类目之⼀了。


    我们有二十多个店铺被封店处罚（扣12分，罚5000元），理由也是五花⼋门，可以说抖店有的惩罚理由都在我们身⻰过了⼀次，搞的我们遍体鳞伤⼜欲罢不能。


    正是这种苛刻的条件，也过滤了⼀批挂机机器⼈⾃动交付的玩家，所以⽬前竞争也是⼩。


    # 4. 适合各种体量的团队


    # ①适合⼩团队⻓⻊⼊⻔玩'
  merge: -1
  img_proc: true
- pgno: 152
  md: '虚拟类目无实物无库存压力，周转资金少，这个层面来讲非常适合新手小团队入门，夫妻档就能搞。


    # ②天花板高，也适合公司化运作


    而抖音生态处于整体上升期，流量足够大，所有头条系的流量变现都可以通过抖店作为承接，峰值也是越来越高。


    我总结的五阶玩法里面，后期打造人设与专属课程完成之后，结合视频+直播+千川的闭环玩法，销售与利润的体量还能再往上走（大家可以参考一下博商）。


    所以我非常看好抖音虚拟类目的公司化运作，因为公司化运作的天花板足够高，最起码有七八层楼那么高。


    # 5. 自研发产品与运营的优势


    ①虚拟产品大部分生产出来之后，终身受用，全网所有渠道适用。


    ②无需物流、交易时间不受限制、退款率低。


    ③无需备货，无复杂的售前售后工作，员工能效高。


    ④无需投入大笔周转资金，毛利即是纯利。'
