    1）求拼单帖-参考文案：xxx机构现在有拼单优惠，是否有考友一起上车？


    2）机构咨询帖-参考文案：请问有考友听说过xxx机构吗？看其他考友介绍的，不是很了解，求告 知


    发布帖子之后，用其他账号留言保持帖子热度，同时，考虑到路人不会长篇大论去对某机构进行 评价，留言要注意控制文字数量，一般不超过20字


    目的：增加用户对机构的好奇心，通过在碎片信息中获得机构名字自行了解


