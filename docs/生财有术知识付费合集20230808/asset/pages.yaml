  md: '学员花时间和精力为你进行了一次分享，你一定要发红包感谢，给多少钱都可以，根据自身财力来，但是不要看着太寒酸，100元以下的红包就不要发了，没什么意思。


    优秀学员分享是一个项目培训全闭环的重要组成部分，发红包就是对嘉宾的鼓励和正反馈，想做好事情，先得学会做人。


    # ### 4.直播连麦辅导


    在经过了课程、微信群、嘉宾分享之后，学员们95%的问题理论上都能得到解决。直播连麦可以做，也可以不做，属于加分项，不是必选项。


    直播尽量做真人出镜，如果不敢真人出镜，那你宁愿不做直播也不用其他拙劣的形式代替真人。这年头没人关心你的长相好不好看，只关心你够不够真诚，能不能帮助别人解决问题满足需求。


    直播连麦环节充当的作用，更多的不是答疑，而是定心丸和形象款。就是让你的学员看到，自己的老师愿意花时间陪我聊天答疑，我的老师一直都在陪伴我，并且帮我耐心疏导，太感动了。


    所以直播时，不应该是冷冰冰的答疑工作，而应该是一种心理咨询、职业规划的定位。


    直播软件有钉钉，飞书，腾讯会议等等。目前钉钉和腾会议已经收费，钉钉一年9800元，腾会议300人以上需要收费。你们可以选择飞书直播。最好能下载直播全程回放，给学员自行复习观看。'
