  md: '转机在生财的大海雀，不记得是哪一期大海雀了，只记得我们当时船长是@沐文，我那时候还是啥也不懂，但是隐隐觉得可能可以往IP方向去走，所以那次大海雀跟着沐文船长走下来，我最大的收获就是非常明确的知道商业IP这个事情，但是对于定位到底怎么定，我自己适合哪个方向这个事还是没谱。


