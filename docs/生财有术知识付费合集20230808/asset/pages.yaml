    +   一项调查数据显示，未成年人互联网总体普及率高达98.1%。与之相伴的是，网络成瘾现象十分严峻。 对此，请谈谈你的看法。


    +   你是单位的一名新人，单位有个老同志总是看不惯你的工作风格，表面很和气，背地里却经常同其他同事说你的不是，导致同事们对你议论纷纷。对此，你怎么办？


