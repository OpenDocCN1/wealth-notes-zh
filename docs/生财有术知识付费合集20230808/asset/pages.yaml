  md: '**2022年，** 很多人都在教授如何利用抖音打造“商业IP影响力营销”，领飞看准一个市场抖音“SEO内容分发营销”，两者都是营销，前者做的人太多了，后者目前属于蓝海，具体不说了，之后给大家分享如何SEO赚钱，也有不少生财的大咖也分享过，大家可以考古下，或者随时关注这个赛道。


