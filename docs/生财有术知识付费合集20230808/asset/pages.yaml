- pgno: 474
  md: '如果你是做知识付费的，那么，你不要只卖训练营、1V1 咨询之类的中/低价的产品，更不要只卖几十块、几百块的课程...


    因为这三类产品，并不是真正帮你赚利润的！


    这三类产品，更多是为了建立客户对你的信任的，是为了让客户体验后，得到超预期交付，从而认可你，愿意为你付费更高价格的产品


    所以，除了低价格、中价格的产品以外，你可以再设置私教、私董、弟子班之类的高价格产品


    私教常见的交付周期和定价有：


    2 个月：3980 元


    3 个月：4980 元


    6 个月：6980 元


    一年：9800 元 / 12800 元


    这四档交付周期和价格，不用四档全做，任选其中 1 到 2 档即可


    当然每个人情况都不一样，这里我无法一概而论，具体的得根据你的赛道和交付情况来定，我只能给大家做个大概的参考


    私董和弟子班更适合已有一定成功案例基础的人做，这里我就先不展开介绍了'
