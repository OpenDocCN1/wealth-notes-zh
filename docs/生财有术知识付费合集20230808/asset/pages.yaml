  md: '有用的话术并不是什么套路技巧，就是实打实的匹配了客户需求和对应的解决方案，也就是“卖点”。


    在个人成长这件事上，如天雅图3所说，让我想起朋友和我说的话：人人都说教育重要，但我们成长时可能没遇到过那种真正能带我们拔高好几层的领路人。


    领路人一方面他的思想，成绩一定是让你信服的，一方面能在你遇到问题时陪你梳理，解决。就像运动员教练能让运动员拿金牌🥺一样。


    那个训练运动员拿金牌的过程，是非常非常有价值的😄。没有这个过程没有结果。


    感觉今年还可以再接5个陪跑，超了的不能接了，会影响精力和效果。不仅限于优势陪跑，还有很多主题可以开发。天雅给了我很不错的启发，去年她找我时，我俩还没主题，也是跑着跑着，看她一步步做


    这条朋友圈是以教练身份看教练价值的内容，结合了个人成长销售卡点我的陪跑业务发的，后面有3个问陪跑服务的人，展现的是教练价值，最后再打广告。


    很多人不怎么能表达自己有什么业务，光是发表行业意见，这就降低了别人问单的概率，因为对方可能不知道你是有生意的。'
