    # ##（3）第三阶段：只发面试解析


    发面试真题会有个问题，就是每天的面试真题太多了，会有很多考生在评论区问题目答案，回复吧，一道题起码得写一二十分钟，不回复吧，还经常有考生问，越来越感觉，发面试真题有点鸡肋了，所以过了两个月后就索性不发了，后面就只发面试的解析笔记。


