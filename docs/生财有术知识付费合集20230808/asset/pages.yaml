  md: '# ## 2、学习不等同于赚钱


    很多人经常说我还在学习中，但一直没拿出什么实质结果。


    学习的本质是解答一个问题或一个知识点，通过时间的付出，把知识体系积累越来越庞大。


    而知点的积累需要融会贯通的去实践解决问题，否则就只是增加一个信息。


    比如：为什么公司会裁掉35岁大龄基层设计师？


    学习思路是找到这个问题的答案：


    +   - 原因1、降本增效

    - 原因2、重复劳动力可替代性

    - 原因3、性价比不高

    - 原因......


    这个学习就像我们学 1+1= ？他的核心是**解答一个问题**。


    而赚钱是**解决一个问题**。


    他不光是搞清楚一个问题的原因，而是背后思考如何解决掉这个问题。'
