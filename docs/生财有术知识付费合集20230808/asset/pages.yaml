- pgno: 104
  md: '# 自然流下的标准直播流程


    ![](img/00c8ed3105ac934755346b58149acc95_104_0.png)


    第一阶段开播暖场是为了让路过的人留下来，同时快速的建立信任，同时通过极速互动让系统给你推人。


    开播暖场7步法，也给大家贴一贴：


    ![](img/00c8ed3105ac934755346b58149acc95_104_1.png)


    在这个环节，最重要的事情是去做极速互动，要尽量的让用户跟你做短平快的互动，如果能极速互动3分钟，系统就会给你推人。这个极速互动是指点赞、关注和进粉丝群，所以要尽可能的准备一些诱饵让用户愿意跟你来做互动，这个点我自己一直没做好，惭愧，不过大家可以去找优秀的对标学习一下。


    接下来是第二阶段干货知识点讲解。这块内容基本上秀肌肉的意思，要让你客户通过你的干货内容留到你卖课，系统会先重点考核你的客户停留时长，然后再考核你的持续互动情况（点赞、关注和粉丝群），如果做的都可以，系统就会持续给你推人。


    第三阶段卖货前洗脑。这个阶段非常重要！很多博主可能会漏掉这一块内容，这块内容是拿来做放大需求和营造价值感的。简单的说就是戳用户痛点，让用户痛哭流涕，然后你告诉他你的东西很好，他才会心甘情愿的买单。'
  merge: -1
  img_proc: true
