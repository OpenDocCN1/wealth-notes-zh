  md: '![](img/00c8ed3105ac934755346b58149acc95_679_0.png)


    拿我自己的赛道和我自己的经历，我把这几年大概分为三个阶段（知识付费为主的赛道，篇幅问题，今天不谈硬件、APP、电商等类目）


    2008-2015 混萌芽期，这个阶段很多人都不知道怎么做银发赛道，这几年大部分的是做流量的平台，后期发现也表现不好，糖豆广场舞等垂直 APP 在那几年获取了大量的流量。


    2015-2019 野蛮生长期，这个阶段，出现了一些垂直的平台，比如美篇等社交平台、墨客、墨池、快乐 50 等垂直领域的机构、养老家政、健康睡眠等项目兴起、线下的老年大学（报名名额抢都抢不到）、音乐相册、天气软件等工具类产品，得到了快速的发展，吃到了一波红利。


    2020-2023 飞速增长期，这个阶段，大厂开始入场，先是红松短期内拿到了两笔由蓝驰、经纬等机构数千万美元的投资，知乎合伙人出来做的老年项目、尚德教育、大鹏教育（如今倒闭了，嘻吁噱）、高途等等都开始做银发赛道的知识付费我自己深有体会，中老年知识付费，2015
    年到 2018 年，绝对是野蛮生长的几年。


    分享个数据，这几年最开始走最简单的公众号投放，完全不需要任何投放技巧和文章的转化技巧，书法课、国画课的 ROI 可以做到 20，而且复购率超高，什么概念，一个月投放花
    5 万，能卖 100 万，而且客单价可以轻松拉到 2000。'
