- pgno: 907
  md: '面试考生有很多个性化需求，大多数都会选择报班，但是呢，面试有些问题不是报班就能解决的，因为很多线下机构的面试老师讲的太烂了，这些老师绝大多数都没进过机关单位，很多都是机构短时间培训出来，又去教面试考生的。（大家可以搜搜：某公退费的难。就知道这个行业的老师水平有多差）


    也正是因为们讲的烂，导致考生很多问题，这里就有很多考生的*需求点*：


    +   线下培训班学不到东西，自学又提升慢的


    +   面试没有自己解题思路的


    +   面试答题空洞，需要提升质量的


    +   考前需要提升，又找不到有经验老师的


    ![](img/00c8ed3105ac934755346b58149acc95_907_0.png)


    这些需求是大机构难以覆盖到的，而且机构更多是固定的面试班时间，报班的就必须在这个时间段上课，我的时间就比较灵活，只要提前预约，这些学员的个性化需求，我都可以满足，而且我授课的质量比机构好的多，学员就更倾向在我这里学习。


    有些需求也并不是提前找到的，而是深耕这个领域后，慢慢发掘出来的，所以啊，一般越大的市场，细分的机会就越多，找到这些细分市场的需求，机会就是你的。


    # # （5）通过复利扩大运营


    908/1029'
