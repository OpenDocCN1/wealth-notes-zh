  md: '如何电话成交对方呢？这也是我一个月变现 10 万的核心秘诀


    首先，我建议大家用飞书 app 或腾讯会议与对方约视频会议，然后你开摄像头，这样的效果是最好的，一方面你露脸了，能更加强对方对你的信任感，另一方面，方便录制下来，做复盘回顾


    然后，有 3 个关键步骤：


    # ### 第一步：提前准备


    是的，你要根据你们之前私聊的情况，以及对方填写问卷的情况，来判断他目前遇到的问题，然后提前准备好你能提供给他相关推荐


    （注意，这里的建议也是同样，只给大概的战略方向建议，而不是给具体解决方案，否则你直接给了具体的解决方案，对方会觉得没必要再为你付费）


    # ### 第二步：了解需求


    是的，虽然之前你们私聊和问卷有初步了解需求，但是你其实还是不了解他的具体情况的，所以这时候你可以补充问他一些问题，一方面是进一步了解他的情况，以便你更好地给他相关推荐，另一方面，通过让他回忆，其实是在放大他的痛苦和需求


    # ### 第三步：给到建议


    当他说自己的痛苦和需求后，你可以给到他相关的大方向的建议，同时强调痛苦和好处，也就是说，如果他不解决这些问题，他将面临什么样的后果，如果他解决了这些问题，他将会得到哪些好处'
