- pgno: 110
  md: '**整体转化率**：如果你的单价 > 1000，合格的比例是 **0.3%**。如果是千元以下课程，达标比例是 0.7%。如果你的数据偏低，那我们要从源头上找原因。


    因为整体转化率 = 最终买单的用户 / 场观，那么多人进了我们直播间，有些人听了一会会的，我们要去查他为什么只听这么一会，可能是我们内容不够吸引人，他觉得我们讲的不好，或者他觉得我们讲的还不错，但是因为没有钩子，他没留下来。


    那还有些人进来了听了好久，但是他也没买单，那可能就是我们没有营造出我这个课你买了一定有用的氛围，或者在催单时候没有让他感觉一定要今天下单。所以整体转化率不高，我们需要从各个方面找原因。


    就我自己而言，我的整体转化率有时候能达标，大部分时间不行。那我自查时候就去看，到底是干货内容的问题还是洗脑的问题还是催单的问题，我最弱的地方是催单部分，所以努力的方向基本上是优化催单内容。（但每个人特点不一样，所以还是要基于自家的情况自查）


    # ## 2. 没有团队个人如何引流？（适合入门级别的目前没有团队的朋友）（一个非常小的经验）


    目前为止我还是一个人来做，对于个人要应付一个直播其实还挺忙碌的，有时候会觉得自己势单力薄，特别是在引流这件事情上，我自己不懂得投流（这个是我非常弱的地方），压根不知道直播投流到底怎么弄，然后一直想去了解也没实际行动起来，所以流量问题一直也是非常头大的问题。'
