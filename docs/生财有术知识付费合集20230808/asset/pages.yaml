- pgno: 730
  md: '怎么录制？


    如何快速产出课程内容？


    录制课程的 sop 是什么？


    这些一开始一定要想明白，不然会浪费大量的时间做重复性的动作，下面是我的产品的规划大纲：


    # 1）产品内容体系。


    +   ① 基础乐理知识讲解


    +   ② 基础节奏型讲解


    +   ③ 基础节奏型练习（跟唱练习+完整乐曲带唱+钢琴动态谱）


    +   ④ 综合练习曲（跟唱练习+完整乐曲带唱+钢琴动态谱）


    # 2）如何差异化？


    +   ① 练习曲的练习方式增加【跟唱练习】，就是一句一句的带唱，这种教学方式，更容易让初学者接受，同时，观察了同行，并没有这样的教学方式。


    +   ② 综合练习曲，即 110 首歌曲，同行大部分都是以下流行的歌曲为主，如《梅花泪》《早安隆回》《红枣树》等，这些歌曲非常受中老年人喜欢。'
  merge: -1
  img_proc: true
- pgno: 731
  md: '但是同行中用经典老歌来作为教材的很少，所以我选择了用《歌声飘过30年》中的歌曲为主。


    《歌声飘过30年百首金曲演唱会》为《中国音乐电视》推出的合集。该合集囊括30年来流行于内地及港台地区的百余首代表性作品，归纳和梳理改革开放30年来中国原创歌坛的经典歌曲，囊括30年来流行于内地及港台地区的百余首代表性作品。


    还有一个原因是客群主要是50岁以上的中老年人为主，这些经典老歌都是他们年轻时流行歌，把这些歌曲拿到直播间教唱，非常容易引起他们的情感共鸣。


    3）产品通过什么样的形式给到客户？


    ① 抖音：直接用学浪，由于自己有教师资格证，资质没问题，开课后，录完一课就上传一课，非常方便。


    但即使这样，很多客户依然每天来问在哪里找课程，为此，录制一个如果观看课程的视频是非常有必要的，凡是来问的引导他们去主页看视频。


    ② 视频号：


    小鹅通：由于视频号官方没有虚拟课程的平台，所以只能通过第三方平台来上传课程，需要讲购买了课程的用户引导加微信，然后通过微信发送。


    我用的是小鹅通平台，小鹅通是可以直接上架虚拟课程通过视频号卖货的，比较方便。'
  merge: -1
  img_proc: true
- pgno: 732
  md: '视频号小号：还有个方法就是另外开通一个视频号小号，将小号设置成私密账号，把课程上传到小号了，引导客户关注视频号小号，后台通过关注申请就可以了。


    避坑：刚开始的时候，为了节省成本，选择了用免费的【荔枝微课】平台，结果导致了非常多的售后问题。


    荔枝微课里的广告非常多，每天都有大量的客户来问怎么找课程，为什么课程看不到等诸多问题。


    后来实在忍受不了这无休无止的售后问题，花钱没了小鹅通平台，从此以后，用户基本上没有了操作方面的问题了。


    所以，课程的平台选择还是很重要的，毕竟客群不是会玩手机的年轻人。


    # ## 第二阶段：根据市场反馈持续优化产品


    刚开始的时候，为了做到【轻交付】，采取的是虚拟课程，但是中老年人群有个特点，就是眼睛不太好，眼睛长时间盯着屏幕看，字体小，在直播过程中不断有用户提出能不能出书，这就是在做的时候市场给我的反馈。


    所以后期采取了简谱书 + 二维码的形式，每首乐曲上方都有一个二维码，用手机扫码后就有相对应的练习视频，用户可以一边看着书一边练习，这样产品非常受中老年人的喜欢。'
  merge: -1
  img_proc: true
