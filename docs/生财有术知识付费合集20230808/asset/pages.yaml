- pgno: 845
  md: '作者： 内森Nathan


    日期： 2022-09-07


    你可能刷到过这些发布在**B站**上的国外大师课程，比如**NBA巨星史蒂芬·库里**教篮球的大师课，**FBI首席谈判专家Chris Voss**教谈判的大师课，时尚女魔头安娜.温图尔教创造力与领导力的大师课……


    如何获取到最新的国外大师课程，及时翻译分享出来呢？今天我来分享如何从**0-1**运营搭建字幕组团队和**B站**账号，并且实现商业化变现的经验。


    大家好，我是内森。很高兴在今年加入生财，在社群内一直潜水了**4个月**，之前主要在**B站**做翻译大师课和付费社群的项目。


    正文分为四个部分来讲述：如何管理字幕组的志愿者，**B站**的生态和入局建议，怎么做**B站**公域引流到私域以及未来的发展方向，希望对大家有所启发。


    先简单做一个自我介绍，我**16年**本科毕业，工作了**2年**多后，在澳洲读了一个研究生，**2020年**毕业后加入了深圳的互联网公司，做产品运营工作。


    平时业余爱好是读书，学课和冥想。我自己对于跨界学习和内在成长的内容非常感兴趣。在国外留学的时候，了解到了大师课**Masterclass**这个网站，购买了他们的会员，学习了相当多的课程，大有收获。


