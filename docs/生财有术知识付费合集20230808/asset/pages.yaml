  md: '【第三个，当你选品完成、人设定位完成了之后怎么做，那就是最关键的直播！我们应该怎么样去直播？】


    这句话真的价值一百万：新人起号做好一个月都非常寂寞的准备，每天4小时直播只干一件事：打标签！我们期待的直播间是一开播百人千人在线，互动极高，各种人进来刷礼物抢福袋，转化特别的顺畅。但是抖音99.99%的直播间，其实就只有10个人在线，甚至没有人提问，大部分电商直播间是非常寂寞的，我们要有这个心理准备。不要盲目追求在线人数，因为我们要的是能买三高产品的精准用户。我跟大家毫无保留的分享一下我们当时做电商的数据。我转电商是起了小号，利用私域宣传完成了一次启动，第一场直播是20万的gmv，而第二场就只有6万的gmv，因私域用户下单基本已经结束了。从第三场开始，我的每一晚直播都是1万的gmv左右，相当于这一整晚我可能只有三四个人在我这付款，我一整晚播三个小时，一个小时里可能连两个互动都没有，在线十几个人。就这样一直播每天播。而到了第二个月的时候，直接就可以单日做到大约3~5万的gmv，再到之后单日可以做到5~7万的，再到之后单日可以做到7~10万……甚至我在三八节现在做到了一个单场百万的量级。现在我的在线人数也就是50人而已，为什么能够做到这种稳定的增长？其实很简单，三高产品是高复购滚雪球的，最难其实是冷启动。所以第一个月要做的的事情不是拉流量，而是耐住寂寞打上标签！什么叫打标签？你要让系统知道什么样的人喜欢你，你想吸引的是什么用户，年龄性别城市兴趣消费能力关注品牌这些都是标签。而抖音做的这么好也跟他深入的标签和匹配策略有很大的关系。但是新人开播你的在线很少，10个人在线，一场推流不到500人怎么打这个标签？教大家三招：福袋、画面、短视频。福袋是成本最低的做法。标签中的一个关键衡量要素是你直播间的评论互动，你的直播间是不是很多人在评论区提到了这个关键词，这个就是你直播间的标签。我们会发现婷婷的后台也会有这个数据，看你直播间的关键词。举例子，今天我们卖的产品叫做XX小熊，假设小熊是你主带的品牌关键词，你的福袋就可以设置“XX小熊真的太神奇了”或者“XX小熊真的太好吃”“XX小熊真的太好用了”每一个用户进来点开福袋都帮你做了一遍标签。第二个就是你的画面一定要把产品进行突出！好的产品是自带流量的，当你在直播画面黄金位置展示的时候，对这个品牌感兴趣的人就会从广场点击进来。甚至你可以把进入语也加入品牌关键词，比如“XX小熊到货了，拼手速”，这就对人群进行了一道天然的筛选。第三个短视频，这点我们今天不展开了，简单来说不要啥都拍，拍点精准的和产品和人设有关的。初期短视频非常重要，内容越聚焦越好！给大家直接看我当时拍的选题。电商冷启动一定一个月的耐心，但是只要能把标签打上，稳定单日做到变现2-3w，后面就是日常优化迭代人货场就可以了。我们用这套框架冷启动目前100%的成功率。


    最后再分享一个在实操方面，我非常有心得体会的，就是如何去搭建团队。'
