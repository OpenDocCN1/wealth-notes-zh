    # ## 三、跟阿德勒学带人


    上期大航海结束后，我一直在想，自己偏个性化探索，有没有什么更底层的东酉，可以复制到更多的项目中去？


    冥思苦想了很久，一直没找到。直到近几天，看到龙珠群李小陇老师分享的这本书《管理精进：跟阿德勒学带人》，才茅塞顿开。


    别被书名困惑，阿德勒心理学认为：所有问题的本质是人际关系。教育则是一棵树摇动一棵树，一朵云推动一朵云，一个灵魂唤醒另一个灵魂。陪伴船员，支持志愿者，本质上都算“带人”了。


    如果只用一句话总结，那么这本书的核心方法论就是「给与勇气」。


    看过《自卑与超越》的圈友都知道，每个人都怀有自卑感。一种人会不断地进行积极建设性的努力，另一种人则会采取消极的非建设性的行为。


    这两种截然不同的态度正源于自身有无勇气。大声咆哮、吓唬威胁并不是勇气，只有“克服困难的活动”才称为勇气。


    阿德勒心理学认为，人一旦缺失勇气，就容易产生鸵鸟心态，逃避问题的解决。相反，如果“勇气”充足，就会积极主动地直面问题，并努力克服困难。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '“给予勇气”是帮助对方利用自己的能力，自发性地克服困难的行为。因为每个人都会无意识地努力让自己变得更好。我们的目的就是激发这种意识。


    所以，如何给与勇气呢？「不表扬、不训斥、不直接教导」


    +   1、不表扬：表扬不是称赞，后者是平视下的欣赏，前者多会带有居高临下或控制。请相信我，虽然大家不说，但没人喜欢一个居高临下的领队/志愿者。


    |  | 表扬 | 给予勇气 |

    | --- | --- | --- |

    | 定义 | 认可、赞赏对方的优点 | 给予对方克服困难的活力 |

    | 关系 | 上下级关系 | 对等的平行关系 |

    | 场合 | 对方完成己方期待的工作时 | 任何时候，包括对方未达成目标时 |

    | 对象 | 显性化的能力或成果 | 工作过程或对方本身 |

    | 视点 | 己方视点 | 对方视点 |

    | 态度 | 评判的态度 | 共同感受的态度 |

    | 目的 | 1. 赞扬对方；2. 控制对方 | 协助对方依靠自己的力量解决问题 |

    | 行动 | 赞赏对方的成果和显性化能力 | 1. 表达其工作贡献的感谢；2. 传达积极情感和感受 |

    | 效果 | 致使其介意他人的评价，受不到表扬就不去努力 | 有自主工作的精神，不依赖他人评价，独立有担当 |


    +   2、不训斥：我自己做船员的时候，就很不喜欢“凶”的志愿者/助教。看到他凶别人几次或被他凶几次过后，我就太不愿意搭理他了，更别说主动向他提问、求助。可想而知，这样的情况下，我还能的学的好吗？如果可能的话，我必定会想尽办法换其他的志愿者/助教。


    书中有个训斥的例子：“哎呀，不行！不行！你再这么做肯定会出现问题的。你怎么能这么做呢？要动动脑子。看好了，这么做才行，你赶快给我改改！”这是挫伤勇气的典型言辞，单方面的，不容辩驳的，传达给对方的意思是“我是对的，你是错的”、“我懂，你不懂”。'
  merge: -1
