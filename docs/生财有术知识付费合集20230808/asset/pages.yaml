    # # 1.我为什么选择公考面试？


    # （1）先说说什么是公考面试，方便大家了解


    不管是公务员还是事业单位考试，基本分为两个部分：笔试和面试。


    笔试一般是考行测、申论、公基等等，笔试通过后，会以1:3的比例进入面试（N一般是3到5，如果岗位招1个，笔试前3~5名进入面试）。


    公考面试，就是考生要在规定时间，回答指定的面试题目，由考官进行打分，把去掉最高分和最低分后的平均分作为考生的面试成绩。'
  merge: -1
  img_proc: true
- pgno: 884
  md: '![](img/00c8ed3105ac934755346b58149acc95_884_0.png)


