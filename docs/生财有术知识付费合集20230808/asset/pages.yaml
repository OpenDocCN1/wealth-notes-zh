  md: '持续发60-80分的内容比单次100分更有持续力。如果觉得写得不好就不发，总想憋出100分再发，其实没多少震撼力，200分才是震撼力但难度很高。如果长期写，有几个80-90分，就能被人记住。持续分享有价值的内容，给对的人和更多对的人，赚钱就是大概率事件。


    有人可能不知道去哪整那么多分享内容，分享一招，去知乎或有对应用户的社群里和用户交流，帮他们解决问题后写成案例。或去观察同行的文章，把有共鸣的观点拎出来自己写，当你有灵感时，一定要立刻去写，不要想太多限制，打动人这件事真的蛮需要情感共振的。'
