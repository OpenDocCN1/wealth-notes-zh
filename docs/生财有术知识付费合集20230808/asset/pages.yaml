    次打款）。


    腾讯课堂收益分级：


    | 权益等级 | 备注 | 等级 | 金牌 | 银牌 | 铜牌 | 铁牌 | 活跃 | 佣金 | 平台服务费 |  |  |  |  | 佣金 | 佣金 |
    佣金 | 佣金 |

    | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---: | :---:
