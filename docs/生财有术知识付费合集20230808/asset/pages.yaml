- pgno: 95
  md: '在这里，我重点来讲讲我如何找到定位的过程。我自己感觉就是对于刚刚开始做IP的人来说，找到非常明确的定位还是挺难的，我们如果要通过个人IP定位，一定要把赛道定位到足够细分，才能更快的闭环。


    我来讲讲我定位的方法，这个方法是从@花爷 课上学到的，再次感谢花爷。


    首先，先要找准大的行业。


    自媒体大的行业，也就无非资讯、财经、教育、娱乐、科技、商业、体育、母婴…这些，既然要做自媒体，那大概的行业类目还是能很快的明确的。


    就像我当时准备做IP时候，虽然我还不知道我应该怎么实现闭环，但我知道我大的行业肯定是在教育，因为在教育行业我是相对比较有资源的，而且也有经验，同时确实离钱挺近（妈妈们在教育上舍得花钱）。


    这个考虑，就符合了花爷说的：**优先选择离钱近的或者资源较多的原则**。


    资讯、财经、教育、娱乐、科技、商业、体育、母婴、游戏、文化、旅游、美食、情感、汽车、时尚、美妆护肤、房产、健康、军事、数码、搞笑、职场、政务、萌宠、三农、星座、摄影、宗教


    自媒体大行业也就这么多


    第二，有了大的类目，就是要去切细分市场。'
