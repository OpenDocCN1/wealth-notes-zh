  md: '而且随着学习实践的增加，我发现，一开始会觉得自己懂了，但是用不好，效果不那么明显，是因为因为自己学了个半斤八两没吃透没悟懂，还没能建立起体系化的思维，所以导致实践中出现偏差。幸好匠心
