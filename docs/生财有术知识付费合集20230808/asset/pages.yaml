    # 每场直播关键数据及数据分析参考表


    来看这张表，我把一场直播里面最关键的数据都列出来了，红色部分是我们必须重点关注的几个值，这几个数据直接决定了一下抖音大大给你推多少流量。


    如果你一场直播没挂小黄车，抖音大大考核你的是流量综合指标，如果挂了小黄车，考核的还有转化综合指标。


    来讲一下标红的指标。（这些数据在“巨量百应”里都可以看到）


    粉丝占比：虽然不能说粉丝占比越小越好，但是如果大于30%，就说明你本场直播粉丝太多了，一场直播粉丝占比太多，就会导致转化率下降。


    （因为粉丝来听直播，一是为了白嫖，二可能是已经买过单过来捧场的）。所以如果粉丝占比过多，那就是前面10分钟的暖场极速互动没有做到位，没有触发系统给你推流。


