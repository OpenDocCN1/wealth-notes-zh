- pgno: 103
  md: '成绩不算很好看，但是也算是稳中有升的状态，所以我来说一说直播里的一些经验，希 望能对大家有用。


    来讲两个点:


    +   1. 直播标准流程和数据复盘（自然流）


    +   2. 没有团队个人如何引流的一点小经验


    # # 1.直播标准流程和数据复盘（自然流）


    以下内容是基于自然流量来讲的。也是抖音给金牌老师内训时候给到我们的攻略，我 自己也实操下来确实觉得很好用，所以值得大家一看的。


    a.首先，自然流量下的直播黄金流程和标准规范。


    抖音知识付费的主播，如果想要撬动更多的自然流量，是有个黄金流程的。这个流程可 以归纳以下这张图：'
  merge: -1
