- pgno: 878
  md: '我分享一下自己对于未来的一些思考。从翻译大师课开始，我积累了第一波粉丝并且做了私域的沉淀，也有了一班志同道合的小伙伴。


    # 4.1 专注内在成长的个人IP


    建构于这个基础之上，我开始向内探索，我真正擅长并且热爱的事情是什么？不是翻译课程，也不是做字幕组，而是我的愿景所说：跨界学习启发中国年轻人的内在成长。


    很感谢生财有术，给我扩展了商业的认知，并且看到了更大的宏观格局，让我知道原来还有这么多商业可能性。从生财链接到了花爷，加入了花爷的IP，从0到1开始做起个人IP，把自己的原创内容摆在了更高的位置。


    我在做大师课翻译的同时，一直关注着另外一个课程平台--Mindvalley 心谷大学，这是一个将觉醒教育带给10亿人的全球化线上学习平台。我从2014年就开始学习Mindvalley的课程，并把不断获得内在成长。


    未来我会基于自己的个人IP--内森师兄，来帮助中国年轻人尤其是职场人，探索职场自由和内在成长，并且转型知识服务赛道，帮助启发更多的青年人。


    # 4.2 专注知识链接的社群品牌


    而原本属于共学社群和大师课的内容，将会作为新的独立品牌出现，那个就是知链青年Knowlink，通过知识链接同好，跨界启发生长。'
