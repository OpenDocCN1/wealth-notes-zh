- pgno: 247
  md: '看到我的主页的人，下意识都会认为我在自媒体上很有经验，所以，大部分主动私信我 的人，都会问我如何涨粉，如何变现。


    ![](img/00c8ed3105ac934755346b58149acc95_247_0.png)


    而且在直播的时候，我也发现大部分人的需求都是围绕“看号”“账号不涨粉”“不知道怎 么发内容涨粉”等问题来咨询。


    所以，我的笔记主题越来越垂直，每一篇笔记都围绕粉丝的需求来开展。这样就让我 的粉丝越来越精准。


    # 2， 价值明确


