    |  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |  |


    如果是低价引流课不要太在意分成收入，尽可能上线越多平台越好。


    另外，不要忽视技术垂直领域的课程平台，它们往往会有更多的精准流量，可以先尝试 上架一两门低价课程看看数据，可能会有意想不到的收获。但也要小心黑心平台不尊重
    版权、随意免费送课、不结款等行为。


    课程平台对比表：'
