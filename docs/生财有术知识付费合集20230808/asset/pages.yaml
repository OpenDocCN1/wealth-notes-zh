- pgno: 984
  md: '除非他特别聪明，会在工作中不停地思考如何做爆款，如何把流量给做起来，但是这样的人 10 个里面可能只有一个，甚至一个都没有。所以我们把底线给定好，至于能不能往上走，就要看能不能找到这种人。


    # 4、如何落地


    首先是数据分析，不同平台、不同账号、不同内容、用户意向度这些都要分析，因为我不只是做小红书，我还做抖音、公众号、知乎、微博，包括我现在也在布局 b 站。


    要根据结果去投入人力、成本、精力，带领每一个运营梳理工作流和饱和度，明确好引流的有效方法。


    然后整理培训资料，制定好月度、周度、日度的培训计划。并且每天都要汇总工作完成情况，通过结果去抽查过程，也就是说道通过引流数据去抽检账号，引流数据做不起来，要么是账号的问题，要么是人的问题。


    我们上周发现一个运营数据特别差，每天只引 4、5 个，跟他聊了聊，问他是怎么做的，他说直接抄对标账号。问他抄的哪几篇？他就说是 12345 这几篇，再一看他抄的那些都是点赞连
    10 个都没有的。


    所以，员工在做的过程中，他接收的信息可能和我们传达时是有偏差的。通过抽检动作去审查他的工作过程和思路是很重要的。


    可能他觉得按照你的想法去做了，但没做出来，就是账号的问题，但事实是吗？并不是。然后你还去怪他：我给你培训这么久，在你身上花了这么长时间，你没做出结果来，为什么其他人可以，你不可以？


    所以这个中间是有误差的，遇到问题不应该先去问责，而应该去解决问题。


    # 5、管理原则：向内找


    在开展项目前，或者每月初，一定要定好规则，定好打法，然后赏罚分明，通过数据去抓过程。结果做不出来，过程肯定是有问题的。


    我们做小红书时，怎么去看过程呢？按照三驾马车的原则。


    三驾马车是什么？选题，主图还有标题。


    把员工按照会不会做和想不想做分类一下，如果会做想做，但我们的支持没到位，就是说没有给到培训，那么作为管理，肯定要反省自己的问题，如果他不会做不想做，就涉及到态度层面的问题，需要一律优化掉。'
