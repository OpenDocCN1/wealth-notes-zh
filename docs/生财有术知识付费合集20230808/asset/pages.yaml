- pgno: 1019
  md: '像很多销售行业，比如做A家保险的，客户问你B家保险怎么样怎么样，80%的业务员都会评头论足顺带贬低一下，然后市场就这样恶性竞争，然后乱了，最后每个人都没有好结果。


    就像互相打小报告和互相揭短的狗咬狗行为，最后只能证明这两个人都是傻B，而不能证明谁比谁更好。


    而且你得知道，只要你说同行的坏话，不是99%会传到他的耳朵里，而是100%会传到他的耳朵里，别有侥幸心理。自古好事不出门，坏事传千里！


    如何彰显你自己的牛逼呢？就是极大地突出你自己的优点，然后让别人自己品。而不是靠突出别人的缺点，来反衬自己的牛逼。


    反衬的动作应该是用户做的，由他自己品位和判断的，而不是靠你自己说。


    该说的话一定要说，不该说的话一定不要说，这样你起码在做人方面就没有大问题。


    所以从今天开始，当客户问你XXX同行做得怎么样？你就不要说“做的XXX不好，很垃圾”，而是说“他的情况我不了解，不做评价，你自行判断就行了。”


    真正有格局的人，从不树敌，因为他知道仁者无敌，宇宙的尽头都是朋友和师长。


    诋毁，本身就是一种仰望！'
