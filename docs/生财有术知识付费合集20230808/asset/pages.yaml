- pgno: 948
  md: '![](img/00c8ed3105ac934755346b58149acc95_948_0.png)


    从2018年~2022年近五年的广东省公务员考试招录公务员岗位及招考人数可以看出，近4年来考试招录人数一年比一年高，其中2020年~2022年平均增幅达14.93%。


    最新出炉的2023年广东省考公告，有3846个招考单位参与，共计提供12768个职位，计划招录18258人。同比去年招录人数增加2457人，增幅15.6%。


    我们入场的原因有三：


    1.在口罩时期的影响下，不管是头部大厂还是中小企业，存活难度上升，裁员倒闭的概率增加，更多人为了寻求更稳定的工作来保障生活，“铁饭碗”就成了第一选择


    2.1962年至1972年这段时期，是新中国成立以来第一个人力高峰期。当时每年新增人口2000多万，所以从2022年开始将持续十年最大的退休潮。虽然国家也作出了相应的应对措施，比如将在十四五时期落实延迟退休政策。但从岗位更替的角度而言，保守估计招考岗位在短时间内还会持续短时间的增长'
