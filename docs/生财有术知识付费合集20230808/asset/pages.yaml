  img_proc: true
- pgno: 71
  md: '根据这条法则，赚钱有“三种常见的商业模式”。


    第一种商业模式，靠体力赚钱，赚的是“血酬”，花费的生产资料是自己的时间和健康。


    80%的人玩的是这种商业模式。


    而往往深陷于这一模式的人，有线性外推人生收入的本能，缺乏对底层逻辑的认知和把握、以及对未来可能性的想象能力。


    这是因为他们从事的大多数是机械重复的无脑循坏工作，且占据了他们所有的时间，让他们无暇深度思考。


    这种工作已磨损了他们的认知和思考能力，长期和枯燥单调的事物打交道也让他们不敏感于时代水温。


    于是他们倾向于把当前发生的事，永远地推到未来。


    我在去年11月初的文章《 大部分人都是“底层画师” 》中，已提前推演了这部分人的未来。


    人能够获得“财富”的基础要素是对他人“有用”或能带来“损害”。


    而对于这一境界的人来说，他们对他人（老板、领导）的“有用”体现在，完成一些没有含金量的，螺丝钉式的工作。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '因为老板和领导的时间更珍贵，需要去做更有意义和价值的事，所以需要把一些没有核心竞争力的，没有大的用处的工作“外包”出去。


    花一点钱，去买时间相对不值钱的人的时间。


    且这种工作让人们将全部的时间和精力花在低价值的事情上，没有闲暇去自我提升、积累和向上突破——


    做这种工作越久，这部分群体就会越缺乏议价力。


    而从宏观角度上来讲：


    只有这部分群体没有议价力，才实现了组织层面的降本增效，加强了资本主义社会的经营效率。


    而随着AI带来的第四次科技革命，不难发现很多这种类型的“打工人”已不再被需要。


    他们做的所有工作AI都可以完成，且价格可以更便宜，效率更高。


    这部分群体注定会成为“无用”之人，与“财富”无缘。


    当然，他们的跌落是相对而不是绝对，为了避免社会的失序动荡，需要提供基础的社会保障。'
