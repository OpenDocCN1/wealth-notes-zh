  md: '我的建议是不要同时泡几个高手，因为每个高手各有一套知识系统，在你不能融会贯通几家之长时，尽量只跟学一个老师，人数在精不在多。与之对应的，你也会指导学习中摄入他们的生活中喜怒哀乐，多一层亲近，把共同学习的经历融入友情，就是陪伴式成长。


    # 二、比快速做到十万加更重要的是积累实战正反馈


    在大号过稿的稿子和十万加文，可以做为新人的背书作品。新人写投稿，不要定位只写哪一类文，先以出篇过稿，积累过稿数量为主。


    # 1. 剑走偏锋，适合新人的另类投稿方式：


    如果只是纯粹追求十万加这个阅读量，我建议新人选择较容易过稿的类别来写，人物文相对观点文对新人容易些。


    我最初在潮流号写投稿，而不是直接投常见类的热门大号，比如樊登读书，十点读书，S叔，凯叔讲故事等。


    因为对于从来不写文的人来说，突然写起来是有点难的，市场收稿对质量有要求。而潮流号不需要深度观点，熟悉账号调性写起来后，过稿难度低，流量号账号阅读量不低，每篇稿费300-500。


    写新媒体不用刻意追求字句优美，基本要求是观点清晰，逻辑语句通顺。


    对于新人写作变现，最需要的积累正反馈，一篇篇写下来，稿费有了，作品有了，在过程中也练笔实战了。'
