- pgno: 896
  md: '小红书笔记是**第一次取得用户信任**的地方，所以我每一篇面试题目的解析都是用尽心写的，一篇有质量的笔记花费时间大约在0.5~1小时左右，我会输出一些面试解析干货，来体现我的专业性。


    在写笔记的时候，我也不断通过「笔记质量」提升与竞争对手的差异化，我也不怕把干货分享完，粉丝就不来找我，因为面试能力是一个比较含糊的，很多时候文字更多是表达一个大致的方向，粉丝要想快速提升，是需要沟通、交流、授课才能解决的。


    对于变现来说，<u>前期建立信任花的时间越多，后期成交才会越顺利</u>。


    # （2）在笔记里面带出自己的价值


    在写笔记的时候，可以带出自己的一些经历，比如自己从事这个行业多少年，取得了什么成绩，带动多少人实现了什么成绩。这样除了分享干货，还能让用户了解你哪里牛X，打造<u>个人IP</u>，进而吸引用户来私信你。


    比如我在解析的时候，会加上一些话语：


    +   “之前我在授课的时候，有学员问我关于***的问题”


    +   “我们体制内工作的时候，并不会***”


    +   “我之前学员就是用了这个方法，才***”


    “老师在面试辅导的时候，<u>经常遇到学员的问题就是：不按照题目的问法去答题</u>。就像上面这道题目，是非常规的问法，问的是什么建议，很多考生就疑惑了，这咋答框架不一样啊，我还需要答原因吗，需要答影响吗？”


    把自己的人设柔和地融入到面试解析中，考生脑海里自然会建立你的画像：<u>这个老师有授课经验、有体制内经验、老师的学员成绩也不错。</u>'
  merge: -1
  img_proc: true
- pgno: 897
  md: '# (3) 价值考的是吸引，不是推销


    和“谈恋爱”一样，知识价值的魅力在于“吸引”，而不是“推销”。粉丝觉得你的内容不错，又有需求的话，自然会关注你、私信你。


    但是，如果主动私信，那就成了推销，这就不值钱了。


    ![](img/00c8ed3105ac934755346b58149acc95_897_0.png)


    所以，如果有粉丝在评论区留言，说咨询面试提升，我也只是评论区回复“小窗T我，滴滴我”的话术来引导粉丝私信，一般不会主动私信粉丝。'
  merge: -1
  img_proc: true
