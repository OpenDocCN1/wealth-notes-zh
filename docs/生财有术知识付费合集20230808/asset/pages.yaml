    # 2.2.3.群接龙拼团，限时促单


    引流到微信的用户有两种，一种是只在社群的，一种是加了客服微信的


    1）对于只在社群的用户，我们会群公告告知大家拼单的时间限制，并且在社群内发起接龙，有意向报名的考生可以在群内进行接龙，两两成团享受拼单优惠。


    免去一部分考生要自己额外找人拼单的麻烦，同时在群内营造多人报名的氛围，带动一些原本只是有想法但是还犹豫的用户下最终决策


    2）对于没有在社群的用户，会一一询问，了解用户是否已经报了其他的机构，没有报考的是否有报考我们机构的意向，有意向的用户告知限时优惠的政策，需要再考虑的用户进行备注


    3）在开课前几天，再对之前考虑成交的用户进行回访，告知目前仅剩余的名额数，增加决策紧迫性


    # 2.2.4.真诚解答，客观回应


    虽然在促单过程中有一定销售技巧的成分，但面对用户的答疑我们始终是秉持客观真诚的原则。


    比如有的学员会说自已基础很差觉得报班也没有希望，有的学员对我们师资不了解会多从各种维度质疑，这些都很正常，比起毫无波澜，有碰撞才会有火花，才会有故事。'
