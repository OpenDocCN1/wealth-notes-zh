    比如对财富的潜意识，穷人也继承了贫穷家庭的思想，比如“你做不赚**100w**。”、“生活不容易，要节约。”、“这个事太难了。”


    当你在收入**5000**的圈子，你跟一群收入**5000**的人谈论。


    当你在月入**10w**的圈子，发现原来大家谈论的都是商业模式，原来的潜意识就会发生改变。


    赚钱难得底层原因，就是自己根深蒂固的潜意识会限制自己的行为。


    即使努力去做表层的努力，也并不一定能得到什么实质变化。


