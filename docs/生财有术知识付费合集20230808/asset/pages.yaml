    # 二、无人直播助眠号如何运营


    无人直播主要通过自然流量直播推荐的玩法运营，因此决定我们账号运营好坏的因素主要**就是账号本身风控状态和直播间素材**优劣。'
  merge: -1
  img_proc: true
- pgno: 781
  md: '所以在账号运营过程中，**前期养号** 尤为关键。注册账号后前3天先不修改用户昵称和简介，正常刷视频和直播间，不同时间不同地点不同网络环境去模拟正常用户使用，适当的点赞、关注、评论。


    **3-5天后可以包装一下账号，修改昵称和简介（切记账号做起来之前不要留电话、微信等站外引流信息，哪怕是提示也不建议）**。


    其次就是不断优化**直播素材** 拉升直播间停留以使系统不断推流。一个合格的素材是一个直播间的基石，我们可以通过在各个视频平台搜索相关素材下载下来，或者直接在网上购买也可以。


    千篇一律的直播间注定不长久，所以拿到素材后，我们不仅要去做重，还要做一些**改动二创**。画面昏暗，就需要调色使其明亮，制造槽点吸引停留，如动态的小宠物，人物的睡姿等。


    添加动态小动物，可通过添加绿幕素材后调整滤镜所得。'
