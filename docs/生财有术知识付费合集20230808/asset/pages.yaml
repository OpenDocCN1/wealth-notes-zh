  md: '# 2.2.2.体现老师专业性


    一次培训少则几千多则上万，很多考生应届毕业生，怕花出去的钱打水漂，对老师的教学水平怀疑是非常正常的。


    出于这部分考量，我们把线上课程的前15min做成了试听版，还准备了一个实战点评的音频，以便考生了解老师的专业水平。


    听完试听课会有两种结果，无非就是成交和没有成交，针对听完之后依然没有成交的用户，我们会在发送试听课的3天后，询问用户还存在其他疑虑，并作针对性回复：


    +   1) 线下课程时间无法配合：少量异地用户在职，这部分问题无法协调


    +   2) 对价格存在纠结：告知用户拼单优惠的策略，只要2人成团能各自优惠的比例，这个动作让一半以上对价格敏感的用户得到转化，同时为我们带来更多成交


    +   3) 对教学水平不满意：询问觉得有待提高的方面，有则改之无则加勉，虽无法成交，但依然要体现服务的专业性


    +   4) 对课程效果和个人学习没有信心：客观分析课程所能覆盖到的对考生的利好以及在备考方面的局限性，同时指出考生心态的偏差，并不是报了班一定能上岸，更多还是教和学的互相促进


    试听后的结果回访很重要'
