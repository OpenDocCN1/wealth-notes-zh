  md: '这是我在生财有术发的第二个帖子。


    加入生财一年多，社恐的我，一直在默默潜水，默默学习，默默做事。跟群友几乎没有沟通，也没有参加过线下活动。


    前两天算了下账，过去8个月，收入超过1000万（我主要用知识星球收费，经常占据星球财富周榜第一的“抖音内参”，就是我）。


    觉得实在良心有愧，就上来发了个处女贴，感谢生财，感谢@亦仁。


    然后亦仁邀请我分享一下经验，我最近有点忙，先简单写一下下吧。


    【摘要】


    +   1、生财之道

    赚钱赚钱的人的钱，从来是门好生意。


    +   2、生财使用手册

    开眼界，找项目，学方法；不薅流量。


    +   3、超级个体

    别做实业，别做产品，网赚、分销、搞定流量，年赚百万不难。


    +   4、多赚十倍

    找到边际成本几乎为零的产品，拼命堆流量。


    +   5、死磕流量

    谁能低成本解决流量问题，谁就可以做好几乎任何生意。


    +   6、多维打击

    流量+品牌+培训+社群+跨平台。我没有同行。


    【序章】李鬼太讨厌了……


    首先我要感谢两个人，@大程 和@临西，他们是我进生财的领路人。


