    对于首次参加龙珠夜话的小社恐来讲，二位的话给了我莫大的鼓励。


    同时我也在想，新一期的抖音大航海在即，有没有可能把我学到的「志愿者交付」再总结成一篇帖子？


    +   • 如果被志愿者中的同好看到，可以得到鼓励和方法，一起试着给船员带来不一样的航海体验；'
