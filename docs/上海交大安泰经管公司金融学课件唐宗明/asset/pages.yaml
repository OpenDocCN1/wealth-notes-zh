- pgno: 132
  md: '# 3.4 财务建模


    +   - 三步：


    +   - （1）历史分析


    对公司历史经营绩效进行全面分析。通过横向和纵向比较，了解公司各种收入、费用、资产、负债等会计要素的组成情况，以及随时间变化的规律和趋势，从而推断影响公司历史绩效的各类因素及其影响方式和程度，为后续预测提供依据


    +   - （2）财务预测


    在历史分析的基础上，综合考虑公司发展规划、战略、外部环境变化等因素，对公司未来的绩效水平做出假设（包括公司未来的收入增长、成本结构、资本支出、市场规模等），并最终完成对公司资产负债表、利润表以及现金流量表的预测


    +   - （3）价值评估


    根据财务预测结果，估算公司的各类估值参数，选择适当的估值方法对公司的价值进行评估。同时，分析重要参数变化对估值结果的影响。'
  merge: -1
  img_proc: true
