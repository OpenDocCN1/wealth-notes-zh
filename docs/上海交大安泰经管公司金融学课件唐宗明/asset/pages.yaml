- pgno: 157
  md: '# 修正内部收益率


    +   - 使用借款利率为折现率，将所有的现金流出量进行折现到时点0。

    +   - 使用投资报酬率为折现率，将所有的现金流入量也进行折现到时点1。

    +   - 能令上述两个折现值在时点0的现值相等的折现率，就是修正的内部收益率。

    +   - 好处：不会出现多重内部收益率，对借款利率和再投资收益率进行区分。


    ![](img/ec4d2623c8fc4762aa4f02df85a4c6f9_157_0.png)'
  merge: -1
  img_proc: true
- pgno: 158
  md: '# 是投资还是融资


    +   如果是项目的现金流与正常投资项目现金流相反，则为融资。


    +   决策原则：当内部收益率低于期望折现率时，接受项目。否则拒绝项目。


    +   因为融资项目的内部收益率实际就是项目融资成本，成本过高反而要拒绝。'
  merge: -1
  img_proc: true
