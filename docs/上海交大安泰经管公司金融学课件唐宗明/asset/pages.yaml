  md: '# 时间与成本


    +   - 在利润表中，产品成本包括销售成本，折旧，和销售、行政与管理费用

    +     - 其中，销售成本包括原材料，直接人工和制造费用

    +   - 从会计视角，上述全部成本回归为产品成本和期间费用。

    +   - 从金融视角，上述销售成本中既有固定成本又有变动成本，而折旧，销售、行政与管理费用属于固定成本。这种区分，有利于企业盈亏平衡分析'
