- pgno: 5
  md: '# 1.1 什么是公司金融？


    公司金融强调以下三类问题(CFO的三大财务决策):


    +   1. 公司应选择什么样的长期投资项目？（产品市场，商业模式）

    +   2. 对选定的投资项目，公司应从哪里筹措资金以满足投资需求？（资本市场，财务战略）

    +   3. 公司应如何管理日常财务活动？（增长战略，现金流的管理）'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# 1.1 什么是公司金融？


    公司金融强调以下三类问题(CFO的三大财务决策)：


    +   1. 投资、融资和现金管理

    +   2. 公司金融的逻辑：

    +      ① 三类问题共同目标：公司价值最大化

    +      ② 公司金融的基础：公司估值

    +      ③ 公司估值实际上是：公司预测

    +      ④ 公司预测前提：解读公司历史表现（why 投资或产品战略或商业模式；why融资或股利分配策略；how公司增长与公司资金需求匹配、现金流策略）'
  merge: -1
  img_proc: true
