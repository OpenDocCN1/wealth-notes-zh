- pgno: 128
  md: '# 估值方法的选择原则


    原则一：视具体情况而定


    当我们向快速估计目标公司的价值，往往采用相对估值法，选择合适的可比指标对其进行价值评估。当我们想挖掘价值的真正来源，理解关键驱动因素对价值的影响时，更多采用绝对估值法。


    若我们发现对市场价格所隐含的平均估值水平较认可，在此判断目标公司是否便宜时，或以中短期交易为目标时，较适宜采用相对估值。若我们想独立于市场波动，以长期持有目标公司股票，较适宜用绝对估值法。


    若我们考虑停止目标公司的营运，或者完全改变其经营管理时，较适宜用账面价值法、清算价值法或重置成本法'
  merge: -1
  img_proc: true
- pgno: 129
  md: '# 估值方法的选择原则


    +   原则二：视具体行业而定


    +   对大部分收入驱动型行业而言，绝对估值法中的CF(A)折现模型，相对估值法中的市盈率倍数法，EV/EBITDA倍数法比较常用和适宜。


    +   对某些资源行业，比如资源型行业（如房地产，矿产开采等），绝对估值法中经常用NAV方法，相对估值中会使用EV/储量倍数法


    +   对资本严格监管的行业，如银行，绝对估值中的DDM模型使用较多，相对估值中的市净率倍数法使用较多'
  merge: -1
  img_proc: true
