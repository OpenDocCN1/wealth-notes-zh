- pgno: 165
  md: '# 投资回收期法


    +   - 不足

    +     - 忽视了资金的时间价值

    +     - 忽视了回收期后的现金流量

    +     - 对期限较长的项目考虑不全面

    +     - 接受法则不客观

    +     - 按回收期法应接受的项目，不一定具有正的NPV

    +   - 优点：

    +     - 易于理解

    +     - 对流动性考虑比较充分'
  merge: -1
