- pgno: 53
  md: '# 非现金项目


    +   - 折旧是最明显的非现金项目。没有公司会为“折旧”开支票付款。

    +   - 另一种非现金费用是递延税款，从现金流量的角度来看，递延税款不是一笔现金流出。


