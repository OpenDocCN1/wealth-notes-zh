  md: '# 盈亏平衡分析


    +   - 检验我们的预测波动水平的另一种方法是盈亏平衡分析。

    +   - 盈亏平衡分析是一种研究销售量与盈利水平之间关系的普遍工具。

    +   - 常见的盈亏平衡计量指标包括以下三种：

    +     - 会计盈亏平衡点：当净利润 = 0时的销售量水平

    +     - 现金盈亏平衡点：当经营现金流量 = 0时的销售量水平

    +     - 财务盈亏平衡点：当净现值 = 0时的销售量水平'
