- pgno: 202
  md: '# 设定投标价格


    +   - 找到使NPV=0的销售价格

    +   - 步骤1: 在NWC和capital中使用已知的更改来估计“初步”NPV

    +   - 步骤2: 确定NPV=0所需的年度OCF值

    +   - 步骤3: 确定生成OCF所需的NI

    +   - 步骤4: 确定需要什么销售（和价格）来创建所需的NI


    +   - 注意这里的净利润与会计的净利润定义不同（全权益假设）：

    +     - 净利润=(销售-成本-折旧)(1-T)'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 通货膨胀与资本预算


    +   - 通货膨胀是经济生活中不容忽视的重要因素，在资本预算中必须考虑通货膨胀的影响。

    +   - 下列等式考察了利率与通货膨胀的关系，常被称为费雪等式（the Fisher equation）：

    +     (1 + 名义利率) = (1 +实际利率) × (1 + 通货膨胀率)'
  merge: -1
  img_proc: true
- pgno: 204
  md: '# 通货膨胀与资本预算


    +   - 当通货膨胀率较低时，常使用以下这个近似公式：

    +     实际利率 ≒ 名义利率 - 通货膨胀率

    +   - 虽然美国的名义利率是随通货膨胀率而调整的，但实际利率的波动水平一般比名义利率低。

    +   - 在资本预算中，应当按实际利率来折现的实际现金流量与按名义利率贴现的名义现金流量进行比较。'
  merge: -1
  img_proc: true
