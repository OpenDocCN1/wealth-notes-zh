- pgno: 97
  md: '# 杜邦恒等式


    +   - ROE = 净利润 / 总权益

    +   - 分子分母同乘以总资产，可有：

    +     - ROE = (净利润 / 总权益) × (总资产 / 总资产)

    +     - ROE = (净利润 / 总资产) × (总资产 / 总权益) = 资产收益率ROA × 权益乘数

    +   - 分子分母同乘以销售额，可有：

    +     - ROE = (净利润 / 总资产) × (总资产 / 总权益) × (销售额 / 销售额)

    +     - ROE = (净利润 / 销售额) × (销售额 / 总资产) × (总资产 / 总权益)

    +     - ROE = 销售利润率 × 总资产周转率 × 权益乘数'
  merge: -1
  img_proc: true
