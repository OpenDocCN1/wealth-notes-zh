  md: '# 资产负债表分析


    分析资产负债表时，财务管理人员应注意以下几个问题：


    +   1. 流动性

    +   2. 负债与权益

    +   3. 市价与账面价值（历史成本）

    +   4. 净运营资本'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 流动性


    +   - 指在不引起价值大幅损失的情况下，资产变现的方便与快捷程度。

    +   - 流动资产的流动性最强。

    +   - 一些固定资产是无形的。

    +   - 公司资产的流动性越强，对短期债务的清偿能力就越强。

