- pgno: 76
  md: '# 股权自由现金流量


    由自由现金流恒等式：


    +   公司的自由现金流≡流向股东的现金流+流向债权人的现金流


    所以： 股权自由现金流=公司自由现金流-债务自由现金流


    即： CF(S)=CF(A)-CF(B)  又因为：


    +   CF(A)=EBIT+Dep.-当期所得税-CAPEX-ΔNWC

    +   =NI+I+Dep.+递延所得税-CAPEX-ΔNWC


    +   CF(B)= I-债务融资净额DebtIR


    所以： CF(S)=NI+Dep.+递延所得税-CAPEX-ΔNWC+债务融资净额'
  merge: -1
  img_proc: true
- pgno: 77
  md: '# 股权自由现金流与股利、回购


    ▶ 股利：由于 CF(S)=股利+权益融资净额


    所以：股利=CF(S)+权益融资净额


    将 CF(S)=CF(A)-CF(B)


    带入股利公式


    因此：股利=CF(A)-CF(B)+权益融资净额


    =企业自由现金流-流向债权人的现金流+股票融资净额


    =NI+递延所得税+Dep.-CAPEX-ΔNWC-(I-DebtIR)+权益融资净额


    =NI+递延所得税+Dep.-CAPEX-ΔNWC+DebtIR+权益融资净额


    ▶ 回购：由于权益融资净额=新发行股票-回购


    可得：股利=CF(A)-CF(B)+新发行股票-回购


    因此，回购=CF(A)-CF(B)+新发行股票-股利


    =NI+Dep.+递延-CAPEX-ΔNWC+DebtIR+新发行股票-股利


    ![](img/ec4d2623c8fc4762aa4f02df85a4c6f9_77_0.png)'
  merge: -1
  img_proc: true
