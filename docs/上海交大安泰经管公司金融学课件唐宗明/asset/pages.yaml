- pgno: 67
  md: '# 2.4 企业的自由现金流


    +   - 在公司金融学中，能从公司财务报表中得出的最重要项目应当为公司的自由现金流量。

    +   - 会计现金流反应公司经营状况好坏，投资和融资变动状况，自由现金流则反应公司为投资人创造的价值大小；

    +     - 两者角色不同，计算的数据来源和结果也不相同。前者可以从现金流量表上获取，后者需要利用资产负债表和利润表，或现金流量表，计算得到

    +   - 自由现金流，又叫财务现金流或无杠杆现金流，它是扣除了公司持续经营所需要的现金以后，剩下的可以“自由”分配给投资人（股东和债权人）的现金流。计算公式：

    +   自由现金流=经营性现金流-资本支出净额-净营运资本变动'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# 自由现金流量


    在公司金融学中，自由现金流是能从公司财务报表中得出的最重要项目，是公司的真实现金流量


    自由现金流=经营性现金流-资本支出净额-净营运资本变动


    CF(A)=OCF-CAPEX -ΔNWC


    从公式我们可以看到“自由”一词的由来


    +   经营活动的现金流（OCF）=息税前利润（EBIT）+折旧(Dep.)-当期所得税

    +   因为： NI=EBIT-I-当期所得税-递延所得税

    +   所以： OCF=NI+I+Dep.+递延所得税


    +   资本性支出（CAPEX）=固定资产购买-固定资产出售=期末固定资产净值-起初固定资产净值+折旧=期末固定资产总值-起初固定资产总值


    +   净营运资本变动=期末净营运资本-起初净营运资本


    +   因此， CF(A)=NI+I+Dep.+递延所得税-CAPEX-ΔNWC'
  merge: -1
  img_proc: true
- pgno: 69
  md: '# 自由现金流量


    +   - 在公司金融学中，自由现金流是评估公司价值的重要指标之一（DCF模型中的分子）。

    +   - 由于自由现金流由公司的资产产生，公司资产属于公司的投资人，公司的投资人包括债权人和股东。因此，来自公司资产的自由现金流量一定应当等于流向债权人和权益投资者的现金流量：


    CF(A)≡ CF(B) + CF(S)


    +   - CF(B)= 利息-债务融资净额

    +   - CF(S)=股利-权益融资净额


    CF(A)~自由现金流； CF(B) ~支付给债权人的现金流； CF(S)~支付给股东的现金流'
  merge: -1
  img_proc: true
