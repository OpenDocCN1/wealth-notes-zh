- pgno: 193
  md: '# 经营现金流量（OCF）的不同计算方法


    +   - 间接法（Bottom-Up Approach）

    +     - 当引入全权益融资假设（忽略利息）时可以用此法

    +     - OCF = 净利润 + 折旧 = EBIT(1-T) + 折旧


    +   - 直接法（Top-Down Approach）

    +     - OCF = 销售收入 - 付现成本 - 所得税

    +     - 但注意，不能减去非付现项目


    +   - 税盾法（Tax Shield Approach）

    +     - OCF = (销售收入 - 付现成本)(1 - T) + 折旧×T

    +     - = EBIT(1-T) + 折旧


    此处所得税=EBT*T=EBIT*T(全权益融资假设下)'
  merge: -1
  img_proc: true
