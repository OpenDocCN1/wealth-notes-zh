- pgno: 124
  md: '# 折现自由现金流法


    （注意这里的CF(A）与前面定义的CF(A）有细微的差别）


    +   - 企业价值 = 未来自由现金流的现值 + 终端价值的现值。

    +   - a) 估算最初可以准确预测的年份（比如5年）的现金流并计算出现值。

    +   - b) 估算终端价值的现值。

    +     - i. 如果在5年终结时现金流预期不会再增长，从第6年开始之后的终端价值的现值 = C5/r，其中r是必要回报率。

    +     - ii. 如果在5年终结时现金流预期会继续在可预见的将来一段时间里按g比率增长，终端价值的现值 = C5(1+g)/(r-g)。

    +     - iii. 终端价值的现值 = (C5/r)/(1+r)^5，或终端价值的现值 = [C5(1+g)/(r-g)]/(1+r)^5。


    而


    +   - 权益的价值 = 企业价值 - 现有负债


    企业未来的自由现金流=EBIT-税收+折旧和摊销-净运营资本增加-资本支出净额

    =EBIT(1-税率）+折旧和摊销-净运营资本增加-资本支出净额

    NOPAT：税后净营业利润=营业利润（1-所得税率）'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 折现（自由）现金流法要点：


    +   1. 预计财务报表估计自由现金流

    +   2. 确定权益成本、债务成本和最优资本结构，估算资本成本----WACC

    +   3. 将公司存续期分为可明确预计的3~8年和永续发展的时期

    +   4. 折现不同阶段的自由现金流，并计算其现值，得到公司投资者的价值。用公司投资者的价值减去债务的内涵价值得到权益的内涵价值。


    严格说，上述评估得到的是内涵价值，它是公司市值的基础'
  merge: -1
  img_proc: true
- pgno: 126
  md: '例：假设某公司的未来现金流和终值如下表，现金流每年年末产生，折现率为9.3%。预测期为5年，第5年底的终值为6274百万元。


    | 时间 | 1 | 2 | 3 | 4 | 5 |

    |---|---:|---:|---:|---:|---:|

    | 现金流 | 180 | 200 | 224 | 264 | 317 |

    | 终值 |  |  |  |  | 6274 |


    使用两阶段模型：


    $$V=\sum_{t=1}^{5}\frac{CF_t}{1.093^t}+\frac{TV}{1.093^5}$$


    $$=891.84+4022.02=4913.86$$'
  merge: -1
