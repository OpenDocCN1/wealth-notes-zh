- pgno: 167
  md: '# 盈 利 指 数 法（PI）


    $$PI=\frac{\text{初始投资所带来的后续现金流量的现值}}{\text{初始投资}}$$


    +   - 最低接受法则：

    +     - 如果 PI > 1，则可接受项目


    +   - 排序法则：

    +     - 选择 PI 最高的项目'
  merge: -1
  img_proc: true
