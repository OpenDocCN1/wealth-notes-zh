- pgno: 166
  md: '# 折现回收期法


    +   - 考虑了时间价值后，需要多长时间才能“收回”项目的初始投资？

    +   - 决策法则：如果折现后的回收期在许可范围内，则接受项目

    +   - 不过，如果你能计算出折现的现金流量，计算NPV也就很容易了。'
  merge: -1
