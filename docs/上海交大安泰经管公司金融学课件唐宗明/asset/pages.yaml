- pgno: 222
  md: '# 实物期权


    +   - 选择权是有价值的，这是现在财务理论的基本观点之一。

    +   - “我们已别无选择”这种说法显然是身陷麻烦的信号。

    +   - 由于公司是在动态环境中进行决策的，因此在项目估价中，不应忽视它们所可能具有的选择权价值。'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# 实物期权的种类


    +   - **拓展期权**

    +     - 拓展期权是指当条件有利时允许公司扩大生产，当条件不利时则允许公司紧缩生产。当经济前景发展势头强劲时，拓展期权是重要的期权之一。

    +     - 如果需求增长超过了预期，拓展期权将显现价值。

    +   - **放弃期权**

    +     - 放弃期权是指在实行某个项目后又放弃该项目。这可能涉及到出售该项目的资产或把这些资产重新组合到其他领域。当特殊项目的资产在外部市场上出售时，该项目的市场价值就是放弃期权的价值。

    +     - 如果未来需求低于预期，放弃期权将显现价值。

    +   - **择机期权**

    +     - 择机期权是指不必立即实行某项目，通过等待，公司能够获取关于市场、价格、成本和其他一些方面的新信息，因此存在等待接受新信息的期权。

    +     - 如果潜在的变量正在朝着向好的趋势发展，择机期权将显现价值。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 实物期权的价值


    +   某项目的市场价值（M）可用其不考虑期权选择时的NPV与该项目所隐含期权的价值（Opt）之和来表示：


    $$M = NPV + Opt$$


    例如，比较一种专用设备和一台多功能设备，假定它们的取得成本和可使用年限都相差不大，但多功能设备将由于具有多种选择权而更加具有价值。'
  merge: -1
  img_proc: true
