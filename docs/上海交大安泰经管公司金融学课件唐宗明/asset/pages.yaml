- pgno: 149
  md: '# 内部收益率法


    +   - 内部收益率，简称IRR，是使NPV等于零时的贴现率

    +   - 最低接受法则：

    +     - 如果IRR超过必要报酬率，则接受项目

    +   - 排序法则：

    +     - 选择IRR最高的项目进行投资

    +   - IRR法的隐含假定——再投资假定：

    +     - 假定所有未来现金流量用做再投资的收益率也为IRR'
  merge: -1
  img_proc: true
- pgno: 150
  md: '# IRR: 例


    考察下面这个项目：


    ![](img/ec4d2623c8fc4762aa4f02df85a4c6f9_150_0.png)


    NPV = 0 = -200 + $50/(1+IRR) + $100/(1+IRR)^2 + $150/(1+IRR)^3


