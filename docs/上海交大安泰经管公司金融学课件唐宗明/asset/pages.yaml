  md: '# 公认会计准则（GAAP）


    +   - 按公认会计准则中的配比原则要求，收入应与费用相配比。

    +   - 因此，在收入发生或应计的时候，即使没有相应的现金流量配合，也要在利润表上报告。


    后果：利润与现金流不一致。'
