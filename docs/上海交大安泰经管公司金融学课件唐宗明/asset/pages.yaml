- pgno: 175
  md: '# 小结 - 投资决策的DCF方法


    +   - 净现值

    +     - 是市价与成本之差额

    +     - 如果NPV为正，则接受项目

    +     - 如果用于决策，通常不会有严重问题

    +     - 是一个比较好的决策标准

    +   - 内部收益率

    +     - 是使NPV为零时的折现率

    +     - 如果IRR大于必要报酬率，则可接受项目

    +     - 如果现金流量为常规的，则决策选择与NPV是一样的

    +     - 当用于非常规现金流量项目或互斥项目的决策时，IRR可能不太可靠

    +   - 盈利指数

    +     - 是收益一成本之比

    +     - 如果PI > 1，则可接受项目

    +     - 不能用作对互斥项目进行排序

    +     - 如果存在资本限额，则可用作对项目进行排序'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# 小结 - 投资决策的回收期标准


    +   - 回收期

    +     - 能收回初始投资额的时间长度

    +     - 如果回收期在特定时期范围以内，则可接受项目

    +     - 不考虑资金的时间价值，比较标准主观

    +   - 折现的回收期

    +     - 考虑了资金时间价值后，能收回初始投资额的时间长度

    +     - 如果折现的回收期能在某个特定时期范围以内，则可接受项目

    +     - 比较标准主观'
  merge: -1
  img_proc: true
