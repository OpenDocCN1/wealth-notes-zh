- pgno: 131
  md: '# 自由现金流量特别说明


    在公司金融学教科书中，自由现金流是能从公司财务报表中得出的最重要项目，是公司的真实现金流量


    自由现金流=经营性现金流-资本支出净额-净营运资本变动


    CF(A)=OCF-CAPEX -ΔNWC


    =息税前利润（EBIT）+折旧(Dep.)-当期所得税-CAPEX- ΔNWC


    估值实践中：


    CF(A)=EBIT(1-t)+折旧-CAPEX - ΔNWC+其他杂项'
  merge: -1
