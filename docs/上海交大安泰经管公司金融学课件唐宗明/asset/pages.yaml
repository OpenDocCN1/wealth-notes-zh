- pgno: 163
  md: '# NPV与IRR比较


    +   - 通常情况下，NPV 与 IRR 的选择是一致的

    +   - 但下述情况下例外：

    +     - 非常规现金流量时——指现金流量符号变动超过1次

    +     - 互斥项目时

    +       - 如果初始投资额相差巨大

    +       - 如果现金流量的时间序列分布相差巨大

    +   - NPV和IRR的再投资假设

    +     - 区分投资者要求的回报率和再投资回报率

    +     - EX. MIRR'
  merge: -1
  img_proc: true
- pgno: 164
  md: '# 投资回收期法


    +   - 项目需要多长时间才能 “收回” 它的初始投资？

    +   - 回收期 = 收回初始投资的年数

    +   - 可低可接受法则：

    +     - 由管理层制定

    +   - 排序法则：

    +     - 由管理层制定'
