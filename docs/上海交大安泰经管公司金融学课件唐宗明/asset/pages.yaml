- pgno: 144
  md: '# 现值与净现值


    +   - 是两种价值评估方法

    +     - 现值衡量的是价值总量（所有自由现金流的现值）

    +     - 净现值衡量的是价值增值（流入超过流出的现金流的现值）

    +   - 都需要依据现金流的不确定性确定折现率

    +     - 不确定性与折现率成正比

    +     - 折现率：机会成本（放弃的收益率或实际借贷成本）

    +   - 都需要确定现金流的时期'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# 为什么要使用净现值


    接受NPV为正的项目将使股东受益


    +   ✓ NPV 考察的是现金流量

    +   ✓ NPV 考虑了项目的所有现金流量

    +   ✓ NPV 对现金流量进行了合理的折现


    EX. 考虑Alpha公司管理层的两种策略(投资者要求回报率6%):


    +   1. 用现金100美元投资项目，一年后获得107美元支付股利

    +   2. 把100美元当做当期股利支付股东,放弃投资项目


    假设公司今天有生产性资源价值V美元，并且拥有100美元现金


    接受该投资项目公司今天价值：V+107/1.06=V+100.94


    放弃次投资项目公司今天价值：V+100


    接受该投资项目股东的价值增加0.94美元


    投资项目对公司价值（股价）的影响表现为净现值的影响'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# 净现值 (NPV)准则


    +   - 净现值 (NPV) =

    +     未来现金流量的现值合计 - 初始投资额

    +   - 估算NPV:

    +     1. 估算未来现金流量：金额大小和发生时间

    +     2. 估算折现率

    +     3. 估算初始投资额

    +   - 最低可接受法则为：如果 NPV > 0，则接受项目

    +   - 排序法则：选择NPV最高的项目'
