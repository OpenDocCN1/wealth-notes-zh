- pgno: 25
  md: '# 管理层目标


    +   - 管理层目标与股东的目标可能会不一致

    +   - 管理层

    +     - 更高的薪酬

    +     - 更好的工作前景

    +     - 独立性

    +   - 股东

    +     - 更多的收入，更少的成本，等多的利润

    +   - 他们目标的差异可能引发管理层与股东的利益冲突'
  merge: -1
  img_proc: true
