- pgno: 239
  md: '# 是否应当进行试制的决策


    +   现在让我们回到第一阶段，决策问题很清楚：应当投资吗？


    +   在时刻1时的估计所得为：


    预计可得 = (成功概率 × 成功时的预期可得) + (失败概率 × 失败时的所得)


    预计可得 = (.60 × $3,433.75) + (.40 × $0) = $2,060.25


    时刻0时的NPV为：


    NPV = -$1,000 + $2,060.25 / 1.10 = $872.95


    因此，应当进行试制。'
  merge: -1
  img_proc: true
