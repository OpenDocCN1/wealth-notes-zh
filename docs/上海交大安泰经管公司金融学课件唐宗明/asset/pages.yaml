- pgno: 101
  md: '# 3.2 财务计划（what?）


    +   - 财务计划：将企业未来各项决策（投资、融资和股利方面等）通过财务报表进行预计，建立预测财务报表，又称备考财务报表（Pro Forma financial
    statements）。

    +   - 预测财务报表很重要'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# 财务计划(why?)


    Why 财务计划？企业销售增长需要相应的资产增长。由此引发如下决策：


    +   - 投资的新资产——资本预算决策

    +   - 流动性要求——营运资本政策决定

    +   - 公司融资——资本结构决策

    +   - 支付给股东的现金——股利政策决定

    +   - 以上决策都将通过财务报表反应出来


    > 备考财务报表：融资决策和估值决策都需要它；这样可以在实际行动前进行规划，避免财务困境和失败，为企业建立变革和增长的指南'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 财务计划(how?)


    通常，我们的分析从预计利润表（Pro Forma income statement）开始。Why?


    +   先预计利润表：因为利润表是流量报表，它反应当年的经营活动及收益情况


    +   再预计资产负债表和现金流量表：当年经营活动及收益变动，资产负债表的相关项目也会标动。现金流量表可以预计现金变动。'
  merge: -1
  img_proc: true
- pgno: 104
  md: '# 财务计划的组成要素


    +   - 销售预测——很多现金流量直接由销售水平的高低决定（通常以预计销售增长率为准）。

    +   - 编制预计财务报表——以一致性和利于解释为原则，编制预计财务报表。

    +   - 资产需求——为实现预计销售目标而需要的新增资产。

    +   - 财务需求——为满足新增资产需求，需要筹集的资金额。

    +   - 可调变量——由管理层考虑应使用什么样的筹资方式来决定（使资产负债表能达到平衡）。

    +   - 经济假定——关于未来经济环境的明确假定。'
  merge: -1
  img_proc: true
- pgno: 105
  md: "# 如何预测利润表？销售百分比法\n\n+   1. 假设销售增长率，预计销售收入\n+      然后依据销售百分比法预计利润表中的大部分项目\n\
    +   \n+   2. 预计利润表上的第二个项目：销售成本\n+      考虑历史上该项目占销售的百分比和享受的折扣，比如及时付款可以享受折扣是2%，则该比率为历史占比乘以98%\n\
    +   \n+   3. 预计利润表上的费用项目：EX. 使用历史占比\n+   \n+   4. 预计利润表上的利息：该项目要考虑资产负债表上的负债全额，与销售增长率无关，可以一开始采用最近一年的，后面再迭代\n\
    +   \n+   5. 税收费按照税前利润的历史百分比"
  merge: -1
  img_proc: true
- pgno: 106
  md: '# 如何预测资产负债表？销售百分比方法


    +   - 资产项目

    +     - 大多数资产项目可以采用销售百分比方法

    +   - 第一个项目：现金先假设不变

    +   - 第二个项目：应收账款,销售百分比（假设应收账款政策不变）

    +   - 第三个项目：存货,销售百分比

    +   - 第四个项目：固定资产，一般随销售而增长，但非同比增长，可以酌情考虑'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# 如何预测资产负债表？销售百分比方法


    +   - 负债和权益项目

    +   - 第一个项目：银行贷款，插入项目，先留着回头处理

    +   - 第二个项目：长期负债，包括当期到期计入流动负债（按合约约定每年还款额），以及一年以后归还（总的减去当期归还的）计入长期负债

    +   - 第三个项目：应付账款，通常也随销售变动而变动，考虑付款周期

    +   - 第四个项目：预提费用，量少的话可以假设不变。

    +   - 第五个项目：实收资本和留存收益、

    +   - 插入项目：最常见的是现金和负债

    +   - 以上，完成第一次试算'
  merge: -1
  img_proc: true
