  md: '# 1.1 什么是公司金融？


    一个简单的描述：


    +   - 创办一家生产网球的公司

    +     - 需要购买原材料，招募管理人员和生产工人

    +     - 也就是需要投资于存货、机器、土地和劳动力

    +     - 需要筹集相应的资金

    +   - 一切就绪开始销售网球

    +     - 有销售收入

