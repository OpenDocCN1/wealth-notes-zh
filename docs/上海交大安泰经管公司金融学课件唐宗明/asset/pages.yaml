- pgno: 19
  md: '# 股东财富的衡量：公司价值


    从概念上讲，一家公司的价值等于该企业的现金流的现值。但最棘手的是如何确定现金流的大小、现金流持续的时间和现金流的风险。


    $$Value=\sum_{t=0}^{N}\frac{CF_t}{(1+r)^t}$$'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 注意公式中：


    Value = Σ_{t=0}^{N} CF_t / (1 + r)^t


    +   - CF为公司自由现金流

    +   - 折现率即资本成本；由现金流承载的风险因素决定

    +   - 分子和分母具有一致性'
  merge: -1
  img_proc: true
