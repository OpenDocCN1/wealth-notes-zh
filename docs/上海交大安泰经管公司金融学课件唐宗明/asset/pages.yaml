- pgno: 23
  md: '# 公司与合伙企业的比较


    |  | 公司 | 合伙企业 |

    |---|---|---|

    | 流动性 | 股份转让容易 | 交易数量受很大限制 |

    | 选举投票权 | 通常按股份享有投票权 | 有限合伙人可能会拥有一些投票权,但一般合伙人完全控制和管理企业 |

    | 税 | 双重征税 | 由合伙人根据收益缴税 |

    | 再投资与股利支付 | 在股利支付方面有很大选择余地 | 通常所有的现金净盈余都分配给合伙人 |

    | 负债 | 有限责任 | 一般合伙人通常承担无限责任，有限合伙人只承担有限责任 |

    | 持续性 | 可无限存续 | 存续期通常有限 |'
  merge: -1
  img_proc: true
