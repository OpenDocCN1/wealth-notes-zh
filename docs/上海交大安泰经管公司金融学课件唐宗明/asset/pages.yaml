- pgno: 178
  md: '# 资本预算中的增量现金流量


    +   - 现金流量，而非会计利润

    +   - 不应考虑沉没成本

    +   - 考虑增量现金流量

    +   - 考虑机会成本

    +   - 考虑副效应，例如协同效应与侵蚀效应

    +   - 考虑税的影响：应关注的是增量税后现金流量

    +   - 考虑通货膨胀的影响'
  merge: -1
  img_proc: true
- pgno: 179
  md: '# 现金流量—而非会计利润


    +   ► 公司金融考虑现金流，会计强调收入和利润

    +   ► 考虑一个项目时，我们对项目的现金流进行折现（第5/6章）

    +   ► 评价一个公司时，我们对股利而不是利润进行折现。股利是投资者收到的现金流（第9章）'
  merge: -1
  img_proc: true
- pgno: 180
  md: '# 项目的现金流量：增量自由现金流


    +   - 相关现金流

    +   - 沉没成本是不相关的。

    +     - “我们已经......”并不是继续往坏项目上投钱的理由。

    +   - 机会成本是相关的！如果一个项目的NPV为正，并不意味着我们就应当自动接受它。特别地，如果将资金用于另一个项目还可能带来更高的NPV，我们显然就不应继续这个项目。'
  merge: -1
  img_proc: true
- pgno: 181
  md: '# 增量自由现金流量


    # 副作用的影响


    +   - 侵蚀是件“坏”事。如果新产品会导致客户减少对现有产品的消费，我们必须考虑到它的影响。


    +   - 不过，也可能会有协同效应产生。例如，新产品的上市使得原有产品的需求也增加。决策时也必须考虑到这种影响的存在。'
  merge: -1
  img_proc: true
- pgno: 182
  md: '# 资本预算中的增量自由现金流


    包括三个部分：同CF（A）


    +   - 经营活动的现金流量

    +     - 经营活动现金流量（OCF） = EBIT - 税 + 折旧

    +       （忽略递延税和摊销）


    +   - 净资本投资（资本性支出）

    +     - 别忘记还有残值（当然，应当是税后残值）


    +   - 净营运资本变动

    +     - 当项目终结后，我们通常能收回净营运资本'
  merge: -1
  img_proc: true
- pgno: 183
  md: '# 利息费用的特别说明


    +   - 尽管许多项目至少部分依赖债务融资。但由于项目的现金流考虑的是全部投资者的现金流，所以，不扣除利息。

    +     （这种现金流又叫全权益融资假设下的项目自由现金流）

    +   - 债务融资的影响将体现在折现率的调整上。'
  merge: -1
  img_proc: true
