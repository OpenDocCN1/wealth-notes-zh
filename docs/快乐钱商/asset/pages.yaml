  md: '樣改變，各種問題都會消失無蹤。


    他們對幸福有獨特的想法，錢無法對他們顧指氣使、隨心所欲操縱他們。他們按照自己的心意使用金錢，最重要的是，他們不畏懼金錢。


    誰會畏懼金錢？


    畏懼金錢的人，其實比你想的多很多。


    # 是愛還是恐懼——你與金錢的關係


    我曾經翻譯過傑瑞·詹保斯醫師（Gerald G. Lampolsky）的一本暢銷書，書名是《心態療癒經典：十二天，轉化自我、走向愛》（Love Is Letting
    Go of Fear）。那本書主張溝通有兩種：愛與恐懼。


    面對金錢的方式也有兩種：你對金錢的愛，或是對金錢的恐懼。你在賺錢、花錢的時候，其中就有愛或恐懼。


    舉例來說，我們經常會擔心錢，擔心發生什麼萬一的時候，手頭上的錢如果不夠的話……。


    錢如果用完了，該怎麼辦？別人的錢比自己多，該怎麼辦？'
  merge: -1
  img_proc: true
- pgno: 87
  md: '果別人賺得比較多，自己可以賺到的錢會不會變少了？萬一失業，若真的發生，該怎麼支付各種帳單呢？


    就連在用錢的時候，都有恐懼。


    如果隨便魯莽花錢，錢會不會很快就不夠了呢？


    所以，在花錢的時候，又會感覺到壓力。買下去不會錯吧？要是被騙了該怎麼辦？買了多餘的東西，如果馬上就膩了呢？買了這個，後來想買別的，錢會不會不夠？


    多數人在作出決斷時，都沒有發現已經混入了這樣的恐懼。確實，這些都是無可避免的，在這樣的恐懼中也是有道理的，是有應該恐懼的理由。


    恐懼與生存本能有關。在金錢上，如果做出什麼無可挽回的事情，可能就會連住的地方、食物、衣服都會無法取得。有人生來就比他人對恐懼更加敏感，也有人因為與金錢的關係是負面的，或是受到早有根深蒂固的恐懼感的雙親或親戚的影響，而漸漸開始懷有恐懼心。但是，也有人完全沒有恐懼，一點都不會去想錢沒有了的事。'
  merge: -1
