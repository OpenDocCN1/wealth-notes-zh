  md: '# 前言


    # Happy Money & Unhappy Money


    錢有兩種，一種是 Happy Money，另一種是 Unhappy Money。Happy Money 就像是十歲的小男孩在母親節那天想買花送給媽媽的錢。為了讓孩子學踢足球或學彈鋼琴，父母親勤懇存下來的錢也是
    Happy Money。普通的錢變成 Happy Money 的例子數不勝數，包括：


    +   • 用金錢援助在經濟上困苦的家庭。

    • 小額捐款給遭受颱風或地震侵害的災民。

    • 義賣餅乾捐款給慈善機構，幫助無家可歸的人。

    • 投資對社會有幫助的企業或社會事業。

    • 從感覺满意的客戶手中收取費用。

    • 伴隨著愛或體貼、友誼而流通的金錢，每一分錢都是 Happy Money。這種金'
