- pgno: 88
  md: '我們從小的時候開始，就被教導要「正確使用」金錢，也不知道父母是以什麼標準來認定「正確」，就只是一個勁兒這麼強調。錢要花在什麼東西上、為什麼會不夠、要如何不隨便亂花錢等，在金錢方面應該都曾被這樣告誡過吧。當我們長大成人之後，仍然抱持著這樣的恐懼，在對這些東西渾然不覺的情況下，或是對自己如何懷著恐懼使用金錢完全沒有自覺。


    令人遺憾的是，我們現在的經濟體系，已是以恐懼為基礎。那是因為我們的社會是以恐懼為根基形成的，在教育體系或職場，說不定就連家庭生活中也是。


    我們要是做錯了事，會很害怕被責備。我們害怕別人擁有自己沒有的東西，所以欲望變得愈來愈重。很想要有錢，或是害怕不足，於是拿著不合乎自己身份的東西，以不適合自己的方式使用。害怕自己的孩子落後、怕被別人占了優勢，就讓孩子去上昂貴的私立學校，一邊抱怨著要繳稅給公立學校用。


    因為害怕孩子變成品行不良，必須嚴厲斥責孩子，或是害怕孩子做出讓你丟臉的事，於是壓抑孩子。


    有這麼多人對金錢抱持恐懼，在某種意義上來說，就表示這很正常吧，因為'
  merge: -1
  img_proc: true
- pgno: 89
  md: '這是很自然的情緒反應。如果你用心傾聽自己的心聲，就應該會明白，在家庭、職場、社區等，無論在哪裡，你的很多行為背後就是恐懼。


    # 如何與金錢建立有愛的正向關係？


    恐懼的相反就是愛，懷抱著愛，就是不可怕什麼會傷害自己、什麼會離自己遠去。懷抱著愛，不論你愛誰，你必須相信那個人會陪在你的身邊。幾乎所有父母都說愛自己的孩子，但是這份愛有時也會以恐懼的形式表現。


    因為擔心，當孩子想要嘗試一些新鮮事物時，誤以為阻止就是愛。因為擔心錢，於是沒辦法默不作聲看著孩子在職業或人際關係上放手一搏。恐懼，無論從任何一個角度來看，怎麼聽、怎麼想，都像一道枷鎖。


    相對來說，愛可說是正好相反。愛就是「無條件接受對方」，相信一切都會順利，但也不是盲目相信，而是就算現在想做的事情進行得不順利，也相信一定能夠找到幸福」。


    有了這樣的愛，感覺就像解放了自己似的。'
  merge: -1
  img_proc: true
- pgno: 90
  md: '# Happy Money 禪心


    就像「存在此時此刻」的感覺，沒有對過去的憤怒，也沒有對未來的不安。此時此刻身在此處就非常幸福，自在得不得了，由衷感謝自己擁有的一切。有感謝的地方，就會產生喜悅與幹勁，這份喜悅與幹勁就會帶給你幸福。


    和金錢建立既不擔心也無壓力的關係，是一種什麼樣的感覺呢？我想，大多數的人都想像不出來。


    請你這樣思考：「與金錢一起過著平靜安穩的生活是可能的。」帶著對金錢的「愛」生活的人們，做著自己喜愛的工作，同時也賺取充足的金錢。事實上，他們經常掛在嘴邊的，就是「已經夠了」或「需要的東西全都有了」。他們可能不是什麼有錢人，但是真正需要的東西全都擁有了。他們把自己愛的放在人生的正中央，由於經濟上很滿足了，所以在日常生活中，就不會感覺到金錢壓力。


    就算去餐廳吃飯或到商店買東西，他們都不是以價格、而是以自己的喜好'
