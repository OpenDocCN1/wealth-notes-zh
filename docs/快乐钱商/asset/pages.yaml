  md: '© 更懂得對人表達感謝，因此你會發現自己比過去更常說「謝謝」。而且，你的感謝會傳染，讓身旁的人也充滿了積極向前的能量。結果就是其他人也開始經常表達感謝，人生開始接受更大的富足。


    # # 開花爺爺 竹田和平


    一九三三年，竹田和平在名古屋出生。竹田家在當地經營一家糕餅商店，從小父親就教他怎麼製作糕餅零食，後來他開始經營家業。他進一步推廣自己獨創的事業，在日本首次推出奶油夾心威化餅，獲得了很大的成功。在零食製品界成功之後，他成功投資不動產與股票，成為以「日本巴菲特」聞名的富翁。


    竹田先生決定將時間投注在培養有品德的創投經營者，稱呼自己為「開花爺爺」。他透過自己不斷獲得驚人成功的職業生涯，將他的真哲學學教給成千上萬的人，使他們帶著更寬大的心胸，感謝人生中進進出出的金流。


    竹田先生相信，掌握幸福與繁榮的關鍵，就在溫柔、寬容與感謝。從神道教的教誨得到啟示的他，研究如何才能為人生招來幸運，發現感覺自己幸福的人，'
  merge: -1
  img_proc: true
- pgno: 132
  md: '都是永遠對當下很滿足的人。他總是在思考，如何才能使他人豐足。精神上的充實與感謝，就是他的真心哲學的本質。


    # 你的金錢信念體系是如何建立的？


    教我金錢哲學的是竹田先生，但我也從我父親身上學到有益、有意義的金錢觀念。父親告訴我，成功的人有成功的理由，不成功的人也有無法成功的理由，只要注意觀察就會知道。成功的人持續成功，然後不斷累積，不成功的人就會不斷遇到一些奇妙的倒霉事件或災難。日文有句話是「誕生在貧窮星之下」，很多人都相信會變窮是命運，但是父親告訴我，還有比這個更重要的因素。


    你對工作和金錢的想法，決定了你是否能夠成為有錢人。


    如果你對工作或金錢的態度不對的話，人生也會出錯。


    你對金錢的計畫充滿了幸福與喜悅，幫助他人、產生成果，那麼你就會變成有錢人。相反的，如果充滿了怒氣、憎恨、討厭的回憶或過度強烈的競爭心理，那麼你的人生也會充滿同樣的東西。'
  merge: -1
  img_proc: true
- pgno: 133
  md: '人都會想用某種特定的方法獲取金錢，擁有某種金錢慣性。如果是上班族被解雇了，就會去找其他工作，到不同公司開始上班。為了賺錢，只會想到必須找到新工作去上班。


    如果是經營者的話，並不會因為事業失敗了，就變成到其他人手下工作，應該會設法開始新事業、再度挑戰吧。但是，他們或許不會想到投資股市。


    投資者不會想在其他人底下工作，或是經營公司，會去尋找各種有利的投資標的。


    可悲的是，完全不工作或不懂得使用金錢的人，未來也很容易會一直都不去工作或不懂得善用金錢的方法吧。人們擁有自己的金錢慣性，會按照自己學到的事物，或是得到的知識採取行動。


    我父親說，任何人都應該學習了解自已對金錢的情感。富裕的人想到金錢的事、接觸到金錢就會感覺幸福，這麼做令他們實際感受到喜悅。另一方面，沒有錢的人一想到錢或談到錢，就會傳達不安或感覺恐懼，困惑便由此而生。'
  merge: -1
  img_proc: true
- pgno: 134
  md: '# 重新規劃你的金錢設計圖


    我在二十歲的時候，就決定在三十歲之前要經濟獨立，於是便開始尋找幸福與成功的關鍵之鑰。


    我曾經聽過一句古老格言：「在二十歲賺來的錢，到了三十歲會全部散去。」樂觀主義的我並不相信，但是有錢人說的話確實對了，我在二十五歲之前不斷增加財產，又失去財產。


    不過，我並沒有更拚命賺錢，為了打破過去的模式，我開始思考問題的原因，一定要解決才可以。跟別人用同一種規則戰鬥，是沒有意義的。我發現，解決問題的關鍵，就是知道自己是人生的金錢設計圖是怎麼寫的，然後把扯後腿的那個部分重新改寫。


    大部分的人都已經過了重新檢視金錢設計圖的時期。我在前文提過，小時候學到的事情會帶給我們很大的影響，但並非不能改變。


    與金錢有關的人生設計，必須定期重新檢視，更新到最新的版本。因為受到'
  merge: -1
  img_proc: true
- pgno: 135
  md: '你的父母影響，恐怕你的金錢設計圖，在你仍是小孩的一九七○年代、一九八○年代、一九九○年代或二○○○年代就已經畫好了。


    甚至你父母的金錢人生，很可能也是受到你祖父母很大的影響。如果你的祖父母是在一九三○年代度過孩提時代的話，他們的金錢設計圖因為遭受大蕭條持續苦難時代衝擊影響，充滿了恐懼與不安，這是無可奈何的事。這個影響經過好幾個世代傳承下來，至今仍繼續默默影響著你。


    你的祖父母應該會救你的父母，如果不慎重處理金錢、胡亂揮霍，以後將會遭受嚴重的後果。他們或許還曾經說過，如果不想害怕失去工作，就一毛也別亂花，要好好把錢抓牢。


    把金錢當成安心源頭的想法，是大家都找不到工作、人人帶著不安的一九三○年代的想法。年幼時感受到的不安沒有消失，並且讓孩子們繼續傳承，透過這些孩子又養育出我們。


    很多人的金錢設計圖的問題，出在數十年前就已經寫好了，平常暗藏在內心深處，只有感覺不安與恐懼時才會出現。金錢設計圖在你心裡的烙印，在你的'
  merge: -1
  img_proc: true
- pgno: 136
  md: '生要做重大決定時就會出現。比方說，結婚或換工作的時候，在你沒有察覺的時候，以不安或恐懼的姿態出現。


    然而，金錢設計圖不過是幅假想圖，是可以重新規劃的。什麼都還沒有建造好，鋼筋還沒焊接，水泥地基也還沒打好，對你來說，還有充分的時間可以重新規劃，建立一個建構確實的未來金錢計畫。


    # 找出適合你的金錢器皿大小


    當你逐漸了解了自己對金錢的情感，對金錢的信念變得更加明確時，也能夠嘗試治癒你過去與金錢的關係，接下來就該好好思考你與金錢的未來了。


    在我們的心裡，有幾個隱喻意義的器皿——富足、金錢、幸福、人際關係、工作等各種器皿，每個都像沒有蓋子的瓶子一樣。如果器皿只裝了一半，我們往裡會覺得不滿。如果進來的量比器皿還多、滿出來了，我們也只能接受適合自己的分量，目標是擁有像竹田先生那樣的想法：「我擁有的已經足夠。我感謝自己擁有的一切。不久後，我就可以給別人一些。」'
  merge: -1
  img_proc: true
- pgno: 137
  md: '找出對你而言正確的器皿大小是很重要的。有些人明明擁有的器皿很小，卻硬是把錢抓得死死的，還有些人的器皿已經破掉、有裂痕了。


    有幾個方法可以測量自己的金錢器皿大小。例如，你對自己的年收入一千万日圓覺得不滿，但如果一年想賺一千五百萬日圓會很辛苦，在這種情況下，適合你的正確器皿大小就是一千萬日圓到一千五百万日圓之間。*


    或者，你的年收入是五百萬日圓，但你總覺得人生很無趣，那可能就是你明明擁有更大的器皿，卻沒有完全填滿。如果你很幸運，是擁有與生俱來的金錢才能的人，請一定要努力，繼續往更高的目標前進。如果你不是這樣的人，那比較聰明的做法就是，找出你能感覺到最幸福的上限在哪裡。


    這就是了解「正確的金钱器皿大小」的意義。如果你一心想裝入超過容量的錢，好一點的情況是器皿破掉，這個過程只是使自己悲慘而已。但大多數的人通常想要更多，而這會讓我們內心失去平靜。'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 一直想要更多，你的心就不得休息


    與金錢建立健全的關係，能為你帶來深度的安寧。很多人以為，一旦變成有錢人就會得到幸福，就可以解決所有問題與煩惱。


    實際上，卻是完全相反。錢賺得愈多，工作規模就會變得愈大，生意也會成長。企業愈大，各種經費與人事費用就越發膨脹，很難用和過去一樣的勞力和成本維持營運，隨著公司成長所產生的問題與精神壓力也會增加。


    很多日本人認為，只要每個月的收入有兩百萬日圓，就可以過著輕鬆、富裕的生活了──這個金額或許還太過充足了。然而，收入真的增加之後，自己的心情就會從有餘力購買那些東西，變成想要更大的房子、更好的車子，其他配合生活方式提升的各種開銷也會增加。


    而且，你會跟收入水準差不多人成為朋友，往來的對象會改變。當年在


    *一千萬日圓約為一八○萬新台幣，一千五百萬日圓約為三九○萬新台幣，以一日圓兑○．二六新台幣計算。'
  merge: -1
  img_proc: true
- pgno: 139
  md: '學時代肚子空空曾經很喜歡去定食屋吃飯，就變成對對方失禮而不能去了，會改去更高級的餐廳。


    最後，開銷跟著收入增加而增加，每到月底幾乎所剩無幾，最後還是感覺到錢不夠花的精神壓力。


    明明有那麼多的收入，錢卻不夠用，誰能夠想得得到呢？


    這一點，就算你的月收入變成三百萬日圓也是一樣的，只要你想要的更多。


    不論你是哪個階層的有錢人，身邊永遠都會有賺得比你多、生活過得比你更寬裕的人。只要你在梯子上繼續往上爬，總有一天你會遇到說這種話的朋友：「這個週末我要帶家人搭私人噴射機去夏威夷。我想在那裡蓋棟別墅。」「


    你的朋友圈必然會把你的生活水準持續往上抬，因為人本能會去找自己的居所，會跟身邊的人愈來愈像。在都市生活的人，都知道走路到車站、擠電車通勤的辛苦。當你有了餘力，就會開始搭計程車上班，純粹是因为在金錢上沒有太困難了，也會開始去一些更時髦的餐廳吃飯。


    結果，薪水明明就比剛開始工作時多了好幾倍，但是到了月底的餘額還是沒'
  merge: -1
  img_proc: true
- pgno: 140
  md: '變，這是因為你的開銷增加了！


    也就是說，不是你每个月的薪水有三百萬日圓，就能保證經濟自由，因為你的「玩具」也愈變愈貴了。


    「人生有高低起伏」，切莫忘記這項忠告。順風順水的時候，往往很容易忘記，你的收入有時也會有減少的時候。很多成功時日尚淺的人，往往都會想得太樂觀，就算風向改變了，也不大能夠及時適應。


    事實上，就算收入或資產增加得再多，也沒有能夠完全放手悠閒的時間。即使在銀行擁有某個程度的存款，也會有必須改變事業方向、訴訟、員工糾紛或稅金等經常必須因應的問題，總是堆積如山向你襲來。


    當「想要更多」的循環形成了之後，人往往很容易迷失自己，忘記人生中最重要的究竟是什麼了。特別是事業或工作順利的話，大多數的人都會沉迷在那樣的刺激當中，感覺變成像在玩遊戲，就像新的關卡或成就解鎖後，自己的人生價值也隨之提高的錯覺。


    然後，就連非常簡單的跟家人一起度過，或是把用在興趣嗜好上的時間都犧牲了，'
  merge: -1
  img_proc: true
- pgno: 141
  md: '牲掉拿去工作。


    這樣，你是否已經理解，在那個「一直想要更多」的遊戲中，並不存在著勝利與滿足感？


    # 你想要的未來是什麼樣子？


    你現在已經知道，你可以建立自己的金錢計畫，因為思考方式或信念、行動都是可以改變的。你有必要跟過去做個了斷，原諒、感謝……：用這些方式治療你在金錢上受到的傷害，這點將在下一章說明。


    你很快就會明白自己想跟金錢建立什麼樣的關係了，或是進一步理解什麼樣的關係對你來說是最舒服的，開啟新的財富人生。


    我曾經指導過數萬人這些事，也實際看到這些人在金錢方面的改變。無論過去如何，你跟金錢的關係都可以變好，只要照著正確的順序去做，任何人都可以辦到。


    如果可以選擇自己的未來，你希望自己的未來是什麼樣子？'
  merge: -1
  img_proc: true
- pgno: 142
  md: '這不是要你突然勉強自己徹底改變，有債務的人，只要想像沒有債務的人生就夠了。請你想像一下那就是你的未來吧。


    我看過一些人真的得到了他們想要的未來。例如，有一位客戶從父親手上繼承了經營狀況惡劣透頂的公司，他大可像大多數的人恐怕都會採取的方式放棄繼承，資產跟負債都不繼承，但是他卻不想失去父親遺留下來的東西。


    他花了數年的時間，無論再怎樣拚命工作，情況都沒有好轉，逐漸失去希望。這個時候，他參加了我的講習，他發現自己一直都有「再怎麼拚命努力工作，都沒有辦法獲得充足金錢」的錯誤認定，甚至發現擁有這個觀念的，並不只有他一個人，那也是他父親的觀念。


    難怪他父親的事業在財務上會那麼糟糕，而他也一味認為自己做什麼都不會成功。他領悟到，這個悲觀、消極的成見，不但對父親沒有幫助，對自己也一樣沒有任何幫助。他不需要犯和父親同樣的錯誤，他決定改變自己的思考方式和金錢計畫、金錢器皿，變成吸引金錢的磁鐵。我給了他建議。


    我說，想一下你扛著的債務金額，把數字說出來。借款是三億日圓。我告訴'
  merge: -1
  img_proc: true
- pgno: 143
  md: '他, 感覺一下這個數字擁有的影響力, 然後加上一個負號。 ──三億日圓─, 他一面笑著一面想像。接著, 我說了這段話。


    > 「你有沒有發現, 只花了兩秒鐘, 你就變成億萬富翁了? 你父親並不是留下債務, 他是為了讓你學會賺錢的力量, 才留下一個負數公司給你的。」


    他當場下定決心, 要在五年內還清借款。


    之後, 他的經濟狀況有了飛躍性的改善, 所有的債務都還完了!


    他後來甚至並停下賺錢的腳步, 幾年後就變成了億萬富翁。如果說, 這個平凡的男子都能在數年內讓自己的命運好轉, 你同樣也可以改變你的人生。就算一天不可能, 但是當你改變眼前的焦點,
    持續往正確的方向走去的話, 只要幾年的時間, 就能夠創造理想的人生。'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# 想要提升金錢 EQ，希望你能夠記得的五項原則


    +   抱著懷疑的精解心理解所謂理所當然的事情


    很多人都相信，「只要成功，不安和疑慮就會消失。」然而，當你以為某個領域的不安或疑慮消失時，又會產生新的不安或疑慮。每天都能積極、快樂地面對所有的事物當然很棒，但事實上幾乎每天都會有各種不同的擔心。


    與其被浮上心頭的疑慮淹沒，如果了解它就會自然發生，就能夠做好因應的準備。不然的話，當心中存在擔憂或疑慮，就會認為是不是自己做錯了什麼。


    即便產生這樣的情緒，為了能夠冷靜處理，必須理解即使有懷疑出現，也是很自然的事情。不安或疑慮並不一定不好，倒不如說，這表示我們正在培養新的可能性的路途中。'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# ②記得擔心也有好的一面


    為了提升金錢EQ，希望你能夠記得的第二項原則就是「以正面意義練習感覺不安」。我們本能上會想要逃離負面情感，但就像前文提及的，不安可能是經常湧現的情緒。為了逃離這種情感，我們就必須把所有情感都阻絕在外，這樣沒什麼感覺不到了，等於是捨棄感受喜悅或好奇心的能力。


    喜悅與不安是同時存在的。逃避了恐懼，人生中就連好奇心都不會有。


    # ③相信未來的願景


    第三項原則就是「永遠相信會有更好的未來」。無論人生或事業，雖然心頭總會浮現不安或疑慮，但是這種時候才更是要相信未來的關鍵時刻。


    光靠自己無法打從心底相信會有更好的未來時，導師或朋友的幫助就變得很重要了。能夠得到支持自己的人的信賴，你就更能夠相信未來了。


    人生充滿了美好的機會，由衷相信你的人生與各種可能性，將是實現人生的'
  merge: -1
  img_proc: true
- pgno: 146
  md: '基礎。我們的意識狀態會創造出現實，你相信會有更好的未來，就能帶給懷著不安的人們希望。真心信賴未來的願景，就是在幫助其他更多的人。


    人在冷靜沈著時，可以輕易分享自己的能力給他人。當你對自己抱持疑慮，對金錢或未來懷著擔憂的時候，是否也能同樣辦得到，這才是最重要的關鍵。


    ④克服對金錢的情感，大方與人分享經驗


    第四項原則就是「無論何時都要分享」。感覺到了各種負面情感的時候，我們的意識狀態才真正面臨考驗。


    即使自己覺得有疑問，也要藉由幫助他人、與人分享，來對抗負面情感。這不是一件容易的事，當你感覺實行起來實在有困難的時候，就思考對別人有幫助的計畫吧。擬定計畫，每天都把這件事放在心裡，有一天就會影響行為或結果。


    做對別人有幫助的事，也是相信自己本身的能力與未來的證明。'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# ⑤接受他人的支持与爱


    最后，第五项原则就是「打从心底接受他人的爱与支持」。在体脸负面情绪的时候，也许你会感觉光靠自己的力量要度过难关，几乎是不可能的任务。透过身旁的人给你的爱与支持，一开始让你觉得很重的问题，就会缩小到总有办法解决的程度，变得更好整理、因应了。前文提过，藉由向朋友或导师求助，就能够相信会有更好的未来。


    我们往往会觉得，如果没有为别人做什么，就不能接受那个人的帮助。这是一个开始，能够接受帮助，就是为了往正确方向前进强而有力的一步。


    当我们能够无条件接受他人的帮助之后，就能理解自己也有能力与人分享、帮助别人。我们身旁亲友的爱和帮助，拥有能够减缓那些会消耗我们、让我们无力不宁的能力。'
  merge: -1
