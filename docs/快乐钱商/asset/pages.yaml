  md: '甚至因為這樣的情感，造成了許多犯罪發生，這是為什麼？


    簡單來說，是因為「金錢與生存本身有密不可分的關係」。


    除了地球偏遠角落過著原始生活的部落之外，現在要得到食物、衣服、住處，要接受醫療資源等，需要的都是錢。


    「沒有錢的話，我們就活不下去了」，很多人擔心的是這個。


    是的，你能夠切身感受到，沒錢是非常危險的事。


    因為如此，認為自己理應得到、賺到的，如果沒有得到的話，又或者覺得被趁虛而入、被騙的話，就會感受到危險。我這麼說聽起來或許有點誇大，但是人會下意識連結到「生命有危險」。


    感受到危險，我們的大腦會有什麼樣的反應呢？拜大腦的扁桃體所賜，在面臨這種有生命危險的狀況時，我們會產生「戰或逃」的本能反應，不是跟他拚了就是快點逃走，這一瞬間的本能反應幫助你倖存下去。


    面對危險狀況，有的人會趕緊逃走，也有很多人會選擇戰鬥。


    關於錢的事，那可能就是你的憤怒爆發，一股熱血衝上腦門。'
