  md: '「為什麼要那麼忍耐呢？」


    一言蔽之，就是因為「恐懼」。對不懂的事物的恐懼。如果自己改變了，對可能隨著改變發生的事情感到恐懼。或是，對主動採取行動的積極或動機感到恐懼。因此，經常聽到大家把這樣的藉口掛在嘴上：


    > 「不是啦，我也很想做。但是，沒有錢，就無法行動啊。」


    於是，就一成不變，安於現狀。在此，且讓我說一句重要的話。


    如果你對目前的生活及未來懷有什麼恐懼的話，那些恐懼與金錢並沒有「直接」關係。這件事，請你千萬不要忘記。


    與金錢有關的恐懼，其實是你下意識對其他事情懷抱的恐懼。你並不是恐懼沒有充足金錢讓你生活，你害怕的是失敗。


    你或許害怕被父母或心愛的人、在你身旁很親近的人認為你是「沒用的」。因此，「並不富裕」或「自己不適合」、「完全不夠」這樣的恐懼，有時會'
