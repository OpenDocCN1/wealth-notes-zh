- pgno: 163
  md: '其實反映在你與金錢的關係上。


    > 你可能是這麼想的：「如果能夠更有錢一點，他就會愛我了。」「如果可以賺更多錢，同事或朋友就會對另眼相看了。」


    因此，就會變得拚命想要更多更多的錢，結果就是對金錢的不安愈來愈嚴重。想要打破這個惡性循環，如果你不面對存在內心的恐懼或自己思考方式的限制，就算再怎麼努力想要解決金錢的問題也沒有意義，因為你將真正的問題棄之不顧了。


    # **② 憤怒與恨**


    要找到對金錢懷有憤怒與恨意的人並不難。當對方沒有按照約定付款時，我們可能就會開始焦急起來，甚至對對方感到憤怒。當錢不夠的時候，往往會暫時感到迷惘。要是不經意發現誰比自己有錢、賺得比自己多的話，很容易就會瞬間感覺自己中了人生失敗組。


    一直情緒認為「錢的問題就是原因所在」時，很容易就會生氣。'
