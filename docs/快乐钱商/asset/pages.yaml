    調查「你的金錢歷史」，你就會知道自己「如何看待金錢」、「到目前為止，與金錢建構了什麼樣的關係」。〔雖然我們大多不願意承認，但是我們至今接受的關於金錢的想法，幾乎都是受到父母或祖父母的影響而來。這些想法全部交'
