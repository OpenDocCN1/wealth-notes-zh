  md: '此。與金錢有關的情感，有時會隱藏在內心深處，平常觸碰不到的地方。


    # 檢視你對金錢的情感


    來看看你的狀態吧。想到錢的時候，你最常感覺到的是哪一種情感呢？接下來，我會列出十種最常見的情緒反應，請你自我檢查看看，在日常生活中的你是抱著什麼樣的情感吧。如果能夠明白你對金錢懷有怎麼樣的情感的話，因為金錢感受到的精神壓力，可能就會減少許多。


    人對自己不明白的事情，便無計可施。只要好好觀察自己，就可以將自己的情感與金錢、工作的關係，變成自己滿意的狀態。


    正視問題，應該就可以拋開「錢是讓自己不好過的東西」這種想法，開始覺得「錢是為我們每天的生活帶來美好事物的一種很棒工具」。我選出了我到目前為止最常看到的十種情感，應該還有許多種情緒反應，就請你把這十種當成代表吧。也請你務必記得一點，並沒有所謂「正確的」情感。請注意它對你的人生或'
