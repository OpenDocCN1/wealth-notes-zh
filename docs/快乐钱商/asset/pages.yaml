    重要的是，他們知道如何紓解壓力，不會因為害怕『可能會發生什麼不好的事』，企圖去操控事物。就算感覺到與金錢相關的恐懼，也能看清那是不是現實。說到底，這還是因為他們自己決定如何面對金錢——有意識的，或者是在無'
