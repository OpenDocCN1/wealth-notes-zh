  md: '理由 ⑤ 為了獲得愛與關注


    雖然可以用錢得到愛與關注，但是用錢買到的人際關係非常脆弱，說到底只不過是表面關係罷了。一旦錢沒了，愛情也好、尊敬也好、友情也好，都會消失不見。而且，就算能用金錢買到愛情，也經常會帶來反效果。炫耀金錢並且認為「因為自己很富有，所以理應受到特殊對待」，會這麼想的人大部分都很討厭。最重要的是，不是只要有錢，或者只要你謹慎對待金錢，就能夠過著幸福的生活。


    如果你想用錢來得到關愛，那麼所有圍繞著你的價值，就會以你所擁有的金錢數字為基準，雖然也有人覺得這樣很了不起。比起一個人是否有很多錢，大部分的人會從友誼的深厚、愛情的深淺來看一個人的價值。如果不能建立深厚的人際關係，你的自尊心很容易就會受傷，就算你再怎麼有錢，也無法治癒受傷的自尊心。


    在這種情況下，人經常會對自己的朋友抱持著被害妄想，覺得「大家之所以'
