  md: '我大膽預測，將來金錢可能會像現在的「鹽」一樣。加爾·盧夫特（Gail Lutf）與安·柯林（Anne Kolin）合著了《將石油變成鹽：藉由燃料的選擇做到能源自給》（Turning
