- pgno: 156
  md: '每個人都會受到過去影響，了解你目前身處何地

    誠如我說過的，在大部分人擁有的記憶裡，跟金錢有關的兒時回憶中，都有「快樂的回憶」與「痛苦的回憶」兩種。


    我的客戶，一位七十歲的男性，像孩子般一面哭，一面對我說他小時候跟母親與金錢的回憶。他小時候生活很困苦，每天都要愁著沒飯吃，生日要母親買玩具送他，簡直是做夢不可能。現在，他已經成功、變得有錢了，但是再怎麼有錢也無法滿足，無論想到任何事情，恐懼都如影隨形。


    比方說，他會做夢，夢到一夜之間失去所有，簡直苦不堪言。小時的記憶至今依然鮮明，變成他的創傷，一直困擾著他。


    然而，並不是只有他才這樣。


    在金錢上有過痛苦經驗、傷痕累累的人，世上比比皆是。在跟金錢問題有關的影集劇情中，若是涉及心愛的家人時，特別令人難過。


    如果你不希望跟錢有關的大小事情讓你心煩，就要回顧過去與金錢的關係。'
