  md: '# 真正成功的人的面貌


    二十歲出頭的時候，我讀遍了所有書名裡有「金錢」、「投資」、「商業」、「成功」這些字眼的書，非常熟middleware研究錢跟商業的相關知識。我去參加一些著名商務人士的演講，為了加深對方對自己的印象，提出了一些有趣的問題。演講結束後，立刻為他們送上一聽了你的演講非常感動。請收我為徒或請讓我當助理！」的感謝卡。


    誠如大家想像的，一開始並不是很順利。但是有一次，有一個很親切的人邀請我共進午餐，將他的許多知識和經驗都說給我聽。那個人還介紹了其他成功人士給我，我便陸續去拜訪他們。這當中我發現，有錢又成功的人並不是每個都一樣。即便旁人看他們是「什麼都有了」，但實際上他們卻都有截然不同的人生。


    某次，我正在等待與一位新的導師見面時，不經意問了一位像是他的祕書的人關於這位導師的個人生活的事。這位小姐面露困擾地回答我：「我才剛到這裡工作不久，所以不是很清楚。」之後過了不久，我才知道幾乎所有人在那裡工作的'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# 金錢智慧二元論


    在這些浮現一個很有趣的問題了。那些奸詐狡猾、機警精明之人，為什麼乍看之下會像是成功的有錢人？


    點，應該在其他更多地方。社會地位，就一定能為這個世界提供什麼有意義的事物。值得我們注意、學習的。


    在日常生活中長時間相處的人，就會知道他們真正的樣子。並不一定是 有錢或有的能力很大。如果時間不長，在許多人眼中看起來可能是很了不起的人，但是這些人如果他們會在背後說壞話，那麼這個人的本質或見識其實不怎麼高明的。


    要看出是真的還是假的，方法就是看看他的部屬會不會私下說他的壞話。


    像他們這樣的人，才是「真正的成功者」。


    當然，在我遇見的有錢人當中，也有為人敦厚、親切、受到部屬愛戴的人。


    在那裡工作的人都是只待了幾個月就辭職了。察覺到這一點之後，我也逃走了。時間，都還沒有長到足以清楚認識老闆。由於他發言辛辣、要求又嚴格的態度，'
  merge: -1
  img_proc: true
- pgno: 98
  md: '我很想知道答案，於是開始調查，認為這世上應該有通往成功的明確道路，應該有既定步驟可以抵達才對。多數關於金錢的書籍裡，簡單來說，經常都寫著這些內容：「努力工作、賺錢、節約、儲蓄、投資理財……，總有一天會變成有錢人。—”


    我也單純認為：「那我這麼做的話，就會變成有錢人囉！」但是，真有什麼簡單嗎？


    我想大家已經知道，在現實中，拚命努力工作賺了很多錢，也不一定就能樂享成功。


    那些奸詐狡猾、機警精明的有錢人，真實的評價總有一天會逐一浮現，傳聞必然會擴散開來！


    騙子或不誠實的商人，以長遠的眼光來看，絕對不會賺到。一兩次的話也許騙得到人，但要長期總有困難，不久就會露出馬腳。而且，這類人因為都很貪心，名聲、金錢、世人的關注，全都想要獨占，會為此花錢撐場面，但背後卻可能會削減經費、小氣摳門，該付的錢沒有支付等。'
  merge: -1
  img_proc: true
- pgno: 99
  md: '相反的，我發現內心溫暖、真心為他人的利益著想的人，最後一定會成功。他們的特徵就是為人大氣與體貼，在金錢上的態度也非常大方。


    我有一位導師說過這樣的話：「成功的關鍵，就在交易的時候，一定要輸一點給對方（讓利給對方）。」這麼做，就能讓所有人都很愉快結束這場交易，對方會有一贏了的感覺。因為這樣的做法，經常以商業夥伴或客戶的事情為優先考量，確立了為人正直又誠懇的評價，沒有人覺得自己被利用。長期下來，很多人都想一起工作，客戶跟生意都源源不絕。


    我看過很多奸詐狡猾、溫柔體貼、普通的人，也有工作到連休息時間都没有的能幹商人，一時之間成了賺到大錢的企業主，卻又失去一切。我也認識沒上過大學、沒學過投資的基本知識，工作卻很能幹，得到客戶的喜愛，於是變得很成功的人。


    我覺得很混亂，於是跟導師談到自己的觀察。他告訴我，金錢的智慧是由兩個部分構成的：金錢 IQ 與金錢 EQ。'
  merge: -1
  img_proc: true
- pgno: 100
  md: '金錢的 IQ（智商），就是與財務有關的知識，例如投資或稅務等，還有其他一般有關金錢的知識，可以透過學習習得。而金錢的 EQ（情商），則是指處理金錢所需的感性技巧。即便是取得
    MBA 學位的高知識分子，如果金錢 EQ 低的話，可能有一天會失去金錢。這世上有許多明明擁有各種氣派的頭銜，頭腦也非常好，卻做出錯誤的選擇而破產的人，就是這個緣故。


    為了過著擁有 Happy Money 金流的人生，健全的金錢 IQ 與金錢 EQ 兩者都是必備。如果能夠理解賺錢知識的一面跟情感的一面，就能與金錢有良好的關係。


    「原來如此！我明白了。」


    這麼一來，「為什麼會有有錢的人跟一直失去錢的人」，謎團就解開了。


    但是，知道是一回事，做到又是另一回事。到目前為止，我看過很多賺到錢又失去錢的人，我自己也曾經是。


    現在，我總算回到「在 Happy Money 的金流方式中，過著舒適生活」的境界。在這個過程中，我學到很多。


    就算沒能成為大富豪，只是一個極為普通的人，也可以挑戰成為一個小富'
  merge: -1
  img_proc: true
- pgno: 101
  md: '人，這種挑戰對個人來說比較輕鬆。


    那麼，要充分提高金錢的 IQ 與 EQ，成為一個幸福的小富人，具體來說該怎麼做才好呢？


    步驟一當然就是，理解金錢 IQ 與 EQ 的基礎。


    # 幸福小富階級的金錢 IQ


    金錢 IQ 經常容易被誤解為金錢管理，但那並非金錢 IQ 的主要功能。在金錢知識的背後，有更深層的意義必須理解，也就是思考如何賺錢、用錢、守住金錢、增加財富。


    # ◎賺錢


    如果你的目標是幸福富足的人生，做自己最喜歡的事，與他人分享自己獨特的資質或才華，真誠做一些對周圍的人有幫助的事情，就一定會成功。不過，也有一些人相信，為了賺錢，必須背叛自己的信念、控制他人才可以。'
  merge: -1
  img_proc: true
- pgno: 102
  md: '最棒的賺錢方式，並不是在血腥競爭中求勝，或是一直苦思用更簡單、有效率的方法賺到更多錢，而是對自己誠實，將自身才華分享給這個世界。這個結果就是，無論你去到何處，都能夠分享、擴散喜悅。也就是說，你得到的金錢，是客戶或顧客純粹的感謝。


    # ◎ 活用金錢


    若以幸福富足的人生為目標，就不能只想著要節約，而是要有意識地活用金錢。請把錢花在會讓感到幸福的事、花在你想像的東西上，當你有意識地善用金錢，就不會覺得自己是在浪費錢。


    關於讓自己滿足的金錢使用法，有一本詳細說明的好書，那就是伊莉莎白·鄧恩（Elizabeth Dunn）與麥克·諾頓（Michael Norton）合著的《快樂錢：買家和賣家必讀的金錢心理學》（*Happy
    Money: The Science of Smarter Spending*）。兩位作者驗證了各種人的金錢使用法，以整體性來看，將錢花在最符合自己價值觀的事情上的人是最幸福的。'
  merge: -1
  img_proc: true
- pgno: 103
  md: '# 花錢方式最滿足的，並非那些努力去搜集東西的人，而是累積了各種經驗、努力活在當下的人。


    此外，他們還詳細調查了許多研究、觀察人們的行為，結果就是，對自己的人生，就會變成像一場要盡量遠離自己想要的東西的遊戲。


    如果你怕用錢？


    習慣強迫自己存錢的人，或許可以探究一下為什麼自己那麼想要節約，為什麼害怕用錢？

    如果是付錢買下會讓你知道幸福的人，你最多願意付出多少錢？

    評估自己心中的優先事項，學會花心思在真正能讓你開心的事情之後，你不僅會更有自信的使用金錢，也會覺得自己學會了聰明的用錢方法。


    # ◎守住金錢


    為了守住金錢，除了存錢、不讓其他人隨便動用你的錢之外，建立有意義的人際關係是更重要的，你必須在金錢與他人之間立下明確的界線。如果你身邊有...'
  merge: -1
  img_proc: true
- pgno: 104
  md: '人，例如家人、朋友、員工或客戶等，對你的錢有某種企圖，問題不在錢的身上，而是在你的人際關係上。如果有人苦心情虛計畫要搶你的錢，那就很有問題了。


    常見的離婚原因就是金錢問題，丈夫或妻子花的錢超過對方所想的，或是花的錢超過能用的時候，幾乎都是因為一方為了保護自己或保護金錢，不向對方說明關於金錢的重要資訊。結果，夫妻關係最後變成只有離婚一途，明明只是想要保護兩個人的錢，卻失去更多東西——有離婚經驗的人，應該知道離婚要付出代價。


    保護金錢最好的方法，就是好好建立並珍惜人際關係。要做到這一點，當然是要信守明確而易懂的承諾，包括遵守法律，其中最重要的，就是建立公開且能夠誠實溝通的關係。如果能跟身旁的人建立真誠透明的人際關係，就沒有必要過度保護你的錢了。


    # ◎增加金錢


    說到增加財富，幾乎所有人想到的都是投資或其他理財技巧。然而，對生活幸福富足的人來說，增加金錢不只是跟經濟有關的工具知識而已，真正的意涵是'
  merge: -1
  img_proc: true
- pgno: 105
  md: '要尋找你真心想相信的目的，並且以金錢來支持這個目的。以長遠的眼光，為了達

    成目的，給予各方方面的支援。


    成為幸福小富階級的决定性方法就是，讓金錢與你的價值觀和信念一致。你必

    須對自己或自己的事業進行投資，你工作獲得的成果——利益，是為了讓你享

    用的。這麼做，會讓你注意到市場的波動，因為你很清楚狀況，當投資情況不佳

    或出現危機時，你也不會瞎操心，胡亂做出之後會後悔的決定。


    由於你支持的是與自己擁有相同的價值觀或願景的人，就不會馬上在意自己

    是否有賺到錢。因為長期下來得到的利益不會改變，由於你一點一點地持續投

    資，所以能夠成功，畢竟市場一直都在改變。持續多元化投資，你所投資下去的

    多數 Happy Money, 就會讓你真心想重的項目大放異彩。


    # 幸福小富階級的金錢 EQ


    金錢EQ，是指我們對金錢的情感面上的知性。我們必須知道金錢情感面背

    後更深層的意義，思考如何去接受金錢、品嚐快樂、信賴自己、懂得分享。'
  merge: -1
  img_proc: true
- pgno: 106
  md: '# ◎接受金錢


    要使人生豐富，最重要的就是「乾乾淨淨接受金錢」。如果在接受幸福或富足的時候有愧於心，擁有再多的錢，或是得到再崇高的地位，也無法真正感受到幸福與富足。接受，是給自己「接受的自由」，理解自己有接受與生俱來的幸福的價值。


    以積極的態度接受禮物或機會、機運，這件事有多重要，再怎麼強調都不夠。人們往往沒有察覺到眼前的幸福，無法心懷喜悅地接受。被否定的觀念限制，錯過了近在眼前的大好機會，追逐著與自己不匹配的事物，結果就是失敗。


    由於太過拚命想要得到自己認為必需的東西，而錯過眼前的大好機會，這樣的經驗我相信每個人都有。


    將注意力轉向你接受的東西，你應該可以發現你得到的有多少。一旦開始真正接受，你才會懂真正的富足是什麼。'
  merge: -1
  img_proc: true
- pgno: 107
  md: '# ◎ 感謝金錢，享受金錢


    當你感謝自己享有的事物時，你才能與當下這個瞬間真正產生連結，這也是禪學的終極意義。幸福就是活在當下，專注於當下的意思，不是過去，也不是未來，就是當下此刻，它就是人生帶來的禮物。唯有在你享受當下的時候，才是在體驗真正的富足。


    遺憾的是，大多數的人並不具備這種意識。對大多數的人來說，人生就是一場競爭，就算得到了什麼，只要有一瞬間的享受，就會覺得不可以浪費時間而感到焦慮，因為他們覺得必須開始準備下一次的比賽了！他們相信，如果不這麼做的話，就會輸給別人。如果像這樣維持競爭的匱乏意識，就會從當下的這個瞬間切割開來。


    為了過去的失敗而後悔，或是過度擔心未來可能發生的失敗，就會變得無法感謝、享受自己工作所獲得的成果。


    要感受到富足，就必須百分之百活在當下這個瞬間。想要享受人生與富足，'
  merge: -1
  img_proc: true
- pgno: 108
  md: '就要懂得享受當下。如果只是為了往前邁進每一個瞬間狂奔過去，那麼一切就在當下，眼前的豐足你都會錯過。


    # ◎信賴金錢的流動


    一旦有所疏忽，我們經常需要為了錢的事擔心，因為不確定錢是否一定會進來而感到不安，無法產生足夠的信賴感。為了充分發揮人生的可能性，重要的並不是金錢或物質富足，對自己的能力有自信也很重要。即便是沒有什麼錢的時候，只要擁有高度的自信、自尊心，就能夠穩步走向豐足。


    雖然如此，大多數的人對未來總是充滿疑慮。若是一直對自己或未來存疑，那麼等在前方的也會是一個前景不明的可怕世界。害怕挑戰新的事物，對人生的變化感到恐懼，對分享自己的技術或才能感到恐懼，害怕被人瞧不起，想要感受幸福和富足，就必須振奮起來，對自己的能力有自信。


    有自信的人，並不是因為有錢才有自信，而是因為有自信，所以才會變得有錢。你在得到金錢之前，必須先相信自己。可以說，所有成功都是自信的副產品。'
  merge: -1
  img_proc: true
- pgno: 109
  md: '和金錢有關的精神壓力，很多都來自對金錢流動的不信任。懷疑賺來的錢將來會不會不夠，或是擔心現在所做的計畫會不會只是浪費時間跟能量，為了堅決心、有自信地採取行動，就必須接受金流永遠都是流動的。


    # ◎分享金錢


    當你每天都能過著幸福、豐足的日子，應該能懂「人生就是為了分享而存在的」。不要猶豫與他人分享喜悅、提供自己的技術，因為與他人分享喜悅，自己的喜悅也會躍增。只要曾經與他人一起品嚐過幸福的滋味，應該就會發現想要變得幸福，除此之外別無他法。如果做什麼事都只是為了自己的話，很容易就會變得感覺空虛。


    人生的各種層面與人分享，就能夠感覺到幸福。樂趣、金錢、服務、天資或才能等，要分享什麼不是問題，重要的是分享！分享給家人、朋友、同事、客戶，還有社會上所有的人，把你的時間、才能、天資，大方分享給其他更多的人，結果就是讓更多的富血流回你自己的身邊。'
  merge: -1
  img_proc: true
- pgno: 110
  md: '你知道為什麼嗎？


    這是因為分享的原理與自然法則相通，自然界是由分享的結構所組成的，一

    切彼此相連，只要有一部分運行不順，所有均衡都會瓦解。如果有更多人都能共享

    人生的快樂，能與大家共有的話，那麼世界上大多數的問題應該都可以迎刃而解。


    在《金錢的靈魂》這本書中，作者琳恩·崔斯特這段話說得真是很好。


    金錢就像水。那是一條承諾的水流，也是流動的愛。


    金錢朝著我們最崇高的承諾而流，孕育了世界與我們。


    你感謝的東西也會感謝你，你若影響了自己擁有的金錢，這個影響

    也會蔓延擴大。


    合作產生繁榮。


    真正的豐富雖然會從充分擁有豐富之處流過來，卻不會從更富足的

    地方流過來。


    金錢戴著我們的意志。若我們誠實運用，金錢也會運著誠實而去。


    理解金錢的流動吧——你有責任讓你的金錢流向世界。就如你的金'
  merge: -1
  img_proc: true
- pgno: 111
  md: '錢會呈現出你的靈魂一樣，把你靈魂中的訊息挹注到金錢上吧。


    好好利用你的資產——不是金錢，而是你的本質、能力、人際關係或金錢以外的其他資產。


    # 五種金錢 EQ，你是哪一種？


    你與金錢的關係，有一定的模式存在。如果沒有受過完善的金錢教育，恐怕就會符合接下來要討論的五種性格類型的其中一種或結合多種。


    了解你是哪種模式，就能理解你的行為根源。為了與金錢建立健全的關係，最初的步驟就是誠實認清自己目前站在哪個位置上。


    了解自己目前的狀況，下一個步驟就是回頭看一下，思考一下自己是從哪裡開始，又是如何走到目前這個地方來的。在這個過程中，你應該會察覺到各種跟自己有關係的事情才對，例如家人的祕密、父母年輕時的故事，又或是試著找出祖父母小時候令人驚訝的小故事。


    像這樣尋找根源，就能夠更深入理解自己。足夠認識自己，就能用反映出真正'
  merge: -1
  img_proc: true
- pgno: 112
  md: '的自我與自己視為目標的人物樣貌的新價值觀，來重新安排、修正自己的計畫了。


    從金錢EQ的觀點來看，大致上可以分成三種基本類型：（1）積極研究金錢，企圖控制金錢；（2）可以的話，盡量避免跟錢扯上關係；（3）與錢保持距離。


    我將第二種不想跟錢扯上關係的類型稱為「不關心型」，第三種怎麼都想要的錢保持距離的類型就稱為「僧侶型」。


    至於第一種，那些積極研究金錢的人，又依他們想要如何控制金錢，可以分成三種：「儲存型」、「浪費型」、「賺錢中毒型」。前面提過的那兩種，加上這三種，就是人類對於金錢的五種基本性格。


    舉例來說，可能像這樣：


    +   ◎ 儲存型＋浪費型＝被壓抑的浪費型


    +   ↓ 存錢存到某種程度，再一口氣花掉（浪費掉）的人就是這種。


    +   ◎ 浪費型＋賺錢中毒型＝賭徒型


    +   ↓ 這類型的人會賺很多錢，花起大錢來毫不猶豫。


    +   ◎ 儲存型＋浪費型＋賺錢中毒型＝總是擔心型'
  merge: -1
  img_proc: true
- pgno: 113
  md: '↓這種是結合了積極研究金錢的三種類型的人，每天除了睡覺的時候以外，一直在為某些事情擔心。

    此外，還可以排列組合出非常多的金錢性格，我們來看一下你可能是哪一種金錢性格吧。


    # ◎超愛儲蓄的猛存型


    擁有這種金錢性格的人，喜歡存錢喜歡的不得了，最大的興趣就是看著存款帳戶，而且他們擁有的特殊才能是——你不用太訝異——儲蓄。在路上看到錢撿起來，然後拿回家存進小豬撲滿，大概就是他們的最佳寫照。擁有這種金錢性格的人，深信只有儲蓄才是人生的安心保證。


    由於他們以這樣的信念為中心生活，所以生活非常樸實。他們在購買特賣商品上大多非常專業，哪家電信公司最便宜、哪張集點卡最划算，還有要買機票的話什麼時候買最便宜等，他們在這方面應該可以給你非常棒的建議。擁有這種金錢性格的人最生龍活虎的時候，就是在確認自己的帳戶餘額正在穩定增長的時候。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '儲蓄中毒的類型，會將生活中的奢侈享受當作敵人。實際上，會成為他們的興趣或習慣的活動，原則上都是不花錢的，就算要花錢，大多也只會花一點點。


    他們許多人都忘記了小時候內心描繪的「人生若是能這樣就好了」的夢想，可能就連對原本一開始讓他們想要存錢的理由，都已經失去了興趣。


    許多儲蓄中毒型的人在人生當中，都存在與金錢有關的痛苦回憶或恐懼心情。他們大多是在環境不是很好的家庭中長大的，令他們擁有痛苦或寂寞的經驗。或許是家裡的事業破產，或是父母賺的錢不夠，也有很多人是因為祖父母那一代曾經破產的影響，一直延續到現在這一代，就連擔心會失去金錢的恐懼，都繼承下來了。


    除了這些，還有由於父母不懂得用錢之道而造成的痛苦，很多人因此抱持著絕對不要跟父母遭受同樣狀況的強烈意志。然而，無論任何時候，都是由他們對金錢的恐懼感獲勝。他們可能不知道這就是金錢控制人生的開始，甚至從未能夠發現。儲蓄中毒型的人，認為自己的判斷是有道理的，自己做的一切都是正確的。


    如果你認為自己符合這種金錢性格，你必須好好面對你對金錢的不安或恐懼'
  merge: -1
  img_proc: true
- pgno: 115
  md: '# ❈浪費型／花錢中毒型


    浪費型，就是純粹喜歡花錢。擁有這種金錢性格的人，在路上撿到錢的話，壓根不會想到要像儲蓄中毒型的人那樣，回家放進小豬撲滿裡存起來，會直接走到離他們最近的自動販賣機，享受免費喝飲料樂趣。這種類型的人，完全無法理解儲蓄中毒型的人那種花錢會有罪惡感、必須存起來才安心的心理。


    以朋友交往來說，儲蓄中毒型的人很無趣，但是花錢中毒型的人，應該會為你的人生帶來最歡樂的時光。他們的心裡最重視的就是「YOLO」這個座右銘，也就是「You Only
    Live Once」（人生只有一次）。


    擁有這種金錢性格的人，很多都很平易近人、擅長交際，所以跟他們在一起


    許多儲蓄中毒型的人，由於太害怕錢會不見，完全不去使用長時間儲蓄下來的錢，就這樣度過人生。


    心理。在產生這種心情的時候，或許就是深入挖掘的好機會，因為不管你再怎麼儲蓄，也無法消除最初讓你覺得「一定要盡可能掌控金錢」的不安理由。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '應該都很快樂。他們最喜歡沒來由饋贈禮物，或是在特殊的地方請朋友吃飯。


    然後，他們會說：「因為不景氣，大家都不花錢了」，帶著經濟都要靠人力力量支撐的奇妙自負。此外，雖然是極端的例子，有些花錢中毒型的人會一直花得比自己的收入多，然後陷入破產危機。


    他們這樣的行為也是有理由的，擁有這種金錢性格的人，是因爲覺得事情會照自己所想的发展，所以才這樣花錢。買東西的話，就會感覺自己似乎在某種程度上可以控制身邊的一切——這是很自然的心理。


    比方說，購物的時候，店員會很有禮貌地低頭鞠躬（至少在日本是這樣），對你說的一切認真豎耳傾聽、回應。這對花錢中毒型的人來說，會有自尊心跟自我價值獲得認可的感覺。


    這個類型的人大多自尊心很低，經常覺得喘不過氣來，為了逃離這種感覺，就要馬上花錢買個什麼。這麼做，可以讓他們解放日常生活中的精神壓力，紓解心情。


    然而，在店員把買的東西包起來、遞給他們之後，那種討厭的感覺又會一點'
  merge: -1
  img_proc: true
- pgno: 117
  md: '一點回來了。擁有這種金錢性格的人，大多不能真心想受自己買的東西，很多件新買的衣服從來沒有穿過，一直放在衣櫥裡，就是這個原因。


    有趣的是，這些花錢中毒型的人，很多都是儲蓄型的父母養大的。他們的花錢方法，是因為在強迫他們保守用錢的父母身邊長大，一直有窒息或無聊的感覺，所以才做出完全相反的事情來。


    # ◎賺錢中毒型


