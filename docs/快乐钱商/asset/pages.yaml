  md: '的精神壓力會變得更多。


    # 沒有很多錢也很幸福的人們


    這件事如果在紐約或東京等大都市說的話，都會有同樣的反應。大家都會說：「錢這麼少，怎麼可能過得了幸福的生活？」


    確實，因為居住的環境不同，生活開銷也會不一樣。但是，不一定要很多錢才能保證幸福，這點請一定要記住。


    此時，你可能會想，年收入沒有達到八百萬日圓的人該怎麼辦？其實，我認識某些人儘管家境貧困，仍然十分幸福。


    他們為什麼幸福？因為他們跟金錢的關係良好，而且這樣的關係誰都能夠建立。這樣的人不仰賴金錢，也不會打腫臉充胖子，想到未來無法做到的事，不會一直感到焦慮。他們並不相信匱乏的神話，知道萬一有什麼狀況的時候，暫時需要的錢，他們確實都有。他们不會堅持自己一定要在哪裡、要做什么，也不會認為以為如果有更大的房子、更氣派的車子，某天自己的生活就會像施了魔法—'
