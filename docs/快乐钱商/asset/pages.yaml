  md: '在此，我想特別說明一件事，你所擁有的金錢是 Happy Money 或 Unhappy Money，並不是由你的收入、資產的金額來決定的。


    會進入哪一種金流方式，是你在付出或收取金錢的時候，那筆錢本身所擁有的是什麼樣的能量來決定的。


    不論你的收入多少，你的錢必然會進入其中一種金流方式，至於會進入哪種金流方式，則視你的「選擇」而定。如果你想進入 Happy Money 的金流方式，只要你在收取、使用金錢的時候，選擇「心懷感謝」，然後在付出金錢的時候不要吝嗇，滿懷喜悅與感激付出去就可以了。


