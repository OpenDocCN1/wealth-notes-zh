- pgno: 37
  md: '能夠確實獲得改善。


    當你開始認為錢是「要用在好的事情上」、「是可以豐富人生的東西」、「是可以自由給予、收受的」時，你內在的變化將會逐漸反映在你的外在人生上。相反的，當你對金錢都是負面的思考或成見，例如：「錢是邪惡的」、「錢會引發激烈戰爭」、「人生之所以不順遂，都是因為錢」，一直抱持著這樣的想法，這種內心的自言自語，有一天也會確實反映在你的外在人生上。


    你對金錢的想法，會反映在你的金錢，甚至是你的 人生上。像這樣的例子，我已經看得太多。


    # 我在童年時代的 Unhappy Money 體驗


    在我小的時候，並沒有想要成為一個在金錢上對人有幫助的作家這麼宏偉的想法，但是我尋找 Happy Money 的旅程是從很小的時候就開始了。金錢給了還是小孩的我很大的影響，當時學到的教訓，至今仍在各種意義上在我的腦海中揮之不去。'
