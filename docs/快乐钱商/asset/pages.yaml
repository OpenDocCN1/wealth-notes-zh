    當然，也有不少人會表現出完全不同的情感，心胸狹窄、目光短淺，一下子就把細數內心的不平不滿，一點點小事見人就抱怨。


    那可能也是因為他們內心對自己目前的生活狀況感覺並不平穩，被逼得如'
