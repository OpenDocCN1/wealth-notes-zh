  md: '# 譯者後記


    非常感謝您將這本書讀完，這本書是集我近二十年来作家人生的大成寫成的。原著用我不習慣的英文寫成，非常辛苦，我相信也因此與我的前著有著不同的味道。


    我是英文版原著作者，也是日文版的譯者，以同一人的身分來寫後記有點奇怪，但我想談談寫完這本書的感想。


    本書的原著以英文寫成，也將以義大利文、德文、俄文、捷克文、波蘭文、葡萄牙文、西班牙文、中文、韓文、日文等，在歐洲、中南美洲和亞洲出版。


    由日本人寫英文書，並在全世界翻譯出版，這樣的例子並不多見。在這本書之後，我有預感，許多原本以日文寫成的暢銷書也將會翻譯出版，因為全世界都對日本文化有興趣。'
  merge: -1
  img_proc: true
- pgno: 281
  md: '回顧歷史，世界上曾經數次引發日本風潮。用浮世繪當作陶器包裝紙出口的一八七○年代，當時法國很流行日本文化，給梵谷等畫家帶來衝擊。書籍方面，一九○○年出版新渡戶稻造的《武士道》，在全世界引起廣泛閱讀。一九五○年代後半，鈴木大拙的禪學入門蔚為風潮，影響了包括賈伯斯在內的當代領導者的內心。


    經過將近六十年，目前有藝術家村上隆、作家村上春樹，以及整理達人近藤麻理惠的著作在全世界廣為閱讀。東京奧運之後，將會出現許多在全球活躍的日本作家和藝術家，讓世界上更多人知道日本文化的美好，是非常令人高興的一件事。


    日本由於位於極東的地理因素，以及語言因素被世界孤立。雖然日本觀光客全世界到處去，但是並不與當地人民交流，只在觀光地區購物，頂多一週左右就回國了。真正融入當地移民的日本人屬於少數，可以的話，老了之後他們也想回國。光是這樣，或許就能夠證明現在的日本，並不是一個能讓人感覺舒適自在的國家。


    在網絡上所有的資訊當中，日文資料只不過占1%而已。生活在日本，是不'
  merge: -1
  img_proc: true
- pgno: 282
  md: '大能夠發現到這一點的。在世界上，日本呈現一個「幸福的鎖國狀態」。中國、韓國等國，舉國上下都在對外發出信息，日本卻不大這樣的動作。未來，如果日本不進行這類信息發出，是不是會被世界遺忘呢？我有點擔憂。好不容易聚集了一點關注，若真是這樣發展，只能說非常可惜。


    回到本書的話題，我是英文原作者，也是日文翻譯者，為了更好懂，很多地方我都重新寫過。為了多少保留一點英文書的味道，日文版有些地方我留下了英文的表达方式，這點還請見諒。


    來談一下這本書的主題「幸福與金錢」吧。金錢是超越宗教、文化、年代、性別，是世界上所有人都很想要、很希望擁有的東西。


    應該很多人都認為「只要有錢，人生就會變好」，但我相信讀了本書的各 位，應該能夠理解這並非事實。


    對金錢觀念的迷思和誤解，是你人生幸福快樂的最大障礙。能夠從金錢得到自由的人，只有人口比例的幾個百分點而已，而且都是六十歲以上的人。如果想在年輕時就得到金錢上的自由，就必須大量學習跟金錢有關的事物，並且採取'
  merge: -1
  img_proc: true
- pgno: 283
  md: '許多正確的行動。

    想要做到這件事，首先你要下定決心——「我要得到金錢上的自由！」雖然不知道要花多少年的時間，但現在若不下決心去做，就什麼也不會發生，只有時間會一直流逝。雖然也因人而異，但是從數年到十年左右，你就會得到經濟上的自由。現在的你，或許會覺得這樣太久了，但是途中會發生很多讓你覺得興致高昂的事，所以其實應該會覺得只是一瞬間。

    任何事情最重要的就是「真正下定決心」。當你設定好導航目的地之後，就會有路徑出現。在你決定要得到經濟自由的那一刻，一切已經啟動。

    就算你現在在毫無頭緒，只要不放棄，就能找出讓你發自內心覺得興奮期待的事。請你一定要找到，徹底追求。請你相信自己，往前邁進。因為你擁有自由創造人生的力量。

    請你也在情感上擺脫金錢束縛，獲得自由。如果能夠做到的話，應該就能把焦點放在對自己真正重要的事情上。

    你可以和家人聊聊跟金錢有關的事，你可能會聽到連做夢也没想到的故事。'
  merge: -1
  img_proc: true
- pgno: 284
  md: '不只是你的雙親，也請你更了解你的祖父母。這麼做，你將會感受到自己的生命與祖先緊緊相連。


    願你今後的人生充滿美好的回憶！


    本田健

