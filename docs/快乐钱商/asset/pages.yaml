- pgno: 46
  md: '# 解開金錢之謎


    在說明與金錢有關的事情之前，我有一個問題要問你。


    「對你來說，錢是什麼？」


    我想這個問題可能看發問的人是誰，答案也會有所不同吧。如果是九歲的小女孩問我：「什麼是錢？」，我或許會回答：「錢分為紙鈔跟硬幣兩種。有錢的話，就可以買很多東西。」


    但是，如果是對大人說明錢是什麼，答案又會如何？或許，也可以說「錢就是用來交易物品或服務的工具」吧？


    兩個答案都沒錯，但是你我都明白，錢不只是為了「當作交易的手段」或「可以買到很多東西」而使用的工具。我們每天都在賺錢、花錢，卻答不出這麼簡單的問題！


    好幾年來，我已經問過各種不同年齡、國籍的人這個問題。


    「對你來說，錢是什麼？」'
  merge: -1
  img_proc: true
- pgno: 47
  md: '我得到的答案很多樣化，總是讓我非常驚訝。問了世界上不同國家的人，一個同樣的答案都沒有。也就是說，金錢對不同的人，是各種不同意義的存在。


    有的人很高興告訴我：「錢就像上帝一樣了不起的東西」，也有人很痛苦地告訴我：「錢就像惡魔一樣邪惡。」


    有的人告訴我：「錢可以用來表達關愛，可以帶給人幸福」，也有人帶著一臉聰明狡詐的表情告訴我：「錢是可以隨心所欲操縱別人的魔術道具。」


    從這些五花八門的答案當中，你應該可以明白「錢是什麼，不同的人有完全不同的理解方式」吧。


    # 玩「大富翁」遊戲，觀察你對金錢的情緒


    肉眼看得見的具體金錢，不過是紙張或金屬而已。但是，擁有印刷成同一張臉孔的紙幣，或是刻印著同樣花紋的硬幣，它們的意義就跟擁有的人數一樣多樣化。


    看著大額紙鈔，有的人會瞬間發怒，也有人開心興奮。


    真正有趣的是，把小孩玩的玩具假紙鈔放在面前，卻沒人會表現出相同的情'
  merge: -1
  img_proc: true
- pgno: 48
  md: '緒—唯一的例外恐怕是對「大富翁」這個遊戲裡的錢。這是為什麼呢？當我們認真在玩「大富翁」時所顯露的各種情感，幾乎都和對真正的金錢所抱持的情感是一樣的。如果是認真投入遊戲當中，一般都會「想贏」，所以會用和現實生活中一樣的堅持去玩遊戲。


    賺到很多錢，獲得無可挑剔的財產，但是不繳所得稅，卻期望能夠躲掉坐牢的刑罰。在現實生活中，是否會有人不想要這樣的「勝利」——或可謂「成功」呢？在「大富翁」遊戲或現實生活中，當「機會」來臨時，我想沒有人會不開心獲得意外收入或分紅吧。


    我們在現實生活中對財產或金錢會有各種情感，也對「大富翁」遊戲裡的錢有相對應的情感。


    獲得財產時，你想過如何運用呢？用來支付稅款？繳納房租？你的錢包看得牢嗎？還是你會冒著風險，讓大把鈔票露白？下次有機會的話，請你一面玩遊戲，一面觀察自己跟別人的樣子，看看大家在擲骰子的時候，會燃起什麼樣的情緒吧！想知道在現實生活中，我們對這些紙鈔或硬幣耗費了多少能量，不妨趁機會'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# 快樂錢商


    # 一瞬で人生を変える お金の秘密 happy money


    # 拚命工作，錢財就會來？


    察一下在遊戲中對紙鈔和硬幣耗費的能量，應該可以發現你跟金錢是如何往來的。


    在我們的經驗裡，能夠分清楚這不過是場遊戲的人，總是技高一籌。他們的銀行存款數字或許不是最高的，但不計較最終「勝利」或一心要得到「最高金額」，而是享受遊戲中的爾虞我詐。他們的重點不是放在實際的「勝利」，而是放在自己彷彿已經勝利的「感覺」裡。


    我們為什麼會想玩「大富翁」？

    如果我說金錢是一種「遊戲」，你認同嗎？

    你可以用多認真的心情來玩？

    你覺得自己會贏嗎？


    值得重複一次，無論經濟上多麼成功、順利，都不是「勝利」。如果真有什麼可以稱為「勝利」的話，那就是「在這場遊戲裡，你玩得有多開心？」

    跟有共同遊戲規則，可以預測下一步的「大富翁」遊戲不同的是，在現實生'
  merge: -1
  img_proc: true
- pgno: 50
  md: '活中使用金錢時，你完全無法精準預測下一步會是什麼。你不可能一口氣前進十格或十二格，也不可能永遠都順時針前進。事實上，大多數的人應該正被現實生活中的金錢遊戲所帶來的喪失感侵襲著。


    哪項資產可以帶來最大利益，你可能不清楚。房子發霉了、被白蟻入侵了，樹都倒了也說不定。家人生病，花了大筆費用治療；在與病魔奮戰的那幾年間，或許家中的經濟就會變得十分艱苦。


    也可能你任職的公司營運狀況不佳，發生裁員這種事。明明奉獻了整個人生在工作上，但是因為這份工作已經落伍了，被新興勢力取代了也說不定。


    我們在現實生活中玩的金錢遊戲，其實蘊含著相當大的風險，經常會因為經濟變化、家人的問題、自然災害等的緣故，迫使我們走投無路。


    令人玩味的是，在現實的人生大富翁遊戲裡，大多數的人還沒有擲出熟悉的骰子之前，就感覺自己輸了。然後，有人可能會對我們這麼說：「只要再努力一下，再稍微動點腦筋工作，情況就會改變，會有好事發生的。」


    所以，你就穩住心情，告訴自己：「繼續努力吧！」'
  merge: -1
  img_proc: true
- pgno: 51
  md: '其實，你心裡應該也有數吧？


    會選擇閱讀這本書的人，應該很多都明白了遊戲規則才對。你應該聽過「只要努力工作，就會有錢」這句話吧？


    但是，現實世界並非總是這樣運作的，你應該已經實際體會過了才對，那些看起來比你有錢或富裕的人，不見得工作得比你更努力。很多有錢人明明那麼奢侈浪費，世界上卻有人就算拚死工作，也絕對無法脫貧。


    沒錯，答案不只是拚命努力工作。許多人聰明又勤奮，卻不滿足於報酬，或是說感受不到在金錢遊戲中獲得勝利的快感。另一方面，也有許多人感覺十分滿足，沒有任何不安；有趣的是，他們多數都不如富裕的人那麼有錢。


    # 金錢遊戲不是普通人可以玩的理由


    金錢遊戲非常有趣，我的導師竹田和平先生曾經說過：「現實人生的金錢遊戲是沒有終點的。」用棒球來比喻，這句話的意思就是，你們那一隊就算在九局下半贏了，也不能保證勝利一定到手。只要強棒爽快一揮，壘上的跑者可能都會'
  merge: -1
  img_proc: true
- pgno: 52
  md: '跑回本壟，像這種戲劇性的大逆轉，實際上還經常發生。


    金錢遊戲也是一樣。即使你在三、四十歲的時候擁有很多錢，也不代表之後就不會發生什麼無可挽回的事，只要發生就會立刻變窮，想在六十幾歲退休什麼的，就只是一場美夢罷了。明明在五十來歲已經賺到能夠優游自在度過餘生的錢了，到了六十幾歲卻不得不申請破產，這種故事我們都聽過吧。有錢人或有名的運動選手失去所有，最後積欠大筆債務死去的故事，經常在新聞裡看到。明明賺了好幾十億，為什麼最後錢會沒了，一般人或許很難理解。


    雖然是有人說，之所以會失去金錢，是因為「花掉的比收入還多」，但其實並非如此。只是這樣的確，應該不至於花掉幾十億才對。


    他們之所以會失去金錢，是因為金錢規則一直在改變。


    回想一下二〇〇八年的不動產泡沫破滅，在那之前的數年間，街頭巷尾都是這樣說的：「投資不動產吧！錢都在那裡啊。」


    實際上，住宅價格也急速攀升，很容易借得到錢。但是，某天「規則」突然改變了！住宅行情一夕下跌，你的房子──你深信不疑認為買到的價格可以像'
  merge: -1
  img_proc: true
- pgno: 53
  md: '以前一樣翻倍賣出去的房子，價格掉到只剩一半。


    此時，很多人注意到的下一項標的就是黃金。


    「金價一片看好呀。」


    當其他市場混亂的時候，金融專家異口同聲這麼說。但是，在經濟前景一片


    看好時，不會生息的黃金，就變成不過是黃色的沉重石頭，黯然失色。


    現在是一個饒富趣味的時代，全球化經濟的所有領域，結合得比過去更加


    緊密。我們所知的傳統體系正不斷瓦解，每天都有新的系統登場，我們再怎麼思


    考、再怎麼學習，金錢規則還是一直在改變。


    例如，才不久前，大家嘴士都在談論著虛擬貨幣，說這種東西「很有未來


    性」、「是最值得信賴的系統」等。然而，原本應該很安全的帳戶，卻流出數


    百億元，這種被駭客入侵的亂七八糟事件，從來沒有停過。


    在一般的傳統銀行裡，絕對不可能發生這種事，所以很多人仍然無法信任這


    種宣稱「最值得信賴的系統」的虛擬貨幣金融系統。


    世界上有許多經濟權威人士，時常誇下豪語說自己最清楚接下來應該投資'
  merge: -1
  img_proc: true
- pgno: 54
  md: '什麼、知道要如何快速錢滾錢。大多數的權威人士各吹各的調，本來就是常有的事，但我們到底應該相信誰才好？


    當財務發生緊急狀況時，該如何控制才好？恐怕我們最能夠控制的就是「對金錢的情緒」吧？這份情緒與其說是對世上一般不動產、股票、黃金、虛擬貨幣之類的東西，還不如說是我們對「富裕」的情感關係更深入一點。


    # 錢的形式不斷改變


    確實曾有過金錢的「形式」更單純一點的時代，不過就在一百五十年前，在市場買東西只能付現。當時一般只流通紙鈔和硬幣，現在則有支票、銀行帳戶、信用卡、Apple
    Pay、PayPal、虛擬貨幣等各種形式。我們現在在商店支付的錢，或是在華爾街飛來飛去的電子貨幣，跟幾世紀以前的錢，看起來已經相當不同。


    並不久遠的往昔，還是人們偷偷把錢藏在床墊下或沙發縫隙的年代——當然現在或許還會有的人把錢藏在櫥櫃裡。這些人非得確認自己的錢就在眼睛可見、觸'
  merge: -1
  img_proc: true
- pgno: 55
  md: '手可及的地方才可以。


    然而，你所想的「金錢」，其實只是一種象徵，而且近年來看到、摸到實體貨幣的機會變少了，想要確認一下自己的錢，只要打開手機看看銀行的交易明細就可以了。大多數的人都會把錢匯進銀行戶頭裡，付錢的時候選擇用信用卡，幾天、幾週或幾個月完全不碰現金過活也不稀奇。在亞洲，特別是中國，身上帶著皮夾的人逐漸變少了，因為所有交易用手機就可以輕鬆完成。


    在此同時，數十億美元、歐元、日圓等，每天都在全球交易流通。一時之間，很難想像我們每天使用的錢，和在全球飛來飛去的電子貨幣是一樣的東西吧？今天，一個避險基金經理人，在幾分鐘內就可以賺到相當於某人年收入的利潤，這種事情聽在一般人的耳裡會覺得不可思議。


    # 你的錢在哪裡？


    想到錢的時候，那個概念其實很曖昧，你或許以為你的錢放在銀行，其實銀行裡不一定有等量現金。你把錢存入銀行，銀行會把錢借給某個有需要的人，或'
  merge: -1
  img_proc: true
- pgno: 56
  md: '是用在營運上，因此在「實體上」，你的錢不見得會在銀行裡，確實有的只是你用手機查看戶頭時出現的數字而已。


    關於這個問題，我們來做個小實驗吧。雖說是「實驗」，其實不過是在腦海裡想像一下而已。你可能認為自己有钱，如果那是錯覺呢？


    這個假想實驗實際發生的話，可能會很可怕——某天當你查看明細時，發現餘額居然變成零了，你會怎麼樣？


    當然，錢不是你用掉的，是自己憑空消失的。你打電話到銀行詢問：「我的錢呢？」，行方可能回答「您的帳戶裡沒有任何餘額」這種非常官方的答覆。


    就算你覺得「怎麼可能！」，但你要如何證明呢？


    你有存款紀錄嗎？當然。有沒有交易明細呢？當然。但如果銀行說這些都不算證據，拒絕承認呢？


    接著，我們來想像一下快樂一點的事好了。


