  md: '我聽過有個男子的祖父是位成功企業家的故事。他的祖父是一位寬宏大寶的人，受到周圍的人尊敬和愛戴。這好像也是非常有的事，這個孫子在寵愛中長大，沒有商業頭腦，後來使得祖父的公司倒閉，失去了祖父留下來的所有金錢與不動產。後來，這個孫子與他的家人，只好搬到一間小小的公寓。


    有一天，有一位相當高齡的陌生老人來找他。


    > 「我本來是個孤兒，由於你爺爺心胸寬大、情深意重，讓我得以找到工作。」


    老人這麼對他說，還回憶了在他祖父的家裡，接受了壽喜燒火鍋款待的往事。老人憶起在他祖父家接受好吃又溫暖的餐點招待，還有他祖父給自己充滿愛的教導時，總是帶著笑容。


