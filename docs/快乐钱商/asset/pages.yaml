- pgno: 38
  md: '我父親是一位稅務士，他經營的會計師事務所很成功，客戶會到家裡來找他諮商，當時接待客人端茶倒水就是我的工作。那些客戶都是很有經驗的實業家，我找到機會就會拿不像八、九歲的孩子會問的問題來考他們，以此為樂。當我問他們當月份的營業利益，或是股本報酬率、勞動力生產力等問題時，大部分的人都不知道該如何反應，露出一副驚恐的樣子。對我來說，問大人這種問題是「很有趣的遊戲」。


    從某個時期開始，我發現在客戶當中，有些人一開始會穿著垮垮的衣服，不久後卻穿著筆挺的西裝與昂貴的鞋子來。這樣的人大多連車子都升級了，另一方面也有人愈來愈落魄。


    觀察了不久，就連讀小學的小孩，都能夠很明顯看出客戶可以分為兩大類：一種是坐立不安，看起來好像很忙碌的人；另一種是閒適沉穩，看起來幸福、有餘裕的人。看起來像是有錢人的人，有這兩種類型。


    某天下午，發生了一件讓我打從心底感到顫慄的事。自從那天以後，這件事一直留在我的記憶裡。我從學校放學回到家後，從不輕易流露感情的父親，正'
