  md: '很多機會。「也有人說：「錢給了我至今需要的一切。」無論如何，到目前為止，錢也曾帶給你很多驚喜吧？可能是來自你的爺爺奶奶，或是獎學金、財團的捐款，或是意外的獎金或分紅也說不定。

