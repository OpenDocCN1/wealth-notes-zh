  md: '前，有人匿名捐贈了小學生用的書包給某個機構，捐贈者自稱是有名的摔角漫畫主角「虎面人」。這個捐贈的故事被電視播出之後，類似的捐贈行為便陸續發生，包含需要這類支援的福利機構在內，許多有需要的地方都收到了書包或捐款。一個人的行為可以撼動大眾的心，使大家感受到溫暖。


