  md: '# ◎擔心型


    我所見過的賭徒型的人，經常用是被儲蓄中毒型的父母養大的。和金錢上非常囉唆不乾脆的父母一起度過無聊的生活所造成的反彈，小孩子就變成浪費型和賭徒型的人了。


    這個類型的人經常都在為錢擔心，就算擁有再多的錢，也是在擔心。有錢的話，就擔心他們擁有的錢會不見，如果沒錢就擔心沒錢。擔心型的人並不依賴人生，大多一廂情願認為將來會有很多問題，然後又會擔心。例如，他們會擔心明明沒有借的錢要付多少利息。


    這個類型的人做人沒有自信、自尊心低，對任何事情都沒有自信。擔心型的人就算日子過得還順遂，也會害怕萬一發生什麼嚴重的事情，一切都會完蛋。


    該注意的是，像這樣的恐懼，其實跟金錢沒有直接關係。不如說他們對人生整體的恐懼，會特別投射在金錢上（這一點請好好記住）。而且，只要這樣的恐懼沒有消除，他們對金錢的不安也不會消除。'
