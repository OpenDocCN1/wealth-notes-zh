  md: '驗。但是，我母親很怕對父親提起這件事，因為我父親是那種只要提到自己認為沒有用的花費時，很容易就會生氣的人。所以，最後她沒有幫我跟父親講，而是反過來跟我說：「我們等到爸爸心情好的時候再說。」


