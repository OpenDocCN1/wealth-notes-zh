- pgno: 157
  md: '+   ◎ 你害怕什麼？


    +   ◎ 你的金錢狀況差不多是如何，為什麼會支配你呢？


    +   ◎ 你被灌輸了什麼樣的觀念，一直相信到現在呢？


    請你想想看，小時候是否有過什麼心靈創傷？回首過往，或許是很難過、很痛苦的事，但是根本的原因──也就是現在的你與金錢的關係，或是關於金錢你在無意識間深信的那些事，請去理解它們產生的原因。


    理解它們如何支配你的人生，若能治癒，你的心就會變得比較輕鬆一點，你就能夠活得更幸福、自在一些。


