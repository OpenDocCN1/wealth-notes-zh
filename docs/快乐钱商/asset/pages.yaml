  md: '# 快樂錢商 一瞬で人生を変える お金の秘密 happy money


    「樂觀派」的看法，也就是認為「物質很豐富」的人，認為未來這些領域會有充分的就業需求——研究、工程、藝術設計、娛樂、食品營養、醫療、太空技術、廢棄物管理、再生能源、AI相關領域。這些領域不只持續有工作需求，也會隨著科技的飛躍性進步而更加擴大，他們是這麼認為的。


    的確，被自律機械（機器人）取代的工作可能增加，但是必須要有人類參與的工作也很多，人們應該會繼續重視由人類做的設計或職業工匠的技術。此外，人機會越發易于接受教育，現在已是如此。只要透過網路，任何人都能獲得接受高度教育的方法，只要系統夠新就可以。


    實務上，司機、工廠勞動者、農場勞動者、會計相關工作，還有其他常態型的工作，很容易被演算法取代，可能都會變成感應器或機器人的工作。但是，對未來抱持樂觀看法的人，認為我們將對這樣的變化抱著期待、感謝的心情、愛與冒險心態。


    另一方面，「悲觀派」或是「有匱乏意識」的人，認為未來將引發階級之間的對立，上流階級掌控大部分的財富，認為只要投資那些能夠滿足他們私利私欲'
