  md: '# 匱乏的神話


    老師說的一點也沒錯，時間很充足，也還有很多東西可以玩，但是那些東西小朋友卻看不見。


    他們只看到自己「沒有的東西」或自己「沒有玩到的東西」而已，就像他們的父母只看到自己沒有的東西，或是自己沒有做到的事情一樣。


    這就是所謂「匱乏的神話」。


    在世界各地，人們都會感覺自己「沒有被公平對待」，大多數的人都相信這是因為「零和遊戲」（正負加總為零）的緣故——要是有人得到了什麼，那就我們就得不到那個，會有損失。人們相信，如果有人擁有很多錢，那麼他們必然是奪走了我們的錢。


    若有這樣的想法，就會對金錢抱持很多負面的情感。世上的資源有限，如果自己想要的時候得不到，就會被其他人拿走，對此深信不疑，就是一種「匱乏意識」。


    希望隨時都能得到自己想要的東西，卻不考慮自身行爲對他人或社會的福祉'
