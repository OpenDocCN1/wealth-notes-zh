- pgno: 248
  md: '但我們已經陸續找到替代汽油作為燃料的東西，有一天石油可能也會跟鹽走上同一條道路。將來也許仍會使用石油，但需求量將會大幅減少，變成充足又便宜的東西吧。我認為，金錢有一天也會跟石油走上同樣的命運之路。


    但我的意思並不是我們會生活在一個「沒有金錢的世界」，而是會生活在一個「不會對沒有錢感到害怕的世界」。


    這一點就是現在跟未來的重大差異。最終，即使在我們的集體意識（潛在意識）下，也不會再將「錢」與「自由」畫上等號了。就算沒有錢，我們也會感覺到「幸福」與「自由」，從而得到「安心感」。那是因為我們發現，幸福或安心、自主性這種東西是在內的問題，要得到這些東西需要的就是「活在當下」、「投入目前這一刻」，並且一把自己的時間和才能都投注在喜歡的事情上。


