  md: '# ⑨感謝與愛


    最近，因為錢的事情讓你非常雀躍期待，是什麼時候呢？


    要是我說「開開心心地領錢、花錢的話，就會有更多錢匯集到你的人生喔！」你會怎麼想呢？對很多人來說，這應該是令人難以理解的想法吧？因為我們從小就被反覆告知「金錢買不到幸福」。


    確實，金錢買不到幸福。幸福是從心裡油然而生的東西，活在當下這個瞬間也是一種幸福，這誰都知道。但是，金錢可以為你帶來喜悅或感謝的心情，無疑地也會使你有「幸福」的感覺。


