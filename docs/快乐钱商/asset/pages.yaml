- pgno: 244
  md: '# 世界正在進化


    本章要嘗試探究「金錢的未來」，了解不只是你的錢將來會變成什麼樣子，也要看一下這個世界上金錢的角色會變成什麼樣子。


    隨著世界不斷變化，我們的生活也跟著改變。在很近的未來發生的變化可能會超乎我們的想像，這些改變對人類來說，也許會引起情感上的重大混亂。


    我們必須面對現實，將來有各種難題正在等著我們。三十年後，預估二〇五○年世界人口將達到一百億，糧食需求預測將會增加七○%，海裡面可能充滿了塑膠垃圾。


    由於地球暖化，海平面的水位與農業都深受影響。需要照護的高齡老人增加，必須因應各式各樣的健康問題或能源需求增加的問題。階級鬥爭和政治緊張升高的事態，或許也會同時發生。


    的確，我們背負著許多難題，但是在過去兩個世紀裡，已經改善的領域也很多。現在許多人都能夠活到八十歲以上，曾經會奪走生命的許多疾病幾乎已經'
