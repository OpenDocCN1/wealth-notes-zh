  md: '# 思考一下擺脫金錢遊戲的方法


    每個人都在某種程度上被金錢捆綁，如果我們學會重新看待「如何與金錢交往」這個遊戲的話，便是啟程前往自由的道路。這個遊戲對有錢人或被窮人來說，會是完全不同種類的遊戲。不論你玩哪一種遊戲，有事是一樣的，那就是你要和别人一起玩。


    那麼，我們如何知道這個遊戲自己究竟玩得好不好？大概就是把看競爭對手的表現吧。看對手的狀況如何，然後自己加以比較。我們會假想好像自己得分的情況，或是分數被對方拿走的情況，判斷自己玩得有多好。


    但是，我們會在這樣的遊戲中感覺到勝利嗎？恐怕往往感覺不到。


    就算我們感覺自己贏了，看到某人令人嚮往的生活時又會想：「我也要過那樣的生活！」


    就這樣，我們持續不斷地把「我還不夠」的訊息，傳送到自己的大腦。


    因此，無論賺了少錢、存了多錢，還是會覺得自己輸了這個遊戲。幾乎'
  merge: -1
  img_proc: true
- pgno: 260
  md: '就連玩得很順利的時候，也會感覺心情不好。


    金錢遊戲會影響到一個人的心理，讓所有玩家都有失敗者的感覺。即便是特別有錢的富豪，心情也不覺得好，因為就算有避暑專用的大別墅或私人飛機，也取代不了深刻、堅固的人際關係與真正的生存價值。中產階級的感覺也不好，就算想對身边的人證明自己的價值，也常覺得筋疲力竭。低所得的人心情更是低落，放棄了實現夢想的可能。


    那麼我們該怎麼做，才能夠擺脫金錢遊戲呢？


    忘掉你的假想敵，把自己當成遊戲對手。


    不要和別人比較，拿今天的自己跟昨天的自己比。


    真正能給你評價的，只有你自己。你可能認為別人正在評估你，實際上多少也是如此，但次數並沒有你想的那麼多。如果你知道其實有多少人正羨慕著你的某個部分的話，一定會很訝異吧。


    我個人見到大富豪的機會很多，每次我總是很喜歡問一個問題。


    > 「你從什麼時候開始感覺到『自己是有力人』的？」'
  merge: -1
  img_proc: true
- pgno: 261
  md: '我預期的答案是這樣：

    「第一次賺到一億日圓的時候（或是五億日圓、十億日圓、一百億日圓。）」

    然而，回給我的答案一定都是這樣。

    「我並不特別覺得『自己很有錢。』

    接著，還會這麼說：「我有個朋友還有私人飛機，我根本買不起。」

    即便是經營大企業，除了家人居住的房子之外還有好幾間房子，擁有好幾輩子所需要的金錢那樣的有錢人，也不覺得「自己是有錢人」。

    什麼時候才會覺得「自己足夠了」、「自己很有錢了」，關於這點，跟別人比永遠都不完，尋找別的判斷標準肯定比較好。因此，把自己當作金錢遊戲競爭對手，才是最好的辦法。


    # 從金錢遊戲畢業的新規則


    你現在玩的金錢遊戲很可能是跟別人比較，結果變成就算是你不需要的東西，也會讓你覺得「想要更多」。全世界玩的幾乎都是這樣的金錢遊戲，因此要'
  merge: -1
  img_proc: true
- pgno: 262
  md: '避免加入並不容易。如果你想從這樣的遊戲中脫離，無形中也會有股壓力把你帶回去，要你跟大家用同樣的方式生存。


    但是，一旦你成功脫離這種遊戲，你的感覺將會徹底改變。即使是在同一個地方工作，收入金額也沒什麼不同，你已經無需配合他人的期待而活，因此會感覺更加幸福。你會自己決定新的遊戲規則，即使還是為了增加財產、得到更多東西，你也不再是為了玩得比其他競爭對手好而玩。


    你會選擇讓自己感覺是勝利者的工作。也就是說，你會選擇自己最喜歡的工作，或是轉換跑道，選擇更適合自己的能力或天賦的工作。金錢（收入）或許不再是你的判斷「勝利」與否的基準。


    你的判斷基準將會是增加與朋友家人共度的時間，或是花費在你的興趣與喜歡的事情上的時間，用於帶來幸福與喜悅的活動的時間也會增加。


    # 掌握經濟自由的要素


    那麼，藉由這個機會，發掘在你身上沉睡的天才如何呢？'
  merge: -1
  img_proc: true
- pgno: 263
  md: '# 請你自問——


    做什麼事，讓你感覺興致勃勃？


    你真正擅長的是什麼？


    把令你興致高昂的事變成工作，工作順利，有一天就會把你需要的金錢與客戶全部吸引過來。


    但這不是輕易就能夠辦到的事，而且並不表示你可以不去學習有關金錢的基本事項——得到充分的收入、有充分的儲蓄，以及充分的開銷。


    只要你掌握得好，應該就能在三到七年內得到經濟上的自由。我看過無數這樣的人，這是千真萬確的事，只要你下定決心，就可以做得到。


    # Happy Money 的流通，任何人都能夠創造


    很多人從幫助他人得到想要的東西中找到喜悅，藉由幫助他人，得到與他人產生連結的意識及幸福感。


    這就是幸福的波及效果。你不必是百萬富翁，也可以帶動 Happy Money 的流通。'
  merge: -1
  img_proc: true
- pgno: 264
  md: '請你想想看，如果大多數的人都下定決心擺脫金錢遊戲，這個世界會變成什麼樣呢？可能會發生什麼事呢？


    我們大家的想法吧。


    當大家都進入 Happy Money 的流通中，為這個流通作出貢獻之後，將會發生這樣的事——


    有錢人會把更多自己的財產分給那些沒有受到老天眷顧的人，中產階級會願意多冒險從事自己喜歡的工作，生活窮困的人將會更有安心感，對未來抱著希望，接受富裕階級支援的恩惠。結果就是家庭內的紛爭、金錢糾紛、犯罪都減少了，更進一步來說，社會和世界都會變得更祥和。


    我們若能成功卸除基於恐懼的負面思考，更投入於當下這個瞬間，做更多會帶來幸福感的事，毫無疑問可以創造出大家互相支持、鼓勵的環境。


    # 世界最幸福的國度 —— 不丹


    幾年前，我有幸得到機會去了一趟不丹，我去的目的是為了寫關於「幸福」'
  merge: -1
  img_proc: true
- pgno: 265
  md: '的書做調查。不丹被認為是世界上最幸福的國家，我在實際去到那裡之前，曾經想像過不丹人都是帶著笑容，對外地人能夠敞開心胸微笑說「哈囉」吧。


    然而，去到那裡之後，我才發現如果能看到哪個人的笑容就真的很幸運。人們非常害羞，發現有外國人就會躲起來，生活方式非常簡樸。


    不大有的人擺出一副「來看看我！我現在很幸福喔！」的態度。對他們來說，幸福是更安靜的東西。他們很滿意每天的生活，對自己擁有的感到滿足。


    我問了一些不丹人這個問題：「你擔心什麼事嗎？」令我訝異的是，他們大多是这样回答的：「目前沒什麼擔心的事。」這個國家擁有免費接受醫療服務的制度，人民相信如果發生什麼事的話，朋友或國王會來幫助他們。


    如果我 在先進國家問同樣的問題，那些關於職場或伴侶、小孩、政府的不滿，應該可以讓 我至少聽上三十分鐘。


    可是在不丹，所有聽了我的問題的人，都很滿意自己 的人生。他們不會被捲入互相比較、互相評論的遊戲之中。他們其中一個人是這麼說的：「我有很棒的家人，也有工作、房子，還有什麼是我需要的嗎？」'
  merge: -1
  img_proc: true
- pgno: 266
  md: '我非常震驚。確實，如他所言，還有什麼可以讓他感覺幸福，是他真正需要的呢？


    雖然如此，我們生活在一個與不丹截然不同的世界裡。不丹人過著簡樸、最低限度需要的生活，很適合這樣的生活方式。


    我們最應該向他們學習的，就是這種知足的心態吧。但這不是說回到過去的生活才是好的，而是說我們應該發現適合自己的生活方式。


    所謂「幸福」，由我們自己定義。然而，由於我們沉迷於比較的金錢遊戲之中，所以一味認為「擁有更多」就是幸福。


    正因如此，過去一個世紀，我們一直都毫不懷疑地接受「再加油一點，再努力一點！這樣你的夢想就會實現」的神話。


    但是事實上，我們在「更努力、更拚命工作」之後，到底得到了什麼？得到更多東西了嗎？難道不是得到了更多壓力？


    我從不丹回國之後，盤點了一下自己的人生。我思索：我們擁有的遠遠比不丹人民更多，但是有比較幸福嗎？'
  merge: -1
  img_proc: true
- pgno: 267
  md: '現實就是「沒有」。


    不丹人比我們更懂得享受幸福。想要獲得幸福，我們不需要跟不丹人民過著同樣的生活，但是我們必須像不丹人一樣，自己決定只要擁有什麼就就是獲得充分幸福。


    # 發揮你的天賦才能，為世界作出貢獻


    本書已經接近尾聲了，讓我對你說一段很重要的話。


    你有選擇自己人生的自由。


    你可以做你自己想做的事。


    不要因為沒有錢就打消念頭。


    我們有很多擔心的事，表面上可能跟錢、工作、人際關係有關，但其實是對自己或將來感到不安。


    請不要被不安或恐懼欺騙，因為我們覺得不安的事大多不會實現，卻把大部分的能量都消耗在擔心這些事情上，只是在浪費我們的時間、才華還有潛能。'
  merge: -1
  img_proc: true
- pgno: 268
  md: '當你感覺好像聽到天上有聲音叫你去做什麼事的時候，就冒險去做吧。在大部分的情況下，做這些事都是正確的選擇，會把你的層次往上提升。


    我以作家身分出版了多本書籍之後，出席了高中同學會，我就讀的是一所基督教男子高校。很多同學和老師知道不當作家都很驚訝，他們以為我進了法學院，應該會像我父親那樣的稅務士或律師吧。在他們眼裡看來，作家是我最不可能走上道路。


    其實，最驚訝的人是我自己，我沒想到自己會成為作家，到現在還常常覺得不可思議。大部分的人在發現自己身上深藏的真正天賦時，都會非常訝異。天賦才能就在你如此料想不到的地方沉睡著。


    我認為，天賦才能就是一當你準備好為自己的人生負責時，就會出現。「天賦才能」是你發現能讓你幸福的只有你自己時，才會清楚呈現。


    明白了這一點之後，你的五感就像被喚醒，你會真實感受到「我真的活著！」不過，只是發現天賦才能，什麼事都不會發生，你必須好好發揮才行，為此你必須認真磨練。想讓自己的天賦才能得幫助人、換取金錢，你必須投注時'
  merge: -1
  img_proc: true
- pgno: 269
  md: '問提升自己的才能。


    十八年前，我女兒還很小的時候，我曾經夢見長大後的女兒，因而察覺到發揮自身才能的重要性。在夢裡，長成青少女的女兒問我：「你為什麼不去做一些可以改變世界的事呢？」


    我是這樣回答的：「爸爸只是個平凡人，既不是政治人物，也不是大學教授。我並不是那麼清楚這個複雜的世界，說什麼改變世界，我根本不可能做到。」


    於是，女兒失望地垂下眼睛，這場夢就結束在這一幕，我就醒來了。


    這是一個令人難過的夢，所以我整個心情很亂，覺得自己可悲又渺小。睜著朦朧的睡眼，看著在我身邊睡得很香的年幼女兒的臉，我想：「將來我一定要當個能讓女兒尊敬的父親！」


    我憶起了到當時為止的人生，以及一路磨練出技能的獨特經驗，不待靈感湧現，也無需四處張望尋找，我的「才能」已經對著我大喊：「我在這裡！」


    幾年後，我一面祈求這個世界可以變成一個更美好的地方，寫起了關於幸福與金錢的書籍。那個時候的我，完全無法想像自己的書會是什麼樣子，或是所做'
  merge: -1
  img_proc: true
- pgno: 270
  md: '的一切最後可能帶來什麼影響。令我訝異的是，我的讀者爆發似的持續增加，我傳遞的訊息事實上也給數百萬人的人生帶來影響。現在，我想交棒出去。接下來，輪到你去做對世界有貢獻的事了。請你開始做讓你興致高昂、不能不做的事，請你開始做讓你感覺到生存價值的事，請你開始做對你身邊的人有幫助的事。是你的話，一定可以辦到。不管那是什麼事，你目前不知道也沒關係。當你心裡開始冒出嘈雜的聲音，用心觀察，你會發現你的天賦才能正在閃閃發光。


    # 創造Happy Money 金流的五個步驟


    作為本書結尾，我將所有內容重點歸納出你今天就可以採取的五個步驟。透過這些步驟，你也可以進入Happy Money 金流之中。'
  merge: -1
  img_proc: true
- pgno: 271
  md: '# ①拋開匱乏意識


    每個人都能夠選擇要對金錢擁有什麼樣的意識，正因如此，我抱持著「我


    很富有」的意識當作邁向 Happy Money 金流的首要步驟。我們至今一直被灌輸


    「世界上的錢不多，必須在別人取得之前先到手」的想法。


    因此，我們在意金錢在意得不得了，這變成我們的文化。我們一味想著自己


    「擁有多少」或自己「還差多少」，親手摘除了過著美好人生的可能性。


    為什麼？因為我們打從一開始就認定「如果冒險去做自己真正想做的事，就


    必須辭掉目前的工作。這麼一來，就無法生活。」


    「這個世界的本質並不是很富裕」，如果抱著這樣的匱乏意識，很容易就會


    產生無力感，對自己、對周遭的人就不大能夠寬容大度。


    相反的，如果你抱持著「世界上各式各樣的东西都非常豐富」的意識，就能


    夠看見新的可能性，也更能夠發揮創造力。對於人生中發生的困難，應該也會處


    理得更完善。'
  merge: -1
  img_proc: true
- pgno: 272
  md: '這是因為你解救了自已，懂得創造自已的命運。


    # ②懂得體諒，治癒你與金錢相關的心靈傷痕


    一個人一對金錢的姿態（態度）幾乎都是繼承而來的，讓我們承接這些東西的人，也是從别人那裡繼承而來的。如果你覺得繼承了這些觀念讓你很氣恼，就無法创造出 Happy
    Money 金流。你的先人們，也是因為不夠成熟，所以弄錯了很多事，你現在應該能夠理解才對。


    請你想像一下在這個時期的你的父母，由於恐懼心理採取了一些行動，因為他們不知道還有什麼其他更好的方法，所以不得不如此。


    如果你對他們身處的情況或他們的人品有同理心的話，就能夠理解他們為什麼會做錯。你心有餘裕的話，應該能夠體諒他們吧。


    學習優雅處世，如果你能夠體諒他們，心裡就會覺得比較輕鬆一點。透過體諒他人、體諒犯錯的自己，就能夠切斷 Unhappy Money 的循環。


    當你懂得體諒、進入療癒的程序，就能夠朝著新的 Happy Money 金流的方向'
  merge: -1
  img_proc: true
- pgno: 273
  md: '前進。原諒過去的事，過去的傷痕就不會再阻礙我們通往現在的幸福，我們也不**再覺得金錢彷彿有一股無法控制的詭謠力量了。**


    當你真的能夠做到，就能夠真正獲得解放，創造你的 Happy Money 金流，用它來幫助自己。


    # ③ 持續探索你的天賦才能，創造 Happy Money 金流


    每個人都帶著某種才能誕生，有的人小時候就發現了，有的人花了很多時間才發現。發現自己的天賦才能、找出能為自己帶來喜悅的東西，是人生中很重要的事。


    不要再背著沉重的過去，這麼做你的才能將以驚人的速度立刻顯現出來。我建議你先整點你的人生，回想一下你的發展，每個點都開始連接起來。


    釐清你的天賦才能之後，你就能夠逐漸習慣進入心流，請把它養成一種習慣。一旦你夠提升心理素質，困難的事或辛苦的事，在你面前應該都會立刻變成享受或冒險。'
  merge: -1
  img_proc: true
- pgno: 274
  md: '然後，把你的才華分享給世人吧。這個時候，你就可以帶動 Happy Money 金流。當你足夠了解真正的自己，知道最能夠讓自己感覺活著的地方，就能夠建立信賴的基礎，因為你沒有任何東西需要隱瞞。


    愈是磨練自己的才華，會是分享自己的才華，就會能夠創造 Happy Money 金流。


    # ④信賴你的人生


    信賴占據了一大部分幸福的狀態，如果你能夠發自內心相信自己周邊的人，你的人生將會變得輕鬆很多，原本每天抱著對未來的不安，也會逐漸消失不見。如果大家都開始帶著富足的感情與意識關懷彼此，有了錢也會自在分享美好的事物。


    此外，對未來可能發生的事情感受到的恐懼也會消失，因為能夠放心相信別人，別人也能相信自己的話，就會令人感覺心安。


    「信賴」與「恐懼」無法共存，只能有一種存在。「信賴」使我們更加活躍、更有創造力、更自由，「恐懼」則會壓抑我們的行動、背叛我們的意圖，甚'
  merge: -1
  img_proc: true
- pgno: 275
  md: '至引發憤怒。


    若內心有足夠的信賴感，就能從別人的期望這股沉重的壓力中解脫。風險也早已不見得是風險，你會發現幾乎所有原本你擔心對自己是負面的事，其實都是很正面的事。你也會發現，很多表面上看起來是「壞的」事情，就結果而言其實是好的。


    不論是正面的事或負面的事，到頭來所有的事都各自用獨特的方式在支援我們的人生。能夠了解這一點，你就不再因為認定人生中發生的是「好事」或「壞事」而感到退縮不安。因此，相信自己人生的人會更加熱情，也比較容易成功。


    當我們信賴自己或他人時，就能够成為真正的自己。


    # ⑤ 隨時表達感謝


    在Happy Money大量流通的世界，大家經常能對人生中流動的能量互相表達深切的謝意。不會永遠都把自己的錢抓得緊緊的，進一步給予、歡喜接受，才能創造Happy
    Money的流通。'
  merge: -1
  img_proc: true
- pgno: 276
  md: '每當說「謝謝」的時候，這份「感恩的心」擁有的正面能量，會為我們的人生招來更多金錢。


    世界上有兩種人：經常用言語表達感謝的人，以及經常都在找對象責備、抱怨的人。你認為哪一種才是可以吸引他人的人格特質呢？


    對人生感恩的人受人喜愛、容易親近、更有魅力，就長期結果來說，這樣的人會為自己的人生招來各式各樣的機會。


    在每個人的人生當中，當然會有無法按照計畫的時期。但是，一顆充滿感恩的心，將能產生穿越狂風巨浪的力量。因此，盡量表達出感謝的心情吧，也對自己表達出感謝的心情吧。如果你活在感恩的流通中，你的人生將會充滿意想不到的奇蹟。


    當我們與身邊的人都能夠進入這樣的正向流通當中，身邊將會圍繞著Happy Money金流。'
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 你的人生由種種經驗累積而成


    當你的人生就要結束的時候，你躺在床上應該不是擔心「自己賺了多少錢」或「帳戶裡還有多少錢」這種事才對。


    你應該是回顧自己愛過的人以及自己做過的事才對。運氣好的話，在你離開這個世間，最愛你的人們應該會圍繞在你的身邊。


    我想說的是，人生中最重要的並不是財產，最重要的是「人」，是「你」。所以，請你把重點放在最能夠讓你感覺到「活著」的事情上，盡量創造美好的回憶。


    請把你的時間、金錢與能量，也就是 Happy Money 的兌換券，交給你最重要的人、你愛的人、你感謝的人使用吧。千萬要小心金錢的使用途徑。


    跟你所愛的人創造回憶，不見得需要太多金錢。好好發揮你的創意吧。不論你想做的是什麼，請你敞開心胸，接受更多的可能性。


    機會是當你發揮創造力的時候、冒著風險的時候、帶著感謝的心情或希望、抱著「富足」的想法的時候、不抵抗學會接受的時候，才遂一開創出來。'
  merge: -1
  img_proc: true
- pgno: 278
  md: '請你帶著感謝的心情、溫柔與愛，好好對待自己和所愛的人。這麼做，人生也會用同樣的態度與你交往。


    我真心希望你能夠變成這樣。


    我祈禱你的心可以得到安穩、幸福與繁榮。


    這本書充滿了我對你的祝福。


    最後，我由衷對你表達感謝。


