- pgno: 79
  md: '己錢包裡的錢吧。就算看不到「錢的笑容」，大概也知道你的錢有沒有笑呢。如果對工作或人生感到滿足，你的錢應該也會在錢包裡展開笑顏才對。


    如果你很討厭自己的工作，對人生總是抱持著各種不滿，你的錢也會在錢包裡哭泣或生氣。我相信任何人都希望自己的錢是笑容滿面的，如果你覺得你的錢沒有在笑，那你就必須問問自己了。「我的人生至今，究竟有什麼樣的問題呢？」


