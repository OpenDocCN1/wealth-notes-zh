  md: '根絕，或是有方法可以治療。先進諸國大部分地區的水，都已經沒有霍亂弧菌或寄生蟲的汗染。


    在大多數的國家，人們可以過著和平的生活。像一、二次世界大戰那樣造成千百万人死亡的戰爭，已經超過七十年沒有發生。遺憾的是，部分地區還是紛爭不斷，但就算國家之間有什麼摩擦，也還不至於發展到戰爭的地步，而是透過外交來平息糾紛。在日常生活層次，拜工學與建築學的進步所賜，我們都已經能有空調的房子或公司裡生活。


    在先進國家生活的人，大多數幾乎都不需要為嚴酷的氣候變化煩惱，而且能夠便利使用電力，不像以往那麼仰賴煤炭或石油。隨著科技進步，我們享受了比過去更多的自由時間，與相隔遙遠的人們也幾乎可以立刻免費取得聯繫。


    如果是以前，需要花很多時間與勞力蒐集的情報，現在可能只要幾秒鐘的時間，真如字面上的「動動手指揮就」可以搜尋到了。


    還有，我們也開始覺得藝術、真相、生存的意義、幸福等的追求方式有無限多種。在這一層意義上，可以說是一個了不起的時代。'
