  md: '# 你可能也被困住了？與金錢有關的負面想法


    「錢不會一直留在身邊。」


    我有一位客戶對此深信不疑，就算她賺了再多的錢，也無法把錢一直留在手裡。她自己所想的，就這樣變成現實。


