  md: '# 「快樂錢商」概念緣起


    # 「快樂錢商」概念緣起


    謝謝你拿起這本書。


    本書是由Ken Honda所著，由本田健自己翻譯，非常罕見一人分飾兩角寫成的一本書。我先前曾經出版超過一百四十本書，這是首次先以英文出版、再發行日文版的一本書。


    本書內容我構思了二十年，並以非母語的英文寫成，花了三年的時間，卻裝滿了我作家人生截至目前為止的精華。先前，我在日本寫過許多以「幸福的小富人」、「經濟自由人」、「大富豪」等辭彙為書名關鍵字的書籍，主題一貫都是「金錢與幸福」。


    這次這本書即將在全世界出版，我認真思考「人類的共同主題是什麼？」，結果就是「快樂錢商」（Happy Money）這個概念的誕生。'
  merge: -1
  img_proc: true
