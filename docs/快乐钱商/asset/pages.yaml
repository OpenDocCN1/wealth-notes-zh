- pgno: 81
  md: '三餐想要吃飽都很不容易，世事的安排或許令許多人覺得不可思議。


    「金錢的性格會隨著它所處的環境或在誰的手中而改變」，我是這麼認為的。所以，如果你感覺不安，這種想法也會投射在金錢上，錢就不再是對你有幫助的朋友了。如果你感覺幸福，金錢就會發揮更幸福的能量，也會一直陪伴在你的身邊。


    如果你的錢是像為缺錢而苦的人們那樣，經過好幾代的負面想法跟態度的持續汙染，你就不會獲得充足的錢。想要改變這一點，當然就必須改變你自己賺來、收取、交付的金錢的能量。


    # 金錢可以買到幸福嗎？


    我們常聽到「金錢買不到幸福」這句話。


    這句話如果是真的，那麼多人拚命想要賺更多錢，究竟是為什麼呢？他們不可能希望變得不幸吧？為什麼有那麼多人不顧一切只想要錢呢？其中還有人甚至為了得到更多錢去犯罪，這又是為什麼？'
  merge: -1
  img_proc: true
- pgno: 82
  md: '當然是因為只要有錢，就會有很多好事。問問五歲的孩子想要什麼，大概都會給你糖果或玩具等具體答案。然而，要是問十歲左右的孩子，答案或許就不同了。「給我錢就好，要買什麼，我再決定。」


    就連小孩子也已經知道，「錢就像可以讓奇蹟發生的魔法棒一樣。'',

    但在同時，我們也知道金錢買不到幸福。


    我們一定是藉著相信有錢就可以買和幸福，來安慰沒有錢的自己吧。實際上，光靠有錢，也不會得到幸福的。


    不過，聽說朋友中了樂透，或是從遠房親戚那裡得到遺產時，難免還是會嫉妒。還沒聽說的時候，內心明明就很平靜，但是知道某個人得到了、自己卻沒有時，就沒辦法再保持內心的平靜了。於是就說「金錢買不到幸福」，這樣多少還能夠接受自己身處的苦澀現實──認真研究數字、買樂透卻都不會中的現實。


    # 面對幸福與金錢的禪心


    用禪心去面對幸福，不是從「做什麼事」、「有多少價值」、「擁有什麼東'
  merge: -1
