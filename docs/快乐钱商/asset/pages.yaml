- pgno: 83
  md: '「西」這些點開始思考，而是從「我是誰」這點開始思考，先思考關於自我的事情。

    我們究竟是什麼人？當然，首先我們是人類，而做為一個人的目的就是「生存」。那麼，所謂的「生存」是什麼呢？那就是「存在於當下此刻」，這是無上的幸福，也就是身心同時存在在同一個場所的意思。如果此刻的這個瞬間你存在當下，那麼你的心就不會被過去，也就是你曾犯下的錯誤或背負的問題、加諸在身上的危害並為此感到氣憤等所束縛。


    如果你存在於此時此刻，那麼你的心也不會被未來，也就是無法預料的結果，或是可能不會順利的事情、也許會失敗的擔憂所煩擾。你就不會再感到膽怯，也不會一直襲來的精神壓力了。


    我們會對金錢感到壓力和焦慮、沒有安全感，是因為一直深記著自己曾經犯的錯或曾經遭受的危害，才對未來一直感到擔憂。像這樣一直被負面思考拖累的話，就會被自己的過去或未來奪走當下這一瞬間的幸福。


    幸福感只會從人們的心理產生，因此我們確實無法用金錢買到幸福。無法保證用錢買到幸福，但是我可以斷言，存在當下這個瞬間，盡量不要被對過去的憤'
  merge: -1
  img_proc: true
- pgno: 84
  md: '> 約為二〇八萬新台幣，以一日圓兑〇．二六新台幣計算。


    怒、對未來的不安所束縛，是更容易做到的，只要自己的人生不要被金錢無可救藥的控制。


    我寫過很多本書，訪問過許多人，我採訪的對象並不一定在經濟上都受老天眷顧。訪問完那麼多人之後，我得到一個結論。


    「金錢買不到幸福。但是有錢的話，可以解決人生當中的某些問題。」換言之，不安或精神壓力愈少，存在此時此刻的時間就會增加。有錢的話，每個月就不需要擔心能不能付得出帳單，也可以請朋友吃飯，送禮給可能成為另一半的人。


    金錢無疑能夠帶給你助力，但不是沒有錢就絕對不會幸福。關於人們賺錢的金額與幸福的關係有許多研究，無論哪一項研究都顯示，收入提高，人們的幸福程度也會提高，但以年收入八百萬日圓為上限。*超過這個金額，收入再怎麼增加，幸福的程度也不會再提高多少。比起更多金錢為人生帶來的喜悅，環境著金錢'
  merge: -1
  img_proc: true
