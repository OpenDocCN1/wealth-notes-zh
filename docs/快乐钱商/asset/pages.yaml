  md: '幸福，帶來的是正面或負面的影響。


    # ① 不安與恐懼


    人在花錢的時候，多少會感覺到不安。在拿出現金或信用卡要付款時，很容 易會擔心自己是否做了正確的選擇。


    另一種經常會有的擔心，就是「要是現在手頭上沒錢了，該怎麼辦？」甚至 還想到突然失業的話，會不會就一輩子都變成流浪漢了？類似這樣的感覺，讓有 些人就連在拿到薪水的時候，也只會感覺到恐懼。


    「這個星期，如果不能讓孩子們吃飽的話，該怎麼辦呀？」


    對金錢的恐懼與不安，威脅著大多數人的日常生活。為此，數不清的人們勉 為其難繼續工作，暫居在破舊的房子裡，對那些壞心眼的鄰居或糟糕的人際關係 也只能一味忍耐。


