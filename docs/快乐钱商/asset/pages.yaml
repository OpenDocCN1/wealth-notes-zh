  md: '挑選。他們不會永遠都只買賣的東西，只是選擇自己喜歡的東西，因為他們知道自己真正想要的是什麼，所以不會胡亂採購一堆東西，也不會專挑貴的或名牌下手。決定東西適當與否時，他們一點也不在意別人的眼光，他們自己覺得很滿意，因為這就是真實的自己、理想的自己。


