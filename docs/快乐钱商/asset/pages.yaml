    我也一直以爲自己是小時候「過得很好」長大的人，但其實並沒有很好，只是一直這樣告訴自己而已。如果不這麼做，想起痛苦的過去，就會變得很憂鬱。但是，當我豁出去，回想起以往逃避不看的各種心靈傷痕時，就知道自己小時候離「過得很好」其實相當遙遠。


