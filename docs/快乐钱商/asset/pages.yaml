- pgno: 40
  md: '一向陽光、愛說笑的父親的笑容不見了，我們一家人的臉上也失去了笑容。那對我們一家人來說，也是悲劇的開始。


    以前的我，對金錢只有正面的情感。小孩子本來就不會對錢有害怕的想法，我當時第一次發現，金錢帶來的並非只有成功與幸福，只要一個錯誤，也可以殺死一個家庭的所有人。這件事使得金錢會帶來悲慘結果的印象，深植在我的心裡。


    當時還是孩子的我，做了這樣一個決定：『長大之後，我一定不要讓家人遭過到同樣的事，絕對不要為錢所困。』


    因為還是小孩，還不算擁有什么清楚的自覺，但是這件事改變了我對金錢的整體看法。我開始明白，就算家人在金錢上沒什麼太大的困難，只要家人身邊的人為金錢所苦，那也沒有意義，因為我們常被身邊的人影響。


    # 錢是什麼？我想了解金錢的意義！




    上了中學之後，我開始閱讀跟金錢有關的書籍。幾年後，日本進入「泡沫經濟」，我親眼看到人們是如何與金錢往來的——有錢時會怎麼做，突然完全沒錢'
  merge: -1
  img_proc: true
- pgno: 41
  md: '時又會怎麼做。

    後來我考上了東京的大學，開始尋找可以教我商業知識和金錢相關觀念的老師。我找到各種有錢人，有機會去拜會他們。

    在這些遇合之中，我發現有錢人也分成兩種類型：幸福的人跟不幸福的人。幸福的有錢人看起來都跟家人建立了美好的關係，而且都在自己最喜歡的領域工作，都從員工跟顧客那裡得到了莫大的尊敬，也會以最大限度去援助那些有困難的人。

    另一方面，不幸福的有錢人無論賺再多錢，看起來永遠都在為了如何增加更多資產思考並行動，腦裡滿是如何搞出新的生意，如何把別人吃掉而不觸法。而且，他們也是典型的「雙面人」，大多對員工粗暴，對服務生或司機也很沒有禮貌，但是對那些可以給自己帶來金錢或幫助自己成功的人，就表現得非常殷勤、禮貌周到。

    我每次親眼看到這種事，一面覺得很想吐，一面想著如果自己能夠變有成錢人，一點也不想變成那種人，那種人我看得太多了。'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# 我認真思考


    幸福的有錢人跟不幸福的有錢人，為什麼有這麼大的差異？他們的行動應該有什麼理由才是。


    為什麼在有錢人當中，有幸福且心胸寬大的人，也有壞心腸的雙面人呢？當時，我怎麼也想不到，這個想法會讓我開始用一生去尋找 Happy Money。


    在這種過程中，我遇見許多有錢的人、跟金錢處得很好的人、沒錢的人，還有對錢沒興趣的人。有的人很幸福，也有人很不幸。有的人內心很滿足，也有人心裡破了一個洞。有的人充滿了愛，也有人始終徬徨不定。


    因為遇見形形色色的人，我學到「何謂金錢」、「何謂人生」。接下來，請你務必好好品嚐這些精華，我相信一定會讓你從今以後的人生，變得更令你歡喜期待。'
  merge: -1
