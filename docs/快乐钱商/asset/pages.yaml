  md: '# ⑦ 什麼都感覺不到――無感


    其實，這也是誰都會有的體驗。每天顯露出各種情緒，也會使人覺得很累。感覺到某種情緒的時候，雖然需要採取某種必要的行動，但是做得到人卻是少數。所以大家都盡量沉迷在食物、購物、酒精、藥物、電視、網路，避免去感受到什麼情緒。


    總之，可以說我們是自己選擇了「什麼也不去感受」吧。


    其中特別多人選擇避免產生任何感受的，就是跟金錢有關的事。因為不想被金錢擺布，於是扼殺了真正的情感，而這樣的情感既有不安，卻也有由衷的喜悅。


