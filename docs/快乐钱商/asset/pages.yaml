  md: '在我的客戶裡，很多人明明有錢到比希臘神話中的邁達斯王（傳說中擁有點石成金的能力）還要有錢，卻害怕失去財產怕得要死。他們不懂得享用金錢，因為他們不斷地眼有錢鄰居比賽較勁，而那些精神壓力使他們永遠都筋疲力盡。


    當然，如果你的目標只是要成為有錢人，以此為目標也很好，但是很多人已經發現，並不是賺了很多錢，人生的問題就全都解決了。


    很多人其實認為「要建構理想的人生，並不需要賺大錢」。『那些治癒了往日與金錢有關的心靈傷痕，改善的對金錢的態度以及與金錢交往方式的人，無論實際的財產狀況如何，都會覺得「自己是最富足的人」。


    # 你必須治癒與金錢有關的成見和痛苦


    一直以來，讓我傾注熱情的是治療人們「與金錢相關的心靈傷痕」。你抱著什麼樣的心傷，為什麼會有這樣的傷痛，這些傷痛又帶給你每天的生活什麼樣的影響？當一個人察覺到這些事情之後，就能對人生應該為什麼優先做出健全的判斷。如果你能夠治癒自己與金錢相關的傷痕，你的經濟狀況應該就'
