    這樣的人或許在许多世俗定義上並不富裕，但是看起來就是非常「幸福」的樣子。一切都會順利，要想像光明的未來，也並不困難。

    但是，對於在金錢上沒有什麼美好體驗的人來說，很遺憾的，他們可能會覺得人生很不公平。到目前為止，無論做什麼都不容易吧。如果你剛好是其中一員，請放心，就算過去一直都不順遂，並不代表未來會一直這樣、人生無法改變、你無法改變對金錢的感覺等。

