  md: '# ③ 悲傷與後悔


    回頭看看小時候，遙想當初的夢，再看看目前的生活，實在很難說是當初描繪的未來，因此感覺失望或悲傷也是當然的。應該沒有人不曾有過這樣的心情吧。夢想沒有實現，有時真的很令人難受。令我們難過的，並不只有自己的希望或夢想落空，還有明明想為孩子和家人做更多事，卻因爲手頭上的錢太少而做不


    「不公平！把我的錢拿來！現在，立刻，馬上！」但是在現實中，幾乎沒有人會因爲沒錢，就面臨立刻沒命的危險，因爲既不是在森林中被熊追著跑，也不是在水裡被鯊魚攻擊。如果因爲錢而恐慌，產生類似的感覺才是問題所在。面對錢事，我們會有這種「戰或逃」的潛在反應，會爲了生存產生本能的情緒反應，是因爲不知道還有更好的方法可以控制自己的情緒。想要過得幸福一點，最重要的是要認識到「在現代社會，沒有必要一直戰鬥」，因此沒必要一直生氣或怨恨。這樣的情緒反應，是可以控制的。'
