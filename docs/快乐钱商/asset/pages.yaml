  md: '# ◎金錢是問題所在


    如果對錢有討厭的回憶，或許就會認為錢會引發很多問題。但是，引起問題的並不是金錢，而是我們人。諸如打破承諾或契約，因為有了欲望而吝惜拿出錢來，或是該付的錢沒有付，別有意图使用金錢才會造成問題。所以，絕對不是金錢本身有問題。


    # ◎金錢會招來嫉妒


    我們大概都畏懼引來負面關注，若是被周遭的人知道自己有很多錢，應該就會招來嫉妒吧。


    基於不想被人嫉妒，有些人會對擁有很多錢產生猶豫。


    如果你並不嫉妒有錢人，那麼即便你有錢，應該也不會感覺被嫉妒吧。'
