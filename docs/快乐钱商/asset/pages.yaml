  md: '# ⑧雀躍期待與喜悅


    小孩子比大人更能夠自由表現雀躍期待或喜悅的感覺。找時間去附近公園吧，看看跑來跑去玩遊戲的孩子們。只要有人做了很酷或很厲害的事，他們就會拍手或蹦蹦跳跳，像是自己的事一樣開心。是自我的事也好，是其他小孩子的事也好，他們都自在笑著，完全沒有自我意識或不安的感覺。在那裡只是因為很開心，他們也完全理解這一點。


    大人有時也會跟孩子一樣，擁有十分雀躍的感覺。但是，在極為普通的日常生活中，因為興奮期待所以跳起來、拍手或跳起舞來，這樣的事有失體面所以不可以。允許誇張表現喜悅的，大概也只有在自己喜歡的球隊獲勝的時候吧。


    這種自我約束，若是與金錢有關，就更是如此。聽到自己升官或加薪時，高興得跳起來、歡喜得拍手，這樣的公司職員你能想像嗎？


    喜悅或快樂是金錢帶來的正面心情，但是我們卻一直被教導要盡量避免表現出這樣的心情。'
