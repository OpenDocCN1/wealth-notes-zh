  md: '但是，真正有錢的人，卻不會覺得「什麼東西都一定要買名牌來充面子」，因為他們不需要這些名牌來彰顯自己。


    世上屈指可數的大富豪巴菲特，至今仍住在他一九五八年與妻子以三萬一千多美元買下的房子，這棟房子目前的價值不過是他資產總額的○○○○一%而已。很多人都住在遠遠超過自己所得水準的房子裡，因為比起為了過著幸福而滿足的生活真正需要的東西，他們更在意的是別人怎麼看自己。巴菲特為什麼並沒有搬到可以輕鬆購入的更豪奢住宅裡，至今仍然住在那棟樸實的房子裡呢？當BBC新聞訪問他的時候，他是這麼說的：「因為住在現在的房子比較幸福呀。」


