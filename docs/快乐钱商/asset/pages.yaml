- pgno: 39
  md: '在大聲哭泣。教我空手道跟劍道的父親，一直都教我「要挺直腰桿面對欺凌」、「要保護受傷的人」，卻正在大哭。我想像不出究竟發生了什麼事，但是在我面前的父親方寸大亂，完全變了一個人。


    母親把我叫去，告訴我那是因為父親感覺自己對發生的悲劇有責任。父親的客戶殺死了所有家人，然後自殺了。那時，我才生平第一次知道什麼叫做「全家自殺」。


    幾天前，那位客戶拚命拜託父親借錢給他，但父親拒絕了，所以他認為是因為自己才發生這場悲劇，他有責任。


    後來我才知道，父親一開始雖然拒絕了，但原本打算過幾天才把錢借給他。他是想要幫助客戶一家人從窘迫的財務狀況重新站起來，最初之所以會拒絕借錢，是因為想要防止自己借出去的錢，被拿去給那些把他當成獵物的地下錢莊的人手上。


    父親抱著痛苦沉重的心情，一手安排後事，擔任治喪委員會長，送走了朋友一家人。後來，這種自責的想法，一直縈繞在他的腦海。他過著沮喪、灰暗的日子，耽溺在酒精裡，後來也沒有完全從這樣的狀態中恢復。'
