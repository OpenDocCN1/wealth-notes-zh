  md: '織在一起，建構出你對金錢的基本藍圖。


    回顧自己成長至今的金錢歷史，了解你自己這個人是如何形成的，就可以重畫這張藍圖，去到你想去的地方。


    # 人很容易受到自己對金錢的情感擺布


    想到錢的事情時，自然會有許多情感湧現。在某個狀況下明明抱著負面的情感，但是在另外一個狀況下，卻懷著深深的感謝或有興奮、雀躍的感覺，有時會帶著這樣截然不同的情緒。


    這樣的情感大多是在自己沒有意識的情況下產生的，通常我們並不會刻意花時間調查——自己平常感覺到的，是什麼樣的情感”。


    為了把這類情感下意識封閉起來，避免在日常生活中引發負面情緒，很多人就會限制自己的行為。於是，在不知不覺中，因為金錢導致的不安或擔憂，就在你的人生中投下了陰影。


    舉個常見的例子，或許你正好就是如此。不管是到海外留學或是獨立出去、'
