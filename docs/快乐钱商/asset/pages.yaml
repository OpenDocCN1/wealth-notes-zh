- pgno: 184
  md: '工程師、開麵包店的……，卻不知道本質上的事。是什麼因素推動了年輕時候的祖父母，他們當時感受過什麼？什麼令他們覺得最驕傲，他們擔心的又是什麼？你應該不曾仔細思考過吧。


