- pgno: 177
  md: '# ◎金錢是萬惡之源


    許多人對金錢抱持著負面的看法，至少他們認為在處理金錢的時候必須慎重處理。金錢無疑是一種壞東西，他們害怕的是，如果不小謹慎處理的話，會遭遇可怕的後果。


    若是有這樣的想法，會覺得「有錢不是好事」也是理所當然的，就會過著盡量遠離金錢的生活。


