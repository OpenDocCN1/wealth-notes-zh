  md: '我認識的女性裡面，就有人花了好幾十萬日圓衝動買下營業用的美容機器。她說的是，這是給努力加班的自己該有的獎勵，但是買完之後，馬上就後悔了。理由是，她明明覺得買下來就要用，但不知道為什麼，光是看到那台機器就覺得有罪恶感，最後就把它收進衣櫃裡放著了。


    # ◎ 賭徒型


    這個類型的人，就是賺錢中毒型加上浪費型的混合型，很喜歡做令人元氣的事情，永遠都在追求刺激，自然就喜歡冒險，只有勝利的時候才會覺得滿足，輸了就很後悔。賭徒型的人的目的——即使他們自己實際上也明白真的是這樣，並不是純粹想要增加資產，這個類型的人本身就是沉迷於冒險就一定會得到刺激這種事。


    結果就是會突然得到預料之外的利益，或是蒙受悲慘的損失。


    這個類型的人，對於期貨交易或創投相當熱中，他們認為如果人生過得很單調的話，還不如死了算了。'
