  md: '# 金錢在未來扮演了什麼樣的角色？


    關於金錢，所謂幸福的事來，可能就是一個不用花錢，或是只要用一點點的費用就可以行使社會特權的人大幅增加的世界吧。


    擁有許多幸福生活不可欠缺的物品或服務，這些東西就算不至於免費，也是任何人都能用便宜價格買到的世界。


    一個大家都能獲得教育或通訊、能源、優質食物、各式各樣的機會，而且這些都跟你有多少錢無關的世界。


    關於前述這樣的世界，共享經濟──物品、服務、場所等，跟多數人共享、彼此交換利用的社會分享架構已經實現，例如共享汽車、群衆募資等。人們一直


    在學習能讓東西更有用或是分享自己獲得的東西的方法。


