    你或許會覺得「我身邊沒有這樣的人」，三十年前，我也有同樣的感覺。但是，問過很多人之後，意外地我很快就找到了，那個人很可能就是你好友的叔叔或同事的表兄弟之類的。


    這個階段或許是最大的難關，也許你會不大想讓朋友們知道你突然開始對錢'
