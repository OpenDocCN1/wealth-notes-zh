  md: '# 不要只是因為不安而存錢


    很多人因為害怕未來而存錢，擔心可能生病，擔心可能失業。存錢是為了不測之事，為了可能會發生什麼不好的事情做準備而存錢，日本尤其有許多人有這樣的想法。


    然而，若是因為不安或恐懼而存錢，在金錢流動中的恐懼與不安，也是障礙，也會增加。


    副作用就是，無論存了多少钱，都不會讓你對金錢的不安消失。如果你的存款是零，就會想說姑且存個一週的生活費吧。如果辦得到，應該就可以輕鬆悠閒考慮金錢以外的事了。


    如果你存了一週的生活費，下次就會感覺好像必須存一個月所需的生活費。之後就會覺得需要一年份、兩年份、五年份的錢，沒完沒了。就算你存到可以花用一輩子的錢，接著你又要擔心失去所有的錢。


    總而言之，這樣的做 法一輩子也不能消除不安，為什麼呢？'
  merge: -1
  img_proc: true
- pgno: 127
  md: '因為你不安的原因跟錢一點關係也沒有，有關係的是「在你心底深處根深蒂固的不安與恐懼」。


    人往往會覺得害怕的是沒有錢，但其實我們害怕的，是在自己未來人生裡有可能發生的負面變化。


    面對這種瘋狂的狀況，有沒有解決的辦法呢？


    解決的辦法之一，就是在你存錢的時候，一面存，一面想像幾個快樂的花錢方法。比方說，「旅行」、「去很棒的餐廳吃飯」、「去按摩」、「到喜歡的土地上去過退休生活」，或是「花在孩子與心愛的人身上」也是可以的。你知道差別在哪裡嗎？


    你將充滿感謝、愛、希望與積極的情感挹注在金錢上，使更多的金錢可以流向自己。於是，你會發現金錢是支持自己的喜悅與享受的東西。像這樣，如果能夠開始想像把存下來的錢用在無數的快樂享受上，同一時間你就不會去擔心。


    人心是很單純的，沒辦法同時處理兩種感情，所以就把注意力永遠導向快樂、積極、充滿希望的事物上吧。'
  merge: -1
  img_proc: true
