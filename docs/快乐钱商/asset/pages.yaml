  md: '會造成什麼影響，這種想法絕對不會永遠都通行無阻。那些更大、更好、讓人更想要的東西，會一個個不斷地出現，我們不可能全都得到。把存下來的錢全部丟進去，又會出現更想要的，就像是被惡魔的輪迴困住，永遠無法掙脫。


    有一本書就寫出了這種匱乏的思考方式，以及這種思考方式帶來的悲慘結果。那是全球行動主義者，也是雨林救援組織帕查瑪瑪聯盟（Pachamama Alliance）的創立者，我的朋友琳恩·崔斯特（Lynne
    Twist）所著的《金錢的靈魂：找回你的內在財富，擁抱財務自由的人生》（The Soul of Money）。琳恩以她的知性與過去的功績，在全世界得到很高的評價。她致力於消滅世界上的飢餓、幫助女性維護權利，希望所有人都能活得真誠、寬大且富足。


    她在書中這麼寫道：「這種心理上的匱乏，這種匱乏的想法，就位於我們的嫉妒、欲望、偏見與自我主張的中心。」


    所有的自我主張，所有的偏見，所有些微的偏差，都是由於「別人擁有自己沒有的東西」這種想法帶來的。就是這一點，形成了匱乏的中心。因此，要戰勝嫉妒、不安、欲望或偏見，就必須消除匱乏的想法，也就是消除「不公平！」這種'
