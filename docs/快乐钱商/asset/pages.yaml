- pgno: 159
  md: '學習新事物等，有些事情你其實想悄悄地做，但是由於你對錢的事感到不安，於是有各種猶豫，最後你選擇什麼都沒做。


    類似的錢事，卻可能以完全不同的形式呈現。或許，你選擇繼續做並不適合現在的你的工作，在自己也沒有察覺到的情況下，你其實壓抑了對此極度憤怒的心情。內心存有這種憤怒的人，可能會對突然要支付開銷感到煩躁，因為完全不相關的事情遷怒另一半、戀人或家人等重要的人身上。


