  md: '之前，都專注在自己該做的工作上。他們大部分的日子不大會去思考有關花錢或金錢上的事。對金錢沒概念，或者說不關心的人，都把金錢的管理交給商業夥伴或配偶。


    因此，他們對自己有多少錢，或是重要的金錢相關文件放在哪裡，都沒什麼把握，純粹就是沒概念。當然，他們也必須為了生活花錢，但是從來沒有操心過跟錢有關的事情。


    普通富裕，是擁有這種金錢性格的人的特徵。首先，他們不大花錢，所以自然會存下來。此外，他們從小時候就沒什麼經濟上的問題，不論如何錢的事情他們都不大會去思考。對金錢不關心的人，在各種類型的人當中，可以說是最幸福的人了吧。


