  md: '# 寫在前面


    # 你的錢是帶著滿面笑容的嗎？


    以前我曾經遇過一件奇怪的事，就是因為那件事，才讓我想到了這本書的書名和構想。


    那是在某場派對裡，有一位剛認識的女士拜託我一件事。


    > 「可以讓我看看你錢包裡的東西嗎？」


    遇到這種請求，有些人應該會覺得很訝異吧。不過，「名人是如何使用錢包的？」這種雜誌特輯好像很受歡迎，所以偶爾會有人拜託我讓他們看一下錢包。


    那個房間裡的人很多，我不認為那位女士會拿著我的錢包逃走，所以我幾乎沒有猶豫，就把皮夾給她看了。


    儘管如此，我還是嚇了一跳，因為她立刻就打開來看錢包裡的東西，然後把大額鈔票全部抽出來。'
  merge: -1
  img_proc: true
- pgno: 17
  md: '「這張不要緊。這張及格了。這張也及格了。」


    她一張張檢查，這麼喃喃自語著。


    「好棒！你的錢每一張的感覺都很好」，她這麼說著，又把紙鈔整齊地放回錢包裡，交還給我。


    「太好了。」我這麼回答著，即使搞不清楚狀況，但是能夠通過她的檢查，我也莫名覺得安心。


    「如果可以的話，請問妳剛才都看了些什麼呢？


    「我在檢查你的錢是不是正在笑喔。」


    她這麼回答我，然後說：「錢啊，要看你怎麼收進來、怎麼付出去的，有時會笑，有時也會哭呢。」


    據說，人如果帶著罪惡感或憤怒、悲傷的情緒支付出去的金錢，就是「哭泣的錢」。另一方面，如果是帶著愛或感謝的心情、幸福的感覺支付出去的金錢，則會「微笑」、「笑出聲音來」。因為這樣的錢，會持有付出金錢的人的正能量。錢會笑？也會哭？'
  merge: -1
  img_proc: true
- pgno: 18
  md: '對我来说，這成為我對金錢的全新款法開端。


    # 看到公園裡的母子，我決定一件事


    我的人生在金錢上一直都很有福氣。小時候，擔任稅務士的父親，就讓我接受金錢方面的帝王教育，因此我二十歲的時候就決定「三十歲前要成為幸福、富足的人。」於是，我從事管理顧問、會計等工作，在二十歲的時候就賺到很多錢。也因各種幸運層層交疊，我在二十九歲時因為女兒誕生，決定夫妻兩人要專心養育孩子。


    專注養育孩子的四年間，是我人生中最棒、最幸福的時期，這個決定也是我人生中最好的決定。我之所以可以這麼說，並不只是因為我能有許多時間跟女兒相處，還因為在陪伴女兒的時候，我想到展開自己的第二職涯——幫助成千上萬的人生活得更幸福、富足、安穩。


    那是一個晴朗的日子，我和女兒在公園裡發生的事。我們玩得正高興時，附近有一位母親與一個和我女兒年齡相仿的女孩吵了起來。媽媽急著想走，一副非'
  merge: -1
  img_proc: true
- pgno: 19
  md: '常困擾的樣子，於是對女兒吼了起來。

    「媽媽非得去上班不可了！我們回家吧！」

    但是，小女孩還是繼續這麼說著。

    「我們才剛來。我還想再玩嘛！拜託啦！」

    兩人爭論了幾分鐘，媽媽硬是拖著不想離開的小女孩回去了。我當時覺得小女孩跟媽媽都好可憐。

    如果可以的話，那位媽媽一定也很想繼續留在公園吧。畢竟那天的天氣好得不得了，應該沒有父母不想跟小孩在外面玩。

    就在那個時候，我想到了「我必須做點什麼」。

    不只是那位母親，我想幫助所有為籌措家計辛苦操勞的年輕父母們。我希望能夠消除那位母親背負的痛苦、壓力和焦慮。如果有什麼我可以做的事，我想為她做──我心裡是這麼希望的。

    然後，就在那天下午，我想到把自己長年累積下來的「要得到富足生活所需的智慧」整理成文章。'
  merge: -1
  img_proc: true
- pgno: 20
  md: '剛開始寫的時候，我以爲我能寫的长度大概就是五頁左右，誰知道一動筆卻停不下來，連我自己都很訝異。回過神來，我已經寫了二十六頁了。


    高興得不得了的我，把寫好的文章列印出來，用釘書機釘好，很快就發給不少朋友。令我驚訝的是，朋友們都很喜歡我的文章。不久後，開始有不認識的人打電話來，對我說了這樣的話。


    > 「我聽說了你的冊子。方便的話，可以印十份給我嗎？」


    結果從那天之後，我每天都在印稿子、裝訂稿子，做到兩手都發麻了。我跟朋友抱怨了一下，朋友建議我去找印刷業者做簡易印刷，我馬上查了電話簿聯絡印刷廠——當時是還沒有電郵的古早年代。


    當負責人來的時候，我一開始說：「印個五百本就夠好」，他卻說：「我們最少要印一千本，如果裝訂三千本，就可以算你很便宜。」我這個關西人馬上就被「很划算」這種話術給釣走，沒想太多就答應了。


    > 「那就麻煩你了！」


    過了一陣子的某一天，在散步回家的時候，我發現家的旁邊停了两台卡車。'
  merge: -1
  img_proc: true
- pgno: 21
  md: '看著年輕的送貨小伙子正在卸下看起來沉甸甸的貨物，我還以為附近有人搬家過來了，結果竟是我什麼也沒想就下訂的小冊子。


    請大家想像一下我太太回家後，看到整個房間堆滿了裝著小冊子的箱子的表情！我太太是個溫柔的人，總算是原諒了我說：「這次就不跟你計較。」但是她開出條件，要我一個月內把這些堆積如山的箱子清理乾淨。


    # 從一通意想不到的電話開始的生涯志業


    猜猜看後來我怎麼做？

    我把小冊子都發出去了，認識的人全部強迫中獎（笑），連不認識的人也發。

    有趣的是，當我把家裡所有的小冊子都處理完之後，還是持續有人來下單想要那本小冊子。我其實不知道當初大家想要那本小冊子，是因爲內容還不錯，還是我可以免費索取。即便如此，我仍然覺得「我可能走到一條不錯的路線上了。」

    當我發出的小冊子達到十萬本的時候，事情就很清楚了。我接到出版社的電話，問我：「有沒有興趣寫書？」'
  merge: -1
  img_proc: true
- pgno: 22
  md: '我起初這樣回答：「怎麼可能？我又不是作家！」出版社的人並沒有打退堂鼓。「可是，你時間很多吧？要不要試著寫寫看呢？」我無法反駁，當時我的女兒已經要上幼稚園了。女兒不在家的話，我的日子究竟要怎麼過才好呢？


    我重新想想，覺得或許可以寫些什麼吧，於是就坐到電腦前試著寫寫看。當時，我完全沒有想到，這會是改變人生旅程的開始。後來，我寫了超過五十本書，包括翻譯的書籍在內，總共出版了一百四十本以上的書籍，累計下來總共把將近八百萬本書送到這個世界上。這對一個是在跟女兒玩的時候想到要嘗試寫文章的半退休狀態普通爸爸來說，真是一件很神奇的事。


    那個時候，出於想為公園看到的一位職業母親加油的心情而開始做的事，完全沒料到竟會變成我的生涯志業。


    後來，我發現幫助別人找到生涯志業，在過程中自己也獲得富足並享受自由，正是我的生涯志業。'
  merge: -1
  img_proc: true
- pgno: 23
  md: '我寫了很多關於金錢與人生的書，當然自認為對於「金錢是什麼」有個大體上的了解，但是當那位新朋友——派對上想看別人錢包的神祕女性——把錢包還給我的時候，就像幾年前在公園裡的時候一樣，又讓我陷入深思。


    就在那時，我才開始思考關於「金錢與能量」的事情。


    # 金錢就是能量


    當那個新朋友把錢包還給我的時候，我是這麼想的。


    「啊，太好了！我錢包裡的錢，這幾年賺到的、收到的錢，都是我很歡喜地從我感謝的人手中得到幸福的錢啊。」


    於是，我大致回想了一下，我是如何賺到這些錢的。


    回想起來，我一直都是提供各種服務來收取金錢，我一直都在提供服務，幫助人獲得成功、富足、增強力量。我幫助人獲得內心寧靜與喜悅，找回感謝人生的心情。


    再者，我也思考了當人們花錢購買我的書籍閱讀，參加我的講座或工作坊'
  merge: -1
  img_proc: true
- pgno: 24
  md: '時，他們是怎麼想的——我在世界各地數千人的面前做過演講。


    此外，我也想到，不知道有多少人受到我的書影響而改變人生？在讀者當中，有的人換工作或獨立、結婚、生子、斬斷了有害的人際關係。也有許多人開始創業，我經常收到這些人的來信。其中，有人從零開始白手起家，最後讓公司變成上市企業。我也收到一些雖然並未變成很有錢的人，但是開始懂得以富足的心情過生活的讀者寄來的感謝信。


    無論存款金額多少，這些人都過得很幸福快樂。與金錢有關的壓力消失，他們開始過著自由的嶄新人生。


