  md: '# 储蓄散财型


    這個類型的人是儲蓄型與花錢型的混合型，儲蓄散財型的人幾乎都是嚴格且認真的人。儘管如此，當他們突然發現必須做什麼的時候，就會一口氣把錢花掉。因此，當平常看起來在工作上、在金錢上都非常穩定的他們，竟會缺錢的時候，就會嚇到身邊的人。


    他們基本上是想利用存錢來控制人生，他們相信這樣是最好的，所以發奮努力勤勉存錢。然而，當他們覺得再這樣下去就會窒息的時候，就會將壓抑許久的東西一口氣吐出，那就是鐘擺一下子從「儲蓄型」擺盪到「浪費型」去了，這個部分或許有點類似減重。


    他們一旦要使用存下來的錢時，會去買一些不必要的東西或是不會去用的東西，花在很奇怪的地方。例如，明明沒有駕照卻想買車，然後說出類似這樣的話：「因為價格很划算啊！我覺得，如果要買，就得趁現在了。我也在想，差不多該來去考駕照了。」'
