- pgno: 194
  md: '# 金錢是流動的能量


    一開始我就說過，許多人都把金錢這種東西理解得太狹隘。講到錢，往往只是單純想到偶爾會使用的紙鈔或硬幣，但是我們從很久以前就開始使用信用卡購物了，現在還經常用智慧型手機來付款，要買什麼都已經不大需要現金了。


    仔細想想，信用卡並不是錢，手機也不是錢。雖然這麼說，但是仍看得到錢經由信用卡、手機，從自己的帳戶流到某個地方去。


    所謂「金錢」，究竟是什麼呢？

    錢是從哪裡來的？

    錢的價值又是從哪裡產生的？


    在前三章，我們從各種不同角度來看錢，主要著眼於「對你來說」的金錢的「意義」，把焦點放在你與金錢的關係上，關注你認為錢是什麼，從過去的經驗來看，你對金錢有什麼樣的感覺。


    在這一章，我們進一步擴大視野來看吧。'
  merge: -1
  img_proc: true
- pgno: 195
  md: '請你把錢想做是到處──特別是在人與人之間──流動的「能量」。現在即使你花了錢，也不見得是實際把現金交給對方，很多時候只是在形式上改變了錢的擁有者而已。


    你買了某樣東西，支付金錢作為對價。但是，究竟是付給誰，又是如何支付的呢？


    當然，我們支付的對象是賣東西給我們的人或公司，但是看不看得見對方並不是問題，無論是在線上購買，或是當面購買，金錢都是交換手段──要說的話就是一種「流通」（circut），所以它才叫做「通貨」（currency）。


    金錢是能量，如果它不停流通的話，現在就在各地家庭、地區和社會團體中，在我們身邊流通著。金錢存在任何地方，即使你看不見，它依然存在、流動著。若能理解金錢是一種流動的能量，你會確實改變看待事物的觀點。


    在都市中，大量金錢滾滾流動。居民在加油站加油、去看棒球比賽、看電影、在外面享受外食，一切都可能需要錢。數以百萬計的都市人支付金錢，換取物品或服務。'
  merge: -1
  img_proc: true
- pgno: 196
  md: '另一方面，在鄉下，就感覺不到這樣的能量，這是為什麼呢？因為人們與使用金錢的設施之間隔著廣大的空間，能量的擴展現變弱了。在都市生活的人，之所以會覺得鄉下很無聊，感覺好像「哪裡不一樣了」，那並不是他們想太多了。


    與有錢人交往的感覺可能和平常不大一樣，那是因為他們在快速的流通中，與能量充沛的人以極快的速度互相活動著。


    # 獲得Happy Money金流的唯一祕訣


    那麼，要如何才能獲得「Happy Money 金流」，也就是「以高能量流通的金錢」呢？還有，要如何才能躲開「Unhappy Money 金流」，也就是「以低能量流通的金錢」呢？


    我來告訴你方法吧。或許你現在聽起來覺得不可能、有點懷疑，請繼續聽我說下去。把金錢看成流通的能量，不是現金或數字，這樣就會變成很容易親近的概念了。'
  merge: -1
  img_proc: true
- pgno: 197
  md: '接下來我要說的話，可能會讓你感到有點訝異，不過這麼想的不是只有我，也有很多專家跟前輩與我有類似的想法。


    > 「你有責任為自己的金錢注入能量。」


    如果你願意，就能為自己的錢（數量）與流通（速度）注入能量。注入正面能量——提高與金錢相關的能量水準，金錢的流通就會變好，這是宇宙法則。


    那麼，該怎麼做，才能積極將能量注入金錢，創造出從自己手上流動的Happy Money呢？


    那就是「由衷的感謝」。對，只是這樣而已。


    # 處於Happy Money金流狀態中是什麼模樣？


    只要展現出感謝的心情，就可以為Happy Money的流通增加氣勢。如果工作順利獲得報酬，就由衷地說出感謝並收下；這麼一來，你會感覺到金錢的流通變得更快速。


    受到上司、同事、員工、客戶感謝時，你應該也會感覺到強烈的能量正在流'
  merge: -1
  img_proc: true
- pgno: 198
  md: '動才對。當你的工作獲得高評價時，就表示你「有非常棒的價值」。


    而這個「有價值」是什麼意思呢？

    是的，它就是能量！


    正面的能量是什麼樣的东西呢？那就是 Happy Money 的關於工作，受到客戶或顧客的感謝，或只是以專業的態度接待客人就受到感謝時，你就處於被注入正面能量的
    Happy Money 流通中。


    對自己的工作感到歡喜，與同事或客戶一起工作時覺得很驕傲，對於能跟他們一起工作，內心有深深的感謝，你就是在為自己的 Happy Money 金流注入正面能量。當你覺得與其他人一起工作無比光榮時，你正在為你的
    Happy Money 金流注入正面能量。


    此外，不是只有錢進來的時候，錢出去的時候，你也一樣可以替你說出去的金錢注入正面能量。當你把錢花在購買衣服、到餐廳吃飯、看電影等事情上時，找到理想的商品或服務而感到開心、覺得很「Lucky-」時，也是為你的
    Happy Money 金流增添氣勢。因為每當你的商品或服務感覺喜歡、表現出感謝的心情'
  merge: -1
  img_proc: true
- pgno: 199
  md: '時，你就是在推動這個世界的 Happy Money 金流。


    若是給朋友錢、參與慈善活動，或是投資最終於地區、社會或世界作出貢獻的本地新創企業，你就不只是讓自己的人生，也讓許多人生當中的 Happy Money 金流變好。


    # 用心感覺，觀察金錢的流通


    只要仔細觀察這個世界，你就會發現眼前的金錢流動清晰可見——不過，就像前面說過的，如果住在人煙稀少的鄉下，或許就另當別論。


    那是我小時候，父親帶我到一條小商店街去的事。


    父親問我：「你覺得哪家店最賺錢？」


    他叫我到好幾家店的門口往裡面瞧瞧，數一數每家店裡面的客人人數，然後對我解說我看到的那些事。我看到一些擠滿客人的店，就認為『很多客人出入，所以很賺錢』，但是他告訴我那是誤解。


    原來，不是只要出入的客人多，客人購買的商品價格也很重要。那條商店街'
  merge: -1
  img_proc: true
- pgno: 200
  md: '上有各種行業的店，顧客人數和商品種類非常眾多。魚鋪和蔬菜行家最熱鬧，客人進進出出絡繹不絕，但是我發現這些店的客人都抱著價格便宜的商品，很快就走出來了。


    接著，我觀察的是賣棉被的寢具店，我發現雖然他們的客人不多，但是只要賣出去一次，就足夠營整個家庭好幾天。再走去幾家店，有一間不動產公司的分店。賣房子會產生更大的利潤，不動產公司只要賣出去一間房子，獲利就足以支持經營好幾個月了吧。


    那一天，我學到的重要一課就是：「並不是客人多，就表示一定很賺錢。」當時的教導令年幼的我驚訝無比，印象深刻，一直未曾忘懷。現在每當我到商店街去，雖然店家的業種已經十分不同了，但是金錢的規則仍然相同。


    為了練習觀察，也請你到離你最近的商店街或購物中心去感受一下金錢的流動。觀察一下購物的人，注意有多少客人進出。


    等到你能夠感覺到能量或金錢的流動之後，你就能夠發現你過去不曾察覺到的事。'
  merge: -1
  img_proc: true
- pgno: 201
  md: '# 金錢是流動的——收入多，支出也會多


    回頭看看你到目前為止的人生，想想跟金錢有關的起伏，大概會記得在銀行裡有存款，所以感覺非常安心的時候，恐怕也會有就算賺了很多錢，卻因為花得更多而無法應付、甚至開始擔心的時期。說不定，你有過完全沒錢、走投無路，對人生感到絕望的時候。


    「不義之財必耗盡」，應該不少人有過突然進來的錢很快就消失不見的經驗。為了生存必須吃東西，吃進去的也必須以排泄物或能量的形式排放出去。如果是流通的話，應該要有平衡，因為這是自然法則。


    就像你無法控制自然的隨性一樣，你也不能有意圖地去改變金錢的流動。就像地球引力控制潮起潮落，經濟也控制著金錢的潮起潮落。


    錢進也好，錢出也好，帶著安心感與感謝的心情是最理想的。錢進來的話，一面享受錢往自己流的感覺，也必須心懷感謝。'
  merge: -1
  img_proc: true
- pgno: 202
  md: '樣的喜悅。


    若是能夠理解依據自然法則，錢在不久後就會回到自己身邊，在投資或付款時，也就能夠帶著感謝的心情把錢送出去。


    關於金錢流通的最大謎團就是：「什麼樣的人會成為收取金錢的那一方呢？」


    心機重又壞心腸、無恥又手段卑鄙的人會成為有錢人，這一點都不需要驚訝。但我們希望不是那種人，而是「溫柔、體貼、正直的好人可以成為有錢人」，但從現實生活中我們也明白，很多時候並非如此。


    看起來就像壞人的人，為什麼可以得到那麼多錢呢？


    # 成為吸引金錢的磁鐵


    我的導師曾經告訴我：「金錢就是能量，人就像磁鐵一樣。」


    在自然界，磁力是一股力量，能夠轉換能量。


    吸引金錢的磁鐵——那些看起來像是站在金錢流通之路上的人們，即便在道德上不正當，也能夠收到金錢。'
  merge: -1
  img_proc: true
- pgno: 203
  md: '就像自然掉的岩石，會掉在好人頭上還是掉在壞人頭上，我們不會知道，因為大自然不會區分好人壞人。同樣的，金錢也不會區分好人壞人。


    不論在好的意義上或是壞的意義上，金錢都不會去判斷人，只會單純跑到吸引它的地方去。無論個人、企業或國家，都是「磁鐵」或「力量」，而金錢會往擁有吸引它力量的地方流去。


    壞心的人、組織或國家，如果比我們有錢，或許會令人想要大喊：「這一點都不公平！」


    我問我的導師：「這個世界沒有正義嗎？」


    他的臉上浮現一抹微笑，這麼告訴我：「金錢不是神，只是一種中立的力量。磁力有正負極兩種，雙方都有相同的力量。夥伴關係也是一樣，無論好人或壞人，都同樣擁有吸引力或魅力。」


    # 負面磁力強的人，也可以吸引金錢


    像這樣可以吸引金錢的人，究竟是誰呢？'
  merge: -1
  img_proc: true
- pgno: 204
  md: '英文有個名詞「金錢磁鐵」（money magnet），顯示了對賺錢的莫大欲望。想方法設法要成為「金錢磁鐵」的人最愛錢，認為拿錢是當然的，永遠都在想賺錢的方法。


    像這樣的人，很多在小時候都吃過苦，「只要有錢就能得救」這種想法，一直是他們的心靈慰藉，認為錢可以克服人生中所有的不公平。那就像在心裡挖了一個很深的洞（黑洞），擁有強大的磁力。許多詐欺犯或壞人、那些缺乏道德感的人，就是利用這樣的心理機制在賺錢。


    這就是負面的磁力。即便不至於是詐欺犯，那些花言巧語或狡猾的人，有些會帶有一股難以形容的魅力，就是因為他們擁有這樣的磁力。


    他們因為擁有獨特的領袖氣質、願景、又具有說服力，因此會有一定數量的人就像被催眠一樣，受到他們吸引。


    然而，詐欺犯或欲望很強的人，就像在跟魔鬼打牌一樣。前文提過，金錢會像潮汐起落一樣反覆進出，因此他們有可能賺錢，也可能很快就失去，最後因為害怕失去金錢的恐懼，阻止了金錢的流動。'
  merge: -1
  img_proc: true
- pgno: 205
  md: '他們一旦失去金錢，就會想要得到更多，於是磁石再度吸引金錢，一直持續無止境的循環，最後因為某種原因而出現破綻。


    與此相反的是討厭金錢的人，他們會盡量遠離金錢。他們在痛苦的童年時代被教導「金錢是所有問題的原因」，所以認為「錢這種東西還是沒有比較好」，結果他們的人生也就這樣發展了。


    # 成為正面的金錢磁鐵


    好人也有辦法成為吸引金流的強力磁鐵，那就是散發正面能量。以積極向前的態度生活的人，散發出來的正面能量，能夠吸引到金錢。當你覺得自己的工作有趣得不得了，散發出感謝與幸福的能量時，就能吸引程度驚人的金錢流過來。


    最愛做出好菜給客人吃的餐廳老闆，會不斷地召喚顧客前來，將金錢吸引過來。費盡心思清除衣服髒污的洗衣店老闆，一定也能吸引許多固定的客人。


    還有為了正義，熱情參與活動的律師，身邊肯定會有委託人在那裡排隊等候。充滿愛與能量、體貼的人，很有魅力、很吸引人。感覺到非常出色美好的人的'
  merge: -1
  img_proc: true
- pgno: 206
  md: '魅力，並非偶然，而是必然。因為很愛花草，所以帶著滿面笑容製作花束的花店，以及只是當成一份工作，表情陰鬱地包裝花束的花店，你會想跟哪一家買花呢？親切、熱情又熱心的人，會吸引客人、吸引金錢，並不是什麼「魔法」。他們毫無疑問能夠累積財富，就算賺錢不一定是他們的優先事項或人生目的，但是充滿了愛與服務精神的人，能夠賺到超乎原本想像的金錢。


    # 人生各種用錢階段


    # 當收入比支出多


    一般來說，收進來的錢比花出去的錢多的話，會感覺人生過得很順遂。而且，也會對自己所做的事情感覺興致高昂吧。有時總免不了抑制不住興奮，大致上來說，總之是開心的。


    有些人可能會覺得，現在正是人生應該享樂的時候，一直以來辛苦工作，變成了報酬回到自己手上。若是這樣，這表示我們做了自己該做的事——主要是為'
  merge: -1
  img_proc: true
- pgno: 207
  md: '他人服務，帶給他們幸福快樂。


    在這個時期，你也可能認為金錢就像潮起潮落，當然會有出有入，所以有必要為了將來存錢或投資。無論是購買工作用的新機器、學習新的事物、尋找新的興趣，找找看能夠持續回報給他人的方法吧。


    不過，大多數的人在這個時期即便持續有錢進來，也不懂得「善用」或「投資」自己的將來，還以為「這種情況會永遠持續下去」，所以提高生活水準。如此一來，由於持續過著超過收入的生活，應該很快又會為了生存而掙扎吧。


    不用說，一旦染上了浪費的習價，就很難改得掉。特別是明明已經不能再這樣浪費下去了，但是社會或家人卻仍希望可以一直浪費下去，就會變得很辛苦。由於一直以来都是這樣，所以很多人還是會認為可以「吃館子、開派對、送禮物」。


    可是，萬一預計入帳的錢沒有進來，那就會很慘。


    「怎麼回事？為什麼要繳這麼多稅？」


    「怎麼會有這筆醫療費，總共是多少錢啊？」


    會這樣驚訝的人，就是平常沒什麼準備的人。'
  merge: -1
  img_proc: true
- pgno: 208
  md: '# 當收入比需要的金額少


    大多數的人應該都有過這樣的經驗吧，而且極為明顯的，這可能是人生中最可怕的時期之一。在金錢上遭遇到極困難時身體會有的感覺，很多人都清楚記得——胃就像被緊緊揪住一樣痛苦，壓力山大，感覺胸口被壓得喘不過氣來，脈搏也變快了。


    重要的合作以失敗告終，期待已久的費用可能拿不到，或是冰箱、冷氣突然故障了，換一台說不定要二十萬日圓，但是你卻沒有錢。


    或者就像很多人一樣，欠了許多就學貸款或信用卡帳款，覺得永遠都繳不完。


    我們都會面臨這樣的問題，有時會因為你「如何」面對這些問題而帶來正面的結果。


    沒有人能夠免除災難或苦惱，充滿壓力的狀況往往會是你最棒的老師。災難或苦惱會教我們，什麼是我們必需或期望的，大致上能使我們成長。當然，成長會伴隨著痛苦，這種痛苦稱為「成長痛」，每個人或多或少都有過這種體驗。'
  merge: -1
  img_proc: true
- pgno: 209
  md: '如果你單身、過著節儉的生活，你可以過著幾乎不需要擔心金錢的生活吧。


    既然你正在讀這本書，表示你的人生當中，過去應該有過與金錢相關的精神壓力。如果你目前已婚、有小孩的話，很可能就有一定的經濟壓力。


    日常生活中的金錢壓力，一直都在襲擊著我們。隨著孩子長大，想要的玩具突然變得很貴，或是想學才藝、想看演唱會、想買手機或電腦，甚至想去海外體驗寄宿家庭或國外旅行，要求的东西愈來愈花錢。


    要數也數不完，全部都是一些很貴的東西，再加上還有大學學費，你永遠都覺得自己站在挫折的邊緣。目前的工作只要失去一個客戶，或許就會失業，如果夫妻又為了錢花到哪裡再度吵起來的話，可能會馬上離婚。


    但是，請你不要忘記，這種情況是一時的，你的收入提高，問題不一定就會解決。就如同你知道的，錢是一種拿到愈多花得愈凶的東西。


    倒不如說，好好把這段嚴酷的時期，當成一段內省與成長的期間，釐清要吸引人生中的正向金流，你應該做些什麼。首先，請你感謝自己擁有的，然後專注在能夠讓你覺得幸福、充滿熱情又興致高昂的事物上吧。'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# 當收入與支出都增加


    當收支一下子增加很多的時侯，你應該會充滿自信吧。


    度過了前文那段痛苦、嚴酷的時期之後，你學會了無可取代的教訓，此時正好成為助力。你可能已經成為一個可以妥善掌控金錢、善於投資的達人了。你雖然非常辛苦地成長，但相信現在的你，已經不需要那麼辛苦為錢煩惱了。


    跟往昔不同，你現在可以自由選擇。


    你可以泰然應付各種期望與風險，無論要踩下煞車減緩成長的速度，或是踩油門加速，你都做得到。如果決定要踩煞車的話，你毫無疑問可以過著更平穩的人生。如果你有意加把勁，提升人生歷練與職涯，現在就是你採取行動的時候。雖然有風險，但通常帶給你的快樂會比問題多。


    # 幾乎沒有收入與支出時


    這完全就是ㄧ種「休息模式」，很多人應該都經歷過這樣的時期，這通常是'
  merge: -1
  img_proc: true
- pgno: 211
  md: '來自行動力或自主性的不足，於是呈現一種不工作、不與人接觸、盡量不参加活動的狀態。為什麼？可能有些人已經持續奮鬥了許多年，燃燒殆盡了。照理說，應該可以多接一些活動或工作，與精神壓力戰鬥才對。但是這種時候，有很深的心理因素在作祟。


    不認為自己「優秀」、「有價值」，或是「應該接受好評」的人，往往會逃避健康的日常生活，舉手投足都被不安與恐懼支配著。不花錢、也不賺錢，因為這樣就不需要品嚐痛苦的喪失感、成長的苦澀，或是失敗或失望的不愉快了。


    如果你現在剛好就是這樣的狀態，你真的認為你剩餘的人生可以這樣過嗎？


    你難道不曾對這樣的生活方式感到厭煩嗎？


    如果你總是對任何事情都不關心、感覺很煩的話，轉個彎想，或許現在就是你開始做某件事的絕佳機會。採取更多行動，增加你的收入與支出，同時增加你的人生經驗，你的人生才正要重新開始。


    當然，這可能會帶來一點壓力。如果你不賺錢、不花錢的惟一理由，就是要逃避壓力的話，那我會給你這項建議：'
  merge: -1
  img_proc: true
- pgno: 212
  md: '―稍微感覺到壓力，是有趣人生必然的附屬品喔。―


    # 財富包含「存貨」與「流量」兩項要素


    財富包含「存貨」與「流量」。


    「存貨」當中，包含了存款、股票、債券、不動產等，這些是所謂的純資產，也就是具有財務價值的東西。既然有有形的東西，也就有可以被其他東西代替的純粹數位世界裡的數字。活用的資產可以購買食物或其他物品——股票、債券或不動產那樣的資產，可以透過配息或租金創造收入。但是其他種類的資產，例如藝術品、古董車、寶石或黃金等，只有保值作用，如果不賣掉或不交換，就什麼都不會產生。


    「流量」就是你的收入。如果你擁有資產，就可以從資產取得收入；如果你沒有資產，就必須工作賺取金錢。依據你產生的流量多少，決定你的生活品質。如果你能夠創造出快樂、幸福的流量，你的生活就會感覺喜悅、興致盎然。如果你擁有充裕的資產，就可以不用擔心工作。'
  merge: -1
  img_proc: true
- pgno: 213
  md: '在思考金錢的事情時，往往容易把存貨與流量混淪在一起。大多數的人都認為金錢就是流量（收入），並不怎麼注意資產。


    勞動者把工作看成收入來源，在收支管理上，認為收入必須大於支出，不會把「流量」理解為負面的，也就是不認為進來的東西總有一天也會出去。明明沒有任何保證，許多勞動者還是一昧認為「流量穩定的收入，會持續一輩子。」


    他們可能習慣於「我有工作，所以安心了」，之後若被裁員或工廠關閉的話，就會遭受到很大的打擊。如果你能夠理解流量起伏可能相當激烈，應該就會知道沒有永久保證的收入。


    如果你認清「穩定的收入，不一定會持續下去」，就會腳踏實地為將來做準備。


    但是，大多數的人只要目前沒有問題，就不會感覺到風險，主動為將來做準備。家庭教育可能並未教導我們收入起伏才是常態，當我們被灌輸「一去上學，然後找到好工作，一生就會比較平穩」，若是產業受到打擊或自己負責的業務已經不再被需要時，往往如同晴天霹靂。


    「盲目相信」與「真正的信念」是完全不同的。所謂「盲目相信」，就是認'
  merge: -1
  img_proc: true
- pgno: 214
  md: '# 理想狀態：有流量的湖


    為「一切都會順利」，然後只是等著看會有什麼改變發生。「真正的信念」則是意味著相信自己的能力的，為了朝著更正面的方向前進，落實金錢相關知識。


    如果你是自由工作者，應該很清楚工作量是會變動。工作邀約有時好像說好了一起來，然後也像說好了一起不來一樣，所以收入當然起伏不定。


    資深的自由工作者，因為比大多數的一般上班族更有自覺流量是靠不住的，所以會謹慎地為「枯水期」做好準備。生活經驗告訴他們，沒有什麼是保證的，所以不會盲目相信或天真期待保證穩定收入這種事。然而，自由工作者雖然不會像上班族那樣想法天真，但很多時候總是在擔心，這對健康或許也不大好。


    我被問過：「什麼樣的狀態，才是存貨跟流量都可以兼顧？」，那便是有流量吐納的湖。


    「有流量的湖」這個概念，要約來說就是一種豐足的狀態。我們一旦形成豐足的狀態，金錢就會不斷流入，一方面又有充足的儲蓄，可以讓我們長期安穩度日。'
  merge: -1
  img_proc: true
- pgno: 215
  md: '日，這真是最棒的感覺了！


    如果你已經有過這種經驗，應該就會明白，這樣就可以不用每天擔心金錢的出入了。這就像有新鮮的水源源不絕流入，身後一直都有一個裝滿水的豐沛湖泊，你的錢就在那裡。


    相信你也希望自己成為這樣的狀態。為了這個目的，最重要的是，要維持不僅自己足夠，也要能夠給予他人的存貨與流量。


    # 停滯的水：幾乎沒有流動的池子


    就算有充分的存貨，如果沒有什麼流量，金錢就會變成一個幾乎不流動的池子。這麼一來，你很容易就會緊抓著手裡的錢不放，沒有什麼錢進來，也沒有什麼錢出去。一個不流動的池子，會變成什麼樣子呢？池水很容易腐臭。


    這種現象的例子，在文學或歷史中所在多有，狄更斯筆下的「小氣財神」史古基就是經典範例。一個擁有流量及充分資產的有錢人，緊緊抓住自己的錢，走向一生的破滅。失去了對人生的愛，失去了唯一的朋友，惡劣對待自己的員工。'
  merge: -1
  img_proc: true
- pgno: 216
  md: '想讓一池汙水變得乾淨，就只有把水舀出來過濾。如果這池水是你的，你可以把錢用在你很關心的人或慈善活動上。想要過濾你池子裡的汙水，沒有比這個更好的方法了。


    # 如何維持健全的存貨與流量？


    如同前文所述，財富包含「存貨」與「流量」。如果你能夠創造出充分的存貨與流量，幾乎就不會再感覺到跟金錢有關的壓力了。


    雖然金額多寡會因為你的生活方式、需求或優先順序而有所不同，但究竟要如何找出適合自己的實際金額呢？


    如果你把金額設得太高，就會和許多人一樣落入陷阱，即使不停工作也滿足不了。


    應該要有多少資產與收入才是最理想的，我們來預估一下吧。找到一個正過著最接近你理想生活的人，或是你尊敬的人，調查看看他們是如何達到這樣的境界。如果你跟這個人很熟的話，就拜託對方給你一點意見，或許他們會很熱心告'
  merge: -1
  img_proc: true
- pgno: 217
  md: '訴你寶貴的洞見與知識。可想而知，他們並非偶然達到那個境界，而是根據一定的思考方式，在經濟上獲得成功。


    如果你現在在公司上班，感覺不是走在自己喜歡的道路上，覺得自己好像什麼都不會的話，你必須跨出你的舒適圈，找到適合發揮才能的工作。


    請你試著找出一條更有貢獻的道路吧，如果能夠處於令你綻放最閃亮光茫的場所，就會增加你吸引人的力量，你的收入肯定也會增加的。


    # 看清你的理想經濟狀況的祕訣


    要看清你的理想經濟狀況，最好的方法就是在心中描繪五年後的自己。請你花一點時間想像一下——


    五年後，你在經濟上的狀況會是如何？


    你本來想做什麼？


    你要如何發揮才能，對世界作出貢獻？


    你的生活方式如何？'
  merge: -1
  img_proc: true
- pgno: 218
  md: '你正在微笑嗎？

    你幸福嗎？

    在這裡，請你大膽一點想像。某位年輕主婦在心中描繪出成為企業老闆的自己，結果不到三年，她就賺得比她先生還多。如果你能夠想像五年後的自己，接下來就請你想像一下十年後的自己吧。


    現在的我是什麼樣的人？

    我正在做什麼？

    我做出什麼貢獻？

    我擁有什麼樣的資產？

    我的收入如何？

    我正在幫助什麼樣的人呢？


    採取這樣的步驟，你的夢想可能會以預料之外的形式逐一實現。'
  merge: -1
  img_proc: true
- pgno: 219
  md: '# 留意「賺快錢」——通往破產的捷徑


    我指導過很多人關於金錢的事，我問客戶的第一個問題總是：「你是怎麼賺錢的？」有的人是靠價格便宜的產品或服務在賺錢，也有人賣的是高級寶石等高價產品或服務。


    看他選擇的是什麼樣的職業，可以看出這個人的一致模樣。想用自己的方法貢獻，一點一滴建立企業的人，就會選擇小型企業。


    充滿野心的人，就會偏向選擇需要更大花費、風險更高的創業方式。這類工作只要有一次大賣，就可以獲得巨大利益。他們會為了給人好印象而打扮時髦，喜歡穿戴氣派手錶或名牌包等奢侈品，開著高級車到處跑。


    但是，從我的經驗來看，這個「怎麼賺到錢」的問題，直接跟「怎麼失去金錢」連結在一起——用很快的速度賺錢，那些錢也很容易在轉眼間消失。多花一點時間腳踏實地賺錢，就能夠慢慢變成有錢人。


    有很多常見的例子——雖然暫時獲得成功，後來卻破產的大企業家或名人，'
  merge: -1
  img_proc: true
- pgno: 220
  md: '繼承意料之外的大筆遺產，卻在轉瞬失去一切的人，這樣的例子要多少有多少。


    在我認識的人當中，有人明明賣出了一百萬本以上的著作，卻因為一次的投资失利，失去全部的財產。也有人把錢花在新的辦公室和工廠，結果落得身無分文。這些故事給我們的教訓就是：「如果你不小心注意，你賺來的錢很快就會消失。」就跟中彩券的人一樣，如果你不把这些錢當成自己的錢，也就是正當的所有物，是心懷歡喜為人服務誠實賺來的錢，那麼你很容易就會失去它。


    「不義之財必耗盡」就是這個意思。


    # 慢慢賺錢，你會穩定地變成有錢人


    與不義之財相反，如果錢是慢慢賺進來的，一般來說，在事業與人生兩方面都會比較順利。因為慢慢花時間變得有錢的人，傾向長期持有這些錢。


    在短時間內賺到錢的人，很快就會失去賺來的錢，還有一個原因是他們對金錢還沒有做好心理準備。這個時候有用的經驗可能並不豐富，結果太衝動就決定錢的使用途徑，但是有很多判斷錯誤，大部分是被恐懼感驅使的，以過度的興奮'
  merge: -1
  img_proc: true
- pgno: 221
  md: '感判斷所致。


    一般來說，若是因為「害怕」這個理由而決定，往往就會做出糟糕的決定。


    這不是基於認為「機會再多都有」的豐足神話，而是基於「害怕被人超越」的匱乏神話所做出的決定。


    可能出乎你的意料，經營乾洗店也能誕生亿万富翁。乾洗店雖然不像珠寶店那樣擁有奢華的高級感，但是最終的賺錢程度卻不輸給其他的店。和客人要來個好幾趟才賣得出去的珠寶店不同，乾洗店的業務量相對穩定，就算收費便宜，但是每天都一點一點地賺，只要長期持續下去，就能夠賺到不少錢。這一點無論在哪個領域，只要有持續的收入、固定的回頭客，就能夠累積財產。


    所以，如果你想要變得有錢，首先就要以你真心得快樂的事為目標採取行動、持續成長，找到有貢獻的職業。


    醫生、律師、會計師、洗衣店老闆、珠寶店老闆、主廚、作家、花店老闆、藝術家、歌手、業務等，不論你選擇什麼職業，一定都能夠變成有錢人。


    # 重要的並不是「你做什麼」，而是「你要怎麼做」。'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# 前往金錢流通的場所， 很多人


    能量


    錢


    或許要花一點時間，但是為了要得到確實的成功，最重要的是找到能夠讓你的技術與才能展露光芒的位置。就算這件事可能要花上十年，也完全不打緊。找到之後如果順利發展的話，或許會有某種程度的時間差，但是一定能夠成功的。任何人在開頭幾年，成果都不會太好，但是只要成功建立地位之後，Happy
    Money金流就會開始進入你的人生。


    錢會流到已經有能量的場所，不會流到沒有人、沒有任何東西的地方。


    因此，你在紐約、倫敦、巴黎、柏林、迪拜、上海、東京等大都市找到很多生意機會是當然的。


    錢會流到很多人聚集的地方。因為這樣，大都市就變得更大，從郊區或鄉下不斷地把人吸引過去。現在，世界有一半以上的人口住在大都會，預測未來的數十年間，住在都會區的人會增加更多。


    所以，如果你想賺更多錢的話，都市生活會比住在森林裡面更好一點。當'
  merge: -1
  img_proc: true
- pgno: 223
  md: '然，因為網路使得狀況有了一些改變，但是 IT 產業的人才之所以都聚集在矽谷或深圳，就是因為那裡的生意機會就是那麼多。住在這樣的地方，你就能夠輕易見到天使投資者、經營者、行銷人員、公關、工程師等，使得各種事務的進展更加快速。


    # 如何找出適合你的金錢流量？


    有時，當金錢的流動太大、太快，你可能很難享受這樣的流通，會引發嚴重的「活力下降」。想像一下，當收入變成十倍，支出與實務上的問題也會變成十倍。當這一切發生得太過突然，你還沒有做好心理準備的話，就會不知所措。


    可能也有人不知道該如何處理這樣的金流才好。那麼，要如何才能知道最合適你的金錢流量呢？


    那就要看你自己的「感覺」才會知道，這個金額每個人都不一樣。


    有的人每個月只要有三十萬日圓就覺得足夠了，也有人需要更多。有人有很多收入，卻在還沒有弄清楚收入或資產究竟有多少的情況下，就快要被這個責任'
  merge: -1
  img_proc: true
- pgno: 224
  md: '的重量給壓垮了。


    我們還是追求會給你的心帶來平靜的金錢流量吧！


    理解金流的觀念，知道如何成為像磁鐵一樣吸引金錢的人，以及自在過著幸福人生所需要的金錢流量，那麼接下來你該做的事就是，找出適合你搭上的金流。該怎麼做呢？


    試試看就會知道。當你身處於正向金流之中，你會完全埋首其間，因此沒有任何壓力，會感覺時間過得很快，可以自在揮灑自己的技術與才華，能夠真正感覺到自己的工作帶來了變化。


    不可思議的是，你會完全不覺得自己是在工作，真正感受到行雲流水。收取 Happy Money，就跟歡喜遊玩的感覺很像，當你感覺玩得很快樂的時候，就是搭上適合你的金流了。如果你還沒有搭上的話，就繼續尋找吧。


    經濟上很順利、成功的人，大都在快樂的金流中生活。這是因為他們無論做什麼都很容易吸引金錢，用錢的方式也是自己真正覺得快樂的方式。精神上很健康的人，對人生不會有什麼太大的不滿。'
  merge: -1
  img_proc: true
- pgno: 225
  md: '當你對自己的金流狀態感覺很舒服的時候，就能與其他人分享自己的金流。關於金錢，有趣的是，當金錢流通得愈多時，也就是你愈與他人分享，流動的氣勢就愈是增加。


    假設有兩個朋友，一個總是給你機會、給你啟發，介紹客人給你，另一個什麼都不會為你做。


    當你有機會給其中一個人方便時，你會給誰呢？


    善於將這些流量轉給別人的人，就能讓機會、人氣與金錢都匯集到身邊。


    # 找到志同道合的夥伴


    要找到完全適合自己的金流，首先要找到自己的夥伴。所謂「夥伴」，是一群跟你有共鳴的人，對你的行為或個性都有好評。他們支援你，購買你的產品或服務，提高你的士氣，總是為你的成功與升遷加油。你的夥伴不一定要是你的家人，也不一定要在哪裡，想到我們身處於全球化的經濟中，夥伴在地球上的任何一個角落都可以。'
  merge: -1
  img_proc: true
- pgno: 226
  md: '如果知道自己會進入什麼樣的夥伴圈，人生就會更輕鬆一點。有很多種形式，可以是有藝術家氣質的夥伴、學者氣質的夥伴，或是有企業家性格的夥伴。無論是什麼樣的圈圈，只要能夠成為其中一員，大家可以分享許多東西，就像回到故鄉一樣親切。


    夥伴會認同你的感覺或行為，更重要的是，他們認同你的個性。跟夥伴在一起，你會覺得很放心，有融為一體的感覺，無論什麼你都很自然可以做到。


    # 放掉不需要的東西，只做自己最喜歡的事


    經常感覺自己「應該得到更多」，是一種很危險的生活方式，因為你不可能永遠都能持續獲得更多。但是，大家都會感覺到這種壓力，每個人都会想要更多。


    最近老是抱怨「回家後很無聊」的小孩增加了，父母都在想必須要讓孩子覺得更有趣一點。不少父母都感受到必須多賺一點錢、更常到外面的餐廳吃飯、彼此多給一點的壓力。對於不能給予他人更多，我們經常會有罪惡感。每個人在某種程度上都在「追求更多」，卻難以表達自己的情感。就連我們的導師或我們當'
  merge: -1
  img_proc: true
- pgno: 227
  md: '作楷模的人物，都在努力想要得到更多。


    然而，時代逐漸改變，有人開始對這樣的生活方式感到厭煩，特別是年輕人，這種傾向非常顯著。


    做自己最喜歡的事，和把不必要的東西放掉，兩者不見得矛盾。停下腳步，思考一下你真正想做的事，只要往那個方向前進就可以了。


    只做自己喜歡的事，只在自己喜歡的地方，跟自己喜歡的人交往。想像一下這樣的人生，你會比以前過得更不幸嗎？或者滿足於比以前擁有的更少呢？


    # 創造你的金流，建立你可以依賴的人脈


    你並不需要擁有很多，才能開始創造自己的金流。白手起家成功的富豪在創業初期，也都沒有擁有很多。


    他們為什麼會成功呢？


    那是因為他們一直用現在擁有的東西去交換更好的東西。一開始雖然是從分享自己的心與熱情開始的，但是人們最喜歡支持熱情的人，無論走到哪裡，熱情'
  merge: -1
  img_proc: true
- pgno: 228
  md: '的人都能夠得到充分支持。我們看到拚命努力的人，就會想要幫助他。

    我完全不擔心錢的事，不是因為我有很多錢，而是因為我有很多很棒的朋友。前幾天，我數了一下自己有幾個可以信賴的朋友，有五十個以上。就算我失去所有的財產，只要我到任何一位好友那裡，都能拜託他們「讓我借住一個星期」。拜託人家讓我借住，借住期間我會替他做保母或家事，靜靜聽他們傾訴人生的煩惱。我會當一個很好的寄居者，我很擅長打掃廁所、浴室、洗碗、換燈泡，然後下一個星期我再到別的朋友家去。

    經過一年（五十二週），我就回到第一個朋友的家，說聲：「好久不見！最近還好嗎？」，然後再開始新的一年的寄居生活就好了。

    這麼想的話，就算我完全沒錢，只要朋友的人數足夠，就可以在維持平安與和諧的情況下，過完剩餘的人生吧？雖然這有一半是在開玩笑，卻也是事實。大部分的人可能會說我沒有五十個好友，或是在自己的國家要做這種事很困難。或許確實如此，但是你可以從小事開始，先去交五個或十個新朋友吧。然後，請你想像一下，你一個一個問他們：「可以讓我借住一個月，直到我可以重'
  merge: -1
  img_proc: true
- pgno: 229
  md: '「新展開生活嗎？」


    我這麼提議，不是在提醒你没有幾個可以信賴的朋友。我想提醒你的，是，希望你學習信賴不依靠金錢的人生，至少是作為心理上的訓練。當然，你應該不需要一整年都仰賴朋友們過活，但是若你能想到不需要自己一個人背負人生的重擔，應該就能夠放心一點。


    你害怕的並不是失敗或失去金錢的情況，你害怕的是一個人孤零零、沒飯吃、活不下去。如果能夠確信即使你沒有錢，也有支持你的朋友或家人可以依靠，就沒有什麼可怕的。你會覺得歡喜與感謝，每天都充滿幹勁。


    很多人都被自己的恐懼綑綁，因為恐懼，無法辭掉討厭的工作。如果失去現在的工作和收入，就怕會活不下去，很多人都是這樣告訴自己的。然而，一定真是這樣嗎？


    答案是否定的。只要你願意，一定會有可以抬頭挺胸活下去的辦法。


    首要是步驟，就是，從不同的觀點來看事物。


    真正的安全感不在於擁有多少錢，而在於有沒有可以彼此信賴的人。'
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 信賴金錢的流通，就是信賴人生


    你應該已經明白，信賴金錢的流通，就是信任自己的將來。你現在應該也隱約察覺到，你會感覺不安，並不是對金錢的不安。你對將來不安，你擔心目前擁有的錢是否能夠維持下去，或者是否能夠持續賺到不愁吃穿的錢。太過擔心的話，就會有一種好像要喘不過氣來的感覺。


    如果了解這種心理機制，就知道必須面對「信賴」這個課題。如果不能信賴金錢的流通、不能信賴人生，不論你擁有多少，或是存了多少，都無法真正消除你的不安。


    如果你能夠信賴人生與將來，你對金錢的不安就會消失。這是因爲你可以依賴自己，也有支持你的人可以依賴。


    請試著信賴人生的過程吧。如果感覺平常的流程好像哪裡變調了，那就是嘗試新物的最好機會，或許該是創造其他流程的時候了。要是覺得路走不通了，就向你能夠信賴的人求助吧，一定會有幫助你的。'
  merge: -1
  img_proc: true
- pgno: 231
  md: '如果你不求助的话，谁也不会认为你需要援助的。确实，求助是很困难的事，但是不想办法得到必要的援助，可能是因为恐惧或不安，因为你害怕别人怎

    么想，你在意别人的评论。

    所以，有必要再次把恐惧化为信赖，请试着相信人是善良的、会帮助你的。

    人类最喜欢帮助别人，这世上的好人比你想的多。只要你放下顾虑求助的话，整个世界都会来帮你，你会发现幸福、温柔的人很多。

    我花了很长的时间学习「如何寻求支援」，起初觉得很不好意思，也有点犹豫不决，但试了之后觉得很快乐，结果经常十分惊喜。

    未来该往何处，会变成什麽样子，我们都不知道。某种意义上，是把自己交给未来。如果把自己交给人，奇迹就会发生。你应该听过有人求助、诚心祈祷，结果奇迹般地救起。一旦体验过，你的世界就会整个改变。


    # 创造幸福金流，你能做的十件事


    如果你不觉得自己置身在 Happy Money 金流中，让我分享能够马上创造出幸'
  merge: -1
  img_proc: true
- pgno: 232
  md: '福金流的方法吧。接下來就談談創造Happy Money金流的十種方法。


    # ① 捐款


    捐款贊助慈善活動，是感覺 Happy Money金流最簡單的方法。不需要捐大筆金錢，就算只是零錢的小額捐款也有效果，心情會變好。捐款贊助慈善活動，會將你已充分擁有的這個訊息，傳送給你的大腦跟四周。因為你擁有的很多，所以不必害怕。找出對你有意義，符合你的信條的團體或慈善活動提供援助吧。


    # ② 給朋友錢


    過去或許曾經有人跟你借錢，或是要求你捐款或投資。送給重要的人的錢，永遠都是 Happy Money。每個人人生中都會有需要錢的時候，在你擁有充分資產的情況下，不妨把一部分的錢給需要的人吧。我有很多次把錢給了身邊在追夢的人，沒有什麼比自己的錢可以幫助別人、支持别人的生活感覺更好的了。'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# ③送禮物給朋友


    送禮物給朋友是很快樂的花錢方法。我家有個櫃子專門用來放禮物，全家人一起出去買東西的時候，大概都是為了買禮物送給朋友。


    前幾天，我和妻子一同去購物，我負責付錢跟提東西，回到車上的時候，雙手提滿了購物袋。跟一些小東西合起來的話，大概有十袋以上吧。每一袋都不是我們自己想要的東西，所有的東西都是禮物。我們在購物時，沒有找到自己想要
    的東西，反而看到很多可以送給親友的禮物。看著那麼多的袋子，兩個人笑了起來，但是感覺很幸福。


    不刻意買什麼高價的禮物，小盒的花草茶也是很氣派的禮物。買禮物送給別人，會讓別人感覺幸福，你也會很幸福！


    # ④多給一點


    給別人東西的時候，就往多上多加一點吧。人在需要求助或是借什麼東西的'
  merge: -1
  img_proc: true
- pgno: 234
  md: '情況下，都會對自己沒有感到羞恥，因此要求的大多會比實際需要的少一點。所以，如果有人來找你拜託什麼事情的話，先了解他為什麼需要，然後比他要求的多給一點。如果來拜託你借一支筆的話，給的時候就加上筆記本吧。


    如果你是老闆雇用新員工，發薪水的時候就比他預期的金額多給一些些。如果你提供客戶服務，想想是否可以提供什麼免費的服務。還有，簽約時加上對方有利的條件，對方就會工作得比平常更開心。


    無論在什麼狀況下，多給一點，就可以把充滿不安的退縮能量，變成積極向前的力量。對方會有自己受到重視、被愛的感覺，這等於是對自己及身邊的人精神穩定的一種投資。


    # ⑤多付一點


    關於這點，很多人時常感到驚訝。我在收到帳單的時候，都會盡量早點支付，有時還會比帳單金額多付一點，以表達感謝之意。很多人對這樣的行為感到驚訝，表示「工作到目前為止，從來沒有收過比帳單上還多的錢。一短收就會火'
  merge: -1
  img_proc: true
- pgno: 235
  md: '大，多收就會吃驚。


    我多付一點錢，光是看對方的反應就覺得很開心，因為人們不習慣收到別人多付的錢。我感覺「改變給予和接受的既定觀念」是自己的目標，所以非常享受多付一點錢讓對方嚇一跳的樂趣。


    # ⑥ 送禮物或卡片給客戶或上司


    我們往往很容易忘記，自己一直能從客戶或上司那裡拿到錢，是多麼大的奇蹟。他們其實可以選擇支付金錢給別人，但是他們找到你、選擇你。舉例來說，如果你經營乾洗店，客人明明也可以去別家店，卻來到你的店裡。


    你可以送卡片或一點小禮物，表達一下感謝的心意。我每次去書店在店裡閱讀的時候，總是被那麼多個書架給震撼到，感覺眼睛都要花了。在那麼多的書本中，到底是怎麼樣會選到「我的書」的呢？在數十萬本書當中，能夠找到我的書買下來，首先就令我覺得是不可能的任務，因此我真的由衷感謝各位能夠閱讀我的書。'
  merge: -1
  img_proc: true
- pgno: 236
  md: '我會舉辦免費的演講作為送給讀者的禮物，或是贈送特製的筆，都是想要表達我的感謝之意。


    你也一樣，為了對客戶表示感謝之意，送點什麼給客戶吧。如果你在公司上班，請你用某種方式表達對上司或同事的感謝之意。


    有趣的是，如果你持續表達感謝，對方就會記得你的感謝。如果有什麼好的機會，他頭一個想到的就是你，很可能会第一個邀請你。


    # ⒄收到錢，就真誠表達歡喜


    大多數的人收到錢的時候都會很高興，卻恥於表現出這樣的心情。大部分人無論發生什麼事都會壓抑情感，被教導要避免談到錢的事情。即使覺得生日收到禮物開心一點無妨，但是收到錢的時候，卻不知道為何就不會這樣。


    下次如果有機會收錢，請你一定要表達出高興的心情。收到錢表達出高興的心情，對方就會想要再給你錢，讓你開心。因為看到別人露出高興的表情是很快樂的事，所以如果收到錢，把這份喜悅的心情傳達給對方知道，是很重要的事。'
  merge: -1
  img_proc: true
- pgno: 237
  md: '不久前，我在美國的超市櫃檯拿到兩美元的折價券，不由得喊出來：「哇！好開心。」不知道是不是因為歡喜看到我快樂的表情，站在旁邊的女性就把她的折價券給我了，我想應該是想看我拿到折價券高興的臉吧。當然，我也讓她看到我了特別開心的笑容。


    你是否也曾經為了讓認識的店主高興而去買東西呢？雜貨店也好，小小的餐館也罷，人會因為想要看到老闆歡喜的笑臉而去光顧。從他人手上收到東西的時候，表達真誠的歡喜、以笑顏回報，是一直保持豐足金流的好方法。


    # ③用錢的時候，祈禱對方幸福


    這是從某位導師那裡學來的。我在用錢的時候，總會在心中自言自語：「希望我的錢，能讓你和你愛的人幸福。」祝福收了你的錢的人，可以拿去用在購買食物或娛樂上。在使用金錢的時候，請你總是祈禱對方或那家公司可以幸福快樂。


    用你的錢去祝福某人，就意味著你創造出 Happy Money 金流。在你入睡之前，你可以回憶一下當天你曾經付錢給誰，想像一下對方發生了什麼很美好的'
  merge: -1
  img_proc: true
- pgno: 238
  md: '事。若是以這樣的姿態生活，別人就會發現你是個怎樣的人。不必特意說明，別人就能感受到你溫暖、體貼的能量。


    ⑨喜歡那個人，就去他店裡消費

    網路購物盛行，在線上購物的機會大增，但是實體店鋪買東西是很有趣的事，所以購物中心和一些小商店仍然存在。如果我們一直持續用網路購物，實體店鋪很快就會完全消失了，特別是那些對人們的幸福或生活上來說不可或缺、由在地家族經營的商店就會消失了。


    但是，到處都還有實體商店，肯定是因為人們還是「想要看到實際商品，想和店員說說話，得到活力。—我們都會想在有各種不同的人在的地方、有重大能量的地方，與人產生聯繫。


    在喜歡的人在的店鋪買東西是很快樂的事，就算知道在別的地方買、價格會更划算也不在意，還是會一直想在喜歡的人那裡消費。這是因為我們想讓他人幸福，想讓這個富足的金流一直持續下去。所以，去購物的時候，就去你喜歡的地'
  merge: -1
  img_proc: true
- pgno: 239
  md: '# 感謝所有的一切！


    方，從喜歡的人手中購買吧。買完之後的心情，一定會比從你不喜歡的人或店裡購買好得多。


    網購也是，可以在你偏好的網路商店買。在你喜歡的網路商店買，因為流動的是 Happy Money，就會有幸福的感覺。


    我從我的導師竹田和平先生那裡學到了創造富足，持續保有富足的深刻教诲。竹田先生以前曾對一個前來拜訪的男人，說出自己嘔心瀝血的想法。那個男人背了債，有金錢上的困擾。竹田先生對他提議：「那我就買下你十萬次的『謝謝』吧！」為了這個，他就必須連續好幾個月，整天都要一直說「謝謝」。那個男人回答：「我試試看。」最後，他去找竹田先生的時候，已經不需要借錢了。為什麼？因為他說了好幾次謝謝之後，已經得到「感謝一切」的心態態度這個成果了。


    像這樣，總是把感謝掛在嘴上，就會向全世界發出強勁的能量。我們存在於'
