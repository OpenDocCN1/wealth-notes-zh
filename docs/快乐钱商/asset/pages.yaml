- pgno: 150
  md: '# 金錢與人生的關係


    「錢有兩張臉，就跟硬幣有正反面一樣。一張是上帝的臉，另一張是惡魔的臉。」


    我小時候某天在吃晚飯時，表情可怕的父親曾經這麼對我說。


    父親如果心情好的時候，會在飯桌上跟我們談一些生意、金錢、政治，以及世界動態等的話題。但是，那天的話題，總覺得跟平常的感覺不同。不知道是不是因為他講話的語氣，讓我有種聽到小孩子不能聽的話題的恐怖感，背脊感到一股涼意。


    我一看電視，父親嘴裡就一定會說著這句話：「錢啊，擁有讓人瘋狂的力量，不能不小心啊。」


    確實，我們看到很多電視劇的劇情都有演，會覺得金錢擁有誘人走上邪惡之


    認真的卻沉迷於賭博，不知不覺就變得債務纏身，這樣的故事你應該聽過吧？利用職務之便盜領、收賄、詐欺……有時還發展成暴力事件或殺人事件。'
  merge: -1
  img_proc: true
- pgno: 151
  md: '不過就是為了錢，為什麼會變成這樣呢？


    就如我父親說的，金錢擁有一種危險的力量，可以將普通人俘虜之後拖進一個瘋狂世界。


    犯罪嫌疑人的鄰居或朋友，總是這樣回答新聞節目記者的訪問：「如果他沒有因為錢而失去理性，我一直認為他是個沉穩的好人。」


    縱使沒有犯罪，每個人也一樣不免都會受到金錢壓力的影響，每個人都有可能因為金錢而活得不像自己。


    最常見的例子就是，為了還清貸款，勉強為其難一直做著自己不想做的工作，或是對客戶或上司說著言不由衷的恭維之詞。在決定生活方式時，如果不能認識自己受到金錢多少的影響、如何被金錢限制的話，就無法從金錢的支配下逃脫。


    想要有效逃離金錢的掌控，就必須對自己是出什麼樣的姿態與金錢交往有自覺。你可以決定自己要從這兩者中採取哪種立場


    「充分利用金錢的功能」，或是「被金錢奴役」。'
  merge: -1
  img_proc: true
- pgno: 152
  md: '# 為什麼人會被金錢控制？——面對過去


    我女兒在上幼兒園的時候，我每週有幾次會到女兒班上當志工爸爸。照顧孩子、守護孩子們的成长，是很快樂的事。


    就在某年聖誕節即將來臨的一日午後，我和一個小男孩談起了聖誕禮物的話題。


    > 「你得到什麼禮物？」我問。


    那個孩子這麼回答我：「什麼都沒有。」


    我做夢也沒想到會是這樣的答案。這孩子今年被聖誕老公公列在壞孩子的名單上嗎？說不定他不相信紅鼻子麋鹿或聖誕老公公身邊幫忙的小精靈的故事……。


    > 因為我很在意，於是就問了：「為什麼？」


    > 「因為我們家很窮呀！」


    > 很窮？


    這個六歲的小男孩，年紀小小就理解社會或經濟問題的可能性，究竟有多少？這麼想著，我便問他懂不懂「貧窮」是什麼意思？他其實不太懂。'
  merge: -1
  img_proc: true
- pgno: 153
  md: '「那這句話，你是從哪裡學來的？」

    小男孩說是媽媽說的。

    他媽媽告訴他：「我們家很窮，所以聖誕老公公不會來。」

    我們總是不知不覺就受到父母引導而相信「我們沒有錢」，父母說：「錢永遠都不夠用呀！本來就是這樣。」


    大概從六、七歲開始，很多人就在心裡留下跟金錢有關的陰影。從那時起，父母說出的一些不平不滿的言論，開始會聽進你的耳裡，你可能開始跟班上同學比較起家裡房子的大小、穿的衣服、父母開的車子等，開始理解父母的經濟狀況。

    如果同學或朋友擁有的比自己的多，或許你就會覺得失望。


    到了十歲的時候，已經能夠理解自己的父母在社會上的地位，開始「面對現實」。如果有更多錢，就能買更好的東西，就能得到更多認同，就會變成更受歡迎的人，自己喜歡的人或許也會注意自己……。

    到了十五歲，除了不關心金錢型的人，大多數的人都會開始思考錢的事情。


    要是能夠得到多一點的錢，大概都會願意做一些事，像是幫忙做家事等來提高零'
  merge: -1
  img_proc: true
- pgno: 154
  md: '# 第3章 金錢與你的人生：你在用錢，還是被錢所用？


    用錢，或者開始在外面打工。

    還有，有了喜歡的人，可能會想要展開禮物攻勢，或是用時髦的服飾打扮來吸引對方，金錢就不再是單純的數字，而是成為可能影響人際關係或男女關係的重要工具。

    到了成為某個年紀的成年人之後，有了男女朋友，兩人之間往往會經歷經濟上、社會上的隔閡。很多時候，會想要約對方到某個很棒的地方約會，卻可能感受到金錢上的壓力。若是帶對方到不相稱的餐廳，或是送了廉價的禮物讓對方不開心，應該沒人會想要做這種明顯呈現彼此有多不合適的事情吧。


    # 更有錢，就會有更美好的人生？


    以前曾經有位年輕女性，跑來向我抱怨她對當時男友的不滿：「我以為可以收到更貴一點的禮物，他卻只會送我便宜的禮物……」他應該不是我命中注定的對象。在物質上和精神上都看重我的，才是適合我的對象。──就像這個內心不滿的女性一樣，很多人都被灌輸了「更有錢，就會過著更有'
  merge: -1
  img_proc: true
- pgno: 155
  md: '愛、更美好的人生」這種觀念。所以，我們用功讀書進了好的大學，找到很好的工作，一定要盡量賺更多錢……從小時候就被教導要相信這樣的事。


    然而，很多人卻無法察覺，拚死拚活以往上爬為目標，就算死前爬上了那道階梯，實際到手的卻非常少。


    拚命攀爬階梯的我們，到了三、四十歲之後，才終於開始發現自己弄錯了什麼。可是到了那個時候，怎麼也繳不完的房貸、車貸，還有信用卡帳款等，各種生活上的束縛已經把很多人綁得動彈不得。


    終於，小孩子也都到了上大學的年紀了，每一個都說想上好一點的大學，於是父母就更加被金錢綁死了。然後在不知不覺間，對原本嚮往的兩週休假，開始變得比「期待」更多的是「花錢不安」。


    在內心深處，即使感覺「好像哪裡不對勁」，也因為總是太忙了，根本沒有餘裕好好思考究竟是哪裡出了問題。'
