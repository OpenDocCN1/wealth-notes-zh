- pgno: 68
  md: '# 金錢的三大功能


    錢是什麼？之所以會愈來愈不懂金錢的意義，是因為情感上變得緊密相關的緣故。只要扯上錢，或許很容易讓人覺得焦慮不安，或是任憑擺布的感覺，甚至經常會有一生很不公平」的想法，覺得「自己沒有價值」，受到打擊而深感無力，認為別人擁有的比自己多很多。


    這種種的情緒，都是因為金錢擁有的各種不同角色所引起的。簡來說，金錢的主要功能有三種。


    # ①交易的功能


    金錢的這個角色，大多數人應該都知道吧。


    我們用錢交換東西，也許是食物，或是火車票或一小時的按摩等。


    交易的功能賦予金錢力量，一旦拿到錢，就覺得可以用來交換任何東西。為了生存，我們需要食物、衣服、住所，所以要有得到這些東西的手段，金錢就是'
  merge: -1
  img_proc: true
- pgno: 69
  md: '其中一種。如果沒有足夠的錢換取必需品，就會憂慮不安，感覺彷彿自己或家人的生命遭遇危險。跟錢有關的所有事物，無論是賺錢或花錢，很容易都會成為精神壓力。


    # ②儲備的功能


    人們會想要一直謹慎持有金錢的理由之一，就是想要永遠慎重地守護金錢的價值，甚至擁有自己定義的價值。石器時代的人獵到了巨大的長毛象，獵到的象肉吃不完，如果没有想出方法保存剩餘的肉，這些肉就會腐爛，花了好幾個月追捕獵物的辛苦與努力就會白費了。為了把辛苦努力過的美妙成果保存下來，他們必須把肉儲存下來，或是拿去交換，同樣的道理適用於很多事物。


    我們都不希望自己的工作白費，都希望能够確實地把價值保存下來。賣力工作一週後，就會期待符合這些努力的錢，能夠進到銀行戶頭裡去。多年辛勤認真工作後，就會期待存款增加，也就是說我們都想得到與生涯發展相應的東西，希望從中找到某種意義。在好幾週、好幾年拚命工作後，如果沒有得到相應的東'
  merge: -1
  img_proc: true
- pgno: 70
  md: '西，可能就會失望、沮喪，覺得一切都好像沒什麼意義。我們把人生的價值跟財產的價值畫上等號了。


    # ③增長的功能


    這就是資本主義的核心，存錢生息，投資得當資產就會成長，所以比較有錢的人就能夠得到更多錢，有錢人會更有錢。這個概念讓一般大眾感到驚惶失措、甚至沮喪，如果沒有錢的話，再怎麼拚命努力工作，也不可能多成功吧。還可能感到很空虛？每到月底，把各種帳款支付完畢後，沒剩下多少錢可以拿去投資，更不知道該怎麼做，才能有一筆足夠的錢讓資產開始滾動成長。


    由於錢的這項功能，使我們在金錢遊戲開始之前就已經失去信心，覺得形勢對自己不利。但就算你真的這麼想，「想要多賺點錢」或「想要錢」的想法卻不會停止。


    既然錢的事這麼麻煩，為什麼我們會這麼想要錢？'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 人們想要錢的六個理由


    幾乎人人都会想要更多的錢，你隨便抓個人問：「你最想要的東西是什麼？」，很多人都会回答：「錢吧！」，至於實際用途事後再想就好。


    我們為何會那麼想要錢？讓我們一直認為自己很需要錢的原因，從根本上挑動我們的究竟是什麼？


    > 「為什麼我會想要錢？」


    如果可以客觀思考這樣的心理活動，就會把錢當作必需品，比以往更加認真看待，減少跟錢有關的精神壓力，這才是可以有效脫離金錢支配的方法。


    為什麼人會想要錢，長年下我看過很多理由，我發現其中有幾種非常清楚的模式，我想以「人們想要錢的六個理由」來談談這些模式。


    想要錢的時候，思緒會一直打轉，若無視內心真正的感覺，就可能陷在不了解自己真正需要什麼的情況下企圖得到金錢的惡性循環中。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '# 理由① 為了維持基本生活


    每個人都需要住處、衣服、食物，還有料理食物的方法。以前人們以豐饒的農地或森林為生活根據地，現在則是透過金錢供應各種必需品給我們。當被問及為什麼要工作時，大部分的人都會回答「要吃飯啊！」但是，生存下去的最低限度必需條件是什麼，我們其實不見得清楚。


    我看過許多人雖然得到充裕的薪水，卻總是覺得好不容易才能有飯吃、有個遮風避雨的地方。我看這樣的人的花錢方式，像是買下很勉強才能買得起的房子、付出高額車貸購買新車，只要手上一有錢，幾乎都花到吃喝玩樂上頭，家裡多半充滿了不需要的東西。


    問題出在很多人都認為「有錢」生存，所以感覺好像需要什麼的時候，總是很衝動地依賴金錢，用錢買下一些其實自己並不真正需要的東西。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# 理由②為了得到力量


    金錢常被認為擁有隨意操縱人心的力量，會認為有錢就有力量是很正常的。


    就算金錢擁有力量，也不是什麼都可以隨心所欲辦得到，不一定保證幸福。


    把金錢跟力量混為一談，絕對無法滿足各種欲望，你永遠都會被覺得力量不夠，甚至錢不夠的想法束縛。


    另一方面，就像有些人永遠都很有錢，有些人永遠都擁有強大的力量。


    當這種容易令人類廢、一旦入手就很難放開的力量，會帶給你各種負面情感，在日常生活中反而變得不感到真正的幸福了。


    偶爾我會遇到野心勃勃的年輕人，說有一天要建立企業帝國，登上世界首富排行。


    但是他們未必真正知道，即便驚人的財富能為他們帶來某種程度的力量，但是錢財無法取代優秀的人格、信用和真正的愛。


    光靠金錢掌握人心並不可靠。


    在商場上或公司裡就算擁有權力，但在十分親密的人之間，或是一旦面對自己的內心時卻施展不開，像這樣的人我看得很多。'
  merge: -1
  img_proc: true
- pgno: 74
  md: '# 理由③ 為了給別人好看


    有錢人也好，窮人也好，每個人都可能被別人欺負。窮人的話，可能會認為是被人奪走特別的樂趣；有錢人的話，可能是被同樣有錢的人取笑、排擠。覺得自己被社會藐視的人，經常認為錢是可以報復那些疏遠自己、折磨自己的人的手段。


    但是，傷害你的人，其實在你的腦子裡，為難你的人正是你自己。你可能會為了跟別人比而買東西，但是你並不知道，實際上根本就沒人在跟你比。即使沒有餘裕買一些非常高價的東西的人，有時也會拚了命利用有形的東西來炫耀自己，別人厲害，這些都是極為朋友之間的事。


    有些暴發戶會炫富，掩飾自己缺乏自信，但是這樣的人再怎麼賺錢花錢，也無法透過這種方式建立真正的自信。不論經過多久，還是會覺得被人瞧不起，覺得人家在背後說壞話。'
  merge: -1
  img_proc: true
- pgno: 75
  md: '# 理由④ 為了找到自由


    有些人認為，金錢可以買到自由。聽到「自由」兩個字，一般都會想像就是不需要工作，可以到世界上任何地方，隨心所欲過活，去做任何自己想做的事。


    然後，要像那樣自由的生活，就需要非常多多的錢。


    可是錢卻買不到自由，即便擁有全世界所有的錢，只要你的心不自由，就沒有辦法發揮這些財富的真正價值。如果你在此刻沒有找到自由，就算你中了彩券，或是繼承了大筆遺產，也必定會再回到跟現在同樣的心情。


    花錢可以買到一時的幸福感受，但如果不是打從心底得到滿足，真正的自由就會從你的手中一溜煙地溜走。


    很多人擁有的自由和機會，其實比他們以爲的多。如果一心認為「自己只有一點點存款，所以沒有自由」，是很難抓住幸福的。從事高薪工作、簽下大筆契約、中了彩券，這些都不是通往自由的道路；要得到自由，需要的不是比目前更多的存款金額。'
  merge: -1
  img_proc: true
