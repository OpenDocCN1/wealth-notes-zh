  img_proc: true
- pgno: 342
  md: '# 同事真心对你好，还是别有用心？


    刚到一间新公司任职时，同事、主管向你介绍环境、着手教育训练，助新人快速上手。有些前辈给你严格印象，也有些人展现亲和力，帮你融入新环境。不过，如果身边的人明明还不熟，就过于积极表示善意，不见得是件好事。


    职场新鲜人小蔡，就感受到人情冷暖变化。到职后，同部门的老刘，每天提点他工作进度、注意事项，甚至告诉他哪一家便当店比较便宜，「对我真的很不错。」岂料，小蔡认识其他人后，才发现老刘个性偏执、受多数人排挤，'
