  md: '在堪称经典的商界名言中，有句话：“一头绵羊带领的一群狮子，却敌不 过一头狮子带领的一群绵羊。”它几乎是一针见血地点出了领导力对一个企业发展的重要性。很多人渴望成为一个领导，似乎这样可以唤风使雨。但当你真正登上企业领导宝座的时候，你就意味着从此不可以高枕无忧了。因为一旦成为领导之后，你必须致力于赢得团体成员的接纳，并发挥你潜在的影响力。


