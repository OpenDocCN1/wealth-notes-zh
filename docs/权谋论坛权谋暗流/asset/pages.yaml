    据说一次姜太公几十万大军讨伐纣王，大军攻敌数日不克，粮草将尽。一副将进帐面对所有战将向姜太公禀报说：我军粮草用完了，大军要挨饿了。众将一听大惊失色，姜太公临危不乱大声说：谁说我军粮草没了，如此扰乱军心者推出去斩了，以后谁再谎报军情乱我军心者于他同样结果。'
  merge: -1
  img_proc: true
- pgno: 103
  md: '稳住几十万军心后，姜太公一即可召集核心将领开会，下里死命令要求两日内必须拿下敌军城池，结果不出两日果然拿下城池，粮草危机自然解除。但坦白说副将报告的是事实，说的也是实话，可是却被斩首实属冤屈，但面对几十万大军在生死存亡的关键时刻，冤也得杀，
    杀一人能震三军，杀一人能救三军，为几十万人马杀一人，这便是帝王将相统兵之道。


    企业中好多大智大爱之心的老板，也曾为企业上千员工命运，为企业的生死存亡开除触犯原则的曾经的功臣曾经的兄弟，也是绝不手软，'
  merge: -1
  img_proc: true
- pgno: 104
  md: '绝不为情所困。


    能人中的首善要大肆表彰，能人中的首恶要坚决拿下；首善不宏扬，正气无法上升，首恶不拿下，公司将滋生众恶。不受制于能人最好的办法就是培养更多的能人。拿下一个能人的杀伤力比拿下十个普通人扫清执行障碍的力度还要大。


    面对能力低下的员工，我宽容你，给你面子，你会得到暂时的快乐，但是你最终会走向弱小；我批评你给，不给你面子给你压力，你会有暂时的痛苦，但你最终会走向强大。'
  merge: -1
  img_proc: true
- pgno: 105
  md: '管理者常为情所困，尤其在面对老员工和亲人团队的时候，难免产生保护欲，这是人之常情，但是，在此处投入过多感情，会令其他员工产生负面情绪，真正的王者，不会因个人感情而影响大局，任何时候，都要把团队利益放在第一位。


    帝王术


    第一种胡萝卜：天女散花


    天女散花是在中国地区广为流传的很讨人喜欢的神话故事。对于企业管理者而言，这种招'
  merge: -1
  img_proc: true
- pgno: 106
  md: '法是一种不需要花钱，但效果却非常绝妙的胡萝卜。其原因很简单：作为管理者，您可以四处转转，这里一句夸奖，那里一句表扬，就能使员工的内啡肽增加。而内啡肽能够让员工兴奋不已，从而可以提高员工们对痛苦的承受能力。很自然，他们会因此而加倍努力工作。


    # 第二种胡萝卜：表示关怀


    当领导开始关怀部属的私人生活时，马上就会和他们形成某种特殊关系。这种特殊关系，不仅可以让部属们不要钱而多干活，甚至在关键时候能使他们去勇敢地从事异常艰巨的工作。'
  merge: -1
  img_proc: true
- pgno: 107
  md: '在中国许多历史题材的影视作品中，就经常出现这样的镜头：


    在一间密室里，一位领导模样的人神色凝重地问道：“张三，我待你如何？”


    张三立即表示：“大人待我恩重如山！”


    领导继续问道：“有一件事，不知你能否完成？”


    张三也不问是什么事，首先表白自己的忠心赤胆：“大人但有差遣，张三万死不辞！”真是恩'
  merge: -1
  img_proc: true
- pgno: 108
  md: '之所至，士卒赴死。


    # 第三种胡萝卜：假装关怀


    如果你对员工的私人生活（家庭、婚姻、健康、以及个人动态）一点兴趣也没有，这一招对你就非常实用。你可以用一些巧妙的方法，一方面让员工为你假装的关怀感激涕零，另一方面你也可以避免去听一些你不愿意听的冗长乏味的故事。


    有一个好办法是这样的，你兴致勃勃地开车经过员工身边大约 100 米距离，冲着他大吼一'
  merge: -1
  img_proc: true
- pgno: 109
  md: '声：“你家里还好吗？”这样，你就可以用最大的音量来表达你的关怀，人人都知道你很关心他，又不用去听他唠叨。


    尤其是逢年过节，许多领导都擅长玩这种把戏。


    假如你觉得日久天长换回别人对你的假情假义那也没什么，假如你认为相互的真诚没什么可贵和重要的，你也大可以玩玩这种把戏，有时或者说短时期内还是非常有效的。


    # 第四种胡萝卜：具有特殊意义的礼物'
  merge: -1
  img_proc: true
- pgno: 110
  md: '尽管生日贺卡只是一张硬纸，然而，如果上面有你的签名就会让员工倍感荣幸。同样的道理，到商场买一条领带只需要几十元（找领带批发商订货就更便宜了），一旦它成为荣誉的象征，就意味着一种不寻常的价值。


    假如某个员工开发了可为公司赚取数千万元的新项目，你可以用这种方法一箭三雕：开一个表彰大会，把那条领带大张旗鼓地奖给他。


    这么郑重其事有三个好处：一是使得那条领带看起来像是无价之宝；二是让得到领带的员工'
  merge: -1
  img_proc: true
- pgno: 111
  md: '感动得流下眼泪，使他为得到第二条领带而死心塌地地继续埋头苦干；三是使他的同事疯狂地嫉妒那条领带，从而建立“往前走是领带（胡萝卜），往后走是皮带（和大棒的作用一样）”的职场理念。


    # 第五种胡萝卜：让工作充满挑战性的刺激


    工作太简单了，员工们就会觉得乏味；太难了，他们又会感到恐惧。其实，关键的问题不在于工作的难易程度，而在于工作是否充满刺激。


    例如，你可以把一件事说得很难很难（尽管大'
  merge: -1
  img_proc: true
- pgno: 112
  md: '家都知道它很容易），当员工们轻而易举地完成任务时，你就可以把他们夸得像英雄。


    又比如，当你分派一项艰巨任务时，你可以把它作为“挑战”交给张三。你表示相信，只有他才能做得好。于是，即使张三遇到天大的困难，他的胸中也会充满奥林匹克运动员似的坚强信念。


    # 第六种胡萝卜：颁发奖状


    奖状几乎不需要成本，然而它的胡萝卜效应却出奇地好。'
  merge: -1
  img_proc: true
- pgno: 113
  md: '一纸奖状不仅能够满足员工的荣誉感，同时也在表明：这位员工心甘情愿用自己辛勤的劳动来换取这张不需要花钱的硬纸，他还将继续用自己辛勤的劳动来换取这种不花钱的硬纸，其他人员也应该像他那样用自己辛勤的劳动来换取这种不花钱的硬纸。于是，他就成了榜样。


    # 第七种胡萝卜：和员工一起共进午餐


    如果员工有机会和你一起共进午餐或谈天，无疑会感到荣幸。他会产生一种幸福的错觉，以为自己有能够、受到赏识和倚重、正在平步青'
  merge: -1
  img_proc: true
- pgno: 114
  md: '云……等等。


    你可能会为这种错觉感到内疚，而实际上员工们的确需要这种错觉。


    # 第八种胡萝卜：给员工自己制定工作目标的机会


    如果员工有机会自己制定工作目标，他会用十二倍的努力来证明自己的计划是对的。因此，让员工参与制定工作目标的过程简直就像是“上套子”。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '玩这种圈套最能体现领导者的管理艺术，否则，一不小心就可能把事情搞砸。那些员工会像幼儿园的小朋友似的，提出一些有趣却无法衡量的目标。而你的真正目的是，让员工制定出你想要的工作目标。


    # 第九种胡萝卜：鼓励他们的献身精神


    不要提倡员工按时下班（至少晚 10 分钟才能离开工作岗位），更不能允许员工装病请假，恰恰相反，要鼓励员工超时工作和带病工作。如果你善于培养他们的献身精神，你不用花钱就能得到更多的剩余价值。'
  merge: -1
  img_proc: true
- pgno: 116
  md: '其中的诀窍在于，你不要把它叫做“免费加班时间”，而应当把它叫做“敬业精神的突出表现”。


    # 第十种胡萝卜：策划员工之间的竞争


    如果你能策划员工之间的竞争，使他们一个更比一个敬业，他们就会一个更比一个可爱，你的胡萝卜效应就会如同多米诺骨牌一样精彩不断。


    每一位员工都是一张多米诺骨牌，你得把他们'
  merge: -1
  img_proc: true
- pgno: 117
  md: '摆放好位置。然后，你需要一位员工做榜样，而榜样的作用是无穷的。


    古代帝王之术到底都教什么呢？


    什么是帝王之术？所谓的帝王心术，乃是封建帝王为了江山和权位永固，在各种政治势力之间实施某种策略、以使各方势力平衡、不致威胁其统治的谋略和权术。


    什么是“帝王之学”？说简单一点就是物色、选择、拥戴、辅佐“非常之人”成“帝”成“王”之学。在辅佐“非常之人”时，设计非常之谋略，建立非常之功勋。崇尚这种学问的把它称'
  merge: -1
  img_proc: true
- pgno: 118
  md: '作“帝王学”，可是自古以来多称其为“帝王术”，认为它是有“术”无“学”的。


    帝王之学是集中国古代帝王的领导学、谋略学、管理学以及识人术、用人术、纵横术等为一体的特殊学科。


    君道，是作为一个单位、一个部门乃至一个国家的最高领导人所必须通晓、掌握的根本原则。把我们审视的目光投回古代，从某种意义上来说，帝王也是一个管理者，只不过他所管理的不是一般的团体，而是一个庞大的国家。'
  merge: -1
  img_proc: true
- pgno: 119
  md: '综观五帝的治国之道，都能善用无为而治的法 则，并在运用中使之体现为最高的和谐，天下 百姓在日常生活中得到了实惠却不知道是怎 么回事，行为合乎道义却好像生来就有这种修
    养。这就是黄帝、颛顼、帝誉、尧、舜之仁德 的具体表现。


    # 帝王之学十大要点


    一，王者不能事必躬亲，要懂得用人。以调动 天下人才之积极性为己用，乃王者之大道。


    二，识人、选人、量才而用是古今成就王者的 关键。'
  merge: -1
  img_proc: true
- pgno: 120
  md: '三，最大的私是私天下，而要取天下、成就最大的私，就要先做到无私，不争小利，这是成就王者的规律。


    四，什么样的王者是称道的，如何做才是一个万民称颂、流芳百世的王者？历史表明，王者之道，贵在征服人心为先。


    五，做任何事情要有原则，有度，超越了度则走向反面。因此，王者必善于把握时机审时度势。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '六，至高无上的王者地位与权力欲望，人皆想要之。但夺取权力是危险的，古往今来的兴衰成败和权力的更替变换提醒人们，面对权力的诱惑，必须既慎且惧，必须小心翼翼地使用和守护手中的权力。


    七，要说服、打动人心，让人接受自己的主张或意见，是一门高超的艺术，而其中最重要的，是如何揣摩对方的真实意图。


    八，失败中潜伏着成功的机会。关键在于如何看待失败、如何把失败转化为成功，把灾难转化为成就。'
  merge: -1
  img_proc: true
- pgno: 122
  md: '九，要想成功立业，不能寄望于他人，没有任何东西是可以永远依赖的，因为事情总在变化。因此，只能依靠自己的信念，不断修炼和提升自己处世与应变的能力。


    十，人的成败、国家的兴亡，是否有天命的注定，自古至今便议论纷纷。但从历史规律来看，人或国家的命运还是掌握在自己的手里，在于人事，而不是天命。


    “帝王术”一词大约最早出现在《史记·商鞅列传》的赞语之中。司马迁在评价商鞅的为人'
  merge: -1
  img_proc: true
- pgno: 123
  md: 时说他是“天资刻薄人也。迹其欲干孝公以帝王术，挟持浮说，非其质矣。且其所因由嬖臣，及得用，刑公子虔，欺魏将，不师赵良之言，亦足发明商君之少恩矣”。从这些话中可知，司马迁心目中的“帝王术”的内涵至少要包含以下诸方面：一，进取不由正道。二，所推行的学说未必是他所相信的（挟持浮说）。三，重术不重德。四，刻薄寡恩。这些描述说明“帝王术”完全是一种工具理性，没有终极关怀，因而把它定位为“术”是很恰当的。因为它只是个“术”因此就缺少规范，目的就是一切。传统文化的非规范性的一面在“帝王学”上表现得特别强烈。
  merge: -1
  img_proc: true
