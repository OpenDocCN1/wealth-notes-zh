  md: '# 1 以权力控制权力，权力制衡权力


    这种权力制衡机制往往出现在统治阶级内部，包括政府权力与皇权的相互限制（相权、监察权与皇权的博弈）、政府内部权力制衡两大部分。在汉代，皇室和朝廷是分开的，皇帝代表国家，是国家的唯一领袖，表征天下一统，象征政权的合法性与合理性。而政权（朝廷）则把握在以宰相为首脑的政府手中。《汉书·百官公卿表》中言：“相国、丞相，皆秦官，金印紫绶，掌丞天子助理万机。”《史记·陈丞相世家》中也曾记载汉文帝时期丞相陈平对自己职责的表述：“……宰相者，上佐天子理阴阳、'
