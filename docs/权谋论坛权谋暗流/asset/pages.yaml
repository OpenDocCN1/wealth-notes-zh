- pgno: 318
  md: '时候这样的做法，是为了保全自己。西晋名臣杜预曾攻灭东吴，还著有《春秋左氏经传集解》，可说是文武双全的人才，深得晋武帝重视。不过每到逢年过节，他都会亲自准备礼品，送给武帝身边的其他宠臣。


    有次，杜预出差办事，又顺手买了贵重礼物，送给晋武帝随行的亲信，他的家人不解，「你已经位高权重，也不有求于人，为什么要这般送礼？」杜预回答，在一般人眼里，只看到皇帝是主角、必须尊敬；但进一步来看，皇帝身边的宠臣，也掌握一定话语权，必须同等重视。'
  merge: -1
  img_proc: true
- pgno: 319
  md: '杜预虽然不屑这些宠臣，但只要保持良好关系，他们不会说他坏话、无端陷害，自己也能平安度日。《罗织经》说明，「君有幸臣，无由亦须结纳。」君王宠信的臣子，不需要原因也要和他们交往、往来。


    换句话说，就算你深受老板爱戴，说话也很有份量，仍要注意他并非「只宠你一人」，适时观察上司的左右手、其他重要主管的喜好，与他们建立一些交情，是防患未然的长久之计，可以令你在职场的地位更稳固。'
