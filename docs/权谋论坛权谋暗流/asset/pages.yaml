- pgno: 78
  md: '帝王术告诉我们几个涵义:


    其一，领导者不应该太早出招！领导者在没有表示意见或有所决定之前，一个部属再怎么尖锐，最多只是会与其他的同僚冲突而已，并不会有犯上的问题。如此便可以保留相当大的空间供自由讨论，以集结众智。


    其二，领导者应该避免把部属之间的攻讦，视为是针对自己；换言之，要保持「公亲」的立场，避免「公亲变事主」。'
  merge: -1
  img_proc: true
- pgno: 79
  md: '其三，一个好的部属的必要条件是：必须勇于提出自己的意见，这样才可以让领导者见识到各种意见、反应之后，决定出自己认为最好的方案。部属如果选择明哲保身，相当于把领导者推到前线，置领导者与整个团体于险境：因为领导者如果一时不察说错话，由于缺乏转圜空间，可能会被迫蛮干到底。


