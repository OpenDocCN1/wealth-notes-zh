  md: '根据《后汉书．董卓传》，「性粗猛有余，少尝游羌中，尽兴豪帅相结……由是以健侠知名。」董卓性格豪爽仗义，因此有「健侠」的名号。历史作家陈启鹏在著作《不宫斗也能强大》提到，因为董卓爽朗的性格，懂得与下属共享赏赐，因而势力稳固。即便朝廷忌惮、多方挑衅，董卓都一一逃过，这让位居太师（太子老师）高位的董卓，不甘于一人之下。


    此时，东汉外戚何进以诛杀把持朝政的宦官为名，召集董卓进京支援；不料走漏风声，宦官早一步杀了何进。闻此讯的董卓，顺势收编群龙无首的武装部队。'
  merge: -1
  img_proc: true
- pgno: 239
  md: '接下来，董卓率领军队攻入朝廷，并仰仗军队势力，逼少帝退位、立刘协为帝，至此，董卓等于掌控整个朝廷。


    **掌握朝政的董卓，好比刚升官的主管，新官上任三把火，颁布多项政策，想要赶快做出成绩。**


    董卓「上任」后，为了整治慌乱的社会，下令部属拟定一份黑名单，只要是贪官污吏、不孝顺父母，以及不忠于长官的人，一律处死，且财产充公。


    下属为了迎合长官，缺乏审查、冤枉好人，最后制度沦为打击异己的工具，百姓怨声载道。受不了董卓政令的人们，像是军阀袁绍，便集'
