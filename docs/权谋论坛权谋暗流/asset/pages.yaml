- pgno: 270
  md: '# 当给建议的专家，别当小事的控制者


    创业早期，是个从 0 到 1 的过程，这时候的团队成员，每天反覆讨论商业模式，自然产生相似的思维与价值观，员工也熟悉创办人的决策模式。


    当组织不停扩张，产生主管需求时，我们倾向先从内部团队找主管，他们最了解目前进行的业务，也和我们 4 位创办人的磨合期最短。


    而这个最佳人选，不一定是最早加入团队的员工，他必须具备良好的能力、强烈的热情，最重要的是，成为主管的企图心。我们曾拜托毫'
  merge: -1
  img_proc: true
- pgno: 271
  md: '无意愿的员工接主管职，却造成彼此的心理负担，**一位好主管必须有自觉，并非他人强迫**。


    另一方面，准备规模化的公司，因为团队人数不多，正是养成新主管的绝佳机会。新手主管起初只需带一、两个人，大部分的心力仍放在原有的工作上；**新主管不是立即转变为管理职，而是随着部属增加，逐渐提高「管理」工作的比例，这也会使得转换过程相对平顺**。


    在我们的经验中，培育主管没有捷径，**关键是一开始就「选对人」**，接着沟通彼此可以接受的工作模式，以及经营者对职务的期望。'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 有效掌握育才关键，带部属完成任务，挑战未来！建设性育才术｜年度最终场


    养成一个新主管必须具备两个要素：时间与空间。


    +   时间，指的是设定合理的时程，让新主管摸索带人的方式


    +   空间，则是经营者逐步放手的过程，也就是增加给予主管的权力。'
  merge: -1
  img_proc: true
- pgno: 273
  md: '刚开始，新手主管需要密集回报，经营者也会期待新主管在决策前，先与自己讨论；当彼此的互信程度提高，放手的空间（包含犯错的可能性）也就愈来愈大。对经营者来说，授权是一件很难拿捏的课题，放手得太快或太慢，彼此都可能吃尽苦头，授权应随着主管的成熟度逐步发生，它代表的是经营者对主管的信任程度。


    **经营者下放愈多权力，对公司的运作细节不再那么清楚，出现些微的不安全感是正常的。** 此时，经营者必须不断提醒自己，当个给予建言的旁观者，而不是干预每件小事的控制者，适'
  merge: -1
  img_proc: true
- pgno: 274
  md: '时放手除了让主管有较多的成长机会，经营者也能有更多时间思考更长远的规画。


    # **主管是团队的天花板，成长速度必须优于团队**


    几次创业经验下来，不断验证「主管是团队的天花板」的道理。我们时常鼓励主管招募比自己优秀的成员，不要害怕部属比自己优秀，实际上，真的很难做到完全不在意。


    即便主管真的毫不在乎，并找到一流的人才，却因为自己没有能力理解，无法善用他们的才能，不经意间埋没好的想法；就算这个想法得到公司的支持，也可能受限于主管的能力，没办法做出好成果。'
  merge: -1
  img_proc: true
- pgno: 275
  md: '此外，主管平常要做的事又多又杂，更常被赋予新的使命和责任，原本自己动手做的事，也都下放给部属，时间久了，对工作细节自然生疏。


    正因此，我们认为的好主管，不需要一直是第一线的专家，而是要抱持不断学习的心态，从部属、各部门、公司经营者等管道汲取经验与新知，提升自己的能力。主管必须站在比部属更高的位置，理解团队成员如何帮助公司达到目标。


    经营者和主管间的关系，就像一条充满弹性的橡皮筋，多数时候，我们像个旁观者，只有在'
  merge: -1
  img_proc: true
- pgno: 276
  md: 察觉轨道偏离，我们才会试着拉回正轨。当授权愈来愈多，经营者也会有更多时间与心力，寻找更多商业模式的未来可能性。
  merge: -1
  img_proc: true
- pgno: 277
  md: '# 带人、做事不懂「这个哲学」，迟早会阵亡


    有时候，我也会忍不住介入细节，觉得「这种小事，还不如自己做完了」。但实际上，这样的时间投资根本不符效益，而且是很笨的做法。所有主管都有个共同难题，就是时间不够用，每天会都开不完了，哪来时间做事？尤其是新手主管，刚接管理职，业务内涵立即大幅超过本来担任专业职时的范畴，一开始难免会手忙脚乱、心浮气躁，不知道该从何开始。


    # 掌握一个管理哲学：抓大放小


    毕竟，不管什么部门，经理人都不可能每项工作事必躬亲。即使最龟毛的主管，也无法把每'
  merge: -1
  img_proc: true
- pgno: 278
  md: '个细节都做到极致。所以如何妥善管理时间、拟定优先顺序、精准切中问题核心，就是管理上很重要的技术了。


    # 找到节奏，拟定工作的优先顺序


    每天进办公室，我做的第一件事，就是先在纸上写下「今天一定要完成」的事，连必须打电话给谁，我都会列出来。目的就是为了享受把「待办事项」划掉的快乐。


    另外，我还有本专门拿来写 to do list 的黄色小本子，通常一至二个月就会换一本。这是用来记各种临时想到的待办事项，不见得是当'
  merge: -1
  img_proc: true
- pgno: 279
  md: '天的事。对于我把目标变成实际可行的项目很有帮助。


    所以，多工确实可能透过后天培养，并熟能生巧，愈做愈好。一开始，先试着让自己习惯「在同一时间处理不同问题」的节奏，慢慢地，脑中自然会建构出一个多层次的甘特图，渐渐发展出属于自己的因应之道，这是第一阶段。


    第二阶段，则是训练自己拥有「层次分明的时间感」。这指的是清楚知道每项不同工作，在哪个关键时间节点上，需要投注大量注意力。试着让自己不要顾此失彼，有意识地在重要事项上，投资心力跟时间。'
  merge: -1
  img_proc: true
- pgno: 280
  md: '最后一个阶段，也是最重要的一环，就是「决定优先顺序」。没有人能把所有事情都做到百分之百。你一定要有所取舍，摊开现阶段所有任务，要很清楚把「最重要的」、「次重要的」，跟「相对不重要的」事项定义出来。


    多工的前提，是你有办法掌握工作的优先顺序。


    # **顾全大局，减少在细节上钻牛角尖**


    「抓大放小」的管理哲学，可以和「专注又分心」的多工本领相互呼应。你只要「顾全大局」，不要在细节上钻牛角尖。尽可能用最省'
  merge: -1
  img_proc: true
- pgno: 281
  md: '时、省力的方式来处理，好让自己有更多时间

    去思考大方向的执行策略。


    举例来说，怎么要求饭店的清洁品质？每个主管都知道要「加强管控」。但我的方式是「小题大做」，每隔一段时间，我就带着所有主管「突袭」，把饭店的每层楼都走过一遍，一起把没有彻底清洁的地方找出来。


    这么做，除了让负责同仁知道还有改进的空间，也不会因为时间久了就过于松懈。这件事不需要天天执行，也不必把它变成 SOP，只要偶尔一次，效果就达到了。看到总经理带着所有主管做楼层巡查，还把问题逐一记录下来，


    279'
  merge: -1
  img_proc: true
- pgno: 282
  md: '已充分带给大家自律的压力，让他们知道，高阶主管非常看重大家的工作成果。


    虽然我称之为「抓大放小」，但并不是说小事不用管，只要做大事。而是指在处理细节时，要在瞄准大目标的前提下，有技巧地去做。


    对高阶经理人而言，则需抓住经营核心就够了。员工是否适得其所？公司表现是否稳定成长？未来环境将如何变化？这些看清楚了，根本不需要斤斤计较员工几点下班，需要想的反而是「授权」的适宜性。'
  merge: -1
  img_proc: true
- pgno: 283
  md: '# 管太多，反而有损效率


    来模拟一个情境当例子。对业务部门的专案，公司通常都有明确规章，要求达到一定程度的获利率，借此控制成本。假如有个业务主管在外包部分项目后，专案获利率符合标准，更上层的主管，却觉得获利率还可以再提升，要求这位业务主管重新检讨外包人力成本，这么做适不适当？


    帮公司省钱，当然是老板的著眼点。但若这位是资深业务主管，也许他宁可多花一点钱，因为对方是长期合作对象。执行时可以维持品质，降低沟通障碍，减少很多额外困扰。当你'
  merge: -1
  img_proc: true
- pgno: 284
  md: '不见得知其然，就贸然出手干涉，反而会破坏与部属间的授权和互信。


    但如果是新手主管，在这个案例上，老板也不见得是错的，借此可引导主管更周全地思考，例如，更全面地掌握这类外包业务的市场价格水准。所以，我一开始才说，授权有许多考量，无法一概而论，但「抓大放小」的原则不变，就是要著重大方向，尽可能让小细节的处理省时省力。


    平时面对各馆总经理时，我会自我提醒尽可能展现「信任」，避免让他们觉得没有最终决定权。另外，组织中的决策，多是由中阶主管带'
  merge: -1
  img_proc: true
- pgno: 285
  md: '着同仁先整理出几项方案，再跟上层讨论，借此营造比较开放的沟通空间。


    大多数人的管理盲点，是忘记从公司角度来检视事务的优先顺序，以及抓不准节奏，让专案太早或太晚才开始动工。我建议，一开始可以试着把每件事的进度表和甘特图列出来，全部摊开，对照长远目标，重新排列优先顺序。


    乍看之下，这有点麻烦，却是个逼迫自己认清现实的方法。凡事靠感觉，很容易有偏误，透过图表，把模糊的工作进度量化后，执行时就会务实许多。'
  merge: -1
  img_proc: true
- pgno: 286
  md: '如果可以，最好适时和直属主管讨论，尽量避免「见树不见林」。无论做什么事，背后都有理由，但执行者很容易钻牛角尖，做到最后反而和目的背道而驰。在执行时，不要只看到细节，反而忘记工作的目的，甚至让枝微末节的考量，主导了对整件事的思维。


    # 被高薪挖角是幸运，还是噩梦的开始？跳槽掌握一个原则，避免愈换愈后悔


    # 别因为不满意现况而跳槽


    许多资深工作者，因为中年转职而落得晚景凄凉，不外乎两种情况：一是被迫离开，另一'
  merge: -1
