- pgno: 382
  md: '退出了市场。不过也有公司因为积极做好布局与转型，撑过市场寒冬，再次回到最佳水准。

    我所服务的组织，长久以来都一直是这行业领域的领头羊，并且致力保持优势（愿景与目标），有一次却因为突然遇上竞争者的削价竞争，经历市场红海严峻考验，公司获利不若往常亮眼（意外转折）。我们当下不仅启动了组织变革，同时也透过推动重塑企业核心价值观的各项活动，引领大家思考可以做些什么，共同撑过这段经营黑暗期（转场变革），在管理层带头推动价值转型、同仁们也开始凝聚行动共识后，后来几年总算苦尽甘来，再创获利新高。（重返荣耀）'
