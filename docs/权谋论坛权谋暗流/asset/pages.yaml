- pgno: 269
  md: '在小有成就之后，许多人可能就忘记当初如何为目标奋进，吕蒙最初不也没听进孙权的建议吗？


    仕途停滞不前，或能更上一层楼关键，就在于能否保持学习的心态，听取前辈、主管的建议，不断精进，让老板觉得你可以承担更大的责任。'
  merge: -1
