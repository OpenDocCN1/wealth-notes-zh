  md: '# 权力—影响力途径


    权谋爱好者好用「权力」来研究或描述领导、领导人或领导统御。权力使领导产生有效性，但更甚于此者，权力不仅使领导人能指挥命令所属，还可以影响很多人。权力和影响力较常呈现出来的关系是，彼此的互动是正相关的。


    也就是说权力愈大，影响力愈大；反之，权力愈小，则影响力也愈小。从权力和影响力去看领导统御，他们尝试回答以下的问题：


