- pgno: 521
  md: '生过的事，但是又不会让朱元璋觉得难堪，因而让朱元璋忆起了当年的情谊，最终为自己争取到了荣华富贵。


    # 谈判中不可忽视的 3 个 小细节


    1. 就算只有一面之交，也要记住对方的名字


    在谈判中， 想要让对手感觉到你对他的尊重，**首先就要准确地记住对方的名字**。在任何交际场合，草率地对待别人的名字都是一种不礼貌的行为，倘若你与对方不止见过一面，再见面时却忘记了对方
    的名字，难免会让人心生不'
  merge: -1
  img_proc: true
- pgno: 522
  md: '快。在谈判场上，遇到有过一面之交的谈判对手，如果我们能准确地叫出对方的名字，就会很好地体现出你对他的尊重，让他心里有一种满足感，觉得自己很受重视。


    # ## 2. 任何时候都别忘了给对方留面子


    在谈判过程中，还应该注意在任何时候都给对方留下一些面子。谈判场上的局势往往变化多端，会发生各式各样的情况，无论是谈判者本身，还是谈判对手，都难免会有犯错的时候。如果谈判者抓住谈判对手犯下的某些错误不放，没完没了地批评、讽刺对方，不给对方留'
  merge: -1
  img_proc: true
- pgno: 523
  md: '面子，对方一旦忍无可忍情绪爆发，很可能就会发生冲突。


    所以在谈判中，一定要注意得饶人处且饶人，为谈判对手留一些情面。如果你在这种情况下能够表现出对对方的尊重，那么在接下来的谈判过程中，如果你遇到了同样的情况，对方也会念及你曾放他一马，而给你留下面子。


    # 3. 别随便打断对方的发言


    此外，谈判中的交流也能够体现出你对对方的尊重。一方面，当对方在发表观点时，切忌随'
  merge: -1
  img_proc: true
- pgno: 524
  md: '便打断发言。即使是在生活中，当我们说话时，别人不管三七二十一地插进来，我们也会心生不快。而在谈判场上，如果你打断谈判对手的发言，肯定会让其心生不快，有被藐视之感。


    一旦有了这样的心理，谈判对手就会对你产生敌意，与你针锋相对。另一方面，轮到你发言时，一定要注意别只顾着自己，要在说话的过程中注意对方的反应，为对方留一些表达意见的空间。


    有些谈判者，口若悬河滔滔不绝，只顾将自己的观点展示出来，而不给别人一丁点儿说话的机会，这样的谈判者会让人产生目空一切、骄'
  merge: -1
  img_proc: true
- pgno: 525
  md: '傲自大的感觉。如果你在谈判中不顾忌对手的感受自说自话，也会让对手觉得你不尊重他，从而对你产生抵触心理。


    **在谈判中表达自己的想法时，一定要注意与谈判对手的互动，让对方感觉到你对他的尊重。**'
  merge: -1
  img_proc: true
- pgno: 526
  md: '# 再辛苦、再拼命，事成后也千万别做一件事


    在《老子今注今译及评介》中，注译者陈鼓应引用李斯当秦朝宰相时的故事，指当时李斯富贵名声集于一身，态度不可一世，最后却沦于阶下囚。


    临刑前，李斯对儿子说，「我还想和你牵着小黄狗、出城去猎逐兔子，但这样的愿望，看来是不可能做到了？」这种简单的愿望，却因为他曾经的不可一世，不可能再实现了。'
