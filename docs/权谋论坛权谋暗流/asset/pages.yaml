- pgno: 361
  md: '# 贫穷的观念：我不值得富裕


    # 富裕的观念：我的使命和召唤就是变得富裕，并向他人分享财富


    你绝对值得更富足。富足除了代表有钱，还要自动自发地与他人分享。你同意让自己变得富裕，就可以提升自我价值。


    请你务必接纳财富，并且分享财富。你必须相信致富是自己的使命和召唤，就像其他的财富巨人一样欣然接受。


