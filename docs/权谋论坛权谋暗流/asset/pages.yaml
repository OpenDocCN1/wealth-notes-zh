  md: '刘邦认为，韩信实力强、又有个个性，逐渐产生猜忌，担心他反叛，便以韩信擅自发兵攻打齐国等理由，开始找麻烦。刘邦的原配吕后素来有政治野心，也想除掉韩信，就找萧何商议。


