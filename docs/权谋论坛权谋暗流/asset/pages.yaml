- pgno: 48
  md: '刀子处理的人和事处理, 这是领导者的失职.


    # 抹子


    抹子是四把工具中唯一的软工具. 作用是理顺关系, 调整情绪, 化解矛盾, 处理面上的工作, 工作中许多矛盾需要调和, 不必过分认真的事情就需要模糊处理. 通过谈心,
    互相通气, 增进了解等办法, 问题就会大事化小, 小事化了, 事情就抹平了, 矛盾就缓和了.


    # 谈判过程中遇到僵局怎么办？'
  merge: -1
  img_proc: true
- pgno: 49
  md: '对于有谈判经验的人来说，谈判中经常会遇到这样一种情况：谈判双方就某一个事情或问题产生了巨大的分歧，进而影响了谈判的进程，这个就是所说的谈判僵局。


    在谈判中，面临着形形色色的谈判僵局与困境，这些僵局可能由于双方的针锋相对的要求不同而无法进行谈判，也可能因为外在的压力让双方都无法动弹，还可能一些误会导致双方认为对方对着干，所以不肯放手。那么在面对谈判僵局的时候，该如何解决呢？'
  merge: -1
  img_proc: true
- pgno: 50
  md: '其实搁置策略是解决谈判僵局的妙方。当面对一个问题，双方争执不下的时候，不妨把这个问题先搁置，不再继续讨论，换一个话题。


    通过搁置策略，先解决谈判中的许多细小问题，这些问题的解决，为后面解决重要问题积累能量。随着双方的谈判深入，了解越来越多，双方让步的机会就越大。因此，谈判中，当就一个问题相持不下的时候，不要集中到某一个问题上，否则只会越来越僵。


    应对谈判僵局第二个方法：调整谈判结构。'
  merge: -1
  img_proc: true
- pgno: 51
  md: '比如在谈判陷入僵局的时候，你可以通过以下办法应对：双方可以暂停谈判，到第二天在进行谈判；更换谈判中的某一位或几位成员，缓解紧张的气氛；改变谈判的地点场所，双方都放松一下；谈判另外一个
    小议题，在小议题上达成共识；将第三方拉入谈判中一起讨论等。


    应对谈判僵局第三个方法：引入第三方。


    谈判僵局如果继续谈判下去的话，就会面临死胡同的局面，双方都不愿因在继续谈下去，因为他们觉得这样再谈下去毫无意义。引入的第'
  merge: -1
  img_proc: true
- pgno: 52
  md: '三方一定看起来是中立的，双方都可以接受的。比如工会要求提升工资待遇进行大罢工，而资方就工资待遇方面，毫不让步。双方僵持不下，这个时候，政府会出面，充当中立的调解人。


    需要特别主要的是，不要因为解决谈判僵局而付出很大的代价，许多经验丰富的谈判者，都会利用谈判僵局困境逼迫对方让步，在这个时候，需要冷静头脑，广开言路，收集多方信息，对对方的行为进行辨别，进而考虑采取相应的策略。


    ![](img/e2c24fb65807a5da452c6b8c39c0ef3b_52_0.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: '有句话，“世界上最难管的是人。”俗话说，领导大了什么鸟都有，职场中人多了，自然就有那么几个不服管的刺头在。每个领导对于刺头的管理都十分头痛。打又打不得、骂有骂不得。用手段压制吧，反而刺头反弹起来危害更大。


    因此，想要管好、处理好刺头，领导的管理手段、手腕要求极高。西方管理学中，对于刺头型员工，更多是强调沟通理解。但是在中国，这套理论未必管用了。如果能开除就开除，这是最直接的。如果不能开除呢？


    大多数领导选择的就是，不管、不用、不搭理，'
  merge: -1
  img_proc: true
- pgno: 54
  md: '但后遗症极大。但是要我说，高明的领导对付刺头，从来不用这“三不“。他们用的方法，不但有效，而且其他员工看了，一点话都说不出来。可以说，既权谋又厚黑。


    # 1. 送走


    明朝有个海瑞，号称大明第一神剑。为官清廉，个人道德水平极高。但是做人做官不谙世事，得罪了不少人。严格来说海瑞是个业务尖子。但是在他的上司眼中，海瑞不服管、不听话、爱闹事。可偏偏他的上司又没有办法找他的问题收拾他。海瑞可以说，就是一个职场刺头。'
  merge: -1
  img_proc: true
- pgno: 55
  md: '海瑞的上司想到一个办法。既然收拾不了，那么就送他走。推荐海瑞到升职到其他地方做官，只要不在他的地方就行了。果然这招奏效了，朝廷提拔了海瑞，并将其调走。


    职场中，有些领导对于刺头的处理，就只会打压、硬处理。殊不知，刺头如同臭狗屎一样，踩一脚，自己鞋子也臭了。而且身为一个领导，去打压自己的下属，搞手段来收拾他，说不出真不好听。而且，有的时候这样收拾刺头，未必有效，甚至适得其反。


    不妨换一个思维方式。高明的领导，就不会光'
  merge: -1
  img_proc: true
- pgno: 56
  md: '想着对抗和打压，既然收拾不了，那就托起来送走，让他升职到其他地方去，那不就行了！这样刺头还要感谢领导举荐、提拔。可谓是一石二鸟。


    # ## 2. 重用


    还是来说说这个海瑞。海瑞的性格和作风在当时的明朝官场为人所不喜欢。没有哪个上官，喜欢自己手下有这样的一个下属。不过不喜欢，归不喜欢，海瑞对于有些人而言还是有利用价值的。


    海瑞最主要的作用就是用来攻击敌对派系的'
  merge: -1
  img_proc: true
- pgno: 57
  md: '官员。比如陷入到徐阶严嵩之间的党争，充当刀子。又比如如，被首辅高拱利用对付前任首辅徐阶。在那些朝廷大员的眼中，海瑞不是个可以拉拢的人，但却是个值得利用的人。


    职场中，有能力但又是刺头的员工，对于领导而言，可以说是又喜欢又狠。喜欢他真能干事，狠他会干事又会坏事。通常情况下，领导对于这种刺头，会用三招。第一，弃置不用；第二，安排杂事；第三，不做重用。不妨换一个思维方式。高明的领导，对于能力强的刺头员工，不但用，而且还重用。这个重用有两个方向。第一，安排刺头去别的领导手下办事，这叫祸'
  merge: -1
  img_proc: true
- pgno: 58
  md: '水东引。第二，安排刺头负责某些工作，但安排人做好出问题后预防。只要把刺头工作中产生的问题，做到可控，那就能用起来了。


    职场中，没有不能用员工，只有不会用人的领导。员工好不好用，怎么用，关键还看领导。


    # 3. 置危


    海瑞这种人，中国历史上出不了几个。包括现在这个社会上，尤其是职场中，海瑞式油盐不进的人可以说极少极少。


    但凡是人，都有七情六欲。贪婪、懒惰、恐惧，'
  merge: -1
  img_proc: true
- pgno: 59
  md: '都是人性中最为常见的。面对刺头，不要主动去找他的麻烦。而要等刺头自己把问题、把柄送上来，领导再按照制度收拾他，这样才名正言顺。有些领导，做事就太急、太难看，故意挑错找问题。一点小事就上纲上线，不但不能一步收拾到位，反留下隐患，而且还显得自己水平低。


    那么问题来了，如何让刺头把自己的问题、把柄送上来？有句话叫，常在河边走哪有不湿鞋，这是一种概率论。即处于危险的地方，哪怕防护措施做得再好，只不过是降低出问题的概率，而无法做到不出问题，除非不去到危险'
  merge: -1
  img_proc: true
- pgno: 60
  md: '的地方。


    因此，


    对于刺头型员工的使用，不妨把他们放到容易出问题的地方（其实你换别人也会出问题，但是你用刺头去，可以起到一石二鸟的作用）。等他们出问题，再回头收拾他们，一切都名正言顺。好比说，你想收拾一只猫，想找罪名，那就安排猫去看守鱼，等他偷鱼了，你的借口就有了。《西游记》中，玉皇大帝安排孙悟空去看守蟠桃园，何尝没有这种考量。（当然还有一说，蟠桃园中的蟠桃严重亏空，安排孙悟'
  merge: -1
  img_proc: true
- pgno: 61
  md: '空是让他来顶罪的，毕竟猴子爱吃桃子是天性，去了就说不清了，没吃都认为吃了。)


    作为领导，想收拾刺头，最好不要用一些阴谋手段。要就要用阳谋，让别人无话可说！


    一个刺头，你提拔起来放到别的地方，别人说不计前嫌爱才，实际上你送走了个瘟神。


    一个刺头，你把他重用了，又控制住了出问题的可能，别人只会说你，用人有一套办法。'
  merge: -1
  img_proc: true
- pgno: 62
  md: '一个刺头，你名正言顺用他工作上的存在问题和过失，来处置他，刺头和其他员工都心悦诚服。


    抓住这 4 种可趁之机，轻松否定领导。'
  merge: -1
  img_proc: true
- pgno: 63
  md: '下属对领导错误意见的否定，除了方法要巧妙得当外，还应选择有利的时机。许多时候下属的“进言”没能受到领导的重视或采纳，除了其他多种因素外，进言时机不妥也是一个主要原因。把握时机，说白了也就是要“趁机”。


    第一，趁领导心情比较愉快之机


    否定领导的意见，只要情况允许，最好选在领导心情比较舒畅之时。此时进言，常常会收到平时难以收到甚至无法收到的良好效果。


    第二，趁领导主动询问之机'
  merge: -1
  img_proc: true
- pgno: 64
  md: '这种机会，作为下属是经常遇到的，要抓住机会，力陈见解。此时领导正专注考虑这个问题，又是主动征询，成功的可能性较大。


    # 第三，趁参加会议允许发言之机


    下属经常随领导参加会议。大体有两种情况：一种是作为名工作人员参加领导会议，只能听、记，不可发言，但有时也会向你问询或征求看法；一种是参加领导召开的座谈会、工作会议等，与会人员皆可发表看法。逢此良机，不可丧失。


    # 第四，趁领导需要情况反馈之机'
  merge: -1
  img_proc: true
- pgno: 65
  md: '领导的决策已经开始实施, 他急需了解进展情况, 这时下属可在及时反映情况的同时对领导决策的不足之处巧妙地给予否定。由于此种否定是在实践的基础上, 更能引起领导的重视。除此之外,
    下属还可灵活地选择其他有利时机, 诸如趁随领导外出之机; 趁领导较为空闲之机; 趁领导深入筹划之机; 趁领导进退两难之机等等。


    # 聪明的下属都是善用引以为鉴法说服领导'
  merge: -1
  img_proc: true
- pgno: 66
  md: 引以为鉴法,是指在已经发生了问题,造成了不良后果,或者发生了重大事故之后,帮助领导找出原因、教训,作为以后工作的鉴戒而提出的。在现实生活中,正确进行决策是困难的,执行决策过程中的失误也是时常发生的。而对失误,特别是面对重大失误,领导是相当痛心的。上级的反复追查,甚至给予某些人惩处;同级的互相埋怨,甚至冷嘲热讽;下级的怨声载道,甚至谩骂某个领导无能,这些很可能使那些具有创造精神的领导在今后的工作中变得首畏尾,失去责任心和进取心,甚至从此一蹶不振,再也提不起劲来,宁肯使工作‘软’
  merge: -1
  img_proc: true
- pgno: 67
  md: '损失，也再不去“硬”争创。他们会觉得这个社会真是“干的不如站的，站的不如看的”。对领导的失误，下属不能站在一旁观望，而要积极为领导出谋划策，除想方设法尽快减少和挽回损失外，就要帮助领导用“引以为鉴”法总结经验教训，再创工作的新局面。


    一是明确危害。下属在事故或挫折面前，要帮助领导明确其危害性，并对已造成的损失进行准确的统计和评价，还要对可能给未来造成的影响，进行必要的评估，使领导从思想上认识：上级的处理是合情合理的，大家的意见也是可'
  merge: -1
  img_proc: true
- pgno: 68
  md: '以理解的。


    二是找准原因。下属要协助领导从事故或挫折发生、发展、结果的全过程中进行周密调查，提出避免类似事故再次发生的办法，并在预防方案中寻求向积极方向转化的突破口。


    三是吹风鼓劲。经常给领导讲 讲宽心话，让领导逐步从“危难”中解脱出来，觉得失误或挫折是正常的。谁在这个岗位上，谁在这个背景下，谁在这个事件中，都有可能发生失误，这次让自己碰上了，也算给别人铺出条路。从而使领导以良好的心理状态，面对现实，着眼未来，把本职工作做得更好。四是帮助领导提'
  merge: -1
  img_proc: true
- pgno: 69
  md: 高声誉．一般说来，当领导某些“宏伟”的决心下定以后，总会提高自己的声誉的。一旦“宏伟”的决定落空，大家不满的呼声就会相应而起。有时领导的某些不切实际的许愿，也使一部分人高兴起来。一旦这些许愿落空，大家的抱怨情绪也会紧随而来。这些，都需要领导者引以为鉴。问题是，有些决策按正常运转明明是可以实现的，但由于形势所迫，出现了不可逆转的局面，这与决策人的个人品质、能力是无关无几的。这时候，下属就应该利用多种机会，向大家加以解释，使大家了解内情，从而体谅领导的困难，提高大家对领导的信任度，齐心协力再创新局面。
  merge: -1
  img_proc: true
- pgno: 70
  md: '从以上论述中，我们可以悟出这样一个道理：

    聪明的领导，不在于他自己能想出多少好点子，而在于他能采纳多少部下提出的好点子。

    聪明的下属，不在于他能被领导采纳多少好点子，而在于他能给领导提出多少好点子。'
  merge: -1
  img_proc: true
- pgno: 71
  md: '# 权力的排他性导致权力的斗争和残酷


    权利具有一个根本的特性，那就是他的排他性，权利是不容许别人分享的，所谓“卧榻之旁岂容他人鼾睡”。权力的核心价值就在于“垄㫁”，就在于独享，一旦大权旁落，权力的地位就会出现松动，就会被别人乘虚而入，就很有可能被其对立面或竞争对手，甚至会被隐藏在自己身边的野心家夺去，这是权力最为敏感的反应。


    对权力的珍惜和呵护，其实取决于权利自身能够给权利的拥有者能带来多大的利益和现实的资源好处，以及未来的利益预期，如果权利'
  merge: -1
  img_proc: true
- pgno: 72
  md: '能够给其带来丰厚的利益资源,而又不会带来 风险和责任,权利拥有者就会把权力看的比自 己的生命还要重要,比自己的爹娘还要亲,它 可以不爱护自己的生命,它可以为了保住拥有
    的权力,他可以喝坏自己的胃,为了讨好权力 的授予者,他可以不睡觉,忍着困顿的睡眠, 劳累的身躯,去陪上级或赌、或跳、或嫖,去 做人生最无尊严的无聊游戏,为了酒席宴上表
    现自己的实在和忠诚,可以明知“酒是人家的, 命是自己的”心知肚明情况下,用酒去戕害自 己,灌醉自己,麻木自己,这一切的一切都是 为了保卫和保护权利。


    对于任何的来自于他方的对于权力的危害和'
  merge: -1
  img_proc: true
- pgno: 73
  md: '挑战，权利都是不容谘和排斥的。都会作出你死我活的斗争和作出必与置之于死地而后快的反扑和报复。权力为了清除“眼中钉，肉中刺”，权力都可以作出种种卑鄙和无耻的手段、毒计，来操作陷害对手。利用权力处于上风和制高点，利用制定制度、规则、要求、评价标准，设置圈套，予埋陷阱，找出对手在执行中的瑕疵和不足，或不自知的差错酿成一定程度的经济损失后果，扳倒对手，清除危险，拔掉障碍。


    当然也有更为卑鄙下流的伎俩，那就是利用工作在特定男女之间应有的业务配合和上下级联系接近，可能有一方或双方感情出轨，制'
  merge: -1
