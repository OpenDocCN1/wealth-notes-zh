- pgno: 316
  md: '人与人并不是只有单纯的互动，必须游走在「竞争」或「合作」之间，顺应两边拉扯的张力。


    想要搞懂竞合局势，第一步就是判断你所面对的人，到底是敌是友。楚汉争霸时，刘邦就用了一计，助长自身势力。当时，项羽最重要的谋士为范增，对刘邦来说是一大威胁，如果范增消失，便对自己有利。


    两军在一次谈判中，面对项羽的使者，刘营故意问，「你是不是范增派的使者？」对方答称，他只听项羽的指挥。这时，刘邦的手下只给使'
  merge: -1
  img_proc: true
- pgno: 317
  md: '者粗茶淡饭，冷漠以待，因而冒出「刘邦只肯见范增」「范增私通刘邦」的传言。最后，项羽不察，不再信任范增，失去谋士后，逐渐走向失败之路。


    刘邦藉由铲除「敌人的朋友」在竞争中胜出，换到职场也是如此，只是概念稍有不同。通常，**老板的敌人，就是你的敌人；老板的朋友，也是你的朋友**，唯有认清这点，才不会莫名其妙得罪别人，却还一头雾水。


