    # 4. 习则观其所言


    下属平常会发表什么样的意见，可以体现出 他的逻辑概念与思考方式，判断员工是否有自 己的见解，还是只是盲目地跟随时势。


    420'
  merge: -1
  img_proc: true
- pgno: 423
  md: '# 5. 穷则观其所不受


