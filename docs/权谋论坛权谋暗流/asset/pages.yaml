- pgno: 308
  md: '# 5件成为主管前应该知道的事


    你是否期待有一天自己也可以当上主管？事实上管理并非易事，过度管理、批评更可能让团队痛苦不堪。想要从一个好员工成为一个好主管，你需要试着练习以下 5 件事：


    # 一、不要再先赞美后批评


    常有人教我们在批评前要先赞美对方，也因此我们在沟通时常习惯于先赞美、再批评、最后再包裹一段赞美之词。事实上大家都已对这样的公式感到厌烦，与其如此，你应该要即时发表建设性的建议和赞美，真诚的表达你对一件'
  merge: -1
  img_proc: true
- pgno: 309
  md: '事的想法，公开、坦承地与同事沟通，才能建立团队互信、减少因相互猜忌而产生的压力。


    # 二、清楚指明团队目标


    领导团队时，记得要给出明确的指令、清楚的目标。目标是让每个人成长、并随时调整方向的重要指引，试着与团队里每个同事聊聊，了解他们的个人工作状况和团队目标有哪些重叠、哪些冲突。


    当确保同仁已经明确了解团队工作目标后，你可以试着授权由他们自己订定明确、可执行的工作计画。至于你的工作，就是随时帮助他们'
  merge: -1
  img_proc: true
- pgno: 310
  md: '找到界定工作成功或失败的指标。如此一来，员工就能对他们所做的工作**更有参与感**。


    # ### 三、明确指认责任与成就归属


    有些人不太愿意赞美员工，因为他们怕如此可能会让员工太骄傲。但事实上，主管吝于赞美只会让团队士气低落。研究显示，**人与人之间若能经常表示感谢，能增加相处的愉悦程度，增进双方关系**。而团队唯有维持良好气氛，才能有好的生产力，因此在事情进展顺利的时候，你其实大可直接拉出负责的同事，在开会中公开赞扬他。'
  merge: -1
  img_proc: true
- pgno: 311
  md: '而相对的，当事情进展不顺利时，找出需要负责任的人，了解事情进展不顺利的原因，找出其中你应该介入或改进的部分，才能与团队一起从错误中学习。


    # 四、维持固定检讨规律


    当公司内外在环境经常变动时，做为一个主管，你可以做到的事，就是**固定提供团队成员一些回馈，让同事们有安全感**。固定每隔两周和同事们一对一讨论，专注在那些不会变动的目标上，讨论接下来的工作方向。若能进一步安排年度或两年一次的检核，不会因此让同事'
  merge: -1
  img_proc: true
- pgno: 312
  md: '们感到压力，反而能随时协助他们确认自己的工作状况。


    # 五、允许团队犯错


    犯下错误、造成失败并不可耻，让团队成员有犯错空间，勇于承担风险，并带领他们从失败中学习，才是好主管应有的态度。犯错无法避免，但做为主管，你能做的事情，就是协助同事将错误'
  merge: -1
  img_proc: true
