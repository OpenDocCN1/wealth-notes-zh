- pgno: 430
  md: '# 试著成为组织中的「懒蚂蚁」,而非勤奋的「工蚁」


    你是不是经常觉得，付出同样的辛苦，别人赚的却比你多？甚至有人真能「躺着赚」，让人很不服气。


    关于这点，著名幽默作家周腓力讲过一个故事。


    有一次，他经过街边一家服装店，看到有位老先生靠在店门口躺椅上悠哉地晒太阳。一问才知道，原来这个无所事事的「闲人」，就是服装店老板，而店里忙进忙出的，则是他的老婆跟两个女儿。'
  merge: -1
  img_proc: true
- pgno: 431
  md: '作家很羡慕，说：「老先生，您可真有福气，老婆、小孩都这么能干，您啥都不用做，就可以在这儿晒着太阳享清福。」谁知，老先生听完，不以为然摇摇头，神秘地说：「你觉得我什么都没做？不对。其实我正在做一件最最重要的工作。」作家惊讶地问：「什么工作？」老先生神色一变，严肃地回答：「我在承担风险。」


    这个回答乍看只是玩笑，但是仔细想想，其实也有几分道理。别看是一家小小的服装店，开在哪里、怎样装修、进什么货品、如何摆放、雇什么样的人、如何管理……稍微一想，就有无数让人头疼的细节。'
  merge: -1
  img_proc: true
- pgno: 432
  md: '所有这些都是选择，而只要做选择，就一定要承担相应的风险。


    所以，在路人看来，老板只是在晒太阳，但在老板心里，店里生意经营得怎么样，完全是他这一连串选择的结果。


    这就像是程式师写好了代码，总不能说之后的系统运行就不是他的功劳，而相关的升级和维护也都跟他无关吧？你请一个咨询公司帮你出主意，肯定不会把收益的大部分分给对方，因为不管对方给你出了多棒的主意，毕竟做决策的是你，承担风险的也是你。'
  merge: -1
  img_proc: true
- pgno: 433
  md: '所以，在常见的「体力劳动」和「脑力劳动」之外，还存在着一种「风险劳动」。


    很多组织领导人为了表示自己知人善用，常常会说「用人不疑」。可是你有没有想过，人总是会变的，人总是有弱点的，哪有什么人真的没有疑点，值得完全信任？既然如此，为什么领导人还是经常把这句话挂在嘴边呢？


    道理很简单，'
  merge: -1
  img_proc: true
- pgno: 434
  md: '因为领导人的职责之一，就是要承担「察人」和「用人」的责任，一旦任用，就要将权力充分下放，使其得以发挥最大效能。


    如果半信半疑，想用又不敢担责，徒增组织人事成本。说穿了，世上没有完美的选择。所以，如果没有愿赌服输的魄力，就不适合杀伐决断的岗位。所谓「成大事者不纠结」，不能「好谋而无断」，就是这个意思。


    因此，领导者选人用人，也是一种「风险劳动」。在不确定的世界里做确定的决策，在压力和焦'
  merge: -1
  img_proc: true
- pgno: 435
  md: '虑面前保持冷静，这就是风险劳动者的基本特质。


    不过，如果你以为风险劳动只是决策者或管理者的事，那就又错了。有一些看似纯体力劳动的职业，其实也有一大部分收入来自风险劳动。


    比如说，同样在煤矿区工作，下井和不下井的工人，待遇相差极大；同样是清洁工作，在室内擦玻璃和在室外进行高空作业的，收入也大不同。这显然不是由体力劳动的程度、而是由风险劳动的程度决定的。甚至是像中国的超市收银员这样看起来跟风险沾不上边的工作，员'
  merge: -1
  img_proc: true
- pgno: 436
  md: '工收入里也经常包括一笔额外的「风险金」，就是为了应对难免会出现的款项短收现象。也就是说，如果因为你的大意造成了公司的损失，你得负责赔偿。但别担心，这里的风险已经事先算进「风险劳动」这部分的收入里了。


    在企业管理上，关于「风险劳动」的概念还有一种延伸应用。如果你整天忙忙碌碌、日程排满，那反而说明有问题。


    要让自己有时间闲下来，要让一部分人经常能闲下来，去做些看似没意义却更具挑战性的事，才能产生更大的效益。这就叫作「懒蚂蚁效应」。'
  merge: -1
  img_proc: true
- pgno: 437
  md: '蚂蚁一直被视为勤劳的代表,但是北海道大学生物学教授长谷川英佑有不同看法。他在 2002 年做了一个实验,将九十只蚂蚁分成三组,然后 在各自的人工巢穴里安装迷你摄影机,观察蚂蚁的日常行为。结果发现,每个小组都有
    20%的蚂蚁其实是不做事的,要嘛躺着不动, 要嘛就是在巢穴周围四处闲逛,教授叫它们 「懒蚂蚁」。


    这就奇怪了,这么勤劳的物种,怎能容忍一群白吃白喝不干活的废物？但是稍等,它们只有在非常时期才能发挥作用。当研究者断绝了这'
  merge: -1
  img_proc: true
- pgno: 438
  md: '群蚂蚁的食物来源时，那些平常工作起来很勤快的蚂蚁立刻陷入混乱，急得团团转，反倒是那 20% 的懒蚂蚁站了出来，带领蚁群找到新的食物来源。


    原来，那群蚂蚁平时闲闲没事、四处游荡玩耍，其实是为了侦察和研究。也就是说，蚂蚁在亿万年的进化中形成了这样一个群体智慧：种群要保持一部分「闲逛」的自由，遇到危机时，才更有可能找到新出路。


    这项研究结果被管理学界形容为「懒蚂蚁效应」。'
  merge: -1
  img_proc: true
- pgno: 439
  md: '意思是说，在一个组织中，一定要有一批这样的「懒蚂蚁」，不被日常事务性工作绑定，而将大部分时间用于「侦察」和「研究」，发现组织的薄弱之处，同时保持对外界环境的敏锐感知。


    说穿了就是不遵常规、敢想敢做。反过来说，如果一个组织里全都是勤快老实的工蚁，只知低头干活、不知抬头看路，那它可能看起来效率高，但是关键时候的应变能力一定很低。这个风险，比一部分人游手好闲不干活的风险更大。'
  merge: -1
  img_proc: true
- pgno: 440
  md: '按照管理学大师彼得.杜拉克的说法，大部分管理者都是「组织的囚徒」。因为公司的每个人都可以随时来找你，而你也必须回应所有人的需求。上级可能随时找你开会，下属可能随时找你汇报，一有突发状况也随时需要你冲到第一线。这样一来，你很容易陷入事务性的繁忙中，忙着打电话、忙着发邮件、忙着完成各种KPI
    指标。最直接的后果，就是你变成了「近视眼」，只看到眼前的具体事务，没时间思考团队的前进方向。


    可是，做为管理者必须思考，蚂蚁的世界那么简单，尚且需要20%的「懒蚂蚁」时刻留神'
  merge: -1
  img_proc: true
- pgno: 441
  md: '外界变化，人类社会这么复杂，又怎能只考虑眼前的工作？


    所以杜拉克直言：


    > 「一个管理者整天加班还嫌时间不够用，并非什么值得夸耀的事，反而是极大的浪费。」


    因为管理者最欠缺的资源不是人力，也不是预算，而是时间。


    不管日常工作多忙，也要给自己留出反省总结和提升的时间，让自己「闲」下来。这个「闲」不是脑子放空，沉迷于追剧、玩游戏，而是不'
  merge: -1
  img_proc: true
- pgno: 442
  md: '带任何具体目标地研究自己手头上的事。比如说，怎样理解你的用户，怎样理解市场、业态、竞品、产业趋势。这些都是「重要但不紧急」的事，看起来东拉西扯，但是战略方向要想逐渐成为型，还真少不了这些工作。


    再举一个古代的例子，战国时期孟尝君门下食客三千，不可靠的人居多。但是关键时刻，却总是这些「闲人」发挥大作用。比如说，孟尝君派一个叫冯谖的门客去封地收帐，这位仁兄一看当地人日子过得挺苦的，就把所有债券凭证烧了，回来跟孟尝君说，钱是没有，但我给你买来了「义」。用现在的话说，公司现金'
  merge: -1
  img_proc: true
- pgno: 443
  md: '流是不错的，关键是公关形象方面有点问题，所以我自作主张，帮你做一波形象宣传。


    果然，不久后孟尝君遭齐王猜忌，被迫回到封地，结果老百姓十分感恩，出城十里远迎，这个良好的群众基础，成了孟尝君东山再起的本钱。


    冯谖当初的举动看起来没事找事，却是未雨绸缪，为孟尝君留了一条后路。用一般的人才考核标准来看，怎能衡量出这一招的价值？所以，这时就需要有闲人、下闲子、出闲招，这种「闲招」从策略意义上来说，又是极其重要的。'
  merge: -1
  img_proc: true
- pgno: 444
  md: '现代企业管理中也非常重视「懒蚂蚁」的贡献。


    有些企业会建立完备的策略规画和市场分析部门，它们不负责产出经济效益，只负责分析市场动向，为企业提供灵敏的嗅觉。


    总之，赚钱这件事，真的不一定是「一分耕耘一分收获」。忙不一定高效，闲也不一定浪费。


    你觉得别人是在躺着赚钱，其实很有可能只是因为别人选择了正确的劳动方式。'
  merge: -1
  img_proc: true
- pgno: 445
  md: '# 部属表现差却自我感觉良好，该怎么沟通？好

    主管会做的 3 件事


    身为管理阶层，必须要懂得鞭策自己的下属，但对于表现不好的员工，如何指导还真是一门学问。


    遇到绩效差或工作态度不佳的职员，面对面、指出你希望他改进的地方是最好的方法，但在面谈前，主管最好先做好万全准备，才得以保证这样的指正真的有效。'
  merge: -1
  img_proc: true
- pgno: 446
  md: '# 厘清对员工的期待，再进行沟通


    他在《Inc.》写到，好的管理者应该在面谈前，想清楚 4 个问题，把对员工的期待具体化，方便沟通：


    +   - 员工是否知道他们的问题出在哪？

    - 员工真的知道他们应该达到的水平吗？

    - 员工是否明白若表现不达标会有什么影响？

    - 你身为管理者，是否掌握所有客观影响因素，譬如导致问题的人、事、地点、时间、原因和过程？'
  merge: -1
  img_proc: true
- pgno: 447
  md: '那选在何时面谈比较好呢? Marcel Schwantes说，下班前、结案前、周末前都是员工和管理者双方心情比较稳定的时候，建议找个员工可以放松心情畅谈的环境，进行面谈。


    # 留意13个要点，帮助员工燃起改善动力


    在沟通的当下，优秀的管理者必须把握13个「训话」的基本原则，帮助员工认清问题后，能够找到改善方式，并且燃起愿意改善的动力：'
  merge: -1
  img_proc: true
- pgno: 448
  md: '+   1. 针对员工的表现，而非针对个人

    2. 面谈要针对事实论述，不要有太多个人臆测

    3. 要保持客观，以数据背书

    4. 完整并清楚表达你的期待和该如何达成这个目标

    5. 聆听且允许员工吐苦水

    6. 如果可能也有自己的因素导致问题发生，不要卸责

    7. 聚焦在未来进展，不要数落过往

    8. 试着用开放性问题让员工表达

    9. 了解员工的想法后，不要直接否定，但可以提出建议的改善方式'
  merge: -1
  img_proc: true
- pgno: 449
  md: '+   10. 留给员工一点面子


    +   11. 最后，把这次的谈话重点记录下来


    +   12. 要给员工足够的信心，让他们知道自己


    是可以完成的，也让他们知道若遇到困


    难可以找你


    +   13. 设定再次审核的时间，以利追踪员工绩效


    不过，当然不是每次面谈都能如此顺利，有些员工就是特别考验管理者的耐心，他们总是不正视自己的问题所在，这时，管理者就需要拥'
  merge: -1
  img_proc: true
- pgno: 450
  md: '有高EQ，保持冷静、客观，尽量用平和的口气重复需要员工改善的地方。


    # 最后的5个杀手锏，都没用就开除他吧


    如果员工真的还是不听劝，什么都听不进去，大概会很想直接炒掉他吧？请稳住，如果这位员工没有糟糕到影响公司团队或会对公司其他人造成危害，还是有有机会挽救的，试试以下方式：


