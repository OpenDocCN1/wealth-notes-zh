- pgno: 3
  md: '# 破实权同盟之法在于使之相互猜忌继而可达到目的。


    任何一个团队，作为一个完整的组织体系，组织成员之间必然存着上下级关系，其本质是一种相互依存，相互合作、共生共长的关系，上级需要下级的拼搏以达成管理目标，下级也需要上级的提携以完成发展目标，上下级关系和谐，成员各显所能，各尽其职，运行效率高效；反之成员关系紧张，相互推诿，各自为战，运行效率低下；如果上下级相互猜忌，缺乏信任，团队就会失去战斗力。本文试图通过剖析历史上君臣因相互猜忌而引发的历史悲剧，提出重'
  merge: -1
  img_proc: true
- pgno: 4
  md: '构上下级关系的历史之鉴。


    # 1 相互猜忌之历史溯源


    猜忌即猜疑、忌妒。在《后汉书·申屠刚传》首次出现：“平帝时，王莽专政，朝多猜忌。”南朝梁刘勰《文心雕龙·指瑕》：“近代辞人，率多猜忌。”而在冯梦龙《东周列国志》第五回：“群臣奏曰：‘依臣等公议，王不委质，无以释郑伯之疑；若独委质，又使郑伯乖臣于之义。莫若君臣交质，两释猜忌，方可全上下之恩。’”周郑交质在左丘明《左传·隐公三年》中也有描述。


    东周自平王东迁立国，天下大乱，礼崩乐坏，连姬姓的天子宗室忠心辅佐程度也在下降。郑'
  merge: -1
  img_proc: true
- pgno: 5
  md: '庄公是平王的卿士。平王想分权给虢公，郑庄公怨恨平王。平王说：没有做想分权于虢公的事情。并用交换人质以证互信，即平王的太子狐到郑国做人质，庄公的儿子忽到周王室做人质。庄公作为周平王的下级，周平王作为上级想分权给虢公，是其权限内的事情，庄公敢于埋怨周平王。周平王竟还要解释，解释不行，还要交换人质来保证信用。充分体现当时群雄纷争，尔虞我诈，天子地位一落千丈。


    君子说，信用不是发自内心的，盟约抵押作用不会太大。只有开诚布公、互相谅解地做事情，用“礼”加以约束，即使什么都不抵押，天下也不能离间他们。“礼”和“信”是做人的根'
  merge: -1
  img_proc: true
- pgno: 6
  md: '本，是克服猜忌的良药。人与人之间，国和国之间，以礼相待，相互信任，才能更好的合作和发展。否则，就算“周郑交质”，结果仍然是“周郑交恶”。纵观现代社会由于功利性太强，“礼”“信”缺少，各种各样信任缺乏的事件时有发生，为了蝇头小利，尔虞我诈，勾心斗角，真是令人痛心。


    培根在《论猜忌》中对猜忌做了精辟地论述：

    “猜疑之心犹如蝙蝠，它总是在黄昏中起飞。这种心情是迷陷人的，又是乱人心智的。它能使你陷入迷惘，混淆敌友，从而破坏人的事业。猜疑易使君王变得暴戾，使做丈夫的产生嫉妒之心，使智者陷入重重困惑。”'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# 2 相互猜忌之功臣被杀


    在这五千年的历史长河中，中华民族生生不息，拼搏不止，涌现了许多伟大的历史人物，无论是变幻莫测的政治权变，还是错综复杂人际关系，无不体现着精湛的智慧。在这历史演变的进程中，人际关系处理方式特别引人关注，而君臣关系作为非典型上下级关系更为突出，君臣之间相得益彰，各取所需，共享其成，其乐融融者有之，如东汉光武帝刘秀之“云台二十八将”、唐太宗李世民之“凌烟阁二十四功臣”，供人顶礼膜拜，传为千古美谈；但也有君臣患难与共成功后，兔死狗烹、鸟尽弓藏，血雨腥风者更有之，汉高祖刘邦称帝后诛'
  merge: -1
  img_proc: true
- pgno: 8
  md: '灭功臣，杀韩信、杀彭越、杀英布、杀一个又一个，明太祖朱元璋平定天下后，编织郭恒案、胡惟庸案、蓝玉案，以谋反和株连为名，杀一批又一批，被杀有10万之余，仅汤和等数人幸免。一句蔽之君臣共患难易，同富贵难。


    刘朱二人雄才大略、人中之龙，为保皇权，大肆杀戮功臣，原因很多，有主观原因，有客观原因；有出身问题，有政治需要，但其中相互猜忌不失为其中一个重要原因。正所谓“君臣不可疑，疑则为乱，故君疑臣则诛，臣疑君则反。若臣疑于君而不反，复为君疑而诛之；若君疑于臣而不诛，则复疑于君而必反。”


    # 3 相互猜忌之前车之鉴


    6'
