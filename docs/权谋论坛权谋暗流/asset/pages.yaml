- pgno: 530
  md: '# 做人 vs. 做事，哪个比较重要？菜鸟、中阶、高阶要在乎的不一样


    工作上到底做人重要还是做事重要？


    很多人都认为做人比较困难却比较重要，因此初入职场就想要学做人，却经常事倍功半。我认为在不同的年纪、职位，所要专注的先后顺序就要不一样，才能循序渐进、学到心法。'
  merge: -1
  img_proc: true
- pgno: 531
  md: '刚出社会，应该 80% 做事 20% 做人。等升迁到中阶主管，就应该 50% 做事 50% 做人，到了高阶主管大部分的时间都要拿来做人和只要花一点力气做事，即
    80% 做人 20% 做事即可。


    最主要的原因是，新人在初入职场还没建立自己的专业前，若太专注在做人上，难免会让人觉得有点耍小聪明、太有心机。不如把力气放在做事上，把份内的事做好，建立专业，得到别人的肯定，再学习沟通协调的能力，别人也比较会把你当一回事。'
  merge: -1
  img_proc: true
- pgno: 532
  md: '但到了高阶主管后，就要反过来把大多数的时间放在人身上。不要小看做人的部分，以为只是下达指令，善于沟通即可。它可是沟通协调、跨团队合作、谈判技巧的总和，再加上给方向、激励下属、建立企业文化、解决问题、仲裁部门及人事纷争。这些属于高难度、高复杂性的工作，就需要有工作经验、人生历练、熟稔公司事务的资深人员来完成。


    为什么大家都说做事容易、做人难？做事可以有 SOP（标准作业程序）、可以系统化，只要愿意努力大概就能达成目标。但是做人可没有 SOP，同样的一套方法放在不同的人身上，会呈现不同样的效果，这就是做人的难度。高阶'
  merge: -1
  img_proc: true
- pgno: 533
  md: '主管的价值在于整合，整合必须跨部门协调，必须说服不同人的意见，找出共识，然后激励团队往前走，并承担责任。


    作为主管，应该把激励团队当作最主要的任务之一。其实大家都知道，没有团队成不了事。自己的能力再强，还是跟不上集体的速度，这是个打团体战的时代，不适合单打独斗。团队凝聚力和向心力的背后，就是要有个能服众的领导者，谁能激励团队迈向目标，谁就有具有领导力。领导者不见得一定要是团队能力最强的，但是必须是团队最信服，最有胸襟的人。'
  merge: -1
  img_proc: true
