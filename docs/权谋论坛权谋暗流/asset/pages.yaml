  md: '芦州府，打破罐州城，汤元帅在逃，拿住了豆将军，红孩儿当关，多亏了菜将军。 』


    朱元璋听了他的话，笑了起来，念及当年的情谊，封这位穷朋友做了御林军总管。


    同样的一段往事，两个人以不同的方式讲述出来，得到的是截然不同的对待。第一位穷朋友就错在没有顾忌到朱元璋的感受。朱元璋毕竟今时不同往日，是高高在上的皇帝，别人如此直言说出他当年落魄时那些上不得台面的往事，难免会让他觉得没有面子，而且会认为对方不尊重自己，从而恼羞成怒起了杀心。而另一位穷朋友，他所说的话巧妙地暗示了当年发'
  merge: -1
