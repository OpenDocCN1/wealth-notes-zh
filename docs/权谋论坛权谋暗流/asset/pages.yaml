  md: '在韩信眼里，他懂谋略、懂兵法，应该要成为军中主将，却沦落到这个职位，根本大材小用，一怒之下便逃离汉营。不过，萧何识人能力极强，深知韩信是不可多得的人才，漏夜追回韩信，重新推荐给刘邦。


