- pgno: 125
  md: '唐太宗的管理真言可用“屈己纳谏、任贤使能、恭俭节用、宽厚爱民”16 字来总结。在今天的中国，有很多企业家、管理者非常推崇唐太宗的管理之道和个人魅力，他们推崇唐太宗李世民为中国历史上排名第一的
    CEO，并将他的管理之道借鉴运用到现代管理中来。


    # 一、选才


    对人才的重视、尊重和培养是唐太宗成功兴国的首要策略。他善于选贤任能，培养直谏的气氛，天下之才皆为他所用，集中大众的智慧。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '他相信“兼听则明，偏听则暗”，他秉承“水能载舟，也能覆舟”的重要思想。在怀念一代名臣魏征时他还说过一段千古名言：“以铜为镜，可以正衣冠；以古为镜，可以知兴衰；以人为镜，可以明得失。”……这些，都是唐太宗留给后人的闪烁着光芒的智慧和宝贵财富。他的领导艺术与管理智慧曾为历代统治者和有识之士所推崇。


    企业用人，关键在于看得准、用得对。这样，人才就会立刻出现在你面前，否则即使人才就站在你面前，你也未必能看见。唐人韩愈说：“世有伯乐，然后才有千里马。千里马常有，'
  merge: -1
  img_proc: true
- pgno: 127
  md: '而伯乐不常有。”问题不在于是否有人才，而在于是否有发现人才的“伯乐”。


    # 二、用才


    谏议大夫魏征就是一个典型的“逆才”，他经常对唐太宗的缺点和不足犯颜直谏，多次让唐太宗威仪扫地。他于贞观十三年所上《十渐不克终疏》，尖锐地指出唐太宗十个方面的过错和缺点，令唐太宗非常尴尬。可唐太宗一贯将魏征作为难得的贤士善待之，重用之，甚至于尴尬之后，将《十渐不克终疏》列诸屏风，朝夕瞻视，并作为其当朝执政的座右铭。正因有魏征之类的“逆才”和唐太宗善待“逆才”的'
  merge: -1
  img_proc: true
- pgno: 128
  md: '雅量，才会有大唐基业的稳固和贞观盛世的出现。


    在企业中只有相信下属，用人不疑，才能与下属建立起密切关系，上下一心，做好事情。每一个下属，都渴望获得领导者的信任。如果领导者高度信任下属，让他们放开手脚大胆工作，那么，下属就会受到激励最大限度地发挥聪明才智，积极肯干，变革创新，表现出极大的工作热情。


    # 三、爱才


    唐太宗选贤任能不论亲疏，不避怨仇，不囿派'
