  md: '不紧急」的事情，才不会总是在救火处理「紧急不重要」的事。


    时间管理的四象限给了我们许多启发，不过在 职场上更重要的，其实是要注意由谁决定某件 任务的重要性或紧急性？是由你自己、你的上 阶主管还是相关同事呢？许多工作者把象限
    画出来后，就急着将事件分类，埋首于自己认 为重要或是紧急的事，但事情的重要（紧急） 性却与主管期望的完全不一样。你的努力勤奋 用错了方向，也导致工作效率不彰，其实是很
    可惜的事情。四象限是很好用的工具，但投入 工作前别忘了与身旁的利益关系人核对。'
  merge: -1
  img_proc: true
- pgno: 397
  md: '# 2. 理解时间颗粒度


    # 普通人一成不变，卓越者会找出最适单位


    时间颗粒度指的是安排时间的基本单位。朋友传给我一张中国首富、地产大亨王健林的行程表。62 岁的他，早上 4 点起床健身吃早餐，5 点 45 分前往机场，一整天飞行
    6000 公里，到了三个城市，然后晚上 7 点回到办公室，继续加班。行程表显现的不只是他把握时间，而是可以看出他安排一件事情的时间单位，基本上是 15 分钟为一个时间颗粒度。据说微软创办人比尔。盖茨的时间颗粒度是
    5 分钟，'
  merge: -1
  img_proc: true
- pgno: 398
  md: '将时间切分至如此细微，几乎是类似美国总统的时程安排了。


    学习时间颗粒度的概念，并不是要让我们学着将时间也切割得如此细致。而是可以停下来思考一下，个人在商业世界中的时间颗粒度以什么为单位呢？你是以半个小时、 1 个小时还是半个工作天安排手上的公事？或许你可以省思一下个人的时间颗粒度，当你的工作与责任愈来愈大时，单位时间的价值相对提高了，那么时间颗粒度有没有可以提升与细化的空间，帮助自己妥善管理好每一个时间片刻。


    # 3. 让时间价值极大化'
  merge: -1
  img_proc: true
- pgno: 399
  md: '# 普通人「管理时间」，卓越者「经营时间」


    传统的时间管理原则着重在如何妥善地分配时间、避免浪费时间，也就是把时间用好用满。因此除了要学习如何将事情分为轻重缓急外，也清楚地列出待办事项清单，对所做事情所花的时间进行记录与省思，这些方式的确能帮助我们珍惜时间、找出时间的碎片。然而，若你想让时间的投入与成果显得更有价值，则必须进一步学习经营自己的时间。


    比方说，思考如何将一段时间所产生的成果尽量多元化？当你带领部属完成了一项专案，别只是花时间开会检讨缺失，也可以想想这段时'
  merge: -1
  img_proc: true
- pgno: 400
  md: '间对未来还能有什么帮助？你可以试着把专案期间的 lesson learnt 收集起来，虽然多费了些时间，但投入的时间将产生可重复利用的收益性。因为下次遇到类似的需求与情境，这些
    lesson learnt 可以更有效地让团队成员做出应对，避开可能重复的困难与错误，帮助团队成功。因此，从经营时间的角度出发，能让你预先设想未来期望达到的成果收益是什么，连带地影响你决定如何进行高效的思考、学习与工作。


    当我们感觉到时间不够用，就会直觉地去寻找关于时间管理的方法。不过，认真说起来，我们无法「管理」时间，时间分分秒秒都在流'
  merge: -1
  img_proc: true
- pgno: 401
  md: 逝, 它不像一般的资源可以生产、储存与组织。我们真正能管理好的, 其实是自己看待时间的意义, 在组织中什么是重要的事情? 如何善用 自己的单位时间? 如何经营时间获得更多收益?
    唯有如此, 才能做自己时间的主人, 也管 理好你的人生。
  merge: -1
  img_proc: true
- pgno: 402
  md: '# 从动口又动手，到只要动口


    主管要动手做事呢？还是动口下命令，指挥、教育训练呢？


    这个答案很简单，


    一定要做个动口的主管，而不要做个动手的主管。


    如果主管要自己动手做事，一定是十万火急，万不得已的状况；所有的团队都已经弹尽援绝，派不出任何人手了！


    我们可以设想主管的功能，是要带领团队完成组织交付的任务，完成任务是终极目的，而手'
  merge: -1
  img_proc: true
- pgno: 403
  md: '段是带领团队去完成，所以主管的功能是带领团队而不是自己动手做。


    带领团队的方法，就是动口、下指令、指挥、教育训练。


    **动口是分工设职，划分团队成员的角色，要他们去做不同的工作。**


    **下命令是指挥、协调，要团队按既定的流程，一步步完成工作。**


    **建团队、冲绩效，店长就能做得到！7/22、8/6**


    **超级店长学 2019 最终场**'
  merge: -1
  img_proc: true
- pgno: 404
  md: '动口还有一个重要的功能是教导，如果团队不会做事，主管就要负责把团队教会，然后完成工作。


    有些不成熟的主管会说，为什么要教呢？教了半天团队依然不熟练，也做不好，不如自己做比较快，教是得不偿失的事。


    这完全是错误的观念，一个主管只有两只手，能做多少事呢？只要把团队教会了，以后每个人都可以做事，这是一劳永逸的事。而且就算学习缓慢，但只要不断教，团队总会学会，绝不可以因自己较熟练，就自己动手做。'
  merge: -1
  img_proc: true
- pgno: 405
  md: '组织健全，团队干练，是作为主管的终极情境， 主管只要动口，指挥若定，完全不用自己动手， 可是大多数的主管做不到。


    一般而言，主管所带领的团队多是新手、老手 兼具，团队能做事，但也不完全充分，通常都 需要主管一起动手工作，才能勉强应付。这种 状况，主管就要一面动手，和团队一起做事，
    另一方面也要同时动口，指挥调度，才能有效 完成工作。


    而什么样的工作，应由主管自己动手做？什么 样的工作，应分派给团队去做呢？


    主管自己动手做的事，通常有 3 种：'
  merge: -1
  img_proc: true
- pgno: 406
  md: '一种是主管做得非常熟练的事，主管自己做效率较佳，比他人更快、更好。 这种工作如果由主管带头做，会产生极大的效益。


    第二种是所有工作最重要、最困难的部分，由主管自己动手做。


    第三种是整合协调的工作， 这种事关整体综效的职务，由主管自己负责，有其道理。


    又动口又动手的状况，通常要维持许久，一直 到整个团队上轨道，主管才能放手。'
  merge: -1
  img_proc: true
- pgno: 407
  md: '# 在主管面前「被黑了」？


    # 组织犹如社会缩影，别轻忽人性


    许多人在职场中总是抱持着「认真做事、踏实做人」的态度，这虽然是绝佳的职场哲学，但也千万别轻忽了只要有人的地方，总免不了竞争和淘汰！除了认真踏实以外，也要略懂在职涯丛林中的求生之道。


    其实，职场的竞争不外乎就是一个「资源分配」的竞逐，因为组织的分工和运作永远都是环绕着这个核心的问题，关键的位置必然掌握着最重要的资源。'
  merge: -1
  img_proc: true
- pgno: 408
  md: '但就组织决策者的思维而言，除了将资源做最有效的分配以获取最大的效益，其他的附加价值就是借着资源分配，彰显决策者的权力！


    因此，在职场中的首要生存之道：就是将自己的利用价值极大化（创造最大效益），其次是：最大程度满足决策者的权力欲（安全感）。


    创造自己的价值，就不怕被淘汰


    多数的员工在自己生涯的过程中，最常思考自己得到了什么？例如，老板给我什么样的待'
  merge: -1
  img_proc: true
- pgno: 409
  md: '遇？给我什么福利？给我多少人力？给我多

    大的决策权力……


    除了安于现状这个通病以外，多数人鲜少去思

    考：我究竟为这个组织或公司带来多大的效

    益？防失联V：357607890包括自己的本职

    学能以外，是否继续学习


    以跟上公司的成长？自己的下一个挑战目标

    是哪一个部门？该做些什么准备？有什么新

    的机会值得公司关注或投入？


    其实，每个老板都不喜欢「倚老卖老＋安于现

    况」的员工，更担心「找到机会就想跳槽或创

    业的家伙」。如果想要将自己的价值极大化，

    就必须要适应公司变革及老板想法，随时准备好'
  merge: -1
  img_proc: true
- pgno: 410
  md: '投入公司新的商机、担任开路先锋，避免和「不想变革」或是「缺乏忠诚度」画上等号。因为公司、老板和你、我都一样，唯有不断进步才是成长之道。


    # 要让老板信任，用 3 方法建立安全感


    权力欲望自古以来就是领导者带领团队不可或缺的「必备良药」，一个缺乏权力欲的领导者，往往也会缺乏对于关键决策的敏感度。因此，我们难免会遇到掌控欲望强烈的主管，特别是一个组织的迅速成长，虽然需要领导者懂得授权，但别轻忽了这个权力是由他所授予，'
  merge: -1
  img_proc: true
- pgno: 411
  md: '这个过程和这个权力的根源如果被忽略了，就会失去领导者对你的信任。


    要建立领导者对你的信任，让他具有安全感，


    一般有几个重要的方向：


    +   1. **能力互补**：针对领导者熟稔的领域，以他的意见为主；对于他不熟或是不想着墨的区块，应主动补位协助分担工作。


    +   2. **资讯通透**：以领导者的标准为依据，切勿自行判断事情的轻重缓急，或选择性地只让老板知道部分资讯，以免造成「知情不报」的错觉。'
  merge: -1
  img_proc: true
- pgno: 412
  md: '+   3. 情感交流：身为主管要确实了解属下；属下则要做好向上管理，最重要的方式就是适当的沟通，无论是1 on 1 的会议或是适时聚会，甚或是家庭聚会及休闲活动都是很好的交流机会。


    再长的篇幅也说不完该怎么处理「人心的问题」，但可以确定不变的原则是：所有的一切源自于人性，在基于顺应人性的原理下将事情圆融，将人的情感与情绪抚平，将自己的能力与价值发挥到极大，你在职场上也必然能够更加顺心顺利。'
  merge: -1
  img_proc: true
- pgno: 413
  md: '# 员工爱抢话、太沉默都很棘手！5 种常见的难摘部属，怎么应对？


    一场会议里，可能有员工意见很多，提了超多点子；可能有员工很有想法，却不轻易脱口；甚至有员工觉得十分疲惫，已经放弃为团队贡献。每名员工的个性都不太一样，身为主管，最好准备好各种管理方式，才能有效激励不同员工。


    +   1. 面对爱发表意见的员工，请他收敛点


    如果有员工很爱发表意见、常打断同事发言，害大家都没机会说话，主管也不该在会议当下'
  merge: -1
  img_proc: true
- pgno: 414
  md: '给他难堪。建议主管在开会前私下找这名同事聊聊，跟他说你也很想听听其他人意见，让他记得预留时间让别人发言。


    主管也可以提醒他，一次发表太多意见，听者会很难消化，难以决定哪个方向是正确的。不如先自行筛选出 3 个最好的点子，再请同事一起深化这些想法，才最有效率。


    # 2. 害怕发言的员工，邀请他私下跟你聊聊


    有些员工比较缺乏自信，在公开场合发言容易紧张。为了确保员工的声音都可以出现，主管'
  merge: -1
  img_proc: true
- pgno: 415
  md: '可以开放更多沟通管道，例如写信、Line 等, 让会议上沉默的员工也有机会在其他管道表达意见。甚至可以请员工开会前先找你聊聊，透过你分享他的意见给整个团队。


    3. 有员工被排挤？办一些活动帮助融入


    团队里有边缘人？身为主管须重视此问题，以身作则树立良好风气，试图让大家都融入团队。'
  merge: -1
  img_proc: true
- pgno: 416
  md: '主管可以每月主撤一个披萨趴, 或了解一下被排挤的员工下班后喜欢做什么, 办一些他会喜欢的活动, 提升他的团队参与度。


    # 4. 遇见加班狂, 协助改正他加班的原因


    有的员工责任心特别强, 常将所有工作往自己身上揽, 搞得自己疯狂加班、筋疲力竭。主管这时应该和他好好聊聊, 了解他期望的工作量、希望得到那些同事的帮助等。


    有些人也可能不懂拒绝, 莫名其妙承揽不相干业务。这时候主管该挺身而出, 帮员工挡掉外'
  merge: -1
  img_proc: true
- pgno: 417
  md: '来事务，或协助员工厘清工作优先顺序，调整员工的工作量。


    # 5. 替进度落后的员工，拟定明确工作时程


    明确告知员工部门规画、工作死线，有助于员工掌握工作进度，不至于拖累团队。如果员工进度落后，主管不妨偶尔盯紧一点、激励员工往前，适时认可和赞美员工努力，会让大家更有工作的动力。'
  merge: -1
  img_proc: true
- pgno: 418
  md: '# 别把人才变庸才！


    因其材以取之，审其能以任之，用其所长，掩其所短。——《贞观政要・择官》


    开创「贞观之治」的唐太宗，是历史上的明君；然而，他能打造盛世不只是靠自己的能力，更多时候是靠着大臣的直言进谏，修正不好的行为，开创和平安稳的朝局。


    《天可汗的领导学》提到，《贞观政要》记载唐太宗和下属王珪在宴会上对谈，当时一位美人随侍在侧，这美人是庐江王李瑗的妾室，李'
  merge: -1
  img_proc: true
- pgno: 419
  md: '瑗杀了她的丈夫后将她占为己有，李瑗作乱失败后，她并入籍皇宫。王珪用了一则《管子》的故事规劝唐太宗，把这位美人纳入宫中不妥当。


    > 「臣闻于《管子》曰：『齐桓公之郭国，问其父老曰：「郭何故亡？」父老曰：「以其善善而恶恶也。」桓公曰：「若子之言，乃贤君也，何至于亡？」父老曰：「不然，郭君善善而不能用，恶恶而不能去，所以亡也。』」今此妇人尚在左右，臣窃以为圣心是之，陛下若以为非，所谓知恶而不去也。」太宗大悦，称为至善，遽令以美人还其宗族。'
  merge: -1
