- pgno: 146
  md: '在一切以天意、先祖为合法性来源的封建家长制及在此基础上构建起来的封建等级社会中，个人婚姻关系的存续，都是为家庭、宗族服务，为了家族的延续和家长制度的永存，而家长权恰恰是这一一切的守护者。因此，在古代中国封建社会中，这种以宗族利益为核心的基础上缔结的婚姻关系，若其目的无法达成，婚姻则必须解除。代表无上夫权的“七出制度”：


    “无子、淫乱、恶疾、不事姑舅、口多言之、盗窃、嫉妒”实质是家长权的象征。“七出”中的七种情形分别反映着封建家庭内部生活秩序的七个不同方面。虽然“七出”所代表着作为夫家宗族的绝对权力，但从整个社会秩序'
