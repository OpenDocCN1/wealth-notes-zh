- pgno: 148
  md: 相对于道德， “天意” 对于统治者和掌权者而言是更为直接的约束。“天意” 是一切合法性的来源，可以说是一个国家政权的根基，违背 “天意” 就意味着权力的不正当，政权的不合法。而
    “天意” 主要是以 “祥瑞” 或 “灾异” 为表现，体现的是上天对于掌权者及世人的嘉奖和警示。古代认为，灾祸是神灵愤懑的反映，是对世人行为的不满，而非正常的自然现象。“政事不休是致灾的原因，而政事中刑狱杀人最为不祥，其中不免有冤枉不平之狱，其怨毒之气可以上连云霄，激起神的愤怒。”
    因此，各掌权者尤畏 “天意”。在商周时期观天象测
  merge: -1
  img_proc: true
- pgno: 149
  md: 国运祸福早已成风，当时政府和百姓均认为，上天下降给人世的一切包括灾祸与祥瑞之兆均是“天”对当政者的警示和启示。当权者通过对“天”的敬畏和上天启示的解读与遵循，从而自我约束不当权力的行使，施行仁政。当然，受到上天“灾异”的警示，当权者为了消除神忿，会施行仁政，由此希望换取上天的重新信任继而巩固政权。在受到上天以“祥瑞”之兆而以示嘉奖后，当权者也会通过施行仁政来博取上天神灵の欢心，以保江山永固。“天意”不仅作为各朝代立国施政的合理与合法性的来源，在某种意义上更是限制统治者绝对权力行使的有效方法。
  merge: -1
