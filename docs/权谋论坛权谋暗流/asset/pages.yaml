- pgno: 340
  md: '板知道案子进展得很顺利，这些行为并不会让人对你反感，反倒可以让老板掌握进度，对外或跨部门沟通才不会出包。


    # 4. 你没处理好人际关系


    除了工作表现，能否升迁，还得看你会不会做人。首先最重要的是，你的主管一定要喜欢你，而要得到老板赏识，基本上你在同事间的人缘也要好。


    如果你不确定自己待人处事有没有问题，可以约主管或同事轻松聊聊，从别人的反馈中检讨一下自己处理人际关系的方式。'
  merge: -1
  img_proc: true
- pgno: 341
  md: '# 5. 你忘记为自己设下目标


    专精于现阶段的工作，不代表你已经准备好往上爬了。如果你连下一个目标都还没设定好, 便很难提升自己的地位。有空记得停下来，好好审视你的工作内容，看看是不是有哪一块可以更突破，或是哪一个领域你还没尝试、想去闯看看的，为自己设定下一个目标，朝目标前进，才会有升迁机会喔！'
