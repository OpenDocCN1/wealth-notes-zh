- pgno: 80
  md: '战国时期，中国北方有两种马非常有名：其一 是蒙古马，力大无穷，能负重千斤；其二是大 宛马，驰骋如飞，日行千里。


    邯郸有一商人家裡同时豢养了一匹蒙古马和 一匹大宛马。他用蒙古马来运输货物，而用大 宛马来传递信息。这两匹马被圈在一个马厩 里，同在一个槽里吃草料，经常因为争夺草料
    而相互踢咬，每每两败俱伤，不得不请兽医来 调治，花费不少，使得主人不胜其烦。'
  merge: -1
  img_proc: true
- pgno: 81
  md: '恰巧，相马高手伯乐来到邯郸，商人听闻后主动拜访伯乐，请他来帮助解决这个难题。伯乐来到马厩看了看，微微一笑，只说了两个字：“分槽”。


    主人依计而行，果然，二马分槽后再没有相互踢咬。


    古人的智慧：分槽喂马和同槽养猪，是古代帝王驭人术的精髓所在


    故事是死的，道理是活的。“分槽而饲”的精髓就是“不能安排两个能人一起去做同一件事情”。两个实力相当的人才就好比两匹千里马，'
  merge: -1
  img_proc: true
- pgno: 82
  md: '在一起的时候即使不互相争抢，也难免互相妒忌、互相攀比，难以专心做自己该做的事情，因此还不如分开。


    无论是古代的帝王驭人术，还是现代的领导管理学，都遵于此道。当然，能者要想才尽其用，不但要分而用之，还必须善用之。因为不同的人才各有其能，有的适合此工作，有的适合彼工作，把各种能力放在适合它们的土壤里才能生存成长。养可分，用必合，方能各自协调，发挥合力。


