- pgno: 129
  md: '系, 更不问出身。在唐初上层管理集团中, 长孙无忌是长孙皇后的兄长, 房玄龄是隋朝旧臣, 张行成原是一个布衣, 马周本为中郎将常何的门客, 魏征则是政敌李建成的谋臣。这些人后来都成为中流砥柱的人物,
    为唐朝的繁荣作出了巨大的贡献。


    同时, 唐太宗既重用士族地主杜如晦、高士廉等人, 也重用庶族地主张亮、侯君集诸人, 打破了魏晋以来任用士族地主为官的定制。更为可贵的是, 他敢于冲破民族偏见的藩篱,
    选拔'
  merge: -1
  img_proc: true
- pgno: 130
  md: '少数民族人才。如贞观六年，任铁勒族酋长契何力为领军将军；贞观十四年，封突厥族阿史那忠为大将军；后又封突厥执失思力为安国公。


    李嘉诚由一个出身微贱的打工仔成为香港首富，“长江”企业由一间破旧不堪的小厂成为庞大的跨国集团公司，他的巨大成功离不开其用人之道。李嘉诚的企业取名“长江”，就是基于其不择细流，有容乃大。精于用人之道的李嘉诚，不仅在企业发展的不同阶段大胆起用'
