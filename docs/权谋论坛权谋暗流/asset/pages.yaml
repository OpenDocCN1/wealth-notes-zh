- pgno: 76
  md: '帝王术找到的法门是：要设法让皇帝集结众臣的智慧，因为「众智之所为，则无不 成也」。如何集结众智呢？


    汉朝治国理念的建构者贾谊提出底下言简意赅的原则：「明主者南面而正，清虚而静，令名自　　宣，命物自定。」「令名自宣，命物自定」相当于告诉皇帝：在决策的预备阶段，皇帝不应该表示意见，要让底下的人充分表示意见；等部属畅所欲言之
    后，再做裁决。换言之，在上者「必使民唱，然后和之」。「南面而正」表示明主要显示出他的权威而且态度要庄重，'
  merge: -1
  img_proc: true
- pgno: 77
  md: '部属才会乐意而且慎重的提出意见。「清虚」

    表示明主胸中应该没有成见，方能装进部属的

    意见；「静」则强调明主心情要宁静方能仔细

    聆听与研判部属的意见。


    以现代的术语来说，贾谊相当于寓民主于独裁

    之中：虽然决策的最后阶段由皇帝独裁，但是

    决策的预备阶段则采用民主原则。


    有的皇帝会用肢体语言把这两个阶段划分开

    来：在他坐着的时候，大家可以肆无忌惮的攻

    防；可是，等他站起来，表示他已经有结论了，

    再多嘴，那就是大不敬了。'
