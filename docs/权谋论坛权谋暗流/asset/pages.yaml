  md: 管理是一门学问，也是一门艺术，学问可以通过学习摄取，艺术则需要感悟修炼。在这十年头的管理工作中，不断的面对充满挑战的领域里，有幸见识到一些辛勤探索的同行。通过个人的职业经历和对各个同行的观察中，我发现一个管理者他做的管理是什么样特点和模式，以及他做得好还是可再提升，从他自身外显的气质、言语、行为与决策上便能有所察觉。第一种境界的一般管理者，和他相处时，你会感觉他十分自信，性情比较张扬，很有锐气。他会非常乐意谈及他所获得的成就、职称、发表的言论或曾经发生过的经典个案，在谈论中面有得色，同时尖锐地发表对不同观点的批
  merge: -1
