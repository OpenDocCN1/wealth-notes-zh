  img_proc: true
- pgno: 131
  md: '不同才能的人，而且在企业发展的同一阶段注重任用经验丰富、极具专长的“客卿”。他的“智囊团”里既有朝气蓬勃、精明强干的年轻人，又有一批老谋深算的“客卿”。


    # 四、用真情


    “先存百姓”这一思想的形成不是偶然的。唐太宗亲身经历 了隋末的社会大动荡，亲眼看到庞大的隋朝迅速崩溃，为避免重蹈隋亡覆辙，安邦定国，唐太宗首先确定了治国的大政方针。这种“存百姓”的思想就是他吸取隋亡教训、探讨历代兴亡更替得出的最重要的治国思'
  merge: -1
