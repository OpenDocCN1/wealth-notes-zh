- pgno: 242
  md: '# **职场上，你千万不能犯这两个错！**


    《世说新语．捷悟》记载，曹操曾下令修建府内大门，完工后亲自勘查，只在门上写了一个「活」。担任主簿（相当于幕僚）的杨修看了便说，「门里有个活，就是阔，把门拆掉重做。」依杨修建议修改后的门，曹操再度巡视果然很满意。


    你应该会认为，杨修这样机灵、能听懂老板言外之意的部属，应该能仕途平顺吧？然而，杨修处处展露聪明，反而引起老板忌惮，最后难逃杀身之祸。


