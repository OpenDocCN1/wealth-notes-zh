- pgno: 268
  md: '别以为他只是想个噱头吸引注意，事实上，他考量到当时孙权刚掌权，必定想让军队有精良的新气象，才制作新军服。吕蒙没有因为个人利益反对整并，而是从上级的策略方向出发，找到最适合自己的切入点及时机。


    吕蒙成孙权爱将后，孙权曾劝吕蒙多读历史，吕蒙一开始以军务繁重为由推辞，但孙权说：「我哪是要你变博士？只是要你多读点历史。」吕蒙听出孙权对此事的重视，开始苦读。不只让孙权大悦，曾经轻视吕蒙的武将鲁肃再见他时，夸其从莽夫变得文武双全，「士别三日，刮目相看。」'
  merge: -1
