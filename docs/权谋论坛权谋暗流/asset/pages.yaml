- pgno: 452
  md: '# 老板的心都像海底针，难以捉摸？


    许多人常抱怨老板的心思难以预料，特别是对老板的人事布局，总是无法理解。其实，这某种程度代表着: **我们并未和老板处在相同的视野，具备相同的资讯认知，所以，我们无法理解他为什么要做出这样的决定。**'
  merge: -1
  img_proc: true
- pgno: 453
  md: '但千万不要因为想不通「为什么」，就错误的将结果简化为「老板一定和某人有特殊关系！」

    「被晋升的人，一定比自己懂得拍老板马屁！」

