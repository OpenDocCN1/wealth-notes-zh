- pgno: 516
  md: '# 与领导谈判不能忽略的 3 个细节


    每个人都有自尊心，希望自己能够得到别人的认可和尊重。一个人受尊重的需要如果得到满足的话，他会对自己持肯定态度，认为自己是个有用的人。而这种需要如果得不到满足，就会让人产生自卑心理，对自己持否定态度。在生活中，当一个人感觉到对方不尊重自己时，他会因为自我防卫的心理而对对方产生抵触情绪，甚至萌生意敌意。


    谈判中，谈判对手也同样希望能够得到他人的尊重，如果在谈判场上不加注意，表现出对谈'
  merge: -1
  img_proc: true
- pgno: 517
  md: '判对手不尊重的语言或行为，会让对手在内心对你产生抵触心理，心存敌意。这样的心理会让你的谈判过程异常艰难，与对方陷入激烈的讨价还价之中。


    反之，当对手感觉自己被尊重时，他会认为自己得到了认同，进而对对方产生好感，从心里接受对方。在谈判桌上，你表现出的尊重会拉近你与谈判对手之间的距离，让谈判双方的磋商能够更顺利，最终助你取得谈判的成功。


    让对方感觉被尊重有多重要？'
  merge: -1
  img_proc: true
- pgno: 518
  md: '据说，朱元璋建立明朝后，他从前乡下的穷朋友来求见他，希望能谋得一官半职。见到朱元璋后，这位穷朋友发现朱元璋虽然做了皇帝，但是面貌上似乎与从前没什么两样，便一时间忘乎所以，同朱元璋叙起旧来。


    他说：「皇上万岁！你还记得我们从前的事情吗？那时候我们给地主家放牛，你在芦花荡里偷来了一些豆子。我们就把这些豆子放到瓦罐里煮着吃。豆子还没煮熟，我们大家就抢着吃，结果豆子都掉到了地上。你又从地上抓起豆子吃，结果把红菜叶子也一同吃进了嘴里。红菜叶子卡在你的喉咙里，上不得下不得，让你苦'
  merge: -1
  img_proc: true
- pgno: 519
  md: '不堪言。后来，还是我出了个主意，让你吃下青菜叶子，才把红菜叶子一同带了下去。」


    这位穷朋友原想朱元璋听到这些儿时往事会念及旧情，没想到，朱元璋在听他讲完后却勃然大怒，命人将他斩首。


    顾及对方感受的发言，才能达到对话的目的


    后来，朱元璋的另一位穷朋友也来到京城，进到皇宫里求见皇帝。他同样也讲到了这段往事，他说：「皇上万岁！当年臣下随御驾扫荡'
  merge: -1
