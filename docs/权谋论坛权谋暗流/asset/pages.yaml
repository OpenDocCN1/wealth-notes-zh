- pgno: 266
  md: '做事不分年龄、资历，所有人都该把握表现机会，避免自我设限。很多菜鸟认为自己刚进公司什么都不懂，凡事只要听前辈指令照着做就好，但正因为资历浅，初生之犊不畏虎，更该找机会磨练技能，主动寻求表现和学习的机会。


    吕蒙虽然没有受过教育，但他武艺出众，又进退有度，让他在众多武将中脱颖而出，变成孙策、孙权兄弟钟爱的部属。年仅26岁就被派任驻守异族「山越」常进犯的险要战区，后来靠智谋生擒关羽、夺回荆州，一路被孙权由中阶军衔「中郎将」拔擢到「虎威将军」，更继周瑜、鲁肃之后成为主掌东吴前线军务的「都'
  merge: -1
  img_proc: true
- pgno: 267
  md: '督」。在他生病时，孙权甚至担心到难以入睡、

    遍求名医，可见对他的重视，已到了其他部下

    无法比拟的程度。


    想让你的才华被看见，更要懂得体察上意，并且适时透露「我都替您想好了」的讯息。


    # 为主管的决策铺路，更容易留下好印象


    在孙策过世后，弟弟孙权接掌大位，打算整并

    军队，吕蒙知道整并之后，自己会更难被重用，

    所以事先为旗下士兵换新战服，让孙权在阅兵

    时一眼就注意到他们，对吕蒙的带兵能力留下

