  img_proc: true
- pgno: 47
  md: '进者要重鞭抽打, 使被惩罚者知痛而进, 使用鞭子就是要起到督促和警示作用. 鞭子要经常甩, 甩得响亮, 激发部下热情. 大多数人听到鞭声会奋力向前,
    自觉性高的‘不待扬鞭自奋蹄’, 也有少数人, 不重重抽几下就跑不起来.


    # 刀子


