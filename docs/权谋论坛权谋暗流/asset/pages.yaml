- pgno: 9
  md: '# 3.1 有效沟通，是化解相互猜忌的必要手段


    要进行有效沟通，必须善于创造一种让成员无话不谈的环境，必须知道说什么，即明确沟通目的；必须知道什么时候说，即掌握好沟通时间；必须知道对谁说，即明确沟通对象；必须知道怎么说，即掌握沟通方法。在这里以宋太祖赵匡胤“杯酒释兵权”来分析有效的沟通所发挥的积极意义。


    先创设无话不谈的环境（晚宴、酒到微醺处、仅剩铁杆几人）建隆二年七月初九晚朝时，宋太祖把石守信、王审琦、高怀德等高级将领（明确沟通对象）留下来晚宴，当酒喝到最高潮的时候（把握沟通时间），宋太祖突然让侍从全'
  merge: -1
  img_proc: true
- pgno: 10
  md: '部退下，很忧伤地对大臣们说：如果没有你们支持和帮助，我就做不了皇帝，心中很是感激。


    但是做皇帝也太难了，还没有以前做节度使时快乐，我整天都不敢无忧无虑睡觉呀！石等人惊慌失措，忙叩头问原因，宋太祖又说：谁不想当皇帝呀？你们纵然不想做，但你们部将想要富贵天下，如果把黄袍披到你身上，到时就由不得你做主了（明确沟通的目的）。这一番话，软中有硬，将领知道太祖已猜忌他们，便交出了兵权。


    正是宋太祖与诸位大臣的有效沟通，以高官厚禄为条件，解除将领们的兵权，保全了功臣，成就了名声，是明智之法、睿智之举，有效防'
  merge: -1
  img_proc: true
- pgno: 11
  md: '止分裂割据局面出现，加强中央集权统治，结果是富有成效的，为宋朝经济、文化的高度发展，创造了良好条件。


    # 3. 2 放低身段，是化解相互猜忌的有效策略


    放低身段做大是大智慧。低姿态往往可以保全自己不受伤害。森林里，大象们为了生存，不得不东躲西藏躲避猎杀，仍难逃厄运。但奇怪的是，有一头没有象牙的公象，却能从容而悠闲生活，其原因竟是因为没有象牙。收敛锋芒，掩饰自己，别人才会更愿意和善地与你相处，就像那头公象一样，没有长牙，反而能在猎人的枪口下平安地生活。


    汉三年，楚汉战争期间，刘项在荥阳相持。受'
  merge: -1
  img_proc: true
- pgno: 12
  md: '命管理关中的萧何干得风声水起。刘邦多次派使者慰问萧何，萧何门客鲍生提醒他大王对他起了疑心并让萧何把子孙、族人中能够打仗的全送前线去让汉王消除猜忌。萧何计诛韩信后，刘邦对他恩宠有加，封邑进爵。萧何门客召平却认为皇上是在怀疑他，劝他辞封邑，拿出家财，划拨进入国库。同年秋，英布谋反，刘邦亲自率兵征讨。刘邦身在前
    方，每次见后方使者都要问：“萧相国在做什么？”召平立即劝说萧何贱价强买民间田宅，故意制造出坏名声，让皇上放心。


    刘邦和萧何私交极深，为什么还猜忌萧何？萧何与张良、陈平不同，张良、陈平在刘邦身边'
  merge: -1
  img_proc: true
- pgno: 13
  md: '出谋划策，只是参谋，没有实权。萧何管理一个完整的王国，精明能干，为了能让刘邦彻底放心，萧何放低身段，有效的化解了猜忌。


    # 3.3 架构互信，是化解相互猜忌的不二法门


    互信意即两个人，两个独立体相互信任。信守诺言，互信不疑，被古人奉之为处世恒常不变的美德。孔子说：“与朋友交，言而有信”。信，是信用，说到做到，一诺千金；更是信任，以诚相待，赤诚相投。古人云：“君子之交淡如水，小人之交甘如醴”。现代开明的社会在形成社会秩序时，社会成员间的互信是必需品，人们无法期望人与人之间都是君子之交，但是因互信缺失而破裂的人际关系就会上升为社'
  merge: -1
  img_proc: true
- pgno: 14
  md: '会的信任危机，其诱因是“利益本位”的社会秩序。它动摇了许多社会成员的道德底线，扭曲了本应正常的价值体系，破坏了社会成员间信任的基础。因此必须架构社会成员互信以化解猜忌，实现社会的良性发展。


    官渡之战后，曹操在袁绍大本营内清点文件档案时，发现其私人信件中有许多中央政府官员向袁绍表态站队的信件，甚至还有自己统率军队中的将军。而曹操烧掉了全部信件。其实，东汉光武帝刘秀也曾烧过。时任大司马的刘秀，攻陷假冒皇帝刘𬺎儿子王郎首都邯郸后，在清点王郎政府文件资料档案时，发现有几千封自己部下写给王郎的信件，他们在信中除了'
  merge: -1
  img_proc: true
- pgno: 15
  md: '表达效忠王郎外, 还对刘秀进行人身攻击。而刘秀集合所有将领, 当着大家的面, 一把火将信件全部烧毁。由此可知, 拥有智谋的大有人在; 拥有宽广胸襟的也大有人在;
    而同时拥有两者的就不多了, 这就是刘秀、曹操成为英雄人物的主要原因。烧信事件给我们启示是, 作为一个团体的领头雁, 仅有智慧是远远不够的, 需要有宽广的胸怀;
    要有带卓越的领导艺术, 烧掉所有信件, 可以消除猜忌, 可以使背叛之人安心, 死心塌地跟着干。


    任何社会组织系统, 都面临着如何处理好上下级关系问题, 这就需要组织成员去进行有效地沟通、放低身段, 增强互信, 化解猜忌, 构筑'
  merge: -1
  img_proc: true
- pgno: 16
  md: '团结合作、信任和和谐的良好工作环境，实现事业的发展，实现共同的理想。


