  md: '# 别让「思想毒药」害了自己！人生别往小概率钻


    人生不是电影，你通常不会在最危急的时刻获得雷神之锤击败大魔王，逆转局势。故事之所以精彩，令人印象深刻，是因为小概率事件产生极大的悬殊感，让人以为「以少胜多」是一种可以实现的「常态」。


    然而实际上，从来没有这回事。'
  merge: -1
