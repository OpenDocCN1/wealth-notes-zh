- pgno: 150
  md: '汉建武帝时期就曾因久旱而自省，下诏日“久旱伤麦，秋种未下，朕甚忧之。将残吏未胜，狱多冤结，元元愁恨，感动天地乎？其令中都官三辅郡国出系囚，罪非犯殊死，一切勿案，见徒免为庶人。”由此可见“天意”对于古代中国帝王施政的影响和意义。


    除了国家政策层面外，即便寻常的刑罚也得顺应天时，“刑的本身便是剥夺宇宙间生命的杀戮行为，与四时生杀的自然秩序的关系更为直接，更为密切，所以刑杀必于秋冬，断不能于万物育长的季节施行杀戮，而敢与自然秩序'
  merge: -1
