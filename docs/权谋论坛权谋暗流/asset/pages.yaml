- pgno: 455
  md: '老板在选人晋升，何尝不希望找到一个和自己一样的「全才」？但从现实的层面来看，鲜少有人既懂技术、又擅长业务、财务分析、也深入了解广告行销。而随着市场竞争愈来愈激烈，我建议工作者除了深耕自己的专业领域，务必要跨领域学习，使自己更具竞争力。


    职场发展是一场耐力赛，除了能力与经验的竞逐之外，很难完全避免掉运气成分。如何在最少的运气成分之外，运用方法让自己职业发展更顺利？我相信不断的学习成长，还是最可靠的！'
  merge: -1
  img_proc: true
- pgno: 456
  md: '另外，许多中小企业的 HR 考核系统并不完备，多数的老板或是主管都习惯透过自己的观察来作为升迁加薪的依据。当你身处其中，就必须学习如何让自己的优点被长官看见。


    +   1. **勇于表达意见，不要害怕出错**


