  md: '人情左右秩序，关系影响规则。


    现在的社会，是“被关系”的社会；现在的关系，是“被商品”的关系。没有关系，不是“没有关系”，而是绝对“大有关系”；没有关系，可以创造关系，反正必须“发生关系”。


    关系，可以从无到有；关系，由点到面；关系，由浅到深。相对而言，规则可以从有到无，规定可以由死变活，规矩可以由治到乱……


