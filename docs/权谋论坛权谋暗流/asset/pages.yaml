- pgno: 232
  md: '孙权拒绝庞统后，鲁肃为他写了封推荐信，庞统带着信投奔刘备。他见到刘备不仅未行大礼，在刘备问他为何投靠蜀汉时，庞统只说，「你在招揽贤士，我就是那样的人，」只字未提推荐信。**因为庞统相信，以自己的才华就可以获得赏识。**刘备虽然没有拒绝他，却只派给他一个偏远县令的职位。


