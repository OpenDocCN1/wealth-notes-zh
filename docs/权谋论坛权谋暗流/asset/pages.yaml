  md: '在一次商业谈判中，美国商人向日本商人展示一个产品。刚开始时，美国公司的谈判人员介绍自己公司的产品。他们利用了一切可能利用到的资源和形式，包括各种图表以及报表，并且用三个投影机将最主要的资讯打在萤幕上，图文并茂、言之凿凿。


    美国公司的介绍持续了将近三个小时。在此期间，日本公司的代表却一言不发，十分安静的看着美国公司进行展示。


    等全部介绍结束以后，美国公司的主管充满期待的问日本代表：「你们认为如何？」日本公'
