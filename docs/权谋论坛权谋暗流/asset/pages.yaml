  md: 除了在政治国家层面，行政权力与皇权、行政权力自身之间的博弈制衡之外，在作为封建社会构成的最小单位——家庭、宗族，其内部的权力行使也受到一定的制约。古代中国崇尚小农经济，人是依附于土地而存在的，故掌握整个家庭赖以生存基础的土地的男性尊长便成为皇权之下所存续的个体家庭甚至宗族的主宰者。“中国的家族是父权家长制的，父祖是统治的首脑，一切权力都集中在他的手中，家族中的所有人口——包括他的妻妾子孙和他们的妻妾、未婚的女儿孙女、同居的旁系亲属以及家族中的奴婢，都掌握在他的权力之下，经济权、法律权、宗教权都在他的手里。”
