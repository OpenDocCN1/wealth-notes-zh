- pgno: 251
  md: '# 职场上能留下来的，是深懂这 3 件事的人


    公司的转变往往十分迅速，管理阶层不时更新公司的策略，以因应市场环境的波动、法规的演变、产品在生命周期中的变化，以及许多其他因素。短短十二个月内，一家公司可能从成长模式进入转型模式，又或者从致力开发尖端产品，转为致力成为低成本供应商。公司可以迅速调整流程和运作方式，以配合这些变化，但员工要以相同的速度改变自己的行为和能力，则是困难得多。


    人的转变比较缓慢，我们固定的 50% 因素不会显著改变，而弹性的 50% 因素也可能有一'
  merge: -1
  img_proc: true
- pgno: 252
  md: '部分会阻碍我们改变。如果你已经花了十年的 时间，努力适应公司力求稳定、压低成本 的策略，你很可能建立了配合相关要求的强大能 力，毕竟你已经花了十年的时间，调整自己的
    心态和行为模式以达成目标。现在，公司却要 求你创新，而且要快。这对所有员工都是个关 键时刻：


    及时适应的人将能保持高绩效，其他人的绩效 则会显著退步。


    尽可能提高契合程度的第一步，就是认清自 己和公司对双方契合程度有何影响。


    250'
  merge: -1
  img_proc: true
- pgno: 253
  md: '你对契合程度的影响： 你有自己喜欢的工作方式和公司类型，你可能喜欢高成长的小公司那种快节奏、激昂、勇于冒险的环境，又或者你喜欢成熟大公司的稳定性、专业精神和可预期的环境。你对工作环境很可能有所偏好，但必要时，你可以适应与自身偏好有所不同的环境。然而，因为你固定的
    50%因素，对你的基本偏好影响很大，如果工作环境与你天生偏好的环境显著不同，你将必须努力维持你与环境的契合程度在合理的水准。


    公司对契合程度的影响： 你们公司有自己的文化和策略，也有偏好的工作方式，这些因素构成你必须适应的工作环境。但是，这些因素'
  merge: -1
  img_proc: true
- pgno: 254
  md: '可能迅速改变，竞争压力、创新，以至公司的自然演变，意味着你数年前才加入的公司，如今的人才需求已变得截然不同。


    由于转变的速度相当快，一旦公司认定的发展策略需要新的行为和能力，你就必须及时调整。应该怎么做？


    如果你能够定期评估公司不时改变的需求，就可以设法改变自己的能力和行为，更妥善地配合公司的需求。这种评估要求你：


    +   - 了解公司不时改变的需求；

    - 了解自己天生适合什么环境；'
  merge: -1
  img_proc: true
- pgno: 255
  md: '管理自己的契合程度，以求尽可能提升绩效。


    # 1. 了解公司不时改变的需求


    你们公司的策略和变革需求在显著改变之后，成就高绩效的能力将会随之改变。你对这些变化的认识愈准确，就能够愈快调整行为，以配合高绩效的新定义。


    你们公司奉行什么策略？一个组织的策略，**往往偏向追求达成下列两项目标的其中一个：尽可能提高创新能力，借此打败对手；尽可能提高运作效率，借此打败对手**。这两种策略要成功，需要不同的能力或心态配合。靠创新致胜，'
  merge: -1
  img_proc: true
- pgno: 256
  md: '往往需要承受较大风险的意愿、较强的创造力，以及较能忍受模糊不清的情况。靠效率致胜，通常需要较为冷静的思考、重视流程，以及六标准差能力。你可能认为，一家公司必须兼顾创新和效率才能成功。虽然创新和效率都很重要，科学研究显示，奉行纯粹的策略（致力成为效率最高或创新能力最强的公司），效果总是好过奉行混合型策略（追求兼顾创新和效率）。


    你们公司的变革需求为何？一个组织可能正经历合并、经济冲击、快速成长、转型之类的事件，要求领导人能够驾驭重大变化。它也可'
  merge: -1
  img_proc: true
- pgno: 257
  md: '能只是经历多数组织在日常运作中出现的典型起伏。这两种环境要求的能力截然不同。


    你可能认识一些往往能在乱局中大展身手的领袖，他们具有独特的能力，能够明智地冒险、拟定简明的愿景，并且孜孜矻矻地促进工作——他们具有较强的转型领导力。有些领导人则是特别擅长驾驭日常业务挑战，能够有效执行核心流程，管理好自己的团队，在一般情况下，是优秀的企业公民。但是，这种领导人若必须领导重大变革，必将力有不逮；而如果将转型领导人放在平静的环境下，他们会觉得工作无聊到无法忍受。'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# 2. 了解自己天生适合什么环境


    因为契合很重要，你应该往正确的方向发展，尽可能提高自己的契合程度和绩效。第一步就是了解自己天生适合什么环境。你适合什么环境，取决于你的性格（属于固定的 50%
    因素）、你在职业生涯中锻炼出来的能力，以及你偏好的工作环境。这些因素结合起来，使你偏好特定的工作方式，使你在某些情况下比较能干。就此而言，你就像一块拼图，具有独特的形状，这本身可能很有意思，但你必须与其他拼图契合，才有价值。


    # 3. 管理自己与公司的契合程度'
  merge: -1
  img_proc: true
