  img_proc: true
- pgno: 462
  md: '司的主管礼貌的笑了笑，微笑着回答道：「我们不明白。」当时美国公司的主管就接近崩溃了：「不明白是什么意思？为什么不明白？」日本公司的主管继续淡定的说：「这一切我们都不明白。能麻烦你们重新展示一遍，好吗？」


