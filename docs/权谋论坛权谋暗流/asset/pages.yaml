- pgno: 264
  md: '# 有实力但资历浅的你，如何出头天？


    一般多认为，年资和功绩是决定升迁的最主要因素。不过，这并不代表如果你资历浅，就只能慢慢熬出头。


    想被老板看见，我们可从东吴名将吕蒙的传奇仕途中学习，如何抛掉资历的局限，积极进取，展现自己的能力。


    吕蒙自16岁起便跟着姐夫邓当生活，当时，邓当是孙策的部将，因此吕蒙也生活在战场上，经常趁姐夫不注意就跟着上阵打仗。不管别人怎么劝阻，一心只想争取杀敌机会的他依


    ![](img/e2c24fb65807a5da452c6b8c39c0ef3b_264_0.png)'
  merge: -1
  img_proc: true
- pgno: 265
  md: '然坚持参战。束手无策之下，邓当决定请吕母出面帮忙。


    得知自己年纪尚幼的儿子竟然上战场，吕母又气又担心，把吕蒙骂得狗血淋头。但吕蒙只回答：「娘，当前贫贱生活实在无以为继，不如让我及早从军，还有机会取得富贵。更何況不入虎穴，焉得虎子？」


    听完这番话，吕母对儿子的志气和坚定大为震惊，也就决定放手让他去了。


    别因为「菜」而畏缩，敢上阵才有机会表现'
