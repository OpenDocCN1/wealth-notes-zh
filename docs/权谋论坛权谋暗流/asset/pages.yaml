- pgno: 372
  md: '# **工作愈换愈好，或愈换愈差？取决4个关键思考**


    你的工作内容中，或多或少都有些讨厌的环节吧？有的人觉得处理行政庶务太琐碎，有些人想到与客户打交道就头痛，对工作的热情，仿佛被这些烦心事日渐冷却，最后萌生离职的念头。


    当然，很少人能找到 100% 喜欢的工作内容，究竟要怎么跟讨厌的任务相处？如何判断该不该为此离职？透过以下问题，整理出对工作的想法，避免工作愈换愈差，更后悔：'
  merge: -1
  img_proc: true
- pgno: 373
  md: '+   1. 你不喜欢的是核心任务还是外围工作？


    统计一下分内的任务有哪些，并区分出核心和外围的工作。例如，财会类的核心是以数字工作，较外围的是研究报表、整理年度预算。


    假设你讨厌的是核心工作，问题就比较严重，无法克服的话建议考虑转行。但要是有一部分的外围任务，那就学习与它共处，像是找其他工具、方法缩短处理它的时间。


    +   2. 喜欢的任务 vs. 讨厌的任务，各花多少时间处理？'
  merge: -1
  img_proc: true
- pgno: 374
  md: '有个简单的 50% 法则，如果你花超过五成的时间在喜欢的事情，恭喜你，这是一个好现象；倘若不喜欢的任务占用超过五成的上班时间，又无法调整到低过此门槛，不妨想想是否选择别的工作比较适合你。


    # ## 3. 这份工作会带你去哪里？


    天将降大任于斯人也，必先苦其心智、劳其筋骨。现在厌倦的工作内容，若能带领你到达大好前程，那现下的苦值得忍受；反之，烦人的工作既无法让你升官晋职发大财，也达不到梦想，就别再忍下去了，最终只是损了健康又'
  merge: -1
  img_proc: true
- pgno: 375
  md: '得心病。因此，重要的是了解这份职业，能不能给你一个美好的未来。


    # 4. 能如何调整不喜欢的任务分配？


    首先要再次强调，势必没有完全符合我们喜好的工作任务，因此，你需要在不喜欢的项目中，挑出影响你最大的几项，再与上司商量怎么处理。


    所谓的影响大，是该项目、客户的价值观，违背你的信念或个人原则。'
  merge: -1
  img_proc: true
- pgno: 376
  md: '# 最有影响力的人， 2个技巧，让部属打心底认同


    有一次和几位 HR 伙伴与企管顾问聊到如何在组织内推动企业文化，大家的做法五花八门，有的从提升工作环境着手，有的从公司培训做起，也有的从福委会活动进行宣导。从实务上来说，这些方式的确都有助于执行与缔造企业文化。


    而负责推动组织文化多年，我也常在想，要如何才能有效地将组织的核心文化与价值观传达给同仁？仅靠传统宣导式的愿景与声明并不容易让人记住，时间久了，人们的注意力'
  merge: -1
  img_proc: true
- pgno: 377
  md: '也会对教条式的观念、道理感到疲乏，不容易让人记得住、做得到。


    那么，管理者还有什么方式可以让同仁对组织文化更容易听得懂，也产生认同感呢？


    # 好故事比硬道理更能激励人心


    或许「说故事」是一个可靠的行销策略，能更有技巧地帮助人们理解组织创办人的信念，也更有机会说服同仁实践组织文化与价值观。因为人们从几万年前就靠彼此围绕火圈，靠著述说与聆听故事延续生命，可以说，我们的基因里天生就喜欢听故事。而且好故事往往比道'
  merge: -1
  img_proc: true
- pgno: 378
  md: '理更能激励人心，也容易塑造人们对某项事物的认知价值，产生难忘的启发与体验。


    那么，如何才能述说好一个故事？虽然这方面已有许多书籍论述相关原则，但我想聊聊两个组织案例，说明运用故事行销企业文化，也是有一些公式可以参考的。


    # 1. 坚持行动+迈向巅峰，皇天不负苦心人的故事


    这类故事的公式通常是：愿景与目标-- >困难限制-- >坚持行动-- >迈向巅峰。


    376'
  merge: -1
  img_proc: true
- pgno: 379
  md: '某一年我与集团事业处的一位主管合作，协助当地厂区的人力资源事务。这位主管以工厂管理见长，在他与全厂伙伴积极地改善制造流程与营运效率下，我们终于突破了出货量限制，产能屡创新高。主管那时想给全厂发个小红包，并且送给每个人一块蛋糕，一同分享这个喜悦。


    这真是个宣扬企业文化、激励人心的好时机，同时也是个好故事的素材。那一年我们不仅给予同仁上述的物质奖励，也在内部宣传了这次的重要事件，内容大致如下：'
  merge: -1
  img_proc: true
- pgno: 380
  md: '我们一直在 XX 产品上想取得客户信赖（愿景与目标），但是我们在研发与制造上的瓶颈一直无法突破（困难限制）。然而，我们从不放弃，在过去的三个月，由于同仁的共同努力与坚持，我们终于找到了方法（坚持行动）。如今，我们总算能让客户相信公司是有实力达标的，而且在这领域上取得了领先地位，这个荣耀同属大家，很高兴我们一起走过，这也是我们不轻言放弃的企业文化！（迈向巅峰）


    我们把这样的宣传文字，透过包装与行销，在各种内部沟通场合不断放送，即使文字精简，却是能让同仁更加了解组织文化，也是可以琅琅上口的好故事！'
  merge: -1
  img_proc: true
- pgno: 381
  md: '# 2. 历经低谷＋重返荣耀，遇意外后逆转胜的故事


    相较于皇天不负苦心人的故事，更能让大家不断传颂、津津乐道的故事，可能就属这类遇到逆风也能再起的故事，比如说葛斯纳让 IBM 浴火重生、贾伯斯让苹果起死回生
    …… ，这类故事的公式则像是这样：


    愿景与目标-- > 意外转折 -- > 转场变革 -- > 重返荣耀！


    产业趋势都有历经高峰与低谷的时候，许多企业可能在变动的环境中，因为没有做好自我调整的准备，在面临低潮时从此一蹶不振，最终'
