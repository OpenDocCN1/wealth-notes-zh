  md: '# 2 利用道德和“天”来制约权力


    从道德方面来讲,对于统治者权力的制约主要

    依靠社会所普遍认可并由历代统治阶级承认

    的某种共同信念和价值以及习惯性规则,诸如

    纲常伦理,人文风俗习惯。道德的制约一方面

    是从外界向掌权者施压,另外一方面更加依靠

    的是权力行使者的自我修养,从自身的人生抱

    负和品德出发的进行的内心约束。但究其本

    质还是当权者对于整个社会整体道德或信念

    的认同,从而根据社会整体道德和信念对权力

    进行限制,在社会上则表现为合力对于个人的

    束缚。在古代中国,儒家所提倡的“德治”思'
  merge: -1
  img_proc: true
- pgno: 145
  md: 想就是此类控权思想的理论体系化表现。如孔子倡导的“为政以德”“修己以安百姓”；孟子主张的“以不忍人之心，行不忍人之政”，都是力求为政者即权力的行使者能培养优秀的道德品质，借助高尚的道德品质来约束权力行使中的任性和恣意。由此来引导掌权者形成积极正确的权力观，激励掌权者在权力的行驶过程中能兼顾各方利益。如历代所追求的清明政治中所提倡的泽批天下、勤政爱民，从内自外让统治者能够自觉地端正言行从而抵制与其在社会中所处地位及扮演角色不相称的各种人性欲望，借此来维护、行使好所掌握的权力。
