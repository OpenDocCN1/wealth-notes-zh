- pgno: 243
  md: '# 界线一：避免越权干政


    以华人文化立嫡立长的传统，曹操应立嫡长子曹丕为接班人，然他真正属意的是四子曹植，因而陷入两难；杨修理解曹操心臆，决定在背后扶植曹植。


    遴选接班人的过程中，曹操多次出题测试曹丕和曹植，每一次曹植都对答从容，让曹操起了疑心，暗中观察才发现，原来都是杨修给的建议。曹操认为接班人之争乃私事，杨修的做法，难保日后不会把持朝政。'
  merge: -1
