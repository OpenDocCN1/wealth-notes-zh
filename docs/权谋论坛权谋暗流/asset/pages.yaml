  md: '张仪回到秦国境内，故意在将军面前，假装下车时不慎失足跌伤，对外称病养伤三个月，足不出户，也不见任何宾客，用意就是要让将军痴痴等待。将军等得不耐烦，于是上书秦王，秦王直推给张仪，要等他病养好了再说。楚王一时得不到秦地六百里，以为与齐国绝交得还不够彻底，竟派一名勇士北上去辱骂齐王。


