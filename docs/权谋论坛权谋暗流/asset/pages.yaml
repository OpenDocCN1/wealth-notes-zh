- pgno: 349
  md: '# 「贫穷金钱观 vs 富裕金钱观」


    「一无所有」和「贫穷」是有差别的。许多人都曾经体验「一无所有」，但短暂的缺钱不会让你变「贫穷」、一文不值或毫无用处。如果你采纳「贫穷心智」，很有可能永远贫困；倘若你只是暂时一无所有，那么你还是能够翻转金钱逆势。许多百万富翁都曾一无所有，最后依然重建巨大的财富。你可以取得他们的金钱，但永远无法夺走他们的知识和人格特质。


    以下是来自十余年的研究和面对面的讨论，足以代表数十万人的两极价值观。你甘愿将就'
  merge: -1
  img_proc: true
- pgno: 350
  md: '「不贫困」的状态，还是渴望「变有钱」？请睿智地选择。


    # 贫穷的观念：金钱是万恶渊薮


    # 富裕的观念：金钱是万善起源


    「金钱是万恶渊薮」是最常见的错误观念。

    金钱不是万恶渊薮，邪恶才是万恶渊薮。


    金钱只是服务人性的单纯载体。你决定选择何种金钱观，金钱就会发挥相对应的作用，无论是善是恶，并且影响金钱的使用方法，以及金钱吸引或驱散的其他元素。'
  merge: -1
  img_proc: true
- pgno: 351
  md: '# 贫穷的观念：必须用钱创造更多金钱


    # 富裕的观念：只需要观念、能量及提供服务，就能创造更多金钱


    虽然我们可以用利息、复利和杠杆效果，让金钱发挥吸引力，创造更多金钱，但倘若观念不对，钱就会迅速蒸发，变成消费产品和负债。因此，「你必须用钱创造更多金钱」不是准确的说法，正确的观念应该是「如果管理妥当，金钱可以让你赚到更多金钱」。


    62% 的亿万富翁都是「白手起家」。这代表第一代的亿万富翁并没有得到价值上亿的遗产或馈赠。'
  merge: -1
  img_proc: true
- pgno: 352
  md: '如果这些说法为真，创造金钱的基础并不是金钱和巨额遗产。我个人相信，所有的金钱来自一个想法，想法转为观念，观念形成决策，决策造就行动，行动孕育成果，经过反覆测试、修正、改善，最后提升规模。


    **贫穷的观念：金钱系统非常邪恶、不公且腐败**


    **富裕的观念：金钱系统很棒，能有效地量化评估价值并加速金钱流动**


    资本主义是一种系统，让每个人都可以创造公平的生活，用完美的平衡，结合自利和服务。'
  merge: -1
  img_proc: true
- pgno: 353
  md: 赚钱创造了经济市场、服务、就业、税赋，以及对他人的益处。公平和完美的竞争变得繁荣兴盛，价值也可以在全世界顺畅流动。管制法案和反垄断法案让人类的贪婪与给予达成平衡。企业的「有限负债」约束了公司行号的负债额度，但不会限制企业家本人的理念，如果你愿意承担额外的风险，大胆投资，也不会因此受到惩罚。除了自我设限，资本主义社会几乎没有任何事物会妨碍你发挥理念，创造服务和金钱！
  merge: -1
  img_proc: true
- pgno: 354
  md: '**贫穷的观念：**负债很不好


    **富裕的观念：**对人生有帮助的负债很好


    从我个人的经验而言，一般人对负债的观念如下：


    +   1. 第 1 种：举债购买负资产，且花费他们并未拥有的金钱。


    +   2. 第 2 种：完全不愿负债，只购买或投资可负担的物品。


    +   3. 第 3 种：发挥良好负债的杠杆效果，购买创造收入的资产。'
  merge: -1
  img_proc: true
- pgno: 355
  md: '按照睿智的程度依序评论上述观念，1. 代表「愚笨」，2. 是「安全和保险」，3. 则是「聪明且发挥杠杆效果」。举债购买消费产品、消耗品和负资产，会先让你变得一无所有，最后沦为贫困。


    贫穷的观念：必须努力工作才能赚钱


    富裕的观念：必须让金钱替你工作


    没错，必须先努力，才能享受成果。然而，努力工作的成果也会有上限。此时，你愈是努力，收获反而变得愈少，因为你每小时的产量已经到了极限。'
  merge: -1
  img_proc: true
- pgno: 356
  md: '许多支领高薪的人，他们的工作时数少，每小时的报酬很高。企业家情况更是如此。用正确的方式打造事业和营利能力之后，我们投入的时间，就会以等比级数的方式创造价值。


    努力且聪明的工作才是正确的说法。善用愿景和知识，不必辛苦舞动双手，挥洒汗水。投资能够让你节省时间的资产，而不是浪费时间交换金钱。用别人的时间发挥杠杆效果，不要付出自己全部的人生。'
  merge: -1
  img_proc: true
- pgno: 357
  md: '# 贫穷的观念：如果我赚钱，代表别人损失金钱」


    # 富裕的观念：如果我赚钱，就能服务别人


    只有经由偷窃和欺骗行为赚到的金钱，才代表你害别人损失金钱。如果你赚钱的方式并非上述那些偏门，其他人是因为接受你提供的价值，选择将金钱交给你。他们希望得到你提供的事物，认为这些事物的价值高过他们交出的金钱。这样的话，你是在服务他们，而不是欺骗他们。


    如果你希望增加金钱收入，就应该改善服务，提升价值，就会有更多人心存感激，心甘情愿地掏钱给你。'
  merge: -1
  img_proc: true
- pgno: 358
  md: '贫穷的观念：我没有时间赚钱


    富裕的观念：我没时间处理低价值工作


    比尔. 盖兹和任何一位无名小卒一样，一天只 有二十四小时。所谓「我没有时间」其实是一 种幻觉，因为每个人一天都有二十四小时。


    你必须把时间用于高价值工作，否则别人就会 让你进行他们的高价值工作。


    你必须自己制订计画，否则就会成为其他人计 画的一环。


    富裕人士非常严谨且充满战略地运用时间。他'
  merge: -1
