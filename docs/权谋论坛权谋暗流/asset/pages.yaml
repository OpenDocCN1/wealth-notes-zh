- pgno: 154
  md: '很多因素都会影响一个人是否会用权力为自己谋福利，如人格和性别等。


    +   1. 权力感削弱了规范对个体行为的约束


    高权力能影响个体对世界的知觉和对世界的建构。当权力感较低时，个体的行为倾向于关注他人的需要，并且对惩罚更加敏感。当权力感较高时，个体对奖赏更容易接受，也更不容易约束自己的行为。文章列举了两个实验室研究，说明权力对人行为的影响。


