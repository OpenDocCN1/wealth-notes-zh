- pgno: 383
  md: '后来，我们将组织这样同甘共苦并再获市场佳绩的经历写成了故事，并搭配重新形塑的企业文化与价值观进行宣传，不仅成功提升内部同仁的向心力。多年以后，即使我已不在这组织服务，但有机会参加讨论企业文化的研讨会时，这间组织重返荣耀的故事仍常被行业顾问所提起，尤此可见故事传播的深刻影响力。


    # 唤情感共鸣，多说「我们」拉近距离


    值得注意的是，故事的内容应该让读者有情感上的共鸣，也就是能从故事中看到自己，最好说说大家共同经历的事情、体验，多说「我们」，才能拉近距离，打动他人。换句话说，如果你'
  merge: -1
  img_proc: true
- pgno: 384
  md: '的故事内容只是在说个人的丰功伟业，只说「自己」，没有将经验投射到大家心中，就不容易说服他人，共同实践价值观。


    一个好故事不会谈生硬的道理或呆板的数字，而是谈论给人们的感受、影响与启发。如果你是一个领导者，希望透过说故事的方式来传达某些概念，或许以上两个故事公式，可以帮助你更有效地思考，如何组织案例来形塑团队的价值观与文化。


