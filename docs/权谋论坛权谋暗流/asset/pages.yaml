- pgno: 365
  md: '# 主管什么事都告诉我，为何升迁却没我的份？


    当你受到主管信任，他也愿意把事情都跟你说，甚至跟你私交不错，应该是一件事。与上级有正向关系，能提升彼此的生产力，甚至有利升迁。但在工作场合，主管毕竟是主管，如果你没有拿捏好说话尺度，反而容易让自己变成老板心中的黑名单。


    资深人资主管老张，和老板相识10多年，几乎每件事都会互相分享，小从日常嗜好，大到企业最新决策，无话不谈。没想到，有次老板没有先告知老张就宣布人事异动，增设营运长一职，令他的职位形同虚设。私下向同事打听，'
  merge: -1
  img_proc: true
- pgno: 366
  md: '老张才发现，原来他上次不经意向同事暴露老板私事，踩到对方底线，因而在工作上被冷落。


