    # 当救火队其实是一个过程


    站在老板的角度，如果你是可以长期培养的人才，给予各种不同的职务历练是必要的过程，借此反覆验证、避免出错。'
  merge: -1
  img_proc: true
- pgno: 454
  md: '毕竟每个老板都要为自己的生意负全责，没有哪项困难的任务他可以置身事外，也因此，他的一身好功夫，就是透过不断地「救火」而练就出来的！我们如果有幸被当成救火队，不断被指派去参与不同的专案，带领不同团队解决不同的组织困难，就是强化自己最好的机会。你未必会在当完救火队之后，直接就被晋升，但不必怀疑的是：如果能正面看待，必然有所收获。


    # 多元学习、积极争取，让自己的优点被看见'
  merge: -1
