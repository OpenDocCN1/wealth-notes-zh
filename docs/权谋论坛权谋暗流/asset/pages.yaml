  md: '# 职场上 3 种提携你的老鸟，别有居心


    初入职场时，最仰仗的肯定是带你进入状况的人。这个人，有可能是你的直属主管，也有可能是主管指派的资深同仁。透过这些老鸟的指点，你可以摆脱生涩，快速上手；而这些老鸟们看你可堪造就，也会觉得自己教导有方、与有荣焉。


    然而，这种单纯的提携指点一旦牵涉到利益关系，很可能成为前辈反击、牵制的利器，甚至是让他自己飞黄腾达的工具。如何解析前辈的提携之恩，就成为职场上的重要课题，本文解'
