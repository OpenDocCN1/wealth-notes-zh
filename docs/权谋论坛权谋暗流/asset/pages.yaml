- pgno: 151
  md: '相悖。”因此，“天意”对古代中国的约束是全覆盖的，不仅皇帝、政府为了统治的需要必须听命于天，老百姓为了家族の兴昌也得顺应天时。即便现代，在人危难无助之时，也有“问天”的习惯，将自己的不幸诉诸天，希望借助老天爷的力量渡过难关。这都是印刻在中国人骨子里对天的崇拜。


    总的来说，中国古代的权力制衡机制虽未发展成为西方三权分立式的政治体制机制，但其对以家天下、义务本位为特征的中国古代社会一直起着秩序稳定器的作用。权力的制衡反映着社会中不同利益集团在政治关系中的博弈,是'
  merge: -1
  img_proc: true
- pgno: 152
  md: 其各自主张和具体利益的集中体现。相权制约皇权的绝对行使、皇权克制相权，监察权又制衡着政府内部的权力。在古代政治权力的博弈当中虽不乏为谋求个人利益而进行的权力斗争，但不管其目的、实质如何，权力斗争的最终指向都得依靠手中权力的存续即政权的稳固，为了不丢失权力，则必须相对地考虑到社会公众的利益，因此即便在权力斗争中相互权力此消彼长，但社会大众的利益一直是各方所必须考虑到的，不管是在形式上还是实质上。另一方面权力的相互制衡刚好可以牵制相互间的欲望追求，在牵制的中间地带社会权利得以增长，以此达到社会公共利益的保护。
  merge: -1
  img_proc: true
