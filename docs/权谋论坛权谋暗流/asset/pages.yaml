- pgno: 484
  md: '饮食，搭配做运动。但就算你充分了解「怎么做」，也未必能持续下去。


    这时，或许你会责备自己：「为何我意志力这么薄弱！」但这种想法是错误的，它不是意志力的问题，你只是不知道该如何持续下去而已。同样的，这种现象也会出现在部下的工作中。假如主管再怎么教，都无法让部属学会做事方法，那就是教法有问题，不是他们的态度有问题。


    下次，先厘清部属到底懂不懂「做事的具体方法」再进行教导，或许可以帮你省去不少培育部属的时间。'
  merge: -1
  img_proc: true
- pgno: 485
  md: '# 有了管理头衔，却带不动人？你的资历，不代表你的领导能力！


    某天的一场主管领导力工作坊结束之后，一位年轻主管向我提了一个好问题，让我深思许久。他的问题大概是这样的：「我知道培育组织人才对公司基业长青来说很重要，我也很珍惜这样的学习机会，但这都是以企业竞争力的角度来看领导力的必要性！」


    「但，领导力到底是什么？对我这样的年轻管理者来说，学习领导力跟『自己』有什么关系？又到底有什么好处？」'
  merge: -1
  img_proc: true
- pgno: 486
  md: '关于领导力是什么，一直以来都是管理的主流显学，成千上万的学术研究与书籍都不断定义、探讨这项主题。多年来，我负责组织内的领导力发展，看待领导力的观点是：


    「能影响他人，获得他人支持，让人们愿意追随你解决问题的能力。」


    而关于「学习领导力对个人有什么好处？」这个问题，我想与其探究好处是什么，倒不如与大家聊聊「为什么主管需要培养领导力？」若从个人学习发展的视角来看，以下是我的三点观察：'
  merge: -1
  img_proc: true
- pgno: 487
  md: '# 1. 专业能力让你晋升管理职，但不代表你具备领导力


    65% 的离职员工其实是想离开的不是公司，而是自己的直属主管。因此，当员工在离职申请书上写着各式各样的理由，但没有说出口的是，上司才是真正促使他们离开的人。部属跟随一个缺乏领导力的上司，在工作中得不到认可与尊重，最终只能选择离去。做为一个没有领导力的管理者，将不定期地面流失优秀人才的险，即便是面对留下来的人，也很可能得不到他们发自内心的认同与信任。'
  merge: -1
  img_proc: true
- pgno: 488
  md: '# 2. 领导力就是与人相处的能力，到哪都适用


    发展一个人的领导才能，通常磨炼的是倾听沟通、同理他人、提问回馈、觉察专注等软性技能，以得到人们的尊重和信任。这是到哪都用得到的能力，并不局限于企业管理，在生活中的各种场景，比如说家庭教养、人际互动、沟通说服等情境都适用。


    传授领导技巧，永远不嫌早，也就是说，学习领导力其实跟你是不是管理者没有关系，甚至愈早开始愈好。'
  merge: -1
  img_proc: true
- pgno: 489
  md: '# 3. 权力不足以带动人！想让员工自动自发完成绩效，领导力是关键


    许多人常以为只要主管做久了，领导力也会随之提升，因而误解只要累积头衔和地位，伴随而来的权威就足以有效地进行管理工作，驱使团队伙伴愿意为了同一个目标奋斗。


    不过，这可能是一个严重的迷思。因为连最重视命令与服从的军队，都认为权力不足以带领他人顺利完成任务，总是再三强调领导力的重要性。'
  merge: -1
  img_proc: true
- pgno: 490
  md: '领导力其实跟位阶权力无关，不管你在哪一个位置，都可以把握机会发展自已的领导才能。无论是公司或军队、学校或家庭、主管或部属、年轻或年长、内向或外向。只要有合作的地方，就需要领导力，你都可以在各个领域与层次发挥领导力，影响他人，共同解决问题、完成目标，让人人都觉得有所贡献，并充分发挥潜能。


    「如果你想要打造一艘船，不是先请大家去收集木材，或是分配工作与发号施令。相反的，你应该先激起所有人对浩瀚海洋的一片渴望。」'
  merge: -1
  img_proc: true
- pgno: 491
  md: '# 不比人家笨，为何不受重用？职场上的「聪明人」，反而要小心 的事


    聪明人拥有很多优势。首先，聪明人的逻辑强、思路灵活，理解事物很快，因而经常很有创意。聪明人本身，也因为经常感觉到自己「快速理解、时有创意」的特质，认为没有什么事情难得到他。渐渐的，在看待任何事物时，「容易的认知」即油然而生。


    聪明人因为觉得事情很容易，觉得自己学得很「快」，因而跟同僚、部属合作、共事时，无形中就会显得别人学得很慢，感觉别人「很笨」。甚至在跟上司、外界互动时，有时也会'
  merge: -1
  img_proc: true
- pgno: 492
  md: '流露出轻蔑、不耐烦的态度。久而久之，甚至会「打从心里瞧不起别人」，显得「趾高气昂，不可一世」。


    聪明人的优势，主要来自于逻辑推理能力高人一等；然而，逻辑推理与实务运作间，却有很大的鸿沟。


    首先，逻辑推理是「静态的」，是假设外在环境不变；但真正的实务会牵涉到「环境」与「人」的因素，两者皆不可捉摸，因而是「动态的」。而且，人性的因素又远较环境复杂。因为，不同背景的人，其心理、情绪、行为都千差百远；而同一个人在不同时间点对同一事物的反应，也'
  merge: -1
  img_proc: true
- pgno: 493
  md: '经常前后有别；更何况，人还会有非理性的时候，这就更难预测、掌握了。因而，逻辑上可行的事物，若再加上「人」与「环境」的变动因素，就会变成非常复杂，难度大为增加。


    然而，动态的实务，究竟要如何掌握呢？事实上，它是透过点点滴滴的观察与经验，所累积而成；体验的时间不够久、经历的案例不够多，深度与火候就不够。也就是说，实务必须要靠「务实的」去「亲身」体验、观察，而这些都需要时间，无法速成。


    有些聪明人，确实认知到自己存有「容易的习'
  merge: -1
  img_proc: true
- pgno: 494
  md: '性」，也亟欲加强实务世界的磨练。然而，却因为「容易的习性」根深蒂固，加上凡事求「快」的习惯，以至于「实务世界」的累积还不足，一旦觉得学会了，不自觉又缩回擅长、习惯的「逻辑推理的世界」，以至于能力的火候总是难以坚实。


    要避免上述状况，想要务实的聪明人，不妨尝试建立一个提醒机制。学习事物时，一旦出现：「我懂了」的念头，就将其视为一个警讯，提醒自己，「应该没有那么容易」、实际上可能还不够。进而，刻意延长实务历练时间两、三倍，去体会真正长期涉猎实务后的扎实感，改'
  merge: -1
  img_proc: true
- pgno: 495
  md: '善不自觉偏重逻辑推理的习惯。


    不务实的聪明人，顶多只有中等成就，甚而有非常落魄的；若能既聪明又务实，则肯定为人上人。个人不妨留意自己学习时，是否经常停留在纯粹的逻辑层次？并刻意要求自己投注更多的心力于「人」与「环境」。如此一来，逻辑推理与实务历练可逐步趋于平衡，这也将是聪明人不断推升能力高度的凭借。'
  merge: -1
  img_proc: true
- pgno: 496
  md: '# 管理在管什么？


    管理是企业界人人朗朗上口的名词，但是每个人都知道管理在管什么吗？


    管理简单来说，就是在管企业内部的事，目的是要得到企业运作的最高效率—— 赚到最多的钱，用最低的成本支出。换句话说，


    管理就是从企业内部的运作中，做到获利极大化！'
  merge: -1
  img_proc: true
- pgno: 497
  md: '而管理要怎么做呢？说穿了**管理只在管 3 件事：管人、管物、管事**，透过这 3 件事的最佳化，得到最高的效率，赚到最多的钱！


    # 一、「管人」是管理的首要课题


    所有的组织都是由人组成，把人管好，让人能把事情做好，就是管人的真谛。


    管人又可分为 3 个层面：选对人、用对人与管对人。'
  merge: -1
  img_proc: true
- pgno: 498
  md: '组织中的人一定要是对的人与好的人, 对的人才能做好事。如果组织中有不对的人, 工作效率一定会大打折扣, 所以**管理一定要「先选人」**，检查组织中是否有不称职的人，换掉这些人，再选择对的人替补，一定要让组织中都是好的人，能做事的人，管理才会发生效益。


    管人的第二步是「**用对人**」，**把对的人放在对的位置上**。 细心的人，做耐烦的事；积极进取的人，做开创的事；保守的人，做守成的事；有创意的人，做创新的事；可以带人的人，要做小主管，赋予带团队之责。把每一个人都放在对的位置上，给对的工作。'
  merge: -1
  img_proc: true
- pgno: 499
  md: '管人的第三步是「管对人」，用正确的方法管理人。管人的方法有千百种：单纯听话的人，要直接下命令，指挥做事；爱面子的人，要委婉沟通，循循善诱；能力弱的人，要训练补强，用心培养；能力强的人，要给予空间，让他放手发挥；能独当一面的人，要充分授权，让他带领团队；注重物质的人，要以金钱诱导；喜欢自我实现的人，要强调理想愿景……。管人的方法要因人而异，适用其人。


    # 二、管理的第二件事是「管物」'
  merge: -1
  img_proc: true
- pgno: 500
  md: '物指的是资源、企业经营，组织运作一定要动用到资源。


    管理的真谛就是善用「人」及「物」的搭配、运作去完成某一件事，而管理的目的，就是要用最少的资源投入，这就代表最高的效率。


    # 三、管理的第三件事就是「做对事」，也就是执行


    执行要讲究流程与方法，要怎么做事，用什么方法？要经过什么流程，才能达到最高的效率？'
  merge: -1
  img_proc: true
- pgno: 501
  md: 每一个人做事的方法都不一样，在不一样的方法中，总会有一种最高效率的方法，这种方法在管理学中称为最佳实务，而透过最佳实务，结合完成的工作流程就是所谓的（标准作业流程）。在管理事的过程中，就是要找到最有效率的标准作业流程，把工作做到极致，做到投入最少，产出的效率极大化。
  merge: -1
  img_proc: true
- pgno: 502
  md: '# 哪种人最容易升迁？老板眼中的人才，都有4种工作习惯


    许多职场生存学都提到，想在短时间内迅速晋升，最好的办法之一是被主管看见你的价值。说来抽象，实际上到底该怎么做？


    当其他同事还只埋头于完成眼前事务时，建议你抬起头观察上司和团队的需求，执行以下4个面向，让公司不能没有你。


    +   1. 确实执行任务，并增加价值'
  merge: -1
  img_proc: true
- pgno: 503
  md: '接到主管给的工作指示，合格的员工是透彻了解方向和内容，并如实执行。而优秀的员工不仅完成任务，还会协助上司将计画往下一步推动。


    通常主管忙于管理计画的方方面而，很难抽出时间详细说明每一个执行的细节，工作者应具备独立思考的能力，自己先计画如何执行，还要尽量思索被交代的任务之外，有哪些环节可以更加完善。例如，若是活动场地发生意外该怎么处理、你研究
    VIP 资料发现他有特殊需求，如何贴心准备等等。向管理者展示额外的努力，他更可能交付其他的项目让你独立运作，使你更加不可或缺。'
  merge: -1
  img_proc: true
- pgno: 504
  md: '# 2. 向上司持续更新你的工作进度


    无论主管有没有要求，你都应该主动让他掌握你的工作状况。


    听来很平常，不过大多数的工作者都是等到老板问了，才交代进度。对于繁忙的管理者，若你能在他开口之前就积极报告，让他省心又省力，必定对你更放心。你能在任务有小进展时写
    email 知会，甚至在公司碰到时抓住机会报告。倘若遇到问题，务必早期提出以便在早期解决。'
  merge: -1
  img_proc: true
- pgno: 505
  md: '# 3. 补足主管的不足之处


    上司遇到困难，你会伸出援手吗？大部分的员工都不会，而且通常主管不会主动说自己哪里较弱来灭威风。但要是有人能负责自身不拿手或不想做的事，你一定会感谢他。


    因此，仔细观察上司的弱项，像是他总有天马行空的好点子，完成度却不高？或者脾气比较冲，人际沟通总不太顺利？无论是什么，当你发现有**你擅长**的**项目需求**，就**主动担下工作**，对方绝对会希望你能长期与他一起工作。重点'
  merge: -1
  img_proc: true
- pgno: 506
  md: '在于，不是他不想做的你都要承接，而是以你的所长与能有所学习的任务为优先。


    # 4. 具备「进取」的态度


    「这个办不到。」这一句话大概是所有主管最不想听到的拒绝，背后的意思是没有办法完成计画，甚至有没得谈的意味。其实，碰到状况时，主管大多希望能尽力完成，而你一句办不到，代表计画要大费周章大改或重新规画。


    卓越的工作者面对困境会想方设法完成，就算无法完成 100%，也会思考还有什么路可走，'
  merge: -1
  img_proc: true
- pgno: 507
  md: 至少完成 90%，而非一下全盘放弃。展现**尽力**达成目标的进取态度，主管会知道你是个**积极**完成任务的可靠员工，**也更愿意**把困难的案子交由你负责。
  merge: -1
  img_proc: true
- pgno: 508
  md: '# 如何说服比自己「强势」的人？掌握 4 种性格的人，谈判再也不会输


    气质，从心理学上来看，是指人在生理和心理方面展现出相当稳定的个性特征。在生活中，我们会发现，不同的人往往会展现出不同的气质特点。


    有的人比较安静，温文尔雅，做起事来谨慎细心；有的人不拘小节，慷慨大气，但是做事往往粗枝大叶、马虎粗心；有的人敏感孤僻，胆小自卑，在关键时刻总是犹豫不决；有的人冷'
  merge: -1
  img_proc: true
- pgno: 509
  md: '漠拘谨，喜怒不形于色，不轻易表露自己的心情……


    面对不同气质的人，我们往往会采取不同的交往方式。在谈判中也是如此。谈判是一个心理较量的过程，因此若想要在谈判中取胜，了解谈判对手的心理是非常重要的。


    在东方，星象学家曾以风、水、土、火这 4 大元素为依据，对人类进行分类，这是目前已知历史最悠久的分类法。后来，西元前五世纪古希腊的著名医生希波克拉底（Hippocrates）则以医学领域的生理学术语为根据，而提出了'
  merge: -1
  img_proc: true
- pgno: 510
  md: '「气质学说」。这项学说是基于人体内 4 种体液的混合比例，将人分为 4 种：


    # 多血质人


    这类型的人骄傲自信，喜欢听奉承话，因此可以适当准备一些得体的称赞，给对方戴高帽，使其情绪高涨。多血质的人也非常注重人际关系，这使得他们无论是生活还是工作少不了同伴，因此，孤身一人会给他们带来心理压力，使他们没有安全感。你不妨促成一对一的谈判局面，让他们无法发挥优势。'
  merge: -1
  img_proc: true
- pgno: 511
  md: '要特别注意的是，多血质的人不太注重承诺，所以你必须备好契约，并列出谈好的相关条款，以保证协议能够正常履行，避免带来不必要的损失。


    # 胆汁质人


    胆汁质人有着极强的控制欲，在谈判中你可以投其所好，将一些小事让他们主导，以表现对他们的尊崇，但在要事上千万别轻易示弱，否则霸道的他们会逼得你没退路。胆汁质人个性急躁、易冲动也没什么耐心，他们绝不容许失'
  merge: -1
  img_proc: true
- pgno: 512
  md: '败，你可以适时以激将法来激起他们的好胜心。


    这类型的人虽然脾气有点坏、大嗓门，讲起话来很像要跟你吵架，但通常是个有话直说、豪爽又讲义气的人，非常值得信赖。


    # 黏液质人


    黏液质人的优势在于很有耐心，有着坚持到底的韧性和决心，但优柔寡断，常常拿不定主意，因此，如果能缩短谈判时间，利用速战速决的策略，将会使他们的心理处于劣势。他们通常'
  merge: -1
  img_proc: true
- pgno: 513
  md: '谨慎细腻又固执倔强，对上级的命令绝对是百分之百服从，但做事较缺乏创造力，往往倾向于按部就班；他们适应能力较差，保守而不喜欢变化，容易自乱阵脚。


    在与黏液质人谈判时，尽量不要突然提出新的方案或主张，事前也该准备好细节，避免被细腻的他们问倒；如果有非提出不可的新做法，可以多加一些准确的数字、周密的论证，以及丰富的讯息资料，才经得起他们缜密的推敲。


    此外，这类型的人讨厌谈判对手过分夸张的表现，因此，要注意自己的措辞和态度，也不要表现得过分热情，否则将招致反感。一般来说，'
  merge: -1
  img_proc: true
- pgno: 514
  md: '冷静、客观、专业的态度会给他们留下好的印象，让他们产生信任感。


    # 抑郁质人


