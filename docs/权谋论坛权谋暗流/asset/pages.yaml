- pgno: 537
  md: '# 秦国灭楚的启示：小心「以少换多」的思想毒药


    秦王召开军事会议准备灭楚，秦国大将王翦非得要六十万兵，差不多全国军队都得交给他了。秦王觉得这要价也太高了，就问另外一个将军李信，说李将军要多少兵啊？李信说二十万足矣！


    秦王一听，跟自己想得一样，二十万灭楚没问题，怎么要六十万呢？这就把消灭楚国的重任交给了李信。李信和蒙恬两员大将就带了二十万兵马伐楚，然后大败而回。'
  merge: -1
  img_proc: true
- pgno: 538
  md: '秦王这回服了，去找王翦道歉。王翦的条件还是不变，六十万兵。最终王翦率六十万秦军，完成了灭楚的大业。


    听完这个故事后，我有深刻的启发。一般 人做事业时，都一直强调要找到「杠杆」，时刻思考是否有奇特的机会，能以小搏大，换取十倍、百倍的回报。实际上，我们在做市场营销时，如果有这种念头，那就是一种「思想毒药」。因为你所期待的事，跟去买大乐透要中
    100 亿的概率是一样的。如果一直抱着这种心态做事，是不踏实的，迟早要出问题。'
  merge: -1
  img_proc: true
- pgno: 539
  md: '大家可以反向思考一下，为什么整个社会，就只有你这么聪明、不可一世，能以少换多？市场上的其他人难道都是傻子？


    # 学习「成长思维」: 持续、务实的做，长期的累积


    大家总喜欢听精彩的成长骇客（Growth Hack）案例，因为这些精彩案例总是一再强调，其所花成本之少，但效益如何以百倍千倍的回报。


    但我总觉得，这样去解读成长骇客就一整个歪了。重点应该是，如果你做久了「增长」'
  merge: -1
  img_proc: true
- pgno: 540
  md: '（Growth）的事，只要你够勤奋，总有个小概率，可以让你击出全垒打；但如果你做成长骇客，是天天想要击出全垒打，那这个心态就不可取。


    在成长骇客里，重点是你如何透过各种数据方式来做「增长」，你的日常通常很稀松平常。但是每天一点一滴地努力投入到 Growth，你的资源跟经验就累积了，就厚实了。


    这就是复利的概念，每日微不足道的增长，只要持续、务实地做，长期累积的增长就是可观的。'
  merge: -1
  img_proc: true
- pgno: 541
  md: '# 手上资源有限时，思考如何「以多胜少」更重要


    每个人手上的资源都是有限的，你总可以以多胜少，但你没办法以少胜多。


    即便是秦要灭六国，也是远交近攻，一次打一个；如果你叶问看太多，觉得自己无所不能，想要一次打十个，那就是把自己推入了「以少胜多」的「思想毒药」，跟着你的小伙伴是要受苦的。'
  merge: -1
  img_proc: true
- pgno: 542
  md: '当手上资源有限时，我们要思考的事是：我们要选择哪个战场（市场），在哪个重点部位（市场切分）重兵切入，然后以多胜少，从这个市场点获取资源，向上累积（growth），获取生态系支持（远交近攻），然后再次重兵切入市场，获取资源，周而复始。


    军事理论大师卡尔·冯·克劳塞维兹有句名言：


    > 「制定原则并不困难，难的是始终按照原则去做事。」'
  merge: -1
  img_proc: true
- pgno: 543
  md: 每个人心中多少都会有抑制不住的妄想跟贪念，这是人类演化过来赖以为生的基因，我们并不需要为此感到特别避讳或羞耻。但是我们要能理解，这种欲望跟贪念，既是往前的动力，也可能是让人生或是事业脱轨的毒药，一旦没有驾驭好，我们就会忘记的现实基础的道理，陷入赌徒心态。
