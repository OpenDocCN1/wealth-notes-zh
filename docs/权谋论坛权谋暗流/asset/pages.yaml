  md: '以上其实是我的个人经验，如果你刚好与我有相同的感受，那么关于时间管理这门学问，最近我有些新的体悟，或许可以有些帮助。


    # 1. 时间管理象限的迷思


    # 普通人埋首自认重要的事，卓越者会和利益关系人核对


    学习时间管理的第一课，通常都是从辨识任务所属的「四个象限」开始。时间管理的四个象限由紧急与重要的指标构成，分成「重要且紧急」、「重要不紧急」、「紧急不重要」、「不紧急不重要」四部分。而柯维主张要事第一，也就是每个人应学着将精力放在「重要但


