  md: '# 如何训练部屬思考、成为大将？主管要养成的2 个带人习惯


    经常看到能干且讲求效率的主管，对于员工的请示大都不假思索立即解答，而且多半未解释「为什么」。


    这样的习惯性动作，更助长不擅思考的员工拿着「答案」，不明究理的一咪埋头去干… 员工也往往因为不知道缘由、精神而抓不到执行关键…


    # 主管要养成「导引思考、宏观阐述」的习惯'
  merge: -1
  img_proc: true
- pgno: 387
  md: '进入职场初始阶段，绝大多数的人都会战战兢兢、用心学习，让能力尽快从「不会」到「会」进步而到「熟」的阶段，以能胜任工作。然而进入熟练阶段后，也容易因熟练而松懈，不再思考钻研寻求突破，以为一套功夫在身就万事OK，不管事物如何变化，凡事「水来土掩、兵来将挡」，都用同样一套方法处理。一段时日
    后，能力不仅无法进阶到精通，且当时空变化导致原有那一套无法适用时，就易产生处理不 当、频频出错的情况。


    上述现象，点出了部属是否具有思考习惯的 重要性。'
  merge: -1
  img_proc: true
- pgno: 388
  md: '培养训练员工养成思考习惯，是员工不会因熟练而固化、而能与时俱进的关键，甚而是培养一流人才最重要的处方。


    带人没有那么难！掌握教练 4 大流程，团队领导心法，和员工一起变强，不再自己单打独斗！


    所以主管在日常与员工的互动指导中，如何利用「导引思考」的方法，来刺激、启发员工的思考，就非常的重要。


    # 什么是「导引思考」？


    「导引思考」就是当员工碰到问题来请示时，主管不要立即给答案。'
