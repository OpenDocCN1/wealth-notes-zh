- pgno: 544
  md: '# 老板把你的光环都抢走了？主管不给舞台时，要私下做的几件事


    你一定遇过这样的主管，从专案发想、沟通、执行都是你一个人完成，主管最后却告诉众人「果然我的想法是对的」「幸好大家都照我的话做」，这些把成果都算在自己头上的说法，是抢功劳型主管最典型的说话方式。


    他们并不一定很有执行力，却喜欢下决策，而且觉得自己的决定精准无比，希望你崇拜他的工作能力与无所不知。


