- pgno: 246
  md: '# 职场地雷行为


    工作时虽然要采用具体的沟通方式，但如果只会一直要求别人给详细的指示反而会被讨厌，这就是人家说的伸手牌。接到别人的委托时，有些人会一直问：「要怎么做？」「为什么？」「期限是什么时候？」举例来说，这类型的人会在别人叫他整理会议纪录时，询问要怎么整理。一次受托两件以上的工作时，他们会问要先做哪一件，这会让委托人觉得：「这点小事，你不会自己判断吗？」'
  merge: -1
  img_proc: true
- pgno: 247
  md: '# 地雷 1：自作主张！未经任何讨论就直奔终点线


    虽说要自己判断，但不是你想怎么做就怎么做。有时候，当你做了自认为适当的判断，却又被责怪：「你怎么没有跟我报告就这样做了！」「这和我当初交代的不一样！」


    那么，要怎么做才是最好的呢？答案是不是不要擅自决定，而是先思考并提议。


    > 「关于那件事，我想要这样做，您觉得如何？」


    **不擅自决定、不要等着别人下指示，而是自己思考，并提出方案。** 如果有多个方案可供选择的话更好。这样一来，上司或相关人士就可'
  merge: -1
  img_proc: true
- pgno: 248
  md: '以直接选用你提出的方案，或是要求你修正其中一部分，非常轻松。最重要的是，这样做能让他们觉得你很有干劲，给你更好的评价。


    # 地雷２：什么都问！没有详细指示，就不会做事


    另外，不要求对方给详细的指示，但是很详细地向上头报告进度，这才是聪明的工作方式。


    > 「关于那件事，目前正如此进行中。」


    > 「正在等对方回覆预算金额，我会在明天之前向您报告。」


    你可以像这样，用信件或口头报告的方式，把'
  merge: -1
  img_proc: true
- pgno: 249
  md: '现况逐一告知其他人。这样做的其中一个原因是为了分摊责任。勤于报告进度的话，要是之后发生什么问题，其他人才不会说他不知情，导致责任全都落在自己身上。


    另一个原因则是，如果自己因故请假时，工作也能顺利进行。平时就和同事互通消息，即使有个什么万一也不必担心，这是团队合作的必要条件。


    没有详细的指示就不会做事，就表示你被动又消极，周遭的人才不会给这样的人正面评价。思考后提出方案，并逐一报告工作进度，这才是职场该有的沟通方式。'
  merge: -1
