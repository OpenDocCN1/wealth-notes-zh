- pgno: 420
  md: '王珪提到春秋时代郭国会灭亡，是因为郭君喜欢善良的人、好的事物，却不任用好人的，讨厌坏的事物，却不驱赶恶人，所以才会亡国。他提醒唐太宗，虽然讨厌庐江王的暴行，却还是把美人入籍宫中，这和郭国的君王不是一样吗？


    # 透过 6 种情境观察，看见部属最真实的一面


    王珪的劝戒点出了领导者的行为、身边任用的每一个人，都必须「择善」。唐太宗身边最知名谏臣魏征则进一步提出，如何判断一个人是否能成为可信任的下属，可以用 6 种方式观察：'
  merge: -1
  img_proc: true
- pgno: 421
  md: '# 1. 贵则观其所举


    当一个人爬到中阶主管时，要观察他录用、提拔哪些人物，因为他会选择提拔和自己个性、理念相似的人。


    # 2. 富贵观其所养


    对于富裕的人，应观察他如何花钱，以及花在哪些用途。假设这个人变有钱之后，就开始恣意挥霍，不见得适合交付重任。'
  merge: -1
  img_proc: true
- pgno: 422
  md: '# 3. 居则观其所好


