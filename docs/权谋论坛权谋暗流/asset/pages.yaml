- pgno: 315
  md: '要他警示唐中宗；他不畏众怒，多次替韦后辩解，赢得韦氏好感，加深自己地位。


    《罗织经》解释，「众之敌，未可谓吾敌；上之敌，虽吾友亦敌也。」意思是说，大家的敌人，不一定是我的仇人；但上位者的敌人，就算是我的朋友，也要与他为敌。萧至忠的行为，明确体现了这点，「众臣」是他平时的伙伴，但「主管」（韦后）视这些人为敌，他也要随机应变。即使此举使他风评不佳，这样的举动，对他来说仍然是有利的选择。'
