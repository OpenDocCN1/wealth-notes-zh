  md: '何谓关系？筒而言之，亦即人与人之间的牵扯，或者物与物之间的作用。


    关系，可能是与生俱来的，诸如血缘故系；关系，可能是逐步积累的，有如朋友关系。锦上添花，是一种关系；雪中送炭，是一种关系；狼狈为奸，是一种关系；结党营私，是一种关系。


    古人有云：君子淡以亲，小人甘以绝。君子之交淡若水，小人之交甘若醴。


    关系，有疏有间；关系，可紧可密。同过窗的，不如下过乡的；下过乡的，不如扛过枪的；扛过枪的，不如嫖过娼的；嫖过娼的，不如分过'
