- pgno: 389
  md: '我们经常看到一位能干且讲求效率的主管，对于员工的请示大都不假思索立即解答，而且多半未解释「为什么」。这样的习惯性动作，更助长不擅思考的员工拿着「答案」，不明究理的一昧埋头去干，员工也往往因为不知道缘由、精神而抓不到执行关键。以至于执行结果不是走偏了，就是成效与预期有相当大的落差。


