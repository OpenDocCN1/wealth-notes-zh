- pgno: 181
  md: 在当今时代，大多数领导者都明白，命令与控制型领导方式，已是明日黄花，恐惧并不能激励员工。正因如此，很多领导者往往会避免做出让人害怕的事。只有那些最差劲的恶霸老板，才会冲着员工大呼小叫、出口伤人，或威胁说如果下次还把咖啡冲得这么浓，就赶紧卷铺盖滚蛋。但是，即便是优秀的领导者，有时也会无意间让员工心生畏惧。更确切地说，我们令员工在脑海中产生畏惧，其后果是很可怕的。他们为了自己的生存问题，就会产生反抗、逃跑或麻木。结果，他们的创新能力、合作能力、逻辑思考能力，都被抛到了九霄云外。
  merge: -1
  img_proc: true
- pgno: 182
  md: 如果我们总是告诉员工该做什么，而不是鼓励他们开动脑筋自己想办法，那么我们的公司里就会充斥着只知循规蹈矩、不会主动创新的员工。如果养成了他们凡事必先请示的习惯，我们的员工队伍就会永远被“冻结”在动物状态中。而如果我们鼓励他们自己解决问题，他们就会产生安全感、归属感和自信心。当然，我们也会帮助他们树立主人翁精神，这对他们自己和公司都大有好处。领导者向他们提问，看看会发生什么。问一问，你会如何做这件事？你的行动会有哪些影响？如此反复数次后，员工便会期待你向他们提出问题，而不是下达命令。他们会带着创意来找你，寻求反馈和肯定。
  merge: -1
  img_proc: true
- pgno: 183
  md: '而经历过几次这样的会面后，他们会找到你说：“我有一个计划，呐，就是这个，如果你不同意，请现在就告诉我。”最后，他们彻底不需要再找你请示了。每给出一个建议，都要提五个问题。你会惊讶地发现，你的员工和公司已经今非昔比了。


    一次会议，领导者的发言，可能造成员工的困惑和不确定性，这样就会引发恐惧。也就是说，不着边际、缺乏焦点的会议会将员工逼入反抗、逃跑和麻木的状态。相反，简短愉快、气氛活跃和议程明确的会议，能让每个人始终处于智慧状态。关键是要了解五种沟通形式：信息分享和自我分享，辩论和决策，观点证明，'
  merge: -1
  img_proc: true
- pgno: 184
  md: '要求，以及承诺。大部分会议着重于前三点，忽视后两点。在理想的情况下，信息分享活动应该适可而止，然后要让有需要的与会者提出要求，请能满足这些要求的与会者做出承诺。调整你的沟通方式，你便会收获这样的结果：会议效率提高，团队成员心情愉快，工作各司其职，执行成果辉煌。


    狮子领着一群羚羊。暂且将你的员工想象成羚羊，由于你是他们的顶头上司，他们会自然而然地将你看作狮子。这意味着，除非你能让员工将你视为“另一只羚羊”，否则，你就无法影响他们。因为他们只会忙于保障自己的生存，没心思接受你的反馈。不过，这里有三句'
  merge: -1
  img_proc: true
- pgno: 185
  md: '简单的话语，可以让员工克服恐惧。如果你在提出意见或建议之前先这样问一问“如果……会怎样”，不表明立场，而是让员工开动脑筋、用心思考。还有“我需要你的帮助。”当你希望对方改变自己的行为，或承担更多的责任时，这句话尤其有效。当有人陷入恐惧状态原地打转，无法前进时，向他们提供一个解决方案，可以帮他们发现可能的行动方向或积极结果。你可以这样说，“如果……，会不会好一些”。


    其实人们倾向于扮演三种默认角色：受害者、拯救者和迫害者。这些角色是相互依赖的，而且每天都在职场生活中上演着一幕幕活剧。当'
  merge: -1
  img_proc: true
- pgno: 186
  md: 我们身处其中时，问题便成了我们关注的焦点。我们将所有的一切都看成问题，为此而生焦虑，接着便奋起反击，进而又引发另一个问题，形成一个自我存续的无限循环。解决办法是将关注焦点从问题转向结果。我们要问的不是“出什么事了？”和“为什么会这样？”，而是“我们需要什么？”和“我们如何办到？”可见，领导者不能“只关注问题，不关注结果”。专注于结果给人以别样的感觉。你会觉得干劲十足、精力充沛、信心百倍，稳稳地处於智慧状态，拥有更丰富的可能性、选择、创新和更高层的意识。受害者成为结果创造者。拯救者成为洞见创造者。迫害者成为行动创造
  merge: -1
  img_proc: true
- pgno: 187
  md: '者。如果你的员工处于受害者模式，而你倾向于担任拯救者，那么你就应该问“你想得到怎样的结果？”和“这会对你有什么影响？”如果你在每次交谈中都这样问，并指导别人也做出这种转变，你就可以改变公司文化，迅速获得你想要的结果。


    几乎所有的领导者都希望并需要自己的公司开展变革，因为这是实现增长的唯一途径。但是，人们天生抗拒改变。实际上，只有在“个别有变，其余照旧”这个特定背景下表述变革时，才会有2/3的人能容忍变革，也就是说，领导者必须将变革描述为对已经在做的事加以改进：去除糟粕，添加精华。这是包装'
  merge: -1
  img_proc: true
- pgno: 188
  md: '变革信息的最佳方式。不要用“变革”这个词，

    可以用“发展”来代替。抗拒不见得是坏事。

    这只不过是漫漫长路的第一步。另外四步是嘲

    讽、有用、习惯和新标准。一旦你跨过了抗拒

    这道屏障，就可以大踏步前进了。总之，当你

    做出上述这些改变后，你很可能会发现，结果

    取得了显著改进。所有的领导者都希望在业

    绩、产品销量和创新上打败竞争对手，而我们

    大多数人都拥有具备这些能力的团队。我们要

    做到的，只是别再吓得他们忘记了自己的能

    力。


    # 让牢骚鬼闭嘴'
  merge: -1
  img_proc: true
- pgno: 189
  md: '任何领导者，都无法承受员工不尽职的代价。尤其是整天发牢骚的人。整天发牢骚的人会拉低生产率，其消极态度会影响企业文化，令高绩效员工不堪其扰，最终只好一走了之。因为终日抱怨的牢骚鬼会吸干工作和生活上的资源、时间、精力和乐趣。这些让你耗费精力的人常常很狡猾，而且背后还有保护伞。为了顺利实现从抱怨文化向贡献文化的转型，你首先要做的就是制定策略。


    揪出牢骚鬼，制止牢骚语。那些终日抱怨的牢骚鬼就像校园里的恶霸、被宠坏的小不点、哭哭啼啼的孩子、性格阴郁不讨喜的少年。'
  merge: -1
  img_proc: true
- pgno: 190
  md: 有些人爱演苦情戏，会通过非难、发泄和拒不配合来抱怨。他们把自己打扮成殉道者，喜欢撒娇耍赖，使这小性子。他们希望你能手把手地带领他们渡过难关，替他们把问题搞定。你千万不要答应他们。你要提醒这些人，只有当他们能成功解决问题而不是把问题推给别人时，大家才会更愿意同他们打交道。与他们协商时，你可以先倾听几分钟，表达一下感同身受的心情，然后要求他们拿出解决方案。比如说，“哎呀，这对你来说一定很难吧。你会怎么处理呢？”他们也许会用这种无助的表现为自己寻找更强大的保护伞。所以，要争得领导者的支持，你就要证明他们这种扮演受害者的
  merge: -1
  img_proc: true
- pgno: 191
  md: '行为会损害别人的绩效、浪费时间。要记录下他们的无能行为，让领导者看看清楚，这种人不但自己不肯出力，将分内工作推给别人，还会跑来找他们哭诉，在辅导课上捣乱。


    有些人没事找事，使用的抱怨策略是让别人沮丧、令事情变复杂、制造困惑。他们是吹毛求疵的批评家，自以为无所不通，大事小情都要管上一管。他们总是想阻碍变革，希望一切最好照旧。这些擅长纠缠细枝末节的家伙到处挑刺，专门盯着别人的弱点。同这种人协商，首先要肯定他们的系统、思维过程或设计中的智慧。然后，将变革描述为一种符合逻辑的附加活动，请求他们贡献自己的力量。“你能否'
  merge: -1
  img_proc: true
- pgno: 192
  md: '对下一次升级提些建议，确保它能同你的流程兼容？ ”如果不能参与系统的升级或微调，他们就会远离知识循环。通常，没事找事的人对系统的设计或历史了然于胸。管理层或许会担心他们无可取代，或一旦遭到训斥，便会阻止别人访问系统或干脆破坏系统。因此，要描述一下他们造成的延误和挫折。


    部分牢骚鬼也会情绪化，他们喜欢用吸引关注、说长道短、小题大做、惹是生非的方式抱怨。他们性情急躁、行为夸张，遇事容易反应过激，大惊小怪，最喜欢成为万众瞩目的焦点。情绪化的人希望你能关注他们。他们发牢骚是为了满足自己被人倾听、钦佩和欣赏的需要'
  merge: -1
  img_proc: true
- pgno: 193
  md: '要。因此你要提醒他们，因工作出色而得到积极肯定，要比获得关注却给人留下了坏印象好得多。同他们协商时，首先要予以肯定，但不要陷入他们营造的戏剧化氛围中。情绪化的人都是演技高超的明星。领导者可能认为，同他们的贡献和沟通能力相比，发点小小的牢骚不算什么。因此，要让领导者看看他们如何制造混乱，又如何用绘声绘色的讲述编造谎言。


    要警惕控制狂也会诉诸于激烈的抱怨，以求达到一个结果，并掌控形势、控制他人。他们表现得像个暴君、恶霸、驱策奴隶的监工，动辄对人威逼恫吓。控制狂希望你能屈服于他们的权威，而一旦你称了他们的心，他们就会'
  merge: -1
  img_proc: true
- pgno: 194
  md: '骑到你头上。他们通过抱怨搞定各种事项，催

    促别人采取行动，或摆脱束缚。与这些人协商

    时，你要坚持自己的立场。告诉他们你已经意

    识到问题的存在，如有可能，请他们来确定接

    下来的方向。控制狂往往是能说会道的主管。

    领导者可能会看重控制狂的自信心、领导才干

    和干净利落的办事能力。要赢得他们的支持，

    你需要确定恃强凌弱行为中所蕴含的风险，包

    括员工心怀怨恨，不愿畅所欲言，消极怠工。

    要解释说，控制狂或许会取得短期成功，但这

    些成果难以为继。


    还有一群危险分子是公司的毒药，他们大

    发牢骚、散布谣言，通过操纵和毒害环境来满'
  merge: -1
  img_proc: true
- pgno: 195
  md: 足一己私欲。公司毒药自我陶醉、心理变态，以操控他人为乐。他们善于弄虚作假、翻脸无情，一边装模作样地讨好上司，一边在同事和下属面前大发淫威。他们动辄施展魅惑之术骗你解除武装，以达到自己的个人目的。他们自私自利、自尊自大，是你的健康杀手。作为领导者，你绝不能容忍他们逍遥法外。要不动声色地记录他们的行动。如果被毒药们察觉你打算对他们下手，也许会招致他们的报复，并危及你的职业声誉。你可以提醒他们，发展与生俱来的谋略之才，同时提高敏感度，留住他人的信赖，将帮助他们实现目标。毒药们个人魅力十足，而且工作上似乎也成果颇丰。要想让
  merge: -1
  img_proc: true
- pgno: 196
  md: '高层领导者相信他们有问题，就必须拿出他们兴风作浪的铁证。远离牢骚 也许你无法让终日抱怨不停的牢骚鬼闭嘴；不过，如果你能将他们准确地分门别类，至少你可以落得个耳根清净。


    # 学会如何正确领导别人'
  merge: -1
  img_proc: true
- pgno: 197
  md: '在商业世界中，最大的问题就是领导者们不领导别人。你可能并不相信这一点，但它确实存在着。有些人有头衔、有角色、有责任，但是他们并不那样做。这不是开玩笑。为什么会是这样？肯定有各种各样的原因，从经验不足，缺少能力，到缺少责任和缺乏培训，都存在着这些问题。其中的一些要归咎于个人，而另一些则是公司文化或者文化缺失导致的。当然也有这两个原因共同导致的。


    领导别人，是你的职业和你的生活，也是你的责任。对此，你没有任何借口。你的利益相关'
  merge: -1
  img_proc: true
- pgno: 198
  md: 者指望你尽最大努力去做他们花钱请你做的事情和你承诺的事情。如果你领导不了别人，就证明你已经筋疲力尽。你拒绝承认，还是欣然接受，问题就这样存在着。这里有很多的迹象可以帮助你判断，问问你自己：你是否觉得众口难调，仿佛所有的人都在往不同的方向走，而你在不断地灭火？你是否让大家达成共识，都同意朝一个方向走？当涉及到执行目标、策略和计划的时候，你是否对每个人的要求太松了？是否花更多的时间在思想波动和辩论上，而不是花在做事情完成目标上？你是否总是因为未能履行承诺而对你的利益相关者——你的客户、你的员工、你的总经理和你
  merge: -1
  img_proc: true
- pgno: 199
  md: '的董事会编造借口？你是否总是对别人指指点点？根据你记得的数据，你的业务增长是否持平或者在下滑？业务是否永远无利可图？


    上述这些问题，当你持消极回答的时候，就表明你已经筋疲力尽。如果你能辨别出这些迹象中的任何一个，那么你在变成称职的领导方面刚刚迈出了第一大步。这时候，你需要获得一些帮助。找一个曾经做过你正在努力做的事情的人，让他们庇护你，并且让你保持清醒。这是你首要任务，你需要解决的优先级任务。你不要说你没有时间，因为没有人有时间。请制造出时间，努力去做这些吧。即使你不认为你'
  merge: -1
  img_proc: true
- pgno: 200
  md: '有成功的本事，你也要去做。有人认为你有足够的 能力来承担责任说明了很大问题。而且如果你是企业家，如果这是你自己的表演，这也可以说明很多问题。这说明你拥有领导的欲望和动力。


    # 如何让下属愿意跟随你'
  merge: -1
  img_proc: true
- pgno: 201
  md: '当今世界，企业治理方式和社会发展是密切相关的。在中国，不管是国企还是民企，管理者的权势影响力，或者是以物质为主的激励方式所产生的效果都在缩小。那么如何在这种形势下，提升对下属的影响能力，就显得尤为重要。况且一个领导对下属的影响力，决定了团队的战斗力和凝聚力。那么如何提升领导对下属的影响力，让下属心甘情愿地跟随领导，就要从领导同理心角度出发去寻求方法。


    首先要设定目标。很多管理者会说，目标我们都有啊。是的，任何观念和方法都得再深入一步，目标也一样，它非浮于表面。但你'
  merge: -1
  img_proc: true
- pgno: 202
  md: '要明确企业的目标和个人有什么关系？很多**企业领导者发现，企业目标宏伟高尚**。但是下属却提不起精神。为何？你即使最好与我没关系。我会跟随你吗？不一定。
    如果你领导定的目标，只是自顾自说，那下属就不一定响应你，跟随你。所以要把企业目标和下属目标结合起来，一旦形成共赢价值链，那下属的主动性自不必说！


    其次是要换位思考。如果你是一个下属，老板告诉你开会不能开手机，但老板自己的手机却铃声大作，你会作何感受？其实是一样的。这里说个故事。甘地被称为印度“圣雄”。一次，一个妇女带着小孩子来找甘地，说，孩'
  merge: -1
  img_proc: true
- pgno: 203
  md: 子很喜欢吃糖，家长说他不听，他只听甘地的，所以就走了很远的路过来，希望甘地教化他的儿子。甘地听完后说，一周之后来找我。一周之后，当妇女带着孩子来的时候，甘地摸了摸孩子的额头说，不要吃糖，吃糖对牙齿不好。然后示意妇女可以了。妇女很生气，说既然这么简单的一句话，为何还要等一周再来。一周前为何不讲。甘地轻声说道，因为一周之前，我也在吃糖。作为一个领导者，哪怕你的权力再大。如果不能以身作则，要期望得到下属长期的跟随之认同，也是不可能的。其实下属不听你说什么，而是看你怎么做。如果希望下属能上行下效。那就好好努力吧，严以律己，才
  merge: -1
  img_proc: true
- pgno: 204
  md: '能其正身，不令而行。


    第三，要加强情绪管控。一言不合，怒气相向。不要认为领导脾气大，就得骂。骂了下面人，他们才长记性。那么如果骂了就长记性，我们就不要花那么多钱做培训，或者花那么多精力教导员工做好事。实际上一个领导者的情绪会直接影响下属情绪。而几乎所有的下属，都不喜欢跟一个喜怒无常的领导共事。因为捉摸不透的情绪，总是让自己战战兢兢。而我们发现，一个被下属认可和跟随的领导，绝大部分时候，都是个懂得控制情绪的人。所以，要适当地控制自己情绪，知道什么时候该用什么情绪，从而更好的去影响下属，影响他'
  merge: -1
  img_proc: true
- pgno: 205
  md: '们的行为。


    第四，做领导的，尽量别“手贱”。就是有事没事帮下属做事，插手下属正在做的事。许多领导对于工作的态度是，我厉害，我来做。殊不知，一个处处抢着做事的领导，一定会造就一批无能的下属。而对于一个有上进心的下属，没有自己独立完成工作的机会，实际上是一种失败的表现。作为领导者，懂得适时适量的授权下属做事。也是一种很好的影响方式。因为一个优秀的下属，总是会珍惜一个不断提供挑战自己成长自己机会的领导。总而言之，要记住一点，团队效率永远大于领导个人。同时，一个发自内心跟随你的下属，会主'
  merge: -1
  img_proc: true
- pgno: 206
  md: '动积极的为团队创造更多更大数据益。


    # 忙碌无效的根源是什么'
  merge: -1
  img_proc: true
- pgno: 207
  md: '好多企业，所有的职员整天都在忙忙碌碌。本来忙碌是好事，业务繁忙，收益多多。但细细观察，是忙而无效。不少的管理者更多充当的是救火队员的角色，哪里出现了火苗就扑向哪里灭火，等气喘吁吁的将这团火灭了，另外一团新的火又蔓延开来，如此循环反复。结果便是大家每天都很忙，却对企业整体的绩效影响不大。不少的公司每天要花大量的时间进行内部协调、沟通，大家都把时间和精力花在了错误的事项上。其实，人们并不乐意这样做，而是都希望更高效地工作。


    然而在企业里，有的地方就免不了沟通、协调，'
  merge: -1
  img_proc: true
- pgno: 208
  md: '但人越多，人们花在沟通、协调上的时间也会更多。不少的企业就是这样被大量低效、无意义的内部沟通拖得迈不开成长的步伐。很多时候，是管理者们身不由己，只能灭火。于是，我们认为，内部沟通、协调这么困难，一定是沟通技巧不够好。但我认为，这仅仅是表象问题，需要我们从组织结构入手，从根源上分析、解决这个困扰的问题。


    当然，也有人试图用心理学观点去寻找沟通技巧。我认为这至少能起点作用，也有这个必要。但另一些问题也显现出来，即作为个人，准确的对人做不同的个性划分，并熟练的根据不同个性的人的特质运用不同的沟通技巧当然很'
  merge: -1
  img_proc: true
- pgno: 209
  md: '好, 这些专业的工具能帮助我们更好的看清自己, 看清他人, 这样在与他人沟通时自然更精准。可是在一个组织的团队中, 掌握了这些技巧大家不一定能无障碍的沟通。很显然,
    事情没有我们想象的那么简单! 为什么没有那么简单呢? 因为组织的问题绝非用点线的方案就能解决的, 我们须以结构化的方式来分析, 来解决。


    这里, 我想列举企业里的几种常见状况, 来说明沟通技巧解决不了的问题。一是狭隘的部门化思想, 人们往往强调不要对其他职能部门或专业技能的工作表现出不恰当的好奇心。二是人们往往以
    “谁是正确的” 而不是以 “什么是'
  merge: -1
  img_proc: true
- pgno: 210
  md: 正确的”这种观点来看待各种决策。三是员工日益成为专业人员，并越来越倾向于关心自己所精通的、狭窄的专业领域。四是每一位管理人员都渴望扩大每个职能的地位；每一个职能部门的经理都认为他自己所在的那个职能部门是最重要的。五是员工们认为自己的首要职责就是捍卫其所在的职能部门。六是只要组织一达到中等规模或复杂程度，就会产生“摩擦”，并很快变成充满误会、派系、独立王国和建立起柏林墙的一种组织。上面这些状况，我们仅仅要求员工提高“个人素质”，苦口婆心的劝导员工要有“大局观”，再指导员工学习学习人的个性划分，要求他们根据人的不同
  merge: -1
  img_proc: true
- pgno: 211
  md: '个性应对不同的沟通技巧, 这恐怕很难解决问题。


    如果我们仔细分析上述这些状况的根源, 它来自于组织的结构, 不是用点线的技术方案能解决的, 最多不过是表面上看起来一片和谐, 暂时的和谐也是因为双方利益冲突不大,
    当利益冲突足够大的时候, 人们便会撕下表面和善的面具, 问题便也随之凸显出来。于是, 一个状况一个状况的出现, 此问题刚刚消弭, 彼问题又生起新的事端。因此,
    这并不是沟通技巧的问题, 而是 “职能制组织”的代价。德鲁克说, “任何一种组织都必须应用一种或两种工作和任务的组织'
  merge: -1
  img_proc: true
- pgno: 212
  md: '设计原则，即职能制结构和团队结构。职能制组织设计的最大优点是具有清晰性。每个人都

    有一个‘据点’，每个人都了解他自己的工作。

    它是具有高度稳定性的一种组织。”


    不过，在小型的职能制组织中，沟通是相当良好的。但是，只要职能制组织一旦达到中等规

    模，沟通就不行了。同时，在人员的培养、准

    备和考验方面，职能制组织也很差。职能制组

    织必然会促使员工主要关注知识和相关能力

    的获取，但是，职能制中的专业人员在视野、

    技能及忠诚方面可能却比较狭窄。而且，职能

    制组织往往使人不适于从事管理工作，这是由

    于它主要强调的是职能技巧而不是成果和绩'
  merge: -1
  img_proc: true
- pgno: 213
  md: '效。事实上，一个组织单位在职能方面的技术程度越高，则它越不重视管理，越是难于把人培养成为一名合格的经理人员。所以，公司里出现问题，出现错误，已不在员工或管理者个人，而在于“对职能制组织的应用已经超出了它所能适应的规模和复杂程度。”


    # 制度与人情该如何拿捏'
  merge: -1
  img_proc: true
- pgno: 214
  md: '制度和人情那个更重要？始终是中国企业永远绕不开的一个话题。当下，有很多管理专家都将中小企业的短命归咎于企业内部的人情化管理，更有甚者说它是中小企业的死亡基因，似乎企业内部的这种人情化有如洪水猛兽，非常可怕。其实也不然。悠久的历史文化
    和人文特点，决定了我们这个国度是人情社会。同事、上司下属之间的相互理解和体谅，这朴素的人情观，并非一一是处，我们应该辩证看待。


    根据多年的管理实践，我想一个企业如果过度人情，则无规矩；如果制度严酷，人性受到压'
  merge: -1
  img_proc: true
- pgno: 215
  md: '抑，则无创造。所以只有人情与制度配合恰到好处，才能最大程度的激发员工潜能。事实上，制度管理是一个成功企业的根本。任何企业，无论其规模大小，人员多少，都应该有相应的管理制度，对其日常经营活动加以约束。没有制度，只会使企业陷入混乱的无序的困境，造成内部资源无谓的浪费。


    由此不禁记起西方经济学的一个理论基础，即所有人都有谋求个人利益最大化的倾向。可见，如果没有制度，就会助长这种倾向，而最终受损的将是企业本身。当然，实施制度管理，首先要有制度的建立。任何一个公司，制度制定就是为了执行的，否则，这个制度等'
  merge: -1
  img_proc: true
- pgno: 216
  md: '同于无效。制度其实就是一个公司成员间的“信用”，如果每个人都可以随意破坏制度，那么公司的领导层在员工的心目中就没有了“信用”。所以，制定制度之前，要多花些时间考虑制度的合理性，同时也要考虑到可执行性。没有工作规范、没有制度、没有流程规定，所有人由着自己的想法和方式运作，就打乱并分散了企业的运行能力，也无法形成一个核心团队，不能打造很强的竞争力。


    至于人情，它可以成为制度以外的辅助措施。适度的人情是公司运作的“润滑剂”。比如，员工在流程上违反了规定，按照规定你追究了他的责任，罚了'
  merge: -1
  img_proc: true
- pgno: 217
  md: '他的款，下班之后由于你们的情感关系，好好地沟通一下，说明一下，甚至喝上两杯，员工心里的阴影和不快顿时云消雾散。总之，合理的人情可以看做是公司制度的衍生文化，是一种人性化的制度，即在制度基础上，预备了人性化管理的受理窗口，可以解决制度没有规定的、突发的、紧急的、必须的人情管理，并且对其中某些诉求制度化。


    不过，在这里需要特别注意的是，人情只能是暂时的、偶尔的、一次性的手段。如果某种人情被日常化、习惯化，那就成了不成文的制度了。并且，不成文的制度是危险的。企业要做到防微杜渐，领导层要在人情体谅当中发'
  merge: -1
  img_proc: true
- pgno: 218
  md: '现并制止恶化趋势，否则只会造成管理的混乱和员工对管理人员的不信任。因此，首先要考虑制度的完善和妥当，在公司内部实现公平、正义，以制度为框架保证公司运作的系统性、完整性与和谐性。同时，管理者也要从人性的角度出发，善察人心，练就换位思考的习惯，去体察、满足他人需要，并谅解他人的过失。人情和制度加起来，一并融入管理。这才是企业管理的“核武器”。


    # 商业领袖们的自我毁灭'
  merge: -1
  img_proc: true
- pgno: 219
  md: 如果你向商业领袖们提出这个问题，即是什么让你有自我毁灭的风险？那么十有八九他们会回答：缺乏技能、能力和经验。其实在现实中，该答案只关乎行为。在竞争性的市场中，失败是不可避免的，我们每个人都会经历这样的失败。当然，我们从成功之中赢得信心，但是我们从失败中获得智慧。这是好事。不过，这里说的失败是可以预防的，它不是一定会发生的，它是由于个人的原因造成的，而不是外部力量的结果。诸如，像卑躬屈膝、哀怨、欺骗、独裁者和自高自大等行为，不仅仅会削弱你的领导能力、你的表现、你的信誉和你的声
  merge: -1
  img_proc: true
- pgno: 220
  md: '誉，还会阴魂不散地纠缠你，并且最终会变成你的祸根。


    关于对现状卑躬屈膝。当然，有很多很好的例子。如果你做的是糖果生意，你有一个成功的品牌，你可能会在几十年里都非常成功。如果不是这样，那么惯性就是你的敌人。如果你发现你自己说，“这就是我们这的做法”，那么你就有麻烦了。值得一做的是改变现状，创新你的做法。不过，如果遇到问题，千万不能哀怨。很少有行为会比哀怨、找借口、推卸责任或者诿过他人更不像是领导者的所为。它反映出行为人严重不成熟、缺乏自信、尊重和承担职责的担当。这是非常坏的迹象。'
  merge: -1
  img_proc: true
- pgno: 221
  md: '商业界崇尚的是诚信。你对于坦诚、说出你的想法和直率对人感到越舒服就越好。努力成为最好的你，而不是别的什么人或者什么不是你的东西。欺骗是个光滑的斜坡，一旦你开始踏上这条路，它迟早会反过来害你。你在企业的等级阶梯上已经爬到了高的位置。但你都是为别人服务的。一旦你开始表现得像是一位超级领袖，即独裁者，那你就可以和你的成功吻别了。独裁者很可怕。


    自信、有才干和成熟的领导者们从来不会做出空洞的威胁。如果你做出空洞的威胁，那么这就如同孩子发脾气扔东西，它会破坏你的信誉。这是决定性的。说到就要做到，不然一开'
  merge: -1
  img_proc: true
- pgno: 222
  md: '始的时候就不要说。其实寻求成就和财富是健康的。这就是我们衡量成功的方法，它还是我们让公司成长，照顾我们家人的方法。对于政客们和官僚们来说，权力就是能量。在商业世界里，如果你痴迷于权力，后果将很严重。


    在商业领袖们的周围，总是会有一些懦弱的应声虫。他们会粉饰真相，告诉你一些你想听的话。但是如果你雇佣这样的人并且听信他们的话，那么你就如同在看着镜子看你想看的东西。你生活在拒绝之中。这也是领导者失败最常见的原因之一。当然，你不能做出你无意实现的承诺。那些言出必行、言行一致的高管和商业领袖通常会有光明的未来。虽然有一些人'
  merge: -1
  img_proc: true
- pgno: 223
  md: '也可以通过吹嘘获得一定程度的成功，但是按照我的经验，这种成功是不会长久的。


    我曾经见到过，并且认识很多总经理，他们的公司都有着宏伟的愿景，可是没有任何事情，或者逻辑能够支持他们的理想成功。他们是如此地自我膨胀，以至于他们认为凭借一己之力就可以成功。有趣的是，这种事情从来都没发生过。美好的命运不会光顾自高自大的人。不要做你已经知道的错事。无论是牺牲原则的贪婪、走捷径或者因为害怕后果没有做正确的事，和欺骗一样，这是个光滑的斜坡。你可能会得逞一次或者两次，但是它总会追上你。我见过这样的事。这是真的，相信我。'
  merge: -1
  img_proc: true
- pgno: 224
  md: '# 能提升领导力的四件事'
  merge: -1
  img_proc: true
- pgno: 225
  md: 这里，我向你建议做好四件事。只要做好这四件事，你的领导力就会得到提升。信不信由你。首先不要试图证明你有多聪明。因为这样的冲动往往是致命的，它会使人做出愚不可及的举动。譬如卷入无谓的争吵，以证明自己是对的，别人是错的；或者告诉那些和你分享有价值信息的人，你早就知道这些，以此来贬低他人；为某个观点或决定辩护；为改进下属的意见而说“那主意很好，但是这样就更好了”；忙着展示自己的好主意而对他人的想法置之不理。这些如果你具备，那你肯定提升不了领导力。
  merge: -1
  img_proc: true
- pgno: 226
  md: '因为高效的领导者会放弃炫耀自己聪明的冲动，而去寻找有效率的感觉，即能够按时完成

    任务，让他人更出色，或找到最简单的解决方案。相比之下，这种举动更有价值和意义。


    第二，必须衡量你的个人魅力，即由内而外所散发出来的积极强大的精神。快乐和意义只能是当下。因此，在工作时一定要“投入”，要“不遗余力”。要在当下热爱你所做的工作。


    如果你热爱你所从事的工作，却从不表露出来，那你注定要被误解。当然，有时候不管你觉得自已有多积极，你还是表现不出来。你会假定人们能读懂你的内心和想法。你可能会觉得自已是个公平，尊重他人，性情平和的领'
  merge: -1
  img_proc: true
- pgno: 227
  md: '导者，可是在别人眼中你可能是个有压力，易发怒，不满意的领导者。所以，我鼓励你要用心去接受反馈意见，积极改变并争取在那些方面极大地提高自身的表现。作为领导者，你不能假定你感受到的就是你展示给他人的。你需要确认自己积极正面的情感传播给了他人，而要做到这一点，可能需要比活动本身付出更多的努力。


    第三，及时修复受损的名声。一次事件不会给你带来好名声，而一次纠正姿态也不会改善你的名声。你必须要通过一贯的、类似的行动开始重建过程。虽然这是可行的，但需要个人具有洞察力和自律意识。如果你已被认定是位爱'
  merge: -1
  img_proc: true
- pgno: 228
  md: 讥讽人的老板，那你需要保持缄默数月，人们才会注意到你的变化，并开始接受全新的你。你或许可以接连几周不偏离目标，但只要你又出现了一次以前的行为，人们就会开始怀疑你到底有没有改变。因此，在如何展示自己方面必须要做到始终如一。抛弃了一贯性会使人迷惑。而你试图树立的名声也会因相互矛盾的佐证，而变得复杂并最终失去目标。长期保持一贯稳定，那个形象就会成为你的标签。人们会以为你是可信赖、可依赖、能保守秘密、并具有领导潜质的人。因此，请你做到始终如一，你的好名声就会树立起来。当然最好方式：第一次就做对，可能以后就再也无需改变。
  merge: -1
  img_proc: true
- pgno: 229
  md: 第四，请克服惯性。因为惯性能麻痹你生活的各个层面，不仅仅是那些无谓的例行公事，还包括重要的事情，如生活中的快乐等级和生活的意义。打破惯例循环并不需要英雄般极大的意志力。你只需简单的自律即可。打破惯性需要持续的跟踪，否则很少有人能实现积极、永久的改变。除非他们知道某个人在监控他们是否在做自己承诺要做的事情，并在每天，每周或每月底汇报，否则大多数人都会陷于惯性之中。继续做着他们过去一直做的事而不会变得更有效。但是如果她们知道某人一直在观察或评估他们，跟进问询，那么他们更可能改变。
  merge: -1
  img_proc: true
- pgno: 230
  md: '# 有才华但不讨人喜欢的员工，怎么管？'
  merge: -1
  img_proc: true
- pgno: 231
  md: '在你的团队中，有位下属平时表现普通，还时不时嫌工作无聊；奇怪的是，遇到重要任务时，他不仅可以如期完成，品质也好，让领导为了如何用他而头疼。


    三国也有这么一位人物，同时被推荐给曹操、刘备、孙权，那就是与诸葛亮齐名「伏龙凤雏」的凤雏先生庞统。


    孙权的爱将周瑜死后，谋士鲁肃向孙权举荐庞统。孙权问庞统，「你的才智和周瑜相比，如何？」庞统笑着回，「我毕生所学，和他大不相同。」庞统言中有轻视周瑜的意思，让孙权听了很不是滋味，没有将他纳人麾下。'
