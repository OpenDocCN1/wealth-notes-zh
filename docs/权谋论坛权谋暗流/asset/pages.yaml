- pgno: 359
  md: '们知道自己的时间价值、每小时应得的薪资，以及能够穿针引线、创造进展的重大领域。除此之外，他们只会着重发挥上述功能。他们使用杠杆效果、外包工作、委任、拒绝或删除其他不重要的工作。他们不见得聪明过人或者天赋异禀，只是更清楚时间和优先性的价值。


