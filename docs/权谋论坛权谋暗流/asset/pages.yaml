- pgno: 391
  md: '# 怎么「宏观阐述」？


    除了「导引思考」之外，若要进一步提升人才的层次，主管还要养成「宏观阐述」的习惯。


    「宏观阐述」就是：


    在讨论过程中，当牵引出一个观念或者是方法时，主管应凭借其丰富的经验及较高较广的视野，将与此观念、方法的相关的案例与应用，逐一提示；并借此将此观念、方法的应用原则与执行关键，做延伸性的补充说明。


    「宏观阐述」这个做法，就是在拉大员工思考的广度与高度，使员工不会一直陷于自己相对狭隘的职掌范畴内思考，而会养成范畴外思'
  merge: -1
  img_proc: true
- pgno: 392
  md: 考的习惯，撑大、撑高格局，使能成为将才的潜力人选。同时，这样的动作也是一个机会，去启动主管本身对相关事务的连结习惯，增加自己连结的强度，对自我应用能力，以及联想广度的能力，都有很大的帮助。由上述的说明可以发现，不论是「导引思考」或是「宏观阐述」，都是在日常的工作指导与问题解决的过程中进行，这也是最适切也最有效的人才培养时机。因此，一个好的主管必须改变自己的习惯，平常就投注心力于员工的「导引思考、宏观阐述」，而非只注重把事情执行出来就好了；假以时日，强兵强将的部门战力自然就能展
