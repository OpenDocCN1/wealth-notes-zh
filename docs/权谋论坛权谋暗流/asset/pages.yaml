- pgno: 17
  md: '“道常无为而无不为”，看似无为，其实是无所不为，举重若轻，气定神闲，大有周瑜“雄姿英发，羽扇纶巾，谈笑间，强虏灰飞烟灭”潇洒倜傥的风度。


    隋朝末年，隋炀帝杨广十分残暴，各地农民起义军风起云涌，许多官员也纷纷倒戈，同时杨广对驻守晋阳的李渊疑心很重，李渊得知后，他一方面悉心结纳当地的英雄豪杰，积蓄实力，准备起事。另一方面，他故意广纳贿赂，败坏自己的名声，沉迷于声色犬马之中，而且大肆张扬。隋炀帝听到这些，果然放松了对他'
  merge: -1
  img_proc: true
- pgno: 18
  md: '的警惕。


    明朝名臣张居正也是在不动声色中，暗中结纳人缘，积蓄力量登上相位的。


    在中国历史上，还有一个著名的“无为而无不为”而称霸的历史人物，他就是楚庄王。春秋时期的楚庄王“三年不鸣，一鸣惊人”，“三年不飞，一飞冲天”，他先隐忍不发，甚至采取自污以掩人耳目的做法，通过数年的暗中观察探索，他弄清了朝中大臣的真实想法和性格才具，同时也锻炼了自己，为以后成就霸业奠定了基础。'
