    # 傻瓜和外行才看房价租售比


    童大焕—2019 年 9 月 23 日星期一


    +   1


    买房为什么不要看租售比？为什么傻瓜和外行才看租售比和房价收入比？被房价租售比耽误的误区在哪里？为什么只有在同一城市不同区位选择时才偶尔参考租售比？


    为什么？先看结论：


    我 2010 年出版的《买房的革命》一书即告诉大家：**不要信租售比，大城市房价由外来人口决定，小城市房价由回乡人口决定**。九年过去了，信租售比的没房价，信我的房价增长
    N 倍了！【以 2010 年以来小城市房价涨一倍，大城市房价涨两倍即原来的 3 倍算，加上两倍杠杆，小城市已是 6 倍财富（10 万首付买 30 万房子现在是
    2 倍价即 60 万），大城市则至少已是 9 倍财富（10 万首付买 30 万房子现在是 3 倍价即 90 万）。当年还可以 2 成首付即 10 万首付买
    50 万房子现在值 150 万）。】


    有人说潘石屹就被租售比所害，错过了中国房地产最好的十年。有一定道理。SOHO 中国成也张欣败也张欣，拿着一线城市最好的土地，被外国的租售比观念限制，不敢开发住宅地产。


    +   2


    为什么投资中国内地房地产，不应该看租售比和房价收入比？


    因为当代中国的城市化进程是非常扭曲的，跟正常城市化国家和地区不一样，我们自然也不能用正常城市化国家和地区的尺子来衡量我们的房价，否则就会南辕北辙。'
  - '[PAGE 81]


    **1949** 以来，由于严厉的户籍限制加上粮食计划供应、大小三线建设、知青下乡、乡镇企业和小城镇建设、西部大开发等一系列逆城市化举动，原本应该大河奔流的正常城市化运动，遭遇了一道道三峡大坝一样的人为拦挡。这种状况，直到
    **1997** 年政府土地储备制度建立、**1998** 年城市住房私有化开启，市场的光芒才真正逐渐融化计划的坚冰，当代中国的城市化才算真正重启。


    在一个世界上人口最多的国度里，被“筑坝蓄水”拦截长达 **50** 年之久的当代中国城市化浪潮，自然裹挟着巨大的势能，一泄千里，浩浩荡荡。也因此，正常国家
    **80** 到 **100** 年完成的城市化历程，当代中国将用三四十年时间完成。


    换句话说：本来过去 **50** 年就有条件有意愿进城的人及其后代，现在全在一二十年同一古脑儿地进来了！他们的购买力不由城市原住民决定。


    同样，大量人口短时间内蜂涌进城或出国打工，拿着大把的钞票回乡购房置业，故乡的房价对他们而言是“降维打击”。


    这就是我十年前即做出“大城市房价由外来人口决定，小城市房价由回乡人口决定”这一重要判断的原因。


    而大量经济学家和经济、社会评论人士，没有从人的剧烈流动角度出发，用的是静态的目光和思维去分析，自然牛头不对马嘴、


    # 3


    有人说，之所以不看租售比，是因为“收获中国房产红利主要靠房产升值，而不是靠租金。租金相对于优质房产的增值算是九牛一毛。”“优质房产成长性好，现在房价上涨快于租金反映了房产未来的价值。未来房价相对稳定后，租金和收入都会跟上来的。此外，在中国房子还有其他许多附加值，这些附加值租金体现不出来。”


    这样的判断好像对，但也不对。为什么？


    对事物做判断，一定要有极清晰的边界。如果模糊中带过，往往会差之毫厘，谬以千里。


    房价未来会不会升值、租金会不会上来，都还是未知数。


    而租售比和房价收入比，首先判断的是当下的房价合不合理，如果不合理，未来房价是不会升值而会贬值的！


    “中国人的收入太多元化了，有很多隐性收入，再加上数据的不透明，用一个有问题的数据去推导本来就是不合理的。”


    这个判断，有一定道理。但占比很小，毕竟，多数人是没有多元收入的。'
  md: "\n## 未来会出现越来越多不好卖的房子\n\n1. 未来会出现越来越多不好卖的房子，这篇文章可以给那类房子指出一条相当普通的重要生路。当然，越早运用机会越多效果越好。\n\
    \n2. 知识星球网友提问：童老师，您好。“国内人口长期流出地的资产更应优化”，按您这个原则，三四线城市的自住全款房，合适利率的情况下，抵押贷款贷出来资金用来购买优质房产，可行吗？谢谢您。\n\
    \n    答：这是一个好问题。可行！我曾经想设计一个产品：有一些地方的房子很难卖出去了，和银行合作，抵押贷款出来做首付，再到更好的城市按揭买一个更优质资产。这样可以用优质资产全部覆盖掉劣质资产的风险。但是现在银行不自由，无法实现同一银行的闭环操作。但是个体可以适当做。\n\
    \n3. 对这个问题，做一简单推演和说明：\n\n    假定某三四线城市房子，市场价值 100 万元，但是由于过剩或其它原因，或者因为老人等原因不舍得卖、祖传资产不宜卖，在月供许可情况下，贷出\
    \ 60 万元作为首付，在更好的城市优质地段，购买总价 120 万元住宅一套。这就实现了非优质资产的资本化即我所说的“灵魂出壳”过程。\n\n    未来，即使三四线城市房价不涨、下跌，或者这\
    \ 100 万元资产有价无市，成为沉淀资本，“灵魂出壳”变出来的 120 万元优质城市优质地段优质房产，经过五年、十年，变成了 240 万、360 万元资产，虽然初始\
    \ 120 万元都来自贷款，但多出来的 120 万、240 万就是实实在在在自己的资产了！\n\n4. 现实中，类似的操作法是有的。曾有人买了环京住宅，兴高采烈精装修，配置了很好的家具家电，以为自己会常去度假，或者老人去常住养老。\n\
    \n    后来才发现那只是想像。于是只好卖掉。买方开出的价格比毛坏买入价还低！卖方说，我精装修了呢，家具家电都多少钱了呢。中介说，人家哪里在乎什么家具家电精装修，人家买这个房子，根本就没想要，只是一个金融工具而已！\n\
    \n    原来，买方是低价买入，但银行评估价比买入价高很多，这样，即使贷出几成，也比买入总价还高，这样，不仅不要花钱买这个房子，还从银行贷出了多余资金。\n\
    \n    比如：买入价 40 万，评估价 100 万，7 成按揭，贷出 70 万。手里剩余资金 30 万！\n\n5. 所以，独立产权房是个非常好的金融工具。一定要注意和运用好它的金融属性。\n\
    \n    一定要购买能够直接和银行发生金融关系的独立的产权房，排除小产权房、农民房、没有独立产权的军方房央产权房等。\n\n    问：深圳小产权房和农民房值得投资吗？这种在老师看来是不是算没有灵魂的资产？\n\
    \n    答：不能资本化、不能“灵魂出壳”的资产，当然都算没有灵魂的资产。直接和农民一对一发生买卖关系的农民房更不能投资，当前法律一点都不保护这种交易。小产权房比农民房好一点，但是也不能资本化，同时也还存在拆除等风险。\n\
    \n    而且，随着小产权房也会和大市场一样水涨船高地涨价【不一定能涨过商品房】，它的总价越来越高，能够接受它的人就会越来越少。意味着越来越不好卖，同时又不能通过和银行发生金融关系进行资本化，基本上就只剩出租这个用途了。相当于大笔资金被套死。\n\
    \n    而用同样的钱购买商品房，还可以按揭，把资产做大。未来涨价了，孩子出国读书等等，要用钱时，只需抵押贷款就行了。自由得很。\n\n    所以，小产权房比同地段商品房便宜很多，远远不仅仅是没有土地出让金的问题，更为根本的是没有金融属性的问题。\n\
    \n6. 问：想调仓。洛阳的房子，应该卖了换郑州，还是抵押贷款出来，首付买郑州？\n\n    答：这个是一个非常简单的算账，能全部调的当然全部调。如果家中有老人舍不得，那就不妨采用抵押贷款方式。【完】\n\
    \n## 不怕产业空心化 只怕人口空心化\n\n童大焕—2019 年 9 月 19 日星期四\n\n1. 知识星球会员匿名提问：《哪些城市，最须警惕“产业空心化”？名单令人吃惊》（作者刘晓博），童老师，你对产业空心化这个问题怎样看？\n\
    \n    答：城市的本质在于人口，不要怕产业空心化，怕的是人口空心化。感觉作者不太理解现代服务业和非物质生产为何物。\n\n2. 原作者列了一个图表：\n\
    \n| 城市 | 2018 年第二产业 GDP 占比 | 2008 年占比 | 占比增减 |\n| :--- | :--- | :--- | :--- |\n\
    | ... | ... | ... | ... |\n\n    给了一个定义：\n\n    所谓“产业空心化”，主要是指“以制造业为中心的第二产业”在国民经济中占比偏低。一般认为，当第三产业占比超过\
    \ 60%的时候，就存在产业空心化的可能。\n\n    以中国目前的发展阶段，当一个城市第二产业占比低于 40% 的时候，就要引起关注。如果低于 35%，则基本上可以认为出现了“产业空心化”。\n\
    \n    作了一个结论：最应该警惕“产业空心化”的内陆大城市至少有 8 个，依次是：广州、上海、杭州、西安、济南、南京、天津、青岛。\n\n3. 仔细看图表，会发现作者立论的基础是，把全国第二产业\
    \ GDP 40.7% 占比视为合理范畴，低于这个占比的城市，被作者列入“产业空心化”城市。\n\n    这个标准对吗？不对！\n\n    比如一座纯旅游城市，什么第二产业都没有，你能说它产业空心化？\n\
    \n    北京二产 GDP 占比最低，却没有被作者列入“产业空心化”范围，也没有给出理由，看似乎有“两重标准”。\n\n    一个很大的时代背景是，中国的工业化占比是过高的！过高的占比，并不健康。根据北大教授周其仁先生的说法，是“工业化超前，城市化滞后”：\n\
    \n    用世界银行的数据，2010 年全球平均城市化率为 50.9%，而工业化率（约等于第二产业的 GDP 占比）不过 26.1%。而中国的两率的比值是\
    \ 1.09（即城市化率 / 工业化率 = 51.3% / 46.8%）。全球的平均比值是多少呢？1.95（50.9% / 26.1%）。中国的工业化率相对全球平均水平高出了近一倍。\n\
    \n    与发达国家的区别就更为显著了。2010 年，美国的城市化率 / 工业化率为 4.1，即城市化率高达工业化率的 4.1 倍。同年同一比值，法国为\
    \ 4.11，英国为 4.09，德国为 2.64，日本为 2.48，共同呈现出城市化率远高于工业化率的特征。即便是“金砖五国”中的巴西、俄罗斯、南非和印度，城市化率除以工业化率的比值也分别达到\
    \ 3.22、1.97、1.38 和 1.15，都比中国的高。\n\n    所以，把第二产业 GDP 40% 定义为健康，低于 40% 定义为“产业空心化”，打造的标准和尺子就是错的。\n\
    \n    正确的应该是多少？不同时期不同的比重，越进步发达比重越低。\n\n4. 越发达的国家和地区，第一、第二产业占比越低：\n\n    中国香港，第一、第二产业占\
    \ GDP 的比重加起来也不到 10%，第三产业占比超过了 90%。\n\n    澳大利亚人的工作图景，原始资料来自澳大利亚国家议会发布的报告（2016\
    \ 至 2017 年），上面列明了各个行业的从业人数：\n\n    - 【农业与矿业】：农林渔业 32.4 万人，矿业 21.6 万人，只占总就业人口的约\
    \ 4.3%。\n    - 【制造业】：88.5 万，占总就业人口的 7.1%。近 20 年来，澳大利亚完成了去工业化，原来丰田日产福特都在此有汽车厂，澳国自己还有一个自主汽车品牌，现已全部关门。如今制造业主要是加工本地农矿产品，本国需要的工业品如手机电脑汽车等，全靠进口。\n\
    \    - 【服务业】：所有发达国家都有个特征，服务业产值占 GDP 的比重非常高。比如澳大利亚，服务业占 GDP 的 80%多，雇佣人数占 80%。\n\
    \n    美国：2018 年，美国制造业实现产值 2.33 万亿美元，占 GDP 的 11.6%。农业只占 1.2%。\n\n5. 中国是发展中国家，第二产业\
    \ GDP 占比，比上述发达国家和地区高出一倍，也只需要百分之二十几就够了！\n\n    人类社会漫长的历史进程中，一开始是第一产业占绝对比重，然后是第一产业占比降低，二产上来；再然后是第二产业占比也降低，三产上来。\n\
    \n    这是一个层次极分明的经济增长、财富增长、文明进步的过程。\n\n    这个过程，第一，第二产业的物质生产，绝对值总是在增长的，只是相对值在下降。\n\
    \n    一如美国农业，只占其 GDP 1.2%左右，但丝毫不影响它是世界第一大农业国和农产品出口大国地位。\n\n6. 人们谈“产业空心化”，其实是醉翁之意不在酒，在乎就业，认为第二产业占比低了，就业就成问题了。\n\
    \n    但事实上，随着机器换人、人工智能时代的到来，即使城市第二产业占比上升，可能也会出现人口下降！\n\n    绝大多数人口，归根结底是要进入第三产业就业的。\n\
    \n7. 当下中国的主要问题，不在第一第二产业占比必将逐年降低，而在第三产业能否上来。主要瓶颈在于：\n\n    高端、生产性、非物质生产为主的服务业领域，如银行、保险、法律、咨询管理、广告和会计、科技创新、微笑曲线两端的研发和营销领域、文学电影电视艺术创造，等等，尤其是金融和法律服务，往往需要以自由和法治为前提。\n\
    \n    而生活类的“低端服务业”，则需要给予城市和乡村更多的路边摊、农家乐、民宿等等自由，不能以整齐划一的标准，去限制民间的活力。\n\n8. 其实我们根本不必害怕什么产业空心化，真正要注意的衡量指标是，一些城市，第二产业绝对值和相对值都在迅速减少，却没有第三产业补上来。\n\
    \n    它意味着，这类城市正迅速走向衰退的命远。\n\n    这类城市有哪些，单从上述图表，信息还不够。至少还需要第二产业绝对值增减的信息。\n\n\
    9. 当下中国的问题恰恰在于，过度强调工业制造业的重要性，哪怕它已经严重过剩；过度贬抑房地产业和第三产业，哪怕它们存在区域性结构性的严重缺口。\n\n  \
    \  我们应该光明正大地发展房地产业和服务业，光明正大地补城市化滞后于工业化的课。\n\n    当然，多数人口流出城市房地产也已经过剩，但一些人口长期流入的大城市，房地产却要像香港一样长期补课。\n\
    \n    同时，还要补两个结构性方面的课：一是大城市高端房地产不应该再限购限贷，非如此，富人的购买力就被锁住，或者流出国外，或者冷冻休眠，不能“货币如流水一样自由流淌，灌溉沃野千里，造福百姓大众”；二是城市居民到农村购买农房和宅基地的法律窗口一直未打开，严重阻碍财富和文明回流乡村，阻碍乡村优秀传统民居的保护与利用。【完】\n\
    \n## 风格纯粹 惹省怎么了？\n\n风格纯粹—2019年9月20日星期五\n\n在新浪微博，我一直批评惹省，一直鼓励惹省的年轻人走出去，说这个省份未来没有希望。对惹省很多年轻人而言：这注定是衰落的故乡。为此，得罪了好多惹省的人，长期以来，在我的新浪微博，一直受到惹省人的攻击，漫骂。在新浪微博，我拉黑的粉丝惹省最多。我开通了知识星球，才惊讶的发现，我在惹省竟然也有这么多铁粉。应他们的要求，我想把我对惹省的思考写下来。\n\
    \n在我跟重大焕老师写云端对话的时候，我写下了《除了傲然的帝都，整个北方大地必将陷入萧条》，整个北方区域，我在云端对话所有的文字，基本上都献给了帝都。我写下了，京津冀不可能一体化，那里没有城市群。帝都跟整个北方的省份在经济上互动并不大。帝都跟长三角，珠三角密切互动，这就是环京贫困带存在的原因。为此，我用文字特地写了京杭大运河的文章，指出：帝都在过去为了跟富庶的江南经济上互动，不惜耗费巨大的人力物力，开挖了运河。帝都傲然的存在，无视他脚下的北方大地。\n\
    \n今天，京沪高铁成为中国最赚钱的线路，甚至因为运力饱和，国家有了建设京沪二线的计划，应该在这两年就会开工建设。这说明了帝都与江南经济上的密切联系。很多人都知道，中国沿海省份存在的双城记的故事，比如广东的深圳\
    \ VS 广州，福建的厦门 VS 福州，等等，整个中国存在着一个更大的双城记，那就是京沪。这个现象的出现本质上是权力 VS 市场。\n\n我先交代这个整体的背景，然后再进一步谈葱省。\n\
    \n葱省人口在一个亿左右，名副其实的人口大省，GDP 长期排名前三名，也属于典型的沿海省份，港口优良，海岸线很长，青岛甚至提出了成为北方的深圳，葱省人民一直不服气，为何我如此不看好呢？\n\
    \n先从网上的一个段子谈起：网上有一句话，葱省人民有 10% 是葱省离不开的，有 90% 是葱省离不开葱省的。我认为这个段子说出了真相。有人说，葱省受儒家文化影响太深，我不认为是文化问题。就儒家文化影响而言，江南影响更大，看看明清两朝多少状元诞生在江南就知道，江南是一个远比葱省更热爱读书的省份。多少大儒诞生在江南而不是葱省就是最好的例证。所以，受儒家文化所谓的影响，完全是葱省人民在文化上的碰瓷行为。\n\
    \n那么到底是什么原因呢？首先葱省有一个全国都没有的牛逼产业，那就是做官。这个产业全国没有任何一个省份可以跟葱省竞争。也是无数葱省傻逼引以傲，挂在嘴上的：大约三分之一的中央委员都来自葱省。可见葱省的做官产业之牛逼。\n\
    \n做官产业这么牛逼导致了什么呢？导致了葱省几乎全部的资源集中到这个产业集中。从今天的高考，葱省人民高喊的葱省高考最难，到葱省人民热衷于考公务员，进入体制，再到各个地区的官员完全是为做官而不计代价，几乎所有的社会资源都因做官这个产业链而消耗集中。从计划生育执行最彻底到因政治性要求而不计代价，导致葱省至今可以说计划经济的成分最大，市场的空间被无限压缩。我看葱省的金企也大都靠做国企，围绕着权力运转。这就是葱省人民面临的真相：GDP\
    \ 全国长期排在前三名，老百姓的收入排在 15 名之后，就是因为以做官为主导牛逼产业，导致了社会资源的集中和消耗。做官这个碾压式的牛逼产业，几乎让葱省的市场空间被压缩到极致，在这个开放的年代。\n\
    \n葱省人民以可怜的全国排名 15 名后的收入，因为做官这个产业存在的社会引导，导致葱省人民的生活不能靠规则，而是靠人际关系，所以，葱省人民的社会成本是极高的。我做过调查，大约葱省人民收入的\
    \ 20% 左右是用于人际关系的维护，这是极高的社会运行成本。网上有个段子说葱省人民：每年过年的时候，你会发现你去年春节送出的礼物，一定离你家不到 5 公里的路上。这个段子生动说明了葱省人民巨大的人际交往成本。\n\
    \n所以，葱省人民存在的这个牛逼的做官产业链，不仅仅导致了整个社会经济运行完全依赖于权力配置，还引导了老百姓把可怜的收入用在了巨大的人际交往上，因为做官产业链的存在，就没有真正的民企，也没有真正的自由的民众。规则不可能诞生，市场不会发育成熟。从官家而言，资源必须服从权力。从人民而言，你的私人财产必须拿出一部分用于维护人情。所以，你就理解了葱省人民，进入体制，热衷于考公务员了。因为体制外的空间，也就是市场被压缩到近乎窒息。\n\
    \n所以，不要嘲笑葱省人民，在一个权力主导资源配置的地方，人们看重的肯定不是金钱，而是权力。你也就理解了葱省人民如此热衷进入体制了。你也就理解了进入不了体制，研究生毕业到事业单位做临时工，每个月拿\
    \ 2000 块工资了。你也就理解了他们为什么爱面子了，因为一个因权力，靠人际关系维持的社会运转的社会，必然在乎身份。身份就是权力的影子啊。\n\n葱省这样的一个因做官产业链引导的社会，导致了财富巨大的消耗而不是创造，这就是葱省人民作为一个\
    \ GDP 全国排名第三，人民收入跟中西部看齐的原因。\n\n这种权力主导的运转省份，接近计划经济运转的模式，导致了产业必然雷同，必然黑大粗。这也是葱省各个城市均衡的真相。你看葱省除了青岛，别的城市经济规模都差距不大。在葱省生活，各个城市人民感觉没多少差别的真相。葱省可以说是最均衡发展的省份。就是这个缘般权力主导的模式。\n\
    \n可是，这样因权力高度聚集的财富模式，必然不能惠及百姓，相反，还让老百姓有了沉重的负担。这就回到了以前的那个问题：葱省离不开的 10% 的人民，开始逃离了，这就是这两年随着高铁的发展，交通的便利，葱省开始与广东，江苏经济数据拉开越来越大的真相了。也是所谓的葱省书记喊出了向南方学习，新旧动能转型之类的口号的原因。葱省作为\
    \ GDP 排名前三的大省，在财政收入上，已经逐渐跟浙江接近。而他们的 GDP 差距 2 万亿啊。可见葱省产业之落后。这也是这些年葱省经济增速下滑的原因。\n\
    \n济南作为一个 GDP 大省的省会，GDP 竟然不如江苏的南通一个地级市，2018 年勉强排在全国 18 名左右，为了加强省会首位度，去年急吼吼合并了莱芜，很多离不开葱省的那\
    \ 90%的人，开始打鸡血了，认为济南必然有前途，所以，这两年房子也炒了一把。这样的模式怎么可能？咱姑且不论济南这个城市在经济地理上的局限，一个东西长近 100\
    \ 公里，南北宽 12 公里的油条般得城市。\n\n目前的京沪高铁只是从济南经过，然后影响到了葱省的西部的，这条高铁的出现，已经让葱省的西部地区塌陷了。规划中的京沪二号线是从葱省东部经过，这条高铁的出现，必然会让葱省的东部地区快速人口流出。所以，我以前在微博上，呼吁葱省的年轻人，密切关注这条京沪二线。包括美丽的海滨城市青岛，也会成为大连一样的存在。\n\
    \n我的知识星球的群友留下了这样的一个疑问：我在南方，是什么原因导致了这样一个令人惋惜的葱省？\n\n我的答案很清楚：这个庞大的做官产业链的存在，消耗了巨大的资源，无限压缩了市场存在的空间。导致葱省离不开的那\
    \ 10% 的聪明人快速离开。\n\n这个产业链能改变吗？不能！葱省有未来吗？没有！\n\n嗯，这就是葱省的真相。一个令人惋惜的葱省。从经济地理的位置，如此优越。我最热爱的美丽的海滨城市青岛。这一切的都将成为我们永久的梦里的故乡，一个令人惋惜的葱省。\n\
    \n## 傻瓜和外行才看房价租售比\n\n童大焕—2019 年 9 月 23 日星期一\n\n1. 买房为什么不要看租售比？为什么傻瓜和外行才看租售比和房价收入比？被房价租售比耽误的误区在哪里？为什么只有在同一城市不同区位选择时才偶尔参考租售比？\n\
    \n    为什么？先看结论：\n\n    我 2010 年出版的《买房的革命》一书即告诉大家：**不要信租售比，大城市房价由外来人口决定，小城市房价由回乡人口决定**。九年过去了，信租售比的没房价，信我的房价增长\
    \ N 倍了！【以 2010 年以来小城市房价涨一倍，大城市房价涨两倍即原来的 3 倍算，加上两倍杠杆，小城市已是 6 倍财富（10 万首付买 30 万房子现在是\
    \ 2 倍价即 60 万），大城市则至少已是 9 倍财富（10 万首付买 30 万房子现在是 3 倍价即 90 万）。当年还可以 2 成首付即 10 万首付买\
    \ 50 万房子现在值 150 万）。】\n\n    有人说潘石屹就被租售比所害，错过了中国房地产最好的十年。有一定道理。SOHO 中国成也张欣败也张欣，拿着一线城市最好的土地，被外国的租售比观念限制，不敢开发住宅地产。\n\
    \n2. 为什么投资中国内地房地产，不应该看租售比和房价收入比？\n\n    因为当代中国的城市化进程是非常扭曲的，跟正常城市化国家和地区不一样，我们自然也不能用正常城市化国家和地区的尺子来衡量我们的房价，否则就会南辕北辙。\n\
    \n    **1949** 以来，由于严厉的户籍限制加上粮食计划供应、大小三线建设、知青下乡、乡镇企业和小城镇建设、西部大开发等一系列逆城市化举动，原本应该大河奔流的正常城市化运动，遭遇了一道道三峡大坝一样的人为拦挡。这种状况，直到\
    \ **1997** 年政府土地储备制度建立、**1998** 年城市住房私有化开启，市场的光芒才真正逐渐融化计划的坚冰，当代中国的城市化才算真正重启。\n\
    \n    在一个世界上人口最多的国度里，被“筑坝蓄水”拦截长达 **50** 年之久的当代中国城市化浪潮，自然裹挟着巨大的势能，一泄千里，浩浩荡荡。也因此，正常国家\
    \ **80** 到 **100** 年完成的城市化历程，当代中国将用三四十年时间完成。\n\n    换句话说：本来过去 **50** 年就有条件有意愿进城的人及其后代，现在全在一二十年同一古脑儿地进来了！他们的购买力不由城市原住民决定。\n\
    \n    同样，大量人口短时间内蜂涌进城或出国打工，拿着大把的钞票回乡购房置业，故乡的房价对他们而言是“降维打击”。\n\n    这就是我十年前即做出“大城市房价由外来人口决定，小城市房价由回乡人口决定”这一重要判断的原因。\n\
    \n    而大量经济学家和经济、社会评论人士，没有从人的剧烈流动角度出发，用的是静态的目光和思维去分析，自然牛头不对马嘴、\n\n3. 有人说，之所以不看租售比，是因为“收获中国房产红利主要靠房产升值，而不是靠租金。租金相对于优质房产的增值算是九牛一毛。”“优质房产成长性好，现在房价上涨快于租金反映了房产未来的价值。未来房价相对稳定后，租金和收入都会跟上来的。此外，在中国房子还有其他许多附加值，这些附加值租金体现不出来。”\n\
    \n    这样的判断好像对，但也不对。为什么？\n\n    对事物做判断，一定要有极清晰的边界。如果模糊中带过，往往会差之毫厘，谬以千里。\n\n  \
    \  房价未来会不会升值、租金会不会上来，都还是未知数。\n\n    而租售比和房价收入比，首先判断的是当下的房价合不合理，如果不合理，未来房价是不会升值而会贬值的！\n\
    \n    “中国人的收入太多元化了，有很多隐性收入，再加上数据的不透明，用一个有问题的数据去推导本来就是不合理的。”\n\n    这个判断，有一定道理。但占比很小，毕竟，多数人是没有多元收入的。\n"
  mdcn: "\n## 未来会出现越来越多不好卖的房子\n\n1. 未来会出现越来越多不好卖的房子，这篇文章可以给那类房子指出一条相当普通的重要生路。当然，越早运用机会越多效果越好。\n\
    \n2. 知识星球网友提问：童老师，您好。“国内人口长期流出地的资产更应优化”，按您这个原则，三四线城市的自住全款房，合适利率的情况下，抵押贷款贷出来资金用来购买优质房产，可行吗？谢谢您。\n\
    \n    答：这是一个好问题。可行！我曾经想设计一个产品：有一些地方的房子很难卖出去了，和银行合作，抵押贷款出来做首付，再到更好的城市按揭买一个更优质资产。这样可以用优质资产全部覆盖掉劣质资产的风险。但是现在银行不自由，无法实现同一银行的闭环操作。但是个体可以适当做。\n\
    \n3. 对这个问题，做一简单推演和说明：\n\n    假定某三四线城市房子，市场价值 100 万元，但是由于过剩或其它原因，或者因为老人等原因不舍得卖、祖传资产不宜卖，在月供许可情况下，贷出\
    \ 60 万元作为首付，在更好的城市优质地段，购买总价 120 万元住宅一套。这就实现了非优质资产的资本化即我所说的“灵魂出壳”过程。\n\n    未来，即使三四线城市房价不涨、下跌，或者这\
    \ 100 万元资产有价无市，成为沉淀资本，“灵魂出壳”变出来的 120 万元优质城市优质地段优质房产，经过五年、十年，变成了 240 万、360 万元资产，虽然初始\
    \ 120 万元都来自贷款，但多出来的 120 万、240 万就是实实在在在自己的资产了！\n\n4. 现实中，类似的操作法是有的。曾有人买了环京住宅，兴高采烈精装修，配置了很好的家具家电，以为自己会常去度假，或者老人去常住养老。\n\
    \n    后来才发现那只是想像。于是只好卖掉。买方开出的价格比毛坏买入价还低！卖方说，我精装修了呢，家具家电都多少钱了呢。中介说，人家哪里在乎什么家具家电精装修，人家买这个房子，根本就没想要，只是一个金融工具而已！\n\
    \n    原来，买方是低价买入，但银行评估价比买入价高很多，这样，即使贷出几成，也比买入总价还高，这样，不仅不要花钱买这个房子，还从银行贷出了多余资金。\n\
    \n    比如：买入价 40 万，评估价 100 万，7 成按揭，贷出 70 万。手里剩余资金 30 万！\n\n5. 所以，独立产权房是个非常好的金融工具。一定要注意和运用好它的金融属性。\n\
    \n    一定要购买能够直接和银行发生金融关系的独立的产权房，排除小产权房、农民房、没有独立产权的军方房央产权房等。\n\n    问：深圳小产权房和农民房值得投资吗？这种在老师看来是不是算没有灵魂的资产？\n\
    \n    答：不能资本化、不能“灵魂出壳”的资产，当然都算没有灵魂的资产。直接和农民一对一发生买卖关系的农民房更不能投资，当前法律一点都不保护这种交易。小产权房比农民房好一点，但是也不能资本化，同时也还存在拆除等风险。\n\
    \n    而且，随着小产权房也会和大市场一样水涨船高地涨价【不一定能涨过商品房】，它的总价越来越高，能够接受它的人就会越来越少。意味着越来越不好卖，同时又不能通过和银行发生金融关系进行资本化，基本上就只剩出租这个用途了。相当于大笔资金被套死。\n\
    \n    而用同样的钱购买商品房，还可以按揭，把资产做大。未来涨价了，孩子出国读书等等，要用钱时，只需抵押贷款就行了。自由得很。\n\n    所以，小产权房比同地段商品房便宜很多，远远不仅仅是没有土地出让金的问题，更为根本的是没有金融属性的问题。\n\
    \n6. 问：想调仓。洛阳的房子，应该卖了换郑州，还是抵押贷款出来，首付买郑州？\n\n    答：这个是一个非常简单的算账，能全部调的当然全部调。如果家中有老人舍不得，那就不妨采用抵押贷款方式。【完】\n\
    \n## 不怕产业空心化 只怕人口空心化\n\n童大焕—2019 年 9 月 19 日星期四\n\n1. 知识星球会员匿名提问：《哪些城市，最须警惕“产业空心化”？名单令人吃惊》（作者刘晓博），童老师，你对产业空心化这个问题怎样看？\n\
    \n    答：城市的本质在于人口，不要怕产业空心化，怕的是人口空心化。感觉作者不太理解现代服务业和非物质生产为何物。\n\n2. 原作者列了一个图表：\n\
    \n| 城市 | 2018 年第二产业 GDP 占比 | 2008 年占比 | 占比增减 |\n| :--- | :--- | :--- | :--- |\n\
    | ... | ... | ... | ... |\n\n    给了一个定义：\n\n    所谓“产业空心化”，主要是指“以制造业为中心的第二产业”在国民经济中占比偏低。一般认为，当第三产业占比超过\
    \ 60%的时候，就存在产业空心化的可能。\n\n    以中国目前的发展阶段，当一个城市第二产业占比低于 40% 的时候，就要引起关注。如果低于 35%，则基本上可以认为出现了“产业空心化”。\n\
    \n    作了一个结论：最应该警惕“产业空心化”的内陆大城市至少有 8 个，依次是：广州、上海、杭州、西安、济南、南京、天津、青岛。\n\n3. 仔细看图表，会发现作者立论的基础是，把全国第二产业\
    \ GDP 40.7% 占比视为合理范畴，低于这个占比的城市，被作者列入“产业空心化”城市。\n\n    这个标准对吗？不对！\n\n    比如一座纯旅游城市，什么第二产业都没有，你能说它产业空心化？\n\
    \n    北京二产 GDP 占比最低，却没有被作者列入“产业空心化”范围，也没有给出理由，看似乎有“两重标准”。\n\n    一个很大的时代背景是，中国的工业化占比是过高的！过高的占比，并不健康。根据北大教授周其仁先生的说法，是“工业化超前，城市化滞后”：\n\
    \n    用世界银行的数据，2010 年全球平均城市化率为 50.9%，而工业化率（约等于第二产业的 GDP 占比）不过 26.1%。而中国的两率的比值是\
    \ 1.09（即城市化率 / 工业化率 = 51.3% / 46.8%）。全球的平均比值是多少呢？1.95（50.9% / 26.1%）。中国的工业化率相对全球平均水平高出了近一倍。\n\
    \n    与发达国家的区别就更为显著了。2010 年，美国的城市化率 / 工业化率为 4.1，即城市化率高达工业化率的 4.1 倍。同年同一比值，法国为\
    \ 4.11，英国为 4.09，德国为 2.64，日本为 2.48，共同呈现出城市化率远高于工业化率的特征。即便是“金砖五国”中的巴西、俄罗斯、南非和印度，城市化率除以工业化率的比值也分别达到\
    \ 3.22、1.97、1.38 和 1.15，都比中国的高。\n\n    所以，把第二产业 GDP 40% 定义为健康，低于 40% 定义为“产业空心化”，打造的标准和尺子就是错的。\n\
    \n    正确的应该是多少？不同时期不同的比重，越进步发达比重越低。\n\n4. 越发达的国家和地区，第一、第二产业占比越低：\n\n    中国香港，第一、第二产业占\
    \ GDP 的比重加起来也不到 10%，第三产业占比超过了 90%。\n\n    澳大利亚人的工作图景，原始资料来自澳大利亚国家议会发布的报告（2016\
    \ 至 2017 年），上面列明了各个行业的从业人数：\n\n    - 【农业与矿业】：农林渔业 32.4 万人，矿业 21.6 万人，只占总就业人口的约\
    \ 4.3%。\n    - 【制造业】：88.5 万，占总就业人口的 7.1%。近 20 年来，澳大利亚完成了去工业化，原来丰田日产福特都在此有汽车厂，澳国自己还有一个自主汽车品牌，现已全部关门。如今制造业主要是加工本地农矿产品，本国需要的工业品如手机电脑汽车等，全靠进口。\n\
    \    - 【服务业】：所有发达国家都有个特征，服务业产值占 GDP 的比重非常高。比如澳大利亚，服务业占 GDP 的 80%多，雇佣人数占 80%。\n\
    \n    美国：2018 年，美国制造业实现产值 2.33 万亿美元，占 GDP 的 11.6%。农业只占 1.2%。\n\n5. 中国是发展中国家，第二产业\
    \ GDP 占比，比上述发达国家和地区高出一倍，也只需要百分之二十几就够了！\n\n    人类社会漫长的历史进程中，一开始是第一产业占绝对比重，然后是第一产业占比降低，二产上来；再然后是第二产业占比也降低，三产上来。\n\
    \n    这是一个层次极分明的经济增长、财富增长、文明进步的过程。\n\n    这个过程，第一，第二产业的物质生产，绝对值总是在增长的，只是相对值在下降。\n\
    \n    一如美国农业，只占其 GDP 1.2%左右，但丝毫不影响它是世界第一大农业国和农产品出口大国地位。\n\n6. 人们谈“产业空心化”，其实是醉翁之意不在酒，在乎就业，认为第二产业占比低了，就业就成问题了。\n\
    \n    但事实上，随着机器换人、人工智能时代的到来，即使城市第二产业占比上升，可能也会出现人口下降！\n\n    绝大多数人口，归根结底是要进入第三产业就业的。\n\
    \n7. 当下中国的主要问题，不在第一第二产业占比必将逐年降低，而在第三产业能否上来。主要瓶颈在于：\n\n    高端、生产性、非物质生产为主的服务业领域，如银行、保险、法律、咨询管理、广告和会计、科技创新、微笑曲线两端的研发和营销领域、文学电影电视艺术创造，等等，尤其是金融和法律服务，往往需要以自由和法治为前提。\n\
    \n    而生活类的“低端服务业”，则需要给予城市和乡村更多的路边摊、农家乐、民宿等等自由，不能以整齐划一的标准，去限制民间的活力。\n\n8. 其实我们根本不必害怕什么产业空心化，真正要注意的衡量指标是，一些城市，第二产业绝对值和相对值都在迅速减少，却没有第三产业补上来。\n\
    \n    它意味着，这类城市正迅速走向衰退的命远。\n\n    这类城市有哪些，单从上述图表，信息还不够。至少还需要第二产业绝对值增减的信息。\n\n\
    9. 当下中国的问题恰恰在于，过度强调工业制造业的重要性，哪怕它已经严重过剩；过度贬抑房地产业和第三产业，哪怕它们存在区域性结构性的严重缺口。\n\n  \
    \  我们应该光明正大地发展房地产业和服务业，光明正大地补城市化滞后于工业化的课。\n\n    当然，多数人口流出城市房地产也已经过剩，但一些人口长期流入的大城市，房地产却要像香港一样长期补课。\n\
    \n    同时，还要补两个结构性方面的课：一是大城市高端房地产不应该再限购限贷，非如此，富人的购买力就被锁住，或者流出国外，或者冷冻休眠，不能“货币如流水一样自由流淌，灌溉沃野千里，造福百姓大众”；二是城市居民到农村购买农房和宅基地的法律窗口一直未打开，严重阻碍财富和文明回流乡村，阻碍乡村优秀传统民居的保护与利用。【完】\n\
    \n## 风格纯粹 惹省怎么了？\n\n风格纯粹—2019年9月20日星期五\n\n在新浪微博，我一直批评惹省，一直鼓励惹省的年轻人走出去，说这个省份未来没有希望。对惹省很多年轻人而言：这注定是衰落的故乡。为此，得罪了好多惹省的人，长期以来，在我的新浪微博，一直受到惹省人的攻击，漫骂。在新浪微博，我拉黑的粉丝惹省最多。我开通了知识星球，才惊讶的发现，我在惹省竟然也有这么多铁粉。应他们的要求，我想把我对惹省的思考写下来。\n\
    \n在我跟重大焕老师写云端对话的时候，我写下了《除了傲然的帝都，整个北方大地必将陷入萧条》，整个北方区域，我在云端对话所有的文字，基本上都献给了帝都。我写下了，京津冀不可能一体化，那里没有城市群。帝都跟整个北方的省份在经济上互动并不大。帝都跟长三角，珠三角密切互动，这就是环京贫困带存在的原因。为此，我用文字特地写了京杭大运河的文章，指出：帝都在过去为了跟富庶的江南经济上互动，不惜耗费巨大的人力物力，开挖了运河。帝都傲然的存在，无视他脚下的北方大地。\n\
    \n今天，京沪高铁成为中国最赚钱的线路，甚至因为运力饱和，国家有了建设京沪二线的计划，应该在这两年就会开工建设。这说明了帝都与江南经济上的密切联系。很多人都知道，中国沿海省份存在的双城记的故事，比如广东的深圳\
    \ VS 广州，福建的厦门 VS 福州，等等，整个中国存在着一个更大的双城记，那就是京沪。这个现象的出现本质上是权力 VS 市场。\n\n我先交代这个整体的背景，然后再进一步谈葱省。\n\
    \n葱省人口在一个亿左右，名副其实的人口大省，GDP 长期排名前三名，也属于典型的沿海省份，港口优良，海岸线很长，青岛甚至提出了成为北方的深圳，葱省人民一直不服气，为何我如此不看好呢？\n\
    \n先从网上的一个段子谈起：网上有一句话，葱省人民有 10% 是葱省离不开的，有 90% 是葱省离不开葱省的。我认为这个段子说出了真相。有人说，葱省受儒家文化影响太深，我不认为是文化问题。就儒家文化影响而言，江南影响更大，看看明清两朝多少状元诞生在江南就知道，江南是一个远比葱省更热爱读书的省份。多少大儒诞生在江南而不是葱省就是最好的例证。所以，受儒家文化所谓的影响，完全是葱省人民在文化上的碰瓷行为。\n\
    \n那么到底是什么原因呢？首先葱省有一个全国都没有的牛逼产业，那就是做官。这个产业全国没有任何一个省份可以跟葱省竞争。也是无数葱省傻逼引以傲，挂在嘴上的：大约三分之一的中央委员都来自葱省。可见葱省的做官产业之牛逼。\n\
    \n做官产业这么牛逼导致了什么呢？导致了葱省几乎全部的资源集中到这个产业集中。从今天的高考，葱省人民高喊的葱省高考最难，到葱省人民热衷于考公务员，进入体制，再到各个地区的官员完全是为做官而不计代价，几乎所有的社会资源都因做官这个产业链而消耗集中。从计划生育执行最彻底到因政治性要求而不计代价，导致葱省至今可以说计划经济的成分最大，市场的空间被无限压缩。我看葱省的金企也大都靠做国企，围绕着权力运转。这就是葱省人民面临的真相：GDP\
    \ 全国长期排在前三名，老百姓的收入排在 15 名之后，就是因为以做官为主导牛逼产业，导致了社会资源的集中和消耗。做官这个碾压式的牛逼产业，几乎让葱省的市场空间被压缩到极致，在这个开放的年代。\n\
    \n葱省人民以可怜的全国排名 15 名后的收入，因为做官这个产业存在的社会引导，导致葱省人民的生活不能靠规则，而是靠人际关系，所以，葱省人民的社会成本是极高的。我做过调查，大约葱省人民收入的\
    \ 20% 左右是用于人际关系的维护，这是极高的社会运行成本。网上有个段子说葱省人民：每年过年的时候，你会发现你去年春节送出的礼物，一定离你家不到 5 公里的路上。这个段子生动说明了葱省人民巨大的人际交往成本。\n\
    \n所以，葱省人民存在的这个牛逼的做官产业链，不仅仅导致了整个社会经济运行完全依赖于权力配置，还引导了老百姓把可怜的收入用在了巨大的人际交往上，因为做官产业链的存在，就没有真正的民企，也没有真正的自由的民众。规则不可能诞生，市场不会发育成熟。从官家而言，资源必须服从权力。从人民而言，你的私人财产必须拿出一部分用于维护人情。所以，你就理解了葱省人民，进入体制，热衷于考公务员了。因为体制外的空间，也就是市场被压缩到近乎窒息。\n\
    \n所以，不要嘲笑葱省人民，在一个权力主导资源配置的地方，人们看重的肯定不是金钱，而是权力。你也就理解了葱省人民如此热衷进入体制了。你也就理解了进入不了体制，研究生毕业到事业单位做临时工，每个月拿\
    \ 2000 块工资了。你也就理解了他们为什么爱面子了，因为一个因权力，靠人际关系维持的社会运转的社会，必然在乎身份。身份就是权力的影子啊。\n\n葱省这样的一个因做官产业链引导的社会，导致了财富巨大的消耗而不是创造，这就是葱省人民作为一个\
    \ GDP 全国排名第三，人民收入跟中西部看齐的原因。\n\n这种权力主导的运转省份，接近计划经济运转的模式，导致了产业必然雷同，必然黑大粗。这也是葱省各个城市均衡的真相。你看葱省除了青岛，别的城市经济规模都差距不大。在葱省生活，各个城市人民感觉没多少差别的真相。葱省可以说是最均衡发展的省份。就是这个缘般权力主导的模式。\n\
    \n可是，这样因权力高度聚集的财富模式，必然不能惠及百姓，相反，还让老百姓有了沉重的负担。这就回到了以前的那个问题：葱省离不开的 10% 的人民，开始逃离了，这就是这两年随着高铁的发展，交通的便利，葱省开始与广东，江苏经济数据拉开越来越大的真相了。也是所谓的葱省书记喊出了向南方学习，新旧动能转型之类的口号的原因。葱省作为\
    \ GDP 排名前三的大省，在财政收入上，已经逐渐跟浙江接近。而他们的 GDP 差距 2 万亿啊。可见葱省产业之落后。这也是这些年葱省经济增速下滑的原因。\n\
    \n济南作为一个 GDP 大省的省会，GDP 竟然不如江苏的南通一个地级市，2018 年勉强排在全国 18 名左右，为了加强省会首位度，去年急吼吼合并了莱芜，很多离不开葱省的那\
    \ 90%的人，开始打鸡血了，认为济南必然有前途，所以，这两年房子也炒了一把。这样的模式怎么可能？咱姑且不论济南这个城市在经济地理上的局限，一个东西长近 100\
    \ 公里，南北宽 12 公里的油条般得城市。\n\n目前的京沪高铁只是从济南经过，然后影响到了葱省的西部的，这条高铁的出现，已经让葱省的西部地区塌陷了。规划中的京沪二号线是从葱省东部经过，这条高铁的出现，必然会让葱省的东部地区快速人口流出。所以，我以前在微博上，呼吁葱省的年轻人，密切关注这条京沪二线。包括美丽的海滨城市青岛，也会成为大连一样的存在。\n\
    \n我的知识星球的群友留下了这样的一个疑问：我在南方，是什么原因导致了这样一个令人惋惜的葱省？\n\n我的答案很清楚：这个庞大的做官产业链的存在，消耗了巨大的资源，无限压缩了市场存在的空间。导致葱省离不开的那\
    \ 10% 的聪明人快速离开。\n\n这个产业链能改变吗？不能！葱省有未来吗？没有！\n\n嗯，这就是葱省的真相。一个令人惋惜的葱省。从经济地理的位置，如此优越。我最热爱的美丽的海滨城市青岛。这一切的都将成为我们永久的梦里的故乡，一个令人惋惜的葱省。\n\
    \n## 傻瓜和外行才看房价租售比\n\n童大焕—2019 年 9 月 23 日星期一\n\n1. 买房为什么不要看租售比？为什么傻瓜和外行才看租售比和房价收入比？被房价租售比耽误的误区在哪里？为什么只有在同一城市不同区位选择时才偶尔参考租售比？\n\
    \n    为什么？先看结论：\n\n    我 2010 年出版的《买房的革命》一书即告诉大家：**不要信租售比，大城市房价由外来人口决定，小城市房价由回乡人口决定**。九年过去了，信租售比的没房价，信我的房价增长\
    \ N 倍了！【以 2010 年以来小城市房价涨一倍，大城市房价涨两倍即原来的 3 倍算，加上两倍杠杆，小城市已是 6 倍财富（10 万首付买 30 万房子现在是\
    \ 2 倍价即 60 万），大城市则至少已是 9 倍财富（10 万首付买 30 万房子现在是 3 倍价即 90 万）。当年还可以 2 成首付即 10 万首付买\
    \ 50 万房子现在值 150 万）。】\n\n    有人说潘石屹就被租售比所害，错过了中国房地产最好的十年。有一定道理。SOHO 中国成也张欣败也张欣，拿着一线城市最好的土地，被外国的租售比观念限制，不敢开发住宅地产。\n\
    \n2. 为什么投资中国内地房地产，不应该看租售比和房价收入比？\n\n    因为当代中国的城市化进程是非常扭曲的，跟正常城市化国家和地区不一样，我们自然也不能用正常城市化国家和地区的尺子来衡量我们的房价，否则就会南辕北辙。\n\
    \n    **1949** 以来，由于严厉的户籍限制加上粮食计划供应、大小三线建设、知青下乡、乡镇企业和小城镇建设、西部大开发等一系列逆城市化举动，原本应该大河奔流的正常城市化运动，遭遇了一道道三峡大坝一样的人为拦挡。这种状况，直到\
    \ **1997** 年政府土地储备制度建立、**1998** 年城市住房私有化开启，市场的光芒才真正逐渐融化计划的坚冰，当代中国的城市化才算真正重启。\n\
    \n    在一个世界上人口最多的国度里，被“筑坝蓄水”拦截长达 **50** 年之久的当代中国城市化浪潮，自然裹挟着巨大的势能，一泄千里，浩浩荡荡。也因此，正常国家\
    \ **80** 到 **100** 年完成的城市化历程，当代中国将用三四十年时间完成。\n\n    换句话说：本来过去 **50** 年就有条件有意愿进城的人及其后代，现在全在一二十年同一古脑儿地进来了！他们的购买力不由城市原住民决定。\n\
    \n    同样，大量人口短时间内蜂涌进城或出国打工，拿着大把的钞票回乡购房置业，故乡的房价对他们而言是“降维打击”。\n\n    这就是我十年前即做出“大城市房价由外来人口决定，小城市房价由回乡人口决定”这一重要判断的原因。\n\
    \n    而大量经济学家和经济、社会评论人士，没有从人的剧烈流动角度出发，用的是静态的目光和思维去分析，自然牛头不对马嘴、\n\n3. 有人说，之所以不看租售比，是因为“收获中国房产红利主要靠房产升值，而不是靠租金。租金相对于优质房产的增值算是九牛一毛。”“优质房产成长性好，现在房价上涨快于租金反映了房产未来的价值。未来房价相对稳定后，租金和收入都会跟上来的。此外，在中国房子还有其他许多附加值，这些附加值租金体现不出来。”\n\
    \n    这样的判断好像对，但也不对。为什么？\n\n    对事物做判断，一定要有极清晰的边界。如果模糊中带过，往往会差之毫厘，谬以千里。\n\n  \
    \  房价未来会不会升值、租金会不会上来，都还是未知数。\n\n    而租售比和房价收入比，首先判断的是当下的房价合不合理，如果不合理，未来房价是不会升值而会贬值的！\n\
    \n    “中国人的收入太多元化了，有很多隐性收入，再加上数据的不透明，用一个有问题的数据去推导本来就是不合理的。”\n\n    这个判断，有一定道理。但占比很小，毕竟，多数人是没有多元收入的。\n"
