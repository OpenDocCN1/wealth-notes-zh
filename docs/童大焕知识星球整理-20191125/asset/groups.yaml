    # # 理解六座城 理解财富与文明

    **童大焕—2019 年 8 月 16 日**


    **1**


    2014 年麦肯锡评出全球 6 个枢纽城市，纽约、伦敦、中国香港、东京、新加坡、迪拜。


    根据 2015 年《全球金融中心指数》（GFCI）报告，香港紧跟伦敦、纽约位列第三，依然是亚洲第一金融中心，新加坡紧随其后，亚太金融双雄间差距逐渐缩小，上海则跌出二十。


    **2018 年 3 月第 23 期“全球金融中心指数”全球前 20 大金融中心排名依次为伦敦、纽约、香港、新加坡、东京、上海、多伦多、旧金山、悉尼、波士顿、北京、墨尔本、蒙特利尔、芝加哥、温哥华、苏黎世、洛杉矶、深圳、迪拜、法兰克福。**


    1991 年的迪拜，还是一片沙漠，20 年后就成为一个具有世界影响力的大都市。原因何在？'
