    去。”此外还有一些人，在城里赚再多钱，也没想过要在城里买房，而是

    心念念要回家盖房。


    2


    我们的社会舆论，从头到脚，每一根毛孔、每一个细胞、每一滴血，都充

    满了中产阶层的狂妄、自负、傲慢与偏见。


    掌握舆论话语权的中产阶层或准中产阶层，从自己的切身处境出发，“为

