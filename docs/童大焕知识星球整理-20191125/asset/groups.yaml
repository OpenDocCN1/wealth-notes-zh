    **15** 分钟内大型购物中心、商超，或者在建。


    房龄不要太老，**2000** 年以后的带电梯的房子是首选；通勤时间要在 **30** 分钟-**60** 分钟；产权清晰；自己不住的话，还出租；周边配套要适当完善，地铁，公交，'
