    # 乐观是生命追求中的无量智慧 不是结果收获后的短暂满足


    童大焕—2019 年 10 月 13 日星期日


    # 1


    匿名用户 提问:  坐标上海, 家里有两个孩子, 孩子的教育医疗到处要花钱, 今年我 40 岁了, 有 时候深夜感到恐惧会中年返贫, 会中产返贫, 特别是在竞争激烈的上海市。怎么
    做能防止中年返贫中产返贫？谢谢您！


    提问还带了一个图, 主要内容是——中国返贫重要死亡样本是理财: 土豪死于信 托, 中产死于非标理财, 屌丝死于 P2P……


    答:


    首先, 我想推荐一位真正的伟人——丘吉尔的一句話, 他说: “乐观的人在每个 危机里看到机会, 悲观的人在每个机会里看见危机。”他的经历够丰富, 成就够 卓越,
    话也够份量:


    温斯顿·伦纳德·斯宾塞·丘吉尔（ Winston Leonard Spencer Churchill, 1874 年 11 月 30 日-1965 年 1
    月 24 日), 英国政治家、历史学家、画家、演说家、作家、 记者, 1953 年诺贝尔文学奖获得者、“雅尔塔会议三巨头”之一、20 世纪最重要 的政治领袖之一。1929
    年到 1965 年, 连续 36 年担任英国布里斯托大学校长。 两度出任英国首相（1940 年至 1945 年、1951 年至 1955 年）。领导英国人民赢
    得第二次世界大战。代表作品《第二次世界大战回忆录》《英语民族史》。


    其次, 我想说, 除非有先天性重大疾病, 否则绝大多数孩子医疗花不了多少钱。 至于教育, 钱多有钱多的教育法, 钱少有钱少的教育法, 孩子的成才与成就, 跟
    钱多钱少没有必然关系, 倒是跟家庭教育脱不了干系。而乐观的家庭和家长, 更 容易培养积极乐观的孩子。


    第三, 倒是天天恐惧中年返贫中产返贫的人, 真的容易返贫。不担忧不恐惧, 积 极乐观地做好当下、过好每一天、每天进步一点点的人, 容易不断超越自己, 不 断进阶,
    反而不容易返贫。


