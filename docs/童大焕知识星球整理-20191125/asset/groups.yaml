    ## 以人为尺度破除 “发展很快” 幻觉


    **童大焕** 2019 年 9 月 1 日 星期日


    1. 知识星球星友提问：童老师：洛阳近二、三年发展很快，地铁、高架、基础设施改造提升，旅游等投入巨大，市区环境也开始变的美起来了！从这三年的房价涨幅很大就能看出，人们开始用钱投票，今年
    6 月洛阳新房全国涨幅第一，7 月二手房全国涨幅第一。请问童老师，洛阳值得投资吗？


    答：严重建议，建立以人为尺度的评价标准，破除 “发展很快” 的幻觉！过去十年二十年，大部分城市都 “发展很快”，过去三年，大部分中小城市房价上涨都很快，但多数是短期资金现象。房地产最终一定是人口现象，人们用脚投票，有人的地方、人口数量不断增加至少不减少的地方才有房地产二手市场。


    很多人可能对上述回答无法理解，我愿意专开一文谈谈此事。


    2. 为什么要 “建立以人为尺度的评价标准”，才能 “破除 ‘发展很快’ 的幻觉”？


    因为城市化的根本，就是人的城市化，就是越来越多的人怀着各自不同的目标、各自不同的梦想，集聚到城市生产生活。


    离开了人，城市无从谈起。


    99%以上的当下中国人，在思考城市化、观察城市未来变迁的时候，眼里是没有人的，他们只看到投资、高楼，看到大兴土木、大建楼堂馆所，看到基础设施建设热火朝天。


    眼里只有 “规划，投资，建设” 而没有 “人”，是一种一叶障目不见森林的视角，后果可能会非常严重：把一座正在衰退的城市，看成了蓬勃发展的城市，重金投入其中的房产项目，导致未来投资严重亏损。


    3. 眼里紧紧盯住人，就会 “大道至简” 想一想这座城市的未来会不会吸引人进来，吸引什么样的人进来。只有人口不断流入的城市，才会有房产投资的未来。


    孤立地看，几乎每一座城市都在大兴土木，基础设施建设都在不断完善，一派欣欣向荣的样子。


    但是，一旦建立了“以人为尺度的评判标准”，就不再孤立地看自己关心或所处的那一两座城市，而是看到山外青山楼外楼，外面还有很多更好的城市，在吸引人们用脚投资。在这个过程中，马太效应是越来越强的，世界越来越陡峭，人们会不断地向人口更多、就业机会更多、营商环境更好的城市迁移。


    4. 尤其在过去 20 年里，我们看到的是大部分城市都是在大兴土木、城市面积大扩张的同时，人口却在不断地流失。而在各个区域内部，则是呈现“全县人口整体减少、县城人口相对增多”的现象。加上货币化棚改、涨价去房地产库存等一系列原因，很多小城镇都出现房价大涨现象。


    但这些都只是短期的资金和货币现象，不可持续，也就是无法长久。


    尤其是我一再提醒，很多人口流出的地区，未来会出现“规划越大陷阱越多”、“投资越大衰退越快”的局面。


    也就是说，很多人今天看到的“发展很快”，恰恰正在为这座城市未来“衰退很快”埋下伏笔和地雷。


    原因有二：一是投资越大，负债越多，未来各种发展受掣肘越多，生存条件恶化越严重；二是规划扩张越大，人口和各种要素资源越分散，运营成本越高，城市效率越低。


    5. 除了城市更新改造、基础设施建设和城市规划扩张让我们有一种“发展很快”的幻觉，一些传统的工业型、物流型【高铁站、机场、码头等】城市，高歌猛进的 GDP
    数字也会给我们一种“发展很快”甚至发展势头远超于其它城市的幻觉！


    但只要“以人为尺度”，再来审视一个城市的未来，就会发现，很多 GDP 高歌猛进的城市，人口也在悄悄地减少，或者人口增量在减少甚至停滞。这样的城市，从城市化的角度来说，前途一样是不明朗甚至不乐观的。


    这是因为，我们这个时代，正处在工农业向服务业转型、物质生产为主流向非物质生产为主流转型、劳动密集型向资金技术智力密集型转型的崭新时代，在机器换人、人工智能背景下，很多工业型、物流型城市，GDP
    在上升，人口却有可能在减少，导致房屋需求也在减少。


    6. “以人为尺度”，而不是“以规划，投资，建设为尺度”，我们才能看到真实的城市化未来图景，才能正确地通过投资城市房产，投资我们美好的未来。【完】


    ## 苏锡深泉 文化不能当饭 人口才是王牌


    1. 投资最重要的价值，是看到转变，看到未来。从辉煌与高光中看到衰退，从寂寞与阡珊中看到崛起。技术一转身，可能就是人类整整一个旧时代的过去，一个新时代的开。


    2. 2019年8月18日，我正在杭州回北京准备起飞的航班上，有苏州朋友微信我说：“城市化最大的热点和黑马是苏州，期待看到您的讨论。”


    我说：“不能这么说，苏州还是工业时代的产物，未来还要看。”


    他同时发了很多数据和图表给我，有长三角打造世界级机场群的规划消息，长三角常住人口规模及增量的图表，长三角城市群GDP及增速表，长三角高铁路线图，等。苏州表现都很好，未来规划前景也很不错。


    他说：“苏州的人文、地理、环境和历史积淀无与伦比，仅仅差的是政治地位和交通，而这两点正在急剧改变中。我认为，目前的苏州是房地产最具升值潜力和空间的城市，没有之一。”


    3. 我第二天才全面回答这位朋友，微信写道：


    先说结论：苏州的房地产还有升值空间，这个没有疑问。但是不是全国范围内升值空间最大？肯定不是，“没有之一”更是个人情感代替事实判断。


    苏州和东莞是大陆工业时代最受益的两座城市，但也就是工业时代的产物而已。随着服务贸易时代到来，在马太效应背景下，它们能在多大程度上依然能够占领先机，要打个问号。尤其是，全球范围内，商品贸易在迅速递减，服务贸易在迅速递增。


    还有一个背景，就是机器换人和人工智能正在替代和部分替代流水线上的工人，导致GDP在上升而人口则可能会下降。而城市的本质是人口集聚，没有人口尤其是高收入人口，GDP再高房价也高不上去。泉州GDP福建第一，房价只排第四。


    都是制造业，东莞的零散加工细密配合，和苏州的品牌工业为主，又是两种业态，这两种业态，哪一种更经受得起冲击，还得看。现在时代剧变，一个行业无形之中消灭另一个行业，往往只在几年之间。平时根本不知道谁是对手。


    人文、地理、环境和历史积淀在现代城市发展中都无足轻重，新加坡和迪拜就是典型，人口不多，地域窄小，历史短暂，短短几十年成为世界级金融中心和枢纽城市。


    4. 我是在 **2016 年 8 月 17 日**《为什么工业新城高铁新城航空新城通都要歇菜？》（学员独家，保密）一文中首次比较系统地论述传统工业和交通新城可能衰退的。


    **2018 年 3 月 21 日**《工业新城产业新城的滑铁卢战役已经打响》（学员独家，保密）则把更多的篇幅留给了苏州。


    我不敢保证我的判断 100%一定正确。但投资，是在认知范围内，尽可能规避模糊的、有风险的地带，尽可能进入确定性比较高的地带。


    5. 城市的兴衰一直在发生，一个大的技术进步，就是一批批旧时代城市的死亡，又一批新时代城市的新生。


    而总趋势是：城市人口规模和聚集度越来越高，城市数量越来越少。


    **2019 年 8 月 31 日**，电视播出，山西晋城有很多历史悠久的古村落，现已成为空壳村落，古老的建筑一片衰败。


    如今，大部分“历史文化名城”，只剩下辉煌的名头记着它往日的荣光，古老的街巷，大多只成了旅游景点，甚至人迹罕至。


    所谓的“历史”、“文化”在百姓衣食住行的“就业”面前，其实什么也不是，大多数时候不过是遗老遗少的悠远回忆。


    历史、文化可以漫长，动辄百年千年，但人生很短暂，不过几十上百年。如果历史、文化不能让人生活得更好，人们要历史、文化干什么？


    所以我们看见的新加坡、迪拜、香港、上海浦东等等，都是没有历史文化背景的新兴崛起。


    6. 人生最大的不平等是出生地的不平等。有的出生之所，片瓦寸土贵如千金；有的落草之地，大漠黄沙荒凉一片。


    人，只有不断地迁徙，不断地背离故土、面向远方，不断地变化前进的方向，不断地往高处走，不断走向新兴繁华之地，才会有诗，才能不断过上更美好的生活。


    7. 恒大研究院任泽平团队的《中国人口大迁移：2019》（2019-08-28 16:26 任泽平微博）似乎在部分验证我对苏州无锡宁波东莞泉州等工业时代名城的判断。报告说：


    从分线城市看，人口流动整体放缓，但向一二线城市和大都市圈聚集更为明显，中西部核心城市崛起。在全域层面，一线、二线城市人口持续流入，三线城市人口略微流出，四线城市人口显著持续流出但近年有所回流。但与一般三四线城市明显不同，发达城市群的四五线城市人口仍稍有流入。2018年，一线、二线、三线、四线城市经济-人口比值分别为2.3、1.6、1.0、0.6。从重点城市看，近年深圳、广州、杭州常住人口大幅增长，长沙、西安、成都、郑州、武汉、重庆等中西部核心城市日益崛起，北京、上海、天津、苏州、无锡等东部城市人口增长明显放缓。


    8. 城市发展符合万有引力定律，能级越大的城市吸引力越强。


    交通越发达，出行越便捷，越有利于低能级城市、旧的城市类型人口“人往高处走”向高能级、新型城市去消费、就业和迁徙。能级低的城市，以及单纯的、纯粹的交通节点型城市和区域（高铁站、港口、机场等）将衰落得越快。


    交通发达之前，我们一两百公里长途客车要八九个小时，遇到天气不好，十多个小时也是常事。有人说：以前到省城上学坐长途车，少说也得坐12小时，无论如何都得在中途的一个县城吃一餐，一路上针对于长途客车的馆子也很多，生意很火爆。现在通了高速，路上时间也就三小时，两头吃住，想必以前的很多馆子早就改行了！


    同样的，半小时京津高铁开通以后，不是北京人到房价低的天津就业和生活的更多了，而是天津人往北京消费、就业、迁徙的更多了！


    9. 在城市化规律面前，一座城市的行政级别、政治地位也是无关紧要的。大量中西部和东北省会城市，房产投资价值不如北京的一个建制镇——河北省廊坊市三河市下属的燕郊镇。【完】


    ## 猪肉很贵 目标式社会治理模式更贵


    **章大焕** 2019年9月6日 星期五


    1. 楼下超市卖熟食的一对老夫妇说卖不起猪头肉了，要改卖牛头肉了。注意，是卖不起，不是买不起。嗯，猪肉是贵，但运动式、今天一个目标、明天另一个目标的目标式治理更贵呀！


    自然资源部9月5日发文，允许生猪养殖用地使用一般耕地：


    - 一是，生猪养殖用地作为设施农用地，按农用地管理，无需办理建设用地审批手续。在不占用永久基本农田的前提下，允许生猪养殖用地使用一般耕地，作为养殖用途不需耕地占补平衡。

    - 二是，生猪养殖圈舍、场区内通道及绿化隔离带等生产设施用地，根据养殖规模确定用地规模；增加附属设施用地规模，取消 15 亩上限规定，保障生猪养殖生产的废弃物处理等设施用地需要。

    - 三是，鼓励利用荒山、荒沟、荒丘、荒滩和农村集体建设用地安排生猪养殖生产，鼓励利用原有养殖设施用地进行生猪养殖生产，各地可根据实际情况进一步制定鼓励支持政策。


    看到这个，我不知该哭还是笑，该喜还是悲。


    要猪肉时，发文说可以占用一般耕地；要环保时，可以不要猪肉，拆违一票否决，环保一票否决。都是目标式管理，每次都集中力量完成一个目标，其它的“次要目标”被暂时抛在一旁。很快又发现，其它应有的目标在孤注一掷下受到了严重伤害，突显为“主要目标”，又匆忙掉头转向！所以常常出现顾头不顾尾、顾此失彼、矮秆过正、不断反复折腾的现象。


    2. 四天前，“兽楼处”公号发表《养猪大王的四十年》，真人真事，说的是：


    两个月前，兽爷一位朋友、浙江天田园集团公司董事长葛云明的最后一个猪场——平江万猪场，被彻底关停。关停那天，他哭得稀里哗啦的。


    葛云明是绍兴市生猪产业协会会长，他掌握的生猪在栏数一度达到 16 万头，是绍兴最大的猪场之一。


    但过去四年，他的所有猪场都被陆续关停了【不管环保是不是真正达标，平江万猪场是他做了 25 年、省内生态养殖的样板猪场】。他想复养，但找不着可以复养的土地。他说：“活下来的猪场，基本上山里了。我是绍兴产业协会会长，我掌握的数据，现在绍兴生猪在栏数是
    70 万头，这几年猪场关掉三分之二。我在绍兴当了十二年的生猪产业协会会长。养猪业里还活着的老板，现在都提心吊胆，过一天是一天。”


    3. 再往前，回顾我们近在眼前的目标式治理模式。


    **2019 年 4 月 15 日，“工程地产法律营”公号发表林仁聪文章《大棚房整治，为何倒下一片休闲农庄？》，文章说：**


    这段时间，到处是休闲农庄和其他违规大棚房被拆除的消息，一场轰轰烈烈的整治风暴，横扫全国上下。透过各种媒体和官网，我们发现，除了在农地上违法建设的别墅、变相地产项目、“私家庄园”外，不少原来经营不错、曾经很受欢迎的生态休闲农庄、农家乐和其他农业观光旅游项目也被纷纷拆除，其中不乏昔日地方政府的招商项目、示范推广项目，扶贫项目，被国家和地方旅游管理部门评为
    4、5 星级乡村旅游区（农家乐）。往日热闹非凡，作为城市人周末好去处的休闲农庄，现在一夜之间灰飞烟灭！


    事件缘起于 2018 年 9 月 14 日，农业农村部、自然资源部印发了《关于开展“大棚房”问题专项清理整治行动坚决遏制耕地非农化的方案》【（2018）3
    号文】，要求各地重点清理整治工商资本和城市居民到农村非法占用耕地变相开发房地产和建设住房行为。清理整治范围主要包括以下三类问题：

    （一）在各类农业园区内占用耕地或直接在耕地上违法违规建设非农设施，特别是别墅、休闲度假设施等。

    （二）在农业大棚内违法违规占用耕地建设商品住宅。

    （三）建设农业大棚看护房严重超标准，甚至违法违规改变性质用途，进行住宅类经营性开发。


    4. 2019 年 5 月 15 日，中央党校教授周天勇发文《“一刀切”拆违造成了多大的经济损失？》，他认为，城乡这次“一刀切”因拆除而关停的中小微企业，估计在
    480 万个左右，最少也可能在 260 万个左右，而最多可能高达 710 万个。这次全国“一刀切”和扩大化的拆违运动，总共可能损失了 1160 万到 2000
    万个左右的就业机会。


    5. 城市拆违，市容市貌整治，禁止摆摊，统一店招，很多便利店、老招牌，甚至菜市场被拆除，成本全部由经营者承担。很快街巷萧条，百姓生活不便，幸福指数降低，然后又发文件，鼓励夜经济，鼓励人们利用门口、地下人防设施摆摊设点，刺激消费，还要确保每
    300 户就有一个便利店。


    6. 更要命的问题是，在这个过城中，决策者感到委屈：环保，拆违，市容市貌整顿，哪一样不重要，出发点都是好的，为什么效果会扭曲成这样？


    执行者也委屈，他们在夹缝中，不认认真真不折不扣地执行上级命令，乌纱帽危险；公事公办铁面无私地执行，民生和经济、税收都受到影响。两害相权取其轻，还是乌纱帽要紧。


    被执行者更委屈，不仅委屈，还有可能搭进一辈子积累的财富：明明我的手续都是合法的，都经过了行政许可，为什么昨天可以，今天又不行了？


    7. 撇开法治这个大话题不谈。仅就治理层面，我认为问题出在两个大方面：


    一是很多法律法规跟不上时代发展的要求，于是为了鼓励创新和发展经济，有时候在某些领域网开一面。但是，由于只是临时性鼓励政策，并没有明确的法律准绳，各地执行标准不一，比如此次自然资源部要求“各地可根据实际情况进一步制定鼓励支持政策”，这在政策上也是许可的，但是越到后来，积累的问题越多，就又来个“秋后算账”，一刀扣按“违法”论处。


    二是为了达到治标的目的，上面用目标导向、指标导向，要求令行禁止，短期内非达到目标和效果不可，只问目的，不问手段。


    清华大学教授孙立平先生有个视频，，说的就是个：


    我就来个结果，怎么办，我不管，你自己想办法去。现在你看很多东西就是这一套，维稳是这一套，反正你这地方不能出事，至于怎么不能出事，你自己想办法去。计划生育是这一套，反正孩子不能生下来，至于怎么不能生下来，你自己想办法去。包括日常工作现在都是这一套，我去年年底遇到一个市里的税务局长，他就跟我说，他说孙老师你看我找谁讲理去，他说我们这个地方今年经济增长7%都到不了，市里给我下的硬指标，税收的增长必须得完成20%，怎么去征是你的事，你征得来征不来吧，你征不来你痛快点早说话，你征不来人能征得来，你把这局长让给别人当就行。所以各位呀，我们这些年形成了政府权力的一个运作模式，这是一个极为恶劣的模式，因为它默认甚至鼓励你用破坏规则破坏法律的方式来实现某个目标、指标。我前一段曾经提出一个概念，这个概念我都不太愿意说，太难听，叫“作恶授权”，我允许你破坏规则，违反规则。所以我想什么叫法治，法治首先不是管老百姓的，首先是管政府权力的，你得解决政府权力的运作模式问题。


    8. 你会发现在这种目标式治理模式下，身处其中的每一个人，几乎都没有任何进退的余地和空间，尤其是，老百姓的财富折腾几下就没了，对未来政策和经济的信心折腾几下也心灰意冷了。病来如山倒，病去如抽丝，运动治理易，信心和信任恢复难。


    而只要决策机制没变、考核机制没变，总是一条道走到黑，撞了南墙才回头，然后再去撞北墙。


    9. 怎么破？我提几点建议吧：


    建立建设完善的法治体系，把权力关进必要的笼子里，这当然是治本之策，也是我们上下合力要追求的目标。但这个过程，可能相当漫长。


    退一步，我们可以从三方面入手，做好一些：


    - 一是政府说话算话，做过行政许可的，许可期未过，都不得反悔；实在要反悔，撤销许可，征得被执行人同意，并且给足补偿；如果被执行人不同意，双方达不成共识，非经法院判决政府不得强拆。

    - 完善这样的政府行政程序法，在一定程度上让手段正式走在日的正义之前，以现实更好地保护市场主体权益，更好地约束政府权力。


    10. 从 1978 年改革开放算起，老百姓刚吃饱饭满打满算也就四十年时间，多数人手上还没有多少财富积累，经得起几次折腾？


    一会儿拆违，一会儿许可，来回折腾几次，老百姓好不容易积累的一点资产就被折腾没了，好不容易积累的一点市场信心，三拆两整就没了。


    早在 2500 多年前，老子《道德经》就告诫：治大国若烹小鲜，不能多搅动，多搅则易烂，比喻治大国应当有为有不为，不应当穷折腾，折腾穷。【完】


    ## 没有一个时代可以去房地产化


    **童大焕** 2019 年 9 月 6 日 星期五


    1. 昨天（2019 年 9 月 5 日），“路透财经早报”公号专访中国社科院经济学教授、天风证券首席经济学家刘煜辉，认为中国要重振世界工厂，毛衣战坚定去房地产化，改变现有房地产对其他行业的虹吸效应。


    这其实是一个由来已久的陈词滥调。过去多年，比口水多得多的舆论一直在说，要打压房地产，才能救实体经济。


    2. 不知从何时起，社会舆论形成了把什么问题都归咎于房地产的“政治正确”，实体经济不景气，怪房地产；商业气氛不浓，怪房地产；消费疲软，怪房地产；甚至香江风波，也一古脑儿怪房地产，什么财阀垄断，社会窒息，等等，真正的一叶障目，不见森林。


    3. 先看逻辑。


    很多人都在人云亦云地说，香港的高房价榨干了年轻人的血，导致很多人买不起房。但是，既然这些人买不起房。香港的地产生又用什么手段榨干这些人的血？到底是香港的繁荣创造了中低收入阶层的就业和发展的机会？还是香港靠压榨这些中低收入阶层而获得繁荣？


    中国内地如果不要房地产，百姓衣食住行里独缺失掉一个住，世界就一好百好了？


    4. 再看事实：


    事实一，不论古今中外，房地产都是 80% 以上的人一辈子最大的开支和消费；也是一国从农业时代向工业服务业时代转型中最大的经济增长点——因为告别农

    '
