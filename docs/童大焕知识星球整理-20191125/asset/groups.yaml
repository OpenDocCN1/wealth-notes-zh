    # 【完】


    # 战略失败永远无法通过战术来弥补-为什么要懂城市化？


    童大焕—2019年8月12日


    1


    服务业主导的高密度大城市化，是当今世界最大的人类历史事件。城市化知识大部分人都缺乏，却又与每个人息息相关，你知或者不知，主动或者被动，都将被无一例外地卷入这场人口和财富大流动的时代大潮中。先知先觉者，积极主动提前布局，到未来人口特别是高素质人口大规模流入的地方提前卡住生态位；后知后觉或无知无觉者，或气喘吁吁追赶，或被时代与财富浪潮无情抛下。


    2


    问：“童老师，知道城市好和理解城市化这中间的差距在哪里？”


    答：“城市之间、城市内部都在剧烈分化。理解城市化，才能知道真正的人口和财富流向。在‘好城市’投资失败的举不胜举。”


    问：“理解城市化才能真正知道城市好，为什么好，好在哪里，才能坚定的指导将来的生活。明白了。”


    答：“这个理解非常棒。”


    很多人买房投资也非常勤奋，到处踩盘，各种比较，试图去寻找城市中心在哪里，价格洼地在哪里。但是，然并卵。因为不懂城市化，再好的细节把握、再好的具体战术，都无法弥补战略的失败。比如：造价师认为，房屋的造价就那么一点，房子怎么值那么多钱？于是对高房价退避三舍，一再错失机会。比如，城市规划师得到“内部消息”，帝/都要赶/人二百万，房价肯定降，于是在一年暴涨一倍之前，卖了自己唯一一套房子等待抄底。


    这一切，都是因为不懂城市化。城市化原理，才是房产投资最根本的战略问题。战略错误，是根本性的、方向性的错误，再好的细节和战术把控，都无法挽救战略的失败。


    3


    阿里巴巴的大投资者、软银集团孙正义在演讲中说：“做投资必须宏观看问题。赚钱不难，真的不难，只要你有宏观概念。我告诉大家，我投资的公司，每年的净利润是44%，而且还在不断成长。我更看重宏观，我只是个简单的人物，有一个简单的想法，这就是我简单的想法：投资宏观。做事情简单化，去了解那个追根究底得原理。不要太复杂，太复杂反而赚不到钱。你要投资未来，投资趋势。”


    什么是宏观？


    宏观问题就是战略问题，就是趋势问题，就是未来会怎样发展的问题。'
  - '[PAGE 10]


    宏观问题，战略问题，不是可有可无的问题，而是性命攸关的问题。不懂宏观，就容易在战术中迷失，因小失大；懂得宏观，哪怕不懂战术，也不会有太大的错失；懂得宏观，再懂战术，则是锦上添花。


    # 4


    房地产投资的宏观战略问题是什么？就是城市化，就是城市化是如何发展的，未来会怎样发展，发展变化的原因是什么。


    城市的宏观原理很简单，就是经济规律：节约成本，提高效率。一切都围绕着这个来进行，宏观上永远不会有例外。


    而节约成本和提高效率要有条件，就是两次工业革命：第一次把人从农业中解放出来，进入工业主导的城市化；第二次，互联网、机器换人、人工智能，把人从工业中解放出来，进入服务业主导的城市化。


    那么我们就要考虑，未来，几个大的技术进步会如何影响城市化，如何影响就业和人口聚散？


    这几个大的技术进步是：互联网，物联网，脑联网，人工智能，自动驾驶，轨道交通，等等。


    还有一个大趋势，就是农业和工业的财富占比越来越低，未来是属于互联网和人工智能，属于非物质生产，属于服务贸易领域的。这些最重要的服务贸易领域、非物质生产，会集中到哪里，哪里就是人们的就业和生活中心，哪里就是最重要的城市中心。


    这就是大道至简。


    【完】


    # 怎样正确理解三十公里半径极限


    董大焕—2019 年 8 月 13 日


    # 1


    今天知识星球上有两个读者问到跟我研究的三十公里城市半径极限有关的问题，一个在深圳，一个在上海。


    其一：“距离某某 CBD 约 36 公里，将来开通地铁快线，可以将两地交通时间压缩到 40 分钟。像这种地方，刚好位于您所说的商务中心半径 30 公里，有快速地铁的加持，能否成深圳东部的就业中心呢？”


    答：“能否成为就业中心要看产业导入和集聚程度，以及其交通等条件。否则，半径 30 公里范围内外 的地方可多了。有的也不一定非得是就业中心，房价够低成为睡城也可以。同时，30
    公里左右极限半径是相对于超大城市而言。”'
  - '[PAGE 11]


    其二，单位要搬上海某西部，也在大都市 30 公里范围内。于是去年以孩子名义在某地铁旁 350 米范围买了一个房子，现在感觉好荒凉。问我对该区域的看法。


    我的回答比较简单：“成就一个区域非常漫长，衰落一个区域非常迅疾。我一向主张资产要和工作生活所在地分离。”


    追问：“您的意思是某某会有一个漫长的成长期？”


    答：“成长很慢，谁也不知道它能否长成。”


    # 2 怎样正确理解三十公里半径极限？


    三十公里半径极限的正确意思是：即使是日本东京都这样几千万人口的超级大都市，区域规划要想成功，必须在三十公里左右半径极限之内，超出之外，成功的概率非常之低。三十公里左右的半径极限，是成功的必要条件，不是充分条件，不是三十公里左右半径极限就一定能成功，而是超出半径之外的成功概率极低。


    这才是正确的理解。日本东京都历史上也是搞人口疏散，在三十公里半径左右搞了多摩、港北、千叶等诸多新城，交通、医疗、教育等配套一应俱全，但三十五年过去，并不太成功。而且随着城市“服务业再集聚时代”的到来，很多郊区和新城人口也在继续回流市中心。


    # 3


    有人说这里很像当年的深圳，那里很像当年的浦东。这个“很像”是不靠谱的，曹妃甸、滨海新区和鄂尔多斯，建设和规划时期都“很像”深圳、浦东，甚至更令人激动，但是，龙生九子九子各不同呢；城市发展到不同时期未来路径也不同呢；各个区域的地理位置更不同呢！


    在城市边界基本已经定型、只在少数区域“三十年河东三十年河西”的时代，我一再提醒，信规律不信规划，信市场不信市长，新规划一定要等企业和人口入住六成左右再加入投资行列不迟。宁可少赚点，也要赚稳一点。


    2013 年 9 月，那期间我正在给腾讯写专栏，上海自贸区消息出来，我第一时间建议大家：自贸区有房的，最大一波涨幅来了，快出货；没房没地的，等等，让别人的子弹先飞。（2013
    年 9 月 30 日，腾讯网“发现楼市另一面”专栏《上海自贸区的房产 现在该买还是该卖？》），6 年过去，上海自贸区发展得怎样了？


    2014 年 3 月 19 日，传闻保定要做什么副中心，我用中午半小时写就腾讯大家专栏文章，认为“如果保定成为北京政治中心最后尘埃落定并且付诸实施，最有可能的结果就是成为一个国家部委所属科研机构和大学集中地，类似于一个新的大学城。就像动物园服装批发市场强制迁河北一样，这未必是河北繁荣的开始，更可能是市场衰落的先声。同样，国家部委所属科研机构和大学搬迁保定，也未'
  - '[PAGE 12]


    必是保定繁荣的前兆，而有可能是这些科研机构和大学衰落的先声。”


    4


    君子不立危墙之下，投资尽量避开不确定性。


    投资的第一要义，是安全；其次才是涨幅。追求长期稳定地高于平均速度的上涨，而不是短期暴涨长期横盘甚至一定时期以后有价无市。【完】


    # 150 年历史证明 房产投资风险最低回报最高


    童大焕—2019 年 8 月 15 日


    1


    在所有投资品种中，一般理论认为，高收益往往同时意味着高风险。但是，一份史上最详实的调查研究则证明，在过去长达 150 年时间里，房地产是最安全同时收益最高的保值增值资产。


    Öscar Jorda, Katharina Knoll, Dmitry Kuvshinov, Moritz Schularick and Alan Taylor
    五位学者于 2019 年合作发表在 Quarterly Journal of Economics 上的论文 “The Rate of Return on Everything,
    1870 - 2015” 基于全球 16 个发达经济体横跨 150 年的经济数据，首次测算了包括房地产在内的主要资产的长期回报率。


    作者使用澳大利亚等 16 个国家的股票、房地产、长期国债和短期国库券四种主要资产从 1870 年至 2015 年的资产回报相关数据，不论在覆盖国家的数量上还是历史年代的跨度上均超过了以往同领域的研究。特别是加入现有文献从未使用过的个体房地产数据，提升了全球资本回报率历史数据库的完备程度。


    从回报率和风险性两个维度来看，房地产是全球长期投资中的最佳资产：和短期国库券相比，房地产风险仅升高了 1.7 倍而回报是其 6.9 倍；和股票相比，尽管房地产与股票的回报同为
    7% 左右，但是风险性却为后者的一半。截取两次世界大战的数据后，得到的结论也一致。这与现代金融理论中风险与收益匹配的基本原则相矛盾：房地产是一种低风险高回报的长期资产。为此作者进一步与现有文献结果对比，并对多种可能原因进行充分探讨。例如，稳定且高昂的房租收益是房地产投资者获得高回报的保证。


    最后，作者将财富回报率与 GDP 增长率进行比较。除两次世界大战的 20 年外，真实财富回报率在剩下的 130 年始终远超真实 GDP 增长率；长期财富回报率大约在
    6% 的水平，是 GDP 长期增长率的两倍。GDP 增长率与财富回报率的差距在 16 个任一国家中或是任一时期的结果也是一致的，除战争时期外。因此，作者认为自
    1970 年代以后财富回报率的持续升高，可能对应的是劳动收入回报的持续下降。（《【量化历史研究】谁是百年投资最佳资产？来自全球 16 个富国 150 年资产回报率的证据》（刘莹
    量化历史研究 2019 年 8 月 14 日）'
  - '[PAGE 13]


    资产性收入增值远大于劳动收入，成为财富的主流。这个研究结果，跟法国学者皮克蒂前几年很轰动的《21 世纪的资本论》研究结果高度一致。说明人不理财、财不理你，不会理财，读到博士也可能变穷。


    而在几乎所有的投资品种中，房地产风险最低，收益最高，流动性也非常好。是三者兼具的最佳投资品种。


    +   2

    大焕认为，未来是“服务业再集聚时代”，跟着城市化潮流投资房地产，未来的回报只会更高。因为与以往工农业时代财富相对分散不同，服务业导致的城市再集聚，会加快人口、财富向少数城市集中。


    【但有一点一定要特别特别注意】未来的房产投资，沿着城市化的方向投资正确才能获得比历史上更高的收益。如果逆着城市化的方向，收益是会递减甚至造成净损失的！因为工农业时代是城乡“普涨”，但服务业时代，人口长期流出的地方，房价是会跌跌不休的！


    +   3

    一些人会说，文献采用的是发达国家的数据，发达国家政治经济稳定，产权保护有力。同样的结论，适合发展中国家吗？


    我的答案非常肯定：适用。


    首先，文献数据包含了两次世界大战，战争不改其规律。其次，即使像中国这样的发展中国家，现代金融制度已经完全渗透到社会生活的每一个角落，房地产是最安全稳定的抵押资产，房地产的整体价值和稳定，已经与金融安全与稳定、财政安全与稳定紧密相连，须臾不可分。


    +   4

    但现实中经常会有杂音干扰我们，让我们怀疑是否敢把资产只放在房地产这一个篮子里。


    在我看来，只要持有的是优质城市优质房产，就不必理会因市场和政策因素导致的短期涨跌。而是坚持长期持有，并且在条件许可的情况下，通过增加杠杆、置换到更优质城市、更优质地段等方式方法，不断做强做大资产。


    +   5

    网络上很多危言耸听的文章，其实都是骗小白的标题党。比如这两天，在我的一个购房群里，有人转上来这样一篇文章：《干货|为什么我说深圳房产已无投资价值》（原创：Drake888
    黑鹅鹅 888 ，2019 年 4 月 22 日），文章说：


    在深圳湾，片区单价已经高达 15-20 万。离宇宙最贵的香港中环片区 30-40 万港币相比（折合 24-32 万人民币），潜在涨幅已经相当相当有限。'
  - '[PAGE 14]


    假设 15 万单价买入深圳湾 100 平米 3 房，五年后深圳湾房价超过香港中环，成为全球第一，达到 24 万一平米。那么实际的利润率是多少呢？毛估估：


    +   购房成本

    500 万首付，1000 万贷款

    买入税费 150 万

