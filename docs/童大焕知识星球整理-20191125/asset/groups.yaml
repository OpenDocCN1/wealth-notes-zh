    ## 买房投资要学会纵向比较更要学会横向比较


    童大焕—2019年8月22日星期四


    ### 1


    90%以上的人只会纵向比较，也就是盯着自己出生或工作生活的一两座城市。横向比较是绝大多数人的短板，就是不知道在各城市之间进行比较。或者陷入只认城市不认地段和产品的陷阱而不能自拔。


    匿名用户提问：请问童老师考察过珠海吗？这里房价长期超过很多省会城市，历史涨幅也不错，看了很多公号大 v 对一线二线三线城市的划分，还是没理解这种体量小的沿海城市。


    答：一二三线只是个模糊划分，东部小县城房价超西部、东北省会的，也很多。要关注的是个城市在未来竞争中是相对升势还是相对降势。过去纵向跟自己比，大部分城市是升势；未来跟横向【后记：跟全国其它城市】比，大部分城市是降势。珠海未来，是弱升势。但投资，是选择当下约束条件下的尽可能最优。


    ### 2


    衡量投资正确或失败，并不是说过去投了 100 元，今天变成 150 元就是成功了。而是要比较：


    - 在所有的投资品种中，哪一种是最安全、回报率最高、流动性也好的？现在我们基本可以知道，只有房产。

    - 选定房产之后，我们在同样的约束条件下，是盯着一个城市，还是盯着全国甚至全球？这是视野问题，也牵涉到能否降维打击，进而比别人、比时代跑得更快。

    - 结果的差别自然是巨大的：同样的投入，在故乡，十年可能涨了 1 倍；但是在另一座城市，十年可能涨了 3 倍甚至更多。


    **90%以上的人只会纵向比较，也就是盯着自己出生或工作生活的一两座城市。甚至很多人已经走遍世界，走到哪里都背着故乡原生的那口观念之井，人称新时代的“背井离乡”。**


    这是视野所限，因为看不懂未来城市兴衰的逻辑，看到自己熟悉的地方过去涨得不错，以为将来也会持续同样的逻辑。


    ### 3


    比如下面这个就很可惜，如果过去十年，大部分房产买到更优质的城市，单价更高，面积也不会那么大，资产至少比现在翻一倍不止。须知，**2011 年初之前，全国都还没有限购政策**。


    问：童老师好，我想咨询关于资产配置的问题，谢谢您！坐标云南玉溪，离省会昆明一百多公里，目前均价八-九千。基本情况是：一套本地高端别墅区的 370 平双拼，一个小学附近的住宅小区门口临街商铺
    80 平（每年租金六万元），一套市中心 240 平大复式带车库和车位各一个（小区物业不太好），一套 270 平大复式（无车库车位但小区物业管理很好），一套
    80 平老公房（房龄三十年，无物业），一栋 400 多平城郊自建房（集体土地），以上房产均产权清晰，还有 42 万股本地银行的原始股（上市遥遥无期）。


    请问现阶段我该如何规划资产，达到收益最大化？


    答：事业经营很好，但是资产配置不专业，两大问题：一是全部局限于未来在全国视野下处于弱势的城市；二是户型都偏大。要优化置换，取决于现有资产好不好出手。好卖的先卖，这叫靓女先嫁。


    之所以强调靓女先嫁，是担心上述很多房子到二手并不好卖。所以要好卖的先卖，哪怕有所损失，也要优化置换到更好的地方。越早做决定越好。越早置换，玉溪的损失越小，更优质城市获得的收益越大。


    【还要补充一点，如果42万股本地银行原始股可以转让出手，也可以换成未来人口和财富不断流入的优质城市的房产。】


    ### 4


    横向比较是绝大多数人的短板，就是不知道在各城市之间进行比较。或者陷入只认城市不认地段和产品的陷阱而不能自拔。比如下面这个：


    匿名用户 提问：我在上海市，但是一会儿想着北京市是首都，多好的投资机会，D中Y所在地，权力中心，中国权力是多么重要。一会儿想着深圳，深圳很少的土地供应，而且粤港澳大湾区牛啊。结果自己对长三角反而视而不见，对上海市视而不见，怎么破呢？谢谢了！


    答：精华文章已经专门讨论过，《给自己定一个当下够得着的目标》。限购限贷条件那么多，北上广深你全都有购房资格？再说，城市内部的区域分化、产品分化都超乎想象，能够在有资格的一线城市买到房子，已经是天大的造化，哪里还需要这山望着那山高？


    即使没有一线城市购房资格，随着省会及省会以下城市户籍制度逐渐松动，争夺人才甚至争夺人口成为常态，在优质省会或优质副省会城市，选对地段、买对产品，其投资回报率，未必输一线城市。


    弱水三千，我取一瓢饮。不是把目标定到最高，而是在自己的约束条件下，尽可能做到最好。


    ### 5


    有一点特别要注意：在过去20年里，很多商业较发达、区域相对均衡发展的东南沿海中小城市，在“小城镇房价由回乡人口决定”的逻辑支配下，大中小城市房价涨幅都不低，而且落差不是非常大。也就是说，从纵向比较，投资回报率似乎都不错。


    但是未来，从横向比较，人口进一步集聚的规律是无法改变的，这些东南沿海省份，大中小城市的房价落差也是势必要进一步拉大的。


    ### 6


    刚到星球的星友们一开始可能会有些不适应，因为大部分人只看见过去自己所 在、所关心城市的纵向比较。但我是从 1997 年就开始研究城市化 了，也总结出


    了独家、独到的城市化理论，对各城市之间过去和未来的横向比较已经胸有成竹，不敢说 100%绝对正确，但是 80%、90%已经不成问题。我们看到的世界不是同一个维度的世界，所以需要大家慢慢学习和适应。


    从世界看中国，和从中国看世界，是完全不同的维度；


    从某地看中国，和从中国看某地，也是完全不同的维度。


    我们必须站在“从世界看中国”、“从中国看某地”的维度看城市兴衰，看房价涨跌，才能高层建筑，才能知涨跌，明进退。


    我一直强调“买房就是和时间、空间及政策赛跑”。这个时间、空间，就是纵向和横向比较。纵向，提前一年，可能少奋斗十年；横向，选对城市、区域和产品，一生的收益相差可能不止十倍。【完】


    ## 看城市要横向比较 看人要纵向比较


    童大焕—2019 年 8 月 23 日星期五


    ### 1


    看城市要学会横处甄别，才懂兴替与高下；

    看个体须重视纵向对比，方知起落与沉浮。


    ### 2


    提问：童老师能谈谈广西为什么发展不起来吗，同为南部沿海城市，广东，福建，浙江，都是经济强省，广西却差得很远。


    答：这些东西谈起来非常复杂，而且越细往住越不靠谱。简单来说就是商业文化传统的差别。广东，福建，浙江是中国商业文化最发达的区域。上海也是依托浙江江苏（为纵深）发展起来的。商业文化貌似无形，却有可能成为未来城市兴衰的决定性力量，因为它渗透到每个人的思维和行为习惯中了。未来趋势是马太效应越来越厉害，强者恒强，所以后来者要追赶，非常难。因为人的生命是有限的，总是要及时地到更有机会的地方去发展。


    ### 3


    城市兴衰这个异常宏大的命题，一落到个体，其实非常简单：


    - 这座城市跟“我”有什么关系？能不能解决“我”的就业，或者比“我”原来所在收入更高，生活更舒适便捷，更安全，更有利于孩子的成长，更有利于老人的医疗？

    - 如果这些跟“我”有一星半点的关系，不需要全部满足，只要有一两项条件符合，“我”可能就背井离乡披星戴月地来了。

    - 如果跟“我”一点关系都没有，你就是巨人的花园，建得再美也与“我”无关。


    没有一个个具体的“小我”用脚投票，从四面八方涌来，再美的城市，也是空城鬼城：曹妃甸，滨海新区，鄂尔多斯……


    ### 4


    提问：童老师您好，鄂尔多斯康巴什您来过，也数次回味过您写的文章，感同身受，近几年的感觉和教育、医疗的倾斜，虽然慢，但人口数量还是要比前几年要多，想请教老师，康巴什房价的走势，总感觉不涨也（不）至于跌对不？


    答：在一个迟暮衰退又明显扩张过度、几乎什么像样的商业都做不出来的城市，资产停留一分钟都没有意义。如果在那里工作生活，租房住就可以了。任何侥幸心理都是对自己资产的谋杀。


    ### 5


    #### 为什么这么斩钉截铁？


    因为康巴什面积扩张太大，导致商业无法很好地生存。地方政府为了激活城市，把老城东胜的一些优质教育、医疗资源搬迁到康巴什新城，对东胜的原居民来说，事实上并没有改变就业，却被迫改变了生活圈子，为了迁就孩子教育和老人医疗，生活品质是降低的。所以，很多没有在康巴什买房的人，宁愿每天单程开车二十公里，也愿意选择在东胜和康巴什之间来回奔波。


    而一些在康巴什买了房的人们，暂时会在康巴什居住，但不成气候的商业降低了他们的生活便利和品质，甚至有的小区，两排十几二十栋别墅，只有一两户人家居住，空寂不说，有时连安全都难以保障。


    等孩子中小学毕业，其中一些人还会搬回东胜老城。


    我们在调研中更发现，有的别墅小区，烂尾了，开发商连路都修不起，有的人家，倾其所有买了别墅，别无选择，几户人家合起来，求开发商也出点钱，一起把简易道路给修了，勉强住着。


    有的小区，入住率会比较高。但对这座新城总体而言，有一户人家住，可能另外有3户是空置的。


    ### 6


    对个体的纵向比较，可以清晰地看出这个人和过去相比，就业机会、生活水准是提升了还是降低了。这个纵向比较，将准确地看出“人往高处走”的路径，也准确地揭示一座城市、一个地区的兴衰。


    人的生命很短暂，所以不会等着座城市的兴起，而总是以最快的速度完成其就业和生活地点的切换。这种生命有限性会加剧城市的马太效应——越有活力、就业机会越多、同等职业收入越高、商业越丰富、生活方式越多样的城市，越吸引人。反之，人们则快速逃离那些没有希望的城市和乡村。


    ### 7


    姜十一《他在工厂卧底三个月，观察蓝领用什么 APP》讲了一个故事：


    > 我最早在福建晋江相熟的几个小哥中，有个云南人，20 岁出头黝黑的皮肤，用带着口音的普通话跟我浅浅的聊天。

    >

    > 他做棉纺织品后整工作，每月到手收入 3000 元左右。一年到头却连回家的路费都存不下，除了日常吃喝采买，花在小姐身上的钱也有接近两个月的工资。

    >

    > 我很惊讶，小哥告诉我，他来自很偏僻的澜沧县，就在最西南的澜沧江边。家里实在太穷，年收入跟他一个月差不多，他牙缝里省点就够家人用了，见过外面的灯红酒绿就没有想过再回去。

    >

    > 我问他：你花的过年路费都没有，不想家么？他说：其实钱会存下一些的，但是回趟家转四五趟车，折腾两三天，路上来回也要一个月工资，不太合适。过年就打打电话就好了。

    >

    > 我问他工厂里不好找女朋友么？他不好意思笑笑：远地方的，又没钱，不会说话，谁能看上我呢。


    看上面这位云南小哥在福建晋江的工作和生活状况，妇人之仁者会觉得他很可怜，民粹主义者会觉得资本家太狠，福利主义者会觉得政府怎么能给他们保障房，均衡发展主义者会认为他们根本不该来受这个罪，而政府应该努力去发展他的家乡。


    但是但是，你问过他自己的感受吗？他们等不及故乡的“发展”，迫切要到更好的地方寻找机会。


    他是没有房，可能住得很一般甚至很差，但是，房子之外，有广阔得多的天空；生命的长度和宽度，比一套房子大多了，他“见过外面的灯红酒绿就没有想过再回去”。


    他是还没有女友，甚至自己都不觉得有哪个女孩能够看上他（其实未必），但是他留在故乡就能有女友吗？乡下女孩通常比男生更义无反顾地扎进城市。


    他是收入不高，一年到头回家的路费都存不下，但那也只是因为回家太麻烦而已。“家里实在太穷，年收入跟他一个月差不多，他牙缝里省点就够家人用了。”


    外人用横向比较，甚至把自己的生活情境代入别人的生活状态，用俯视的眼光看，觉得他们在城市过的简直不是人的生活；但是他们自己用纵向比，有时简直是天堂和地狱的差别。


    所以，个体的纵向比较，就代表了人口流动的方向。不管外面的人多么自作多情，'
