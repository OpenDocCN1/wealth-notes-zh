    # 当今中国限购限贷最严厉的区域是哪里？


    童大庆—2019 年 9 月 30 日


    1

    房价涨跌一定是有规律，有逻辑，有原因的。


    长期原因，是人口和货币。但通胀因素个人不可控，个人完全不可对自己不可控的事物用过深用力过猛；同时通胀也不是均衡地洒向每一寸土地。因此，**<span style="color:
    red;">人口才是最后总结算因素，个人投资者一定要把全部重心放在研究人口流动上</span>**。


    人聚财聚，人散财散。人是一切价值的尺度，没有了人，再美的宫殿与房屋都是价值归零的“巨人的花园”。


    房价涨跌的短期原因，是政策和炒作。一个政策可以让房价一年涨一倍，比如 **<span style="color: blue;">2016 年 2 月全面降低首付以及限贷放松，使很多城市房价当年涨一倍，这个房价先由中心城市开始涨起；眼看有点控不住，2017.3.17
    以后又强化大城市和环大都市圈的限购限贷，使北京这样的城市，房价到现在也从高位上涨了二三成。</span>**


    **<span style="color: blue;">2017.3.17 以后，一二线城市更严厉的限购限贷抬住了大城市资金的流动性，使资金和注意方向三四线城市蔓延。与此同时，2017
    年 6 月住建部等《关于加强近期住房及用地供应管理和调控有关工作的通知》中明确指出，在商品住房库存量大、市场房源充足的三四线城市，棚户区改造要以货币化安置为主（以前是实物安置）。三四线城市作为主要人口流出地，其住房需求一大部分是由棚改货币化安置释放的改善型需求，支撑了
    2017 年以来三四线城市房价。而棚改货币化安置资金的源头为 PSL（抵押补充贷款），因此，抵押补充贷款的溢出效应间接拉动了三四线城市房价上升。</span>**


    很多人口流出的三四线中小城市货币化棚改、涨价去库存，又使中小城市房价到现在涨百分之五六十甚至一倍。


    而炒作方面，更多是开发商和大小 V 借政策炒作，比如哪里搞湾区，哪里搞自贸区，资金炒一把。比起大城市来说，这些局部区域往往可售面积小，容易炒起来。


    由于政策和炒作原因导致的涨跌，能否持续，取决于最后的人口因素，也就是人最终是流入还是流出。


