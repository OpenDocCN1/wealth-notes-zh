    在这个背景之下，我坚持多年来坚持的观点：中国几乎所有产能都是过剩的，房地产整体也是严重过剩的，甚至比其它产能过剩更严重，只不过因为房地产是不动产，所以不能实现空间流动和转移，因此将长期存在“局部严重短缺，整体严重过剩”的局面。


