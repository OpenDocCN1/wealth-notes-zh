    三种。而在《中华人民共和国物权法》第一百五十九条对于土地使用权到期问题的表述是，住宅建设用地使用权期间届满的，自动续期。非住宅建设用地使用权期间届满后的续期，依照法律规定办理。该土地上的房屋及其他不动产的归属，有约定的，按照约定；没有约定或者约定不明确的，依照法律、行政法规的规定办理。


    4


    对所有权问题，不必杞人忧天。中国的市场化改革会不断推进，后人还有后人的智慧和勇气，以及后人也和前人、今人一样要遇到的“政策不是真空物，财政金融硬约束”。


    至于到哪里买房投资更好？我还是坚持一贯的观点：


    中国的城市化和市场化都比世界各发达国家来得更晚，目前都远远没有完成，而且中国还是世界第一第二的人口大国，在这样的历史条件下，在中国你买房投资都赚不到钱，就别妄想到其它国家和地区能赚更多、更稳定的钱了。


