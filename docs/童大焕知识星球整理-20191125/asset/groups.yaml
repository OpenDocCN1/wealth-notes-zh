    # 3


    # 天下第一严：一个区域和广大农村


    这个区域是某安，全面冻结房屋交易，以后的房子也宣布只租不售。但这是千年大计，人生最长也就百年，咱们可以对此忽略不计。


    再说一遍，切不可对自己掌控不了的东西用情过深用力过猛。时间是自己的，生活是自己的，投资也是自己的。


    农村的农民住房和宅基地，法律只认可本村内交易，不认可城市居民和农村居民之间自由交易，也不能贷款。也当属最严之列。


    但大部分人，不是已经进城就是正在进城的路上。大部分人，还没有到衣锦还乡叶落归根的年龄。到了这个年龄者，回村购房置业，也不属于投资行列，故此，也略过无视。


    # 4


    # 天下第二严：北 3 县和海南 4 县。


    **2018 年 4 月 22 日起，海南的五指山、保亭、琼中、白沙 4 个中部生态核心市县** 建设的住房，只能面向本市县居民家庭销售。


    **2017 年 6 月 6 日起，河北紧挨北京的北 3 县——三河（主要是其下辖燕郊镇）、大厂、香河，外地户口必须有多本市社保或纳税证明连续 3 年，不得断交，不得补交。三个县都属于廊坊市，但社保都互相不认。直接导致这些地方房价腰斩。**


    <font color=red>表面上看，海南 4 县比河北北 3 县更严，因为只限本地户口，外地人在本地社保都不算。但如果仔细推敲，会发现实际上北 3 县比海南
    4 县严厉数倍。</font>


    以燕郊为例，三河全县连城市连农村一共 71 万人口（2017），但仅仅一个燕郊镇就号称超过 60 甚至百万人口——大部分是在当地没有社保没有纳税证明也没有当地户籍的外来人口，他们多是在北京无购房资格或嫌北京房价贵、在北京上班、在燕郊居住的“外溢人口”！


    燕郊本质上是北京的睡城，在北京上班的人，谁会在燕郊交社保或纳个税？限购约等于让交易速冻。而且，经过过去十多年的发展，北 3 县已经有了大量主要面向外来人口的住宅供应，不像海南
    4 县一样，从来都只是县内市场。


    # 5


    # 天下第三严：北京通州。'
  - '[PAGE 92]


    2015 年 7 月 11 日，国家宣布建设通州行政副中心。2015 年 8 月 14 日晚间，北京市住建委与通州区政府联合发布限购政策，北京市户籍居民无房户，以及近
    3 年在通州区连续缴纳社保或者个税的非本市户籍居民（前提是在北京拥有连续 5 年社保和纳税证明），只能在通州购买 1 套商品房。北京市户籍居民已有 1 套住房的，如要在通州再买房，应在通州落户
    3 年（含）以上，或者在通州区连续 3 年缴纳社保或者个税。


    这个属于比北京其他地区都更严。


    2019 年 7 月 1，北京调整通州第十三个五年规划时，将原规划中“市行政副中心、国际商务新中心、文化发展创新区、和谐宜居示范区”的发展定位调整为含糊其词的“国际一流和谐宜居之都示范区、新型城镇化示范区、京津冀区域协同发展示范区”。


    硬指标调整方面，包括将通州常住人口规模从 160 万调整为 180 万人，将全社会固定资产投资年均增速 12%调整为建安投资年均增速 8%，将社会消费品零售总额年均增速
    10%调整为年均增速 7%。


    换句话说，仅仅四年过去，除了北京市政府搬迁通州外，其他还没个影儿，“市行政副中心”定位已被悄然抹去，人口容量在增加，投资却直接减少三分之一。


    > 所以，我一再强调“信规律不信规划，信市场不信市长”，“政策不是真空物，财政金融硬约束”。


    通州“行政副中心”担负着“疏解北京中心区人口”这么重要的任务，尚且如此，各种批量批发的自贸区、示范区、湾区什么的，大家就自个儿掂量掂量吧。短期的炒作，可不可以持续？会不会高位站岗？要三思。


    # 6

    天下第四严，北京上海。


    全国人民都知道，若论限购限贷政策，北京当属最严。2017.3.17 以来，北京的限购限贷政策具体如下：


    本地人购房：北京单身人士限购一套住房，不得购买第二套；家庭成员中有北京户口的在北京可买两套住房；北京军官可在北京购房；北京集体户口可在北京购房。


    外地人购房：外地人需要在北京连续缴纳五年社保或者是纳税（五年连续社保或纳税是购房当月的前一个月向前推五年）才可以在北京购房。外地人如有北京居住证可以在北京购房。外地人配偶是北京户口也可在北京购房（可买两套）。单身外地人士或夫妻二人都是外地人在北京购房只能买一套。公司购房，北京或是外地公司都可北京购房，但必须全款。'
  - '[PAGE 93]


    北京目前的限贷政策（全部以家庭为单位计算）：认房又认贷，有过一次贷款记录的，不论名下有房无房，再贷款就算是二套贷款。


    居民家庭名下在本市无住房且无商业性住房贷款记录、公积金住房贷款记录的，购买普通自住房的执行现行首套房政策，即首付款比例不低于35%，购买非普通自住房的首付款比例不低于40%（自住型商品住房、两限房等政策性住房除外）。


    居民家庭名下在本市已拥有1套住房，以及在本市无住房但有商业性住房贷款记录或公积金住房贷款记录的，购买普通自住房的首付款比例不低于60%，购买非普通自住房的首付款比例不低于80%。


    这几种首付比例，在全国一线城市中都属于最高。因此，说北京的住房限购限贷，全国最严，不夸张。


    2017年3月26日，北京市住房和城乡建设委员会官方网站发布《关于进一步加强对商业、办公类项目管理的公告》，全国首次规定个人购买应当符合下列条件：1、名下在京无住房和商办类房产记录的。
    2、在申请办理之日起，在京已连续五年缴纳社会保险或者连续五年缴纳个人所得税。商业银行暂停对个人购买商办类项目的个人购房贷款。


    也就是说，以前无需资格随便买、而且可以按揭50%的商铺、商住等类型房屋，在北京不仅需要购房资格，而且不予银行货款。


    上海对外地单身人口购买住宅，比北京更严一些，要求除了60个月的社保或，还得结婚。但按揭贷款首付比例低于北京同类型。


    7

    天下第五严：成都。


    成都也是分区域限购，类似于北京通州。但总体年限没有北京高，落户、社保等都 比北京上海宽松很多。


    8

    限售方面，我想就不必多着笔墨了。限售的主要目的，对地方政府来说，是为了控制市场上房源总量，让一手房多卖几年，让土地财政多维持几年，跟控制房价没有关系，买房人不要表情情会错意了。


    对于个人买房来说，限售不是我们主要考虑的，因为价值投资长线投资本来就是房产投资的不二法门。


