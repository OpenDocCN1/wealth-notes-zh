    新加坡的发展也非常晚近，1965 年才正式独立，此前两年曾脱离投靠马来西亚。


    # 2


    上述六座城市，都有两大共同点：都是国际金融中心，都是国际枢纽城市，城市密集紧凑，效率极高。至于国际旅游城市，则是前几方面的副产品。


    而奠定国际金融中心和国际枢纽城市地位的，都是软环境。


    # 3


    新加坡、迪拜，这两个原本都是不毛之地，弹丸之地，能够迅速成长为在全球城市中举足轻重的国际枢纽型大都市，跟领导人的危机意识和一系列改革息息相关。


    以迪拜为例。迪拜领导人最早意识到有危机，石油用完怎么办？后代怎么办？在全球的地位怎么办？然后就提出把落后资源转化成非石油竞争力，将来不靠石油竞争。于是派出最得力的人到新加坡学习，学新加坡的土地制度、城市建设，关键是把商业制度改了，税收很低，进关、出关非常便利。


    目前，靠石油发家的迪拜，仅 5% 的收入来自石油，95% 来自非石油产业，拥有大量来自金融、娱乐、旅游等领域收入。全世界很多货物往沙漠这个地方运载或中转，游客也越来越多，旅游人次超越了巴黎，成为泰国曼谷和英国伦敦之后，世界第三大旅游目的地。非本国的居民在迪拜占
    90%。


    # 4


    香港科技大学教授丁学良在 2018 年 8 月接受腾讯思享会采访时认为，完整的普通法体系、宽松的信息流通环境和良好的生活条件是金融中心形成的三大基本条件，而对眼下的中国大陆来说，香港的国际金融中心地位无可替代，在可见的未来，内地没有产生国际金融中心的基本条件。


    丁学良尤其强调，关键的一点就是香港有一个比较好的法律体系——“这个法律体系必须是从英国的普通法延续下来的，英国的普通法使得全世界所有市场经济，基本上都在一个法律背景下运作。”“必须有相对宽松的信息流通环境。金融是瞬息万变的，对于某一特定目标或任务而言最重要的信息，早收到几秒钟和晚收到几秒钟有重大的区别。”


    而成为物流、交通的枢纽型城市，法治和低税同时起到奠基性的作用。英国人在香港实行的税收制度很透明，而伦敦、纽约的税收制度还比不上香港的税率低。


    前面已经说了，迪拜的税收也非常之低。


    # 5


    大家有没有看出问题的关键核心之所在？'
  - '[PAGE 17]


    成就一座国际金融中心的必要条件是：良好的法治。这是最基础的海定神针。在良好的法治体系下，相关城市成为全世界富人生命安全和财产安全的避风港。


    马斯洛理论把人的需求分成生理需求（Physiological needs）、安全需求（Safety needs）、爱和归属感（Love and belonging）、尊重（Esteem）和自我实现（Self-actualization）五类，依次由较低层次到较高层次排列。


    很多人认为有了钱就可以自然上升到更高阶的需求，其实是个误会。富人的生命和财产安全需求，比穷人更迫切。正如俗话所说：光脚的不怕穿鞋的。因为富人的机会成本更高，所以对安全的需求也更迫切。


    良好的法治条件，吸引全世界的富人扎堆。自由迅捷的信息条件和低税收，第一时间无障碍得连通世界，低成本创新创业。这便是世界金融中心的资金基础和市场基础。


    有了这三大基础，相关城市就会源源不断地吸引全世界的富裕资金、全世界的优秀人才就源源不断地注入这个城市。这就是核心城市、核心节点的竞争战略和支撑点。


    富人和优秀人才的聚集地，自然而然也会创造出优越的文化和教育、卫生等生活条件。多年来，香港的金融、法律、国际航运、商贸、信息网络、教育、高端知识服务以及生物医药等服务贸易领域，一直保持着亚洲顶级的地位。


    香港的国际金融中心地位，成就了香港，也服务着中国大陆。中国香港和中国大陆的关系，是唇齿相依、你中有我我有你、一荣俱荣一损俱损的关系。


    # 6


    世界六大金融中心和枢纽型城市，当然还有共同点就是楼高，楼密，楼贵。


    很多人一直拿香港高房价说事，认为高房价盘剥了年轻人，让年轻人感到绝望。一些人一再呼吁要抑制豪强、接济青年。这是一种因果颠倒本末倒置的有毒视角。


    世界六大金融中心和枢纽型城市，这里的房地产、金融等富豪，都是赚全世界的钱，然后把这里当成避风港，当成财富仓库。然后，吸引全世界最优秀的专业人才，再为全世界提供金融、法律、教育、医疗等高端服务。


    城市的高楼大厦并不值钱，值钱的是全世界的富人把它当成了财富仓库，以及，在这里奋斗的各种优秀的专业人才，把这里变成了全世界财富的发动机。由此而给城市提供了各种各样的就业机会，包括高端生产性服务业和中低收入的生活类服务业的就业机会。


    # 7


    英国是工业革命的源头、引领世界的全球法治传统创立者，伦敦作为其首都，工业化时代和服务贸易时代都没有落后，成为当之无愧的世界领导者；美国得英治'
  md: "\n## 战略失败永远无法通过战术来弥补-为什么要懂城市化？\n\n童大焕—2019年8月12日\n\n### 1\n\n服务业主导的高密度大城市化，是当今世界最大的人类历史事件。城市化知识大部分人都缺乏，却又与每个人息息相关，你知或者不知，主动或者被动，都将被无一例外地卷入这场人口和财富大流动的时代大潮中。先知先觉者，积极主动提前布局，到未来人口特别是高素质人口大规模流入的地方提前卡住生态位；后知后觉或无知无觉者，或气喘吁吁追赶，或被时代与财富浪潮无情抛下。\n\
    \n### 2\n\n问：“童老师，知道城市好和理解城市化这中间的差距在哪里？”\n\n答：“城市之间、城市内部都在剧烈分化。理解城市化，才能知道真正的人口和财富流向。在‘好城市’投资失败的举不胜举。”\n\
    \n问：“理解城市化才能真正知道城市好，为什么好，好在哪里，才能坚定地指导将来的生活。明白了。”\n\n答：“这个理解非常棒。”\n\n很多人买房投资也非常勤奋，到处踩盘，各种比较，试图去寻找城市中心在哪里，价格洼地在哪里。但是，然并卵。因为不懂城市化，再好的细节把握、再好的具体战术，都无法弥补战略的失败。比如：造价师认为，房屋的造价就那么一点，房子怎么值那么多钱？于是对高房价退避三舍，一再错失机会。比如，城市规划得到“内部消息”，帝/都要赶/人二百万，房价肯定降，于是在一年暴涨一倍之前，卖了自己唯一一套房子等待抄底。\n\
    \n这一切，都是因为不懂城市化。城市化原理，才是房产投资最根本的战略问题。战略错误，是根本性的、方向性的错误，再好的细节和战术把控，都无法挽救战略的失败。\n\
    \n### 3\n\n阿里巴巴的大投资者、软银集团孙正义在演讲中说：“做投资必须宏观看问题。赚钱不难，真的不难，只要你有宏观概念。我告诉大家，我投资的公司，每年的净利润是44%，而且还在不断成长。我更看重宏观，我只是个简单的人物，有一个简单的想法，这就是我简单的想法：投资宏观。做事情简单化，去了解那个追根究底的原理。不要太复杂，太复杂反而赚不到钱。你要投资未来，投资趋势。”\n\
    \n什么是宏观？\n\n宏观问题就是战略问题，就是趋势问题，就是未来会怎样发展的问题。\n\n宏观问题，战略问题，不是可有可无的问题，而是性命攸关的问题。不懂宏观，就容易在战术中迷失，因小失大；懂得宏观，哪怕不懂战术，也不会有太大的错失；懂得宏观，再懂战术，则是锦上添花。\n\
    \n### 4\n\n房地产投资的宏观战略问题是什么？就是城市化，就是城市化是如何发展的，未来会怎样发展，发展变化的原因是什么。\n\n城市的宏观原理很简单，就是经济规律：节约成本，提高效率。一切都围绕着这个来进行，宏观上永远不会有例外。\n\
    \n而节约成本和提高效率要有条件，就是两次工业革命：第一次把人从农业中解放出来，进入工业主导的城市化；第二次，互联网、机器换人、人工智能，把人从工业中解放出来，进入服务业主导的城市化。\n\
    \n那么我们就要考虑，未来，几个大的技术进步会如何影响城市化，如何影响就业和人口聚散？\n\n这几个大的技术进步是：互联网，物联网，脑联网，人工智能，自动驾驶，轨道交通，等等。\n\
    \n还有一个大趋势，就是农业和工业的财富占比越来越低，未来是属于互联网和人工智能，属于非物质生产，属于服务贸易领域的。这些最重要的服务贸易领域、非物质生产，会集中到哪里，哪里就是人们的就业和生活中心，哪里就是最重要的城市中心。\n\
    \n这就是大道至简。\n\n## 怎样正确理解三十公里半径极限\n\n董大焕—2019年8月13日\n\n### 1\n\n今天知识星球上有两个读者问到跟我研究的三十公里城市半径极限有关的问题，一个在深圳，一个在上海。\n\
    \n其一：“距离某某 CBD 约 36 公里，将来开通地铁快线，可以将两地交通时间压缩到 40 分钟。像这种地方，刚好位于您所说的商务中心半径 30 公里，有快速地铁的加持，能否成深圳东部的就业中心呢？”\n\
    \n答：“能否成为就业中心要看产业导入和集聚程度，以及其交通等条件。否则，半径 30 公里范围内外的地方可多了。有的也不一定非得是就业中心，房价够低成为睡城也可以。同时，30\
    \ 公里左右极限半径是相对于超大城市而言。”\n\n其二，单位要搬上海某西部，也在大都市 30 公里范围内。于是去年以孩子名义在某地铁旁 350 米范围买了一个房子，现在感觉好荒凉。问我对该区域的看法。\n\
    \n我的回答比较简单：“成就一个区域非常漫长，衰落一个区域非常迅疾。我一向主张资产要和工作生活所在地分离。”\n\n追问：“您的意思是某某会有一个漫长的成长期？”\n\
    \n答：“成长很慢，谁也不知道它能否长成。”\n\n### 2 怎样正确理解三十公里半径极限？\n\n三十公里半径极限的正确意思是：即使是日本东京都这样几千万人口的超级大都市，区域规划要想成功，必须在三十公里左右半径极限之内，超出之外，成功的概率非常之低。三十公里左右的半径极限，是成功的必要条件，不是充分条件，不是三十公里左右半径极限就一定能成功，而是超出半径之外的成功概率极低。\n\
    \n这才是正确的理解。日本东京都历史上也是搞人口疏散，在三十公里半径左右搞了多摩、港北、千叶等诸多新城，交通、医疗、教育等配套一应俱全，但三十五年过去，并不太成功。而且随着城市“服务业再集聚时代”的到来，很多郊区和新城人口也在继续回流市中心。\n\
    \n### 3\n\n有人说这里很像当年的深圳，那里很像当年的浦东。这个“很像”是不靠谱的，曹妃甸、滨海新区和鄂尔多斯，建设和规划时期都“很像”深圳、浦东，甚至更令人激动，但是，龙生九子九子各不同呢；城市发展到不同时期未来路径也不同呢；各个区域的地理位置更不同呢！\n\
    \n在城市边界基本已经定型、只在少数区域“三十年河东三十年河西”的时代，我一再提醒，信规律不信规划，信市场不信市长，新规划一定要等企业和人口入住六成左右再加入投资行列不迟。宁可少赚点，也要赚稳一点。\n\
    \n2013 年 9 月，那期间我正在给腾讯写专栏，上海自贸区消息出来，我第一时间建议大家：自贸区有房的，最大一波涨幅来了，快出货；没房没地的，等等，让别人的子弹先飞。（2013\
    \ 年 9 月 30 日，腾讯网“发现楼市另一面”专栏《上海自贸区的房产 现在该买还是该卖？》），6 年过去，上海自贸区发展得怎样了？\n\n2014 年\
    \ 3 月 19 日，传闻保定要做什么副中心，我用中午半小时写就腾讯大家专栏文章，认为“如果保定成为北京政治中心最后尘埃落定并且付诸实施，最有可能的结果就是成为一个国家部委所属科研机构和大学集中地，类似于一个新的大学城。就像动物园服装批发市场强制迁河北一样，这未必是河北繁荣的开始，更可能是市场衰落的先声。同样，国家部委所属科研机构和大学搬迁保定，也未必是保定繁荣的前兆，而有可能是这些科研机构和大学衰落的先声。”\n\
    \n### 4\n\n君子不立危墙之下，投资尽量避开不确定性。\n\n投资的第一要义，是安全；其次才是涨幅。追求长期稳定地高于平均速度的上涨，而不是短期暴涨长期横盘甚至一定时期以后有价无市。\n\
    \n## 150 年历史证明 房产投资风险最低回报最高\n\n童大焕—2019 年 8 月 15 日\n\n### 1\n\n在所有投资品种中，一般理论认为，高收益往往同时意味着高风险。但是，一份史上最详实的调查研究则证明，在过去长达\
    \ 150 年时间里，房地产是最安全同时收益最高的保值增值资产。\n\nÖscar Jorda, Katharina Knoll, Dmitry Kuvshinov,\
    \ Moritz Schularick and Alan Taylor 五位学者于 2019 年合作发表在 Quarterly Journal of Economics\
    \ 上的论文 “The Rate of Return on Everything, 1870 - 2015” 基于全球 16 个发达经济体横跨 150 年的经济数据，首次测算了包括房地产在内的主要资产的长期回报率。\n\
    \n作者使用澳大利亚等 16 个国家的股票、房地产、长期国债和短期国库券四种主要资产从 1870 年至 2015 年的资产回报相关数据，不论在覆盖国家的数量上还是历史年代的跨度上均超过了以往同领域的研究。特别是加入现有文献从未使用过的个体房地产数据，提升了全球资本回报率历史数据库的完备程度。\n\
    \n从回报率和风险性两个维度来看，房地产是全球长期投资中的最佳资产：和短期国库券相比，房地产风险仅升高了 1.7 倍而回报是其 6.9 倍；和股票相比，尽管房地产与股票的回报同为\
    \ 7% 左右，但是风险性却为后者的一半。截取两次世界大战的数据后，得到的结论也一致。这与现代金融理论中风险与收益匹配的基本原则相矛盾：房地产是一种低风险高回报的长期资产。为此作者进一步与现有文献结果对比，并对多种可能原因进行充分探讨。例如，稳定且高昂的房租收益是房地产投资者获得高回报的保证。\n\
    \n最后，作者将财富回报率与 GDP 增长率进行比较。除两次世界大战的 20 年外，真实财富回报率在剩下的 130 年始终远超真实 GDP 增长率；长期财富回报率大约在\
    \ 6% 的水平，是 GDP 长期增长率的两倍。GDP 增长率与财富回报率的差距在 16 个任一国家中或是任一时期的结果也是一致的，除战争时期外。因此，作者认为自\
    \ 1970 年代以后财富回报率的持续升高，可能对应的是劳动收入回报的持续下降。（《【量化历史研究】谁是百年投资最佳资产？来自全球 16 个富国 150 年资产回报率的证据》（刘莹\
    \ 量化历史研究 2019 年 8 月 14 日）\n\n资产性收入增值远大于劳动收入，成为财富的主流。这个研究结果，跟法国学者皮克蒂前几年很轰动的《21\
    \ 世纪的资本论》研究结果高度一致。说明人不理财、财不理你，不会理财，读到博士也可能变穷。\n\n而在几乎所有的投资品种中，房地产风险最低，收益最高，流动性也非常好。是三者兼具的最佳投资品种。\n\
    \n### 2\n\n大焕认为，未来是“服务业再集聚时代”，跟着城市化潮流投资房地产，未来的回报只会更高。因为与以往工农业时代财富相对分散不同，服务业导致的城市再集聚，会加快人口、财富向少数城市集中。\n\
    \n【但有一点一定要特别特别注意】未来的房产投资，沿着城市化的方向投资正确才能获得比历史上更高的收益。如果逆着城市化的方向，收益是会递减甚至造成净损失的！因为工农业时代是城乡“普涨”，但服务业时代，人口长期流出的地方，房价是会跌跌不休的！\n\
    \n### 3\n\n一些人会说，文献采用的是发达国家的数据，发达国家政治经济稳定，产权保护有力。同样的结论，适合发展中国家吗？\n\n我的答案非常肯定：适用。\n\
    \n首先，文献数据包含了两次世界大战，战争不改其规律。其次，即使像中国这样的发展中国家，现代金融制度已经完全渗透到社会生活的每一个角落，房地产是最安全稳定的抵押资产，房地产的整体价值和稳定，已经与金融安全与稳定、财政安全与稳定紧密相连，须臾不可分。\n\
    \n### 4\n\n但现实中经常会有杂音干扰我们，让我们怀疑是否敢把资产只放在房地产这一个篮子里。\n\n在我看来，只要持有的是优质城市优质房产，就不必理会因市场和政策因素导致的短期涨跌。而是坚持长期持有，并且在条件许可的情况下，通过增加杠杆、置换到更优质城市、更优质地段等方式方法，不断做强做大资产。\n\
    \n### 5\n\n网络上很多危言耸听的文章，其实都是骗小白的标题党。比如这两天，在我的一个购房群里，有人转上来这样一篇文章：《干货|为什么我说深圳房产已无投资价值》（原创：Drake888\
    \ 黑鹅鹅 888 ，2019 年 4 月 22 日），文章说：\n\n在深圳湾，片区单价已经高达 15-20 万。离宇宙最贵的香港中环片区 30-40 万港币相比（折合\
    \ 24-32 万人民币），潜在涨幅已经相当相当有限。\n\n假设 15 万单价买入深圳湾 100 平米 3 房，五年后深圳湾房价超过香港中环，成为全球第一，达到\
    \ 24 万一平米。那么实际的利润率是多少呢？毛估估：\n\n- 购房成本\n  - 500 万首付，1000 万贷款\n  - 买入税费 150 万\n\
    \  - 中介费 1% 15 万\n  - 5 年利息：6 万/月 x 12 月 x 5 年=360 万\n\n- 租金收入\n  - 2 万(三房普遍租金)\
    \ x 12 月 x 5 年=120 万\n\n- 租金相关成本\n  - 出租中介费用 1 万 x5 年 =5 万\n  - 空关成本(假设一年空关一个月)\
    \ 2 万 x5 年 = 10 万\n  - 装修改造(假设 2 次) 20 万(初期投入) +10 万(后期翻新)=30 万\n\n- 一共投入 1070\
    \ 万\n  - 出租收回 120 万\n  - 净投入 950 万 (1070-120)\n\n5 年后市场价达到香港中环水平，24 万一平米。你真正能够出手的价格，要比市场均价低\
    \ 10%(也就是所谓的笋盘)才有可能(放宽条件，假设一放盘就卖了)。而实际上，即使折损 10%出手，接盘的买家依然需要付出 24 万一平米的高昂代价(10%税费)。\n\
    \n投资回报：2200 万-900 万(贷款残值毛估)=1300 万\n\n简单拿投资回报除一下净投入也可以算出：\n\n你的整体回报率是 36%，年复合回报率是\
    \ 6.3%\n不出租的话，你的整体回报下降为 1300/1025=27%，年复合回报 4.8%\n\n看明白了吗，买入深圳湾最核心地段的资产，守 5 年，房价理想超越香港中环，加上杠杆，你的年复合回报率是\
    \ 4.8% - 6.3% 。\n\n我另起一部分，大家有没有看到上面文章的问题？\n\n其实这个问题开门见山得很，只是很多人容易被别人设置的议程绕晕。\n\
    \n非常明显的问题包括：\n\n一是他拿房价最高深圳湾来比较，其实比深圳湾便宜一倍甚至更多的房子遍地都是；二是即使深圳湾，比 15 万低的房子也遍地都是；三是深圳涨，香港也在涨，并不是香港停下来等深圳；四是税费被高估，1500\
    \ 万的房子很少因税收就达到 10%的，所有税费中介费等加起来在 7%以内比较常见；第五方面，也是非常非常致命的方面是：凭什么作者假定 15 万涨到 22\
    \ 万是对的？万一涨到 30 万甚至更多呢？拿一个未经论证的假设当真理，何其可笑！六是除了买对房子，我们还有什么更好的投资保值渠道？如果没有比房产投资更好的保值增值渠道，即使收益率比作者预估的还低，我们也只能选房产啊！\n\
    \n我还要花几句话，重点说一下国人通病，写文章的时候，甚至很多堂而皇之大上的论文，都是把未经论证的假设当成真理。这篇耸人听闻的文章，就把未经论证的假设，当成了真理性结论，并且围绕这个结论做文章！\n\
    \n知道了这一点，有助于我们一眼识别和排除垃圾信息。人生有限，信息太多。不能及时排除垃圾信息，会严重影响我们的正确选择。\n\n> 陈志武在《美国教育的精髓\
    \ 在于思辨与表达》一文中写道：“在我女儿她们四年级的时候，老师就会花一年时间讲科学方法是什么，具体到科学的思辨、证明或证伪过程。如果按照我女儿她们在小学四年级就学到的科学方法标准去判断，国内经济学以及其他社会科学类学报上发表的许多论文，都没法及格，因为许多论文只停留在假设的层面上，然后就把没有经过数据实证的假设当成真理性结论。”\n\
    \n网络时代，信息垃圾太多，学会排除垃圾信息，至关重要。\n\n## 理解六座城 理解财富与文明\n\n童大焕—2019 年 8 月 16 日\n\n###\
    \ 1\n\n2014 年麦肯锡评出全球 6 个枢纽城市，纽约、伦敦、中国香港、东京、新加坡、迪拜。\n\n根据 2015 年《全球金融中心指数》（GFCI）报告，香港紧跟伦敦、纽约位列第三，依然是亚洲第一金融中心，新加坡紧随其后，亚太金融双雄间差距逐渐缩小，上海则跌出二十。\n\
    \n2018 年 3 月第 23 期“全球金融中心指数”全球前 20 大金融中心排名依次为伦敦、纽约、香港、新加坡、东京、上海、多伦多、旧金山、悉尼、波士顿、北京、墨尔本、蒙特利尔、芝加哥、温哥华、苏黎世、洛杉矶、深圳、迪拜、法兰克福。\n\
    \n1991 年的迪拜，还是一片沙漠，20 年后就成为一个具有世界影响力的大都市。原因何在？\n\n新加坡的发展也非常晚近，1965 年才正式独立，此前两年曾脱离投靠马来西亚。\n\
    \n### 2\n\n上述六座城市，都有两大共同点：都是国际金融中心，都是国际枢纽城市，城市密集紧凑，效率极高。至于国际旅游城市，则是前几方面的副产品。\n\
    \n而奠定国际金融中心和国际枢纽城市地位的，都是软环境。\n\n### 3\n\n新加坡、迪拜，这两个原本都是不毛之地，弹丸之地，能够迅速成长为在全球城市中举足轻重的国际枢纽型大都市，跟领导人的危机意识和一系列改革息息相关。\n\
    \n以迪拜为例。迪拜领导人最早意识到有危机，石油用完怎么办？后代怎么办？在全球的地位怎么办？然后就提出把落后资源转化成非石油竞争力，将来不靠石油竞争。于是派出最得力的人到新加坡学习，学新加坡的土地制度、城市建设，关键是把商业制度改了，税收很低，进关、出关非常便利。\n\
    \n目前，靠石油发家的迪拜，仅 5% 的收入来自石油，95% 来自非石油产业，拥有大量来自金融、娱乐、旅游等领域收入。全世界很多货物往沙漠这个地方运载或中转，游客也越来越多，旅游人次超越了巴黎，成为泰国曼谷和英国伦敦之后，世界第三大旅游目的地。非本国的居民在迪拜占\
    \ 90%。\n\n### 4\n\n香港科技大学教授丁学良在 2018 年 8 月接受腾讯思享会采访时认为，完整的普通法体系、宽松的信息流通环境和良好的生活条件是金融中心形成的三大基本条件，而对眼下的中国大陆来说，香港的国际金融中心地位无可替代，在可见的未来，内地没有产生国际金融中心的基本条件。\n\
    \n丁学良尤其强调，关键的一点就是香港有一个比较好的法律体系——“这个法律体系必须是从英国的普通法延续下来的，英国的普通法使得全世界所有市场经济，基本上都在一个法律背景下运作。”“必须有相对宽松的信息流通环境。金融是瞬息万变的，对于某一特定目标或任务而言最重要的信息，早收到几秒钟和晚收到几秒钟有重大的区别。”\n\
    \n而成为物流、交通的枢纽型城市，法治和低税同时起到奠基性的作用。英国人在香港实行的税收制度很透明，而伦敦、纽约的税收制度还比不上香港的税率低。\n\n前面已经说了，迪拜的税收也非常之低。\n\
    \n### 5\n\n大家有没有看出问题的关键核心之所在？\n\n成就一座国际金融中心的必要条件是：良好的法治。这是最基础的海定神针。在良好的法治体系下，相关城市成为全世界富人生命安全和财产安全的避风港。\n\
    \n马斯洛理论把人的需求分成生理需求（Physiological needs）、安全需求（Safety needs）、爱和归属感（Love and belonging）、尊重（Esteem）和自我实现（Self-actualization）五类，依次由较低层次到较高层次排列。\n\
    \n很多人认为有了钱就可以自然上升到更高阶的需求，其实是个误会。富人的生命和财产安全需求，比穷人更迫切。正如俗话所说：光脚的不怕穿鞋的。因为富人的机会成本更高，所以对安全的需求也更迫切。\n\
    \n良好的法治条件，吸引全世界的富人扎堆。自由迅捷的信息条件和低税收，第一时间无障碍得连通世界，低成本创新创业。这便是世界金融中心的资金基础和市场基础。\n\
    \n有了这三大基础，相关城市就会源源不断地吸引全世界的富裕资金、全世界的优秀人才就源源不断地注入这个城市。这就是核心城市、核心节点的竞争战略和支撑点。\n\n\
    富人和优秀人才的聚集地，自然而然也会创造出优越的文化和教育、卫生等生活条件。多年来，香港的金融、法律、国际航运、商贸、信息网络、教育、高端知识服务以及生物医药等服务贸易领域，一直保持着亚洲顶级的地位。\n\
    \n香港的国际金融中心地位，成就了香港，也服务着中国大陆。中国香港和中国大陆的关系，是唇齿相依、你中有我我有你、一荣俱荣一损俱损的关系。\n\n### 6\n\
    \n世界六大金融中心和枢纽型城市，当然还有共同点就是楼高，楼密，楼贵。\n\n很多人一直拿香港高房价说事，认为高房价盘剥了年轻人，让年轻人感到绝望。一些人一再呼吁要抑制豪强、接济青年。这是一种因果颠倒本末倒置的有毒视角。\n\
    \n世界六大金融中心和枢纽型城市，这里的房地产、金融等富豪，都是赚全世界的钱，然后把这里当成避风港，当成财富仓库。然后，吸引全世界最优秀的专业人才，再为全世界提供金融、法律、教育、医疗等高端服务。\n\
    \n城市的高楼大厦并不值钱，值钱的是全世界的富人把它当成了财富仓库，以及，在这里奋斗的各种优秀的专业人才，把这里变成了全世界财富的发动机。由此而给城市提供了各种各样的就业机会，包括高端生产性服务业和中低收入的生活类服务业的就业机会。\n\
    \n### 7\n\n英国是工业革命的源头、引领世界的全球法治传统创立者，伦敦作为其首都，工业化时代和服务贸易时代都没有落后，成为当之无愧的世界领导者；美国得英治\n"
  mdcn: "\n## 战略失败永远无法通过战术来弥补-为什么要懂城市化？\n\n童大焕—2019年8月12日\n\n### 1\n\n服务业主导的高密度大城市化，是当今世界最大的人类历史事件。城市化知识大部分人都缺乏，却又与每个人息息相关，你知或者不知，主动或者被动，都将被无一例外地卷入这场人口和财富大流动的时代大潮中。先知先觉者，积极主动提前布局，到未来人口特别是高素质人口大规模流入的地方提前卡住生态位；后知后觉或无知无觉者，或气喘吁吁追赶，或被时代与财富浪潮无情抛下。\n\
    \n### 2\n\n问：“童老师，知道城市好和理解城市化这中间的差距在哪里？”\n\n答：“城市之间、城市内部都在剧烈分化。理解城市化，才能知道真正的人口和财富流向。在‘好城市’投资失败的举不胜举。”\n\
    \n问：“理解城市化才能真正知道城市好，为什么好，好在哪里，才能坚定地指导将来的生活。明白了。”\n\n答：“这个理解非常棒。”\n\n很多人买房投资也非常勤奋，到处踩盘，各种比较，试图去寻找城市中心在哪里，价格洼地在哪里。但是，然并卵。因为不懂城市化，再好的细节把握、再好的具体战术，都无法弥补战略的失败。比如：造价师认为，房屋的造价就那么一点，房子怎么值那么多钱？于是对高房价退避三舍，一再错失机会。比如，城市规划得到“内部消息”，帝/都要赶/人二百万，房价肯定降，于是在一年暴涨一倍之前，卖了自己唯一一套房子等待抄底。\n\
    \n这一切，都是因为不懂城市化。城市化原理，才是房产投资最根本的战略问题。战略错误，是根本性的、方向性的错误，再好的细节和战术把控，都无法挽救战略的失败。\n\
    \n### 3\n\n阿里巴巴的大投资者、软银集团孙正义在演讲中说：“做投资必须宏观看问题。赚钱不难，真的不难，只要你有宏观概念。我告诉大家，我投资的公司，每年的净利润是44%，而且还在不断成长。我更看重宏观，我只是个简单的人物，有一个简单的想法，这就是我简单的想法：投资宏观。做事情简单化，去了解那个追根究底的原理。不要太复杂，太复杂反而赚不到钱。你要投资未来，投资趋势。”\n\
    \n什么是宏观？\n\n宏观问题就是战略问题，就是趋势问题，就是未来会怎样发展的问题。\n\n宏观问题，战略问题，不是可有可无的问题，而是性命攸关的问题。不懂宏观，就容易在战术中迷失，因小失大；懂得宏观，哪怕不懂战术，也不会有太大的错失；懂得宏观，再懂战术，则是锦上添花。\n\
    \n### 4\n\n房地产投资的宏观战略问题是什么？就是城市化，就是城市化是如何发展的，未来会怎样发展，发展变化的原因是什么。\n\n城市的宏观原理很简单，就是经济规律：节约成本，提高效率。一切都围绕着这个来进行，宏观上永远不会有例外。\n\
    \n而节约成本和提高效率要有条件，就是两次工业革命：第一次把人从农业中解放出来，进入工业主导的城市化；第二次，互联网、机器换人、人工智能，把人从工业中解放出来，进入服务业主导的城市化。\n\
    \n那么我们就要考虑，未来，几个大的技术进步会如何影响城市化，如何影响就业和人口聚散？\n\n这几个大的技术进步是：互联网，物联网，脑联网，人工智能，自动驾驶，轨道交通，等等。\n\
    \n还有一个大趋势，就是农业和工业的财富占比越来越低，未来是属于互联网和人工智能，属于非物质生产，属于服务贸易领域的。这些最重要的服务贸易领域、非物质生产，会集中到哪里，哪里就是人们的就业和生活中心，哪里就是最重要的城市中心。\n\
    \n这就是大道至简。\n\n## 怎样正确理解三十公里半径极限\n\n董大焕—2019年8月13日\n\n### 1\n\n今天知识星球上有两个读者问到跟我研究的三十公里城市半径极限有关的问题，一个在深圳，一个在上海。\n\
    \n其一：“距离某某 CBD 约 36 公里，将来开通地铁快线，可以将两地交通时间压缩到 40 分钟。像这种地方，刚好位于您所说的商务中心半径 30 公里，有快速地铁的加持，能否成深圳东部的就业中心呢？”\n\
    \n答：“能否成为就业中心要看产业导入和集聚程度，以及其交通等条件。否则，半径 30 公里范围内外的地方可多了。有的也不一定非得是就业中心，房价够低成为睡城也可以。同时，30\
    \ 公里左右极限半径是相对于超大城市而言。”\n\n其二，单位要搬上海某西部，也在大都市 30 公里范围内。于是去年以孩子名义在某地铁旁 350 米范围买了一个房子，现在感觉好荒凉。问我对该区域的看法。\n\
    \n我的回答比较简单：“成就一个区域非常漫长，衰落一个区域非常迅疾。我一向主张资产要和工作生活所在地分离。”\n\n追问：“您的意思是某某会有一个漫长的成长期？”\n\
    \n答：“成长很慢，谁也不知道它能否长成。”\n\n### 2 怎样正确理解三十公里半径极限？\n\n三十公里半径极限的正确意思是：即使是日本东京都这样几千万人口的超级大都市，区域规划要想成功，必须在三十公里左右半径极限之内，超出之外，成功的概率非常之低。三十公里左右的半径极限，是成功的必要条件，不是充分条件，不是三十公里左右半径极限就一定能成功，而是超出半径之外的成功概率极低。\n\
    \n这才是正确的理解。日本东京都历史上也是搞人口疏散，在三十公里半径左右搞了多摩、港北、千叶等诸多新城，交通、医疗、教育等配套一应俱全，但三十五年过去，并不太成功。而且随着城市“服务业再集聚时代”的到来，很多郊区和新城人口也在继续回流市中心。\n\
    \n### 3\n\n有人说这里很像当年的深圳，那里很像当年的浦东。这个“很像”是不靠谱的，曹妃甸、滨海新区和鄂尔多斯，建设和规划时期都“很像”深圳、浦东，甚至更令人激动，但是，龙生九子九子各不同呢；城市发展到不同时期未来路径也不同呢；各个区域的地理位置更不同呢！\n\
    \n在城市边界基本已经定型、只在少数区域“三十年河东三十年河西”的时代，我一再提醒，信规律不信规划，信市场不信市长，新规划一定要等企业和人口入住六成左右再加入投资行列不迟。宁可少赚点，也要赚稳一点。\n\
    \n2013 年 9 月，那期间我正在给腾讯写专栏，上海自贸区消息出来，我第一时间建议大家：自贸区有房的，最大一波涨幅来了，快出货；没房没地的，等等，让别人的子弹先飞。（2013\
    \ 年 9 月 30 日，腾讯网“发现楼市另一面”专栏《上海自贸区的房产 现在该买还是该卖？》），6 年过去，上海自贸区发展得怎样了？\n\n2014 年\
    \ 3 月 19 日，传闻保定要做什么副中心，我用中午半小时写就腾讯大家专栏文章，认为“如果保定成为北京政治中心最后尘埃落定并且付诸实施，最有可能的结果就是成为一个国家部委所属科研机构和大学集中地，类似于一个新的大学城。就像动物园服装批发市场强制迁河北一样，这未必是河北繁荣的开始，更可能是市场衰落的先声。同样，国家部委所属科研机构和大学搬迁保定，也未必是保定繁荣的前兆，而有可能是这些科研机构和大学衰落的先声。”\n\
    \n### 4\n\n君子不立危墙之下，投资尽量避开不确定性。\n\n投资的第一要义，是安全；其次才是涨幅。追求长期稳定地高于平均速度的上涨，而不是短期暴涨长期横盘甚至一定时期以后有价无市。\n\
    \n## 150 年历史证明 房产投资风险最低回报最高\n\n童大焕—2019 年 8 月 15 日\n\n### 1\n\n在所有投资品种中，一般理论认为，高收益往往同时意味着高风险。但是，一份史上最详实的调查研究则证明，在过去长达\
    \ 150 年时间里，房地产是最安全同时收益最高的保值增值资产。\n\nÖscar Jorda, Katharina Knoll, Dmitry Kuvshinov,\
    \ Moritz Schularick and Alan Taylor 五位学者于 2019 年合作发表在 Quarterly Journal of Economics\
    \ 上的论文 “The Rate of Return on Everything, 1870 - 2015” 基于全球 16 个发达经济体横跨 150 年的经济数据，首次测算了包括房地产在内的主要资产的长期回报率。\n\
    \n作者使用澳大利亚等 16 个国家的股票、房地产、长期国债和短期国库券四种主要资产从 1870 年至 2015 年的资产回报相关数据，不论在覆盖国家的数量上还是历史年代的跨度上均超过了以往同领域的研究。特别是加入现有文献从未使用过的个体房地产数据，提升了全球资本回报率历史数据库的完备程度。\n\
    \n从回报率和风险性两个维度来看，房地产是全球长期投资中的最佳资产：和短期国库券相比，房地产风险仅升高了 1.7 倍而回报是其 6.9 倍；和股票相比，尽管房地产与股票的回报同为\
    \ 7% 左右，但是风险性却为后者的一半。截取两次世界大战的数据后，得到的结论也一致。这与现代金融理论中风险与收益匹配的基本原则相矛盾：房地产是一种低风险高回报的长期资产。为此作者进一步与现有文献结果对比，并对多种可能原因进行充分探讨。例如，稳定且高昂的房租收益是房地产投资者获得高回报的保证。\n\
    \n最后，作者将财富回报率与 GDP 增长率进行比较。除两次世界大战的 20 年外，真实财富回报率在剩下的 130 年始终远超真实 GDP 增长率；长期财富回报率大约在\
    \ 6% 的水平，是 GDP 长期增长率的两倍。GDP 增长率与财富回报率的差距在 16 个任一国家中或是任一时期的结果也是一致的，除战争时期外。因此，作者认为自\
    \ 1970 年代以后财富回报率的持续升高，可能对应的是劳动收入回报的持续下降。（《【量化历史研究】谁是百年投资最佳资产？来自全球 16 个富国 150 年资产回报率的证据》（刘莹\
    \ 量化历史研究 2019 年 8 月 14 日）\n\n资产性收入增值远大于劳动收入，成为财富的主流。这个研究结果，跟法国学者皮克蒂前几年很轰动的《21\
    \ 世纪的资本论》研究结果高度一致。说明人不理财、财不理你，不会理财，读到博士也可能变穷。\n\n而在几乎所有的投资品种中，房地产风险最低，收益最高，流动性也非常好。是三者兼具的最佳投资品种。\n\
    \n### 2\n\n大焕认为，未来是“服务业再集聚时代”，跟着城市化潮流投资房地产，未来的回报只会更高。因为与以往工农业时代财富相对分散不同，服务业导致的城市再集聚，会加快人口、财富向少数城市集中。\n\
    \n【但有一点一定要特别特别注意】未来的房产投资，沿着城市化的方向投资正确才能获得比历史上更高的收益。如果逆着城市化的方向，收益是会递减甚至造成净损失的！因为工农业时代是城乡“普涨”，但服务业时代，人口长期流出的地方，房价是会跌跌不休的！\n\
    \n### 3\n\n一些人会说，文献采用的是发达国家的数据，发达国家政治经济稳定，产权保护有力。同样的结论，适合发展中国家吗？\n\n我的答案非常肯定：适用。\n\
    \n首先，文献数据包含了两次世界大战，战争不改其规律。其次，即使像中国这样的发展中国家，现代金融制度已经完全渗透到社会生活的每一个角落，房地产是最安全稳定的抵押资产，房地产的整体价值和稳定，已经与金融安全与稳定、财政安全与稳定紧密相连，须臾不可分。\n\
    \n### 4\n\n但现实中经常会有杂音干扰我们，让我们怀疑是否敢把资产只放在房地产这一个篮子里。\n\n在我看来，只要持有的是优质城市优质房产，就不必理会因市场和政策因素导致的短期涨跌。而是坚持长期持有，并且在条件许可的情况下，通过增加杠杆、置换到更优质城市、更优质地段等方式方法，不断做强做大资产。\n\
    \n### 5\n\n网络上很多危言耸听的文章，其实都是骗小白的标题党。比如这两天，在我的一个购房群里，有人转上来这样一篇文章：《干货|为什么我说深圳房产已无投资价值》（原创：Drake888\
    \ 黑鹅鹅 888 ，2019 年 4 月 22 日），文章说：\n\n在深圳湾，片区单价已经高达 15-20 万。离宇宙最贵的香港中环片区 30-40 万港币相比（折合\
    \ 24-32 万人民币），潜在涨幅已经相当相当有限。\n\n假设 15 万单价买入深圳湾 100 平米 3 房，五年后深圳湾房价超过香港中环，成为全球第一，达到\
    \ 24 万一平米。那么实际的利润率是多少呢？毛估估：\n\n- 购房成本\n  - 500 万首付，1000 万贷款\n  - 买入税费 150 万\n\
    \  - 中介费 1% 15 万\n  - 5 年利息：6 万/月 x 12 月 x 5 年=360 万\n\n- 租金收入\n  - 2 万(三房普遍租金)\
    \ x 12 月 x 5 年=120 万\n\n- 租金相关成本\n  - 出租中介费用 1 万 x5 年 =5 万\n  - 空关成本(假设一年空关一个月)\
    \ 2 万 x5 年 = 10 万\n  - 装修改造(假设 2 次) 20 万(初期投入) +10 万(后期翻新)=30 万\n\n- 一共投入 1070\
    \ 万\n  - 出租收回 120 万\n  - 净投入 950 万 (1070-120)\n\n5 年后市场价达到香港中环水平，24 万一平米。你真正能够出手的价格，要比市场均价低\
    \ 10%(也就是所谓的笋盘)才有可能(放宽条件，假设一放盘就卖了)。而实际上，即使折损 10%出手，接盘的买家依然需要付出 24 万一平米的高昂代价(10%税费)。\n\
    \n投资回报：2200 万-900 万(贷款残值毛估)=1300 万\n\n简单拿投资回报除一下净投入也可以算出：\n\n你的整体回报率是 36%，年复合回报率是\
    \ 6.3%\n不出租的话，你的整体回报下降为 1300/1025=27%，年复合回报 4.8%\n\n看明白了吗，买入深圳湾最核心地段的资产，守 5 年，房价理想超越香港中环，加上杠杆，你的年复合回报率是\
    \ 4.8% - 6.3% 。\n\n我另起一部分，大家有没有看到上面文章的问题？\n\n其实这个问题开门见山得很，只是很多人容易被别人设置的议程绕晕。\n\
    \n非常明显的问题包括：\n\n一是他拿房价最高深圳湾来比较，其实比深圳湾便宜一倍甚至更多的房子遍地都是；二是即使深圳湾，比 15 万低的房子也遍地都是；三是深圳涨，香港也在涨，并不是香港停下来等深圳；四是税费被高估，1500\
    \ 万的房子很少因税收就达到 10%的，所有税费中介费等加起来在 7%以内比较常见；第五方面，也是非常非常致命的方面是：凭什么作者假定 15 万涨到 22\
    \ 万是对的？万一涨到 30 万甚至更多呢？拿一个未经论证的假设当真理，何其可笑！六是除了买对房子，我们还有什么更好的投资保值渠道？如果没有比房产投资更好的保值增值渠道，即使收益率比作者预估的还低，我们也只能选房产啊！\n\
    \n我还要花几句话，重点说一下国人通病，写文章的时候，甚至很多堂而皇之大上的论文，都是把未经论证的假设当成真理。这篇耸人听闻的文章，就把未经论证的假设，当成了真理性结论，并且围绕这个结论做文章！\n\
    \n知道了这一点，有助于我们一眼识别和排除垃圾信息。人生有限，信息太多。不能及时排除垃圾信息，会严重影响我们的正确选择。\n\n> 陈志武在《美国教育的精髓\
