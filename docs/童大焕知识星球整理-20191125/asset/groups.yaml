    ## 童大焕知悉星球 8 月至 10 月文件主题材料


    ### 等待福利的人们啊 走着走着就走丢了


    童大焕—2019 年 8 月 6 日


    1


    2019 年 8 月 5 日，北京朝阳东坝首开畅颐园，大片外墙墙体脱落，25 层高的楼有十几层的墙皮全掉了，砸了十几辆车！去年刚入住的限价房小区，幸好没伤着人……


    有人翻出小区入住时的消息：“‘摇号摇了十五年，现在我们终于住上新房了！’正在首开物业旗下望京物业所管首开畅颐园小区办理入住的业主不禁感慨。截止 6 月 6
    日，有 988 户业主顺利入住畅颐园小区。”


    看到这份感慨，我愈发感慨：便宜没好货。好货便宜时大家看不懂！求人不如求己！十五年前，用比今天买限价房低得多的价钱买商品房（十五年来工资可没大涨），已经享受十五年了，而且房价也涨十倍了！


    2


    我想起 2013 年底还是 2014 年初，北京通州万达广场开盘。有人通过微博私信，问我能不能买。他说他们家十多年就一直在看房、一直想买两居室了。


    我说可以买。对方真买了。


    可是半夜三更，那人又私信我，说他妈妈听人说房价还会跌，要他无论如何一定要把房子退掉。


    我没好气地回复他道：其实从你第一次私信我，我就知道你们家其实在十多年前就买得起城市中心的两居室，但是因为不懂，又不敢承担任何风险，结果越来越买不起，越来越承担不起任何风险，才导致今天买到了五环外。


    对方没再有回音，也不知房子退没退。我是希望用激将法，让他们不要退了的好。但佛度有缘人，很多事情，非我所能也。


    3


    2004 年底，我的一位助理预交了 2 万元，排队等经济适用房。我对他说，还是自己去买商品房吧。对方没有听，说经适房一定会排得到的。


    2004 年底 2005 年初，北京东四五环中间、青年路的国美第一城开盘，开盘价 4800 元一平米，均价 5000 元一平米。


    2009 年，我这位助理终于排到了经济适用房，比周边房价便宜一半，4800 元一平米。但是，地段已经是通州的半壁店了。后来还曝出了质量问题。


    此时，国美第一城二手房均价是 17000 元。


    我悄悄给这位前助理算了笔账，同样 100 平米，如果当初买国美第一城商品房，到他拿到经适房时，房价已经涨了 120 万，还多住了 5 年，尤其是，地段的差别，不是一般的差别，是永久的差别。未来涨幅也是永久的差别。


    而他的经适房价格，虽然比周边商品房便宜了一半，但是，它的价格，是永远无法追平周边商品房的。也就是说，“便宜一半”只是错觉。


    4


    过去 20 年的中国城市化和房地产历史，是悄无声息又惊心动魄的财富涨跌史，也是一部赤裸裸血淋淋活生生的中国人的心灵史。那些等着保障性住房、限价房，等着房价“回到合理价位”的人们，走着走着就走丢了，悄无声息地落在了时代的后面，被一点一点地自然淘汰。


    然后，其中的一些人，和一些目光短浅的小知识分子，又以社会不公为名，要求更多的均衡、更多的福利。


    穷人的穷，当然很多时候是源于权利不平等，这方面，社会一定要改变它。但很多时候，在平等的权利和机会面前，穷人的穷，是源于思想观念的穷，等待福利、等待别人安排其命运的人，往往既得不到自由也得不到福利。但是，他们不会检讨自己的过失，而会迁怒、归咎于社会的“不公”。他们和学理不清的小知识分子、政客的“公平”诉求，有可能会反过来打击先富者和财富创造者，不仅会导致自己
    和后代穷，也可能导致整个社会一起受穷。


    我想起张五常。他在《贫富分化与土地政策》一文中指出：“每个人天生下来的智商不同，健康不同，际遇不同，运情不同——收入或财富也跟着不同，某种程度的贫富分化无可避免。理论与历史的经验说，采用任何政策去推行财富或收入平均化，对经济运作的活力多或多或少不良影响，因为这些政策会削弱对社会产出有重要贡献的成员的积极行为。贫富分化过甚社会不容易接受，而这分化最难接受的是源自土地或楼房的价格变动带来的那种。源自土地或楼房分配的贫富分化带来的印象，是既非天赋之能，也非勤劳所得。买下了房子，其价无端端地上升了几倍，不是不劳而获吗？其实住往要靠先用功，赚点钱，也要讲眼力，虽然幸运的因素存在。很少人会记得，上世纪八十年代的香港与九十年代的中国，投资于房地产产富身家的人无数。奇怪，社会不可怜这些人。”


    在文章后面，张先生更是提出“政府提供廉租房不要考虑。香港昔日推出廉租房是因为难民涌至，不给他们提供栖身之所对治安不利。这些廉租房后来搞到一团糟，给穷人定了‘穷’位，虫蛇混杂，黑社会、贩毒等行为集中起来。”


    我去香港调研，发现香港照样有实卖商品房去住保障房的。制度漏洞哪里都有，


    人性在哪里都一样。也总有人，看得见眼前蝇头小利，心安理得地消耗着社会创造的财富，同时也不知不觉，“放弃”了需要更高智慧的未来房价上涨。


    5


    剧烈变化的时代，每个人都藏着无限的可能性。但只有见识，决定着我们人生和财富的高度。正如培根在《习惯论》中所说，思想决定行为，行为决定习惯，习惯决定性格，性格决定命运。


    人在世界上，其实是没有敌人的，最后的对手、最后的敌人，永远是——自己！

    【完】


    ### 学区房 的四张面孔


    童大焕—2019 年 8 月 8 日


    1


    今天有人问我：“童老师，你好！我来自深圳，曾是你的学员，对你的很多观点表示认同！最近几年来，你关于学位房的方法可能有些偏颇，最近几年深圳的房子基本没什么涨，除了带好学位的房子。学位房的观点是否需要修正一下，以后怎么看？”


    我说：“这个观点不需要修正。学位房的学位二字，本质是政府配额。是社会压力下的产物，自然也会在社会压力下消解或被稀释，只不过我们不知道它什么时候会变。正是因为不知道它什么时候会改变，属于不可控的东西，这才要远离。原来是择优录取，形成了名校，名校周边居民自然也沾了光，有钱人也通过赞助等方式择校；后来老百姓不干了，说凭什么有钱人可以择校，于是划片招生，进而形成学区房；学区房之后，老百姓又不干了，于是打破划片，改为多校划片。”


    这是一个短短十几年的学区房（学位房）演绎历程。


    2


    就在两天前，智谷趋势转发了黄狮虎的文章《学区房要变天了，多校划片时代到来，老破小可能一文不值？》（2019 年 8 月 6 日），文章说：


    从 2019 年开始，大城市“高烧不退”的学区房，背后将隐藏着巨大的风险。


    在深圳龙岗，部分小学被取消“对口直升”的权利，家长们不得不起打“学区房保卫战”；在广州天河，部分公办中学无法容纳对口直升的小学生，将改为电脑派位。在北京市海淀区，第一批“多校划片”的学生，今年
    9 月即将入学。在福州，从 2020 年起，全市最好的公立初中延安中学将和较为普通的学校杨桥中学“绑在一起”。你买了 10 万/平的学区房，最后也可能去上了普通学校。两个学区的房价逐渐产生了趋同效应。


    在北京的朝阳区、西城区，为了应对学位不足前者开始通过多校划片的方式，在学区或相邻学区派位入学。不少“学区房”价格出现下调。界面新闻记者了解到，


    北京海淀区清河附近的房屋交易已经开始受到影响，一间在 2017 年开价 1500万的二手房，在 2019 年初成交价跌至 1043 万（大焕注：当然这里也有整体市场的影响，2017
    年 3 月 17 日进一步限购房贷以后，全北京市房价都比最高位时有所下调，当然一些学区房的影响尤其大）。


    教育部已经连续 6 年发出通知，推动“多校划片”。也就是说，“学区房”不再对应确定的好学校，也可能被分到“差学校”。


    学区房要变天了。从今天开始，投资老破小的人，一定要慎之又慎。


    3


    学区房三方不讨好:


    - 学校讨厌:原来好学校可以择优录取，或者拿一部分学生家长长的赞助。现在根据学位房划片招生，这一跟学校没关系了。


    - 买得起学位房的家长欢天喜地，觉得自己一举两得: 又让孩子进了好学校，没有输在起跑线，又从房价上涨中大赚了一票。更多的买不起的怨声载道，抱怨政府。


    - 政府压力倍增: 学位房让相关划片学校的生源暴增（即便规定必须持有相关房屋若干年），学校满足不了社会需求; 同时又背上社会不公的包袱。政府的做法很聪明，“掺沙子”，同样的小区，不再确定性地只面对一所学校，而是好学校掺差学校，多校划片，随机抽签。


    4


    未来的学位房，会有四张不同面孔:


    - 第一张面孔，像北京海淀、西城，历史积淀比较厚，城市变迁过程中也没有太落后于后来者，整体教育教学质量一直名列前茅，所以再怎么“掺沙子”，整体教育质量还是普遍高于其他区县一截，所以整体房价也还会高出一些。但海淀、西城区域内部，原来因学区房因素而造成的房价落差会缩小。


    - 第二张面孔，城市变迁快，历史上的教育教学质量落差没有那么大，随着政府政策的改变，学位房的附加值会迅速被剥离，房价回到应有的市场轨道上。而好学校，也会在高素质人口集聚区域，不断重新涌现。即所谓的“父母给我们买套房，我们把它考成学区房。”


    - 第三张面孔，一些中小城市，地方政府为了土地财政，会刻意制造一手房的学位房，卖房搭配学位，而且只有一手房有。有时候甚至故意把一所名校建很多分校，其实分校只是一个命名，从师资到生源，跟原有名校基本没有关系。这类一手房，通常都是不好卖的盘。


    - 第四张面孔，像河北衡水中学、湖北黄冈中学之类的超级名校，就是择优录取或者赞助入学，进来后接受应试教育的魔鬼训练。学校周边都没有学位房。学位房是个伪命题。


    5


    懂得了上面的逻辑，也基本懂得了学位房是怎么回事，真正的名校教育是怎么回事。


    事实上，大学大扩招，从精英教育进入大众教育以后，对普通百姓、对今天热衷于学位房的中产白领阶层并不利。最有钱最有校的那些人，可以通过孩子出国、赞助国外名校等方式领先一步。甚至如十年砍柴在文章中写到过的，哪怕是学渣，读个三流大学，有背景的也会在后工作、晋升中秒杀一流大学毕业的平民子弟。


    所以，与其挖空心思想什么学区房，不如家长自己努力，给孩子创造一个更高的平台。


    【完】


    ### 城市内部的分化变迁远超想像


    土地永不稀缺。即使土地最“稀缺”的深圳，也不是“房价永远涨”。


    童大焕—2019年8月9日


    1


    土地稀缺、别墅地稀缺之类，一直是炒房人和开发商拿来忽悠市场的借口。事实上，土地稀缺只是农业时代特有的现象，那时候人完全依赖于土地产出，靠天靠地吃饭。


    土地只有在农业时代稀缺，现在连香港、迪拜，土地都一点不稀缺。真正稀缺的，是人口集聚。人口和高楼密集，恰恰是分工和就业机会无限增多的前提。城市之外，广袤大地，土地和房屋都越来越不值钱。这，才是未来世界的唯一真相。我的家乡农村，现在大搞空心房拆除，比以前旧村复垦补偿要高一些：土木结构
    150 元一平米、砖木结构 180 元一平米，砖混更贵一些。比建房成本便宜多了吧？


    2


    深圳是中国最有活力的城市之一，也是土地最为“稀缺”的城市。但从 2015 年底到现在（2019 年 8 月）三年多时间里，除了深圳湾和宝中房价涨幅比较大，其它地方房价基本不涨。此外还有学区房在涨。但是学区房有太多的不确定性，生杀予夺权在政府手里，个人无法控制。学区房有很多房子本身价值之外的溢价，一旦多校划片和电脑派位，这部分溢价出来的附加值就随时随地有可能一夜归零。


    当然，有些人还是偏爱学区房投资，也有赚的，赌博还有赚的呢！但是没有赌一辈子能留下财富的。我个人比较保守，不建议。


    3


    北京的土地比深圳更富足，但 2017 年 3 月 17 日史上最严厉的限购限贷以来，北京内部的市场也和深圳一样，冰火两重天，出现巨大的两极分化：


    总体而言，北京房价自 2017 年 3 月最高点到现在，下跌大概平均在 15%到 25%。个别跌幅甚至高达 30%。通州副中心可以说是集天下宠爱于一身，二手房成交价也下跌了
    15%左右甚至更多。北京奥林匹克公园附近的小区上元君庭这几年的跌幅，下跌幅度大概在 25%到 30%之间。


    但这几年北京也有没有下跌的板块。海淀区的安宁庄就算一个。这里的当代城市家园，2017.3 一套 114 平最高成交价显示是 7.8 万出头单价，2019.7.24
    一套 110.7 平则 8 万出头成交。


    南城的宋家庄一带版块，则因为长期发展落后、区域更新、首都新机场即将建成等一系列因素，在“三十年河东三十年河西”的城市变迁中，二手房成交价屡创新高。


    4


    可见，城市内部，市场版块也在不断轮动。但这种轮动，不会遍地开花，而是一段时期，集中在某个高价值区域；过一段时期，又集中在另一个高价值区域。过一段时期，高价值的价格相对落后地区又会追上来。基本上就是这样此起彼伏。


    但是大部分版块，则除了和整体上涨的大势一起涨之外，版块轮动上涨的机会基本轮不到。


    这样几轮下来，最有价值的几个区域，涨幅就会超过全市平均涨幅。这种城市内部的分化与涨跌，呈现出波浪起伏式的涟漪效应，不会有一直领涨的项目和区域，但会有最终涨幅高于大市很多的区域。


    但由于限购限贷等一系列因素，楼市是一个非完全市场，个人很难去紧追节奏。而且版块很多，如何轮动，即使是只有少量高价值版块（当然都属于高端就业集中区），未来几年是轮到
    A 还是 B，事前判断，也并不是那么清晰。但若是同一地段内的小区楼盘轮动，则长期关注就比较好把握。


    只要资产配置正确，配置在了城市最有价值的高端就业密集区域，或其它稀缺地段，而且产品的市场定位准确，就不要轻易去变动，而是以不变应万变，长期持有。只要它是在最有价值的区域之一，即使今天价格落后了，过一段时期，上一波领涨的就要歇下来，等着价格被低估的区域重新追一波上来。


    5


    很多开发商、区域政府和大小 V 们，采取营销手法，也就是联合炒作的手法哄抬楼盘，跟风炒作，容易短期内形成涨势。但如果追涨而入，又不是在城市最有价值的区域，跟风进入的购房者，很容易长期被晾在风中，站岗放哨。


    【完】


    ### 给自己定一个当下够得着的目标


    童大焕一2019 年 8 月 10 日


    1


    有人问：北上广深等首套房认定标准很严苛，名下有房有一套按揭，或者名下无房但有过按揭记录，都算二套，二套房首付需要 5 至 8 成（北京普宅 6 成非普 8
    成，其余城市普宅 5 成非普 7 成）。这样一来，对于首次置业来说，首付几乎也是决战了。如何选择适合的城市下手首套房？谢谢！


    第二次按揭买房，首付比大幅度提高问题（包括历史上曾有过的首次贷款 2 成首付，二次 4 成首付），的的确确让很多很多人，瞻前顾后畏首畏尾犹犹豫豫举棋不定，甚至因此而止步不前，一个个、一次次丧失入市机会，导致目标越来越远。


    我说：“只要是正确的区域，买得起哪里买哪里。一开始就给自己一个遥不可及的目标，只会离目标越来越远！”


    2


    很多人在这个问题上迷失前进的方向、丧失及时入市的机会，是因为没有通过合理的逻辑思维把问题想清楚，账没算清楚。


    首先，通常情况下，我们的收入增长速度赶不上房价上涨速度，因此，为了保住首套首付低首付比例的资格，有了有价值区域但不是目标区域的购买能力还迟迟不敢入市，即使首付比例今后不会提高，也会使我们离目标越来越远。


    其次，在购买力（首付和月供能力）、购买资格（限购）和贷款比率（限贷，及首付比率）三个最主要的约束条件之间，最大的约束条件是什么？


    买房最大的约束条件，肯定不是来自外部的限购和限贷，而是来自内部、来自我们自身的购买能力！


    那些真正的有钱人，他想在哪里买房就能在哪里买房，想在哪一个国家买房就能在哪一个国家买房，想在哪一座城市买房就能在哪一座城市买房，限购、限贷对他们都不起作用。为什么？购买力才是最终决定因素。


    至于限购，大不了或者代持，或者用公司名义购买，等等，破解办法总是有的。


    至于限贷，大不了全款；或者全款后抵押贷款，金融产品一直在创新，有的时候有的城市甚至可以贷到评估价的 7 成，20 年，相当于 3 成首付。


    3


    所以，一个人的全部精力，应该集中火力用于如何提高自己的购买力上面，而不是过多地考虑限购、限贷。


    在能力、视野范围内，有比较确定性的高投资价值区域，够得上了就应该及时入市，借城市化潮流的力量，借银行杠杆的力量，一步一个台阶，提高自己的首付能力。


    打个比方：现有 30 万首付，只能买 100 万房产，有北上广深购房资格，但是 100 万以内，北上广深很难有安全房源；但在其它城市优质地段，可以买得上有较大升值空间的资产。那么，用这
    30 万，先在别的城市买了 100 万资产，按揭 70 万；5 年后假设涨 1 倍，变成 200 万总资产，首付就变成了 130 多万。


    此时，假定二次按揭，上广深还是 5 成首付，130 多万，那么就可以买 260 万左右总价的房产。这样一算，我们的购买力是大幅度提高了。


    而当年上广深 100 万的总资产，因为处在不安全地带，此时可能还不到 200 万，或有价无市，甚至有可能跌了。


    更何况，限购、限贷这样的政策，是会阶段性不断调整的。


    4


    据悉，法国一家报纸进行了一次有奖智力竞赛，其中有一道题是：假如法国最大的博物馆卢浮宫失火了，只允许抢救一副画，你会抢哪幅？结果获奖的最佳答案是：我抢离出口最近的那幅画！


    如果非得要抢最贵的那一幅，结果会怎样？可能画没抢救到，自己也葬身火海了！


    对自己和自已的事，一定要基于现实。目标高远并不是坏事，但不能高不可攀。清醒地认清自己的活动范围和能力状态，设定合理的当下可实现目标，比什么都重要。


    > 选择目标的方法很简单，选择最有可能实现的那个就可以了。人生的境界和财富，就是这样一点一点进阶的。


    5


    限购限贷给了很多人一个非常大的副作用——一以为大城市的购房资格和首贷资格有多么宝贵，导致一些人为了保留这两个资格，错失及时入市的机会。这就像很多原本买得起商品房的人，一直排队买保障房，结果，保障房可能也没排到，商品房也越来越买不起。


    【完】


    ### 一定要具备 “生活在别处” 的视野


    董大焕—2019 年 8 月 11 日


    1


    知识星球已开通 6 天，发现这是个很好的互动空间。很多一手信息，在这里生龙活虎地不断涌现。我将用引导人们自己思考的方式，通过丝丝入扣的心理学建设、方法建设、理论建设，让这个小小空间，成为普及正确城市化知识和正确买房投资理念的黄埔军校，带领星友们，跟上当今世界，最波澜壮阔的城市化潮流。


    服务业主导的城市化，是人类从未来过的历史经验，一个迷人的、充满魅力和财富机会的新世界。


    2


    今天几个问答，特别提出来和大家分享。


    问题一：我广州户口，广州的房票已用完，现有闲钱投资，请问，除了离婚这个办法，怎样才能弄到指标在广州买房？推荐哪个区域、哪种面积段较好？


    答：房票除了你说的，以及代持，可能办法不多。为什么不可以换城市呢？面积则要兼顾首付月供及限套数情况下的资产最大化等问题。地段方面，理解了就业中心就理解了城市中心。


    问题二：坐标成都，户口在天府新区，但在其他 11 区已经有房，目前限购中。想请教，预计成都天府新区（省政府迁入，天府机场建设等）未来的人口是否会如规划一样形成高度聚集？天府新区房价均价目前
    1.6w+，是否值得投资？四川省经济第二的绵阳和第三的德阳房产是否有投资意义？非常感谢！！


    答：令人吃惊！把视野放到四川之外吧！11 区的估计有不少都要优化置换。


    后记：之所以我说令人吃惊，有两个原因：一是因为他在一个地方投资了那么多，采用的是类似股票指数基金的投资方式，省会内各区“城市股票（房子）”都投，博的是普涨和通胀，完全没有思考城市化规律，以及，城市内部的人口及家庭结构、产业结构变迁；二是鸡蛋完全放在一个内陆省份的省会篮子里，丝毫没有考虑省外更有价值的地方。


    上面两个例子，都局限于本地省会投资，幸好这两个省会在国内未来的城市竞争中，都还是不错的城市。但不论从分散风险、追求更高回报、规避限购、孩子未来可能会到更高等级城市等角度，都应该及时跳出自己的生活圈子，拥有全国视野，具备将来孩子可能生活在别处，现在也应该投资到别处的视野。


    问题三：童老师，您好。在东京投资公寓或一户建用于出租是否合理？收益率在 5%左右。国内有一门市，市值 300 多万，是否可以出售用于东京房产投资？日 本贷款利率在
    2.5%左右。坐标沈阳。谢谢！


    答：“房产投资收益含涨价和租金两部分。城市化基本完成的国家和地区只是进一步集聚的问题，回报率很难高于国内优秀城市。至于沈阳，长期看是可以把资产尽可能多地移出的城市。”


    对方再回复：“考虑外汇管制和人民币贬值等因素才有此想法，国内拓展难度和机会也不多，国外相对规范。所以才有此想法！”


    我的观点是：人民币贬值，外汇管制，长期看国内优质房产更看涨。而如果人民币对日元也贬值，则现在出去买日元资产，即使能投得去，也直接相当于日元资产更贵了——定价不变，但是换同样的日元，需要更多的人民币。

