    ## 国际金融中心的比较与反思


    真传，纽约紧随其后，并且发扬光大法治与自由传统；东京则是二战后追随普通法的后起之秀；香港则承袭英治传统成为和中国大陆这个世界超级人口大国与世界沟通的“超级联络人”。


    中国大陆和印度作为超级人口大国，没有与其经济和人口地位相匹配的世界金融中心。


    新加坡和迪拜则更像是异数，人口不多，地域窄小，历史短暂，人文、地理、环境和历史积淀都无足轻重，直接采取拿来主义，高层建筑，把法治、自由和低税作为立国立城之基，势如破竹，所向披靡。


    现代社会，财富创造跟土地、人文、地理、历史，甚至人口，都关系不大。


    是法治和自由吸引了全世界的财富和工商文明源源不断地往这些城市输血，用高薪吸引全球优秀人才，源源不断地向全世界提供最文明最有活力最专业的服务贸易，最终成就了这些城市的高房价。而不是这些城市奢妄吸咬当地年轻人尤其是中低收入人群的血成就世界级富豪！


    看懵了这六座国际金融中心和枢纽城市，才能真正看懂财富与文明。否则，一味拿着“贫富差距”的搅屎棍乱舞，只会搞得原本文明清洁的空气气氛熏天。真若实施“劫富济贫”政策，不论是高税收还是定点抑制度强，结果就会像南非的约翰内斯堡，富裕的白人跑了，昔日豪华的城市，一夜之间成为空城鬼城，白白占有豪华公寓豪华宾馆的黑人，就业机会更少，生存处境更难，也维持不了高端住宅的生活成本，纷纷又搬回南城的贫民窟。


