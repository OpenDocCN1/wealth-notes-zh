    比如一座纯旅游城市，什么第二产业都没有，你能说它产业空心化？


    北京二产 GDP 占比最低，却没有被作者列入“产业空心化”范围，也没有给出理由，看似乎有“两重标准”。


    一个很大的时代背景是，中国的工业化占比是过高的！过高的占比，并不健康。根据北大教授周其仁先生的说法，是“工业化超前，城市化滞后”：


    用世界银行的数据，2010 年全球平均城市化率为 50.9%，而工业化率（约等于第二产业的 GDP 占比）不过 26.1%。而中国的两率的比值是 1.09（即城市化率
    / 工业化率 = 51.3% / 46.8%）。全球的平均比值是多少呢？1.95（50.9% / 26.1%）。中国的工业化率相对全球平均水平高出了近一倍。


    与发达国家的区别就更为显著了。2010 年，美国的城市化率 / 工业化率为 4.1，即城市化率高达工业化率的 4.1 倍。同年同一比值，法国为 4.11，英国为
    4.09，德国为 2.64，日本为 2.48，共同呈现出城市化率远高于工业化率的特征。即便是“金砖五国”中的巴西、俄罗斯、南非和印度，城市化率除以工业化率的比值也分别达到
    3.22、1.97、1.38 和 1.15，都比中国的高。


    所以，把第二产业 GDP 40% 定义为健康，低于 40% 定义为“产业空心化”，打造的标准和尺子就是错的。


    正确的应该是多少？不同时期不同的比重，越进步发达比重越低。


    # 4


    越发达的国家和地区，第一、第二产业占比越低：


    中国香港，第一、第二产业占 GDP 的比重加起来也不到 10%，第三产业占比超过了 90%。


    澳大利亚人的工作图景，原始资料来自澳大利亚国家议会发布的报告（2016 至 2017 年），上面列明了各个行业的从业人数：'
