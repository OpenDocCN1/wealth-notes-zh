    # 教育与房产投资 兵分两路胜于孤注一掷


    童大焕—2019 年 10 月 18 日星期五


    +   1

    提问：童老师中秋快乐！我来自河北张家口。身边不少同事朋友，为了让孩子在天津高考，纷纷在天津买了房，落了户。也听说在半年前买了房子的朋友房价跌了。我有两个孩子，为了占高考的便宜，我必须现在决定是否在天津买房。我能拿出来的首付有限。我只能选择
    6 区内的老破小，或者武清的边缘，再或者是滨河（海？）新区的期房。我犹豫了。明知道天津并不适合投资，我可能未来十几年都不可能再卖掉房子。童老师，您觉得我该选择哪里的房子呢？按照您之前讲课，6
    区内是最好的，但是我没有经济能力，只能买老破小。请您帮我参谋一下，在我这个能力范围之内，哪里是最好的选择呢？


    答：这个问题好难回答。首先你要冷静地向自己，天津买房落户真的是为了孩子考一个更好的学校还是恐慌性跟风？万一将来高考政策生变，天津优势不存在了（这个谁也无法保证），你能不能承受得起这个成本？其次，天津的高考优势和河北相比，是否真的差别那么大？第三，付出那么高的资产代价，能不能保证孩子高考上一个台阶【二本变一本，一本变重点】？孩子成长过程中，有太多的不确定性；高考政策里，也有太多的不确定性。


    +   2

    评论：我跟她类似，也是为了孩子高考。我是河南的，我选择了武汉双柳国家航'
  - '[PAGE 111]


    天产业基地的孔雀城，兼顾投资和孩子上学，孩子今年一年级。想的就是航天产业是高端产业，那里做起来房子本身就升值，而且将来会修长江大桥和光谷对接。没升值的话，孩子高中去上学的活，在武汉考武汉的大学会比在河南好考一点。


    答：真的不要太指望双柳孔雀城升值，反正是明显升不过同时期武汉或其他省会更好地段。航天产业园谈不上现代意义上的高端产业，再说核心的国有部分大部分会配福利性住房。


    # 3


    提问：童老师好！请教一个教育的问题：当今社会想通过给孩子上各种补习班、压迫孩子天天去学习课本知识，最终目标是上个好大学以实现阶层跃迁，这个想法是错误的，因为未来社会不再需要学历，而需要创新，所以可以弱化学习成绩，而应该看重培养其具有天赋的特长。就是说即使考不上大学，但在某方面有专长，且可以持续学习，这样更容易实现阶层跃迁。这样理解对吗？谢谢！


    答：非常切中时弊的问题！一个人的成功，至少需要天赋、勤奋和时代机遇三要素，我们的家庭和学校教育已经病入膏育，到了快要把孩子逼疯的程度。而事实上，家长千方百计搞学区房、补习班，给孩子的都是最机械性的训练，甚至是灌输的多是错误的方法、有毒的知识。


    他们只是为了文凭。但不仅这种方法不一定能取得高文凭，同时文凭代表不了一切。人最可贵的品质和内在的能量发动机，在我看来是对自己的自信心、对自己和家人的责任心、对社会的善心、对世界的好奇心。


    昨天那位把身高体重学历文凭长相出生地都量化成分数的择偶对象，之所以认人无语，是过度精明约等于十分愚蠢。同一池子里长相体重大差不多的王八，活力还差出十分呢。同一个人，在不同的家庭环境和时代环境里，才能有时只能发挥
    3 分，有时却能发挥 12 分。


    你，就是别人环境的一部分。你的严苛，是鞭策还是绳索？


    现实中这种刻舟求剑的人其实很多，只不过程度不同而已。


    但话说回来，文凭作为社会最普遍的人才评价体系，是多数用人单位识别人才的第一道门槛，如果有能力去追求，还是要尽量去追求。这对本人的自信心和自尊心也有好处。除非在成长中，已经有一些特别突出的才能，达到了可以藐视文凭的程度。


    否则，为了否定文凭而特意去走一条别样的路，事实上要付出更多的艰辛，要有更强大的定力。


    另一方面，如果没有考上好的大学，没有取得名牌大学的文凭，也不必失魂落魄呼天抢地。世界广阔着，各行各业都在剧烈变化着，一个人对某些领域持久的兴'
  - '[PAGE 112]


    趣和专注，远胜于世界上最高档次的文凭。自己努力争取赚更多的钱，给孩子更有底气的财富支撑，让他经得起更多的折腾（前提是不能三心二意瞎折腾），让他到更广阔的世界见识世面。这一切，都很重要。


    4


    很多人追逐学区房或者通过买房入户等方式成为高考移民，试图获取高考竞争优势。但地方政府不傻，多数开放入户的房子都是偏远区域卖不动的鸡肋房，当地人不愿意买，卖给外地人，为土地财政做贡献的。


    而城市内部、同地段价格远高于同类普通商品房的学区房，则有可能在“教育公平”的社会压力下，学区资源被地方政府人为打乱（比如一个小区对应一所学校变成同时对应多所良莠混杂的学校）。


    因此，多年来我一直建议“教育的归教育，房产投资归房产投资”，争取各自实现两边的利益最大化。


    教育有教育的规律，房产投资有房产投资的规律，硬捆绑在一起，孤注一掷，有可能两边的好处都没有得到，两边的坏处却都沾了。


    记得好像有一个笑话，某美女要嫁给喜剧大师卓别林，说，我们的孩子，一定有你的智慧，我的容貌。卓别林不动声色地说：如果是你的智慧我的容貌呢？


    兵分两路，从战略上来说也是规避和降低风险的方式方法，即使孩子国内高考失利，如果房产投资成功，也可以确保孩子有更高的平台，在更大的全球范围内找好学校。


    【完】


    # 房产调控政策要大变？


    重大焕—2019 年 10 月 22 日


    1


    时间进入 2019 年 10 月中下旬，接二连三，南京、天津在几天内陆续放松限购政策，三亚、燕郊、青岛、厦门也出手了！


    前三个城市，都是全国房价前十。尤其是三亚，松绑特别彻底：对于实际引进并在三亚工作的大专以上学历人才，可申请购买 1 套住房。


    南京六合区规定，只要是有大专学历的外地人，提供居住证，就可以开具购房证明。此前，南京高淳区也已放开限购。这两个区域都属于远郊区县，一北一南，是南京最偏远的两个区域，相当于三四线城市。'
  - '[PAGE 113]


    天津对承接北京非首都功能疏解的项目，那些户籍暂未迁入天津的职工，其家庭在天津无住房的，可在天津购买1套住房，无需社保或纳税证明，文件同时还放松了天津的落户政策。该办法拟在天津滨海中关村科技园、宝坻中关村科技城试行，试行期限为一年的。


    此外，燕郊、青岛也传来放松限购的消息。燕郊暂定北京在燕郊分公司，或北京通州公司的员工，可在燕郊买一手房，无需2017年6月规定的3年社保或个税证明。


    各地降低购房门槛，大多数都通过人才政策的方式进行，也符合一城一策的政策规定，并没有违反房住不炒的大原则。


    可以肯定，随着经济下行压力加大，各地对房地产限购限贷等各种调控措施也会不断往宽松方向发展，但都以人才之名，犹抱琵琶半遮面。


    提间：严厉的房地产调控政策显然是导致经济下行的因素之一，调控究竟是为了什么？说是要控制金融风险，可这完全可以通过提高首付比例来控制呀。不让富人买房导致资金资产外流，得不偿失。


    答：2010年年底之前是有限购的，但有限贷。2011年初开始有限购，我在2011年2月11日在FT中文网写了篇文章，认为严厉的限购限贷会扭曲市场信号，导致本不该涨的三四线城市房价上涨并进而加剧这些地区供应过剩，比高房价还可


    2017年3月17日以后，为了消化三四线城市严重过剩的房屋，进一步收紧了一二线城市的限购限贷，同时三四线城市搞专项棚改资金、货币化棚改、涨价去库存。


    这就是：货币水龙头开得哗哗响，但是关闭大城市阀门，让水管射程远一点，射到各中小城市。


    从这个简短回顾中，我们知道，严厉的房地产调控有多项功能：防止房价涨太快导致金融风险；把货币之水挤到过剩地区去地方债和库存；迎合民间居丝和民粹舆论对高房价打压的需要；后来的限售还有让一手房卖久一点、土地财政苟延残喘长久一点；大城市限制土地供应则还妄想作为控制大城市人口的手段之一。


    所以，严厉的房地产调控目的多样，政出多门，随意性大。前两天我说在中国几乎所有行业中，房地产行业的政策环境和舆论环境最差，就是这个道理。这里面的生死跌宕，不论开发商，还是个人，比其它行业都要更惊心动魄、更剧烈得多，都要面临更加艰险的环境。'
  - '[PAGE 114]


    近十年来，由于很多房地产高价值区域都纷纷遭遇各种严厉的调控政策，让很多人误以为限制越严的地方越有投资价值。这是错误的判断。


    对于地方政府来说，各种调控政策各有各的算盘，有的甚至是为了搭便车，让人感觉越限越有价值，然后变相反放松。


    下面这个限价，也是一种土地财政的营销策略：


    匿名用户 提问：老师 您好。朋友让我帮她咨询一个问题，她家乡福建省宁德市，宁德市区新开楼盘被政府限价了不能超过一万一，比二手价格便宜，于是出现房少人多，全民参与摇号买房。她及她父母觉得要抓住这个机会买一套，虽然我跟她说这是政
    F 开发商挖的一个坑，真到了二手卖都卖不出去，但貌似说服力不够，希望借您的口可以阻止她加入这个骗局。谢谢！


    答：昨天有好友也问我宁德这个事。限价在大城市就是真的想限住价格上涨太快，在一些人口流出的小城市就是两个大庄家联手做的局。但个人认识不到，怎么劝也没用的。人家还觉得你挡了她的财路呢，吃力不讨好。而且，再没有价值的地方，也保不准短期会有非理性上涨的可能。到时人家还不知要怪你多久，好心没好报。因此，我劝你还是少操那份心。道不求人，医不叩门，佛度有缘人。


    # 4


    中国内地再好的城市，都需要土地财政。同时，政 F 不希望资金只往少数地区流。因此，热点城市的调控会不断变着花样，但一线和超一线城市要想完全放开，几乎是不可能的。


    调控如筑水坝，一旦水坝已经蓄水（房地产购买力），贸然炸掉水坝，会引发意想不到的危机。这也是 2014 年，中国社会科学院说 2015 年一线城市限购会全面放开，我断然判断不可能的原因。


    未来，这个基本面不会变。


    # 5


    很多人表错情、达错意，以为房地产调控主要目的是降房价、让更多人买得起房。


    事实是，在土地财政金融约束双重作用下，不论大城市小城市，地方政府都是怕房价涨太快，更怕房价跌。这也是房价调控和政府托市的基本面。


    当然，在人聚财聚人散财散的城市化背景下，房价最终的决算因素是人口的多寡、密度和人口收入水平。


    【完】'
  - '[PAGE 115]


    # 70 年房屋产权以及产权的本质


    2019. 11. 15


    1


    匿名用户 提问:


    童老师好，我到过台湾泰国，非常羡慕当地的土地的永久产权，甚至一度动心进行投资。您认为我国什么时候有可能给予公民完全的土地产权？


    答：


    何必纠缠于这些无意义的概念？


    所有权在很多时候是没意义的，有意义的是支配权。


    英属国家，土地都是英国国王所有，但个人和企业支配权可以长久。


    我们的土地，70 年产权，到期自动续期，跟永久有什么区别？


    即使 40、50 年产权的商办用地，你能想像到期无偿收回的局面吗？这是根本不可能的嘛。有民，才有国。这是一个基本常识，国家还靠着民众创造出来的税收才能运转呢。国家运行过程中，（和民众）是丝丝入扣的经济关联关系。


    像农村宅基地，理论上是永久，但由于没有交易权【仅限本村内交易，在偏远农村约等于没交易。只有地段好人口较密较多的区域可能还有需求。剩下的就只能等待被征地才稍微有点价值】，永久有何意义？就像一颗煮不熟咬不烂提供任何不了任何营养的鬼豆子。


    2


    这个问题牵涉到如何正确认识产权。


    产权包括财产的所有权、占有权、支配权、使用权、收益权和处置权。产权最重要的是支配权和处置权。


    比如现行中国农村宅基地产权，法律上属于村集体所有，永久性质，但占有权、支配权、使用权、收益权和处置权属于本村村民具体个人和家庭。


    但是它又被法律限制了金融抵押方面的权属，也限制了向本村村民之外的公民出售的权属，它的使用才价值和价值交易就因此大幅度贬损。所有权和占有权即使永久，又有什么用？'
  - '[PAGE 116]


    同样，有些东西法律上说“全民所有”，但是真正的支配权却在“一朝天子一朝臣”、“铁打的营盘流水的官”——管理者手上，而且他们管理、支配、使用这些“全民所有”的东西时，因为经济学上的公地悲剧原理，都是抱着短期行为在支配和使用这些“全民所有”的东西，有权不用，过期作废，而作为“全民所有”的“全民”，既没有分红，也没有权利选举管理者，更没有账本公开监督管理者，反而只有乖乖地承担这些行业垄断高价的服务成本的“资格”。


    这样空有所有权没有支配权、使用权、收益权和监督权处置权，又有什么用？


