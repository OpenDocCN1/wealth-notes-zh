    ## 当投资和自住矛盾 投资优先！


    **童大焕——2019 年 8 月 19 日**


    ### 1


    理性投资是违反大多数人习惯和直觉的“人生最深刻的修行”，甚至可以说，投资一定是必须“反人性”的事情。大部分人做不到。也正因为如此，古今中外，要想破除财富的二八定律，比海枯石烂还难。


    ### 2


    有星球会员问：“童老师，看见您写了一句话，投资和自住有矛盾，投资优先？请问如何理解。谢谢！”


    答：“除非你已年老，否则服从资产增值比服从当下居住更重要！”


    此话怎解？


    如果人到老年，当然舒适安心最重要，所以原则上就不再考虑投资的事情了。


    当然，如果年轻时都忙于工作，中老年后歇下来，又有浪迹天涯看遍世界的决心和勇气，那仍然要以投资为主——把所有资产投到租金最高的中心城市的市中心，然后拿着租金，纵横四海去也。去看遍人间最美的风景，住遍人间最有味的宾馆，享受人间最好的服务，吃遍人间最好的美食。


    如果还年轻，就请一定，一定牢牢坚守房产投资优先于自住的基本原则。


    这种做法表面上看很没人性，但就像古今中外的长子继承制一样，道是无情却有情。这样做的原因有二：


    第一，在人类历史上从来没有历史经验的人口和财富大迁徙背景下（背后的原因是物质生产在科技进步下极大丰富，但占比越来越低；非物质生产、服务业占据财富主流，导致人口越来越集聚，城市越来越收缩，世界越来越陡峭），人口剧烈流动，城市之间、城乡之间、城市内部房产价值发生剧烈的跌宕起伏，能够跟人口和财富流向的房地产投资，其回报远大于绝大多数普通人一生、甚至一整个家庭的工资劳务性收入——关于这一点，陈志武领衔的量化历史研究通过
    150 年世界 16 国的投资回报统计已经证明，法国学者皮克蒂的《21 世纪的资本论》也已经证明。我们普通老百姓，大量身边的例子也已经证明。不过，和过去 20
    年的房地产普涨不同，未来 20 到 30 年，会有很多地方大涨，很多地方跌跌不休，很多地方账面上涨了但是有价无市，和日本的城市收缩一模一样。


    这种时代背景下，你说，咱们是不是应该把房产作为最重要的投资品种，是否应该把“投资第一”作为我们的人生规律？


    退一万步说，在新的城市化背景下，绝大多数人成年后上学和工作，都是——离开家——离开家——离开家——重要的话说三遍！


    离开家意味着什么？意味着离开父母，同时也意味着离开原有的房子！这种离开，很多时候甚至远隔千里万里，这叫背井离乡！为了更广阔的天空，为了更远大的理想，对于大部分人来说，背井离乡，不远万里地求学和工作，为了啥？为了赚更多的钱！


    而如果一套好房子，放在最合适的地方，可以坐地生财，帮我们生长出比工资劳务收入多得多的钱，为什么非得要买一个房子自己住？如果自己住的房子涨不过专门买来投资的房子，理当“你买的房子给别人住，你租别人的房子住”。


    再说，人的一辈子，四海漂泊，到处流浪；即使极少数人，一辈子只在一个单位待着，那单位，在你的一生中，也可能搬家若干次。我们的住房，也要不断地升级换代。怎么可能，我们自己就一辈子子在一套房子里住到底呢？


    ### 3


    而当我们投资正确，房产升值比别人更多更快，以后就有更多的资金进行资产优化，到一定年龄和财务阶段，就可以在更大的选择空间里，寻找自己理想的居所。


    ### 4


    如是，观念一变，价值千金；观念一转，黄金万两。


    多动脑子，想通了，想透了，就这一个观念转变，给你带来的回报是星球费用的千倍万倍——千倍万倍不是信口开河，而是算过——星球当下费用 365 元，百倍是 3.65
    万，千倍才 36.5 万，万倍则是 365 万。我们买对一套房子，在一生的资产增值中，何止百万这个数？【完】


    ## 风格纯粹用冰冷的理性谈连岳 谈炽热的情感


    **2019 年 8 月 22 日**


    匿名用户 提问：老师您好：我有一个问题想请教一下您，我的男友，是个很帅气的男孩子，也蛮有才华的，我们感情也一直不错。但是他有一点让我很 不舒服，就是他有不少的异性好友，和他的关系非常密切，里面还不乏暗恋他的人。我们常为这事拌嘴，每次吵架他都会搬出老师您的理论来给我扣帽子，说我作，干涉了他的自由，触犯了他的边界，我想问一下老师，要求自己的爱人跟别的异性保持距离算是越界吗？


    风格纯粹答：我们首先看逻辑：你要求你男友跟异性保持距离的博弈条件是什么？或者说筹码是什么？他如果继续这样，你就离开他，结束这段关系。这个逻辑没毛病，合情合理。


    同样的逻辑：你男友如果坚持说，即使你选择离开他，他也不放弃跟异性好 友交往的权力。这个说法也符合逻辑，没毛病。这样来说，边界的定义就清楚了。人与人之间的交往，边界感就是这样博弈清楚的。一段关系的极限边界在哪？这段关系被迫结束，那就是边界的极限。智慧的女人不是靠这种极限的博弈获得对
    方的边界，而是看对方的心是不是愿意。当你用无休无止的吵闹，结果就是你跟他的边界越来越远。你有本事，让他心甘情愿缩小跟你的边界，那是你的智慧。爱的本质是吸引，而不是斗争。这是很多蠢女人永远不懂的。你以为男人是地盘呢？谁先占领归谁？多少婚姻跟爱情就是在斗争、占领地盘的思维下，烟消云
    散的啊！你要是真爱你的男友，你想办法让他在跟你的关系中，舒服。变的更有吸引力。这是我建议你的方向。结束你以前争吵的策略吧。2019 年 8 月 22 日 (星期四)
    下午 3:29


    连岳为什么在情感、婚姻问题上那么受到大家欢迎？因为他长期以来，就是说一些有常识，有逻辑的话来解析情感，婚姻问题。把很多陷入情感，婚姻中 人们杂乱无章的思维梳理清楚。再加上他朴实简洁的文字，这也是连岳受到很多女人尤其是家庭主妇欢迎的原因，他堪称中国最好的情感博主，也是正能量的，因为
    他的所有建议都是建设性的，让你活在这个充满瑕疵的人间，正确的面对问题。


    很多人，尤其是陷入情感中的女人，长期被一些带毒的情感鸡汤喂养，对待情就是天堂般的思维，仿佛不是活在人间。比如，她爱上一个男人，在物质上呢，男人赚钱全部给她是应该的，房本上在娶她之前加她名字也是应该的。跟她相处，全部心思放在她身上也是应该的。所谓爱她就是爱她全部，没有那么多为什么。同样的逻辑用在男人身上就是渣男。这种流氓般的思维，再加上某些流氓情感博主，搅拌上更毒的鸡汤，嗯，田园女犬就横空出世了。


    所谓的边界感，是每个人自己定义出来的，不是别人定义出来的。无论怎样亲密的关系，都是彼此独立的两个个体，极限的边界就是这段关系破裂为标志。也就是你给对方提供的价值，超越这个边界是他无法忍受的，宁愿以结束关系为代价，这是极限的状态。最好的相处关系，边界最好离这种极限边界越远越好。当然这个距离取决于不同的人。


