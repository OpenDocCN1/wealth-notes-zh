    深圳房价应声而涨。且因为是卖方市场，所以房价上涨一般都超过了增值税减免。


    8


    2019 年 11 月 13，我给星球会员和弟子群发了一则短评：


    据朱罗纪 2019 年 11 月 11 日《关于深圳经济的一些看法》：深圳民间投资增速从 2017 年的 22.5%，下滑到 2018 年的 12.5%，进而剧烈下滑到
    2019 年前三季度的 3%！深圳经济历来以民营企业为支柱——截至今 5 月，深圳民营经济商事主体达到 314 余家，民营商事主体占比达到 97.66%。那么，民间投资只增长了
    3%，意味着深圳的民营企业基本都不投资了！


    大焕评：


    深圳民企不再投资，意味着对未来经济信心的丧失。其中有退场论原因也有产能过剩等各种原因。


    只有私营投资才能促进经济增长。如果没有了私人投资，未来是很悲观的。


    病来如山倒病去如抽丝。要重新恢复民间投资信心，除非有大的营商环境和气候的改变。在此之前，用房地产投资代替一般民间商业投资，将是不得已的选择。


    但也不要指望 2016 年至 2018 年那种动不动一年上涨 100%或 50%的暴涨。


    未来两三年，一二线城市要入市买房的要抓紧入市了。三四线及中西部和北方地区能够出逃的要抓紧出逃。


    9


    综上，我再强调一遍，经济增长的本质不是在过剩的“实体经济产能”里钻死胡同，而是要在大城市化、非物质生产性服务业领域扩张信用。


    如果没有个人和私人企业的信用扩张，如果货币不能像流水一样自由流动，生产再多的物质商品，也只能在过剩中或者烂掉或者生锈，生产和制造过程还浪费资源、制造环境污染；赚了再多的钱也只能像守财奴一样守着钱包、存在银行和地窖，不能通过自由市场流通创造新的就业机会。


    明明过去四十年经济一直高增长，明明大部分人在过去都积累了很多财富，为什么经济却会一夜之间突然失速？'
