    # ### 告别实体迷信 经济增长的本质是信用扩张


    **2019.11.16**


    1


    知识星球会员提问：童老师，有点想不明白：经济失速了，很多行业民营都不挣钱，可是深圳房地产，今年涨幅很高，核心区南山区随便 8 万起落了。没有实体经济的支撑，这个房价还能一直往上吗？？


    答：我会用一篇文章来回答这个问题。


    2


    2019 年 11 月 12 日，在“财经年会 2020：预测与策略”上，中国人民银行原行长周小川先生有不少观点和本人“英雄所见略同”，他说：'
