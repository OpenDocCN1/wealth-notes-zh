    购物，医院，学校等。


    对个人而言能持续匹配你和家人生活需求的房子（与自身购买力相匹配）；升值趋势明显的房子（基本条件如地段和持续集聚与投入能支撑价值）；容易变现的房子，北京核心地段的新房次新房，户型
    OK，楼层 ok，小区环境 OK。


    地段和配套。


    前提是人口长期流入的城市；小区较大，环境好，入住率 70～80%以上；周边有好几个连成片的较成熟小区，且都比较新，2000 年后的电梯房；小区附近有幼儿园和中小学，只要有学校，不要求是学区房；交通方便，步行
    10 分钟以内有多条公交或 brt 或地铁路线，最好是有其中两种或以上；周边商业发达，附近有大中型购物广场或超市；离自己上班地点车程单程不超过半小时，或车程半小时内有密集写字楼；车程半小时内有三甲综合医院。以上条件都需具备。


    大众化的，就是普遍人都愿意接受的，容易有人接手的，买房投资就要想下一个接手人。看得见的话就是周边配套齐全，小区环境物业，装修大众。


    ......


    3


    我读了几乎所有的回答以后，整个人蒙在那里。大家说的好像都对，又好像都是正确的废话。我把它一一罗列，是几乎每个人都可以对号入座，都差不多容易掉进类似的陷阱。


    我绞尽脑汁想啊想，问题到底出在哪里？终于脑洞开了，被我我想通了：原来是答案太正确了！有时正确到无可挑剔，而现实，远没有纸上的答案那么完美。


    都对，是因为说的是千真万确的真理。都不对，是因为一旦要落实到具体操作，恐怕包括回答的人，大部分要抓瞎。


    尤其是，设立了太高的标准，在现实操作中，后果是非常严重的——会自觉不自觉地，排斥达不到相关标准的投资标地，从而在无形中，自我阻挡和放弃自己本应该把握的、不那么完美的机会。


    范冰冰又年轻又漂亮，还特别有钱，是不是大家都想追？


    但若无潘安之貌子建之才石崇之富倾国倾城之权，敢去高攀吗？不敢，除非被她看上，否则，一味只以范冰冰为择偶标准，结果会怎样：99.9999%的可能性一辈子要落单。


    所以，当我们问什么样的房子是好房子的时候，应该代入自身条件，再来进行判断，才是可操作而且令人纠结令人犹豫令人摇摆不定的真实选择。'
  - '[PAGE 67]


    一定要有基本的立足点，否则再好的愿望和判断，都无法变成自己的实际行动。


    首先必须立足于自己的约束条件。经济学实际上就是讲人和国家在约束条件下的行为理论，讲究的是约束条件。


    经济学这个词太糟糕了！！！让人望而生畏，以为这只是治国理政才需要的学问。应该正本清源，回到【约束条件下】“人的行为研究”这个本义上来，才能从底线逻辑上，去研究和思考个人和群体在不同约束条件下的行为选择，找到影响社会发展和个人选择的关键症结，才能更有利于做出符合人性的决策，才能更有利于不同阶层的和谐共处，才能更有利于相对弱势阶层的突破与发展。


    从哪里着眼、从哪里入手，很大程度上会决定一个人能走多稳，能走多远。


    4


    必须立足于自身约束条件，再来谈“优质房产”，这个问题才是有意义的。


    这么一来，“优质房产”就不再有唯一正确答案，而是更加的丰富多彩了：


    如果我的购房资格、首付能力、月供能力，够得上一线城市最核心地段的最好住宅，面积又不是过于阔大，那个房子对我就是优质资产；钱不够，同地段同类型房屋最小面积也仍是优质资产；


    退一步，有钱没有购房资格，其它比较容易落户的二线城市核心地段优质住宅是不是优质资产？


    再退一步，一线城市优质地段不限购高租金的优质写字楼是不是优质资产？


    再退一步，有资格但钱很少，二三线甚至三四线城市还有十年八年人口回流的地方的不限购优质住宅，是不是优质资产？


    再退一步，类似香港劏房、棺材房、笼房的核心地段条件较差老破小是不是优质资产？


    再退一步，一个房子，不一定能够赶上一线二线城市的涨幅，甚至不一定能够赶上通胀，但已经是自己能力极限，最小面积最低单价总价的最高承受极限，按揭以后，将来可能卖出的价格勉强够成本和月供，像农人以前在乡下养猪一样，日积月累帮你攒下了一笔财富，算不算优质资产？


    再退一步，像印度那样的国家和地区，你扯一块塑料布在公地上搭个棚子，从此就是风能进雨能进国王不能进的家，对一个白手起家赤手空拳的人来说，也是优质资产【比喻】。


    彼之陷阱，此之高举；彼之美味，此之砒霜。'
  - '[PAGE 68]


    结论，能够让自己积累财富或实现财富增值、且容易变现的房产就是优质房产。


    我们应该“眼高手低”：眼界要高，但是身手要低，既分得清优质资产的层次，又能脚踏实地，根据自身条件一层层去够自己够得着的层次。【完】


    # 未来只有少数城市有投资价值 房地产还能成支柱产业？


    我认为提问者视野中至少有两个巨大的盲点，如果没有这两个盲点，这个问题不会被提出。这些盲点其实连专门研究机构都难以避免。


    童大焕—2019 年 9 月 12 日星期四


    1


    问：童老师您好！我的问题是房地产在前 20 年作为支撑经济的最大支柱产业是没问题的，但是今后中国大部分地区的房地产是严重过剩，那么在那些地区的房地产业会大幅萎缩，您说将来只有不到
    20 个城市有房产投资价值，那么就是说将来房地产发展较好的不到现在城市总量的 5%，这样的话房地产产业还能作为经济发展的支柱产业吗？


    这个问题我还是先交给了知识星球的会员们，请大家一起来回答，目的是启发大家独立思考。没有经过思考的知识，就像没有经过消化的食物，是不可能成为自己的营养和智慧的。我提示曰：“我认为提问者视野中至少有两个巨大的盲点，如果没有这两个盲点，这个问题不会被提出。大家来说说，哪两个盲点？如何让自己避免这两个盲点？"


    2


    仔细分析，提问者至少有三四个重大盲点：


    +   第一，不动产是无法移动的，但是人在剧烈移动。


    +   第二，人口流入的城市内部，大量房屋面临更新换代。


    +   第三，即使是不到当前城市总量 3% 的人口流入型城市内部，也在进行着剧烈的城市内部变迁，以及从 30 公里半径外向 30 公里半径内的板块迁移运动。


    以下我们逐一分析。


    3


    第一，房地产不动而人在剧烈运动。


    据预测，未来十年将是人类历史上最大规模的城市移民时期，到 2030 年，全球 60% 以上的人口将居住在城市。据国际货币基金组织预测，到 2035 年中国城市'
  - '[PAGE 69]


    化率将达到 70-75%，这意味着未来不到 20 年时间，中国将有 2.5 亿人从农村进入城市。同时，将有 30%-50%中小城市人口向大城市迁移，这部分人口可能高达
    1.5 亿人【我估计人数可能还会更多】。


    人口向大城市集中是世界发展的普遍规律，这使得大城市有限的物理空间正在不断地向高处和密处生长。


    按照世界各国房地产的发展周期统计规律，一个国家城市化率在 30%到 70%阶段，往往是房地产行业爆发和高速增长阶段。目前美国总体平均城市化率达到 83%，一些都市圈的城市化率已经接近
    100%，而目前中国城镇化率才 57.4%，如果以 83%为标准，中国还有 3 亿人的潜力缺口；如果以 90%为标志，中国还有 4 亿多人的潜力缺口。未来
    20 年间，中国城市将增加四亿人口，超过美国的总人口，其中会有超过 2.4 亿的移民。（《美国城市化和中国的比较》 2017-12-21 23:59 地产总裁内参）


    也就是说，人口不仅从农村向城市迁徙，而且从中小城市向大城市迁徙，这个过程中，过去 20 年抑制大城市、扩张中小城市的战略，已经使大量中小城市和乡村房屋过剩，但是，占城市总量仅
    3%左右【s20/661】的城市，房屋供应是严重短缺的（中国大陆（不含港澳）目前有 4 个直辖市，283 个地级市和 374 个县级市，一共有 661 个城市）。


    这就是中国特殊的城市干预政策下的世界别样风景：房屋的严重过程和严重短缺同时并存，而且长期并存。


    规律挡不住，那么未来，过剩的就永远过剩，短缺的将持续补课。


    人聚财聚，人散财散，在大城市化背景下，人口集聚的地方也就是财富集聚的地方。未来有投资价值的城市也许不到 3%，但这 3%的城市，将聚集全国 70%、80%的房屋价值。而其中，大部分房屋还没有建成呢！


    其它中小城市，价值严重缩水，只变成人们的第二、第三居所，甚至长期空置。


    # 4


    第二个盲点，占 3%甚至不到 3%的人长期流入型城市内部，大量房屋面临更新换代。如果没有人为压制，房屋需求是永无止禁的，有些人可能不停地在买卖置换（贡献好多税收），不停地在追求品质更高的居住环境。


    不妨比较一下美国。


    根据黑布林北海居《2017 年美国 GDP 分行业核算数据》（腾讯网 2018 年 4 月 23 日）整理的数据：2017 年美国以 193906 亿美元
    GDP 位居世界第一；中国以 122377 亿美元紧随其后，约为美国的 63.1%。2017 年，美国房地产业增加值 23874 亿美元，占 GDP 的比重为
    12.3%。2017 年，中国房地产业增加值 7976 亿美元，相当于美国的 33.4%。'
  - '[PAGE 70]


    2017 年末，中国大陆总人口 139008 万人，其中城镇常住人口 81347 万人，占总人口比重（常住人口城镇化率）为 58.52%，户籍人口城镇化率仅为
    42.35%。


    美国只有 3.3 亿人口，城市化率 83% 以上，中国的人口比美国多得多，城市化率几乎只有美国的一半，城市住房需求应该比美国大得多，而且，城市化和房地产都还处在被中断
    50 年以后（1949~1998）的补课过程中，按理说，中国房地产业增加值占国民经济的比重，应该远远高于美国才对。事实却不然，中国 GDP 有美国的 63.1%，房地产业增加值却只有美国的三分之一！


    也就是说，美国城市化已基本完成，房地产支柱地位却比中国还支柱。恰恰说明，中国过去的房地产政策，尤其是大城市限购限贷政策，对房地产太不友好，抑制了它应有的发展。


    # 5


    第三个盲点：城市内部变迁和位移，照样在制造巨大的房屋需求。


    创建于 2011 年、全球城市空中出行领域的先行者、德国城市空中出行公司 Volocopter（尚未完成商业化）的内部分析发现，大多数特大城市的城市区域距离地理中心点不到
    30 公里，而服务于这些城市的大多数主要机场距离市中心不到 30 公里。


    Roland Berger5 和保时捷咨询公司的研究也支持这一观点。


    相关研究，和我们城市化战略研究院所作的超级大城市 30 公里左右半径极限研究，结论高度一致。


    但是我们过去的城市化政策，往往是疏散大城市中心人口，导致人口过度向郊区和远郊扩散。


    但同时，改善性住房的换房趋势却告诉我们，大部分改善住房，都有着明显的回归市中心倾向。


    是规律，就要回来。


    这样一来，城市内部“三十年河东三十年河西”的版块更新和漂移运动，以及向三十公里半径内部收缩的运动，都会制造巨大的房屋需求。


    # 6


    其实还有一些盲点如住房结构调整。


    恒大研究院院长任泽平表示，从住房来源结构看，当前全国城镇住房存量中商品房约占 40%，自建房约占 30%，还有 30% 为原公房、保障性住房及其他。'
  - '[PAGE 71]


    由此可见，新型较宜居的商品房，不到 40%。


    未来，还有家庭人口小型化等一系列结构性要求，都会对城市房地产市场制造新需求。


    # **7**


    为什么会有三个以上重大盲点？这些盲点其实连专门研究机构都难以避免。


    比如广为流传的“十年后一对夫妻 6 套房”论：业内人士分析，在中国人口老龄化加剧后，祖辈和父辈的房产将由第三代继承。而在计划生育制度下，大多数家庭构成都为“421”结构。即使按照祖辈父辈家庭都仅有一套房来计算，第三代年轻夫妇结婚时拥有的房产也将有
    6 套，这使得市场上的住房供应远远大于需求。


    另外，西南财经大学中国家庭金融调查与研究中心几乎每年都发布报告，称住房空置率高，房屋已严重过剩，其中 2017 年我国城镇地区住房空置率为 21.4%，全国城镇地区有
    6500 万套空置住房，等。


    造成这种盲点的根本原因，一是“目中无人”，没有真正建立起以人为本位的城市化和房地产研究尺度，没有把主要力量集中于“人会向哪里发展”这些基础问题，而是把更多的力量用在思考“区域发展”和简单的数量统计上面了。


    二是缺乏对城市化规律的把握，缺乏“世界越来越陡峭、人口越来越集中、城市越来越收缩”的城市化规律知识，用静态而不是用动态的眼光来看房地产。这就会导致“房屋已经比人多、房屋很快比人多”的错觉。


    只要我们以人为尺度，只要我们有了高密度大城市化的知识，就会发现，现有的大部分房屋，什么“一对夫妻 6 套”，即使是真的，在人口散散的趋势支配下，其中大部分，未来不久就面临被空置、被淘汰的命运！


    而少数城市的新型住宅，则会人在聚财聚的趋势支配下，要用“六个钱包”，才能凑得起买房的首付。


    “六个钱包”全称为六个钱包买房，是指男方的父母、爷爷奶奶、姥姥姥爷加上女方的父母、爷爷奶奶、姥姥姥爷共六方，即“六个钱包”，“如果这六个钱包能帮你凑够首付的话，那么最好还是买房子”。该概念由央行货币政策委员会委员樊纲在
    2018 年 4 月 CCTV2《大讲堂》电视节目里提出。【完】


    # 不好卖的房子怎么处理？


    童大焕—2019 年 9 月 17 日星期二'
  md: '

    ## 9 地球村


    话说，以往的中国乡村，都是在外做官、经商、打工赚了钱，纷纷回来购买田置地，形成了人口向外、财富和文明回流乡村的双向流动。


    一栋农村大房子的建造，可以给当地靠黄土背朝天、一向靠土里觅食的农村居民带来农业收入无法比拟的巨大的财富分配机会。


    今天，如果同样的机会自由、平等地给予中国大陆的每一座城市和乡村，不限购城市豪宅，不限制乡村宅基地和农房交易与改造，会出现比历史上更繁荣的城乡房地产建设与购买热潮，因为，有了现代金融制度的加持。


    现代金融制度不需要等一个人赚足了钱才来买房建房，而只要有一定的首付（启动资金）和足够的月供能力，就可以以 200 倍的力量撬动财富【平均 5000 元月供支撑
    100 万元贷款】。


    而这向未来预支的 100 万元，迅速为当下提供了极大的就业和财富分配机会，给村里村外做钢筋的、烧水泥的、烧砖的、泥瓦师傅、木匠师傅、油漆师傅、家具厂、家电工人，等等，又都提供了
    3000 元、5000 元、1 万元的月收入现金流，他们其中的一部分人，再用其中的 3 千元、5 千元月供能力，去建设、购买属于自己的房屋，形成又一个循环......


    整个地球，也是这样的一个大村子。


    ## 10 对于房地产业的政策建议


    衣食解决以后，住行就是任何时代、任何国家和地区老百姓最重要、也是最大开支的需求，住的需求水龙头一旦打开，财富的货币之水就会恣肆汪洋地在中国大地上流淌。


    货币要像流水一样自由流淌，才能灌溉沃野千里，创造无数的就业和发财机会。因此，我们必须告别对房地产的妖魔化理解，从满足人民群众对美好居住生活的向往角度出发，“开放两端，保障中央”，尊重市场，用更科学、合理的房地产政策，鼓励房地产健康、理性、稳定地发展。


    开放两端，就是对城市的高端商品房和农村住宅和宅基地，完全开放，满足人们尤其是先富起来的人们对多样化居住的需求，让他们的财富在自由流动过程中，为社会创造更多的就业和财富分配机会。


    保障中央，就是对进入城市尤其是大城市的社会中间层，通过首付比例降低，缩小房屋面积、对中面积适当限购等方式，降低中低收入人群进入城市尤其是进入大城市的门槛。


    人类正迅速进入服务业时代、大城市化时代，这个潮流不可阻挡。我们的政策，应该预见和顺应这个史无前例的历史规律和潮流。【完】


    # 什么样的房产才称得上是优质房产？


    童大焕—2019 年 9 月 9 日星期一


    ### 1


    有星球会员问：童老师，具有什么样特点的房产才称得上是优质房产呢？


    我思忖这个问题有价值，就把它抛给众星友，让大家一起来思考，来回答，我到最后再来说出我的看法，这样大家可以比较一下，思考是不是和我在一条线上，不同在哪里，各自的优在哪里。


    我说：大家一起来回答下面这个问题，我会在最后以精华文章来作答。为了不让讨论太散，漫无边际，我们在思考这个问题时以投资为主要诉求，排除那种纯个性化的消费与审美诉求。大道至简，才能迅速抵达真相和真理。


    ### 2


    回答还真不少：


    - 离武汉中山公园 15 分钟路程的房子都是好房子。

    - 离国贸 CBD 半个小时路程的房子，也都是好房子。

    - 离上地软件园半个小小时路程的房子都是好房子。

    - 离杭州武林路 15 分钟路程的房子都是好房子。

    - 香港的房子都是好房子。（我说：“你是在思考还是在把一切可能和不可能都罗列个遍呀？”我还没说的是，香港也有让人亏死的房子。）

    - 城市：人口持续流入；地段：城市半径以内，高端人才就业中心；产品：宜居，物业较好。

    - 人聚财聚，人散财散；高山流水，静水流深；年轻人口流入城市；高科技、金融、高端服务业聚集的城市。

    - 抗跌，易租易卖，升值快。产权独立，人口流入地区中心城区，次新中小户型。

    - 房子不能太旧，有电梯，小区环境好，适宜居住，地铁附近，周围有超市，医院，学校，人气足，治安好。

    - 能住，好卖好租，人口流入城市，有电梯，次新，高收入人群聚集区域。

    - 低风险低首付高增值可快速变现。

    - 可交易，可抵押，超大城市好地段商住两用小户型。

    - 地段好，配套好，易出租，可变现。

    - 好出租，易变现。

    - 持续的产生现金流。

    - 好城市，好地段，好房子。可出租，可出售，可抵押，完美！

    - 次新房，三居或两居，楼下地铁站，菜市、超市、学校俱全。

    - 谋生人口众多，交易需求基数足够庞大，容易出手变现；在庞大基数基础上占位优质交通、教育、生活便利条件；拥有后续强势发展态势位置。

    - 好房子：符合租、贷、住、卖、的优质城市核心位置的房产。租：易出租；贷：有金融属性；住：有人愿意住；卖：好出售利于变现。这样的房产一定是好房子。

    - 好房子：租赁住卖，优质城市，核心位置。

    - 人口持续流入的一线城市，有高端产业高端人才聚集的区域，户型时尚、小面积的两房或三房、物业好、学区好、有地铁的优质楼盘。

    - 租金每年上涨，好出租的房子，每年净资产收益率上升，具有成长性，是房产中的茅台股。

    - 距商务中心通勤时间不超过 40 分钟；步行 10 分钟内附近有地铁或快速公交站，或者在建；步行 15 分钟内有综合型三甲医院，或者在建；步行 15 分钟内大型购物中心、商超，或者在建。

    - 房龄不要太老，2000 年以后的带电梯的房子是首选；通勤时间要在 30 分钟-60 分钟；产权清晰；自己不住的话，还出租；周边配套要适当完善，地铁，公交，购物，医院，学校等。

    - 对个人而言能持续匹配你和家人生活需求的房子（与自身购买力相匹配）；升值趋势明显的房子（基本条件如地段和持续集聚与投入能支撑价值）；容易变现的房子，北京核心地段的新房次新房，户型
    OK，楼层 ok，小区环境 OK。

    - 地段和配套。

    - 前提是人口长期流入的城市；小区较大，环境好，入住率 70～80%以上；周边有好几个连成片的较成熟小区，且都比较新，2000 年后的电梯房；小区附近有幼儿园和中小学，只要有学校，不要求是学区房；交通方便，步行
    10 分钟以内有多条公交或 brt 或地铁路线，最好是有其中两种或以上；周边商业发达，附近有大中型购物广场或超市；离自己上班地点车程单程不超过半小时，或车程半小时内有密集写字楼；车程半小时内有三甲综合医院。以上条件都需具备。

    - 大众化的，就是普遍人都愿意接受的，容易有人接手的，买房投资就要想下一个接手人。看得见的话就是周边配套齐全，小区环境物业，装修大众。


    ......


    ### 3


    我读了几乎所有的回答以后，整个人蒙在那里。大家说的好像都对，又好像都是正确的废话。我把它一一罗列，是几乎每个人都可以对号入座，都差不多容易掉进类似的陷阱。


    我绞尽脑汁想啊想，问题到底出在哪里？终于脑洞开了，被我我想通了：原来是答案太正确了！有时正确到无可挑剔，而现实，远没有纸上的答案那么完美。


    都对，是因为说的是千真万确的真理。都不对，是因为一旦要落实到具体操作，恐怕包括回答的人，大部分要抓瞎。


    尤其是，设立了太高的标准，在现实操作中，后果是非常严重的——会自觉不自觉地，排斥达不到相关标准的投资标地，从而在无形中，自我阻挡和放弃自己本应该把握的、不那么完美的机会。


    范冰冰又年轻又漂亮，还特别有钱，是不是大家都想追？


    但若无潘安之貌子建之才石崇之富倾国倾城之权，敢去高攀吗？不敢，除非被她看上，否则，一味只以范冰冰为择偶标准，结果会怎样：99.9999%的可能性一辈子要落单。


    所以，当我们问什么样的房子是好房子的时候，应该代入自身条件，再来进行判断，才是可操作而且令人纠结令人犹豫令人摇摆不定的真实选择。


    一定要有基本的立足点，否则再好的愿望和判断，都无法变成自己的实际行动。


    首先必须立足于自己的约束条件。经济学实际上就是讲人和国家在约束条件下的行为理论，讲究的是约束条件。


    经济学这个词太糟糕了！！！让人望而生畏，以为这只是治国理政才需要的学问。应该正本清源，回到【约束条件下】“人的行为研究”这个本义上来，才能从底线逻辑上，去研究和思考个人和群体在不同约束条件下的行为选择，找到影响社会发展和个人选择的关键症结，才能更有利于做出符合人性的决策，才能更有利于不同阶层的和谐共处，才能更有利于相对弱势阶层的突破与发展。


    从哪里着眼、从哪里入手，很大程度上会决定一个人能走多稳，能走多远。


    ### 4


    必须立足于自身约束条件，再来谈“优质房产”，这个问题才是有意义的。


    这么一来，“优质房产”就不再有唯一正确答案，而是更加的丰富多彩了：


    - 如果我的购房资格、首付能力、月供能力，够得上一线城市最核心地段的最好住宅，面积又不是过于阔大，那个房子对我就是优质资产；钱不够，同地段同类型房屋最小面积也仍是优质资产；

    - 退一步，有钱没有购房资格，其它比较容易落户的二线城市核心地段优质住宅是不是优质资产？

    - 再退一步，一线城市优质地段不限购高租金的优质写字楼是不是优质资产？

    - 再退一步，有资格但钱很少，二三线甚至三四线城市还有十年八年人口回流的地方的不限购优质住宅，是不是优质资产？

    - 再退一步，类似香港劏房、棺材房、笼房的核心地段条件较差老破小是不是优质资产？

    - 再退一步，一个房子，不一定能够赶上一线二线城市的涨幅，甚至不一定能够赶上通胀，但已经是自己能力极限，最小面积最低单价总价的最高承受极限，按揭以后，将来可能卖出的价格勉强够成本和月供，像农人以前在乡下养猪一样，日积月累帮你攒下了一笔财富，算不算优质资产？

    - 再退一步，像印度那样的国家和地区，你扯一块塑料布在公地上搭个棚子，从此就是风能进雨能进国王不能进的家，对一个白手起家赤手空拳的人来说，也是优质资产【比喻】。


    彼之陷阱，此之高举；彼之美味，此之砒霜。


    结论，能够让自己积累财富或实现财富增值、且容易变现的房产就是优质房产。


    我们应该“眼高手低”：眼界要高，但是身手要低，既分得清优质资产的层次，又能脚踏实地，根据自身条件一层层去够自己够得着的层次。【完】


    # 未来只有少数城市有投资价值 房地产还能成支柱产业？


    我认为提问者视野中至少有两个巨大的盲点，如果没有这两个盲点，这个问题不会被提出。这些盲点其实连专门研究机构都难以避免。


    童大焕—2019 年 9 月 12 日星期四


    ### 1


    问：童老师您好！我的问题是房地产在前 20 年作为支撑经济的最大支柱产业是没问题的，但是今后中国大部分地区的房地产是严重过剩，那么在那些地区的房地产业会大幅萎缩，您说将来只有不到
    20 个城市有房产投资价值，那么就是说将来房地产发展较好的不到现在城市总量的 5%，这样的话房地产产业还能作为经济发展的支柱产业吗？


    这个问题我还是先交给了知识星球的会员们，请大家一起来回答，目的是启发大家独立思考。没有经过思考的知识，就像没有经过消化的食物，是不可能成为自己的营养和智慧的。我提示曰：“我认为提问者视野中至少有两个巨大的盲点，如果没有这两个盲点，这个问题不会被提出。大家来说说，哪两个盲点？如何让自己避免这两个盲点？"


    ### 2


    仔细分析，提问者至少有三四个重大盲点：


    - 第一，不动产是无法移动的，但是人在剧烈移动。

    - 第二，人口流入的城市内部，大量房屋面临更新换代。

    - 第三，即使是不到当前城市总量 3% 的人口流入型城市内部，也在进行着剧烈的城市内部变迁，以及从 30 公里半径外向 30 公里半径内的板块迁移运动。


    以下我们逐一分析。


    ### 3


    第一，房地产不动而人在剧烈运动。


    据预测，未来十年将是人类历史上最大规模的城市移民时期，到 2030 年，全球 60% 以上的人口将居住在城市。据国际货币基金组织预测，到 2035 年中国城市化率将达到
    70-75%，这意味着未来不到 20 年时间，中国将有 2.5 亿人从农村进入城市。同时，将有 30%-50%中小城市人口向大城市迁移，这部分人口可能高达
    1.5 亿人【我估计人数可能还会更多】。


    人口向大城市集中是世界发展的普遍规律，这使得大城市有限的物理空间正在不断地向高处和密处生长。


    按照世界各国房地产的发展周期统计规律，一个国家城市化率在 30%到 70%阶段，往往是房地产行业爆发和高速增长阶段。目前美国总体平均城市化率达到 83%，一些都市圈的城市化率已经接近
    100%，而目前中国城镇化率才 57.4%，如果以 83%为标准，中国还有 3 亿人的潜力缺口；如果以 90%为标志，中国还有 4 亿多人的潜力缺口。未来
    20 年间，中国城市将增加四亿人口，超过美国的总人口，其中会有超过 2.4 亿的移民。（《美国城市化和中国的比较》 2017-12-21 23:59 地产总裁内参）


    也就是说，人口不仅从农村向城市迁徙，而且从中小城市向大城市迁徙，这个过程中，过去 20 年抑制大城市、扩张中小城市的战略，已经使大量中小城市和乡村房屋过剩，但是，占城市总量仅
    3%左右【s20/661】的城市，房屋供应是严重短缺的（中国大陆（不含港澳）目前有 4 个直辖市，283 个地级市和 374 个县级市，一共有 661 个城市）。


    这就是中国特殊的城市干预政策下的世界别样风景：房屋的严重过程和严重短缺同时并存，而且长期并存。


    规律挡不住，那么未来，过剩的就永远过剩，短缺的将持续补课。


    人聚财聚，人散财散，在大城市化背景下，人口集聚的地方也就是财富集聚的地方。未来有投资价值的城市也许不到 3%，但这 3%的城市，将聚集全国 70%、80%的房屋价值。而其中，大部分房屋还没有建成呢！


    其它中小城市，价值严重缩水，只变成人们的第二、第三居所，甚至长期空置。


    ### 4


    第二个盲点，占 3%甚至不到 3%的人长期流入型城市内部，大量房屋面临更新换代。如果没有人为压制，房屋需求是永无止禁的，有些人可能不停地在买卖置换（贡献好多税收），不停地在追求品质更高的居住环境。


    不妨比较一下美国。


    根据黑布林北海居《2017 年美国 GDP 分行业核算数据》（腾讯网 2018 年 4 月 23 日）整理的数据：2017 年美国以 193906 亿美元
    GDP 位居世界第一；中国以 122377 亿美元紧随其后，约为美国的 63.1%。2017 年，美国房地产业增加值 23874 亿美元，占 GDP 的比重为
    12.3%。2017 年，中国房地产业增加值 7976 亿美元，相当于美国的 33.4%。


    2017 年末，中国大陆总人口 139008 万人，其中城镇常住人口 81347 万人，占总人口比重（常住人口城镇化率）为 58.52%，户籍人口城镇化率仅为
    42.35%。


    美国只有 3.3 亿人口，城市化率 83% 以上，中国的人口比美国多得多，城市化率几乎只有美国的一半，城市住房需求应该比美国大得多，而且，城市化和房地产都还处在被中断
    50 年以后（1949~1998）的补课过程中，按理说，中国房地产业增加值占国民经济的比重，应该远远高于美国才对。事实却不然，中国 GDP 有美国的 63.1%，房地产业增加值却只有美国的三分之一！


    也就是说，美国城市化已基本完成，房地产支柱地位却比中国还支柱。恰恰说明，中国过去的房地产政策，尤其是大城市限购限贷政策，对房地产太不友好，抑制了它应有的发展。


    ### 5


    第三个盲点：城市内部变迁和位移，照样在制造巨大的房屋需求。


    创建于 2011 年、全球城市空中出行领域的先行者、德国城市空中出行公司 Volocopter（尚未完成商业化）的内部分析发现，大多数特大城市的城市区域距离地理中心点不到
    30 公里，而服务于这些城市的大多数主要机场距离市中心不到 30 公里。


    Roland Berger5 和保时捷咨询公司的研究也支持这一观点。


    相关研究，和我们城市化战略研究院所作的超级大城市 30 公里左右半径极限研究，结论高度一致。


    但是我们过去的城市化政策，往往是疏散大城市中心人口，导致人口过度向郊区和远郊扩散。


    但同时，改善性住房的换房趋势却告诉我们，大部分改善住房，都有着明显的回归市中心倾向。


    是规律，就要回来。


    这样一来，城市内部“三十年河东三十年河西”的版块更新和漂移运动，以及向三十公里半径内部收缩的运动，都会制造巨大的房屋需求。


    ### 6


    其实还有一些盲点如住房结构调整。


    恒大研究院院长任泽平表示，从住房来源结构看，当前全国城镇住房存量中商品房约占 40%，自建房约占 30%，还有 30% 为原公房、保障性住房及其他。


    由此可见，新型较宜居的商品房，不到 40%。


    未来，还有家庭人口小型化等一系列结构性要求，都会对城市房地产市场制造新需求。


    ### 7


    为什么会有三个以上重大盲点？这些盲点其实连专门研究机构都难以避免。


    比如广为流传的“十年后一对夫妻 6 套房”论：业内人士分析，在中国人口老龄化加剧后，祖辈和父辈的房产将由第三代继承。而在计划生育制度下，大多数家庭构成都为“421”结构。即使按照祖辈父辈家庭都仅有一套房来计算，第三代年轻夫妇结婚时拥有的房产也将有
    6 套，这使得市场上的住房供应远远大于需求。


    另外，西南财经大学中国家庭金融调查与研究中心几乎每年都发布报告，称住房空置率高，房屋已严重过剩，其中 2017 年我国城镇地区住房空置率为 21.4%，全国城镇地区有
    6500 万套空置住房，等。


    造成这种盲点的根本原因，一是“目中无人”，没有真正建立起以人为本位的城市化和房地产研究尺度，没有把主要力量集中于“人会向哪里发展”这些基础问题，而是把更多的力量用在思考“区域发展”和简单的数量统计上面了。


    二是缺乏对城市化规律的把握，缺乏“世界越来越陡峭、人口越来越集中、城市越来越收缩”的城市化规律知识，用静态而不是用动态的眼光来看房地产。这就会导致“房屋已经比人多、房屋很快比人多”的错觉。


    只要我们以人为尺度，只要我们有了高密度大城市化的知识，就会发现，现有的大部分房屋，什么“一对夫妻 6 套”，即使是真的，在人口散散的趋势支配下，其中大部分，未来不久就面临被空置、被淘汰的命运！


    而少数城市的新型住宅，则会人在聚财聚的趋势支配下，要用“六个钱包”，才能凑得起买房的首付。


    “六个钱包”全称为六个钱包买房，是指男方的父母、爷爷奶奶、姥姥姥爷加上女方的父母、爷爷奶奶、姥姥姥爷共六方，即“六个钱包”，“如果这六个钱包能帮你凑够首付的话，那么最好还是买房子”。该概念由央行货币政策委员会委员樊纲在
    2018 年 4 月 CCTV2《大讲堂》电视节目里提出。【完】


    # 不好卖的房子怎么处理？


    童大焕—2019 年 9 月 17 日星期二

    '
  mdcn: '

    ## 9 地球村


    话说，以往的中国乡村，都是在外做官、经商、打工赚了钱，纷纷回来购买田置地，形成了人口向外、财富和文明回流乡村的双向流动。


    一栋农村大房子的建造，可以给当地靠黄土背朝天、一向靠土里觅食的农村居民带来农业收入无法比拟的巨大的财富分配机会。


    今天，如果同样的机会自由、平等地给予中国大陆的每一座城市和乡村，不限购城市豪宅，不限制乡村宅基地和农房交易与改造，会出现比历史上更繁荣的城乡房地产建设与购买热潮，因为，有了现代金融制度的加持。


    现代金融制度不需要等一个人赚足了钱才来买房建房，而只要有一定的首付（启动资金）和足够的月供能力，就可以以 200 倍的力量撬动财富【平均 5000 元月供支撑
    100 万元贷款】。


    而这向未来预支的 100 万元，迅速为当下提供了极大的就业和财富分配机会，给村里村外做钢筋的、烧水泥的、烧砖的、泥瓦师傅、木匠师傅、油漆师傅、家具厂、家电工人，等等，又都提供了
    3000 元、5000 元、1 万元的月收入现金流，他们其中的一部分人，再用其中的 3 千元、5 千元月供能力，去建设、购买属于自己的房屋，形成又一个循环......


    整个地球，也是这样的一个大村子。


    ## 10 对于房地产业的政策建议


    衣食解决以后，住行就是任何时代、任何国家和地区老百姓最重要、也是最大开支的需求，住的需求水龙头一旦打开，财富的货币之水就会恣肆汪洋地在中国大地上流淌。


    货币要像流水一样自由流淌，才能灌溉沃野千里，创造无数的就业和发财机会。因此，我们必须告别对房地产的妖魔化理解，从满足人民群众对美好居住生活的向往角度出发，“开放两端，保障中央”，尊重市场，用更科学、合理的房地产政策，鼓励房地产健康、理性、稳定地发展。


    开放两端，就是对城市的高端商品房和农村住宅和宅基地，完全开放，满足人们尤其是先富起来的人们对多样化居住的需求，让他们的财富在自由流动过程中，为社会创造更多的就业和财富分配机会。


    保障中央，就是对进入城市尤其是大城市的社会中间层，通过首付比例降低，缩小房屋面积、对中面积适当限购等方式，降低中低收入人群进入城市尤其是进入大城市的门槛。


    人类正迅速进入服务业时代、大城市化时代，这个潮流不可阻挡。我们的政策，应该预见和顺应这个史无前例的历史规律和潮流。【完】


    # 什么样的房产才称得上是优质房产？


    童大焕—2019 年 9 月 9 日星期一


    ### 1


    有星球会员问：童老师，具有什么样特点的房产才称得上是优质房产呢？


    我思忖这个问题有价值，就把它抛给众星友，让大家一起来思考，来回答，我到最后再来说出我的看法，这样大家可以比较一下，思考是不是和我在一条线上，不同在哪里，各自的优在哪里。


    我说：大家一起来回答下面这个问题，我会在最后以精华文章来作答。为了不让讨论太散，漫无边际，我们在思考这个问题时以投资为主要诉求，排除那种纯个性化的消费与审美诉求。大道至简，才能迅速抵达真相和真理。


    ### 2


    回答还真不少：


    - 离武汉中山公园 15 分钟路程的房子都是好房子。

    - 离国贸 CBD 半个小时路程的房子，也都是好房子。

    - 离上地软件园半个小小时路程的房子都是好房子。

    - 离杭州武林路 15 分钟路程的房子都是好房子。

    - 香港的房子都是好房子。（我说：“你是在思考还是在把一切可能和不可能都罗列个遍呀？”我还没说的是，香港也有让人亏死的房子。）

    - 城市：人口持续流入；地段：城市半径以内，高端人才就业中心；产品：宜居，物业较好。

    - 人聚财聚，人散财散；高山流水，静水流深；年轻人口流入城市；高科技、金融、高端服务业聚集的城市。

    - 抗跌，易租易卖，升值快。产权独立，人口流入地区中心城区，次新中小户型。

    - 房子不能太旧，有电梯，小区环境好，适宜居住，地铁附近，周围有超市，医院，学校，人气足，治安好。

    - 能住，好卖好租，人口流入城市，有电梯，次新，高收入人群聚集区域。

    - 低风险低首付高增值可快速变现。

    - 可交易，可抵押，超大城市好地段商住两用小户型。

    - 地段好，配套好，易出租，可变现。

    - 好出租，易变现。

    - 持续的产生现金流。

    - 好城市，好地段，好房子。可出租，可出售，可抵押，完美！

    - 次新房，三居或两居，楼下地铁站，菜市、超市、学校俱全。

    - 谋生人口众多，交易需求基数足够庞大，容易出手变现；在庞大基数基础上占位优质交通、教育、生活便利条件；拥有后续强势发展态势位置。

    - 好房子：符合租、贷、住、卖、的优质城市核心位置的房产。租：易出租；贷：有金融属性；住：有人愿意住；卖：好出售利于变现。这样的房产一定是好房子。

    - 好房子：租赁住卖，优质城市，核心位置。

    - 人口持续流入的一线城市，有高端产业高端人才聚集的区域，户型时尚、小面积的两房或三房、物业好、学区好、有地铁的优质楼盘。

    - 租金每年上涨，好出租的房子，每年净资产收益率上升，具有成长性，是房产中的茅台股。

    - 距商务中心通勤时间不超过 40 分钟；步行 10 分钟内附近有地铁或快速公交站，或者在建；步行 15 分钟内有综合型三甲医院，或者在建；步行 15 分钟内大型购物中心、商超，或者在建。

    - 房龄不要太老，2000 年以后的带电梯的房子是首选；通勤时间要在 30 分钟-60 分钟；产权清晰；自己不住的话，还出租；周边配套要适当完善，地铁，公交，购物，医院，学校等。

    - 对个人而言能持续匹配你和家人生活需求的房子（与自身购买力相匹配）；升值趋势明显的房子（基本条件如地段和持续集聚与投入能支撑价值）；容易变现的房子，北京核心地段的新房次新房，户型
    OK，楼层 ok，小区环境 OK。

    - 地段和配套。

    - 前提是人口长期流入的城市；小区较大，环境好，入住率 70～80%以上；周边有好几个连成片的较成熟小区，且都比较新，2000 年后的电梯房；小区附近有幼儿园和中小学，只要有学校，不要求是学区房；交通方便，步行
    10 分钟以内有多条公交或 brt 或地铁路线，最好是有其中两种或以上；周边商业发达，附近有大中型购物广场或超市；离自己上班地点车程单程不超过半小时，或车程半小时内有密集写字楼；车程半小时内有三甲综合医院。以上条件都需具备。

    - 大众化的，就是普遍人都愿意接受的，容易有人接手的，买房投资就要想下一个接手人。看得见的话就是周边配套齐全，小区环境物业，装修大众。


    ......


    ### 3


    我读了几乎所有的回答以后，整个人蒙在那里。大家说的好像都对，又好像都是正确的废话。我把它一一罗列，是几乎每个人都可以对号入座，都差不多容易掉进类似的陷阱。


    我绞尽脑汁想啊想，问题到底出在哪里？终于脑洞开了，被我我想通了：原来是答案太正确了！有时正确到无可挑剔，而现实，远没有纸上的答案那么完美。


    都对，是因为说的是千真万确的真理。都不对，是因为一旦要落实到具体操作，恐怕包括回答的人，大部分要抓瞎。


    尤其是，设立了太高的标准，在现实操作中，后果是非常严重的——会自觉不自觉地，排斥达不到相关标准的投资标地，从而在无形中，自我阻挡和放弃自己本应该把握的、不那么完美的机会。


    范冰冰又年轻又漂亮，还特别有钱，是不是大家都想追？


    但若无潘安之貌子建之才石崇之富倾国倾城之权，敢去高攀吗？不敢，除非被她看上，否则，一味只以范冰冰为择偶标准，结果会怎样：99.9999%的可能性一辈子要落单。


    所以，当我们问什么样的房子是好房子的时候，应该代入自身条件，再来进行判断，才是可操作而且令人纠结令人犹豫令人摇摆不定的真实选择。


    一定要有基本的立足点，否则再好的愿望和判断，都无法变成自己的实际行动。


    首先必须立足于自己的约束条件。经济学实际上就是讲人和国家在约束条件下的行为理论，讲究的是约束条件。


    经济学这个词太糟糕了！！！让人望而生畏，以为这只是治国理政才需要的学问。应该正本清源，回到【约束条件下】“人的行为研究”这个本义上来，才能从底线逻辑上，去研究和思考个人和群体在不同约束条件下的行为选择，找到影响社会发展和个人选择的关键症结，才能更有利于做出符合人性的决策，才能更有利于不同阶层的和谐共处，才能更有利于相对弱势阶层的突破与发展。


    从哪里着眼、从哪里入手，很大程度上会决定一个人能走多稳，能走多远。


    ### 4


    必须立足于自身约束条件，再来谈“优质房产”，这个问题才是有意义的。


    这么一来，“优质房产”就不再有唯一正确答案，而是更加的丰富多彩了：


    - 如果我的购房资格、首付能力、月供能力，够得上一线城市最核心地段的最好住宅，面积又不是过于阔大，那个房子对我就是优质资产；钱不够，同地段同类型房屋最小面积也仍是优质资产；

    - 退一步，有钱没有购房资格，其它比较容易落户的二线城市核心地段优质住宅是不是优质资产？

    - 再退一步，一线城市优质地段不限购高租金的优质写字楼是不是优质资产？

    - 再退一步，有资格但钱很少，二三线甚至三四线城市还有十年八年人口回流的地方的不限购优质住宅，是不是优质资产？

    - 再退一步，类似香港劏房、棺材房、笼房的核心地段条件较差老破小是不是优质资产？

    - 再退一步，一个房子，不一定能够赶上一线二线城市的涨幅，甚至不一定能够赶上通胀，但已经是自己能力极限，最小面积最低单价总价的最高承受极限，按揭以后，将来可能卖出的价格勉强够成本和月供，像农人以前在乡下养猪一样，日积月累帮你攒下了一笔财富，算不算优质资产？

    - 再退一步，像印度那样的国家和地区，你扯一块塑料布在公地上搭个棚子，从此就是风能进雨能进国王不能进的家，对一个白手起家赤手空拳的人来说，也是优质资产【比喻】。


    彼之陷阱，此之高举；彼之美味，此之砒霜。


    结论，能够让自己积累财富或实现财富增值、且容易变现的房产就是优质房产。


    我们应该“眼高手低”：眼界要高，但是身手要低，既分得清优质资产的层次，又能脚踏实地，根据自身条件一层层去够自己够得着的层次。【完】


    # 未来只有少数城市有投资价值 房地产还能成支柱产业？


    我认为提问者视野中至少有两个巨大的盲点，如果没有这两个盲点，这个问题不会被提出。这些盲点其实连专门研究机构都难以避免。


    童大焕—2019 年 9 月 12 日星期四


    ### 1


    问：童老师您好！我的问题是房地产在前 20 年作为支撑经济的最大支柱产业是没问题的，但是今后中国大部分地区的房地产是严重过剩，那么在那些地区的房地产业会大幅萎缩，您说将来只有不到
    20 个城市有房产投资价值，那么就是说将来房地产发展较好的不到现在城市总量的 5%，这样的话房地产产业还能作为经济发展的支柱产业吗？


    这个问题我还是先交给了知识星球的会员们，请大家一起来回答，目的是启发大家独立思考。没有经过思考的知识，就像没有经过消化的食物，是不可能成为自己的营养和智慧的。我提示曰：“我认为提问者视野中至少有两个巨大的盲点，如果没有这两个盲点，这个问题不会被提出。大家来说说，哪两个盲点？如何让自己避免这两个盲点？"


    ### 2


    仔细分析，提问者至少有三四个重大盲点：


    - 第一，不动产是无法移动的，但是人在剧烈移动。

    - 第二，人口流入的城市内部，大量房屋面临更新换代。

    - 第三，即使是不到当前城市总量 3% 的人口流入型城市内部，也在进行着剧烈的城市内部变迁，以及从 30 公里半径外向 30 公里半径内的板块迁移运动。


    以下我们逐一分析。


    ### 3


    第一，房地产不动而人在剧烈运动。


    据预测，未来十年将是人类历史上最大规模的城市移民时期，到 2030 年，全球 60% 以上的人口将居住在城市。据国际货币基金组织预测，到 2035 年中国城市化率将达到
    70-75%，这意味着未来不到 20 年时间，中国将有 2.5 亿人从农村进入城市。同时，将有 30%-50%中小城市人口向大城市迁移，这部分人口可能高达
    1.5 亿人【我估计人数可能还会更多】。


    人口向大城市集中是世界发展的普遍规律，这使得大城市有限的物理空间正在不断地向高处和密处生长。


    按照世界各国房地产的发展周期统计规律，一个国家城市化率在 30%到 70%阶段，往往是房地产行业爆发和高速增长阶段。目前美国总体平均城市化率达到 83%，一些都市圈的城市化率已经接近
    100%，而目前中国城镇化率才 57.4%，如果以 83%为标准，中国还有 3 亿人的潜力缺口；如果以 90%为标志，中国还有 4 亿多人的潜力缺口。未来
    20 年间，中国城市将增加四亿人口，超过美国的总人口，其中会有超过 2.4 亿的移民。（《美国城市化和中国的比较》 2017-12-21 23:59 地产总裁内参）


    也就是说，人口不仅从农村向城市迁徙，而且从中小城市向大城市迁徙，这个过程中，过去 20 年抑制大城市、扩张中小城市的战略，已经使大量中小城市和乡村房屋过剩，但是，占城市总量仅
    3%左右【s20/661】的城市，房屋供应是严重短缺的（中国大陆（不含港澳）目前有 4 个直辖市，283 个地级市和 374 个县级市，一共有 661 个城市）。


    这就是中国特殊的城市干预政策下的世界别样风景：房屋的严重过程和严重短缺同时并存，而且长期并存。


    规律挡不住，那么未来，过剩的就永远过剩，短缺的将持续补课。


    人聚财聚，人散财散，在大城市化背景下，人口集聚的地方也就是财富集聚的地方。未来有投资价值的城市也许不到 3%，但这 3%的城市，将聚集全国 70%、80%的房屋价值。而其中，大部分房屋还没有建成呢！


    其它中小城市，价值严重缩水，只变成人们的第二、第三居所，甚至长期空置。


    ### 4


    第二个盲点，占 3%甚至不到 3%的人长期流入型城市内部，大量房屋面临更新换代。如果没有人为压制，房屋需求是永无止禁的，有些人可能不停地在买卖置换（贡献好多税收），不停地在追求品质更高的居住环境。


    不妨比较一下美国。


    根据黑布林北海居《2017 年美国 GDP 分行业核算数据》（腾讯网 2018 年 4 月 23 日）整理的数据：2017 年美国以 193906 亿美元
    GDP 位居世界第一；中国以 122377 亿美元紧随其后，约为美国的 63.1%。2017 年，美国房地产业增加值 23874 亿美元，占 GDP 的比重为
    12.3%。2017 年，中国房地产业增加值 7976 亿美元，相当于美国的 33.4%。


    2017 年末，中国大陆总人口 139008 万人，其中城镇常住人口 81347 万人，占总人口比重（常住人口城镇化率）为 58.52%，户籍人口城镇化率仅为
    42.35%。


    美国只有 3.3 亿人口，城市化率 83% 以上，中国的人口比美国多得多，城市化率几乎只有美国的一半，城市住房需求应该比美国大得多，而且，城市化和房地产都还处在被中断
    50 年以后（1949~1998）的补课过程中，按理说，中国房地产业增加值占国民经济的比重，应该远远高于美国才对。事实却不然，中国 GDP 有美国的 63.1%，房地产业增加值却只有美国的三分之一！


    也就是说，美国城市化已基本完成，房地产支柱地位却比中国还支柱。恰恰说明，中国过去的房地产政策，尤其是大城市限购限贷政策，对房地产太不友好，抑制了它应有的发展。


    ### 5


    第三个盲点：城市内部变迁和位移，照样在制造巨大的房屋需求。


    创建于 2011 年、全球城市空中出行领域的先行者、德国城市空中出行公司 Volocopter（尚未完成商业化）的内部分析发现，大多数特大城市的城市区域距离地理中心点不到
    30 公里，而服务于这些城市的大多数主要机场距离市中心不到 30 公里。


    Roland Berger5 和保时捷咨询公司的研究也支持这一观点。


    相关研究，和我们城市化战略研究院所作的超级大城市 30 公里左右半径极限研究，结论高度一致。


    但是我们过去的城市化政策，往往是疏散大城市中心人口，导致人口过度向郊区和远郊扩散。


    但同时，改善性住房的换房趋势却告诉我们，大部分改善住房，都有着明显的回归市中心倾向。


    是规律，就要回来。


    这样一来，城市内部“三十年河东三十年河西”的版块更新和漂移运动，以及向三十公里半径内部收缩的运动，都会制造巨大的房屋需求。


    ### 6


    其实还有一些盲点如住房结构调整。


    恒大研究院院长任泽平表示，从住房来源结构看，当前全国城镇住房存量中商品房约占 40%，自建房约占 30%，还有 30% 为原公房、保障性住房及其他。


    由此可见，新型较宜居的商品房，不到 40%。


    未来，还有家庭人口小型化等一系列结构性要求，都会对城市房地产市场制造新需求。


    ### 7


    为什么会有三个以上重大盲点？这些盲点其实连专门研究机构都难以避免。


    比如广为流传的“十年后一对夫妻 6 套房”论：业内人士分析，在中国人口老龄化加剧后，祖辈和父辈的房产将由第三代继承。而在计划生育制度下，大多数家庭构成都为“421”结构。即使按照祖辈父辈家庭都仅有一套房来计算，第三代年轻夫妇结婚时拥有的房产也将有
    6 套，这使得市场上的住房供应远远大于需求。


    另外，西南财经大学中国家庭金融调查与研究中心几乎每年都发布报告，称住房空置率高，房屋已严重过剩，其中 2017 年我国城镇地区住房空置率为 21.4%，全国城镇地区有
    6500 万套空置住房，等。


    造成这种盲点的根本原因，一是“目中无人”，没有真正建立起以人为本位的城市化和房地产研究尺度，没有把主要力量集中于“人会向哪里发展”这些基础问题，而是把更多的力量用在思考“区域发展”和简单的数量统计上面了。


    二是缺乏对城市化规律的把握，缺乏“世界越来越陡峭、人口越来越集中、城市越来越收缩”的城市化规律知识，用静态而不是用动态的眼光来看房地产。这就会导致“房屋已经比人多、房屋很快比人多”的错觉。


    只要我们以人为尺度，只要我们有了高密度大城市化的知识，就会发现，现有的大部分房屋，什么“一对夫妻 6 套”，即使是真的，在人口散散的趋势支配下，其中大部分，未来不久就面临被空置、被淘汰的命运！


    而少数城市的新型住宅，则会人在聚财聚的趋势支配下，要用“六个钱包”，才能凑得起买房的首付。


    “六个钱包”全称为六个钱包买房，是指男方的父母、爷爷奶奶、姥姥姥爷加上女方的父母、爷爷奶奶、姥姥姥爷共六方，即“六个钱包”，“如果这六个钱包能帮你凑够首付的话，那么最好还是买房子”。该概念由央行货币政策委员会委员樊纲在
    2018 年 4 月 CCTV2《大讲堂》电视节目里提出。【完】


    # 不好卖的房子怎么处理？


    童大焕—2019 年 9 月 17 日星期二

    '
  merge: 0
- raw:
  - '[PAGE 72]


    1


    未来会出现越来越多不好卖的房子，这篇文章可以给那类房子指出一条相当普通的重要生路。当然，越早运用机会越多效果越好。


    2


    知识星球网友提问：童老师，您好。“国内人口长期流出地的资产更应优化”，按您这个原则，三四线城市的自住全款房，合适利率的情况下，抵押贷款贷出来资金用来购买优质房产，可行吗？谢谢您。


    答：这是一个好问题。可行！我曾经想设计一个产品：有一些地方的房子很难卖出去了，和银行合作，抵押贷款出来做首付，再到更好的城市按揭买一个更优质资产。这样可以用优质资产全部覆盖掉劣质资产的风险。但是现在银行不自由，无法实现同一银行的闭环操作。但是个体可以适当做。


    3


    对这个问题，做一简单推演和说明：


    假定某三四线城市房子，市场价值 100 万元，但是由于过剩或其它原因，或者因为老人等原因不舍得卖、祖传资产不宜卖，在月供许可情况下，贷出 60 万元作为首付，在更好的城市优质地段，购买总价
    120 万元住宅一套。这就实现了非优质资产的资本化即我所说的“灵魂出壳”过程。


    未来，即使三四线城市房价不涨、下跌，或者这 100 万元资产有价无市，成为沉淀资本，“灵魂出壳”变出来的 120 万元优质城市优质地段优质房产，经过五年、十年，变成了
    240 万、360 万元资产，虽然初始 120 万元都来自贷款，但多出来的 120 万、240 万就是实实在在在自己的资产了！


    4


    现实中，类似的操作法是有的。曾有人买了环京住宅，兴高采烈精装修，配置了很好的家具家电，以为自己会常去度假，或者老人去常住养老。


    后来才发现那只是想像。于是只好卖掉。买方开出的价格比毛坏买入价还低！卖方说，我精装修了呢，家具家电都多少钱了呢。中介说，人家哪里在乎什么家具家电精装修，人家买这个房子，根本就没想要，只是一个金融工具而已！


    原来，买方是低价买入，但银行评估价比买入价高很多，这样，即使贷出几成，也比买入总价还高，这样，不仅不要花钱买这个房子，还从银行贷出了多余资金。


    比如：买入价 40 万，评估价 100 万，7 成按揭，贷出 70 万。手里剩余资金 30 万！


    5


    所以，独立产权房是个非常好的金融工具。一定要注意和运用好它的金融属性。'
  - '[PAGE 73]


    一定要购买能够直接和银行发生金融关系的独立的产权房，排除小产权房、农民房、没有独立产权的军方房央产权房等。


    问：深圳小产权房和农民房值得投资吗？这种在老师看来是不是算没有灵魂的资产？


    答：不能资本化、不能“灵魂出壳”的资产，当然都算没有灵魂的资产。直接和农民一对一发生买卖关系的农民房更不能投资，当前法律一点都不保护这种交易。小产权房比农民房好一点，但是也不能资本化，同时也还存在拆除等风险。


    而且，随着小产权房也会和大市场一样水涨船高地涨价【不一定能涨过商品房】，它的总价越来越高，能够接受它的人就会越来越少。意味着越来越不好卖，同时又不能通过和银行发生金融关系进行资本化，基本上就只剩出租这个用途了。相当于大笔资金被套死。


    而用同样的钱购买商品房，还可以按揭，把资产做大。未来涨价了，孩子出国读书等等，要用钱时，只需抵押贷款就行了。自由得很。


    所以，小产权房比同地段商品房便宜很多，远远不仅仅是没有土地出让金的问题，更为根本的是没有金融属性的问题。


    6


    问：想调仓。洛阳的房子，应该卖了换郑州，还是抵押贷款出来，首付买郑州？


    答：这个是一个非常简单的算账，能全部调的当然全部调。如果家中有老人舍不得，那就不妨采用抵押贷款方式。【完】


    # 不怕产业空心化 只怕人口空心化


    童大焕—2019 年 9 月 19 日星期四


    1


    知识星球会员匿名提问：《哪些城市，最须警惕“产业空心化”？名单令人吃惊》（作者刘晓博），童老师，你对产业空心化这个问题怎样看？


    答：城市的本质在于人口，不要怕产业空心化，怕的是人口空心化。感觉作者不太理解现代服务业和非物质生产为何物。


    2


    原作者列了一个图表：'
  - '[PAGE 74]


    | 城市 | 2018 年第二产业GDP | 2018年 | 2008年 | 占比增减 |


    给了一个定义：


    所谓“产业空心化”，主要是指“以制造业为中心的第二产业”在国民经济中占比偏低。一般认为，当第三产业占比超过 60%的时候，就存在产业空心化的可能。'
  - '[PAGE 75]


    以中国目前的发展阶段，当一个城市第二产业占比低于 40% 的时候，就要引起关注。如果低于 35%，则基本上可以认为出现了“产业空心化”。


    作了一个结论：最应该警惕“产业空心化”的内陆大城市至少有 8 个，依次是：广州、上海、杭州、西安、济南、南京、天津、青岛。


