    # 数据不可迷信 规律认真探寻 重视战略战术 不可拘泥细节


    童大焕一2019 年 10 月 7 日星期一


    +   1


    人口是城市发展的依据。但如何获得准确的人口数据，一直是个谜。一些人认为，大数据时代，凭借轻松易得的免费大数据即可判断未来，未免图样图森破（太年轻，太简单化了。）


    很多人则对此困惑：


    童老师，有没有好的途径查询，地区人口流入流出相对准确数据？


    本人在 4-5 线城市政府部门对人口这一块大地情况比较了解，基本上没有一个部门的数据是准确的，除去公安人口大队对于户籍人口掌握的详细些，流动人口数据基本上没有地方可以查询（除非你找公安办理证明不然基本上都不会和他们打交道，也就意味着没有你的数据），每年统计局的数据也误差很大。


    童老师您好，我想问下：政府官网发布的“统计年鉴”里面有口数据，这个数据可靠吗？是否有其他方式/渠道能看到人口数据？谢谢。


    +   2


    数据很重要，但几乎没有一个部门的数据可靠，哪怕在今天这个网络可以即时得出许多大数据的时代。


    另一方面，数据也是每分每秒都在变动，一个时期的数据，并不代表未来的方向，即使是大数据，也不能预测未来的方向。


    因此，我的态度如标题。


    数据仅供参考，指导我们决策的定海神针，是对城市化规律的基本认知和把握；在把握规律的基础上，重视限购限售条件下的区域选择这一最重大战略问题；在此战略基础上，重视月供、首付、总资产的平衡与最大化这一战术问题。


    其它的人口增减、GDP 等数据，都充满了各种各样的扭曲，不宜被这些“细枝末节”阻挡了正确的视线。


    人就一辈子，时间、精力、注意力都是有限的，被细枝末节牵住了视线，就一定会在重大战略战术问题上失焦。


    +   3


    城市化的规律，说简单点就是两句话：'
  - '[PAGE 95]


    第一句：人的一切活动首先围绕着就业进行，交通、商业、教育、医疗等配套只是辅助品；


    第二句：技术进步使人的就业不断地从农业向工业、从工业向服务业转型。


    心中有了这两句话，就把握了城市化最重要的脉搏。至于更多的，则需要一点点学习其中的过程和规律。


    # 4


    包括政府部门的数据，为什么充满了扭曲？


    一是统计口径问题。对城市地域概念的理解，我们可以分为三种：城市行政地域、城市实体地域和城市功能地域。


    城市行政地域指城市管辖权对应的空间范围。城市实体地域则指城市中城镇型的城市空间，即一平方公里人口数量不低于 4 千人以上的城市连片建成区。


    我国城市的统计工作及其他各项工作，一般是以行政地域为基础开展的。中国城市的行政范围和实休范围相差太大。比如北京市辖区范围是 16400 平方公里，但真正的建成区面积，包括各个县府所在地，也就
    1400 平方公里有余。


    曾经有一个赵姓培训老师，自信满满地不断在网上指点江山谈买房经验，将北京二环的房子换到了燕郊，又在燕郊大涨前换到了廊坊，根据就是廊坊的“人口增长数据”！


    殊不知，廊坊“人口增长数据”是整个地级市的全辖区人口数据，而真正的人口增长，并不在北京南部的廊坊市区，而是在北京正东的廊坊市（地级市）三河市（县级市）燕郊镇！


    真正的南辕北辙了。


    所以，关注人口数据，必须关注具体区域才行。但是相关具体区域，数据基本缺失！这就是当下中国的基本数据背景。


    二是政绩需求。有的城市如西安武汉天津等大涨鼓吸引人口，于是倾向于夸大人口数据；有的城市如北上广深被迫要求控制人口，于是倾向于缩小人口数据。


    # 5


    有人说用小学生数据。小学生数据比泛泛的人口数据相对靠谱但也不全面，甚至全方位地扭曲、失真。


    比如像北京这样的城市，试图通过控制学生入学来达到控制人口的目的，那么在北京就业的人口，其下一代和父母分离的占比就更高，甚至那些人口，因为“上学移民”问题，被计算到了天津或周边的河北区县。'
  - '[PAGE 96]


    # 6


    QQ 大数据、大型网约车出行数据、手机电话数据等大数据，相对准确，但是有时可能涉及有关部门不愿意公布的“国家机密”，因此这几年发布的越来越少了。


    # 7


    清华大学建筑学院人居环境信息实验室龙瀛老师团队利用百度地图慧眼，通过 2018 年 11 月、2016 年 11 月两期的常住人口数据（居住地人口数）探索了包括县城在内的
    3022 个实体城市中国所有城市常住人口的变化情况。


    研究结果显示：全国所有城市常住人口增加平均值为 0.8%，两年期间常住人口减少的城市共 1506 个，占 3022 个城市的 34.9%，其中 178 个城市常住人口减少超过
    15%。两年期间常住人口增加的城市共 1516 个，平均增加 9.4%，常住人口增加超过 15% 的城市有包括昌吉市副城、兰溪市主城、五家渠市主城、龙岩市新罗区、墨玉县主城等在内的
    179 个。


    他们将两年期间常住人口减少 5% 及以上的实体城市定义为收缩城市（人口视角）。研究共识别出 217 个收缩城市（图 3），占所有 3022 个实体城市的 7.2%。（收缩是一个中性词，收缩只是人少了，并没有说这是个破败的、失落的城市。）


    研究发现，他们所识别的中国收缩城市的平均收缩率为 9.6%。收缩最严重（常住人口减少比例超过 15%）的城市有鸡西市城子河区 1、同心县主城、北京市顺义区
    1、苏州市相城区 2、日照市岚山区 1、济南市章丘区 2、静宁县主城、玉门市主城、大连市金州区、扎鲁特旗副城、科尔沁左翼中旗副城、沙湾县主城、绥滨县主城、绍兴市柯桥区
    2、榆树市副城、泰兴市副城、吉林市昌邑区、沈阳市沈北新区 2、同江市主城、玉环市副城等。


    此外，他们发现我国绝大部分收缩城市的就业人口数已经出现了减少，在 217 个收缩城市中，就业人口减少 5% 以上的 147 个，占收缩城市总数的 67.7%。收缩城市中就业人口的减少可能伴随城市经济上的衰退和
    GDP 的下滑。（龙瀛、马爽等《中国实体城市的常住人口变化》中国城市中心 2019 年 9 月 13 日）


    这是一个相对严谨的数据采样。你看，北京的顺义、苏州的相城，这些热门城市的一些区域，都出现了人口的剧烈收缩现象。


    也就是说，即使在未来人口流入地城市，城市内部的变迁也将是非常剧烈的。


    另外，即使这是相对严谨的采样和分析，如何采样和分析，也会对结果造成巨大的误差。比如采样的是两年的 11 月，那是春节前不久的月份，当年的全国经济景气程度有可能会带来极大的误差。


    再者，这个分析也没有对人口结构进行分析。很多地方的人口增长，有可能是第一代农民工老了干不动了、被迫回流。'
  - '[PAGE 97]


    8


    综上，人口增减的数据结论仅供参考，分析人口流动的过程更有意思更有价值、更接近事物发展的本质。


    始终要记住：不要在自己掌控不了的地方浪费时间精力。很多所谓数据，你不能掌握，别人也不能掌握；很多所谓数据，你认为重要，实际上没那么重要。【完】


    # 理解现代服务业才能真正理解何为城市核心地段


    童大焕—2019年10月10日


    1


    决定房价最关键要素，排前三名都是：地段，地段，地段。


    但是，只有理解了现代服务业，只有理解了人类就业形式的巨大变迁，才能真正理解什么是好地段。


    网络上曾有自称房地产专家、堂而皇之地教人买房者，居然把北京天AN门、中/南/海当成北京城市最中心！


    从房地产专业角度，这是要多么外行和无知才会说这样的话！


    2


    先看我的网上朋友硅谷王川给大家讲一段惊心动魄的美国房价故事（2019年10月5日 07:01 来自 Android）：


    在硅谷生活久了的人，会有一个错觉：那就是，房价总是一直涨。


    前不久到东部旅行，一个朋友提到，他的房子价格仍然低于2007年的买价，让我吃了一惊。


    硅谷很多地区的房价从2014年之后就超过2007年的最高点。但东部纽约市旁边的康乃迪格州 Fairfax 县，拥有大量大型对冲基金公司，房价交易指数在2006年达到165的高点后不断下跌，2012最低到128，之后一直萎靡不振，2018年时指数仍然只有135。


    华盛顿 DC 旁边的马里兰州的 Howard 县，全美最富的县之一，家庭中位数收入排名全国第三，虽然离首都很近，但房价指数在2006年到206后，不断下跌，2012年触底到169，2018年仍然只有195。


    不是所有的东部地区都是如此，波士顿所在的 Suffolk 县，房价指数2006年为164，2015年之后就不断创新高，2018年房价格指数为220。在哈佛、MIT
    周边的高新科技公司，显然对人口的涌入和经济的发展，起了重要的作用。'
  - '[PAGE 98]


    决定房价的最重要因素是位置，位置背后最根本的因素是就业市场的增长和人口的增长。而影响就业市场的因素，往往是看不见的，甚至非常遥远的。08 年金融危机后，高科技行业的迅速增长，远超其它传统行业。世界经济增长的红利，基本上被高科技最发达的少数几个区域获取了。行业兴衰趋势，这个根本因素，是看多少房子，也看不出来的。


    南加州的洛杉矶县，拥有大量军工企业，1991 年底苏联突然解体后，美国削减军费，大批军工企业裁员，洛杉矶县房价指数从 1991 年的 95 下跌到 1996
    年的 77。一些城市的房价下跌一半以上，很多人因此破产。房价指数到 2000 年后才创新高。


    # 3


    匿名用户 提问：童老师，您好。随着城市化进程，服务业等第三产业在整个 gdp 中的占比会越来越大，甚至有些发达国家占比已经达到 80%。请教您：这里的 80%服务业主要包含哪几个行业，有这方面的数字吗？谢谢您。感恩。


    答：没有具体数字，只有逻辑和推理。服务业除了传统衣食住行文化娱乐，新型的生产型服务业包括金融、法律、咨询管理、广告和会计，还有微笑曲线的两端——研发与营销等等。


    人类 90%的活动是围绕着经济、围绕着就业来进行的。


    城市化的规律，说简单点就是两句话：


    第一句：人的一切活动首先围绕着就业进行，交通、商业、教育、医疗等配套只是辅助品；


    第二句：技术进步创造了集聚的外部条件，使人的就业不断地从农业向工业、从工业向服务业转型。


    # 4


    全球化与世界级城市研究小组与网络（Globalization and World Cities Study Group and Network，简称 GaWC）是欧美学者自发组成的研究网络，可以说是纯粹的学术研究。


    该研究小组和网络用六大“高级生产者服务业机构”在世界各大城市中的分布为指标，对世界城市进行排名。“高级生产者服务业机构”主要包括：银行、保险、法律、咨询管理、广告和会计，关注的是该城市在全球活动中具有的主导作用和带动能力。


    也就是说，这些行业的国际性机构在城市中分布得越多、等级越高，城市的得分就越高，越被 GaWC 认为是影响力的世界城市。'
  - '[PAGE 99]


    这个排名忽视了高科技的指标。微笑曲线两端（研发——高科技研发和专利、营销——品牌和服务）中的后端——营销（品牌和服务）也可以归入咨询管理类。


    这几大类，将来会创造 GDP 总值的 80%以上，统统可以归入“生产性服务业”或“非物质生产”范畴，简称“现代服务业”。


    +   提问：童老师，请问为什么现代服务业必然导致人口集聚？


    答：集聚是经济规律的内在要求（同时也是人的安全的内在需求，以及，对生活类服务业丰富性的内在需求）。越集聚，越节约时间等成本，效率越高，创新、分工程度也越高（分工本身，既是专业和效率的原因，也是专业和效率的结果）。农业时代和工业时代，经济规律和人的安全的内在要求是一样的，但是农业时代和工业时代，这种集聚必须服从生产方式，就是农业和工业生产资料——土地和厂房，非集聚或者集聚程度有限的。但服务业时代的第一生产资料是人，人的集聚，几乎无极限。一台电脑，3
    平方米办公区，就是一个能量巨大的“生产车间”。


    +   匿名用户 提问：从服务业视角来看，具有天然资源优势的云南昆明贵州贵阳，广西桂林，既是省的文化中心又是政治和经济中心，这三个城市童老师不看好，如何理解？


    答：我不知道你指的“天然资源优势”是什么，气候条件？地理位置？还是资源丰富？我想说的是，那些政治经济文化中心，是农业时代的产物。服务业时代，国家竞争已经浓缩成了城市竞争，城市竞争已经浓缩成了观念竞争，人口越来越向观念先进的地区集聚，中国则是孔雀东南飞。


    资源丰富的地区，则有“资源丰富的诅咒”和“观念落后的诅咒”双重枷锁桎梏着。


    服务业分生产性服务业和生活类服务业两大层面；或生产、物流（也可以归入生活类）、生活三大层面。生产性服务业主要是指金融、法律、科技、咨询管理等非物质生产，物流和吃喝玩乐的生活类服务业不用解释。你指的这些地方，基本上只能为本省居民贡献生活类服务业。至于好山好水好风光之类，在人口越来越集聚、城市越来越收缩、世界越来越陡峭，人类越来越远离自然的时代，这些东西只会越来越多，并非稀缺产品。未来，不缺好山好水好气候好风光，缺的是人们有没有足够的时间去欣赏。换一个角度，你眼里的好城市是“资源”，我眼里的好城市是“人”——城市能够给人提供什么样的就业机会。


    +   网络上那些教你说需要看多少套房才能买房、看了多少套房就自动学会了买房的人，本质上都是外行。买房买的是地段，买房不看房，只看人口和就业流向尤其是高收入人群的就业和人口流向，这才是内行。'
