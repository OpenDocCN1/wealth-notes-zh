  - '[PAGE 82]


    “影响售价的受众群体，是全国符合在该域有购房资格的人；然而影响租金价格的受众群体，仅仅是该城市的上班族。”《鹏城有路》——这个判断，我认为才是相对精准的。也就是说，“当下”的价格，本身是合理的。


    但也要提防另一种情况，就是纯投资性购房，资金也是来自全国各地，也会短期催涨当地房价，但迟早房价会回归应有价值，要水落石出。


    # 4


    有人说：“你肯花多少钱买房子，实际要看你对通货膨胀的预期是多少。”


    这个判断，基本上也是错的。


    我们虽然知道，通胀是全球范围内的大概率事件，但即使不通胀或者通胀很低微，全球范围内，优质大城市房价涨幅也是高于通胀的。


    另一方面，同样的国度，按理说通胀率在同样的时间内，是同时作用于每一寸国土的，但全国各地的房价涨幅却大不相同。有时是因为各地政策不同或市场炒作力量不同，但更远的时间里，更为根本的结算因素，则是城市化规律下，“人聚财聚，人散财散”使然。


    # 5


    为什么只有在同一城市不同区位选择时才偶尔参考租售比？


    这是因为，一方面，眼球经济会吸引人们追风口，导致一些区域短期内被高估，这时候，租售比可以使我们更清楚地看清其被高估的状态；


    另一方面，城市内部房价涨跌也存在波浪现象，并非同时起伏。我们可以通过租售比来大致判断波峰波谷。


    但即使如此，租售比的运用，也只是在城市、地段、产品三种更重要因素考虑之后，最后的辅助参考因素。


    # 6


    有人说：“在我看来买房不看租售比适用于经济高速增长阶段，增量覆盖资金成本。资产在于保值和产生租金收入，在经济发展涨期环境下，一线城市的租金年收入 1.7%
    覆盖不了房贷利率 6%，二是跑不赢国债和理财产品。我认为不看租售比买房除了居住性质否则没有投资价值。”


    这种用短期眼光看长期投资的视野是狭隘的。买房投资就像钓鱼，就像种植水稻和水果，不能天天看着收成，有时几年都没有收成。


    在国内，由于房地产被政策频繁调控，很多价值更是被政策所直接扭曲和遮盖。比如值 10 万的房子被压成了 8 万，实际上是有 2 万的利润被隐藏了。一旦得到价值释放，这个价值就很快回归。'
  - '[PAGE 83]


    这就是为什么，过去几乎所有时间里，大部分时间房价似乎都没涨，而股市、期货、黄金、国债、理财产品似乎天天都在涨或者收益很稳定，但到最后一结算，没有一样投资回报收益率超过了买房尤其是正确买房。


    而在经济不景气的时候，更是房价和房租都被低估的时候。这时候，只要保得住现金流，恰恰是房屋入手的最好时机，怎么反而成了没投资价值呢？


