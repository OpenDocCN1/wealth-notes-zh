    公平得多, 而且, 还有一样法宝——房子, 有可能天天都在为你保值增值, 等我 们退休或一二十年回头看, 其增值部分, 可能远远超过我们一生的收入——这 是城市化这个时代大潮的恩赐。而那些在中小城市尤其是在衰退中的中小城市
    工作生活的人们, 平时竞争的机会更少, 更激烈, 更要拼关系, 除了房子价格低,'
