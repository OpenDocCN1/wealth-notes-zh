    ## 经济危机的本质


    明明过去四十年中国经济一直高增长，明明大部分人在过去都积累了很多财富，为什么经济却会一夜之间突然失速？人们害怕失业，不敢消费。


    为什么不管什么时代、什么国家和地区，都会像一年有春夏秋冬四季一样不断遭遇经济危机？


    经济增长的本质就是两点：货币像流水一样自由流淌；二，民间信用在法治、自由、低税状态下自由扩张。


    经济危机和萧条的本质也是两点：一是传统产能过剩，再投资已无效益甚至负效益；二是一时没有找到新的投资机会，或者明知有投资机会但由于市场不自由、私人投资受到限制而无法投资。这就是私人投资受阻导致信用扩张受阻。


    比如当下中国大量服务业没有开放给私人投资。还有，像农村土地、宅基地等也都没有开放自由交易。还有，需求旺盛的大城市住房投资也因为严厉的限购限贷导致个人信用扩张受阻。


    ## 为什么“三驾马车理论”是错的？


    凯恩斯主义认为一个国家 的经济增长是由“三驾马车”(即投资、消费和出口)来拉动的，经济疲软时政府应当采取措施刺激消费，尤其是鼓励政府消费和投资，以刺激经济增长。


    凯恩斯主义在战后尤其是经济疲软时大行其道，其本质却是错的。因为，投资、经济增长的最终目的就是满足和刺激消费，把投资、出口和消费割裂开来，尽管在短期GDP数据、短期就业和消化过剩产能方面卓有成效，但这样做却忘了投资和经济增长的初衷是什么，导致为投资而投资，为增长而增长。


    尤其是政府投资和政府主导的产业政策，官员任期有限，又不必自己承担后果，短期行为盛行，同时导致投资短期内过度集中于少量领域，导致更快、更严重的产能过剩和投资浪费。


    教科书上说经济危机是资本主义专利，但政府投资和政府主导的产业政策，不论什么主义，都只能带来更频繁、更严重的危机。


    ## 危机是产业转型和消费升级的信号


    危机时，因为私人投资萎缩导致就业萎缩，很多人即使过去攒了很多钱也不敢消费，怕坐吃山空。


    而危机本身，其实是一个过剩产能出清和新旧产能转换的信号。一方面需要通过市场优胜劣汰淘汰过剩产能中的落后部分；另一方面要开辟新的自由投资渠道让投资人寻找产业和消费升级的出口。


    这就是产业升级和消费升级！


    很多人认为投资就是为了满足消费，对，也不对。不对之处在于，在投资带动技术进步之前，多数人并不知道自己需要、自己能够追求什么样的产品、服务和生活方式。


    是投资本身创造了需求。一流企业家和技术发明人创造和引导了需求，并以此引导社会进步。


    用政府投资来消化过剩产能，只能起到保护落后产能、阻碍产业和消费升级的作用，长期效果是适得其反的。


    ## 应对危机的根本办法和短期捷径


    应对危机的根本办法，是给市场创造更自由、更宽松的信用扩张环境，具体一点说，就是更多的市场自由，更少的管制，然后“放任自流”，让市场主体自己去寻找方向，自己去优胜劣汰，自己去技术进步，自己去寻找新的发展动能。


    尤其是不能将着眼点一直停留在已有的过剩产能上，螺丝壳里做道场，死胡同里开快车，只会撞得头破血流。


    应对危机的短期捷径，是寻找支柱产业。


    支柱产业，是指在国民经济中生产发展速度较快，对整个经济起全局性引导和推动作用的、同时又还没有过剩的产业。


    在工农业制造业产能严重过剩并且服务业又得不到放开、科技进步又在黑暗中摸索的情况下，当下中国最重要的支柱产业是房地产业。*用房地产的个人投资代替一般民间商业投资*，就是私人信用扩张的最直接形式。它既有现实需求也对国民经济起到了基础性的全局引领和稳定作用。


    有人认为，如果房地产可以作为支柱产业，那全世界的人都只需要盖房子就能发达，那就都没有贫穷国家了。


    错！*世界上没有一种产业是永远的支柱产业*。


    食物匮乏的时候，民以食为天，人们就是衣不遮体上无片瓦风餐露宿也要首先保证粮食生产，粮食就是不折不扣的支柱产业。就像著名的沙漠寓言：两个旅人，两个带了一包盐，一个带了一包金子，穿越沙漠，带盐的活着走出来了，因为可以用盐兑水喝，维持生命。带金子的体内盐份随汗水蒸发，没有补充，不能活着走出沙漠。


    但是，一旦生产力水平提高到粮食过剩了，比如美国作为世界第一大农业国，第一产业总产值才占 GDP 1.2%了，一个农民生产的粮食够 130 多个人吃了，还能再用农业作为支柱产业吗？不能，水果蔬菜牛奶卖不出去了，
    只能烂在地里或倒掉了事。


    现在，我们的制造业产能也严重过剩了，我们还能把制造业再作为支柱产业吗？苹果手机带一个在身上，刚好，两个嫌多，三个累赘。电视机全家一台已嫌多，你还准备一个房间放两台？


    农民的果子成熟了卖不出去烂在地里，网络上哭哭啼啼呼吁大家献爱心多买多吃，但人的食物量总是有限的，你多买了桔子就少买了苹果。


    更何况，为什么钢铁煤炭产能过剩，就没人呼吁人人买两吨钢三吨煤囤放家里，是 people 都没有爱心了吗？


    一旦传统产能过剩，我们的视野就应该放到寻找新动能上面。否则，一直停留在"民以食为天"的基本动物需求上，一直在温饱堪忧的农业烂泥里打滚，1800 年时间人均财富也只增长微不足道的
    50%，我们哪里会有今天的电灯电脑智能手机互联网？哪里会有工业革命以来 180 年时间人均 GDP 增长 8 倍？！哪里会有 200 年时间人类生活丰富度和舒适程度天方夜谭般地提高了
    100 倍。


    ## 作为支柱的中国房地产现状


    虽然我把房地产视为当下中国的支柱产业，但我清楚地知道，房地产产能也是严重过剩的，只是形成了"人口流出处严重过剩，人口流入地严重短缺"的空间错配。


    如果房地产也是动产，可以像其它工农业产品一样四海流动，那么它的产能早已过剩得无可救药，更别指望成为支柱产业了。


    早在 2014 年 8 月 29 日，我在腾讯•大家专栏文章《城市化必须立即启动收缩模式》里就写道：


    > “用天津市城市规划设计研究院总院副院长黄晶涛《有多少城市可以重来》一文里的话说，‘回顾过去的三十余年，关于城市我们使用最多是这样的动词：‘开发’、‘打造’、‘改造’、‘拆旧建新’。随着这些尺度宏大、力道十足的语汇潜移默化地成为了我们的语言习惯，我们‘打造’出了超越人类历史的城市奇迹，**30
    年后（确切地说应该是 16 年后。——大焕注）的建筑面积增量远远超过了在 3000 年间积累的、剩余至今的存量之和，而这一增速完全超出了任何一个中国规划师在
    30 年前编制城市总体规划时所能具有的远见。**’另据国土资源部 2013 年初披露的信息，此前 8 年，我们的城市住宅用地供应增量是人口增量的 3 倍！"
    ”


    也就是说，我那时就已清醒认识到房地产产能过剩的情况。


    但更为本质的情形是：人口在加速度进入大城市，而大城市房地产供应严重短缺。于是形成房地产长期的“大部分地区严重过剩，局部地区严重短缺”局面。


    “局部地区严重短缺”，而且未来绝大多数人的财富仓库就是大城市房产，这就是房地产作为支柱产业的基本面所在。


    不仅要面对海啸般的大城市流入人口，而且，面对大城市已有的存量人口，现行政策也远远满足不了他们的住房需求。


    比如深圳 2 千多万人口，商品房只有一百五六十万套。


    比如北京五环内 468 万元非普通住宅标准，以房屋均价 6 万计，不到 80 平米。人们想要获得地段或者面积、住房品质的改善，按现行二套 8 成首付标准，加上税费中介费，近
    9 成首付。绝大多数人卖掉原有住房，还掉原有按揭，想加杠杆也加不了或加得很少，甚至连原有面积和品质、地段的商品房都买不回来。


    这就是个人信用扩张受到阻碍的直接表现。


    ## 萧条之下谁敢扩张信用？


    有人有疑问在于：为什么个人在经济低潮的时候也敢做房地产这种信用扩张呢？对未来经济不乐观，不是不敢投资吗？不是不敢信用扩张吗？


    答案再简单不过：因为每个国家每个地区每个行业每个人的发展都是不均衡的，山外青山楼外楼，有人低潮的时候正是有人低成本快速扩张的时候。


    经济低迷，口红和电影业就繁荣；实体店萧条，可能正因为网店和微商发达。


    更有很多在传统过剩行业中遭遇发展瓶颈的，他们比谁都急迫地寻找产业升级的方法和路径，寻找新的投资渠道。伟大的企业家和发明家，正是在这样的困境中突围，不断实现技术进步和人类消费水平的提升，不断提供人们想都没想到的服务和商品。

    '
