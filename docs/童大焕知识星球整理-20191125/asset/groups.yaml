    # 附：买房必须破除城市迷信


    童大焕—2018 年 1 月 4 日


    2018 年 1 月 4 日 12:00，我发了一条短微博：“买房一定要破除城市迷信，选择区位【地段】和产品比选择城市还重要。”


    有人说：“感觉这一句话几乎把你以前的理论都推翻了。不解？”


    这位读者是没有理解城乡之间、城市之间和城市内部，从区位到产品都越来越分化越来越陡峭的逻辑而已。我其实早就对“省会迷信”提出过警告，认为一些特别的小城镇，比另一些中西部和东北省会还好。


    非物质生产占主流的服务业时代，财富的逻辑在发生变化，城市的生产和生活结合得越来越紧密。产品要更新换代，区位在竞争性发展，城市内部也在兴衰变化。即使是同一区位，产品定位发生偏离，也会成为鸡肋产品。比如我
    2016 年 1 月下旬，面向二期学员和弟子，用两篇独家文章，分析了北京最核心地段某楼盘定位错误。果然，两年时间过去，北京房价经历了大涨又经历了更严厉的调控带来的部分下跌，这个项目的
    100 多套房却推得很用力、卖得很艰难，价格也基本徘徊不动。并不是一线城市所有的房子随便买都行。


    下面讲几个真实案例：


    2017 年 12 月 27 日，有人对我说：“我就是上次在深圳科学馆听你讲座的（2014 年底），然后问东莞有套房，想回到深圳，有什么办法。您给我的建议是卖掉。结果，市场一放松，我就立即卖掉，同时（2015
    年 6 月）到深圳某处买了现在居住的 63.5 平米两居室，总价 281 万，现在市价在 270 万上下。”


    我了解了他的具体房源情况后，发现其地段选择不太对，尤其是选择的是逐渐被淘汰的过时产品，导致房价不仅没有上涨，反而下跌，而且脱手困难。【卖东莞买深圳是对的，但是买深圳时的区位和产品没选对。】


    同年（2015），一对深圳夫妇专程飞北京找我订制，8 月 22 日，在我具体指导下买的房，119 平 750 万。2017 年 12 月 30 日我问他情况，他的回答是：“最近一直还在涨，而且放盘很少（同户型同面积有一套最低报价
    985 万）。租金也很可观，基本上 15000 租金一个礼拜就可以租出去。”


