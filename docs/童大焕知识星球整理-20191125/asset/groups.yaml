    ## 影响售价与租金价格的受众群体差异


    “影响售价的受众群体，是全国符合在该域有购房资格的人；然而影响租金价格的受众群体，仅仅是该城市的上班族。”《鹏城有路》——这个判断，我认为才是相对精准的。也就是说，“当下”的价格，本身是合理的。


    但也要提防另一种情况，就是纯投资性购房，资金也是来自全国各地，也会短期催涨当地房价，但迟早房价会回归应有价值，要水落石出。


    ## 关于通货膨胀预期的误区


    有人说：“你肯花多少钱买房子，实际要看你对通货膨胀的预期是多少。”


    这个判断，基本上也是错的。


    我们虽然知道，通胀是全球范围内的大概率事件，但即使不通胀或者通胀很低微，全球范围内，优质大城市房价涨幅也是高于通胀的。


    另一方面，同样的国度，按理说通胀率在同样的时间内，是同时作用于每一寸国土的，但全国各地的房价涨幅却大不相同。有时是因为各地政策不同或市场炒作力量不同，但更远的时间里，更为根本的结算因素，则是城市化规律下，“人聚财聚，人散财散”使然。


    ## 租售比的参考意义


    为什么只有在同一城市不同区位选择时才偶尔参考租售比？


    这是因为，一方面，眼球经济会吸引人们追风口，导致一些区域短期内被高估，这时候，租售比可以使我们更清楚地看清其被高估的状态；


    另一方面，城市内部房价涨跌也存在波浪现象，并非同时起伏。我们可以通过租售比来大致判断波峰波谷。


    但即使如此，租售比的运用，也只是在城市、地段、产品三种更重要因素考虑之后，最后的辅助参考因素。


    ## 对短期眼光的批判


    有人说：“在我看来买房不看租售比适用于经济高速增长阶段，增量覆盖资金成本。资产在于保值和产生租金收入，在经济发展涨期环境下，一线城市的租金年收入 1.7%
    覆盖不了房贷利率 6%，二是跑不赢国债和理财产品。我认为不看租售比买房除了居住性质否则没有投资价值。”


    这种用短期眼光看长期投资的视野是狭隘的。买房投资就像钓鱼，就像种植水稻和水果，不能天天看着收成，有时几年都没有收成。


    在国内，由于房地产被政策频繁调控，很多价值更是被政策所直接扭曲和遮盖。比如值 10 万的房子被压成了 8 万，实际上是有 2 万的利润被隐藏了。一旦得到价值释放，这个价值就很快回归。


    这就是为什么，过去几乎所有时间里，大部分时间房价似乎都没涨，而股市、期货、黄金、国债、理财产品似乎天天都在涨或者收益很稳定，但到最后一结算，没有一样投资回报收益率超过了买房尤其是正确买房。


    而在经济不景气的时候，更是房价和房租都被低估的时候。这时候，只要保得住现金流，恰恰是房屋入手的最好时机，怎么反而成了没投资价值呢？


    美国博雅公共关系有限公司成立于 1953 年，是全球领先的公共关系和公共事务公司。公司在广泛的公共关系、公共事务、广告及与网站相关的服务领域向客户提供战略思维和项目施行服务。美国总统竞选都常请他们提供咨询等服务。公司创始人夏普新（Harold
    Bursen）两次见到首都青记协秘书长（我朋友），都说这辈子最后悔的事情，是在 1970 年代，石油危机的时候，没有果断买下公司在纽约租的房子。当时业主劝他买，他觉得房租不高，没必要买。现在，整个纽约总部每年的赢利，只够这个房租。


    ## 城市老破小值不值得拥有？


    童大焕—2019 年 9 月 24 日星期二


    1


    问：童老师好，可否写一篇老破小的文章？何为老破小，一线城市的老破小类型，判断方法，棚改的等待可行性，置换的紧迫度，时间点。谢谢！


    答：争取。


    2


    城市老破小，是个不好写的题目，因为掺杂了金融属性、学区房等一系列因素。


    如何定义城市老破小，本身就没有一个统一的标准，大家只是凭感觉。我在这里试着做一个简单的界定：


    - 建筑交房年代在 2000 年以前，也就是 1998 城市住房商品化以前；

    - 面积 60 平米以下；

    - 无独立卫生间；

    - 无电梯；

    - 无金融属性（不能直接和银行发生抵押贷款等关系）的房子。


    在未来，不仅仅没有电梯的家属院、老商品房被归类成老破小，没有用心维护、没有靠谱物业的电梯高层小区，从广义上来解读，一样会成为老破小。


    3


    老破小的优势：地段较好，装修保养可以的话租金不错，不少老破小带学区，周边的城市配套完善，交通便利，价格较低。


    4


    老破小的劣势：没有小区环境，停车不方便，旧，破，外观不好，整体环境比较一般，甚至简陋，居住人群混杂，物业管理不到位。


    老破小一般处在老城区，是城市中心没错，但由于老城区拆迁成本高，所以新城区和新社区一般会尽量避开老城区。而新型就业中心（主要是大城市以写字楼为标志的生产性服务业中心）和新型社区，商业综合体的配套与老城区商业配套往往不是一个量级的对比，新型就业中心和新型社区的商业配套，备受年轻人喜爱，他们一旦接触了新型社区的商业配套，是不会太喜欢老城区商业配套的。这是老城区老破小的“代沟劣势”。


    5


    从投资买入角度，中小城市的老破小，建议一律远离。


    大城市，有些这样的老破小，有独特的学区资源，或有丰富文化历史资源的平房，还是有不少人追捧。但从投资角度，从利用杠杆做大资产角度，从普通老百姓资产金融属性和流动性重要的角度来说，我还是建议大家远离。


    有三种人可以买大城市老破小：一种是为了孩子读书，不把投资回报当主要追求；一种是有闲钱，又喜欢那种历史文化氛围，买来自用；另一种是极度厌恶风险，极度厌恶银行贷款的，也可以买——因为，买比不买好，买了，总是一个资产积累和沉淀。


    先上车，再换座！比一直追着车跑来得容易得多。


    但有一点要特别注意：别以为老破小现在价格便宜，就会获得高于大市的超额收益！有些人关注老破小，就是想冲着这个来的。没那么回事，市场本身是聪明的，大部分时候，价格已经体现了价值。而如果没有杠杆和金融属性的老破小，总收益只会更低，不可能更高。


    6


    买下老破小，博棚改？


    那我就劝你少动那份小心思吧。那是赌博，不是投资。“对自己不能主宰的事情，切不可用情过深。”（张春蔚）


    自己的命运，尽量掌握在自己手里。


    7


    从卖出的角度，别说是上面几种类型，就是有卫生间、有金融属性但没有电梯的老破小（年代较久，面积较小，也含那种自建小楼），也都建议卖出，置换更优更好的房子。


    8


    对于没有太多资产和闲钱的普通老百姓来说，房屋的金融属性非常重要。急用时、孩子出国上学需要学费时，金融属性都是救命稻草。


    **为什么小产权房价格往往远低于同地段品质差不多的纯商品房？** 不仅仅是因为没有土地价格导致成本低吗？不！我们知道地价并不决定房价，而是房价决定地价。小产权房价格低的最根本因素，就是缺乏金融属性！


    缺乏金融属性的房子，不能利用银行杠杆做大资产，不能玩抵押贷款“灵魂出壳”做更多更大资产的游戏，到了要用钱的关键时刻，不管遇到牛市熊市，都只有卖房一途，有可能使一辈子心血毁于一旦。甚至有可能卖也卖不出，急死人也没用。


    9


    买房投资的正确方法，从来不是盯着某个地方、某种类型的房子不放，而是根据自己的首付、月供、购房资格等情况，尽量选择匹配自己的最核心地带【城市+地段+产品三位一体】的最优质资产，不要总想着某个规划、某个特殊类型给自己超额回报。大部分城市，城市边界已经基本定型，房屋的更新换代也势在必行。要知道，核心地段、优质商品房的长期涨潮和租金回报，终归是高于大市平均数的。


    用这种平常心去投资买房，就不会专想搞什么奇门遁甲之术。


    **术，不如道。** 道，就是城市化发展的规律和趋势——人口往哪些城市发展，城市内部又往哪些区域发展。这种地段选择，再加上适当的产品选择，最重要。


    ## 环大都市圈的购房逻辑


    童大焕—2019 年 9 月 25 日星期三


    1


    匿名用户提问：我在 3 年前听过一位老师的课程，他提到首选一线城市和一线城市的卫星城。如上海市和环上海市花桥镇。然后我就死守这句话，一直在环环环里面转。买了环上海市嘉善孔雀城房子，后来退了。错过了重庆、西安市等房价大涨的机会。首选一线城市和环一线城市的想法是否要改一改呢？我的大脑思维比较僵化，一旦认准了，就死守了。我确实不太专业啊！谢谢了！


    答：首先，“错过了重庆、西安市等房价大涨的机会”之类的观念要纠正，抱着这样炒波段的念头去炒房，一定会把自己炒死的，只是时间的问题，迟早的问题。其次，关于环一线，首先要搞懂环一线的逻辑才能投。房子一定是最终要有人住的，如果只冲着环一线的概念，大家都去炒作，接盘侠还是炒作人，那就要看你的运气能不能及时逃得出来了！！！我当年拒绝固安团购，说的是“到入住时，到二手时就歇菜了”。环一线，那就是睡城，那就是居住人口从就业中心溢出，就要重点考虑距离；如果产业溢出，那就要重点考虑在当地就业人口的购买力。**看懂了没？自己看不懂的财富，不可能成为留得住的财富；即使曾经拥有，也会稍纵即逝，如双手捧水。**


    2


    因为内地购房限制太多，因为闲钱太多，因为追求一夜暴富的人太多，所以很多人、很多机构、很多地方，用各种概念忽悠你去不限购的环大都市圈，环京，环沪，环深，环穗（广州），去买房，大湾区，杭州湾，一个概念一批韭菜，一个概念一批韭菜……


    炒作资金一波又一波，就看你逃得逃不脱。


    很多人注定要把一辈子的财富沉淀在一个又一个风起云涌的泥潭里。无以自拔。


    3


    环大都市圈买房，只有三个逻辑，离开了这三个逻辑，全是扯蛋：


    - 第一个逻辑：如果是睡城，那就是居住人口从超级大都市的就业中心溢出，就要重点考虑距离：这个距离，不可超出我带领的城市化研究院 2016 年底研究得出的超级大都市三十公里左右半径极限。想要超出太多，那就先请上帝一天给你
    28 小时再说。

    - 第二个逻辑：产业溢出，那就重点考虑在当地就业人口的购买力。


    环京燕郊和环沪花桥的比较，前者是睡城，后者是“产业溢出”。其实也根本不存在什么产业溢出，人家花桥一直跟着昆山搞制造业，它的制造业，根本不是从上海“产业溢出”。


    但是那些从事制造业的产业工人，他们的收入是否支撑得起花桥房价？他们是否有意愿在花桥买房长期定居？机器换人又会使这些产业工人挤向何方？


    现代服务业产业（金融、法律、咨询管理、广告和会计，还有微笑曲线的两端——研发与营销等）只有集聚，根本不存在“溢出”之说。


    但现代服务业的就业人口，却是可以“溢出”的，溢出的原因，主要有两点：一是中心城区房价太高，买不起；二是中心城区限购，“睡城”可能不限购。


    - 第三个逻辑：上学驱动。像北京这样的特大城市，2013 年以来一直试图通过限制外来人口子女读书的方式，达到控制人口的目的（参考本人 2014 年 1 月
    19 日腾讯大家专栏文章《超大城市不是想控就能控》），导致一些家长，被迫到天津、河北固安等地买房，爷爷奶奶带着孩子读书，父母周末团聚。


    这类需求，不可以作为投资需求来看待。


    而且，随着国家城市化战略逐渐回到规律上来，这类上学驱动需求随时有可能萎缩，但你我都不知道具体时间点，决策者也未必知道——2019 年 8 月 26 日，中央财经委员会第五次会议指出：经济发展的空间结构正在发生深刻变化，中心城市和城市群正在成为承载发展要素的主要空间形式……**增强中心城市和城市群等经济发展优势区域的经济和人口承载能力**，增强其他地区在保障粮食安全、生态安全、边疆安全等方面的功能。


    之前的 **2013 年 11 月、2014 年 7 月**提出的都是：合理确定大城市落户条件，严格控制特大城市人口规模。或者：城区人口 **300 万至
    500 万**的城市，要适度控制落户规模和节奏，严格控制特大城市人口规模。


    一定要搞清楚逻辑，搞清楚自己到底想要什么。


    4


    像下面这种不懂装懂的胡说八道，就太多了：


    网名“苏州房司令”在微博上说：“不得不承认环京有部分的房子从 **2017.4** 月至今，出现腰斩式跌幅，如燕郊的福成。相比环京，环沪的花桥就相对稳定。一原因没别的，燕郊的大哥是廊坊，而花桥的大哥是天下第一县昆山。”


    我怼他：“这个判断属于不懂装懂的胡说。花桥也像燕郊一样只限县内社保有效试试！”


    花桥房价暂时稳定而燕郊房价暴跌，根本不是什么谁是大哥的问题，而是花桥限购形同虚设而燕郊遭遇堪称国内最严厉的限购之一：


    - 花桥限购：1、外地人限购 1 套需要 1 年社保或个税证明；2、本地人限购 3 套，……

    - 燕郊限购：2017.6.6 起，外地户口必须有当地（只限于三河本县）社保或纳税证明连续 3 年，不得断交，不得补交。假结婚什么的都无法突破。


    而全三河全县不过 60 万人口，但仅仅一个燕郊镇就号称超过 60 甚至百万人口（大部分是在当地没有社保没有纳税证明也没有当地户籍的外来人口）！


    燕郊本质是北京的睡城，在北京上班的人，谁会在燕郊交社保或纳个税？限购约等于让交易速冻。


    微博上，“苏州房司令”被我怼后，删除了原微博。


    5


    网络上太多的人，只是运气好搭上了一波历史潮流，自己都没搞懂怎么回事，就开始堂而皇之在那里教人买房了。


    经纬中国创始管理合伙人张颖有一段话说得好：


    > “前几年靠运气挣的钱，今年凭本事全亏光了。（大焕注：“本事”二字要加引号才好。）这段调侃之语，其实对于身边很多人来说，是大实话。太多的人，在过去几年，把自己的运气，平台的力量（大焕注：还有潮流的力量），当成了自己的实力。这种错，会死人的。”


    ## 算账要算大账总账


    童大焕—2019 年 9 月 26 日星期四


    在《傻瓜和外行才看房价租售比》文后，有读者问：“就是说买了正确的房子，将来租售比一定会让人满意的。”


    答：“你的理解不对。租售比都是指‘当下’的租金和价格比。不能用过去的售价对今天和未来的租金。所以一定要正确看懂未来人口流动趋势，否则任何时候都有可能被租售比吓蒙，任何时候都有人忽悠你，租售比太低了，赶紧卖房炒股炒币炒黄金买理财吧！未来，随着人口越来越集聚，租售比还有可能低得更加离谱。”


    这不，前几天才发那篇文章，今天又又有人来问类似“租金比理财低”的事情！


    问：我的（北京二环）冠城名歌道的房子 58 平，70 年产权，办公出租每年是 10 万，公积金贷款。但因为最近经济不景气，租户常常断押。如果卖掉，还掉贷款后得到现金
    320 万左右，5% 的理财得每年 16 万。您觉得卖掉划算吗？


    答：卖房买理财，得是对房子多么没信心了？而理财就绝对安全吗？如果当年买名歌道的钱拿去理财，现在每年会有多少回报？当年是多少钱买的？经济周期总会遇到，低潮时卖出将来要后悔的哦。


    问：5% 的理财应该不难做到吧？我有个做市政工程的亲戚，他还说给我 10% 呢。这个冠城的房子，一直没有涨，不像纯住宅那样。当年 60 万（首付）买的，2.3
    万（单价），贷款 90 万现在顶多是 7 万，冠城纯住宅的房价是 12 万左右。


    答：假如你是 150 万全款买的，加上空租，每年 8 万，仅租金回报率是 5.3%，而且还升值了 4.7 万每平（272.6 万），当年若是选择买理财是什么结果？冠城纯住宅当年卖得也更贵吧？冠城是哪一年买的？"


    "2010 年。"


    "冠城当时的纯住宅价格是多少？"


    问："4 万左右，3 万多。目前每个月还贷 4100 元。就是感觉：去掉还贷，每年有5万的收入。但卖掉房后，最保守的理财也有每年15万的收入。就是说每年多了10万。"


    答："纯住宅假设是3.8万，现在12万，涨幅是3.157倍；你的现在7万当年2.3万涨幅是3.043倍，你的租金回报比住宅高，实际回报差不了多少啊！你是被直观数据蒙住了眼睛。"


    3


    抛开当事人可能现金流不是很宽裕，想做当下现金流等原因，我认为当事人主要还是被看得见的利息蒙住了双眼，没有看见理财等的风险，更没有看见房价上涨的巨额回报。


    为了便于计算方便，过去多年，名教道的房子抛开大部分时间租金超月供不算，姑且只算租金和月供持平，那么60万首付，现在假如卖掉可净得320万，净利润260万，9年时间，平均年利率是260/60/9*100%=48.1%！


    请问，世界上有什么理财产品能有这么高的回报？！


    而且，这个平均每年48.1%的上涨回报，是在2010年以来北京经历了两次房价大跌以后的结果：一次是2014年的大跌，跌幅约20%；一次是2017.3.17以来的大跌，跌幅高达20%~30%。


    正确的房产投资是世界上安全性最好、风险最低、流动性最强、回报率最高的投资，并不是谁杜撰出来的谎言，而是铁板钉钉聊出来的事实。


    更何况，从长远来看，名教道的房子租金还会不断提升；房价也还会持续上涨。


    而理财，从2010年起，每年的回报率是逐步下降的。有时，即使是亲戚和最好的朋友，还不一定能保证回本。因为，谁也不希望经营有风险，但一旦有风险，经营失败，谁也挽救不了。


    4


    如果2010年60万全部拿去理财，始终无风险，往高里算，年息一直都是稳稳的10%，那么每年就是6万，将近9年过去，一共54万，和现在已成事实的住房投资回报260万相比，差距有多大？


    而从流动性角度，如果是买了正确的优质房产，随时可以抵押，可以买卖。如果是理财呢，哪怕是最好的亲友，你想要钱，就能很快要回来？


    5


    一个人能握住多大的财富，跟他的视野息息相关。


    而决定视野的，首先是算账这一基本能力。算账，一定要算大账、算总账，不要一叶障目不见森林。一叶障目不见森林者，最容易因小失大。


    ## 当今中国限购限贷最严厉的区域是哪里？


    童大焕—2019 年 9 月 30 日


    1


    房价涨跌一定是有规律，有逻辑，有原因的。


    长期原因，是人口和货币。但通胀因素个人不可控，个人完全不可对自己不可控的事物用过深用力过猛；同时通胀也不是均衡地洒向每一寸土地。因此，**人口才是最后总结算因素，个人投资者一定要把全部重心放在研究人口流动上**。


    人聚财聚，人散财散。人是一切价值的尺度，没有了人，再美的宫殿与房屋都是价值归零的“巨人的花园”。


    房价涨跌的短期原因，是政策和炒作。一个政策可以让房价一年涨一倍，比如 **2016 年 2 月全面降低首付以及限贷放松，使很多城市房价当年涨一倍，这个房价先由中心城市开始涨起；眼看有点控不住，2017.3.17
    以后又强化大城市和环大都市圈的限购限贷，使北京这样的城市，房价到现在也从高位上涨了二三成。**


    **2017.3.17 以后，一二线城市更严厉的限购限贷抬住了大城市资金的流动性，使资金和注意方向三四线城市蔓延。与此同时，2017 年 6 月住建部等《关于加强近期住房及用地供应管理和调控有关工作的通知》中明确指出，在商品住房库存量大、市场房源充足的三四线城市，棚户区改造要以货币化安置为主（以前是实物安置）。三四线城市作为主要人口流出地，其住房需求一大部分是由棚改货币化安置释放的改善型需求，支撑了
    2017 年以来三四线城市房价。而棚改货币化安置资金的源头为 PSL（抵押补充贷款），因此，抵押补充贷款的溢出效应间接拉动了三四线城市房价上升。**


    很多人口流出的三四线中小城市货币化棚改、涨价去库存，又使中小城市房价到现在涨百分之五六十甚至一倍。


    而炒作方面，更多是开发商和大小 V 借政策炒作，比如哪里搞湾区，哪里搞自贸区，资金炒一把。比起大城市来说，这些局部区域往往可售面积小，容易炒起来。


    由于政策和炒作原因导致的涨跌，能否持续，取决于最后的人口因素，也就是人最终是流入还是流出。


    2


    问当今中国限购限贷最严厉的区域是哪里，并非无的放矢，而是可以通过比较，借此训练我们的分析判断能力。


    看懂其中的逻辑，在高价值的地方，跌了也不会慌。只要资金链没问题，就冷静

