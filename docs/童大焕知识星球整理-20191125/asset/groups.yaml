    “以己度人”抨击高房价，还不算多大问题。更大的问题是，很多舆论和

    意见领袖，从自身阶层的居住追求角度出发，认为很多进城人的居住环境

    很没人道，没有尊严。由此导致社会从舆论环境到社会管制上全面扼杀底

