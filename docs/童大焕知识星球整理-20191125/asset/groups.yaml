    \n网络时代，信息垃圾太多，学会排除垃圾信息，至关重要。\n\n## 理解六座城 理解财富与文明\n\n童大焕—2019 年 8 月 16 日\n\n###\
    \ 1\n\n2014 年麦肯锡评出全球 6 个枢纽城市，纽约、伦敦、中国香港、东京、新加坡、迪拜。\n\n根据 2015 年《全球金融中心指数》（GFCI）报告，香港紧跟伦敦、纽约位列第三，依然是亚洲第一金融中心，新加坡紧随其后，亚太金融双雄间差距逐渐缩小，上海则跌出二十。\n\
    \n2018 年 3 月第 23 期“全球金融中心指数”全球前 20 大金融中心排名依次为伦敦、纽约、香港、新加坡、东京、上海、多伦多、旧金山、悉尼、波士顿、北京、墨尔本、蒙特利尔、芝加哥、温哥华、苏黎世、洛杉矶、深圳、迪拜、法兰克福。\n\
    \n1991 年的迪拜，还是一片沙漠，20 年后就成为一个具有世界影响力的大都市。原因何在？\n\n新加坡的发展也非常晚近，1965 年才正式独立，此前两年曾脱离投靠马来西亚。\n\
    \n### 2\n\n上述六座城市，都有两大共同点：都是国际金融中心，都是国际枢纽城市，城市密集紧凑，效率极高。至于国际旅游城市，则是前几方面的副产品。\n\
    \n而奠定国际金融中心和国际枢纽城市地位的，都是软环境。\n\n### 3\n\n新加坡、迪拜，这两个原本都是不毛之地，弹丸之地，能够迅速成长为在全球城市中举足轻重的国际枢纽型大都市，跟领导人的危机意识和一系列改革息息相关。\n\
    \n以迪拜为例。迪拜领导人最早意识到有危机，石油用完怎么办？后代怎么办？在全球的地位怎么办？然后就提出把落后资源转化成非石油竞争力，将来不靠石油竞争。于是派出最得力的人到新加坡学习，学新加坡的土地制度、城市建设，关键是把商业制度改了，税收很低，进关、出关非常便利。\n\
    \n目前，靠石油发家的迪拜，仅 5% 的收入来自石油，95% 来自非石油产业，拥有大量来自金融、娱乐、旅游等领域收入。全世界很多货物往沙漠这个地方运载或中转，游客也越来越多，旅游人次超越了巴黎，成为泰国曼谷和英国伦敦之后，世界第三大旅游目的地。非本国的居民在迪拜占\
    \ 90%。\n\n### 4\n\n香港科技大学教授丁学良在 2018 年 8 月接受腾讯思享会采访时认为，完整的普通法体系、宽松的信息流通环境和良好的生活条件是金融中心形成的三大基本条件，而对眼下的中国大陆来说，香港的国际金融中心地位无可替代，在可见的未来，内地没有产生国际金融中心的基本条件。\n\
    \n丁学良尤其强调，关键的一点就是香港有一个比较好的法律体系——“这个法律体系必须是从英国的普通法延续下来的，英国的普通法使得全世界所有市场经济，基本上都在一个法律背景下运作。”“必须有相对宽松的信息流通环境。金融是瞬息万变的，对于某一特定目标或任务而言最重要的信息，早收到几秒钟和晚收到几秒钟有重大的区别。”\n\
    \n而成为物流、交通的枢纽型城市，法治和低税同时起到奠基性的作用。英国人在香港实行的税收制度很透明，而伦敦、纽约的税收制度还比不上香港的税率低。\n\n前面已经说了，迪拜的税收也非常之低。\n\
    \n### 5\n\n大家有没有看出问题的关键核心之所在？\n\n成就一座国际金融中心的必要条件是：良好的法治。这是最基础的海定神针。在良好的法治体系下，相关城市成为全世界富人生命安全和财产安全的避风港。\n\
    \n马斯洛理论把人的需求分成生理需求（Physiological needs）、安全需求（Safety needs）、爱和归属感（Love and belonging）、尊重（Esteem）和自我实现（Self-actualization）五类，依次由较低层次到较高层次排列。\n\
    \n很多人认为有了钱就可以自然上升到更高阶的需求，其实是个误会。富人的生命和财产安全需求，比穷人更迫切。正如俗话所说：光脚的不怕穿鞋的。因为富人的机会成本更高，所以对安全的需求也更迫切。\n\
    \n良好的法治条件，吸引全世界的富人扎堆。自由迅捷的信息条件和低税收，第一时间无障碍得连通世界，低成本创新创业。这便是世界金融中心的资金基础和市场基础。\n\
    \n有了这三大基础，相关城市就会源源不断地吸引全世界的富裕资金、全世界的优秀人才就源源不断地注入这个城市。这就是核心城市、核心节点的竞争战略和支撑点。\n\n\
    富人和优秀人才的聚集地，自然而然也会创造出优越的文化和教育、卫生等生活条件。多年来，香港的金融、法律、国际航运、商贸、信息网络、教育、高端知识服务以及生物医药等服务贸易领域，一直保持着亚洲顶级的地位。\n\
    \n香港的国际金融中心地位，成就了香港，也服务着中国大陆。中国香港和中国大陆的关系，是唇齿相依、你中有我我有你、一荣俱荣一损俱损的关系。\n\n### 6\n\
    \n世界六大金融中心和枢纽型城市，当然还有共同点就是楼高，楼密，楼贵。\n\n很多人一直拿香港高房价说事，认为高房价盘剥了年轻人，让年轻人感到绝望。一些人一再呼吁要抑制豪强、接济青年。这是一种因果颠倒本末倒置的有毒视角。\n\
    \n世界六大金融中心和枢纽型城市，这里的房地产、金融等富豪，都是赚全世界的钱，然后把这里当成避风港，当成财富仓库。然后，吸引全世界最优秀的专业人才，再为全世界提供金融、法律、教育、医疗等高端服务。\n\
    \n城市的高楼大厦并不值钱，值钱的是全世界的富人把它当成了财富仓库，以及，在这里奋斗的各种优秀的专业人才，把这里变成了全世界财富的发动机。由此而给城市提供了各种各样的就业机会，包括高端生产性服务业和中低收入的生活类服务业的就业机会。\n\
    \n### 7\n\n英国是工业革命的源头、引领世界的全球法治传统创立者，伦敦作为其首都，工业化时代和服务贸易时代都没有落后，成为当之无愧的世界领导者；美国得英治\n"
