    ## 2019年5月17日，我在《房地产是现代增长模式的第一引擎》一文中写道


    经济下行，房地产救中国经济的牌，迟早还要打。迟打还是早打，无法预料。


    现代金融制度被发明并被大规模运用以后，土地和房屋成为全世界最大的信用工具，自然，也就成为现代型增长的第一引擎。


    传统的古典增长模式和现代增长模式的最大不同，就是获得第一桶金（也就是原始资本）的路径和方法不同。


    所谓传统古典型增长，就是通过过去剩余的积累获得原始资本——今天的投资起点，来源于过去的资本积累。


    现代型增长则是通过未来的收益贴现，获得今天的原始资本，比如发行股票、债券，通过按揭和抵押土地和房屋，通过无抵押信用贷，向银行、向未来借钱等。


    “房地产是经济发展的成果，而不是原因”，这个逻辑是不成立的。房地产无论从创造财富、创造货币的角度，都是自成本体系的。


    有了现代金融制度【向未来借钱】以后，房地产凭空创造出了很多货币，进而加速了上下游60多个相关行业的发展，制造了全社会的繁荣。


    并不是先有了钱，再来建房子和买房子。而是有了一点首付，就可以借款数倍于首付的银行杠杆来买房。按揭制度为人们用明天的钱享受今天的住房插上了翅膀。如果没有这一制度，估计今天90%以上的新薪阶层在城市买不起房。


