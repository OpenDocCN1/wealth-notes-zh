    ## 2019年5月17日，我在《房地产是现代增长模式的第一引擎》一文中写道


    经济下行，房地产救中国经济的牌，迟早还要打。迟打还是早打，无法预料。


    现代金融制度被发明并被大规模运用以后，土地和房屋成为全世界最大的信用工具，自然，也就成为现代型增长的第一引擎。


    传统的古典增长模式和现代增长模式的最大不同，就是获得第一桶金（也就是原始资本）的路径和方法不同。


    所谓传统古典型增长，就是通过过去剩余的积累获得原始资本——今天的投资起点，来源于过去的资本积累。


    现代型增长则是通过未来的收益贴现，获得今天的原始资本，比如发行股票、债券，通过按揭和抵押土地和房屋，通过无抵押信用贷，向银行、向未来借钱等。


    “房地产是经济发展的成果，而不是原因”，这个逻辑是不成立的。房地产无论从创造财富、创造货币的角度，都是自成本体系的。


    有了现代金融制度【向未来借钱】以后，房地产凭空创造出了很多货币，进而加速了上下游60多个相关行业的发展，制造了全社会的繁荣。


    并不是先有了钱，再来建房子和买房子。而是有了一点首付，就可以借款数倍于首付的银行杠杆来买房。按揭制度为人们用明天的钱享受今天的住房插上了翅膀。如果没有这一制度，估计今天90%以上的新薪阶层在城市买不起房。


    > 2019年11月9日，匿名用户 提问：童老师，请问一个问题：此轮经济降速，是否房地产业不起来，经济也难起来？亦或经济转型，如果转型成功，无需房地产也能让经济复苏？


    答：我们今天的很多困局，陈志武在 2009 年《中国企业家》10 月期《从 2049 年看中国》已经预见，比如外贸增长乏力，国进民退，土地财政尾声地方政府被迫转为税收财政，导致强化征税（大焕：会加剧企业家群体的失望和悲观情绪甚至抽逃资金）等。


    也就是说，今天的困境是必然的，符合我们国家多年来选择的发展路径下，经济发展的自身逻辑与规律。


    当然，这几年叠加了很多事情，使困局更困，比如贸易战。


    但也还有很多本不该发生的事情，比如私企退场论，比如一刀切的环保、拆违和城乡整治，都使原本需要转型的经济更加雪上加霜。


    在这个背景之下，我坚持多年来坚持的观点：中国几乎所有产能都是过剩的，房地产整体也是严重过剩的，甚至比其它产能过剩更严重，只不过因为房地产是不动产，所以不能实现空间流动和转移，因此将长期存在“局部严重短缺，整体严重过剩”的局面。


    因为还有严重短缺，因为还有人口加速度集聚，所以此番转型，还得依赖或局部依赖房地产。而中国经济要想转型成功，也必须依赖高密度大城市化带来的服务业转型。这个过程，也离不开房地产。


    【后记：摩根士丹利预测，到 2030 年，中国的城镇化率将从目前的 60%上升到 75%，届时将新增 2.2 亿城市居民。全要素生产率的年复合增长率将保持在
    1.6%(2014-2018 年为 1.9%)，劳动生产率将比目前水平提高 80%。55%的劳动生产率增长将来自智慧超级城市的集聚效应、城市的迁移，5%来自土地改革和智慧农业支撑下的农业现代化。中国将步入高收入水平，人均年收入翻一番，从当前的
    9450 美元增至 2030 年的 17800 美元。大焕评：摩根士丹利没有看到中国目前的将近 60%城镇化率是虚的，2.8 亿农民工的绝大多数最多在县城买房，人却在省会以上城市打工，没有真正完成向大城市的集聚。所以我一直提醒大家不要过于注重数字，大数据无法给我们指明未来，一定要经人——尤其是真正专业的人的加工分析，一定要有大一点的全局理性视野，知道城市化的方向，才有房产投资的未来。古人说，不谋全局者，不足以谋一域也！】


    当然有关方面投鼠忌器，当心重启房地产会带来房价失控，进而加剧金融风险。其中的分寸，任何人都不易掌握。这也是此番不敢在房产方面有大动作的原因。但因城施策的调整办法，相信会不断出台。


    深圳突降利好：对于深圳 144 平米以下的房产，从 2019 年 11 月 11 号开始，深圳将不再按照以前各区的豪宅线标准征收增值税。


    这正是“因城施策的调整办法，相信会不断出台”的具体体现。


    深圳房价应声而涨。且因为是卖方市场，所以房价上涨一般都超过了增值税减免。


    8


    2019 年 11 月 13，我给星球会员和弟子群发了一则短评：


    据朱罗纪 2019 年 11 月 11 日《关于深圳经济的一些看法》：深圳民间投资增速从 2017 年的 22.5%，下滑到 2018 年的 12.5%，进而剧烈下滑到
    2019 年前三季度的 3%！深圳经济历来以民营企业为支柱——截至今 5 月，深圳民营经济商事主体达到 314 万家，民营商事主体占比达到 97.66%。那么，民间投资只增长了
    3%，意味着深圳的民营企业基本都不投资了！


    大焕评：


    深圳民企不再投资，意味着对未来经济信心的丧失。其中有退场论原因也有产能过剩等各种原因。


    只有私营投资才能促进经济增长。如果没有了私人投资，未来是很悲观的。


    病来如山倒病去如抽丝。要重新恢复民间投资信心，除非有大的营商环境和气候的改变。在此之前，用房地产投资代替一般民间商业投资，将是不得已的选择。


    但也不要指望 2016 年至 2018 年那种动不动一年上涨 100%或 50%的暴涨。


    未来两三年，一二线城市要入市买房的要抓紧入市了。三四线及中西部和北方地区能够出逃的要抓紧出逃。


    9


    综上，我再强调一遍，经济增长的本质不是在过剩的“实体经济产能”里钻死胡同，而是要在大城市化、非物质生产性服务业领域扩张信用。


    如果没有个人和私人企业的信用扩张，如果货币不能像流水一样自由流动，生产再多的物质商品，也只能在过剩中或者烂掉或者生锈，生产和制造过程还浪费资源、制造环境污染；赚了再多的钱也只能像守财奴一样守着钱包、存在银行和地窖，不能通过自由市场流通创造新的就业机会。


    明明过去四十年经济一直高增长，明明大部分人在过去都积累了很多财富，为什么经济却会一夜之间突然失速？


    本质上就是传统产能过剩加上信用扩张受阻。


    看明白了这一点，你也就看明白了城市化、服务业乃至中国未来改革的方向。


    【完】


