    你用计划经济和农业时代的思维来思考服务业时代、市场经济时代、金融按揭时代（房屋资产的相当部分成了银行贷款），这是两个完全不同思维维度的对话，互相之间完全不可理解。限制人流调和把人和机构迁出去，是一样的问题吗？再说，即使是计划经济时代，办事情也得要钱不是？通州为什么四年后拿掉了副中心字样，而且固投什么的每年直降30%多？你以为只要人下定决心排除万难就可以不用飞机不用船，徒手飞跃太平洋？


    这就是我一再说的“政策不是真空物，财政金融硬约束。”


    # 3


    很多人有所不知，在所谓“政令不出中南海”的胡温时代，恰恰是中央财政最有钱的时代。那个时代，没有大肆宣传但悄悄地干成了河北曹妃甸和天津滨海新区两大新区，数千上万亿元的投资砸进去，也肩负了上上下下“京津冀一体化”和“京津冀协同发展”也就是平衡发展的厚望。乃至曾有“邓的深圳、江的浦东、胡温的曹妃甸”一说。


    然而，新区大楼是密密麻麻地建成了，公司和人却怎么都不来，留下的，是曹妃甸、于家堡、响螺湾“鬼城”的传说（于家堡和响螺湾是滨海新区两个规划的金融商务中心，天际线非常漂亮，唯一缺点是人少），以及泪水斑斑、越压越沉重的债。


    # 4


    我不认为曹妃甸和滨海新区未来会有郑东新区一样，从“鬼城”变到繁华之地的好命运，因为郑东新区离旧城区只有一条马路之隔，而曹妃甸和滨海新区，离现有大都市北京、天津、唐山都太遥远了！


    此间的“规律”在哪里？请重温我和我的同事们首先发现并提出的“城市三十公'
  - '[PAGE 110]


    里极限半径说”。


    +   5

    已经完成大部分固定资产投资的新城新区，命运尚且如此，那些还需要大量硬件投入的，同样山遥水远的，就更不知未来会怎样了。


    为什么我一再强调“信规律不信规划，信市场不信市长”？恰恰是因为人的生命太短暂，不会用一生，去等待一个新城、新区的缓慢成长，大多数人，总是急于奔向人更多、机会也更多的地方，去进行机会与财富的千百万次碰撞。


    为什么我一再强调“政策不是真空物，财政金融硬约束”？恰恰是因为，政府并不创造财富，财富需要市场来创造。政府固然可以集中力量干成某件事，但只有这件事符合规律，它才能成功，才有产出。否则就是沉没成本。


