    更可恶的，是从自己的感受出发，认为农民进城，住得很差，由此认为他们根本就不该进城。一方面呼吁城市管理者用种种方法驱赶他们，一方面要求转移支付去支援落后地区建设，免得农民“背井离乡”。


    这是一种不折不扣的伪善。


    一些专家提出了很多三农政策，大部分都是扯蛋。他们应该去向农民工为什么背井离乡抛妻别子进城，而不是自己赚足了钱或拿着高薪到农村晃一晃，就感觉农村空气很好，你们为什么要离开家乡？


    26岁的越南女孩 Tra My 2019年10月3日离家前往法国，23日成为英国藏尸货车案39名遇难者之一。其父哽咽对梨视频表示，全家为偷渡花费27万元，全是借的……


    有人转发并评论时@了我：“偷渡花27万。看来童大焕老师说的出生地的不平等是最大的不平等是真相。”


    虽然我一再强调，优质独立产权房是普通百姓抵御通胀、甚至实现资产和阶层逆袭的唯一工具，但我同样深知，绝大部分人进城，买房并不是他们的目的，大部分人也买不起房。


    充斥舆论的“中产话语”里，一直呼吁打压房价、一直强调所谓的居住权利与尊严，其实充满了居高临下的傲慢与偏见，充满了妄想人人都买得起自住房的无知、狂妄与自负。


    比“推己及人”更高境界的视野与胸怀，是“设身处地”站在别人的立场和角度思考问题。


    仅仅“推己及人”，这样的爱和视野太狭隘了。我们应该静下心来，认真倾听不同阶层、不同处境的人们的心声。“设身处地”，才能真正感知大地的温度、人间的广度、人生的厚度与宽度。


    很多人很多人，在你眼里很悲惨很没有尊严的城市生活，在他们自己眼里，已经宛如天堂，比过去好得太多太多了。


    有了这种同理心，我们才会希望城市多一份包容，还每一个独立自主的个体多一份自由。而不是妄想给他们更多的福利；给不出更多的福利，则一驱之了，眼不见为净。


