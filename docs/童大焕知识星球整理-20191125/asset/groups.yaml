    应该醒醒了。


    在全球性的高密度大城市化潮流之下，绝大多数人的故乡是注定要衰退，而且是迅速衰退的。


    与此相适应，绝大多数国人过去 20 年积累的房屋资产，将在新一轮的大城市化运动中，被迫进行全面的价值重估——极少数城市房价，和它所在的城市一起迅速成长，像珠穆朗玛峰一样高耸隆起；大多数城市房价，和它所在的城市一起衰退，几万元甚至几千元、几百元一套（栋）房，绝不是天方夜谭。


    未来中国，就是繁华的几个大都市，外加广袤的山青水秀的无人地带。这将是中国经济和人口结构的基本版图，和世界大多数国家和地区一样。


    # 6


    文明进步和财富提升的最佳方式不是转移支付，不是救济，而是自由迁徙，让人们遵从经济的规律、遵从内心的自由、选择的自由，到更文明更发达的环境中去，接受整个环境对人的全面重塑。


    是让环境改变我们，而不是我们改变环境。


    中外历史上很多均衡发展的努力，事实上让贫穷落后地区的人们发展速度更慢了。因为，局部、片面的资源向落后地区和人倾斜，效率肯定不如人到发达地区，接受更全面的资源、环境对他的提升和塑造。


    # 7


    人类从农业社会，到工业社会，到今天这个信息社会，表面上的贫富差距必将越来越大。科技越发达，社会越和平、越安定，财富差距越大。这是经济发展的自有规律，也是“贡献越大，财富越多”的真正公平之必然。


    知识分子和政治家不应该再食古不化，念兹在兹地抱着农业匮乏时代“不患寡而患不均”的老皇历。


    农业匮乏时代，是产出相对固定并严格受制于土地、天气、农作物品种等约束，存量竞争，贫富差距问题是“朱门酒肉臭，路有冻死骨”的问题，是穷人无法活下去势必造反暴乱的问题。


    今天和未来，是科技发达，产出过剩，贫富差距问题往往是在无限增量中派生出的问题，是富人通过巨额投资，创造更多就业机会、创造更多造福人类的科技、产品和服务，通过涓滴效应，不断往上提升、向外拓展普通民众（相对穷人）的自由和福利水平的问题。'
  md: '

    # 致良知 知识分子别再去挑动贫富差距的社会情绪了！


    童大焕—2019年8月30日星期五


    城市收缩的背景下，总是稀缺的，大中城市多了一块集体用地用于出租性质的开发，就一定少了一块用于商业开发，如是，商品房的价格一定会往高走而不是往低走。


    还要澄清一个长期以来的天大误解：人们一直以为高房价是政府垄断土地所致。其实不对，高房价的真正原因是两个：一是服务业主导的城市化使人口越来越密集，密集的地方自然房价高，即使零地价房价也会很高。二是土地财政导致房价高。因为政府要卖地生财，所以哄托房价，房价高才能地价高。


    而且，为了多生财，地方政府倾向于多卖地而不是少卖地。事实上去20多年【1998~2019】，大部分中小城市，土地供应增量是3倍于人口增量的，住房供应是严重过剩而不是严重不足。供应严重过剩，房价却节节攀升，主要原因是一番又一番概念炒作让人们误以为当地未来会有大发展、拆旧换新如货币化棚改人为地涨价、制造恐慌情绪去库存等。


    因此，集体土地打破垄断进而降低中小城市房价的逻辑并不成立。


    中小城市房价降低的逻辑，在于供应已经严重过剩而人口则在加速流失。无论有没有集体土地入市，大部分中小城市的房价都是无法长期维持的；或者在通胀之下，即使名义上房价在上涨，但二手市场也非常难卖。一手市场火爆，则是因为政府和开发商联手用各种概念炒作，并且捆绑学区房、人为搬迁政府、教育、医疗机构使人们在新区购房，等等。


    而在人口流入的大城市和超大城市，过去总是试图用土地限量供应的办法控制人口，结果反而造成了土地供应的严重错配，加剧一线城市房价上涨。在这些大城市，如今农村集体建设用地即使有限入市，也如我上面分析的原因，不会对商品房市场造成任何冲击。


    除了平等的乌托邦幻想，“先知”孔夫子们也在恐吓历代国家管理者，“丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。”


    意思是：不要担心少寡，而要担心不平均；不怕人民生活贫穷，而怕人心不安定；均衡了，就无所谓贫穷；和平了，也就不怕少寡；安定了，国家社稷才不会倾覆。贫富差距会导致人心不安定，进而国家祸乱乃至倾覆。


    但是，“民代”（民众代言人）“帝师”们妖言惑众、没有抵达真相和真知的地方在于：即使在农业匮乏时代，引发暴乱、草原民族入侵乃至江山社稷倾覆的根本原因，主要也不是贫富差距，而是气候变化导致粮食减产甚至绝收。由气候变化导致改朝换代的例子，中外一致，并且时间上往往高度统一，因为，气候的变化，不认国家和地区。


    陈志武领衔的量化历史研究，用定量而不是定性的方法研究和回归历史，其《量化历史研究告诉我们什么？》（2013.9.17）也谈到了阶层固化：


    - 以往关于社会阶层流动性研究只停留在父子代际传承的层面，而不是基于整个家族是否“一人当道，鸡犬升天”。如果是以姓氏作为代际研究的基础，则可以把“一人当道，鸡犬升天”的情况包括进来，这样即使自己的儿子无能但侄子侄女有能，也可以把长辈的成功传承下去。

    - 如果只按照父子收入的相关系数来研究代际地位固化程度，那么，根据英国自14世纪以来的遗嘱档案中记录的家庭收入估算，家族地位固化程度只有0.4，亦即父子收入的相关系数只有40%。而如果不只用父子收入，而是用同一姓氏的相连两代英国家族的平均收入计算代际相关系数，那么英国人代际相关性高达75%，说明英国社会阶层固化的程度远高于以前的估算。

    - 而且，如果把过去七个世纪分成不同时间段，英国社会财富阶层的连贯性基本没有变化，富有的姓氏有70-80%的可能性一代后继续富有，有50%左右的概率在两代后仍然富有。

    - 对中国、美国、日本、瑞典、印度、智利等国家而言，基于姓氏估算出的社会流动性也都远低于基于父子收入相关性的结论。看来各社会的阶层固化程度比我们原来理解的高很多。一宗族姓氏一旦进入精英阶层，似乎世世代代都能是精英，社会阶层可以跨越朝代、跨越体制地固化下去，能够维系几世纪！

    - 公共政策似乎不能提升社会流动性，而工业化、城市化和技术革命可能是更重要的降低社会阶层固化的力量。


    # 看清楚了吗？


    真实的、以姓氏而不是以父子为基准的阶层固化，比我们想像和历史书上写的还严重得多，暴乱、战争、瘟疫，乃至改朝换代，似乎都没有从根本上改变这种固化。


    反而是现代工业化、城市化、信息化和技术革命，有可能迅速颠覆阶层固化。今天互联网和新技术 5 年时间成就的财富新贵，比过去工农业时代两代人成就的财富还要多，而且，这些网络和技术新贵，很多来自平民甚至贫民阶层。很多出身平民的优秀员工在公司拥有股权激励，一上市往往成就很多百万、千万富翁。


    妄想靠抑强来达到扶弱的目的，是盲人骑瞎马，夜半临深池，效果只会适得其反——迅速堕入共同贫穷，而不是共同富裕。委内瑞拉，新南非，都是近在眼前的前车之鉴。


    一个社会的正常生态链是：富的越富，绝对不会导致穷的越穷！削富济贫，只会导致富者变贫，贫者更贫！


    其基本原理是：社会就像海洋，海越深，相当于贫富差距越大，生态链越长，物种越丰富，人们越幸福，人生向上生长的可能性也越大。而当我们把海水变浅，变成小溪流，只能大家都变成小鱼小虾，而且物种大幅度减少！


    最典型的是迪拜和中国香港，都是世界枢纽型城市，都是国际金融中心，都是极自由经济体，都是税收极低的地方，也都是贫富差距十分巨大的地方！


    但是迪拜却吸引了 90% 的外来人口，包括大量低收入人口。


    香港没有退休金制度，只有退休后综合援助制度——越贫穷的人获得的综援越多——工作时工资收入和资产收入不平等，退休后终于更平等。这种综援的平等，高于世界上绝大多数国家和地区。


    相反，一些税收奇高无比（会无形中抑制富人创造、无形中迫使富人移民）的国家和地区，丝毫没有带来更大的收入和保障平等，反而制造了更大的收入差距。为何？


    因为他们将税收等财富大量用于政府支配的投资、大量用于低效甚至无效的转移支付，产生了巨大的行政成本，留下了巨大的腐败寻租空间。


    而富人的钱，则是花自己的钱办自己的事，通过巨额投资，创造更多就业机会、创造更多造福人类的科技、产品和服务，通过市场自发的滴漏效应，不断向下滴灌、向外拓展普通民众（相对意义上的穷人）的自由和福利水平。


    词语、概念的腐败，是最容易造成头脑混乱的腐败，很多时候也是人类祸乱之源。专以咬文嚼字、舞文弄墨为职业的知识分子，对此更应该有起码的警惕。


    贫富差距、机会公平、社会平等这些词语，都难以界定清晰合理的边界。


    上帝都不会给我们机会公平，更不要说什么结果公平：出生在什么地方，不平等；出生在什么家庭，不平等；出生在同样的家庭，先来后到不平等，是男是女不平等，是美是丑不平等，智力高低不平等，性格好坏不平等……基因错乱了一个，我们找不到上帝去说理、去拼命，更不可能让它重新给我们一次选择的机会。


    人生在世，除了权利可能平等，一切都不可能平等。连最廉价的、可以完全免费、无限共享的信息，都无法真正实现平等。


    从农业社会，到工业社会，到信息社会，信息越来扁平化，越来越平等、廉价、无时差地呈现在人们面前，信息越来越对称，靠信息垄断进行欺诈和牟利的机构越来越难存活。


    但是，面对完全相同的信息，人们仍然是极度不平等的。同样的信息面前，即使是一家人，即使是夫妻，对信息的态度和判断完全不一样，甚至有时到了水火不容分道扬镳的地步！


    因为，识别信息的能力不平等！


    而对信息的不同选择、不同态度，会决定完全不同的未来命运。


    老子道德经说：天之道，损有余而补不足；人之道，损不足而补有余。意思是：自然的规律，是减少有余的补给不足的，这才符合天道。可是社会从林法则却是要减少不足的，来奉献给有余的人。


    这又是一个胡说八道。上一条说了，上帝何曾给过我们公平？从来没有。如果上天的规律给人以公平，那应该人人都生在白宫，都含着金钥匙玉如意出生，个个都有潘安之美乔布斯之才，以及，无量之福寿才行。


    然而事实并非如此。


    知识分子应该对概念正本清源，应该重视程序正义而不是结果正义，应该重视手段正义而不是目的正义。


    对人类而言，只有权利是可能在法治保障下获得平等的，机会公平和结果公平都是遥不可及的乌托邦。


    中国古人也已知手段正义的重要性，比如“君子爱财，取之有道”。


    朱学勤先生曾经写过一篇文章《程序公正与实质正义一一也谈“长江《读书》奖》，文中的一些论述堪称经典：


    一部人类社会进步史，可以说是一部法治完善史，而一部法治史，可以说是程序公正逐步赶上并走到实质正义之前的历史。由此，我们也可以说，是强调实质正义，还是维护程序公正，是观察一个社会、一个阶层乃至一个人，是处于古代、半现代，还是现代的标志之一。在已经确立法治秩序的现代
    社会，程序公正先于实质正义，这是公民的普遍常识，或者就叫法律意识。


    一场评奖风波迟早都要结束。使我们难过与反思的是，知识界启蒙民众二十年，为什么今天还会在自身暴露出对程序公正的如此无视与随意？这一次，问题不是出现在民工群，而是出现在知识群，说明知识群中不少人的意识还停留在古代、半现代，确实到了“令人震撼”的程度。不在于谁对谁错，无论是谁错，其他人
    都没有理由幸灾乐祸。知识界的自身建设，是和普通老百姓一样，当务之急是赶紧补上“公民意识”这一课，甚至应该走在老百姓的前面。没有“公民意识”，遑论其他？只要一
    个实质正义，无论是单人朗诵，还是登高群呼，都会误人误己。以程序公正求实质正义，实质正义存；以实质正义践踏程序公正，则程序公正亡，实质正义也亡。


    这篇文章 2000 年 7 月 13 日首发于《南方周末》。如今，又一个将近二十年过去了，中国知识界在对人类重大问题、重大基础秩序问题的思考上，理清基本概念了吗？重视手段正义、程序正义优先于目的正义、结果正义了吗？


    没有程序正义、手段正义，一味向目的正义、结果正义裸奔，最终只有一个后果：个人沾名钓誉，国民受祸遭殃。


    反对渲染和挑动社会的贫富差距情绪，并不是主张对弱者不闻不问。社会健康的价值取向，应该是“救急而不救穷，扶弱而不扶贫”，而不是一再刺激和煽动贫富差距拉大的社会情绪。


    和平年代，贫富差距一定是在不断扩大的。真正缩小贫富差距的时代，往往也只有 在瘟疫和战争大规模爆发时期，那种时候，多数穷人的命运仍然是炮灰，而所谓缩小差距，也只是局部的、短暂的。


    以大量不会有第二次的生命，去换取另一些人极其短暂的、极其局部的“贫富差距缩小”，是社会的公平正义吗？那些死去的冤魂会答应吗？


    最重要的不是贫富差距，而是社会最穷的人，生活水平是在不断的大幅提高的！总体上，大部分穷人能比过去生活得更好，就是好社会。


    有人对我文章刚开头那段话提出质疑说：“先让掌握公权力的把财产公开了再说 这样的话，用人民赋予的权力来制造贫富差距，无法容忍。”


    我说：“好的，顺着你的逻辑，我们应该强调的是，强调贫富差距，会导致谁来重新分配贫富差距？会扩大还是缩小贫富差距？”


    道理就是这么简单的道理，逻辑就是这么简单的逻辑。取与舍，仍然靠智慧。是与非，对与错，汝能分清否？


    即使把天下所有的富人都当魔鬼，把天下所有的政府都当天使，恨不得把所有资源都交给天使来分配，也要懂得一个最为基本的天下运行规律：两个以上魔鬼竞争，远胜过一个天使垄断！


    而政府即使有竞争，也只有在不同空间里进行同时竞争，不可能像企业一样，无数的企业在同样的时间空间里竞争。因此，前者的竞争，是不充分的竞争。


    但不同空间同一时间内的政府竞争，仍然遵循优胜劣汰的经济规律：哪里低税收高安全、高自由好法治，哪里就吸引富人能人，进而像大树底下生态丰富似地吸引大量普通人就业。


    富人能人追逐聚集之地，必富饶丰润，哪怕沙漠蛮荒之地如以色列、迪拜；反之，富人能人逃离散乱之地，必贫瘠荒芜，哪怕它草木茂盛，田园肥美。


    我甚至在怀疑，随着技术进步和信息全球化的脚步加快，跨国公司和民族国家之间，到底会进行一番怎样的观念、制度和文化竞争？


    童大焕，22 年独立研究城市化和房地产，高密度大城市化理论倡导者和践行者。微博扫描、微信识别二维码，加入知识星球，带你跟上史无前例的超级大城市化潮流。


    # 城市化战略大转折应该警醒 14 亿国人


    童大焕—2019 年 8 月 30 日星期五


    2019 年 8 月 26 日，中央财经委员会年内第五次会议认为：“经济发展的空间结构正在发生深刻变化，中心城市和城市群正在成为承载发展要素的主要空间形式。”为此，应该“增强中心城市和城市群等经济发展优势区域的经济和人口承载能力。”


    什么意思？


    简单说就是两句话:发展规律和逻辑变了，现在和将来主要靠中心城市和城市群。为了顺应这种发展规律，必须让更多人及资源进入中心城市和城市群。


    诚如国务院研究中心助理研究员高敏次日在《21 世纪经济报道》上发表评论称：本次会议的提法意味着：特大、超大城市的人口政策可能会发生巨大变化，原有限制发展的思路开始转变，而是顺应规律，通过扩大土地供给，提升人口承载能力等方式推动人口向大都市和周边城市集聚。未来，都市圈作为参与全球竞争与合作的主要载体，这是中国城镇化的重大趋势性变化。


    之前的 2013 年 11 月 12 日，《中共中央关于全面深化改革若干重大问题的决定》提出，加快户籍制度改革，全面放开建制镇和小城市落户限制，有序放开中等城市落户限制，合理确定大城市落户条件，严格控制特大城市人口规模。


    2014 年 7 月，国务院《关于进一步推进户籍制度改革的意见》规定：城区人口300 万至 500 万的城市，要适度控制落户规模和节奏，严格控制特大城市人口规模。


    今天这个不到一百字的提法，却可谓之“70 年未有之大变局”，它意味着我们在经历了百般曲折之后，主流观念终于对城市化规律认知发生了根本变化，意味着未来相关政策的趋势性变化。


    这是一个非常大的、国家战略性的、趋势性的改变，事关国运和民运，值得每一个中国人认真关注和思考。


    为什么要提这种变化？在我看来，它的重要意义，正如我 2011 年 10 月出版的《世纪大迁徙》一书封面所言：“高密度大城市化”具有“拯救中国”的战略意义。


    高密度大城市化，对于提高人民生活水平；保护自然、保护环境；加快创新；提升中国的国际竞争力等方面，都具有全方位的战略基础意义。大城市化，是解决中国许多问题的总开关，大而言之有：


    - 国与国之间的竞争，越来越变成城市与城市之间的竞争。竞争的本质是效率，是速度，看谁跑得更快，看谁效率更高。在同等制度、文化环境下，如果城市没有一定的规模和密度，就没有足够“创新的浓度”，也就没有足够的速度和效率，在国际竞争中必然落后。

    - 要想全面彻底地提高人民生活水平，也必须从大城市化入手，让绝大多数人告别小农经济和小工业，全面提高效率，提高分工与合作。

    - 要想保护地球、保护自然，更是得从大城市化入手，让更多的人远离自然，远离对自然环境的破坏，让自然回归自然。


    国人有“不患寡而患不均”的传统思维，可能源自孔子。《论语·季氏篇》第十六写道：“丘也闻有国有家者，不患寡而患不均，不患贫而患不安。盖均无贫，和无寡，安无倾。夫如是，故远人不服，则修文德以来之，既来之，则安之。”


    字面意思是：不担心少寡，而担心不平均；不怕人民生活贫穷，而怕人心不安定；均衡了，也就无所谓贫穷；和平了，也就不怕少；安定了，国家社稷才不会倾覆。而贫富差距太大，即使国家富裕也危机四伏；没有那么巨大的贫富差距，大家都会比较满足，民众和平团结，国家就会强大。做到这样，远方的人还不归服，便发扬文治教化招引他们来。他们来了，就得使他们安心。”


    层层递进的关系，把国家安定的基础系于“不患寡而患不均”。


    我们不都是对错的价值判断，只做事实判断，1949年以来，我们国家在“均衡发展”方面所花费的气力、时间、规模恐怕都是在人类历史上空前绝后的，但是很多不知经济和城市发展的规律的人们，包括一些知识分子，他们还是不满意，认为今天的人们背井离乡往大城市发展，是因为政府在均衡公共资源和发展机会上做得不够，从而导致大量留守儿童、留守老人等人道悲剧。


    事实上我们在这方面不是做得不够，而是做得太多，甚至把很多不该做的都做了，把很多不该用的手段都用了：二元户籍制度限制农民进城，知青下乡，乡镇企业和小城镇建设，就地城镇化，新农村建设，美丽乡村建设，西部大开发，东北振兴等等，控制大城市人口规模，等等。


    每年国家还有大量的转移支付，从东南沿海发达地区收税由中央支配，源源不断地转移支付到西部、中部和东北等相对落后地区。


    这其实是对高效率地区掐尖，用以支持低效率地区发展，重视了国内的“平衡”，却在相当程度上自废武功，自我降低效率，削弱国际竞争力。


    这种做法在国际上也没有成功的先例。美国哈佛大学经济学和历史学教授戴维·S·兰德斯在《国富国穷》一书中说，人类一直想改变这种状况，给予不发达地区各种项目支持，但是戴维斯在书中无情地告诉人们：“人类所犯的错误，即使出于善心，也会加大大自然的冷酷无情。有时甚至善无善报。毫不奇怪的是，这些地区依然贫穷，许多甚至比以前更穷了，许多广泛宣传的发展项目遭到了惨败。”


    对于今天，城市化政策发生重大战略转折这一顺应规律之举，本人表示十分的欣慰和赞成，它将为中国经济带来新的活力，也将给中国参与国际合作与竞争带来新的动力。


    我们的城市化，实际完成率还不到40%，比全球平均城市化率还低，比发达国家动辄80%、90%的城市化率，更是差距巨大。


    这个落差，就是势能所在。


    在**新的大城市化战略**下，14亿国人应该彻底抛弃以往均衡发展的乌托邦幻想了。在这个梦里，我们沉睡了太久，付出了太多、太过于沉重的代价。


    应该醒醒了。


    在全球性的高密度大城市化潮流之下，绝大多数人的故乡是注定要衰退，而且是迅速衰退的。


    与此相适应，绝大多数国人过去 20 年积累的房屋资产，将在新一轮的大城市化运动中，被迫进行全面的价值重估——极少数城市房价，和它所在的城市一起迅速成长，像珠穆朗玛峰一样高耸隆起；大多数城市房价，和它所在的城市一起衰退，几万元甚至几千元、几百元一套（栋）房，绝不是天方夜谭。


    未来中国，就是繁华的几个大都市，外加广袤的山青水秀的无人地带。这将是中国经济和人口结构的基本版图，和世界大多数国家和地区一样。


    文明进步和财富提升的最佳方式不是转移支付，不是救济，而是自由迁徙，让人们遵从经济的规律、遵从内心的自由、选择的自由，到更文明更发达的环境中去，接受整个环境对人的全面重塑。


    是让环境改变我们，而不是我们改变环境。


    中外历史上很多均衡发展的努力，事实上让贫穷落后地区的人们发展速度更慢了。因为，局部、片面的资源向落后地区和人倾斜，效率肯定不如人到发达地区，接受更全面的资源、环境对他的提升和塑造。


    人类从农业社会，到工业社会，到今天这个信息社会，表面上的贫富差距必将越来越大。科技越发达，社会越和平、越安定，财富差距越大。这是经济发展的自有规律，也是“贡献越大，财富越多”的真正公平之必然。


    知识分子和政治家不应该再食古不化，念兹在兹地抱着农业匮乏时代“不患寡而患不均”的老皇历。


    农业匮乏时代，是产出相对固定并严格受制于土地、天气、农作物品种等约束，存量竞争，贫富差距问题是“朱门酒肉臭，路有冻死骨”的问题，是穷人无法活下去势必造反暴乱的问题。


    今天和未来，是科技发达，产出过剩，贫富差距问题往往是在无限增量中派生出的问题，是富人通过巨额投资，创造更多就业机会、创造更多造福人类的科技、产品和服务，通过涓滴效应，不断往上提升、向外拓展普通民众（相对穷人）的自由和福利水平的问题。

    '
