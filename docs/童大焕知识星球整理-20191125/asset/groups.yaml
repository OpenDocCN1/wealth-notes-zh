  - '[PAGE 54]


    业时代以后，房地产的需求发生了本质的空间位移——不再是四海赚钱回老家盖房，而是落地生根在哪里工作生活就在哪里买房——多数人的故乡都回不去了，故乡只有衰落、回归自然一途。


    到了城市化时代，房地产同时是人们最好的金融工具和理财工具。


    事实二，房地产是不是实体经济？房地产带动上下游数十个行业，一荣俱荣，一枯百枯，为什么不是实体经济？


    事实三，在过去 18~20 年时间里，中国的世界工厂（2001 年加入世贸起）和房地产补课（1998 年起补 1949 年至 1998 年“只筑坡不筑窝”其实也就是仅仅能满足温饱，无法满足基本居住需求的课）是并驾齐驱的，多数时候房地产还在补贴世界工厂（房地产用地补贴工业用地）。


    为什么实际事实是房地产补贴世界工厂即制造业？因为政府之间竞争，招商引资，最直接的都是通过降低工业用地的方式方法来达到目的。而政府本身不直接创造财富，降低甚至倒贴工业用地的钱，只能通过房地产供地来弥补。这也导致政府大量提前储备土地（更廉价），同时想尽办法稳定和推高房价的原因。


    哪个地方政府都想卖出高地价，但只有高房价才能卖出高地价。而不是高地价导致高房价。不信，让玉门市、鹤岗市地方政府也卖出深圳北京的高地价试试！


    # 5


    今天的问题不是去房地产化的问题，而是多数城市房地产供应已经整体过剩而人口在流出，土地财政想维持也难以为继的问题。


    也就是说，多数人口流出的城市，他们并不想去房地产化，但“去房地产化”已经是一个无可更改的事实问题。


    不需要你积极主动去房地产化，它已经自动去房地产化了。


    # 6


    古今中外，衣食住行人生四大基本需求，为什么独独房地产不是实体经济？而有了一定财富，人们都把盒房置地当成最基本的财富仓库。


    告别农业时代、房地产越来越专业化以后，置地不再作为财富仓库，购房成为更主流的财富仓库。怎么不是实体经济？


    # 7


    古往今来，房地产也是最好、最安全的信用工具，个人信用、企业融资、银行贷款，都要用这个最基本、最安全的信用工具。怎么不是实体经济？


    所以，任何人，任何家庭，任何国家，任何时代，都不可能去房地产化。任何時候都不要相信去房地产化的鬼话。'
