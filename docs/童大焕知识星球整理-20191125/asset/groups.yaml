    什么成本都很高，尤其是关系成本。而房子价格低的沉重代价，可能是房子一直在贬值，或者不升值。万一老人生病、孩子需要出国读书，拿不出钱，连抵押房子分期付款的机会都没有。


    2

    有一个很经典的寓言，讲的是一个老太婆的故事：


    这个老太婆有两个女儿，一个卖雨伞，一个卖布鞋。不论晴天还是下雨，老太婆没有一天开心得起来：晴天时为卖雨伞的女儿担忧，雨天时替卖布鞋的女儿担忧。


    有人教老太婆：晴天时替你卖布鞋的女儿高兴，雨天时替你卖雨伞的女儿高兴。


    老太婆从此果然天天笑逐颜开。


    换一个角度，并没有改变任何事实，但人却变得乐观了。


    这其实并不是“换一个角度看问题”的思考智慧，而是另一种更高级的智慧才能驾驭的人生态度：弱水三千，我取一瓢饮。不要什么好处都想占尽，天大地大，有我一小份是矣。


    3

    人有旦夕祸福，月有阴晴圆缺。如果天天忧心忡忡，就是做到亿万富翁、百亿富翁，同样有可能天天没个安稳日子，因为，我们看得太多这世界的变化，一夜之间，或资金链断裂，或身体和生命出现意外。


    我想起了刚刚逝去的北大原校长丁石孙先生，他在 1992 年 65 岁时就写下了遗嘱，“没有人能准确预见自己死的日子，因之话早说为好。”“我死后一切从简，不要任何仪式……在我死前或死后，凡不在北京的亲属，绝对不要因为我的缘故来北京。对世界来说，我的死是一件极小的事情，过去就过去了。”“请不要为我的死悲痛。我衷心希望你们生活愉快。”


    生者淡然，然后达观知命地生活，直到昨天（10 月 12 日）去世，享年九十有三。


    知道人终有一别，达观知命地生活，过好每一天，争取更好的每一个明天，这是一种态度；


    知道人终有一死，天天数手指数倒计时，恨不得以泪洗面，也是一种态度。


    态度改变不了最终的结局，但会改变我们的生活质量。


