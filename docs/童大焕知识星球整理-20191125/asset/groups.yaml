    ## 乐观是生命追求中的无量智慧 不是结果收获后的短暂满足


    童大焕—2019 年 10 月 13 日星期日


    ### 1

    匿名用户 提问: 坐标上海, 家里有两个孩子, 孩子的教育医疗到处要花钱, 今年我 40 岁了, 有时候深夜感到恐惧会中年返贫, 会中产返贫, 特别是在竞争激烈的上海市。怎么做能防止中年返贫中产返贫？谢谢您！


    提问还带了一个图, 主要内容是——中国返贫重要死亡样本是理财: 土豪死于信托, 中产死于非标理财, 屌丝死于 P2P……


    答:


    首先, 我想推荐一位真正的伟人——丘吉尔的一句話, 他说: “乐观的人在每个危机里看到机会, 悲观的人在每个机会里看见危机。”他的经历够丰富, 成就够卓越,
    话也够份量:


    温斯顿·伦纳德·斯宾塞·丘吉尔（ Winston Leonard Spencer Churchill, 1874 年 11 月 30 日-1965 年 1
    月 24 日), 英国政治家、历史学家、画家、演说家、作家、记者, 1953 年诺贝尔文学奖获得者、“雅尔塔会议三巨头”之一、20 世纪最重要的政治领袖之一。1929
    年到 1965 年, 连续 36 年担任英国布里斯托大学校长。两度出任英国首相（1940 年至 1945 年、1951 年至 1955 年）。领导英国人民赢得第二次世界大战。代表作品《第二次世界大战回忆录》《英语民族史》。


    其次, 我想说, 除非有先天性重大疾病, 否则绝大多数孩子医疗花不了多少钱。至于教育, 钱多有钱多的教育法, 钱少有钱少的教育法, 孩子的成才与成就, 跟钱多钱少没有必然关系,
    倒是跟家庭教育脱不了干系。而乐观的家庭和家长, 更容易培养积极乐观的孩子。


    第三, 倒是天天恐惧中年返贫中产返贫的人, 真的容易返贫。不担忧不恐惧, 积极乐观地做好当下、过好每一天、每天进步一点点的人, 容易不断超越自己, 不断进阶,
    反而不容易返贫。


    第四, 上海等一线城市表面上竞争激烈, 但只要静下心来仔细想想, 会发现, 像上海这样的一线城市、超级大城市, 竞争机会会比其它中小城市和农村多多, 也公平得多,
    而且, 还有一样法宝——房子, 有可能天天都在为你保值增值, 等我们退休或一二十年回头看, 其增值部分, 可能远远超过我们一生的收入——这是城市化这个时代大潮的恩赐。而那些在中小城市尤其是在衰退中的中小城市工作生活的人们,
    平时竞争的机会更少, 更激烈, 更要拼关系, 除了房子价格低, 什么成本都很高，尤其是关系成本。而房子价格低的沉重代价，可能是房子一直在贬值，或者不升值。万一老人生病、孩子需要出国读书，拿不出钱，连抵押房子分期付款的机会都没有。


    ### 2

    有一个很经典的寓言，讲的是一个老太婆的故事：


    这个老太婆有两个女儿，一个卖雨伞，一个卖布鞋。不论晴天还是下雨，老太婆没有一天开心得起来：晴天时为卖雨伞的女儿担忧，雨天时替卖布鞋的女儿担忧。


    有人教老太婆：晴天时替你卖布鞋的女儿高兴，雨天时替你卖雨伞的女儿高兴。


    老太婆从此果然天天笑逐颜开。


    换一个角度，并没有改变任何事实，但人却变得乐观了。


    这其实并不是“换一个角度看问题”的思考智慧，而是另一种更高级的智慧才能驾驭的人生态度：弱水三千，我取一瓢饮。不要什么好处都想占尽，天大地大，有我一小份是矣。


    ### 3

    人有旦夕祸福，月有阴晴圆缺。如果天天忧心忡忡，就是做到亿万富翁、百亿富翁，同样有可能天天没个安稳日子，因为，我们看得太多这世界的变化，一夜之间，或资金链断裂，或身体和生命出现意外。


    我想起了刚刚逝去的北大原校长丁石孙先生，他在 1992 年 65 岁时就写下了遗嘱，“没有人能准确预见自己死的日子，因之话早说为好。”“我死后一切从简，不要任何仪式……在我死前或死后，凡不在北京的亲属，绝对不要因为我的缘故来北京。对世界来说，我的死是一件极小的事情，过去就过去了。”“请不要为我的死悲痛。我衷心希望你们生活愉快。”


    生者淡然，然后达观知命地生活，直到昨天（10 月 12 日）去世，享年九十有三。


    知道人终有一别，达观知命地生活，过好每一天，争取更好的每一个明天，这是一种态度；


    知道人终有一死，天天数手指数倒计时，恨不得以泪洗面，也是一种态度。


    态度改变不了最终的结局，但会改变我们的生活质量。


    ### 4

    积极乐观的人，容易达成乐观的结果。

    消极悲观的人，容易导向悲观的结果。


    这是“意念”或心术吗？不，我不这样认为。


    我认为这是“态度决定行为，行为决定结果”的必然结果。


    积极乐观的人，通常老成持重，相信自己坚持不懈的努力能够达成好的或者比较好的结果，他们就会有信心、有决心、有耐心在自己思考成熟的地方，持续不断地发力。这样他们就会有很多日积月累却百尺高台起于垒土的可观收获。


    他们不会患得患失，不会在超出自己能力的范围之外下赌注，因此也可以避免很多的投资失误。


    在现代社会，只要肯干，人的生存基本不是问题。人生失败更多的是投资失败：或耽于赌博，或急于求成。


    而消极悲观的人，常常会有朝不保夕、别人已经远超自己等等的强烈紧迫感和危机感，这逼得他们经常在极度悲观和极度乐观的两极中剧烈摇摆，往往都带着赌博的心态做决策、做投资，成为别人韭菜或炮灰的概率由此大增。


    ### 5

    投资世界终将属于乐观者。企业家群体通常是乐观者最多的群体。


    乐观是生命追求中的无量智慧，不是结果收获后的短暂满足。物质财富是永无止境的，不是有了足够的物质财富才乐观，而是因为乐观，积极，一步一步地有力前行，从而不断收获乐观的结果。【完】


    ## 城市地段产品三位一体购房法


    附：买房必须破除城市迷信


    童大焕－2018 年 10 月 23 日


    ![](img/8d530242b5a665d67ce2c341c579f7e7_104_0.png)


    图片说明：

    很多人以为每个圈里的房产都是无风险投资，

    但真正无风险的只有三个圈同时交叉的红心里小小部分！


    1. 往前追溯 20 年，展望未来 20 年，中国几代人积累的财富正在发生剧烈的变化，有的坠落，有的飞升，未来绝大部分会集中到少数一二十座城市。房产的多少和优劣，决定财富的飞升与坠落，同代人的阶层分化会在这
    20 多年间迅速完成。


    2. 资金追逐效率和安全，产业追求分化与合作，创新追求差异与聚集，人口追求就业和机会。世界越来越陡峭，人口越来越集中。过去几代人的存量财富，未来的增量财富，如何保值增值，秘密都在城市化，都在“人聚财聚，人散财散”中。


    买房不止是买房，而是在寻找存量和增量财富的安全仓库，寻找财富升降乃至阶层升降的密码。


    3. 自古不谋全局者不足以谋一域，不谋万世者不足以谋一生。


    看不懂技术革命和产业革命者，就看不懂城市化；看不懂城市化者，就看不懂房地产。


    看不见未来者没有未来。


    4. “我们这里黑龙江地级市，有的位置一般的房子，只要交物业费、取暖费等，都不要房租。一分钱不要白住，根本卖不出去，租不出去。我们这里有些人还在当地花高价买开发区的房子，飞蛾扑火一样被套牢。我们这里市区有90多万人口，不断的流失。”（2018年10月）


    这才刚刚开始。一旦衰退，就摧枯拉朽，逃无可逃。但逆转的时间节点，谁也无法掌控，唯有持不赚最后一个铜板之心，加上明确坚定的方向感，方有安全出逃的可能。


    某友漳州城里的老房子，一直不售，一直建议他们卖掉，多年来都舍不得。过去一年（2017年下半年至2018上半年），遇到三四线货币化棚改拆迁涨价去库存，房价有所上涨。转眼间，出货的最佳窗口期一晃就过去了，现在（2018年10月）介绍说，回到一年前的价格，也很少人接手了。


    地市县城化，县城乡镇化，乡村无人化。


    楼市总体过剩。


    5. 买房不是买房，是买特定的城市空间，是掌握财富升降的无形钥匙。


    城市，地段，产品，三者缺一不可。


    - 绝大部分城乡都将无可避免地衰退，所以选择城市很重要；

    - 即使人口大量流入的城市，绝大部分区域人口也呈流出趋势，所以选择地段很重要；

    - 即使最核心城市最核心地段，也有大量涨不过大都市的产品，还有不少买入即跌的产品，所以选择产品很重要。


    比如北京某最核心地段某豪装产品，我一看楼市未看房，就在2016年1月连写两篇学员和弟子独家文章，宣布它定位错误。前后3年多过去，这100多套房子至今没有卖完。


    比如某核心地段另一豪装产品，从一手卖到今天，二手市场跌一半不止。同地段其他类型产品，同时段升值一倍不止。


    所以产品的精准定位也很重要。


    城市、地段、产品三者都选对，缺一不可，才是长期稳赚不赔的产品【短期大势都会受到信贷政策的强烈影响，但货币刚性增长不可逆，城市化长期规律也不可逆】。


    6. 房地产过去20年是、未来20年仍然是中国最好的投资品，没有之一。但房地产遍地黄金的时代过去了，长期趋势，城市、地段、产品都选对，是涨多涨少的问题；但只要其中一个要素没选对，就是亏多亏少的问题了！【完】


    ## 附：买房必须破除城市迷信


    童大焕—2018 年 1 月 4 日


    2018 年 1 月 4 日 12:00，我发了一条短微博：“买房一定要破除城市迷信，选择区位【地段】和产品比选择城市还重要。”


    有人说：“感觉这一句话几乎把你以前的理论都推翻了。不解？”


    这位读者是没有理解城乡之间、城市之间和城市内部，从区位到产品都越来越分化越来越陡峭的逻辑而已。我其实早就对“省会迷信”提出过警告，认为一些特别的小城镇，比另一些中西部和东北省会还好。


    非物质生产占主流的服务业时代，财富的逻辑在发生变化，城市的生产和生活结合得越来越紧密。产品要更新换代，区位在竞争性发展，城市内部也在兴衰变化。即使是同一区位，产品定位发生偏离，也会成为鸡肋产品。比如我
    2016 年 1 月下旬，面向二期学员和弟子，用两篇独家文章，分析了北京最核心地段某楼盘定位错误。果然，两年时间过去，北京房价经历了大涨又经历了更严厉的调控带来的部分下跌，这个项目的
    100 多套房却推得很用力、卖得很艰难，价格也基本徘徊不动。并不是一线城市所有的房子随便买都行。


    下面讲几个真实案例：


    2017 年 12 月 27 日，有人对我说：“我就是上次在深圳科学馆听你讲座的（2014 年底），然后问东莞有套房，想回到深圳，有什么办法。您给我的建议是卖掉。结果，市场一放松，我就立即卖掉，同时（2015
    年 6 月）到深圳某处买了现在居住的 63.5 平米两居室，总价 281 万，现在市价在 270 万上下。”


    我了解了他的具体房源情况后，发现其地段选择不太对，尤其是选择的是逐渐被淘汰的过时产品，导致房价不仅没有上涨，反而下跌，而且脱手困难。【卖东莞买深圳是对的，但是买深圳时的区位和产品没选对。】


    同年（2015），一对深圳夫妇专程飞北京找我订制，8 月 22 日，在我具体指导下买的房，119 平 750 万。2017 年 12 月 30 日我问他情况，他的回答是：“最近一直还在涨，而且放盘很少（同户型同面积有一套最低报价
    985 万）。租金也很可观，基本上 15000 租金一个礼拜就可以租出去。”


    2015 年 2 月 15 日，我一个外甥在小县城买的房（当时选了两到三个项目由他们挑选），6778 元单价加赠 16 平米住房面积，现在一手 9500 而且基本无房可卖，二手还没房本，已经有人出价到
    8200，我们觉得实际价格还要更高一些。


    2015 年 9 月~10 月间，北京一位订制客户，我让其放弃 10 万元定金，不要原定的房子，到我指定区域另选，并说一年的涨幅或租金差别都不止十万。当年
    10 月其在我指定区位挑选、经我认可买下的房子是 85 平 480 万，月租金 12000~14000 元。今天（2018.1.4）查了一下链家 APP，2017
    年 11 月 19 日有一套 83.45 平，成交价 760 万。


    而我没有当年让其放弃的房子，当年是 170 平 455 万。2017 年全年链家 APP 上该项目没售有一套成交。2016 年 10 月 30 日有一套 161
    平 505 万成交，2016 年 12 月 14 日有一套 194.84 平 585 万成交。而 2016 年 10 月到 2017 年 3 月 17 日之前这段时间，是北京本轮房价的高位阶段。最近有两套房源挂牌出售，一套面积
    159.85 平，报价 785 万；另一套 210 平报价 1050 万。当然，成交量很低的房源，报价和成交价之间往往会差距比较大。


    买房，自始至终首要关注的是房子背后的人：将来什么样的人人会来接你的盘？要懂得城市化发展变化的规律和逻辑，要懂得人口和家庭结构的变迁，要懂得房屋更新换代的方向。并不是简简单单守住所谓一二线城市，或者简简单单在相关区域寻找低价盘、低价房了事。没那么容易。


    好的投资一定有门槛：资金、限贷限贷、智力门槛，等等。尤其是智慧门槛和观念门槛最高，观念又往往由智慧决定。在楼市投资问题上，我们从来不等不靠，根本不必也不应该死守一两座城市，而是要像流水一样，自由流淌到我们的资金可以匹配得到的有价值区域，努力去够自己够得着的东西，一步一步上台阶。中国这么大，几百万亿元的房地产资产，怎么会没有地方可以投资呢？永远是我们的钱或者智慧太少，而不是投资机会太少。


    城市内部的差异，有时比城际差异还大。先讲一个远一点但很有趣的旧事：那一年五岳散人和郑褚打赌，散人说能够品得出大闸蟹是不是出自阳澄湖，郑褚说你能正确区分那我吧电脑键盘吃了。现场直播，结果散人的命中率还不如靠猜的命中率。它说明什么呢？说明一个事实：同一个湖中个体与个体的差异，比不同湖之间群体的差异还要大得多。如古人说的龙生九子九子各不同。城市化发展也是这样的，城市内部差异有时比城际差异还大。为什么很多人感觉越买越困惑，原因多在于此。有些人死抱住某些城市不放，也是进入同类误区。


    导致这种差距逐渐拉大的原因，不是简单的板块轮动或波段与时机说可以解释的，具体的原因分析和对策，就留待以后分析给学员们听吧。


    ## 为什么我再强调 信规律不信规划 信市场不信市长


    童大焕—2019 年 10 月 14 日星期一


    很多人总是对我的 “信规律不信规划，信市场不信市长” 半信半疑，认为 “国之一瞬，人之一生”，万一规划强劲，个人担不起。请看我用事实详细论证。有预言，有后见。


    ### 1

    提问：昨天向董老师提问的有关北京市人口规划能否大致落实的问题，没有回复。其实董老师的答案，不用回复我就知道，董老师不是说过名句“信规律不信规划”吗。但是城市化的规律就像黄河九曲十八弯，最终奔流到大海。哪怕中间出现曲折，比如二三十年，放在国家和历史面前就是一瞬，可是放在很多小民身上就是一生的机会与命运。相对于结论，我更看重论证的逻辑过程。希望董老师能够再论证详细一些。


    答：论证的过程，**2014 年 3 月 19 日**我已经“提前论证”，全文只用了半小时，用的是中午时间写的，在这里——《童大焕：保定的房价会暴涨十倍吗_腾讯·大家》，只是有些人可能总是半信半疑。


    在 5 年半前那篇半小时一挥而就的文章里，我写道：


    > 2014 年 3 月 19 日国内最热的一则新闻当属“北京政治副中心初定河北保定……”


    第一，疏散国家部委下属的事业单位和教育机构，即使全面搬迁，其工作人员家属也未必能够随之，这毕竟是一个市场主导人口和就业的年代。因此，它对疏解北京人口压力的功能极其有限。第二，若要想它成为一个政治中心，进而带动京津冀的一体化发展，那更是指望小马拉大车，几乎完全没有这个可能。要实现这个功能，除非中央和北京的整体政治中心搬迁。而且还必须是小市场小社会大政府的格局不变，而后者显然不符合市场经济和反腐败的基本要求。


    如是，如果保定成为北京政治副中心最后尘埃落定并且付诸实施，最有可能的结果就是成为一个国家部委所属科研机构和大学集中地，类似于一个新的大学城。因为这些机构根本不具备真正的政治功能，而只是科研和教育教学功能。那么，它最好的结果就是另一个燕郊，但显然，燕郊的地理位置比它好多了。


    就像动物园服装批发市场强制搬迁河北一样，这未必是河北繁荣的开始，更可能是市场衰落的先声。同样，国家部委所属科研机构和大学搬迁保定，也未必是保定繁荣的前兆，而有可能是这些科研机构和大学衰落的先声。


    ### 2

    提问：董老师大部分文章都读过，规律当然是大过规划的，但是规律起作用有两种形式，顺则发展，逆之则受惩罚，M 时代逆城市化也将近 30 年。我们是要预测是以那种方式起作用。这就是说，规律仍然在，**1949
    年前**那些在京的房产投资在那三十年就完了。


    答：先看图。图示内容为通州区规划调整（**2019 年 7 月 2 日北青网**）：


    《关于北京市通州区区国民经济和社会发展第十三个五年规划纲要部分内容调整的方案》日前在首都之窗公布，发展定位删掉了“**行政副中心**”，将原规划中“**行政副中心、国际商务新中心、文化发展创新区、和谐宜居示范区**”的发展

    '
  mdcn: '

    生产性服务业，一定要在观念开化、法治昌明、营商环境良好的地区才能得到好的发展，就像大陆的金融、法律等“操作系统”在硅谷（风格纯释语）。大部分内陆省份，即使省会，也只能做各大公司物流、营销的“分支机构所在地”，总部都要在大城市。这意味着在全国赚的钱，都源源不断地流向少数营商环境良好的东部和东南沿海大城市（参看本人“大烧点晴城市与房产”公号文章《四十年
    从东西差距到南北差距背后的家国叙事》）。


    ## 8

    提问：童老师您好，广州的城市核心历经荔湾-越秀-天河的变迁，目前是珠江新城是最核心地段，还会变吗？是否看好金融城，琶洲的发展前景？谢谢！


    答：当然会变。但是多长时间会变？这是个问题。金融城和琶洲，相距珠江新城都不是太远，如果成功，反而有可能（和珠城）形成呼应。但谁知道能不能成功呢？因为还面临着拆迁和产业入驻一系列问题。而且琶洲受到河流、山脉、（小岛）等的限制也不小，并不是纸上一个规划就能成功。


    ## 9

    问：请问童老师，北京的就业中心在金融街、望京、西二旗，这 30km 半径的圆心应该画在哪呢？


    答：一切都是变动不居的，任何问题都不能机械理解。即使是就业中心，金融街的成长型和望京、CBD 的组团型不一样；西二旗很多企业（如新浪、腾讯、网易总部）也从最早的中关村迁移过来；（金融街会不会面临央企搬迁的纠结难题？）……大城市的中心结构，圆心自然也不一样。30
    公里也只是一个必要条件而不是充分条件，隔一条大河没有桥，5 公里也不行；各种配套非常完善，33 公里就一定不行？


    ## 10

    现代服务业本身，本来是越集聚、越混杂越有价值，但由于各城市内部区域竞争（比如同是北京，丰台区和朝阳区、海淀等竞争），有时也分了很多区，这各个区中间，各个行业都会有兴衰，比如这两年中国金融银行的行政整顿，互联网行业的自身周期与行业性瓶颈、国家规划给一些特定区域带来的短期不确定性等等，都需要认真把握。根据自身的能力和风险承受力，进行合理的布局。


    对一些人 是风险，对另一些人可能恰恰是低价入市的机会。


    千秋万代，财富，就在这样的风险与机会中反复易手。【完】


    ## 乐观是生命追求中的无量智慧 不是结果收获后的短暂满足


    童大焕—2019 年 10 月 13 日星期日


    ### 1

    匿名用户 提问: 坐标上海, 家里有两个孩子, 孩子的教育医疗到处要花钱, 今年我 40 岁了, 有时候深夜感到恐惧会中年返贫, 会中产返贫, 特别是在竞争激烈的上海市。怎么做能防止中年返贫中产返贫？谢谢您！


    提问还带了一个图, 主要内容是——中国返贫重要死亡样本是理财: 土豪死于信托, 中产死于非标理财, 屌丝死于 P2P……


    答:


    首先, 我想推荐一位真正的伟人——丘吉尔的一句話, 他说: “乐观的人在每个危机里看到机会, 悲观的人在每个机会里看见危机。”他的经历够丰富, 成就够卓越,
    话也够份量:


    温斯顿·伦纳德·斯宾塞·丘吉尔（ Winston Leonard Spencer Churchill, 1874 年 11 月 30 日-1965 年 1
    月 24 日), 英国政治家、历史学家、画家、演说家、作家、记者, 1953 年诺贝尔文学奖获得者、“雅尔塔会议三巨头”之一、20 世纪最重要的政治领袖之一。1929
    年到 1965 年, 连续 36 年担任英国布里斯托大学校长。两度出任英国首相（1940 年至 1945 年、1951 年至 1955 年）。领导英国人民赢得第二次世界大战。代表作品《第二次世界大战回忆录》《英语民族史》。


    其次, 我想说, 除非有先天性重大疾病, 否则绝大多数孩子医疗花不了多少钱。至于教育, 钱多有钱多的教育法, 钱少有钱少的教育法, 孩子的成才与成就, 跟钱多钱少没有必然关系,
    倒是跟家庭教育脱不了干系。而乐观的家庭和家长, 更容易培养积极乐观的孩子。


    第三, 倒是天天恐惧中年返贫中产返贫的人, 真的容易返贫。不担忧不恐惧, 积极乐观地做好当下、过好每一天、每天进步一点点的人, 容易不断超越自己, 不断进阶,
    反而不容易返贫。


    第四, 上海等一线城市表面上竞争激烈, 但只要静下心来仔细想想, 会发现, 像上海这样的一线城市、超级大城市, 竞争机会会比其它中小城市和农村多多, 也公平得多,
    而且, 还有一样法宝——房子, 有可能天天都在为你保值增值, 等我们退休或一二十年回头看, 其增值部分, 可能远远超过我们一生的收入——这是城市化这个时代大潮的恩赐。而那些在中小城市尤其是在衰退中的中小城市工作生活的人们,
    平时竞争的机会更少, 更激烈, 更要拼关系, 除了房子价格低, 什么成本都很高，尤其是关系成本。而房子价格低的沉重代价，可能是房子一直在贬值，或者不升值。万一老人生病、孩子需要出国读书，拿不出钱，连抵押房子分期付款的机会都没有。


    ### 2

    有一个很经典的寓言，讲的是一个老太婆的故事：


    这个老太婆有两个女儿，一个卖雨伞，一个卖布鞋。不论晴天还是下雨，老太婆没有一天开心得起来：晴天时为卖雨伞的女儿担忧，雨天时替卖布鞋的女儿担忧。


    有人教老太婆：晴天时替你卖布鞋的女儿高兴，雨天时替你卖雨伞的女儿高兴。


    老太婆从此果然天天笑逐颜开。


    换一个角度，并没有改变任何事实，但人却变得乐观了。


    这其实并不是“换一个角度看问题”的思考智慧，而是另一种更高级的智慧才能驾驭的人生态度：弱水三千，我取一瓢饮。不要什么好处都想占尽，天大地大，有我一小份是矣。


    ### 3

    人有旦夕祸福，月有阴晴圆缺。如果天天忧心忡忡，就是做到亿万富翁、百亿富翁，同样有可能天天没个安稳日子，因为，我们看得太多这世界的变化，一夜之间，或资金链断裂，或身体和生命出现意外。


    我想起了刚刚逝去的北大原校长丁石孙先生，他在 1992 年 65 岁时就写下了遗嘱，“没有人能准确预见自己死的日子，因之话早说为好。”“我死后一切从简，不要任何仪式……在我死前或死后，凡不在北京的亲属，绝对不要因为我的缘故来北京。对世界来说，我的死是一件极小的事情，过去就过去了。”“请不要为我的死悲痛。我衷心希望你们生活愉快。”


    生者淡然，然后达观知命地生活，直到昨天（10 月 12 日）去世，享年九十有三。


    知道人终有一别，达观知命地生活，过好每一天，争取更好的每一个明天，这是一种态度；


    知道人终有一死，天天数手指数倒计时，恨不得以泪洗面，也是一种态度。


    态度改变不了最终的结局，但会改变我们的生活质量。


    ### 4

    积极乐观的人，容易达成乐观的结果。

    消极悲观的人，容易导向悲观的结果。


    这是“意念”或心术吗？不，我不这样认为。


    我认为这是“态度决定行为，行为决定结果”的必然结果。


    积极乐观的人，通常老成持重，相信自己坚持不懈的努力能够达成好的或者比较好的结果，他们就会有信心、有决心、有耐心在自己思考成熟的地方，持续不断地发力。这样他们就会有很多日积月累却百尺高台起于垒土的可观收获。


    他们不会患得患失，不会在超出自己能力的范围之外下赌注，因此也可以避免很多的投资失误。


    在现代社会，只要肯干，人的生存基本不是问题。人生失败更多的是投资失败：或耽于赌博，或急于求成。


    而消极悲观的人，常常会有朝不保夕、别人已经远超自己等等的强烈紧迫感和危机感，这逼得他们经常在极度悲观和极度乐观的两极中剧烈摇摆，往往都带着赌博的心态做决策、做投资，成为别人韭菜或炮灰的概率由此大增。


    ### 5

    投资世界终将属于乐观者。企业家群体通常是乐观者最多的群体。


    乐观是生命追求中的无量智慧，不是结果收获后的短暂满足。物质财富是永无止境的，不是有了足够的物质财富才乐观，而是因为乐观，积极，一步一步地有力前行，从而不断收获乐观的结果。【完】


    ## 城市地段产品三位一体购房法


    附：买房必须破除城市迷信


    童大焕－2018 年 10 月 23 日


    ![](img/8d530242b5a665d67ce2c341c579f7e7_104_0.png)


    图片说明：

    很多人以为每个圈里的房产都是无风险投资，

    但真正无风险的只有三个圈同时交叉的红心里小小部分！


    1. 往前追溯 20 年，展望未来 20 年，中国几代人积累的财富正在发生剧烈的变化，有的坠落，有的飞升，未来绝大部分会集中到少数一二十座城市。房产的多少和优劣，决定财富的飞升与坠落，同代人的阶层分化会在这
    20 多年间迅速完成。


    2. 资金追逐效率和安全，产业追求分化与合作，创新追求差异与聚集，人口追求就业和机会。世界越来越陡峭，人口越来越集中。过去几代人的存量财富，未来的增量财富，如何保值增值，秘密都在城市化，都在“人聚财聚，人散财散”中。


    买房不止是买房，而是在寻找存量和增量财富的安全仓库，寻找财富升降乃至阶层升降的密码。


    3. 自古不谋全局者不足以谋一域，不谋万世者不足以谋一生。


    看不懂技术革命和产业革命者，就看不懂城市化；看不懂城市化者，就看不懂房地产。


    看不见未来者没有未来。


    4. “我们这里黑龙江地级市，有的位置一般的房子，只要交物业费、取暖费等，都不要房租。一分钱不要白住，根本卖不出去，租不出去。我们这里有些人还在当地花高价买开发区的房子，飞蛾扑火一样被套牢。我们这里市区有90多万人口，不断的流失。”（2018年10月）


    这才刚刚开始。一旦衰退，就摧枯拉朽，逃无可逃。但逆转的时间节点，谁也无法掌控，唯有持不赚最后一个铜板之心，加上明确坚定的方向感，方有安全出逃的可能。


    某友漳州城里的老房子，一直不售，一直建议他们卖掉，多年来都舍不得。过去一年（2017年下半年至2018上半年），遇到三四线货币化棚改拆迁涨价去库存，房价有所上涨。转眼间，出货的最佳窗口期一晃就过去了，现在（2018年10月）介绍说，回到一年前的价格，也很少人接手了。


    地市县城化，县城乡镇化，乡村无人化。


    楼市总体过剩。


    5. 买房不是买房，是买特定的城市空间，是掌握财富升降的无形钥匙。


    城市，地段，产品，三者缺一不可。


    - 绝大部分城乡都将无可避免地衰退，所以选择城市很重要；

    - 即使人口大量流入的城市，绝大部分区域人口也呈流出趋势，所以选择地段很重要；

    - 即使最核心城市最核心地段，也有大量涨不过大都市的产品，还有不少买入即跌的产品，所以选择产品很重要。


    比如北京某最核心地段某豪装产品，我一看楼市未看房，就在2016年1月连写两篇学员和弟子独家文章，宣布它定位错误。前后3年多过去，这100多套房子至今没有卖完。


    比如某核心地段另一豪装产品，从一手卖到今天，二手市场跌一半不止。同地段其他类型产品，同时段升值一倍不止。


    所以产品的精准定位也很重要。


    城市、地段、产品三者都选对，缺一不可，才是长期稳赚不赔的产品【短期大势都会受到信贷政策的强烈影响，但货币刚性增长不可逆，城市化长期规律也不可逆】。


    6. 房地产过去20年是、未来20年仍然是中国最好的投资品，没有之一。但房地产遍地黄金的时代过去了，长期趋势，城市、地段、产品都选对，是涨多涨少的问题；但只要其中一个要素没选对，就是亏多亏少的问题了！【完】


    ## 附：买房必须破除城市迷信


    童大焕—2018 年 1 月 4 日


    2018 年 1 月 4 日 12:00，我发了一条短微博：“买房一定要破除城市迷信，选择区位【地段】和产品比选择城市还重要。”


    有人说：“感觉这一句话几乎把你以前的理论都推翻了。不解？”


    这位读者是没有理解城乡之间、城市之间和城市内部，从区位到产品都越来越分化越来越陡峭的逻辑而已。我其实早就对“省会迷信”提出过警告，认为一些特别的小城镇，比另一些中西部和东北省会还好。


    非物质生产占主流的服务业时代，财富的逻辑在发生变化，城市的生产和生活结合得越来越紧密。产品要更新换代，区位在竞争性发展，城市内部也在兴衰变化。即使是同一区位，产品定位发生偏离，也会成为鸡肋产品。比如我
    2016 年 1 月下旬，面向二期学员和弟子，用两篇独家文章，分析了北京最核心地段某楼盘定位错误。果然，两年时间过去，北京房价经历了大涨又经历了更严厉的调控带来的部分下跌，这个项目的
    100 多套房却推得很用力、卖得很艰难，价格也基本徘徊不动。并不是一线城市所有的房子随便买都行。


    下面讲几个真实案例：


    2017 年 12 月 27 日，有人对我说：“我就是上次在深圳科学馆听你讲座的（2014 年底），然后问东莞有套房，想回到深圳，有什么办法。您给我的建议是卖掉。结果，市场一放松，我就立即卖掉，同时（2015
    年 6 月）到深圳某处买了现在居住的 63.5 平米两居室，总价 281 万，现在市价在 270 万上下。”


    我了解了他的具体房源情况后，发现其地段选择不太对，尤其是选择的是逐渐被淘汰的过时产品，导致房价不仅没有上涨，反而下跌，而且脱手困难。【卖东莞买深圳是对的，但是买深圳时的区位和产品没选对。】


    同年（2015），一对深圳夫妇专程飞北京找我订制，8 月 22 日，在我具体指导下买的房，119 平 750 万。2017 年 12 月 30 日我问他情况，他的回答是：“最近一直还在涨，而且放盘很少（同户型同面积有一套最低报价
    985 万）。租金也很可观，基本上 15000 租金一个礼拜就可以租出去。”


    2015 年 2 月 15 日，我一个外甥在小县城买的房（当时选了两到三个项目由他们挑选），6778 元单价加赠 16 平米住房面积，现在一手 9500 而且基本无房可卖，二手还没房本，已经有人出价到
    8200，我们觉得实际价格还要更高一些。


    2015 年 9 月~10 月间，北京一位订制客户，我让其放弃 10 万元定金，不要原定的房子，到我指定区域另选，并说一年的涨幅或租金差别都不止十万。当年
    10 月其在我指定区位挑选、经我认可买下的房子是 85 平 480 万，月租金 12000~14000 元。今天（2018.1.4）查了一下链家 APP，2017
    年 11 月 19 日有一套 83.45 平，成交价 760 万。


    而我没有当年让其放弃的房子，当年是 170 平 455 万。2017 年全年链家 APP 上该项目没售有一套成交。2016 年 10 月 30 日有一套 161
    平 505 万成交，2016 年 12 月 14 日有一套 194.84 平 585 万成交。而 2016 年 10 月到 2017 年 3 月 17 日之前这段时间，是北京本轮房价的高位阶段。最近有两套房源挂牌出售，一套面积
    159.85 平，报价 785 万；另一套 210 平报价 1050 万。当然，成交量很低的房源，报价和成交价之间往往会差距比较大。


    买房，自始至终首要关注的是房子背后的人：将来什么样的人人会来接你的盘？要懂得城市化发展变化的规律和逻辑，要懂得人口和家庭结构的变迁，要懂得房屋更新换代的方向。并不是简简单单守住所谓一二线城市，或者简简单单在相关区域寻找低价盘、低价房了事。没那么容易。


    好的投资一定有门槛：资金、限贷限贷、智力门槛，等等。尤其是智慧门槛和观念门槛最高，观念又往往由智慧决定。在楼市投资问题上，我们从来不等不靠，根本不必也不应该死守一两座城市，而是要像流水一样，自由流淌到我们的资金可以匹配得到的有价值区域，努力去够自己够得着的东西，一步一步上台阶。中国这么大，几百万亿元的房地产资产，怎么会没有地方可以投资呢？永远是我们的钱或者智慧太少，而不是投资机会太少。


    城市内部的差异，有时比城际差异还大。先讲一个远一点但很有趣的旧事：那一年五岳散人和郑褚打赌，散人说能够品得出大闸蟹是不是出自阳澄湖，郑褚说你能正确区分那我吧电脑键盘吃了。现场直播，结果散人的命中率还不如靠猜的命中率。它说明什么呢？说明一个事实：同一个湖中个体与个体的差异，比不同湖之间群体的差异还要大得多。如古人说的龙生九子九子各不同。城市化发展也是这样的，城市内部差异有时比城际差异还大。为什么很多人感觉越买越困惑，原因多在于此。有些人死抱住某些城市不放，也是进入同类误区。


    导致这种差距逐渐拉大的原因，不是简单的板块轮动或波段与时机说可以解释的，具体的原因分析和对策，就留待以后分析给学员们听吧。


    ## 为什么我再强调 信规律不信规划 信市场不信市长


    童大焕—2019 年 10 月 14 日星期一


    很多人总是对我的 “信规律不信规划，信市场不信市长” 半信半疑，认为 “国之一瞬，人之一生”，万一规划强劲，个人担不起。请看我用事实详细论证。有预言，有后见。


    ### 1

    提问：昨天向董老师提问的有关北京市人口规划能否大致落实的问题，没有回复。其实董老师的答案，不用回复我就知道，董老师不是说过名句“信规律不信规划”吗。但是城市化的规律就像黄河九曲十八弯，最终奔流到大海。哪怕中间出现曲折，比如二三十年，放在国家和历史面前就是一瞬，可是放在很多小民身上就是一生的机会与命运。相对于结论，我更看重论证的逻辑过程。希望董老师能够再论证详细一些。


    答：论证的过程，**2014 年 3 月 19 日**我已经“提前论证”，全文只用了半小时，用的是中午时间写的，在这里——《童大焕：保定的房价会暴涨十倍吗_腾讯·大家》，只是有些人可能总是半信半疑。


    在 5 年半前那篇半小时一挥而就的文章里，我写道：


    > 2014 年 3 月 19 日国内最热的一则新闻当属“北京政治副中心初定河北保定……”


    第一，疏散国家部委下属的事业单位和教育机构，即使全面搬迁，其工作人员家属也未必能够随之，这毕竟是一个市场主导人口和就业的年代。因此，它对疏解北京人口压力的功能极其有限。第二，若要想它成为一个政治中心，进而带动京津冀的一体化发展，那更是指望小马拉大车，几乎完全没有这个可能。要实现这个功能，除非中央和北京的整体政治中心搬迁。而且还必须是小市场小社会大政府的格局不变，而后者显然不符合市场经济和反腐败的基本要求。


    如是，如果保定成为北京政治副中心最后尘埃落定并且付诸实施，最有可能的结果就是成为一个国家部委所属科研机构和大学集中地，类似于一个新的大学城。因为这些机构根本不具备真正的政治功能，而只是科研和教育教学功能。那么，它最好的结果就是另一个燕郊，但显然，燕郊的地理位置比它好多了。


    就像动物园服装批发市场强制搬迁河北一样，这未必是河北繁荣的开始，更可能是市场衰落的先声。同样，国家部委所属科研机构和大学搬迁保定，也未必是保定繁荣的前兆，而有可能是这些科研机构和大学衰落的先声。


    ### 2

    提问：董老师大部分文章都读过，规律当然是大过规划的，但是规律起作用有两种形式，顺则发展，逆之则受惩罚，M 时代逆城市化也将近 30 年。我们是要预测是以那种方式起作用。这就是说，规律仍然在，**1949
    年前**那些在京的房产投资在那三十年就完了。


    答：先看图。图示内容为通州区规划调整（**2019 年 7 月 2 日北青网**）：


    《关于北京市通州区区国民经济和社会发展第十三个五年规划纲要部分内容调整的方案》日前在首都之窗公布，发展定位删掉了“**行政副中心**”，将原规划中“**行政副中心、国际商务新中心、文化发展创新区、和谐宜居示范区**”的发展

