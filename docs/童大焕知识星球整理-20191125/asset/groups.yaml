  - '[PAGE 129]


    如果一遇经济寒流，人人都步调一致像缩头乌龟一样整体按兵不动，那人类岂不永远走不出萧条和危机困境的魔咒？


    # 7 一个蝴蝶效应的标本


    假定一个人扩张信用，用 300 万元首付购买了总价 1 千万元的房子，这一千万流出去就成了很多人十万百万的收入增长来源。如果他不扩张这个信用，别人用工业农业和传统过剩制造业一共赚一千万，还不知要到哪个猴年马月。


    而这从一套房子里流出去的一千万元，又很快成为了很多人的信心所在和信用工具，他们又去撬动别的投资和房产，带动了一个亿甚至更多的投资和消费，并且，不知道在哪一天哪个环节，又成为这第一个买一千万房子的现金收入来源！


    蝴蝶效应就这样导致整个经济复苏。但是复杂的流程我们很难追踪。


    通则不痛，痛则不通。一通则百通。


    最后讲一则经济学小故事：


    这是炎热小镇慵懒的一天。太阳高挂，街道无人，每个人都债台高筑，靠信用度日。


    这时，从外地来了一位有钱的旅客，他进了一家旅馆，拿出一张 1000 元钞票放在柜台，说想先看看房间，挑一间合适的过夜。


    就在此人上楼的时候，店主抓了这张 1000 元钞，跑到隔壁屠户那里支付了欠的鱼肉钱。


    屠夫有了 1000 元，横过马路付清了猪农的猪本钱。


    猪农拿了 1000 元，出去付了他欠的饲料款。


    那个卖饲料的老兄，拿到 1000 元赶忙去付清他召妓的钱（经济不景气，当地的服务业也不得**提供信用服务**）。


    有了 1000 元 ，这名妓女冲到旅馆付了她所欠的房钱。


    旅馆店主忙把这 1000 元放到柜台上，以免旅客下楼时起疑。


    此时那人正下楼来，拿起 1000 元， 声称没一间满意的，他把钱收进口袋，走了……'
  - '[PAGE 130]


    这一天，没有人生产了什么东西，也没有人得到什么东西，可全镇的债务都清了，大家很开心。


    寻找一定时期支柱产业的逻辑，和这个小故事一样，并不是大家真那么穷，大家可能都有钱，但是由于缺乏有效的投资和信用扩张，实现一定的正现金流，从而用蝴蝶效应让经济重新暖起来，搞得人人都像套子里的人，在寒冷的街道，缩头缩脚，瑟瑟发抖。【完】


    # # 严重阻碍个人信用扩张的认房认贷和 468 线


    文/童大焕 2019.11. 21


    童老师，身边有好些 2010 年前后甚至更早些时间买房的，他们有比较强烈的改善需求：就是房子已经增值不少，卖了之后还掉贷款剩余的钱做首付，重新再贷款些款，拉长年限月供控制在原来差不多或者适量增加的情况，按理是可以实现改善的，但北京五环内现在的非普线控制在
    468 万，普宅认贷二套最多只能贷款 187 万、非普八成首付加税费中介费总共就九成左右首付差不多要全款，有些卖掉之后贷的款都没原来的多了。若放宽非普线，就这种信用扩张应该是安全的也是有挺大需求的，这样理解对吗？


    答：


    是的，十年前买房的，现在相当多已经有了改善性住房的需求。他们当年的房子，若买在一二线城市，普遍已经涨了 2 倍以上，也就是现在是当年的 3 倍以上价格。但是像北京这样的非普线和
    2017.3.17 以来认房又认贷的限贷政策，以及限价政策严重拉低了住房品质升级，都严重妨碍了人们的住房改善。


    而你说的普宅认贷二套最多只能贷款 187 是极端理想状态，必须达到满评（银行按揭评估价达到购买价的 100%）才行。


    就以 468 万非普线的房子做一测算：十年前价格 150 万左右，首付最低 2 成只要 30 万，贷款 130 万。按 20 年计，估算 2010.1 第一次还款，2019.12
    一次性还完，还欠银行 81 万本金。


    现在卖房可得：468-81=387 万。也就是首付 387 万。


    那么按现在的认房认贷及 468 万以内普宅认定标准，普宅二套首付 6 成，非普 8 成。我们看看买回 468 万的房子需要多少钱：


    ```

    468*0. 85*0. 4=159 万。这是银行贷款。

    ```


    ```

    税费 6%，中介费 2%估算，468*8%=37.44 万。

    ```'
  - '[PAGE 131]


    总首付要求：468-159+37.44=346 万。


    也就是说，折腾一番，只能勉强买回自己的房子，还增加了贷款【贷款余额从 81 万变成了 159 万】。谁会吃饱了撑的去折腾呢？


    如果认房不认贷，或者普宅标准大幅度提高，情况就会大大改观。


    以认房不认贷为例，如果只要北京无房，就可以三成首付，那么首付 387 万，买一套千万级别的房子，只要月供许可，首付是绰绰有余的。


    以千万住宅为例，个人住房大幅度改善，政府收税 60 万，很多人从中赚了钱，现金流大增。


    但是现行政策，不允许你信用扩张，于是，有能力扩张者，住不上好房子（468 万总价，6 万平均单价，不到 80 平米，一家三口，平均面积还不到北京人均住房平均面积的
    36 平米，但这已经是“豪宅线”），政府少了税收，中下游的人少了正规金流，其中有人也少了买 300 万、500 万房子的机会。


    什么叫“牵一发而动全身”？这就是。


    很多人不承认房地产在这个阶段的国民经济支柱地位，总想用其它工农业过剩产能来维持支柱地位，怎么可能呢？


    还举上面的例子吧。明明首付 387 万的人里，有人有能力通过加杠杆扩张银行信用，买到价值 1000 万的房子改善需求，但政策就是不让，认房又认贷，且五环内总价过了
    468 万的算非普通住宅，必须 8 成首付，导致二手只能买总价只能 468 万左右的房子（略高一点的可以按 468 万评估，但高出部分必须全款），实实在在地的减少了
    500 万元的信用扩张。


    而在传统消费领域，要扩张 500 万元消费，是多难的一件事啊！


    人生主要消费，不过衣食住行。一个人一年平均能消耗 2 万元吃饭、1 万元衣服，已经超出大部分人的消费水准了。而买房，扩张 500 万元的贷款，也就是一瞬之间可以完成的事情，需要衣食消费
    166 年才能完成！


    买车会贵一点，几十万上百万一辆。但网约车时代到来了，汽车的代步工具本质日益显现，汽车购买量只会逐步缩小。而且，私人小汽车过度，增加了大城市交通拥堵和尾气污染，挤占了大量城市空间，属于必将被淘汰的“城市落后产能”。


    经济增长的本质就是信用尤其是私人和私人团体的信用扩张，不让有信用扩张能力的人扩张信用，带来的是全社会的巨大损失。'
  - '[PAGE 132]


    **【完】**'
