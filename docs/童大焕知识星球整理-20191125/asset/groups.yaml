    # 关于房产投资后的持有期限及优化置换等问题


    **童大焕—2019 年 9 月 7 日**


    ## 1


    有知识星球网友提问：“董老师，我想请教一下，投资房产后，如何把握该房产持有期限？是达到自己预定的收益以后即可进行优化升级置换计划，还是发现有更优房产马上置换？目前阶段投资房产理想的收益大概多少合适？如果马上置换的话，估计短期收益不易覆盖交易成本。”


    这是一个人们普遍关心而且不易拿捏的关键问题，我答应专门用一篇精华文章来回答。


    在正式回答之前，先说明：我姓童，不姓董，请大家务必看清楚要问的对象是谁。


    ## 2


    这里面其实包含了四个问题，我一个一个来回答，更清晰。


    **【投资房产后，如何把握该房产持有期限？】**


    做任何投资，一定是在自己能力许可条件下，尽可能充分比较各种可投资的机会和品种以后，锁定对自己最有利的一种。


    对我来说，选择中国国内房产投资，既是城市化研究的必然副产品（绝大多数与房地产相关的从业者如规划、建筑师，房地产公司、中介公司员工等都是不知城市化为何物的，他们可以是可以好的职业经理人、行业好工匠，但很少能够成为具有预判城市走向能力的师者），也是在股票、期货、黄金、外汇、古玩、珠宝、艺术品、外域房产、储蓄、理财、股权等等各种投资品种中“百般选择”后的结果。中外历史已证明，未来仍将证明，优质房产投资，是普通老百姓在安全性、涨幅和流动性三个方面都最好的投资品种，没有之一。


    一些股权投资尤其是现代高科技、互联网和 AI 等领域，事后被证明是房产投资的百倍万倍收益，但那基本上只适合机构投资。而再聪明的机构投资，往往也是投资十个成功一个，其它成为沉没成本，总体仍是赚的。普通人只看见浮出水面的一百分之一甚至万分之一
    的暴富者，看不见背后巨大的沉没成本。普通百姓没有那么多资金可折腾，也就是付不起沉没成本，不能玩低概率游戏。


    在此基础上，我多年来一直强调“（能够直接和银行随时发生借贷关系的）独立产权房才是普通百姓抵御通胀并有可能实现财富逆袭的唯一工具”。也就是说，普通老百姓不要三心二意，只需死心塌地专心专意买好房子、买好房子。这是投资第一法则。


    第二法则，买房子只做价值投资，不做短炒。因为有太多自己不可控的因素，短炒追风口的话，对了九次，只要一次失误，都有可能前功尽弃毁于一旦。


    这两大法则一旦确定，“投资房产后，如何把握该房产持有期限？”的问题就水落石出了：在没有更好的房产投资之前，该房产永久持有，无期限。


    当然，如果现有房产是在很快就要衰落的地方，那么不管盈亏，赶紧卖。卖了以后，马上优化置换到人口长期流入的地方。


    这个所谓人口长期流入的地方，可不能只以城市为概念，而要落实到具体的城市区域。同一城市，有的地方人口在衰减，有的地方人口在增长。这个，看统计数据是看不出来的，而且我们能看见的大部分数据，真实性和准确性都存疑。


    ## 3


    **【是达到自己预定的收益以后即可进行优化升级置换计划，还是发现有更优房产马上置换？】**


    都不是。你我都不是上帝，不应该给自己设定什么预定收益，而应该只顾耕耘不问收获。


    什么时候优化置换，取决于当事人当时的各种具体约束情况。最重要的是：你能不能够上更高一级的门槛，比如总资产不变或总资产增加换到更好城市更好地段和产品，或者同样优质地段总资产增加或产品更优。


    如果这些条件不具备，原有资产就是升值再多也不要轻举妄动；如果四个条件（城市，地段，产品，总资产）具备其一，即使原资产升值不多，也应该立即采取行动。


    比如，最近有人问北京一套价值 700 万、按揭 260 万的楼梯房能不能卖。其月供能力不错，原有房产产品有置换必要，但是根据现行二套首付 8 成的按揭条件，除非其愿意采取中间机构垫资、全款买房后抵押的方式，否则他们连
    700 万的资产也买不回来，虽然当下正处在房价低迷时很好的置换时机，但对他们来说也不宜置换，而只应该采取抵押贷款或二次抵押的方式，根据贷出来的首付情况，另行投资别的标的。


    还有，很多城市现在限制套数，对于已拥有多套房的人和家庭来说，意味着卖一套少一套。所以有的房子已经涨了很多，银行杠杆率变得很低，但只要这些房子具备长远价值，就不应该卖掉，而只能通过别的金融方式，让原有房子“灵魂出壳”，变出更多的钱来做投资，前提是控制好月供能力。


    我从 2002 年到北京以后，在北京买的住宅，除了 2009 年底 2010 年初优化置换了一套（2010 年底开始才有限购措施）之后，再也没卖过。都采取“灵魂出壳”的方式进行滚雪球。


    ## 4


    **【目前阶段投资房产理想的收益大概多少合适？】**


    如上，我们不应该确定也没有能力确定多少收益，我们只是在现有各种投资品种中，选定了房产投资作为最好的终极投资品种。换句话说，如果房产投资我们都赚不到钱，更别指望在别的投资领域赚到钱。


    从一开始，我的私人订制就确定了“四不做”原则，就是有很多因素并不是我们可控的。只有顺其自然，才是健康的投资心态。要不怎么说投资是人生最深刻的修行呢？！


    私人订制四不做，其中一条就是：问多长时间能有多少收益的（不论是说比率，还是说绝对值），不做。量身定制，是帮助人们遵循政策无法改变的长期规律，去够最匹配的最佳资产，其它的，属于我不可控的调控政策、M2
    等等变量。


    ## 5


    **【如果马上置换的话，估计短期收益不易覆盖交易成本。】**


    投资像钓鱼，大部分时间在等待。如果一投资马上要看它天天涨，这样的心态，不是健康的投资心态，而是干一天活拿一天工资的打工心态。


    其实市场平稳甚至下跌时才是优化置换的最好时机，容得我们慢慢挑选好房源甚至是急于出手的特价房源。这个过程，本身就是“赚”的。


    买完以后，相当一段时间不涨甚至下跌，也没有关系，就像农业时代农民都靠养猪积攒一点家用，日积月累的月供就是在攒钱。【完】


    # 房地产到底是不是中国的支柱产业


    童大焕—2019 年 9 月 7 日星期六


    ## 1 缘起


    关于房地产是不是支柱产业，是我和风格纯粹一贯以来的分歧。微博上一来二去难以说清，我们决定再来一次华山论剑，闭门各自完成系统论证，两篇文章一起发在我俩各自的知识星球。长期以来，针对这个问题，大家只知道我们俩的分歧，都没有见过系统的阐述。


    风格纯粹的主要观点是：加入 WTO 成为世界工厂，是中国经济繁荣的根本秘密。房地产是经济发展的成果，而不是原因。加入 WTO，成为世界工厂，贡献了中国经济几乎全部的现金流。这就是世界工厂地位对中国经济的重要性，它是中国
    经济繁荣的基石！


    而我的观点一直是房地产是中国经济的支柱产业，一方面，古往今来，衣食住行 四件大事，住，一直是老百姓一生中最大资产的投入和积累；进入金融化时代以 后，可以向未来借钱，房地产无论从创造财富、创造货币的角度，都可以自成体
    系，而且直接带动上下游 60 多个相关行业的发展，创造全社会的繁荣。所以它 的国民经济支柱地位坚若磐石。


    ## 2 历史事件


    当代中国两个最重大的历史事件，一是 1998 年开始的城市住房商品化，二是 2001 年加入世贸组织。


    1998 年 7 月，国务院发布《关于进一步深化城镇住房制度改革加快住房建设的通知》，宣布从同年下半年开始全面停止住房实物分配，实行住房分配货币化， 首次提出建立和完善以经济适用住房为主的多层次城镇居民供应体系。


    这是当代中国住房商品化的重要开端，也是当代中国大陸人拥有资产化收入的重 要开端。它从根本上改变了当代国人的居住水平和财富水平。


    1949 年，北京人均住宅面积是 4.9 平方米，到了 1976 年，反而不足 4 平方米。 2018 年 7 月，北京市“十二五”统计公报公布，报告显示，北京城镇居民人均
    住房建筑面积 31.69 平方米。


    20 年，8 倍。


    2001 年 12 月 11 日我国正式加入世界贸易组织。这是中国融入国际大家庭的重 要开端，也是中国世界工厂的开端，更是中国经济市场化补课的重要转折点。


    > 那么，这两个重要历史事件，是一个因果关系，还是并行不悖的平行关系？


    ## 3 逻辑论证


    一般观点是：房地产是果实，收入是因。只有收入增长并且有了积累，人们才有 余力考虑买房建房。只有经济发展了，人们赚了钱，房地产才能发展。没有经济 发展哪来的房地产呢？因此，肯定是
    WTO 带动了经济发展，进而带动了房地产 发展。


    从个人经验和感觉来说，的确是如此。但是理性分析往往是反直觉的。


    上述论点的逻辑谬误在于：有意无意地，把内需、把房地产业发展排除在了“经济 发展”之外。事实上，包括房地产在内的内需，是经济发展的重要组成部分甚至是基本组成部分。


    而外贸，不管怎样重要，其占 GDP 增加值的总量，以及其提供的就业人口，我 将在下面用事实论证，占比并没有那么高。


    中国加入世贸组织的重要意义，并不仅仅是外贸产值的占比和相关的就业机会， 更重要的是用国际通行的市场规则全面重塑了中国，进而，通过市场的逻辑，大 幅度加快了中国内部的经济发展。虽然这个市场化重塑还彻底，虽然我们还
    在继续改开的道路上，道路阻且长。


    > 还有一点，现代金融制度对房地产业地的助推。从最开始的北京零首付，2 成首付， 租金甚至可以抵月供。大部分城市刚开始首付也很低。


    > 人们不再是仅仅用已经赚到的钱来改善自己的居住需求，而是几百、几千元月供 可以扛起一套房子。


    > 这是一个无中生有的过程。就像当年台湾的主攻，政府一个金融创新，用工业债 券购买农民多余的土地，再卖给无地的农民。结果正赶上全球工业化浪潮，工业 债券大涨，各方皆大欢喜。


    今天 5 千元月供，可以扛起 100 万房产。而这 100 万房产，过程中就创造了很多 的就业和现金流机会。


    又问：5 千元月供从哪里来？它可以从别人购买或建造 100 万房产创造的就业机 会中来，可以从金融、法律、教育、医疗、文化艺术、党政军工作，餐饮和快递 服务等等各种机会中来，反正不仅仅是从与外贸相关的行业中来。


    ## 4 从横面看建筑业和制造业谁的贡献大？


    截取 2018 年 3 月中美贸易战前 2017 年的数据。


    根据国家统计局 2017 年国民经济和社会发展统计公报，2017 年全年国内生产总值 827122 亿元，比上年增长 6.9%。其中，第一产业增加值 65468
    亿元；第二产业增加值 334623 亿元，其中，全部工业增加值 279997 亿元，全社会建筑业增加值 55689 亿元；第三产业增加值 427032 亿元。第一产业增加值占国内生产总值的比重为
    7.9%，第二产业增加值比重为 40.5%，第三产业增加值比重为 51.6%。


    三驾马车中，全年最终消费支出对国内生产总值增长的贡献率为 58.8%，资本形成总额贡献率为 32.1%，货物和服务净出口贡献为 9.1%。


    建筑业和制造业加起来，几乎就是全部的第二产业增加值。表面上，建筑业占第二产业增加值的比重不高，建筑业对国内生产总值增长的贡献率为 6.7%，比货物和服务净出口贡献
    9.1% 低了不少。但是，如果考虑到建筑业带动的上下游 60 多个行业（含第二和第三产业），纯贡献上，建筑和房地产业和外贸相比，至少打个平手没有问题。


    ## 5 中国的工业产能过剩问题


    由于各地方政府通过招商引资竞争发展，而地方政府没有税收自主权，所以往往采取降低地价的方式吸引投资。而政府不直接创造财富，降低地价的钱只能来自房地产行业的补贴——抬高地价。导致房地产补贴工业制造业，抽屉制造业要素价格，形成工业超前、城市化滞后的工业产能过剩现象。房地产补贴制造业，反过来绑架银行。


    也就是说，工业制造业过剩，使得 GDP 盘子总量增大，无形中拉低了建筑房地产的贡献。


    这方面，有行业专家和学者的论证：


    华远地产董事长任志强在 2013 博鳌房地产论坛上作演讲时表示：和纽约、香港、伦敦、新加坡等城市对比可以看到，在城市发展过程中，工业所占的用地数量是非常少的，但在国内，相当一部分工业重镇的工业用地，已经达到了用地总量的
    40%到 50%，平均下来是占 26%以上。换句话说，住宅用地的升值，相当一部分是弥补和补贴了工业用地的超量，所以我们工业化和城市化率几乎接近，而实际上应该城市化率远远大于工业化率，这样才能保证为工业提供更多的第三产服务，而现在我们不是。


    北大国家发展研究院周其仁教授也指出：中国城市化工业化严重不匹配，工业化超前，城市化滞后（2013 年 11 月 4 日 11:31 财新网）。


    周其仁表示，2010 年，全世界城市化率为 50.9%，工业化率为 26%，即 GDP 中工业生产占比只有 26%。全球平均的城市化率除以工业化率，得数约为
    1.95。也就是说，城市化率通常是工业化指数的两倍。


    然而，中国的情况是，城市化率从上世纪 80 年代早期的不到 19%，发展到如今的 51%至 52%，达到全球平均水平，工业化率超过全球平均水平差不多一倍，达到
    46%以上，两者相除，得数为 1.09。


    周其仁指出，目前，美国的城市化率为 80%，现代服务业为主，其工业化率仅为 20%，两者相除得数为 4.1。在法国、英国、德国、日本，上述比例分别为 4.11、
    4.09、 2.64、2.48。


    同时，中国城市化与工业化的比值，在金砖国家中也偏低。比如，巴西该数字为 3.22，俄罗斯 1.97，南非 1.38，印度 1.15，都比中国的高。


    周其仁表示，中国改革开放已经 30 年，工业化相对超前、城市化相对落后的局面仍未改变。最近，北京等不少城市雾霾严重，重要的原因之一就是中国的城市依然有很多工业制造活动，而服务业发展相对滞后。


    > 从地方政府招商引资成为主要夹头工作那一天起，房地产补贴制造业、制造业开发重于房地产开发的格局即已形成，如果不是这样，而是完全按市场规律自由发展，房地产的占比会上升，制造业占比会下降，则，房地产业的支柱地位会更加明显。


    ## 6 关于中国房地产过剩问题


    中国大路的房地产，由于补贴工业，也由于土地财政，因此，也和制造业一样存在严重过剩的问题，尤其是大量人口流出的地区，却在土地财政的逻辑支配下，普遍存在城市扩张过度、房地产供应过度的问题。


    但与制造业的普遍过剩不同，房地产业的过剩，是区域性、结构性过剩。人口流入的东部大城市核心区域，供应总体是稀缺的；大量大城市的改善性住房，在认房又认贷、大幅度提高二套首付的背景下，是被人为压制的；大量大城市的棚户区老破小，还面临着都市更新的迫切需要；而大量人口流失的农村地区，则由于城市居民不允许进行农房、农村宅基地交易，大量精美的农村历史建筑，政府和老百姓维修、保养不起，城市居民无法介入，在草原上自生自灭......


    ## 7 从就业看制造业和建筑业


    根据全国总工会调查报告，2017 年全国职工总数已达 3.91 亿左右。


    同年，根据《2017 年中国农民工总量、地区分布、年龄构成、新生代农民工占比、文化程度构成、接受技能培训的农民工占比、农民工收入、从业行业分布情况分析》(中国产业信息网
    2018 年 05 月 11 日)，当年全国农民工总量达到 28652 万人。


    这 2.86 亿农民工从事第二产业的占 51.5%，其中制造业 28.9% 建筑业 18.9%；从 事第三产业的占比 48%。


    全国职工总数 3.91 亿，扣除 2.86 亿农民工，剩下的 1 亿出头的就业人口，大多数从事党政军、教育、医疗、金融、法律、会计、咨询、文化艺术、旅游等中端服务业，从事制造业和建筑业的比例非常低。


    那么，整个制造业，包括服务于国内的部分，包括过剩产能部分，也包括了建筑房地产业带动的上下游制造业部分，制造业所提供的全部就业机会，充其量只在上述 28.9%左右。


    也就是说，70%左右的就业者，其收入现金流来源和制造业基本无关。而外贸只占制造业的一小部分，服务贸易出口（2017 年为 15407 亿元）当下几乎可以忽略不计。因此，国内大部分人的收入现金流，跟外贸基本无关。


    而建筑和房地产业，即使不算带动的上下游产业，其单项领域，也完全有可能成为一家独大的就业密集区。


    ## 8 国际比较


    根据黑布林北海居《2017 年美国 GDP 分行业核算数据》（腾讯网 2018 年 4 月 23 日）整理的数据：


    2017 年美国以 193906 亿美元 GDP 位居世界第一；中国以 122377 亿美元紧随其后，约为美国的 63.1%。


    2017 年，美国制造业增加值 22443 亿美元，占 GDP 的比重为 11.6%。2017 年，中国制造业增加值为 35947 亿美元，高出美国 60.2%。


    该数据，可以证实周其仁先生“工业化超前，城市化滞后”的判断。


    2017 年，美国建筑业增加值 8261 亿美元，占 GDP 的比重为 4.3%。2017 年，中国建筑业增加值 8248 亿美元，仅相当于美国的 99.8%。


    2017 年，美国房地产业增加值 23874 亿美元，占 GDP 的比重为 12.3%。2017 年，中国房地产业增加值 7976 亿美元，相当于美国的 33.4%。


    2017 年末，全国大陆总人口 139008 万人，其中城镇常住人口 81347 万人，占总人口比重（常住人口城镇化率）为 58.52%，户籍人口城镇化率为
    42.35%。


    美国只有 3.3 亿人口，城市化率 80%以上，中国的人口比美国多得多，城市化率却比美国低得多，城市住房需求应该比美国大得多，而且，城市化和房地产业都还在被中断
    50 年以后（1949~1998）的补课过程中，按理说，建筑业和房地产业增加值和占国民经济的比重，都应该远高于美国才对。事实却不然，中美建筑业增加值相当，中国的房地产业增加值却只有美国的三分之一！我分析，原因大

    '
