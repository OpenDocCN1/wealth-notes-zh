    ## 人生由个人兴趣指引还是社会需要指引？


    童大焕——2019 年 8 月 24 日星期六


    ### 1

    孩子在寻找自己的方向。有一天问他妈妈，爸爸是怎样把兴趣变成自己的职业的？

    妈妈对他说，这个过程其实挺漫长的。爸爸一直在写作，一直在思考，然后把自己认为时代最重要的问题沉淀下来，作为主攻方向，慢慢就成为自己的职业。

    等我差不多把 90% 以上的时间精力用于城市化研究的时候，已经是 2013 年左右，年龄上已经 45，距离 1997 年正儿八经写第一篇有关城市化的文章，也已经将近
    16 年了。

    之后有一天，我对孩子说，未来方向，第一服从你的兴趣或志向（二者有区别），我是志向引导我。所谓志向就是做对的事情、做社会需要的事情，哪怕主流观念并不理解。


    ### 2

    我们经常说，兴趣是最好的老师，它可以激发人的创造热情、好奇心和求知欲，让人废寝忘食地学习、思考和工作而一点不觉得累。

    但是，大部分在这个问题上是非常糊涂的，因为人们没有多问一句：你是怎样找到你的兴趣的？

    有很多人，一辈子都不知道自己的“兴趣”在哪里。换句话说，大多数人还没有找到自己的“兴趣”，这一辈子就已经过去了。


    ### 3

    很多人说自己兴趣广泛，但仔细一看，他一样都不精通。这样的兴趣广泛，有可能是见异思迁、不够专注的代名词。但是大家对这类现象司空见惯，从未警觉。

    大部分人一路上对很多事情发生过兴趣，但大都是浅尝辄止，能够坚持下来的凤毛麟角。这属于偶然的好奇。多数人一遇到困难就转身离去，再也没有“兴趣”了。

    大部分有成就的人，并不是兴趣指引，而是长期艰苦的思考与训练。


    ### 4

    一个人真的发现了某种强烈的兴趣和爱好，如果长期得不到社会的正面反馈与回报，能持之以恒的，恐怕也是微乎其微。

    在一定程度上，“兴趣”二字可能是骗人的东西。

    兴趣也许并没有真的那么重要。如果一件事你能做好，并且做得比谁都好，或者至少比大多数人好，你会得到更多的夸奖、掌声、艳羡以及物质的回报。这种情况下，你还会对这件事没兴趣吗？

    看来，并不是因为有了兴趣才能把事情做好，而是因为做好了才更有兴趣。

    所以，当一个人表示自己“没兴趣，没意思”的时候，你一定要甄别，到底是真的没兴趣，还是因为没能力把这件事做好。


    ### 5

    我的“兴趣”一开始是由“能力”指引，慢慢地变成由“社会需要”指引。

    年轻时大家都是诗人，爱写诗，爱写散文。大学时出过版油印版的《理工科四人诗选》。毕业后写散文、杂文，发表在当地和外地报纸上，引来周围很多人的夸奖。同时，在那个工资一开始只有
    140 元、十年后才到两千多元的时代，常常穷得第二天可能就没钱花了，突然雪中送炭般又来一张十几、几十元的稿费单，那种收获感，真是满满当当。

    再后来，杂文和时评慢慢地写出了一点名堂，稿费收入开始超过工资，就给自己立下一个更高的要求：在重大问题上发出自己的声音。这就开始进入根据“社会需要”来指引自己的路。

    基本上完全转入城市化研究，是在写了无数的评论文章、历经无数的选题之后（最多时我一年写了 500 多篇时评文章），认为城市化是当代中国最重大、对每一个国人命运影响最深远的事件，而对这方面的独立、科学研究，几乎可以说接近空白。

    这就是完全的由“社会需要”来指引自己的人生道路了。


    ### 6

    上大学时，偶然读到过普列汉诺夫一句话：“一个人要想对社会有所贡献，必须使他的才能比别人更适合时代的需要。”这句话一直提醒着我。


    ### 7

    但是，“社会需要”在真实的社会情境中，并不总是收获鲜花与掌声。在城市化研究的道路上，由于一直唱多房地产，我曾经有幸和任志强、董藩这些先生一遭，被社会骂了若干年。

    我的城市化研究得出的规律，也和政府的土地财政、百姓的均衡发展梦想并不合拍。但好的是，普通百姓的财富逻辑，迟早得跟城市化规律一致，才能更好地守卫和增长自己的财富。

    在大多数人不理解或理解不了的地方，恰恰是市场能给你更公平的反馈！这一点，是社会最公平之处。

    我发现那些最优秀的企业家，几乎都是被“社会需求”指引，甚至反过来指引社会需求，而且从不会理会社会的情绪，而是在“社会需求”的指引下，直接用人们前所未见的商品和服务给社会以“暴击”。

    比如，乔布斯说用户根本不知道自己想要什么东西，除非你拿到他面前。

    比如，孙正义投资的大多数是社会多数人看不懂的未来行业，他希望软银成为对人类进化做出最大贡献的公司。巨额回报又更加激发他研究和投资未来。他说：未来卫星网络将覆盖地球的每个角落，万亿台连网设备将会把数据传输到云端，并通过人工智能（AI）进行分析。从现在开始，会有更加巨大的变革到来，现在我已经非常期待了，甚至觉得睡觉都是浪费。【完】


    ## 在感性冲动决策前悬崖勒马


    童大焕—2019 年 8 月 26 日星期一


    ### 1

    据说，大脑研究告诉我们，人类超过 90% 的决策都是借助感性做出的。所谓感性，就是凭直觉和经验，没有经过严格的逻辑思考。

    然而，正是从我们具备想象力和逻辑理性判断能力开始，人类才超越传统动物，并因此获得更强的生存能力，以及，发育发展出地球史上令人目瞪口呆的科技创新。

    即使在人类这个种群中，更倾向于数学和逻辑性思考的人，往往也更能避免失误，做出正确的决策，获得更多更大的成功。

    掌握理性与感性的平衡，是正确决策、生活幸福的关键。


    ### 2

    弟子群在讨论买房到底是投资还是消费，我随手写了一句：

    房地产就这么神奇，你用投资的视角看它，它就给你投资的回报【比如前几天我发在知识星球的文章：投资和自住有矛盾，服从投资】；你用消费的眼光去看它，即使投资也会变成“消费”，比如很多人买远郊别墅、旅游地产，潜意识里是投资，却以老人和自己度假休闲做借口，结果就变成了卖不出去或者不涨甚至跌价的“消费”。


    ### 3

    我觉得上面这句话简直是神来之笔，就仔细多看了几遍。

    这一看不要紧，发现其中还深藏着更深的奥秘，就是在“投资”还是“消费”这两者之间，事实上还潜藏着到底是理性决策，还是感性决策的巨大分野。


    ### 4

    曾经有一位读者，准备在环京某处买别墅，那真是山好水好房子好。关键是，相对于北京每天面对的高房价，看上去价格那是相当的便宜，简直跟白菜价差不多。能够用来度假，看好山好水，放松心情，呼吸新鲜空气。这么低的价格，“顺便”都还能涨涨价。

    她说：主要是买给老人度假、养老，升不升值不是最重要的。

    我说：别骗自己了！如果有人明确告诉你，这个房子绝对不会升值，你仔细想一想，会不会还买这个房子，让老人到这么一个地方来休闲度假养老？

    她好像隔了一天才回复：你说得对，仔细想想，还真如你所说的......


    ### 5

    这位读者一开始的判断是感性的：好山好水，好房子；旅游度假，心情不错；看起来价格相当低，升值应该不会有问题......

    尤其是当她把老人度假养老这个念头放进来的时候，脑子就全被充满了，不再有多少逻辑理性的剩余空间了。

    感性判断有四大特点：局部，短视，直观，易变。

    相对应的，逻辑理性判断也有四大特点：全局，远见，抽象，恒定。


    【直观和抽象】：被开发商拉去看一手房的时候，一眼看到直观印象是：窗明几净，花园簇新。那背后是开发商大量的资金和劳动投入呈现的临时景象啊。这时候的逻辑理性、抽象思维应该是：二手的时候，会不会因为入住率低而杂草丛生、污水横流、空寂落寞？

    【局部和全局】：乍从吵杂的都市来到偏远的郊区，眼睛局部看到的是：好山好水好房子，感觉空气都是甜的，风都是柔软的。但是我们要看到的全局是：医疗、商业到时候方便不？会不会一年住不上几天，结果维修和打扫房屋的时间耗去了
    一大半休闲时间，人变成侍候房屋的奴隶？每次大老远来这里度假，会不会很不 方便，一次两次还新鲜，三次五次就腻烦了？

    **【短视和远见】**：看到低廉的价格，就以为未来一定涨得多，这是短视的。远见 则是这样想：同样的钱，有没有更有价值的地方可投资？投到更有价值的地方， 是不是未来涨幅会更高？用其他地方更高的涨幅和更好的租金，支持旅游度假，
    住酒店，是不是更加潇洒自如，自由自在，想去哪里就去哪里？

    **【易变和恒定】**：在局部、短视、直观感觉支配下的感性判断，是易变的，每一 次去看，感觉都不同。经过全局、远见、抽象的理性逻辑思考下的决定，是相对 恒定的，因为多种变量，都经过了反复推敲。


    ### 6

    冲动是魔鬼。我们要用良好的思维和行为习惯抑制冲动，用理性战胜感性。

    如何在感性冲动决策前悬崖勒马？

    只有始终告诫自己：在重大决策前，该动脑的时候绝不动情。没有排除局部、短 视、直观感觉，没有经过全局、远见、抽象的理性逻辑考虑，都不要匆忙做决策。

    但是，现场很火爆，仿佛过了这个村就没有那个店，怎么办？好办！对自己说： 弱水三千，我取一瓢饮。永远是我们钱不够多、理性的神经不够强大，而不是投 资机会不够。
    **【完】**


    ## 为什么房子怕大不怕小？


    ### 童大焕—2019 年 8 月 27 日~28 日


    #### 1

    当大家还在土豪似地追逐房子的高大上的时候，社会家庭结构已经越来越迷你， 人们越来越追求摆脱家庭束缚、摆脱代为摩擦的个体自由。

    很多人还在追求农业时代几代同堂的大院子、大别墅、大房子，以为那是富裕和 奢华的象征，殊不知，这类户型和面积，正在被社会迅速抛弃。


    #### 2

    先看家庭结构和人口变迁。

    彭希哲、胡湛《当代中国家庭变迁与家庭政策重构》（2015 年 12 期《中国社会 科学》）披露：

    在计划生育、人口流动加剧等因素的多重作用下，我国家庭户数增长速度明显 高于人口增幅，家庭户规模在近 30 年来呈现出不断小型化的趋势。1982 年“三 普”时
    5 人及以上家庭户比重仍近半，但 1990 年以来 1～3 人户的比重快速上升，至 2010 年已达 65%。这使得 2010 年我国家庭户平均规模仅为 3.09
    人，比 1982 年少了 1.32 人。此外，家庭户规模的缩减趋势在城市和农村趋同，且收缩都比较迅速，曾经在农村常见的大家庭正在快速消失。**【大换评：那些说住公寓导致生育率下降的说法不攻自破，纯属胡说八道。他们把结果当原因。是生育率降低和家庭小型化导致人们更愿意选择城市公寓，而不是选择城市公寓导致人们生育率降低。】**

    “六普”资料显示，2010 年我国大陆有 60 岁和 65 岁及以上老年人的家庭数量分别为 1.23 亿户和 8803.6 万户，占全部家庭的 30.6%
    和 21.9%，比 2000 年有明显提升。“纯老家庭”（全部由老年人组成的家庭）目前已近 3000 万户，传统中少见的 3 人及以上的纯老家庭户也在不断增多，且主要集中在农村。

    虽然与子女同住仍是老年人居住安排的最主要类型，但其比例在近 20 年来持续降低，尤其是“多代同堂”的比重在 2000 年首次降到了半数以下，至 2010 年更降到了四成左右。与之相对应，老年人独立生活的家庭户比重却持续提高，2010
    年已超过四成。

    老年人独居现象不断增长的原因，一方面是生育水平持续下降导致少子化严重，减少了家庭人口；另一方面是住房条件改善，使独居成为可能，尤其较年轻和健康的老年人或老年夫妇更倾向于单独居住。“六普”资料也显示
    65～79 岁的低龄老年人中超过九成基本健康并具有生活自理能力，相对降低了他们对子女照料的依赖性；同时，工作流动的加快，子女外出求学、务工等迁移现象越来越多，也是老年独居的重要原因。


    **《厦门 70 年人口大数据！男性渐多女性渐少，目前单身户近 30%》（厦门日报 2019 年 8 月 22 日）也披露：**

    从 1953 年开始的第一次人口普查到 2010 年的第六次人口普查，厦门市的家庭户规模分别为 4.46 人、5.12 人、4.65 人、4.05 人、2.94
    人、2.42 人。

    随着二孩政策的实施，2018 年厦门家庭户规模为 2.62 人，比 2010 年略有提高。

    目前来看，“两口、三口之家”是现代家庭的主流结构，2018 年厦门全市 2-3 人户占所有家庭户的 44.4%，单身户占比也高达 29.6%。


    #### 3

    三代同堂以上大家庭的式微，两代同堂的核心家庭乃至一口之家成为主流，将使未来城市人口和住房户型结构，发生深刻的、革命性的、不可逆的变化！

    一些人还在沉醉于“大别墅，有游泳池，有健身房，有大草坪，家里还请了三个菲佣，一个专门照顾老人，一个专门照顾孩子，还有一个负责家里的杂事儿，那才是高境界啊”的时候，不知道这样的房子，十年后就有可能迅速成为食之无味、弃之可惜，租不出去，又卖不掉的鸡肋。

    因为，随着老一辈（有可能就是买别墅的这一代）老去，儿女们外出上学、就业，类似 的房子住起来变得非常空旷，而打理修整，则变得非常昂贵和麻烦。

    以后，人工会越来越贵，即使家务机器人越来越多，也终归还要人去使用它们。如果类似的大房子，将来只住着一对越来越老的夫妻俩，那绝对是负担，而不是享受。

    即使有一些人，人虽少，但喜欢住着面积阔大的大平层，也即使他们请得起保姆，付得起昂贵的物业费取暖费，很多人的“气场”也压不住过于宽大的房子的空旷与落寞，容易生病。一些人视之为“风水不好”，实际上是房子过大不适宜居住。

    随着大城市房价不断走高，以及家庭越来越小型化，大院子、大房子、大别墅渐行渐远。取而代之的，是适合四口之家、三口之家、两口之家甚至一口之家的紧凑 型舒适型小户型；客厅逐渐变小，社交日益转移到外面越来越丰富的公共空间；厨房也逐渐变小，只需满足比较简单的一日三餐甚至一日一餐（其它一到两餐
    都在单位或外面解决）。人均住房面积也不是越大越好，而是二十平米不嫌小，三五十平米已够富饶。

    可以预见，未来 30 年，绝大多数特大、超大城市住房香港化、户型迷你化，是我们今天就可以看见的大趋势。今天很多人看不上小户型，会成为明天大家争相追逐的宠儿；今天很多人追逐的大户型豪宅、大别墅，明天会成为社会的弃儿。今天某个房产投资流派一味看到单价便宜便极力推崇的“老破大”投资法，除了用于打隔断出租有可能获得较高出租收益之外，涨幅可能只能“呵呵”。


    #### 4

    最后讲一个故事，摘自包邮区《中国户型简史》（2019 年 8 月 26 日，文章后半部分是广告），看一看我们过去的城市房子有多大，想一想未来我们的房子是否需要今天这么大。

    1978 年 10 月的一天，总设计师来到北京前门三大街住宅工地视察。

    这是唐山大地震后北京兴建的第一个住宅群。这批新房的户型，和香港的“鸽子笼”楼房差不多——大的 14 平米，小的 9 平米，卫生间只有 1 平米多一点。

    总设计师看完房型后，略带遗憾地表示：层高能不能降低一些，把面积搞得大一些？

    他随行的女儿玩笑说：爸爸，你不能因为自己的个子矮，也让房子变矮。

    彼时，国家刚从十年动乱走出来，住宅欠账太多。别说对美好生活的向往，基本的居住需求，国家都满足了。1949 年北京人均住宅面积是 4.9 平方米。到了 1976
    年，反而不是 4 平方米。

    为了建前三门大街住宅楼，当时抽调了 1 万名工人、45 台起重机，堪称举国家之力。香港地产商霍英东来到北京，这一幕他看在眼里：在香港，倾家荡产也盖不起这楼。

    按照老人家的建议，建筑师为前三门大街住宅楼设计了新的户型。层高 2.53 米，每户面积增加 1.5 平方米，预算成本反而下降 77 元。

    后来，有学者点评说，总设计师才是中国商品房第一位户型设计师。

    在那个公共浴室一统江湖的年代，总设计师甚至提出，希望今后的住宅能安装沐浴设施，让老百姓能在家里洗上热水澡。

    当时国内大中城市的主流户型，不管是一室还是二室，所有房间的功能都很专一：睡觉。【完】


    ## 土地垄断破局 楼市要变天了吗？


    童大焕—2019 年 8 月 28 日星期三


    ### 1

    2019 年 8 月 26 日，土地管理法修正案通过！在此之前，土地管理法已经经过了 1988 年、1998 年和 2004 年三次修改，而 2004 年之后的
    15 年，我们一直没有再修改过，直到现在这才进行第四次修改。

    本次修法的最大亮点是：集体经营性建设用地不经过国家征收可以直接入市！具体表述为：农村集体建设用地在符合规划、依法登记，并经三分之二以上集体经济组织成员同意的情况下，可以通过出让、出租等方式交由农村集体经济组织以外的单位或个人直接使用，同时使用者在取得农村集体建设用地之后还可以通过转让、互换、抵押的方式进行再次转让。

    这一点，被认为是打破政府垄断供地的先声。


    ### 2

    人们一直认为，政府垄断土地供应是高房价的根本原因，城市大量小产权房，房价不到商品房的一半，有的甚至只有三分之一、四分之一。因此，土地垄断破局，将给楼市带来深刻影响。

    果真如此吗？未必！

    首先，诚如全国人大常委会法工委经济法室副主任杨合庆表示，集体经营性建设用地入市，首先入市的土地要符合规划，规划必须是工业或者商业等经营性用途。第二，入市必须经过依法登记。第三，它要在每年的土地利用年度计划中作出安排。另外，即使获得了集体经营性建设用地的使用权之后，土地权利人也要按原来规划的用途来使用土地。

    也就是说，对于集体经营性建设用地，脱离不了“政府计划”，规划、登记、年度计划、用途限制四个方面，就牢牢控制在了政府手里，想和政府垄断的住宅用地供应形成竞争，门都没有。


    ### 3

    进入租赁市场可以吧？

    未来集体建设用地可能先从租房市场入手进入市场，目前全国已经有 18 个城市准备利用集体建设用地建设租赁住房试点。有利于增加租赁住房的供给，进而平抑城市房租。

    但是深圳、北京等地都有占市场总量比重非常高【三分之一甚至更多】的农村集体土地、农民宅基地直接建房入市的小产权房出租甚至买卖。它们可以成为新移民的“落脚的城市”，有利于城郊和城中村农民加快“城市化自我发展”的进程，也有利于新移民以更低成本进入城市。

    但实践证明，它们对整个商品房市场的影响非常小。

    尤其是，集体土地入市的房屋，有可能在金融属性、交易自由等方面受到一定程度的限制，所以跟普通商品房市场，会是两个不完全相同的市场。彼此之间，可能在一定程度上形成“井水不犯河水”的关系。


    ### 4

    特别要提醒的是，一些人以为中国房地产要走新加坡模式，房住不炒，大部分人住公租房。包括用农村集体土地入市，建大量公租房。

    但请一定要知道一个基本的算术题：一，政府的能力是有限的，况且它自身还靠着土地财政呢；二，所有保障性住房，一定是由商品房来补贴的，保障房越多，商品房越贵，香港和新加坡即是证明；三，购买此类住房的，相比于用同样的钱购买商品房的，前者全是亏的，几乎无一例外。市场才有最好的回报，商品房才是亲爹娘。

    自 1965 年建团 30 年后，新加坡居民住房自有率就已达到 90%。2005 年，新加坡人均住宅面积达到 25 平方米，有 80%以上的新加坡公民住进了政府组屋。然而，新加坡的私有住宅价格却是年年攀升！据国际物业顾问世邦魏理仕（CBRE）的《全球生活报告》显示，新加坡以
    87 万 4400 美元的平均房价排名全球第二；仅次于均价为 120 万美元的香港。（SingPlus《新加坡蝉联世界房价排名第二，这届年轻人要怎么活？！》新加坡直通车
    2019 年 4 月 13 日）

