    答：我们今天的很多困局，陈志武在 2009 年《中国企业家》10 月期《从 2049 年看中国》已经预见，比如外贸增长乏力，国进民/退，土地财政尾声地方政府被迫转为税收财政，导致强化征税（大焕：会加剧企业家群体的失望和悲观情绪甚至抽逃资金）等。


    也就是说，今天的困境是必然的，符合我们国家多年来选择的发展路径下，经济发展的自身逻辑与规律。


    当然，这几年叠加了很多事情，使困局更困，比如毛衣战。


    但也还有很多本不该发生的事情，比如私企退场论，比如一刀切的环保、拆违和城乡整治，都使原本需要转型的经济更加雪上加霜。


    在这个背景之下，我坚持多年来坚持的观点：中国几乎所有产能都是过剩的，房地产整体也是严重过剩的，甚至比其它产能过剩更严重，只不过因为房地产是不动产，所以不能实现空间流动和转移，因此将长期存在“局部严重短缺，整体严重过剩”的局面。


    因为还有严重短缺，因为还有人口加速度集聚，所以此番转型，还得依赖或局部依赖房地产。而中国经济要想转型成功，也必须依赖高密度大城市化带来的服务业转型。这个过程，也离不开房地产。


    【后记：摩根士丹利预测，到 2030 年，中国的城镇化率将从目前的 60%上升到 75%，届时将新增 2.2 亿城市居民。全要素生产率的年复合增长率将保持在
    1.6%(2014-2018 年为 1.9%)，劳动生产率将比目前水平提高 80%。55%的劳动生产率增长将来自智慧超级城市的集聚效应、城市的迁移，5%来自土地改革和智慧农业支撑下的农业现代化。中国将步入高收入水平，人均年收入翻一番，从当前的
    9450 美元增至 2030 年的 17800 美元。大焕评：摩根士丹利没有看到中国目前的将近 60%城镇化率是虚的，2.8 亿农民工的绝大多数最多在县城买房，人却在省会以上城市打工，没有真正完成向大城市的集聚。所以我一直提醒大家不要过于注重数字，大数据无法给我们指明未来，一定要经人——尤其是真正专业的人的加工分析，一定要有大一点的全局理性视野，知道城市化的方向，才有房产投资的未来。古人说，不谋全局者，不足以谋一域也！】


    当然有关方面投鼠忌器，当心重启房地产会带来房价失控，进而加剧金融风险。其中的分寸，任何人都不易掌握。这也是此番不敢在房产方面有大动作的原因。但因城施政的调整办法，相信会不断出台。


    深圳突降利好：对于深圳 144 平米以下的房产，从 2019 年 11 月 11 号开始，深圳将不再按照以前各区的豪宅线标准征收增值税。'
