    买房，自始至终首要关注的是房子背后的人：将来什么样的人人会来接你的盘？要懂得城市化发展变化的规律和逻辑，要懂得人口和家庭结构的变迁，要懂得房屋更新换代的方向。并不是简简单单守住所谓一二线城市，或者简简单单在相关区域寻找低价盘、低价房了事。没那么容易。


    好的投资一定有门槛：资金、限贷限贷、智力门槛，等等。尤其是智慧门槛和观念门槛最高，观念又往往由智慧决定。在楼市投资问题上，我们从来不等不靠，根本不必也不应该死守一两座城市，而是要像流水一样，自由流淌到我们的资金可以匹配得到的有价值区域，努力去够自己够得着的东西，一步一步上台阶。中国这么大，几百万亿元的房地产资产，怎么会没有地方可以投资呢？永远是我们的钱或者智慧太少，而不是投资机会太少。


    城市内部的差异，有时比城际差异还大。先讲一个远一点但很有趣的旧事：那一年五岳散人和郑褚打赌，散人说能够品得出大闸蟹是不是出自阳澄湖，郑褚说你能正确区分那我吧电脑键盘吃了。现场直播，结果散人的命中率还不如靠猜的命中率。它说明什么呢？说明一个事实：同一个湖中个体与个体的差异，比不同湖之间群体的差异还要大得多。如古人说的龙生九子九子各不同。城市化发展也是这样的，城市内部差异有时比城际差异还大。为什么很多人感觉越买越困惑，原因多在于此。有些人死抱住某些城市不放，也是进入同类误区。


    导致这种差距逐渐拉大的原因，不是简单的板块轮动或波段与时机说可以解释的，具体的原因分析和对策，就留待以后分析给学员们听吧。


