- pgno: 113
  md: '# 第四章 寒门子弟更会管理企业


    作为寒门，起初只有自己，那么我们如何来搭戏台子唱戏呢？


    1、 如何搭建自己团队


    创业可以自己单干，也可以寻找创业团队，和别人一起合伙。一个人单干往往没有一个团队合作那么有创建性，因为一个人的力量毕竟是有限的，而一个团队则可以干出更大的业绩来。下面，我们来看看如何组建一个创业团队。


    求令人信服的创业项目。创建团队，首先必须有一个令人折服的项目，哪怕短期内无法盈利，但从长期来看还是不错的项且，否则，谈何创业？


    寻求志同道合的合伙人。只有找到愿意跟你一起创业的合伙人，才能让团队有绵绵不断的动力，遇到困难能够一起面对，一起分析，一起解决，不断完善工作体系。'
  merge: -1
  img_proc: true
- pgno: 114
  md: '确定团队的领导核心。群龙不能无首，再好的团队都必须要有有一个领头羊，一个具备睿智与敏锐洞察力的领导者，这样才能让团队在努力过程中不至于跑偏方向。


    成员各有所长。要想成功组建一个创业团队，最好是要求各成员能各有所长，各有优势和长处，能做到优势互补，相辅相成。成员认可自己。要想成功组建一个创业团队，各成员都应该有激情，有自信，坚信自己可以做到，可以成功，只有大家均能认可自己，才有成功的机会。大家分工明确。一个好的团队，必须是一个分工明确的团队，每个人都有用处，每个人都能发光，所以要想成功组建一个创业团队，就必须要进行好人员工作分工，让大家都有事干。


    明确团队的奋斗目标。做任何事情，都必须要有明确的目标，不能碌碌无为，更不能迷失努力奋斗的方向，明确的目标，是让整个团队凝聚在一起的基础，不可缺少。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '端正团队的工作态度。工作就是工作，必须要有认真工作的态度，由于创业初期，体制还不够完善，端正态度就显得尤为重要，不可三天打鱼两天晒网。


    签订合同。既然是创业，就必须尽快做到扭亏为盈，让团队每个人都能从努力工作中得到应有的回报，那么，签订合同，确定股份，分红等等就需要在合同上体现，这才是整个团队运作下去的根本。


    组建创业团队首先要有一个让人觉得可行的创业的内容，其次要寻找和自已有着相同目标的人，并且一定要确定谁是这个团队的领导人，大家以这个领导人的意见为主要指导意见，一起围绕着他的要求和目标来做事，才可以凝聚成团，不会像一盘散沙。


    # 2、如何管理好员工


    在任何公司中都会有管理者，他们可以引导基层员工更好的协调工作等，但是管理者自已没有做好的话，容易导致'
  merge: -1
  img_proc: true
- pgno: 116
  md: '下面的员工出现异心，实际上，管理本来就是一门艺术，这里来说说该如何管理好员工吧。


    +   1. 任何时候及场合，皆不能有“我认为…”、“我想…”、“我感觉…”等而予以乱猜、乱疑，应有事就有事、无事就无事。


    +   2. 任何评价也都应有事例为证，杜绝“大概”、“好像”、“可能是…”等主观臆测性思维与习惯！


    +   3. 只要出发点是為了自己变好，就不能在乎别人对自己说话的语气、甚至声音的大小等。(不能“抓住”别人说话语气太重、或声音太大等“理由”而产生不良情绪。应将同事间善意的批评与指导等视为一种“相互促进”来虚心接受!


    +   4. 工作进程中，当有同事(含上级)询问时，应将此询问视为一种“关心”而愉快地以实情相告(不能视为“啰嗦”、或“多管闲事”而心生不满)!'
  merge: -1
  img_proc: true
- pgno: 117
  md: '+   5. 将他人不同的意见视为一种“补充与完善”而予以尊重、并充分考量(不能视为他人是“不支持”、甚至认为他人在于自己“唱对台戏”、或“好表现”等)!


    +   6. 意见不同时，各自站到对方角度上去重新思考(即“换位思考”)!


    +   7. “换位思考”还不能取得共识时，即心平气和地报请上级裁决!


    +   8. 对上级的裁决一时还不能理解与接受的，非安全原因则应先执行，事后可再予申诉(含向更上一级报告);


    +   9. 切实以“我们是一家人——是共一个‘父母’的…”观念来予以工作(含日常沟通与协调)!(这“共同的父母”就是“公司”!)


    +   10. 接受任务时最好复述一篇，以明确自己是否全部理解和领悟(当别人要求你复述时，是为了避免你出错，故更应愉快地述说)!'
  merge: -1
  img_proc: true
- pgno: 118
  md: '11. 自己有好办法可谓“好”，没有时能诚心按别人说的去做也是一种“好”!


    以上就是一些管理员工的建议和经验分享了，其实在管理员工的时候，除了要遵循一些公司规章制度外，也需要通一点人情，这样会更服众一点，就像执法者一样，会酌情考虑一些其他情况来定罚。


    企业管理这方面我们不作为重点，毕竟寒门的自己来谈啥企业管理呀！首先要管理好自己呀，企业管理太精髓的东西还是主要长篇大论的，一个小的企业还是人情占大多数，制度之外不乏人情呀！'
  merge: -1
  img_proc: true
- pgno: 119
  md: '# 第五章 对抗社会灾难


    对于大多数上班的人而言，春节假期延后，让我们工作后难得的过了个寒假。宅在家里看看电视剧，打打游戏就过去了。然而对于很多创业者而言，这个春节真的特别难熬...不能上班，公司没有了收入不说;员工的工资，得照发;场地的房租，得照交吧;银行的贷款利息，得照还吧。不少人都在盘算，自己的公司到底能撑
    1 个月还是能撑 3 个月。


    特别是培训和旅游行业：除了员工工资和场地租金以外，客户的退款有可能会是压垮这些中小企业的最后一根稻草。


    对于制造业而言，很多小的企业主一个月的开支就在 100 多万。客户没有订单，工人不来上班，这些开支可是一分都少不了。当然大家都觉得生产口罩的要挣钱，那是你不知道原材料有多贵！你敢下那么大的赌注吗？


    餐饮行业就更不用说了。这个领域很多人都是拿 10 年的积蓄，赌上了全家人的希望。


    对于房产投资者，春节前装修好了，等着过年赚它一笔，结果没想到不仅没赚反而亏了，年后大概率只能背上自己的'
  merge: -1
  img_proc: true
- pgno: 120
  md: '行囊出去打工。不仅是餐饮、培训、旅游这几个行业，其他行业也都有或多或少的影响。在这次疫情面前，没有谁可以置身事外，不受影响。


    疫情来袭，中小企业和创业者该如何应对？


    第一，现金流是最重要的生命线。


    创始人和一般的职业经理人最大的差异，并非技术能力，而是对企业经营的那种“节奏感”的把控，创始人更需要“知进退”。优秀的企业家就是能够把一手烂牌在好节奏中打赢，而有些人却把一手好牌打输。无论是商业经营中的经营性现金流，还是融资性现金流的补充，各位创业者都必须时刻有现金流思维，不要只盯着利润表，而是需要经常盯着现金流。


    2019年出现的大量爆雷的“独角兽”们，其实原因也非常简单，就是创业者的“欲望和能力之间的不匹配”而已。一旦出现极端情景，对公司和组织而言，尽快回笼一切可以回笼的现金、减少一切非必要的支出，保证在最差的情况下持续生存的能力。'
  merge: -1
  img_proc: true
- pgno: 121
  md: '第二、极端情景模拟分析，建立“剩者”的危机意识，以活下去为目标的长期风险观。


    企业和生命体非常相似，本质上生命都是在求存，而不是求真。活下去并不是一个想当然可以达到的最低目标，而是长期的绝对目标。越大越复杂的企业体也同样是在求生存，甚至比小企业更容易崩溃倒下。从足够长期往回看，活得长比一时赚得多更重要。做企业和人生一样都是在长跑。越基础的行业越是反脆弱的，越流行的行业往往是脆弱的。在危机来临初期，我们需要以最快的速度做情景模拟分析，看下最危险的变量发生时，我们的体系要如何调整和应对。在未来我们也需要一种“免死金牌”思维模式。在资源和资金充裕的时候，给自己模拟一种极端的情景和变量，比如灭顶之灾前可以去找帮助的某个人或可以紧急动用的某一笔钱。生死存亡之际还有预留的后手。


    第三、增加企业的冗余能力，主动理性试错，提升整体安全边际。'
  merge: -1
  img_proc: true
- pgno: 122
  md: 从风险管理的角度看，做企业有时不能算得“太精细”，越是精细有时抗风险能力越是弱，容易出系统性问题。因为我们假设所有要素都是能够理想化地按照规则运转。企业家不要追求自我想象的“最优解”，而要寻找基于底线思维的“基本解”，这也是增加企业冗余能力的概念。其实很多超级企业的现金储备比我们想象的大得多，比如据日本研究人员介绍，日本京瓷公司现金储备原则是在没有收入的情况下，可以支撑员工发三年工资。二级市场通常认为现金储备过多是缺乏投资能力的表现，但这是通常逻辑，从风险控制角度我们需要增加冗余能力，提升整体安全边际。此外，这几年有一种思维模型叫“第二曲线理论”，即选择在正面黑天鹅的领域中，理性积极地试错，控制损失成本。用最小试错的方式，不断增加自己在不确定性事件发生时获益的概率。试错本身也是一种冗余能力。在企业现金流充裕的前提下，用一小部分资金去验证几个全新的发展逻辑或赛道。一旦能够证明其商业模式，可以再投入大资金押注。巴菲特说：永远在自己的投资中保持对高风险的小额追逐。让自己避免出现在负面黑天
  merge: -1
  img_proc: true
- pgno: 123
  md: '鹅的事件中，同时又要想办法把自己挤到正面黑天鹅的收益当中。


    正合之道：也就是说把 80% 的资源投入到最安全的领域。


    奇胜之道：而把 20% 的资源投入到那些损失可能很低，但是带来的收益却无限的不对称性的事件当中，从而让我们能够对不确定性有更多的应对能力，甚至从中受益。


    第四、反思最核心能力和资源，计算重置能力。


    危机有时反而可以让我们快速看清楚事物更本质的东西，从而改变我们的认知，也是改变模式最佳的时机。平时大部分企业很难做“自杀式”模式转换，但极端现金流压力让我们可以反思最核心的竞争力和资源到底在哪里，如何维护住这些核心能力。重置能力和重置成本一般是我们大家不会去思考的维度，但在危机中恰恰是一个非常重要的思考点。在企业估值逻辑中，大部分时间我们用可比法以及
    DCF 现金流折现法，不要忘记重置成本法也是非常重要的一种估值思维。过去数年中投资人所提倡的独角兽概念，都是从所谓市值的'
  merge: -1
  img_proc: true
- pgno: 124
  md: '角度去描述企业的价值，但市值观念其实是非常有局限性的。价值往往只是共识机制的阶段性结果而已。而缺乏连续的有效定价产生的“估值”更加缺乏经济意义。去年很多创业者出现暴雷事件，某种程度上也是被泡沫式的市值观念给“危害了”。而重置思维能让创业者更加清晰地重新审视自己的底色，真正创造价值的是哪些要素和资源。


    # 第五、君子不立于危岩之下的思维模式。


    企业家应该避免那些低收益却暴露在巨大不确定性风险中的事情。如和不靠谱的企业互相担保就是一种情景。减少不利因素来降低脆弱性，是指减少自己暴露在致命风险当中的概率。在生活中避免暴露在负面黑天鹅事件当中，也就是尽量不让自己陷入到可能收益是有限的，但是付出的代价是非常高的领域当中。对于个人而言，尽量避免从事容易出大事的高危行业。对于企业而言，避免会导致覆灭的极大冒险，保证危机来时可以活下去。芒格曾说：要避免三种等价的危险，不要吸毒染上艾滋病、不要离婚和不要乱穿马路等。大'
  merge: -1
  img_proc: true
- pgno: 125
  md: '多数长期投资者取得的长期结果将更多地取决于致命败笔的数量及其程度，而不是制胜投资的伟大。反过来思考，我们应该增加对选择权的商业逻辑，即整体思路是确保下行风险的足额保护，增加上行的收益可能。这是我们发展的一种重要判断。


    一、注重现金流留存前提下的全面营销驱动增长，除非明确融资成功，烧钱获得的增长不可能持续。


    二、彻底节约费用，包括结构性的节约，树立全员成本控制意识。很多平台企业获得巨大融资后的结果往往是内部控制的彻底缺乏，企业内部腐败横行，完全缺乏成本控制意识。企业应该建立内控和内审机制。


    三、回归到战略思考，未来增长的来源到底是哪些因素，如重视投入战略资源到开发长期竞争力的新产品。


    四、建立上下游价值链和供应链的更紧密的战略关系，维护好整体价值链的生产效率和数据化，实现价值链数据共享和资源控制。可以预见到来的企业竞争更加是供应链的竞争，而不是简单的产品竞争。'
  merge: -1
  img_proc: true
- pgno: 126
  md: '五、目标愿景价值观的重新树立，重构长期的企业文化。文化和组织是走长路的核心要素，他们决定了长期主义的成长路径。


    任何一次萧条经济和危机，都是自我发展，超越对手的好机会。长期成功的企业更容易长于危机之中。


    危机越是严重，我们越是要坚忍不拔，无论如何也要闯过这道难关，重要的是要认识到“危机往往也是成长的机会”。优秀的企业就是常常通过危机和萧条这样一种逆境来谋取更大的发展。70年代的石油危机，80年代的日元升值危机，90年代的泡沫破裂的危机，2000年代
    IT 泡沫破裂的危机，2008年的全球金融危机，我们已经经历了各种各样的经济危机。


    其实越是在迷茫的时候，情绪波动的时候，我们需要拨开迷雾，思考如何更长期的价值“锚定”。优秀的企业家也可以通过本次大调整，重新思考核心价值，积极调整商业模式，不受各种浮躁价值观的影响，坚定的通过长期奋斗成就价值创造。'
  merge: -1
  img_proc: true
- pgno: 127
  md: '这次疫病危机对未来消费商业会带来哪些可能的变局?


    上次“非典”促使“实体商品”交易上翻 B2C 模式成功，而这次很可能使得“服务交易”进一步上翻到线上。阿里一定会整合集团内部支付、外卖和电商业务，形成更多交易场景、更高效流量分发。阿里和美团的服务在线化大战还需要静观其变。


    从品类方面看，清洁日化品类进一步需求提升，并且出现耗材产品的硬件化机会，增加消费者体验。


    养生保健类会迎来新机遇外，一些 ready to cook 的“半自助”品类会大大增加需求，这里跑出新品牌的概率很大。


    场景端的直播电商会成为商家运营标配。淘宝直播会致力于用户数增长，扶持商家自播，抖音则会从知识付费、在线娱乐(囧妈)找到突破。


    线下区域生鲜商超零售商其实都是地方政府的“宝贝”，在极端市场情况下，只有依靠支持本地零售商才能够真正解决民生需求问题。'
  merge: -1
  img_proc: true
- pgno: 128
  md: '过去高度依赖于购物中心红利的餐饮品牌们，经过本次灭顶之灾后，大家可能都会重新思考街店和社区模型店...


    万物之中，能够代表未来希望的事物往往是最美的。在《肖申克的救赎》有一句经典台词：“不要忘了，这个世界穿透一切高墙的东西，它就在我们的内心深处，那就是希望。”


    疫情不可怕，可怕的是我们把一切失败的原因归结于疫情，建造房屋可以抵御狼的入侵，但是抵御不了地震的破坏，所以这个世界上任何事物都不是完美的，同样思维密码和商业模式一样，都是时代更替的产物，同样小编也是这万事万物中的一粒尘埃！写到这里这本书籍也要给大家说再见了！整体来看，就是想用通俗易懂的解说来让大家明白一些道理和事物本质，但是不到位的地方或者未能全面剖析还请谅解！当然这本书也感谢前辈们提供的思路和商业思维以及给予我的启迪！


    最后祝愿每一个出身寒门的人实现质的飞跃！'
  merge: -1
  img_proc: true
