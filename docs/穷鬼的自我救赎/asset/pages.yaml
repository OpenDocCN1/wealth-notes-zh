- pgno: 52
  md: '那么除了技术以外，还有什幺呢？那就是共需呀！你的需要也就是我的需要！这就叫双向逆推思维！


    我们以前买一辆车，是自己的资产。而现在，像共享单车是当你需要用时才来用车。这也是一种新的商业模式。


    尽管大家对这些现象耳熟能详，也听过很多商业模式的课，但是对于商业模式还是既熟悉又陌生。因为当我们的企业在探讨、应用商业模式时，容易掉进坑里，这主要是由于大家对商业模式背后的一些核心问题、逻辑并不了解。对于商业模式为什幺这么做？商业模式为什幺好？它跟企业有关联？这些都不是了解。其实，对于商业模式，我们要关注以下问题：


    +   1. 商业模式是什幺？


    +   2. 商业模式能帮企业解决什幺问题？任何一个好方法，一定是能帮企业解决问题的。但是，不同的方法，能解决的问题不一样。'
