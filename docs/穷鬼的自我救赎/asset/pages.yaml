    从盈利模式来看，尽管在表面上“脑白金”、“黄金搭档”、“黄金酒”用的是传统的盈利模式而“征途”游戏采用“基础服务免费+道具收费”的模式，但实质上巨人是通过营销创新形成的产品服务新概念实现营收。从创新性来看，该商业模式创新之处在于巨人集团紧紧围绕消费者的消费习惯(如广告导向)、消费决策处境(如不知该买什么送礼)、消费心理(如追求爽快的娱乐感觉)、消费心态(如攀比)等实际需求，用全新的“营”与“销”的方式将实际品质不高的产品或服务赋予全新的概念，'
  merge: -1
  img_proc: true
- pgno: 111
  md: '并以较短的销售渠道、较宽的销售网络从侧翼迅速介入市场。


