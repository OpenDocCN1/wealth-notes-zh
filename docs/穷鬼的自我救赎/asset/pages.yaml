- pgno: 56
  md: '解析：通过这则广告我们要意识到这个广告看似满满的正能量呀！保护环境人人有责呀！这是什么？这是大爱无疆呀！哈哈当然还没有跨国界！然后呢就开始让你买机器，这就转变了商业模式升级版！不让你买产品，而是买制造产品的机器，我们透过现象看本质，你有一台机器放在家里，不就是一个小小的加工产吗？你听懂了吗？你既然是加工产就需要很多的原材料和技术支持呀！这个钱谁赚？你到这里懂了吗？


    我们书接上回，后来可口可乐开始研究这则广告，试图找些疏通来打败这个竞争对手。通过各种方式来羞辱这个对手，最终可口可乐的人发现，广告上把可口可乐的商标露了出来，这就构成了侵权，属于不正当竞争。于是可口可乐就起诉这家企业，结果这家企业竟然还股票大涨。


    这是因为小企业原本是在小范围出名，可口可乐这样的大公司一起诉，就成了大家茶余饭后的谈资。后来大家试用了产品，觉得还不错，就更加出名了。'
