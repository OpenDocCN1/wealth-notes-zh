- pgno: 10
  md: '# 第一章 代换思维改变你的身份


    # 一、等量代换思维


    每当我们提起等量代换想必大家首先想到是做数学题的解题方法吧，反正我是一个学渣，忘了是做几何证明题还是二次函数会用到了，这个时候我们要明白一个哲学辩证法：矛盾论，矛盾论告诉我们矛盾之间可以相互转化，毕竟社会在不断的的发展和变化，当然我们在此不谈论哲学，等有机会我会专门出一本关于唯物辩证法和商业思维的运用关系。


    那么这个时候就会有人说了，等量代换在商业思维上是个什么鬼呢？我也可以这么说，等量代换思维用来商业模式，应该还没有人讲过，那我这个小可爱算不算原创商业思维：等量代换呢？那么接下来，我们娓娓道来，等量代换我们用拆字法可以得到：等量、代换（替换），那就是把等量的东西在别的东西上替换掉。如果还没有明白，那我直接上案例：


    案例一： 大家都知道曹冲称象，有一次，吴国孙权送给曹操一只大象，曹操十分高兴。大象运到许昌那天，曹操带领文武百官和小儿子曹冲，一同去看。'
  merge: -1
  img_proc: true
- pgno: 11
  md: '曹操的人都没有见过大象。这大象又高又大，光说腿就有大殿的柱子那么粗，人走近去比一比，还够不到它的肚子。


    曹操对大家说:"这只大象真是大，可是到底有多重呢?你们哪个有办法称它一称?" 嘿!这么大家伙，可怎么称呢!大臣们都纷纷议论开了。


    一个说:"只有造一杆顶大的秤来称。"


    而另一个说:"这可要造多大一杆秤呀!再说，大象是活的，也没办法称呀!我看只有把它宰了，切成块儿称。"


    他的话刚说完，所有的人都哈哈大笑起来。有人说:"你这个办法可不行啊，为了称重量，就把大象活活地宰了，不可惜吗?"


    大臣们想了许多办法，一个个都行不通。可真叫人为难呀。


    这时，从人群里走出一个小孩，对曹操说:"父亲，我有个法儿，可以称大象。"'
  merge: -1
  img_proc: true
- pgno: 12
  md: '曹操一看，正是他最心爱的儿子曹冲，就笑着说:"你小小年纪，有什么法子?你倒说说，看有没有道理。"


    曹冲趴在曹操耳边，轻声地讲了起来。曹操一听连连叫好，吩咐左右立刻准备称象，然后对大臣们说:"走!咱们到河边看称象去!"


    众大臣跟随曹操来到河边。河里停着一只大船，曹冲叫人把象牵到船上，等船身稳定了，在船舷上齐水面的地方，刻了一条道道。再叫人把象牵到岸上来，把大大小小的石头，一块一块地往船上装，船身就一点儿一点儿往下沉。等船身沉到刚才刻的那条道道和水面一样齐了，曹冲就叫人停止装石头。


    大臣们睁大了眼睛，起先还摸不清是怎么回事，看到这里不由得连声称赞:"好办法!好办法!"现在谁都明白，只要把船里的石头都称一下，把重量加起来，就知道象有多重了。'
  merge: -1
  img_proc: true
- pgno: 13
  md: '曹操自然更加高兴了。他眯起眼睛看着儿子，又得意洋洋地望望大臣们，好像心里在说:"你们还不如我的这个小儿子聪明呢!"


    # 案例解析：同等重量物体空间位置代换


    案例二：接下来我们再举一个例子来加深印象：美国大发明家爱迪生有一 位数学基础相当好的助手叫阿普顿。有一次，爱迪生把一只电灯泡的玻璃壳交给阿普顿，要他计算一下灯泡的容积。阿普顿看着梨形的灯泡壳，思索了好久之后，画出了灯泡壳的剖视图、立体图，画出了一条条复杂的曲线，测量了一个个数据，列出了一道道算式。经过几个小时的紧张计算，还未得出结果。爱迪生看后很不同意。只见爱迪生在灯泡壳里装满水，再把水倒进量杯，不到一分钟，就把灯泡的容积"算"出来了。这里，爱迪生用倒入量杯里的水的体积代替了灯泡壳的容积，用的也是等量替换法。如果这个时候你能联想到初中物理题计算小木块沉入水中浮力的等量代换，那么你已经成功的
    get 到了等量代换精髓了。'
  merge: -1
  img_proc: true
- pgno: 14
  md: '当然等量代换即使你现在已经掌握，对于你来说只是空间代换，那么我们商业思维等量代换是什么代换？当然是升级版思维代换！换句话来说就是我们宁可要等量代换思维的草，不要等量代换空间的苗！


    那么商业中等量代换会运用到哪些具体方面呢？其实我们每个人都不想成为马云那样的商业帝国和伟人，那么等量代换来了！要想成为马云一样成就的商业位置，你必须代换掉他成功的所有条件，那么等量代换真的有用吗？我直接告诉你结果：拼多多创始人孙彤宇想必大家未必熟知，但是拼多多现在的地位和规模已经到了可以跟淘宝一论高下的重量级对手了！那么拼多多能够成功代换了什么？那就是淘宝的创始人之一孙彤宇呀！


    蚂蚁金服集团董事长彭蕾的丈夫孙彤宇，在阿里巴巴历史上有着举足轻重的作用，不仅因为他曾是仅次于马云的二号人物，他也是淘宝网的创始人。孙彤宇在阿里巴巴的工号是"2",马云的是"1",孙彤宇在阿里的花名是"财神".马云一直都'
  merge: -1
  img_proc: true
- pgno: 15
  md: '对孙彤宇超强的执行能力赞口不绝。阿里巴巴最早盈利也是在孙彤宇的销售团队实现的。


    这下大家知道了吧！等量代换商业思维是可行的!但是对于我们最底层的人来说，或者企业规模还比较小的总裁来说，这样的替换会成功吗？答案是否定的！如果万无一失那么等量代换思维就会代换成资本较量！


