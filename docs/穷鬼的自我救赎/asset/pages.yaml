  md: '的任务，用 IT 和互联网技术将盈利水平无限放大，成为“鼠标+水泥”模式的典范。


    # 中国十大成功商业模式：招商银行


    从产业价值链定位来看，招商银行抓住信息技术与传统金融业相结合的机遇，以“金融电子化”建立服务品牌，先后推出国内第一张基于客户号管理的银行借记卡“一卡通”、国内第一家网上银行“一网通”、国内第一张符合国际标准的双币信用卡、国内首个面向高端客户理财产品的金葵花理财、率先在国内推出私人银行服务及跨银行现金管理等业务。从盈利模式及盈利能力来看，招商银行通过扩大服务面、延伸服务线取得多方面的利息收入与增值收入。从创新性来看，该商业模式之创新之处在于，招商银行将信息技术引入金融业的发展，并以“创新、领先、因你而变”不断推出新服务，引领金融业的发展。


    # 中国十大成功商业模式：苏宁电器'
