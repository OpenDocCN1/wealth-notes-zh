  md: '甚至还有一部分人，本科毕业后，还没分清上学和学习的区别。


    那么中国究竟有哪些成功的商业模式值得我们去学习和参考呢，那就来了解一下：


    # 三、中国十大成功商业模式


    成功商业模式的主要特征包括如下三个方面：首先，成功的商业模式是基于产业价值链的分解所形成的。其次，成功的商业模式有独特的、持久的盈利模式。最后，成功的商业模式应该具有一定的原创性或较强的创新性。


    中国十大成功商业模式：腾讯


    从产业价值链定位来看，腾讯抓住互联网对人们生活方式的改变形成新的业态为机遇，通过建立中国规模最大的网络社区“为用户提供一站式在线生活服务”，通过影响人们的生活方式嵌入主营业务。从盈利模式来看，腾讯在一个巨大的便捷沟通平台上影响和改变了数以亿计网民的沟通方式和生活习惯，并借助这种影响嵌入各类增值服务，如开展了'
  merge: -1
  img_proc: true
- pgno: 105
  md: '以移动 QQ 为中心的无线短信服务、以腾讯 QQ 为中心的个性化增值业务、商用即时通信软件业务、基于腾讯 QQ 品牌的广告服务与品牌授权业务等。从创新性来看，该商业模式的创新之处在于腾讯借互联网对人们生活方式改变之力切入市场，通过免费的方式提供基础服务而将增值服务作为价值输出和盈利来源的实现方式。


    # 中国十大成功商业模式：阿里巴巴


    从产业价值链定位来看，阿里巴巴抓住互联网与企业营销相结合的机遇，将电子商务业务主要集中于 B2B 的信息流，为全球所有人创造便捷的网上交易渠道。从盈利模式来看，阿里巴巴通过在自己的网站上向国内外供应商提供展示空间以换取固定报酬，将展示空间的信息流转变为强大的收入流并强调增值服务。从创新性来看，该商业模式的创新之处在于阿里巴巴敏锐地看到了中国中小企业对国内外买家渠道和更广客户群的巨大需求，通过互联网向客户提供接触买家的渠道和接触到范围更广的客户群的机会，使中小企业降低对在市场中占主导地位的客户的依赖，减少了这些企业因'
  merge: -1
  img_proc: true
- pgno: 106
  md: '参加各种贸易展会、推介会所需花费的成本，并从互联网中打开获益的渠道。


    # 中国十大成功商业模式：携程


    从产业价值链定位来看，携程抓住互联网与传统旅游行业相结合的机遇，力求扮演航空公司和酒店之间“渠道商”角色，以发放会员卡吸纳目标商务客户、依赖庞大的电话呼叫中心作预定服务等方式将机票、酒店预订、度假预订、商旅管理、特约商户及旅游资讯在内的全方位旅行服务作为核心业务。从盈利模式来看，携程通过与全国各地和众多酒店、各大航空公司合作，以规模采购从上游大量降低成本一一让其把空置的客房按一个极低的折扣价交由携程处理或拿到比大众低的折扣机票，同时通过下游消费者在携程网上订客房、订机票积累不断增长的客流。随着客流的逐渐增多，携程同酒店和航空公司的议价能力越强其成本就越低，客流进而会继续增长，最终形成良性发展的盈利模式。从创新性来看，该商业模式的创新之处在于携程立足于传统旅行服务公司的盈利模式，主要是通过“互联网+呼叫中心”完成一个中介'
  merge: -1
  img_proc: true
