- pgno: 87
  md: '# 一是：网络创业


    有效利用现成的网络资源，网络创业主要有两种形式：网上开店，在网上注册成立网络商店;网上加盟，以某个电子商务网站门店的形式经营，利用母体网站的货源和销售渠道。当然还有自媒体创业、知识付费等等这个面太广太广啦，网络遍地是黄金呀！


    # 二是：加盟创业


    分享品牌金矿，分享经营诀窍，分享资源支持，采取直营、委托加盟、特许加盟等形式连锁加盟，投资金额根据商品种类、店铺要求、加盟方式、技术设备的不同而不同。当然现在大家加盟之前一定要考察和研究，在这多说几句，现在这帮人已经利用双向逆推思我来挣加盟商的钱了，那就是我排队给你看哈哈！你秒懂了吗？


    # 三是：兼职创业'
