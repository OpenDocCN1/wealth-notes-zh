  md: '候仅仅是创业者提出的一个小小的思路，就会引来众多投资人的投资，再加上网络营销的宣传和推广，进行着催化的作用。当然，轻创业绝对不止互联网+其他领域的潮流，还会有更多专业的细分和投资大环境哦。


