  md: '二：自媒体做广告赚钱法，自媒体很火，很多人都不知道如何赚钱。如果想要通过这个做广告赚钱，那么前期自己已经成为了一个中等的自媒体人，毕竟做广告需要更高的流量和粉丝数量，。由于我们天天都在搞自媒体爆贴，我们做任何项目，都需要大量的流量。当然如果你想获得百万流量，就去找别人爆了几百万浏览量的帖子，天天模仿别人的图片，模仿别人的写作风格。最终就找了
