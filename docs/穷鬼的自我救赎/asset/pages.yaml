- pgno: 89
  md: '即利用各种商业创业大赛，获得资金提供平台，如Yahoo、Netscape等企业都是从商业竞赛中脱颖而出的，因此也被形象地称为创业孵化器。如清华大学王科、邱虹云等组建的视美乐公司、上海交大罗水权、王虎等创建的上海捷鹏等。


    # 六是：概念创业


    即凭借创意、点子、想法创业。当然，这些创业概念必须标新立异，至少在打算进入的行业或领域是个创举，只有这样，才能抢占市场先机，才能吸引风险投资商的眼球。同时，这些超常规的想法还必须具有可操作性，而非天方夜谭。这个时候我看了看帅气的自己哈哈！


