  img_proc: true
- pgno: 53
  md: '+   3. 如何描述企业商业模式？


    +   4. 企业商业模式好不好？怎么看一个企业商业模式的优劣？


    +   5. 如何优化和设计企业商业模式？


    +   6. 企业商业模式与企业定位、股权、文化有什么关系？


    这些都是关于商业模式我们需要了解的内容。


    # 案例一：与可口可乐竞争的爱情情仇


    可口可乐是美国梦的代表，我们中国也希望打败可口可乐。过去好几年都涌现了许多可乐企业，比如：非常可乐、纷煌可乐等。但最终总体来说没有一个做得很成功的。并不是我们的资本不够，也并不是我们的人员不够，也并不是我们的政策支持不够，我们这里直接揭晓答案：中国的这些想打败可口可乐的企业只是简单的复制可口可乐，也就是偷梁换柱思维，当然也有等量代换思维在里面，压根就是在模仿可口可乐的一举一动，当然肯定会有一定的效果，但是静下'
  merge: -1
  img_proc: true
- pgno: 54
  md: '心我们想想，你能干得过原版吗？答案肯定是不能的，因为你只是潜在的模仿外表，其本质你是捉摸不透的！所以这个世界只有一个王健林，也只有一个马云呀！所以说各个程序都是简单复制的，很容易崩塌！这也就是为什么会失败的原因所在了！


    然而，在可口可乐本土美国，有一家以色列公司 Soda Stream 把可口可乐打得很难受。接下来我们来解开这个神秘的面纱，究竟他做了那些不避常规的事情！


    这家企业这样做：弄来一台机器，旁边有个水瓶，还有苏打粉。当需要做汽水的时候，按一个按钮，苏打粉就会和水发生化学反应变成汽水。每个人喝汽水的口味都不一样，有的喜欢柠檬味，有的喜欢草莓味。这台机器里还有浓缩液，能够根据你的需求个性化定制，调成不同的味道。这家公司做得很成功，后来在美国纳斯达克上市了。


    解析：通过这个过程，你想到了什么？那就是等量代换思维呀！把制作可口可乐的员工替换成了客户！让客户来更'
