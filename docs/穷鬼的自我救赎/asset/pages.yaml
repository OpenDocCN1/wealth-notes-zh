  md: '者的青睐方式。这也是合伙人的雏形，不过这个模式还是不长久的额，这里面到处都是人情世故哈哈。


    # 一、什么是轻创业？


    简单来说，轻创业就是利用低成本进行创业，压力小。对于轻创业，目前还没有具体的描述来定义它，但是一般都是借助互联网去创业。那么轻创业模式有哪些优势呢？


    # 二、轻创业模式的优势


    +   1. 投资低


    如今的轻创业可以从某个领域上的一个细分点来进行创业，和以往需要向亲朋好友借钱的创业方式截然不同。最开始有轻创业这个概念是通过兼职产生的。像是知识分销、淘宝客、小说分享等模式，通过分享的方式来创业。


    +   2. 零库存


    轻创业也意味着零库存。虽然说轻创业是按照需制作来调拨产品，但是在背后却有着强大的分工和大合作。有时'
  merge: -1
  img_proc: true
