  md: '如果我们有 20 名员工，每名员工只需要做 50 万，如果每名员工有 10 名客户。那么每位客户只需要完成 5 万就可达成目标。


    # 第三种方法：


    如果我们有 100 名员工，我们有 100 名客户，那么我们可以直接计算得到每位客户需要做到单价 10 万元，但是这个时候我们可以开始将条件增量，你明白了吗？那就是增加员工和增加客户！从而达到一个双倍递增！这个是苏引华以前讲解过得一种方法其实就是分解法，当然他是从员工、客户、企业三者为一体，相互制约。相辅相成来解析的，也是值得我们学习的。


    就像电影中要夺掉一个阵地一样，不惜任何代价要完成任务，那就用逆推的方式帮你达成，无论你学到的是思路还是具体步骤，必须马上能够套用，一切为你所用，否则你学习再多顶级的思维和技术都没用。'
