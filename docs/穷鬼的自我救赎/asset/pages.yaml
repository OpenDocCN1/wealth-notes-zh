- pgno: 16
  md: '死海效应：是指好员工像死海的水一样蒸发掉，然后死海盐度就变得很高，正常生物不容易存活。


    公司发展到一定阶段，能力强的员工容易离职，因为对公司内愚蠢的行为的容忍度不高，也容易找到好工作；能力差的员工倾向于留着不走，也不太好找工作，年头久了就变中高层了，这种现象叫做死海效应。


