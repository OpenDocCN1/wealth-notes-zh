    SAP 系统与 B2B 供应链项目，通过降低整个供应链体系运做成本，库存储备并为客户提高更好的服务这一“节流+开源”的方式实现营收。从创新性来看，该商业模式的创新之处在于，苏宁电器以家电连锁的方式加强对市场后端的控制力，并以此为基础加强向上游制造环节的渗透，使零售与制造以业务伙伴方式合作从而提高整个供应链的效率，进而打通整个产业价值链以谋求更高价值回报。


