- pgno: 57
  md: '解析：这波广告宣传可谓是千古绝唱呀！说白了就是不管是什么原因和事情，这个行业的龙头老大跟我打官司，潜台词不就是说我是第二吗？看懂了吗？这一一下子地位不就立马上升了吗？地位上升了，其他的还会隐藏吗？


    可口可乐只好不起诉了，改成私下收购，然而这家企业不接受收购。这个消息一经传出，企业的名气更大了，股票又是大涨。


    这又给了我们一些很好地思维启示：


    +   1、 中国各种饮料（如：凉茶、绿茶、）都做得不错，但是唯独可乐做不起来。这是因为中国做的可乐在与可口可乐竞争时，使用的都是一样的商业模式。说白了就是看着一样，但是就是有色差！就是有口味差！


    一样的商业模式，意味着接触的都是同样的利益相关方。当你还是小企业，用大公司最熟悉、最擅长的套路来竞争是很难赢的。毕竟你替换的只是商业模式，而不是我们前期所说'
  merge: -1
