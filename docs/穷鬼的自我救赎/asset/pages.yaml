- pgno: 34
  md: 关于商业思维目前我们就先展开等量代换思维和偷梁换柱思维以及逆推思维，当前前两个思维容易混绕，其实没有必要分的那么清楚，在哲学唯物辩证法上，任何事物之间都是必然普遍联系的，也都是相辅相成的，没有孤立的事物，所以这也是创建团队的重要性呀！就连皇帝都称自己为孤，这个时候我就在想你孤个毛线呀！最起码大殿上还有一群人听你瞎白活呢，咱们寒门呢？咱们出生寒门，只有自己相信自己！只有自己依靠自己！当然我们后期还需要解读更多的商业思维密码，例如：顶级思维、高级思维、终极思维、代入思维、换算思维等等，当然看似这些思维很类似，其实万物本质皆源于悟心，也就是心有所思，所以思维肯定类比。我们开篇曾经说过。万事万物在相同条件下却造就出了不同的结构或者结果，是每个人思维出现了不同的排列，只是这个社会对大家的效果进行了优化组合，所以一龙生九子，九子各不同，但是都是同一个龙妈！是不是同一个爸爸，后期影响不影响孩子们的思维，这个我还真不知道哈哈！
