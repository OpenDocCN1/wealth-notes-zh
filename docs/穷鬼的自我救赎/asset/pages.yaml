- pgno: 61
  md: '# ## 二、  商业模式的交易结构


    大家要深知好的商业模式，交易结构很重要。


    商业模式交易一般有以下两个特征：


    一是企业自身很强大，焦点企业具备可持续盈利的能力；


    二是与企业合作的利益相关者实力都很强。


    上述两个特征看到了你会想到什么？当然就是最强对标呀！发展要找优秀于自己的合伙人，垃圾合伙人只会给你带来有  害垃圾哈哈！直接给你垃圾分类！


    同时，商业模式的创新会带来两个结果：


    一是带来指数级增长，增长速度会更快；就是陡增！


    二是黑洞效应。能把原来旧模式里的利益相关者都吸引到新的模式。比如：当滴滴兴起了，以前的黑车司机就不存在了，当滴滴兴起了，打车呼叫团队没有了。印象最深刻的就是我  在北京市怀柔区的时候，那个时候出门打车的话，是需要给'
  merge: -1
  img_proc: true
- pgno: 62
  md: '6 元车队打电话，然后他们会给你呼叫司机，然后再打电话告诉你车牌号等等，现在这个团队已经没有了！被新模式转化了。滴滴最初开始做推广的时候，有的司机真是没少赚呀！中国人最喜欢干薅羊毛的事情哈哈！你还知道那个漏洞吗？新的模式能够对旧模式实现替代。整个连接在一起，就能实现行业的升级。


    因此，商业模式，就是通过设计焦点企业与利益相关者的交易结构，实现价值提升、成本节约、增长加速三个方向。每个人在设计商业模式时是有路径的。评价一个商业模式好不好，就是在改正的过程中，你所修改的动作能不能让价值提升，成本节约，增长加速。


    好的商业模式是能实现以上三个方向的，不是为了创新而创新。我们真正要做的是，促进企业发展升级的商业模式创新。改动不等于改革！这个时候就要啰嗦几句中国的教育改革了哈哈！中高考那是年年改呀！


    商业模式交易结构具体包括以下几点：'
  merge: -1
  img_proc: true
- pgno: 63
  md: '+   1. 跟谁交易？也就是利益相关者是谁？包括客户、伙伴、竞争对手等。


    +   2. 交易什么？你的活动环节和资源能力是什么？


    +   3. 怎么交易？责、权、利配置。


    +   4. 如何定价？收入、支出、时点。


    当我们在看企业商业模式时，基本是这么一个框架：


    原有的模式如何走向新的模式？


    在转换中，一般是为了实现价值提升、成本节约、增长加速这 3 个目标点。同时，任何企业的变化不止是自己企业的变化，还要带动一群合作伙伴的变化。此外，当你进行转变时，你也会做出许多投入。当你转变时，你的合作伙伴会评估机会成本，只有选择最优，才会与你的企业一起走向新模式。


    案例：'
  merge: -1
  img_proc: true
- pgno: 64
  md: '这几年数字影院代表着未来，但是在前几年，数字影院还不够普及。这是因为原有的影院要走向数据影院，需要投入高昂的设备和各种装修。后来一些大院线万达、中影等一起弄了一个基金会，将资金拿来投资设备，并把这些设备投入到这些影院帮忙改造，然后只收租金。这对于一些小影院来说，投入大大下降，也顺利把旧模式转换成新模式。


    所以当我们在做技术革新时，我们更要考虑、评估，当人们使用这项技术时，人们需要哪些变化？变化的成本会不会太高？如果能降低人们的成本，就能把企业的模式往前推进。当然这里我解释下：上过初高中的应该知道这个成本多少取决于什么呢？取决于社会必要劳动时间！


    对于企业来说寻找杠杆资产也很重要，就是要找到能为你企业赋能的大企业。很多大企业其实很喜欢和小企业互动。如果能利用到杠杆资产，能与大企业有合作关系，可能就会产生一分投入，十倍产出的效果。'
  merge: -1
  img_proc: true
- pgno: 65
  md: '另外，寻找赋能对象也很重要。也就是你给谁赋能？你的用户通过你的系统能解决什么问题？比如滴滴，不管是司机还是乘客，通过这个系统都能大大降低成本。


    说到赋能，我们简单来举个例子，这个事情谁最爱干呢？当然是娱乐圈呢！那就是某某和某某恋爱了，拉手手了，还有的就是在同一所酒店一夜未归了，其中一个人一定是名气要小的，这个时候热度和知名度就会平起平坐！还有就是随着直播行业和自媒体的发展，现在一些网红最喜欢干这个技术，天天去拍大衣哥呀，天天去拍拉面哥呀，天天去拍徽州宴呀！这一天天的，你以为人家咸吃萝卜呀！无非就是让他们为自己的流量赋能。


    # 三、商业模式大变革


    商业模式有大变革，也有微设计。其实对于商业模式来说，不需要追求太大的变化，有可能只需要通过一个点就能产生巨大的好处。说白了你得会画龙点睛之笔呀！


    商业模式大变革，主要涉及交易结构的两个问题：'
  merge: -1
  img_proc: true
- pgno: 66
  md: '跟谁交易（交易主体）？交易什么（交易内容）？


    改变利益相关者、活动环节和资源能力，都属于商业模式大变革的内容。


    # 1、利益相关者


    针对利益相关者，我们可以通过增加/减少/拆分/聚合/选择/改变利益相关者，实现我们的商业模式变化。


    在利益相关者里，又有一类叫“关键利益相关者”，就是能实现战略目标，能使商业模式实现质的飞跃的人。对于这一类利益相关者，在商业模式设计里，需要重点关注。


    虽然我们不提倡英雄论，在哲学里面时代创造英雄，而不是英雄创造时代，主客观体你要分清楚！可是在一个阶段总有那么一个人可以力挽狂澜！回想起武汉疫情爆发，钟南山院士被大家深深爱戴！在抗击疫情里面，他的确是一个英雄，今年离我们远去的袁隆平爷爷，在这个世界的人不在忍饥挨饿，这都是英雄！'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# 2、活动环节


    活动环节包括切割重组、碎片聚合、去中间化再中间化等过程。有些行业它的渠道、链条很多，这是可以通过商业模式加技术制造来缩短的。由信息系统驱动去掉某些环节，效率就能得到提高。


    # 3、资源能力


    资源能力可以通过新的商业模式来设计，让企业的资源能力创造更大价值。这也就是资源结构如何最大化！


    案例：万科“小股操盘”


    万科以前在一、二线城市发展，近几年也将目光转移到二、三线城市。它主要的动作就是“小股操盘”——付出很少的股份，但是能操作整个盘，将其做起来，获得更多的价值回报。


    万科强的地方在于开发能力，而在二、三线城市的开发商，他们一般只拥有资金和土地，但开发能力却一般。在传'
  merge: -1
  img_proc: true
- pgno: 68
  md: '统的角色定义上，他们是万科的“竞争对手”，但在小股操盘模式中，他们却是万科的“合作伙伴”。


    万科出小部分资金，占小股份；小开发商出土地和大部分资金；万科投入团队负责操盘开发，获得项目管理费用、股份分红、项目溢价收益等。万科与二、三线城市开发商建立了的创新交易结构，这就是万科的“小股操盘”模式。


    对于很多小企业，其实可以盯着大企业，不是为了竞争，而是为了洞悉他们下一步做什么，为了琢磨他们的商业模式。如果有大企业的短板恰恰是自己企业的长处，不妨可以合作，从竞争对手转变为合作伙伴。


    小企业发展到一定程度时，最好的成长方式就是和大企业共舞。这样才能充分借用大企业杠杆资产来发展自己。很多小企业在发展成大企业之时，都是在关键节点上利用了你大的企业的杠杆资产，借势发展。这个时候你想到之前的可口可乐公司那个案例了吗？'
  merge: -1
  img_proc: true
- pgno: 69
  md: '琢磨商业模式不止是看自己的商业模式，还要琢磨别家企业的商业模式。小企业是可以去琢磨大企业的，甚至可以为他们设计商业模式，让大企业里有自己的一部分。这就是等量代换思维和移花接木思维呀！但是你要主要这里说的是局部而不是全部，同等的商业模式，你什么也不是。你明白了吗？


    当我们在设计商业模式时，如果是做大变革，利益相关者、活动环节、资源能力这三个方面的推演一定要去分析，有可能会产生新的价值。让你获得不一样的期待。


    # 四、商业模式微设计


    在商业模式上，一些微小的设计，尤其是针对企业瓶颈做的小设计，也能创造出巨大的价值。一般通过交易方式（怎么交易）、交易定价（如何定价）来切入商业模式的微设计。


    # 案例一：飞贷'
  merge: -1
  img_proc: true
- pgno: 70
  md: '飞贷是深圳的一家移动信贷公司。它的商业模式变化经历了三级跳：


    第一阶段：信贷工厂。


    解决贷款人/企业难以向银行贷款的问题。它的做法是先搜集贷款人/企业的资料，然后通过筛选，再把用户推荐给银行，用户就能获得银行贷款。缺点：需要大量人工，赚钱效率低，规模受限制。


    第二阶段：将信贷移动互联网化。


    它的做法是研发了飞贷app。由于现在都是采用实名制，有许多信用记录。它通过信用记录以及自己的技术，就能判断一个人是什么行为，能不能贷款。


    第三阶段：靠技术赚钱，专注金融科技。


    它的做法是找了一个全国性的担保公司。担保公司虽然也是放贷的，但是他们了对用户的了解相对还不够，技术相对也薄弱些。引入这家公司，就能为担保公司提供技术支持，'
  merge: -1
  img_proc: true
- pgno: 71
  md: '飞贷也就实现了靠技术赚钱。这时候，规模和资金就不再是飞贷的瓶颈。


    所以，在设计商业模式时针对企业瓶颈来做的微设计，尽管动作很小，但是价值很大。这家公司之所以转变，主要 就是技术创新和商业模式创新两者的结合。


    技术创新包括：将所有内容数字化；数据实现在线共享；智 能化（交互反馈、深度学习、人工智能等）。


    而商业模式创新，有三个特点：


    +   一是社交化，顺从人性；


    +   二是即需即供，根据使用权定价；


    比如以前买车是一次花费几十万的资产，而现在使用滴滴， 一次交易花一次钱。


    +   三是充分利用杠杆资产与赋能。'
  merge: -1
  img_proc: true
- pgno: 72
  md: '比如万科的"小股操盘"，与二、三线城市的开发商合作，将自己的开发模式复制出去，同时也获取巨大收益。对于二、三线城市的开发商而言，获得了万科大企业的赋能，最后也能收获丰厚的收益。在交易定价上，也可以实现微设计。


    # 案例二：利乐


    早期的利乐在进入中国之初主要业务是销售包装纸和包装设备。但由于利乐设备价格昂贵，一般要数百万元，所以一时难以打开市场。


    # 利乐包装


    后来利乐做了个动作，修改定价。原来是需要一次性付清几百万来买下设备，现在是改用“80/20”的设备投资方案。客户只要付百分之二十的款，就可以安装设备，此后
    4 年，只要每年订购一定量的利乐包装材料，就可以免交其余的设备款。单单修改了一个定价，就让利乐打开了市场，并占据中国90%以上的乳业包装市场。'
  merge: -1
  img_proc: true
- pgno: 73
  md: '随着竞争的进一步加剧，企业为了节约成本，拿出财务报表才发现：最大的一块成本支出竟然是利乐的包装材料。当有些企业试图更换包装材料时，却发现无法更换了。因为，利乐通过“条形码灌装机”的专利，使其他品牌的“包装材料”无法在利乐的设备上使用。


    那么更换设备呢？成本更加高昂。此时，牛奶成套灌装设备已经涨价到数千万，如果更换全部设备，乳业企业就要面临破产清算的风险。没办法，中国的乳业企业们只能继续使用利乐的包装材料，源源不断地为利乐创造利润。


    当然，利乐也给客户提供很多有价值的增值服务。比如：“生产过程追踪模型”技术。


    “生产过程追踪模型”可以实现产品追溯功能。如果顾客从超市买回去的一盒牛奶出现问题，根据产品所存储的信息，可以将它的生产过程重新检查一遍，就能知道是哪一个环节出了差错，实现了生产过程可视化。'
  merge: -1
  img_proc: true
- pgno: 74
  md: '与此同时，生产企业可以快速而准确地界定差错产品的责任环节以及产品范围，从而有针对性地召回差错产品。这项技术不仅为企业节约了成本，也以最快的速度消除了产品对消费者的潜在危害。


    对于定价，主要是以下几个关键点：


    +   1. 降低一次性投入，大大节约谈判成本；

    2. 新产品的定价，如果太高，难以打开市场。如果太低，难以为利益相关者带来收益；

    3. “80/20”方案其实也是剃须刀-刀片模式，设备是剃须刀，包装纸是刀片，两者形成一种绑定。


    所以，应用任何一种商业模式时，需要理解商业模式背后的逻辑。善于用理性思维来思考这个商业模式。


    # 五、商业模式的三个时代驱动力量


    商业模式与时代有关，商业模式的改变背后有着时代驱动的力量。不同时代，商业模式也不相同。比如餐饮业的商'
  merge: -1
  img_proc: true
- pgno: 75
  md: '业模式，一直随着时代而改变。餐饮最早都是单店模式，没有杠杆效应，价值很有限。后来餐饮出现了相对有杠杆效应的“连锁”。


    所有的连锁，都需要具备两个核心竞争力：一是前端标准化；二是后台能力。


    这个时候插一句，现在卧龙老师出了万能电商连锁模式和万能单店盈利模式，所以说这些个模式还是值得我们去学习和思考，并不代表可以摒弃了。


    前端标准化是说一家企业的复制能力有多强，开店的时间能否足够短。复制能力与后台统一化有关。要知道，当你拥有许多家连锁店，你的好处会得到扩散，坏处也会得到放大。这就是成也萧何败也萧何！优胜教育想必在疫情期间大家都知道，宣布倒闭了！


    餐饮业最忙也是最好的时候，在于饭点，堂食时间。当太忙时，我们需要考虑是否加入工作人员，这会加大人力投入。但是当不在饭点时间，餐饮企业就相对悠闲了。每一个'
  merge: -1
  img_proc: true
- pgno: 76
  md: '餐饮企业都遇到过这样的问题，这是种行业问题，也是一个行业机会。如何解决“忙一闲”这一两难问题？


    # 案例一：北京餐饮企业金百万


    金百万的定位是“社区百姓的中央厨房”，他们创造了一种新品类，叫做“准成品”。它是介于成品和半成品之间的一种餐饮外卖，由金百万开发出菜品，备齐原材料和调料，用户直接按顺序放入锅内即可完成。


    很多人不喜欢炒菜煮饭，主要原因在于在炒菜前的一系列准备动作：买菜、洗菜、切菜……金百万的这一模式，能让用户只做最后一道工序：简单的翻炒一下，大大节省了用户的时间成本，也让用户在家里就能享受到自己做的饭。


    金百万的“准成品”正是由其它餐厅准备的。在饭点之间，比如早餐和午餐之间的上午，午餐和晚餐之间的下午，餐厅的厨房都属于闲时，属于产能富余，正好帮忙准备准成品——解决买菜、洗菜、切菜的问题。'
  merge: -1
  img_proc: true
- pgno: 77
  md: '越是传统的行业，越有机会实现迭代。驱使他们迭代的力量，主要有：


    +   - 消费升级；


    +   - 资本推动；


    现在好的商业模式一出来，就会有很多资本扑上去。所以现在你想起来了咱们之前讲过的资金流向公式了吗？最后演变到企业之间的拼杀，他们的背后都是有资本的力量在驱动的。


    +   - 技术变革。


    很多行业都被技术所改变了，比如外卖的出现，就来自于移动互联网的普及。移动互联网的普及主要有两点：一是定位，二是移动支付。


    很多企业不一定要研究很深的技术，但是要去了解技术'
  merge: -1
  img_proc: true
- pgno: 78
  md: '低，有很多云端技术是大家都可以用的，只是企业比较少关注而已。


    由于消费升级、资本力量、技术变革这三个力量的推动，一个好的商业模式，用不了几年又得进行改变。单一的模式，容易被这几个力量所制约，所以，对模式进行进化迭代很重要。


    每一个模式都有自己的特点，难以直接套用到自己的企业，但是，我们是可以去理解整个商业模式背后的逻辑的。综合考虑外部的环境、内部的结构、技术等，才能把一个商业模式看得透彻些，不至于掉进坑里。


    所以说，不管怎么样，不管怎么操作商业模式，都不要成为最底层的韭菜！所以越是顶级的商业模式，越不容易成为韭菜！这就是我们寒门人需要学习的！知道为什么要学习更加高级的商业模式了吧！那就是我不想成为韭菜！被割的时候多么的生疼！'
  merge: -1
  img_proc: true
- pgno: 79
  md: '著名的管理学大师德鲁克讲过，“未来商业的竞争，不再是产品的竞争，而是商业模式的竞争。”商业模式对一个企业的重要性不言而喻，如果你的企业没有成型的商业模式，那么在市场竞争中，你还没有开始就被秒杀了。


    很多企业家抱怨，自己的生意越来越难做了，怪外部环境不好。不是生意越来越难做了，而是专业的人越来越多了，越来越多的人懂得用商业模式去赚钱。各种免费模式，倒贴模式层出不穷。你再靠着赚产品差价的日子，一去不返了。有些时候大家觉得一个商品9.9还包邮，觉得这个商家是在挣差价，你如果这么想，那就是大错特错了！当然他究竟靠什么盈利呢？当然是引流后期盈利了！


    那么一个企业究竟要做到那几点才能让自己处于不败之地呢？我们来一下：


    【1】客户定位'
  merge: -1
  img_proc: true
- pgno: 80
  md: '客户定位，定位的是什么呢？定位的是顾客的核心需求，即你企业要为顾客解决什么问题。能够生存的企业，都是能够满足客户某种需求的企业。如果你的企业只能够满足顾客的一些小需求，那么你的企业只能够维持生存。如果你的企业能够满足客户的核心需求，那么你的企业就有快速发展的潜力。你的企业能为顾客解决多大的问题，你的企业就有多大的发展空间。


    所以说，你想吃什么，你的有好牙口呀！


    # 【2】盈利模式


    企业再确定自己能为客户解决什么问题之后，还可能确定自己的盈利模式。题要解决顾客的问题，以哪种服务？哪种产品解决？在解决顾客问题的哪个阶段，用哪种方式可以更好的盈利。如今的商业社会不再是简单的钱货两清收费模式就可以做好的，在收费的时候，还必须要考虑到这种收费是否可持续，这样收费顾客是否有黏性，这个阶段收费是否可以利益最大化，什么样的收费方式可以做到利益的最大化，'
  merge: -1
  img_proc: true
- pgno: 81
  md: '这个利益是资本的看得见的利益还是品牌的，影响力的看不见的利益，能否有效规避竞争对手，这些都是你需要考虑和权衡的。


    # 【3】成本控制


    一家企业能够盈利的根本原因，只有两个，一个是创造了新的社会价值，如原来没有的可以满足社会需要的产品的出现，如汽车的出现。另一个是降低了社会需要的产品的成本，如共享汽车的出现。


    这里的成本控制，不是简单地说企业通过管理来降低自己的些许成本。这里的降低是指革命性的降低，颠覆式地降低。仍以汽车为例，社会上有大量用车的需求，一辆汽车的成本从
    10 万元降低到 8 万元，是有可能通过管理来实现的。但一个人自己使用汽车仍然需要花数以万计的钱，因为他花钱自己买了一辆，平时使用还要额外的开支。而共享汽车，你只需要很低的成本就可以使用，还有如滴滴等打车公司，'
  merge: -1
  img_proc: true
- pgno: 82
  md: '用车人的车赚钱，也客观上实现了一辆车多人使用，这就大大降低了满足社会用车需求所需要的成本。


    # 【4】裂变模式


    任何一个企业，任何商业模式都会遇到扩张的瓶颈。一家企业，一个商业模式，不能做到“可自我复制”，就很难突破自身发展的瓶颈。等企业遇到了天花板再去突破，是很不明智的。在设计一个商业模式时，是可以提前预料到企业会遇到什么样的瓶颈，可以通过商业模式的设计和规划，提前规避和突破可能要遇到的瓶颈。


    # 【5】核心竞争力


    很多企业是没有自己的核心竞争力的，这样的企业的商业模式即使完成了自己的商业闭环，也很难保证自己的商业模式不会被复制。因此，在设计你的商业模式之时，一定要考虑到你的企业的核心竞争力是什么，被人复制的难度大不大，能不能掌握到定价权，让企业拥有可持续的高额利润。'
  merge: -1
  img_proc: true
- pgno: 83
  md: '如果你的企业还没有核心竞争力，可以自己设计。比如从产品上，从品牌上，从商业模式上。


    前期我们说了这么多商业模式，怎么设计商业模式，一个好的商业模式需要执行力来验证，是骡子是马拉出来溜溜！


    一、如何落实商业模式呢？落实商业模式的五个阶段：


    商业模式主要是关于价值的系统，包括如何创造和传递客户价值和公司价值。商业模式不只是盈利模式，它还包括客户价值主张、关键资源和关键流程。


    那么选定了一个好的商业模式，在公司中也要逐步的去落地，我们可以有这五个过程：动员、理解、设计、实施、管理：


    +   1. 动员——为一个成功的商业模式设计项目做好准备工作。


    主要活动是确定目标、测试初始想法、规划项目计划、组建设计团队。'
  merge: -1
  img_proc: true
- pgno: 84
  md: '关键成功因素：合适的人员、经验和知识。


    主要风险：高估了初始想法的价值。要设定一个够一够就能摘到桃子的目标，难道不甜吗？


    +   2.  理解——研究和分析商业模式设计所需的元素。


    主要活动是环境分析、研究潜在客户、采访行业专家、研究前人的做法、收集想法和观点。


    关键成功因素：对潜在目标市场的深入了解、超越定义传统目标市场。


    主要风险：研究过度：研究和目标之间脱节。


    此阶段需要对商业模式所在环境做一个细致彻底的了解，否则很容易受到预先某个想法的影响，导致研究结果不客观。


    +   3.  设计——构建和测试可行的商业模式可选方案，并挑选最佳。'
  merge: -1
  img_proc: true
- pgno: 85
  md: '主要活动是头脑风暴、制作原型、测试、选择。


    关键成功因素：与来自公司不同部门的员工一起设计；透过现状看本质的能力；投入时间，探索多种商业模式。


    主要风险：低估或者打压大胆想法、过快“钟情”于某个想法。


    主要的挑战是要保持设计大胆新颖模式的决心。


    # 4. 实施——在实际环境中实施商业模式原型。


    主要活动是交流和参与、执行。


    关键成功因素：最佳项目管理、快速调整商业模式的能力和意愿、平衡好旧模式和新模式。


    主要风险——积极性降低、减弱。


    一旦确定了商业模式，就要开始着手如何实施的工作。包括确定所有项目，制定各个阶段的里程碑，节点等。


    # 5. 管理——结合市场反馈来调整和修改商业模式。'
  merge: -1
  img_proc: true
- pgno: 86
  md: '主要活动是分析环境、持续的评估你的商业模式、换一 角度思考你的商业模式、调整商业模式、配合公司整体战略、 处理模式间的协同效应和冲突问题。


    关键成功因素：目光长远、积极主动、商业模式的管理。


    主要风险——成为成功的牺牲品，满足于现状而未能及时 作出调整。


    管理阶段意味着需要不断评估模式、审视环境，来理解 这种模式在未来长远阶段会受到外部因素怎样的影响。


    作为出身寒门的我们，在掌握了一定思维和一定的商业 模式之后，究竟能够开展什么样的创业呢？


    创业是复杂的又是灵活的，选项目就该选能承担风险又 具有创造性的，创业者必备的基本素质就是把握创业的机遇， 创业是自身价值的实现，同时又是需要投入必要的时间和精
    力。那么当今情况下，都有哪些创业方式呢？哪些创业方式 比较适合自己呢？接下来我们细细道来：'
