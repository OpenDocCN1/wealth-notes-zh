- pgno: 59
  md: '种跨界打击，把其它行业做得非常好的方式应用到本行业。


    所以说打败你的有时候并不是你的竞争对手！


    所以，在研究商业模式时，不妨多看看外面的世界，多借鉴其它行业，多尝试跨界，将竞争对手优势无效化。


    案例二：唱吧（降维攻击）


    有一款 APP 叫唱吧，前两年融了几个亿，现在在线下开实体店。实体店最大的成本和难度在于选址。但是对于唱吧来说，选址几乎是零成本的。


    这是因为唱吧有定位功能，大家使用唱吧 APP，唱吧公司只要打开后台，就能知道大家在什么地方经常用唱吧 APP 唱歌。这些地方就是喜欢唱歌人的聚集地，一旦在这聚集地附近开店，这个地方的人流量就会很大。


    对于实体店而言，临街店面的租金会比较昂贵。但是唱吧不需要选择临街店面，租金比较便宜，因为它可以实现定向引流。此外，很多用户在唱吧 APP 上唱了很多年，所以唱'
  merge: -1
  img_proc: true
- pgno: 60
  md: '吧对这些人的喜好特别清晰。因此唱吧在线下开 KTV 的时候，它能设计你最想要的服务和体验。


    这就是通过移动互联网的技术加上商业模式的设计形成了降维攻击。互联网时代的商业模式，使用很简单的移动互联网技术，这两者结合产生的效果是很不错的。好比现在的唱吧，能够开一个
    KTV 当月就能实现盈利。


    现在的企业竞争，全是商业模式的竞争。Soda Stream 打败可口可乐，用的就是与可口可乐不一样的商业模式；唱吧在线下开 KTV，也与传统企业开 KTV
    不一样，它通过海量的 APP 用户，加上对数据的挖掘，就能知道喜欢唱歌的人群聚集地。


    所以从商业模式的本质上来说，唱吧是以交易结构为切入点，解决企业可持续盈利的问题。


    不管是成功的 Soda Stream，还是唱吧，利益相关方都不同，实现的价值也不一样，盈利的方式全都跟传统不一样，这就是商业模式创新导致的结果。'
