  md: '# 前言


    在这个变化如此之快的社会，没当你反应过来的时候，其实已经成为了别人的韭菜，任人宰割，当然内卷时代的来临，你觉得你为了规避这些风险，选择躺平，安然无事，那你才是大错特错，你要知道在烧烤界中有一种食材叫做烤韭菜，即使你躺平了，你照样会被收割，在此，举个简单的现实单点循环案例，有一部分年轻人买不起房子，那就选择躺平，这样觉得自己不会被收割，可是其恰恰相反，总觉得不管房价上涨多高，都跟自己没关系，可是你要知道，活着的时候，住的是房子，死了的时候，住的是坟墓，房子不断上涨，就意味着地价上涨，地价上涨，墓地还会便宜吗？这下你应该懂得了吧，躺平也会被拔的一毛不剩，让你走的干干净净，在书中将会用通俗易懂的案例和解说，让你体验一把转换自己思维的风暴，思维变现的密码。带你踏入新的认知圈子和境界，让你拥有新的思维模式和密码，解锁你的新人生，开启你的新命门。'
