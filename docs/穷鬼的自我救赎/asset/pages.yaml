- pgno: 55
  md: '加直观的看到产品生产过程，还有就是多了一种选择！说白了是什么呢？那就是仪式感呀！中国人现在也特别注重仪式感，因此才有了各种各样的情人节，男人只有一个清明节呀！所以说你让女人过不好情人节，男人就得过清明节哈哈！开个玩笑了！包括现在很多手工制作等等。并且你会发现既让客户有了仪式感，你也省去了人工费呀！说白了，在商业模式里面简单的可以称之为：师徒制！这下你明白了吗？难道不就像中国饭店里面的学徒吗？


    我们话接上回，随后这企业一上市就抢了可口可乐不少份额，可口可乐的高层已经开始关注它了。觉得这个企业不简单呀，后来这家企业还做了一个广告，在一面墙上放了许多瓶瓶罐罐，而在另一面则放着它一台机器。广告词写着：一个家庭
    5 年时间，需要消耗 1 万多瓶瓶罐罐。如果是个环保人士，看着这则广告就会想要买台机器取代瓶子，而不是消耗那么多瓶瓶罐罐污染环境。'
