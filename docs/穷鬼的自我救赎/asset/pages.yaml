  md: '有人说互联网带给我们很多方便，互联网上什么都有，我们总是梦想着打开笔记本，坐在图书馆或者咖啡厅畅游在知识的海洋里面，可是现实却是畅游在抖音，快手，手游的修仙画面中。在这种天然的氛围之下，纵使有超高的思维和思维整合模式，你也难成大器！因为有的时候你的脑子已经不能够用洗衣粉洗干净了哈哈！


    实际上很简单，只要我们把这些浪费时间的所有行为分解成一个动作即可解决，你把学习的内容放在桌面上或者一个指定的文件夹，然后把网线拔了，你就没干扰了，打开电脑只能学习了！当然这个时候也会有二哈说我可以通过单机游戏呀！我可以负责任的告诉你，你不仅可以玩，还可以圆滑的滚开！这也是稻盛和夫和马云为什么喜欢静夜思了！当然上面写到的这句话我是利用了联系的观点，等量代换的思维。要想获得理想的思维，准确的的思维判定，一定是一个人在安静的环境中，静谧的思考和推演！'
