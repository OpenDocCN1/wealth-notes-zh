    内部创业指的就是在企业公司的支持下，有创业想法的员工承担公司内部分项目或业务，并且和企业共同分享劳动成果的过程。这种创业模式的优势就是创业者无需投资就可获得很广的资源，这种树大好乘凉的优势成为很多创业'
