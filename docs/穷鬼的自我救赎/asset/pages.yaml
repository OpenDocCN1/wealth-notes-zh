- pgno: 58
  md: '的等量代换思维和移花接木思维一定是从最基层开始自下而上的整体大换血和改革！


    2、以色列公司 Soda Stream 用的是与可口可乐不一样的商业模式。当它卖了它的机器后，它还持续卖苏打粉、浓缩液等耗材。也是我们所说的逆推思维，把商业模式倒过来做！双向逆推思维的绝对执行者！在这条生产线上的什么东西我都卖哈哈！


    因此我们可以明白了当两个企业当它的商业模式不一样，意味着接触的利益相关方都与可口可乐不同。原先可口可乐在电视上、渠道上所积累的优势，面对这家小企业，优势也就不存在了。因为可口可乐的优势是基于自己的商业模式所形成的。当两者商业模式不一样时，优势就无效化了。这也是通过商业模式设计可以达到的效果。


    3、这种商业模式在可乐这个行业，称得上创新，但是放宽到整个商业范围，这种技术在咖啡行业比比皆是。这就是'
  merge: -1
