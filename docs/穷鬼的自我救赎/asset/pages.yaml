- pgno: 3
  md: '# 你是不是寒门人贵子


    寒门出贵子，是多少从古到今底层社会的人翻身的心灵鸡汤，然而随着时代的变化，却成为了毒鸡汤，在现实社会的逼迫下，每一个底层社会的寒门子弟不得不咽下这碗毒鸡汤，最终毒药穿肠，头破血流的死在了攀越阶层的路
    上，一个底层的娃子要想进入更加高贵的圈子，只有三种途 径：资本、金融、教育。可是我们深知，作为最底层的穷人，哪 里有资本来进行博弈？哪里有金融杠杆来撬动财富的倾斜，唯一有机会的就是古代科举制的传承，通过教育走出大山的高
    考。然而帮助底层的人翻越阶层的皇帝却被某些人传唱成了 昏君，这个秘密，你思考过吗？这也是高考为什么如此重 要！然而社会的现实逐渐会让你知道，这条路已经离你渐行渐远，教育进行多次改革，你以为改的是什么？


    天时地利人和总是惊人的互补，现在社会处于知识经 济的笼罩之下，互联网资源共享的高度发达之下，最底层的人必须把握住机遇，当然，要想运作这些模式，那当然是离 不开你思考媒介的方式，因此为了帮助咱们底层的人跳跃阶'
  merge: -1
  img_proc: true
- pgno: 4
  md: '层。


    一个人如果想要得到别人实打实的认可，唯有两个字才能征服别人，那就是成功！如果说还有比这个更厉害的字眼，那就是四个字：绝对成功！当然能否守得住这几个字伴随自己的一生，那是需要很多权谋和为人处世的做派。


    一个人要想获得成功究竟该靠什么呢？是靠自己主观的意念，还是客观存在的规律？既然是寒门，那么我们肯定是站的底，看的近，如此条件之下，如何绝地逢生？那就是改变环境的方式，也就是把同等条件进行排列，选出最优的组合，在这个过程中，我们称之为：思维运作。很多人也许会觉得现在已经有成功的人士，我们直接复制他们，不就行了吗？如果真的可以，为什么这个世界只有一个马云，一个马化腾，一个刘强东，很多人都去尝试过复制，但是为什么都失败了？或者没有达到这些世界佼佼者的脚步呢？是因为他们没有足够的财富吗？还是因为他们没有足够的权力？还是因为他们没有强大的策划团队？其实道理很简单，即使你们是相同的团队，即使你们是相同的商业模式，'
  merge: -1
  img_proc: true
- pgno: 5
  md: '即使你们是相同的合作伙伴，那也未必能够扭转乾坤，那是因为你们有一个简单的不同：那就是脑袋！所以复制的那些人只是徒有其表，当然真正有能力的企业肯定也会有所小成，这个我不否认。但是他的脑袋你没有复制过去。脑袋里面是什么？是大家对待同一个问题思考的方式和推演。然后大家根据自己的头脑演算推演出不同的结局，运行不同的手段，当然也离不开好高骛远！万丈高楼平地起，没有铁打扎实的基础，没有身经百战的经验，没有观人无数的阅历，哪里有成熟的思维，那里有思维的养成，哪里会有思维高超的运转？那么我们首先要知道究竟有哪些思维呢？


    大家要知道中国的文字精神和含蕴博大精深，首先我们利用拆字法将思维拆为思和维，大家可以看到思字分为心和田，田字方方正正四通发达，结合心字来解析就是心上所想之事要考虑到各个方面和角度，维字就是维度的意思，那思维是不是就可以简单的理解为心里面想啥事情的时候既要考虑到各个方面，又要考虑到这个事情的维度。那么究竟思维是什么？又分为什么呢？接下来先看看让人睡觉的哲学'
  merge: -1
  img_proc: true
- pgno: 6
  md: '上专业术语吧哈哈！


    1、按思维的方式来分类：有感性思维与理性思维之分；感性思维是指建立在感觉基础上的认识，是以意识片段为形式的客观世界描述，感性认识的只是断裂和受限的事物现象从而获得有限的认知，并且是多意识的分离结论。对客观世界的认识处在无法定义和理解的认识搜集阶段。


    理性思维则是一种有明确的思维方向，有充分的思维依据，能对事物或问题进行观察、比较、分析、综合、抽象与概括的一种思维。说得简单些理性思维就是一种建立在证据和逻辑推理基础上的思维方式。


    举例：感性思维就是你看见一个人夏天还穿着棉袄，觉得这个人神经兮兮，理性思维就是分析到这个是不是有什么病需要每天穿着厚厚的衣服。


    升级版的感性思维和理性思维区分：大家都知道瞎子什么都不看见，但是晚上瞎子走路都会点灯照路，这个时候感性思维可能会说到这个人不仅是瞎子还是个傻子！瞎子点灯白费蜡！可是理性思维看到的瞎子根本不是为自己点灯，'
  merge: -1
  img_proc: true
- pgno: 7
  md: '为的是在黑夜，让别人能够看到自己，从而自己不会发生危险，这样你明白了吗？


    2、按思维的形式来分类：有抽象思维与形象思维之分；抽象思维是人们在认识活动中运用概念、判断、推理等思维形式，对客观现实进行间接的、概括的反映的过程。形象思维是指人们在认识世界的过程中，对事物表象进行取舍时形成的，是只要用直观形象的表象，解决问题的思维方法。形象思维是对形象信息传递的客观形象体系进行感受、储存的基础上，结合主观的认识和情感进行识别（包括审美判断和科学判断等），并用一定的形式、手段和工具（包括文学语言、绘画线条色彩、音响节奏旋律及操作工具等）创造和描述形象（包括艺术形象和科学形象）的一种基本的思维形式。


    3、按思维的层次来分类：有系统性思维与片面性思维之分；系统思维性就是把认识对象作为系统，从系统和要素、要素和要素、系统和环境的相互联系、相互作用中综合地考察认识对象的一种思维方法。系统思维以系统论为思维基本模式的思维形态，它不同于创造思维或形象思维等本能思维'
  merge: -1
  img_proc: true
- pgno: 8
  md: '形态。系统思维能极大地简化人们对事物的认知，给我们带来整体观。


    片面性思维是指对事物和矛盾不作全面考察的形而上学思想方法。表现为只看矛盾的一方，不看矛盾的另一方；只知事物的过去，不知事物的现在和将来；只了解局部，不了解全局；只肯定或否定一切，不作具体分析。是主观性的表现。


    解析：这个大家可能比较容易理解，系统思维和片面思维其实字眼上已经告诉了我们答案，当然上述的片面思维解释有点哲学的味道，没错，在哲学上隶属于唯物辩证法的对立面。举个案例那就是：一叶障目不见泰山明白了吗？当然与之相对应的就是全面的观点也就是系统性思维！唯物辩证法主要分为：联系的观点、矛盾的观点、发展的观点、否定之否定的观点，当然毕业好多年了哲学也都忘得差不多了。不管那些吧，哲学的唯物辩证法其实就是告诉我们思考一个问题和事情的要各个角度和维度，前因和后果等分析透彻。


    但是只有逆向思维、抽象思维、线性思维、形象思维、'
  merge: -1
  img_proc: true
- pgno: 9
  md: '直觉思维、定向思维、创新思维、分析思维、辐射思维、聚合思维、习惯性思维。才是常用的思维！但是我们这次来讲一些这些里面没有的，但是我们又经常听到的，但是任何人或者大师未曾提起的思维，并且可以在工作中指导你的思维，因此我们就是要解开比这些思维还要厉害的思维密码！


    作为新晋的寒门创业者，我还是要拿出点真本事的，要不给大家看笑话对吧！当然也许下面的阐述不是太专业，不是太深刻，但是一定是最浅显易懂，案例和想法相互结合，并且随时都在互动，让你学习不再那么枯燥乏味！结合时政热点，结合实际贴身生活，轻而易举的了解到商业思维和商业模式的潜在本质。接下来，就开启你我的学习之旅吧！期待我们都会有一个不错的收获吧！加油吧！寒门！说给自己听，也是说给你们听！各位寒门：唯有努力，不可放弃！'
