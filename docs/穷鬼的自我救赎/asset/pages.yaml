- pgno: 50
  md: '# 第三章 打造寒门人商业帝国


    即使再牛 b 的思维也需要顶级的商业模式来运作，在商业模式运作之下，把各个思维发挥到极致！从而达到最佳的赚钱效果！那么究竟什么商业模式呢？说的比较理论一些就是合伙人、免费模式、CTC、CTB、BTC
    等等。但是不管怎么变换模式，你要知道在某一个环节金钱的支出和收入是固定，那么就看谁能够利用别人的资源来给自己赚钱，说白了就是在一条线上，如何利用别人的资源来降低自己的成本，那么当然挣的钱多！别人的成本增加当然挣得钱少！这下你明白了吗？商业模式就是怎么采用什么模式让自己在这条链条中如何获得最大化的受益和利益！有的人你可能会说你说的不对，说的也不够专业，那我来问你，一些人每天费力八叉的研究这个商业模式，研究那个商业模式，为的是什么？不就是为了怎么赚更多的钱吗！一、商业模式的本质


    最近几年，商业模式创新风起云涌，任何新的做法都与商业模式有关。比如：共享经济、共享单车、农村电商、社区服'
  merge: -1
  img_proc: true
- pgno: 51
  md: '务、降维攻击等。共享经济是一种很新的商业模式，它也代表了未来的趋势：当然共享经济成功的案例和失败的案例还是很多的，共享单车小黄车、共享雨伞等等！但是这个共享模式真正挣得是什么钱呢？我往后再说！


    那么共享经济背后的实质又是什么呢？那么我们就用滴滴打车来做个案例解析吧！那就是技术呀！开发技术！也就是开发一个技术共享平台，帮助大家一起挣钱呀，你这个时候利用等量代换思维，会不会发现这不就是淘宝吗？一个是让天下没有难做的生意！一个是让天下没有难打的车呀！


    不管是滴滴还是现在的共享单车，它们都具备了强大的信息系统。其应用里的许多资产：汽车、司机以及乘客，你会发现，司机并不是滴滴自己的，全都是由系统来接触的；我们和司机也不熟，也都是由系统来匹配的。现在滴滴成为了风口浪尖上的一支羽毛，为什么？不就是强大的系统计算和汇总能力吗？可怕的相当吓人呀！'
