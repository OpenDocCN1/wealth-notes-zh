- pgno: 88
  md: '即在工作之余再创业，业务员可兼职代理其它产品售;设计师可自己开设工作室;编辑、撰稿人可朝媒体、创作方面发展;会计、财务顾问可代理作帐理财翻译可兼职口译、笔译;律师可兼职法律顾问和事务所;策划师可兼职广告、品牌、营销、公关等咨询;当然，你还可以选择特许经营加盟;顾客奖励计划等等。现在这个社会副业真的是太多太多，但是微商需谨慎，小心被收割呀！


    四是：团队创业


