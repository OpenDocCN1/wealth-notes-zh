    后，以较强的复制能力、稳定性、技术创新等，集中利用内部资源、整合各业务群中的优势元素塑造向新兴领域或转型产业进行产业布局的转移与调整，像袋鼠一样繁衍一个又一个新业务，实现塑造蓝海、产业扩张与价值创造的统一。


