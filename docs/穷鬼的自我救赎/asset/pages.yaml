    # 三、对撞逆推思维


    到底什么是逆推思维？我们首先具体举一些实际例子来帮助我们理解：


    鄙人作为北漂一族，飘荡在这个虽然有很多窗户，但是没有一扇窗户为你而开的大城市！因此北漂的人们很多选择了郊区生活居住，那就是燕郊，也就有了通勤车和地铁，那么逆推思维来了：


    同样很多人在东直门等待地铁，去前往下一站，但是你会发现人数众多的情况，有的人可以轻而易举的坐上地铁，有的人却要等很久，那么逆推思维怎么运用呢？


    其实我们每一个都知道大家为了能够更快的挤上地铁一定是离得火车进站最近的一段，当然上一站的人也是这么想的！你应该明白了吧？只要你去最远的地铁门一定是最快上地铁的！因此地铁速度很快，即使上一站的乘客去移动，也未必很快到达，还有就是中国人有一个特性那就是懒！已经劳累一天了，那里还有心思去找座位去？'
