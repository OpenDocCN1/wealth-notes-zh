  md: '果的过程我们还是不知道都用了什么手段和营销策略，当然很多很多，在此不一一解释！做好自媒体首先要选对行业，有的人是恶搞，有的人是娱乐，有的人是游戏等等，不管怎样，一定是自己擅长的行业。因为后期自媒体靠的是内容垂直度！当然很多技巧也是我们必须学习的，比如怎么打造爆款，怎么设置标题，怎么参加活动，怎么紧跟热点等等，这都是需要自己一步一步琢磨和探索！说这么多只有一个核心那就是：时刻紧跟新事物，时刻拥有一个赚钱的心态，时刻都要坚持下去！


