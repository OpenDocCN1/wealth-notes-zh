    只要你记得第二次约会这个原则，用我这个「听话指数」，固然会提高你的优势。\n\n## 我如何把妹说故事\n\n### 相爱之后就要划清界线\n\n我有一位朋友每次将女人追到手后就会说：「我是一个事业心很重的男人，所以我经常会忽略身边的女人……」\n\
