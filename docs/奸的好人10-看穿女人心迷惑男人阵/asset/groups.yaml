    ## 男人，你是不是「蓝筹股」？


    ## 龙大师的回应


    「港男，港女」近期在香港的确引起很大的回响，我不会偏袒任何一方，因为两方面都有自己的论点。首先说说「港男」，因为比较简单。


    其实评论港男，只有一个字：「钱」。


    我从未见过有钱的香港男人会被说成港男，因为有钱的男人，女朋友只会多到无从考虑要选择谁，而不存在「我追人，没有人理我」的问题。


    我们常说「他是一个有条件的男人」，你若进一步细问，「有条件」是什么意思，不言而喻，「有条件」多指事业有成就，换言之是有经济基础的男人。


    我们也听过一句话「穷心没尽，色心又起」来形容没条件的男人。


    大家可要留意喔！有条件首要的重点是经济，其次为谈吐技巧、社交手腕，再次之才是相貌等。


    我不是说，有钱一定可以追得到任何女人；但反过来说，如果一个男人没有钱，肯定很多女人都追不到。


    我们也要明白，一个男人即使没有钱，相貌普通，但不能没有谈吐的技巧。

    若没钱兼没有谈吐技巧，即使有相貌，可想而知，这个男人的价值是「负资产」了。


    你若没钱，有谈吐技巧，这个男人「有可能」是「优质股」。


    有钱，有谈吐技巧，即使没有相貌的男人，也会变成「蓝筹股」。


    香港比较物质主义，所以香港女人，事事都和男人谈钱是很正常的。只要不太过份，我觉得还可以接受；而且男人和女人外出吃饭逛街看电影，由男方付钱，我觉得这是男人有面子的展现，尽显大树风范，没有问题。


    我和龙嫂拍拖时，其中一个杀手锏就是帮她的八达通卡增值。尤其是在交往一段时间，当我知道她的八达通没有增值后，就主动帮她增满。


    试想想，女人有什么可以幸福至此？


    在香港日常生活，乘搭公交车到超市（大卖场）买东西都会用得上八达通，每当她使用这张卡时，就会因此而记得你，可想而知龙嫂当时对我的印象有多深刻。


    在我而言，只要能够负担女人整个生活的经济基础，女人自然会有安全感，感情的稳定度自然会提高，女人对此自然印象深刻。


    你若问我，龙嫂对此到底有多深刻？


    事隔多年之后，龙嫂不时还会说：「你现在为什么不给我增值八达通呢？以前你常常会为我的八达通增值呢！」表面上龙嫂带着责备语气，叨念现在不如以前般细心，但由此可见这些小事对女人来说却是细心的表现，因此事隔数年她依然还会记得，你说深刻吗？


