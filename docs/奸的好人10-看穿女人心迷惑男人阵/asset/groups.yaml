    两个人吵架，都一定是两个人一同吵才可以的：正所谓一只手掌拍不响，如有任何一方不出声，或不停表示歉意，就 会少了很多吵架的机会。


    我和龙嫂，从不吵架，我看到龙嫂发脾气，心里只觉可爱，温柔地道：「你又发脾气啊？」


    龙嫂在九成九的情况下都会笑出来。这是对手任何女性都有效的，因为当你这样说的时候，从心理的角度来说，九成九的人都会想是自己乱发脾气在先，对方是会回心想着是自己的错，当然你在说这句话的时候所用的语气也很重要，有留意到吗？我是用温柔的语气来说出这句话，如果你是用咆哮的方式，那只会火上加油吧！你看看，只要你说一句，立即化干戈为玉帛，何乐而不为？


    或者你也可以用许冠文在栋笃笑时教的方法，老婆很生气，老公则说，等等再发脾气，接着老公说，先坐下来，然后扶老婆先坐下，之后，再说，再等多一会才发脾气，很快你就可以发脾气了，说完老公冲去厨房拿一杯茶给老婆，再拍一拍双手，对老婆说：「老婆，可以了，你现在可以骂我了，你可以发脾气了！」


    据说，这个方法很奏效呢——道理很简单，老婆气消了。


    其实吵架真是很费力气的，这样大家都不开心，而且两位一体，应该一致枪口对外，而不是对内的。


    我常说，两個人无论是哪一方争赢都好，其实两个都是输家呢！


    ### 不要干涉对方的自由


    这点是很重要的。「用人勿疑，疑人勿用。」


    有些男人或女人，对身边人像是贴身膏布一样，这只会令对方没有自己的空间，好多情侣都会犯了这条天规，我好想说，人是有人性的，无论是何人，都一定要有自己的自由，如过份干涉，就一定会带来反效果。


    ### 要保持隐私


    无论是你丈夫，妻子，子女都好，都一定有隐私。我很注重隐私，从不会偷看别人的东西，而我也不喜欢别人偷看自己的东西。最讨厌男女之间私自打开对方的电话看 SMS
    查对方的电邮，账单，开对方的信件。


    其实每个人都会有些不想告人的秘密，任何人都没有特权去揭人的私。很多时候对方不说秘密给你听可能是因为不想你不开心罢了。


    ### 尊重


    越亲密的人，你越要多尊重。有很多人对于身边的人会忽略尊重，觉得对方会明白，其实越亲密的人，你越要讲「谢谢」。父母教子女是如此，两夫妻更是如此，如能做到这点，你和身边人的感情运立即提升百分之二十。


