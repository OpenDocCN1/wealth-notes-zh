    我有一个朋友，三年之前已认识，那时我刚转换新工作，所以比较清闲，而我和中学同学每个月都会定期约定打一次羽毛球，而「他」是我的中学同学的大学同学，每次打羽毛球都会见到「他」，而「他」打羽毛球的技术是超棒的。


    第一次打完球之后，我们大伙儿去唱 KTV，其中一个很久没见的旧同学问我的 msn，而「他」应该是在那个时候偷听到，之后他便主动 add 我进 m s n,
    Facebook 其后我亦 add 了他。


    此后，我们都有在 msn 聊天，他也时常传送不同的歌曲给我，但近期这情况少了许多。


    其实我想问，怎样才可以打破这困局，我们见面都是大伙儿的，约几个月一次，当然我可以继续在 msn 和他聊天，又或者传送歌曲给他，但我就是找不到借口单独约会「他」。如我突然约「他」由大伙儿变成两个人似乎太唐突了，请问大师有何妙计，让我容易做到，需知我亦有点害羞，最好让他主动约我……这样最完美了。


    ### 热恋的黄金机会


    ### 事件分析


    以此刻的情况来说，这女顾客 P 小姐的成功机会低于三成，而当时初相识的时候成功机会则高于七成。


    P 小姐已错过了之前的「恋爱的黄金机会」。


    之前对方主动 add 她，还不时传送歌曲给她，代表男人有心继续交往，虽然未必代表他喜欢她或爱她，但至少对她不抗拒，又或者有好感，否则他一定不会这么做。


