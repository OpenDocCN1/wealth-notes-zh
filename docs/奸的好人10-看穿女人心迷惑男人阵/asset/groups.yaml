    # 龙震天序


    我与李民杰老师的缘份，始于两年之前。那时候，尚未认识李老师。


    某天在书店闲逛，无意中看到李老师的第一本「好的好人」系列著作《勾魂夺心洗脑催眠》，驻足一看，半个小时随即匆匆过去。


    为什么这个人的文笔那样吸引人？为什么这个人的文章，这么有令人想深入阅读下去的冲动？


    当下就将《勾魂夺心洗脑催眠》这本书买下来，回到写字楼（办公室）精读研究。


    第二天，迫不及待再度回到书店，一口气买下李老师所有的其它著作。从那时候起，我因此而开始研究权谋术。


    后来在书中发现，李老师也有个人网志的经营。于是就开始和李老师对谈。


    就这样一谈就是半年。半年后，趁着李老师有机会来香港出差，就抓紧机会和李老师吃饭。


    那一晚深刻记得，我们相约在香港铜锣湾时代广场吃饭。当天我们约定七点整会面，一向很怕迟到的我，已经准备好准时到达；没想到李老师比我还早，六点半已经打电话给我，说他已经到了。我心想：「李老师对人真的很有诚意呀！」


    那晚相谈甚欢，大有「相见恨晚」的感觉：就这样，我们的关系已经建立。


    在李老师回国后，我们持续通讯大概有一年的时间；而在那一年之中，我开始在自己的网志撰写有关男女感情的文章，没想到大受欢迎。


    我说「没想到」的原因是，在香港，撰写男女感情文章的作者大多是女性，「没想到」身为男性的我，写男女感情文章也大有市场。


    可能因为工作的关系，每天接触大量各行各业的客人，男人或女人都有，他们都有不同程度的感情问题。接触多了，了解多了，自然观察得到很多增强桃花运的秘诀。


    因此，产生「将这些心得写在网志上让每一个人都获益」的想法。


    也因为我这个人比较实际，分析力强，所以专于整理客人的资料，也很容易'
  - '[PAGE 5]


    发现每个人增强桃花运的共通点，因此得以和每一位读者分享。


    李老师说得对，如果一个人不停的跟你说「怎样增强桃花运」，自己却连一个女朋友也没有，也从来没有拍拖过，那你会信服他吗？


    那么，龙大师有没有拍过拖呢？次数如何？


    我可以告诉你，龙大师拍拖超过十次以上，除了第一外，之后的每一个女朋友，都是龙大师主动提出分手的。


    有了以上的背景，你不难作出「龙大师绝对有资格去论述男女感情之事」的决定及想法。


    在撰写网志专栏一段时间之后，开始有「要写一本感情书」的想法。


    于是我把这样的想法告诉李老师。没想 到一拍即合，原来李老师也正有此意，就这样促成这本书的问世。


    虽说文字可以表达自己的想法，但「感谢」两字却在这里难以表达万分。我要借此机会，衷心感谢李老师，感谢他对我的信任，让一个潜藏在内心多年「要写一本感情书」的梦想，得以实现！


    # 我有桃花运


    # 看穿女人心，迷惑男人阵


    如果我说，凡是男人都一定会有女人喜欢他，都会和他有进一步的感情发展，你会相信吗？其实，真正的问题在于他是否找到这个女人而已，这就是所谓的桃花运。


    有一个你不可不知的重点，就是每个人的桃花运，都可以透过玄学的途径去增强。不同生肖的人，会在玄学上产生不同的方法增强桃花运。


    我发现有些人生来桃花运特强，若配以玄学上的桃花阵法摆设，他会「强上加强」，「旺上加旺」。


    不同生肖或出生年月日时的人，都会在玄学上有不同的方法增强桃花运。


    要增旺自己的桃花运，除了透过玄学的途径增强，其实还可以通过改外表、想法、行为、语言技巧、表达方式达到目的。


    如果你再问我：「龙大师，那些桃花运很旺的人，是不是男人永远不缺女人，女人也永远不缺男人呢？」'
  - '[PAGE 6]


    言下之意桃花运特别旺盛的男女，根本不愁没有属意的对象出现在你身边，只有选择的苦恼，或者更明确一点来说，只有追求的苦恼。


    换句话说，你会有很多「机会」，你若没有技巧，所有的「机会」都会变成「昙花一现」，你有再好的运气都没有用。


    你有桃花运就会让你碰上很多你属意的对象，但这并不表示你能追求得到他 / 她，很多男女一旦碰上了自己喜欢的对象都会紧张得不得了，心跳加速，接着心中都会涌现同一个疑问：「他
    / 她是不是也很喜欢我呢？」


    男人啊！男人，你有什么办法可以看穿女人心？


    倘若你晓得其中秘诀，三次约会之后，你可以透过我教你的方法看穿女人的「听话指数」和「喜欢指数」后，马上可以牵住女人的小手。


    也有很多女人，一旦碰上自己喜欢的男人，常显得不知所措，担心太过主动会自贱身价——男人不会珍惜她，然而又不懂得如何给予适当的暗示，让男人不顾一切主动提出约会的邀请。


    女人啊！女人，你懂不懂得如何巧妙布下迷惑男人的阵法呢？


    倘若你晓得其中秘诀，你必有良方让最老实的男人「愿者上钩」，「顺其自然」主动追求你，同时在约会过程，若懂得善加利用「三笑姻缘」迷魂法，必定让男人对你神魂颠倒。


    # 为君把脉「医」缘份


    龙大师出版过七本书，在香港的报纸有写专栏，部落格也颇有名气，曾被香港多份杂志专访，加上职业关系；任何类型的人都会接触到——当然包括大量男人。


    因为女性读者特别喜欢看我的书与点阅我的部落格，所以也接触过大量的女人。


    在替人论命时，当我看到桃花运特强的顾客时（男或女），即把握机会，透过：


    +   「望」：看其命盘，推算他 / 她的流年运程，从夫妻宫论断他 / 她的姻缘变化；

    「闻」：听其问题，想办法解除他 / 她的忧虑，给予他 / 她适当的心理辅导与有用的建议；'
  - '[PAGE 7]


    「诀」：对症下药，切中病情，找出他／她的桃花运旺盛的「显因」与「潜因」，并教／她如何与自己的伴侣相处。


    我曾经碰过一些桃花运很旺盛的人，我问他们：「为什么你可以左右逢源？」


    他们也说不出一个所以然——原因是他们不自觉地用了秘密心法，自己却懵然不知，适时我就需要透过推敲来「解读」他／她成功的密码。


    但有些桃花运旺盛的男人，非常清楚知道自己为什么可以令到许多女人对他死心塌地——这些人不但清楚知道如何「出招」，还懂得借助自己的「运势」，加上拥有本身许多客观的资源、人格上的特质，所以可以「永续经营」他们的姻缘。


    我常说，如果有方法的话，要制造姻缘很容易，但，要「永续经营」一份感情，则需要智慧，甚至爱情会有 一个有效期限，倘若你晓得相处技巧、「保鲜」技术，你的姻缘将会是离离合合，不会开花结果。


    在本书中，龙大师不但教你追求的技术，还会告诉你两人相处的禁忌，以及如何让双方的感情维持「新鲜」，以及彼此尊重之妙方。


    除此之外，龙大师还会在每一篇章中，提供桃花改运小锦囊来增强你的运势。


    是否你依照我的桃花改运小锦囊法，即使男人／女人「按兵不动」，自然就会有女人，男人自动送上门呢？


    我会问：「你说呢？」


    不！你若不具备把妹手段，也只是浪漫了这个桃花改运法。


    不过，你千万不要误会，以为只要学好把妹手段即可左右逢源。其实，即使功力再强，如果没有「运气」，你身边出现的女人也未必是你属意的美女，若是如此，你则空有把妹的手段。


    你要记住：桃花运其实是火，把妹手段其实是油，有了运气，配上手段就等于「火上加油」。


    倘若具备运气，配上把妹手段，懂得相处哲学，知道保鲜妙方，将可以让你的感情生活一帆风顺、水涨船高！


