    有时候男人是需要暗示的，例如我约女人，第一次对方说没有空，第二次又说没有空，第三次我就不会再约会她了，因为我会想，如对方也想把握机会，一定会给我一些暗示，例如她会提议另一个日子。


    这种情况很容易解读，正如我们与朋友在街上相遇，客套寒喧了几句，大家正想要离开时礼貌上会说：「有时间，我们喝茶聊天。」


    这句话，我们都可以将之视为礼仪上的应酬话，百分之七十彼此都不会因此而「有时间」，你若要提高喝茶聊天的机率，方法很简单，你可以说：「下星期三我们一起在 X X
    喝茶……」


    倘若没有人主动促成，大多数人都会因此而不了了之。


    但是，我的意思是不是要 P 小姐主动去邀约「他」呢？


    其实，我估计 P 小姐在过去一定没有制造机会让对方邀约自己，只要有小小的暗示，可能只是少少的一句话，就可以改写了他们俩的命运。


