    \n### 越赞得频密，女人越喜欢\n\n他跟我说，赞美的说话不嫌多，只会嫌少。对自己心仪的女性，一定要不停地赞美，那么女人才会知道你对她好感有多深。\n\n\
    有些人会觉得很难为情。这就像传销的营销人员一样，在开始的时候可能会不太习惯，当你不停地练习，过了一段日子，你自然觉得赞美女人是一件很自然的事情，这就是「熟能生巧」。\n\
