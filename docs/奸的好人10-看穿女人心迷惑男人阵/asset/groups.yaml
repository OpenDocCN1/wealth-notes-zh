    ## 第三篇 把握「恋爱黄金期」的方法


    ## 好好的炫耀一下自己，对异性不用太谦虚


    ### 「善意的谎言」令你增强运势


    我们做人不要自大，但很重要的一件事情，就是做人也不用太谦虚。


    在感情生活之中，真真假假，假假真真，所有的事都对自己伴侣讲谎话当然没有好处，但也不用太过诚实，有时候「善意的谎言」反而会增强你的感情运势。


    尤其是在未开始拍拖的时候，你更不能每事都如实告之。


    一来不好玩、二来诚实并不能为你的感情加分。反之，你若能把握上一篇告诉你划清界线的方法，更能提高你的价值，为你的感情「加温」。


    当双方约会的时候，无论男女，都要好好的炫耀自己一下，让对方不自觉地为你加分，更加快速的爱上你。但炫耀自己的方法要有两个方向，第一是「做人不要太过自大」，第二是「恰如其分的炫耀」。


    我先说第一个方向「做人不要太过自大」。


    有一次我为顾客看风水。顾客本是开车前往，看完之后，她主动说要送我回办公室。那里的环境偏僻，我也乐意有「顺风车」接送我回去。


    我们去到了停车场，就见到女顾客的房车。那是一部十年的欧洲车，在我来说已经够看头，车身保持的极好，看起来也觉得很新。


    女顾客突如其来对我说：「龙大师，真不好意思，我开的是一部比较旧的二手车，希望你不要介意！」


    我能搭顺风车已经很开心了，哪会计较是什么车呢？我马上对她说：「不要紧，有顺风车坐，我已经觉得很方便了，况且你的房车也不差呀！」


    女顾客的这句说话，令我有所启发：就是女客人的房车根本不是如她说的那么旧，而她却事先谦虚一番，或许这番话可能是客套话，但我觉得她用得恰到好处。


    有时候男女约会，可能会选一些比较高的餐厅。男的在这时切忌自以为是，说些什么：「这间餐厅真高级呀！」「让你这么破费，真不好意思！」之类的赞美话时，你才加上一句：「因为和特别的人一起吃饭，要到这样的餐厅才够匹配。」这就是恰如其分的炫耀了，这种炫耀就非常漂亮了。


    ### 对异性不用太过自大，但也不用太过谦虚


    我在前文说过，做人不要自大，但也不要太过谦虚，有时候，恰如其分地炫耀一下也是好事。


    男女约会之中，很多时候都会离不开吃饭，就算你真的经济能力有问题都好，如果你想着和对方顺利发展的话，在开始时一定要留给对方一个好印象，所以即使破费一点也要在所不惜。


    在确认与对方的交往之后，生活素质虽稍为下降，只要是正常的「良家妇女」，也不会和你太过计较的。


    例如第一次吃饭，如果是吃日本菜的话，不妨找一间高级一点的日本餐厅，女方自然乐于接受，也会对你留下好印象，总不能第一次见面就去快餐店，还要是各自付费吧？


    去到日本料理场所，你当然可以选择经济一点的套餐。但这样做实在有失身份了，而且女方一定对你的印象大大减分，请记住，第一次，花费多一点也不要紧。


    你大可以叫该店的日本师傅介绍，一般日本高级餐厅，都会有当天的推介，以求顾客可以吃到时令的刺身或其它熟食。


    这样做的好处是，你会让对方的印象加分，让对方有兴趣和你继续再交往下去，也让对方知道，你对于这段爱情的重视与诚意。


    我有一个女顾客对我说过，她和一个刚认识不久的男人约会，便提议去了一间日本餐厅。那顿饭吃了港币五百多元，结了帐之后，男的就问我的女顾客：「你觉得这一顿饭是否很贵？」我的女顾客就反问道：「你觉得呢？」那个男的很不识趣说：「我觉得很贵呀。」


    我的女顾客心想，第一次和她约会，吃一顿饭五百多元并不算贵，但这个男人这样说，女顾客对他的印象分数就大大减低了。


    在那男人来说，可能这顿饭真的贵了一点，但也不需要和女顾客实话实说啊，就算要说，也应该换个说法。例如：「这里的刺身不太新鲜美味，以经济价值来说不太划算，是吗？唔……下次我带你去另一家物超所值的日本餐厅。」


    这样说既可表达到你觉得这顿饭贵，也可趁机邀约下一次的约会。对方也不会因此而看低你，一举多得呢！


    此外，我们也可以在约会期间，间接炫耀一下，令女方对你有安全感。


    例如初次约会，你选了一间意大利餐厅。有些餐厅会有现场乐师奏乐，那你大可以预先告诉餐厅经理，叫乐师到你的餐桌前伴奏，这些钱，你未必在往后每次都要花，但在初期的约会之中，也是炫耀的方法之一。


    又或者，在数次约会之后，如果觉得对方是你可以和她发展的对象，那你大可以买一些高级一点的小礼物，这也是适当的炫耀方法。


    礼物不用太贵重，但需要是在那种类之中价钱比较贵的牌子。例如一个锁匙包，锁匙包本身价钱一定贵不过手表或钻石，但你可以买一个名牌的锁匙包给对方，相对来说消费未必是天文数字，大部份人都负担得起，但你会给对方一种「他很重视我」的感觉。


