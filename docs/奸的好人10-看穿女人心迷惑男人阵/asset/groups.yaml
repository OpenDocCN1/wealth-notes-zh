    于是，我的朋友和她随便谈了数句。没多久，他就说：「你涂的指甲油，颜色很特别呀！」


    那女人显然很开心，因为连我离得远远的也看到她笑得合不拢嘴。我再看一看她涂的指甲油，是粉红色的；坦白说，我真的不觉得有何特别。


    没多久，我的朋友又说一句：「你衣服的质地很好呀！滑溜溜的，很贵吗？」


    这招叫「假问赞美法」。


    譬如你看到一位美女走过来，你可以用「假问赞美法」来搭讪：「小姐，请问你有没有学过 CAT WALK？」言下之意，就是说这位小姐走路的姿态很像 Model，而
    Model 亦暗喻着她很美丽。


    当时，我这位朋友「假问赞美法」一出手，很明显看到该女人脸颊微微红晕，马上跟我朋友说：「才不是，很便宜的，我在普通的商场时装店买的，才不过二百多一件！」


    在那个场合之中，赞美对方任何事，原来是可以很受用的；因为我看到那女人开心得像小鸟一样，而我的朋友也顺势搭住她的肩膀！


    想不到，原来运用语言技巧，男人是可以很容易结识得到陌生女人的！


    诸位读者，你们可要留意我这位朋友的点穴神功，他点的两道甜穴就是「品味」，如果你要赞美女人的发型，你可以先赞美说：「……你的发型很美，你是给那位发型设计师 SET
    呢？」（注：这句「假问赞美法」是间接赞美她的手艺等同设计师，有设计师的 taste。）


    接着，我的朋友出了第二招赞美法。


    过了一会，只见我的朋友在不远处望向我，对着那女人说：「我在未过来之前，我的朋友说你人长得很漂亮，尤其是你那双大眼睛，真的很吸引人！」


