    \n### 连岳母也调戏的故事\n\n她还说，记得我正追求她过程，我请吃饭，点了醉酒鸡，我吃过后，也是脸红红的，突然把服务生叫过来，然后指着女友问服务生：「她对我一见钟情，你说我该怎么办？你认为，要不要她做我的女朋友？」\n\
    \n女友说，她本来想反驳，因为我「出口太快」，她想不到我竟然会这么「玩」，一时不知所措，所以只好假装没听到，女服务生却笑着说：「男才女貌，天生一对啊！」\n\
    \n另一次是太太的母亲陪我们吃饭，我们点了醉虾，我吃过后，突然把服务生叫过来，然后拉住太太母亲的手臂说：「我的女友，漂亮吗？」\n\n太太的母亲，推开我的手，骂我神经病，据她说，我追求她这两次借醉行凶，大家都笑得很开心。\n\
    \n如果你问我：「这些故事你是不是事先安排好呢？」\n\n我见顾客时所讲的故事，大部份都是事先计划好的，不过偶尔也会临场发挥；追求女人，以当时的情况，是没有设计任何的故事。\n\
    \n至于说我的第一次恋爱，我倒忘记了，追求过程有没有难度呢？\n\n我不记得，我只是知道，那个时候的我，还是没有信心，不像第二次恋爱，已经是药厂的顶尖营业员，整个人信心满满的，我第一次拉初恋情人的手过程是：我送她回家途中，当时应该很紧张，第一谈恋爱嘛，我忘了自己准备好再约她下次见面的台词，她要走进家门时，我一时情急说：「等等！」跨步向前，将她的手一拉，然后问她：「明天我们什么时候见面……」嘿嘿，就这样瞎猫碰着死老鼠，给我拉住她的小手了。\n\
    \n第一次恋爱，一谈就是四年，结果是因为这位女朋友，为了一位建筑供应商送了一辆车子给她，而跟我分手。\n\n## 男生懂「假问」、「借人」、「没想到」，没有把不到的\n\
    \n### 女人不喜欢被赞美，肯定不是女生，而是人妖\n\n在女人来说，赞美她的话永远不会嫌多。\n\n也因此，赞美你想追求的异性成为一个很重要的把妹技巧。\n\
    \n赞美，就是口甜舌滑，说出来的话，让听者心中流出甜丝丝的感觉，舌头把你逗得笑哈哈，俗话说，「他说的话能把树上的小鸟给哄下来」——这不是说明了口甜舌滑之功吗？\n\
    \n在春秋时代，有一位谋士叫张仪，话说有一次张仪喝醉酒，被流氓群殴打，被打得遍体鳞伤，他老婆看了自己的老公如此没出息，不断摇头叹息，张仪看到太太轻蔑的表情，马上伸出舌头，指着自己的舌头说：「老婆，你看到我的舌头吗？只要我这根舌头没有损伤，我可以凭着这三寸不烂之舌，求官位、得官位。」\n\
    \n张仪这句虎虎生威的话说明了说话技巧的重要性。\n\n我有一个朋友，把妹非常了得，他平均每三个月就换一个女朋友，其频密程度，连最疼他的姐姐也弄不清楚他到底有多少位女朋友，到后来，他姐姐连他的「现任女朋友」是什么名字也不知道。\n\
    \n有一次，他的爷爷快不行了，躺在医院之中，他去探望他的爷爷两次，两次的女朋友都不相同，而他的爷爷，竟然叫错了他女朋友的名字。可想而知，他的把妹技巧有多厉害，只要是他看上了，无论是学生妹，有夫之妇，有男朋友的女人，他一样手到擒来。\n\
    \n我问他有何秘诀。他说：「龙大师，其实很简单，就是不停的赞美你想追求的女人。」\n\n我问：「就这么简单？」\n\n他道：「对，就这么简单！」\n\n他和我分享他赞美女孩子的三大秘诀。\n\
    \n### 越赞得频密，女人越喜欢\n\n他跟我说，赞美的说话不嫌多，只会嫌少。对自己心仪的女性，一定要不停地赞美，那么女人才会知道你对她好感有多深。\n\n\
    有些人会觉得很难为情。这就像传销的营销人员一样，在开始的时候可能会不太习惯，当你不停地练习，过了一段日子，你自然觉得赞美女人是一件很自然的事情，这就是「熟能生巧」。\n\
    \n当然，你若要走「高血压」之路，你就不要赞美女人，要取消女人；赞美是走「糖尿病」之路，要让女人笑眯眯，甜丝丝。\n\n我用点穴功夫来做比喻，取笑女人的是点穴，让女人笑哈哈，笑个不停，我则是点甜穴，让女人心里甜蜜蜜。\n\
    \n我若说赞美很重要，但是，你胡乱赞美也未必奏效。\n\n### 赞美女生一定要言之有物\n\n我们在赞美女孩子时，一定要称赞一些具体的东西，切忌说一些：「你很美丽」，「你心地很好」之类的废话，我们称之为：「虚伪式的赞美」。\n\
    \n女人想听到的不是这些，而有一些实实在在的事情。\n\n譬如你对李老师说：「李老师，你很英俊。」我相信李老师内心会窃笑，但不认同你的看法，内心不会因此特别欢喜，只会觉得你很虚伪。\n\
    \n你若说：「李老师，你说话时，眼神很有霸气，具出版大亨的风采，还有枭雄的本色。」这时，即使你言过其实，但李老师内心不免有点窃喜——因为李老师最大的梦想是想壮大他的出版事业。\n\
    \n好话谁不爱听，即使雄才大略的秦始皇，流氓出身的刘邦，贵族身份的项羽都喜欢听好话，五千年历史的洪流中，多少昏君，多少雄才大略的明君都会被好话所迷惑。\n"
