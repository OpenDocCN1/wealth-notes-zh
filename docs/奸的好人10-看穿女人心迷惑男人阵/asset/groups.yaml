    到底什么是浪漫？


    浪漫是非常虚幻的糖衣（甜品），我相信你看了这篇文章，你中浪漫毒药的机率会减低，至少你有了权谋的免疫力，像接种疫苗一样，你就有浪漫的抗体，你若看穿此法，恭喜你，你的糖尿病医好了！


