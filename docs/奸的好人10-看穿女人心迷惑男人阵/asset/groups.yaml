    在我而言，只要能够负担女人整个生活的经济基础，女人自然会有安全感，感情的稳定度自然会提高，女人对此自然印象深刻。


    你若问我，龙嫂对此到底有多深刻？


    事隔多年之后，龙嫂不时还会说：「你现在为什么不给我增值八达通呢？以前你常常会为我的八达通增值呢！」表面上龙嫂带着责备语气，叨念现在不如以前般细心，但由此可见这些小事对女人来说却是细心的表现，因此事隔数年她依然还会记得，你说深刻吗？


