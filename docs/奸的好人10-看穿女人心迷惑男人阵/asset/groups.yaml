    \n正如我的太太形容我是很喜欢讲话的人，尤其是喜欢讲故事。打个比方，我追求她时看到大概三个月大的女婴，在我面前「啊~」了一声，我就说：「人的声音开口第一声就是啊~」就在那刻，电视正播放香港的电视连续剧，有一和尚念了阿（哦）弥陀佛，我就将电视看到的画面，连接起刚说的话，说：「刚才电视中，那位和尚念阿（哦）弥陀佛，他是念错音的，哦音是向下的，是下坠之音，啊是人类开口的第一音，是向上的，就像女婴刚才啊~啊~啊~，这就是第一音……」\n\
