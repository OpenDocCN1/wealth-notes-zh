    ## 如何令男人不停约会自己？


    ### 用科技制造机会


    我见了一个女顾客，当天晚上，她电邮给我，说她对一个旧同学有好感，问我是否相合。我帮她算过双方的生肖运程，而这个男孩是适合她的，于是如实相告，也顺道分享追求对方的一些方法。


    ### 利用电邮或 MSN 找恋爱切入点


    先试着用电邮或 SMS 联络他，最好找些借口，不能过早约对方吃饭，先试着向对方借东西，又或者用「平常都经过对方公司附近……」诸如此类的借口，相约对方晚饭之类，不能没有理由而邀约对方，因为这样会给对方一眼看穿自己底牌，自贱身价，不符合权谋术的原则。


    如他没有拒绝，你已经成功了五成，至少你没有抗拒，但不能确认他喜欢你。


    在吃饭时，不经意问他电邮，如果给你，又多了百分之五的成功率，即使拿到对方的电邮，也不能评定为对方对你有好感，因为大多数人都是不会介意。


    如果电邮为 hotmail，意味着你有机会直接 add 他进 MSN，也可以在饭局之中问他有没有玩 facebook，如有，又可以 add 对方。


    如果能够 add 对方进自己 MSN，又成功多了百分之五，因为 MSN 可以说很多东西，大家不是 face to face。有很多说话都可以在没有压力的情况下说出来。


    对方在 MSN 见到你，百分之一百不会觉得讨厌，如果对方对你没有抗拒，还可以给他一个惊喜。


    ### MSN 的解码技巧


    再来就是 MSN 的技巧，有很多事情都可以在 MSN 里解码：你可以慢慢解，将整个对话存进你的硬盘，有空拿出来研究一下也可以，这个过程绝对是一个乐趣。


    MSN 之后，可以渐渐再加一样东西，就是传送电邮给对方，看他的回复字数及反应时间，ການ可以解读他对你的喜欢指数。如果他对你喜欢指数越强，他回复的字数就越多，无话也想话题来跟你说，他反应的时间越快，则表示他常常留意你有没有留言给他，据此，你可以知道你在对方心目中的地位。


    若你要进一步测试对方的紧张指数，方法更加简单：「定时法则」。


    定时的意思是指在固定的时间，如晚上八点，就是在晚八点 MSN 或通电话，过了一段时间，你要密切留意对方是不是在即将八点时就守候在 MSN 旁了，如果是，意味着他很紧张你，如果说，他到了八点，你没主动联络他，他反过来联络你，表示他已经踩入习惯的陷阱了。注：亦可用这个方法通电话，玩简讯
    SMS。


    这时，当你看到男人踩入习惯陷阱之后，你则要慢慢后退，意思是等男人主动联络你，你回复的法则将转换。


    非定时的意思是，以前你是马上回复他，现在无需马上回复他，甚至有时候不必回复他，不过有时候又要马上回复他。


    ### 抛砖引玉，试约吃饭


    再来就是约吃饭，如对方再应约，那意味着对方已经有机会和你发展，红灯已转为黄灯，准备开绿灯；不过要留意，你第一次的表现，直接影响第二次出来见面的机会。


    这很像应征时的 interview 吗？


    对，男女之间的约会，其实就是 interview。


    以上的手法，是你可以做的事情，如果成功了自然很好；如果不成功，一定要问对方失败的原因。


    但要记着对方所说的话，未必全部是实话，你只能相信五成，其余的五成，你要自己再想想，再解码。


    想当年，我和龙嫂也是在网上认识的，那时没有 MSN，就只有 ICQ，哪种互相牵系、猜想的过程，我可以用「非常好玩」来形容，龙嫂不是一个容易对付的人，她心思慎密，而我分析力强，互相过招之下，就像下棋一样，我永远要预测她下三步怎样走，这个过程很有趣的。


    如果对方肯和你单独出街三次以上，那你已经成功了九成；如果在三次约会之中，他其中有一次是主动约你的话，那成功机会高达九成九，自己好好把握吧。


    Good luck!


    ## 如何令男人神魂颠倒——「三笑姻缘」八阵图


    ### 尤物足以移人


    某位很漂亮以及很懂得打扮的女顾客 V 小姐，在论命过后，我发现了她的桃花运特强，就借机和她闲谈，看看桃花运特强的女人共同的特质是什么。


    大家还记得我叫你们背诵下来，将之烙印在记忆里的话吗？


    男人看女人，最主要是样貌；女人看男人，最主要是内涵。


    我与这位 V 小姐闲谈的话题就围绕在：样貌！


    因为她说的数据实在太有道理及太有用，我想和各位女读者分享以下这句话：


    你身边的人，直接会影响你的打扮


    此话甚对！意思就是：你身边的朋友、同事、会直接影响你的打扮。


    我很喜欢这位女顾客所说：「如果你的朋友每个都是村姑打扮，你怎会打扮得花枝招展呢？」


    如果身边的朋友，同事不注重打扮的话，比方说大家在街市做小贩，摆路边摊，每天根本不需要打扮，自己又怎会打扮呢？


    ——你若打扮就是「离群之马」，没有人愿意做「离群之马」。


    如果大家都在中环上班，你做了没多久就自然会化妆，因为身边每个人都如「鬼火般美丽」。


    如果自己的生活圈子，全部都是师奶大婶，麻雀脚，有一天你刻意打扮，身边师奶大婶都会取笑你。久而久之，自己也不敢打扮了，物以群分啊。


    正所谓「物以类聚」，身边的朋友及工作本身是很重要的。

