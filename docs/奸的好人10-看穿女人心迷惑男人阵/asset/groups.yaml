    男人，我要你们明白，我们是生活在一个极度需要金钱的环境，每件事都会无可避免地需要与金钱挂钩。只要有钱，百分之九十九的东西都可以得到，所以男人应该专注于怎样提高收入，多于将时间聚集在找一个不要钱的女人。


