    方法如下：


    她可以很不经意说想换想买羽毛球拍之类的语句，接着问他在那儿买好比较好，什么款式比较适合，然后在他提议之后，她要说不懂怎么买，不知道是什么款式适合，这样就可以给他一个「约自己的陷阱」，如他对
    P 小姐还有一点意思，一定会主动提出要和她一同去买的建议。


    又或者，说说近期的电影，问他有没有看，而自己又说哪部电影好看，例如：「你有没有看过哈利波特？我听说很好看！」


