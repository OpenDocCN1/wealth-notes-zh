    \n这家餐厅的菜肴大有心思，「浪鳗套餐」菜单是：浓情蜜意、浪鳗一生、语燕新巢、玉盘金楼、永浴爱河、鸳风和鸣、雪峰斜景。\n\n当时我并不知道「鸳风和鸣」这饮料是有少许酒精，喝下后脸红红的，正吃完的当儿，来了两男两女，其中一位是大胖子，看样子四位年纪大约是十八九岁，他们就坐在我们的座位旁，他们坐下后并没有交谈，正确的说法是，女的跟女的谈，男的跟男的谈，接着两位女的就开始用手机自拍，男的依然继续跟男的交流，不知道是否酒精上脑，我特别大胆，我问胖子：「你想追那位？」\n\
