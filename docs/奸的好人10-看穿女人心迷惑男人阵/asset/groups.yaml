    看起来这方法很平实，但这些都是很管用的方法，总之沿着这个方向发展，方法有很多，你自己可以好好利用、变通。很多人都以为平实的招数太平凡、不特别，连邀约都要搞成花招古怪、成堆理由不可，说穿了就是想得太多。


