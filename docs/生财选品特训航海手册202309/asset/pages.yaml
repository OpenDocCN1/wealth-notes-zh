  md: "# 选品特训航海手册（7）\n\n软件|Xmind 来源|生财有术团队 制作|罗卜\n\n# 关于选品需要避免的坑\n\n+   - 产品转化率和带货达人数\n\
    - 商家体验分\n- 选品要合法合规\n- 带货佣金（15%-30%比较合适）\n- 不选特别小众的品\n- 视频展示效果要好\n- 不选质量差的产品\n\
    - 不建议新手选的品\n\n+   - 选择供货稳定的店铺，佣金稳定不调整且可谈的店铺\n\n# 抖音直播带货选品方法\n\n+   **标准的直播间选品类型**\n\
    - 秒杀款/起号款\n- GMV款/爆款\n\n+   **垂直类目选品**\n- 和常规直播间错位竞争\n- 用当日视频榜，来寻找潜在的热门款\n\n+\
    \   **蓝海单品选品**\n- 原则：重点主推单品，辅助用品\n- 新奇容易勾起大家的好奇心\n- 单价不高，一般在十几到几十块钱，尝鲜压力比较小\n\
    - 非标品价格不透明价格容易塑造\n\n+   **采集同行品类**\n- 1000 人以上的直播间出来，看他们是什么品，可以直接采集他们的\n- 黑桃百宝箱：直播商品采集一输入直播间链接一查询一件添加到橱窗\n\
    \n+   **选品优化思路**\n- 知道从何卖起的时候不要脑袋，可以把问题抛给客户\n- 不要迷信自己的判断，只看数据\n- 记住三点\n  - 每个人都觉得\
    \ 自己卖的东西质量号，人人都适合买\n  - 直播带货，形式是直播，带的是“货”\n  - 卖的产品不是要便（很便宜很便宜，而是要让客户觉得很便宜，买到就是赚到\n\
    \n+   **注意事项**\n- 找店铺评分高的\n- 看售后的服务\n- 选择销量高的商品\n- 复合商品链接\n- 商品的目标人群\n- 标题是达人专属链接\n\
    \n# 抖音后端小店选品方法\n\n+   **通过类目选品**\n- 按照30天销量或者推广次数进行排序，推广次数<50 说明自播达人。> 50 说明散户达人较多\n\
    \n+   **通过数据选品**\n- 30 天销量不低于 1 万说明市场需求量低，高于 30 万卖的太好了同行太多，不建议上。除非你有价格优势或者是能开高佣金\n\
    \n+   **通过产品分类选品**\n- 大爆款\n- 引流款\n- 利润款\n\n+   **通过货源平台辅助选品**\n- 1688：基本上可以做到当天发货晚上出揽件，商品退换货需要我们来但夜发出去的运费\n\
    - PDD：发货慢（拼单成功后24小时内发货）好评卡（最重要的是好评卡有PDD字样），抖音现在严禁好评返 X\n- PDD 查看无货源方法\n  - 真正的厂家商品数量是不会超过\
    \ 15 个的\n  - 查看商品的出评率\n\n+   **以客单价划分选品**\n- 9.9 以下低客单\n- 39.9-100 中客单，性价比价高\n\
    - 100 以上，不设上限的高客单，选高性价比的物品最好是品牌，利润高，佣金也是设置与别人差不多\n\n+   **利用货源或地缘优势选品**\n- 地缘优势\n\
    \  - 广东广州的服装，东莞的珍珠耳，增城的牛仔裤，揭阳的内衣裤，深圳水贝的珠宝，深圳南油的设计师女装，深圳华强北的电子产品\n  - 浙江义乌的小商品，温州的皮鞋，杭州四季青的，衣服\n\
    \  - 福建：靠海的海鲜和漳州的休闲零食\n- 货源优势\n  - 北京上海，可以利用品牌，二奢奢侈品，明星合作\n  - 浙江杭州，达人资源，基地资源，直播团队资源和知识\n\
    \n一生财研学社 【知识可囊，胜于财富】 9月航海 -7"
