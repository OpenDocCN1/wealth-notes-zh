  md: "# 选品特训航海手册（1）\n\n软件\\|Xmind\n\n来源生财有术团队\n\n制作\\|罗卜\n\n+   - 核心目的是希望大家掌握这项技能\n\
    - 案例是有时效性，今天有些明天未必有；A平台可行，B平台未必\n\n# 选品特训需注意\n\n# 人、货、场三要素\n\n+   - 人，有消费能力的人，即消费者/用户\n\
    - 货，流通中的商品\n- 场，指进行交易的场景\n\n+   假如我们不知道自己为什么成功，这样的成功无法复制；\n假如我们不知道自己为什么失败，这样的失败毫无意义\n\
    \n# 学习路径\n\n+   1. 理解选品的重要性，明确选品前的先决条件为主，了解选品的基本原则，打好地基\n2. 开始从通用的选品步骤入手，掌握底层逻辑，了解多平台都适用的选品方法论\n\
    3. 展示更多不同平台的选品具体方法，根据自己所做项目的平台进行选择性了解\n4. 对自己平台的选品有所掌握时，了解其他选品方法思路，是否可灵活运用自己的项目中；\n\
    5. 具体实操卡点的答疑（将沉淀在本手册百问百答中）和航海活动，将是以上三个阶段同时发生的伴随状态\n\n# 选品的三大核心原则\n\n# 1 市场需求的明确性\n\
    \n+   - 从产品出发，先确定了自己要做的产品，然后再想方设法地去提炼自家产品的卖点，寻找对应的目标客户。\n- 从市场出发，不管我看到底要做什么产品先圈定我的目标客户群体，研究他们的需求和痛点，最后再看我们到底要寻找或者选择什么样的产品来解决他们的需求和痛点\n\
    - 不在空白处找市场，而在市场中挖空白\n\n牛鞭效应：是信息从市场端流向供应链端的时候，会有异常的逐级放大的现象\n\n# 2 渠道和能力的匹配度\n\n\
    +   - 忽视的误区\n    1. 市场的需求真的强烈到我们感知到的那种程度吗？\n    2. 捷径走得多了，会变成一种习惯，然后一旦没有捷径可走时，可能连路都不会走了\n\
    - 核心竞争力\n    1. 我的工作是能够让客户/影响到具体的价值？\n    2. 我的优势是不是竞争对手难以模仿和抄袭的？\n    3. 我的能力和资源是否能复制到其他的领域？\n\
    \n# 3 采购与供应的把控力\n\n+   - 所有的竞争，本质上都是供应链的竞争\n- 供应链：提供客户价值的链条\n- 三种要素的流动，分别是·信息流、资金流和产品流。\n\
    \n供应链管理，是对信息流、资金流和产品流进行管理，通过对它们的优化调整甚至重新设计，以达到最大化客户价值，最小化链条总成本最快速进行产品交付的目的\n\n\
    # 从目的出发选品\n\n+   - 目标客户/用户是谁？（业务属性，采购倾向，预算能力等）\n- 他们的需求是什么？（有什么问题需要解决？当前有哪些方案？）\n\
    - 有哪些更好解决问题的潜在方案？（也就是产品）\n- 方案的载体可以是什么？\n- 去哪里找到这些载体？\n- 我是否具备将产品推广与销售出去的渠道或者能力？\n\
    - 我是否能够把握了产品的供应商以及背后的完整供应链？"
