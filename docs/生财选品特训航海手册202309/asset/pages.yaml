  md: '# 选品特训航海手册-快团团（15）


    软件 | Xmind


    来源 | 生计有团队


    制作 | 萝卜


    # 快团团选品方法（一）


    # 用沉浸式体验法找到精准用户画像


    TA 是谁？TA 是男生女生？TA 几岁了？TA 已婚还是未婚，家里有没有孩子（用户的基础信息）


    TA 在哪？TA 现在在干什么？（用户的日常行为轨迹）


    TA 最喜欢哪种社交软件，TA 爱看什么？（用户的喜好）


    TA 是什么工作，月收入多少？家庭资产多少？会住什么样的房子——平的房子？（用户的收入）


    TA 喜欢吃什么？TA 会消费什么类型的品牌？TA 爱买什么？（用户的消费水平）


    TA 最近有什么困扰？（用户的需求）


    弄清楚自己用户画像的重要性，只有找准、找准了用户画像，才能事半功倍


    # 铺量上品

    让自己的品

    自己跑出来


    每天上 100 个品，是一个合适我们的数字


    100 个品哪来？


    找大团长，音上，好的马上拿货（自己测评，加朋友团员）


    快团团官方商台（多商品图还有对应的素材）


    别的平台（拼多多、淘宝、抖音、卖得好的搬过来，做无货源（一般人我不告诉他））


    # 剖析用户+

    测品+筛选

    产品渠道+

    确认产品


    剖析自己的用户


    一不要盲目去追，会消耗掉自己客户信任度


    一旦成单了，后续的服务到位后


    要换位思考，选择大多数客户熟悉的品类


    测品


    一定不要选择售后多的生鲜产品


    选择客单低的产品


    初次尝试的产品，一定要去比价，客户讨厌被欺骗


    最后才尝试拿一些客单价高、利润好，特别是好的产品，来测你的客户的接受度。其中数据最好的价位产品是以后核心选品的类目，方向


    相同品质的产品，你的价格一定要比其他家略低


    帮卖团长选品原则


    售后率一定要低 | 售后率一定要低 | 售后率一定要低 | 重要的事说三遍，售后服务占用了你卖货 60% 的精力。


    利润好，卖货是一件苦恼的话，一定要让自己快速赚钱，不然后难以坚持


    筛选产品渠道


    选品先选择人


    选择垂直领域的很专业的团长，现在快团的供货团长已经发展成专注于自己垂直领域的产品


    Top 团长


    能成为 Top 团长，其产品价格基本没有问题，一定是最优质的，但是其服务或速度可能会有有一定的延迟


    权威推荐


    行业内相对权威的玩家，专门在私域里面玩，推荐的一些团长


    平台推荐


    行业公众号会推荐一些团长


    找专业快团服务团队咨询


    确认产品


    别人卖的好产品（团购数高、转化率高）


    能降低的试错成本


    利用消费者的从众心理促进容易开单


    差价大，全网最低价，利润好的产品


    一般的客户都无法拒绝，这种产品一般是品牌滞仓、或者临期的产品。


    标题很牛逼的产品


    原价 xxx，开团 xx


    几折清仓


    历史最低价


    0.01 或者 0.1 抢购


    山姆、ole、COSTCO 等同款（这类标题是突出品质背书，容易引起客户信任）


    链接内容，前面和尾部的内容很有影响力的产品


    本看基础逻辑：快团本质还是电商，客户看不到实物，选样的产品链接内容，需要让用户感觉性价比特别高。


    # 用数据来支撑选品和推品


    选品参考


    +   - 人群维度

    - 用户性别

    - 年龄范围

    - 需求维度

    - 转化率（查看数、订单数）

    - 出单率（最近订单时间排序）

    - 开团时间


    # 人货场逻辑选品


    +   - 先解决卖给谁的问题

    - 根据具体需求，再深挖群体卖什么产品

    - 基于对“人”的理解，我作为人货场的“场”，结合我的“吃货”属性，定位了“货”——性价比高的水果生鲜'
