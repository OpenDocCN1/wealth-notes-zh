  md: "# **选品特别航海手册（3）**\n\n软件\\|XMind\n\n来源\\|生财有术团队\n\n制作\\|萝卜\n\n生 财\n\n# **通用选品方法论**\n\
    \n# **蓝海选品思路**\n\n+   - 需要找到“求大于供”的市场机会，即为蓝海\n- 优先建议做高客单、高利润的蓝海产品\n\n# **前言**\n\
    \n+   - 查理芒格两个原则\n    - 学会在鱼多的地方\n    - 不要忘记第一个原则\n- 办汇曾经提出过：要做一个项目，需要拆解出最小闭环-流量-产品-变现\n\
    \n![](img/d67c75b2ba20cbe4cc78965021aadcb8_2_0.png)\n\n# **蓝海三部曲**\n\n+   - 有稳定流量\n\
    \    - 任何时侯去看它，表露出都是不温不火的样子\n- 产品很差\n    - 产品＝一个特定问题的解决方案\n    - 操作要点是“它比你能力范围能做到的更差\n\
    - 能稳定变现\n    - 粉丝量、用户量，不等同于能变现\n    - 偶尔变现，不值得追求“稳定”变现，才是我们喜欢的事\n\n# **怎么才叫“能稳定变现”呢？**\n\
    \n+   - 淘宝店每天都有单，也许不多，一百单，但他每天都是一百单\n- CPS 每天都有单，粉丝也就两千，但是每天能净利用三四百元\n\n# **怎么找到这样的蓝海品**\n\
    \n+   - 好处\n    - 竞争小\n    - 人工少\n    - 利润比较可观\n    - 适合普通人\n- 误区\n    - 忽略需求\n\
    \    - 依赖采集软件\n\n![](img/d67c75b2ba20cbe4cc78965021aadcb8_2_1.png)\n\n# **跟爆品**\n\
    \n+   - 看到其他的商家进行选品的爆单号之后我们也跟着上架同款产品，瓜分流量\n- 抖音常见两个类别\n    - 第一类是卖别人的货\n    -\
    \ 第二类是做自己的低价白牌爆品\n- 需要注意计算自己的能力和优势是否匹配，是否值得深入跟品\n\n![](img/d67c75b2ba20cbe4cc78965021aadcb8_2_2.png)\n\
    \n# **跟品需要注意哪些因素？**\n\n+   1. 近段时间产品的趋势是否向好\n2. 自己的产品在广告创意方面是否能吸引消费者\n3. 借鉴热门商品中好的地方\n\
    4. 对比价格，看看自己的商品在价格方面是否有优势\n5. 分析各大渠道，看看是否还有什么渠道没有可以跟品的广告素材\n6. 怎样在别人已经获得了大流量的情况下突出重围\n\
    7. 怎样能得到供应商的青睞\n\n![](img/d67c75b2ba20cbe4cc78965021aadcb8_2_3.png)\n\n# **兴趣电商跟品的优势和劣势**\n\
    \n+   - 优势\n    - 入局者多，样本数据多，能让人快速成长\n    - 对新手较为友好，如果能够早进场，竞争不大时热度高时，容易起号\n-\
    \ 劣势\n    - 品类有限，跟品这个方法适合自带流量，起号难度低，有“品牌人”特性的爆品\n\n# **周期性选品**\n\n+   - “季节性选品”，通常指的是根据不同的季节或节日选择和推荐的商品\n\
    - 注意：有货源的小伙伴需要计算周期和库存，避免积压货物\n\n根据自己的资源和能力，选择合适的策略和方法，确保商品能够吸引目标消费者，并在平台上取得好的销售业绩\n\
    \n# **用户需求选品**\n\n+   - 到底是什么是痒点？没有办法带来直接利益或者没有办法消除严重影响的，统统都只是痒点\n- 两个本质区别\n \
    \   - No Pain No Action.\n    - 痛能够确定预算\n\n![](img/d67c75b2ba20cbe4cc78965021aadcb8_2_4.png)\n\
    \n# **趋势选品**\n\n+   - 这个方式不太适用于新手，更适合有丰富的选品经验，能够承担一定风险的朋友\n- 劣势\n    - 大的机会空间也意味着更高的风险\n\
    \    - 可能会压低价格和利润率\n\n有 术\n\n--生财研学社\n\n**【知识可妻，胜于财富】**\n\n9月航海"
  merge: -1
  img_proc: true
