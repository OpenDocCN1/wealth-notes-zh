  md: "# **选品特训航海手册-快团团（14）**\n\n+   软件|XMind\n\n+   来源|生财有术团队\n\n+   制作|萝卜\n\n# **快团团平台分析**\n\
    \n+   - 平台特点\n  - 将社群、私域的力量放大，在熟人经济里，每个团长都是一个小的意见领袖\n  - 身边的好物推荐官\n  - 能实现高效利用私域流量\n\
    - 人群画像\n  - 对自己有所信任、粘性高、会考虑在私域场景下单的人\n  - 人群为 30 岁以上的女性\n  - 开团产品有非常多母婴、水果生鲜等类目\n\
    - 电商模式\n  - 帮卖团长: 即吸引一批垂直的人群到自己的私域中，在私域完成相关产品推荐和售卖\n  - 大团长: 大团长，也叫开团团长，作为这个角色我们需要自己有货品进行销售；邀请其他团长帮忙卖货\n\
    \n# **快团团选品方法（一）**\n\n# **新手团长的五大选品思路**\n\n+   - 选品维度\n  - 品类(红海，蓝海，复购率)\n  -\
    \ 品牌知名度(认知度和接受度)\n  - 价格(高客单价和低客单价，是否有价格优势)\n  - 服务(售后)\n- 结合自身或顾客特点选品\n  - 思考自己擅长什么，对什么领域了解\n\
    - 品类选择\n  - “有流量”的大品类种选择“有差异性”的子品类\n- 品牌知名度\n  - 品牌就是流量的保证，越大的品牌，认知越高，越容易销售\n\
    \  - 如果没有品牌知名度，可以从产地、工厂、原料来挖掘，让客户产生认知，就产品确实不错\n- 价格\n  - 希望能够更低价格买到好的产品\n  - 做不方便比价的产品，比如新的品类(市面上无法直接比价的商品)，比如非标品(定制类商品，特殊产品)\n\
    \  - 寻找一个“比价”的角度，避开产品和产品之间的直接比价\n  - 寻找一个主动对标的产品\n  - 最好也是选择做高客单价产品，前面会难一些，但是后期有了客户群，就更容易做\n\
    - 服务\n  - 供应商的售后服务很重要，售后的响应速度，退货的速度\n\n# **4 大选品逻辑**\n\n+   - 稀缺性、特色性，选择的产品是市面少见的或者特色性强，不选家门口夫妻店遍地都是的产品\n\
    - 背书强，选择的产品有销售的数据、渠道背书\n- 价差大，越大越好，用户都喜欢贪便宜\n- 利润高，售后少\n- 私密选品，围绕人无我有，人有我优。选择的产品需要具备稀缺、特色强、背书强、热度高、价差大、售后少\n\
    - 必须花时间了解、测试自己的客户群体详细画像\n- 一定需要测试，通过你的分析，选择不同调性、价位等产品去测试你的用户喜好，然后逐步的提升产品的准确性\n\
    \n# **IP 定位法**\n\n+   - 选品首先一点要关注的肯定是符合自身 ip 定位\n- 对于帮卖团长来讲，选品还有最重要一点即选择关注适合自己的大团长\n\
    - 是否靠谱\n  - 报价有没有水分？\n  - 售后处理是否流畅？\n\n# **4个路径搜集选品**\n\n+   - 自己平时在其他平台购买到的好东西，如果品质是过硬的，经得起考验的，那么我会去找卖家谈团购价开团\n\
    - 对于帮卖团长来讲，选品还有最重要一点即选择关注适合自己的大团长\n- 在群接龙平台上寻找，自己试吃，试用，然后和大团长对接，进入大团长的社群，观其言，查其行，看大团长的风格是否靠谱\n\
    - 先有需求，再去找合适的团品开团\n- 也有一些是朋友和团长介绍的靠谱供应链\n\n+   -生财研学社\n\n+   **【知识可美，胜于财富】**\n\
    \n+   9月航海 · 14"
