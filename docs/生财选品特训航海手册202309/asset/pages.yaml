  md: "# 选品特训航海手册-淘宝（18）\n\n软件\\Xmind 来源\\生财有术团队 制作\\罗卜\n\n+   平台特点\n* 平台的规模足够大，品类足够全\n\
    * 淘宝的覆盖面很广\n* 从清晰度、构图、色系、排版、素材等各方面综合打造\n\n+   人群画像\n* 用户年龄集中在 20-39 岁之间，其中以 25-29\
    \ 岁的年轻人为主力，包括学生、职场人士、家庭主妇和高端消费者等不同的消费人群\n* 学生通常年轻、消费水平较低，但对时尚、潮流商品有强烈的购买欲望，追求个性化、时尚的商品价格敏感\n\
    * 职场人士年龄多在 25-35 岁之间，消费行为相对稳定，购物频次适中，注重性价比，更加注实用性、功能性，对于品牌和质量的要求相对较高\n* 家庭主妇年龄在\
    \ 30-45 岁之间，消费水平相对较高，也相对稳定，购物频次适中，更注重家庭用品、母婴用品等高品质实用商品，对于产品的品质、性价比和安全性有着极高的要求\n\
    * 高端消费者年龄在 35-55 岁之间，消费水平较高消费频次较低，单次消费金额较高\n* 因此能够更快速的被更多目标用户搜索到和看到是淘宝商家的运营重点\n\
    \n+   电商模式\n* 淘宝的玩法有很多种，包括传统电商、店铺、蓝海、内容电商（猜你喜欢、淘宝逛逛）、直播等\n\n# 淘宝平台选品方法\n\n+  \
    \ 蓝海选品\n* 淘宝蓝海选品的标准\n* 付款人数：代表有多人下单付款购买了你的产品\n* 月销笔数：宝贝的销售笔数\n* 收货人数：付款人数当中已经确认收货\n\
    * 搜索人气：一个 IP 搜索一个词算一个人气\n* 点击人气：同理，一个 IP 点击一个宝贝算一个点击人气，相对于[点击热度]，点击热度指的是点击次数\n\
    * 在线商品数：是指的包含有这个关键词的在售宝贝数，在线商品数越多，竞争就越大\n* 商城点击占比：指的是点击点击次数里，有多少百分比的点击是点击的天猫店\n\
    * 直通车参考价：所选关键词当前的直通车参考点击单价，直通车参考价越高，说明推广出价越高，竞争越激烈\n\n+   选择蓝海产品的基本原则\n* 对手弱就主要指\n\
    \t* 销量没有那么高按销量排序，销量最高的收货人数一般不超过 1000;\n\t* 商城占比不高：一般占比不超过 20%。\n\t* 运营水平差：主图，详情页等视觉效果很差，基本上是美图秀秀水平，比如我的首营酵素\n\
    * 对手少，主要指\n\t* 绝对卖家数量少在线商品数低，一般不超过 5000\n\t* 相对卖家数量少：日搜人气大于在线商品数\n* 具体指标\n\t*\
    \ 过去 30 天每日搜索人气基本在 1000-5000 左右（通过阿明插件转化日搜索人数基本在 500-1000 人左右）\n\t* 这个产品商城点击占比不高于\
    \ 35%，天猫，全球购等店铺越少越好，最好是没有。\n\t* 关键词竞争度=日搜索人气/在线商品数>1（尽量保证每个宝贝 1 天可以分得 1 个人以上）\n\
    \t* 客单价尽量在 100 以上，才能保证每单有足够的利润。（我的标准是 1 单 50+利润以上）\n\t* 通过手淘搜索产品的蓝海词，销量第一月销量在\
    \ 300-500 以下，对手主图详情页越差越好\n\n- 生财研学社 【知识可素，胜于财富】 9月航海 - 18"
