  md: "# 选品特训航海手册-小红书（8）\n\n软件\\Xmind\n\n来源\\生财有术团队\n\n制作\\萝卜\n\n# 小红书店铺选品方法（1）\n\n\
    +   - 很多用户做消费决策的一个重要工具\n- 大家决定吃什么，买什么，去哪儿玩之前，都会到小红书搜一搜\n- 是一个离钱很近的平台\n\n+   -\
    \ 有超 2 亿月活用户\n- 72%为 90 后，50%分布在二线城市\n- 有 4300 万+的分享者，男女用户比例是 3 : 1\n- 自发式的分享笔记\n\
    - 笔记内容多元化，并且会结合当下热点和潮流\n- 女性在平台展现出懂生活、爱生活、热爱分享的一面\n- 都市白领、职场精英女性是小红书的主要用户群体\n\
    - 51%的用户相信营销宣传对商品的功能介绍，50%的用户觉得营销宣传越多越值得信赖，49%的用户觉得营销宣传让自己\n\n+   - 笔记带货\n   \
    \ - 需要达到 1000 粉丝，开通带货权限\n- 开小红书店铺\n    - 自己卖产品，品牌或有产品的做自营\n\n# 如何选择蓝海赛道\n\n+ \
    \  - 推广笔记篇数和笔记互动总量\n\n+   - 品牌品类搜索\n- 既包含品牌又包含产品，会更具体一些\n\n+   - 内容分：指的是含有这个关键词的内容数量，数值越高说明写这个内容的人越多\n\
    - 传播分：指的是内容的播放量和分享情况，数值越高，说明内容越受欢迎\n- 搜索分：就是指有多少人搜索过这个关键词\n\n+   - 内容分越低，传播分和搜索分越高，这个赛道就越好做\n\
    - 蓝线：代表内容供给，也就是这个赛道内产出的内容数量\n- 绿线：代表内容消费，意思是有多少人观看这个内容\n\n+   - 一是官方的软件会比第三方软件数据更精准\n\
    - 二是可以更好地了解当下上升指数最快的一些热搜和转化词\n\n+   - 无脑选品\n- 拼多多选品\n\n--生财研学社\n\n【知识可麦，胜于财富】\n\
    \n9月航海 -8"
