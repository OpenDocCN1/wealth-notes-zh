    \  - 热点选品法\n    - 热点选品法的产品往往就是一波，时效非常短暂，热点过去之后，产品的热度也会随之下降\n  - 利基选品法\n    - 在较大的细分市场中具有相似兴趣或需求的一小群顾客所占有的市场空间\n\
    \    - 优势\n      - 很容易成为头部的 Top1、Top2\n      - 成为 Top1、Top2 之后比较容易建立壁垒\n     \
