  md: "# 选品特训航海手册-TikTok（17）\n\n软件\\Xmind\n\n来源|财有术团队\n\n制作\\罗卜\n\n+   - 进阶选品策略\n\
    \  - 视觉选品法\n    - 好看，就是价质\n  - 认知选品法\n    - 认知选品法\n    - 混淆概念\n    - 卖家与消费者之间在某个事物上存在认知差\n\
