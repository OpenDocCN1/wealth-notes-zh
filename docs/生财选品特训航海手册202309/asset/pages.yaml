  md: "# 选品特训航海手册（4）\n\n软件\\Xmind &nbsp;&nbsp; 来源生财有术团队 &nbsp;&nbsp; 制作\\萝卜\n\n我们在选品的过程中，不要轻易自己做判断\n\
    \n+   1. **选品的通用步骤**：\n   找到一个成功的案例对标，然后对这个案例对标进行充分的、全面的数据分析和节点拆解，分析出它是否赚钱以及它成功关键节点是什么\n\
    \n+   2. **选品六步**：\n   * **1** 找一个成功的赚钱案例进行论证\n      - 案例寻找：通过各平台对应的一些数据平台、排行榜、搜索对标等\n\
    \      - 生财有术社群中有大量的帖子和风向标分享了很多的机会\n      - 复制或参考这个成功模式至关重要\n   * **2** 分析这个案例成功的关键节点\n\
    \      - 动作与策略\n      - 关键资源与条件\n   * **3** 自己的能力是否可以匹配成功节点\n      - 不仅仅是金钱上的考虑\n\
    \      - 还包括人力、时间、资源等方面\n   * **4** 一比落地地模仿\n      - 它卖什么款，我们卖什么款\n      - 它做什么场景，我们做什么场景\n\
    \      - 这个环节建议先不要去谈超越，谈创新\n      - 而是看案例中他们是怎么做的，我们就怎么做\n   * **5** 集中精力把模仿点做到最佳\n\
    \      - **注意**：\n        - 每次测品都要有明确的目的性和方向\n        - 小红书重点测多个笔记封面+标题，测试至少12个笔记\n\
    \        - 抖音、视频号重点测多个视频混剪+标题\n        - 直播间重点测直播各要素+话术\n        - 淘宝则需要通过投投放，布局关键词，人工干预等方式测试\n\
    \   * **6** 先抄后超，达到对标的目标后再开始考虑优化\n      - 达到了和案例一样的数据之后才可以开第二个直播间，第三个直播间去复制\n\
    \      - 几个直播间再做好了以后，我们才有资格去拍短视频，去搞投流付费\n\n这个领域成为第一名了，没有可以借鉴的案例，所以去做创新\n\n--生财研学社\
    \ &nbsp;&nbsp;&nbsp;&nbsp; 【知识可羡，胜于财富】 &nbsp;&nbsp;&nbsp;&nbsp; 9月航海 -4"
