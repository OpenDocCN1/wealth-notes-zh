  md: "# 选品特训航海手册 (6)\n\n软件Xmind 来源|师父有术团队 制作|罗卜\n\n# 抖音选品的N种方法\n\n+   1. 通过寻找对标账号的选品\n\
    \   - 在选品时，有个最重要的一个方法是[对标]\n   - 在抖音环境里，通过原始的搜索寻找相同领域里的头部账号的选品\n   - 通过工具，快速定位相同领域里的账号的选品\n\
    \     - 蝉妈妈\n     - 抖查查\n\n+   2. 通过抖音[商品]功能搜索选品\n   - 在抖音里[搜索栏]-输入[玩具]点击[商品]栏-----点击[综合]\n\
    \   - 注意：千万不要点按照销量排行，因为销量排行很多是历史数据，不代表着是最近最好卖的\n\n+   3. 通过关键词选品\n   - 核心策略\n\
    \     - 适合判断趋势，以及找产品关键词\n     - 通过在大类目下找到最近呈现上涨趋势的小类目\n     - 再从小类目里找到最近呈现上涨趋势的二级分类目\n\
    \     - 以此类推，最终找到合适的选品\n     - 爆款是一个轮回，曾经爆过的品，很有可能再爆一次\n\n+   4. 通过热门视频选品\n  \
    \ - 在抖音搜索框中搜索玩具\n   - 排序选最多点赞\n   - 发布时间选一周\n   - 搜索范围不限点击搜索\n   - 筛选3天内点赞最多的相关视频\n\
    \   - 查看他们拍的什么品\n\n+   5. 通过精选联盟产品为线索选品\n   - 在抖音账号，点击我的，点击商品橱窗，点击选品广场，输入关键词玩具，然后看综合推荐选品\n\
    \   - 选品线索\n     - 根据销量高低，寻找适合自己的选品线索\n     - 根据销量排名，寻找适合自己的选品线索\n     - 根据月销量、商家体验分等，寻找适合自己的选品线索\n\
    \   - 注意:商家的月销量最好大于5000，商家体验分大于4.5分\n\n+   6. 通过精选联盟店铺为线索选品\n   - 在抖音账号，点击我的，点击商品橱窗，点击选品广场，输入关键词玩具，点击[店铺]，然后看综合推荐选品\n\
    \   - 选品线索\n     - 根据销量高低，寻找适合自己的选品线索\n     - 根据销量排名，寻找适合自己的选品线索\n     - 根据月销量、商家体验分等，寻找适合自己的选品线索\n\
    \   - 注意:商家的月销量最好大于2000，商家体验分大于4.5分\n\n+   7. 通过类目来选品\n   - 电脑上搜索蝉妈妈登录账号，点击音分分析平台，点击商品选择类目，点击有视频带货，点击视频带货为主，看下商品销量情况进行选品\n\
    \n+   8. 通过第三方抖店工具进行选品\n   - 抖小鸭\n     - 抖音爆款采集\n     - 类目采集\n\n+   9. 参考拼多多潜力榜单进行选品\n\
    \   - 抖飞飞\n     - 按照类目筛选pdd热销商品\n     - 如选择了母婴玩具-级类及玩具二级类目\n     - 按照标题、小店家名、价格\n\
    \     - 近一天销量、近7天销量、30天销量、近7天增量来展示\n\n+   10. 通过搜索“求购”来挖掘选品线索\n   - 在抖音搜索“求购”，搜最新的排行，每一条的排查下去，会找到很多真正的刚性需求\n\
    \   - 做生意本质就是低买高卖，知道需求，就可以满足需求，甚至深挖\n\n根据市场供需关系（参考上一节同标题)"
