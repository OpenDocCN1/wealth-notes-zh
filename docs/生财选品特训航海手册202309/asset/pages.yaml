  md: '# 选品特训航海手册-视频号（13）


    软件|Xmind


    来源生财有术团队


    制作|萝卜


    ![](img/d67c75b2ba20cbe4cc78965021aadcb8_12_0.png)


    +   选择账号 (抖音快手等平台)


    +   账号的商品越少越好 (这样的账号视频内容都比较垂直)


    +   博主涨粉情况-近3个月新起账号 (比如粉丝30万，近三个月涨粉30万，账号涨粉比较稳定，而不是一个或者两个视频涨起来的)


    +   视频更新频率-90天更新的视频，视频的点赞和商品转化是否比较平均，视频更新越多越好


    +   视频内容-内容比较垂直，基本都是带货视频为主


    +   有直播能力的可以具体分析查看账号直播内容(这种账号直播间都比较简单，后期视频有流量，买回样品可以直接开播)


    +   中医、医药类相关的选品，不能上 (医药类在任何平台都是严打)


    +   选品必须要避开的坑


    +   尽量避免以真人为主体 的视频内容，这很容易触发真人验证，然后号差不多就废了


    +   选好品了，结果视频号选品中心没有怎么办?没关系，只要自己或朋友的微信小店可以上架商品就可以，不要因为这 点放弃选品


    ![](img/d67c75b2ba20cbe4cc78965021aadcb8_12_1.png)


    +   集中测品法


    +   假设有5个号，也选定5个品类，一般的做法就是每个品类每天10条视频发布于同一个号，也可以同时测品


    +   分布式测品法


    +   定了人群，未定品类或品，可以同时发不同品类的视频，哪个爆了继续发，其他删掉


    +   暴力测品法


    +   把对标视频，直接搬运后发布，3天0播放就直接换，如果爆了，就马上精耕细作。这种适合账号多的人，虽然完全不做去重，爆款概率低，但是节省下来的时间，可以多做几个账号


    +   带货 /流量视频的比例


    +   坊间有的说三七比，有的说五五开


    +   你不知道这个品到底效果如何，前期可以多 发一些流量视频，爆了之后，再去测品


    +   137法则


    +   第1天: 破300播放，账号正常，视频正常，继续。


    +   第3天: 能破300播放，一切正常，继续。如果没有，可以考虑换对标视频，原来的隐藏。或者，可以尝试拍一下窗外的风景配个音乐，看看有没有播放，如有，则号正常，是去重做的不够的问题


    +   第7天如果能过去重，但是视频不能上推荐，果断注销重来。以此循环反复，直到每个号都稳定播放，稳定出单


    --生财研学社


    【知识可羡，胜于财富】


    9月航海 -13'
