  md: "# 选品特训航海手册-视频号（12）\n\n软件|Xmind\n\n来源|生财有术团队\n\n制作|罗卜\n\n+   **快速选品方法**\n\n\
    ① **看视频号直播广场-购物分类**\n\t- 找看起来不太专业(明显不是 MCN 专业达人、PGC 内容的, 看起来是和我们一样的普通人运营) 但场观超\
    \ 500 的直播间\n\t- 不太专业的特征(如头和封面一致, 没有样品展示, 直播间环境明显和商品无关, 主播不怎么和观众互动)\n\t- 为什么要看场观超\
    \ 500 的: 场观超 500 才意味着看量起来了, 一共有两种可能, 一是直播间本身得到了系统推荐, 二是从短视频流那边来了\n\t- 找出里面爆了的视频(爆款视频的判断标准:\
    \ 超 100 赞) 以及该视频带的品 (有概率是个有潜力)\n\t- 主要看销量、带货达人数等, 同时注意避开红海品类\n\t- 常用网站: 精选联盟、考古加,\
    \ 其中考古加数据更新快, 没有使用门槛, 精选联盟有粉丝、小店、保证金等限制\n\t- 找粉丝数百万以下 (不容易和别人重复)、月销售额 10w 以上的达人\
    \ (说明这个达人收入高)\n\t- 从他们的视频里找到合适的视频素材, 并到视频号搜索相关的关键词, 避免选择已经被别人盯上的视频\n\n② **看这个号的短视频情况**\n\
    \n③ **到数据网站验证该品的数据是否可观**\n\n④ **在该视频的带货达人、带货视频里找到合适的模仿对象**\n\n+   **选品方向推荐**\n\
    \n\t- 书籍类: 国学书籍、名人传记、婴幼儿绘本等\n\t- 服饰类: 大码女装、头饰、脚链等\n\t- 家居百货类: 房子防水材料、防水产品、面条机、老花眼镜、定时提醒的药盒、老人购物车、老人防走失用品、穿刺器、拐杖、广场舞音响、老人收音机等\n\
    \t- 其他: 老人手机、多功能护理床\n\n中老年人群体可以挖掘的空间很大\n“场”现在就是视频号，我们要思考的重点就是这个场的“人”是怎么样的，然后再给这些人匹配以适合的货\n\
    \n+   **选品避坑点**\n\n\t- 选择商品 (抖音快手等平台)，从上到下依次不断淘汰\n\t- 选好商品或者视频后一定要去视频号查看是否没被搬运\n\
