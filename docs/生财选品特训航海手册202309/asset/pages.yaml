  md: "# 选品特训航海手册-视频号（11）\n\n软件Xmind\n\n来源 生财有术团队\n\n制作 罗卜\n\n# 选品的基本步骤\n\n+   - 工具辅助\n\
    \  - 目前微信没有开放任何查询端口给外部，这意味着我们获得的数据有时会有较大差异\n  - 操作流程:抖音好货 - 找商品 输入关键词 “父亲节” -\
    \ 搜索\n  - 如果想要大范围捕捞，可以只选一级类目，一页一页去看就能把最近的爆品都找出来\n  - 如果想要精准选品，可以精确到三级类目，按领域的细分赛道做选品\n\
    \  - 考加加\n    - 热度类视频选品\n    - 关注两个指标\n      - 关联达人:看达人所做的视频数据与质量，便于后期像素级模仿\n\
    \      - 关联视频 直接找视频，观察数据与质量，便于后期进行二次创作\n  - 细分类目选品法\n    - 抖音好货 - 找商品 选择商品分类 选择带货类型\n\
    \    - 关注 30 日销量和转化率\n    - 价格: 尽量不选择价格太低的品，需要留出利润空间\n    - 成交画像: 视频号建议年龄层选择 50+\
    \ (41-50这个年龄层也可以)\n  - 可以用一个表格记录下来，慢慢形成自己的选品库\n  - 巨量算数\n    - 可以获得关键词指数、关联分析和人群画像\n\
    \    - 巨量算数官网还有榜单，可以查询各类产品的热度情况，为我们的选品做辅助\n  - 微信指数:微信内搜索 “微信指数”\n    - 点开微信指数后，我们以蜂蜜为例进行搜索\n\
    \    - 在选择并使用工具时，我的建议是精不在多，只要你能摸透这么一两个工具为自己所用就够了\n\n+   - 主观选择&排除\n  - 看喜好\n \
    \   - 年轻人喜欢的东西，可能大概率卖不出去\n    - 自己不喜欢的东西，可以视情况不卖\n  - 凭经验\n    - 夫妻喜欢的东西、娱乐消遣，可以视情况卖\n\
    \    - 有时候经验也是错误的，但可以参考\n    - 你过往的经验和经历，都会是财富，用着眼晴想一想吧\n  - 刷抖音、快手、视频号\n    -\
    \ 每天一定要抽出空来刷三大平台的视频，把你认为可以卖的产品截图做参考和备选\n    - 这个是一个需要每天重复的累活，但总会有惊喜\n\n+   - 客观验证&判断\n\
    \  - 研究竞争对手\n    - 是否有人做?(判断能否入场，竞争是否激烈)\n    - 他们的视频数据如何?(判断对手实力，预估自己数据)\n  \
    \  - 他们的销量如何?(预估自己的利润，是否值得)\n    - 目的是找到竞争人数少，或者竞争者都比较弱的品\n  - 是否有视频来源\n    -\
    \ 做法很简单，在抖音、快手搜索[名称]，看是否有相关视频\n    - 专门做单一品类的达人 (是否有，决定我们是否有参考视频的来源是否多，决定我们是否可以筛选最好的)\n\
    \    - 某达人的视频数量是否够多(决定我们能参考多长时间，如果只有 10 条，那一天就发布完了)\n    - 达人的点赞数据、销量数据(研究他们在抖音平台做的如何)\n\
    \    - 需要注意的是，尽量避免以真人为视频主体的内容，这很容易触发真人验证，然后号差不多就废\n  - 调查商品来源\n    - 去 PDD、淘宝、1688\
    \ 搜索你要带货的商品\n    - 前期只要保证有同款商品，并且价格有利用空间那就没有太大的问题\n\n+   - 总结\n  - 视频号无该商品，或竞争不激烈\n\
    \  - 抖音、快手有数量和质量不错的带货视频可以搬运\n  - 电商平台有该商品，并且利润足够\n  - 反复选择-验证"
  merge: -1
  img_proc: true
