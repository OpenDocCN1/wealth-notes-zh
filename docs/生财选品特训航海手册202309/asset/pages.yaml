  md: "# 选品特训航海手册（2）\n\n软件|Xmind\n\n来源理财有术团队\n\n制作萝卜\n\n生——明确自己创业所处的阶段积累预期——财\n\n\
    +   * 创业初期 \n\t - 没有太多的资金，甚至有你现在负债，急需稳定收入 \n\t - 这个时候，更多的是要去下场把这个事给走一遍，能够赚到第一块钱\
    \ \n* 创业2-3年 \n\t - 需要做选品 \n\t - 除了看产品的竟争度以外，要考虑对产品的长期性、积累性 \n* 有积累的 \n\t - 选品就不会单纯的从就是蓝海角度来考虑\
    \ \n\t - 考虑到这个产品的未来的增长性、复购率、供应链解决难度\n\n+   1. 从平台的角度考虑选品 \n\t - 选品要适应不同平台的特性 \n\
    \t - 从市场出发，先不管我到底要做什公产品先圈定我的目标客户群体，研究他们的需求和痛点，最后再看我们到底要寻找或者选择什么样的产品来解决他们的需求和痛点\
    \ \n2. 从平台综合度来看 \n\t - 像淘宝、拼多多、京东这类其实是一个单一的专业的平台 \n\t - 会在抖音、视频号等平台上做很多事情，会根据兴趣爱好来推荐，不限于购物需求\
    \ \n\t - 抖音、视频号 \n\t\t - 优势：对用户拿捏的精准 \n\t\t - 劣势：用户不是真的把它当做—一个购物的平台 \n3. 从发现逻辑上来看\
    \ \n\t - 淘宝、拼多多这类是以搜索为主导的电商平台 \n\t - 抖音、小红书这类以兴趣为驱动的电商平台 \n\t - 兴趣电商更重视的是内容、素材和互动性\
    \ \n4. 从展现形式来看 \n\t - 淘宝虽然也有直播、视频和图文的模块：商品展示 \n\t - 抖音直播，一个I VI的销售\n\n根据自己的资源和能力，选择合适的策略和方法，确保商品能够吸引目标消费者，并在平台上取得好的销售业绩\n\
    \n+   * 兴趣电商 \n\t - 抖音 在-线和二线城市，抖音受欢迎程度极高 \n\t - 快手 在-线和二线城市的受欢迎程度较高，不及抖音 \n\t\
    \ - 小红书 在-线和二线城市非常受欢迎，特别是在女性用户和时尚爱好者中 \n\t - 需要从真分析这个产品的特点、人群定位，再去找目标人群较多的平台去运营，才更有可能成功\n\
    \n+   * 目标人群的定位 \n\t - 清楚自己所做平台的人群定位 \n\t - 清楚自己所做产品的人群定位\n\n有——有明确的目标人群定位，在选品的时候，可找这群人需要的产品而不是看到—一个很厉害的品就上架——术\n\
    \n--生财研学社 【知识可麦，胜于财富】 9月航海"
