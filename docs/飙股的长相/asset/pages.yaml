    # 擴大思考同類股的概念


    最後，我還會把「同類股」的定義，延伸得比「相同產業」更廣，只要是有某些共通點，可以互相比較的個股，我都會視為同類股，拿來分析比較。例如同樣受惠於日幣升值（或貶值）的公司，或是同時掛牌上市的新興企業。目前日本的上市股份公司約有四千家左右（台灣在2013年為1,448家），即使是專業的投資人，也很難做到一一詳細分析。因此，我會把發展趨勢相似或承受相同風險的企業，視為同類股來分析比較。


    比方說，烏龍麵連鎖餐館和居酒屋連鎖餐館，獲利的趨勢通常剛好相反。景氣差的時候，烏龍麵餐館的獲利會變好，居酒屋的獲利則會變差。即使如此，我還是會把這兩種公司視為同類股，因為它們都是外食產業。'
