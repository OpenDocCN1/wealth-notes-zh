    # 下跌局面，買股票要特別小心


    混亂期很漫長，而且在當中的平穩期裡，下跌局面會不斷出現；而下跌幅面，正是累積資產的大敵。投資人如果還在下跌幅面進場，大多會以失敗收場，因為就算買進的股票基本面很漂亮，也會被大盤指數拖累。


    例如下頁圖表6-10的日本網路廣告公司Cyber Agent，其股價在創新高前，獲利分別成長了45%（六個月前）、59%（三個月前）和202%（當季），獲利表現這麼亮眼，股價卻跌了39%。之後，它的獲利繼續創下142%、124%的三位數成長，可見股價下跌，絕非投資人下看好它的未來獲利所致，而是受到日經平均指數下跌波及（從2010年4月開始進入下跌局面）。


    因此，當大盤重新回到上升局面，Cyber Agent便創下新高價，然後在短短兩個月內，股價又從創新高價的位置往上繼續漲了58%。所以，無論你是買在2010年春天創新高價（實線）的位置，還是買在秋天創新高價（虛線）的時候，報酬率都差不多（不過，實線的範圍超過79%，實在太大，稱不上平穩期，從這個觀點來看，春天'
