  md: '# 觸感的長相・別冊


    過，但是現代未必能成為傳統。」借用這句話的精髓即是：「潮流常從流行開始，但是流行卻未必能成為潮流。」因此，流行與潮流的研判關鍵，即在於是否禁得起時間考驗。


    如何才能禁得起時間考驗？經濟學上說：「需求創造供給。」直接點出重點——需求，只有提供真正可以滿足消費者需求的解決方案，才能可長可久。舉例來說，蘋果出產的iPad，一上市即熱賣，還造成風潮，它滿足了大多數人希望「操作簡單」、「只想像」的需求，因而創造出一個新的市場區隔。


    既然如此，流行之初如何研判能否成為潮流呢？我建議可以分為兩個階段研判，首先是從「需求強度」分析，可以從英文的「Must」（必須）、「Need」（需要）、「Nice
    to have」（有的話不錯）三個等級來看，如果該產品對於滿足我們的需求有強烈的必要性，比如現在幾乎人離不開手機，這個需求強度便達到「Must」等級，所以蔚為潮流的機會就很高。


    第二個階段的研判，就是成為流行性商品後，是否只是曇花一現。根據經驗法則，有一個具體的魔術數字可以參考，那就是「1,000萬個單位」。如果產品的年度銷售量可以突破1,000萬個單位時，應該就形成了趨勢或潮流，因為這代表著幾個意義：


    +   1. 有足夠的樣本數（消費者）證明該產品可以做市場普通接受。


    +   2. 這樣的規模表示不是小眾的利基市場（niche market），很可能是大利基。


    +   3. 這樣的規模足以形成一個產業讓供應商積極投入，有利於產業長期的發展。'
