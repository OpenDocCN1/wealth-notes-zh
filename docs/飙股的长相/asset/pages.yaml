    # 股市裡沒有「落後補漲」這回事


    獲利重點：落後未必補漲，必然是檢查有無「獲利不佳」這個致命傷。


    重要度：★★☆


    我們常聽電視上的財經名嘴說：「很多投資人看上這支股票，就是看準了它會落後補漲。」他們要表達的意思是：漲是會漲，但時間會比別支股票慢。


    漲幅落後的股票，真的會補漲嗎？我們先來定義什麼是「落後補漲」：在一段特定的時間內，如果A公司股價漲幅為100%，但相同產業的B公司卻只漲了30%，那麼B公司就有機會落後補漲。所以，「落後補漲」的選股策略就是判斷B公司之後會補漲70%，而搶先一步投資。


    實際操作股票時，假如這個策略真的有效，那麼人人都能輕鬆賺大錢了。你仔細思考後，就會發現這個策略有個致命缺點：除非大多數的投資人都察覺到它只漲了30%而買進，否則B公司的股價未必能補漲。真正聰明的投資人會倒過來想——某檔股票的漲幅會落後，背後肯定有什麼原因。'
