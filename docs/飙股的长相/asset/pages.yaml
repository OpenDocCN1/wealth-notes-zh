  md: '# ## 飆股的真相


    動、公司動態來選出飆股，不是一件容易的事，因此，我建議以股價走勢圖來當作突破點。


    股價走勢圖代表全體投資人的意見，獲利好、有未來性的公司，走勢自然會上揚，反之則會下跌。再者，不管是汽車製造商還是原料供給商，不同產業的公司，走勢圖都以相同形式來表現；換言之，股價走勢圖讓投資人可以同一個標準衡量所有企業，這好用的工具沒有道理不用。


    運用股價走勢圖，我們可以掌握跟「獲利成長20%以上」同等重要的第二條飆股定理：能突破過去高點。


    股票分兩種：一種能迅速上漲，另一種會持續低迷。當股價真正上漲時，一定會突破過去高點；沒有突破過去高點，股價絕不可能持續上漲。換句話說，能突破過去高點的股票，才是真正的飆股。


    股價創新高宛如命運的十字路口，投資人進場的最佳時機，就是突破新高價位的瞬間。


