  md: '# 飆股的長相


    買在股價創新高的概念，並不是我發明的，這其實是市場參與者普遍的想法。換句話說，從某支股票創新高價的那一刻起，市場參與者會產生一個共同的期待：這支股票應該會繼續漲上去。不過，當成交量出不來，就代表市場對這支股票的期待不高。


