    獲利重點：避免追高。


    重要度：★★☆


    # 定律就是買「隔天的開盤價」


    投資最重要的，就是不让資產減少，只要好好守護資產，就是最棒的進攻。本章將說明守護資產兩個最重要的技巧，首先是下單的時間點。


    當某檔股票的基本面和技術面都滿足了飆股條件、且創新高價，就可以準備下單了。一般來說，下單的時間點有三種：


    +   1. 盤中：確認突破過去高價，立刻買進；


    +   2. 盤後：確認當日收盤創新高後，於收盤後下單；


    +   3. 在隔天開盤前，以前一天的收盤價下單。


    有人曾經模擬這三種下單方式的投資績效，結果大致相同。但是我強烈建議大家採用第三種方法，理由如下：


    +   一、當一天的交易結束後，你有充裕的時間好好調查哪些股票


    的股價創下新高，同時又滿足了基本面與技術面的各項條件，這樣


    第二天你就可以氣定神閒地下單了。


    216'
