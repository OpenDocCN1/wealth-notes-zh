  md: '# ## 最強大的技術指標——K線波動率


    獲利重點：在股價創新高價的當日，波動率愈低，後續飆漲的成功機率愈高。


    重要度：★★☆


    買在創新高價的選股方式，最怕買到過熱的股票，因為這種股票往往在創新高價後就會回跌。所謂「過熱」，是指股價波動幅度太過激烈，就像登山，如果爬到半路喘不過氣，就會沒有氣力再往上爬；換句話說，一支股票如果創新高價後無力再往上飆漲，就會失速下跌，所以我們必須確認一支股票在創新高價後，仍有力氣再往上飆漲。


    # ### 如何確認？最簡單的技術指標，就是第一章介紹的平穩期範圍


    圖：一般來說，範圍愈小，過熱機率愈低。但光憑這點還不夠，因為有些股票的走勢即使範圍很大，也還不算過熱。然而，是否過熱還是很大主觀的個人判斷，因此，搭配我們的「K線波動率」，在投資判斷上就會更加精準。


    # ### 觀察股價變化，有兩個切入點


    一般來說，觀察股價有兩個切入點：一是股價高低，二是波動幅度。以氣溫為例，你一定經歷過冬天氣溫驟降的經驗。例如過了一段秋高氣爽的日後，有一天氣溫突然驟降5度，如果是紐約的冬天……'
