    # ### 平穩期特徵二：時間很漫長


    混亂期最大的特徵就是期間非常長。暴跌期的時間很短，但緊接在後頭的是持續很長一段時間的平穩期。下頁圖表6-7，顯示混亂期和上升期交錯出現的模様。有一個訊號能判斷大盤是否結束混亂期、進入上升期——指數會創新高價，宣告新增時代的來臨。


    下頁圖表6-8顯示美國股市在1929年大暴跌後，進入混亂期的情形。最初3年，股價從高點暴跌了86%，之後前景不明的行情持續了很長一段時間，直到13年後的1942年，才開始一波新的行情出現。但投資人直到美國股市創新高價、進入新的上升期後，才體認到這個狀況：時間點是1945年第二次世界大戰結束，世界霸權從轉到美國手中之際。


    第196頁的圖表6-9顯示，大盤指數或商品價格在暴跌後，在平穩期停滯多久才進入上升期。例如黃金和石油價格在1980年觸頂'
