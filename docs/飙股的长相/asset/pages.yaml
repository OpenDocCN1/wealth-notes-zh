  md: '# 觸股的長相


    務實一點來說，股票投資原本就是一個「爾虞我詐」的行為，高散位拉只為出貨，若不加以細究，每一支明牌都會變成包著糖衣的毒藥，最後你就成為那隻被送入虎口的羚羊。


    大約十幾年前，我認識一位在竹科半導體公司上班的朋友，他在景區幾家公司的工程師後，便決定離開，到台北的證券業上班，由於對產業脈動了解深入，對於IC設計業的投資判斷相當精準，讓沒有產業背景的老闆印象深刻。而他也主要的判斷依據，然是來自於他對基本面與個別公司的理解與掌握。


    主軸科技產業多年，見證產業的起伏與衰敗，我也有類似的投資經驗。在選擇投資標的時，我一定要對該產業處於景氣循環的何種位置、產業的內外競爭環境，以及個別企業的競爭力等，都先做過透徹的研究後，才決定要不要出手。透過反覆的研究與長期練習，我選擇的投資標的，成功率已明顯贏過大盤，當然也比聽明牌要高明許多。


    # 買賣的時機點，比基本面更關鍵


    不過，了解基本面仍然不夠，我也認識不少對產業基本面相當熟悉的朋友，股票投資卻一樣不順利。我聽過最多的例子，就是很多圖區科技業的高階主管，自己的股票都買在高點、賣在低點，和一般散戶沒什麼兩樣。


    若要歸結一個基本的投資原則，我覺得基本面只占決策比重約六、七成，但要選到一支觸股，尤其是掌握買進與賣出的時間點，有另外的三、四成因素絕對不能疏忽，包括對個股的技術指標、量'
