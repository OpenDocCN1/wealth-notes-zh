  md: '# 第二章：三種巨大轉變，讓企業變得很賺錢


    一家) 11倍、川崎汽船 (日本前三大海運公司之一) 12倍。


    投資股票和去公司上班最大的不同之處，就是隨時都能赶上時代潮流。好比現在從事 IT 技術工作的人，一定會擔心自己的技術有一天可能會被市場淘汰。以現在潮流瞬息萬變的速度，「那一天」想必很快就將會到來！屆時，這些技術人員不可能立刻換另一種工作，也不大可能很快就被當時尚設計師或基因醫療的研究人員。


    但投資股票就沒有這方面的問題，我們隨時可以成為時下最流行產業公司的股東。當然，投資的目的不光是累積財富，若是單純從累積財富的角度來比較職場工作和投資工作的話，目前任職的公司可能會突然倒閉，而投資隨時可以因隨時代潮流，轉換另一間對自己最有利的公司投資。因此，在累積財富的方法中，投資股票的風險性相對來說低了很多。'
