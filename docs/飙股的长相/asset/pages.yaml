  md: '# 第四章：這支股票會漲到哪裡？


    接著，用以上數據，算出兩天的平均股價波動值為：$((30+40)\div 2=35)$，兩天平均收盤值為$(920+910)\div 2=915$。然後，套用圖表4-10的公式，計算這兩天的K線波動率為：


    ```

    $$\begin{gathered} \text{平均漲跌幅度} \\ \frac{\text{平均收盤值}}{35} \times 100 = \frac{915}{35}
    \times 100 \\ = 0.0382 \times 100 \\ = 3.8(\%) \end{gathered}$$

    ```


    計算20天的K線波動率時，一一計算實在太累，建議用Excel軟體代入公式，就能輕鬆得到數據。我在另一本著作《大漲的訊號》中，也是用同樣的單日漲跌幅動態，來計算我發明的「實歷比例」，因此圖表4-11，其實就是前著（《大漲的訊號》）的圖表4.19。此外，第五章第二節的「買出轉換線」也是採用相同的概念觀察股價的波動，這是我做技術分析時最重要的基本功。


    # 波動率比成交量更重要


    下頁圖表4-13是三菱商事的股票日K線圖與波動率曲線圖，從波動率來看，就能解釋它在2004年4月無法創新高價、10月卻能成功的原因。


    在2004年4月5日那天，三菱商事突破了2003年9月以來的高價，但此後只有六天維持這個收盤值，到了5月更是回跌25%。另一方面，同年10月13日，它再次成功地創新高價，而且這次沒有再大幅下跌，反而一口氣進入上漲行情。'
