  md: '# 附錄 獨創K線五步驟檢核表


    最後，我將本書的內容整理成K線五步驟檢核表。如果你看著每個步驟裡的檢核項目，能立刻想起它的意義，就代表你已經完全讀懂本書的重點，可以開始投資了。不過，我建議你不要一鼓作氣，剛開始，請用最小的額度為單位開始投資（例如從買零股開始測試自己的選股）。


    以前我剛踏入投資這一行時，總以為每天忙碌地買進賣出就是投資，當我找不到適合投資的個股時，我就會很焦慮；這時候，如果看上什麼股票，不管它符不符合我的選股標準，總覺得一切都美好、充滿希望。


    根據我的經驗，買進這種「充滿希望」股票的人，大多會買在股價的高點。因此，為了能客觀地判斷能否買進，請各位務必好好運用這份檢核表，若是不符合的項目愈多，就代表你的投資風險愈高。'
