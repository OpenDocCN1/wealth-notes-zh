    MonotaRO過去五年的營業額與經常利益，年均成長率分別是20%和43%。請見圖表2-10，它的平穩期非常漂亮。根據「穩定後陡升要立刻進場」的選股規則來看，近期的陡升高點就是買點。不過，如果你看的是它的週K線圖，可能會驚羨近期陡升的高點，應該是A點？還是B點？由於它的股價在陡升時漲幅非常高，使得A點和B點在同一天創新高價，這種情況在實際操作股票時經常發生，既然是在同一天，就不必煩惱進場時機了。


