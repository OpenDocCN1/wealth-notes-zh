  md: '# 第二章：三項巨大轉變，讓企業變得低賺


    古實也能買上好價錢，但因為品質好，很受當地建築業者歡迎。從2001年到2007年為止，日立建機的股價上涨了20倍，其競爭對手小松製作所（在日本重化工業器材製造公司中排名第一，世界排名則是第二）的股價也成長了12倍。


    請看下頁圖表2-8，日立建機從2004年～2005年的平穩期中，出現了兩次買進訊號。第一次幾乎還在上漲時就出現買訊號（可見即使專業選股票，還是可能出現創新高度後就下跌的情況），第二次的買進訊號就非常成功。雖然三個月前業績衰退了，但近期業績很不錯，再加上六個月前、九個月前的業績也很亮眼，綜合以上判斷，日立建機還是很有投資價值。


    此外，受惠於中國鋼鐵工業（指以染亞、縫制等經過加工的紡織品）的蓬勃發展，豐鐵雜相關機械給中國的公司，業績也蒸蒸日 上，其中，津田駒工業的股價從2000年以來漲了12倍，縫制機製造商JUKI（全球市占率第一）股價也上漲了12倍，針織機製造商島精機也漲了4倍。


