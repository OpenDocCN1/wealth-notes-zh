  md: '![](img/3859d335b09a86b1f0712da6ce5c7a2f_152_0.png)


    # 三、用波動率估算創新高價成功和失敗的機率


    圖表中的灰線就是波動率，乍看之下，股價的變動和波動率的變化沒有相關性，但是請看它的波動率，在4月5日為5.2%，在10月13日為3.7%；換句話說，在股價創新高的當日，波動率愈低，後續續漲的成功機率愈高。


    對投資風險謹慎的投資人，最好投資波動率4%以下的股票，4%～6%已算中度風險，6%以上就是高風險了。此外，業績非常好的企業和小公司，波動率通常都會偏高。美國和中國股市的波動率標準，跟日本股市又略有不同，但波動率愈低愈具有續漲潛力這個原則，無論在哪一國的股市都是成立的。'
