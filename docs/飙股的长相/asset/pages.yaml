    # 1. 搭上時代潮流的順風車


    不管在學界、體育界、商界或任何領域，比較容易獲得讚賞的，幾乎都是表現穩定、成績優秀的人。因為他們給人一種可信賴的感覺；但股市正好相反，表現穩定、成績優秀的企業，未必是最好的投資標的。投資人不能因為「公司表現穩定」、「產品有品牌保證」而買進。好比豐田汽車是全球知名品牌，但這仍不足以構成我們購買這支股票的理由。


    投資股票的重點，是企業獲利成長，而且必須是非常顯著的成長，這就是吉姆·羅傑斯告訴我的「巨大轉變」（Big Change）——選股時，我們看的是它將來還有沒有繼續茁壯發展的潛力。


    例如本來吊車尾，卻逐漸進步、後來迎頭趕上其他競爭對手的公司，就是極具魅力的投資對象。以航空業來說，就像天馬航空。天馬在日本航空業雖然排名第3，營業額卻只有全日空的6%，幾乎沒有存在感和。然而，當日本第二大航空公司日本航空破產時，受益最多的反而是天馬（當時上市的航空公司只有日航、全日空和天馬三家而已）。


