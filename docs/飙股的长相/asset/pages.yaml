    重要度：☆☆☆


    順位相關係數（Rank Correlation Index，以下簡稱RCI）特別注重時間的順序，我希望投資人學會這個賣出指標，因為 RCI 雖是股價下跌的訊號，但計算時卻不考慮跌幅，其概念和賣出轉換原則好相反。


    為了讓大家理解何謂注重時間順序的賣出訊號，我將以下頁圖表5-11四種模式、四天的股價變動，來跟大家說明：1號股價天下跌，走勢非常疲軟；2號看不出股價走勢是漲是跌；3號明顯是下跌趨勢，但和1號不同的是，中途（第三天）漲過一次；4號與3號差不多，但第三天漲幅較大，走勢比3號強勢許多（較難下跌）。


