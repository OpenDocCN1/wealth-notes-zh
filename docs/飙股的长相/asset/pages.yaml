  md: '# 第二章：三種巨大轉變，讓企業變得低賺錢


    業界第二大，股價漲幅更高


    2003年～2007年大盤處於上升情時的個股表現


    | 公司 | 第一大盤 | 股價漲幅 |

    | --- | --- | --- |

    | 新日鐵 | 577% | 股價漲幅是日本經濟平均低點（2003年4月）到最高點（2007年7月）之間的個股股價，所得到的數據。 |

    | 三菱重工 | 215% | 第二大盤 |

    | 川崎重工 | 440% | 住友金屬工業 | 1315% |

    | 理光 | 5% | 川崎重工 | 5% |

    | 住友金屬工業 | 1315% | 大河證券 | 212% |

    | 智能 | 53% | 太陽三井 | 480% |

    | 智研證券 | 111% | KDDI | 148% |

    | 日本郵船 | 198% | | |

    | NTT DoCoMo | 20% | | |


    後，第二大類因的固定支出占總成本的比例就會急速縮小，獲利成長率則會大幅上升。由於股價會跟蹤獲利的成長率而波動，因此市占率第二大的廠商股價，反而會比第一大類更有成長的空間。


    # 選「第一」，不如選「唯一」


    其實光有業界第一的稱號，還算不上是好股票。投資人真正追求的是，擁有獨家技術或服務、能在競爭中獲得壓倒性勝利的公司。有句話說「選第一不如選唯一」，這是因為「第一」隨時都有被超越的危險，而「唯一」就沒有這種困擾了。當然，假如業界第一大公司是人微的「格力佛企業」，那就另當別論了。因為再多的小人圍攻，也難敵格力佛的寡頭壟斷（格力佛是小說《格力佛遊記》主人翁，他曾造访大人國與小人國等畫奇的國家）。'
