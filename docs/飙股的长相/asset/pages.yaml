  md: '# 第四 章 ： 這 支 股 票 會 強 到 哪 ？


    | 股 動 量 | RSI 低 於 | 超 買 指 示 |

    | :---: | :---: | :---: |

    | 未 滿 4% | 40% | 小 |

    | 4%~6% | 35% | 中 |

    | 6% 以 上 | 25% | 大 |


    在三菱商事這個例子中，如果光看成交易量，得到的結果也是在第二次創新高價時才能買進。也就是說，第一次創新高價時的成交量較低，第二次則較高，因此，只有第二次創新高價時才出現買進訊號。


    但如果碰上波動率和成交量這兩個指標的判斷結果不一致，就表示至少有一項指標顯示該股的行情疲軟。投資人最討厭的就是風險，最有效的投資方法就是，只要有一個指標出現走弱的訊號，就寧可選擇先不買進。


    但若有讀者問：「相較之下，哪個指標比較重要？」我會回答：「波動率比較重要。」換言之，即使成交量不足，只要波動率不顯示股價過熱，還是可以考慮買進。我要強調的是，波動率就是這麼強大、好用的工具。'
