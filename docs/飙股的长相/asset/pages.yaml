  md: '# # 4 用「兩段式上漲」預測高點


    獲利重點：預測漲幅不到兩成，就別買。


    重要度：★☆☆


    走進第一次光顧的壽司店，如果菜單上沒有標示價格，我會因為不知道這頓飯吃下來要付多少錢而感到不安，根本無法好好吃飯；同理，買股票時，你一定很想知道買進的股票大概會漲到什麼價位，但我們不可能精準地預測滬遼未來的某個時間點，股票到底是會是多少，況且花太多時間預測股價，往往是白費工夫，因此對投資人來說，如何簡單快速地預測股價高點，非常重要。


    我的預測工具是「兩段式上漲」，它可以預測半年至一年後（長一點甚至是數年內），股價高點會落在哪裡。有了這項工具，你甚至在買進股票前，只要對預測的高點不滿意，就可以決定不要進場。這跟天算地打算「漲到幾錢錢就賣出」，完全不同。


    # 簡單的加減，就能算出股價會漲到哪


    「兩段式上漲」的算式非常簡單，只需要簡單的加、減法就能算出來；而且在你練習的過程中，還會養成用這個邏輯看K線圖的習慣，久而久之，你一眼就能看出哪個K線圖長得漂亮、哪個不漂亮。'
