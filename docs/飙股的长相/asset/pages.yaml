  md: '# 第六章：只要看懂大盤，不必放空，下跌行情怎麼買怎麼賺


    我選擇投資創新高價股，是因為這種股票飆漲的機率最高；相對地，我不買「非創新高價股」，是因為沒人能預測這種股票接下來會漲還是跌，但偏偏這種股票占整體股市99%以上—當整體股市有99%以上的個股無法預測未來走勢，當然很難判斷大盤未來的走向如何。因此，我強烈建議大家，如果有人在電視上發表「大盤指數會漲到幾點」之類的預言，千萬不要相信。


    # 大趨勢：看世界主要指數的走勢


    以下有幾個方法，可以幫助你簡單地觀察股市的大趨勢和中趨勢，還有上升和下跌局面。我們先從大趨勢開始釐清，現在到底是處於混亂期還是上升期。從全球主要的大盤指數，我們可以判斷股市何時會從混亂期進入上升期。


    觀察點一：是否突破近期高價？


    創新高價是分辨飆股的重要條件，而且這一點不只適用於個股，也適用於大盤指數。請見下頁圖表6-11，日經平均指數在2005年進入一波強勢的上升行情前，突破了2002年與2004年的高價。美國股市在1929年大暴跌後，進入上升行情前，指數也曾創新高（見圖表6-8）。


    以現在這個時候點（指2012年第四季）來說，日本股市要進入新一波上升局面，必須突破2010年4月11,408的高點（2013年12月16日的收盤價為15,152點）。之所以說是「現在這個時候點」，是因為這個數值會隨着時間向下修正，詳細情況我會觀察點三詳細說明。'
