    上一節我們提到的獨行狼，是同事愛沒張就先行上漲；落後補漲的情況剛好相反，除了自己以外，其他同事股票都上漲了。這兩種特立獨行的股票，在股市裡都不怎麼受歡迎；因為不受投資人青睞，所以無法凝聚買氣。


    我以海運業為例來解釋。海運業從2003年起就是日本股市的熱門類股。在上一節的圖表3-2（見第107頁）中，最晚創新高價的海運公司是日本郵船。然而，根據2003年3月期的財報，日本郵船的經常利益居同業之冠，占11家海運公司經常利益總額的45%。儘管獲利表現亮眼，但日本郵船的股價到觸頂為止，只漲了3倍，在11家海運公司中股價表現最差，創新高價的時間也最晚。


    這背後一定有什麽原因可稽，具體來說就是：市場認為它的未來獲利成長空間不大，而事實也是如此。


    日本郵船在2003年3月期～2008年3月期，經常利益成長了3.9倍，跟同屬前三大海運公司的商船三井（9.0倍）與川崎汽船（5.3倍）一比，馬上相形見拙。到了2008年3月期的經常利益，日本郵船已經被商船三井超越，占11家海運公司經常利益總額的比例，也要退到28%。


    由此可見，市場不看好日本郵船的未來獲利是正確的，投資人之所以這麼推論，是因為不定期船運（持海運中無固定航線與船期的業務，運費通常比定期船運便宜）的運費漲到歷史新高，因此推測不定期船業務比重較高的商船三井和川崎汽船，獲利可望持續攀升。'
