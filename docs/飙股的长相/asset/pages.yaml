  md: '第六章：只要看懂大盤，不必放空，下跌行情怎麼買怎麼賺


    之下，機構投資者的挑戰輕鬆許多。


    # 暴跌期特徵三：投資人最不必害怕的時期


    行情暴跌絕對不是什麼令人愉快的經驗，但對於採用我的選股方式的投資人來說，暴跌並非是可怖的現象，理由如下：


    +   1. 暴跌時所有股票都下跌，沒有新的股票要買進。

    2. 暴跌時若手上還有股票，在跌幅幅超過買價8%時立刻停損賣出，就不必擔心賠太多（停損點建議設為買價的8%）。


    原本100的資產變成了92，還在可以接受的範圍，可見只要做好停損，完全不必害怕暴跌期的來到。


    # 平穩期特徵一：選股要比暴跌期更小心


    暴跌後是混亂期的第二階段：平穩期。我把平穩期的特徵整理成下表6-6，這個時期看不出行情即將上升或下跌，行情會不斷重複平穩的上升與下跌局面。


    在混亂期的第二階段，很容易出現騙線，儘管數量沒有上升期多，但至少不會像暴跌期那樣全面慘跌。這段時間若是出現基本面佳的股票，投資人應該積極買進。


    要注意的是，在混亂期裡，上升行情的時間比較短，有些股票可能沒漲多少就觸頂；也就是說，有些股票的上升趨勢在助跑行情'
