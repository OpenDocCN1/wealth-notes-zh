  md: '# 麵股的長相


    接著，請看上一頁圖表2-5上圈紅色圈起來的部分，可以想見有投資人會選擇在這個時間點進場。大石公司在2005年～2006年間股價上漲了兩倍，這當中當然不會出現創新高價或形成平穩期；換句話說，它在這段時間雖然滿足了①和②的條件，但並未滿足③和④。雖然本書秉持著不符合技術分析就淘汰的原則，但重碼基本面的投資人看到這樣的條件，大概都會買進吧。


    我不是要求你一定要等到脫離平穩期、創新高價才能進場，我的意思是還在此時進場最容易成功。如果你實在2007年中創新高價的位置，一定能了解它的魅力。


    不過，如果個股符合了②③④、卻不符合①的條件，最好不要買。此外，即使某支股票看得到創新高價、脫離平穩期，但近期二～三季的業績（尤其是最近三個月的業績）不好，也最好先別碰。


    判斷條件的優先順序很重要，請大家一定要記住。


    # 二、受惠於降低成本的需求


    無論在任何時代，降低成本都是企業非常重要的課題，尤其在經濟成長率低迷不振時，企業想要增加獲利，能否成功降低成本愈來愈重要了。如同製造業為了降低成本，是以一日圖為單位努力改善，零售業者對於降低成本也是絞盡腦汁、錙銖必較。


    零售業的經營核心是決定要販售怎樣的產品、在哪裡販售、定價多少錢；也就是說，對零售業來說，最重要的業務是店面的地段、裝潢、產品採購、定價、掌握暢銷產品、陳列、顧客應對等等；至於'
