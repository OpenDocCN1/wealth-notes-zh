  md: '# 第一章：選股密技百百種，我的最快看出爛股


    的股價從2004年掛牌上市到2007年的高點，總共飆漲了7倍，但之後便走勢持平、進入平穩期。


    關於平穩期，我會在第一節詳述。目前先看谷歌的走勢圖，就能明顯看出它的走勢比微軟強勁很多，也能看出谷歌的實力，確實介於蘋果和微軟之間；但除了這一點，股價走勢圖還能看出此時不是買進谷歌的好時機，因為真正的高股走勢不會持平，而是會陡升。


    在這5年的平穩期中，谷歌的獲利成長了7倍。如果只做基本面分析，那麼股價應該也會上漲2倍，事實上卻並非如此。谷歌雖然持續進行大型的購併計畫，但本身除了搜尋引擎，沒有其他大筆的收益，所以投資人都觀察它能否找到新的高收益來源；換句話說，投資人認為長期來看，這家公司很難維持20%以上的獲利成長率——這就是谷歌無法創新高價的原因，因此，谷歌不算真正的高股。


    此外，說到網路時代的大贏家，絕對不能漏掉社群遊戲。過去電腦遊戲機曾經引爆極大的熱潮，我由此推論社群遊戲的熱潮也不會曇花一現。日本最大的社群遊戲公司GREE，2007年4月的會員數已達116萬人，到了2011年底，會員數更是飆升到1.9億人。


