  md: '# 受惠於政府政策


    +   • 獲利重點：確認個股是否有「收益保證成長」的條件。

    • 重要度：★★☆


    打開電腦或報紙看財經新聞時，若說裡頭有什麼情報對投資最有用，那肯定是政府政策。從中期（指一～七年；一年以下為短期）來看，那些直接受惠於政府政策的個股，收益幾乎都保證會成長，這是投資人選股時最容易判斷的基準。


    時代潮流有長期的、有短暫的；有強勢的、也有弱勢的，例如近幾年防止地球繼續暖化的話題很夯，並且已擴展到個人生活的層面，現在很多人都已經養成攜帶環保購物袋、隨意關燈等習性，對於節能減碳的意識已大幅提升。


    但環保節能如果只靠民眾建立良好習性，很可能只是一波短暫的熱潮，也會隨著時間逐漸冷卻，如此一來，我們就無法判斷它能為企業帶來多少程度的獲利。


    相對地，政府政策就實在多了。政策是政府將時代潮流變成明文規定的產物，也是政府為了滿足「防止地球繼續暖化」的社會需求，所提出的因應政策，例如明文規定限制二氧化碳的排放量等；如此一來，「防止地球繼續暖化」就不會為一时的熱潮，因此，政府政策可說是時代潮流的最佳推手。


    選股時，「政策概念股」最容易判斷能否達標，因為政府政策'
