  md: '# # 第四章：這支股票會漲到哪？


    # ## 留意創新高價位當天的成交量


    獲利重點：在股價創新高的當日，成交量要比20DAY二出一三成。


    重要度：☆☆☆


    你有沒有想過，為什麼成交量的訊息必須被公開？


    當你在報紙、網路上瀏覽股價情時，除了當日的四個交易價格（開盤價、最高價、最低價、收盤價）外，一定會看到成交量。在股價走勢圖中，K線圖下方通常會附上成交量的長條圖。既然成交量的情報這麼受到重視，表示它本身一定有很重要的意義。


    投資高手光看成交量就能預估未來股價的走勢，因為成交量透露最重要的訊息：成交量愈多，股價愈有機會上漲。因此，這一節我要教你怎麼看成交量，就能看出翻股的長相。


    請看下一頁圖表4-3，這兩張是日本最具代表性的海运公司商船三井與川崎汽船的K線圖。乍看之下，兩者的走勢形狀幾乎相同：兩者低價出現的時間點相差一個月，商船三井是2002年10月，川崎汽船是2002年9月；而且在2007年10月一起觸頂。從低點到觸頂之間的漲幅，商船三井是11倍，川崎汽船是12倍。


    請注意2005年的創新高價位。這兩家公司平穩期的範圍都不到30%，但商船三井的股價在2005年8月輕鬆創下新高，川崎汽船卻在2005年9月突破失敗。投資人該怎麼辦，才能確保選到商船三井，而避免買到川崎汽船呢？'
