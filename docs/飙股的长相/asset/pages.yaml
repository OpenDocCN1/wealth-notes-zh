  md: '時代潮流和熱潮不同，它一旦出現，就會長時間存在。目前正在發生的時代潮流，大致有三波：


    +   1. 節能環保；

    2. 降低成本的需求（包括企業與消費者）；

    3. 中國等新興國家的崛起。


    找出受惠於這幾波潮流的企業，就是我們投資的重點。以下我將針對這三波時代潮流舉例說明。


    # 一、節能環保概念股


    首先，投資人該如何尋找與環保相關的時代潮流股？環保是一股很強的趨勢，許多公司都針對環保提出經營方針，但如果環保本身不是該公司的事業基礎，就沒有投資的意義。


    例如豐田汽車的環保節能車賣得很好，好到幾乎來不及生產出貨，但我們不能因為環保節能車賣得好，就買它的股票。因為豐田汽車整體事業的營業額及獲利，還是有很大的一部分來自傳統車種。不過，如果某家企業的營收與獲利主要來自於環保節能產品，就肯定還有成長空間。


