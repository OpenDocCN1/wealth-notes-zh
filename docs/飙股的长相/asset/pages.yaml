  md: '# 提高機械性操作的比重，

    找出真正大颯股


    76%亮眼報酬率的冠軍操盘人／黃嘉斌


    本書作者林則行是全球最大主權基金「阿布達比投資局」的傳奇基金經理人，也是日本K線大師，文中所闡述的內容，都是作者多年的實戰經驗，並且去蕪存菁後所彙整出來的投資心法，為投資人切身處地點出具體可行的操作步驟。


    有別於其他大師级的投資叢書，大多僅闡述一些「觀念」或「原則」，甚少提及該如何去做行實踐，往往細讀後只覺得精彩、佩服，甚至羨慕作者，但卻通等不善學習方法与動力，因此《颯股的長相》是一本领難得、且一定要再三閱讀的好書。


    具體教授尋找颯股的步驟，不僅是本書的重要特色，更突顯出作者願意與人分享的胸襟。在此特別建議讀者，不僅應再三精讀，將其當成投資選股的「工具書」，更應將作者所提出的方法驗證於台股中，來加深印象，熟習他的方法，如此才能實際運用在尋求未來值得投資的「颯的」，進而消化成自己獨特的選股依據。


    在投資领域中，所遵循的決策理論可概分為兩大派系，一系以基本面為依據，另一派則奉技術分析為圭臬。不過，一般投資人甚至是機構法人在實際決策時，大多數是游移於兩者之間，然後再加上直覺與經驗（通常是情緒與喜好），比如有些操盤人對於某些'
