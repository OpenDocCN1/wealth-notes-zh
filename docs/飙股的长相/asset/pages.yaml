    相較之下，微軟呢？它曾是全球 IT 龍頭，但時至今日，大家還覺得微軟在領導 IT 產業嗎？我想沒人這麼認為吧，因為他們除了升級 Windows 版本，沒有其他獲利策略；進入雲端時代後，他們的經常只會更加艱難，微軟的股價從2000年以後，就幾乎是在原地踏步。


