  md: '# 第七章：下單前，再學習防守護資產的技巧


    二、盤前是一天當中下單量最多的時間，不必擔心價格跑掉。


    三、隔日開盤前下單，是這三個時間點中最後的一種，一般來說，股票持有時間愈短愈好，因為你永遠不知道隔日早上上市，股票會不會發生什麼重大事件，或是該公司會爆發什麼意外醜聞。


    相較之下，買在第一跟第二種時間點，有個共同的缺點，就是從開盤到收盤為止，你無時無刻都得盯著行情變化。


    # 用比收盤價再低0.5%～1.0%的價位限價下單


    我再介紹大家一個實用技巧，就是以低於前一天收盤價0.5%～1.0%的價位，在隔天早上限價下單（別擔心買不到，一定還有機會）。據統計，日本股市的基本特性，是早上開盤前走高，開盤後的白天交易則股價疲軟，因此前一天的收盤價，通常會在隔天中午下跌1%左右。


