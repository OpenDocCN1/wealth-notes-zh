  md: '# 第二章：三種巨大轉變，讓企業變得很賺錢


    掌握庫存、架上商品、店內清潔等，則是比較次要的業務。

    「愛捷是」是日本市占率第一的專業盤點公司，日本人成以上的大型超市、連鎖超商都是他們的客戶，你只要看過一眼愛捷是員工盤點時的樣子，就會恍然大悟，零售業者讓自家員工進行盤點工作，是多愚蠢的一件事，因為付加班費盤點國外買的自家員工盤點，成本反而比外包給愛捷是還要高。於是，從1998年3月期到2008年3月期，愛捷是的營業額平均每成長14%，經常利益成長7%，股價也飆漲了16倍。


    零售業除了把盤點業務外包，物流業務外包的風氣也愈來愈盛。把物流交給協力廠商後，零售業者就不必花錢建立貨車車隊與物流中心，而且受託的業者不但提供運輸與保管的服務，連合理的庫存管理、收發訂單、分類、打包都能替客戶處理。


    由於物流中心和貨車運輸是由同一業界的多位貨主共用，所以可以大幅降低成本。這類事業的代表企業之一，就是TRANCOM。請看下頁圖表2-6的下列，TRANCOM的股價從2002年開始飆漲，起漲點的2002年，一年中就出現兩次平穩期。第一次的創新股價失敗（只突破平穩期高值，但未創近期新高值），投資人必須停損，如同我們在第一章第二節所說明，有些人停損之後再也不敢投資同一張股票，但這樣往往會錯過最好的投資機會。


    受益於零售業降低成本需求的，還有派送業者。在日本家電連鎖龍頭廠商CAMERA的門市，常可看見一些派送業務員在向路人解說手機、數位相機等商品的功能。現代科技日新月異，產品的生命週期變得很快，在產品不斷推陳出新的情況下，零售店的店員根本來不及學習新產品的知識。'
