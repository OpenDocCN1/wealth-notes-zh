  md: '推薦序：在寂寞與等待中，找到自己的觸


    價關係、K線型態等的研究，尤其在決定買賣的時機點上，這些因素恐怕更為關鍵。


    翻閱由日本K線大師林則行所著的這本《觸股的真相》，我發現作者的觀察與我的經驗有許多類似之處；而且，與一般股票投資書不同的是，這不只是一本談技術指数的書，其中處處顯示作者對於產業基本面有深入的觀察，甚至有不少獨到的見解。


    例如「三種巨大轉變，讓企業變得很賺錢」、「小心！三種誘人的假觸股」、「達安瀛股會漲到哪？」等章節，把基本面與技術面的觀念做融合，讓他的股票致勝道謂能夠闡述得更加完整、並且具有可信度。


    此外，隨手舉幾個作者在書中所說的原則，例如「平穩期愈長，股價漲幅愈大」、「買在突破近期新高價的位置」等，其實正是作者對產業基本面與技術面的相互印證。平穩期長，代表的是產業進行供需及體質的調整，而選擇買在突破近期新高價的時機點，則讓大部分無法長期等待的投資人，可以在股票起漲前，在適當的時機出手，以獲取最大的報酬。


    如果以近幾年台灣電子業中的四大「修」業，在經歷三年股價的調整期後，2013年的太陽能、DRAM、LED產業，都已逐步復甦，股價漲勢也最為驚人，拿來驗證作者的投資原則，確實相當具體可行，而且又具備可操作的實用性。


    此外，這位投資經歷超過30年、被稱為傳奇的基本經理人，雖然在書中引用的大部分案例都是日本企業，但是對台灣讀者來說，這反而成為本書最值得一玩味之處，因為這樣的投資原則放之四海而皆準。不带情感的技術指標，有時反而是判斷股票多空最好的依'
