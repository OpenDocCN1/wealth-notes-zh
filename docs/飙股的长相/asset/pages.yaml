  md: '# 飆股的長相


    必須說清楚一個重要規則，請你一定要記住，判斷一支股票，要依照以下的優先順序：


    +   1. 是否發生巨大轉變？


    +   2. 過去二、三季的業績（獲利＋營業額）如何？


    +   3. 股價是否創下新高？


    +   4. K線是否形成平穩期？


    我的意思不是股票必須滿足這四個條件才能投資，事實上，很少有股票能同時滿足這四個條件，但你必須按照上述的優先順序來篩選股票，所以本章末的檢核表，也是依照這個順序設計的。


    首先，確認「是否發生巨大轉變」最重要；再來是檢查近期業績，其中獲利比營業額更重要；第三要看股價是否創下新高；第四為判斷K線是否有「穩定後陡升」的形狀。


    言歸正傳，在環保事業中，工業廢棄物的減量與有效的再利用，是最具代表性的類別。過去處理工業廢棄物的做法，不外乎脫水、乾燥、焚毀、中和、粉碎，然後掩埋；且大石公司的做法是從廢棄物中提煉出重油與水泥原料，使廢棄物大幅減量。


    以往許多尚嚴尚為了節省成本，違法丟棄廢棄物，但隨著政府相關單位的監管日趨嚴密，處理廢棄物的需求持續增加。


    請見圖表2-5的下圖，大石公司2007年的股價雖然原地踏步，但K線沒有形成平穩期（股價必需要在2,000～2,400日圓的範圍內波動，才能算是平穩期）。即使如此，它近期的業績幾乎符合條件，股價也確實創下新高。既然它已滿足②③的條件，沒道理不買。'
