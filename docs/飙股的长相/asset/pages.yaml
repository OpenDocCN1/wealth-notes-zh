  md: '# 轉虧為盈的企業，翻漲機率較高


    獲利重點：轉虧為盈的成長幅度，與一般成長率的算法不同。


    重要度：★★☆


    基本上，公司獲利成長幅度愈大，股價愈容易上漲，這幾乎已經成了股市常識。例如獲利成長15%的公司，股價一定比成長5%的公司更容易上漲；但若是公司轉虧為盈，連續出現盈余，或是有穩定的獲利來源，將更有機會出現股價飆漲的情況。


    事實上，轉虧為盈的公司，其股價大多會在轉虧為盈之際飆漲。例如，比起從去年虧損30億日圓，降到今年只虧損15億日圓，與從去年虧損10億日圓轉為今年獲利5億日圓，後者為股價帶來的正面影響肯定大得多，因為光是虧損數字變小，還不足以讓投資人對企業的未來展望產生信心。


    對公司來說，轉虧為盈是一個巨大轉變。因為投資人對企業的普遍期待是：「唯有收益表現好，才能證明企業的價值」。所以，當企業財務出現盈餘，就是它對投資人有益的最好證明。


    要找出轉虧為盈的公司很簡單，因為媒體一定會報導，《公司四季報》也會清楚載明；換句話說，企業會設法告訴投資大眾「我們轉虧為盈了」，投資人可以省下自己調查的時間。因此，轉虧為盈的公司不但股價飆漲的機率較高、又容易辨識，對投資人來說，真是「天上掉下來的禮物」。'
