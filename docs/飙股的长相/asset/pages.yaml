    # 企業重整是利多？


    # 看營業額立刻現原形


    獲利重點：營業額成長10%以上，才能買進。


    重要度：★☆☆


    當企業財報出現虧損、獲利衰退時，如果進行重整、大砍人事等費用，可以讓公司轉虧為盈；不過，投資人看到用這種方式轉虧為盈的公司，可以買進嗎？


    一般來說，企業重整所得到的獲利回升，不會持續太久，因為一家公司不可能一直靠裁員來解決財務問題，所以重整的話題熱度很快就會消失。本來經營企業就要無時無刻追求節省成本，企業重整就像「想從乾毛巾中再擰出水來」，結果自然是擰不出（獲利）來。


    投資人通常會對獲利能長期維持高成長的公司懷抱希望，如果他們知道某些希望只是鏡花水月，一定會盡快地把那支股票賣掉，因此，重整企業的股價通常漲不上去。以我個人的投資經驗來說，我覺得企業是否重整，既定考量買進之間，並沒有太大的關聯。


    # 營收沒增加，就知道獲利是靠重整


    其實，最該問的問題是：這家公司為什麼必須重整？是不是經營出了問題，導致消費者對該公司的產品和服務之需求不斷下降？'
