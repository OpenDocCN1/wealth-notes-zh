    # 三、市場雖我獨尊，不漲才怪！


    獨占事業的形成，主要是因為「進入障礙」的關係，從這個障礙的成分，大致可以區分成三類：第一類是政府特許經營，例如早期的菸酒公賣、電信事業等，大型的公共事業、未開放民營化等公司都是代表；第二類是具備技術特殊性，因而最終獨佔市場，比如住友化學生產IC封裝材料的環氧樹脂，即占有市場六成的供應商；第三類則是專利形成的限制，這種狀況最常出現在生技產業中，尤其是新藥的開發更為顯著。


    # 有競爭優勢，大漲十倍


    在現實生活中，企業很難出現獨占的狀況，尤其是關係到全球供應時，政府也會察出政治力的干擾，用「反托拉斯法」強制拆解該企業或者扶植另一家公司。舉個例子，個人電腦微處理器（CPU）的龍頭英特爾公司，在技術上享有絕對的競爭地位，卻刻意留下一杯羹給老二、老三，以維持市場有三到四家的供應商，這就是怕受到「反托拉斯法」的影響所致。


    另一個例子是，當年微軟幾乎壟斷了個人電腦作業系統（OS），並強行搭載MSN做為入口網站，甚至有排擠其他入口網站的跡象，導致企業差一點被強制拆解為若干公司。


