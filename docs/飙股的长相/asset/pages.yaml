  md: '# 顯股的長相


    產業或公司總是敬謝不敏，就算已有具體證據說明該股價將持續上漲，還是選擇避之唯恐不及。究其原因，往往來自於曾在該產業或公司投資失敗的經驗，造成主觀上的好惡與情緒所致。


    筆者從事研發、投資工作二十餘年，亦不能免俗地犯下主觀情緒的謬誤，因此林則徐透過分析，找出顯股的一些實質特徵，並進一步加以量化，將這些條件輔以簡單的數學運算，做為最終的決策標準。當投資決策依據有八成來自於機械性操作，兩成部分需要自己思考，不但可以減少因主觀情緒導致的錯誤，更可以讓那兩成需要思考的部分有更多時間做出更精密的正確決策。提高機械性操作的比重，而且不需使用到精密複雜的財務工程當作背景，是林則行在本書中非常重要的貢獻。


    # 以股價高低和波動幅度為起點


    從各個投資人的屬性區分，有資金投入多、寡之別，或者一般投資人、機構法人，還有積極、保守之分，短、中、長期之分等，不同性質所著重的點也各有不同，當我們細部拆解整個完整的投資架構，從最上層的趨勢（長期），到情景、政策（中期），乃至於波動（短期），有趣的是，儘管彼此用於投資的決策不盡相同，卻又密不可分，甚至作者巧妙地教導讀者，在無法從最上層的趨勢進行研判時，就從最底層（Bottom
    Up）的方式，以股價高低（K線型態）與股價波動幅度做為起點，找尋值得中、長期持有的顯股。


    作者提出上述兩種他自己最服膺的股票分析法，認為是尋找長期投資顯股最有效的研判工具，其實這兩種方式便是業界所慣稱'
