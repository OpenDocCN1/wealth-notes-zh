  md: '此外，運用這個算式，當一家公司的獲利成長率太小，算出來的結果會和傳統的計算方法（見下面公式）差不多。


    # 傳統的成長率計算式


    成長率(%) = (今年獲利-去年獲利) / 去年獲利 ×100


