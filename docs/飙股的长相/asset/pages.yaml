  md: '二、確認是否符合平穩期的三個條件


    平穩期該怎麼看？請見圖表1-15，漂亮的平穩期必須符合以下三個條件：


    +   1. 期間：六個月以上。


    +   2. 範圍：平穩期的高價與低價之間的幅度，稱作「範圍」。例如平穩期的期間，高價是1,000塊，低價是800塊，那麼範圍就是20%。計算時，通常採取發生在高價之後的低價。計算公式為：


    ```

    範圍（%）=（1－低價 / 高價）× 100

    ```


    ![](img/3859d335b09a86b1f0712da6ce5c7a2f_42_0.png)


    ![](img/3859d335b09a86b1f0712da6ce5c7a2f_42_1.png)


