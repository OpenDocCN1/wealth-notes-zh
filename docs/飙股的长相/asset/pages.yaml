    # 瓶股的長相


    memory) 缺貨的訊息，公司備有數月的低價庫存，以及得到東芝 (Toshiba)、金士頓 (Kingston) 的大力支援，以低價穩定貨源不至於匱乏，獨享漲價的利益等。

    透過K線型態的解讀，就算我們不能成為先知先覺者，至少還是能竊得亞機成為後知後覺者，享受漲勢開拔後的報酬，即使報酬率不及先進者，總比在一旁乾瞪眼來得好。許多錯失起漲買點的人，往往因「成本」的罣礙，錯失後續更大的一段行情。

    其實先期投資者承受不確定因素與時間風險較高，若是基本面按劇本發酵，他們享有較後進者三到五成的成本優勢也無可厚非，而後進者縱使絕對報酬率較低，但少了時間的等待，再將報酬率年率化，也未必不及，許多事情一經概念，便可以迎刃而解。


    《瓶股的長相》這本書，是林則行三十餘年來實戰經驗彙總統後的精華，為我們指引一條通往成功投資的道路。「投資之路無帝王之路」（意指無捷徑），有了本書的指引，倒是提供了一條少了很多罣礙的坦途。'
