  md: '第三章：小心！四種誘人的假騙股


    山之內製藥與藤澤藥品合併成安斯泰來製藥。


    這兩張K線圖都是呈合併後股價上漲的走勢，但仔細一看，兩者的走勢與日經平均指數非常類似。這表示合併後的上漲是因為景氣正好轉，這兩家公司的股價表現只維持在市場的平均值而已。


    # 收到錢的一方可以買，但要盡快脫手


    要注意的是，購併還能細分為合併與收購。雖然兩者都是兩家公司合併成一家，但收購是小公司被大公司併吞，小公司屬於被收購方。


    當我們想要一樣東西，而且無論如何都要得到時，可能就必须支付高出市場行情的價錢。藝術品的拍賣會是根據這個原理進行，才會優創天價。同樣地，要擁有一家公司的必須買下大多數的股份，因此，被收購公司在消息發布時，股價一定會立刻上漲。


    買方可能會宣布：「我們打算以高出市價三成的價格收購。」


    下頁圖表3-15就是一個這樣的案例。日立製作所在2009年7月收購日立 Plant Technology，由於消息提前曝光，股價在正式宣布的前一天就開始上漲。正式宣布後，日立
    Plant Technology 的股價便飆漲到被收購價格的610倍。


    身為投資人，此時要趕快賣出收購方的股票。畢竟他們用高出市價的行情買下被收購公司，勢必得燒掉一大筆錢，長期來說或許對獲利有幫助，但短期來看，收購方獲利成長率變遲的機會很高。


    也因為這樣，當收購方需要借錢來籌借收購資金時，如果收購利益小於貸款利息，可能會影響他們收購的意願。'
