  md: '# 第二章：三種巨人轉變，讓企業變得很賺錢


    獨占型企業大致分為以下三類：


    +   1. 獨占某個利基市場；

    2. 能提供同業望塵莫及的服務；

    3. 擁有同業無法複製的無店能⼒。


    你也可以說這是獨占型企業的三種特質。以下，我將針對這三種類別分別舉例說明。


    # 一、獨占某個利基市場


    大企業通常會投入市場規模較大的產業，因為他們有資本、人才、技術上的優勢，所以只要是他們認為會賺錢的產業，或是該領域可運用自家公司擅⻑的技術，就會想辦法打入市場。


    例如三菱重工，他們產品就包含火力、核能發電、飛機、太空火箭、郵輪、堆高機、電動電車、新式交通系統、廢棄物處理設施、汽車製造設備、印刷機械、工業機械、橋梁、排水設施、防止暖化、空調、國防等，非常多元。


    除了空調設備這類型民生商品，只要是跟大型機器相關的產業，三菱都想插上一腳。太空火箭和非水設施除了規模龐大這個共⻅點，技術上幾乎沒有關係；即使如此，像三菱重工這樣的大企業，還是希望可以打進這些市場。


    相較之下，利基市場通常是大企業觸角未及的領域，在這些大企業耕耘不深的領域中，中型企業有很大的發揮空間。'
