  md: '# 第七章：下單前，再學習防守護資產的技巧


    投資人可以靠機械性的選股條件篩選到某個程度，但若想對股票再做更深入的評置，很容易落入個人的主觀喜好，但自己的喜好未必等同於市場的喜好，因此，正確做法是對符合選股標準的一桶同仁。另外，股票的類別也要分散，如果十支股票都是科技股或傳產股，這種做法稱不上是分散投資。


    我覺得最理想的股票持有數量，應該是5～10支，20支股票可能太多了。此外，可能有的人資金較少，想分散成2支股票都很勉強，對於這類投資人，我建議每種股票都買最低單位就好（例如一張或零股），盡量分散、擴大投資範圍。'
