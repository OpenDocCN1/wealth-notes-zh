  md: '# 顯股的真相


    明顯了。


    分散投資的效果不光是能降低心理負擔、讓你氣定神閒,它還有另一個特點就是:賺錢時能多賺,虧損時又能夠少賠。


    # 遇到下跌行情,分散投資的效果最顯著


    假設你決定把資金分散投資到十個項目。買進第一檔股票時,只花了一成資金,手上還有九成的現金;買進第二檔股票時,資金比例降到八成。目前來看,資金比例節節下降,股票比例上升。


    然而,如果你買到第四檔股票時,市場忽然進入下跌行情,根據我們的選股條件,下跌行情中通常不會出現新高價股,所以你再不會買進新的個股,而讓資金維持在60%。


    我一向建議投資人,手上持股只要虧損8%就應該立即停損。萬一不幸你買的這四檔股票都得停損,總資金一共會損失3.2%;但如果你一開始就把資金全押在同一檔股票,現在虧損的幅度將是總資金的8%。


    買股的原則是訊號出現才進場,不會一口氣就買完。分散資金可以使買進的時間產生時問差,時間一分散,自然能降低風險。


    我們來看一個實際案例。圖表7-5是日經平均指數於2007年7月來到高點時,分散投資十檔創新高價股的績效(這個投資組合與《大蕭的訊號》第一章圖表1-2的投資組合歷時更長,但規則一樣)。光看圖表就知道,每次只用一成資金購買創新高價的股票,其績效比日經平均指數好太多了。


    此外,圖表7-5的報酬率算法,是在賣出股票時才結算實際報'
