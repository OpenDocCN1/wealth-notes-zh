  md: '# 為什麼一定要便宜1%？


    一定會有人會懷疑：「便宜0.5%～1%有什麼用？用限價的方式下單，萬一沒有買成，不是更划不來？」


    我希望大家這麼做，是是為了降低虧損的風險。正因為股價會呈鏟齒狀上下波動、逐步緩升，萬一這一次的創新高就是鏟齒狀的最高點，之後股價就會開始走跌，如果好死不茲，它創新高價位後立刻暴跌，投資人就得承認判斷錯誤、趕快停損。


    # 創新高價位後，股價下跌


