    2007年2月，日航發表重整的中期計畫，當中提到2008年3月期的營業利益目標是300億日圓以上；而當2010年3月期完成企業重整時，2011年3月期的營業利益目標要達到1880億日圓。


    然而，碰上2008年的全球景氣寒冬，航空業的市場需求下降，結果日航股價創新高後沒有持續上揚，重整也以失敗收場。它在2007年11月創新高價後，只撐了三天，股價就暴跌。2010年終於申請破產（2012年9月在稻盛和夫的手中起死回生，股票重新上市）。


    日航在2007年股價創新高的當下，我們無法判斷未來景氣會出現衰退、航空需求下降，那麼該怎麼辦，才能避免在那個時間點買下這種股票呢？


    第一，注意它的營業額。在上頁圖表3-8中，日航當季的營業額成長率是0%，前幾季的營業額也只分別成長了7%跟5%，沒什麼起色，這是典型的重整企業的營業額表現。


    第二，注意新高價出現的位置。我們的規則是股價必須突破過去兩年以上的高點，但它在2007年11月，只突破了2007年2月的高點，時間相隔不到一年。


    因此，不管是從營業額或股價走勢圖分析，得到的結論都是投資人「不敢」買進這支股票。


    # 重整成功的三項指標


    重整成功的關鍵，在於營業額是否成長。那麼，正處於虧損狀態的公司，在什麼狀況下營業額才會好轉呢？具體來說，你可以觀察：'
