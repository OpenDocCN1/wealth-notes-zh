    相對地，阿拉伯地區的氣溫就非常穩定，每天的温度變化不大，

    即使有變化，也多在1〜2度之間，所以當地人從沒感受過冬天

    氣溫骤降的感覺。儘管阿拉伯地區的夏季氣溫高達45度、冬天不到

    20度，住在那裡確實感受到季節的更迭，但如果以月爲單位來

    看，那裡的气溫變化卻是漸進式的（作者曾在全球最大主權基金

    「阿布達比投資局」擔任日本股投資部員）。


    我在國外住過才發現，氣温除了高低之分，還有變化的穩定

    與激烈之别。股票也是一樣，股價波動是小幅還是劇烈，與投資風

    險有很高的相關性，因此，波動率是技術分析中最重要的環一環。不

    過，我所自創的波動率，跟傳統概念不同，定義也有所區隔——我

    稱它為「K線波動率」，這是我自己發明的概念。


    簡單來說，一檔股票在創新高價時，如果波動率高，就是過熱的

    訊號。请看图表4.8上方的月K線圖，三菱商事在2003年〜2007年間，

    股價漲了五倍以上。在下方的週K線圖中，這檔股票曾在2004年4月創

    新高價失敗，但同年10月再度挑戰成功，之後就一路飆漲上去。


    檢查這兩個時間的營業額與獲利成長率，則不管是在4月或10

    月，都符合颶股的條件，但投資人當然希望買在10月而不是4月，此

    時運用技術分析，就能避免誤判買點。


    请看下圖紅色網底圈起來的部分，這兩個時間點的平穩期範圍

    都不到30%，但4月創新高價前，股價漲幅太過激烈，而10月創新高

    價前，股價波動很小。可見光看K線圖，就能判斷兩者波動率的高

    低，但爲了謹慎起見，接下來，我會用更精準的數值來加以驗證。'
