  md: '# 第六章：只要看懂大盤，不必放空，下跌行情怎樣買怎賺


    股市早就看出苗頭不對，開始進入暴跌行情，而企業界卻相隔一年才急減產車、減少產量。透過這個例子，你應該可以了解投資界與企業界的反應速度，差異有多大了。


    因此，請再記住一個重點：思考股價的未來走向時，千萬別從街道的熱鬧程度、計程車的排班隊伍長短、這種田野調查式的資訊來做判斷。因為股價是景氣的領先指標，根據景氣來判斷股票走勢是反果為因。


    # 暴跌期待徵二：獲利再好，股價照樣暴跌


    世上只有抗跌性強的公司，沒有抗跌性強的股票；當大盤進入暴跌行情，最恐怖的就是體質再好的企業，股價也照跌不誤。


    下頁圖表6-5是日本各種股（香菸、藥品、啤酒、電力、鐵道等的指擇性企業，在2007年～2009年的金融風暴中，股價與獲利的表現。這些企業即使景氣不好，獲利仍能維持一定的水準，是標準的抗跌股；儘管如此，遇到暴跌行情，它們的股價跌幅還是令人咋舌。


    這些公司不管獲利或股價，衰退幅度都比景氣敏感股（鋼鐵、電腦、重工、精密、汽車、纖維）來得小，股價跌幅也比日經平均指數（重挫62%）好很多。


    但即便是抗跌股中，也有不敵景氣衰退、獲利不斷弱化的企業，這些企業股價大跌我們還能理解，可是像JR東日本、安斯泰來製藥這兩家公司，經常利益的衰退跌幅只有2%和4%，獲利表現不俗，股價卻照樣慘遭腰斬——現在大家知道錢豐洋準備場地討論嗎'
