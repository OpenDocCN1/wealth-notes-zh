  md: '# 第二章：三種巨大轉變，讓企業變得很賺錢


    能說它「賺酷為盈」。即使明明後者的成長幅度較高，卻無法用數字表示。


    為了方便投資人做判斷，我在這裡介紹大家一個涵蓋負值的簡單計算方式，這個算式的目的不是算出正確的成長幅度，而是要用來快速判斷能否買進該支股票，而且這種算法在證券業界就廣為流傳，在投資上非常好用。


    這個公式的邏輯是：拿去年到今年的成長數字當分子，再用今年和去年的平均值當分母。計算方式如下：


    ### 涵蓋負值的成長率計算式


    成長率（%）=（今年獲利 − 去年獲利）


    (\| 今年獲利 \| + \| 去年獲利 \| ) × 0.5 × 100


    說明：\|\| 代表絕對值。


    我們以圖表2-19的第一季為例，計算其成長率：


    -52 − (439)

    (\| -52 \| + \| 439 \| ) × 0.5 × 100 = 158（%）


    用這個算式計算，答案一定會落在-200% 到 +200% 之間，對於喜歡精準答案的人來說或許很難接受，但在投資的世界中，當一家公司的獲利成長超過 200%，對於股價的影響，其實和獲利成長
    300% 或 400% 來說，已經沒有太大的差異了。'
