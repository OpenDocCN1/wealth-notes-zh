  md: '# 要投資時代潮流，而非一時熱潮


    所謂時代潮流，是指一旦發生、條件確立，就不再輕易改變的社會現象。例如不管未來日本的經濟景氣好壞，人口結構高齡化都是無法避免的時代潮流，隨之而來的醫療費、藥品費增加，也是時代潮流的一部分。


    時代潮流的極端對比，就是熱潮。例如服裝或飾品等商品、燒酒或蔬果汁等飲料，這些商品即使造成一時熱潮，總有一天也會消退，只是沒有人知道那是什麼時候。投資這類企業的股票、失敗率通常很高，千萬要小心。


    舉例來說，日本曾經非常流行「豪宅婚慶」。過去新人舉辦婚宴都會選在婚宴會館或飯店餐廳，結果有業者想出新噱頭，乾脆出借別棟豪宅一整天，而且一天只接受一組客人預定。這種方式不僅豪華氣派，還能悠閒地舉行自己喜歡的儀式或婚宴，才剛推出就立下不錯的口碑，博得很高的人氣。


    不過，我以投資人的眼光來看，覺得這個行業有一個問題，就是單價太高了。出售一整套豪宅、一次只限一組客人獨享大牀數面牆，價格當然比飯店貴上許多。更令人質疑的是，在豪宅舉行婚禮，就能辦出有個人特色的結婚儀式嗎？


    以我過去出席婚禮的經驗，令人印象較深刻的往是新郎與新娘入的誓词，或是新郎的父親對失去雙親的新娘獻上溫暖的關懷等等，但絕不包括會場的豪華程度、裝潢、音樂或餐點，因此，我判斷豪宅婚禮只是一時熱潮。


    我們來看這個行業中規模最大的TAKE AND GIVE, NEEDS公司'
