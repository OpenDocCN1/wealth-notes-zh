  md: '# 獨占型企業，市場通吃


    獲利重點：即使不景氣，這種企業也能擴大市占率。

    重要度：★★★


    最不能投資的對象，就是像奧運金牌選手一樣號稱全國第一、世界第一的企業。只要是運動選手都想拿到金牌，但選股時，投資人務必要避開業界第一名。為什麼呢？你看奧運比賽，第一名和第二名的成績往往只差0.1秒，以經營事業的角度來看，如果第一名企業被第二名追得這麼緊，根本就沒有喘息的空間。


    冷凍食品就是競爭激烈的典型產業，這個產業的第一名是日冷食品、第二名是日本菸草產業公司（JT，日本最大的菸草製造商，旗下亦經營冷凍食品業務）、第三名是丸羽日朗控股公司、第四名是味之素。這四家廠商勢均力敵，因此很容易會陷入剝削競爭，超市也因此最喜歡用冷凍食品做特賣促銷。


    當第一大廠與第二大廠的市占率旗鼓相當，投資第一名未必比較有利。圖表2-9顯示，在日經平均指數低點（2003年4月）到最高點（2007年月）之間，第一大廠的股價表現，並沒有比第二大廠來得更好。


    在相同產業裡，無關公司規模大小，營銷費用等固定支出其實都差不多，而占率第二的大廠，因為營業額規模較小，在固定支出上當然會比第一大廠吃緊，可是一旦景氣回升、營業額規模擴大


