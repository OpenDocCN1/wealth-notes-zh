    # 做「對」的事才能賺錢


    就顯示出特定人已經在「邊拉抬，邊出貨」中撤退。因此，當股價再創新高，成交量卻未跟上時，下跌反轉之後的上升，其實就是下一波股勢的高點，若是當下不忍清出持股的話，雖然通常還是會有一小段反彈的逃命波，但是因為先前曾經出現過多空大量，所以此時反轉的幅度通常不會太大。


    技術分析是協助我們，在無從認知基本面真實狀況下的一種好方法，除此之外，特別是做訂定新遊戲規則產業的投資，建議可以參考行為金融理論中的羊群效應模型（貝葉斯法則），這也是不錯的方式。簡要來說，貝葉斯法則就是當你看到一個人總是做一些好事，那麼這個人多半會是一個好人。


    因此，如果不能準確知道一個事物的本質時（例如對於基本面的認知不夠），就可以根據和這個事物特定本質相關事件出現程度的多少，去判斷其本質屬性的概率。譬如老是喜歡做一些弄詭事情的公司，大概就不會是好公司。換句話說，從實務上去選擇投資標的，通常股價表現最優秀的公司，往往反映的就是該公司一直不斷在做正確的事情，然後股價就會將這個內在展現出來。


    不過，要特別提醒的是，執行貝葉斯法則選股，並無法幫我們找到潛力飆股，而是在不能準確了解基本面，卻又想參與某個幾類股的投資時，可以採用的一種選項。


