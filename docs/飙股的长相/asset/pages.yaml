    當我們在投資股票時，最好謹記著「三不原則」：不要和趨勢（景氣）對作、不要和政府（政策）對作、不要和公司（Insider）對作。切記！景氣不好不見得沒有行情，但是景氣不好絕對沒有行情。換句話說，風險高、報酬低，當然不應該逆勢而為。


    至於公司大股東一手掌握內部資訊，另一手掌握股票（籌碼），小股民如何與他們鬥呢？當然，如果你選擇的是正派經營的企業，基本上就沒有對不對作的問題。不過，別忘了，在取得個別公司的資訊時，大部分就是來自於被投資公司的本事，然後再以競爭對手及產業相關資訊去做綜合的研判，這些訊息來源有些已被扭曲，因此研判的準確度自然得大打折扣，更何況，確實有不少大股東對於自家公司的股票著墨很深，而且國內的法人、實戶圈也盛行一股與公司派「共黨盛舉」的風氣，所以我們在投資時，當然應該盡量避開。


    而外匯、房市、債市、股市等市場，政府是同時扮演莊家及玩家的角色。'
