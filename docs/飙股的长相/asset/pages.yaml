  md: '高點D的預測值=170日圓（近期低點）

    + 100日圓（AB的大漲範圍）

    = 270日圓


    270日圓，就是我們對這檔股票高點的預測值。


    **2. 第一小漲（短期）：**從近期低點（C點）之後，這支股票又漲到230日圓（X點），然後再度下跌。我們先計算到目前為止的一段小漲範圍：


    小漲範圍=230日圓-170日圓=60日圓


    之後它的低點來到210日圓（Y點），但我們預測下次小漲的範圍也是60日圓，所以下次小漲的高點是：


    高點D的預測值=210日圓（近期低點）

    + 60日圓（CX的小漲範圍）

    = 270日圓


    **3. 漲漲結束：**漲到我們預測的高點270日圓（D點）後，接下來會大幅下跌。因為按照兩段式上漲的理論，兩次大漲結束後，就會觸頂轉跌。'
