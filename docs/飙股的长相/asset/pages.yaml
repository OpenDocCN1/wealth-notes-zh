  md: '# 企業發生巨大轉變的三大指標


    本章重點是分析企業未來的基本面，但盡量不使用「基本面」這種說法，因為一聽到基本面，通常會直覺想到是分析財務數字，但本章會出現數字的地方非常少。


    現代社會日新月異，每幾十年就會出現一次大變遷，而社會變遷會為不同的企業帶來巨大轉變，使得某些企業的獲利呈現飛躍式成長。分析基本面就是為了分析一家公司是否將發生巨大轉變，一家公司如果沒有發生巨大轉變，就不值得投資。


    好比天馬航空的巨大轉變，是來自於日航破產。在航空產業景氣蕭條之際，日航破產了，對天馬航空來說卻是千載難逢的好機會。因此，一家公司的基本面，最重要的是看出入有无巨大轉變，至於庫存是否減少、獲利率是否改善等細節末節，根本不用理会。


    想要學會分析巨大轉變，最快的捷徑是多看過去發生過的案例，這就像要參加公務員的資格考要多看占題，投資人多分析過去哪些企業發生過巨大轉變，就能找出勝胎換骨的明日之星，因此，請各位務必多練習分析過去的案例。


    你可以先從公司提供的「投資人關係」（指上市公司與投資人之間的關係，上市企業多半設有投資人關係部門，負責企業與資本市場的溝通，包括舉辦說明會、統整發布公司重大資訊等等。這類公司的官網也大多設有「投資人關係」專門網頁）情報開始着手，因為公司如果發生巨大轉變，一定會向投資人說明，所以瀏覽各家企業的投資人關係情報非常重要。'
