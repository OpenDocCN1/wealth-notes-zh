    從2008年6月到2011年6月，GREE的經常利益平均成長了13%，而且新上市的股票在簽訂期後通常會大跌，這種股價卻從一開始就不斷看漲，所以上市後平穩期沒有持續太久就突破高點（創新高價）——此時就是最好的買點。從這兩條觸股定理來看，無論獲利或股價走勢，GREE都達到標準，是不折不扣的高股。'
