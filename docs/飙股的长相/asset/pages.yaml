    # 三、擁有同業無法複製的展店能力


    零售業不像製造業，比較難以仰賴規模經濟來增加獲利，而且展店速度通常快不起來；另一方面，連鎖超市、超商、餐廳在全面展店後，往往會逐漸壓縮獨立商店（指獨立零售商只擁有一家零售店）的生存空間。因此，從另一個角度來看，現階段展店數仍偏低的連鎖企業，未來將大有可為。


    ASAHI 是連鎖自行車專賣店。過去在日本，自行車大多在獨立商店販售，後來逐漸被量販店和家庭用品連鎖店取代，但量販店和家庭用品連鎖店對自行車畢竟是外行，他們不會修車，店員也無法提供顧客商品的專業知識（至少目前是這樣），因此，專業的
    ASAHI 很容易搶奪市塲。


    目前 ASAHI 的市占率約15%，同業中沒有像 ASAHI 那麼專業的大公司，在品質齊全度方面也遠勝於一般的大賣場。由於目前沒有企業可以跟 ASAHI 匹敵，所以它已經成了獨占型企業。


    ASAHI 股價從2005年12月掛牌上市，到2011年9月的高點為止，總共漲了2.6倍，或許有讀者認為：「才2.6倍，跟其他飆股比起來，一點也不稀奇。」但你只要想到這段時間的全球股市有多慘，就會知道這支股票的表现有多驚人了。


    投資獨占型企業有個獨一無二的好處，那就是不管產業前景如何，獲利都能持續成長。以 ASAHI 為例，即使販賣自行車的整體行業銷售疲軟，但因為 ASAHI 是市面上唯一一家連鎖自行車專賣店，所以有很高的機率能繼續擴大市場。


