  md: '# 股價翻倍祕密 1 2014最值得投資的潛力大額股


    就是投機。


    當然啦! 本質為投資的股票市場, 也可以用投機的方式操作, 只是當短期的通氣用完後, 最終下場大概和絕大多數的賭徒一般畢竟, 依賴賭博致富的, 只有電影中的「賭神」勝得到。


    # 跟對潮流, 報酬隨著時間擴大


    「長期投資」是股市贏家最常提到的方式之一, 因為隨著時間的流逝, 往往更加有利於股票持有者。但是, 時間這個要素之所以能提高投資報酬, 必須是當投資方向與趨勢、潮流吻合時,
    潮流的影響性會隨著時間而擴大, 投資報酬也會跟著同步擴大。


    不過, 一般人很容易混淆, 你跟隨的到底是潮流? 還是流行？你還記得曾經風行一時的「葡式蛋塔」嗎？那股熱潮持續了半年不到, 現在大概只剩下肯德基還在特賣投入銷售蛋塔。


    蛋塔熱之後, 接著出現了「巨蛋麵包」, 這是更短命的商品, 當初同樣造成許多人一窩蜂地搶進店, 結果有許多商家還沒有裝潢好, 熱潮便消退了, 這就是「流行」。就好像股票投資的題材股,
    受青睞的時間短暫到禁不起考驗。然而, 堪稱台灣飲料之寶的「珍珠奶茶」就不同了, 現在竟然還可以遠赴國外展店銷售, 成為國際性的飲品, 這類商品就很有可能變成潮流。


    研判潮流或流行, 在投資的選擇上非常重要, 這可以表現在兩個部分, 首先是金融商品種類的選擇, 另一個則是產業的選擇。


