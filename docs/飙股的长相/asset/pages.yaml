  md: '# 行情混亂期，怎麼撿便宜？


    獲利重點：業績成長率突破過去十年新高，立刻買進。


    重要性：★★★


    混亂期的逆風狀況特別多。當我們順著風吹的方向走，會感覺身體變得很盈；但逆著風走，每往前踏出一步都很艱辛。日本天候大多是無風或微風，但股市裡卻經常吹著暴風。


    在混亂期，除非有利多消息出現，否則即使沒有利空消息，股價還是會持續下跌；換句話說，在這種情況下，我們只能買有利多消息的股票。這個原則也適用於上升期，只是在混亂期要更加嚴格遵守。


    以下我會先舉例說明混亂期不可買進的四種原則，然後再介紹混亂期該怎麼撿便宜。


    +   1. 獲利沒有突破之前的高峯，別買！圖表6-1的三菱商事，稅後純益在2008年3月期達到高峯（4709億日圓），但在全景不景氣的籠罩下，稅後純益於2010年3月期比起高峯時衰退了四成。股價在谷底時也蒸發了77%，之後該公司獲利回升，2012年3月期回到高峯的96%，幾乎算是重返高峯了。如果股價能如實反映企業的基本面，照理說三菱商事的股價應該也要漲回96%，但實際上，它的股價卻只剩下高點的一半不到。'
