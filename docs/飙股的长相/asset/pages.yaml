  md: "# 第六章：只要看重大盤，不必放空，下跌行情怎麼買怎麼賺\n\n跌局面不變，轉陽訊號的位置也會不斷下修。我在第一章圖表1-22曾經說明，當股價的波動範圍像皮球舞蹈般逐漸變小，突破平穩期後纍的位置就是買點，同樣的道理也能運用在大盤指數上。同樣地，當一國指數突破高價位的位置愈來愈低，世界其他主要指數也會發生相同情形。如果全球股市只有日經平均指數的創新高價位愈來愈低，代表日經平均指數進入上升期的時間遙遙無期。\n\
    \n# 中趨勢：看國內創新高價的公司有幾家\n\n相較於大趨勢是從全球來判斷本國指數的未來走勢，中趨勢則是只看本國市場現在究竟處於上升局面或是下跌局面。要觀察本國的大盤，首先要看市場上有多少創新高價股。\n\
    \n在上升局面中，不是所有的股票同時上漲，而是由創新高價股帶頭漲起來，然後整體股市才會跟著漲上來。因此，當帶頭翻漲的個股數量愈多，就代表上升動能愈強。我們可以用下面的公式算出具體的數字。\n\
    \n+    過去一年創新高價股數量\n 創新高價股數量比 = \\frac{\\text{上市公司總數}}{} ( % )\n\n至於這個比例的數值要怎麼看？請參考以下兩點：\n\
