  md: '# 第四章：這支股票會漲到哪？


    學會用「兩段式上漲」看K線，是提升投資技巧的必要條件，真的非常重要，請務必學會。


    所謂的「兩段式上漲」，其原理是：股價波動時，會產生兩個大小相同的漲幅，第二個漲幅結束時就是高點，之後就會暴跌。下面，我會用圖表4.14做為基本範例，詳細說明。


    +   1. 第一段大漲（長期）：首先請看第一段大漲（AB），範圍是100日圓（從A點100日圓漲到B點200日圓）。之後，股價跌至C點170日圓，然後再度進入上升行情。想要預測股價會從近期低點（C點）上漲到什麼價位，公式如下：


    # 「兩段式上漲」的基本模式


    ![](img/3859d335b09a86b1f0712da6ce5c7a2f_155_0.png)


    說明：第二段大漲（CD）中，包含兩次小漲（CX和DY）。'
