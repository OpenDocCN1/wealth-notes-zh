  md: '# 第七章：下單前，再學兩招守護資產的技巧


    請見圖表7-3的範例。JFE控股公司在2005年8月創新高價，於創新高價成為收盤價的隔天，突然開出一根大陰線，之後連續三天走跌。如果你遵照「隔天開盤前下單」的規則，這三天會虧損8.8%。此時，如果你用便宜1%的價格下單，虧損就會減少1%，多少可以減壓心理壓力，這就是我要求以便宜1%限價下單的最大理由。


    「下跌就有虧損風險」，是股票交易中非常重要的觀念，因此，下單看似是簡單的操作行為，你還是可以從中挖掘出避免虧損的技巧。這種面對風險的謹慎態度，往往就是成功獲利的關鍵。'
