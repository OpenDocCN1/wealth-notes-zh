  md: '# 如何看出大盤會上漲、暴跌或盤整？


    獲利重點：在下跌局面，多看少做是最好的策略。


    重要度：★☆☆


    你所選中的股票，即使公司獲利蒸蒸日上，股價走勢還是會受到整體環境的影響，因此，想要提高獲利表現，你還得學會大格局思考。所謂的「大格局思考」就是：了解目前的股市環境，並且預測未來的變化。以天氣為例，就是預測大盤未來會繼續放晴還是開始變天。


    股市行情如果只分漲跌兩種，未免太過草率，因為大盤最常見的情況，是長時間不上不下、多空對峙的盤整行情。因此，我把股市分成上升期和混亂期。這兩種狀況會交錯出現。上升期就是行情暴漲的時期；而混亂期除了行情暴跌的時期，還包括平穩期。就像天氣不光只有「晴」跟「雨」，還有「陰天」一樣，把股市的陰跟雨歸在同一類，就是混亂期。


    请看图表4-1，上升期和混乱期可再进一步分成上升局面和下跌局面。上升期以暴漲的上升局面為主體，下降局面只是短期狀況，這跟混亂期以暴跌的下跌行情為主體剛好相反；至於混亂期的平穩期，則是平緩的上昇與下降局面交替出現。


    接下來，本節會依照以下三個順序逐一說明：


    +   一、上升期：以暴漲為主體；'
