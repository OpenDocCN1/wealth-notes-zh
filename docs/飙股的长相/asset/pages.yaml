  md: '# 飆股的長相


    「1990年代的超級大飆股是微軟，之後由蘋果接棒。」這個事實對大家來說或許並不新鮮，但我相信有很多人看到這裡，才知道飆股的投資竟然可以飆漲近百倍，等於拿1萬元投資，可以拿回100萬元！


    # 飆股定理——獲利持續成長20%


    我們從前面的例子可以看出，凡是獲利無法成長20%以上的企業，根本稱不上成長型企業；而企業想要持續成長，就必須能提供社會需要的技術與服務——這些技術和服務，能讓投資人直覺：「這支股票一定會漲！」


    由此，我們得到飆股的第一條定理：企業獲利持續成長20%以上，股價就會飆漲；反之，做不到這一點，股價就注定低迷。


    我們回頭檢視蘋果與微軟這兩家公司的獲利情況。圖表1-3是以2000年的獲利為基準點，來比較兩家公司EPS（每股盈餘）的成長幅度。微軟從2000年以後，獲利成長率降到20%以下，而蘋果則是超過20%。


    從2000年到2011年，蘋果的年均獲利成長率為36%；相較之下，微軟平均只有14%。14%的成長率在不算氣時已經算是非常出色 的表現，但還是無法滿足市場的期待。微軟從1992年到2000年的年均獲利成長率有35%，到了2011年卻只剩下14%，連原先的一半都不到。2003年，微軟的獲利終於突破過去網路泡沫最沸騰的2000
    年高點；比蘋果早兩年達到這個目標，但股價依舊沒有大漲。'
