  md: '# 第七章：下單前，再學兩招守護資產的技巧


    # 實際上，你的投資很可能在某一年的獲利是負值


    一，心理壓力也會減少十分之一。


    如果你去賭場看同一桌的玩家，光是觀察表情，就能窺探他們的心理狀態。西方人比較大方，很容易跟陌生人聊開，賭局開始前戀愛跟人聊幾句，但賭局一開始，他們的眼神會立刻變得銳利，看起來判若兩人，尤其是賭金很大時，更容易看見這種狀況。


