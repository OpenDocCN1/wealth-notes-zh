  md: "獲利重點：合併只能延續股價下跌，股價走勢往往虎頭蛇尾。  \n重要性：☆☆☆\n\n# # 企業購併，往往是失敗者聯盟\n\n每當媒體發布某某知名企業要「迎娶」某家公司的消息，該公司的股價就會飆漲。這也難怪，當一家薪水雙大的公司誕生時，投資人一定會產生很多想像空間，期待購併能為企業帶來突破性的成長。雖然這類股票的股價通常會飆漲，但我要告訴大家：這種股票千萬不要買。\n\
    \n為什麼？請你自己問一個問題：「被買的一方，接受購併的理由是什麼？」答案多半很簡單：這家公司正面臨經營困境。對企業來說，脫離困境最快的捷徑，就是被購併。\n\
    \n當一家公司經營得很好，每季的獲利都順利成長時，是絕對不會想跟別人合併的。一定是公司高層斷定未來經營會更加嚴峻、市場需求會不斷降低、股價走勢將不被看好等等，才會想跟別人競購併。換言之，購併是在企業經營不善下，另一種形式的企業重整。\n\
    \n假設有兩家規模相當的公司A跟B要合併，這兩家公司合併後，並不會像變魔術一樣，產生一家新的C公司，只是在合併後，財報上的獲利數字，是A公司加上B公司的獲利而已。\n\
    \n更精確一點來說，由於企業合併後通常會裁減兩家公司職能重疊的部門，省一些人事成本，所以，新公司的獲利應該是A公司獲利加上B公司獲利再減去重疊部門的成本。"
