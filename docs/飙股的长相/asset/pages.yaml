  md: '# 一、有效的技術指標，就三種


    獲利重點：判斷指標與股價之間的相關性，是否合理。

    重要度：☆☆☆


    大部分的分析都不準，這對在股海中打滾多年的資深投資人而言，不是什麼值得大驚小怪的事。即便是基本面分析，除了在第一章介紹的篩選條件（營業額成長10%以上、獲利成長20%以上）其餘的指標效果也不大。


    但很多散戶迷信技術分析，甚至對自已採用的分析方式有多少可信度都不曉得，就不假思索地照著操作，這就像一直吃著不知有無藥效的藥物，遲早會出現副作用（對股價誤判）。


    如果你想到判斷某個技術分析的指標是否成立，有個簡單的原則可循，就是思考它合不合理。例如，貨車的運輸量是經濟成長的指標；景氣好，需要運輸的貨物自然會增加。這種關係性很合理，所以我认为未求要觀察景氣，這依然是有效的指標。


    另外，也有人说一国平均寿命的长短，是观察经济成长率的指标。你觉得呢？我怎麽想都通不通，景气好坏跟寿命长短有什?關係。很可能是做這份統計數據的期間，這兩件事剛好呈現高度正相關，才會產生「景氣不好，平均壽命會延長」或是「景氣不好，平均壽命就不會增加」等結論。


    而在股票的技術分析中，最為人所知的無效指標就是趨勢線。'
