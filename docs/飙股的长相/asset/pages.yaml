  md: '# 翻轉的長相


    與時代潮流不同，不必擔心在短時間內會突然轉向，因此受惠於政府政策的個股，有很高的機率發生巨大轉機。


    而且，政策概念股不必遵守「飆股定理」的篩選標準。我在第一章提過，如果一支股票最近二、三季營業額成長不到10%、獲利成長不到20%，就應該淘汰。這個選股條件是基於「業績沒成長，未來股價也不會成長」的股市定理；但政策概念股不必遵照這個規定，因為政府政策已經保證了需求確定會發生。


    下面我會介紹幾個政策概念股的例子，第一個就是不需關注近期業績的典型案例：地震重建概念股。


    日本營建股長期呈現低迷狀態，但2011年3月11日的一場大地震，讓它們谷底翻身。即使地震重建工作已經進行了三年，福島、郡山這些周邊災區，都還有不少大樓等待修繕，那是因為相關業者手上都有滿滿的大工程訂單，忙到沒空去做大樓修繕這種小工程。


    請見圖表2.13。Raito工業是典型的營建股，地震前的業績與去年同期相比，營業額衰退了13%，經常利益更是大減66%。地震發生後的第一季營業額成長了15%，經常利益則成長了79%；第二季營業額成長244%，經常利益成長200%；第三季營業額成長34%，經常利益成長110%（由於第一季和第二季的去年同期為赤字，所以這裡是以第二章第四節介紹的方法算出成長率，詳見第101頁～第102頁），而股價到2012年的高點為止，則比地震前高出一倍。


