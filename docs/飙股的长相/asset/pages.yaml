  md: '# 第四 chapters: 這支股票會漲到哪?


    # 「兩段式上漲」的波段構造


    接下來，我們藉由實際的K線圖，再進一步說明「兩段式上

    漲」的原理。


    股價的變化主要是由兩段漲跌波幅範圍相似的大波動組成，其構

    造有如洋蔥，無論剝了幾層，都維持著相同的形狀（只是愈來愈

    小）。同理，一波大漲中包括兩次中型漲幅，中型漲幅又可細分成

    兩次更小的漲幅。無論你是從大、中、小的漲幅範圍來計算，最後

    推算出來的亮點，基本上漲姿都是一樣的。


    請先記住這個概念，然後再來看图表4-15，它是由兩段長期漲



