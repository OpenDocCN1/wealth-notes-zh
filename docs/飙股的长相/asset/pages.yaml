  md: '# 在寂寞與等待中，

    找到自己的飆股


    ![](img/3859d335b09a86b1f0712da6ce5c7a2f_11_0.png)


    從事新聞工作二十餘年，我有很多機會接觸眾多財經產業人士，常聽到大家侃侃而談產業與投資趨勢；我也認識不少投資高手，每個人都能說出一套成功心法；我更常聽到周遭許多朋友，會善意提醒應該注意哪些「即將要大漲」的「明牌」。在工作之餘還能享有這種「紅利」，大概是很多朋友羨慕記者工作的原因。

    沒錯，我的確聽過許多「好康」的事情。「這是一個千載難逢的好機會，你絕對不要錯過！」這類的話，經常讓我在每天的投資決策裡，意亂情迷、三心二意。

    但是，累積多年的慘痛教訓後，我只能很無奈、也很無趣地告訴大家，只要聽到這種太好的消息，隔年興沖沖地跑去追，下場往往都很慘。而且，根據我的觀察，即使報明牌的人股齡再久、經驗再豐富，踏錯的機率一樣很高。

    因為告訴你明牌的人，通常不會告訴你何時該出脫；公司業績或基本面有變動時，更不會告知你；更糟的是，你不可能是一直聽到這支明牌的人，卻極有可能是最後幾個知道的人。股市明牌往往稍縱即逝，只能帶來短暫的激情，若沒有基本面支撐，更常帶來大災難。


    《今周刊》顧問、《財經熱點》主持人／林宏文'
