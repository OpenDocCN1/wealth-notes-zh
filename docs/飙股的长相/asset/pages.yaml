  md: '# 臘脫的長相


    # 三大重點，讓你最快找到飆股


    +   一、只看大格局。投資股票不能被細節卡死，必須著眼於大格局，因為任何投資方法都只能得出兩個結論：「買」或「不買」，就像氣象預測最重要的，無非是告訴觀眾今天出門要不要帶傘。投資股票不但不需要複雜的知識，而且知道愈多反而阻礙愈大。


    +   二、無論大盤漲跌，都能有效獲利。大部分的投資人在賠錢時就會想：「是不是該換個方式投資？」其實這是非常危險的操作方式。相機方士常說：「我照自己的方式比賽。」意思是無論對手是誰，自己的戰鬥方式都不變，投資股票也是一樣，方法或原則不因大盤漲跌而改變易轍。本書將教你選出長期發展看好的股票，並在它急遽上漲的瞬間買進——這才是投資的王道，無論大盤將怎么走，遵守我的投資法則，就能有效獲利。


    +   三、決勝的關鍵，在於把虧損控制在最低限度。控制虧損的能力決定了投資的成效。我舉個簡單例子，讓大家了解控制虧損的重要性：有兩個人比賽猜拳，贏家得到一塊錢，輸家要付一塊錢，一百回合下來後，身上剩下最多錢的人就是獲勝者。此時如果有人懂得某種擁有60%勝率的猜拳技巧，最後他贏了60次、輸了40次，所以身上還有20元。


    如果有人懂得勝率58%的技巧，最後贏了58次、輸了42次，則身上還剩下16元。雖然他的猜拳技巧，勝率跟上一個人只差2%，但獲利卻少了20%。2%感覺很少，但在投資里，這2%代表了專業和業餘的差別。'
