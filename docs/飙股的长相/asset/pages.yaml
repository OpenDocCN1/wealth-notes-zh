  md: '# ## 第四章：這支關股會漲到哪？


    難判讀以什麼點來連線（實際上，比較準確的是AB線段，因為後來三井物產的股價直接跳水暴跌）。


    但趨勢線最根本的問題是：沒有合理的理由能解釋AB線段或BC線段，何者的趨勢比較準確。


    # ### 技術分析與基本面分析，何者優先？


    幾乎所有的技術分析指標，都著眼於數據與買賣訊號的相關性，例如「經由數據驗證，只要出現某某訊號就應該買進…，但很少有人進一步深思其合理性。很可能在某段時間內，買賣訊號真的很準，但這就跟經濟成長率與壽命長短的關係一樣，兩者之間真的有相關性嗎？就算有，能持續多久？沒有人知道。


    我試過各種技術分析指標，最後只有三種效果比較穩定，我會在本章中一一說明。


    我也曾試著將創新高價後翻漲好幾倍的關股，拿來用各種技術分析指標檢驗一遍，結果符合標準的，大概只有一半。


    因此，如果你問我技術分析和基本面分析的結果產生歧異，應該以何者為優先？我會回答：「基本面前先。」但如果是從穩勝率、絕不賠錢的投資策略來看，我會回答：「除非能通過兩者的考驗，否則就不買。」


    技術分析指標的優點是：為了分析過去的股價、成交量等情報，必須列出所有的客觀數據，不會像基本面分析那樣曖昧。它可以拿出統計資料證明：「當某個數值出現，該檔股票上漲的機率有多少。」'
