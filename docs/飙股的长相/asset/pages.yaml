  md: '# 比別人早一步看出：

    「就是這支股票」


    ![](img/3859d335b09a86b1f0712da6ce5c7a2f_15_0.png)


    我寫這本書，目的是讓股票投資人增強實力，以柔道比喻的話，就是從白帶（請參閱〈大漲的訊號〉）連階成黑帶。我的目標，是教你一眼就看出將來會上漲二到三倍的股票。這類股票看似稀少，但股市確實存在著股價翻倍的實例，其中有人人都能接受的簡單理由，也必然存在能一眼看出這種股票的邏輯。


    股票會翻倍，代表該公司一定發生了巨大變化，買股的關鍵，就是買在公司發生巨大變化的時機點——這是本書最重要的觀念。26年前，我跟著投資大師吉姆·羅傑斯學習時，他就強調：「所有細一撇不管，只看大變化，一定要找出發生巨大變化的時機點。」當我聽到這個觀念時，手上猶如多了一把鋒利無比的複製武器。


    多年來，我擔任基金操盤手，一直遵從亞當斯古梅的教導，透過買取經驗的累積，我已摸索出一套獨門方法，能分辨「哪家公司即將發生巨大變化？最佳的進場時機點在哪裡？如何擁有掌握大局的觀察力？」，這些方法都將在本書公開，只要熟讀本書，下回碰到能飆漲二到三倍股票，你就能立刻判斷：「就是這支！」能做到的事情，是因為本書掌握了以下三個投資重點，能帶領讀者，比別人早一步看出翻倍的良相。'
