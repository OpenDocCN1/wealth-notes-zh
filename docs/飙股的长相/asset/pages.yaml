  md: '# 不要把資金

    全押在同一檔標的上


    獲利重點：分散投資能幫助你將虧損最小化。

    重要度：★★★


    很多鼓勵民衆投資股票的文章都會這麼說：「以每年獲利15%來計算，投資10年，你的資產就會翻4倍。」這種數字只要動動計算機，任誰都算得出來，但我相信真正在股海打滾多年的人，絕對不會贊同這種說法。


    我不是說你的資產不可能在10年內翻4倍，而是年獲利15%，絕對不可能。實際情況比較可能是：有時40%，有時-10%，只是平均算起來是15%，但算這種平均值就像在算老翹和大象的平均體重，一點意義也沒有。


    事實上，股票的投資報酬率每年都會上下波動，如圖表7-4所示。當市場處於平穩期，獲利可能不高，但等到暴漲行情來時，資產就會大幅增加。此外，當行情走跌，報酬率也有可能是負值，而當行情轉為和緩的上升期時，資產也可能會逐步增加。


    再厲害的投資人，都不可能完全沒有看走眼過，但有個辦法可以讓「看走眼」帶來的後傷力極小化，就是分散投資。


    分散投資是指不把所有的資金押在同一檔股票上，而是把所有資金分散到不同的股票。這麼做的主要目的就是減少虧損金額，道理很簡單：買100股股票賺一賠錢，損失是買1,000股票的十分之'
