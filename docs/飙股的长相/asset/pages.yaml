  md: '分散投資運用在上升行情裡，也能有不錯的報酬率。在圖表-5


    的上升局面中，資金的成長幅度得遜於日經平均指數，這是因為那


    段時間屬於混亂期的平緩上升局面；換句話說，由於行情的上升力


    道太弱，導致創新高價股的數量較少，所以組合投資未能完全發揮


    效用。


    在上升行情中，最能影響投資組合表現的因素就是持股比例。


    假使上升情力道夠強，根據選股原則，你應該有很多檔股票可以


    買，甚至會買不完，很有可能在行情初期就將資金佈局完畢，而且


    這些股票之後的漲幅肯定不小。


    每十支創新高價股中，大概只會出現一支真正的大翻股，約


    有四支必須停損，剩下的五支績效比大盤指數稍微好一些。這就像


    即使用很多散手一夕爆紅，但真正能在年底登上紅白歌唱大獎的藝


    人，依舊是鳳毛麟角。


    所以，比起把所有資金押在同一个標的，分散投資碰到明星股


    的機會會更高。基於這個理由，就算在上升行情，我還是認為分散


    投資的獲利表現，會比孤注一擲來得好。


    # 分散投資不同類別的股票


    分散投資時，如果你打算購買十檔不同的股票，請務必要把資


    金平均分成十等份，千萬不要有「我覺得某檔股票會大漲，所以當


    作重點投資對象」這種想法。


    即使你在買進前很篤定「這檔股票一定會翻檔」，還是有可能


    會碰上暴跌、不得不停損，最後反而是你不看好的股票上漲了。'
