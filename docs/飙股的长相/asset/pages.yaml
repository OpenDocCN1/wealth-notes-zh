- pgno: 119
  md: '三個指標：


    +   1. 公司面臨危機時，成功推出新產品。

    2. 在重整過程中，幸運碰上景氣復甦、需求回升。

    3. 重整成功，重新贏得顧客的信賴。


    近年來，日本重整成功的知名案例就是日產汽車。從卡洛斯·戈恩（Carlos Ghosn）自1999年3月擔任日產汽車的營運長以來，便開始重新改造這家公司，使得日產汽車從原本在2000年3月期虧損6800億日圓，到2003年3月期已出現約5,000億日圓的盈餘，只花了三年時間就讓公司起死回生。


    之後幾年，日產汽車的稅後純益不斷成長，到2006年3月時期，已經達成連續六年獲利成長，這樣的好成績也反映在股價上，從卡洛斯·戈恩就任前的低點290日圓（1998年10月），飆漲到1,556日圓（2006年5月），暴漲了五倍多。


    請看下頁圖表3-9，日產汽車從2000年以來，股價三度創新高：


    +   ① 2001年3月：突破了1999年10月的高價770日圓，最近一期的獲利成長了300%（2000年4月9日期所發表的上半年財報，當時尚未引進季報制度），成績非常漂亮。不過，營業額只成長了2%，等於成長速度停滯不前，因此這個時候還不是買點。


    日產汽車在第一次創新高價後，股價幾乎沒有在上漲，而是呈現盤整的態勢，2001年9月又跌到405日圓，股價幾乎腰斬，可見此時不宜是明智的判斷。


