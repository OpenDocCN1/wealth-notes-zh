    # RCI的公式


    以下是順位相關係數 RCI 的公式。


    | 順位相關係數的公式: |

    |---|

    | RCI(%) = $[1 - \frac{6D}{\text{天數} \times (\text{天數的平方}-1)}] \times 100$ |

    | 說明: D的算法另外介紹。 |


    現在我們把公式套用在圖表5-11的四條走勢圖，由於只有四天，所以算式如下:


    ```

    RCI(%) = $[1 - \frac{6D}{4 \times (4 \times 4 - 1)}] \times 100$

    ```


