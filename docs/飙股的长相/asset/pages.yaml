  md: '# 顯股的長相


    據，因為公司的業績展望有時候會騙人，但技術指標及量價關係，卻往往透露出大股東或圈內人無法掩飾的操盤痕跡。


    而且，近年來台灣許多產業漸失國際競爭力，投資人戰海外的比重也大幅增加，這本書提出眾多的投資原則，正可做為投資人轉換歐美日韓以及香港、大陸股市時，一個簡單可行的選股參考。


    # 投資是容易的，等待是困難的


    最後，我還想分享兩個自己的投資經驗。我覺得，投資其實是一件非常個人的事，也是一條很寂寞的路，想在股市長期獲利，只有自己投入時間研究、觀察與練習，在錯誤中修正自己的投資習慣，在衆聲喧嘩中找出適合自己的股票，才能成為最終的贏家。


    此外，我也覺得大部分的投資回報，都來自於對產業長期趨勢的掌握，以及伴隨而來的漫長等待。就像詞曲創作人李宗盛在〈你像個孩子〉這首歌中所寫的一段歌詞：「工作是容易的，賺錢是困難的；戀愛是容易的，成家是困難的；相愛是容易的，相處是困難的。」而最後一句道出：「決定是容易的，可是等待，是困難的。」沒錯，決定投資標的有時比較容易，但如何等待到題材發酵或實現，卻是最困難的事。


    希望每位投資朋友都能從這本書中，找到自己成功的心法，更重要的是，找到每個人投資世界中的那支顯股。'
