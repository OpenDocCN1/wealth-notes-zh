    投資人經過這些年的洗禮後，逐漸了解新藥開發才是生技公司最大的附加價值，也願意給這類公司不同於以往的評價。這些高額的溢價，抱注業者投入漫長開發過程中所需要的活水，更有助於讓產業發展步入正向循環。


    事實上，我們從全球已發展成功的生技產業群聚經驗便可得知，生技產業發展成功的要素包括：政府政策、研發能量、資金與人才吸引、產業聚落等，這四項要素缺一不可。其中，從2007年開始，政策性的推動已是不遺餘力，只是高風險、高報酬，外帶回收期長的特性，使得新藥公司籌資不易，所以能否導入一個成熟的資本市場，並由造市者（政府、大戶、業者本身等）制定出一套遊戲規則，將是關鍵的臨門一腳。


    當政府有意對某個產業扮演造市者的角色，並制定出遊戲規則時，就是一個新的戰場。這時，有意參與者應該放棄原有的評價模式，看清楚新的遊戲規則；搶占先機，就有機會成為股市贏家。


    # 忽爆大量收長紅、創新高，大漲號驟出現


