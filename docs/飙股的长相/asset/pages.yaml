  md: '# 第一章：選股密技百分百，我的最快看出飆股


    3. 平穩期最高價的位置：平穩期的最高價位置，至少必須跟兩年前的高價一樣。假設只達到過去一年以內的高價位置，則果債的上涨能量不足，很難出現暴漲情況。


    漂亮的平穩期，範圍的形狀和鉛筆一樣細長，長度（期間）越長、幅度（範圍）愈小，距離平穩期後暴漲的機會愈大，其中尤以「範圍」影響最大。當範圍超過30%，買進的風險會增加；反之，若範圍在15%以內，暴漲的可能性就很高。


    我們來看看判斷是否符合平穩期三個條件的幾個例子。首先請看圖表-16紅色細度的地方，從形狀來看，東芝電力公司並未形成真正的平穩期：因為它的範圍很大，而且股價只是回到原本的高


