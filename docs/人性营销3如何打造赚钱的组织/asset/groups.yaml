    从创业那一刻起，我们就在挖掘自己的无限潜力，每个人 的潜力都是无限的，我们需要挖掘它。以前说时就是金钱， 我觉得大多数的时间其实不是金钱，而智慧加时间才是金钱。


    我们公司有人来工作，你不说啥，他都懂了，自己就去 干活，每周都能为公司创造出收益。有人呢，你天天说，他 还是不懂，自己做事老是出错，不想问题。这样的人，我们是
    坚决要请他走的。


    公司不是慈善机构，公司首先是赚钱机器，这一步完成了， 我们再抨其他的。我最喜欢的事情就是分析人，没事的时候就 去想想周围的伙伴、同事、客户，想想这个人是什么性格，做
    哪些事情做得好，有没有前途。慢慢的这些人的属性都被我研 究透彻了，研究透彻了就很好指挥了，很好把控了。既能很好 地帮助我们自己，也能很好地帮助他人。公司就是把人组织好，
