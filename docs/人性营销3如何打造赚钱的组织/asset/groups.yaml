    \n> ——陈昌文\n\n学老板兵法，\n就进《陈昌文方法之老板兵法》读书社群！\n\n我感觉我发现了一个天大的秘密，这个秘密就是“卖”。我这一生，啥都不用研究了，就是卖就行了。东西有人生产，技术有人学，我只负责卖。\n\
