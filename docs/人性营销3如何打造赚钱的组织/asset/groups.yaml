    \n——陈昌文\n\n实践陈昌文方法精华，\n就进《陈昌文方法1000问：师生问答集》读书社群！\n\n## 人性营销系列\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_331_0.png)\n\
    \n这套书籍是陈昌文先生关于为人处世、心理、立志、家庭伦理、互联网营销、自媒体、粉丝经济、社群营销等方面的、师生之间的“新营销论坛集”。你读了《陈昌文解读〈论语〉》（1-2）、《陈昌文方法72大营销系统》（上、下），要进一步升华你的思想、实践到实事上，并取得事半功倍的成绩，就一定要进《陈昌文方法1000问：师生问答集》(1-2)读书社群！\n\
    \n> ——陈昌文书籍编辑\n\n## 陈昌文读书书社群又精准又专好！\n\n学做社群，\n\n就进《陈昌文方法之一个社群人的自白》读书社群！\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_332_0.png)\n\
