    \n人性营销系列\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_330_0.png)\n\n陈昌文读书社群和老板社群，研究的是三大管理哲学思想、陈昌文方法，也就是价值观＋营销。三大管理哲学思想，统领《陈昌文方法72大营销系统》，以及营销系列、赚钱系列、讲师系列、老板系列、恋爱系列。三大管理哲学思想本身就是王道思想，而营销是术，这道术一结合，就自成一体，成为最强大的营销学。\n\
