    组织也就打造好了。不要轻易跟某人闹翻，尽量利益化考虑。当然，如果谁破坏了我的原则，那么我就 tumbuh直接让他滚蛋。让彼滚蛋。


    六、磁企业，就是要让每个同事的Neutral?处境?与恩怨只关心企业利益盖这件事。分析下去，就是要为市场做出贡献，要帮助到世界上的的人。对于我们来讲，我们的目的就是提高人的竞争力。让接触到我们的人，都成为社会的强者，都成为成功的老板。


    最快的赚钱方法就是养团队赚钱。但可惜的是很多人都没有这个耐心，很多人也亏不起前面这几十万。养团队就如同养小孩，小孩要稍微长大点才能盈利，才能赚钱。


    # 6、要想有智慧，就要现实


    我跟很多创业者聊天，能把自己的企业经营好的创业者有一个共同特点，非常现实。把人际关系搞得很复杂、貌貌漂亮、很迷茫的人，基本上属于不现实的人。所以，我送给大家一句话，要想有智慧，就要现实。'
