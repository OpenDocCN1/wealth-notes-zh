    \n## 老板系列\n\n学做直播，\n\n就进《陈昌文方法之讲师宝典系列·直播时代》读书社群！\n\n这是一个移动互联网时代、视频直播时代、社群经济时代，也就是说这是一个互联网个体经济崛起的时代、人类发声的时代。每个人都可以是平台上的一主角、主播、经济个体，利用自己的特长去经营粉丝，获得流量，进而变现。这是一个新的安身立命的生活方式。说话，代表了一种价值观。而通过说话达到变现的目的，就需要有超强的营销思维能力，从这个角度来讲，人人都是讲师。\n\
    \n> ——陈昌文\n\n## 讲师系列\n\n## 陈昌文读书社群，开启人人读书记时代！\n\n学品牌营销，\n\n就进《陈昌文方法之讲师宝典系列。品牌营销》读者社群！\n\
    \n![](img/0fcd129d4f066239bf5d7df0159854dc_336_0.png)\n\n真正的赚钱，就是路走对了，思想对了，然后钱就来了，搞不清楚为什么来的那么快，只不过就是一个想法、一个思维问题而已。真正的营销，就是日日循环品牌营销。只要品牌营销有意义，不搞品牌营销，你相当于白干。有了品牌，微博、朋友圈、视频、直播的营销才有意义，才能让客户直接找到商品，直接有信任感。\n\
    \n> ——陈昌文\n\n## 讲师系列\n\n学深营销，\n\n就进《陈昌文方法之讲师宝典系列。一句谎深营销》读者社群！\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_336_1.png)\n\
    \n人混社会，靠的是时机，也靠借用，也就是复制，也靠平台，也靠自己的智慧。如何赚钱？实践摆粉 + 变现就行了。如何赚钱？复制，就行了。自媒体玩的就是个爆粉游戏。\n\
    \n> ——陈昌文\n\n## 讲师系列\n\n## 陈昌文读书社群，开启人人读书时代！\n\n学恋爱，\n\n就进《陈昌文方法之恋爱与情绪的智慧1》读书社群！\n\
    \n![](img/0fcd129d4f066239bf5d7df0159854dc_337_0.png)\n\n人类的核心，就是生存与繁殖。生物的主要属性，就是生存，就是赚钱，就是养活自己，让自己的家人过得好。然后是繁殖后代。高智力的人懂得要怎么赚钱，要怎么繁殖。安全感，是实实在在的物质基础堆砌起来的。脱离物质谈安全感，这就像脱离刑法谈犯罪一样。\n\
