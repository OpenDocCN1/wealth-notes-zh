    ……\n如果你学会了富人的思想，那么就算你做自己的项目，也会比以前更加赚钱了。\n\n> ——陈昌文\n\n## 人性营销系列\n\n## 陈昌文读书社群又来了又享又好！\n\
    \n学人桂营辑，\n\n就读《陈昌文方法论之人性营销2，如何对准赚钱的 Announcements 读等方法评！\n\n赚钱的核心就是不断的分享价值。商业社会，一个人能富有，本质上是因为他做了很多贡献。不管是互联网经济出来没出来，最赚钱的方式就是做出贡献。\n\
    \n挣钱，本质上мотр一句话就能解释：就是天下没有免费的午餐，你想要挣钱，你就得向社会提供价值。你只要明白了这个理论，那么你就能明白网络上的钱是如何挣来的。\n\
    \n## 人性营销系列\n\n——陈昌文\n\n学人桂营辑，\n\n就读《陈昌文方法论之人性营销3，如何对准赚钱的组织》读等社群！\n\n赚钱靠的是眼光，靠的是智慧，没这个你就去学。\n\
