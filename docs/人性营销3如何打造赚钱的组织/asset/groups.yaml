    ## 第四个能力是研究与创新的能力。


    这种能力在科技创业公司非常常见。比如说，滴滴打车，以前没有用打车软件打出租车的，现在有人发明了这个方法，这就是一个创新。比如说，第一个做电子商务的人，这也属于创新。比如说，第一个做电动汽车的人，这也属于创新。


    互联网现在比较火的各种 app，以前是没有的，现在智能手机上面有很多 app，也是属于在手机上面的一个创新，也是互联网行业里面一个创新。


    腾讯拥有 QQ，后来张小龙同时又发明了微信，这也属于一个创新。


    把别人的事情复制过来，重复做，这个是模仿，自己搞一个新的体系出来，就被称为创新。创新是获取利润最大的一种能力，但对一个人各方面的要求是非常高的。


    ## 第五个能力，管理能力。


    管理能力是怎么体现的呢？你能够把一帮人组织起来，把一件事情做好，就算一个人有管理能力。做事情有计划，能够在程序和结果上体现出自己的控制力。不太要求对具体事情有一定的专业知识，而是要求有一定的
    人际关系处理能力、协调人的能力，这就是管理能力的一些体现。


    做管理其实不难，如果你个性开朗，做事有条理性，有合作意识，愿意比普通人付出更多的精力，那么成为一个优秀的管理者也是很容易的。


    ## 第六个是领导能力。


    我们中国人被称为汉人，我最佩服的领导者就是刘邦。因为刘邦他领导了张良、萧何、韩信，每个人都是很了不起的大人物。


    领导者的能力体现在大家觉得跟着你很有前途，有未来。领导者知道自己一个人啥也干不了，他就有团结别人为自己办事的能力，所以要求领导者需要心胸宽广、海纳百川。


    领导者还要有一个能力，就是识别人、知人善用，看得清楚每个人长处与短处。


    混社会的六种能力，大家可以根据自己的具体情况，看一下自己到底具备什么样的能力，或者是你到底愿意向哪个方向发展。


    先天的，比如说你长得不漂亮，这个已经没办法改变了，是被上天决定的，但是后天有很多都可以通过学习与实践来提高其他的能力，我们赚钱或者是创业的本领自然就会增加。天天坐在家里空想，肯定是不能赚大钱的，必须根据社会的具体情况、自己的具体情况，选择一个或者几个能力来提高。


    ## 3、这个世界是只有你能够挣钱，你才有价值


    一个人只要活的不单纯，这个人就很难有前途。因为人的精力是有限的，你的注意力只要被那些没有用的东西吸引，你就会变成一个傻子，你就浪费了生命。


    比如无聊的朋友，比如没有用的聊天，比如无聊的电视剧、无聊的游戏。这些事情都会浪费你的生命，而只要你没有特别注意社会中吸引你的注意力的东西，你就注定被那些东西浪费掉你的生命，你自然就一事无成。


    我们人生当中最宝贵的就是我们的时间、我们的注意力。因为我们的生命就是由时间和注意力组成的，我们可以用我们的时间、注意力换取事业，说白了就是钱。但我们也可能被别人浪费掉我们的时间，然后让我们一无所有。所以每时每刻我都在问自己是否有人在浪费我的时间？我手上的事情是不是值得继续做下去？我身边的人真的对我有价值吗？


    每一个人都会在不知不觉当中浪费自己的生命。只有那些不断反思的智者，才会一次又一次的把自己拉回正轨。真正的聪明人应该只有做项目，只有搞成交，只有搞流量。说了，这个世界是只有你能够挣钱，你才有价值，或者说你的时间的价值最终是通过你挣了多少钱体现出来的。其他的事情都是扯淡。所以我们每分每秒都要尽可能的释放价值给我们的客户。


    我们每分每秒都要尽可能的跟客户沟通，不断的优化我们的产品，不断的优化我们的广告，这是我们盈利的唯一出路。


    我建议你上午反省一次，下午反省一次，晚上反省一次，目的就是看自己的时间是不是用来赚钱的，还是让时间白白溜走了。你只要真正严格按照我说做的，我想你的项目肯定能够做好，你也就能够财富自由。


    ## 4、老板接受的信息必须是可以换成钱的


    我们的人生没有多少时间可以浪费，我们只对我们有帮助、能给我们产生效益的事情有兴趣。有些人喜欢聊无聊的问题，我直接赶开就行了。


    **当老板的，要特别注意员工是否在找你闲聊。**比如，有一个员工问我，老板，你怎么看待某件事情？我就告诉他，我只对工作感兴趣。如果我们回答了员工这种无聊的问题，员工就会不断的跟你讨论这种对工作毫无帮助的问题，并且他还会把你的观点传播到公司的每一个角落，无形中浪费你公司每个员工的时间，而时间就是金钱，也就是把老板的钱扔到了水里。


    **无聊的人不是来帮老板赚钱的，他是来谋杀老板的时间、精力和金钱的。**我们会在社会上碰到很多事情，比如，一部电视剧很好看，你就要看这部电视剧对你有什么正面的效果，没有，我们就不看。有人来找你喝啤酒，吃烧烤，你也要想，干了这件事情耗费几小时，对你的收入有提高吗？没有提高，我就不干。


    当你认识到这个问题，你的生命就一定会开始向好的方向改变。


    年轻的时候我经常看武侠小说，甚至看《知音》这种杂志，可以说这些书籍对我一点用处也没有，就是浪费了我的时间。我也特别喜欢看书，不过只看商业类的，或者跟我工作相关的书籍、博客、微信。**这些信息进入我的脑袋是可以直接换成钱的。**


    **我们可以选择过一个无聊的、没有什么价值的人生，我们也可以选择过一个有趣的、有价值的人生，主要是看无聊的人**


    ## 与事来找我们的时候，我们能不能习惯性的拒绝。


    ## 5、有了异于常人的言行，自然有异于常人的地位


    普通人特别在意周围人的看法，他很怕自己做了什么，从而受到周围人的批评与嘲笑。实际上，如果你想成为出类拔萃的人，你想成为人上人，你做的动作肯定会让周围人不适应。你的言行大家是不会接受的。如果你的言行大家接受了，就说明你按照普通人的价值观在说话做事。那么你的结果就是一个普通人。虽然没有人嘲笑你了，但你的代价就是成为他们中的一员。


    很多人承受不了来自别人的舆论、批评、嘲笑的压力，所以一事无成。而强者是面对很多人的嘲笑、谩骂、甚至侮辱，依然能够谈笑风生，依然能心静如水。这就是了不起的人。有了异于常人的言行，自然有异于常人的地位。就算现在不是，以后也会是的。


    普通人要成为一个成功者，最重要的就是价值观跟普通人


    区别开来，以成功者的价值观说话办事。很多人一直没有改变自己的价值观，那么不管他做什么，他都不能赚到更多的钱。只有改变自己价值观的人，才能与以前的自己有所不同。


    ## 6、思想决定一切


    给那些聪明的穷人、未来的富人的 6 句话。


    第一句，不乱交朋友，把人际关系中的泡沫通通拣掉。


    以前的同学、熟人、没什么能力的人，如果你顾及感情，就保持点头之交、一般的礼节往来往。认准生命中的贵人。谁给你钱，谁给你位置，谁就是你社会中的贵人。花 95%
    的时间与精力，与贵人交往，尽你的可能让你的贵人利益最大化，与贵人形成最有利于的联盟，效忠并维护他们。


    第二句，你周围有很多是拖你后腿的，这些人包括借钱不还的人，经常麻烦你、给你带来不好处的人，思想偏离正道的人，负能量的人，不讲道理的人，不对你说真话的人，敷衍你的人，躺平、懒散的穷人，这些人直接绝交或者远离。


    第三句，对你很忠诚，为你做事上心的人，你必须给予他们一定比例的金钱。只有金钱是实际的。给他们金钱，让所有的人明白，只要真心为你做事，肯定有肉吃。


    **第四句，要站对队伍。**

    要成为富人，就得站在富人堆里，不能站在富人与穷人之间，这叫不伦不类、不三不四、墙头草。两面派没人喜欢，要有清晰的阶级意识。你要真决心成为富人，你必须从心里跟所有的穷人断掉来往。


    **第五句，养成高效工作的习惯、抓重点，做最有生产力的事。**

    每干一件事情都要问自己，这样事是否能产生金钱。比如，逛街、看电视剧，与一帮穷人闲扯淡的事情永远不再出现在你的生命里。


    第六句，搞清楚这个社会到底是靠什么说话的。

    做一个真君子，真君子就是要有钱、有权、有势力、有德行。


    **我们这个社会上有很多噪音，把大部分人的脑袋搞得稀里糊涂的，听我的课程，看我的书籍，目的就是让你认识到社会的真相，让你拥有真正能让自己飞黄腾达的思想。思想决定一切。**


    ## 7、把这三点兼顾好了，你就能比一般人都混得好


    人的成就首先来自于他有什么样的思维。某些人认为务农好，干苦力光荣，比如我的农村阿姨、大叔们就是这样的思维，他们就终身从事这样的工作。他们是被环境改造成了讲干苦力光荣，劳动最光荣的。这就导致他们一辈子经济拮据。


    还有一些人，在大城市生活感觉竞争压力大，就跑到二线、三线城市去找工作，他们以为那里的竞争压力小。其实不然，大城市的投资多、公司多、资源丰富、国家重视，小城市投资少、资源少、发展有限。从某种程度上来说，竞争更加激烈，而且小城市裙带关系非常严重。盘根错节的发展更加有限。


    思维方式基本决定了一个人的高度，思维方式比价值观、手段更加重要。有了好的思维方式，会事半功倍。


    比如，很多大学生一毕业，就想去大公司工作，其实大公司教会你的是格局，是视野，可能这些你都学不到。因为你刚出社会，没有这个心去学这些。刚出社会，如果能进创业公司，


    算你三生有幸，但创业公司都很小，风雨飘摇，你觉得不安全，你不会去，去了也只待一小段时间就跑路了，结果就错过了很多机会。


    有的同学参加工作刚几年，在小公司陪着公司发展，就成为了一方主管。有人进了大公司，几年过后，就被培养成螺丝钉了。大公司的利益固化，而小公司只要能发展起来，利益没有固化，你的机会很多，富贵险中求。但大部分人都不敢冒险，这也是思维方式的区别导致一个人一辈子的成败差距。


    再谈一下价值观。我的价值观就是做事要有 effectiveness，比如我们招聘一个员工进公司，我考核他的标准就是为企业创造了多少业绩。


    我曾经有一个错误的价值观，就是只要这个员工愿意努力，我就培养他，结果我招聘到了好多看着很努力却没有成绩的，浪费我半年的时间，我还得给他发工资，他还不满意公司，最后我被迫开除了他。


    我还收到了一个错误的价值观，就是用人所长，则人人可用，以至于很多主管向我反映，有的人就是应该开除，我还让这个主管把这个人留下，我还恼罪主管不会用人所长。后来这个人经常犯错误，给公司造成很大的损失，我才不得不开除他。这就是价值观错误的后果。


    现在，我完全看业绩，业绩好的、合格的，留下；业绩不好的、不合格的，辞退，公司的管理就完全顺畅了。所以，价值观正确很重要，价值观正确，一切都会变得轻松简单。


    要成功，首先要有方法。


    方法是怎么来的？是靠勤学苦练，不断请教别人来的，靠自己琢磨来的。方法对于普通员工来讲很重要，就是一技之长，就是养活你的本事，不管你是从事管理，还是从事营销，还是从事技术工作，都是你的方法。


    那么老板最重要的方法是什么呢？就是制定制度，制定公司的规则，制定奖罚措施，找到合适的人在合适的岗位上。至于具体的事情，都应该由员工干。


    人生，把思维方式、价值观、方法都兼顾好了，基本也就可以比一般人混得好了。在中国这个社会，一个人想混起来真不难，机会多得很，只是大部分人都是稀里糊涂的。


    ## 8、老板就是付钱让别人帮我们解决赚钱这个问题的人


    由于我自己天天搞招聘工作，见过不少人，也带过很多团队，也见过不少笨的人总是喜欢自己创新，喜欢发挥自己的思维，结果经常把事情搞砸，搞得客户不喜欢，领导也不喜欢。聪明的人就是按规矩、按规则做事，大家都非常喜欢，客户也很喜欢。


    老前辈早就定下来规矩了，老前辈也知道如何解决问题，但是我们有的大学生以为自己很了不起，怀才不遇，就是与众不同，要发挥自己的智力，结果经常浪费大量的时间给公司生产垃圾。


    孔子讲过，愚而好自用，贱而好自专，就是说愚蠢又卑贱的人喜欢凭自己的主观臆想做事。


    其实你碰到的所有赚钱问题，别人都碰到过。愚蠢的人是自己去发明电灯，以为这样省钱。聪明人直接购买电灯，直接点亮，然后就可以 了。我们必须不断的向别人学习，用别人的


    ## 智慧与经验来武装自己。


    什么是大数据，就是你知道的方法、经验、智慧多了，你就可以用这些东西来武装自己的人生。在互联网上做生意也是这样，你必须借用别人的经验，但别人是不会主动教你，也不会免费教你，你就必须得付费。天下没有免费的午餐，不管你喜不喜欢这顿午餐，你都得付费。养成付钱的习惯才有赚钱的习惯。什么事情都是这样，没有付出就没有收获，只有付出才有收获。


    你或许会讲，我付钱了并没有收获，我以后不付钱了，这是愚蠢至极的想法。不是每一次都有收获，或许下一次就有收获了。我们付钱干什么？就是付钱让别人帮我们解决问题，而不是我们自己去解决问题。什么是老板，老板就是付钱让别人帮我们解决赚钱这个问题的人。你根本不用自己解决问题，你只要养成付钱的习惯，就有人帮你解决问题，就能养成赚钱的习惯。这个逻辑是通顺的，我们是实践得来的，但对于普通人来说是逆反个性的。


    ## 9、忘掉你的情怀


    什么样的人是牛人？就是实事求是。完全以实际发生的事情、唯一准则去做事的人。一般的人都做不到。一般的人感情比较重，他们就活在自己给自己构建的那个虚幻的世界。这个世界与真实的世界不能重合，有误差，故而这样的人经常会受到损失。


    经商的过程就是让一个人变得越来越理智、现实的过程。

    有点情怀的人都要倒霉。


    我也是一个有情怀的人，我经常受伤。比如，我认为员工不用管理，他们应该能做到上班不迟到，下班不早退，故而很长一段时间，我们公司都没有指纹打卡，如此麻烦就不断发生了。有别的员工甚至迟到1个小时，甚至大部分人都习惯了迟到，因为无所谓嘛，反正又不罚款。本来想给大家减少麻烦，结果天天让自己生闷气。


    我还是一个想给员工自由的人。比如，我说你们累了就睡


    觉，睡醒了再工作，这样比较人性化。结果就有人下午3点半、4点了，还在睡觉，一天才上8个小时班，有的人实际工作时间只有4小时，这就是情怀对我带来的伤害。


    我听很多人说，互联网公司，特别是对于年轻人，我们尽量自由一点，但我发现根本不是那么回事，自由是自由了，公司就没有什么时候业绩了。所以逼着我搞制度化，中午休息时间就是一个半小时，上下班都要打卡，违反了就扣除，这样一来，什么事都没有了。


    做人，特别是做老板，还是现实一点，按规矩办事，不伤害别人，也不伤害自己。如果你是一个有情怀的人，恭喜你，你要倒霉的。情怀这东西，谈出来娱乐娱乐普通人就行了。当老板的千万别当真，否则你的钱袋子就要扁下去了。


    ## 10、以买卖人的思想去做企业


    如何打造一个赚钱的企业？


    第一，这份工作必须发挥你的特长。


    如果你做的工作发挥的是你的弱项，那么你就倒霉了。你找不到任何快乐，你也不可能做好这份工作。其实每一个人都有他擅长的地方。人的成功就是在自己擅长的地方工作。如果你不擅长你的工作，那么必须找到你擅长的的工作。


    ## 第二，只有当你找到你擅长的工作的时候，你才有机会把你的工作变成一个娱乐活动，你在工作中能找到成就感，又能赚到钱，这个时候你就欲罢不能了。越是欲罢不能，你的业务能力就会疯狂提升，然后你工作起来就如同玩游戏一样，你会爱上你的工作。


    ## 第三，要习惯性的放弃垃圾客户。


    这个世界很大，有很多优秀的客户，我们要想尽办法为优秀客户服务，我们才能赚到很多钱，并且自己很快乐。不要为没钱的客户服务。没钱的客户是非多。


    我以前做了几个实体项目，拖欠工程款的非常多。后来我做了电商项目，从来没有拖欠款项的事情，最多只有中通快递、顺丰快递的周结账、月结账，基本没有拖欠现象。


    与没钱的客户在一起，就会有很多垃圾事情，比如送礼、醉酒、要钱等等各种事。这些事做了，又不能让自己赚到更多的钱，只是拿到自己本来就应该拿到钱。而在优质客户面前，这种事情是不会出现的。


    ## 第四，要习惯性的开除差劲的员工。


    你快乐不快乐，你能不能爱上你的工作，很大程度上，来自于你的合作者优秀不优秀。


    不怕猪一样的对手，就怕猪一样的队友。就算是你的脾气再好，你的员工水平太差，你也不会快乐，也不可能把工作做好。


    创业失败最重要的原因或者公司经营失败最重要的原因，就是老板优柔寡断，不能识别人才，花钱养了一帮素质不高的人，最后把钱用光了，企业倒闭了事。而且你培养差劲的员工，员工是不会感恩你的，照样说你坏话，照样搞公司的破坏。


    做企业，就是做买卖，要以买卖人的思想与任何员工交往。划得来就合作，划不来各走各的路。老板不要教员工感恩，因为员工是不会感恩的。讲规则，讲法律，与这个员工合作，不亏就行了。


    ## 第五，提升自己。


    如果你做到了既用自己的特长工作，又能把工作当娱乐，又扔掉了垃圾客户，找到了优质客户，又开除了差劲的员工，然后身边都是优秀的员工，这个时候，你唯一要干的，就是疯狂的提升自己的业务能力、管理水平、做人的修养。每天的任务就是把自己打造得比昨天更优秀，那么工作就会成为你的奴隶，你就是工作的主人了。


    ## 11、创业的五点心得


    创业的五点心得：


    第一，创业首先要相信自己能成功。


    你都不相信自己能成功，不相信自己的项目能做成。那么你工作起来就会很沮丧。你的团队伙伴也会感觉到你不相信自己能成功，故而他们也会很沮丧，导致工作效率降低，成功就更加渺茫了。


    第二，尽可能说服更多的人跟你干，人多，力量大，要学会做别人的思想工作。


    老板必须是思想的巨人，也必须是行动的巨人，还必须是一个导师，你必须指导大家如何做。企业招聘一个高人帮你搞定一切，帮你赚钱，这只能是做梦，只能用来吹牛，骗骗小白创业者。


    真正有经验的人都知道，若自己不是一个顶尖高手，别 的顶尖高手根本就不会加入自己的团队。如果你想靠顶尖高手，


    其实你这个企业风险就非常大。顶尖高手随时能把你的公司掏空，自立门户。做企业当老板没有捷径，只有一条道路。这是

    我十多年经验的总结，就是把自己彻底顶尖高手。


    ## 第三，各行各业都有各行各业的魅力，都有赚钱的机会，关键是你熟悉不熟悉。


    你干的行业，你是否把你这个行业干透彻了，干到极致了。

    不要以为别人的行业都很赚钱，就自己这个行业不赚钱。我相信每个行业都有亿万级的企业，既然已经开始了，就先把自己这个行业干到第一，再去做其他行业。


    创业，刚开始自己手上没有多少钱，也没有多少资源，切忌不专注，天天换项目。想法多的人反而不容易成功。要有一点阿甘精神，打渔、跑步也能成功。


    ## 第四，人生有顺利的时候，就一定有倒霉的时候，创业更是这样。


    没赚到钱的时候，我们就想一定可以赚到钱。没赚到钱的日子很快就会过去的，然后继续猛力营销，猛卖产品。赚到钱的时候，我们就要想我们一定会有倒霉的时候，必须要留一部分救命钱来度过难关，给员工发工资，养活团队。这一条我已经养成习惯了，我永远不会把自己用到借钱度日的境地，因为我账上永远都有备用的现金。


    ## 第五，创业者千万不要投入精力去搞研发，去做产品，先代理，先搞销售。


    华为这么强大，联想这么强大，都是代理起家的。刚开始创业你根本没有实力去搞研发，做产品，而且你没有商业经验与行业经验，你的研究往往都是自以为是。而通过营销去赚钱，去了解客户的需求，不仅仅能赚钱，而且能快速积累自己的行业经验。


    做生意，产品其实是最不重要的，好产品到处都是，能把产品卖出去的能力才是最重要的。


    ## 12、在错误中创造财富


    创业者的任务就是不断的犯错误，错误犯多了，就会自动而然的找到一条成功的道路。


    当你找到了这条能产生现金的道路，你就需要招聘员工来放大你的成果。这个时候，员工的任务就是避免犯错误。


    一个创业者，就是一个探路者，走错路是常事，但创业者不会因为会走错路就不去走。我们都是在恐惧中继续前进的人，

    '
  merge: 0
- raw:
  - '[PAGE 201]


    所以有很多创业者借钱，甚至卖房子来创业。


    没有人喜欢走错路，也没有人喜欢浪费钱，但创业的过程中，走错路与浪费钱是必然的过程。


    成功的创业者是在犯错中吸取教训的，使其为己所用，在错误中创造财富。成功的创业者是享受工作的过程的，把过程做好，自然就有结果了。而普通人，只想要结果，不喜欢艰苦的奋斗过程，所以永远也没有结果。


    每一个想成功的人，都应该把犯错误当成一个学习的过程，毫无必要沮丧与害怕，更不能因噎废食，犯了错，以后就循规蹈矩，怕探索了。


    # 13、只有摔跤，你才能学会走路


    珍惜时间，心地单纯的赚钱。大部分人不赚钱，就是心地不单纯，这也不相信，那也不信，不信就根本不会去尝试了。人的进步，就是愿意相信，愿意尝试，愿意实践。你只要愿意'
  - '[PAGE 202]


    实践，愿意尝试，你的世界就会变得非常大，你的见识就会迅速增加，你自然会找到赚钱的机会、赚钱的伙伴。


    赚钱，只需要找到一个项目、一个机会，几个愿意赚钱的朋友跟你合作罢了。但就是这一步，很多孕妇几十年都完不成。这些人就是心思不单纯，不愿意尝试，不愿意实践，什么都不相信。其实上当受骗不是什么坏事，很多事情，你必须付出代价。


    弯路是必须要走的。如果你拒绝走弯路，你就拒绝了美好的人生。一个创业者、一个企业家，是不应该害怕走弯路的。走弯路，我觉得是什么耻辱。我觉得这是成长过程中的必经之路。相反，那些一辈子都没有上当受骗的人，我觉得才是最耻辱，因为他们的人生一定过得不如意，很凄惨。他们没有什么见识，他们的收入也很低，为什么？因为他们不愿意付出成长过程中必经的代价。


    只有摔倒，你才能学会走路。只有走过弯路的人，才能学会创业，才能学会赚钱。所以老老实实的去尝试一些项目，老老实实的去尝试实践一些赚钱的手法。你必须非常单纯的相信我说的是对的，因为我也是这样走过来的。我创业的时候，也碰到了很多弯路，甚至上当受骗，但我愿意承担。我从一开始就明白，弯路必须走。我走过了很多弯路，收入也在不断的提升。'
  - '[PAGE 203]


    请珍惜自己的时间，赶快去走些弯路。请心地单纯一点，你必须去付出代价，然后你的人生就会收获到很多钱。当然，你尝试了一下，失败了，就放弃了，那么我就建议你别尝试了。你必须做到失败了过后，还要继续，直到成功，这或许就是马云讲的：永不放弃。


    # 14、循规蹈矩的人，一般都只能生活在社会底层


    很多人不成功，就是从来不愿意走弯枉路，也 vérité花弯枉钱，总想一次就做成，一次就做对，一次就做好。只要发现这个事情做不好，不靠谱，就不去做。这样的人是不可能成功的。


    小孩要学会走路，先要不怕摔跤。我们要学会创业，必然要经历创业失败。我们刚创业的时候，千方百计的拉一些人跟我一起干。有的人压根不来，因为他们觉得我不可能做起来。还有一些人来了，做了两个月，发现不靠谱，立刻就去打工了。有的人甚至很愤怒，因为他们觉得浪费了他们的钱。


    其实这些人很蠢，他们不知道，虽然我们花了钱，没有成功，但是我们学到了创业的经验，我们继续干下去，总会创业成'
  - '[PAGE 204]


    功的。


    **聪明人懂得任何事情都不是一帆风顺的，一定_prediction_要交学费的。**

    打麻将，你不可能刚上场就赢，你必须先给大家交学费。学费交多了，你才会越来越熟悉规则，越来越精明，这样，你再碰见水平一般的选手，你就可能赢钱。创业也是如此。


    **循规蹈矩的人，一般都只能生生活在社会底层。只有那些大胆的去尝试，就算知道会失败还是会去尝试，就算知道会上当依然去尝试的人，就知道钱会打水漂依然会花钱去搞的人，才可能成功。**就比如，我们刚开始养团队，花了200多万，养了一个团队两年。虽然没给我盈利，但是无所谓了，因为我学到了做团队的经验，如今，这个团队也在给我盈利了。我再做新的团队，就非常轻松了。因为我已经知道如何才能盈利了，这就是花冤枉钱的价值。


    **总结下来，要大胆的走弯枉路，花冤枉钱，因为很多事情你根本没有办法直接走对路，花对钱。弯枉路、弯枉钱是必须花的钱。假如你舍不得付出这个成本，你就不会走到对的路上，花对的钱。你也不可可能有什么成就。**'
  - '[PAGE 205]


    # 15、伟大的企业必须有一个伟大的老板


    想把公司做强大，首先你要看你自己是不是一个伟大的人，或者你现在不是一个伟大的人，你能不能把自己锤炼成一个伟大的人？如果你不知道如何把自己锤炼成一个伟大的人，我建议你多找一些伟大公司老板的传记看看，能吸收到点什么，就跟着去做。


    比如李嘉诚、比尔盖茨、巴菲特 王健林、马云的传记，任正非的讲话，我们都可以找来看一看，总能学到一些伟大的思想的，然后跟着执行。


    伟大的老板总是能找到几个特别能吃苦的人，跟着自己日日夜夜的奋斗。公司从来不是那些朝九晚五、做五休二的人，天天都要休假的人干起来的。公司是那几个特别能吃苦、把工作当生活的人干起来的。


    公司也不是那些看起来非常聪明的 人干起来的。

    我创业的时候，聪明的人都说我很偏激，聪明的人都说我'
  - '[PAGE 206]


    这个人吹牛、不现实，他们慢慢的都离开了我。谁在我跟我混？是那些离开了就不能找到好工作的菜蛋在跟我混。当初马云说阿里巴巴招聘的都是别的公司不要的人。我想创业的时候估计都是这样吧。


    总结下来，伟大的公司就是由伟大的老板带着一群特别能吃苦、把工作当生活的人于起来的。而且这群人还很窄，因为聪明人都不愿意跟着我们吃苦，他们可以去其他地方找到轻松的工作。


    创业从来不是轻松的事情，也只有我们这些笨人才能够干成。


    # 16、学会利用自己的时间去影响别人的时间


    管理好自己的时间，就是人生赢家。一个人的成功，就是能管理好自己的时间。人的一生，本来就是由时间组成的。你用你的时间在赚钱，你就有钱。你把你的时间用在事业上，你就有事业。所以我非常在意我的时间，我希望每一秒钟都有生产力。'
  - '[PAGE 207]


    能管理好自己每一秒钟的人，必然富贵，必然有钱，在这个社会上竞争，也不会感觉到有什么竞争压力。因为管理不好自己时间的人非常多。


    我觉得一个人最好的利用时间的方式，就是读书，然后进行脑力劳动赚钱。


    为什么选择脑力劳动赚钱？而不选择体力劳动？因为体力劳动实在是活动范围有限，影响的人有限，故而不可能赚到大钱。而脑力劳动影响的范围非常广阔，故而可以赚到很多钱。


    人赚钱，还要学会利用自己的时间去影响别人的时间。因为自己的时间也是有限的，你只有 24 小时。你必须利用别人的时间，大家的时间都在你的统筹之下，你才能赚到更多的钱。让我们每
    emphas 一分钟都有生产力，都在网络上释放价值，都在圈粉丝，都在卖货。你只要这样做，你的收入是不可可能太低的。


    愚昧的人就是对自己的时间流逝没有感觉，根本不知道时间是可以用来换成钱的。每一个穷人其实都非常富贵，因为他们拥有时间，只要你把你的时间花在营销上，花在卖货上，花在赚钱上，你就可能没有钱。


    我非常清楚对于刚创业的人最需要的是什么，就是一个能够指导自己，让自己少走弯路的人。我个人走了差不多 5 年的弯路，交了几十万的学费。如果当初我有个老师能够指导我，'
  - '[PAGE 208]


    我肯定混的比现在要好。时间就是金钱，相信这点大家理解的不比我差。


    # 17、老板的任务，就是升级自己的赚钱系统


    我最郁闷的，就是时间的流逝。我们的钱，是靠自己的时间换来的。假如我们不用时间去工作，我们就很难获得收入。于是，我们就想尽办法加快赚钱的速度，以便我们有更多的时间过自己想要的生活。


    一个人的 一生，全部献给工作，说实话，我心理有些不能接受。我还需要去阅读，我还是需要有自己的时间去拓展自己的视野，我还是需要到世界各地去走走。不是为了旅游，而是做为一个人，我来到了这个地球上，在我能看的时候，我希望我能用我的眼睛多看看这个世界。于是，我们需要打造自动赚钱机器，我们需要打造团队赚钱模式。我们需要加快速度赚钱、利用最先进的赚钱机器赚钱。


    人之所以是人，是因为人会使用工具。我们的赚钱工具，'
  - '[PAGE 209]


    就是先进的互联网、先进的管理理念、先进的思想。我一直觉得，是思想决定命运。有什么样的思想，就有什么样的人生。我非常清楚，只要一个人的思想变了，他的收入就会发生变化。所以，我从早到晚，都在琢磨如何让我的思想更加先进一点。


    人类社会的发展，就是先进的思想淘汰落后的思想。在经商、赚钱这个领域，应该也是如此。技术只是辅助先进思想的工具。先进的思想是道，技术是术。有了道，才能发展有用的术。


    要靠自己赚钱，如果自己不工作了，收入就低了。我觉得这样的人生是很悲哀的，这样的人会累死自己。所以，老板的任务，就是升级自己的赚钱系统，帮助合伙人，帮助同事打造赚钱机器，自己也建立一个自媒体赚钱机器。以后的岁月，所思考与<|message|>
    的，都是打造自动赚钱机器，培养合伙人、企业家。


    生命非常可贵，人生难得，做一回人不容易，好好利用自己的头脑，多赚些钱，多释放些价值，多帮助点人，温暖温暖各位奋斗在一线的企业家、老板。这件事，我会做一辈子。帮助别人，就是帮助自己。金钱交易的关系，是美好的关系。'
  - '[PAGE 210]


    # 18、做到这两点，就好像成为一个企业家


    做到这两点，就可以成为一个企业家。


    一、做一件事不感到厌倦，愿意永远做下去，不管遇到什么挫折都不断的干，会把一件事情干到透彻。把一件事情干透彻了，自然成为这个领域的专家，就靠这一件小事去赚钱。能赚钱，你就可以养活自己，赚的多了，还能养活两个员工，能养活两个员工，最多算是小老板，是成不了企业家的。


    那么如何才能成为一个企业家呢？就拿出来第二点。


    不厌其烦的去教导新人，让新人也会做这件事，并且能让新人超越自己。


    所有的企业家本质上都是教育家，都是引路人。假如你只是自己会，不愿意教别人，也懒得教别人，你就只能做个小老板。假如你不断的教人，教了很多人和着自己混，永不厌烦的教，总是有会学会出来，并且跟着你做事，这样你就可以做强做大。'
  - '[PAGE 211]


    很多人就是这一步跨不过去。他们刚开始兴致勃勃的教育人，发现这些人不愿意跟自己混，就不再教育，或者是教育了几个人，这几个人离开了自己，就心灰意冷，不愿意再教育人，觉得到不了来，这就很可惜。


    如果你一辈子能做好第一点，就是做一件事情不厌倦，精益求精的干成专家，干透彻，你就能财富自由。

    如果能同时做到第二点，不断的教新人和你做这件事，分钱给这些新人，永不厌烦的去教，那么你就能成为一个企业家。企业家当然是财富自由的，所以不必担心成了企业家还没有钱的情况，而且也只有你做到了第二点，你才会有很多被动收入。


    # 19、布施、忍辱、精进对老板的启示


    拥有布施的精神。不失自己的面子、自己的时间、自己的精力，如老板带着团队一起扫地，那么员工自然团结，自然卖力，自然就会维护办公室的卫生环境。


    忍辱，也就是我们受到了委屈。如果员工在外面拜访顾客'
  - '[PAGE 212]


    受到了不公正的待遇，客户骂员工了，员工跑过来告诉老板，老板就开始骂顾客，这其实就是不能忍辱的表现。最好的做法是说我们要挣钱就得受顾客的气，然后下次再带着员工去拜访顾客。顾客骂你，你也不动声色，尽量争取做成生意，赚到钱。


    这种忍辱功夫会培养你的员工的修养。当老板做好忍辱的表率，员工自然就有样学样，业务自然就做好了。


    # 小老板遇到不公平的事就会暴跳如雷。大老板是碰到大事，也能风轻云淡，这就是忍辱功夫。


    精进，就是每天要持续不断的练习。不管是我们写字，还是讲课，还是读书，还是思考公司的业务，每一天都不能停下来。多写，才能写下生花。三天不练，手就生。


    # 拳不离手，曲不离口，就是说想要工作好，就得天天练。


    我天天早上5点起床，7点到公司，晚上10点以后才回去。我没给公司的人规定上下班时间，我们公司的人自然是比其他公司的人来得早，走得晚。


    我每天都做总结，每个团队成员都知道这件事，他们也就有样学样了。


    # 不过精进有一个重点，就是不能过分。比如，有人写总结，他一天写了七、八篇，接下来就是7天都写不了一篇，这种情况要避免。我们要天天写，但只写几个关键点，重要的是持续'
  - '[PAGE 213]


    去做，这才是精进的核心思想。


    # 20、钱只是正道的附加产品而已


    我们在刚创业的时候，追求的是金钱。有了钱了，过好日子，吃好饭，有点社会地位，带点团队，做个企业，有点权力，感觉很好，这就是谋食的阶段。


    为什么很多人的企业做不大？还有就是做大了没有动力了，容易倦怠，就会出大问题，然后倒闭了事。倒闭倒还好，有的甚至会给自己惹一身麻烦。这一切就是因为企业主该获得的都获得了，又没有新的目标导致的有钱了，有地位了，该享受的都享受了，人还没死，活得就特别无聊。所以，真正想成为一个企业家，就不能只知道挣钱，要给自己找一个道。


    这个道，就是你要成为一个什么样的人，不断修炼自己的人格。要为社会解决一个什么样的的问题，为社会做出什么样的贡献。终其一生，要为社会把这个问题解决到极致，永无止境的追求。'
  - '[PAGE 214]


    比如，马云的志向，要让天下没有难做的生意。这就是追求道，追求解决社会问题，追求为社会做贡献。比如，你要给某些企业家做一个榜样，要成为一个君子，这就是谋道了。


    人一但开始谋道，就只有日日精进，永远也有事做，永远也觉得自己做的不够好。比如，日本人、德国人的工匠精神，其实就是谋道。把一件小事做到极致，追求的是100%完美，而这100%是不可能达到的，所以，每天都充满了激情干活，最终，干出来的产品越来越完美。


    凡是最伟大的企业家都是谋道的。如果仅仅是追求权力，追求吃得好，有钱花，这个动力是有限的。只有谋道的人，才能持续不断的奋斗，这样的人是有梦想的人。


    所以，各位企业家，给自己找一个道，给自己找一个梦想，不断的追求正道，那么企业自然会越做越好，钱自然越赚越多，因为钱只是正道的附加产品而已。只要你愿意为社会解决问题，把问题解决得越来越完美，钱自然会跑到你的口袋里。这就是道。'
