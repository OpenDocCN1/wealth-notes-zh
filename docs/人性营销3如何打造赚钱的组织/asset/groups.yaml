    多赚钱，才是正事，其他的都是邪事。现在就是抓直播、视频风口，不断的讲课，不断的营销。


    以诚待人，才会获得美好的未来。做事要实在、踏实，落到实处。对别人，对大家是真正的好，真正的有用。真正的有用，大家就会跟随，大家能获利，组织就会更强大。当然，在这个过程中，不要培养一些别有用心的人。


    想办法让团队赚钱，让所有跟著你的人都能赚钱。要打造的是经济模式，所有接触到你的人，都有利益，则你的粉丝群体才会越来越大，利淘才会越来越好。组织营销者的工作，每一个文字、问答、书籍、社群、课程，都是为跟著自己的人服务，让大家有利润，帮助大家做营销的。


    要想尽办法带给合作者利益，要做好战略、战术的指挥，必须让跟著你的每个人每天都有钱赚，发财。要引导大家走在正路上，而且，要让大家爆赚。这样，领导者、企业主、老板本人，才会活下去。不能贪婪合作者的利益，否则，他们没利益了，也就没人跟你合作了。


    任何一个组织、任何一个动作，都必须是商业循环。只有'
