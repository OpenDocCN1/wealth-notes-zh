    对这个现象的解释其实很简单，整天跟你混在一起的人，干着跟你相似的事，甚至想办法和你分外接近，你不知道的机会和信息，他们同样也不晓得。而此时只有弱关系才有可能告诉你一些你不知道的事。


    弱关系的真正意义是把不同社交圈子连接起来，从圈外给你提供有用的信息。根据弱关系理论，一个人在社会上获得机会的多少，与他的社交网络结构很有关系。而此时人脉的关键不在于你融入了哪个圈子，而在于你能接触多少圈外的人。换句话说，弱关系理论的本质不是人脉，而是信息的传递。


    亲朋好友很愿意跟我们交流，但是话说多了就不再有新意。最有效的交流，也许是跟不太熟悉的对象进行的。


    如今，弱关系理论已经被推广到了任何新消息或者新想法中，不管你是仅想坐学东西、找工作、找对象，还是创业，你都应该避免成熟圈子中的强关系，而更多地走出去去追求弱关系。比如去健身房，去咖啡馆，去什么协会。


    已经有统计表明，来自弱关系信息的影响力远远超过强关系。也就是说，尽管人们重视强关系，但人们的大部分知识还是来自于弱关系。从弱关系那里获得想法，乃至于与弱关系合伙创业，都更有利于提高一个公司的创新能力。而从社交网络来看，你的社交网络越多样化，你的创新能力也就越强。


    那些拥有高度多样化社交网络的企业家，他们既有强关系也有弱关系，还接受从未打过交道的人的意见，其创新能力是那些只有单一社交网络的人的 3 倍。


    各位老板也可以开始建立自己复杂的社交圈。人们很难拒绝强关系的诱惑，这就是路径依赖。比如在我们心目中，风险投资这个行业的人应该是比较理性的，或者至少应该是比较冷酷无情的，然而越是精明如这帮人，也同样会犯追求强关系的错误，同样的会为这个错误付出相当痴痛的代价。


    其实创业最佳的合伙人，最好是一个不曾跟你进过同一所大学，从未跟你供职过同一家公司，与你不是一种种族的高学历者。


    弱关系总是那么不安全，但是请记住，有风险才有机会，因为人都需要安全感，所有人都喜欢强关系，我们愿意跟他们在一起混，愿意给他们打电话，愿意转发他们的微博。然而熟归熟，工作归工作，当我们考虑找人创业、找人合作，哪个是找人了解什么信息的时候，请记住弱关系才是最佳选择。


    ## 11、修炼自己人际关系的基本功


    修炼自己人际关系的基本功。

    第一，不要批评、责怪或抱怨他人。


    第二，真诚地赞赏他人。


    做得好，我就表扬。能讲别人好话是一件了不起的事情。

    经常讲别人好话，别人才愿意跟你相处，你让他配合你工作，他就非常乐意。


    第三，想到他人的需求，并告诉他如何实现，别人才会非常感激你。


    第四，保持良好的工作习惯、生活习惯，保护好精气神。


    该睡觉就睡觉，该吃饭就吃饭。创业的时候，也不用非常急追，发扬日拱一卒的精神，看似走得慢，实际上走得最快。


    第五，有人黑你、骂你，有人让你不爽，千万别报复他，


    因为我们的时间最宝贵。


    我们要把我们的时间放在最有生产力的地方，我们要赚钱，要解决更多值得解决的问题，帮助更多值得我们帮助的人。我们没有精力，没有时间去跟那些无聊的人对骂。如果我们选择报复他们，其实我们是在浪费我们的生命，我们的损失将会进一步扩大。


    ## 第六，享受付出的快乐，不要期望他人感恩。


    我们付出是我们自己的事情，他们感恩是他们的事情，他们不感恩也是他们的事情，我们无权、也无理由干涉。


    ## 第七，对得到的帮助心存感激，必定回报别人。


    为什么？因为只有这样，才会有更多的人帮你，不然，别 人骂你是白眼狼，那么你的恶名远扬，以后就没有人帮你了。


    ## 第八，假如你的起点非常低，不要抱怨。


    因为抱怨除了浪费时间以外，还会给你产生负能量。不如把困难当成挑战，想办法克服。


    ## 第九，不要认为别人错了，永远都认为是自己错了。


    我们能改变的只有自己，我们想要改变世界，首先要改变自己。赚不到钱，就是自己没本事，不怪经济危机，也不怪社会不好混。一个习惯性优化自己的人，必定会成长为一个事业成功的人。一个老是认为别人错了的人，终身只能一事无成。


    ## 第十，不要背后议论他人是非。


    时间久了，别人才给你定了标签，会认为你是一个靠不住的人，爱搬弄是非。


    ## 第十一，做人要正念、利他、诚信、有责任、有担当。


    千万不要透支自己的信用，这可能是你翻身的机会。只有人品好，机会才会多。把为他人提供价值刻入我们每一个成员的骨髓里，100% 利他，100% 输出价值，100%
    正念。


    ## 第九章

    我打造赚钱社群的经验


    > 任何一个组织、任何一个动作，都必须是商业循环。只有商业循环给大家带来利润，你的利润才会越来越高。

    ——陈昌文


    ## 1、带着大家赚钱，要有道德，有人格魅力


    企业家关心的是组织的问题，是用人的问题，是策略、思维的问题，是项目、方法的问题，是选择的问题，是因队的问题，是矩阵的问题，是集团化的问题，是同盟的问题。


    企业家的思维、思想不行，则什么都不行，企业家是靠思想、智慧、思维活着的。


    企业家要不断的培养德才兼备的人才，找到德才兼备的人才，吸引德才兼备的人才。不要战争，要和平，要发展经济。


    组织人才，组织忠诚可靠的人才，才是关键。人才多了，组织才能强大。内部具有关键人才，是重中之重。打造组织，打磨人才体系，才是关键所在。


    我的主要任务，就是培养更多的讲师讲课、讲直播、视频。我们所有人的任务，都是培养更多的人讲课、讲直播、视频。这就是这个时代的时运，谁做好这个，谁就更有前途。这是一个直播、短视频时代，讲师注定有饭吃。


    你必须为你的合伙人、你的员工、你的朋友、你的代理商提供价值。我要提供的就是文案、思想、团队、管理、哲学，做好自己，做好榜样，帮助大家，才能成长。


    管理好自己，让自己处于绝对优秀状态，企业、团队才会优秀。尊重规律，不断的成长。


    极度认真，讲真话、实话，不断的帮助粉丝成长。对于自己，对于团队，对于股东、合伙人，都要认真老实，不要说假话。说假话，最终会坑害自己。一切都要实事求是，少说话，只谈工作，谈业务，谈赚钱，谈项目，这个做好才有未来。骗人最终会坑自己。


    人与人的核心差距，就是价值观问题。好的价值观、思想，引领一个人越来越好。用最好的价值观武装自己。


    很多人都想赚钱，他不知道会做人，会做事，会卖产品，就能赚钱。而不会做人，不会做事，不会做产品，什么都搞不好。只想要钱，钱就不会来。核心就是价值观问题。


    三大管理哲学思想价值观、营销的方法，加上团队，会做人，会带领导，才会获取极大的利益。不会做人的人，都会倒霉。要做发自内心让别人尊重的事情，而不是换成钱。我要做的是发自内心的让人尊重我，我要做的是这件事情，我要力求做到这一点。微视频、直播，我们都要力求做到这一点。


    做企业，做组织，做传播，要做到天赋的本能都是正常的。摄影师、直播、短视频、组织，都是为榜样而服务的。为榜样而服务，然后引导粉丝跟着榜样学习。一等人的忠臣孝子，两件事读书耕田。


    要专注于道德修养的提升，技能的提升，写作、讲课技能的提升，读书技能的提升，听课技能的提升，这几个方面都提升了，你就会跟人合作好。运气来了，遇到贵人，你也就飞黄腾达了。当然，你自己就是自己的贵人，先把自己的头脑、手脚用好吧。


    我们要修炼的，永远是真，永远是道德问题、人品问题、人格魅力问题，然后是方法的问题。跟随者一定要赚钱的，但是道德又很重要。混到高阶层，缙道德、准规则、人品、规矩；低阶层，有方法就行了。


    带着大家赚钱，要有道德，有人格魅力，有极大的价值输出，解决更多人的就业问题，这就对了。


    ## 2、我把一切当成游戏，

    团结一切可以团结的力量


    创业公司，必须有人在公司里一直奋斗，一直为目的不断的奋斗，否则，这个公司很难做起来。所以，要打造一个一直奋斗的团队，永远在奋斗的团队。有几个带头人，不断的奋斗，才能让这个企业做起来，否则，是做不起来的。有内容，有产品，有营销推广，一直在干活，才能做起来，所以，我们必须调整输出的强度，要人一直干活。


    我带团队，就是要超高强度的进展。你跟不上我的节奏，或者跟我半年支持不下去了，你自然就被淘汰了，就走了。留下来，都是跟我一样，能够高强度、高持续性、业绩爆表的超级战士与将军。我只需要工作狂，只需要有事业心的人燃烧自己的生命，不断的为社会创造价值的人。只问耕耘，不问收获，自然富甲天下。


    所有的创业者都是一直在工作的人，哪里有休息时间？除了吃饱、睡觉、运动下，就是工作。打工的人才休息呢。牛人与牛人在一起，废物与废物在一起。要想与牛人在一起，就拼命的变成牛人。人生就是无止境的奔跑，落到后面的就被熊吃了。


    人在年轻的时候，精力旺盛，要努力奋斗，不要等到年纪大了，精力不够，执行力衰退了，才想着奋斗，这就愚蠢了。世界是年轻人的，要多团结年轻人，不断的发展、团结年轻人，我们才能拥有未来，因为年轻人，就是未来本身。


    当今互联网时代，是个游戏时代，玩视频、直播、社群、互联网、app 的本质都是在玩游戏。一个是经营游戏，一个是企业游戏，文字、语音、视频、直播游戏。谁对这个游戏玩的好，谁就能更能获得财富。


    抓主要矛盾，现在是直播时代，直播流量大，我们一定要做直播，而且必须做好。做好一件事，一件极小的事情，就是直播，做到炉火纯青，一天收入就较为可观。


    我呢，玩了许多年传奇、魔兽世界，我就是专门玩游戏的，我把一切当成游戏，团结一切可以团结的力量，打赢这场社群营销游戏、教育平台游戏、app 游戏。


    抓住主要矛盾，一定是在主要矛盾上下大功夫，精力、资源、人员。鼓励大家一直攻克主要矛盾，这样就能纲举目张。我本人要一直学习，日日不断的进步，给大家讲好陈昌文读书会的课程，给大家提供最有价值的东西，让大家发展，让大家赚钱。

