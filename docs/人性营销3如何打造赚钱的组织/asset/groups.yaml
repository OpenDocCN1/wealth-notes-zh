    有耐心，诡人不倦。员工不懂的，一次又一次的教。没耐心的人，做不好任何一件事情。当老板显然是一件非常难的事情，是更需要耐心的一件事。而我在现实生活中看到很多初级老板都很暴躁，暴躁的人只能赚小钱，聚集一些二流、三流的人才。


