    企业家要不断的培养德才兼备的人才，找到德才兼备的人才，吸引德才兼备的人才。不要战争，要和平，要发展经济。


    组织人才，组织忠诚可靠的人才，才是关键。人才多了，组织才能强大。内部具有关键人才，是重中之重。打造组织，打磨人才体系，才是关键所在。


    我的主要任务，就是培养更多的讲师讲课、讲直播、视频。我们所有人的任务，都是培养更多的人讲课、讲直播、视频。这就是这个时代的时运，谁做好这个，谁就更有前途。这是一个直播、短视频时代，讲师注定有饭吃。


    你必须为你的合伙人、你的员工、你的朋友、你的代理商提供价值。我要提供的就是文案、思想、团队、管理、哲学，做好自己，做好榜样，帮助大家，才能成长。


    管理好自己，让自己处于绝对优秀状态，企业、团队才会优秀。尊重规律，不断的成长。


    极度认真，讲真话、实话，不断的帮助粉丝成长。对于自己，对于团队，对于股东、合伙人，都要认真老实，不要说假话。说假话，最终会坑害自己。一切都要实事求是，少说话，只谈工作，谈业务，谈赚钱，谈项目，这个做好才有未来。骗人最终会坑自己。


    人与人的核心差距，就是价值观问题。好的价值观、思想，引领一个人越来越好。用最好的价值观武装自己。


    很多人都想赚钱，他不知道会做人，会做事，会卖产品，就能赚钱。而不会做人，不会做事，不会做产品，什么都搞不好。只想要钱，钱就不会来。核心就是价值观问题。


    三大管理哲学思想价值观、营销的方法，加上团队，会做人，会带领导，才会获取极大的利益。不会做人的人，都会倒霉。要做发自内心让别人尊重的事情，而不是换成钱。我要做的是发自内心的让人尊重我，我要做的是这件事情，我要力求做到这一点。微视频、直播，我们都要力求做到这一点。


    做企业，做组织，做传播，要做到天赋的本能都是正常的。摄影师、直播、短视频、组织，都是为榜样而服务的。为榜样而服务，然后引导粉丝跟着榜样学习。一等人的忠臣孝子，两件事读书耕田。


    要专注于道德修养的提升，技能的提升，写作、讲课技能的提升，读书技能的提升，听课技能的提升，这几个方面都提升了，你就会跟人合作好。运气来了，遇到贵人，你也就飞黄腾达了。当然，你自己就是自己的贵人，先把自己的头脑、手脚用好吧。


    我们要修炼的，永远是真，永远是道德问题、人品问题、人格魅力问题，然后是方法的问题。跟随者一定要赚钱的，但是道德又很重要。混到高阶层，缙道德、准规则、人品、规矩；低阶层，有方法就行了。


    带着大家赚钱，要有道德，有人格魅力，有极大的价值输出，解决更多人的就业问题，这就对了。


    ## 2、我把一切当成游戏，

    团结一切可以团结的力量


    创业公司，必须有人在公司里一直奋斗，一直为目的不断的奋斗，否则，这个公司很难做起来。所以，要打造一个一直奋斗的团队，永远在奋斗的团队。有几个带头人，不断的奋斗，才能让这个企业做起来，否则，是做不起来的。有内容，有产品，有营销推广，一直在干活，才能做起来，所以，我们必须调整输出的强度，要人一直干活。


    我带团队，就是要超高强度的进展。你跟不上我的节奏，或者跟我半年支持不下去了，你自然就被淘汰了，就走了。留下来，都是跟我一样，能够高强度、高持续性、业绩爆表的超级战士与将军。我只需要工作狂，只需要有事业心的人燃烧自己的生命，不断的为社会创造价值的人。只问耕耘，不问收获，自然富甲天下。


    所有的创业者都是一直在工作的人，哪里有休息时间？除了吃饱、睡觉、运动下，就是工作。打工的人才休息呢。牛人与牛人在一起，废物与废物在一起。要想与牛人在一起，就拼命的变成牛人。人生就是无止境的奔跑，落到后面的就被熊吃了。


    人在年轻的时候，精力旺盛，要努力奋斗，不要等到年纪大了，精力不够，执行力衰退了，才想着奋斗，这就愚蠢了。世界是年轻人的，要多团结年轻人，不断的发展、团结年轻人，我们才能拥有未来，因为年轻人，就是未来本身。


    当今互联网时代，是个游戏时代，玩视频、直播、社群、互联网、app 的本质都是在玩游戏。一个是经营游戏，一个是企业游戏，文字、语音、视频、直播游戏。谁对这个游戏玩的好，谁就能更能获得财富。


    抓主要矛盾，现在是直播时代，直播流量大，我们一定要做直播，而且必须做好。做好一件事，一件极小的事情，就是直播，做到炉火纯青，一天收入就较为可观。


    我呢，玩了许多年传奇、魔兽世界，我就是专门玩游戏的，我把一切当成游戏，团结一切可以团结的力量，打赢这场社群营销游戏、教育平台游戏、app 游戏。


    抓住主要矛盾，一定是在主要矛盾上下大功夫，精力、资源、人员。鼓励大家一直攻克主要矛盾，这样就能纲举目张。我本人要一直学习，日日不断的进步，给大家讲好陈昌文读书会的课程，给大家提供最有价值的东西，让大家发展，让大家赚钱。

    当然，一直要强调道德素质，一直要强调法律意识。


    不要对世界不满，你只能服从这个世界，并且利用游戏规则玩得好。我要做的是设计游戏规则，按照规则玩。一切是规则的事情，不是人的事情。设定好规则，这个事情才能玩好，规则不对，一切都是错误的。


    ## 3、我们的每一步都是设定一个游戏规则，

    帮助大家赚钱的


    企业家，要为整个团队承担成本，还要为团队做品牌荣誉。

    企业家的目的是帮大家赚到钱，帮大家降低营销成本，让大家快速赚到钱，还要把大量现金分给大家。做大哥的人，总是要让跟随者富裕，否则，别人就不认你这个大哥。当然，想要做好大哥，后面的人也必须非常厉害。这其实就是企业家思维。


    如果你能帮助大家赚钱，而且想方设法的帮助大家赚钱、分钱，则你的事业、组织就会越来越好。如果不是帮助大家赚钱的，则你赚钱的速度就降低了。总之，我们的每一步都是设定一个游戏规则，帮助大家赚钱的。


    多赚钱，才是正事，其他的都是邪事。现在就是抓直播、视频风口，不断的讲课，不断的营销。


    以诚待人，才会获得美好的未来。做事要实在、踏实，落到实处。对别人，对大家是真正的好，真正的有用。真正的有用，大家就会跟随，大家能获利，组织就会更强大。当然，在这个过程中，不要培养一些别有用心的人。


    想办法让团队赚钱，让所有跟著你的人都能赚钱。要打造的是经济模式，所有接触到你的人，都有利益，则你的粉丝群体才会越来越大，利淘才会越来越好。组织营销者的工作，每一个文字、问答、书籍、社群、课程，都是为跟著自己的人服务，让大家有利润，帮助大家做营销的。


    要想尽办法带给合作者利益，要做好战略、战术的指挥，必须让跟著你的每个人每天都有钱赚，发财。要引导大家走在正路上，而且，要让大家爆赚。这样，领导者、企业主、老板本人，才会活下去。不能贪婪合作者的利益，否则，他们没利益了，也就没人跟你合作了。


    任何一个组织、任何一个动作，都必须是商业循环。只有商业循环给大家带去利益，你的利润才会越来越高。团队、组织、人心、经济模型，让大家赚钱的策略、营销策略，才是赚钱的根本。产品
    + 团队 + 策略，组织人的能力、沟通能力、人才孵化能力才是组织发展的关键，是社群发展的关键。


    专心致志的做自己的业务、自己的工作，把自己的工作做透彻，做到极致；深挖自己的战略、组织、营销逻辑、方法；做好自己的产品，不断的打磨，锁定人群，做这些工作，业务的利润就会越来越好。


    ## 4、带着更多的人做这件事，

    就可以形成一个商业帝国，这是道


    人要特别聚焦，只做一个点、一件事情、一个项目、一个环节，一辈子做一个好项目，然后其他的事情全部外包，这样才能提升利润。


    史玉柱写的《我的营销心得》，只做一个产品，所有的物力、财力，都投入到一个点，所有的团队也投入到这一个点，我们就容易成功。还有就是追求真理的态度、实践的态度，而不是被教科书牵引着走。我想这是做营销、做老板的态度。


    我们所有的精力只聚焦到一个点上，我们才能成功，否则，我们不会成功。只做一件事、一个点、一个产品。公司、团队、人力、物力、财力，只为打造一个产品，这个项目就能做到极致，我们就能生存。所以，我做陈昌文读书社群、陈昌文老板社群，我们所有的点只打陈昌文读书记社群这一点，大家在里面选一个精品，做好一个精品就行了。这样，利润就起来了。


    要彻底聚焦一个项目，只在一个项目上深挖，我们只深挖陈昌文读书社群，其它的不齐。做好这个点，一切都会来；做不好这个点，什么都没有。任何人，只要一个点成功就行了，一辈子聚焦一个点，做透彻就行了。做那么多干啥？别想到其他地方发财，就在一个点上不断的深挖。


    只关心自己的项目，自己能赚多少钱，自己的视频、直播，自己的讲课内容,照本宣科的内容,把炒冷饭做好,讲好3个理论、5大原则,利润就非常高了。彻底聚焦自己的项目,其它什么事情都不做,不要动作。


    固定在一个点上，不断的打，就会有巨大的收益。只做一个项目、一个品牌、一个业务，然后在这个业务上不断的延伸、深挖，就带来巨大的财富。主要是交流、接触更厉害的人，才能产生更大的收益。


    真正的赚钱模式，就是聚焦，就是近悦远来，就是精神内守，病安从来：就是做好自己的工作，自己的工作做不好，一切白搞。在自己本来就有项目很赚钱的情况下，就要深挖，就要不断的巩固，保守就行。别贪多，在自己已经经出水的地方，不断的扩大战果。


    我的业务运行的非常好，陈昌文读书书群也运行的非常好，陈昌文老板社群也运营的非常好。


    由于我自己的业务运营的非常好，我的书籍又有系助力，故而，我对其他人的业务毫无兴趣，我也不愿意跟谁合作。近悦远来，精神内守，病安从来。我自己的事情做到极致了，我们就拥有了一切。


    要一直做一件事情，做好一件事情，一直在这个路上走。比如做社群营销、品牌营销、企业管理、传播营销、写作、写书、做读书书群、做陈昌文老板社群，就要一直做，做一辈子。


    一件事情，只要你能做一辈子，不断的做，就会越来越好。怕的就是你在做的过程中，不断的换项目，换赛道。做好一件事情，做精做透彻，带着更多的人做这件事情，就可以形成一个商业帝国，这是道。


    ## 5、老板，必须杀伐果断


    人生，就是你选择跟什么样的人在一起，不对的人一定要干掉。老板就是要做“恶人”，团队里能干力不行、人品不行的人，必须干掉。选拔优秀的人才在优秀的岗位上。


    老板不做“恶人”，团队里都是乌烟瘴气的人，团队、组织就没有发展。让这些没能力、没本事、人品不好、人品不够的人在社群里，道德素质不行的人在社群里，能力不行的人在社群里，本质上是坑害所有人。


    所以，老板必须做“恶人”，必须尊重规则，杀伐果断，否则是害人害己。特别是有影响力大了，组织大了，就是对组织、对所有人不负责任了。

    老板必须做“恶人”，必须杀伐果断。


    我一定要做一个“恶人”，我不做善人，对于组织来讲，对于社群来讲，需要的是我做“恶人”。“恶人”，才能让组织正常、良性发展。不对的人，统统搞下去。不给任何人面子，只要正确的人放在社群内部讲课，内部对所有成员的影响最大。


    社群内部讲师，必须优秀，不优秀的必须下去。社群不培养新的、没能力的讲师，只要真正优秀的人在内部讲课。如果你不重视你的讲课，则我们不给你机会，会让你下去。


    有些讲师讲话，价值传递较少，不适合在读书社群做讲师，人太多了。所以老师，在内部讲课，以价值释放为主，然后讲师群做潜客营销就行了。成功学、煽动性质的，本质是自己没有货，激
    you 别人付费，以利诱之是自己水平太差导致的。


    陈昌文读书社群、陈昌文老板社群的所有讲师，必须领悟我说的话，价值释放，也就是开口就是根据书本的价值释放，而不是没有货，没有水平，只会以利诱之。一点不求进步的讲师，不允许在内部讲课。


    企业家必须有决策力、判断力，当组织大了，集团大了，人数多了，我们的策略必须对，我们的判断力必须对，而且我们必须按照正确的方向执行。否则，会给组织、很多人，带去非常大的损失。也就是企业家到了一定的时候，要超级理智，有执行力，有决策力、判断力，否则，跟著你的人，就会受苦了。


    企业家必须有对人的准确判断力,知道重用谁,谁不能重用。


    企业家必须有强大的决策能力、决断能力，什么事情应该做，如何做，而不是被智力低下的人，或者无知的人裹挟。有些人可以让一步，因为这个点，别人耶那么做，也不损害您，但是，对于动摇根本利益的点，我们必须这样做，就必须这样做，绝对不让步。


    企业家要具有百分之百理智的能力，感情是私底下的。百分百的具有判断力，百分百的具有决断力，必须按照规律来执行。不可被感情吞噬，被儒弱吞噬，完全按照良知良能、规律办事。要讲的话，要做的事情，必须做，而且，必须做到位。做不到位，不参与。


    人一定要按照规律办事，而不用情感统治自己的内心世界。


    作为一个普通人，这样只能伤害自己，损失可谓大，也可可以说不大。但是，做为一个企业家，如果我们的理智不能战胜情感，我们会做出非常多错误的决定，最终，对组织、企业、团队、前途都会造成巨大的损失。企业家，应该是一个智者，也是极度具有慧根的人，具有强大的决策能力、决断能力与走真正正确道路的能力。


    ## 6、我们社群已经是一个强大的学习型组织


    我们的陈昌文读书社群和老板社群是学习型组织。我们在一起，就是为了不断的学习，不断的进步。我们这个圈子里，加进来，就是做好一辈子学习的准备。学习就是生产力，只有不断的学习，才能提高社会地位，提高自己的收入。


    我们社群就是疯狂的学习，学习，还是学习，不断的学习。学习变现，学习流量运作方式。学习，维度不一样，收入不一样。学习、见识，决定一个人的未来。朋友、组织、团队、思想、思维模式、经济模型，这些决定着一个人的未来。


    团队、组织、策略，带着每一个人赚钱。

    学企企业家思维、爆品思维，死磕内容，才会有未来。没有内容，就没有未来。书籍、文学性要好，才有未来。文字、视频、直播，都是内容，而我们的书籍就是内容，所以我们必须死磕书籍的内容。

    书籍内容不好，就没有未来。反复讲书籍，讲透彻。


    能赚钱了，还要不断地学习更多赚钱的经验、知识，进一步提升自己的赚钱能力。有本事了，学到位了，就要应用，带着大家一起发财。占着位置，不努力学习，实际上是对不起组织。学习有成效，不拿出来应用，学那么多干啥？你要把你的能力、经验奉献给组织，你的人生才更有意义。


    要理解团队的力量，唯独只有团队厉害，我们才厉害，要让团队成员都变得非常厉害，这样，社群才能真正的发展。


