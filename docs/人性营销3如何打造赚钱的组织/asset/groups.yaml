    \ 陈昌文：\n\n流量大，但是成本高，耗时耗力。可以植入广告，植入品牌，也行。\n\n## 42、带行的人，不带不行的人\n\n### 学员：\n\n老师！我觉得一个人的念头非常的重要，念头是好的，所有都会越来越好，做直播、拍视频什么的都会越来越好。有一些人，还没开始就在念头上过不行、那不可以，然后就越来越差，越来越不行。说了他们也不懂。\n\
    \n### 陈昌文：\n\n带行的人，不带不行的人。宇宙百态，什么都有。念头不行的人，就要隔离。这些人永远存在于宇宙中，只是我们不召唤这些人。\n\n付费的人，我们尽可能正面引导。没付费的人，就隔离掉。我们营销的对象越来越高端，有能力，脑袋清晰，道德素质高。人的差距，往往是道德素质差\
    \ + 能力差。\n\n尽可能成本就来懂的人进来。这世界上有些人就是较差，他们就是不懂，所以，我们要收的是道德素质高、能力强，还有慧根的。不要以为收钱就爽，人收多了，有一天会被反噬。反噬的力量会非常大，所以，要提高个人标准，要过滤好人。\n\
    \n低级角色理解不了牛人的价值，理解不了思维的价值，理解不了富人的价值，所以营销他们，跟他们链接，没有意义。只能跟高人、牛人在一起。低级角色没有任何价值，不接触，社群只接触高级人。我们的力量、我们的精力、我们的链接，只链接高级人。外围低级角色，可以无偿免费学习，不链接，不发生付费关系，避免给我们找麻烦。只跟牛人交往，只跟牛人接触，定下这一条。\n\
    \n## 43、高手是比谁赚钱快\n\n### 学员：\n\n非常感谢陈老师，感恩遇见，很自己没有早些遇见陈老师这样有大爱大德的人，我会加倍努力学习这些书。\n\
    \n### 陈昌文：\n\n不是学习，而是做视频、直播、赚钱，向那些年人几千万的人学习、实践，而不是学习。高手是比谁赚钱快。\n\n## 44、社群的一切根基，都是书籍里的内容\n\
    \n### 学员：\n\n从日常行用做起，早睡早起，锻炼身体，长久的做一份工作，你就会获得复利效应。\n\n你做不到爱自己，善待自己，就别说孝顺父母，爱他人。\n\
    有三大管理哲学思想，有陈昌文方法，有道有术，再不成功，就是你控制自己有问题了！\n聚焦，坚持，做减法，只做一个项目。\n\n——摘自《陈昌文 72 大营销系统》第\
    \ 12 页。\n\n### 陈昌文：\n\n社群的一切根基，都是书籍里的内容，也就是我们做视频，做直播，就是搬运书里的内容掏成交易就行了。用这个模式，大家的内容问题解决了，大家的直播话题问题解决了。\n\
    \n《陈昌文方法72大营销系统》就是话题。社群以书籍为纲领，不断的打造我们的影响力。我们是有具体理论、具体系统化思想的，并非零散片段。\n\n## 45、我的这些书籍，都是我的实战干货\n\
    \n### 学员：\n\n> “我相信很多人都对国学非常感兴趣，也知道国学能解决我们生活、工作诸多问题，但由于经典生涩难懂，多数人也无法准确解读，因而敬而远之。”\n\
    \n就是这样的，在遇到陈昌文老师之前，做了6年互联网生意。在拿到这本《陈昌文解读〈论语〉》的时候，我看了十几页后，完全打破了我怕自己看不懂的顾虑。\n\n\
    不但无枯燥之感，反而让人觉得轻松愉快，甜味淋漓。\n\n陈昌文先生以切身体验，深刻理解儒家“仁”的精髓，和在工作、生活各方面的应用价值。\n\n我感觉我所有的经历都是为了让我遇到它，我所有思想中的有和无都被陈昌文老师讲出来了，说出来了。我想这也是为什么最近在抖音上总有人私信我，让我给他们推荐好书的原因。越看越觉得自己要学的东西实在是太多了！\n\
    \n### 陈昌文：\n\n凡是认真看我的书籍，并且拿着这些书籍去搞问答视频营销、直播营销的，吸粉变现都是常态。我的这些书籍，都是我的实战干货，大家直接拿过去，无脑复制，搞问答营销，收单子就行了。\n\
    \n一个是搞读书社群变现，另一个是搞陈昌文老版社群变现，日日循环爆粉，日日收单子。\n\n## 陈昌文读书社群及老板社群的三大管理哲学思想\n\n赚钱靠知识、靠文化、靠我讲的三大管理哲学思想。陈昌文读书社群、老板社群就是第三大管理哲学思想经营起来的。\n\
    \n陈昌文读书社群及老板社群的哲学：\n\n- 1、近悦远来，内圣外王。\n- 2、一以贯之，一专而终生从之。\n- 3、日日不断，滴水穿石，邹音如斯夫，不会重复。天行健，君子以自强不息！\n\
    \n客户真正需要的，就是三大管理哲学思想，以及善前提逻辑、真正有价值的观点。陈昌文读书社群和老板社群有了这个真正有价值的观点，才能积德行善、安身立命！\n\n\
    > ——陈昌文\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_326_0.png)\n\n读书就进陈昌文读书社群，每本书都是好书！\n\
    \n## 陈昌文读书社群，掌握关键人类智慧！\n\n学三大管理哲学思想，\n\n就进《陈昌文解读〈论语〉》(1)(2)读书社群！\n\n## 国学系列\n\n\
    ![](img/0fcd129d4f066239bf5d7df0159854dc_328_0.png)\n\n《论语》这本书，翻开全部是智慧。学习《论语》，传播《论语》，就是积德行善，就是做好事，救人救自己。一个有钱的美女老板、富人、高人，想要气质，提升生命质量，必须学习《论语》。《论语》是超级大智慧，教育我们首先要做一个有学问的人。一个一辈子讲《论语》，传播《论语》，就能发大财，福德兼至。\n\
    \n进《陈昌文解读〈论语〉》(1)(2)读书社群，心就安了！\n\n> ——陈昌文\n\n## 陈昌文读书社群，掌握关键人类智慧！\n\n学三大管理哲学思想，\n\
    就进《陈昌文解读《论语》》(1)(2)读书社群！\n\n国学系列\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_329_0.png)\n\
    \n我花了2年多，近3年的时间，尽可能做到日日不断的更新，才写出了《陈昌文解读《论语》》这套书，由于篇幅太大，分为(1)和(2)两本书、两个读书社群。陈昌文读书社群、老板社群的人，都在学习《陈昌文解读《论语》》，还有部分人在做《论语》、国学讲师，用《陈昌文解读《论语》》作为教程。\n\
    \n进《陈昌文解读《论语》》(1)(2)读书社群，心就安了！\n——陈昌文\n\n读书要拆究，就进陈昌文读书社群！\n\n学营销，就进《陈昌文方法 72 大营销系统》读书社群！\n\
    \n人性营销系列\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_330_0.png)\n\n陈昌文读书社群和老板社群，研究的是三大管理哲学思想、陈昌文方法，也就是价值观＋营销。三大管理哲学思想，统领《陈昌文方法72大营销系统》，以及营销系列、赚钱系列、讲师系列、老板系列、恋爱系列。三大管理哲学思想本身就是王道思想，而营销是术，这道术一结合，就自成一体，成为最强大的营销学。\n\
    \n陈昌文方法72大营销系统，是教老板做营销的、做自媒体、互联同营销，做品牌营销的。每一个系统都是教老板们如何做自动成交的。也就是教您安身立命、赚钱的本事、营销的本事、把事业做大做强的本事。\n\
    \n——陈昌文\n\n实践陈昌文方法精华，\n就进《陈昌文方法1000问：师生问答集》读书社群！\n\n## 人性营销系列\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_331_0.png)\n\
    \n这套书籍是陈昌文先生关于为人处世、心理、立志、家庭伦理、互联网营销、自媒体、粉丝经济、社群营销等方面的、师生之间的“新营销论坛集”。你读了《陈昌文解读〈论语〉》（1-2）、《陈昌文方法72大营销系统》（上、下），要进一步升华你的思想、实践到实事上，并取得事半功倍的成绩，就一定要进《陈昌文方法1000问：师生问答集》(1-2)读书社群！\n\
    \n> ——陈昌文书籍编辑\n\n## 陈昌文读书书社群又精准又专好！\n\n学做社群，\n\n就进《陈昌文方法之一个社群人的自白》读书社群！\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_332_0.png)\n\
    \n我本身是一个社群人，这些都是我真金白银的经验！《一个社群人的自白》主要写我是如何做社群的？我是如何看待社群人的？我是如何运用三大管理哲学思想和陈昌文方法完成一个社群经营理论体系的？有敏锐度的企业家都应该实践群营销。社群营销是当下最凶猛的营销，没有之一。\n\
    \n> ——陈昌文\n\n## 人性营销系列\n\n学人性营销，\n\n就进《陈昌文方法之人性营销1·如何成为赚钱高手》读书社群！\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_332_1.png)\n\
    \n这套书籍，是千年不变的人性营销、赚钱的法则！\n\n突破自己的财务边界，首先要突破自己的思想边界。变富就难在你要不断的否定自己的想法，如果你继续以你现在的思想看待这个世界，那么一切都不会改变。\n\
    ……\n如果你学会了富人的思想，那么就算你做自己的项目，也会比以前更加赚钱了。\n\n> ——陈昌文\n\n## 人性营销系列\n\n## 陈昌文读书社群又来了又享又好！\n\
    \n学人桂营辑，\n\n就读《陈昌文方法论之人性营销2，如何对准赚钱的 Announcements 读等方法评！\n\n赚钱的核心就是不断的分享价值。商业社会，一个人能富有，本质上是因为他做了很多贡献。不管是互联网经济出来没出来，最赚钱的方式就是做出贡献。\n\
    \n挣钱，本质上мотр一句话就能解释：就是天下没有免费的午餐，你想要挣钱，你就得向社会提供价值。你只要明白了这个理论，那么你就能明白网络上的钱是如何挣来的。\n\
    \n## 人性营销系列\n\n——陈昌文\n\n学人桂营辑，\n\n就读《陈昌文方法论之人性营销3，如何对准赚钱的组织》读等社群！\n\n赚钱靠的是眼光，靠的是智慧，没这个你就去学。\n\
    \n赚钱靠的是团队，靠的是渠道，没有你就去找。\n\n如果只知道干活，不知道用脑，就会越忙越没有出路，陷入死循环。\n\n团结一切可以团结的力量，这就是致胜之道。\n\
    \n## 人性营销系列\n\n——陈昌文\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_333_0.png)\n\n\
    ![](img/0fcd129d4f066239bf5d7df0159854dc_333_1.png)\n\n一起陈昌文读书社群，读好书！\n\n学老板核心法，\n\
    就进《陈昌式方法之老板心法》读书社群！\n\n任何人都不如知道自己要干啥，要买啥。您让他干，他就干；您让他买，他就买。这就是人类社会。任何人都是机械的。觉者是少数。\n\
    一切都是条件反射。\n……\n\n人与人沟通为什么那么难？因为宇宙中任何一个点都不重复。没有一个点，可能理解另一个点。除非此人成佛，是一个全部概念，则可能理解所有点。\n\
    \n> ——陈昌文\n\n学老板兵法，\n就进《陈昌文方法之老板兵法》读书社群！\n\n我感觉我发现了一个天大的秘密，这个秘密就是“卖”。我这一生，啥都不用研究了，就是卖就行了。东西有人生产，技术有人学，我只负责卖。\n\
    \n……\n\n我觉得最好的生意就是自己啥也不会， Logic 鱼几下就赚钱的生意。很多时候，并不是我们不吃苦、不努力，而是脑子没有开窍。做生意，纯粹是个思维问题。\n\
    \n> ——陈昌文\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_334_0.png)\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_334_1.png)\n\
    \n## 一起来陈昌文读书社群，读好书！\n\n学老板干法，\n\n就进《陈昌文方法之老板干法》读书社群！\n\n企业的经营使命是为了承担一个社会责任，解决一个社会问题。解决这个问题，就是战术，也是战略，就能顺手推出具体的业务组合和产品结构。\n\
    \n......\n\n先抓住一个项目、一个服务、一个产品，搞清楚“我是谁”的定位过后，企业文化布局都会一一浮现，这就是战略的形成。\n\n> ——陈昌文\n\
    \n## 老板系列\n\n学做直播，\n\n就进《陈昌文方法之讲师宝典系列·直播时代》读书社群！\n\n这是一个移动互联网时代、视频直播时代、社群经济时代，也就是说这是一个互联网个体经济崛起的时代、人类发声的时代。每个人都可以是平台上的一主角、主播、经济个体，利用自己的特长去经营粉丝，获得流量，进而变现。这是一个新的安身立命的生活方式。说话，代表了一种价值观。而通过说话达到变现的目的，就需要有超强的营销思维能力，从这个角度来讲，人人都是讲师。\n\
    \n> ——陈昌文\n\n## 讲师系列\n\n## 陈昌文读书社群，开启人人读书记时代！\n\n学品牌营销，\n\n就进《陈昌文方法之讲师宝典系列。品牌营销》读者社群！\n\
    \n![](img/0fcd129d4f066239bf5d7df0159854dc_336_0.png)\n\n真正的赚钱，就是路走对了，思想对了，然后钱就来了，搞不清楚为什么来的那么快，只不过就是一个想法、一个思维问题而已。真正的营销，就是日日循环品牌营销。只要品牌营销有意义，不搞品牌营销，你相当于白干。有了品牌，微博、朋友圈、视频、直播的营销才有意义，才能让客户直接找到商品，直接有信任感。\n\
    \n> ——陈昌文\n\n## 讲师系列\n\n学深营销，\n\n就进《陈昌文方法之讲师宝典系列。一句谎深营销》读者社群！\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_336_1.png)\n\
    \n人混社会，靠的是时机，也靠借用，也就是复制，也靠平台，也靠自己的智慧。如何赚钱？实践摆粉 + 变现就行了。如何赚钱？复制，就行了。自媒体玩的就是个爆粉游戏。\n\
    \n> ——陈昌文\n\n## 讲师系列\n\n## 陈昌文读书社群，开启人人读书时代！\n\n学恋爱，\n\n就进《陈昌文方法之恋爱与情绪的智慧1》读书社群！\n\
    \n![](img/0fcd129d4f066239bf5d7df0159854dc_337_0.png)\n\n人类的核心，就是生存与繁殖。生物的主要属性，就是生存，就是赚钱，就是养活自己，让自己的家人过得好。然后是繁殖后代。高智力的人懂得要怎么赚钱，要怎么繁殖。安全感，是实实在在的物质基础堆砌起来的。脱离物质谈安全感，这就像脱离刑法谈犯罪一样。\n\
    \n> ——陈昌文\n\n## 恋爱系列\n\n学透彻恋爱三大原理，\n\n就进《陈昌文方法之恋爱与情绪的智慧2》读书社群！\n\n![](img/0fcd129d4f066239bf5d7df0159854dc_337_1.png)\n\
    \n混社会最厉害的招式就是听有本事的人的话。只要那个个人比你有本事，你就听，不管他说什么。有本事的人、社会上的有钱人，他一般都比较聪明，他才能有钱，有本事。所以说你跟他学就行了。他怎么做，你就怎么做，不要问为什么。因为问了，你也理解不了。你理解了，你早就就有钱了。\n\
    \n> ——陈昌文\n\n## 恋爱系列\n"
