    # 团结一切可以团结的力量


    当领导不在于能管理别人，而在于能管理好自己。一个노

    能管理好自己，自然就有同样能管理好自己的人过来跟你一起做事。优秀的人，吸引优秀的人，渣子吸引渣子。知道自己不行，立马改正，善莫大焉。


    公司要专业化，我只做思想传播、文化服务、投资理財。

    我们公司的资产就是我的思想，每一个人都在卖我的思想。当然，这个思想会演化出策划组、推广组、语音组、视频组，会演化出一些我们投资的公司。每一个优秀的人才，在我们公司都将受到重用，都有机会被培养成老板。


    愿意来我公司的，比愿意走的人多，就说明公司在进步。

    我能吸引到多少优秀的人才跟我共度人生，就看出我自己的水平有多高。以铜为镜可以正衣冠，以人为镜可以明得失！'
  - '[PAGE 3]


    我喜欢那些志向大、理想大、能力大的人，来应聘的时候，一开口就是庸才的两倍、三倍的待遇，OK，我有兴趣跟他聊一聊。

    主要看其思维、逻辑是否通顺，然后试用两个月，确实是人才，就重金留下。


    老板管分钱，员工管挣钱。老板把钱分好了，员工自然就能赚回来钱。很多老板说公司业务不好做，其实是员工没有做业务的动力，大部分钱都被你拿了，谁还努力干活？让一部分人先富起来，仔细体会一下，你得到了别人的支持，你也就成功了。


    赚钱靠的是眼光，靠的是智慧，没有这个你就去学。

    赚钱靠的是团队，靠的是渠道，没有你就去找。

    如果只知道干活，不知道用脑，就会越忙越没有出路，陷入死循环。

    团结一切可以团结的力量，这就是致胜之道。


    陈昌文

    2021.6.30 于上海浦东'
