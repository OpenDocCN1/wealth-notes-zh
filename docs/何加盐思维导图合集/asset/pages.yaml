    # 信息原虫


    1首先，我们要认识到，我们会因为使用这些信息渠道而变傻。如果你觉得，“我每天都能在这上面学到很多新的知识，获得很多新的信息，我在变得更加渊博，更加智慧啊。”那就完蛋了。


    2其次，认识到我们偏颇的选择会使我们变得之后，我们就需要做出信息选择调整了。万维钢在《别胡说我！》一文中，介绍了美国技术活动家Johnson在《信息食谱》书中提到的两条核心建议：


    +   1. Consumedeliberately; 2. Take in information over affirmation.

    也就是说是：1. 我们要主动，刻意地去消费某些信息，别怕我们不喜欢它。2. 我们要去获取新的信息，而不是去为自己的旧观点寻求支撑。


    杨笙说，想要打破推荐算法，需要两个因素：1. 你需要有追求高品质内容的需求；2. 你需要随机取样人类各个领域的知识。据此，她提出几个可马上操作的做法：


    +   1. 有一个chrome应用叫stumble upon，装上以后，它会给你随机选择一些高质量网站，可能是你从来没有见过的东西。

    2. 你可以把维基百科（Wikipedia）设成自己的默认页，并且选择“随机浏览”模式（random wiki），这样每次打开浏览器就可以随机弹出一个wiki页面。

    3. 你可以去wolfram alpha上面点“给我惊喜”（surprise me），它会弹出一些有趣的知识。

    4. 你可以装一个应用叫“一亿本书”（100 million books, 在Chrome里面安装），它会随机推荐一些书，直接链接到亚马逊书店，你可以看评论，非常有趣。


    最后，对于有更高求知需求的人，这里介绍几个非常好的，关于如何打败人工智能推荐的方法。


    要警惕沉迷于“投你所好式”网络，并把它上升到“民族危机的”高度'
