    # 線下生意轉型電商，成本轉嫁變動成本


    為什麼本來做線上銷售的餐廳比較容易在疫情中生存？


    因為線上餐廳房租便宜，他不需要開在昂貴的黃金人潮區。租金在城市之中和客戶流量成正比。客戶流量愈多的地方（例如捷運出口），房租愈貴，大家都有這個概念。因此房租相當是在買流量。


    專門做線上的餐廳，因為不需要客人到店的流量，可以開在比較偏遠處，甚至是在鳥不生蛋的地方開設中央廚房，那就省很多了。


