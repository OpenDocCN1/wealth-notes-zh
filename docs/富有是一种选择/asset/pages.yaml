- pgno: 326
  md: '# **22.**

    # 創業者的世界是奇獸

    ## 世界


    創業的風險那麼大，為什麼有人偏偏要創業？在Podcast《人生實用商學院》訪問中，我覺得最讓我有觸觸的，就是創業者人生有血有肉扎實的故事。


    現代的創業者大概可以分成下面四種：


    **第① 天生生意囝仔：**

    也不知道是誰給他的靈感，他就是覺得自己應該要創業。


    **第② 本來就是超級業務員：**

    既然我曾經創下這麼好的業績，幫公司賺那麼多錢，我為什麼不自己來呢？'
  merge: -1
  img_proc: true
- pgno: 327
  md: '# 第③ 本來是上班族，忽然遇到生涯的轉折：


    剛好碰到周遭能提供某一種資源，也沒想太多就創業了。


    # 第④ 因為金錢的困境：


    只好卯起來創業，看看有沒有可能有中樂透機會！


    美國曾經有個統計，已經算是創業成功的第一代創業者，平均企圖創業的年齡二十四歲。你看，像貝佐斯、比爾蓋茲、賈伯斯、馬斯克……等，都是非常早就想創下一番事業的少年英雄，甚至不惜從頂尖的學校休學。成功的創業者中當然也不乏資深工作者，不過按比例來說：麥當勞叔叔和肯德基爺爺只是極少數的例子。而且，這些企業的成功往往也是靠有眼光的投資人，而不是叔叔或爺爺。


    我自己成立和銷售有關的公司時已經四十五歲了。這麼老了才創業，基本上不是天生創業者，也不會太有成就。而且我的興趣太龐雜，雖然也很努力在打點生意，卻一直沒有把做生意當成主業（我真心認'
  merge: -1
  img_proc: true
- pgno: 328
  md: '為我的主業是寫作和生活，連主持節目都不是）。像我這種沒有企圖心的人，當然在創業上也不會有太大的出息，沒有辦法成為創新企業的開拓者。


    和這些至少目前算是成功的創業者訪談，對我而言最大的好處，在於可以跟商學院的原理印證。這些創業十年以上還存在的創業者（別怪我說話難聽，因為成功這兩個字很難講，在商業上的成功可能只是晚五分鐘失敗，70%
    的中小企業大概在三個月內就倒得差不多了），個性通常很有趣，對新鮮事很好奇，在挫折中也很耐靡，訪問了這麼多人之後我大概可以歸納出幾點原則。


    # 當踩不死的蟑螂，比聰明的狐狸來得重要。


    創業失敗要承受的壓力到底有多大呢？出品很受歡迎的功能型護膝的京美董事長呂麗美，原來是誠品書店的法務長，後來被挖角到了科技公司上班。因為'
  merge: -1
  img_proc: true
- pgno: 329
  md: '夙夜匪懈地工作，表現傑出，當這家上市科技公司要成立子公司的時候，老闆指派才三十歲左右的她去當CEO，籌備子公司的上市事宜。


    三十而立就當董事長何等風光，她很單純的接受了。沒想到後來不但沒有上市，而且按照當年的法律害她背上了連帶責任：債務高達4億以上。


    那是十八年前的事了。失業了一陣子，後來她得到一個日本企業的幫忙，靠著製造功能性護膝，請了一群草根性很強的業務員，從逛香团的遊覽車開始銷售，創造了她自己的功能性紡織品王國。就在她真的認為鉅額債務可能被某銀行忘記的時候，她家被查封了，要她把4億還出來！


    這代表她大概得把整個公司賣掉，才能夠籌出這麼多錢。還好學法律的她知道這些債務可以協商，這些年來金融業經過了一番整併，後來跟你討債的肯定不是原來債權銀行，來討債的銀行其實是用很便宜的價格買來不良債權，所以只要你有耐心，肯定好商量。'
  merge: -1
  img_proc: true
- pgno: 330
  md: '透過各種關係，她終於以自己可以負擔的數目解決了債務問題。還完債的那一天，她剛好來上我的節目，整個人神清氣爽，無債一身輕。說真的，我跟她認識了好幾年，如果她沒說，我還真不知道她之前承受這麼大的壓力。


    不管在多大的壓力和委屈（通常人會覺得委屈，是因為欠的債沒有一毛錢是她用掉的），仍然不氣餒，是創業者很重要的條件。


    # 你不會一次就成功，但是你要在失敗中培養某種能力


    這種氣魄，我也可以在永齡基金會執行長劉有形身上看到了。她在很年輕的時候也因為擔任樂陞科技的董事會成員而遭「連坐」，揹上 6,000 萬元以上的債務。走投無路的時候，又很天真的把僅有的資金投入「無毒蝦養殖」這一行，完全沒有經驗，只有創造讓孩子吃了不會過敏的海鮮的理想，創業幾年之間，遇到了'
  merge: -1
  img_proc: true
- pgno: 331
  md: '各式各樣的天災人禍，虧得更慘。


    不過，她也沒有氣餒過。


    在各種挫折之中，她鍛鍊自己的情商和能力。不只培養你的能力，在你解決問題的過程中，也會讓你學到處事圓融。也正因為她解決問題的能力與經驗，才會受到郭台銘董事長的青睞，請她負責永齡農場的營運，在極短時間內將其轉虧為盈。


    因為連帶作保，或者父債子還，我遇過這種「錢不是我花的，但是債卻是我要還」的創業者很多，正因為無路可退，只能不斷地尋找出口。


    事實證明，只要你能夠在困境中繼續培養自己的能力或專長，你的光芒就會被看見，而過去的失敗會變成肥料；只要能夠堅持活下去，繼續嘗試可能，遲早能夠在生命裡見證花團錦簇。我提到的這兩位，都是在金錢的困境中走投無路之後，才在創業中發現自己的道路的。'
  merge: -1
  img_proc: true
- pgno: 332
  md: '# 也許事業是上天幫你關上一扇門，逼你找到風景更好的窗


    工作失敗之後企圖轉型的創業者，摸索成功的道路要比較久些。


    如果你聽到了他們的故事，就會發現也許失業也不是壞事。比如說開設了 20 多家「燒肉胡同」等連鎖餐廳的吳念忠，體育系畢業之後很安分地當一個健身教練。但運氣實在不好，這個知名的健身中心倒閉了，他在家休息一個月，剛好和兩個專長不一樣的朋友喝個下午茶，3
    個人憑著一種對心目中美好餐廳的想像，開始創業。


    其中一位是設計師，另外一位是餐飲專業人士，只有他的專長派不上用場。他的運氣還不錯，遇到了好的合夥人，幾乎是第一次創業就成功，可是中間的過程肯定是辛苦得不得了。他本來什麼都不懂的，從創業第一天起，身高
    189 公分的他就蜷縮在廚房裡，從來沒缺席過。一早進去，半夜才離開，創下'
