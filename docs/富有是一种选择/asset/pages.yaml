    1988 年發生了郭婉容課徵證所稅事件（這是五年級同學一出社會不久最大的經濟風暴，還好我們當時都不是很有錢）。有一天他看起來非常沮喪，我問他怎麼了？


    股票連跌 18 支停板，而他又是借錢來買的。「比妳能夠想像的還凄慘！」我毫無概念的腦袋想不到有什麼比這更慘。他說：「全部歸零了！」


