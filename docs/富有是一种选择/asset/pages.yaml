  md: '# 13


    黑鑽定律：想走向成功，先學會「遮蔽社會給你的負面信號」


    你相信吃得苦中苦，方為人上人嗎？請為這句話打一句問號，問自己：想成為成功的人，除了吃苦，你還能做什麼？


    煤炭與鑽石組成元素接近，但價值天差地遠。雖然人們習慣這麼形容，鑽石熬過千萬年的高溫與壓力，最終鍛造出它的不菲價值。但事實上，煤炭同樣經歷了長久的地質作用，煎熬可沒比鑽石要來得少。


    所以，真正的差別並不是時間與努力，而是面對外界壓力的蛻變方向。鑽石是世界上最堅硬的物質，不論火燒或重壓都無法改變形狀。但煤炭不只硬度完全比不上鑽石，而且只要經過火燒，就會釋放熱能，'
  merge: -1
  img_proc: true
