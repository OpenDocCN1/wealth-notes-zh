  md: '我個人認為，雖然不會太快，但緩步前進到 1% 是有可能的！美國調整利率的步調肯定是我們央行的行動指標，只不過我們不會次次跟進。畢竟通膨雖然高，實體經濟並沒有齊頭並進！


    你會發現，不管是因為疫情還是因為物價上漲，很多行業還在水深火熱之中。所以央行總裁才會說：升息是個痛苦的決定！我個人是這麼想的（當然你也可以有不同的想法）


    # ❶ 生活負擔預期增加


    如果你們家年收入總計有 100 萬，面對房貸支出多出 12 到 24 萬（假設一般人貸款落在 1,200 到 2,400 萬之間），肯定是筆不小的負擔。


    如果是已經買了，我勸你能夠先不還本金就不還本金（因為通膨會吃掉錢的購買力，包括本金債務）。就像我們先前說的，20 年前的 100 萬跟現在的 100 萬是完全不同的，你的債務當然也會貶值。


    至於所謂的欠錢的壓力，有時候臉皮要厚一點。'
