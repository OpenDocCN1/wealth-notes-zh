- pgno: 244
  md: '# 運氣不好？可能是你沒看到機會


    大多數人對希望感有兩種常見的誤解：第一，希望感來自優勢（例如「有了富爸爸，人生才有希望」）。或第二，希望感來自對美好生活的空洞想像力（像「只要抱持著希望，就有機會」）。


    通往美好生活的主動權還是由行動力決定的。


    英國心理學家懷斯曼曾做過一個超妙的實驗，他找來兩種人參加，自認為好運的人，以及自認為缺乏運氣的人。懷斯曼給他們一份報紙，並請他們計算這份報紙有幾張照片。他發現：自認缺乏運氣的人會悶著頭開始數，但自認好運的人很快就能知道答案————因為他們注意到，其實報紙頭條就寫道「別數了，報紙上共有
    43 張照片」。


    這個實驗告訴我們什麼？懷斯曼發現，自認為不幸運的人往往容易緊張或焦慮而不識「大體」，使得他們眼光只看重在小地方、小目標，大大削弱其發覺意料之外機會的可能性。反之，幸運的人不受限於解'
  merge: -1
  img_proc: true
- pgno: 245
  md: '決問題的方法，更能好好觀察、思考不同的可能性。


    簡而言之，你以為機會沒找上你，但其實是你沒看到，只想到眼前的問題，沒有把眼光放大放遠。


    在理財的過程中，你可能也會發現，為什麼有些人總是運氣特別好，為什麼他們總能看到意想不到的機會（說真的，我認為這些人只是習慣報喜不報憂），而我就是天生倒楣？這時候與其去埋怨時運不濟，提升自己的「希望感」可能更有助於解決人生的問題。


    # 希望感：主動達成目標，而非被動等待


    如何主動培養希望感？在1994年提出希望理論（Hope Theory）的堪薩斯大學心理學家斯奈德認為，希望感就等於達成目標的行動力，加上達成目標的計畫與策略。


    先訂定目標，並且規劃路徑，再加上堅持下去的行動力。換言之，「希望感」是一種主動的、動態的'
  merge: -1
  img_proc: true
- pgno: 246
  md: '精神與熱情，不斷與環境互動的應變歷程。


    相信你已經看到重點了：面對問題企圖解決的態度策略思考，決定了你這個人是否「有希望」。古人說「小人恆立志，君子立恆志」，想積極向上的人很多，但有策略且達成目標的人卻少之又少。沒有方向感也不盡人事，只想聽天命的人，講白了就是拿自己的人生或財富在賭博——而且我們都知道，十賭九輸。


    這也是我很喜歡到商學院讀書的理由，和喜歡做生意的原因。從商是講究策略的，也就是如何達到目標，要有達到目標的步驟。


    所以我們要如何增加希望感呢？我在上海「中歐國際工商學院」的心理學老師——北京清華大學心理系教授彭凱平認為有四個方法：


    # 第一 面對挑戰，培養目標導向的思維。


    多數人不會因工作而感到幸福，是因爲缺乏明確的行動目標，或工作內容與心中目標不符，人在曹營心在漢。因此建立合理的目標，就是建立希望感的第'
  merge: -1
  img_proc: true
- pgno: 247
  md: '一步。


    但如果目標太過虛幻，無法轉化為實際行動，就會淪為空談。管理大師彼得·杜拉克給了一個幫助我們設定目標的方法「SMART 原則」：具體的（Specific）、可測量的（Measurable），可達成的（Achievable）、相關的（Relevant）與有時限的（Time-bound）。舉例來說，新的一年你想要「提升英語能力」，這樣的目標當然不夠具體，你的明確行動是什麼？量化目標又是什么？如果改為「在半年內完成線上英文課程，並且檢定成績要成長
    10%」，這樣的目標會更有利於執行。


    | 縮寫 | 意義 | 解釋 |

    | :---: | :---: | :--- |

    | S | 具體的 | 明確且具體的行動 |

    | M | 可測量的 | 可計算的基礎或單位，通常為量化指標 |

    | A | 可達成的 | 符合自身能力 |

    | R | 相關的 | 與主要目標相關 |

    | T | 有時限的 | 規定在一定時間內達成 |


    246


    人生實用商學院：富有是一種選擇'
