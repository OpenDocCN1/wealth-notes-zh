  md: '一直轉移，沒有東西是不變的，有問題才是常態，不要期待哪天人活著會沒遇到問題。因此不要害怕變動，如果這世界一直安全而沒變化，相信你也會倍覺無聊。不變，也不公平，如果世界真如秦始皇所期望的「萬世一統」，那從祖先到我們也就是萬世賤民，不得翻身，你要愛上變動本身，就算不愛也要說
    Yes ！


    # ② 你要有度量。


    不要因為別人批評就動怒。其實俗話常說，嫌貨才是買貨人。顧客批評你，當然未必完全是你的問題，但是必須胸懷大肚，因為這可能讓你看出自己不足之處。如果他只是故意來挫折你的自尊，那是他修養問題，大可不利會。但如果再這些話語中，你能夠嗅出某種建設性的力量，不如思考一下，也許可以得到啟發。那些沒有建設性的話不要聽，但是有建設性的批評，不要急著不高興。


    # ③ 不要怕被拒絕。


    對商人來說，每個人都是潛在的客戶，人家現在不買不必耿耿於懷。商人知道客人這次不買，下次也'
