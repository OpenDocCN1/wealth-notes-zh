- pgno: 200
  md: '套 3 房 2 衛的老公寓，花了 53 萬整修，最後以總租金 37,000 元租出去，每個月支付公寓管理費用 1,000 元。計算下來，五年從這間「不是自己的房子」可以獲得近百萬毛利。


    數字很好看，但是這個商業模式背後有幾個大前提：


    ① 信任：第一個關鍵是要取得「怕麻煩」的房東信任，你要跟房東簽足夠長、租金夠低的租約，至少要五年，這樣你才有足夠的時間回本並且累積淨利。但相對而言，房東等於將每個月應該收到的一部份房租，「投資」在他的房子身上，可以獲得最後「改造」後的成果，也不用付整修費，但是這沒有一定程度的信任是很難達成的。


    ② 不怕麻煩：包租代管之所以可以創造這麼高的投報率，一定要壓低人事與管理租客的成本。例如如果租客有水電問題，二房東絕對是第一線要處理的人。你得很不怕麻煩，喜歡人，也擅長溝通，熱愛解決問題，樂於解決房子與租客的問題，如果用太多'
  merge: -1
  img_proc: true
- pgno: 201
  md: '人力在管理上，會吃掉大部分的利潤。沒有悠閒的老闆，只有親力親為，苦幹實幹，對細節充滿耐心的「二房東」。


    **❸ 「輕裝修」降低成本**：裝修成本愈低，你回本的速度就愈快，因此不要動到大格局，之前在「裝潢」這一小節曾經說過，只要一打牆壁，裝潢費馬上大躍進，也差不多等於全部重改了。請善用軟裝布置的輕裝修（比如：IKEA
    或宜得利家居等），會是較為合理的作法。特別是老房子，而每一道裝修痕跡背後，都可能有一個結構性的問題，貿然想要全盤改善，都可能掀開潘朵拉的盒子。請記住，別把幫你運費的騾子改成賽馬！


    # ❽ 一人公司或擴大團隊？看現金流說話


    減少人事支出是行政成本的考量，在臺灣這類包租代管的生意，大多規模不大，像是我採訪的陶迪在早期幾乎符合「一人公司」的創業類型，等收入多'
  merge: -1
  img_proc: true
- pgno: 202
  md: '了、物件多了，才慢慢增加人手。


    在這裡閒話一句，有些人真的把當老闆想得太容易了。我曾經遇過這樣的人，開始做電商，第一個月，在同溫層（也就是同事或者是平常常常接觸的團體）裡面賺到了幾十萬，就開始成立公司。


    公司成立之後，就開始請人。他的計算方法很簡單，假設第一個月賺了30萬元。他就推算每個月都可以賺取同樣的錢，不知道銷售業績其實並不穩定。然後，也忘記了公司的成本和聘請員工除了薪水之外，還要付很多費用。租用辦公室，除了租金本身之外，也一樣有很多開銷。就算你是老闆，公司賺的錢，並不等於就是你的錢，還要扣掉營業成本等等。


    他請了會計，請了倉儲管理員，這些都是正職，還不是兼差。因為平台常常必須做美術設計，又打算請美編。想法很單純，就是覺得這些員工反正薪水不高，30萬元好像夠花。


    第二個月收入十幾萬元，第三個月變成幾萬元，公司當然得結束營業。但是結束營業並沒有那麼簡'
  merge: -1
  img_proc: true
- pgno: 203
  md: '單，如果你一開始跟員工說的是正職，那你就要多付給他們遣散費。創業並不只有開幕時期要付錢，退出也是有門檻的，很多人常常發現在結束的時候他虧最多的錢！


    總而言之，「服務業」賺錢建立在節流上，如果你把包租代管當成獲取現金流的方式，擴大規模甚至管理團隊，都會大量燃燒你的管理時間與資金。


    還有如果你要做這一行，一定要考慮規模經濟的問題。前面的那個收入表，感覺很賺錢對不對？不對，毛利五年 100 萬，一年只有 20 萬元。如果你只管這一間房子，你是會餓死的，雖然平常會比較閒。就算沒有任何扣除額，20
    萬元平均分到每個月，你的薪水只有 16,000 多元，還不是淨利，當然不夠活！


    所謂的規模經濟在這裡的解釋就是，你不能只管一間房子吧？不過如果你是一人公司，校長兼撞鐘，再能幹大概也只能管個五間，再來就要有團隊囉！那又有別的成本要算進來！


    管 5 間，之前每一間取得的房租成本都這麼好的'
  merge: -1
  img_proc: true
- pgno: 204
  md: '話，你也只能賺到8萬元/每個月。這個收入也只比一般上班族好過一點。何況我前面並沒有把營業成本等雜七雜八項目算進去喔。


    聰明的你也一定發現：前期成本，也就是裝修費用的利息沒有算進去，把這麼大一筆錢投入在別人的房子，你必須要不心疼，而且必須要遇到講理的房東。我曾經看過房客很努力的裝修房子，也簽了五年的合約，打算就這樣住下去，可是房東突然變心，看你裝修得這麼好，他就打算把它賣掉，用了各種理由，還動用親友之間的黑社會大哥企圖來收房子。畢竟所有權是他的，利字當頭，承諾全忘了，也沒有在怕法律啦！所以你一定要祈禱遇到好人才行啊！


    我也有一個同學，曾經從事建築業。在四十歲的時候，把所有的錢拿來買一棟老公寓，在某大學附近，租給學生。這個老公寓雖然一層的面積不大，但是足足有5層樓，加上頂樓，隔成15間房子。收學生費用不能收太高，每間房間平均每月租金6,000元。就這樣開心的退休了十幾年，可是他後來說他好'
  merge: -1
  img_proc: true
- pgno: 205
  md: '# 後悔，為什麼？


    因為他常常在帶看房子，尤其是週六、週日。學生的狀況也比較多，要修理的東西也很多。十多年前每個月 9 萬元很多，現在 9 萬元真的沒多少。家裡還有幾口人要養。


    再 عليه他也面臨到少子化問題的考驗，大專院校招生不足，學校學生人愈來愈少，這就是人力不能回天的地方了。


    更高段的人一定也察覺了，他每個月並沒有真正拿到 9 萬元。因為不是自住房，肯定要付比較高的稅，還有這 9 萬元其實還要扣掉機會成本（買房子的資金成本的利息是多少？這就是機會成本的問題。不能因為是自己買的房子就都沒有算）。


    修繕費用也不少，好處是養成的十八般武藝，從電路到馬桶全都會自己修理。說真的，如果我有一棟這樣的老房子，我寧願賺少一點租金，交給現代二房東管比較好！那我還可以有足夠的時間，去做自己喜歡的事情，不需要做雜工吧？'
