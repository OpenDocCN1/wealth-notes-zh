  md: '# 11.

    女人買房，買的是出路

    和退路


    近來有一個統計數據很有趣：全臺灣土地擁有者中，女性占比是 46.3%，其中臺北市跟新北市的女性土地擁有者，還比男性來得多，也算是以地區而言，臺灣「城市區」女力崛起的證明。


    但如果只看「單一所有權人」的資料，女性單獨持有房地產的比例為 35.9%，男性則是 45.6%，女性單獨持有「自己的房子」的比率不斷增加中。


    自己擁有一棟房子重不重要？先說個故事，有一位年輕時因為結婚離開職場的地方電視台主持人，過了好些年重新回到職場找工作。


    通常為了愛情離開工作的女人，也常會為了失去愛情而離開家庭。她告訴我因為先生感情出軌，兩人'
