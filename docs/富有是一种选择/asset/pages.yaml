  md: '# 02.

    消費再定義：你該在意的是「資產」還是「耗材」？


    「天下沒有白吃的午餐」，這句話人人會用，但大多數人卻沒弄清楚它真正的意思。這句話講的不是「沒有免費的事物」，而是任何選擇背後都有成本：餐廳招待你一份免費午餐，你的成本是不去另一間餐廳消費；超市提供免費停車位，其實已經把成本轉嫁到營業成本，也就是你購買商品的價格中的一部分，甚至可能由所有消費者共同負擔。


    在這裡，我們只要記得：任何東西，不管它是多少錢，你都有投資成本。如果你買到的東西會增值，這筆成本就會賺取利潤。如果你買的東西會隨著時光貶值，那麼我們就叫它「耗材」（《富爸爸、窮爸爸》'
