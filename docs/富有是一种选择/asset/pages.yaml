- pgno: 95
  md: '我們都知道，當有人告訴你「保證獲利」，那麼詐騙的可能性居高。反之也是如此，如果借貸的基礎是來自於「保證投資績效」，那麼就是騙子在騙你，而你也在欺騙你自己。人類在投資上常是初生之犢不畏虎，簡單來說就是過度自信，總會高估自己的投資績效與還款能力。當投資人借入現金作為短期投資，又沒有穩定現金流可以支應還款，就代表將還款能力與投資績效用手銬銬在一起。如果市場進入短期空頭，最壞的可能就是必須認賠殺出，挪現金來還款，等同彈藥不斷流失。萬一從事的是高風險或高槓桿的投資被斷頭了，最後連翻本的能力都失去，只剩下須定期還款的債務。


    應該說，你應該要懂得區分「好債務」與「壞債務」的差別。好債成本低，而且能夠幫助你累積資產，成為未來現金流的基礎；壞債成本高，無法累積資產，會造成現金持續流出，還可能迫使工作者必須不擇手段才能還債及支付生活所需。


