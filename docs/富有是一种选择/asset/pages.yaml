  md: '生路徑，也使我嘗試了各種職涯冒險。我從不渴望當明星，卻因緣際會做了幾十年主持人；從未想過有一天會從商，也當了商人；其實年輕時候也沒想當個母親，卻也費盡辛苦的當成了。


    人生，說白了就是經濟學一套複雜的「動態賽局」，而且通常是由意想不到的元素組成。人的一生總要面對一道道選擇題，哪個對？哪個錯？很難說。有時候前面對了，後面卻歪了。不同的選擇，都會觸發後面不同的結果與後續的劇情。有些人常為當初的選擇或慶幸或懊悔，但事實上就算當初換作另一種選擇，可能也未必帶來你預期的結果。


