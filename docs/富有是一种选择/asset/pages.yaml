    # 鍊金筆記


    「成功的失敗」 與 「失敗的成功」


    矽谷最忙的職業是心理治療師，有特殊才能又努力的創業者。在很短的時間裡賺到非常多的錢，然而當第一桶金已經賺到，完全實現財富自由時，他們會陷入深深的迷茫，這就是成功的失敗。


    失敗的成功，是儘管項目失敗，但你盡情地享受其中的過程；成功的失敗，是你縱然得到了'
