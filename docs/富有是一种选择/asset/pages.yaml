  md: '# 自信，來自自知之明


    那麼自信主要是在哪幾方面體現呢？首重自知！有自信的人比較有自知之明，你能不能做到一件事情？你自己是否可以評估得很清楚？你知道自己的優點和弱點嗎？在這裡透露一個小祕訣，雖然我年紀已經大到不必求職，但在這兩年考上兩個博士班，都和
