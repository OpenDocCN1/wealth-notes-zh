- pgno: 43
  md: '活所需認定不同，事實上也會隨著時代而不同。二十年前退休的人，有 1,000 萬元就會認為足夠終老，事實上如果這 1,000 萬元是死錢，無法活用衍生新的錢，很快就會坐吃山空。


    其實富有是物質面和精神面的「雙重得意」，必須建立在多元的條件上。講得更具體一點，想要變富有，在我看來，最好具備以下生活特質：


    # ❶ 養成良好的生活習慣


    有好的生活習慣，代表你在健康方面比較不需要讓人擔心，像是運動就是一個好習慣。維持健康，就能省下醫療花費，這是最好的節省行為。


    # ❷ 定義你自己的夢想，並且提高行動力


    別說沒有夢想。夢想未必要太偉大。夢想並不是「目標」，是你活著的動力和意義。我的夢想很微小，就是把自己活得好一點，而且隨著年齡進展，人生仍有新樂趣、新學習、新期望。我們不必期望自己像
    SpaceX 創辦人馬斯克立志登陸月球，但我們可以'
  merge: -1
  img_proc: true
- pgno: 44
  md: '當很有行動力、確實達成小小願望的人。不管你多大年紀，提升自己都是必要的。請相信，人雖然想活得舒服，但原地踏步你會愈活愈不舒服。


    # 3 規律性固定學習充實知識


    現代人多麼幸福。在科技的協助下，愈來愈多管道可以充實知識，線上課程、電子書、Podcast，只要有手機就可以開始學習。而且有每天固定學習習慣的人，通常在時間管理上會比較有效率，那代表生活也會比較有規律。每天讓自己多成長一點，投資在學習上也能創造複利效果。我很相信「追求夢想會孳生利息」，不只在理財上創造「複利」才能使你懂得讓財富自由，在學習上很多人困惑於科技所帶來的「訊息爆炸」，很怕會因而變得焦慮。那是因為你眼中所見是資訊，並非知識。新聞不是知識、八卦不是知識、經驗也不是知識，知識還是要經過系統化學習，或者比你專業的人幫你整理出思路和邏輯。


    # 4 和正向的人做朋友


    到了一定年紀之後，我知道自己不可能跟每個人'
  merge: -1
