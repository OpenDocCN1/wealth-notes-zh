- pgno: 290
  md: '# 大家都買不到，製造商為什麼還賺不到錢？


    有種奇妙的供需現象叫做長鞭效應，最早是由麻省理工學院的一個啤酒遊戲開始。研究者扮演玩家，在麻省理工學院分別飾演製造商、批發商、通路商與零售商，彼此只能透過訂單來傳達資訊。


    假定一開始每星期消費端的需求是 4 箱，零售商與批發商除了定期向上游下訂 4 箱，每一張訂單是 4 週後交付。製造商則固定維持 12 箱存貨，彼此相安無事。


    但是有一天，消費端將需求提高到 8 箱，就開始發生出乎意料的影響：零售商存貨下降，為了怕無法供應消費者不斷增加的需求，零售商開始超額訂貨，比如说，每週向批發商多下
    4 箱訂單。因為每週的訂單都要等到 4 週後才會完成交付，因而前線的缺貨需求不會立即得到滿足。


    在此同時，市場因為供不應求，市場買氣更旺'
  merge: -1
  img_proc: true
- pgno: 291
  md: '盛，反而推升需求，使得零售商追加訂單的力道愈來愈大。造成：消費者搶買，零售商不斷追加訂單，製造商則為了滿足市場需求，持續增加器材、原料人力的支出，並且增加了存貨數量以應不時之需。


    然而結局是什麼？就是製造商白忙一場。商品曾經暢銷，但是供給始終跟不上需求。等到製造端終於追上了市場、將缺貨的需求補齊時，市場買氣早已退去，零售商與批發商退回貨物，留下大量賣不出去的存貨。這個遊戲告訴我們，在一個動態供應鏈系統裡，就算其中成員沒有任何不良意圖，也可能會失控。


    在啤酒遊戲中，因為上下游供應商的資訊不夠透明，如果供貨時間加長（也有可能因為大家搶不到，消費者連出高價都願意）容易造成「長鞭效應」（The Bullwhip
    Effect）（也可以稱為牛鞭效應）。所謂長鞭效應，就是市場需求一路向上游供應鏈傳遞時，各級廠商都怕缺貨，因此把量多加一點，最終產生巨大扭曲、預測失準的現象。這種現象會導致出產暢銷商品的廠商，最後反而賠錢。'
  merge: -1
  img_proc: true
- pgno: 292
  md: '在現實世界上曾經發生這個例子：P&G（寶僑）曾對尿布供應鏈做調查，發現尿布只要有小小的缺貨現象，零售商、批發商都會為了保留一點存貨以備不時之需，跟上游多訂一點，一直影響到原料供應商也在大量叫貨，過了一段時間之後就演變成製造過量。


    比如說，市場上多了10單位的尿布需求，零售商可能會樂觀地認為需求還會持續增長，而向其批發商訂購15單位的紙尿布。批發商收到15單位的需求後，會向上游製造商，訂購25單位的紙尿布，以應付這波需求變化。此時，製造商就會再向其上游原料廠，訂購35單位的原料來製造紙尿布，就這樣需求逐級放大，最後真實需求從10單位慢慢變成為35單位。


    這種狀況在臺灣，最常出現在衛生紙的短缺上。


    說真的，大概每二年我們都會因為各種理由（比如疫情剛開始時也發生過）發生一次衛生紙大搶購。其實你真的不用搶，準備適量就好了，它真的不會缺貨很久，不多久，量販店一定會出現大量衛生紙！'
  merge: -1
  img_proc: true
- pgno: 293
  md: '紙尿布跟衛生紙都屬於剛需，製造商的貨一定是賣得掉的，但有些趕流行的東西就不是那麼幸運。比如某一種特殊款式的服裝，或者是被某個明星鍾愛因而暢銷的口紅。剛開始大家都買不到，廠商就拼命地向上游加量訂購，但是到最後卻因新鮮感消失而變得乏人問津。


    其實疫情爆發之後，晶片也有這樣的現象。全球生產鏈銜接不順，各下游廠商為了怕缺貨，提高庫存水位已成爲常態。這種產品雖然是必需品，但也不是多數廠商製造得出來的。當市場不確定性增加，一定會有超額訂購的現象，使半導體產業紅紅火火。


    連我都曾經被大陸半導體業的同學要求，拜託我打電話到台積電去替他要晶片（當然是用買的），但我是誰？台積電為何要買我的帳呢？不過我後來真的「因緣際會」幫他達成了需求，還賺到了一瓶拉圖堡的紅酒。


    再舉一個簡單的例子，臺灣曾有某本書因為作者的某個特殊事件引發關注，一時洛阳紙貴。消費者到'
