- pgno: 41
  md: '《世說新語》，意思就是「那個東西」，不願意直接稱呼。原來對這些古代的文青而言，錢跟小說《哈利波特》裡的佛地魔一樣，不能直呼其名諱。


    每個人都想變有錢，但什麼是有錢人？有 100 萬元是有錢人嗎？有 1 億元是有錢人嗎？在我看來，沒有一個固定金額可以讓你真正「升等」為有錢人。因為有錢人的定義與金額無關，而是你對財務的掌握程度，「當你覺得自己錢夠用」你就是有錢人。


    不過這有個前提，那就是你知道自己需要多少錢，清楚自己的理財狀況。相反的，如果消費缺乏計畫，那麼你永遠看不到盡頭，那我相信你的財富因為錯誤投資而流失的速度，永遠會比賺的速度更快。不是你賺不夠多，而是無知擋住你前往富裕的道路。


    除此之外，窮人很會「搞丟自己的錢」，相反的有錢人很擅長利用錢為自己工作。最常見的例子，就是窮人為了省 50 元斤斤計較，卻習慣把存款放在銀行定存，放任通膨侵蝕價值而不在意。但有錢人會讓錢放在更有價值的事物上，不管是花錢或是賺錢，他'
