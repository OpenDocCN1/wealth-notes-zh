  img_proc: true
- pgno: 222
  md: '曾經發生南寧購屋的詐騙案！南寧案大概可以寫一本書，簡單地說就是「臺灣人騙臺灣人」最佳經典詐騙案。名列臺灣人在大陸詐騙臺灣人的重大吸金犯罪 NO.1。


    以臺灣人為首的詐財集團總以「僅需支付機票費用，食宿全部免費」，讓你到廣西省南寧市旅遊及投資考察，並說幾個當地知名的商業園區、商議廣場、長壽村等重大建設，都是靠著官方關係，和南寧市政府一起運作的「純資本運作」。手法還有安排民眾到詐財集團成員之豪華住所參觀，使大家誤以為合法且利潤豐厚。（這個氛圍跟某些非法直銷實在很像）實在太無拘無束了，隨便在路上指著一棟大樓，就還要你買，其實他根本沒有所有權！


    類似的詐騙案其實一直到現在還是層出不窮，大家好了瘡疤就忘了痛（應該說過去的瘡疤並沒有長在自己身上，所以不會痛，總以為別人比自己笨才會被騙）。說真的，臺灣房子很貴，而且投資獲利的空間也沒很高，未來少子化也會慢慢地威脅房價，近幾年'
