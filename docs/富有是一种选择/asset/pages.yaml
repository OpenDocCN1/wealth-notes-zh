- pgno: 187
  md: '定，生意好不好也跟他沒關係，自然沒有打撳都更的誘因。


    請注意，危老需 100% 的所有權人同意才能申請，過程中只要某一戶反對，大家只能「多數服從少數」！而且在申請的程序上面，為了要顧及大家的權利，規定真是多如牛毛啊。


    「都更」從擱平大多數住戶申請開始，不僅要提具計畫書等證明，過程中至少要舉行兩次公聽會，曠日廢時，有一個在臺北市信義區「昇陽信義」，花了二十多年才完工（請注意，大家這麼有耐心磨，实在是因為它位在信義區！）


    危老最難的就是要取得全體屋主同意，而且要符合危老鑑定。如果有業者願意承接（這當然跟承接的建商的利益有關係，私底下了解，如果沒有兩成淨利，真的沒有人要去搞情理法這麼複雜的事情），申請建照及拆除執照之後，快的二年大功告成，所以它後來居上，法令出現的年間比較短，但是成功案件多很多！'
