- pgno: 93
  md: '債有兩種——「好的負債」：買資產，借錢來賺超過利息的回報；「壞的負債」：買耗材，吃喝玩樂以債養債。


    # ❊ 債不可怕，沒本事還錢才可怕


    看到這裡，你以為我在勸你借錢？錯！故事還沒說完。借貸後，你將面臨一連串的考驗：


    +   1 現金流。


    向銀行借貸，並不是時間到了才還錢，而是過程中就要定期還款，還利息負擔不重，但是加上本金負擔就重了。而且別忘了，我們手上的現金與實際購買力也持續被通膨啃食，生活成本會上升，你本來以為夠用的生活費會不夠用。


    +   2 人性。


    如果你申請的並非是有特定用途的就學貸款或房屋貸款，而是直接現金入袋的個人信用貸款，不只利'
