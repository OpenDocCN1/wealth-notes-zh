    她覺得我很煩，舉了一些例子，說其實這個東西的味道跟愛馬仕的某品項的某個味道也很像。然後告訴我她覺得商業知識很煩，說我應該要勇敢！


    我說，做這樣的生意，不但賺不了錢，還要賠上很多時間，也賺不來任何好名聲，建立不了商業信譽，到最後可能因為賠錢還損害友誼，我真的不能做。我寧願花很多錢請她吃一頓大餐，如果她不想懂做生意的基本原則，拜託別找我。


