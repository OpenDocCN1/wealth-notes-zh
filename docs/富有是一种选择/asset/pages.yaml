- pgno: 140
  md: '安心感很重要。


    # 用專案管理的角度來執行買房計畫


    用專案管理的技巧來執行買房計畫，還有追求你的人生具體夢想，會化繁為簡。


    推動一個專案，要有路徑圖。每個階段（包括所需時間與階段時間點）要完成哪些功能，一步一步地完成整個專案。在買房這件事情，如果你像我一樣不是含金湯匙出生也沒中過特獎，那也只能用換房的方式，一步一步換到我們想要的房子。總會比你一直等，等到存到足夠的錢的那一天踏實。你肯定不會存到足夠的錢，因為之前我們說過：房價漲幅還比通膨快，也比你的其他類型的資產快。


    路徑圖的每一步，不能「時到時擔當」，時間到了再想，必須超前部署，把條件列清楚。看房之前，先擬定好願望清單，把房子一定要有的條件列出；而不是邊看房子，邊聽房仲推銷，邊想像這個是不是符


    第二篇：資產  139'
