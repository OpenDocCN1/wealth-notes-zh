  md: '![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_296_0.png)


    # 鍊金筆記


    創業失敗最主要的原因集中在「資金問題」層面，包括燒錢太多、現金流斷裂和融資能力不足。


    可以說，企業的商業模式沒有搞懂，不斷花錢去買廣告，拼命製造自認為的好賣的產品，或者找不到資金來源，一旦遭遇外部環境變化（如疫情），脆弱的現金流容易斷裂，破產也就是遲早的問題。'
