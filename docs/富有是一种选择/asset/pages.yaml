  md: '不是黃金相關股票喔）不是耗材，但是也不是太好的資產，因為黃金本身沒有利息，本身也無法帶來現金流。真的別再懷念老一輩的說法：「你看在逃難的時候啊，黃金比貨幣好用多了，當時我就是拿它來換船票啊。」在危難的時候，拿一條價值上萬的黃金買一袋米，恐怕也是划不來的交易。


