  md: '「不得不借錢」的境地。在金融的世界裡有兩種人屬於借貸市場弱者：急需用錢的人，以及信用不佳的人，因為這兩種人取得資金的成本最高。更可怕的是，當你陷入「以債償債」的地獄時，就會持續推升取得資金的成本。循環利率很可怕，可能高達
