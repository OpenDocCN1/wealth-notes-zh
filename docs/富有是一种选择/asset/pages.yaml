  md: '大。記者稿子常寫到很晚，隔天就要出報，得有人來把記者的手稿排成鉛字。時間有限，必須排得又快又準確，老手的薪水很高，也有權力對寫太慢的記者叫囂，以前我服務的報社，還曾看過一家人都靠排鉛字維生。


    九〇年代開始，報社要求記者用電腦打字寫稿，當時還是有記者抗拒電腦打字，甚至有堅決不學的「大記者」。後來所有記者和編輯部都會用電腦排版，鉛字排版工人當然就不必存在了，排多快都沒用，那一整個家族都失業了。


    隨著AI愈來愈成熟，被取代的工作會愈來愈多。只要是高度標準化工作，可以重複的工作被AI取代的機率就愈高。


    其實需求並沒有消失，只是換了地方，就像電台主持人。但是自媒體的Podcast興起了，只要你的聲音受歡迎、談話有內容或有趣，仍然會找到發揮才能的空間。


    而且這些自媒體與傳統媒體相比，比較不被政策'
  merge: -1
  img_proc: true
- pgno: 323
  md: '限制，獲利模式也更多元化了。只要符合平台規則，獲利空間更有彈性。自媒體發展蓬勃，傳統主流媒體已經變成觸了礁的鐵達尼號，雖然一時沉不下去，但也不會再度輝煌的浮出海面航行。老兵不死，但一定慢慢凋零。


    同樣的，派報生的需求也將愈來愈少，因為實體報社紛紛倒閉，現在每個企業都發展新媒體，投放廣告更有效率。


    傳統媒體輸給的不是同業，而是新科技。所有的平台轉型就跟歷史上的革命一樣，都是被外部革命推翻，成為時代的眼淚。很難從內部改革而進化。


    # 工作會消失，但能力不會


    沒有功用，就領不到錢。很簡單的道理，未來可能不會再有「可以混到退休」的工作。雖然舊的產業、企業或職位會被淘汰，但是有一種東西不會，那就是能力。'
  merge: -1
  img_proc: true
- pgno: 324
  md: '不管你做的是全職工作還是兼職工作，有某種與眾不同的能力很重要。你在工作過程不能只累積薪水，累積單一技能，你還要培養多元的技術，不時得注意、學習新技能。


    請不要只是為了錢而工作，請用學習來提升自己，不要急著增加蠅頭小利，要擁有與時俱進的能力。


    所有問題都是預防勝於治療，當你看到自己的工作正在消失才做調整，都已經有點晚了。請保持成長心態，當時代轉變，不要抗拒改變。如果你真心喜歡這個行業，那就好好磨練經驗鍛鍊創意，培養多元能力，就算你自認沒專長，若能夠讓顧客感覺遇到你真溫暖，你也會變成戰勝
    AI 的人！'
  merge: -1
  img_proc: true
