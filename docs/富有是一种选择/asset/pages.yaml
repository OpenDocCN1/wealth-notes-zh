- pgno: 295
  md: '# 真的不必急著搶貨


    「長鞭效應」在新冠疫情發生後層出不窮：公司或學校因應疫情開始採取遠端辦公與教學，筆記型電腦的需求大幅增加，讓因物流受阻的半導體供應鏈更為緊繃。你可能暫時買不到，但如果手上還有可用的，不必急著囤貨。


    若不是原物料真的短缺了，時間會解決很多問題。如果你理解長鞭效應，就要先判斷這是真的需求提高，還是短期的供應鏈失衡引發的搶購潮？


    所以，訂單爆滿就是好事嗎？當你看到一個產業需求暢旺，訂單能見度已經看到未來幾年這樣的新聞時，別急著去買它的股票，記得想想啤酒遊戲和長鞭效應吧！'
