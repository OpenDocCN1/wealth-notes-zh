  md: '心理學家研究說，當身邊的環境將某種負面刻板印象套用一個人身上時，大部分的表現肯定會受到負面影響。而且當這個目標難度愈高，負面信號的影響也愈大。


    舉例來說，史丹佛大學心理學者史提爾將一群數學成績優異的白人學生隨機分為兩組，同樣解答 18 題數學題目，他告知其中一組人「亞洲學生在這個測驗成績比較好」的負面信號。結果多次實驗顯示，被賦予負面信號的這一組學生，答對題數比另一組平均少了
