  md: '是不夠活，我還真心夢想自己有天存夠錢，能到國外喝洋墨水。畢竟當時我無視於母親「女人書念太多會嫁不出去」的建議，大學畢業不嫁人還去報考研究所，所以一毛錢支援也沒有。


