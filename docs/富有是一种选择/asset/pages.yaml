  md: '# 好命人生=把自己當資產的人生思考


    每一位理財專家也都會承認：最好的投資永遠是你自己，尤其是你還年輕的時候。你的時間，你的精力，都該用在「讓自己更好」這個目標上。


    愛因斯坦曾經說過一句話，他說：每個人都是天才，但是如果你用爬樹的能力來衡量一隻魚，牠會一輩子覺得自己是笨蛋。用錯地方，投錯人生機會成本，就是把自己當耗材了。可惜很多人把自己活成耗材，讓自己的時間與精力不斷消耗。


    要怎麼把自己當資產，而不是耗材呢？


    **❶ 強化你的強項，淡化弱項。**


    如果你是魚，那就好好鍛鍊游泳技術，不要勉強自己當一隻爬樹的魚。


    考你一題，請快速搶答：假設現在你要參加大學聯考，只考三科，你的國文程度 90 分，你的英文 50 分、你的數學 10 分，你剩下半個月的時間只能專注'
  merge: -1
  img_proc: true
- pgno: 82
  md: '在一個科目，那請問你要加強哪一科？


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_82_0.png)


    大多數的人都不自覺地說：「加強數學。」


    這是不對的！你以為從 10 分到 100 分還有 90 分的進步空間，要成長似乎比較容易。不過，如果你學了多年還只有 10 分，那你可能就是那隻「不會爬樹的魚」，再加強恐怕也沒用；而國文你也已經
    90 分了，和 100 分只差 10 分，你的成長空間有限。正確答案是「加強英文」，50 分的你應該還有救，也還有空間可以加油。'
