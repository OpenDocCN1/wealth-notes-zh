  md: '據大數據分析，人們認為「投資很難」、「不敢投資」的原因，有以下這十種：前五名分別是「不知道要投資什麼」、「投資本金需求太高」、「不懂何時該進出」、「擔心股票風險過高」、「經濟壓力大沒閒錢」……等。


    # 圖一 臺灣人「投資好難」網路十大熱門原因


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_266_0.png)


