- pgno: 15
  md: '你人生中最寶貴的時間，應該送給自己所愛的人，做自己喜欢的事，而不是：因為自己的理財錯誤決策，為錢憂慮（憂慮也沒用），或明明有錢，卻又要為錢憂慮。


    如果看到這裡，你其實已經做到了，那麼真的不需要看下去，我覺得你已經是前百分之十的人中龍鳳，你一定已經明白了如何活得快樂的道理。


    * * *


    年輕的時候，我曾經否認過，我們生活得快不快樂和金錢有關。當時我太相信一簞食、一瓢飲，就可以自得其樂的道理。在經過現實的種種折騰後，我也同意：「如果是錢能夠解決的事情，那就算是件簡單的事情」。


    的確，不知道明天三餐在哪裡也是可以快樂的，如果你還很年輕，但當你身上扛的擔子不只你一人時，你就不得不煩憂。


    錢可以解決的事情就是簡單的事情，絕對不意謂'
  merge: -1
  img_proc: true
- pgno: 16
  md: '著錢可以解決所有的事情，只是要告訴你，你不必把所有的經濟重擔都扛在身上，還要自己一個人操勞大小事。你可以選擇你最想做的事，其他交給社會分工解決。也就是「有些錢讓給別人賺」，每個人各適其所，才能享受比較悠閒的生活。


    不管你是不是文青或憤青，或是已經開始擔憂可能不被未來社會接受的中年人，我虔誠希望我能夠寫下我所知的投資和資產的基本觀念，避免你踏入顯而易見的理財陷阱。現在的詐騙集團太多了，有的還不是故意的，比如那些想吸引你和他一樣把錢交出去給陌生人以得到高報酬的好心親友。請自己處理自己的錢，放在自己名下，不要因「一時興起」來揮灑它。


    * * *


    放心，你不是唯一面對金錢糊塗過的人，我也是。就因為我曾經篤信有氣質的女生不要太在意錢（到底誰教我的？）。如果你想要得到慰藉，在這本書中，我也認真的寫下我自己的理財黑歷史，說真的'
  merge: -1
  img_proc: true
- pgno: 17
  md: '還滿像人生的悔過書。


    我還寫了一些我認為對我最有用的商業知識。就算你不做生意，也要懂得别人是怎麼做生意，至少你不會誤中詭計，花掉本來可以讓你高枕無憂的畢生積蓄。


    巴菲特說得對，不懂的別碰。在我看來，生意更是如此，不懂的別碰。


    這讓我想到前不久，有一位昔日相當熱的明星打電話給我，說她想要做一筆生意。她覺得很好玩，要我投資陪她玩一玩，做個品牌。還說這生意毛利很高，高得嚇死人。


    我問了幾問題


    +   - 這個東西，世界上只有你和少數人有嗎？還是誰都可以進口，找代工廠去做？


    +   - 妳真的很喜歡嗎？


    +   - 妳很懂這項產品嗎？


    +   - 妳能付出一段長時間的承諾嗎？（在我看來，品牌如婚約，沒那麼簡單可以說做就做，說散就散）'
