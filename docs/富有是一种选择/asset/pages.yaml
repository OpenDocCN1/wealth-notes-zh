  md: '刀流」這個詞源自於日語，本來是指雙手持刀發動攻擊的武士劍法。是指在一些「團體戰」的比賽（譬如，棒球比賽），進攻和防守都很出色的球員。棒球比賽中，同時擅長投球與擊球的球員也被泛稱為二刀流。那一年他在投手丘拿下
    9 勝 2 敗，防禦率不到 4；在打擊區更轟出 46 支全壘打，差一點就拿下全壘打王。


    但在這個球季以前，大谷翔平因為堅持他會投、也會打，曾經遭到球界專業的嘲笑。認為這在職業賽場根本行不通，他應該務實點，專注鍛鍊投手或打者其中一個身份就好。甚至因為日本投手在大聯盟過往成績普遍低於預期，評論員也把這種刻板印象套在大谷翔平身上。


