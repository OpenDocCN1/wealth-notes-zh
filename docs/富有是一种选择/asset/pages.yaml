  md: '的重點不是數字，而是「先存錢再消費」這樣的習慣。


    # 做你自己喜歡的工作


    每個人的興趣不同。但是，只要一個人做自己喜歡做的事情，不管再忙都會覺得充實。因為你不是為了滿足別人的期望，而是自己人生的目標。但很多人對自己沒有期許，只會迎合別人的期待。這樣的人一樣很忙，但只是忙著為別人創造價值，自己並沒有成就感。


    比如：爸媽希望我考上公務員，因為有退休金。問題在於：你真能樂在工作中嗎？說真的，我的確有當三十年公務員的同學，但並非一直樂在其中。如果你能樂在其中，就能得到成就感，那就是一個「你喜歡的工作」。做一個會使你眼睛發亮、不計較工時的工作，才是人生樂事。


    # 培養消除負面情緒的能力


    很多事情會激怒我們，網路酸民的一句話，或是開車時後方莫名而來的巨大喇叭聲，都會很有效的創造負面情緒。即便絕大多數讓我們不高興的偶發事'
  merge: -1
  img_proc: true
- pgno: 47
  md: '件帶來的影響不大，但如果不放開這些情緒的糾纏，它就會成為你人生的沉沒成本。如果再不斷地累積這些沉沒成本，就會把自己變成一臺「昨日垃圾處理機」，那麼你還有能量去追求目標嗎？


    # ❽ 如果你賠得起，就勇於冒險


    如果有人告訴你，有一條可以不冒任何財務風險就能致富的路，那100%是詐騙集團。風險無所不在，就算你買的是ETF或是護國神山像台積電，都沒有人可以保證你一定獲利。老話一句：「投資一定有風險」。然而，也不要在毫無知識的狀態下去冒險，沒有降落傘，跳下懸崖只會粉身碎骨，冒險前必須計
    算：你賠得起嗎？不少人在年輕時勇於創業，正因：「反正本來也一無所有。」這是個好理由，如果你非 得確定無風險才願意行動，那你會錯過很多的機會。


    # ❾ 習慣超越自己


    很多人都因為比較心態而苦，不自主地會與他人比較。其實不必找那些假想敵。為什麼你不跟自己比較呢？計較自己有沒有比昨天多成長一些，要比你忙'
  merge: -1
  img_proc: true
- pgno: 48
  md: '著去打聽同學的薪水行情還有朋友住什麼房、開什麼車？對自己的致富體質更有幫助。


