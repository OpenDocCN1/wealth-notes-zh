  md: '求有再求好的好處是什麼？如果先有了小窩，至少表示你不會被房東加房租、被趕走。這種有隱私權的安心感，是你很難在租屋中取得，而隱私權和獨立感則很難在原生家庭中取得的。


    還有房子的確能帶來財務的安心感。因為有房子的人很清楚，就算是最壞的狀態，還可以賣掉房子。賣掉之後清償貸款還有機會能留下一筆現金。再者，銀行也比較願意借錢給有房的人。退而求其次，就算拿房子去設定二胎貸款，利息也比個人消費型信用貸款低。簡而言之，有了房，你在財務上已經進可攻，退可守，在金錢上也比較不會狗急跳牆，這種財務穩定帶來的安心感是很重要的。


    不知道你有沒有發現，許多財務決策錯誤背後，就是一個字：「急」。


    急著想要有收入去支付房租和生活費，所以做兼差，甘願讓有限體力成為耗材。急著靠投資賺錢，就用融資操作高槓桿，怕被斷頭，又急去借高利貸，這些都是不當決策。再強調一次，個人財務規劃裡，'
