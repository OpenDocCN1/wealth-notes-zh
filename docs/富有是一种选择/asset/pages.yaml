- pgno: 30
  md: '你必須發展一個最適合的決策模式，而不是堅持唯一解方。保持改變的彈性，這是讓你一直往前走的方法，對生意、對人都是。


    這些思維轉變，也是我們跟參與 Podcast《人生實用商學院》的「商人」們，希望帶給聽眾與讀者的啟發。概念很簡單，很白話，沒有複雜的數學公式或模型，更多的是做實事的人與方法。藉由接觸商學院的思維，我相信你會更了解世界背後的運作脈絡，並且面對問題、處理問題。


