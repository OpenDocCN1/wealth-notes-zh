  md: '兩者都有可能。


    我們講的就是升息這道雷，到底有什麼影響？


    在這裡，主要針對已經買下自住房的人來聊聊，你要有什麼樣的避雷針？


    首先升息影響有多大？具體來說，臺灣只要升息1%，也就是四碼，一個手上有1,200萬房貸的人，每個月會增加約一萬元的支出！對於購買「過高房價」的朋友，這肯定是個大負擔！


    圖一 央行大印鈔票，推升通膨，接著進入升息循環，收回市場通貨。而升息最直接的影響，就是有借貸的族群，會面臨利率調高的挑戰


