  md: '房價真的是因為通膨因素而上漲的。但是無論如何，你被騙的機率比較低。


    臺灣有一些上市仲介公司，也有販賣海外房地產。雖然知情的人都明白，如果在房價漲這麼高的時期銷售不完，還要賣海外物件，通常裡面還是有一些「眉角」。而代为銷售的仲介公司利潤也不少。不過，無論如何，跟他們買你比較不會遇到詐騙吧？至少保證你還會擁有所有權。如果你真的要買，還是要透過知名度的仲介比較好。


    # 第二，選擇比較不會失寵的物件


    以我的投資經驗來看，2012 年代表公司到日本投資，我們也曾經跟當地的公司合資當建商，我才知道現在日本蓋房子真的沒那麼好賺。我們搞了二年，前前後後加起來大概只能賺
    15%，還有相當高的營業成本、行銷成本要支出，獲利沒有大家想像那麼多。當年如果只做租賃，每年報酬毛利率還有 7 到 9%，'
  merge: -1
  img_proc: true
