  md: '書，很想登上排行榜。但是登上排行榜後，又很怕會摔下來，因為只要一掉下來，出版社就會說你過氣了。許多年不斷被排名考驗，我明白：這個星期的成功，從悲觀的角度來描述，其實只是還沒失敗，或晚一點失敗而已。如果你把排行榜當成最重要的競爭，那麼你很容易變成歷史上的那些不擇手段也要把厲害的人踢下來、整死的「小人」，不過是基於一種嫉妒的比較心理罷了。


