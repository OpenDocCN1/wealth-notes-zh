  md: '# ### 14.


    # # 打造希望感，累積心靈財富


    雖然理財很重要，但請你不要把理財變成人生唯一的重心。有些人捨本逐末，對於理財過於積極主動、過度關心，其它任務反而「二二六六」、敷衍了事，忘記了人生目。。理財是為了讓人活得更好，但是人生目標絕對不是有錢就好。


    總覺得自己的挫折是源自「沒錢」的人，可能意謂著你的窮是從「想法」開始的。你應該問問自己，你是因為沒有錢，所以無法積極追求生活？還是因為沒目標、缺乏熱情，也不積極行動，所以無法致富？


    透過正向心理學與「希望感」，足以活出心花怒放的人生，那麼你的理財才有意義。了解理財不是目的，只是手段而已，才會讓你的理財充滿意義。


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_243_0.png)


