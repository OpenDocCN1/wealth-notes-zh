    # 鍛金筆記


    如何應付你的委屈？


    假設你在森林中漫步，忽然被一支毒箭射中，你會有什麼反應？


    無非兩種：一種是非常憤怒，發誓要把壞人抓住。


    另一種是，把箭拔出來，逃出森林，努力自救。


    正確的答案不用說你應該早就明白。


