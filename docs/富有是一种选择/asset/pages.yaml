  md: '至於什麼是對婚姻的貢獻與協力？在 2020 年民法第 1030-1 條修法後，給出了比較明確的參考指標：①家務勞動②對子女的教養照顧③對家庭的付出④同居與分居的時間長短⑤婚後財產取得時間⑥雙方經濟能力。根據這些項目的比較，可由法官自由心證來衡量財產分配的比例。


