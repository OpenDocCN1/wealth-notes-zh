  md: '# **低利率時代不再**


    我個人覺得我們的升息並不可能太猛烈，可是多 1% 是絕對有可能的，那種 1.3% 的時代早就過去了……很可能會發生長期通膨，某些國家還繼續在印鈔票的狀況下不太可能再回來。


    歷史告訴我們：央行升息期間（重貼現率與利率正相關），房價指數從未下跌過。所謂「重貼現率」，是指銀行以合格票據為擔保品，向央行融通短期資金所用的利率，是各國央行控制通貨的手段之一，因此與利率正相關


