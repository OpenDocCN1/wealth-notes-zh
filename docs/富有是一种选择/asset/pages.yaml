- pgno: 161
  md: '公設好，請朋友來參觀超氣派。但有些公設可能變得勞民傷財又讓你生氣。除非你熱愛游泳，否則游泳池最好蓋在運動中心或朋友家就好，不要放在自己家。管理一個游泳池很貴，成本很高，難怪臺灣游泳池被選為嫌惡公設。當然我們也不能一竿子打翻一船人，我看到許多豪宅的泳池都管理得很好。一切都有「對價」的代價。


    # 裝潢


    前已提及，新成屋裝潢費會省下很多，如果你不挑剔。我以前曾購買新成屋，只要買高雅的傢俱，把牆壁漆一漆就很漂亮了。中古屋只要超過二十年，電路通常要全換，漏水或滲水問題很難根治，過個幾年就會故態復萌。


    綜合來說，新成屋每個單位的房價較高，但是扣除掉個人風格的「客製化」之外，不太需要額外裝潢。而中古屋雖然公設比低，每坪房價也低得多，但'
