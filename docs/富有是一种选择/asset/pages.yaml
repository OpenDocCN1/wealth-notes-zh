  md: '產，只要妳用過，它不會增值，我的貴婦朋友很堅持她的愛馬仕柏金包是資產，直到她在某二手店看到和她一樣的包，只是略略被使用了，價格剩下原價三分之二。只能說它仍有價格，仍有「殘值」，實在無法說它是可以增值的資產。拍賣會上的高價柏金包，是由商家或名人提供，可不是來自於一般消費者。


    很多看起來很有價值、有用的商品，其實都是耗材。例如智慧型手機，只要蘋果推出新手機，就會掀起一波「開箱」風，為了搶到手機不惜花時間排隊，或是動用人脈關係，大家似乎樂此不疲。但是在我看來，手機功能再強、風格再時尚、再能幫你做生意，都是耗材。「耗材」不是在罵它沒用，而是在東西本身是否能夠保值加增值。生活中需要定義的耗材很多，但只要你明白它是耗材，就不會步入「我明明很有錢，為什麼後來會一窮二白？」的疑惑。


    想要當有錢人，就要盡量去存資產，這些資產可能會帶來「被動收入」：就算在你睡覺或是工作時，也會自動為你賺錢（比如出租房）或省錢（比如自住'
