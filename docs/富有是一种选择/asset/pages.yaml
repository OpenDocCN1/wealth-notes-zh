- pgno: 349
  md: '比特幣跟股市一樣是狗，還是一隻更激動的狗！人走一公里，股市因為來回跑動多走了 4 公里，比特幣可能會到 40 公里！


    # 比特幣的非投資價值：去中心化、低交易成本


    比特幣的確有優點，前文提及在俄烏戰爭的時候，不少烏克蘭人利用它換到了國外的生活經費。就是因為比特幣最大的特點在於其交易成本低、高速度和完全自由的交易形式，它是徹底全球化的貨幣，去中心化，不會受到各國政府的外匯管制。


    但你千萬不要忘了密碼，也不會有人運用政治權力來凍結你的資產。


    是的，它的確可以洗錢！


    當然它現在還沒有真的很吃得開，只有薩爾瓦多把它列為法定貨幣，也只有泰國和日本有少數店家接受比特幣的付款。而大多數政府央行和傳統銀行體系'
  merge: -1
  img_proc: true
- pgno: 350
  md: '非常不樂見它的存在。愈愛管理人民的家 愈討厭比特幣，因為它傷害了外匯管制的可能，會成為漏網之魚。因此目前要使用比特幣在大部分的商業市場消費，還非常困難。


    無論如何，任何一種新的東西，都是好壞參半。


    不管你選擇哪一種投資，用長線投資分散交易風險，永遠不要讓自己的雞蛋都在同一個籃子裡破掉，是投資者應該做的事情。


    對過去，充滿敬意；對未來，充滿好奇，就算是我對自己的期許！'
