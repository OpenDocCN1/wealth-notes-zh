  md: "# 缺乏自我效能必成魯蛇？\n\n如何面對壓力同時保持冷靜決策，正是我們在人生中和投資與理財時經常面對的挑戰。事實上理財的原則並不難，最大的挑戰在於投資人對於堅守紀律的決心。\n\
    \n行為經濟學中有一個名詞叫「處分效應」（Disposition Effect），也就是當股票上漲時，投資人傾向於賣掉變現趕快獲利了結，但股票下跌時反而選擇持有，堅決反轉機會。這與人類「不甘損失」的天性有關。如此一來，會造成手上賺錢資產過早變現，被套牢在虧損資產上的時間過長。\n\
    \n人性的確具有「損失趨避」的特性，害怕損失的「痛感」會比獲得的「喜悅」要來得高——甚至有研究發現，會高出兩倍以上。如果賺 100 元的喜悅是 +1，虧 100\
    \ 元的痛感至少是 -2！ \n\n具體來說，市場向上時，投資人很有可能會售出表現優異的股票或房產，確保入袋為安，但當市場向\n\n![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_261_0.png)"
  merge: -1
  img_proc: true
- pgno: 262
  md: '下時，續抱已經虧損的股票。繼續持有那些沒有反彈能力的股票或資產，天真以為放久了能解套回本，常常讓自己損失更多。


    這也是為什麼理財需要自我堅持：如果投資人缺乏自我效能感，更有可能引發處分效應。本來應該進行長線投資，卻因為恐懼眼前的不確定性，轉而選擇較「符合大眾」的決策。


    當然，我們不必然要像馬斯克一樣，以改變世界為人生偉大目標；但當你真的想達到目標，讓目標從「想像」昇華為實際可行的「計畫」，並且堅定不移的行動，恰恰是本書宗旨「富有是一種能力，堅持是一種選擇」的真正意涵。'
