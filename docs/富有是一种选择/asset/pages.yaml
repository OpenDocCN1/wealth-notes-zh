  md: '主只賣1,800萬元，但購買的實價登錄竟然是2,400萬元。


    我一看就大概明白了，某仲介店長覺得當年原屋主急於脫手，因此價格偏低，所以就貸款將它買下來。可能因為原屋主缺錢，於是兩個人做了某種協議，賣價是1,800萬元，而實價登錄是2,400萬元，貸款是2,000萬！這樣一來，這位聰明的仲介公司店長，不但擁有了一間房子，而且還扎扎实多拿到200萬元現金！


