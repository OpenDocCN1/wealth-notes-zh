  md: '用，大概用 30 萬元計算。沒有把稅金計算下去的狀況之下，獲利是臺幣 500 萬。


    因為一個天外飛來的都更，這位糊裡糊塗的執行董事算起來，還幫公司賺了一筆錢，不過她做過的錯誤決策也不算太少，感謝其他董事體諒。


    # 買房子等都更，合理嗎？


    看完這個令人興奮的故事之後，讓我們回到臺灣冷靜一下。回到我們一開始的問題，我買的房子會都更嗎？什麼樣的房子會有比較高的機率獲得重生的機會呢？


    首先，從制度面來看，你要老屋可以重建，至少要符合都更或是危老的門檻（參照「簡易都更&危老比較表」）。這些在相關單位網站也都查詢得到，老話一句，百分之百了解的同學你的頭腦精密到足以考上律師。


    第二，都更、重建通常是房仲說服你買下老屋的'
  merge: -1
  img_proc: true
- pgno: 194
  md: '話術，但是真正決定都更與否的，既不是房仲，也不是這棟房子，而是擁有這棟大樓的所有權人們。一樓有店面的老屋，依都更建商經驗，在達成共識上會較為困難。另外，這個區域建物性質是否類似也很關鍵。改建是用土地的持分去計算改建後的分配，原本建物的樓層愈高，住戶平均土地持分愈少。


    很多住戶同意都更是因為他們認為是 1 坪換 1 坪，其實並不是這樣。老舊大廈的住戶常常會發現，改建之後換回的坪數小於他原來所住的坪數，也很可能會變成原本的
    3 房縮水成為 2 房、2 廳變成 1 廳，必然會引發老人家對改建產生抗拒心理。


    還有，再次強調，沒有人會免費幫忙你把舊房子變成新房子。對建商來說，在合建的狀況下，他們沒有收取服務費（所以建商口袋要很深，倒掉的也不少喔），如果沒能在成本和利潤上做好管控（這在萬物飛漲的通膨時代和後疫情時代實在很困難，因為建材和工資都上漲），這可能長達十年以上的辛苦努力，很最後變成為誰辛苦為誰忙？還害得自己破產。'
