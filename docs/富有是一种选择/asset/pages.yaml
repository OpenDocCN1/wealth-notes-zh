- pgno: 20
  md: '也可能有所轉變，你預估的財富自由的額度，恐怕也要不斷地向上提高。


    先不管額度，至少你要開始。不管什麼年紀，有開始比沒開始好。不會理財，一生沒有依靠。理財並不是為了準備退休，而是為了培養活在現代社會的自信。畢竟這個世界任何東西都是透過「交換」而來的，愈早懂得愈好。和金錢社會建立一種和諧關係，又不要被金錢所統治，那麼誰都要學會很基本的理財課和商業課。


    * * *


    請讓我再度強調：我也曾經什麼都不想搞懂，反而被自己的不想懂搞得很辛苦；也曾經自以為聰明，然後「機關算盡太聰明」，搞了很多年發現自己其實什麼也沒有累積。


    到頭來我發現：


    理財，就像蓋房子一樣，把地基打好最重要。


    理財很簡單，而且愈簡單愈不刺激才是對的。任'
