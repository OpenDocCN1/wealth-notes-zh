- pgno: 162
  md: '是在裝潢過程需要投下比較多的時間，更多的錢，後續不確定性的變動成本也的確比較高。


    中古屋的裝潢費多少才合理？我希望不要無限上綱，房價的 2 成應該是天花板，這才是理性理財吧。


    # 👤 貸款


    如果信用沒有太大的問題，中古屋的貸款條件大概貸到總價的 6 到 7 成，也就是自備款至少 3 成。若是首購的話，因為貸款銀行對房子的估值往往低於你的買價，與新成屋相比會多出
    2 成，如果是 1,000 萬元的房子那就是 400 萬元。對於頭期款是只靠自己努力存來的首購族來說，並不是輕鬆的負擔。臺灣家庭平均薪資約 5 到 6 萬元，每多
    100 萬元就等於一家人不吃不喝二十個月，想來實在傷神。


    舉例來說，買 1,000 萬元的房子，房貸利率 1.6% 來計算，如果是貸款 8 成（我申請只還利息不還本金的「本金到期一次還款」），之後每個月利息還款約'
