  md: '# 通膨時代，堅持理財才能擺脫不安全感


    但是還是要提醒，聰明舉債跟大開槓桿是完全不同的。每個時代有每個時代的投資方法，以前通膨會想到要買黃金，事實上你可以把它歸列到「舊時代」思維裡去，別讓「買黃金才能在逃難時保值」的念頭復辟。事實上在「逃難概念」中，人們只是在尋找一個「可以避開國幣消失或貶值災難」的東西。


    看看俄羅斯與烏克蘭之戰吧！人們帶得出來的不是美金，而是比特幣。烏克蘭人在意識到戰爭已經發生時擠在 ATM 前提領現鈔，能不能提領到已經很不確定。你可以看見在禁止適齡男子出國前，烏克蘭年輕人帶著
    USB 倉皇出走，身上 1 塊錢也沒有，只帶著 1 個 USB，但短時間他卻可以有錢活下來，因為 USB 裡有他存下來的比特幣。當然，他不能忘了它那串獨特的密碼。當一個國家的貨幣或金融體系因為戰爭而岌岌可危，通常領取現金已經來不及，但只要有網路和手機，加密貨幣在很多國家都能夠透過
