  md: '的設備超過 2.5 坪）。


    都怪我在施工期間，工作實在很忙。很狀況外地說：「沒關係你決定就好，我相信你的專業！」其實我真的很不愛養魚，可是那些魚的孑子孫孫還真活得好好的（應該說我顧得好好的，每年大概要花
