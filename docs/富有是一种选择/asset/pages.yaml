  md: '屋，那這些漲漲跌跌就是紙上的數字，請你不要為這個憂心。唉！基本上只要通膨加劇，房價還真的不太可能一路往下跌。臺灣的房價的確有隱憂，但其實是少子化問題；不過這是長期的趨勢，並不會在短期馬上發生！


    # ## 3 貸款比例不宜大於收入三分之一


    還沒有買自住房的朋友，拜託未來貸款不要超過你年收入的三分之一，當然一個人要有自住房，這很重要，但請先求有再求好，只要不要買到鳥不生蛋的地方，或者渡假風景區（上班不能花太多時間，否則機會成本太高），舊一點沒關係！


    # ## 4 租屋族請做好租金上漲的準備


    這點是給租屋族的。如果升息繼續下去，利率只要多加 1%，房東平均會把房租調漲一成。並不是說你非買房子不可，這件事情絕對要量力而為，房價會大跌嗎？短期很難，長期也不會跌到所有的人都有錢住在蒂寶！但這件事情恰恰提醒租屋族：如果你的收入並沒有跟著成長，你可支配收入會愈來愈少！'
