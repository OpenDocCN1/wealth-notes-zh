    這些都是過程，重點是在課堂上你能不能端出成果。上了四天的財務管理，那些念清華、北大、史丹佛跟麻省理工學院的同學，看財務報表像在吃巧克力，建立財務模型簡直不費吹灰之力，說不定比老師還厲害；相比之下，我還真是吊車尾的，只能抱著課本，苦苦向同學求救！雖然當時很多課程，我都念第
    2 次了。


    雖然人脈不是主要目的，不過在商學院，我確實認識一些做事比較腳踏實地的人。商人最重視策略、規劃、行動與成果。美國最有名的國防部長，經歷過越戰與古巴危機的麥克納馬拉，就是個商人，還當過福特汽車的總裁。他們不只是把會計、經濟、行銷學'
