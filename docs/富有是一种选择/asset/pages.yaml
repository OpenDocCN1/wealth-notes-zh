    萬元的前屋主購買原價還賣不出去？疫情之後，臺北的房子也漲了一大波了，為什麼？肯定不是白雪公主在等白馬王子來親吻她。由於我對這個地區比較熟悉，跟附近的鄰長也認識，我查出了兩件事情：


    +   多年前他的隔壁鄰居，曾經發生某個不太吉利的案件，一位租屋的黑道大哥在此「自我結業」。（這件事情，除非你可以查到記者報導，否則你到警察局去問，依照規定員警可不能告訴你）也就是說，這意謂著可以更努力殺價。


    +   鄰長還真厲害，竟然明明白白地知道這個房子是某個仲介的店長跟原來的屋主買的。而且原屋'
