  md: '# # 08.

    ## 培養對價格的

    ## 敏感度


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_170_0.png)


    如果你真的有「夢想要住的地方」，那麼請別等到你有錢買房，現在就開始，持續關注你夢想屋的房價。目標明確，才知道自己要存多少錢？離目標距離有多遠？


    很多人會按照老方法，向當地人打聽房價，我並不贊成，這恐怕很難有客觀的答案。


    「這附近 1 坪 60 萬元到底貴不貴？」如果你這樣問住在當地很久的人，一定會告訴你「很貴」，因為他會記得 三十年前他是 20 萬元買的呀。但如果是剛搬過來的新大樓住戶，聽到這個價格可能會告訴你「很便宜」，他也只能用自己的買價衡量。


    每個人的主觀感受和經驗值不一樣。不管是投資'
  merge: -1
  img_proc: true
- pgno: 171
  md: '或是理財，最重要的就是客觀數據，不要憑著直覺，也不要只打聽路人甲乙丙的建議就做決策。看數據，保持對房價的關心才是正確的方法。


    而在這過程中，最能夠幫助你的，就是那些過去的交易的紀錄。


    拜資料所賜，「查真正價格」比以前簡單多了，不需要什麼貴賓服務或高端技術，政府提供的實價登錄網站是很好用的工具。另外像是好房網、樂屋網這樣的房價資訊網站，也都鉅細靡遺，可以去研究它的實價登錄。


    從 2012 年首次推出實價登錄之後房價透明了些（當然也有做假的，我也曾「抓到」過，請看本章後記），實價登錄 2.0 在 2021 年的 7 月 1 日上路，變革有更清楚的資料呈現，簡單來說有兩點：


    # **變革①：門牌、地號完整揭露**


    以前就算有實價登錄，實際位置還是要用「猜」的，因為之前物件座落的門牌或地號，是以每 30 號'
  merge: -1
  img_proc: true
- pgno: 172
  md: '做一個區間來呈現。


    用猜的不準，因為有很多地方，30號內的房價差距很大，比如帝寶和它附近的老公寓，地價就有很大的差別。我們只能從坪價來猜，這筆「大概」是哪個建案。


    # ### 變革②：預售屋銷售資訊及時申報


    搶買房子，但是只想快速賺取價差，並不想擁有，在香港叫做樓花，在臺灣叫做紅單。以前在房屋速漲期，確實很多人靠紅單賺錢，也就是房子開賣時去搶買，等到房價漲了再轉手賣出紅單。之前有不少投資客靠這個賺了不少錢，這種操作方式，就是不打算賺房子最大的漲幅，而是在短時間搶賺價差。有漲就出手。而在實價登錄2.0之後，已經禁止紅單交易了。


    這次變革對預售屋的影響，則是解決時間差的問題。過去你很難看出預售屋的行情，因為舊制規定的申報時限，是代銷案結束的三十天之內。現在則要求在買賣簽約的三十天內就要完成申報。'
  merge: -1
  img_proc: true
- pgno: 173
  md: '聽起來好像差不多？不，差很多！關鍵點在代銷案什麼時候才能結束？從第一間賣到最後一間，可能五年才結束喔。多數預售屋仲介和建商為了自己的利益，當然會在結案後才整批申報，不然買家比來比去，還來爭論，實在很麻煩。現在，已經不能這麼做了。


    # 有些「貓膩」只有碰到才知道


    也許某些實價登錄資訊還藏著貓膩，但無論如何，實價登錄 2.0 上路後，房價是愈來愈透明，同一個社區在同時期的價格，也會漸趨一致。


    在這裡也要向各位分享一個經驗談，如果你真的遇到同樣一個建案，但是兩邊價差很大時，該怎麼選？


    如果是高價豪宅，當然要選景色最好的；但如果是中等住宅投資物件，你乾脆買便宜的。這是我在香港的經驗。當時我代表公司購置一間香港房，那時我很堅持選看海高樓層，價格貴了許多（比低樓層價格


    172 人生實用商學院：富有是一種選擇'
  merge: -1
  img_proc: true
- pgno: 174
  md: '多出 2 成）。過了幾年，仔細去查香港實價登錄才發現，同一建案的樓層，隨著時間價格會漸漸趨於一致。我買 55 樓 1 坪約 80 萬臺幣，而我没選的
    6 樓只要 60 萬臺幣，過了五年，這兩樓層的房子賣出時，80 : 60 變成了 120 : 110，誰賺得多，你應該可以一目了然。


    有趣的是那五年間我只在那房子裡看了兩次海：買它的時候和賣它的時候。看海的代價還真的挺貴的。


    為什麼有人說實價登錄沒用？那是因為他們誤以為，可以用實價登錄的「均價」買到房子。但均價不是現價，從有實價登錄以來，臺灣房子至少漲了兩大波，臺北與新北等人口密集處漲幅更是令人咋舌，把長期平均的價格，與某個時間點相比，並不恰當。


    但為什麼我說實價登錄有用呢？因為它至少扮演公訂「參考值」的角色。不是要你踩死底線，只要高於實價登錄就不買；重點是要談價格前你須有一把尺，實價登錄就是給你客觀度量的那把尺。讓你不會在迷糊朦朧中就賤價賣屋或溢價買屋。'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# 實價登錄有盲點：注意虛坪藏貓膩


    當然實價登錄網站也有一些美中不足之處，比如說呢？它的預售屋查詢功能已經揭露了建案名稱，但中古屋只能查詢到門牌，沒有辦法告訴你，這個價格對應的是哪一個建案。也就是說，你自己還要請教
    Google 大神，這到底是哪個建案，哪個社區？


    比如你要查帝寶，這系統你確實你要再多花心思搜尋，帝寶實際住址是仁愛路幾號？


    另外，臺灣最著名的「虛坪」也是一個大問題，也就是實價登錄沒有強制填寫車位價格。有些房納入車位坪數，讓價格失真。還有同一棟大樓，有的房子有車位，有的沒有配車位，算出來的坪數、價格就有很大差別。


    舉例來說，一戶房屋含一個車位，產權面積 40 坪、總價 2,000 萬元。如果沒有申報完整車位面積與價格資訊，實價查詢網會直接以 2,000 萬元除以 40
    坪計算，交易單價為每坪 50 萬元。


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_175_0.png)


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_175_1.png)


    人生實用商學院：富有是一種選擇'
  merge: -1
  img_proc: true
- pgno: 176
  md: '問題是房市實際交易時，房屋、車位交易價格是分開算的。正確計算方式應該是先扣除車位面積與價格，再試算單價。以車位 12 坪、200 萬元計算，前面這個案例的總價應先減掉
    200 萬元，等於 1,800 萬元再除以扣除車位面積的坪數 28 坪，得出每坪單價約 64 萬元，這比實價登錄上的 50 萬要高出 14 萬元！


    由於車位價格每坪單價往往比房價低，如果未分開計算，直接將總價除以總坪數，價格就會嚴重失真。


    儘管如此，我認為實價登錄讓價格盡量透明化，對於購屋族是很大的保障，買方賣方得到「不做冤大頭」的機會，反正既然已經有人幫你整理好了，沒事時看一下你家或是租屋處附近的房價，對於找殼或換殼的人而言是很大幫助。'
  merge: -1
  img_proc: true
