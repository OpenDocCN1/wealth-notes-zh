    2.6%，那為了安全起見，還是按月把本金和利息一起還了吧！


    # 家人


    如果你年紀大了些或跟長輩同住，換房的時候可能就會需要考量電梯甚至是無障礙設備。除了電梯，有社區管理員或保全幫忙收外送、趕垃圾車與收包裹信件，這對於年紀比較大的人來說是相當方便的。


    不過「有一好，無兩好」，電梯住宅管理費肯定高，對長輩而言扣除掉追垃圾車這種比較費力的狀況，生活變得太方便也就少了一些考驗。畢竟現代人'
