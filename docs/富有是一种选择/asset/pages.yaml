    # 善用複利效果，讓時間站在你這邊


    雖然我說買自住房不要太重視房價走勢（反正房價並不因你的重視而提高），但不可否認，房地產是仍現在公認抗通膨最有效的工具之一。


    如果你手上有現金，也投資像是 ETF 這種可享受時間成長所帶來利潤的工具，那可能還好；但若持有一筆「買屋基金」，把現金晾在戶頭裡傻傻等待，遲遲不肯拿來買自住房，在這個通膨趨勢愈來愈顯著的時代，那就是眼看著現金貶值卻無所作為。'
