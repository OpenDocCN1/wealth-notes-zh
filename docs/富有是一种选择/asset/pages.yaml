  md: '連日本都可以升息，那就表示全世界的通膨已經到達滿水位！每一個國家，投資的好處與壞處，就像錢幣的兩面，就看你從你自己的角度來看，好壞在哪裡？


    雖然地震確實影響很大，日圓重貶，有長達三年時間很多「投資專家」笑我賺了租金，卻賠了房價跟匯差。短期來看，他們說得對，但我們就是效法德川家康精神：活得長命你就贏！事實證明，地震不管在股市或是房地產，對於這些習慣唱搖籃曲的國家，都是屬於短期的震盪現象。它的確衝擊了日本人民與產業的生計，但是從總體經濟的角度，並沒有動搖國本。


    我當時是在日本貸款借日幣，日幣貶值對我來說反而是債務減輕。此外，既然沒有要賣房子，賣房造成的匯兌損失跟我們就沒有關係。無論如何，長期投資才是王道，不管你投資什麼。'
