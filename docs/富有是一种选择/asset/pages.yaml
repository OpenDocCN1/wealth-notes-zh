  md: '少運動，長輩雖然抱怨爬樓梯麻煩，卻也可能是他們 唯一的運動。多走幾步路，也不是一件壞事。這部分 就要靠你跟家人之間的溝通了。


    我婆婆本來住在公寓四樓，年紀大了以後因為 「深感不便」搬到了一樓。雖然不用再爬樓梯了，但 也缺少了運動機會，肌力因而在一年內銳減；是禍是 禍實在難以論定。


