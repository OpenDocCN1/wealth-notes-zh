- pgno: 334
  md: '名的「8結」蛋捲老闆冼劭蘭，創業第16次才成功！


    事實上那時候她已經債務累累，靠著自己的誠信，用後債養前債，不成功便成仁。她最後靠著「長得不一樣的蛋捲」，成功開創市場，成為非常受歡迎的團購甜點，並且整合上下游，變成烘焙型電商。


    這其實是一個差異化競爭成功的例子。創業上有句名言：「與其更好，不如不同。」同樣是做蛋捲，比別人好吃沒有用，她做成了8字形，減少了糖跟油的比例，吃蛋捲的時候不會把屑屑掉滿地。而且長成8字形的蛋捲，剛好符合了「巴結」長輩的意思，消費者口耳相傳幫她做足口碑。


    # 大家都是在創業之後才學會創業的


    這些創業者絕大部分在創業之前都沒有上過任何創業課程，都是在做中學、學中做。經過了無數次的試探，才找到了痛點，收服了消費者的心。


    雖然現在學校也在教創業，但是我相信絕大多數'
  merge: -1
  img_proc: true
- pgno: 335
  md: '的大學教授自己也沒有創業經驗。在商學院，不論是行銷、管理乃至創業，紙上談兵是一回事，上場殺敵又是另一回事。因為理論終究是從過去經驗歸納而來的「劇本」，而創業者除了要懂得歸納，也要能夠用創意引申，推導出突破市場的方法。


    # 之前的成功對你幫助不大


    一次創業成功，不代表你第2次也一定會成功。音樂才子田定豐的生意生涯可以說明這一點。他很有藝術品味和天份，開唱片公司的時候，發掘了知名的歌手，後來也成功地把公司賣給更大的音樂集團。但是當他進入電商領域之後，發現自己變成叢林裡的小白兔，雖然一樣是做生意，重點卻天差地別。


    他講過一個催生自己品牌麻辣鍋的笑話。田定豐自己是吃素的，又很喜歡吃麻辣鍋，於是決定研發素食的麻辣鍋市場。一般的麻辣鍋通常用的是牛油，牛油並不好消化，他決定要把牛油改成素食。研發了老'
  merge: -1
  img_proc: true
- pgno: 336
  md: '半天，成品做出來時已是五月天！


    冬天是吃麻辣鍋的季節，五月已經相當接近夏季，麻辣鍋賣給誰呢？他說他當時完全沒有想到，原來不只粽子和月餅才有時節的問題。他本人是個藝術家，非常信任同事，本來還維持唱片公司老闆的氣質，怕跟人家殺價，什麼事情都委託同事處理。


    結果，他第一次做出來的麻辣鍋，雖然味道還不錯，可是他拿到的成本價比其它市面上知名品牌市面的售價還貴上不少！賣太貴消費者不願買，賣太便宜又會賠錢。追根究柢，就是因為他搞不清楚利潤結構，也不懂成本會計，真的以為只要有3成利潤就夠！後來這個產品只能自己賣，完全沒有利潤可以分給經銷商。


    從唱片公司總經理到電商負責人，田定豐明白了隔行如隔山，中間必須經過很多次試誤的道路，也明白之前的成功經驗未必對後來有幫助。


    上述這幾位是我提到的第三類型的創業者。不得已創業，但是剛開始因為什麼都不知道，把創業當成'
  merge: -1
  img_proc: true
- pgno: 337
  md: '開碰碰車！還好他們的學習精神都很強，以非常快的速度累積了經驗，也增長了自身的能耐，所以最終能夠成功轉換自己的跑道。


    # 創業靈感就在你身邊


    我也遇過幾位在失業之後選擇創業，終於擁有自己企業的創業者。比如午茶夫人的老闆吳俊德，剛開始也是看別人做什麼賺錢就去跟風，但最後都是賠錢了事。後來因為他的太太喜歡喝奶茶，他開始研發奶茶，竟然開發出來女性喜歡的太妃糖奶茶，而且靠著極高的
    CP 值打進女性上班族的市場。


    他現在每年營業額大概也有 1 億左右。「與其一直在看別人做什麼，到頭來證明了還是討好太太就對了！」他幽默的說。


    為什麼在現在這一行成功，也是經過無數試錯的結果。堅果樂園的老闆張軒奇在離職之後，也不知道該做什麼？本來什麼都賣，到每個公司樓下擺攤，後來'
  merge: -1
  img_proc: true
- pgno: 338
  md: '才發現堅果很受上班族女性的歡迎，又用自己的研究精神讓堅果在不添加任何調味料之下可以烘焙到香脆可口，目前一個小工廠每年營業額也有 4,000 萬元了。


    # 創業就算成功也沒你想像中賺得多


    前面所介紹的營業額，不管幾億，麻煩你千萬不要把它當成淨利，扣除了成本和營業費用，有兩成已經很不錯了！


    我訪問過的還有麗彤生醫董事長張麗綺，旗下有規模浩大的醫美診所以及知名保養品和保健品銷售。她創業的理由不是失業，而是失婚。失婚後還承接了前夫的龐大債務。因緣際會成為購物台的供貨商，靠著自己的努力不懈，花了二十年慢慢發展到上市櫃的規模。別看她一帆風順，如今家財萬貫，而且愈來愈顯得年輕美麗，之前也曾經兩度差點破產。


    本來只有高中畢業的她，為了增加自己的經營知識，還念了兩個 EMBA，她說她是「從在婚戀中痛苦'
  merge: -1
  img_proc: true
- pgno: 339
  md: '的村姑變成女企業家」。沒有退路，所以必須堅強。不然能怎樣？


    在我歸納，從小成績優秀、求學順利的人反而不容易創業，因為：


    第① 他們太容易被大企業或公家單位錄用了，找到高薪的工作，一路做到退休，比較難有創業的意圖。


    第② 如果你從小在學業上表現得太好，通常你的自尊心也很高，個性也可能很硬。創業這件事，自尊心不要那麼強反而好。


    遇到了失敗，你只能面對，檢討問題，收拾殘局。不能怪別人，不能怪時勢，也沒什麼藉口可以找。白手起家的創業者要有英雄性格和擔當。


    的確也有人是天生的生意囝仔，從小就想做生意！上市櫃公司軒郁的老闆楊尚軒，也是一位超級業務悍將。生長在商人之家，對錢很有概念。父親花了'
  merge: -1
  img_proc: true
- pgno: 340
  md: '很多錢送他到加拿大念書，他雖然志不在念書，從高中和大學都比別人早一年畢業。「我一直想要早一點畢業，並不是因為成績優異，是因為我想要早一點出社會做生意！加拿大的學費很貴，如果我能夠早一年畢業，每早畢業一年可以省
    100 萬臺幣，比我去打工賺得還要多，所以我才拚了命把書念得快一點！」雖然能言善道，非常擅長於銷售，但是他也曾經因為過度投資，讓公司陷入自覺無可挽救的赤字！後來是靠著本來在當家庭主婦的太太出手幫忙，砍掉了一些項目，才使公司起死回生。


    # 老闆本人必須是自家公司最佳代言人


    我曾經聽過一句話：如果現在創業的公司老闆不是網紅，不會推銷自己的產品，那麼他在網路時代就很難創業成功！


    自己當網紅的佼佼者不少，提提妍的李昆霖博士就是。他從小很會念書，很順利取得博士學位。不'
  merge: -1
  img_proc: true
- pgno: 341
  md: '過，他的個性不循常規，熱愛冒險，曾經在旅行中睡過車站，錢包被偷身無分文，也沒有怕過。


    他自己也有經營 Podcast，既是自己品牌的最佳代言人，還能夠接其他公司的業配。他說：「人生最重要的是體驗，只要好玩的事情我都會去做！」在生意模式上，他說自己也犯過不少錯誤，犯了好大喜功的毛病！他曾經把法國的某一家保養品買下來，賠了好多錢。


    # 實體和虛擬的完全不一樣


    生意永遠跟你想的不一樣，沒有什麼是一定會獲利的，就算你東算西算，怎麼想都覺得萬無一失。


    實體店面發展線上業務，如果按照舊的思維，成功率不是很高。我看過一些公司，還企圖用十年前的網站在做生意，只要多一點人上線就塞爆斷線了！


    這簡直是拿 PC 時代的恐龍，跟具有現代高科技的復仇者聯盟作戰！而線上店鋪發展實體業務，因為'
  merge: -1
  img_proc: true
- pgno: 342
  md: '商業模式的確不同，成本結構也差很多，思維沒有轉換，失敗率反而更高！


    戀家小鋪的老闆李忠儒，很早就在網絡上賣東西，很喜歡販賣的樂趣，認識了某家紡織工廠，開始自創品牌銷售寢具。身為最早一代的網絡電商，的確享受到了先行者的優勢。在網絡上創業成功的他，累積了一桶金，評估自己在實體店面也會成功，迅速開了幾家連鎖店，本來還打算把臺灣各縣市開得滿滿滿！在短短的幾年內，把之前賺來的幾千萬元都賠回去！


    雖然你打算賣的是同樣的東西，線上和線下是不同的商業模式。現在的創業者，千萬不要認為「我曾經這樣成功，我就會一直成功」。商業世界，沒有人上天下地無所不能。


    我訪問的中小企業創業者，絕大多數都已經是電商，電商業務也都佔了他們營業額的六成以上。這些創業者都具有一個特色：沒架子，願意改變，不怕困難。'
  merge: -1
  img_proc: true
- pgno: 343
  md: '創業是「不入虎穴、焉得虎子」。它的困難所在，正是它的樂趣所在。創業是公平的，沒錢你不一定會失敗，有錢你也不保證華麗的冒險會成功，現在成功不代表你不會失敗，現在失敗不代表你不會成功！你一定要有創意，很勇敢！


    創業家大門一打開，就步入了奇獸飼育師和他的怪獸世界，你絕對不會無聊。


    到目前為止，我也還很喜歡！'
  merge: -1
  img_proc: true
- pgno: 344
  md: '![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_344_0.png)


    # 鍊金筆記


    在做生意上，還有在人生的決策上，當你已經擬定策略的方向，每過一段時間，必須不斷地做「戰略復盤」，這是你保持彈性應變，也是執行過程中不斷生長的重要動作。


    千萬不要膠柱鼓瑟，在不斷「復盤」的過程中，只有誠實地面對自己的問題，才有勇氣去面對浮現出的疑難雜症，走上解決之路，讓自己不斷成長。'
  merge: -1
  img_proc: true
- pgno: 345
  md: '# 23. 我該參與虛擬貨幣投資嗎？


    我有比特幣和以太幣，數量不多。我擁有比特幣的時間不到一年，是在疫情期間才以定期定額投資的，但已經見證過它雲霄飛車似的「奇幻旅程」，從 3 萬美金漲到 6 萬多，又從
    6 萬多跌到 2 萬多！還好我擁有的不多！


    當然，也許不久後它大漲了，我會說：天啊，我怎麼不在跌的時候多買一點？這些都是事後諸葛亮的廢話！


    # 掌握先行者優勢，應過度參與虛擬幣


    2021 年年底，一直很熱愛比特幣的方舟投資管'
  merge: -1
  img_proc: true
- pgno: 346
  md: '理公司的「女股神」伍德充滿雄心壯志表示，比特幣有望在 2026 年達到 56 萬美元。


    她講這句話的時候比特幣差不多是 5 萬多美元，講了之後掉得很兇，可見在這個幣圈生態裡面還真的沒有「喊水會結凍」的人。


    我在寫這本書的時候，比特幣已經更進一步掉到 3 萬元以下。如果確實如伍德所說，2026 年後達到 56 萬美元的話，看起來比特幣還要努力的成長至少 18 倍。看起來不可能嗎？但是過去虛擬貨幣市場的經驗告訴我們，恐怕也沒有誰敢說她一定是錯的，只敢說她非常樂觀！


    所有的虛擬幣，因為沒人真正有調控的力量，都可能坐雲霄飛車。我曾經看過好幾篇對幣圈知名人士的訪問，有好幾位都承認自己破產不只一次。還有人買了某種動物幣，前一天晚上還在享受他的虛擬漲幅，第二天早上起床卻發現，整個平台不見了！世界上再也不存在那種動物幣，他被收割了！所有的紙上富貴都是一場詐騙。'
  merge: -1
  img_proc: true
- pgno: 347
  md: '類似坐雲霄飛車的還有 NFT，有一陣子，大家都在瘋狂的出 NFT，常常傳出有知名人士一夜之間猛賺幾億的消息。很遺憾的是，隨著虛擬貨幣的大跌，當時高價買的人，後來想賠售也賣不出去。


    寫這些並不是為了警告大家不要買，甚至我還認為每個人都應該些微且適度的參與。據說目前全球持有虛擬貨幣的人不到 5%。如果你現在有，那你一定是先行者。前浪可能死在沙灘上，但是也可能享有先行者優勢。


    # 如何投資？小額、定期加碼即可


    我自己有幾點購買比特幣的原則：


    +   1. 小額投資，如果在基金和 ETF 上投入 $10，就在比特幣上投入 1 元。比例很少，但是足以觀察未來。


    +   2. 不管他價錢如何，還是定期定額。不會因為在低檔而特別加碼，免得愈攤愈平，其實就算到了高'
  merge: -1
  img_proc: true
- pgno: 348
  md: '點我也沒有賣，因為擁有的還太少，賣了也沒賺到什麼！


    3 不抱著希望，但是也不對它絕望。未來，一定會來，只是曲曲折折地來！那一條曲線像在爬不規則的樓梯！


    比特幣漲跌的邏輯，未來也可能比你我想像的還瘋狂。就像柯斯托蘭尼經典的遛狗比喻，經濟是人，


    # 圖一 主要虛擬貨幣與美股近五年成長率比較


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_348_0.png)


    資料來源：yahoo!finance'
