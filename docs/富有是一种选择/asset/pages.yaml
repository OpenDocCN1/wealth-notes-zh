- pgno: 138
  md: '你自認為存第一桶金的進度遠比你的預期落後，那還得重新檢視自己的理財行為。


    連頭期款也沒有，又不可能有長輩垂憐？那判斷就太容易了。別買！先存錢，先存股！


    所以那你在煩惱什麼呢？我先說結論，如果你有足夠的錢，那買自住房這件事情就不要太糾結，之前說過，應該先求有再求好，你買得起怎樣的房子，就買怎樣的房子，不要太為難自己。


    如果你月薪 5 萬元，想買的房子卻是帝寶之類，那麼先要拉近的是理想與現實的距離。


    薪水不低但多年來沒自住房，看著房價不斷上升的人，心中往往有一套完美標準，賦予房子期待值太高，希望同時滿足很多的需求。例如交通要夠便利、公設比不能太高、裝潢要好看、房價還要便宜。但請下凡看看現實，很多條件其實都是「想要」，而不是「必要」。


    換句話說，如果你是抱持著追求完美的心態來買房，那我敢說，你是永遠買不到的。'
