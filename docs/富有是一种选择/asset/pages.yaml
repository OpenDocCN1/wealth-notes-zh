  md: '這是個決策思考的簡單訓練題，當然不是要你放棄拿手的國文。如果我問的是：你該選什麼科系，你的答案應該更清楚了，數學 10 分，去念理工科會變耗材，不是嗎？千萬不要勉強自己！


    # ② 別當感情關係的耗材。


    感情或親情中，不斷被當耗材，恐怕也沒有人會覺得幸福。不管你再怎麼愛一個人，都不要在這段關係中一直被損耗。就算你多愛你的家庭，也不要當一個只會犧牲奉獻的被耗之材。在你抱怨或說出「我就是沒辦法啊」之前，請仔細想想你是否也可以為自己做些什麼？有沒有方法讓你不要「蠟炬成灰淚始乾」？不要放棄尋找突破點！


    # ③ 找到自己的獨特性。


    在商人眼中，耗材就是可以被替換的資源，但是當你具備獨特性，你就是他們眼中的資產。比如說，當一個外送員開車送餐，你能夠產生的差異性相當有限，但如果你會寫程式、你超會賣東西、你具有豐沛的文史知識、你的財務頭腦清晰、你很敢講話口才一'
