  md: '是無利可圖的，那誰來做此種慈善事業啊？有了容積獎勵，有更多額外空間讓建商另外銷售，這樣建商才願意跟地主一起來分擔工程款，讓所有權人以比較低的代價，達到「舊房換新房」的目的。


    當然有些國家也是會給你錢。比如說在日本的都市再開發補助制度，獎勵主要採取「融資援助」與「金額補助」，而非容積獎勵。


    不過也都是大型建商才有此等財力和毅力。


    日本的方法其實比較簡單。至少不太麻煩擁有者。我擔任董事的日本租賃公司就曾經遇到都更事件。整個過程經驗是這樣的：這間房子只有地上權。當時購買的時候已經接近五十年，為什麼要買它？當然是當時的執行董事太天真（就是我本人）。


    因為執行董事本人非常嚮往念東京大學，而這個房子直接看著東京大學某校區的操場。感覺離夢想好接近。（本文說的是實話，拜託不要學，分不清楚現實和夢想的距離，肯定會帶著全公司慢慢往下。）


    我公司是在 2014 年左右買進。主要是因為：'
