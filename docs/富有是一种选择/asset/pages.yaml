  md: '買菜，在步入「市場」前，就該知道自己要買的是什麼。因為如果你沒有清楚的目標或條件，就無法做出符合自己需求的決策。


    買房何嘗不是如此？請列前三名標準清單，不要像擇偶條件一樣模糊，說什麼「我愛他就行了」，記得考慮「代價」：妳能負擔的貸款總額，並且思考妳的工作穩不穩定？


    # 2 你的願望值多少錢？


    從過去的調查來看，女性在決定購屋的條件與男性確實不同。在生活水準上會比男性更為講究，男性可能回家只要能上網、睡覺就好，而女性會更重生活品質。另外女性普遍也更注意安全需求，除了屋況本身，周遭環境（荒郊野外或風化區）等都是觀察重點。


    買屋清單比擇偶清單容易多了，在於擇偶條件無法標價，但是買屋清單可以有價格標準，清單再完美，買不起也沒用。提醒自己，房子不會像愛情一樣多變，不會翻臉如翻書，它會給你如同混凝土與鋼筋'
  merge: -1
  img_proc: true
- pgno: 213
  md: '般的承諾。這樣一來你才知道自己的「夢想」值多少錢？以及你需要花多少力氣去追求。


    # ③ 為了買房你願意付出多少代價？


    除了要估量夢想的價格，還要知道自己的能耐。這裡的能耐指的不單是你有多少錢？還有你願意為此付出多少代價。不管是存頭期款，或者是後續繳房貸，你的生活勢必會受到影響。


    還算低利時代，如果可以使用寬限期不必先還本金，就不要客氣！用寬限期，五年內只付利息，不付本金，好處是可以維持生活品質，並且有多餘的資金注入其它投報率較高的
    ETF 或股票，也還有筆應急用的生活資金。


    # ④ 要買套房、兩房還是三房？


    如果有足夠的錢，你要買幾房呢？當然錢多幾房都可以，但是房間多維護成本高，而且如果你住在城市中，常常會有「免費住客」搬進來。我的一個女性朋友就有這樣的經驗。她在臺中工作，家人也都在中部，運氣不錯，五、六年前在房子還滿便宜的時候，'
