- pgno: 61
  md: '大部分投資人都有一種奇妙的幻想，稍微了解技術線圖，開始跟那些股市老師學到「低買高賣」的說辭，就認為自己天賦異稟，可以預測股票漲跌趨勢。萬一還真的給他猜對了一兩次，那就覺得自己很有神通，直到最慘的一次猜錯為止。


    然後就收手沮喪地停歇一段時間，完全不投資。直到股市已經上漲一段時間，「大家」都進場了，他開始有信心「猜」到這應該是進場的時間到了，然後因為他的從眾心理套在最高點附近。你以為跟著大家，風險就會變成零，事實上就是因為跟著大家衝進衝出，才付出最大代價。


