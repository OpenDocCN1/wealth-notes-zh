    2% 以下的利息，就有機會把這 100 萬元變成 105 萬元，而且要還的錢，其實比你實際欠的還要少，那你等於是善用現金在賺錢，當然，在某個倒楣的一年，你可能減損本金，但長期來看，比如五年、十年，股市完全停滯的可能性很低。股市百分之八十的時間，是在緩緩上漲的。


