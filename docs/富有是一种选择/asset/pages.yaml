- pgno: 75
  md: '縈繞我們腦海。是的，我承認它們很有用，甚至韓劇裡的女主角穿上一套名牌洋裝，醜小鴨從此看起來像名門貴女，不是嗎？但是耗材就是耗材，在「財富自主」的路上，它們是滅號，讓你的現金流流出去。


    車子和手機是不折不扣的耗材，不只要加油，還要付牌照稅與不定時的修理費用。至於那些便利感或生活水準的提高度，這些抽象的概念跟現金流的流入不相關。你可以熱愛你的車子和手機，但請記住：買愈多，累積的資產並不會愈多。


