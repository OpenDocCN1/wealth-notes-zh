    但亞馬遜是失敗的公司嗎？恰巧相反，因為他們獲利能力驚人，這些「債務」不但不是負擔，還是攻城掠地的彈藥，讓公司股東權益自 270 億美元竄升至 1,382 億美元，也整整是
