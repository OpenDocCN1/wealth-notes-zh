- pgno: 87
  md: '真不能怪他，這也是老一輩教我們的觀念：有骨氣就別跟人借錢。


    # 沒欠債＝成功理財？


    這句話乍聽之下合理，但有錢人可不這麼想。有人這麼諷刺地說：「窮人每天拿錢給銀行，有錢人每天從銀行借錢」。而窮人愈存愈窮，但有錢人愈借愈有錢。


    大家都以為有錢人最會賺錢、存錢，但事實上達到某種富裕程度的有錢人最擅長的也可能是借錢與花錢（投資、買資產、開創公司）。有錢人會估算自己的財務槓桿是否健全，只要有機會借得到錢，在利息比他能賺的錢還少的狀況下，會勇於借錢用來投資。這就是所謂的拿「別人的錢」來賺錢。


    事實上「借錢」在企業經營是再正常不過的事。舉個例子來說，亞馬遜是全世界最有錢，也最會賺錢的公司之一。如果你攤開亞馬遜資產負債表的債務那'
