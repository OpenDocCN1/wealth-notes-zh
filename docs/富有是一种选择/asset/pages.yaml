- pgno: 188
  md: '卻也不是沒有難處，百分之百的同意率，最容易被成功的方法就是你口袋要深，把那一整棟慢慢地都買下來（我在痴人說夢嗎？）


    一般來說，危老從申請到興建，平均五年時間就能完工。至於都更，光是案件通過，可能就要三年，花了二十年才完成的更是所在多有。年紀大的人，可能就要開始鍛鍊身體，才等得到成功的一天。政府在
    2017 年開通「危老」這條路，就是為了突破都更一直以來被批評時間冗長的瓶頸，自然門檻會放得低一些。


    就獎勵角度（也就是蓋好之後「住戶得到的好處」）來看，都更倒是比較優厚，「都更容積獎勵」最高上限可以到 50%，而危老最高上限獎勵是 30%。這裡講的獎勵是容積獎勵，讓你改建後可以取得更多面積，而不是「費用補助」。這個目的也是為了提高建設公司投入都更的意願，不然圓了住戶的夢，卻賠了自己的錢。


    畢竟，如果只能按照原本的面積重蓋，建商幾乎'
