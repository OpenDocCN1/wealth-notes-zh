  md: '# ### 15.


    # 學學馬斯克，提升自我效能感，解決最困難的問題！


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_256_0.png)


    有一種人，他的想法對當代的人來說是異想天開，沒人相信他的妄想會有可能成真的一天，但當他趨近目標時，他年少的「妄想」搖身一變，成為所有人心中典範。


    歷史告訴我們，這世上存在「創造少數」（歷史學家湯恩比說的），總要有人突發奇想，然後實行，推動世界文明繼續往前走，雖然開先例者都曾經被無數人詛咒過。


    馬斯克就是這種超乎規格的狠角色，十二歲他第一次賣掉自己寫的遊戲程式，賺進 500 美元；第一次創業又順利兌現，1999 年將他與弟弟共同創辦的'
  merge: -1
  img_proc: true
- pgno: 257
  md: 'Zip2 賣給康柏電腦後，賺進 2,200 萬美元。到 2002 年，因為 PayPal 賣給 eBay，身為大股東的馬斯克分到 1.65 億美元，為他日後成立太空探索公司
    SpaceX 與特斯拉籌備一桶金。那年他還不到三十歲，馬斯克已經躋身前 1% 的人生勝利組，呵，應該有很多人認為他錢夠了，可以「提早退休」了吧。


    # **失敗，造就史上最強勝利**


    然而，在 2008 年，馬斯克面臨人生最大的難關。SpaceX 旗下獵鷹一號運載火箭（Falcon 1）第三度研發失敗，不斷燒錢讓該公司陷入財務困境。同一年，特斯拉燒光了投資人一億美元，第一批電動車
    Roadster 僅生產 100 多輛卻還很難賣，這一年特斯拉虧損 8,200 萬美元，公司資金剩下 900 萬美元。


    不過後來的故事我們都知道了：SpaceX 最終成為第一間可以發射火箭的民間企業，接了各國政府數不完的訂單；特斯拉則打敗豐田與福斯，成為全球市值'
  merge: -1
  img_proc: true
- pgno: 258
  md: '最高的汽車製造商。特斯拉的股價從 2020 年每股不到 100 美元，同年年底就衝到 700 美元，最高甚至來到 1,200 美元。


    我們都無法和馬斯克一樣高標且瘋狂，不管比聰明、比瘋狂投入工作或是投資，但有一件事情是很值得向馬斯克學習的，那就是自我效能感。


    所謂自我效能感，意謂著具有充分能力完成某事的自信心。具有自我效能感的人，會堅信自己的能力，就算其他人都相信，他自己相信就好，而且充滿邁向目標的行動力。


    # 創造自我效能感。想做，就要做到


    馬斯克正是標準自我效能感極高的人，他深信只要他「能夠」，或甚至只是他「想到」，他就要做到。不管是創造不用加油的跑車，或要帶人類上火星，只要是他相信可以的，就會採取行動，一步一步往前進。換句話說，他有解決問題的能力與信心。'
  merge: -1
  img_proc: true
- pgno: 259
  md: '就算別人不了解他的思想，他也不會覺得寂寞。因為自我效能感很深的人，往往在早期就發現，自己比周圍的人更聰明或更有創造力。你說他們是天才，他們也的確是，他們知道自己與眾不同，篤信自己想法為真，不輕易被環境動搖（當然失敗者也可能成為悲劇英雄）。


    而且真正具備自我效能的人，肯定是有行動力的人。如果你只是鼓吹夢想而不自己行動，那就會變成一個自大、自吹自擂的人。


    馬斯克不會只出一張嘴，而是站在戰場的前線指揮。雖然他和賈伯斯一樣是有名的不好相處，卻還是能鼓舞著與他並肩作戰的人，一起朝向一個大家覺得不可能的計畫前進。就像SpaceX的員工說的：在這公司解決「不可能的任務」是稀鬆平常的事情，而丟回給馬斯克是最壞的處理方法，因為他會以你無法想像的方法解決看似不可能達成的目標，證明你很騷。


    我們每次都只看到別人的成功，卻沒看到別人付出多大努力。正如前文所敘述，馬斯克在2008年火'
  merge: -1
