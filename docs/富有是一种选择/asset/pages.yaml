    # 做生意沒現金流，就是等死


    但是要正確評估現金流，你要先知道你的「生活支出」的計算方式，這一點我們可以從「開店」來舉例：開過店的人都知道，只要有三個月不開門，6成的商家絕對撐不住，因為現金流支撐不過三個月。我們來解釋一下為什麼會撐不住？


    首先先來了解「固定成本」和「變動成本」。以餐廳為例，開一家實體餐廳要支付的每月固定成本很高，所謂固定成本就是不管你開不開業都要付的錢。例如房租、已經花下去的裝潢攤提，以及老闆自己和固定人員的工資。


    相對的變動成本，從字義上解釋，就是隨著收入變化而變化的成本。工讀生的費用、食材的費用、廣告行銷費用、水電費也應該列入計算。


