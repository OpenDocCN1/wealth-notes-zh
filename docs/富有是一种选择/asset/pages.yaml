- pgno: 12
  md: '# 相信你能！



    如果你一定要參加一場考試，你希望人家先告訴 你，這場考試 A 很簡單，還是 B 很難？



    請二選一。


    如果你選 A 很簡單。那麼這本書很適合你。


    首先我們必須承認，世界那麼複雜。你看，人們 以爲不會超過三箇月的疫情，超過兩年了還「方興未 艾」；人們以爲不會發生的戰爭發生了，人們以爲一 定不會漲的股市漲了——也在人們以爲不會跌的時候
    下跌了。


    世界永遠是動盪的，就像星座專家們不斷提到的 「水星逆行」，特別是熱門行業變化得非常快；在此'
  merge: -1
  img_proc: true
- pgno: 13
  md: '同時，AI 要取代某些人的工作崗位，也將發生得比什麼都快。


    可是，真正長治久安的方法卻仍然是簡單的，也就是投資永遠要注重長期效益，別當一隻好動的狗，追逐著指數跑來跑去；而有策略的懶，肯定比沒有方向的勤快要強。擴大投資範圍，較不會受單一公司風險拖累的標的，總是比押在一家公司強，不管這公司現在看來有多強！


    我曾說，只要一個人問我：現在可不可以進場？那就是他把投資理財當成進賭場押注。那麼，就算贏九筆，他也會輸一筆，而且輸的那一筆肯定超過前九筆，因為最後的注總是押得最大。


    這不只是我說的，是活生生發生在股市的現實。


    如果你選 B 很難，那麼，我相信你一定是過去的學霸，或者已經是投資路上的箇中高手，已累積相當數量資產，還熱愛股市衝浪，耐風險度很高。那麼，你可能還是得看看這本書。看什麼呢？看一下講房子的部分。我過去所認識的股市高手和理財專家，'
  merge: -1
  img_proc: true
- pgno: 14
  md: '到了齒搖髮白時，還能夠過著非常安逸的生活，都是因為他們除了風險投資之外，也曾經把盈餘換成了某些不動產。


    如果你愛好賺取「別人比不上的利潤」，那麼我必須請你回顧一下歷史。除了巴菲特能夠證明他有稍微打敗大盤之外（並不是每一年），其實誰也沒真能「長期」做到過。那些市場叱吒風雲的股神，如安德列·科斯托蘭尼、市川銀蔵、傑西·李佛摩（本土的我不好指名道姓）等等，都曾經破產！


    還有，不要以為會賺錢就會理財；不會理財，再會賺錢也沒用。也不要以為精通金融就會理財——看看電影《華爾街之狼》吧，還有無數的前車之鑒。


    我要說的是，你可以很簡單的擁有管理金錢的能力。


    當然得先存，先存再花，養成紀律，然後執行長期策略。想辦法至少擁有一間自己的房子，不要貪大，只要舒服。


    世界已經很亂，人生已經很難，不要浪費太多時間在理財上。


    序言 相信你能！


    13'
  merge: -1
