- pgno: 253
  md: '在日劇上常看到，有人失業，卻每天穿西裝到公園裡面，坐著發呆看手機。其實他也沒有去找工作，卻始終說不出他失業。但其實隱瞞比向家人坦白要糟很多。


    第二，自信的人，生活中充滿積極向上的心態，比較喜歡跟有自信的人在一起。一碰到問題就驚慌失措始終不能解決問題，懷疑人生當然更糟。直白的說，現實世界根本不容你沒有自信，不管你自信夠不夠，地球一樣自轉。


    我曾看過一種人，缺乏自信無法獨當一面，總是將「猴子」丟回給主管，要別人幫忙解決問題，這樣自己就不用負責任，我會告訴他，你是要來解決問題，不是來製造問題的。請問你設定的解決方法是什麼？你可以緊張，但是不可以一昧的討拍。


    第三，自信的人，比較有行動力，並且勇於冒險。願意冒險的心態和希望感呈正比。閉門造車雖然安全，卻只能以管窺天。


    心理學家謝立・泰勒的研究也發現，同樣罹患癌'
  merge: -1
  img_proc: true
- pgno: 254
  md: '症的病人，有自信的病人，比那些不自信的癌症病人會多活一段時間，也更能調適重大傷病之後的生活劇變。


    當然，過度自信並不總是好事，可能就等同自大，沒有「地基」。什麼是地基？具體的說，就是你曾經做過的成功的事情，成就感是你的地基。


    用知名心理學家阿德勒的話，可以做為這一章的結尾。阿德勒說：「我們這個時代最偉大的發現就是，人們終於可以改變對自己的認知，來改變自己的生活。」把挫折歸咎於別人或環境，是最輕鬆的。你不能再從被動等待寄望藉由「天降神蹟」實現，上天從來不眷顧懶惰鬼，請主動制訂策略，實踐自己的願望吧。'
  merge: -1
