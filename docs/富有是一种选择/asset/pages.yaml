- pgno: 157
  md: '句話說，房子是資產，裝潢是耗材。不過請不要曲解我的意思，你有錢，你就是大爺，高興怎麼裝潢誰敢說話？我只是要提醒你，你賣房子的時候，通常裝潢成本你要不回十分之一。


    買家就算再喜歡你的裝潢，也會說：「裝潢要算錢？我不要你的裝潢，你可以打掉！」很抱歉，我就用過這一招。你覺得想賣房的人真的會打掉嗎？當然不會，打掉房子很貴啊！


    而以面積來看，中古屋的實際使用面積會比新成屋要來得大。因為現在的新房子大多有較高的公設比，臺灣是房地產坪數最不能看數字的地區，因為我們的虛坪很多，不像日本是計算實際室內坪數，連陽臺都是送的！不能夠計入實際坪數！同樣一個地區，新成屋和中古屋的坪數，如果是30坪可能會差很多。


    四十年的老房子，說是30坪，正常狀況下，肯定有個20出頭坪，如果是新房的話，那可精彩了，我常常在「好房網」瀏覽房子，曾經看過上頭寫30坪，室內建坪只有8坪！因為這30坪包括停車位，'
