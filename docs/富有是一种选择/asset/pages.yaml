  md: '處都買不到書，因此不管線上線下，各大通路都送出訂單。為了滿足消費者需求，各通路也拚了命叫貨，明明只需要 3 本，索性叫個 10 本，以備不時之需。不過當話題過去，這本書實際賣掉了
    8 萬本，但過程印了多少本？答案是 15 萬本，剩下的 7 萬本賣不出去，後來全部銷毀。真是「世事一場春夢」啊！


