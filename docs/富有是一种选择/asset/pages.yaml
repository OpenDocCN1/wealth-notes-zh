  md: '# 16 是什麼阻礙我們的理性決策？


    「善用手上每一分錢，讓錢為你工作」、「通膨時代來臨，不投資就是讓資產貶值」、「不要相信保本穩賺這種話術」，是我認為理性、而且經得起考驗的論點，你也可能覺得是老生常談。


    知道是一回事，做到又是另一回事。為什麼人還是不投資，捨棄風險較低的自我管理，寧願把錢交給那些報明牌投資社團，或相信高投報率的謊言？


    # 為什麼寧願滿手現金也不投資？


    首先，我們先來看看大部分的人是怎麼想的。根'
