  md: "理財和投資，原則是很重要的，如果完全不懂，根本是在賭博！你可能會僥倖賭贏，但是久賭必輸。賠了夫人又折兵的感覺，想必沒有人喜歡。\n\n我說的是真話，但她不愛聽。\n\
    \n糊裡糊塗地陪朋友玩金錢遊戲，我真的覺得非常不好玩！\n\n我喜歡有點原則。\n\n＊\t＊\t＊\n\n這本書本來的名字很長。富有是一種能力，堅持是一種選擇。\n\
    \n後來我嫌自己囉唆，直接改成富有是一種選擇。\n\n每個人想要的富有程度不一樣，最基本的，其實叫做財富自由。所謂財富自由，最基本的，就是當你活到一百歲，就算不工作，你都可以靠手邊進來的錢好好活，不必憂煩。別人也不用為了你沒錢活而有負擔。其實並不容易。\n\
    \n因為通膨進行中，世界急遽改變，你的健康狀況"
