  md: '還有各種公設，真令人瞠目結舌，很考驗我們對空間的想像力！


    你也別相信新成屋的 N 房，這一點，買預售屋的人也常常被嚇到。怎麼有個房間在藍圖上看起來還不小，實際上大概只有哆啦 A 夢才能住得進去！在空間坪數上，中古屋提供了確定性！


    在生活機能上，中古屋距離商圈會比較近，而新成屋大多在重劃區，可能要歷經一段「方圓 1 公里內沒東西吃」的時期，還好現在有 Uber Eats！選擇上跟購屋者的生活習慣密切相關。如果你
    在交通上仰賴大眾運輸，生活習慣外食，或在菜市場買食材，那中古屋可能比較切中你的需求。而如果你有汽車代步，會到賣場買足需要的生活物資，熱愛在家自己料理，那麼商圈與生活機能對你來說可能就没那麼重要。


