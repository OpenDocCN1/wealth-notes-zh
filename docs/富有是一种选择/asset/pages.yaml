  md: '在華爾街，有個很經典的統計資料：如果股市漲幅最多的那十個交易日，你剛好缺席了，那麼將會大幅降低你的投資報酬率。如表一所示，就是過去從 1927 年到
    2011 年的累積報酬，共有四種情況，這是我能找到最簡單的模型。


    很顯然地，如果你只是買了然後放在那裡不動也不加碼，他最後就會變成 71 倍。如果能夠像神仙一樣避開大跌的十天，而大漲的十天又都有跟到，那你就有 226 倍，太完美了！問題是你並不是神仙而也的確沒有人這麼準過！如果你非常倒楣錯過了大漲的那十天，那麼你能夠從長時間中收益的獲利會縮水到
    23 倍。當然，通常你也不會那麼倒楣，每次的上漲都剛好沒跟到，這個表在告訴你其實跟著長期的上漲就夠了，你不用自作聰明就會有 71 倍的報酬！


    實際上，也沒有任何有效方法，可以預測市場未來會上漲或下跌，這次疫情就是絕妙範例。疫情剛開始的 2020 年初，大家認為會跌的時候，它狠狠地漲了一陣子，疫情在世界各國慢慢解除或封關之後，有'
