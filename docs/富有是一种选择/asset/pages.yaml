- pgno: 333
  md: '了三百六十五天沒有休息的紀錄！剛開始生意也不太好，還好運動員體力好，連清潔工作都自己來，還親力親為發傳單！在不斷地調整之後，了解了客戶的需求，創業的第二年，就開了第
    2 家分店。


    然後一間一間地開下去。餐飲業的毛利實在不高，在这次疫情中他也面臨很大的打擊，為了要生存，他學會彈性應變。因為成本高，毛利低，開餐廳如果顧客不能上門，餐廳三個月內就可能關門大吉。他請員工繼續上班，製造熟食商品，雖然他說變通得有些遲了，但是晚開始總比沒開始好！


    十六年來，為什麼餐廳能夠一家一家的開？他誠懇地說，連鎖餐廳老闆要有一個認知：一切必須標準化。他旗下的餐廳把「廚師」這個角色的比重降得很低，主廚只做研發工作，還有調配佐料。以燒肉來說，只要有一定的
    SOP，就算不會下廚的員工也會烤，客人也喜歡自己烤，減輕餐廳老闆對主廚的依賴。


    本來壓根沒有想到要當老闆，遇到職涯上的困難才開始創業的人很多，一次就成功算是運氣太好。知'
