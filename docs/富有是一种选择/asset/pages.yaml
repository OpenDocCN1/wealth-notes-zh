- pgno: 63
  md: '一段時間跌幅反而看起來讓人絕望。


    其實，在投資時，如果我們要去挑選買賣的時間點，總會遇到「猜錯」的風險。投資應該有比「猜」更理性的方法。比如採取長期投資來坐享利益，以定期投資來平均投資成本。如此一來你不會錯過大漲，在大跌的時候也可以有攤低成本的機率。還有，長期投資可以減少交易次數，因為交易本身也是要花錢的！長期投資省事又省錢，不要祈求變成神仙，就可以穩穩用最理性的方法累積財富，不是嗎？


    # ③利率偏低時，適當的舉債比無債一身輕好


    很多人害怕借錢，覺得跟銀行借錢是很吃虧的事，因為要付利息。但事實上通膨對於低利息時代欠債的人其實是有利的，因為通膨會讓你借的錢「實質」縮水，如果通膨高過利息的話。有個財務名稱叫「淨現值」（NPV），簡單的說就是每年的錢購買力不一樣，因為通膨緣故，今年的100萬元與明年的100萬元，在實際購買力上有差，簡單來說，今年的100萬元會比明年值錢。'
