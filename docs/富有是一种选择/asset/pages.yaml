    # ## 學校無法教你的事：

    ## 如何在艱困中堅持？


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_32_0.png)


    某一天的早上，跟我搭檔主持好幾集 Podcast《人生實用商學院》的林峰堊醫師把排行榜傳過來，我才發現原來我們這個節目的排行還是很不錯，也拿過好幾次的榜首。


    其實，我在這個節目開始的一個月後，就不關心「排行」了。我比較關心有多少人下載。為什麼？這就跟一家公司實在不該太在意它在業界排名，只把力氣用在「把前一名擠下來」上；你應該在意的，是有沒有更多消費者喜歡你的產品？這才是正確的商業思維。


    每個人的軌道不同，節目也是如此，名次並不重要。當然我年輕時想不透這點，二十一歲剛開始出'
