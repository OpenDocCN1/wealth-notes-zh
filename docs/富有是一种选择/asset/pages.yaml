    好了，讓我們把焦點回到可愛的黃大米身上。「妳到底花了多少錢？」每次我問她，她都支吾其詞，最後只好坦言，「大概就是妳說的 300 多萬元啦，算你準！」


    不過根據另外一位朋友不小心透露，她其實花了 500 萬元左右！但至少裝潢的結果讓她發現，她買房的 1,800 萬元算很划算。更何況在裝潢的漫長一年中，這房子的房價真的漲了。


    如果收入很高，說真的你怎麼裝潢都可以。不過請記住，买房子的負擔，比裝潢來得輕。為什麼？因為買房子可以貸款，裝潢多半必須真金白銀支付。換'
