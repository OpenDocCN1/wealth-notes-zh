    # ### 鑱金筆記


    給自己留出「無干擾時間」進行創造性思考。


    大量的任務和會議會讓管理者喘不過氣，導致沒有足夠的時間放在創新和戰略目標上。


    對此人們的應對方法就是加班。


    然而，更有效的解決方案是把待辦事項先放在一邊，根據你的生物時鐘安排日程，找到並預留出自己狀態最佳時段，專門用於實現你最有價值的目標。'
  merge: -1
