  md: '好而已，而是透過這些工具來觀察問題、訂定策略與行動，最終解決問題。


    什麼是商人？我想把他定義為：「可以彈性擬定策略，並用行動力解決難題的人。」日本萬元大鈔上的畫像人物福澤諭吉，曾經這樣闡述過「商人之道」，他說：


    # ① 商人是孤獨的，因為孤獨才有價值。


