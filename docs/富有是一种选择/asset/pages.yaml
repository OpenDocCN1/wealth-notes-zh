    # 是長通脹還是短通脹？


    疫情之初，曾有學者寄望這波通脹只是短期現象，美國財政部長葉倫和諾貝爾經濟學獎得主經濟學家克魯曼教授，也曾經認為通脹只是短期現象，不會造成太大災難，等疫情過去就能順利過去。


    有些現象確實是短期的。比如說機票價格上漲，部分是因為疫情導致供需不穩定，長期而言自然會恢'
  merge: -1
  img_proc: true
- pgno: 56
  md: '復平穩；還有能源價格的確因為俄羅斯與烏克蘭的戰爭而拔高。我也同意疫情過後，失業率應該會慢慢降低，產業會漸漸復原回到正常水準，人們不再因為杜絕傳染而被閉鎖，生活能恢復過去的樣貌。


    但是，通膨不會過去！人類歷史上幾乎沒有「物價忽然變低」的狀況，除非一個國家的幣值大增值！我們要有長期面對通膨的準備，甚至風險會愈來愈大。事實上我們這幾十年來已發現，手中
    100 元的購買力已經縮小了許多，而未來同樣貨幣購買力的消失會更加明顯。


    疫情所造成的運費上升可能會回落，但是大發鈔票所造成的貨幣太多、商品太少的失衡，卻很難在短期內改善。


    中央銀行是國家貨幣政策與物價通膨的把關者。過去，各大國中央銀行為了穩定物價，致力於維持每年的通膨平穩，也就是物價上漲的幅度在 2%。


    為了拯救金融風暴，十多年前美國中央銀行，也就是聯準會（Fed）祭出「量化寬鬆」政策，除了透'
  merge: -1
  img_proc: true
- pgno: 57
  md: '過購買債券釋出貨幣，也把利率慢慢降到最低點。


    Fed 的邏輯在於：如果要國泰民安，那麼就要讓人民充分就業；要追求充分就業，就要讓新公司更容易借到錢，才能提供就業機會。


    而當利率維持低檔，市場資金充沛，自然會造成錢太多的狀況。而多數原物料資源有限，既然商品太少，必然是價高者得，因此市場會湧入資金去搶買商品，價格上漲也是必然。


    而且愈大的國家，資金實力愈大，貨幣國際影響力也愈廣，以美國來說，大印鈔及低利率所引發的資金浪潮不只影響國內市場，還會將通膨像海嘯一樣捲到其他國家。這兩年來像是從拉丁美洲阿根廷，到中東的土耳其，物價都有兩位數的漲幅。通膨，會是全世界共同面對的難題。


    而通膨容易降溫嗎？也許會降溫，不會再漲那麼多，但已經漲上去的價格，是不會跌回原位的。請問你一個簡單的問題：你家巷口的滷肉飯漲價後，曾經降過價嗎？相信答案大概都是否定的。'
  merge: -1
  img_proc: true
- pgno: 58
  md: '從財富的角度，當然有人能靠通膨致富，但大多數人會因為通膨而變窮。為了避免財產被通膨侵蝕，資金大量挹注資產市場，資產價格也水漲船高，原本擁有房地產與有價證券的人會更富有，而窮人則得承受薪資凍漲、物價卻上揚的壓力，可能連明天吃飯的錢都沒有。經濟學大師傅利曼說：通膨會讓社會分裂成「贏家」和「輸家」，貧富更加懸殊。


