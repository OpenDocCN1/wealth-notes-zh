    那到底有哪些細節可以比較的呢？以下是我列出來，在購屋前需要考量的重點：


    # 安全


    九二一震之後蓋的房子，政府已針對建築耐震係數做出規範。超過三十年的房子，在安全上會少了一些保障。不過，年紀愈大的房子當然愈便宜。


    坦白說，保障不等於保證。這樣說吧，好的建商不管有沒有法令規範，施工安全性都有一定水平，就是工法謹慎。相反的如果是不好的建商，就算有政府法規加持，恐怕要為它畫一個問號。奇妙的是某些建商不管蓋在哪裡，漏水都很嚴重。因為他們的策略是蓋「當區最具
    CP 值的房子」呀，太重視成本控制，就不注重施工品質和建材好壞了。所以不要有「新成屋比較安全」這樣先入為主的既定印象。


    我不想在此得罪人，你可以自行 Google「不能買'
  merge: -1
  img_proc: true
- pgno: 160
  md: '的建商」排行榜，把各個排行榜比較一下，會發現其實大家意見挺一致的：就是那幾家呀！當然，如果你要買「模範生」建商的房子，肯定是同一地區中比較貴的。好處是這個「比較貴」也會讓你在賣出它的時候得到好處。


    # 公設


    公設就是公共設施，「公設比」指的是所有權狀中不屬於你實際使用坪數部分的比值。公設比愈高，你實際使用的坪數就愈低。


    很多新房子主打漂亮的公設，像是圖書館、健身房、游泳池，這些都是公設的一部分。相反地，老公寓沒有這些花俏的公設，功能性單純，因此一樣的坪數，中古屋內部要比新成屋大得多。如果使用面積來算，新屋與中古屋的價格差多少呢？就我的經驗來看，同一地區新成屋與一間四十年的老屋相比，每坪大概貴
    2.5 倍。'
