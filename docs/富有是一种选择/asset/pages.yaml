  md: '# RECOMMEND

    推薦序


    # 一個集瀟灑、聰明、慷慨、

    又活得過癮十足的女人


    陳文茜


    她是吳淡如。三十年前你認識她，一個寫愛情的女作家。


    二十年前妳認識她，她開始活躍於電視節目，說話銳利，談話節目主持人。


    十年前你聽說她，一個精明幹練的置產投資人，而且在庫東梅花湖開著夢幻小熊書房。


    現在她的 Podcast 打敗「股滙」，成為一般人投資理財最信賴的頻道。她還經營電商，並且慷慨的送夥伴田定豐一個禮物：Patek Philippe 百達翡麗的名錶。'
  merge: -1
  img_proc: true
- pgno: 9
  md: '對方能不全以赴嗎？多麼聰明的女孩！


    她出生於宜蘭，父母對她的期待，就是當個老師，鐵飯碗，安定過一生。她不同意，自己到臺北報考北一女，之後畢業於臺大法律系、然後跳讀中文研究所。


    這樣的跨界太平常了！


    中年之後，吳淡如跑到上海，就讀位於上海中歐國際工商學院，這是歐盟與中國共同成立的自由派MBA學校。之後順著軌跡，她又去了上海交通大學中歐國際工商學院（瑞士分校）商學博士班。


    還沒有完，因為一趟旅程，她走入山中一個千年古學院，她又開始習一門古老的智慧課程。


    凡人和她的差別：凡人只是在想，在做夢；她卻一直行動，一路轉彎，尋找更精彩的人生。


    對於人該怎麼活？


    她比多數人更透心，她大方的說：既然只是瀟灑走一生，我們何必裝？


    愛錢不必裝清高，取之有道即可！'
  merge: -1
  img_proc: true
- pgno: 10
  md: '搞政治不過就是另一門特殊生意，想興隆，何必賣崇高！


    做節目，既然多數人都只是為了通告費主持費，何必糟蹋別人的人生。


    我們邀請她，一聊，發現請的不是「一個人」，而是四、五個人。她不斷變身，不停成長，不會給自己界限。


    中年了，還在長跑！！！

