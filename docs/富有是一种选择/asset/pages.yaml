    當時打工的機會很有限，沒那麼多兼差需求，而我也無法勝任工地類型的工作。還好臺大學生很好找家教，我還能斜槓賺稿費。我大四時就出書了，雖然當時一本書的版稅只有
    5 萬元。二十四歲出社會工作，省吃儉用搭公車上班，我把每個月的薪水和稿費，幾乎都存下來。


    想不到我本來是個「好好小姐」吧？當同事開口跟我借錢去買車，或是說他股票虧損，請我借錢給他去扳回一城。臉皮很薄的我雖然覺得怪怪的，但都因不好意思拒絕而答應。結果卻是從來沒有人還過我。


