- pgno: 267
  md: '平心而論，第二名與第五名是同一件事情，就是沒錢。每個人收入不盡相同，的確不是大家都有足夠的錢投資。但是任何人的錢都是「省」下來的，不是天上掉下來的。要提醒你，現在投資門檻確實很低，我聽到最低的每個月
    1,000 元就能投資基金。所以沒錢也不過是放棄理財的藉口而已。


    但從其他的原因，其實我們可以從行為經濟學的研究，找到這些看似「不理性行為」背後，真正的原因是什麼。


    # 其實是因為你很懶


    不知道要投資什麼？這是個挺好的藉口，然而現代人很輕鬆的就能取得很多理財知識，跟以前理財工具少、資訊不發達的时代大不相同。除非你很懶，堅持「不求甚解的人生最舒服」，與其說是「不知道投資什麼」，更準確的說法應該是「不知道投資什麼會賺」。是的，投資不一定會賺。'
  merge: -1
  img_proc: true
- pgno: 268
  md: '有些人不投資的原因，在於過去有失敗的投資經驗。理性來看，每個決策彼此之間並不相干，不會「帶衰」你。上一次賠錢，不代表下次也會賠錢。失敗是有原因的，記取教訓，不要再犯就好。


    其實僥倖成功才會帶衰你，有些人在過去投資的特定項目中賺到甜頭，可能是某些高風險、高報酬的投資類型，例如虛擬貨幣、高槓桿的衍生性金融商品。正是因為高風險，因此這種勝利帶來的快感，自然遠大於穩穩賺、風險較低的
    ETF。於是他誤認為過去的成功經驗（其實是運氣）可以永遠帶來成功。


    此類人很容易成為高風險投資的信徒，他們做決策之前，已經失去客觀理性的判斷能力，只會為自己心中的定見去找到支持的基礎。在這種狀況下，他們看到的「證據」往往是被偏見篩選過的未審先判，自然無法客觀。'
  merge: -1
  img_proc: true
- pgno: 269
  md: '# 情人眼裡出西施：撒帚自珍效應


    有一句話叫情人眼裡出西施，這句在投資上再貼切不過了。有學者做過這樣的實驗，可稱之為「撒帚自珍」效應。在學者康納曼等人的研究中，找來一群康乃爾大學法律系和經濟系的學生。這個實驗說來有點複雜，我把它簡化一下。實驗中，參與者被分為買家、賣家2組：


    第1組，參與者會先拿到一個杯子，教授詢問他要多少錢才願意出售這一個杯子？


    第2組，參與者會被問到，到底願意花多少錢買這個杯子？


    拿到杯子的人就是賣家，沒杯子的人是買家，在這一買一賣所創造的市場中，看出買家與賣家對於杯子價格的認知差距有多少？研究結果是：賣家出價（5.25美元）幾乎是買家組（2.75美元）的2倍。


    相同的杯子，為什麼認知會有這麼大的差距？原因在於那個東西是不是「你」的。賣家當然會老王賣'
  merge: -1
  img_proc: true
- pgno: 270
  md: '瓜，敝帚自珍，買家當然覺得愈低價愈好！


    自己擁有的東西，自我感覺良好，別人看來很平凡，自己卻覺得很不凡，是人中常見的現象。我後來經營電商，常常遇到希望我們幫他賣東西的人，價錢定得實在很高，卻認為消費者一定會買單。在我們看來，其實他的東西跟別人沒兩樣。甚至我還聽說過：「我們做的皮包跟愛馬仕一樣好，他一個可以賣百萬，我們才賣3萬，消費者如果不欣賞就是他們沒眼光！」這要從何說起？相信你已經笑出來了，可是製造商說得很認真。


    當我們擁有某樣東西、並且對它投注心力，這個東西對我們的價值感就改變了。就像小王子的玫瑰花對他是獨一無二、不可取代的一樣。請相信價值是虛幻的，很容易被人為主觀認知所扭曲。我稱它為「敝帚自珍效應」。


    「敝帚自珍」的意思是把自己家裡的破掃帚當成寶貝。這是行為經濟學中的一個迷惑。不只是在商品上，我也看過很多人，自認為懷才不遇，但依照客觀'
  merge: -1
  img_proc: true
- pgno: 271
  md: '評價而言，他的才華不過是平均水準。


    舉房地產市場為例，同樣一個中古屋物件買賣，雙方心目中的合理價格往往會有很大的落差，賣方會高估物件的價值，而買方則企圖低估。


    如果不能折衷妥協，那麼房子永遠賣不掉。心理原因也會影響價格，如果賣方缺錢，那買方就可能用比市場偏低的價格買得到。


    另一個影響你投資意願的心理學偏誤，則是「損失趨避」。簡單來說大家都喜歡獲得，更痛恨損失。諾貝爾經濟學獎得主塞勒發現，如果讓人選擇有 100% 的機率得到 1,000
    元，或是有 50% 的機率得到 2,000 元，多數人會選擇前者。一鳥在手，要比「不一定能得到的一百隻鳥」來得踏實，不是嗎？


    這跟投資有什麼關係？如果你有買賣過股票，這句話你一定講過：「只要我不賣，我就沒賠錢。」這就是反映投資者對於承認損失普遍的逃避心態。


    但講這句話的人忘了，股票也可能下市，或成為墜紙！你知道買錯 ETF 也會損失慘重嗎？2020 年，'
  merge: -1
  img_proc: true
- pgno: 272
  md: '元大 S&P 原油正向 2 倍 ETF（00672L）下市了，這是臺灣首檔原油期貨槓桿 ETF，原本備受期待，但歷經石油市場價格戰、新冠肺炎重創原油需求等利空因素，導致淨值重挫，始終無法回到
    2 元，最終慘遭下市，明明跌了很久，但是沒有下車的人有多少？只因為他們不想賠售，他們買的時候可能花 10 元啊！


    雖然最後交易日出現爆量逃命潮，但是依據證期局統計，到了完結篇落幕了，還有超過 2.8 萬名投資人持有該檔期貨 ETF，流通在外張數竟有近 180 萬張，這些人是不知不覺嗎？並不是，而是規避損失心理在作祟。一直等啊啊啊，希望守得雲開見月明，可惜事與願違。這個故事說明了：一，拜託你買安全性較大，資金池比較深的
    ETF 好嗎？二，如果你做了錯誤的投資，壯士斷腕也堪稱英雄！


    所有 ETF 都可以有長期效應嗎？肯定不是！2020 年共有五檔 ETF 下市，原因在於槓桿風險較大、規模太小、淨值太低。除了 00672L，2020 年下市的還包括國泰日本正
    2、國泰日本反 1、復華美國'
  merge: -1
  img_proc: true
- pgno: 273
  md: '金融服務業股票、新光 ICE 美國權值等。


    我個人是不會考慮槓桿與反向類型的 ETF，事實證明，這些標的可能比買臺灣金融股風險高很多！


    投資 ETF，不要企圖證明大多數人是錯的，只有你是對的！以證券投資信託 ETF 來說，如果近三十個營業日當股票型 ETF 平均規模低於 1 億元，即符合終止門檻，投信公司可依規定申請下市；而期貨信託
    ETF，當近三十個營業日平均淨值累積跌幅達到 90%（以期貨的本質來說真的不是不可能）或平均規模低於於下市門檻（多為 5,000 萬元），發行人應該是沒有翻本的能量了，報請金管會核准後，終止期貨信託契約，清算就是他的結局。


    所以千萬不要以為投資 ETF，就可以擁有長期效益，拜託你不要走偏門！


    # 如何克服理財的不當行為？


    克服偏誤，降低決策過程會出現的雜訊，對打算'
  merge: -1
  img_proc: true
- pgno: 274
  md: '獲得長期效益的人非常重要。


    同樣是以行為經濟學研究，獲得諾貝爾經濟學獎的康納曼，他認為要降低雜訊，首先要認知到「雜訊」的存在（請參看天下文化《雜訊》一書）。《雜訊》這本書厚且不易逐頁閱讀，但是揭示原則很簡單。


    人類在決策上，本來就是不理性的，很容易被影響。因此請你不要先入為主，過度相信直覺，不要驟下判斷，唯有了解客觀數據，才能做出理性決策。


    在自己決策的過程減少被情緒影響的可能，是提升決策品質的方法。用我買 ETF 的例子來說吧！在存 ETF 或存股時，乾脆不看漲跌，直接在每月六號購買一定數量，就是減少個人主觀偏誤，以免漲了不敢進，跌了不想進。定期定額投資讓帳戶自動扣款，就能減少中間的人為誤差。


    像是我和一位朋友同時購買某一家公司發行越南的 ETF 股票（當然理由是我們兩個都看好越南經濟的長期潛能）。他是隨機選擇（也就是每個月都買，'
  merge: -1
