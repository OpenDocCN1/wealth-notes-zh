  md: '# 10.

    不買房，如何當房東收租金？


    「金窩，銀窩，不如自己的狗窩」，房子是許多人心中的里程碑，一輩子的大事。但是，你一定要有自己的房子嗎？不買房還是有人在當房東，這要如何辦到？這位臺大社會系的學妹陶迪就找到一個「痛點」來擊穿。


    首先講一個觀念，那就是「所有權」與「使用權」的差異。過去從買房到買車，講的都是「所有權」，或是「買斷」的概念。你得把這棟房子或是車子，連同它們的權利與責任都一起收為己有。


    你聽過「共享經濟」的商業模式吧，已有不少人同意與其花大錢取得「所有權」，不妨用較少的成本取得「使用權」，既滿足需求，又不必負擔保管義'
  merge: -1
  img_proc: true
- pgno: 198
  md: '務，也就是「只交往、不結婚、不承諾未來」（這樣講大家容易懂）。


    老實說，這就是二房東的現代版，二房東也不是什麼新名詞。但是以前我們認知的二房東，比較像找租客來平分房租的模式，多半只是為了節省一點開支，但是陶迪的方式不一樣。


    # 「 加值型」 二房東，創造房東、租客雙贏


    現代「二房東」是「加值型」的，不只是把房間分租出去，而是打破空間既定限制，用創意與精力為空間加值。


    陶迪是個年輕清秀的女生也是臺灣大學社會學系的學妹，做事有很大的魄力，她看準在臺北市「房價太高，大家買不起」與「房客實在不好管」這兩大痛點，想到利用包租代管的方式。對於房東來說，確保一定收入的同時，也能享有有人把房子照顧好的結'
  merge: -1
  img_proc: true
- pgno: 199
  md: '果；對於租方來說，有專人重視租客需求，讓他們免於傳言中形形色色「惡霸房東」的困擾。


    特別是在三十年老屋比例超過 7 成的臺北市，像這種「加值型」的包租代管，其實就是一種房屋靈魂的「微改建」。沒有動到房屋架構，但是提升整體住客的使用體驗。


    # 表一 「加值型包租代管」成本獲利試算


    | 每月成本 | 9,000 租金 +1,000 管理費 |

    | --- | --- |

    | 每月租金 | 37,000 |

    | 年實收 * | 37,000×11-[9,000+1000]×12 = 287,000 |

    | 不計營業費用的回本時間（年） | 530,000÷287,000 = 約 1.85 年 |

    | 五年總毛利 | 905,000（287,000×5-530,000） |


    ※ 招租期以一個月計算，無租金收入


    這樣的投資模式，報酬率有多少呢？以陶迪提供的案例為例，她以五年、每月 9,000 元租價承租一


    198 人生實用商學院：富有是一種選擇'
