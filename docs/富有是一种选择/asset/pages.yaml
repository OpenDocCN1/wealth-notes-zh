  md: '用商學院》，就有酸民到平台上留言：「過氣藝人，不要來蹭新媒體流量，去教老人社區大學吧！」，我大概生氣了三分鐘，但是馬上莞爾一笑，化為動力。只要有受眾就可視為「商場」，比的是產品力，可不是董事長是否年輕有力。我覺得過氣跟失敗也挺好的，好好做節目，好好做生意，好好寫書，在不在榜上也無所謂。你知道重要的是什麼，我靠自己過去累積的所有學習，掌握自己一套拳法行走江湖。最重要的，是做自己。


