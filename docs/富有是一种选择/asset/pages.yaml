  md: '不確定性較高的獲利年限較久，獲利其實比較高。


    租客選擇也是關鍵。在日本大都會區，我喜歡可以租給餐廳或飲食店的物件。這些不動產符合都市人的剛性需求，比如東京，其實沒有那麼多人在家煮飯，外送不像臺灣這麼便宜，所以就算疫情再嚴重，外食市場還是很旺盛。餐廳也沒被強制關閉，商家還有機會得到政府補助，所以我們管理公司因疫情而退租的房客，只有約十分之一。


    講直白了，很多人說海外投資多好賺，商業模式再厲害，但是沒有找到對的人幫你探路，以及自己沒有仔細調查市場現況，都是很危險的事。


