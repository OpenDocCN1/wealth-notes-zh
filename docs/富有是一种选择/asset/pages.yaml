    # 理財黑歷史教我的

    四堂課


    中年之後才痛定思痛學理財，來得及嗎？我當然會說：來得及！但是請你別再投機，別相信運氣。對於理財，我其實是很後知後覺的人。一開始就打算做文青的人都是浪漫的，很怕繁瑣的事情，也很怕錢這回事（但不是討厭錢喔，花錢時總是暢快的，這兩件事情應該分開）。我吃了很多虧，到了四十歲才醒過來。


    來細數我的理財黑歷史好了。


