  md: '目前都更成功的案例，通常產權比較不複雜，當然也有那些產權複雜，但是管委會的組織能力超夠力而成功的，不過後者通常也得協調十年以上。只要扯到錢，連親兄弟都會翻臉啊，何況是鄰居呢？就算面積一樣，很多人就是會覺得我的樓層和位置比較好，我的裝潢比較新，認為自己有理由可以多一點，共識是不容易達成的。


    # Q 都更，危老，有什麼不同？


    房子會不會都更？等多久？有些概念我們必須懂得。首先俗稱的老梗可分成兩種：「都更」與「危老」耗費的年限與成果大不相同，建築業有個說法「屋主多，走都更；屋主少，跑危老」，這是大原則。兩個方式的條件與影響都不太一樣。至於怎麼選，就要看你的房屋符合哪一種條件。


    商學院第一要則：看數據，別只靠想像力！從結果來看，這兩者就有相當大的差別。都市更新截至'
  merge: -1
  img_proc: true
- pgno: 186
  md: '2022 年 3 月底為止，總核定案件還不到 1,000 件，而 2017 年才上路的危老，核准已經超過 2,000 件。


    「危老」為什麼容易得多？其實從「同意人數比」而言，怎麼看都更好像更好些。申請危老的前提是所有權人 100% 同意，與都更 80%。


    但是在條件和花費時間上，顯然危老比較容易通過。以申請面積來說，申請都更的「面積條件」是有限制的，都更基地面積，依照各縣市規定不太一樣，平均大致落在 1,000
    平方公尺（302.5 坪）左右。以台北市來說，先不考慮臨路、建築線等要件（可見要符合還真不容易），基地至少要 500 平方公尺（151.25 坪）才能申請，這可不是很小的面積喔。而且要取得都委會審定，過程真的要很久很久。


    「危老」這兩個字聽起來緊急多了，所以基地面積則沒有限制，基本上比較容易取得共識。但是所謂的「比較」，也只是比較，比如有棟老公寓基地的面積只有 50 坪，總共
    4 層樓，2、3、4 樓都同意了，但是 1 樓不同意，他把店面租給便利商店，租金很穩


    第二篇：資產 185'
