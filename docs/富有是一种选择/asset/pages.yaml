    # 誤解一：為我帶來益處的，就是資產？


    也許你覺得，是這個手機能讓我拍照更美、當網紅賺更多錢、專案管理更即時、能接觸更多的客戶、甚至還能在上面剪輯影片……但是我要提醒大家，這些收益不單單是你手機的功勞，更重要的是你的才華，還有所花費的時間和剪輯技巧。


    為什麼要釐清這件事情？如果你錯誤判斷某件商品或是服務是「資產」，等於就是給自己一個持續購買的藉口和動能。「功能強大的手機讓我的創作更順暢，因此我買手機是合理的」、「新車讓我的工作更安全，並且能使客戶看得起我，能拉到更多生意，換車是應該的」，這些想法在做出消費選擇時，經常'
