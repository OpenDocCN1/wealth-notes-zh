  md: '# **07.**


    # **買白住房，買新屋還是買中古屋？**


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_153_0.png)


    很多人在買房時，會在新屋還是中古屋之間糾結。尤其是在買第一間房又是白住房的時候。


    這個問題不好回答，但其實也沒那麼難，只要列出你「前三需求」就容易多了。世上沒有完美的答案。如果沒有想清楚自己的需求，還有需求之間的優劣次序，這個問題你永遠沒有答案。


    新屋（包括新成屋和預售屋）和中古屋各有優缺點，地點也是個大問題。我看過不少人在網路上問這個問題，公說公有理，婆說婆有理，其實每個人的需求都不一樣。資金不同、上班地點不同，誰又能替誰回答問題呢？如果你很明白自己的需求與資金是否相符，答案往往就很清楚。'
  merge: -1
  img_proc: true
- pgno: 154
  md: '先說新成屋與中古屋的差別，在裝潢花費上新成屋是有優勢的。新成屋通常不太需要另外花錢做裝潢，如果你能將就買了傢俱就住下，對於很多首購族或是房市菜鳥來說相對友善。中古屋年紀很大，因為屋況劣化，需追加的裝修成本會比較高。


    當然，所謂的有「不必裝潢優勢」，也因人而異。我看過不少人買了全新的房子，還是狠狠的把所有的建商送的裝潢都打掉，請設計師重新設計，務必盡善盡美，表示對自己多年的辛苦有所酬謝。完美主義者當然是要花大錢的。我旁邊就有好幾個例子：


    比如黃大米吧，她買了一間 1,800 萬元房子，採光很好，天花板也很高，屋況也還算新，不到十年。


    她買完房子之後，裝潢前請我去看她的房子。我跟她說：我覺得這個空間格局都很完整，妳一個人住，只要住一個房間就夠了，其他的都叫做自由使用空間，最好不要重新裝潢，也不要做什麼櫃子，原來的舊櫃子重新貼皮就好。


    她一邊心疼著 1,800 萬的房子貸款不算少，但卻'
  merge: -1
  img_proc: true
- pgno: 155
  md: '仍堅持要裝潢。理由是：「這個房間太大了，我習慣住小房間！」


    我有 many 很多裝瀆的經驗，我知道只要打牆壁，通常就等於整間都要打掉重練。於是我就施展我的鐵嘴神算：「只要你打抹房間牆壁動了格局，那麼你的裝潢費一定至少
    300 萬起跳！」


    她說她不相信，應該不會花那麼多錢，因為她是請她的同學來幫忙裝潢。關於請親友或同學裝潢，我個人的確也有一些「慘烈教訓」。我曾經裝潢一個小空間，請好友的朋友來裝潢，他原本報價是
    100 萬元左右（十八年前），於是我就很放心地交給他，也並沒有要求先出估價單；等裝好之後，我收到的帳單竟是 220 萬元！


    當然得照付，而且不能討價還價，也不好一一去檢查到底錢花在哪裡？不然就會嚴重損害友情！比較嚴重的是，我那個小空間竟然多了一個魚池，原因是那位設計師很喜歡魚，認為我應該要有一個魚池（在陽臺上跟室內相連，那個空間已經不到
    10 坪，魚池'
