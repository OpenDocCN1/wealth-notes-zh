  md: '他說：試想一下，假設你從 1900 年至 2019 年每個月都省下 1 美元，會發生什麼事？這裡有三個投資人。


    **第1個叫做蘇**，每個月都很規律的把一美元投入美國股市裡，無論景氣好壞。就算經濟學家大聲疾呼經濟衰退逼近，或是新的空頭市場即將來襲，她都聞風不動，依舊非常有規律的投資。


    **第2個叫做吉姆**，他是一個很了解經濟是否會衰退，擅長躲避災難的人。他在經濟還沒有步入衰退的期間，每月投資一美元到股市，在經濟衰退的時候就賣光所有持股，然後每個月都省下那一元現金，等到經濟看起來復甦了，再把所有資金投入股市。


    **第3個叫湯姆**，他也是在經濟狀況還 OK 的時候每個月投資 1 美元，但和一般人一樣，會在經濟衰退幾個月後嚇得退出市場，賣光持股，然後花了一段時間（用六個月計算）才拾回信心，重返股市，重新開始他的規律投資。


    隨著時間過去，這三位投資人最後誰會最有錢？答案是：蘇最後有 435,551 美元。吉姆有 257,386 美'
  merge: -1
  img_proc: true
- pgno: 120
  md: '元。湯姆有 234,476 美元。蘇大獲全勝。


    為什麼？以美國股市而言，向上的機率近 8 成。臺灣也差不多。1900 年至 2019 年間的 1,428 個月中，只有 300 多個月處於衰退期，占整體時間的
    22%。所以，看起來比較笨的蘇在衰退期的期間保持冷靜，仍然堅持紀律（原理很簡單，如果你注重長期效益，那麼在低檔的時候進場，不是可以用同樣的錢買更多的股數嗎？），結果她的獲利績效比較有市場感的吉姆或湯姆幾乎高出
    75%。後面這兩位會適時退出的人，利滾利績效其實也差不多！


    證明長期來說你不會真的比大盤指數聰明。


    具體來說，你不如只要選好一種大型 ETF，持續買進並且持有。萬一要將部份資金從股市抽出，也不妨轉換為有收益的資產，比如：有收益型不動產（但是這其中詐術很多，千萬小心！），來擴大自己的投資組合。「我有投資型存款」的安全感很重要，有穩定的投資方式，你會精神愉快自信飽滿，不需要為錢憂慮，你才會有力氣去做更多想做的事。'
