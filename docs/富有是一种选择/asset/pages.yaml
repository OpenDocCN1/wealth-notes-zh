  md: '過了七年之後，有一天被通知，某建設公司已經從政府那邊得到土地權，而且依法可以執行都更，而且並不需要得到我們這些屋主的通知（你看，人家也是民主國家，但是在都更執行的力度上顯然快準狠，畢竟日本的都更危老還比我們多更多）。


    這間房子的財務報表大體是這樣算的（為了方便，用最簡單的臺幣價格來說明）：


    如果我們當它本來是 300 萬臺幣的話，六年時間每年收入 30 萬，最後建商依法用 650 萬收購。收購過程就是某一天請屋主去現場那裡填一個單子，跟租客也是依法無條件解除租約，至於租客要住到哪裡去，我其實也不知道，反正我也不認識他，因為政府或建商會有另外的輔助。


    重點在於沒有人可以當釘子戶，所有人跟租客都要依法撤離！（這一點我說給臺灣的建商朋友聽他們都覺得超酷）所以這個案子結案的稅前盈利很容易算出來，也就是：六年賺了
    180 萬租金，房屋的買賣資本利得是 350 萬元，中間仲介代為跑腿以及種種的費'
