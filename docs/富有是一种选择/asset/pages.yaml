  md: '合我的需求。一言以蔽之，看房的是你，住在這間房子的也是你，應該要把主動權掌握在自己手上。別人講什麼請都當成推銷辭令。


    在條件設定上別貪心，先設定當下人生階段的需求，前三名符合就夠。要不然，明明單身錢不夠，只能買個小房，你卻想到未來結婚會生兩個孩子，還有肯來照顧孩子的丈母娘。簡單一句話：想太遠，你就會變成「好高騖遠」。如果你真的深謀遠慮，頂多想個未來五年就夠了。如果是買當下自住房，就把那些「十年後會有捷運」的宣傳詞刪掉吧。買自住，重要的是方便，以及你願意住，不要把「會不會漲價」、「讓我致富」放進條件前三名。什麼都想要，神仙也會發笑。


