  md: '續穩穩地上漲。


    如果你是首購族，拜託不要考慮什麼海外不動產，在臺灣買第一間房才務實。除非你有特別的工作需求，例如被長期派駐海外，或錢很多花不完，否則本章也可以不要看。若只是因為想在別的國家有個「行館」，我覺得你還不如把錢省下來住五星級飯店就好。相信我，選你最喜歡的飯店住，不管怎麼樣都比海外買房划算。


    大體而言，會想在海外置產的人，多半也是抱持著投資和分散資產的想法。有哪些應該注意的眉角呢？


    # 第一，找當地有牌的仲介吧！


    想要在海外投資不吃虧，練好當地語言恐怕也來不及，建立當地的人脈，直接跟當地的建商或仲介打交道很重要。不然你常會遇到「臺灣人騙臺灣人」的問題，因為資訊不對稱嘛！


    在我看來，那些會招待你去看房，幫你出旅費，'
  merge: -1
  img_proc: true
- pgno: 221
  md: '都是「羊毛出在羊身上」。在海外對你小氣的仲介，還可能比較正派（我只是說可能，我也遇過小氣但是不正派的）。


    我記得有一次，有朋友招待我到東南亞的某國去玩（我真的沒辦法講得太明白），同團都是貴婦或是主要顧客。雖然我們目的是為了玩，也玩得很開心，但天底下沒有白吃的午餐，還是要去看看他們推薦的房地產。那個物件位在當地某一個知名的購物中心附近，當然是一片未開發區。


    招待者一直強調這裡的潛力很大，而且價格很便宜。不過，我後來到那個購物中心去逛街，竟然發現有該國知名仲介也在賣同一個房地產！喜歡偷偷脫隊去逍遙，雖然是不太有團隊精神的行為，但也讓我發現一個巨大的祕密：招待我的那個建商每坪約賣
    35 萬元，但是購物中心那個該國知名仲介在賣的價格只有每坪 18 萬元！如果我買了，我的旅費就會變得十分高昂！


    大家如果還有印象的話，2010 年左右，臺灣還'
