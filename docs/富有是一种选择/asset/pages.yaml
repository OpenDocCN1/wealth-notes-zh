  md: '臺股也有此類 ETF 了。我的朋友從十二年前投資美國的 REITs，某日看見自己的投資本金項目變成「負數」，為什麼？因為平均報酬也是 6% 左右，所以他也已回本了，他拿回的配息已超過本金。


