  md: '去找「相對便宜」的好股票。


    你知道嗎？學會一招半式就去江湖闖蕩的人，比什麼都不會的人更危險，因為少了自知之明。我記得當時拿了 100 萬元精挑細選，買了三家公司的股票，有的後來竟然下市了，過了一年剩下不到
