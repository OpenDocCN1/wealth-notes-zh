    5%（大部分績優銀行股也差不多）。以 80 萬計算，大概每年可領 4 萬股利，就算每年要還 12 萬元貸款，也只剩 8 萬元要自己掏錢。那麼這七年可以賺多少錢呢？只有第一年必須要還
