    專業投資者還會去看題材、籌碼、技術，甚至把過去幾年的財報攤開仔細比較。其實專家自己也知道做完這些功課，還不能保證你一定獲利。更不用說你只靠雜誌跟理財書得到一知半解，就要在股海賺錢，甚至翻轉人生，這個聽起來確實不太靠譜。


