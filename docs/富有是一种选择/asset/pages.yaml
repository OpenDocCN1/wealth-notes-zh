  md: '# 12. 海外投資房地產，哪些眉角不可少？


    「漲、漲、漲」，疫情明明為難了大家好幾年，讓我們不但失去旅行的自由，而且面臨生命的威脅，但世界各大都市的房子到底在漲什麼？連東京都在漲（話說全日本的漲幅不代表東京漲幅，因為這個老化國家的偏遠地區根本沒人住、沒人買，不會漲）。


    根據全球房價指數 2021 年第四季統計，在接受調查的 56 個國家裡，全世界房價漲幅前五名分別是土耳其、紐西蘭、捷克、斯洛伐克與澳洲，這裡面也有單一國家「貨幣貶值」的因素（不管怎麼主張，用美元算起來其實一樣），以土耳其來說，因為貨幣「跌跌」不休，房地產被視為保值工具。雖然感覺漲幅第一名，但也不要太高興，相對於美元未必'
