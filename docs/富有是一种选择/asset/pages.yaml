- pgno: 248
  md: '# 第2② 以開放性思維找到成功的方法。


    愈有創造性的人，就愈有希望感。就像剛才懷斯曼的實驗，鑽牛角尖、只會乖乖按照指示行事的人，視角淺窄沒有辦法做全盤考慮，就會忽略更有效的作法；當情勢發生轉變時，反而會不知所措。


    我在旅行中遇到這樣的朋友，原訂今天要去 A 博物館，結果一去發現 A 因故臨時休館。他馬上悶悶不樂覺得自己很衰，影響一整天的行程。這樣的人，沒彈性，只要想做的事情被扯掉一個環節，就不知道如何進行。


    事情並不總按照你希望的方式進行，就算你胸有成竹，也要準備其它備案。你可以透過備案，就算某些事悖離你的預期，仍隨機應變來達成目標，才不會讓世事無常影響你的希望感。


    # 第③ 面對壓力時，用行動脫離困境。


    大家都會說，心動不如馬上行動，面對壓力也是如此。應該當機立斷，主動跳脫把你困住的情境，激勵自己繼續前進，避免陷入鑽牛角尖的決策陷阱。'
  merge: -1
  img_proc: true
- pgno: 249
  md: '當人深陷壓力中，就像古人所說的，「一葉障目，不見泰山；兩豆塞耳，不聞雷霆。」，一點小事就能影響你的決策品質，影響你的情商，事後還得付出更高的代價才能挽救。


    # 第④ 落實時間管理。


    要保持人生的主動性，就要降低讓自己「被迫行動」的可能性。如果一個人常常被時限追著跑，他勢必要為了避免逾期而採取各種應急措施，甚至不斷為自己找藉口，在理財上也會造成費用超支。例如上班快遲到了，所以只能搭費用較高的計程車，這些懊悔的情緒，在事後都會累積為負面情緒，削弱你的希望感。


    # 改變比較心態，打破零和賽局迷思


    除了主動性，打造希望感還要打破另一個迷思，那就是打破零和困境。


    所謂零和賽局，簡單來說就是你贏我輸、你死我'
  merge: -1
  img_proc: true
- pgno: 250
  md: '活的思維。這通常發生在職場競爭上，但事實上在生活、家庭也隨處可見。多數人都希望自己的目標必須 100% 達成，不能讓步，因而總變成「別人的快樂，必然建立在痛苦上」的狀況。


    如果你還用這種方式看待人際關係或商業競爭，就代表你的思考路徑被限縮了，陷入比較心態，動不動就怕別人比你好，反而無法專注在真正重要的目標。在競爭中變成一個沒有自主權的棋子，也會變得目光如豆。


    請看自己的目標，忘記競爭排行榜。


    甚至你要忘記所謂的外在評價。


    心理學家馬斯洛曾經在他的書中寫到：一個人最穩定和最健康的自尊，不是建立在外在的名聲、聲望以及毫無根據的奉承之上。但很多人不明白這個道理，渴望得到「大家的讚許」，並以為這就是希望感，其實是不自信的表现。'
  merge: -1
  img_proc: true
