  md: '較有保障。因為房子是資產，進可攻退可守，至少可以拿來借利息比較低的貸款應急。未婚時「啃老」似乎很正常，住在家裡很習慣，可以省房租跟飯錢，爸媽也不想讓你搬走，所以很多人想：何必買房找麻煩？買了房子，就算家人幫忙負擔些許頭期款，後續裝演費很貴、房貸與獨立生活都是成本，加上薪水原地踏步，買房動機也就一年一年被澆熄。


