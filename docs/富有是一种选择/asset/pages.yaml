    # 大通膨時代，為何貸方比較有利？


    剛才講的是基本原則，如果再加上通膨環境的時空背景，你就會知道為什麼有錢人會更積極借錢。


    簡單的說「利息」指的就是資金的使用成本。當物價持續成長，你手上持有現金的「實際價值」也會以同樣的速度減損——利息也是。


    舉例來說，今年你向銀行借 1,000 萬元，年利率是'
  merge: -1
  img_proc: true
- pgno: 91
  md: '2%，如果申請延遲還本金，因此每年還款利息是20萬元。如果利率不變，這20萬元的每年負擔也會隨著通膨而變少。而你向銀行借的1,000萬元也會隨著通膨而變得沒那麼像鉅款。我們對「鉅款」的感覺很容易被「通膨」遏止。舉個例子來說吧，我爸在三十年前買了臺北的「三房無電梯5樓」老公寓，當時花了260萬元，朋友賣給他的，大家都說他買貴了，因為隔壁鄰居才買220萬元呀，當時我爸也著實被我媽說了一頓！


