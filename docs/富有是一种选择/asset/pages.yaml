- pgno: 45
  md: '都當朋友。如果要活得愉快，就要跟正向的人做朋友；會帶給你負面能量的人，那就斷捨離，至少你不會因為跟人溝通而感到沮喪。溝通本來就應該是愉快的，不必跟讓你不舒服的人來往。就算那個讓你不舒服的人是親人，說真的也不必一直「相濡以沫」，保持點距離，人生更寬闊，不常相見彼此不會愁苦那麼多。


    # ⑤ 存下收入的 2 成


    坐吃山空是很可怕的事，為了避免這樣的慘劇，從年輕時一定要養成這個習慣。我常會對沒有積蓄的人說：「存 10% 總可以吧？」老實說，存 10% 我覺得是有點少，你賺的錢愈多，那比例就應該要提高。比如月入
    3 萬元時，也許你只能存 3,000 元；但是如果你有斜槓收入月入 6 萬元，且只需扶養自己，應該存 3 萬元，因為你並不比因收入變多而膨脹消費金額，這樣才能存下第一桶金。不要輕易變成「暴發戶」，所謂暴發戶，在我看來不是指錢多的人，而是指隨著收入膨脹，就開始任意花錢的人。最應該培養'
