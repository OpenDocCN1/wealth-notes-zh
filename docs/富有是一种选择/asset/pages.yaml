  md: '無論如何，借錢投資一定要有穩定收入、事先做好還款能力評估。如果你想要像不敗教主這樣賺錢，說穿了還是要非常有紀律和自制力。但股利是每年領一次，借錢後卻是每個月要還錢，因此必須做好預算規劃，確保不會影響日常生活，陳重銘強調，一定要有穩定的工作，收入不穩定又要每月還貸款，會蠟燭兩頭燒。而且必須評估最壞狀況下（例如當年公司虧損無法配息），生活與還款能力會不會受影響？如果一個人負債僅占总資產不到
