  md: '# 09. 買房等都更，可行嗎？


    經濟起飛期，每一個城市都會大量興建房子。我們已經離經濟起飛期很久了，而且扎扎實實地步入人口老化期，尤其在臺北，如果你跟我一起去看過中古屋的話。在看屋的時候，就會聽到一種有趣的話術：


    「我跟你說，這間房子面臨大馬路，屋齡又夠老，買了放著等個十年，都更就會賺很多，老房子直接換新房子，多划算啊！」


    「這房子已經有建商在評估，都更只是早晚的事，到時候價錢就會飛上枝頭了！」


    「與其買荒郊野外，不如賭這邊，隔壁棟都已經在整合都更了。你不要看它老，最近很多投資客都搶著買這裡！」'
  merge: -1
  img_proc: true
- pgno: 183
  md: '只要賣的是三十年以上的老房子，尤其長得像廢墟的，幾乎都會聽到都更的美麗紅利。都更這件事，可信嗎？


    應該每個在臺北市看過房子的人都聽過這個說法。以都更案最多的臺北市來說，有設籍的房屋大概 90 萬戶，平均壽命三十五年。其中三十年以上房子，總共有 70 萬戶左右，四十年以上則是
    36 萬戶。你買到老屋的機率，要比買不到還要來得高。


    會買臺北市的老屋除了位置好，多數心裡都會期待都更，讓建商幫忙「點石成金」蓋新屋。在老屋林立的臺北市，這聽起來很合理，但是實際上真正「被都更的有多少」呢？


    用數字看最清楚：從 1998 年到 2021 年，臺北市都更成案的件數總計 500 件，換算老房子的戶數與成功機會，大概是 1.7%，二十三年加起來 1.7%。我的學弟，做了十七年都更建商的黃張維（耕新建設董事長）開玩笑說：「在臺北市要都更成功，機率可能跟中樂透或刮刮樂差不多。」'
  merge: -1
  img_proc: true
- pgno: 184
  md: '而且這個數字是在寸土寸金的臺北才有的機率。到底你有沒有可能成為這不到 2% 的幸運兒？大體來說，周邊房價行情愈好，重建後才有上漲空間，建商才有採取行動的誘因。如果你的房子是在天涯海角，沒有市場行情來保證，都更機率還會小更多。不是房子老就值得都更，要房子所在地段值錢才有都更的可能，都更不是「扶老濟貧」的慈善事業。


    換句話說，假設有人在你看房子的時候跟你說，「一點也不貴，別看它老，這個房子不久就有機會都更喔」，他說的機會其實就是 1.7%。你覺得這個機率是高還是低？


    都更是繁瑣且曠日廢時的事情，不少已成功的都更案都曾經跟釘子戶周旋許久，甚至還引發社會事件。


    買舊換新當然是一件讓人期待的美事，但大家一定要有一個概念：都更真的不容易，並不是房子非常老舊，會垮、會倒，就會有都更天使上門來。「都更磨三代，危老怕釘子」這句話說盡了都更的辛苦。'
