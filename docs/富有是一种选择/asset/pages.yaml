  md: '# 通膨醞斯拉來了！為何

    有資產的人才能生存？


    如果要為 2021 年下一個關鍵字，我個人認為就是「通膨」。在我做 Podcast《人生實用商學院》開始，我們就不斷論述通膨的概念與因應之道。這幾年來，愈來愈嚴重。


    目前，出現的狀況是：消費者物價指數那麼高，而實質經濟其實不好，不過消費者擔心的升息也不會是無止境的。如果為了抑制通膨拚了命升息，從數字面來看很危險，根本就是政府自己掐住脖子，特別是那些債務已經超過
    GDP 的國家！


    同時擔心著通膨和經濟衰退，經濟學家說這和 1973-75 年全球唯一一次停滯性通貨膨脹（stagflation）很像。原因恐怕就是因為這些年來印鈔太多，且貨幣'
  merge: -1
  img_proc: true
- pgno: 54
  md: '可以流通於全世界的國家，鈔票拚了命地印，錢不斷地發，卻沒有對實質經濟有所促進。所以「通膨」和「經濟衰退」這兩個平常並不愛搭檔的朋友，一起來拜訪。


    這一次全世界的通膨，肯定比以前所有的通膨都難收拾！


    你可能已經開始感受到通膨對生活的影響：有開車的人，會發現油價已攀升許久；路邊攤和餐廳的食物也開始調高價格。就算不漲價，你也會發現份量似乎變少了。數字會說話（如圖一所示），包括油料費在內的交通與通訊類物價指數，在
    2021 年物價成長超過 5%。


    你不能怪他們，因為如果不漲價，他們撐不過原料的上漲。臺灣人習於用搶菜對付颱風、疫情或任何民生物資的漲價、用買房對付錢變薄……這些事都發生了。'
