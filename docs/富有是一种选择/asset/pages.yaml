  md: '一，它離夢中的東京大學很接近，打開窗戶跳下操場就到了（對不起，我真的只是在開玩笑），二，因為是地上權不需要繳交房屋稅，甚至老房子也沒有管理費，每平方公尺大概只有35萬日圓，以當時匯率來說大概就是每坪只要新臺幣30萬出頭單價很便宜，這個在東京蛋黃區簡直是跳樓價！


    而且它是一個 owner change 物件，也就是在購買投資用公寓／大樓及獨戶住宅時，房產的所有者保持租客現有的狀態出售此房產，即「帶租約」出售。裡面已經住著東大的學生，每年的租金回報大概有10%，雖然是老舊建築，但是全數租滿。大學生都是很懶的，你我都曾經是，所以應該可以明白，他們期待一睡醒刷完牙五分鐘之後就能進教室的想法。


    不只買下同時承接租約，而且當時房地產租賃公司還算賺錢，收入比支出高，所以需要創造一點支出（這是日本的法令，租賃公司購買地產是可以報支出的），反正這位粗枝大葉的執行董事就這樣把它買下來。'
