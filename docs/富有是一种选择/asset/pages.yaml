  md: '# **Introduction**


    # 富有是一種能力——

    ## 商學院教會我什麼？


    一開始去念商學院的原因很簡單：我想學理財。這當然是一場天大的誤會，誤打誤撞、僥倖考上後才發現，商學院其實不會教你怎麼理財。事實上理財成不成功，也跟商學院成績沒任何直接關係。商學院頂多就是教你看懂財務報表、會計原則，還有成功企業的策略思考。


    第一次讀商學院的時候，我其實就是個自由工作者（其實就是打工）。寫過書，主持過節目，在理財上鴆鴆鳥，既沒有公司要管理，也缺乏商學院相關基本知識。我很認真地念了一本「圖解財報」之類的書和「企業管理」的大眾版書籍，僥倖讓我考上臺大
    EMBA。


    老實說，在念 EMBA 之前，我對商學院基本觀


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_23_0.png)'
