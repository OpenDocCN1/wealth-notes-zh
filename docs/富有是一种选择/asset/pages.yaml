  md: '率較高，現金很容易被妳花掉，這件事也更考驗投資人的理財紀律。若是將信貸拿去吃喝玩樂，還不起之後又變成支付循環利率。資金成本很快地就會節節攀升，陷入以債養債的地獄。我有個朋友是日式酒店的媽媽桑，她告訴我，當年把她逼入六條通求職的原因，就是因為她欠了現金卡債
    80 萬元。在百貨公司工作的她，每月薪水拿來付利息都不夠。後來因為還不起，她成為債務逃兵。近二十年過去了，你猜她的債務變成多少錢？天哪，超過 2,000 萬元！不要忘記，沒還的債也在以「複利」計算成長。


    # ③ 投資選擇。


    就算知道應該善用資金，透過投資買入資產，但是因為債務而感到壓力的人這時會陷入一個兩難：應該買進並長期持有資產，還是短線操作，快速變現？


    如果選擇前者，在可見的未來，你會為了這筆借貸負擔額外利息，但如果想靠快速投資還錢：你要如何保證，每一次短線投資都一定有獲利？'
