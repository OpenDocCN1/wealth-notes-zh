- pgno: 260
  md: '箭發射成功之前，他可是內外交逼、壓力炸鍋，已到曾焦頭爛額，差點要承認自己完蛋的地步。然而他還是順利堅持撐過危機。


    就像他的一位朋友，也就是知名投資專家安東尼·葛拉奇亞說的，他對馬斯克在這段時間的堅韌表現印象深刻。「就算是面對破產與離婚官司，馬斯克仍然比任何人努力工作，承受更多的壓力，並且保持專注目標不變。」


    大多數人面對壓力時會很惱怒、煩躁，而且因此失去理性。而馬斯克仍能展現理智，並且做出明確且展望長遠的判斷。「凡是親眼目睹他經過的這一切的人，都會更加敬佩他。」


    看一個人忍受著痛苦，還如此堅強，如此執著，我們都會對這樣的人心生敬佩。我們心中真正英雄並不是像項羽到了垓下，他說的是：「我已經都輸成這樣子，怎麼回去見江東父老呢？還不如死了算了！」那叫做悲劇英雄，而悲劇英雄絕對不是成功者。


    第三篇：心法   259'
