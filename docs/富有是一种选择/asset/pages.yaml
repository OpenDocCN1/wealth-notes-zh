- pgno: 21
  md: '再復雜的原則，都將敗給時間；任何自作聰明，都將敗給黑天鵝。有被時間證明過的觀念，注重長期效益，累積被動收入，才不會非常辛苦的在跟時間賽跑。


    你當然要持續投資自己的人生愛好，還有投資自己的健康；如此，科技醫療所帶來的長壽對人類才是一種祝福。


    理財，不是敗給「不會」，也不是敗給「不想」，而是敗給「不做」，誰都可以做到！不過，真正實行的過程也不是那麼簡單。套一句賈伯斯的話說，當你要對一件事情說Yes，表示要對一百件事情說No！


    你要相信你能！」


    理財的力量也是一種心靈的力量。世界變化多端，永遠不要陷入宿命論，誤以為世界上的一切都是天命、什麼也改不了。無論你的生活狀況如何，你總是可以做些什麼，至少可以相信自己的想法，掌握自己的行为方向，運用你手上的金錢勞力，保持對生活的興趣與熱情！'
