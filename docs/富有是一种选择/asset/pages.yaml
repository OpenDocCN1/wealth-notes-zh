  md: '# 19.


    # 在你富可敵國之前，未上市股票不要買


    在這一章，我來談我跟朋友的一段理財黑歷史。把自己的蠢行為當範例。先說結論：除非真的有能力投資未上市股票，不管你的內線消息多靈通，跟你有多親近，以及他多有把握，甚至董事長就是你舅舅，結論都一樣：不要買。


    # 價格不透明，流動性風險高


    什麼是未上市公司？廣義來說，就是還沒上市或上櫃的公司，其中又分為公開發行公司與未公開發行公司。公開發行公司的股票雖然不能在股票市場上買賣，卻可以透過合法券商購買；反之，未公開發行公'
  merge: -1
  img_proc: true
- pgno: 298
  md: '司則只能私人交易，必須由該公司賣給你。


    為什麼我「曾經」投資未上市股票？倒也不是為了投資或是理財，一方面是因為交情，一方面也是相信該公司的某項發明大有前途。


    這位友人學有專精，研究發明的確是有相當成就，取得了不少國際專利。但光是產品好與技術領先是不夠的，還是要看營運者的心態以及經營公司的能力，還有是否願意對大眾保持誠信。


    畢竟公司歸公司，研發歸研發，公司不是研究者自己開的。經營者本性不好，好的專利也可能被做成爛產品，好產品也會因為一時策略失準，被短視近利的經營者破壞了所謂大好前程。


    要看出經營者的「真心」，其實從很多小事情就能看出端倪。我曾遇過公司假借公益來賺錢，產品賣上千元，結果只捐十元，卻騙大家是在做公益。也看過某公司長年經營虧損，但是
    CEO 的名車倒是換個不停。我投的這家公司就發生過「以售價 1% 做公益」但大打慈善牌，還有因為某種原料成本較低而任


