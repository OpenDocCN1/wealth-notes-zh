  md: '# 無債一身輕？理性負債也是一種理財行為


    ![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_86_0.png)


    講到理財，在一般人的心目中就是管「理」錢「財」；但在大通膨時代，你要理的不只是「財」，還有「債」。


    有位朋友，因為他不喜歡欠錢，買什麼都喜歡一次付清，為了買房不斷存錢，存到四十五歲房價又漲了，算算手中的錢只買得起小套房。人生沒有後悔藥，如果十年前他向女友求婚時願意適時運用槓桿，放棄「全付才有安全感」的堅持，申請房貸（當時房貸利率約2%），當時1,000萬元在臺中已經可以買很大的房子了，大概和他房租也差不多，現在他應該擁有一間3房的房子，絕不是在為房東調漲租金而憤怒。'
  merge: -1
