  md: '![](img/29b9f4ff9b180d2071ae27e7da9b9b7b_103_0.png)


    # **鍊金筆記**


    房貸真的會使你備感壓力？我們會自然而然感覺到壓力，以及焦慮。但是壓力到底是什麼東西來著？我們來看看壓力的正面意義：


    +   一、它是一種提醒，讓你更警覺地面對問題，提升自己，並且解決問題。


    +   二、承受壓力的感覺，是你應變外在事件所產生的心理狀況。


    +   三、焦慮則是你對於壓力的來臨所產生的顧慮和恐懼。


    當你了解它們的定義，你就能更平靜地面對壓力和焦慮。'
