- pgno: 277
  md: '# 17. 錨定效應會讓你大腦產生錯覺？


    我們的大腦會騙自己嗎？


    答案當然是肯定的，在藝術世界裡很多畫家善於使用錯覺或是視覺殘留的方式，帶給觀看者超越直覺的視覺饗宴，很有名的天才畫家達利就是箇中翹楚。他有一幅美國總統林肯的畫像，近看完全看不出來，要站到
    20 公尺外才能看到。


    還有另一幅畫，你盯著畫上的藍色球 30 秒，再把目光看向白色牆壁時，你會發現牆上冒出好幾顆球。因為你長時間盯著藍色色塊，引發視覺暫留的現象。


    難道是我們的大腦特別容易受騙？的確如此，它很容易受到外界毫不相干的資訊的影響。而且這種因'
  merge: -1
  img_proc: true
- pgno: 278
  md: '為既定印象而引發的錯覺，不是只發生在藝術上而已，還常發生在理財上。


    # 康納曼的實驗


    我們在上一篇介紹過的著名行為經濟學者康納曼，曾經在奧勒岡大學做过幸運大輪盤實驗。這個經過設計的輪盤，上面標示 0 到 100 的數字，看似隨機選擇，但實際上不管數字怎麼轉，都只會停在
    10 和 65 這兩個數字上。


    測試者在看過轉完輪盤出現的數字後，接著回答一個問題：「你認為聯合國中，非洲會員國的比例是多少？」


    照理來說，輪盤上的數字，和這問題八竿子打不著關係。受試者照理來說應該不會被影響。但是康納曼教授在實驗中發現，看到輪盤轉到 10 的人，會估計非洲會員國的比例為
    25%；而看到 65 的人，平均估計比例為 45%（正確答案大概是 28%）。'
  merge: -1
  img_proc: true
- pgno: 279
  md: '這就是奇妙的「錨定效應」。人們在做決定時，往往會被第一時間的片段資訊所影響，並不知不覺地以此為判斷基準，然後稍稍修正一下。為什麼叫做錨定？這個靈感來自要靠岸的船得先下錨固定，再移動船身，才能停在準確位置。


    我曾經在Podcast《人生實用商學院》中問我們非常聰明的來賓林峰丞一個問題，你可以用你的直覺或知識試著回答，請問成吉思汗西征發生在哪一年？


    +   1. 請問這個事件是發生在西元200年的之前還是之後？


    +   2. 還有請你大概猜猜看成吉思汗是在哪一年去世的？（給你五分鐘，不可以查手機）


    事實上這些事件離「西元200年」超級遠，但是這個莫名其妙的數字就偏偏放進你腦海裡了。也許你會覺得這個數字不太對勁，但它還是會影響你的答案，讓你低估成吉思汗過世的時間。西征當然是發生'
  merge: -1
  img_proc: true
- pgno: 280
  md: '在西元 200 年之後很久。而有關於成吉思汗的死亡，大家平均都猜出西元 6、700 年之類的答案。


    事實上，成吉思汗西征真正的年份是 1219 年，而成吉思汗去世於西元 1227 年。這個例子證明人類很容易被影響，雖然別人告訴你的錨定數據不合理，你還是會被它左右。


    歷史上有一個非常厲害的行銷案，是由知名的珠寶品牌 Harry Winston 創造的。這個品牌到現在，還是許多名人、仕女所夢寐以求的。明明是同一個品質的一克拉鑽戒，它就是可以比別人貴
    3 倍。為什麼？消費者就是覺得它值得呀！即便從未使用低價來和其他業者競爭，照樣有人願意買單。


    1973 年，當時珍珠大王薩爾瓦多・阿薩爾擁有一堆大溪地黑珍珠，找上了他的好朋友傳奇鑽石大亨海瑞・溫斯頓幫忙。人們當時對黑珍珠是很陌生的，不過奇貨可居，就看你怎麼行銷。


    溫斯頓將這批黑珍珠放在他的店裡，也就是紐約第五大道的珠寶店櫥窗裡展示，故意標了令人咋舌的'
  merge: -1
  img_proc: true
- pgno: 281
  md: '價格。他同時也買了廣告，在時尚雜誌裡讓昂貴的鑽石、紅綠寶石在一顆閃亮的黑珍珠旁邊隨意擺放，感覺像眾星拱月一般。


    原本實在賣不出去的黑珍珠，瞬間變成誰都想要、搶手的珍貴珠寶，在當時價格媲美鑽石。這就是運用錨定作用的最佳行銷，從此所有的商家都學到了！


    這個「計謀」你應該也看懂了：阿薩爾的好朋友目光遠大，而且的確是一個行銷高手。他不只是想把黑珍珠賣出去而已，他要幫黑珍珠謀求歷史定位！


    他的所作所為就是把黑珍珠設定為高價珠寶，對沒有看過黑珍珠，但是對鑽石的行情比較清楚的消費者們暗示「嘿嘿，它很貴喔，有了它，比擁有鑽石更令人稱羨」！（閒話一句，由於養殖技術的進步，現在的大溪地黑珍珠真的很便宜。10mm
    左右的完美黑珍珠，在批發市場新臺幣 2,000 元有找）


    許多年過去，消費者還是無法抵抗錨定作用的影響，比如說百貨公司的花車裡面，常常有標價一萬元打一折的衣服，消費者仍然相信他們買到品質優良的'
  merge: -1
  img_proc: true
- pgno: 282
  md: '便宜貨！還有超商也常常用這一招：礦泉水一瓶 20 元；2 瓶 30 元，不怕拿太重的消費者，就會買兩瓶。完全忘了自己也許正在跑步，帶兩瓶是自己找麻煩。


    你看看各大購物平台就知道了，一定有一個定價，打了個叉，然後才告訴你真正的售價，就是要讓你覺得你賺到了呀。是的，你上當了。但這就是人之常情，你感覺好就好。


    這些實驗告訴我們：人的大腦，其實沒有像自己想像的那麼理性，我們總是在尋求線索幫助我們做判斷，即便與你毫不相關的線索，也可能影響到你的決策。也許你的學識會對你有幫助，但老實說並不能百分之百「免疫」。


    # 大腦為何催促你做錯誤決定？


    什麼東西比較容易運用錨定作用讓你失去判斷力？答案是你不熟悉的產品。新產品、新科技、新技術或是新設計的定價我們無從參考，只要加一些促銷'
  merge: -1
  img_proc: true
- pgno: 283
  md: '技巧，就會影響你對這項商品的評價。


    曾有一個與我合作過的廠商，他給商品的定價是每盒 2,800 元，促銷價則是 2 盒 4,000。但是在廣告海報上，卻沒有把原價資訊寫上去。我跟他們反映，請他們寫上單盒售價，但老闆卻回答：「買一盒不划算，不會有人買的，寫一盒的價格做什麼？」我堅持還是要寫上單盒原價，不然「錨定效應」無法作用，消費者不知道品牌的「誠意」有多厚。後來這位老闆念了
    EMBA，有天很興奮地打電話給我說：「我終於知道為什麼一定要寫單盒原價了！」


    我自己也經常著了錨定效應的道，特別是在小東西上。比如說礦泉水，有一段時間我在工作室樓下的便利商店買每瓶 35 元、第 2 瓶 10 元的進口礦泉水。相對於兩瓶
    30 元的臺灣礦泉水，我總會選擇這種實際上總價比較貴的進口礦泉水，覺得它省比較多，其實說真的它並沒有比較好喝。


    錨定效應有趣的地方是，數字愈大，效應會愈明顯。像是帶看房子，很多公司會特別設計看屋順序，'
  merge: -1
  img_proc: true
- pgno: 284
  md: '他會生帶你看樣品屋裡最大、最豪華的樣品屋，趁著你被華麗裝潢與設計風格震懾時，再帶你去你看原本所屬意的那一種房型。據說這樣的方法，可以明顯的提升成交率。你看了豪華的，就以爲自己的房子也會一樣高級；你知道豪華
    4 房的價格，會認爲自己想要的 2 房相對便宜。


    在股票市場錨定效應會更為顯著，如果你在 600 元才買台積電，你會覺得它跌到 500 元很便宜，卻忽略產業狀況可能發生轉變。只在意價格浮動，你的投資紀律就會受到錨定效應牽制。


    例如說「股價曾經到 1,300 元我都沒賣了，800 元怎麼可能賣？」（這是買宏達電的朋友告訴我的話）、「我股價已經腰斬，這個時候買獲利可期」，這些都是錨定效應衍生的影響。


    # ### 如何打破錨定作用？


    要打破錨定作用帶來的錯覺，最基本的，就是以'
  merge: -1
  img_proc: true
- pgno: 285
  md: '正確的資訊，刷掉原本錯誤的既定印象。比如說，不管銷售人員怎麼催促，都不要急著在看樣品屋的時候做出決定，你有手機，可以看附近新屋的實價登錄，至少可以找到客觀參考值。


    在投資上，就像我一直以來勸告大家的，如果你和我一樣沒空當「專業投資人」，請採取定期定額的方式，不要擇時入市與擇價入市。如果你喜歡主動選股，請把每一次的買賣當作是獨立事件，重新確認自己投資這檔股票的原因，不要有「攤平」、「翻本」、「扳回一城」這樣的想法（說真的，你再會看財報，它也可能是參考用的）。


    總之，別被歷史價格錨定。'
