  md: '念是一竅不通。同學們都知道什麼是 B2C、SOP、CRM，但我不知道。有一次老師在上頭討論麥當勞的 business model（商業模式）。我看隔壁的學長看起來滿老實的，就問他到底什麼是
    business model？他竟然笑到從椅子上跌下來，後來我才知道那位學長是個專業會計師。


    還好我臉皮還滿厚，對他說：「我就是不知道才要學啊！什麼都知道，來這裡幹嘛？」有人說念 EMBA 是為了交朋友，我可不是，我是來學東西的。學什麼都好，我要擺脫我的理財愚蠢！


    是的，商學院教我的第一件事，就是勇敢——臉皮要厚點，才能學到東西。


