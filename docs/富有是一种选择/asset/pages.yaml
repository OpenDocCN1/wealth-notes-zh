  md: '應該謙虛不自滿、要承讓、不要爭，對女性更有著溫良恭儉讓的不成文期待。這讓我想起曾經有朋友諄諄告誡我在 Podcast 要「更溫柔一點」，才能撫慰人心，我想這就是一種對女性的性別刻板印象。如果我用撒嬌的聲音「傾訴」世界經濟大勢，我真不知道你會相信我嗎？不是所有節目都在午夜談心啊。


