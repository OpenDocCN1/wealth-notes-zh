  md: '# # 世界多變，現金至少要夠自己活一年！


    我常講「現金為亡」，有人以為我不喜歡現金，其實並非如此。在投資上，現金確實不是適合的標的。但是在生活上，你必須保有一定的現金流動性，才能讓自己好好生活、好好工作、好好投資。


    就像在這一一次的疫情，一切都無預警地被改變了。幸運的人，只是抱怨自己不能出國，幾乎有兩年時間失去自由；但是在疫情中最焦慮的，應該是只要待在家裡一段時間，家中就面臨缺糧的人。


