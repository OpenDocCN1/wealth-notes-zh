  md: '意改變產品配方的現象。寄來兩次現金增資通知，第一次我不理他撕掉了，可能錢募得不夠，又來了第二次，繼續催繳要股東加入「現金增資」，我又把通知書撕掉了，寧願當這筆錢掉進海裡。


