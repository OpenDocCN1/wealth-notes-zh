- pgno: 113
  md: '存股需要的是過程中的決心與紀律。以臺股的 0056 ETF 來算的話，近五年每股價格的區間大概在 25 到 35 元之間，我們就用 30 元來算吧！每股
    30 元，代表一張 0056 價值 3 萬元，股利殖利率平均大概 5% 多（我們用 5% 整數來算，免得大家頭昏眼花）。


    如果你老了之後想要每年拿到 60 萬元的被動收入來生活（當然我並不確定，算入未來的通膨，60 萬元到底能不能讓你活得好吃得飽），那麼，以每一張股票每年可以貢獻你
    1,500 元現金而言，你大概需要 400 張 0056。


    怎麼樣買到 400 張 0056 呢？感覺上是天文數字很困難，但是 400 張如果以固定價格 30 元來說，基本上也是 1,200 萬元就夠了，事實上現在
    1,200 萬元在臺北連蛋白區新蓋的小套房都買不到啊！


    存 400 張難不難呢？對死薪水族而言的確挺難。可是如果你有辦法多創造一點收入，省一點錢，在比較年輕的時候就開始投資，例如一年存 10 張，四十年也可以存到
    400 張！甚至有人手上有 2 間房子，賣


    112 人生實用商學院：富有是一種選擇'
  merge: -1
  img_proc: true
- pgno: 114
  md: '掉1間就可以換不只400張！


    到你六十歲的時候肯定有這些股票兒子養你，而你在存股的過程之中會獲得經濟上的安全感，完全不必在股市裡面殺進殺出、費盡心機，然後發現自己十年來沒賺沒賠已經算幸運的了，不是嗎？不過以上講的這是一個簡單的概念，當然世界局勢瞬息萬變，變數並不是我們全部想得得到的。


    對收入不多的人聽起來好像有些遙不可及，但這是固定每個月存，至少不是糖衣毒藥。未來你的收入隨著經驗累積增加，你能買的張數也會變多。再者，現在大多數房地產都超過這個價格，如果買不起房，先存股反而會後來居上。買房地產你要準備一大筆的頭期款，ETF
    你可以慢慢存，相對友善。


    如果你沒辦法一年買 10 張，或存 30 萬，那我們務實一點，用定期定額投資零股的方式買進。不要用你的腦來提醒，這種細節讓電腦來處理就好。我發現只要一個人手上有個
    20 張左右，對於自己理財的信心，會是大大增強。'
  merge: -1
  img_proc: true
- pgno: 115
  md: '不過存股族有一件事情一定要記著，不能因為股息是被動收入，就被當成獎金隨意消費。你拿到的都要持續投入市場，才有長期複利效果。


    也許你會說「這不是很理所當然嗎？」其實不然，行為心理學裡「心理帳戶」概念告訴我們，愈辛苦賺到的錢，就愈不容易花；相反的，如果是不勞而獲的收入，例如刮刮樂中獎，你很輕易的就會選擇消費掉（反正是意外的收入），股息也是。


    臺灣人都很喜歡「配息」，為什麼？因為感覺就是不勞而獲啊！請仔細看看前二張「複利計算表」，如果你把利息都花掉，1 元永遠是 1 元，請問那令人致富的「複利作用」到哪裡睡覺去？


    # 面對股市：想像力不要太豐富


    疫情也影響很多人的理財規劃，疫情後臺股大漲，熱門股從半導體、生技股到航運股一波輪過一波，年輕人認為股市好賺錢，紛紛開戶也勇於當「當'
  merge: -1
  img_proc: true
- pgno: 116
  md: '沖族」，卻也變成疫情時期臺股不可忽視的現象。


    疫情到現在兩年多了，沖來沖去的人真正賺到錢的有多少？就算得意了一、二年，也會在 2022 年黑暗五月這一段時間賠得差不多，大概只有買 ETF 零股存股的人，就算手上持有的還低於成本，但好歹算是薄有資產。


    什麼樣的人最容易破財？不是不懂理財的人，而是急著賺錢的人。因為急著賺錢的人，就會想要走捷徑，就算有存股概念，也會因為市場被堆高，身邊人人都在賺錢而讓想像力大爆發。結果每一檔都買在高點，只要遇到急需用錢的原因，例如繳信用卡費，就會被迫在大跌時不得不把股票賣出。


    說真的，我曾經也是一個投機者，老想超越大盤而且執迷不悟多年。雖然沒有虧什麼錢，但是到頭來發現機關算盡太聰明。0056 是在 2008 年初就上市的，如果在十四年前拿
    100 萬元傻傻買 0056，然後每年再投入 100 萬元（我每年真可以省下這些，真的），你猜我手上的 0056 會等於多少現金？'
  merge: -1
  img_proc: true
- pgno: 117
  md: '参照「複利計算表」，大概是 100 萬元的 20 倍，也就是 2,000 萬元。如果我一直執行到 2038 年呢？（希望這一年我不會因為老人失智而算不清），那就是
    6,600 萬元喔（成本為三十年共 3,000 萬元）！如果我當時拿的是 1,000 萬投資呢？


    在市場上沖下洗時，還不如當一個理財傻瓜，定期定額選定較大型的 ETF，用 72 法則可能十幾年來穩穩翻一倍，也為自已退休生活有一個保障。


    如果你覺得我的提議太無聊，那你可以自己做實驗，把 80% 放在穩健的 ETF，然後再把 20% 放在個股去沖，過了三年再來比較兩個帳戶的結果（請不要混在同一個帳戶）。我相信一定還是有人可以靠當沖個股在市場生存，但是這些人還真是百中挑一。通常我遇到的，都有著只「記取成功，忘記失敗」的樂觀特性！面對股市的想像力，留在紙上就好，在現實戰場中只會影響你的判斷力。'
  merge: -1
  img_proc: true
- pgno: 118
  md: '# 賺錢的時候要贖回嗎？


    雖然說要持續買入並持有，但如果你是存股族，你可能會遇到這樣的難題：看到股價高到一個讓你驚訝到合不攏嘴，該不該出場，入袋為安？還是應該繼續堅持買進並持有？


    想在賺錢時不入袋為安，也是挑戰人性的。如果你很幸運的，手中股票持有成本較低，常常會有先將價差賺到手的心態，這是個是很常見的交易心態。


    事實上，就連指數化投資之父約翰·伯格，也曾在接受美國知名財經雜誌採訪時表示不好看 2019 年的市場行情，希望投資人將生活所需要的現金從股市中提出來做準備。現在很容易看清他到底是對是錯，證明市場真的沒照他的意思走。


    市場並不會按照權威專家的預言前進，他們和隨自由意志進出股市者，猜錯趨勢的機率一樣高。你賣出獲利時，真的會是明智的嗎？在天下文化出版的《致富心態》一書中，摩根·豪瑟分享了這個實驗。


    第一篇：通膨 117'
