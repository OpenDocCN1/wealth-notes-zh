  md: '# 啤酒遊戲與長鞭效應：

    你真的不用搶衛生紙


    漲價是一件很奇妙的事情，消費者一定討厭漲價，而懂投資的人能夠從中看到機會。例如油價上漲，航空產業成本增加，機票價格隨之提升，航空公司獲利就會受到影響，但對於賣油的能源產業來說是好消息，他們可以收更高的費用。


    所以當我們看到一個行業的價格提高，必然是好事嗎？在第一本《人生實用商學院：誰偷了你的錢？》中，我們講到「成本」的基本觀念。成本固然是決定價格的因素之一，但是並非唯一。'
  merge: -1
  img_proc: true
- pgno: 288
  md: '# 看懂供需問題


    根據經濟學供需法則，當價格愈高，需求應該會下降；反之，價格降低，需求上升。聽起來很簡單，但很多製造商還真會抱持矛盾期待，希望自己的產品既可以提高價格，還能維持高需求。


    具體而言，就是因為前文提及的「敝帚自珍」觀念，老闆對於自家商品太高估。不少人還有「教育顧客」的想法，認為只要多對顧客宣傳，他們自然會多買我的高價商品。


    如果產品力好，這也可能是事實，但是產品力不好？要消費者說了算。


    市場並不會按照生產者的邏輯走。在我自己經營的電商平台，曾經賣過某牌的保健食品，品質確實不錯，得到 2 個健康食品標章（俗稱小綠人）。這個商家認為對手品牌只有
    1 個小綠人，優勢相當明顯，差不多的功效，卻開出貴 4 倍的價格。實際上消費者並不買單，因為互補品比你強還比你便宜，你開出別家'
  merge: -1
  img_proc: true
- pgno: 289
  md: '的 4 倍價格，需求當然會下降。


    製造商也常過度攤平自己花費的成本還有研究時間，以成本來訂定價格，卻沒發現競爭商品真的比他便宜很多。這些失敗，都是「只往內看，沒往外看」造成的。


    圖一 供需曲線是經濟學的基本原則：價格愈高，供給愈高，需求則愈低。唯有供給需求線相交，交易才會成立


