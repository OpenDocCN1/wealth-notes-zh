    # 通膨時代的三個逆轉思考


    # ① 現金為亡


    通膨時代的第一個逆轉思考，就是重新看待現金的價格。以前大家說現金為王，是代表當市場面對可能發生全面性衰退時，保留大量現金可以避免遭受池魚之殃，還可以企圖在一片哀鴻遍野中撿到便宜，那現金就是王。


    但現在錢潮那麼洶湧，鈔票愈印愈多。你因為害'
  merge: -1
  img_proc: true
- pgno: 60
  md: '怕損失而把它凍結在銀行，讓它不成長就是現金為「亡」。因為現在不只定存利率低，就算再怎麼升息，比例也抵不過物價漲幅，當通膨成為經濟新常態，錢放在銀行裡的結果就是貶值。


    # 2 長期投資，而非短期套利


    能不能好好善用現金，與投資人的理性決策有關。首先你當然要投資，但是很多人做的投資其實不是投資，而是賭博。要在通膨時代下累積資產，應該效法巴菲特的長期投資法。如果你不知道要買什麼，就買全臺資金聚集量最大的
    ETF，別自作聰明想要低買高賣、打敗大盤，我自己也是這樣做。


    適度通膨是有利於股市的，知名投資大師安德烈·科斯托蘭尼有一句經典名言：「世界需要適度的通貨膨脹，它就像一場舒適的溫水浴。」你很少遇到市場在適度通膨環境下，股市僵滯不動的；短期有可能，但長期不可能。在適溫通膨下，長期來看股市有
    8 成的時間在漲，只有 2 成的時間在跌。當然，漲可能是緩漲，跌卻常常一、二日便劇跌。'
