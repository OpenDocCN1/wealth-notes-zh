    ```

    $$y_{ij}-\overline{y}=y_{ij}-\overline{y_{j}}+\overline{y_{j}}-\overline{y}$$


    其中 $y_{ij}-\overline{y_{j}}$ 被称为组内偏差，$\overline{y_{j}}-\overline{y}$ 被称为组间偏差。接下来，将式
    (16.1) 左右两边平方并加总，可得反映样本数据波动情况的指标——总离差平方和（Total Sum of Squares, TSS）：

