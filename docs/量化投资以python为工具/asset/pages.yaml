  md: '于某个目标值。


    假设检验一般具有两个隐含的思想：小概率事件思想和反证法的思想。


    +   • 小概率事件思想：小概率事件在一次实验中几乎是不发生的。如果在我们的假设下，出现了一个小概率事件，那么就可以认为我们的假设是错误的。

    • 反证法思想为：先假设我们提出的假设是正确的，然后在该条件下检验观测到的事件是不是小概率事件。如果是，那么就可以否定我们的假设；否则，我们就无法否定。


    一般来说假设检验有如下基本步骤。


    +   (1) 先根据实际问题的要求提出一个论断，称为原假设或零假设（Null Hypothesis），记为$H_{0}$。同时提出一个互为反命题的备择假设（Alternative
    Hypothesis），记为$H_{1}$。

    (2) 然后在$H_{0}$正确的条件下，求出样本数据出现的概率，看我们手中的样本是不是小概率事件$^{1}$。

    (3) 最后，如果样本是小概率事件，那么就认为原假设是错误的。在统计学上，我们称之为拒绝原假设。否则，我们就不能拒绝$H_{0}$的决策。对于原假设和备择假设有如下的选择原则：


    +   • 原假设应该是受到保护的，不应轻易被拒绝；

    • 备择假设是检验者所希望的结果；

    • 等号永远出现在原假设中。


    假设检验的一个步骤是判断样本是不是一个小概率事件，但是，什么样的事件才是小概率事件呢？为了回答这个问题，我们先来看一下假设检验中会出现的两类错误。


    # ### 15.3.1 两类错误


    +   • **第一类错误（Type I Error）**：在假设检验中拒绝了本来是正确的原假设（弃真）。


    根据小概率事件思想，一个小概率事件是几乎不可能发生的。因此，只要出现小概率事件，就认为原假设是错误的。但是，只要其概率不等于0，那么事件就有可能发生。也就是说，我们仍有可能遇到一个小概率事件。在这种情况下，原假设是正确的。但是，根据小概率事件思想，我们却会拒绝原假设。这样，我们的假设检验就犯错了，尽管出现这种情况的概率非常小。这种错误就是第一类错误，犯第一类错误的概率记为$\alpha$。


    +   • **第二类错误（Type II Error）**：在假设检验中没有拒绝本来是错误的原假设（取伪）。


    有时，我们也会遇到没有拒绝错误的原假设的状况，尤其是原假设错误但却很接近真实值的时候。比如，假设总体的实际均值为10，而原假设总体均值为9.5。这时候，如果取得的样本的均值为9.5，那么原假设是不会被拒绝的。但是，这种原假设是错误的。所以，假设检验也会存在没有拒绝错误的原假设的错误。这种错误被称为第二'
