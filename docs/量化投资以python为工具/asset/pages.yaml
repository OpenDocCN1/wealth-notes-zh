- pgno: 286
  md: "# ## 18.5.2 下行风险\n\n西方历史哲学家 R.G. Collingwood 曾说过：“一切历史都是思想史。”历史总是会铭记“第一”，不过尽善尽美都是在“第一”之后。在金融理论发展过程中，第二篇关于投资组合理论的论文由\
    \ Roy 于 1952 年发表，文中 Roy 用下行偏差（Downside Deviation）来度量风险的方法。下行偏差法与方差法类似，不过更贴近现实中投资者对风险的理解（相较于目标收益率以上的变动，投资者担忧的是低于目标收益率的变动）。计算下行偏差时，一个最重要的变量就是目标收益率，通常用可接受的最低收益率（Minimum\
    \ Acceptable Rate of Return, MARR）代表，MARR 可以是无风险收益率，或者 0，或者资产收益率的平均值。下行偏差描述的是低于\
    \ MARR 的收益率的发散程度，总体的下行偏差公式如下：\n\n$$\\delta(R, MARR) = \\sqrt{\\mathrm{E}\\left\\\
    {[\\min(R - MARR, 0)]^2\\right\\}}$$\n\n若我们有 $R_1, R_2, \\ldots, R_T$ 作为 $R$ 的随机样本，则样本的下行偏差为：\n\
    \n$$\\delta(R, MARR) = \\sqrt{\\frac{1}{T} \\sum_{t=1}^{T}[\\min(R - MARR, 0)]^2}$$\n\
    \n用下行偏差描述的风险被称为下行风险（Downside Risk）。下行风险提出以后得到很多认可，比如 Markowitz（1959）<sup>1</sup>\
    \ 意识到用下行风险衡量风险比用标准差更为贴切：一是因为下行风险比较符合“风险”的含义；二是当资产的收益率不满足正态分布时，用下行风险来衡量风险，才能帮助投资者做出正确的决策。\n\
    \n接下来，我们将用 Python 来计算并比较两只股票的下行风险，例子中我们用收益率的均值来作为 MARR。\n\n```\n#Downside risk\n\
    In [54]: def cal_half_dev(returns):\n         ...:     mu=returns.mean()\n   \
    \      ...:     temp=returns[returns<mu]\n         ...:     half_deviation=(sum((mu-temp)**2)/len(returns))**0.5\n\
    \         ...:     return(half_deviation)\n\n# 比较，600343 在收益均值之下的波动性更大\nIn [55]:\
