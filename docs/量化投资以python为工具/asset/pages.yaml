  md: "产上的投资比重分别为$\\omega_1, \\omega_2, \\dots, \\omega_N$, 未来收益为$R_p$, 则投资人的未来财富水平$W\
    \ = W_0(1 + R_p)$, 由于$R_p$是随机变量, 未来财富水平$W$也是一个随机变量。如果投资人的效用水平仅与财富状况相关, 则效用水平$U(R_p)$也是随机变量,\
    \ 其期望值为$\\mathbb{E}[U(R_p)]$。通常在经济金融领域, 我们认为个人决策的出发点是为了最大化效用 (或期望效用), 投资决策过程就可以精简短为以下公式:\n\
    \n```\nmax $\\mathbb{E}[U(W_0 R_p)] = \\mathbb{E}\\left[ U\\left( \\sum_{i=1}^{N}\
    \ \\omega_i R_i W_0 \\right) \\right]$ (19.3)  \ns.t. $\\sum_{i=1}^{N} \\omega_i\
