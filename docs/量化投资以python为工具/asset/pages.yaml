- pgno: 32
  md: "# # 第2章 Python代码的编写与执行\n\n在Python自带的Shell或者IPython中，代码可以一行一行地执行，并直接返回执行结果。如果代码较短，在Shell或者IPython中直接输入代码并执行代码，即可看到Python环境对于代码的互动结果：\n\
    \n```\n```\n>>>print(\"Hello Python!\")\nHello Python!\n>>>2 * 3\n6\n```\n```\n\
    \n如果要用Python编写一个小程序，来输出10以内的所有偶数，需要使用到的代码如下所示：\n\n```\n```\ntenInteger=[i for\
    \ i in range(11)]\n-print(tenInteger)\nfor i in tenInteger:\n    if i%2==0:\n\
    \        print(i)\n```\n```\n\n+   - 第一行代码“tenInteger=[i for i in range(11)]”是通过range()函数，创建一个0~10的整数序列，并命名为“tenInteger”（tenInteger是一个变量）；\n\
    - 第二行代码“print(tenInteger)”是通过print()函数输出变量tenInteger的取值；\n- 第三行代码“for i in tenInteger:”是一个for循环形式，依次获取序列tenInteger的元素取值；\n\
    - 第四行代码“if i%2==0:”表示判断i代表的取值除以2的余数是否为0，如果为0，则进入下一行代码执行；\n- 第五行代码“print(i)”表示输出该i代表的取值；如果不为0，则跳过下一行代码的执行，继续遍历获取序列tenInteger中的元素值。\n\
    \n上述代码行数较多，代码与代码之间有一定的逻辑关系。在交互环境中编写此代码，代码和执行结果混在一起，不利于分析代码的内容，已经执行过的代码不能进行再次编辑更改，一旦发现代码错误，只能重新输入整行代码。对于较为复杂的任务且代码较长时，最好创建一个Python脚本文件来专门编写与保存代码，Python脚本文件以.py为后缀名，只存储执行的代码，不包含代码的执行结果，代码可以编辑修改。脚本文件编写完以后，通过调用Python解释器从第一行代码开始执行脚本，直到脚本执行完毕。当脚本执行完成后，Python解释器则不再有效。"
  merge: -1
  img_proc: true
