  md: '从呢？我们要提醒读者的是，编程语言、统计、金融、技术指标等量化投资常用的知识只是工具，它们就像武侠小说中的宝剑与武功秘籍，虽然很重要，却不是笑傲江湖的保证。宝剑锋从磨砺出，只有勤练武艺，在实战中积累经验，才能审时度势，百战不殆。


    本书旨在对量化投资做广泛与初步的介绍，希望能引领读者进入这个引人入胜的学术与实务领域。囿于笔者的学养见识，书中内容或有疏漏谬误之处，尚祈先进专家能不吝指正。最后，谨以此书表达对热血投资大众的献曝之忱。


    若读者需要书中的习题解答、代码、数据、勘误补充及量化相关资讯，可发邮件至 ser-vice@baoquant.com 索取，来信请在邮件标题中写明书名：《量化投资：以
    Python 为工具》。'
