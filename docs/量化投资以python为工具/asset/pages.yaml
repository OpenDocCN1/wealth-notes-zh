    # ## 30.9 异同移动平均线（MACD）


    异同均线（Moving Average Convergence / Divergence）是由指数均线演变过来，由 Gerald Appel 在 20 世纪
    70 年代提出，是股票分析中一种常见的指标。MACD 指标由两线一柱组合起来形成，快速线为 DIF，慢速线为 DEA，柱状图为 MACD。快速线 DIF 一般由
    12 日指数加权移动平均值减掉 26 日指数加权移动平均值得到，慢速线 DEA 是 DIF 的 9 日指数加权移动平均值。柱状图 MACD 由快速线 DIF
    与慢速线 DEA 作差得到。MACD 指标可以反映出股票近期价格走势的能量和变化强度，通过分析快慢速线和柱状图来把握股票的买入和卖出点。一般默认 MACD
    的求值参数为 12、26 和 9，在投资实践中，可以对这些参数进行优化。


    # ### 30.9.1 MACD 的求值过程


    +   • 计算离差值 DIF，DIF 的计算方式为 12 日指数移动平均值 $EMA_{(close, 12)}$ 减去 26 日指数移动平均值 $EMA_{(close,
    26)}$ ，数学公式表达为：


    $DIF= EMA_{(close, 12)}-EMA_{(close, 26)}$


    以中国银行股票交易数据为例，用 Python 来计算离差值 DIF。


    ```

    ```

    In [1]: DIF=ma_ewmaCal(CBCLose,12,2/(1+12))\

    ...:       -ma.ewmaCal(CBCLose,26,2/(1+26))

    ...: DIF.tail(n=3)

    Out[1]:

    Date

    2015-04-28    0.150903

    2015-04-29    0.155585

    ```

    ```'
