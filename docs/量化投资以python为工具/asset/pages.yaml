    \ \\times (1-\\alpha) \\right] \\times (1-\\alpha)\n= p_{k+2} \\times \\alpha\
    \ + p_{k+1} \\times \\alpha \\, (1-\\alpha) + \\mathrm{EWMA}_{t=k} \\times (1-\\\
    alpha)^2\n```\n\n依此类推，我们可以得出之后各期加权移动平均数。总的来说，当 $t \\ge k + 1$ 时，有：\n\n```\n$$\\\
    mathrm{EWMA}_{t} = \\alpha \\left[ p_{t} + p_{t-1} \\times (1-\\alpha) + \\cdots\
    \ + p_{k+1}(1-\\alpha)^{t-k-1} \\right] + \\mathrm{EWMA}_{t=k} \\times (1-\\alpha)^{t-k}$$\n\
    ```\n\n式中，$\\mathrm{EWMA}_{t=k} = \\frac{p_1+p_2+\\cdots+p_k}{k}$ 。在公式中，我们可以看到加权移动平均数是权重\
    \ $(1-\\alpha)$ 的指数函数，因此这种计算移动平均数的方法被称为指数加权移动平均。而且根据公式还可以看出，股价的指数加权移动平均数 $\\mathrm{EWMA}_t$\
    \ 是过去所有期的价格 $(p_1, p_2, \\cdots, p_t)$ 之加权平均，从当期往过去价格之权重呈现指数递减现象。若将各期指数加权移动平均数用折线图绘制出来，则可以得到股价的指数移动平均曲线。\n\
