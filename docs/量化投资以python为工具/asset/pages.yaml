- pgno: 221
  md: '其中 $f_{X,Y}(x; y)$ 被称为联合概率密度函数（Joint Probability Density Function），由于 $f_{X,Y}(x;
    y)$ 之具体形式涉及二阶混合偏导数，这里不再展开，下面求解均值、方差等均延续前面离散型随机变量 $X$、$Y$ 之设定。


    若已知 $X$ 和 $Y$ 的联合概率分布，则 $X$ 的期望值为：


    $$\mathbb{E}(X) = \sum_{i} \sum_{j} a_{i} f_{X,Y}(a_{i}, b_{j})$$

    $$= \sum_{i} a_{i} \sum_{j} f_{X,Y}(a_{i}, b_{j})$$

    $$= \sum_{i} a_{i} f_{X}(a_{i})$$


    其中 $f_{X}(a_{i}) = \sum_{j} f_{X,Y}(a_{i}, b_{j})$ 为变量 $X$ 的边缘概率函数（Marginal Probability
    Function），代表的是变量 $X$ 自己的概率分布，所以这里 $f_{X}(a_{i})$ 依旧满足 $f_{X}(a_{i}) = \mathbb{P}\{X
    = a_{k}\}$ 之定义式。同理可得 $\mathbb{E}(Y) = \sum_{j} b_{j} f_{Y}(b_{j})$，其形式与单变量的形式并无差别，方差的求解亦是如此。


    # 14.6.2  变量的独立性


    如果随机变量 $X$ 和 $Y$ 的联合累积分布函数满足：


    $$F_{X,Y}(a, b) = F_{X}(a) F_{Y}(b)$$


    则称 $X$ 和 $Y$ 是独立的，否则二者是相依的。两变量之独立关系也可以表达成：


    $$f_{X,Y}(a, b) = f_{X}(a) f_{Y}(b) \tag{14.1}$$


    对于离散型的随机变量，式（14.1）等价于：


    $$P\{X = a \text{且} Y = b\} = P\{X = a\} P\{Y = b\}$$


    变量之间相互独立是众多统计分析的基本假设，也是变量间最简单的关系。如果两个变量是相互独立的，那么两个变量的取值是不会互相影响的。


    # 14.6.3  变量的相关性


    随机变量 $X$ 和 $Y$ 之协方差（Covariance）可以衡量二者之间的关系，描述的是两随机变量与各自期望之偏差的共同变动状况，可表达为：


    $$\operatorname{Cov}(X, Y) = \mathbb{E}\left[(X - \mathbb{E}(X))(Y - \mathbb{E}(Y))\right]$$'
