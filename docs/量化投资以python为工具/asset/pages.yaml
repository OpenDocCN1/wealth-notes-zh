    # 12.2.2.5 增加图例


    当多条曲线显示在同一张图中时，图例可以帮助我们区分识别不同的曲线。在中国银行价格数据中，除了收盘价以外，开盘价也涵盖了市场中的许多信息，将收盘价与开盘价对比分析，有可能会发现一些新的信息。下面，我们将开盘价与收盘价绘制在同一张图形中，并为这两条线增加图例。图例的添加通过
    pyplt 包中的 legend( ) 函数实现。


    ```

    ```Python

    matplotlib.pyplot.legend(*args, **kwargs)

    ```

    ```


    该函数常用到的一个参数是 loc 参数，用于设定图例在图中的显示位置。参数 loc 的取值如表 12.1 所示。


    表 12.1 参数 loc 的取值表


    | 含义 | 字符串类型值 | 数字值 |

    | --- | --- | --- |

    | 最适宜位置 | ''best'' | 0 |

    | 右上角 | ''upper right'' | 1 |

    | 左上角 | ''upper left'' | 2 |

    | 左下角 | ''lower left'' | 3 |

    | 右下角 | ''lower right'' | 4 |

    | 右侧 | ''right'' | 5 |

    | 左侧中间 | ''center left'' | 6 |

    | 右侧中间 | ''center right'' | 7 |

    | 下方中间 | ''lower center'' | 8 |

    | 上方中间 | ''upper center'' | 9 |

    | 中间 | ''center'' | 10 |


    该函数成功增加图例的前提是在绘制图形时，要为图形设定 label，label 的值就是图例'
