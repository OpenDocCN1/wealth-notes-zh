  md: '# # 第10章 常用第三方库：Numpy库与多维数组


    除了标准函数库以外，Python 还有很多着重解决特定问题的第三方库，NumPy 库和SciPy 函数库提供了许多科学运算所需要的功能函数，Matplotlib
    库提供丰富的绘图功能。由于这些功能丰富的库与模块的存在，因此使用者大大降低了在 Python 编程与功能开发上的时间与精力，能更多思考如何用 Python
    快速直接地解决诸多问题。


    # ## 10.1 NumPy库


    本节以 NumPy 库为例来说明第三方库的强大功能与便利之处。在 Python 内置环境中，直接存储数值的数组（array）对象只存在一维结构，无法支持多维结构，也没有相关数组运算函数，这些使得
    Python 在数值运算上有诸多不便之处。为了弥补这些不足，第三方函数库 NumPy 被整合开发出来。


    NumPy 的核心功能是高维数组，NumPy 库中的 ndarray（N-dimensional array object）对象支持多维数组，数组类型的对象本身具备大小固定、数组内元素的数据类型相同等特性。NumPy
    也提供了大量数值运算函数，能够直接有效地进行向量、矩阵运算。另外，NumPy是由许多作者共同开发的库，具有开源、免费的特点。


    # ## 10.2 创建数组


    在安装 Anaconda 时，NumPy 包也同时被安装。但在使用 NumPy 库中的相关函数之前，首先导入 NumPy 包，代码如下：


    ```

    In [1]: import numpy as np

    ```


    把 NumPy 包导入 Python 程序环境中，并简称为“np”。在 Python 中，当导入的库名字较长，且需要被频繁调用时，多次输入库的名字略显麻烦，那么可以给库另取一个较为简短的名字，通过这个简短的名字来调用该库。在接下来的代码中，我们将使用“np”代替
    NumPy。


    +   * array() 函数创建多维数组


    调用 NumPy 库的 array( ) 函数来创建一维数组，然后从一维数组转变成多维数组。


    ```

    In [2]: array1=np.array(range(6))

    In [3]: print(array1)

    ```'
