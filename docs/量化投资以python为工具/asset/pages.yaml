  md: "```\n```\nIn [1]: from datetime import datetime\n\nIn [2]: import pandas as\
    \ pd\n\nIn [3]: date = datetime(2016,1,1)\nIn [4]: date = pd.Timestamp(date)\n\
    In [5]: date\nOut[5]: Timestamp('2016-01-01 00:00:00')\nIn [6]: type(date)\nOut[6]:\
    \ pandas._tslib.Timestamp\nIn [7]: ts=pd.Series(1,index=[date])\nIn [8]: ts\n\
    Out[8]:\n2016-01-01\t 1\ndtype: int64\nIn [9]: ts.index\nOut[9]: DatetimeIndex(['2016-01-01'],\
    \ dtype='datetime64[ns]', freq=None)\nIn [10]: ts.index[0]\nOut[10]: Timestamp('2016-01-01\
    \ 00:00:00')\n```\n```\n\n不过, 由于 Timestamp() 并不接受列表等可迭代对象, 如果我们想要创建一个 Series 对象,\
    \ 则需要对每个日期应用一次 Timestamp() 函数, 这样显然很麻烦。因此, 我们一般会使用 to_datetime() 将 Series 的 index\
    \ 属性转换为 DatetimeIndex:\n\n```\n```\nIn [11]: dates = ['2016-01-01','2016-01-02',\
    \ '2016-01-03']\nIn [12]: ts=pd.Series([1,2,3],index=pd.to_datetime(dates))\n\
    In [13]: ts\nOut[13]:\n2016-01-01\t 1\n2016-01-02\t 2\n2016-01-03\t 3\ndtype:\
    \ int64\nIn [14]: ts.index\nOut[14]: DatetimeIndex(['2016-01-01', '2016-01-02',\
    \ '2016-01-03'],\n dtype='datetime64[ns]', freq=None)\nIn [15]: ts.index[0]\n\
    Out[15]: Timestamp('2016-01-01 00:00:00')\n```\n```\n\n实际上, 对于 datetime 对象, 我们可以直接将其作为\
    \ index, 而 Pandas 会自动将其转换成 Timestamp 对象:"
