    # 6.1.3 多元赋值


    多元赋值是指一个赋值语句实现了多个变量引用多个对象的赋值过程。举例如下：


    ```

    In [28]: x2, y2, z2=2, 5, 6


    In [29]: x2

    Out[29]: 2


    In [30]: y2

    Out[30]: 5


    In [31]: z2

    Out[31]: 6

    ```


    赋值等号“=”左边为多个变量，变量之间用逗号隔开，右边为对象，对象也用逗号隔开。请注意，多重赋值和下面的单变量赋值进行区分：


    ```

    In [32]: x3=2, 5, 6

    In [33]: x3

    Out[33]: (2, 5, 6)

    ```


    赋值等号“=”右边的表达式相同，都是用逗号隔开对象，但是等号左边只有一个变量x3，此时变量x3 的取值为列表类型数据。


    # 6.1.4 增强赋值


    增强赋值的含义为对变量进行运算操作的结果再次赋给这个变量，比如 a=a*3 或者 a*=3。


    ```

    In [34]: a=6

    In [35]: a*=3

