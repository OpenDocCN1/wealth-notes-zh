  md: "# 6.2 条件语句\n\nPython 条件语句是指通过对指定条件的真假结果来确定要执行哪条语句。Python 条件语句一般指 if 语句，if 条件语句的基本形式为：\n\
    \n```\n```\nif condition1:\n    statement1\nelse:\n    statement2\n```\n```\n\n\
    在 if...else... 条件句中，if 条件判断语句所在行和 else 所在行都要以冒号结尾，而执行语句行要缩进。从上述基本形式中可以看出，condition1\
    \ 后面有冒号，statement1 所在行有缩进，语句后面没有冒号。如果表达式 condition1 执行结果为 True，接下来执行 statement1\
    \ 的代码；否则，执行 statement2 的代码。\n\n```\n```\nIn [1]: a=6\n         b=4\n         if\
    \ a>b:\n             print('变量a的值大于变量b的值')\n         else:\n             print('变量b的值大于或等于变量a的值')\n\
    \n变量a的值大于变量b的值\n\nIn [2]: if a>5 and b>5:\n         a+=6\n         else:\n   \
    \          b+=6\n\nIn [3]: a\nOut[3]: 6\nIn [4]: b\nOut[4]: 10\n```\n```\n\n如果判断条件有多个，则可以使用\
    \ if...elif 语句形式，如下：\n\n```\n```\nif condition1:\n    statement1\nelif condition2:\n\
    \    statement2\nelse:\n    statement3\n```\n```\n\n代码示例为：\n\n```\n```\nIn [5]:\
    \ grade=95\n         if grade>=90:\n             print(\"Excellent job\")\n  \
    \       elif all([grade>70, grade<90]):\n             print(\"good job\")\n  \
    \       else:\n```\n```"
