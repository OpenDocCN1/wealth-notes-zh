    # 17.4 显著性检验


    回想一下前面介绍的假设检验，对于一个随机变量，可以对其期望是否等于某个值进行检验。在回归分析中，我们往往会对估计出的系数进行假设检验。通常我们是对回归系数的真实值
    $\alpha _ { 0 }$、 $\beta _ { 0 }$ 提出原假设，然后构建计算统计量的取值，并根据 $\hat { \alpha }$、 $\hat
    { \beta }$、 $\hat { \sigma } ^ { 2 }$ 的分布性质判断根据样本观测点 $x _ { i }$、 $y _ { i }$
    计算出来的 $\hat { \alpha } _ { n }$、 $\hat { \beta } _ { n }$ 是否显著异于0，以此来判断是否接受原假设。也正因为如此，我们把这样的假设检验叫作显著性检验，即变量之间的关系是否显著。以系数
    $\hat { \beta }$ 为例，显著性检验分为如下4个步骤。


    +   (1) 提出原假设 $H _ { 0 }$ ： $\beta _ { 0 } = b$ ；备择假设 $H _ { 1 }$ ： $\beta _ {
    0 } \neq b$;


    +   (2) 确定显著性水平0.05、0.01等（根据具体情况而定）；


    +   (3) 构建、计算统计量 $t _ { \beta }$ —标准化的 $\hat { \beta } - b$ :


    $$\begin{array} { r } { t _ { \beta } = \frac { \hat { \beta } - b } { \hat {
    \sigma } } } \ { = \frac { \hat { \beta } - b } { \sqrt { \sum _ { i = 1 } ^ {
    n } ( x _ { i } - \bar { x } ) ^ { 2 } } } = \frac { \hat { \beta } - b } { \sigma
    _ { 0 } } \bigg / \sqrt { \frac { ( n - 2 ) \hat { \sigma } ^ { 2 } / \sigma _
    { 0 } ^ { 2 } } { n - 2 } } } \end{array}$$


    式中 $\sqrt { \sum _ { i = 1 } ^ { n } ( X _ { i } - \bar { X } ) ^ { 2 } } \left(
    \frac { \hat { \beta } - b } { \sigma _ { 0 } } \right) ^ { 2 } \sim N ( 0 , 1
    ) , ~ \frac { ( n - 2 ) \hat { \sigma } ^ { 2 } } { \sigma _ { 0 } ^ { 2 } } \sim
    \chi ^ { 2 } ( n - 2 )$ ，由此可得 $t _ { \beta }$ 服从 $t$ 分布：


    $$\begin{array} { r } { t _ { \beta } \sim t ( n - 2 ) } \end{array}$$


    +   (4) 查自由度 $d f = n - 2$ 的 $t$ 分布表得到临界值或者是计算出 $t _ { \beta }$ 对应的 $p$ 值，做出是否'
