    # 2. 产业链配对


    根据产业链，将同一条产业链内的上市公司股票进行配对，例如将某一手机生产公司与与其上游手机摄像头生产公司进行配对。


    # 3. 财务管理配对


    从基本面分析的角度切入，挑选上市公司市盈率、负债率、产品种类等相近的股票进行配对，进而减少一些不必要的搜索成本。


    此外，沪深 300 指数、上证 50 指数、创业板指数的成分股票也常常被业界和学者作为配对交易的股票池。同一公司发行的不同种类股票进行配对也是一种配对选择$^{1}$。另一种情况是同一家公司在不同的市场分别发行股票，比如，沪配股市万科
    A 和万科 B 股票都是万科有限公司发行的股票，业绩表现、财务和管理相同，但万科 A 股是人民币普通股，以人民币交易，而万科 B 股虽然同样在境内（上海、深圳）证券交易所上市交易，但以外币进行认购和买卖。据此推测万科
    A 与万科 B 股票有稳定的价差趋势并不为过。


    运用定性分析的手段，初步挑选好配对的股票池以后，在配对池众多股票对中，如何运用定量的方法，来挑选可以用于配对交易的股票对？最小距离法和协整方法是常用的两种方法。


    # 最小距离法


    配对交易的一个选择标准在于寻找历史价差价差稳定的股票对。为了客观衡量两只股票价格的距离，首先需要对股票价格进行标准化处理。假设 $P_{t}^{i}(t=0,1,2
    \cdots T)$ 表示股票 $i$ 在第 $t$ 天的价格。那么，股票 $i$ 的在第 $t$ 天的单期收益率可以表达为：


    ```

    $r_{t}^{i}=\frac{P_{t}^{i}-P_{t-1}^{i}}{P_{t-1}^{i}}, \quad t=1,2,3 \cdots T$

    ```


    用 $\hat{p}_{t}^{i}$ 表示股票 $i$ 在第 $t$ 天的标准化价格，学界和业界认为 $\hat{p}_{t}^{i}$ 可由这 $t$
    天内的累积收益率来计算，即：


    ```

    $\hat{p}_{t}^{i}=\sum_{\tau=1}^{t}\left(1+r_{\tau}^{i}\right)$

    ```


    假设有股票 $X$ 和股票 $Y$，则我们可以计算二者之间的标准化价格偏差之平方和 $SSD_{X, Y}$ ：


    ```

    $SSD_{X, Y}=\sum_{t=1}^{T}\left(\hat{p}_{t}^{X}-\hat{p}_{t}^{Y}\right)^{2}$

    ```


    接下来，我们挑选上证 50 指数的两只成分股浦发银行和中国银行股票从 2014 年 1 月 1'
