- pgno: 20
  md: '# # 第1章 Python简介与安装使用


    # ## 1.1 Python 概述


    Python 是一种面向对象的脚本语言，自 20 世纪 90 年代初诞生至今，已经逐渐被广泛应用于处理系统管理任务和 Web 编程等方面。它是由 CWI（阿姆斯特丹国家数学和计算机科学研究所）的研究员
    Guido van Rossum 开发的一种高级脚本编程语言。之所以把这种新的语言命名为 Python（大蟒蛇），是因为 Guido van Rossum
    特别喜欢 BBC 当时正在热播的喜剧连续剧 “Monty Python”。Python 的前身是 ABC（ALL BASIC CODE）。ABC 是一种教学语言，也是专门为非专业程序员设计的，但最终失败了。Python
    作为 ABC 的继承，从中汲取了大量语法，并从系统编程语言 Modula-3 借鉴了错误处理机制。


    自 Python 于 1991 年年初公开发行以来，已经成为最受欢迎的程序设计语言之一。那么，Python 为什么能够在众多的语言当中脱颖而出呢？


    +   简单：Python 力求一个问题用一种方式解决，是代表简单主义思想的语言；在阅读 Python 代码时，你会有一种阅读英语的感觉，因为相比其他语言，Python
    经常使用英文关键字做各种定义；Python 的语法简单，很容易上手。


    +   免费，开源：Python 是 FLOSS（自由/开放源码软件）之一。无论是安装还是使用 Python 均不需要付费，这是 Python 能够在众多的语言当中脱颖而出的重要原因之一，它的许多程序都来自于全球各地学者的无私奉献。


    +   面向对象：Python 是一种面向对象的语言，同时也支持面向过程。


    +   可移植性：基于它的开源性的本质，Python 已经被移植到许多平台上运行使用（基于不同系统的不同特性可能需要经过些许改动），这些平台包括 Windows、Linux、Mac
    等。


    +   可扩展性：如果你想编写一些不愿开放的算法，或者需要加快关键代码的运行速度，那么你可以使用 C 或 C++ 完成那部分程序的编写，然后从你的 Python
    程序中调用它们。


    +   可嵌入性：可以把 Python 嵌入 C/C++ 程序，从而向你的程序用户提供脚本功能。


    +   丰富的库：Python 有着庞大的标准库，可以帮助你处理各种工作，包括正则表达式、线程、数据库、网页浏览器、FTP、电子邮件、CGI、XML、GUI（图形用户界面）、Tk
    等与系统有关的操作。只要安装了 Python，那么上述功能都是可用的。除了标准库以外，还有许多其他很实用的库，比如 wxPython、Twisted 和 Python
    的图像库等。


    2'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# ### 1.2 Python 的安装


    # #### 1.2.1 下载安装 Python 执行文件


    Python 是免费的开源软件，进入 Python 网站下载页面：https://www.python.org/downloads/，即可看到如图 1.1
    所示的界面。


    ![](img/0de14a685304f8aa267f6492145864ac_21_0.png)


    以 Windows 系统为例，此时最新版本为 Python 3.5.1 和 Python 2.7.11。单击按钮 Download Python 3.5.1
    或者 Download Python 2.7.11 即可下载相应的 Python 执行文件，双击执行文件，按照相应提示进行操作即可安装 Python。除了
    Windows 系统以外，Python 下载页面也提供了其他操作系统，如 Linux/UNIX、Mac OS X 等执行文件。也可以下载安装其他版本的 Python，如图
    1.2 所示。


    ![](img/0de14a685304f8aa267f6492145864ac_21_1.png)


    Python 自身环境内置有许多函数（Functions）和模组（Modules），不过这些函数和模组的功能有限，Python 的强大功能更多地是通过第三方库或者其他模组来实现。如果函数'
  merge: -1
  img_proc: true
- pgno: 22
  md: '库或者模组没有内置于 Python 环境中，则需要先下载安装该函数库或者模组，然后才能被使用。一般通过 pip 指令来安装包，安装指令为：


    ```

    ```

    pip install name

    ```

    ```


    比如要安装 NumPy，打开电脑控制台，输入指令：


    ```

    ```

    pip install numpy

    ```

    ```


    即可安装 NumPy 这一函数库。


    然而，某些函数库的使用可能依赖于其他函数库的成功安装，不同的库和模组之间存在依赖关系，使得有些包不一定能够通过简单的 pip 指令能够实现，可能还需要其他安装细节与技巧。这些安装技巧对于
    Python 初学者来说，则可能略显复杂和麻烦。


    # 1.2.2 下载安装 Anaconda


    如果专注于科学计算功能，读者可以直接安装 Anaconda。Anaconda 是 Python 的科学计算环境，内置 Python 安装程序，其主要功能如下。


    +   - 安装简单：下载 Anaconda 的.exe 执行文件，双击执行文件，按照界面提示即可进行安装。


    +   - 配置众多科学计算包：Anaconda 集合了 400 个以上的科学计算与数据分析功能的包 (Packages)，如 NumPy、Pandas、SciPy、Matplotlib
    和 IPython 等。安装 Anaconda 时，这些包可也会被成功安装。


    +   - 支持多种操作系统：Anaconda 支持 Windows、Linux 和 Mac OX 等平台。


    +   - 兼容 Python 多种版本：2.X 和 3.X 版本的 Python 在 Anaconda 环境中可以同时并存，在 Anaconda 中通过适当指令可以自由切换使用的
    Python 版本。


    Anaconda 相关版本种类较多，有 Anaconda、Anaconda Pro、Anaconda Workgroup 以及 Anaconda Enterprise
    等版本，部分版本的 Anaconda 需要付费使用。如果对功能要求不高，读者可以下载 Anaconda 的免费版，进入 Anaconda 的下载页面，如图
    1.3 所示。


    以 Windows 系统为例，Anaconda 有两种版本选择，一种内置 Python 版本为 Python 2.7，另一种内置有 Python 3.5 的安装版本。此外，Anaconda
    版本还有 32 位系统与 64 位系统之分，读者可以根据电脑配置与功能需求选择相应版本下载执行文档，通过双击执行文档并按照提示即可进行安装。


    # Conda 在 Anaconda 中的应用


    Conda 是众多开源包的管理系统与环境管理系统，在 Anaconda 环境中，通过 Conda 相关指令可以进行查看已安装包、更新包、安装其他包等操作。通过
    pip 环境进行安装的包也可以由 Conda 来管理。'
  merge: -1
  img_proc: true
