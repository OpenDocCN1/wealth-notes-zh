    2015-04-13\t70.334930\n2015-04-14\t66.976744\ndtype: float64\n```\n\nRSI时间跨度的设定不是一成不变的，它可以根据股价情况来进行相应调整，也可以根据我们研究分析的需要来设定，不同时间跨度计算出来的RSI值自然会有所不同。例如，可以将RSI时间跨度设定为10日、25日、30日、60日等；如果股价数据是月数据，我们可以把RSI计算的时间跨度设定为1个月、9个月、12个月、24个月等。短期RSI分析可以用日数据、周数据，长期RSI分析可以选择月数据。在投资分析中，投资者可以参考短期RSI和长期RSI进行投资决策。短期RSI对于价格的变化情况反应比较灵敏，RSI的值波动较大；长期RSI值反应相对迟钝，其波动相对较小。\n\
    \n# 29.5 RSI指标判断股票超买和超卖状态\n\n回顾本章开头提出的问题，投资者如何判断股票的买入程度和卖出程度？韦尔斯·威尔德（Wells Wilder）通过RSI指标提供了一个解决方案。我们知道，股票的价格是股票市场供求关系的直接体现。股票价格上涨，我们可以推测股票买入的力量大于卖出的力量。股票价格下跌，则卖出力量超过买入力量。从RSI计算公式可知，RSI值的大小可用于表明股票超买和超卖状态。\n\
    \n+   当RSI取值为50时，UP和DOWN的取值相同，股票的买入力量等于股票的卖出力量；\n\n+   RSI取值越大，说明UP的取值超过DOWN取值的程度越大，股票的买入热度大于卖出热度的程度越大；\n\
    \n+   RSI取值越小，可以推出说明DOWN的取值超过UP取值的程度越大，股票的卖出热度大于买入热度的程度越大。\n\n超买线、超卖线和中心线：\n\n\
    RSI取值等于80或20分别为较常用的“超买线”和“超卖线”的刻画。RSI为80是股票超买的临界点，RSI为20是股票超卖的临界点，RSI取值为50设定为“中心线”，该线表明股票的买入力量等于卖出力量。如图29.2所示。\n\
    \n当RSI大于80时，股票出现超买信号。股票买入力量过大，买入力量在未来可能会减小，所以股票未来价格可能会下跌，此时卖出股票，未来下跌后再买入股票，从而赚取价差。\n\
    \n当RSI小于20时，股票出现超卖信号。股票卖出力量过大，卖出力量在未来终归回到正常，因此股票未来价格可能会上涨，投资者此时可以做多股票，未来价格上涨后再卖出。"
