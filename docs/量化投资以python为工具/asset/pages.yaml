- pgno: 241
  md: '的光照，得到的粮食产量也不见得会完全一样。有太多无法控制的随机因素会影响产量，比如这块土地种植的大豆的基因或许比另一块土地种植的大豆的基因好。即使是同一品种、同一棵植物上获取的大豆也不见得相同。若要研究行业对股票的收益率的影响，除了行业间收益率可能存在差异以外，还存在其他不可控的随机因素会影响股票的收益率。


    2. 研究中施加对结果形成影响的可控因素（因子）


    若要研究施肥量对于粮食产量的影响，施肥量则是对结果会产生影响的可控因素。这些因素都会使我们收集到的反应变量数据产生波动。方差分析通过分析不同来源的波动（不可控随机
    VS 可控因素）对总波动（反应变量的总体变化）的贡献大小，从而确定可控因素（因子）对反应变量影响力的大小。如果反应变量的波动主要由可控因素引起，可控因素对于总波动的贡献较大，则说明可控因素对于反应变量有显著的影响。例如，如果不同施肥量条件下的粮食产量大小相似、不同组别之间产量无变化，仅有的变化是由种子质量等不可控的随机因素引起，则无法得出“施肥量是影响粮食产量的一个重要因素”的结论。如果产量的变化很大程度上是由“施肥量”这个因素引起，即使这个产量的总的变化差异很小，也可以说“施肥量”是产量的一个影响因素，只不过这个因素的影响作用有限。


    # 16.2.1 离差平方和


    现在以单因素方差分析为例，说明方差分析的假设检验过程。假设现在因子变量共有 $M$ 个水平，每个水平下试验或观测对象有 $N_j$ 个（$j = 1, 2,
    ..., M$）。令 $Y_{ij}$ 表示第 $j$ 个水平组别下第 $i$ 个反应变量，其中 $i = 1, 2, ..., N_j$。令 $\mu_j$
    代表第 $j$ 个水平组别下反应变量的均值，$\mu_0$ 代表所有反应变量的均值。若因子水平对反应变量无影响，则不同因子水平下反应变量的均值是相同的，这就是方差分析之原假设：


    ```

    $$H_0: \mu_1 = \mu_2 = \cdots = \mu_M = \mu_0$$

    ```


    现在我们观测到不同因子水平下的样本数据 $y_{ij}$（$j = 1, 2, ..., M$, $i = 1, 2, ..., N_j$），这样第 $j$
    组的样本均值为：


    ```

    $$\bar{y}_j = \frac{y_{1j} + y_{2j} + \cdots + y_{N_jj}}{N_j} = \frac{1}{N_j}
    \sum_{i=1}^{N_j} y_{ij}, \quad j = 1, 2, \ldots, M$$

    ```


    而全样本的平均值为：


    ```

    $$\bar{y} = \frac{1}{N} \sum_{j=1}^{M} \sum_{i=1}^{N_j} y_{ij} = \frac{1}{N} \sum_{j=1}^{M}
    N_j \left( \frac{1}{N_j} \sum_{i=1}^{N_j} y_{ij} \right) = \frac{1}{N} \sum_{j=1}^{M}
    N_j \bar{y}_j$$

    ```'
