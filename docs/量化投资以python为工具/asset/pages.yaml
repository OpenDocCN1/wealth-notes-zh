    ```\n\n# 14.4 正态分布\n\n正态分布 (Normal Distribution) 又名高斯分布 (Gaussian Distribution)，被广泛使用在数学、物理及金融工程等领域，是人们最常用的描述连续性随机变量的概率分布。在金融学研究中，收益率等变量的分布常常假定为正态分布或者对数正态分布（取对数后服从正态分布）。由于正态分布的概率密度曲线呈钟形，人们经常称正态分布曲线为钟形曲线。\n\
    \n正态分布之分布律：若随机变量 $X$ 服从一个数学期望为 $\\mu$、方差为 $\\sigma^2$ 的正态分布，记为 $X \\sim N(u, \\\
    sigma^2)$，则 $X$ 的取值范围为 $(-\\infty, +\\infty)$，其概率密度函数为：\n\n![](img/0de14a685304f8aa267f6492145864ac_215_0.png)\n\
    \n如图 14.2 所示的细、较粗、最粗三种线分别绘制出了 $N(0, 1)$，$N(0, 2)$ 和 $N(2, 1)$ 的概率密度函数。\n\n![](img/0de14a685304f8aa267f6492145864ac_215_1.png)\n\
    \n可以看出，正态分布是一种对称分布，参数 $\\mu$、$\\sigma$ 决定了概率密度函数图的形状。$N(0, 2)$ 和 $N(0, 1)$ 有着相同的位置（对称轴），但\
    \ $N(0, 2)$ 更加“矮胖”，$N(0, 2)$ 的离散程度更大。$N(2, 1)$ 和 $N(0, 1)$ 有着相同的离散程度，$N(2, 1)$\
    \ 的均值 2 大于 $N(0, 1)$ 的均值 0，$N(2, 1)$ 的位置（对称轴）比 $N(0, 1)$ 更加靠右。\n\n服从正态分布之随机变量\
    \ $X$ 有个特殊的性质，即其线性变换 $aX + b$ 依旧服从正态分布，$aX + b \\sim N(a\\mu + b, a^2\\sigma^2)$。若令\
    \ $a = 1/\\sigma$，$b = -\\mu/\\sigma$，即可得到标准正态分布 $N(0, 1)$，"
