    # # 17.6 多元线性回归模型


    一元线性回归模型可以研究某一自变量与某一因变量之间关系，但是在现实世界中变量的关系错综复杂，某一现象往往由许多的因素共同影响。因此，单一自变量往往是不够的。这时候，我们就可以在一元线性回归模型的基础上拓展，使用多个自变量来解释因变量，这样的模型就是多元线性回归模型（Multiple
    Linear Regression Model）。


    # ## 多元线性回归模型


    同一元线性回归模型类似，多元线性回归模型的形式为：


    $$Y_i = \beta_0 + \beta_1X_{1,i} + \beta_2X_{2,i} + \cdots + \beta_kX_{k,i} +
    \varepsilon_i, \quad \varepsilon = 1,2,3,\cdots n$$


    其中， $X_{k,i}$ 为第 $k$ 个自变量 $X_k$ 的第 $i$ 个样本的。


    在一元线性回归模型中，我们采用最小平方方法来估计参数的值，在多元线性回归模型中，同样采用最小平方方法进行参数的估计。但是，为了使估计出来的参数同样具有一元线性回归模型参数估计量的性质，多元线性回归模型不仅要满足一元线性回归模型的假设，还要保证模型中的自变量不存在共线性。共线性是指一个自变量可以由其他自变量线性表示，即
    $X_i = \sum_{j=1}^{k} a_jX_j$。要注意的是，即使不是完全的共线性，变量之间的强相关性仍会使得模型结果产生偏差。


    在多元线性回归模型中，同样用可决系数 $R^2$ 来表达模型的拟合度。不过对多元线性回归模型来说，随着自变量数目的增加，对因变量的解释能力也相应增加，故模型的拟合度相应增加。但是，这似乎也给我们构造模型带来一些困扰，比如在研究股市的影响因素时，应当考虑世界上所有可能的解释变量，甚至包括天气、季节等因素，这样拟合出来的模型的可决系数
    $R^2$ 会很高。但是模型的可决系数 $R^2$ 很高不一定说明模型是一个好的模型，用一切解释变量来解释因变量时，就犹如没有解释一样，即使建立模型，也无法抓住重点因素，进而很难实现分析和研究。


    因此，我们需要找一个比可决系数 $R^2$ 更好的指标来反映多元线性回归模型的拟合优度。这个指标与 $R^2$ 相比，要满足：不是解释变量数目的单调递增函数。也就是说，这个指标所反映出来的信息应该是：我们构建的模型确实不错，而不是因为解释变量的数目多而看上去很好。因此，这里引入了调整后的可决系数
    $R_c^2$，其表达式为：'
  merge: -1
  img_proc: true
- pgno: 259
  md: '```

    $$\begin{gathered} R_{c}^{2}=1-\frac{n-1}{n-k-1}\left(1-R^{2}\right)\end{gathered}$$

    ```


    其中 n 为样本观测量，k 为自变量个数，当可决系数 R² 相同时，自变量个数越多，调整后的可决系数 R_c² 就越小。因此构造模型时，需要在模型拟合度和自变量个数中做出权衡取舍。此外，调整的可决系数
    R_c² 还能用于评价不同个数自变量的回归模型的拟合效果。


    多元回归模型的参数显著性检验与一元回归模型的想法和做法类似，在这里就不再赘述。不过多元回归模型中涉及多个参数，因此可以对几个参数一起做联合检验，比如我们想看模型中所有的系数是否都为
    0，或者，前两个自变量的系数相加是否为 1 之类的关系。这时要建立新的统计量，不过进行这些检验的前提假设条件依旧是古典假设，而构建统计量的想法依旧是标准化，读者可参考前面的内容进行构建。


