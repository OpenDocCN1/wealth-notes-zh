  md: '# 18.5.4 期望亏空


    VaR 在金融业得到了广泛的应用，不过随着学术界对其深入的研究，VaR 理论上的缺陷也逐渐显现出来。为了弥补 VaR 理论上的缺点，学者们提出用期望亏空（Expected
    Shortfall, ES）来衡量风险。与 VaR 衡量风险的思想类似，期望亏空考虑的是超过 VaR 水平的损失的期望值，也就是最坏的 $ \alpha\%
    $ 损失的平均值，可以用数学公式表达为：


