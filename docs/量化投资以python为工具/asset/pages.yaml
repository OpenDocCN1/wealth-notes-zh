  md: '其中， RSI 表示相对强弱指标值，若 $t$ 表示所参考数据的期数，UP 表示 $t$ 期内股价上涨幅度的平均值，DOWN 表示 $t$ 天内股价下跌幅度的平均值。


    比如，用一个简单的例子来说明 RSI 的计算过程。为了简单方便，本例子将股价取值为整数，单位为“元”。假设某股票的 1 日到 5 日的日收盘价分别为 18
    元、23 元、21 元、20 元、19 元。该股票第 2 天上涨 5 元，第 3 天下跌 2 元，第 4 天下跌 1 元，第 5 天下跌 1 元。


    如表 29.1 所示，我们利用 5 日的股票收盘价数据来求 4 日 RSI 值，即 $t=4$。


    表 29.1 收盘价数据表

    | 日期 | 收盘价（元） | UP | DOWN |

    | :--- | :---: | :---: | :---: |

    | 1日 | 18 | - | - |

    | 2日 | 23 | 5 | - |

    | 3日 | 21 | - | 2 |

    | 4日 | 20 | - | 1 |

    | 5日 | 19 | - | 1 |


    股价上涨幅度平均值为：

    $$\text{UP} = \frac{5}{4} = 1.25$$

    股价下跌幅度平均值为：

    $$\text{DOWN} = \frac{2+1+1}{4} = 1$$


    用 UP 和 DOWN 的值来计算 RS 的值：

    $$\text{RS} = \frac{\text{UP}}{\text{DOWN}} = \frac{1.25}{1} = 1.25$$


    进而可以求 RSI 的值：

    $$\text{RSI} = 100 \times \frac{1.25}{1 + 1.25} = 55.56$$


    在计算 UP 和 DOWN 的值时，需要求出上涨幅度的平均值和下跌幅度的平均值，一般使用算术平均值来求 UP 和 DOWN。均值可分为简单移动平均值（SMA）、加权移动平均值（WMA）和指数移动平均值（EMA）。在计算上涨幅度和下跌幅度的平均值时，使用不同的均值计算方式求得的平均值大小有差异，最终会使
    RSI 的取值不同。


    除了先通过 UP 和 DOWN 求出 RS，由 RS 的值再求 RSI 的值以外，我们也可以直接'
