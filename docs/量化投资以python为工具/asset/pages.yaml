    # 30.8 中国银行股票均线系统交易


    均线系统策略的直觉是短期趋势与长期趋势的消长, 不同的消长变化对交易有不同的指导意义, 下面分别演示一些简单的例子。


    # 30.8.1 简单移动平均线制定中国银行股票的买卖点


    价格的移动平均线可以解读为价格的压力线和支撑线。一般而言, 当股票处于上涨行情中, 若均线处于价格线的上方, 均线起到压力线的作用。如果价格曲线向上穿过压力线,'
  merge: -1
  img_proc: true
