    \cdots, R_{t}$。


    # 18.1.2 多期简单收益率


    按第 18.1.1 节的设定，已知某资产的价格序列 $P_{1}, P_{2}, \cdots, P_{t}$。假设投资者在第 $t - 2$ 期以价格 $P_{t
    - 2}$ 购入该资产，在第 $t$ 期以价格 $P_{t}$ 卖出。在不考虑其他收益及交易成本的情况下，2 期简单收益率 $R_{t}(2)$ 计算公式为：


    $R_{t}(2) = \frac{P_{t} - P_{t - 2}}{P_{t - 2}} = \frac{P_{t}}{P_{t - 2}} - 1$


    若投资者在第 $t - k$ $(t > k)$ 期以价格 $P_{t - k}$ 购入该资产，在第 $t$ 期卖出，则 $k$ 期简单收益率 $R_{t}(k)$
    计算公式为：


    $R_{t}(k) = \frac{P_{t} - P_{t - k}}{P_{t - k}} = \frac{P_{t}}{P_{t - k}} - 1$


    当资产的价格序列 $P_{1}, P_{2}, \cdots, P_{t}$ 已知时，该资产对应的 $k$ 期简单收益率 $R_{k + 1}(k)$, $R_{k
    + 2}(k)$, $\cdots, R_{t}(k)$ 是可以轻松计算出来的。


    如表 18.1 所示给出了 2014 年 1 月万科公司股票每日收盘价（单位：元）数据。


    表 18.1 万科公司股票从 2014 年 1 月 2 日到 1 月 10 日的每日收盘价


