  md: '# 第6章 Python常用语句


    Python 程序由模块（Module）所构成，而模块中则包含各种语句（Statement）。藉由语句的组合，指定 Python 执行程序的过程。Python
    语句可由表达式组成。表达式由运算符和操作数组组成，表达式会传回一个值；而语句是一个完整的句子，其不会返回一个值。Python 环境中也支持更复杂的语句，体现了不同语法与语意并对应不同的执行方式，下面我们将一一介绍。


    # 6.1 赋值语句


    # 6.1.1 赋值含义与简单赋值


    赋值语句通过赋值运算符、表达式和变量来实现。最常用的赋值运算符就是等号“=”，通过赋值符号“=”将其右边表达式的返回值赋给等号左边的变量。比如：


    ```

    ```python

    a=3+4

    ```

    ```


    在语句“a=3+4”中，“3+4”为表达式，该表达式运算出来的值通过赋值符号“=”赋给变量a。


    Python 中的赋值过程，赋给变量的是内存中对象的引用，而不是对象的值。这句话怎么理解呢？请看下面的例子：


    ```

    ```python

    In [1]: a=[1,2,3]


    In [2]: id(a)

    Out[2]: 159272200


    In [3]: b=a


    In [4]: id(b)

    Out[4]: 159272200

    ```

    ```


    赋值语句“a=[2,3,4]”使得变量 a 获得一个引用，指向一个列表对象 [2,3,4]。语句“b=a”表示变量 b 引用变量 a 所指向的对象，则变量
    a 和变量 b 引用同一个对象，所以变量 a 和变量 b 的 id 相同。如图 6.1 所示，对这一原理进行了示意说明。


    再执行下面的语句


    ```

    ```python

    In [5]: b[1]=25

    ```

    ```


    语句“b[1]=25”将 b 指向的列表对象的索引值为 1 的取值由 2 改成了 25，这一过程的示意图如图 6.2 所示。'
  merge: -1
  img_proc: true
