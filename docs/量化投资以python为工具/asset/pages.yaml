    \ 不会影响决策变量, 因此以上公式可以简化成:\n\n```\nmax $\\mathbb{E}[U(R_p)] = \\mathbb{E}\\left[\
    \ U\\left( \\sum_{i=1}^{N} \\omega_i R_i \\right) \\right]$ (19.4)  \ns.t. $\\\
    sum_{i=1}^{N} \\omega_i = 1$\n```\n\n其中$\\mathbb{E}[U(R_p)]$可以用泰勒展开式 (Taylorder\
