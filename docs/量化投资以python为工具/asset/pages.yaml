  md: "```\nIn [2]: import numpy as np\n```\n\n#Series之间的运算\n\n```\nIn [3]: s1=pd.Series({1,2,3},index=list('ABC'))\n\
    In [4]: s1\nOut[4]:\nA     1\nB     2\nC     3\ndtype: int64\n```\n\n```\nIn [5]:\
    \ s2=pd.Series({4,5,6},index=list('BCD'))\nIn [6]: s2\nOut[6]:\nB     4\nC   \
    \  5\nD     6\ndtype: int64\n```\n\n```\nIn [7]: s1+s2\nOut[7]:\nA     NaN\nB\
    \     6\nC     8\nD     NaN\ndtype: float64\n```\n\n#DataFrame与Series\n\n```\n\
    In [8]: df1=pd.DataFrame(np.arange(1,13).reshape(3,4),\n....:                \
    \ index=list('abc'),columns=list('ABCD'))\nIn [9]: df1\nOut[9]:\n   A  B  C  D\n\
    a  1  2  3  4\nb  5  6  7  8\nc  9  10 11 12\n```\n\n```\nIn [10]: df1-s1\nOut[10]:\n\
