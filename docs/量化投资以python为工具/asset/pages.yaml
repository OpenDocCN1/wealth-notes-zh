    简单移动平均数（SMA）是对前 $n$ 期的价格求算术平均，随着时间点的推移加入新的价格，并剔除原有价格序列的第一个价格。简单移动平均数对不同时间点的价格序列赋予了同等的权重。加权移动平均数（WMA）则在计算平均数时，赋予个别价格数据不同权重，一般近期的数据权重大，远期的数据权最低。指数移动平均数类似于加权移动平均数，是以指数式递减加权的移动平均。


