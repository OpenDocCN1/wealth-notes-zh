- pgno: 513
  md: '收盘价上涨幅度稍微增大，则可能造成 RSV 取值过大，进而释放出市场处于“超买”行期的“假信号”。


    为了解决 RSV 波动幅度较大的问题，我们引入 K 指标，它是对 RSV 值进行平滑得到的结果。


    # 32.3.2 K、D 指标计算


    K 值由前一日的 K 值和当期 RSV 值经过一定权重调整后相加而得到，一般来说，K 值的计算为：


    $ \mathrm{K} $ 值 $ = \frac{2}{3} \times $ 前一日 K 值 $ + \frac{1}{3} \times $ 当日
    RSV


    用数学公式表达，第 $ t $ 日 K 值计算公式为：


    $ K_{t}=\frac{2}{3} \times K_{t-1}+\frac{1}{3} \times R S V_{t} $


    其中， $ K_{t} $ 为第 $ t $ 日 K 值， $ K_{t-1} $ 为第 $ t-1 $ 日 K 值， $ RSV_{t} $ 表示第 $
    t $ 日的 RSV 值。假设 $ K_{1}=30 $， $ RSV_{2}=60 $，则：


    $ \begin{aligned} K_{2} &=\frac{2}{3} \times K_{1}+\frac{1}{3} \times R S V_{1}
    \\ &=\frac{2}{3} \times 30+\frac{1}{3} \times 60 \\ &=40 \end{aligned} $


    D 值则是由前一日的 D 值和当期 K 值经过一定权重相加而得到。一般来说，D 值的计算为：


    $ \mathrm{D} $ 值 $ = \frac{2}{3} \times $ 前一日 D 值 $ + \frac{1}{3} \times $ 当日
    K 值


    用数学公式表达，第 $ t $ 日 D 值计算公式为：


    $ D_{t}=\frac{2}{3} \times D_{t-1}+\frac{1}{3} \times K_{t} $


    其中， $ D_{t} $ 为第 $ t $ 日 D 值， $ D_{t-1} $ 为第 $ t-1 $ 日 D 值， $ K_{t} $ 为第 $ t $
    日 K 值。


    此外，在计算第 1 期的 K 值和 D 值时，如果没有指定，则 K 值和 D 值默认取值为 50。在 K 值和 D 值的求解过程中，平滑权重 2/3 和 1/3
    是较为常用的权重，这两个权重也可以根据股价走势的特点进行适当修改。


    令 $ K_{1}=50, D_{1}=50 $，通过递归和迭代，可以推出 K 值是由未成熟随机指标 RSV 通过指数移动平均（Exponential Moving
    Average，EMA）而得到。同理，D 值是 K 值的指数移动平均数（EMA）。接下来，我们用 Python 编写代码来算 K 值和 D 值。


