  md: "但id 属于 asset3 这个对象的内部属性。从软件设计的角度考量，有些属性可能携带重要的信息或具有某种隐私性，像上例那样能够轻易地从外部函数直接访问内部属性，并不利于数据存取权限的管理。比较好的数据管理的做法是，把属性和访问属性的方法放在同一个对象中，使得信息载体和存取信息“藉由对象关联起来”。基于这个考量，我们对\
    \ Asset类做了如下修改：\n\n```\n```\nclass Asset(object):\n    \"\"\"\n        Asset class\
    \ with specified attributes 'id' and 'price'.\n    \"\"\"\n    def __init__(self,\
    \ id, price):\n        self.id = id\n        self.price = price\n    def print_id(self):\n\
    \        print('The ID of the asset is: %s' % (self.id))\n```\n```\n\n在类中定义的方法，可以用“实例.方法”的方式调用：\n\
    \n```\n```\nIn [4]: asset5 = Asset('005',20)\n\nIn [5]: asset5.print_id()\nThe\
    \ ID of the asset is: 005\n```\n```\n\n这样做的另一个好处是，可以把方法的实现逻辑隐藏类或对象的内部。不过，把方法写在对象内部，仍无法防止对象的属性被无关的函数意外改变或误用使用。为了对属性提供更加安全的保障，可以限制它们不被外界访问。在\
    \ Python 中，属性变量前加上两个下画线表示 private 属性，private 属性的存取只能在类的内部进行。在下例中，id 和 price 都被改成\
    \ private 属性。\n\n```\n```\nclass Asset(object):\n    def __init__(self, id, price):\n\
    \        self._id = id\n        self._price = price\n    def print_id(self):\n\
    \        print('The Asset ID is: %s' % (self._id))\n```\n```\n\n由于 private 属性只在类的内部可见，试图通过“实例.\
    \ 属性名称”从外部访问，Python 会报错：\n\n```\n```\nIn [7]: asset6 = Asset('006',30)\n\nIn [8]:\
    \ asset6._id\nTraceback (most recent call last):\n\n  File \"<python-input-8-8f4565007574>\"\
    , line 1, in <module>\n    asset6._id\nAttributeError: 'Asset' object has no attribute\
    \ '_id'\n```\n```"
