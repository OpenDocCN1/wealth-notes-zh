  md: "# 第12章 常用第三方库：Matplotlib库与数据可视化\n\n# 12.1 Matplotlib 简介\n\n通过对前面章节的学习，我们对 Python\
    \ 的诸多数据结构有了一定程度的了解，为了更直观地分析数据，数据可视化必不可少。在 Python 中有专门用于数据可视化的第三方库 Matplotlib。Matplotlib\
    \ 是 Python 语言最流行的绘图库，它模仿 MATLAB 中的绘图风格，并提供了一整套与 MATLAB 相似的绘图 API。通过 API，我们可以轻松地绘制出高质量的图形。Matplotlib\
    \ 的官网为 http://matplotlib.org/，上面提供了不同的操作系统安装 Matplotlib 的方法，读者可以根据自己的操作平台来选择安装\
    \ Matplotlib 的方法。此外，官网上还提供了详细的说明文档以及众多的案例供使用者学习。\n\n# 绘图小例子\n\n在做金融投资分析时，价格是我们分析市场行情的基础，最直观展现价格整体情况的方式莫过于价格曲线。以股票这种金融商品来说，可以通过分析价格曲线来发现股价的趋势，这在中短线投资中往往是不可或缺的一环。接下来，以中国银行股票的股价为分析对象，运用\
    \ Matplotlib 库中的相关函数来绘制中国银行股票的收盘价曲线。在进行绘图之前，先运用 Pandas 包的 read_csv() 函数读取数据。\n\
