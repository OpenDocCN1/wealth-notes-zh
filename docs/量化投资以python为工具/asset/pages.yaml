  md: '100，我们第一次抽样得到的置信区间是 [90, 110]，第二次抽样得到的置信区间可能变为 [95, 115]。总体的参数虽然未知，但它是确定的值。如果用某种方法构造的所有区间中，有
    95% 的概率区间包含真实值，5 的概率区间不包含真实值，那么，用该方法构造的区间叫作置信水平为 95% 的置信区间，简称 95% 置信区间。假设真实值是
    100，我们第一次抽样得到的置信区间是 [90, 110]，第二次抽样得到的置信区间为 [95, 115]，第三次抽样得到的置信区间是 [105, 125]，那么我们构造的所有区间中只有
    [90, 110] 和 [95, 115] 这两个区间包含真实值，有 1 个区间 [105, 125] (33.33%) 不包含真实值。因此，我们的置信水平是
    66.667。


    +   - 区间估计的方法


    若要进行区间估计，一般先需要对参数进行点估计，得到点估计值。然后用该点估计值加、减误差幅度（Margin of Error）与置信系数（Confidence
    Coefficient）的乘积而得到的两个取值，则是置信区间的两个端点。误差幅度与置信系数的计算较为复杂，我们不在这里细说，有兴趣的读者可以参考一些统计学方面的书籍。


    下面，我们用一个具体的例子来说明求解置信区间的过程。


    假设一个总体服从正态分布 N(μ, σ²)，x₁, x₂, ···, xₙ 是从该总体中抽得的一组样本。设 x̄ 为样本均值，s² 为样本方差。总体均值 μ
    的区间估计分总体方差已知和未知这两种情况。


    （1） 当总体方差 σ² 已知时，我们可以构建如下指标：


    ```

    $$\frac{\overline{x} - \mu}{\sigma/\sqrt{n}}$$

    ```


    其中 n 是样本量；σ/√n 为误差幅度。该指标服从标准正态分布，即 N(0, 1)，且区间估计的置信度为 1 − α。接下来，我们可以建立下面这个等式来求解置信区间的两个端点：


    ```

    $$\left|\frac{\overline{x} - \mu}{\sigma/\sqrt{n}}\right| = Z_{\alpha/2}$$

    ```


    其中 z_{α/2} 是标准正态分布的第 100 × (1 − α/2) 百分位数，即 F(z ≤ z_{α/2}) = 1 − α/2。关于均值为 μ，置信度为
    1 − α 的双侧置信区间为：


    ```

    $$\left[\overline{x} - \frac{\sigma}{\sqrt{n}}Z_{\alpha/2}, \overline{x} + \frac{\sigma}{\sqrt{n}}Z_{\alpha/2}\right].$$

    ```


    （2） 一般情况下，总体方差都是未知的。当总体方差 σ² 未知时，我们可以构建如下统计量：


    ```

    $$\frac{\overline{x} - \mu}{s/\sqrt{n}}$$

    ```


    该指标服从自由度为 (n − 1) 的学生 t 分布，即 t(n − 1)。假设区间估计的置信度'
