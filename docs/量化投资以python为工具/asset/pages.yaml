- pgno: 244
  md: '$$ \begin{aligned}\mathbb{E}(M S F) = \sigma_0^2 + \frac{1}{M-1}\sum_{j=1}^{M}
    N_j(\mu_j - \mu_0)^2 \\ \mathbb{E}(M S E) = \sigma_0^2 \end{aligned} $$


    在原假设 $H_0: \mu_1 = \mu_2 = \cdots = \mu_M = \mu_0$ 之下， $\mathbb{E}(MSF) = \mathbb{E}(MSE)
    = \sigma_0^2$ ，而且方差分析的统计量：


    $$ \varphi = \frac{MSF}{MSE} = \frac{FSS/(M-1)}{ESS/(N-M)} $$


    服从 $F(M-1, N-M)$ 分布。 $\varphi$ 统计量越大，说明组间均方差 MSF 与组内均方差 MSE 差异很大，且 $MSF > MSE$
    ，故 MSF 成为样本总波动的主要贡献，因子影响十分显著； $\varphi$ 统计量很小时，说明组间随机方差 MSE 是主要的方差来源，因子影响不显著。我们可以查阅
    $F$ 分布的临界值表，或者计算 $p$ 值来判断该统计量是否显著。


    现在，我们来总结一下方差分析的一般步骤：


    +   1. 根据感兴趣的因素（因子）的不同取值（水平）将反应变量分成 $M$ 个组；


    +   2. 提出原假设 $H_0$ ：因子对于反应变量没有影响；备择假设 $H_1$ ：因子对于观测变量有影响；


    +   3. 求出样本数据中每组的样本平均值及全样本均值，算出组内均方差 MSF 和组间均方 MSE；


    +   4. 构建 $\varphi$ 统计量并计算 $\varphi$ 值：


    $$ \varphi = \frac{MSF}{MSE} \sim F(M-1, N-M) $$


    +   5. 由显著性水平 $\alpha$ （通常取 0.025、0.05、0.1 等）查 $F$ 分布表的临界值 $F_\alpha(M-1, N-M)$
    （或计算 $\varphi$ 值对应的 $p$ 值）来判断是接受原假设还是拒绝原假设：


    +   • 如果 $\varphi > F_\alpha(M-1, N-M)$ （或 $p < \alpha$ ）则拒绝原假设，可以推断认为因子变量对反应变量有影响；


    +   • 如果 $\varphi < F_\alpha(M-1, N-M)$ （或 $p > \alpha$ ）则接受原假设，可以推断认为因子变量对反应变量没有影响。


    # # 16.3 方差分析之 Python 实现


    statsmodel 中的 anova 模块可以帮助我们进行方差分析。利用 anova 模块进行方差分析的一般途径是：先建立一个线性回归模型，然后再将该模型作为参数传入专门的函数之中，


    下面，我们调用该模块分别进行单因素方差分析与多因素方差分析。'
