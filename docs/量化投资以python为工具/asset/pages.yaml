  md: '# ### 18.2 连续复利收益率


    本文要介绍的是复利的一个特例——连续复利（Continuous Compounding），连续复利的概念是投资期数趋于无穷大、而不同期之间的时间间隔无穷小，分分秒秒都在复利，也就是说刚刚获得的收益马上就获得收益的收益，几乎没有时间间隔。如果单期简单收益率（未考虑复利）是
    $R$，该期间有 $n$ 个复利结算周期，对应的 $T$ 期收益率为：


    ```

    $$\left( 1+\frac{R}{n} \right)^{nT}-1$$

    ```


    根据连续复利的思想，当 $n \to \infty$ 时即得 $T$ 期连续复利的收益率：


    ```

    $$\lim_{n \to \infty}\left( 1+\frac{R}{n} \right)^{nT}-1=e^{RT}-1$$

    ```


    在连续复利下，期初投资 $A_0$ 元持有到 $T$ 期结束，资产会变成 $A_0e^{RT}$ 元。现在假设单期简单收益率是 $R_t$，通过连续复利产生与
    $R_t$ 相同收益的单期复利收益率叫作连续复利收益率（Continuous Compounded Rate of Return），该收益率（标记为 $r_t$）应该满足：


    ```

    $$1+R_t=e^{rt}$$

    ```


    即：


    ```

    $$r_t=\ln\left( 1+R_t \right)$$

    ```


    如果 $1+R_t$ 是用资产的期初价格 $P_{t-1}$ 及期末价格 $P_t$ 求得，则：


    ```

    $$r_t=\ln\left( \frac{P_t}{P_{t-1}} \right)=\ln P_t-\ln P_{t-1}$$

    ```


    即资产的单期连续复利收益率等于资产期初期末价格的自然对数之差。


    我们继续以万科股票为例，2014 年 1 月 9 日的收盘价为 7.46 元，1 月 8 日的收盘价为 7.42 元，1 月 7 日的收盘价为 7.43 元。假设
    2014 年 1 月 2 日为第 1 天，则 1 月 9 日为第 6 天，即 $t=6$。通过计算，得知 1 月 9 日单期简单收益率为：


    ```

    $$R_6=\frac{7.46-7.42}{7.42}=0.539\%$$

    ```


    对应的单期连续复利收益率为：


    ```

    $$r_6=\ln\left( 1+R_6 \right)=\ln\left( 1+0.5391\% \right)=0.537\%$$

    ```


    或'
