    \n和卡方分布一样，$F$ 分布也是一种非对称分布。与卡方分布、$t$ 分布类似，$F$ 分布在许多假设检验问题中有广泛的应用。\n\n# ## 14.6\
    \ 变量的关系\n\n读到这里，想必读者已经能够对单个变量做出简单的描述。不过，我们常常面对的是多个随机变量，而这些变量之间有可能会互相影响。比如，投资人想要了解多只股票的收益率之间是否有关系，或者多家公司的营收是否会互相影响等。下面将重点描述两个随机变量之间的联合行为。\n\
    \n# ### 14.6.1 联合概率分布\n\n多个随机变量之间的联合行为可用联合概率分布（Joint Probability Distribution）来刻画。下面以两个随机变量为例，说明联合概率分布的表示方法。\n\
    \n若两个随机变量 $X$ 和 $Y$ 为离散的，其所有可能取值分别为集合 $\\{a_k\\}$ 和 $\\{b_k\\}$，$k=1,2,\\dots$，则\
    \ $X$ 和 $Y$ 的联合概率质量函数（Joint Probability Mass Function）为：\n\n$$f_{X,Y}(a_i, b_j)\
    \ = \\mathbb{P}\\{X = a_i \\text{且} Y = b_j\\}, \\qquad i, j = 1,2,\\dots$$\n\n\
    也就是说 $f_{X,Y}(a_i, b_j)$ 是变量 $X$ 取值为 $a_i$、变量 $Y$ 取值为 $b_j$ 之事件发生的概率。\n\n双变量 $X$\
    \ 和 $Y$ 的联合累积分布函数（Joint Cumulative Distribution Function）为：\n\n$$F_{X,Y}(a, b)\
    \ = \\mathbb{P}\\{X \\leqslant a \\text{且} Y \\leqslant b\\}$$\n\n当 $X$ 和 $Y$\
    \ 是离散型的：\n\n$$F_{X,Y}(a, b) = \\sum_{i:a_i \\leqslant a} \\sum_{j:b_j \\leqslant\
    \ b} \\mathbb{P}\\{X = a_i \\text{且} Y = b_j\\} = \\sum_{i:a_i \\leqslant a} \\\
    sum_{j:b_j \\leqslant b} f_{X,Y}(a_i, b_j)$$\n\n当 $X$ 和 $Y$ 是连续型的：\n\n$$F_{X,Y}(a,\
    \ b) = \\int_{-\\infty}^{a} \\int_{-\\infty}^{b} f_{X,Y}(x, y) \\, \\mathrm{d}x\
    \ \\, \\mathrm{d}y$$"
