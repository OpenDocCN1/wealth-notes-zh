- pgno: 363
  md: '# 第24章 时间序列预测


    我们再来回顾一下时间序列分析的思想：根据序列的历史信息来预测未来，进行预测的前提是序列是平稳的，即序列的基本特性不发生大的改变。不过若时间序列是特殊的平稳序列——纯随机过程（白噪声过程），也就是无自相关性，那么预测也无法进行。因此，我们将要对平稳的、非随机序列进行分析，以预测未来。预测的方式通常是建立预测模型，预测模型的一般表达形式为：


    ```

    $$x_{t+1} = f(x_i), \quad i \leq t$$

    ```


    也就是说，当位于 $t$ 时点时，是利用 $t$ 期和 $t$ 期之前的信息对下一期的变量取值进行预测。


    # 24.1 移动平均预测


    若时间序列具有稳定性或规则性，那么时间序列有可能会在未来保持过去几期的发展态势。时间序列分析中最简单的预测模型就是将过去期的变量取值进行平均，将平均值作为下一期的预测值。由于在取平均数时，数值的随机波动成分在一定程度上会被消除掉，所以得到的预测值受过去极端值的干扰减少，从而达到平滑的效果，因此这种平均数预测法被称为移动平均预测法（Moving
    Average）。根据“取平均”方式之不同，可以将移动平均法分为简单移动平均法（Simple Moving Average）、加权移动平均法（Weighted
    Moving Average）和指数加权移动平均法（Exponential Moving Average）等。


    # 24.1.1 简单移动平均


    简单移动平均是用某一时间点前 $n$ 期的数值之简单平均数来预测该时点的数值，以达到平滑的效果。简单地说，我们用 $x_t, x_{t-1}, x_{t-2},
    \ldots, x_{t-n+1}$ 这 $n$ 个数的简单平均数来预测 $x_{t+1}$，可以用数学公式表达为：


    ```

    $$\hat{x}_{t+1} = \frac{x_t + x_{t-1} + x_{t-2} + \ldots + x_{t-n+1}}{n}$$

    ```


    式中各变量的含义如下。


    +   • $\hat{x}_{t+1}$: 对下一期的预测值，或者当期的简单移动平均数；

    • $x_t$: 当期随机变量的实现值；

    • $x_{t-i}$: 前 $i$ 期随机变量的实现值；

    • $n$: 平均值的计算中包括过去观察值的个数。每出现一个新观察值，就要从移动平均中减去一个最早观察值，再加上一个最新观察值。'
  merge: -1
  img_proc: true
- pgno: 364
  md: '# ### 24.1.2 加权移动平均


    简单移动平均对每一期的数值都赋予相同的权重，也就是说，它认为每一个时期的数据对于新的预测值或者平滑值的影响是一样的。但现实生活中可能并非如此，即有时候简单移动平均对于信息的利用不是很充分。加权移动平均法则是根据同一个时间段内不同时间的数据对预测值的影响程度，分别给予不同的权重，其计算公式为：


    ```

    $\hat{x}_{t+1} = w_0 x_t + w_1 x_{t-1} + \cdots + w_n x_{t-n+1}$

    ```


    +   - $\hat{x}_{t+1}$: 对下一期的预测值，或者当期的加权移动平均数；

    - $x_t$: 当期随机变量的实现值；

    - $x_{t-i}$: 前 $i$ 期随机变量的实现值；

    - $w_0$: 当期实现值的权重；

    - $w_i$: 前 $i$ 期实现值的权重，如 $w_1$ 为前一期实现值的权重；余类推。


    # ### 24.1.3 指数加权移动平均


    指数加权移动平均兼具全期平均和移动平均所长：不舍弃过去的数据，但是随着数据时间点的远离，其权重逐渐递减。指数加权移动平均法的基本思想是：考虑时间间隔对事件发展的影响，各期权重随时间间隔的增大而呈指数衰减。其计算公式如下：


    ```

    $\hat{x}_{t+1} = \alpha x_t + \alpha(1 - \alpha)x_{t-1} + \alpha(1 - \alpha)^2
    x_{t-2} + \cdots$

    ```


    其中，$\alpha$ 为平滑系数，满足 $0 < \alpha < 1$。经验表明，$\alpha$ 的值介于 0.05 ~ 0.3 之间，修订效果比较好。同理可得：


    ```

    $\hat{x}_t = \alpha x_{t-1} + \alpha(1 - \alpha)x_{t-2} + \alpha(1 - \alpha)^2
    x_{t-3} + \cdots$

    ```


    所以结合上述两个公式我们可以得到：


    ```

    $\hat{x}_{t+1} = \alpha x_t + (1 - \alpha) \hat{x}_t$

    ```


    +   - $\hat{x}_{t+1}$: 对下一期的预测值，或者当期的指数加权移动平均数；

    - $x_t$: 当期随机变量的实现值；

    - $\hat{x}_t$: $t - 1$ 期对 $t$ 期的预测值，或 $t - 1$ 期的指数加权移动平均数；

    - $\alpha$: 为平滑系数。


    从整理后的公式我们可以发现，任一期的指数加权移动平均数都是本期实际观察值 $x_t$ 与前一期指数加权移动平均数的加权平均 $\hat{x}_t$。确定 $\hat{x}_t$
    的初值 $\hat{x}_1$ 通常有两种方法：一种是取第'
