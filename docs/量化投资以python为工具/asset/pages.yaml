- pgno: 366
  md: '# 24.2.1 自回归模型


    AR 模型是一个线性模型，将时间序列变量当期的实现值作为被解释变数、过去期的历史资料当作解释变数，因此被称作自回归模型。p 阶自回归模型（Auto Regressive
    Model，AR(p)）的一般表达式为：


    ```

    $$x_{t}=\phi_{0}+\phi_{1} x_{t-1}+\phi_{2} x_{t-2}+\ldots+\phi_{p} x_{t-p}+\varepsilon_{t}\tag{24.1}$$

    ```


    其中 $\{\varepsilon_{t}\}$ 是一个白噪声序列，即满足：


    ```

    $$\mathbb{E}\left(\varepsilon_{t}\right)=0 ; \quad \operatorname{Var}\left(\varepsilon_{t}\right)=\sigma_{\varepsilon}^{2}
    ; \quad \mathbb{E}\left(\varepsilon_{t} \varepsilon_{s}\right)=0, \quad \forall
    s \neq t$$

    ```


    且解释变数 $x_{s}$ 与残差项 $\varepsilon_{t}$ 无相关性，即 $\mathbb{E}\left(x_{s} \varepsilon_{t}\right)=0,
    \quad \forall s<t$ 。为了研究 AR 模型的统计性质，我们先举个简单的例子，假设平稳的时间序列 $x_{t}$ 可以用 AR(2) 模型来刻画：


    ```

    $$x_{t}=\phi_{0}+\phi_{1} x_{t-1}+\phi_{2} x_{t-2}+\varepsilon_{t}, \quad\left|\phi_{1}\right|<1,\left|\phi_{2}\right|<1\tag{24.2}$$

    ```


    因为平稳的时间序列之均值不随时间发生改变，所以：


    ```

    $$\mu=\mathbb{E}\left(x_{t}\right)=\phi_{0}+\phi_{1} \mathbb{E}\left(x_{t-1}\right)+\phi_{2}
    \mathbb{E}\left(x_{t-2}\right)+\mathbb{E}\left(\varepsilon_{t}\right)$$

    ```


    即：


    ```

    $$\mu=\phi_{0}+\phi_{1} \mu+\phi_{2} \mu+0 \\\mu=\frac{\phi_{0}}{1-\phi_{1}-\phi_{2}}$$

    ```


    然后我们将公式左右两边分别去掉均值 $\mu$ 可得：


    ```

    $$\begin{aligned} x_{t}-\mu & =\phi_{0}+\phi_{1}\left(x_{t-1}-\mu\right)+\phi_{2}\left(x_{t-2}-\mu\right)+\left(\phi_{1}+\phi_{2}-1\right)
    \mu+\varepsilon_{t} \\ & =\phi_{1}\left(x_{t-1}-\mu\right)+\phi_{2}\left(x_{t-2}-\mu\right)+\varepsilon_{t}\tag{24.3}
    \end{aligned}$$

    ```


    将公式 (24.3) 左右两边分别乘以 $(x_{t-1} - \mu)$ 再除以方差 $\gamma_0$ 之后，可以得到以下公式：


    ```

    $$\frac{\gamma_{1}}{\gamma_{0}}=\phi_{1} \frac{\gamma_{0}}{\gamma_{0}}+\phi_{2}
    \frac{\gamma_{1}}{\gamma_{0}}$$

    ```


    即：


    ```

    $$\rho_{1}=\phi_{1}+\phi_{2} \rho_{1}$$

    ```'
  merge: -1
  img_proc: true
- pgno: 367
  md: '可以解得：


    ```

    \rho_{1}=\frac{\phi_{1}}{1-\phi_{2}}

    ```


    用同样的方式乘以 $(x_{t-2}-\mu)$ 可得：


    ```

    \rho_{2}=\phi_{1}\rho_{1}+\phi_{2}

    ```


    这样可以计算出：


    ```

    \begin{align*} &\rho_{1}=\frac{\phi_{1}}{1-\phi_{2}} \\ &\rho_{2}=\phi_{1}\rho_{1}+\phi_{2}
    \end{align*}

    ```


    公式(24.3)左右两边同时乘以 $(x_{t-k}-\mu),\forall k\geqslant3$，可得三阶以上（包含三阶）的自相关系数 $\rho_{k}=\phi_{1}\rho_{k-1}+\phi_{2}\rho_{k-2}$，可以看出符合AR模型的时间序列之自相关系数会随着阶数的增加而减小，但是很多阶数之后仍不等于0，会呈现出所谓拖尾的现象。


    现在我们将分析拓展至AR(p)模型，如果时间序列是平稳的，可得：


    ```

    \mu=\frac{\phi_{0}}{1-\phi_{1}-\phi_{2}-\cdots-\phi_{p}}

    ```


    将公式(24.1)左右两边减去均值 $\mu$，可得：


    ```

    \begin{align*} &x_{t}-\mu=\phi_{1}(x_{t-1}-\mu)+\phi_{2}(x_{t-2}-\mu)+\cdots+\phi_{p}(x_{t-p}-\mu)+\varepsilon_{t}
    \\ \tag{24.4} & \end{align*}

    ```


    将公式(24.4)左右两边分别乘以 $(x_{t}-\mu)$、$(x_{t-1}-\mu)$、…、并除以方差 $\gamma_{0}$ 可得：


    ```

    \begin{align*} &1=\phi_{1}\rho_{1}+\phi_{2}\rho_{2}+\cdots+\phi_{p}\rho_{p} \\
    &\rho_{1}=\phi_{1}+\phi_{2}\rho_{1}+\phi_{3}\rho_{2}+\cdots+\phi_{p}\rho_{p-1}
    \\ &\rho_{2}=\phi_{1}\rho_{1}+\phi_{2}+\phi_{3}\rho_{1}+\cdots+\phi_{p}\rho_{p-2}
    \\ &\vdots \\ &\rho_{p}=\phi_{1}\rho_{p-1}+\phi_{2}\rho_{p-2}+\phi_{3}\rho_{p-3}+\cdots+\phi_{p}
    \end{align*}

    ```


    根据这些线性关系式，我们可以解得 $\rho_{1},\rho_{2},\dots,\rho_{p}$，对于大于 $p$ 阶的自相关系数 $\rho_{k}$，也有：


    ```

    \rho_{k}=\phi_{1}\rho_{k-1}+\phi_{2}\rho_{k-2}+\cdots+\phi_{p}\rho_{k-p}

    ```


    因此，符合AR(p)模型的平稳时间序列，其自相关系数在 $p$ 阶之后仍然可能不为0。'
