- pgno: 226
  md: '# 第 15 章 推断统计


    统计分析方法主要有描述性统计和推断统计两类，其中描述性统计主要是总结样本数据之特征，而推断统计则是在样本有限数据的基础上，对总体统计特征做出概率形式表述的推断。推断统计工作包含两类：参数估计（Parameter
    Estimation）和假设检验（Hypothesis Testing）。


    # 15.1 参数估计


    一般来说，根据专业知识、以往的经验或用适当的统计方法，可以判断某些变量的概率分布类型。但是，这并不代表我们可以确定变量的概率分布。回顾第 14 章中介绍过的正态分布，其概率密度函数为：


    ```

    $f_X(x) = \frac{1}{\sqrt{2\pi}\sigma} \exp \left[ \frac{-(x - \mu)^2}{2\sigma^2}
    \right]$

    ```


    很明显，即使我们知道了一个变量服从正态分布，如果不知道 $\mu$ 和 $\sigma^2$，仍然无法得到变量确切的概率分布。此时，我们就可以用样本数据来估计
    $\mu$ 和 $\sigma^2$。这种根据样本数据来估计变量的概率分布，或者说是总体分布所包含的未知参数的过程，就叫作参数估计（Parameter Estimation）。


    参数估计是推断统计的一种重要方法。例如，为了研究人们的市场消费行为，首先需要了解人们的收入状况，若某城市人均年收入数据服从正态分布，但正态分布 $N(\mu,
    \sigma^2)$ 的参数均值 $\mu$、方差 $\sigma^2$ 的具体取值未知，此时我们就可以通过样本来估计这两个参数。参数估计通常有点估计（Point
    Estimation）和区间估计（Interval Estimation）两种形式。


    +   点估计是用一个具体的值来估计一个总体的未知参数，能够直接告诉我们未知参数的估计值是多少。但是，样本数据毕竟只是总体的一部分，捕捉的信息终究有限。因此，我们使用样本数据估计出的结果不可避免地会出现一定的偏差。


    +   区间估计则考虑到了估计存在的误差，因而不是使用一个具体的值，而是用两个数值所构成的区间来估计一个未知的参数。这样，我们的估计结果包含总体参数的值的概率就增加了。在提供估计结果的同时，区间估计还往往指明此区间可以覆盖住这个参数的可靠程度。但是，区间估计却不能直接告诉人们未知参数是多少。


    总的来说，点估计的结果更加直观，但是往往会与真实情况有一定的偏差；区间估计在大多数情况下能够包含真实的取值，但其结果不如点估计的结果那么直观。在实际操作'
  merge: -1
  img_proc: true
- pgno: 227
  md: '中，我们通常根据自己的需要选择是点估计还是区间估计。


    # 15.1.1 点估计


    点估计又叫作定值估计，是以样本指标的数值来作为总体指标的估计量。在实际估计中，往往以样本指标的实际值直接作为总体未知参数的估计值。点估计的好坏与选择的样本指标是否具备良好的特质有关。例如，当我们利用样本数据结合点估计的方法来估计总体均值时，理论上样本反映中心位置的指标都可以用于估计总体均值，可以选择的指标有样本均值、中位数、众数等。但是，理论和实践都表明，相较于样本中位数，用样本均值去估计总体均值得到的结果往往会更加准确。


    点估计的方法之一——矩估计法（Moment Estimation）：我们先来了解一下什么是矩。一个变量 $X$ 的 $k$ 阶矩即是 $X$ 的 $k$ 次方的均值，数学表达为
    $\mathbb{E}(X^k)$。而总体矩就是我们所研究的变量的矩，样本矩则是总体矩的估计值。矩估计法即是通过使用样本矩来求解总体参数的估计值。也就是说，我们可以将前
    $k$ 阶总体矩用 $k$ 个未知参数来表示，然后用前 $k$ 阶样本矩替代表达式中的前 $k$ 阶总体矩，从而得到一个方程组，进而求出参数的估计值。最简单的矩估计法是用一阶样本矩
    $\bar{x}$ 来估计总体的一阶矩（均值）$\mu$，即：


    $$\hat{\mu} = \bar{x} = \frac{x_1 + x_2 + \cdots + x_n}{n}$$


    其中，$x_1, x_2, \ldots x_n$ 是抽得的一组样本，$n$ 是样本中数据的数目。


    矩估计法的优点是原理简单、使用方便。但是，它只涉及总体的一些统计特征，并未用到总体的分布。所以，矩估计法量实际上只利用了总体的部分信息，因而往往不能够很好地体现总体分布特征。一般来说，在样本容量
    $n$ 较大时，我们才能保证矩估计结果的优良性。


    # 15.1.2 区间估计


    区间估计用一个包括有真实值的区间范围来估计参数的取值范围，得到的结果为置信区间（Confidence Interval）。区间估计的可信程度称为置信度或者置信水平（Confidence
    Level），一般用 $1-\alpha$ 表示（$\alpha$ 取值大小由实际问题确定，经常取 $1\%$、$5\%$、$10\%$），用数学表示置信区间为：


    $$\text{Pr}(\theta_1 \leq \theta \leq \theta_2) = 1-\alpha$$


    我们称区间 $[\theta_1, \theta_2]$ 是参数 $\theta$ 置信度为 $1-\alpha$ 的置信区间。


    我们应该怎么理解置信水平呢？点估计的取值会随着样本数据的变化而变化，区间估计的随机区间也会因样本的不同而不同。置信水平即是我们用同样的方法重复多次取样并进行区间估计的过程后，得到的置信区间中包含真实值的比例。例如，假设总体真实值是'
  merge: -1
  img_proc: true
