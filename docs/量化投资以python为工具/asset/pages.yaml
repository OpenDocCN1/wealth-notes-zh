  md: '# 33.2.7 价跌量平


    “价跌量平”表示当价格下跌时，成交量不是下跌而是保持平稳状态。在下跌行情中，价跌量平释放出趋势回稳的信号，但是还没有办法预测后市的价格走势。如果“价跌量平”跟随在“价平量平”的后面，则表明市场已经开始下跌行情，成交量不变，股价大幅下滑，这种情况预示着投资者可能要考虑及时出逃。


    # 33.2.8 价跌量缩


    “价跌量缩”形态表明股价下跌的同时成交量也在收缩。当市场处于盘整阶段，市场价格下跌，一部分投资者逃离市场，会出现“价跌量缩”的情形。在市场盘整阶段，“价跌量缩”形态是正常的现象。另一方面，在单边下跌行情阶段，“价跌量跌”形态体现出市场即将出现止跌的情形，空方力量逐渐耗尽，市场中卖出量较小，成交量也在减小。此外，在单边下跌行情阶段，市场行情不好，买方力量极弱，市场中接单量较小，也会出现出“价跌量缩”的情形。


    如图 33.4 所示，观察长江证券股票 2014 年前 3 个月的 K 线图，价格整体处于下跌行情中，2014 年 1 月初，价格有明显的下跌趋势。从短期看，出现了“价跌量缩”的形态，接着股票价格上涨，成交量也略微增加，而后成交量继续下跌，股价也跟着处于下跌行情中。在
    2 月中旬，股价和成交量呈现出“价跌量增”的形态，市场处于下跌趋势。在“价跌量增”形态以后，股价大幅下跌，成交量也处于缩量状态，市场短期盘整以后接着下跌。在
    3 月末期，股价下跌的同时，成交量变化较小，出现了“价跌量平”的形态，说明市场下跌的趋势有放缓或者反转倾向。


