- pgno: 497
  md: '布林带通道的趋势主要由中轨道平均线决定，当平均线呈现向上趋势时，布林带通道也会向上走，当平均线走低时，布林带通道也会有向下趋势。布林带通道的带宽由股价的标准差决定；而股价的标准差刻画了股价波动范围的大小，当股价波动较大时，标准差较大，进而布林带上下通道的带宽越大；反之，当股价波动幅度较小时，标准差越小，布林带带宽则会相应变窄。


    # ### 布林带通道的计算方式


    令 $p_{t+1-n}, p_{t+2-n}, \cdots, p_{t}$ 表示股票在第 $t$ 期观测到的前 $n$ 期（包括第 $t$ 期）的股票价格，据此数据，可以计算股票的
    $n$ 期均值（即布林带的中轨线 $u_{t}$ ）为：


    $u_{n} = \frac{1}{n} \sum_{i=1}^{n} p_{i}$


    用 $\bar{B}_{n}$ 表示布林带的上轨线值，其可由以下公式计算而得：


    $\bar{B}_{n} = u_{n} + a \times \sigma_{n}$


    同理，用 $\underline{B}_{n}$ 表示布林带的下轨线值，则：


    $\underline{B}_{n} = u_{n} - a \times \sigma_{n}$


    其中， $\sigma_{n}$ 表示股票价格在过去 $n$ 期的标准差，计算公式为：


    $\sigma_{n} = \sqrt{\frac{1}{n} \sum_{i=1}^{n} (p_{i} - u_{n})^{2}}$


    而 $a$ 表示标准差的倍数。


    从上述计算公式可以看出，时间区间 $n$ 和标准差倍数 $a$ 的取值会影响到布林带三条通道的计算结果。一般而言， $n$ 取值为 20 天， $a$ 取值为
    2，依此设定，布林带通道线的计算如下。


    +   中轨道：


    均值 $=$ 过去 20 天股价的算数平均值


    数学式可写为：


    $u_{20} = \frac{1}{20} \sum_{i=1}^{20} p_{i}$


    股价的标准差为：'
