  md: "# 第7章 函数\n\n如同其他程序语言一样，Python 函数也是将一些语句集合在一起的程序结构，使得代码能够最大程度地被重复利用并减少冗余。此外，函数也是一种编程抽象化过程，透过函数我们可以很有逻辑地做模块化的思考，更有利于厘清高层次的抽象问题而避免同时处理底层的细节。因此，我们可以把函数理解为将底层操作封装起来，对操作或计算流程予以抽象化的机制。\n\
    \n# 7.1 函数的定义与调用\n\nPython 定义函数的基本语法如下：\n\n```\ndef <name>(<arg1, arg2, ..., argN>):\n\
    \    <statements>\n    return <expression>\n```\n\n定义函数使用 def 这个关键词（Key Word）开头，之后空一格接函数名\
    \ <name>，然后是放在小括号中的参数 arg1, arg2... 等；参数不是必须的，没有参数的函数小括号中留空。<statements> 为构成函数主体的语句集合，必须缩进。return\
    \ 结束函数，选择性地返回一个值到调用函数之处。不带 return 的表达式相当于返回 None；或者，我们可以明确地写出 return None，或简写为\
    \ return。\n\n```\nIn [29]: def my_subtraction(minuend, subtrahend):\n...     \
    \   difference = minuend - subtrahend\n...        return difference\n... :\n```\n\
    \n从上例中可以发现，在 IPython 交互环境中定义函数时，会出现 “...” 的提示。函数定义结束后需要按两次回车键重新回到提示符下。\n\n与 C\
    \ 语言不同的是，def 是一个可以执行的语句。以上例来说，函数 my_subtraction (minuend, subtrahend) 本来不存在，当\
    \ Python 解释器运行了 def 后，会创建类型为 function 的对象，并指向（绑定）名称 my_subtraction。\n\n函数的定义与调用不是同一回事。使用\
