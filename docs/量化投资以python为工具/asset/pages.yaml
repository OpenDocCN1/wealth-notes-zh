  md: "+   ● 滞后或者超前操作\n\n滞后操作指的是将 t 期的数据换成 t-a 期的数据，而超前操作自然是将 t 期的数据换成 t+a 期的数据。在实际应用中，这样的操作非常常见。比如，在计算收益率的时候，我们就可以简单地将数据滞后\
    \ 1 期，然后用原来的数据减去滞后 1 期的数据，得到每期的价格变化，然后再除以滞后 1 期的数据就得到了收益率。\n\n对于滞后或者超前操作，可以使用\
    \ shift() 方法：\n\n```\nIn [26]: ts.shift(1) # 正数为滞后\nOut[26]:\n2016-01-01    NaN\n\
    2016-01-02      1\n2016-01-03      2\ndtype: float64\n\nIn [27]: ts.shift(-1)\
    \ # 负数为超前\nOut[27]:\n2016-01-01      2\n2016-01-02      3\n2016-01-03    NaNa\n\
    dtype: float64\n```\n\n下面，我们例举一个计算收益率的例子：\n\n```\nIn [37]: price=pd.Series([20.34,\
    \ 20.56, 21.01, 20.65, 21.34],\n             : index=pd.to_datetime(['2016-01-01',\
    \ '2016-01-02',\n             : '2016-01-03', '2016-01-04', '2016-01-05']))\n\n\
    In [38]: (price-price.shift(1))/price.shift(1)\nOut[38]:\n2016-01-01    NaNa\n\
    2016-01-02     0.01016\n2016-01-03     0.021887\n2016-01-04    -0.017135\n2016-01-05\
    \     0.033414\ndtype: float64\n```\n\n+   ● 高低频时间数据转换\n\n对于时间序列数据，往往需要在高低频数据之间进行转换，比如，当我们手头的数据为日度数据时，如果需要计算月度的收益率，就可以将日度数据转换成月度数据，然后计算月度的收益率。\n\
    \n时间序列数据的 index 的 freq 属性显示了数据的频率，一般情况下，如果没有指定 freq 的值，默认会将 freq 设为 None：\n\n\
    ```\nIn [45]: ts.index.freq is None\nOut[45]: True\n```\n\n可以通过 resample() 来修改数据的频率，进行高低频数据的转换。resample()\
    \ 的第一个参数指定了数据的频率，而第二个参数则指定了转换的方法。"
