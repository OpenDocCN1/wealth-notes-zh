    # ### 18.4.6 通货膨胀风险


    通货膨胀是指一国物价水平普遍上涨的经济现象，通货膨胀风险是因为通货膨胀的变动对金融资产的价值造成的影响。当通货膨胀率非预期增高时，金融投资者的投资标的的价值就会因为物价水平的上升而下降。而且当收入增加速度赶不上通货膨胀率时，其购买力就会下降，因此通货膨胀也会影响到投资人对金融资产的需求。不过，相对而言，通货膨胀风险对长期投资者的影响更大一些。


    # ### 18.4.7 营运风险


    对企业来说，营运风险是指企业在运行过程中，由于其管理、经营能力而导致的利润损失的可能性。对于金融投资者来说，营运风险是指在投资过程中因为知识能力的局限对未来预期不准确，从而导致决策的不合理或操作不恰当使投资收益面临损失的风险。营运风险主要表现有两种：一是因为信息不对称或信息流通渠道不畅通，导致决策者判断失误造成损失；二是操作上的失误，比如操作人员由于疏忽大意或偶然原因没能执行决策者的意愿造成损失。例如，2013
    年 8 月 16 日的“光大证券乌龙指”事件，由于光大证券的订单生成系统存在缺陷，导致在 8 月 16 日 11 时 05 分 08 秒之后的 2 秒内，瞬间重复生成
    26082 笔预期外的市价委托订单（价值 234 亿元人民币的错误买盘），成交约 72 亿元，造成上证综指瞬间上涨 5.96%，对市场产生了巨大冲击，也使光大证券蒙受了巨大损失。


    # ## 18.5 资产风险的测度


    # ### 18.5.1 方差


    用方差度量风险是由 Markowitz 在 1952 年发表其均值-方差投资组合理论中提出的，在他的理论中，金融资产的风险用该资产收益的不确定性来度量，他借用统计学中方差的概念来描述这种不确定性，这就是所谓的方差风险度量方法。从此以后，风险这种主观的感受可以用量化的方式表现出来。单个资产的风险具体可以表达为：


    ![](img/0de14a685304f8aa267f6492145864ac_284_0.png)'
