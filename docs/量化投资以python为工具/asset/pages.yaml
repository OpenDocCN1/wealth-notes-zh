  md: '传统 CAPM 模型中投资组合 q 可以是任意投资组合，因此可以是单只股票 i，这样我们就可以得到现在广为流布的 CAPM 模型之表达式：


    E(Rᵢ) = R_f + βᵢ[E(Rₘ) − R_f] (20.2)


    其中 βᵢ = σ(Rᵢ, Rₘ) / σ²(Rₘ)，可以反应出单只股票的系统风险水平，若 βᵢ = 1，则股票 i 的价格和大盘指数的波动性是一致的；若
    |βᵢ| < 1，则股票 i 的价格波动程度小于大盘指数；若 |βᵢ| > 1，则股票 i 的价格波动更大一些。β 值为正说明股票 i 的价格与大盘指数同方向变动，反之则反向变动。CAPM
    模型说明，单只股票的期望收益是无风险收益加上系统性风险溢酬，非系统风险可以通过分散化投资消除，因此没有对应的风险溢酬。如果将公式 (20.2) 用图形表示出来，纵轴为不同股票或投资组合收益率之期望值，横轴为对应的
    Beta 值，则可以得到一条直线，这条直线被称为证券市场线（Security Market Line），该直线截距为 R_f，斜率为 E(Rₘ) − R_f。如图
    20.1 所示。


    ![](img/0de14a685304f8aa267f6492145864ac_317_0.png)


    # 20.2 CAPM 模型的应用


    CAPM 模型一经提出，就迅速在学术界和实务界得到广泛应用。在学术界，CAPM 模型在研究公司金融（Corporate Finance）方面已经成为学者们必用的检测模型；在投资（Investment）方面的研究中，CAPM
    模型也被用来验证新的投资策略是否有效；也有学者从模型本身出发，试图让 CAPM 模型进一步贴近现实。在投资界，CAPM 模型可谓经久不衰，很多券商会提供个股的
    β 值以供投资者参考；Alpha 策略也成为专业投资人必备的技能。在公司财务管理领域，CAPM 的流行程度可以从 Grahram 和 Harvey（2001）¹的问卷调查结果中看出，他们对
    392 位 CFO 发放了调查问卷，结果发现有 73% 的 CFO 总是或者


    > ¹Graham, John R., and Campbell R. Harvey. “The theory and practice of corporate
    finance: Evidence from the field.” Journal of financial economics 60.2 (2001):
    187-243.'
