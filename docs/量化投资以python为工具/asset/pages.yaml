    # 习题


    +   1. 证明 GARCH 模型中的\(\varepsilon_t\)的自相关系数为0。


    +   2. 将 ARCH 模型转换为\(\{\varepsilon_t^2\}\)的 AR 模型，并对比两者的阶数。


