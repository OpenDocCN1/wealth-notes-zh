  md: '![](img/0de14a685304f8aa267f6492145864ac_178_0.png)


    # 12.2.2.4 增加图形背景 grid


    绘图时常常会在图形背景中增添方格，以便于人们更直观地读取线条中点的坐标取值以及线条整体的分布范围。在 Matplotlib 包中，pyplot 包内的 grid()
    函数用于增加并设定图形的背景。函数参数形式如下：


    ```

    matplotlib.pyplot.grid(b=None, which=''major'', \

    axis=''both'', **kwargs)

    ```


    +   参数 b：布尔类型数据，设定是否显示 grid。默认取值为 None，不显示 grid；如果要显示 grid，则将 b 的取值设为 True;


    +   参数 which：设定坐标轴分割标示线（tick）的类型，取值为 “major”、“minor”或者“both”。默认为 “major”，表示以原本的坐标轴分割标示线为准；若取值为
    “minor”，则表示进一步细分坐标轴分割标示线，但是分割标准要提前设定好，如果只是设定值为 “minor”，则图形不会显示 grid。“both” 表示大小区间坐标轴分割线都有。


    +   参数 axis：制定绘制 grid 的坐标轴。取值为 “both”(default)，“x”、或者“y”。“both”表示 X 轴和 Y 轴的 grid
    都绘制。


    接下来，为中国银行价格曲线图增加背景 grid，代码如下，绘制的图形如图 12.12 所示。


    ```

    In [8]: plt.plot(Close[''2014''], label=''收盘价'')

    ....: plt.xlabel(''日期'')

    ....: plt.ylabel(''当前点'')

    ....: plt.title(''中国农行 2014 年收盘价趋势'')

    ....: plt.grid(True, axis=''y'')

    ```'
  merge: -1
  img_proc: true
