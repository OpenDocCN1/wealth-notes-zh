  md: '# 第3章 Python对象类型初探


    # 3.1 Python对象


    对象（Object）是Python中最基本的概念，我们从本章开始学习Python语言并逐渐了解Python的对象类型。首先我们在IPython中输入“7”，按Enter
    1 键：


    ```

    In [1]: 7

    Out[1]: 7

    ```


    这个简单的表达式（Expression）建立了整数对象（Integer Object）7。一般来说，表达式创建（Generate/Create）并处理（Process）对象。创建数值对象的方式有很多种，一般用字面常量（Literal）的方式建立。字面常量指字面上表示的数值，比如21就代表整数数值21的意义。常量能生成对象的表达式语法，常量有时也叫作常数（Constant）。读者要注意的是，此处的常量或常数与“不可变的对象
    2”没有关系，请勿混淆。不过，显然这个刚创建的“7”若之后所要利用并不方便。为了能够有意义地重复使用它，我们可以给“7”赋予名称（Name），如“x”：


    ```

    In [2]: x = 7

    ```


    这是一个赋值（Assignment）的动作，建立起名称与对象之间的关系，这关系亦称为绑定（Binding）。读者要注意赋值虽然用“=”表示，但它与数学中的“等于”大相径庭。因为上例中的x也可以赋予7之外的其他值，所以是个变量（Variable）；与其他语言（如C++）不同的是，Python是动态类型语言，不需要事先声明（Declare）变量类型，变量的类型和值在赋值那一刻被初始化。变量可以储存规定范围内的值，而且其值可以改变。在这个简单的变量定义背后，解释器实际上做了“稍微复杂”的动作。Python执行“x
    = 7”这句代码时，首先会建立整数对象7；若等号“=”左边的名称x第一次出现，解释器会先产生该名称，接着把数字7赋值给x。如图3.1所示 3。


    ![](img/0de14a685304f8aa267f6492145864ac_41_0.png)


    为了验证我们的理解，接着输入x：'
