  md: '# # 第16章 方差分析


    前面主要是针对单个变量进行统计分析，如描述性统计、参数估计等。然而，仅对单个变量进行分析所能获得的信息是有限的。以某公司股票的股价为例，对其进行单变量分析，最多只能获得其概率分布，然后据此来对股价进行预测。通过这样的方式，尽管也能进行预测，但预测的可信度是非常有限的。然而，如果我们知道明天该公司会宣告发放股利，那么由此可判断明天股价上涨的概率极高。所以，在分析某个变量的时候，往往还会需要其他变量的信息。这样，统计分析工作就涉及多个变量。对于多个变量的统计分析，更多地关注多个变量之间存在的联系，以帮助提高预测的准确性。下面先来介绍一种对变量之间关系的定性分析方法——方差分析（Analysis
    of Variance, ANOVA）。


    # ## 16.1 方差分析之思想


    在正式介绍方差分析之前，我们先来看一个问题：不同行业股票的收益率是否相同？。如果答案是“不同行业的股票有着明显不同的收益率”，并在不同行业的股票收益率相互独立的前提下，我们可以进一步提出疑问：食品行业的收益率会比金融行业的收益率更高吗？


    再考虑宏观经济学中的失业问题，失业率会因为地区的不同而不同。如果地区确实是影响失业率的一个重要的因素，那么广东的失业率会比北京的失业率更高还是更低？


    总结起来，上述两个问题的前半半关注的都是一个因子（Factor）变量（如行业和地区）是否会影响某一个变量（如收益率和失业率）的数值。因子变量的取值可以是不同的状态，我们称这些状态为水平。比如，行业因子变量，其取值不是
    1.414、3.1415926 诸如此类的数值，而是“食品行业”、“金融行业”这样的水平。欲研究的被影响变量被称为反应变量（Response Variable）。这两个问题的后半半归结起来关注的是：两个不同的水平下（食品行业
    VS 金融行业，广东 VS 北京）反应变量（如股票收益率、失业率）是如何取值的，以及哪种情况下反应变量的取值更高。


    若要探究一个因子变量对反应变量的影响，方差分析是一个较为适合的工具。方差分析从反应变量（如上迷的股票收益率和失业率）的方差入手，研究诸多因子（如行业、地区等因素）中哪些因子对观测变量有显著影响。方差分析的重点不在于预测（它无法预测出明天金融行业股票的走势如何），而在于分析和比较各组之间的差异。比如，分析食品行业和金融行业股票收益率的差异。如果发现这两个行业的股票收益率有显著差异，则可以得到下述结论：行业是影响股票收益率的一个重要的因素。


    准确地说，方差分析的研究对象是各个组别反应变量均值之间可能存在的差异，其中'
  merge: -1
