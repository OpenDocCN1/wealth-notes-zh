    10 月 12 日庞大集团开盘价调整到 10.80 元。


    （c） 除权除息价：


    $$ \begin{array}{c} \text { 除权除息价 }= \frac{\text { 股票登记日的收盘价 }-\text { 每股红利现金额
    }}{1+\text { 每股送红股数或转增股数 }} \end{array} $$


