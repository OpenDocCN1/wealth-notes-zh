  md: '# 25.3 ARCH 效应检验


    对资产收益率序列 $\{y_t\}$ 建立波动率模型一般需要下列 5 个步骤。


    +   1. 先检验收益率序列 $\{y_t\}$ 是否是平稳的时间序列，并对根据其相关性建立合适的均值方程（比如 ARMA 模型），描述收益率的 $y_t$
    如何随时间演进。根据拟合的模型和实际值，可以得到残差序列 $\{\hat{\epsilon}_t\}$。


    +   2. 对拟合的均值方程得到的残差序列 $\{\hat{\epsilon}_t\}$ 进行 ARCH 效应检验，也就是检验收益率围绕着均值的偏差是否看起来时大时小，而非非几乎同样规模的偏差。检验序列
    $\{\hat{\epsilon}_t\}$ 是否具有 ARCH 效应有两种常用方法。


    +   (a) 用 Ljung-Box 检验残差平方序列 $\{\hat{\epsilon}_t^2\}$ 的自相关性，即将序列的平方值作为波动率的代理变量，若残差序列有自相关性，则说明当期波动与过去期波动有关，初步判别序列
    $\{\hat{\epsilon}_t\}$ 有 ARCH 效应。


    +   (b) 用 Engle (1982) 提出的 Lagrange Multiplier 检验（LM 检验）。LM 检验的公式为：


    $$\hat{\epsilon}_t^2 = \hat{\alpha}_0 + \sum_{i=1}^p \hat{\alpha}_i \hat{\epsilon}_{t-i}^2
    \quad (25.2)$$


    检验的原假设为：序列 $\{\hat{\epsilon}_t\}$ 无 ARCH 效应，即 $\alpha_i = 0, i = 1, \dots, q$。备择假设为序列
    $\{\hat{\epsilon}_t\}$ 具有 ARCH 效应，即至少有一个 $\alpha_i$ 显著不为 0。


    +   3. 若第 2 步中 ARCH 效应在统计上显著，也就是收益率关于其均值的偏差也有动态变化，那么我们就需要再设定一个波动率模型试图刻画这种波动率的动态变化；


    +   4. 对均值方程和波动率方程进行联合估计，也就是假设实际数据服从前面设定的均值方程和波动率方程后，计算出均值方程和波动率方程中的参数的估计值是多少，以及参数估计的误差是多少；


    +   5. 检验所拟合的模型，并在必要时进行改进。这一步非常重要，因为第 4 步中假定实际数据服从第 1 步设定的均值方程和第 3 步设定的波动率方程，然而这一假定并不一定合理。如果估计结果（特别是残差）不满足模型本身的假设，那么模型的可用
    性就很值得怀疑。所以我们需要在估计完参数后对模型的假设再进行检验。


    下面，我们以上证指数为例来讲解如何判断是否具有 ARCH 效应。我们以上证指数 2009 年 1 月到 2013 年 4 月的日收益率序列的平方以及绝对值这两个序列的图形上来识别原序列是否具有
    ARCH 效应。


    ```

