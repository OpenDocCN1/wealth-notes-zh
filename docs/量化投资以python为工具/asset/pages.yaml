- pgno: 301
  md: '图 19.2 中的曲线为最小方差前缘 (Minimum-Variance Frontier)，即在特定的投资目标 $\bar{R}_{p}$ 下能够令投资组合收益率方差
    (标准差) 最小的资产配置比例。该线的上半段曲线被称为效率前缘 (Efficient Frontier)，效率前缘上的资产配比既可以在特定的投资目标 $\bar{R}_{p}$
    下达到风险最小，又可以在特定的风险水平下达到期望收益率最大。整个资产配置流程的计算量很大，不过借助 R 语言，我们能够方便快捷地求得想要的结果，在第 19.3
    节我们将用 R 语言来实现 Markowitz 模型之资产配比过程。


    行文至此，我们已经了解到 $N$ 种风险资产下的资产配置过程。不过实务上，还有一个非常重要的、每个投资人都接触过的资产——无风险资产，无风险资产是指无违约风险、收益率确定的资产，比较常见的如银行存款、政府债券等。如果将无风险资产考虑进投资组合，则投资人面对的决策问题可以表达为：


    ```

    min $\sigma^{2}(R_{p})=\sum_{i=1}^{N}\omega_{i}^{2}\sigma^{2}(R_{i})+\sum_{i \neq
    j}\omega_{i}\omega_{j}\sigma(R_{i}, R_{j})$ (19.9)

    ```


    ```

    $s.t. \quad \bar{R}_{p}=R_{f}+\sum_{i=1}^{N}\omega_{i}[E\left(R_{i}\right)-R_{f}]$

    ```


    此时，投资人在风险资产上的投资比例依旧是 $\omega_{1}, \omega_{2}, \cdots, \omega_{N}$，不过 $\sum_{i=1}^{N}
    \omega_{i}$ 不一定为 1，投资人会将 $1-\sum_{i=1}^{N} \omega_{i}$ 部分资本投资在无风险资产。公式模型 (19.9)
    的求解过程与只有风险资产的情况类似，也是用拉格朗日解法，其最优解依旧是投资目标 $\bar{R}_{p}$ 的线性函数形式：


    ```

    $\omega^{*}=\frac{\bar{R}_{p}-R_{f}}{\varsigma-2 \alpha R_{f}+\delta R_{f}^{2}}
    \Sigma^{-1}\left(\bar{R}-R_{f} e\right)$

    ```


    各参数在前面都有提及，这里不再重述。将 $\omega^{*}$ 代入最优投资组合的风险表达式 $\sigma_{p}^{2}=\omega^{*} \prime
    V \omega^{*}$ 中，经过简化可以发现，最优投资组合的标准差 $\sigma_{p}$ 与投资目标 $\bar{R}_{p}$ 呈线性关系。若用图形画出（纵轴为
    $\bar{R}_{p}$，横轴为 $\sigma_{p}$），则可以得到一条线性的效率前缘；而且经过严格推导可以发现，考虑无风险资产的效率前缘恰好与忽略无风险资产的效率相切，如图
    19.3 所示。


    如果所有的投资人对各资产未来收益率的估计是一致的，那么理性投资人持有风险资产的相对比例应该是一样的，风险偏好水平不同只会影响到持有无风险资产的比例。每个投资人持有的相同的相对投资比例的风险资产组合即为市场投资组合
    (Market Portfolio)，即图 19.3 中切点的位置对应的投资组合，该投资组合中各资产的投资比例为 $\omega_{m}$，收益率为 $R_{m}$，收益率的期望值和方差分别为
    $E(R_{m})$ 和 $\sigma_{m}^{2}$。当然，现实中每个投资人对未来收益率的估计不同，自然每个人持有的风险资产组合的投资比例也不尽相同。图中的切线，即市场投资组合与无风险资产之间的连线，被称为资本市场线
    (Capital Market Line)，可以表达为：'
