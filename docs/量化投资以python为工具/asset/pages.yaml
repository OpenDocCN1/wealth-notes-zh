  md: '# 5.1.7 运算符的优先级


    在表达式中，可能有多个运算符，运算符的种类也不一定相同，此时在对操作数运算时，有运算符操作的优先顺序问题。


    ```

    In [1]: 2+3*5

    Out[1]: 17

    ```


    表达式 "2+3*5" 有运算符 " + " 和运算符 " \* "，从返回值结果 17 来看，Python 在执行此表达式时，先进行了乘法运算 3*5，再用乘法运算的结果作为加号的操作数之一，和另一个操作数
    2 进行加法运算。


    ```

    In [2]: 6>3**5

    Out[2]: False

    ```


    在表达式 "6>=3**5" 中，运算符 " >= " 为比较运算符，而运算符 " \*\* " 为算术运算符。从该表达式的传回值来看，算术运算符的运算顺序优先于比较运算符。表中列出了前面介绍的六种运算符的运算优先顺序，排在上面的运算符的运算优先于下面的运算符的运算，位于同一表格中的运算符的运算顺序相同
    1。如表 5.5 所示。


    # 表 5.5 Python 常见运算符的优先顺序表 (从高到低)


    | 运算符 | 含义 |

    | :--- | :--- |

    | \*\* | 幂 |

    | \*, /, //, % | 乘，除，整除，取模 |

    | +, - | 加，减 |

    | <=, <, >, >= | 大小比较运算符 |

    | ==, != | 相等判断运算符 |

    | =, +=, -=, \*=, \*=, /=, //=, %= | 赋值运算符 |

    | is, is not | 身份运算符 |

    | in, not in | 成员运算符 |

    | and, or, not | 逻辑运算符 |


