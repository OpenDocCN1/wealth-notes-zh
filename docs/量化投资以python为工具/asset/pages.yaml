    如图 14.4 所示，$t$ 分布概率密度曲线是以0为中心、左右对称的单峰分布；其形态变化与自由度 $n$ 的大小有关，自由度越小，分布越分散，自由度越大，变量在其均值周围的聚集程度越高，也越接近标准正态分布曲线。当自由度为30时，$t$
    分布已经接近标准正态分布曲线。相较于标准正态分布，$t$ 分布的密度函数呈现出“尖峰厚尾”的特点，即它的峰比较尖、尾部比较厚，现实中资产收益率分布往往呈现这种形态，因此
    $t$ 分布在对实际抽样结果的刻画上更为精确。$t$ 分布是在推断统计分析中常用的分布。


