    +   • 内置数据类型


    数值型（Numerics）、序列（Sequences）、容器类型（Mappings）、类（Classes）、类的实例（Instances）和异常值类型（Exceptions）等属于
    Python 解释器（Interpreter）中内置的数据类型（Built-in types）。


    +   • 内置异常


    内置异常是指在程序运行过程中出现的错误，包括语法错误（SyntaxError）、缩进错误（IndentationError）、系统错误（SystemError）、命名错误（NameError）等，在
    Python 中用 try...except 捕捉异常，用 raise 抛出异常，而所有异常都从类 Exceptions 中继承。


    +   • 内置模块


    Python 标准库中模块众多，在这里我们仅挑出几个常用的模块来阐述 Python 模块的使用方式和强大功能。


