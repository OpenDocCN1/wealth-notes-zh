  md: '将样本均值与样本标准差代入该统计量，就可以得到该统计量的值，然后便可以根据 $t$ 分布的分布函数计算出 p 值并与显著性水平 $\alpha$ 比较，或是与显著性水平
    $\alpha$ 下的临界值进行比较。


    # Python 实现单样本 t 检验


    下例使用单样本 $t$ 检验来检验上证综指的收益率均值是否为 0：


    ```

    ```

    #提取上证综指收益率数据

    In [1]: TRD_Index=pd.read_table(''015\\TRD_Index.txt'',sep=''\t'')

    ...: SHIndex=TRD_Index[TRD_Index.idx==1]

    ...: SHRet=SHIndex.Retindex


    #只需要输入我们要检验的变量以及要比较的数值即可

    In [2]: stats.ttest_1samp(SHRet, 0)

    Out[2]: Ttest_1sampResult(statistic=0.5532263041157256, \\

    pvalue=0.58021065517057679)

    ```

    ```


    这里，原假设为上证综指的收益率均值为0，而 p 值为 $0.5802 > 0.05$。所以，在 5% 的显著性水平下，不能拒绝原假设，进而可以推断上证综指的收益率均值为
    0。


    # 15.4.2 独立样本 $t$ 检验


    独立样本 $t$ 检验用于检验两个服从正态分布的总体的均值是否存在显著性差异。假设两个总体的分布分别为 $N(\mu_1, \sigma_1^2)$ 和 $N(\mu_2,
    \sigma_2^2)$，则独立样本 $t$ 检验的原假设为 $H_0: \mu_1 = \mu_2$。在此，$\mu_1$ 和 $\mu_2$ 分别为两总体的均值。易得
    $\bar{x}_1 \sim N(\mu_1, \frac{\sigma_1^2}{n_1})$， $\bar{x}_2 \sim N(\mu_2, \frac{\sigma_2^2}{n_2})$，进而有：


    $$\bar{x}_1 - \bar{x}_2 \sim N\left(\mu_1 - \mu_2, \frac{\sigma_1^2}{n_1} + \frac{\sigma_2^2}{n_2}\right)$$


    上式可变形为：


    $$\frac{(\bar{x}_1 - \bar{x}_2) - (\mu_1 - \mu_2)}{\sqrt{\frac{\sigma_1^2}{n_1}
    + \frac{\sigma_2^2}{n_2}}} \sim N(0, 1)$$


    独立样本 $t$ 检验的前提是两个独立的总体的方差相等，假设 $\sigma_1^2 = \sigma_2^2 = \sigma^2$，则：


    $$\frac{(\bar{x}_1 - \bar{x}_2) - (\mu_1 - \mu_2)}{\sqrt{\sigma^2(\frac{1}{n_1}
    + \frac{1}{n_2})}} \sim N(0, 1)$$


    在两个总体的方差相等的前提下，我们把来自于两个总体的样本数据混合在一起以估计 $\sigma$，即：


