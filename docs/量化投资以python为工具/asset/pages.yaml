    \ Randor nNumber 则是随机变量之实现值，也就是样本，value_counts 函数计算了样本之频数分布，下一行代码则计算了频率分布。从结果可以看出，样本的频率分布与总体的概率分布还是较为相似的。如果我们增加生成的随机数之数目，那么得到的结果会更接近设定的概率。\n\
    \n# 14.1.2 连续型随机变量\n\n若随机变量 $X$ 是连续的，则可以证明 $\\mathbb{P}\\{X=a_k\\}=0$，读者可自行验证，因此我们不能用概率质量函数来刻画随机变量之随机性。对于连续型随机变量，累积分布函数\
