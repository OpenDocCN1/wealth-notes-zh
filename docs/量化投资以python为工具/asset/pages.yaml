    # 27.3.2 Python 语言捕捉“乌云盖顶”形态


    +   1. “乌云盖顶”与“抱线”


    “乌云盖顶”形态一般由两个不同矩形实体的蜡烛图组成。第 1 个蜡烛图属于上升趋势的阳线，当日收盘时的价格比开盘时的价格高。红色蜡烛实体较长表明收盘价比开盘价高很多；第
    2 个蜡烛图也有一个较长的实体，且实体上端（开盘价）一般要高于前一个蜡烛图的实体上端（收盘价）。第二天开市时价格较高，说明多头市场可能依旧强势，如果开盘价比前一天的最高价还高，说明开市时多头力量更大。而闭市时，价格却大幅下跌，收盘价低于开盘价。价格下跌的一个可能情景是市场上出现了不利消息，股价受到不利影响，多头力量削弱，空头力量强势起来。一般来说，第二天的收盘价要深入到第一天蜡烛图红色实体的内部，第二天的收盘价向下穿入第一个红色实体的内部越低，市场下跌趋势的信号就越明显。


    “抱线”有很多种形态，如图 27.6 所示的抱线仅是抱线众多形态中的一种，是“阴抱阳”形态。这种形态的抱线也常被叫作“看跌吞没”形态。“看跌吞没”形态一般要求第二个绿色蜡烛实体包裹着第一个红色蜡烛实体。从价格角度来看，第二天的收盘价要低于前一天的开盘价，第二天的开盘价高于前一天的收盘价。'
