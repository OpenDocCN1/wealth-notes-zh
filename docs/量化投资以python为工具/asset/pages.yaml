    # 9.1.3 库


    Python 中的库是借用其他编程语言的概念，没有特别具体的定义，Python 库着重强调其功能性。在 Python 中，具有某些功能的模块和包都可以被称作库。模块有诸多函数组成，包由诸多模块结构化构成，库中也可以包含包、模块和函数。举例来说，NumPy
    库是一个具有强大科学计算功能的函数库，与此同时，我们也可以把 NumPy 称作包，由许多丰富功能的模块构成。


    # 9.2 Python 标准库介绍


    Python 的标准库是 Python 自带的函数库，成功安装 Python 后，即可使用标准库。标准库中包含内置函数（Built-in Functions）、内置常量（Built-in
    Constants）、内置数据类型（Built-in Types）、内置异常（Built-in Exceptions）以及众多功能函数组成的模块，这些模块中的函数用
    C 语言编写而成。


