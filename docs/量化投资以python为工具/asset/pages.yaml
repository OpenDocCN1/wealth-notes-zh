    # 3.4 字符串


    字符串 (String) 是由字符 (Character)$^{1}$所组成的一种序列 (Sequence)。换句话说，字符串是一个包含字符对象的有序集合，按从左到右的顺序排列，并依照相对位置
    (Relative Position) 进行访问。


    ```

    In [9]: Job = ''Quant''

    In [10]: types(Job)

    Out[10]: str

    ```


    在 Python 中，索引代表的是与第一个（最左边）对象的位置偏移量 (Offset)。以字符串 ''Quant'' 为例，第一个对象是 Q；Q 与自己没有位置偏移量，所以
    Q 的索引是 0。''Quant'' 中的第二个对象是 u，u 与 Q 的位置偏移量等于 1，故 u 的索引为 1；其余类推。下列验证了上述说法：


    ```

    In [11]: Job = ''Quant''

    In [12]: Job[0]

    Out[12]: ''Q''


    In [13]: Job[1]

    Out[13]: ''u''

    ```


    > $^{1}$ Python 核心开发者之一 Nick Coghlan 对此解释为：一般来说，在数学领域中倾向于用 $i$ 表示虚部单位，而在工程领域，则倾向于用
    $j$ 表示虚部单位。此外，字母 $i$ 容易与数字 1 和字母 $j$ 混淆，而字母 $j$ 不会发生这种事情。


    > $^{1}$ 请注意，Python 并没有字符 (Character) 这种类型；字符在 Python 中相当于“仅有一个字符的字符串”。'
