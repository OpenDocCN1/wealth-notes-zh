- pgno: 491
  md: '# # 第31章 通道突破策略


    # ## 31.1 通道突破简介


    股票市场的行情是随机而起的，价格线的走势往往给人一种“横看成岭侧成峰，远近高低各不同”的感觉。一个震荡到底是隐含了趋势还是只是杂讯，那可真是言人人殊。通道模型适度解决了这一难题。它利用过去一定时间段内的价格信息，绘制出上下两条通道线（上、下轨），以此设定股价的相对高、低界限。通道线可以包容市场波动行情的部分信息，过滤震荡行情中均线系统“假”突破的信号。通道线除了涵盖市场价格高低的信息以外，两条通道线的距离也体现了股票价格震荡的幅度；当价格波动幅度较小时，通道的带宽较小，当价格震荡较大时，通道的带宽也相应变大。通道突破模型将价格高低与价格震荡的幅度融合在一起，成为判断市场中长期趋势的常用技术分析指标。对于价格通道的刻画，根据数据期数的不同和计算方式的迥异，模型的设定可以有诸多变化。本书在此介绍唐奇安通道（Donchian
    Channel）和布林带通道（Bollinger Band）两种技术分析常用的通道形式，并演示通道突破的思想。


    # ## 31.2 唐奇安通道


    唐奇安通道流行于 20 世纪 70 年代，由著名的海龟交易员 Richard Donchian 发明，最早用于日内交易。其主要思想是寻找一定时间内（比如 20
    日）出现的最高价和最低价，将最高价和最低价分布作为通道的上下轨道。当价格突破通道的上轨道时，说明股价运动较为强势，则释放出买入信号；当价格线向下突破通道的下轨道时，空头市场较为强势，市场下跌趋势较为明显，则释放出卖出信号。


    # ### 31.2.1 唐奇安通道刻画


    唐奇安通道由三条轨道线构成，上下轨道分别由 20 日的最高价和最低价来刻画，中轨道是上下轨道的平均线，具体计算过程如下。


    通道上界由 20 日的蜡烛图的最高点构成，即：


    通道上界 = 过去20日内的最高价


    通道下界由 20 日的蜡烛图的最低点构成，即：


    通道下界 = 过去 20 日内的最低价


    中轨道计算公式为：'
