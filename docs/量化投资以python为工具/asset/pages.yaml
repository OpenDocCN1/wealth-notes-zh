    \n# 34.6 OBV 指标的应用原则\n\n当使用 OBV 指标时，单期的 OBV 值对于股价分析来说并没有太大意义。根据 OBV 指标的原理，股价的趋势是通过成交量的多少来体现的。但是，多与少是通过比较得到的，不是一个\
    \ OBV 值所能体现的。因此，我们需要将 OBV 值与过去的 OBV 值进行比较，才能对成交量的多少做出判断。对于 OBV 值之间的比较，可以通过绘制 OBV\
    \ 曲线来进行。我们以时间为横坐标，成交量为纵坐标，将每一日计算所得的 OBV 值在坐标线上标出位置，并连接起来即得到 OBV 曲线。通过观察 OBV 曲线与股价的趋势，可以对未来的价格"
