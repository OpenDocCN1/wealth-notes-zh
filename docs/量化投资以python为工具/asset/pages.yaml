  md: '# # 第29章 RSI相对强弱指标


    # ## 29.1 RSI基本概念


    在股票市场上，买方和卖方力量的消长会影响股票的价格。如果股票的买入力量大于卖出力量，则股票的价格会上涨；如果股票的卖出力量大于买入力量，则股票的价格会下跌。如何运用一种巧妙的方法来判断股票的买入力量与卖出力量的强弱？这个问题早在20世纪70年代被一位投资者提出并最终找到一个解决方案。韦尔斯·威尔德（Wells
    Wilder）于1978年6月在Commodities（现称为Future杂志）月刊上发表了一种衡量证券自身内在相对强度的指标，即Relative Strength
    Index，简称“RSI”$^{1}$，中文名为“相对强弱指标”。RSI是用一种特定公式计算出来的值，投资者可以通过RSI的取值来判断股票的买入和卖出情况，进而预测未来股票的价格走势。例如，如果股票的买入力量大于股票的卖出力量，则可以预测股票未来价格可能会上涨。


    # ## 29.2 Python 计算 RSI 值


    相对强弱指标 RSI 的值的计算公式如下：


    ```

    $$

    RSI = 100 - \frac{100}{1 + RS}

    $$

    ```


    或者


    ```

    $$

    RSI = 100 \times \frac{RS}{1 + RS}

    $$

    ```


    又


    ```

    $$

    RS = \frac{UP}{DOWN}

    $$

    ```


    将 $RS = \frac{UP}{DOWN}$ 带入 $RSI = 100 \times \frac{RS}{1 + RS}$ 可以推出：


    ```

    $$

    RSI = 100 \times \frac{UP/DOWN}{1 + UP/DOWN}

    = 100 \times \frac{UP}{UP + DOWN}

    $$

    ```


    即


    ```

    $$

    RSI = 100 \times \frac{UP}{UP + DOWN}

    $$

    ```'
