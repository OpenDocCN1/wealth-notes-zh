    # 18.5.5 最大回撤


    实务上经常会用最大回撤（Maximum Drawdown, MDD）来衡量投资（特别是基金）的表现，在介绍最大回撤之前，我们先来了解什么是回撤（Drawdown）。某资产（或投资组合）在时刻
    $ T $ 的回撤是指资产在 $ (0,T) $ 的最高峰值与现在价值 $ P_{T} $ 之间的回落值，用数学公式可以表达为：


    ![](img/0de14a685304f8aa267f6492145864ac_289_1.png)


    对应的回撤率为：


    ![](img/0de14a685304f8aa267f6492145864ac_289_2.png)


    知晓回撤的含义之后，最大回撤就比较好理解了，资产在 $ T $ 时刻的最大回撤 $ MDD(T) $ ，就是资产在时段 $ (0,T) $ 内回撤的最大值，对应的数学公式为：


    ![](img/0de14a685304f8aa267f6492145864ac_289_3.png)


    相应的最大回撤率为：


    ![](img/0de14a685304f8aa267f6492145864ac_289_4.png)


    直观地讲，$ MDD(T) $ 对应的是在 $ (0,T) $ 时段内资产价值从最高峰值回落到最低谷底的幅度。最大回撤常用来描述投资者在持有资产时可能面临的最大亏损，比如某投资人在投资'
