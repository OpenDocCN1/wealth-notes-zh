  md: "```\nDataFrame.fillna(value=None, method=None, axis=None, inplace=False, limit=None)\n\
    ```\n\n函数中参数 value 是在缺失值处填充的值，可以是数值数字，也可以是字符串；method 是填充的方式，默认为 None，也可以取值为 ffill、pad、bfill\
    \ 或 backfill，其中 ffill/pad 是用行或列方向上的上一个观测值来填充缺失值，bfill/backfill 是用行或列方向上的下一个观测值来填充；axis\
    \ 与 method 配合使用，指定行（axis=1）或列（axis=0）的方向；limit=None 时，会填充连续的缺失值，如果指定数值的话，比如 limit=2，只会依次填充连续\
    \ NaN 值的指定数字个数（比如 2 个）；若 inplace=False 则不会变更原 DataFrame，若 inplace=True，则会改变原 DataFrame。\n\
    \n```\n# 先构造含有 NaN 值的 DataFrame df4\nIn [1]: df4=pd.DataFrame(np.random.rand(5,4),\n\
    \                        index=list('abcde'),\n                        columns=list('ABCD'))\n\
    ```\n\n```\nIn [2]: df4.ix[':', 'A']=np.nan\n...: df4.ix['b': 'd', 'C']=np.nan\n\
