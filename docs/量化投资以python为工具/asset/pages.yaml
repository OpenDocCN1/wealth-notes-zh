- pgno: 360
  md: "检验一个序列是否为纯随机或近似纯随机的序列呢？\n\n通常我们使用 Ljung-Box 检验，简单来说 LB 检验的原假设设为所检验序列是纯随机序列（白噪声过程），该检验的统计量为\
    \ $Q$ 统计量：\n\n$$\\begin{align*} Q(m) = n(n+2)\\sum_{k=1}^{m} \\frac{\\rho_k^2}{n-k}\
    \ \\sim \\chi_m^2 \\end{align*}$$\n\n其中，$\\rho_k^2$ 是序列的 $k$ 阶自相关系数，$n$ 是整个序列中观测值的个数，$m$\
    \ 是设定的滞后阶数。根据 $Q(m)$ 的计算公式可知 $Q(m)$ 均为正、大小与序列的自相关系数成正向关系，当序列有自相关性时，其自相关系数较大、对应的\
    \ $Q(m)$ 也较大；相反，当序列为随机序列、无自相关性时，序列的自相关系数不会显著地异于 $0$，计算出来的 $Q(m)$ 也会很小。\n\n检验一个时间序列在\
    \ $m$ 阶内是否是白噪声，只有当 $Q(1), Q(2), ..., Q(m)$ 这 $m$ 个 $Q$ 统计量都小于对应的 $\\chi^2$ 分布的临界值时（即统计量的值与\
    \ $0$ 没有显著差别），才能说明这个序列在所检验的 $m$ 阶内是纯随机的。若有一个 $Q$ 不满足要求，即大于 $\\chi^2$ 分布的临界值，则这个序列就是非纯随机序列。我们举例来看\
    \ LB 检验的过程。假设某序列样本容量 $n=100$，各阶自相关系数为 $\\rho_1=0.1732$，$\\rho_2=0.2$，$\\rho_3=0.1$，$\\\
    rho_i=0$，$i\\geq4$。将它们分别带到 $Q$ 统计量的计算公式中去，得到：\n\n$$\begin{align*} & Q(1) = 100\
    \ \\times 102 \\times (\\rho_1)^2/99 = 3.1 \\\\ & Q(2) = 100 \\times 102 \\times\
    \ [(\\rho_1)^2/99 + (\\rho_2)^2/98] = 7.3 \\\\ & Q(3) = 100 \\times 102 \\times\
    \ [(\\rho_1)^2/99 + (\\rho_2)^2/98 + (\\rho_3)^2/97] = 8.3 \\\\ & Q(m) = 100 \\\
    times 102 \\times [(\\rho_1)^2/99 + (\\rho_2)^2/98 + (\\rho_3)^2/97 + \\sum (\\\
    rho_i)^2/(100-k)] = 8.3 \\end{align*}$$\n\n在 5% 的显著性水平下，$\\chi_m^2$ 的各阶临界值分别为\
    \ $\\chi_1^2=3.841<Q(1)$，$\\chi_2^2=5.991<Q(2)$，$\\chi_3^2=7.815<Q(3)$，$\\chi_4^2=9.488>Q(4)$。因此，在\
    \ 5% 的显著性水平下，该序列没有一阶自相关，很有可能有一阶、二阶、三阶自相关或四阶以上的但自相关性不显著。因此，该序列不是白噪声序列。\n\nLB 检验过程在\
    \ Python 中可以调用 statsmodels 包中的 q_stat( ) 函数实现，该函数的形式为：\n\n```\n```\nq_stat(x,\
    \ no bs, type='ljung-box')\n```\n```\n\n+   * $x$ 为所检验的自相关系数序列；\n* nob s 表示计算自相关系数序列\
    \ $x$ 所用的样本数，即公式中的 $n$；\n* type 选择所用的检验类型。\n\n该函数会返回两个 array 对象，分别是检验的统计量与 $p$\
    \ 值。一般说，我们只需要关注 $p$"
