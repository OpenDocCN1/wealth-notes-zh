    # 32.5.3 K线、D线“金叉”与“死叉”


    K 值、D 值和 J 值的取值情况可以释放出市场的买卖信号。在前面的分析中，我们观察到 K 线、D 线与市场价格曲线的走势大致相同，K 线与 D 线的价格走势也蕴含着市场买卖双方力量的博弈。一般而言，在上涨行情中，K
    线上突 D 线，即出现 KD 线“黄金交叉”的现象，此时，说明市场中多头力量在加强，可以解读为市场继续处于多头行情。另一方面，在下跌行情中，K 线又下突破
    D 线，即出现 KD 线“死亡交叉”的现象，说明市场中多头力量减弱，市场继续处于空头下跌行情中。


    接下来，继续以标普 500 指数为分析对象，来探究 KD 线“黄金交叉”与“死亡交叉”策略。


