  md: 'plotlib 绘图的另一大特色是面向对象绘图。这里所谓面向对象是指将图形的元素看作一个对象，众多对象具有隶属关系，不同对象拼凑成一个完整的图形。


    # ### 12.4.1 Figure、Axes 对象


    类比生活中用纸笔绘图，我们来解释 Matplotlib 面对象绘图。


    +   - 在使用生活中的纸笔画图时，我们需要先找到一张白纸，在白纸上绘图。对于 Matplotlib 来说，绘图之前需要先创建一个 Figure 对象，Figure
    对象是一个空白区域，同样我们将要在 Figure 对象上绘图。可以通过 pyplot 包中的 figure 函数来创建一个 Figure 对象。


    ```

    ```

    In [1]: fig=plt.figure()

    ```


    ```


    +   - 在这张白纸上，我们可以选择较大区域，只画一个收盘价折线图。如果想要节约用纸或者对比两个价格序列，可以将这张纸分成两个区域，分别绘制收盘价折线图和开盘价折线图。在
    Matplotlib 绘图中，每个 Figure 对象可以包含一个或者几个 Axes 对象，每个 Axes 对象即一个绘图区域，拥有自己独立的坐标系。现在，我们需要两个绘图区域，则需要创建两个
    Axes 对象，分别指定绘制收盘价折线图和开盘价折线图的区域。由此也可以看出，Axes 对象依附于 Figure 对象。


    ```

    ```

    In [2]: ax1=fig.add_axes([0.1, 0.1, 0.3, 0.3])

    ...: ax2=fig.add_axes([0.5, 0.5, 0.4, 0.4])

    ```


    ```


    其中，[0.1, 0.1, 0.3, 0.3] 和 [0.5, 0.5, 0.4, 0.4] 分别制定绘图区域，每个列表的前两个元素指定 Axes 对象区域左下角坐标，后两个元素给出
    Axes 在 Figure 图像坐标¹上 X 方向和 Y 方向的长度。因此 ax1 区域左下角坐标为 (0.1,0.1)，画图区域长和宽分别为 0.3 和
