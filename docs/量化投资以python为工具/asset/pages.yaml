    log(P_t^X)$} 和 {$\\log(P_t^Y)$} 都是一阶单整的前提下, 用最小二乘法构造回归方程:\n\n$\\log(P_t^Y) = \\\
    alpha + \\beta\\log(P_t^X) + \\varepsilon_t$\n\n得到回归系数 $\\hat{\\alpha}$ 和 $\\\
