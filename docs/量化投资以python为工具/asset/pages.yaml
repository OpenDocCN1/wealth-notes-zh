  md: '# # 第25章 GARCH 模型


    # ## 25.1 资产收益率的波动率与 ARCH 效应


    我们在第 24 章结尾处提到，不能排除上证综指日收益率序列是白噪声过程的可能，因此用 ARMA 模型对其建模是不科学的。既然如此，那是否就意味着我们无法从过去收益率序列提取信息呢？学者们对金融时间序列（特别是资产收益率序列）深入挖掘，发现了几个普遍的现象：


    +   - 一组时间序列本身可能只有非常微弱的自相关性，而这组时间序列的函数（比如取平方、绝对值等）呈现很强的自相关性。

    - 有些资产收益率序列的条件方差（Conditional Variance）会随着时间发生改变，也就是呈现条件异方差（Conditional Heteroskedasticity）的特征。

    - 资产收益率序列的波动会有持续的现象，即大波动跟着大波动，小波动伴随着小波动，也就是波动聚集（Volatility Clustering）现象。

    - 许多资产收益率序列，并不服从正态分布，其极端值较多，具有厚尾（Heavy Tail）现象。


    因此统计学家和计量学家想法设法建立模型来捕捉时间序列的上述现象，这就是 ARCH 和 GARCH 模型诞生的过程。从 ARCH （ AutoRegressive
    Conditional Heteroskedasticity）、GARCH（ Generalized AutoRegressive Conditional
    Heteroskedasticity）模型的名字可以看出，这两类模型主要用来刻画时间序列波动率（也就是条件方差）统计规律的模型。


    在金融领域，对收益率序列的波动建模预测是非常有意义的。首先看看期权交易的例子，在著名的 Black-Scholes-Merton 欧式看涨期权定价公式中就包含波动率项。一般而言，波动率越高，则定价公式计算得出的期权价格也越高。因此，精确的预测波动率则对期权价格的预测至关重要。其次，在经典的
    Markowitz 均值-方差框架下的资产配置理论中，波动率也扮演了重要角色，资产波动率的准确性直接影响利用该资产配置理论选择的投资组合表现的好坏。另外，对于给定时间序列，对其波动率的适当建模可以改进该时间序列参数估计的有效性，以及区间预测的精确度。最后，对波动率建模最直接的需要可能在于波动率本身已经成为一种金融工具并在美国芝加哥期权交易所交易。这些例子表明，对波动率建模在金融领域有其重要性。下面我们将介绍
    ARCH 模型和 GARCH 模型的主要思想。'
