- pgno: 271
  md: '而且根据单期收益率的公式：


    ```

    $$\frac{P_{t}}{P_{t-1}}=1+R_{t}, \quad \frac{P_{t-1}}{P_{t-2}}=1+R_{t-1}$$

    ```


    因此，


    ```

    $$\begin{aligned} R_{t}(2) & =\frac{P_{t}}{P_{t-2}}-1=\frac{P_{t}}{P_{t-1}} \cdot
    \frac{P_{t-1}}{P_{t-2}}-1 \\ & =(1+R_{t})(1+R_{t-1})-1 \\ & =R_{t}+R_{t-1}+R_{t}
    R_{t-1} \end{aligned}$$

    ```


    这里我们看到 $R_{t}(2)=\left(1+R_{t}\right)\left(1+R_{t-1}\right)-1$，其中 $\left(1+R_{t}\right)\left(1+R_{t-1}\right)$
    的概念就是复利 (Compound)。复利是指每一期将赚到的钱作为本金投入到下一期的资产中，以此类推，直至投资期结束获得的总收益。比较形象地说，复利就是钱滚钱。通常短时期内并不能看出复利的效果，例如日收益率
    $R_{t}$ 和 $R_{t-1}$ 取值都比较小，两者的乘积 $R_{t} R_{t-1}$ 会更小，假设 $R_{t} R_{t-1} \approx
    0$，则：


    ```

    $$R_{t}(2) \approx R_{t}+R_{t-1}$$

    ```


    不过将时间拉长一点看，复利的效果就会超出人们的想象。如果，某资产的单期收益率序列为 $R_{1}, R_{2}, \ldots, R_{t}$，则第 $t$
    期的 $k$ 期收益率与单期收益率的关系为：


    ```

    $$\begin{aligned} R_{t}(k) & =\frac{P_{t}-P_{t-k}}{P_{t-k}}=\frac{P_{t}}{P_{t-k}}-1=\frac{P_{t-k+1}}{P_{t-k}}
    \cdot \frac{P_{t-k+2}}{P_{t-k+1}} \cdots \frac{P_{t}}{P_{t-1}}-1 \\ & =(1+R_{t-k+1})(1+R_{t-k+2})
    \cdots\left(1+R_{t}\right)-1 \end{aligned}$$

    ```


    即


    ```

    $$R_{t}(k)=\prod_{j=0}^{k-1}\left(1+R_{t-j}\right)-1$$

    ```


    为了看复利的效果，假设有不同的资产，单期收益率分别是 1%、2%、3%，在这几种资产上投资的资金都是 1 元，经过 2 期复利后，不同资产的投资资金分别变为
    1.0201 元、1.0404 元、1.0609 元，对应的收益率分别为 2.01%、4.04%、6.09%，几乎依旧维持 2 倍、3 倍利差的关系；经过
    30 期的复利之后，各自投资资金分别变为 1.35 元、1.81 元、2.43 元，收益率为 35%、81%、143%，原本 2 倍、3 倍的收益被拉大到
    2.33 倍、4.10 倍。复利的效果非常惊人，不过依靠复利获得高报酬的前提是维持每一期获利都为正，这是很多风险性资产很难达到的。


    多期收益率的计算还有一种算法，就是将单期收益率简单总和：'
