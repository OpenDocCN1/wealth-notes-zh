  md: "E($\\varepsilon_t$) = 0; Var($\\varepsilon_t$) = $\\sigma^2_{\\varepsilon}$;\
    \ E($\\varepsilon_t$\\varepsilon_s$) = 0, \\(\\forall s \\neq t\\)\n\n很显然，相较于\
    \ AR(p)和 MA(q) 模型，ARMA(p,q) 更具有一普适性，AR(p)是 q = 0 时的 ARMA(p,q) 模型，MA(q) 模型是当 p\
    \ = 0 时的 ARMA(p,q) 模型。\n\n# 24.4 ARMA 模型的建模过程\n\n如前所述，我们分析的对象是平稳非白噪声的序列。现在我们要构建\
    \ ARMA 模型以便预测未来，构建一个 ARMA 模型通常需要以下 3 个步骤。\n\n+   1. 序列识别\n\n    (a) 判断我们需要建模分析的数据是否为平稳序列，若为非平稳序列需对其进行变换处理，使其成为平稳序列。\n\
    \    (b) 接着再判断平稳的序列是否为白噪声序列，若为白噪声序列则建模结束（白噪声过程无法构建 ARMA 模型）；若为非白噪声序列，则进行下一步。\n\
    \n+   2. 模型识别与估计：决定 p 和 q 的值，选出相对最优的模型结构。通过时间序列的自相关函数 ACF 和偏自相关函数 PACF 大致决定。一般规则如表\
    \ 24.1 所示。\n\n表 24.1 模型识别表\n| 模型 | ACF | PACF |\n| :--- | :--- | :--- |\n| AR(p)\
    \ | 拖尾（几何型或震荡型） | p 阶结尾 |\n| MA(q) | q 阶截尾 | 拖尾（几何型或震荡型） |\n| ARMA(p,q) | 拖尾（几何型或震荡型）\
    \ | 拖尾（几何型或震荡型） |\n\n如果序列的 ACF 和 PACF 不是很明确的话，则可以尝试着建立若干个备选模型，然后根据 AIC 或是 BIC\
    \ 指标来选择。AIC 是一种用于模型选择的指标，同时考虑了模型的拟合程度以及简单性，而 BIC 则是对 AIC 的一个改进。一般而言，较小的 AIC 或者\
    \ BIC 表明模型在保持简单的同时能够很好地对时间序列进行拟合。因此，我们往往会选择具有最小的 AIC 或 BIC 的模型作为相对最优的模型。\n\n+\
    \   3. 模型诊断：对模型残差进行检验，确保其为服从正态分布的白噪声序列。当模型的残差是白噪声时，说明我们已经将序列的信息充分提取到模型中。\n\n#\
    \ 24.5 CPI 数据的 ARMA 短期预测\n\n本节我们将建立一个完整的 ARMA 模型，并用其对序列进行短期的预测，以帮助读者更好地理解 ARMA\
    \ 模型。我们使用 2001 年 1 月到 2014 年 2 月的月度 CPI (Consumer Price Index, 物价指数) 数据建立 ARMA\
    \ 模型。\n\n# 24.5.1 序列识别\n\n我们先读取数据，对数据进行预处理，并判断其平稳性。"
