    # 18.1.6 考虑股利分红的简单收益率


    前面在计算资产收益率时只计算了资本利得，并未考虑其他的现金流，但在实务操作时，我们往往会遇到如股利分红等其他现金。股票是比较常见的资产，因此，我们详细介绍一下股利。公司发放股利的方式一般有两种：现金股利和股票股利。现金股利是将公司盈余以现金的方式发放给股东，而股票股利则是用送股的方式，将股票配发给股东。送股俗称送“红股”，是上市公司将留存收益（包括盈余公积和未分配利润）用股票股利形式进行的分配，送股是对股东的分红回报的一种方式，因此送股要纳税。提到送股，就要谈到另一个很容易与送股混淆的行为——转增股本。转增股本是将资本公积金$^1$转化为股本，不受公司本年度可分配利润的多少及时间的限制。从严格意义上来说，转增股本并不是对股东的分红回报，因此资本公积金转增股本也不需要纳税。目前，很多公司会采用部分现金、部分股票的方式发放股利。股票股利的优点是能够将现金/盈余留在公司，但是会造成股本膨胀、稀释之后的获利。现金股利不会改变股本，但是将盈余/现金发放出去，会减少公司的价值。通常公司会依自身发展情况来选择发放股利的方式，像创业板公司在发展之初比较需要现金，通常会选择用股票的形式来发放股利；而像万科等发展比较成熟、不缺现金的传统公司，会以现金股利为主。


    谈到这里，大家一定会好奇发放股利当天，股票价格是如何变动的、对应的收益率该如何计算。在答案揭晓之前，我们先了解一下公司是如何发放股利的。公司发放股利主要涉及以下几个重要日期。


    +   1. 股利宣告日。在这一天，董事会将公告股利支付情况，包括：股利发放的数目、股利发放的形式，同时宣布股权登记日、除息日、股利支付日以及股东分红资格等。


    +   2. 股权登记日。股权登记日是有权领取股利的股东资格登记截止日期，通常在股利宣告日以后的两周至1个月之内。股份公司最大的优点是所有权与经营权分离，代表公司所有权的股票可以自由买卖，公司的持有者经常变换。股权登记日可以明确领取股利的股东名单：在股权登记日之前（包含股权登记日这一天）持有公司股票的股东才有权分享股利，也就是说，在股权登记日这一天收市后仍持有该公司股票的投资者有


    $^1$资本公积金是在公司的生产经营之外，由资本、资产本身及其他原因形成的股东权益收入。股份公司的资本公积金：主要来于股票的发行溢价收入，接受的赠与、资产增值、因合并而接受其他公司资产净额等。其中，股票发行溢价是上市公司最常见、最主要的资本公积金来源。'
