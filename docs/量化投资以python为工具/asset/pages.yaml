    ```

    $$\sum_{j=1}^{M}\sum_{i=1}^{N_{j}}\left(y_{ij}-\overline{y}\right)^{2}=\sum_{j=1}^{M}\sum_{i=1}^{N_{j}}\left(y_{ij}-\overline{y_{j}}\right)^{2}+\sum_{j=1}^{M}\sum_{i=1}^{N_{j}}\left(\overline{y_{j}}-\overline{y}\right)^{2}+2\sum_{j=1}^{M}\sum_{i=1}^{N_{j}}\left(y_{ij}-\overline{y_{j}}\right)\left(\overline{y_{j}}-\overline{y}\right)$$


    由于 $\sum_{i=1}^{N_{j}}\left(y_{ij}-\overline{y_{j}}\right)=0$ ，故式 (16.2) 中最后一项为
    0 ，可简化为：

    ```


    ```

    $$\begin{aligned}\sum_{j=1}^{M}\sum_{i=1}^{N_{j}}\left(y_{ij}-\overline{y}\right)^{2}
    = & \sum_{j=1}^{M}\sum_{i=1}^{N_{j}}\left(y_{ij}-\overline{y_{j}}\right)^{2}+\sum_{j=1}^{M}\sum_{i=1}^{N_{j}}\left(\overline{y_{j}}-\overline{y}\right)^{2}\\\quad
    & =\sum_{j=1}^{M}\sum_{i=1}^{N_{j}}\left(y_{ij}-\overline{y_{j}}\right)^{2}+\sum_{j=1}^{M}N_{j}\left(\overline{y_{j}}-\overline{y}\right)^{2}\end{aligned}$$


    其中，等号右边第一项为组内偏差平方和，又被称为误差平方和（Error Sum of Squares, ESS）；第二项为组间差异平方和，又被称为因子平方和（Factor
    Sum of Squares, FSS）。

    ```


    # ## 16.2.2 自由度


    从 TSS、FSS、ESS 的数学表达式可以看出，反应变量的个数对离差平方和大小可能有影响，变量个数越多，离差平方和就有可能越大；变量个数越少，离差平方和就有可能越小。为了消除变量个数对离差平方和大小的影响，我们用离差平方和进行平均，得到均方差（Mean
    Square），来衡量不同来源的波动。在引入各均方差的定义之前，我们先来了解一下自由度的概念。


    自由度是指当以样本的统计量来估计总体的参数时，样本中能够独立或自由变动的数据的个数。比如，样本方差的计算公式为：


    ```

    $$S=\frac{1}{n-1}\sum_{i=1}^{n}\left(x_{i}-\bar{x}\right)^{2}$$

    ```


    其中分母 $n-1$ 就是自由度。为什么公式 (16.3) 中可以自由变动的样本个数为 $n-1$ 而不是 $n$ ？因为该式隐藏了 $\frac{1}{n}\sum_{i=1}^{n}x_{i}=\bar{x}$
    的这一均值约束，为了满足这个均值约束， $n$ 个样本不能都自由变动。考虑三个样本数据： $a, b, c$ ，若这三个数的平均数是 3 ，即 $\frac{1}{3}(a+b+c)=3$
    ，'
