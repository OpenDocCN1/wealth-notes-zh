  md: '票价格标准化，再将标准化价格相关系数高的股票配对，随后构造交易指标，以交易指标偏离其历史平均值的程度来判断交易进出时机，该文章发现在2004年10月11日到2004年12月3日这55个交易日中，配对交易策略的平均年化报酬为7.17。


    配对交易中一个重要环节是多空操作同时进行。中国证监会于2010年3月31日正式启动证券公司融资融券业务试点。做空证券业务的开放，使得配对交易策略在中国证券市场的应用实践成为可能。此策略除了被投资机构广为应用以外，相关的学术研究和验证也逐渐增多。例如，崔方达和吴亮（2011）以上证50指数成分股为样本，运用最小距离法进行配对交易，最终得出配对交易与市场风险无关并可获利。王春峰、林碧波和朱琳（2013）对沪深300指数成分股的众多股票进行配对，按照配对价差由低到高分成前5个配对、前10个配对和前20个配对，在2006—2009年进行配对交易，最终发现这三种配对的累积收益率均在45～50。丁涛（2013）将中国银行和中信银行股票进行基于协整关系的配对交易，时间跨度为2008年1月2日到2010年12月31日，采用传统开仓策略的年收益率高达42.27%，将开仓时机改进为延后开仓，年收益率达到42.61%。


    # ## 26.3 配对交易的步骤


    配对交易策略的时期分为形成期（Formation Period）和交易期（Trading Period）。在形成期挑选历史价格走势存在规律的股票对，并制定交易策略；在交易期模拟开仓平仓交易，而后计算收益。在整个配对交易策略过程中，我们需要考虑如下问题。


    +   1. 如何挑选进行配对的股票？

    2. 挑选好股票对以后，如何制定交易策略？开仓点如何设计？

    3. 开仓时，两只股票如何进行多空仓配比？


    接下来，我们分别阐述并解决这些问题。


    # ### 26.3.1 股票对的选择


    配对交易的第一步是要在形成期寻找历史价差走势大致稳定的股票对。目前据统计，中国沪深两市共有2780只股票，若要对这2780只股票两两配对，则一共可以配出3,862,810个股票对。如果要从这3,862,810个股票对中，挑选出历史价差走势稳定的股票对，势必耗费不少计算资源。折中的方法是将市场划分为多个子空间分别进行检索。下面介绍几种子空间配对的方法。


