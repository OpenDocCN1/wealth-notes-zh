  md: '则表明价格有较强的上涨趋势，这个穿越释放出买入信号。反之，在下跌行情中，在价格线的下方的均线起到支撑的作用。如果价格线向下穿越均线，说明价格下跌趋势较强烈，则释放出卖出信号。


