    # 1.4 交互对话环境 IPython


    除了 Python 默认的交互对话模式以外，IPython 是另一种更为广泛使用的交互对话环境。IPython 性能远优于 Python Shell，具有代码自动补全、代码自动缩进和查询帮助等独特优势。


    # 1.4.1 IPython 的安装


    安装 IPython 可以有多种方式。


