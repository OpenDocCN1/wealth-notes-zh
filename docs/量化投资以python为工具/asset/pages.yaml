- pgno: 308
  md: '收益率高的股票可能由于突发事件面临破产，债券收益率可能会由于央行对利息的调控而发生变化。简言之，历史并不一定完全重演。


    尤有甚者，历史数据法，对样本区间非常敏感。比如在2003年年底时估计中国股市的预期收益率，如果从2002—2003年采样，估计的预期收益率为10.3%；如果从2001—2003年采样，则估计的预期收益率为−4.63%，究竟何者具有代表性值得存疑；又如从1998—2003年采样，则估计的预期收益率为5.3%；如果从1990—2003年采样，则估计的预期收益率为23.2%。由此可见，历史数据得到的参数会因为样本区间不同而大不相同，如果参数不一样，那么模型的输出结果将有很大的差异。


    1992年，在高盛（Goldman Sachs）工作的Fischer Black和Robert Litterman对全球债券投资组合研究时发现，当对德国债券预期报酬率做0.1%小幅修正之后，该类资产的投资比例竟然由原来的10.0%提高至55.0%。这个发现说明Markowitz模型得到的最优资产配置比对输入参数过于敏感。


    从以上叙述可以看出，根据历史信息进行现在的资产配置，并期待未来的投资收益达到某个水平，这整个过程有改善之处。Black和Litterman提出了改进的模型——Black-Litterman模型（简称BL模型），其核心思想是将投资者对大类资产的观点（主观观点）与市场均衡收益（先验预期收益率）相结合，从而形成新的预期收益率（后验预期收益率）。如果投资者没有特别的观点，则依旧使用先验收益；如果投资者对某些资产有特别的观点，则根据主观观点的信心水平来调整后验收益，从而影响投资组合配置。Black-Litterman模型自提出以来，逐渐被华尔街主流所接受，现已成为高盛公司资产管理部门在资产配置上的一个主要工具。


    现在我们简要介绍一下BL模型的求解过程。现在有N种资产，其收益率为R={R₁, R₂, …, Rₙ}，BL模型中假设R服从联合正态分布，即R~N(μ, Σ)，其中μ和Σ为各资产预期收益率的期望值和协方差的估计值。现在假设估计向量μ本身也是随机的，并且服从正态分布：


    ```

    $$\mu \sim N(\pi, \tau\Sigma)$$

    ```


    其中π为先验预期收益率之期望值，τ在后文会详细解释。BL模型的特色是允许考虑投资者个人的观点（Investor Views），处理的方式是用各资产收益率之线性方程组来代表主观观点，比如一条观点可以用以下公式表达：


    ```

    $$p_1\mu_1+p_2\mu_2+\cdots+p_N\mu_N=q_i+\epsilon_i$$

    ```


    其中εᵢ为这条观点的误差项，εᵢ~N(0, σᵢ²)，σᵢ²受投资人对此条观点的信心水平（Confidence Level）影响。投资者表达总体观点可以用：'
