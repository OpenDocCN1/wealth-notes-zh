- pgno: 549
  md: '变动做出预测。从OBV 曲线趋势和股价趋势的不同组合着手，介绍几个在使用OBV 指标时应该注意的原则。


    (1) OBV 曲线上升但是股价下降：这种情况表明在股价下跌时成交量却在上升，暗示有越来越多的投资者在承接。在这种情况下，逐渐提高的成交量表明投资者对该股的信心不断增强，释放出买进信号。


    (2) OBV 曲线下降而股价上涨：这种情况与第一种情况刚好相反。虽然股价仍在上升，但是成交量却在缩小，表明投资者对其逐渐丧失信心，不愿接盘。因此，该股很可能已接近顶点，即将下跌。


    (3) OBV 曲线稳步上升，同时股价上涨：这种情况表明行情稳步向上，股价仍有上涨空间，中长期走势良好。


    (4) OBV 曲线缓慢下降，同时股价下跌：这种情况则表明行情不佳，股价仍会继续下跌，投资者应卖出股票或暂时观望。


    (5) 两种极端情况：OBV 曲线快速上升的现象表明卖盘迅速涌人，持续性不强，股价在短暂的拉升后可能会迅速下跌；OBV 曲线快速下降的现象则表明卖盘迅速涌入，但是随后仍有可能要有一段较长的下跌，投资者应以观望为主。


    上面介绍的只是使用OBV 指标时所应参考的几点原则，但在实际使用时绝非依靠这些原则就能获利。此外，在进行技术分析的时候，建议读者结合其他指标综合分析，而不是仅仅靠单一的指标，对行情的研判才能更加周全。


