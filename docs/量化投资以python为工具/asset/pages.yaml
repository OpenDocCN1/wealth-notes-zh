  md: "# # 第20章 资本资产定价模型（CAPM）\n\n# ## 20.1 资本资产定价模型的核心思想\n\n回顾第19章，Markowitz模型用严谨的数理工具告诉投资者应该如何构建自己的投资组合，不过，在20世纪50年代该模型提出时，电脑并未普及，而且计算能力非常有限，在实际投资中应用Markowitz模型是一项计算量大、难度强、成本高的工作。基于这些问题，学者们开始试图从实证的角度出发，深入挖掘Markowitz模型，希望能够简化Markowitz模型，并将其应用在现实投资中。在20世纪60年代初，三位学者Sharpe（1964）、Lintner（1965）、Mossin（1966）$^{1}$在Markowitz模型框架下不约而同推导出奠定现代投资学的经典模型：资本资产定价模型（Capital\
    \ asset pricing model, CAPM）。三位学者经过严格的推导都得到以下结论：对于任意的资产组合$q$，其收益率$R_q$满足以下关系式：\n\
    \n$\\mathbb{E}(R_q)-R_f=\\beta_{qm}[\\mathbb{E}(R_m)-R_f]$(20.1)\n\n公式(20.1)被称为传统的CAPM模型，式中：\n\
    \n+   $- R_m$是市场投资组合之收益率，该组合是市场上所有风险资产的组合，包括股票等金融资产，也包括黄金等实物资产，在现实中构建这样的投资组合是不大可能实现的，因此在实务上常以大盘指数来指代市场投资组合，根据大盘指数计算出来的收益率被看作$R_m$；\n\
    \n+   $- \\beta_{qm}=\\frac{\\sigma(R_q,R_m)}{\\sigma^{2}(R_m)}$为投资组合$q$的Beta值，其中$\\\
    sigma(R_q,R_m)$为资产组合收益率与市场投资组合收益率之间的协方差，$\\sigma^2(R_m)$为市场投资组合的方差，Beta值反映出资产组合$q$的系统性风险；\n\
    \n+   $- \\mathbb{E}(R_q)-R_f$为风险投资组合$q$比无风险资产高出的期望收益率，高出来的部分是因为投资人在持有风险组合$q$时承担了更多的风险，因此$\\\
    mathbb{E}(R_q)-R_f$被称为风险溢酬（Risk premium）。\n\n+   1.  详见Sharpe, William F. \"Capital\
    \ asset prices: A theory of market equilibrium under conditions of risk*\" The\
    \ journal of finance 19.3 (1964): 425-442.\n    2.  Mossin, Jan. \"Equilibrium\
    \ in a capital asset market.\" Econometrica: Journal of the econometric society\
    \ (1966): 768-783.\n    3.  Lintner, John. \"The valuation of risk assets and\
    \ the selection of risky investments in stock portfolios and capital budgets\"\
    \ The review of economics and statistics (1965): 13-37."
