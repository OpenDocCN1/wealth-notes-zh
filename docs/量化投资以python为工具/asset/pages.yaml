    # 13.3  数据的位置


    在分析数据时，我们往往会想要了解这组数据分布的位置，即这些数据都分布在什么值附近。在统计分析中，有专门的指标用于描述数据的位置。常用的指标包括算术平均数、几何平均数、中位数、众数和百分位数等。假设现在有
    $n$ 个样本观测值， $x_1, x_2, \dots, x_n$，其中 $x_i$ 为第 $i$ 个观测值。


    +   1. 样本平均数（Sample Mean）


    平均数是最常用的度量数据中心位置的指标。常用的平均数有两种计算方式，分别是算术平均法与几何平均法。算术平均数（Arithmetic Mean）的计算公式为：


    ```

    $$\bar{x} = \frac{x_1 + x_2 + x_n}{n}$$

    ```


    几何平均数（Geometric mean）采取的是将所有数据的乘积开方，其计算公式为：


    ```

    $$\bar{x} = \left[ \prod_{j=1}^{k} (x_j) \right]^{\frac{1}{k}}$$

    ```


    算数平均数的应用范围非常广，几乎所有定量的数据都可以计算其算数平均，而几何平均数经常用在收益率数据分析中。'
  merge: -1
  img_proc: true
- pgno: 203
  md: '# 2. 中位数（Median）


    中位数也是度量数据中心位置的指标之一。对于一个数据集 {v_k}，如果一个数值 md使得观测值中至少 50% 的数据大于等于 md，同时至少 50% 的数据小于等于
    md，那么，md 即为数据集 {v_k} 的中位数。一般来说，一个排好序的数据集，若包含奇数个观测值，那么中位数即是位于中间的数值；若有偶数个观测值，那么中位数即是位于中间的两个数的平均值。相较于平均数，中位数不易受到极端值的影响。因此，当数据集中有较多极端值时，中位数会是一个更好的度量数据中心位置的方法。


    # 3. 众数（Mode）


    众数是一组数据中出现次数最多的数值，也是比较常见的度量数据中心位置的指标。同中位数一样，众数不易受极端值的影响。


    # 4. 百分位数（Percentile）


    中位数是使得至少 50% 的数据大于等于该数、至少 50% 的数据小于等于该数的一个数值。将这个概念扩展开来，就得到了百分位数。第 \alpha 百分位数即为使得至少(100
    - \alpha)% 的观测值大于等于该数、至少 \alpha% 的观测值小于等于该数的一个数值。中位数是百分位数中比较特殊的例子，即 \alpha 的取值为
    50%。相较于平均数、中位数、众数，百分位数不仅可以度量中心位置，还可以度量其他的位置，如 25 的位置。


    我们经常将第 25 百分位数与第 75 百分位数取出来，与中位数组成四分位数（Quartile）来简要概括样本的分布情况。其中，第 25 百分位数、中位数与第
    75 百分位数分别被叫作第一四分位数（下四分位数）、第二四分位数与第三四分位数（上四分位数）。在实践中，可以使用百分位数来对业绩进行排序。比如，投资经理的业绩经常以与同类型投资经理的业绩相比所处的百分位数的形式来体现。另外，分析师也会根据某一分数位数来定义一个以该分数位数命名的组类。例如，在比较多股票的收益率表现时，可以将收益率低于第
