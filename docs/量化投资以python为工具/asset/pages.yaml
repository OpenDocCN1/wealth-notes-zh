    \n# 34.5 OBV 指标交易策略的 Python 实测\n\n按照上述 OBV 指标交易策略的思路，选择中国电力股票的交易数据，运用 Python 进行交易实测。交易策略的思路大致如下。\n\
    \n（1）构造交易函数，依照指标的取值情况确定买卖点信号 signal，进而根据 signal 计算交易策略的的收益率；\n\n（2）构造交易表现函数，绘制累积收益率曲线图，计算年化收益率、夏普比率等。\n\
