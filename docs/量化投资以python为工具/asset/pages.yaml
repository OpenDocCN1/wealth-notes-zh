    # 9.3.1.3 range 类型与操作


    在 Python 的 for 循环语句中，经常会使用 range( ) 函数生成一个等间隔的整数序列，该整数序列其实属于 range 类型数据，range
    类属于 Python 标准库内置的数据类型之一，range 类型数据也属于序列类型数据，且具有不可变的性质。range( ) 函数用于创建 range 类的对象。range
    函数的传入对象必须为整型数据，其函数用法为：


    ```

    #只传入一个参数时，表示生成一个初始值为 0，间隔为 1，终止值为 stop-1 的等差序列

    range(stop)


    #第一个参数为初始值，第二个参数为终止参照值，第三个参数 step 表示步长

    range(start, stop, step)

    ```


    如果 $i$ 为 range 对象 $r$ 的索引值，则该 range 类型的对象 $r$ 的取值满足关系式为 $r[i]=start+step*i$，但其取值需要满足一些条件：


    $$

    \begin{cases} r[i]<stop & \text{当 step 为 正整数且 }i\geqslant 0 \text{ 时} \\ r[i]>stop
    & \text{当 step 为 负整数且 }i\geqslant 0 \text{ 时} \end{cases}

    $$


    ```

    In [1]: r1=range(5)

    In [2]: type(r1)

    Out[2]: range

    In [3]: len(r1)

    Out[3]: 5

    In [4]: print(r1)

    range(0, 5)


    In [5]: r1[0:3]

    ```'
