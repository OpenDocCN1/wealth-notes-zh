    Python 标准库的数据类型为例，着重介绍其相应的操作函数和操作应用。


    # ## 9.3 Python 内置数据类型与操作


    # ### 9.3.1 序列类型数据操作


    序列类型属于 Python 标准库内置的类型，而列表、元组和范围（range）则是序列的三种基本类型。除此之外，字符串也属于序列类型。序列类型的对象有一些共同的操作，比如操作符运算、切片操作等。在介绍列表、字符串等各个数据类型的操作之前，先阐述一下这些序列类型对象的共同操作。如表
    9.3 所示，s 和 t 都表示序列对象，x 表示序列中的某一元素。


    # #### 9.3.1.1  list 类型与操作


    列表（list）类型的对象可以通过 list() 函数来创建。如果 list() 函数没有传入参数，则创建一个空列表¹。


    ```

    In [1]: L1=list([123,23,[4,5,6],''abc''])

    In [2]: L1

    Out[2]: [123, 23, [4, 5, 6], ''abc'']

    ```


    ¹前面积经介绍，空列表也可以通过方括号 [] 来创建。'
