    # #### 23.4.2 白噪声检验——Ljung-Box 检验


    如果一个序列是纯随机的就意味着它每一次新的变化都无迹可寻，我们无法从中挖掘 对预测有益的信息。一旦我们发现某个序列是纯随机序列，则说明这个序列已经没有什么
    可以挖掘的有用信息，因而可以停止对它分析。既然纯随机序列这么重要，那么我们如何'
