  md: '# # 第28章 动量交易策略


    # ## 28.1 动量概念介绍


    动量交易策略的英文名称是Momentum Trading Strategy。在经典力学里，动量（Momentum）指的是物体的质量和速度的乘积。牛顿当初在创造动量这个概念时，意图捕捉的是“运动的量”这个概念。所以我们可以理解为物体必须有运动才会有动量。背后的直觉是：当物体有运动，就会有速度；速度加上物体本身的质量，就决定了动量。速度和质量一方面描述了物体的运动状态，另一方面也刻画出其保持已有运动状态的趋向，即惯性大小。


    类比于证券市场上，如果我们把“证券的价格”类比为“运动中的物体”，证券价格的“上涨或者下跌”则是可以视为物体运动。依据惯性的原理，证券价格上涨，则其具有继续上涨的动能，也可以说证券价格保持着上涨的动量；同理，证券价格下跌，则其可能有继续下跌的动量。我们可以通过研究证券价格的动量来分析证券价格的变化趋势，进而制定交易策略，获取收益。在投资实践中，动量交易已有广泛的应用，例如美国价值线排名。在学术研究上，早在1993年，Jegadeesh与Titman研究时便发现股票资产组合的中期收益存在延续性，即中期价格具有向某一方向连续变动的动量效应。


    # ## 28.2 动量效应产生的原因


    对于证券市场上动量效应的产生原因，传统金融学和行为金融学有截然不同的看法。传统金融学在保留期望效用与理性人假设的前提下，试图引入更多的风险因子，以便产生新的风险溢酬来捕捉动量效应产生的超额收益。一般而言，这些尝试并没有获得广泛的认可，同时也存在是否过度拟合的疑虑。与传统金融理论相悖，行为金融学则认为投资人在复杂的市场环境中无法完美地预期与判断，故有“非理性”的行为与随之而来的定价偏差；同时，套利者受限于市场机制与风险承担能力，也不一定能及时纠正偏差的价格。不过，真正的原因何在，说法却不一而足。较为人所熟知的有“反应不足”、“正反馈模式”和“过度反应”等见解。


    举例来说，当上市公司出现利好信息时，其证券价格会随之上涨，但由于投资者没有及时地接收、消化这一信息，价格对此信息的反应无法一步到位。如百度公司发布其中报，财报显示百度公司运营很好。投资者A可能是在财报发布当下即购买百度股票，投资者B在五天后才看到这个财报，其又观望了一天，然后再去购买百度股票。对于百度的股价来说，这个利好信息本身应导致百度股价上涨；市场上A类的投资者，会使百度股价在财报发布的当下做出反应；但由于市场上还有很多信息反应不足的B类投资者，百度股'
  merge: -1
  img_proc: true
