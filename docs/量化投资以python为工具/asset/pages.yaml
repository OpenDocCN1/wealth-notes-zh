  md: '# 序 言


    过去十年，一股“量化投资”的热潮在中国悄然掀起。最近这两年，投资人对量化的关注更是到达了前所未有的地步。除了业界到处寻找量化团队以外，各种量化基金如雨后春笋般出现，各个大学校园也开始举办一场又一场的量化讲座、研讨会等。量化投资一时蔚为风行，产宫学共襄盛举。


    这么受人瞩目的议题，到底它的内涵是什么呢？为了了解量化投资这个概念，我们先回顾一下投资分析与决策过程。在投资分析与实战中，虽然个中滋味如人饮水，个中细节一言难尽，但“投资”大致上会有如下几个阶段：首先，投资人利用各种工具与分析方法，建构模型（系统）来验证买卖标的、时点、价位等有效性；第二阶段则筛选经过分析与验证得到的结论，实际应用于交易：一个严谨的投资人，通常还会有第三阶段，即在实际投资的过程中，不断地修正与完善自己的模型（系统）。在资讯工具不发达的年代，这些过程往往以质化为主。例如，基金经理人会研究上市公司财务报表，拜访公司高层，以经验判断技术指标的趋势与形态，做出投资的买卖决策。这种做法带有很大的主观性，因此又被称为“主观交易”。主观交易的流弊，在于决策基础多源于“大胆假设”而缺乏科学方法“小心求证”的过程。更甚者，行为金融学指出，投资人的行为往往易受各种心理认知谬误的影响而伤害投资绩效。除此之外，在瞬息万变的金融市场中，主观交易者若要处变不惊地坚守操作纪律，同时眼明手快地捕捉稍纵即逝的机会，也常有“力不从心”之叹。


    相较于主观交易所遭遇的问题，量化投资则在上述投资的各个阶段，利用数学、统计、计算机等分析工具来建立模型，据以客观地分析数据，按事先设定好的投资逻辑来进行投资决策，在理想状况下自动化执行下单。正因为如此，量化投资拥有可验证性、纪律性与即时性等诸多主观交易不可企及的优势。若再善用计算机技术，量化交易者可以处理的资讯量更让主观交易者望尘莫及。如此说来，采用量化技术岂非在投资上立于不败之地？


    读者只要稍加思考即可发现，量化投资的模型很容易因建模者的能力不同而良莠不齐。此外，绝大多数模型的核心思想在“以史为鉴”；在对历史数据依赖度高的前提下，一旦遇到新兴的金融市场或历史不曾出现的事件，量化投资者也只能徒呼负负。既然主观交易有诸多限制，量化交易又并非万能，那么，对投资绩效念念在兹的投资者，究竟该何去何'
