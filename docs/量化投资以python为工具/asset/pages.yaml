    若是遇到定性样本数据，频数分布表非常容易获得，只要将样本好分类，然后数清楚每类的个数就可大致了解整组数据的全貌。比如有投资者认为，某些政策会影响到某些行业的股票表现，比如投资者相信“丝绸之路”和“海峡西岸”的发展会影响到建筑建材行业和公路桥梁行业，决定把具有这些性质的股票整理出来，如表
