    # 14.2 期望值与方差


    可以用样本数据的平均值来刻画样本之中心位置，对应的，期望（Expectation）是随机变量所有可能取值结果之均值，用来呈现总体的中心位置。对于离散型随机变量，期望\end{c}是该随机变量所有可能的取值与其概率的乘积之和：


    $$\mathbb{E}(X)=\sum_{k} a_{k} f_{X}\left(a_{k}\right)=\sum_{k} a_{k} \mathbb{P}\{X=a_{k}\}$$


    方差（Variance）则是：


    $$\operatorname{Var}(X)=\mathbb{E}\left[X-\mathbb{E}(X)\right]^{2}=\sum_{k}\left[a_{k}-\mathbb{E}(X)\right]^{2}
    \mathbb{P}\{X=a_{k}\}$$


    用以刻画总体之离散程度。现在我们举个简单的例子来计算离散随机变量之期望和方差。有一类特殊的离散型随机变量叫作伯努利随机变量（Bernoulli Random
    Variable），伯努利随机变量 $X$ 只能取到两个值，0 或者 1。对应的概率质量函数为：


    $$f_{X}(a)=\mathbb{P}\{X=a\}=\begin{cases}p, & a=1 \\ 1-p, & a=0\end{cases}$$


    根据期望与方差的定义，可以计算伯努利随机变量之期望值为：'
  merge: -1
  img_proc: true
- pgno: 212
  md: '$$\begin{aligned}\mathrm{E}(X) &= 1 \cdot P\{X = 1\} + 0 \cdot P\{X = 0\}\\&=
    1 \cdot p + 0 \cdot (1 - p)\\&= p\end{aligned}$$


    方差为:


    $$\begin{aligned}\mathrm{Var}(X) &= (1 - p)^2 \cdot P\{X = 1\} + p^2 \cdot P\{X
    = 0\}\\&= (1 - p)^2 \cdot p + p^2 \cdot (1 - p)\\&= (1 - p) \cdot p\end{aligned}$$


    若随机变量 \( X \) 为连续型, 其概率密度函数为 \( f_X \), 则期望为:


    $$\mathrm{E}(X) = \int_{-\infty}^{\infty} af_X(a)da$$


    方差定义为:


    $$\mathrm{Var}(X) = \int_{-\infty}^{\infty} \left[ a - \mathrm{E}(X) \right]^2
    f_X(a)da$$


    从期望值与方差的定义来看, 若已知一个变量的概率分布, 就掌握了该变量的其他特征。


    随机变量的可能取值有很多（比如连续性随机变量的取值数为无穷）, 但其观测值（实现值）个数有限，因此现实中随机变量的概率分布、期望、方差等特征通常是不可知的，推断统计就是试图透过其观测值集合——样本数据来刻画这些特征。


    # 14.3   二项分布


    在系统地介绍推断统计之前，我们还需要了解一下进行推断统计不可缺的内容：一些常见的、特殊的概率分布，比如离散型的二项分布（Binomial Distribution）,
    连续型的正态分布（Normal Distribution）、卡方分布（Chi-square Distribution）、$t$分布（$t$Distribution）、$F$分布（$F$Distribution）等。


