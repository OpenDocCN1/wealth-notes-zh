  md: '购买某资产之前，预估未来可以获得的收益率水平，是一种事前（Ex ante）的收益率。由于未来价格是不确定的，因此未来的收益率很难预估。所以预期收益并不能代表投资人实际得到的收益。实际收益率是指投资人投入某资产后，实际获得的报酬率，是确定实际损益后计算的收益率，是一种事后（Ex
    Post）的或者已经实现（Realized）的收益率。当资产未来实际的价格与预期不同时，预期收益率就不会等于实际报酬率。


    投资人往往是根据预期收益率来决定是否要购入某资产，而且不同的人对预期收益率会有不同的看法。通常，机构投资者、专业投资人等对所投资的标的物比较了解，掌握的信息比较多，在估计未来收益率时比较准确。而散户等投资人通常是根据媒体新闻、券商发布的报告等信息做出投资决策，实际收益率常常和预期收益率相去甚远。不过，不论是机构投资者还是个体投资人在估计预期收益率时，经常会参考资产的历史收益率，也就是根据过去的股价、股利资料计算出来的收益率。


    # ## 18.1 单期与多期简单收益率


    众所周知，资产持有期间不同，会带给投资者不同的收益，比如，我们把钱存入银行，存 10 年获得的利息会比存 1 年获得的利息多$^{1}$。在计算单个资产的收益率或者比较不同资产的收益率时，我们需要先确定资产的持有期间。单期指收益率计算的时间间隔是一期，这里的一期可以以天为单位，也可以以月、季度或者年为单位，分别对应日收益率、月收益率、季度收益率或年收益率。多期是指时间跨度为
    2 期或者 2 期以上。接下来，我们以日为単位，分别介绍单期简单收益率和多期简单收益率的计算方式。


    # ### 18.1.1 单期简单收益率


    如果把一段时间内每一期的资产价格按照时间先后顺序排列起来，将得到资产价格的时间序列。把最早一期的价格用 $P_{1}$ 表示，之后的一期为 $P_{2}$，以此类推，就可以得到
    $P_{1}$, $P_{2}$, …, $P_{t}$ 这一时间序列。假设投资者在 $t-1$ 时投入某资产，投入价格为 $P_{t-1}$，持有一期后以
    $P_{t}$ 的价格卖掉。假设该资产在这一期的持有期间内，无其他收益、也不考虑交易成本，那么投资者的单期简单收益率（One Period Simple Return）$R_{t}$
    的计算公式为：


    ```

    $$ R_{t} = \frac{P_{t} - P_{t-1}}{P_{t-1}} = \frac{P_{t}}{P_{t-1}} - 1 $$

    ```


    简单毛收益率（Simple Gross Return）为 $1 + R_{t}$：


    ```

    $$ 1 + R_{t} = \frac{P_{t}}{P_{t-1}} \quad \text{或者} \quad P_{t} = P_{t-1}(1 +
    R_{t}) $$

    ```


    > > $^{1}$一般情况下，利率是正的。'
