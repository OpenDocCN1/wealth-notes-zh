    # 2. 切片


    Series 也支持标签切片和位置切片。两种切片方式有一定的区别：


    +   - 标签切片同时包括起始标签和结束标签位置；

    - 而位置切片遵循 Python 的切片规则，即包括起始位置，但不包括结束位置。


    这样设计的原因之一在于，若想要提取特定几个标签的元素，比如，提取标签 ''a'' 到 ''d'' 的元素，如果在切片时，不包括结束位置，则标签 ''d''
    中的元素值就无法提取；若包括标签 ''d'' 中的元素，则需要将结束标签指定为标签 ''d'' 下一个位置的标签，不过，通常我们不知道标签的顺序，就无法确定标签
    ''d'' 下一个位置的标签是哪个。


    ```

    ```

    In  [4]: S5[0:4] #位置切片，不包括结束位置

    Out[4]:

    a     2

    b     4

    c     6

    d     8

    dtype: int64

    ```

    ```


    ```

    ```

    In  [5]: S5[''a'':''d''] #标签切片，包括结束位置

    Out[5]:

    a     1

    b     3

    c     5

    d     7

    dtype: int64

    ```

    ```


    # 11.1.3 时间序列


    时间序列分析在金融数据分析中占据重要位置，Pandas 包中也支持时间序列类型的数据。时间序列（time series）类型也是一种 Series 类型，与一般
    Series 对象不同的是，时间序列的 index 属性取值为时间戳。


    +   - 创建时间序列


    时间序列的创建方式与一般的 Series 对象创建方式相同，我们只需要将 index 设置为 Timestamp 对象。


    Timestamp 对象由 Pandas 包中的 Timestamp() 来创建，Timestamp() 的传入值可以为 str 类型的数据，也可以为 datetime
    类型的数据。举例如下：'
