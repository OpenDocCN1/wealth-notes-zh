    # ## 24.2 ARMA 模型预测


    使用移动平均能够简单、快速地对时间序列做出预测。但是，移动平均中的参数（比如，选取过去实现值的期数、加权平均的权重值、指数加权平均的平滑系数等）往往是我们主观设置的，这种主观设置很容易偏离实际情况，因此在实际应用中，我们很少将移动平均得到的结果直接作为变量未来取值的预测。移动平均常常用在技术分析中，作为判断股价走势的技术指标。


    为了更好地对时间序列做出预测，学者们发展出各种各样的时间序列模型。这些时间序列模型意图刻画时间序列背后的统计规律，并根据这些规律来对时间序列做出更为精准的预测。以这种方式进行的时间序列分析之理论建构过程大致可以分为三个阶段。


    开展时间序列分析的理论研究的时间比较早，20 世纪 30 年代前后是理论模型构建的基础阶段，在此期间提出的模型研究对象多是平稳的时间序列。Udny Yule
    在 1927 年提出了著名的自回归模型（Autoregressive Model, AR 模型）$^{1}$；移动平均模型（Moving Average Model,
    MA 模型）也随之出现。之后学者们将 AR 模型和 MA 模型结合在一起，发展出 ARMA（Autoregressive Moving Average）模型。1970年，当ARMA模型被Box和Jenkins写进教科书时$^{2}$，这个模型逐渐流行起来，并被广泛应用在学术界和实务界。与此同时，Box
    和 Jenkins 也在同一本书中提出了 ARIMA（Autoregressive Integrated Moving Average）模型，该模型的处理对象为非平稳的时间序列，ARIMA
    模型的提出标志着时间序列分析理论构建进入成熟阶段，在此阶段，时间序列模型被大量地应用在实证研究中。不过以上模型都是假设干扰项的方差是固定不变的，在实证研究中，学者们发现金融经济数据很多都存在异方差（Heteroskedasticity）现象，因此应用传统的模型无法获得可靠的估计结果。时间序列分析的理论构建随后进入完善阶段，Engle
    在 1982 年提出 ARCH（Autoregressive Conditional Heteroskedasticity）模型，允许条件方差发生变动。之后，Bollerslov
    延伸了 ARCH 模型，提出应用范围更广的 GARCH（Generalized Autoregressive Conditional Heteroskedasticity）模型，ARCH
    和 GARCH 模型的提出很好地解决了刻画金融资产收益率序列波动聚集的难题。也有学者从其他角度来完善时间序列分析模型，比如 Granger 在 1987 年提出了协整（Cointegration）理论，将时间序列分析对象拓展到多变量的场景。


    本章将重点介绍时间序列分析基础模型，AR 模型、MA 模型和 ARMA 模型。在后面的章节中，我们会陆续介绍 ARCH 模型、GARCH 模型、协整理论及其应用。


    $^{1}$ Yule, G. Udny. “On a method of investigating periodicities in disturbed
    series, with special reference to Wolfer’s sunspot numbers.” Philosophical Transactions
    of the Royal Society of London. Series A, Containing Papers of a Mathematical
    or Physical Character (1927): 267–298.


    $^{2}$ Box, George EP, and Gwylm M. Jenkins. “Time series analysis: forecasting
    and control.” (1976).'
