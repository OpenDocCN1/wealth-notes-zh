  md: 'Pμ ~ N(Q,Ω)


    其中：


    +   * P (被称为 “Pick Matrix”) 为 K×N 矩阵，即对 N 个资产有 K 个观点；

    * q 为看法向量 (K×1 列向量)；

    * Ω 为看法向量 q 的误差项的协方差矩阵，表示投资者的观点与真实情况有所差别，Ω 为 K×K 的对角矩阵。不同的文献对其构造方式不同，常见的方法有以下四种。


    ◇ 与先验预期收益率之方差成正比，比如 He 和 Litterman (1999) 设定：


    ```

    ωij = { p(τΣ)PT ∀i=j

    0 ∀i≠j }

    ```


    或者


    ```

    Ω = diag(P(τΣ)PT)

    ```


    这种方法在很多文献中都很常见，这里就采用该方法来确定 Ω：


    +   ◇ 使用信心水平；

    ◇ 利用因子模型的残差项的方差；

    ◇ 用 Idzorek (2005)^1 的方法来确定信心水平；


    比如现在市场有五种资产 A、B、C、D、E，投资人基于自己的经验及分析，形成以下判断：


    +   * 资产 A 的收益率为 15%；

    * 资产 B 比资产 D 的收益率高 5%；

    * 资产 B 和 C 比资产 A 的收益率低 6%。


    据此，可以写出反应投资人主观观点的矩阵：


    ```

    P = [ 1 0 0 0 0

    0 1 0 -1 0

    -1 1/2 1/2 0 0 ]

