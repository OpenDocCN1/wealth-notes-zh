    # ### 11.3.4 删除重复数据


    有时我们处理的数据会因为数据源头或者后续处理不当而出现重复数据，这样既会占用额外的储存空间，也可能会影响分析结果。Pandas 包里有直接处理重复数据的函数：


    ```

    In [1]: df5=pd.DataFrame({''c1'':[''apple'']*3 + [''bansns'']*3+[''appl''],

    ...''c2'':[''a'', ''a'', 3, 3, ''b'', ''b'',''a'']})


    In [2]: df5

