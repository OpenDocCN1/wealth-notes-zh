  md: "2.3 Python 编程小技巧\n\n第 2 章 Python 代码的编写与执行\n\n# # 2.3 Python 编程小技巧\n\n# ## 2.3.1\
    \ Python 行\n\n语句为组成 Python 程序的基本元素，一般来说，一个语句占据一个物理行。不同语句之间有一定的逻辑关系，多个物理行之间也存在相应的逻辑关系，为了让\
    \ Python 解释器正确识别阅读 Python 语句，需要一定的来区分不同形式的行以及行与行之间的逻辑关系。\n\n+   - **注释部分：** 在\
