    # 18.4 资产风险的来源


    风险是指事件发生与否的不确定性，用在金融资产上，风险指的是获得收益的不确定性，通常以实际收益与期望收益的偏离来表示。1952 年，Harry Markowitz
    在 The Journal of Finance 上发表了堪称现代金融理论里程碑的 Portfolio Selection 一文，该论文以风险资产收益率的方差来代表风险，以研究资产组合和选择问题。从此，金融理论和实务开始重视风险在资产配置上的重要性。影响资产收益的因素有很多，而且不同资产面对的风险也不尽相同，在详细介绍风险度量之前，我们先来了解一下风险的来源，以加深对风险的理解。风险的来源大致可以分为市场风险、利率风险、汇率风险、流动性风险、信用风险、通货膨胀风险和营运风险等。


    # 18.4.1 市场风险


    市场风险又被称为系统性风险，是指能够对所有金融资产造成影响的风险，市场风险通常源自未能预料到的、能够对整体经济产生巨大冲击的大事件。市场风险对不同的金融工具影响不同，而且有些市场风险是区域性的，只影响一国经济金融；而有些风险是全球性的，一旦爆发，各国金融市场都受影响。历史上，有很多次波及全球的“著名”事件，比如
    1929 年美国大萧条、1998 年亚洲金融危机、2001 年美国 911 事件、2008 年全球金融海啸等，都对各国金融市场造成不同程度的影响。


    # 18.4.2 利率风险


    从宏观意义上说，利率是资金供求总量达到均衡时的借贷价格。从微观意义上看，利率对投资人意味着收益；而对借客人则是获取资金的成本。对投资人来说，利率风险是指由于市场利率水平的变动给金融资产带来价值损失的风险；对借客人来说，利率风险是由利率的变动而带来的融资成本的波动。通常利率和金融资产的价格反向变动，比如下利率的下降会降低企业的融资成本，间接增加企业的收益，进而提高企业的价值，促进企业股票价格上升；而利率升高时，投资者比较愿意将钱存进银行，降低对风险资产的需求，导致风险资产价格的下降。利率风险对银行业、保险业等金融机构的影响很大，比如
    1960—1988 年间，英国的利率一直维持在比较高的水平，英国公平人寿公司销售了约 10 万份年金产品，预定利率为 11%，比当时银行利率要高。随着市场利率逐步降低，这些高预定利率年金产品给公司带来了巨大的利差损失，使公司陷入危机。利率风险也会直接冲击房地产行业，比如
    2008 年次贷危机的一个原因就是美国的不断升息造成房地产行业不景气。'
