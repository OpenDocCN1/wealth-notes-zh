  md: "# ## 第30章 均线系统策略\n\n做投资的朋友大概都不会反对“趋势是我们的朋友”这句话。趋势交易策略长期以来被认为具有良好的获利能力，因此，交易员常围绕它思考两个问题：如何判断趋势和如何利用它进行交易。捕捉趋势最普遍的方法为移动平均线，根据求平均的方式不同，可以有简单移动平均数（Simple\
    \ Moving Average，SMA）、指数加权移动平均数（Weighted Moving Average，WMA）和指数移动平均数（Exponential\
    \ Moving Average，EXPMA 或 EMA）。\n\n# ### 30.1 简单移动平均\n\n# #### 30.1.1 简单移动平均数\n\
    \n回顾一下求解算术平均数的方法，即先对一组数据的值求和，再用这个总和除以这组数据的个数来得到算术平均数。同理，股价的简单移动平均数就是将一组股价值相加，再除以股价的个数。因此，需要先确定对哪几个数求平均数，即确定股价的个数\
    \ $n$。一般说来，我们以日、周为单位，比如求 5 日的平均数，10 日的平均数，20 日的平均数或者 3 周的平。此外，还请注意，为了体现“移动”两个字的作用，在求得第一个平均数以后，若要求第二个平均数，就要把原来的一组数的最早一项股价减去，再加上新一项新的股价，求和后除以股价的个数，以得到第二个平均数。\n\
    \n根据定义，股票在第 1 天到第 4 天无法求出 5 日价格简单移动平均数。第 5 天的简单平均数为：\n\n$$\\mathrm{SMA}_{t=5}=\\\
    frac{p_{1}+p_{2}+p_{3}+p_{4}+p_{5}}{5}$$\n\n式中， $p_{1}$ 、 $p_{2}$ 、 $p_{3}$ 、\
    \ $p_{4}$ 、 $p_{5}$ 分别表示股票第 1 天、第 2 天、第 3 天、第 4 天、第 5 天的价格。\n\n第 6 天的 5 日简单移动平均数则为：\n\
    \n$$\\mathrm{SMA}_{t=6}=\\frac{p_{2}+p_{3}+p_{4}+p_{5}+p_{6}}{5}$$\n\n即去掉第一天的价格，加上第\
    \ 6 天的价格 $p_{6}$ ，然后除以 5。同理，计算出第 7 天及之后的简单移动平均数，再用这些数据绘制时间序列图，就可以得到股价的简单移动平均曲线。\n\
    \n首先，读取青岛啤酒 2014 年以来的交易数据，提取收盘价，并绘制收盘价时序图。如图 30.1 所示。\n\n```\n```python\n# 获取青岛啤酒交易数据\n\
    In [1]: import pandas as pd\n        import numpy as np\n```\n```"
