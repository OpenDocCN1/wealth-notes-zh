    \hat{\varepsilon}_i = 0$


    $\sum_{i=1}^{n} \left( Y_i - \hat{\alpha} - \hat{\beta} X_i \right) X_i = \sum_{i=1}^{n}
    \hat{\varepsilon}_i X_i = 0$


    # 17.2 模型拟合度


    在现实，可能不同的 $X$ 都可以用来解释 $Y$ 之变动，比如自变量 Y 是股票收益率，有人可能用公司每股收益来解释，有人可能用公司市值来解释。因此，我们需要一个指标能够判断出模型的好坏，对此，我们引入拟合度（Goodness
    of Fit）的概念。拟合度是指回归直线与样本数据趋势的吻合程度，取决于估计方法和样本数据。


    常用来判断线性模型拟合度的指标是 $R^2$ (R Square)，又称作可决系数（Coefficient of Determination），它刻画的是自变量与因变量关系密切的程度，由回归模型解释的变动量占
    Y 总变动量的百分比刻画。如果将因变量 Y 的波动（方差）进行分解，可以得到如下公式:


    $\sum_{i=1}^{n} (Y_i - \bar{Y})^2 = \sum_{i=1}^{n} \left( \hat{Y}_i - \bar{Y}
    \right)^2 + \sum_{i=1}^{n} \hat{\varepsilon}^2$


    其中:


    +   - 等号左边为总平方和（Total Sum of Squares, TSS)，度量了因变量 $Y_i$ 的总波动情况;


    +   - 等号右边第一项为回归平方和（Regression Sum of Squares, RSS)，度量了模型估计出来的 $\hat{Y}_i$ 的波动情况，由于
    $\hat{Y}_i$ 是根据自变量 $X_i$ 估计的，所以这一部分可以说是总平方和中可以被自变量 $X_i$ 解释的波动;


    +   - 等号右边第二项为残差平方和（Error Sum of Squares, ESS)，度量了残差的波动，即不能被自变量 $X_i$ 解释的波动。


    由于 TSS、RSS、ESS 均为平方和，三者的关系为:


    $TSS = RSS + ESS$ (17.3)


    $R^2$ 的表达式为:'
