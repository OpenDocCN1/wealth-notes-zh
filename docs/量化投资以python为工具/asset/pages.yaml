    # 23.3.3 单位根检验


    在观察时序图、自相关图和偏自相关图来判断时间序列的平稳性时，我们是以目视判断的，不同的人对于图形的解读可能会不一样，因而通过图的形态推断出的时间序列平稳性的结论就会有差异。为了使序列平稳性的检验更加客观、有说服力，我们介绍一种统计检验——单位根检验。


    在介绍单位根检验之前，我们先来了解一下非平稳时间序列的一些性质。如果序列是非平稳的，经过 $d$ 次差分（Difference）可以将其转换成平稳序列，则称此序列为
    I($d$)，其中 I 是指整合（Integrated），$d$ 为整合阶数。比如：


    $x_t = x_{t-1} + \epsilon_t$ 其中 $x_0 = 0$， $\epsilon_t \sim N(0, \sigma_\epsilon^2)$。可以根据计算得到：


    $\mathbb{E}(x_t) = \mathbb{E}(x_{t-1}) = \dots = \mathbb{E}(x_1) = \mathbb{E}(x_0
    + \epsilon_1) = 0$

    $\text{Var}(x_t) = \text{Var}(x_{t-1}) + \sigma_\epsilon^2 = \dots = t\sigma_\epsilon^2$


    因为 $x_t$ 的方差会随着时间 $t$ 发生改变，因此该时间序列是非平稳的。不过 $x_t$ 经过一阶差分后，$\Delta x_t = x_t - x_{t-1}
    = \epsilon_t$ 为平稳的时间序列，因此 $x_t$ 为非平稳的 I(1) 序列。


    一个时间序列是否平稳可借助滞后算子（Lag Operator）多项式方程的根来判断；滞后算子是将一个时间序列的前一期值转化为当期值的算子，通常用 $L$ 来表示，比如对时间序列
    $\{x_t\}$ 运用滞后算子可得 $Lx_t = x_{t-1}$， $L^2x_t = x_{t-2}$，...。接下来我们 came 了解为什么可以借助滞'
  merge: -1
  img_proc: true
- pgno: 355
  md: "后算子多项式的根来判断时间序列的平稳性，这里依然沿用最简单的例子：$x_{t}=x_{t-1}+\\epsilon_{t}$，其中 $x_{0}=0,\
    \ \\epsilon_{t} \\sim N\\left(0, \\sigma_{\\epsilon}^{2}\\right)$，这样的序列又被称为随机游走过程。我们可以把\
    \ $x_{t}=x_{t-1}+\\epsilon_{t}$ 改写为 $x_{t}=\\sum_{i=1}^{t} \\epsilon_{i}$，也就是说，离当前时间\
    \ $t$ 很久之前的随机冲击（比如 $\\epsilon_{1}$）对现在的影响仍然没有衰减。$x_{t}=x_{t-1}+\\epsilon_{t}$\
    \ 还可以改写为：\n\n$$(1-L) x_{t}=\\epsilon_{t}$$\n\n其中 $1-L$ 即为滞后算子多项式（因序列特殊故这里是单项式），令\
    \ $1-L=0$，可得单位根 $L=1$，因此 $\\left\\{x_{t}\right\\}$ 也可以被称为单位根过程。总结起来，时间序列 $\\left\\\
    {x_{t}\right\\}$ 是随机游走过程，其滞后算子多项式的根有单位根，是一个非平稳的时间序列。\n\n上面的例子虽然可以帮助我们理解，但是过于特殊。我们再举一个例子，比如非平稳时间序列\
    \ $\\left\\{y_{t}\right\\}$ 满足 $^{1}$:\n\n$$y_{t}=\\left(1+\\rho_{2}\\right) y_{t-1}-\r\
    ho_{2} y_{t-2}+u_{t} \\ (23.2)$$\n\n其中 $\\left|\\rho_{2}\right|<1, u_{t}$ 为独立同分布过程,\
    \ $u_{t} \\sim I I D\\left(0, \\sigma_{u}^{2}\right)$，公式 (23.2) 可以改写为：\n\n$$y_{t}-\\\
    left(1+\\rho_{2}\\right) L y_{t}+\rho_{2} L^{2} y_{t}=u_{t}$$\n\n可得滞后算子多项式方程：\n\
    \n$$1-\\left(1+\\rho_{2}\\right) L+\\rho_{2} L^{2}=0$$\n\n该方程的两个根为 $L=1$ 和 $L=\\\
    frac{1}{\rho_{2}}>1$。 $y_{t}$ 的表达式可以改写为：\n\n$$y_{t}=y_{t-1}+u_{t}+\\rho_{2}\\\
    left(y_{t-1}-y_{t-2}\\right)$$\n\n从公式的前半部分来看，$\\left\\{y_{t}\right\\}$ 包含了随机游走的成分，换句话说，如果时间序列具有单位根，也就包含了随机趋势。一般来说，单位根与随机趋势被视为相同的概念。\n\
    \n现在我们将情况一般化，假设时间序列 $y_{t}$ 满足以下公式：\n\n$$\begin{gathered} y_{t}=\\gamma+\\rho_{1}\
    \ y_{t-1}+\rho_{2} y_{t-2}+\\cdots+\\rho_{p} y_{t-p}+\\epsilon_{t} \\ \\epsilon_{t}\
    \ \\sim I I D\\left(0, \\sigma_{\\epsilon}^{2}\\right) \\end{gathered}$$\n\n借助于滞后算子，可以将上面的模型改写成：\n\
    \n$$\begin{aligned} & y_{t}=\\gamma+\\rho_{1} L y_{t}+\\rho_{2} L^{2} y_{t}+\\\
    cdots+\\rho_{p} L^{p} y_{t}+\\epsilon_{t} \\ & \\gamma+\\epsilon_{t}=\\left(1-\\\
    rho_{1} L-\\rho_{2} L^{2}-\\cdots-\\rho_{p} L^{p}\\right) y_{t} \\end{aligned}$$"
