  md: '# 3.6 可变与不可变


    在讨论可变（Mutable）与不可变（Immutable）之前，我们先来复习一下 Python 解释器对以下表达式的处理过程：


    ```

    变量 = 某种类型的对象

    ```


    更具体一点，比如：


    ```

    x = 7

    ```


    Python 解释器先判断等号右边的 7 在内存中是否存在；如果不存在，Python 会依据 7 的类型（整数）分配内存，并在此内存中创建数字 7。然后再看看变量
    x 存在否，若否则同样创建 x；最后才把 7 赋值给 x。


    谨记上述的过程后，我们再看一个例子：


    ```

    y = 7

    ```


    7 这个数字在执行 x = 7 时已创建了，现在还再创建“另一个 7”，才能赋值给 y 吗？答案是不需要。Python 所做的事仅仅是把 y 指向刚刚创建的数字
    7。为了验证这个想法，我们介绍一个函数 id( )，其作用是得到一个变量的内存地址。


    ```

    In [34]: x = 7

    In [35]: y = 7

    In [36]: print(id(x))

    1635774416

    In [37]: print(id(y))

    1635774416

    ```


    从上例可以看出，x 与 y 都指向同一个内存地址 1635774416，即存放整数 7 的地方。下面再做一个实验：


    ```

    In [1]: z = x

    In [2]: x

    Out[2]: 7

    In [3]: z

    Out[3]: 7

    In [4]: print(id(z))

    1635774416

    ```


    结果并不意外，z 与 x 皆指向存放 7 的内存地址。但下例就不那么直观了：


    ```

    In [5]: z = 8

    In [6]: x

    Out[6]: 7

    ```


    这是因为 z 现在指向另一个地址，其中存放整数 8；而 x 仍指向存放 7 的地方：


    ```

    In [7]: id(x) # 存放 7 的地址

    Out[7]: 1635774416

    In [8]: id(z) # 存放 8 的地址

    Out[8]: 1635774448

    ```'
