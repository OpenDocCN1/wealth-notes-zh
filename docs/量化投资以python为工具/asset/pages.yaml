    ```\n\n# 26.5 Python 实测配对交易交易策略\n\n在本小节中，我们将运用中国银行和浦发银行股票的交易数据自行设计配对交易策略，这一次我们将\
    \ 2014 年 1 月 1 日到 2014 年 12 月 31 日作为配对形成期，以及将 2015 年 1 月 1 日到 2015 年 6 月 30 日作为交易期。用\
    \ Python 实现配对交易策略大致有如下 4 个步骤。\n\n+   (1) 在形成期内，将中国银行和浦发银行两只股票的对数价格进行协整检验。\n\n\
    +   (2) 找出配对比例 beta 和配对价差，计算价差的平均值和标准差。\n\n+   (3) 在交易期内，设定 $u \\pm 1.5 \\sigma$\
    \ 和 $u \\pm 0.2 \\sigma$ 为开仓与平仓的阈值，将 $u \\pm 2.5 \\sigma$ 视为协整关系可能破裂强制平仓的阈值，具体交易规则如下：\n\
    \n+   - 当价差上穿 $u + 1.5 \\sigma$ 时，做空配对股票，反向建仓（卖出浦发银行股票，同时买入中国银行股票，中国银行与浦发银行股票资金比值为\
    \ beta）；\n- 当价底下穿 $u + 0.2 \\sigma$ 之间时，做多配对股票，反向平仓；\n- 当价底下穿 $u - 1.5 \\sigma$\
    \ 时，做多配对股票，正向建仓（买入浦发银行股票，同时卖出中国银行股票，中国银行与浦发银行股票资金比值为 beta）；\n- 当价差又回落到 $u - 0.2\
    \ \\sigma$ 上方时，做空配对股票，正向平仓；\n- 当价差突破 $u \\pm 2.5 \\sigma$ 时，及时平仓。\n\n+   (4) 配对交易策略绩效评价。\n\
    \n接下来我们用 Python 编写代码，对浦发银行和中国银行股票进行从头到尾的配对交易策略实测。\n\n(1) 获取数据，在形成期内，将浦发银行和中国银行两只股票的对数价格进行协整检验，找出配对比例和配对价差。\n\
    \n```\n# 配对交易实测\n# 提取形成期数据\nIn [1]: formStart='2014-01-01'\n     formEnd='2015-01-01'\n\
    ```\n\n```\nIn [2]: PA=sh(' 501988 ')\n     PB=sh(' 600000 ')\n```\n\n```\nIn\
    \ [3]: PAF=PA[formStart:formEnd]\nIn [4]: PBF=PB[formStart:formEnd]\n```\n\n```\n\
    # 形成期协整关系检验\n\n# 中国银行一阶单整检验\nIn [5]: log_PAF=np.log(PAF)\nIn [6]: adfA=ADF(log_PAF)\n\
    In [7]: print(adfA.summary().as_text())\nAugmented Dickey-Fuller Results\n```"
