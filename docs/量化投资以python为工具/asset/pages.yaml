- pgno: 290
  md: '时不够理性，以高位价格 X 追买了基金 A，之后基金 A 价格回落，曾一度到达最低价格 Y，并再没有回到 X 的价位，如果该投资人一直持有这只基金，那么他在持有这只基金期间，面临的最大损失为
    $X - Y$，即最大回撤。因此，最大回撤对追高的投资人特别有指导意义。


    在上述定义中我们是用资产的价值来确定最大回撤，当手边的资料是收益率时，该如何计算回撤和最大回撤呢？如果某资产的收益率序列为 $R_1, R_2, \dots,
    R_T$，在初始时刻 0 时，我们投资 1 元在该资产上并一直持有到 T 时刻，这初始值为 1 元的资产价值就会随时间变为：$(1 + R_1), (1 +
    R_1)(1 + R_2), (1 + R_1)(1 + R_2)(1 + R_3), \dots, \prod_{k=1}^{T}(1 + R_k)$。时点
    T 对应的回撤值为：


    ```

    $$D(T)=\max \left\{0, \max_{t \in(0, T)} \prod_{k=1}^{t}\left(1+R_{k}\right)-\prod_{k=1}^{T}\left(1+R_{k}\right)\right\}$$

    ```


    相应的回撤率为：


    ```

    $$d(T)=\frac{D(T)}{\max _{t \in(0, T)} \prod_{k=1}^{t}\left(1+R_{k}\right)}$$

    ```


    最大回撤为：


    ```

    $$M D D(T)=\max _{\tau \in(0, T)} D(\tau)=\max _{\tau \in(0, T)}\left[\max _{t
    \in(0, \tau)} \prod_{k=1}^{t}\left(1+R_{k}\right)-\prod_{k=1}^{\tau}\left(1+R_{k}\right)\right]$$

    ```


    相应的最大回撤率为：


    ```

    $$m d d(T)=\max _{\tau \in(0, T)} d(\tau)=\frac{M D D(T)}{\max _{t \in(0, T)}
    \prod_{k=1}^{t}\left(1+R_{k}\right)}$$

    ```


    这个计算过程可以举个简单的例子，用 Python 来实现。假设某资产从第 1 期到第 6 期的收益率分别为：$0, 0.10, -0.10, -0.01,
