    # 31.3 布林带通道


    “布林通道”又称布林带状（Bollinger Bands，BBands）或者保力加通道，是通道的形式之一；与唐奇安通道类似，布林带通道也有刻画股票价格变化情况和波动幅度大小的作用。布林带通道是美国投资者约翰·布林格（John
    Bollinger）在 20 世纪后期结合统计学理论发明的一种技术分析指标。在分析股价运动情况时，一般以股价平均线作为参照线，而布林带在均线的基础上增添上下两条“股价通道”线。布林带的中轴线是股价的平均线，上通道为股价的均线加上一定倍数的标准差，而下通道则由均线减去一定倍数的标准差得到。'
