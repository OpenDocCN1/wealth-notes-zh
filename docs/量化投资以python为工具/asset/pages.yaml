    月 2 日的蜡烛图为绿色实体，说明收盘价高于开盘价，而其上影线不存在，说明最高价和收盘价很接近。我们可以解读为，3 月 2 日开市以后，上证综指的价格上下波动，在快闭市时才达到价格的最高点，则收盘价近似等于最高价。或者上证综指在交易期间达到最高点后价格又下跌，而在闭市时价格又反弹回最高点，最终收盘价近似等于最高价。与十字星一样，锤子线与吊顶线亦有很多变体，但其基本形态是一致的。'
