    其中 $\bar{R}_{p}$ 为投资人的投资目标，即投资人期待投资组合的期望值达到 $\bar{R}_{p}$，公式 (19.6) 说明投资人资产分配的原则是在达成投资目标
    $\bar{R}_{p}$ 的前提下，要将资产组合的风险最小化，这个公式就是 Markowitz 在 1952 年发表的 “Portfolio Selection”
    一文的精髓，该文奠定了现代投资组合理论的基础，也为 Markowitz 赢得了 1990 年的诺贝尔经济学奖。公式 (19.6) 的决策变量为 $\omega_{i},
    i=1, \cdots, N$，整个数学形式是二次规划（Quadratic Programming）问题，可以用拉格朗日（Lagrange）方法求解。由于求解过程比较冗长，我们只给出一阶条件（之后借助
    R 语言直接解）：


    ```

    $$\begin{bmatrix} \Sigma & e & \bar{R} \\ e^{\prime} & 0 & 0 \\ \bar{R}^{\prime}
    & 0 & 0 \end{bmatrix} \begin{bmatrix} \omega^{*} \\ \lambda_{1} \\ \lambda_{2}
    \end{bmatrix} = \begin{bmatrix} 0 \\ 1 \\ \bar{R}_{p} \end{bmatrix}$$

    ```


    其中 $\bar{R}$ 为 $N$ 种资产收益率期望值构成的列向量，$\Sigma$ 为 $N \times N$ 维收益率的协方差矩阵（Covariance
    Matrix），$e$ 为 $N \times 1$ 的单位列向量。最终投资比重最优解形式满足：


    $$\omega^{*}=a+b \bar{R}_{p}$$


    其中 $a$ 和 $b$ 与 $N$ 种资产收益率的期望值、方差、协方差有关，具体形式也较为复杂${}^{1}$。从公式 (19.8) 可以看出，决策量的最优解
    $\omega^{*}$ 与投资目标 $\bar{R}_{p}$ 呈线性关系，而风险 $\sigma^{2}(R_{p})$ 是 $\omega$ 的二次函数形式，因此，当达到最优解时，风险水平
    $\sigma^{2}(R_{p})$ 是投资目标 $\bar{R}_{p}$ 的二次函数形式。如果用图形表示投资目标 $\bar{R}_{p}$ 与最优解下标准差的关系，即得到图
    19.2。


    ![](img/0de14a685304f8aa267f6492145864ac_300_0.png)'
