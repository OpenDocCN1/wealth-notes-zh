  md: '# # 第 26 章 配对交易策略


    # ## 26.1 什么是配对交易


    在单边做多的市场行情中，投资者的资产收益往往容易受到市场波动较大的影响。在非理性的市场中，这种波动所带来的风险尤其难以规避。


    配对交易（Pairs Trading）思想为这种困境提供了一种既能避险又盈利的策略，其又被称为价差交易或者统计套利交易$^{1}$，是一种风险小、收益较稳定的市场中性策略。一般的做法，是在市场中寻找两只历史价格走势有对冲效果的股票，组成配对，使得股票配对的价差（Spreads）大致在一个范围内波动。一种可能的操作方式是，当股票配对价差正向偏离时，因预计价差在未来会回复，做空价格走势强势的股票同时做多价格走势较弱的股票。当价差收敛到长期正常水平时，即走势较强的股票价格回落，或者走势较弱的股票价格转强，平仓赚取价差收敛时的收益；当股票配对价差负向偏离时，反向建仓，在价差增至正常范围时再平仓，同样也可赚取收益。


    如图 26.1 所示是中国银行与浦发银行在 2014 年到 2015 年 6 月底的价格走势曲线，虚线（浦发银行股价曲线图）与实线（中国银行曲线图）的整体走势大致相同，可以构建配对交易策略。


    ![](img/0de14a685304f8aa267f6492145864ac_390_0.png)


    图 26.1 浦发银行与中国银行价格走势


    > $^{1}$统计套利交易并不仅限于配对交易。'
