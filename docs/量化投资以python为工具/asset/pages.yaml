  md: "是否为白噪声。我们再次回顾一下它的检验统计量。\n\nLjung-Box 检验采用的统计量是 Q 统计量，其表达式为：\n\n```\n$$Q(m)\
    \ = n(n + 2)\\sum_{k=1}^{m}\\frac{\\rho_k^2}{n-k} \\sim \\chi_m^2$$\n```\n\n其中，$\\\
    rho_k$ 是序列的 k 阶自相关系数，$n$ 是观测值的个数，$m$ 是设定的滞后阶数。Ljung-Box 检验的原假设设为“所检验序列是白噪声序列”。\n\
    \n用 Python 实现“CPI 序列是否为白噪声”的检验过程如下所示：\n\n```\nIn [13]: from statsmodels.tsa import\
    \ stattools\n\nIn [14]: LjungBox=stattools.q_stat(stattools.acf(CPItrain)[1:12],len(CPItrain))\n\
    \nIn [15]: LjungBox[1][-1]Out[15]: 0.0005560128948515668\n```\n\n从上述结果得知，检验的 p\
    \ 值为 0.000556 < 0.05（常见的显著性水平），所以我们应该拒绝原假设，接受备择假设，认为 CPI 序列不是白噪声序列。至此，我们已经完成了序列的识别工作，确认即将参与建模的\
    \ CPI 序列是平稳非白噪声序列，进入模型构建阶段。\n\n# 24.5.2 模型识别与估计\n\n我们已确定采用的模型为 ARMA 模型，还需要识别模型的参数\
    \ p 和 q。此处，我们将利用 ACF 和 PACF 来判断模型的具体形式。\n\n```\nIn [16]: from statsmodels.graphics.tsaplots\
    \ import *\n\n#将画面一分为二\n#在第一个画面中画出序列的自相关系数图\n#在第二个画面中画出序列的偏自相关系数图\nIn [17]: axe1=plt.subplot(121)\n\
