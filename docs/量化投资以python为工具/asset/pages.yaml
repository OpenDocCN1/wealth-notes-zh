  md: '# 10.3 数组元素索引与切片


    我们可以根据数组中元素所在的索引值（index value）$^{1}$来提取单个元素或多个元素，方法为array[start:end:step]，其中start是起始索引值，end是结束索引值，step是步长值，返回的结果是索引值为start到end-1之间，并且是索引值与start之差可以被step整除的连续对象。start、end、step三个值的取值或出现与否根据编程者需求的不同而改变。


    如果我们只需要提取数组的单个元素，则只有start值，即array[start]，举例如下：


    ```

    In [1]: a1=np.linspace(1,26,6,dtype=int)


    In [2]: a1

    Out[2]: array([ 1,  6, 11, 16, 21, 26])

    ```


    ```

    #提取数组a1中第4个元素，其索引值为3

    In [3]: a1[3]

    Out[3]: 16

    ```


    如果要提取数组中前后连续几个元素，则需要array[start:end]这样的形式，如下所示：


    ```

    In [4]: a1[:3]

    Out[4]: array([ 6, 11])

    ```


    另外，也可以通过特殊方法提取数组中的元素，举例如下：


    ```

    #省略索引的起始值，表示从a1[0]开始，但是不包括a1[5]

    In [5]: a1[:5]

    Out[5]: array([ 1,  6, 11, 16, 21])

    ```


    ```

    #省略索引的结束值，表示切片到数组中的最后一个元素

    In [6]: a1[2:]

    Out[6]: array([11, 16, 21, 26])

    ```


    ```

    #数组中的索引值为负数时，表示从右往左方向上元素的位置

    In [7]: a1[-1]

    Out[7]: 26

    ```


    ```

    In [8]: a1[-3]

    Out[8]: 16


    In [9]: a1[:-1]

    Out[9]: array([ 1,  6, 11, 16, 21])

    ```


    ```

    #起始值是索引值为2的元素，结束值是索引值为-1的前一个数字

    In [10]: a1[2:-1]

    Out[10]: array([11, 16, 21])

    ```


    通过索引值来提取数组中的元素或者对数组进行切片，提取的新数组与原来数组共享数据内存空间。'
