    Console 界面中，如图 12.2 所示。


    图片直接显示有利于我们直接观察图像中的内容，但是，此图片的大小是固定的，而且往往比较小，没办法调整，难以看清楚图像中的更多细节。在 Spyder 中，图像的显示可以通过“Tools
    >Preference >IPython console >Graphics >Backend”进行设定，如图 12.3 所示，默认设定值为 Inline，为图像在
    Console 中直接展示。


