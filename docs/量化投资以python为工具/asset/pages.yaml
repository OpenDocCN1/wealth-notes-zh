- pgno: 356
  md: '对应的滞后算子多项式方程为:


    $$1 - \rho(L) = 1 - \rho_1 L - \rho_2 L^2 - \cdots - \rho_p L^p = 0$$


    如果 $1 - \rho(L) = 0$ 所有根的绝对值都大于 1，那么时间序列 $y_t$ 为平稳的时间序列。如果 $1 - \rho(L) = 0$ 存在单位根，那么时间序列
    $y_t$ 就是非平稳，对该时间序列的未来值的预测就难以进行。


    常见的单位根检验的方法有 DF 检验（Dickey-Fuller Test）、ADF 检验（Augmented Dickey-Fuller Test）和 PP
    检验（Phillips-Perron Test）。我们这里使用 ADF（Augmented Dickey-Fuller）检验来确认序列是否有单位根，ADF
    检验的模型为:


    $$\Delta y_t = \alpha + \beta t + \gamma y_{t-1} + \delta_1 \Delta y_{t-1} + \cdots
    + \delta_p \Delta y_{t-p} + \varepsilon_t$$


    其中 $\alpha$ 对应截距，$\beta$ 对应趋势，$\delta_1 \Delta y_{t-1} + \cdots + \delta_p \Delta
    y_{t-p}$ 被称为 ADF 检验的增广项（Augmented Part），增广项的期数 $p$ 可用 AIC 或 BIC 来决定。ADF 的原假设为序列有单位根（非平稳）$H_0:
    \gamma = 0$，备择假设为序列是平稳的 $H_1: \gamma < 0$。该检验对应的统计量为:


    $$DF = \frac{\hat{\gamma}}{SE(\hat{\gamma})}$$


    其中 SE 是标准误（Standard Error）。该统计量的实际抽样分布不是 $t$ 分布，其极限分布也不是标准正态分布。如果该统计量比临界值（Critical
    Value）来的小，则拒绝原假设，也就是说序列是平稳的，否则认为该序列是非平稳的。


    在 Python 中，我们可以使用 arch 包中的 ADF 函数来进行 ADF 单位根检验，该函数具体用法为:


    ```

    ADF(y, lags, trend, max_lags, method)

    ```


    +   • y 是要进行单位根检验的序列；


    +   • trend 用来控制模型模型类型：“nc” 表示模型不含截距项，即 $\alpha = 0$；“c” 表示带有截距项，即 $\alpha \neq
    0$；“ct” 则表示包含截距项及线性的趋势项；“cft” 则是在 “ct” 的基础上加入了二次趋势项；


    +   • lags 表示一阶差分 $\Delta y_t$ 的滞后阶数，lags = 1 表示包含至 $\Delta y_{t-1}$ 项；如果该项参数的值为
    None，Python 会使用 method 参数所指定的方法选择滞后阶数；


    +   • max_lags 为使用 method 参数所指定的方法选择滞后阶数时所选择的阶数上限；


    +   • method 为选择阶数时所用的方法，包括“aic”、“bic” 及“t_stat”这三种 $^1$。


    $^1$ AIC（Akaie Information Criterion）和 BIC（Bayesian Information Criterion）是评估统计模型的复杂度和弱息统计模型“拟合”资料之优良性的标准，通常是在有限个数的模型中选择
    AIC 或 BIC 比较小的模型。'
