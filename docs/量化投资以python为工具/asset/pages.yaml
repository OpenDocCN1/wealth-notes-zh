    # 29.6 RSI 的“黄金交叉”与“死亡交叉”


    在股票市场使用 RSI 指标时，一般会定义不同时间跨度的 RSI 值。当短期 RSI 线向上穿 长期 RSI 线时，股票近期买入的力量较强，价格上涨的力量很大，其释放出一个较强的买入信号，这个信号被称为“黄金交叉”。当短期
    RSI 线向下跌破长期 RSI 线时，股票近期卖出的力量较强，价格下跌的力量很大，其释放出一个较强的卖出信号，被称为“死亡交叉”。


    比如，以交通银行股价为例，用 Python 绘制出 RSI 的黄金交叉和死亡交叉线。


