  md: "![](img/0de14a685304f8aa267f6492145864ac_469_0.png)\n\n# 30.2.2 加权移动平均函数\n\n\
    用 Python 编写一个加权移动平均的函数 wmaCal( )，以实现数据的加权移动平均。wmaCal( ) 函数定义代码如下：\n\n```\nIn [1]:\
    \ def wmaCal(tsPrice,weight):\n         import pandas as pd\n         import numpy\
    \ as np\n         k=len(weight)\n         arrWeight=np.array(weight)\n       \
    \  Wma=pd.Series(0.0,index=tsPrice.index)\n         for i in range(k-1,len(tsPrice.index)):\n\
