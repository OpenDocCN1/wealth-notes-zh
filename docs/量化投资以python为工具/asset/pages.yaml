- pgno: 240
  md: '组别的划分是以因子变量为依据的。由于需要借助方差来观察均值是否相同，所以被叫作方差分析。通过方差分析，可以检验分组所依据的因子变量对反应变量是否具有重要影响。如果反应变量在不同组别中的均值是相同的，则可以认为分组所依据的因子变量对反应变量没有影响（如果所有地区的平均失业率都是一样的，地区对失业率就没有重要的影响）。反之，可以推断分组所依据的因子变量是影响该反应变量的重要因素。请注意，只要存在至少两个组别的均值显著不同，就可以认为该因子变量对反应变量有影响。比如，哪怕只有广东和北京的失业率不同，其他地区的失业率都是一样的，也可以说明地区对失业率有影响。


    根据所研究的因素的数量，可以将方差分为单因素方差分析、多因素方差分析和析因方差分析。单因素方差分析是只研究一个因子的方差分析，如前面谈到的失业率、股票收益率等例子都属于单因素方差分析。多因素方差分析则是研究多个因子的方差分析，最常见的多因素方差分析为二因素方差分析，即研究两个因子的方差分析，比如探讨施肥量和灌溉量对于粮食产量的影响即是一个二因素方差分析。多因素方差分析研究的是每个因子是否对因变量有着重要的影响，而不是这些因子整体对因变量是否有着重要影响。析因方差分析则是在多因素方差分析的基础上加入了因子之间的乘项，其原因是一个因子对反应变量的影响大小可能受到另一个因子的水平的影响。举个简单的例子，假设有两个因子——是否酗酒与年龄段。是否酗酒有两个水平，即“是”和“否”；年龄段也有两个水平，即“青年”和“老年”。我们都知道酗酒对身体有负面影响，同时老年人酗酒对身体的伤害比年轻人酗酒对身体的伤害更大。也就是说，是否酗酒对身体的影响在不同的年龄段水平是不一样的。为了体现出这种影响，可以加入是否酗酒与年龄段的乘项，进行析因方差分析。


    在现实世界中，影响一个反应变量的因素往往有很多种，多因素方差分析即体现了这一点。但是，尽管有着很多影响因素，有时我们只想研究其中的一两种，而不是全部。不过在方差分析中，如果发现一个因素对反应变量有着重要的影响，这并不能保证该因素真的对反应变量有影响。之所以得到这样的结果的原因可能是，有另外一个与该因素相关的因素对反应变量产生了影响，我们把这种因素叫作干扰因素（Confoundind
    Factor）。为了避免干扰因素的影响，需要加入其他变量以控制干扰因素。如果加入的是因子变量，我们采取的就是随机区组设计（Randomized Block
    Design）。如果加入的是连续变量，那么该变量就是协变量，我们所进行的就是协方差分析（Analysis of Covariance, ANCOVA）。


    # ### 16.2 方差分析之原理


    方差分析的目的在于分析因子对反应变量有无显著影响，亦即因子的不同水平下反应变量的均值是否有显著差异。一般来说，影响反应变量的因素有以下两大类。


    +   1. 不可控的随机因素


    即使两块一模一样的土地，施加完全一样的肥料，灌溉一样数量的水，给予完全一样'
