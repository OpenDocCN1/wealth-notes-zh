  md: "# 33.4 成交量与均线思想结合制定交易策略\n\n在本小节，我们尝试运用成交量与价格数据，结合均线思想制定交易策略，具体交易步骤如下。\n\n+\
    \   (1) 获取成交量数据 volume，计算成交量的 5 日简单移动平均数 VolSMA5 和 10 日简单移动平均数 VolSMA10，并制定成交量均值\
    \ VolSMA，VolSMA 的计算公式为：\n\n$VolSMA = \\frac{VolSMA5 + VolSMA10}{2}$\n\n+   (2)\
    \ 获取价格数据，计算价格 5 日简单移动平均数和 20 日简单移动平均数。\n\n+   (3) 根据成交量制定成交量信号，当成交量 volume 大于成交量均值\
    \ VolSMA 时，释放出买入信号；当成交量 volume 小于等于成交量均值 VolSMA 时，释放出卖出信号；\n\n+   (4) 根据价格 5 日均线和\
    \ 20 日均线制定交易信号，当 5 日均线向上穿破 20 日均线时，释放出买入信号；当 5 日均线向下穿破 20 日均线时，释放出卖出信号；\n\n+ \
    \  (5) 合并成交量交易信号与均线交易信号，当成交量与均线都释放出买入信号时，才进行买入操作；当两者都释放出卖出信号时，才进行卖出操作。\n\n+  \
    \ (6) 进行交易策略评价。\n\n用 Python 实现这一交易策略，具体代码如下。\n\n```\n#获取成交量数据\nIn [1]: volume=CJSecurities.Volume\n\
    #求成交量均值VolSMA\nIn [2]: VolSMA5=pd.rolling_apply(volume,5,np.mean)\n    ...: VolSMA10=pd.rolling_apply(volume,10,np.mean)\n\
    \    ...: VolSMA=((VolSMA5+VolSMA10)/2).dropna()\n    ...: VolSMA.head(n=3)\n\
