    在Python中，0和取值为空的数据类型（比如空字符串“”或者``、空的数列[]、空的列表()以及空的字典{}等数据类型），以及None类型的布尔值均为False，其他的则表示True。调用bool()函数可以查看一个对象的布尔值。


