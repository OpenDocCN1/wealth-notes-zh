- pgno: 527
  md: '# # 第33章 量价关系分析


    # ## 33.1 量价关系概述


    “量”有成交量（股数）、成交金额、换手率等多种表现形式，“量”一般指交易市场中某种证券（比如股票、期货等）在某一特定时期内的交易数量。成交量体现了市场中多空方力量博弈；对于股票来说，一股以股票交易的股数大小来表示成交量的多少，成交的股数一般以“手”为单位，一手为
    100 股，在证券交易时，最少交易量为 1 手 $ ^ { 1 } $ 。“成交金额”指某种证券（比如股票）在交易市场中成交的金额，成交额直接体现了某种股票市场交易的资金量。“换手率”指股票的每日成交量与股票的流通股本的比值，主要体现个股的流动性和活跃度。


    “价”指证券的交易价格，对于股票来说，价格一般指股票的收盘价，除了收盘价以外，股票还有开盘价、最高价、最低价和调整价格等其他价格。众多学术研究和交易实践都表明价格的变化与成交量有明显的相关关系。成交量是市场供求的一种表现，当市场供不应求时，即市场利好于多方力量时，投资者会纷纷进入市场购买股票，成交量会增加。另一方面，当市场处于冷清状态时，股票的买方力量薄弱，购买量少，成交量可能会减小。成交量是市场中的主要动能，而价格则是市场多空双方力量的最终体现。一般来说，低成交量会伴随着价格的降低，高的成交量会引出价格的上升。成交量较大且价格上升时，市场处于看好趋势；成交量较小且价格降低时，市场可能处于盘整期或者看跌状态。


    # ## 33.2 量价关系分析


    在股票市场中，量价关系不仅仅只有量高价涨和量低价跌这两种简单的形式。在上涨行情中，价格上涨有可能对应着成交量下跌；在下跌行情中，价格下跌反而对应着成交量上涨。不同的市场环境有着不同的量价对应关系，不同的量价对应关系也会有不同的市场表现。一般来说，成交量可以上涨、可以下跌、也可以持平，对于价格来说，价格也有上升、下降和持平这三种情形，每一个成交量的状态都可以与价格的三种变化形态相联系，进而量和价一共有九种对应关系。接下来我们介绍几种常见的“量价关系”形态。在分析“量价”关系形态时，我们需要意识到，“量价”关系形态只是市场行情中某一局部信息的体现，在投资实战中还需要结合其他形态或指标进行综合分析。


    $ ^ 1 $ 不同的交易所会有不同的规定，这里指的是上海证券交易所。'
  merge: -1
