    表 18.1 中给出万科公司 2014 年 1 月份前七个交易日的股票收盘价（1 月 4 日和 5 日为周六和周日，非交易日）。接下来我们以 1 月 9 日为例，先根据公式计算单期收益率及
    2 期收益率，然后用 Python 实现自动计算。假设 2014 年 1 月 2 日为第 1 期，则 1 月 9 日为第 6 期，即 $t = 6$。2014
    年 1 月 9 日万科公司股票的收盘价为 7.46 元，1 月 8 日的收盘价为 7.42 元，1 月 7 日的收盘价为 7.43 元。根据公式，1 月 9
    日的单期简单收益率 $R_{6}$ 取值为：


    $R_{6} = \frac{P_{6} - P_{5}}{P_{5}} = \frac{7.46 - 7.42}{7.42} = \frac{0.04}{7.42}
    \approx 0.54\%$


    1 月 9 日的 2 期收益率：


    $R_{6}(2) = \frac{P_{6} - P_{4}}{P_{4}} = \frac{7.46 - 7.43}{7.43} = \frac{0.03}{7.43}
    \approx 0.403\%$


