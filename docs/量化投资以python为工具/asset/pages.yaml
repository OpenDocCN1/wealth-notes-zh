  md: "# 18.2.2 单期与多期连续复利收益率的关系\n\n不论是在业界还是在学术界，连续复利收益率的应用都非常广泛，其中一个原因是单期与多期连续复利收益率之间优良的性质。先以\
    \ 2 期连续复利收益率为例：\n\n```\n$$ \\begin{aligned} r_{t}(2) & = \\ln \\left(\\frac{P_{t}}{P_{t-2}}\\\
    right) \\\\ & = \\ln \\left(\\frac{P_{t}}{P_{t-1}} \\cdot \\frac{P_{t-1}}{P_{t-2}}\\\
    right) \\\\ & = \\ln \\left(\\frac{P_{t}}{P_{t-1}}\\right)+\\ln \\left(\\frac{P_{t-1}}{P_{t-2}}\\\
    right) \\\\ & = r_{t}+r_{t-1} \\end{aligned} $$\n```\n\n即， 2 期连续复利收益率等于前一天和当天的单期复利收益率之和。进而推知，\
    \ $k$ 期连续复合收益率 $r_{t}(k)$ 为连续 $k$ 天的单期连续复合收益率 $r_{t-(k-1)}, r_{t-(k-2)}, \\ldots,\
    \ r_{t-1}, r_{t}$ 之和，用公式表达为：\n\n```\n$$ r_{t}(k)=\\sum_{j=0}^{k-1} r_{t-j} $$\n\
    ```\n\n这个关系式体现了连续复利收益率的优良性质：单期加总即得多期。\n\n下面我们用万科股票的单期复利收益率数据进行验证：\n\n```\nIn [40]:\
