    $$\begin{aligned} =\sum_{i=1}^{N} \omega_{i} R_{i}\end{aligned}$$


    公式 (19.2) 中资产 $i$ 的投资比重 $\omega_{i}$ 是投资人在资产 $i$ 中的投资金额与总投资金额之比, 各资产的投资比重之和应为
    1, 即 $\sum_{i=1}^{N} \omega_{i} = 1$. 若 $N$ 种资产期望收益率分别是 $\mathbb{E}\left(R_{1}\right)$,
    $\mathbb{E}\left(R_{2}\right)$, ..., $\mathbb{E}\left(R_{N}\right)$, 则投资组合的期望收益率为:


    $$\begin{aligned} \mathbb{E}\left(R_{p}\right) = \omega_{1} \mathbb{E}\left(R_{1}\right)
    + \omega_{2} \mathbb{E}\left(R_{2}\right) + \cdots + \omega_{N} \mathbb{E}\left(R_{N}\right)
    \ = \sum_{i=1}^{N} \omega_{i} \mathbb{E}\left(R_{i}\right) \end{aligned}$$


    该投资组合收益率 $R_{p} = \sum_{i=1}^{N} \omega_{i} R_{i}$ 的方差为:


    $$\begin{aligned} \sigma^{2}\left(R_{p}\right) = \sigma^{2} \left(\sum_{i=1}^{N}
    \omega_{i} R_{i}\right) \ = \sum_{i=1}^{N} \omega_{i}^{2} \sigma^{2}\left(R_{i}\right)
    + \sum_{i \neq j} \omega_{i} \omega_{j} \sigma\left(R_{i}, R_{j}\right) \end{aligned}$$


    投资人规划资产配置的前提是对未来形成预期 (也就是已知未来各资产 $R_{1}, R_{2}, \ldots, R_{N}$ 的概率分布), 也知晓自己的投资目标,
    然后在自己财务状况允许的基础上决定各资产的投资比重 $\omega_{1}, \omega_{2}, \ldots, \omega_{N}$, 尽可能达成投资目标。


