    Python 内置常量是存在于 Python 内置命名空间中的常量，常量值不能被程序更改。在 Python 3.5.1 版本中，布尔类型取值的 True 和
    False 为内置常量；内置常量 NoneType 类型的 None 一般用于带有参数的函数的参数默认取值中，表示取值的缺失；Python 的内置常量还包括
    NotImplemented、Ellipsis、__debug__ 和 site 模块中的部分常量值等。


    ```

    In [1]: True

    Out[1]: True

    In [2]: False

    Out[2]: False

    In [3]: None

    \#english 不是内置常量，则会报错

    In [4]: english

    Traceback (most recent call last):


    File "<ipython-input-11-5in0biae9fdb1>", line 1, in <module>

    english


