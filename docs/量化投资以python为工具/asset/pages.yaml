  md: '来以后，按照从小到大的顺序排序，找出 Size 的中位数，将 Size 低于中位数的公司定义为 Small 组，高于中位数的公司定义为 Big 组。


    +   ◇ $HML_{t}$ 对应的是做多高 B/M 比公司、做空低 B/M 比公司的投资组合之收益率，所以也是要确定“B/M 比高低”的公司。首先，上市公司
    $k$ 在时点 $t$ 的 B/M Ratio$_{kt}=BE_{kt}/ME_{kt}$，其中 $BE_{kt}$ 为公司 $k$ 在时点 $t$ 股权的账面价值
    (Book Common Equity)，可以从财务报表相关数据库获得。计算出所有上市公司的 B/M 比之后，按照从小到大的顺序排序，然后将排在前 30%
    的公司划为 Low 组，将后 30% 的公司划为 High 组，将中间 40% 的公司定义为 Medium 组。


    +   ◇ 我们根据 Size 和 B/M 比划分的组别可以得到 6 组投资组合，分别是 S/L、S/M、S/H、B/L、B/M、B/H，其中两个字母代表同时属于两个组别，比如
    S/L 是指由 Size 上属于 Small 组、B/M 比上属于 Low 组的上市公司组成的投资组合。得到 6 个投资组合后，我们用市值比例加权平均的方式来计算每组的平均收益率，具体做法为：用每个投资组合中每只股票的市值除以整个组内所有公司的市值总和得到个股权重，再对整个组内所有个股收益率加权平均即可以得到该组的收益率。比如
    B/M 组由 $K$ 个公司组成，$t$ 时点时每个公司的市值分别为 $M_{1t}$，$M_{2t}$，…，$M_{Kt}$，各公司的股票收益率分别为 $R_{1t}$，$R_{2t}$，…，$R_{Kt}$，那么
    B/M 投资组合的收益率


    ```

    为：

    $$ \begin{gathered} B M_{t}=\frac{M_{1 t}}{\sum_{K} M_{k t}} R_{1 t}+\frac{M_{2
    t}}{\sum_{K} M_{k t}} R_{2 t}+\cdots+\frac{M_{K t}}{\sum_{K} M_{k t}} R_{K t}
    \\ =\sum_{K} M_{k t} R_{k t} / \sum_{K} M_{k t} \end{gathered} $$

    ```


    我们将 6 个投资组合的收益率标识为：SL、SM、SH、BL、BM、BH。


    +   ◇ 根据 Fama 和 French（1993）的定义：


    ```

    $$ \begin{gathered} S M B_{t}=\frac{1}{3}\left(S L_{t}+S M_{t}+S H_{t}\right)-\frac{1}{3}\left(B
    L_{t}+B M_{t}+B H_{t}\right) \\ H M L_{t}=\frac{1}{2}\left(S L_{t}+B L_{t}\right)-\frac{1}{2}\left(S
    H_{t}+B H_{t}\right) \end{gathered} $$

    ```


    从整个过程来看，$SMB_{t}$ 和 $HML_{t}$ 的计算稍稍有些复杂，因此现在一些数据库厂商会计算好这三个因子提供给使用者，在下来的例子中，为了重点突出三因子模型的实证应用，我们就不把重点放在计算因子上，直接应用下载好的数据。


