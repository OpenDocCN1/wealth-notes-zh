- pgno: 385
  md: '其中，$\{u_t\}$ 是一个均值为 0、方差为 1 的独立同分布随机变量序列，即 $u_t \sim IID(0, 1)$；$\alpha_0 >
    0$，$\alpha_i, \beta_j \geqslant 0$，$\sum_{i=1}^{p} \alpha_i + \sum_{j=1}^{q} \beta_j
    < 1$，且假定 $\alpha_i$ 与 $\beta_j$ 满足一定条件使得 $\varepsilon_t$ 的条件方差随时间变化、无条件方差有限。


    令 $\eta_t = \varepsilon_t^2 - \sigma_t^2 = \sigma_t^2 (u_t^2 - 1)$，在 ARCH 模型中我们已知：


    $$ \text{Var}\left(\varepsilon_t\right) = \text{E}\left(\varepsilon_t^2\right)
    = \text{E}\left(\sigma_t^2\right) $$


    则：


    $$ \text{E}\left(\eta_t\right) = 0 $$


    且对于 $j \geqslant 1$，


    $$ \text{Cov}\left(\eta_t, \eta_{t-j}\right) = \text{E}\left(\eta_t \eta_{t-j}\right)
    = \text{E}\left[\sigma_t^2 \sigma_{t-j}^2 \left(u_t^2 - 1\right)\left(u_{t-j}^2
    - 1\right)\right] = 0 $$


    也就是说 $\eta_t$ 是一个白噪声过程。将 $\eta_t = \varepsilon_t^2 - \sigma_t^2$ 改为 $\sigma_t^2
    = \varepsilon_t^2 - \eta_t$ 并代入 $\varepsilon_t^2$ 中，规定当 $i > p$ 时 $\alpha_i =
    0$，且当 $j > s$ 时 $\beta_j = 0$，可得：


    $$\begin{align*} \varepsilon_t^2 &= \sigma_t^2 + \varepsilon_t^2 - \sigma_t^2
    \\ &= \alpha_0 + \sum_{i=1}^{p} \alpha_i \varepsilon_{t-i}^2 + \sum_{j=1}^{q}
    \beta_j \left(\varepsilon_{t-j}^2 - \eta_{t-j}\right) + \eta_t \\ &= \alpha_0
    + \left(\sum_{i=1}^{p} \alpha_i \varepsilon_{t-i}^2 + \sum_{j=1}^{q} \beta_j \varepsilon_{t-j}^2\right)
    + \eta_t - \sum_{j=1}^{q} \beta_j \eta_{t-j} \\ &= \alpha_0 + \sum_{i=1}^{\max(p,q)}
    \left(\alpha_i + \beta_i\right) \varepsilon_{t-i}^2 + \eta_t - \sum_{j=1}^{q}
    \beta_j \eta_{t-j} \end{align*} $$


    满足 ARCH(p) 模型的序列 $\{\varepsilon_t\}$ 的变化序列 $\{\varepsilon_t^2\}$ 可用 AR(p) 模型刻画，而
    GARCH 模型相当于在变换后的 $\varepsilon_t^2$ 方程中添加了 MA 项（即 $\eta_t, \eta_{t-1}, \dots, \eta_{t-j}$
    项），以作为 ARCH 模型的推广。通过计算也可以得到 GARCH 模型中波动率聚集以及厚尾特性，在此略过细节，有兴趣的读者可自行推导。GARCH 模型的估计与
    ARCH 模型类似，在假设扰动的分布之后常采用条件最大似然估计，具体过程请参阅计量经济学相关书籍。


    ARCH 与 GARCH 模型的不足之处很类似。首先，这两种模型都认为波动是对称的，也就是不论何时，过去期的波动对现期间条件方差的影响是相同的，而实证结果并非如此，比如有学者发现，当坏（好）消息发布时，股票收益率的波动会增加（减小）。其次，两个模型对参数的限制都较强，特别是高阶模型，参数需要满足的约束会非常复杂。最后，作为统计模型，两个模型并没有提供关于波动率变化的更进一步的解释，而仅仅是拟合波动率变化的统计行为，要进一步理解波动率的动态变化还需要其他理论。'
