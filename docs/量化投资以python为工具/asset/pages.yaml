    c1 c2

    0 apple a

    1 apple a

    2 apple 3

    3 banana 3

    4 banana b

    5 banana b

    6 apple a

    ```


    DataFrame 对象调用 duplicated() 可以得到一个 bool 型的 Series，表示各行是否是重复行。


    ```

    In [3]: df5.duplicated()

    Out[3]:

    ```'
