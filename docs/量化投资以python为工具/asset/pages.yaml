- pgno: 358
  md: '# ### 23.4 白噪声


    金融领域传统理论的基石——市场有效性假说认为，在弱式有效市场中资产收益率序列 {r_t} 不存在自相关性。现在我们用讨论式的反证法来说明这一结论：假设收益率存在稳定的相关性，投资者就可以根据历史信息估计出相关性的大小、进而预测未来收益率，然后利用这些信息进行套利。如果投资者是理性的，就都会发现这一机会，那么都会进行套利行为，市场的价格发现机制就会改变资产的“未来”价格，也就是会改变资产“未来”的收益率，进而消除掉原有的相关性。举个例子，假设资产
    A 的收益率序列存在自相关性，投资者根据历史信息预测出明天该资产的期望收益率是 2%，决定买入资产 A，当有很多人都要买入资产 A 时，它的价格就会上涨，进而降低收益率，消除原本存在的自相关性。因此，正常情况下，资产收益率序列不存在自相关性，这个结论可以用来检验市场是否为弱式有效。在金融领域，不论是构建理论模型还是实际操作应用，不存在自相关性的序列都是非常重要的序列，比如白噪声序列（White
    Noise）。


    # #### 23.4.1 白噪声


    如果一个随机过程中任意时点 t 的变量 X_t 的均值和方差、协方差分别满足以下公式：


    ```

    E(X_t) = 0


    Var(X_t) = σ^2


    γ_l = 0, l > 0

    ```


    则称这个随机过程为白噪声过程。从上述表达式也可以看出，白噪声过程中各期变量之间的协方差为 0，也就是说白噪声过程是没有相关性的。这种时间序列也可以称为纯随机序列（Pure
    Random Sequence）。白噪声序列一定是平稳的时间序列，白噪声序列的均值为常数、方差为常数；其间隔大于 0 的自协方差都恒等于 0，这满足平稳性序列的自协方差只与时间间隔相关，而不与时间的起始点相关的要求。不过白噪声过程只要求各期变量之间无相关性，但是无相关性不代表各期之间相互独立。


    如果白噪声过程中各变量独立同分布，且都服从正态分布，即：


    ```

    X_t ~ N(0, σ^2)

    ```


    则该序列被称为高斯白噪声过程（Gaussian White Noise）。根据定义，可以判断出高斯白噪声过程是强平稳的时间序列，而且各期之间不仅不相关，还相互独立，也就是说如果一个序列是高斯白噪声过程，则无法根据过去信息推测未来。前文介绍单位根检验时，曾经举了一个非平稳时间序列的例子：


    ```

    x_t = x_{t-1} + ε_t

    ```'
