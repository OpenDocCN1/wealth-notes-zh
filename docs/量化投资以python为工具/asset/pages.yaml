  md: '若我们赋予 x 另一个值，会发生什么事呢？


    ```

    In [9]: x = 9

    In [10]: id(x)

    Out[10]: 1635774480

    ```


    x 指向的地址改变了！之所以如此，是因为整数对 Python 而言是不可变 (Immutable) 的对象。一旦在内存中建立不可变对象之后，其值就无法更动。变量名称可以指向别的对象，但无法修改已创建的不可变对象的内容。


    Python 为什么要这么做呢？下例可以给我们一些灵感：


    ```

    In [11]: x1 = 7

    In [12]: id(x1)

    Out[12]: 1635774416

    ```


    x1 指向了先前存放 7 的地址，这样做的优点是 Python 可以为不可变的对象分配固定的内存，重用它，以减少重复的值对内存空间的占用 ^{1}。


    浮点数、字符串也是不可变的对象。如下例：


    ```

    In [13]: s1 = ''Hello World''

    In [14]: id(s1)

    Out[14]: 20412089968

    In [15]: s1 = ''Hi 11''

    In [16]: id(s1)

    Out[16]: 20412492464

    ```


    我们可以透过索引访问字符串的内容：


    ```

    In [17]: s1[0]

    Out[17]: ''H''

    ```


    如果我们试着去改变 s1[0] 呢？


    ```

    In [18]: s1[0] = ''x''

    Traceback (most recent call last):

    File "<python-linp.py-58-1d7f5f5b549bue.", line 1, in <module>

    s1[0] = ''x''

    TypeError: ''str'' object does not support item assignment

    ```


    显然不可行，因为字符串是不可变的。


    接下来我们看一个可变的类型——列表。列表对象建立之后，仍可以对其内容进行修改。延用前例的 L2，下例将 L2[0] 的内容从原来的 10 修改为 20：


    ```

    In [19]: L2[0] = 20

    In [20]: L2

    Out[20]: [20, ''Fisca'', [''Industry 1'', ''industry 2'']]

    ```


    在上例中，L2[0] 原本指向整数对象 10，现在转而指向新的整数对象 20，因而列表 L2 的内容被修改了。在此要提醒读者，若有两个以上的变量同时指向一个可变对象，则透过任何一个变量都可以对该对象进行修改。下例让
    L1 和 L4 指向同一个列表：


    ^{1} 缺点是执行效率会下降.'
