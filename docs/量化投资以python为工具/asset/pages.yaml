  md: '该在布林带通道内部运动，股价只有大约 5% 的概率会突破布林带通道的上轨道或者下轨道。因此在正常情况下，当价格线超出布林带通道上下线时，可以认为价格线有偏离，未来价格很有可能回落到布林带通道的内部。


    # ### Areas Under The Theoretical Normal Curve


    ![](img/0de14a685304f8aa267f6492145864ac_500_0.png)


    由于布林带通道的设定与标准差的倍数相关，有学者将布林带通道与股市风险联系在一起分析市场行情。在股价运动分布情况呈现出正态分布的前提下，布林带通道由平均线加减
    2 倍标准差刻画，由图 31.5 可推知，在正常情况下，股价有 95.44% 的概率在正负两倍标准差内部运动，当股价突破布林带上下界时，说明股价出现了异常波动，异常波动的概率为
    4.56%。将股价异常波动到布林带上下通道外部的情形定义为“布林带风险”（Bollinger Risk）。


    根据统计学原理，在置信水平为 $\alpha$ 的条件下，布林带风险 $BR_{\alpha}$ 的计算公式为：


    ```

    $BR_{\alpha} = \frac{d_m}{d_t} \times 100%$

    ```


    其中，$d_t$ 表示观察的股价数据总期数，$d_m$ 表示观察期内股价在布林带上下通道外部的总期数。一般而言，置信水平 $\alpha$ 的取值范围为 1%、5%
    或 10%。在不同的置信水平下，布林带上下通道的界定不同。


    +   • 当 $\alpha=10%$ 时，布林带上通道线为 $\bar{B}_n = u_n + 1.65 \times \sigma_n$，布林带的下通道为
    $\underline{B}_n = u_n - 1.65 \times \sigma_n$；'
