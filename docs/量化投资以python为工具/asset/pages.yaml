- pgno: 285
  md: '其中，$R$ 是所有可能发生的（或者已经实现的）收益率（随机变量），$\mathbb{E}(R)$ 为期望收益率。若收益率 $R$ 是离散分布，则：


    $\sigma^{2}(R)=\sum_{K} p_{k}\left[R_{k}-\mathbb{E}(R)\right]$


    其中 $\left\{R_{1}, R_{2}, \ldots, R_{K}\right\}$ 是收益率 $R$ 所有可能取值结果的集合，$p_{k}$ 是
    $R$ 取值 $R_{k}$ 的概率。若 $R$ 服从连续分布，则：


    $\sigma^{2}(R)=\int\left[R-\mathbb{E}(R)\right]^{2} f(R) d R$


    其中 $f(R)$ 为 $R$ 的概率密度函数。方差风险度量法的优点是观念简单、为大多数人所理解，因此应用非常广泛。不过随着金融风险管理论的发展和经济金融实务面临的问题日益复杂，这种方法也显示出很大的弊端，主要表现在如下两个方面。


    +   1. 这一定义偏离了风险的本意，风险往往被认为是潜在的损失，而方差是一个中性的概念，只有向下的波动才和风险的本意相契合，向上的波动反而会使投资者获益，无法反映风险的经济性质，有违于投资者对风险的直接心理感受。


    +   2. Markowitz 在构建均值-方差投资组合时，将收益率看作服从正态分布，这样才能忽略收益率更高阶的统计特性（比如偏度、峰度等），只需要考虑均值、方差即可。但现实中很多金融产品的收益率具有明显的偏度和峰度，继续使用方差度量风险而对高阶不予考虑的话可能会产生较大的误差。


