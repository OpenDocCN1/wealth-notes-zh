    从相关系数矩阵可以看出，5只股票之间都是正向相关的，白云机场（600004）和福建高速（600033）同属交通运输，相关性最高。接下来我们将求解资产配置比例以期待在达到目标期望收益率时将风险最小化。根据前文的阐述，投资者的资产配置问题最终可以用一个二次规划问题来表达，该问题在数学上的一阶条件形式如下：借助
    Python 构建一个MeanVariance 类，该类可以根据输入的收益率序列，求解上述的二次规划问题，计算出最优资产比例，并绘制最小方差前缘曲线。如图
    19.6 所示。


    ```

    #定义MeanVariance 类

    from scipy import linag

    class MeanVariance:

    #定义构造器，传入收益率数据

    def __init__(self,returns):

    self.retums=returns

    #定义最小化方差的函数，即求解二次规划

    def minVar(self,goalRet):

    covs=np.array(self.retums.cov())

    means=np.array(self.retums.mean())

    L1=np.append(np.append(covs.swpaces(0,1,[means],0),

    [np.ones(len(means))],0).swpaces(0,1)

    L2=list(np.ones(len(means)))

    L2.extend([0,0])

    L3=list(means)

    L3.extend([0,0])

    L4=np.array([L2,L3])

    L=np.append(L1,L4,0)

    result=linag.solve(L,np.append(np.zeros(len(means)),[1,goalRet],0))

    return(np.array([list(self.retums.columns),result[:-2]]))

    #定义绘制最小方差前缘曲线函数

    def frontierCurve(self):

    goals=[x/500000 for x in range(-100,4000)]

    variances=list(map(lamba x: self.calVar(self.minVar(x[1:]),astype(np.float)),

    goals))

    plt.plot(variances,goals)

    #给定各资产的比例，计算收益率均值

    def meanRet(self,fracs):

    meanRisky=ffn.to_retums(self.retums).mean()

    assert len(meanRisky)==len(fracs), ''Length of frictions must be equal to number
    of assets''

    return(np.sum(np.multiply(meanRisky,np.array(fracs))))

    #给定各资产的比例，计算收益率方差

    def calVar(self,fracs):

    return(np.dot(np.dot(fracs,self.retums.cov()),fracs))

    ```


