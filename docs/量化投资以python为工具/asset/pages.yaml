    # 23.2 平稳性


    前文提到，时间序列分析的主要目的是要利用事物特征变量的历史和现状来推测其在未来可能出现的状况，能做如此分析的前提是“历史可以重演”，也就是说时间序列的历史和现状具有代表性和可延续性，即时间序列的基本特性必须能从过去维持到我们欲推测的时期。否则，基于历史和现状来预测未来的想法便是没有依据的。


    如果时间序列的基本特性维持不变，我们就称该时间序列是平稳的（Stationary），相反，若时间序列的基本特性只存在于所发生的当期，并不会延续到未来，那么这样一个时间序列则不足以昭示未来，我们便称这样的样本时间序列是非平稳的。形象地理解，平稳性就是要求经由样本时间序列所得到的曲线在未来的一段期间内仍能顺着现有的形态“惯性”地延续下去。金融领域很多变量之所以难以估计，就是因为这些变量经常突变，根本不是平稳的。


    时间序列平稳是经典时间序列分析得以进行的基本假设；只有基于平稳时间序列的预测才是有效的。如果我们研究的对象是非平稳的，那么我们通常会将它转为平稳的时间序列，再进行研究。接下来，我们来了解时间序列平稳性的严格定义。平稳性有强平稳和弱平稳之分。由于强平稳的条件过于严格，所以在一般情况下，我们所说的平稳时间序列指的是弱平稳时间序列。


    # 23.2.1 强平稳


    设 $\{X_{t}\}$ 为一时间序列，对于任意正整数 $n$，任取 $t_{1}, t_{2}, \cdots, t_{n} \in T$，对任意整数
    $\tau$ 有：


    ```

    $F_{X}\left(x_{t_{1}}, \ldots, x_{t_{n}}\right)=F_{X}\left(x_{t_{1}+\tau}, \ldots,
    x_{t_{n}+\tau}\right)$

    ```


    即 $X_{t_{1}}, X_{t_{2}}, \cdots, X_{t_{n}}$ 的联合分布 $F_{X}\left(x_{t_{1}}, \ldots,
    x_{t_{n}}\right)$ 与 $X_{t_{1}+\tau}, X_{t_{2}+\tau}, \cdots, X_{t_{n}+\tau}$ 的联合分布
    $F_{X}\left(x_{t_{1}+\tau}, \ldots, x_{t_{n}+\tau}\right)$ 相同，那么我们就称时间序列 $\{X_{t}\}$
    是强平稳的（Strictly Stationary）。从定义上来看，强平稳是一个很强的条件，若一个时间序列满足强平稳性，则该序列的任何统计性质都不会随时间改变。不过强平稳性的条件过于严苛，在理论上不易证明一个序列是强平稳的，在实际应用中也很难检验。'
  merge: -1
  img_proc: true
- pgno: 350
  md: '# 23.2.2 弱平稳


    不论是理论还是实际应用，强平稳性都不具有可用性。弱平稳性（Weakly Stationary）依然要求时间序列的基本特性维持不变，只是将平稳的条件放宽，将序列的基本特性用几个常见的、比较好衡量的统计量来代表，因此弱平稳性又被称为宽平稳性。弱平稳性是将序列的基本特性用序列的低阶矩来代表，只要保证序列低阶矩平稳，就可以认为序列的主要性质近似稳定。假设
    $\{X_t\}$ 是一个时间序列，如果 $\{X_t\}$ 满足如下三个条件。


    +   * （1） 任取 $t \in T$，有 $E(X_t) = \mu$，即序列的均值为常数；

    * （2） 任取 $t \in T$，有 $E(X_t^2) < \infty$，即存在二阶矩；

    * （3） 任取 $t \in T$，对任意整数 $h$，任意阶数 $l$，有 $\gamma_l(t) = \gamma_l(t + h)$，即 $t$
    时点 $l$ 阶自协方差 $\gamma_l(t)$ 与 $t + h$ 时点 $l$ 阶自协方差 $\gamma_l(t + h)$ 相等，换句话说，$l$
    阶自协方差 $\gamma_l(t)$ 的大小不随 $t$ 值变动，只与 $l$ 的取值有关。则称 $\{X_t\}$ 为弱平稳时间序列，也称宽平稳或二阶平稳。在第三个条件中，当
    $l = 0$ 时可以得到：弱平稳时间序列的方差不随时间的改变而改变。弱平稳性的三个条件与强平稳性相比，更具有实用性，因此通常我们谈到时间序列的平稳性时，一般都是指弱平稳性。


    如图 23.3 和图 23.4 所示，2009—2015 年上证综指指数收益率序列看起来是平稳的，而 2009—2015 年上证综指收盘指数序列则是非平稳的。我们会在后文学习如何判断时间序列是否平稳。


    ![](img/0de14a685304f8aa267f6492145864ac_350_0.png)


    ![](img/0de14a685304f8aa267f6492145864ac_350_1.png)


    图 23.3 2009—2015 年上证综指指数收益率序列（平稳）


    图 23.4 2009—2015 年上证综指收盘指数序列（非平稳）


    # 23.2.3 强平稳与弱平稳的区别


    强平稳与弱平稳这两种平稳过程并没有包含关系，即弱平稳不一定是强平稳，强平稳也不一定是弱平稳。一方面，虽然强平稳的要求比弱平稳更要严格一些，但强平稳并不一定是弱平稳，因为强平稳的时间序列的矩不一定存在。例如，柯西分布不存在一、二阶矩，所以服从柯西分布的强平稳时间序列就不是弱平稳时间序列。另一方面，弱平稳不一定是强平稳，因为二阶矩性质并不能确定分布的性质。但是有一个特例：服从正态分布的时间'
