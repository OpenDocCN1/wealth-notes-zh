  md: '18.5.3 风险价值


    用风险价值（Value at Risk, VaR）度量风险最早由摩根大通公司（J. P. Morgan）在 1994 年通过网络公开发表。该方法传播开以后很快得到了金融机构和学术界的认同，并被广泛采用。根据
    Jorion（2005）^{1} 的定义：“VaR 是给定的置信水平和目标时段下预期的最大损失（或最坏情况下的损失）”。换句话说，在市场正常波动的条件下、在一定概率水平
    \alpha\% 下，某一金融资产或金融资产组合的 VaR(\alpha, \Delta t) 是在未来特定的一段时间 \Delta t 内的最大可能损失，可用数学公式表达为：


    $$\operatorname{Pr}\left\{X_{t}<-\operatorname{VaR}(\alpha, \Delta t)\right\}=\alpha\%$$


    其中随机变量 $X_{t}$ 为金融资产或金融资产组合在风险估计期间 \Delta t 内的价值变动量（取负值为损失，取正值为收益），$1-\alpha\%$
    为置信水平。举个例子，若只考虑一天的波动情况且置信水平为 $95\%$，某金融机构计算出它持有的某一投资组合的 VaR 为 $X$，这就意味着该机构有 $95\%$
    的把握相信它所持有的这份投资组合在未来一天的最大损失金额不会超过 $X$。从 VaR 定义中我们可以看出，有两个重要的参数可以影响到 VaR 值的大小：投资组合的评估期
    \Delta t 及置信水平 $1-\alpha\%$。通常，投资者会根据资产的特性和自己对风险的承受水平自行决定这两个参数。


    VaR 的估算关键在描述投资组合在评估期间收益的概率分布，估算 VaR 常见的方法有三种：历史模拟法（Historical Simulation Approach）、协方差矩阵法（Variance-Covariance
    Approach）、和蒙特卡罗模拟法（Monte Carlo Simulation Approach）。


    历史模拟法以历史数据为依据来预测将来，即借助过去一段时间内的投资组合收益频数分布，找到在既定置信水平 $1-\alpha\%$ 下的最低收益率，将这个最低收益率作为
    VaR 估算值。该方法本质是将未来收益的分布用历史分布来替代，因此该方法简单方便，不需要对收益的分布做出假设，也不用对资产收益的波动性、相关性与等数进行分析估计。不过该方法的优点也带来了它的缺点，该方法假定风险因子的未来变动与历史情况完全一致，投资组合收益的概率密度函数不随时间变化，这与实际金融市场的情况并不一致。如果某些风险因子并未在历史上出现过或发生的天数太少，历史模拟法的结果可能就不具有代表性，容易造成误差。比如
    2000 年前后在美国市场上发生的“互联网泡沫”，由于互联网属于新兴科技，在历史上出现的时间比较短，金融市场并没遭遇过这样的泡沫，若要拿以前的数据来预测未来，结果可能会损失惨重。历史模拟法需要的样本数据一般不能少于
    1500 个，若数据太少可能会遗失重要信息，导致 VaR 估计的波动性和不精确性；不过如果数据太多、时间太久了，则在预测未来上没有说服力。


    协方差矩阵法在估算 VaR 时用的也是历史数据，该方法假设各资产的收益率服从正态分布且投资组合的收益率与各资产的收益率呈线性关系，这样投资组合的收益率也服从正态分布。然后用历史数据计算出各收益率的均值、方差以及协方差矩阵，以此根据估计出投资组合的均值及方差，就得到了投资组合的收益分布。如果投资者的初始财富为
    $W$，持有的投资组合之收益率为 $R$，$R$ 的均值为 \mu，标准差为 \sigma，在正态分布的假设下，投资组


    ^{1} Jorion, Philippe (2005), Financial Risk Manager Handbook, 3rd edition, Wiley.


