    # 30.3 指数加权移动平均


    # 30.3.1 指数加权移动平均数


    实际上，指数加权移动平均数相当于一种特别的加权移动平均。在此仍以 5 日指数移动平均为例。我们先给定一个权重值，比如 0.2。由加权移动平均的定义可知，我们无法得到前
    4 期的 5 日加权移动平均数，而只能得到从 5 期开始的平均数。假设第 5 期的 5 日加权移动平均数为 56.00，第 6 天的股票价格为 67.00，第
    7 天的股价为 60.00。如果我们在计算第 6 期的加权移动平均数时，将第 5 期的加权移动平均数与第 6 期的股价作为加权的变数，将 0.8 和 0.2
    作为二者的权重值，则第 6 期的加权移动平均数为 $0.8 \times 56.00 + 0.2 \times 67.00 = 58.20$。运用同样的方法，第
    7 天的加权平均数为 $0.8 \times 58.20 + 0.2 \times 60.00 = 58.56$，如表 30.1 所示。


    表 30.1 EWMA 计算表


    | 日期 | 股价 | 权重 | EWMA |

    | :--- | :--- | :--- | :--- |

    | 5 |  | 0.2 | 56.00 |

    | 6 | 67.00 | 0.2 | $0.8 \times 56.00 + 0.2 \times 67.00 = 58.20$ |

    | 7 | 60.00 | 0.2 | $0.8 \times 58.20 + 0.2 \times 60.00 = 58.56$ |


    将上述计算方法一般化，假设 $p_t$ 表示股票第 $t$ 期的价格，我们从第 $k$ 期开始计算股价的加权移动平均数，且第 $k$ 期的平均数计算非常简单，比如用前
    $k$ 期的股价之简单平均数求得，即：


    ```

    EWMA_{t=k} = \frac{p_1 + p_2 + \cdots + p_k}{k}

    ```


    从第 $k+1$ 期开始，每一期的移动平均数为当期股价与上一期移动平均数之加权平均，权重分别为 $\alpha$ 和 $1-\alpha$，即：


    ```

    EWMA_{t=k+1} = p_{k+1} \times \alpha + EWMA_{t=k} \times (1-\alpha)

    ```


    第 $k+2$ 期指数加权移动平均数为：


    ```

    EWMA_{t=k+2} = p_{k+2} \times \alpha + EWMA_{t=k+1} \times (1-\alpha)

    ```'
