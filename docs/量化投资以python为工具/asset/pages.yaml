  md: '经常使用 CAPM 模型来作为融资成本的参考。在金融界著名的特许金融分析师（Chartered Financial Analyst, CFA）考试中，CAPM
    模型是必考的内容。综上所述，CAPM 模型在其首次被提出后的 50 年里，理论发展和实务应用都没有退出历史的浪潮。接下来，我们重点介绍投资界中 CAPM 模型的应用。


    CAPM 模型公式个股与大盘指数的收益率都是期望值，Jensen（1968）²在研究共同基金表现时将 CAPM 模型写成如下形式：


    ```

    $R_{it} - R_{ft} = \alpha_{i} + \beta_{i}(R_{mt} - R_{ft}) + \varepsilon_{it}
    \qquad (20.3)$

    ```


    进行实证分析，$R_{it}$、$R_{ft}$、$R_{mt}$ 对应的是个股 $i$、无风险资产（通常用银行存款、国债）、市场指数（大盘指数）的收益率之时间序列资料，对这些资料进行线性回归分析，得到未知参数
    $\alpha_{i}$ 和 $\beta_{i}$ 的估计值 $\hat{\alpha}_{i}$ 和 $\hat{\beta}_{i}$。式（20.3）中的
    $\alpha$ 是由 Jensen 引入的，所以又被称为 Jensen’s Alpha。根据 CAPM 模型之假设，$R_{it}$ 是服从正态分布的随机数，这样就可以判断
    $\hat{\alpha}_{i}$ 与 $\hat{\beta}_{i}$ 之统计显著性。$\hat{\beta}_{i}$ 可以解释个股过去的收益率与风险之间的关系。从
    CAPM 模型来看，所有资产的 $\hat{\alpha}$ 都应该是 0（或者是不显著地异于 0），若 $\hat{\alpha}$ 显著异于 0，则称个股
    $i$ 有异常收益（Abnormal Return），Alpha 值代表收益率胜过大盘的部分，常常用来衡量基金经理人的绩效。现在所有的投资者在做的事情可以用一句话归纳总结：试图利用各种分析方法创造显著的正
    Alpha。这些分析方法大致上可以分为：基本面分析、消息面分析、技术面分析、Alpha 策略。


    +   基本面分析就是通过研究公司的财务状况来判断公司的价值，可以从三个层面进行研究：经济环境分析、产业分析、公司分析，比如研究国际、国内的经济发展状况，产业的周期及竞争状况，公司的财务报表及内部运作情况等。运用基本面分析的投资策略很简单，买入被低估的股票，卖出被高估的股票，通常基本面分析结果比较适合作为中长期投资参考，基本面投资获得超额收益的诀窍在于比市场更早地发现被低估或者被高估的股票，在股价上涨之前买入，然后在股价上涨后卖出以获取利润。


    +   技术面分析的基本信仰是“历史会重演”，只分析市场价格行为（股价走势、成交量、主力资金等），由此来判断股价的走势。由于技术面分析缺少理论上的支持而备受争议，比如著名的投资大师巴菲特曾说过：“当我把图表上下颠倒却得不出一个不同的答案后，我知道技术分析不会有用”。尽管如此，技术面分析也不乏传奇人物，比如20
    世纪技术面分析大师威廉·江恩（William Delbert Gann）在投资市场纵横 45 年，经历了第一次世界大战、1929 年美国股市大崩溃、30 年代大萧条、第二次世界大战，在这样动荡的年代中，他赚取了
    5000 多万美元利润，相当于现在的 5 亿多美元。


    +   消息面分析是关注市场上的各种消息，包括宏观政策、行业政策、公司财务、经营状...'
