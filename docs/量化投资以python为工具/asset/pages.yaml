- pgno: 336
  md: '# 第22章 时间序列基本概念


    # 22.1 认识时间序列


    在实际的金融数据分析中最常见的数据类型有三类，即横截面数据（Cross Section Data）、时间序列数据（Time Series Data）、面板数据（Panel
    Data）。


    +   横截面数据描述的是不同个体在同一时间的属性或特征变量，比如从不同公司在同一时间发布的财务报表中，我们可以得到同一年度这些公司的净收益（Net Income）。


    +   时间序列数据记录的是同一个个体的某个特征随着时间的推移不断发展的过程，比如每天的存款利率、股票的日收盘价、公司每年发放的股利等。


    +   面板数据刻画的是不同个体的某个特征随着时间的推移各自变化的经过，比如所有上市公司股票的日收益率、所有公司的年销售额（Total Sales）等。


    在金融市场中，我们面对的很多数据都是时间序列数据。举一个简单的例子，将上证指每天的收盘指数按照时间先后顺序汇总在一起就构成一组时间序列数据，如果将这组数据的时间设为横坐标、对应的收盘指数设为纵坐标，即可得到一张描述上证综指随时间变动的图，这样的图一般被称为时间序列图（简称时序图）。如图
    22.1 所示，描述的是 2014 年 1 月 2 日到 2015 年 4 月 14 日期间上证综指每天收盘指数随时间的变动情况。


    ![](img/0de14a685304f8aa267f6492145864ac_336_0.png)


    图 22.1 上证综指收盘指数时序图'
  merge: -1
  img_proc: true
- pgno: 337
  md: '随着计算机技术的发展及普及，储存和获取资料变得越来越容易，投资人面对的数据也越来越多，而且许多数据都以时间序列的形式出现，比如记录宏观层面整个经济体的数据：如每年GDP成长率、每月CPI指数等；揭露中观层面行业发展状况的数据，如整个行业每年的总体销售额、消费者数量等；描述微观层面个体特征的数据，如公司每年的销售额、净利用，基金公司每年的表现等。作为投资人，与财富最直接相关的是资产价格序列，当我们观察这些不断变动的价格序列时，可能会有一些疑问，比如资产价格的波动是否存在一定的规律，是否可以抓住这些规律并从中获利等。如果我们关注资产价格的波动幅度时，会发现不同的时间段价格的波动幅度并不相同，在某些时间段里价格可能会有剧烈波动，而另一些时间则运行比较平稳。价格波动的幅度与风险息息相关，那么我们能否捕捉到价格波动幅度的变化规律来更好地进行风险控制？当面对多个资产的价格序列时，可能会好奇这些价格序列之间是否存在某些关系，又能否发现它们之间的关联并用于交易。作为敏锐的投资人，在面对时间序列数据时提出以上问题是自然的且具有代表性的。


    时间序列数据从本质上看，是用量化的方式描述个体特征的历史记录。法国文豪雨果曾给“历史”这个词做了一个定义：“What is history? An echo
    of the past in the future; a reflex from the future on the past.”（什么是历史？历史是过去传到未来的回声，是未来对过去的反映。）英国哲学家弗兰西斯·培根曾说过：“读史可以明智。”这些说明历史与未来是紧密相连的，借鉴历史可以帮助人做出明智选择。时间序列分析的本质就是量化地分析历史、预测未来，以指导分析者做出更好的判断和决策。总的来说，时间序列分析的主要任务就是通过观察和分析，找到数据序列中的规律以预测未来。一般来讲，时间序列分析涉及以下几个主要内容。


    +   - 数据序列有哪些基本特征？

    - 数据序列是否有规律可循？

    - 如果序列存在某种规律，我们如何通过统计模型找到并描述这种规律？

    - 多个时间序列之间是否存在某种关联？如何刻画这种关联？

    - 如何利用历史数据表现出来的规律对未来进行预测？


    在进行时间序列数据分析之前，我们加深理解一下时间序列的定义。通常我们把按照某一顺序排列起来的一组随机变量叫作随机序列（Random Sequence），如果随机变量依据时间排序，则称这组依照时间排序的随机序列为时间序列。亦即，按时间顺序排列的一组随机变量称为时间序列，可以用数学符号表达为：$X_{1}$，$X_{2}$，…，$X_{t}$，…。按照时间顺序把随机变量的实现值记录下来就构成了一个时间序列，时间序列是随机序列的实现值序列，可以记录为：$x_{1}$，$x_{2}$，…，$x_{t}$，…。时间序列和时间序列的实现值看上去相似，但有着本质的区别。比如，$X_{1}$是一个随机变量，它的取值是随机的、可能取1、也可能取100；而$x_{1}$是一个数值，它是$X_{1}$的一个实现值。通常我们面对的数据都是时间序列的实现值，之后不再加以强调。'
