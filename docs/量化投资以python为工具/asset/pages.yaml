    5 月 8 日。5 月 7 日，万科 A 收盘价为 7.87 元，因此，其除息价格为：


    $$ 7.87-0.3895=7.4805 \text{ （元）} $$


    而万科 A 在 5 月 8 日的开盘价也调整为 7.48 元。


    （b） 除权价：


    送红股后的除权价 $=$ 股票登记日的收盘价 $\div(1+$ 每股送红股数或转增股数 $)$


    比如 2011 年 9 月庞大集团 (601258) 决议每股转增 1.5 股、相应的股权登记日为 10 月 11 日、除权除息日为 10 月 12 日、送转股上市日为
    10 月 13 日。10 月 11 日当天，庞大集团收盘价为 27.42 元，因此，其除权价格为：


