    则：


    $$ \begin{aligned} \log \left(P _ { t } ^ { X }\right) - \log \left(P _ { t -
    1 } ^ { X }\right) & = \log \left(\frac { P _ { t } ^ { X } } { P _ { t - 1 }
    ^ { X } }\right) \\ & = \log \left(1 + r _ { t } ^ { X }\right) \\ & \approx r
    _ { t } ^ { X } \end{aligned} $$


    即 X 股票的简单单期收益率序列 $\left\{ r _ { t } ^ { X } \right\}$ 是平稳的。


    要判断两只股票的历史价格是否具有协整关系，需要先检验两只股票的对数价格序列是否是一阶单整序列，或者说先检验两只股票的收益率序列 $\left\{ r _ {
    t } \right\}$ 是否是平稳性时间序列。


    接下来，我们分别对中国银行和浦发银行对数价格数据进行一阶单整检验。arch包的ADF() 函数可以使用 ADF 单位根方法对序列的平稳性进行检验，ADF 单位根检验的原假设是“序列存在单位根”，如果我们不能拒绝原假设，则说明我们检查的序列可能存在单位根，序列是非平稳的；如果我们拒绝原假设，则序列不存在单位根，即序列是平稳性时间序列。


    ```

    ```python

