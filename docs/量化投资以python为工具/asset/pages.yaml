    \n# 11.2 DataFrame 类型数据\n\nDataFrame 极大地简化了数据分析过程中一些烦琐操作，它是一个表格型的数据结构，每一列代表一个变量，而每一行则是一条记录。简答地说，DataFrame\
    \ 是共享同一个 index 的 Series 的集合。\n\n# 11.2.1 创建 DataFrame 对象\n\nDataFrame 对象的创建方法与\
    \ Series 对象类似，只不过可以同时接受多条一维的列表，每个列表都会成为单独的一列。在创建 DataFrame 对象之前，要先创建一个索引。索引是一个\
    \ DataFrame 对象必须有的元素，起到标识的作用。\n\n```\nIn [1]: import pandas as pd\n....: import\
    \ numpy as np\n....:\n```\n\n```\nIn [2]: dates = ['2016-01-01', '2016-01-02',\
