    # ### 19.4 Black-Litterman 模型


    前文我们提到投资人做资产配置的前提是对未来形成预期（也就是已知未来各资产 $R_{1}, R_{2}, \cdots, R_{N}$ 的概率分布），然后利用
    Markowitz 模型求得最优资产配比。Markowitz 模型输入参数包括历史数据法和情景分析法两种方法。情景分析法的缺点是主观因素、随意性太强，因此在实务上，绝大多数人用各资产的历史收益率资料来替代未来的预期收益率资料。整个资产配置过程基本上与
    Python 实现的流程类似：先获取各资产的历史收益率，根据历史资料得到各资产的收益率均值和方差协方差矩阵，作为 Markowitz 模型的输入变量，最后得出最优资产配置比。整个过程仔细琢磨起来显然有不足之处：基于历史资料进行计算的基础是，我们相信未来各资产的收益率分布与过去相同，但是在现实中，过去收'
