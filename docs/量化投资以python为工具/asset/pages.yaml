  md: '# 第21章 Fama-French三因子模型


    # 21.1 Fama-French三因子模型的基本思想


    自提出CAPM模型以后，不断有学者对其进行实证验证和应用。有证据表明，市场风险溢酬因子不能充分解释个别风险资产的收益率，因此学者们不断探寻影响资产定价的其他因子。Banz(1981)指出公司股票的市值（Market
    Equity，股票价格×在外流通股数）会影响到股票的收益率，投资市值小的公司之绩效表现优于投资市值大的公司。Banz把市值与股票收益率相关的现象称为规模效应（Size
    Effect）。Basu(1977)发现低本益比（Price to Earnings Ratio，P/E Ratio）的股票之收益率会有比较高的Alpha值；他在1983年综合考虑规模效应之后，依旧发现投资低本益比的股票回报更高。Bhandari(1988)在考虑了市场风险和规模效应之后，发现杠杆比例（Leverage）高的公司收益率较大。也有许多学者发现股票的收益率与股票的账面市值比（Book
    to Market Equity Ratio，B/M Ratio）有关，高B/M Ratio的股票会得到更高的报酬，学者们将这种现象称为价值效应（Value
    Effect）。从这些实证结果来看，CAPM模型并不足以充分解释资产的收益率，而且有很多因子看起来都可以用在资产定价模型里。


    Fama和French于1992年和1993年对美国股票市场中股票收益率的决定因素进行了全面性的研究分析，他们发现单独使用Beta或者分别与市值、P/E比、杠杆比例、B/M比结合在一起解释股票收益率时，Beta的解释能力很弱。而市值、P/E比、杠杆比例、B/M比各因子单独用来解释收益率时，每个因子的解释能力都很强，当把这些因子组合起来时，市值、B/M比会弱化杠杆比例和P/E比的解释能力。因此，Fama和French从可以解释股票收益率的众多因素中
    extracting 出3个重要的影响因子，即市场风险溢酬因子、市值


    +   1 Banz, Rolf W. "The relationship between return and market value of common
    stocks." Journal of financial economics 9.1 (1981): 3-18.


    2 Basu, Sanjoy. "Investment performance of common stocks in relation to their
    price-earnings ratios: A test of the efficient market hypothesis." The journal
    of finance 32.3 (1977): 663-682.


    3 Basu, Sanjoy. "The relationship between earnings'' yield, market value and return
    for NYSE common stocks: Further evidence" Journal of financial economics 12.1
    (1983): 129-156.


    4 Bhandari, Laxmi Chand. "Debt/equity ratio and expected common stock returns:
    Empirical evidence" Journal of finance (1988): 507-528.


    5比如（1）Statmann, Dennis. "Book values and stock returns." The Chicago MBA: A Journal
    of Selected Papers 4, 25-45. （2）Rosenberg, Barr, Kenneth Reid, and Ronald Lanstein.
    "Persuasive evidence of market inefficiency." The Journal of Portfolio Management
    11.3 (1985): 9-16. （3）Chan, Louis KC, Yasushi Hamoe, and Josef Lakonishok. "Fundamentals
    and stock returns in Japan" The Journal of Finance 46.5 (1991): 1739-1764.


    6计算：B/M Ratio = 股票的账面价值/市场价值。是市净率（Price to Book Ratio，P/B Ratio的倒数）


    7 Fama, Eugene F., and Kenneth R. French. "The cross-section of expected stock
    returns" the Journal of Finance 47.2 (1992): 427-465.


