    # 14.5 其他连续分布


    # 14.5.1 卡方分布


    若$Z_{1}, Z_{2}, \cdots, Z_{n}$为$n$个互相独立的服从标准正态分布之随机变量，则变量：


    $$X=Z_{1}^{2}+Z_{2}^{2}+\cdots+Z_{n}^{2}$$


    服从自由度（Degree of Freedom）为$n$的卡方分布，通常表示为$X\sim\chi^{2}(n)$，这里自由度表示$X$是由几个可以自由变动的标准正态随机变量之平方构成。由于$n$可以取不同的值，所以卡方分布是一族分布而不是一个单独的分布。根据变量$X$之表达式，服从卡方分布之随机变量的值不可能取负值，其期望值为$n$、方差为$2n$，有兴趣的读者可以自行验证。


    ```

    ```python

    In [11]: from scipy import stats

    ....: import matplotlib.pyplot as plt

    ....: import numpy as np

    ....:

    In [21]: plt.plot(np.arange(0,5,0.002),

    ....:             stats.chi2.pdf(np.arange(0,5,0.002),3))

    ....: plt.title(''Probability Density Plot of Chi-Square Distribution'')

    Out[21]: <matplotlib.text.Text at 0x2435989a198>

    ```

    ```


    卡方分布与正态分布形状很不同，卡方分布以0为起点，分布是偏斜的，即非对称的，在自由度为3的卡方分布下，大多数值都小于8，通过查表也可知，只有5%的值大于7.82，换句话说，如果有100个观测值，只有5个值会大于7.82。如图14.3所示。


    # 14.5.2 $t$分布


    若随机变量$Z\sim N(0, 1)$、$Y\sim\chi^{2}(n)$，且二者之间相互独立，则变量$X=\frac{Z}{\sqrt{Y/n}}$服从自由度为$n$的$t$分布，可以表达为$X\sim
    t(n)$。和卡方分布一样，$t$分布也有整整一族，自由度$n$不同$t$分布即不同。$t$分布变量取值范围为$(-\infty, +\infty)$，其期望值和方差存在与否、取'
