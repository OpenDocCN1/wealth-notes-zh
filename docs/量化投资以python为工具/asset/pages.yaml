  md: '# # 第23章 时间序列的基本性质


    古希腊历史学家修昔底德曾这样说过：“历史会重演”。在投资界，历史也总是一再重演，举几个例子我们便可以看出一成不变。1630年左右荷兰发生了著名的“郁金香泡沫”事件，当时由奥斯曼土耳其引进的郁金香球根供需不平衡，这种现象引起了投资者的注意，他们开始囤积郁金香球根以期价格提高，投资者的行为吸引了普通大众的抢购，最终导致郁金香球根价格疯狂飚高，到1637年时，一株郁金香居然可以换得一栋豪宅，然而在泡沫化过后，郁金香价格仅剩下高峰时的百分之一，许多人家财尽失。类似的事情在1711年又发生在英国，当时英国有一家南海公司成立，这家公司表面上经营英国与南美洲等地贸易，实际上做的是协助政府融资的业务，后来南海虚报其业务前景，其股票大受追捧，股价从1720年年初约120英镑急升至同年7月的1000英镑以上，全民疯狂炒股，这种现象导致很多“泡沫公司”散布虚假消息浑水摸鱼，之后英国国会在6月颁布法令规管这些不法公司，全民炒股热潮随之减退，南海公司股价也应挫下跌，至9月暴跌到190英镑以下的水平，很多人（包括科学家牛顿）血本无归。近300年过去之后，泡沫经济这样极端的事件依旧发生着，比如20世纪80年代日本经历的泡沫经济，2000年前后美国发生的互联网泡沫。


    历史以重现与过去相似场景的方式不断重演，因此我们才能够鉴往知来。我们进行时间序列分析也是基于同样的思想，我们假设要分析的对象从过去到未来，都维持了相同的特性，所以我们才能够根据过去的规律来预测未来。在章中，我们将详细介绍时间序列数据的一些性质，并依据这些性质来判断要研究的时间序列是否有维持不变的特性。


    # ## 23.1 自相关性


    相关性一般是指两个变量之间是否具有某种关联，自相关性则指一个时间序列的两个不同时间点的变量是否相关联。时间序列具有自相关性是我们能够进行分析的前提，若时间序列的自相关性为0，也就是说各时间点的变量不相互关联，那么未来与现在和过去就没有联系，也就是说，根据过去推测未来毫无根据和意义。


    时间序列的自相关性一般用时间序列的自协方差函数（Autocovariance Function）、自相关系数函数（Autocorrelation Coefficient
    Function，ACF）和偏自相关系数函数（Partial Autocorrelation Coefficient Function，PACF）等统计量来体现。序列的自相关性常常用来解释经济金融系统中经济行为在时间上的惯性，比如在经济高涨时期，较高的经济增长率会持续一段时间，而在经济衰退期，较高的失业率也会持续一段时间；也可以用来解释经'
