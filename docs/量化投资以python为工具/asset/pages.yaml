  md: '# ## 14.5 其他连续分布


    ![](img/0de14a685304f8aa267f6492145864ac_218_0.png)


    值大小均与 $t$ 分布之自由度 $n$ 有关：$t(1)$ 分布无有无限期望值；$t(2)$ 分布有有限期望值，但方差不存在；只有当 $n > 2$ 时，$t(n)$
    分布才同时有有限的期望值和方差，其中期望值为0、方差为 $n / (n - 2)$，因此自由度 $n$ 越大，变量的方差越小，也就是说分布的离散程度越小。


    下面使用 Python 绘制不同自由度下的 $t$ 分布之概率分布函数，以了解 $t$ 分布的形态特征，并绘制出 $t$ 分布和正态分布的比较图。


