- pgno: 200
  md: '统计频数、绘制频数分布表；也可以通过计算一些指标对数据进行总结（Summarization），这些指标包括平均数、中位数等；对已知数据信息进行整理、归类、简化或绘制成图表等来呈现数据特征，是描述性统计分析的主要内容。


    对于某一特定事物，其所有可能发生的结果形成的集合称之为总体（Population），而其中一部分可观察到的结果则形成样本（Sample）。比如要想知道全校学生身高的均值，通常做法为，随机抽取一部分学生
    ${ }^{1}$ ，测量这部分学生的身高，然后用这部分学生身高的均值来代表全校学生身高的均值。在这个例子中，我们要研究的变量就是学生的身高，而全校学生的身高数据是总体，我们抽取的学生身高数据则是样本。通过分析有限样本数据来推测总体的特征是推断统计主要解决的问题，也是整个统计分析的精髓所在。本章我们先来了解一下数据类型及如何描述样本数据特征。


    # 13.1 数据类型


    在学习描述性统计之前，我们需要先了解一下数据的分类。对于不同类型的数据，往往会使用不同的方法以将其更好地展示出来。


    总的来说，可以将数据分成两类：定性数据（Qualitative Data）和定量数据（Quantitative Data）。


    +   - 定性数据是对事物性质进行描述的数据，通常只具有有限个取值，往往用于描述类别。比如股票所属行业数据即为定性数据，工商银行和浦发银行属于银行业、中国联通属于电信业务。


    +   - 定量数据是呈现事物数量特征的数据，是由不同数字组成的，数字取值是可以比较大小的，比如各只股票收益率数据即是定量数据，我们可以比较同一时间哪只股票的收益率较高，也可以比较同一只股票何时收益较高。


    # 13.2 图表


    若要直观地了解样本数据的整体情况，可以对数据进行图像化处理，将其变为图表以方便分析者对数据进行整体判断。图表描述通常会使用的工具是频数分布表与图示法，如直方图、饼图、折线图、散点图等。这里我们介绍最常用的频数分布表和直方图。


    # 13.2.1 频数分布表


    幼儿时代初识数字，我们第一个可以做的动作就是“计数”（Count）。当观察到样本数据时，也可以先做这个简单的动作。若是遇到一组定量数据，可以先将资料从小到大排序，这样就可以比较快地计算出每一个数值发生的次数，即频数（Frequency），若是将每一个数值发生的次数除以样本总数量，即可得到频率（Relative
    Frequency）。将这些频数（频


    > 1 实际上，抽样的方法是统计学中一个很重要的课题，因为样本的质量很大程度决定了推断统计结果的好坏。统计学家们研究出了各种各样的抽样方法，以最大程度保证抽取出的样本可以充分地包含总体的信息。常见的抽样方法有简单随机抽样（Simple
    Random Sampling）、系统抽样（Systematic Sampling）、分层抽样（Stratified Sampling）等。'
