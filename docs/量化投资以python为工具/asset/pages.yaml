    前面介绍过，元组（tuple）数据也属于序列类型数据，但其具有不可变的性质。内置函数 tuple( ) 用于创建一个元组对象。比如：


    ```

    ```In [1]: tu1=tuple( (123,45,6,7,8,''python'') )

    In [2]: type(tu1)

    Out[2]: tuple

    In [3]: tu1

    Out[3]: (123, 45, 6, 7, 8, ''python'')```

    ```


    当然，元组对象还可以通过逗号“ ,”或者小括号“（）”来创建。


    ```

    ```In [4]: tu2=123,6,7,8,''python''

    In [5]: type(tu2)

    Out[5]: tuple

    In [6]: tu3=(3,4,5,"python")

    In [7]: type(tu3)

    Out[7]: tuple

    # 创设只有1个元素的元组时，元元素后面加逗号，以免歧义

    In [8]: tu4=(2,)

    In [9]: type(tu4)

    Out[9]: tuple```

    ```


    如果想要把列表类型的数据更改成元组数据，也可以通过 tuple( ) 函数来实现。


    ```

    ```In [11]: a=[34,78.9,True,''python'',''finance'']

