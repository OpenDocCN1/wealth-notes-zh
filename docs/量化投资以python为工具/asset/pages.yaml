  md: '纯是昨天对今天的直接影响，也包含了更早之前所有各期的信息对今天的间接影响，衡量的是前面所有期加总的影响效果。为了衡量过去单期对现在的影响效果，剔除其他期的作用，我们引入偏自相关系数（Partial
    Autocorrelation Coefficient）。变量$X_t$的$l$阶偏自相关系数$\rho_{ll}$是$X_k$与$X_{k-l}$的条件自相关系数，即：


    ```

    $\rho_{ll} = \text{Corr}(X_k, X_{k-l} | X_{k-1}, X_{k-2}, ..., X_{k-l+1})$

    ```


    它的计算方式比较复杂，在这里仅介绍期观念。在实际应用中，自相关系数和偏自相关系数常用来刻画时间序列自相关性的高低，若相关系数比较大，说明未来、现在与过去的关联性比较强。


    # 23.1.4 acf( ) 函数与 pacf( ) 函数


    在Python中，我们可以分别用statsmodels包中的acf( )和pacf( )这两个函数来计算时间序列的自相关系数和偏自相关系数。acf( )具体的调用形式如下：


    ```

    ```

    acf(x, unbiased=False, nlags=40, qstat=False, fft=False, alpha=None)

    ```

    ```


    +   - x为一个时间序列对象；

    - unbiased的值是一个逻辑值。如果该参数的值为True，Python在计算自相关系数时会 对分母进行调整，使得结果为无偏的估计值；

    - nlags是数值型参数，表示计算自相关系数的最大滞后期数；

    - qstat表示acf( )函数是否会返回Ljung-Box检验的结果，我们会在后面介绍关于Ljung-Box检验的知识；

    - fft是逻辑型参数，默认是False，表明要使用的算法；

    - alpha参数表示计算自相关系数的置信区间所用的置信水平，默认为None，即不计算置信区间。


    pacf( )的用法与acf( )的用法类似：


    ```

    ```

    pacf(x, nlags=40, method=''unbiased'', alpha=None)

    ```

    ```


