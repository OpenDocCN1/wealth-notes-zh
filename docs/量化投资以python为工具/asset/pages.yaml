    In [2]: y=[2,3]\nIn [3]: z=[]\nIn [4]: for i in x:\n\t\t\t\t\t\tfor j in y:\n\t\
    \t\t\t\t\t\t\t\t\tz.append([i,j])\n\t\t\t\t\t\tprint(z)\n\n[[a, 2], ['a', 3],\
