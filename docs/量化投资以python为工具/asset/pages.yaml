    Python 的安装目录文件下，输入指令：


    ```

    pip install IPython

    ```


    即可进行安装。


    +   2. Anaconda 中自动安装 IPython


    如果电脑中已经安装 Anaconda，在安装 Anaconda 的过程中 IPython 也会被安装。以 Windows 系统为例，打开控制台切换到 Anaconda
    的安装目录或者打开 Anaconda Prompt，输入指令：


