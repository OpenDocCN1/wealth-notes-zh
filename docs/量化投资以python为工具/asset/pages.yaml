  md: '# 第14章 随机变量简介


    我们进行统计分析的对象往往呈现不确定性，比如，我们不知道明天大盘是涨是跌、也不会提前确定股票的未来走势，这些不确定性令我们面对未来时不知如何决策。但统计分析是可以帮助人们认清、刻画事物不确定性特征的方法。


    前文提到总体是某一特定事物所有可能发生结果的集合，随机变量 (Random Variable) 则是一个不确定性事件结果的数值函数 (Function)。也就是说，把不确定性事件的结果用数值来表示，即得到随机变量。比如掷硬币有两种结果——正面和反面，如果正面发生时，变量
    X 取值 1，反面取值为 2。这样一来，掷硬币的结果就可以用随机变量的取值来表示，其取值为 1 或 2。通常随机变量用大写字母来表示，如 X；其具体观测值（或实现值）用小写字母表示，如
    x。借用随机变量的概念，可以将总体看作是随机变量所有可能取值的集合。所以统计分析的实质是要用 X 的观测值集合来推断 X 的特征，因此我们先来了解一下如何刻画随机变量
    X。


    根据随机变量可能取值的结果，可将其分为离散型随机变量 (Discrete Random Variable) 和连续型随机变量 (Continuous Random
    Variable)。如果一个随机变量的取值范围为有限或无限可数的孤立点（比如 1, 2, 3, ... 这样的序列），则称此变量为离散型随机变量。相反，如果一个随机变量在一个区间上任意取值，则称此随机变量为连续型随机变量。比如掷硬币的结果只能取
    1 或 2，即只能取有限个点，所以掷硬币的结果是离散型随机变量。而在金融投资分析中，大部分的随机变量如收益率、价格就是连续型随机变量。


    # 14.1 概率与概率分布


    概率 (Probability) 是用来刻画事物不确定性的一种测度 (Measure)，根据概率的大小，我们可以判断不确定性的高低。概率的取值介于 0 和
    1 之间，表明一个特定事件以多大的可能性发生。


    # 14.1.1 离散型随机变量


    假设 X 是一个离散型随机变量，其所有可能取值为集合 \({a_k}\)，k=1,2, ...，我们定义 X 的概率质量函数 (Probability Mass
    Function) 为：


    ```

    $$f_X\left(a_k\right)=\mathbb{P}\left\{X=a_k\right\},\quad k=1,2,\cdots$$

    ```'
  merge: -1
  img_proc: true
- pgno: 209
  md: '借用概率质量函数，可以量化地表达随机变量 $X$ 取每个数值的可能性大小。还可以用累积分布函数（Cumulative Distribution Function）来刻画随机性，该函数表达式为：


    $F_{X}(a) = \mathbb{P}\{X \leqslant a\}$


    对于离散型随机变量，累积分布函数可以用概率质量函数累加来获得：


    $F_{X}(a) = \mathbb{P}\{X \leqslant a\} = \sum_{i:a_i \leqslant a} f_{X}(a_{i})$


    在 Python 中，我们可以通过 NumPy 包的 random 模块中的 choice( ) 生成服从特定的概率质量函数的随机数，其函数形式如下：


    ```

    choice(a, size=None, replace=True, p=None)

    ```


    +   - 参数 a：指明了随机变量所有可能的取值；


    +   - 参数 size：表示我们所要生成的随机数数组的大小；


    +   - 参数 replace：决定了生成随机数时是否是有放回的；


    +   - 参数 p：为一个与 x 等长的向量，指定了每种结果出现的可能性。


    下面，我们使用 choice( ) 生成 100 个随机数。


    ```

    In [1]: import numpy as np

    ....: import pandas as pd

    ....:

    ```


    ```

    In [2]: RandomNumber=np.random.choice([1,2,3,4,5],

    ....:                 size=100, replace=True,

    ....:                 p=[0.1,0.1,0.3,0.3,0.2])

    ```


    ```

    In [3]: pd.Series(RandomNumber).value_counts()

    Out[3]:

    4  33

    3  30

    5  17

    2  12

    1   8

    dtype: int64

    ```


    ```

    In [4]: pd.Series(RandomNumber).value_counts()/100

    Out[4]:

    4  0.33

    3  0.30

    5  0.17

    2  0.12

