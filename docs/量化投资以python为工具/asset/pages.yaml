  md: '# ### 10.4 数组运算


    NumPy 中定义了许多能够对数组中的每个元素都进行操作的 ufunc（全称为 universal function）函数，这些函数对于操作数组数据带来了很大的方便。


    ```

    # 创建一维数组 ar1

    In [60]: ar1=np.array(np.arange(5))

    In [61]: ar1

    Out[61]: array([0, 1, 2, 3, 4])

    # 数组中每个元素都加4

    In [61]: np.add(ar1, 4)

    Out[72]: array([4, 5, 6, 7, 8])

    # 创建一维数组 ar2

    In [62]: ar2=np.array([2,3,4,5,6])

    In [63]: ar2

    Out[63]: array([2, 3, 4, 5, 6])

    # 数组 ar1 和 ar2 相加

    In [64]: ar1+ar2

    Out[64]: array([ 2, 4, 6, 8, 10])

    # 用 numpy 库中的 add 函数做数组的加法

    In [65]: np.add(ar1,ar2)

    Out[65]: array([ 2, 4, 6, 8, 10])

    ```


    如果想要将数组 ar1 和数组 ar2 相加后的结果仍返回给 ar1，则可以将 add() 函数的第三个参数取值设定为 ar1，如下所示：


    ```

    In [73]: np.add(ar1,ar2,ar1)

    Out[73]: array([ 2, 4, 6, 8, 10])

    In [74]: ar1

    Out[74]: array([ 2, 4, 6, 8, 10])

    ```


    在 NumPy 库中，除了加法 add() 函数以外，还有其他一些数据运算函数都属于 ufunc 函数，常用的数据运算函数如表 10.1 所示，其中 $a$
    表示数组，$b$ 表示常数或者与 $a$ 结构相同的数组。如果 $b$ 为常数，则 $a$ 中每一个元素都和常数 $b$ 做运算；如果 $b$ 为与 $a$
    结构相同的数组，则 $a$ 中每一个元素都与 $b$ 中对应位置的元素值进行运算。最后将 $a$ 与 $b$ 进行运算后的返回值传给 $c$。


    ```

    In [32]: a = array( [10,20,30,50,60] )

    In [33]: b = arange( 5 )

    In [34]: b

    Out[34]: array([0, 1, 2, 3, 4])

    In [35]: c = a-b #做差，注意值的个敛要相同

    In [36]: c

    Out[36]: array([10, 19, 28, 47, 56])

    In [37]: b**2 #平方

    ```'
