  md: '# # 第8章 面向对象


    在编写代码时, 我们通常不会毫无规划地逐条执行语句和指令, 而是先有模块化 (Mod- ularization) 抽象设计, 把主要框架和流程描述出来, 再填入相应的细节,
    希冀能使代码最大程度地重复使用, 同时将设计、调试和维护等的复杂度降至最低。模块化设计有诸多技巧, 前文提及的函数即是一例。而本章要介绍的面向对象编程 (Object-Oriented
    Programming) 更是模块化设计的重要方法。


    面向对象这种编程范式 (Programming Paradigm) 认为世界是由各式各样的对象所组成的, 不同的对象之间可以相互作用和通讯。


    一般而言, 我们藉由各种数据信息去刻画描述一个对象。例如, 若把某一只股票视为一个对象, 那么这个股票对象包含的信息可能有股票代码、公司名、所属行业, 现在的成交价等。这些用以描述对象特征的数据信息称为该对象的属性
    (Attribute); 而存取属性的函数则称为方法 (Method), 是该对象与外界沟通的接口。具有相同属性与方法的对象 ${ ^ 1 }$ , 构成了一个类别
    (Class)。换言之, 类 (Class) 是一种将对象抽象化而形成的概念, 而对象则是类具体实现的例子 (实例, Instance)。比如, 股票 A
    是股票这个抽象概念的一个实例, 股票 B 则是另一个实例。这种“以对象为基础”的编程思想, 起源于 20 世纪 60 年代的 Simula 语言, 并逐渐在各种语言的实现上发展出三大特征:
    即封装、继承和多态。我们在下文逐一简要介绍 Python 对面向对象的支持。


    # ## 8.1 类


    如前所述, 类是具相同属性与方法的对象集合。Python 定义类的语法如下:


    ```

    class className:

    ```


    ```

    class className(base object):    Statements

    ```


    class 后面跟的 className 是类的名称, 小括号里的 base object 表示现在定义的类继承自哪一类。如果没有明显继承自哪一类, 则填
    object, object 是所有类继承的源头。例如, 我们可以定义一个金融资产的类:


    ```

    In [1]: class Asset(object):   ...:    pass   ...:

    ```


    1 在 Python 这种动态语言中, 属性与方法可以动态绑定, 故同一类所产生的实例, 未必具有同祥的属性或方法。'
