  md: '济活动的滞后效应，比如人们消费或者投资行为会受到习惯的影响，并不会由于收入增加或减少而立刻调整，而是呈现一定程度的自我相关。


    # ### 23.1.1 自协方差


    随机变量 $X_t$ 在时点 $k$、$k-l$ 取值分别为 $X_k$、$X_{k-l}$，序列的 $l$ 阶自协方差（Autocovariance）是变量
    $X_k$ 与其滞后 $l$ 期的随机变量 $X_{k-l}$ 之间的协方差，由定义可知自协方差本质上仍然是协方差，“自”字只是为了重点突出变量与其自身滞后值的关系。如果
    $X_t$ 在不同时点分别有对应的均值 $\mu_k$，则 $l$ 阶自协方差的数学表达式为：


    ```

    $$\gamma_l = \mathbb{E}\left[\left(X_k - \mu_k\right)\left(X_{k-l} - \mu_{k-l}\right)\right]
    = \text{Cov}\left(X_k, X_{k-l}\right), \quad l = 0, 1, 2, \ldots \tag{23.1}$$

    ```


    当 $l$ 取值不同时可以得到不同 $\gamma_l$，所以 $\gamma_l$ 是时间差 $l$ 的函数，所以公式 (23.1) 被称为自协方差函数，后面的自相关系数函数、偏自相关系数函数也是如此，之后为了方便起见，我们会把这些统计量简称为自协方差、自相关系数、偏自相关系数。当
    $l=0$ 时，公式 (23.1) 退化为 $\gamma_0 = \mathbb{E}\left[\left(X_k - \mu_k\right)^2\right]$，即
    $X_k$ 的方差。


    # ### 23.1.2 自相关系数


    从公式 (23.1) 可以看出，当 $X_t$ 放大 $n$ 倍时，$\gamma_l$ 会放大至 $n^2$ 倍，因此自协差会与变量的度量单位有关系，其大小并不足以说明变量与其滞后项的关联性的大小。与相关系数类似，自相关系数（Autocorrelation
    Coefficient）的引入是为了消除变量的度量单位，更好地刻画关联性的大小。自相关系数由自协方差除以变量的方差而得到，若用 $\rho_l$ 表示 $X_k$
    与滞后 $l$ 期的 $X_{k-l}$ 之间 $l$ 阶自相关系数，则：


    ```

    $$\rho_l = \frac{\text{Cov}\left(X_k, X_{k-l}\right)}{\text{Var}\left(X_k\right)}
    = \frac{\gamma_l}{\gamma_0}$$

    ```


    式中变量的自协方差 $\gamma_l$ 和方差 $\gamma_0$ 的度量单位是相同的，两者比值的度量单位为 1，因此自相关系数不依赖于时间序列 $X_t$
    的度量单位。一般意义的协方差和相关系数，度量的是描述两个不同事物特征的变量之间的相互影响，而自协方差和自相关系数度量的是描述同一事物特征的变量在不同时期取值的相关程度。通俗地说，自协方差和自相关系数刻画的是自己过去的行为对自己现在的影响。


    # ### 23.1.3 偏自相关系数


    假设资产价格 $p_1, p_2, \dots, p_t, \dots$ 的一阶自相关系数 $\rho_1 > 0$，也就是今天的价格 $p_t$ 与昨天的价格
    $p_{t-1}$ 相关，不过 $p_{t-1}$ 又与 $p_{t-2}$ 相关，$p_{t-2}$ 也会受到 $p_{t-3}$ 的影响，所以当我们计算
    $p_t$ 与 $p_{t-1}$ 的自相关系数时，我们捕捉到了 $t-1$ 期信息对 $t$ 期的影响，也考虑了 $t-2$ 期信息透过 $t-1$ 期对
    $t$ 期的影响，以此类推，总的说来，$p_t$ 与 $p_{t-1}$ 的自相关系数刻画的不单'
