  md: "的价格、市场组合同构成反推出市场隐含的均衡收益率（Implied Equilibrium Return Vector）来作为先验预期收益之期望：\n\n\
    $$\\pi = \\lambda \\hat{\\Sigma} \\omega^{m}$$\n\n其中 $\\lambda=\\frac{E\\left[R_{m}\\\
    right]-R_{f}}{\\sigma_{m}^{2}}$ 为市场组合单位风险的超额收益，反应了市场对风险趋避的程度（$R_{m}$ 为市场组合之收益率，$R_{f}$\
    \ 为无风险收益，$\\sigma_{m}^{2}$ 为市场组合收益率之方差），$\\omega^{m}$ 为市场组合各资产的投资比例，$\\hat{\\\
    Sigma}$ 为估计出来的协方差矩阵。还可以根据 CAPM 模型中的 Alpha (历史超额收益率) 来估计 $\\pi$。\n\n+   （3） 融合投资人的个人观点，即确定\
    \ $P 、 q 、 \\Omega$ 。\n\n+   （4） 修正后验收益。\n\n+   （5） 投资组合优化：通过 Black-Litterman\
    \ 模型，我们可以获得后验收益的期望值与协方差矩阵。根据这些信息，我们可以进行资产配置，比如利用 Markowitz 模型进行资产配置。\n\n# Black-Litterman\
    \ 模型之 Python 实现\n\nPython 并未向我们提供实现 Black-Litterman 模型的函数，但是，我们可以自己写函数来实现 Black-Litterman\
    \ 模型。我们以五只股票（白云机场、华夏银行、浙能电力、福建高速和生益科技）作为投资标的物，根据 BL 模型对求解过程做以下设定。\n\n+   （1） 计算出历史收益率之均值\
    \ $\\mu$ 及协方差矩阵 $\\hat{\\Sigma}$；\n\n+   （2） 用历史收益率均值作为先验预期收益之期望值，即 $\\pi=\\mu$；\n\
    \n+   （3） 结合投资者个人的观点（由 $P 、 Q 、 \\Omega$ 代表，其中 $P 、 Q$ 为已知的输入变量， $\\Omega$ 要自己计算）；\n\
    \n+   （4） 根据公式计算出后验分布之期望值、协方差。\n\n现在我们自己定义函数 blacklitterman( ) 来计算后验分布之期望值、协方差，该函数的输入变量有股票的历史收益率（returns），反应主观观点相对于先验信息的比重（tau），以及代表投资人看法的\
    \ $P$ 和 $Q$ 。首先我们以历史收益率均值（mu）和协方差矩阵（sigma）作为先验预期收益之期望值和协方差，然后根据前文的公式计算后验分布之期望值（er）和协方差（posteriorSigma）。\n\
    \n#定义函数\n\n```\nIn [34]: def blacklitterman(returns,tau, P, Q):\n    ...: mu=returns.mean()\n\
    \    ...: sigma=returns.cov()\n    ...: pi=mu\n    ...: ts = tau * sigma\n   \
    \ ...: Omega = np.dot(np.dot(P,ts),P.T) * np.eye(Q.shape[0])\n    ...: middle\
    \ = lambda inv(np.dot(np.dot(P,ts),P.T) + Omega)\n    ...: er = np.expand_dims(pil,axis=0),T\
    \ + np.dot(np.dot(ts,P.T),middle),\n```"
