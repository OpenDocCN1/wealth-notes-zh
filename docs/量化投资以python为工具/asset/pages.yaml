- pgno: 418
  md: '# 第27章 K线图


    # 27.1 K线图简介


    K线图（Candlestick Charts）又被称为“蜡烛图”、“阴阳线”等，它起源于17世纪日本德川幕府时代。18世纪，日本技术分析中的重要人物本间宗久在进行大米期货交易时，记录并研究大米期货的历史价格信息，同时将战争的策略应用于商场上的交易，在这一过程中所发展出来的交易策略逐渐演变成今日技术分析的K线形态哲学。在数百年的洗练与修正的过程中，日本投资者一直将K线图的投资技术奉为圭臬，长期以来，K线一直是投资者进行技术分析必看的内容。19世纪，美国的K线大师Steve
    Nison将K线引进西方，将西方传统的量化技术工具跃升至融合哲学与兵法的崭新视野，引起普遍注意。目前K线分析已成为各式量化工具不可或缺的一环，其重要性可见一般。


    K线图一个重要的特色是以清晰的视觉效果凸显出多空情势，让投资者据此拟定交易决策。K线图主要通过开盘价（Open Price）、最高价（High Price）、最低价（Low
    Price）和收盘价（Close Price）这四个数据值来勾勒交易市场的轮廓，根据这四个数值相对关系的不同，可以绘制成数种不同的单一柱形结构，而不同的柱形结构又各自蕴含独特的市场信息。


    在K线作图的时间选择上，常见的时间跨度有小时、日、周以及月。如图27.1所示是上证综指2015年3月份的日K线图。K线图上会呈现出一个个长短不等、状似蜡烛、红色或绿色柱形图，这些图形也称为蜡烛图。


    如图27.2所示，无论颜色是红色还是绿色，每一个蜡烛图都由“矩形实体（Real Body）”和“垂直线段的影线（Shadow）”两大部分构成。矩形实体的两端分别表示收盘价和开盘价。如果当天的收盘价大于开盘价，则矩形为红色实体，即红色矩形实体的上端表示收盘价，实体下端表示开盘价。同理，如果当天的收盘价低于开盘价，则矩形实体为绿色。实心矩形的上端表示开盘价，实心矩形下端表示收盘价。矩形实体的高度表示收盘价与开盘价的大小差值。


    蜡烛图的影线（Shadow）可以分为上影线（Upper Shadow）和下影线（Lower Shadow）两部分。从矩形实体向上延伸的线表上影线，上影线的上端点表示最高价，上影线的长度代表最高价与收盘价（红色实体）或者开盘价（绿色实体）的差值。下影线指矩形实体向下延伸的那条直线，下影线的下端点表示最低价。下影线的长度表示开盘价（绿色实体）或者收盘价（红色实体）与最低价的差值。


    蜡烛图记录了资产（比如股票）的四种价格，开盘价表示开市时多空双方对于该股票'
  merge: -1
  img_proc: true
