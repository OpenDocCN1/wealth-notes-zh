    我们阐述一些常用的 MACD 交易思想。图 30.10 下方 MACD 图中的实线表示 DIF，虚线表示 DEA 信号线。


    +   1. 当 DIF 和 DEA 都在零刻度线上方时，表明市场可能是多头行情；反之，当 DIF 和 DEA 都在零刻度下方时，表明市场可能处于空头行情。在投资实战中，“零上双金叉”策略广为人们使用。DIF
    和 DEA 都在零刻度线上方，在一段时间内，DIF 先上穿 DEA 线，不久 DIF 下跌到 DEA 线的下方，然后 DIF 又上穿 DEA 线，此时，说明股票价格上升趋势较强，市场处于上涨行情中。

    2. 当 DIF 下穿信号线 DEA 时，释放出买入信号；当 DIF 向上穿过头信号线 DEA 时，释放出卖出信号。在中国银行 2015 年交易行情中，DIF
    几乎都处于 DEA 的上方，两条线相交的次数较少，释放出的买卖信号也较少。在 2015 年 3 月 4 日附近，DIF（实线）从上向下穿越 DEA（虚线），DIF
    和 DEA 的取值都小于 0；观察 K 线图，可以推测市场可能处于下跌行情。在 3 月 9 日附近，两条线都呈现上升趋势，DIF 从下向上穿越 DEA，释放出市场慢慢走强的信号。观察
    K 线图可知，从 3 月 9 日以后，市场大体上处于上升行情中。

    3. MACD 中的柱形图表示 DIF 与 DEA 的差值。柱形图的高低表示 DIF 与 DEA 差值的大小。柱形图在零刻度附近时，释放出买卖信号。柱形图在零刻度线上方，表示
    DIF 大于 DEA，市场走势较强；柱形图在零刻度下方，表示 DIF 小于 DEA，市场走势较弱。

    4. 在投资实战中，柱形图的形态也是投资者关注的一大焦点，MACD 指标的形态分析方法可以套用一般的形态分析理论与方法。MACD 柱形图高低的变化与价格线走势的背离情况也可以被解读为交易信号。


    在一般技术分析中，MACD 指标的分析方式不可悉敌，优化 MACD 的参数也可以衍生出更多的分析方式。以 DIF 与 DEA 线的交叉与背离为例，用 Python
    刻画这一策略的情景并自动捕捉买卖点。


    DIF 与 DEA 线的交叉与背离这一策略的分析过程包括如下 3 个步骤。

    （1）先求出 DIF（差离值，快线）、DEA（信号线，慢线）的值；

    （2）DIF、DEA 均为正，DIF 向上突破 DEA，买入信号；

    （3）DIF、DEA 均为负，DIF 向下跌破 DEA，卖出信号。'
