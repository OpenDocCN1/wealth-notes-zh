  md: '类错误，犯第二类错误的概率记为 $\beta$。


    在假设检验中，这两种错误都难以避免。比如，当我们对一个正态分布的均值进行假设检验时。理论上，由于正态分布取值范围为所有的实数，样本均值可能是任意一个实数。也即是说，不管样本均值是多少，其出现的概率都不为0。这样，如果我们想让
    $\alpha$ 为0，那么我们在任何情况下都不能拒绝原假设。很明显，这样就失去了假设检验的意义。另外一个问题是，我们往往无法同时控制两个错误发生的概率，即犯第一类错误和第二类错误的概率无法同时变小。如果我们想要降低
    $\alpha$，那么我们就需要提高拒绝的条件，使得原假设更不容易被拒绝。但是，这样一来，也使得错误的原假设更不容易被发现，因而提高了 $\beta$。所以，我们通常需要权衡这两种错误，选择一个合适的拒绝条件。一般来说，我们选择控制
    $\alpha$，不限制 $\beta$。


    # ### 15.3.2 显著性水平与 $p$ 值


    为了控制 $\alpha$，我们往往将 $\alpha$ 的值固定，同时使得：


    $$P(拒绝H_0|H_0为真) \le \alpha$$


    在统计学上，我们赋予 $\alpha$ 一个专门的名称，叫显著性水平（Significance Level）。常见的显著性水平有0.1、0.05或0.025。


    为了确定一个事件是不是小概率事件，我们需要求解事件发生的概率。但是，对于连续型变量来说，某个具体取值的概率为0。所以，我们无法直接算出事件发生的概率。为了解决这个问题，我们采取另一种方法。使用这个方法时，我们算出在原假设正确的条件下，和当前样本一样极端或更极端的情况出现的概率。所谓的更极端的情况，指的是样本参数和原假设的偏差，比现在的样本参数和原假设的偏差还要大的情况。比如，原假设总体均值为10，样本的均值为9，样本均值与原假设的差即为-1。那么，更极端的情况就是指均值和10的差大于1或小于-1的样本。而一样的极端则是指样本参数和原假设的偏差与现在的样本参数和原假设的偏差一样的情况。我们把所得到的样本或更极端的情况出现的概率叫作
    $p$ 值（$p$-value）。在上面的例子中，$p$ 值就是得到均值小于等于9或者大于等于11的样本的概率。


    # ### 15.3.3 确定小概率事件


    总的来说，在假设检验中，判断小概率事件的一个基本原则是：当 $p$ 值小于等于 $\alpha$ 时，我们的样本为小概率事件。而对于 $p$ 值与 $\alpha$
    的比较，可以采取两种方法：临界值检验法（Critical Value Approach）和显著性检验法（$p$-value Approach）。


    +   ○ 临界值检验法


    在使用临界值检验法时，首先使用样本数据构建一个用于检验的统计量，这个统计量'
