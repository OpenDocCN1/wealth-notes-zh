- pgno: 542
  md: '# # 第34章 OBV指标交易策略


    # ## 34.1 OBV指标概念


    OBV的英文全称是On Balance Volume，中文为能量潮，是由美国的投资分析家Joe Granville在20世纪60年代所创的一种技术指标，他认为市场的动能应该由成交量的变化情况来反映。成交量可以反映出市场买卖双方的活跃情况，量是价的先行者，价格的变化与成交量有密切关系。OBV指标从量入手对价格的走势做出预测，将成交量指标化，制成趋势线，配合股价趋势线，通过价格的变动及成交量的增减关系来推测股价变动趋势。


    # ## 34.2 OBV指标计算方法


    对于能量潮OBV的指标计算，一般有累积OBV、移动OBV和修正型OBV净额这三种计算方式。


    # ### 累积 OBV


    OBV 主要计算累积成交量，将股价上涨时的成交量进行正累加，股价下跌时的成交量进行负累加。其计算公式为


    $$O B V _ { n } = \pm V _ { n } + O B V _ { n - 1 }$$


    其中，$O B V_{n}$ 和 $O B V_{n-1}$ 分别是本期和前一期的 OBV 值，而 $V_{n}$ 则是当日的成交量。


    +   1. 当本期股价上涨时，$V_{n}$ 的符号为正，$O B V_{n}=O B V_{n-1}+V_{n}$；

    2. 当本期股价下跌时，$V_{n}$ 的符号则为负，$O B V_{n}=O B V_{n-1}-V_{n}$。


    以青岛啤酒股票的交易数据为对象，计算OBV的值。Python代码如下：


    ```

    In [1]: import pandas as pd

    ...: import numpy as np

    ...: import matplotlib.pyplot as plt

    ...


    In [2]: TsingTao=pd.read_csv(''TsingTao.csv'',index_col=''Date'')

    ...: TsingTao.index=pd.to_datetime(TsingTao.index)

    ...: TsingTao.Volume=TsingTao.Volume.replace(0,np.nan)

    ...: TsingTao=TsingTao.dropna()

    ...: close=TsingTao.Close

    ...: Volume=TsingTao.Volume

    #计算OBV

    In [3]: diffClose=close.diff()

    ...: diffClose[0]=0

    ...: OBV=(((diffClose>0)*2-1)*Volume).cumsum()

    ```'
