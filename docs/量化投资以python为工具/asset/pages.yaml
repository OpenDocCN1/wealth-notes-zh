  md: '# # 第19章 投资组合理论及其拓展


    400多年前，西班牙文学大师塞万提斯在其巨作《唐吉诃德》中提出了一个被投资界奉为经典的思想：“智者不会把所有的鸡蛋放在同一个篮子里。”早在《战国策·齐策四》的名篇《冯谖客孟尝君》里，冯谖也提出类似的概念：“狡兔三窟，仅得免其死耳。今有一窟，未得高枕而卧也。”这两句广为流传的话都在强调不要把所有的家当放在同一处，要分散风险。用在投资上，就意味着要把财富分配到不同的资产上，即理财时要进行分散投资。目前在投资领域中，可供投资的金融工具十分丰富，常见的包括银行存款、基金、债券、股票，还有发展比较慢的期货、期权等。大多数人在不知不觉中就进行了分散投资，比如，现在很多人会把原本放在银行的存款转出一部分到余额宝（货币基金），也有很多人会买银行的理财产品（不同的理财产品投资标的物不同，通常标的物包括信托、债券、基金、股票等，投资人购买理财产品就间接地将财富分散到不同金融工具中），还有一些投资人在外汇、商品、期货、期权等市场进行交易。除了金融资产以外，有些人会在实物资产市场中进行投资，比如房地产市场、古董市场等。


    那么如何分散投资才能实现最大程度地获取收益而最小程度地承担风险呢？资产配置（AssetAllocation）主要就是解决这个问题。资产配置是将财富分散到各种不同资产之中，目的是为了在未来某个时点达成某个收益目标，通过合理的配置，能够在达成收益目标的过程中，将财富的波动程度控制在个人可以接受的范围之内，并有很大的几率能够达成目标。显然，在资产未来的价格充满不确定性的前提下，资产配置有其必要性。


    本章先以两种风险资产为例，来说明分散投资的优点；然后将其拓展至多种资产的情境，来说明为什么分散化投资能够降低风险。之后为读者介绍经典的Markowitz均值-方差投资组合模型，该模型能够提供最优资产配置比例，使得在预期的收益水平下达到风险最小。最后将介绍更加符合现实的扩展模型：Black-Litterman模型。


    # ## 19.1 投资组合的收益率与风险


    在拓展到$N$种风险资产之前，先来看两种风险资产的情形。假设现在市场有资产$A$和$B$，其随机收益率分别为$R_{A}$和$R_{B}$，若投资人将其财富的一部分投入到资产$A$，剩下的投入到资产$B$，投资比例分别为$\omega_{A}$和$\omega_{B}$，且$\omega_{A}
    + \omega_{B} = 1$。如果投资人初期资本为$W_{0}$，则在资产$A$上的收益为$W_{0}\omega_{A}R_{A}$，在资产$B$上的收益为$W_{0}\omega_{B}R_{B}$，总的收益为$W_{0}\omega_{A}R_{A}
    + W_{0}\omega_{B}R_{B}$，'
  merge: -1
  img_proc: true
- pgno: 295
  md: '知道初始资本、收益即可求得投资组合的收益率 $R_p$：


    ```

    $$\begin{aligned} R_p &= \frac{\text{总收益}}{\text{初始投入资本}} = \frac{W_0 \omega_A
    R_A + W_0 \omega_B R_B}{W_0} \\ &= \omega_A R_A + \omega_B R_B \end{aligned}$$

    ```


    特定资产的风险可以用很多种方式来衡量，不过考虑到方便性和易解性，本章延续用收益率的方差（标准差）来指代风险。单个资产收益率的方差为：


    ```

    $$\sigma^2\left(R_i\right) = \mathbb{E}\left\{\left[R_i - \mathbb{E}\left(R_i\right)\right]^2\right\}$$

    ```


    两个资产组成的投资组合的方差为：


    ```

    $$\begin{aligned} \sigma^2\left(R_p\right) &= \mathbb{E}\left\{\left[R_p - \mathbb{E}\left(R_p\right)\right]^2\right\}
    \\ &= \mathbb{E}\left\{\left[\omega_A R_A + \omega_B R_B - \mathbb{E}\left(\omega_A
    R_A + \omega_B R_B\right)\right]^2\right\} \\ &= \mathbb{E}\left\{\left[\omega_A\left[R_A
    - \mathbb{E}\left(R_A\right)\right] + \omega_B\left[R_B - \mathbb{E}\left(R_B\right)\right]\right]^2\right\}
    \\ &= \mathbb{E}\left\{\omega_A^2\left[R_A - \mathbb{E}\left(R_A\right)\right]^2
    + \omega_B^2\left[R_B - \mathbb{E}\left(R_B\right)\right]^2 \right. \\ &\quad
    \left.+ 2\omega_A\omega_B\left[R_A - \mathbb{E}\left(R_A\right)\right]\left[R_B
    - \mathbb{E}\left(R_B\right)\right]\right\} \\ &= \omega_A^2 \sigma^2\left(R_A\right)
    + \omega_B^2 \sigma^2\left(R_B\right) + 2\omega_A\omega_B \sigma\left(R_A, R_B\right)
    \end{aligned}$$

    ```


    标准差为：


    ```

    $$\sigma\left(R_p\right) = \sqrt{\omega_A^2 \sigma^2\left(R_A\right) + \omega_B^2
    \sigma^2\left(R_B\right) + 2\omega_A\omega_B \sigma\left(R_A, R_B\right)}$$

    ```


    其中 $\sigma\left(R_A, R_B\right)$ 为资产 $A$ 与资产 $B$ 的协方差：


    ```

    $$\sigma\left(R_A, R_B\right) = \mathbb{E}\left\{\left[R_A - \mathbb{E}\left(R_A\right)\right]\left[R_B
    - \mathbb{E}\left(R_B\right)\right]\right\} \quad (19.1)$$

    ```


    从公式 (19.1) 可以看出，如果资产 $A$ 与资产 $B$ 收益率变化趋势是一致的（比如资产 $A$ 的收益率高于期望值时，资产 $B$ 的收益率也高于期望值），则其协方差为正；反之，若变化趋势相反，则协方差为负。协方差常常用来判断两个变量之间的相关性，不过由于协方差会受比例影响（比如把
    $R_A$ 和 $R_B$ 同时扩大 10 倍，协方差会放大 100 倍），因此统计学家引入相关系数来刻画两变量之间的相关性。资产 $A$ 和资产 $B$
    收益率之间的相关系数为：


    ```

    $$\rho_{A,B} = \frac{\sigma\left(R_A, R_B\right)}{\sigma\left(R_A\right)\sigma\left(R_B\right)}$$

    ```'
