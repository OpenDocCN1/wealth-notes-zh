    \ 120。\n\n# 32.4 KDJ 指标的交易策略\n\n总结随机指标 KDJ 的思想，首先计算最高价、最低价、和收盘价之间的比例关系，再运用均线平滑和乖离的思想，来捕捉动量及超买、超卖等现象，在实务上对快捷直观的研判行情很有助益。为了让读者对\
    \ KDJ 的应用有初步体会，接下来介绍 3 种简单的 KDJ 指标交易策略。\n\n+   （1）在 KDJ 指标的取值上，K 值与 D 值的取值范围是\
    \ 0 ~ 100。\n\n依据 K 值与 D 值可以划分出超买、超卖区，一般而言，K 值或者 D 值取值在 80 以上为超买区；K 值或者 D 值取值在\
    \ 20 以下为超卖区。\n\n（2）对于 J 值，当 J 值大于 100，可以视为超买区，当 J 值小于 0，视为超卖区。\n\n（3）此外，在 K 线、D\
    \ 线的交叉情况也可以释放出买入、卖出信号。\n\n当 K 线由下向上穿过 D 线时，即出现所谓“黄金交叉”现象，隐含股票价格上涨的动量较大，释放出买入信号；当\
    \ K 线由上向下穿过 D 线时，出现“死亡交叉”现象，股票有下跌的趋势，释放出卖出信号。\n\n# 32.5 KDJ 指标交易实测\n\n# 32.5.1\
    \ KD 指标交易策略\n\n本书将 KDJ 指标运用于标普 500 中，通过 K 线、D 线分别捕捉超买点和超卖点，构建交易策略函数，计算 KD 指标交易策略的收益率，再对\
    \ KD 指标交易策略进行评价。\n\n+   1. 计算 KD 指标释放的买卖信号。\n\n```\n## 计算 KD 指标释放的买卖信号\n# K 值大于\
    \ 85，超买，signal 为 -1；\n# K 值小于 20，超卖，signal 为 1；\n# D 值大于 80，超买，signal 为 -1；\n\
    # D 值小于 20，超卖，signal 为 1；\nIn [1]: KDSignal=KValue.apply(lambda x: \\\n    ...:\
    \ -1 if x>85 else 1 if x<20 else 0)\nIn [2]: DSignal=DValue.apply(lambda x: \\\
    \n    ...: -1 if x>80 else 1 if x<20 else 0)\nIn [3]: KDSignal=KSignal+DSignal\n\
    \    ...: KDSignal.name='KDSignal'\nIn [4]: KDSignal[KDSignal>=1]=1\n    ...:\
    \ KDSignal[KDSignal<=-1]=-1\n```"
