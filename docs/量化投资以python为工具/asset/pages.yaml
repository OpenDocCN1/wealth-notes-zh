    文件。此时请注意，在程序代码前面我们加了一行注解 “# -*- coding: UTF-8 -*-”，其表示编码格式为 UTF-8 类型。


    # 2.1.2 Python 默认的 IDLE 环境


    除了记事本以外，Python 还自带整合开发环境 IDLE（Integrated DeveLopment Environment），打开 Python 默认的
    IDLE，会出现如图 2.2 所示的页面，单击 File → New File，即可出现一个空白可编辑的子界面，该界面中没有用于输入指令的提示符 “>>>”，是一个纯文本编辑器，在此界面中输入上述代码，并保存为
    “test.py”，该 test.py 文件存储路径为 “D:\python quant\code\part1”。


    记事本中的代码颜色全都是一样的，而 Python IDLE 脚本编辑器中的代码在语句和函数上显示出不同的颜色，为阅读代码带来了一些方便。


    # 2.1.3 专门的程序编辑器


    除了上述两种方式以外，也可以使用专门的程序编写软件来写代码。专门的程序编写软件有很多，如 Eclips、notepad++、Sublime Text 等。专门程序编辑器一般都具备显示不同颜色代码、根据语言要求自动缩进代码、函数提示等诸多功能，这些功能为编程带来较大方便。


    ^1 本书的代码编写及执行均在 Windows 系统中完成'
