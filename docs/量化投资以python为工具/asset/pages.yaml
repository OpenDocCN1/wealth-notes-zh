    / P_{t-k}\right) \\ & =\ln \left(P_{t}\right)-\ln \left(P_{t-k}\right) . \end{aligned}$$


    继续以万科股票为例，2014 年 1 月 9 日的收盘价为 7.46 元，1 月 8 日的收盘价为 7.42 元，1 月 7 日的收盘价为 7.43 元。假设
    2014 年 1 月 2 日为第 1 期，则 1 月 9 日为第 6 期，即 $t=6$。根据股价资料，万科股票在 1 月 9 日的 2 期连续复利收益率
    $r_{6}(2)$ 为：


    $$\begin{aligned} r_{6}(2) & =\ln \left(P_{6}\right)-\ln \left(P_{4}\right) \\
    & =\ln (7.46)-\ln (7.43) \\ & \approx 0.40 \% \end{aligned}$$


