  md: '况等各类消息，然后分析股票的价格是否受消息的影响和受怎样的影响，然后根据分析结果进行相关操作，消息面分析运用的方法主要是基于CAPM模型的事件研究法。

    消息面分析很容易与基本面分析混淆，因为市场上的消息通常都是关于宏观政策、行业政策、公司状况的，这些消息都是关于公司基本面的，不过基本面分析者不会看到消息就有所反应，而是会先进行研究，判断消息的真假、消息是否会实现、是否会影响到公司的内在价值，然后与现在的股价相比较之后再决定是否要买进。


    +   • Alpha策略的出发点是CAPM模型，核心思想是通过构建投资组合对冲掉系统风险，锁定Alpha超额收益。若在有卖空机制的市场¹，对冲投资组合比较好构建：首先明确整个投资组合的资金，然后确定出具有较高Alpha收益的、需要多做的证券组合（股票或者ETF）和具有市场指数特征的、用来对冲掉系统性风险的、需要做空的证券组合，其次分配好资金的比重，最终获得稳定的Alpha收益。另外也可以用证券和股指期货结合进行操作，比如投资者预测出未来会跑赢大盘的证券，则可以在证券市场将其买入，同时在期货市场卖空股指期货合约，以对冲系统性风险，这样市场的涨跌不会影响到投资组合的收益。


