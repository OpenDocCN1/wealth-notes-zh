- pgno: 222
  md: '协方差为正说明，平均而言变量 X、Y与各自期望之偏差呈同方向变动；若为负，则为反方向变动。协方差有如下性质，读者可自行验证：


    +   (1)  $\mathrm{Cov}(X, Y)=\mathrm{Cov}(Y, X)$;


    (2)  $\mathrm{Cov}(aX, bY)=ab\mathrm{Cov}(X, Y)$ （a, b 是常数）;


    (3)  $\mathrm{Cov}(X_{1}+X_{2}, Y)=\mathrm{Cov}(X_{1}, Y)+\mathrm{Cov}(X_{2},
    Y)$。


    性质2说明协方差的值受变量比例影响，并不能准确衡量两变量相关性之大小。举个简单的例子，假设变量 X 和 Y 的协方差为10，且 X 的单位为米。若令 $Z=100X$
    （单位为厘米），根据性质 2，Z 和 Y 的协方差为1000，扩大了100倍。但是 X 和 Z 衡量的是同一事物，X、Y 之相关性与 Z、Y 之相关性是一样的。


    协方差受比例影响，并不能直接衡量两变量之间相关性之强弱。因此，我们需要对协方差做进一步处理，以清除比例的影响，由此引入相关系数（Correlation Coefficient）的概念。变量
    X 和 Y 的相关系数定义为：


    $$\rho_{X, Y}=\frac{\mathrm{Cov}\left(X_{i}, Y\right)}{\sigma_{X} \sigma_{Y}}$$


    相关系数的取值范围为 $[-1, +1]$。根据相关系数之定义，可以计算变量 $aX$ 和 $bY$ 的相关系数：


    $$\begin{aligned} \rho_{aX, bY} & =\frac{\mathrm{Cov}\left(aX_{i}, bY\right)}{\sqrt{\mathrm{Var}(aX)}
    \sqrt{\mathrm{Var}(bY)}} \\ & =\frac{ab\mathrm{Cov}(X, Y)}{|a| \sigma_{X} |b|
    \sigma_{Y}} \\ & =\pm \rho_{X, Y} \end{aligned}$$


    可见，变量比例变动只会影响相关系数的正负符号，并不会影响其绝对值的大小。现在我们考虑一个特殊的例子，变量 Y 是变量 X 的线性变换，满足 $Y=a+bX$，则二者之间的相关系数为：


    $$\begin{aligned} \rho_{X, Y} & =\frac{\mathrm{Cov}\left(X, a+bX\right)}{\sigma_{X}
    \sqrt{\mathrm{Var}\left(a+bX\right)}} \\ & =\frac{b\mathrm{Var}(X)}{|b| \mathrm{Var}(X)}
    \\ & =\pm 1 \end{aligned}$$


    也就是说 $\rho_{X, Y}=\pm 1$ 刻画的是 Y 和 X 之间的线性关系，再具体地说，相关系数衡量的是随机变量之间线性关系的大小，$|\rho|$
    越大说明线性关系越强；$\rho=0$ 说明两个变量是不相关（Uncorrelated）的、无线性关系，但这并不说明两变量相互独立，二者可能存在非线性的'
  merge: -1
