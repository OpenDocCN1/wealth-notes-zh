    # ### 7.3 匿名函数


    函数在 Python 中其实也是一个对象，因此我们之前关于对象的使用方式，完全适用于函数。比如，我们可以创建一个包含函数的列表，或把一个函数当作另一个函数的参数或返回值来传递。这时使用匿名函数可以使代码看起来更简洁明了。匿名函数顾名思义就是无须使用
    def 这样的语句来定义标识符（函数名）的函数。Python 使用 lambda 关键字来创建匿名函数，语法如下：


    ```

    lambda [arg1, arg2, ..., argN]: expression

    ```


    从上面可以看出，lambda 语句中，冒号前面可以有任意个参数（包括无参数和可选参数），不同的参数以逗号分隔；而冒号之后是表达式，只能有一个，也因此不必写
    return。


    下例演示将一个无参数的函数 greeting2 改写为匿名函数 greeting3：


    ```

    In [35]: def greeting2():

    ....:     print(''Hello World!'')

    ....:

    In [36]: greeting2()

    Hello World!

    In [37]: greeting3 = lambda : print(''Hello World!'')

    In [38]: greeting3()

    Hello World!

    ```


    下面的例子使用匿名函数的技巧，在列表中嵌入函数的定义：


    ```

    In [21]: def power2(x): return x**2

    In [22]: def power3(x): return x**3

    In [23]: def power4(x): return x**4

    In [24]: def power5(x): return x**5

    ```'
