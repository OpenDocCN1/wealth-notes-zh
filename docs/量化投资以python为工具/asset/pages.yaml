- pgno: 507
  md: '# # 第32章 随机指标交易策略


    # ## 32.1 什么是随机指标（KDJ）


    随机指标（KDJ）又称为随机指数（The Random Index），是一种用来分析市场中超买或者超卖现象的指标，它最早运用于期货市场，后来在股票分析中被众多投资者广泛使用。


    从交易原理上来看，KDJ指标最基础的交易思想建立在威廉指标（Williams %R，简称 %R）基础之上，威廉指标由拉里·威廉斯（Larry R. Williams）在其著作《我如何赚得一百万》¹中提出。在分析资产的价格时，除了考虑资产每天闭市时的价格（收盘价）以外，还要综合分析资产从开市到收市期间价格的变化情况。威廉指标的计算首先选定一个特定的时间跨度（比如14日），然后找出这一特定区间的最高价和最低价，构成一个价格变化区间；然后分析这一时间跨度最后一个时间点的收盘价与期间最高价和最低价的相对位置，再根据此相对位置来衡量市场的超买或者超卖现象。
    %R指标可以用公式表达为：


    $$\%R = \frac{\text{最近}\ n\text{天内的最高价} - \text{第}\ n\text{天的收盘价}}{\text{最近}\
    n\text{天内的最高价} - \text{最近}\ n\text{天内的最低价}} \times 100\%$$


    事实上，KDJ指标的最早雏形是由芝加哥期货交易商George Lane提出的KD指标，该指标又称为随机振荡指标（Stochastic Oscillator
    Indicator）。KD指标的分析思想与威廉指标类似，均使用特定时间跨度中的最后收盘价与该时间跨度内的最高价和最低价的相对位置来推测市场的超买和超卖情况。与威廉指标不同的地方在于，随机振荡指标在收盘价与最高价和最低价的相对位置的比值上，又融合了移动平均的思想，用更多的信息来捕捉市场的超买、超卖现象。


    KDJ指标则是在随机振荡指标K线和D线的基础上增添一条J线，进一步提高了随机振荡指标对市场买卖信号捕捉的延迟。


    # ## 32.2 随机指标的原理


    随机指标（KDJ）综合考虑特定时间段的最高价、最低价和收盘价数据，运用一种巧妙的思路分析最高价、最低价和收盘价之间的关系，根据收盘价在最高价、最低价构成的区间相对位置来反映价格的走势和波动幅度，使用随机波动的观念来捕捉市场的超买或者超卖现象；KDJ指标又结合统计学原理和移动平均的思想绘制出K线、D线和J线，综合运用'
  merge: -1
  img_proc: true
- pgno: 508
  md: '用相对强度指标、动量指标和移动平均值的特点来直观、清晰地刻画股票的走势情况，对市场短期行情的预测有较高的准确性。


    # 32.3 KDJ指标的计算公式


    KDJ指标由K线、D线和J线这三条线组成，根据特定的周期（通常为9天、9周等）内资产的最高价、最低价、最后一个计算时点的收盘价以及这3种价格的比例关系，来计算最后一个时点的未成熟随机值RSV（Raw
    Stochastic Value，RSV），进而通过移动平均法来计算K值、D值和J值。将各时点的值K值、D值和J值在坐标轴上描点，连接这些点即形成K线、D线和J线。和其他指标计算方式一样，KDJ指标的计算周期以日、周、月或年为时间单位，也可以计算分钟KDJ指标。下面以日KDJ指标为例，分别介绍RSV值、K值、D值和J值的计算过程。


    # 32.3.1 未成熟随机指标RSV


    计算RSV的值是求KDJ指标的第一步，RSV的计算公式为:


    ![](img/0de14a685304f8aa267f6492145864ac_508_0.png)


    其中 *n* 为时间跨度。如果设定 *n* = 9，当期的收盘价为50元，9日内的最高价为90元，最低价为10元，则当期RSV的取值为:


    ![](img/0de14a685304f8aa267f6492145864ac_508_1.png)


    若用 $\mathrm{C}l o s e_{t}$ 表示 *t* 时期的收盘价， $\mathrm{H}i g h_{[t-n+1,t]}$ 表示 $t-n+1$
    日到第 *t* 日这 *n* 日内的最高价， $\mathrm{Low}_{[t-n+1,t]}$ 表示 $t-n+1$ 日到第 *t* 日这 *n* 日内的最低价，则
    *t* 时期 $RSV_{t}$ 的计算公式为:


    ![](img/0de14a685304f8aa267f6492145864ac_508_2.png)


    其中，*n* 为时间跨度，一般取9日或者9周。


    如图32.1所示，若以9日为时间跨度，RSV的分子是第9日收盘价减去9日内的最低价，分母是9日内的最高价与最低价的差值；RSV藉由分子和分母的比例，刻画出第9日收盘价在9日内最高价和最低价所构成的区间中的相对位置。RSV也因此被解读为市场中买盘力量的相对强弱。很显然RSV的取值范围在0～100之间，RSV的取值越大，说明收盘价在价格区间中的相对位置越高，市场中可能出现超买现象；RSV取值较低时，收盘价的相对位置偏低，市场中可能出现超卖行情。


    比如，运用标准普尔500指数（S&P 500 Index）在2014年1月1日到2015年4月30'
