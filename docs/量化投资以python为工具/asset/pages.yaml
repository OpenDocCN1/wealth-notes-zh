- pgno: 310
  md: '看法向量误差项的协方差矩阵：


    ```

    Ω = diag(P(τΣ)P^{T})

    ```


    根据贝叶斯法则，结合先验信息与投资者观点的各资产预期收益率的期望值 $\mu_{|q; \Omega}$ 服从正态分布：


    ```

    $\mu_{|q; \Omega} \sim N(\mu_{BL}, \Sigma_{BL}^{\mu})$

    ```


    其中期望值 $\mu_{BL}$ (N × 1 列向量) 和协方差矩阵 $\Sigma_{BL}^{\mu}$ 为：


    ```

    $\mu_{BL} = \left[ (\tau \Sigma)^{-1} + P^T \Omega^{-1} P \right]^{-1} \left[
    (\tau \Sigma)^{-1} \pi + P^T \Omega^{-1} q \right]$


    $\Sigma_{BL}^{\mu} = \left[ (\tau \Sigma)^{-1} + P^T \Omega^{-1} P \right]^{-1}$

    ```


    其中 τ 为比例系数（常数），反应主观观点相对于先验信息的比重。最后，我们可以得到结合先验信息与投资者观点的各资产后验预期收益率分布（Posterior distribution）为：


    ```

    $R_{|q; \Omega} = \mu_{|q; \Omega} + Z$

    ```


    其中 Z 为误差项，$Z \sim N(0, \Sigma)$。因此最后各资产后验预期收益率的期望值和方差分别为：


    ```

    $\mathbb{E}\left(R_{|q; \Omega}\right) = \mu_{BL}$


    $\Sigma_{BL} = \Sigma + \Sigma_{BL}^{\mu}$

    ```


    有了各资产之预期收益分布，特别是预期收益率之期望值与方差，就可以根据最小化风险，或者最大化收益率来求解各资产的配比状况。总的说来，BL 模型求解过程包括以下几步。


    (1) 使用历史数据估计预期收益率的协方差矩阵，假设根据 N 种资产过去 T 期的收益率资料，则协方差矩阵为：


    ```

    $\hat{\Sigma} = \begin{bmatrix}

    \hat{\sigma}_{11} & \hat{\sigma}_{12} & \cdots & \hat{\sigma}_{1N} \\

    \hat{\sigma}_{21} & \hat{\sigma}_{22} & \cdots & \hat{\sigma}_{2N} \\

    \vdots & \vdots & \ddots & \vdots \\

    \hat{\sigma}_{N1} & \hat{\sigma}_{N2} & \cdots & \hat{\sigma}_{NN}

    \end{bmatrix}$

    ```


    式中 $\hat{\sigma}_{ij}$ 是根据样本数据估计出来的资产 i 与 j 的协方差，表达式为 $\hat{\sigma}_{ij} = \mathbb{E}([(R_{i,t}
    - \hat{\mu}_{i})(R_{j,t} - \hat{\mu}_{j})])$，其中 $\hat{\mu}_{i}$ 为资产 i 的历史平均收益率，$\hat{\mu}_{i}
    = \frac{\sum_{t=1}^{T} R_{i,t}}{T}$。


    (2) 确定市场预期之收益率向量（N × 1 列向量），也就是先验预期收益之期望值。我们可以用历史收益率均值作为先验预期收益之期望值，即 $\pi = \hat{\mu}$。也可以根据市场现有'
