  md: '操作方法 功能

    str.islower( ) 如果字符串对象 str 中的所有字符均为小写字母，返回 True; 否则，返回值为 False。

    str.isupper( ) 如果字符串对象 str 中的所有字符均为大写字母，返回 True; 否则，返回值为 False。

    str.lower( ) 将字符串对象 str 中的所有字符转换成小写字母。

    str.upper( ) 将字符串对象 str 中的所有字符转换成大写字母。

    str.istitle( ) 如果字符串对象 str 中无空格的连续字符的首字母均大写，其余部分均小写，则返回值为 True；否则，返回值为 False。

    str.title( ) 将字符串对象 str 无空格的连续字符转变成首字母大写，其余部分均小写的形式

    str.capitalize() 将字符串中的字母大写，其余部分均小写

    str.swapcase( ) 将字符串中的字母大小写调换，原大写的转变成小写，原本小写的转变成大写。


