    # 31.4 布林带通道与市场风险


    布林带通道的设定蕴含着统计学原理，假设股票价格走势呈现正态分布$^{1}$，正态分布是关于均值呈对称分布的，如图 31.5 所示，均值加加减两个标准差范围内的数据大概占据了整个数据的
    95.44%。布林带通道以价格的平均值加减两个标准差来设定上下通道，从正态分布的角度来看，布林带通道刻画了股票价格的主要变化范围，即大部分情况下股票价格应


    $^{1}$这个假设是否合理，从逻辑的角度而言并不重要，重点在于读者视它为“有待验证的假设（Refutable Hypothesis）”。'
