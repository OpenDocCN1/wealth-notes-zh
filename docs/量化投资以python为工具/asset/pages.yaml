  md: '因子和账面市值比因子，仿照 CAPM 模型用这 3 个因子建立起线性模型来解释股票的收益率，这就是著名的 3 因子模型（Fama-French Three
    Factor Model）。


    三因子模型中的 3 个因子均为投资组台的收益率：市场风险溢酬因子对应的是市场投资组台的收益率，市值因子对应的做多市值较小公司、做空市值较大公司的投资组合之收益率，账面市值比因子对应的是做高
    B/M 比公司、做空低 B/M 比公司的投资组合之收益率。三因子模型的具体形式如下：


    $$\mathrm{E}\left(R_{i t}\right)-R_{f t}=b_{i}\left[\mathrm{E}\left(R_{m t}\right)-R_{f
    t}\right]+s_{i} \mathrm{E}\left(S M B_{t}\right)+h_{i} \mathrm{E}\left(H M L_{t}\right)$$


    其中 $S M B$ (Small Minus Big) 为市值因子，也就是小公司比大公司高出的收益率；$H M L$ (High Minus Low) 代表账面市值比因子，用高
    B/M 比股票收益率减去低 B/M 比公司的收益率得到；$b_{i}、s_{i}$ 和 $h_{i}$ 分别为投资组合（或单只股票）的收益率对 3 个因子的敏感系数。实证上常常用：


    $$R_{i t}-R_{f t}=\alpha_{i}+b_{i}\left(R_{m t}-R_{f t}\right)+s_{i} S M B_{t}+h_{i}
    H M L_{t}+\varepsilon_{i t}$$


    来做回归检验，公式中 $\alpha_{i}$ 为超额收益率。在进行实证研究应用时，投资组合（或个股）收益率 $R_{i t}$ 、无风险收益率 $R_{f
    t}$ 、市场投资组合 $R_{m t}$ 、市值因子组合 $S M B_{t}$ 和账面市值比因子组合 $H M L_{t}$ 的数据都是已知的，通过线性回归拟合最小化残差平方和我们可以得到参数
    $\alpha_{i} 、 b_{i}、s_{i}$ 和 $h_{i}$ 的估计值，检验超额收益及 3 个因子的系数是否显著地异于 0 ，也就是检验 3 个因子是否能够解释收益率。接下来，我们来了解一下各因子数据是如何计算和获得的。


    +    $R_{i t}$ 和 $R_{m t}$ 的数值获取：国泰安数据库、中国证券市场交易数据库 CSMAR 等有提供股票交易及收益率数据，市场投资组合收益率
    $R_{m t}$ 可以直接从数据库中获取。关于 $R_{i t}$ ：若研究对象为个股，$R_{i t}$ 可以直接从数据库中获取；若研究对象为投资组合，$R_{i
    t}$ 需要用个股收益率经过加权平均计算，加权平均有两种方式：一种是等比例加权平均（Equal Weighted Average)、另一种是按市值比例加权平均
    (Value Weighted Average)，两种加权方式都很常见。


    +    $R_{f t}$ 的数值获取：无风险利率 $R_{f t}$ 可以取值为中国人民银行公布的人民币利率，也可以参考政府债券的利率。投资组合（或个股）$t$
    的风险溢酬 $R_{i t}-R_{f t}$ 和市场风险溢酬 $R_{m t}-R_{f t}$ 即可计算出。


    +    $S M B_{t}$ 和 $H M L_{t}$ 的计算（参考 Fama 和 French（1993））及获取：


    +    $S M B_{t}$ 对应的是做多市值较小公司、做空市值较大公司的投资组合之收益率，因此我们需要确定什么是“市值较小”和“市值较大”公司。这里的市值对应的是公司股票的市值（之后称为
    Size），等于股票价格 $P$ 乘以在外流通股数 $Q$ 。上市公司 $k$ 在时点 $t$ 的市值即为 $M E_{k t}=P_{k t} \times
    Q_{k t}$ 。将所有上市公司的 Size 计算出'
