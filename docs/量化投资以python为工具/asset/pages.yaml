    假设某投资者在2014年5月7日以收盘价购买万科股票，8日以收盘价卖出股票。5月7日是股权登记日，因此在这一天购入股票是有权利分得股利的，考虑到价格变动及红利，从5月7日到8日，投资人的单期简单收益率为：


    ```

    $$R_{May 8th} = \frac{P_{May 8th} - P_{May 7th} + Div}{P_{May 7th}} = \frac{7.35
    - 7.87 + 0.3895}{7.87} \approx -1.658\%$$

    ```


    一般来说，设第 $t-1$ 期为股权登记日，第 $t$ 期为除权除息日，股利分红为 $D_t$，则第 $t$ 期的单期收益率：


    ```

    $$R_t = \frac{P_t - P_{t-1} + D_t}{P_{t-1}} = \frac{P_t + D_t}{P_{t-1}} - 1$$

    ```


    股票作为一种重要的投资工具，股利是很重要的收益，对长期的股票持有者来说，股利是挑选价值型股票的重要指标之一。那么，我们怎么去判断一只股票的股利是多还是呢？股息率（Dividend
    Yield Ratio）是股息与股票价格的比率：


    ```

    $$\text{股息率} = \frac{\text{Div}}{\text{Price}} \times 100\%$$

    ```


    股息率是判断股利高低的重要参考，也是衡量公司是否具有投资价值的重要指标。挑选价值性股票另一个很重要的指标是市盈率（也被称为本益比，Price-to-Earning
    Ratio）:


    ```

    $$\text{本益比} = \frac{\text{每股市价}}{\text{每股盈利}}$$

    ```


    其中每股盈利（Earning per Share）一般是以公司在过去一年的净利润除以总发行已售出股数。市盈率衡量的是如果公司未来能够维持过去一年的盈利水平，投资人以市场价格购入该公司股票，多长时间可以赚回本金。理论上来讲，股票的市盈率越低代表该股票的风险越低，但是在实务操作上，不同行业、不同国家、不同时期、不同股票的市盈率变动是非常大的。通常，传统产业公司获利比较稳定、成长性不大，市盈率比较低；而高科技公司，未来前景比较好，股票价格已经包含了未来成长的预期，而每股盈利还处在初期比较低的阶段，因此成长型股票的市盈率都比较高。'
