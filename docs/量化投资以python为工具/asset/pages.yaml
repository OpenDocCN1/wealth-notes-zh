    # 23.3 上证综指的平稳性检验


    时间序列的平稳性是许多时间序列分析方法的前提，在构建模型预测时间序列未来取值的情况之前，需要检验该时间序列的平稳性。接下来我们要系统地探讨如何判断一个时间序列的平稳性。


    # 23.3.1 观察时间序列图


    首先，我们可以通过观察时间序列图的形状来大致辨别其平稳性。


    ```

    In [17]: SHclose=SHindex.Close  In [18]: SHclose.plot() ... plt.title(''2014-2015年上证综指日度序列图'')
    Out[18]: <matplotlib.text.Text at 0x7efe622c2160>

    ```


    我们可以依据时间序列平稳性的特点，从时序图的形态来大致判断其平稳性。依据弱平稳性的定义，序列的均值和方差是一个常数。简单地讲，假定我们有n个观察数据，平稳性意味着时序图中的n个值在一个常数水平上下以相同的幅度波动。因此，如果数据的时序图围绕一个水平线上下以大致相同的幅度波动，那么该时间序列可能具备弱平稳性。如果时序图有着明显递增、递减趋势或周期性波动的形态，那么该时间序列很有可能是平稳的。让我们来
    分析上证综指收盘指数的时序图，如图23.5所示是上证综合指数的收盘指数日度数据的时序图。我们可以看到，2014年1月～7月，收盘指数价格变化不大，大致在一条水平直线上；2014年8月之后，上证综指的收盘指数则呈现出明显的上升趋势。从整体上看，该时序图有明显的上升趋势，我们可以判断其不是平稳性时间序列，但是该时间序列在2014年1月～7月大致呈现出平稳性。


