    # 11.2.5  DataFrame 的运算\n\n+   - 简单运算\n\n在分析数据时，不可避免地要对数据进行运算。当对两个数据集进行算术运算时，遇到的核心问题有两个：一是两个数据集之间如何进行匹配进而运算；二是如何处理不匹配的数据。Pandas\
    \ 的两种数据类型（Series 与 DataFrame）比较有特色的部分是 index（DataFrame 还多了列名 columns），因此两个数据集最直接的匹配方式是按照\
    \ index 与 columns 进行匹配运算。如果两个数据集的加减乘除运算分别用“+”、“-”、“*”、“/”来实现，那么 Series 与 Series\
    \ 之间是 index 匹配运算，无法匹配的用 NaN 进行填充；Series 与 DataFrame 之间是 Series 的 index 与 DataFrame\
    \ 的 columns 之间匹配，运算的方式是将 DataFrame 每一行都与 Series 进行匹配运算，无法匹配的用 NaN 填充；DataFrame\
    \ 与 DataFrame 之间是同时对 index 与 columns 进行匹配，匹配成功的元素进行运算，无法匹配的用 NaN 填充。\n\n```\n\
    In [1]: import pandas as pd\n```"
