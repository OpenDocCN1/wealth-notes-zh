    \t</tbody>\n\t\t\t\t\t</table>\n\n# 18.1.4  单期与多期简单收益率的关系\n\n我们分别介绍了单期收益率及多期收益率，从计算式可以看出，单期收益率的计算非常简单。如果我们现在不知道价格序列，只知道单期收益率序列，那么多期收益率可以计算出来吗？比如\
