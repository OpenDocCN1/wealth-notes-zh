    _ochl()、candlestick2\\_ohlc()、candlestick\\_ochl()以及candlestick\\_ohlc()等函数，candlestick2\\\
    _ochl()和candlestick2\\_ohlc()函数用于K线图，而candlestick\\_ochl()和candlestick\\_ohlc()函数用于绘制蜡烛图，下面以candlestick\\\
    _ohlc()函数为例，演示上证综指2015年3月份日K线图的画法。\n\n+   • 首先，利用pandas第三方库中的read\\_csv()函数读取外部csv文件，ssec2015.csv文件内存储了上证综指2015年3月份的日交易数据。\n\
