- pgno: 384
  md: '$$\begin{aligned}\mathbb{E}\left(\varepsilon_{t}\right)&=\mathbb{E}\left[\mathbb{E}\left(\varepsilon_{t}\mid\mathcal{F}^{t-1}\right)\right]=0\\\operatorname{Var}\left(\varepsilon_{t}\right)&=\mathbb{E}\left[\mathbb{E}\left(\varepsilon_{t}^{2}\mid\mathcal{F}^{t-1}\right)\right]=\mathbb{E}\left(\sigma_{t}^{2}\right)\\&=\alpha_{0}+\alpha_{1}\mathbb{E}\left(\varepsilon_{t-1}^{2}\right)+\cdots+\alpha_{p}\mathbb{E}\left(\varepsilon_{t-p}^{2}\right)\\&=\frac{\alpha_{0}}{1-\alpha_{1}-\cdots-\alpha_{p}}\\\operatorname{Cov}\left(\varepsilon_{t}\varepsilon_{t-j}\right)&=\mathbb{E}\left(\varepsilon_{t}\varepsilon_{t-j}\right)=\mathbb{E}\left[\sigma_{t}\sigma_{t-j}u_{t}u_{t-j}\mathbb{E}\left(u_{t}\mid\mathcal{F}^{t-1}\right)\right]=0\end{aligned}$$


    而且 $\varepsilon_{t}^{2}$ 有自相关性、并可用 AR(p) 模型刻画， $\varepsilon_{t}$ 满足厚尾现象，读者有兴趣可以自行验证。综合来看，ARCH(p)
    模型很好地刻画了资产收益率序列表现出来的特征，不过需要注意的是，ARCH （或 GARCH） 模型是完全单纯的统计模型，它们只是捕捉到金融序列的特征，而不能用来解释金融序列为何有这些特征。


    ARCH(p) 模型的估计过程如下。


    +   - 估计一个 ARCH 模型，首先需要设定一个合适的阶数 $p$ 。为确立 ARCH(p) 模型中的阶数，在检验得知时间序列 $\left\{\varepsilon_{t}\right\}$
    确实存在显著的 ARCH 效应的条件下，我们可以用 $\varepsilon_{t}^{2}$ 的偏自相关函数（PACF）来确定 $p$ 。


    +   - 设好阶数以后，为估计模型参数，我们常常假定 $u_{t}$ 服从以下三种分布中的一种来进行估计：标准正态分布、标准化的学生 $t$ 分布和广义误差分布。然后用最大似然法
    (Maximum Likelihood) ${ }^{1}$ 对模型参数进行估计。


    +   - 对模型进行参数估计以后，需要检验模型设定。最常见的检验依赖于以下事实：一个正确设定的 ARCH 模型，标准化残差 $\hat{u}_{t}=\frac{\hat{\varepsilon}_{t}}{\hat{\sigma}_{t}}$
    是独立同分布的随机过程。因此 $\left\{\hat{u}_{t}\right\}$ 和 $\left\{\hat{u}_{t}^{2}\right\}$
    的 Ljung-Box 统计量可以分别用来检验均值方程和波动率方程的正确性。


    # 25.2.2 GARCH 模型


    从前面介绍可以看到，ARCH模型中波动率 $\sigma_{t}^{2}$ 仅与 $\varepsilon_{t}^{2}$ 的滞后项有关，即 ARCH(p)
    模型的实质是，用残差平方序列的 $p$ 阶移动平均拟合当期条件方差函数值，也就是说 ARCH(p) 模型是将 AR(p) 模型的思想用在估计条件方差。Bollerslev
    (1986) 提出了 ARCH 模型的推广形式，称为广义自回归条件异方差模型（Generalized AutoRegressive Conditional
    Heteroskedastic Model），简称 GARCH 模型。GARCH(p,q) 类似于 ARMA(p,q) 的设定，认为时间序列每个时间点变量的波动率是最近
    $p$ 个时间点残差平方的线性组合，与最近 $q$ 个时间点变量波动率的线性组合加起来得到：


    $$\begin{aligned}\varepsilon_{t}&=\sigma_{t}u_{t}\\\sigma_{t}^{2}&=\alpha_{0}+\sum_{i=1}^{p}\alpha_{i}\varepsilon_{t-i}^{2}+\sum_{j=1}^{q}\beta_{j}\sigma_{t-j}^{2}.\end{aligned}$$'
