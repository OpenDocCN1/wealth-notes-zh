    # 12.3.1 柱状图（Bar charts）


    柱状图主要用于表示定性数据的频数分布，其能够直观展现变量的分布情况。一般情况下，柱状图的 X 轴表示定性变量的各个取值，Y 轴则表示各个取值的频数。柱状图只适用于展示定性数据，也可用于定量的数据。若要对定量数据绘制柱状图，则需要先对数据进行区间分组。


    本章前面内容已经获取了中国银行的收盘价数据。除了绘制收盘价曲线图以外，绘制收盘价柱状图也可以展现出一些新的收盘价分布信息。在绘制收盘价柱状图之前，我们先简要分析一下中国银行收盘价数据的最高价、最低价、中位数、平均数等信息，这些信息通过对收盘价调用
