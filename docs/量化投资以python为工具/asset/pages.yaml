    # 31.5 通道突破交易策略的制定


    # 31.5.1 一般布林带上通道突破策略


    布林带通道最常见的策略就是根据价格线突破布林带通道上下界来制定交易策略。


    +   - 当股价向上突破布林带上通道时，股票可能产生了异常上涨，未来股价会跌落到到布林带通道内部，此时宜做空；

    - 当股价向下跌破布林带上通道时，股票可能产生了异常跌势，未来股价会上升到布林带通道内部，此时宜做多。


    运用中国联通股票的交易数据，用 Python 编写代码来捕捉价格突破布林带上下通道日期，制定交易策略并计算平均获胜收益率。'
