    个板块。


    第一个是营销能力，因为很早就有很多营销界的专业人士认为我们的营销团队是一个非常天才的营销团队；


    另外我们在工业设计和软件的图形界面和用户体验、人机交互这些方面的能力也是很早就表现出很强的天赋和才华，也被外界的很多专业人士关注到，所以我们起步的时候对这三块是非常有信心的。


    ## 1、你以为的长板其实没那么长


    经过几年的实践，首先说到营销问题，在中文里Marketing这件事经常被营销，营销和Marketing都有了，在我早期非做业务和非常山寨的认知里，认为一个人能在网上把个东西转传成网络版是，实现病毒式的，低成本甚至无尽成本的传播，这个就是大家认可的所谓营销天才。所以在我创立锤子科技之后，我们在市场传播、打广告、销售这些方面认为是手到擒来的一个事情。


    但是在英文里这个概念就是比较清晰的，Marketing 就是 Marketing、sales 是 sales，sales就是销售，在销售方面无论是我，还是我早期的那个团队，整体上是一个完全无知的零状态。如果以今天的知识回顾的话，我们的不足也是显而易见的。


    首先表现在对一个产品整个周期的、从早期策划到中期运作方面的各种详细的制定和规划，到最后一把它毫无偏差或者偏差很小执行出来，这是一个系统性的工程设计。在这些系统工程方面，我接触了很多成熟的、正规的企业CMO（首席营销官）之后，发现我们在这方面仍然是处在非常业余的状态。


    只是说在创意方面、在制造话题和传播的这些粘性方面，我们有一定天分，占了这方面的便宜，所以很容易走进公众视野，成为一个显目的这么一种现象级的东西，但是实际上对成熟企业的Marketing运作来讲，我们的团队直到今天都不是说非常成熟和非常稳健的。


    ## 2、你的长板确实强，但它对你的成功所占的比例有限


    另外过去我们几年的实践证明，即使是在早期的时候自认为是业界无敌的这些领域，仍然会存在一个严重的误判。


    以我们自己最得意的图形界面，就是软件的图形界面以及软件的交互设计、用户体验这些长板之处，还有工业设计方面的长处，以这两个为例，我们在国内专业的软件交互设计的这个群体当中、在专业的产品经理当中已经受到普遍的认可，也得到一些专业性比较强的这种奖项，我们的工业设计从第一代产品就得了汉诺威工业设计论坛IF金奖，后续的两款产品在全世界范围内也拿了几乎所有有影响力的国际性的奖项。


    也就是说在创业的初期，在这两块，也就是UI、UX和工业设计这两块的自我认知其实没有特别大的偏差，但是后续的实践证明，


    举例来说，它对成就一个成功的商业产品可能有20%、30%的重要性，但是我们创业初期误以为自己所长占的这种能力对成就一个产品有70%、80%的重要性，这就使得后续的实践和早期对自己能力以及这个能力可能产生的产品效应方面的判断，出现了严重的反差。


    比如说销售柜台，一个促销员对一个对产品产生兴趣的顾客详细解释我们操作系统所具有的那种易用性和优势的时候，可能对比临时在那看上几分钟的顾客来讲没有产生那么大的效果，反倒是这个产品如果做了一些非常不一样的、非常科幻般的、黑科技炫技的这种感受，要更加地容易感知和显而易见。


    至于工业设计它是一个更加复杂的问题，虽然我们用大量的、权威的、专业性的奖项证明了我们在这方面的优秀和能力，但是作为一个大众消费品的厂商，它需要一个成熟的商品产品团队、平衡好工业设计方面的差异性到普通公众的接受度之间的这种矛盾或偏差。一个成功的巨头口味的抄袭者，不利于整个行业和自身的发展；如果一个影响力有限的团队尝试去强势引导公众的审美趣味和方向，就容易成为一个小众的产物。


    以苹果公司为例，在早年还是一个小众公司的时候，其在工业设计方面的专业性也是被权威的专家领域公认的，但是由于综合方面的尚有所不足，导致它在产品的商业接受度上非常有限，后来它解除了自身的综合能力，被大众接受之后，其在工业设计方面的优秀的这些东西也引导了大众的审美趣味和方向。


    所以，我们在创业初期对自身的工业设计能力的认知虽然没有出现什么大的偏差，但是仅靠这种能力不足以支持一个商业化产品取得成功。


    但是在初期，有可能误以为自己优秀的这部分能力是成就一个事情的关键因素或者是最关键因素，这也会带来实践中的一个巨大偏差。


    好，以上是今天跟你探讨的内容，创业过程中最容易掉进去的那些坑中有一个，就是过分地高估自己所具有的优势和长板能力。


    ## 今日得到


    - 每一个创业团队之所以敢走出创业这一步，一定是因为own自己自信的一部分优势和长处和能力，而这个能力展现给投资人和早期创业团队的成员的时候，也是因为得到他们的认可，才转化为这个创业行为本身，这就使得对自身优势判断可能会有一个过高的估计，这是从人性的角度是很容易犯的一个错误。

    - 但如果认知不足，满足于别人赞扬你天和才华的那部分，容易就把它可能产生的效应无限地放大，最终导致在实践中埋下苦果。


