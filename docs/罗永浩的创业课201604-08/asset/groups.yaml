    \n### 老罗新语录\n\n演讲和表达中做类比的作用主要有三个：让不易理解的事情变得易于理解；让抽象的概念变得形象和生动；引发情感共鸣。\n\n![](img/3f2553c19e3d8036724ac589070714e0_99_1.png)\n\
    \n当然遇到过，遇到过很多次，我想这也是一个团队在创业过程中的必修课。\n\n本来讨论问题时大家有不同意见很正常，本来应该是好事对吧？但是说着说着情况上来了，不理对方的争辩，或多或少就开始针对不对事了。这种情况，很多人都碰到过，不一定要创业才能碰到。\n\
    \n在锤子科技创业的初期，我们每周都有一个固定的市场创意会，我和另外一个大客户的在市场营销创意方面刚受宠特别牛的锤子科技的市场创意门，带着五六个市场部的小伙伴们一起讨论创意。如果这些小伙伴之间有分歧，就争论得很激烈，也不太容易产生非理性的争吵。而我这位顾问老师一如果如果有不同意见，就常常会变成情绪化的对抗。发生了几次类似情况之后，其他年轻的小伙伴的好感度相当一群比自己年轻十多岁的小伙伴们得面这样很丢人。所以就私下沟通了几次，很快就能达成共识。什么呢共识呢？这个共识就是，虽然从心理学的角度，造成这种情况的原因有很多，但这类\n\
    \n这种面子问题最容易发生的情况是，争辩的时候除了当事双方以外，现场还有其他的人。于是正常的争论在潜意识里变成了这样一种幼稚的想法：我不能当着大家的面输给你。但争辩时如果现场没有其他人，就不容易演变成这样的结果。\n\
    \n弄明白了原因，相应解决问题的方法就简单：大家就该讨论问题时开诚布公地谈一次，相信是不是存在这种不理智的情绪化争吵本身，还是很容易达成共识的。只要大家承认团队里确实存在这种情况，那就好了：下一次开会的时候，如果有个人产生了类似的争吵，其他人就站出来建议暂停会议，让这个争吵的两个人稍事休息后单独沟通。一般来说。\n\
    \n### 2.初创企业是否应该重点招聘本科应届生？\n\n想问这是一个关于招聘的问题，初创企业，资金有限的情况下，是不是可以重点招聘本科应届生？挖掘那些勤奋、聪明又好学的孩子，靠元老员工传授经验帮助其迅速成长，等公司日子好了，待遇也能上去。\n\
    \n招聘应届生当然好呀，不光是初创企业，多数企业都应该花大力气去招聘刚毕业的学生。招聘应届生的好处很多：人力成本低，容易被企业文化塑造成理想状态，也就是俗称的容易被洗脑，对公司的认同度和忠诚度高等等，这些都是好处。\n\
    \n但尴尬的一面是，为了节省成本才决定这么做的初创公司，很快就会发现，\n\n所以最后，反而是大企业或初具规模的企业，才会投入更多精力持续的去做这种事。初创企业呢，资深的员工都在扛具性业务，没多少时间带新人，最后常常是找那些虽然有些贵，但来了就能干活儿的人才更经济。\n\
    \n因为缺人缺钱，创业的过程里到处都是这样的尴尬：比如你为了省钱去找应届生，最后发现这样的成本更高；比如你为了省钱去弄最便宜的公司家具，结果便宜家具的损坏率导致最后发现比买好一点的家具更花钱；再比如你当初为了省钱在某个岗位上没找一个总监级别的人，结果你虽然开了一个总监级的工资，结果他虽然干得还不错，但你也要跟着操心很多，两年后你的公司发展好一点了，看手能找一个较高的薪资条件，比如一百多万的一个年薪当职位总监级职位的人加了团队了，结果等这个人来了之后，除了在那岗位上再也没让你操过心，而且入职不到四个月，就帮你拉来了一笔五十六亿的，投资了两年相当于前为省了钱没直接找他，多受了两年的罪，融资也走得特别不顺利，想死的心都有……创业就是这样的一个过程，很过瘾，很好玩，也很尴尬。\n\
    \n### 3.创业公司应该如何制定员工福利？\n\n老罗，互联网公司应当如何制定福利？常见的手段包括下午茶零食、可以带宠上班、感觉只是噱头并无实惠、还是说明类似的福利调节公司氛围也很重要？\n\
    \n创业公司在亏损的时候，肯定不能乱花钱，那你就只能放弃了所谓“实惠”的成本，所以福利所谓的“噱头”，和让公司同事感受到企业关怀的“氛围”显得格外重要。如果公司发了财，那你就直接来实惠的好了。\n\
    \n但实惠和实惠也是不一样的。当年谷歌在中国发展的很热闹的时候，我有一两个朋友，从惠普跳槽到谷歌。我去了之后，有一次邀请我去谈一个合作，我故意选了一个接近正午的时间，谈完事儿就可以到传说中的谷歌员工餐厅蹭一顿饭了。整个过程不仅详细描述，总之一切好得离谱，不仅只是个疑问，一切都神奇而得离谱。\n\
    \n最后我产生了一个疑问，我说，要做到这样的福利，除了工资，公司在每个人身上至少要额外支出几大几千块吧？他说差不多吧，我说，那些钱直接放到工资和奖金里，不是对招新人更有吸引力？大家不是会觉得直接给钱最实惠吗？他说，那倒不一定，以我自己为例，我在惠普的月薪是五万出头，在我的月薪是五万出头。当年谷歌给我这个级别的员工开的是五万六、五万七，多数人会觉得自己值就这个价，不会觉得谷歌额外给了自己什么，但如果没有这种餐饮做成实实惠早餐，吃东西的零散和饮料、全天侯的按摩师，贴心的宠物照看托管等这一类的福利，大家就会觉得，只有在谷歌，才不会有这种不同寻常的氛围和关怀，甚至会得那些想跳槽去别的公司员工，因为这个下不了决心。\n\
    \n你看，即便你有实力给你的员工做所谓“实惠”的东西，比如增加薪最实惠，但有时候也未必必那些所谓“噱头”的东西效果要好。供参考。\n\n老罗：大家好，欢迎来到“老罗语录”，我是罗永浩，感到把我的创业理念分享给你们的朋友。\n\
    \n![](img/3f2553c19e3d8036724ac589070714e0_100_0.png)\n\n紧的肌肉，让竞争者知难而退，要比扎一身结实的肌肉塞在衣服里，然后辛辛苦苦地拳打脚踢击败五个竞争者来得经济。\n\
    \n发出“我牛X”这样的装X信号的姿势貌似花样胡编，花样百出，但究其本质，其实只有三种：\n\n- 展示自己的优势\n- 假装不经意展示自己的优势\n- 假装无优势\n\
    \n举个例子，晒照片秀你有一辆法拉利，是展示财富优势；晒照片秀你和一群朋友在吃饭，饭桌上，你的手边，不起眼的放着一个法拉利钥匙扣，则是假装不经意展示自己的财富优势；晒照片秀你和一辆别人的法拉利的合影，或是晒照片秀一个淘宝买来的法拉利假钥匙串不起眼的放在你的手边，是假装有财富优势。\n\
    \n再比如，晒照片秀你手捧着一本追忆似水年华，是展示你文化化的优势；晒照片秀你坐在沙发上，茶几上随便放着一本法文原版的追忆似水年华，是假装不经意地展示你的文化优势；晒照片秀你站在书架前，书架上成排的装饰用的假书，都是世界名著，是假装有文化优势。\n\
    \n从人性的角度，假装无优势很好理解，假装有优势解释了之后被人鄙视也好理解。但人类为什么还会假装不经意展示自己的优势呢？这种需求是从哪里来的呢？这是很多人对装X这件事感到最困惑的地方。\n\
    \n当人类为了生存竞争而展示优势，比如展示一身健壮的肌肉时，带来很多生存竞争方面的好处的同时，也会产生一些不利于生存竞争的缺点，比如说展示会让没有这种优势的人产生讨厌，嫉妒甚至是仇视的心理，这显然会增加生存竞争的危险。如果一个人有非常多的优势比方说假装不经意展示健壮肌肉的有意，说明他智商情商都高，这些是健壮肌肉之外的优势，是加分项。但这样一种假装不经意的装X手法被多数人看穿时，说明这个人活人太狠，智商不够高，所以被多数人看穿后，假装不经意地展示优势就反构成了一个丢分项。\n\
    \n## 那在商业演讲中应该如何装X呢？\n\n首先，\n\n如果面对的是所谓的“大众阶层”，装X就要强调一些性价比的务实方向。很多人会以针对“屌丝阶层”的产品宣传不需要调性，不需要装X；也有很多人认为“大众产品”是没法讲出调性和档次的，这完全错误的看法。在短期促销的时候也许不需要，但对长期的品牌建设来讲，“大众产品”一样需要档次和调性，并且一定能提炼出档次和调性的。\n\
    \n在商业发布会上宣讲时，你固然可以大喊“我们永远跟竞争对手强调真钱！”,也可以把同样的意思讲得非常有调性和档次：比如，“每一个清晨，每一个深夜，每一个分不清是深夜还是清晨的时刻，这个行业里的精英们在办公室里处心积虑的思考如何再提高一点点利润率的时候，我们的同仁在车间里慷慨痛心地琢磨怎样再降低一点成本，让利给我们的消费者。”\n\
    \n如果你的目标人群是一线城市的中产阶层，装X就要强调一些感性的，有态度的，有文化的，有追求的东西，而不是性价比之类的东西。\n\n比如会在发布会上抛出类似这样的问题：\n\
    \n> “在一个完美主义者者眼中，这是一个怎样的世界？”（这就实现了假装不经意地将自我已完美主义又，迁显示承托作为一个商业公司，思考产品问题的程度很深刻，不是每天只想着赚钱）\n\
    \n> “圆滑当道的时代，驱动一个团队保持它与坚持的，究竟是对冲的困境，还是理性的坚持？”（这个问题则说是我们这一次发布的坚果Pro手机的工业设计哲学，它是一款线条简洁克制，边角没有锋利的设计语言，但它传达出的问题它的传达出假不自然的迂回，它传达出了一个有调性，有文化，有追求的商业公司的态度）\n\
    \n再举一个例子，今年春天的发布会上，我们发布了一个漂亮的黑色手机，上面的机角上系着红色的细线黑色机，于是我们就在发布会上讲了一个“细细的红线”的故事。\n\
    \n克里米亚战争中的一场发生于英国人和俄罗斯人的实力悬殊的战斗中，处于明显弱势的英国人，身穿红色的衣服，排成一条绵细的防卫线，舍逆命的击散了强大的俄罗斯军队的入侵。在军事史上，留下了“细细的线”这样一个词汇。用来表示不屈服于强大的势利，顽强奋斗，直至迎来奇迹般胜利的一种精神。\n\
    \n在讲演说前的预热海报上，我们整理了一下历史上类似的以少胜多的著名战役，写了这么一个装X的问题：\n\n> “穿过马拉松、萨拉热所、库斯沃沃、特拉法尔加、巴拉克拉瓦、瓜达尔卡纳尔那些粗细的红线，代表的是怎样的勇气与力量？”\n\
    > （这个问题对应的是我们这一次发布的坚果Pro手机的一个特别版本的设计特性，它是一个黑色加红细线的男版设计，但这句话真的问题使这个问题同时假装不经意地传达出了一个有文化，有品位，有追求，还有不屈的奋斗精神的创业公司的形象）\n\
    \n演了之后，接下来我讲述了锤子科技，作为中国手机行业洗牌后为数不多的存活手机小厂商之一，同时也是硕果仅存的产品有有个性有创新意识的手机厂商，如何在强大不可更改的巨头面前保持奋斗，努力请求发展，并为消费者带来高度差异化的优秀产品的艰辛历程，和这个过程中的一些思索和总结。\n\
    \n最终这个“细细的红线”的故事讲得异常成功，感动了无数的人，也带来了非常可观的手机销售量，特别是红线版。无论是为了品牌建设，市场宣传，还是为了打动跟我们有着相同理想和志向的消费者，整体的效果都非常好。这个装的，完全可以打满分。\n\
    \n最后，一定要记住，演讲装X时，\n\n在互联网到来之前，在小范围内操作欺骗性装X还有一个相当大的生存空间。但在互联网和移动互联网时代我们的生活方式的今天，公开的操作装X风险很大，几乎一定会穿并成为笑柄。\n\
    \n![](img/3f2553c19e3d8036724ac589070714e0_101_0.png)\n\n罗永浩\n\n好，以上就是今天课程的内容，欢迎大家写下见闻之后的感想留言，我们在留言区一起交流。\n\
    \n## 罗永浩的创业课，与你12点见！\n\n![](img/3f2553c19e3d8036724ac589070714e0_102_0.png)\n\n\
    《罗永浩的创业课》到今天，开通2个多月。过程中我们经历过一次改版，还有好多次小的迭代，总之一直在改进，希望可以为你提供 更好的知识服务。\n\n从今天开始，我们的更新时间从原来的9:00将调整为12:00。\n\
    \n正午时刻，是一天时间的分水岭，创业者其实就一直站在这样的节点上——\n\n创业是场大逃亡，我们站在“生和死”的分界点上；创业是试错的过程，每个选择都在“成功和失败”的分界点上；创业的机会，既可能是风口也可能是陷阱，但是创业者却站在二者之间……\n\
    \n创业从来就没有中场休息，所以12点的钟声敲响的那一刻，我们马上要进入一天的下半场……\n\n我们12点见！\n\n用户留言\n\n## “我憋坏了”——关于重大改版和顺延播出两周的通知\n\
    \n![](img/3f2553c19e3d8036724ac589070714e0_103_0.png)\n\n《罗永浩的创业课》已经播出50期了。\n\n\
    刚刚过去的这个周末，我们在锤子科技总部一个神秘的房间，又一次见到了罗永浩老师。\n\n他硕大的身形，背对着我们，面朝著窗外。居然有一声轻叹。\n\n他说：\n\
    \n> 我憋坏了。\n\n震惊。\n\n众所周知，天生骄傲，谁敢憋他？\n\n他说：\n\n> 就是你们“得到APP”\n\n然后，转身，语气开始激动——\n\
    \n- 第一、有的话题，明明展开之后更精彩。而你们，每天只许我讲十分钟。怎么可以？\n- 第二、不能只围绕创业。把我当成商学院老师，我学不来；\n- 第三、面对一个录音机，而不是真实的听众和观众，我的状态还发挥得出来吗？\n\
    - 第四、你们得到APP的用户，学习起来是非常认真的，难道不应该给他们一些升级的服务吗？\n\n【聚源社首发 分享微信gwwh1361 每日更新】\n\n\
    嗯，罗老师批评得对，那你说咋办？\n\n> 就让我撒开欢做吧，我会让用户们比现在满意得多的多的多。\n\n那，您能透露一下，怎么撒欢吗？\n\n老罗又转过身去看窗外，巨大的身体被勾出了一道金边。\n\
    \n## 改版预告｜老罗的“大招”会包括哪些内容？\n\n![](img/3f2553c19e3d8036724ac589070714e0_104_0.png)\n\
    \n老罗最近正在继续“憋大招”，线下录制的活动正在张罗和筹备中，我们会在专栏持续预告这次改版的进展，同时在合适的时间邀请部分用户参与到活动现场。\n\n内容方面，我们会陆续放出内容预告，今天是第一批：\n\
    \n- 如何给产品和品牌起名字？\n  - 为什么说“准确”是起名字的首要原则？\n  - 为什么互联网公司起名字像动物园？\n  - 你了解品牌营销中的“定位理论”吗？\n\
    \  - 老罗为什么要用“锤子”作为品牌名称？\n- 怎么样让品牌占据用户心智？\n  【栗瀚社首发 分享微信glwi1361 每日更新】\n  - 老罗是怎么理解和解读“定位”理论的？\n\
    \  - 锤子希望在用户心智中占据什么样的位置？是公众认为的“天生骄傲”、“工匠精神”、“情怀”还是别的？\n  - 老罗在占领用户心智上，有没有什么独门的秘诀和方法？\n\
    - 创业者怎么洞察未来的趋势和变化？\n  - 什么样的大企业，你有机会挑战他？\n  - 什么样的对手，是可怕的对手？\n  - 什么时候应该看数据？\n\
    \  - 什么时候靠洞见？\n  - 什么时候该听用户的呼声？\n- 中国的创业环境有哪些优点？有哪些不足？创业者应该如何理解，如何利用？\n- 随着公司越来越大，创始人在公司里的作用会发生什么样的变化？\n\
    \  - 创始人在不同阶段应该怎么调整自己的角色？\n  - 如何做好“事必躬亲”和“放权”的平衡？\n- 为什么投资人通常会倾向于给哪些屡战屡败但愈挫愈勇的连环创业者投资，难道有破产记录的创业者不会丢分吗？\n\
    \  - 为什么说二次创业比首次更容易？\n  - 连续创业者有哪些优势？\n- 为什么牛X的企业家能做到“处变不惊”、“临大事有静气”？\n  - 他们究竟是“先天性牛X”，还是“获得性牛X？”\n\
    \n……\n\n除了上述问题，什么关于改版你还想知道的都可以留言告诉我们。\n\n欢迎在留言区告诉我们，8月8日见。\n\n《罗永浩的创业课》编辑团队\n\n\
    比如说，西里尔（Cyril）和约翰（John），在英文里，人们一听就觉得西里尔是个鬼鬼祟祟的家伙，而约翰是个可以信赖的人。\n\n如果中国人对英文的名字没感觉，那就看看中文的吧，“刁得胜”和“郭正年”，你觉得谁好为人呢？\n\
    \n翻译过来的英文姓名也是一样，比如玛丽莲·梦露，实际上梦露这个姓“Monroe”，就是一个常见的姓，我们都通常译成“门罗”。美国以前有个总统，就叫“门罗”。你看看，如果写成“马力和·门罗”，就完全没性质了。\n\
    \n中文的姓氏里，一个人如果姓“刁”、姓“赖”、姓“皮”、姓“苟”、姓“牛”，姓“羊”，可能比较难取出好听的名字，尤其是女孩。但要是姓“柳”、“云”、“苏”、“乔”、“燕”之类的呢，随便起个名字，哪怕只是个数字，都显得挺优雅的。\n\
    \n姓“苟”的人，古代的时候很多都姓“敬”，大多是因为一些历史的悲剧才被迫切改姓“苟”。很多姓苟的人在成长过程中都稍微受过很多不必要的痛苦——2008年，河南省某个村子的很多姓苟的村民，为了不再遭受那些无端的侮辱和嘲笑，也为了给孩子们不必再面对这些，集体改回了敬这个姓，可见名字对一个人有多重要。\n\
    \n普通都人这样，演艺界的明星的名字就更重要了，刘德华本来叫刘福荣，不改名字想红是不可以，但确实会比较费劲；张国荣的本名叫张君贤，听起来比刘福荣也好不到那里去；冯德伦的原名就更夸张了，叫冯进财。\n\
    \n吴红巾和张爱军两位艺术家，当年前后脚来到北京后，不约而同的把名字改了，分别改成了“左小祖咒”和“张玮玮”，这才一个成了地下音乐教主，一个成了著名民谣歌手。如果吴红巾还吴红巾和张爱军会怎么样呢？我不知道，但我相信他们俩都不应该瞎这样的险。\n\
    \n说了这么多，你一定要弄明白，创立一个手机的品牌叫“锤子”，基本上是一个愚蠢的、自杀式的行为。\n\n我可以非常沉痛地告诉你，你以后创业的时候。\n\n\
    那样起一个好名字呢？我根据创业经验和读书学习的总结，简单归纳了这样四个点：\n\n- 准确\n- 好听好记，有辨识度\n- 便于传播，有个姓\n- 要兼顾价值观和政治正确\n\
    \n今天我们要谈的，就是其中的第一个，也是最重要的，就是准确。\n\n特别是功能相对单一和简单的产品的品牌，起一个准确的名字相对比较容易，所以一定要想办法保证这种准确性。\n\
    \n一个品牌的名字，只要准确了，就有80分，甚至90分了。如果还酷一些，或有意息一些，那当然是额外赚的，但千万不要为了酷一些，有意恩一些，牺牲了准确。\n\n\
    你是卖洗衣粉的，就叫立白；你是分发新闻的，就叫今日头条；你是烤面包的，就叫唯多美；你是做汽车的，就叫奔驰；你是卖家具的，就置宜家。这看上去好像毫无特点，既不酷，也不文艺，但这样的名字最直接、最准确的。\n\
    \n很多人有一个误区，尤其是自以为有文化、有品位的文艺青年，喜欢起一个自以为是很有很有文化，或者迷信什么，好的寓意，结果起的名字完全不准确。那么这个名字基本就是失败的。\n\
    \n你会发现，老牌企业，比如中国的百年老店，它们的品牌名，完全不需要讲究准确。比如全聚德、瑞蚨祥、内联外、盛锡福、隆庆祥……如果你从前听说过这些品牌，谁是谁，你不可能分得清楚是卖鞋的，谁是做帽子的，谁烤鸭子的，谁是做眼镜的。这有可能来自于当时的商业模式和传播方式，也有可能是商业经验不足造成的。\n\
    \n在今天这样的时代，做那些功能简单的产品，你起这种面目模糊的名字，如果你不是一家已经由于种原因成了名的老字号的话，一定是相对吃亏的。\n\n另外，除了这种不知所云、面目模糊的名字，还有一种“不准确”，是你的名字让人误会。\n\
    \n比如美国有一家很大的航空公司，叫东方航空，曾经是美国第四大航空公司，后来倒闭了。实际上飞全美，而且有很多国际航班。但很多消费者都以为它是一个地区性航空公司。\n\
    \n类似东方航空公司的，还有美国西北航空公司，全盛时期是全美第五大航空公司，但是听起来也像个地区性航空公司。后来也是逐渐走下坡路，2008年申请破产保护，2010年并手达美航空。\n\
    \n在中国，只要一家航空公司叫东方航空，就不会有问这样的题。因为“东方”在中国有特殊的意义，它显得很大。但如果你叫南方航空呢，人们也就会认为它只飞南方的航线。很久以前我就这么认为的，但其实在东北老家也能看到南航的飞机，那时候我每次看到“南方航空”的飞机，怎么不觉得这些在南方混的飞机，怎么又跑这里来呢？\n\
    \n最后，在这个小介绍一下，我们年底前即将发布的三个新产品，采用的是一独立品牌，它有一个极其准确的名字……它是如此地准确，以至于你会认为……具体是什么，我先不剧透了。\n\
    \n![](img/3f2553c19e3d8036724ac589070714e0_105_0.png)\n\n罗永浩\n\n好，以上就是今天创业课的内容，欢迎你写下听完之后的感想留言，我们在留言区里一起交流。\n\
    \n![](img/3f2553c19e3d8036724ac589070714e0_105_1.png)\n"
