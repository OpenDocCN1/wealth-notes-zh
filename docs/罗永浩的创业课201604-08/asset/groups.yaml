    第三种，直接起个洋名字，不说是外国的。这种也不可说就是骗子，但心里也是肯定的。被抓到可以说，我也没说我是外国的呀。服装品牌里，这种情况尤为常见。比如中国熟悉的波司登、戈斯蒂邦威等等，都是这种情况。


    第四种，去国外注册一个空壳子公司和一个洋名字回来，自称是外国品牌，必要时再到香港注册一个进岀代理商公司，自称该品牌的大中华区总代理。比如当年京东那套穿叠就是这么发展起来的。这种当然也不能直接说是骗子，但肯定是心机很深的了。被抓到可以说，奇怪，我骗你们什么啦？我确实卖外国公司的外国品牌呀。这种套路精英细作到了今天，还多了些细节，比如必要时找一个真正的外国人做联合创始人和CEO，自己做董事长；比如必要时用庞大的钱款做自家品牌的使用授权；比如必要时用庞大的钱款收购一个国外公司或国外品牌。细节做到这个份儿上，你已经完全说不清是不是假装弄鬼了。


