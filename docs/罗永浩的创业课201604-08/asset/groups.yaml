    比如线条特殊的甲壳虫和 MINI Cooper：


    ![](img/3f2553c19e3d8036724ac589070714e0_115_1.png)


    这些车都是在造型本身下足了功夫，以至于你不用看 Logo，老远就能认出是它们。而且作为在这方面非常专业的厂商，它们多年来，无论如何调整外观方面的细节，它们始终懂得保持自身造型独特的视觉元素，最终从视觉上深深地植入了消费者的脑海。远看的看，面目模糊，样子随大溜，让人记不住形象的车型，在工艺上生产出忠诚度的，谁会固执地一再选择某一种自己都想不起来长什么样子的车呢？


    虽然在整体造型上很多厂商并没有有意识地继承和发展一些自身固有的设计语言，但在汽车前脸这，多数厂商还是很注意继承和发展的。只是单靠一个前脸，很难做到像前面提到过的那些车一样，从任何角度都能一眼认出。


    20世纪10年代，一家糖果厂商本来要将薄荷糖压制成规则的圆形，但是发现如果压制过程中，在中间留个孔，生产工艺上就会顺利很多。于是它们干脆就留了一个孔，做成一个漂亮的圆圈饼，并且把这个薄荷糖命名为
    Life Savers，也就是美语里的“救生圈”的意思，然后在广告和包装上都大力宣传这是一种“中间带个孔的薄荷糖”。上市之后，大人小孩都喜欢，立刻风靡了美国，虽然它的味道跟别的薄荷糖几乎没有差异。


    ![](img/3f2553c19e3d8036724ac589070714e0_115_2.png)


    当其他薄荷糖都是千篇一律的小圆片的时候，小朋友们无比热爱这个救生圈一样的薄荷糖。多年以后，著名的食品厂商雀巢的英国公司，不知道是山寨了还是得到了授权了救生圈薄荷糖的这个创意和造型，生产了一种叫“宝路”的圆圈型薄荷糖，宣传语也是中间有一个孔的薄荷糖。由于种种原因，数生圆圈薄荷糖好像一直没有进入中国，整桔几代的中国孩子，都是吃着宝路薄荷糖长大的。


    ## 二、用包装打造视觉锤


    昨天我们提到了可口可乐经典玻璃瓶包装的巨大影响，那在中国有没有这样高辨识度的饮料包装呢？


    屈臣氏包装的瓶子肯定要算一个，农夫山泉的小红帽也算一个。电视台的节目经常会把嘉宾喝的矿泉水的包装纸拿掉，但你看到一个透明的瓶子上有一个小红帽，就知道那是农夫山泉。这些虽然都没有可口可乐的瓶子形状那么讨人喜欢和经典，但都是非常成功的例子。


    信远斋的杨梅汤包装，选择装在一个圆鼓鼓的小坛子一样的玻璃瓶里，容量比普通的塑料瓶小很多，但依然很受欢迎，被消费者亲切地称为“小地雷”，也是很成功的视觉锤设计，不过很多人记不住它的品牌“信远斋”，这并不
    是好事。


    ![](img/3f2553c19e3d8036724ac589070714e0_115_3.png)


    在中文里，“包装”这个词有两层意思：


    - 1. 指装有你的产品的那个盒子、瓶子、袋子等；

    - 2. 指推广、传播、宣传产品的手段和打造品牌形象的方法。


    很多创业者在给产品做包装时，只是把产品简单地装进一个袋子或盒子里而已，忽略了第二层意思，这是很可惜的。


    比如 2000 年前后风靡美国的一款饮料——维他命水，包装设计就很独特。作为一款饮料，它的瓶身以及上面的印刷风格都被设计得像药剂一样，这是为什么呢？因为美国人民饱受高糖分碳酸饮料的困扰，生活在“肥胖大国”的集体焦虑之中。而维他命水横空出世，强调自己“维他命+水”的健康水剂定位，是逢应其时的一个合理产物。它的包装完美地契合了这个定位——它从来没有说过自己不是药，也没投资这一说法。但这种药剂一样的设计，却巧妙地对消费者产生了心理暗示——它对我的健康有好处，它能解决问题。


    ![](img/3f2553c19e3d8036724ac589070714e0_115_4.png)


    实际上，用心设计包装，始终都是一个有效建立视觉锤的方法。锤子科技虽然不止一次得到过包装方面的国际奖，我也很早就接触过它对视觉锤的理论，但在后来的工作实践中，由于种种原因，还没有建立一个强大的定位和鲜明的视觉锤，这是我录制这个得到课程时感到非常惭愧的。


    ## 三、用人物形象打造视觉锤：是个好主意吗？


    今天要谈的最后一个问题：用真实的人物形象来充当视觉锤，是不是个好主意？


    这个问题要分两种情况来看：


    - 1. 用明星代言，甚至用明星来做视觉锤；

    - 2. 是用创始人的形象来做视觉锤。


    ### 1. 用名人来做视觉锤


    是一把双刃剑，名人效应大家有目共睹，在每个时代，各大品牌都在争夺最红的明星来代言。但这样做有三个风险：


    - 如果是当红的明星，很可能会代言很多种产品，所以你在视觉上，对这个人的形象不具有独占性，很难形成一个让人印象深刻的视觉锤。现在你打开电视，广告里基本上来来回回就那几个偶像明星，每个人都有十几个产品的代言，消费者真的分不清、记不住，即使是这些明星的铁杆粉丝。

    - 典型的例子是让一个特别有钱的明星去代言一个廉价产品，消费者不会信服。美国消费者就曾经很不信服：“老虎”伍兹平均每年赚6000多万美元，他怎么会开他代言的别克汽车呢？

    - “老虎”伍兹，他后来发生的事，让他代言的品牌都只想尽快跟他解绑。中国也有这样的例子，我就不展开谈了。


    所以整体上，请明星代言问题不大，但用某一个明星做长期的视觉锤，是值得慎重考虑的。


    ### 2. 用企业创始人的形象做视觉锤


    在今天，我们看到越来越多的创始人来到台前，去出镜、去演讲、去发布产品。锤子科技也一直被认为是使用这样一个策略的。那么，这是不是个好主意呢？


    创始人本人的形象成为这个品牌最经典的视觉印记，有一些成功的例子，美国有肯德基老爷爷，中国有陶华碧老干妈。你还能想起来几个？全世界那么多品牌，能随随便便就想起来的一共也没几个，这通常说明用创始人形象做视觉锤，并不是一个很好的选择。


    肯德基的桑德斯上校，看起来就是一个在肯塔基州勤勤恳恳做饭的老爷爷，穿一件干干净净的白色上衣，笑容慈祥无公害，西方人看到他，就像看到了自己的爷爷。


    老干妈罐子上的陶华碧女士头像，你看到她，就像看到了一个典型的“中国母亲”。李安当年拍“父亲三部曲”，三部全部找台湾演员郎雄来演父亲的角色，李安说，郎雄这张脸，完全就是一张中国父亲的脸。


    陶华碧女士在辣酱瓶子上的形象也差不多，还戴了一个围裙。中国千千万万个家庭里，每天为儿女做饭的母亲，就是这个样子。大家可能注意到了，她并没有像肯德基爷爷那样露出亲切的微笑。实际上，那一辈的中国父母，不管是不是千的，多数面对镜头，都是这样略带紧张和腼腆的样子。所以说，老干妈的这张照片，完全可以击中每一个中国人的心。这几年陶华碧女士经常坐着超级的豪车，一身貂皮大衣出席两会，媒体发了一些她的图片，让网民很吃惊。如果把她的今天的样了，做成瓶子上的Logo，就完全没有效果了。


    我讲肯德基和老干妈的这两个例子，是想说明：用创始人的面孔做视觉锤，操作起来难度很大。


    - 相信多数的创始人都做不到这一点，何况要几十年如一日的做到，就更难了。


    一般说来，从风险控制的度，用去世后的创始人形象做商标和视觉锤会安全一些，但科技行业就很合适。


    好，以上就是今天内容。我们明天再見。

    '
