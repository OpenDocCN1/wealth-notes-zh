    但从另一个角度，乔布斯决定做革命性的手机之前，一定会看手机的市场调查数据，看看美国和全球一手机能卖出多少台手机，看看大家在手机上使用上的需求和痛点是什么，手机除了是手机当时的那种形态，它还可以是什么样子等等。开做这种革命性的手机之后，即便它卖得非常好，好得要命，乔布斯也会继续看市场调研数据，看大家最满意的是iPhone
    的哪几个方面，最不满意iPhone 的哪些方面，然后根据这些相应地做出调整。就像福特造汽车之前，也会看看城市交通工具的需求量是多少，比如纽约一年能卖出去多少辆马车之类的。如果开售之后，会去看消费者的满意度和吐槽率之类的调研结果。


    所以，所谓的不做市场调查，是指


    这方面不需要做调研，做了也得不到有价值的意见和反馈。但除此之外，


    # 2. 为什么不挣钱的项目能融到钱？


    有些项目，外行人看来完全不挣钱，比如共享篮球，为什么还能融到大笔的投资呢？


    共享篮球我没研究过，不便乱讲。但给大家造成这类感受的事情其实还是很多的，大家总说，某某项目显然是如此的靠谱，为什么还能融到那么多钱？常见的原因无非是这样：


    +   1. 有些项目的商业逻辑比较复杂，难于理解，所以只有一小撮投资者能看懂。大家看着的这些项目看起来起来的现象，没有看懂在在东西的早期，就会因此产生误会。


    +   2. 有些项目因为项目本身以外的某种原因，拿到了某个明星机构的投资，就会有一群无头苍蝇里的投资者跟进，特别是在这些项目的早期，因为跟投的风险很低。


    +   3. 有些项目处在某个大的风口方向上，这时候，会被提到该风口上的好项目上的投资者，会补偿性地投些一二类项目的二三类项目，甚至是把项目拿来赌自己没错过风口。顺说一下，有些投资人是真傻，其实是装傻。年纪绝高的都是，风险资本家个个都是绝对的精英，都是人中龙凤，都是揣着大把钞票并且教养良好的高学历海归财神爷，其实他们多数都是帮财神爷打手的投资经理。跟绝大绝大多数社会类的群体或组织一样，都是百分之二十的精英带着百分之八十的平庸者往前奔。所以


    +   4. 共享篮球我不清楚，但很多统计数据表明，中国的创业公司宣布自己融到了多少钱的时候，大多数都是水分有的。很少像锤子科技这样，老实到让了解真相的人都感到心疼的创业公司。


    # 3. 创业以后还会回公司上班吗？


    是不是自己创业了，无论结果如何，都很难再回公司上班了？


    倒也不至于，创业公司三年内倒闭的几率是百分之九十左右，但从二次、三次创业的人却没有那么多。那些人都到哪里去了呢？肯还是上班去了，就不甘心的。


    但同时，很多创业过的人也确实深刻的感受到，创业这东西，就像抽烟或吸毒品，要真正戒掉是非常困难的。就算被迫戒掉了，但总有复吸的机会，还是合蠢过程，心痒难吸。所以最好想办法，创业不管多艰难，咬牙坚持，不要放弃，就过去了就好了，免得将来天天都是找人交战。


    # 4. 该不该倾囊相授培养新人？


    倾囊相授地培养了一位新人，可对方学到东西就要走人，该怎么办？难道下次面对新人，还要刻意保留？非常纠结。


    不至于吧，21世纪了，大家能有什么独门秘笈，到了要刻意保留，传子不传女的程度上，我想无非就是以下几种情况和对应思路吧：


    +   1. 如果这种情况偶尔发生，我倒意是，不至于因此就不教新人了。如果不教新人，你时间不够用又事事亲力亲为，累死了也是很难省自己。如果是复制发生，就可以考虑推给自己了。为什么倾囊相授的人总也留不住？是不是自己待人的方式有问题之类似的。


    +   2. 对方狼心狗肺，天性凉薄，人品有严重问题等等，但一般说来，这是小概率事件，不至于因此就不教新人了，因噎废食，因小失大，都是不明智的做法。


    +   3. 对方有某种不得的难处才被迫走，所以看起来就像是“学到东西就要走人”，但其实有可以理解的原因。亚洲人辞职的时候，很少会对公司说真正的辞职原因，所以也不能强求对方告知真正的原因，只能互相理解理解。


    最后，我以前也讲过类似的内容，我再次再喂一遍，那就是，留不住人才，一定要留点香火情，千万不要因为留不住而恼羞成怒，撕破脸皮，说伤感情话之类。锤子科技创业五年，有些过程中留不住的优者，又重回来发挥重要甚至关键作用的，有好几个。创业者的心胸和度量，要能撑船，能撑航母，能开无人驾驶汽车，不能自己带出来的徒弟伤。


