    # 所有人问罗永浩之第1天


    欢迎来到我的干货日记。


    再次说明下我们的玩法：


    专栏正式的上线时间是5月15号，也是锤子科技的五周年生日。


    不过，两天时间，已经有1万多名用户提前订阅了这个一个月之后才开始更新的专栏，多谢各位支持。我也会送出一些特别的福利：


    +   1、优先提问。


    你们可以在留言区给我留言，关于最想了解的问题创业问题，你100%都可以问，我99%都可能回答。专栏正式上线后，你的问题可能被收录进“干货日记”的某一章里，你的名字也会被所有的订阅用户看到。


    +   2、优先互动。


    这个春季，我会发布一款新的锤子手机。任务不小，但咱们的专栏既然已经开始预售了，那么，每一天，


    我相信，这是一个可以听到所有用户声音的直接渠道，我也相信，大家的反馈对我和我的创业，也是一个启发，教学相长。


    这些，都是提前订阅者才有的福利。


    来看今天我挑出的3个问题。


    ![](img/3f2553c19e3d8036724ac589070714e0_0_0.png)


    # 今日最佳提问


    ❶ 大佬级创业者和想创业的人占不到10%，你这么明确地把专栏定位在这些少数人身上，担不担心专栏的销量？与之相似的是，一个创业公司去选择自己的消费人群的时候，应该秉持怎样的原则？


    ❷ 老罗你好，作为一个过来人，如果在创业路上只选择一个必须躲过的坑，你觉得会是什么？


    ❸ 我是一名做互联网产品用户体验设计的，极致的用户体验往往会把开发逼疯，但大多数时候用户体验是个玄产品感和站在用户角度思考的工作，经常很难说服开发同事。您在打造极致的用户体验过程中，如何感染大家和您一起奔头并进？


    ![](img/3f2553c19e3d8036724ac589070714e0_0_1.png)


    如果你也有好问题，请到「得到」App专栏《罗永浩·干货日记》提问'
