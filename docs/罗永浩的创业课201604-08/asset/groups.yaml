    ## 演讲中的感情与激情


    们在表演时，当然要听众进入你希望引入的某种情感状态中。但是，


    ### 2. 一个好的演讲，不能光强调要演讲者有感情


    感情不恰当，甚至会让人产生强烈的生理不适。


    为什么有些感情表达方式，不用听完内容，你光听声音首先就会生理反应？我们知道，人是社会化程度最高的动物，无论是逃避危险还是分工协作，都需要发达的情感感知能力和识别能力，所以人依赖从声音、表情的细节里感受情绪的真伪。


    所以，一个人表达感情的方式让你觉得很虚假，你甚至没注意听它的内容，光听声音就会让你产生不适的生理反应。


    ### 3. 区分恰当真实的感情和不恰当虚假的感情表达


    中国娱乐综艺节目，有段时间非常流行主持人讲港腔。到了今天，我估计听我专栏的很多人，特别是年轻一些的，都不会觉得有什么让人反感的，除非是某个东北主持人突然往外冒东北味儿特别浓重的港台口音。


    但是我们的很多长辈，很多退休老同志，听到港腔，即便是非常纯正的港台腔，即便听到港味的主持人说话台腔，也会觉得特别矫揉造作，特别反感。这些反感港腔的老同志们，却又非常喜欢中国大陆特有的那种抒情范儿，中央人民广播电台，或是中央电视台里，某些节目的主持人的那种抒情风格。今天的年轻人听了，恨不得原地爆炸，但很多退休老同志听了却觉得这种腔调特别真诚。


    这两个例子说明，


    假如你做一个听助器或老年花的发布会，那也许你应该考虑学习倪萍、朱军这些主持人的感情表达方式，不但声音要显得饱满深情，手也要像张国荣唱歌时一样，每隔一分钟就得向上摊开一次，从胸前向外缓缓地伸展，最后划出一个四分之一的圆。


    ### 4. 光有感情还不够，要用激情把感情传递出去


    一个经验丰富的职业演讲者，即便是在同样的内容重复几十上、上百次的演讲时，也能保持激情澎湃的表现，这会让大多数只讲了几次同样的内容就感到演讲时提不起精神的人非常绝望，不知道这些职业演讲者是吃了什么药才能做到这样。


    大多数正常的人，显然都不具备能随时调动激情天赋。如果你也是这样的人，不用灰心，因为演讲时激情饱满并不需要一定有这种的天赋或或是吃药，它是可以通过技术方法实现的。


    大家应该注意到这样一个现象。餐馆、保险公司、房地产公司这类高度依赖销售人员情感的作业，往往都会在开始营业前有个集体的情绪波动仪式，要就是一起大声唱什么《真心英雄》、《感恩的心》这种可热的歌，要么就是一起大声朗诵顾客就是上帝之类的口号或者其他短篇的鸡汤。


    我们在旁观时，往往会觉得这是一种很傻的洗脑教育。但实际上，类似的行为，对于服务人员开工前的情绪调动、尽快进入状态，从中提高服务水平，几乎是不可缺少的。只是因为，你感觉情绪很消沉，意识感受到的少。只是因为你企业化、服务不同的阶段，以及从业人员素质的差异，表现出来的方式有很大的不同而已。


    ### 5. 外在行为能调动起感情和激情


    心理学家威廉·詹姆斯的理论对此有很好的解释。威廉·詹姆斯很早就发现人的意识、行为和感觉之间的关系：


    > 我们的意识可以控制我们的行为，比如你的意识想控制你抬起你自己的一只手臂，你可以轻松地做到，这是意识控制行为。但我们的意识却不能直接控制我们的感觉，比如你想让直接控制你的感觉，让你心情好起来，是做不到的。但你可以改变我们的感觉，比如有时候明明心情很糟，但我们看到那些心情很好的朋友拉着你做一起做一些欢快的、大呼小叫的、蹦蹦跳跳的行为，你的心情就会莫名其妙地好起来。也就是说，最终，我们可以实现


    服务员上岗前的集体打鸡血仪式，就是不自发的运用了这一个原理，有意识地控制自己做唱歌或喊口号的外在行为，让这种外在行为影响到自己的感觉，上岗前就进入一个非常热情的待服务状态。


    那些职业的演讲者，即便是做同一个内容的第一次重复演讲，即使上台前都重复了一遍自己的内容，内心是难过和崩溃的，真正走上台时，也许是让自己的外在行为表现为，脚步轻快，满面的笑容与自信，有些甚至会一边大喊，一边对着台下的观众热烈挥手，做出一种“我看到这场演讲已经等了整整两年了”的样子。台下的观众也很快就会被这样的热情举动所感染，整个场面都会跳起来。和演讲员的上岗前仪式的作用有高度类似，演讲者的这种做法，就是一种的方式。


    无论是重复一百次同样内容的演讲者，重复一千次同一首歌的歌手，还是重复一场同样机械劳作的餐厅服务员，每次上台和开站前，都要用这种方法让自己燃烧起来。很多在台上看去特别燃的演讲者或歌手，对付他们在台后的工作情，热情未必会比服务员对点餐的工作热情更高，他们的激情澎湃，不是来自天赋，而是掌握了专业的方法方法后的合理结果。


    最后，我想对那些有志成为优秀演讲者的


    最后，我想对那些有志于成为优秀演讲者的人想说的是，


    很多人会认为，演讲中那些精彩动人、触及心灵的瞬间都是精心设计提前排练出来的，我可以负责地告诉你，不都是这样的。


    有些情不自禁的感慨，是不会在你坐在办公桌前写演讲稿时自己跑到你的脑子里来的，只有当你真正站在台上，在强烈的聚光灯下，看到或感觉到前面有无数期待的眼神时，皮肤能感觉到场馆内的炽热温度时，你才会被一种东西突然击中，说出这样的话：


    > “如果有一天，我们的产品卖出了几百万上千万台，连那些黑我们的傻×都在使用时，你要知道，这是给你们做的”。


    # 今日得到


    - 你要让听众被感染，首先你自己得要进入特定的感情状态，你的语音、语速、语调都必须能准确传达你想要的感染效果。

    - 一个人演讲时什么样的感情表达方式才是正确的，其实取决于他想打动的听众是什么样的人。

    - 演讲光有感情，光有正确的感情还不够，还得有激情，否则，你根本没有能力把感情传递出去。

    - 演讲者可以用外在的行为改变自己的感觉，调动自己的情绪，让自己演讲时充满激情。


