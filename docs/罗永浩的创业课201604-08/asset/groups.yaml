    \n最后，还向你发出一个小请求：\n\n![](img/3f2553c19e3d8036724ac589070714e0_84_0.png)\n\n附录：《罗永浩的创业课》全年课表\n\
    \n点击图片即可保存课表至相册，随时随地掌握课程进度。\n\n![](img/3f2553c19e3d8036724ac589070714e0_84_1.png)\n\
    \n倒也不一定要那么那条，但是如果你本不太擅长讲故事的话，尝试这么做也没什么不好。\n\n先试着按自己的感觉写故事，凭感觉写作时，和对照片章这件事不要一起。不要边写边对照，写故事的时候不要想着那些细节。这件事最后应该是融会的结果，而不是靠边写边记着的方式。没有哪个作家写故事的时候对着写作技巧手册，这肯定会影响创作的状态。\n\
    \n写完了还是按感觉看看效果好不好，如果一切都很好，可能就不需要琢磨这个清单了。如果感觉有些地方不对，那就拿出清单看看，找找有没有跟基本原则相矛盾的地方，如果有，再做相应的处理。\n\
    \n然后下次写一个故事，还是重复这个过程。多重复几边后，你训练足够的话，将来写故事的时候如果有一些方法论上的错误，你第一时间就会感觉到。\n\n有一种广为流传的说法，面对投资人讲方案其实就是讲故事，您怎么看？\n\
    \n当然就是讲故事啊，投资人在自己的圈子里也是这么说的，他们经常说的就是，某某项目的故事不够大；某某项目的故事讲得好，很有想象空间；某某项目的故事，我觉得不成立等等。\n\
    \n因为早期的投资人面对创业者，既看不到业绩，也看不到产品，跟你这个人又不熟。你要知道，人和人之间，要彻底弄熟了，可能需要几个月甚至几年的相处。投资人天天都要一堆创业者，不可能有这样的时间成本。所以基本上就是听你讲这次故事，然后决定给不给钱的。你给投资人讲的，除了行业现状和前景分析，产品或服务是否存在市场需求，商业模式是否符合逻辑等这些百分比已知的东西之外，其他的基本都是讲故事了。\n\
    \n那这个故事怎么讲呢？跟我们前面说过的演讲的原则，或讲故事的原则，是差不多的。\n\n比如说，你要投资人吹牛，为什么呢？\n\n当然，这并不是说你要瞎吹一气，你吹的东西要经得起推敲；而是说你要在逻辑上可以说得通的大前提下，尽可能往大了说。\n\
    \n再比如说，你讲的故事要有细节，投资人会通过这些细节来判断你是一个什么样的人，你是否适合做这个项目等等。\n\n再比如说，你要跟投资人表现出对创业项目的激情，因为投资人希望看到创业者是热爱自己所从事的事业的。\n\
    \n另外，顺便说一下，我觉得在一些领域，很多人对“讲故事”这个说法比较敏感，是因为中英文的“故事”这个词的语感差异导致的。\n\n在过去的中文里，我们通常不会把“讲故事”这个说法用来形容一个非虚构的事情。而现代的中文，受西方影响比较多，所以在很多地方出现类似英文的语感，习惯了的人会觉得很正常，不习惯的人会觉得奇怪。我想大概就是这样吧。\n\
    \n乏情感当然不好，泛滥的情感一样不好，最好的效果就是内敛和克制的情感，更有深沉的力量。\n\n# 罗永浩\n\n![](img/3f2553c19e3d8036724ac589070714e0_86_0.png)\n\
    \n好，谢谢这几位同学的提问，如果你在创业中有什么困惑，或者有什么想和我分享的，都欢迎在留言区留言给我。\n\n我是罗永浩，感谢把我的创业课分享给你的朋友，我们明天见。\n\
    \n# 留言精选\n\n制，如果你想一定要做一半部分是张涨涨，而另一半部分就就关心你。但是《张潇雨·商业经典案例课》里讲过，对于一个产品来讲，有100个非常狂热的粉丝，比有10000个觉得你还OK的人好得多。不知道罗老师如何看待这对矛盾。可能这两件事根本不构成矛盾，我有点分辨不清。\n\
    \n我觉得这两件事之间没有必然的联系，更谈不上构成矛盾。一个分寸控制的演讲者完全可能有很多狂热的粉丝，一个情绪激烈的演讲者也完全可能没什么粉丝，或者就算有也不狂热。\n\
    \n另外，我前面说的克制，是指演讲中处理情感因素时不能亢奋或不要弄得太煽情，免得让人变得肉麻或恶心。但这不意味着不能表达鲜明的态度、坚定的意志、澎湃的激情等等。\n\
    \n还有就是，我前面的建议是比较普适的，适用多数的正常情况，也没有明确反特受众次。举例来说，你是对一群很酷的粉丝做演讲，并且想打动他们，那很可能你讲的越肉麻越好。\n\
    \n罗老师，演讲者讲故事，动情到把自己讲哭了，是不是个好事儿？\n\n这个问题很有意思。不能一概而论，如果你是事先精心设计的，并且演技很牛，一般说来，效果会很好，但风险是如果观众听出来你是表演，你就彻底失去信任了。其实这就是造假，欺骗感情，后果很严重，它和人品的其他诚信问题一样，本质是人品问题，对这一个一定要保持自我警惕。\n\
    \n如果你没有造假，只是现场控制不住情绪才哭了，那同样的，效果会很好；但坏处是情绪失控可能会牵连演讲的其他环节也失控，而出现不确定因素。一场成功的演讲，要尽可能做到一切都是可控的。所以一个演讲者不管对对自己要讲的东西是否有热情有激情，还是要尽可能控制自己的情绪。\n\
    \n以我个人的经验为例，我多年的演讲生涯中，虽然有过情绪激动的情况，但还没有过像这次的坚果PRO发布会那样，连续两次哽咽着说不出话来的经历。当天晚上，我确实是比较激动和亢奋的状态，这带来的直接后果是，我们事先准备的演讲多次出现失控的情况，包括严重的临场串词出错等等。因为情绪不稳定，我还很不得体地在一场有直播的大型活动上讲了很多脏话，这些都是不能控制情绪的副产品。\n\
    \n如果一个故事自己已经讲了很多遍，再讲可能有些提不起精神，如何在每一次讲起的时候保持饱满的情绪，就像第一次讲的时候那样？\n\n这个问题很好，这就涉及到一个人的敬业精神和职业素养的问题了。你要知道，在传统的相声行业，一个段子要练到登台表演，可能要练过上百遍甚至几百遍才行。理论上，相声演员登台表演的时候，应该对这个讲过上百遍的段子已经快吐了，但他们总是热情洋溢，满面红光走上去开讲，这就是传说中的敬业精神啊，很了不起。\n\
    \n职业的演讲家也是一样，有时候同样的内容常常要讲上几十遍、上百遍，理论上一定是会起排斥的。但是职业素养和敬业精神，可以使每一个人每次上台前都提一口气，把精神状态调动起来，假装热情洋溢的冲上去。\n\
    \n听起来很不容易是吧？是这样的，你把任何一件事情做好，做得比大多数人更好，确实是很不容易的。但好消息，你在台上假装热情洋溢地讲一会儿，你的行为就能改变你的感受，你会真的兴奋起来，再接下来就容易了，因为你不用装也能神采奕奕地讲下去了。\n\
    \n那为什么会出现这样的情况呢？我们后面的课程里，讲到关于“要有激情”的部分，会详细讲到一些心理学方面的理论的解释，在这里就不展开了。\n\n老罗，为了准备每年若干次的演讲，你平时会做素材积累方面的工作吗？有什么经验？\n\
    \n当然，如果你的工作当中，做演讲是一件比较重要的事情，你一定要养成平时随手收藏和整理演讲素材的习惯。\n\n我会使用一个 GTD（Getting Things\
    \ Done）类的软件来搜集整理，比如 Things，我原来常用 Things 的简洁易用。后来我自己做了并且不再用 iPhone 之后，因为 Things\
    \ 没有安卓版，可以改用了 Wunderlist，这个软件有中文名，叫奇妙清单，是一个全平台的软件，可以用到安卓、iPhone、PC 和 Mac 上，网页版也有，很好用。\n\
    \n平时想到什么适合未来演讲中用到的想法，我就随手记录下来。看到某人说了一句特别有洞见或者精辟的话，我就随手记录下来；看到什么好文章，适合在演讲中讲述或引用；看到一个非常好玩的笑话，我就随手记录下来，当然了，如果那个笑话已经用之前就上大规模的流行了，我就把它删掉。\n\
    \n按这种方式，过一段时间，奇妙清单的收件箱会混乱不堪，我就打开它，把收件箱各种各样的记录条目，分别归类放到各种自己创建的目录里，比如某个类别的名字是“吹牛x”，某个目录的名字是“有境界”，某个目录的名字是“巨深刻”，你可以从这些目录的名字里，大概猜到里面都是些什么样的素材。\n\
    \n养成这种习惯后，像我做一年只讲两三场演讲的人，每次准备演讲时，总是会发现素材严重过剩，而不是不知道讲什么。所以这个好习惯供你参考。\n\n顺便说一下，要把平时脑子里想到的东西最快省事儿的记录下来，并且事后高效的处理，可能没有任何一个软件能跟这种软件的“闪念胶囊”相比，虽然这个软件是我设计的，我还是忍不住为了大家好，拼命想象我不是我，然后再非常客观地强烈推荐。\n\
    \n# 罗永浩\n\n好，谢谢几位同学的提问，如果你在创业中有什么困惑，或者有什么想和我分享的，都欢迎在我的创业课留言给我。\n\n我是罗永浩，感谢把我的创业课分享给你的朋友，我们下周一见。\n"
