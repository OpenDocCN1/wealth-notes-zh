    拜耳药因为成功研发生产了人类历史上最伟大的药物之一，阿司匹林。两公司把这个名字几乎定为公司医林的医同义词，杰诺斯拜耳药，打击阿司匹林的同制解构。作为对标，拜耳生产了一种药止酸胃的，包装上写着“不含可同林的止酸药”，可是对这个世界来说，拜耳药即同司匹林。阿司匹林就是拜耳。而不含阿司匹林的拜耳药物，就什么都不都是。


    里斯和特劳特对于品牌是各做到了在某一品类里面成为领导者，有一个很经典的测试方法，叫做。就是让你把一些品牌写到纸上，比如海飞丝、李施德、绿箭、佳洁士等等，不需要念给其它人后让你的家人去超市时帮买回来。大多数丈夫或妻子都能正确的买东西。


