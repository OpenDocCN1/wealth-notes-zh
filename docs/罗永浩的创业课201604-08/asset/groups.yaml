    # 第61篇｜为什么有的产品靠模仿和复制也能成功？


    ![](img/3f2553c19e3d8036724ac589070714e0_117_0.png)




    欢迎来到我的创业课，今天又是本周的问答时间。


    老罗，你在文章里反复提到要明确定位、开创新品类，与同类产品差异化。但我们做很多行业都能感觉到，常常是那些靠模仿、复制，然后价格上占优的品牌，更能快速成事儿。您怎么看？


    你的这种观察非常好，但你说的这种现象跟定位理论并不矛盾。别的汽车公司做SUV最便宜也要十几二十万的时候，有本事做到腰斩的价格，比如六七万块，一定能成事儿，而且是迅速成事儿。注意，这时候你可能不是没有定位，这时候你的定位就是“全行业最具性价比的城市SUV”，当年长城赛车就是这样迅速成事儿的。赛车是如此的成公，以至于几乎整个中国在卖的SUV都被迫跟着降了价。几年后由于种种考虑，长城停掉了赛车，改做哈弗。今天，哈弗的产品线整体上仍然是中国最具性价比的SUV，而且几乎年年都是销量冠军。


    在合理合法的范围内，后进企业模仿先进企业并不丢人，只要不是毫无底线地赤裸裸抄袭，都没什么。先进的老牌企业当年多数也都是这么过来的，只是他们的子孙忘了而已。今天先进的老牌企业里，嘲笑后进企业的，大部分都是没出息的富五代、富六代，甚至是给富五代、富六代打工的。当年他们爷爷的爷爷，基本上都承认自己也是通过学习模仿别人才做起来事业的。


    另外，领寝室的产品并不强大，真正了不得的企业，常常是服务群众多的企业，这就是为什么奔驰、宝马牛逼了半天，都干不过丰田和大众的原因。有些企业做便宜的东西，同时把品牌形象做得非常low，这是品牌建设出了问题，不是做便宜的产品本身有什么错。


    靠模仿和性价比成功的定位例子，你在里斯和特劳特的书上较少看到，但在身边经常看到，很大程度上是因为你正在见证中国从贫穷走向富裕的过程，这样的过程里类似的例子特别多，因为这样的国家对价格敏感的阶层，人数还是相对的多；而富裕了好几代的美国，在定位理论诞生时的六、七十年代，已经非常发达了，所以对价格敏感的消费者群体相对而言没那么多。但即便如此，我们也能轻松找出一些靠性价比快速成功的美国企业，在电脑行业已经被认为没什么机会了的情况下，以渠道模式的创新实现了惊人的性价比的戴尔电脑公司，就是一个非常明显的例子。


    在富裕的中产阶级占据了国民人口大多数的国家里，靠性价比成功的新企业，要比穷人还很多的国家里少得多。即使是在同一个国家，比如在中国，你稍加留意也会发现，很多在一线城市早就倒闭了的，那些严重依赖性价比的国产“廉价洋鬼子”快餐行，在二、三、四线下的很多城市里，也活得非常好。最终，随着整个国家变得富裕，这种情况会相对变少。但任何时候，任何国家，靠优秀的性价比脱颖而出成功的企业永远不会消失，并且永远是受欢迎的一种典型案例。


    老罗，你讲了不可能取悦所有人。那精准定位就是小众生吗？如果定位的群体够小众，特征够明确了，结果发现他们同时消费能力又差怎么办？


    精准定位是聚焦于一部分人群作的前提目标人群，这样的结果有可能是小众，但有可能，数量大受欢迎。取决于你怎么去创新和选择。比如你做一个饼干品牌，定位上是只做糖尿病患者吃的饼干，这有可能利润丰厚，很赚钱，但永远做不大，这是很正常的，因为你的选择就是小众人群，除非糖尿病患者突然激增几十倍几百倍，或者你做的饼干口味非常独特并由于某种原因突然在非糖尿病患者当中流行开了，否则，它会一直很小众。另一种情况是，你做了一个给普通人吃的饼干品牌，但发现竞争太激烈，于是转型定位成一个专注做健康的粗粮饼干的品牌，虽然貌似也是很小众的选择，但过程中完全有可能赶上健康观念的爆发和流行，突然成为人人追捧的大众消费品牌。


    最后，说到消费能力，既然你定位的人群“够小众，特征够明确”，那提前调研一下这个群体的消费能力应该不是很难的事情吧。


    罗老师，我感觉现在的年轻消费者，真不在乎是不是第一、是不是最好。他们更在乎的是不是真的更好用。网络这么发达，“买东西看十五个横评”也不是很难吧。您怎么看？'
  - '[PAGE 118]


    消费者直接去买，和“看十五个横评”再去买，本质上是一个时间成本问题。相对而言，年轻人的时间要比中年人的时间富余一些，但这不意味着年轻人的时间可以充裕到买一瓶矿泉水喝之前都要看“十五种瓶装饮用水横向评测”，何况写评测的人是真正的“独立客观第三方”，还是拿了钱写评测的，你也很难知道。


    定位理论的前提是，现代社会的物质丰富和供给过剩，以及随之而来的信息爆炸，使得消费者在绝大多数产品品类里最多只能接触一两个品牌。如果要消费者做到所有品类里的所有品牌都有所了解再选择购买，是绝无可能的。京东这样的电商网站，全站的商品SKU高达几万种，这意味着即便是从业人员，也只能弄清楚小部分品类里的一小部分产品，更不要说是普通消费者了。


    今天在大型的电商网站上，可供选择的饮用水不是十五种，而是一百五十种都不止。多数正常理性的人，都不会为了选择一瓶矿泉水浪费两个小时去看一百五十种矿泉水的评测报告，或是用这两个小时去看电商网站上的消费者评论，因为同样的两个小时，用来看一场电影，并且随便选一瓶矿泉水，要合理的多。


    有人可能会想，我为什么要看一百五十种呢？我只看销量最大或口碑最好的前五种不就行了吗？嗯，听起来好像有道理，但那五种为什么成了销量最大的，或是口碑最好的呢？是因为其他人都牺牲了看电影的时间，帮你去试了一百五十种，并且都写了评论吗？还是他们也只关注了前几种呢？一般说来，大家普遍关注的前几种又是怎么产生的呢？为什么卖的最多的那几种，通常也是广告打得最多的那几种呢？为什么广告打得最多的那几种里，虽然市场投放差不多，但有些更容易被消费者记住，而有些更不容易被消费者记住呢？为什么消费者更容易记住的，通常销量也最大呢？商家除了在广告语上殚精竭虑，为什么包装上也要挖空心思，去折腾出那么多稀奇古怪形状的瓶子呢？为什么说一种矿泉水来自千岛湖，消费者就觉得比来自“千岛水库”高级呢？你知道千岛湖其实就是一个人工水库吗？如果消费者知道千岛湖是个人工水库，还有兴趣去那里旅游吗？为什么阿尔卑斯山的矿泉水会比奶牛山的矿泉水卖得更贵呢？真是水质更好口感更佳吗？为什么卖了一百多年也只是地方小众饮料的广东凉茶，用一句“怕上火，喝王老吉”就卖得竟然超过了可口可乐呢？这些问题的答案，都跟产品本身没有太大关系，而是跟市场营销，跟品牌传播，跟定位理论有关。


    作为一个消费者，除了我们凑巧非常了解的个别领域，多数时候，我们买的就是我们以为好的东西，不一定是真正好的东西。这就是定位理论反复强调的，一个品牌是什么常常不重要，真正重要的是它在消费者的心智认知里是什么。


    # 罗永浩


    好，以上就是今天问答的内容，欢迎在留言区写下听完之后的感想。'
