    比如说，你想做香水领域的第一名，结果发现已经来晚了，怎么办呢？抢先成为男士香水领域里的第一名。你想成为香领域里的第一名，结果发现已经来晚了，怎么办呢？抢先成为女士香水领域里的第一名。当然，今天这些都已经有人做过了，不过这个思路和定始终都是可以参考借鉴的。


