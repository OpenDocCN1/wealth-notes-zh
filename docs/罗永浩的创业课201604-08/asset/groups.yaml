    推荐阅读：

    《如何筹备好一场发布会？（上）》


    ![](img/3f2553c19e3d8036724ac589070714e0_68_0.png)


    有些企业的发布会请明星来，目的是为了拉人气，保证现场的入座率。如果是为了这个，那请明星还不如直接把来现场的人送礼物，利诱他们出席。比如某手机公司就直接给来现场的全部所谓“粉丝”每人送一部公司的手机，现场感谢彻底爆满。当该公司CEO宣布活动结束时，大家可以去排队领手机的时候，全场对CEO发出雷鸣般的欢呼。但这显然看起来未必有多高大上，想要过好明星发布会就得，全会对着明星发出雷鸣般的欢呼，轮到CEO上台的时候，大家都在低头玩手机。


    当然，有些公司一场发布会请几十个大明星，常常是为了对竞争对手秀肌肉、给合作方秀实力、对公众制造跟企业实力相关的话题等等，这是另外的商业逻辑，不在这里讨论。


    ### 3. 细节决定企业形象是否派体面


    直播流行起来后，有些大众消费品的发布会会按照自身产品异常亲民的定位，现场会邀请大批瓜子脸主播来做现场直播，这无可厚非。但就怕你们不生气的是“狂妄者无比”的产品，只要不是情趣用品或给公司比这些特殊类目的，就需让用对经店说明细要求：要求出席现场的主播们穿着端庄得体，不要过于暴露。


    很多企业高管，早年为了创业，都没没有时间谈，所以虽然人可能很体，但现场有时候也会需要用到礼仪小姐，些可以找专业公司付费帮忙解决。但也要注意，最好提前跟对方沟通些细节，比如礼仪小姐的着装打扮风格之类，最好对对方一个具体要求，否则多可怕的事情都有可能发生。我一个好朋友的互联网融资公司在丽都（北京的一个商务中心）附近的酒店开了一个大型的发布会，他们预算充足，所以发布会打包给了一家公关公司操盘，公关公司当天的安排和服务整体上几乎无懈可击，但由于某些未知的原因，现场十几个礼仪小姐全都穿着无比露肉的肉色的一件套式的小短裙，远远地看过去，就像……反正大家都很崩溃。


    另外，除非产品定位的特殊需要，发布会上尽量不要使那种以女在日韩港台地区常见的，让穿着裸露的模特举着产品走秀的方式。


    ### 4. 要提前做好突发状况的应急预案


    或多或少都会出现些问题，只是有些情况处理得好，所以观众甚至不知道后台出了事故似的。


    Keynote或PPT做的幻灯片出问题是常见的状况，通常最好的方式是准备至少一台应急的备用电脑，并且连接到专业的切换台上，现场出现问题时，观众甚至来不及反应，就无缝切换到另一台备用电脑上了。


    麦克风故障是另一种常见状况，应对方式上的演讲会在胸前别至少两个无线的胸麦，这样如果中途出现异常时，负责工程的工作人员会关掉其中一个胸麦的声音讯道，打开第二个备用胸麦讯道。


    为了镇定自若地消除这种可能的危机，给现场工作人员应急培训做培训，演讲者提前准备几个应急笑话或小段故事，是比较有效的方方。虽然这种临场应变能力跟运作企业的能力没什么关系，但普通观众下意识地会觉得：一个在这种急情况下，轻易淡定地把危机化解掉的人，看起来多像是无论如何都能把麻烦变成把公司运转好的企业领袖，而那些在这方面欠缺训练，但其更重要的方面非常优秀的企业管理者，在事故现场的公众眼里，通常会显得笨拙和无能。


    另外，由于现场情况很复杂，而且不能提前预测所有可能发生的状况，所以仍然可能需要专业的主持人在旁边用各种方式帮忙救场，这个最好和主持人事先也彩排一下。


    ### 5. 关于现场嘉宾的座位安排


    说到活动现场嘉宾座位如何安排的问题，可以这样说讲，比起文化界、艺术界、科学界的活动中，商业界活动的嘉宾座位安排是最简单直接、最淳朴朴素、最纯真可爱的。因为


    > > 这一点我实在太喜欢了。


    你知道文化界的活动排座次有多麻烦吗？你是让得艺双馨但一辈子没写过什么好作品的等拿奖者坐主席团排呢？还是让著作多得荣誉奖坐者主席，但没有上一部没有一本书卖过五千的著名作家坐前排呢？还是让小说累计卖出七千万，作家财富榜上年排前三，但基本上是一个“文盲”的畅销作家坐前排呢？


    ### 6. 做企业的人，要想尽一切办法解决问题


    最后，我对于那些性格比较细腻敏感的创业者我想说的是，多数情况下，企业的发布会作为一种仪式，都会显得比较假，比较无趣，甚至比较没劲。但时不时地完成一个仪式性的东西，是一个成年人的责任。对创业年的成年人来说，更是一种必要的工作和义务。


    那些年轻时对很假、很无趣的、很劲的婚纱照摄影嗤笑不已的男人，最后结婚的时候，几乎都无一例外的，为了让老婆高兴，去拍了一本厚厚的、很假的、很无趣的、很劲的婚纱摄影集。这是人类的婚姻，最让我感动的部分之一。


    ![](img/3f2553c19e3d8036724ac589070714e0_70_0.png)


    > 罗永浩

    > 好，以上就是今天我和你分享的干货日记，欢迎你写下听完之后的感想留言，我们在留言区里一起交流。

    > 我是老罗，感谢你把我的干货日记分享给你的朋友们。我们明天见。


    推荐阅读：


    《如何筹备好一场发布会上？（上）》


    《如何筹备好一场发布会上？（下）》


    此番插入还需，最好是想企业市场部高效讲上去讲。如果企业市场部没有擅长高效演讲的，可以专门雇一个，好过不擅长演讲的老板上去，弄得场面尴尬。


    想请教老罗一个问题，发布会的好坏，有什么具体的评价标准吗？会后媒体的报道吗？转发率？有可能和之后的销量挂钩吗？


    当前有标准。等等，这些都是考核标准。这些转发当中，有些是利于品牌建设和传播的，但通常不容易直接转化为销售，比如大家热议某一场发布会上，某企业很感人的一段独白之类的；有些是相对容易直接转化为销售的，比如大热议发布会上产品演示时，某一个看起来很实用也很酷的独家功能。


    罗振宇说发布会就是单位的一次练兵，提升内部的合作。相对而言是外包出去保证质量，还是自己找办，是不是要取舍下？


    这要看情况而定，因为罗辉的团队里，很多都是电视台和媒体出来的，对他们来说，操办一场高质量的发布会，并且进行现场直播或录播，某种程度可以认为是老本行工作，没有太大的困难。而整个团队上下一心，精诚合作，要把一年中的某一两个公司面对公众的重大事件做好，这当然是一个难得的团队建设的机会。但如果你们公司很基本没有能操办这个的行家，预算又很充足，而且这个人不能给不能确定，这时候，当然还是外包出去稳妥。要看企业自身的实际情况。


    不知名企业也能开发布会吗？如果没有人关注怎么办？


    当然可以，一个企业从不知名到知名，靠的就是创业过程中做好几十件、上百件事啊，开发布会只是其中之一。没有人关注，说明企业做得还不够好。那什么做得足够好呢？不是一定要把企业创始人训练成演讲家或脱口秀演员才叫做得好。要动脑子。


    随便举个例子吧，第一个把发布会开到了人民大会堂的，发布会本身做得多差，都会起到非常好的传播作用。


    请问老罗，如果是一个100人左右，主要面向媒体和核心客户的发布会，由于演讲者和观众距离较远，是否应该安排问答环节？以及如何避免问答环节的冷场和失控？


    如果企业里没有擅长随机应变，擅长应对这类场面的人，不建议安排问答环节，否则冷场或失控是大概率事件。有些企业的做法是：提前准备好大部分的问题和答案，由关系好的媒体现场搞有问事地询，然后再自己把准备好的答案煞有介事地说一遍。这种操作的关键是，主持人不给现场真的临时想问问题的记者发言的机会，免得出现意外。供参考。


    您怎么评价锤子手机的发布会？您觉得锤子的发布会最成功的状态或者最好的地方在哪里？


    锤子科技的发布会，从技术层面上，受限于各种条件，很多事情其实都没有做好。锤子科技的发布会真正做得好的地方有两个：


    - **第一个地方是产品的优点讲解和演示做得好。**


    很多企业做的产品优点很突出，但讲解得不好，所以我前期传播就会相对弱。而且除了苹果公司和锤子科技，其他手机厂商也不敢做手机功能的现场演示，要么就是没什么可供演示的差异化的功能，要么是怕现场意外丢人，这是有问题的。


    当然，他们可能还是卖得很好，销量很大，这是因为产品的商业成功，是一个复杂的系统工程。有的企业发布会做得不够好，甚至可能产品都不好，其他方面很强，比如销售团队很厉害、供应链管理和成本控制做得很厉害、运营商渠道很厉害，也有可能很成功。锤子科技做了五年，直到这次的坚果Pro发布后才打开局面，是因为别的方面短板多，单说发布会的，我们的产品讲解和演示功能演示，从一开始就定准是示范级别的。


    - **第二个地方是故事讲得好。**


    锤子科技上的创业过程，是一个活生生的关于野望、关于工匠精神、关于理想主义的样板。光是有这样有什么用呢？每年有那么多野心勃勃的创业公司成立，他们其中的一部分人，跟我们有着一样的梦想、一样的工匠精神、一样的理想主义，但一直倒到倒，都没有人知道。


    如果你觉得成功，传播得成功，它会打动足够多的人，在暂时的创业初期，产品本身还没达到一些瑕疵的情况时，在供应链和生产根本搞不定所以没法及时交付产品的情况下，甚至完全没有财务预算去打广告做宣传的情况下，也能转化一个体量还不错的，虽然可能还不足以让公司盈利，但足以让公司活下来的忠实用户群体。


    你不要把这个讲故事理解成是瞎编一个故事。有的企业卖实话，我们不会讲故事，我们只会踏踏实实地几十年如一日地做好一件事，然后踏踏实实地卖给消费者。这不是讲故事呢？当然是，这是一个踏实本分的品牌故事。有的企业家说，我们赚多少少钱，取得多少成就也不会满足，我们在某个领域一旦做成，马上就想开始挑战下一个难题了。这是一个富冒险和进取精神的品牌故事。


    所有的大企业在讲故事，只讲得好的，且讲得不好。在讲不好，分的可以用想办法学习训练，直至最终讲好，或是用其他的长板暂时弥补你这个短板。回头再讲，但不能回避这个问题。因为


    小贴士：


    > # 罗永浩

    > 好，这周的问答时间就到这里了，谢谢同学们的提问，如果你在创业中有什么困惑，或者有什么想和我分享的，都欢迎在留言区留言给我。

    > 我再重申下咱们专栏的更新时间，每周5次，周一到周五，上午9点准时更新。

    > 下周我会分享，也都是干得不能再干的纯干货。

    > 我是老罗，感谢你分享我的干货日记给你的朋友，咱们下周一见。


    ![](img/3f2553c19e3d8036724ac589070714e0_72_0.png)


    坏消息是：有些人害怕，但没那么害怕，至少没有你那么怕。


    但还有一个好消息：那些演讲能力特别强的人，包括人类历史上最长演讲的，比如丘吉尔、希特勒、马克吐温、乔布斯、罗永浩等等，这些人原来也都是特别害怕演讲的，即使是后来他们把自己锻炼成了公认的优秀演讲家，他们上台前也只有两种状态：一种是紧张，一种是非常紧张。练成和没练成的唯一区别是：


    当众演讲到底有多吓人呢？先说说我吧，我不止一次地讲过，也想象人家朋友说过，如果我做锤子科技的同时，不用去做发布会这样的公开演讲，我愿意少活五年。他们这个时候说得这是夸张的说法，其实我一点也没夸张。


    美国喜剧演员 Jerry Seinfeld，也就是情景喜剧《宋飞正传》的主角，他有一次说，统计表明：人们最害怕的事儿就是当众葬礼，第二害怕的才是死亡。所以，参加葬礼的时候，躺在棺材里要比站在那里致辞舒服得多。


    马克吐温也说过：


    2. 正是因为这么吓人，演讲这门手艺练成了就非常有价值，因为大多数人都会因为害怕而练不成。


    我一提起演讲，很多人就误以为是说那种大型的商业发布会，然后就说什么“有几个公司机会到那么多人演讲啊？你练这个干嘛呀？你用的上吗？”。


    其实，比如说：你是一个创业公司的老板，你们的业务不需要开发布会，但你公司内部门总要到员工讲话吧？就算你们公司不频繁搞头脑大会什么的，但一年一次总也有了吧？至少开年会的时候是需要的。还有，就算你不是老板，也不是高管，不一个只管十几二十人团队的小主管，不也得领着他们开会吗？开会的时候，你对他们讲话，需要的也是演讲的能力。你可能这种情况下也需要紧张，但你没练过演讲，对自己下属的员工，虽然不紧张，但还是讲得很差，这肯定不是你希望的。


    有可能你连小主管也不是，只是一名普通基层员工，那难道不需要演讲能力呢？当然是需要的。比如说你部门领导出差，结果公司开会的时候，你能领导和同事汇报工作时，一发言就紧张结巴，其他部门的同事或公司高层的领导，看你像啥笔歪，以为你太业余，这肯定不是你希望的结果。


    有些事你可能能力跟你差不多，甚至还要比你差一些，但在一个公司高管出场的会上汇报工作时表现得非常出色，给管理层留下很深的印象，没多久就升迁了，这种事情在企业里很常见。


    有时候，头脑内向的人会感慨，感慨在这样一个外向型的人统治的残酷世界里，性格内向型的人太吃亏了。只有具有讽刺意味的是，有心理测试表明：即使是那些头脑内向的人，通常也能对更陌生更陌生那些在任何情况下都显得开朗自信，落落大方的人。


    而且你做这些事的时候，通常只有一个几分钟到几十分钟的表演机会，为了表现好一些，一定要提前反复演练演讲能力，否则处赴吃亏。所以有些关于演讲的书上说，演讲是一个能改变您命运的能力，不是没有道理的。


    3. 消除演讲恐惧的唯一方式，就是多讲。


    你可能经常听到一些不靠谱所谓演讲专家说，你当众讲话的时候，如果感到紧张，可以想象观众都是裸体的，于是你就不紧张了。这种扯淡所谓窍门还是很多，你通通不要信。


    想要学会游泳，唯一的方式就是到水里去练。你躺在床上，趴在床上把蛙泳、蝶泳、仰泳、自由泳的动作全练熟了，并且想象床草就是水，真到了水里一样会淹死。


    这相当于浅水池里练游泳，你知道最坏结果也就是呛一口水，肯定淹不死，也就没那么吓人。自己练习演讲时，一定要录音录像。除非你自己的判断力有严重的问题。


    万一真觉得判断不了，可以放给亲友听听，要找那些即使当着他们的面丢人，你也不会是特别不好意思的亲友，放录像给他们看。因为你跟他们很熟，所以当看他们的面讲，和一个人跟对着空房间讲，以及将来面对着外面的人讲，感觉都是不一样的。


    或者去想这个问题对应的答案是刚才那十三个元素中的哪几个，显然你没记住几个。


    就算他们对问题兴趣不大，你只要现场问他们，他们还是忍不住会去想。这时候，听众就是被演讲者带着走的节奏了。


    好，这个问题再来一遍，如何抓住观众的注意力并使他们愿意听下去？


    # 这个问题对应的三个元素是：


    你看，至少在刚听到的这一刻是记得住的。所以做好演讲的十三个元素里，有一个很重要的就是，极限是四个，多了观众就不容易记住了，我们的大脑就是被设计成这个样子的。


    好，再听一遍刚才的问题，如何抓住观众的注意力并使他们愿意听下去？


    开搞前，喧闹的演讲现场，演讲者一讲笑话，大家就静下来了，我们的大脑就是被设计成这个样子的。如果你一开场就开始大段讲道理，就算最后会安静下来，也需要更长的时间。如果你开场讲的是些礼节性的客套话之类的，那就需要更长时间了，因为观众会下意识觉得，这些礼节性开场白都是可以忽略的，觉得你们再聊一会儿也没什么。当然，如果你的笑话讲得很差，他们很快又会吵闹起来，那怎么办呢？别担心，后面的课程会给你讲，一个缺乏幽默感或幽默感很糟糕的人，如何活跃现场气氛的问题。


    除了讲笑话，分寸感良好、操作无瑕疵地人们对喜欢讨厌你吹牛和装x，其实不是，人们只是讨厌吹牛和装x技术不好的，如果碰到这个吹牛和装x，是中性的意思，没有负面色彩，具体的细节也会在后面的课程里讲到。


    # 第二个问题是，如何让观众容易理解并跟着你的节奏走？这部分对应的元素是四个：


    他们可能本来没那么关心你要讲道理，结果你讲了故事，讲得很好，他们听着听着，也把你藏在故事中的道理也理解并接受了。再一次，我们的大脑就是被设计成这个样子的。


    做类比是一样的道理，作为一个装饰用的食品公司的演讲者，你可能很难用几句话，让听众直接理解为什么你们公司生产的食品只能吞，不能吃，但你也可以告诉他们，口香糖生生的初期，人们也是纳闷为什么这种食品只能在嘴里嚼，但不能吞下去。


    我们的大脑就是被设计成这个样子的。


    演讲结构上的三段式，除了前面说过的，只有三个，就容易让观众记住之外，还有一个好处就是，它会成为观众脑子里的路线图。你开始的时候就告诉观众，你今天要讲三个问题，分别是什么。因为只有三个，他们就记住了。接下来你讲完了第一段的时候，他们会记得你下面要讲的第二段是什么，你讲完了第二段的时候，他们会想起来你开场时介绍的第三段是什么，这样全程都会跟着你的思路走。提出问题也是一样的道理，听完了问题后，你会不由自主地跟进你的思路走，并且确认你接下来的演讲是否回答了你先问出的那个问题。


    # 第三个问题是，如何使你的演讲有说服力？这部分对应的元素是两个：


    关于演讲要有逻辑和数据这部分，先不解释了，后面有专门的课程会展开讨论。


    # 第四个问题是，如何让听众和你产生共鸣？这部分对应的三个元素是：


    讲道理的部分，不要诉诸情感，免得情理不分。但成功地把道理讲完，说服了观众，得到了认同之后。


    实际上，过几天后，观众甚至忘却了从道理上为过什么东西支持你了，只记得情感上是跟你在一起的。为什么会这样呢？嗯，这是个好消息，这个问题的答案是，我们的大脑就是被设计成这个样子的。


    至于要有境界，是指


    为什么需要这个呢？为什么这种东西能让人产生更加亲切认同呢？我想答案你应该已经知道了。


    最后，如果你竟然记得我今天讲的东西，在那十三个元素里，还漏掉了一个，那你一定是一个记亿天才。我确实漏掉了一个，这个元素就是，“要有画面”。我为什么没把这个问题到前面问到的四个问题的答案里呢？因为“要有画面”，这个元素，放到前面问到的任何一个问题里，都是说得通的。


    # 今日得到


    1. 如何抓住观众的注意力并使他们愿意听下去？（要讲笑话、要吹牛、要装x）+ 要有画面

    2. 如何让观众容易理解并跟着你的节奏走？（要讲故事、要做类比、要三段式、要提问）+ 要有画面

    3. 如何使你的演讲有说服力？（要有逻辑、要有数据）+ 要有画面

    4. 如何让听众和你产生共鸣？（要有情感、要有激情、要有境界）+ 要有画面

