    \n从人性的角度，假装无优势很好理解，假装有优势解释了之后被人鄙视也好理解。但人类为什么还会假装不经意展示自己的优势呢？这种需求是从哪里来的呢？这是很多人对装X这件事感到最困惑的地方。\n\
    \n当人类为了生存竞争而展示优势，比如展示一身健壮的肌肉时，带来很多生存竞争方面的好处的同时，也会产生一些不利于生存竞争的缺点，比如说展示会让没有这种优势的人产生讨厌，嫉妒甚至是仇视的心理，这显然会增加生存竞争的危险。如果一个人有非常多的优势比方说假装不经意展示健壮肌肉的有意，说明他智商情商都高，这些是健壮肌肉之外的优势，是加分项。但这样一种假装不经意的装X手法被多数人看穿时，说明这个人活人太狠，智商不够高，所以被多数人看穿后，假装不经意地展示优势就反构成了一个丢分项。\n\
    \n# ## 那在商业演讲中应该如何装X呢？\n\n首先，\n\n如果面对的是所谓的“大众阶层”，装X就要强调一些性价比的务实方向。很多人会以针对“屌丝阶层”的产品宣传不需要调性，不需要装X；也有很多人认为“大众产品”是没法讲出调性和档次的，这完全错误的看法。在短期促销的时候也许不需要，但对长期的品牌建设来讲，“大众产品”一样需要档次和调性，并且一定能提炼出档次和调性的。\n\
    \n在商业发布会上宣讲时，你固然可以大喊“我们永远跟竞争对手强调真钱！”,也可以把同样的意思讲得非常有调性和档次：比如，“每一个清晨，每一个深夜，每一个分不清是深夜还是清晨的时刻，这个行业里的精英们在办公室里处心积虑的思考如何再提高一点点利润率的时候，我们的同仁在车间里慷慨痛心地琢磨怎样再降低一点成本，让利给我们的消费者。”\n\
    \n如果你的目标人群是一线城市的中产阶层，装X就要强调一些感性的，有态度的，有文化的，有追求的东西，而不是性价比之类的东西。\n\n比如会在发布会上抛出类似这样的问题：\n\
    \n> > “在一个完美主义者者眼中，这是一个怎样的世界？”（这就实现了假装不经意地将自我已完美主义又，迁显示承托作为一个商业公司，思考产品问题的程度很深刻，不是每天只想着赚钱）\n\
    \n> > “圆滑当道的时代，驱动一个团队保持它与坚持的，究竟是对冲的困境，还是理性的坚持？”（这个问题则说是我们这一次发布的坚果Pro手机的工业设计哲学，它是一款线条简洁克制，边角没有锋利的设计语言，但它传达出的问题它的传达出假不自然的迂回，它传达出了一个有调性，有文化，有追求的商业公司的态度）\n\
    \n再举一个例子，今年春天的发布会上，我们发布了一个漂亮的黑色手机，上面的机角上系着红色的细线黑色机，于是我们就在发布会上讲了一个“细细的红线”的故事。\n\
    \n克里米亚战争中的一场发生于英国人和俄罗斯人的实力悬殊的战斗中，处于明显弱势的英国人，身穿红色的衣服，排成一条绵细的防卫线，舍逆命的击散了强大的俄罗斯军队的入侵。在军事史上，留下了“细细的线”这样一个词汇。用来表示不屈服于强大的势利，顽强奋斗，直至迎来奇迹般胜利的一种精神。\n\
    \n在讲演说前的预热海报上，我们整理了一下历史上类似的以少胜多的著名战役，写了这么一个装X的问题：\n\n> > “穿过马拉松、萨拉热所、库斯沃沃、特拉法尔加、巴拉克拉瓦、瓜达尔卡纳尔那些粗细的红线，代表的是怎样的勇气与力量？”\
    \  \n> （这个问题对应的是我们这一次发布的坚果Pro手机的一个特别版本的设计特性，它是一个黑色加红细线的男版设计，但这句话真的问题使这个问题同时假装不经意地传达出了一个有文化，有品位，有追求，还有不屈的奋斗精神的创业公司的形象）\n\
