    好，这个问题再来一遍，如何抓住观众的注意力并使他们愿意听下去？


    # 这个问题对应的三个元素是：


    你看，至少在刚听到的这一刻是记得住的。所以做好演讲的十三个元素里，有一个很重要的就是，极限是四个，多了观众就不容易记住了，我们的大脑就是被设计成这个样子的。


    好，再听一遍刚才的问题，如何抓住观众的注意力并使他们愿意听下去？


    开搞前，喧闹的演讲现场，演讲者一讲笑话，大家就静下来了，我们的大脑就是被设计成这个样子的。如果你一开场就开始大段讲道理，就算最后会安静下来，也需要更长的时间。如果你开场讲的是些礼节性的客套话之类的，那就需要更长时间了，因为观众会下意识觉得，这些礼节性开场白都是可以忽略的，觉得你们再聊一会儿也没什么。当然，如果你的笑话讲得很差，他们很快又会吵闹起来，那怎么办呢？别担心，后面的课程会给你讲，一个缺乏幽默感或幽默感很糟糕的人，如何活跃现场气氛的问题。


    除了讲笑话，分寸感良好、操作无瑕疵地人们对喜欢讨厌你吹牛和装x，其实不是，人们只是讨厌吹牛和装x技术不好的，如果碰到这个吹牛和装x，是中性的意思，没有负面色彩，具体的细节也会在后面的课程里讲到。


    # 第二个问题是，如何让观众容易理解并跟着你的节奏走？这部分对应的元素是四个：


    他们可能本来没那么关心你要讲道理，结果你讲了故事，讲得很好，他们听着听着，也把你藏在故事中的道理也理解并接受了。再一次，我们的大脑就是被设计成这个样子的。


    做类比是一样的道理，作为一个装饰用的食品公司的演讲者，你可能很难用几句话，让听众直接理解为什么你们公司生产的食品只能吞，不能吃，但你也可以告诉他们，口香糖生生的初期，人们也是纳闷为什么这种食品只能在嘴里嚼，但不能吞下去。


    我们的大脑就是被设计成这个样子的。


    演讲结构上的三段式，除了前面说过的，只有三个，就容易让观众记住之外，还有一个好处就是，它会成为观众脑子里的路线图。你开始的时候就告诉观众，你今天要讲三个问题，分别是什么。因为只有三个，他们就记住了。接下来你讲完了第一段的时候，他们会记得你下面要讲的第二段是什么，你讲完了第二段的时候，他们会想起来你开场时介绍的第三段是什么，这样全程都会跟着你的思路走。提出问题也是一样的道理，听完了问题后，你会不由自主地跟进你的思路走，并且确认你接下来的演讲是否回答了你先问出的那个问题。


    # 第三个问题是，如何使你的演讲有说服力？这部分对应的元素是两个：


    关于演讲要有逻辑和数据这部分，先不解释了，后面有专门的课程会展开讨论。


    # 第四个问题是，如何让听众和你产生共鸣？这部分对应的三个元素是：


    讲道理的部分，不要诉诸情感，免得情理不分。但成功地把道理讲完，说服了观众，得到了认同之后。


    实际上，过几天后，观众甚至忘却了从道理上为过什么东西支持你了，只记得情感上是跟你在一起的。为什么会这样呢？嗯，这是个好消息，这个问题的答案是，我们的大脑就是被设计成这个样子的。


    至于要有境界，是指


    为什么需要这个呢？为什么这种东西能让人产生更加亲切认同呢？我想答案你应该已经知道了。


    最后，如果你竟然记得我今天讲的东西，在那十三个元素里，还漏掉了一个，那你一定是一个记亿天才。我确实漏掉了一个，这个元素就是，“要有画面”。我为什么没把这个问题到前面问到的四个问题的答案里呢？因为“要有画面”，这个元素，放到前面问到的任何一个问题里，都是说得通的。


    # 今日得到


    1. 如何抓住观众的注意力并使他们愿意听下去？（要讲笑话、要吹牛、要装x）+ 要有画面

    2. 如何让观众容易理解并跟着你的节奏走？（要讲故事、要做类比、要三段式、要提问）+ 要有画面

    3. 如何使你的演讲有说服力？（要有逻辑、要有数据）+ 要有画面

    4. 如何让听众和你产生共鸣？（要有情感、要有激情、要有境界）+ 要有画面

