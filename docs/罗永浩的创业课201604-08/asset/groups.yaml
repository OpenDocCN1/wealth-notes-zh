    推荐阅读：


    《如何筹备好一场发布会上？（上）》


    《如何筹备好一场发布会上？（下）》


    此番插入还需，最好是想企业市场部高效讲上去讲。如果企业市场部没有擅长高效演讲的，可以专门雇一个，好过不擅长演讲的老板上去，弄得场面尴尬。


    想请教老罗一个问题，发布会的好坏，有什么具体的评价标准吗？会后媒体的报道吗？转发率？有可能和之后的销量挂钩吗？


    当前有标准。等等，这些都是考核标准。这些转发当中，有些是利于品牌建设和传播的，但通常不容易直接转化为销售，比如大家热议某一场发布会上，某企业很感人的一段独白之类的；有些是相对容易直接转化为销售的，比如大热议发布会上产品演示时，某一个看起来很实用也很酷的独家功能。


    罗振宇说发布会就是单位的一次练兵，提升内部的合作。相对而言是外包出去保证质量，还是自己找办，是不是要取舍下？


    这要看情况而定，因为罗辉的团队里，很多都是电视台和媒体出来的，对他们来说，操办一场高质量的发布会，并且进行现场直播或录播，某种程度可以认为是老本行工作，没有太大的困难。而整个团队上下一心，精诚合作，要把一年中的某一两个公司面对公众的重大事件做好，这当然是一个难得的团队建设的机会。但如果你们公司很基本没有能操办这个的行家，预算又很充足，而且这个人不能给不能确定，这时候，当然还是外包出去稳妥。要看企业自身的实际情况。


    不知名企业也能开发布会吗？如果没有人关注怎么办？


    当然可以，一个企业从不知名到知名，靠的就是创业过程中做好几十件、上百件事啊，开发布会只是其中之一。没有人关注，说明企业做得还不够好。那什么做得足够好呢？不是一定要把企业创始人训练成演讲家或脱口秀演员才叫做得好。要动脑子。


    随便举个例子吧，第一个把发布会开到了人民大会堂的，发布会本身做得多差，都会起到非常好的传播作用。


    请问老罗，如果是一个100人左右，主要面向媒体和核心客户的发布会，由于演讲者和观众距离较远，是否应该安排问答环节？以及如何避免问答环节的冷场和失控？


    如果企业里没有擅长随机应变，擅长应对这类场面的人，不建议安排问答环节，否则冷场或失控是大概率事件。有些企业的做法是：提前准备好大部分的问题和答案，由关系好的媒体现场搞有问事地询，然后再自己把准备好的答案煞有介事地说一遍。这种操作的关键是，主持人不给现场真的临时想问问题的记者发言的机会，免得出现意外。供参考。


    您怎么评价锤子手机的发布会？您觉得锤子的发布会最成功的状态或者最好的地方在哪里？


    锤子科技的发布会，从技术层面上，受限于各种条件，很多事情其实都没有做好。锤子科技的发布会真正做得好的地方有两个：


    - **第一个地方是产品的优点讲解和演示做得好。**


    很多企业做的产品优点很突出，但讲解得不好，所以我前期传播就会相对弱。而且除了苹果公司和锤子科技，其他手机厂商也不敢做手机功能的现场演示，要么就是没什么可供演示的差异化的功能，要么是怕现场意外丢人，这是有问题的。


    当然，他们可能还是卖得很好，销量很大，这是因为产品的商业成功，是一个复杂的系统工程。有的企业发布会做得不够好，甚至可能产品都不好，其他方面很强，比如销售团队很厉害、供应链管理和成本控制做得很厉害、运营商渠道很厉害，也有可能很成功。锤子科技做了五年，直到这次的坚果Pro发布后才打开局面，是因为别的方面短板多，单说发布会的，我们的产品讲解和演示功能演示，从一开始就定准是示范级别的。


    - **第二个地方是故事讲得好。**


    锤子科技上的创业过程，是一个活生生的关于野望、关于工匠精神、关于理想主义的样板。光是有这样有什么用呢？每年有那么多野心勃勃的创业公司成立，他们其中的一部分人，跟我们有着一样的梦想、一样的工匠精神、一样的理想主义，但一直倒到倒，都没有人知道。


    如果你觉得成功，传播得成功，它会打动足够多的人，在暂时的创业初期，产品本身还没达到一些瑕疵的情况时，在供应链和生产根本搞不定所以没法及时交付产品的情况下，甚至完全没有财务预算去打广告做宣传的情况下，也能转化一个体量还不错的，虽然可能还不足以让公司盈利，但足以让公司活下来的忠实用户群体。


    你不要把这个讲故事理解成是瞎编一个故事。有的企业卖实话，我们不会讲故事，我们只会踏踏实实地几十年如一日地做好一件事，然后踏踏实实地卖给消费者。这不是讲故事呢？当然是，这是一个踏实本分的品牌故事。有的企业家说，我们赚多少少钱，取得多少成就也不会满足，我们在某个领域一旦做成，马上就想开始挑战下一个难题了。这是一个富冒险和进取精神的品牌故事。


    所有的大企业在讲故事，只讲得好的，且讲得不好。在讲不好，分的可以用想办法学习训练，直至最终讲好，或是用其他的长板暂时弥补你这个短板。回头再讲，但不能回避这个问题。因为


