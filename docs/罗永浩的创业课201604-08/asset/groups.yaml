    “定位”这本书中列举了1923年在25个商品品类中排名第一的25个品牌，77年之后，这25个品牌中，只有3个出现了问题，其他的22个仍然在自己的领域里是第一名。里斯和特劳特说，“历史表明，第一个进入人们心智的品牌占据的长期市场份额通常是第二个品牌的2倍、第三个品牌的4倍。而且，这个比例不会轻易改变。”


