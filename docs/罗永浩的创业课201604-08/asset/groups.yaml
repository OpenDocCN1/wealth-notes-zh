    > 以上就是今天的内容，也就是关于先在消费者心智中成为大品、小品牌的重要性，以及如果一个品类的领域你来的太晚的话如何更聪明地去找到生存和发展的问题。


    马云说


    - 1. 市场上没有空位的时候，尝试重新定位对手；

    - 2. 品牌延伸的误区。


    ## 首先我们先我们谈该如何重新定位对手。


    上一次的课程中，我们谈到如果你的品牌没有成为某个品类里的第一，即使做到了第二，也会长期地处在艰难的竞争困境中，并且做什么都是事倍功半。但


    ![](img/3f2553c19e3d8036724ac589070714e0_113_0.png)


    比如一个拿着可口可乐永远打不过可口可乐的公司，在运动饮料这个新品类当中以一个弱品牌的速度为第一，以至于对所有可乐公司实力介入这个运动饮料品来后，也永远打不过这个公司的。


    这些听起来很不错，但很不幸，你的创业，可能要面对的是一个难于找到这样的空位的情况，如果没有这个空位，该怎么办呢？还有一种方法就是，如果


    ## 什么是重新定位竞争对手呢？


    比如，你是一个做汉堡的，排在你前面的竞争对手都是油煎或油炸的，而你的肉饼是火烤的。这时候，


    > **强调非油炸的** 火烤肉饼更少油，更健康，本质上就是在重新定位你的竞争对手。如果你的营销宣传很成功一直保持，就会让你的竞争对手显得比你的更油腻、更不健康的汉堡。


    > 参考公众号7489150，阿甘说车， 探索有趣与有意思的汽车文化 汽车定位就是更油煎、更不健康的汉堡。


    实际上一直排名第二的汉堡王，多年来，都是对排名第一的麦当劳这么做的，效果非常好。


    再比如，你是一个做感冒药的，你的竞争对手的感冒药吃完了以后胃部会唏嘘。这时候，你在宣传中反复强调自己跟竞争对手的不同，强调你的品牌是不唏嘘、不扯胃的感冒药，本质上就是在重新定位你的竞争对手。如果你的营销宣传很成功并一直排下去，就会让你的竞争对手被定位成胃部抽搐、还会腹泻的感冒药。


    再比如，国产的立白洗衣粉，大家最熟悉的就是它“不伤手”的宣传。1987年立白开始推广自有品牌的洗衣粉。当时，中国日化零售市场上已经有宝洁、联合利华这些外资巨头，也有广大范围的竞争，立白的创始人想了很多办法，最后选择“不伤手”来做概念，请了陈佩斯在电视广告中反复强调“洗衣不伤手”，让很多消费者产生一个感觉，那就是“原来其他洗衣粉都是伤手的”，通过这样重新定位竞争对手，也获得了巨大的成功。


    但是


    ![](img/3f2553c19e3d8036724ac589070714e0_113_1.png)


    一般说来，亚洲文化地区的人，对有竞争关系的企业指名道姓地在广告中做比较，和做针对竞争对手的重新定位等等，普遍持反感态度，即便你在比较和重新定位时的全部都是事实，即你有没有跟竞争对手有任何歪曲和污蔑的成分，只要分寸感稍有问题，都可能引来非常负面的回响。


    ## 接下来说说品牌延伸的误区。


    品牌延伸是符合人的直觉的：如果你开一家公司，用松下这个品牌卖多了收单机，接下来大家就会期待你用这个卖名做手机、录像带、电视机、洗衣机、冰箱、空调、汽车等等。为什么不呢？反正大家都知道松下这个牌子，用这个知名品牌做新品类的时候，省了多少钱的推广费用，这是非常符合直觉的思维。


    在过去，亚洲的绝大多数企业都是这样考虑问题并制定策略的。但是定位理论告诉我们，


    > **当你** 是你**的竞争对手，比如日立、东芝、索尼、夏普也和你一样品牌延伸，用同一个品牌做无数品类的时候，也许看不出它这样做做新定位在哪里。但如果你的竞争对手采用的是**
    长远的看你，你的公司迟早就会出现持续的颓势。


    著名的打印机生产商施乐在它的金盛时期，垄断了打印机行业。施乐几乎成了打印机的同义词，这是一笔带来了不菲的成功。施乐在打印机领里里是如此的权威，以至于当施乐用自己的品牌尝试去进个人电脑时，消费者很理理解消费者里挥着的那个印着施乐LOGO的机器竟然不是打印机而是别的某种机器。无论施乐如做宣传广告，多数消费者都觉得施乐的电脑要么电脑，要么是一台打印机。最后，气急败坏的施乐给自己的电脑产品打了一个海报广告：这是一台不能打印机的施乐系列。但对消费者来说，一台不能打印的施乐机器，就是一台坏了的施乐打印机。


    施乐烧掉了无数的钱去跟IBM竞争电脑市场，最后终于承认失败。但同样的失的和弱点，如果用一个新的品牌去跟IBM竞争个人产品，有没机子。


    当施乐产品永远得不到它进IBN，但成为计算机行业的第三或第品牌延是很有危险的。


    如果施乐一意孤行，用施乐这个牌子做各种各样打印机之外的东西，会怎么样呢？起码得有一天，未知当施乐就是打印机的消费者会感到困惑。会得施乐什么都是，又什么都不都是。这时候，新的施乐产品做做出来，造老的优势也将销释甚至可能要丧失了。


    拜耳药因为成功研发生产了人类历史上最伟大的药物之一，阿司匹林。两公司把这个名字几乎定为公司医林的医同义词，杰诺斯拜耳药，打击阿司匹林的同制解构。作为对标，拜耳生产了一种药止酸胃的，包装上写着“不含可同林的止酸药”，可是对这个世界来说，拜耳药即同司匹林。阿司匹林就是拜耳。而不含阿司匹林的拜耳药物，就什么都不都是。


    里斯和特劳特对于品牌是各做到了在某一品类里面成为领导者，有一个很经典的测试方法，叫做。就是让你把一些品牌写到纸上，比如海飞丝、李施德、绿箭、佳洁士等等，不需要念给其它人后让你的家人去超市时帮买回来。大多数丈夫或妻子都能正确的买东西。


    但如果是另外一些乱七八糟、什么都做的品牌延伸产品，就必须要告诉他/她品牌加具体产品名称，长此以往，当你的品牌让人想一会儿才反应过来是什么的时，已经彻底输给了那些看到Logo就能让人想到是什么，而且只能是什么的品


    ![](img/3f2553c19e3d8036724ac589070714e0_113_2.png)


    ## 罗浩


    好，以上就是今天创业课的内容，欢迎你写下听完之后的感想留言，我们在留言区里一起交流。


    比如你看到那个钩子，就知道是耐克；看到那个“三叉星”，就知道是奔驰；看到那个巨大的M字标识，就知道是麦当劳；甚至有时候只是远远的看到一个红色的大型建筑上有黄色的色块，就知道那是宜家。


    讲到这儿，可能有人会觉得，玩什么花概念啊，所谓“视觉锤”不就是商标吗？商标是怎么回事还要你来讲？当然没有那么简单。


    首先，不是所有的商标都能称得上视觉锤，只有那些能进入用户心智的才算。比如前面提到的钩子、三叉星和M，像这样的知名商标还有不少。但要知道的是，世界上有这么多品牌，能进人记忆的最好最著名的一小部分而已，绝大多数品牌的商标都没有完成视觉锤的任务。


    另外，视觉锤也未必就是商标。它是你的品牌在消费者心智中留下的最深刻的视觉印记。可以是商标，也可以是产品的造型、包装，可以是一张海报、一段电视广告，甚至可以是一个事件、一个代言人或创始人的形象。总之，


    比如，烟草商万宝路的视觉锤就不定它的商标。而是那些好、那些蓝天白云上，骑着马的牛仔；又如，珠宝商Tiffany的视觉锤，是它的店面和包装盒上的蓝色，不是它的商标。


    最典型的非商标视觉锤的例子，就是可口可乐的那个著名的玻璃瓶，全人类都知道的那个瓶子。


    你即使走长途旅行，甚至去掉瓶子的所有细节，只看瓶子的轮廓，也能认出那个收缩的可口可乐玻璃瓶。这个瓶子有多大呢？有了宝特瓶和易拉罐之后的今天，玻璃瓶的可口可乐销量其实并不太高。但即使是易拉罐、塑料瓶的可口可乐包装上，也都印上了那个收缩的玻璃瓶的形状。由此这张大的视觉字，把可口可乐这个非常强烈、视觉字的符号到了消费者的心智空间。这里面当然有每年好几亿美元广告费的功用——但是，可口可乐形象—本身的视觉设计—无论从形状还是颜色—也是很重要的。其他的饮料商，如果没有同样优秀的视觉形象，即便花费同样甚至更多的广告费，也难以达到这样的效果。


    我们为什么需要用视觉来实现或辅助实现定位呢？因为表达同一件事，图像形式比语言或者文字给人留下的印象深得多，也常常比文字更容易引起情感共鸣。


    1973年，心理学家莱昂内尔·斯坦坦做了一项调查研究，他请研究对象在5秒内看了10000张图片，每张图片显示5秒钟。之后，再向研究对象展示成组的图片，一张是他们见过的，一张是此前没有见过的，这时，他们能记住之前看到过的70%的图片。这个实验结果非常让人惊讶，想想看，如果给你5天内展示10000条广告口号，每条5秒钟，之后你还记得住几条呢？


    那具体如何打造视觉锤呢？视觉锤可以有很多，只要你花心思想，想给消费者留下印象的话，那么是多种多样的。形状、颜色、造型、包装等等，都可能成为有效的手段。


    今天我要讲一下形状和颜色这两个核心要点。


    ### 1. 形状


    晶品的格，充满上帝气的劳斯莱斯：


    ![](img/3f2553c19e3d8036724ac589070714e0_115_0.png)


    比如线条特殊的甲壳虫和 MINI Cooper：


    ![](img/3f2553c19e3d8036724ac589070714e0_115_1.png)


    这些车都是在造型本身下足了功夫，以至于你不用看 Logo，老远就能认出是它们。而且作为在这方面非常专业的厂商，它们多年来，无论如何调整外观方面的细节，它们始终懂得保持自身造型独特的视觉元素，最终从视觉上深深地植入了消费者的脑海。远看的看，面目模糊，样子随大溜，让人记不住形象的车型，在工艺上生产出忠诚度的，谁会固执地一再选择某一种自己都想不起来长什么样子的车呢？


    虽然在整体造型上很多厂商并没有有意识地继承和发展一些自身固有的设计语言，但在汽车前脸这，多数厂商还是很注意继承和发展的。只是单靠一个前脸，很难做到像前面提到过的那些车一样，从任何角度都能一眼认出。


    20世纪10年代，一家糖果厂商本来要将薄荷糖压制成规则的圆形，但是发现如果压制过程中，在中间留个孔，生产工艺上就会顺利很多。于是它们干脆就留了一个孔，做成一个漂亮的圆圈饼，并且把这个薄荷糖命名为
    Life Savers，也就是美语里的“救生圈”的意思，然后在广告和包装上都大力宣传这是一种“中间带个孔的薄荷糖”。上市之后，大人小孩都喜欢，立刻风靡了美国，虽然它的味道跟别的薄荷糖几乎没有差异。


    ![](img/3f2553c19e3d8036724ac589070714e0_115_2.png)


    当其他薄荷糖都是千篇一律的小圆片的时候，小朋友们无比热爱这个救生圈一样的薄荷糖。多年以后，著名的食品厂商雀巢的英国公司，不知道是山寨了还是得到了授权了救生圈薄荷糖的这个创意和造型，生产了一种叫“宝路”的圆圈型薄荷糖，宣传语也是中间有一个孔的薄荷糖。由于种种原因，数生圆圈薄荷糖好像一直没有进入中国，整桔几代的中国孩子，都是吃着宝路薄荷糖长大的。


    ## 二、用包装打造视觉锤


    昨天我们提到了可口可乐经典玻璃瓶包装的巨大影响，那在中国有没有这样高辨识度的饮料包装呢？


    屈臣氏包装的瓶子肯定要算一个，农夫山泉的小红帽也算一个。电视台的节目经常会把嘉宾喝的矿泉水的包装纸拿掉，但你看到一个透明的瓶子上有一个小红帽，就知道那是农夫山泉。这些虽然都没有可口可乐的瓶子形状那么讨人喜欢和经典，但都是非常成功的例子。


    信远斋的杨梅汤包装，选择装在一个圆鼓鼓的小坛子一样的玻璃瓶里，容量比普通的塑料瓶小很多，但依然很受欢迎，被消费者亲切地称为“小地雷”，也是很成功的视觉锤设计，不过很多人记不住它的品牌“信远斋”，这并不
    是好事。


    ![](img/3f2553c19e3d8036724ac589070714e0_115_3.png)


    在中文里，“包装”这个词有两层意思：


    - 1. 指装有你的产品的那个盒子、瓶子、袋子等；

    - 2. 指推广、传播、宣传产品的手段和打造品牌形象的方法。


    很多创业者在给产品做包装时，只是把产品简单地装进一个袋子或盒子里而已，忽略了第二层意思，这是很可惜的。


    比如 2000 年前后风靡美国的一款饮料——维他命水，包装设计就很独特。作为一款饮料，它的瓶身以及上面的印刷风格都被设计得像药剂一样，这是为什么呢？因为美国人民饱受高糖分碳酸饮料的困扰，生活在“肥胖大国”的集体焦虑之中。而维他命水横空出世，强调自己“维他命+水”的健康水剂定位，是逢应其时的一个合理产物。它的包装完美地契合了这个定位——它从来没有说过自己不是药，也没投资这一说法。但这种药剂一样的设计，却巧妙地对消费者产生了心理暗示——它对我的健康有好处，它能解决问题。


    ![](img/3f2553c19e3d8036724ac589070714e0_115_4.png)


    实际上，用心设计包装，始终都是一个有效建立视觉锤的方法。锤子科技虽然不止一次得到过包装方面的国际奖，我也很早就接触过它对视觉锤的理论，但在后来的工作实践中，由于种种原因，还没有建立一个强大的定位和鲜明的视觉锤，这是我录制这个得到课程时感到非常惭愧的。


    ## 三、用人物形象打造视觉锤：是个好主意吗？


    今天要谈的最后一个问题：用真实的人物形象来充当视觉锤，是不是个好主意？


    这个问题要分两种情况来看：


    - 1. 用明星代言，甚至用明星来做视觉锤；

    - 2. 是用创始人的形象来做视觉锤。


    ### 1. 用名人来做视觉锤


    是一把双刃剑，名人效应大家有目共睹，在每个时代，各大品牌都在争夺最红的明星来代言。但这样做有三个风险：


    - 如果是当红的明星，很可能会代言很多种产品，所以你在视觉上，对这个人的形象不具有独占性，很难形成一个让人印象深刻的视觉锤。现在你打开电视，广告里基本上来来回回就那几个偶像明星，每个人都有十几个产品的代言，消费者真的分不清、记不住，即使是这些明星的铁杆粉丝。

    - 典型的例子是让一个特别有钱的明星去代言一个廉价产品，消费者不会信服。美国消费者就曾经很不信服：“老虎”伍兹平均每年赚6000多万美元，他怎么会开他代言的别克汽车呢？

    - “老虎”伍兹，他后来发生的事，让他代言的品牌都只想尽快跟他解绑。中国也有这样的例子，我就不展开谈了。


    所以整体上，请明星代言问题不大，但用某一个明星做长期的视觉锤，是值得慎重考虑的。


    ### 2. 用企业创始人的形象做视觉锤


    在今天，我们看到越来越多的创始人来到台前，去出镜、去演讲、去发布产品。锤子科技也一直被认为是使用这样一个策略的。那么，这是不是个好主意呢？


    创始人本人的形象成为这个品牌最经典的视觉印记，有一些成功的例子，美国有肯德基老爷爷，中国有陶华碧老干妈。你还能想起来几个？全世界那么多品牌，能随随便便就想起来的一共也没几个，这通常说明用创始人形象做视觉锤，并不是一个很好的选择。


    肯德基的桑德斯上校，看起来就是一个在肯塔基州勤勤恳恳做饭的老爷爷，穿一件干干净净的白色上衣，笑容慈祥无公害，西方人看到他，就像看到了自己的爷爷。


    老干妈罐子上的陶华碧女士头像，你看到她，就像看到了一个典型的“中国母亲”。李安当年拍“父亲三部曲”，三部全部找台湾演员郎雄来演父亲的角色，李安说，郎雄这张脸，完全就是一张中国父亲的脸。


