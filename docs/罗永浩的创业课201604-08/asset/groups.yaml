    # 最难搞定的人？


    第8篇 | 我是如何挖到那...


    欢迎来到我的干货日记，你好，我是老罗，罗永浩。


    今天和你分享的 topics 是，在招聘当中最难搞定的几种情况，和我个人对应这些情况的三种招数。


    第一种比较难搞定的人，是那种对创业打天下、还有改变世界、热血这些东西完全无感的，这帮家伙你说起米特别吃力，你使尽浑身解数在他眼里看着就像个小丑，特别疲劳。


    第二种情况是特别优柔寡断的，这种人也是让人最头疼的一种，就是你今天跟他谈完他非常激动的同意了，明天他的主管跟他谈一谈他又说不能了，后头你再说他又不来了，大后天他的主管挽留他，又说不来了，这种特人特别精疲力尽，而且常常结果都是很糟糕的。


    第三种也是比较烦人的，就是长期不表态，自始至终都没说过同意，你约他就出来，每次聊都很热乎，接着给他一个时间要他做一个决断，就没有下文了，这些都是属于最难的情况。


    做过人力资源的，都对这三种情况感到比较头疼，那我们就要针对性地讲一讲我们这些年积累下来的一些方法。


    # 1、对创业无感型：设计具体场景


    第一种就是那些对创业、打天下完全无感的人，热血燃不起来的人。这些人沟通时候燃不起来，很重要的一个原因就是他的燃点比别人低。低燃点的人，你要设计一个场景，能令这个人激动起来的地方，肯定不是一个黑乎乎的、开到很晚的酒吧、夜总会或者咖啡厅，而是那种特别能让人激动起来，或者你讲去什么打天下、创业、改变世界，听起场景都是与之匹配的。


    比如说，典型的例子就是那些特别高层的摩天堂，以北京为例，比较好的场所就是丽泽中心，丽泽中心那个楼足够高，下边对着的是长安街，无论是晚上还是下边车流人流永远川流不息的。


    你把这种燃不起来的人（拉到这样的地方去，坐在一些酒一面对窗子看的就是下边汹涌的人流、车流和灯光，你在这个几十层的高楼上再跟他讲一些创业、打天下的东西，听起来整个气氛就全对了。最无感的人到这样地方，最后眼睛也会亮起来，特别是你再请一些很贵的酒，比如一瓶两千多块钱、三千多块钱的酒，你喝着这样的酒跟你在那样的场景下，你再一忽悠，燃点再低的人也会产生一些眼前发亮的东西。


    这招其实不是我自已想出来的，这是我创业初期跟我们的老朋友，也是我们的天使投资人，陌陌科技的老板唐岩，聊到我说我出去挖人的时候碰到最难的一种情况，我像变猴一样讲了半天很激动、很热血沸腾的东西，结果对方等于无动于衷。后来唐岩就说他自己的实践摸索中，这种人就要找一些场景，去摩天大楼、高档酒店的大堂吧喝点酒，然后再讲的话，气氛就全对了。


    # 2、优柔寡断型：破罐子破碎，刺激他一下


    第二种情况也是比较讨厌的，就是特别优柔寡断型的人物，我个人的经历里边如果出去谈人的话，这种概率大概是20%，是非常非常难以搞定的一种情况。


    你今天跟他谈了讲得他很激动，完全听进去了，跟你产生了严重的共鸣，当天夜里恨不得就答应了，接下来几天跟你短信、微信通得很热乎，然后不到一个礼拜就动静了。你再去追一下，就发现他的主管得知他有去意之后，跟他也是来了一轮深谈、恩说，就把他劝得留下来，'
  - '[PAGE 36]


    相顾的时间都可以叫他聊一会。而你呢，你只能一两个礼拜约他一次，所以如果这个人一直优柔寡断下去，最后时间成本上你也要输给他的主管的。


    综合这种情况，多数人力资源领域的人给你的建议是这种就放弃算了，但是我个人的经验是，还有一种可能是有望在最后争取一下的。当这个优柔寡断的人是一个大企业的人，他是个创业公司的时候，最后反正已经不行了、破罐子破摔，你可以尝试去刺激他一下，说一些难听的话，大概意思就是说像你这么优柔寡断的人成不了什么，远远就会在大企业里混吃等死算了、永远没有机会享受到创业公司打天下，然后将来享受这个革命成果这样的东西。


    这样的风险是如果谈不成以后可能就见得谈了，但是一般说来，这些优柔寡断的人，如果你跟他客客气气的反倒效果比较差，如果这样用难听的话刺激一下，反倒有可能激起他的斗志，局面就会改观。


    坦率地讲，我们今天软件业务部门的副总裁，我的合伙人当年就是这么来的。当年他过来聊的时候谈了很多次，每一次聊的时候，他都会问他的其他的几个实力很强的同事有没有被我们搞定。当他说如果没有搞定的时候就不再地表示，如果那几个搞定还差不多，否则的话自己答应完了也是今天同意明天后悔，这样反复了很多次以后，最后一次聊的时候我很崩溃，其实当时我跟他聊的时候并不一定一个策略或技巧型的，我只是因为崩溃，做了情绪上不稳定、不应该讲的一些话。我说了很多难听的，大意就是说你就这样下去，也不会有什么出息的之类的。他一再问他的那几个很小的同事有没有被我们搞定的时候，我就说什么你永远都是这俩着而不是第一拔的？我说等他们都来了你再来有意思吗？我为什么说你不能是第一个？我讲了这个话给他造成了很大的刺激，据他后来告诉我，当天夜里就失眠了，过了一两天他就同意加盟我们锤子科技。


    这个之后，我有意识的把这招用了几次，发现在那些完全搞不定的优柔寡断的人当中，管用的概率还是不错的。当然，如果你这样得罪了他以后也不管用的，过了一段时间我建议你你还是给他发一个短信、微信道歉，表示当时自己是态度失控，这样的话还留个香火情，将来也许能在其他的某个机会，以他的方式走到一起。


    # 3、长期不表态型：充分展示优势，造成强大冲击


    还有一种情况也是非常讨厌的，就是你跟他像谈恋爱一样谈了好几个月，每次约他都出来，出来完了最终要他表态他就没有下文了，这种非常讨厌。寡断型的是翻来复去的所以讨厌，这种他如果干净利落地把你否决了其实也还好，但是你只要一约他他就来陪你聊啊，聊完聊聊也挺高兴，然后让他表态，他就不表态了，这个有点像我们年轻时谈恋爱必碰到的一些讨厌的古怪的姑娘。


    我个人对付这些长期不表态的这种人采用的方式是，如果我跟他已经谈了差不多半年了，可能我们下一次产品发布会就要来了，通常的方式是，我在上面演讲的时候，把正前方黄金的那个位置，留给那种长期挖却没有搞定的那些核心人才，把他们埋在那很炎热的铁杆支持者的锤友当中去，他前后左右都是这种非常热烈的气氛，他坐在中间，在现场感受这个气氛以后，会产生一种强烈的感觉，好像全世界都在支持这个企业成功。


    我过去的经历是，长期搞不定的，如果经历了一次演讲的这种洗礼的话，当天夜里就给我发短信表示同意的不在少数。如果我们约约会会结束后的几密集地跟他们约饭、约会谈这个事情的话，大多数都是能搞定的。这个东西是我比较个人化的一个经验和能力，也许对你不适用，但是我希望它对你构成一个启发。


    因为我们是做科技行业的，又是一个软件驱动型企业，在软件工程师当中开源是一个非常崇尚的、神圣的，也是一个非常让人感觉到这个世界的善意和温暖的这么一个举动。我们从事科技行业之后，转为把每年演讲收入的这些门票的款项捐给开源社区，所以我们在软件工程师当中，因为历次的几次捐款活动造成的非常好的影响，对在整个的软件工程师这个行业里，对那个无名其妙的软件工程师做的科技公司产生了非常深刻的认同和好感，这也使得我们后来的招聘工作变得越来越顺利。这一点也是供你参考的、一个企业在招聘人才方面无时刻做的努力的一部分。


