    \n（这些后面会谈到），单是从人的性格和特质上，我认为只有两种人适合创业。\n\n第一种：最简单、最赤裸，就是渴望发大财赚大钱的人。\n\n这就是多数创业者迈出这一步的基本动力。通过赚更多的钱来满足自己的物质欲望，或者是通过赚更多的钱来彻底改变自己和家人的命运，这是人类不断的奋斗和进步的最古老动力之一，是没有什么可耻的。某种程度上，你甚至可以认为整个人类的某种变化，就是一个穷人试图通过商业经营活动和个人奋斗来改变自己贫穷命运的一部历史。\n\
    \n所以想赚钱、发大财没有什么不好，人有了大量的花不完的钱，那心很宽，也能更好的照顾家人、朋友和那些需要帮助的人。所以有钱的人，通常幸福指数会比较高，除非个人的家庭或感情生活出现严重问题，否则，一般来说，幸福指数是比较高的。\n\
    \n你不要听那些乌七八糟的谣传，最近我看了一个好像是美国还是欧洲做的调查显示，一旦个人年收入超过某一条线，我记得是一个中产偏上的那条线以后，感觉幸福的几率是百分之百。所以有钱给你带来的一个非常大的变化，就是会有非常幸福。那么渴望发大财赚大钱，是创业者迈出这一步的一个最根本，也是最爱提的基本动力之一。如果是一个渴望发大财赚大钱的人，很可能你是适合创业的。\n\
    \n第二种：不甘于平凡、需要获得更大的满足感、成就感的人。\n\n我们小时候身边有一些人，有的是天生胸怀大志，当然也有的一些是天生的幻想，或者他们仅仅是容易被那些胸怀大志的人的故事所感染。反正这样的比例明显高于成年人。长大的过程中，被各种各样的现实问题打击以后，多数人就死心了。但如果各种各样的成长挫折和困难之后，仍然没有丧失这些心气，并且严重的不安分，有时还最爱捣点什么名堂，搞点什么动作，那可能是非常适合创业的人。\n\
    \n所以简单的讲，我认为的两种人适合创业，一种人就是想发大财，第二种人是不甘于平凡的，这两种都是非常好的适合创业的一个基本素质。当然最完美的就是结合了这两点的人，既渴望发大财，又不甘于平凡，追求更大事业上的成就感的人。\n\
    \n### 2、这6类人不适合创业，注意了！\n\n好，说完什么人适合创业，再来看看什么人不适合创业。我认为有下面这么几种人：\n\n那些特别怕累、特别怕麻烦的人。\n\
    \n多数人对一些累、麻烦、不耐烦的事情，都有一个普通的接受程度。但是有些人格外怕累、怕麻烦，跟头一起工作的时侯，他总是推诿、拖延，这种人大都是不适合创业的。\n\
    \n当然也有一些改变的特例，比如大象众会的黄章老师，当年在我们这群朋友当中不合道善铭，但他创业做了大象众会后整个人完全脱胎换骨的。他勤奋和投入的程度，工作状态不要的程度，连自己都害怕。我是想说在绝大多数情况下，创业一定是一个特别苦、特别累，特别麻烦的事情。所以如果你本来特别怕这些东西的，创业前一定要想清楚。\n\
    \n另外，你创业的时候选的项目是不是自己热爱的，是不是让你有激情的，也是非常重要的。因为如果是自己热爱的，你能比另人多坚持很长时间。人家三年放弃了，你四年五年没放弃，可能也就成了。\n\
    \n选择、具体方案的操作方法等等感到犹豫，而不是为了要不要创业而感到犹豫，这是有本质区别的。就是**如果你对创业这件事并不激动，而是犹豫困惑，那多半是不适合创业的**。也许适合跟着人创业，但可能不适合自己独立出来创业。\n\
    \n另外也不要老想着创业，现在全民创业并不是什么健康的事情。对今天中国的创业者们来讲，无疑是赶上了一个很难得的好时代，但是这一波的浪潮，跟所有的浪潮一样，里面肯定有大量的、虚火的、泡沫的东西，除非把自己和要干的这个事都想的非常清楚，否则不要盲目的跟风去创业。不要觉得自己在某某公司，比如说老牌的某个公司，身边一看，能力强一点的四个同事里三个都去创业了，然后你可能是那第四个公认能力比较强的，然后你就有压力了，不要盲目跟风去创业。所谓的全民创业肯定有集体抽风的成分，这个要想清楚。\n\
    \n希望自由、不想打工受委屈的，也不适合创业。\n\n有一些人之所以走上创业这条路，是因为觉得自己性格上不适合给别人打工，觉得自己受不得委屈，不喜欢被老板、上司安排自己的时间，希望能自由一些。如果基于这种理由去创业，是严重不提倡的。\n\
    \n因为这不是一个好的创业理由，甚至很具讽刺意味，你可能会遇到更糟糕的结果。因为创业之后，你多半会发现要承受更多、更大、更严重、更恶心的委屈。以前你承受的委屈来自老板，现在创业之后，谁都能给你委屈，比如说媒体，比如说你的消费者，你的用户等等，都会让你承受多得多的委屈。所以马云老讲，**企业家的内心都是被委屈撑大的**，你就知道一个人做老板要承受的委屈，要比他打工的时候承受的委屈要多无数倍。这个你一定要有清醒认知。\n\
    \n另外，你做了老板，就会很痛苦地发现，你的时间都被助理给安排完了，而且大多数时候大部分的安排，可能你都改不了。所以一定要记得，觉得自己受不了委屈，不喜欢被别人安排时间而出来创业，这个理由是非常荒谬的。\n\
    \n对和家人相处时长很在意的人，可能也不适合创业。\n\n有些人很重视自己一天、一个星期、一个月能跟家人共处的时间有多少，如果你对跟家人相处这个时间的量很在意的话，千万不要创业。\n\
    \n关于创业的一个最大谎言，就是所谓的平衡好家庭和工作，这件事在理论上绝无可能。一旦启动创业，就全是工作，家庭是很难兼顾的。除非你的创业项目是和老婆开一个六个月内大概率会倒闭的咖啡馆或者是书店之类的。大概就是这样。\n\
