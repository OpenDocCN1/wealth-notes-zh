    大的前这个不太可能的。所以，这个问题今天的答案就是：除去去AB股这样的国家上市，否则绝对控制权是肯定没法保障的。


    现在，我们知道的那些合法的手段，通常也都是保证上市前你能够最大限度地控制这个公司。上市前，你把利益都让出去了，但仍然能控制公司；上市后，有些相关的人和你的一些高管会绑定一个时间，比如说四年不能卖，到它能卖的时候，按照中国《公司法》，只要提到市场流通的这些股份都是同股同权的。所以，只要你的高管、你的合伙人，你的投资人可以随便买卖，那么，卖的时候你曾经尽力用一些合法手段维持过的那个控制权也会陆续地出现问题。


    所以，很多上市公司的老板，如果从股份的比例上已经失去了控制权，通常会通过其他手段来弥补。


    就像王石早年通过与跟华润的长期友好合作；但是，当华润不再支持他的时候，这个东西就变得没有办法保证了。一旦初期失去了控制权，在后面的发展里面，它对很多已经成功上市，并且企业发展得还好的企业的老板来讲都是一个，可能是一个终身的课题。


    什么样的基层员工可以迅速地得到提升？


    原则上说我们会认为那些得到良好发展的员工都是因为他自身的实力和表现。但是，这个世界常常没有那么多公平，就像我以前老讲的。


    我们经常看到的人类社会的真实状况（包括在企业里）：很多人真的非常优秀，但是他不善于表达，然后他优秀的那个面就会明显吃亏。因为没有人知道，你能怪谁呢？


    内向型的失败者经常有的一个没出息的心理就是：他特别希望他可以在那儿静悄悄地散发香味，别人就闻见了。但问题是：安静的美男子一定是机会要少很多倍，虽然你是个好男子，你还需要做一个大声喧哗的美男子，这样机会就多得多了。


    一般来讲，能够问到我这样问题的人通常就是一个明白人，甘于自己其实挺普通，但却不知道为什么不像同一件事一样迅速地得到提升。所以，我是觉得：


    ## 1. 要训练自己表达的能力


    比如如果你想方法多做一些当众演讲，跟更多的人进行交流。你可以参与社交场合或者是参加某个学习班或者课程；总之，而且，如果像我这么容易紧张和腼腆的人也能成为大家公认的中国最好的演讲家之一，那么，其实你不需要把自己变成这么强，你只需要能够在同事、领导面前和其他集体工作的场合准确地表达自己的意识就够了。如果要练到这个程度，我觉得有意识地去做一个基础训练是肯定能够达到的。


    因为，我们稍后也会涉及到一些如何做演讲的那部分课程。需要在这几块心思多听一听，应该是有帮助的。


    ## 2. 通过阅读来修炼在不同的场合的准确表达


    作为一个基层员工，如何在同事、领导在不同的场合准确地表达也很重要。有的场合，你跟同事适合开玩笑或者表达；但是，领导在场的时刻，那个未必就是得体的。反过来也是一样。


    所以，我觉得除了听我讲后面关于演讲的这部分以外，可能也需要再看一些职场相处和沟通方面的书。


    反正我是希望那些骨子里内向腼腆的人，能在这个外向的人统治的世界里想办法通过训练和交流手段弥补。你不用在外向和善于与人交流、交际这方面方面达到特别强，只要达到及格的程度，在这方面就不太吃亏。这个是完全可以通过训练实现的，和天分无关。


    创业者能兼顾事业和家庭吗？


    这是绝无可能的。99%说兼顾家庭的创业者都是骗人的。


    过去中国这一拨互联网创业的大潮中，绝大多数创业者都是累得要命，完全无法兼顾事业和家庭，是全身心地，没日没夜地拼。但是，确实有一些例外。


    我确实见过奇葩的例子，比如唐若。陌陌的唐若是非常轻松地完成了创业、上市、非常漂亮的盈利，完成了一系列的成功。但是，他在全程里几乎没有过分地疲惫，特别拼，特别劳累的时刻。虽然，他自己谦虚地说这是他运气好，赶上了风口和时机。但是，我不觉得是这样。因为，他是我这辈子见过的最聪明的人之一。


    不过这个东西我觉得是不可遇不求的。所以，绝大多数正常人大概就是自己的创业定位就是：一旦走出去一定要把自己一条不回头，一旦走出这一步肯定照顾不好家庭。


    所以，你跟你的家人要有充分的沟通，还要有充分的心理准备。当然可以做出一些妥协，比如说，如果你把家搬到公司对面，那你中午至少可以回家吃饭。


    公司在新托罗拉的时候，我们家就是在公司的正对面，所以我走回家只要3分钟。这样的话，当我发现对老婆关照不足导致感情比较糟糕的时候，就会有意识地一起吃个午饭，改善她的情绪。


    但是，本质上说，这个我觉得所有创业者应该有心理准备，要不然可能走到某一天，比如说她婚姻失败了，事业成功了，这个结果不是你想要求的，要提前想好。如果你不在干，那是你的选择；如果你觉得婚姻和家庭要比事业更重要的话，可能你一开始就不应该走出这一步。


