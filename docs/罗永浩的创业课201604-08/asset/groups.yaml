    - 第二，请合伙人和同事分享内容知识。


    但是，因为公司走到今天五年了，我们也来了一些非常有实力的合伙人和高级主管。在他们擅长的业务领域里，其实我已经能从身边的同事身上学到很多特别牛的知识，这是熬到了一个时间点发生的变化。


