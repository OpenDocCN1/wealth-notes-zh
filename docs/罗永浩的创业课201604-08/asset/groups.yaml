    工作能力，比较散漫，对规章制度不屑一顾的人，在我们公司其实是很多的。但你要看


    如果他在创意工作岗位，这件事其实就没那么严重，因为他在一个不太依赖协同工作的工作岗位。在这些岗位上，如果对规章制度不屑一顾，但是，他没有给同事造成非常明确和不公的对待和伤害，我通常都会容忍。而且，我觉得没有必要去纠正他们，因为每个人的能力优势的一面必然伴随着一个优势能力的负面作用，那个负面作用常常就是负面的。所以，我不觉得在这些岗位上是一个问题。


    反而是一些创业者做了老板以后，由于他有很强的控制欲望，所以他总忍受自己手下没这种人的存在，所以就不太愿意地对一些不需要锻炼这种能力的岗位的人有这方面的要求，这是完全不可取的。


    从另一个角度，如果他做的都和规章制度是非常强相关的话，那么也没有什么好办法，只能去批评、教育、说服、改造。


    所以，我自己处理这些事情的时候，可能付出了很多努力，但是没有有什么特别不同于别人的技巧和方法。


    还有一个，我想补充关于工作能力特别强，但是比较散漫，对规章制度不屑一顾的人的管理方法。


    这些人你可以给他很高的薪水，给他很高的认可和尊重，甚至是一些荣誉制度。但是，一定要不要给他们管理角色，这是早期创业者很容易犯的逻辑。比如，手底下有几个“大功臣”，他们在早期创业过程中立下了汗马功劳，以至于要拿奖金、股份、期权已经不足以给他们回报。然后你会在发展阶段中给他一些title，然后让他去管理别人，这是非常可怕的。


    一定不要给一个对公司有重大贡献的人一个管理职位这件事理解成是奖励，这是完全不对的。这是一个工作性质，不是奖励。所以千万不能给那些需要、不适合做管理的给管理的位置。


    但这个问题很多人都会犯，我自己也犯过。而且这个犯了纠正很难。


    在亚洲文化里，这个职位“能上能下”是极端难实现的，极个别的企业可以实现，但绝大多数做不到。所以当你尝试把不适合管理的人放到管理层上，上就会招致错，员工去训斥他管理的时候，他会发现重重地扯到了他的尊严和面子问题，导致这个事无论怎么处理，他可能都会走掉。


    所以企业发展到足够大的规模的时候，从体制上可能要有意识地设计一些“虚衔”，但是级别、荣誉、位子都很高，可是不掌握实际的管理权力。这个可能也是从人性的角度出发很必要的这么一个部门设置。


    罗永浩


    这周的问答时间就到这里了，谢谢同学们的提问，如果你在创业中有什么困惑，或者有什么想和我分享的，都欢迎在留言区留言给我。


    我再重申下咱们专栏的更新时间，每周5次，周一到周五，上午9点准时更新。


    我是罗永浩，感谢你分享我的干货日记给你的朋友，咱们下周一见。


    ![](img/3f2553c19e3d8036724ac589070714e0_63_0.png)


    这件事变得更加深长，意义深远了。比如一群黑人凑在某个偶像面前喝血发誓，宣誓要同甘共苦，这样的仪式，是用来表示对一个集体的归属和认同。


    我们也会用


    等等。比如古代的文武百官早期朝给皇帝磕头的仪式，日本人对上级各种规定繁琐的鞠躬仪式等等，都是用来确立规则和权力关系的。


    比如小学生入学仪式，表明你已经结束了家里无拘无束的日子，开始进入一个像军人一样受管制约束的人生阶段了。


    比如婚礼这种仪式，就是在一群人面前公开宣布了告别了单身汉角色，转变为一个对家庭负有责任的已婚角色了。


    企业开发布会，也是这样一种仪式，这种仪式本身，也是为了达到上述的那种效果。所以企业常常在以下这些事情时开发布会：比如公司出现重大事件，比如兼并、重组、达成某种战略合作、重大业务转型，或是推出了新产品或新服务，融资成功等等。


    这些特定时刻的发布会，作为一种仪式，通常意味着企业


    等等。所以，无论是为了宣传推广，还是为了给内部提振士气，还是为了给合作伙伴或投资者信心，操办好一场发布会，都是非常重要的。


    ## 2. 发布会是企业一系列商业宣传的核心焦点


    发布会也是企业在第一轮商业宣传和推广周期内，最重要的一个核心焦点。在整个的商业宣传推广期间，事先的充分预热，当天的集中爆炸和释放，事后的持续推波助澜和发酵，最好都是围绕着发布会这一焦点来策划和实现。如果没有一场准备充分、执行有力的发布会，一个商业宣传周期内的整体活动，通常较难找到更好、更合理的聚焦和爆发点。


    ## 3. 发布会是用户的“共鸣场”和商务拓展的机会平台


    无论对 to C 的公司，还是 to B 的公司，发布会都很重要。


    如果你做的是 to C 业务的公司，


    在苹果还是小众产品的年代，每一场苹果发布会的视频，都让世界各处的那一小撮核心粉丝（包括听不懂蹩脚的）产生深深的共鸣。因为这种大型场合的持续存在，他们能够受到自己所在群体的关注，并没有想象的那么渺小和孤单，因此容易产生喜悦和更深的归属感。这种喜悦和归属感，还导致核心用户像传教一样热情地积极分享和推荐。这种核心团队带动着被认同的传播，会在一个企业的合作伙伴、投资人和大众当中，形成深远的影响。一场成功的发布会，也是潜在用户的挖掘机会，它让那些有独立判断，抗拒被硬广的疲劳轰炸洗脑的群体，发现适合找自己的东西。


    如果你做的是 to B 业务的公司，一般说来，


    一场成功的发布会，可以给合作伙伴带去信心，可以增加合作的可能性，可以有效触达企业客户，促进公司业务发展等等。


    ## 4. 发布会让企业寻求媒体报道变得更顺理成章


    欢迎来到我的干货日记，你好，我是老罗，罗永浩！


    本周的话题是“**发布会是创业者的必修课**”，今天的课程就来介绍“如何做好发布会的前期准备工作”。


    ## 1. 发布会的时间安排


    一般说来，事件类型的发布会或者是 to B 类型产品的发布会，对场地要求就没有那么高，人数也不会特别多，比如一百多人到三百五百人是比较普遍的情况。通常也就是在高档酒店的大型会议室或大礼堂举办，这种情况下提前两三周订场地就可以了。


    如果是，而且通常会对发布会场馆要求更高，人数从五百人以上到两三千人都是很常见的。在很多大城市，大型专业场馆的数量都是严重不足的，以我们相对比较熟悉的北京、上海、深圳为例，这对企业来说，是非常头疼的事情。提前半年就订好发布日期，这么长的时间周期内，各种主观、非主观的变化都有可能发生。为了万无一失，我们通常采用的方式是提前半年订好相邻两周左右的两个日期，这种情况下，场馆方通常会同意你在最后两三个月的时候免费取消一个。有时候凑到极端情况，损失订金也是有可能的。


    另一种情况是，如果你提前半年订了一个日期，场馆方通常会同意你在日期到来前两三个月免费改一次或两次时间，但要取决于你要改的那个时间点是否仍有档期。由于多数租赁方也都是被迫提前半年就订场馆的，所以他们的计划发生变故取消或改期的情况也比较常见。


    所以为了给记者提供方便，以及为了保证事后的传播的有效性，**比较合理的时间安排**是周二到周四的下午。道理上是这样的：周一记者很可能临时有事，那就答应过也不去了；周五来过之后做报道没问题，但周六周日的新闻会严重损失传播量。另外媒体工作者晚睡晚起很常见，所以安排在上午也不太好。所以最合理的时间是周二到周四的下午。


    锤子科技的情况比较特殊，我们多年以来都是周二到周四的晚上七点开。因为我们的发布会动辄上万人，而且要门票，这时候道理就跟演唱会差不多了：如果下午开，上班的观众会赶不过来，就可能影响上座率。


    ## 2. 发布会的地点及场馆选择


    一般说来，多数公司都会在公司所在地的城市举办发布会。但是最主要的一个原因是北京的媒体最多。如果企业自己的公关部门，或是在外面请的公关公司靠谱，能最大限度地保证媒体报道的覆盖面。


    在北京，大型专业场馆的审批手续是相对严格的。虽然场馆租赁方通常会帮忙协调审批手续，但和商业化程度更高的上海或深圳比，还是非常麻烦的。另外，即便是事先得到了承诺，也有可能是因为北京市的某些活动导致企业的发布会被临时叫停。否则就要面临最后关头取消活动的尴尬局面。但遇到这类情况，损失惨重的改期或改地点是免不了的。


    ## 3. 发布会现场的技术支持


    大型场馆的活动，对舞台搭建，灯光，音响，投影或 LED 屏幕等技术支持要求非常高。企业可以，否则到了活动当天，出现各种大大小小的技术故障或是效果得不到保障的情况，是大概率事件。通常出现这类情况，要么就是专业公司不够专业，要么就是偷工减料。


    另一种相对省心的情况是一，比如奥美公关这样的机构整体打包解决，但动辄贵出来好几倍的价格，通常不是创业公司所能负担的。


    ## 4. 发布会相关的物料准备


    发布会必备的物料包括海报，大尺寸喷绘的展板或背景墙，X展架，刀旗，门票，邀请函等等。


    幅，详细讲解。


    一般说来，准备充分的企业发布会活动，物料里还包括烘托气氛的开场视频。如果是产品发布会，还会有产品的广告视频，通常是制作精良的3D宣传片。另外，活动结尾处掀起高潮的时候，播放一段描绘企业美好前景的煽情视频也是常见的处理方法。


    这些物料的清单，每一家企业做的都差不多，


    如果企业内部没有懂行的人，或是管理团队缺乏这方面的敏感性，最好交给可信的专业团队来处理。如果管理团队对相关专业的作品集的判断也有困难（其实管理层觉得判断起来有困难是好事，说明至少你知道你不知道，这远好过你不知道你不知道），可以在自己的朋友圈子里找这方面相对懂行的朋友帮忙选择专业制作公司。虽然管理层完全不懂这些的企业，一般说来，没必要在这些物料的制作上假装公司的品位有多么好，但从另一方面，如果因为不懂这些，导致选错了制作公司，很有可能在现场拿出一堆极为丑陋和恶劣的东西，影响企业的形象。


    ## 5. 发布会的主持人


    对于非网红、非相声演员、非脱口秀明星创业的公司来说，


    就像令人难堪的婚礼，令人想笑又不能笑的葬礼一样，企业发布会上几乎一定会出现的各种各样的尴尬：比如领导说蠢话导致的尴尬；比如员工当众拍马屁导致的尴尬；比如嘉宾不得体导致的尴尬；比如各种原因导致长时间冷场时的尴尬；比如媒体提问时管理层答不出来顾左右而言他的尴尬……一个优秀的、专业的主持人，能最大程度地解决，或至少是明显地改善这些尴尬场面。


    当然，如果你找错了主持人，他会让这些尴尬的程度通通翻两倍。


    罗永浩


    好，以上就是今天我和你分享的干货日记，欢迎你写下听完之后的感想留言，我们在留言区里一起交流。


    我是老罗，感谢你把我的干货日记分享给你的朋友们。我们明天见。


    ![](img/3f2553c19e3d8036724ac589070714e0_66_0.png)


    场或公关部门的人去现场监督就可以了。


    再一次提醒，如果自己公司里没有有执行的人，就要在朋友圈里找些靠谱的有朋友帮忙监督。这里所请的专业公司不专业，或不老实，是普遍存在的现象。


    搭建结束后，所有需要在发布会上演讲或登台参与仪式的公司管理层和所有相关人员，包括邀请的主持人，都要去现场彩排。


    如果时间允许，能走两三遍当然更好。至于需要在发布会上做主要演讲的人，彩排个七八遍也不过分。很多事件型的发布会，走完好让媒体感觉产品就算完成的任务了。但如果是消费类，产品或服务的发布会，给现场观众和媒体造成良好印象是至重要的，在这种情下，充分的彩排是绝对必要的。


    ## 3. 现场时工作人员的培训


    如果是规模较大的发布会，现场会有很多引导观众入座或是解答疑问的临时工作场然很场馆方有代为安排募集招，但我们多年的经验是，企业


    现场观众遭遇态度恶劣的或不耐心或是不足够友善的工作人员，一定会对举办发布会的企业产生不良印象。


    ## 4. 发布会当天的整个流程


    - 开场前嘉宾签到，媒体签到，必要时也可以做一个在背景墙上签字并合影留念的环节。但这个环节，通常在现场来很多在社会上有知名或影响力的人物时才会采用，否则会显得有些怪。

    - 主持人开场并介绍整个发布会流程。如果事先有制作烘托气氛的开场宣传片，效果会比较好，至少一个尝试烘托气氛的宣传片，会让现场来的人尝试去配合。如果没有这样的宣传片，则也需要专业的主持人开讲一些适当幽默的开场内容来烘托气氛。如果发布会邀请到了有分量的嘉宾，企业通常会自己主持人开场点到他们的名，以示自己有关系，有影响力，有朋友，有实力等等。


    需要说明的是，以上的流程都是企业发布会的常规合理流程，如果你的企业有一些明显不同于其他企业的地方，使得上述流程可以变得没有必要，当然完全可以按照自身的点来相应安排。比如锤子科技的发布会，就从来没有上述的流程。


    接下来是企业负责人或高管的主题演讲，通常这是发布会活动最重要的主菜，一定要要讲准备，认真排练。职业的演讲者，会为一个小时的演讲准备一百个小时，企业负责人没有那么多时间，或者说这件事对该企业没有那重要，通常情况下也得准备十几二十个小时的时间。除非是天才，否则企业负责人看起来从容淡定，气利索的，挥洒自如的，在观众和体面前为企业严肃加分的演讲，都是花了大气认真准备，反复排练的最终结果。


    顺便说一下，这些年，整个商业世界都受了乔布斯的点，一窝蜂地由企业始人或CEO站出来做产品发布会的主题演讲。包括很多完全不具备正常人演讲能力，甚至普通话比外语还难懂的CEO。其实这是完全没有必要的，如果CEO能够讲当然好，如果CEO做不到不脱，安排企业里外形好，口才佳的高管讲话也是没有问题的，如果该高管是CMO或市场总经之类，就更合适不过了。


    无论是创公司请来重量级公司的负责人站台帮场，还是公司CEO来重量级战略合作伙伴推捧，让这种商业领域的重要人物上台几句话，对发布会起拉动本的效果一定是加分的。只是安排这类环节时，得得对方过于随意的发挥导致现场效果出现意外或尴尬。


    无论如何，来自企业负责人的演讲本身是内容效果最好，如做不到，播放个事先准备好的高质量视频也可以，实在不行，做一个戏剧性的仪式高潮设计法。比如，所谓在百度图片就是搜索的一种做法，你可以在度图片里输“发布会”和“启动仪式”两个关键词搜看，看看了不要笑，记得我们前面说过的：人类需要仪式。


    最后，管你是真的还是虚伪的（当然，真的永远更有力量），技术上，比如，你这会主题，是去赚外国人的钱，升华的果是：“我们要把民族产业和民族牌走向国际化”，听起来很好吧？再比如，你的企业在城镇的业绩已经接近饱和，很多人不增长，于是决定赚乡下人的钱，升华的果是：“我们要服务好被科技和产业遗忘的六亿同胞”，大概是这一类感觉。


    如果是事件型的发布会，活动结束请媒体发稿就差不多了，这类事件会一段时。如果是消费类发布，发布会的结束，意味着市场公共和销售部长达半年到一年的长征才刚开始。


    我在文稿的结尾为你准备了你可能需要的一些资料，如锤子科技历的倒计时海报、历年的现场物料和现场的大致示意图片、历年的现场宣传视频以及完整的动会筹备流程图、内容筹备流程图和现动流程图，记得有空时看看。


