    # 第12篇｜创业要避开三大坑之二：回避自身短板带来的缺陷


    ![图片](img/3f2553c19e3d8036724ac589070714e0_44_0.png)


    欢迎来到我的干货日记，你好，我是老罗，罗永浩，今天我们要讨论的话题是创业过程中容易掉进去那些坑中的第二段，也就是对自身短板的认知不足或有意无意地回避。


    一般来说，一个足够优秀的创业团队，对创业初期自身的自我认知能力和反省能力通常是不会有什么特别问题的，但是实践中由于有些短板在既定的时间内没有得到很好的解决，所以我们从人性的角度会有意无意地使自己忙于那些擅长的事情，回避自身短板可能带来的这种缺陷。


    ## 切记：招揽人才是首要任务


    以我自身的经历为例，我一直都有轻度的社交恐惧，这个问题带来的是我们有了人力资源的资深主管之后，虽然普通过的基层员工的招聘，她是胜任有余的，但是对于那些高级人才或管理层人才的招聘，原则上任何企业的创始人都是必须要亲自去做的，但是在这些事情上，我投入的精力严重不足，可能提前几个月甚至半年前我们就发现某一重要岗位缺失，但一直被我有意识地回避，导致到了重大的业务转型的时候，关键岗位的负责人没有到位，所以出现了一系列的严重问题。


    实际上今天回顾我们整个创业的历程的话，我会发现我们的第一款产品-smartisan T1发布的时候，整个手机行业的专业人士看到产品以后感到非常惊讶，从起初认为是一个相声演员跑到科技圈来忽悠，转为意识到我是一个非常用心、非常专注为尝试打造不一样的优秀产品的这么一个人。我后来认识的很多圈内的朋友也承认，当时他们也互相打听听说认识这个老罗，大家跟这个好玩的人认识一下、交个朋友但是，但是在那样的一个时期，尽管有一些人中间人给我推荐认识这个领域里的很多资深的专业人士、负责人和高管，但是由于我社交恐惧方面的心理问题，在T1发布后非常好的时机里，没有出去尝试跟手机圈的更多人结交朋友，导致后期我们出现的信息断的时侯，由于缺乏这方面的人脉，使得很多本来可以轻松解决的事情，都成了我们的重大隐患。


    2015年秋天坚果手机发布之后，后续发生了一系列的疲意不堪的事情，使得我在入冬的时侯生了一场重病病倒了。当时的状况是，由于每天的的工作放不下，我在会议室里放了一床行军床，每天上班躺在床上盖着被子要开5~6轮的各种部门的会议。连续开了两三天之后，我一个合伙人忧心忡忡地晚上过来找我，他说这三天每天你都会在会议室里躺在床上跟各部门的主管开会，从早开到晚，在我看来等于给下面的这些孩子你传递了一个非常不好的信息，这个企业管理上糟糕到了什么程度，以至于CEO生了重病以后一天都不能休息，需要躺在床上每天跟好几拨的人家交流沟通，甚至说，这个公司不健康到了CEO休一天都会出事。如果你传递了这样的信息，我觉得还不如在家里索性好像休息几天，这几天无论你耽误了多少工作，都不会让企业倒闭的。


    他进一步补先说，我连看了两三天，越看感觉越奇怪，我就觉得好像下一步我就要躺在病床上了，满脸憔悴地从后边夹出来一个孤儿像床上两个家庭，然后搞得我孤立了，告诉我们照顾好你的老婆孩子什么的，我产生了这种严重的滑稽的感觉。


    坦率地讲，我在病床上忙的这几天，甚至没有意识到我在干这么一个事情，他说完以后，我觉得非常有道理，所以不管当时业务是什么情况，我硬忍着接下来的五六天没有去公司，每天在家躺着，吃了药多睡觉，醒了就去整理思路、换换脑子去看到底出了哪些问题。思考的结论就是说，由于前面提到过的社交恐惧方面的问题，我们在有充分的时间去结交圈内的这些人脉和朋友的情况下，我完全没有去做这个事情。所以病好了之后，我在后续的调整里差不多用了将近一年左右的时间，把40%多、50%这样的精力全部用于结交这个圈子里的人脉，很快就结交了很多朋友，这里面包括一些后来成为我们战略合作伙伴的公司高管，也包括我们智镜合作的一些技术团队和一些关键缺失岗位的这些高管的人，都是在那个时期认识的。


    虽然，这件事，在我创业的第一天就很清楚的知道，但是由于这些人性的弱点，我有意无意地去回避这个事情，直到给我造成了重大的灾难的后果之后，才尝试去调整。我相信在这些方面，不是每个人处理的都像我们这么糟糕，我当时如果动手早半年也会好很多。


    ## 今日得到


    - 如果你将来创业的话，一定要知道越是自己害怕越要回避去做的事情，越需要真正有意识地提醒自己把它先做掉。

    - 那些真正优秀的人，都不喜去做自己害怕做的事情，这是非常重要的一种积极态度，是面对对自身弱点和恐惧的事情的时候应有一个健康态度。


    ![图片](img/3f2553c19e3d8036724ac589070714e0_44_1.png)


