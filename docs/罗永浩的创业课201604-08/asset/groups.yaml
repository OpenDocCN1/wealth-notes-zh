  - "[PAGE 101]\n\n紧的肌肉，让竞争者知难而退，要比扎一身结实的肌肉塞在衣服里，然后辛辛苦苦地拳打脚踢击败五个竞争者来得经济。\n\n发出“我牛X”这样的装X信号的姿势貌似花样胡编，花样百出，但究其本质，其实只有三种：\n\
    \n+   1. 展示自己的优势  \n2. 假装不经意展示自己的优势  \n3. 假装无优势\n\n举个例子，晒照片秀你有一辆法拉利，是展示财富优势；晒照片秀你和一群朋友在吃饭，饭桌上，你的手边，不起眼的放着一个法拉利钥匙扣，则是假装不经意展示自己的财富优势；晒照片秀你和一辆别人的法拉利的合影，或是晒照片秀一个淘宝买来的法拉利假钥匙串不起眼的放在你的手边，是假装有财富优势。\n\
