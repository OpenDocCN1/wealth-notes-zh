    首先，不是所有的商标都能称得上视觉锤，只有那些能进入用户心智的才算。比如前面提到的钩子、三叉星和M，像这样的知名商标还有不少。但要知道的是，世界上有这么多品牌，能进人记忆的最好最著名的一小部分而已，绝大多数品牌的商标都没有完成视觉锤的任务。


    另外，视觉锤也未必就是商标。它是你的品牌在消费者心智中留下的最深刻的视觉印记。可以是商标，也可以是产品的造型、包装，可以是一张海报、一段电视广告，甚至可以是一个事件、一个代言人或创始人的形象。总之，


    比如，烟草商万宝路的视觉锤就不定它的商标。而是那些好、那些蓝天白云上，骑着马的牛仔；又如，珠宝商Tiffany的视觉锤，是它的店面和包装盒上的蓝色，不是它的商标。


    最典型的非商标视觉锤的例子，就是可口可乐的那个著名的玻璃瓶，全人类都知道的那个瓶子。


    你即使走长途旅行，甚至去掉瓶子的所有细节，只看瓶子的轮廓，也能认出那个收缩的可口可乐玻璃瓶。这个瓶子有多大呢？有了宝特瓶和易拉罐之后的今天，玻璃瓶的可口可乐销量其实并不太高。但即使是易拉罐、塑料瓶的可口可乐包装上，也都印上了那个收缩的玻璃瓶的形状。由此这张大的视觉字，把可口可乐这个非常强烈、视觉字的符号到了消费者的心智空间。这里面当然有每年好几亿美元广告费的功用——但是，可口可乐形象—本身的视觉设计—无论从形状还是颜色—也是很重要的。其他的饮料商，如果没有同样优秀的视觉形象，即便花费同样甚至更多的广告费，也难以达到这样的效果。


    我们为什么需要用视觉来实现或辅助实现定位呢？因为表达同一件事，图像形式比语言或者文字给人留下的印象深得多，也常常比文字更容易引起情感共鸣。


    1973年，心理学家莱昂内尔·斯坦坦做了一项调查研究，他请研究对象在5秒内看了10000张图片，每张图片显示5秒钟。之后，再向研究对象展示成组的图片，一张是他们见过的，一张是此前没有见过的，这时，他们能记住之前看到过的70%的图片。这个实验结果非常让人惊讶，想想看，如果给你5天内展示10000条广告口号，每条5秒钟，之后你还记得住几条呢？


    那具体如何打造视觉锤呢？视觉锤可以有很多，只要你花心思想，想给消费者留下印象的话，那么是多种多样的。形状、颜色、造型、包装等等，都可能成为有效的手段。


