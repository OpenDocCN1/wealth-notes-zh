    其次，很多公司会用内部推荐奖励吸引人才，转公司再推荐推荐另一个人进公司，转手之后会给你推荐的人一部分奖金，如果推荐的人能力很秀就会获得更高的奖金。这样做是ok的吗？还有其他什么方法吗？


    我先回答这第一个问题。我们所说的一个公司快倒了的时候，开始出现人员流失，这时候对于其他缺人才的公司的人力资源来讲是一个很好的机会，这是我们在前面的节目中探讨过。


    我们说一个公司快倒了的时候，实际上这个公司快倒了 的周期通常是三个月、六个月，甚至一年不等，然后开始陆续出现人才流失。不是 说像字面上看起来说今天说快倒了，然后下个月就倒完了，通常不是这个样子的。


    当你得知一家公司出现了这种情况的时候，只要快速搞定第一个，同一部门的基本上他是了解的非常清楚的，然后其他的情况可以通过他基本上能了解个八九不离十，比你在外面瞎打听要靠谱的多。如果你找的是该公司人力资源的员工，那基本上你可以百分之百的了解。大概是这样的。


    第二个问题是说，很多公司会用内部推荐奖励吸引人才，这样做是OK的吗？还有其他什么方法吗？这个方法我们其实在公司内部一直都是用的，一直都是非常行之有效的一种方法。很多人会以为说，在某些领域里我们是不是能想出别人从来没用过的方法，这个是没有必要的。很多传统上被很多公司沿袭使用的方法，之所以被长期沿袭下来，多半是因为它具有合理性和效果良好。


    作为创业团队的主要创始人，如何设置自己的收入才合理？在为其他创始人或新加入的核心员工设置股权激励方面，你觉得有什么地方需要特别注意？


    我觉得设置股权激励这是一个很大的话题，我们会在后面的对应的栏目里面专门详细展开，掰开揉碎了去给你讲解这方面的问题。


    我主要回答一下第一个问题，就是说创业团队的主要创始人应该如何设置自己的收入才合理。这个可能每一个企业的创始人的做法都不太一样，我就说一下我个人的做法吧。对我来讲，**企业还亏损的时候，原则上是尽量少拿，要保证有很多核心的人才或合伙人级别拿的比你多**。这样的话，无论是从情理上还是从给员工、同事、合伙人，以及投资者交代的时候，都不会有什么问题。而企业盈利的时候，我就不知道了，我们企业还没有盈利。但是
    是我们企业盈利的时候，我觉得只要不是太过分，创始人拿多少都是应该的。


