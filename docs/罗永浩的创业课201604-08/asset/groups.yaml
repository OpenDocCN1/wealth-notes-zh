    # 1、利用一切机会和场合关注接纳人才


    这方面我比较佩服的一个例子是原凤凰周刊的主编，也就是今天大象公会的创始人黄章晋老师，他是我多年的好朋友。当年我和他受邀请去网易参加一些高校的活动，我就发现一个很有意思的现象，当我们在高校的讲台上跟大学生互动的时候，你相信由于这些年轻人整体上因为年龄的关系相对比较幼稚，所以问的问题大多数比较单纯、比较幼稚，但是时不时地，你也能在现场发现有一些非常优秀的年轻人站起来跟你对话、跟你提问题，并且回答你的问题和你的流露出跟他的年龄不成比例的成熟和优秀的那种气质。一但有这种情况，我们坐在一起在台上的几位所谓老师，大家感觉这个年轻人真不错，也就仅此而已了。


    但是我们注意到黄章晋老师，只要在休息或结束的时候，是一定要去跟那些给我们造成良好印象的、貌似优秀的年轻人交换电话号码和联系方式。当时我们开玩笑管他叫“黄总统”，所以我们就取笑他说，黄总统为了将来打江山、招人人才真是不遗余力。但是后来等到我创业的时候，我就意识到我做得有多糟糕，因为黄章晋创业的时候，他的通讯录上至少有一两百个他长期以来关注并且保持一定程度联系的一两个的人才清单，所以他把他们叫过来参与自己的事业，这个要少走很多的弯路，也非常有效。


    但是我们等到自己选择去创业的时候却发现，由于早年没有有意识地去去做这样的事情，导致我们需要人才的时候，明明过去的经历里接触过很多很多的优秀年轻人，但是等到你选择去创业的时候，发现想跟他们取得联系变得千难万难。所以凡是那些有志于创业的人，一定不要不到走上创业这一步才去考虑这些，一定要未雨绸缪，去考虑，老谋深算，就像黄章晋老师一样。


    有的人说那我早年没有注意做这件事情，现在才开始注意那怎么办？其实没有什么怎么办的，你从今天开始了有这个意识，就比较没有这个意识的企业家们都要好多。


